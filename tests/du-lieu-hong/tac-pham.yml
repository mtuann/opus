    - [Nhà soạn nhạc, Ludwig van Beethoven (1770–1828)] # lỗi: năm mất khác nha-soan-nhac.yml
  hinh:
    nghe: # lỗi: bản ghi không có trang hướng dẫn nghe nào (D1.3)
      - chu_thich: Hai đoạn.
        doan:
          - [A, '', 1, a]
- slug: ballade
  loai: bai-hoc
