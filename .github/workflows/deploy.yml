name: Đăng site lên GitHub Pages

# Mỗi lần push lên main (hay bấm chạy tay): build bản thật (chỉ trang đã khóa trong kiem-dinh/khoa.json), kiểm thử; kiểm
# thử trình duyệt và Lighthouse chạy song song ở job trinh-duyet (commit đã qua test.yml ở nhánh: chỉ chromium và
# Lighthouse; xem bước "Đã kiểm ở nhánh?"). Đạt hết thì đăng dist/. Hỏng bước nào thì không đăng: site giữ bản trước.
on:
  push:
    branches: [main]
    # chỉ đổi kế hoạch, báo cáo, sổ tay hay giấy phép thì site không đổi: không cần build lại
    paths-ignore: ['plans/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE', 'LICENSE-CONTENT']
  workflow_dispatch:

# Quyền đăng Pages chỉ ở job deploy; job build (chạy npm ci, mã của gói bên thứ ba) chỉ đọc mã. Không dùng
# configure-pages: nó cần quyền đọc Pages ở job build, mà Astro đã có site và base trong astro.config.mjs.
permissions:
  contents: read

# Mỗi lúc một lần đăng; lần push sau chờ lần trước xong, để bản cũ hơn không ghi đè bản mới.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build và kiểm thử (bản thật)
    runs-on: ubuntu-latest
    # chặn đường treo (mặc định của GitHub là 6 giờ); một lần chạy thường khoảng 1 phút
    timeout-minutes: 30
    # đọc các lần chạy của test.yml (bước "Đã kiểm ở nhánh?")
    permissions:
      contents: read
      actions: read
    outputs:
      cac-phan: ${{ steps.da-kiem.outputs.cac-phan }}
    steps:
      - uses: actions/checkout@v7
        with:
          # bước "Đã kiểm ở nhánh?" so commit này với commit trước trên main (github.event.before): cần đủ lịch sử
          fetch-depth: 0
      - uses: ./.github/actions/kiem-thu
        with:
          ban: that
          phan: npm-test
      # Lô gộp vào main kiểu fast-forward: commit này đã qua test.yml ở nhánh (lần chạy do push hay bấm chạy tay, kiểm
      # đúng commit này; lần chạy của pull request kiểm bản gộp nên không tính) với bản xem. Bản thật dựng khác bản xem
      # (link tới trang chưa khóa thành "sắp có", nút của dải mực tự ẩn, không có dải "Chưa kiểm định", trang mẫu khác),
      # nên vẫn kiểm trên Chromium (axe, hiển thị, thành phần, đủ trang mẫu) và Lighthouse; WebKit và Firefox thì:
      # - test.yml đã chạy đủ (có job webkit và firefox đạt): bỏ;
      # - test.yml chỉ chạy phần rút gọn (nhánh chỉ đổi nội dung, tools/chon-phan-ci.mjs: Chromium trên trang đã đổi): tự
      #   phân loại file đổi so với commit trước trên main; chỉ nội dung thì bỏ (không đổi mã nên ba trình duyệt cho cùng
      #   kết quả, thành phần đã kiểm ở lần đăng trước), có mã thì chạy;
      # - push thẳng lên main hay test.yml chưa đạt ở commit này: chạy đủ bốn phần; bấm chạy tay (không có commit trước để
      #   so) mà test.yml chỉ chạy rút gọn: cũng đủ.
      - name: Đã kiểm ở nhánh?
        id: da-kiem
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TRUOC: ${{ github.event.before }}
        run: |
          du='["chromium","webkit","firefox","lighthouse"]'
          gon='["chromium","lighthouse"]'
          lan=$(gh api "repos/$REPO/actions/workflows/test.yml/runs?head_sha=$SHA&status=success" \
            -q '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id | tostring] | join(" ")' || echo "")
          da_dat=0; da_du=0
          for id in $lan; do
            da_dat=1
            n=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              -q '[.jobs[] | select(.conclusion == "success") | select(.name | test("webkit|firefox"))] | length' || echo 0)
            if [ "${n:-0}" -ge 2 ]; then da_du=1; fi
          done
          if [ "$da_dat" = 0 ]; then
            echo "test.yml chưa đạt ở $SHA: chạy đủ"; p=$du
          elif [ "$da_du" = 1 ]; then
            echo "test.yml đã đạt đủ phần ở $SHA: bỏ WebKit, Firefox"; p=$gon
          else
            kieu=$(node tools/chon-phan-ci.mjs --nen "$TRUOC" --kieu)
            echo "test.yml chỉ chạy phần rút gọn ở $SHA; file đổi so với ${TRUOC:-(không có)}: $kieu"
            if [ "$kieu" = noi-dung ]; then p=$gon; else p=$du; fi
          fi
          echo "cac-phan=$p" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  trinh-duyet:
    name: Kiểm thử (bản thật, ${{ matrix.phan }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # các phần do bước "Đã kiểm ở nhánh?" chọn; đầu ra rỗng hay hỏng thì job hỏng, không đăng
        phan: ${{ fromJSON(needs.build.outputs.cac-phan) }}
    # phần lâu nhất thường khoảng 4 phút
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # tự build lại (vài giây, cùng commit nên cùng kết quả) thay vì chép dist/ từ job build
      - uses: ./.github/actions/kiem-thu
        with:
          ban: that
          phan: ${{ matrix.phan }}

  deploy:
    name: Đăng
    needs: [build, trinh-duyet]
    runs-on: ubuntu-latest
    # deploy-pages tự chờ tối đa 10 phút: để dư
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dang.outputs.page_url }}
    steps:
      - id: dang
        uses: actions/deploy-pages@v5
