name: Đăng site lên GitHub Pages

# Mỗi lần push lên main (hay bấm chạy tay): build bản thật (chỉ trang đã khóa trong kiem-dinh/khoa.json), kiểm thử, đạt
# thì đăng dist/. Hỏng bước nào thì không đăng: site giữ bản trước.
# Gọn cho đỡ phút Actions (chủ repo chọn ngày 09/11/2026; repo riêng tư tính phút theo từng job, làm tròn lên): test.yml
# chỉ chạy tay, nên đây là lần kiểm thử tự động duy nhất. Một job làm hết, không cài và build lại nhiều lần; việc chạy
# theo file đổi từ lần deploy đạt gần nhất (viecDeploy trong tools/chon-phan-ci.mjs):
# - chỉ nội dung (trang, dữ liệu, hồ sơ, bản thu): npm test và Chromium chạy song song; Chromium chỉ trên trang chủ, 404 và
#   trang đã đổi (có đổi src/data/ thì đủ trang mẫu). Không WebKit, Firefox, Lighthouse: mã không đổi so với bản đã đăng.
# - có mã (hay không có mốc): thêm Lighthouse (chạy riêng sau cùng, để đo không bị kiểm thử khác làm chậm), và WebKit,
#   Firefox ở job ba-trinh-duyet song song với nhau.
on:
  push:
    branches: [main]
    # chỉ đổi kế hoạch, báo cáo, sổ tay hay giấy phép thì site không đổi: không cần build lại
    paths-ignore: ['plans/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE', 'LICENSE-CONTENT']
  workflow_dispatch:

# Quyền đăng Pages chỉ ở job deploy; job kiem (chạy npm ci, mã của gói bên thứ ba) chỉ đọc mã.
permissions:
  contents: read

# Mỗi lúc một lần đăng. Push mới hủy lần đang chạy: chỉ bản mới nhất cần lên, đỡ phút Actions khi push liền nhau.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  kiem:
    name: Build và kiểm thử (bản thật)
    runs-on: ubuntu-latest
    # chặn đường treo (mặc định của GitHub là 6 giờ)
    timeout-minutes: 30
    # đọc lần deploy đạt gần nhất (bước "Mốc")
    permissions:
      contents: read
      actions: read
    outputs:
      ba-trinh-duyet: ${{ steps.viec.outputs.ba-trinh-duyet }}
    steps:
      - uses: actions/checkout@v7
        with:
          # so commit này với commit của lần deploy đạt gần nhất: cần đủ lịch sử
          fetch-depth: 0
      - name: Mốc và việc cần chạy
        id: viec
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          moc=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            -q '.workflow_runs[0].head_sha // ""' || echo "")
          echo "moc=$moc" >> "$GITHUB_OUTPUT"
          node tools/chon-phan-ci.mjs --deploy --nen "$moc"
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (bản thật)
        run: npm run build
      # npm test chạy kiểm thử Python của tools/audio (tests/ban-thu.test.mjs): cần Python và PyYAML
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      # Chromium của Playwright: lưu đệm theo phiên bản; thư viện hệ thống thường đã có trên máy CI, chỉ cài khi Chromium
      # không mở được (apt chậm, có lúc vài phút)
      - name: Phiên bản Playwright
        id: pw
        run: echo "phien-ban=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: luu-dem
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.phien-ban }}-chromium
      - if: steps.luu-dem.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Thư viện hệ thống cho Chromium (khi cần)
        run: |
          if node -e "require('playwright').chromium.launch().then((b) => b.close())" 2>/dev/null; then exit 0; fi
          timeout --kill-after=20s 300 npx playwright install-deps chromium
      # npm test và kiểm thử trình duyệt chạy cùng lúc; in lại nhật ký của từng phần, hỏng phần nào thì job hỏng
      - name: npm test và kiểm thử Chromium (song song)
        env:
          OPUS_TRINH_DUYET: chromium
          OPUS_CHI_TRANG_DOI: ${{ steps.viec.outputs.chi-trang-doi }}
          OPUS_NEN: ${{ steps.viec.outputs.moc }}
        run: |
          npm test > npm-test.log 2>&1 & a=$!
          npm run test:trinh-duyet > chromium.log 2>&1 & b=$!
          wait $a; ra=$?; wait $b; rb=$?
          echo "::group::npm test (thoát $ra)"; cat npm-test.log; echo "::endgroup::"
          echo "::group::Chromium (thoát $rb)"; cat chromium.log; echo "::endgroup::"
          if [ $ra -ne 0 ]; then echo "::error::npm test hỏng"; tail -40 npm-test.log; fi
          if [ $rb -ne 0 ]; then echo "::error::kiểm thử Chromium hỏng"; tail -40 chromium.log; fi
          [ $ra -eq 0 ] && [ $rb -eq 0 ]
        shell: bash
      - name: Lighthouse
        if: steps.viec.outputs.lighthouse == '1'
        run: LH_RA=lighthouse-ket-qua npm run lighthouse
      # hỏng thì giữ JSON của Lighthouse để xem lại (tab Summary của lần chạy, 14 ngày)
      - uses: actions/upload-artifact@v7
        if: failure() && steps.viec.outputs.lighthouse == '1'
        with:
          name: lighthouse-that
          path: lighthouse-ket-qua
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # chỉ khi có đổi mã từ lần deploy đạt gần nhất: WebKit và Firefox, mỗi trình duyệt một job song song
  ba-trinh-duyet:
    name: Kiểm thử (bản thật, ${{ matrix.phan }})
    needs: kiem
    if: needs.kiem.outputs.ba-trinh-duyet == '1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        phan: [webkit, firefox]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kiem-thu
        with:
          ban: that
          phan: ${{ matrix.phan }}

  deploy:
    name: Đăng
    needs: [kiem, ba-trinh-duyet]
    # ba-trinh-duyet bị bỏ (chỉ đổi nội dung) vẫn đăng; hỏng hay bị hủy thì không
    if: ${{ !cancelled() && needs.kiem.result == 'success' && (needs.ba-trinh-duyet.result == 'success' || needs.ba-trinh-duyet.result == 'skipped') }}
    runs-on: ubuntu-latest
    # deploy-pages tự chờ tối đa 10 phút: để dư
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dang.outputs.page_url }}
    steps:
      - id: dang
        uses: actions/deploy-pages@v5
