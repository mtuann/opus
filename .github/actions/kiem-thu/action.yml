name: Build và kiểm thử
description: >-
  Cài Node và các gói, build bản thật hay bản xem, chạy kiểm thử (npm test), kiểm thử trình duyệt trên ba trình duyệt
  và Lighthouse (luật 7 của kế hoạch). Dùng chung cho test.yml và deploy.yml.
inputs:
  ban:
    description: "that: bản thật (npm run build, chỉ trang đã khóa); xem: bản xem (npm run build:xem, thêm trang chưa khóa)"
    required: true
runs:
  using: composite
  steps:
    - name: Kiểm tham số
      if: inputs.ban != 'that' && inputs.ban != 'xem'
      run: echo "ban phải là that hay xem" && exit 1
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
    - name: Build (${{ inputs.ban == 'xem' && 'bản xem' || 'bản thật' }})
      run: npm run ${{ inputs.ban == 'xem' && 'build:xem' || 'build' }}
      shell: bash
    - run: npm test
      shell: bash
    # trình duyệt của Playwright: lưu đệm theo phiên bản Playwright trong package-lock.json (đỡ khoảng 2 phút mỗi lần);
    # thư viện hệ thống thì cài mỗi lần
    - name: Phiên bản Playwright
      id: pw
      run: echo "phien-ban=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@v6
      id: luu-dem
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.phien-ban }}
    - name: Cài trình duyệt cho kiểm thử trình duyệt và Lighthouse
      if: steps.luu-dem.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium webkit firefox
      shell: bash
    - name: Cài thư viện hệ thống cho trình duyệt
      if: steps.luu-dem.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium webkit firefox
      shell: bash
    - run: npm run test:trinh-duyet
      shell: bash
    - name: Lighthouse
      run: LH_RA=lighthouse-ket-qua npm run lighthouse
      shell: bash
    # hỏng thì giữ JSON của Lighthouse để xem lại (tab Summary của lần chạy, 14 ngày)
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: lighthouse-${{ inputs.ban }}
        path: lighthouse-ket-qua
        retention-days: 14
        if-no-files-found: ignore
