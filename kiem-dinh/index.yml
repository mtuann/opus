ghi_chu: >-
  Lần 2 (D2-L1): trang chủ thật thay trang chủ tạm, viết mới (tầng khung, chuan-kiem-dinh.md mục 3: không có nhận định). Giữ bố cục D1.2b (dải mực, thẻ 8 nhóm) và câu thông báo của kế hoạch; thêm: nút "Bắt đầu từ số 0" (Bài 0) và "Đã biết chơi" (kiểm tra đầu vào) ở dải mực; link sang bản cũ Opus Zero trong lúc chưa chuyển hết bài (review cuối đợt 1); ba lối vào theo người đọc như trang chủ cũ (các bước chỉ là link tới trang, không có số liệu); sơ đồ 7 chặng sinh từ cap-do.yml (::hinh{ten="lo-trinh"}); thẻ 8 nhóm dẫn tới trang mở đầu của nhóm (src/nhom.mjs, chưa lên thì "sắp có"); mô tả nhóm Đọc thêm bỏ chữ opera; mục "Hôm nay tập gì?" có ô gợi ý tập (::cong-cu{ten="goi-y-tap"}, như khối "Hôm nay" của trang chủ cũ): người chưa có kết quả thấy lời mời làm bài kiểm tra đầu vào; người đã lưu chặng piano hay kết quả nhạc lý (trong trình duyệt) thấy chặng của mình và bài nên bắt đầu, chọn theo goi_y và chang của dữ liệu đã khóa (chiDaKhoa), và mục được đưa lên trước các lối vào. Lần 1: trang chủ tạm (D1.1, D1.2b), viết mới, không chuyển từ trang chủ cũ.
