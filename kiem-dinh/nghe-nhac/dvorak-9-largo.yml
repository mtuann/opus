  - id: n9
    cau: Dvořák nghe spiritual qua ca sĩ Harry T. Burleigh và tìm hiểu một số giai điệu của người bản địa.
    loai: lich-su
    nguon:
      - dv-work
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "những thứ ông được nghe và tìm hiểu ở đó". antonin-dvorak.cz: ông biết spiritual nhờ Burleigh; với nhạc bản địa, ông "carefully studied a certain number of Indian melodies which a friend gave me", còn việc ông nghe nhạc bản địa ở Mỹ trước khi viết thì không chắc (buổi diễn Buffalo Bill là năm 1894). Viết cụ thể theo nguồn. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu. Nguồn của lượt 2 cho vế người bản địa là trang khóa học St. Olaf dẫn New York Herald (15/12/1893); nguồn của lượt 1 (antonin-dvorak.cz) dẫn lời Dvořák "carefully studied a certain number of Indian melodies which a friend gave me". Hai nguồn cùng ý, câu không nói hơn. Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.kennedy-center.org/globalassets/nso/recordings/dvorak-copland-program-notes.pdf", "https://pages.stolaf.edu/americanmusic/2017/09/26/dvorak-and-the-spirit-of-indian-music/" ]
    luot_2_ghi_chu: "Ghi chú NSO (Kennedy Center): 'Harry Burleigh, who exposed Dvořák to a range of African-American spirituals'. Trang St. Olaf (dẫn New York Herald 15/12/1893): Dvořák 'studied Indian melodies that a friend gave to him'. Nguồn thứ hai là trang khóa học đại học dẫn báo gốc; nên thêm nguồn tốt hơn nếu có."
    review: dung
  - id: n10
    cau: Trong Giao hưởng số 9, những nét nhạc gợi chất Mỹ đan xen với nét nhạc Séc quen thuộc của Dvořák.
