    luot_2_ghi_chu: "IMSLP: Goin' Home, William Arms Fisher, 1922 (Ditson), soạn từ Largo. Fisher (Phonograph Monthly Review 1927): 'my good fortune to study composition and orchestration with Dvorak for two years' ở Nhạc viện Quốc gia New York. Baker's (encyclopedia.com): 'When Dvořák went to N.Y. in 1892, Fisher became his pupil'."
