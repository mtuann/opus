    luot_2_ghi_chu: "NSO: ảnh hưởng nguồn Mỹ bản địa và Mỹ gốc Phi, 'the composer's characteristic Bohemian flavors also pervade this score'. Cleveland: 'Informed by African American spirituals, Indigenous melodies, and Czech folk songs'."
