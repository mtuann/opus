  - id: n14
    cau: 'Theo dõi, Mở đầu: kèn gỗ và kèn đồng chơi chuỗi hợp âm chậm, bắt đầu rất nhỏ rồi to dần, mở bằng hợp âm Mi trưởng (nối với giọng Mi của chương 1) và dừng ở Rê♭ trưởng.'
    loai: cau-truc
    nguon:
      - simrock-dv
      - dv-work
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kèn đồng và kèn gỗ chơi chuỗi hợp âm chậm, trang nghiêm, đưa nhạc từ Mi thứ (chương 1) sang Rê♭ trưởng". Bản Simrock tr. 28: clarinet, bassoon, horn, trumpet, trombone, tuba ppp (pp), to dần tới f dim. ở ô 4; antonin-dvorak.cz: hợp âm đầu Mi trưởng nối với cuối chương 1 (Mi thứ), kết ở Rê♭ trưởng. Bỏ "trang nghiêm" (lời đánh giá). Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu. Hai lượt cùng đọc tổng phổ Simrock (đối chiếu bằng mắt) và khớp nhau: nhạc cụ, ppp/pp, cresc. tới f dim., hợp âm Mi trưởng mở, dừng ở Rê♭ trưởng.'
