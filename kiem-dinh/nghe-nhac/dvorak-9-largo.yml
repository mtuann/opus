doi_chu:
- cu: 'Năm 1892, Dvořák, nhà soạn nhạc Séc nổi tiếng, sang Mỹ làm giám đốc Nhạc viện Quốc gia ở New York. Ông tin rằng nước Mỹ nên tìm "giọng nói âm nhạc" của mình từ những ca khúc tâm linh (spiritual) của người Mỹ gốc Phi và âm nhạc của người bản địa, những thứ ông được nghe và tìm hiểu ở đó. Giao hưởng số 9 là "lá thư" từ Thế giới mới gửi về: chất liệu Mỹ hòa với nỗi nhớ quê hương Bohemia.'
  moi: 'Năm 1892, Dvořák, nhà soạn nhạc Séc nổi tiếng, sang Mỹ làm giám đốc Nhạc viện Quốc gia ở New York. Ông tin rằng nước Mỹ nên tìm "giọng nói âm nhạc" của mình từ những ca khúc tâm linh (spiritual) của người Mỹ gốc Phi và âm nhạc của người bản địa: ông nghe spiritual qua ca sĩ Harry T. Burleigh và tìm hiểu một số giai điệu của người bản địa. Trong Giao hưởng số 9, những nét nhạc gợi chất Mỹ đan xen với nét nhạc Séc quen thuộc của Dvořák.'
  ly_do: 'n9, n10, n11, n13: antonin-dvorak.cz (trang tác phẩm), IMSLP (Goin'' Home), tổng phổ Simrock.'
- cu: 'Hát (ngân nga) chủ đề chính: bạn có thấy nó chỉ dùng 5 nốt không?'
  moi: 'Hát (ngân nga) câu đầu của chủ đề chính: bạn có thấy nó chỉ dùng vài nốt của gam ngũ cung, không có quãng nửa cung nào không?'
  ly_do: 'n21: trang nhac-cu/dan-nhac chỉ nói oboe; n22: câu đầu chủ đề chỉ có 4 nốt ngũ cung (tổng phổ Simrock).'
- cu: null
  moi: Giai điệu chính của chương 2 mang đậm nét ngũ cung (xem bài 16), giản dị như một bài hát. Năm 1922, William Arms Fisher, một học trò cũ của Dvořák ở Mỹ, đặt lời cho giai điệu này thành ca khúc Goin' Home.
  ly_do: 'n9, n10, n11, n13: antonin-dvorak.cz (trang tác phẩm), IMSLP (Goin'' Home), tổng phổ Simrock.'
- cu: Giai điệu chính của chương 2 dùng gam ngũ cung (xem bài 16), nên nghe giản dị như một bài dân ca. Nó giống dân ca đến mức năm 1922, một học trò cũ của Dvořák đặt lời cho nó thành ca khúc Goin' Home, và nhiều người tưởng đó là một spiritual cổ.
  moi: null
  ly_do: 'n9, n10, n11, n13: antonin-dvorak.cz (trang tác phẩm), IMSLP (Goin'' Home), tổng phổ Simrock.'
- cu: Kèn đồng và kèn gỗ chơi chuỗi hợp âm chậm, trang nghiêm, đưa nhạc từ Mi thứ (chương 1) sang Rê♭ trưởng
  moi: 'Kèn gỗ và kèn đồng chơi chuỗi hợp âm chậm, bắt đầu rất nhỏ rồi to dần: mở bằng hợp âm Mi trưởng (nối với giọng Mi của chương 1) và dừng ở Rê♭ trưởng'
  ly_do: 'n14, n15, n17, n18, n19: tổng phổ Simrock (bản Royal Academy of Music), antonin-dvorak.cz.'
- cu: Cor anglais (kèn oboe trầm) hát giai điệu ngũ cung nổi tiếng trên nền đàn dây pianissimo
  moi: Cor anglais (kèn oboe trầm) hát giai điệu ngũ cung nổi tiếng trên nền đàn dây chơi rất nhỏ, có lắp hộp tắt tiếng (con sordino)
  ly_do: 'n14, n15, n17, n18, n19: tổng phổ Simrock (bản Royal Academy of Music), antonin-dvorak.cz.'
- cu: Chuyển sang Đô♯ thứ, sáo và oboe hát một giai điệu mới buồn hơn, tiết tấu nặng nề như bước chân
  moi: 'Chuyển sang Đô♯ thứ, nhanh hơn một chút: sáo và oboe hát một giai điệu mới buồn hơn; sau đó clarinet hát trên những nốt contrabass gảy đều đều như bước chân'
  ly_do: 'n14, n15, n17, n18, n19: tổng phổ Simrock (bản Royal Academy of Music), antonin-dvorak.cz.'
- cu: Nhạc bỗng sáng, kèn gỗ líu lo như tiếng chim, cao trào ngắn; các chủ đề của chương 1 vang lại ở kèn đồng
  moi: Chuyển sang Đô♯ trưởng, kèn gỗ láy (trill) líu lo như tiếng chim; cao trào ngắn, kèn đồng chơi to, chủ đề của chương 2 và các chủ đề của chương 1 cùng vang lên
  ly_do: 'n14, n15, n17, n18, n19: tổng phổ Simrock (bản Royal Academy of Music), antonin-dvorak.cz.'
- cu: Cor anglais hát lại chủ đề chính, ngắt quãng, rồi đàn dây độc tấu (chỉ vài người) tiếp lời
  moi: Cor anglais hát lại chủ đề chính, ngắt quãng; đàn dây chỉ còn vài người chơi, có chỗ độc tấu, tiếp lời
  ly_do: 'n14, n15, n17, n18, n19: tổng phổ Simrock (bản Royal Academy of Music), antonin-dvorak.cz.'
