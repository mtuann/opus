    moi: Giai điệu chính của chương 2 mang đậm nét ngũ cung (xem bài 16), giản dị như một bài hát. Năm 1922, William Arms Fisher, một học trò cũ của Dvořák ở Mỹ, đặt lời cho giai điệu này thành ca khúc Goin' Home.
    ly_do: 'n9, n10, n11, n13: antonin-dvorak.cz (trang tác phẩm), IMSLP (Goin'' Home), tổng phổ Simrock.'
