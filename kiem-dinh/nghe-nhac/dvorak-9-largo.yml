- cu: 'Tổng phổ: IMSLP (tìm "Dvořák Op.95").'
  moi:
  - 'Tổng phổ: bản Simrock (Berlin), bản quét của Thư viện Học viện Âm nhạc Hoàng gia London trên Internet Archive; IMSLP.'
  - 'Lịch sử: trang tác phẩm và tiểu sử trên antonin-dvorak.cz.'
  ly_do: 'n25: thay link tìm kiếm bằng nguồn đã đọc.'
