doi_chu:
  - cu: 'Năm 1892, Dvořák, nhà soạn nhạc Séc nổi tiếng, sang Mỹ làm giám đốc Nhạc viện Quốc gia ở New York. Ông tin rằng nước Mỹ nên tìm "giọng nói âm nhạc" của mình từ những ca khúc tâm linh (spiritual) của người Mỹ gốc Phi và âm nhạc của người bản địa, những thứ ông được nghe và tìm hiểu ở đó. Giao hưởng số 9 là "lá thư" từ Thế giới mới gửi về: chất liệu Mỹ hòa với nỗi nhớ quê hương Bohemia.'
    moi: 'Năm 1892, Dvořák, nhà soạn nhạc Séc nổi tiếng, sang Mỹ làm giám đốc Nhạc viện Quốc gia ở New York. Ông tin rằng nước Mỹ nên tìm "giọng nói âm nhạc" của mình từ những ca khúc tâm linh (spiritual) của người Mỹ gốc Phi và âm nhạc của người bản địa: ông nghe spiritual qua ca sĩ Harry T. Burleigh và tìm hiểu một số giai điệu của người bản địa. Trong Giao hưởng số 9, những nét nhạc gợi chất Mỹ đan xen với nét nhạc Séc quen thuộc của Dvořák.'
    ly_do: 'n9, n10, n11, n13: antonin-dvorak.cz (trang tác phẩm), IMSLP (Goin'' Home), tổng phổ Simrock.'
  - cu: 'Hát (ngân nga) chủ đề chính: bạn có thấy nó chỉ dùng 5 nốt không?'
