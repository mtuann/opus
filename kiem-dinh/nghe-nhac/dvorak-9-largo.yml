ghi_chu: 'Hướng dẫn nghe Giao hưởng số 9 "Từ Thế giới mới", chương 2 (tầng Tác phẩm; bản ghi tac-pham/dvorak-9-largo; loai: nghe là cấu trúc). Không có khối abc. ::hinh-cau-truc dựng từ hinh.nghe của bản ghi: chữ trong hình kiểm ở hồ sơ bản ghi (du-lieu/tac-pham/dvorak-9-largo lần 2). ::khoi-nghe không có bản thu (không sửa). Bản nhạc: tổng phổ Simrock (số bản in 10139) của thư viện Royal Academy of Music trên Internet Archive (13836-3001), đọc ảnh tr. 28–37. Lịch sử: antonin-dvorak.cz (trang tác phẩm, tiểu sử), IMSLP. Sửa trang: n9–n11, n13–n15, n17–n19, n21, n22, n25. Câu ở hồ sơ khác trỏ tới trang này: piano/10-bai-dau-tien n88 (hướng dẫn nghe Dvořák, chương 2 Largo; khớp n81: Rê♭ trưởng, 1893): vẫn đúng; lich-su/thoi-ky/lang-man n37, lich-su/nha-soan-nhac s5, nhan-dien/dau-van-tay n52: trang vẫn nói về Giao hưởng số 9, chương Largo. Thuật ngữ chưa có trong thuat-ngu.yml: cor anglais, spiritual (con sordino, pizzicato, trill đã có).'
