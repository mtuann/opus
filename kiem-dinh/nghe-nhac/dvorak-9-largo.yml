    ten: 'antonin-dvorak.cz, trang tác phẩm Symphony No. 9 in E minor, Op. 95, B178: "Date of composition 10 January – 24 May 1893"; "Premiere … 16 December 1893, New York … New York Philharmonic Society, conductor Anton Seidl"; "The symphony was to prove the composer’s theory of the possibility of using characteristic elements of African American and Native American music…"; spiritual qua "Harry T. Burleigh"; "I carefully studied a certain number of Indian melodies which a friend gave me"; "“Negro” and “Indian” motifs are interwoven with “Czech” (or, simply, Dvořákian) motifs"; "The second movement (Largo) begins with a remarkable harmonic succession of chords in the wind instruments (E major – … – D flat major)"; "the opening chord of E major emphasises continuity with the close of the previous movement, which ends in E minor"; "a broad, sublimely simple melody delivered by the cor anglais, set against a backdrop of sordini strings"; "intensifying the pentatonic character of the melody"; "a passage in C sharp minor … a kind of funeral march above regular pizzicato steps in the basses. There then follows a quasi-scherzo segment in C sharp major, whose dynamic climax incorporates … the Largo theme, the main theme of the first movement, and the closing theme of the first movement"; chương 4: "the main themes from the second, third and fourth movements", coda "including the opening chords of the Largo"; "Goin’ Home, created in 1922 by Dvořák’s erstwhile American student, William Arms Fisher (1861–1948)"; New York Herald 17/12/1893: "played at the second Philharmonic rehearsal in Carnegie Music Hall"'
