doi_chu:
  - cu:
      - 'Brahms là nhà soạn nhạc Lãng mạn nhìn về quá khứ hơn ai hết: ông nghiên cứu sâu nhạc Bach, Handel, nhạc Phục hưng. Chương cuối Giao hưởng số 4 là minh chứng: một passacaglia (hay chaconne), hình thức Baroque gồm một chủ đề 8 ô nhịp lặp lại liên tục, với biến tấu mới ở mỗi lần (xem Chủ đề và biến tấu).'
      - Chủ đề 8 ô nhịp được Brahms phỏng theo bè trầm trong chaconne kết thúc cantata BWV 150 của Bach. Từ chủ đề đó, Brahms viết 30 biến tấu và một coda. Mỗi biến tấu dài đúng 8 ô nhịp, vậy mà âm nhạc không hề đơn điệu.
    moi:
      - 'Brahms là nhà soạn nhạc Lãng mạn quan tâm sâu tới âm nhạc quá khứ: ông học đối âm và nghiên cứu nhạc Bach. Chương cuối Giao hưởng số 4 là ví dụ nổi tiếng nhất: một passacaglia (hay chaconne), hình thức Baroque gồm một chủ đề ngắn (ở đây 8 ô nhịp) lặp lại liên tục, với biến tấu mới ở mỗi lần (xem Chủ đề và biến tấu).'
      - Chủ đề 8 ô nhịp được Brahms phỏng theo chaconne ở hợp xướng kết thúc cantata BWV 150 của Bach. Từ chủ đề đó, Brahms viết 30 biến tấu và một coda. Mỗi biến tấu dài đúng 8 ô nhịp, vậy mà âm nhạc không hề đơn điệu.
    ly_do: 'n7, n8: Baker’s Biographical Dictionary (mục Brahms). n7, n8, n9, n11: Baker’s; COD (chaconne); lời tựa Henle HN 9856; Brahms-Institut Lübeck.'
