ghi_chu: 'Hướng dẫn nghe Giao hưởng số 4, chương 4 (tầng Tác phẩm; bản ghi tac-pham/brahms-4; loai: nghe là cấu trúc). Không có khối abc. ::hinh-cau-truc dựng từ hinh.nghe của bản ghi: chữ trong hình kiểm ở hồ sơ bản ghi (du-lieu/tac-pham/brahms-4 lần 2). ::khoi-nghe không có bản thu (không sửa). Bản nhạc: bản in đầu tiên Simrock 1886 (Partitur, số bản in 8686) do Brahms-Institut Lübeck số hóa (CC0), đọc ảnh qua IIIF; bản piano bốn tay của Brahms (IMSLP trên Internet Archive) chỉ dùng tra cứu. Lịch sử: lời tựa Henle HN 9856 (cùng bản ở Breitkopf PB 16103), Brahms-Institut, tờ chương trình 25/10/1885. Sửa trang: n7–n9, n11, n14, n16–n22, n27 và mô tả trang. Câu ở hồ sơ khác trỏ tới trang này: hinh-thuc/bien-tau n12 (chương 4 là passacaglia, chủ đề lặp, biến tấu: vẫn đúng); nhan-dien/dau-van-tay n52, lich-su/nha-soan-nhac s5, lich-su/thoi-ky/lang-man n37 (trang nói về Giao hưởng số 4 của Brahms, viết 1885: vẫn đúng). Thuật ngữ chưa có trong thuat-ngu.yml: passacaglia, chaconne, ostinato (coda, pizzicato, espressivo đã có).'
nguon:
  - id: simrock-1886
    bac: 1
    ten: 'Brahms, Vierte Symphonie (E moll) Op. 98, Partitur, N. Simrock, Berlin 1886 (bản in đầu tiên, số bản in 8686), bản số hóa của Brahms-Institut Lübeck (ABH 1.7.6.315a, CC0); đọc ảnh IIIF 06/11/2026: chương 4 tr. 77–113'
    link: 'https://www.brahms-portal.de/objekt/dc00008360/'
  - id: prog-1885
    bac: 1
    ten: 'Tờ chương trình buổi hòa nhạc thứ ba của Herzogliche Hofkapelle, Meiningen, Chủ nhật 25/10/1885 (Brahms-Institut Lübeck ABH 1.7.5.110): "Johannes Brahms: Zum ersten Male überhaupt: Vierte Sinfonie, E-moll (1885) … Unter persönlicher Leitung des Meisters"'
    link: 'https://www.brahms-portal.de/objekt/dc00002291/'
  - id: henle-9856
    bac: 2
    ten: 'G. Henle Verlag, Brahms Symphony no. 4 e minor op. 98, HN 9856, lời tựa (Robert Pascall, 2012; PDF): "Spitta sent … a copy of J. S. Bach’s Cantata No. 150 … its closing chorus, a chaconne"; "first and second movements … summer stay in Mürzzuschlag in 1884, while the fourth movement and … the third were written there in the summer of 1885"; "The première … took place on Sunday, 25 October 1885, in the Ducal Court Theatre Meiningen … “under the personal direction of the Master” – as the programme-handbill has it"'
    link: 'https://www.henle.de/media/83/a6/c0/1697725877/9856-1697725877-sync.pdf'
  - id: bi-werk
    bac: 2
    ten: 'Brahms-Institut Lübeck, Brahms-Portal, Werkeinführung "Sinfonie Nr. 4 e-Moll" (đọc qua LIDO): Brahms dùng chuỗi hòa âm của Ciaccona trong hợp xướng kết "Meine Tage in den Leiden" của BWV 150 làm "achttaktiges melodisches Ostinato"; "Dort erklingt es gleich zu Beginn in den Flöten, Oboe 1 und Posaune 1, bevor es als Ostinato der Passacaglia … in mehr als 30 verschiedenen Iterationen den Sinfoniesatz fundiert"; ostinato đặt "als obere, mittlere oder untere Stimme"; chương 1–2 mùa hè 1884, chương 3–4 mùa hè 1885 ở Mürzzuschlag'
    link: 'https://www.brahms-portal.de/werk/dc00007469/'
  - id: imslp-98
    bac: 2
    ten: 'IMSLP, Symphony No.4, Op.98 (wikitext qua api.php, 06/11/2026): "Key=e"; chương 4 "Allegro energico e passionato"; "Year/Date of Composition=1884–85"; "First Performance=1885-10-25 Meiningen"; "Piece Style=Romantic"; "3 trombones"'
    link: 'https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)'
  - id: bnf-brahms
    bac: 2
    ten: data.bnf.fr, Johannes Brahms (1833-1897)
    link: 'https://data.bnf.fr/ark:/12148/cb13891799w'
  - id: bakers-brahms
    bac: 2
    ten: 'Baker’s Biographical Dictionary of Musicians, mục Brahms (Encyclopedia.com): Marxsen "encouraged him to pursue intensive studies in the music of Bach and Beethoven"; "The 1850s were also marked by intense interest in the music of the past (including a course of study in counterpoint)—a historicist tendency … most famously expressed later by his dramatic use of the Baroque passacaglia form for the last movement of his Symphony no. 4"'
    link: 'https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/johannes-brahms'
  - id: cod-chaconne
    bac: 2
    ten: 'Concise Oxford Dictionary of Music, mục chaconne (Encyclopedia.com): "A musical form almost indistinguishable from passacaglia. Both were orig. dances of 3-in-a-measure rhythm, and the mus. of both was erected on a ground bass. In some specimens this bass theme passes into an upper part … the finale of Brahms’s Sym. No.4 (usually called a passacaglia)"'
    link: 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/chaconne'
  - id: burkhardt-1912
    bac: 2
    ten: 'Max Burkhardt, Johannes Brahms: ein Führer durch seine Werke (Berlin, Globus, 1912), Internet Archive (johannesbrahmsei00burk), mục Vierter Satz: "eine Chaconne mit 32 Veränderungen"; chủ đề "von allen Blasinstrumenten"; "Holzbläser erheben ihre bittenden Stimmen …, feierliche Posaunenakkorde"'
    link: 'https://archive.org/details/johannesbrahmsei00burk'
  - id: mb-b4
    bac: 2
    ten: 'MusicBrainz, bản thu chương 4 Giao hưởng số 4 của Brahms (tìm 06/11/2026): 9:31–11:01 (Solti/Chicago 10:18, Colin Davis/BRSO 10:20, Asher Fisch 9:52…)'
    link: 'https://musicbrainz.org/recording/48cc11f8-a022-4d73-a43f-bc4515507639'
  - id: imslp-b5
    bac: 2
    ten: 'IMSLP, Symphony No.5, Op.67 (Beethoven), wikitext: "Allegro con brio (c, 502 bars) … Allegro (C, 446 bars)"'
    link: 'https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)'
  - id: fischer-men
    bac: 1
    ten: 'Mendelssohn, Concerto for violin and piano Op. 64, ed. Leopold Auer (Carl Fischer, New York, 1917), Internet Archive (concertoforvioli00mend_0): bè violin chương 1 Allegro molto appassionato một dấu thăng (Mi thứ), chương 3 Allegro molto vivace bốn dấu thăng (Mi trưởng); đọc ảnh'
    link: 'https://archive.org/details/concertoforvioli00mend_0'
