  - id: n7
    cau: 'Brahms là nhà soạn nhạc Lãng mạn quan tâm sâu tới âm nhạc quá khứ: ông học đối âm và nghiên cứu nhạc Bach.'
    loai: lich-su
    nguon:
      - bakers-brahms
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Brahms là nhà soạn nhạc Lãng mạn nhìn về quá khứ hơn ai hết: ông nghiên cứu sâu nhạc Bach, Handel, nhạc Phục hưng." Baker’s: "intensive studies in the music of Bach", "intense interest in the music of the past (including a course of study in counterpoint)". Bỏ "hơn ai hết" (so sánh không có nguồn) và "Handel, nhạc Phục hưng" (chưa tìm được nguồn bậc 2 nói cụ thể). Sửa cả mô tả trang. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://josephjoachim.com/2014/01/05/moritz-hauptmann-j-o-och-im-canon/", "https://bach-cantatas.com/Arran/OT-Brahms.htm", "https://www.bso.org/works/brahms-symphony-no-4" ]
    luot_2_ghi_chu: "Trang Joseph Joachim (dẫn Ellinwood): Brahms và Joachim trao đổi bài tập đối âm từ thư 26/2/1856. Bach-cantatas: Brahms 'has recourse to elements of more ancient music', dùng chủ đề Bach; BSO: Brahms lấy Chaconne của Bach làm mẫu."
    review: dung
  - id: n8
    cau: Chương cuối Giao hưởng số 4 là ví dụ nổi tiếng nhất cho mối quan tâm ấy.
    loai: lich-su
    nguon:
      - bakers-brahms
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "là minh chứng". Baker’s: "most famously expressed later by his dramatic use of the Baroque passacaglia form for the last movement of his Symphony no. 4". Câu "nổi tiếng nhất" theo đúng nguồn. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu. "Nổi tiếng nhất" theo đúng Baker’s ("most famously expressed … Symphony no. 4"), không phải lời trang tự xếp hạng.'
    luot_2: dung
    luot_2_nguon: [ "https://americansymphony.org/concert-notes/symphony-no-4-in-e-minor-op-98/", "https://www.bso.org/works/brahms-symphony-no-4" ]
    luot_2_ghi_chu: "Câu đánh giá. ASO: chưa nhà soạn nhạc nào trước Brahms hồi sinh hình thức cổ này trong giao hưởng; BSO: chương cuối là chaconne trên chủ đề Bach. Phù hợp với cách nói 'ví dụ nổi tiếng nhất'."
    review: dung
  - id: n9
    cau: Passacaglia (hay chaconne) là hình thức Baroque gồm một chủ đề ngắn lặp lại liên tục, với biến tấu mới ở mỗi lần; ở đây chủ đề dài 8 ô nhịp.
    loai: dinh-nghia
    nguon:
      - cod-chaconne
      - bakers-brahms
      - simrock-1886
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hình thức Baroque gồm một chủ đề 8 ô nhịp lặp lại liên tục". COD: passacaglia và chaconne gần như không phân biệt, dựng trên một bè trầm lặp lại (ground bass), có khi chủ đề chuyển lên bè trên; độ dài 8 ô không thuộc định nghĩa, chỉ là của chương này. Baker’s gọi là "Baroque passacaglia form". Viết lại "một chủ đề ngắn (ở đây 8 ô nhịp)". Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bso.org/works/brahms-symphony-no-4", "https://americansymphony.org/concert-notes/symphony-no-4-in-e-minor-op-98/", "https://bach-cantatas.com/Arran/OT-Brahms.htm" ]
    luot_2_ghi_chu: "BSO: chaconne 'a work consisting of variations over a repeated bass pattern'; ASO: passacaglia, chủ đề luôn hiện diện (ostinato) trong kết cấu. Bach-cantatas: 'An eight-bar theme'. Bản in đầu (Brahms-Portal, tr. 77) đếm được 8 ô chủ đề."
    review: dung
  - id: n10
    cau: Link Chủ đề và biến tấu (/opus/hinh-thuc/bien-tau/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: "src/content/docs/hinh-thuc/bien-tau.md có, đã khóa; trang ấy nói về passacaglia và chaconne và link ngược lại trang này (hồ sơ hinh-thuc/bien-tau n12). Review D6-L11-gom: src/content/docs/hinh-thuc/bien-tau.md có, đã khóa; dòng 19 nói passacaglia và chaconne, link ngược lại chương 4 Giao hưởng số 4 của Brahms. Đúng."
    review: dung
  - id: n11
    cau: Chủ đề 8 ô nhịp được Brahms phỏng theo chaconne ở hợp xướng kết thúc cantata BWV 150 của Bach.
    loai: lich-su
    nguon:
      - henle-9856
      - bi-werk
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phỏng theo bè trầm trong chaconne kết thúc cantata BWV 150". Henle: hợp xướng kết là một chaconne; Brahms-Institut: Brahms lấy chuỗi hòa âm của Ciaccona làm ostinato giai điệu 8 ô, ở đầu chương vang lên ở sáo, oboe 1, trombone 1 (bè trên), không phải bè trầm. Bỏ chữ "bè trầm". Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://bach-cantatas.com/Arran/OT-Brahms.htm", "https://imslp.org/wiki/Nach_dir,_Herr,_verlanget_mich,_BWV_150_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "Bach-cantatas: chủ đề 8 ô Brahms mượn, có sửa nhẹ, từ chương kết cantata BWV 150, 'a ciaccona with the text Meine Tage in dem Leide'. IMSLP BWV 150: chương 7 'Chorale (ciaccona): Meine Tage in dem Leide'."
    review: dung
  - id: n12
    cau: Từ chủ đề đó, Brahms viết 30 biến tấu và một coda.
    loai: cau-truc
    nguon:
      - simrock-1886
      - bi-werk
    ket_qua: dung
    ghi_chu: 'Đếm trên bản in: chủ đề ô 1–8; biến tấu 12 (sáo, 3/2) bắt đầu ô 97 (khớp ghi chú của Henle cho ô 101–105 ở bè sáo); biến tấu 16 (3/4, Mi thứ) ô 129; chữ K ô 225 (BT 28), chữ L ô 241 (BT 30); ô 249–252 chậm lại (poco ritard.), Più Allegro (coda) ô 253. Vậy chủ đề + 30 lần × 8 ô = 248 ô, rồi coda. Nguồn chữ khác nhau về con số: Brahms-Institut "mehr als 30 Iterationen"; Burkhardt (1912) "32 Veränderungen" (có lẽ đếm cả phần coda). Giữ cách đếm 30 + coda theo bản nhạc.'
    luot_2: dung
    luot_2_nguon: [ "https://bach-cantatas.com/Arran/OT-Brahms.htm", "https://www.bso.org/works/brahms-symphony-no-4", "https://americansymphony.org/concert-notes/symphony-no-4-in-e-minor-op-98/" ]
    luot_2_ghi_chu: "Bach-cantatas: '30 many-layered variations and a concluding coda'; BSO, ASO: 30 biến tấu. Điểm lượt 1 nêu chưa chắc: vài ghi chú chương trình phổ thông ghi 32 hay 34, nhưng ba nguồn trên và bản nhạc (8 ô × 30 sau chủ đề, rồi 4 ô chuyển và Più Allegro; bản soạn 4 tay Peters trên Internet Archive) cùng cho 30 biến tấu và coda."
  - id: n13
    cau: Mỗi biến tấu dài đúng 8 ô nhịp.
    loai: cau-truc
    nguon:
      - simrock-1886
      - bi-werk
    ket_qua: dung
    ghi_chu: 'Như n12: các mốc ô 97, 129, 225, 241 rơi đúng đầu nhóm 8 ô. Đoạn 3/2 (BT 12–15) vẫn 8 ô mỗi biến tấu (giá trị nốt gấp đôi). Bốn ô 249–252 (sau BT 30) là đoạn nối vào coda.'
