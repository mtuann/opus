ghi_chu: 'Hướng dẫn nghe chương 1 Ánh trăng (tầng Tác phẩm; dùng chung bản ghi beethoven-anh-trang qua cap, là cấu trúc). Bản nhạc: Mutopia moonlight (Winterberger 1908; .ly, MIDI tải 05/11/2026), như hồ sơ piano/tac-pham/beethoven-anh-trang. Lịch sử: lời tựa Henle HN 1062, Crumey, IMSLP, Fitch. Sửa trang: n6 (Thời kỳ: Cổ điển, khớp bản ghi), n15–n18, n20–n25 (sáu dòng Theo dõi viết lại theo bản nhạc, có số ô, khớp mốc của bản Pitman và trang bài học), n26, n27, n29. Không có chỗ chưa chắc. Giữ cho hồ sơ khác: trang là hướng dẫn nghe chương 1 Ánh trăng và link sang bài học (fur-elise n82, piano/index n18): đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, mốc trong ::khoi-nghe. Trang không có ::hinh-cau-truc (bản ghi chỉ có hinh.bai-hoc). Thuật ngữ: "triplet" đổi thành "chùm ba (liên ba móc đơn)" như trang bài học; luyen_nghe của bản ghi vẫn ghi "Triplet đều" (đề xuất ở hồ sơ bản ghi).'
