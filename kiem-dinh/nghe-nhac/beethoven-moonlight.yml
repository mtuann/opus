doi_chu:
  - cu: Cổ điển sang Lãng mạn
    moi: Cổ điển
    ly_do: "n6: IMSLP xếp tác phẩm vào thời kỳ Cổ điển; khớp thoi_ky của bản ghi beethoven-anh-trang."
  - cu:
      - 'Tên gốc Beethoven đặt là Sonata quasi una fantasia ("sonata gần như một fantasia"): thay vì chương 1 nhanh như thông lệ, ông mở bằng một chương chậm (Adagio sostenuto). Toàn chương là một dòng bộ ba nốt móc (triplet) chảy đều không ngừng ở tay phải, trên đó giai điệu cất lên từng nốt dài, thưa thớt — như lời thì thầm trên mặt nước.'
      - "Nghe kỹ tay trái: các nốt trầm đi từng bước, chính là bè bass của tiến trình hòa âm. Chương nhạc ở giọng Đô♯ thứ u ám; giai điệu có lúc đi qua những giọng khác (Mi trưởng, Mi thứ, Fa♯ thứ) nhưng không khí tĩnh lặng thì giữ nguyên từ đầu đến cuối, và chính sự tĩnh lặng ấy là điểm đặc biệt."
    moi:
      - 'Tên gốc Beethoven đặt là Sonata quasi una fantasia ("sonata gần như một fantasia"): thay vì chương 1 nhanh như thông lệ, ông mở bằng một chương chậm (Adagio sostenuto). Toàn chương là một dòng chùm ba (liên ba móc đơn) chảy đều gần như không ngừng ở tay phải, trên đó giai điệu cất lên từng nốt dài, thưa thớt.'
      - "Nghe kỹ tay trái: các quãng tám trầm (mở đầu là Đô♯ – Si – La – Fa♯ – Sol♯) chính là bè trầm của tiến trình hòa âm. Chương nhạc ở giọng Đô♯ thứ; giai điệu có lúc đi qua những giọng khác (Mi trưởng, Mi thứ, Fa♯ thứ), nhưng cả chương giữ ở mức nhỏ: bản Winterberger chỉ ghi pp, p và những lần to dần, nhỏ dần, không có chữ f nào."
    ly_do: "n15: tên theo trang bài học (chùm ba, liên ba); bỏ hình ảnh không kiểm được. n16–n18: bè trầm không chỉ đi từng bước; bỏ đánh giá, viết theo bản nhạc. n26: tên theo trang bài học."
