    luot_2_ghi_chu: "IMSLP: chương 1 Adagio sostenuto; Grove (1900), mục Sonata: sonata cho đàn phím cuối thế kỷ 18 thường mở bằng một Allegro."
  - id: n15
    cau: Toàn chương là một dòng chùm ba (liên ba móc đơn) chảy đều gần như không ngừng ở tay phải, trên đó giai điệu cất lên từng nốt dài, thưa thớt.
    loai: cau-truc
    nguon: &id001
      - mut-moon
    ket_qua: da-sua
    ghi_chu: 'Mutopia: chùm ba móc đơn từ ô 1 đến ô 67 (dừng ở hai hợp âm cuối; vài chùm ba do tay trái đỡ). Câu cũ: "bộ ba nốt móc (triplet) chảy đều không ngừng ... — như lời thì thầm trên mặt nước": đổi tên theo trang bài học cùng bản ghi (chùm ba, liên ba), thêm "gần như", bỏ hình ảnh không kiểm được (doi_chu).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=276", "https://www.mutopiaproject.org/ftp/BeethovenLv/O27/moonlight/moonlight-lys.zip" ]
    luot_2_ghi_chu: "Đối chiếu file .ly của Mutopia (Winterberger 1908), đếm ô nhịp và đổi cao độ tuyệt đối: tay phải liên ba móc đơn liên tục ô 1–67; giai điệu nốt trắng, nốt tròn chấm, thưa."
  - id: n16
    cau: Các quãng tám trầm (mở đầu Đô♯ – Si – La – Fa♯ – Sol♯) là bè trầm của tiến trình hòa âm.
