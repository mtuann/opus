  - id: n9
    cau: Biệt danh "Ánh trăng" không phải của Beethoven đặt.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
    ket_qua: dung
    ghi_chu: 'Henle: "Nowhere is there any allusion to the popular title".'
    luot_2: dung
    luot_2_nguon: [ "https://internet.beethoven.de/pdf-sonderausstellung/Beethovens-Mondschein-Sonate-Kurzfuehrer.pdf", "https://www.henle.de/media/ca/21/5b/1697725842/1062-1697725842-sync.pdf" ]
    luot_2_ghi_chu: "Kurzführer Beethoven-Haus: biệt danh có lâu sau khi viết và không có sự đồng ý của Beethoven; Henle: bản in đầu không nhắc tới biệt danh."
  - id: n10
    cau: Nhà thơ, nhà phê bình Ludwig Rellstab tả chương 1 như một mặt hồ lặng dưới ánh trăng mờ trong truyện ngắn Theodor, đăng năm 1824 trên một tạp chí âm nhạc ở Berlin, khi Beethoven còn sống.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
      - crumey
      - imslp-schwanengesang
    ket_qua: dung
    ghi_chu: 'Henle: Theodor (1823), in trong Berliner Allgemeine musikalische Zeitung số 32, 1824; Crumey: đăng nhiều kỳ mùa hè 1824.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/BerlinerAllgemeineMusikalischeZeitung1824", "https://www.henle.de/media/ca/21/5b/1697725842/1062-1697725842-sync.pdf", "https://crumey.co.uk/beethoven_5_why_moonlight_sonata.html" ]
    luot_2_ghi_chu: "Đọc chữ OCR bản Berliner allgemeine musikalische Zeitung 1824 (archive.org): 'Der See ruht in dämmerndem Mondenschimmer, dumpf stößt die Welle an das dunkle Ufer…' trong 'Theodor. Eine musikalische Skizze'; Henle dẫn Nr. 32, 1824, S. 274 và ghi tác giả Rellstab. Beethoven mất 1827."
  - id: n11
    cau: Đến khoảng năm 1840, tên Mondscheinsonate đã quen thuộc ở Đức.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
      - crumey
    ket_qua: dung
    ghi_chu: 'Henle: "soon became established, for example in Anton Schindler’s Beethoven biography of 1840".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/biographievonlud00schi", "https://www.henle.de/media/ca/21/5b/1697725842/1062-1697725842-sync.pdf", "https://archive.org/details/beethovenetsestr00lenz" ]
    luot_2_ghi_chu: "Schindler 1840 (archive.org): 'unter dem uneigentlichen Namen „Mondschein-Sonate“ in Oestreich bekannt' (Áo); Henle: biệt danh sớm thành nếp, ví dụ ở Schindler 1840; Lenz 1852 nói biệt danh này 'hai mươi năm trước' ở Đức. Ghi chú: Schindler nói Áo, Lenz nói Đức."
  - id: n12
    cau: Chuyện năm 1832 Rellstab ví bài với con thuyền trên hồ Lucerne bắt nguồn từ một cuốn sách in năm 1852 của Wilhelm von Lenz; con số 1832 là suy đoán của người đời sau.
    loai: lich-su
    nguon:
      - crumey
    ket_qua: dung
    ghi_chu: 'Crumey: Lenz, Beethoven et ses trois styles (1852), "il y a vingt ans"; "if twenty years were taken literally, it would suggest a date of 1832".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/beethovenetsestr00lenz", "https://internet.beethoven.de/pdf-sonderausstellung/Beethovens-Mondschein-Sonate-Kurzfuehrer.pdf", "https://crumey.co.uk/beethoven_5_why_moonlight_sonata.html" ]
    luot_2_ghi_chu: "Lenz, Beethoven et ses trois styles: 'Rellstab compare cette œuvre à une barque, visitant, par un clair de lune, les sites sauvages du lac des Quatre Cantons' (hồ Lucerne), không ghi năm; Kurzführer Beethoven-Haus: Lenz 1852, đoạn được trích không tìm thấy ở Rellstab."
  - id: n13
    cau: Tên gốc Beethoven đặt là Sonata quasi una fantasia ("sonata gần như một fantasia").
    loai: ten
    nguon:
      - henle-1062-vorwort
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/ca/21/5b/1697725842/1062-1697725842-sync.pdf", "https://www.beethoven.de/en/work/view/6341812939653120/" ]
    luot_2_ghi_chu: "Henle: tên trên bản in đầu 'SONATA quasi una FANTASIA'; Beethoven-Haus: Originalausgabe op. 27, 2 (Sonata quasi una fantasia)."
  - id: n14
    cau: Thay vì chương 1 nhanh như thông lệ, ông mở bằng một chương chậm (Adagio sostenuto).
    loai: lich-su
