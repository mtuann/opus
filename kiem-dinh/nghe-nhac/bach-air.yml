doi_chu:
  - cu: 'mô tả: Air ("giai điệu" trong tiếng Pháp) là chương 2 của Tổ khúc số 3 — một trong những giai điệu nổi tiếng nhất của Bach, và của cả nhạc cổ điển. Tổ khúc gồm 6…'
    moi: 'mô tả: Air (nghĩa là "giai điệu") là chương 2 của Tổ khúc cho dàn nhạc số 3 của Bach; chương này chỉ có đàn dây và continuo. Tổ khúc gồm 6 chương…'
    ly_do: 'Mô tả trang (description): n7, n9, n11; COD (air), IMSLP, Mutopia.'
  - cu: 'Khoảng 1730 (Leipzig); bản thảo gốc đã thất lạc, chỉ còn các bản sao chép'
    moi: 'Có lẽ khoảng 1729–1731 ở Leipzig; nguồn chính còn lại là một bộ phần bè chép khoảng 1730–1731, một phần do chính Bach chép'
    ly_do: 'n3: lời tựa Bärenreiter TP 194 (NBA).'
  - cu: 'Air ("giai điệu" trong tiếng Pháp) là chương 2 của Tổ khúc số 3 — một trong những giai điệu nổi tiếng nhất của Bach, và của cả nhạc cổ điển. Tổ khúc gồm 6 chương: Ouverture (mở đầu), Air, hai Gavotte, Bourrée và Gigue; Air là ốc đảo tĩnh lặng ở giữa.'
    moi: 'Air (nghĩa là "giai điệu") là chương 2 của Tổ khúc số 3. Tổ khúc gồm 6 chương: Ouverture (mở đầu), Air, hai Gavotte, Bourrée và Gigue. Cả tổ khúc có oboe, trumpet và timpani, nhưng Air chỉ có đàn dây (violin 1, violin 2, viola) và bè continuo.'
    ly_do: 'n7 (COD air), n9 (bỏ lời đánh giá), n11 (IMSLP InstrDetail, Mutopia).'
  - cu: 'Cái tên "Air on the G String" (Air trên dây Sol) đến từ bản chuyển soạn năm 1871 của nghệ sĩ violin August Wilhelmj: ông hạ cả chương xuống Đô trưởng để toàn bộ giai điệu chơi được trên một dây duy nhất — dây Sol trầm nhất của violin — tạo âm sắc dày, ấm rất đặc biệt. Vì vậy bạn sẽ gặp hai phiên bản: bản gốc Rê trưởng cho dàn nhạc, và bản Wilhelmj Đô trưởng cho violin độc tấu.'
    moi: 'Cái tên "Air on the G String" (Air trên dây Sol) đến từ bản chuyển soạn năm 1871 của nghệ sĩ violin August Wilhelmj cho violin và piano: ông dịch giai điệu từ Rê trưởng xuống Đô trưởng để người chơi kéo cả giai điệu trên một dây, dây Sol, dây trầm nhất của violin. Vì vậy bạn sẽ gặp hai phiên bản: bản gốc Rê trưởng cho dàn nhạc, và bản Wilhelmj Đô trưởng cho violin.'
    ly_do: 'n12, n13, n14: COD (Air on the G String).'
  - cu: 'Giai điệu Air đi lên từng nấc thang rồi buông xuống, trên nền bè trầm bước đều như nhịp thở. Nghe kỹ đường bass: nó đi bằng các nốt móc đều đặn, chính là "xương sống" nâng cả giai điệu.'
    moi: 'Chương nhạc chia hai nửa, mỗi nửa nhắc lại: nửa đầu 6 ô nhịp, nửa sau 12 ô. Giai điệu violin 1 mở đầu bằng một nốt Fa♯ ngân dài hơn một ô nhịp rồi mới uốn lượn đi xuống. Nghe kỹ đường bass: nó đi đều bằng nốt móc đơn, phần lớn nhảy quãng tám, suốt cả chương.'
    ly_do: 'n15, n16, n17: Mutopia (Bach-Gesellschaft).'
