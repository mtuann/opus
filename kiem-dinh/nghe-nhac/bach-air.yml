lan:
  - so: 1
    ngay: 2026-11-06
    nhanh: moi/d6-l9
    ma_bam:
    nguoi:
      luot_1: "Claude Opus 5.5 (D6-L9 phần A)"
      luot_2:
      review:
      kiem_mau:
ghi_chu: 'Hướng dẫn nghe Air, Tổ khúc cho dàn nhạc số 3 BWV 1068 (tầng Tác phẩm; bản ghi tac-pham/bach-air; loai: nghe là cấu trúc). Không có khối abc, không có ::hinh-cau-truc; ::khoi-nghe không có bản thu (không sửa). Bản nhạc: Mutopia bach-air (Bach-Gesellschaft; .ly tải 06/11/2026): bốn bè Violino I, Violino II, Viola, Continuo; 4/4, Rê trưởng; nửa đầu 5 ô cộng ô kết (6 ô khi chơi), nửa sau 12 ô (ô 8–19); đọc giọng từng ô. Lịch sử: lời tựa Bärenreiter TP 194 (Urtext NBA, Besseler/Grüß), IMSLP (wikitext: 6 chương, InstrDetail, Piece Style), Concise Oxford Dictionary of Music (Air on the G String; air). Độ dài: MusicBrainz. Sửa trang: n3, n7, n11–n22, n26 (mục Nguồn), mô tả trang; bỏ n9 (đánh giá "một trong những giai điệu nổi tiếng nhất"). Không có chỗ chưa chắc. Không tính là nhận định: tiêu đề mục, tiêu đề cột, câu dẫn "Ghi lại thời điểm…", mốc trong ::khoi-nghe. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: continuo, air; "giọng thứ song song" theo nghĩa relative (d6-l1-gom); "nốt móc đơn" có ở trang nhạc lý đã khóa.'
nguon:
  - id: mutopia-air
    bac: 1
    ten: 'Mutopia Project, Air, BWV 1068 Mvmt. 2 (bach-air-notes.ly, bach-air-score.ly; source "Bach-Gesellschaft"; .ly tải 06/11/2026)'
    link: https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/
  - id: imslp-1068
    bac: 2
    ten: 'IMSLP, Orchestral Suite No.3 in D major, BWV 1068 (wikitext qua api.php): "6 movements: Ouverture (244 bars), Air (36 bars), Gavotte I (52 bars), Gavotte II (64 bars), Bourrée (64 bars), Gigue (144 bars)"; "Year/Date of Composition=1730 ca."; "Piece Style=Baroque"; "InstrDetail=2 oboes, 3 trumpets, timpani, strings, continuo"; mục "For Violin, Piano and Strings (Wilhelmj)" (Raabe & Plothow, Berlin)'
    link: https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)
  - id: ba-tp194
    bac: 2
    ten: 'Bärenreiter TP 194, J. S. Bach, Ouvertüre (Orchestersuite) D-Dur BWV 1068, Urtext der Neuen Bach-Ausgabe (Besseler, Grüß), lời tựa (PDF): "The principal source … is a set of parts that probably dates from 1730–31 (… Mus. ms. Bach St 153). The last two movements in both the violin I and continuo parts are in Bach’s own hand, the remaining movements are in that of Johann Ludwig Krebs … The violin II part was written out by Carl Philipp Emanuel Bach"; "probably intended for use at the Collegium Musicum, the directorship of which Bach took over … in the Spring of 1729"; "it is perfectly possible to propose 1729–31 as the date of this work rather than the date “circa 1722” put forward by Heinrich Besseler"; trumpet và timpani "so popular for festive or open air occasions"'
    link: https://www.barenreiter.co.uk/prefaces/9790006201631.pdf
  - id: cod-air-g
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "Air on the G String": "The name given to an arr. for vn. and pf. by Wilhelmj in 1871 of the 2nd movement (Air) of J. S. Bach''s Suite No.3 in D, in which the melody is transposed from D to C, the violinist playing on his lowest (G) str."'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/air-g-string
  - id: cod-air
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "air": "1. Melody. 2. Comp. of melodious character."'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/air
  - id: bnf-bach
    bac: 2
    ten: 'data.bnf.fr, Johann Sebastian Bach (1685-1750)'
    link: https://data.bnf.fr/ark:/12148/cb118897907
  - id: mb-air
    bac: 2
    ten: 'MusicBrainz, bản thu Air BWV 1068 cho dàn nhạc: Ton Koopman, Amsterdam Baroque Orchestra 4:58; English Chamber Orchestra, Philip Ledger 4:50; Neues Bachisches Collegium Musicum, Max Pommer 4:08 và 4:33'
    link: https://musicbrainz.org/recording/47580024-6219-4f29-a4a1-4d9006ccc6eb
