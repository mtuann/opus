    cau: 'Bảng: Có lẽ sáng tác khoảng 1729–1731 ở Leipzig; nguồn chính còn lại là một bộ phần bè chép khoảng 1730–1731, một phần do chính Bach chép.'
    loai: nam
    nguon: [ ba-tp194, imslp-1068 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 1730 (Leipzig); bản thảo gốc đã thất lạc, chỉ còn các bản sao chép". Bärenreiter: nguồn chính là bộ phần bè "probably dates from 1730–31"; hai chương cuối của phần violin I và continuo do chính Bach viết (nên "chỉ còn các bản sao chép" không đúng hẳn); năm sáng tác đề xuất 1729–31 (Besseler trước đó đoán khoảng 1722); bộ phần bè có lẽ cho Collegium Musicum mà Bach nhận điều khiển mùa xuân 1729, thay Schott, organist nhà thờ Neukirche (Leipzig). IMSLP "1730 ca.". Lời tựa không nói chữ "thất lạc", chỉ nói nguồn chính là bộ phần bè: viết "nguồn chính còn lại". Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.barenreiter.co.uk/prefaces/9790006201631.pdf", "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "Lời tựa Bärenreiter (NBA): nguồn chính là bộ phần bè 'probably dates from 1730–31' (Mus. ms. Bach St 153); 'The last two movements in both the violin I and continuo parts are in Bach's own hand', phần còn lại do Krebs, C. P. E. Bach và người chép khác; đề nghị niên đại 1729–31, gắn với Collegium Musicum ở Leipzig. IMSLP: 'Composition Year 1730 ca.' Lưu ý: chính chương Air trong bè violin 1 là chữ Krebs, không phải chữ Bach; câu viết 'một phần do chính Bach chép' vẫn đúng. Lời tựa này cùng ISMN với TP 194 nên có thể trùng nguồn lượt 1."
