    ghi_chu: 'Chữ cũ: "không kịp thấy *Carmen* trở thành một trong những opera được diễn nhiều nhất thế giới". Chữ mới: "không kịp thấy *Carmen* thành công trọn vẹn ở Vienna vào tháng 10 cùng năm, rồi ở Brussels, St. Petersburg, London, New York." Lý do: câu cũ là xếp hạng không kèm số liệu (chưa mở được thống kê Operabase); Halévy: Vienna 23/10/1875 «a complete success», Brussels «its success too was complete», rồi «St. Petersburg, London, New York, and Naples».'
