  - id: n27
    cau: 'Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online.'
    loai: ten
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ dòng (sách in và cơ sở dữ liệu trả phí, không đọc được; không nhận định nào dựa vào), như D6-L8. Chữ cũ: "- Bối cảnh lịch sử: Burkholder, Grout, Palisca, *A History of Western Music*; Grove Music Online. Xem [tài liệu tham khảo](/opus/tai-lieu-tham-khao/)."; chữ mới: "- Xem [tài liệu tham khảo](/opus/tai-lieu-tham-khao/)." (link tai-lieu-tham-khao giữ, trang có, đã khóa).'
