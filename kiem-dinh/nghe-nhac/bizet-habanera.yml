khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ not, nhip, tiet-tau, giong, toc-do, cu-phap ]
    ket_qua: da-sua
    ghi_chu: 'Khối cũ: L:1/16, M:2/4, K:Dm clef=bass, "D,3 D, D,2 D,2 | D,3 D, D,2 D,2 | A,,3 A,, A,,2 A,,2 | D,3 D, D,2 D,2 |]", tiêu đề "(minh họa)": đúng tiết tấu nhưng mọi nốt là Rê3 và ô 3 xuống La, trong khi bè trầm thật giữ Rê suốt đoạn mở đầu và là hợp âm rải Rê–La–Fa–La. Đối chiếu Choudens tr. 45 và Schirmer tr. 44, tay trái bốn ô đầu (pp): Rê2 móc đơn (chấm), lặng móc kép, La2 móc kép luyến sang Fa3 móc đơn, La2 móc đơn (chấm); bốn ô giống nhau. Khối mới: thứ tự X, T, M, L, Q, K như quy ước; "!pp!.D,,2 z (A,, F,2) .A,,2" ×4; Q:1/4=72 theo "(♩ = 72)" in trên hai bản; tiêu đề "Tiết tấu habanera ở bè trầm (bốn ô mở đầu)"; ấn bản ghi ở mục Nguồn (n28). Mỗi ô 8 móc kép = 2/4.'
ghi_chu: "Hướng dẫn nghe Habanera (tầng Tác phẩm). Bản nhạc: bản piano–thanh nhạc Choudens (khoảng 1900, lời Ý–Đức) và Schirmer (1895, lời Pháp–Anh) trên Internet Archive, render trang bằng PyMuPDF, đọc từng ô của số 5. Lịch sử: IMSLP (wikitext), trang Music Humanities của Columbia (hồi ức Halévy 1904, bài về opéra comique), COD. Sửa trang: n12 (thêm ngày mất), n13 (bỏ xếp hạng \"được diễn nhiều nhất\", viết theo Halévy), n15 (tên bài El arreglito), n19 (Carmen hát \"L'amour!\", không phải hợp xướng), n21 (điệp khúc 2 cụ thể), khuông nhạc (nốt thật của bè trầm), mục Nguồn (n27 bỏ, n28 thêm). Số dòng bảng Theo dõi (5) giữ nguyên, cột đầu \"…\", trang không có mốc. Câu ở hồ sơ khác: lich-su/opera n62, nhac-cu/nhac-cu-khac n22, lich-su/nha-soan-nhac s5 (link tới trang, tên tác phẩm): trang giữ đường dẫn và tiêu đề. Thuật ngữ chưa có trong thuat-ngu.yml: habanera, opera, mezzo-soprano, điệp khúc (refrain), hợp xướng (chorus); \"giọng cùng tên\" theo nhac-ly/07-gam-thu."
doi_chu:
  - cu:
      - Carmen kể chuyện cô gái Digan tự do, quyến rũ ở Seville và người lính Don José, người vì cô mà đánh mất tất cả. Ở buổi công diễn đầu, vở opera gây sốc vì đưa những nhân vật bình dân, thô ráp lên sân khấu và kết thúc bằng một vụ án mạng. Bizet mất ba tháng sau đó, không kịp thấy Carmen trở thành một trong những opera được diễn nhiều nhất thế giới.
      - "Habanera là màn ra mắt của Carmen. Bizet dựa trên một bài hát của nhà soạn nhạc Tây Ban Nha Sebastián Yradier, và dùng tiết tấu habanera (điệu nhảy gốc Cuba) ở bè trầm:"
    moi:
      - Carmen kể chuyện cô gái Digan tự do, quyến rũ ở Seville và người lính Don José, người vì cô mà đánh mất tất cả. Ở buổi công diễn đầu, vở opera gây sốc vì đưa những nhân vật bình dân, thô ráp lên sân khấu và kết thúc bằng một vụ án mạng. Bizet mất ba tháng sau đó (3/6/1875), không kịp thấy Carmen thành công trọn vẹn ở Vienna vào tháng 10 cùng năm, rồi ở Brussels, St. Petersburg, London, New York.
