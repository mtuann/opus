  - id: n10
    cau: Carmen kể chuyện cô gái Digan tự do, quyến rũ ở Seville và người lính Don José, người vì cô mà đánh mất tất cả.
    loai: lich-su
    nguon: [ schirmer ]
    ket_qua: dung
    ghi_chu: 'Schirmer: «Carmen, a Gypsy-girl»; «Don José, Corporal of Dragoons»; cảnh ở Sevilla; José bỏ ngũ theo bọn buôn lậu, cuối vở đâm chết Carmen.'
  - id: n11
    cau: Ở buổi công diễn đầu, vở opera gây sốc vì đưa những nhân vật bình dân, thô ráp lên sân khấu và kết thúc bằng một vụ án mạng.
    loai: lich-su
    nguon: [ columbia-comique, columbia-first ]
    ket_qua: dung
    ghi_chu: 'Columbia: «Carmen with its degenerate characters, its unbridled sexuality and its onstage murder, struck its audiences as a shocking departure»; Halévy: báo chê «most unsavory characters», buổi đầu «not a success».'
  - id: n12
    cau: Bizet mất ba tháng sau buổi công diễn đầu (3/6/1875).
    loai: nam
    nguon: [ imslp-bizet, imslp-carmen, columbia-first ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bizet mất ba tháng sau đó,"; chữ mới thêm ngày "(3/6/1875)". Lý do: IMSLP ghi mất 3/6/1875, công diễn 3/3/1875; Halévy cũng nhớ ngày 3/6.'
  - id: n13
    cau: Bizet không kịp thấy Carmen thành công trọn vẹn ở Vienna vào tháng 10/1875, rồi ở Brussels, St. Petersburg, London, New York.
    loai: lich-su
    nguon: [ columbia-first ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không kịp thấy *Carmen* trở thành một trong những opera được diễn nhiều nhất thế giới". Chữ mới: "không kịp thấy *Carmen* thành công trọn vẹn ở Vienna vào tháng 10 cùng năm, rồi ở Brussels, St. Petersburg, London, New York." Lý do: câu cũ là xếp hạng không kèm số liệu (chưa mở được thống kê Operabase); Halévy: Vienna 23/10/1875 «a complete success», Brussels «its success too was complete», rồi «St. Petersburg, London, New York, and Naples».'
  - id: n14
    cau: Habanera là màn ra mắt của Carmen.
    loai: cau-truc
    nguon: [ schirmer, choudens ]
    ket_qua: dung
    ghi_chu: 'Schirmer, tóm tắt: các cô gái thuốc lá ra, «last of all comes Carmen»; số 5 Habanera là bài hát lớn đầu tiên của nhân vật, ngay khi cô vừa xuất hiện.'
  - id: n15
    cau: Bizet dựa trên bài El arreglito của nhà soạn nhạc Tây Ban Nha Sebastián Yradier.
    loai: lich-su
    nguon: [ imslp-carmen, imslp-yradier, cod-habanera, schirmer ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dựa trên một bài hát của nhà soạn nhạc Tây Ban Nha Sebastián Yradier"; chữ mới nêu tên bài "*El arreglito*". Nguồn: IMSLP «El arreglito (Yradier) (basis of the Habanera)»; IMSLP Yradier: Spanish; COD: «adaptation of a popular song by Yradier»; Schirmer: «Imitated from a Spanish song».'
  - id: n16
    cau: Habanera là điệu nhảy gốc Cuba; Bizet dùng tiết tấu habanera ở bè trầm.
    loai: dinh-nghia
    nguon: [ cod-habanera, choudens, schirmer ]
    ket_qua: dung
    ghi_chu: 'COD: «Slow Cuban … song and dance», nhịp đôi, tiết tấu chấm dôi. Bản nhạc: bè trầm mỗi ô 2/4 là móc đơn, lặng móc kép, móc kép, móc đơn, móc đơn (Rê–La–Fa–La), tức nhịp chấm dôi–móc kép–móc đơn–móc đơn của habanera.'
  - id: n17
    cau: 'Theo dõi, dòng 1: bè trầm bắt đầu tiết tấu habanera, lặp lại suốt bài như nhịp bước uốn lượn.'
    loai: cau-truc
    nguon: [ choudens, schirmer ]
    ket_qua: dung
    ghi_chu: Bốn ô mở đầu chỉ có bè trầm (pp); hình tiết tấu ấy có ở mọi ô đến hết bài (Schirmer tr. 44–54). "Nhịp bước uốn lượn" là hình ảnh gợi nghe.
  - id: n18
    cau: 'Theo dõi, dòng 2: Carmen hát câu đầu, giai điệu đi xuống từng nửa cung, ở giọng Rê thứ.'
    loai: cau-truc
    nguon: [ choudens, schirmer ]
    ket_qua: dung
    ghi_chu: Một giáng ở hóa biểu; giọng hát Rê–Đô♯–Đô–Si–Si♭–La–La♭(Sol♯)–Sol… (Schirmer tr. 44).
  - id: n19
    cau: "Theo dõi, dòng 3: điệp khúc chuyển sang Rê trưởng, sáng rõ; Carmen ngân \"L'amour!\" trong khi hợp xướng hát lại câu đi xuống; rồi Carmen hát \"L'amour est enfant de Bohême\", hợp xướng xen tiếng \"Prends garde à toi!\"."
    loai: cau-truc
    nguon: [ schirmer, choudens ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Điệp khúc: **chuyển sang Rê trưởng**, sáng rõ, hợp xướng phụ họa \"L'amour!\"\". Chữ mới: \"Điệp khúc: **chuyển sang Rê trưởng**, sáng rõ. Carmen ngân \"L'amour!\" trong khi hợp xướng hát lại câu đi xuống; rồi Carmen hát \"L'amour est enfant de Bohême\", hợp xướng xen tiếng \"Prends garde à toi!\" (Coi chừng đấy!)\". Lý do: Schirmer tr. 45–46: hóa biểu đổi sang hai thăng; chính Carmen hát \"L'amour!\" kéo dài, soprano và tenor hát \"L'amour est un oiseau rebelle\"; sau đó Carmen hát \"L'amour est enfant de Bohême\", hợp xướng (f) xen \"Prends garde à toi!\". Câu cũ gán \"L'amour!\" cho hợp xướng là sai."
  - id: n20
    cau: 'Theo dõi, dòng 4: lời thứ hai, giai điệu nửa cung trở lại.'
    loai: cau-truc
    nguon: [ choudens, schirmer ]
    ket_qua: dung
    ghi_chu: "Lời 2 (Schirmer tr. 49: «L'oiseau que tu croyais surprendre») lại ở Rê thứ, cùng giai điệu."
  - id: n21
    cau: "Theo dõi, dòng 5: điệp khúc lần hai: hợp xướng hát lại \"L'amour est enfant de Bohême\", Carmen và hợp xướng cùng kết bằng \"Prends garde à toi!\" thật mạnh."
    loai: cau-truc
    nguon: [ schirmer ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Điệp khúc lần hai, cao trào\". Chữ mới: \"Điệp khúc lần hai: hợp xướng hát lại \"L'amour est enfant de Bohême\", Carmen và hợp xướng cùng kết bằng \"Prends garde à toi!\" thật mạnh\". Lý do: \"cao trào\" chung chung; Schirmer tr. 52–54: hợp xướng (mf) hát \"L'amour est enfant de Bohême\", ô cuối Carmen và hợp xướng cùng \"toi!\" (f), piano ff."
  - id: n22
    cau: 'Câu hỏi: vì sao chuyển từ giọng thứ sang giọng trưởng ở điệp khúc lại hiệu quả; xem bài 7 (/opus/nhac-ly/07-gam-thu/).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/nhac-ly/07-gam-thu.md có (đã khóa), mục "Giọng thứ song song và giọng thứ cùng tên" nói Đô trưởng–Đô thứ là hai giọng cùng tên; Rê thứ → Rê trưởng ở đây là hai giọng cùng tên (n18, n19).
  - id: n23
    cau: Ba câu hỏi nghe chủ động (giai điệu nửa cung và tính cách Carmen; giọng thứ sang trưởng; tiết tấu habanera trong bài hát hiện đại).
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Câu hỏi gợi nghe, không khẳng định gì ngoài điều đã kiểm ở n18, n19.
  - id: n24
    cau: 'Đọc thêm: Nhập môn opera (/opus/lich-su/opera/).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/lich-su/opera.md có, đã khóa (khoa.json).
  - id: n25
    cau: 'Ghi chép: dùng mẫu ghi chép (/opus/nghe-nhac/mau/).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/nghe-nhac/mau.md có (chưa khóa: bản thật hiện "sắp có"), có trong src/data/trang.yml.'
  - id: n26
    cau: 'Nguồn: bản nhạc và tổng phổ trên IMSLP (tìm theo tên nhà soạn nhạc và số hiệu danh mục).'
