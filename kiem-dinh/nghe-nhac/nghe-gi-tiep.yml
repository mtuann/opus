    cau: 'Cột "Vì sao" của các dòng còn lại (năng lượng Baroque; hợp âm rải tĩnh lặng; trong sáng cân đối thời Cổ điển; kịch tính đến chiến thắng; giai điệu hát trên nền hợp âm rải; không khí mơ màng; nhạc ballet giàu giai điệu; chậm rãi, thiền định; tiết tấu mạnh, màu sắc dàn nhạc).'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Là cảm nhận để gợi ý nghe, không nói sự kiện cụ thể. "Nhạc ballet" (Tchaikovsky, Prokofiev) đã kiểm ở n8.'
