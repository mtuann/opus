    cau: 'Mozart Eine kleine Nachtmusik → Mozart Divertimento K. 136; Haydn Tứ tấu "Hoàng đế".'
    loai: ten
    nguon: [ imslp-nghe ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Divertimento K.136; String Quartet Op.76 No.3 (Hob.III:77) "Emperor".'
  - id: n5
    cau: 'Beethoven Giao hưởng số 5 → Beethoven Giao hưởng số 7; Brahms Giao hưởng số 1.'
    loai: ten
    nguon: [ imslp-nghe ]
    ket_qua: dung
  - id: n6
    cau: 'Chopin Nocturne Op. 9 số 2 → Chopin Nocturne Op. 27 số 2; Field Nocturne số 5; Schumann Träumerei.'
    loai: ten
    nguon: [ imslp-nghe ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Nocturnes Op.27 (2 nocturnes); Field H 37 "Nocturne No.5". Träumerei: trang piano/tac-pham/schumann-traumerei và bản ghi đã kiểm.'
  - id: n7
    cau: 'Debussy Clair de lune → Debussy Rêverie, Arabesque số 1; Ravel Pavane pour une infante défunte; Satie Gymnopédie số 1.'
    loai: ten
    nguon: [ imslp-nghe ]
    ket_qua: dung
