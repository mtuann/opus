    cau: 'Tchaikovsky Hồ thiên nga → Tchaikovsky Kẹp hạt dẻ, Người đẹp ngủ trong rừng; Prokofiev Romeo và Juliet; đều là nhạc ballet.'
    loai: ten
    nguon: [ imslp-nghe, mb-works ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Swan Lake (ballet) Op.20, The Nutcracker (ballet) Op.71, The Sleeping Beauty (ballet) Op.66. MusicBrainz: Romeo and Juliet, op. 64 (Prokofiev; ballet).'
  - id: n9
    cau: 'Dvořák Giao hưởng số 9 → Dvořák Concerto cello; Smetana Vltava.'
    loai: ten
    nguon: [ imslp-nghe ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Cello Concerto Op.104; Má vlast số 2 Vltava.'
  - id: n10
    cau: 'Vì sao (Dvořák): cùng Dvořák, hoặc một nhà soạn nhạc Séc khác; giai điệu dễ nhớ, dàn nhạc rực rỡ.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Đã đổi chữ. Chữ cũ: "Giai điệu dân gian Séc, phong cảnh thiên nhiên". Lý do: "giai điệu dân gian Séc" là điều kiểm được và không đúng cho Giao hưởng số 9 (viết ở Mỹ, tên "Từ Thế giới mới"; IMSLP không ghi chất liệu dân gian Séc); viết lại thành lời gợi ý. Smetana là nhà soạn nhạc Séc: IMSLP Má vlast ("Tổ quốc tôi").'
  - id: n11
    cau: 'Pärt Spiegel im Spiegel → Pärt Für Alina, Fratres; Górecki Giao hưởng số 3 (chương 1).'
    loai: ten
    nguon: [ mb-works ]
    ket_qua: dung
    ghi_chu: 'MusicBrainz: Für Alina, Fratres (Pärt); Górecki Symphony no. 3 op. 36, "I. Lento: Sostenuto tranquillo ma cantabile".'
  - id: n12
