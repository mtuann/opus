ghi_chu: 'Trang gợi ý nghe, không có bản ghi, không có khối abc. Cách tách: mỗi dòng bảng (hay mỗi tâm trạng, nhạc cụ) một nhận định loại ten cho tên tác phẩm, số hiệu, nhạc cụ, giọng (nguồn IMSLP qua API, các tác phẩm còn bản quyền qua MusicBrainz hay Lưu trữ Bartók); cột "Vì sao" và các tâm trạng là lời gợi ý nghe (khuyen-tap), trừ chỗ nói điều kiểm được (Dvořák: đã viết lại, n10). Sửa: n10 (khuyen-tap, đổi chữ), n15, n25, n27. Câu trang khác dẫn tới (tiêu đề "Nghe gì tiếp?", mục "## Theo tâm trạng", gợi ý theo sở thích) giữ nguyên. Không có thuật ngữ mới đáng ghi.'
nguon:
  - id: imslp-nghe
    bac: 2
    ten: 'IMSLP, trang tác phẩm (wikitext qua API, đã mở từng trang): Brandenburg Concerto No.3 BWV 1048, No.5 BWV 1050; Concerto for 2 Violins in A minor RV 522 (Op.3 No.8); Das wohltemperierte Klavier I BWV 846–869; Goldberg Variations BWV 988; Divertimento K.136; String Quartet Hob.III:77 "Emperor" (Op.76 No.3); Symphony No.7 Op.92 (Beethoven); Symphony No.1 Op.68 (Brahms); Nocturnes Op.27 (Chopin); Nocturne in B-flat major H 37 "Nocturne No.5" (Field); Rêverie CD 76, 2 Arabesques CD 74 (Debussy); Pavane pour une infante défunte (Ravel); 3 Gymnopédies (Satie); Swan Lake Op.20, The Nutcracker Op.71, The Sleeping Beauty Op.66 (Tchaikovsky); Cello Concerto Op.104 (Dvořák); Má vlast: số 2 "Vltava" (Smetana); The Rite of Spring, The Firebird (Stravinsky); 6 Partitas BWV 825–830; Guillaume Tell (Rossini): "Overture"; Symphony No.41 K.551 "Jupiter Symphony"; Le quattro stagioni: RV 315 "L''estate"; Enigma Variations Op.36: "Variation IX: Nimrod"; Symphony No.5 (Mahler): "4. Adagietto"; Gianni Schicchi (Puccini): "Aria: O mio babbino caro"; Pavane Op.50 (Fauré); Piano Concerto No.2 Op.18 (Rachmaninoff), 3 movements; Ballade No.1 Op.23 (Chopin); Liebesträume S.541; Morceaux de fantaisie Op.3: "Prélude … Lento (c#)" là số 2; Violin Concerto Op.64 (Mendelssohn), Key e; Violin Partita No.2 BWV 1004: "Chaconne (No.5)"; Thaïs: "Méditation (Act II)"; Zigeunerweisen Op.20; Cello Suite No.1 BWV 1007: "Prélude"; Le carnaval des animaux: "13. Le cygne"; Cello Concerto Op.85 (Elgar); Recuerdos de la Alhambra (Tárrega); Suite española No.1 Op.47 (Albéniz), Instrumentation piano, "Asturias (No.5)". Link ghi trang Enigma Variations làm đại diện; các trang khác theo tên ở trên'
    link: https://imslp.org/wiki/Variations_on_an_Original_Theme_%27Enigma%27,_Op.36_(Elgar,_Edward)
  - id: mb-works
    bac: 2
    ten: 'MusicBrainz, tác phẩm (works) và nhà soạn nhạc: Für Alina, Fratres, Spiegel im Spiegel (Arvo Pärt); Symphony no. 3, op. 36 "Symphony of Sorrowful Songs" (Henryk Mikołaj Górecki); Romeo and Juliet, op. 64 (Prokofiev); Adagio for Strings (Samuel Barber); Concierto de Aranjuez (Joaquín Rodrigo)'
    link: https://musicbrainz.org/work/53a20f2a-19fd-3abb-ba35-458121a135b8
  - id: bartok-arch
    bac: 2
    ten: 'Lưu trữ Bartók (Budapest), Béla Bartók''s Compositions: "BB 123 (Sz 116 / W 80) Concerto for Orchestra (1943)"'
    link: https://zti.btk.mta.hu/en/ba/bartok-compositions/chronology
  - id: mb-gould
    bac: 2
    ten: 'MusicBrainz, release "A State of Wonder: The Complete Goldberg Variations 1955 & 1981" (Sony Classical, 2002) và các bản "The Goldberg Variations (1981 Recording)": Glenn Gould thu Goldberg năm 1981 (phát hành 1982, CBS)'
    link: https://musicbrainz.org/release/5c9cc5e5-bc5e-4c0b-a0ec-eaff41711a2d
nhan_dinh:
  - id: n1
    cau: 'Trang gợi ý bước tiếp theo dựa trên sở thích, thay vì theo trình tự lịch sử; mỗi gợi ý giải thích vì sao nó liên quan.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên trang: bốn mục theo tác phẩm đã thích, tâm trạng, nhạc cụ, thời lượng; bảng đầu có cột "Vì sao". (Cột "Vì sao" chỉ có ở mục đầu.)'
  - id: n2
    cau: 'Vivaldi Bốn Mùa → Bach Brandenburg Concerto số 3 và 5; Vivaldi Concerto cho hai violin RV 522.'
    loai: ten
    nguon: [ imslp-nghe ]
    ket_qua: dung
    ghi_chu: 'IMSLP: BWV 1048, 1050; RV 522 "Concerto for 2 Violins in A minor".'
