    ten: 'Mutopia Project, BWV 846 Prelude (wtk1-prelude1.ly, tải 06/11/2026): bè trầm ô 24–31 là nốt Sol (g,) mỗi ô, ô 32 Đô (c,), ô 35 hợp âm Đô'
    link: https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly
nhan_dinh:
  - id: n1
    cau: 'Khung ghi chép cho bốn lần nghe theo phương pháp 4 lần nghe (link /opus/nghe-nhac/#phuong-phap-4-lan-nghe).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích nghe-nhac/index chưa chuyển; kiểm ở ../opus-zero/docs/nghe-nhac/index.md: tiêu đề "## Phương pháp 4 lần nghe" (id do id-cu.mjs sinh: phuong-phap-4-lan-nghe), bốn lần: Cảm nhận; Tìm giai điệu chính; Theo dõi cấu trúc (sơ đồ A B A… với mốc thời gian); So sánh (bản thu khác). Lô chuyển nghe-nhac/index phải giữ tiêu đề và bốn lần này. Review D6-L7-gom: kiểm trên trang và dữ liệu: nghe-nhac/index chưa có file; có trong trang.yml nên link hiện "sắp có". Nội dung bốn lần nghe kiểm trên site cũ như ghi chú lượt 1; lô chuyển nghe-nhac/index (D6-L11) phải giữ id phuong-phap-4-lan-nghe.'
    review: dung
  - id: n2
    cau: 'Chép khung vào sổ tay hoặc ứng dụng ghi chú, mỗi tác phẩm một trang; vài dòng cho mỗi lần nghe là đủ.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: "Khuyên tập: hợp lý, không có hại."
  - id: n3
    cau: 'Ghi chép về buổi tập đàn thì để ở Nhật ký luyện tập (link).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/luyen-tap/nhat-ky.md có. Review D6-L7-gom: kiểm trên trang và dữ liệu: trang đích luyen-tap/nhat-ky có.'
    review: dung
  - id: n4
    cau: 'Khung gồm bảng thông tin (nhà soạn nhạc, năm sáng tác, thời kỳ, thể loại, giọng, bản thu đã nghe) và bốn lần nghe: Cảm nhận, Giai điệu chính, Cấu trúc (sơ đồ A B A kèm mốc thời gian), So sánh bản thu; thêm Bối cảnh và Nghe tiếp.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Khớp bốn lần nghe ở ../opus-zero/docs/nghe-nhac/index.md (n1). Câu trang khác dẫn tới (bốn lần nghe) giữ. Review D6-L7-gom: kiểm trên trang và dữ liệu: khối mẫu dòng 11–36: bảng 6 trường, 4 lần nghe, Bối cảnh, Nghe tiếp.'
    review: dung
  - id: n5
    cau: 'Câu hỏi gợi ý trong khung (vui hay buồn, giai điệu nào nhớ được, bản thu thứ hai khác gì, đọc bối cảnh từ nguồn đáng tin…).'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: "Khuyên tập: các câu hỏi gợi ý hợp lý cho người mới tập nghe."
  - id: n6
    cau: 'Link ví dụ Prelude Đô trưởng của Bach.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/piano/tac-pham/bach-prelude-do.md có. Review D6-L7-gom: kiểm trên trang và dữ liệu: trang đích piano/tac-pham/bach-prelude-do có.'
    review: dung
  - id: n7
    cau: 'Ví dụ lần 1 (cảm nhận): êm và đều như nước chảy; khoảng phút thứ nhất nhạc căng lên rồi lắng xuống.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Ví dụ cảm nhận của một người nghe, tùy bản thu; không phải sự kiện. Phù hợp bài học (đoạn bảy giảm ô 12–23 rồi âm nền).'
    luot_2: dung
    luot_2_ghi_chu: "Khuyên tập: ví dụ ghi cảm nhận, hợp lý. Theo bản Mutopia, chuỗi hợp âm căng (hợp âm giảm, ô 20–23) nằm khoảng giữa bài, trước nốt pedal át."
  - id: n8
    cau: 'Ví dụ lần 3 (cấu trúc) của Prelude Đô trưởng BWV 846: Đô trưởng → sang Sol trưởng → trở về → nốt Sol trầm ngân rất lâu → kết.'
    loai: cau-truc
    nguon: [ mutopia-846 ]
    ket_qua: dung
    ghi_chu: 'Mutopia: ô 1–4 Đô trưởng; ô 11 Sol trưởng (bè trầm g g ô 11); ô 19 về Đô (c c); ô 24–31 bè trầm g, cả tám ô (âm nền át; nốt Sol đánh lại mỗi nửa ô, nên "ngân" hiểu là âm nền giữ suốt); ô 32–35 trên nền Đô, kết Đô. Khớp bản đồ nghe của bài học bach-prelude-do (ô 5–11, 19–20, 24–31, 35).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly" ]
    luot_2_ghi_chu: "Đọc bè trầm và hợp âm trong bản LilyPond của Mutopia (35 ô nhịp). Ô 1–4 ở Đô trưởng; ô 10 là D–F♯–A–C (V7 của Sol), ô 11 là hợp âm Sol trưởng: đã sang Sol trưởng. Ô 19 về lại hợp âm Đô (bè trầm C, C–G–C–E), ô 20 thêm Si giáng (C7) dẫn sang Fa: đã trở về giọng chính. Bè trầm giữ Sol (G,) từ ô 24 đến ô 31 (8 ô, nốt pedal át). Ô 32–35 bè trầm giữ Đô (C,), kết ở hợp âm Đô có dấu ngân."
