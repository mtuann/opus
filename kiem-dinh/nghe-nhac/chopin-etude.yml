ghi_chu: 'Hướng dẫn nghe (loai: nghe là cấu trúc). Không có khối abc. Bản nhạc: số 3 qua ảnh trang ấn bản G. Schirmer 1916 (Friedheim; Internet Archive chopinetudesforp00unse, tr. 12–15; ảnh độ phân giải vừa, đọc được chữ chỉ dẫn và đoạn con bravura, không đếm từng ô: số ô theo Henle Bemerkungen); số 12 qua Mutopia op-10-12-wfi.ly (Peters, Scholtz 1900), 84 ô. Không tính là nhận định: tiêu đề mục, tiêu đề cột, ::hinh-cau-truc và ::khoi-nghe (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Sửa: n3, n8, n9, n10, n12, n17, n18, n25, n29, n30, n36, n37, n38, n40, n41, n45, n47. Câu trang khác dẫn tới (hướng dẫn nghe Op. 10, trọng tâm số 3, Lento ma non troppo, biệt danh Tristesse; dòng "Con bravura: quãng sáu kép dồn dập"; số 12 "tay phải hô vang chủ đề bằng quãng tám và hợp âm") giữ nguyên. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: nốt kép (double notes), quãng sáu kép, hợp âm bảy giảm, hợp âm bảy át, con bravura, poco più animato. Đã có: étude ("Bài luyện"), legato, Lento, rubato.'
