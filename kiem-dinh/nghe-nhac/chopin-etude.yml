doi_chu:
  - cu: Op. 10 viết trong các năm 1829–1832 (số 12 khoảng 1831, số 3 năm 1832); in năm 1833 ở Paris, Leipzig và London, đề tặng Franz Liszt
    moi: Op. 10 viết trong các năm 1829–1832 (bản thảo nháp của số 3 đề ngày 25/8/1832); in năm 1833 ở Paris và Leipzig, rồi ở London, đề tặng Franz Liszt
    ly_do: "n3: năm 1831 của số 12 là truyền thuyết (Henle HN 658); ngày bản thảo số 3 theo NIFC. n4 (review D6-L7-gom): bản in London đầu tiên không còn, năm chưa chắc (NIFC)."
  - cu: Số 3 khoảng 4–5 phút; số 12 khoảng 2,5–3 phút; cả Op. 10 khoảng 30 phút
    moi: Số 3 khoảng 3,5–4,5 phút; số 12 khoảng 2,5–3 phút; cả Op. 10 khoảng 27–30 phút
    ly_do: "n8 (lượt 2, review D6-L7-gom): Pollini, Cortot và các bản thu trên IMSLP."
  - cu: 'Étude nghĩa là "bài học". Trước Chopin, étude của Czerny, Cramer hay Clementi là bài luyện ngón: có ích, nhưng hiếm khi được chơi trong hòa nhạc. Chopin, từ năm 19 đến 22 tuổi, viết 12 étude Op. 10, mỗi bản giải một bài toán kỹ thuật nhưng đồng thời là một tác phẩm trọn vẹn, có giai điệu, hòa âm và kịch tính. Chúng là những étude đầu tiên trở thành tiết mục hòa nhạc. Xem Bài tập ngón và étude và các thể loại nhạc piano.'
    moi: Étude nghĩa là "bài luyện". Trước Chopin, étude của Czerny, Cramer hay Clementi chủ yếu là bài luyện ngón cho người học. Chopin, từ năm 19 đến 22 tuổi, viết 12 étude Op. 10, mỗi bản giải một bài toán kỹ thuật nhưng đồng thời là một tác phẩm trọn vẹn, có giai điệu, hòa âm và kịch tính. Chúng được viết để chơi cả trên sân khấu hòa nhạc, không chỉ trong phòng tập. Xem Bài tập ngón và étude và các thể loại nhạc piano.
    ly_do: 'Mô tả trang (description): n9, n10. n9, n10, n12: COD (étude), PTNA; bỏ "đầu tiên", "hiếm khi được chơi" (không có nguồn).'
  - cu:
      - Biệt danh không phải của Chopin. Ông chỉ đánh số và ghi tốc độ. "Tristesse" (Nỗi buồn) hay "L'Adieu" (Lời từ biệt) cho số 3, "Cách mạng" cho số 12, "Phím đen" cho Op. 10 số 5, "Gió mùa đông" cho Op. 25 số 11 đều do người đời sau đặt.
      - 'Số 3, Mi trưởng: dạy tay phải hát. Bản thảo đầu tiên ghi Vivace (nhanh), rồi Vivace ma non troppo; đến bản in Chopin mới đổi thành Lento ma non troppo (chậm, nhưng không quá), và ngày nay hầu như ai cũng chơi chậm hơn con số máy đếm nhịp ông ghi. Theo nhà viết tiểu sử Frederick Niecks, Chopin nói với học trò Adolf Gutmann rằng ông chưa từng viết được giai điệu nào đẹp như thế; có lần nghe Gutmann tập bản này, ông giơ hai tay lên và kêu: "Ôi, quê hương tôi!". Bài toán kỹ thuật: giai điệu và phần đệm trong cùng một tay. Ngón 4 và 5, hai ngón yếu nhất, hát giai điệu legato ở bè trên, trong khi ngón 1 và 2 chơi bè đệm móc kép thật nhẹ bên dưới. Đoạn giữa (poco più animato) đổi hẳn tính chất: giai điệu và đệm hòa thành những chuỗi nốt kép lắc lư, đi qua một loạt hợp âm bảy giảm căng thẳng, lên đỉnh ở đoạn con bravura với những quãng sáu kép, rồi một hợp âm bảy át kéo dài dẫn về giai điệu, lần này ngắn hơn.'
      - "Số 12, Đô thứ: dạy tay trái chạy. Viết khoảng năm 1831, năm cuộc khởi nghĩa của Ba Lan chống Nga thất bại và Warsaw rơi vào tay quân Nga, khi Chopin đã rời quê hương. Truyền thống gắn bản nhạc với biến cố ấy, nhưng không có tài liệu nào cho thấy chính Chopin nối hai chuyện với nhau. Mở đầu là một hợp âm nghịch tai đánh mạnh, rồi tay trái đổ xuống; sau đó tay phải hô vang chủ đề bằng quãng tám và hợp âm, trong khi tay trái chạy móc kép không nghỉ lên xuống khắp bàn phím. Bài toán: giữ tay trái đều, nhanh, rõ mà không căng cứng, và không lấn át tay phải. Gần cuối, nhạc lắng xuống trong giây lát, rồi hai tay cùng đổ xuống lần cuối và bản nhạc kết bằng hợp âm Đô trưởng."
      - Nghe bằng tai người chơi piano. Ở số 3, legato đến từ "sức ép chứ không phải cú đánh", như lời Alfred Cortot; Chopin không ghi bàn đạp, người chơi thay bàn đạp theo bè trầm và hòa âm. Ở số 12, hãy nghe xem "cơn bão" tay trái có che mất tiếng hô của tay phải không.
