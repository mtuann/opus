  - id: n8
    cau: 'Bảng: Độ dài số 3 khoảng 3,5–4,5 phút; số 12 khoảng 2,5–3 phút; cả Op. 10 khoảng 27–30 phút.'
    loai: so-lieu
    nguon:
      - commons-neeman
      - ptna-460
      - mb-pollini-op10
      - imslp-op10
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cả Op. 10 khoảng 30 phút". Chữ mới: "khoảng 30–35 phút". Lý do: PTNA ghi 33 phút 30 giây. Bản thu Neeman trên trang: số 3 4 phút 36 giây, số 12 2 phút 45 giây (khớp). Review D6-L7-gom: lượt 2 sai, câu đúng theo lượt 2: Pollini (DG 1973, MusicBrainz) số 3 = 3:40, số 12 = 2:35, cả Op. 10 ≈ 26,6 phút; IMSLP: Cortot (EMI 1933) trọn Op. 10 26:50, Licad 28:44, Okonsar 29:52. Sửa theo câu đúng của lượt 2; bản Neeman trên trang (số 3: 4 phút 36 giây) vẫn ở mức "khoảng 4,5 phút"; PTNA (33 phút 30 giây) là con số danh nghĩa, bỏ. Không chạy lại. Chữ câu cũ: "Bảng: Độ dài số 3 khoảng 4–5 phút; số 12 khoảng 2,5–3 phút; cả Op. 10 khoảng 30–35 phút.". doi_chu.'
    luot_2: sai
    luot_2_nguon: [ "https://musicbrainz.org/release/1ac7d05e-5e50-437b-9c37-d90e6b084e39", "https://imslp.org/wiki/%C3%89tudes,_Op.10_(Chopin,_Fr%C3%A9d%C3%A9ric)" ]
    luot_2_ghi_chu: "câu đúng: Bảng: Độ dài số 3 khoảng 3,5–4,5 phút; số 12 khoảng 2,5–3 phút; cả Op. 10 khoảng 27–30 phút.; Đo trên bản thu: Pollini (DG 1973, MusicBrainz) số 3 = 3:40, số 12 = 2:35, cả Op. 10 ≈ 26,6 phút. IMSLP: Cortot (EMI 1933) trọn Op. 10 = 26:50; Licad 28:44; Okonsar 29:52; Goldstein số 3 = 4:07, số 12 = 2:44. Vế số 12 đúng; số 3 thường 3,5–4 phút; cả Op. 10 dưới 30 phút."
    review: dung
