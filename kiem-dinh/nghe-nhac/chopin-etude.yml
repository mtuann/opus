nhan_dinh:
  - id: n1
    cau: 'Tiêu đề và bảng: Étude Op. 10 số 3 cung Mi trưởng (Lento ma non troppo) và số 12 cung Đô thứ (Allegro con fuoco), trong 12 Étude Op. 10.'
    loai: ten
    nguon: [ imslp-op10, henle-hn124-bem, mutopia-12 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: 12 studies, số 3 Key E, số 12 Key c. Henle: chữ tốc độ số 3 theo bản in (bản thảo ghi Vivace). Mutopia số 12: \tempo "Allegro con fuoco".'
  - id: n2
    cau: 'Bảng: Nhà soạn nhạc Frédéric Chopin (1810–1849).'
    loai: nam
    nguon: [ henle-hn124 ]
    ket_qua: dung
    ghi_chu: 'Khớp src/data/nha-soan-nhac.yml (đã khóa). Henle: sinh 1/3/1810.'
  - id: n3
    cau: 'Bảng: Op. 10 viết trong các năm 1829–1832; bản thảo nháp của số 3 đề ngày 25/8/1832.'
    loai: nam
    nguon: [ henle-hn124-vorwort, imslp-op10, nifc-op10-3 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(số 12 khoảng 1831, số 3 năm 1832)". Chữ mới: "(bản thảo nháp của số 3 đề ngày 25/8/1832)". Lý do: Henle "op. 10 from 1829 to 1832"; NIFC: AI "Paris, 25 August [18]32". Năm 1831 của số 12 chỉ là truyền thuyết (Henle HN 658: "unsubstantiated legend"); bản chép sạch số 12: IX 1832–III 1833 (NIFC). Xem n25.'
  - id: n4
    cau: 'Bảng: Op. 10 in năm 1833 ở Paris, Leipzig và London.'
    loai: nam
    nguon: [ nifc-op10-3, henle-hn124-vorwort, niecks ]
    ket_qua: dung
    ghi_chu: 'NIFC: FE1 Schlesinger, Paris, VI 1833; GE1 Kistner, Leipzig, VIII 1833; EE Wessel, London, [EE1] VIII 1833 (chưa tìm thấy bản nào; bản còn lại sớm nhất EE2 1835–1836). Niecks: "published in July, 1833".'
  - id: n5
    cau: 'Bảng và đoạn "Liszt, người được đề tặng": Op. 10 đề tặng "người bạn Franz Liszt".'
    loai: lich-su
    nguon: [ nifc-op10-3, nifc-op10-12, imslp-op10, ptna-460 ]
    ket_qua: dung
    ghi_chu: 'Bản in Pháp: "son Ami J. Liszt" (chữ J. in nhầm, về sau sửa F.); bản in Đức: "SON AMI F. LISZT".'
  - id: n6
    cau: 'Bảng: Thời kỳ Lãng mạn.'
    loai: lich-su
    nguon: [ imslp-op10 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Piece Style=Romantic.'
  - id: n7
    cau: 'Bảng: Thể loại étude cho piano.'
    loai: ten
    nguon: [ imslp-op10 ]
    ket_qua: dung
  - id: n8
    cau: 'Bảng: Độ dài số 3 khoảng 4–5 phút; số 12 khoảng 2,5–3 phút; cả Op. 10 khoảng 30–35 phút.'
    loai: so-lieu
    nguon: [ commons-neeman, ptna-460 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cả Op. 10 khoảng 30 phút". Chữ mới: "khoảng 30–35 phút". Lý do: PTNA ghi 33 phút 30 giây. Bản thu Neeman trên trang: số 3 4 phút 36 giây, số 12 2 phút 45 giây (khớp).'
  - id: n9
    cau: 'Étude nghĩa là "bài luyện".'
    loai: dinh-nghia
    nguon: [ cod-etude ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (cả description): "bài học". Chữ mới: "bài luyện". Lý do: COD "(Fr.). Study … basis for the improvement of the performer''s technique"; thuật ngữ đã khóa của site (thuat-ngu.yml, etude) ghi "Bài luyện".'
  - id: n10
    cau: 'Trước Chopin, étude của Czerny, Cramer hay Clementi chủ yếu là bài luyện ngón cho người học.'
    loai: lich-su
    nguon: [ imslp-czerny-clementi, ptna-460, cod-etude ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (cả description): "là bài luyện ngón: có ích, nhưng hiếm khi được chơi trong hòa nhạc". Lý do: vế "hiếm khi được chơi trong hòa nhạc" không có ở nguồn đã mở; PTNA: các tập étude nửa đầu thế kỷ 19 là "piano instruction books"; IMSLP: Czerny Op. 299 "Übungsstücke … Schnelligkeit der Finger", Clementi Gradus "exercices". Cramer: IMSLP có trang Studio per il pianoforte, chưa đọc chi tiết; lượt 2 nên kiểm.'
  - id: n11
    cau: 'Chopin viết 12 étude Op. 10 khi 19 đến 22 tuổi.'
    loai: nam
    nguon: [ henle-hn124-vorwort, henle-hn124 ]
    ket_qua: dung
    ghi_chu: 'Sinh 1/3/1810; Op. 10 viết 1829–1832.'
  - id: n12
    cau: 'Mỗi bản Op. 10 giải một bài toán kỹ thuật nhưng đồng thời là một tác phẩm trọn vẹn; chúng được viết để chơi cả trên sân khấu hòa nhạc, không chỉ trong phòng tập.'
    loai: lich-su
    nguon: [ cod-etude, henle-hn124 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chúng là những étude đầu tiên trở thành tiết mục hòa nhạc." Chữ mới: "Chúng được viết để chơi cả trên sân khấu hòa nhạc, không chỉ trong phòng tập." Lý do: "đầu tiên" không có nguồn đã mở; COD: "suitable for public perf. as well as private practice were written by Chopin"; Henle: "a new type of virtuosic etude that also makes aesthetic demands".'
  - id: n13
    cau: 'Link "Bài tập ngón và étude" và "các thể loại nhạc piano".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/piano/bai-tap-ngon.md và piano/the-loai.md có.'
  - id: n14
    cau: 'Năm 1833 Chopin viết cho Ferdinand Hiller rằng ông không biết ngòi bút đang viết gì, vì lúc ấy Liszt đang chơi các étude của ông, và ông muốn "đánh cắp" cách Liszt chơi chúng.'
    loai: lich-su
    nguon: [ niecks ]
    ket_qua: dung
    ghi_chu: 'Niecks (thư ngày 20/6/1833, Chopin và Liszt cùng viết): "I write to you without knowing what my pen is scribbling, because Liszt is at this moment playing my studies and transports me out of my proper senses. I should like to rob him of his way of rendering my own studies."'
  - id: n15
    cau: 'Op. 25 (12 bản) in năm 1837, đề tặng bá tước phu nhân Marie d''Agoult, người bạn đời của Liszt.'
    loai: lich-su
    nguon: [ niecks, imslp-op25 ]
    ket_qua: dung
    ghi_chu: 'Niecks: "Oct., 1837. Op. 25 Douze Etudes … Dediées à Mme. la Comtesse d''Agoult"; "the intimate relation in which Liszt stood to this lady". IMSLP: đề tặng Marie d''Agoult, in 1837.'
  - id: n16
    cau: 'Năm 1839 Chopin viết thêm ba étude không số hiệu, Trois nouvelles études.'
    loai: nam
    nguon: [ henle-hn124-vorwort, niecks ]
    ket_qua: dung
    ghi_chu: 'Henle: "the three without opus number in 1839", viết cho "Méthode des Méthodes" của Moscheles và Fétis (in 1840).'
  - id: n17
    cau: 'Biệt danh không phải của Chopin: "Tristesse" cho số 3, "Cách mạng" cho số 12, "Phím đen" cho Op. 10 số 5, "Gió mùa đông" cho Op. 25 số 11 đều do người đời sau đặt.'
    loai: ten
    nguon: [ ia-schirmer, imslp-op10, imslp-op25, henle-hn658 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "\"Tristesse\" (Nỗi buồn) hay \"L''Adieu\" (Lời từ biệt) cho số 3". Bỏ "L''Adieu": không có ở nguồn đã mở. Huneker (Schirmer 1916): "he did not bestow any such titles on his works"; IMSLP ghi các tên Tristesse, Black Keys, Revolutionary, Winter Wind; Henle: étude "has become famous as the Revolutionary Etude".'
  - id: n18
    cau: 'Số 3: bản thảo đầu tiên ghi Vivace, rồi Vivace ma non troppo; đến bản in mới thành Lento ma non troppo (chậm, nhưng không quá), kèm một số máy đếm nhịp.'
    loai: cau-truc
    nguon: [ henle-hn124-bem, ia-schirmer ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…, và ngày nay hầu như ai cũng chơi chậm hơn con số máy đếm nhịp ông ghi." Chữ mới: "…, kèm một số máy đếm nhịp." Lý do: Henle: "A1 has Vivace, A2 Vivace ma non troppo; MM in GE … A1 and A2 lack MM" (số máy đếm nhịp có ở bản in, không ở bản thảo); "hầu như ai cũng chơi chậm hơn" là khái quát không có nguồn. Lento ma non troppo: Schirmer và Henle (bản in Pháp làm gốc).'
  - id: n19
    cau: 'Theo Frederick Niecks, Chopin nói với học trò Adolf Gutmann rằng ông chưa từng viết được giai điệu nào đẹp như thế; có lần nghe Gutmann tập bản này, ông giơ hai tay lên và kêu "Ôi, quê hương tôi!".'
    loai: lich-su
    nguon: [ niecks ]
    ket_qua: dung
    ghi_chu: 'Niecks: "Chopin said to Gutmann that he had never in his life written another such beautiful melody (CHANT); and on one occasion when Gutmann was studying it the master lifted up his arms with his hands clasped and exclaimed: O, my fatherland!".'
  - id: n20
    cau: 'Số 3: giai điệu và phần đệm trong cùng một tay; giai điệu legato ở bè trên do ngón 4 và 5 hát, bè đệm móc kép bên dưới do ngón 1 và 2.'
    loai: cau-truc
    nguon: [ ia-schirmer, ptna-460 ]
    ket_qua: dung
    ghi_chu: 'Bản Schirmer: tay phải có giai điệu và bè móc kép bên dưới; ngón bấm Friedheim cho giai điệu chủ yếu 4, 5 (có chỗ 3), bè dưới 1, 2. PTNA: "handling of both inner voices, and the cantabile expression of the upper voice". Vế "hai ngón yếu nhất" là lời khuyên tập quen thuộc.'
  - id: n21
    cau: 'Số 3: đoạn giữa (poco più animato, từ ô 21) đổi tính chất: giai điệu và đệm hòa thành chuỗi nốt kép.'
    loai: cau-truc
    nguon: [ henle-hn124-bem, ia-schirmer ]
    ket_qua: dung
    ghi_chu: 'Henle: "21: poco piu animato"; ảnh trang tr. 13: hai tay chơi nốt kép móc kép.'
  - id: n22
    cau: 'Số 3: đoạn giữa đi qua một loạt hợp âm bảy giảm căng thẳng, lên đỉnh ở đoạn con bravura với những quãng sáu kép.'
    loai: cau-truc
    nguon: [ ia-schirmer ]
    ket_qua: dung
    ghi_chu: 'Ảnh trang tr. 14 (cắt phóng to đoạn con bravura): hai tay chơi quãng sáu, các nốt Si, Rê, Fa, Sol♯ (hợp âm bảy giảm) rải lên xuống; trước đó tr. 13 chuỗi nốt kép chuyển sắc cresc. molto tới ff. Đoạn cresc. molto quá mờ để đọc từng hợp âm; câu đúng chắc ở đoạn con bravura. Lượt 2 nên đối chiếu bản rõ hơn.'
  - id: n23
    cau: 'Số 3: một hợp âm bảy át kéo dài dẫn về giai điệu, lần này ngắn hơn; kết rất nhỏ.'
    loai: cau-truc
    nguon: [ ia-schirmer ]
    ket_qua: dung
