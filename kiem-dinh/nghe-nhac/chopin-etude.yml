  - cu: Étude của Chopin phần lớn thuộc chặng 7 (sau Grade 8). Phần đầu của số 3 (khoảng 20 ô nhịp) chậm, có thể tập sớm hơn để luyện cân bằng trong một tay; đoạn giữa khó hơn nhiều. Số 12 cần một tay trái đã được rèn kỹ bằng gam và hợp âm rải nhanh. Trước đó, hãy học Nocturne Op. 9 số 2 (bài học có sẵn bản thu và bản đồ nghe) và các étude của Czerny, Cramer. Trois nouvelles études thường được xem là cửa vào dễ hơn cho étude Chopin. Xem Tác phẩm theo cấp độ.
    moi: "Étude Op. 10 và Op. 25 thuộc chặng 7 (sau Grade 8): Henle ghi cả 24 bài ở mức bằng LRSM của ABRSM, độ khó 6–9 trên thang 9. Phần đầu của số 3 (khoảng 20 ô nhịp) chậm, có thể tập sớm hơn để luyện cân bằng trong một tay; đoạn giữa khó hơn nhiều. Số 12 cần một tay trái đã được rèn kỹ bằng gam và hợp âm rải nhanh. Trước đó, hãy học Nocturne Op. 9 số 2 (bài học có sẵn bản thu và bản đồ nghe) và các étude của Czerny, Cramer. Trois nouvelles études nhẹ hơn một chút (Henle: mức 6–7), là cửa vào hợp lý cho étude Chopin. Xem Tác phẩm theo cấp độ."
