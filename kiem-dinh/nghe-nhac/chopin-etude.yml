      - Nghe bằng tai người chơi piano. Ở số 3, legato của giai điệu đến từ cách nối phím và giữ phím, không phải từ cú đánh mạnh; Chopin có ghi bàn đạp, nhưng trên đàn ngày nay người chơi phải thay bàn đạp thường hơn chỗ ông ghi, theo bè trầm và hòa âm. Ở số 12, hãy nghe xem "cơn bão" tay trái có che mất tiếng hô của tay phải không.
    ly_do: "n17: \"L'Adieu\" không có ở nguồn đã mở. n18: khái quát \"hầu như ai cũng chơi chậm hơn\" không có nguồn. n25: Henle HN 658, NIFC. n29 (lời dẫn Cortot không kiểm được), n30 (Chopin có ghi bàn đạp: NIFC, Henle)."
  - cu:
      - "Maurizio Pollini: bản thu trọn hai tập étude của ông là chuẩn mực một thời: chính xác, rõ ràng, kỷ luật."
      - 'Alfred Cortot: tự do, nhiều rubato; ông còn soạn một ấn bản "để tập", kèm bài tập chuẩn bị cho từng étude.'
      - "Murray Perahia: ấm, hát, mềm mại mà vẫn chính xác."
    moi:
      - "Maurizio Pollini: thu trọn hai tập Op. 10 và Op. 25 cho Deutsche Grammophon; nghe độ rõ và độ đều của từng nốt."
      - 'Alfred Cortot: thu Op. 10 năm 1933; ông còn soạn một ấn bản "để tập" có lời bình (édition de travail, Paris, 1915).'
      - "Murray Perahia: thu trọn Op. 10 và Op. 25 (phát hành năm 2002); nghe cách giai điệu hát trên phần đệm."
    ly_do: "n36: bỏ đánh giá không kiểm được. n37: IMSLP. n38: MusicBrainz; bỏ đánh giá."
  - cu: Étude của Chopin phần lớn thuộc chặng 7 (sau Grade 8). Phần đầu của số 3 (khoảng 20 ô nhịp) chậm, có thể tập sớm hơn để luyện cân bằng trong một tay; đoạn giữa khó hơn nhiều. Số 12 cần một tay trái đã được rèn kỹ bằng gam và hợp âm rải nhanh. Trước đó, hãy học Nocturne Op. 9 số 2 (bài học có sẵn bản thu và bản đồ nghe) và các étude của Czerny, Cramer. Trois nouvelles études thường được xem là cửa vào dễ hơn cho étude Chopin. Xem Tác phẩm theo cấp độ.
    moi: "Étude Op. 10 và Op. 25 thuộc chặng 7 (sau Grade 8): Henle ghi cả 24 bài ở mức bằng LRSM của ABRSM, độ khó 6–9 trên thang 9. Phần đầu của số 3 (khoảng 20 ô nhịp) chậm, có thể tập sớm hơn để luyện cân bằng trong một tay; đoạn giữa khó hơn nhiều. Số 12 cần một tay trái đã được rèn kỹ bằng gam và hợp âm rải nhanh. Trước đó, hãy học Nocturne Op. 9 số 2 (bài học có sẵn bản thu và bản đồ nghe) và các étude của Czerny, Cramer. Trois nouvelles études nhẹ hơn một chút (Henle: mức 6–7), là cửa vào hợp lý cho étude Chopin. Xem Tác phẩm theo cấp độ."
