    ghi_chu: 'Chữ cũ: "(số 12 khoảng 1831, số 3 năm 1832)". Chữ mới: "(bản thảo nháp của số 3 đề ngày 25/8/1832)". Lý do: Henle "op. 10 from 1829 to 1832"; NIFC: AI "Paris, 25 August [18]32". Năm 1831 của số 12 chỉ là truyền thuyết (Henle HN 658: "unsubstantiated legend"); bản chép sạch số 12: IX 1832–III 1833 (NIFC). Xem n25. Review D6-L7-gom: lượt 2 không mở được NIFC. Review mở trang nguồn AI của Op. 10 số 3 trên mUltimate Chopin (https://sm.multimatechopin.com/en/composition/26/edition/447/show): "Working autograph … Date: 25 VIII 1832 … The date – Paris, 25 August [18]32 – is written by Chopin''s hand at the top of the first page"; vế 1829–1832 lượt 2 xác nhận. Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/%C3%89tudes,_Op.10_(Chopin,_Fr%C3%A9d%C3%A9ric)", "https://www.henle.de/media/3c/36/51/1690886055/0124-1690886055-sync.pdf" ]
    luot_2_ghi_chu: "Vế 1829–1832 đúng (IMSLP 'Y/D of Comp. 1829-32'; lời tựa Henle HN 124: 'op. 10 from 1829 to 1832'). Vế 'bản thảo nháp của số 3 đề ngày 25/8/1832' không xác nhận được: phần ghi chú Henle chỉ nói A1 ghi Vivace, không ghi ngày; trang NIFC (chopin.nifc.pl) chỉ dựng bằng JavaScript, Wayback tạm ngừng."
    review: dung
  - id: n4
    cau: 'Bảng: Op. 10 in năm 1833 ở Paris và Leipzig, rồi ở London.'
    loai: nam
    nguon: [ nifc-op10-3, henle-hn124-vorwort, niecks ]
    ket_qua: da-sua
    ghi_chu: 'NIFC: FE1 Schlesinger, Paris, VI 1833; GE1 Kistner, Leipzig, VIII 1833; EE Wessel, London, [EE1] VIII 1833 (chưa tìm thấy bản nào; bản còn lại sớm nhất EE2 1835–1836). Niecks: "published in July, 1833". Review D6-L7-gom: lượt 2 khong-chac về năm in ở London. Review mở mUltimate Chopin (trang edition của số 3 và số 12): FE1 Schlesinger VI 1833, GE1 Kistner VIII 1833; bản Wessel: "[EE1] – First impression not found, perhaps different from EE2, VIII 1833", "EE2 – Probably the first English edition, 1835-1836"; IMSLP (lượt 2) ghi bản Wessel khoảng 1834. Năm 1833 ở London chỉ là giả định: bỏ năm của London. Chỉ bỏ vế lượt 2 không xác nhận, không chạy lại. Chữ câu cũ: "Bảng: Op. 10 in năm 1833 ở Paris, Leipzig và London.". doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.henle.de/media/10/02/f2/1697725665/0124-1697725664-sync.pdf", "https://imslp.org/wiki/%C3%89tudes,_Op.10_(Chopin,_Fr%C3%A9d%C3%A9ric)", "https://chopinonline.ac.uk/cfeo/browse/workinformation/6339/" ]
    luot_2_ghi_chu: "Paris (Schlesinger) và Leipzig (Kistner) năm 1833: đúng (Henle, nguồn ghi chú 'FE (M. Schlesinger, Paris, 1833), GE (Fr. Kistner, Leipzig, 1833)'; IMSLP). London: IMSLP ghi bản Wessel 'n.d. (ca.1834?)', CFEO ghi bản Anh sớm nhất còn biết là khoảng 1835–36. Nguồn không thống nhất về năm in ở London."
    review: dung
