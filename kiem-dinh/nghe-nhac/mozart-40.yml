ghi_chu: 'Hướng dẫn nghe Giao hưởng số 40, chương 1 (tầng Tác phẩm; bản ghi tac-pham/mozart-40; loai: nghe là cấu trúc). Không có khối abc. Bản nhạc: tổng phổ Neue Mozart-Ausgabe IV/11/9, phiên bản 2 (có clarinet), trên DME của Mozarteum, ảnh trang 125–146 (ucb12_111_<trang>.jpg), đọc ảnh: Molto Allegro, viola đệm từ ô 1, violin vào ở phách cuối ô 1; đoạn chuyển forte ô 28; chủ đề 2 Si♭ trưởng ô 44 (F–E–E♭–D, đàn dây rồi kèn gỗ); dấu nhắc lại ô 100; phát triển ô 101, chủ đề 1 ở Fa♯ thứ ô 103–105; chủ đề 1 chia nhỏ chuyền giữa violin và kèn gỗ ô 139–; tái hiện ô 164–166; chủ đề 2 ở Sol thứ ô 227; kết ô 299 hợp âm Sol thứ. Lịch sử: Köchel online (KV 550, hai phiên bản 550 (1), 550 (2): nhạc cụ, ngày), IMSLP (wikitext), ghi chú chương trình của Indianapolis Symphony Orchestra và Hollywood Bowl (tổ chức biểu diễn, nguồn bậc 2 như ở hồ sơ nhac-ly/19-at-phu-chuyen-giong). Độ dài: hai bản thu chương 1 trên Wikimedia Commons (API). Sửa: n3, n6, n9, n13, n14, n16, n18, n21, n23. Không có chỗ chưa chắc. Câu ở hồ sơ khác trỏ tới trang này giữ đúng: hinh-thuc/sonata n31 (chủ đề 2 Si♭ trưởng rồi Sol thứ), nhac-ly/19-at-phu-chuyen-giong n27 (trang này nay viết đúng "chuyển giọng đột ngột sang Fa♯ thứ, một giọng xa giọng chính", khớp), n37, n38, nhac-ly/20-doc-tong-pho n21 (chương 1 hình thức sonata), nhac-ly/07-gam-thu n2, n32 (Sol thứ), lich-su/thoi-ky/co-dien n34. Ghi nhận: hinh-thuc/minuet-trio (đã khóa) m26 dẫn trang này làm "hướng dẫn nghe" cho dòng Giao hưởng số 40, chương 3, trong khi trang này chỉ nói chương 1; câu ở minuet-trio chỉ nói có hướng dẫn nghe tác phẩm, không sai, nhưng người đọc có thể chờ chương 3 (không sửa ở lô này). Không tính là nhận định: tiêu đề mục, tiêu đề cột, ::hinh-cau-truc và ::khoi-nghe (thuộc hồ sơ bản ghi). Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: đoạn chuyển (transition), chủ đề 1/chủ đề 2 (first/second subject), kèn gỗ (woodwind), giọng xa (remote key), "giọng trưởng song song" (theo lựa chọn ở d6-l1-gom, nghĩa relative). Đã có: sonata form, exposition, development, recapitulation, coda, fragmentation (chia nhỏ), forte, modulation.'
nguon:
  - id: nma-550
    bac: 1
    ten: 'Neue Mozart-Ausgabe IV/11/9, Sinfonie in g KV 550 (2. Fassung), tổng phổ, ảnh trang 125–146 trên Digital Mozart Edition (Stiftung Mozarteum): "Molto Allegro", "Entstanden Wien, um 1788–1791"; bản 1 bắt đầu ở trang 63'
    link: https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=111&p1=125
  - id: kv-550
    bac: 2
    ten: 'Köchel-Verzeichnis online, KV 550: "Dating Vienna, 25.07.1788"; "a series of three symphonies composed in the summer of 1788, among them the so-called “Jupiter” Symphony, KV 551"; KV 550 (1) FIRST VERSION, 1788: "fl, ob1+ob2, fag1+fag2, cor1 (Si♭ alto), cor2 (Sol), vl1, vl2, vla, vlc+b"; KV 550 (2) SECOND VERSION, 1788–1791: "fl, ob1+ob2, clar1+clar2 (Si♭), fag1+fag2, …"'
    link: https://kv.mozarteum.at/en/work/symphony-in-g-minor-11586
  - id: imslp-550
    bac: 2
    ten: 'IMSLP, Symphony No.40 in G minor, K.550 (wikitext qua api.php): "Year/Date of Composition=1788 (completed 25 July, revised 1788-91)", "Piece Style=Classical", chương 1 "Molto allegro", "2 clarinets (2nd version)"'
    link: https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)
  - id: iso-40
    bac: 2
    ten: 'Indianapolis Symphony Orchestra, ghi chú chương trình Symphony No. 40 (Marianne Williams Tobias): "Mozart wrote only two symphonies in a minor key, one in 1773 and the other in 1788 … both are written in G minor"; "between June 28 and August 10 wherein he composed his last three symphonies: 39, 40, and 41"; "There are two versions of this work: one with clarinets (the second) and the first without"'
    link: https://www.indianapolissymphony.org/backstage/program-notes/mozart-symphony-no-40/
  - id: hb-183
    bac: 2
    ten: 'Hollywood Bowl, ghi chú Symphony No. 25 in G minor, K. 183: "the first of the younger composer''s two symphonies in that dark key (the second is, of course, the super-familiar No. 40)"'
    link: https://www.hollywoodbowl.com/musicdb/pieces/3947/symphony-no-25-in-g-minor-k-183
  - id: commons-550
    bac: 2
    ten: 'Wikimedia Commons (API imageinfo, độ dài): "Mozart Symphony 40 G minor - 1 Molto allegro.oga" (Tsumugi Orchestra, CC BY 3.0) 476,18 giây; "Wolfgang Amadeus Mozart - Symphony 40 g-moll - 1. Molto allegro.ogg" (Fulda Symphonic Orchestra) 493,2 giây; "… K550 - I. Molto allegro (Musopen Symphony).flac" 358,8 giây'
    link: https://commons.wikimedia.org/wiki/File:Mozart_Symphony_40_G_minor_-_1_Molto_allegro.oga
  - id: cod-sonata-form
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "sonata form": "exposition (containing first subject, in tonic key, and 2nd subject, in dominant …), often repeated and followed by 2. development … and 3. recapitulation (… with the 2nd subject now in the tonic). The recapitulation has a coda"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sonata-form
  - id: loc-mozart
    bac: 2
    ten: 'Library of Congress, n81018421 (JSON): "Mozart, Wolfgang Amadeus, 1756-1791"'
    link: https://id.loc.gov/authorities/names/n81018421.json
