- id: h1
  cau: 'Hình bolero, nhãn dưới trục: Sáo, Clarinet, Bassoon, Clarinet Mi♭, Oboe d''amore, Trumpet + sáo, Saxophone, Horn + celesta + piccolo, …, Cả dàn nhạc (thứ tự nhạc cụ chơi giai điệu).'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: dung
  ghi_chu: 'Khớp tổng phổ: tr. 1, số tập 1–8, rồi các nhóm, cuối là cả dàn nhạc (xem n12–n22). "Saxophone" gộp tenor và sopranino/soprano (số tập 6, 7). Chữ ở src/components/hinh/bolero.html.'
- id: h2
  cau: 'Hình bolero: crescendo bắt đầu từ pp.'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: dung
  ghi_chu: 'Tr. 1: tambour, đàn dây pizz., sáo đều pp.'
- id: h3
  cau: 'Hình bolero: crescendo lên tới ff.'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: da-sua
  ghi_chu: 'Chủ lô sửa src/components/hinh/bolero.html: chữ cũ "fff", chữ mới "ff" (hình tĩnh có data-sinh, so-chu không so nên không có mục doi_chu; ghi ở đây theo AGENTS.md mục Hình tĩnh). Lượt 1: trong các trang tổng phổ đã đọc (tr. 53–66), dấu mạnh nhất thấy được là ff ("ff possibile" của trombone ở số tập 17, ff bộ gõ tr. 65); không thấy fff. Bhogal và trang (n9) chỉ nói tới fortissimo. Không sửa file hình (lời giao). Đề nghị người giao: chữ cũ "fff" → chữ mới "ff" trong src/components/hinh/bolero.html (và ghi doi_chu), nếu lượt 2 cũng không thấy fff.'
- id: h4
  cau: 'Hình bolero, vạch đỏ gần cuối: "chuyển sang Mi trưởng, rồi đổ sụp".'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: dung
  ghi_chu: 'Số tập 18 Mi trưởng (Bhogal "the shift to E major at Rehearsal 18"); kết đổ sụp ở hai ô cuối (xem n23). Hình không nói việc về Đô trưởng, nhưng không sai.'
- id: h5
  cau: 'Hình bolero, chú thích dưới: "Trống snare giữ cùng một tiết tấu tới hai ô cuối; giai điệu A và B chuyền qua các nhạc cụ."'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: da-sua
  ghi_chu: 'Chủ lô sửa src/components/hinh/bolero.html: chữ cũ "từ đầu đến cuối", chữ mới "tới hai ô cuối" (khớp n7 của trang). Lượt 1: vế giai điệu A, B đúng (n8). Vế snare: tổng phổ tr. 66 tambour đổi hình ở hai ô cuối (như n7, đã sửa trên trang). Không sửa file hình. Đề nghị: chữ cũ "Trống snare giữ cùng một tiết tấu từ đầu đến cuối;" → chữ mới "Trống snare giữ cùng một tiết tấu gần như từ đầu đến cuối;" (hay "… tới hai ô cuối;"), ghi doi_chu. Nếu người giao coi "từ đầu đến cuối" là cách nói gần đúng chấp nhận được thì ghi dung.'
- id: h6
  cau: 'Hình bolero, nhãn và chú thích: "Boléro: một crescendo kéo dài suốt tác phẩm, giai điệu chuyền lần lượt từ sáo, clarinet, bassoon… đến cả dàn nhạc; gần cuối chuyển giọng một lần rồi kết"; "Boléro: âm sắc và cường độ thay đổi, mọi thứ khác gần như đứng yên."'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: dung
  ghi_chu: 'Khớp n6, n8, n9, n10 (lời Ravel: "the only element of variety is provided by the orchestral crescendo").'
doi_chu:
- cu:
  - '1928, cho vũ công Ida Rubinstein'
  - '22/11/1928, Nhà hát Opéra, Paris (dạng ballet)'
  moi:
  - '1928, nhạc cho vở ballet của vũ công Ida Rubinstein (bản tổng phổ đề tặng bà); Durand in năm 1929'
  - '22/11/1928, Nhà hát Opéra (Palais Garnier), Paris, dạng ballet; nhạc trưởng Walther Straram'
  ly_do: 'n2, n3: IMSLP, tổng phổ Durand, Bhogal.'
- cu: 'Một tiết tấu trống snare lặp lại không ngừng từ đầu đến cuối;'
  moi: 'Một tiết tấu trống snare lặp lại không ngừng từ ô đầu tiên, chỉ đổi ở hai ô cuối;'
  ly_do: 'n7: tổng phổ Durand tr. 66.'
- cu: 'Ravel tự nhận đây chủ yếu là một bài tập về phối khí, gần như "không có âm nhạc" theo nghĩa thông thường. Chính vì vậy, Boléro là bài học nhận biết nhạc cụ hay nhất có thể có: cùng một giai điệu, chỉ thay đổi âm sắc.'
  moi: 'Chính Ravel gọi bản nhạc là "một thí nghiệm theo một hướng rất đặc biệt và hẹp", và nói nó chỉ là "mô dệt của dàn nhạc, không có âm nhạc": điều thay đổi duy nhất là phối khí và cường độ. Chính vì vậy, Boléro là một bài luyện nhận biết nhạc cụ rất tốt: cùng một giai điệu, chỉ thay đổi âm sắc.'
  ly_do: 'n10, n11: lời Ravel theo Bhogal (MTO 26.2); bỏ so sánh nhất.'
- cu:
  - 'Clarinet Mi♭ nhỏ, âm sắc chói'
  - 'Oboe d''amore (oboe trầm, êm)'
  - 'Saxophone sopranino và soprano'
  - 'Kèn horn, celesta và hai piccolo chơi song song ở các quãng của chuỗi bồi âm: tạo ra một âm sắc mới như đàn organ'
  moi:
  - 'Clarinet Mi♭ (theo tổng phổ: petite clarinette, clarinet nhỏ)'
  - 'Oboe d''amore (một loại oboe, do người chơi oboe thứ hai đổi sang)'
  - 'Saxophone sopranino rồi soprano (theo tổng phổ; khi biểu diễn, người chơi thường dùng saxophone soprano cho cả hai)'
  - 'Kèn horn, celesta và hai piccolo chơi song song ở các quãng của chuỗi bồi âm: nghe như một nhạc cụ mới, không có thật'
  ly_do: 'Bảng Theo dõi khi nghe, n15, n16, n19, n20: tổng phổ Durand, IMSLP, Bhogal. Số dòng giữ 12.'
- cu: 'Đoạn horn, celesta và piccolo là phép màu phối khí nổi tiếng: Ravel dùng chuỗi bồi âm (bồi âm 1, 2, 3, 4, 5) để "tổng hợp" một âm sắc nhân tạo. Bạn nghe thấy một nhạc cụ hay năm nhạc cụ?'
  moi: 'Ở đoạn horn, celesta và piccolo, Ravel dùng chuỗi bồi âm: horn chơi giai điệu (bồi âm 1), celesta chơi ở bồi âm 2 và 4, hai piccolo ở bồi âm 3 và 5, để "tổng hợp" một âm sắc nhân tạo. Bạn nghe thấy một nhạc cụ hay năm bè nhạc cụ?'
  ly_do: 'n24: Bhogal, tổng phổ Durand tr. 19.'
- moi:
  - 'Tổng phổ: Durand 1929 (đề tặng Ida Rubinstein), bản quét trên Internet Archive (từ IMSLP); năm, buổi công diễn đầu, biên chế trên IMSLP.'
  - 'Lời Ravel và phân tích phối khí: Gurminder K. Bhogal, "Orchestral Tissue, Subordinate Arabesques, and Turning Inward in Maurice Ravel''s Boléro", Music Theory Online 26.2 (2020).'
  ly_do: 'n30: thêm nguồn đã đọc.'
