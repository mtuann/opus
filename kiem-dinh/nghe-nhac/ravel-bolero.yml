tang: tac-pham
lan:
- so: 1
  ngay: 2026-11-06
  nhanh: moi/d6-l11
  ma_bam:
  nguoi:
    luot_1: "Claude Opus 5.5 (D6-L11 lượt 1, phần B)"
    luot_2:
    review:
    kiem_mau:
ghi_chu: 'Hướng dẫn nghe Boléro (tầng Tác phẩm; bản ghi tac-pham/ravel-bolero; loai: nghe là cấu trúc). Hết bảo hộ ở Việt Nam (Ravel mất 1937) và Mỹ (in 1929). Bản nhạc: tổng phổ Durand 1929 (D. & F. 11 839, đề "à Ida Rubinstein") quét trên Internet Archive (từ IMSLP 104723), đọc ảnh từng trang 06/11/2026: số tập 1 clarinet, 2 bassoon, 3 petite clarinette Mi♭, 4 hautbois d''amour, 5 sáo và trumpet có sourdine, 6 sax tenor, 7 sax sopranino rồi soprano, 8 horn solo + 2 petites flûtes + célesta, 9 kèn gỗ, 10 trombone solo, 11 kèn gỗ và sax, 12 trở đi đàn dây, 18 chuyển Mi trưởng. Không có khối abc. ::hinh{ten="bolero"} là hình tĩnh src/components/hinh/bolero.html: tách chữ thành h1–h6 (không sửa file hình; h3 và h5 cần người giao quyết, xem ghi chú). ::khoi-nghe không có bản thu (không sửa). Không tính là nhận định: tiêu đề mục, tiêu đề cột. Câu ở hồ sơ khác trỏ tới trang này: nhac-cu/index n32, nghe-nhac/mussorgsky-tranh n46 (giữ: trang nói về phối khí của Ravel), nhan-dien/the-loai n35 (trang có, có saxophone), nhan-dien/dau-van-tay n52, lich-su/thoi-ky/the-ky-20 n29; nhac-cu/dan-nhac d26 (hai giai điệu lặp, mỗi lần một nhạc cụ hay nhóm khác) khớp n8; cap-nhat n118 ("crescendo của Boléro") khớp hình. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: phối khí (orchestration), bồi âm, chuỗi bồi âm (harmonic series), trống snare, oboe d''amore, celesta, piccolo, saxophone sopranino/soprano/tenor, câm tiếng cho trumpet (có con-sordino). Có bản ghi: crescendo, pianissimo, fortissimo, pizzicato, modulation (chuyển giọng).'
nguon:
- id: durand-1929
  bac: 1
  ten: 'Ravel, Boléro, tổng phổ, Durand & Cie, Paris, 1929 (Copyright 1929, D. & F. 11 839, đề tặng "à Ida Rubinstein"), bản quét IMSLP 104723 (cropped) trên Internet Archive, đọc ảnh 67 trang 06/11/2026. Trang danh mục nhạc cụ: "2 Hautbois (le 2e prenant le Hautbois d''amour)", "Petite Clarinette en Mi♭", "3 Saxophones: (Sopranino en Fa, Soprano en Si♭, Ténor en Si♭)", "2 Tambours", "Célesta". Tr. 1: "Tempo di Bolero, moderato assai", tambour pp, altos và violoncelles pizz. pp, sáo 1 "Solo" pp. Số tập 1 clarinet; 2 bassoon (âm vực cao); 3 "Pte Cl."; 4 "Hautb. d''amour Solo"; 5 sáo 1 pp + trumpet "Sord. Solo" mp; 6 "Sax. T." "Solo mp espressivo, vibrato"; 7 "Sopranino Sax." rồi "Sax. Soprano"; 8 cor "Solo" mf, "Ptes Fl." hai khuông (một khuông bốn dấu thăng, một khuông một dấu thăng) pp, célesta hai khuông p; 9 hautbois, hautbois d''amour, cor anglais, clarinettes; 10 "1er Tromb. Solo mf sostenuto"; 11 sáo, piccolo, oboe, cor anglais, clarinet, sax tenor; 12 trở đi violin cùng kèn gỗ; 17 trombone "ff possibile"; 18 các dấu thăng của Mi trưởng; trang cuối: tambour đổi hình ở hai ô cuối, ô cuối là một hợp âm rồi dấu lặng'
  link: https://archive.org/details/imslp-104723-pmlp-03667-ravel-bolero-cropped
- id: imslp-bolero
  bac: 2
  ten: 'IMSLP, Boléro, M.81 (wikitext qua api.php, 06/11/2026): "Key=C"; "Tempo di Bolero. Moderato assai (340 bars)"; "Dedication=Ida Rubinstein"; "Year/Date of Composition=1928"; "Year of First Publication=1929 - Paris: Durand"; "First Performance=1928-11-22 in Paris: Palais Garnier. Orchestre de l''Opéra, Walther Straram (conductor)"; "Average Duration=15 minutes"; "Piece Style=Early 20th century"; "The saxophone parts are usually played by two players: the first playing the sopranino and soprano passages with a soprano saxophone"'
  link: https://imslp.org/wiki/Bol%C3%A9ro,_M.81_(Ravel,_Maurice)
- id: bhogal
  bac: 2
  ten: 'Gurminder K. Bhogal, "Orchestral Tissue, Subordinate Arabesques, and Turning Inward in Maurice Ravel’s Boléro", Music Theory Online 26.2 (2020): "Following the success of his ballet Boléro in 1928"; Ravel "described [it] as ‘an experiment in a very special and limited direction’ to Michel-Dimitri Calvocoressi"; "orchestral tissue without music"; "one long, very gradual crescendo. There are no contrasts, and there is practically no invention except the plan and the manner of the execution"; "the only element of variety is provided by the orchestral crescendo"; Rubinstein ban đầu nhờ Ravel phối Iberia "in providing the music for her ballet"; hai giai điệu luân phiên; "a decorative melody, which is given to the flute and played pianissimo"; "the high register of the bassoon"; "doubling the decorative melody between the flute and muted trumpet at Rehearsal 5"; "at Rehearsal 8 … pianissimo piccolos reinforce the third and fifth partials of the mezzo forte French horn, while the piano celesta reinforces partials 2 and 4"; "the effect of ‘an illusory instrument’"; "the shift to E major at Rehearsal 18"; "sopranino saxophone in F but this instrument has never been used in performance"'
  link: https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html
- id: loc-bolero
  bac: 2
  ten: 'Library of Congress, bản ghi n81022437: "Ravel, Maurice, 1875-1937. Bolero, orchestra" (New Grove: Boléro; ballet; 1928)'
  link: https://id.loc.gov/authorities/names/n81022437.json
- id: mb-bolero
  bac: 2
  ten: 'MusicBrainz, tìm bản thu "Boléro" của Ravel (06/11/2026): bản cho dàn nhạc dài 13,1–17,7 phút, phần lớn 13,8–16,3 phút; bản Ravel chỉ huy Orchestre Lamoureux 16,2 phút'
  link: https://musicbrainz.org/ws/2/recording/?query=recording:Bol%C3%A9ro%20AND%20artist:Ravel&fmt=json&limit=100
nhan_dinh:
- id: n1
  cau: 'Bảng: Maurice Ravel (1875–1937).'
  loai: nam
  nguon: [loc-bolero]
  ket_qua: dung
  ghi_chu: 'LoC "Ravel, Maurice, 1875-1937". Khớp nha-soan-nhac.yml (ravel, đã khóa).'
- id: n2
  cau: 'Bảng: sáng tác năm 1928, nhạc cho vở ballet của vũ công Ida Rubinstein (bản tổng phổ đề tặng bà); Durand in năm 1929.'
  loai: nam
  nguon: [imslp-bolero, durand-1929, bhogal]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "1928, cho vũ công Ida Rubinstein". IMSLP: sáng tác 1928, đề tặng Ida Rubinstein, in 1929 ở Durand; tổng phổ ghi "à Ida Rubinstein", Copyright 1929; Bhogal: Rubinstein nhờ Ravel viết nhạc cho ballet của bà. Viết rõ quan hệ và năm in.'
- id: n3
  cau: 'Bảng: công diễn 22/11/1928 ở Nhà hát Opéra (Palais Garnier), Paris, dạng ballet; nhạc trưởng Walther Straram.'
  loai: nam
  nguon: [imslp-bolero, loc-bolero]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "22/11/1928, Nhà hát Opéra, Paris (dạng ballet)". IMSLP: "1928-11-22 in Paris: Palais Garnier. Orchestre de l''Opéra, Walther Straram"; LoC (New Grove): ballet. Thêm tên nhà hát và nhạc trưởng.'
- id: n4
  cau: 'Bảng: thời kỳ Thế kỷ 20.'
  loai: lich-su
  nguon: [imslp-bolero]
  ket_qua: dung
  ghi_chu: 'IMSLP "Piece Style=Early 20th century".'
- id: n5
  cau: 'Bảng: độ dài khoảng 14–17 phút tùy nhạc trưởng.'
  loai: so-lieu
  nguon: [mb-bolero, imslp-bolero]
  ket_qua: dung
  ghi_chu: 'MusicBrainz: phần lớn 13,8–16,3 phút (một bản 13,1, ba bản trên 17); IMSLP trung bình 15 phút; Bhogal dẫn Ravel nói "seventeen-minute".'
- id: n6
  cau: 'Boléro là một thí nghiệm: gần như không có phát triển, không có chuyển giọng (trừ một lần ở cuối), không có tương phản.'
  loai: cau-truc
  nguon: [bhogal, durand-1929]
  ket_qua: dung
  ghi_chu: 'Ravel (Bhogal): "an experiment"; "There are no contrasts, and there is practically no invention except the plan". Tổng phổ: Đô trưởng suốt bài (không dấu hóa), chỉ số tập 18 có các dấu thăng của Mi trưởng (Bhogal: "the shift to E major at Rehearsal 18"), rồi về Đô.'
- id: n7
  cau: 'Một tiết tấu trống snare lặp lại không ngừng từ ô đầu tiên, chỉ đổi ở hai ô cuối.'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "lặp lại không ngừng từ đầu đến cuối". Tổng phổ: tambour pp từ ô 1; trang cuối (tr. 66), ô áp chót tambour đổi hình, ô cuối chỉ một tiếng rồi dấu lặng. Sửa cho đúng bản nhạc. Chữ hình bolero có cùng vế (h5).'
- id: n8
  cau: 'Hai giai điệu (gọi là A và B) luân phiên nhau, mỗi lần do một nhạc cụ hoặc một nhóm nhạc cụ khác chơi; giai điệu chuyển qua lần lượt các nhạc cụ.'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: dung
  ghi_chu: 'Bhogal: hai giai điệu ("decorative melody", "arabesque melody") luân phiên; tổng phổ: mỗi số tập một nhạc cụ hay nhóm khác (xem n12–n23). Gộp câu dẫn bảng "Giai điệu chuyển qua lần lượt các nhạc cụ".'
- id: n9
  cau: 'Một crescendo duy nhất kéo dài suốt tác phẩm, từ pianissimo đến fortissimo.'
  loai: cau-truc
  nguon: [bhogal, durand-1929]
  ket_qua: dung
  ghi_chu: 'Ravel (Bhogal): "one long, very gradual crescendo". Tổng phổ: mở đầu pp (tambour, đàn dây pizz., sáo); số tập 17 trombone "ff possibile", tr. 65 bộ gõ ff.'
- id: n10
  cau: 'Ravel gọi bản nhạc là "một thí nghiệm theo một hướng rất đặc biệt và hẹp" và nói nó chỉ là "mô dệt của dàn nhạc, không có âm nhạc": điều thay đổi duy nhất là phối khí và cường độ.'
  loai: lich-su
  nguon: [bhogal]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ravel tự nhận đây chủ yếu là một bài tập về phối khí, gần như "không có âm nhạc" theo nghĩa thông thường." Bhogal dẫn: "an experiment in a very special and limited direction" (thư gửi Calvocoressi), "orchestral tissue without music" (phỏng vấn), "the only element of variety is provided by the orchestral crescendo". Dịch sát lời Ravel; "bài tập về phối khí" không phải lời của Ravel.'
- id: n11
  cau: 'Vì vậy Boléro là một bài luyện nhận biết nhạc cụ rất tốt: cùng một giai điệu, chỉ thay đổi âm sắc.'
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
  ghi_chu: 'Chữ cũ: "bài học nhận biết nhạc cụ hay nhất có thể có" (so sánh nhất, không có nguồn): bỏ "hay nhất", viết "rất tốt". Vế "cùng giai điệu, chỉ đổi âm sắc" khớp n8, n10.'
- id: n12
  cau: 'Theo dõi, dòng 1: A, sáo, rất nhỏ, trên nền snare và pizzicato đàn dây.'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: dung
  ghi_chu: 'Tổng phổ tr. 1: sáo 1 "Solo" pp; tambour pp; altos, violoncelles pizz. pp. Bhogal: "given to the flute and played pianissimo".'
- id: n13
  cau: 'Theo dõi, dòng 2: A, clarinet.'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: dung
  ghi_chu: 'Số tập 1, tr. 3: clarinet 1 "Solo".'
- id: n14
  cau: 'Theo dõi, dòng 3: B, bassoon ở âm vực cao.'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: dung
  ghi_chu: 'Số tập 2, tr. 5: bassoon 1 "Solo" mp; Bhogal: "the high register of the bassoon".'
- id: n15
  cau: 'Theo dõi, dòng 4: B, clarinet Mi♭ (theo tổng phổ: petite clarinette, clarinet nhỏ).'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Clarinet Mi♭ nhỏ, âm sắc chói". Số tập 3, tr. 7: "Pte Cl." Solo p; danh mục: "Petite Clarinette en Mi♭". Bỏ "âm sắc chói" (lời bình), ghi tên trong tổng phổ.'
- id: n16
  cau: 'Theo dõi, dòng 5: A, oboe d''amore (một loại oboe, do người chơi oboe thứ hai đổi sang).'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Oboe d''amore (oboe trầm, êm)". Số tập 4, tr. 9: "Hautb. d''amour Solo" mp; danh mục: "2 Hautbois (le 2e prenant le Hautbois d''amour)". Chưa mở được nguồn cho "trầm, êm": thay bằng điều tổng phổ ghi.'
- id: n17
  cau: 'Theo dõi, dòng 6: A, trumpet có câm tiếng và sáo.'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: dung
  ghi_chu: 'Số tập 5, tr. 11: sáo 1 pp, "1re Tromp. Sord. Solo" mp. Bhogal: "between the flute and muted trumpet at Rehearsal 5".'
- id: n18
  cau: 'Theo dõi, dòng 7: B, saxophone tenor.'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: dung
  ghi_chu: 'Số tập 6, tr. 14: "Sax. T. Solo mp espressivo, vibrato".'
- id: n19
  cau: 'Theo dõi, dòng 8: B, saxophone sopranino rồi soprano (theo tổng phổ); khi biểu diễn, người chơi thường dùng saxophone soprano cho cả hai.'
  loai: cau-truc
  nguon: [durand-1929, imslp-bolero, bhogal]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Saxophone sopranino và soprano". Số tập 7, tr. 16: "Sopranino Sax." Solo, tr. 17 "Soprano Sax." nối tiếp. IMSLP: "the first playing the sopranino and soprano passages with a soprano saxophone"; Bhogal: sopranino "has never been used in performance". Thêm ghi chú để người nghe không tìm tiếng sopranino.'
- id: n20
  cau: 'Theo dõi, dòng 9: A, kèn horn, celesta và hai piccolo chơi song song ở các quãng của chuỗi bồi âm, nghe như một nhạc cụ mới, không có thật.'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…tạo ra một âm sắc mới như đàn organ". Số tập 8, tr. 19: cor "Solo" mf, "Ptes Fl." hai khuông pp (Mi trưởng và Sol trưởng), célesta p. Bhogal: piccolo củng cố bồi âm 3 và 5 của horn, celesta bồi âm 2 và 4; "the effect of ‘an illusory instrument’" (dẫn Jennifer Beavers). Không có nguồn cho so sánh với đàn organ: thay theo Bhogal.'
- id: n21
  cau: 'Theo dõi, dòng 10: A, B luân phiên; các nhóm nhạc cụ ngày càng đông: kèn gỗ, trombone, rồi đàn dây.'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: dung
  ghi_chu: 'Số tập 9 (tr. 23): oboe, oboe d''amore, cor anglais, clarinet (A); 10 (tr. 27): trombone solo (B); 11 (tr. 32): kèn gỗ và sax tenor (B); 12 trở đi: violin vào cùng kèn gỗ (A), đàn dây ngày càng nhiều.'
- id: n22
  cau: 'Theo dõi, dòng 11: A rồi B, cả dàn nhạc, fortissimo.'
  loai: cau-truc
  nguon: [durand-1929]
  ket_qua: dung
  ghi_chu: 'Tr. 56–62: mọi bè chơi (kèn gỗ, kèn đồng, sax, đàn dây); số tập 17 trombone "ff possibile".'
- id: n23
  cau: 'Theo dõi, dòng 12: kết; lần chuyển giọng duy nhất sang Mi trưởng, rồi về Đô trưởng; toàn bộ âm nhạc đổ sụp trong vài ô nhịp.'
  loai: cau-truc
  nguon: [durand-1929, bhogal]
  ket_qua: dung
  ghi_chu: 'Số tập 18 (tr. 63): các dấu thăng của Mi trưởng; Bhogal: "the shift to E major at Rehearsal 18", "formal collapse". Tr. 65–66 về Đô (không còn dấu thăng), ô cuối một hợp âm của cả dàn nhạc rồi dấu lặng.'
- id: n24
  cau: 'Câu hỏi 1: ở đoạn horn, celesta và piccolo, horn chơi giai điệu (bồi âm 1), celesta ở bồi âm 2 và 4, hai piccolo ở bồi âm 3 và 5, để "tổng hợp" một âm sắc nhân tạo.'
  loai: cau-truc
  nguon: [bhogal, durand-1929]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đoạn horn, celesta và piccolo là phép màu phối khí nổi tiếng: Ravel dùng chuỗi bồi âm (bồi âm 1, 2, 3, 4, 5) …". Bhogal: "piccolos reinforce the third and fifth partials of the … French horn, while the … celesta reinforces partials 2 and 4". Đọc tổng phổ tr. 19 ô đầu: horn Fa viết Sol5 (nghe Đô5), celesta Đô5 và Đô6 viết (nghe Đô6, Đô7 = bồi âm 2, 4), piccolo Sol5 và Mi6 viết (nghe Sol6, Mi7 = bồi âm 3, 5). Bỏ "phép màu … nổi tiếng" (lời bình), ghi rõ nhạc cụ nào ở bồi âm nào; "năm nhạc cụ" thành "năm bè nhạc cụ" (horn 1 bè, celesta 2, piccolo 2).'
