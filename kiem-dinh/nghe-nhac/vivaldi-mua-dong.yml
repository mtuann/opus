  - cu: 'Ở chương 1, Vivaldi "vẽ" cái rét bằng thủ pháp dàn nhạc rất trực quan: những nốt lặp lại đều đều chồng lên nhau thành hợp âm chói tai như người run cầm cập; những chuỗi nốt chạy rất nhanh của violin độc tấu như gió buốt; những nốt lặp dồn dập như chân giậm và răng va lập cập. Chương 1 cũng viết theo hình thức ritornello như Mùa xuân — hãy so sánh hai chương 1 với nhau.'
