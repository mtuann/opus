  - mutopia-351
  - boston
  ket_qua: dung
  ghi_chu: 'Ô 12–19: violin độc tấu nốt móc ba "Orrido Vento"; Boston Baroque: "blasts of ''horrible wind'' in the solo violin".'
- id: n18
