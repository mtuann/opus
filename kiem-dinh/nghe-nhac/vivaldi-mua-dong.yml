  loai: cau-truc
  nguon:
  - mutopia-351
  - boston
  ket_qua: dung
  ghi_chu: 'Ô 22½ "Correre, e Batter li Piedi per il freddo" (cả dàn nhạc nốt lặp dồn); ô 47 "Batter li denti" (violin độc tấu nốt kép rung nhanh, dàn nhạc nốt móc đơn lặp). Boston: "are marked in the score".'
- id: n19
  cau: Chương 1 cũng viết theo hình thức ritornello như Mùa xuân.
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: dung
  ghi_chu: 'Tổng phổ: chất liệu nốt lặp của cả dàn nhạc ở ô 1–11 quay lại ở ô 19–22 và ô 39–43; chất liệu "giậm chân" ô 22½–26 quay lại ở ô 56–64; xen giữa là các đoạn violin độc tấu.'
- id: n20
  cau: Link Mùa xuân dẫn tới /opus/nghe-nhac/vivaldi-mua-xuan/.
  loai: ve-site
