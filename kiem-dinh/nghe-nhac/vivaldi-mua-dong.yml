ghi_chu: 'Hướng dẫn nghe Mùa đông, chương 1 (tầng Tác phẩm). Bản nhạc: tổng phổ Mutopia 351 (theo Performers'' Facsimiles, tức bản in Le Cène), đọc .ly và ảnh PDF, chương 1 có 64 ô; sonnet theo Mutopia. Lịch sử: IMSLP (RV 297, Op. 8), Boston Baroque. Sửa trang: năm sáng tác (n5: hai nguồn khác nhau, viết chung lại); thêm nhà in Le Cène (n6); câu "nốt lặp chồng lên nhau" thêm "từng bè lần lượt vào" (n16); bốn dòng bảng Theo dõi (n23, n26, n27, n28): bỏ "hợp âm dằn mạnh" (không có trong bản nhạc), đoạn "răng va" là chất liệu mới của violin độc tấu chứ không phải "quay lại ... ở Fa thứ", phần kết là dàn nhạc trở lại đoạn "giậm chân" rồi hai lần kết V–i; thêm dòng Mutopia ở mục Nguồn (n31). Số dòng bảng (6) giữ nguyên; trang không có mốc. Chưa chắc: n32 (sách in). Ghi cho người giao: Commons có bản thu chương 1 của John Harrison (cùng bộ với bản Mùa xuân), nếu muốn thêm ban_thu và mốc (n22). Câu ở hồ sơ khác: nhac-ly/29-chuoi-hoa-am n23 (hướng dẫn nghe Concerto Mùa đông Op. 8 số 4): trang giữ đường dẫn và tên. Thuật ngữ: trill (láy rền), cadence (kết; "kết trọn" theo nhac-ly/13-ket) có trong thuat-ngu.yml; chưa có (cho D3-L5): ritornello, sonnet, bè trầm liên tục (basso continuo), tutti, allegro non molto.'
