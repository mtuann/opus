- id: n16
  cau: Ở chương 1, những nốt lặp lại đều đều của từng bè lần lượt vào, chồng lên nhau thành hợp âm chói tai như người run cầm cập.
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "những nốt lặp lại đều đều chồng lên nhau thành hợp âm chói tai". Chữ mới thêm "của từng bè lần lượt vào". Lý do: tổng phổ Mutopia: cello và organ vào ô 1, viola ô 2, violin 2 ô 3, violin 1 và violin độc tấu ô 4; bè trầm ghi số 6/4/2, 7/5 (hợp âm bảy, nghịch). Phần "chồng lên nhau thành hợp âm chói tai" đúng.'
- id: n17
  cau: Những chuỗi nốt chạy rất nhanh của violin độc tấu như gió buốt.
  loai: cau-truc
