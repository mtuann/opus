- id: n21
  cau: 'Hai concerto là một cặp đối xứng: xuân–đông, trưởng–thứ.'
  loai: cau-truc
  nguon:
  - imslp-rv297
  - imslp-rv269
  ket_qua: dung
  ghi_chu: Phần trưởng–thứ theo n11; "ấm–lạnh" là theo nội dung sonnet.
- id: n22
  cau: 'Mục Nghe kèm bản thu không có bản thu gợi ý (::khoi-nghe không mốc): người học tự dán link hay chọn file.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/data/tac-pham.yml: vivaldi-mua-dong không có ban_thu; khối ::khoi-nghe không có moc. Ghi cho người giao: Commons có bản thu chương 1 của John Harrison (208,8 giây, CC BY-SA 4.0, cùng bộ với bản Mùa xuân đang dùng), nếu muốn thêm ban_thu sau.'
- id: n23
  cau: 'Bảng theo dõi, dòng 1: mở đầu, cả dàn nhạc: những nốt lặp lại đều đều, các bè lần lượt vào và chồng lên nhau thành hợp âm chói tai; violin độc tấu thêm những nốt láy rền. Câu thơ: run cầm cập giữa tuyết giá.'
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "những nốt lặp lại đều đều, các bè chồng lên nhau thành hợp âm chói tai, rồi những hợp âm dằn mạnh". Chữ mới như câu. Lý do: tổng phổ Mutopia ô 1–11 không có đoạn "hợp âm dằn mạnh": các bè vào lần lượt (ô 1–4) và lặp nốt móc đơn tới hết ô 11, violin độc tấu và violin 1 lặp nốt có láy rền (tr) từ ô 4; ô 12 là violin độc tấu. Câu thơ ô 1: "Aggiacciato tremar trà nevi algenti".'
- id: n24
  cau: 'Dòng 2: violin độc tấu, những chuỗi nốt chạy rất nhanh, mỗi đợt lên cao hơn đợt trước. Câu thơ: gió dữ thổi buốt.'
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: dung
  ghi_chu: 'Ô 12–19: ba đợt nốt móc ba bắt đầu ở Đô6 (ô 12), Mi♭6 (ô 14), Sol6 (ô 17), xen tiếng nốt lặp của dàn nhạc; "Al severo spirar d''orrido vento".'
- id: n25
  cau: 'Dòng 3: dàn nhạc, những nốt lặp lại dồn dập, hợp âm đổi liên tục. Câu thơ: chạy, giậm chân liên hồi.'
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: dung
  ghi_chu: 'Ô 22½–26: cả dàn nhạc (kể cả violin độc tấu) nốt móc ba lặp và quãng tám gãy, hợp âm đổi mỗi nửa ô; "Correr battendo i piedi ogni momento".'
- id: n26
  cau: 'Dòng 4: violin độc tấu và dàn nhạc thay phiên nhau, rồi những nốt lặp chồng lên nhau của đoạn mở đầu trở lại.'
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…, rồi những hợp âm dằn mạnh của đoạn mở đầu trở lại". Chữ mới: "…, rồi những nốt lặp chồng lên nhau của đoạn mở đầu trở lại". Lý do: ô 26–38 độc tấu và "Venti" của dàn nhạc thay phiên; ô 39–43 dàn nhạc trở lại các nốt móc đơn lặp như ô 1–11 (không phải "hợp âm dằn mạnh", xem n23).'
- id: n27
  cau: 'Dòng 5: những nốt lặp dồn dập của violin độc tấu (nốt kép rung nhanh), dàn nhạc đệm nhỏ. Câu thơ: rét quá, răng va lập cập.'
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "**Những nốt lặp dồn dập** quay lại, ở Fa thứ". Chữ mới như câu. Lý do: ô 47–55 ("E pel soverchio gel batter i denti", Violino primo "Batter li denti") là chất liệu mới: violin độc tấu nốt kép móc bốn rồi tremolo nốt kép đi xuống, dàn nhạc "Piano" lặp nốt móc đơn, bè trầm nghỉ; không phải "quay lại". Bỏ "ở Fa thứ": đoạn này đứng trên âm át (Đô) và đi qua nhiều giọng, chỉ kết về Fa thứ ở ô 56.'
- id: n28
  cau: 'Dòng 6: kết: cả dàn nhạc trở lại những nốt lặp dồn dập của đoạn "giậm chân", rồi hai lần kết trọn dứt khoát ở Fa thứ.'
  loai: cau-truc
  nguon:
  - mutopia-351
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "**Kết**: hai lần kết trọn dứt khoát ở Fa thứ". Chữ mới thêm "cả dàn nhạc trở lại những nốt lặp dồn dập của đoạn \"giậm chân\", rồi". Lý do: ô 56 "Tutti", "Forte" trở lại chất liệu ô 22½; ô 61–62 (bè trầm Đô có ♮3 → Fa) và ô 63–64 (→ Fa, fermata) là hai lần kết V–i ở Fa thứ.'
- id: n29
  cau: Cảnh trượt ngã trên băng nằm ở chương 3.
  loai: lich-su
  nguon:
  - mutopia-351
  - boston
  ket_qua: dung
  ghi_chu: 'Mutopia chương 3 ô 40: "Gir forte sdruzziolar, cader à terra"; Boston: "close with sliding on the ice, falling".'
