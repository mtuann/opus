  - cu: 'Liebestraum số 3 thuộc chặng 7 (≈ sau Grade 8). Cái khó không nằm ở tốc độ mà ở sự cân bằng: ngón cái hát giai điệu trong khi các ngón khác rải hợp âm thật nhẹ, rồi hai cadenza và đoạn cao trào với quãng tám ở cả hai tay. Lộ trình chuẩn bị và cách tập từng phần có ở bài học tác phẩm Liebestraum số 3.'
    moi: 'Liebestraum số 3 thuộc chặng 7; Henle xếp bài ở mức 7 trên thang 9 ("khó"). Cái khó không nằm ở tốc độ mà ở sự cân bằng: ngón cái hát giai điệu trong khi các ngón khác rải hợp âm thật nhẹ, rồi hai cadenza và đoạn cao trào với quãng tám ở cả hai tay. Lộ trình chuẩn bị và cách tập từng phần có ở bài học tác phẩm Liebestraum số 3.'
    ly_do: 'Kiểm định D6-L6-gom (n56): "sau Grade 8" không có nguồn ABRSM cho bài số 3 (ABRSM chỉ đưa bài số 2 vào danh sách ARSM); ghi chặng của site và mức Henle (HN 634: "7 difficult").'
