  ly_do: 'Henle HN 634: bài số 3 "one of the most frequently played piano pieces of all" (thay "nổi tiếng hơn hẳn", không có nguồn so sánh); lời thơ (bản in đầu, Oxford Song): người kia "geht und weint" (đi và khóc), không phải đã ra đi; bỏ đánh giá "nhiều bản thu chơi chậm và ủy mị" và vế "ngón cái hát đẹp nhất" (không có nguồn); bản in đầu: cadenza in nốt cỡ thường, cadenza thứ hai ghi leggiero, đoạn cuối dolce armonioso.'
