khuong_nhac: []
ghi_chu: 'Hướng dẫn nghe Liebestraum số 3 (tầng Tác phẩm; dùng chung bản ghi liszt-liebestraum với bài học qua cap, là cấu trúc). Bản nhạc: bản in đầu Kistner [1850] (BSB, tr. 16–22) và Schirmer 1915 (Joseffy), như hồ sơ piano/tac-pham/liszt-liebestraum (cách đếm ô ở đó). Lịch sử: lời tựa và Comments Henle HN 634, trang sản phẩm Henle, PTNA, IMSLP S.541 và S.298; lời thơ: Oxford Song (Stokes) và bản in đầu. Sửa trang: "nổi tiếng hơn hẳn" thành câu của Henle; lời thơ đoạn cuối ("người kia đi và khóc"); bỏ "nhiều bản thu chơi chậm và ủy mị" (da-bo); bỏ "vì ngón cái hát đẹp nhất"; cadenza không phải "nốt nhỏ"; cadenza thứ hai "leggiero", không phải "quãng ba gãy", bỏ "lời từ biệt"; mục So sánh bản thu: Bolet (Decca, bỏ đánh giá), bỏ Kissin (chỉ có nguồn blog) thay bằng cây đàn Bechstein của Liszt (Bechstein, HfM Weimar), Howard (Hyperion, bỏ đánh giá); mục Nguồn bỏ Walker và Grove. Dữ liệu cần sửa theo: hinh.nghe (cadenza 2 "quãng ba gãy đi xuống", độ dài các đoạn) ở plans/lam-lai/bao-cao/d6-l6/sua-B.yml. Không có câu chưa chắc. Số dòng bảng Theo dõi (9) và mốc ::khoi-nghe giữ nguyên, không đo lại mốc. Câu "thuộc chặng 7 (≈ sau Grade 8)" tách: chặng 7 là ve-site, sau Grade 8 là cap-do (RCM ARCT, Henle 7). Câu ở hồ sơ khác: nhan-dien/dau-van-tay n35 (tên bài) và lich-su/nha-soan-nhac l2: trang giữ tên; lo-trinh n37 "khoảng năm phút": trang này ghi 4–5 phút (Commons: 3:58–4:43), người giao xem có cần sửa lo-trinh khi mở khóa. Không tính là nhận định: tiêu đề mục, tiêu đề cột, chữ do ::hinh-cau-truc dựng (hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ có trong thuat-ngu.yml: cadenza, nocturne, allegro, leggiero, dolce, ottava; chưa có (cho D3-L5): più animato, con passione, con affetto, poco, sempre stringendo, notturno, armonioso, una corda không dùng.'
