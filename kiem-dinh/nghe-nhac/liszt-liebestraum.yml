  - cu:
      - 'Bản nhạc này vốn là một ca khúc. Năm 1843, Liszt phổ nhạc bài thơ O lieb, so lang du lieben kannst ("Hãy yêu, khi bạn còn có thể yêu") của nhà thơ Đức Ferdinand Freiligrath cho giọng hát và piano. Năm 1850, ông in ba bản Liebesträume cho piano, mỗi bản là một notturno chuyển soạn từ một ca khúc của mình: hai bản đầu theo thơ Ludwig Uhland, bản thứ ba theo thơ Freiligrath. Bản số 3 nổi tiếng hơn hẳn hai bản kia.'
      - 'Đừng để cái tên đánh lừa. Bài thơ không kể một giấc mơ ngọt ngào. Nó là một lời nhắc: hãy yêu thương khi còn có thể, vì sẽ đến lúc ta đứng bên nấm mồ mà than khóc; đừng buông lời cay nghiệt để rồi hối hận khi người kia đã ra đi. Liszt ghi tốc độ Poco allegro, con affetto (hơi nhanh, trìu mến), nhịp 6/4 với hai phách lớn mỗi ô nhịp. Nhiều bản thu chơi chậm và ủy mị hơn thế nhiều; hãy nghe xem bản bạn chọn có "trôi" như một bài hát không.'
      - 'Giai điệu nằm ở giữa. Trong nocturne của Chopin, giai điệu hát ở trên cùng. Ở đây, phần mở đầu đặt giai điệu ở âm vực giữa, như một giọng nam cao (tenor): bên dưới là nốt trầm, bên trên là những hợp âm rải nhẹ chia cho hai tay. Giai điệu chuyền qua lại giữa hai tay và phần lớn do ngón cái đảm nhận, vì ở âm vực này ngón cái hát đẹp nhất. Người chơi phải để ngón cái "hát" trong khi các ngón khác chỉ thì thầm, và thay bàn đạp vang theo từng hợp âm để nốt trầm ngân dài mà giai điệu không bị nhòe.'
      - 'Ba lần hát, hai cadenza. Giai điệu xuất hiện ba lần, mỗi lần một cách "phối" khác, ngăn cách bởi hai cadenza: những chuỗi nốt nhỏ không có vạch nhịp, cho người chơi tự do co giãn. Sau cadenza thứ nhất, giai điệu trở lại ở Si trưởng, một giọng khá xa La♭ trưởng nên màu sắc đổi hẳn, với chỉ dẫn più animato con passione (sôi nổi hơn, say mê). Rồi nhạc dồn dập (sempre stringendo), chuyển giọng liên tục để lên cao trào: giai điệu vang bằng quãng tám rồi tan thành hợp âm rải. Cadenza thứ hai, với những chuỗi quãng ba gãy đi xuống, đưa nhạc về La♭ trưởng cho lần hát cuối, lặng lẽ như một lời từ biệt.'
    moi:
      - 'Bản nhạc này vốn là một ca khúc. Năm 1843, Liszt phổ nhạc bài thơ O lieb, so lang du lieben kannst ("Hãy yêu, khi bạn còn có thể yêu") của nhà thơ Đức Ferdinand Freiligrath cho giọng hát và piano. Năm 1850, ông in ba bản Liebesträume cho piano, mỗi bản là một notturno chuyển soạn từ một ca khúc của mình: hai bản đầu theo thơ Ludwig Uhland, bản thứ ba theo thơ Freiligrath. Henle gọi bản số 3 là một trong những bản nhạc piano được chơi nhiều nhất.'
      - 'Đừng để cái tên đánh lừa. Bài thơ không kể một giấc mơ ngọt ngào. Nó là một lời nhắc: hãy yêu thương khi còn có thể, vì sẽ đến lúc ta đứng bên nấm mồ mà than khóc; hãy giữ gìn lời nói: một lời cay nghiệt dù không cố ý vẫn khiến người kia bỏ đi trong nước mắt. Liszt ghi tốc độ Poco allegro, con affetto (hơi nhanh, trìu mến), nhịp 6/4 với hai phách lớn mỗi ô nhịp. Hãy nghe xem bản thu bạn chọn có "trôi" như một bài hát không.'
      - 'Giai điệu nằm ở giữa. Trong nocturne của Chopin, giai điệu hát ở trên cùng. Ở đây, phần mở đầu đặt giai điệu ở âm vực giữa, như một giọng nam cao (tenor): bên dưới là nốt trầm, bên trên là những hợp âm rải nhẹ chia cho hai tay. Giai điệu chuyền qua lại giữa hai tay và phần lớn do ngón cái của hai tay đảm nhận. Người chơi phải để ngón cái "hát" trong khi các ngón khác chỉ thì thầm, và thay bàn đạp vang theo từng hợp âm để nốt trầm ngân dài mà giai điệu không bị nhòe.'
      - 'Ba lần hát, hai cadenza. Giai điệu xuất hiện ba lần, mỗi lần một cách "phối" khác, ngăn cách bởi hai cadenza: những chuỗi nốt chạy liền không chia vạch nhịp, cho người chơi tự do co giãn. Sau cadenza thứ nhất, giai điệu trở lại ở Si trưởng, một giọng khá xa La♭ trưởng nên màu sắc đổi hẳn, với chỉ dẫn più animato con passione (sôi nổi hơn, say mê). Rồi nhạc dồn dập (sempre stringendo), chuyển giọng liên tục để lên cao trào: giai điệu vang bằng quãng tám rồi tan thành hợp âm rải. Cadenza thứ hai, những chuỗi nốt nhẹ (leggiero) trôi xuống, đưa nhạc về La♭ trưởng cho lần hát cuối, dịu dàng (dolce armonioso).'
    ly_do: 'Henle HN 634: bài số 3 "one of the most frequently played piano pieces of all" (thay "nổi tiếng hơn hẳn", không có nguồn so sánh); lời thơ (bản in đầu, Oxford Song): người kia "geht und weint" (đi và khóc), không phải đã ra đi; bỏ đánh giá "nhiều bản thu chơi chậm và ủy mị" và vế "ngón cái hát đẹp nhất" (không có nguồn); bản in đầu: cadenza in nốt cỡ thường, cadenza thứ hai ghi leggiero, đoạn cuối dolce armonioso.'
