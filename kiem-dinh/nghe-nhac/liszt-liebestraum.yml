      - Grove Music Online, mục "Liszt, Franz". Xem tài liệu tham khảo.
    moi:
      - 'G. Henle Verlag, Liebesträume, 3 Notturnos, HN 634 và lời tựa (Ernst-Günter Heinemann, 1998): niên đại, lời thơ in trước mỗi bài.'
      - 'PTNA Piano Encyclopedia, Liebesträume – 3 notturnos No. 3: niên đại, nội dung bài thơ, các đoạn.'
      - Bản in đầu (Kistner, Leipzig, [1850]), bản số hóa của Thư viện Quốc gia Bayern.
      - 'Lời thơ Freiligrath và bản dịch tiếng Anh (Richard Stokes): Oxford Song. Xem tài liệu tham khảo.'
