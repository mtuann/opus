  - cu:
      - 'Jorge Bolet: một trong những nghệ sĩ gắn liền với nhạc Liszt ở thế kỷ 20; tiếng đàn tròn, rộng, câu nhạc thong thả và cao quý.'
      - 'Evgeny Kissin: có một video chơi bản này trên chính cây đàn Bechstein của Liszt, đặt tại Nhà Liszt ở Weimar. Nghe xem tiếng đàn thế kỷ 19 khác đàn hiện đại ở đâu (đọc thêm lịch sử cây đàn piano).'
      - 'Leslie Howard: người thu âm toàn bộ nhạc piano của Liszt; tập đĩa có Liebesträume đi kèm nhiều bản chuyển soạn ca khúc khác, cho thấy Liszt "hát" trên piano ra sao.'
    moi:
      - 'Jorge Bolet: bản thu cho hãng Decca, nằm cạnh nhiều bản Liszt khác trong bộ đĩa Decca của ông. Nghe xem ông giữ tốc độ Poco allegro hay chậm hơn.'
      - 'Đàn của chính Liszt: cây đàn Bechstein Liszt nhận khoảng năm 1881–1882, đặt tại Nhà Liszt ở Weimar, được phục chế và chơi lại từ tháng 10/2024. Nếu tìm được bản thu trên cây đàn này, nghe xem tiếng đàn thế kỷ 19 khác đàn hiện đại ở đâu (đọc thêm lịch sử cây đàn piano).'
      - 'Leslie Howard: người thu âm toàn bộ nhạc piano độc tấu của Liszt cho hãng Hyperion; tập 19 đặt Liebesträume cạnh hai tập ca khúc Liszt tự chuyển soạn cho piano.'
    ly_do: 'Lời đánh giá phong cách không có nguồn (Bolet, Howard); video Kissin chỉ có ở blog, không có nguồn bậc 2: bỏ tên, giữ ý về cây đàn theo Bechstein và HfM Weimar. Bolet: Decca, Complete Decca Recordings; Howard: Hyperion CDA66593 (Vol. 19, Liebesträume & the Songbooks).'
  - cu:
