- id: n14
  cau: 'Dịch tên bài thơ: "Hãy yêu, khi bạn còn có thể yêu".'
  loai: ten
  nguon:
  - oxfordsong
  - ptna-23749
  ket_qua: dung
  ghi_chu: 'Stokes: "O love as long as you can"; PTNA: "O Love, as long as you can love!"'
- id: n15
  cau: 'Năm 1850 Liszt in ba Liebesträume cho piano, mỗi bản là một notturno chuyển soạn từ ca khúc của mình: hai bản đầu theo thơ Ludwig Uhland, bản thứ ba theo thơ Freiligrath.'
  loai: nam
  nguon:
  - henle-634-vorwort
  - henle-hn634
  ket_qua: dung
  ghi_chu: 'Henle: "no. I Hohe Liebe, no. II Seliger Tod: with texts by Ludwig Uhland, no. III O lieb …: text by Ferdinand Freiligrath".'
- id: n16
  cau: Henle gọi bản số 3 là một trong những bản nhạc piano được chơi nhiều nhất.
  loai: lich-su
  nguon:
  - henle-hn634
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bản số 3 nổi tiếng hơn hẳn hai bản kia." Chữ mới: "Henle gọi bản số 3 là một trong những bản nhạc piano được chơi nhiều nhất." Lý do: so sánh "hơn hẳn" không có nguồn; Henle: "The third Liebestraum … is one of the most frequently played piano pieces of all".'
- id: n17
  cau: 'Bài thơ không kể một giấc mơ ngọt ngào mà là một lời nhắc: hãy yêu thương khi còn có thể, vì sẽ đến lúc ta đứng bên nấm mồ mà than khóc.'
  loai: lich-su
  nguon:
  - oxfordsong
  - ptna-23749
  - kistner-1850
  ket_qua: dung
  ghi_chu: '"Die Stunde kommt … Wo du an Gräbern stehst und klagst!"; PTNA: "sings not of romantic love but of human love".'
- id: n18
  cau: 'Bài thơ dặn giữ gìn lời nói: một lời cay nghiệt dù không cố ý vẫn khiến người kia bỏ đi trong nước mắt.'
  loai: lich-su
  nguon:
  - oxfordsong
  - kistner-1850
  - henle-634-comments
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đừng buông lời cay nghiệt để rồi hối hận khi người kia đã ra đi." Lý do: lời thơ (bản in trong Liebesträume, Henle Comments): "Und hüte deine Zunge wohl: bald ist ein hartes Wort entfloh''n. / O Gott – es war nicht bös gemeint – / Der Andre aber geht und weint." Người kia "đi và khóc", không phải "đã ra đi" (dễ hiểu là đã mất); ý hối hận nằm ở "es war nicht bös gemeint".'
