    ghi_chu: 'IMSLP: số 1 Đô thứ, số 2 Mi♭ trưởng; in 1827 (1–2), 1857 (3–4). PTNA: "wait 30 years". NDB: Tobias mất 1842, con trai Carl (1816–68). Xem hồ sơ bài học n12.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/4_Impromptus,_D.899_(Schubert,_Franz)", "https://enc.piano.or.jp/en/musics/1580", "https://www.deutsche-biographie.de/sfz28044.html" ]
