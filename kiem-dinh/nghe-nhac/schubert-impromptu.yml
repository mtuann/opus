doi_chu:
  - cu:
      - 'Năm 1827 là năm trọn vẹn cuối cùng trong đời Schubert; ông mất tháng 11 năm sau, mới 31 tuổi. Trong năm ấy ông viết hai tập, mỗi tập bốn bản ngắn cho piano: D. 899 và D. 935. Cái tên Impromptu ("ngẫu hứng") do nhà xuất bản Tobias Haslinger đặt cho tập đầu; ở bản thảo tập thứ hai, Schubert đánh số các bản từ 5 đến 8, như thể nối tiếp. Tên gọi nghe tùy hứng, nhưng đây là những bản nhạc được xây rất cẩn thận. Xem các thể loại nhạc piano.'
      - 'Câu chuyện bản in. Haslinger in hai bản đầu (Đô thứ và Mi♭ trưởng) ngay cuối năm 1827, nhưng bản số 3 và số 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai ông, Carl Haslinger, in ra. Khi ấy bản số 3 bị dịch giọng sang Sol trưởng, và mỗi ô nhịp 4/2 dài bị cắt đôi thành 2/2, có lẽ để người chơi nghiệp dư khỏi ngại sáu dấu giáng. Suốt nhiều thập kỷ, người ta chỉ biết bản Sol trưởng. Các ấn bản Urtext ngày nay đã trả lại giọng gốc, và người chơi piano hiểu vì sao Schubert chọn nó: ở Sol♭ trưởng, năm trong bảy nốt của gam là phím đen, bàn tay nằm tự nhiên và mềm mại; bản Sol trưởng dễ đọc hơn nhưng khó chơi mượt hơn.'
    moi:
      - 'Năm 1827 là năm trọn vẹn cuối cùng trong đời Schubert; ông mất tháng 11 năm sau, mới 31 tuổi. Trong năm ấy ông viết hai tập, mỗi tập bốn bản ngắn cho piano: D. 899 và D. 935. Cái tên Impromptu ("ngẫu hứng") có lẽ do nhà xuất bản Tobias Haslinger đặt cho tập đầu (chính ông ghi tên này lên bản thảo bài số 1); ở bản thảo tập thứ hai, Schubert đánh số các bản từ 5 đến 8, như thể nối tiếp. Tên gọi nghe tùy hứng, nhưng đây là những bản nhạc được xây rất cẩn thận. Xem các thể loại nhạc piano.'
      - 'Câu chuyện bản in. Haslinger in hai bản đầu (Đô thứ và Mi♭ trưởng) ngay cuối năm 1827, nhưng bản số 3 và số 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai ông, Carl Haslinger, in ra. Khi ấy bản số 3 bị dịch giọng sang Sol trưởng, và mỗi ô nhịp 4/2 dài bị cắt đôi, để bài dễ chơi hơn. Suốt nhiều thập kỷ, bài thường chỉ được in ở Sol trưởng. Các ấn bản Urtext ngày nay đã trả lại giọng gốc, và người chơi piano hiểu vì sao Schubert chọn nó: ở Sol♭ trưởng, năm trong bảy nốt của gam là phím đen, bàn tay nằm tự nhiên và mềm mại; bản Sol trưởng dễ đọc hơn nhưng khó chơi mượt hơn.'
    ly_do: 'n10 (da-sua): PTNA nói người đặt tên chưa rõ. n14, n15 (da-sua): PTNA và lời tựa Henle HN 4 lệch nhau về chữ số nhịp mới; "nghiệp dư" không có nguồn.'
  - cu: 'Một bài hát không lời. Schubert viết hơn 600 ca khúc, và bản Impromptu này hát như một ca khúc của ông: giai điệu dài, rộng, nhiều nốt ngân. Bên dưới là một dòng hợp âm rải chảy đều như tiếng đàn hạc, gần như không dừng suốt bài; tay trái giữ bè trầm sâu. Điều đặc biệt: giai điệu và dòng đệm nằm trong cùng tay phải. Các ngón ngoài (chủ yếu ngón 4 và 5) hát giai điệu ở trên, ngón cái và các ngón trong rải hợp âm nhẹ như hơi thở. Tai ta nghe thấy một ca sĩ và một người đệm đàn, nhưng thực ra là một bàn tay.'
    moi: 'Một bài hát không lời. Schubert viết khoảng 600 ca khúc, và bản Impromptu này hát như một ca khúc của ông: giai điệu dài, rộng, nhiều nốt ngân. Bên dưới là một dòng hợp âm rải chảy đều như tiếng đàn hạc, gần như không dừng suốt bài; tay trái giữ bè trầm sâu. Điều đặc biệt: giai điệu và dòng đệm nằm trong cùng tay phải. Các ngón ngoài (chủ yếu ngón 4 và 5) hát giai điệu ở trên, ngón cái và các ngón trong rải hợp âm nhẹ như hơi thở. Tai ta nghe thấy một ca sĩ và một người đệm đàn, nhưng thực ra là một bàn tay.'
    ly_do: 'n18 (da-sua): Henle "600 songs".'
  - cu: Các "anh em". Trong tập D. 899, số 1 (Đô thứ) mở bằng một nốt Sol vang trơ trọi rồi một giai điệu như hành khúc; số 2 (Mi♭ trưởng) là dòng chùm ba chạy không nghỉ của tay phải; số 4 (La♭ trưởng, mở đầu ở La♭ thứ) đổ xuống những thác hợp âm rải. Tập D. 935 được in năm 1839, kèm lời đề tặng Franz Liszt do nhà xuất bản thêm vào; bản số 3 của tập là một chủ đề và biến tấu ở Si♭ trưởng.
    moi: Các "anh em". Trong tập D. 899, số 1 (Đô thứ) mở bằng nốt Sol quãng tám đánh mạnh, rồi một giai điệu một bè được các hợp âm đáp lại; số 2 (Mi♭ trưởng) là dòng chùm ba chạy không nghỉ của tay phải; số 4 (La♭ trưởng, mở đầu ở La♭ thứ) chạy những chuỗi hợp âm rải ở tay phải. Tập D. 935 đến tháng 4 năm 1839 mới được Diabelli in; bản số 3 của tập là một chủ đề và biến tấu ở Si♭ trưởng.
    ly_do: 'n26, n28, n29 (da-sua): theo PTNA (D 899, D 935); lời đề tặng Liszt không có nguồn đã mở.'
  - cu: 'Impromptu Sol♭ trưởng, D. 899 số 3: ba đoạn (gần đúng). Dòng đệm hợp âm rải gần như không dừng suốt bài.'
    moi: 'Impromptu Sol♭ trưởng, D. 899 số 3: ba đoạn (độ dài theo số ô nhịp). Dòng đệm hợp âm rải gần như không dừng suốt bài.'
    ly_do: 'hinh.nghe của bản ghi tac-pham/schubert-impromptu-sol-giang (hồ sơ bản ghi n25; sua-B.yml): hình cũ vẽ đoạn B ngắn nhất; theo Mutopia (Breitkopf & Härtel 1888) A ô 1–24, B ô 25–54, A'' và coda ô 55–86, nên độ rộng thành 24, 30, 32 và chú thích ghi theo số ô.'
  - cu:
      - 'Radu Lupu: tiếng đàn mềm, nhiều tầng lớp; chơi rất nhỏ mà giai điệu vẫn hát.'
      - 'Alfred Brendel: một trong những người chơi Schubert tiêu biểu của thế kỷ 20; câu nhạc rộng, hình khối rõ ràng.'
      - 'Krystian Zimerman: điều khiển âm sắc rất tinh, giai điệu nổi rõ trên dòng đệm mỏng như tơ.'
    moi:
      - 'Ba bản thu trọn hai tập Impromptu D. 899 và D. 935 để so sánh:'
      - Radu Lupu (Decca).
      - Alfred Brendel (Philips, phát hành năm 1989).
      - Krystian Zimerman (Deutsche Grammophon, phát hành năm 1991).
      - 'Nghe cùng một đoạn trong ba bản: ai chơi nhỏ nhất mà giai điệu vẫn hát, ai để dòng đệm mỏng nhất, ai giữ câu nhạc rộng và liền nhất?'
    ly_do: 'n34, n35 (da-sua): lời nhận xét về lối chơi không kiểm được; giữ tên nghệ sĩ kèm hãng đĩa và năm theo trang hãng đĩa. Review D6-L5-gom: n34, bản 1989 do Philips phát hành (422 237-2, MusicBrainz), lượt 2 sai.'
  - cu: 'Bản này ở mức khoảng Grade 7–8: không nhanh, nhưng tay phải phải làm hai việc cùng lúc, bàn tay nhỏ sẽ vất vả với những quãng rộng, và bàn đạp phải rất tinh. Chuẩn bị bằng các bài tập cân bằng trong cùng một tay ở trang Tạo tiếng đàn, rồi Träumerei và Nocturne Op. 9 số 2 của Chopin. Muốn một Impromptu Schubert dễ tiếp cận hơn, hãy thử D. 935 số 2 (La♭ trưởng). Khi đã sẵn sàng, bài học tác phẩm Impromptu Sol♭ trưởng hướng dẫn tập từng lớp âm thanh, bàn đạp và các câu nhạc dài. Xem Tác phẩm theo cấp độ; nghe thêm Schubert trong Ngũ tấu Con cá hồi.'
    moi: 'Bản này ở mức sau Grade 8 (ABRSM đưa bài vào danh sách tác phẩm của bằng ARSM): không nhanh, nhưng tay phải phải làm hai việc cùng lúc, bàn tay nhỏ sẽ vất vả với những quãng rộng, và bàn đạp phải rất tinh. Chuẩn bị bằng các bài tập cân bằng trong cùng một tay ở trang Tạo tiếng đàn, rồi Träumerei và Nocturne Op. 9 số 2 của Chopin. Muốn một Impromptu Schubert dễ tiếp cận hơn, hãy thử D. 935 số 2 (La♭ trưởng). Khi đã sẵn sàng, bài học tác phẩm Impromptu Sol♭ trưởng hướng dẫn tập từng lớp âm thanh, bàn đạp và các câu nhạc dài. Xem Tác phẩm theo cấp độ; nghe thêm Schubert trong Ngũ tấu Con cá hồi.'
