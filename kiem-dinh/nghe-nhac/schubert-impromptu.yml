ghi_chu: 'Hướng dẫn nghe Impromptu Sol♭ trưởng D. 899 số 3 (tầng Tác phẩm; dùng chung bản ghi schubert-impromptu-sol-giang với bài học, trang cap). Bản nhạc: Mutopia SchubertF-D899-3-Impromptu (Breitkopf & Härtel 1888); lịch sử: PTNA (D 899, D 935), Henle HN 4, HN 488, IMSLP, NDB. Sửa: n10, n14, n15, n18, n26, n28, n29, n34, n36; bỏ: n45. Bàn phím ::cong-cu{ten="piano" range="F4-G5" notes="Gb4 Ab4 Bb4 Cb5 Db5 Eb5 F5 Gb5"}: tám nốt gam Sol♭ trưởng, đúng chú thích (n17). Bảng Theo dõi khi nghe có 8 dòng, ::khoi-nghe{moc} có 8 số; mốc dòng 3 ("Phần đầu khép lại ở Sol♭ trưởng", 66 giây) rơi vào ô 17 của bản thu Bertoglio (đầu câu dài nói lại), không phải ô 24 (≈ 95 giây): ghi cho người giao ở báo cáo luot-1-B.md, không sửa mốc bằng tay. Không tính là nhận định: tiêu đề mục, tiêu đề cột, chữ do ::hinh-cau-truc dựng (hinh.nghe ở hồ sơ bản ghi). Thuật ngữ: impromptu chưa có bản ghi trong thuat-ngu.yml (cho lô sau); andante, láy rền có. Không có câu ve-site ở hồ sơ khác trỏ riêng tới trang này ngoài piano/nha-soan-nhac n174, blog 2026-10-21 n23 (trang có, đúng tác phẩm).'
