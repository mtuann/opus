  loai: so-lieu
  nguon:
  - commons-bertoglio
  - mut-d899-3
  ket_qua: dung
  ghi_chu: Bản thu Bertoglio 5:58; 86 ô 4/2 ở nốt trắng 52–60 là 5,7–6,6 phút.
- id: n8
  cau: Năm 1827 là năm trọn vẹn cuối cùng trong đời Schubert; ông mất tháng 11 năm sau, mới 31 tuổi.
  loai: nam
  nguon:
  - henle-488
  ket_qua: dung
  ghi_chu: 'Henle (niên biểu): "1828 … Death in Vienna on November 19". Sinh 31/1/1797 (năm theo nha-soan-nhac.yml): mất lúc 31 tuổi.'
- id: n9
  cau: 'Trong năm ấy ông viết hai tập, mỗi tập bốn bản ngắn cho piano: D. 899 và D. 935.'
  loai: nam
  nguon:
  - imslp-d899
  - imslp-d935
  ket_qua: dung
  ghi_chu: 'IMSLP: cả hai tập sáng tác 1827, mỗi tập 4 bài.'
- id: n10
  cau: Cái tên Impromptu ("ngẫu hứng") có lẽ do nhà xuất bản Tobias Haslinger đặt cho tập đầu (chính ông ghi tên này lên bản thảo bài số 1).
  loai: lich-su
  nguon:
  - ptna-1580
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "do nhà xuất bản Tobias Haslinger đặt cho tập đầu" (khẳng định). PTNA: người đặt tên "not clearly known"; tên trên bản thảo số 1 do Haslinger ghi; có thể chính Schubert đặt. "Ngẫu hứng": COD "impromptu … on the spur of the moment".'
- id: n11
  cau: Schubert đánh số các bản của tập thứ hai từ 5 đến 8, như thể nối tiếp.
  loai: lich-su
  nguon:
  - ptna-1580
  ket_qua: dung
  ghi_chu: 'PTNA: "Schubert initially hoped that all eight pieces would be published together by Haslinger, and thus numbered the subsequent four pieces as Nos. 5-8." Trang viết "ở bản thảo tập thứ hai"; IMSLP D. 935 có bản thảo (Morgan Library).'
- id: n12
  cau: Tên gọi nghe tùy hứng, nhưng đây là những bản nhạc được xây rất cẩn thận.
  loai: lich-su
  nguon:
  - henle-4
  - ptna-1580
  ket_qua: dung
  ghi_chu: 'Henle HN 4: "consummate works of art"; PTNA: tập nhạc lớn "comparable to a sonata" chứ không phải những tiểu phẩm dễ. Link piano/the-loai (đã khóa).'
- id: n13
  cau: Haslinger in hai bản đầu (Đô thứ và Mi♭ trưởng) ngay cuối năm 1827; bản số 3 và số 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai ông, Carl Haslinger, in ra.
  loai: lich-su
  nguon:
  - ptna-1580
  - imslp-d899
  - db-haslinger
  ket_qua: dung
  ghi_chu: 'IMSLP: số 1 Đô thứ, số 2 Mi♭ trưởng; in 1827 (1–2), 1857 (3–4). PTNA: "wait 30 years". NDB: Tobias mất 1842, con trai Carl (1816–68). Xem hồ sơ bài học n12.'
- id: n14
  cau: Khi ấy bản số 3 bị dịch giọng sang Sol trưởng, và mỗi ô nhịp 4/2 dài bị cắt đôi, để bài dễ chơi hơn.
  loai: lich-su
  nguon:
  - ptna-1580
  - henle-4-vorwort
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mỗi ô nhịp 4/2 dài bị cắt đôi thành 2/2, có lẽ để người chơi nghiệp dư khỏi ngại sáu dấu giáng". PTNA: "changed to 2/2 time and G major for ease of playability"; lời tựa Henle HN 4: "time-signature to only four quarter-notes to a measure (common metre)". Hai nguồn lệch về chữ số nhịp mới (2/2 hay 4/4) nhưng đều là nửa ô 4/2: bỏ "thành 2/2". "Nghiệp dư" không có nguồn.'
- id: n15
  cau: Suốt nhiều thập kỷ, bài thường chỉ được in ở Sol trưởng; các ấn bản Urtext ngày nay đã trả lại giọng gốc.
  loai: lich-su
  nguon:
  - henle-4-vorwort
  - henle-488
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Suốt nhiều thập kỷ, người ta chỉ biết bản Sol trưởng." Lời tựa HN 4: "in which un-Schubert-like form it has generally been published ever since"; Henle HN 488 in ở giọng gốc, "other editions often transpose it into G major".'
- id: n16
  cau: Ở Sol♭ trưởng bàn tay nằm tự nhiên và mềm mại; bản Sol trưởng dễ đọc hơn nhưng khó chơi mượt hơn.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
  ghi_chu: 'Nhận xét của người chơi về thế tay; không có yếu tố sức khỏe. Henle (n15): Sol trưởng "diminishes the distinctive colour".'
- id: n17
  cau: 'Gam Sol♭ trưởng: năm phím đen, cộng hai phím trắng là Đô♭ (chính là phím Si) và Fa (bàn phím và chú thích).'
  loai: dinh-nghia
  nguon:
  - mut-d899-3
  ket_qua: dung
  ghi_chu: 'Nhạc lý, theo trang đã khóa nhac-ly/08-hoa-bieu (Sol♭ trưởng sáu dấu giáng). ::cong-cu{ten="piano" range="F4-G5" notes="Gb4 Ab4 Bb4 Cb5 Db5 Eb5 F5 Gb5"}: nhac-ly.js midiCua cho 66 68 70 71 73 75 77 78; 71 (Đô♭5) là phím Si4, 77 là Fa5: hai phím trắng, năm phím còn lại đen; tất cả trong F4–G5 (65–79). Đủ tám nốt gam, đúng.'
- id: n18
  cau: Schubert viết khoảng 600 ca khúc.
  loai: so-lieu
  nguon:
  - henle-488
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hơn 600 ca khúc". Henle (giới thiệu nhà soạn nhạc): "His immense oeuvre … comprises 600 songs".'
- id: n19
  cau: 'Bản Impromptu hát như một ca khúc: giai điệu dài, rộng, nhiều nốt ngân; bên dưới là dòng hợp âm rải chảy đều, gần như không dừng; tay trái giữ bè trầm sâu.'
  loai: cau-truc
  nguon:
  - mut-d899-3
  - henle-488
  ket_qua: dung
  ghi_chu: 'Henle HN 488: "A peaceful melody hovers over a murmuring accompaniment"; Mutopia: giai điệu nốt tròn, nốt trắng; dòng chùm sáu suốt bài; bè trầm quãng năm, quãng tám ở âm vực thấp.'
- id: n20
  cau: Giai điệu và dòng đệm nằm trong cùng tay phải; các ngón ngoài (chủ yếu 4 và 5) hát giai điệu, ngón cái và các ngón trong rải hợp âm.
  loai: cau-truc
  nguon:
  - mut-d899-3
  ket_qua: dung
  ghi_chu: 'Mutopia: giai điệu và dòng chùm sáu cùng ở khuông trên (hai bè của tay phải), giai điệu ở trên. Phân ngón là cách chơi thông thường (bản Breitkopf không ghi ngón; bài học n48).'
- id: n21
  cau: Nhịp 4/2 nghĩa là mỗi ô có bốn phách nốt trắng; Andante nên hiểu là "đi" chứ không phải "đứng".
  loai: dinh-nghia
  nguon:
  - mut-d899-3
  - dolmetsch-tempo
  - tn
  ket_qua: dung
  ghi_chu: 'Mutopia \time 4/2; Dolmetsch: "andante moving along - walking pace"; thuat-ngu.yml andante "như bước đi".'
- id: n22
  cau: Schubert bất ngờ đổi màu hòa âm, đi sang một giọng xa rồi quay về.
  loai: cau-truc
  nguon:
  - mut-d899-3
  ket_qua: dung
  ghi_chu: 'Mutopia: ô 78–80 đổi hóa biểu sang Đô trưởng, viết Fa♯, rồi về Sol♭ (coda); ô 21 Mi♭♭.'
- id: n23
  cau: 'Đoạn giữa bắt đầu ở Mi♭ thứ: tối và căng hơn, những nốt trầm nhấn mạnh, giọng thay đổi liên tục.'
  loai: cau-truc
  nguon:
  - mut-d899-3
  - ptna-1580
  ket_qua: dung
  ghi_chu: 'PTNA: "The middle section modulates to the relative key of E-flat minor … forceful opening, and the urgent triplets in the left hand". Mutopia: fz ở bè trầm ô 25–27, 36, 38, 41–45; ô 33–40 qua Đô♭, ô 49–52 Mi♭ trưởng.'
- id: n24
  cau: Gần cuối đoạn giữa có một tiếng láy rền ở âm vực rất trầm trước khi giai điệu Sol♭ trưởng trở lại.
  loai: cau-truc
  nguon:
  - mut-d899-3
  - ptna-1580
  ket_qua: dung
  ghi_chu: 'Mutopia: láy rền Sol♭1 ô 53, chủ đề trở lại ô 55. PTNA: "a trill is placed in the low left hand (m. 53)".'
- id: n25
  cau: 'Bàn đạp: dòng hợp âm rải cần bàn đạp vang, giai điệu phải luôn trong; nghệ sĩ thay bàn đạp theo bè trầm và hòa âm, có khi nhấc nửa chừng.'
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
  ghi_chu: Link piano/ban-dap (đã khóa).
- id: n26
  cau: Trong tập D. 899, số 1 (Đô thứ) mở bằng nốt Sol quãng tám đánh mạnh, rồi một giai điệu một bè được các hợp âm đáp lại.
  loai: cau-truc
  nguon:
  - ptna-1580
  - imslp-d899
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mở bằng một nốt Sol vang trơ trọi rồi một giai điệu như hành khúc". PTNA: "This piece opens with a forceful striking of G notes, layered in octaves. Following this, a monophonic ''question'' and a harmonized ''answer'' are played four times". "Như hành khúc" không có nguồn.'
- id: n27
  cau: Số 2 (Mi♭ trưởng) là dòng chùm ba chạy không nghỉ của tay phải.
  loai: cau-truc
  nguon:
