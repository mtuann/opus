    ly_do: 'n15: NMA ô 56–75.'
  - cu: "Chi tiết lịch sử thú vị: tác phẩm vốn có 5 chương, nhưng chương minuet thứ hai đã thất lạc — bản chúng ta nghe ngày nay chỉ còn 4 chương."
