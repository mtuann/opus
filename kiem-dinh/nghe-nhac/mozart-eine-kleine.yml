    ma_bam:
    nguoi:
      luot_1: "Claude Opus 5.5 (D6-L9 phần B)"
      luot_2:
      review:
      kiem_mau:
ghi_chu: 'Hướng dẫn nghe Eine kleine Nachtmusik, chương 1 (tầng Tác phẩm; bản ghi tac-pham/mozart-eine-kleine; loai: nghe là cấu trúc). Không có khối abc. Bản nhạc: tổng phổ Neue Mozart-Ausgabe IV/12/6 trên DME của Mozarteum, ảnh trang 43–48 (ucb13_125_<trang>.jpg), đọc ảnh: Allegro, 4/4 (C), ô 1–4 đồng âm f; ô 11–17 p, violin rồi viola và bè trầm; đoạn chuyển ô 18–27 (móc kép, crescendo, f ô 22); chủ đề 2 Rê trưởng ô 28 p; dấu nhắc lại cuối ô 55 (phần kết p); phát triển ô 56–75 (có dấu nhắc lại đầu ô 56 cho nửa sau); tái hiện ô 76; chủ đề 2 Sol trưởng ô 101. Lịch sử: Köchel online KV 525 (ngày ghi vào danh mục, tên Serenade chỉ có từ bản in đầu, năm chương, chương 2 thất lạc), IMSLP (wikitext), COD (serenade, sonata form). Độ dài: bản thu Advent Chamber Orchestra (bản ghi ban_thu) 355,41 giây trên Commons. Sửa: n3, n5, n7, n8, n10, n11, n13, n15, n17, n23, n24, n27, n31; thêm câu n9 và n18 (link sang hinh-thuc/minuet-trio cho chương 3). Không có chỗ chưa chắc. Bảng "Theo dõi khi nghe" giữ đủ 8 dòng, đúng thứ tự, khớp 8 mốc của ::khoi-nghe (không sửa mốc); chỉ sửa chữ dòng 5 (thêm vế phần trình bày được nhắc lại: mốc dòng 5 = 63 giây, dòng 6 = 199 giây, khoảng giữa gồm phần kết và cả lần nhắc lại) và dòng 6. Câu ở hồ sơ khác: hinh-thuc/minuet-trio m15 ("đúng tác phẩm trong hướng dẫn nghe"): trang này về cùng tác phẩm, nay ghi rõ "Trang này nói về chương 1" và trỏ sang mục chương 3 của minuet-trio (id i-qua-mot-tac-pham-mozart-eine-kleine-nachtmusik-chuong-3, theo quy ước id cũ và theo hồ sơ piano/tac-pham/minuet-sol, mozart-minuet-k2 đã kiểm trong bản xem), theo gợi ý của review D6-L1-gom. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: serenade, divertimento (chỉ ở hồ sơ), đồng âm (unison), đoạn chuyển, chủ đề 1/chủ đề 2, contrabass. Đã có: sonata form, exposition, development, recapitulation, minuet, dominant (giọng át), Allegro. Đã bỏ tên "Mannheim rocket" (chỉ thấy ở blog và Wikipedia; COD mục Mannheim School không có tên này).'
nguon:
  - id: nma-525
    bac: 1
    ten: 'Neue Mozart-Ausgabe IV/12/6, tổng phổ, ảnh trang 43–48 trên Digital Mozart Edition: "Serenade in G / Eine kleine Nachtmusik / für zwei Violinen, Viola, Violoncello und Kontrabaß / KV 525", "Datiert Wien, 10. August 1787", "Allegro"'
    link: https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=125&p1=43
  - id: kv-525
    bac: 2
    ten: 'Köchel-Verzeichnis online, KV 525: "Dating Vienna, 10.08.1787"; "vl1, vl2, vla, vlc+b"; "one of Wolfgang Amadé Mozart’s most popular and best-known works today … first printed around 1837, almost 50 years after Mozart’s death"; "The original title refers to its use in the evening and at night. Night musics (nocturnes) were usually written on the occasion of friends’ name days or on commission. The exact circumstances of the composition of the work, which Mozart entered in his own handwritten catalog of works on 10 August 1787, are not known"; "Contrary to the genre designation Serenade, which originated not from Mozart but is only found in the first print, it is apparently a Divertimento"; "“consisting of an Allegro, Minuet and Trio. - Romance. Minuet and Trio, and Finale”. The first minuet movement, which … was in second place in the original five-movement work, was lost"'
    link: https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049
  - id: kv-620
    bac: 2
    ten: 'Köchel-Verzeichnis online, KV 620, đoạn "About Operas and Singspiels": "Don Giovanni , KV 527 (1787)"'
    link: https://kv.mozarteum.at/en/work/die-zauberflote-the-magic-flute-7137
  - id: imslp-525
    bac: 2
    ten: 'IMSLP, Eine kleine Nachtmusik, K.525 (wikitext qua api.php): "Key=G", "5 movements (1 lost)": "1. Allegro / 2. [Menuetto and Trio (lost)] / 3. Romanze / 4. Menuetto: Allegretto / 5. Rondo", "Year/Date of Composition=1787", "Year of First Publication=1827 ca.", "Piece Style=Classical", "Instrumentation=2 violins, viola, cello, double bass"'
    link: https://imslp.org/wiki/Eine_kleine_Nachtmusik,_K.525_(Mozart,_Wolfgang_Amadeus)
  - id: commons-525
    bac: 2
    ten: 'Wikimedia Commons, "Mozart - Eine kleine Nachtmusik - 1. Allegro.ogg" (Advent Chamber Orchestra, CC BY-SA 2.0; API imageinfo: length 355,41 giây)'
    link: https://commons.wikimedia.org/wiki/File:Mozart_-_Eine_kleine_Nachtmusik_-_1._Allegro.ogg
  - id: cod-sonata-form
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "sonata form": exposition (first subject in tonic, 2nd subject in dominant), "often repeated", development, recapitulation "with the 2nd subject now in the tonic"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sonata-form
  - id: cod-serenade
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "serenade": "Evening music. Properly, open-air evening mus. … The instr. serenade was developed towards the end of 18th cent. … particularly by Mozart (e.g. his Eine kleine Nachtmusik)"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/serenade
  - id: loc-mozart
    bac: 2
    ten: 'Library of Congress, n81018421 (JSON): "Mozart, Wolfgang Amadeus, 1756-1791"'
    link: https://id.loc.gov/authorities/names/n81018421.json
nhan_dinh:
  - id: n1
    cau: 'Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791).'
    loai: nam
    nguon: [loc-mozart]
    ket_qua: dung
    ghi_chu: 'Khớp src/data/nha-soan-nhac.yml (mozart, đã khóa).'
  - id: n2
    cau: 'Bảng: Tên đầy đủ Serenade cung Sol trưởng, K. 525, Eine kleine Nachtmusik ("Một bản nhạc đêm nhỏ").'
    loai: danh-muc
    nguon: [nma-525, imslp-525, kv-525]
    ket_qua: dung
    ghi_chu: 'NMA đặt tên "Serenade in G … Eine kleine Nachtmusik … KV 525"; Köchel online dịch "A Little Night Music". Tên thể loại Serenade không do Mozart đặt: nói ở n5.'
  - id: n3
    cau: 'Bảng: Mozart ghi tác phẩm vào danh mục tác phẩm của mình ngày 10 tháng 8, 1787 (Vienna).'
    loai: nam
    nguon: [kv-525, nma-525]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sáng tác | 10 tháng 8, 1787 (Vienna)". Ngày 10/8/1787 là ngày Mozart ghi vào danh mục (Köchel online), không chắc là ngày sáng tác; NMA "Datiert Wien, 10. August 1787".'
  - id: n4
    cau: 'Bảng: Thời kỳ Cổ điển.'
    loai: lich-su
    nguon: [imslp-525]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Classical".'
  - id: n5
    cau: 'Bảng: Thể loại: viết cho 2 violin, viola, cello và contrabass; tên thể loại Serenade có từ bản in đầu, không do Mozart đặt.'
    loai: lich-su
    nguon: [kv-525, nma-525, imslp-525]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Serenade cho dàn dây (2 violin, viola, cello, contrabass)". Köchel online: tên Serenade "originated not from Mozart but is only found in the first print, it is apparently a Divertimento", nghĩa là nhạc thính phòng chứ không phải dàn nhạc; nên bỏ chữ "dàn dây"; mô tả trang viết "đàn dây" (nhạc cụ dây). Nhạc cụ: NMA "für zwei Violinen, Viola, Violoncello und Kontrabaß"; IMSLP.'
  - id: n6
    cau: 'Bảng: Độ dài chương 1 khoảng 5–6 phút.'
    loai: so-lieu
    nguon: [commons-525]
    ket_qua: dung
    ghi_chu: 'Bản Advent Chamber Orchestra: 355,41 giây (5:55), có nhắc lại phần trình bày.'
  - id: n7
    cau: 'Danh mục Köchel online gọi K. 525 là một trong những tác phẩm nổi tiếng nhất của Mozart ngày nay, dù nó chỉ được in lần đầu nhiều năm sau khi ông mất. (Mô tả trang: một chương ở hình thức sonata, viết cho đàn dây năm 1787.)'
    loai: lich-su
    nguon: [kv-525, imslp-525]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là bản nhạc mở đầu quen thuộc nhất của Mozart — và có lẽ của cả nhạc cổ điển." (đánh giá không nguồn; cũng ở mô tả trang cũ). Köchel online: "one of … most popular and best-known works today", in lần đầu "around 1837"; IMSLP ghi bản in đầu "1827 ca." (André, Offenbach): hai nguồn lệch năm, cả hai đều sau 1791, nên trang chỉ viết "nhiều năm sau khi ông mất". Mô tả trang viết lại theo nội dung mới.'
  - id: n8
    cau: 'Tên Mozart đặt, Eine kleine Nachtmusik, chỉ loại nhạc để chơi vào buổi tối và ban đêm; nhạc như vậy thường viết nhân ngày lễ thánh bổn mạng của bạn bè hay theo đặt hàng.'
    loai: lich-su
    nguon: [kv-525, cod-serenade]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Serenade là nhạc để chơi vào buổi tối, ngoài trời, thường theo đặt hàng". Vì Köchel online nói tên Serenade không do Mozart đặt, câu viết lại theo tên gốc: "The original title refers to its use in the evening and at night. Night musics (nocturnes) were usually written on the occasion of friends’ name days or on commission." (COD: serenade "Properly, open-air evening mus.")'
  - id: n9
    cau: 'Không ai biết Mozart viết K. 525 nhân dịp nào.'
    loai: lich-su
    nguon: [kv-525]
    ket_qua: dung
    ghi_chu: 'Câu mới. Köchel online: "The exact circumstances of the composition of the work … are not known."'
  - id: n10
    cau: 'Mozart ghi K. 525 vào danh mục ngày 10/8/1787, cùng năm với vở opera Don Giovanni.'
    loai: nam
    nguon: [kv-525, kv-620]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mozart viết K. 525 trong cùng mùa hè với vở opera Don Giovanni". Không tìm được nguồn bậc 1–2 đọc được nói Mozart viết Don Giovanni vào mùa hè 1787; Köchel online chỉ ghi "Don Giovanni, KV 527 (1787)". Viết "cùng năm".'
  - id: n11
    cau: 'Trang này nói về chương 1 (Allegro), viết ở hình thức sonata.'
    loai: cau-truc
    nguon: [nma-525, cod-sonata-form]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chương 1 (Allegro) là ví dụ trong sách giáo khoa của hình thức sonata" (đánh giá). NMA: "Allegro"; trình bày ô 1–55 có dấu nhắc lại, chủ đề 2 ở Rê trưởng; phát triển ô 56–75; tái hiện ô 76, chủ đề 2 ở Sol trưởng: đúng các phần COD mô tả. Thêm "Trang này nói về" theo gợi ý review D6-L1-gom (minuet-trio m15).'
  - id: n12
    cau: 'Link "Hình thức sonata" (/opus/hinh-thuc/sonata/).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/hinh-thuc/sonata.md có (đã khóa).'
  - id: n13
    cau: 'Trình bày: chủ đề 1 mở bằng cả bốn bè chơi đồng âm, đi lên theo các nốt của hợp âm Sol trưởng rồi đáp xuống.'
    loai: cau-truc
    nguon: [nma-525]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chủ đề 1 bắt đầu bằng chùm nốt đi lên như tên lửa (Mannheim rocket) rồi đáp xuống bằng câu hát đối đáp". NMA tr. 43: ô 1–2 bốn hệ (violin I, II, viola, cello và contrabass) cùng "f", Sol–Rê–Sol–Rê–Sol–Si–Rê đi lên; ô 3–4 trên hợp âm Rê bảy rồi đi xuống. Tên "Mannheim rocket" chỉ thấy ở blog, Wikipedia (bậc 3); COD mục "Mannheim School" không nói tới, nên bỏ. "Câu hát đối đáp" đã có ở dòng 2 của bảng.'
  - id: n14
    cau: 'Trình bày: chủ đề 2 ở giọng Rê trưởng (giọng át).'
    loai: cau-truc
    nguon: [nma-525, cod-sonata-form]
    ket_qua: dung
    ghi_chu: 'NMA tr. 44: ô 28 "p", Rê trưởng (Đô♯, bè trầm Rê/La). Rê là bậc V của Sol.'
  - id: n15
    cau: 'Phát triển: ngắn (20 ô nhịp), mở bằng chủ đề 1 ở Rê trưởng, rồi các nốt giáng (Si♭, Mi♭) đưa nhạc sang màu giọng thứ trước khi về Sol trưởng.'
    loai: cau-truc
    nguon: [nma-525]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phát triển: ngắn gọn, đi qua các giọng thứ." NMA tr. 46: phát triển ô 56–75 (20 ô); ô 56–59 hình đi lên của chủ đề 1 ở Rê trưởng (f); ô 66–73 Si♭, Mi♭ (bè trầm Mi♭ ô 68), Đô♯ và Si♭ cùng lúc ô 72–73 (vùng Rê thứ); ô 74–75 dừng trên Rê, ô 76 về Sol trưởng. Không đủ chắc để gọi tên từng giọng thứ, nên viết "màu giọng thứ".'
  - id: n16
    cau: 'Tái hiện: cả hai chủ đề trở về Sol trưởng.'
    loai: cau-truc
    nguon: [nma-525, cod-sonata-form]
    ket_qua: dung
    ghi_chu: 'NMA tr. 46: ô 76 chủ đề 1 Sol trưởng (f, đồng âm); tr. 48: ô 101 chủ đề 2 Sol trưởng (Fa♯, bè trầm Rê–Sol).'
  - id: n17
    cau: 'Tác phẩm vốn có 5 chương, nhưng chương 2 (một minuet có trio) đã thất lạc, nên bản ngày nay chỉ còn 4 chương.'
    loai: lich-su
    nguon: [kv-525, imslp-525]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chi tiết lịch sử thú vị: … nhưng chương minuet thứ hai đã thất lạc — bản chúng ta nghe ngày nay chỉ còn 4 chương." "Chương minuet thứ hai" dễ hiểu thành minuet thứ hai (chương 4, còn); Köchel: minuet thứ nhất, "in second place", bị mất; IMSLP: "2. [Menuetto and Trio (lost)]". Bỏ chữ "thú vị".'
  - id: n18
    cau: 'Chương 3 (Menuetto) được phân tích ở trang Minuet và Trio (link /opus/hinh-thuc/minuet-trio/#i-qua-mot-tac-pham-mozart-eine-kleine-nachtmusik-chuong-3).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Câu mới. src/content/docs/hinh-thuc/minuet-trio.md (đã khóa, tiêu đề "Minuet và Trio") dòng 18: "## Đi qua một tác phẩm: Mozart, Eine kleine Nachtmusik, chương 3"; id theo quy ước id cũ (bỏ dấu, mất chữ "đ", ký tự lạ bỏ) là i-qua-mot-tac-pham-mozart-eine-kleine-nachtmusik-chuong-3, đã dùng ở piano/tac-pham/minuet-sol (review D6-L1-gom kiểm trong bản xem). Lý do thêm: hinh-thuc/minuet-trio gọi trang này là hướng dẫn nghe của tác phẩm khi phân tích chương 3; review D6-L1-gom gợi ý trỏ chương 3 sang đúng chỗ.'
  - id: n19
    cau: 'Theo dõi, dòng 1: chủ đề 1: cả dàn dây đồng loạt, chùm nốt đi lên như tên lửa.'
    loai: cau-truc
    nguon: [nma-525]
