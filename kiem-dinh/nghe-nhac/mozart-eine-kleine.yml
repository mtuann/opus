doi_chu:
  - cu: "mô tả: Đây là bản nhạc mở đầu quen thuộc nhất của Mozart — và có lẽ của cả nhạc cổ điển. Serenade là nhạc để chơi vào buổi tối, ngoài trời, thường theo đặt hàng…"
    moi: "mô tả: Hướng dẫn nghe chương 1 (Allegro) của Eine kleine Nachtmusik, K. 525: một chương ở hình thức sonata, viết cho đàn dây năm 1787."
    ly_do: 'Mô tả trang (description): theo n7, n8, n11.'
  - cu: 10 tháng 8, 1787 (Vienna)
    moi: Mozart ghi vào danh mục tác phẩm của mình ngày 10 tháng 8, 1787 (Vienna)
    ly_do: 'n3: Köchel online.'
  - cu: Serenade cho dàn dây (2 violin, viola, cello, contrabass)
    moi: Cho 2 violin, viola, cello và contrabass; tên thể loại Serenade có từ bản in đầu, không do Mozart đặt
    ly_do: 'n5: Köchel online.'
  - cu: "Đây là bản nhạc mở đầu quen thuộc nhất của Mozart — và có lẽ của cả nhạc cổ điển. Serenade là nhạc để chơi vào buổi tối, ngoài trời, thường theo đặt hàng; Mozart viết K. 525 trong cùng mùa hè với vở opera Don Giovanni."
    moi: "Danh mục Köchel online gọi K. 525 là một trong những tác phẩm nổi tiếng nhất của Mozart ngày nay, dù nó chỉ được in lần đầu nhiều năm sau khi ông mất. Tên Mozart đặt, Eine kleine Nachtmusik, chỉ loại nhạc để chơi vào buổi tối và ban đêm; nhạc như vậy thường viết nhân ngày lễ thánh bổn mạng của bạn bè hay theo đặt hàng. Không ai biết Mozart viết K. 525 nhân dịp nào. Ông ghi nó vào danh mục ngày 10/8/1787, cùng năm với vở opera Don Giovanni."
    ly_do: 'n7, n8, n9, n10: Köchel online, IMSLP.'
  - cu: "Chương 1 (Allegro) là ví dụ trong sách giáo khoa của hình thức sonata (xem Hình thức sonata):"
    moi: "Trang này nói về chương 1 (Allegro), viết ở hình thức sonata (xem Hình thức sonata):"
    ly_do: 'n11: bỏ đánh giá; ghi rõ trang nói chương 1 (review D6-L1-gom).'
  - cu: "Trình bày: chủ đề 1 bắt đầu bằng chùm nốt đi lên như tên lửa (Mannheim rocket) rồi đáp xuống bằng câu hát đối đáp; chủ đề 2 ở giọng Rê trưởng (giọng át)."
    moi: "Trình bày: chủ đề 1 mở bằng cả bốn bè chơi đồng âm, đi lên theo các nốt của hợp âm Sol trưởng rồi đáp xuống; chủ đề 2 ở giọng Rê trưởng (giọng át)."
    ly_do: 'n13: NMA ô 1–4; tên Mannheim rocket không có nguồn bậc 1–2.'
