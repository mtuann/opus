    nguon: [nma-525]
    ket_qua: dung
    ghi_chu: 'NMA ô 28 "p", Rê trưởng; "nhẹ nhàng" theo ký hiệu p; "thanh thoát" là cách tả tính cách, câu hỏi 2 cũng dùng cặp "dồn dập/thanh thoát".'
  - id: n23
    cau: 'Theo dõi, dòng 5: phần kết của trình bày, khép lại nhỏ tiếng bằng những nốt ngắn; sau đó cả phần trình bày được nhắc lại.'
