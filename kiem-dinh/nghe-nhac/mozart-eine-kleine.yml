ghi_chu: 'Hướng dẫn nghe Eine kleine Nachtmusik, chương 1 (tầng Tác phẩm; bản ghi tac-pham/mozart-eine-kleine; loai: nghe là cấu trúc). Không có khối abc. Bản nhạc: tổng phổ Neue Mozart-Ausgabe IV/12/6 trên DME của Mozarteum, ảnh trang 43–48 (ucb13_125_<trang>.jpg), đọc ảnh: Allegro, 4/4 (C), ô 1–4 đồng âm f; ô 11–17 p, violin rồi viola và bè trầm; đoạn chuyển ô 18–27 (móc kép, crescendo, f ô 22); chủ đề 2 Rê trưởng ô 28 p; dấu nhắc lại cuối ô 55 (phần kết p); phát triển ô 56–75 (có dấu nhắc lại đầu ô 56 cho nửa sau); tái hiện ô 76; chủ đề 2 Sol trưởng ô 101. Lịch sử: Köchel online KV 525 (ngày ghi vào danh mục, tên Serenade chỉ có từ bản in đầu, năm chương, chương 2 thất lạc), IMSLP (wikitext), COD (serenade, sonata form). Độ dài: bản thu Advent Chamber Orchestra (bản ghi ban_thu) 355,41 giây trên Commons. Sửa: n3, n5, n7, n8, n10, n11, n13, n15, n17, n23, n24, n27, n31; thêm câu n9 và n18 (link sang hinh-thuc/minuet-trio cho chương 3). Không có chỗ chưa chắc. Bảng "Theo dõi khi nghe" giữ đủ 8 dòng, đúng thứ tự, khớp 8 mốc của ::khoi-nghe (không sửa mốc); chỉ sửa chữ dòng 5 (thêm vế phần trình bày được nhắc lại: mốc dòng 5 = 63 giây, dòng 6 = 199 giây, khoảng giữa gồm phần kết và cả lần nhắc lại) và dòng 6. Câu ở hồ sơ khác: hinh-thuc/minuet-trio m15 ("đúng tác phẩm trong hướng dẫn nghe"): trang này về cùng tác phẩm, nay ghi rõ "Trang này nói về chương 1" và trỏ sang mục chương 3 của minuet-trio (id i-qua-mot-tac-pham-mozart-eine-kleine-nachtmusik-chuong-3, theo quy ước id cũ và theo hồ sơ piano/tac-pham/minuet-sol, mozart-minuet-k2 đã kiểm trong bản xem), theo gợi ý của review D6-L1-gom. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: serenade, divertimento (chỉ ở hồ sơ), đồng âm (unison), đoạn chuyển, chủ đề 1/chủ đề 2, contrabass. Đã có: sonata form, exposition, development, recapitulation, minuet, dominant (giọng át), Allegro. Đã bỏ tên "Mannheim rocket" (chỉ thấy ở blog và Wikipedia; COD mục Mannheim School không có tên này).'
