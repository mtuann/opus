    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phần kết của trình bày, khép lại bằng câu nhạc dứt khoát". NMA tr. 45: ô 54–55 "p", móc đơn ngắt, dấu nhắc lại cuối ô 55: kết nhỏ tiếng chứ không "dứt khoát". Thêm vế nhắc lại: mốc dòng 5 = 63 giây (khoảng ô 35), dòng 6 = 199 giây (ô 56): khoảng giữa gồm phần kết và cả lần nhắc lại. Không thêm hay bớt dòng.'
  - id: n24
    cau: 'Theo dõi, dòng 6: phát triển: ngắn, các nốt giáng đưa nhạc sang màu giọng thứ.'
    loai: cau-truc
    nguon: [nma-525]
    ket_qua: da-sua
