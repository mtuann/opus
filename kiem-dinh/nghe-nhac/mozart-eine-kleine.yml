    ten: 'Köchel-Verzeichnis online, KV 525: "Dating Vienna, 10.08.1787"; "vl1, vl2, vla, vlc+b"; "one of Wolfgang Amadé Mozart’s most popular and best-known works today … first printed around 1837, almost 50 years after Mozart’s death"; "The original title refers to its use in the evening and at night. Night musics (nocturnes) were usually written on the occasion of friends’ name days or on commission. The exact circumstances of the composition of the work, which Mozart entered in his own handwritten catalog of works on 10 August 1787, are not known"; "Contrary to the genre designation Serenade, which originated not from Mozart but is only found in the first print, it is apparently a Divertimento"; "“consisting of an Allegro, Minuet and Trio. - Romance. Minuet and Trio, and Finale”. The first minuet movement, which … was in second place in the original five-movement work, was lost"'
