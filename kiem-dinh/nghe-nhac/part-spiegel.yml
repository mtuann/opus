      kiem_mau: "Claude Opus 5.5, kiểm thay chủ repo theo lời giao 06/11/2026 (chủ repo không tự kiểm): 8 nhận định mẫu của D6-L11, 8 đúng (4 có điều kiện: ravel-bolero h3, brahms-4 n12, dvorak-9-largo n6 dựa một phần vào tổng phổ lượt 1 đã đọc; số biến tấu Brahms các nguồn đếm khác nhau), 0 sai (bao-cao/d6-l11-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Hướng dẫn nghe Spiegel im Spiegel (tầng Tác phẩm; bản ghi tac-pham/part-spiegel; loai: nghe là cấu trúc). Bản quyền: Pärt còn sống, tác phẩm 1978 (Universal Edition) còn bảo hộ ở Việt Nam và Mỹ. Khối abc cũ ("Minh họa nguyên tắc tintinnabuli": Fa trưởng, 6/4, bè dưới F A C lặp, bè trên A G A B♭ A) rất gần phần mở đầu thật: đã thay bằng ví dụ soạn cho trang này (Rê thứ, 4/4, bè M đi xuống rồi lên từng bậc, bè T là nốt hợp âm Rê thứ gần nhất phía dưới); bảng Theo dõi khi nghe bỏ tên nốt của giai điệu violin ("nốt La"), viết "nốt trung tâm" (Trung tâm Arvo Pärt có nói nốt La, nhưng đó là tên nốt giai điệu của tác phẩm còn bảo hộ). Không có bản nhạc hết bảo hộ: cấu trúc đối chiếu mô tả của Trung tâm Arvo Pärt (bậc 2, trang chính thức của nhà soạn nhạc) và bài của Jelena Tokun trên cùng trang. Giọng Fa trưởng chỉ có nguồn là một luận văn trên Research Catalogue (Firtina Kiral, 2025) và Wikipedia (bậc 3): lượt 2 nên tìm thêm. ::khoi-nghe không có bản thu (không sửa). Không tính là nhận định: tiêu đề mục, tiêu đề cột. Câu ở hồ sơ khác trỏ tới trang này: piano/nha-soan-nhac n171, nhac-cu/violin n24, nhac-ly/32-ky-thuat-the-ky-20 n47 (giữ: trang nói về Spiegel im Spiegel của Pärt, lặp và biến đổi chậm: phần đệm ba nốt lặp, mỗi câu thêm một nốt), lich-su/nhac-truyen-thong-viet-nam n8 (và n80: violin và piano chơi nốt ghi sẵn), piano/tac-pham/satie-gymnopedie n68, nhan-dien/dau-van-tay n52, lich-su/thoi-ky/the-ky-20 n37: trang giữ đúng đường dẫn và tác phẩm. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: tintinnabuli, bè M và bè T (M-voice, T-voice), hợp âm ba chủ (tonic triad; có tonic "chủ âm"). Có bản ghi: scale (gam).'
nguon:
  - id: ap-544
    bac: 2
    ten: 'Trung tâm Arvo Pärt (trang chính thức), Spiegel im Spiegel (đọc 06/11/2026): "1978", "Scored for violin and piano", "Duration 10 min", "(Mirror in the Mirror)"; "In 1978, the renowned Russian violinist Vladimir Spivakov commissioned a piece … premiered it at the Moscow Conservatory"; "It only consists of the melody of the solo instrument and the three-note piano accompaniment"; "each ascending melodic line is followed by a descending mirror phrase. Initially, the melody consists of only two notes, with another note being added with each of the following phrases"; "After each distancing, the melody returns to the central pitch of A"; "the piano part includes tintinnabuli notes – like little bells that alternately sound above and below the melodic line"; "numerous versions for various instrument combinations"; "CD Alina. ECM New Series 1591"; "© Universal Edition AG, Wien"'
    link: https://www.arvopart.ee/en/arvo-part/work/544/
  - id: ap-bio
    bac: 2
    ten: 'Trung tâm Arvo Pärt, Biography: "Arvo Pärt was born on 11 September 1935 in Paide"; "In 1976, Pärt emerged with a new and highly original musical language, which he called tintinnabuli (from tintinnabulum – Latin for ’little bell’)"; "unites two monodic lines of structure – melody and triad"; "a large part of the contemporary music has been influenced by his tintinnabuli compositions"'
    link: https://www.arvopart.ee/en/arvo-part/biography/
  - id: tokun
    bac: 2
    ten: 'Jelena Tokun, "Formal algorithms of tintinnabuli in Arvo Pärt’s music" (2011), đăng trên trang Trung tâm Arvo Pärt: "the rationally constructed, mostly scalar melodic voice and the tintinnabuli voice that is sculpted on a central triad. The names of these two voices, the M-voice and T-voice … are used by the composer himself"; "the voice that is built up on the three pitches of a central triad"'
    link: https://www.arvopart.ee/en/arvo-part/article/formal-algorithms-of-tintinnabuli-in-arvo-parts-music/
  - id: loc-spiegel
    bac: 2
    ten: 'Library of Congress, bản ghi tác phẩm n00063915 (JSON): "Pärt, Arvo. Spiegel im Spiegel", theo MGG: "für V. und Kl. (1978) …; für Vc. und Kl. (1978) …; für Va. und Kl. …; für Hr. und Kl."; tên khác "Mirror in the mirror"'
    link: https://id.loc.gov/authorities/names/n00063915.json
  - id: mb-alina
    bac: 2
    ten: 'MusicBrainz, Arvo Pärt: Alina (ECM New Series 1591, 18/10/1999): bài 1 và 5 Spiegel im Spiegel, Vladimir Spivakov (violin), Sergei Bezrodny (piano), 10:39 và 9:49; bài 3 Dietmar Schwalke (cello), Alexander Malter (piano), 9:13. Tìm bản thu "Spiegel im Spiegel": 96 bản có độ dài, phần lớn 7,8–10,5 phút'
    link: https://musicbrainz.org/release/f084b2b3-63ff-3f6c-b8eb-0a13f4ab9cc9
  - id: kiral
    bac: 2
    ten: 'Firtina Kiral, luận văn "Arvo Pärt | Holy Minimalism | Silence" (2025), Research Catalogue, mục Spiegel im Spiegel: "The inner voice always acts as a T-voice in F major"; "When the violin plays an F, the piano plays and F major triad"; phần đệm ba nốt của piano "sustains an upwardly motion". Luận văn sinh viên, nguồn yếu: chỉ dùng cho giọng Fa trưởng và hướng đi lên của hình đệm, kèm ap-544'
    link: https://www.researchcatalogue.net/view/3795800/3796304
