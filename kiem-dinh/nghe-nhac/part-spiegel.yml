khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem: [ cu-phap, giong, hop-am, nhip, ban-quyen ]
    ket_qua: da-sua
    ghi_chu: 'Khối cũ ("Minh họa nguyên tắc tintinnabuli", K:F, M:6/4: bè trên A6 | G6 | A6 | B6 | A6, bè dưới F, A, C lặp) rất gần phần mở đầu thật của tác phẩm còn bảo hộ: thay bằng khối soạn cho trang này, T: "Bè M và bè T (soạn cho trang này)", khác tác phẩm ở giọng (Rê thứ), nhịp (4/4), đường nét (bè M đi xuống rồi lên từng bậc từ chủ âm) và cách viết bè T (đổi theo bè M, không phải hình rải lặp). Kiểm: K:Dm nên B là Si♭. Bè M (RH): Rê5 Đô5 | Si♭4 La4 | Sol4 La4 | Si♭4 Đô5 | Rê5 = đi từng bậc của gam Rê thứ tự nhiên (đúng "phần lớn đi theo gam", Tokun). Bè T (LH): mỗi nốt là nốt của hợp âm Rê thứ (Rê, Fa, La) gần nhất, thấp hơn nốt bè M: Rê5→La4, Đô5→La4, Si♭4→La4, La4→Fa4, Sol4→Fa4, La4→Fa4, Si♭4→La4, Đô5→La4, Rê5→La4: đúng điều câu dẫn nói (n16) và chỉ dùng nốt của hợp âm ba chủ (Tokun). M:4/4, L:1/4: mỗi ô 4 phách (2+2; ô cuối 4). Theo Quy ước ABC: X, T, M, L, Q, K; %%score {RH LH}; mọi dòng bắt đầu [V:RH]/[V:LH]. LH để khóa Sol (cùng quãng tám với bè M) cho dễ thấy khoảng cách hai bè: khác bố cục mẫu (LH khóa Fa), người giao xem có chấp nhận. node tools/khuong-nhac.mjs: 358 khối, 0 lỗi. Số ngón: hai bè, mỗi bè một nốt một lúc, chơi được bằng hai tay hay hai nhạc cụ.'
doi_chu:
  - cu: Album Alina (ECM, 1999)
    moi: 'Album Alina (ECM New Series 1591, 1999): ba bản Spiegel im Spiegel, hai bản violin và piano, một bản cello và piano'
    ly_do: 'n7: MusicBrainz, Trung tâm Arvo Pärt.'
  - cu:
      - 'Tên tác phẩm nghĩa là "Gương trong gương": hình ảnh phản chiếu vô tận. Từ giữa những năm 1970, Pärt phát triển phong cách tintinnabuli (tiếng Latin: "những chiếc chuông nhỏ"). Nguyên tắc rất đơn giản:'
      - Một bè đi theo gam, từng bước một (bè giai điệu).
      - Một bè chỉ dùng các nốt của hợp âm chủ (Fa – La – Đô), vang như tiếng chuông.
      - Từ hai nguyên tắc đó, âm nhạc trở nên tĩnh lặng, trong suốt, gần như thiền định.
      - 'Minh họa nguyên tắc (không phải bản nhạc gốc): piano rải hợp âm Fa trưởng đi lên, violin đi từng bước quanh nốt La.'
    moi:
      - 'Tên tác phẩm nghĩa là "Gương trong gương": mỗi câu nhạc đi lên được nối bằng một câu "soi gương" đi xuống. Năm 1976, Pärt tạo ra phong cách tintinnabuli (từ tintinnabulum, tiếng Latin: "chiếc chuông nhỏ"). Nguyên tắc gồm hai bè đi liền với nhau:'
      - Một bè giai điệu (bè M), phần lớn đi theo gam, từng bước một.
      - 'Một bè chỉ dùng ba nốt của hợp âm ba chủ (ở bản này: Fa – La – Đô), vang như tiếng chuông (bè T).'
      - 'Chất liệu của Spiegel im Spiegel rất ít: chỉ có giai điệu của nhạc cụ độc tấu và phần đệm ba nốt của piano.'
      - 'Ví dụ dưới đây soạn riêng cho trang này, không lấy từ tác phẩm của Pärt, để thấy hai bè ấy: bè M đi xuống rồi đi lên từng bậc trong gam Rê thứ; mỗi nốt của bè T là nốt của hợp âm Rê thứ (Rê – Fa – La) gần nhất phía dưới nốt bè M.'
