  - id: n15
    cau: 'Mozart để lại nhiều nợ; vợ ông, Constanze, nhờ bạn bè của Mozart hoàn thành bản nhạc, và sau vài lần không thành, việc đến tay học trò Süssmayr.'
    loai: lich-su
    nguon: [ carus-626 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Vợ ông, Constanze, nhờ các học trò hoàn thành, chủ yếu là Süssmayr, để nhận tiền đặt hàng." Carus: nợ, nhờ "Mozart’s friends", "After two failed attempts", "Mozart’s pupil Franz Xaver Süßmayr". Vế "để nhận tiền đặt hàng" không thấy ở nguồn đã đọc (Carus nói về nợ), bỏ; "các học trò" thành "bạn bè" theo Carus. Review D6-L9-gom: lượt 2 khong-chac. "Nhiều nợ" có ở Carus (lượt 1: "Mozart left his wife in considerable debt"); NMA nói Constanze túng thiếu, không trái. "Hai lần không thành" (Carus) khác NMA (Eybler bỏ dở, rồi những người khác từ chối, không rõ số người): đổi thành "vài lần không thành", đúng với cả hai nguồn. Không chạy lại (chỉ làm nhẹ một vế).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/objs/pdf/nma_14_-23_-3_eng.pdf" ]
    luot_2_ghi_chu: 'NMA I/1/Abt. 2/2: Constanze túng thiếu ("straitened circumstances"), cần phần tiền còn lại; Eybler nhận bản dở ngày 21/12/1791 rồi bỏ; "Constanze must then have turned to other masters, but all of them declined", rồi đến Süßmayr. NMA không nói "nhiều nợ", và không nói đúng "hai lần không thành" (một lần Eybler, sau đó những người khác từ chối, không rõ số người). Gợi ý: "Constanze cần tiền; Eybler bắt tay vào rồi bỏ, vài người khác từ chối, cuối cùng việc đến tay Süssmayr."'
