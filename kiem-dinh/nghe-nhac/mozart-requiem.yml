ghi_chu: 'Hướng dẫn nghe Requiem K. 626 (tầng Tác phẩm; bản ghi tac-pham/mozart-requiem; loai: nghe là cấu trúc). Không có khối abc. Bản nhạc: Neue Mozart-Ausgabe I/1/Abt. 2/1 (phần Mozart viết, Leopold Nowak 1965) trên DME, ảnh ucb02_13_<trang>.jpg: Introitus tr. 3, Kyrie tr. 10, Tuba mirum tr. 24, Rex tremendae tr. 28, Recordare tr. 31, Confutatis tr. 41–42, Lacrimosa tr. 46; mục lục NMA (Dies irae "Allegro assai"); lời tựa "Zum vorliegenden Band" tr. VII–IX (ảnh trang -21 đến -19, tiếng Đức): Walsegg, vợ mất 14/2/1791, thói quen nhận tác phẩm đặt hàng là của mình, đơn đặt giấu tên, "zu Beginn des Sommers 1791", ba giai đoạn viết xen với Zauberflöte và Tito, nằm liệt giường từ 20/11, Introitus và Kyrie, Sequenz, Offertorium, 8 ô Lacrimosa là những nốt cuối. Ai viết phần nào: bảng so sánh của Carus (Ulrich Leisinger, "The additions – Who wrote what?"). Lịch sử khác: Köchel online (KV 626 và 626 (1)), IMSLP, trang sản phẩm Carus 51.626 (Mozart mất 5/12/1791; Constanze, nợ, hai lần thất bại, học trò Süßmayr; bản Süßmayr "am bekanntesten"), COD (Requiem, basset horn, trombone). Độ dài: bản thu Josef Krips (14 file) trên Commons. Sửa: n7, n10, n11, n15, n16, n29, n33; thêm dòng Recordare (n23); bỏ n31. Không có chỗ chưa chắc. Câu dẫn "Bảng đi qua các đoạn đầu…" và tiêu đề "## Theo dõi khi nghe" do người giao đổi (người giao ghi doi_chu cho chỗ ấy). Câu ở hồ sơ khác: lich-su/thoi-ky/co-dien n37, nhan-dien/the-loai n35 (trang Mozart Requiem cho hợp xướng, dàn nhạc, giọng độc xướng, lời Latin), nhac-cu/nhac-cu-khac (link): trang giữ đúng. Bỏ câu "Giai thoại \"Mozart viết Requiem cho chính mình\" và vai trò của Salieri trong phim Amadeus (1984) là hư cấu" (không tìm được nguồn bậc 1–2 đọc được cho từng vế; Carus chỉ nói chung là có nhiều giai thoại). Không tính là nhận định: tiêu đề mục, tiêu đề cột, ::hinh-cau-truc và ::khoi-nghe (thuộc hồ sơ bản ghi). Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: fugue kép (double fugue), basset horn, quãng 7 giảm, tiết tấu chấm dôi, Introitus, Kyrie, Dies irae, Tuba mirum, Rex tremendae, Recordare, Confutatis, Lacrimosa, Offertorium, Hostias. Đã có: requiem (Lễ cầu hồn), fugue.'
nguon:
  - id: nma-626
    bac: 1
    ten: 'Neue Mozart-Ausgabe I/1/Abt. 2/1, Requiem: Fragment (Leopold Nowak, 1965), tổng phổ phần Mozart viết, ảnh trên Digital Mozart Edition: tr. 3 Introitus "Adagio", tr. 10 Kyrie "Allegro", tr. 24 Tuba mirum "Andante", "Trombone [tenore] solo", tr. 28 Rex tremendae, tr. 31 Recordare (3/4, một giáng, "Corno di Bassetto I, II", bốn bè "solo"), tr. 41–42 Confutatis ("Tutti sotto voce" ở soprano, alto), tr. 46 Lacrimosa (8 ô); mục lục: "SEQUENZ. Dies irae. Allegro assai"'
    link: https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=13&p1=3
  - id: nma-626-vorwort
    bac: 2
    ten: 'Neue Mozart-Ausgabe I/1/Abt. 2/1, "Zum vorliegenden Band" (Leopold Nowak), tr. VII–IX: "Franz Graf von Walsegg-Stuppach … Er hatte außerdem die Gewohnheit, bei anerkannten Komponisten Werke zu bestellen, die er dann als seine eigenen ausgab"; "Als nämlich am 14. Februar 1791 des Grafen Gattin Anna … starb, kam er auf die Idee, zu ihrem Andenken von Mozart ein Requiem komponieren zu lassen"; "unerkannt zu bleiben wünschte"; "Das dürfte aller Wahrscheinlichkeit nach zu Beginn des Sommers 1791 gewesen sein"; "Die letzten sechs Monate in Mozarts Leben gehören neben einigen kleineren Werken der Zauberflöte, der Krönungsoper La clemenza di Tito …"; "die am 20. November einsetzende Bettlägerigkeit Mozarts"; "Introitus und Kyrie sind von Mozart geschrieben"; "Die acht Takte des \"Lacrimosa\" sind Mozarts letzte Noten"'
    link: https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=13&p1=-21
  - id: carus-chart
    bac: 2
    ten: 'Carus-Verlag, "The additions – Who wrote what? Mozart’s Requiem. A comparison of versions" (Ulrich Leisinger, CV 99.078/35, PDF): cột "W. A. Mozart, Autograph score": "1. Requiem complete"; "2. Kyrie main parts only, instrumental parts by person unknown"; "3. Dies irae … 10. Hostias main parts"; "8. Lacrymosa main parts (bars 1-8 only)"; Sanctus, Benedictus, Agnus Dei: "vocal parts?"/"Instructions from Mozart?", Süßmayr "supposedly new music"; "14. Lux aeterna … reused from section 1", "Cum Sanctis tuis … reused from section 2"'
    link: https://www.carusmedia.com/images-intern/medien//50/5162600/5162600sb.pdf
  - id: carus-626
    bac: 2
    ten: 'Carus-Verlag, Requiem KV 626 (bản Süßmayr, Carus 51.626): trang sản phẩm "À sa mort, le 5 décembre 1791"; tờ giới thiệu (5162600pm.pdf): "Mozart left his wife in considerable debt. Constanze therefore turned to Mozart’s friends, asking them to complete the fragment. After two failed attempts, the task passed to Mozart’s pupil Franz Xaver Süßmayr, who completed the Requiem in the form known today"; trang sản phẩm (đánh giá trích lại): "Diese Version ist heute noch am bekanntesten"'
    link: https://www.carus-verlag.com/fr/partitions-et-enregistrements/mozart-requiem-suessmayr-fassung-5162600.html
  - id: kv-626
    bac: 2
    ten: 'Köchel-Verzeichnis online: KV 626 "Requiem in D minor, Missa pro defunctis (fragment)", "Dating Vienna, 15.09 – 20.11.1791", "Uncompleted work", nhạc cụ "…, SATB, b+org-fig"; KV 626 (1) "The Requiem, completed by Franz Xaver Süsmayr, in the traditional form"'
    link: https://kv.mozarteum.at/en/work/requiem-in-d-minor-7395
  - id: imslp-626
    bac: 2
    ten: 'IMSLP, Requiem in D minor, K.626 (wikitext qua api.php): "Language=Latin", "Piece Style=Classical", "Vocal soli (soprano, alto, tenor, bass), Mixed Chorus (SATB), Orchestra", 8 phần (Sequentia: Dies irae, Tuba mirum, Rex tremendae, Recordare, Confutatis, Lacrimosa), "Average Duration=60 minutes"'
    link: https://imslp.org/wiki/Requiem_in_D_minor,_K.626_(Mozart,_Wolfgang_Amadeus)
  - id: commons-krips
    bac: 2
    ten: 'Wikimedia Commons, "Mozart - Requiem (Krips) - I. Introitus.flac" … "XIV. Communio.flac" (14 file, API imageinfo, giây): 303,9; 161,1; 110; 227; 179; 321; 185; 233; 240; 291; 109; 313; 235,5; 336,5: tổng 3245 giây (54 phút); Introitus đến Lacrimosa 1720 giây (29 phút)'
    link: https://commons.wikimedia.org/wiki/File:Mozart_-_Requiem_(Krips)_-_I._Introitus.flac
  - id: cod-requiem
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "Requiem": "The RC Mass for the Dead (Lat. Missa pro defunctis) … Dies Irae (Day of Wrath) divided into Tuba mirum (Hark, the trumpet) …, Rex tremendae (King of glory), Recordare (Remember) …, Confutatis (From the accursed), Lacrimosa (Lamentation)"; "Other notable settings are by … Mozart (incomplete)"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/requiem
  - id: cod-basset
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "basset horn": "Alto cl. in F … used by Mozart in Requiem"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/basset-horn
  - id: cod-trombone
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "trombone": "In baroque times they were confined to church mus."'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/trombone
  - id: loc-mozart
    bac: 2
    ten: 'Library of Congress, n81018421 (JSON): "Mozart, Wolfgang Amadeus, 1756-1791"'
    link: https://id.loc.gov/authorities/names/n81018421.json
  - id: cohrs-626
    bac: 2
    ten: 'Lời tựa tiếng Anh của B. G. Cohrs, Requiem K. 626 (Repertoire Explorer 1425; lượt 2 hồ sơ bản ghi đọc): "Requiem (48): Vocal parts & Basso Continuo by Mozart; Instrumentation begun by Mozart, possibly not entirely completed by him. Instrumentation finished by Süßmayr and Freystädtler"; lời tựa 6159: phối khí Introitus "fairly advanced, almost complete"'
    link: https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf
