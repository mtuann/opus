    luot_2_ghi_chu: "câu đúng: Ở thời Baroque, trombone chủ yếu được dùng trong nhạc nhà thờ, dù cũng có mặt trong một số opera và oratorio (như L'Orfeo của Monteverdi, Saul của Handel).; IMSLP: dàn nhạc của Monteverdi trong opera L'Orfeo (1607) có 5 trombone; oratorio Saul của Handel (1738) có 3 trombone. Trombone thời Baroque gắn chủ yếu với nhạc nhà thờ nhưng không \"chỉ\"."
