  - id: n7
    cau: 'Bảng: Độ dài khoảng 45–55 phút; phần trong bảng "Theo dõi khi nghe" (từ Introitus đến Lacrimosa) khoảng 25–30 phút.'
    loai: so-lieu
    nguon: [ commons-krips, imslp-626 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 50–55 phút; đoạn gợi ý nghe trước khoảng 15 phút". Bản Krips trên Commons: cả bài 54 phút (IMSLP ghi trung bình 60 phút); Introitus đến Lacrimosa 1720 giây (khoảng 29 phút), không phải 15 phút. Viết lại theo số đo và nói rõ "đoạn gợi ý" là phần trong bảng. Review D6-L9-gom: lượt 2 khong-chac: ba bản thu MusicBrainz (Kertész 53/28 phút, Herreweghe 47/25, Abbado 48/24) cộng bản Krips của lượt 1 (54/29). Sửa theo khoảng của các số đo hai lượt: "45–55 phút", "25–30 phút". Không chạy lại (chữ chỉ gộp số đo hai lượt đã có).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://musicbrainz.org/release/bf2c86b8-de40-4813-8678-17213b60e42f", "https://musicbrainz.org/release/33a345bb-7d0b-4586-8a1c-203fa454d3f8", "https://musicbrainz.org/release/27df76e7-7648-40c9-9584-f93158f1c2e5" ]
    luot_2_ghi_chu: 'Ba bản thu trên MusicBrainz (bản Süßmayr): Kertész 53 phút, Introitus–Lacrimosa 28 phút; Herreweghe khoảng 47 phút, 25 phút; Abbado khoảng 48 phút, 24 phút. Tổng 50–55 phút chỉ đúng với bản chậm; phần Introitus–Lacrimosa khoảng 25–28 phút, không tới 30. Gợi ý: "khoảng 45–55 phút; … khoảng 25 phút".'
    review: dung
  - id: n8
    cau: 'Mùa hè năm 1791, Mozart nhận đơn đặt hàng giấu tên viết một bản Requiem. (Cũng là câu đầu của mô tả trang.)'
    loai: lich-su
    nguon: [ nma-626-vorwort ]
    ket_qua: dung
    ghi_chu: 'NMA: người đặt muốn "unerkannt zu bleiben"; việc đặt "aller Wahrscheinlichkeit nach zu Beginn des Sommers 1791" (rất có thể đầu mùa hè 1791).'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf" ]
    luot_2_ghi_chu: 'NMA: một người lạ ("grey messenger") mang yêu cầu của bá tước giấu tên; "This must in all likelihood have been at the beginning of Summer 1791."'
  - id: n9
    cau: 'Người đặt về sau được biết là bá tước Franz von Walsegg, muốn tưởng nhớ người vợ vừa mất (và có lẽ định nhận là tác phẩm của mình).'
    loai: lich-su
    nguon: [ nma-626-vorwort ]
    ket_qua: dung
    ghi_chu: 'NMA: Franz Graf von Walsegg-Stuppach; vợ Anna mất 14/2/1791, ông muốn đặt Mozart viết Requiem "zu ihrem Andenken"; ông có thói quen đặt nhạc rồi đưa ra như tác phẩm của mình. Giữ "có lẽ" vì NMA nói về thói quen chung.'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf" ]
    luot_2_ghi_chu: 'NMA: Franz, Count of Walsegg-Stuppach, vợ Anna mất 14/2/1791, ông muốn đặt một Requiem tưởng nhớ bà; ông thường đặt nhạc rồi "passed them off as his own".'
  - id: n10
    cau: 'Mozart viết Requiem xen với Cây sáo thần và vở opera La clemenza di Tito; ông nằm liệt giường từ ngày 20/11/1791 và mất khi bản nhạc còn dang dở.'
    loai: lich-su
    nguon: [ nma-626-vorwort, carus-626 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mozart vừa hoàn thành Cây sáo thần, ốm nặng, và mất khi bản nhạc còn dang dở." NMA: Requiem viết trong ba giai đoạn, xen với Zauberflöte (xong 28/9) và Tito; nằm liệt giường từ 20/11. "Vừa hoàn thành Cây sáo thần" khiến người đọc hiểu Mozart viết Requiem sau Cây sáo thần; viết lại theo NMA. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf" ]
    luot_2_ghi_chu: "NMA: sáu tháng cuối đời Mozart viết The Magic Flute, La clemenza di Tito và Kleine Freimaurer-Kantate cùng Requiem, xen kẽ; \"Mozart's being confined to bed from 20 November\"."
    review: dung
  - id: n11
    cau: 'Quanh sự ra đời của Requiem có nhiều giai thoại và truyền thuyết.'
    loai: lich-su
    nguon: [ carus-626 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giai thoại \"Mozart viết Requiem cho chính mình\" và vai trò của Salieri trong phim Amadeus (1984) là hư cấu." Không tìm được nguồn bậc 1–2 đọc được cho hai vế cụ thể; Carus: "The history of the genesis of Mozarts’s Requiem is entwined with legends and anecdotes." Viết lại chung theo Carus. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf", "https://dme.mozarteum.at/DME/objs/pdf/nma_73_-27_-3_eng.pdf" ]
    luot_2_ghi_chu: 'NMA nói về "grey messenger, who has become famous in literature"; lời tựa NMA II/5/19: về năm cuối đời Mozart "there is much unreliable and legendary material".'
    review: dung
  - id: n12
    cau: 'Mozart viết gần trọn Introitus, kể cả phối khí.'
    loai: lich-su
    nguon: [ carus-chart, nma-626-vorwort, cohrs-626 ]
    ket_qua: da-sua
