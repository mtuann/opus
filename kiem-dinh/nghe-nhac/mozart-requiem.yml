doi_chu:
  - cu: Khoảng 50–55 phút; đoạn gợi ý nghe trước khoảng 15 phút
    moi: Khoảng 45–55 phút; phần trong bảng "Theo dõi khi nghe" (từ Introitus đến Lacrimosa) khoảng 25–30 phút
    ly_do: 'n7: bản Krips trên Commons (lượt 1), ba bản thu MusicBrainz (lượt 2), review D6-L9-gom.'
  - cu: 'Mùa hè năm 1791, Mozart nhận đơn đặt hàng giấu tên viết một bản Requiem. Người đặt về sau được biết là bá tước Franz von Walsegg, muốn tưởng nhớ người vợ vừa mất (và có lẽ định nhận là tác phẩm của mình). Mozart vừa hoàn thành Cây sáo thần, ốm nặng, và mất khi bản nhạc còn dang dở. Giai thoại "Mozart viết Requiem cho chính mình" và vai trò của Salieri trong phim Amadeus (1984) là hư cấu.'
    moi: 'Mùa hè năm 1791, Mozart nhận đơn đặt hàng giấu tên viết một bản Requiem. Người đặt về sau được biết là bá tước Franz von Walsegg, muốn tưởng nhớ người vợ vừa mất (và có lẽ định nhận là tác phẩm của mình). Mozart viết Requiem xen với Cây sáo thần và vở opera La clemenza di Tito; ông nằm liệt giường từ ngày 20/11/1791 và mất khi bản nhạc còn dang dở. Quanh sự ra đời của Requiem có nhiều giai thoại và truyền thuyết.'
    ly_do: 'n10, n11: lời tựa NMA, Carus.'
  - cu: "Ai viết phần nào? Mozart hoàn thành trọn vẹn Introitus; viết các bè hát, bè trầm và nhiều gợi ý dàn nhạc từ Kyrie đến Hostias; và chỉ viết 8 ô nhịp đầu của Lacrimosa. Vợ ông, Constanze, nhờ các học trò hoàn thành, chủ yếu là Süssmayr, để nhận tiền đặt hàng. Ngày nay có nhiều phiên bản hoàn thành khác nhau; phiên bản Süssmayr vẫn phổ biến nhất."
    moi: "Ai viết phần nào? Mozart viết gần trọn Introitus, kể cả phối khí; viết các bè hát, bè trầm và nhiều gợi ý dàn nhạc từ Kyrie đến Hostias; và chỉ viết 8 ô nhịp đầu của Lacrimosa. Mozart để lại nhiều nợ; vợ ông, Constanze, nhờ bạn bè của Mozart hoàn thành bản nhạc, và sau vài lần không thành, việc đến tay học trò Süssmayr. Ngày nay có nhiều phiên bản hoàn thành khác nhau; phiên bản Süssmayr là phiên bản truyền thống, được biết đến nhiều nhất."
    ly_do: 'n15, n16: Carus, Köchel online; n12 (gần trọn Introitus, lời tựa Cohrs), n15 (vài lần, NMA) theo lượt 2, review D6-L9-gom.'
  - cu: "Mozart, Requiem: ai viết phần nào? Xanh: Mozart viết trọn. Vàng: Mozart viết bè hát và bè trầm, người khác hoàn thành phối khí (Lacrimosa: chỉ 8 ô nhịp đầu). Xám: chủ yếu Süssmayr. Đỏ: dùng lại nhạc Mozart ở phần mở đầu."
    moi: "Mozart, Requiem: ai viết phần nào? Xanh: Mozart viết gần trọn, kể cả phối khí. Vàng: Mozart viết bè hát và bè trầm, người khác hoàn thành phối khí (Lacrimosa: chỉ 8 ô nhịp đầu). Xám: chủ yếu Süssmayr. Đỏ: dùng lại nhạc Mozart ở phần mở đầu."
    ly_do: 'Chú thích hình (hinh.nghe của bản ghi mozart-requiem): hồ sơ bản ghi n6, n7, theo lượt 2 (lời tựa Cohrs), review D6-L9-gom.'
  - cu: Kèn trombone thời đó gắn với nhà thờ và cái chết. Tiếng trombone ở Tuba mirum tạo cảm giác gì?
    moi: Ở thời Baroque, trombone chủ yếu được dùng trong nhạc nhà thờ. Tiếng trombone ở Tuba mirum tạo cảm giác gì?
    ly_do: 'n29: COD "trombone"; "chủ yếu" theo câu đúng của lượt 2, review D6-L9-gom.'
  - cu: Biết rằng Lacrimosa chỉ có 8 ô nhịp của Mozart, bạn có nghe ra chỗ "đổi người viết" không? (Câu trả lời thật thà của phần lớn người nghe là không. Đó cũng là điều đáng suy nghĩ.)
    moi: Biết rằng Lacrimosa chỉ có 8 ô nhịp của Mozart, bạn có nghe ra chỗ "đổi người viết" không?
