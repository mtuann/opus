    link: https://id.loc.gov/authorities/names/n81018421.json
nhan_dinh:
  - id: n1
    cau: 'Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791).'
    loai: nam
    nguon: [loc-mozart]
    ket_qua: dung
    ghi_chu: 'Khớp src/data/nha-soan-nhac.yml (đã khóa).'
  - id: n2
    cau: 'Bảng: Tên đầy đủ Requiem cung Rê thứ, K. 626.'
    loai: danh-muc
    nguon: [kv-626, imslp-626]
    ket_qua: dung
  - id: n3
    cau: 'Bảng: Sáng tác năm 1791, dang dở khi Mozart mất ngày 5/12/1791.'
    loai: nam
    nguon: [kv-626, carus-626, nma-626-vorwort]
    ket_qua: dung
    ghi_chu: 'Köchel: "Vienna, 15.09 – 20.11.1791", "Uncompleted work"; Carus: Mozart mất 5/12/1791.'
  - id: n4
    cau: 'Bảng: Hoàn thành chủ yếu bởi học trò Franz Xaver Süssmayr.'
    loai: lich-su
    nguon: [carus-626, kv-626, carus-chart]
    ket_qua: dung
    ghi_chu: 'Carus: "Mozart’s pupil Franz Xaver Süßmayr, who completed the Requiem"; Köchel: KV 626 (1) "completed by Franz Xaver Süsmayr". "Chủ yếu" vì Eybler có thêm vào phần Sequenz (NMA tr. IX) và phối khí Kyrie do người không rõ (Carus).'
  - id: n5
    cau: 'Bảng: Thời kỳ Cổ điển.'
    loai: lich-su
    nguon: [imslp-626]
    ket_qua: dung
  - id: n6
    cau: 'Bảng: Thể loại lễ cầu hồn cho hợp xướng, 4 giọng độc xướng và dàn nhạc.'
    loai: lich-su
    nguon: [imslp-626, cod-requiem]
    ket_qua: dung
    ghi_chu: 'IMSLP: soli SATB, chorus SATB, orchestra; COD: Requiem là "Mass for the Dead". Thuật ngữ requiem = "Lễ cầu hồn" (thuat-ngu.yml).'
  - id: n7
    cau: 'Bảng: Độ dài khoảng 50–55 phút; phần trong bảng "Theo dõi khi nghe" (từ Introitus đến Lacrimosa) khoảng 30 phút.'
    loai: so-lieu
    nguon: [commons-krips, imslp-626]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 50–55 phút; đoạn gợi ý nghe trước khoảng 15 phút". Bản Krips trên Commons: cả bài 54 phút (IMSLP ghi trung bình 60 phút); Introitus đến Lacrimosa 1720 giây (khoảng 29 phút), không phải 15 phút. Viết lại theo số đo và nói rõ "đoạn gợi ý" là phần trong bảng.'
  - id: n8
    cau: 'Mùa hè năm 1791, Mozart nhận đơn đặt hàng giấu tên viết một bản Requiem. (Cũng là câu đầu của mô tả trang.)'
    loai: lich-su
    nguon: [nma-626-vorwort]
    ket_qua: dung
    ghi_chu: 'NMA: người đặt muốn "unerkannt zu bleiben"; việc đặt "aller Wahrscheinlichkeit nach zu Beginn des Sommers 1791" (rất có thể đầu mùa hè 1791).'
  - id: n9
    cau: 'Người đặt về sau được biết là bá tước Franz von Walsegg, muốn tưởng nhớ người vợ vừa mất (và có lẽ định nhận là tác phẩm của mình).'
    loai: lich-su
    nguon: [nma-626-vorwort]
    ket_qua: dung
    ghi_chu: 'NMA: Franz Graf von Walsegg-Stuppach; vợ Anna mất 14/2/1791, ông muốn đặt Mozart viết Requiem "zu ihrem Andenken"; ông có thói quen đặt nhạc rồi đưa ra như tác phẩm của mình. Giữ "có lẽ" vì NMA nói về thói quen chung.'
  - id: n10
    cau: 'Mozart viết Requiem xen với Cây sáo thần và vở opera La clemenza di Tito; ông nằm liệt giường từ ngày 20/11/1791 và mất khi bản nhạc còn dang dở.'
    loai: lich-su
    nguon: [nma-626-vorwort, carus-626]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mozart vừa hoàn thành Cây sáo thần, ốm nặng, và mất khi bản nhạc còn dang dở." NMA: Requiem viết trong ba giai đoạn, xen với Zauberflöte (xong 28/9) và Tito; nằm liệt giường từ 20/11. "Vừa hoàn thành Cây sáo thần" khiến người đọc hiểu Mozart viết Requiem sau Cây sáo thần; viết lại theo NMA.'
  - id: n11
    cau: 'Quanh sự ra đời của Requiem có nhiều giai thoại và truyền thuyết.'
    loai: lich-su
    nguon: [carus-626]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giai thoại \"Mozart viết Requiem cho chính mình\" và vai trò của Salieri trong phim Amadeus (1984) là hư cấu." Không tìm được nguồn bậc 1–2 đọc được cho hai vế cụ thể; Carus: "The history of the genesis of Mozarts’s Requiem is entwined with legends and anecdotes." Viết lại chung theo Carus.'
  - id: n12
    cau: 'Mozart hoàn thành trọn vẹn Introitus.'
    loai: lich-su
    nguon: [carus-chart, nma-626-vorwort]
    ket_qua: dung
    ghi_chu: 'Carus: "1. Requiem complete"; NMA: "Introitus und Kyrie sind von Mozart geschrieben" (bản Süßmayr), Introitus đủ bè ở tr. 3–9.'
  - id: n13
    cau: 'Mozart viết các bè hát, bè trầm và nhiều gợi ý dàn nhạc từ Kyrie đến Hostias.'
    loai: lich-su
    nguon: [carus-chart, nma-626]
    ket_qua: dung
    ghi_chu: 'Carus: Kyrie "main parts only, instrumental parts by person unknown"; Dies irae đến Hostias "main parts", người khác "orchestration". NMA: các trang Sequenz có bè hát, bè trầm và vài dòng nhạc cụ (như trombone ở Tuba mirum, violin ở Rex, Lacrimosa ô 1–2), các khuông còn trống có chú thích "Zur fehlenden … Instrumentation".'
  - id: n14
    cau: 'Mozart chỉ viết 8 ô nhịp đầu của Lacrimosa.'
    loai: cau-truc
    nguon: [nma-626, nma-626-vorwort, carus-chart]
    ket_qua: dung
    ghi_chu: 'NMA tr. 46: Lacrimosa 8 ô (12/8); lời tựa: "Die acht Takte des Lacrimosa sind Mozarts letzte Noten"; Carus "bars 1-8 only".'
  - id: n15
    cau: 'Mozart để lại nhiều nợ; vợ ông, Constanze, nhờ bạn bè của Mozart hoàn thành bản nhạc, và sau hai lần không thành, việc đến tay học trò Süssmayr.'
    loai: lich-su
    nguon: [carus-626]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Vợ ông, Constanze, nhờ các học trò hoàn thành, chủ yếu là Süssmayr, để nhận tiền đặt hàng." Carus: nợ, nhờ "Mozart’s friends", "After two failed attempts", "Mozart’s pupil Franz Xaver Süßmayr". Vế "để nhận tiền đặt hàng" không thấy ở nguồn đã đọc (Carus nói về nợ), bỏ; "các học trò" thành "bạn bè" theo Carus.'
  - id: n16
    cau: 'Ngày nay có nhiều phiên bản hoàn thành khác nhau; phiên bản Süssmayr là phiên bản truyền thống, được biết đến nhiều nhất.'
    loai: lich-su
    nguon: [carus-chart, kv-626, carus-626]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phiên bản Süssmayr vẫn phổ biến nhất". Carus so sánh sáu bản (Süßmayr, Beyer, Maunder, Levin, Ostrzyga, Arman); Köchel: bản Süßmayr "in the traditional form"; Carus: "Diese Version ist heute noch am bekanntesten". Viết theo chữ nguồn.'
  - id: n17
    cau: 'Requiem (lễ cầu hồn) là thánh lễ Công giáo cho người đã mất, hát bằng tiếng Latin.'
    loai: dinh-nghia
    nguon: [cod-requiem, imslp-626]
    ket_qua: dung
    ghi_chu: 'COD: "The RC Mass for the Dead (Lat. Missa pro defunctis)"; IMSLP "Language=Latin".'
  - id: n18
    cau: 'Đoạn Dies irae ("Ngày thịnh nộ") mô tả ngày phán xét cuối cùng.'
    loai: dinh-nghia
    nguon: [cod-requiem, nma-626]
    ket_qua: dung
    ghi_chu: 'COD: "Dies Irae (Day of Wrath)". Lời trong NMA: "coget omnes ante thronum" (Tuba mirum, tr. 24), "judicandus homo reus" (Lacrimosa, tr. 46): cảnh xét xử.'
  - id: n19
    cau: 'Theo dõi, Introitus: bassoon và basset horn (họ hàng trầm của clarinet) mở đầu u buồn; hợp xướng vào từng bè một.'
    loai: cau-truc
    nguon: [nma-626, cod-basset]
    ket_qua: dung
    ghi_chu: 'NMA tr. 3: Adagio, bassoon vào ô 1, basset horn ô 2, nối nhau; đàn dây đệm từ ô 1; ô 7–8 bè bass vào trước ("Requiem"), rồi tenor, alto, soprano. COD: basset horn là "Alto cl. in F" (thấp hơn clarinet thường).'
  - id: n20
    cau: 'Theo dõi, Kyrie: fugue kép, hai chủ đề cùng lúc, một chủ đề nhảy quãng 7 giảm.'
    loai: cau-truc
    nguon: [nma-626]
    ket_qua: dung
    ghi_chu: 'NMA tr. 10: ô 1 bè bass "Kyrie eleison" Rê–La–Si♭–(xuống) Đô♯: Si♭ xuống Đô♯ là quãng 7 giảm; cùng lúc ô 2 bè alto "Christe eleison" chạy móc kép: hai chủ đề vào cùng nhau. Link /opus/hinh-thuc/fugue/ ở n21.'
  - id: n21
    cau: 'Link "Fugue" (/opus/hinh-thuc/fugue/).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/hinh-thuc/fugue.md có (đã khóa, tiêu đề "Fugue").'
  - id: n22
    cau: 'Theo dõi, Dies irae: cả dàn nhạc và hợp xướng bùng nổ, nhanh, dữ dội.'
    loai: cau-truc
    nguon: [nma-626]
    ket_qua: dung
    ghi_chu: 'Mục lục NMA: "Dies irae. Allegro assai" (tr. 17–23).'
  - id: n23
    cau: 'Theo dõi, Recordare (dòng thêm): hai basset horn mở đầu nhẹ, nhịp 3/4, giọng Fa trưởng; bốn giọng độc xướng hát, không có hợp xướng.'
    loai: cau-truc
    nguon: [nma-626, imslp-626]
    ket_qua: da-sua
    ghi_chu: 'Dòng mới giữa Rex tremendae và Confutatis (bảng cũ bỏ qua Recordare; bảng không có mốc nên thêm dòng được). NMA tr. 31: "Corno di Bassetto I, II" vào ô 1–2 "p", nhịp 3/4, hóa biểu một giáng; khuông giọng hát chỉ có "Soprano solo, Alto solo, Tenore solo, Basso solo". IMSLP và COD liệt kê Recordare trong Sequentia.'
  - id: n24
    cau: 'Theo dõi, Tuba mirum: trombone độc tấu mở đầu ("tiếng kèn kỳ diệu" gọi người chết dậy), rồi lần lượt bốn giọng độc xướng.'
    loai: cau-truc
    nguon: [nma-626, cod-requiem]
    ket_qua: dung
    ghi_chu: 'NMA tr. 24: "Trombone [tenore] solo" ô 1–2, "Basso solo" vào ô 3, "Tenore solo" ô 18; COD dịch Tuba mirum "Hark, the trumpet". Lời "Tuba mirum spargens sonum per sepulchra regionum, coget omnes ante thronum" (tiếng kèn vang qua các nấm mồ, gọi mọi người đến trước ngai): "gọi người chết dậy" là diễn ý được.'
  - id: n25
    cau: 'Theo dõi, Rex tremendae: hợp xướng hô "Rex!" (Vua!) bằng những hợp âm lớn, tiết tấu chấm dôi uy nghi.'
    loai: cau-truc
    nguon: [nma-626]
    ket_qua: dung
    ghi_chu: 'NMA tr. 28: ô 3–5 bốn bè "Tutti" hô "Rex" thành hợp âm; violin và bè trầm móc kép chấm dôi từ ô 1; ô 6 "Rex tremendae majestatis" tiết tấu chấm dôi.'
  - id: n26
    cau: 'Theo dõi, Confutatis: tương phản: bè nam hát dữ dội về kẻ bị đày, bè nữ hát dịu dàng xin được cứu.'
    loai: cau-truc
    nguon: [nma-626]
    ket_qua: dung
    ghi_chu: 'NMA tr. 41–42: tenor, bass "Confutatis maledictis, flammis acribus addictis"; soprano, alto "Tutti sotto voce": "Voca me cum benedictis".'
  - id: n27
    cau: 'Theo dõi, Lacrimosa: giai điệu "khóc than" đi lên từng bước; sau 8 ô nhịp, phần còn lại không phải của Mozart.'
    loai: cau-truc
    nguon: [nma-626, carus-chart]
    ket_qua: dung
    ghi_chu: 'NMA tr. 46: bè soprano ô 5–8 ("qua resurget ex favilla judicandus homo reus") đi lên từng bậc, có nửa cung, crescendo; Lacrimosa = "Lamentation" (COD). Carus: Süßmayr viết tiếp ô 9–30.'
  - id: n28
    cau: 'Câu dẫn bảng: bảng đi qua các đoạn đầu của Requiem, từ Introitus đến Lacrimosa.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bảng có tám dòng từ Introitus đến Lacrimosa (kể cả Recordare). Câu do người giao thêm.'
  - id: n29
    cau: 'Câu hỏi 1: ở thời Baroque, trombone chỉ được dùng trong nhạc nhà thờ.'
    loai: lich-su
    nguon: [cod-trombone]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kèn trombone thời đó gắn với nhà thờ và cái chết." COD chỉ nói "In baroque times they were confined to church mus."; vế "cái chết" không có nguồn, bỏ; ghi rõ thời Baroque. Phần câu hỏi là lời mời nghe.'
  - id: n30
    cau: 'Câu hỏi nghe chủ động (cảm giác của tiếng trombone; đối lập bè nam, bè nữ ở Confutatis; có nghe ra chỗ đổi người viết ở Lacrimosa không).'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n31
    cau: 'Câu hỏi 3 bỏ vế "(Câu trả lời thật thà của phần lớn người nghe là không. Đó cũng là điều đáng suy nghĩ.)".'
    loai: so-lieu
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Câu nói về "phần lớn người nghe" không có số liệu hay nguồn; bỏ.'
