    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/lesacreduprintem00stra_0", "https://www.clevelandorchestra.com/events/the-rite-of-spring" ]
    luot_2_ghi_chu: "Tổng phổ tr. 11 (số 13, Augures): violin 2, viola, cello, bass lặp hợp âm nốt móc đơn; 'Cor. 1.2.3.4 / 5.6.7.8' đánh 'sf sempre' ở các phách lệch, trùng dấu nhấn của dây. Laki: nhấn liên tục đổi chỗ, không đoán được."
