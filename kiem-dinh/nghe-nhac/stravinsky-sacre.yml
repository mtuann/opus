ghi_chu: 'Hướng dẫn nghe Le Sacre du printemps, mở đầu và Les Augures printaniers (tầng Tác phẩm; bản ghi tac-pham/stravinsky-sacre; loai: nghe là cấu trúc). Hết bảo hộ ở Việt Nam (Stravinsky mất 1971) và Mỹ (in 1913, 1921). Bản nhạc: tổng phổ nhỏ Édition Russe de Musique, Copyright 1921 (R.M.V. 197), Đại học Toronto, quét trên Internet Archive (lesacreduprintem00stra_0), đọc ảnh 06/11/2026. Không có khối abc. ::hinh-cau-truc dựng từ hinh.nghe của bản ghi: chữ trong hình kiểm ở hồ sơ bản ghi (du-lieu/tac-pham/stravinsky-sacre lần 2). ::khoi-nghe không có bản thu. Không tính là nhận định: tiêu đề mục, tiêu đề cột. Câu ở hồ sơ khác trỏ tới trang này: nhac-ly/32-ky-thuat-the-ky-20 n25 (giữ: trang có Les Augures printaniers, đàn dây dậm một hợp âm nghịch tai lặp đi lặp lại; n23 nói hợp âm ghép ở đoạn này: khớp n14), lich-su/thoi-ky/the-ky-20 n30, nhan-dien/dau-van-tay n52: trang giữ đúng. Bài 15 (đã khóa) đã bỏ câu "Stravinsky … đổi nhịp gần như mỗi ô" (n22 hồ sơ ấy, Woodruff); trang này viết hẹp hơn: chỉ một số đoạn, như Vũ điệu hiến tế, mà tổng phổ cho thấy số chỉ nhịp đổi gần như mỗi ô (n9). Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: ballet, trọng âm bất thường (có accent "nhấn"), hợp âm ghép (polychord), kèn gỗ, horn, bassoon. Có bản ghi: dissonance (nghịch tai).'
nguon:
  - id: erm-1921
    bac: 1
    ten: 'Stravinsky, Le Sacre du printemps, tổng phổ nhỏ, Édition Russe de Musique (Russischer Musikverlag), Berlin, Copyright 1921, R.M.V. 197, bản của Đại học Toronto quét trên Internet Archive (lesacreduprintem00stra_0), đọc ảnh 06/11/2026. Trang tên: "Tableaux de la Russie païenne en deux parties de Igor Strawinsky et Nicolas Roerich". Tr. 3: "Première partie. L''Adoration de la Terre. Introduction", "Lento ♩=50 tempo rubato", "Fagotto 1 Solo ad lib." (khóa tenor, âm vực cao). Tr. 10: cả bộ gỗ chơi dày đặc. Tr. 11: bassoon 1 trở lại với giai điệu mở đầu rồi ngừng, violin pizz.; "Les Augures printaniers. Danses des adolescentes", "Tempo giusto ♩=50": violin 2, viola, cello, contrabass "arco (non div.)", "sempre stacc." lặp một hợp âm, có dấu nhấn; "Cor. 1.2.3.4 / 5.6.7.8" sf sempre ở những chỗ lệch phách. Tr. 24–27 dàn nhạc ngày càng đông. Tr. 72: "Seconde partie. Le Sacrifice. Introduction". Tr. 112: "Danse sacrale (L''élue)": số chỉ nhịp đổi gần như mỗi ô'
    link: https://archive.org/details/lesacreduprintem00stra_0
  - id: imslp-sacre
    bac: 2
    ten: 'IMSLP, The Rite of Spring, K015 (wikitext qua api.php, 06/11/2026): hai phần, I "L''adoration de la terre" (Introduction, Les Augures printaniers, …, Danse de la terre), II "Le sacrifice" (Introduction, …, Danse sacrale (L''élue)); "First Performance=1913/05/29 in Paris, Théâtre des Champs-Élysées: Ballets Russes; Pierre Monteux (conductor)"; "Year/Date of Composition=1910-13"; "Year of First Publication=1913, 1921 - Berlin: Editions Russes de Musique"; "Average Duration=33 minutes"; "Piece Style=Early 20th century"; "8 horns (7th, 8th also Wagner tuba)"'
    link: https://imslp.org/wiki/The_Rite_of_Spring_(Stravinsky,_Igor)
  - id: laki-cleveland
    bac: 2
    ten: 'Cleveland Orchestra, ghi chú chương trình The Rite of Spring (theo Peter Laki): mở đầu "begins with a bassoon solo … written in the instrument’s highest register", lấy từ một bài dân ca Litva; Augurs: ostinato tiết tấu "in which the emphasis constantly shifts", "a highly irregular and unpredictable rhythm", kèn gỗ đưa vào "mostly symmetrical, folksong-like melodies"; buổi đầu "nearly drowned out by shouted insults, catcalls … general pandemonium", "It is hard to know how much of this was due to the music or to Nijinsky’s jagged choreography"; "dancer-choreographer Vaslav Nijinsky"; "changed the course of 20th-century music like no other work"; biên chế "8 horns (7th and 8th doubling tenor tubas)"; "Duration: 30 Minutes"'
    link: https://www.clevelandorchestra.com/works/the-rite-of-spring
  - id: huscher
    bac: 2
    ten: 'Phillip Huscher, ghi chú chương trình (Yellow Barn): "May 29, 1913, the night The Rite of Spring opened at the Théâtre des Champs-Élysées"; "a solemn pagan rite: sage elders, seated in a circle, watched a young girl dance herself to death. They were sacrificing her to propitiate the god of spring"; "it was the dancing that provoked the audience"; Boulez: tác phẩm là mốc cho "the birth certificate" của âm nhạc đương đại'
    link: https://yellowbarn.org/node/2305
  - id: hutchinson
    bac: 2
    ten: 'Robert Hutchinson, Music Theory for the 21st-Century Classroom, 32.4 Polychords (LibreTexts): "Perhaps the most famous polychord is the “Rite of Spring chord,” an E♭7 chord sounding over an F♭ major chord, which occurs during the “Dance of the Adolescents.”"'
    link: https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_%28Hutchinson%29/32%3A_Impressionism_and_Extended_Tonality/32.04%3A_Polychords
  - id: mb-boulez
    bac: 2
    ten: 'MusicBrainz, Le Sacre du Printemps, The Cleveland Orchestra, Pierre Boulez, CBS 72807 (1969): Introduction 3:34, Danses des adolescentes (Augurs) 3:19. Cùng dàn nhạc và nhạc trưởng còn một bản Deutsche Grammophon 435 769-2 (1992)'
    link: https://musicbrainz.org/release/824aa08e-fce8-47a6-b726-9151f66c9e68
  - id: ia-hodson
    bac: 2
    ten: 'Internet Archive, bản ghi sách: Millicent Hodson, "Nijinsky''s crime against grace: reconstruction score of the original choreography for Le sacre du printemps" (1996)'
