nhan_dinh:
  - id: n1
    cau: 'Golliwogg''s Cake walk là bài số 6, bài cuối, của Children''s Corner (Coin des enfants), tổ khúc nhỏ cho piano, số danh mục L. 113; tổ khúc gồm sáu bài.'
    loai: danh-muc
    nguon: [ durand-1908, imslp-cc ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 2 PROGRAMME: I–VI, VI GOLLIWOGG''S CAKE-WALK; tr. 24 "VI. Golliwogg''s cake walk"; bìa "CHILDREN''S CORNER (COIN DES ENFANTS) Petite Suite pour Piano seul". IMSLP: "CD 119 ; L.113", 6 movements.'
  - id: n2
    cau: 'Debussy (1862–1918) viết cả tổ khúc từ năm 1906 đến 1908; nhà Durand ở Paris in cuối tháng 9/1908.'
    loai: nam
    nguon: [ henle-382-vorwort, imslp-cc, durand-1908, site-du-lieu ]
    ket_qua: dung
    ghi_chu: 'Henle lời tựa: "written between 1906 and 1908", "appeared in late September 1908, published by Durand". IMSLP: 1906-1908, 1908 Paris Durand & Fils. Bản quét tr. 24: "Copyright by A. Durand & Fils 1908". Năm sinh–mất: dữ liệu đã khóa.'
  - id: n3
    cau: 'Biểu diễn lần đầu: nghệ sĩ piano người Anh Harold Bauer, ngày 18/12/1908 ở Paris.'
    loai: lich-su
    nguon: [ henle-382-vorwort, imslp-cc ]
    ket_qua: dung
    ghi_chu: 'Henle: "18 December 1908 by the English pianist Harold Bauer at the Cercle musical in Paris". IMSLP: 1908/12/18 Paris, Cercle musical, Harold Bauer.'
  - id: n4
    cau: 'Thời kỳ: đầu thế kỷ 20, chủ nghĩa ấn tượng; thể loại: tiểu phẩm cho piano theo phong cách ragtime.'
    loai: lich-su
    nguon: [ henle-hn382, imslp-cc ]
    ket_qua: dung
    ghi_chu: 'Năm 1908 (đầu thế kỷ 20). Henle: "is in ragtime style". Nhãn Ấn tượng theo tiền lệ bản ghi debussy-preludes (thoi_ky: Ấn tượng, 1909–1910) và trang lich-su/thoi-ky/the-ky-20 của site (Ấn tượng: Debussy, Ravel); IMSLP ghi Piece Style Romantic: nhãn thời kỳ là cách xếp của site.'
  - id: n5
    cau: 'Bài dài khoảng hai phút rưỡi đến ba phút.'
    loai: so-lieu
    nguon: [ ptna-630, commons-elduende ]
    ket_qua: dung
    ghi_chu: 'PTNA: Total Performance Time 2 min 30 sec. Bản thu Commons 160,5 s (2 phút 40 giây).'
  - id: n6
    cau: 'Children''s Corner gồm sáu bài, Debussy đề tặng con gái Claude-Emma, gọi thân mật là Chouchou, khi cô bé mới khoảng ba tuổi.'
    loai: lich-su
    nguon: [ henle-382-vorwort, henle-hn382, imslp-cc, durand-1908 ]
    ket_qua: dung
    ghi_chu: 'Henle: "dedicated to the composer''s then three-year old daughter"; lời tựa: "Chouchou, then barely three years old". IMSLP: Dedication Chou-chou (Debussy''s daughter), Claude-Emma Debussy (1905-1919). Bản quét tr. 2: "A ma chère petite Chouchou".'
  - id: n7
    cau: 'Lời đề tặng in đầu bản nhạc: "Gửi bé Chouchou yêu quý của bố, cùng lời xin lỗi dịu dàng của bố vì những gì sắp tới."'
    loai: lich-su
    nguon: [ durand-1908, henle-hn382 ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 2: "A ma chère petite Chouchou, avec les tendres excuses de son Père pour ce qui va suivre. C. D." Henle dịch: "To my beloved little Chouchou with the tender excuses of her father for what follows below". Bản dịch tiếng Việt sát chữ.'
  - id: n8
    cau: 'Năm trong sáu bài mang tên tiếng Anh, một phần vì Debussy mê nước Anh, một phần vì Chouchou có cô bảo mẫu người Anh.'
    loai: lich-su
    nguon: [ henle-382-vorwort, durand-1908 ]
    ket_qua: dung
    ghi_chu: 'Lời tựa: "Five of the six pieces have English titles, testifying not only to Debussy''s anglophile tendencies but also to the fact that Chouchou was the charge of an English governess, Miss Gibbs." Bản quét tr. 2: năm bài có tên tiếng Anh, Doctor Gradus ad Parnassum là tên Latin.'
  - id: n9
    cau: 'Bài đầu, Doctor Gradus ad Parnassum, gợi tới tập bài luyện ngón Gradus ad Parnassum của Clementi.'
    loai: lich-su
    nguon: [ henle-hn382, henle-382-vorwort ]
    ket_qua: dung
    ghi_chu: 'Henle: "alludes to a study by Muzio Clementi"; lời tựa: "the allusion to Clementi", Debussy gọi là "a salutary and progressive form of physical exercise".'
  - id: n10
    cau: 'Cakewalk là điệu nhảy ra đời khi những người nô lệ ở Mỹ nhại lại dáng điệu và lối khiêu vũ của người da trắng; cặp nhảy đẹp nhất được thưởng một chiếc bánh; dáng đi ưỡn ngực, hai người khoác tay nhau, đá chân cao; thành mốt trên sân khấu Mỹ những năm 1890.'
    loai: lich-su
    nguon: [ cod-cakewalk ]
    ket_qua: dung
    ghi_chu: 'COD: "Originated when Amer. slaves parodied the whites'' manners and method of dancing—a prize (cake) was awarded to best dancers. It featured a strutting movt., with the couple arm-in-arm and performing high kicks"; "popularized in 1890s by Amer. vaudeville team of Bert Williams and George Walker".'
  - id: n11
    cau: 'Ragtime là loại nhạc viết sẵn chủ yếu cho piano, phổ biến khoảng 1895–1920, với Scott Joplin là tên tuổi lớn nhất.'
    loai: dinh-nghia
    nguon: [ cod-ragtime ]
    ket_qua: dung
    ghi_chu: 'COD: "particularly for solo pf., and comp. rather than improvised. Famous exponent and composer of it was Scott Joplin. Popular from c. 1895–1920".'
  - id: n12
    cau: 'Ở bài này tay trái giữ nhịp đều, nốt trầm ở phách mạnh xen với hợp âm, còn giai điệu tay phải liên tục đảo phách (trọng âm lệch khỏi phách).'
    loai: cau-truc
    nguon: [ durand-1908, laits-tristan, site-du-lieu ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 24 hệ 2–5: tay trái móc đơn, nốt trầm ở phách, hợp âm ở nửa sau phách, đều suốt ô 5–25. Tay phải ô 10: móc kép – móc đơn – móc kép (nốt dài ở giữa phách). LAITS: "left hand accompaniment with a syncopated right hand melody". Định nghĩa đảo phách theo thuat-ngu.yml (syncopation).'
  - id: n13
    cau: 'Henle mô tả bài viết theo phong cách ragtime, cho thấy Debussy đón nhận các trào lưu nhạc đại chúng một cách thoải mái.'
    loai: lich-su
    nguon: [ henle-hn382 ]
    ket_qua: dung
    ghi_chu: 'Henle: "is in ragtime style and shows Debussy''s easy-going approach to popular trends in music".'
  - id: n14
    cau: 'Golliwogg là nhân vật búp bê trong loạt sách tranh thiếu nhi của Florence Kate Upton, cuốn đầu in ở London năm 1895, rất được ưa chuộng ở Anh; nhân vật được vẽ theo một con búp bê nhại những người diễn hát rong bôi mặt đen (minstrel) của Mỹ.'
    loai: lich-su
    nguon: [ jimcrow ]
    ket_qua: dung
    ghi_chu: 'Jim Crow Museum: "story book character created by Florence Kate Upton"; "In 1895, her book, entitled The Adventures of Two Dutch Dolls, was published in London"; "a caricature of American black faced minstrels"; "based on a Black minstrel doll that Upton had played with as a small child in New York"; "immensely popular in England".'
  - id: n15
    cau: 'Ngày nay hình ảnh Golliwogg được xem là một biếm họa phân biệt chủng tộc với người da đen.'
    loai: lich-su
    nguon: [ jimcrow ]
    ket_qua: dung
    ghi_chu: 'Jim Crow Museum: "the least known of the major anti-black caricatures"; các nghị sĩ Anh phê phán hình Golliwog là "racist". Trang viết trung tính, không minh họa.'
  - id: n16
    cau: 'Ở đoạn giữa, nhạc chậm lại (Cédez) và Debussy ghi avec une grande émotion ("với một xúc động lớn"), rồi chen vào câu mở đầu Tristan und Isolde của Wagner, đúng cao độ Wagner viết: La, Fa, Mi rồi Rê♯ (Debussy ghi là Mi♭).'
    loai: cau-truc
    nguon: [ durand-1908, laits-tristan, ptna-630, cod-cedez, larousse ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 26 hệ 2 ô 61–62: "Cédez", "p avec une grande émotion"; giai điệu La♮3 – Fa4 – Mi♮4; ô 63 (tr. 26 hệ 3) bè dưới Mi♭4 có dấu giáng, nối từ Mi♮ (xem khuong_nhac khối 2). LAITS: "the opening phrase of Tristan and Isolde ... only the Longing motive"; "the final D-sharp (written here as an E-flat)"; "original pitches of the motive without transposition". PTNA: "fragments of Wagner''s Tristan und Isolde melody appear" ở đoạn giữa. COD cédez: "Give way, i.e. diminish the speed".'
  - id: n17
    cau: 'Câu nhạc ấy trở lại nhiều lần, lần nào cũng bị những hợp âm nhảy nhót cắt ngang; đặt nó vào điệu nhảy của búp bê là một lời đùa.'
    loai: cau-truc
