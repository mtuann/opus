ghi_chu: 'Hướng dẫn nghe mới (lộ trình thêm tác phẩm, mục 7, hướng dẫn nghe số 1). Nốt nhạc, số ô, chỉ dẫn và sắc thái đọc trên bản quét Durand & Fils, IMSLP #252526 (file IMSLP252526-PMLP02387-Debussy,_Claude-Childrens_Corner_Durand_7188_filter.pdf, 30 trang PDF; Golliwogg ở trang PDF 26–30, số trang in 24–28). Bản quét là một lần in từ bản khắc 1908: tr. 24 ghi "Copyright by A. Durand & Fils 1908", tr. 28 ghi "D. & F. 7188 (VI)", "Février 1952 Imp. Mounot. Paris" (lần in tháng 2/1952, cùng bản khắc và số bản in; IMSLP ghi Durand & Fils 1908, D. & F. 7188). Đọc toàn bài ở 110–150 dpi; ô trích ở 400–600 dpi, đo dòng kẻ bằng tổng điểm đen theo hàng rồi suy cao độ. Số ô đếm trên bản quét: tr. 24 4+5+5+5+6 = 25; tr. 25 5+5+5+6+6 = 27 (ô 26–52); tr. 26 5+5+5+5+5 = 25 (ô 53–77); tr. 27 5+5+4+5+5 = 24 (ô 78–101); tr. 28 6+5+5+6+5 = 27 (ô 102–128); tổng 128, khớp IMSLP (128 bars) và cách đánh số của Henle (Bemerkungen: M 28/108, 36/116 là hai chỗ song song, lệch 80 ô như cách đếm này). Mốc: không có bản MIDI mở (Mutopia không có bài này) nên đo tay trên bản mp3 chuyển mã của Commons (160,5 s) bằng librosa: độ to theo từng giây và khởi âm (onset_detect); chi tiết ở n27. Chữ do ::hinh-cau-truc dựng (sơ đồ) thuộc hồ sơ du-lieu/tac-pham/debussy-golliwogg.'
