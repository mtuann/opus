  - id: cod-cakewalk
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục cakewalk: "Dance popularized in 1890s by Amer. vaudeville team of Bert Williams and George Walker and by black dancer Charles Johnson. Originated when Amer. slaves parodied the whites'' manners and method of dancing—a prize (cake) was awarded to best dancers. It featured a strutting movt., with the couple arm-in-arm and performing high kicks. Debussy wrote ''Golliwogg''s Cakewalk'' in his Children''s Corner (1906–8)."'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cakewalk
  - id: cod-ragtime
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục ragtime: "Early type of jazz, particularly for solo pf., and comp. rather than improvised. Famous exponent and composer of it was Scott Joplin. Popular from c. 1895–1920"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/ragtime
  - id: cod-cedez
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục cédez: "(Fr.). Give way, i.e. diminish the speed"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cedez
  - id: cod-retenu
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục retenant; retenu: "(Fr.). Holding back; held back (immediately, like ritenuto, not gradually, like rallentando)"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/retenant
  - id: cod-giusto
