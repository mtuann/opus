    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/giusto
  - id: larousse
    bac: 2
    ten: 'Larousse, dictionnaire français-anglais: "net, nette": clean, neat, clear; "sec": dry; "moins": less; "toujours": always, still; "émotion": emotion'
    link: https://www.larousse.fr/dictionnaires/francais-anglais/nette
  - id: jimcrow
    bac: 2
    ten: 'Jim Crow Museum (Ferris State University), The Golliwog Caricature: "The Golliwog (originally spelled Golliwogg) is the least known of the major anti-black caricatures"; "The Golliwog began life as a story book character created by Florence Kate Upton"; "In 1895, her book, entitled The Adventures of Two Dutch Dolls, was published in London"; "He was a caricature of American black faced minstrels"; "The Golliwogg was based on a Black minstrel doll that Upton had played with as a small child in New York"; "immensely popular in England, and Golliwogg became a national star"'
    link: https://jimcrowmuseum.ferris.edu/golliwog/homepage.htm
  - id: ptna-630
    bac: 2
    ten: 'PTNA Piano Encyclopedia, Children''s corner (Hayashikawa Takashi, cập nhật 18/4/2019): "Golliwog''s Cakewalk depicts the cheerful dancing of Golliwog, a mechanical doll, to the cakewalk, an American Black dance ... the middle section shifts to a languid mood, and it is particularly interesting how fragments of Wagner''s Tristan und Isolde melody appear"; "Total Performance Time: 2 min 30 sec" cho Golliwog''s cakewalk'
    link: https://enc.piano.or.jp/en/musics/630
  - id: laits-tristan
    bac: 2
    ten: 'University of Texas at Austin (LAITS), trang Tristan and Isolde, mục Debussy và Berg (Matthew Heisterman, John Weinstock, 2007): "a big change occurs sixty-one measures into the piece"; "Debussy has inserted the opening phrase of Tristan and Isolde! He uses only the Longing motive, and excludes ... the Tristan chord at the end"; "the final D-sharp (written here as an E-flat)"; "both composers do use the original pitches of the motive without transposition"; "Debussy trivializes Wagner''s dramatic theme"; "Debussy uses the Wagner quote as a joke"; "After each of the four statements of Longing, the music returns to the blithe, staccato eighth notes"; "left hand accompaniment with a syncopated right hand melody"'
    link: https://laits.utexas.edu/tristan/DebBerg.php
