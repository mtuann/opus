  - id: n16
    cau: 'Ở đoạn giữa, nhạc chậm lại (Cédez) và Debussy ghi avec une grande émotion ("với một xúc động lớn"), rồi chen vào câu mở đầu Tristan und Isolde của Wagner, đúng cao độ Wagner viết: La, Fa, Mi rồi Rê♯ (Debussy ghi là Mi♭).'
    loai: cau-truc
    nguon: [ durand-1908, laits-tristan, ptna-630, cod-cedez, larousse ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 26 hệ 2 ô 61–62: "Cédez", "p avec une grande émotion"; giai điệu La♮3 – Fa4 – Mi♮4; ô 63 (tr. 26 hệ 3) bè dưới Mi♭4 có dấu giáng, nối từ Mi♮ (xem khuong_nhac khối 2). LAITS: "the opening phrase of Tristan and Isolde ... only the Longing motive"; "the final D-sharp (written here as an E-flat)"; "original pitches of the motive without transposition". PTNA: "fragments of Wagner''s Tristan und Isolde melody appear" ở đoạn giữa. COD cédez: "Give way, i.e. diminish the speed". Review (Claude, 17/11/2026): LAITS tải lại: "sixty-one measures into the piece", "the final D-sharp (written here as an E-flat)"; bản quét tr. 26 hệ 2–3 đọc lại ở 450 dpi: Cédez, p avec une grande émotion, La♮3 (dòng kẻ phụ thứ hai, tenuto), Fa4 chấm dôi, Mi♮4, ô 63 Mi♭4 trắng; khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://laits.utexas.edu/tristan/DebBerg.php", "https://mtosmt.org/issues/mto.95.1.3/mto.95.1.3.rothstein.php" ]
    luot_2_ghi_chu: "Bản quét Durand ô 61: 'Cédez', 'p avec une grande émotion'; giai điệu La3 (bình) – Fa4 – Mi4 (bình) – Mi♭4 (ô 63). UT Austin: Debussy chèn câu mở đầu Tristan (motif Longing), nốt Rê♯ cuối 'written here as an E-flat', và 'use the original pitches of the motive without transposition'. Rothstein (Music Theory Online 1.3): bè cello mở đầu là quãng sáu đi lên La3–Fa4, khớp đúng quãng tám Debussy dùng. Không có bản in Tristan trên máy; IMSLP liệt kê bản tổng phổ Breitkopf & Härtel 1860 (số bản in 10000), không tải."
    review: dung
  - id: n17
