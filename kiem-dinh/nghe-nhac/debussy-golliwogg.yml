    ghi_chu: 'Tr. 28 hệ 5: ô 125 hợp âm p như ô 45; ô 126 lặng đen, Đô♭ rồi móc ba đi xuống, f <; ô 127, 128 hợp âm móc đơn có dấu ^ và chấm staccato, ff, rồi lặng. Ô 46 (tr. 25): più p, tay trái Mi♭–Fa. Review (Claude, 17/11/2026): bản quét tr. 28 hệ 5 đọc lại ở 400–500 dpi: ô 127 và 128 mỗi ô một móc đơn có dấu ^ và chấm, rồi lặng móc đơn, lặng đen; tay phải một nốt Mi♭3 (khóa Fa, khe thứ ba), tay trái quãng tám Mi♭1–Mi♭2 (dưới khuông, dòng kẻ phụ), ff: ba nốt Mi♭ cách nhau quãng tám, không phải hai hợp âm (lượt 2 đúng). Vế "chỉ ba ô cuối khác hẳn phần đầu" bỏ: tr. 28 hệ 2 ô 110–111 khác hòa âm ô 30–31 (tr. 25 hệ 1–2), ô 113 ghi sff thay ff. Bảng trên trang không có vế ấy (chỉ hồ sơ và ghi_chu sơ đồ trong dữ liệu, đã sửa). Dòng 14 sửa: "…một chuỗi nốt chạy xuống f rồi hai tiếng Mi♭ ff thật ngắn, hai tay cùng đánh Mi♭ chồng quãng tám".'
