  - id: n14
    cau: 'Golliwogg là nhân vật búp bê trong loạt sách tranh thiếu nhi của Florence Kate Upton, cuốn đầu in ở London năm 1895, rất được ưa chuộng ở Anh; nhân vật nhại những người diễn hát rong bôi mặt đen (minstrel) của Mỹ.'
    loai: lich-su
    nguon: [ jimcrow ]
    ket_qua: dung
    ghi_chu: 'Jim Crow Museum: "story book character created by Florence Kate Upton"; "In 1895, her book, entitled The Adventures of Two Dutch Dolls, was published in London"; "a caricature of American black faced minstrels"; "based on a Black minstrel doll that Upton had played with as a small child in New York"; "immensely popular in England". Review (Claude, 17/11/2026): Jim Crow Museum tải lại: "He was a caricature of American black faced minstrels", "The Golliwogg was based on a Black minstrel doll that Upton had played with as a small child". Câu cũ "nhân vật được vẽ theo một con búp bê nhại những người diễn trò hát rong bôi mặt đen" gán việc nhại cho con búp bê; sửa chữ cho sát nguồn ("a caricature of"): "Nhân vật nhại những người diễn trò hát rong bôi mặt đen (minstrel) của Mỹ." (không viết "biếm họa" để khỏi lặp câu sau). Đoạn về Golliwogg (ba câu) trung tính, có nguồn, không minh họa, nói rõ chỉ nhắc tên vì là tên bài: giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://jimcrowmuseum.ferris.edu/golliwog/homepage.htm", "https://ebsco.com/research-starters/history/florence-k-upton" ]
    luot_2_ghi_chu: "Jim Crow Museum: sách của Florence Upton (tranh) và mẹ Bertha (lời), in ở London năm 1895, 'immensely popular in England'; nhân vật 'a caricature of American black faced minstrels', vẽ theo một 'Black minstrel doll' thời nhỏ của Upton. EBSCO cũng ghi năm 1895 và loạt sách. (Lời thơ là của Bertha Upton; câu nói 'sách tranh của Florence Kate Upton' vẫn chấp nhận được vì Florence vẽ và tạo nhân vật.)"
