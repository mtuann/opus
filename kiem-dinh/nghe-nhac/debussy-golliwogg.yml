    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Ô 10–13, 2/4, K:Eb, L:1/16, chỉ bè trên của tay phải (đuôi lên). Ấn bản: durand-1908 tr. 24 hệ 3 ô 1–4, đọc ở 400–600 dpi, đo dòng kẻ bằng máy (600 dpi, ô 10: dòng Fa5 107, Rê5 142, Si4 178, Sol4 214, Mi4 248 px). Ô 10: Si♭4 (móc kép, dấu >), La♭4 (móc đơn, tâm 196 px), Si♭4 (móc kép), Fa4 (móc đơn staccato, tâm 231 px), Si♭4 (móc đơn staccato). Ô 11: La♭4 (móc kép, >), Fa4 (móc đơn), Mi♭4 (móc kép), Đô4 (móc đơn staccato, có dòng kẻ phụ), Mi♭4 (móc đơn staccato). Ô 12 (600 dpi: dòng 104, 139, 174, 211, 247): Si♭3 (móc kép, >, tâm khoảng 308), Si♭3 (móc đơn staccato), Đô♮4 (móc kép, tâm 284), Si♭3 (móc đơn), hợp âm rải Mi♭4 (tâm 250) + Si♭4 (tâm 176) móc đơn staccato, sff. Ô 13: Si♭3 trắng, dấu nhấn (v). Bỏ: bè dưới của tay phải (hợp âm lệch phách) và cả tay trái; luyến; sff ở ô 12 và dấu v ở ô 13 (dấu > ở đầu ô 10–12 ghi bằng !accent!). Q:1/4=110 là tốc độ phát của khối, theo bản thu (móc đơn khoảng 0,27 s); bản in không ghi số máy đếm nhịp. Review (Claude, 17/11/2026): so lại từng nốt với tr. 24 hệ 3 ở 400 và 600 dpi (dòng kẻ đo bằng máy ở 600 dpi: Fa5 228, Rê5 264, Si4 299, Sol4 335, Mi4 370 px; đầu nốt tìm bằng phép mở hình thái): ô 10 Si♭4 (>) La♭4 Si♭4 Fa4 (chấm) Si♭4 (chấm); ô 11 La♭4 (>) Fa4 Mi♭4 Đô4 (dòng kẻ phụ, chấm) Mi♭4 (chấm); ô 12 Si♭3 (>) Si♭3 (chấm) Đô♮4 Si♭3 [Mi♭4 Si♭4] rải (chấm); ô 13 Si♭3 trắng; móc kép – móc đơn – móc kép theo đuôi cụt của dải nối; mf ở ô 10. Khớp, không sửa.'
  - khoi: 2
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Ô 61–63, 2/4, K:Gb (sáu dấu giáng như bản in từ ô 47), L:1/8, chỉ giai điệu. Ấn bản: durand-1908 tr. 26 hệ 2 ô 4–5 và hệ 3 ô 1, đọc ở 400–500 dpi (khuông trên đổi sang khóa Sol ở cuối ô 60). Ô 61: lặng đen, La♮3 đen (hai dòng kẻ phụ, dấu bình, gạch tenuto), p, "Cédez", "avec une grande émotion". Ô 62: Fa4 đen chấm dôi, Mi♮4 móc đơn (dấu bình); bè dưới giữ La♮3 (dấu nối từ ô 61) rồi một nốt móc đơn dưới Mi. Ô 63 ("a Tempo"): bè dưới hai nốt trắng Mi♭4 (có dấu giáng; ở 400 dpi tâm đầu nốt trùng dòng Mi4) và Đô♭4 (dòng kẻ phụ), luyến từ Mi♮ của ô 62; bè trên hợp âm móc đơn pp. Khối ghi giai điệu La – Fa – Mi – Mi♭: Mi♭4 trắng ở ô 63 (_E4, dấu giáng viết rõ như bản in). Bỏ: dấu nối La sang ô 62 (giai điệu chỉ ghi La đen), tay trái, bè dưới và hợp âm a Tempo ở ô 63, luyến. Q:1/4=60 là tốc độ phát gợi ý cho chỗ Cédez. Review (Claude, 17/11/2026): so lại tr. 26 hệ 2 ô 61–62 và hệ 3 ô 63 ở 450 dpi: lặng đen, La♮3 trên dòng kẻ phụ thứ hai (tenuto), Fa4 đen chấm dôi ở khe dưới cùng, Mi♮4 móc đơn trên dòng dưới cùng (dấu bình); ô 63 Mi♭4 trắng có dấu giáng trên dòng dưới cùng (cùng Đô♭4 ở dưới), a Tempo; p, Cédez. Khớp, không sửa.'
