ghi_chu: 'Hướng dẫn nghe mới (lộ trình thêm tác phẩm, mục 7, hướng dẫn nghe số 1). Nốt nhạc, số ô, chỉ dẫn và sắc thái đọc trên bản quét Durand & Fils, IMSLP #252526 (file IMSLP252526-PMLP02387-Debussy,_Claude-Childrens_Corner_Durand_7188_filter.pdf, 30 trang PDF; Golliwogg ở trang PDF 26–30, số trang in 24–28). Bản quét là một lần in từ bản khắc 1908: tr. 24 ghi "Copyright by A. Durand & Fils 1908", tr. 28 ghi "D. & F. 7188 (VI)", "Février 1952 Imp. Mounot. Paris" (lần in tháng 2/1952, cùng bản khắc và số bản in; IMSLP ghi Durand & Fils 1908, D. & F. 7188). Đọc toàn bài ở 110–150 dpi; ô trích ở 400–600 dpi, đo dòng kẻ bằng tổng điểm đen theo hàng rồi suy cao độ. Số ô đếm trên bản quét: tr. 24 4+5+5+5+6 = 25; tr. 25 5+5+5+6+6 = 27 (ô 26–52); tr. 26 5+5+5+5+5 = 25 (ô 53–77); tr. 27 5+5+4+5+5 = 24 (ô 78–101); tr. 28 6+5+5+6+5 = 27 (ô 102–128); tổng 128, khớp IMSLP (128 bars) và cách đánh số của Henle (Bemerkungen: M 28/108, 36/116 là hai chỗ song song, lệch 80 ô như cách đếm này). Mốc: không có bản MIDI mở (Mutopia không có bài này) nên đo tay trên bản mp3 chuyển mã của Commons (160,5 s) bằng librosa: độ to theo từng giây và khởi âm (onset_detect); chi tiết ở n27. Chữ do ::hinh-cau-truc dựng (sơ đồ) thuộc hồ sơ du-lieu/tac-pham/debussy-golliwogg.'
nguon:
  - id: durand-1908
    bac: 1
    ten: 'Debussy, Children''s Corner, Petite Suite pour Piano seul, Durand & Fils, Paris; bản khắc 1908 (tr. 24 "Copyright by A. Durand & Fils 1908"; tr. 28 "D. & F. 7188 (VI)", lần in "Février 1952 Imp. Mounot. Paris"); bản quét IMSLP #252526; tr. 2 lời đề tặng và mục lục (PROGRAMME), Golliwogg''s cake walk ở tr. 24–28'
    link: https://imslp.org/wiki/Special:ImagefromIndex/252526
  - id: imslp-cc
    bac: 2
    ten: 'IMSLP, Children''s Corner, CD 119 (Debussy, Claude) (API wikitext, 17/11/2026): Alternative Title "Coin des enfants : petite suite pour piano seul"; Opus/Catalogue Number "CD 119 ; L.113"; 6 movements, số 6 "Golliwog''s Cake-walk, Allegro giusto (E-flat major, 128 bars)"; Dedication Chou-chou (Claude-Emma Debussy 1905-1919); Year/Date of Composition 1906-1908; First Publication 1908 Paris: Durand & Fils, Plate D. & F. 7188, 28 pages; First Performance 1908/12/18 Paris, Cercle musical, Harold Bauer (piano); 1911-03-25 Boston (Caplet''s orchestration); bản quét #252526 Durand & Fils 1908 D. & F. 7188; bản thu: Debussy, Claude (piano), "Complete Performance", "Piano rolls, ca.1904–1918", Reissue "Masters of the Piano Roll, Vol.2. Debussy plays Debussy", Dal Segno 2004; Firkušný, Rudolf (piano), Capitol Records 1956 P8350, Public Domain (6 bài); Ligoratti, Stefano (piano), Golliwogs Cakewalk (No.6), Creative Commons Attribution 4.0, "Live recording"'
    link: https://imslp.org/wiki/Children%27s_Corner,_CD_119_(Debussy,_Claude)
  - id: henle-hn382
    bac: 2
    ten: 'G. Henle Verlag, HN 382 Debussy, Children''s Corner (trang sản phẩm, 17/11/2026): "This little Suite was published in 1908 and was dedicated to the composer''s then three-year old daughter"; "To my beloved little Chouchou with the tender excuses of her father for what follows below"; "The first movement, Doctor Gradus ad Parnassum, alludes to a study by Muzio Clementi"; "The well-known number 6, Golliwogg''s Cakewalk, is in ragtime style and shows Debussy''s easy-going approach to popular trends in music"; mức khó: Doctor Gradus ad Parnassum 6 medium, The Little Shepherd 4 medium "ABRSM: Piano Grade 7", Golliwogg''s Cakewalk 6 medium'
    link: https://www.henle.de/en/Children-s-Corner-Little-Suite-for-Piano/HN-382
  - id: henle-382-vorwort
    bac: 2
    ten: 'G. Henle Verlag, HN 382: lời tựa (François Lesure, 1983), PDF: viết 1906–1908; Durand in "in late September 1908"; tặng con gái Chouchou "then barely three years old"; năm trong sáu bài tên tiếng Anh, vì Debussy "anglophile" và Chouchou có bảo mẫu người Anh, Miss Gibbs; Clementi, "a salutary and progressive form of physical exercise"; biểu diễn lần đầu "18 December 1908 by the English pianist Harold Bauer at the Cercle musical in Paris"; André Caplet phối cho dàn nhạc năm 1910'
    link: https://www.henle.de/media/3f/8c/98/1690886064/0382-1690886064-sync.pdf
  - id: henle-382-comments
    bac: 2
    ten: 'G. Henle Verlag, HN 382: Bemerkungen/Comments (Ernst-Günter Heinemann, 1983), PDF, mục Golliwogg''s Cakewalk: ghi chú ở M 26, 28/108 ("cf. M 36/116"), 73, 74 f.'
    link: https://www.henle.de/media/50/a5/2d/1690886037/0382-1690886037-sync.pdf
  - id: cod-cakewalk
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục cakewalk: "Dance popularized in 1890s by Amer. vaudeville team of Bert Williams and George Walker and by black dancer Charles Johnson. Originated when Amer. slaves parodied the whites'' manners and method of dancing—a prize (cake) was awarded to best dancers. It featured a strutting movt., with the couple arm-in-arm and performing high kicks. Debussy wrote ''Golliwogg''s Cakewalk'' in his Children''s Corner (1906–8)."'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cakewalk
  - id: cod-ragtime
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục ragtime: "Early type of jazz, particularly for solo pf., and comp. rather than improvised. Famous exponent and composer of it was Scott Joplin. Popular from c. 1895–1920"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/ragtime
  - id: cod-cedez
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục cédez: "(Fr.). Give way, i.e. diminish the speed"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cedez
  - id: cod-retenu
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục retenant; retenu: "(Fr.). Holding back; held back (immediately, like ritenuto, not gradually, like rallentando)"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/retenant
  - id: cod-giusto
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music, mục giusto: "allegro giusto means either a strict allegro or a moderate allegro (neither too fast nor too slow)"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/giusto
  - id: larousse
    bac: 2
    ten: 'Larousse, dictionnaire français-anglais: "net, nette": clean, neat, clear; "sec": dry; "moins": less; "toujours": always, still; "émotion": emotion'
    link: https://www.larousse.fr/dictionnaires/francais-anglais/nette
  - id: jimcrow
    bac: 2
    ten: 'Jim Crow Museum (Ferris State University), The Golliwog Caricature: "The Golliwog (originally spelled Golliwogg) is the least known of the major anti-black caricatures"; "The Golliwog began life as a story book character created by Florence Kate Upton"; "In 1895, her book, entitled The Adventures of Two Dutch Dolls, was published in London"; "He was a caricature of American black faced minstrels"; "The Golliwogg was based on a Black minstrel doll that Upton had played with as a small child in New York"; "immensely popular in England, and Golliwogg became a national star"'
    link: https://jimcrowmuseum.ferris.edu/golliwog/homepage.htm
  - id: ptna-630
    bac: 2
    ten: 'PTNA Piano Encyclopedia, Children''s corner (Hayashikawa Takashi, cập nhật 18/4/2019): "Golliwog''s Cakewalk depicts the cheerful dancing of Golliwog, a mechanical doll, to the cakewalk, an American Black dance ... the middle section shifts to a languid mood, and it is particularly interesting how fragments of Wagner''s Tristan und Isolde melody appear"; "Total Performance Time: 2 min 30 sec" cho Golliwog''s cakewalk'
    link: https://enc.piano.or.jp/en/musics/630
  - id: laits-tristan
    bac: 2
    ten: 'University of Texas at Austin (LAITS), trang Tristan and Isolde, mục Debussy và Berg (Matthew Heisterman, John Weinstock, 2007): "a big change occurs sixty-one measures into the piece"; "Debussy has inserted the opening phrase of Tristan and Isolde! He uses only the Longing motive, and excludes ... the Tristan chord at the end"; "the final D-sharp (written here as an E-flat)"; "both composers do use the original pitches of the motive without transposition"; "Debussy trivializes Wagner''s dramatic theme"; "Debussy uses the Wagner quote as a joke"; "After each of the four statements of Longing, the music returns to the blithe, staccato eighth notes"; "left hand accompaniment with a syncopated right hand melody"'
    link: https://laits.utexas.edu/tristan/DebBerg.php
