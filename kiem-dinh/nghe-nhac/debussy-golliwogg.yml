    cau: 'Cakewalk là điệu nhảy ra đời khi những người nô lệ ở Mỹ nhại lại dáng điệu và lối khiêu vũ của người da trắng; cặp nhảy đẹp nhất được thưởng một chiếc bánh; dáng đi ưỡn ngực, hai người khoác tay nhau, đá chân cao; thành mốt trên sân khấu Mỹ những năm 1890.'
    loai: lich-su
    nguon: [ cod-cakewalk ]
    ket_qua: dung
    ghi_chu: 'COD: "Originated when Amer. slaves parodied the whites'' manners and method of dancing—a prize (cake) was awarded to best dancers. It featured a strutting movt., with the couple arm-in-arm and performing high kicks"; "popularized in 1890s by Amer. vaudeville team of Bert Williams and George Walker". Review (Claude, 17/11/2026): COD mục cakewalk (encyclopedia.com, tải lại): "Amer. slaves parodied the whites'' manners and method of dancing", "strutting movt., with the couple arm-in-arm and performing high kicks", "popularized in 1890s"; khớp.'
