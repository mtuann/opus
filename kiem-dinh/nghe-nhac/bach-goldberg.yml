khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, giong, not, so-o ]
    ket_qua: dung
    ghi_chu: 'Tám nốt khung bè trầm ô 1–8 của Aria (mỗi ô một nốt ba phách), đối chiếu Mutopia bwv-988-aria.ly (Bach-Gesellschaft), bassOne (\relative c): G3 F♯3 E3 D3 B2 C3 D3 G2, khớp G, F, E, D, B,, C, D, G,, (K:G, L:1/4). Chỉ giữ nốt chính mỗi ô như tiêu đề nói ("chỉ khung bè trầm"); cao độ đúng quãng tám của bản nhạc. M:3/4, mỗi ô đủ ba phách.'
doi_chu:
  - cu: In năm 1741 ở Nuremberg (nhà in Balthasar Schmid), trong loạt sách Clavier-Übung của Bach
    moi: In năm 1741 ở Nuremberg (nhà xuất bản Balthasar Schmid), là phần thứ tư của loạt sách Clavier-Übung của Bach
    ly_do: 'n3: trang bìa "in Verlegung Balthasar Schmids"; IMSLP, NBS: Clavier-Übung IV.'
  - cu: Khoảng 40–80 phút, tùy nghệ sĩ có chơi các dấu nhắc lại hay không
    moi: "Khoảng 40–80 phút, tùy tốc độ và việc nghệ sĩ có chơi các dấu nhắc lại hay không (Glenn Gould năm 1955: khoảng 38 phút; bản Kimiko Ishizaka trên trang này: khoảng 82 phút)"
    ly_do: "n6: độ dài đo trên MusicBrainz và Commons."
  - cu:
      - "Trang bìa bản in năm 1741 ghi rõ: một aria với nhiều biến tấu, cho harpsichord có hai bàn phím, soạn để làm vui tâm hồn những người yêu nhạc. Đây là một trong số ít tác phẩm Bach cho in khi còn sống, và là bộ biến tấu đồ sộ nhất của thời Baroque."
      - 'Cái tên "Goldberg" đến từ một giai thoại. Năm 1802, nhà viết tiểu sử Johann Nikolaus Forkel kể rằng bá tước Keyserlingk, cựu đại sứ Nga ở triều đình Saxony, hay mất ngủ và nhờ Bach viết nhạc để nhạc công trẻ Johann Gottlieb Goldberg chơi cho ông nghe trong những đêm dài. Nhiều nhà nghiên cứu nghi ngờ chuyện này: trang bìa không có lời đề tặng, Forkel viết sau hơn 60 năm, và khi bản nhạc ra đời Goldberg mới khoảng 14 tuổi. Hãy coi đó là một câu chuyện đẹp, chưa phải sự thật đã được chứng minh.'
      - 'Cấu trúc rất chặt chẽ. Mở đầu là Aria, một điệu sarabande chậm dài 32 ô nhịp, chia hai nửa, mỗi nửa có dấu nhắc lại. Tiếp theo là 30 biến tấu, và cuối cùng Aria được chơi lại nguyên vẹn (da capo). Điều bất ngờ: các biến tấu không giữ giai điệu của Aria mà giữ bè trầm và đường đi hòa âm của nó (xem lại Chủ đề và biến tấu). Vì vậy đừng chờ nghe lại giai điệu; hãy nghe "bộ xương" nằm bên dưới.'
      - 'Cứ ba biến tấu có một canon. Biến tấu 3, 6, 9… đến 27 là những canon: một bè nhắc lại y nguyên bè kia, và khoảng cách giữa hai bè tăng dần, từ đồng âm (biến tấu 3), quãng 2 (biến tấu 6)… đến quãng 9 (biến tấu 27). Xen giữa là các điệu nhảy, một fughetta, những bản kỹ thuật bắt chéo tay. Biến tấu 16, mở đầu nửa sau, là một khúc mở màn kiểu Pháp (ouverture). Chỉ ba biến tấu ở giọng Sol thứ: 15, 21 và 25; nghệ sĩ harpsichord Wanda Landowska gọi biến tấu 25 là "viên ngọc đen". Biến tấu 30 là một quodlibet, ghép những giai điệu dân ca quen thuộc thời đó vào khung hòa âm, như một trò đùa giữa bạn bè.'
    moi:
      - 'Trang bìa bản in năm 1741 ghi rõ: một aria với nhiều biến tấu, cho harpsichord có hai bàn phím, soạn để làm vui tâm hồn những người yêu nhạc. Đây là phần thứ tư của Clavier-Übung ("Bài tập cho đàn phím"), loạt tác phẩm cho đàn phím mà Bach cho in khi còn sống.'
      - 'Cái tên "Goldberg" đến từ một giai thoại. Năm 1802, nhà viết tiểu sử Johann Nikolaus Forkel kể rằng bá tước Keyserlingk, cựu đại sứ Nga ở triều đình Saxony, hay mất ngủ và nhờ Bach viết nhạc để nhạc công trẻ Johann Gottlieb Goldberg chơi cho ông nghe trong những đêm dài. Chuyện này chưa chắc chắn: trang bìa không có lời đề tặng, Forkel viết sau hơn 60 năm, và khi bản nhạc ra đời Goldberg mới khoảng 14 tuổi. Hãy coi đó là một câu chuyện đẹp, chưa phải sự thật đã được chứng minh.'
      - 'Cấu trúc rất chặt chẽ. Mở đầu là Aria, một giai điệu chậm nhịp 3/4 dài 32 ô nhịp, chia hai nửa, mỗi nửa có dấu nhắc lại. Tiếp theo là 30 biến tấu, và cuối cùng Aria được chơi lại nguyên vẹn (da capo). Điều bất ngờ: các biến tấu không giữ giai điệu của Aria mà giữ bè trầm và đường đi hòa âm của nó (xem lại Chủ đề và biến tấu). Vì vậy đừng chờ nghe lại giai điệu; hãy nghe "bộ xương" nằm bên dưới.'
      - "Cứ ba biến tấu có một canon. Biến tấu 3, 6, 9… đến 27 là những canon: một bè nhắc lại y nguyên bè kia, và khoảng cách giữa hai bè tăng dần, từ đồng âm (biến tấu 3), quãng 2 (biến tấu 6)… đến quãng 9 (biến tấu 27). Xen giữa là các điệu nhảy, một fughetta, những bản kỹ thuật bắt chéo tay. Biến tấu 16, mở đầu nửa sau, là một khúc mở màn kiểu Pháp (ouverture). Chỉ ba biến tấu ở giọng Sol thứ: 15, 21 và 25. Biến tấu 30 là một quodlibet, ghép những giai điệu dân ca quen thuộc thời đó vào khung hòa âm, một kiểu liên khúc vui."
    ly_do: 'n8: description theo câu đã sửa. n8: "số ít", "đồ sộ nhất" không có nguồn. n10: NBS "much less certainty". n14: không có nguồn đọc được cho "sarabande". n21, n22: Landowska không có nguồn bậc 1–2; NBS "light-hearted medley".'
