    loai: ten
    nguon: [ commons-title, imslp-988 ]
    ket_qua: dung
    ghi_chu: 'Trang bìa: "ARIA mit verschiedenen Veraenderungen"; IMSLP: BWV 988.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png" ]
    luot_2_ghi_chu: 'IMSLP: BWV 988, tên khác "Aria mit verschiedenen Veränderungen"; trang bìa ghi "ARIA mit verschiedenen Verænderungen".'
  - id: n3
    cau: 'Bảng: In năm 1741 ở Nuremberg (nhà xuất bản Balthasar Schmid), là phần thứ tư của loạt sách Clavier-Übung của Bach.'
    loai: nam
    nguon: [ commons-title, imslp-988, henle-hn1159, nbs-988 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "In năm 1741 ở Nuremberg (nhà in Balthasar Schmid), trong loạt sách Clavier-Übung của Bach". Chữ mới: câu ở cột này. Lý do: trang bìa "Nürnberg in Verlegung Balthasar Schmids" (Verlegung: xuất bản); IMSLP "1741 (as Clavier-Übung IV)"; NBS "the fourth part of … Clavier-Übung". Trang bìa không ghi năm; Terry (chú thích 234) ghi "circ. 1742", Henle, IMSLP, NBS ghi 1741. Review D6-L7-gom: đọc lại chữ trang, khớp câu (không còn chữ cũ đã bỏ); lượt 2 xác nhận chữ đã sửa. Lượt 2 lưu ý NBA ghi năm in 1741/42; trang ghi theo trang bìa 1741, như nguồn lượt 1.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf" ]
    luot_2_ghi_chu: 'IMSLP: in lần đầu 1741 (là Clavier-Übung IV); trang bìa: "Nürnberg in Verlegung Balthasar Schmids". Lưu ý: lời tựa NBA (Wolff) nói không có tài liệu ghi ngày in, theo các ấn phẩm khác của Schmid thì phải trong 1741/42; trang bìa không ghi "phần IV" nhưng NBA và Henle gọi là Klavierübung Teil IV.'
    review: dung
