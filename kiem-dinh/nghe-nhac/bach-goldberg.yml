    luot_2_nguon: [ "https://www.henle.de/Goldberg-Variations-BWV-988/HN-1159" ]
    luot_2_ghi_chu: "Trang Henle HN 1159, mục về nhà soạn nhạc: sinh ở Eisenach 21/3/1685, mất ở Leipzig 28/7/1750."
  - id: n2
