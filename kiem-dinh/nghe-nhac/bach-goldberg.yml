  - cu: "Phần lớn các biến tấu cần trình độ sau Grade 8. Aria dễ tiếp cận hơn: nốt không nhanh, cái khó là giữ nhịp sarabande chậm mà vẫn trôi, và chơi gọn các nốt hoa mỹ. Một con đường hợp lý: Minuet Sol trưởng → Invention số 1 và các Invention khác → các Sinfonia ba bè → Aria. Xem thêm Tác phẩm theo cấp độ."
    moi: "Henle xếp cả bộ ở mức 9 (khó nhất) trên thang 1–9. Aria thì nốt không nhanh: cái khó là giữ nhịp chậm mà vẫn trôi, và chơi gọn các nốt hoa mỹ. Một con đường hợp lý: Minuet Sol trưởng → Invention số 1 và các Invention khác → các Sinfonia ba bè → Aria. Xem thêm Tác phẩm theo cấp độ."
    ly_do: n44, n45.
