ghi_chu: 'Hướng dẫn nghe Biến tấu Goldberg (tầng Tác phẩm; bản ghi tac-pham/bach-goldberg; loai: nghe là cấu trúc, không phải nhận định; trang đã chuyển ở D1.8). Bản nhạc: Mutopia bwv-988-aria.ly (Bach-Gesellschaft; số ô, bè trầm ô 1–8, dấu nhắc lại); danh sách 30 biến tấu kèm chỉ dẫn gốc (a 1/a 2 Clav., Canone alla …, Fughetta, Ouverture, Andante, Adagio) trên IMSLP; giọng, nhịp, số bè từng biến tấu đối chiếu thêm bản chuyển soạn guitar trên Mutopia (chỉ dùng cho giọng, nhịp, số bè, hướng đi của bè, không dùng cho nốt hoa mỹ); trang bìa bản in (Commons). Lịch sử: Forkel 1802 (bản dịch Terry 1920, Project Gutenberg), lời tựa Henle HN 1159, Netherlands Bach Society, IMSLP BWV 1087, LoC (Grove: Goldberg rửa tội 14/3/1727). Bản thu: MusicBrainz. Sửa trang: n3, n6, n8, n10, n14, n18 (link canon), n21 (bỏ Landowska), n22, n29, n33, n35, n36, n37, n41–n46, n49. Không có chỗ chưa chắc. Hai nguồn lệch: năm tìm thấy bản in riêng ở Strasbourg (IMSLP, NBS 1974; Henle 1975), giữ 1974 (n26). Câu ở hồ sơ khác: piano/nghe-si (trang có mục Nghe kèm bản thu với ::khoi-nghe và Theo dõi khi nghe), piano/not-hoa-my (Aria có nốt hoa mỹ ở phần lớn các ô): trang giữ đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe, chữ do ::hinh-cau-truc dựng (hồ sơ du-lieu/tac-pham/bach-goldberg). Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: canon, quodlibet, fughetta, khúc mở màn kiểu Pháp (ouverture), bắt chéo tay (ghi cho người giao).'
