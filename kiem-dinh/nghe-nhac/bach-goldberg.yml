    nguon: [ imslp-988, henle-hn1159 ]
    ket_qua: dung
    ghi_chu: 'src/data/nha-soan-nhac.yml (đã khóa) bach 1685–1750; Henle niên biểu: "Death in Leipzig on July 28" (1750).'
