  - id: n7
    cau: 'Trang bìa bản in năm 1741 ghi: một aria với nhiều biến tấu, cho harpsichord có hai bàn phím, soạn để làm vui tâm hồn những người yêu nhạc.'
    loai: ten
    nguon: [ commons-title ]
    ket_qua: dung
    ghi_chu: '"ARIA mit verschiedenen Veraenderungen vors Clavicimbal mit 2 Manualen. Denen Liebhabern zur Gemüths-Ergetzung verfertiget".'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png" ]
    luot_2_ghi_chu: 'Ảnh trang bìa bản in đầu: "Clavier Ubung bestehend in einer ARIA mit verschiedenen Verænderungen vors Clavicimbal mit 2 Manualen. Denen Liebhabern zur Gemüths-Ergetzung verfertiget von Johann Sebastian Bach…"; năm 1741 lấy từ IMSLP/NBA (trang bìa không ghi năm).'
  - id: n8
    cau: 'Đây là phần thứ tư của Clavier-Übung ("Bài tập cho đàn phím"), loạt tác phẩm cho đàn phím mà Bach cho in khi còn sống.'
    loai: lich-su
    nguon: [ nbs-988, imslp-988, henle-hn1159 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (cả description): "Đây là một trong số ít tác phẩm Bach cho in khi còn sống, và là bộ biến tấu đồ sộ nhất của thời Baroque." Lý do: "số ít", "đồ sộ nhất" không có ở nguồn đã mở. NBS, IMSLP: phần thứ tư của Clavier-Übung; Henle niên biểu: Clavier-Übung II (1735), III (1739), IV (1741). Description sửa theo ("Đây là phần thứ tư…"). Review D6-L7-gom: đọc lại chữ trang, khớp câu (không còn chữ cũ đã bỏ); lượt 2 xác nhận chữ đã sửa.'
    luot_2: dung
    luot_2_nguon: [ "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf", "https://www.bachvereniging.nl/en/bwv/bwv-988" ]
    luot_2_ghi_chu: "NBA (Wolff): \"the significant conclusion of Bach's four-part Clavierübung\"; NBS: \"published as the fourth part of Bach's encyclopaedic Clavier-Übung\". Các phần đều là nhạc cho đàn phím in khi Bach còn sống."
    review: dung
  - id: n9
    cau: 'Năm 1802, Forkel kể rằng bá tước Keyserlingk, cựu đại sứ Nga ở triều đình Saxony, hay mất ngủ và nhờ Bach viết nhạc để Johann Gottlieb Goldberg chơi cho ông nghe trong những đêm dài.'
    loai: lich-su
    nguon: [ forkel-terry ]
    ket_qua: dung
    ghi_chu: 'Forkel (Terry): "Count Kaiserling, formerly Russian Ambassador at the Saxon Electoral Court … suffered from insomnia … asked Bach to write for Goldberg some Clavier music … that would relieve the tedium of sleepless nights"; sách in năm 1802. "Nhạc công trẻ": Goldberg sinh 1727 (n13).'
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/35041", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf" ]
    luot_2_ghi_chu: 'Forkel 1802 (bản dịch Terry): Count Kaiserling, "formerly Russian Ambassador at the Saxon Electoral Court", mất ngủ, nhờ Bach viết nhạc cho Goldberg chơi trong những đêm mất ngủ. NBA xác nhận nguồn là tiểu sử Forkel 1802.'
  - id: n10
    cau: 'Chuyện này chưa chắc chắn.'
    loai: lich-su
    nguon: [ nbs-988 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhiều nhà nghiên cứu nghi ngờ chuyện này:". NBS: "there is much less certainty about Goldberg’s involvement"; chưa mở được nguồn nói "nhiều nhà nghiên cứu". Review D6-L7-gom: đọc lại chữ trang, khớp câu (không còn chữ cũ đã bỏ); lượt 2 xác nhận chữ đã sửa.'
    luot_2: dung
    luot_2_nguon: [ "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf", "https://www.bachvereniging.nl/en/bwv/bwv-988" ]
    luot_2_ghi_chu: "NBA: thiếu lời đề tặng chính thức và tuổi trẻ của Goldberg (sinh 1727) \"clearly speak against such a commission\"; NBS: \"there is much less certainty about Goldberg's involvement\"."
    review: dung
