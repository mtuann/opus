    loai: nam
    nguon: [ loc-goldberg, nbs-988 ]
    ket_qua: dung
    ghi_chu: 'LoC (Grove): rửa tội 14/3/1727, nên năm 1741 ông 13–14 tuổi; NBS: "the thirteen-year-old pupil". "Khoảng 14" vẫn đúng. Terry (1920) ghi "born circ. 1720": số liệu cũ, Grove mới hơn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.deutsche-biographie.de/sfz21564.html", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf" ]
    luot_2_ghi_chu: 'NDB: Goldberg rửa tội 1727 ở Danzig; NBA: "Johann Gottlieb Goldberg (born in 1727)". Năm 1741 khoảng 14 tuổi. (Ghi chú của Terry năm 1920 trong bản Forkel ghi "circ. 1720", đã cũ.)'
  - id: n14
    cau: 'Aria là một giai điệu chậm nhịp 3/4, dài 32 ô nhịp, chia hai nửa, mỗi nửa có dấu nhắc lại.'
    loai: cau-truc
