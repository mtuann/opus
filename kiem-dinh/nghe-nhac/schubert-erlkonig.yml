  - id: n10
    cau: Một người cha ôm đứa con nhỏ phi ngựa trong đêm lộng gió. Đứa trẻ thấy Vua tinh hiện ra dụ dỗ mình, nhưng người cha không nhìn thấy gì. Khi về đến nhà, đứa trẻ đã chết.
    loai: lich-su
    nguon: [ peters-erl, lumen-erl ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một người cha ôm đứa con ốm phi ngựa trong đêm bão." Chữ mới: "Một người cha ôm đứa con nhỏ phi ngựa trong đêm lộng gió." Lý do: lời Goethe (in trong bản Peters) là «durch Nacht und Wind» (đêm và gió), không nói bão; bài thơ không nói đứa trẻ ốm (chỉ «das ächzende Kind», đứa trẻ rên rỉ). Phần còn lại đúng: «Siehst, Vater, du den Erlkönig nicht?» / «Mein Sohn, es ist ein Nebelstreif»; «Erreicht den Hof mit Müh und Not; In seinen Armen das Kind war tot» (Lumen: «carried home … reach his farm»). Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf" ]
    luot_2_ghi_chu: "Lời trong bản nhạc: \"Wer reitet so spät durch Nacht und Wind? Es ist der Vater mit seinem Kind\"; cha nói đó là \"Nebelstreif\"; câu cuối \"Erreicht den Hof mit Müh' und Not; In seinen Armen das Kind war tot.\""
    review: dung
  - id: n11
    cau: Một ca sĩ hát cả bốn vai, và Schubert cho mỗi vai một "giọng" riêng.
    loai: cau-truc
    nguon: [ lumen-erl, peters-erl ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Điều kỳ diệu: **một ca sĩ đóng bốn vai**, và Schubert cho mỗi vai một "giọng" riêng:". Chữ mới: "**Một ca sĩ hát cả bốn vai**, và Schubert cho mỗi vai một "giọng" riêng:". Lý do: bỏ lời đánh giá "Điều kỳ diệu"; Lumen: «usually all sung by a single vocalist with each character''s part placed in a different vocal range»; bản Peters chỉ có một dòng giọng hát. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf" ]
    luot_2_ghi_chu: Bản nhạc viết cho một giọng hát, lời gồm người kể, cha, con, Vua tinh, mỗi vai có giọng, âm vực và cách đệm riêng.
    review: dung
