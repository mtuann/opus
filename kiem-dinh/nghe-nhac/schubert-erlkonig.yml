  - id: n15
    cau: 'Vua tinh: ngọt ngào, êm ái, ở giọng trưởng, rất nhỏ (pp).'
    loai: cau-truc
    nguon: [ lumen-erl, peters-erl, hyperion-erl ]
    ket_qua: dung
    ghi_chu: 'Peters: lần 1 "Du liebes Kind" ở Si♭ trưởng, pp, đệm đổi sang hợp âm nhẹ; lần 2 "Willst, feiner Knabe" ở Đô trưởng, ppp, đệm rải; lần 3 "Ich liebe dich" bắt đầu pp trên hợp âm Mi♭ trưởng rồi chuyển sang đe dọa (n25). Lumen: «major mode … softer dynamic»; Hyperion: «in the major key».'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf" ]
