khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ not, nhip, tiet-tau, giong, toc-do, cu-phap ]
    ket_qua: da-sua
    ghi_chu: 'Khối cũ: L:1/8, M:4/4, Q:1/4=150, K:Gm, tay phải "(3[Gg][Gg][Gg]" ×4 mỗi ô, hai ô, tiêu đề "(minh họa)": đúng giọng Sol thứ, nhịp 4/4, liên ba lặp, nhưng quãng tám Sol4–Sol5 cao hơn bản nhạc một quãng tám và thứ tự trường đầu là L trước M. Đối chiếu Peters tr. 170, ô 1–2 tay phải: quãng tám Sol3–Sol4, liên ba móc đơn, bốn nhóm mỗi ô, f, «Schnell (♩ = 152)», hóa biểu hai giáng, C. Khối mới: "!f!(3[G,G][G,G][G,G]" ×4 mỗi ô, hai ô; Q:1/4=152; thứ tự X, T, M, L, Q, K; tiêu đề "Vó ngựa: liên ba lặp lại ở tay phải (hai ô mở đầu)" (chỉ tay phải; tay trái ô 1 nghỉ, ô 2 vào hình liên ba trầm). Mỗi ô 4 nhóm liên ba móc đơn = 4/4. Ấn bản ghi ở mục Nguồn (n32).'
ghi_chu: 'Hướng dẫn nghe Erlkönig (tầng Tác phẩm). Bản nhạc: Schubert-Album tập 1 của Peters (Friedlaender, khoảng 1890) trên Internet Archive, đọc từng trang tr. 170–175 (hai bản khác trên IA là bản phối của Liszt, không dùng). Nguồn: IMSLP (wikitext), Hyperion (Graham Johnson), giáo trình mở Lumen Learning (Tidewater CC), MusicBrainz cho bản thu và độ dài. Sửa trang: mô tả và câu mở (n2, n10: bỏ "ốm", "bão"), bỏ "Điều kỳ diệu" (n11), tay trái (n17), câu "khó và mệt" viết theo Hyperion (n18), khuông nhạc (quãng tám đúng, tốc độ theo bản Peters), mục Nguồn (n31 bỏ, n32 thêm). Bảng nhân vật (4 dòng) và bảng Theo dõi (9 dòng) giữ nguyên, cột đầu "…", trang không có mốc. Câu ở hồ sơ khác vẫn đúng: piano/choi-cung-nguoi-khac n7 (dòng Bản thu gợi ý giữ nguyên), n57 (vó ngựa suốt bài, câu cuối recitative không piano: n16, n27); nhac-ly/31-hinh-thuc-nho n44 (bài là Erlkönig; Lumen: «through-composed»); nhac-cu/index n21, nhac-cu/nhac-cu-khac n15, n22, nhan-dien/the-loai n35, nghe-nhac/nghe-gi-tiep n26, lich-su/thoi-ky/lang-man n37 (đường dẫn, tên). Dữ liệu nha-soan-nhac: trang không link tới người (chỉ ghi tên Fischer-Dieskau, Moore). Thuật ngữ chưa có trong thuat-ngu.yml: Lied (ca khúc nghệ thuật), recitative, liên ba (triplet), baritone, xuyên suốt (through-composed).'
