  - id: n16
    cau: 'Piano không chỉ đệm: tiếng nốt liên ba lặp lại không ngừng ở tay phải là tiếng vó ngựa phi trong đêm.'
    loai: cau-truc
    nguon: [ lumen-erl, peters-erl ]
    ket_qua: dung
    ghi_chu: "Peters ô 1: tay phải quãng tám Sol3–Sol4 liên ba móc đơn, f; Lumen: liên ba «simulate the horse's galloping», tay phải «triplets throughout the whole piece, up until the last three bars»."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf" ]
    luot_2_ghi_chu: "Tay phải: hợp âm, quãng tám lặp liên ba suốt bài, f từ ô 1."
  - id: n17
    cau: Tay trái là một chuỗi nốt liên ba chạy lên rồi xuống ở âm vực trầm, tối và đầy đe dọa.
    loai: cau-truc
    nguon: [ lumen-erl, peters-erl ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "còn tay trái gầm gừ như gió bão". Chữ mới: "còn tay trái là một chuỗi nốt liên ba chạy lên rồi xuống ở âm vực trầm, tối và đầy đe dọa". Lý do: hình ảnh "gió bão" không có nguồn (bài thơ chỉ nói gió); Peters ô 2: Sol2–La2–Si♭2–Đô3–Rê3–Mi♭3 (liên ba) rồi Rê3, Si♭2, Sol2; Lumen: «low-register leitmotif composed of successive triplets … dark and ominous». Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf" ]
    luot_2_ghi_chu: "Tay trái ô 2–3: nhóm liên ba chạy lên Sol–La–Si giáng–Đô–Rê–Mi giáng rồi đi xuống Rê, Si giáng, Sol ở âm vực trầm; lặp nhiều lần."
    review: dung
  - id: n18
    cau: 'Phần piano này rất khó: trong một bản soạn khác của bài, chính Schubert đã viết lại các nhóm liên ba thành nhóm hai nốt móc đơn dễ hơn.'
    loai: lich-su
    nguon: [ hyperion-erl ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là phần cực kỳ khó và mệt cho người chơi piano." (câu về sức lực, cần nguồn). Chữ mới theo Hyperion (Graham Johnson): «the fiendish piano triplets»; «in one of these [four versions] he re-writes the fiendish piano triplets as simple quaver duplets. He found it hard for his own piano technique to keep pace». Bỏ chữ "mệt" vì không có nguồn nói vậy. Review D6-L10-gom: lượt 2 khong-chac (không mở được bản soạn khác, chỉ thấy Wikipedia). Review tải trang Hyperion của lượt 1 (06/11/2026, User-Agent opus-kiem-dinh/1.0): ghi chú của Graham Johnson (1990) có nguyên văn "The four versions vary in this and that detail. We love Schubert all the more that in one of these he re-writes the fiendish piano triplets as simple quaver duplets." Hãng đĩa, bậc 2, đủ cho câu. Giữ, không chạy lại.'
    luot_2: khong-chac
    luot_2_ghi_chu: IMSLP ghi bốn bản soạn (bản 1–3 in trong Schubert's Werke, Breitkopf 1895), nhưng không mô tả cách viết đệm; PDF trên IMSLP không tải được, chưa đọc được bản 3 để xác nhận nhóm hai nốt móc đơn thay liên ba. Chỉ Wikipedia nói điều này.
    review: dung
