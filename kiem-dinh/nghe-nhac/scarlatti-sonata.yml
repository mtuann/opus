  - id: n14
    cau: 'Mỗi sonata chỉ có một chương, phần lớn ở hình thức hai đoạn: nửa đầu đi từ giọng chính sang một giọng mới; nửa sau đi xa hơn rồi trở về; mỗi nửa có dấu nhắc lại; phần cuối nửa đầu xuất hiện lại ở cuối nửa sau, ở giọng chính, như hai câu thơ gieo vần.'
    loai: cau-truc
    nguon:
      - treccani
      - cod-binary
      - omt-binary
      - imslp-midi-gouin
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: phần một chương, hai đoạn, nửa đầu sang giọng mới, nửa sau trở về có nguồn (Treccani "in un sol movimento, bipartito"; COD binary form). Vế "phần cuối nửa đầu trở lại ở cuối nửa sau, ở giọng chính" (vần) chưa mở được nguồn bậc 1–2 (Open Music Theory 403, Wayback 429) và chưa đối chiếu được cả bản nhạc ba sonata (Commons chỉ có trang đầu). Dấu nhắc lại: thấy ở trang đầu K. 141 (dấu ở cuối hệ 1). Review D6-L7-gom: lượt 2: một chương (DG), hai đoạn mỗi đoạn nhắc lại ở "the great majority" (Hyperion): thêm "phần lớn". Vế "vần": Open Music Theory (Binary Form, balanced) review mở qua bản lưu Wayback 2024, như lượt 2 phần dữ liệu (n8 hồ sơ bản ghi, dung): chất liệu cuối reprise thứ nhất trở lại cuối reprise thứ hai ở giọng chính, ví dụ Scarlatti K. 322. Thêm "phần lớn" theo ghi chú lượt 2, không chạy lại. Chữ câu cũ: "Mỗi sonata chỉ có một chương, ở hình thức hai đoạn: nửa đầu đi từ giọng chính sang một giọng mới; nửa sau đi xa hơn rồi trở về; mỗi nửa có dấu nhắc lại; phần cuối nửa đầu xuất hiện lại ở cuối nửa sau, ở giọng chính, như hai câu thơ gieo vần.". doi_chu. Mở khóa 09/11/2026 (mo/scarlatti): vế "vần" thấy trên bản nhạc K. 380 (MIDI IMSLP, xem n29); ba bài đều có nửa đầu sang giọng mới (Si trưởng; Đô thứ ở K. 466) và nửa sau trở về giọng chính.'
    luot_2: dung
    luot_2_nguon: [ "https://www.deutschegrammophon.com/en/composers/domenico-scarlatti/biography", "https://www.hyperion-records.co.uk/dc.asp?dc=D_CDA67613", https://imslp.org/wiki/File:PMLP297350-Scarlatti_Sonate_K.380.mid ]
    luot_2_ghi_chu: 'Một chương (DG), hai đoạn mỗi đoạn nhắc lại (Hyperion: "the great majority are written in binary form—two sections, both repeated"; Hyperion viết "phần lớn", câu viết "mỗi sonata"). Vế "phần cuối nửa đầu xuất hiện lại ở cuối nửa sau ở giọng chính" không xác nhận được bằng nguồn bậc 2 đọc được: Open Music Theory (chương binary form) trả 403 cả bản gốc lẫn Wayback, sách Kirkpatrick bị hạn chế. Thử bằng bản thu Smullyan K.380: đoạn cuối bài tương đồng (sắc độ dịch quãng 5) với đoạn quanh giây 67–77, gợi ý có "vần" nhưng không đủ chắc. Mở khóa 09/11/2026 (mo/scarlatti): vế "vần" đối chiếu được trên MIDI IMSLP của K. 380 (n29), cùng Open Music Theory (n14 ghi chú). Đổi khong-chac thành dung.'
    review: dung
  - id: n15
    cau: 'Điểm ở nửa sau mà từ đó đoạn "vần" bắt đầu gọi là crux.'
    loai: ten
    nguon:
      - omt-binary
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: chỉ thấy blog, Wikipedia và mục lục sách Kirkpatrick 1953 (chương có tên "the Crux"), không mở được nguồn bậc 1–2. Nếu lượt 2 không tìm được thì bỏ câu (và chữ crux ở hinh.nghe ghi_chu của bản ghi, đề xuất ở sua-A.yml). Review D6-L7-gom: lượt 2 không tìm được nguồn bậc 1–2 cho tên crux của Kirkpatrick. Open Music Theory (review mở qua Wayback; lượt 2 phần dữ liệu cũng trích): "a crux point—a particular moment where the restatement begins at the tail end of the second reprise". Bỏ tên Kirkpatrick (không kiểm được), viết định nghĩa theo OMT; giữ chữ crux ở ghi chú hình (dữ liệu n8). Chỉ bỏ vế không kiểm được, không chạy lại. Chữ câu cũ: "Kirkpatrick gọi điểm mà từ đó hai nửa bắt đầu "vần" với nhau là crux.". doi_chu.'
