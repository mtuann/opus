    link: https://commons.wikimedia.org/wiki/File:Scarlatti_Sonata_E_Major_K380.ogg
  - id: mb-horowitz
    bac: 2
    ten: 'MusicBrainz, Horowitz in Moscow (Deutsche Grammophon, 1986-08-11): bài 1 "Sonata in E major, K. 380 (L. 23): Andante comodo"; các bản thu K. 380 khác của Horowitz (ghi ngày 1/2/1968, 2/1/1968)'
    link: https://musicbrainz.org/release/b7207594-8f9a-4a56-b134-ec0984d2bea5
