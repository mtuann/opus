    link: https://musicbrainz.org/recording/c39a57c6-1128-435e-b0d4-2085d792a071
  - id: musicweb-ross
    bac: 2
    ten: 'MusicWeb International, review "Scarlatti: Complete Keyboard Sonatas" (Erato): "The Complete Keyboard Sonatas (Kk Nos 1-555)", "a joint project between Erato and Radio France which ran from June 1984 to September 1985", "34 CDs"'
    link: https://musicwebinternational.com/2023/11/scarlatti-complete-keyboard-sonatas-erato/
  - id: omt-binary
    bac: 2
    ten: "Open Music Theory, \"Binary Form\", mục Balanced (bản lưu Wayback 20/5/2024; trang gốc trả 403 với User-Agent của dự án): chất liệu cuối reprise thứ nhất trở lại cuối reprise thứ hai \"in the piece's home key\"; \"there needs to be a crux point—a particular moment where the restatement begins at the tail end of the second reprise\"; ví dụ Scarlatti K. 322; \"in order for the work to start and end in the same key\""
    link: https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/
  - id: imslp-midi-gouin
    bac: 2
    ten: "IMSLP, ba file MIDI do Pierre Gouin dựng (Montréal: Les Éditions Outremontaises, 2013; CC BY-SA 4.0), chủ repo tải tay ngày 09/11/2026, đọc bằng mido (cao độ, ô nhịp, hóa biểu): PMLP297350-Scarlatti_Sonate_K.380.mid (Mi trưởng, 3/4; hai dấu nhắc lại đã viết ra; nửa đầu 40 ô, kết ở hợp âm Si; nửa sau 38 ô, kết Mi2–Mi5); PMLP472479-Scarlatti_Sonate_K.141.mid (Rê thứ, 3/8; kết Rê2–Rê3); PMLP336146-Scarlatti_Sonate_K.466.mid (Fa thứ, 4/4; nửa đầu 34 ô, kết ở Đô (Đô thứ); nửa sau 42 ô, kết Fa2–Fa5). Kèm ảnh trang 1 bản Longo (L. 23, L. 422, L. 118) chủ repo gửi trong phiên làm việc"
    link: https://imslp.org/wiki/File:PMLP297350-Scarlatti_Sonate_K.380.mid
