    moi: Xem tài liệu tham khảo.
    ly_do: "n42: bỏ Grove Music Online (không đọc được)."
  - cu: 'Mỗi sonata chỉ có một chương, ở hình thức hai đoạn. Nửa đầu đi từ giọng chính sang một giọng mới; nửa sau đi xa hơn rồi trở về; mỗi nửa có dấu nhắc lại. Chìa khóa để nghe: phần cuối nửa đầu xuất hiện lại ở cuối nửa sau, nhưng ở giọng chính, như hai câu thơ gieo vần với nhau. Kirkpatrick gọi điểm mà từ đó hai nửa bắt đầu "vần" với nhau là crux. Xem thêm hình thức nhỏ.'
    moi: 'Mỗi sonata chỉ có một chương, phần lớn ở hình thức hai đoạn. Nửa đầu đi từ giọng chính sang một giọng mới; nửa sau đi xa hơn rồi trở về; mỗi nửa có dấu nhắc lại. Chìa khóa để nghe: phần cuối nửa đầu xuất hiện lại ở cuối nửa sau, nhưng ở giọng chính, như hai câu thơ gieo vần với nhau. Điểm ở nửa sau mà từ đó đoạn "vần" bắt đầu gọi là crux. Xem thêm hình thức nhỏ.'
    ly_do: 'n14, n15 (review D6-L7-gom): Hyperion "the great majority" ở hình thức hai đoạn; định nghĩa crux theo Open Music Theory, bỏ tên Kirkpatrick (không có nguồn đọc được).'
  - cu: 'K. 380: nửa sau đi qua các giọng xa, rồi đoạn "vần" trở lại ở Mi trưởng'
    moi: 'K. 380: nửa sau rời giọng chính, rồi đoạn "vần" trở lại ở Mi trưởng'
    ly_do: 'n29 (review D6-L7-gom): "các giọng xa" không kiểm được trên bản nhạc.'
  - cu: 'K. 141: nửa sau kết ở Rê thứ, mạnh mẽ'
    moi: 'K. 141: nửa sau trở về giọng chính để kết'
    ly_do: 'n30 (review D6-L7-gom): phần cuối bản nhạc không đọc được; viết theo hình thức hai đoạn (OMT).'
  - cu: 'K. 466: nửa sau trở về Fa thứ và khép lại lặng lẽ'
    moi: 'K. 466: nửa sau trở về giọng chính để khép lại'
    ly_do: 'n31 (review D6-L7-gom): như n30.'
