    ghi_chu: 'chưa chắc: như n14, chưa đối chiếu được nửa sau K. 380 trên bản nhạc. Review D6-L7-gom: lượt 2 không có bản nhạc nửa sau K. 380 (review cũng không: Commons chỉ có trang đầu bản Parma; Mutopia không có). Cách kiểm: hình thức hai đoạn cân bằng (OMT) và phân tích bản thu Smullyan của lượt 2 (đoạn cuối bài lặp lại, dịch quãng năm, chất liệu quanh giây 67–77 của nửa đầu); mốc 88 giây của dòng này do tools/audio/align/run.py căn (D6-0, chạy lại ở D6-L7). Bỏ vế "đi qua các giọng xa" (không kiểm được), viết "rời giọng chính". Dòng "nửa đầu được nhắc lại": dấu nhắc lại là phần của hình thức hai đoạn (n14, Hyperion), Smullyan không chơi nên dòng không có mốc. Chỉ bỏ vế không kiểm được, không chạy lại. Chữ câu cũ: "Theo dõi: K. 380, nửa đầu được nhắc lại; nửa sau đi qua các giọng xa, rồi đoạn "vần" trở lại ở Mi trưởng.". doi_chu. Mở khóa 09/11/2026 (mo/scarlatti): MIDI IMSLP: nửa sau (ô 41–78) qua Pha♯ trưởng, Đô♯ thứ, Son♯ thứ rồi về Mi trưởng; ô 20–25 của nửa đầu trở lại nguyên nốt, dịch xuống quãng năm (Si → Mi), ở ô 58–63 và 66–69, ô 36–40 ở ô 74–78: đúng đoạn "vần". Mốc 88 giây căn lại trên MIDI (ô 41): 87,5–87,6 giây.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Scarlatti,_Sonate_K._380_-_ms._Parme_X,23.jpg", https://imslp.org/wiki/File:PMLP297350-Scarlatti_Sonate_K.380.mid ]
