    link: https://musicbrainz.org/recording/c39a57c6-1128-435e-b0d4-2085d792a071
  - id: musicweb-ross
    bac: 2
    ten: 'MusicWeb International, review "Scarlatti: Complete Keyboard Sonatas" (Erato): "The Complete Keyboard Sonatas (Kk Nos 1-555)", "a joint project between Erato and Radio France which ran from June 1984 to September 1985", "34 CDs"'
    link: https://musicwebinternational.com/2023/11/scarlatti-complete-keyboard-sonatas-erato/
nhan_dinh:
  - id: n1
    cau: 'Bảng: Nhà soạn nhạc Domenico Scarlatti (1685–1757).'
    loai: nam
    nguon: [ treccani ]
    ket_qua: dung
    ghi_chu: 'src/data/nha-soan-nhac.yml (đã khóa); Treccani: sinh 26/10/1685, mất 23/7/1757.'
  - id: n2
    cau: 'Bảng: Sonata Mi trưởng K. 380 (L. 23); Sonata Rê thứ K. 141 (L. 422); Sonata Fa thứ K. 466 (L. 118).'
    loai: danh-muc
    nguon: [ imslp-ks, commons-ms ]
    ket_qua: dung
    ghi_chu: 'IMSLP; số danh mục đã khóa ở bản ghi (D2-0). Giọng khớp hóa biểu trên ảnh chép tay.'
  - id: n3
    cau: 'Bảng: Sáng tác trong những năm Scarlatti phục vụ triều đình Bồ Đào Nha rồi Tây Ban Nha; phần lớn được biết qua các tập chép tay thập niên 1740–1750.'
    loai: lich-su
    nguon: [ treccani, henle-hn574 ]
    ket_qua: dung
    ghi_chu: 'Henle: phần lớn sonata ra đời sau 1719; các tập Venice, Parma chép 1742, 1749, 1752–1757; Treccani như vậy. (K. 141 không có ở Venice, Parma: Henle HN 1221 dùng Worgan, Münster, Vienna; "phần lớn" vẫn đúng.)'
  - id: n4
    cau: 'Bảng: Thời kỳ Baroque muộn.'
    loai: lich-su
    nguon: [ imslp-ks, treccani ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Baroque"; các sonata viết khoảng 1720–1757, cuối thời Baroque.'
  - id: n5
    cau: 'Bảng: Thể loại sonata một chương cho đàn phím (chủ yếu harpsichord).'
    loai: ten
    nguon: [ treccani, henle-hn574 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sonata một chương cho harpsichord". Henle: viết "not solely for the harpsichord but also for the recently invented Forte-Piano"; Treccani: "in un sol movimento, bipartito". Câu "Đây là nhạc viết cho harpsichord" ở mục Nghe bằng tai người chơi piano sửa theo (n20).'
  - id: n6
    cau: 'Bảng: Độ dài mỗi bản khoảng 3–6 phút.'
    loai: so-lieu
    nguon: [ commons-smullyan, mb-argerich-hewitt ]
    ket_qua: dung
    ghi_chu: 'Smullyan K. 380 không nhắc lại: 180 giây; Argerich K. 141: 198 giây; chơi các dấu nhắc lại thì dài hơn. Khớp khoảng 3–6 phút.'
  - id: n7
    cau: 'Domenico Scarlatti sinh năm 1685 ở Naples, cùng năm với Bach và Handel.'
    loai: nam
    nguon: [ treccani ]
    ket_qua: dung
    ghi_chu: 'Treccani: "Nacque a Napoli il 26 ottobre 1685". Bach, Handel sinh 1685: src/data/nha-soan-nhac.yml (đã khóa).'
  - id: n8
    cau: 'Năm 1719 ông tới Lisbon và dạy nhạc cho công chúa Bồ Đào Nha Maria Magdalena Barbara.'
    loai: lich-su
    nguon: [ treccani, henle-hn574 ]
    ket_qua: dung
    ghi_chu: 'Treccani: "Nel 1719 Scarlatti lasciò il posto … per entrare al servizio del re di Portogallo", "arrivò in Portogallo in novembre"; dạy Maria Barbara. Henle: "In this year [1719] Scarlatti entered the service of the king of Portugal as a music teacher".'
  - id: n9
    cau: 'Khi bà về làm dâu hoàng gia Tây Ban Nha (về sau trở thành hoàng hậu), Scarlatti theo sang, sống ở Seville rồi Madrid đến cuối đời.'
    loai: lich-su
    nguon: [ treccani ]
    ket_qua: dung
    ghi_chu: 'Treccani: cưới thái tử Fernando (1728–1729); 1729 Scarlatti theo tới Siviglia; 1733 về Madrid; 1746 Fernando và Maria Barbara lên ngôi; mất ở Madrid 1757. Henle viết gọn "In 1728 he followed … to the court of Madrid".'
  - id: n10
    cau: 'Ông để lại 555 bản sonata cho đàn phím.'
    loai: so-lieu
    nguon: [ treccani ]
    ket_qua: dung
    ghi_chu: 'Treccani: "catalogazione tuttora vigente delle 555 sonate da tasto" (danh mục Kirkpatrick).'
  - id: n11
    cau: '30 bản đầu tiên được in năm 1738 với tên Essercizi ("Bài tập").'
    loai: nam
    nguon: [ treccani, henle-hn574 ]
    ket_qua: dung
    ghi_chu: 'Treccani: "Essercizi per gravicembalo (K 1-30) incisi a Londra nel 1738"; Henle như vậy. Essercizi: "bài tập".'
  - id: n12
    cau: 'Chữ K. là của Ralph Kirkpatrick, nghệ sĩ harpsichord đã lập danh mục năm 1953, cố gắng xếp các sonata theo thứ tự thời gian (dựa vào thứ tự trong các tập chép tay ở Venice).'
    loai: danh-muc
    nguon: [ treccani, henle-hn581 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đã lập danh mục năm 1953 theo thứ tự thời gian". Treccani: Kirkpatrick (1953) là một trong các "tentativi di ordinamento cronologico", vì không có nguồn tay tác giả và ngày tháng chắc; Henle HN 581: Kirkpatrick "took the order of V as his guide". "Theo thứ tự thời gian" viết như sự thật là quá.'
  - id: n13
    cau: 'Các ấn bản cũ dùng số L. của Alessandro Longo (ấn bản 1906–1910).'
    loai: nam
    nguon: [ treccani ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Alessandro Longo (1906)". Treccani: "prima edizione completa … curata dal pianista calabrese Alessandro Longo (1906-1910)".'
  - id: n14
    cau: 'Mỗi sonata chỉ có một chương, ở hình thức hai đoạn: nửa đầu đi từ giọng chính sang một giọng mới; nửa sau đi xa hơn rồi trở về; mỗi nửa có dấu nhắc lại; phần cuối nửa đầu xuất hiện lại ở cuối nửa sau, ở giọng chính, như hai câu thơ gieo vần.'
    loai: cau-truc
    nguon: [ treccani, cod-binary ]
    ket_qua: null
    ghi_chu: 'chưa chắc: phần một chương, hai đoạn, nửa đầu sang giọng mới, nửa sau trở về có nguồn (Treccani "in un sol movimento, bipartito"; COD binary form). Vế "phần cuối nửa đầu trở lại ở cuối nửa sau, ở giọng chính" (vần) chưa mở được nguồn bậc 1–2 (Open Music Theory 403, Wayback 429) và chưa đối chiếu được cả bản nhạc ba sonata (Commons chỉ có trang đầu). Dấu nhắc lại: thấy ở trang đầu K. 141 (dấu ở cuối hệ 1).'
  - id: n15
    cau: 'Kirkpatrick gọi điểm mà từ đó hai nửa bắt đầu "vần" với nhau là crux.'
    loai: ten
    nguon: []
    ket_qua: null
    ghi_chu: 'chưa chắc: chỉ thấy blog, Wikipedia và mục lục sách Kirkpatrick 1953 (chương có tên "the Crux"), không mở được nguồn bậc 1–2. Nếu lượt 2 không tìm được thì bỏ câu (và chữ crux ở hinh.nghe ghi_chu của bản ghi, đề xuất ở sua-A.yml).'
  - id: n16
    cau: 'Vũ điệu và tiếng guitar: nhiều bản bắt chước bước nhảy của vũ điệu; những nốt lặp lại nhanh và hợp âm gõ mạnh gợi tiếng gảy guitar.'
    loai: lich-su
    nguon: [ treccani ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Màu sắc bán đảo Iberia. Nhiều bản mang nhịp điệu vũ điệu dân gian Tây Ban Nha và Bồ Đào Nha; những nốt lặp lại nhanh và hợp âm gõ mạnh khiến nhiều người nghe thấy tiếng guitar, dù ý kiến này vẫn còn tranh luận." Treccani: "frequente imitazione di passi di danza e clangori chitarristici"; nguồn không nói vũ điệu dân gian Iberia hay tranh luận, nên bỏ.'
  - id: n17
    cau: 'Scarlatti cũng là bậc thầy của kỹ thuật bắt chéo tay: một tay vắt qua tay kia để chơi nốt ở xa.'
    loai: lich-su
    nguon: [ treccani, commons-ms ]
    ket_qua: dung
    ghi_chu: 'Treccani: các sonata khai thác "tutte le risorse idiomatiche dello strumento a tastiera … acrobatici incroci di mano, note ribattute … che mettono a duro cimento la perizia dell’esecutore". Giữ câu (piano/hai-tay đã khóa trỏ tới).'
  - id: n18
    cau: 'Trên piano hiện đại, nghệ sĩ chơi nhẹ, gọn, rõ, rất ít dùng bàn đạp, giữ nốt lặp đều bằng cách đổi ngón trên cùng một phím; để ý cách mỗi người tạo tiếng kèn hay tiếng guitar.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Không trái piano/not-lap-not-kep (đổi ngón khi lặp nốt) và piano/ban-dap.'
  - id: n19
    cau: 'Ba bản trong trang này có ba tính cách khác hẳn nhau.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu dẫn; chi tiết ở n21–n23.'
  - id: n20
    cau: 'Đây là nhạc viết chủ yếu cho harpsichord.'
    loai: lich-su
    nguon: [ henle-hn574 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là nhạc viết cho harpsichord." Henle: "not solely for the harpsichord but also for the recently invented Forte-Piano".'
  - id: n21
    cau: 'K. 380, Mi trưởng (Andante commodo, nhịp 3/4): có biệt danh Cortège (đoàn rước); mở đầu bằng những hình nốt như lời gọi kèn, đáp qua đáp lại.'
    loai: cau-truc
    nguon: [ imslp-ks, commons-ms ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "như một đoàn rước trong cung điện, với những lời gọi kèn đồng đáp qua đáp lại giữa gần và xa". Ảnh chép tay Parma: 4 thăng, 3/4, "And.te Commodo"; ô 1–2 hợp âm ba nốt chấm, nhắc lại ở ô 3–4 (đáp). IMSLP: biệt danh "Cortège". Bỏ "trong cung điện", "kèn đồng", "gần và xa" (hình ảnh không có nguồn); giữ "như lời gọi kèn" như hình ảnh nghe.'
  - id: n22
    cau: 'K. 141, Rê thứ (Allegro, nhịp 3/8): nốt lặp lại cực nhanh gần như suốt bài, bắt chéo tay; Henle xếp mức 7 (khó) trên thang 1–9.'
    loai: cau-truc
    nguon: [ commons-ms, imslp-ks, henle-hn1221 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(nhịp 3/8): nốt lặp lại cực nhanh gần như suốt bài, bắt chéo tay, nhịp điệu vũ điệu Tây Ban Nha. Một bản trình diễn kỹ thuật thật sự." Worgan 41: 1 giáng, 3/8, "Allegro", chuỗi nốt lặp móc ba ở mọi ô của hệ 1–2, tay trái vắt lên ở hệ 3–4 (trang đầu). Henle "· 7 · difficult"; tên Henle "Toccata". Bỏ "vũ điệu Tây Ban Nha" (không có nguồn). Giữ "nốt lặp lại cực nhanh gần như suốt bài", "bắt chéo tay" (piano/not-lap-not-kep đã khóa trỏ tới); "gần như suốt bài" mới kiểm trên trang đầu, Henle gọi là Toccata.'
  - id: n23
    cau: 'K. 466, Fa thứ (Andante moderato): chậm, buồn, hát như một aria; mặt trữ tình của Scarlatti.'
    loai: cau-truc
    nguon: [ commons-ms, imslp-ks ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… mặt trữ tình ít được biết đến của Scarlatti" ("ít được biết đến" không kiểm được). Venice XI,13: 4 giáng, C, "And.e Moderato"; giai điệu nốt dài trên đệm móc đơn.'
  - id: n24
