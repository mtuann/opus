    ghi_chu: 'Chữ cũ: "đã lập danh mục năm 1953 theo thứ tự thời gian". Treccani: Kirkpatrick (1953) là một trong các "tentativi di ordinamento cronologico", vì không có nguồn tay tác giả và ngày tháng chắc; Henle HN 581: Kirkpatrick "took the order of V as his guide". "Theo thứ tự thời gian" viết như sự thật là quá. Review D6-L7-gom: lượt 2 khong-chac vế thứ tự thời gian và vế tập chép tay Venice. Review mở lại Treccani: "diversi tentativi di ordinamento cronologico (Kirkpatrick, 1953; …)", "monografia di Ralph Kirkpatrick (1953), che dettò la catalogazione tuttora vigente delle 555 sonate"; PDF Bemerkungen Henle HN 581 review mở không thấy câu về thứ tự Venice. Giữ vế thứ tự thời gian (Treccani), bỏ vế Venice; harpsichord theo lượt 2 (Hyperion). Chỉ bỏ vế không kiểm được, không chạy lại. Chữ câu cũ: "Chữ K. là của Ralph Kirkpatrick, nghệ sĩ harpsichord đã lập danh mục năm 1953, cố gắng xếp các sonata theo thứ tự thời gian (dựa vào thứ tự trong các tập chép tay ở Venice).". doi_chu.'
