ghi_chu: 'Hướng dẫn nghe ba sonata Scarlatti K. 380, K. 141, K. 466 (tầng Tác phẩm; bản ghi tac-pham/scarlatti-sonata; loai: nghe là cấu trúc). Bản nhạc: ba sonata không có trên Mutopia, PDF IMSLP không tải; đọc trang đầu bản chép tay thế kỷ 18 trên Wikimedia Commons (K. 380 Parma X,23; K. 141 Worgan 41, British Library; K. 466 Venice XI,13) cho giọng, nhịp, chữ tốc độ, nốt lặp, bắt chéo tay; IMSLP cho giọng, chữ tốc độ, số L. Lịch sử: Dizionario Biografico degli Italiani (Treccani, Cristina Fernandes), lời tựa Henle HN 574, HN 1221, HN 581. Bản thu: Commons (Smullyan), MusicBrainz. Sửa trang: n5, n12, n13, n16, n20, n30, n21, n22, n23, n35, n36, n37, n38, n39. Chưa chắc: n14, n15 (hai nửa "gieo vần", tên crux của Kirkpatrick: chưa mở được nguồn bậc 1–2; Open Music Theory trả 403 với User-Agent của dự án, Wayback 429; sách Kirkpatrick 1953 là sách in). Câu ở hồ sơ khác (đã khóa): piano/hai-tay (Scarlatti "bậc thầy của kỹ thuật bắt chéo tay"), piano/not-lap-not-kep (K. 141 có nốt lặp lại cực nhanh gần như suốt bài), piano/nha-soan-nhac (hướng dẫn nghe ba sonata): trang giữ đúng cả ba (n18, n21). Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe, chữ do ::hinh-cau-truc dựng. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: hình thức hai đoạn (binary), crux, bắt chéo tay, đảo phách (ghi cho người giao).'
nguon:
  - id: treccani
    bac: 2
    ten: 'Cristina Fernandes, "Scarlatti, Domenico (Giuseppe Domenico)", Dizionario Biografico degli Italiani (Treccani, 2018): sinh ở Napoli 26/10/1685; 1719 rời Roma phục vụ vua Bồ Đào Nha, "arrivò in Portogallo in novembre"; dạy Maria Barbara; 1729 theo bà tới Siviglia, 1733 về Madrid; 1746 Fernando và Maria Barbara lên ngôi; "Essercizi per gravicembalo (K 1-30) incisi a Londra nel 1738"; các tập chép 1742, 1749, 1752–1757 ở Venezia, Parma; ấn bản Longo (1906-1910); Kirkpatrick (1953) "catalogazione tuttora vigente delle 555 sonate"; "tentativi di ordinamento cronologico (Kirkpatrick, 1953 …)"; "imitazione di passi di danza e clangori chitarristici"; "acrobatici incroci di mano, note ribattute"; sonate "in un sol movimento, bipartito"; mất ở Madrid 23/7/1757'
    link: https://www.treccani.it/enciclopedia/giuseppe-domenico-scarlatti_(Dizionario-Biografico)/
  - id: henle-hn574
    bac: 2
    ten: 'G. Henle Verlag, Piano Sonata in E major K. 380, L. 23 (HN 574): trang sản phẩm "Piano Sonata E major K. 380 · 5 · medium · ABRSM: Piano Grade 7"; lời tựa (Bengt Johnsson 1985, PDF): sonata viết "not solely for the harpsichord but also for the recently invented Forte-Piano", "In 1738, thirty sonatas (K. 1–30) appeared in print in London as Essercizi per Gravicembalo", các tập Venice và Parma "originated in Spain between 1752 and 1757, except for volumes XIV and XV … 1742 and 1749"'
    link: https://www.henle.de/en/Piano-Sonata-in-E-major-K.-380-L.-23/HN-574
  - id: henle-hn1221
    bac: 2
    ten: 'G. Henle Verlag, Piano Sonata d minor (Toccata) K. 141, L. 422 (HN 1221): trang sản phẩm "Piano Sonata d minor K. 141 · 7 · difficult"; lời tựa (PDF): nguồn chính là "Worgan Manuscript" (British Library)'
    link: https://www.henle.de/en/Piano-Sonata-d-minor-Toccata-K.-141-L.-422/HN-1221
  - id: henle-hn581
    bac: 2
    ten: 'G. Henle Verlag, Selected Piano Sonatas Vol. IV (HN 581), Bemerkungen/Comments (PDF): Kirkpatrick "when arranging the sonatas in his catalogue … took the order of V [Venice] as his guide"'
    link: https://www.henle.de/media/2e/99/b3/1697725732/0581-1697725732-sync.pdf
  - id: imslp-ks
    bac: 2
    ten: 'IMSLP (wikitext): K.380 "Keyboard Sonata in E major", "Alternative Title=Sonata in E major, (Cortège)", "K.380 ; L.23", "1. Andante commodo"; K.141 D minor "K.141 ; L.422", "Allegro"; K.466 F minor "K.466 ; L.118", "Andante moderato"; K.32 D minor "Aria"; K.34 D minor "Larghetto", "Average Duration=2 minutes"'
    link: https://imslp.org/wiki/Keyboard_Sonata_in_E_major,_K.380_(Scarlatti,_Domenico)
  - id: commons-ms
    bac: 1
    ten: 'Wikimedia Commons, ảnh trang đầu bản chép tay: "Scarlatti, Sonate K. 380 - ms. Parme X,23.jpg" (4 thăng, 3/4, "And.te Commodo", trill); "Scarlatti, Sonate K. 141 - ms. Worgan 41 (Londres, Ms. add. 31553).jpg" (1 giáng, 3/8, "Allegro", chuỗi nốt lặp móc ba, tay trái vắt lên ở hệ 3–4); "Scarlatti, Sonate K. 466 - ms. Venise XI,13.jpg" (4 giáng, C, "And.e Moderato")'
    link: https://commons.wikimedia.org/wiki/File:Scarlatti,_Sonate_K._380_-_ms._Parme_X,23.jpg
  - id: cod-binary
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "binary form": "a form in 2 sections … The first section opens in the tonic key and then … modulates … into the key of the dominant. The 2nd section then opens in that 2nd key and, before it ends, modulates back to the 1st"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/binary-form
