doi_chu:
  - cu: Sonata một chương cho harpsichord
    moi: Sonata một chương cho đàn phím (chủ yếu harpsichord)
    ly_do: "n5: Henle, sonata viết cả cho fortepiano."
  - cu: Chữ K. trước số hiệu là của Ralph Kirkpatrick, nghệ sĩ harpsichord đã lập danh mục năm 1953 theo thứ tự thời gian; đừng nhầm với K. của Köchel trong nhạc Mozart. Các ấn bản cũ dùng số L. của Alessandro Longo (1906). Xem cách đọc tên tác phẩm.
    moi: Chữ K. trước số hiệu là của Ralph Kirkpatrick, nghệ sĩ harpsichord đã lập danh mục năm 1953, cố gắng xếp các sonata theo thứ tự thời gian; đừng nhầm với K. của Köchel trong nhạc Mozart. Các ấn bản cũ dùng số L. của Alessandro Longo (ấn bản 1906–1910). Xem cách đọc tên tác phẩm.
    ly_do: "n12, n13: Treccani (vế thứ tự Venice bỏ ở review D6-L7-gom)."
  - cu:
      - "Màu sắc bán đảo Iberia. Nhiều bản mang nhịp điệu vũ điệu dân gian Tây Ban Nha và Bồ Đào Nha; những nốt lặp lại nhanh và hợp âm gõ mạnh khiến nhiều người nghe thấy tiếng guitar, dù ý kiến này vẫn còn tranh luận. Scarlatti cũng là bậc thầy của kỹ thuật bắt chéo tay: một tay vắt qua tay kia để chơi nốt ở xa."
      - Nghe bằng tai người chơi piano. Đây là nhạc viết cho harpsichord. Trên piano hiện đại, nghệ sĩ phải chơi nhẹ, gọn, rõ, rất ít dùng bàn đạp, và giữ những nốt lặp lại thật đều bằng cách đổi ngón trên cùng một phím. Hãy để ý cách mỗi người tạo ra "tiếng kèn" hay "tiếng guitar" chỉ bằng đầu ngón tay.
    moi:
      - "Vũ điệu và tiếng guitar. Nhiều bản bắt chước bước nhảy của vũ điệu; những nốt lặp lại nhanh và hợp âm gõ mạnh gợi tiếng gảy guitar. Scarlatti cũng là bậc thầy của kỹ thuật bắt chéo tay: một tay vắt qua tay kia để chơi nốt ở xa."
      - Nghe bằng tai người chơi piano. Đây là nhạc viết chủ yếu cho harpsichord. Trên piano hiện đại, nghệ sĩ phải chơi nhẹ, gọn, rõ, rất ít dùng bàn đạp, và giữ những nốt lặp lại thật đều bằng cách đổi ngón trên cùng một phím. Hãy để ý cách mỗi người tạo ra "tiếng kèn" hay "tiếng guitar" chỉ bằng đầu ngón tay.
    ly_do: "n16: Treccani. n20."
  - cu:
      - 'K. 380, Mi trưởng (Andante commodo): như một đoàn rước trong cung điện, với những lời gọi kèn đồng đáp qua đáp lại giữa "gần" và "xa".'
      - "K. 141, Rê thứ (nhịp 3/8): nốt lặp lại cực nhanh gần như suốt bài, bắt chéo tay, nhịp điệu vũ điệu Tây Ban Nha. Một bản trình diễn kỹ thuật thật sự."
      - "K. 466, Fa thứ (Andante moderato): chậm, buồn, hát như một aria; mặt trữ tình ít được biết đến của Scarlatti."
    moi:
      - "K. 380, Mi trưởng (Andante commodo, nhịp 3/4): có biệt danh Cortège (đoàn rước); mở đầu bằng những hình nốt như lời gọi kèn, đáp qua đáp lại."
      - "K. 141, Rê thứ (Allegro, nhịp 3/8): nốt lặp lại cực nhanh gần như suốt bài, bắt chéo tay. Một bản trình diễn kỹ thuật thật sự: Henle xếp mức 7 (khó) trên thang 1–9."
      - "K. 466, Fa thứ (Andante moderato): chậm, buồn, hát như một aria; mặt trữ tình của Scarlatti."
    ly_do: n21. n22. n23.
  - cu: "K. 141: hai tay bắt chéo, nhịp đảo phách kiểu vũ điệu"
    moi: "K. 141: hai tay bắt chéo, tay trái vắt lên chơi nốt cao"
    ly_do: n30.
  - cu:
      - "Vladimir Horowitz: thu âm K. 380 nhiều lần; bản này mở đầu đĩa Horowitz in Moscow, ghi buổi hòa nhạc ở Moscow năm 1986; tiếng đàn mềm mại, nhiều màu."
      - "Martha Argerich: hay chơi K. 141 như một bản tặng thêm (encore); những nốt lặp lại nhanh và sắc như tia lửa. Angela Hewitt cũng có bản thu K. 141 rất đáng nghe để so sánh."
      - "Scott Ross (harpsichord): người đầu tiên một mình thu âm trọn 555 bản sonata (1984–1985). Nghe để biết âm thanh gốc mà Scarlatti nghĩ tới."
    moi:
      - "Vladimir Horowitz: thu âm K. 380 nhiều lần; bản này mở đầu đĩa Horowitz in Moscow (Deutsche Grammophon), ghi buổi hòa nhạc ở Moscow năm 1986."
      - "Martha Argerich: có bản thu trực tiếp K. 141 (Live from the Concertgebouw 1978 & 1979). Angela Hewitt cũng thu K. 141 (Hyperion, 2016) để so sánh."
      - "Scott Ross (harpsichord): thu trọn 555 bản sonata cho hãng Erato (1984–1985). Nghe để biết âm thanh của cây đàn Scarlatti viết cho."
    ly_do: 'n33–n35: MusicBrainz, MusicWeb; bỏ đánh giá và "người đầu tiên".'
  - cu: Sonata Scarlatti là những "bài kỹ thuật có hồn" tuyệt vời cho người chơi piano trung cấp trở lên. K. 380 ở khoảng chặng 6 (≈ Grade 8, xem Nhà soạn nhạc cho piano); K. 141 khó hơn nhiều vì nốt lặp lại nhanh và bắt chéo tay. Hãy bắt đầu bằng những bản ngắn, chậm như K. 32 (Rê thứ, Aria) hoặc K. 34 (Rê thứ, Larghetto), đồng thời tập nốt hoa mỹ, phối hợp và bắt chéo hai tay và staccato nhẹ. Xem thêm Tác phẩm theo cấp độ.
    moi: Sonata Scarlatti vừa là bài kỹ thuật vừa là nhạc để nghe, hợp với người chơi piano trung cấp trở lên. K. 380 ở khoảng chặng 6 (ABRSM Grade 7 theo trang của Henle, mức 5 trên thang 1–9; xem Nhà soạn nhạc cho piano); K. 141 khó hơn (Henle mức 7) vì nốt lặp lại nhanh và bắt chéo tay. Hãy bắt đầu bằng những bản ngắn, chậm như K. 32 (Rê thứ, Aria) hoặc K. 34 (Rê thứ, Larghetto), đồng thời tập nốt hoa mỹ, phối hợp và bắt chéo hai tay và staccato nhẹ. Xem thêm Tác phẩm theo cấp độ.
    ly_do: "n36, n38: Henle HN 574, HN 1221."
  - cu:
      - 'Bản nhạc: IMSLP (tìm "Scarlatti Keyboard Sonata K.380", "K.141", "K.466").'
      - Ralph Kirkpatrick, Domenico Scarlatti (Princeton University Press, 1953).
      - "Malcolm Boyd, Domenico Scarlatti: Master of Music (1986)."
    moi:
      - 'Bản nhạc: IMSLP (tìm "Scarlatti Keyboard Sonata K.380", "K.141", "K.466"); ảnh chép tay K. 380 (Parma), K. 141 (Worgan), K. 466 (Venice) trên Wikimedia Commons.'
      - "G. Henle Verlag: lời tựa và mức khó của K. 380 (HN 574) và K. 141 (HN 1221)."
      - Cristina Fernandes, "Scarlatti, Domenico", Dizionario Biografico degli Italiani (Treccani).
    ly_do: "n42: mục Nguồn bỏ sách in chưa đọc (Kirkpatrick 1953, Boyd 1986), thay bằng nguồn đã đọc: ảnh chép tay trên Commons, Henle HN 574, HN 1221, Treccani."
