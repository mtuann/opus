    nguon: []
    ket_qua: dung
    ghi_chu: 'Kiểm src/data/tac-pham.yml: tac_gia của mọi bản ghi loai nghe trước bản ghi này (bach, beethoven, bizet, brahms, chopin, debussy, dvorak, gershwin, grieg, handel, haydn, mendelssohn, mozart, mussorgsky, part, puccini, rachmaninoff, ravel, scarlatti, schubert, schumann, shostakovich, stravinsky, tchaikovsky, vivaldi) đều là nam. Trang lich-su/nu-nha-soan-nhac (đã khóa) có mục "Thế kỷ 19" (Hensel, Clara Schumann, Chaminade, Amy Beach); chưa có Backer Grøndahl (việc ngoài phạm vi, báo cáo).'
  - id: n20
    cau: 'Bìa tập Op. 36 ghi lời đề tặng Frithjof Backer Grøndahl.'
    loai: lich-su
    nguon: [ ban-in ]
    ket_qua: dung
    ghi_chu: 'Bìa trong (trang ảnh 3): "Til Frithjof Backer Grøndahl." (chữ nét Gothic). IMSLP để trống Dedication.'
  - id: n21
    cau: 'Frithjof là con trai bà, tên thường viết là Fridtjof.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
