  - id: snl
    bac: 2
    ten: 'Store norske leksikon / Norsk biografisk leksikon, "Agathe Backer Grøndahl" (Cecilie Dahm, Rune J. Andersen; đọc bản JSON của snl.no, 17/11/2026): sinh 1.12.1847 Holmestrand, mất 4.6.1907 Ormøya; "norsk pianist og komponist"; 1857 chuyển tới Christiania (Oslo), Halfdan Kjerulf là thầy, viết các bản nhạc đầu tiên với ông; cha mẹ không muốn con gái theo nghề biểu diễn ("Noen offentlig kunstnerkarriere ønsket imidlertid foreldrene ikke for sin datter"); Kjerulf viết "Gå De Kvindens almindelige Vei … tag så Kunsten med Dem som et herlig Smykke … men forlad ei denne Vej for at blive Concertspillerske"; 1865 tới Berlin, học piano ở học viện của Theodor Kullak; sau đó học với Hans von Bülow ở Firenze và Liszt ở Weimar; "I 1868 debuterte Agathe Backer i Christiania med den da 26 år gamle Edvard Grieg som dirigent" (đoạn sau lại viết "debutkonserten i 1869"); "en rekke konserter i de nordiske land"; năm 1889 Concerto La thứ của Grieg ở London (Philharmonic Society, tháng 3/1889) và ở Hội chợ Thế giới Paris 1889; "fra hun var midt i 30-årene – tiltakende døvhet"; khi mất "på det nærmeste døv"; "250 romanser … rundt 150 klaverstykker"; "48 fantasistykker, op. 36, 39, 45, 55, 63 og 66"; con: Nils Backer Grøndahl (1877–1975), Fridtjof Backer-Grøndahl (1885–1959); "så hun som sin fremste oppgave å føre sønnen Fridtjof frem til debut. Fridtjof Backer-Grøndahl … ble en av våre betydeligste pianister"'
    link: https://snl.no/Agathe_Backer_Gr%C3%B8ndahl
