  - id: n8
    cau: 'Agathe Backer Grøndahl sinh năm 1847 ở Holmestrand.'
    loai: lich-su
    nguon: [ snl, imslp-cat ]
    ket_qua: dung
    ghi_chu: 'SNL: birth_date 1.12.1847, birthplace Holmestrand; "Sine første barneår tilbrakte hun i Holmestrand".'
  - id: n9
    cau: 'Từ năm 1857 bà học với nhà soạn nhạc Halfdan Kjerulf ở Christiania.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "I 1857 flyttet familien til Christiania (Oslo), hvor komponisten Halfdan Kjerulf ble Agathes lærer."'
  - id: n10
    cau: 'Bà sang Berlin học piano ở học viện của Theodor Kullak.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "Agathe kom til Berlin i 1865. Her studerte hun klaver ved Theodor Kullaks klaverakademi".'
  - id: n11
    cau: 'Sau đó bà học thêm với Hans von Bülow và Liszt.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "En anbefaling fra Ole Bull åpnet for videre studier med Hans von Bülow i Firenze og Franz Liszt i Weimar."'
  - id: n12
    cau: 'Cha mẹ không muốn con gái theo nghề biểu diễn, và chính Kjerulf cũng khuyên bà đi "con đường bình thường của phụ nữ", giữ nghệ thuật làm đồ trang sức.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "Noen offentlig kunstnerkarriere ønsket imidlertid foreldrene ikke for sin datter"; Kjerulf: «Gå De Kvindens almindelige Vei … og tag så Kunsten med Dem som et herlig Smykke … men forlad ei denne Vej for at blive Concertspillerske.» Dịch: "Hãy đi con đường bình thường của phụ nữ … mang nghệ thuật theo như một món trang sức đẹp … nhưng đừng rời con đường ấy để thành người chơi hòa nhạc."'
  - id: n13
    cau: 'Bà vẫn ra mắt ở Christiania, với Edvard Grieg chỉ huy dàn nhạc.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "debuterte Agathe Backer i Christiania med den da 26 år gamle Edvard Grieg som dirigent for Det philharmoniske Selskab". Không ghi năm: SNL ghi 1868 ở câu này nhưng "debutkonserten i 1869" ở đoạn sau.'
  - id: n14
    cau: 'Bà biểu diễn khắp Bắc Âu.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "en enestående pianistkarriere med en rekke konserter i de nordiske land"; "en omfattende konsertvirksomhet rundt om i Skandinavia".'
  - id: n15
    cau: 'Năm 1889 bà chơi Concerto La thứ của Grieg ở London và ở Hội chợ Thế giới Paris.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "solist i A-moll-konserten … i London Philharmonic Society i mars 1889"; "Ved verdensutstillingen i Paris 1889 gjorde hun også en innsats for Norge med sin lysende tolkning av Griegs konsert". Link sang nghe-nhac/grieg-concerto (ve-site, n43).'
  - id: n16
    cau: 'Từ giữa tuổi ba mươi bà nghe kém dần; khi mất năm 1907 bà gần như điếc hẳn.'
    loai: lich-su
    nguon: [ snl ]
    ket_qua: dung
    ghi_chu: 'SNL: "fra hun var midt i 30-årene – tiltakende døvhet"; "Da var hun på det nærmeste døv"; mất 4.6.1907.'
