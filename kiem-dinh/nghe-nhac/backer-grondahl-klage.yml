ghi_chu: 'Hướng dẫn nghe mới (tools/them-tac-pham.mjs, 17/11/2026; lộ trình thêm tác phẩm mục 7, hướng dẫn nghe số 2), bản ghi tac-pham/backer-grondahl-klage (loai nghe), tác giả mới nha-soan-nhac/backer-grondahl. Bản nhạc: IMSLP #82783 (PMLP28154-Op._36,_Fantasistykker.pdf, tập 1, 18 trang ảnh), đọc bằng PyMuPDF ở 100 và 300 dpi; Klage ở trang ảnh 4–5 (số trang in 2–3). Bản quét này là bản in của Norsk Musikforlag, Kristiania: bìa trang ảnh 1 "NORSK MUSIKFORLAG KRISTIANIA" (giá "Kr. 2.50", số nhỏ 837/838 dưới giá), bìa trong trang ảnh 3 khung trang trí với logo "Norsk Musik Forlag (Brødr. Hals, Wilh. Hansen, Warmuth)", chân trang nhạc "Norsk Musikforlag, Kristiania. 3837". IMSLP ghi thông tin xuất bản Brødrene Hals, Christiania, n.d.[1895], B.H.M. 838, và in lại "Norsk Musikforlag, n.d. (after 1909), plate 3837". Không dùng #11480 (bản in Norsk Musikforlag 1945 ghi "revised edition"). Bản quét ghi "Kristiania" (tên thành phố trước khi đổi thành Oslo), nên in trước 1925. Cách đếm ô: 20 ô, không có ô lấy đà; trang 2: hệ 1 ô 1–2, hệ 2 ô 3–4, hệ 3 ô 5–6, hệ 4 ô 7–8; trang 3: hệ 1 ô 9–10, hệ 2 ô 11–12, hệ 3 ô 13–14, hệ 4 ô 15–16, hệ 5 ô 17–20. Ký hiệu đọc trên bản in: Andantino. M.M. ♩ = 72, C, một dấu thăng; p dolce ô 1; dấu < > ô 3–4; cresc. ô 7; rit. ô 8; p ô 9; cresc. ô 13; f và Ped. ô 15; Ped. ô 16, 17, 18; dim. ô 17; morendo ô 18–19 (in ở cuối ô 18, sát vạch ô 19), rit. ô 19; fermata trên và dưới hợp âm cuối ô 20. Tay trái nghỉ cả ô 1–4 và ô 9–10 (khuông dưới trống); vào ở ô 5 (từ phách 1) và ở phách 4 ô 11. Tay phải trống ở ô 19–20. Cao độ đọc bằng đường dóng dòng kẻ do máy dò (script ann.py, g.py trong thư mục nháp, đo tổng điểm đen theo hàng). Mốc ::khoi-nghe đo trên bản thu Commons (ogg gốc, 80,93 s): librosa RMS theo giây, onset (hop 256) kèm cao độ tăng mạnh nhất ở CQT; ô 1 bắt đầu 0,94 s (hợp âm Mi–Sol–Si); ô 5: 17,2 s (sau móc kép đi xuống Đô4–Si3–La3 cuối ô 4 ở 16,35–16,83 s; bè trầm Fa♯3 ở 17,51 s); ô 9: 32,9 s (sau quãng lặng 31–32 s, hợp âm Mi–Sol–Si); ô 11 phách 4: 43,17 s (Sol♯3, La3, La♯3, Si3 liên tiếp 43,17–43,83 s); ô 15: khoảng 54,6 s (tay phải hợp âm và móc kép đi xuống, tay trái Đô4 rồi Sol3, Mi3… từ 55,4 s; độ to tăng từ −13 lên −9 dB quanh 52–60 s), làm tròn 55; ô 17: 66,0 s (sau quãng lặng 64–66 s; rải Mi1–Si1–Mi2–Sol2); ô 19: 70,7 s (onset hợp âm trắng đầu ô, CQT trội Sol3, Rê4, Sol4; hợp âm phách 3 ở 72,6 s, phách 4 ở 73,9 s, trội Mi2); ô 20: 76,05 s (Si2–Si3–Fa♯ trội ở CQT). Hai mốc ô 15 và ô 19 sai số khoảng ±1 s. Mốc hinh (độ dài các ô của sơ đồ) dùng cùng ranh giới: 0,9–17,2 (16), 17,2–32,9 (16), 32,9–40,7 (8; ô 11 khoảng 40,7 s, bốn ô trước dài khoảng 3,9 s), 40,7–54,6 (14), 54,6–66 (11, gồm quãng lặng), 66–81 (15). Thuật ngữ đối chiếu thuat-ngu.yml (đã khóa): Andantino, dolce, portato, crescendo, diminuendo, morendo, ritardando, fermata, Ped., dominant (át âm), chromatic, semitone (nửa cung). Không tính là nhận định: tiêu đề mục, tiêu đề cột, câu dẫn, câu hỏi chỉ hỏi, chữ do ::hinh-cau-truc dựng (hồ sơ bản ghi), mốc trong ::khoi-nghe (cách đo ở trên). Ví von ("như một tiếng thở dài", "như một câu hỏi bỏ lửng") là hình ảnh.'
