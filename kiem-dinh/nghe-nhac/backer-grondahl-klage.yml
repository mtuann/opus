khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Ô 1–2, chỉ khuông trên (tay trái nghỉ cả hai ô, nên không vẽ khuông dưới). M:4/4 (bản in C), L:1/16, K:Em (một dấu thăng), Q:1/4=72 (M.M. của bản in). Ấn bản: ban-in tr. 2 hệ 1, đọc ở 300 dpi, đường dóng cao độ theo năm dòng kẻ máy dò (Fa5, Rê5, Si4, Sol4, Mi4). Bè trên (đuôi lên): ô 1: [Mi4 Sol4 Si4] đen | [Sol4 Si4] móc đơn, [Mi4 Sol4 Si4] móc đơn (hai móc đơn một vạch nối, có chấm) | [Mi4 Sol4 Si4 Mi5] đen | [Sol4 Si4] đen; ô 2: [Mi4 La4 Đô5] đen | [La4 Đô5], [Mi4 La4 Đô5] móc đơn có chấm | [Mi4 Sol4 Si4 Mi5] đen | [Sol4 Si4] đen. Luyến: phách 1 tới hết phách 2, phách 3 tới phách 4, mỗi ô. Bè dưới (đuôi xuống, móc kép hai vạch nối): ô 1: Mi4 Rê♯4 Mi4 Fa♯4 | Sol4 Fa♯4 Mi4 Rê♯4 | Mi4 Rê♮4 Đô4 Si3 | Đô4 Đô♯4 Rê4 Rê♯4; ô 2: Mi4 Rê♯4 Mi4 Fa♯4 | Sol4 Fa♯4 Mi4 Rê♯4 | Mi4 Rê♮4 Đô4 Si3 | Đô♯4 Rê♯4 Mi4 Fa♯4. Nốt đầu mỗi phách 1, 3 (và Sol4 phách 2) dùng chung đầu nốt với hợp âm. Dấu hóa: bản in chỉ ghi ♯ ở Rê phách 1 mỗi ô, ♮ ở Rê phách 3, ♯ ở Đô, Rê phách 4; Rê cuối phách 2 không in dấu (Rê♯ còn hiệu lực trong ô), trong abc viết ^D cho chắc khi phát, nên abcjs in thêm dấu thăng nhắc lại; Rê phách 4 ô 1 viết =D (bản in không ghi, Rê♮ còn hiệu lực từ phách 3). p dolce dưới ô 1. Mỗi ô đủ 16 móc kép ở cả hai lớp (khuong-nhac.mjs 0 lỗi).'
