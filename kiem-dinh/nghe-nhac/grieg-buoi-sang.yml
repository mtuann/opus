  - id: n18
    cau: "Màn 4 không diễn ra ở Na Uy mà ở Bắc Phi: bờ biển Ma-rốc, sa mạc Sahara, rồi Ai Cập."
    loai: lich-su
    nguon:
      - archer
      - audite
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bình minh lên, nhưng không phải ở Na Uy — mà trên sa mạc Ma-rốc". Archer màn 4: bờ biển Ma-rốc, sa mạc, Cairo; audite: "occurs not at a Norwegian fjord but on the coast of Morocco". Viết lại theo màn kịch (xem n19, n20). Review D6-L11-gom: lượt 2 sai: câu viết như thể cả màn chỉ ở Ma-rốc và Sahara, mà các cảnh cuối màn 4 ở Ai Cập (tượng Memnon, Sphinx ở Gizeh, nhà thương điên ở Cairo; văn bản Ibsen ở ibsen.uio.no). Bản dịch Archer của lượt 1 cũng ghi "a madhouse at Cairo". Sửa trang theo câu đúng của lượt 2 ("…mà ở Bắc Phi: bờ biển Ma-rốc, sa mạc Sahara, rồi Ai Cập."). Chữ mới là câu đúng của lượt 2, không chạy lại. Chữ câu trước review: "Màn 4 không diễn ra ở Na Uy mà ở Ma-rốc và sa mạc Sahara."'
    luot_2: sai
    luot_2_nguon: [ "https://www.ibsen.uio.no/DRVIT_PG%7CPGht.xhtml", "https://www.hollywoodbowl.com/musicdb/pieces/2684/peer-gynt-suite-no-1-op-46" ]
    luot_2_ghi_chu: "câu đúng: Màn 4 không diễn ra ở Na Uy mà ở Bắc Phi: bờ biển Ma-rốc, sa mạc Sahara, rồi Ai Cập.; Văn bản Ibsen: màn 4 ở bờ biển Ma-rốc, trại quân Ma-rốc 'paa Grænsen mod Ørken', sa mạc, ốc đảo; Sahara được nhắc tên; nhưng các cảnh cuối màn 4 ở Ai Cập (Memnon, Sphinx ở Gizeh, nhà thương điên ở Cairo). Câu viết như thể cả màn chỉ ở Ma-rốc và Sahara. Ý chính (không ở Na Uy, mà ở Bắc Phi) đúng."
    review: dung
  - id: n19
    cau: Ở đầu màn 4, Peer bị bạn đồng hành cướp mất du thuyền, bỏ lại một mình trên bờ biển; rạng sáng hôm sau anh ngồi trên cây, cầm cành gãy đuổi lũ khỉ.
    loai: lich-su
    nguon:
      - archer
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nơi Peer bị bạn đồng hành bỏ lại một mình, phải ngồi trên cây dùng cành cây đuổi lũ khỉ!" (gắn cảnh cây với chính khúc dạo đầu). Archer: cảnh 1–2 bạn đồng hành lấy du thuyền; cảnh 4 "Daybreak … in his tree with a broken branch … beat off a swarm of monkeys". Tách thành chuỗi sự việc của màn 4. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ibsen.uio.no/DRVIT_PG%7CPGht.xhtml" ]
    luot_2_ghi_chu: "Văn bản Ibsen: các bạn đồng hành chiếm du thuyền ('Jeg annekterer Yachten!') bỏ Peer lại; cảnh sau: 'Daggry … Peer Gynt i Træet med en afbrukken Gren i Haanden holder sig en Sværm Abekatte fra Livet'."
    review: dung
  - id: n20
    cau: 'Một ghi chú dán trong bản tổng phổ dùng cho màn 4 cho biết bản nhạc lúc đầu được viết để mở cảnh "Sáng sớm" của màn 4: một vùng núi đá nhìn ra sa mạc.'
    loai: lich-su
    nguon:
      - nb-score
      - archer
      - gga-18
    ket_qua: da-sua
    ghi_chu: 'Câu mới. Ghi chú dán trong tổng phổ màn 4 (Mus.ms. 6900, Thư viện Quốc gia Na Uy): "Ursprünglich als Einleitung zur fünften Szene dieses Aktes: „Früher Morgen“ komponiert"; Archer cảnh 5: "Early morning. A stony region, with a view out over the desert". Không rõ ai viết ghi chú (chữ tay trên bản in). Review D6-L11-gom: lượt 2 dung, ghi nguồn của lượt 2 là lời bình hiệu đính của Grieg Gesamtausgabe tập 18 (tr. 312: ở buổi công diễn 1876, bốn cảnh đầu màn 4 bị bỏ nên cảnh 5 "Sáng sớm" mở màn, và Morning Mood được viết làm khúc dạo cho cảnh này), không phải ghi chú của Grieg trên tổng phổ. Nguồn của lượt 1 là ghi chú dán trên bản tổng phổ màn 4 (Mus.ms. 6900), không rõ ai viết. Hai nguồn nói cùng một điều. Trang ghi rõ đó là "một ghi chú dán trong bản tổng phổ dùng cho màn 4" (không nói Grieg viết ghi chú); thêm nguồn gga-18 của lượt 2. Không chạy lại. Chữ câu trước review: "Ghi chú trong tổng phổ cho biết bản nhạc lúc đầu được viết để mở cảnh "Sáng sớm" của màn 4: một vùng núi đá nhìn ra sa mạc." (trang: "Ghi chú trong tổng phổ cho biết Grieg viết…").'
    luot_2: dung
    luot_2_nguon: [ "https://www.nb.no/items/URN:NBN:no-nb_digibok_2012032138022", "https://www.ibsen.uio.no/DRVIT_PG%7CPGht.xhtml" ]
    luot_2_ghi_chu: "Lời bình hiệu đính GGA tập 18 (tr. 312, phần 13 Morning Mood): ở buổi công diễn 1876, bốn cảnh đầu màn 4 bị bỏ nên cảnh 5 'Early Morning' mở màn; Morning Mood được viết làm khúc dạo cho cảnh này. Văn bản Ibsen, cảnh ấy: 'Tidlig Morgen. Stenet Egn med Udsigt ind over Ørken'. Lưu ý: đây là lời bình trong ấn bản tổng phổ phê bình, không phải ghi chú của Grieg trên bản nhạc."
    review: dung
  - id: n21
    cau: '(Đã bỏ) Gần như ai nghe cũng tưởng đây là buổi sáng ở một vùng quê Na Uy: mặt hồ phẳng lặng, sương tan trên rừng thông.'
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Vậy mà gần như ai nghe cũng tưởng đây là buổi sáng ở một vùng quê Na Uy: mặt hồ phẳng lặng, sương tan trên rừng thông. Lý do nằm ở giai điệu: … nghe mộc mạc, "đồng quê" một cách chung chung chứ không gắn với nơi chốn cụ thể nào." Nhận định về cảm nhận của "gần như ai nghe" không kiểm được; bỏ. Câu hỏi cuối trang vẫn mời người đọc tự so sánh. Review D6-L11-gom: giữ bỏ. Câu nói về cảm nhận của "gần như ai nghe", hai lượt đều không có nguồn; trang không còn chữ "gần như ai nghe", "rừng thông".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã ghi '(Đã bỏ)'; là nhận định về cảm nhận chung của người nghe, không có nguồn bậc 2 để kiểm. Giữ việc bỏ câu.
    review: dung
