ghi_chu: 'Hướng dẫn nghe "Buổi sáng" (Morgenstemning), Peer Gynt (tầng Tác phẩm; bản ghi tac-pham/grieg-buoi-sang; loai: nghe là cấu trúc). Không có khối abc, không có ::hinh-cau-truc (bảng Sơ đồ cấu trúc viết tay, kiểm ở đây). ::khoi-nghe không có bản thu (không sửa). Bản nhạc: tổng phổ màn 4 trong Mus.ms. 6900 của Thư viện Quốc gia Na Uy (bản in Edition Peters 7188 của Suite I dùng làm khúc dạo đầu màn 4, có chữ tay), đọc ảnh IIIF (giấy phép CC BY-NC-ND của thư viện: chỉ đọc, không chép hình); bản piano của tác giả (Schirmer) trên Internet Archive để đối chiếu giọng, nhịp. Phát hiện mới: ghi chú dán trong tổng phổ nói bản nhạc lúc đầu viết để mở cảnh 5 "Sáng sớm" của màn 4 (vùng núi đá nhìn ra sa mạc), không phải cảnh Peer trên cây (cảnh 4). Sửa trang: n3, n13–n15, n17–n23, n26, n27, n29, n30, n32, n33, n35–n38, n40, n42, n44; bỏ n21. Câu ở hồ sơ khác trỏ tới trang này: nghe-nhac/grieg-concerto n14 (hướng dẫn nghe Buổi sáng ở đường dẫn này): vẫn đúng. Thuật ngữ chưa có trong thuat-ngu.yml: nhạc sân khấu (incidental music), khúc dạo đầu (prelude), pastorale (trill, cantabile, Allegretto đã có).'
