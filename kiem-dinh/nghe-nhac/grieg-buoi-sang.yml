doi_chu:
  - cu: Cao trào đến sớm ngay ở đoạn đầu, thay vì dồn về cuối như nhiều bản nhạc khác — cảm giác của bạn khác đi thế nào?
    moi: Lần đầu cả dàn nhạc chơi to đến khá sớm, ngay ở phần đầu bản nhạc — cảm giác của bạn thế nào?
    ly_do: 'n40: theo n26.'
  - cu: Biết cảnh trong kịch là sa mạc Ma-rốc chứ không phải Na Uy, bạn có nghe bản nhạc khác đi không? Vì sao âm nhạc lại "đánh lừa" được tai người nghe như vậy?
    moi: Biết màn kịch diễn ra ở Ma-rốc chứ không phải Na Uy, bạn có nghe bản nhạc khác đi không?
    ly_do: 'n42: theo n18, n21.'
  - cu: 1875; công diễn cùng vở kịch ngày 24/2/1876 tại Christiania (nay là Oslo)
    moi: 1874–1875; công diễn cùng vở kịch ngày 24/2/1876 tại Christiania (nay là Oslo)
    ly_do: 'n3: COD, IMSLP (1874–75).'
  - cu:
      - 'Edvard Grieg (1843–1907) là nhà soạn nhạc nổi tiếng nhất của Na Uy, cùng thời với Tchaikovsky và Brahms. Ông viết Peer Gynt theo lời mời của nhà viết kịch Henrik Ibsen: Ibsen cần nhạc cho vở kịch thơ cùng tên, Grieg sáng tác năm 1875, và vở diễn ra mắt năm 1876. Sau đó Grieg rút những đoạn hay nhất thành hai tổ khúc hòa nhạc (Op. 46 và Op. 55) — "Buổi sáng" là bản mở đầu tổ khúc thứ nhất. (Xem chân dung Grieg.)'
      - 'Peer Gynt kể chuyện một chàng trai Na Uy phiêu lưu khắp thế giới, từ quê nhà đến tận Bắc Phi. "Buổi sáng" là nhạc mở màn 4: bình minh lên, nhưng không phải ở Na Uy — mà trên sa mạc Ma-rốc, nơi Peer bị bạn đồng hành bỏ lại một mình, phải ngồi trên cây dùng cành cây đuổi lũ khỉ!'
      - 'Vậy mà gần như ai nghe cũng tưởng đây là buổi sáng ở một vùng quê Na Uy: mặt hồ phẳng lặng, sương tan trên rừng thông. Lý do nằm ở giai điệu: nó chỉ dùng gam ngũ cung (5 nốt, xem bài 16), nghe mộc mạc, "đồng quê" một cách chung chung chứ không gắn với nơi chốn cụ thể nào.'
      - 'Khi nghe, hãy để ý hai điều: giai điệu được sáo và oboe chuyền tay nhau lúc mở đầu, và cao trào đến rất sớm — ngay lần đầu dàn nhạc chơi to (forte), tượng trưng cho khoảnh khắc mặt trời ló dạng — chứ không dồn về cuối như thường lệ.'
    moi:
      - 'Edvard Grieg (1843–1907) là nhà soạn nhạc nổi tiếng nhất của Na Uy, cùng thời với Tchaikovsky và Brahms. Ông viết Peer Gynt theo lời mời của nhà viết kịch Henrik Ibsen: Ibsen cần nhạc cho vở kịch thơ cùng tên, Grieg sáng tác trong hai năm 1874–1875, và vở diễn ra mắt năm 1876. Sau đó Grieg chọn một số đoạn, soạn thành hai tổ khúc hòa nhạc (Op. 46 và Op. 55) — "Buổi sáng" là bản mở đầu tổ khúc thứ nhất. (Xem chân dung Grieg.)'
      - 'Peer Gynt kể chuyện một chàng trai Na Uy phiêu lưu khắp thế giới, từ quê nhà đến tận Bắc Phi. "Buổi sáng" là khúc dạo đầu của màn 4, và màn này không diễn ra ở Na Uy — mà ở Bắc Phi: bờ biển Ma-rốc, sa mạc Sahara, rồi Ai Cập. Ở đầu màn, Peer bị bạn đồng hành cướp mất du thuyền, bỏ lại một mình trên bờ biển; rạng sáng hôm sau anh phải ngồi trên cây, cầm cành gãy đuổi lũ khỉ! Một ghi chú dán trong bản tổng phổ dùng cho màn 4 cho biết Grieg viết bản nhạc này lúc đầu để mở cảnh "Sáng sớm" của màn 4: một vùng núi đá nhìn ra sa mạc.'
      - 'Câu giai điệu mở đầu chỉ dùng các nốt của gam ngũ cung (5 nốt, xem bài 16), và Grieg ghi tốc độ Allegretto pastorale: hơi nhanh, kiểu đồng quê.'
      - 'Khi nghe, hãy để ý hai điều: giai điệu được sáo và oboe chuyền tay nhau lúc mở đầu, và lần đầu cả dàn nhạc chơi to (forte) đến khá sớm, ngay ở phần đầu bản nhạc.'
    ly_do: 'n13, n14, n15, n17–n23, n26: COD, IMSLP, audite, OMI, bản dịch Archer, tổng phổ màn 4 (Thư viện Quốc gia Na Uy). Review D6-L11-gom: n18 theo câu đúng của lượt 2 (Bắc Phi: Ma-rốc, Sahara, rồi Ai Cập; văn bản Ibsen); n20 ghi rõ ghi chú là chữ dán trong bản tổng phổ dùng cho màn 4.'
