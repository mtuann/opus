    cau: Lần đầu cả dàn nhạc chơi to (forte) đến khá sớm, ngay ở phần đầu bản nhạc.
    loai: cau-truc
    nguon: *id001
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cao trào đến rất sớm — ngay lần đầu dàn nhạc chơi to (forte), tượng trưng cho khoảnh khắc mặt trời ló dạng — chứ không dồn về cuối như thường lệ". Tổng phổ: chữ A (tr. 6, khoảng ô 21 trên khoảng 90 ô) tutti f, più f, chữ B ff, rồi p. Nhưng đoạn giữa còn ff ở chữ C và D (tr. 8–10), nên gọi chữ A là "cao trào" duy nhất không đúng; bỏ "tượng trưng cho … mặt trời" (không có nguồn) và "như thường lệ" (khái quát). Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
