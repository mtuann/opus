doi_chu:
  - cu: 'mô tả: Handel (1685–1759) là nhà soạn nhạc người Đức thành danh ở London. Ông nổi tiếng trước hết với các opera tiếng Ý hoành tráng, nhưng khi khán giả London chán…'
    moi: 'mô tả: Handel (1685–1759) là nhà soạn nhạc sinh ở Đức, sống và thành danh ở London. Ông viết opera tiếng Ý suốt nhiều năm, nhưng khi opera Ý ở London bớt được ưa chuộng…'
    ly_do: 'Mô tả trang (description): n9, n10; COD (Handel).'
  - cu:
      - 'Hợp xướng "Hallelujah" (số 44), kết thúc Phần II của oratorio Messiah, HWV 56'
      - '22/8–14/9/1741 (chỉ 24 ngày); công diễn 13/4/1742 tại Dublin'
      - 'Hợp xướng bốn bè và dàn nhạc Baroque'
    moi:
      - 'Hợp xướng "Hallelujah" (số 44 theo cách đánh số thường gặp; có ấn bản đánh số 39), kết thúc Phần II của oratorio Messiah, HWV 56'
      - 'Phần lớn viết trong khoảng 22/8–14/9/1741 (24 ngày); công diễn 13/4/1742 tại Dublin'
      - 'Hợp xướng bốn bè và dàn nhạc Baroque (trumpet, timpani, đàn dây, continuo)'
    ly_do: 'Bảng đầu trang: n2 (IMSLP, MusicBrainz), n3 (Thư viện Anh, COD), n7 (Mutopia).'
  - cu: 'Handel (1685–1759) là nhà soạn nhạc người Đức thành danh ở London. Ông nổi tiếng trước hết với các opera tiếng Ý hoành tráng, nhưng khi khán giả London chán opera, ông chuyển sang một thể loại mới: oratorio — vở nhạc kịch tôn giáo không dàn dựng, không phục trang, hát bằng tiếng Anh, chỉ có ca sĩ, hợp xướng và dàn nhạc. Messiah là oratorio nổi tiếng nhất của ông, và cũng là tác phẩm hợp xướng nổi tiếng nhất thời Baroque.'
    moi: 'Handel (1685–1759) là nhà soạn nhạc sinh ở Đức, sống và thành danh ở London. Ông viết opera tiếng Ý suốt nhiều năm, nhưng khi opera Ý ở London bớt được ưa chuộng, ông chuyển dần sang oratorio: tác phẩm tôn giáo có tính kịch cho ca sĩ, hợp xướng và dàn nhạc, thường diễn không dàn dựng, không phục trang. Messiah, hát bằng tiếng Anh, là tác phẩm làm tên tuổi ông được biết khắp thế giới, và là oratorio phổ biến nhất.'
    ly_do: 'n9–n13: COD (Handel, oratorio), IMSLP.'
  - cu: 'Mùa hè năm 1741, Handel đang nợ nần và tưởng sự nghiệp đã hết. Người bạn Charles Jennens đưa cho ông một tập lời trích toàn từ Kinh Thánh, kể về Đấng Cứu Thế: lời tiên tri và giáng sinh (Phần I), chịu nạn – phục sinh – thăng thiên (Phần II), và sự sống đời đời (Phần III). Handel viết xong toàn bộ bản nhạc 260 trang trong 24 ngày (22/8–14/9/1741). Tác phẩm công diễn lần đầu ngày 13/4/1742 tại Dublin, trong một buổi hòa nhạc từ thiện.'
    moi: 'Lời do Charles Jennens chọn từ Kinh Thánh, kể về Đấng Cứu Thế: lời tiên tri và giáng sinh (Phần I), chịu nạn, phục sinh, thăng thiên và lời rao giảng lan ra (Phần II), sự sống lại của người chết và chiến thắng cái chết (Phần III). Theo ngày Handel ghi trên bản viết tay, ông viết phần lớn bản nhạc trong khoảng 24 ngày (22/8–14/9/1741). Tác phẩm công diễn lần đầu ngày 13/4/1742 tại Dublin.'
    ly_do: 'n14 (bỏ), n15, n16 (lời trong Mutopia), n17 (Thư viện Anh), n18 (bỏ).'
  - cu: '"Hallelujah" là hợp xướng kết thúc Phần II (số 44) — khúc khải hoàn sau khi câu chuyện đã đi qua đau khổ đến chiến thắng. Cả bài chỉ xoay quanh vài câu Kinh Thánh ngắn, nhưng Handel biến chúng thành 3–4 phút âm nhạc dồn dập, với giọng Rê trưởng rực rỡ cùng trumpet và timpani — bộ đôi "âm thanh chiến thắng" của thời Baroque (kèn trumpet Baroque chơi hay nhất ở giọng Rê).'
    moi: '"Hallelujah" là hợp xướng kết thúc Phần II (số 44): khúc khải hoàn sau khi câu chuyện đã đi qua đau khổ đến chiến thắng. Cả bài chỉ dùng ba câu ngắn trong sách Khải Huyền, nhưng Handel biến chúng thành 3–4 phút âm nhạc dồn dập, ở giọng Rê trưởng cùng trumpet và timpani, bộ đôi thời ấy hay dùng cho dịp lễ hội.'
    ly_do: 'n20 (Mutopia, KJV), n21 (Bärenreiter).'
  - cu: 'Một truyền thống thú vị: ở nhiều nơi, khán giả đứng dậy khi hợp xướng này vang lên. Người ta hay kể rằng vua George II đã đứng lên vì quá xúc động trong buổi diễn ở London, và cả khán phòng đứng theo. Đây chỉ là giai thoại chưa được xác minh — không có bằng chứng đương thời nào cho thấy nhà vua có mặt hôm đó — nhưng truyền thống đứng dậy thì có thật đến ngày nay.'
    moi: 'Một truyền thống thú vị: ở Anh, khán giả đôi khi vẫn đứng dậy khi hợp xướng này vang lên. Chuyện thường được kể là ở một buổi diễn tại London năm 1743, cả khán phòng, dẫn đầu là vua George II, đã đứng dậy khi hợp xướng bắt đầu và đứng tới hết.'
    ly_do: 'n22: COD (Hallelujah Chorus); vế "chưa xác minh" chỉ có nguồn bậc 3.'
