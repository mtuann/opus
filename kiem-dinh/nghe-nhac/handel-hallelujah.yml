    luot_2: dung
    luot_2_nguon: [ "https://bible-api.com/revelation+19?translation=kjv", "https://bible-api.com/revelation+11?translation=kjv", "https://searcharchives.bl.uk/catalog/040-001948673", "https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip" ]
    luot_2_ghi_chu: "KJV Khải Huyền 19:6 '…Alleluia: for the Lord God omnipotent reigneth'; 11:15 '…The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever'; 19:16 'KING OF KINGS, AND LORD OF LORDS'. Lời trong bản HG (lyrics1.ily, BWchorus) gồm đúng ba đoạn này. Thư viện Anh ghi lời của Charles Jennens 'after texts from the Bible'."
