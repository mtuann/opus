    cau: 'Bảng: Giọng Rê trưởng, có trumpet và timpani.'
    loai: cau-truc
    nguon: [ mutopia-messiah ]
    ket_qua: dung
    ghi_chu: 'global.ily \key re \major; score.ily có "Tromba I II" và "Tympani".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip" ]
    luot_2_ghi_chu: "Bản Händel-Gesellschaft (Chrysander 1902) trên Mutopia, thư mục BWchorus: global.ily ghi '\\key re \\major', tempo Allegro; score.ily có hàng 'Tromba I II' và 'Tympani'."
  - id: n7
    cau: 'Bảng: Lực lượng: hợp xướng bốn bè và dàn nhạc Baroque (trumpet, timpani, đàn dây, continuo).'
    loai: cau-truc
    nguon: [ mutopia-messiah, imslp-messiah ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ không có phần trong ngoặc. Tổng phổ HG số này: hai trumpet, timpani, violin 1, 2, viola, bốn bè Canto, Alto, Tenore, Basso, Bassi có số hầm (continuo). IMSLP còn ghi oboe, bassoon cho cả tác phẩm (bè đôi theo đàn dây, không có dòng riêng trong HG): chỉ liệt kê điều thấy trên tổng phổ. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip", "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)" ]
    luot_2_ghi_chu: "score.ily (bản HG): Tromba I II, Tympani, Violino I, II, Viola, hợp xướng Canto, Alto, Tenore, Basso, và Bassi có số hầm (continuo). IMSLP ghi thêm 2 (hay 4) oboe và bassoon; bản Carus của Hallelujah ghi 2 oboe. Danh sách trong ngoặc của câu không nêu oboe, nhưng câu không nói là đủ."
    review: dung
  - id: n8
    cau: 'Bảng và đoạn văn: dài khoảng 3–4 phút.'
    loai: so-lieu
    nguon: [ mb-hallelujah ]
    ket_qua: dung
    ghi_chu: 'MusicBrainz: 3:22 (Christie) đến 4:00 (Pinnock). Review D6-L9-gom: giữ "khoảng 3–4 phút". Các bản thu thương mại trên MusicBrainz (lượt 1) dài 3:22–4:00; lượt 2 ước tính theo bản nhạc khoảng 3:20. Ba tệp IMSLP dài hơn 4:30 là độ dài tệp (lượt 2 ghi có thể gồm khoảng lặng, tiếng vỗ tay), không phải độ dài bản nhạc. Không sửa.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)" ]
    luot_2_ghi_chu: "Sáu bản thu Hallelujah trên IMSLP dài 3:21, 3:37, 3:56, 4:39, 4:41 và 4:46 (độ dài của tệp, có thể có cả khoảng lặng hay tiếng vỗ tay). Ba bản dài hơn 4 phút rưỡi. Ước tính theo bản nhạc: 94 ô 4/4, ở tốc độ MIDI 112 của bản Mutopia, khoảng 3 phút 20 giây. Nói 'khoảng 3–4 phút' thì hơi hẹp; an toàn hơn: 'khoảng 3½–4½ phút' hay 'khoảng bốn phút'."
    review: dung
  - id: n9
    cau: 'Handel là nhà soạn nhạc sinh ở Đức, sống và thành danh ở London.'
    loai: lich-su
    nguon: [ cod-handel ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhà soạn nhạc người Đức thành danh ở London". COD: "Ger.-born composer … (Eng. cit. 1726)", định cư hẳn ở London: viết "sinh ở Đức" cho đúng (ông nhập quốc tịch Anh). Cả mô tả trang. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://handelhendrix.org/discover/learn-about-handel" ]
    luot_2_ghi_chu: "Handel House: sinh ở Halle, Saxony; sống phần đời còn lại ở Anh, nhập quốc tịch Anh năm 1727, ở nhà Brook Street, London từ 1723 tới khi mất; thành công ngay với Rinaldo (1711) ở London."
    review: dung
  - id: n10
    cau: 'Ông viết opera tiếng Ý suốt nhiều năm, nhưng khi opera Ý ở London bớt được ưa chuộng, ông chuyển dần sang oratorio.'
    loai: lich-su
    nguon: [ cod-handel ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ông nổi tiếng trước hết với các opera tiếng Ý hoành tráng, nhưng khi khán giả London chán opera, ông chuyển sang một thể loại mới: oratorio". COD: 35 năm với opera ở London, "recognized that the popularity of It. opera was declining and began, somewhat unwillingly, to develop the genre of dramatic oratorios", và vẫn viết opera tới 1740 (nên "chuyển dần"). Oratorio không phải thể loại mới (COD oratorio: có từ giữa thế kỷ 16): bỏ "thể loại mới", bỏ "hoành tráng". Cả mô tả trang. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://handelhendrix.org/discover/learn-about-handel" ]
    luot_2_ghi_chu: "Handel House: viết khoảng 31 vở opera cho sân khấu London (công ty opera Ý Royal Academy of Music…); 'In the early 1740s, with public interest in Italian opera waning, Handel began to introduce new oratorios…'."
    review: dung
  - id: n11
    cau: 'Oratorio: tác phẩm tôn giáo có tính kịch cho ca sĩ, hợp xướng và dàn nhạc, thường diễn không dàn dựng, không phục trang.'
    loai: dinh-nghia
    nguon: [ cod-oratorio ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vở nhạc kịch tôn giáo không dàn dựng, không phục trang, hát bằng tiếng Anh, chỉ có ca sĩ, hợp xướng và dàn nhạc". COD: "religious lib. for solo singers, ch., and orch., in dramatic form but usually perf. without scenery or costumes" (thường, không phải luôn: oratorio đầu tiên diễn có phục trang); "hát bằng tiếng Anh" không thuộc định nghĩa (oratorio Ý, Đức), chuyển sang nói về Messiah (n12). Khớp thuat-ngu.yml oratorio (đã khóa): "thường biểu diễn không bối cảnh, không phục trang". Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2026/https://www.britannica.com/art/oratorio", "https://handelhendrix.org/discover/learn-about-handel" ]
    luot_2_ghi_chu: "Britannica (bản lưu Wayback, vì Britannica chặn công cụ): 'a large-scale musical composition on a sacred or semisacred subject, for solo voices, chorus, and orchestra… A basically dramatic method is used… may or may not be produced with theatrical action'. Handel House: oratorio của Handel 'without costumes, sets or staging'."
    review: dung
  - id: n12
    cau: 'Messiah hát bằng tiếng Anh.'
    loai: lich-su
    nguon: [ imslp-messiah ]
    ket_qua: dung
