  - id: imslp-messiah
    bac: 2
    ten: 'IMSLP, Messiah, HWV 56 (wikitext): "Chorus: Hallelujah (Part II, No.44)"; "3 parts"; "Year/Date of Composition=1741-09-14 (end date)"; "First Performance=1742-04-13 in Dublin. Neal''s Music Hall, Fishamble Street"; "Librettist=Charles Jennens"; "Language=English"; "Piece Style=Baroque"; InstrDetail: oboes, [bassoons], trumpets, timpani, strings, continuo'
    link: https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)
  - id: bl-messiah
    bac: 2
    ten: 'British Library, R.M.20.f.2 (bản viết tay Messiah): "in which he set words by Charles Jennens after texts from the Bible. According to the dates added by Handel to the manuscript, the music was largely written between 22 August and 14 September 1741"; "ff. 100-106. Hallelujah chorus"; "1 volume (i + 140 folios)"'
    link: https://searcharchives.bl.uk/catalog/040-001948673
  - id: cod-messiah
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "Messiah": "Oratorio by Handel to lib. selected from scriptures by Charles Jennens. Comp. between 22 Aug. and 14 Sept. 1741, though parts are adaptations from other works by Handel. F.p. Dublin, 13 April 1742; London, 23 March 1743"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/messiah
  - id: cod-hallelujah
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "Hallelujah Chorus": "that which closes Part II of Handel''s Messiah. At one of the 3 London perfs. in CG Th. in 1743, the whole assembly, led by George II, rose to its feet as the ch. opened, and remained standing to the end, thus establishing a tradition which is sometimes still maintained by Brit. audiences."'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/hallelujah-chorus
  - id: cod-oratorio
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "oratorio": "a mus. setting of a religious lib. for solo singers, ch., and orch., in dramatic form but usually perf. without scenery or costumes … The form originated in plays given in the Oratory of S. Philip Neri, Rome, in the mid-16th cent. … Handel (esp. Messiah, the most popular of all oratorios)"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/oratorio
  - id: cod-handel
    bac: 2
    ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "Handel, George Frideric": "(b Halle, 1685; d London, 1759). Ger.-born composer and organist (Eng. cit. 1726)"; "For the next 35 years Handel was immersed in the ups and downs of operatic activity in London"; "he recognized that the popularity of It. opera was declining and began, somewhat unwillingly, to develop the genre of dramatic oratorios"; "Messiah, prod. Dublin, 1742. By this work his name is known throughout the world"'
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/handel-george-frideric
  - id: bnf-handel
    bac: 2
    ten: 'data.bnf.fr, Georg Friedrich Händel (1685-1759)'
    link: https://data.bnf.fr/ark:/12148/cb139873218
  - id: kjv
    bac: 2
    ten: 'Kinh Thánh bản King James (bible-api.com, translation=kjv): Khải Huyền 19:6 "Alleluia: for the Lord God omnipotent reigneth"; 11:15 "The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever"; 19:16 "KING OF KINGS, AND LORD OF LORDS"'
    link: https://bible-api.com/revelation+11:15?translation=kjv
  - id: ba-tp194
    bac: 2
    ten: 'Bärenreiter TP 194 (Bach BWV 1068), lời tựa: phần trumpet và timpani "so popular for festive or open air occasions"'
    link: https://www.barenreiter.co.uk/prefaces/9790006201631.pdf
  - id: mb-hallelujah
    bac: 2
    ten: 'MusicBrainz, bản thu Hallelujah: Pinnock 3:55 và 4:00 ("Part II: XLIV."), Hogwood 3:49 ("Part 2, no. 44"), Gardiner 3:49 ("Part II, 39."), Christie 3:22 và 3:34 ("XXXIX."), Suzuki 3:47 ("XXXIX.")'
    link: https://musicbrainz.org/recording/47114d22-67f0-4454-be90-a1aa8878c90a
nhan_dinh:
  - id: n1
    cau: 'Handel (1685–1759) (bảng và đoạn đầu).'
