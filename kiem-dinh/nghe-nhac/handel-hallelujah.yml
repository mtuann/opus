      - '"for the Lord God omnipotent reigneth": các bè hát cùng một giai điệu trước, rồi tách ra đuổi nhau, tiếng "Hallelujah" xen vào giữa'
      - '"The kingdom of this world is become…": nhạc chùng xuống, bốn bè hát cùng nhịp bằng nốt dài, như một bài thánh ca'
      - '"and He shall reign for ever and ever": bè bass cất lên chủ đề mở bằng một bước nhảy quãng lớn, rồi tenor, alto, soprano lần lượt đuổi theo; đây là đoạn fugue (xem Fugue)'
      - '"King of kings, and Lord of Lords": soprano (cùng trumpet) giữ một nốt dài, rồi mỗi lần lên cao hơn một bậc, các bè khác đáp "for ever and ever, Hallelujah"'
      - 'Đột ngột im lặng hai phách, rồi một tiếng "Hallelujah" cuối cùng bằng nốt dài khép lại'
    ly_do: 'Bảng Theo dõi khi nghe, n29: Mutopia.'
  - cu: 'Truyền thống khán giả đứng dậy khi nghe đoạn này: theo bạn, điều gì trong âm nhạc khiến người ta muốn đứng lên? (Xem Baroque để hiểu vì sao trumpet và timpani gắn với chiến thắng.)'
    moi: 'Truyền thống khán giả đứng dậy khi nghe đoạn này: theo bạn, điều gì trong âm nhạc khiến người ta muốn đứng lên? (Xem Baroque về kèn trumpet chưa có van của thời ấy.)'
    ly_do: 'n32: trang Baroque (đã khóa) nói về trumpet chưa có van, không nói về chiến thắng.'
  - cu: 'Tổng phổ: IMSLP (tìm "Handel HWV 56").'
    moi:
      - 'Bản nhạc: Mutopia Project, Messiah (theo ấn bản Händel-Gesellschaft của Chrysander, 1902); số thứ tự, buổi công diễn đầu trên IMSLP.'
      - 'Bản viết tay và ngày sáng tác: Thư viện Anh, R.M.20.f.2.'
      - 'The Concise Oxford Dictionary of Music, các mục Messiah, Hallelujah Chorus, oratorio, Handel.'
    ly_do: 'n35: nguồn đã đọc.'
