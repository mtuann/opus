    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", "https://www.historyireland.com/volume-23/rejection-and-rehabilitation-why-handels-messiah-was-premiered-in-dublin/" ]
    luot_2_ghi_chu: "IMSLP: 'First Performance 1742-04-13 in Dublin. Neal's Music Hall, Fishamble Street'. History Ireland cũng ghi buổi sáng ngày 13/4/1742 ở Fishamble Street, Dublin."
