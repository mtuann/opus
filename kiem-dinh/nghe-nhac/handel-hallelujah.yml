  - id: n2
    cau: 'Bảng: Hợp xướng "Hallelujah" là số 44 theo cách đánh số thường gặp (có ấn bản đánh số 39), kết thúc Phần II của oratorio Messiah, HWV 56.'
    loai: danh-muc
    nguon: [ imslp-messiah, cod-hallelujah, mb-hallelujah ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(số 44)". IMSLP "Chorus: Hallelujah (Part II, No.44)"; COD "closes Part II"; bản thu Pinnock, Hogwood ghi 44, Gardiner, Christie, Suzuki ghi 39 (hồ sơ bản ghi D2-0 cũng ghi Carus đánh số 39). Thêm vế "có ấn bản đánh số 39" vì số tùy ấn bản. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", "https://www.barenreiter.co.uk/prefaces/9790006565313.pdf", "https://musikalienhandel.de/noten/gemischter-chor-(satb)-2-oboe-streicher-orgel-(gch-(satb)-2-ob-str-org)/hallelujah-aus-messias-hwv-56--CARUS+55501-00-probepartitur.pdf" ]
    luot_2_ghi_chu: "Mục bản thu trên IMSLP ghi 'Chorus: Hallelujah (Part II, No.44)', theo cách đánh số Prout/Novello. Mục lục bản Bärenreiter (Tobin, HHA) ghi '39. Chorus Hallelujah', là số cuối của Phần II (Phần III bắt đầu bằng số 40). Bản Carus ghi 'HWV 56, Nr. 39'. Danh sách chương mục trên IMSLP còn dùng số 42, và một danh sách khác dùng số 40, nên câu 'cách đánh số thường gặp' là hợp lý chứ không phải duy nhất."
    review: dung
