  - id: n22
    cau: 'Ở Anh, khán giả đôi khi vẫn đứng dậy khi hợp xướng này vang lên; chuyện thường được kể là ở một buổi diễn tại London năm 1743, cả khán phòng, dẫn đầu là vua George II, đã đứng dậy khi hợp xướng bắt đầu và đứng tới hết.'
    loai: lich-su
    nguon: [ cod-hallelujah ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ở nhiều nơi, khán giả đứng dậy khi hợp xướng này vang lên. Người ta hay kể rằng vua George II đã đứng lên vì quá xúc động trong buổi diễn ở London, và cả khán phòng đứng theo. Đây chỉ là giai thoại chưa được xác minh — không có bằng chứng đương thời nào cho thấy nhà vua có mặt hôm đó — nhưng truyền thống đứng dậy thì có thật đến ngày nay." COD (bậc 2) kể chuyện này như sự kiện: "At one of the 3 London perfs. in CG Th. in 1743, the whole assembly, led by George II, rose … a tradition which is sometimes still maintained by Brit. audiences". Ý "không có bằng chứng đương thời" chỉ thấy ở nguồn bậc 3 (bài chương trình hòa nhạc, blog: nhắc thư của James Beattie viết 37 năm sau): bỏ khỏi trang; viết "chuyện thường được kể" để không khẳng định. Bỏ "vì quá xúc động" (không nguồn), "ở nhiều nơi" thành "ở Anh … đôi khi" theo COD. chưa chắc cho lượt 2 và review: nếu tìm được nguồn bậc 2 (như sách của Donald Burrows, nhà xuất bản hay thư viện) nói không có bằng chứng nhà vua có mặt, thì thêm lại một câu như vậy, kèm nguồn. Review D6-L9-gom: giữ câu. Chữ "chuyện thường được kể" đã giữ khoảng cách; lượt 2 xác nhận chi tiết đúng với bản kể phổ biến và với COD. Không thêm vế "lời kể sớm nhất là thư Beattie 1780" (lượt 2 đề nghị): vế ấy là nhận định mới, "sớm nhất" chỉ có nguồn bậc 3 (Bard), và trang không cần nó. Ghi ở báo cáo d6-l9-gom.md cho chủ repo.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/accountoflifewri02forbrich", "https://ton.bard.edu/handels-messiah/", "https://handelhendrix.org/discover/learn-about-handel" ]
    luot_2_ghi_chu: "Nguồn sớm nhất là thư James Beattie gửi Rev. Dr Laing, Aberdeen, 25/5/1780 (Forbes, An Account of the Life and Writings of James Beattie, tập 2, thư CXLVI, tr. 80). Beattie kể lại lời Lord Kinnoull: 'When Handel's Messiah was first performed… when that chorus struck up, For the Lord God Omnipotent reigneth, they were so transported, that they all, together with the King, (who happened to be present) started up, and remained standing till the chorus ended: And hence it became the fashion in England…'. Tức là nghe kể lại, viết 37 năm sau. Thư không ghi năm 1743, không ghi London, và nói khán giả 'cùng với vua' đứng dậy, không nói vua dẫn đầu. Buổi đầu ở London là ngày 23/3/1743 (Handel House). Bản kể phổ biến ngày nay (Bard: 'at the work's London premiere in 1743… George II… rose… The audience rose to their feet to join their king') đúng là năm 1743, London, vua đứng trước, nên câu tả đúng 'chuyện thường được kể', và chữ 'thường được kể' đã giữ khoảng cách. Bard cũng ghi 'very little evidence… to even prove he was at the performance'; tôi không tìm được tài liệu đương thời nào xác nhận vua có mặt. Đề nghị thêm một vế, như: '…nhưng không có tài liệu thời ấy xác nhận vua có mặt; lời kể sớm nhất là một lá thư năm 1780'. Chi tiết 'đứng tới hết' khớp với Beattie ('remained standing till the chorus ended')."
    review: dung
