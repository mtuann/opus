    moi: 'mô tả: Handel (1685–1759) là nhà soạn nhạc sinh ở Đức, sống và thành danh ở London. Ông viết opera tiếng Ý suốt nhiều năm, nhưng khi opera Ý ở London bớt được ưa chuộng…'
