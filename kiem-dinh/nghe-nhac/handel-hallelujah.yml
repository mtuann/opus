  - id: n2
    cau: 'Bảng: Hợp xướng "Hallelujah" là số 44 theo cách đánh số thường gặp (có ấn bản đánh số 39), kết thúc Phần II của oratorio Messiah, HWV 56.'
    loai: danh-muc
    nguon: [imslp-messiah, cod-hallelujah, mb-hallelujah]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(số 44)". IMSLP "Chorus: Hallelujah (Part II, No.44)"; COD "closes Part II"; bản thu Pinnock, Hogwood ghi 44, Gardiner, Christie, Suzuki ghi 39 (hồ sơ bản ghi D2-0 cũng ghi Carus đánh số 39). Thêm vế "có ấn bản đánh số 39" vì số tùy ấn bản.'
  - id: n3
    cau: 'Bảng: Phần lớn viết trong khoảng 22/8–14/9/1741 (24 ngày).'
    loai: nam
    nguon: [bl-messiah, cod-messiah]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "22/8–14/9/1741 (chỉ 24 ngày)". Thư viện Anh: "the music was largely written between 22 August and 14 September 1741" (theo ngày Handel ghi); COD: "though parts are adaptations from other works by Handel". Thêm "phần lớn"; 22/8–14/9 tính cả hai đầu là 24 ngày.'
  - id: n4
    cau: 'Công diễn lần đầu ngày 13/4/1742 tại Dublin (bảng và đoạn văn).'
    loai: nam
    nguon: [cod-messiah, imslp-messiah]
    ket_qua: dung
  - id: n5
    cau: 'Bảng: Lời của Charles Jennens, trích Kinh Thánh (Khải Huyền 19:6, 19:16; 11:15).'
    loai: lich-su
    nguon: [mutopia-messiah, kjv, cod-messiah]
    ket_qua: dung
    ghi_chu: 'Lời trong bản Mutopia (lyrics1.ily): "Hallelujah … for the Lord God omnipotent reigneth" (19:6), "The kingdom of this world is become the kingdom of our Lord and of his Christ … and He shall reign for ever and ever" (11:15, KJV viết số nhiều "kingdoms"), "King of Kings, and Lord of Lords" (19:16).'
  - id: n6
    cau: 'Bảng: Giọng Rê trưởng, có trumpet và timpani.'
    loai: cau-truc
    nguon: [mutopia-messiah]
    ket_qua: dung
    ghi_chu: 'global.ily \key re \major; score.ily có "Tromba I II" và "Tympani".'
  - id: n7
    cau: 'Bảng: Lực lượng: hợp xướng bốn bè và dàn nhạc Baroque (trumpet, timpani, đàn dây, continuo).'
    loai: cau-truc
    nguon: [mutopia-messiah, imslp-messiah]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ không có phần trong ngoặc. Tổng phổ HG số này: hai trumpet, timpani, violin 1, 2, viola, bốn bè Canto, Alto, Tenore, Basso, Bassi có số hầm (continuo). IMSLP còn ghi oboe, bassoon cho cả tác phẩm (bè đôi theo đàn dây, không có dòng riêng trong HG): chỉ liệt kê điều thấy trên tổng phổ.'
  - id: n8
    cau: 'Bảng và đoạn văn: dài khoảng 3–4 phút.'
    loai: so-lieu
    nguon: [mb-hallelujah]
    ket_qua: dung
    ghi_chu: 'MusicBrainz: 3:22 (Christie) đến 4:00 (Pinnock).'
  - id: n9
    cau: 'Handel là nhà soạn nhạc sinh ở Đức, sống và thành danh ở London.'
    loai: lich-su
    nguon: [cod-handel]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhà soạn nhạc người Đức thành danh ở London". COD: "Ger.-born composer … (Eng. cit. 1726)", định cư hẳn ở London: viết "sinh ở Đức" cho đúng (ông nhập quốc tịch Anh). Cả mô tả trang.'
  - id: n10
    cau: 'Ông viết opera tiếng Ý suốt nhiều năm, nhưng khi opera Ý ở London bớt được ưa chuộng, ông chuyển dần sang oratorio.'
    loai: lich-su
    nguon: [cod-handel]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ông nổi tiếng trước hết với các opera tiếng Ý hoành tráng, nhưng khi khán giả London chán opera, ông chuyển sang một thể loại mới: oratorio". COD: 35 năm với opera ở London, "recognized that the popularity of It. opera was declining and began, somewhat unwillingly, to develop the genre of dramatic oratorios", và vẫn viết opera tới 1740 (nên "chuyển dần"). Oratorio không phải thể loại mới (COD oratorio: có từ giữa thế kỷ 16): bỏ "thể loại mới", bỏ "hoành tráng". Cả mô tả trang.'
  - id: n11
    cau: 'Oratorio: tác phẩm tôn giáo có tính kịch cho ca sĩ, hợp xướng và dàn nhạc, thường diễn không dàn dựng, không phục trang.'
    loai: dinh-nghia
    nguon: [cod-oratorio]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vở nhạc kịch tôn giáo không dàn dựng, không phục trang, hát bằng tiếng Anh, chỉ có ca sĩ, hợp xướng và dàn nhạc". COD: "religious lib. for solo singers, ch., and orch., in dramatic form but usually perf. without scenery or costumes" (thường, không phải luôn: oratorio đầu tiên diễn có phục trang); "hát bằng tiếng Anh" không thuộc định nghĩa (oratorio Ý, Đức), chuyển sang nói về Messiah (n12). Khớp thuat-ngu.yml oratorio (đã khóa): "thường biểu diễn không bối cảnh, không phục trang".'
  - id: n12
    cau: 'Messiah hát bằng tiếng Anh.'
    loai: lich-su
    nguon: [imslp-messiah]
    ket_qua: dung
    ghi_chu: 'IMSLP "Language=English".'
  - id: n13
    cau: 'Messiah là tác phẩm làm tên tuổi Handel được biết khắp thế giới, và là oratorio phổ biến nhất.'
    loai: lich-su
    nguon: [cod-handel, cod-oratorio]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Messiah là oratorio nổi tiếng nhất của ông, và cũng là tác phẩm hợp xướng nổi tiếng nhất thời Baroque". COD Handel: "By this work his name is known throughout the world"; COD oratorio: "Messiah, the most popular of all oratorios". Vế "tác phẩm hợp xướng nổi tiếng nhất thời Baroque" không có nguồn: bỏ.'
  - id: n14
    cau: 'Mùa hè năm 1741, Handel đang nợ nần và tưởng sự nghiệp đã hết.'
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Không có nguồn bậc 1–2 đọc được (COD, Thư viện Anh, IMSLP không nói). Bỏ.'
  - id: n15
    cau: 'Lời do Charles Jennens chọn từ Kinh Thánh, kể về Đấng Cứu Thế.'
    loai: lich-su
    nguon: [cod-messiah, bl-messiah, imslp-messiah]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Người bạn Charles Jennens đưa cho ông một tập lời trích toàn từ Kinh Thánh". COD "lib. selected from scriptures by Charles Jennens"; Thư viện Anh "words by Charles Jennens after texts from the Bible". Bỏ "người bạn" và chuyện "đưa cho ông" (nguồn đã đọc không nói), bỏ "toàn".'
  - id: n16
    cau: 'Ba phần: lời tiên tri và giáng sinh (Phần I); chịu nạn, phục sinh, thăng thiên và lời rao giảng lan ra (Phần II); sự sống lại của người chết và chiến thắng cái chết (Phần III).'
    loai: cau-truc
    nguon: [mutopia-messiah]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lời tiên tri và giáng sinh (Phần I), chịu nạn – phục sinh – thăng thiên (Phần II), và sự sống đời đời (Phần III)". Đọc lời mở đầu từng số trong Mutopia: Phần I (A…): "Comfort ye", "Behold, a virgin shall conceive", "For unto us a child is born", các mục người chăn chiên; Phần II (B…): "Behold the Lamb of God", "He was despised", "thou didst not leave his soul in hell", "Thou art gone up on high", "How beautiful are the feet of them that preach the gospel", "Their sound is gone out into all lands", kết bằng Hallelujah; Phần III (C…): "I know that my Redeemer liveth", "the dead shall be rais''d", "O death, where is thy sting", "Worthy is the Lamb", Amen. Thêm lời rao giảng ở Phần II; Phần III viết theo lời.'
  - id: n17
    cau: 'Theo ngày Handel ghi trên bản viết tay, ông viết phần lớn bản nhạc trong khoảng 24 ngày (22/8–14/9/1741).'
    loai: nam
    nguon: [bl-messiah, cod-messiah]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Handel viết xong toàn bộ bản nhạc 260 trang trong 24 ngày". Như n3; "260 trang" không có nguồn (Thư viện Anh: 140 tờ, bản in lại ff. 1–132 là tr. 1–262): bỏ con số; "xong toàn bộ" thành "phần lớn".'
  - id: n18
    cau: 'Buổi công diễn đầu là một buổi hòa nhạc từ thiện.'
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Nguồn bậc 1–2 đã mở (COD, IMSLP, Thư viện Anh) không nói buổi đầu là từ thiện; trang thư viện Trinity College Dublin chỉ nói chung về các buổi hòa nhạc gây quỹ ở Dublin. Bỏ vế này (ngày, nơi giữ ở n4). Nếu lượt 2 tìm được nguồn bậc 2 thì có thể trả lại.'
  - id: n19
    cau: '"Hallelujah" là hợp xướng kết thúc Phần II: khúc khải hoàn sau khi câu chuyện đã đi qua đau khổ đến chiến thắng.'
    loai: cau-truc
    nguon: [cod-hallelujah, imslp-messiah, mutopia-messiah]
    ket_qua: dung
    ghi_chu: 'COD "closes Part II"; Mutopia: BWchorus là số cuối của Phần II, sau các số chịu nạn (BA–BJ) và phục sinh, thăng thiên (BK–BO). Vế "khải hoàn" là cách nói theo lời ("reigneth", "King of Kings").'
  - id: n20
    cau: 'Cả bài chỉ dùng ba câu ngắn trong sách Khải Huyền.'
    loai: cau-truc
    nguon: [mutopia-messiah, kjv]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cả bài chỉ xoay quanh vài câu Kinh Thánh ngắn". Lời Mutopia khớp ba câu Khải Huyền 19:6, 11:15, 19:16 (n5). Viết cụ thể.'
  - id: n21
    cau: 'Handel viết ở giọng Rê trưởng cùng trumpet và timpani, bộ đôi thời ấy hay dùng cho dịp lễ hội.'
    loai: lich-su
    nguon: [mutopia-messiah, ba-tp194]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "với giọng Rê trưởng rực rỡ cùng trumpet và timpani — bộ đôi "âm thanh chiến thắng" của thời Baroque (kèn trumpet Baroque chơi hay nhất ở giọng Rê)". Bärenreiter (lời tựa BWV 1068, cùng thời): trumpet và timpani "so popular for festive or open air occasions". Vế "chơi hay nhất ở giọng Rê" không có nguồn bậc 1–2 đọc được: bỏ; bỏ "rực rỡ".'
  - id: n22
    cau: 'Ở Anh, khán giả đôi khi vẫn đứng dậy khi hợp xướng này vang lên; chuyện thường được kể là ở một buổi diễn tại London năm 1743, cả khán phòng, dẫn đầu là vua George II, đã đứng dậy khi hợp xướng bắt đầu và đứng tới hết.'
    loai: lich-su
    nguon: [cod-hallelujah]
