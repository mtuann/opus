khuong_nhac: []
ghi_chu: 'Hướng dẫn nghe Concerto piano số 2 của Rachmaninoff (tầng Tác phẩm). Bản quyền: Rachmaninoff mất 1943, trang không có khuông nhạc, không chép bản nhạc. Bản nhạc đọc để kiểm: tổng phổ quét (nguồn IMSLP) trên Internet Archive. Lịch sử: lời tựa và trang sản phẩm Henle HN 1214, IMSLP, chú giải LA Phil và Utah Symphony. Sửa trang: ngày công diễn và người chỉ huy (n6); "nổi tiếng và được biểu diễn nhiều nhất" theo Henle (n13); bỏ câu bàn tay lớn và hợp âm rộng (n14, n15, da-bo); dòng 1 bảng Theo dõi bỏ "nhà thờ Nga", "xen với" nốt Fa (n19); Full Moon and Empty Arms bỏ năm 1945 (n26); câu "ảnh hưởng mạnh đến nhạc phim Hollywood" thành tên phim có nguồn (n27); thêm dòng Henle ở mục Nguồn (n29). Không có câu chưa chắc. Số dòng bảng Theo dõi (7) và mốc giữ nguyên. Câu ở hồ sơ khác: hinh-thuc/concerto n28 (8 ô hợp âm ngân như chuông) và n29 (link tới trang này): khớp. Thuật ngữ: adagio, moderato, maestoso có trong thuat-ngu.yml, sostenuto, scherzando có trong thuat-ngu.yml; chưa có (cho D3-L5): alla marcia.'
doi_chu:
  - cu: 1901, Moskva, tác giả chơi piano
    moi: 27/10/1901 (lịch Nga cũ; 9/11/1901 theo lịch hiện nay), Moskva, tác giả chơi piano, Alexander Siloti chỉ huy
