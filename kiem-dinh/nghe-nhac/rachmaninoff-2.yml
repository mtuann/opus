  ten: 'IMSLP, Piano Concerto No.2, Op.18 (Rachmaninoff, Sergei): ba chương Moderato (c), Adagio sostenuto (E), Allegro scherzando (c – C); Average Duration 34 minutes; sáng tác 1900–01; công diễn "1901-11-09 (10-27 O.S.) in Moscow", Rachmaninoff piano, Alexander Siloti chỉ huy; in 1901 (Gutheil); đề tặng Nikolay Vladimirovich Dahl; bản thu "Uncredited Piano soloist, Skidmore College Orchestra / Anthony Holland", MusOpen (wikitext qua api.php, 06/11/2026)'
  link: https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
- id: henle-1214
  bac: 2
  ten: 'G. Henle Verlag, HN 1214 Rachmaninoff, Piano Concerto no. 2 c minor op. 18: mô tả ("the epitome of the Romantic piano concerto", "acclaimed premiere in Moscow in 1901"); mục tác giả ("continued and expanded the late-Romantic tradition"; sinh 1873; 1897 Giao hưởng số 1 thất bại; 1900/01 soạn Op. 18)'
  link: https://www.henle.de/en/Piano-Concerto-no.-2-c-minor-op.-18/HN-1214
- id: henle-1214-vorwort
  bac: 2
  ten: 'G. Henle Verlag, HN 1214: lời tựa (Preface), PDF: Giao hưởng số 1 công diễn tháng 3/1897 ở St Petersburg "was a fiasco"; khoảng ba năm sau không hoàn thành được sáng tác nào; điều trị với Nikolay V. Dahl (1–4/1900); chương 2–3 diễn trước ngày 2/12/1900; công diễn trọn ba chương 27/10/1901 ở Moskva, Ziloti chỉ huy; "one of today''s most famous and most performed piano concertos"; đề tặng Dahl'
  link: https://www.henle.de/media/c5/95/e0/1697725904/1214-1697725904-sync.pdf
- id: ia-tongpho
  bac: 1
  ten: 'Rachmaninoff, Piano Concerto No. 2 Op. 18, tổng phổ (bản quét, nguồn IMSLP), Internet Archive rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score; xem ảnh: tr. 1 (Moderato, piano độc tấu 8 ô hợp âm pp → ff, nốt trầm Fa xen giữa), tr. 2 (đàn dây "con passione" ff, piano hợp âm rải), tr. 7 (số 3: piano "espressivo", ba dấu giáng), tr. 32 ("Maestoso (Alla marcia)"), tr. 46–47 (II. Adagio sostenuto, bốn dấu thăng; số 17: sáo "I solo", rồi clarinet "solo"; piano rải), tr. 66 (III. Allegro scherzando), tr. 75 (Moderato: oboe "I Solo" và viola)'
  link: https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
- id: laphil
  bac: 2
  ten: 'LA Phil, Rachmaninoff Piano Concerto No. 2 (chú giải): hợp âm piano "tolling like bells for eight measures"; chủ đề chính C minor; "a seven-note march motif … in a climactic maestoso section"; chương 2 "in E major"; chương 3 giai điệu "in the oboe and violas"; Buddy Kaye và Ted Mossman "adapted the last movement''s second theme into … ''Full Moon and Empty Arms''"; nhạc phim "Grand Hotel, Brief Encounter, and The Seven Year Itch"; đề tặng Dahl; 1897'
  link: https://www.laphil.com/works/piano-concerto-no-2-in-c-minor-op-18
- id: usuo
  bac: 2
  ten: 'Utah Symphony | Utah Opera, Rachmaninoff Piano Concerto No. 2 (bài 4/2022): Giao hưởng số 1 năm 1897 "was a disaster", "a deep depression that resulted in a three-year compositional drought"; Dahl; phim Brief Encounter (1945), The Seven Year Itch (1955); Full Moon and Empty Arms'
  link: https://usuo.org/explore/2022/04/rachmaninoff-piano-concerto-no-2/
- id: sheet-fullmoon
  bac: 2
  ten: 'Santa Cruz Public Library, Sheet Music Collection, "Full Moon And Empty Arms" (Buddy Kaye, Ted Mossman): "Based on Rachmaninoff''s Piano Concerto No. 2", bản in 1946'
  link: https://sheetmusic.santacruzpl.org/items/show/33964
