    luot_2_ghi_chu: "uDiscover (bài về Concerto số 2): nhạc của Rachmaninoff khó với người tay nhỏ, cần 'a wide span'. Classic FM: vì tay ông rất lớn, một số tác phẩm 'fiendishly difficult' với người chơi khác. Tổng phổ (archive.org): các hợp âm mở đầu trải rộng hơn một quãng tám ở cả hai tay."
