khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ not, nhip, dau-ngan, toc-do, giong ]
    ket_qua: dung
    ghi_chu: 'Đối chiếu với tổng phổ Eulenburg (Unger) tr. 1, violin 1 (cũng là violin 2, clarinet; các bè dây khác cách quãng tám), ô 1–5: ô 1 lặng móc đơn + Sol Sol Sol (móc đơn); ô 2 Mi♭ nốt trắng có dấu ngân; ô 3 lặng móc đơn + Fa Fa Fa; ô 4 Rê nốt trắng nối sang ô 5 Rê nốt trắng có dấu ngân (dấu ngân chỉ ở ô 5). ABC: L:1/8, M:2/4, K:Cm (Mi giáng theo hóa biểu), "z G G G | !fermata!E4 | z F F F | D4- | !fermata!D4 |]": khớp từng nốt, độ dài, dấu nối, dấu ngân. Q:1/2=108 khớp "Allegro con brio (𝅗𝅥=108)" in trên tổng phổ (máy đếm nhịp của Beethoven, AMZ 17/12/1817 theo lời tựa Altmann). "Rút gọn": chỉ một dòng giai điệu, bỏ các bè cách quãng tám và chỉ dẫn ff; tiêu đề T: nói vậy.'
doi_chu:
  - cu: 'Bốn nốt "ngắn – ngắn – ngắn – dài" nổi tiếng nhất lịch sử âm nhạc. Chú ý: phách đầu tiên là dấu lặng, nên ba nốt ngắn bắt đầu "lệch" khỏi phách mạnh.'
    moi: 'Bản giao hưởng mở đầu bằng bốn nốt "ngắn – ngắn – ngắn – dài". Chú ý: đầu ô nhịp, đúng vào phách mạnh, là một dấu lặng ngắn, nên ba nốt ngắn bắt đầu "lệch" khỏi phách mạnh.'
    ly_do: "n2 (da-sua), n11 (da-sua), n12 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: 'Chương 1: tìm chủ đề 2, giai điệu êm hơn, được kèn horn giới thiệu bằng chính nhịp "ngắn – ngắn – ngắn – dài".'
    moi: 'Chương 1: tìm chủ đề 2, giai điệu êm hơn ở violin; ngay trước đó, kèn horn dẫn vào bằng chính nhịp "ngắn – ngắn – ngắn – dài".'
    ly_do: "n22 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: 'Môtip mở đầu: cả dàn nhạc đồng âm "ngắn – ngắn – ngắn – dài", hai lần, mỗi lần dừng trên một dấu ngân'
    moi: 'Môtip mở đầu: đàn dây và clarinet đồng âm "ngắn – ngắn – ngắn – dài", hai lần, mỗi lần dừng trên một dấu ngân'
    ly_do: "n26 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: Hết phần trình bày; phần lớn bản thu chơi nhắc lại từ đầu
    moi: Hết phần trình bày; bản nhạc ghi dấu nhắc lại, nên nhiều bản thu chơi lại phần trình bày từ đầu
    ly_do: "n30 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: "Bối cảnh lịch sử: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online. Xem tài liệu tham khảo."
    moi:
      - "Năm sáng tác, buổi công diễn: Beethoven-Haus Bonn."
      - Xem tài liệu tham khảo.
    ly_do: "n37 (da-bo), n38 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: 'mô tả: Bốn nốt "ngắn – ngắn – ngắn – dài" nổi tiếng nhất lịch sử âm nhạc. Chú ý: phách đầu tiên là dấu lặng, nên ba nốt ngắn bắt đầu "lệch" khỏi phách mạnh.'
    moi: 'mô tả: Bản giao hưởng mở đầu bằng bốn nốt "ngắn – ngắn – ngắn – dài". Chú ý: đầu ô nhịp, đúng vào phách mạnh, là một dấu lặng ngắn, nên ba nốt ngắn bắt đầu "lệch" khỏi phách mạnh.'
