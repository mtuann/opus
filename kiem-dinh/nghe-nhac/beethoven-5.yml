    ghi_chu: 'IMSLP xếp tác phẩm (Piece Style) và Beethoven vào "Classical". DG: "a massive leap from Classicism to Romanticism" (nói về Eroica, viết trước Giao hưởng số 5). Bài điểm Giao hưởng số 5 của Hoffmann (1810) được Dahlhaus gọi là "the founding document of musical romanticism" (Cambridge, chú thích 86). Chữ "chuyển sang Lãng mạn" khớp nhãn "Cổ điển/Lãng mạn" của nha-soan-nhac.yml (đã khóa). Review D6-L10-gom: lượt 2 khong-chac (IMSLP, CMS chỉ ghi Classical). Giữ "Cổ điển, chuyển sang Lãng mạn" (chữ của trang cũ): lượt 1 có bài của Cambridge (Dahlhaus gọi bài điểm Giao hưởng số 5 của Hoffmann năm 1810 là "the founding document of musical romanticism"), và lượt 2 của hồ sơ bản ghi (n4) mở Eastman School of Music: bản giao hưởng gắn với "hallmarks of Romanticism" và mỹ học Lãng mạn của Hoffmann. Khác Pathétique (review D6-L5 chọn "Cổ điển" cho Op. 13, tác phẩm sớm, không có nguồn riêng cho ý Lãng mạn): Giao hưởng số 5 có nguồn riêng; vế "chuyển sang" giữ phần Cổ điển của IMSLP. Không chạy lại.'
    luot_2: khong-chac
