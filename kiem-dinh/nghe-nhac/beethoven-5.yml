    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/symphonyno5cmino0000unse/symphonyno5cmino0000unse.pdf" ]
    luot_2_ghi_chu: "Tổng phổ tr. 69–71: timpani gõ đều 'sempre pp', đàn dây giữ nốt, crescendo, 'Attacca', chương IV ff Đô trưởng."
