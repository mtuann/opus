  - id: beethoven-haus
    bac: 2
    ten: 'Beethoven-Haus Bonn, Symphony no. 5 (C minor) op. 67: "Composition: Early 1804 to March 1808"; "The bulk of the Fifth was composed between spring 1807 and early 1808"; "performed together [với Giao hưởng số 6] for the first time in December 1808 during Beethoven''s concert at the Theater an der Wien"'
    link: https://www.beethoven.de/en/work/view/6260401733894144
  - id: bhso
    bac: 2
    ten: 'Burgess Hill Symphony Orchestra, chú giải Beethoven: Symphony No. 5: "The motto, played fortissimo in octaves by the strings"; "a horn call – an expanded version of the motto – introduces the second subject"; chương 1 "plaintive oboe cadenza"; chương 2 "a set of orchestral variations based on two separate themes"; chương 3 "a scherzo and trio in the key of C minor", "the horns begin hammering out a simplified version of the motto rhythm"; "The music then stops, apart from the quiet yet insistent tapping of a drum"; "the full orchestra begins the triumphant final allegro"; chương 4 "another sonata principle movement, in the key of C major"; motto "permeate[s] virtually the entire piece"; công diễn "at the Theater an der Wien in Vienna on December 22nd"'
    link: https://www.bhso.org.uk/work/beethoven-symphony-no-5/
  - id: bpo
    bac: 2
    ten: 'Buffalo Philharmonic Orchestra, chú giải chương trình Symphony No. 5 (trang audienceaccess.co của BPO): "The coda inventively serves as another, entirely new section of development"; "The movement ends as the barely audible motive pulsates in the timpani to make way for the fortissimo finale"'
    link: https://audienceaccess.co/bio/BPO-124205
  - id: nac
    bac: 2
    ten: 'National Arts Centre Orchestra (Canada), chú giải chương trình của Hannah Chan-Hartley: Giao hưởng số 5 ra mắt "on December 22 at the Theater an der Wien"; "A wonderfully mysterious transition that directly connects the third movement to the fourth"; "the exultation of the concluding Allegro"'
    link: https://nac-cna.ca/en/event/notes/29164
  - id: dg-beethoven
    bac: 2
    ten: 'Deutsche Grammophon, Ludwig van Beethoven (tiểu sử): "the music of the ''Eroica'' represents a massive leap from Classicism to Romanticism"; về Giao hưởng số 5: "who can doubt that the work will end defiantly in a blaze of affirmation?"'
    link: https://www.deutschegrammophon.com/en/composers/ludwig-van-beethoven
