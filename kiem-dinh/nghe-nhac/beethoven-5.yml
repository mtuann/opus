tang: tac-pham
ghi_chu: 'Hướng dẫn nghe Giao hưởng số 5, 1 khối abc (trích ô 1–5). Bản nhạc dùng để kiểm: tổng phổ bỏ túi Eulenburg (No. 402, E.E. 3602, Max Unger hiệu đính, lời tựa Wilhelm Altmann) trên Internet Archive, đọc ảnh trang bằng PyMuPDF; số ô theo số in trên bản ấy (ô 10, 60, 70, 80, 90, 120, 130, 140, 190, 230, 240, 270, 280, 380, 390, 500 in trên trang). Chữ "nổi tiếng nhất lịch sử âm nhạc" (mô tả trang và đầu mục Môtip mở đầu) đã bỏ: đánh giá không kiểm được. Hình cấu trúc (::hinh-cau-truc) lấy chữ từ hinh.nghe của bản ghi: nhận định ở hồ sơ du-lieu/tac-pham/beethoven-5. Bản ghi không có ban_thu nên ::khoi-nghe không có bản thu gợi ý và không có moc. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: xem plans/lam-lai/bao-cao/d6-l10/luot-1-A.md.'
