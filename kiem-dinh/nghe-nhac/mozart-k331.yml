ghi_chu: 'Hướng dẫn nghe Sonata La trưởng K. 331 (tầng Tác phẩm; bản ghi tac-pham/mozart-k331; loai: nghe là cấu trúc). Bản nhạc: Mutopia KV331 (chủ đề, 6 biến tấu, Menuetto, theo Breitkopf & Härtel; Rondo theo một bản trên IMSLP; .ly tải 06/11/2026): đếm ô chủ đề (8 + 10), giọng, nhịp, chữ tốc độ, trio Rê trưởng, các đoạn La thứ, La trưởng, Fa♯ thứ của rondo, tay trái vắt ở biến tấu 4, hợp âm rải (nốt hoa mỹ) ở hành khúc. Lịch sử: lời tựa Henle HN 1300 (Wolf-Dieter Seiffert, 2021), IMSLP, Concise Oxford Dictionary of Music (sonata, rondo). Bản thu: IMSLP (Kolodin), MusicBrainz. Sửa trang: n3, n16, n18, n22, n23, n24, n28, n30, n33, n36 (cùng lời khuyên n21 bỏ chữ siciliana). Không có chỗ chưa chắc. Hai điều đổi hẳn so với trang cũ theo Henle 2021: tên "Alla turca" có thể do nhà xuất bản thêm lúc in (trang cũ: "do chính Mozart ghi"); bản in đầu ghi tốc độ "Allegrino" (trang cũ: "Mozart ghi Allegretto"). Câu ở hồ sơ khác: clementi-sonatina, mozart-k545, piano/nha-soan-nhac (trang là hướng dẫn nghe Sonata La trưởng K. 331): trang giữ đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe, chữ do ::hinh-cau-truc dựng. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: chùm ba (đã chọn ở d6-l1-gom), vắt tay/bắt chéo tay, hợp âm rải, trio, Janissary (ghi cho người giao); đã bỏ "siciliana" khỏi trang.'
