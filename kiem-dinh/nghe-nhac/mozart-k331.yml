    ghi_chu: 'KV331_3_RondoAllaTurcaNotes.ly: đoạn \key a \major, tay trái có hợp âm rải bằng nốt hoa mỹ (\grace { a,32 cis e } … dòng 193–208) và \arpeggio; Henle: "electrifying janissary effects".'
  - id: n20
    cau: 'Chương 3 là một rondo: đoạn La thứ, hành khúc La trưởng, đoạn Fa♯ thứ, rồi các đoạn quay lại, khép bằng một coda.'
