doi_chu:
  - cu: Khoảng năm 1783, nhiều khả năng ở Vienna; in năm 1784 (nhà Artaria) cùng hai sonata K. 330 và K. 332
    moi: "Chưa rõ năm: Neue Mozart-Ausgabe đoán năm 1783 (ở Vienna hay Salzburg), Henle (2021) cho là sớm hơn, ở Vienna; in tháng 8 năm 1784 (nhà Artaria, Vienna) cùng hai sonata K. 330 và K. 332"
    ly_do: "n3: Henle HN 1300."
  - cu: "Chương 1, Andante grazioso (nhịp 6/8): chủ đề dịu dàng, nhịp đung đưa kiểu siciliana, gồm hai nửa (8 và 10 ô nhịp), mỗi nửa nhắc lại. Sau đó là sáu biến tấu giữ nguyên khung hòa âm và hình dáng câu nhạc: biến tấu 1 và 2 trang trí giai điệu (biến tấu 2 trên nền chùm ba nốt móc kép); biến tấu 3 chuyển sang La thứ; ở biến tấu 4, tay trái vắt qua tay phải, đảm nhận cả bè trầm lẫn giai điệu; biến tấu 5 là Adagio, chậm và trang trí như một aria; biến tấu 6 đổi sang Allegro nhịp 4/4, sáng rực. Xem lại Chủ đề và biến tấu."
    moi: "Chương 1, Andante grazioso (nhịp 6/8): chủ đề dịu dàng, nhịp đung đưa, gồm hai nửa (8 và 10 ô nhịp), mỗi nửa nhắc lại. Sau đó là sáu biến tấu giữ nguyên khung hòa âm và hình dáng câu nhạc: biến tấu 1 và 2 trang trí giai điệu (biến tấu 2 trên nền chùm ba nốt móc kép); biến tấu 3 chuyển sang La thứ; ở biến tấu 4, tay trái vắt qua tay phải, đảm nhận cả bè trầm lẫn giai điệu; biến tấu 5 là Adagio, chậm và trang trí như một aria; biến tấu 6 đổi sang Allegro nhịp 4/4, sáng rực. Xem lại Chủ đề và biến tấu."
    ly_do: 'n21, n22, n28: "siciliana" không có nguồn đọc được; giữ "nhịp đung đưa", nhịp 6/8.'
  - cu:
      - 'Chương 3, Alla turca (Allegretto): tên gọi do chính Mozart ghi. Vienna những năm 1780 đang mê "nhạc Thổ": âm thanh của ban nhạc quân đội Janissary với trống, chũm chọe, chuông. Mozart cũng vừa viết vở opera Die Entführung aus dem Serail (Vụ bắt cóc khỏi hậu cung, 1782) đầy màu sắc ấy. Trên piano, ông "bắt chước" ban nhạc bằng những đoạn hành khúc La trưởng mạnh mẽ, với hợp âm tay trái rải thật nhanh như tiếng trống và chũm chọe. Chương này là một rondo không đều đặn: đoạn La thứ, hành khúc La trưởng, đoạn Fa♯ thứ, rồi các đoạn quay lại, khép bằng một coda rộn ràng.'
      - 'Nghe bằng tai người chơi piano. Mọi thứ phải nhẹ và rõ: nhịp siciliana không được nặng nề, các nốt trang trí phải "nói" chứ không "chạy". Hãy để ý tốc độ của chương cuối: Mozart ghi Allegretto (hơi nhanh) chứ không phải Presto; nhiều bản thu chơi quá nhanh và mất đi vẻ hóm hỉnh. Gần như không cần bàn đạp; tiếng trống của hành khúc đến từ cách nhấn phím và độ gọn của hợp âm rải.'
      - "Một chi tiết mới: năm 2014, bốn trang bản thảo của Mozart cho chương 1 và chương 2 được tìm thấy ở Thư viện Quốc gia Széchényi, Budapest. Trước đó người ta chỉ biết trang cuối của chương 3."
    moi:
      - 'Chương 3, Alla turca: tên gọi có từ bản in đầu năm 1784; theo Henle, nó được thêm vào lúc in, do Mozart hay nhà xuất bản. Vienna những năm 1780 đang mê "nhạc Thổ": âm thanh của ban nhạc quân đội Janissary với trống, chũm chọe, kẻng tam giác. Mozart cũng vừa viết vở opera Die Entführung aus dem Serail (Vụ bắt cóc khỏi hậu cung, 1782) đầy màu sắc ấy. Trên piano, ông "bắt chước" ban nhạc bằng những đoạn hành khúc La trưởng mạnh mẽ, với hợp âm tay trái rải thật nhanh như tiếng trống và chũm chọe. Chương này là một rondo không đều đặn: đoạn La thứ, hành khúc La trưởng, đoạn Fa♯ thứ, rồi các đoạn quay lại, khép bằng một coda rộn ràng.'
      - 'Nghe bằng tai người chơi piano. Mọi thứ phải nhẹ và rõ: nhịp 6/8 không được nặng nề, các nốt trang trí phải "nói" chứ không "chạy". Hãy để ý tốc độ của chương cuối: bản in đầu ghi Allegrino, nhiều ấn bản về sau (như bản gõ lại trên Mutopia) ghi Allegretto (hơi nhanh), đều không phải Presto. Gần như không cần bàn đạp; tiếng trống của hành khúc đến từ cách nhấn phím và độ gọn của hợp âm rải.'
      - "Một chi tiết mới: tháng 9 năm 2014, một phần bản thảo của Mozart, từ biến tấu 3 của chương 1 tới ô 10 của trio chương 2, được tìm thấy ở Thư viện Quốc gia Széchényi, Budapest. Trước đó người ta chỉ biết một tờ có các ô cuối của chương 3."
    ly_do: "n16, n18: Henle HN 1300. n23: Henle, Mutopia. n24: Henle."
