    cau: 'Bản in đầu ghi tốc độ chương cuối là Allegrino, nhiều ấn bản về sau (như bản gõ lại trên Mutopia) ghi Allegretto (hơi nhanh), đều không phải Presto.'
    loai: lich-su
    nguon: [ henle-hn1300, mutopia-k331 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mozart ghi Allegretto (hơi nhanh) chứ không phải Presto; nhiều bản thu chơi quá nhanh và mất đi vẻ hóm hỉnh." Henle: "the unusual tempo marking Allegrino (which appears in the copy and first edition)"; Mutopia: piece "Allegretto". Bỏ vế "nhiều bản thu chơi quá nhanh…" (đánh giá không có nguồn).'
  - id: n24
    cau: 'Tháng 9 năm 2014, một phần bản thảo của Mozart, từ biến tấu 3 của chương 1 tới ô 10 của trio chương 2, được tìm thấy ở Thư viện Quốc gia Széchényi, Budapest. Trước đó người ta chỉ biết một tờ có các ô cuối của chương 3.'
    loai: lich-su
    nguon: [ henle-hn1300 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "năm 2014, bốn trang bản thảo của Mozart cho chương 1 và chương 2 … Trước đó người ta chỉ biết trang cuối của chương 3." Henle: "discovery, at the Music Department of the National Széchényi Library in Budapest, of part of the autograph – namely, of the 1st movement from Variation III until the 2nd movement, up to m. 10 of the Trio, in September 2014"; "with the exception of a single leaf containing its closing measures". "Bốn trang" chưa có nguồn đã mở nên bỏ số trang.'
