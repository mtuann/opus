  - cu:
      - "Mitsuko Uchida: cách chơi Mozart tinh tế, sắc thái nhỏ, trang trí tự nhiên."
      - "Daniel Barenboim hoặc András Schiff: tiếng đàn tròn, câu nhạc hát; nghe Adagio của biến tấu 5 để so sánh."
    moi: "Mitsuko Uchida, Daniel Barenboim hay András Schiff (piano hiện đại): cả ba đều có bản thu K. 331; nghe Adagio của biến tấu 5 ở hai bản để so sánh cách trang trí."
    ly_do: "n30: bỏ đánh giá; MusicBrainz."
  - cu: Chương 1 và chương 3 ở khoảng chặng 6 (≈ Grade 7–8, xem Nhà soạn nhạc cho piano); chủ đề chương 1 có thể tập sớm hơn để làm quen với nhịp 6/8 và cách trang trí kiểu Mozart. Chuẩn bị bằng Sonata K. 545 và Sonatina Clementi, luyện gam và hợp âm rải thật đều tay (xem lộ trình piano), và đọc nốt hoa mỹ. Ở chương 3, tập hợp âm rải tay trái thật nhẹ trước rồi mới tăng tốc.
    moi: Chương 1 và chương 3 ở khoảng chặng 6 (Henle xếp cả bản ở mức 6 trên thang 1–9 và ghi ABRSM Grade 8; xem Nhà soạn nhạc cho piano); chủ đề chương 1 có thể tập sớm hơn để làm quen với nhịp 6/8 và cách trang trí kiểu Mozart. Chuẩn bị bằng Sonata K. 545 và Sonatina Clementi, luyện gam và hợp âm rải thật đều tay (xem lộ trình piano), và đọc nốt hoa mỹ. Ở chương 3, tập hợp âm rải tay trái thật nhẹ trước rồi mới tăng tốc.
    ly_do: "n33: Henle HN 1300."
  - cu:
      - Charles Rosen, The Classical Style (1971); Grove Music Online.
      - "Thông tin về bản thảo tìm thấy năm 2014: Thư viện Quốc gia Széchényi (Budapest)."
    moi:
      - Bản nhạc gõ lại trên Mutopia (theo Breitkopf & Härtel; chương 3 theo một bản trên IMSLP).
      - 'G. Henle Verlag, Piano Sonata A major K. 331 (HN 1300): lời tựa của Wolf-Dieter Seiffert (2021) về năm sáng tác, bản in 1784, bản thảo tìm thấy năm 2014 ở Budapest, chỉ dẫn "Alla turca" và "Allegrino".'
