khuong_nhac: []
ghi_chu: 'Hướng dẫn nghe Mùa xuân, chương 1 (tầng Tác phẩm). Bản nhạc: Mutopia 301 (.ly và PDF, theo Performers'' Facsimiles); phân đoạn đối chiếu Teoria; sonnet theo Mutopia và trang sonnet bản in đầu Le Cène (Commons). Lịch sử: IMSLP, Boston Baroque, Henle HN 1020; định nghĩa: COD (ritornel, programme music). Sửa trang: "một trong những ví dụ sớm và nổi tiếng nhất" thành "một ví dụ nổi tiếng" (n12); ritornello "điệp khúc nhỏ" thành "lần quay lại nhỏ" cho khớp COD và trang đã khóa hinh-thuc/concerto (n14). Chưa chắc: n30 (sách in). Số dòng bảng Theo dõi (11) và mốc giữ nguyên. Câu ở hồ sơ khác: cap-nhat n31 (phần cuối tách ba sự kiện: ritornello, đoạn độc tấu ngắn, ritornello cuối, đủ mốc); hinh-thuc/concerto n12, n24, hinh-thuc/rondo n25, nhac-cu/violin n17, lich-su/thoi-ky/baroque n46 (hướng dẫn nghe Mùa xuân, ritornello): trang giữ đúng. Thuật ngữ: trill (láy rền), tremolo có trong thuat-ngu.yml; chưa có (cho D3-L5): ritornello, tutti, solo, sonnet, bè trầm liên tục (basso continuo), tasto solo, âm nhạc miêu tả (programme music).'
doi_chu:
  - cu:
      - 'Mỗi concerto trong Bốn Mùa đi kèm một bài thơ sonnet mô tả cảnh vật, có lẽ do chính Vivaldi viết. Âm nhạc "vẽ" lại từng câu thơ: đây là một trong những ví dụ sớm và nổi tiếng nhất của âm nhạc miêu tả.'
      - 'Chương 1 viết theo hình thức ritornello, hình thức đặc trưng của concerto Baroque: một đoạn nhạc chính do cả dàn nhạc chơi (ritornello, "điệp khúc nhỏ") quay lại nhiều lần, xen giữa là các đoạn độc tấu của violin.'
    moi:
