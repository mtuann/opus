  - id: imslp-rv269
    bac: 2
    ten: 'IMSLP, Violin Concerto in E major, RV 269 (Vivaldi): "La primavera (Spring) from Le quattro stagioni"; RV 269 ; Op.8 No.1; Key E major; ba chương Allegro, Largo, Danza pastorale; in 1725 trong Op. 8 (No.1); Piece Style Baroque; violin, strings, continuo (wikitext qua api.php)'
    link: https://imslp.org/wiki/Violin_Concerto_in_E_major,_RV_269_(Vivaldi,_Antonio)
  - id: imslp-op8
    bac: 2
    ten: 'IMSLP, Il cimento dell''armonia e dell''inventione, Op.8 (Vivaldi): 12 concerto, số 1 RV 269 "La primavera", số 2 L''estate, số 3 L''autunno, số 4 RV 297 "L''inverno"; Year of First Publication "1725 - Amsterdam: Michel-Charles Le Cène" (RISM); Piece Style Baroque; Instrumentation "violin, strings, continuo" (wikitext qua api.php, 06/11/2026)'
    link: https://imslp.org/wiki/Il_cimento_dell%27armonia_e_dell%27inventione,_Op.8_(Vivaldi,_Antonio)
  - id: boston
    bac: 2
    ten: 'Boston Baroque, chú giải Vivaldi: The Four Seasons (Martin Pearlman): in ở Amsterdam năm 1725, là bốn concerto đầu của tập 12 concerto Op. 8; sonnet "quite possibly by Vivaldi himself"; "Capital letters are placed next to lines in the sonnets, as well as in the score"; Mùa xuân: tiếng chim ở các violin, suối chảy legato, tremolo "thunder"; Mùa đông: run trên băng, "horrible wind" ở violin độc tấu, giậm chân và răng va "are marked in the score"; chương 3 trượt trên băng, ngã'
    link: https://baroque.boston/vivaldi-four-seasons
  - id: commons-sonnet
    bac: 2
    ten: 'Wikimedia Commons, Soneto di La primavera.png: trang đầu bản in đầu Le Cène (1725), sonnet của Mùa xuân in kèm (CC0)'
    link: https://commons.wikimedia.org/wiki/File:Soneto_di_La_primavera.png
  - id: henle-1020
    bac: 2
    ten: 'G. Henle Verlag, HN 1020 Vivaldi, The Four Seasons: "without question among the most famous compositions in Vivaldi''s oeuvre"; "Each is preceded by a poem that presents the mood and scene of the season, which Vivaldi then depicts brilliantly in music – from thunder and lightning to birdsong"'
    link: https://www.henle.de/en/The-Four-Seasons/HN-1020
  - id: mutopia-301
    bac: 1
    ten: 'Mutopia Project, La Primavera / Spring (Op. 8 No. 1), Mutopia-2010/02/08-301, theo bản in chụp lại của Performers'' Facsimiles, CC BY-SA 3.0: .ly và tổng phổ PDF; sonnet gắn vào ô (spring-sonnet.ly): ô 1 "Giunt''è la Primavera", ô 13½ "Canto de gl''Uccelli" (violin độc tấu, violin 1, violin 2 đều "Solo"), ô 31 "Scorrono i Fonti" (Piano), ô 44 "Tuoni" (nốt móc ba lặp), ô 59 "Canto d''Uccelli", ô 66 "Tutti", ô 70½ "Solo" với bè trầm "Tasto Solo", ô 76 "Tutti"; "Piano" (tiếng vọng) ở ô 3, ô 10, ô 79'
    link: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=301
  - id: teoria-spring
    bac: 2
    ten: 'Teoria, Vivaldi, La Primavera, I Allegro: ritornello form "the main musical idea - the ritornello - is presented … by the full orchestra (tutti …), alternating with soloists sections"; ritornello ô 1–13 (Mi trưởng), 27–30, 40–44 (Si trưởng), 55–59 (Đô♯ thứ), 66–70 (Đô♯ thứ về Mi trưởng); chim ô 13–27, suối 31–40, bão 44–55 (về Đô♯ thứ), chim trở lại 59–65, độc tấu và ritornello cuối 70–82'
    link: https://www.teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php
  - id: cod-ritornel
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục ritornel ("ritornello is a little return … In the classical conc., the return of the full orch. after a solo passage, same as tutti"), qua Encyclopedia.com
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/ritornel
  - id: cod-programme
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục programme music ("Instr. mus. which tells a story, illustrates literary ideas, or evokes pictorial scenes"), qua Encyclopedia.com
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/programme-music
  - id: commons-harrison-x
    bac: 2
    ten: 'Wikimedia Commons, Vivaldi - Four Seasons 1 Spring mvt 1 Allegro - John Harrison violin.oga: 215,28 giây, CC BY-SA 4.0 (đọc qua API)'
    link: https://commons.wikimedia.org/wiki/File:Vivaldi_-_Four_Seasons_1_Spring_mvt_1_Allegro_-_John_Harrison_violin.oga
  - id: mb-giardino
    bac: 2
    ten: 'MusicBrainz, Il Giardino Armonico ("Italian baroque ensemble"): các đĩa "Le quattro stagioni (Il cimento dell''armonia e dell''inventione Vol. 1)" (1994) và các lần phát hành sau'
    link: https://musicbrainz.org/artist/96bcdacc-59bc-41b5-ac66-18e5b55f1689
  - id: mb-europa
