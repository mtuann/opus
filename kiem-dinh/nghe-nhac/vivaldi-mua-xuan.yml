  - id: n13
    cau: Chương 1 viết theo hình thức ritornello, hình thức đặc trưng của concerto Baroque.
    loai: cau-truc
    nguon:
      - teoria-spring
      - cod-ritornel
    ket_qua: dung
    ghi_chu: 'Teoria: chương 1 dùng ritornello form. "Đặc trưng của concerto Baroque": khớp hinh-thuc/concerto (đã khóa, n3 theo LCS: ritornello "typical of the first and frequently also the last movement"); COD ritornel: sự trở lại của cả dàn nhạc sau đoạn độc tấu trong concerto.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20251112002652/https://www.britannica.com/art/ritornello", "https://www.mutopiaproject.org/ftp/VivaldiA/O8/spring/spring-lys.zip" ]
    luot_2_ghi_chu: "Britannica: ritornello là đoạn lặp lại xen các đoạn tương phản, trong concerto grosso tutti chơi ritornello; spring1.ly cho thấy Tutti/Solo luân phiên."
