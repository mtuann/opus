    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20210428195841/https://www.collinsdictionary.com/dictionary/english/ritornello", "https://web.archive.org/web/20260103195710/https://www.merriam-webster.com/dictionary/ritornello" ]
    luot_2_ghi_chu: "Collins: 'from Italian, literally: a little return, from ritorno a return'; Merriam-Webster: 'diminutive of ritorno return'."
