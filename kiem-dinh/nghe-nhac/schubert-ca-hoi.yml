    ghi_chu: 'Henle (sản phẩm): mùa hè 1819 ở Steyr «and subsequently set to work composing»; lời tựa Henle: «probably during his first trip to Steyr in 1819»; IMSLP «1819?». Năm 1819 có chữ "probably": hai nguồn bậc 2 cùng ghi 1819, giữ. Review D6-L10-gom: lượt 2 khong-chac: mọi nguồn đều rào năm 1819 (lời tựa Henle "probably", trang sản phẩm Henle "around 1819", Bärenreiter "one can assume", IMSLP "1819?"); lời tựa Henle nói viết trong chuyến đi Steyr, trang sản phẩm Henle và HK Phil nói sau đó. Sửa theo gợi ý của lượt 2: "Có lẽ năm 1819, trong hay sau mùa hè ở Steyr (Áo)". Chỉ rào lại theo nguồn hai lượt đã đọc, không chạy lại. Chữ câu trước review: "Sáng tác: 1819, sau một mùa hè ở Steyr (Áo)."'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.henle.de/media/24/77/b7/1690886058/0463-1690886058-sync.pdf", "https://www.henle.de/en/Quintet-A-major-op.-post.-114-D-667-for-Piano-Violin-Viola-Violoncello-and-Double-Bass-Trout-Quintet/HN-463", "https://www.barenreiter.co.uk/prefaces/9790006472741_Innenansicht.pdf", "https://www.hkphil.org/watch-and-listen/all-performances/schubert-s-trout-quintet", "https://imslp.org/wiki/Piano_Quintet_in_A_major,_D.667_(Schubert,_Franz)" ]
    luot_2_ghi_chu: "Năm 1819 là năm được chấp nhận nhưng nguồn đều rào: Henle 'probably during his first trip to Steyr in 1819' (lời tựa), trang sản phẩm Henle 'around 1819'; Bärenreiter: lời kể của Stadler không cho biết thời gian, 'one can assume that Schubert composed it in 1819'; IMSLP '1819?'. Về 'sau mùa hè': trang sản phẩm Henle và HK Phil nói Schubert viết/hoàn thành sau mùa hè (HK Phil: về Vienna tháng 10 mới hoàn thành), còn lời tựa Henle nói 'during' chuyến đi Steyr. Đề nghị viết 'có lẽ năm 1819, trong hay sau mùa hè ở Steyr (Áo)'."
    review: dung
