ghi_chu: 'Hướng dẫn nghe Ngũ tấu Con cá hồi, chương 4 (tầng Tác phẩm). Bản nhạc: tổng phổ trên Internet Archive (bản khắc cũ, không ghi ấn bản; cello và contrabass chung khuông), đọc từng trang chương 4 (tr. 29–38); Die Forelle theo Peters. Lịch sử: lời tựa Henle HN 463, ghi chú Sussex (lời Stadler), IMSLP. Sửa trang: mô tả và đoạn mở (n2, n10, n11: Paumgartner là người bảo trợ, bỏ "nghiệp dư"), biên chế (n13, n14: không violin thứ hai; contrabass giải phóng piano, không phải cello), bỏ "thay vì 4 thông thường" (n15), thêm hai dòng Nguồn (n30). Bảng Theo dõi (7 dòng) đúng với tổng phổ, giữ nguyên; cột đầu "…", trang không có mốc. Câu ở hồ sơ khác vẫn đúng: hinh-thuc/bien-tau n37; piano/choi-cung-nguoi-khac n8 (chương 4, bảng biên chế), n82 (contrabass thay violin thứ hai: trang nay viết cùng ý), n83 (piano dẫn ở biến tấu 1, 3; im lặng ở chủ đề, có bản nhạc làm nguồn: n19); nghe-nhac/schubert-impromptu n40; piano/tac-pham/schubert-impromptu-sol-giang n86; nhan-dien/the-loai n35; lich-su/thoi-ky/lang-man n37; nhan-dien/dau-van-tay n52; nhac-cu/index n18. Thuật ngữ chưa có trong thuat-ngu.yml: ngũ tấu piano (piano quintet), contrabass, viola, cello, chủ đề và biến tấu (theme and variations; trang hinh-thuc/bien-tau có), pizzicato.'
doi_chu:
  - cu:
      - "Ngũ tấu được viết theo đề nghị của Sylvester Paumgartner, một người yêu nhạc ở Steyr chơi cello nghiệp dư, người rất thích ca khúc Die Forelle (Con cá hồi, D. 550) của Schubert. Biên chế khác thường: thay vì hai violin, có một contrabass, làm bè trầm dày hơn và để cello được tự do hát giai điệu."
