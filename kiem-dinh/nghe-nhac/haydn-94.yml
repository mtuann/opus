  - id: n9
    cau: 'Có chuyện kể Haydn muốn đánh thức khán giả ngủ gật, nhưng chính ông đã bác: theo người viết tiểu sử Griesinger, Haydn nói ông chỉ muốn làm công chúng bất ngờ bằng một điều mới.'
    loai: lich-su
    nguon: [ henle-9062 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một giai thoại kể rằng Haydn muốn đánh thức những khán giả ngủ gật, nhưng không có bằng chứng chắc chắn." Henle: ý ấy "was, however, dismissed by the composer himself"; Griesinger (Biographische Notizen, 1810, tr. 55 f.): "my intention was to surprise the public with something new, and to make my debut in a brilliant manner". Viết theo nguồn.'
