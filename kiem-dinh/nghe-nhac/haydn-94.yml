ghi_chu: 'Hướng dẫn nghe Giao hưởng số 94 "Surprise", chương 2 (tầng Tác phẩm; bản ghi tac-pham/haydn-94; loai: nghe là cấu trúc). Một khối abc (chủ đề, 4 ô). ::hinh-cau-truc dựng từ hinh.nghe của bản ghi: chữ trong hình kiểm ở hồ sơ bản ghi (du-lieu/tac-pham/haydn-94 lần 2), không tính ở đây. ::khoi-nghe không có bản thu (không sửa). Bản nhạc: Mutopia không có bản giao hưởng này; dùng tổng phổ Cranz (Partitur mit unterlegtem Klavierauszug, số bản in C. 45167) quét trên Internet Archive (symphonies00hayd, PDF trang 210–220 = tr. 21–30 của bản in), đọc ảnh: Andante 2/4 Đô trưởng; ô 1–8 violin 1 và 2 đồng âm, chỉ đàn dây, p; ô 9–16 nhắc lại pp, ô 16 hợp âm ff cả dàn nhạc có timpani; Var. 1 violin 2 và viola giữ chủ đề, violin 1 trang trí; "Minore" ff (Var. 2); "Maggiore" (Var. 3) oboe I chơi chủ đề bằng chuỗi móc kép nhắc lại; Var. 4 ff cả dàn nhạc, violin chạy nốt nhanh, có đoạn p dolce; coda sempre dim., pp. Kiểm chéo incipit với IMSLP (wikitext, 156 ô). Lịch sử: lời tựa Henle HN 9062 (Friederike Mühle, 2020; bản in lại từ Joseph Haydn Werke I/16), IMSLP, BnF. Độ dài: MusicBrainz. Sửa trang: n3, n6, n7, n9, n11, n14–n18, n23 (mục Nguồn). Không có chỗ chưa chắc. Câu ở hồ sơ khác trỏ tới trang này: hinh-thuc/bien-tau n35 (chương 2, biến tấu trên chủ đề có "bất ngờ"), nhac-ly/20-doc-tong-pho n18, n21 (Andante, dàn nhạc nhỏ: 2 sáo, 2 oboe, 2 bassoon, 2 horn, 2 trumpet, timpani, đàn dây, khớp IMSLP InstrDetail), lich-su/thoi-ky/co-dien n31 ("Haydn, Giao hưởng số 94, chương 2"): trang giữ đúng. hinh-thuc/minuet-trio m26 (trang đã khóa) dẫn trang này làm hướng dẫn nghe cho chương 3 (minuet); trang chỉ viết về chương 2, không thêm chương 3 theo lời giao; người giao cân nhắc khi mở khóa minuet-trio sau này (sửa câu dẫn ở đó), hay ghi nhận như hiện trạng. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: chủ đề và biến tấu (theme and variations), sempre (trong sempre dim.), oboe; ff, pp, dim. có bản ghi (fortissimo, pianissimo, diminuendo).'
nguon:
  - id: cranz-94
    bac: 1
    ten: 'Haydn, Symphonie no. 6 "Paukenschlag" [H. I, 94], tổng phổ kèm bản rút gọn piano, Edition Cranz (số bản in C. 45167), trong tập "Symphonies" quét trên Internet Archive (symphonies00hayd.pdf, trang PDF 210–220: Andante tr. 21–30); tải 06/11/2026, đọc ảnh'
    link: https://archive.org/details/symphonies00hayd
  - id: imslp-94
    bac: 2
    ten: 'IMSLP, Symphony No.94 in G major, Hob.I:94 (wikitext): "Alternative Title=Surprise"; "4 movements: Adagio cantabile - Vivace assai (G, 257 bars); Andante (C, 156 bars); Minuet. Allegro molto - Trio; Finale. Allegro di molto"; incipit Andante "c''8\p c''-. e''-. e''-. | g''8-. g''-. e''4-- | f''8-. f''-. d''-. d''-. | b8-. b-. g4--"; "Year/Date of Composition=1791"; "First Performance=1792/03/23 in London, Hanover Square Rooms"; "Piece Style=Classical"; "2 flutes, 2 oboes, 2 bassoons, 2 horns, 2 trumpets, timpani, strings"'
    link: https://imslp.org/wiki/Symphony_No.94_in_G_major,_Hob.I:94_(Haydn,_Joseph)
  - id: henle-9062
    bac: 2
    ten: 'G. Henle Verlag, Symphony G major Hob. I:94 (Surprise), HN 9062, lời tựa (Friederike Mühle, 2020; PDF): "six symphonies that Joseph Haydn (1732 – 1809) composed for his first engagement in London in 1791 – 92. They were commissioned by Johann Peter Salomon"; "dated 1791 in the autograph"; "The first performance … took place on 23 March 1792 in the sixth concert of Salomon’s 1792 season"; "its striking sudden fortissimo chord for the whole orchestra in measure 16 of the Andante 2nd movement. This led to the nickname “Surprise”"; "The idea … that Haydn wanted to wake up the dozing audience with the “drum stroke” was, however, dismissed by the composer himself" (Griesinger: "my intention was to surprise the public with something new, and to make my debut in a brilliant manner")'
    link: https://www.henle.de/media/24/3f/82/1697725796/9062-1697725796-sync.pdf
  - id: bnf-haydn
    bac: 2
    ten: 'data.bnf.fr, Joseph Haydn (1732-1809)'
    link: https://data.bnf.fr/ark:/12148/cb13895053m
  - id: mb-94
    bac: 2
    ten: 'MusicBrainz, bản thu Andante của Giao hưởng số 94: Doráti 5:50–6:30, Jochum 6:28 và 6:47, Hogwood 6:33, Szell 6:25, Colin Davis 6:14, Brüggen 6:42, Minkowski 6:23, Ádám Fischer 5:14 và 6:18'
    link: https://musicbrainz.org/recording/5bb79236-b6e8-4c0b-afcf-bfd003a20a94
