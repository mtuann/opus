khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, giong, nhip, not, so-o ]
    ket_qua: dung
    ghi_chu: 'Bốn ô đầu bè violin 1, Andante, đối chiếu tổng phổ Cranz tr. 21 (đọc ảnh) và incipit IMSLP: Đô4 Đô4 Mi4 Mi4 | Sol4 Sol4 Mi4 (đen) | Fa4 Fa4 Rê4 Rê4 | Si3 Si3 Sol3 (đen), khớp "C C E E | G G E2 | F F D D | B,B, G,2" (K:C, L:1/8; C là Đô giữa); đúng quãng tám của bản nhạc. M:2/4 đúng, mỗi ô đủ hai phách. "Rút gọn" là: chỉ giữ giai điệu violin 1 (violin 2 chơi đồng âm ở ô 1–8), bỏ viola và cello–contrabass (hợp âm đệm), bỏ sắc thái p, dấu chấm nảy và dấu ten. của bản in; chủ đề đủ là 16 ô cho nửa đầu (ô 9–16 nhắc lại pp, kết bằng hợp âm ff). Q:1/4=76 là tốc độ trình phát của site, bản nhạc chỉ ghi Andante.'
