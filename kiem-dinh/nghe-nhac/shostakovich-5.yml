ghi_chu: 'Hướng dẫn nghe Giao hưởng số 5 (tầng Tác phẩm; bản ghi tac-pham/shostakovich-5; loai: nghe là cấu trúc). Bản quyền: Shostakovich mất 1975 (hết bảo hộ ở Việt Nam), nhưng tác phẩm in 1939 còn bảo hộ ở Mỹ: trang không có khuông nhạc; đã bỏ tên nốt và số lần lặp của nốt trong coda ("lặp đi lặp lại nốt La hàng chục lần"), chỉ mô tả. Không đọc tổng phổ (không có bản hết bảo hộ ở Mỹ; bản quét trên Internet Archive không rõ nguồn gốc, không dùng): cấu trúc theo ghi chú chương trình bậc 2 của dàn nhạc (Peter Laki cho Kalamazoo Symphony và Hungarian National Philharmonic, Harlow Robinson cho BSO, Gerard McBurney cho Boston Philharmonic) và IMSLP; Kenneth Woods (nhạc trưởng, blog, bậc 3) chỉ để đối chiếu thêm. ::hinh-cau-truc dựng từ hinh.nghe của bản ghi: chữ trong hình kiểm ở hồ sơ bản ghi (du-lieu/tac-pham/shostakovich-5 lần 2). ::khoi-nghe không có bản thu. Không tính là nhận định: tiêu đề mục, tiêu đề cột, tên chương ở cột Chương (khớp IMSLP: Moderato, Allegretto, Largo, Allegro non troppo). Câu ở hồ sơ khác trỏ tới trang này: lich-su/thoi-ky/the-ky-20 n35, nhan-dien/dau-van-tay n52, lich-su/index n47: trang giữ đúng tác phẩm. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: ländler, hành khúc (march), môtip, tiết tấu chấm dôi, kèn đồng, kèn gỗ, trống snare, timpani, horn. Có bản ghi: scherzo, largo, coda, moderato, allegretto.'
nguon:
  - id: imslp-5
    bac: 2
    ten: 'IMSLP, Symphony No.5, Op.47 (wikitext qua api.php, 06/11/2026): "Key=d"; "4 movements: Moderato; Allegretto; Largo; Allegro non troppo"; "Average Duration=45 minutes"; "First Performance=1937/11/21 in Saint Petersburg, Leningrad Philharmonic Bolshoi Hall: Leningrad Philharmonic Orchestra, Yevgeny Mravinsky (conductor)"; "Year/Date of Composition=1937 (between April and July)"; "Year of First Publication=1939"; "Piece Style=Early 20th century"; biên chế có 4 horn, 3 trumpet, 3 trombone, tuba, timpani, snare drum, piano/celesta'
    link: https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)
  - id: bso-robinson
    bac: 2
    ten: 'Harlow Robinson, ghi chú chương trình, Boston Symphony Orchestra: Pravda ngày 28/1/1936, "the official Communist Party newspaper", bài "Muddle Instead of Music" về Lady Macbeth of the Mtsensk District; Giao hưởng số 4 "withdrew it after a few rehearsals"; viết từ 18/4 đến 20/7/1937; công diễn 21/11/1937 ở Leningrad, Leningrad Philharmonic, Mravinsky; phản ứng "ecstatic"; "a Soviet artist''s creative reply to just criticism"; "debate still rages over whether he intended it sincerely or ironically"; "about 48 minutes long"'
    link: https://www.bso.org/works/symphony-no-5-shostakovich
  - id: laki-kal
    bac: 2
    ten: 'Peter Laki, ghi chú chương trình, Kalamazoo Symphony Orchestra ("A Symphony of Defiance", 2024): "On January 28, 1936, an unsigned editorial in the Pravda, the daily paper of the Soviet Communist Party, brutally attacked his opera Lady Macbeth"; "lived in constant fear of being deported to one of the infamous, deathly labor camps"; "Less than a year after being forced to withdraw his Fourth Symphony … premiered with resounding success in Leningrad on November 21, 1937"; "“A Soviet Artist’s Creative Response to Just Criticism,” as it was officially designated at the time"; chương 1: "The energetic dotted motif at the beginning", "A second theme, played by the violins in a high register, is warm and lyrical but at the same time eerie and distant", "the horns begin a march theme that leads to motivic development and a speeding up of the tempo"; chương 2: "brief second-movement Scherzo", "Ländler-like melodies again bespeak Mahler’s influence"; chương 3: "the brass is silent, and the violins are divided not into two sections as usual but three", "The oboe, the clarinet, and the flute intone desolate solo melodies", "many people wept openly during the Largo", "Stalinist purges in 1937"; chương 4: "introducing a march tune", "a slower, more introspective section begins with a haunting horn solo", "the entrance of the timpani and snare drum, ushering in the recapitulation of the march tune, played at half its original tempo", "a bright D-major chord in full orchestral splendor"'
    link: https://kalamazoosymphony.com/?p=5044
  - id: laki-nfz
    bac: 2
    ten: 'Hungarian National Philharmonic (Nemzeti Filharmonikusok), ghi chú chương trình (cùng chữ với Laki): "the brass is silent and the violins are divided not into two sections as usual but three"; "many people wept openly during the Largo"; "officially designated at the time"; "played at half its original tempo"'
    link: https://www.filharmonikusok.hu/en/?p=91605
  - id: mcburney
    bac: 2
    ten: 'Gerard McBurney, ghi chú chương trình cho Boston Philharmonic (Benjamin Zander), PDF: "This famous Pravda article appeared under the title ‘Muddle Instead of Music’"; sau buổi công diễn 21/11/1937 "it was famously, although anonymously, described as ‘A Soviet artist’s practical creative reply to just criticism’"; "there might well be some truth in the report that Shostakovich himself agreed to the subtitle"; "People who came to the premiere of the Fifth in the best of moods wept"; chương 1 mở bằng "jagged dotted rhythms", rồi "a rocking accompaniment in the lower strings over which the first violins enter"; "the scherzo, in A minor and marked ‘Allegretto’"; "a Mahlerian Ländler", "triple-time dance music"; "the slow movement in F sharp minor … dividing all the violins into three equal parts"; "supremely ironic man"'
    link: https://www.benjaminzander.org/uploads/2021/04/Shostakovich_-Symphony-no.-5.pdf
  - id: counts
    bac: 2
    ten: 'Jeff Counts, ghi chú chương trình, Utah Symphony | Utah Opera (2022): khán giả buổi công diễn đầu dành "a 40-minute ovation"; Shostakovich "withdrew his edgy 4th Symphony"'
    link: https://usuo.org/explore/2022/03/shostakovich-symphony-no-5
  - id: bnf-sh
    bac: 2
    ten: 'data.bnf.fr, Dimitri Chostakovitch (1906-1975): birthDate 25-09-1906'
    link: https://data.bnf.fr/fr/ark:/12148/cb13892473m
  - id: woods
    bac: 3
    ten: 'Kenneth Woods (nhạc trưởng), "Explore the Score: Shostakovich Symphony no. 5" (blog, 2012): chương 1 "begins using only the strings"; buổi đầu "an ovation so passionate and stormy that it nearly eclipsed the 45 minute symphony"; Largo "The brass remain silent throughout"; coda: dấu tốc độ quaver=188 và các nhạc trưởng chơi khác nhau (Bernstein "more than doubled the speed"). Chỉ để đối chiếu, không làm nguồn duy nhất'
    link: https://kennethwoods.net/blog1/2012/03/15/explore-the-score-shostakovich-symphony-no-5-in-d-minor/
  - id: ol-ross
    bac: 2
    ten: 'Open Library, Alex Ross, The Rest Is Noise (Farrar, Straus and Giroux, 16/10/2007), mục lục: "The Art of Fear: Music in Stalin''s Russia, Chapter 7"'
    link: https://openlibrary.org/isbn/9780374249397
