doi_chu:
  - cu:
      - '1937'
      - 21/11/1937, Leningrad, nhạc trưởng Yevgeny Mravinsky
    moi:
      - Từ tháng 4 đến tháng 7 năm 1937
      - 21/11/1937, Leningrad, dàn nhạc Leningrad Philharmonic, nhạc trưởng Yevgeny Mravinsky
    ly_do: 'n3, n4: Robinson (BSO), IMSLP.'
  - cu:
      - Đàn dây mở đầu bằng những bước nhảy quãng gay gắt, như một câu hỏi lớn; rồi violin hát giai điệu cô đơn, lạnh lẽo
      - Piano và kèn đồng vào, nhạc biến thành hành khúc dữ dội, máy móc
      - Scherzo kiểu điệu valse – ländler, hài hước nhưng hơi méo mó, như một vũ hội đeo mặt nạ
      - Không có kèn đồng; đàn dây chia nhiều bè, rồi oboe, clarinet, sáo hát những lời than; đây là chương nhiều người cho là thật lòng nhất
      - Timpani và kèn đồng mở đầu như một cuộc diễu hành, nhanh, dồn dập
      - Chậm lại, trầm tư, gần như một khoảng lặng
      - Rê trưởng, rất chậm và rất to; đàn dây và kèn gỗ lặp đi lặp lại nốt La hàng chục lần trên tiếng trống
    moi:
      - Đàn dây mở đầu bằng một môtip tiết tấu chấm dôi gay gắt; rồi violin hát một giai điệu ở âm vực cao, ấm mà xa xăm
      - Kèn horn đưa vào một hành khúc, nhạc nhanh dần, dữ dội
      - Scherzo nhịp ba, giai điệu như điệu ländler (gợi nhớ Mahler), giọng mỉa mai
      - Không có kèn đồng; violin chia ba bè thay vì hai, rồi oboe, clarinet, sáo lần lượt hát những giai điệu buồn; ở buổi công diễn đầu, nhiều người khóc trong chương này
      - Mở đầu bằng một hành khúc nhanh, dồn dập
      - Chậm lại, trầm tư, mở đầu bằng tiếng horn độc tấu
      - Timpani và trống snare đưa hành khúc trở lại, chậm chỉ bằng một nửa; kết thúc rất to ở Rê trưởng
    ly_do: 'Bảng Theo dõi khi nghe, n15–n24: ghi chú chương trình (Laki, McBurney, Robinson); bỏ tên nốt lặp ở coda (bản quyền ở Mỹ). Số dòng giữ 7.'
  - cu: So sánh hai bản thu có tốc độ coda khác nhau (nhiều nhạc trưởng chơi rất chậm, một số chơi nhanh hơn). Bản nào nghe như chiến thắng, bản nào nghe như bị ép phải vui?
    moi: 'So sánh coda ở hai bản thu của hai nhạc trưởng khác nhau: tốc độ có giống nhau không? Bản nào nghe như chiến thắng, bản nào nghe như bị ép phải vui?'
    ly_do: 'n25: vế về tốc độ của các nhạc trưởng chỉ có nguồn bậc 3.'
  - cu:
      - 'Đọc thêm: Alex Ross, The Rest Is Noise, chương về âm nhạc dưới thời Stalin.'
    moi:
      - 'Bối cảnh và các chương: ghi chú chương trình của Harlow Robinson (Dàn nhạc Giao hưởng Boston), Peter Laki (Dàn nhạc Giao hưởng Kalamazoo) và Gerard McBurney (Boston Philharmonic, Benjamin Zander); năm, buổi công diễn đầu, biên chế trên IMSLP.'
      - 'Đọc thêm: Alex Ross, The Rest Is Noise (2007), chương 7 "The Art of Fear: Music in Stalin''s Russia".'
    ly_do: n29, n30.
  - cu:
      - Đầu năm 1936, báo Pravda, cơ quan ngôn luận của Đảng Cộng sản Liên Xô, đăng bài "Hỗn loạn thay cho âm nhạc" chỉ trích nặng nề vở opera Phu nhân Macbeth quận Mtsensk của Shostakovich, khi ấy 29 tuổi. Đó là thời kỳ Đại Thanh trừng; bị phê phán công khai có thể dẫn đến mất tự do hoặc mạng sống. Shostakovich rút lại Giao hưởng số 4 đang tập và viết Giao hưởng số 5.
      - 'Buổi công diễn thành công vang dội; khán giả vỗ tay rất lâu, có người khóc. Một nhà báo mô tả tác phẩm là "câu trả lời sáng tạo của một nghệ sĩ Xô viết trước lời phê phán đúng đắn", và Shostakovich không phản bác. Nhưng câu hỏi lớn vẫn còn đến hôm nay: đoạn kết hân hoan ở Rê trưởng là chiến thắng thật, hay một niềm vui bị ép buộc, châm biếm kín đáo? Âm nhạc của ông thường mang hai lớp nghĩa như vậy.'
    moi:
      - Ngày 28/1/1936, báo Pravda, cơ quan ngôn luận của Đảng Cộng sản Liên Xô, đăng bài "Hỗn loạn thay cho âm nhạc" chỉ trích nặng nề vở opera Phu nhân Macbeth quận Mtsensk của Shostakovich, khi ấy 29 tuổi. Đó là thời kỳ Đại Thanh trừng; bị phê phán công khai có thể dẫn đến mất tự do hoặc mạng sống. Shostakovich rút lại Giao hưởng số 4 sau vài buổi tập và viết Giao hưởng số 5.
      - 'Buổi công diễn thành công vang dội; khán giả vỗ tay rất lâu, nhiều người khóc trong chương 3. Bản giao hưởng được gọi, không rõ do ai đặt, là "câu trả lời sáng tạo của một nghệ sĩ Xô viết trước lời phê phán đúng đắn"; có tin rằng chính Shostakovich đã đồng ý với cách gọi ấy. Nhưng câu hỏi lớn vẫn còn đến hôm nay: đoạn kết hân hoan ở Rê trưởng là chiến thắng thật, hay một niềm vui bị ép buộc, châm biếm kín đáo? Âm nhạc của ông thường mang hai lớp nghĩa như vậy.'
