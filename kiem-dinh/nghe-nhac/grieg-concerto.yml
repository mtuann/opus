  ghi_chu: 'Chủ lô D6-L8: bỏ chữ "Grove Music Online." ở đầu dòng (nguồn trả phí, không đọc; không nhận định nào dựa vào), như brahms-intermezzo n61; chữ mới "- Xem [Concerto và ritornello](…) và [tài liệu tham khảo](…).". Lượt 1: Grove Music Online có thật (Stony Brook dẫn Horton và Grinde, "Grieg, Edvard (Hagerup)", Grove Music Online); không dùng làm nguồn riêng cho nhận định nào. Link hinh-thuc/concerto và tai-lieu-tham-khao có, đã khóa.'
