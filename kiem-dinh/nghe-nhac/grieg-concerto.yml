ghi_chu: 'Hướng dẫn nghe Concerto piano Grieg (tầng Tác phẩm). Bản nhạc: tổng phổ ba chương quét trên Internet Archive (từ IMSLP; PDF IMSLP chặn máy) và bản hai piano Grainger (Schirmer 1920, Internet Archive). Lịch sử: lời tựa Henle HN 719, IMSLP, chú giải BSO, Berliner Philharmoniker, Stony Brook Libraries, Derrickson; Wenzel: PBM và GND; halling: Store norske leksikon. Sửa trang: Søllerød không còn "gần Copenhagen" (n15); bỏ lý do Grieg vắng mặt (n17); Liszt thị tấu "từ bản viết tay trước các vị khách" (n18); "ít nhất bảy lần" thành sửa nhiều lần, bản sửa cuối mùa hè 1907 (n20); bỏ năm 1858 của buổi Clara Schumann (n25); halling viết lại theo SNL, bỏ vế fiddle Hardanger (n28); so sánh bản thu bỏ lời khen, thêm năm, hãng (n53, n54); "biểu diễn chuyên nghiệp" thêm nguồn RCM LRCM (n58); Notturno bỏ "chặng 6, ≈ Grade 7–8", thay bằng RCM Level 9 (n63); thêm dòng Henle ở mục Nguồn (n69). Chưa chắc: n22 (mở đầu concerto Schumann, chưa mở được bản nhạc). Bàn phím: ba nốt La5–Sol♯5–Mi5 có thật trong cú "đổ" (tay trái lần đầu; tay phải bắt đầu ở La6), n27. Số dòng bảng Theo dõi (12) và mốc giữ nguyên. Không tính là nhận định: tiêu đề mục, tiêu đề cột, câu dẫn chung, câu hỏi chỉ là câu hỏi, chữ do ::hinh-cau-truc dựng (hồ sơ bản ghi), mốc ::khoi-nghe. Câu ở hồ sơ khác: piano/tac-pham/grieg-arietta n21, n81 (concerto viết năm 1868): trang giữ năm 1868. Thuật ngữ: cadenza, adagio, con sordino, maestoso, presto, trill có trong thuat-ngu.yml; chưa có (cho D3-L5): halling, quasi presto, andante maestoso (cụm), fiddle Hardanger không còn dùng.'
