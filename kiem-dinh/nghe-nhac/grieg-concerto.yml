  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Trang đích chưa chuyển, có trong src/data/trang.yml (nghe-nhac/grieg-buoi-sang) và ở site cũ ../opus-zero/docs/nghe-nhac/grieg-buoi-sang.md. Điều cần giữ: hướng dẫn nghe Buổi sáng ở đường dẫn ấy.'
- id: n15
  cau: Grieg viết tác phẩm năm 1868 ở Søllerød, một làng trên đảo Sjælland (Đan Mạch).
  loai: lich-su
  nguon:
  - grainger-1920
  - henle-719-vorwort
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ở Søllerød, gần Copenhagen". Chữ mới: "ở Søllerød, một làng trên đảo Sjælland (Đan Mạch)". Lý do: nguồn đã mở không nói "gần Copenhagen"; Grainger: "the Danish village of Søllerød, Zealand".'
- id: n16
  cau: Buổi công diễn ngày 3/4/1869 do Edmund Neupert, người được đề tặng tác phẩm, chơi piano, Holger Simon Paulli chỉ huy.
  loai: lich-su
  nguon:
  - bso
  - henle-719-vorwort
  - imslp-op16
  ket_qua: dung
  ghi_chu: 'BSO: "with Edmund Newpert as soloist and Holger Simon Paulli conducting the orchestra of the Royal Theater"; IMSLP: "Herrn Edmund Neupert zugeeignet".'
- id: n17
  cau: Chính Grieg không có mặt ở buổi công diễn.
  loai: lich-su
  nguon:
  - mpn
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chính Grieg vắng mặt vì bận biểu diễn ở Christiania (nay là Oslo)". Chữ mới: "chính Grieg không có mặt". Lý do: Derrickson: Grieg "could not attend the premiere", không nêu lý do; lý do "bận biểu diễn ở Christiania" chỉ thấy ở Wikipedia, chưa có nguồn bậc 2.'
- id: n18
  cau: Năm 1870, ở Rome, Liszt chơi thị tấu concerto này từ bản viết tay trước các vị khách và khen ngợi nhiệt thành.
  loai: lich-su
  nguon:
  - bso
  - grainger-1920
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "concerto này trước một nhóm nhạc sĩ". Chữ mới: "concerto này từ bản viết tay trước các vị khách". Lý do: thư Grieg (Grainger in lại): "I had fortunately just received the manuscript … Liszt took the manuscript, went to the piano, and said to the guests…"; cuối buổi Liszt khen và khuyên "Keep steadily on". BSO: gặp Liszt "in Rome" tháng 2/1870. Nguồn không nói khách đều là nhạc sĩ.'
- id: n19
  cau: Link chơi thị tấu dẫn tới /opus/piano/thi-tau/.
  loai: ve-site
  ket_qua: dung
  ghi_chu: src/content/docs/piano/thi-tau.md có, đã khóa (khoa.json).
- id: n20
  cau: Grieg sửa bản nhạc nhiều lần; những chỗ sửa cuối cùng ông gửi nhà xuất bản vào mùa hè năm 1907, chỉ vài tuần trước khi mất (4/9/1907).
  loai: lich-su
  nguon:
  - henle-719-vorwort
  - bso
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Grieg sửa bản nhạc ít nhất bảy lần, lần cuối chỉ vài tuần trước khi mất (1907)." Chữ mới như câu. Lý do: không nguồn đã mở nào nói "bảy lần": Henle nói sửa chủ yếu hai đợt (1882, 1906), BSO kể các năm 1872, 1882, 1890, 1895 và bộ sửa cuối gửi "six weeks before his death"; Henle: thư 21/7 và 8/8/1907 gửi bản sửa cho Peters, Grieg mất 4/9/1907.'
- id: n21
  cau: Concerto của Grieg và concerto của Schumann cùng giọng La thứ.
  loai: cau-truc
  nguon:
  - berliner
  - imslp-op16
  ket_qua: dung
  ghi_chu: 'Berliner: "Grieg chose the same key of A minor".'
- id: n22
  cau: Hai concerto cùng mở đầu bằng một cú "đổ" của piano từ trên cao xuống.
  loai: cau-truc
  nguon:
  - ia-tongpho
  ket_qua: null
  ghi_chu: 'chưa chắc: phía Grieg đúng (tổng phổ: piano đổ xuống bằng hợp âm sau tiếng timpani); phía Schumann (Op. 54: hợp âm dàn nhạc rồi piano đi xuống bằng hợp âm chấm) chưa mở được bản nhạc (PDF IMSLP chặn máy, Mutopia không có Op. 54). Lượt 2 đối chiếu bản nhạc Schumann Op. 54.'
- id: n23
  cau: Hai concerto thường được thu chung một đĩa.
  loai: lich-su
  nguon:
  - dg-zimerman
  - mb-lipatti
  - imslp-op16
  ket_qua: dung
  ghi_chu: 'DG: Zimerman/Karajan "Grieg, Schumann Piano Concertos"; MusicBrainz: Lipatti "plays the Grieg and Schumann Piano Concertos" (EMI); IMSLP liệt kê đĩa "In A minor: Piano Concertos by Grieg and Schumann".'
- id: n24
  cau: Grieg học ở Nhạc viện Leipzig; thầy dạy piano của ông là Ernst Ferdinand Wenzel, bạn của Robert Schumann.
  loai: lich-su
  nguon:
  - pbm
  - gnd-wenzel
  - berliner
  ket_qua: dung
  ghi_chu: 'PBM: học piano với Plaidy, Wenzel và Moscheles (Wenzel là một trong các thầy; câu không nói là thầy duy nhất). GND: Wenzel "befreundete sich mit" Schumann, dạy piano ở Nhạc viện Leipzig từ 1843.'
- id: n25
  cau: Trong những năm học ở Leipzig, Grieg được nghe Clara Schumann chơi concerto của chồng tại Gewandhaus.
  loai: lich-su
  nguon:
  - berliner
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "năm 1858 ông được nghe Clara Schumann chơi concerto của chồng ngay tại Leipzig". Chữ mới: "trong những năm học ở đây ông được nghe Clara Schumann chơi concerto của chồng tại Gewandhaus". Lý do: Berliner: Grieg đến Leipzig tháng 10/1858 và "had the opportunity to hear Robert Schumann''s Piano Concerto performed at the Gewandhaus, with Clara Schumann", không ghi năm buổi diễn.'
- id: n26
  cau: Cú "đổ" mở đầu được dựng từ mô-típ ba nốt xuống nửa cung rồi xuống một quãng ba trưởng (La – Sol♯ – Mi), một nét quen trong dân ca Na Uy.
  loai: cau-truc
  nguon:
  - bso
  - stonybrook
  - grainger-1920
  ket_qua: dung
  ghi_chu: 'Grainger tr. 2: La – Sol♯ – Mi lặp xuống qua các quãng tám. La→Sol♯ nửa cung, Sol♯→Mi quãng ba trưởng. BSO: "a descending second followed by a descending third"; Stony Brook: mô-típ phản ánh dân ca Na Uy.'
- id: n27
  cau: 'Bàn phím ::cong-cu{ten="piano" range="C5-C6" notes="A5 G#5 E5"}: ba nốt được tô là La5, Sol♯5, Mi5 (mô-típ của cú "đổ").'
  loai: cau-truc
  nguon:
  - grainger-1920
  - ia-tongpho
  ket_qua: dung
  ghi_chu: 'Bản nhạc (Grainger tr. 2; tổng phổ): tay phải bắt đầu ở La6 (hợp âm có 8va), tay trái cùng lúc ở quãng tám dưới (La5); La5 – Sol♯5 – Mi5 là lần đầu của tay trái, lần thứ hai của tay phải, rồi mô-típ đi xuống tiếp. Ba nốt tô là một lần xuất hiện thật của mô-típ.'
- id: n28
  cau: Chương cuối mang nhịp điệu halling, điệu nhảy dân gian Na Uy nhịp hai, xưa thường do nam giới nhảy, với những động tác nhào lộn như cú đá văng chiếc mũ treo trên cao.
  loai: lich-su
  nguon:
  - berliner
  - bso
  - snl-halling
