doi_chu:
  - cu: 'mô tả: Bản viết tay của Bach đã mất; sáu tổ khúc cho cello còn lại chủ yếu qua bản chép tay của vợ ông, Anna Magdalena. Suốt thế kỷ 19, chúng bị coi là bài tập kỹ…'
    moi: 'mô tả: Bản viết tay của Bach đã mất; sáu tổ khúc cho cello còn lại qua bốn bản chép tay thế kỷ 18, trong đó bản của vợ ông, Anna Magdalena, được coi là gần bản gốc nhất…'
    ly_do: 'Mô tả trang (description): n9, n10; Henle HN 666.'
  - cu: 'Khoảng 1720, ở Köthen'
    moi: 'Theo nhận định chung khoảng 1720, ở Köthen'
    ly_do: 'n3: Henle HN 666 ("generally thought").'
  - cu: 'Pablo Casals (thu 1936–1939); Yo-Yo Ma'
    moi: 'Pablo Casals (HMV, thu 1936–1939; Prelude số 1 thu ở Paris năm 1938); Yo-Yo Ma (CBS Masterworks, thu 1982; Sony Classical, 1997)'
    ly_do: 'n7, n8: MusicBrainz, niên biểu Fundació Pau Casals.'
  - cu: 'Bản viết tay của Bach đã mất; sáu tổ khúc cho cello còn lại chủ yếu qua bản chép tay của vợ ông, Anna Magdalena. Suốt thế kỷ 19, chúng bị coi là bài tập kỹ thuật. Năm 1890, cậu bé 13 tuổi Pablo Casals tình cờ tìm thấy một ấn bản ở một cửa hàng ở Barcelona, tập chúng hơn chục năm trước khi biểu diễn công khai, rồi thu âm trọn bộ cuối những năm 1930. Từ đó chúng trở thành "kinh thánh" của cây cello.'
    moi: 'Bản viết tay của Bach đã mất; sáu tổ khúc cho cello còn lại qua bốn bản chép tay thế kỷ 18, trong đó bản của vợ ông, Anna Magdalena (chép trong khoảng 1727–1731), được coi là gần bản gốc nhất. Bản in đầu tiên ra ở Paris năm 1824. Năm 1890, cậu bé 13 tuổi Pablo Casals tìm thấy một ấn bản (do Friedrich Grützmacher biên tập) ở Barcelona; về sau ông chơi trọn các tổ khúc trước công chúng, điều trước đó chưa ai làm, rồi thu âm cả sáu bản trong các năm 1936–1939 ở London và Paris. Từ Casals, các tổ khúc này có chỗ thường trực trong tiết mục của mọi nghệ sĩ cello.'
    ly_do: 'n9–n16: Henle HN 666, IMSLP, niên biểu Fundació Pau Casals, Gran Enciclopèdia Catalana, MusicBrainz.'
  - cu: 'Thử thách của Bach: viết hòa âm cho một nhạc cụ chủ yếu chỉ chơi được một nốt mỗi lúc. Lời giải là hợp âm rải: các nốt của hợp âm vang lên lần lượt, tai người nghe tự ghép chúng lại. Giống Prelude cung Đô trưởng cho đàn phím, nhưng trên một dây đàn.'
    moi: 'Thử thách của Bach: viết hòa âm cho một nhạc cụ chủ yếu chỉ chơi được một nốt mỗi lúc. Lời giải là hợp âm rải: các nốt của hợp âm vang lên lần lượt, tai người nghe tự ghép chúng lại. Giống Prelude cung Đô trưởng cho đàn phím, nhưng trên một cây đàn dây.'
    ly_do: 'n20: Mutopia BWV 1007 dùng cả bốn dây.'
