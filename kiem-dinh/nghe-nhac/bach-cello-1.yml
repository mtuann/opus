  - id: n9
    cau: 'Bản viết tay của Bach đã mất; sáu tổ khúc còn lại qua bốn bản chép tay thế kỷ 18, trong đó bản của vợ ông, Anna Magdalena (chép trong khoảng 1727–1731), được coi là gần bản gốc nhất.'
    loai: lich-su
    nguon: [ henle-666 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bản viết tay của Bach đã mất; sáu tổ khúc cho cello còn lại chủ yếu qua bản chép tay của vợ ông, Anna Magdalena." Henle: bản viết tay không còn; bốn bản chép tay (A Anna Magdalena 1727–1731, B Kellner 1726, C hai người chép nửa sau thế kỷ 18, D cuối thế kỷ 18) và một bản in; "A is the source with the closest proximity to Bach’s original". "Chủ yếu qua" không đúng: có bốn bản. Mô tả trang viết lại theo câu này. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
