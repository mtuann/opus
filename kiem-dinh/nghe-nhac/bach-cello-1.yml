    cau: 'Hình ::hinh-cau-truc (hinh.nghe của tac-pham/bach-cello-1) ở mục "Sơ đồ cấu trúc": 6 ô theo đúng 6 dòng của bảng "Theo dõi khi nghe", theo thứ tự: Mở đầu (hợp âm rải trên dây Sol buông · I – IV – V – I); Đi xa dần (sang vùng Rê trưởng (giọng át)); Fermata (dừng trên Rê, âm át); Bariolage (nốt La lặp lại xen các nốt khác); Dồn lên (Rê lặp lại, các nốt đi lên nửa cung · nốt cao nhất); Kết (những hợp âm cuối · Sol trưởng). Chú thích: "Tổ khúc cello số 1, Prelude: mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)." Chữ trong ô chép rút gọn chữ của dòng (và đoạn) ấy; không thêm đoạn, tên, giọng hay sự kiện nào ngoài trang; độ rộng và màu ô là cách vẽ.'
