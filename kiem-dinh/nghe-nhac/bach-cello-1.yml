    luot_2_ghi_chu: "Interlude: bản gốc của Bach đã mất. IMSLP: bốn bản chép tay thế kỷ 18 (Anna Magdalena 'ca.1727-31', Kellner ca.1726, Schober và một người chép khuyết danh, và một bản khuyết danh cuối thế kỷ 18). Bärenreiter: năm nguồn (bốn bản chép cộng bản in 1824), bản Anna Magdalena là 'the most reliable of the sources'. Georg Mertens: 'regarded as possibly the closest to the original'. Có người cho rằng bà chép từ một bản trung gian, nên 'được coi là' là cách nói đúng mức."
    review: dung
