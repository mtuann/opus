    ghi_chu: 'Chữ cũ: "Đoạn bariolage: nốt La trên dây buông xen kẽ liên tục với những nốt bấm đi lên, tạo tiếng ngân vang như chuông". Mutopia ô 31–36: La3 (cao độ dây La buông) xen với Fa♯3, Rê3, Mi3, Sol3, rồi Si3, Đô4, Rê4: các nốt khác đi lên rồi đi xuống, không chỉ đi lên. Bản nhạc không ghi dây nào chơi nốt La, nên viết "đúng cao độ dây La buông". COD bariolage: "Rapid alternation of open and stopped str.". Bỏ hình ảnh "như chuông".'
