    luot_2_ghi_chu: "Nguồn mâu thuẫn. Siblin (Grove Atlantic) nói những người biết các tổ khúc 'thought they were more technical exercises than anything fit for the concert hall'. Nhưng The Strad nói từ năm 1824 tới năm 1890 chúng 'had been not only edited and published repeatedly but also performed', có người chơi trọn tổ khúc (Grützmacher 1867, Piatti 1873). Nên viết mềm hơn: 'Suốt thế kỷ 19, các tổ khúc thường bị coi là bài tập kỹ thuật, ít được chơi trong hòa nhạc'."
    review: dung
  - id: n11
    cau: 'Bản in đầu tiên ra ở Paris năm 1824.'
    loai: nam
    nguon: [ imslp-suites, imslp-1007 ]
    ket_qua: da-sua
