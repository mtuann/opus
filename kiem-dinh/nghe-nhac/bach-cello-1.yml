ghi_chu: 'Hướng dẫn nghe Tổ khúc cello số 1 BWV 1007, Prelude (tầng Tác phẩm; bản ghi tac-pham/bach-cello-1; loai: nghe là cấu trúc). Không có khối abc, không có ::hinh-cau-truc; ::khoi-nghe không có bản thu (không sửa). Bản nhạc: Mutopia bwv1007 (Schirmer 1916; .ly tải 06/11/2026), Prelude 42 ô, 4/4, Sol trưởng; cao độ từng ô tính bằng script (relative → tuyệt đối, đã chuyển quãng tám như \transpose c c, của file score): ô 1–4 trên nốt Sol2 (dây Sol buông), ô 22 fermata trên Rê4, ô 31–36 nốt La3 lặp lại, ô 37–38 nốt Rê3 lặp lại xen chuỗi nửa cung Fa3 → Fa♯4, ô 39–40 nốt cao nhất Sol4, ô 42 hợp âm Sol. Lịch sử: lời tựa Henle HN 666 (PDF), IMSLP (wikitext: 7 chương, bản in đầu Janet et Cotelle 1824, Piece Style), niên biểu Fundació Pau Casals, Gran Enciclopèdia Catalana (Casals), MusicBrainz (bản thu Casals EMI/HMV, Yo-Yo Ma CBS 1982, Sony 1997), Concise Oxford Dictionary of Music (sarabande, bariolage, broken chord). Sửa trang: n3, n7–n9, n11, n12, n14–n16, n20, n24–n26, n29, n32 (mục Nguồn), mô tả trang; bỏ n10 ("thế kỷ 19 coi là bài tập kỹ thuật"), n13 ("tập hơn chục năm"). Câu ở hồ sơ khác trỏ tới trang này (nhac-ly/31-hinh-thuc-nho n15, nhac-cu/cello n17, nhan-dien/the-loai n35, lich-su/thoi-ky/baroque n49): trang giữ địa chỉ, là hướng dẫn nghe Tổ khúc cello số 1 của Bach, giữ "Tổ khúc: Prelude và 5 điệu nhảy" và trật tự Prelude – Allemande – Courante – Sarabande – Menuet I và II – Gigue. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: bariolage, hợp âm rải (arpeggio, có ở trang nhạc lý đã khóa), dây buông, sarabande, allemande, courante, gigue, prelude.'
