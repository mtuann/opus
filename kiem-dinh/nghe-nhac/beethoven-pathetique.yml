    luot_2_ghi_chu: 'Hewitt: từ Hy Lạp "pathos" (đau khổ, cảm xúc), không phải nghĩa "đáng thương" hiện nay; BH giải thích "pathetisch" theo nghĩa thời ấy.'
    review: dung
  - id: n19
    cau: 'Khác hẳn Ánh trăng: biệt danh ấy do người khác gợi ra, có lẽ từ truyện Theodor của Ludwig Rellstab, đăng năm 1824.'
    loai: lich-su
    nguon: [ henle-hn1062-vorwort, henle-hn1348-vorwort ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "biệt danh do người khác gợi ra, chỉ phổ biến sau khi Beethoven mất". Henle HN 1062: liên tưởng "Mondscheinsonate" có lẽ bắt nguồn từ truyện Theodor của Rellstab (1823, in 1824), "bald" (chẳng bao lâu) thành biệt danh; không nguồn nào đã mở nói chỉ phổ biến sau năm 1827. Review D6-L5-gom: lượt 2 khong-chac: truyện Theodor đăng năm 1824 (Crumey; Henle HN 1062 ghi 1823 là năm viết, in 1824), không nguồn nào ghi "viết năm 1823". Sửa theo đề nghị của lượt 2, khớp hướng dẫn nghe Ánh trăng (đã khóa: "đăng năm 1824"); doi_chu. Không chạy lại lượt 2. Chữ câu cũ: "Khác hẳn Ánh trăng: biệt danh ấy do người khác gợi ra, có lẽ từ một truyện của Ludwig Rellstab viết năm 1823.".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://crumey.co.uk/beethoven_5_why_moonlight_sonata.html", "https://www.henle.de/media/fc/b2/b2/1697725861/1348-1697725860-sync.pdf" ]
    luot_2_ghi_chu: Henle xác nhận biệt danh "Mondschein" có sau. Nhưng truyện "Theodor" của Rellstab được đăng nhiều kỳ mùa hè 1824 (Berliner allgemeine musikalische Zeitung) theo Crumey; không tìm được nguồn nói viết năm 1823. Nên ghi "đăng năm 1824".
    review: dung
