  loai: so-lieu
  nguon: [imslp-op13]
  ket_qua: dung
  ghi_chu: 'IMSLP: "Average Duration 19-20 minutes". Hewitt (nhắc lại từ Grave) 21:36 theo MusicWeb; khoảng ghi trên trang là ước chừng.'
- id: n10
  cau: Năm 1798, Beethoven 27 tuổi.
  loai: nam
  nguon: [henle-hn1348-vorwort]
  ket_qua: dung
  ghi_chu: Sinh 12/1770.
- id: n11
  cau: Lúc ấy ông đã nổi tiếng ở Vienna như một nghệ sĩ piano, nhất là tài ứng tác.
  loai: lich-su
  nguon: [beethoven-haus-pianist]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ (cả description): "nổi tiếng ở Vienna trước hết như một nghệ sĩ piano ứng tác dữ dội". Beethoven-Haus: danh tiếng nghệ sĩ piano một phần nhờ tài ứng tác; "trước hết", "dữ dội" không nguồn.'
- id: n12
  cau: Sonata này nhanh chóng được yêu thích.
  loai: lich-su
  nguon: [henle-hn1348-vorwort, schindler-moscheles]
  ket_qua: dung
  ghi_chu: Henle dẫn bài điểm báo AmZ 19/2/1800 khen ngợi; có bản in lại của Hoffmeister & Kühnel (1802) và Eder (1800/01).
- id: n13
  cau: Ignaz Moscheles kể rằng năm 1804, lúc mới 10 tuổi, ông phải chép tay bản nhạc ở thư viện vì không đủ tiền mua.
  loai: lich-su
  nguon: [schindler-moscheles, loc-moscheles]
  ket_qua: dung
  ghi_chu: 'Moscheles: "I found there Beethoven''s Sonate pathétique. This was in the year 1804. My pocket-money would not suffice for the purchase of it, so I secretly copied it." LoC: sinh 1794, nên năm 1804 khoảng 10 tuổi.'
- id: n14
  cau: Trang bìa bản in đầu tiên ghi Grande Sonate pathétique.
  loai: ten
  nguon: [henle-hn1348-vorwort, beethoven-haus-op13]
  ket_qua: dung
- id: n15
  cau: Theo Beethoven-Haus Bonn và ấn bản Urtext của Henle, chính Beethoven chọn tên này.
  loai: lich-su
  nguon: [beethoven-haus-op13, henle-hn1348-vorwort]
  ket_qua: dung
  ghi_chu: 'Beethoven-Haus: "Beethoven himself gave it the title Grande Sonate pathétiqu[e]"; Henle: "the only one that Beethoven himself gave a distinctive name" (cùng Les Adieux).'
- id: n16
  cau: Cùng với Les Adieux Op. 81a, đây là một trong hai sonata piano có tên gọi từ tác giả.
  loai: lich-su
  nguon: [henle-hn1348-vorwort, beethoven-haus-op13]
  ket_qua: dung
- id: n17
  cau: Vài tài liệu khác cho rằng nhà xuất bản đặt tên và Beethoven đồng ý.
  loai: lich-su
  nguon: []
  ket_qua: da-bo
  ghi_chu: 'Đã bỏ khỏi trang: không nguồn đã mở nói vậy; Henle, Beethoven-Haus, Hewitt đều nói Beethoven tự đặt.'
- id: n18
  cau: Pathétique không có nghĩa "thảm hại" mà là "đầy bi cảm", gốc từ chữ Hy Lạp pathos.
  loai: dinh-nghia
  nguon: [hyperion-hewitt]
  ket_qua: da-sua
  ghi_chu: 'Hewitt: "The word comes from the Greek pathos, meaning suffering, experience, emotion"; nghĩa "pitiable" chỉ là nghĩa hiện đại. Chữ cũ "gốc từ chữ pathos trong kịch Hy Lạp": vế "trong kịch" không nguồn, bỏ.'
- id: n19
  cau: 'Khác hẳn Ánh trăng: biệt danh ấy do người khác gợi ra, có lẽ từ một truyện của Ludwig Rellstab viết năm 1823.'
  loai: lich-su
  nguon: [henle-hn1062-vorwort, henle-hn1348-vorwort]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "biệt danh do người khác gợi ra, chỉ phổ biến sau khi Beethoven mất". Henle HN 1062: liên tưởng "Mondscheinsonate" có lẽ bắt nguồn từ truyện Theodor của Rellstab (1823, in 1824), "bald" (chẳng bao lâu) thành biệt danh; không nguồn nào đã mở nói chỉ phổ biến sau năm 1827.'
- id: n20
  cau: Link hướng dẫn nghe Ánh trăng (/opus/nghe-nhac/beethoven-moonlight/).
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: Chưa chuyển; ../opus-zero/docs/nghe-nhac/beethoven-moonlight.md có ("sắp có").
- id: n21
  cau: Chương 1 có tên Grave – Allegro di molto e con brio.
  loai: ten
  nguon: [mut-op13-1, imslp-op13]
  ket_qua: dung
- id: n22
  cau: 'Mở đầu là phần chậm Grave: hợp âm Đô thứ nặng, tương phản đột ngột mạnh – nhỏ (fp), nhịp chấm dôi và những tiếng thở dài.'
  loai: cau-truc
  nguon: &id001 [mut-op13-1]
  ket_qua: dung
  ghi_chu: 'Ô 1: <c g ef>4 \fp ~ … c16. c32 (chấm dôi); các mảnh hai nốt có luyến đi xuống.'
- id: n23
  cau: Một chuỗi nốt chạy xuống rất nhanh lao vào phần Allegro.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Ô 10: móc năm, móc sáu đi xuống (\times 8/7 { a128 af g fs f e ef }) trước "attacca subito il Allegro".'
- id: n24
  cau: 'Chủ đề Allegro: tay phải vút lên qua hai quãng tám, trên tremolo quãng tám rải không ngừng của tay trái.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: Ô 11–15 tay phải C4 → C6; tay trái c8 c' c, c' … (quãng tám rải).
- id: n25
  cau: Chủ đề thứ hai ở Mi♭ thứ chứ không phải Mi♭ trưởng như thường lệ.
  loai: cau-truc
  nguon: [mut-op13-1, hyperion-hewitt]
  ket_qua: dung
  ghi_chu: 'Ô 51: bf ef f gf (Sol♭) trên <ef gf>: Mi♭ thứ. "Như thường lệ": chủ đề 2 của sonata giọng thứ thường ở giọng trưởng song song (relative), như OMT Sonata Form.'
- id: n26
  cau: Ở chủ đề 2, giai điệu nhảy qua lại giữa âm vực trầm và những nốt láy ở âm vực cao, vượt qua phần đệm ở giữa, nên hai tay liên tục vắt chéo.
  loai: cau-truc
  nguon: [mut-op13-1, hyperion-hewitt]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tay trái liên tục vắt qua tay phải để chơi những nốt láy ở âm vực cao". Mutopia (Schirmer 1894): các nốt láy ở cao nằm ở khuông trên cùng với các nốt trầm của giai điệu, khuông dưới giữ Si♭ và hợp âm ở giữa; không rõ tay nào chơi nốt láy. Hewitt: "some rather perilous hand-crossing". Viết lại không nói tay nào.'
- id: n27
  cau: Phần trình bày khép lại ở Mi♭ trưởng.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'thIId: g4 ef''2 … ef4 ef,2 \f <g df>4 … Mi♭ trưởng tới dấu nhắc.'
- id: n28
  cau: Phần Grave quay lại hai lần, ở đầu phần phát triển và trong coda.
  loai: cau-truc
  nguon: [mut-op13-1, henle-hn1348-vorwort]
  ket_qua: dung
  ghi_chu: 'Mutopia: theme III (Grave) sau dấu nhắc, theme X (Grave) trước coda. Henle dẫn báo 1807: "The Grave returns within it with a few measures twice".'
- id: n29
  cau: Link hình thức sonata (/opus/hinh-thuc/sonata/).
  loai: ve-site
  nguon: []
  ket_qua: dung
