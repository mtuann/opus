doi_chu:
  - cu:
      - 'Năm 1798, Beethoven 27 tuổi, nổi tiếng ở Vienna trước hết như một nghệ sĩ piano ứng tác dữ dội. Sonata này nhanh chóng được yêu thích: Ignaz Moscheles kể rằng năm 1804, lúc mới 10 tuổi, ông phải chép tay bản nhạc ở thư viện vì không đủ tiền mua.'
      - Ai đặt tên Pathétique? Trang bìa bản in đầu tiên ghi Grande Sonate pathétique. Theo Beethoven-Haus Bonn và ấn bản Urtext của Henle, chính Beethoven chọn tên này; cùng với Les Adieux Op. 81a, đây là một trong hai sonata piano có tên gọi từ tác giả (vài tài liệu khác cho rằng nhà xuất bản đặt và Beethoven đồng ý). Pathétique ở đây không có nghĩa "thảm hại" mà là "đầy bi cảm", gốc từ chữ pathos trong kịch Hy Lạp. Khác hẳn Ánh trăng, biệt danh do người khác gợi ra, chỉ phổ biến sau khi Beethoven mất (hướng dẫn nghe).
      - 'Chương 1, Grave – Allegro di molto e con brio. Mở đầu là một phần chậm (Grave): hợp âm Đô thứ nặng nề, tương phản đột ngột giữa mạnh và nhỏ (fp), nhịp chấm dôi và những tiếng thở dài. Một chuỗi nốt chạy xuống rất nhanh lao vào phần Allegro: chủ đề tay phải vút lên qua hai quãng tám, trên tiếng rung quãng tám rải không ngừng của tay trái, như tremolo của bộ dây. Chủ đề thứ hai bất ngờ ở Mi♭ thứ chứ không phải Mi♭ trưởng như thường lệ; tay trái liên tục vắt qua tay phải để chơi những nốt láy ở âm vực cao. Phần trình bày khép lại ở Mi♭ trưởng. Điều mới mẻ nhất: phần Grave quay lại hai lần, ở đầu phần phát triển và trong coda, nên lời mở đầu chậm trở thành một nhân vật của câu chuyện. Xem lại hình thức sonata.'
      - 'Chương 2, Adagio cantabile (La♭ trưởng, nhịp 2/4) là một trong những giai điệu đẹp nhất Beethoven viết. Lần đầu, giai điệu hát ở âm vực trầm ấm quanh Đô giữa (C4), trên một dòng móc kép êm ở bè giữa và bè trầm bên dưới: ba lớp âm thanh trong hai bàn tay. Rồi nó được nhắc lại cao hơn một quãng tám. Chương có dạng rondo A–B–A–C–A: đoạn xen thứ nhất ở giọng thứ, như lời than; đoạn xen thứ hai ở La♭ thứ, phần đệm chuyển sang nhịp chùm ba, rồi trượt bất ngờ sang Mi trưởng. Lần trở lại cuối cùng, phần đệm giữ nhịp chùm ba ấy, dày và ấm hơn.'
    moi:
      - 'Năm 1798, Beethoven 27 tuổi, đã nổi tiếng ở Vienna như một nghệ sĩ piano, nhất là tài ứng tác. Sonata này nhanh chóng được yêu thích: Ignaz Moscheles kể rằng năm 1804, lúc mới 10 tuổi, ông phải chép tay bản nhạc ở thư viện vì không đủ tiền mua.'
      - 'Ai đặt tên Pathétique? Trang bìa bản in đầu tiên ghi Grande Sonate pathétique. Theo Beethoven-Haus Bonn và ấn bản Urtext của Henle, chính Beethoven chọn tên này; cùng với Les Adieux Op. 81a, đây là một trong hai sonata piano có tên gọi từ tác giả. Pathétique ở đây không có nghĩa "thảm hại" mà là "đầy bi cảm", gốc từ chữ Hy Lạp pathos. Khác hẳn Ánh trăng: biệt danh ấy do người khác gợi ra, có lẽ từ truyện Theodor của Ludwig Rellstab, đăng năm 1824 (hướng dẫn nghe).'
      - 'Chương 1, Grave – Allegro di molto e con brio. Mở đầu là một phần chậm (Grave): hợp âm Đô thứ nặng nề, tương phản đột ngột giữa mạnh và nhỏ (fp), nhịp chấm dôi và những tiếng thở dài. Một chuỗi nốt chạy xuống rất nhanh lao vào phần Allegro: chủ đề tay phải vút lên qua hai quãng tám, trên tiếng rung quãng tám rải không ngừng của tay trái, như tremolo của bộ dây. Chủ đề thứ hai bất ngờ ở Mi♭ thứ chứ không phải Mi♭ trưởng như thường lệ; giai điệu nhảy qua lại giữa âm vực trầm và những nốt láy ở âm vực cao, vượt qua phần đệm ở giữa, nên hai tay liên tục vắt chéo nhau. Phần trình bày khép lại ở Mi♭ trưởng. Điều mới mẻ nhất: phần Grave quay lại hai lần, ở đầu phần phát triển và trong coda, nên lời mở đầu chậm trở thành một nhân vật của câu chuyện. Xem lại hình thức sonata.'
      - 'Chương 2, Adagio cantabile (La♭ trưởng, nhịp 2/4). Lần đầu, giai điệu hát ở âm vực trầm ấm quanh Đô giữa (C4), trên một dòng móc kép êm ở bè giữa và bè trầm bên dưới: ba lớp âm thanh trong hai bàn tay. Rồi nó được nhắc lại cao hơn một quãng tám. Chương có dạng rondo A–B–A–C–A: đoạn xen thứ nhất ở giọng thứ, như lời than; đoạn xen thứ hai ở La♭ thứ, phần đệm chuyển sang nhịp chùm ba, rồi trượt bất ngờ sang Mi trưởng. Lần trở lại cuối cùng, phần đệm giữ nhịp chùm ba ấy, dày và ấm hơn.'
    ly_do: 'n11 (da-sua): "trước hết", "dữ dội" không nguồn; Beethoven-Haus: danh tiếng nghệ sĩ piano nhờ tài ứng tác. n17 (da-bo), n18 (da-sua), n19 (da-sua): Henle, Beethoven-Haus, Hewitt. n26 (da-sua): Mutopia không cho biết tay nào chơi nốt láy; Hewitt: "perilous hand-crossing". n31 (da-bo): đánh giá không nguồn. Review D6-L5-gom: n19, truyện Theodor đăng năm 1824 (lượt 2; khớp hướng dẫn nghe Ánh trăng đã khóa).'
  - cu: Nghe bằng tai người chơi piano. Năm 1798, Beethoven chơi trên đàn Vienna khoảng năm quãng tám, tiếng mỏng và tắt nhanh (xem lịch sử cây đàn piano), nhưng ông viết cho nó như viết cho dàn nhạc. Trên đàn hiện đại, cái khó là giữ tremolo tay trái nhẹ và đều suốt nhiều trang mà không cứng cổ tay, và trong Adagio, cân bằng ba lớp để giai điệu luôn nổi trên dòng móc kép (xem tạo tiếng đàn).
    moi: Nghe bằng tai người chơi piano. Đàn kiểu Vienna thời ấy chỉ có âm vực khoảng năm quãng tám (xem lịch sử cây đàn piano). Trên đàn hiện đại, cái khó là giữ tremolo tay trái nhẹ và đều suốt nhiều trang mà không cứng cổ tay, và trong Adagio, cân bằng ba lớp để giai điệu luôn nổi trên dòng móc kép (xem tạo tiếng đàn).
    ly_do: 'n41 (da-sua): Tafelmusik chỉ nói âm vực.'
  - cu: 'Chủ đề 2: Mi♭ thứ, tay trái vắt qua lại với những nốt láy; rồi phần trình bày khép lại ở Mi♭ trưởng'
    moi: 'Chủ đề 2: Mi♭ thứ, hai tay vắt chéo, giai điệu có những nốt láy; rồi phần trình bày khép lại ở Mi♭ trưởng'
    ly_do: 'n47 (da-sua): như chủ đề 2 ở trên.'
  - cu:
      - 'Emil Gilels: tiếng đàn lớn, sâu, kiến trúc vững chãi; phần Grave như tạc bằng đá.'
      - 'Angela Hewitt: khi nhắc lại phần trình bày, bà quay về tận phần Grave, vì Beethoven không hề ghi rằng chỉ nhắc lại phần Allegro; đa số nghệ sĩ chỉ quay về đầu Allegro.'
      - 'Ronald Brautigam (fortepiano): tiếng đàn thời Beethoven; tremolo và hợp âm fp gắt, kịch tính hơn.'
    moi:
      - 'Emil Gilels: nghe phần Grave: nặng và chậm đến đâu, các hợp âm fp tương phản thế nào?'
      - 'Angela Hewitt: khi nhắc lại phần trình bày, bà quay về tận phần Grave, vì Beethoven không hề ghi rằng chỉ nhắc lại phần Allegro (theo bà, chỗ ấy do một nhà xuất bản thêm về sau); Rudolf Serkin cũng làm vậy.'
      - 'Ronald Brautigam (fortepiano, loại đàn thời Beethoven): tremolo và hợp âm fp nghe khác đàn hiện đại thế nào?'
    ly_do: 'n55: đánh giá không nguồn đổi thành câu hỏi nghe. n56 (da-sua): theo lời giới thiệu của Hewitt (Hyperion). n57: đánh giá không nguồn đổi thành câu hỏi nghe. Review D6-L5-gom: n19, truyện Theodor đăng năm 1824 (lượt 2; khớp hướng dẫn nghe Ánh trăng đã khóa).'
  - cu: 'Adagio cantabile là chương dễ nhất, khoảng Grade 7, và là cửa ngõ tuyệt vời vào Beethoven: ít nốt nhanh, nhưng đòi hỏi legato, cân bằng các bè và bàn đạp sạch. Bắt đầu từ bài học Adagio. Rondo khoảng Grade 8. Chương 1 khó nhất vì tremolo quãng tám bền bỉ, vắt tay và tốc độ; hãy để sau cùng. Một chương chậm khác để tập: chương 1 Ánh trăng. Xem Tác phẩm theo cấp độ.'
    moi: 'Adagio cantabile, khoảng Grade 7–8 (ABRSM xếp chương này ở Grade 8), là cửa ngõ tuyệt vời vào Beethoven: ít nốt nhanh, nhưng đòi hỏi legato, cân bằng các bè và bàn đạp sạch. Bắt đầu từ bài học Adagio. Rondo cũng được ABRSM xếp ở Grade 8. Chương 1 đòi tremolo quãng tám bền bỉ, vắt tay và tốc độ; hãy để sau cùng. Một chương chậm khác để tập: chương 1 Ánh trăng. Xem Tác phẩm theo cấp độ.'
    ly_do: 'n59 (da-sua), n62 (da-sua), n63 (da-sua): theo đề cương ABRSM 2023–2028, RCM 2022.'
