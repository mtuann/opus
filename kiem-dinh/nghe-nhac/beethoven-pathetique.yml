    cau: Ở chủ đề 2, giai điệu nhảy qua lại giữa âm vực trầm và những nốt láy ở âm vực cao, vượt qua phần đệm ở giữa, nên hai tay liên tục vắt chéo.
    loai: cau-truc
    nguon: [ mut-op13-1, hyperion-hewitt ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tay trái liên tục vắt qua tay phải để chơi những nốt láy ở âm vực cao". Mutopia (Schirmer 1894): các nốt láy ở cao nằm ở khuông trên cùng với các nốt trầm của giai điệu, khuông dưới giữ Si♭ và hợp âm ở giữa; không rõ tay nào chơi nốt láy. Hewitt: "some rather perilous hand-crossing". Viết lại không nói tay nào. Review D6-L5-gom: lượt 1 đã sửa; lượt 2 xác nhận chữ mới; review đọc lại chữ trang, khớp câu.'
    luot_2: dung
