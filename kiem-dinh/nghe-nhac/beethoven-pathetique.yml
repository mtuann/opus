    ket_qua: da-sua
    ghi_chu: 'Hewitt: "The word comes from the Greek pathos, meaning suffering, experience, emotion"; nghĩa "pitiable" chỉ là nghĩa hiện đại. Chữ cũ "gốc từ chữ pathos trong kịch Hy Lạp": vế "trong kịch" không nguồn, bỏ. Review D6-L5-gom: lượt 1 đã sửa; lượt 2 xác nhận chữ mới; review đọc lại chữ trang, khớp câu.'
    luot_2: dung
