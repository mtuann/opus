    ghi_chu: 'Câu mới, để "ra mắt chính thức" không bị hiểu là buổi diễn đầu tiên. Tchaikovsky Research: "at least two earlier performances … on 8/20 July 1882 in Ozerki … and on 31 July/12 August 1882 in Pavlovsk". Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: 8/20/7/1882 ở Ozerki và 31/7/12/8/1882 ở Pavlovsk.
    review: dung
  - id: n17
    cau: 'Tchaikovsky kể lại cuộc chiến bằng âm nhạc, với hai "phe" được đại diện bằng hai bài quốc ca của thời ông.'
    loai: lich-su
    nguon: [ tr-1812, oup-blog ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ không có "của thời ông". Lý do: God Save the Tsar viết năm 1833 (Tchaikovsky Research), OUP: "national anthem during Tchaikovsky''s lifetime", nên năm 1812 chưa phải quốc ca. Tác phẩm "commemorates Russia''s defeat of Napoleon in 1812" và trích hai bài (Tchaikovsky Research); OUP kể lại diễn biến theo hai phe. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: Tác phẩm trích La Marseillaise và quốc ca Nga "God Save the Tsar" (1833); thời Tchaikovsky đó là hai bài quốc ca.
    review: dung
  - id: n18
    cau: 'Phe Pháp (quân xâm lược): quốc ca Pháp La Marseillaise.'
    loai: cau-truc
    nguon: [ tr-1812, ia-muzyka ]
    ket_qua: dung
    ghi_chu: 'Tchaikovsky Research: "quotations … from the French anthem La Marseillaise"; tổng phổ ô 119, horn.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812", "https://archive.org/details/31761034924530" ]
    luot_2_ghi_chu: "Trích La Marseillaise ở các ô 119, 149, 229, 267, 307; tổng phổ ô 119–120: kèn horn a2, f marc."
  - id: n19
    cau: 'Phe Nga: lời cầu nguyện Lạy Chúa, xin cứu dân Ngài (cầu chiến thắng nơi chiến trận), hai giai điệu Nga, rồi cuối cùng là quốc ca Nga hoàng God Save the Tsar! (bài này viết năm 1833).'
    loai: cau-truc
    nguon: [ tr-1812, oup-blog ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bài thánh ca Chính thống giáo, rồi cuối cùng là quốc ca Nga hoàng "God Save the Tsar!"". Lý do: Tchaikovsky Research: chủ đề mở đầu "based on the Russian prayer for victory in battle ''Lord, preserve thy people''"; chưa mở được nguồn bậc 1–2 nói "Chính thống giáo" (lượt 2 của hinh-thuc/overture n19 cũng ghi vậy), nên viết theo nguồn; không trái trang đã khóa hinh-thuc/overture ("thánh ca Chính thống giáo của Nga"), chỉ cụ thể hơn. Thêm hai giai điệu Nga (giai điệu trữ tình từ opera The Voyevoda và dân ca By the Gates, Tchaikovsky Research) và năm 1833 của God Save the Tsar (Lvov). Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: Chủ đề mở đầu theo lời cầu nguyện "Lord, preserve thy people"; chủ đề trữ tình (từ The Voyevoda) và dân ca "By the Gates"; "God Save the Tsar" của Lvov (1833) ở ô 388–398.
    review: dung
  - id: n20
    cau: 'Marseillaise trở lại nhiều lần, rồi lần cuối ở cao trào, sau đó tiếng đại bác nổ và dàn nhạc đổ xuống.'
    loai: cau-truc
    nguon: [ tr-1812, ia-muzyka ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Marseillaise xuất hiện ngày càng dồn dập, bị nhạc Nga lấn át dần, và cuối cùng sụp đổ trong đoạn kết hoành tráng với tiếng đại bác thật (trong các buổi diễn ngoài trời) và chuông nhà thờ". Lý do: Tchaikovsky Research ghi năm lần trích Marseillaise (ô 119, 149, 229, 267, 307), không nói "ngày càng dồn dập" hay "sụp đổ trong đoạn kết"; tổng phổ: đại bác nổ lần đầu ở [15] (khoảng ô 327), sau lần trích cuối, rồi dàn nhạc đi xuống, chậm dần (khoảng ô 343–357) trước Largo; đoạn kết không có Marseillaise. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812", "https://archive.org/details/31761034924530" ]
    luot_2_ghi_chu: "Marseillaise ở năm chỗ; tổng phổ 1983: cao trào với Cannone, marcatissimo, rồi đoạn đi xuống, sempre rallentando, trước khi lời cầu nguyện trở lại."
    review: dung
  - id: n21
    cau: 'Lời cầu nguyện mở đầu trở lại cùng chuông, và tác phẩm khép bằng God Save the Tsar! với chuông và đại bác.'
    loai: cau-truc
    nguon: [ tr-1812, ia-muzyka, oup-blog ]
    ket_qua: da-sua
    ghi_chu: 'Câu mới thay phần cuối của câu cũ (n20). Tchaikovsky Research: chủ đề mở đầu trở lại ô 358–379, God Save the Tsar ô 388–398; tổng phổ: [16] Largo, Campane rung, cả dàn nhạc và Banda fff; coda Allegro vivace có Cannone; OUP: God Save the Tsar "accompanied by the last cannon blasts". Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812", "https://archive.org/details/31761034924530" ]
    luot_2_ghi_chu: Chủ đề mở đầu trở lại ở ô 358–379; tổng phổ 1983 có dòng C-ne (Campane, chuông) rung ở đoạn này; coda có God Save the Tsar (ô 388–398) với chuông và đại bác.
    review: dung
  - id: n22
    cau: 'Tổng phổ ghi "đại bác", nhưng Tchaikovsky muốn dùng chiếc trống lớn treo mà nhà hát vẫn dùng để giả tiếng đại bác.'
    loai: lich-su
    nguon: [ tr-1812 ]
    ket_qua: da-sua
    ghi_chu: 'Câu mới thay "tiếng đại bác thật (trong các buổi diễn ngoài trời)". Tchaikovsky Research: ghi chú trong tổng phổ tay "The instrument used in theatres to depict a cannon shot"; thư gửi Jurgenson 4/16/3/1882: "the large suspended drum which is beaten like a gran cassa … this is not a real cannon, but a drum". Khớp hinh-thuc/overture n17 (đã khóa: tổng phổ có phần cho chuông và đại bác; bỏ vế đại bác thật). Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: 'Bản thảo ghi "The instrument used in theatres to depict a cannon shot"; thư cho Jurgenson: "the large suspended drum which is beaten like a gran cassa", "not a real cannon, but a drum".'
    review: dung
  - id: n23
    cau: 'Ở các buổi diễn ngoài trời, như đêm 4/7 của Boston Pops từ năm 1974, người ta dùng đại bác thật.'
    loai: lich-su
    nguon: [ globe-1998, bostoncom-2015 ]
    ket_qua: da-sua
    ghi_chu: 'Câu viết lại từ vế "(trong các buổi diễn ngoài trời)" của câu cũ, thêm ví dụ có nguồn. Boston Globe 1998: Pops chơi 1812 "with cannons, fireworks, and the tolling of the city''s church bells", bắt đầu năm 1974 dưới Fiedler; Boston.com 2015: "complete with howitzer cannons". Hai nguồn là báo, bậc 2 cho sự kiện. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bso.org/stories/in-memory-of-david-mugar" ]
    luot_2_ghi_chu: "BSO: năm 1973 David Mugar đề nghị Fiedler thêm 1812 Overture, pháo hoa, chuông nhà thờ và đại bác cho buổi hòa nhạc; Mugar tổ chức lễ 4/7 từ 1974 đến 2016."
    review: dung
  - id: n24
    cau: 'Lúc viết, Tchaikovsky cho rằng overture "sẽ rất to và ồn ào", và vì viết không có tình cảm nồng nhiệt nên có lẽ thiếu giá trị nghệ thuật.'
    loai: lich-su
    nguon: [ tr-1812 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tchaikovsky thực ra không mấy thích tác phẩm này — ông gọi nó là ồn ào". Lý do: thư gửi von Meck 8/20–10/22/10/1880: "The Overture will be very loud and noisy—but I wrote it without any warm and loving feelings, and consequently it will probably be lacking in artistic merit"; năm 1882 ông lại viết cho Jurgenson rằng "I rather think it is the former" (tức là hay), nên "không mấy thích" chung chung không đúng cho mọi lúc; ghi rõ thời điểm. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: 'Thư 1609 gửi von Meck: "The Overture will be very loud and noisy—but I wrote it without any warm and loving feelings, and consequently it will probably be lacking in artistic merit".'
    review: dung
  - id: n25
    cau: 'Từ buổi ra mắt, overture luôn nằm trong số tác phẩm được biết đến và được diễn nhiều nhất của Tchaikovsky; chính ông chỉ huy nó 13 lần, nhiều hơn mọi tác phẩm khác của mình.'
    loai: lich-su
    nguon: [ tr-1812 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhưng nó trở thành một trong những bản nhạc Nga nổi tiếng nhất thế giới" (đánh giá, không kiểm được). Tchaikovsky Research: "Ever since its premiere, the overture has been among the best-known and most frequently performed of Tchaikovsky''s works"; "Tchaikovsky conducted 1812 a total of thirteen times — more than any of his other works". Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: '"Ever since its premiere, the overture has been among the best-known and most frequently performed"; "Tchaikovsky conducted 1812 a total of thirteen times — more than any of his other works".'
    review: dung
  - id: n26
    cau: 'Bảng Theo dõi, dòng 1: mở đầu chậm (Largo): lời cầu nguyện Lạy Chúa, xin cứu dân Ngài, viola và cello chơi một mình, rồi kèn gỗ đáp.'
    loai: cau-truc
    nguon: [ ia-muzyka, tr-1812, oup-blog ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mở đầu trầm lắng: bài thánh ca Chính thống giáo (dây và kèn gỗ) — nước Nga yên bình". Lý do: tổng phổ: Largo, chỉ 2 viola và 4 cello solo (tr. 3), rồi kèn gỗ (sáo, oboe, cor anglais, clarinet, bassoon) xen vào (tr. 4); "dây" chung chung dễ hiểu là cả dàn dây; "nước Nga yên bình" là cảm nhận (hinh-thuc/overture n19 cũng bỏ). Tên bài theo n19. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/31761034924530", "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: 'Tổng phổ 1983 tr. 3: Largo, "2 sole" viola và "4 soli" cello chơi một mình; tr. 4: flute, oboe, cor anglais, clarinet, bassoon đáp. Lượt 1 hỏi về nhãn "C-ne": ở tổng phổ này nhạc cụ gõ ghi riêng "Cann." (Cannone) và "C-ne" (Campane, chuông) nên C-ne là chuông.'
    review: dung
  - id: n27
    cau: 'Dòng 2: nhịp quân hành (Andante): oboe, clarinet và kèn horn chơi một hiệu kèn trên tiếng trống con rền.'
    loai: cau-truc
    nguon: [ ia-muzyka ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tiếng kèn trận xa dần: quân Pháp tiến đến". Lý do: tổng phổ [3] Andante: oboe, clarinet, horn chơi hình móc kép chấm (mf) trên Tamburo (trống con) rền và timpani; không có chỉ dẫn nhỏ dần ("xa dần" sai), và chưa mở được nguồn bậc 1–2 nói đoạn này là "quân Pháp tiến đến"; viết theo bản nhạc. OUP nói trống con "long a musical indicator of the military". Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/31761034924530" ]
    luot_2_ghi_chu: "Tổng phổ 1983 tr. 14, số 3 Andante: oboe, clarinet và horn chơi hiệu kèn trên bè Tamburo (trống con). Trống con chơi hình tiết tấu đều chứ không chỉ một tiếng rền; câu vẫn đúng về ý."
    review: dung
  - id: n28
    cau: 'Dòng 3: Allegro giusto: dàn dây đuổi nhau dồn dập; rồi kèn horn chơi một đoạn La Marseillaise — phe Pháp.'
    loai: cau-truc
    nguon: [ ia-muzyka, tr-1812 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "La Marseillaise vang lên — phe Pháp". Thêm phần mở đầu Allegro giusto mà bảng cũ bỏ qua (tổng phổ [4] Allegro giusto ♩=138, dàn dây vào lần lượt, f) và nhạc cụ chơi Marseillaise lần đầu (ô 119, horn "f marc."; Tchaikovsky Research: lần trích đầu ô 119). Không thêm dòng. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/31761034924530" ]
    luot_2_ghi_chu: "Số 4 Allegro giusto: dàn dây chạy móc kép dồn dập; ô 119–120 horn a2 f marc. chơi đầu La Marseillaise."
    review: dung
  - id: n29
    cau: 'Dòng 4: hai giai điệu Nga: giai điệu trữ tình ở violin và viola, rồi bài dân ca Bên cổng ở sáo và cor anglais, trên tiếng trống lục lạc.'
    loai: cau-truc
    nguon: [ ia-muzyka, tr-1812 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhạc Nga đáp trả, hai bên giằng co". Lý do: ở chỗ này (ô 164, 207) không có Marseillaise; đó là hai giai điệu Nga liền nhau (Tchaikovsky Research: giai điệu trữ tình từ opera The Voyevoda ô 164, dân ca "By the Gates" ô 207). Tổng phổ: [7] L''istesso tempo, violin và viola p; [9] sáo và cor anglais, Tamburino (trống lục lạc) ppp. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/31761034924530", "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: 'Tổng phổ 1983 tr. 39: chủ đề trữ tình ở violin I, II và viola; số 9 (tr. 44): "By the Gates" ở flute và cor anglais trên Tamburino (trống lục lạc).'
    review: dung
  - id: n30
    cau: 'Dòng 5: trận chiến: Marseillaise trở lại nhiều lần, đan với nhạc Nga.'
    loai: cau-truc
    nguon: [ tr-1812, oup-blog ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trận chiến: dàn nhạc dồn dập, hỗn loạn" ("hỗn loạn" là cảm nhận). Tchaikovsky Research: Marseillaise ô 229, 267, 307 xen giai điệu Nga ô 278, 299; OUP: Marseillaise xuất hiện từng đoạn, quân Nga đánh trả. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/The_Year_1812" ]
    luot_2_ghi_chu: Marseillaise trở lại ở ô 229, 267, 307 xen với các chủ đề Nga.
    review: dung
  - id: n31
    cau: 'Dòng 6: cao trào: tiếng đại bác nổ, rồi dàn nhạc đổ xuống, chậm dần.'
    loai: cau-truc
    nguon: [ ia-muzyka ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Marseillaise gãy vụn, sụp đổ". Lý do: tổng phổ: sau lần trích cuối (ô 307), [15] cả dàn nhạc ff với Cannone; rồi các bè đi xuống, "sempre rallentando" (khoảng ô 343–357) trước Largo. "Marseillaise gãy vụn" không thấy trong bản nhạc ở đoạn này; viết theo bản nhạc. Đại bác đầu tiên ở đây (dòng cũ chỉ đặt đại bác ở dòng cuối). Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/31761034924530" ]
    luot_2_ghi_chu: Số 15, marcatissimo, Cann. nổ; tiếp theo đoạn đi xuống, sempre rallentando.
    review: dung
  - id: n32
    cau: 'Dòng 7: đại bác và chuông: lời cầu nguyện mở đầu trở lại, cả dàn nhạc và chuông; rồi phần kết nhanh với God Save the Tsar! và đại bác — chiến thắng.'
    loai: cau-truc
    nguon: [ ia-muzyka, tr-1812 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đại bác và chuông: "God Save the Tsar!" hoành tráng — chiến thắng". Thêm Largo trở lại (Tchaikovsky Research ô 358–379; tổng phổ [16] Largo, Banda, kèn gỗ, kèn đồng fff, Campane) trước coda Allegro vivace (God Save the Tsar ô 388–398, Cannone). Bỏ "hoành tráng" (đánh giá). Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
