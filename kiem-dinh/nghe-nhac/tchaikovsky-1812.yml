doi_chu:
  - cu: Ouverture solennelle "1812", Op. 49, cung Mi♭ trưởng
    moi: Overture lễ hội Năm 1812 (1812 год), Op. 49, cung Mi♭ trưởng
    ly_do: "n4 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: 1880; công diễn 1882 (Moscow)
    moi: Tháng 9–11/1880; ra mắt chính thức ngày 20/8/1882 ở Moscow
    ly_do: "n6 (da-sua), n7 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: Overture hòa nhạc cho dàn nhạc giao hưởng
    moi: Overture hòa nhạc cho dàn nhạc giao hưởng lớn, thêm chuông, "đại bác" và ban nhạc kèn (tùy chọn)
    ly_do: "n9 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: 'Tchaikovsky viết tác phẩm năm 1880, theo gợi ý của Nikolai Rubinstein, cho dịp Triển lãm Nghệ thuật và Công nghiệp toàn Nga ở Moscow; buổi công diễn đầu tiên năm 1882 diễn ra trong một chiếc lều cạnh Nhà thờ Chúa Cứu thế đang xây dở, nhà thờ dựng để tưởng niệm chiến thắng của Nga trước Napoleon năm 1812 (câu chuyện "viết cho lễ khánh thành nhà thờ" là một ngộ nhận phổ biến). Tchaikovsky kể lại cuộc chiến bằng âm nhạc, với hai "phe" được đại diện bằng hai bài quốc ca:'
    moi: 'Tchaikovsky viết tác phẩm từ tháng 9 đến tháng 11/1880, theo đặt hàng của Nikolai Rubinstein, cho Triển lãm Nghệ thuật và Công nghiệp toàn Nga ở Moscow. Trong các dịp được gợi ý lúc đặt hàng có lễ thánh hiến Nhà thờ Chúa Cứu thế, nhà thờ dựng để tưởng niệm chiến thắng của Nga trước Napoleon năm 1812, và bản in đầu ghi overture "viết cho dịp thánh hiến Nhà thờ Chúa Cứu thế". Triển lãm dời sang năm 1882; buổi ra mắt chính thức ngày 20/8/1882 ở hội trường của triển lãm, Ippolit Altani chỉ huy (trước đó đã có hai buổi diễn cùng năm, ở Ozerki và Pavlovsk). Tchaikovsky kể lại cuộc chiến bằng âm nhạc, với hai "phe" được đại diện bằng hai bài quốc ca của thời ông:'
    ly_do: "n2 (da-sua), n6 (da-sua), n7 (da-sua), n11 (da-sua), n12 (da-sua), n13 (da-sua), n15 (da-sua), n16 (da-sua), n17 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu:
      - 'Phe Nga: bài thánh ca Chính thống giáo, rồi cuối cùng là quốc ca Nga hoàng "God Save the Tsar!".'
      - 'Nghe cuộc "đọ sức": Marseillaise xuất hiện ngày càng dồn dập, bị nhạc Nga lấn át dần, và cuối cùng sụp đổ trong đoạn kết hoành tráng với tiếng đại bác thật (trong các buổi diễn ngoài trời) và chuông nhà thờ.'
      - Tchaikovsky thực ra không mấy thích tác phẩm này — ông gọi nó là ồn ào — nhưng nó trở thành một trong những bản nhạc Nga nổi tiếng nhất thế giới.
    moi:
      - 'Phe Nga: lời cầu nguyện Lạy Chúa, xin cứu dân Ngài (cầu chiến thắng nơi chiến trận), hai giai điệu Nga, rồi cuối cùng là quốc ca Nga hoàng "God Save the Tsar!" (bài này thật ra viết năm 1833).'
      - 'Nghe cuộc "đọ sức": Marseillaise trở lại nhiều lần, rồi lần cuối ở cao trào, sau đó tiếng đại bác nổ và dàn nhạc đổ xuống. Lời cầu nguyện mở đầu trở lại cùng chuông, và tác phẩm khép bằng God Save the Tsar! với chuông và đại bác. Tổng phổ ghi "đại bác", nhưng Tchaikovsky muốn dùng chiếc trống lớn treo mà nhà hát vẫn dùng để giả tiếng đại bác; ở các buổi diễn ngoài trời, như đêm 4/7 của Boston Pops từ năm 1974, người ta dùng đại bác thật.'
      - Lúc viết, Tchaikovsky cho rằng overture "sẽ rất to và ồn ào", và vì viết không có tình cảm nồng nhiệt nên có lẽ thiếu giá trị nghệ thuật. Nhưng từ buổi ra mắt, nó luôn nằm trong số tác phẩm được biết đến và được diễn nhiều nhất của ông; chính Tchaikovsky chỉ huy nó 13 lần, nhiều hơn mọi tác phẩm khác của mình.
    ly_do: "n19 (da-sua), n20 (da-sua), n21 (da-sua), n22 (da-sua), n23 (da-sua), n24 (da-sua), n25 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: "Mở đầu trầm lắng: bài thánh ca Chính thống giáo (dây và kèn gỗ) — nước Nga yên bình"
    moi: "Mở đầu chậm (Largo): lời cầu nguyện Lạy Chúa, xin cứu dân Ngài, viola và cello chơi một mình, rồi kèn gỗ đáp"
    ly_do: "n26 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: "Tiếng kèn trận xa dần: quân Pháp tiến đến"
    moi: "Nhịp quân hành (Andante): oboe, clarinet và kèn horn chơi một hiệu kèn trên tiếng trống con rền"
    ly_do: "n27 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: La Marseillaise vang lên — phe Pháp
    moi: "Allegro giusto: dàn dây đuổi nhau dồn dập; rồi kèn horn chơi một đoạn La Marseillaise — phe Pháp"
    ly_do: "n28 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: Nhạc Nga đáp trả, hai bên giằng co
    moi: "Hai giai điệu Nga: giai điệu trữ tình ở violin và viola, rồi bài dân ca Bên cổng ở sáo và cor anglais, trên tiếng trống lục lạc"
    ly_do: "n29 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: "Trận chiến: dàn nhạc dồn dập, hỗn loạn"
    moi: "Trận chiến: Marseillaise trở lại nhiều lần, đan với nhạc Nga"
    ly_do: "n30 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: Marseillaise gãy vụn, sụp đổ
    moi: "Cao trào: tiếng đại bác nổ, rồi dàn nhạc đổ xuống, chậm dần"
