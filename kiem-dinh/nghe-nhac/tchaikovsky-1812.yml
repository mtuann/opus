ghi_chu: 'Không có khuông nhạc. Bảng Theo dõi khi nghe giữ 7 dòng, cùng thứ tự; không có mốc (::khoi-nghe không có moc, bản ghi không có ban_thu). Thuật ngữ trang dùng chưa có trong thuat-ngu.yml: giusto (Allegro giusto), cor anglais, trống con (side drum), trống lục lạc (tambourine), ban nhạc kèn (banda); Largo, Andante, Allegro, overture đã có. Tổng phổ đã đọc: Muzyka, Moskva 1983, bản nghiên cứu (pl. 11838, theo Toàn tập 1961), Internet Archive 31761034924530: bản này thay God Save the Tsar ở coda bằng nhạc khác (Tchaikovsky Research, IMSLP), nên chỗ God Save the Tsar lấy theo Tchaikovsky Research (ô 388–398).'
