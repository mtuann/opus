nguon:
  - id: imslp
    bac: 2
    ten: 'IMSLP, Pictures at an Exhibition (Mussorgsky), wikitext qua api.php: tên khác "Картинки с выставки"; 16 movements (Promenade [I]–[V], Cum mortuis); "Year/Date of Composition=1874 (June 2-22)"; "Dedication=Vladimir Stassov"; "First Publication=1886, Bessel, Plate 1560"; "Piece Style=Romantic"; bản thu "PMLP03722-Quadri.mp3", "Complete Performance", "Bertoglio, Chiara=piano", "Creative Commons Attribution 3.0"; có bản quét bản thảo (Manuscript Scan) và bản Lamm "based solely on Mussorgsky''s holograph"'
    link: https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)
  - id: mut-pictures
    bac: 1
    ten: 'Mutopia Project, Mussorgsky, Pictures at an Exhibition (Knute Snortum; nguồn: ấn bản Pavel Lamm; tệp LilyPond từng bài): hóa biểu, số chỉ nhịp, chỉ dẫn tốc độ, sắc thái (Bydło: pp ở khoảng ô 55, ppp ở cuối; không có sắc thái ở ô 1)'
    link: https://www.mutopiaproject.org/ftp/MussorgskyM/pictures-at-an-exhibition/
  - id: bessel-1886
    bac: 1
    ten: 'Mussorgsky, Tableaux d''une exposition, V. Bessel & Co., St. Petersburg 1886, số bản in 1560 (bản biên tập của Rimsky-Korsakov), bản của Sibley Music Library số hóa trên Internet Archive; lời giới thiệu Nga–Pháp (của Stasov) tr. 2–3; Bydło tr. 12–13 (xem ảnh trang)'
    link: https://archive.org/details/imslp-at-an-exhibition-mussorgsky-modest
  - id: henle-477
    bac: 2
    ten: 'G. Henle Verlag, HN 477 Pictures at an Exhibition: mô tả ("illustrator and architect Viktor A. Hartmann (1834–1873)", "He wrote it in June 1874", "The source of the Henle Urtext edition is the cleanly written autograph"); mức khó từng bài: Gnomus 7, Il vecchio Castello 5, Tuileries 6, Bydlo 5, Ballett der unausgeschlüpften Küken 7, Goldenberg 6, Limoges 8, Catacombae 4, Hütte 7, Heldentor 7'
    link: https://www.henle.de/en/Pictures-at-an-Exhibition/HN-477
  - id: henle-477-vorwort
    bac: 2
    ten: 'G. Henle Verlag, HN 477: lời tựa (Petra Weber-Bockholdt, 1992), PDF: bản thảo ký "Petersburg, 22 June 1874"; trang tên "Dedicated to Vladimir Vasilievich Stasov / Pictures at an Exhibition – Recollections of Victor Hartmann"; Stasov là "the organizer of the exhibition"; bản in đầu Bessel 1886 "in a reading heavily revised by Rimsky-Korsakov"; "six of Hartmann''s pictures are at least available in reproduction" (lời tựa ghi năm sinh Hartmann 1842, khác trang sản phẩm Henle và LoC: 1834)'
    link: https://www.henle.de/media/2b/89/f0/1690886055/0477-1690886055-sync.pdf
  - id: henle-477-comments
    bac: 2
    ten: 'G. Henle Verlag, HN 477: Bemerkungen/Comments, PDF: ghi chú bút chì ở Catacombae ("with dead people in a dead language"); Andante non troppo là "another variant of the Promenade"'
    link: https://www.henle.de/media/b6/54/72/1690886035/0477-1690886035-sync.pdf
  - id: loc-hartmann
    bac: 2
    ten: 'Library of Congress, Gartman, Viktor Aleksandrovich, 1834-1873 (n81058274; "b. May 5, 1834, St. Petersburg, d. Aug. 4, 1873, Moscow; Russian architect, designer and artist"), đọc qua suggest2 của id.loc.gov'
    link: https://id.loc.gov/authorities/names/n81058274.json
  - id: bso-steinberg
    bac: 2
    ten: 'Boston Symphony Orchestra, Pictures at an Exhibition (ghi chú chương trình của Michael Steinberg): Hartmann "his death at only 39 in the summer of 1873"; Stasov "organized a posthumous exhibition … in St. Petersburg in the spring of 1874"; Ravel phối "in the summer of 1922 for Serge Koussevitzky, who introduced the Ravel version at one of his own concerts in Paris on October 22, 1922"; Bessel 1886 "heavily edited by Rimsky-Korsakov"; saxophone alto ở Il vecchio castello; gà con là phác thảo trang phục cho ballet Trilby; Baba Yaga là đồng hồ hình túp lều; cổng Kiev "The gates were never built"'
    link: https://www.bso.org/works/pictures-at-an-exhibition
  - id: wiener-symph
    bac: 2
    ten: 'Wiener Symphoniker, "Pictures at an Exhibition" (Orchestration: Maurice Ravel): "Uraufführung: 19.10.1922, Paris, Théâtre National de l''Opéra; Dirigent: Sergej A. Kusevickij"'
    link: https://www.wienersymphoniker.at/en/opus/pictures-exhibition-orchestration-maurice-ravel
  - id: wss-notes
    bac: 2
    ten: 'Winston-Salem Symphony, ghi chú chương trình Mussorgsky/Ravel: "A bold solo trumpet announces the beginning of the Promenade"; "(Ravel chose to omit one of these)"; Bydło "accompanies the solo tuba"; "The whinings of Schmuyle may be heard in the muted trumpet"; Catacombae "the rough lower brass"; buổi diễn đầu ghi 3/5/1923 (khác hai nguồn trên)'
    link: https://www.wssymphony.org/program-notes/modeste-mussorgsky-pictures-at-an-exhibition/
  - id: ravel-score
    bac: 1
    ten: 'Moussorgsky–Ravel, Tableaux d''une exposition, tổng phổ, Boosey & Hawkes (Édition Russe de Musique 1929), bản số hóa Internet Archive ybimslp01545: trang đầu Promenade (tr. 5 của PDF) giai điệu ở "3 Trombe in Do", f; Promenade ở tr. 5, 25, 42, 56; sau Goldenberg không có Promenade. Chỉ đọc để kiểm, không chép'
    link: https://archive.org/details/ybimslp01545
  - id: stasov-bio
    bac: 1
    ten: 'V. V. Stasov, "Модест Петрович Мусоргский" (tiểu sử, 1881), Wikisource tiếng Nga: chú thích của Stasov: "После смерти В. Гартмана мною была устроена весной 1874 года в залах Академии художеств выставка всех его рисунков и акварелей. Мусоргский … задумал «нарисовать в музыке» лучшие картинки … представив тут и самого себя, прогуливающимся по выставке, радостно или грустно вспоминающим о покойном … (promenade)"; Mussorgsky là thành viên của "могучая кучка"'
    link: https://ru.wikisource.org/wiki/Модест_Петрович_Мусоргский_(Стасов)
  - id: gresham-fw
    bac: 2
    ten: 'Marina Frolova-Walker, "Musorgsky: Pictures at an Exhibition (1874)", bài giảng Gresham College, 24/9/2020 (bản chữ PDF): Hartmann (1834–73); "In February of the following year (1874), Stasov organised an exhibition in memory of Hartmann"; Promenade "is Musorgsky''s self-portrait", "cast in 5/4 (interspersed with some bars of 6/4)"; "Mighty Handful"; niên biểu: 1886 bản Rimsky-Korsakov, 1922 Ravel, 1939 Horowitz soạn lại; bản biếm họa bài Do Thái là cách đọc của Taruskin, tác giả phản bác; cổng Kiev không thành hiện thực; "Amongst the bells, we hear the Promenade one last time"'
    link: https://www.gresham.ac.uk/sites/default/files/2020-09-24_Frolova-Walker_Musorgsky-T.pdf
  - id: ptna-promenade
    bac: 2
    ten: 'PTNA Piano Encyclopedia, Tableaux d''une exposition "Promenade" (Itoh Midori; Saitoh Noriko, 2019): 5/4 và 6/4; "Mussorgsky walking as he visits Hartmann''s posthumous exhibition"; "Initially, only the melody is presented as a single line, after which it is developed with a thick texture layered with octaves and chords"'
    link: https://enc.piano.or.jp/en/musics/23131
  - id: ptna-castello
    bac: 2
    ten: 'PTNA, No. 2 "Il vecchio castello": người hát rong trước lâu đài; "the sweet melody in the right hand by the alto saxophone" (bản phối)'
    link: https://enc.piano.or.jp/en/musics/23133
  - id: ptna-bydlo
    bac: 2
