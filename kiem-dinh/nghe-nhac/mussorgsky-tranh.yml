  - id: n37
    cau: 'Bản in năm 1886 của Rimsky-Korsakov bỏ chữ ff ở đầu Bydło và chỉ ghi to dần (cresc.) ở giữa bài.'
    loai: cau-truc
    nguon: [ bessel-1886, bbcmm-ogawa ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bản Rimsky-Korsakov, và theo đó là bản Ravel, lại bắt đầu nhỏ rồi to dần." Chữ mới: "bản in năm 1886 của Rimsky-Korsakov bỏ chữ ff ở đầu bài và chỉ ghi to dần (cresc.) ở giữa, còn bản Ravel bắt đầu nhỏ rồi to dần." Xem ảnh trang bản Bessel 1886 (Sibley, tr. 12–13): ô đầu chỉ ghi "Sempre moderato pesante", không có sắc thái nào; cresc. dẫn tới các hợp âm sf ở giữa bài (đoạn khóa Sol), rồi dimin., pp, ppp perdendosi. Nguồn thứ cấp (BBC Music Magazine, Gramophone) nói bản thường gặp ghi "piano" hay "p poco a poco cresc."; bản in đầu không có chữ p: đây có thể là ở các bản in lại sau, nên câu mới chỉ nói điều thấy trên bản 1886. Review D6-L8-gom: lượt 1 và lượt 2 cùng đọc bản Bessel 1886: đầu Bydło không có ký hiệu cường độ, cresc. ở giữa bài. Câu chỉ nói điều thấy trên bản in ấy; chữ "piano" mà Gramophone, BIS nhắc có thể ở bản in lại. Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Mussorgsky_Pictures_Exhibition_Piano_Score.pdf" ]
    luot_2_ghi_chu: 'Bản in đầu Bessel 1886 (Commons, tr. 12): đầu Bydło không có ký hiệu cường độ nào; ở nửa sau trang ghi "dimin." rồi "cresc." cùng các sf. Đúng ý câu: không có ff ở đầu, to dần ở giữa bài. Lưu ý: Gramophone và BIS mô tả bản Rimsky là "p poco a poco cresc"/"piano", nhưng bản scan 1886 không thấy chữ p ở đầu.'
    review: dung
