  - cu:
      - "Sviatoslav Richter, bản thu trực tiếp ở Sofia năm 1958: thô ráp, dữ dội, với mọi rủi ro của một buổi diễn thật."
      - 'Vladimir Horowitz: chơi phiên bản do chính ông sửa, thêm nốt, thêm quãng tám để piano "to" như dàn nhạc; nghe để biết nghệ sĩ có thể can thiệp vào bản nhạc đến đâu.'
    moi:
      - "Sviatoslav Richter, bản thu trực tiếp ở Sofia năm 1958 (nay hãng Decca phát hành, The Sofia Recital 1958): chơi đúng bản nhạc của Mussorgsky; tiếng thu cũ, nghe rõ cả khán phòng."
      - 'Vladimir Horowitz: chơi bản do chính ông soạn lại (1939), thêm nốt và mở rộng âm vực để piano "to" như dàn nhạc (bản thu trực tiếp ở Carnegie Hall năm 1948, hãng RCA); nghe để biết nghệ sĩ có thể can thiệp vào bản nhạc đến đâu.'
    ly_do: "n72 (da-sua), n73 (da-sua): lượt 1 D6-L8; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: "Trọn tổ khúc thuộc trình độ biểu diễn: cần sức bền, hợp âm và quãng tám nặng (Bydło, Baba Yaga, Cổng lớn thành Kiev). Nhưng vài bản có thể tập sớm hơn nhiều: Promenade đầu tiên (khoảng Grade 5–6, chặng 4–5) để luyện hợp âm dày và đổi nhịp; Il vecchio castello (khoảng Grade 7–8, chặng 6) để giữ nốt trầm lặp thật đều dưới một giai điệu hát dài; Vũ khúc gà con chưa nở (khoảng Grade 8) để luyện nốt hoa mỹ nhẹ và nhanh ở âm vực cao. Hãy chơi hợp âm nặng bằng sức nặng của cả cánh tay, không gồng cổ tay (xem sức khỏe người chơi đàn). Xem thêm Tác phẩm theo cấp độ."
