  - id: n54
    cau: 'Có người đọc bài Goldenberg und Schmuÿle như một bức biếm họa bài Do Thái; cách đọc ấy còn tranh cãi.'
    loai: lich-su
    nguon: [ gresham-fw ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (ô bảng): "(chân dung nhuốm định kiến thời ấy)". Chữ mới: "(có người đọc bài này như một bức biếm họa bài Do Thái; cách đọc ấy còn tranh cãi)". Gresham: "Richard Taruskin put forward a reading of this piece as an antisemitic caricature, and this reading has become widely known", rồi tác giả phản bác ("the hypothesis of a scurrilous caricature lacks plausibility"). Câu cũ khẳng định một bên của cuộc tranh luận. Review D6-L8-gom: lượt 2 xác nhận chữ mới; agent con đối chiếu chữ trang: khớp câu, chữ cũ đã bỏ không còn trên trang. Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gresham.ac.uk/sites/default/files/2020-09-24_Frolova-Walker_Musorgsky-T.pdf", "https://www.wssymphony.org/program-notes/modeste-mussorgsky-pictures-at-an-exhibition/" ]
    luot_2_ghi_chu: 'Gresham (Frolova-Walker): Taruskin đọc bài này như biếm họa bài Do Thái, "this reading has become widely known", bà đưa cách đọc khác; WSS: Taruskin "has suggested that a darker anti-Semitic subtext underlies this movement".'
