    link: https://enc.piano.or.jp/en/musics/23135
  - id: ptna-chicks
    bac: 2
    ten: 'PTNA, No. 5 "Ballet de poussins": phác thảo trang phục cho ballet Trilby; "unfolds solely in the high register"'
    link: https://enc.piano.or.jp/en/musics/23136
  - id: ptna-baba
    bac: 2
    ten: 'PTNA, No. 9 "Baba Yaga": phác thảo đồng hồ hình túp lều; Allegro con brio feroce, 2/4, hai tay đồng âm, "a very wide range of pitches"; về sau Allegro molto'
    link: https://enc.piano.or.jp/en/musics/23140
  - id: ptna-kiev
    bac: 2
    ten: 'PTNA, No. 10 "La grande porte de Kiev": nối liền (attacca) sau Baba Yaga; "from measure 31, a quiet, chorale-like music emerges"; thiết kế cổng "was ultimately never realized"'
    link: https://enc.piano.or.jp/en/musics/23141
