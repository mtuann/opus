tang: tac-pham
ghi_chu: 'Hướng dẫn nghe Những bức tranh ở phòng triển lãm (tầng Tác phẩm; bản ghi mussorgsky-tranh). Bản nhạc: Mutopia (Knute Snortum, theo ấn bản Pavel Lamm dựa trên bản thảo) cho giọng, nhịp, sắc thái; bản in đầu Bessel 1886 (bản Rimsky-Korsakov, Sibley qua Internet Archive, xem ảnh trang Bydło); lời tựa và lời bình Henle HN 477; tổng phổ Ravel 1929 (Internet Archive) chỉ để kiểm Promenade I và các Promenade bị bỏ. Bản quét bản thảo trên IMSLP không mở được (bước chờ tải): sắc thái ff ở đầu Bydło theo PTNA và BBC Music Magazine (n34). Sửa: n11 (bỏ "đột ngột", cả description), n12 (bỏ "hơn 400 tác phẩm"), n18 ("phần lớn tranh đã thất lạc"), n24 (thư gửi Stasov thành lời Stasov), n29 (ngày công diễn bản Ravel: 19 hay 22/10/1922, viết tháng 10/1922), n32 (bỏ "thô hơn, tối hơn, gõ mạnh hơn"), n37 (Bydło ở bản Bessel 1886: không có p, chỉ cresc. ở giữa), n54 (Goldenberg: định kiến là cách đọc còn tranh cãi), n57 (Baba Yaga: không ghi hóa biểu, không phải Đô thứ), n72 (Richter), n73 (Horowitz), n79, n80 (mức Henle thay Grade); bỏ: n78 (Grade, chặng của Promenade). Không có khuông nhạc. Bảng Theo dõi khi nghe không đổi dòng nào (11 dòng, 11 mốc). Câu hỏi để nghe chủ động không có nhận định. Thuật ngữ chưa có bản ghi trong thuat-ngu.yml: âm nhạc chương trình (programme music), promenade. Câu ve-site ở hồ sơ khác: nhac-cu/index n29 (bản piano và bản dàn nhạc) vẫn đúng; piano/nghe-si mục 22 (Richter, Sofia 1958) khớp.'
