doi_chu:
  - cu:
      - 'Một cuộc dạo xem tranh. Viktor Hartmann, kiến trúc sư, họa sĩ và bạn thân của Mussorgsky, đột ngột qua đời năm 1873, mới 39 tuổi. Đầu năm 1874, nhà phê bình Vladimir Stasov góp phần tổ chức một triển lãm tưởng niệm hơn 400 tác phẩm của Hartmann ở Saint Petersburg. Chỉ trong ba tuần tháng 6/1874, Mussorgsky, thành viên "Nhóm Năm người", viết một tổ khúc piano gồm mười "bức tranh": một ví dụ kinh điển của âm nhạc chương trình (so sánh với thơ giao hưởng). Phần lớn tranh của Hartmann đã thất lạc; trong số ít bản còn lại có phác thảo trang phục gà con trong vỏ trứng, chiếc đồng hồ hình túp lều của mụ phù thủy Baba Yaga và thiết kế một cổng thành cho Kiev (Kyiv) chưa bao giờ được xây.'
      - 'Promenade: chính người xem tranh. Tổ khúc mở đầu bằng Promenade (dạo bước): một giọng hát đơn độc, rồi cả khối hợp âm đáp lại, nhịp 5/4 và 6/4 xen kẽ như những bước chân không đều. Promenade trở lại giữa các bức tranh, mỗi lần một tâm trạng; Mussorgsky viết cho Stasov rằng có thể thấy gương mặt của chính ông trong những đoạn chuyển ấy. Về sau, nó còn "bước vào" tranh: thành lời than ở giọng thứ trong Cum mortuis, và vang lên giữa tiếng chuông ở Cổng lớn thành Kiev.'
      - "Bản piano gốc và bản Ravel. Bản in năm 1886 của Rimsky-Korsakov sửa nhiều chỗ và có cả lỗi đọc nhầm. Bản phối khí nổi tiếng nhất, của Maurice Ravel, do nhạc trưởng Serge Koussevitzky đặt hàng và công diễn ở Paris ngày 19/10/1922; Ravel dựa vào bản Rimsky-Korsakov và bỏ Promenade thứ năm. Nếu bạn chỉ biết tác phẩm qua bản Ravel, hãy chuẩn bị cho một âm thanh khác hẳn: bản piano thô hơn, tối hơn, gõ mạnh hơn."
      - "Nghe bằng tai người chơi piano. Ví dụ rõ nhất là Bydło (cỗ xe bò): trong bản thảo của Mussorgsky, xe bò bắt đầu rất mạnh (ff), như ở ngay trước mặt, tay trái nện những hợp âm nặng như bánh xe lăn, rồi xa dần đến ppp; bản Rimsky-Korsakov, và theo đó là bản Ravel, lại bắt đầu nhỏ rồi to dần. Ravel tô màu bằng nhạc cụ: trumpet cho Promenade đầu tiên, saxophone alto cho bài ca trong Lâu đài cổ, tuba cho cỗ xe bò, trumpet câm tiếng cho Schmuÿle. Trên piano, mọi màu sắc ấy phải đến từ cách nhấn phím và bàn đạp. Trong Catacombae, mỗi hợp âm piano tắt dần ngay khi vừa vang lên, và khoảng lặng giữa chúng thành một phần của âm nhạc; kèn đồng của Ravel thì giữ âm thanh đều đặn. Đọc thêm về nghệ thuật phối khí của Ravel ở Boléro."
    moi:
      - 'Một cuộc dạo xem tranh. Viktor Hartmann, kiến trúc sư, họa sĩ và bạn thân của Mussorgsky, qua đời năm 1873, mới 39 tuổi. Đầu năm 1874, nhà phê bình Vladimir Stasov góp phần tổ chức một triển lãm tưởng niệm các bản vẽ và tranh màu nước của Hartmann ở Viện Hàn lâm Nghệ thuật, Saint Petersburg. Chỉ trong ba tuần tháng 6/1874, Mussorgsky, thành viên "Nhóm Năm người", viết một tổ khúc piano gồm mười "bức tranh": một ví dụ kinh điển của âm nhạc chương trình (so sánh với thơ giao hưởng). Không phải bức nào Mussorgsky nhắc tới cũng còn tìm được; trong số những bản còn lại có phác thảo trang phục gà con trong vỏ trứng, chiếc đồng hồ hình túp lều của mụ phù thủy Baba Yaga và thiết kế một cổng thành cho Kiev (Kyiv) chưa bao giờ được xây.'
      - 'Promenade: chính người xem tranh. Tổ khúc mở đầu bằng Promenade (dạo bước): một giọng hát đơn độc, rồi cả khối hợp âm đáp lại, nhịp 5/4 và 6/4 xen kẽ như những bước chân không đều. Promenade trở lại giữa các bức tranh, mỗi lần một tâm trạng; theo Stasov, qua những đoạn ấy Mussorgsky vẽ chính mình đang dạo qua phòng tranh, lúc vui lúc buồn khi nhớ người bạn đã mất. Về sau, nó còn "bước vào" tranh: thành lời than ở giọng thứ trong Cum mortuis, và vang lên giữa tiếng chuông ở Cổng lớn thành Kiev.'
      - Bản piano gốc và bản Ravel. Bản in năm 1886 của Rimsky-Korsakov sửa nhiều chỗ và có cả lỗi đọc nhầm. Bản phối khí nổi tiếng nhất, của Maurice Ravel, do nhạc trưởng Serge Koussevitzky đặt hàng và công diễn ở Paris tháng 10/1922; Ravel dựa vào bản Rimsky-Korsakov và bỏ Promenade thứ năm. Nếu bạn chỉ biết tác phẩm qua bản Ravel, hãy chuẩn bị cho một âm thanh khác hẳn.
      - "Nghe bằng tai người chơi piano. Ví dụ rõ nhất là Bydło (cỗ xe bò): trong bản thảo của Mussorgsky, xe bò bắt đầu rất mạnh (ff), như ở ngay trước mặt, tay trái nện những hợp âm nặng như bánh xe lăn, rồi xa dần đến ppp; bản in năm 1886 của Rimsky-Korsakov bỏ chữ ff ở đầu bài và chỉ ghi to dần (cresc.) ở giữa, còn bản Ravel bắt đầu nhỏ rồi to dần. Ravel tô màu bằng nhạc cụ: trumpet cho Promenade đầu tiên, saxophone alto cho bài ca trong Lâu đài cổ, tuba cho cỗ xe bò, trumpet câm tiếng cho Schmuÿle. Trên piano, mọi màu sắc ấy phải đến từ cách nhấn phím và bàn đạp. Trong Catacombae, mỗi hợp âm piano tắt dần ngay khi vừa vang lên, và khoảng lặng giữa chúng thành một phần của âm nhạc; kèn đồng của Ravel thì giữ âm thanh đều đặn. Đọc thêm về nghệ thuật phối khí của Ravel ở Boléro."
