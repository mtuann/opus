  - cu: "Concerto piano số 21, K. 467: chương 1 có hai lần trình bày, của dàn nhạc rồi của piano (độ dài các ô gần đúng). Cadenza của Mozart cho concerto này đã thất lạc; nghệ sĩ chơi cadenza của người khác hoặc tự soạn."
    moi: "Concerto piano số 21, K. 467: chương 1 có hai lần trình bày, của dàn nhạc rồi của piano (độ dài các ô gần đúng). Không còn cadenza nào của Mozart cho concerto này; nghệ sĩ chơi cadenza của người khác, tự soạn hoặc ứng tác."
    ly_do: "Chữ chú thích của hình cấu trúc (hinh.nghe, n12 hồ sơ bản ghi): PTNA \"Mozart's own cadenzas … have not survived\"; Köchel online: Mozart thường ứng tác cadenza. \"Thất lạc\" ngầm nói từng có bản viết. Cùng chỗ sửa với n22 của trang."
