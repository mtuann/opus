ghi_chu: 'Hướng dẫn nghe (loai: nghe là cấu trúc). Không có khối abc. Bản nhạc: tổng phổ Neue Mozart-Ausgabe V/15/6 (1961) trên DME của Mozarteum (ảnh trang 93–105: chương 1 ô 1–139; 138–149: Andante trọn 104 ô), đọc ảnh. Lịch sử: Köchel online (KV 467), lời tựa Henle HN 766 (Gertsch 2006), lời tựa Bärenreiter BA 5337 (Kadenzen und Eingänge), PTNA. Bản thu: DG, MusicBrainz, thư viện ECU, Time (1968), Commons. Không tính là nhận định: tiêu đề mục, tiêu đề cột, ::hinh-cau-truc và ::khoi-nghe (thuộc hồ sơ bản ghi), mốc ::khoi-nghe (không sửa). Sửa: n6, n12, n14, n16, n22, n24, n29, n30, n31, n35, n40. Câu trang khác dẫn tới (dàn nhạc trình bày trước, piano vào sau; mục về cadenza) giữ ý. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: Eingang (lead-in), chùm ba (đã chọn ở d6-l1-gom cho triplet, chưa có bản ghi), fortepiano, maestoso. Đã có: con sordino, pizzicato, fermata, trill (láy rền), cadenza, rondo, concerto, Andante.'
nguon:
  - id: koechel-467
    bac: 2
    ten: 'Köchel-Verzeichnis online (Stiftung Mozarteum), KV 467 Concerto in C: "Dating Vienna, 09.03.1785"; "First Performance Vienna, Burgtheater, 10.03.1785"; biên chế có clno1+clno2 (trumpet), timp; ba chương Allegro maestoso, Andante, Allegro vivace assai; tự ký bản thảo "nel Febraio 1785"; mục nhóm: "While he usually improvised his own cadenzas and lead-ins, Mozart provided a large number of written cadenzas for his sister Maria Anna and his students"; "In Vienna, Mozart became acquainted with the new … pianofortes by Gabriel Anton Walter"'
    link: https://kv.mozarteum.at/en/work/concerto-in-c-5544
  - id: henle-hn766
    bac: 2
    ten: 'G. Henle Verlag, HN 766, Preface (Norbert Gertsch, 2006; PDF): K. 466 viết cho buổi hòa nhạc 11/2/1785, K. 467 "destined for an academy held in the Burgtheater on 10 March"; "Mozart wrote both of these concertos for his own use at two academies held for his benefit"; ngày hoàn thành ghi trong danh mục "the 9th of March"; bản thảo ở Pierpont Morgan Library, Heineman MS 266'
    link: https://www.henle.de/media/fe/cc/48/1690886045/0766-1690886045-sync.pdf
  - id: henle-hn766-p
    bac: 2
    ten: 'G. Henle Verlag, HN 766 (trang sản phẩm): "Piano Concerto C major K. 467: 6 medium"'
    link: https://www.henle.de/en/Piano-Concerto-no.-21-C-major-K.-467/HN-766
  - id: nma-467
    bac: 1
    ten: 'Neue Mozart-Ausgabe V/15/6 (Engel, Heussner 1961), DME Mozarteum, ảnh trang: tr. 93 "Allegro maestoso", chú thích "Tempobezeichnung, die im Autograph fehlt, nach Mozarts eigenhändigem Werkverzeichnis"; ô 1–11 dây p môtip hành khúc, kèn gỗ đáp, ô 12 tutti f; tr. 99 ô 69–79 kèn gỗ dẫn, piano vào, dấu ngân ô 79 "Hier ist ein Eingang zu spielen"; tr. 100 ô 80 trở đi piano láy rền dài trên Sol, dây chơi lại hành khúc; tr. 103 ô 109 piano một mình ở Sol thứ (Si♭, Mi♭); tr. 105 ô 128 chủ đề Sol trưởng trên nền Rê; tr. 138–149 Andante: violin 1, 2, viola "sordini", violin 2 và viola chùm ba, cello và bass "pizzicato", 104 ô, các đoạn giọng thứ (ô 43–58), trở lại qua giọng nhiều giáng (ô 72–78), kết pp'
    link: https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=155&p1=93
  - id: ba5337
    bac: 2
    ten: 'Bärenreiter BA 5337, W. A. Mozart, Kadenzen und Eingänge zu den Klavierkonzerten (Ferguson, Rehm), Vorwort (PDF mẫu): cadenza viết cho Nannerl và học trò; tờ quảng cáo buổi ra mắt K. 467 "Donnerstag den 10ten März 1785 … ein neues erst verfertigtes Forte piano=Konzert spielen"'
    link: https://www.barenreiter.co.uk/prefaces/9790006522545_Innenansicht.pdf
  - id: ptna-275
    bac: 2
    ten: 'PTNA Piano Encyclopedia, Mozart: Konzert Nr.21 C-Dur K.467: ra mắt 10/3/1785 "approximately one month after No. 20"; "In contrast to the D minor of No. 20, Concerto No. 21 possesses a bright sound in C major"; "Mozart''s own cadenzas for the outer movements have not survived"; chương 1 "a motif in the piano part that later appears in Symphony No. 40"; chương 3 rondo; thời lượng 13:30, 6:30, 6:30 (tổng 26:30)'
    link: https://enc.piano.or.jp/en/musics/275
