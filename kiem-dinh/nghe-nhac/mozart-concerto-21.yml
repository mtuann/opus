    luot_2_ghi_chu: KV online xác nhận ở Vienna Mozart biết tới và dùng đàn của Gabriel Anton Walter. Âm vực FF–g''' (hơn năm quãng tám một chút) có ở Tafelmusik, nhưng đó là đàn chép lại theo kiểu Walter (Wolf 1997), không phải đàn của Mozart. Kết quả tìm kiếm có tài liệu của Mozarthaus Vienna ghi đàn Walter của Mozart là năm quãng tám F1–f3 (61 phím), nhưng link ấy giờ chuyển về trang chủ, tôi không mở được. Còn lệch FF–f''' và FF–g''' (đàn có thể đã bị sửa về sau). Nên dựa vào nguồn của Mozarteum về cây đàn, hay viết 'khoảng năm quãng tám'.
