    moi: "Henle xếp phần piano của concerto này ở mức 6 (trung bình) trên thang 1–9. Chương 2 không dày nốt, nhưng hát một giai điệu dài với tiếng đều và trang trí tự nhiên là điều khó; chương 1 và 3 nhiều nốt hơn hẳn. Lộ trình hợp lý: Sonata K. 545, Sonata K. 331, một sonata Mozart lớn hơn, rồi mới đến concerto. Khi tập, dùng bản rút gọn cho hai piano (piano thứ hai chơi phần dàn nhạc) và tìm một người cùng chơi: concerto là âm nhạc của đối thoại. Đọc thêm nốt hoa mỹ và Tác phẩm theo cấp độ."
