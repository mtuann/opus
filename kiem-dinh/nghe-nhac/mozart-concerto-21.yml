nhan_dinh:
  - id: n1
    cau: 'Tiêu đề và bảng: Concerto cho piano và dàn nhạc số 21 cung Đô trưởng, K. 467, của Wolfgang Amadeus Mozart (1756–1791).'
    loai: ten
    nguon: [ koechel-467, imslp-467 ]
    ket_qua: dung
    ghi_chu: 'Năm sinh–mất khớp src/data/nha-soan-nhac.yml (đã khóa).'
    luot_2: dung
    luot_2_nguon: [ "https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://www.barenreiter.co.uk/prefaces/9790006467501_Innenansicht.pdf" ]
    luot_2_ghi_chu: "Köchel online: KV 467, Concerto in C for piano and orchestra; Mozart 1756–1791 (dữ liệu người trên trang KV). Số 21 là cách đánh số cũ (Bärenreiter: »Nr. 21«, ghi chú về số cũ của AMA)."
  - id: n2
    cau: 'Bảng: Sáng tác ở Vienna đầu năm 1785; Mozart ghi vào danh mục tác phẩm của mình ngày 9/3/1785.'
    loai: nam
    nguon: [ koechel-467, henle-hn766 ]
    ket_qua: dung
    ghi_chu: 'Köchel: "Dating Vienna, 09.03.1785", bản thảo ghi "nel Febraio 1785". Henle: "Mozart entered its date of completion in his autograph thematic catalogue as the 9th of March".'
    luot_2: dung
    luot_2_nguon: [ "https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://dme.mozarteum.at/DME/objs/kb/5156_0044.jpg", "https://www.henle.de/media/fe/cc/48/1690886045/0766-1690886045-sync.pdf" ]
    luot_2_ghi_chu: "KV: hoàn thành 9/3/1785 (theo MozVerz), nơi sáng tác Wien; bản thảo đề 'nel Febraio 1785'. NMA KB V/15/6 tr. 44: mục A1 'den 9ten März [1785]' trong danh mục tự tay. Henle (Gertsch): 'den 9ten März'."
  - id: n3
    cau: 'Bảng: Mozart tự chơi phần độc tấu buổi ra mắt ở nhà hát Burgtheater ngày hôm sau (10/3/1785).'
    loai: lich-su
    nguon: [ koechel-467, henle-hn766, ba5337 ]
    ket_qua: dung
    ghi_chu: 'Köchel: "First Performance Vienna, Burgtheater, 10.03.1785". Tờ quảng cáo (BA 5337): Mozart "ein neues erst verfertigtes Forte piano=Konzert spielen".'
    luot_2: dung
    luot_2_nguon: [ "https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-17.jpg", "https://www.henle.de/media/fe/cc/48/1690886045/0766-1690886045-sync.pdf" ]
    luot_2_ghi_chu: "KV: First performance 10/3/1785, Wien, Burgtheater. NMA V/15/6 Vorwort tr. VIII: buổi 'grosse musikalische Akademie' 10/3 ở k. k. National-Hof-Theater, 'in der Mozart erstmals das Konzert in C-dur, KV 467, spielte'. Henle: viết cho Burgtheater-Akademie 10/3, hoàn thành 9/3 là ngày trước đó."
  - id: n4
    cau: 'Bảng: Thời kỳ Cổ điển.'
    loai: lich-su
    nguon: [ imslp-467 ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-18.jpg" ]
    luot_2_ghi_chu: NMA V/15/6 Vorwort tr. VII xếp các concerto này vào đỉnh cao của 'klassischer Vollendung', 'wahrhaft klassische Kompositionen'; năm 1785 thuộc thời kỳ Cổ điển.
  - id: n5
    cau: 'Bảng: Concerto piano, 3 chương.'
    loai: cau-truc
    nguon: [ koechel-467, imslp-467 ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://kv.mozarteum.at/en/work/concerto-in-c-5544" ]
    luot_2_ghi_chu: "KV liệt kê 3 phần: 467/01 Allegro maestoso, 467/02 Andante, 467/03 Allegro vivace assai."
  - id: n6
    cau: 'Bảng: Độ dài khoảng 26–30 phút; riêng chương 2 (Andante) khoảng 6–7 phút.'
    loai: so-lieu
    nguon: [ ptna-275, imslp-467, ecu-anda ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 28–30 phút". Chữ mới: "Khoảng 26–30 phút". Lý do: PTNA tổng 26:30; IMSLP 30 phút; bản Anda khoảng 27:37. Andante: PTNA 6:30, Anda 7:16 (khớp "khoảng 6–7").'
    luot_2: dung
    luot_2_nguon: [ "https://www.barenreiter.co.uk/prefaces/9790006467501_Innenansicht.pdf", "https://musicbrainz.org/recording/1a76c085-0859-4595-974b-947585467086", "https://musicbrainz.org/recording/66ce3575-03a4-4a1f-b4bd-c44df059f930" ]
    luot_2_ghi_chu: "Bärenreiter BA 5317a: 'Aufführungsdauer ca. 29 min.' Andante: bản Anda 7:15 (435 s), bản Bilson 6:10 (370 s) theo MusicBrainz; 'khoảng 6–7 phút' hợp lý (Anda nhỉnh hơn 7 phút một chút)."
  - id: n7
    cau: 'Mozart viết concerto trước hết để tự mình biểu diễn trong các buổi hòa nhạc do chính ông tổ chức ở Vienna.'
    loai: lich-su
    nguon: [ henle-hn766, koechel-467 ]
    ket_qua: dung
    ghi_chu: 'Henle: K. 466 và K. 467 viết "for his own use at two academies held for his benefit". Köchel: vài concerto viết cho học trò (Ployer, K. 449, 453…), nên "trước hết" là hợp; lượt 2 xem có cần viết hẹp lại cho K. 466 và K. 467 không.'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-18.jpg", "https://www.henle.de/media/fe/cc/48/1690886045/0766-1690886045-sync.pdf" ]
    luot_2_ghi_chu: "Nguồn bậc 1–2 nói rõ: NMA V/15/6 Vorwort (Engel/Heussner 1961) tr. VII: 'Die Klavierkonzerte des vorliegenden Bandes — wie alle Werke dieser Gattung aus der Wiener Zeit zum Vortrag in eigenen Konzerten bestimmt'. Henle HN 766 (Gertsch 2006): Mozart viết KV 466 và 467 'for his own use at two academies held for his benefit'; có thể ông muốn giữ quyền biểu diễn độc quyền các 'concerto lớn' cho mình. Lưu ý: KV online ghi vài concerto viết cho học trò (Ployer: KV 449, 453) hay nữ nghệ sĩ khác, nên chữ 'trước hết' là đúng mức."
  - id: n8
    cau: 'K. 467 ra đời chỉ bốn tuần sau Concerto Rê thứ K. 466.'
    loai: nam
    nguon: [ henle-hn766, ptna-275 ]
    ket_qua: dung
    ghi_chu: 'Henle: K. 466 cho buổi 11/2/1785, K. 467 xong 9/3 (khoảng bốn tuần). PTNA: "approximately one month after No. 20".'
    luot_2: dung
    luot_2_nguon: [ "https://www.bso.org/works/mozart-piano-concerto-no-21", "https://www.barenreiter.co.uk/prefaces/9790006201259_Innenansicht.pdf", "https://kv.mozarteum.at/en/work/concerto-in-c-5544" ]
    luot_2_ghi_chu: "KV 466 ghi ngày 10/2/1785 (chú giải chương trình BSO), ra mắt 11/2/1785 (lời tựa Bärenreiter KV 466); KV 467 hoàn thành 9/3/1785 (KV online): cách nhau 27 ngày, khoảng bốn tuần."
  - id: n9
    cau: 'K. 466 u tối, giông bão; K. 467 rạng rỡ, với kèn trumpet và trống timpani làm giọng Đô trưởng thêm sáng.'
    loai: lich-su
    nguon: [ ptna-275, koechel-467 ]
    ket_qua: dung
    ghi_chu: 'PTNA: "In contrast to the D minor of No. 20, Concerto No. 21 possesses a bright sound in C major". Köchel: biên chế có clno1+clno2, timp. (K. 466 cũng có trumpet, timpani; câu không nói ngược lại.)'
    luot_2: dung
    luot_2_nguon: [ "https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://www.bso.org/works/mozart-piano-concerto-no-21" ]
    luot_2_ghi_chu: "Biên chế KV 467 trên KV online có clno1+clno2 (trumpet) và timp. Chú giải BSO: KV 466 'somber D minor', KV 467 'brightly colored, filled with festive, trumpet-and-drums panoply'. Câu không nói KV 466 thiếu trumpet và timpani (KV 466 cũng có), nên không sai."
  - id: n10
    cau: 'Năm 1967, đạo diễn Thụy Điển Bo Widerberg dùng chương Andante, qua bản thu của Géza Anda, làm nhạc nền phim Elvira Madigan; từ đó cả bản concerto hay bị gọi theo tên phim.'
    loai: lich-su
    nguon: [ criterion, time-1968, dg-anda, ecu-anda ]
    ket_qua: dung
    ghi_chu: 'Criterion: Elvira Madigan (1967) của Bo Widerberg, "indelible use of Mozart''s Piano Concerto no. 21". TIME 1968: đoạn trong bản thu Anda (DG) thành chủ đề lặp lại trong "the Swedish film Elvira Madigan". DG đặt tên track "II. Andante \"Elvira Madigan\""; thư viện ECU ghi tên đĩa "Piano Concerto No. 21 \"Elvira Madigan\"".'
    luot_2: dung
    luot_2_nguon: [ "https://snl.no/Elvira_Madigan", "https://time.com/archive/6631835/recordings-elvira-meet-wolfgang/", "https://kv.mozarteum.at/en/work/concerto-in-c-5544" ]
    luot_2_ghi_chu: "Store norske leksikon: phim Thụy Điển 1967, đạo diễn Bo Widerberg, nhạc nền có concerto piano số 21 của Mozart. TIME (23/2/1968): một đoạn trong bản thu của Géza Anda (DG) là chủ đề lặp lại trong nhạc nền phim Elvira Madigan. Tên gọi theo phim: chính bản thu trên Köchel online cũng ghi 'Piano Concerto 21 In C, K 467, _Elvira Madigan_'. IMDb và Svensk Filmdatabas không mở được bằng curl (IMDb trả về rỗng, SFDb có trang kiểm tra robot), nên không dùng."
  - id: n11
    cau: 'Link cách đọc tên tác phẩm, concerto Cổ điển, Giao hưởng số 40.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'nghe-nhac/doc-ten-tac-pham.md, hinh-thuc/concerto.md có. nghe-nhac/mozart-40 chưa chuyển (có ở ../opus-zero/docs/nghe-nhac/mozart-40.md): link thành "sắp có" cho tới khi trang lên.'
  - id: n12
    cau: 'Chương 1 Allegro maestoso: bản thảo không ghi chỉ dẫn tốc độ; chữ Allegro maestoso lấy từ danh mục tác phẩm do Mozart tự ghi.'
    loai: cau-truc
