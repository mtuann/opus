khuong_nhac: []
ghi_chu: 'Hướng dẫn nghe Hồ thiên nga, Scène số 10 (tầng Tác phẩm). Bản nhạc: tổng phổ số 10 trên Internet Archive (bản khắc B.B. 59, tr. 223–234), đọc từng trang. Lịch sử: Tchaikovsky Research (mã wiki), IMSLP. Sửa trang: cốt truyện (n2, n10: bỏ "phù thủy Rothbart biến thành thiên nga", theo bản 1877), công diễn (n11, n12: Tchaikovsky Research nói bản dựng 1877 "went well", diễn tới 1882/83; câu "không thành công" bỏ), bỏ "nổi tiếng nhất" (n13), dòng Nghe thêm (n20), mục Nguồn (n23 bỏ, n24 thêm). Bảng Theo dõi (5 dòng) giữ nguyên, cột đầu "…", trang không có mốc. Câu ở hồ sơ khác vẫn đúng: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang n73, lich-su/thoi-ky/lang-man n37, nhan-dien/dau-van-tay n52 (đường dẫn, tên). Thuật ngữ chưa có trong thuat-ngu.yml: ballet, oboe, đàn hạc (harp), kèn horn, Scène (cảnh); tremolo và fortissimo đã có.'
