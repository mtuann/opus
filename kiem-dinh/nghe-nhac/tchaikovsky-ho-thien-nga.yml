    ghi_chu: 'Chữ cũ: "*Điệu múa của những thiên nga nhỏ* (màn 2), rất nhanh, nhẹ và nổi tiếng không kém." Chữ mới: "*Các điệu múa của thiên nga* (số 13, màn 2), một chuỗi bảy điệu múa ngắn." Lý do: "nổi tiếng không kém" là xếp hạng; "rất nhanh" và tên "thiên nga nhỏ" chưa có nguồn bậc 1–2 đã mở. Tchaikovsky Research: No. 13 «Dances of the Swans (Danses des cygnes)», bảy phần (I–VII).'
