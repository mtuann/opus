    ghi_chu: 'Chữ cũ: "nàng công chúa bị phù thủy Rothbart biến thành thiên nga, chỉ hóa lại thành người vào ban đêm". Chữ mới: "nàng công chúa bị phép thuật giữ làm thiên nga ban ngày, chỉ hóa lại thành người vào ban đêm". Lý do: theo tóm tắt bản 1877 (Tchaikovsky Research), Odette là con riêng bị mẹ kế phù thủy hại, lời nguyền giữ các cô gái «as swans by day and humans by night»; von Rothbart chỉ xuất hiện ở màn 3. Vai Rothbart là kẻ yểm bùa thuộc các bản dựng sau; viết chung "phép thuật" để đúng với cả hai. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Swan_Lake" ]
    luot_2_ghi_chu: 'Kịch bản 1877: công chúa Odette; "the spell, which holds her and the other girls bound as swans by day and humans by night"; Siegfried yêu Odette.'
    review: dung
  - id: n11
    cau: Bản dựng đầu tiên ở Moskva diễn đến mùa 1882/83 rồi thôi, và không được dựng lại ở Nga khi Tchaikovsky còn sống.
    loai: lich-su
    nguon: [ tr-swan ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Buổi công diễn đầu tiên không thành công; vở ballet chỉ trở thành kinh điển sau khi được dàn dựng lại ở St. Petersburg năm 1895, sau khi Tchaikovsky đã mất." Chữ mới: hai câu n11, n12. Lý do: Tchaikovsky Research nói ngược với "không thành công": «The production went well, and it remained in the repertoire until the 1882/83 season, after which it was not performed again in Russia during the composer''s lifetime». Viết theo nguồn này. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Swan_Lake" ]
    luot_2_ghi_chu: "\"it remained in the repertoire until the 1882/83 season, after which it was not performed again in Russia during the composer's lifetime\"."
    review: dung
