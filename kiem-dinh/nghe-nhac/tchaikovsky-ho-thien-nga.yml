    luot_2_ghi_chu: 'Tchaikovsky Research: bản dựng 15/27/1/1895 ở Mariinsky, biên đạo Petipa và Ivanov, sau khi Tchaikovsky mất (1893). Britannica: vở được yêu thích sau bản 1895 và "in its present form" thành một trong các vở ballet được diễn nhiều nhất.'
