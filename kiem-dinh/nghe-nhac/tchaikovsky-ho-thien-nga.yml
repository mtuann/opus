ghi_chu: 'Hướng dẫn nghe Hồ thiên nga, Scène số 10 (tầng Tác phẩm). Bản nhạc: tổng phổ số 10 trên Internet Archive (bản khắc B.B. 59, tr. 223–234), đọc từng trang. Lịch sử: Tchaikovsky Research (mã wiki), IMSLP. Sửa trang: cốt truyện (n2, n10: bỏ "phù thủy Rothbart biến thành thiên nga", theo bản 1877), công diễn (n11, n12: Tchaikovsky Research nói bản dựng 1877 "went well", diễn tới 1882/83; câu "không thành công" bỏ), bỏ "nổi tiếng nhất" (n13), dòng Nghe thêm (n20), mục Nguồn (n23 bỏ, n24 thêm). Bảng Theo dõi (5 dòng) giữ nguyên, cột đầu "…", trang không có mốc. Câu ở hồ sơ khác vẫn đúng: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang n73, lich-su/thoi-ky/lang-man n37, nhan-dien/dau-van-tay n52 (đường dẫn, tên). Thuật ngữ chưa có trong thuat-ngu.yml: ballet, oboe, đàn hạc (harp), kèn horn, Scène (cảnh); tremolo và fortissimo đã có.'
doi_chu:
  - cu:
      - Hồ thiên nga kể chuyện hoàng tử Siegfried yêu Odette, nàng công chúa bị phù thủy Rothbart biến thành thiên nga, chỉ hóa lại thành người vào ban đêm. Buổi công diễn đầu tiên không thành công; vở ballet chỉ trở thành kinh điển sau khi được dàn dựng lại ở St. Petersburg năm 1895, sau khi Tchaikovsky đã mất.
      - "Chủ đề thiên nga là một trong những giai điệu nổi tiếng nhất của nhạc ballet: buồn, đầy khao khát, ở giọng Si thứ."
    moi:
      - Hồ thiên nga kể chuyện hoàng tử Siegfried yêu Odette, nàng công chúa bị phép thuật giữ làm thiên nga ban ngày, chỉ hóa lại thành người vào ban đêm. Bản dựng đầu tiên ở Moskva diễn đến mùa 1882/83 rồi thôi, và không được dựng lại ở Nga khi Tchaikovsky còn sống. Phiên bản được dựng khắp nơi trong thế kỷ 20 bắt nguồn từ bản dựng mới ở St. Petersburg năm 1895 (biên đạo Marius Petipa và Lev Ivanov), sau khi ông mất.
      - Chủ đề thiên nga buồn, đầy khao khát, ở giọng Si thứ.
    ly_do: "n2 (da-sua), n10 (da-sua), n11 (da-sua), n12 (da-sua), n13 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
