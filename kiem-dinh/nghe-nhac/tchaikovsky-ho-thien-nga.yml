  - id: n10
    cau: Hồ thiên nga kể chuyện hoàng tử Siegfried yêu Odette, nàng công chúa bị phép thuật giữ làm thiên nga ban ngày, chỉ hóa lại thành người vào ban đêm.
    loai: lich-su
    nguon: [ tr-swan ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nàng công chúa bị phù thủy Rothbart biến thành thiên nga, chỉ hóa lại thành người vào ban đêm". Chữ mới: "nàng công chúa bị phép thuật giữ làm thiên nga ban ngày, chỉ hóa lại thành người vào ban đêm". Lý do: theo tóm tắt bản 1877 (Tchaikovsky Research), Odette là con riêng bị mẹ kế phù thủy hại, lời nguyền giữ các cô gái «as swans by day and humans by night»; von Rothbart chỉ xuất hiện ở màn 3. Vai Rothbart là kẻ yểm bùa thuộc các bản dựng sau; viết chung "phép thuật" để đúng với cả hai.'
  - id: n11
    cau: Bản dựng đầu tiên ở Moskva diễn đến mùa 1882/83 rồi thôi, và không được dựng lại ở Nga khi Tchaikovsky còn sống.
    loai: lich-su
    nguon: [ tr-swan ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Buổi công diễn đầu tiên không thành công; vở ballet chỉ trở thành kinh điển sau khi được dàn dựng lại ở St. Petersburg năm 1895, sau khi Tchaikovsky đã mất.\" Chữ mới: hai câu n11, n12. Lý do: Tchaikovsky Research nói ngược với \"không thành công\": «The production went well, and it remained in the repertoire until the 1882/83 season, after which it was not performed again in Russia during the composer's lifetime». Viết theo nguồn này."
  - id: n12
    cau: Phiên bản được dựng khắp nơi trong thế kỷ 20 bắt nguồn từ bản dựng mới ở St. Petersburg năm 1895 (biên đạo Marius Petipa và Lev Ivanov), sau khi Tchaikovsky mất.
    loai: lich-su
    nguon: [ tr-swan ]
    ket_qua: da-sua
    ghi_chu: "Xem n11 cho chữ cũ. Tchaikovsky Research: bản dựng 15/27/1/1895, Nhà hát Mariinsky, biên đạo Petipa và Ivanov, chỉ huy Drigo; «the version of the ballet widely promulgated in the 20th century originated after the composer's death». \"Trở thành kinh điển\" đổi thành câu cụ thể này."
  - id: n13
    cau: Chủ đề thiên nga buồn, đầy khao khát, ở giọng Si thứ.
    loai: cau-truc
    nguon: [ ia-no10 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "**Chủ đề thiên nga** là một trong những giai điệu nổi tiếng nhất của nhạc ballet: buồn, đầy khao khát, ở giọng **Si thứ**." Chữ mới: "**Chủ đề thiên nga** buồn, đầy khao khát, ở giọng **Si thứ**." Lý do: bỏ xếp hạng "nổi tiếng nhất" (không đo được). Giọng: hóa biểu hai thăng, chủ đề Fa♯–Si–Đô♯–Rê–Mi–Fa♯ trên hợp âm Si thứ (tổng phổ tr. 223). "Buồn, khao khát" là lời tả cảm nhận.'
  - id: n14
    cau: 'Theo dõi, dòng 1: đàn hạc rải hợp âm, đàn dây rung tremolo khẽ: mặt hồ ban đêm.'
    loai: cau-truc
    nguon: [ ia-no10, tr-swan ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ tr. 223: Arpa rải hợp âm liên ba; violin, viola tremolo (sf rồi p). Màn 2 diễn bên hồ dưới trăng («a lake, shimmering in the moonlight», Tchaikovsky Research).'
  - id: n15
    cau: 'Theo dõi, dòng 2: oboe hát chủ đề thiên nga: u buồn, bay bổng.'
    loai: cau-truc
    nguon: [ ia-no10 ]
    ket_qua: dung
    ghi_chu: Oboe solo, p espress., từ ô 2.
  - id: n16
    cau: 'Theo dõi, dòng 3: chủ đề được nhắc lại, các nhạc cụ khác tham gia, cường độ tăng dần.'
    loai: cau-truc
    nguon: [ ia-no10 ]
    ket_qua: dung
    ghi_chu: 'Tr. 224–225: oboe hát tiếp và nhắc lại câu nhạc, đàn hạc rải lên, đàn dây cresc., rồi f ở cuối tr. 225 trước khi cả dàn nhạc vào ở mốc [1].'
  - id: n17
    cau: 'Theo dõi, dòng 4: kèn đồng và cả dàn nhạc chơi chủ đề fortissimo: kịch tính, bi tráng.'
    loai: cau-truc
    nguon: [ ia-no10 ]
    ket_qua: dung
    ghi_chu: 'Tr. 226, mốc [1]: bốn horn (Fa) chơi chủ đề (viết Đô♯5, Fa♯–Sol♯–La–Si…, nghe Fa♯4, Si–Đô♯–Rê–Mi), cả dàn nhạc ff, đàn dây tremolo; cao trào thứ hai ở «Più mosso» [2] (tr. 232), fff có trumpet, trombone, tuba.'
  - id: n18
    cau: 'Theo dõi, dòng 5: lắng xuống, trở lại không khí huyền bí.'
    loai: cau-truc
    nguon: [ ia-no10 ]
    ket_qua: dung
    ghi_chu: 'Tr. 234: gỗ và kèn dừng; đàn dây nốt dài tremolo mf rồi dim., cello và bass đi xuống, kết bằng dấu lặng ngân.'
  - id: n19
    cau: 'Câu hỏi nghe chủ động: vì sao Tchaikovsky chọn oboe cho chủ đề này; đếm số lần chủ đề xuất hiện và nhạc cụ chơi; xem video vở ballet.'
