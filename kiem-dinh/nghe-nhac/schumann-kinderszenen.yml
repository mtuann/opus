    luot_2_ghi_chu: "Schumann-Portal: soạn 'wahrscheinlich im Februar und März 1838', 'Zwei der Stücke (Nrn. 6 und 9) entstanden vermutlich bereits im Herbst 1837'; PTNA cũng ghi vậy. Henle (lời tựa, Comments FE1): bản in đầu Breitkopf & Härtel, số bản 6016, 'published in late February 1839'."
    review: "dung"
