    nguon:
      - henle-hn44-vorwort
      - ptna-op15
      - henle-hn44-bem
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Tháng 2–3 năm 1838 ở Leipzig (hai bản có thể từ cuối năm 1837); in đầu năm 1839 (Breitkopf & Härtel)\". Chữ mới: câu ở cột này. Lý do: PTNA: \"composed … from February 12 to March 17, 1838, with Nos. 6 and 9 possibly completed in autumn 1837\"; Henle Comments: \"FE1 First edition. Leipzig, Breitkopf & Härtel … published in late February 1839\". Nơi sáng tác (Leipzig) không có ở nguồn đã mở nên bỏ. Review D6-L4-gom: đã xem chữ trên trang (và dữ liệu), khớp câu; lượt 2 xác nhận chữ đã sửa. Giữ."
