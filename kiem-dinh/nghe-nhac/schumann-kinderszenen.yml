    review: "dung"
  - id: n7
    cau: Năm 1838 Schumann 27 tuổi, đã đính hôn với nghệ sĩ piano trẻ Clara Wieck, giữa lúc cuộc đính hôn vấp phải tranh cãi ngày càng gay gắt.
    loai: lich-su
    nguon: &id001
      - henle-hn44-vorwort
    ket_qua: da-sua
    ghi_chu: "Chữ cũ (cả description): \"yêu Clara Wieck, một nghệ sĩ piano trẻ đang nổi tiếng khắp châu Âu, nhưng cha cô kiên quyết ngăn cấm.\" Chữ mới: \"đã đính hôn với nghệ sĩ piano trẻ Clara Wieck, giữa lúc cuộc đính hôn vấp phải tranh cãi ngày càng gay gắt.\" Lý do: Henle: \"the escalating controversy over his engagement to Clara Wieck\"; \"Clara … fiancée\"; \"nổi tiếng khắp châu Âu\", \"cha cô ngăn cấm\" không có ở nguồn đã mở. Schumann sinh 8/6/1810 nên tháng 2–3/1838 ông 27 tuổi. Review D6-L4-gom: đã xem chữ trên trang (và dữ liệu), khớp câu; lượt 2 xác nhận chữ đã sửa. Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.deutsche-biographie.de/pnd118611666.html", "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf" ]
    luot_2_ghi_chu: "Sinh 8.6.1810 nên tháng 2–3/1838 ông 27 tuổi (Deutsche Biographie). Henle (Herttrich): 'the escalating controversy over his engagement to Clara Wieck'."
    review: "dung"
  - id: n8
    cau: 'Ngày 17/3/1838 ông viết cho Clara: có lần cô bảo ông "đôi khi giống như một đứa trẻ", và từ ý ấy ông viết khoảng ba mươi bản nhỏ, chọn ra chừng mười hai và đặt tên Kinderscenen.'
    loai: lich-su
    nguon:
      - henle-hn44-vorwort
      - ptna-op15
    ket_qua: dung
    ghi_chu: 'Henle: thư gửi Clara 17/3: "about 30 sweet little things … selected twelve and called them Kinderscenen"; PTNA: "You once wrote that I sometimes appear like a child in your eyes".'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/musics/65", "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html" ]
    luot_2_ghi_chu: "PTNA dịch thư 17/3/1838: Clara từng viết ông 'đôi khi giống như một đứa trẻ', ông viết khoảng 30 bản nhỏ, chọn 12, đặt tên Kinderscenen. Henle: thư ngày 17 tháng 3. Lưu ý: Schumann-Portal ghi thư ngày 19/3/1838."
  - id: n9
    cau: '"Em sẽ thích chúng, nhưng em phải quên mình là một nghệ sĩ bậc thầy."'
    loai: lich-su
    nguon: &id004
      - ptna-op15
    ket_qua: dung
    ghi_chu: 'PTNA: "However, forget that you are a virtuoso." Vế "Em sẽ thích chúng" là cách dịch thường gặp, PTNA chỉ trích vế sau; giữ vì nghĩa không đổi. Lượt 2 xem lại nếu cần nguyên văn tiếng Đức.'
    luot_2: dung
    luot_2_nguon: [ "https://www.schumann-portal.de/op-15.html", "https://enc.piano.or.jp/musics/65" ]
    luot_2_ghi_chu: "Schumann-Portal trích: 'Du wirst Dich daran erfreuen, mußt Dich aber freilich als Virtuosin vergeßen.' PTNA cũng dịch như vậy. 'Virtuosin' dịch 'nghệ sĩ bậc thầy' chấp nhận được."
  - id: n10
    cau: Bản in cuối cùng có 13 bản; một số bản bị loại có lẽ về sau nằm trong Bunte Blätter Op. 99 và Albumblätter Op. 124.
    loai: lich-su
    nguon: *id001
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"những bản bị loại về sau nằm trong Bunte Blätter Op. 99 và Albumblätter Op. 124.\" Chữ mới: \"một số bản bị loại có lẽ về sau nằm trong …\". Lý do: Henle: \"Some of the other pieces were possibly later included in the Bunte Blätter op. 99 and the Albumblätter op. 124\". Review D6-L4-gom: đã xem chữ trên trang (và dữ liệu), khớp câu; lượt 2 xác nhận chữ đã sửa. Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://enc.piano.or.jp/musics/65" ]
    luot_2_ghi_chu: "Henle: 'Some of the other pieces were possibly later included in the Bunte Blätter op. 99 and the Albumblätter op. 124.' PTNA tương tự; Henle Comments: 'the 13 published numbers'."
    review: "dung"
  - id: n11
    cau: 'Không phải nhạc cho trẻ con: Schumann gọi chúng là "hồi tưởng của một người lớn, dành cho người lớn".'
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: thư gửi Reinecke 6/10/1848: "They are reminiscences by a grown-up for grown-ups".'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html" ]
    luot_2_ghi_chu: "Thư gửi Carl Reinecke 6/10/1848: 'Rückspiegelungen eines Älteren für Ältere' / 'reminiscences by a grown-up for grown-ups' (Henle, Schumann-Portal)."
  - id: n12
    cau: 'Nhạc cho trẻ con tập đàn, ông viết mười năm sau: Album für die Jugend (link bài học).'
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: cùng thư 1848, "the Christmas Album [the original title of op. 68] … for those who are still young". Trang piano/tac-pham/schumann-album có (đã khóa).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Album_f%C3%BCr_die_Jugend,_Op.68_(Schumann,_Robert)", "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf" ]
    luot_2_ghi_chu: "IMSLP Album für die Jugend Op. 68: soạn 1848 (in 1849), tức mười năm sau 1838; Henle nêu op. 68 là album cho người trẻ."
  - id: n13
    cau: Năm 1839 nhà phê bình Ludwig Rellstab viết bài phê bình tập nhạc.
    loai: nam
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: "a review of the Kinderszenen by the famous critic Ludwig Rellstab, which appeared in the journal IRIS IM GEBIET DER TONKUNST on 9 August 1839".'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html" ]
    luot_2_ghi_chu: "Henle: bài phê bình của Ludwig Rellstab in trong Iris im Gebiete der Tonkunst ngày 9/8/1839."
  - id: n14
    cau: Rellstab là người có lẽ đã khởi nguồn biệt danh của sonata Ánh trăng (link hướng dẫn nghe).
    loai: lich-su
    nguon:
      - henle-hn1062
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"(người đặt biệt danh cho sonata Ánh trăng)\". Chữ mới: \"(người có lẽ đã khởi nguồn biệt danh của sonata Ánh trăng)\". Lý do: Henle HN 1062: \"Diese Assoziation hat ihren Ursprung vielleicht in Ludwig Rellstabs erster Kunstnovelle Theodor\"; Rellstab không trực tiếp đặt tên. Trang nghe-nhac/beethoven-moonlight cùng lô (phần A). Review D6-L4-gom: đã xem chữ trên trang (và dữ liệu), khớp câu; lượt 2 xác nhận chữ đã sửa. Giữ."
