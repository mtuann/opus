ghi_chu: 'Hướng dẫn nghe Kinderszenen Op. 15 (tầng Tác phẩm; bản ghi riêng tac-pham/schumann-kinderszenen, cap trỏ sang piano/tac-pham/schumann-traumerei và ngược lại: cấu trúc, không phải nhận định). Bản nhạc: Mutopia Op. 15 số 1–7 (.ly, .mid, "Leichte Stücke", 1900) và ấn bản Peters (Internet Archive robschumannswerk01schu, ảnh trang 60–72) cho giọng, nhịp, chữ tốc độ của 13 bài. Lịch sử: Henle HN 44 (lời tựa Herttrich 2007, Comments), PTNA Piano Encyclopedia, Henle HN 1062 (Rellstab), IMSLP. Bảng "| Mục | Thông tin |" đầu trang: n1–n6. Sửa trang: n3 (Sáng tác: bỏ Leipzig, số 6 và 9 mùa thu 1837, in cuối 2/1839), n6 (độ dài 17–22 phút), n7 (Clara: đính hôn, tranh cãi; bỏ "nổi tiếng khắp châu Âu", "cha cô ngăn cấm"; cả description), n10 ("có lẽ" Op. 99, 124), n14 (Rellstab "có lẽ" khởi nguồn biệt danh Ánh trăng), n37 (bỏ Réti), n45 (Horowitz), n46 (Argerich: bỏ đánh giá), n47 (bỏ Cortot), n55 (Nguồn). Chưa chắc: n36 (môtip số 1 vang lại ở các bản sau), n54 (Wiener Urtext). Câu ở hồ sơ khác (đã khóa): schumann-album n33 (hướng dẫn nghe Kinderszenen Op. 15, về tuổi thơ cho người lớn): trang giữ đúng. Số máy đếm nhịp từng cảnh không ghi trên trang (Peters in số máy đếm nhịp ở đầu mỗi bài, như Träumerei ♩ = 100, số 13 ♩ = 112; Henle Comments: các số này có từ lần in sửa của bản in đầu, tháng 3/1839). Không tính là nhận định: tiêu đề mục, chữ do ::hinh-cau-truc dựng (hồ sơ du-lieu/tac-pham/schumann-kinderszenen), mốc trong ::khoi-nghe. Thuật ngữ: recitative, môtip chưa có bản ghi trong thuat-ngu.yml (ghi cho D3-L5); rubato có.'
doi_chu:
- cu: Tháng 2–3 năm 1838 ở Leipzig (hai bản có thể từ cuối năm 1837); in đầu năm 1839 (Breitkopf & Härtel)
  moi: Tháng 2–3 năm 1838 (hai bản, số 6 và số 9, có thể đã xong từ mùa thu 1837); in cuối tháng 2 năm 1839 (Breitkopf & Härtel)
  ly_do: 'n3 (da-sua): PTNA (12/2–17/3/1838, số 6 và 9 có thể xong từ mùa thu 1837), Henle Comments (FE1 "published in late February 1839"); nơi sáng tác không có ở nguồn đã mở.'
- cu: Khoảng 17–20 phút
  moi: 'Khoảng 17–22 phút (bản thu Musopen trên trang này: khoảng 22 phút)'
  ly_do: 'n6 (da-sua): PTNA 17 phút 20 giây; 13 file Musopen trên Commons cộng lại 22 phút 5 giây.'
- cu: 'Năm 1838, Schumann 27 tuổi, yêu Clara Wieck, một nghệ sĩ piano trẻ đang nổi tiếng khắp châu Âu, nhưng cha cô kiên quyết ngăn cấm. Ngày 17/3/1838, ông viết cho Clara: có lần cô bảo ông "đôi khi giống như một đứa trẻ", và từ ý ấy ông đã viết khoảng ba mươi bản nhỏ ngộ nghĩnh, chọn ra chừng mười hai và đặt tên Kinderscenen. "Em sẽ thích chúng," ông viết, "nhưng em phải quên mình là một nghệ sĩ bậc thầy." Bản in cuối cùng có 13 bản; những bản bị loại về sau nằm trong Bunte Blätter Op. 99 và Albumblätter Op. 124.'
  moi: 'Năm 1838, Schumann 27 tuổi, đã đính hôn với nghệ sĩ piano trẻ Clara Wieck, giữa lúc cuộc đính hôn vấp phải tranh cãi ngày càng gay gắt. Ngày 17/3/1838, ông viết cho Clara: có lần cô bảo ông "đôi khi giống như một đứa trẻ", và từ ý ấy ông đã viết khoảng ba mươi bản nhỏ ngộ nghĩnh, chọn ra chừng mười hai và đặt tên Kinderscenen. "Em sẽ thích chúng," ông viết, "nhưng em phải quên mình là một nghệ sĩ bậc thầy." Bản in cuối cùng có 13 bản; một số bản bị loại có lẽ về sau nằm trong Bunte Blätter Op. 99 và Albumblätter Op. 124.'
  ly_do: 'n7 (da-sua), mô tả trang: lời tựa Henle HN 44 ("escalating controversy over his engagement to Clara Wieck"); "nổi tiếng khắp châu Âu", "cha cô ngăn cấm" không có ở nguồn đã mở. n7, n10 (da-sua): lời tựa Henle HN 44 ("Some of the other pieces were possibly later included in …").'
- cu: 'Tên gọi đến sau. Năm 1839, nhà phê bình Ludwig Rellstab (người đặt biệt danh cho sonata Ánh trăng) viết bài phê bình tập nhạc. Schumann bực bội: Rellstab hẳn tưởng rằng ông đặt một đứa trẻ đang khóc trước mặt rồi đi tìm nốt nhạc cho nó, trong khi sự thật ngược lại. Các tiêu đề "dĩ nhiên ra đời sau", và chỉ là "những gợi ý tinh tế cho cách chơi và cách hiểu". Vì vậy, hãy nghe nhạc trước, rồi mới xem tên có hợp không.'
  moi: 'Tên gọi đến sau. Năm 1839, nhà phê bình Ludwig Rellstab (người có lẽ đã khởi nguồn biệt danh của sonata Ánh trăng) viết bài phê bình tập nhạc. Schumann bực bội: Rellstab hẳn tưởng rằng ông đặt một đứa trẻ đang khóc trước mặt rồi đi tìm nốt nhạc cho nó, trong khi sự thật ngược lại. Các tiêu đề "dĩ nhiên ra đời sau", và chỉ là "những gợi ý tinh tế cho cách chơi và cách hiểu". Vì vậy, hãy nghe nhạc trước, rồi mới xem tên có hợp không.'
  ly_do: 'n14 (da-sua): Henle HN 1062: biệt danh "hat ihren Ursprung vielleicht in Ludwig Rellstabs … Theodor".'
- cu: 'Môtip chung: năm nốt mở đầu số 1, một bước nhảy lên quãng 6 rồi bốn nốt đi xuống, vang lại ở nhiều bản sau, thường chỉ còn chuỗi đi xuống. Nhà lý luận Rudolph Réti thậm chí coi cả tập gần như một bộ biến tấu, dù vài kết luận của ông hơi xa.'
  moi: 'Môtip chung: năm nốt mở đầu số 1, một bước nhảy lên quãng 6 rồi bốn nốt đi xuống; số 4 có liên hệ rõ với chủ đề này.'
  ly_do: 'n37 (da-bo): sách Réti chưa đọc được; "hơi xa" là đánh giá không nguồn. Review D6-L4-gom: n36: vế "vang lại ở nhiều bản sau, thường chỉ còn chuỗi đi xuống" không có nguồn nêu đủ các bản; viết theo PTNA (số 4 liên hệ rõ với chủ đề số 1).'
- cu:
  - 'Vladimir Horowitz: hay chơi Träumerei như một bản tặng thêm, kể cả trong buổi hòa nhạc trở về Moscow năm 1986; nghe cách ông giữ tiếng đàn rất nhỏ mà vẫn hát.'
  - 'Martha Argerich: tươi, bốc đồng, tốc độ nhanh, như trẻ con thật sự đang chơi.'
  - 'Alfred Cortot: rubato tự do, giọng kể chuyện của thế hệ nghệ sĩ đầu thế kỷ 20.'
  moi:
  - 'Vladimir Horowitz: chơi Träumerei ở cuối buổi hòa nhạc trở lại Carnegie Hall năm 1965 và trong buổi diễn ở Moskva năm 1986 (cả hai có đĩa thu trực tiếp); nghe cách ông giữ tiếng đàn rất nhỏ mà vẫn hát.'
  - 'Martha Argerich: thu trọn tập, cùng Kreisleriana (Deutsche Grammophon). So tốc độ của bà với số máy đếm nhịp in trong bản in đầu, như ♩ = 100 của Träumerei.'
  ly_do: 'n45, n46 (da-sua), n47 (da-bo): đĩa Sony 1965, DG 1986, DG Argerich đã mở; đánh giá về Argerich, Cortot không có nguồn; bản thu Cortot chưa mở nguồn.'
- cu:
  - Robert Schumann, thư gửi Clara Wieck ngày 17/3/1838; lời đáp của Schumann về bài phê bình của Rellstab (1839).
  - Rudolph Réti, The Thematic Process in Music (1951).
  - 'John Daverio, Robert Schumann: Herald of a "New Poetic Age" (Oxford University Press, 1997).'
  moi:
  - 'G. Henle Verlag, Scenes from Childhood op. 15, HN 44: lời tựa của Ernst Herttrich (2007), trích thư Schumann gửi Clara ngày 17/3/1838, thư gửi Carl Reinecke (1848) và gửi Heinrich Dorn về bài phê bình của Rellstab (1839).'
  - 'Từ điển piano PTNA, Kinderszenen Op. 15: thư gửi Clara ("giống như một đứa trẻ", "quên mình là một nghệ sĩ bậc thầy"), niên đại số 6 và số 9.'
  ly_do: 'n55 (da-sua): ghi nguồn đã mở có link; sách Réti, Daverio chưa đọc được.'
