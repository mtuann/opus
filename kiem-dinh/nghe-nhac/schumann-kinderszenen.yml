    nguon:
      - imslp-op15
    ket_qua: dung
    ghi_chu: src/data/nha-soan-nhac.yml (đã khóa) schumann 1810–1856; IMSLP Category Schumann. Năm sinh–mất kiểm ở hồ sơ dữ liệu nhà soạn nhạc.
