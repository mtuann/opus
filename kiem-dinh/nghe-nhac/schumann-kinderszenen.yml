  - id: n2
    cau: 'Bảng: Tên đầy đủ Kinderszenen (Cảnh tuổi thơ), Op. 15: 13 tiểu phẩm cho piano.'
    loai: ten
    nguon:
      - imslp-op15
      - henle-hn44
    ket_qua: dung
