    luot_2_ghi_chu: "Beethoven-Haus (Kurzführer triển lãm Mondschein-Sonate): biệt danh lần đầu được Wilhelm von Lenz (1852) gán cho Rellstab, người được cho là đã so Adagio với con thuyền dưới trăng trên hồ Vierwaldstätter từ 1832; chỗ trích chưa tìm thấy trong văn Rellstab. 'Có lẽ' là đúng mức."
    review: "dung"
  - id: n15
    cau: 'Schumann bực bội: Rellstab hẳn tưởng ông đặt một đứa trẻ đang khóc trước mặt rồi đi tìm nốt nhạc cho nó, trong khi sự thật ngược lại.'
    loai: lich-su
    nguon: *id001
    ket_qua: dung
