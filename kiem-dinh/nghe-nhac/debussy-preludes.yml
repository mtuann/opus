  - id: n34
    cau: Commons ghi bản thu Meyer thuộc phạm vi công cộng ở châu Âu, nhưng ở Mỹ nó vẫn còn được bảo hộ (theo luật Mỹ, bản thu thực hiện trước năm 1972 và phát hành từ năm 1947 trở đi vẫn còn được bảo hộ).
    loai: quy-tac
    nguon:
      - commons-meyer
      - commons-pd-eu-audio
      - commons-pd-us-record
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: ''Ở Mỹ, nơi đặt site, bản thu này vẫn còn được bảo hộ''. Commons gắn PD-EU-audio và PD-US-record; chữ của PD-US-record (theo Music Modernization Act 2018): bản thu cố định trước 15/2/1972 ''first published between 1947 and 1956 are copyrighted for a period of 110 years'', phát hành sau 1956 thì tới 15/2/2067 mới vào phạm vi công cộng; bản thu 1956 nên dù phát hành năm 1956 hay muộn hơn vẫn còn bảo hộ ở Mỹ. Bỏ ''nơi đặt site'' (GitHub Pages ở Mỹ cần nguồn ngoài, không phải điều trang cần). Năm phát hành đĩa DF 211/2 chưa xác định (1956 hay muộn hơn), nên chữ trang nói chung ''phát hành từ năm 1947 trở đi''. Commons gắn PD-US-record cho file, nhưng chính chữ mẫu ấy nói bản thu như vậy còn bảo hộ ở Mỹ: nhãn của Commons không mâu thuẫn với câu trang.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Claude_Debussy_-_Pr%C3%A9ludes_%28Livre_I%29_-_II._Voiles_%28Marcelle_Meyer%2C_1956%29.flac", "https://commons.wikimedia.org/wiki/File:Claude_Debussy_-_Pr%C3%A9ludes_%28Livre_I%29_-_IX._La_S%C3%A9r%C3%A9nade_interrompue.flac" ]
    luot_2_ghi_chu: "Commons: thẻ 'PD EU Audio'/PD-old-70-expired và 'PD US record': bản thu cố định trước 15/2/1972, phát hành 1947–1956 được bảo hộ ở Mỹ 110 năm sau khi phát hành (phát hành sau 1956 thì đến 2067). Commons không viết thẳng 'ở Mỹ còn bảo hộ' mà đặt thẻ luật Mỹ; với bản thu 1956, kết luận ấy đúng."
