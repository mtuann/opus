    cau: 'I: gợi hứng từ ba vũ nữ trên đỉnh một cột đá cổ ở Delphi (Hy Lạp), được bày ở bảo tàng Louvre (Paris).'
    loai: lich-su
    nguon:
      - henle-383-vorwort
      - ptna-1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: ''gợi hứng từ ba vũ nữ chạm trên một cột đá cổ tìm thấy ở Delphi (Hy Lạp) năm 1894''. Lời tựa Henle: ''Danseuses de Delphes evokes three Bacchantes atop a column displayed in the Louvre''. Năm 1894 chỉ thấy ở Wikipedia và trang hướng dẫn du lịch delphimuseum.gr (''found during the Great Excavation in 1894''), không có nguồn bậc 2: bỏ năm, thêm Louvre theo Henle.'
    luot_2: sai
    luot_2_nguon: [ "https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf", "https://www.louvre.fr/le-louvre-en-france-et-dans-le-monde/la-gypsotheque-du-louvre", "https://api.europeana.eu/record/v2/2064913/https___www_searchculture_gr_aggregator_edm_Delphi_Museum_000051__3A11535_50.json?wskey=api2demo" ]
    luot_2_ghi_chu: "câu đúng: I: gợi hứng từ ba vũ nữ trên đỉnh một cột đá cổ tìm thấy ở Delphi (Hy Lạp); Debussy xem bản đúc của cột này ở bảo tàng Louvre (Paris).; Henle: 'three Bacchantes atop a column displayed in the Louvre'. Nhưng cột đá gốc (cột Acanthus với ba vũ nữ) tìm thấy ở đền Apollo, nay ở bảo tàng Delphi (bản ghi Europeana của Bảo tàng Delphi); Louvre có bản đúc thạch cao 'colonne des Danseuses' (gypsothèque của Louvre, nay ở Versailles). Câu viết như thể cột đá cổ nằm ở Louvre."
