  cau: Trong bản nhạc, nhà thờ của thành nhô lên khỏi mặt nước giữa tiếng chuông và tiếng hát của các tu sĩ, rồi lại chìm xuống.
  loai: cau-truc
  nguon:
  - ptna-10
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: ''và vào những buổi sáng trời trong, nhà thờ của thành nhô lên khỏi mặt nước, vọng tiếng chuông, tiếng đàn organ và tiếng hát của các tu sĩ, rồi lại chìm xuống'' (chi tiết truyền thuyết chỉ có ở Wikipedia). PTNA tả đúng diễn biến ấy trong bản nhạc: chuông, nhà thờ hiện lên, ''the chanting of monks'', ''swallowed by the sea''. Viết lại thành điều bản nhạc làm.'
