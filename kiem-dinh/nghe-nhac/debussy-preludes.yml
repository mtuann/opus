    moi: "V. Les collines d'Anacapri (Những ngọn đồi ở Anacapri, trên đảo Capri): mở đầu bằng những nốt để ngân vang (Debussy ghi quittez, en laissant vibrer: buông phím, để ngân), rồi một điệu nhảy nhanh, nhẹ (Vif) chen với một giai điệu kiểu dân ca (avec la liberté d'une chanson populaire), gợi không khí miền Nam nước Ý"
