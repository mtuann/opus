ghi_chu: 'Hướng dẫn nghe Debussy, Préludes quyển 1 (tầng Tác phẩm, bản ghi debussy-preludes). Bản nhạc: bản in đầu Durand 1910 (D. & F. 7687, Internet Archive preludespourpian00debu, đọc ảnh trang). Lịch sử: lời tựa Lesure và Comments của Henle HN 383, Henle HN 643, PTNA (12 bài), IMSLP. Sửa: n5, n6 (buổi ra mắt: IMSLP và Henle lệch ngày 25/5 và 5/5/1910; Henle nói không có buổi ra mắt trọn quyển nên bỏ Jane Mortier), n16 (chưa đầy hai tháng), n30 (Marguerite Long), n34 (bản quyền Mỹ, bỏ ''nơi đặt site''), n39 (bỏ năm 1894, thêm Louvre), n50 (bỏ tarantella), n53 (trích chú thích Des pas), n68 (bỏ banjo, thêm quasi Tambouro), n70 (truyền thuyết Ys), n77–n79 (bản thu: hãng, năm, bỏ lời khen), n81 (ô 22–83), n95, n96 (mục Nguồn). Không bỏ câu nào. Bảng Theo dõi khi nghe giữ 12 dòng, thứ tự không đổi; ::khoi-nghe{moc} không đụng. Không có khuông nhạc. Thuật ngữ chưa có bản ghi trong thuat-ngu.yml: prélude (khúc dạo đầu), pentatonic (gam ngũ cung), impressionism (ấn tượng); whole-tone-scale có. Câu ve-site ở hồ sơ khác: nhac-ly/32 n8 (trang có Voiles, gam toàn cung: giữ, n41), cap-nhat n48 (bản thu trọn quyển Marcelle Meyer 1956 trên Commons, mốc đầu từng bản: giữ). Dữ liệu: ban_thu.lic ''phạm vi công cộng'' mâu thuẫn câu bản quyền Mỹ, đề xuất ở file sửa (hồ sơ bản ghi).'
