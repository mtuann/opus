    ghi_chu: 'Chữ cũ: ''trọn quyển do Jane Mortier chơi lần đầu ngày 3/5/1911 tại Salle Pleyel'' (theo IMSLP). Lời tựa Henle (Lesure, 1986): ''The Préludes were not given their first performance as a self-contained cycle''; Viñes số 5, 8, 9 (14/1/1911) và số 12; Liebich số 3, 4 (16/1/1911); Debussy số 3, 4, 6, 12 (29/3/1911); ''All of these performances took place in Paris''. Bản tiếng Anh ghi số 12 ngày 10/2/1912, bản tiếng Pháp ''le 10 février suivant'' (tức 1911; Debussy chơi số 12 ngày 29/3/1911): viết ''năm 1911''. Số VII không có trong danh sách nên viết ''phần lớn''. Mâu thuẫn hai nguồn về buổi trọn quyển: theo Lesure (gần nguồn gốc hơn), bỏ Jane Mortier.'
