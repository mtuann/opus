doi_chu:
  - cu: Debussy tự chơi ra mắt bốn bản (I, II, X và XI) ngày 25/5/1910 ở Paris; trọn quyển do Jane Mortier chơi lần đầu ngày 3/5/1911 tại Salle Pleyel
    moi: Debussy tự chơi ra mắt bốn bản (I, II, X và XI) tháng 5/1910 ở Paris; phần lớn các bản còn lại được Ricardo Viñes, Franz Liebich và chính Debussy chơi lần đầu ở Paris trong năm 1911
    ly_do: "n5 (da-sua), n6 (da-sua): lượt 1 D6-L8; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: "Prélude không còn là khúc dạo đầu. Ở Bach, prelude dẫn vào một fugue (xem Prelude Đô trưởng). Chopin biến nó thành một bản nhạc đứng riêng, ngắn, chỉ một ý: 24 prélude Op. 28 của ông đi qua đủ 24 giọng (xem Prélude Mi thứ). Debussy cũng viết 24 prélude, chia làm hai quyển, mỗi quyển mười hai bản (quyển 2 in năm 1913), nhưng không theo vòng giọng nào: mỗi bản là một bức tranh âm thanh. Quyển 1 được viết trong chừng ba tháng, từ tháng 12/1909 đến tháng 2/1910."
    moi: "Prélude không còn là khúc dạo đầu. Ở Bach, prelude dẫn vào một fugue (xem Prelude Đô trưởng). Chopin biến nó thành một bản nhạc đứng riêng, ngắn, chỉ một ý: 24 prélude Op. 28 của ông đi qua đủ 24 giọng (xem Prélude Mi thứ). Debussy cũng viết 24 prélude, chia làm hai quyển, mỗi quyển mười hai bản (quyển 2 in năm 1913), nhưng không theo vòng giọng nào: mỗi bản là một bức tranh âm thanh. Theo ngày Debussy ghi trên bản thảo, quyển 1 được viết xong trong chưa đầy hai tháng, từ tháng 12/1909 đến đầu tháng 2/1910, dù vài bản đã có phác thảo từ những năm 1907–1908."
    ly_do: "n16 (da-sua): lượt 1 D6-L8; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: "Một cây đàn như không có búa. Tiếng đàn ở đây phụ thuộc rất nhiều vào bàn đạp và cách chạm phím: nốt trầm được giữ ngân trong khi hòa âm bên trên đổi màu, các tầng âm thanh trải từ đáy đến đỉnh bàn phím, phần lớn ở sắc thái rất nhỏ. Debussy được kể là muốn người chơi làm cho người nghe quên rằng cây đàn có búa."
    moi: "Một cây đàn như không có búa. Tiếng đàn ở đây phụ thuộc rất nhiều vào bàn đạp và cách chạm phím: nốt trầm được giữ ngân trong khi hòa âm bên trên đổi màu, các tầng âm thanh trải từ đáy đến đỉnh bàn phím, phần lớn ở sắc thái rất nhỏ. Theo hồi ức của nghệ sĩ piano Marguerite Long, một câu Debussy hay nói là phải quên rằng cây đàn piano có búa."
    ly_do: "n30 (da-sua): lượt 1 D6-L8; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu: Bản thu gợi ý của nghệ sĩ piano người Pháp Marcelle Meyer, thu năm 1956, gồm đủ mười hai bản theo đúng thứ tự, nằm trên Wikimedia Commons. Ở Mỹ, nơi đặt site, bản thu này vẫn còn được bảo hộ, nên khối dưới đây chỉ dẫn link tới từng bản, không phát trực tiếp; mốc tham khảo là lúc bắt đầu từng bản trong file ấy. Muốn ghi mốc ngay tại đây, dán link YouTube hoặc link file của một bản thu khác vào khung.
