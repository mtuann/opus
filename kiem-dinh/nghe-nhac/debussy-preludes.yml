    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: ''Debussy được kể là muốn người chơi làm cho người nghe quên rằng cây đàn có búa.'' Grayson (Nineteenth-Century Music Review 2014), chú thích 9: Long, At the Piano with Debussy (1972), tr. 13: một trong những câu Debussy hay nói là ''one must forget that the piano has hammers''. Viết lại có người kể.'
