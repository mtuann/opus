    moi: "VI. Des pas sur la neige (Những bước chân trên tuyết), Triste et lent: một hình hai nốt lặp lại gần như suốt bài, như những bước chân nặng nề; Debussy ghi ngay ô đầu: Ce rythme doit avoir la valeur sonore d'un fond de paysage triste et glacé (nhịp điệu này phải có giá trị âm thanh của nền một phong cảnh buồn và giá lạnh)"
