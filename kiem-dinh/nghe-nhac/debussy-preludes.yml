  ghi_chu: 'Chữ cũ: ''mở đầu như tiếng chuông ngân, rồi nhịp tarantella sôi nổi của miền Nam nước Ý chen với một giai điệu kiểu dân ca Napoli''. Bản Durand: ''Très modéré'', ''quittez, en laissant vibrer'', ''Vif'', ''a Tempo (Avec la liberté d''une chanson populaire)''. Không nguồn nào đã mở gọi là tarantella; PTNA nói nhịp kiểu habanera ở đoạn giữa, giai điệu kiểu dân ca, ''Southern Europe''; Henle: ''Naples''. Viết theo chỉ dẫn in trên bản nhạc.'
