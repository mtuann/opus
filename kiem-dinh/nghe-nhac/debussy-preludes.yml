  ghi_chu: 'Chữ cũ: ''Ở Mỹ, nơi đặt site, bản thu này vẫn còn được bảo hộ''. Commons gắn PD-EU-audio và PD-US-record; chữ của PD-US-record (theo Music Modernization Act 2018): bản thu cố định trước 15/2/1972 ''first published between 1947 and 1956 are copyrighted for a period of 110 years'', phát hành sau 1956 thì tới 15/2/2067 mới vào phạm vi công cộng; bản thu 1956 nên dù phát hành năm 1956 hay muộn hơn vẫn còn bảo hộ ở Mỹ. Bỏ ''nơi đặt site'' (GitHub Pages ở Mỹ cần nguồn ngoài, không phải điều trang cần). Năm phát hành đĩa DF 211/2 chưa xác định (1956 hay muộn hơn), nên chữ trang nói chung ''phát hành từ năm 1947 trở đi''. Commons gắn PD-US-record cho file, nhưng chính chữ mẫu ấy nói bản thu như vậy còn bảo hộ ở Mỹ: nhãn của Commons không mâu thuẫn với câu trang.'
