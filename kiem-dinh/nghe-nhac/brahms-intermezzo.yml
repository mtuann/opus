ghi_chu: 'Hướng dẫn nghe Intermezzo La trưởng Op. 118 số 2 (tầng Tác phẩm; bản ghi tac-pham/brahms-intermezzo, loai nghe, không có chang/grade). Bản nhạc: bản in đầu Simrock (Berlin, cuối 1893, số bản in 10054), bản quét của Brahms-Institut qua IMSLP, tải từ Internet Archive (imslp-klavierstcke-op118-brahms-johannes), Op. 118 số 2 ở tr. 4–6; đối chiếu số ô với Mutopia (Aron Fay, nguồn Simrock). Quy ước đếm: không tính nốt lấy đà, bài hết ở ô 116; ô 49–56 có dấu nhắc lại (chơi hai lần). Ký hiệu đọc trên bản in đầu: Andante teneramente, 3/4, hóa biểu ba thăng suốt bài (không đổi hóa biểu ở đoạn Fa♯ trưởng); più lento ô 46; in tempo ô 49 (vạch nhắc lại); più lento, pp, u.c., legato ô 57; t.c., espress. ô 64, Tempo primo ô 65; f ô 69; più lento ô 114; hợp âm rải cuối có dấu lặng. Lịch sử: lời tựa và trang sản phẩm Henle HN 1377 (Katrin Eich, 2019), IMSLP, PTNA. Sửa: n12, n13, n17, n18, n29, n31, n32, n44–n47, n50, n51, n57, n62. Bỏ: n59, n60, n61 (dòng Nguồn sách in và Grove; nguồn đọc được gộp ở n62). Không tính là nhận định: tiêu đề mục, tiêu đề cột, câu dẫn ("Ghi lại thời điểm…"), chữ do ::hinh-cau-truc dựng (hinh.nghe, ở hồ sơ bản ghi), câu hỏi chỉ hỏi (trừ điều câu hỏi khẳng định: n43). Ví von (clarinet, viola, cello; "như một bài thánh ca vọng ra từ nhà thờ"; "như một kỷ niệm"; "như nói thầm với chính mình") là hình ảnh, không tách thành nhận định. Thuật ngữ: andante, una corda, tre corde, legato, rubato có bản ghi (thuat-ngu.yml đã khóa); "Andante" sửa theo nghĩa của bản ghi (n17). Chưa có bản ghi: intermezzo, teneramente, canon, chorale (hợp xướng), più lento (cho lô sau). Câu ve-site ở hồ sơ khác trỏ tới trang này: piano/tac-pham/liszt-liebestraum n96 (giai điệu ở giọng giữa, "bí mật nằm ở các bè giữa"): câu ấy giữ nguyên. Mốc ::khoi-nghe không đổi; bảng Theo dõi khi nghe không đổi (9 dòng, 9 mốc).'
