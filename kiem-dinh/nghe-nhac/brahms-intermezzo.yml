  - id: n13
    cau: Clara là một trong những người đầu tiên được biết các bản mới.
    loai: lich-su
    nguon: [henle-1377, henle-1377-vorwort]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Clara là một trong những người đầu tiên chơi các bản mới"; chữ mới: "… được biết các bản mới". Henle: "Clara Schumann was one of the first to be allowed to get to know the new pieces"; không nguồn nào nói bà chơi chúng đầu tiên (lời tựa: chính Brahms chơi cho bạn bè ở Ischl, rồi cho Wiener Tonkünstlerverein).'
  - id: n14
    cau: Clara khen các bản mới chứa cả một kho cảm xúc trong khuôn khổ nhỏ bé.
    loai: lich-su
    nguon: [henle-1377]
    ket_qua: dung
    ghi_chu: 'Henle: Clara "attested that they contained “a wealth of sentiment in the smallest of dimensions.”" Lời tựa Henle trích thêm thư Clara ngày 2/9/1893 ("welche Schätze sammle ich!", Litzmann, Briefe, Bd. 2, S. 526).'
  - id: n15
    cau: Intermezzo nghĩa đen là "khúc chen giữa".
    loai: dinh-nghia
    nguon: [cod-intermezzo]
    ket_qua: dung
    ghi_chu: 'COD: "In the middle"; nghĩa đầu tiên là phần giải trí chen giữa các phần khác. Trang piano/the-loai (đã khóa) cũng ghi "khúc chen giữa".'
  - id: n16
    cau: Ở Brahms cuối đời, intermezzo là tên ông đặt cho những bản nhạc piano ngắn, đứng riêng, mang tính trầm tư.
    loai: dinh-nghia
    nguon: [cod-intermezzo, ptna-213]
    ket_qua: dung
    ghi_chu: 'COD: "Short independent pf. pieces by Brahms"; PTNA: các tập cuối đời "gentle, melancholic melodies".'
  - id: n17
    cau: 'Bản số 2 ghi Andante teneramente: vừa phải như bước đi, dịu dàng.'
    loai: dinh-nghia
    nguon: [simrock-1893, tn, cod-tenero]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Andante teneramente: chậm vừa, dịu dàng"; chữ mới: "vừa phải như bước đi, dịu dàng". Theo bản ghi andante của thuat-ngu.yml (đã khóa: "Vừa phải, như bước đi"); teneramente = "tenderly" (COD, mục tenero). Bản in đầu ghi "Andante teneramente."'
  - id: n18
    cau: 'Ba nốt đầu tiên như một hạt giống: trong đoạn A, nhóm nốt ấy trở lại nhiều lần, mỗi lần trên một hòa âm khác.'
    loai: cau-truc
    nguon: [ptna-213, simrock-1893, mut-op118-2]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Gần như mọi giai điệu trong bài đều mọc lên từ **ba nốt đầu tiên**, như từ một hạt giống."; chữ mới: "**Ba nốt đầu tiên** như một hạt giống: trong đoạn A, nhóm nốt ấy trở lại nhiều lần, mỗi lần trên một hòa âm khác." "Gần như mọi giai điệu" không tìm được nguồn đọc được (bài phân tích của Rings trên Project MUSE bị chặn). PTNA: ở phần đầu "the same melodic motif appears repeatedly with various harmonic progressions". Bản nhạc: nhóm Đô♯ – Si rồi Rê (nốt lấy đà và ô 1) trở lại ở ô 4–5, 8–9, 12–13, 28–29.'
  - id: n19
    cau: 'Bài có ba đoạn: A – B – A.'
    loai: cau-truc
    nguon: [ptna-22831, simrock-1893]
    ket_qua: dung
    ghi_chu: 'PTNA: "three-part Lied form … A (measures 1-48), B (measures 49-76), and A (measures 77-116)".'
  - id: n20
    cau: Đoạn A ở La trưởng, gồm những câu nhạc bốn ô nhịp cân đối.
    loai: cau-truc
    nguon: [simrock-1893, mut-op118-2]
    ket_qua: dung
    ghi_chu: 'Bản in đầu: câu ô 1–4 (dừng ở hợp âm át), câu đáp ô 5–8 (kết ở Mi trưởng), lặp lại ô 9–16. "Như một bài hát ru" là ví von.'
  - id: n21
    cau: Đoạn A có một quãng giữa bấp bênh hơn trước khi giai điệu đầu quay về.
    loai: cau-truc
    nguon: [simrock-1893, mut-op118-2]
    ket_qua: dung
    ghi_chu: 'Ô 17–28: nốt đổi dấu (Đô thường, Fa thường, La♯, Si♯), hòa âm rời La trưởng; giai điệu đầu trở lại ở ô 29–30 (hợp âm rải giống ô 2), có espress., calando ô 33.'
  - id: n22
    cau: Đoạn B chuyển sang Fa♯ thứ, giọng thứ song song của La trưởng.
    loai: cau-truc
