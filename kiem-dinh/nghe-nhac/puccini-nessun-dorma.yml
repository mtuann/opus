    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giọng hát từ xa đầy lo âu, rồi lặng đi". Lời in "VOCI DI DONNE misteriose e lontane"; tổng phổ tr. 328 "CORO DONNE (interno, un po’ lontano)". Ghi rõ giọng nữ và lời. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
