  - cu: Luciano Pavarotti (aria gắn liền với tên tuổi ông; nổi tiếng toàn cầu qua World Cup 1990)
    moi: Luciano Pavarotti, trong bản thu trọn vở do Zubin Mehta chỉ huy (Decca, 1973)
    ly_do: 'n8: MusicBrainz; vế World Cup chỉ có nguồn bậc 3.'
  - cu: null
    moi: 'Puccini là nhà soạn nhạc opera Ý, tác giả La bohème, Tosca, Madama Butterfly. Turandot là opera cuối cùng của ông, và ông không kịp hoàn thành: khi ông mất (29/11/1924), vở đã gần xong, chỉ còn thiếu phần cuối màn 3. Nhạc sĩ Franco Alfano viết nốt phần kết, và vở opera ra mắt năm 1926 tại La Scala dưới sự chỉ huy của Arturo Toscanini. Trong đêm công diễn đầu, buổi diễn dừng lại đúng chỗ nhạc của Puccini dừng lại: Toscanini quay xuống khán giả và nói rằng tới đây nhà soạn nhạc đã buông bút. Phần Alfano viết được diễn từ đêm thứ hai.'
    ly_do: 'n9: bỏ lời đánh giá; COD (Puccini). n9–n22: COD, IMSLP, Encyclopedia of World Biography, lời opera 1926, Sheppard (2015).'
  - cu: 'Puccini là nhà soạn nhạc opera Ý cuối thời Lãng mạn, nổi tiếng với những giai điệu "nghe một lần nhớ mãi" (La bohème, Tosca, Madama Butterfly). Turandot là opera cuối cùng của ông — và ông không kịp hoàn thành: khi mất năm 1924, ông mới phối khí xong hai màn đầu và một phần màn 3. Nhạc sĩ Franco Alfano viết nốt phần kết từ bản phác thảo, và vở opera ra mắt năm 1926 tại La Scala dưới sự chỉ huy của Arturo Toscanini. Trong đêm công diễn đầu, tới đúng chỗ nhạc của Puccini dừng lại, Toscanini hạ đũa chỉ huy và quay xuống khán giả: tới đây là hết phần của thầy.'
    moi:
      - 'Aria "Nessun dorma" ở đầu màn 3, giữa đêm khuya. Turandot đã ra lệnh: không ai trong thành được ngủ, ai trái lệnh phải chết — tất cả phải thức để tìm ra tên chàng trai. Một mình trong vườn cung điện, Calaf hát: khi bình minh lên, chàng sẽ thắng.'
      - 'Một chi tiết thú vị: để tạo màu sắc Trung Hoa, Puccini đưa vào opera giai điệu dân ca Mạt lỵ hoa ("Hoa nhài") — bạn có thể nghe thấy nó ở những đoạn khác trong vở.'
    ly_do: 'n9: bỏ lời đánh giá; COD (Puccini). n9–n22: COD, IMSLP, Encyclopedia of World Biography, lời opera 1926, Sheppard (2015).'
  - cu:
      - 'Aria "Nessun dorma" mở đầu màn 3, giữa đêm khuya. Turandot đã ra lệnh: không ai trong thành được ngủ — tất cả phải thức để tìm ra tên chàng trai. Một mình dưới bầu trời sao, Calaf hát đầy tự tin: bình minh lên, chàng sẽ thắng.'
      - 'Một chi tiết thú vị: để tạo màu sắc Trung Hoa, Puccini đưa vào opera giai điệu dân ca Mạt lỵ hoa ("Hoa nhài") làm môtip gắn với công chúa — bạn có thể nghe thấy nó ở những đoạn khác trong vở.'
