  - id: n39
    cau: 'Hình ::hinh-cau-truc (hinh.nghe của tac-pham/puccini-nessun-dorma) ở mục "Sơ đồ cấu trúc", ngay trên bảng "Sơ đồ cấu trúc": 4 ô theo đúng 4 dòng của bảng "Sơ đồ cấu trúc", theo thứ tự: Mở đầu (lệnh "không ai được ngủ" · Calaf nhắc lại "Nessun dorma!"); Đoạn giữa (công chúa ngắm sao · bí mật tên chàng); Hợp xướng xen vào (giọng phụ nữ từ xa); Kết ("Vincerò!" · Si cao rất ngắn, La ngân dài). Chú thích: ""Nessun dorma": mỗi ô một dòng của bảng "Sơ đồ cấu trúc" ngay dưới (độ rộng các ô chỉ minh họa)." Chữ trong ô chép rút gọn chữ của dòng (và đoạn) ấy; không thêm đoạn, tên, giọng hay sự kiện nào ngoài trang; độ rộng và màu ô là cách vẽ.'
