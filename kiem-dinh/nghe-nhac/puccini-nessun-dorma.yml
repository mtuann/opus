  - id: n21
    cau: 'Một mình trong vườn cung điện, Calaf hát: khi bình minh lên, chàng sẽ thắng.'
    loai: lich-su
    nguon: *id001
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một mình dưới bầu trời sao, Calaf hát đầy tự tin". Lời in: cảnh là vườn cung điện ban đêm, Hoàng tử nằm trên bậc thềm; lời aria "All’alba vincerò!". Viết theo lời. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
