ghi_chu: 'Hướng dẫn nghe "Nessun dorma" (Turandot) (tầng Tác phẩm; bản ghi tac-pham/puccini-nessun-dorma; loai: nghe là cấu trúc). Không có khối abc, không có ::hinh-cau-truc (bảng Sơ đồ cấu trúc viết tay, kiểm ở đây). ::khoi-nghe không có bản thu (không sửa). Bản quyền: Puccini mất 1924, tổng phổ và lời in 1926 (Ricordi); không thêm khuông nhạc. Bản nhạc: tổng phổ Ricordi P.R. 117 (bản in lại) trên Internet Archive, đọc ảnh màn 3 tr. 322–330; lời: bản in Ricordi 1926 trên Internet Archive. Lịch sử: IMSLP, catalog.puccini.it, COD, EWB (Encyclopedia.com), Sheppard 2015 (tóm tắt). Không đọc được: Papers Past (chặn bot), iris.unive.it và metopera.org (Cloudflare, hàng đợi), Lyric Opera (403). Sửa trang: n5, n8, n9, n11, n12, n14–n18, n20–n23, n25, n26, n28, n30, n31, n33, n36, n38 và mô tả trang; bỏ n35. Câu ở hồ sơ khác trỏ tới trang này: nghe-nhac/nghe-gi-tiep n26 (link Puccini Nessun dorma ở mục Giọng hát): vẫn đúng; du-lieu/tac-pham/bizet-habanera n1 chỉ nhắc tên bản ghi. Thuật ngữ chưa có trong thuat-ngu.yml: tenor, hợp xướng (chorus), dramma lirico (aria đã có).'
nguon:
  - id: ricordi-fs
    bac: 1
    ten: 'Puccini, Turandot, tổng phổ Ricordi (P.R. 117; bản in lại "Opera Full Score Series"), Internet Archive (giacomopuccinitu0000vari), màn 3 tr. 322–330: sứ giả (ARALDI) tr. 322, hợp xướng "più lontano" tr. 323, aria "Andante sostenuto" của "IL PRINCIPE" từ tr. 324 (p), "CORO DONNE (interno, un po’ lontano)" tr. 328, kết "Vin-ce-rò!" tr. 330: nốt Si cao trên "-ce-" là móc kép có dấu nhấn, nốt La trên "-rò" là nốt tròn; đọc ảnh 06/11/2026'
    link: 'https://archive.org/details/giacomopuccinitu0000vari'
  - id: libretto
    bac: 1
    ten: 'Giuseppe Adami, Renato Simoni, Turandot: dramma lirico in tre atti e cinque quadri (Milano, G. Ricordi & C., 1926), Internet Archive (turandotdrammali02adam): "A Pekino - al tempo delle favole"; buổi diễn đầu "25 aprile 1926", "Maestro direttore e concertatore Arturo Toscanini"; "Timur - Re tartaro spodestato", "Il Principe Ignoto (Calaf) suo figlio"; luật "spieghi i tre enigmi … Ma chi affronta il cimento e vinto resta porga alla scure la superba testa"; cuối màn 2 "Dimmi il mio nome prima dell’alba, e all’alba io morirò"; đầu màn 3: vườn cung điện, đêm, "voci di Araldi … Altre voci, vicine e lontane, fanno eco", "Questa notte nessun dorma in Pekino", "Pena la morte", Hoàng tử nằm trên bậc thềm; lời aria "Tu pure, o Principessa, nella tua fredda stanza guardi le stelle … il nome mio nessun saprà", "VOCI DI DONNE misteriose e lontane: Il nome suo nessun saprà… E noi dovremo, ahimè, morir!", "Dilegua, o notte!… Tramontate, o stelle!… All’alba vincerò!"'
    link: 'https://archive.org/details/turandotdrammali02adam'
  - id: imslp-tur
    bac: 2
    ten: 'IMSLP, Turandot, SC 91 (wikitext qua api.php, 06/11/2026): "Dramma lirico in tre atti"; "First Performance=1926-04-25 in Milan, Teatro alla Scala: Arturo Toscanini (Puccini fragment only); 1926-04-26 (with Alfano’s revised completion)"; "The opera was mostly complete upon Puccini’s death in November 1924, including "Nessun dorma" … (whose orchestration is the composer’s). Alfano’s completion was confined to the last part of Act III"; Act III số 33 "Cosi comanda Turandot", số 34 "Nessun dorma!"; "Calaf (tenor)"'
    link: 'https://imslp.org/wiki/Turandot,_SC_91_(Puccini,_Giacomo)'
  - id: cat-puccini
    bac: 2
    ten: 'Giacomo Puccini: Catalogue of the Works (Centro studi Giacomo Puccini), 91. Turandot: "Time of origin July 1920 – October 1924"; "First performance: 25 April 1926 at the Teatro alla Scala, Milan … conductor: Arturo Toscanini"; "Calaf, suo figlio (Tenor)"'
    link: 'https://catalog.puccini.it/works/turandot'
  - id: cod-puccini
    bac: 2
    ten: 'Concise Oxford Dictionary of Music, mục Puccini (Encyclopedia.com): danh mục opera có La bohème, Tosca, Madama Butterfly; "he died of cancer before he could complete the duet which was planned as the climax of the work. It was completed skilfully by Alfano"; "Turandot (1920–6, last scene completed by Alfano)"; mục Turandot: "Opera in 3 acts … His last work, the final scene being completed by Alfano. Prod. Milan 1926"'
    link: 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/puccini-giacomo'
  - id: ewb-puccini
    bac: 2
    ten: 'Encyclopedia of World Biography và Baker’s, mục Puccini (Encyclopedia.com): "it was complete except for the last scene when the composer died of throat cancer, on 29 November 1924"; "On that night, the action and music froze just where Puccini had left it, and Toscanini turned to the audience with tears in his eyes and said, “Here the Maestro put down his pen.”"'
    link: 'https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/giacomo-puccini'
  - id: sheppard
    bac: 2
    ten: 'W. Anthony Sheppard, "Puccini and the Music Boxes", Journal of the Royal Musical Association 140/1 (2015), 41–92, tóm tắt trên Cambridge Core: "Puccini encountered ‘Jasmine Flower’ on these boxes, and in Turandot reaffirmed its status as the token of Chinese music"'
    link: 'https://doi.org/10.1080/02690403.2015.1008863'
  - id: bnf-puccini
    bac: 2
    ten: data.bnf.fr, Giacomo Puccini (1858-1924)
    link: 'https://data.bnf.fr/ark:/12148/cb12765786k'
  - id: mb-nd
    bac: 2
    ten: 'MusicBrainz, bản thu "Nessun dorma" của Pavarotti, Domingo, Björling, Carreras (tìm 06/11/2026): 45 bản, phần lớn 2:43–3:35; link là một bản của Pavarotti, 3:04'
    link: 'https://musicbrainz.org/recording/096925f9-020f-4911-a83c-d8124c7406b9'
  - id: mb-tur
    bac: 2
    ten: MusicBrainz, Turandot (Sutherland, Pavarotti, Caballé, Ghiaurov, John Alldis Choir, London Philharmonic Orchestra, Zubin Mehta), Decca Records, GB, 1973
    link: 'https://musicbrainz.org/release/1721c799-3945-4feb-876d-cfd609829405'
