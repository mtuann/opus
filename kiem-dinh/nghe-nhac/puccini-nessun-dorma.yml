  - id: n33
    cau: 'Câu hỏi, gợi ý: trong tổng phổ, Puccini viết nốt Si cao trên âm "-ce-" chỉ bằng một nốt móc kép, rất ngắn, rồi mới ngân dài nốt La ở âm cuối.'
    loai: cau-truc
    nguon:
      - ricordi-fs
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(Gợi ý: trong bản nhạc gốc, Puccini viết nốt Si này khá ngắn — các tenor hiện đại thường ngân dài để khoe giọng.)" Vế đầu đúng (móc kép, tr. 330), ghi cụ thể hơn. Vế "các tenor hiện đại thường ngân dài để khoe giọng" chưa tìm được nguồn bậc 1–2: đổi thành lời mời người nghe tự so sánh. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
