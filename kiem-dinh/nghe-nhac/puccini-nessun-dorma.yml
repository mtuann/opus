  - id: n17
    cau: 'Công chúa Turandot ra điều kiện: người muốn cưới nàng phải giải được ba câu đố, không giải được thì bị chém đầu.'
    loai: lich-su
    nguon: *id001
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ai muốn cưới nàng phải giải được ba câu đố, sai một câu là mất đầu". Lời in: người dòng dõi vua chúa giải được ba câu đố thì được cưới; ai thử mà thua thì "porga alla scure la superba testa" (đưa đầu cho rìu). Sửa theo lời. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.opera-arias.com/puccini/turandot/libretto/", "https://www.eno.org/?p=224738" ]
    luot_2_ghi_chu: "Lời opera màn 1: Turandot lấy người 'di sangue regio' giải được ba câu đố, ai thua 'porga alla scure la superba testa' (đưa đầu cho rìu chém). ENO: 'Anyone who stands trial and fails will be executed'."
    review: dung
  - id: n18
    cau: Hoàng tử Calaf là con vua Tartar bị truất ngôi, giấu tên thật.
    loai: lich-su
    nguon:
      - libretto
      - cat-puccini
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hoàng tử Calaf (lưu vong, giấu tên thật)". Lời in: "Timur - Re tartaro spodestato", "Il Principe Ignoto (Calaf) suo figlio". Viết theo lời. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.santafeopera.org/whats-on/turandot-2027/", "https://www.opera.org.au/productions/turandot-sydney", "https://www.opera-arias.com/puccini/turandot/libretto/" ]
    luot_2_ghi_chu: "Santa Fe Opera: Timur 'the exiled King of Tartary', cha của Calàf; Opera Australia: 'the banished King of Tartary'. Lời opera: Calaf bảo cha im vì kẻ cướp ngôi đang truy lùng, chàng là 'Il Principe ignoto' giấu tên."
    review: dung
  - id: n19
    cau: 'Calaf giải được cả ba câu đố, Turandot vẫn không chịu; chàng ra "câu đố ngược": nếu trước bình minh nàng đoán được tên chàng, chàng sẽ chịu chết.'
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Cuối màn 2: "Dimmi il mio nome prima dell’alba, e all’alba io morirò!"'
    luot_2: dung
