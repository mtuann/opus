    luot_2_ghi_chu: "Tổng phổ giảm piano (Muzyka 1980, dựa trên bản Ricordi) tr. 345: âm '-ce-' ghi bằng một nốt móc kép (hai đuôi cờ) ở Si cao, âm '-rò' là nốt tròn La. Opera Australia: nốt Si là 'tiny … meant to be sung quickly'. Lượt 2 không đọc được tổng phổ dàn nhạc Ricordi; bản giảm piano ghi như câu nói."
