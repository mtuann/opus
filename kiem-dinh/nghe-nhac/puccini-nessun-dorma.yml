    luot_2_nguon: [ "https://www.opera-arias.com/puccini/turandot/libretto/", "https://archive.org/details/31761034853614" ]
    luot_2_ghi_chu: "Lời: Le donne 'Il nome suo nessun saprà… E noi dovrem, ahimè, morir, morir!'; tổng phổ ghi '(interno, un po' lontano)' (từ xa)."
    review: dung
  - id: n26
    cau: 'Sơ đồ, Kết: Calaf xua tan đêm tối, giọng rực rỡ dần, khép lại bằng tiếng "Vincerò!" (ta sẽ thắng!): một nốt Si cao rất ngắn, rồi nốt La ngân dài.'
    loai: cau-truc
    nguon:
      - ricordi-fs
      - libretto
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khép lại bằng nốt Si cao ngân dài trên tiếng "ta sẽ thắng!"". Tổng phổ tr. 330: "Vin-ce-rò!", Si cao (móc kép, có dấu nhấn) trên "-ce-", rồi nốt tròn La trên "-rò". Nốt ngân dài trong bản nhạc là La, không phải Si. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/31761034853614", "https://www.opera-arias.com/puccini/turandot/libretto/" ]
    luot_2_ghi_chu: "Tổng phổ tr. 345: 'Vin-ce-' với 'ce' là nốt móc kép ở Si cao (sau nốt móc đơn chấm), rồi 'rò' là nốt tròn La ngân, có 'poco allarg.'; Calaf hát 'Dilegua, o notte!… Vincerò!'."
    review: dung
