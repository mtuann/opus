    luot_2_ghi_chu: "Chỉ dẫn sân khấu tổng phổ: 'Il giardino della Reggia… È notte… Adagiato sui gradini del padiglione è il Principe'; lời: 'Dilegua, o notte!… All'alba vincerò!'."
    review: dung
  - id: n22
    cau: Để tạo màu sắc Trung Hoa, Puccini đưa vào opera giai điệu dân ca Mạt lỵ hoa ("Hoa nhài"); giai điệu ấy xuất hiện ở những đoạn khác trong vở.
    loai: lich-su
    nguon:
      - sheppard
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ thêm "làm môtip gắn với công chúa". Sheppard: Puccini gặp "Jasmine Flower" qua hộp nhạc và "in Turandot reaffirmed its status as the token of Chinese music". Vế "môtip gắn với công chúa" chỉ thấy ở nguồn bậc 3 (Wikipedia); bỏ. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://features.opera.org.au/turandot-cheat-sheet/", "https://lareviewofbooks.org/article/turandot-metropolitan-opera-giacomo-puccini-orientalist-china-fascism/", "https://www.cambridge.org/core/journals/journal-of-the-royal-musical-association/article/puccini-and-the-music-boxes/4ED3974A7C448D5B9625CCE512369D53" ]
    luot_2_ghi_chu: "Opera Australia: giai điệu 'jasmine flower' do hợp xướng thiếu nhi hát ở màn 1 và trở lại 'again and again through the opera' như chủ đề của công chúa; LARB: 'Mo Li Hua' là dân ca Trung Hoa thật, Puccini dùng trong Turandot; Sheppard (JRMA) nói về 'Jasmine Flower' trong Turandot."
    review: dung
  - id: n23
    cau: 'Sơ đồ, Mở đầu: các sứ giả từ xa loan lệnh "không ai được ngủ", những giọng khác vọng lại; Calaf một mình nhắc lại "Nessun dorma!" giữa đêm.'
    loai: cau-truc
    nguon:
      - libretto
      - ricordi-fs
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tiếng loa và hợp xướng từ xa loan lệnh … Calaf một mình đáp lại giữa đêm". Lời in và tổng phổ: ARALDI (sứ giả) tr. 322, hợp xướng "più lontano" tr. 323, rồi Calaf "Nessun dorma!… nessun dorma!…" (tr. 324). "Tiếng loa" dễ hiểu nhầm là loa phát thanh; đổi thành sứ giả. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/31761034853614", "https://www.opera-arias.com/puccini/turandot/libretto/" ]
    luot_2_ghi_chu: "Tổng phổ: 'Dalle estreme lontananze giungono voci di Araldi… Altre voci, vicine e lontane, fanno eco'; rồi Il Principe hát 'Nessun dorma! Nessun dorma!'."
    review: dung
