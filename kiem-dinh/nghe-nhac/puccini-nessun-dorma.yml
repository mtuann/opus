khuong_nhac: []
doi_chu:
  - cu: 'Câu chuyện lấy bối cảnh Bắc Kinh huyền thoại: công chúa Turandot lạnh lùng ra điều kiện — ai muốn cưới nàng phải giải được ba câu đố, sai một câu là mất đầu. Hoàng tử Calaf (lưu vong, giấu tên thật) giải được cả ba, nhưng Turandot vẫn không chịu. Chàng bèn ra một "câu đố ngược": nếu trước bình minh nàng đoán được tên chàng, chàng sẽ chịu chết.'
    moi: 'Câu chuyện lấy bối cảnh Bắc Kinh "thời cổ tích": công chúa Turandot lạnh lùng ra điều kiện — người muốn cưới nàng phải giải được ba câu đố, không giải được thì bị chém đầu. Hoàng tử Calaf (con vua Tartar bị truất ngôi, giấu tên thật) giải được cả ba, nhưng Turandot vẫn không chịu. Chàng bèn ra một "câu đố ngược": nếu trước bình minh nàng đoán được tên chàng, chàng sẽ chịu chết.'
    ly_do: 'n9–n22: COD, IMSLP, Encyclopedia of World Biography, lời opera 1926, Sheppard (2015).'
  - cu: 'Nghe nốt cao cuối cùng: bạn cảm thấy đó là Calaf đang "khoe giọng", hay là cảm xúc vỡ òa? (Gợi ý: trong bản nhạc gốc, Puccini viết nốt Si này khá ngắn — các tenor hiện đại thường ngân dài để khoe giọng.)'
    moi: 'Nghe nốt cao cuối cùng: bạn cảm thấy đó là Calaf đang "khoe giọng", hay là cảm xúc vỡ òa? (Gợi ý: trong tổng phổ, Puccini viết nốt Si cao trên âm "-ce-" chỉ bằng một nốt móc kép, rất ngắn, rồi mới ngân dài nốt La ở âm cuối. Nghe xem ca sĩ bạn chọn giữ nốt Si ngắn hay ngân dài.)'
    ly_do: 'n33: tổng phổ tr. 330.'
  - cu: 'Aria này khiến cả những người chưa từng nghe opera cũng thuộc lòng. Theo bạn, điều gì làm nên sức hút đó: giai điệu, giọng hát, hay câu chuyện?'
    moi: 'Theo bạn, điều gì làm nên sức hút của aria này: giai điệu, giọng hát, hay câu chuyện?'
