  - id: n2
    cau: 'Mô tả trang: Mendelssohn viết concerto này cho người bạn, nghệ sĩ violin Ferdinand David, concertmaster của dàn nhạc Gewandhaus Leipzig mà Mendelssohn làm nhạc trưởng.'
    loai: lich-su
    nguon: [imslp, cle, bso]
