  - id: n5
    cau: 'Sáng tác: hoàn thành năm 1844.'
    loai: nam
    nguon: [imslp, bso]
    ket_qua: dung
    ghi_chu: 'IMSLP "1838-1844 (Sept. 16), rev.1845"; BSO: "only completed the piece in 1844 after years of sketching".'
  - id: n6
    cau: 'Công diễn: 13/3/1845, Leipzig; độc tấu Ferdinand David.'
    loai: nam
    nguon: [imslp, bso, indy]
    ket_qua: dung
    ghi_chu: 'IMSLP "1845-03-13 in Leipzig, Saal des Gewandhauses: Ferdinand David (violin), Gewandhaus orchestra, Niels Gade (conductor)"; BSO, Indianapolis cùng ngày.'
  - id: n7
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    nguon: [imslp]
    ket_qua: dung
    ghi_chu: IMSLP Piece Style Romantic.
  - id: n8
    cau: 'Độ dài: khoảng 24–27 phút, 3 chương nối liền nhau.'
    loai: so-lieu
    nguon: [mb-hahn, mb-jansen, mb-heifetz, cle, imslp]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 26–28 phút". Chữ mới: "Khoảng 24–27 phút". Lý do: ba bản thu trên MusicBrainz: Heifetz/Toscanini 23:49, Hahn/Wolff 26:09, Jansen/Chailly 26:50; Cleveland ghi "Duration: 25 minutes"; IMSLP ghi Average Duration 30 minutes (con số chung, không phải bản thu đo). Không bản thu nào đã mở tới 28 phút. Ba chương nối liền: xem n17.'
  - id: n9
    cau: Mendelssohn viết concerto này cho người bạn, nghệ sĩ violin Ferdinand David.
    loai: lich-su
    nguon: [imslp, cle, bso]
    ket_qua: dung
    ghi_chu: 'IMSLP: Dedication Ferdinand David. Cleveland: "a gift of friendship …; Mendelssohn had known Ferdinand David (1810–73) since boyhood". BSO: thư 30/7/1838 "I''d like to write a violin concerto for you next winter".'
  - id: n10
    cau: Ferdinand David là concertmaster của dàn nhạc Gewandhaus Leipzig mà Mendelssohn làm nhạc trưởng.
    loai: lich-su
    nguon: [cle, bso, indy]
    ket_qua: dung
    ghi_chu: 'Cleveland: "shortly after the composer took over the directorship of the Leipzig Gewandhaus Orchestra, he invited the violinist to be his concertmaster". BSO: Mendelssohn "became director of the Gewandhaus concerts in Leipzig in 1836, he had David … appointed to the position of concertmaster" (Indianapolis ghi 1835; trang không ghi năm).'
  - id: n11
    cau: Trong thư từ trao đổi suốt những năm sáng tác, hai người bàn cả những chi tiết kỹ thuật của phần violin.
    loai: lich-su
    nguon: [bso, indy, aspen]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hai người trao đổi thư từ suốt quá trình sáng tác về từng chi tiết kỹ thuật." Chữ mới như câu. Lý do: BSO: "his correspondence with David is sometimes filled with discussions of specific detailed points of technique, and sometimes with the violinist''s urgent plea that he finish the piece"; Aspen: "David was Mendelssohn''s adviser on matters of technical detail regarding the solo part"; Indianapolis: David "giving frequent advice regarding technical matters through the compositional process". Nguồn nói thư có bàn chi tiết kỹ thuật, không nói "từng chi tiết", nên viết nhẹ lại.'
  - id: n12
    cau: Đây là một trong những concerto violin được biểu diễn nhiều nhất mọi thời đại.
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang. Không tìm được nguồn bậc 1–2 có số liệu biểu diễn; các chú giải chỉ có lời khen ("one of the most original and attractive concertos ever written", BSO) hay "the first major Romantic violin concerto that most students learn" (Aspen), không phải điều câu nói.'
  - id: n13
    cau: Mendelssohn phá ba thói quen của concerto Cổ điển (violin vào ngay, cadenza giữa chương, các chương nối liền).
    loai: lich-su
    nguon: [bso, cle, cmu]
    ket_qua: dung
    ghi_chu: 'BSO kể đủ ba điều: bỏ ritornello của dàn nhạc ("a radical departure from standard, Baroque-derived concerto practice"), cadenza "usually placed at the end of the movement" thì đặt "in the heart of the movement", và "link all the movements into one another without a break … never in a work having the temerity to call itself a concerto". Cleveland: "usual orchestral exposition", "traditional place at the end of the movement", "another striking departure from convention". CMU: chương 1 concerto Cổ điển có phần trình bày đầu "for orchestra alone".'
  - id: n14
    cau: 'Link "Concerto và ritornello" dẫn tới /opus/hinh-thuc/concerto/.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: src/content/docs/hinh-thuc/concerto.md có, title "Concerto và ritornello", đã khóa (khoa.json). Trang ấy nói concerto Cổ điển thường có phần trình bày của dàn nhạc trước, cadenza gần cuối chương 1, và Mendelssohn cho violin vào gần như ngay, nối các chương: khớp.'
  - id: n15
    cau: Violin vào gần như ngay lập tức, chỉ sau một ô nhịp rưỡi, thay vì chờ dàn nhạc trình bày.
    loai: cau-truc
    nguon: [ia-score, cle, aspen]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 1: Violino principale nghỉ ô 1, nghỉ nửa đầu ô 2 (nhịp ¢), vào ở nửa sau ô 2 (p). Aspen: "the two measures of orchestral “curtain” before the soloist introduces the principal theme" (phác thảo đầu); Cleveland: "dispenses with the usual orchestral exposition and introduces the solo instrument right away".'
  - id: n16
    cau: Cadenza được viết sẵn và đặt trước phần tái hiện, thay vì gần cuối chương; nó trở thành cây cầu nối phát triển và tái hiện.
    loai: cau-truc
    nguon: [ia-score, cle, bso]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 17: "Cadenza ad libitum" viết đủ nốt sau cao trào ff của phần phát triển, chưa tới nửa chương 528 ô; trang 18: dàn nhạc vào lại chủ đề chính khi violin còn rải hợp âm. Cleveland: "Mendelssohn moved it from its traditional place at the end of the movement to the middle, allowing it to grow organically out of the development section and naturally resolve in the recapitulation". BSO: "allowing the soloist the chance to complete the development and inaugurate the recapitulation".'
  - id: n17
    cau: 'Ba chương nối liền: một nốt giữ dài của bassoon nối chương 1 sang chương 2.'
    loai: cau-truc
    nguon: [ia-score, bso, cle]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 27: cuối chương 1, cả dàn nhạc dừng, riêng Fagotti giữ nốt (nối dấu luyến qua các ô có dấu ngân) sang ô đầu Andante. BSO: "the first bassoon fails to cut off with the rest of the orchestra, but holds its note into what would normally be silence"; Cleveland: "three movements … are played without pause"; "a single note held by a solo bassoon provides a link to the beautiful Andante".'
  - id: n18
    cau: Nốt bassoon giữ dài là để khán giả không vỗ tay chen giữa chương 1 và chương 2.
    loai: lich-su
    nguon: [bso, aspen]
    ket_qua: dung
    ghi_chu: 'BSO (Ledbetter): "The obvious intention here is to forestall intrusive applause after the first movement; Mendelssohn gradually came to believe that the various movements of a large work should be performed with as little pause as possible between them".'
  - id: n19
    cau: 'Theo dõi, chương 1 Allegro molto appassionato: dàn nhạc rì rầm, violin vào ngay với chủ đề chính đầy khao khát ở Mi thứ, âm vực cao.'
    loai: cau-truc
    nguon: [ia-score, indy]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 1: Allegro molto appassionato; violin I, II, viola rải móc kép p, timpani và bè trầm pizz.; violin độc tấu vào ở vùng cao (lên tới Mi 6), giọng Mi thứ. Indianapolis: "a soaring, restless melody"; thư Mendelssohn 1839: "The whole of the first solo is to be for the E string".'
  - id: n20
    cau: 'Theo dõi, chủ đề 2 chương 1: kèn gỗ (clarinet, sáo) hát chủ đề 2 dịu dàng ở giọng trưởng, trên nốt Sol buông giữ dài của violin.'
    loai: cau-truc
    nguon: [ia-score, bso, indy]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 9: violin độc tấu đi xuống tới Sol 3 (dây Sol buông), giữ nốt tròn pp tám ô; Flauti và Clarinetti chơi chủ đề "tranq." pp, Sol trưởng; rồi violin nhắc lại chủ đề. BSO: "the solo violin … floats gently downward to its very lowest note, on the open G string, as the clarinets and flutes sing the tranquil new melody"; "relative major key of G".'
  - id: n21
    cau: 'Theo dõi, cadenza: violin một mình, hợp âm rải nhanh khắp các dây.'
    loai: cau-truc
    nguon: [ia-score]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 17: cadenza chỉ có bè violin (dàn nhạc nghỉ): các hình nốt rải, láy rền (Tempo I) rồi chuỗi hợp âm rải móc ba nhảy qua bốn dây (a tempo), kéo sang tái hiện. Câu tả nét chính, khớp.'
  - id: n22
    cau: 'Theo dõi, tái hiện: trong lúc violin vẫn rải hợp âm, dàn nhạc lặng lẽ vào lại chủ đề chính.'
    loai: cau-truc
    nguon: [ia-score, cle, indy]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 18: sáo, oboe và violin I vào chủ đề chính pp, violin độc tấu tiếp tục rải hợp âm. Cleveland: "it continues while the flute, oboe, and first violins play the main theme".'
  - id: n23
    cau: 'Theo dõi, cầu nối: bassoon giữ một nốt dài khi dàn nhạc dừng, dẫn thẳng sang chương 2.'
    loai: cau-truc
    nguon: [ia-score, bso]
    ket_qua: dung
    ghi_chu: Như n17.
  - id: n24
    cau: 'Theo dõi, chương 2 Andante: Đô trưởng, violin hát một giai điệu êm, dịu.'
    loai: cau-truc
    nguon: [ia-score, indy, bso]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đô trưởng, giai điệu hát như một ca khúc không lời". Chữ mới: "Đô trưởng, violin hát một giai điệu êm, dịu". Lý do: phép so sánh với ca khúc không lời (Lieder ohne Worte) không thấy ở nguồn bậc 1–2 đã mở (chỉ ở trang phổ thông). Tổng phổ trang 27: Andante, 6/8, không hóa biểu (Đô trưởng), violin độc tấu vào p với giai điệu. Indianapolis: "an Andante in C major, offers a tender theme sung by the soloist"; BSO: "C major and the lyrical second movement".'
  - id: n25
    cau: 'Theo dõi, cầu nối chương 2 sang 3: đoạn ngắn ở Mi thứ, trầm tư, chuẩn bị cho chương cuối.'
    loai: cau-truc
    nguon: [ia-score, indy, bso]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 37: Allegretto non troppo, một dấu thăng (Mi thứ), violin độc tấu "espress." trên dàn dây, kèn nghỉ, kết bằng hợp âm Si trưởng (át) có dấu ngân rồi sang Allegro molto vivace. Indianapolis: "Fourteen bars of transitional material bridge to the concluding section"; BSO: "the soloist and orchestral strings play a brief transition that allows a return to the key of E".'
  - id: n26
    cau: 'Theo dõi, chương 3 Allegro molto vivace: kèn gọi, rồi violin chạy nhẹ như nhạc tiên của Giấc mộng đêm hè: nhanh, sáng, Mi trưởng.'
    loai: cau-truc
    nguon: [ia-score, indy, bso]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 37: Allegro molto vivace, bốn dấu thăng (Mi trưởng); kèn horn, trumpet, bassoon, timpani gọi ff; violin đáp bằng hợp âm rải đi lên "p scherzando". Indianapolis: "A tiny introduction and brass fanfare opens the brilliant finale … Echoes of Midsummer Night''s Dream are everywhere"; BSO: "brilliantly light and fleet-footed examples of “fairy music”".'
  - id: n27
    cau: Khác với (concerto của) Mozart, violin vào gần như ngay từ đầu.
    loai: lich-su
    nguon: [cmu, ia-score]
    ket_qua: dung
    ghi_chu: 'CMU: chương 1 concerto Cổ điển là sonata hai phần trình bày, "the first exposition, for orchestra alone", tài liệu lấy Mozart làm mẫu ("often in Mozart presenting all of the material heard in the first ritornello"). Op. 64: violin vào ở ô 2 (n15).'
  - id: n28
    cau: Khi cadenza kết thúc thì dàn nhạc vào lại.
    loai: cau-truc
    nguon: [ia-score, cle]
    ket_qua: dung
    ghi_chu: Tiền đề của câu hỏi "Bạn có nhận ra chỗ cadenza kết thúc và dàn nhạc vào lại không?". Như n22.
  - id: n29
    cau: Chương 1 ở Mi thứ, chương 3 ở Mi trưởng.
    loai: cau-truc
    nguon: [ia-score, imslp, bso]
    ket_qua: dung
    ghi_chu: 'Tổng phổ: chương 1 một dấu thăng, kết Mi thứ; Allegro molto vivace bốn dấu thăng. BSO: "a return to the key of E (this time in the major mode) for the lively finale".'
  - id: n30
    cau: 'Câu hỏi: giống Beethoven 5 (link /opus/nghe-nhac/beethoven-5/), Mi thứ sang Mi trưởng là hành trình "từ tối ra sáng".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: src/content/docs/nghe-nhac/beethoven-5.md có (lô này, chưa khóa: bản thật hiện "sắp có", có trong trang.yml); trang ấy nói hành trình "từ Đô thứ tăm tối đến Đô trưởng chiến thắng": khớp ý so sánh. Phần Mi thứ, Mi trưởng là n29.'
  - id: n31
    cau: 'Link "mẫu ghi chép" dẫn tới /opus/nghe-nhac/mau/.'
