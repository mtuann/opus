    luot_2: dung
    luot_2_nguon: [ "https://www.laphil.com/musicdb/pieces/4500/violin-concerto-in-e-minor-op-64", "https://imslp.org/wiki/Violin_Concerto_in_E_minor,_Op.64_(Mendelssohn,_Felix)" ]
    luot_2_ghi_chu: "LA Phil: 'written for another violinist friend of the composer, Ferdinand David'; IMSLP: Dedication Ferdinand David."
  - id: n10
    cau: Ferdinand David là concertmaster của dàn nhạc Gewandhaus Leipzig mà Mendelssohn làm nhạc trưởng.
    loai: lich-su
    nguon: [ cle, bso, indy ]
    ket_qua: dung
    ghi_chu: 'Cleveland: "shortly after the composer took over the directorship of the Leipzig Gewandhaus Orchestra, he invited the violinist to be his concertmaster". BSO: Mendelssohn "became director of the Gewandhaus concerts in Leipzig in 1836, he had David … appointed to the position of concertmaster" (Indianapolis ghi 1835; trang không ghi năm).'
    luot_2: dung
    luot_2_nguon: [ "https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64", "https://www.laphil.com/musicdb/pieces/4500/violin-concerto-in-e-minor-op-64" ]
    luot_2_ghi_chu: "Aspen (Ledbetter): khi Mendelssohn làm giám đốc các buổi hòa nhạc Gewandhaus, ông đặt David làm concertmaster; LA Phil cũng nói vậy."
  - id: n11
    cau: Trong thư từ trao đổi suốt những năm sáng tác, hai người bàn cả những chi tiết kỹ thuật của phần violin.
    loai: lich-su
    nguon: [ bso, indy, aspen ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hai người trao đổi thư từ suốt quá trình sáng tác về từng chi tiết kỹ thuật." Chữ mới như câu. Lý do: BSO: "his correspondence with David is sometimes filled with discussions of specific detailed points of technique, and sometimes with the violinist''s urgent plea that he finish the piece"; Aspen: "David was Mendelssohn''s adviser on matters of technical detail regarding the solo part"; Indianapolis: David "giving frequent advice regarding technical matters through the compositional process". Nguồn nói thư có bàn chi tiết kỹ thuật, không nói "từng chi tiết", nên viết nhẹ lại. Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64", "https://www.laphil.com/musicdb/pieces/4500/violin-concerto-in-e-minor-op-64" ]
    luot_2_ghi_chu: "Aspen: 'David was Mendelssohn's adviser on matters of technical detail regarding the solo part'; thư từ hai người suốt nhiều năm; LA Phil: chia sẻ phác thảo với David, 'soliciting practical advice ... at every stage'."
    review: dung
  - id: n12
    cau: Đây là một trong những concerto violin được biểu diễn nhiều nhất mọi thời đại.
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang. Không tìm được nguồn bậc 1–2 có số liệu biểu diễn; các chú giải chỉ có lời khen ("one of the most original and attractive concertos ever written", BSO) hay "the first major Romantic violin concerto that most students learn" (Aspen), không phải điều câu nói. Review D6-L10-gom: giữ bỏ. Lượt 2 chỉ tìm được ghi chú chương trình (Edward Lein), không có số liệu biểu diễn; câu là xếp hạng, hướng dẫn nghe không cần. Trang không còn chữ "nhiều nhất mọi thời đại".'
    luot_2: dung
    luot_2_nguon: [ "https://sites.google.com/site/edwardlein/Home/program-notes/felix-mendelssohn/mendelssohn-violin-concerto" ]
    luot_2_ghi_chu: "Edward Lein (ghi chú chương trình): 'remains among the most-frequently performed and recorded concertos ever written'. Nguồn là ghi chú chương trình, không có số liệu thống kê; câu viết 'một trong những' nên chấp nhận được."
    review: dung
  - id: n13
    cau: Mendelssohn phá ba thói quen của concerto Cổ điển (violin vào ngay, cadenza giữa chương, các chương nối liền).
    loai: lich-su
    nguon: [ bso, cle, cmu ]
    ket_qua: dung
    ghi_chu: 'BSO kể đủ ba điều: bỏ ritornello của dàn nhạc ("a radical departure from standard, Baroque-derived concerto practice"), cadenza "usually placed at the end of the movement" thì đặt "in the heart of the movement", và "link all the movements into one another without a break … never in a work having the temerity to call itself a concerto". Cleveland: "usual orchestral exposition", "traditional place at the end of the movement", "another striking departure from convention". CMU: chương 1 concerto Cổ điển có phần trình bày đầu "for orchestra alone".'
    luot_2: dung
    luot_2_nguon: [ "https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64" ]
    luot_2_ghi_chu: "Aspen (Ledbetter) nêu đúng ba điểm: bỏ đoạn ritornello của dàn nhạc (violin vào sau hai ô 'curtain'), cadenza đặt giữa chương nối phát triển và tái hiện, các chương nối liền không ngắt."
  - id: n14
    cau: 'Link "Concerto và ritornello" dẫn tới /opus/hinh-thuc/concerto/.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: src/content/docs/hinh-thuc/concerto.md có, title "Concerto và ritornello", đã khóa (khoa.json). Trang ấy nói concerto Cổ điển thường có phần trình bày của dàn nhạc trước, cadenza gần cuối chương 1, và Mendelssohn cho violin vào gần như ngay, nối các chương: khớp. Review D6-L10-gom: src/content/docs/hinh-thuc/concerto.md có, đã khóa, title "Concerto và ritornello"; dòng 32 nói Mendelssohn bỏ phần trình bày riêng của dàn nhạc, cho violin vào gần như ngay, nối các chương. Đúng.'
    review: dung
  - id: n15
    cau: Violin vào gần như ngay lập tức, chỉ sau một ô nhịp rưỡi, thay vì chờ dàn nhạc trình bày.
    loai: cau-truc
    nguon: [ ia-score, cle, aspen ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 1: Violino principale nghỉ ô 1, nghỉ nửa đầu ô 2 (nhịp ¢), vào ở nửa sau ô 2 (p). Aspen: "the two measures of orchestral “curtain” before the soloist introduces the principal theme" (phác thảo đầu); Cleveland: "dispenses with the usual orchestral exposition and introduces the solo instrument right away".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/ldpd_11898794_000" ]
    luot_2_ghi_chu: "Tổng phổ Breitkopf (Partitur-Bibliothek, Part. B. 480), trang 1: ô 1 dàn dây chơi móc đơn p, violin độc tấu nghỉ ô 1 và nửa đầu ô 2, vào ở phách 3 ô 2 (sau một ô rưỡi)."
  - id: n16
    cau: Cadenza được viết sẵn và đặt trước phần tái hiện, thay vì gần cuối chương; nó trở thành cây cầu nối phát triển và tái hiện.
    loai: cau-truc
    nguon: [ ia-score, cle, bso ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ trang 17: "Cadenza ad libitum" viết đủ nốt sau cao trào ff của phần phát triển, chưa tới nửa chương 528 ô; trang 18: dàn nhạc vào lại chủ đề chính khi violin còn rải hợp âm. Cleveland: "Mendelssohn moved it from its traditional place at the end of the movement to the middle, allowing it to grow organically out of the development section and naturally resolve in the recapitulation". BSO: "allowing the soloist the chance to complete the development and inaugurate the recapitulation".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/ldpd_11898794_000", "https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64" ]
    luot_2_ghi_chu: "Tổng phổ trang 17–18: 'Cadenza ad libitum' viết sẵn đủ nốt, sau đó dàn nhạc vào lại chủ đề chính (tái hiện) trong khi violin rải hợp âm; Aspen: cadenza đặt 'in the heart of the movement', hoàn tất phát triển và mở đầu tái hiện."
  - id: n17
    cau: 'Ba chương nối liền: một nốt giữ dài của bassoon nối chương 1 sang chương 2.'
