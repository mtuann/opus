ghi_chu: 'Hướng dẫn nghe, không có khối abc. Tổng phổ đối chiếu: Breitkopf & Härtel, Partitur-Bibliothek, Part. B. 480 (Internet Archive ldpd_11898794_000, bản quét Columbia University; Internet Archive ghi năm 1845 theo danh mục, nhưng bìa là Partitur-Bibliothek cuối thế kỷ 19; đọc ảnh trang bằng PyMuPDF: trang PDF 7 ô 1–2, trang 14 chủ đề 2, trang 22–23 cadenza và tái hiện, trang 32 bassoon nối sang Andante, trang 43 Allegretto non troppo và Allegro molto vivace). Câu ve-site ở hồ sơ khác trỏ tới trang này (hinh-thuc/concerto n27, nhac-cu/violin n18, hinh-thuc/sonata n33, lich-su/thoi-ky/lang-man n37): đường dẫn giữ nguyên, trang là hướng dẫn nghe Concerto violin cung Mi thứ của Mendelssohn, vẫn nói cadenza đặt trước tái hiện (n16); khớp. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: concertmaster, appassionato, molto, hợp âm rải (arpeggio), dây buông; concerto, cadenza, tái hiện, phát triển, trình bày, Allegro, Andante, vivace đã có.'
