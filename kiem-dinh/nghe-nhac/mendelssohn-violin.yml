    cau: 'Độ dài: khoảng 25–30 phút, 3 chương nối liền nhau.'
    loai: so-lieu
    nguon: [ mb-hahn, mb-jansen, mb-heifetz, cle, imslp ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 26–28 phút". Chữ mới: "Khoảng 24–27 phút". Lý do: ba bản thu trên MusicBrainz: Heifetz/Toscanini 23:49, Hahn/Wolff 26:09, Jansen/Chailly 26:50; Cleveland ghi "Duration: 25 minutes"; IMSLP ghi Average Duration 30 minutes (con số chung, không phải bản thu đo). Không bản thu nào đã mở tới 28 phút. Ba chương nối liền: xem n17. Review D6-L10-gom: lượt 2 dung, gợi ý "khoảng 25–30 phút": 74 bản thu Naxos trên IMSLP dài 24,0–30,4 phút, trung vị khoảng 27,1; IMSLP ghi trung bình 30 phút. Ba bản thu của lượt 1 (23:49, 26:09, 26:50) và Cleveland (25 phút) nằm ở nửa dưới. Sửa thành "Khoảng 25–30 phút", gộp số đo của hai lượt. Không chạy lại. Chữ câu trước review: "Độ dài: khoảng 24–27 phút, 3 chương nối liền nhau."'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto_in_E_minor,_Op.64_(Mendelssohn,_Felix)", "https://archive.org/details/ldpd_11898794_000" ]
    luot_2_ghi_chu: "Ba chương nối liền: tổng phổ (fermata nốt bassoon sang Andante; cuối Andante sang Allegretto non troppo rồi Allegro molto vivace không dừng). Độ dài: 74 bản thu Naxos liệt kê trên trang IMSLP có tổng 24,0–30,4 phút, trung vị khoảng 27,1 phút; IMSLP ghi trung bình 30 phút. 'Khoảng 24–27' hơi thấp so với nửa số bản thu (27–30 phút) nhưng vẫn là khoảng thường gặp; review có thể cân nhắc ghi 'khoảng 25–30 phút'."
    review: dung
  - id: n9
