ghi_chu: 'Hướng dẫn nghe aria Der Hölle Rache (tầng Tác phẩm; bản ghi tac-pham/mozart-nu-hoang-bong-dem; loai: nghe là cấu trúc). Không có khối abc. Bản nhạc: tổng phổ Neue Mozart-Ausgabe II/5/19 trên DME (ảnh ucb09_73_<trang>.jpg): lời thoại cảnh 8 màn 2 và aria số 14 (tr. 224–231, Allegro assai, Rê thứ), aria số 4 của Nữ hoàng (tr. 85–86) và ngũ ca số 5 (tr. 103–104) cho cốt truyện; đọc ảnh, phóng to dòng giọng hát ở tr. 226 (chuỗi coloratura thứ nhất ô 24–32, nốt Đô6 nhắc lại ngắt ngắn ô 25, 27; chùm nốt rải lên Fa6 ô 30–31); chuỗi thứ hai ô 69–79 (tr. 229–230); lời thề ô 89–96, kết Rê thứ ô 101 (tr. 231). Lịch sử: Köchel online KV 620 (Singspiel, ngày công diễn, Freihaustheater, nhà hát ngoại ô của Schikaneder), COD (Singspiel, coloratura, Die Zauberflöte), Carus (ngày Mozart mất). Bản thu: cửa hàng của Royal Opera House, MusicBrainz; độ dài: hai bản thu trên Commons. Sửa: n3, n4, n7, n8, n9, n10, n11, n12, n13, n14, n16, n17, n18, n22. Không có chỗ chưa chắc. Câu ở hồ sơ khác: lich-su/opera n61 và lich-su/thoi-ky/co-dien n36 (aria thuộc Cây sáo thần, K. 620; trang ở đúng đường dẫn): trang giữ đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột. Thuật ngữ trang dùng mà thuat-ngu.yml chưa có: Singspiel, coloratura (soprano màu sắc), lời thoại nói (spoken dialogue). Đã có: aria, staccato (ngắt ngắn).'
