    review: dung
  - id: n9
    cau: 'Cây sáo thần là một Singspiel: opera tiếng Đức có xen lời thoại nói, viết cho một nhà hát ở ngoại ô Vienna do Emanuel Schikaneder điều hành; Schikaneder cũng viết lời. (Mô tả trang cũng nói câu này.)'
    loai: lich-su
    nguon: [ kv-620, cod-singspiel, cod-zauberflote ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "viết cho một nhà hát bình dân ở Vienna". Köchel: "suburban theater in Vienna, where Emanuel Schikaneder sought to introduce more serious works … beyond his usual light comic productions" (Freihaustheater); "bình dân" không có trong nguồn, viết "ở ngoại ô". COD: Singspiel là opera có lời thoại nói; lời của Schikaneder. NMA in cả lời thoại. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://kv.mozarteum.at/en/work/ouverture-7138", "https://dme.mozarteum.at/DME/objs/pdf/nma_73_-27_-3_eng.pdf" ]
    luot_2_ghi_chu: 'Köchel online: "Singspiel („Große Oper“) in 2 Aufzügen", "written for a successful suburban theater in Vienna", Schikaneder; NMA: Theater auf der Wieden của Schikaneder (và Bauernfeld), áp phích "A grand opera in 2 Acts, by Emmanuel Schikaneder"; NMA nói về các đoạn thoại nói (spoken dialogues).'
    review: dung
  - id: n10
    cau: 'Câu chuyện cổ tích: theo lệnh của Nữ hoàng bóng đêm, hoàng tử Tamino và Papageno người bắt chim đi giải cứu Pamina, con gái bà.'
    loai: lich-su
    nguon: [ nma-620, cod-zauberflote ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Câu chuyện cổ tích pha triết lý: hoàng tử Tamino và Papageno người bắt chim đi giải cứu Pamina." Bỏ "pha triết lý" (nhận xét không nguồn). NMA: số 4, Nữ hoàng hát với Tamino "Du wirst sie zu befreien gehen, du wirst der Tochter Retter sein" (tr. 85); số 5, ba thị nữ bảo Papageno "dafür sollst du sein Diener sein" (đi theo hầu hoàng tử, tr. 103); số 2 "Der Vogelfänger bin ich ja". COD: lấy từ một truyện cổ tích (Lulu, trong tập Dschinnistan). Thêm "theo lệnh của Nữ hoàng" và "con gái bà". Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=73", "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT04OSZwMj0xMTMmbD0xJnRpdGxlPU5NQStJSSUyRjUlMkYxOSUzQStLJTNBKzYyMCUyRjA1&cc=17be9c9874f901c7e02fabb49c8ae899&pdf=1", "https://dme.mozarteum.at/DME/objs/pdf/nma_73_-27_-3_eng.pdf" ]
    luot_2_ghi_chu: 'NMA: No. 4 của Nữ hoàng có đoạn "Du, du, du wirst sie zu befreien gehen" (nói với Tamino); No. 5 Quintetto Tamino và Papageno cùng các thị nữ ("Zauberflöten sind zu unserm Schutz vonnöten"); áp phích: "Pramina, her daughter".'
    review: dung
  - id: n11
    cau: 'Ngay trước aria, trong lời thoại, Nữ hoàng bóng đêm đưa cho Pamina một con dao và ra lệnh phải giết Sarastro, kẻ thù của bà.'
    loai: lich-su
    nguon: [ nma-620 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trong aria này, Nữ hoàng bóng đêm, mẹ của Pamina, đưa cho con gái một con dao…". NMA tr. 224, lời thoại ngay trước số 14: "Siehst du hier diesen Stahl? — Er ist für Sarastro geschliffen. — Du wirst ihn töten"; Sarastro được gọi là "Todfeinde" (kẻ thù không đội trời chung). Việc trao dao ở lời thoại, không ở trong aria. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1" ]
    luot_2_ghi_chu: 'NMA tr. 224, lời thoại trước No. 14: "Siehst du hier diesen Stahl? – Er ist für Sarastro geschliffen. – Du wirst ihn töten"; Nữ hoàng gọi Sarastro là "Todfeinde".'
    review: dung
  - id: n12
    cau: 'Trong aria, bà thề sẽ từ bỏ con mãi mãi nếu Pamina không làm.'
    loai: lich-su
    nguon: [ nma-620 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nếu không, bà sẽ từ mặt con". NMA: "so bist du meine Tochter nimmermehr" (ô 20–23), "Verstoßen sei auf ewig, verlassen sei auf ewig" (ô 52–57), "Hört, Rachegötter, hört der Mutter Schwur!" (lời thề). Nghĩa không đổi, viết sát lời hơn. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
