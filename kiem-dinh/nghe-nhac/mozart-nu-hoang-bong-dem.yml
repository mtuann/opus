    moi: "Cây sáo thần là một Singspiel: opera tiếng Đức có xen lời thoại nói, viết cho một nhà hát ở ngoại ô Vienna do Emanuel Schikaneder điều hành (Schikaneder cũng viết lời). Câu chuyện cổ tích: theo lệnh của Nữ hoàng bóng đêm, hoàng tử Tamino và Papageno người bắt chim đi giải cứu Pamina, con gái bà."
    ly_do: 'n9, n10: Köchel online, COD, NMA.'
  - cu: "Trong aria này, Nữ hoàng bóng đêm, mẹ của Pamina, đưa cho con gái một con dao và ra lệnh phải giết Sarastro, kẻ thù của bà; nếu không, bà sẽ từ mặt con. Cơn giận được thể hiện bằng những chuỗi nốt nhanh vọt lên âm vực cực cao, đến nốt Fa6, một trong những nốt cao nhất thường gặp trong opera."
    moi: "Ngay trước aria này, trong lời thoại, Nữ hoàng bóng đêm đưa cho Pamina một con dao và ra lệnh phải giết Sarastro, kẻ thù của bà; trong aria, bà thề sẽ từ bỏ con mãi mãi nếu Pamina không làm. Cơn giận được thể hiện bằng những chuỗi nốt nhanh vọt lên âm vực cực cao, đến nốt Fa6."
