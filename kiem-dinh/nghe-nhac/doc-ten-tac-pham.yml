  - cu: Biệt danh không phải của tác giả. Tên "Ánh trăng" của Sonata piano Op. 27 số 2 bắt nguồn từ hình ảnh mà nhà phê bình Ludwig Rellstab dùng để tả chương 1; cái tên chỉ trở nên phổ biến sau khi Beethoven mất. "Định mệnh" của Giao hưởng số 5 cũng không phải tên Beethoven đặt. Biệt danh giúp dễ nhớ, nhưng đừng coi đó là ý đồ của nhà soạn nhạc.
    moi: Biệt danh không phải của tác giả. Tên "Ánh trăng" của Sonata piano Op. 27 số 2 có lẽ bắt nguồn từ hình ảnh mặt hồ dưới trăng mà nhà phê bình Ludwig Rellstab dùng để tả chương 1, trong một truyện ngắn năm 1824; bản in đầu tiên (1802) chỉ ghi Sonata quasi una fantasia. "Định mệnh" của Giao hưởng số 5 cũng không phải tên Beethoven đặt. Biệt danh giúp dễ nhớ, nhưng đừng coi đó là ý đồ của nhà soạn nhạc.
