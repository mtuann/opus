  - id: n24
    cau: Tên "Ánh trăng" của Sonata piano Op. 27 số 2 có lẽ bắt nguồn từ hình ảnh mặt hồ dưới trăng mà nhà phê bình Ludwig Rellstab dùng để tả chương 1, trong một truyện ngắn năm 1824; bản in đầu tiên (1802) chỉ ghi Sonata quasi una fantasia.
    loai: lich-su
    nguon:
      - henle-1062
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Tên \\\"Ánh trăng\\\" … bắt nguồn từ hình ảnh mà nhà phê bình Ludwig Rellstab dùng để tả chương 1; cái tên chỉ trở nên phổ biến sau khi Beethoven mất.\" Lý do: Henle: \"may have its origin in Ludwig Rellstab's … Theodor … of 1823\" (in 1824, khi Beethoven còn sống), \"soon became established, for example in … 1840\"; vế \"chỉ trở nên phổ biến sau khi Beethoven mất\" bị review D7-gom bỏ ở trang cap-nhat (Henle: biệt danh có từ khi Beethoven còn sống). Bản in Cappi 1802: \"SONATA quasi una FANTASIA\". Khớp trang beethoven-anh-trang, nghe-nhac/beethoven-moonlight."
    luot_2: khong-chac
    luot_2_nguon: [ "https://blog.henle.de/en/2017/09/18/4584/", "https://imslp.org/wiki/Piano_Sonata_No.14,_Op.27_No.2_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "Henle (blog, N. Gertsch): tên có thể bắt nguồn từ truyện 'Theodor – eine musikalische Skizze' của Rellstab, 'written in 1823', có hình ảnh mặt hồ dưới trăng; Beethoven gọi là 'Sonata quasi una fantasia'; IMSLP: in đầu năm 1802. Năm 1824 trong câu chưa xác nhận được (Henle ghi năm viết 1823)."
