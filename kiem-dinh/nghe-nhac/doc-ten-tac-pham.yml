nhan_dinh:
  - id: n1
    cau: Trang này giải thích các phần của tên một tác phẩm và của thông tin bản thu, để tìm đúng tác phẩm và chọn bản thu.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên trang: các mục "Một cái tên đầy đủ gồm những gì?", "Opus là gì?", "Các danh mục riêng", "Đọc thông tin một bản thu", "Tìm bản thu tốt ở đâu?".'
  - id: n2
    cau: 'Ví dụ: Beethoven, Giao hưởng số 5 cung Đô thứ, Op. 67 ("Định mệnh").'
    loai: danh-muc
    nguon:
      - imslp-beet5
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "IMSLP: Symphony No.5, Op.67, C minor; tên khác 'Fate Symphony'."
  - id: n3
    cau: 'Hình và bảng: tên đầy đủ gồm nhà soạn nhạc (Beethoven), thể loại (Giao hưởng), số thứ tự (số 5, thứ tự trong các tác phẩm cùng thể loại của nhà soạn nhạc), giọng (cung Đô thứ, giọng chính), số hiệu danh mục (Op. 67), biệt danh ("Định mệnh").'
    loai: dinh-nghia
    nguon:
      - imslp-beet5
      - cod-opus
    ket_qua: dung
    ghi_chu: Chữ trong hình oz-anatomy (và aria-label) cùng sáu nhãn với bảng; giữ cấu trúc p1–p6.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/List_of_works_by_Ludwig_van_Beethoven" ]
    luot_2_ghi_chu: Các thành phần khớp IMSLP (thể loại, số 5, C minor, Op.67, tên khác 'Fate Symphony'); số thứ tự trong cùng thể loại như IMSLP xếp Symphony No.1–9.
  - id: n4
    cau: 'Chú thích hình và đoạn sau bảng: chỉ riêng số hiệu danh mục (Op. 67) đã đủ xác định chính xác tác phẩm; tìm theo tên nhà soạn nhạc kèm số hiệu ("Beethoven Op. 67", "Mozart K. 550").'
    loai: dinh-nghia
    nguon:
      - cod-opus
      - mla-ti
    ket_qua: dung
    ghi_chu: 'Số hiệu xác định duy nhất trong tác phẩm của một nhà soạn nhạc (Op. 67 của Beethoven); trang luôn đi kèm tên nhà soạn nhạc ("hãy tìm theo tên nhà soạn nhạc kèm số hiệu"). Có trường hợp một số opus gồm nhiều bài (COD: "Op.59, No.3"): khi đó cần cả số trong opus; câu hiểu theo ví dụ Op. 67 là đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/List_of_works_by_Ludwig_van_Beethoven", "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: Danh sách IMSLP xếp theo số opus; Op.67 của Beethoven chỉ một tác phẩm (Symphony No.5). Câu nói 'tên nhà soạn nhạc kèm số hiệu'.
  - id: n5
    cau: Link Hình thức & thể loại và bài 8 (hóa biểu, giọng).
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/hinh-thuc/index.md và nhac-ly/08-hoa-bieu.md có.
  - id: n6
    cau: "Bảng: biệt danh thường không phải do nhà soạn nhạc đặt."
    loai: lich-su
    nguon:
      - henle-9813
      - henle-1062
    ket_qua: dung
    ghi_chu: 'Hai ví dụ trên trang: "Định mệnh" (Henle 9813: do Schindler), "Ánh trăng" (Henle 1062). Chữ "thường" để chừa trường hợp nhà soạn nhạc tự đặt (như Pathétique).'
    luot_2: dung
    luot_2_nguon: [ "https://blog.henle.de/en/2017/09/18/4584/", "https://archive.org/details/chopinetudesforp00unse" ]
    luot_2_ghi_chu: "Henle blog: các tên phổ biến của sonata Beethoven phần lớn 'probably have nothing to do with Beethoven'; Friedheim (Schirmer 1916): Chopin không đặt tên như vậy cho tác phẩm."
  - id: n7
    cau: 'Opus (tiếng Latin: "tác phẩm"), viết tắt Op., là số thứ tự tác phẩm, do nhà soạn nhạc hoặc nhà xuất bản gán khi xuất bản.'
    loai: dinh-nghia
    nguon:
      - cod-opus
    ket_qua: dung
    ghi_chu: 'COD: "(Lat.). Work … Sometimes the Opus no. is allotted by the composer, sometimes by the publisher".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/List_of_works_by_Fr%C3%A9d%C3%A9ric_Chopin", "https://imslp.org/wiki/List_of_works_by_Franz_Schubert" ]
    luot_2_ghi_chu: "IMSLP: Chopin 'Op. — Opus as assigned by Chopin, or Julian Fontana'; Schubert 'opus numbers, as used by the original publishers'. (Nghĩa Latin 'tác phẩm' là nghĩa gốc của từ; từ điển trực tuyến chặn công cụ.)"
  - id: n8
    cau: "Số opus chỉ cho biết gần đúng thứ tự sáng tác, và có khi sai lệch: nhà xuất bản có thể gán số opus muộn cho một tác phẩm viết từ sớm."
    loai: dinh-nghia
    nguon:
      - cod-opus
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Số opus thường theo thứ tự xuất bản, không hẳn theo thứ tự sáng tác." Lý do: COD: "This numbering gives a rough idea of the order in which works were comp., but can be misleading … Dvořák allowed early works to be given late opus nos. by his publisher"; "thường theo thứ tự xuất bản" không có ở nguồn đã mở.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/List_of_works_by_Ludwig_van_Beethoven" ]
    luot_2_ghi_chu: "IMSLP (danh sách Beethoven): giải thích vì sao Octet viết năm 1792 lại mang Op.103 trong khi Op.102, Op.104 viết năm 1815, 1817: số opus lớn ứng với tác phẩm in sau khi mất."
  - id: n9
    cau: "Một opus có thể gồm nhiều tác phẩm nhỏ: Chopin Nocturne Op. 9 số 2 là bản thứ hai trong tập Op. 9."
    loai: danh-muc
    nguon:
      - cod-opus
      - niecks
    ket_qua: dung
    ghi_chu: 'COD: "an opus no. covers a group of works … Op.59, No.3". Niecks: "Op.9. Trois Nocturnes [B flat minor, E flat major, and B major]".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Nocturnes,_Op.9_(Chopin,_Fr%C3%A9d%C3%A9ric)" ]
    luot_2_ghi_chu: "IMSLP: Op.9 gồm 3 nocturne; số 2 Andante Mi giáng trưởng."
  - id: n10
    cau: "Op. posth. (posthumous, di cảo): xuất bản sau khi nhà soạn nhạc mất."
    loai: dinh-nghia
    nguon:
      - dolmetsch-p
    ket_qua: dung
