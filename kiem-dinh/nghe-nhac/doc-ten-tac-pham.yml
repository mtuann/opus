  - cu:
      - "Từ khoảng những năm 1960–1970, phong trào biểu diễn theo phong cách lịch sử (historically informed performance, HIP) chơi nhạc Baroque và Cổ điển bằng nhạc cụ thời đó hoặc bản sao: violin dây ruột, kèn không có van, harpsichord thay piano, lên dây thấp hơn (thường A = 415 Hz cho nhạc Baroque, xem Âm học). Âm thanh thường nhẹ hơn, trong hơn, tốc độ nhanh hơn, ít rung (vibrato) hơn."
      - 'Không bên nào "đúng" hơn. Hãy nghe cùng một tác phẩm Bach hoặc Vivaldi ở cả hai cách và tự chọn. Gợi ý tên nghệ sĩ và nhóm HIP để tìm: Nikolaus Harnoncourt, John Eliot Gardiner, Trevor Pinnock, William Christie, Jordi Savall, Il Giardino Armonico.'
    moi:
      - "Từ khoảng những năm 1970, phong trào biểu diễn theo phong cách lịch sử (historically informed performance, HIP) chơi nhạc Baroque và Cổ điển bằng nhạc cụ thời đó hoặc bản sao: violin dây ruột, kèn không có van, harpsichord thay piano, lên dây thấp hơn (thường A = 415 Hz cho nhạc Baroque, xem Âm học). Âm sắc khác hẳn, cách chọn tốc độ cũng khác, và ít rung (vibrato) hơn."
      - 'Không bên nào "đúng" hơn. Hãy nghe cùng một tác phẩm Bach hoặc Vivaldi ở cả hai cách và tự chọn. Gợi ý tên nghệ sĩ và nhóm HIP để tìm: Nikolaus Harnoncourt, Christopher Hogwood, Roger Norrington, John Eliot Gardiner với English Baroque Soloists.'
    ly_do: "n40, n42: BBC Music Magazine. n45: chỉ giữ tên có ở nguồn đã mở."
