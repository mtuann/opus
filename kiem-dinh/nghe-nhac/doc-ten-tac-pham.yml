  - id: n31
    cau: Chữ Anh. (Anhang, "phụ lục") trong BWV đánh dấu những tác phẩm còn nghi vấn hoặc không phải của Bach.
    loai: dinh-nghia
    nguon:
      - imslp-anh114
      - breitkopf-bwv
      - ifb-bwv3
    ket_qua: dung
    ghi_chu: 'IMSLP: Anh. 114 = "BWV Anh. II 114 / Anh. III 183" (phụ lục II, III của BWV2); Breitkopf: BWV mới có phần "Incerta und Fehlzuschreibungen" (tác phẩm không chắc và gán nhầm). Nguồn đã mở không nói từng phụ lục nghĩa gì; lượt 2 nên tìm thêm (lời tựa BWV, Bach-Archiv). Câu này trang khác dẫn tới, giữ. Chủ lô bổ sung: nguồn bậc 2 đã dùng ở review D6-L1-gom (hồ sơ piano/tac-pham/minuet-sol n11): lời tựa Schmieder BWV 1 (trích trong bài điểm sách IfB) chia "echt" (phần chính) và "zweifelhaft" (Anhang II); IMSLP ghi Minuet là "BWV Anh. II 114", "formerly attributed to Bach".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/List_of_works_by_Johann_Sebastian_Bach", "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)" ]
    luot_2_ghi_chu: "IMSLP: danh sách BWV có mục 'Fragmentary, Lost, Doubtful and Spurious Works'; Anh. 114 nay biết là của Pezold. Anhang = phụ lục (IMSLP, danh sách Beethoven)."
