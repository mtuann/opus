ghi_chu: 'Trang không có bản ghi (không tac_pham). Không có khối abc; có một khối quiz (5 câu) và hình oz-anatomy (chữ trong hình là nhận định n4). Nguồn chính: danh sách danh mục của Music Library Association (MLA, Thematic Indexes Used in LC/NACO), Köchel online, IMSLP (wikitext qua API), COD qua Encyclopedia.com, Henle (lời tựa HN 1062, 9813), Bärenreiter (TP 40), Breitkopf (BWV), CiNii (Deutsch 1951), LoC (Baselt), Lưu trữ Bartók Budapest, MusicBrainz, BBC Music Magazine, Eastman, Early Music America. Sửa: n8, n24, n37, n40, n42, n45, n46, n55. Câu trang khác dẫn tới giữ đúng: tiêu đề "Đọc tên tác phẩm và bản thu"; tiêu đề "## Các danh mục riêng" (id cac-danh-muc-rieng không đổi); dòng BWV (Schmieder 1950); đoạn "Chữ Anh. (Anhang, phụ lục) trong BWV…"; dòng "K. hoặc KV | Mozart | Ludwig von Köchel (1862)"; phần số danh mục khi không có opus; đoạn HIP (nhạc cụ thời đó, harpsichord thay piano, "thường A = 415 Hz cho nhạc Baroque", link /opus/nhac-ly/am-hoc/) chỉ đổi mốc năm và câu tả âm thanh; cách đọc thông tin bản thu. Thuật ngữ chưa có trong thuat-ngu.yml: HIP (biểu diễn theo phong cách lịch sử), danh mục tác phẩm (thematic catalogue), Op. posth., WoO, remaster. Đã có: opus.'
