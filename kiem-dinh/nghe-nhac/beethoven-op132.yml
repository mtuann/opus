  - cu: Khoảng 15–18 phút
    moi: Khoảng 15–20 phút
    ly_do: "n8 (da-sua): lượt 1 D6-L10; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu:
      - 'Mùa xuân năm 1825, khi đang viết tứ tấu này, Beethoven ốm nặng và có lúc tưởng không qua khỏi. Khi bình phục, ông viết chương 3 với tiêu đề tiếng Đức: Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart – "Khúc thánh ca tạ ơn của người vừa khỏi bệnh dâng lên Thượng đế, ở điệu thức Lydian".'
      - "Điệu thức Lydian (xem bài 16) là điệu thức nhà thờ cổ, giống gam trưởng nhưng có bậc 4 được nâng. Ở đây, trên nốt Fa, Beethoven dùng Si tự nhiên thay vì Si♭. Dùng một điệu thức của thánh ca Trung cổ vào năm 1825 là một lựa chọn rất khác thường: âm nhạc như ngưng đọng, ngoài thời gian."
      - Đây là một trong năm tứ tấu cuối cùng của Beethoven, những tác phẩm mà nhiều nhạc sĩ coi là đỉnh cao của toàn bộ âm nhạc phương Tây. Chúng không dễ nghe; chương này là cửa vào tốt nhất.
    moi:
      - 'Tháng 4/1825, khi đang viết tứ tấu này, Beethoven lâm bệnh. Khi bình phục, ông viết chương 3 với tiêu đề tiếng Đức: Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart – "Khúc thánh ca tạ ơn của người vừa khỏi bệnh dâng lên Thượng đế, ở điệu thức Lydian".'
      - Điệu thức Lydian (xem bài 16) là điệu thức nhà thờ cổ, giống gam trưởng nhưng có bậc 4 được nâng. Ở đây, trên nốt Fa, Beethoven dùng Si tự nhiên thay vì Si♭. Dùng một điệu thức nhà thờ cổ vào năm 1825 là một lựa chọn khác thường, cho âm nhạc một màu sắc cổ xưa.
      - Đây là một trong năm tứ tấu cuối cùng của Beethoven. Như các tứ tấu cuối khác, Op. 132 cần thời gian mới được đón nhận rộng rãi; nay nó được coi là một trong những tứ tấu đàn dây hay nhất.
