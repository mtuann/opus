    luot_2_ghi_chu: "CMS: 'B-natural instead of B-flat'; tổng phổ tr. 15: phần Molto adagio không có hóa biểu, xoay quanh Fa."
  - id: n14
    cau: Dùng một điệu thức nhà thờ cổ vào năm 1825 là một lựa chọn khác thường, cho âm nhạc một màu sắc cổ xưa.
    loai: lich-su
    nguon: [ cooper-cmslc ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dùng một điệu thức của thánh ca Trung cổ vào năm 1825 là một lựa chọn rất khác thường: âm nhạc như ngưng đọng, ngoài thời gian." Chữ mới: "Dùng một điệu thức nhà thờ cổ vào năm 1825 là một lựa chọn khác thường, cho âm nhạc một màu sắc cổ xưa." Lý do: Cooper: "giving the music an antiquated quality", "adds to the unconventional and ethereal quality"; "ngưng đọng, ngoài thời gian" là cảm nhận, không kiểm được. "Điệu thức nhà thờ" theo Cooper và OMT ("church modes"). Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.chambermusicsociety.org/about-the-music/compositions/beethoven-op-132" ]
    luot_2_ghi_chu: "CMS: điệu thức Lydian cho âm nhạc 'an antiquated quality', 'unconventional and ethereal quality'."
    review: dung
