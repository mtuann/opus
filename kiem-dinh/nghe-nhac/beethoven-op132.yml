    luot_2_nguon: [ "https://www.chambermusicsociety.org/about-the-music/compositions/beethoven-op-132" ]
    luot_2_ghi_chu: "CMS: 'Like Beethoven’s other late quartets, Op. 132 took time to be appreciated generally, but it is now widely regarded as one of the finest quartets in the repertoire.'"
