  - id: n10
    cau: 'Khi bình phục, Beethoven viết chương 3 với tiêu đề tiếng Đức "Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart".'
    loai: lich-su
    nguon: [ cooper-cmslc, beethoven-haus, tong-pho-ga ]
    ket_qua: dung
    ghi_chu: 'Cooper: "when he recovered, he created a movement specifically related to his convalescence … He entitled it Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart". Tổng phổ in đúng tiêu đề ở đầu chương; chú thích của bản Breitkopf: tiêu đề tiếng Đức do chính tay Beethoven viết trong bản thảo.'
    luot_2: dung
    luot_2_nguon: [ "https://www.chambermusicsociety.org/about-the-music/compositions/beethoven-op-132", "https://archive.org/download/imslp-quartet-no15-op132-beethoven-ludwig-van/Beethoven_-_String_Quartet_No.15_Dover.pdf" ]
    luot_2_ghi_chu: CMS và tổng phổ (Breitkopf, bản Dover) tr. 15 ghi đúng 'Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart'.
  - id: n11
    cau: 'Tiêu đề dịch: "Khúc thánh ca tạ ơn của người vừa khỏi bệnh dâng lên Thượng đế, ở điệu thức Lydian".'
