    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)", "https://www.chambermusicsociety.org/about-the-music/composers/ludwig-van-beethoven" ]
    luot_2_ghi_chu: "IMSLP mục 'Late Quartets': Op.127, 130, 131, 132, 135 (cộng Große Fuge Op.133). CMS ghi 'six from his last three years' khi tính cả Große Fuge; 'năm tứ tấu cuối' đúng khi chỉ tính các tứ tấu số 12–16."
  - id: n16
    cau: Như các tứ tấu cuối khác, Op. 132 cần thời gian mới được đón nhận rộng rãi; nay nó được coi là một trong những tứ tấu đàn dây hay nhất.
    loai: lich-su
    nguon: [ cooper-cmslc ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…, những tác phẩm mà nhiều nhạc sĩ coi là đỉnh cao của toàn bộ âm nhạc phương Tây. Chúng không dễ nghe". Chữ mới như câu. Lý do: câu cũ là đánh giá quá mạnh, không có nguồn; Cooper: "Like Beethoven''s other late quartets, Op. 132 took time to be appreciated generally, but it is now widely regarded as one of the finest quartets in the repertoire". Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
