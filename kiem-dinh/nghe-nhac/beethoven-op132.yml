    ket_qua: dung
    ghi_chu: 'OMT: "Lydian: Like major with a raised 4"; Lydian nằm trong bảng các điệu thức nhà thờ lịch sử (final F). Cooper: "The Lydian mode is one of the old church modes … consists of F major but with a raised fourth degree".'
    luot_2: dung
    luot_2_nguon: [ "https://www.chambermusicsociety.org/about-the-music/compositions/beethoven-op-132" ]
    luot_2_ghi_chu: "CMS: 'The Lydian mode is one of the old church modes ... F major but with a raised fourth degree'. Open Music Theory (chương diatonic modes) trả 403 với công cụ, chưa đọc được."
