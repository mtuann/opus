doi_chu:
  - cu: Nghe chủ động là kỹ năng quan trọng nhất để hiểu nhạc cổ điển. Nhạc cổ điển thường "khó" với người mới vì nó bị nghe như nhạc nền. Khi ngồi yên nghe một tác phẩm nhiều lần, mỗi lần với một câu hỏi khác nhau, nó sẽ dần mở ra.
    moi: Nghe chủ động là ngồi yên nghe một tác phẩm, không làm việc khác, mỗi lần với một câu hỏi. Nhạc cổ điển bật lên làm nhạc nền thì dễ trôi qua mà không đọng lại gì. Nghe một tác phẩm nhiều lần, mỗi lần với một câu hỏi khác nhau, nó sẽ dần mở ra.
    ly_do: 'n1 (da-sua): bỏ xếp hạng "quan trọng nhất" và câu nhân quả về người mới, không có nguồn; viết thành lời khuyên.'
