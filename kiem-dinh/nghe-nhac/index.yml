    cau: Danh sách 30 tác phẩm piano nên nghe, kèm nghệ sĩ gợi ý, ở Nghệ sĩ piano và bản thu.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/nghe-si (đã khóa): mục "## 30 tác phẩm piano nên nghe", 30 mục, mỗi mục "Nghe: <nghệ sĩ>". Review D6-L11-gom: piano/nghe-si có, đã khóa: mục "## 30 tác phẩm piano nên nghe" (dòng 137). Đúng.'
    review: dung
