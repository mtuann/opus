  - so: 1
    ngay: 2026-11-07
    nhanh: moi/d6-l11-kiem-mau
    ma_bam: sha256:0bb8d42c5009c9dd5d8ce9549b239706f379dca12a13b4ce3965e0c03fb9ce33
    nguoi:
      luot_1: Claude Opus 5.5 (chủ lô D6-L11)
      luot_2: Claude Opus 5.5 (lượt 2 nhánh gom D6-L11, 06/11/2026, ba phần)
      review: Claude Opus 5.5 (review D6-L11-gom)
      kiem_mau: "Claude Opus 5.5, kiểm thay chủ repo theo lời giao 06/11/2026 (chủ repo không tự kiểm): 8 nhận định mẫu của D6-L11, 8 đúng (4 có điều kiện: ravel-bolero h3, brahms-4 n12, dvorak-9-largo n6 dựa một phần vào tổng phổ lượt 1 đã đọc; số biến tấu Brahms các nguồn đếm khác nhau), 0 sai (bao-cao/d6-l11-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Trang lối vào mục Nghe nhạc (tầng khung). Hai bảng viết tay của trang cũ ("Nhạc piano"; "Dàn nhạc, giọng hát và thính phòng", cột Thời kỳ, Luyện nghe) thay bằng danh mục sinh từ src/data/tac-pham.yml (::danh-muc-tac-pham, D6-L11): mọi trang tác phẩm có trong bản build, gồm cả bài học, lọc theo loại, chặng, thời kỳ, tác giả; tên, thoi_ky, luyen_nghe, ky_nang_chinh là trường dữ liệu đã kiểm định ở hồ sơ bản ghi, không lập nhận định lại ở đây (trang đã khóa chỉ hiện trường đã khóa). Chữ viết tay còn lại: lời mở đầu, phương pháp 4 lần nghe (khuyen-tap), câu về công cụ và trang khác của site (ve-site). Không có khối abc. Câu ve-site ở hồ sơ khác trỏ tới trang: tai-lieu-tham-khao t32, nhan-dien/nghe-mu n12, nhan-dien/so-sanh-thoi-ky n97 (đường dẫn /opus/nghe-nhac/ còn, trang vẫn là chỉ mục các hướng dẫn nghe); cap-nhat n66, n71, n105 kể thay đổi của site cũ (chia hai bảng nhạc piano và dàn nhạc, "18 tác phẩm"): là nhật ký, đúng với lúc ấy; trang mới không còn chia hai bảng mà có ô lọc. Cụm "kỹ năng quan trọng nhất" của trang cũ bỏ (xếp hạng không kiểm được).'
nguon: []
nhan_dinh:
  - id: n1
    cau: Nghe chủ động là ngồi yên nghe một tác phẩm, không làm việc khác, mỗi lần với một câu hỏi; nhạc cổ điển bật lên làm nhạc nền thì dễ trôi qua; nghe nhiều lần, mỗi lần một câu hỏi khác, tác phẩm dần mở ra.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ "Nghe chủ động là kỹ năng quan trọng nhất để hiểu nhạc cổ điển. Nhạc cổ điển thường "khó" với người mới vì nó bị nghe như nhạc nền.": bỏ xếp hạng "quan trọng nhất" và câu nhân quả về người mới (không có nguồn); viết lại thành lời khuyên. description đổi theo (description cũ chép đoạn này). Review D6-L11-gom: lời khuyên viết lại, không còn "quan trọng nhất"; lượt 2 dung; đã đối chiếu chữ trang và mô tả trang: khớp câu. Kiểm mẫu D6-L11 (Claude, chủ repo giao, 06/11/2026): khóa đòi nguồn cho da-sua; lời khuyên tập đã đổi chữ, không dính sức khỏe: da-sua thành khong-can-nguon (như hồ sơ đã khóa nhan-dien/nghe-mu n2); chữ cũ ghi ở trên.'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên nghe chủ động hợp lý.
    review: dung
  - id: n2
    cau: 'Phương pháp 4 lần nghe, mỗi tác phẩm (hay một chương) cho cả tuần: lần 1 cảm nhận; lần 2 tìm giai điệu chính (ngân nga, phút thứ mấy, nhạc cụ nào); lần 3 theo dõi cấu trúc, vẽ sơ đồ A B A với mốc thời gian; lần 4 nghe một bản thu khác và so sánh.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Không trái trang đã khóa bat-dau/lo-trinh-nghe (mục "Trước khi nghe") và nhan-dien (nghe nhiều lần, so sánh bản thu).
    luot_2: dung
    luot_2_ghi_chu: Phương pháp nghe nhiều lần hợp lý, không trái trang lõi.
  - id: n3
