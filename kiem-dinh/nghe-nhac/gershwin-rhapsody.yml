    review: dung
  - id: n15
    cau: Chuyện kể rằng trong buổi tập, nghệ sĩ clarinet Ross Gorman (có lẽ để đùa) vuốt liền các nốt ấy thành một đường trượt, và từ đó tác phẩm luôn mở đầu như vậy, thành một âm thanh tiêu biểu của nhạc Mỹ.
    loai: lich-su
    nguon:
      - sfs
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chuyện kể rằng nghệ sĩ clarinet Ross Gorman đùa nghịch kéo dài tiếng vuốt trong buổi tập, Gershwin nghe thấy và giữ lại — thành mở đầu nổi tiếng nhất của nhạc Mỹ thế kỷ 20." Chữ mới như câu. Lý do: SF Symphony: Gorman "perhaps as a joke—elided the notes into a sweeping ribbon … after which there was no turning back"; "an iconic sound of American music". "Nổi tiếng nhất" là so sánh không có nguồn; chi tiết "Gershwin nghe thấy và giữ lại" chỉ thấy ở nguồn phổ thông. Review D6-L8-gom: lượt 2 xác nhận chữ mới; agent con đối chiếu chữ trang: khớp câu, chữ cũ đã bỏ không còn trên trang. Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.barenreiter.co.uk/prefaces/9790006543724.pdf", "https://phys.unsw.edu.au/jw/Rhapsody-in-Blue.html", "https://www.indianapolissymphony.org/backstage/program-notes/gershwin-rhapsody-in-blue/" ]
    luot_2_ghi_chu: "Bärenreiter: trong một buổi tập, Ross Gorman (clarinet của Whiteman) chơi nửa sau đường chạy thành glissando, Gershwin thích và đưa ngay vào bản phối. UNSW dẫn lời kể: Gorman làm vậy 'as a joke on Gershwin'. Indianapolis Symphony: glissando mở đầu thành 'one of the most recognizable sounds in the world'. Cụm 'có lẽ để đùa' phù hợp, vì chuyện chỉ do người kể truyền lại."
    review: dung
