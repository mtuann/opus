    ket_qua: da-sua
    ghi_chu: 'chưa chắc: bản nhạc đã mở là bản piano độc tấu (cả bài ở piano) nên không cho biết ai chơi chủ đề ngay sau tiếng clarinet; chưa mở được tổng phổ hay bản hai piano 1924 (PDF IMSLP chặn máy). Lượt 2 đối chiếu bản hai piano 1924 hay bản thu Victor (phần 1, đầu bài). Review D6-L8-gom: lượt 1 chưa chắc, lượt 2 sai theo bản thảo tay 1924 của Gershwin ở Library of Congress (bản hai piano: khuông "Jazz Band" và "Piano"): sau tiếng clarinet, chủ đề ở khuông Jazz Band, ban nhạc chơi trọn chủ đề (số tập 1), khuông Piano chỉ có nốt từ cuối trang 2, ghi "solo". Sửa dòng 2 theo câu đúng của lượt 2 (viết gọn; bỏ "tiết tấu nảy"). Thêm nguồn loc-ms. Mốc: chỉ dòng 1 có mốc (1 giây, phần 1, tức mặt thứ nhất Victor 55225 = file Part 01 trên Commons); số dòng và thứ tự không đổi nên moc không đổi. Không chạy lại. Chữ câu cũ: "Dòng 2: chủ đề chính đầu tiên: piano độc tấu, tiết tấu nảy.". doi_chu.'
    luot_2: sai
    luot_2_nguon: [ "https://www.loc.gov/resource/music.muslcdb-100261/?sp=11", "https://www.loc.gov/resource/music.muslcdb-100261/?sp=12", "https://www.loc.gov/item/2019563767/" ]
    luot_2_ghi_chu: "câu đúng: Dòng 2: ngay sau đường vuốt, clarinet chơi tiếp chủ đề chính; cả ban nhạc nhắc lại chủ đề, rồi một đường chạy clarinet ngắn nữa. Đến lúc ấy piano mới vào, độc tấu lần đầu.; Bản thảo tay 1924 của Gershwin (bản cho hai piano: khuông trên ghi 'Jazz Band', khuông dưới ghi 'Piano'). Trang nhạc 1: sau tiếng láy và đường chạy 17 nốt, chủ đề nằm ở khuông Jazz Band, khuông Piano bỏ trống. Trang 2: số tập 1 là ban nhạc chơi đầy đủ chủ đề, rồi một đường chạy 10 nốt ở Jazz Band. Khuông Piano chỉ có nốt từ cuối trang 2, ghi 'solo'. Vậy lần đầu chủ đề chính vang lên là ở clarinet và ban nhạc, không phải piano độc tấu."
