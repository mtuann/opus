  - imslp-rib
  - cod-rhapsody
  ket_qua: dung
- id: n8
  cau: 'Độ dài: khoảng 15 phút.'
  loai: so-lieu
  nguon:
  - imslp-rib
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Khoảng 16–17 phút". Chữ mới: "Khoảng 15 phút". Lý do: IMSLP Average Duration 15 minutes; chưa có nguồn cho 16–17 phút.'
- id: n9
  cau: Rhapsody in Blue ra đời từ buổi hòa nhạc An Experiment in Modern Music của Paul Whiteman, buổi đặt câu hỏi liệu jazz có thể bước vào phòng hòa nhạc cổ điển không.
  loai: lich-su
  nguon:
  - loc-blog
  - score-nwm
  - imslp-rib
  ket_qua: dung
  ghi_chu: 'LoC: buổi diễn quảng cáo là "An Experiment in Modern Music", Whiteman muốn cho thấy bước tiến của nhạc đại chúng, tác phẩm ban đầu được báo là "jazz concerto"; Lời nói đầu bản nhạc: "concert of symphonic jazz at Aeolian Hall".'
- id: n10
  cau: Khi đó Gershwin mới 25 tuổi.
  loai: nam
  nguon:
  - loc-blog
  ket_qua: dung
  ghi_chu: 'LoC: Gershwin ra mắt hòa nhạc "at age 25, just the previous November"; sinh 9/1898, nên tháng 2/1924 vẫn 25 tuổi.'
- id: n11
  cau: Gershwin đã nổi tiếng với những ca khúc trong các vở diễn Broadway.
  loai: lich-su
  nguon:
  - loc-blog
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nổi tiếng với nhạc kịch Broadway". Chữ mới: "đã nổi tiếng với những ca khúc trong các vở diễn Broadway". Lý do: LoC: "already well known as a composer of popular songs—most of which derived from Broadway shows".'
- id: n12
  cau: Gershwin viết tác phẩm trong vài tuần.
  loai: lich-su
  nguon:
  - loc-blog
  - score-nwm
  - sfs
  ket_qua: dung
  ghi_chu: 'LoC: "composed … in only a few weeks"; Lời nói đầu bản nhạc: "in three weeks"; SF Symphony: "about a month". "Vài tuần" là cách nói chung khớp các nguồn.'
- id: n13
  cau: Tiếng đầu tiên là một nốt clarinet vuốt lên (glissando) dài, từ trầm vút lên cao.
  loai: cau-truc
  nguon:
  - sfs
  - score-nwm
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ngay tiếng đầu tiên đã là huyền thoại: …". Chữ mới: "Ngay tiếng đầu tiên đã rất đặc biệt: …". Lý do: "huyền thoại" là lời khen không kiểm được. Nội dung (clarinet vuốt từ trầm lên cao) đúng theo SF Symphony.'
- id: n14
  cau: Gershwin viết một tiếng láy rền ở âm vực trầm rồi một chuỗi 17 nốt đi lên.
  loai: cau-truc
  nguon:
  - sfs
  - score-nwm
  ket_qua: da-sua
  ghi_chu: 'Câu mới thêm (chữ cũ không có) để câu chuyện Gorman rõ nghĩa. SF Symphony: "a low clarinet trill followed by a scale rising rapidly through seventeen notes"; bản nhạc tr. 3: láy rền rồi nhóm 17 nốt.'
- id: n15
  cau: Chuyện kể rằng trong buổi tập, nghệ sĩ clarinet Ross Gorman (có lẽ để đùa) vuốt liền các nốt ấy thành một đường trượt, và từ đó tác phẩm luôn mở đầu như vậy, thành một âm thanh tiêu biểu của nhạc Mỹ.
  loai: lich-su
  nguon:
  - sfs
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chuyện kể rằng nghệ sĩ clarinet Ross Gorman đùa nghịch kéo dài tiếng vuốt trong buổi tập, Gershwin nghe thấy và giữ lại — thành mở đầu nổi tiếng nhất của nhạc Mỹ thế kỷ 20." Chữ mới như câu. Lý do: SF Symphony: Gorman "perhaps as a joke—elided the notes into a sweeping ribbon … after which there was no turning back"; "an iconic sound of American music". "Nổi tiếng nhất" là so sánh không có nguồn; chi tiết "Gershwin nghe thấy và giữ lại" chỉ thấy ở nguồn phổ thông.'
- id: n16
  cau: Link clarinet dẫn tới /opus/nhac-cu/clarinet/.
  loai: ve-site
  ket_qua: dung
  ghi_chu: src/content/docs/nhac-cu/clarinet.md có, đã khóa. Câu nhac-cu/clarinet n24 (mở đầu bằng clarinet vuốt lên) vẫn đúng với trang này.
- id: n17
  cau: 'Tác phẩm là một dòng chảy liền mạch, đúng nghĩa "rhapsody": một chương liền mạch, thường dựa trên những giai điệu đại chúng.'
  loai: dinh-nghia
  nguon:
  - cod-rhapsody
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(đúng nghĩa \"rhapsody\": phóng túng, không theo khuôn)". Chữ mới: "(đúng nghĩa \"rhapsody\": một chương liền mạch, thường dựa trên những giai điệu đại chúng)". Lý do: COD: "a comp. in one continuous movt., often based on popular, nat., or folk melodies"; không nói "không theo khuôn".'
- id: n18
  cau: Tác phẩm hòa trộn giai điệu blues, tiết tấu jazz (syncopation) và hòa âm cổ điển.
  loai: lich-su
  nguon:
  - score-nwm
  - loc-blog
  ket_qua: dung
  ghi_chu: 'Lời nói đầu bản nhạc: Gershwin định viết "a conventional blues" rồi viết tác phẩm lớn hơn để bác "the inflexibility of jazz rhythms"; buổi "symphonic jazz". LoC: ban đầu được quảng cáo là "jazz concerto". Bản nhạc có nhiều nhịp đảo phách.'
- id: n19
  cau: 'Phần dàn nhạc do Ferde Grofé phối: bản gốc năm 1924 cho ban nhạc jazz của Paul Whiteman, bản năm 1926 cho dàn nhạc nhà hát, bản năm 1942 cho dàn nhạc giao hưởng đầy đủ.'
  loai: nam
  nguon:
  - imslp-rib
  - loc-blog
  ket_qua: dung
- id: n20
  cau: Bản phối năm 1942 lâu nay được chơi và thu âm nhiều nhất.
  loai: lich-su
  nguon:
  - imslp-rib
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ngày nay được chơi nhiều nhất". Chữ mới: "lâu nay được chơi và thu âm nhiều nhất". Lý do: IMSLP: "Grofé''s 1942 orchestration was the one most widely performed and recorded until recently" (nay bản 1924 cũng hay được chơi lại).'
- id: n21
  cau: 'Bản thu trên trang là bản thu đầu tiên của tác phẩm: Gershwin chơi piano cùng dàn nhạc của Paul Whiteman, ngày 10/6/1924, cho hãng Victor.'
  loai: lich-su
  nguon:
  - loc-jb1
  - loc-blog
  - commons-wh
  ket_qua: dung
  ghi_chu: 'LoC jukebox: Victor 55225, thu 10/6/1924, Gershwin piano, Paul Whiteman Concert Orchestra. LoC blog: bản thu "quickly followed on June 10" sau buổi công diễn tháng 2.'
- id: n22
  cau: Để vừa hai mặt một đĩa hát thời đó, tác phẩm được rút gọn còn khoảng 9 phút.
  loai: so-lieu
  nguon:
  - loc-jb1
  - loc-jb2
  - commons-wh
  ket_qua: dung
  ghi_chu: Hai mặt part 1, part 2 của cùng đĩa 12 inch Victor 55225; Commons 261,09 + 272,88 = 534 giây ≈ 8,9 phút (bản đầy đủ khoảng 15 phút theo IMSLP).
- id: n23
  cau: Hết mặt thứ nhất, công cụ tự chuyển sang mặt thứ hai; có thể dán link YouTube hay link file.
  loai: ve-site
  ket_qua: dung
  ghi_chu: ban_thu của tac-pham/gershwin-rhapsody có 2 parts (src/data/tac-pham.yml); khối ::khoi-nghe phát nối các phần.
- id: n24
  cau: 'Bảng theo dõi, dòng 1: clarinet glissando mở đầu, vuốt từ trầm lên cao.'
  loai: cau-truc
  nguon:
  - sfs
  - score-nwm
  ket_qua: dung
- id: n25
  cau: 'Dòng 2: chủ đề chính đầu tiên: piano độc tấu, tiết tấu nảy.'
  loai: cau-truc
  nguon:
  - score-nwm
  ket_qua: null
  ghi_chu: 'chưa chắc: bản nhạc đã mở là bản piano độc tấu (cả bài ở piano) nên không cho biết ai chơi chủ đề ngay sau tiếng clarinet; chưa mở được tổng phổ hay bản hai piano 1924 (PDF IMSLP chặn máy). Lượt 2 đối chiếu bản hai piano 1924 hay bản thu Victor (phần 1, đầu bài).'
- id: n26
  cau: 'Dòng 3: dàn nhạc vào, chủ đề được "mặc áo" giao hưởng.'
  loai: cau-truc
  nguon:
  - score-nwm
  ket_qua: null
  ghi_chu: 'chưa chắc: như n25 (cần tổng phổ hay bản hai piano).'
- id: n27
  cau: 'Dòng 4: đoạn chậm, trữ tình ở giữa (Andantino moderato, Mi trưởng).'
  loai: cau-truc
  nguon:
  - score-nwm
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đoạn chậm, trữ tình ở giữa (chủ đề nổi tiếng nhất)". Chữ mới: "(*Andantino moderato*, Mi trưởng)". Lý do: "nổi tiếng nhất" là đánh giá; bản nhạc tr. 20: "Andantino moderato con espressione", bốn dấu thăng.'
- id: n28
  cau: 'Dòng 5: piano độc tấu virtuoso, chạy ngón tốc độ cao.'
  loai: cau-truc
  nguon:
  - score-nwm
  ket_qua: dung
  ghi_chu: 'Bản nhạc tr. 19: "Cad.", tay trái "brillante", chuỗi nốt nhanh.'
- id: n29
  cau: 'Dòng 6: trở lại chủ đề chính, dồn dập về kết.'
  loai: cau-truc
  nguon:
  - score-nwm
  ket_qua: dung
  ghi_chu: 'Bản nhạc: Agitato misterioso rồi các chủ đề quay lại, đẩy tới Grandioso.'
- id: n30
  cau: 'Dòng 7: kết hoành tráng, cả dàn nhạc và piano.'
  loai: cau-truc
  nguon:
  - score-nwm
  ket_qua: dung
  ghi_chu: 'Bản nhạc: Grandioso, Molto allargando ở cuối. Bản piano độc tấu không ghi bè dàn nhạc; "cả dàn nhạc" theo bản thu Victor (phần 2, cuối).'
- id: n31
  cau: 'Nguồn: bản nhạc và tổng phổ trên IMSLP.'
  loai: ten
  nguon:
  - imslp-rib
  ket_qua: dung
