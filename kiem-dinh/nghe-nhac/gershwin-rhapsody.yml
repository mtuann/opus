ghi_chu: 'Hướng dẫn nghe Rhapsody in Blue (tầng Tác phẩm). Bản quyền: Gershwin mất 1937, bản phối Grofé 1926, 1942 còn bảo hộ ở nhiều nước; trang không có khuông nhạc, không chép bản nhạc. Bản nhạc đọc để kiểm: bản piano độc tấu © 1924 New World Music (Internet Archive). Lịch sử: IMSLP, LoC (blog 2024, National Jukebox, authority), SF Symphony, COD. Sửa trang: độ dài 15 phút (n8); "huyền thoại" (n13); thêm câu láy rền và chuỗi 17 nốt (n14); câu chuyện Gorman theo SF Symphony, bỏ "nổi tiếng nhất" (n15); Broadway (n11); nghĩa "rhapsody" theo COD (n17); bản 1942 "lâu nay được chơi và thu âm nhiều nhất" (n20); dòng 4 bảng Theo dõi bỏ "chủ đề nổi tiếng nhất", ghi Andantino moderato, Mi trưởng (n27). Chưa chắc: n25, n26 (ai chơi chủ đề ngay sau clarinet: cần tổng phổ hay bản hai piano 1924); n33 (sách in Burkholder, Grove). Trang không nói gì về bản quyền bản thu (dữ liệu ban_thu ghi phạm vi công cộng: Commons PD-US-expired, LoC: bản thu 1923–1946 được bảo hộ 100 năm, tức bản 1924 hết hạn 1/1/2025). Số dòng bảng Theo dõi (7) và mốc dòng 1 giữ nguyên. Câu ở hồ sơ khác: nhac-cu/clarinet n24 (mở đầu bằng clarinet vuốt lên), blog/posts/2026-10-23-phien-ban-15 n20 (có bản thu 1924): trang vẫn giữ. Thuật ngữ: glissando, trill (láy rền) có trong thuat-ngu.yml; chưa có (cho D3-L5): syncopation (đảo phách), rhapsody, blues, jazz.'
doi_chu:
  - cu: Khoảng 16–17 phút
    moi: Khoảng 15 phút
    ly_do: "n8 (da-sua): lượt 1 D6-L8; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
  - cu:
      - 'Rhapsody in Blue ra đời từ một "cuộc thí nghiệm": buổi hòa nhạc An Experiment in Modern Music của Paul Whiteman đặt câu hỏi liệu jazz có thể bước vào phòng hòa nhạc cổ điển không. Gershwin — khi đó mới 25 tuổi và nổi tiếng với nhạc kịch Broadway — viết tác phẩm trong vài tuần.'
      - "Ngay tiếng đầu tiên đã là huyền thoại: một nốt clarinet vuốt lên (glissando) dài, từ trầm vút lên cao. Chuyện kể rằng nghệ sĩ clarinet Ross Gorman đùa nghịch kéo dài tiếng vuốt trong buổi tập, Gershwin nghe thấy và giữ lại — thành mở đầu nổi tiếng nhất của nhạc Mỹ thế kỷ 20."
      - 'Tác phẩm là một dòng chảy liền mạch (đúng nghĩa "rhapsody": phóng túng, không theo khuôn), hòa trộn giai điệu blues, tiết tấu jazz syncopation và hòa âm cổ điển. Phần dàn nhạc do Ferde Grofé phối: bản gốc năm 1924 cho ban nhạc jazz của Paul Whiteman, một bản năm 1926 cho dàn nhạc nhà hát, và bản năm 1942 cho dàn nhạc giao hưởng đầy đủ, ngày nay được chơi nhiều nhất.'
    moi:
      - 'Rhapsody in Blue ra đời từ một "cuộc thí nghiệm": buổi hòa nhạc An Experiment in Modern Music của Paul Whiteman đặt câu hỏi liệu jazz có thể bước vào phòng hòa nhạc cổ điển không. Gershwin — khi đó mới 25 tuổi và đã nổi tiếng với những ca khúc trong các vở diễn Broadway — viết tác phẩm trong vài tuần.'
      - "Ngay tiếng đầu tiên đã rất đặc biệt: một nốt clarinet vuốt lên (glissando) dài, từ trầm vút lên cao. Gershwin viết một tiếng láy rền ở âm vực trầm rồi một chuỗi 17 nốt đi lên; chuyện kể rằng trong buổi tập, nghệ sĩ clarinet Ross Gorman (có lẽ để đùa) vuốt liền các nốt ấy thành một đường trượt, và từ đó tác phẩm luôn mở đầu như vậy — thành một âm thanh tiêu biểu của nhạc Mỹ."
      - 'Tác phẩm là một dòng chảy liền mạch (đúng nghĩa "rhapsody": một chương liền mạch, thường dựa trên những giai điệu đại chúng), hòa trộn giai điệu blues, tiết tấu jazz syncopation và hòa âm cổ điển. Phần dàn nhạc do Ferde Grofé phối: bản gốc năm 1924 cho ban nhạc jazz của Paul Whiteman, một bản năm 1926 cho dàn nhạc nhà hát, và bản năm 1942 cho dàn nhạc giao hưởng đầy đủ, lâu nay được chơi và thu âm nhiều nhất.'
    ly_do: "n11 (da-sua), n13 (da-sua), n14 (da-sua), n15 (da-sua), n17 (da-sua), n20 (da-sua): lượt 1 D6-L8; chữ cũ, chữ mới, lý do và nguồn ở ghi_chu của các nhận định ấy."
