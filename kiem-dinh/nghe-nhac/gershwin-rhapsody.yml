- id: imslp-rib
  bac: 2
  ten: 'IMSLP, Rhapsody in Blue (Gershwin, George): 1924; công diễn "1924-02-12 in New York, Aeolian Hall. Concert – An Experiment in Modern Music", Gershwin piano, Whiteman; phối Grofé; bản phối 1924 (jazz band), 1926 (theatre orchestra), 1942 (symphonic); "Grofé''s 1942 orchestration was the one most widely performed and recorded until recently"; Average Duration 15 minutes; Piece Style Early 20th century; tags rhapsodies, pf orch (wikitext qua api.php, 06/11/2026)'
  link: https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
- id: loc-auth
  bac: 2
  ten: 'Library of Congress Name Authority n81081332: "Gershwin, George, 1898-1937. Rhapsody in blue" (bản .json)'
  link: https://id.loc.gov/authorities/names/n81081332.json
- id: loc-blog
  bac: 2
  ten: 'Library of Congress, In the Muse (blog), "Rhapsody in Blue at 100" (Raymond A. White, 9/2/2024): 12/2/1924, Aeolian Hall; "An Experiment in Modern Music"; Whiteman muốn cho thấy "the tremendous strides which have been made in popular music"; "famously composed by George in only a few weeks"; Gershwin ra mắt hòa nhạc ở tuổi 25; "already well known as a composer of popular songs—most of which derived from Broadway shows"; bản phối cho dàn nhạc nhà hát năm 1926; bản thu Victor "quickly followed on June 10"'
  link: https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
- id: loc-jb1
  bac: 2
  ten: 'Library of Congress, National Jukebox, Rhapsody in blue, part 1: Victor 55225, matrix C-30174/1, thu 10/6/1924, đĩa 12 inch; Gershwin piano, Paul Whiteman Concert Orchestra, Grofé phối (bản .json)'
  link: https://www.loc.gov/item/jukebox-70342/
- id: loc-jb2
  bac: 2
  ten: 'Library of Congress, National Jukebox, Rhapsody in blue, part 2: Victor 55225, matrix C-30173/2, thu 10/6/1924'
  link: https://www.loc.gov/item/jukebox-70335/
- id: commons-wh
  bac: 2
  ten: 'Wikimedia Commons, Paul Whiteman Concert Orchestra - Rhapsody in Blue Part 01.mp3 (261,09 giây) và Part 02.mp3 (272,88 giây): ngày 1924-06-10, nguồn LoC jukebox-70342 và 70335, PD-US-expired (đọc qua API)'
  link: https://commons.wikimedia.org/wiki/File:Paul_Whiteman_Concert_Orchestra_-_Rhapsody_in_Blue_Part_01.mp3
- id: sfs
  bac: 2
  ten: 'San Francisco Symphony, Open Rehearsal: Gershwin''s Rhapsody in Blue (chú giải): "Gershwin notated the work''s opening as a low clarinet trill followed by a scale rising rapidly through seventeen notes"; "At a rehearsal, the premiere''s clarinetist Ross Gorman—perhaps as a joke—elided the notes into a sweeping ribbon of uninterrupted pitches, after which there was no turning back"; "That opening glissando became an iconic sound of American music"; "Gershwin devoted about a month to writing Rhapsody in Blue"'
  link: https://www.sfsymphony.org/Buy-Tickets/2017-18/OR-Gershwin-Rhapsody-in-Blue
- id: cod-rhapsody
  bac: 2
  ten: The Concise Oxford Dictionary of Music, mục rhapsody ("a comp. in one continuous movt., often based on popular, nat., or folk melodies … Gershwin used the term for his Rhapsody in Blue"), qua Encyclopedia.com
  link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rhapsody
- id: score-nwm
  bac: 1
  ten: 'Gershwin, Rhapsody in Blue, bản piano độc tấu, © 1924 New World Music Corp. (lần in sau, Warner Bros. Publications), Internet Archive rhapsodyinblue00geor: Lời nói đầu (Whiteman đặt bài cho "concert of symphonic jazz at Aeolian Hall"; Gershwin muốn bác bỏ quan niệm "the inflexibility of jazz rhythms"; viết "in three weeks"); tr. 3 Molto moderato, láy rền rồi chuỗi 17 nốt; tr. 19 "Cad.", "brillante"; tr. 20 Andantino moderato con espressione, bốn dấu thăng; các trang cuối Agitato misterioso, Grandioso, Molto allargando. Chỉ đọc, không chép lên trang.'
  link: https://archive.org/details/rhapsodyinblue00geor
