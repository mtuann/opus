  - id: n18
    cau: 'Chương 1, đoạn đầu: nhiều ô mở bằng quãng năm Rê–La nhấn ở bè trầm; tay phải có chùm ba và nốt láy; đoạn đầu kết ở ô 20 bằng hợp âm ngân dài (longa); Allegretto, 2/4.'
    loai: cau-truc
    nguon: [ quet-3953, henle-bem ]
    ket_qua: dung
    ghi_chu: 'Tr. 3: 2/4, hai dấu thăng; ô 1–4 tay trái quãng năm Rê–La có dấu nhấn ^, ô 5 trở đi phần lớn ô mở bằng quãng năm Rê–La sf ở khóa Fa rồi hợp âm khóa Sol (chroma bản thu 2–8 s: A, D). Chùm ba (số 3 trên nhóm móc kép) và nốt láy (nốt nhỏ) ở các hệ 2–5 tr. 3. Năm hệ 5+3+4+4+4 = 20 ô; ô 20 "longa" có dấu ngân, Henle "T 20 … fünf ♩". Chữ Allegretto theo bản sửa.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "Bản quét tr. 3: Allegretto ♩=86, 2/4; tay trái quãng năm Rê–La có dấu nhấn (^, gạch ngang) ở đầu nhiều ô; tay phải chùm ba (số 3) và nốt láy; ô 20 (ô cuối hệ 5) rit., chữ 'longa' trên hợp âm có dấu ngân."
    review: dung
  - id: n19
