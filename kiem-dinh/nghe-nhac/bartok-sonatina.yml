    ghi_chu: 'Tr. 4 chú thích *: "táncdallam; előadták Vaskohmezőn (Câmp), Bihar m. (Bartók: Chansons populaires roumaines du département Bihar; București, 1913; 337. lap, 350. szám.)". Năm in đậm trên bản quét trông như "1918" (chữ số 3 của bộ chữ này giống 8, như "3953" trông như "8958"); Henle ghi "Bucharest, 1913, p. 337, no. 350". táncdallam = tánc (múa) + dallam (giai điệu). Vaskohmezőn bỏ đuôi -n: Vaskohmező. Review (Claude, 17/11/2026): bản quét tr. 4, chú thích đọc ở 400 dpi: năm in đậm trông như "1918", nhưng cùng bộ chữ ấy số bản in trông như "8958" và "337" như "887"; lời bình Henle (PDF tải lại) ghi "Bukarest 1913, S. 337, Nr. 350" (bản tiếng Anh "Bucharest, 1913"): giữ 1913. Tên tập, "București" và tên hạt Bihar trên trang viết như chú thích của bản in (tiếng Romania ngày nay: Bihor; trang chép đúng bản in nên không đổi).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630", "https://www.henle.de/media/0b/19/f2/1697725688/1401-1697725688-sync.pdf" ]
    luot_2_ghi_chu: "Bản quét tr. 4: 'táncdallam; előadták Vaskohmezőn (Câmp), Bihar m. (Bartók: Chansons populaires roumaines du département Bihar; București, 191?; 337. lap, 350. szám.)'. Chữ số cuối của năm in đậm trông như 8, nhưng cùng kiểu chữ ấy số bản in 3953 cũng trông như '8958' và '337' như '887', nên đọc là 3. Henle Comments xác nhận: 'Chansons populaires roumaines du département Bihar, Bucharest, 1913, p. 337, no. 350'. Câu chỉ nói năm in tập (1913), không nói năm sưu tầm."
