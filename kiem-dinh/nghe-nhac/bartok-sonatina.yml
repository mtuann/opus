ghi_chu: 'Hướng dẫn nghe mới (lộ trình thêm tác phẩm, mục 7, hướng dẫn nghe số 3). Ấn bản: bản quét IMSLP #893630 (9 trang PDF: bìa, trang trắng, nhạc ở số trang in 3–9) là bản SỬA, không phải bản in đầu, dù IMSLP ghi "First edition", 1919: chân mọi trang ghi "R. és Tsa 3953" (lời bình Henle: bản in đầu 1919 số 3929, bản sửa không ghi năm, đầu thập niên 1930, số mới 3953, dùng lại bản khắc của bản in đầu); có thời lượng "Aufführungsdauer" cuối mỗi chương (1′30″, 32″, 1′45″) và chú thích ký hiệu bàn đạp ở trang 3, hai điều Henle nói là thêm ở bản sửa; chương 1 ghi Allegretto ♩ = 86 (Henle: bản 1919 ghi Molto moderato ♩ = 74). Dòng "Copyright 1919" ở bìa và trang 3 là năm bản quyền gốc, giữ nguyên khi in lại. IMSLP không có bản quét nào của bản in 3929 (wikitext 17/11/2026: các bản khác là Dover 1982, EMB 1952, Muzgiz 1933, Boosey & Hawkes 1950, đều in lại hay sửa). Vì vậy trang KHÔNG có trích đoạn (khối abc): bản sửa in sau 1930 nên không dùng cho trích đoạn theo quy tắc bản quyền của lộ trình (mục 2), và không có bản số mở. Mô tả cấu trúc (số ô, tay nào mang giai điệu, chữ tốc độ, hóa biểu, nhịp) đọc trên bản quét 3953 ở 100–300 dpi; đó là sự kiện về tác phẩm, không chép nốt; chữ tốc độ trên trang ghi rõ là theo bản sửa. Như hai bài học Bartók đã có (bartok-for-children theo Rozsnyai 1909, bartok-romanian-folk-dances theo UE 1918 đã kiểm là bản in trước 1934): trích đoạn chỉ từ bản in đầu; ở đây không có bản in đầu nên bỏ trích đoạn. Tác giả mất 1945, hết bảo hộ ở Việt Nam. Mốc ::khoi-nghe đo trên file gốc Commons (Bartok_-_Sonatina.ogg, 220,6 s) bằng librosa (venv-audio): độ to RMS (khoảng lặng 0–2,4; 27,9–29,2; 77,6–85,3 đuôi hợp âm cuối chương 1; 115,1–119,0 giữa chương 2 và 3; 147,6–148,7; 189,3–191,3), chroma_cqt từng giây và khởi âm (onset_detect) có chroma: dòng 1 nốt đầu 2,55 s (A D E); dòng 2 Allegro 29,33 s (E); dòng 3 Tempo I 51,06 s (D A); dòng 4 chương 2 85,40 s; dòng 5 ô 9 96,43 s (E A C♯: hợp âm Đô♯–Mi tay phải trên Mi tay trái); dòng 6 chương 3 119,19 s (D, tay trái một mình 119–122 s); dòng 7 Sostenuto 148,70 s (sau ô rallentando, D E); dòng 8 hai nốt cao La–Si từ 160,91 s (A B lặp tới 162 s); dòng 9 coda 191,19 s sau quãng lặng 189,3–191,3 (ô non rit. có dấu lặng). Mốc ghi bằng attach.py --ref, làm tròn xuống giây (148,70 → 148). Sơ đồ (hinh) chia theo các mốc ấy. Chữ do ::hinh-cau-truc dựng thuộc hồ sơ du-lieu/tac-pham/bartok-sonatina. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe (cách đo ghi ở đây), câu hỏi để nghe chủ động (không khẳng định gì), câu dẫn mặc định của bảng Theo dõi khi nghe.'
