    luot_2_ghi_chu: "Henle (Somfai), lời tựa: phác thảo xuân 1915 (có thể một phần từ 1914), Rózsavölgyi in lần đầu 1919; phần Comments: Rv1919 Budapest, Rózsavölgyi, copyright 1919; Rvrev 'Revised edition (no date, from the early 1930s)'. IMSLP ghi thêm UE Wien in đồng thời, không mâu thuẫn."
