    ghi_chu: 'Tr. 8 hệ 1–3: tay phải móc kép La5 (dòng kẻ phụ thứ nhất trên khóa Sol) và Si5 xen nhau, "simile"; tay trái khóa Sol, p, nốt tách và nốt có gạch, hai bè. Bản thu 160,9–172 s chroma A, B trội.'
