    luot_2_ghi_chu: "Trang sản phẩm Henle: 'in 1915, the piece slowly evolved out of a series of piano transcriptions of Romanian folk melodies'. Comments (nguồn Rvproof): 'The title \"Sonatina\" and the titles of the movements were presumably introduced in this manuscript' (bản khắc cho bản in)."
