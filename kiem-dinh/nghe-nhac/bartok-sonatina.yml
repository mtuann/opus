  - id: n14
    cau: 'Bản in đầu (Rózsavölgyi, 1919, số bản in 3929) ghi chương 1 là Molto moderato (♩ = 74); đầu thập niên 1930 Bartók sửa: chương 1 thành Allegretto (♩ = 86), tốc độ chương 1 và 3 tăng, mỗi chương có thêm thời lượng (1′30″, 32″, 1′45″).'
    loai: so-lieu
    nguon: [ henle-bem, quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Henle: Rv1919 số 3929; RvBB "Überarbeitung der Tempoangaben und die Hinzufügung der Spieldauer"; bảng: Rv1919 Molto moderato ♩ = 74, Rvrev Allegretto ♩ = 86; "obwohl Bartók das Tempo in Rvrev für die Sätze I und III bereits etwas erhöht hatte" (74→86, 140→150, 152–140→154–146). Bản quét (bản sửa): tr. 3 "Allegretto (♩ = 86)", thời lượng tr. 5, 5, 9. Bảng của Henle trong PDF mất định dạng cột: thứ tự cột suy từ câu văn (Rvrev nhanh hơn Rv1919 ở chương 1, 3) và từ bản quét 3953 (khớp cột Rvrev). Review (Claude, 17/11/2026): bảng tốc độ trong PDF Henle tải lại (thứ tự khối chữ: cột Tempo und Metronomangabe, rồi Revidierte Angabe, Dauer, rồi Bartók/1927, Bauerntanz): Molto moderato ♩ = 74, Allegro 140, Moderato 80, Allegro vivace 152–140 | ♩ = 86, 150, 154–146 và 1′30″, 32″, 1′45″ | 1927: ca. 94, ca. 182, ca. 104–92, ca. 184: khớp cách đọc của lượt 1. Henle lấy bản sửa làm nguồn chính ("Als Hauptquelle der vorliegenden Edition diente die revidierte Ausgabe Rvrev"), nên chữ tốc độ theo bản sửa trên trang cũng là chữ của ấn bản Henle mà ABRSM chỉ định: trang nhất quán (chữ tốc độ theo bản sửa, chuyện hai bản in theo Henle).'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/0b/19/f2/1697725688/1401-1697725688-sync.pdf", "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "Henle Comments: Rv1919 số bản in 'R. és Tsa 3929'; bảng tốc độ: I Molto moderato ♩=74 → Allegretto ♩=86 (đoạn Allegro 140 → 150), III Allegro vivace 152–140 → 154–146, II Moderato 80 không đổi; RvBB thêm thời lượng; Rvrev đầu thập niên 1930; 'in Rvrev Bartók slightly increased the tempo of movements I and III'. Bản quét ghi 1′30″, 32″, 1′45″."
    review: dung
