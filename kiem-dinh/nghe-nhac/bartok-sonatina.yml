    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "Bản quét tr. 8: tay phải lặp móc kép Si5–La5 (dòng kẻ phụ thứ nhất và trên nó, 'simile') nhiều ô liền, tay trái chơi giai điệu bên dưới (khuông dưới chuyển khóa Sol)."
    review: dung
  - id: n25
    cau: 'Chương 3, coda tranquillo nhắc lại giai điệu đầu, nhỏ hơn, chậm hơn (più tranquillo, pp); rồi chậm hẳn lại (Sostenuto molto), nhanh dần (accel.) về Tempo I và mạnh dần, sau cùng chậm dần (allargando) vào các hợp âm kết rất mạnh (ff).'
    loai: cau-truc
    nguon: [ quet-3953 ]
    ket_qua: da-sua
    ghi_chu: 'Tr. 9 hệ 2: "tranquillo (coda)", p; hệ 3 "più tranquillo", "pp", hình móc kép có nốt láy giống ô 5 của chương (tr. 6); hệ 4 "Sostenuto molto", "accel.", hệ 5 "al Tempo I", hệ 6 "allargando", hợp âm kết sf. tranquillo = "Yên tĩnh" (thuat-ngu.yml). Review (Claude, 17/11/2026): đã sửa theo lượt 2. Bản quét tr. 9 (110 dpi): hệ 2 "non rit." rồi vạch kép, "tranquillo (coda)", p; hệ 3 "più tranquillo", pp, rồi f; hệ 4 "Sostenuto molto", "accel." với p cresc.; hệ 5 "al Tempo I" (giai điệu trên hợp âm tay trái, f); hệ 6 "sempre cresc.", "allargando", hợp âm sf trên ff ở tay trái, hai ô hợp âm kết sf. Câu cũ "rồi nhanh dần tới hợp âm kết" bỏ mất Sostenuto molto và allargando. Sửa ở đoạn Chương 3 (Điều cần biết) và dòng coda của bảng Theo dõi khi nghe. Đo lại trên file gốc Commons (librosa, onset kèm chroma): coda tranquillo 191,19 s sau quãng lặng 189,2–191,2 (mốc 191 giữ); più tranquillo 195,6 s (Rê–Sol); Sostenuto molto 199,3 s; accel. từ khoảng 203,7 s (tiếng nhỏ rồi to dần); Tempo I khoảng 207,3 s (độ to tăng 0,04 → 0,13 tới 209,5 s); allargando khoảng 213–215 s; hợp âm kết 215,5, 216,4, 217,7 s. allargando: thuat-ngu.yml "Chậm dần và trang trọng hơn"; accelerando "Nhanh dần"; molto "Nhiều, rất nhiều"; sostenuto "Ngân giữ" (trang viết "chậm hẳn lại (Sostenuto molto)" vì đây là chữ tốc độ, như Sostenuto của đoạn giữa chương).'
    luot_2: sai
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "câu đúng: Chương 3, coda tranquillo nhắc lại giai điệu đầu, nhỏ và chậm hơn (più tranquillo, pp); rồi Sostenuto molto, nhanh dần (accel.) về Tempo I, và chậm dần (allargando) tới hợp âm kết.; Bản quét tr. 9: 'tranquillo (coda)', 'più tranquillo' pp — đúng. Nhưng sau đó là 'Sostenuto molto', 'accel. … al Tempo I', rồi 'allargando' trước hợp âm kết (sf, ff). Câu 'rồi nhanh dần tới hợp âm kết' bỏ mất allargando nên tả sai đoạn cuối. Bản thu La Pianista khớp: Sostenuto molto ~199 s, Tempo I ~207 s, chậm dần ~214 s, hợp âm cuối ~217 s."
    review: dung
  - id: n26
    cau: 'Bản in dùng ký hiệu bàn đạp hình ngoặc vuông dưới khuông, chỉ rõ chỗ nhấn và chỗ nhả; theo Henle, Bartók ưa ký hiệu này trong những năm 1908–1918.'
    loai: lich-su
    nguon: [ quet-3953, henle-bem ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 3 chú thích "* ⌊___⌋ = pedáljelzés (Pedalbezeichnung)", ngoặc dưới khuông tay trái suốt các chương. Henle: "bevorzugte Bartók zwischen 1908 und 1918 das eckige Pedalzeichen, das Anfang und Ende des Pedalgebrauchs präzise kennzeichnet". Henle nói chú thích ký hiệu ở trang 1 là của bản sửa; ký hiệu đã có ở bản 1919. Review (Claude, 17/11/2026): Henle (PDF tải lại): "bevorzugte Bartók zwischen 1908 und 1918 das eckige Pedalzeichen, das Anfang und Ende des Pedalgebrauchs präzise kennzeichnet"; ký hiệu ngoặc dưới khuông dưới thấy ở tr. 6 và 9 của bản quét: khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/0b/19/f2/1697725688/1401-1697725688-sync.pdf", "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "Henle Editorial notes: 'between 1908 and 1918 Bartók favoured the bracket-shaped pedal sign, which marks the place of the press and release precisely'. Bản quét tr. 3: chú thích '* ⌊__⌋ = pedáljelzés (Pedalbezeichnung)', ngoặc dưới khuông dưới."
    review: dung
