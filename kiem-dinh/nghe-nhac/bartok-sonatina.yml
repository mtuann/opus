  - id: henle-bem
    bac: 2
    ten: 'G. Henle Verlag, HN 1401 Sonatina, Bemerkungen/Comments (László Somfai, Budapest, mùa xuân 2016), PDF mẫu 3 trang: nguồn A "Autograph draft complex of the three Romanian sets (1915): Romanian Christmas Carols (Colinde) BB 67, Romanian Folk Dances BB 68, and the Sonatina BB 69"; Rvproof (1918) "The title Sonatina and the titles of the movements were presumably introduced in this manuscript"; "Rv1919 First edition. Budapest, Rózsavölgyi, plate number R. és Tsa 3929, copyright 1919 … Edition with footnotes concerning the names of the dances and the location where Bartók collected them (in the case of the second dance, additional reference to Béla Bartók, Chansons populaires roumaines du département Bihar, Bucharest, 1913, p. 337, no. 350)"; RvBB: "revision of the tempo indications and the addition of the duration"; "Rvrev Revidierte Ausgabe (undatiert, Anfang der 1930er-Jahre), unter Verwendung der Druckplatten der Erstausgabe … neue Plattennummer R. és Tsa 3953 … auf der 1. Seite findet sich eine zusätzliche Fußnote zum Pedalzeichen"; "Bartók/1927 Aufzeichnung von Bartóks Aufführung auf Welte-US-Notenrolle 7785 vom 23. Dezember 1927 in New York … 1991 von Hungaroton in der Sammlung Bartók at the Piano 1920–1945 (HCD 12326) veröffentlicht"; bảng tốc độ: Rv1919 Molto moderato ♩ = 74, Allegro ♩ = 140, Moderato ♩ = 80, Allegro vivace ♩ = 152–140, Sostenuto; Rvrev Allegretto ♩ = 86, ♩ = 150, 1′30″, 32″, ♩ = 154–146, 1′45″; "Die Tempi in Bartók/1927 sind schneller als in Rv1919 und Rvrev, obwohl Bartók das Tempo in Rvrev für die Sätze I und III bereits etwas erhöht hatte"; Bartók giữ dấu ngân gần tới khi tắt tiếng; "Statt der traditionellen Pedalbezeichnung … bevorzugte Bartók zwischen 1908 und 1918 das eckige Pedalzeichen, das Anfang und Ende des Pedalgebrauchs präzise kennzeichnet"'
    link: https://www.henle.de/media/0b/19/f2/1697725688/1401-1697725688-sync.pdf
