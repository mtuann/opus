  - id: n22
    cau: 'Chương 3: Allegro vivace, 2/4; tay trái chơi một mình ba ô; cuối ô 4 tay phải vào bằng một nốt đà rồi hát giai điệu thứ nhất.'
    loai: cau-truc
    nguon: [ quet-3953 ]
    ket_qua: da-sua
    ghi_chu: 'Tr. 6: "Allegro vivace (♩ = 154–146)", 2/4, hai dấu thăng; ô 1–3 tay phải dấu lặng ô, ô 4 dấu lặng rồi một nốt lấy đà mp có dấu *; tay trái ô 1–4 mf. Bản thu 119–122 s chỉ có Rê (tay trái). Review (Claude, 17/11/2026): đã sửa theo lượt 2. Bản quét tr. 6 (110 dpi): tay phải lặng trọn ô 1–3; ô 4 lặng đen, lặng móc đơn chấm rồi nốt móc kép Rê (mp, ngón 1, dấu * chú thích) dẫn vào ô 5; tay trái mf từ ô 1. Câu trên trang (Điều cần biết, Chương 3) thành "tay trái chơi một mình ba ô; cuối ô 4 tay phải vào bằng một nốt đà rồi hát giai điệu thứ nhất"; dòng bảng Theo dõi khi nghe ("tay trái mở đầu một mình, rồi giai điệu thứ nhất vào ở tay phải") vẫn đúng, giữ. Mốc 119 đo lại không cần (dòng mở chương).'
    luot_2: sai
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "câu đúng: Chương 3: Allegro vivace, 2/4; tay trái mở đầu một mình (ba ô đầu tay phải nghỉ; tay phải vào bằng một nốt đà cuối ô 4), rồi giai điệu thứ nhất vào ở tay phải.; Bản quét tr. 6: Allegro vivace (♩=154–146), 2/4. Tay phải nghỉ trọn ô 1–3; ô 4 có lặng đen, lặng móc đơn chấm rồi nốt móc kép Rê (mp, ngón 1) dẫn vào ô 5. Nên 'bốn ô đầu tay phải nghỉ' không đúng hẳn: chỉ ba ô rưỡi. Phần còn lại đúng. Lỗi nhỏ, có thể chỉ cần bỏ ngoặc."
    review: dung
  - id: n23
