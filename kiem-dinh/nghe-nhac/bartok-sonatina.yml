nhan_dinh:
  - id: n1
    cau: 'Bảng đầu trang: Béla Bartók (1881–1945); Sonatina cho piano, Sz. 55, BB 69; ba chương I. Dudások, II. Medvetánc, III. Finale.'
    loai: ten
    nguon: [ quet-3953, imslp-sz55, henle-bem ]
    ket_qua: dung
    ghi_chu: 'Năm sinh–mất khớp nha-soan-nhac.yml (đã khóa) và Commons "(1881-1945)". Bản quét tr. 3, 5, 6: "I. (DUDÁSOK)", "II. (MEDVETÁNC)", "III. (FINALE)". IMSLP: Sz.55, ba chương cùng tên. Henle: "Sonatina BB 69". Chữ "cho piano": bìa "pour le piano".'
  - id: n2
    cau: 'Sáng tác năm 1915; in lần đầu năm 1919 (Rózsavölgyi, Budapest); bản sửa in đầu thập niên 1930.'
    loai: nam
    nguon: [ henle-bem, imslp-sz55, henle-hn1401 ]
    ket_qua: dung
    ghi_chu: 'Henle: bản thảo 1915; Rv1919 Erstausgabe Rózsavölgyi, copyright 1919; Rvrev "undatiert, Anfang der 1930er-Jahre". IMSLP: 1915. IMSLP ghi in lần đầu "1919 - Vienna: Universal Edition*, Simultaneously issued by Rózsavölgyi": khác Henle về nhà xuất bản; trang theo Henle (ấn bản phê bình, đọc bản in đầu ở Bartók-Archiv), chỉ nói Rózsavölgyi.'
  - id: n3
    cau: 'Thời kỳ: Thế kỷ 20. Thể loại: ba chương ngắn cho piano, dựng trên giai điệu múa dân gian Romania. Độ dài khoảng 4 phút.'
    loai: so-lieu
    nguon: [ imslp-sz55, henle-hn1401, quet-3953 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Piece Style=Early 20th century", "Average Duration=4 minutes", 3 movements. Henle: "melodies taken from Romanian instrumental folk music". Bản quét: thời lượng 1′30″ + 32″ + 1′45″ = 3′47″.'
  - id: n4
    cau: 'Mỗi chương dựng trên một hay hai giai điệu múa lấy từ nhạc khí dân gian Romania mà Bartók đã sưu tầm; không có hình thức sonata với hai chủ đề và phần phát triển.'
    loai: cau-truc
    nguon: [ henle-hn1401, henle-bem, quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Henle (trang sản phẩm): giai điệu từ nhạc khí dân gian Romania; Henle (lời bình): chú thích ghi nơi Bartók sưu tầm. Bản quét: chương 1 hai chú thích (tr. 3, 4), chương 2 một (tr. 5), chương 3 hai (tr. 6, 7); mỗi chương là giai điệu nhắc lại với bè đệm đổi, đoạn đầu trở lại (chương 1 Tempo I tr. 4; chương 3 coda tr. 9), không có phần phát triển chủ đề.'
  - id: n5
    cau: 'Theo Henle, tác phẩm hình thành dần trong năm 1915 từ một loạt bản chuyển soạn cho piano; tên "Sonatine" và tên các chương có lẽ chỉ được đặt khi chuẩn bị bản in.'
    loai: lich-su
    nguon: [ henle-hn1401, henle-bem ]
    ket_qua: dung
    ghi_chu: 'Trang sản phẩm: "in 1915, the piece slowly evolved out of a series of piano transcriptions". Lời bình, nguồn Rvproof: bản dùng để khắc (bản chép của Márta, Bartók sửa) "The title Sonatina and the titles of the movements were presumably introduced in this manuscript".'
  - id: n6
    cau: 'Bản thảo năm 1915 của Bartók chứa cả Romanian Christmas Carols (Colinde), Romanian Folk Dances và Sonatina.'
    loai: lich-su
    nguon: [ henle-bem ]
    ket_qua: dung
    ghi_chu: 'Nguồn A: "Autograph draft complex of the three Romanian sets (1915): Romanian Christmas Carols (Colinde) BB 67, Romanian Folk Dances BB 68, and the Sonatina BB 69".'
  - id: n7
    cau: 'Mỗi điệu múa có một chú thích cuối trang bằng tiếng Hungary ghi tên điệu múa và nơi Bartók ghi lại nó.'
    loai: cau-truc
    nguon: [ quet-3953, henle-bem ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 3 (**), 4, 5, 6, 7 (*): "… előadták …, … m." (tiếng Hungary). Henle: bản in đầu 1919 đã có các chú thích này ("footnotes concerning the names of the dances and the location where Bartók collected them").'
  - id: n8
    cau: 'Chương 1, đoạn đầu: ardeleana, Cserbel (Hunyad).'
    loai: lich-su
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Tr. 3 chú thích **: "„ardeleana" előadták Cserbelen, Hunyad m." (đọc 300 dpi). Tên làng bỏ đuôi chỉ nơi chốn -en của tiếng Hungary: Cserbel; "m." là megye (hạt).'
  - id: n9
    cau: 'Chương 1, đoạn Allegro: một giai điệu múa (táncdallam), Vaskohmező (Câmp), Bihar; bản in dẫn Chansons populaires roumaines du département Bihar của Bartók (București, 1913), tr. 337, số 350.'
    loai: lich-su
    nguon: [ quet-3953, henle-bem ]
    ket_qua: dung
    ghi_chu: 'Tr. 4 chú thích *: "táncdallam; előadták Vaskohmezőn (Câmp), Bihar m. (Bartók: Chansons populaires roumaines du département Bihar; București, 1913; 337. lap, 350. szám.)". Năm in đậm trên bản quét trông như "1918" (chữ số 3 của bộ chữ này giống 8, như "3953" trông như "8958"); Henle ghi "Bucharest, 1913, p. 337, no. 350". táncdallam = tánc (múa) + dallam (giai điệu). Vaskohmezőn bỏ đuôi -n: Vaskohmező.'
  - id: n10
    cau: 'Chương 2: jocul ursului, Váncsfalva (Oncesti), Máramaros.'
    loai: lich-su
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Tr. 5 chú thích *: "„jocul ursului" előadták Váncsfalván (Oncesti), Máramaros m.". Váncsfalván bỏ đuôi -n: Váncsfalva. Tên Romania viết như bản in (Oncesti, không dấu).'
  - id: n11
    cau: 'Chương 3, đoạn đầu: jocul turcii: mărunţel, Felsőrépa (Râpa de sus), Marostorda.'
    loai: lich-su
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Tr. 6 chú thích *: "„jocul turcii: mărunţel" előadták Felsőrépán (Râpa de sus) Marostorda m.". Felsőrépán bỏ đuôi -n: Felsőrépa.'
  - id: n12
    cau: 'Chương 3, đoạn Sostenuto: babaleuca, Keviszőllős (Seleuş), Torontál.'
    loai: lich-su
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Tr. 7 chú thích * (đặt ở nốt đầu Sostenuto): "„babaleuca" előadták Keviszőllősön (Seleuş), Torontál m.". Keviszőllősön bỏ đuôi -ön: Keviszőllős.'
  - id: n13
    cau: 'Dudások là "những người thổi kèn túi", Medvetánc là "điệu múa con gấu" (tiếng Hungary).'
    loai: ten
    nguon: [ abrsm-2025, imslp-sz55 ]
    ket_qua: dung
    ghi_chu: 'ABRSM: "Bagpipers: Allegretto (1st movt from Sonatina)". IMSLP: "Dudások (Bagpipes)", "Medvetánc (Bear Dance)". Chú thích chương 2 cũng ghi tên Romania "jocul ursului" (điệu múa của gấu).'
  - id: n14
    cau: 'Bản in đầu (Rózsavölgyi, 1919, số bản in 3929) ghi chương 1 là Molto moderato (♩ = 74); đầu thập niên 1930 Bartók sửa: chương 1 thành Allegretto (♩ = 86), tốc độ chương 1 và 3 tăng, mỗi chương có thêm thời lượng (1′30″, 32″, 1′45″).'
    loai: so-lieu
    nguon: [ henle-bem, quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Henle: Rv1919 số 3929; RvBB "Überarbeitung der Tempoangaben und die Hinzufügung der Spieldauer"; bảng: Rv1919 Molto moderato ♩ = 74, Rvrev Allegretto ♩ = 86; "obwohl Bartók das Tempo in Rvrev für die Sätze I und III bereits etwas erhöht hatte" (74→86, 140→150, 152–140→154–146). Bản quét (bản sửa): tr. 3 "Allegretto (♩ = 86)", thời lượng tr. 5, 5, 9. Bảng của Henle trong PDF mất định dạng cột: thứ tự cột suy từ câu văn (Rvrev nhanh hơn Rv1919 ở chương 1, 3) và từ bản quét 3953 (khớp cột Rvrev).'
  - id: n15
    cau: 'Bản quét trên IMSLP mang số 3953, tức bản sửa; đề cương ABRSM gọi chương 1 là "Bagpipers: Allegretto".'
    loai: ten
    nguon: [ quet-3953, henle-bem, abrsm-2025 ]
    ket_qua: dung
    ghi_chu: 'Chân tr. 3–9: "R. és Tsa 3953" (hay "Tsa 3953"). Henle: Rvrev số 3953. ABRSM 2025–2026 và 2027–2028: "Bagpipers: Allegretto".'
  - id: n16
    cau: 'Năm 1927 Bartók tự chơi Sonatina vào một cuộn đàn tự động ở New York, còn nhanh hơn cả hai bản in.'
    loai: lich-su
    nguon: [ henle-bem ]
    ket_qua: dung
    ghi_chu: 'Henle: Welte-US-Notenrolle 7785, 23/12/1927, New York; "Die Tempi in Bartók/1927 sind schneller als in Rv1919 und Rvrev".'
  - id: n17
    cau: 'Năm 1931 Bartók soạn lại tác phẩm cho dàn nhạc thành Transylvanian Dances (Sz. 96).'
    loai: lich-su
    nguon: [ imslp-sz55 ]
    ket_qua: dung
