  - cu: Như violin, cello rất cần giáo viên ở giai đoạn đầu, nhất là cách cầm vĩ và thế ngồi. Người lớn dùng đàn cỡ 4/4; đàn thuê theo tháng là cách bắt đầu phổ biến vì cello tốt không rẻ. Học đọc khóa Fa trước, khóa Đô tenor sau.
