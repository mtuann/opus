    ghi_chu: 'Chữ cũ: "Như violin, cello rất cần giáo viên ở giai đoạn đầu, nhất là cách cầm vĩ và thế ngồi." Chữ mới: "Nên học với giáo viên ngay từ đầu nếu có điều kiện." Lý do: bỏ chi tiết cách cầm vĩ và thế ngồi (dính tới tư thế, không tìm được nguồn y khoa hay giáo viên đã mở); "rất cần" bớt tuyệt đối. Review D8-gom: lời khuyên tập đã sửa chữ, không cần nguồn; ket_qua da-sua đổi thành khong-can-nguon (khoa.mjs đòi nguồn cho da-sua). Không dính sức khỏe (chi tiết tư thế đã bỏ).'
  - id: n27
