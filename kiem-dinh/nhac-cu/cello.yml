ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc. Nguồn chính: COD (Encyclopedia.com: violoncello, viola, clef), Philharmonia Orchestra, VSL Academy, Orchestral Library; Britannica (qua Wayback) cho tiểu sử nghệ sĩ; IMSLP, Henle cho tác phẩm; Dayton Performing Arts cho chương 3 của Brahms 3; Resonate và Bass Bags cho lời khuyên thuê đàn. Chỗ sửa trang (da-sua): n1, n2, n8, n12, n13, n14, n15, n16, n19, n23, n25, n26, n28. Lời khuyên học "rất cần giáo viên, nhất là cầm vĩ và thế ngồi" viết lại bớt tuyệt đối, bỏ chi tiết tư thế (n26). Câu ve-site: n10, n17, n30, n31, n32 (kiểm ở src/content/docs/ và src/data/trang.yml; nhac-cu/index và nghe-nhac/bach-cello-1 chưa khóa hay chưa chuyển nên là "sắp có" ở bản thật). Chưa chắc: n27 (người lớn dùng đàn 4/4) suy từ Resonate và Bass Bags, không nguồn nào nói thẳng; n6: Orchestral Library (C2-C6) và VSL (C2-A5) lệch nhau, trang giữ "khoảng Đô6". Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có bản ghi, cho D3-L5: endpin (chân chống), khóa Đô tenor, nhạc cụ dịch giọng (transposing instrument), concerto đã có.'
doi_chu:
  - cu: "Opus Zero tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    moi: "Opus tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    ly_do: "Site mới tên Opus (bản trước tên Opus Zero); chữ trong trang theo tên hiện hành. Không phải nhận định về nhạc."
  - cu: 'mô tả: Cello có âm vực gần với giọng nam — từ trầm ấm đến cao vút — và được nhiều người coi là nhạc cụ "biểu cảm nhất" của dàn nhạc. Tiếng cello vừa có thể làm nền…'
    moi: 'mô tả: Cello thường được ví với giọng nam của bộ dây: âm vực rộng, vừa làm nền trầm, vừa hát giai điệu.'
    ly_do: 'n1, n2 (da-sua): mô tả đổi theo câu mở đầu (bỏ "biểu cảm nhất" và lời văn; theo Philharmonia).'
  - cu: Cello có âm vực gần với giọng nam — từ trầm ấm đến cao vút — và được nhiều người coi là nhạc cụ "biểu cảm nhất" của dàn nhạc. Tiếng cello vừa có thể làm nền trầm, vừa có thể hát như một giọng người.
    moi: Cello thường được ví với giọng nam của bộ dây. Âm vực rộng, nên tiếng cello vừa có thể làm nền trầm, vừa có thể hát giai điệu.
    ly_do: 'n1, n2 (da-sua): "biểu cảm nhất" không có nguồn; theo Philharmonia; bỏ "như một giọng người".'
  - cu: Cello đọc khóa Fa ở âm vực thấp và vừa, chuyển sang khóa Đô tenor khi lên cao, đôi khi cả khóa Sol ở âm vực rất cao (xem bài 17 về khóa Đô). Đây là một trong số ít nhạc cụ dây phải đọc thạo ba khóa.
    moi: Cello đọc khóa Fa ở âm vực thấp và vừa, chuyển sang khóa Đô tenor khi lên cao, đôi khi cả khóa Sol ở âm vực rất cao (xem bài 17 về khóa Đô). Người chơi cello vì vậy đọc cả ba khóa.
    ly_do: 'n8 (da-sua): "một trong số ít nhạc cụ" không có nguồn.'
  - cu: 'Dàn nhạc: bè trầm của bộ dây, nhưng thường được giao giai điệu quan trọng — ví dụ giai điệu cello mở đầu chương 3 Giao hưởng số 3 của Brahms.'
    moi: 'Dàn nhạc: bè trầm của bộ dây, nhưng cũng được giao giai điệu — ví dụ giai điệu cello mở đầu chương 3 Giao hưởng số 3 của Brahms.'
    ly_do: 'n12 (da-sua): "thường" và "quan trọng" không có nguồn (Philharmonia).'
  - cu: 'Thính phòng: thành viên không thể thiếu của tứ tấu dây; song tấu cello–piano là một thể loại lớn (Beethoven, Brahms, Rachmaninoff đều viết sonata cho cello).'
    moi: 'Thính phòng: có trong mọi tứ tấu dây; cũng có nhiều sonata cho cello và piano (Beethoven, Brahms, Rachmaninoff đều viết sonata cho cello).'
    ly_do: 'n13, n14 (da-sua): theo COD và IMSLP; bỏ "thể loại lớn".'
  - cu: 'Độc tấu: 6 tổ khúc của Bach là "kinh thánh" của cello; các concerto của Elgar, Dvořák, Haydn, Saint-Saëns là đỉnh cao repertoire.'
    moi: 'Độc tấu: 6 tổ khúc cho cello độc tấu của Bach (BWV 1007–1012); các concerto của Elgar, Dvořák, Haydn, Saint-Saëns.'
    ly_do: 'n15, n16 (da-sua): bỏ "kinh thánh" và "đỉnh cao" (lời văn không kiểm được); thêm số BWV theo IMSLP.'
  - cu: 'Saint-Saëns, Thiên nga (trong Lễ hội muông thú): giai điệu cello nổi tiếng nhất'
    moi: 'Saint-Saëns, Thiên nga (trong Lễ hội muông thú): bản cho cello'
    ly_do: 'n19 (da-sua): "nổi tiếng nhất" không kiểm được.'
