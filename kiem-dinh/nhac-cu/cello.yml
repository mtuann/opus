    moi: Pablo Casals (người làm sống lại sự quan tâm tới nhạc cello của Bach, nhất là qua việc biểu diễn sáu tổ khúc độc tấu), Mstislav Rostropovich, Jacqueline du Pré (bản thu Concerto Elgar năm 1965), Yo-Yo Ma, Sheku Kanneh-Mason.
