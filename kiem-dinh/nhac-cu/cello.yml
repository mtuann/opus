nhan_dinh:
  - id: n1
    cau: Cello thường được ví với giọng nam của bộ dây.
    loai: dinh-nghia
    nguon:
      - ph-cello
      - vsl-cello
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cello có âm vực gần với giọng nam — từ trầm ấm đến cao vút — và được nhiều người coi là nhạc cụ ''biểu cảm nhất'' của dàn nhạc". Chữ mới: "Cello thường được ví với giọng nam của bộ dây". Lý do: Philharmonia: "The cello is the tenor voice in the string section" (giọng tenor, tức giọng nam); "biểu cảm nhất" là so sánh tuyệt đối, không có nguồn; "từ trầm ấm đến cao vút" là lời văn. Cũng sửa mô tả (description) cho khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Cello" ]
    luot_2_ghi_chu: Cello 'often plays the bass or tenor part' trong dàn nhạc; so sánh với giọng nam là cách nói thông thường. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n2
    cau: Âm vực cello rộng, nên tiếng cello vừa làm nền trầm, vừa hát giai điệu.
    loai: dinh-nghia
    nguon:
      - ph-cello
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vừa có thể làm nền trầm, vừa có thể hát như một giọng người". Chữ mới: "vừa có thể làm nền trầm, vừa có thể hát giai điệu". Lý do: Philharmonia: "With its particularly wide range and powerful sound it can one minute be playing a bass line and the next a melody"; "như một giọng người" là lời văn, bỏ.'
  - id: n3
    cau: 'Cello có 4 dây lên theo quãng 5: Đô2 – Sol2 – Rê3 – La3.'
    loai: dinh-nghia
    nguon:
      - cod-vc
      - ph-cello
      - vsl-cello
    ket_qua: dung
    ghi_chu: 'COD: "Tuned to C G d a"; Philharmonia: "four strings, tuned in 5ths to C, G, D and A"; VSL: dây C từ C2, G từ G2, D từ D3, A từ A3.'
  - id: n4
    cau: Dây của cello thấp hơn viola đúng một quãng tám.
    loai: dinh-nghia
    nguon:
      - cod-viola
      - cod-vc
      - ph-cello
    ket_qua: dung
    ghi_chu: 'COD: viola "Tuned to c g d'' a''" (C3 G3 D4 A4), cello "C G d a" (C2 G2 D3 A3); Philharmonia: cello "can play an octave lower than the viola".'
  - id: n5
    cau: Người chơi cello ngồi, đàn tựa giữa hai đầu gối, chân chống (endpin) tì xuống sàn.
    loai: dinh-nghia
    nguon:
      - cod-vc
      - vsl-cello
    ket_qua: dung
    ghi_chu: 'COD: "Played between performer''s knees"; VSL: "the cellist places the instrument between his legs, where it rests on the floor on a tail-pin (spike)".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Cello" ]
    luot_2_ghi_chu: Mục 'Tailpiece and endpin' và tư thế ngồi kẹp giữa hai đầu gối. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n6
    cau: Âm vực thường dùng của cello từ Đô2 đến khoảng Đô6.
    loai: so-lieu
    nguon:
      - vsl-cello
      - ol-range
    ket_qua: dung
    ghi_chu: 'Hai nguồn lệch nhẹ: Orchestral Library ghi cello "C2-C6"; VSL ghi "C2 - A5 (harmonic A7)". Trang viết "đến khoảng Đô6" (có "khoảng"), khớp Orchestral Library và không mâu thuẫn VSL (La5 là nốt bấm thường, hơn đến Đô6 là nốt cao dùng ít). Lưu ý: hình âm vực ở trang dan-nhac (đã khóa) theo VSL (C2–A5).'
  - id: n7
    cau: Cello đọc khóa Fa ở âm vực thấp và vừa, chuyển sang khóa Đô tenor khi lên cao, đôi khi cả khóa Sol ở âm vực rất cao.
    loai: dinh-nghia
    nguon:
      - ph-cello
      - vsl-cello
      - cod-clef
    ket_qua: dung
    ghi_chu: 'Philharmonia: "written in the bass clef and occasionally moves into tenor clef as the music gets higher. When the music is very high the treble clef is used"; VSL: "notated mainly in bass clef ... tenor and treble clef are also used"; COD, Clef: "the tenor clef fixes middle C on the fourth line ... used for vc. and bn. parts above the bass staff" (khóa Đô tenor).'
  - id: n8
    cau: Người chơi cello vì vậy đọc cả ba khóa (Fa, Đô tenor, Sol).
    loai: dinh-nghia
    nguon:
      - ph-cello
      - vsl-cello
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là một trong số ít nhạc cụ dây phải đọc thạo ba khóa." Chữ mới: "Người chơi cello vì vậy đọc cả ba khóa." Lý do: "một trong số ít" là so sánh với mọi nhạc cụ dây, không có nguồn; "đọc thạo" cũng bỏ (Philharmonia nói người chơi không thích đổi khóa thường xuyên).'
  - id: n9
    cau: 'Cello không phải nhạc cụ dịch giọng: nốt viết sao vang vậy.'
    loai: dinh-nghia
    nguon:
      - vsl-cello
    ket_qua: dung
    ghi_chu: 'VSL: "The cello is a non-transposing instrument". VSL ghi thêm ngoại lệ trong tổng phổ thế kỷ 19 (Bruckner: khóa Sol "ở quãng tám", vang thấp hơn một quãng tám so với viết); trang nói chung chung, không sai.'
  - id: n10
    cau: 'Xem bài 17 về khóa Đô: link /opus/nhac-ly/17-khoa-do-dich-giong/.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: src/content/docs/nhac-ly/17-khoa-do-dich-giong.md có; trang đã khóa (có trong kiem-dinh/khoa.json), nên có trong bản thật. Bài 17 có hàng "Khóa Đô tenor ... âm vực cao của cello" (dòng 13), khớp câu trỏ tới. Review D8-gom: nhac-ly/17-khoa-do-dich-giong.md (đã khóa) dòng 13: khóa Đô tenor cho âm vực cao của cello.'
    review: dung
  - id: n11
    cau: Chương 3 (Poco allegretto) của Giao hưởng số 3 của Brahms mở đầu bằng giai điệu do cello chơi.
    loai: lich-su
    nguon:
      - dayton-brahms3
      - imslp-brahms3
    ket_qua: dung
    ghi_chu: 'Dayton Performing Arts: "The third movement, Poco Allegretto ... opens with one of Brahms''s most beautiful melodies in the cellos"; IMSLP: chương 3 của Giao hưởng số 3 (Op. 90) là "Poco allegretto".'
  - id: n12
    cau: Trong dàn nhạc, cello là bè trầm của bộ dây, nhưng cũng được giao giai điệu.
    loai: dinh-nghia
    nguon:
      - ph-cello
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhưng thường được giao giai điệu quan trọng". Chữ mới: "nhưng cũng được giao giai điệu". Lý do: Philharmonia: cello có thể chơi bass line rồi giai điệu; "thường" và "quan trọng" không có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Cello" ]
    luot_2_ghi_chu: Cello thường giữ bè bass hoặc tenor trong dàn nhạc và có phần độc tấu. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n13
    cau: Một cây cello có mặt trong mọi tứ tấu dây.
    loai: dinh-nghia
    nguon:
      - cod-vc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thành viên không thể thiếu của tứ tấu dây". Chữ mới: "có trong mọi tứ tấu dây". COD: "one vc. is part of every str. qt.".'
  - id: n14
    cau: Beethoven, Brahms, Rachmaninoff đều viết sonata cho cello (và piano).
    loai: lich-su
    nguon:
      - imslp-beet-cello
      - imslp-brahms-cello
      - imslp-rach-cello
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "song tấu cello–piano là một thể loại lớn (Beethoven, Brahms, Rachmaninoff đều viết sonata cho cello)". Chữ mới: "cũng có nhiều sonata cho cello và piano (…)". Lý do: "thể loại lớn" không kiểm được. IMSLP: Beethoven Cello Sonata No.3 Op.69, Brahms Cello Sonata No.1 Op.38, Rachmaninoff Cello Sonata Op.19, đều cho cello và piano.'
  - id: n15
    cau: Bach viết 6 tổ khúc cho cello độc tấu (BWV 1007–1012).
    loai: danh-muc
    nguon:
      - imslp-bach-cello
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "6 tổ khúc của Bach là ''kinh thánh'' của cello". Chữ mới: "6 tổ khúc cho cello độc tấu của Bach (BWV 1007–1012)". Lý do: "kinh thánh" là lời văn không kiểm được. IMSLP: "6 suites", BWV 1007–1012, cello.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/6_Cello_Suites,_BWV_1007-1012_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "IMSLP: 6 Cello Suites, BWV 1007–1012."
  - id: n16
    cau: Elgar, Dvořák, Haydn và Saint-Saëns đều viết concerto cho cello.
    loai: lich-su
    nguon:
      - imslp-elgar
      - imslp-dvorak
      - imslp-haydn
      - imslp-saint-saens
      - cod-vc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "các concerto của Elgar, Dvořák, Haydn, Saint-Saëns là đỉnh cao repertoire". Chữ mới: chỉ liệt kê. Lý do: "đỉnh cao" không kiểm được; COD, violoncello: concerto của Dvořák và Elgar "exploiting its expressive capabilities to the full". IMSLP: Elgar Op. 85, Dvořák Op. 104, Haydn Hob. VIIb:1, Saint-Saëns Op. 33.'
  - id: n17
    cau: Link Bach, Tổ khúc cello số 1 trỏ tới /opus/nghe-nhac/bach-cello-1/.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: nghe-nhac/bach-cello-1 có trong src/data/trang.yml (dòng 140) nhưng chưa có file ở src/content/docs/nghe-nhac/ (mới có bach-goldberg), nên là link "sắp có" cả ở bản xem lẫn bản thật. Lô chuyển trang nghe-nhac/bach-cello-1 phải giữ đúng địa chỉ /opus/nghe-nhac/bach-cello-1/ và là hướng dẫn nghe Tổ khúc cello số 1. Review D8-gom: src/data/trang.yml có nghe-nhac/bach-cello-1; chưa có trang nên hiện "sắp có"; trang cũ là hướng dẫn nghe Tổ khúc cello số 1.'
    review: dung
