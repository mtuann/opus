ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc. Nguồn mở được ngày 05/11/2026: Concise Oxford Dictionary of Music (Encyclopedia.com), VSL Academy (đọc qua công cụ đọc web: trang nạp bằng JavaScript, curl chỉ ra vỏ trống), IMSLP (trang tác phẩm), Cleveland Orchestra. Lượt 1 chỉnh nhiều câu: mô tả âm sắc bậc nhất/không bồi âm (t1), chất liệu và mốc Boehm (t2, t3), âm vực Rê7 (t6), piccolo (t9), bỏ lời văn và chi tiết giá/dễ học/sáo trúc (t5, t12, t14, t24–t26). Mô tả trang (description) đổi theo t1. doi_chu viết tay từ khối của dist/ cũ (dist chưa build lại sau sửa): người giao chạy node tools/chuyen/so-chu.mjs nhac-cu/sao --doi-chu sau khi build để đối chiếu dấu nháy cong. Thuật ngữ trang dùng chưa có bản ghi trong src/data/thuat-ngu.yml (cho D3-L5; không tạo bản ghi): piccolo, dịch giọng (transposing), embouchure, tutti, khóa Sol, Boehm; "sordino" chỉ có ở con-sordino. Câu t27 ("Opus tập trung vào piano") người giao ghi doi_chu.'
