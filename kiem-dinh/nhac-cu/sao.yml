nhan_dinh:
  - id: n1
    cau: Sáo hiện đại có âm sắc mềm, thanh ở âm vực giữa và sáng, xuyên ở âm vực cao.
    loai: dinh-nghia
    nguon:
      - vsl-flute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "âm thanh tròn và trong bậc nhất dàn nhạc — gần như không có bồi âm mạnh. Tiếng sáo vừa có thể thủ thỉ như gió, vừa có thể sắc lạnh xuyên qua cả dàn nhạc ở âm vực cao" (cả description). Chữ mới theo VSL, flute: âm sắc "homogeneous in all registers"; nốt thấp nhất có thể "dull and hollow", nốt giữa "mellow and graceful", nốt cao "brilliant and penetrating". Lý do: "bậc nhất dàn nhạc", "gần như không có bồi âm mạnh" và "xuyên qua cả dàn nhạc" không có nguồn bậc 1–2 (đã tìm, không thấy trang nào nói thẳng); phần "thủ thỉ như gió" là ẩn dụ, bỏ.'
  - id: n2
    cau: Câu "về bồi âm và âm sắc, xem trang Âm học".
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: trang src/content/docs/nhac-ly/am-hoc.md có trong bản build (tầng lõi, khóa); link /opus/nhac-ly/am-hoc/ đúng. Chữ cũ "(xem Âm học)" đứng sau câu "gần như không có bồi âm mạnh"; câu ấy đã bỏ (t1), nên chữ dẫn đổi thành "về bồi âm và âm sắc". Review nên kiểm trang Âm học có nói về bồi âm và âm sắc (trang có mục bồi âm). Review D8-gom: nhac-ly/am-hoc.md (đã khóa) có mục "Chuỗi bồi âm" và "Âm sắc".'
    review: dung
  - id: n3
    cau: Sáo hiện đại thường làm bằng kim loại (bạc, hợp kim bạc, vàng, bạch kim); cũng có cây bằng gỗ.
    loai: dinh-nghia
    nguon:
      - vsl-flute
      - cod-flute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "làm bằng kim loại (có cây bằng gỗ, bạc, thậm chí vàng)". VSL: "usually silver, nickel silver, gold, or platinum. Grenadilla, coco wood, or a wood-and-metal combination are less common"; COD: "formerly made of wood but now of silver and other metals". Đổi "làm bằng kim loại" thành "thường làm bằng kim loại" và liệt kê đúng như VSL. Khớp dan-nhac d9 (đã khóa).'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Western_concert_flute" ]
    luot_2_ghi_chu: "Wikipedia: gần như làm bằng kim loại hoặc gỗ, hoặc kết hợp. Danh sách chất liệu (bạc, vàng, bạch kim) chưa kiểm. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được)."
  - id: n4
    cau: Hệ thống khóa của sáo hiện đại do Theobald Boehm phát triển vào những thập niên 1830–1840.
    loai: lich-su
    nguon:
      - vsl-flute
      - cod-flute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hoàn thiện giữa thế kỷ 19". VSL: "developed by Theobald Boehm in the 1830s and 1840s"; COD: Boehm "revolutionized the instr. in 1832 with his ''ring key'' system. In 1847 he produced a 15-hole metal instr. with 23 keys". "Giữa thế kỷ 19" lệch nhẹ so với hai mốc 1832 và 1847, nên viết theo nguồn.'
  - id: n5
    cau: Sáo tạo âm khi người chơi thổi luồng hơi qua lỗ thổi, không ngậm dăm như kèn clarinet.
    loai: dinh-nghia
    nguon:
      - vsl-flute
      - cod-flute
      - cod-clarinet
    ket_qua: dung
    ghi_chu: 'VSL: "blows across the embouchure hole"; COD, Flute: "blowing across a round mouth-hole" (cách tạo âm của sáo ngang); COD, Clarinet: "Single-reed woodwind". Chữ cũ "không ngậm như kèn clarinet" đổi thành "không ngậm dăm như kèn clarinet" cho đúng (người chơi sáo vẫn đặt môi vào lỗ thổi).'
  - id: n6
    cau: Sáo tốn hơi hơn nhiều so với vẻ ngoài thanh mảnh.
    loai: so-lieu
    nguon: []
    ket_qua: da-bo
    ghi_chu: Đã bỏ khỏi trang (cùng câu với t4, sau dấu gạch ngang). Không nguồn bậc 1–2 nào đã mở nói về lượng hơi của sáo so với nhạc cụ khác (VSL, COD không nêu; không so sánh định lượng được). Lời giải thích "vì vậy" cũng bỏ theo.
    luot_2: khong-chac
    luot_2_ghi_chu: Điều 'tốn hơi' là lời nhận xét; chưa tìm được nguồn bậc 2 mở được.
  - id: n7
    cau: Âm vực của sáo khoảng Đô4 đến Rê7.
    loai: so-lieu
    nguon:
      - vsl-flute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "khoảng Đô4 đến Đô7". VSL: "The concert flute''s standard range is from B3 - D7 (forced up to F7)"; hình ranges-orchestra ở dan-nhac (đã khóa) ghi C4–D7 (Orchestral Library C4–D7). Đổi đỉnh từ Đô7 thành Rê7 cho khớp VSL và hình; đáy Đô4 là của sáo chân C (VSL tính cả chân B: Si3), trang ghi "khoảng".'
  - id: n8
    cau: 'Sáo không dịch giọng: viết sao vang vậy.'
    loai: dinh-nghia
    nguon:
      - vsl-flute
    ket_qua: dung
    ghi_chu: 'VSL: "a non-transposing instrument".'
  - id: n9
    cau: Piccolo là cây sáo nhỏ, vang cao hơn một quãng tám so với nốt viết.
    loai: dinh-nghia
    nguon:
      - vsl-piccolo
      - cod-piccolo
    ket_qua: dung
    ghi_chu: 'VSL, piccolo: "The piccolo in C is a transposing instrument. It sounds an octave higher than written." COD: "pitched octave higher than concert fl.". Khớp dan-nhac d10.'
  - id: n10
    cau: Tiếng piccolo sáng và xuyên hơn sáo thường; hay dùng đôi giai điệu ở quãng tám trong các đoạn toàn dàn nhạc (tutti).
    loai: dinh-nghia
    nguon:
      - vsl-piccolo
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vũ khí tạo hiệu ứng chói lói ở đoạn cao trào". VSL, piccolo: trong dàn nhạc Lãng mạn dùng để "brighten the sound and extend it upward"; "often doubles melody lines in octaves in tutti passages, adding a penetrating top edge"; "Played forte, it is piercing". Trang VSL không nói riêng về "cao trào": viết lại theo điều VSL nói.'
  - id: n11
    cau: Sáo đọc khóa Sol.
    loai: dinh-nghia
    nguon:
      - vsl-flute
    ket_qua: dung
    ghi_chu: 'VSL: "Treble clef".'
  - id: n12
    cau: Có tác phẩm mở đầu bằng tiếng sáo độc tấu, như Prélude à l'après-midi d'un faune của Debussy (1894).
    loai: lich-su
    nguon:
      - cleveland-prelude
      - imslp-prelude
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhiều bản nhạc mở đầu bằng tiếng sáo độc tấu (nổi tiếng nhất: Prélude …)". Cleveland Orchestra: "The famous opening flute solo sounds like an improvisation, not a theme"; công diễn lần đầu 1894. IMSLP: soạn 1891–94, công diễn 22/12/1894 ở Paris. "Nhiều bản nhạc" và "nổi tiếng nhất" không kiểm được, đổi thành "có tác phẩm" và thêm năm.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Pr%C3%A9lude_%C3%A0_l%27apr%C3%A8s-midi_d%27un_faune,_CD_87_(Debussy,_Claude)" ]
    luot_2_ghi_chu: "IMSLP: Prélude à l'après-midi d'un faune, 1891–94, ra mắt 22/12/1894. Việc mở đầu bằng sáo độc tấu là điều rất quen thuộc, không đọc thấy trong trang IMSLP."
  - id: n13
    cau: Sáo thường gánh các đoạn chạy nhanh, lấp lánh.
    loai: dinh-nghia
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang: lời văn chung, không nguồn bậc 1–2 nào nói thẳng (VSL chỉ mô tả âm sắc từng âm vực).'
  - id: n14
    cau: Sáo có tác phẩm độc tấu và thính phòng từ Baroque (Bach, Sonata cho sáo và harpsichord BWV 1030) đến đầu thế kỷ 20 (Debussy, Syrinx cho sáo độc tấu, 1913).
    loai: lich-su
    nguon:
      - imslp-bwv1030
      - imslp-syrinx
      - cod-syrinx
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "repertoire lớn từ Baroque (Bach) đến hiện đại (Debussy Syrinx cho sáo độc tấu)". "Lớn" không kiểm được, "hiện đại" quá rộng cho tác phẩm 1913. IMSLP: BWV 1030 cho flute và harpsichord, 1736–37; Syrinx cho flute, 1913. COD, Syrinx: "For solo fl., by Debussy, comp. 1913 for Louis Fleury".'
  - id: n15
    cau: Sáo có chỗ đứng trong nhạc nhẹ và jazz, ví dụ trong bossa nova và jazz fusion.
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang: không tìm được nguồn bậc 1–2 đã mở nói về sáo trong bossa nova hay jazz fusion (COD không có mục về sáo jazz).'
  - id: n16
    cau: 'Bach, Tổ khúc cho dàn nhạc số 2 (BWV 1067): Badinerie là chương cuối, có phần sáo độc tấu.'
    loai: danh-muc
    nguon:
      - imslp-bwv1067
    ket_qua: dung
    ghi_chu: 'IMSLP: 7 chương, chương 7 là Badinerie; InstrDetail "flute, strings, continuo (harpsichord)". Chữ cũ thêm: sáo "bay" nổi tiếng nhất Baroque; đã bỏ phần "bay", "nổi tiếng nhất Baroque" (so sánh không kiểm được) và thay bằng "phần sáo độc tấu" (da-sua cho vế này).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Orchestral_Suite_No.2_in_B_minor,_BWV_1067_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "IMSLP: Suite số 2 BWV 1067, 7 chương, chương 7 là Badinerie; flute, dây, continuo."
  - id: n17
    cau: Mozart, Concerto sáo số 1 cung Sol trưởng, K. 313.
    loai: danh-muc
    nguon:
      - imslp-k313
    ket_qua: dung
    ghi_chu: 'IMSLP: Flute Concerto in G major, K.313/285c, 1777–78 (trang IMSLP không ghi "số 1"; K.313 là concerto sáo đầu trong hai bản của Mozart theo cách gọi thông thường, chưa có nguồn bậc 1–2 đã mở nói thẳng số thứ tự). Review D8-gom: IMSLP (trang Flute Concerto in G major, K.313/285c): Alternative Title "Flute Concerto No. 1". "Số 1" có nguồn bậc 1; giữ.'
  - id: n18
    cau: Debussy, Syrinx cho sáo độc tấu, 1913.
    loai: ten
    nguon:
      - imslp-syrinx
      - cod-syrinx
    ket_qua: dung
    ghi_chu: 'IMSLP: cho flute, 1913; COD: soạn 1913 cho Louis Fleury.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Syrinx,_CD_137_(Debussy,_Claude)" ]
    luot_2_ghi_chu: "IMSLP: Syrinx (CD 137), flute độc tấu, 1913."
  - id: n19
