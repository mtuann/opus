doi_chu:
  - cu: "Opus Zero tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    moi: "Opus tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    ly_do: "Site mới tên Opus (bản trước tên Opus Zero); chữ trong trang theo tên hiện hành. Không phải nhận định về nhạc."
  - cu: Sáo hiện đại có âm thanh tròn và trong bậc nhất dàn nhạc — gần như không có bồi âm mạnh (xem Âm học). Tiếng sáo vừa có thể thủ thỉ như gió, vừa có thể sắc lạnh xuyên qua cả dàn nhạc ở âm vực cao.
    moi: Sáo hiện đại có âm sắc mềm, thanh ở âm vực giữa và sáng, xuyên ở âm vực cao (về bồi âm và âm sắc, xem Âm học).
    ly_do: 'n1, n2 (da-sua): theo VSL; bỏ "bậc nhất", "gần như không có bồi âm mạnh", "xuyên qua cả dàn nhạc" (không nguồn); mô tả trang đổi theo.'
  - cu: Sáo hiện đại làm bằng kim loại (có cây bằng gỗ, bạc, thậm chí vàng), với hệ thống khóa do Theobald Boehm hoàn thiện giữa thế kỷ 19. Âm thanh tạo ra khi người chơi thổi luồng hơi qua lỗ thổi (không ngậm như kèn clarinet) — vì vậy sáo tốn hơi hơn nhiều so với vẻ ngoài thanh mảnh.
    moi: Sáo hiện đại thường làm bằng kim loại (bạc, hợp kim bạc, vàng, bạch kim; cũng có cây bằng gỗ), với hệ thống khóa do Theobald Boehm phát triển vào những thập niên 1830–1840. Âm thanh tạo ra khi người chơi thổi luồng hơi qua lỗ thổi (không ngậm dăm như kèn clarinet).
    ly_do: 'n3, n4, n5, n6: chất liệu và mốc Boehm theo VSL, COD; "không ngậm dăm"; bỏ "tốn hơi hơn nhiều" (da-bo, không nguồn).'
  - cu: 'Âm vực: khoảng Đô4 đến Đô7 (viết sao vang vậy — sáo không dịch giọng).'
    moi: 'Âm vực: khoảng Đô4 đến Rê7 (viết sao vang vậy — sáo không dịch giọng).'
    ly_do: 'n7 (da-sua): VSL B3–D7; khớp hình ranges-orchestra (C4–D7) ở dan-nhac đã khóa.'
  - cu: 'Piccolo: cây sáo nhỏ, vang cao hơn một quãng tám so với nốt viết — vũ khí tạo hiệu ứng chói lói ở đoạn cao trào.'
    moi: 'Piccolo: cây sáo nhỏ, vang cao hơn một quãng tám so với nốt viết, tiếng sáng và xuyên hơn sáo thường — hay dùng đôi giai điệu ở quãng tám trong các đoạn toàn dàn nhạc (tutti).'
    ly_do: 'n10 (da-sua): theo VSL, piccolo; bỏ "vũ khí … chói lói ở đoạn cao trào".'
  - cu: 'Dàn nhạc: thường gánh các đoạn chạy nhanh, lấp lánh; nhiều bản nhạc mở đầu bằng tiếng sáo độc tấu (nổi tiếng nhất: Prélude à l''après-midi d''un faune của Debussy).'
    moi: 'Dàn nhạc: có tác phẩm mở đầu bằng tiếng sáo độc tấu, như Prélude à l''après-midi d''un faune của Debussy (1894).'
    ly_do: 'n12, n13: bỏ "thường gánh các đoạn chạy nhanh, lấp lánh" (da-bo), "nhiều bản nhạc", "nổi tiếng nhất" (không kiểm được); thêm năm 1894 (IMSLP, Cleveland Orchestra).'
  - cu: 'Thính phòng và độc tấu: repertoire lớn từ Baroque (Bach) đến hiện đại (Debussy Syrinx cho sáo độc tấu).'
    moi: 'Thính phòng và độc tấu: từ Baroque (Bach, Sonata cho sáo và harpsichord BWV 1030) đến đầu thế kỷ 20 (Debussy, Syrinx cho sáo độc tấu, 1913).'
    ly_do: 'n14 (da-sua): "repertoire lớn", "hiện đại" không kiểm được; dẫn tác phẩm có nguồn (IMSLP, COD).'
  - cu: 'Nhạc nhẹ/jazz: sáo cũng có chỗ đứng (ví dụ trong bossa nova và jazz fusion).'
    moi: null
    ly_do: 'n15 (da-bo): không có nguồn bậc 1–2 về sáo trong bossa nova, jazz fusion.'
  - cu: 'Bach, Tổ khúc cho dàn nhạc số 2, Badinerie (chương cuối): sáo "bay" nổi tiếng nhất Baroque'
    moi: 'Bach, Tổ khúc cho dàn nhạc số 2, Badinerie (chương cuối): phần sáo độc tấu'
    ly_do: 'n16 (da-sua): bỏ so sánh "nổi tiếng nhất Baroque" (không kiểm được); IMSLP xác nhận phần sáo.'
  - cu: Sáo tương đối dễ phát ra tiếng sau vài tuần — khó ở chỗ giữ hơi dài và tạo âm sắc đẹp, tròn. Sáo học sinh tốt không quá đắt so với các nhạc cụ khác. Người đã chơi sáo trúc có lợi thế lớn về hơi thở và ngón bấm cơ bản; khác biệt chính là cách đặt môi (embouchure) và hệ thống khóa kim loại.
    moi: Giữ hơi dài và tạo âm sắc đẹp, tròn là chỗ cần luyện lâu; nên học với giáo viên để có nền tảng đặt môi (embouchure) và hơi thở đúng.
    ly_do: 'n24, n25, n26, n27: bỏ "dễ phát ra tiếng sau vài tuần" (không nguồn), giá sáo học sinh (mau cũ), lợi thế của người chơi sáo trúc (không nguồn); giữ vế khó, thêm "nên học với giáo viên" (khuyen-tap).'
  - cu: 'mô tả: Sáo hiện đại có âm thanh tròn và trong bậc nhất dàn nhạc — gần như không có bồi âm mạnh (xem Âm học). Tiếng sáo vừa có thể thủ thỉ như gió, vừa có thể sắc lạnh…'
    moi: 'mô tả: Sáo hiện đại có âm sắc mềm, thanh ở âm vực giữa và sáng, xuyên ở âm vực cao (về bồi âm và âm sắc, xem Âm học).'
    ly_do: 'n1, n2 (da-sua): mô tả trang đổi theo câu mở đầu (bỏ "bậc nhất", "không có bồi âm mạnh").'
