  - cu: "Trumpet dễ phát ra tiếng nhưng khó chơi hay: môi nhanh mỏi, cao độ phụ thuộc hoàn toàn vào môi và hơi (van chỉ đổi ống). Người mới thường chỉ chơi được 15–20 phút mỗi ngày lúc đầu — đó là bình thường. Nên học với giáo viên để tránh tạo áp lực môi sai cách (dí kèn quá mạnh vào môi). Kèn học sinh giá vừa phải, và nhớ mua thêm sordino để tập không làm phiền hàng xóm."
    moi: Cao độ của trumpet phụ thuộc chủ yếu vào môi và hơi (các van chỉ đổi độ dài ống), nên chơi hay đòi hỏi luyện môi và hơi lâu dài. Người mới thường theo bản năng dí kèn mạnh vào môi để lên nốt cao; áp lực ấy cản máu tới cơ môi và làm tiếng kém đi, nên hãy học với giáo viên để tránh thói quen đó. Sordino làm tiếng nhỏ lại, hữu ích khi tập ở nơi cần giữ yên tĩnh.
    ly_do: 'n33, n34, n35, n36, n37, n38, n39: bỏ "dễ phát ra tiếng", "môi nhanh mỏi", "15–20 phút", giá kèn (da-bo); "hoàn toàn" thành "chủ yếu"; áp lực môi theo Weakley; sordino theo COD.'
