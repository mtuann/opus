nhan_dinh:
  - id: n1
    cau: 'Trumpet có âm sắc sáng, mạnh và lộng lẫy: kim loại, vang, nổi lên trong dàn nhạc.'
    loai: dinh-nghia
    nguon:
      - vsl-trumpet-c
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trumpet là giọng lệnh của dàn nhạc: sáng, vang xa, xuyên qua mọi âm thanh khác" (cả description). VSL, trumpet in C: "The trumpet''s sound is metallic, bright (but also dark in the lower register), intense, brilliant, powerful and stately"; "projects best between G3 and G5" (nghe rõ nhất ở G3–G5). "Giọng lệnh" là ẩn dụ và "xuyên qua mọi âm thanh khác" tuyệt đối, không nguồn: viết theo VSL. Khớp dan-nhac d15 (đã khóa).'
  - id: n2
    cau: Trumpet được dùng từ thời xưa làm kèn trận; ngày nay dùng trong dàn nhạc, ban nhạc jazz, ban nhạc quân đội.
    loai: lich-su
    nguon:
      - cod-trumpet
    ket_qua: dung
    ghi_chu: 'COD, Trumpet: "Used in orch. and jazz bands, also in military and brass bands"; trumpet thời Trung đại không van, loại "straight tpt." dài hơn 6 feet gọi là buisine; "claro or clarion". Chữ trang "tiếng kèn trận thời xưa" chỉ là cách nói gợi lại cách dùng quân sự, COD xác nhận cách dùng quân sự.'
  - id: n3
    cau: Khi chơi nhỏ, nhất là khi dùng sordino (nút bịt), tiếng trumpet có thể nhẹ và tinh tế.
    loai: dinh-nghia
    nguon:
      - vsl-trumpet-c
      - cod-mute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cũng có thể thủ thỉ rất tình cảm khi chơi nhỏ và dùng sordino (nút bịt)". VSL, trumpet in C, về mute: "piano" nghe "very gentle and subtle", mezzoforte "eerie", fortissimo "shrill and cutting"; COD, Mute: "a pear-shaped stopper to be pushed into the bell" cho kèn đồng. "Tình cảm" là cảm nhận, đổi thành "nhẹ và tinh tế" theo VSL.'
  - id: n4
    cau: Trumpet tạo âm bằng môi rung vào miệng kèn.
    loai: dinh-nghia
    nguon:
      - vsl-brass
      - cod-trumpet
    ket_qua: dung
    ghi_chu: 'VSL, brass: "on all brass instruments, sound comes from lip vibration … The vibrating lips of the musician against a mouthpiece serve as the generator"; COD: "Cup-shaped mouth-piece". Câu so sánh "(như thổi ''bờ'' môi)" là hình ảnh minh họa, giữ.'
  - id: n5
    cau: Trumpet dùng 3 van piston để đổi độ dài ống, từ đó đổi cao độ.
    loai: dinh-nghia
    nguon:
      - cod-trumpet
      - cod-valve
      - cod-piston
    ket_qua: dung
    ghi_chu: 'COD, Trumpet: "Since mid-19th cent. fitted with 3 valves which admit air to additional lengths of tubing"; COD, Valve: "Pitch altered by increasing or decreasing length of tube".'
  - id: n6
    cau: Van 1 hạ cao độ một cung, van 2 một nửa cung, van 3 quãng ba thứ (ba nửa cung).
    loai: quy-tac
    nguon:
      - cod-piston
    ket_qua: dung
    ghi_chu: 'COD, Piston: "First valve lowers pitch a tone, 2nd a semitone, 3rd 3 semitones."'
  - id: n7
    cau: Phối hợp các van tạo ra mọi nốt của gam chromatic.
    loai: dinh-nghia
    nguon:
      - cod-valve
    ket_qua: dung
    ghi_chu: 'COD, Valve: valve "whereby all the notes of the chromatic scale were made available to brass instr."'
  - id: n8
    cau: Hai loại trumpet dùng nhiều nhất là trumpet Si♭ và trumpet Đô; trumpet Si♭ là nhạc cụ dịch giọng.
    loai: dinh-nghia
    nguon:
      - cod-trumpet
      - vsl-trumpet-c
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trumpet là nhạc cụ dịch giọng. Loại phổ biến nhất là trumpet Si♭". COD: "Either a transposing instr. in B♭ … or non-transposing in C"; VSL: trumpet in C "Non-transposing", Bb trumpet "Sounds a major second lower than written". "Phổ biến nhất" không nguồn nào nói thẳng, và có loại không dịch giọng (Đô): đổi thành "thường là", "thường gặp". Kiểm mẫu D8 (Claude, chủ repo giao kiểm mẫu, 05/11/2026): chữ "Trumpet thường là nhạc cụ dịch giọng; loại thường gặp là trumpet Si♭" nói quá nguồn: COD ghi "Either a transposing instr. in B♭ … or non-transposing in C", VSL ghi "the most widely used trumpets are those in Bb and C" (không tách riêng Si♭). Đổi theo VSL.'
  - id: n9
    cau: Với trumpet Si♭, nốt viết Đô vang thành Si♭, thấp hơn một cung so với nốt viết.
    loai: quy-tac
    nguon:
      - vsl-trumpet-c
      - cod-trumpet
    ket_qua: dung
    ghi_chu: 'VSL: "Bb trumpet: Sounds a major second lower than written." COD: Bb transposing instrument, C trumpet "a tone higher".'
  - id: n10
    cau: Âm vực viết của trumpet khoảng Fa♯3 đến Đô6.
    loai: so-lieu
    nguon:
      - vsl-trumpet-c
      - cod-trumpet
    ket_qua: dung
    ghi_chu: 'VSL, trumpet in C (không dịch giọng nên âm viết = âm thật): "F#3 - C6 (occasionally F6)". Âm vực viết của trumpet Si♭ cùng khoảng (trang VSL về Si♭ chưa mở riêng); COD ghi "compass from e upwards for nearly 3 octaves" (E3, lệch nửa cung ở đáy). Khớp hình ranges-orchestra (F♯3–C6, đã khóa ở dan-nhac) và hồ sơ dan-nhac.'
  - id: n11
    cau: Trumpet đọc khóa Sol.
    loai: dinh-nghia
    nguon:
      - vsl-trumpet-c
    ket_qua: dung
    ghi_chu: 'VSL: "Treble clef".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Trumpet" ]
    luot_2_ghi_chu: Nhạc trumpet viết khóa Sol (chuyển tông Si♭ phổ biến). Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n12
    cau: Trumpet Đô không dịch giọng, vang đúng nốt viết.
    loai: dinh-nghia
    nguon:
      - vsl-trumpet-c
      - cod-trumpet
    ket_qua: da-sua
    ghi_chu: 'VSL: "Non-transposing. Written pitch equals sounding pitch"; COD: "non-transposing in C". Giữ. Chữ cũ còn có "dùng nhiều trong dàn nhạc giao hưởng chuyên nghiệp": đã bỏ (a13).'
  - id: n13
    cau: Trumpet Đô được dùng nhiều trong dàn nhạc giao hưởng chuyên nghiệp.
    loai: dinh-nghia
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang: VSL (trang brass và trumpet in C) không so sánh mức dùng trong dàn nhạc; COD chỉ nói trumpet dùng trong dàn nhạc nói chung. Không nguồn nào nói trumpet Đô được dùng nhiều trong dàn nhạc chuyên nghiệp.'
  - id: n14
    cau: Trumpet piccolo nhỏ hơn, vang cao hơn trumpet thường khoảng một quãng tám.
    loai: dinh-nghia
    nguon:
      - cod-trumpet
      - vsl-brass
    ket_qua: dung
    ghi_chu: 'COD: "piccolo trumpet; pitched octave higher, and sometimes has 4 valves"; VSL brass: ống piccolo trumpet 65–72 cm so với 114–130 cm của trumpet C/B♭.'
  - id: n15
    cau: Trumpet piccolo Si♭ cao vang cao hơn nốt viết một quãng bảy thứ.
    loai: so-lieu
    nguon:
      - vsl-trumpet-c
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "loại Si♭ phổ biến vang cao hơn nốt viết một quãng 7 thứ". VSL: "the high Bb sounds a minor seventh higher" (còn D trumpet vang cao hơn nốt viết một quãng hai trưởng). Bỏ "phổ biến" (VSL liệt kê D, Eb, E, F, G, Ab và Si♭ cao như các loại ngang nhau, không nói loại nào phổ biến).'
  - id: n16
    cau: Ngày nay nhiều người chơi dùng trumpet piccolo cho các bè trumpet cao vút thời Baroque như Concerto Brandenburg số 2 của Bach, số khác dùng trumpet tự nhiên kiểu cổ.
    loai: lich-su
    nguon:
      - cod-trumpet
      - trumpetstudio
      - imslp-bwv1047
    ket_qua: da-sua
    ghi_chu: 'COD, Trumpet: "Bach trumpet: 19th-cent instr., in D, specially made (with valves) to play high tpt. parts in works of Baroque period"; trumpetstudio.com (bậc 3, giáo viên trumpet): "Modern players may use piccolo trumpets to imitate the original sound"; IMSLP: Brandenburg số 2 có trumpet. Ghi chú: nguồn bậc 2 chỉ có COD (trumpet Bach cao trong Rê); piccolo trumpet gần Brandenburg 2 theo trumpetstudio (bậc 3) và lời khuyên chung. Chấp nhận: câu vừa phải ("thường"). Kiểm mẫu D8 (Claude, chủ repo giao kiểm mẫu, 05/11/2026): chữ cũ "thường được dùng" chỉ nói một lựa chọn; trumpetstudio.com: "Modern performers often use either period instruments or piccolo trumpets to emulate the original natural trumpet''s sound and style". COD không gắn piccolo với bè Baroque. Đổi theo trumpetstudio.'
  - id: n17
    cau: Nguyên bản Concerto Brandenburg số 2 viết cho trumpet tự nhiên không van.
    loai: lich-su
    nguon:
      - cod-trumpet
      - trumpetstudio
      - imslp-bwv1047
    ket_qua: dung
    ghi_chu: 'COD: trumpet có van chỉ từ giữa thế kỷ 19, tác phẩm 1721 (IMSLP) nên bè trumpet viết cho trumpet không van; trumpetstudio.com: "tailored for the Baroque natural trumpet … the clarino register".'
  - id: n18
    cau: Trumpet thuộc bộ kèn đồng, nổi lên nhờ âm sắc sáng, mạnh; có những đoạn trumpet độc tấu, như Promenade mở đầu bản phối Pictures at an Exhibition của Ravel.
    loai: dinh-nghia
    nguon:
      - vsl-brass
      - vsl-trumpet-c
      - wsso-pictures
      - hb-pictures
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đỉnh cao của bộ kèn đồng — các đoạn fanfare, cao trào, và nhiều giai điệu chính hùng tráng". VSL, brass: trumpet có "shallowest mouthpiece" → âm sáng; VSL trang brass không nói trumpet là "đỉnh cao" của bộ kèn đồng, và không nói về fanfare hay giai điệu chính. Đổi thành mô tả có nguồn và ví dụ Promenade (n kế). Dòng này vừa sửa vừa bỏ ("đỉnh cao", "fanfare", "giai điệu chính" bỏ).'
  - id: n19
    cau: Ở thời Baroque, trumpet tự nhiên (không van) chơi các bè cao vút (clarino), như trong Monteverdi và Bach (Concerto Brandenburg số 2); ngày nay các bè này thường được chơi bằng trumpet piccolo hoặc trumpet tự nhiên kiểu cổ.
