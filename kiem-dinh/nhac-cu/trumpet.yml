ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc. Nguồn chính mở được ngày 05/11/2026: Concise Oxford Dictionary of Music (Encyclopedia.com), VSL Academy (đọc qua công cụ đọc web; curl chỉ ra vỏ JavaScript trống), IMSLP, Weakley (University of Florida) cho áp lực môi. Chỗ sửa lớn: mô tả âm sắc (a1, a3), "dịch giọng/phổ biến nhất" (a8), bỏ trumpet Đô "dùng nhiều" (a13), piccolo Si♭ (a15), vai trò dàn nhạc (a18), Baroque (a19: bỏ Handel, Purcell), jazz (a20–a22: bỏ cup, plunger), Kind of Blue (a29), phần "Nếu muốn học" (a33–a39: bỏ 15–20 phút, giá, môi nhanh mỏi; áp lực môi theo nguồn). Chưa quyết: a27 (Tchaikovsky 1812: nghe kèn đồng ở đoạn trận chiến, ket_qua null). Câu về sức khỏe (áp lực môi, a34) xếp quy-tac, cần lượt 2. Mô tả trang (description) đổi theo a1. doi_chu viết tay từ khối của dist/ cũ (dist chưa build lại sau sửa): người giao chạy node tools/chuyen/so-chu.mjs nhac-cu/trumpet --doi-chu sau khi build để đối chiếu; dòng "Opus tập trung vào piano" người giao ghi (dist cũ còn "Opus Zero"). Thuật ngữ trang dùng chưa có bản ghi ở src/data/thuat-ngu.yml (cho D3-L5; không tạo): dịch giọng (transposing), piccolo (trumpet piccolo), van piston, clarino, sordino/mute (chỉ có con-sordino), fanfare, harmon mute, khóa Sol.'
