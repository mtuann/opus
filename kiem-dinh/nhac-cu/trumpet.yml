doi_chu:
  - cu: "Trumpet là giọng lệnh của dàn nhạc: sáng, vang xa, xuyên qua mọi âm thanh khác. Từ tiếng kèn trận thời xưa đến những đoạn cao trào chói lọi trong giao hưởng, trumpet là nhạc cụ của sự hùng tráng — nhưng cũng có thể thủ thỉ rất tình cảm khi chơi nhỏ và dùng sordino (nút bịt)."
    moi: "Trumpet có âm sắc sáng, mạnh và lộng lẫy: kim loại, vang, nổi lên trong dàn nhạc. Từ tiếng kèn trận thời xưa đến những đoạn cao trào trong giao hưởng, trumpet là nhạc cụ của sự hùng tráng — nhưng khi chơi nhỏ, nhất là khi dùng sordino (nút bịt), tiếng kèn cũng có thể nhẹ và tinh tế."
    ly_do: 'n1, n2, n3 (da-sua): theo VSL, COD; bỏ "giọng lệnh", "xuyên qua mọi âm thanh khác", "chói lọi", "thủ thỉ rất tình cảm".'
  - cu: Opus Zero tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc.
    moi: Opus tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc.
    ly_do: Site mới tên Opus (bản trước tên Opus Zero); chữ trong trang theo tên hiện hành. Không phải nhận định về nhạc.
  - cu:
      - "Trumpet là nhạc cụ dịch giọng. Loại phổ biến nhất là trumpet Si♭: nốt viết Đô vang thành Si♭ — thấp hơn một cung so với nốt viết. Âm vực viết khoảng Fa♯3 đến Đô6. Đọc khóa Sol."
      - "Các loại trumpet khác: trumpet Đô (dùng nhiều trong dàn nhạc giao hưởng chuyên nghiệp, vang đúng nốt viết), trumpet piccolo (nhỏ hơn, vang cao hơn trumpet thường khoảng một quãng tám; loại Si♭ phổ biến vang cao hơn nốt viết một quãng 7 thứ) — ngày nay thường dùng để chơi các bè trumpet cao vút thời Baroque như Concerto Brandenburg số 2 của Bach (nguyên bản viết cho trumpet tự nhiên không van)."
    moi:
      - "Hai loại trumpet dùng nhiều nhất là trumpet Si♭ và trumpet Đô. Trumpet Si♭ là nhạc cụ dịch giọng: nốt viết Đô vang thành Si♭ — thấp hơn một cung so với nốt viết. Âm vực viết khoảng Fa♯3 đến Đô6. Đọc khóa Sol."
      - Trumpet Đô không dịch giọng, vang đúng nốt viết. Trumpet piccolo nhỏ hơn, vang cao hơn trumpet thường khoảng một quãng tám (loại Si♭ cao vang cao hơn nốt viết một quãng 7 thứ); ngày nay nhiều người chơi dùng nó cho các bè trumpet cao vút thời Baroque như Concerto Brandenburg số 2 của Bach (nguyên bản viết cho trumpet tự nhiên không van), số khác dùng trumpet tự nhiên kiểu cổ.
    ly_do: 'n8 (da-sua): có trumpet Đô không dịch giọng; "phổ biến nhất" không nguồn.; n12, n13: bỏ "dùng nhiều trong dàn nhạc giao hưởng chuyên nghiệp" (da-bo).; kiểm mẫu D8 (Claude, chủ repo giao, 05/11/2026): n8, n16, n19, n25 sửa theo nguồn (VSL: Si♭ và Đô là hai loại dùng nhiều nhất; trumpetstudio: bè Baroque nay chơi bằng piccolo hoặc trumpet tự nhiên kiểu cổ).'
  - cu:
      - "Dàn nhạc: đỉnh cao của bộ kèn đồng — các đoạn fanfare, cao trào, và nhiều giai điệu chính hùng tráng."
      - "Nhạc Baroque: trumpet tự nhiên (natural trumpet, không van) chơi các bè cao vút (clarino) trong Bach, Handel, Purcell; ngày nay các bè này thường được chơi bằng trumpet piccolo có van."
      - "Jazz: một trong những giọng solo trung tâm (Louis Armstrong, Miles Davis, Dizzy Gillespie) — với các loại sordino tạo âm sắc đa dạng (cup, harmon, plunger)."
    moi:
      - "Dàn nhạc: thuộc bộ kèn đồng, nổi lên nhờ âm sắc sáng, mạnh; có những đoạn trumpet độc tấu, như Promenade mở đầu bản phối Pictures at an Exhibition của Ravel."
      - "Nhạc Baroque: trumpet tự nhiên (natural trumpet, không van) chơi các bè cao vút (clarino), như trong Monteverdi và Bach (Concerto Brandenburg số 2); ngày nay các bè này thường được chơi bằng trumpet piccolo hoặc trumpet tự nhiên kiểu cổ."
      - "Jazz: nhạc cụ solo của nhiều nghệ sĩ lớn (Louis Armstrong, Miles Davis, Dizzy Gillespie), có khi dùng sordino như harmon mute để đổi âm sắc."
