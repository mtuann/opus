nhan_dinh:
  - id: n1
    cau: Violin là giọng cao nhất của bộ dây.
    loai: dinh-nghia
    nguon:
      - cod-violin
      - ph-violin
    ket_qua: dung
    ghi_chu: 'COD: "prin. and treble member of its family"; Philharmonia: "the highest pitched and most agile member of the string family".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Violin" ]
    luot_2_ghi_chu: "'Smallest, and thus highest-pitched instrument (soprano)' trong họ violin. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được)."
  - id: n2
    cau: 'Violin là nhạc cụ đông người chơi nhất trong dàn nhạc: hai bè violin 1 và violin 2 chiếm gần một phần ba số nhạc công.'
    loai: so-lieu
    nguon:
      - ph-violin
    ket_qua: dung
    ghi_chu: 'Philharmonia: "usually sixteen Firsts and fourteen Seconds" (30 người) và "the violin is the most numerous of all the strings"; dàn nhạc giao hưởng đầy đủ 90–100 nhạc công (nhận định d1 của nhac-cu/dan-nhac, đã khóa): 30/100 đến 30/90, tức gần một phần ba. "Đông nhất" theo nghĩa nhạc cụ có nhiều người chơi nhất trong từng bộ, còn bộ dây là bộ đông nhất (dan-nhac).'
  - id: n3
    cau: Violin không có phím đàn (fretless).
    loai: dinh-nghia
    nguon:
      - br-violin
    ket_qua: dung
    ghi_chu: 'Britannica: "the violin has a fretless fingerboard".'
  - id: n4
    cau: Cao độ do ngón tay người chơi quyết định (bấm dây trên cần đàn), nên tiếng violin có thể liền mạch và có rung (vibrato).
    loai: dinh-nghia
    nguon:
      - vsl-violin
      - br-violin
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cao độ hoàn toàn do ngón tay và tai người chơi, nên tiếng violin uốn được như giọng hát: liền, có rung (vibrato), từ thì thầm đến rực rỡ". Chữ mới: "cao độ do ngón tay người chơi quyết định, nên tiếng violin có thể liền mạch và có rung (vibrato)". Lý do: bỏ "và tai", "uốn được như giọng hát", "từ thì thầm đến rực rỡ" (lời văn). VSL: "Pitch alterations are achieved by pressing down the string with the fingertips"; "Vibrato ... fluctuating pitch and loudness ... greater expressiveness".'
  - id: n5
    cau: 'Bốn dây violin lên theo quãng 5: Sol3 – Rê4 – La4 – Mi5.'
    loai: dinh-nghia
    nguon:
      - cod-violin
      - ph-violin
      - vsl-violin
    ket_qua: dung
    ghi_chu: 'COD: "Tuned g d'' a'' e''''"; Philharmonia: "usually tuned to G3, D4, A4, E5"; VSL: dây G từ G3, D từ D4, A từ A4, E từ E5.'
  - id: n6
    cau: Người chơi violin kéo vĩ (arco) hoặc gảy dây bằng ngón (pizzicato).
    loai: dinh-nghia
    nguon:
      - cod-pizzicato
      - vsl-violin
    ket_qua: dung
    ghi_chu: 'COD, pizzicato: "notes on str. instr. are to be prod. by plucking, not bowing"; VSL: "Changing from pizzicato to arco ... bowed (arco) to plucked (pizzicato)".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Violin" ]
    luot_2_ghi_chu: Wikipedia có mục kỹ thuật vĩ và pizzicato. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n7
    cau: Violin có thể chơi hai dây cùng lúc (nốt kép).
    loai: dinh-nghia
    nguon:
      - vsl-violin
    ket_qua: dung
    ghi_chu: 'VSL: "Double stops: Two-part fingering on adjacent strings."'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Violin" ]
    luot_2_ghi_chu: Mục 'Double stops, triple stops, chords and drones'. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n8
    cau: Âm vực thường dùng của violin từ Sol3 đến khoảng La7.
    loai: so-lieu
    nguon:
      - vsl-violin
      - ol-range
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đến khoảng Mi7". Chữ mới: "đến khoảng La7". Lý do: VSL: "Range of the violin: G3 - A7 (harmonic D8)"; Orchestral Library: "G3-A7". Khớp hình âm vực trang nhac-cu/dan-nhac (đã sửa G3–A7).'
  - id: n9
    cau: 'Violin đọc khóa Sol và không phải nhạc cụ dịch giọng: nốt viết sao vang vậy.'
    loai: dinh-nghia
    nguon:
      - vsl-violin
      - ol-range
    ket_qua: dung
    ghi_chu: 'VSL: "The violin is a non-transposing instrument notated in treble clef"; Orchestral Library: "no transposition, excepting scordatura".'
  - id: n10
    cau: Trong dàn nhạc, violin 1 thường chơi bè cao hơn, violin 2 chơi bè thấp hơn.
    loai: dinh-nghia
    nguon:
      - cod-violin
      - ph-violin
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "violin 1 thường giữ giai điệu chính, violin 2 hát bè hoặc đệm". Chữ mới: "violin 1 thường chơi bè cao hơn, violin 2 chơi bè thấp hơn". Lý do: COD: "vns. are divided into ''1sts'' and ''2nds'', corresponding to higher- and lower-pitched parts"; "giai điệu chính" không có nguồn (cùng lý do đã sửa ở nhac-cu/dan-nhac d4).'
  - id: n11
    cau: Người ngồi đầu bè violin 1 (concertmaster) cũng là người đứng đầu nhạc công của cả dàn nhạc.
    loai: dinh-nghia
    nguon:
      - cod-leader
      - ph-violin
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dẫn dắt cả bộ dây". Chữ mới: "cũng là người đứng đầu nhạc công của cả dàn nhạc". Lý do: Philharmonia: "The leader of the First Violins is also the Leader of the Orchestra"; COD, leader: "(Amer. concertmaster; Ger. Konzertmeister). Prin. 1st vn. of sym. orch."; "dẫn dắt cả bộ dây" không có nguồn nói đúng như vậy.'
  - id: n12
    cau: Trong thính phòng, tứ tấu dây có hai violin; có sonata cho violin và piano.
    loai: dinh-nghia
    nguon:
      - cod-violin
      - imslp-spring
      - imslp-kreutzer
    ket_qua: dung
    ghi_chu: 'COD: "Str. qt. has 2 vn. (1st and 2nd)"; IMSLP: sonata cho violin và piano của Beethoven (Op. 24, Op. 47).'
  - id: n13
    cau: Có concerto cho violin từ Vivaldi, Bach đến Mendelssohn, Brahms, Tchaikovsky, Sibelius.
    loai: lich-su
    nguon:
