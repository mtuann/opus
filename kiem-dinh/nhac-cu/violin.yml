      - imslp-bach-vn-conc
      - imslp-mendelssohn
      - imslp-brahms-vc
      - imslp-tchai
      - imslp-sibelius
    ket_qua: dung
    ghi_chu: 'IMSLP: Vivaldi, Il cimento dell''armonia e dell''inventione, Op. 8 (concerto cho violin); Bach, 2 Violin Concertos BWV 1041–1042; Mendelssohn Op. 64; Brahms Op. 77; Tchaikovsky Op. 35; Sibelius Op. 47.'
  - id: n14
    cau: 'Bach: Sonatas & Partitas cho violin độc tấu (BWV 1001–1006).'
    loai: danh-muc
    nguon:
      - imslp-bach-vn
    ket_qua: dung
    ghi_chu: 'IMSLP: 3 sonatas, 3 partitas, violin, BWV 1001–1006.'
