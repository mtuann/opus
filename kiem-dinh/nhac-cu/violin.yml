  - id: n26
    cau: Nên học violin với giáo viên ngay từ đầu nếu có điều kiện.
    loai: khuyen-tap
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Rất nên có giáo viên ở giai đoạn đầu để cầm đàn và cầm vĩ đúng; thói quen sai sửa về sau rất khó." Chữ mới: "Nên học với giáo viên ngay từ đầu nếu có điều kiện." Lý do: bỏ "thói quen sai sửa về sau rất khó" và chi tiết cầm đàn đúng (tư thế: không tìm được nguồn y khoa hay giáo viên mở được; trang của Johnson String bị chặn).'
  - id: n27
