khuong_nhac: []
ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc. Nguồn chính: COD (Encyclopedia.com: violin, pizzicato, leader), Philharmonia Orchestra, VSL Academy, Orchestral Library, Britannica (qua Wayback; fretless, tiểu sử nghệ sĩ); IMSLP cho số hiệu tác phẩm; IRCAM cho Pärt; Alfred Music cho giáo trình. Chỗ sửa trang (da-sua): n4, n8, n10, n11, n26, n27; mục "Violin và piano ngang hàng" đổi nhãn thành "Sonata cho violin và piano" (khối này không tách thành nhận định riêng; ghi ở doi_chu). Câu ve-site: n17, n18, n24, n28, n29, n30, n31 (nghe-nhac/vivaldi-mua-xuan, mendelssohn-violin, part-spiegel chưa chuyển nên là "sắp có"; luyen-tap/hat-lai và nhac-cu/index chưa khóa nên "sắp có" ở bản thật). Lời khuyên học: chỉ giữ "nên học với giáo viên nếu có điều kiện" (khuyen-tap); bỏ "thói quen sai sửa về sau rất khó" và cách cầm đàn (tư thế, không tìm được nguồn). Thuật ngữ trang dùng: pizzicato, arco đã có ở src/data/thuat-ngu.yml; chưa có bản ghi cho D3-L5: vibrato, nốt kép (double stop), nhạc cụ dịch giọng (transposing instrument), concertmaster, caprice.'
doi_chu:
  - cu: "Opus Zero tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    moi: "Opus tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    ly_do: "Site mới tên Opus (bản trước tên Opus Zero); chữ trong trang theo tên hiện hành. Không phải nhận định về nhạc."
  - cu: 'Violin là giọng cao nhất của bộ dây và là nhạc cụ đông người chơi nhất trong dàn nhạc: hai bè violin 1 và violin 2 chiếm gần một phần ba số nhạc công. Đàn không có phím, cao độ hoàn toàn do ngón tay và tai người chơi, nên tiếng violin uốn được như giọng hát: liền, có rung (vibrato), từ thì thầm đến rực rỡ.'
    moi: 'Violin là giọng cao nhất của bộ dây và là nhạc cụ đông người chơi nhất trong dàn nhạc: hai bè violin 1 và violin 2 chiếm gần một phần ba số nhạc công. Đàn không có phím, cao độ do ngón tay người chơi quyết định, nên tiếng violin có thể liền mạch và có rung (vibrato).'
    ly_do: 'n4 (da-sua): bỏ "và tai", "uốn được như giọng hát", "từ thì thầm đến rực rỡ" (lời văn; theo VSL, Britannica).'
  - cu: 'Bốn dây lên theo quãng 5: Sol3 – Rê4 – La4 – Mi5. Người chơi kéo vĩ (arco) hoặc gảy dây bằng ngón (pizzicato), và có thể chơi hai dây cùng lúc (nốt kép). Âm vực thường dùng từ Sol3 đến khoảng Mi7. Violin đọc khóa Sol và không phải nhạc cụ dịch giọng: nốt viết sao vang vậy.'
    moi: 'Bốn dây lên theo quãng 5: Sol3 – Rê4 – La4 – Mi5. Người chơi kéo vĩ (arco) hoặc gảy dây bằng ngón (pizzicato), và có thể chơi hai dây cùng lúc (nốt kép). Âm vực thường dùng từ Sol3 đến khoảng La7. Violin đọc khóa Sol và không phải nhạc cụ dịch giọng: nốt viết sao vang vậy.'
    ly_do: 'n8 (da-sua): âm vực đến La7 theo VSL và Orchestral Library (cũ ghi Mi7).'
  - cu: 'Dàn nhạc: violin 1 thường giữ giai điệu chính, violin 2 hát bè hoặc đệm. Người ngồi đầu bè violin 1 (concertmaster) dẫn dắt cả bộ dây.'
    moi: 'Dàn nhạc: violin 1 thường chơi bè cao hơn, violin 2 chơi bè thấp hơn. Người ngồi đầu bè violin 1 (concertmaster) cũng là người đứng đầu nhạc công của cả dàn nhạc.'
    ly_do: 'n10, n11 (da-sua): theo COD, Philharmonia; không có nguồn cho "giai điệu chính" và "dẫn dắt cả bộ dây".'
  - cu: 'Violin và piano ngang hàng: sonata "Mùa xuân" Op. 24 và "Kreutzer" Op. 47 của Beethoven, Sonata cung La trưởng của César Franck; và Spiegel im Spiegel của Pärt.'
    moi: 'Sonata cho violin và piano: sonata "Mùa xuân" Op. 24 và "Kreutzer" Op. 47 của Beethoven, Sonata cung La trưởng của César Franck; và Spiegel im Spiegel của Pärt.'
    ly_do: '(không tách thành nhận định riêng; đổi nhãn): "ngang hàng" là nhận xét không kiểm được, thay bằng tên thể loại.'
  - cu: Rất nên có giáo viên ở giai đoạn đầu để cầm đàn và cầm vĩ đúng; thói quen sai sửa về sau rất khó. Giáo trình phổ biến nhất là Suzuki Violin School. Máy lên dây của site có chế độ violin. Xem thêm vị trí violin trong dàn nhạc giao hưởng.
    moi: Nên học với giáo viên ngay từ đầu nếu có điều kiện. Suzuki Violin School là một bộ giáo trình violin của nhà xuất bản Alfred. Máy lên dây của site có chế độ violin. Xem thêm vị trí violin trong dàn nhạc giao hưởng.
    ly_do: 'n26, n27 (da-sua): bỏ "thói quen sai sửa về sau rất khó" và chi tiết cầm đàn (không có nguồn); "phổ biến nhất" không có số liệu.'
