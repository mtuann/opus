nhan_dinh:
  - id: n1
    cau: Guitar cổ điển dùng dây nylon.
    loai: dinh-nghia
    nguon:
      - br-guitar
      - tcg
    ket_qua: dung
    ghi_chu: 'Britannica: guitar cổ điển "strung with three gut and three metal-spun silk strings. Nylon or other plastic was later used in place of gut"; This Is Classical Guitar: "Classical guitars use nylon strings".'
  - id: n2
    cau: Các dây của guitar cổ điển cách xa nhau hơn (cần đàn rộng hơn) guitar dây sắt.
    loai: dinh-nghia
    nguon:
      - tcg
      - yamaha-cg-co-cau
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: chỉ có nguồn bậc 3. Chữ cũ: "cần đàn rộng hơn guitar dây sắt". Chữ mới: "các dây cách xa nhau hơn (cần đàn rộng hơn) guitar dây sắt". Lý do: This Is Classical Guitar: classical guitars "have wider spaced strings", còn steel-string "closer spacing". Nguồn bậc 3 (trang của giáo viên guitar): bổ trợ, không có nguồn bậc 2 mở được nói số đo cần đàn. Chữ mới chỉ thêm chi tiết (khoảng cách dây), nghĩa không đổi. Review D8-gom: Yamaha (hãng đàn, bậc 2): "Nylon strings … require sufficient space between strings … The neck of the guitar is wider than usual"; cần đàn guitar cổ điển 52 mm, guitar acoustic 43 mm. Giữ chữ.'
  - id: n3
    cau: Guitar cổ điển thường gảy bằng ngón tay thay vì phím gảy.
    loai: dinh-nghia
    nguon:
      - tcg
      - yamaha-cg-choi
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: chỉ có nguồn bậc 3 (câu "thường gảy bằng ngón tay" hiển nhiên đúng với guitar cổ điển, nhưng chưa có nguồn bậc 1–2 mở được). Chữ cũ: "có kỹ thuật tay phải riêng: gảy bằng ngón tay và móng, không dùng phím gảy". Chữ mới: "thường gảy bằng ngón tay thay vì phím gảy". Lý do: This Is Classical Guitar: nylon strings "plucked by the fingers", steel-string "optimal use of a right hand pick". Bỏ "móng" (không có nguồn mở nói về móng) và "kỹ thuật tay phải riêng"; "không dùng" đổi thành "thường". Review D8-gom: Yamaha: "Classical guitars are generally played with fingers-not picks". Giữ chữ.'
  - id: n4
    cau: Guitar đọc khóa Sol.
    loai: dinh-nghia
    nguon:
      - siccas-notation
      - omt-reading-clefs
    ket_qua: dung
    ghi_chu: 'chưa chắc: Sicca''s Guitars (cửa hàng, nguồn bậc 3): "Classical guitar uses standard Western notation written on the treble clef". Không có nguồn bậc 2 mở được nói "khóa Sol" riêng cho guitar; nhưng khớp Orchestral Library (âm vực viết E3–E6, nằm trên và quanh khuông khóa Sol). Chưa chắc ở mức bậc 2. Review D8-gom: Open Music Theory, Reading Clefs (bậc 2, như hồ sơ luyen-tap/choi-theo n8 review D7-gom): "Music for tenor vocalists, guitarists, and bassists often uses the octave treble clef" (khóa Sol, âm thật thấp một quãng tám). Giữ chữ.'
  - id: n5
    cau: Âm thanh thật của guitar thấp hơn một quãng tám so với nốt viết.
    loai: dinh-nghia
    nguon:
      - ol-range
      - siccas-notation
    ket_qua: dung
    ghi_chu: 'Orchestral Library: "Guitar E3-E6 1 octave lower" (âm vực viết E3–E6, âm thật thấp hơn một quãng tám); COD, guitar: dây tuần tự "E–A–d–g–b–e′" (E2 đến E4 thật). Sicca''s: "the classical guitar sounds one octave lower than written" (trang này còn ghi E2 viết thành E1 sai số quãng tám, nên không dùng phần ấy).'
  - id: n6
    cau: 'Francisco Tárrega: Recuerdos de la Alhambra.'
    loai: ten
    nguon:
      - imslp-tarrega
    ket_qua: dung
    ghi_chu: 'IMSLP: Recuerdos de la Alhambra, Tárrega, guitar, 1899. Britannica, guitar: "Modern classical-guitar technique owes much to the Spaniard Francisco Tárrega (1852–1909)".'
  - id: n7
    cau: 'Albéniz: Asturias vốn là một bản piano.'
    loai: lich-su
    nguon:
      - imslp-albeniz
    ket_qua: dung
    ghi_chu: 'IMSLP: Suite española, Op.47 (Albéniz) cho piano ("Instrumentation piano"); mục "Asturias (No.5)" nằm trong bộ này và có nhiều bản chuyển soạn "For Guitar" (Schlieder Mariscal, Zamani, García Fortea).'
  - id: n8
    cau: Asturias có nhiều bản chuyển soạn cho guitar.
    loai: lich-su
    nguon:
      - imslp-albeniz
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nay nổi tiếng nhất ở dạng chuyển soạn cho guitar". Chữ mới: "nay có nhiều bản chuyển soạn cho guitar". Lý do: "nổi tiếng nhất" không kiểm được; IMSLP liệt kê ít nhất ba bản chuyển soạn cho guitar của Asturias (No.5).'
  - id: n9
    cau: 'Joaquín Rodrigo: Concierto de Aranjuez (cho guitar và dàn nhạc).'
    loai: ten
    nguon:
      - rodrigo-eamdc
    ket_qua: dung
    ghi_chu: 'Trang Schott (EAMDC): "Concierto de Aranjuez, for guitar and orchestra", sáng tác 1939, ra mắt 9/11/1940 (Barcelona) với Regino Sainz de la Maza.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Concierto_de_Aranjuez" ]
    luot_2_ghi_chu: Rodrigo, 1939, guitar cổ điển và dàn nhạc. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n10
    cau: 'Heitor Villa-Lobos: 5 Préludes.'
    loai: ten
    nguon:
      - imslp-villa
    ket_qua: dung
    ghi_chu: 'IMSLP: Preludes, W419 (Villa-Lobos): "5 pieces (originally 6)", cho guitar, 1940.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Heitor_Villa-Lobos" ]
    luot_2_ghi_chu: 5 Preludes (1940) cho guitar. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n11
    cau: 'Agustín Barrios Mangoré: La Catedral.'
    loai: ten
    nguon:
      - imslp-barrios
    ket_qua: dung
    ghi_chu: 'IMSLP: La catedral (Barrios Mangoré), cho guitar; ghi chú trang: soạn lần đầu 1921 ở Montevideo.'
  - id: n12
    cau: Fernando Sor viết các étude cho guitar.
    loai: lich-su
    nguon:
      - imslp-sor6
      - br-guitar
    ket_qua: dung
    ghi_chu: 'IMSLP: 12 Etudes, Op.6 (Sor), cho guitar; Britannica: Sor (1778–1839) là một trong số ít nghệ sĩ guitar nổi tiếng ở châu Âu thế kỷ 19; COD: "first great virtuoso of int. fame was Fernando Sor".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Fernando_Sor" ]
    luot_2_ghi_chu: Sor viết các Studies Op. 6, Op. 29, Op. 31, Op. 35 cho guitar. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n13
    cau: Bach viết các tổ khúc cho đàn lute; có bản chơi trên guitar.
    loai: lich-su
    nguon:
      - imslp-lute
      - br-guitar
      - imslp-bwv996
    ket_qua: dung
    ghi_chu: 'chưa chắc: IMSLP: Kompositionen für Lauteninstrumente, BWV 995–1000, 1006a (Bach): Suite g-Moll BWV 995, e-Moll BWV 996, c-Moll BWV 997…, cho lute; Britannica: Tárrega "transcriptions of works by Bach, Mozart, and other composers formed the basis of the concert repertory" (cách chuyển soạn Bach cho guitar). Trang không nói bản cho guitar của riêng tổ khúc nào. Review D8-gom: IMSLP BWV 996: nhạc cụ "lute (or lute-harpsichord)", thuộc "Lute Works by Johann Sebastian Bach"; mục chuyển soạn có "For Guitar" (Apke và các bản khác). Câu trang "(bản cho guitar)" đúng.'
  - id: n14
    cau: Segovia, Bream, John Williams, Ana Vidović, Marcin Dylla là nghệ sĩ guitar cổ điển.
    loai: ten
    nguon:
      - br-segovia
      - br-bream
      - cod-guitar
      - anavidovic
      - dylla
    ket_qua: dung
    ghi_chu: 'Britannica: Segovia "foremost guitarist of his time", Bream "English guitarist and lutenist"; COD, guitar: "virtuosi such as Segovia, John Williams, and Julian Bream"; trang nghệ sĩ Ana Vidović và Marcin Dylla ("classical guitar").'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Andr%C3%A9s_Segovia", "https://en.wikipedia.org/wiki/Julian_Bream", "https://en.wikipedia.org/wiki/Ana_Vidovi%C4%87", "https://en.wikipedia.org/wiki/Marcin_Dylla" ]
    luot_2_ghi_chu: Cả năm đều được Wikipedia xếp là guitarist cổ điển (Segovia, Bream, J. Williams, Vidović, Dylla). Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n15
    cau: John Williams là nghệ sĩ guitar, không phải nhà soạn nhạc phim cùng tên.
    loai: ten
    nguon:
      - cod-guitar
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(nghệ sĩ guitar người Úc, không phải nhà soạn nhạc phim)". Chữ mới: "(nghệ sĩ guitar, không phải nhà soạn nhạc phim cùng tên)". Lý do: bỏ "người Úc": quốc tịch chỉ có trong nguồn bậc 3 (Wikipedia), không mở được nguồn bậc 1–2. COD: John Williams trong danh sách guitarist.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/John_Williams_(guitarist)" ]
    luot_2_ghi_chu: John Williams (guitar, sinh 1941 ở Melbourne) là người khác nhà soạn nhạc phim cùng tên. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n16
    cau: 'Nên chọn guitar cổ điển dây nylon, không phải guitar acoustic dây sắt: dây và cần đàn khác nhau.'
    loai: quy-tac
    nguon:
      - tcg
      - br-guitar
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cần đàn và kỹ thuật khác hẳn". Chữ mới: "dây và cần đàn khác nhau". Lý do: "kỹ thuật khác hẳn" nói quá (This Is Classical Guitar: hai loại "can be played in similar ways" và có cùng cách lên dây); phần nylon, dây cách nhau rộng hơn đúng theo nguồn.'
  - id: n17
    cau: Frederick Noad, Solo Guitar Playing, là giáo trình guitar cổ điển.
    loai: ten
    nguon:
      - hl-noad
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giáo trình phổ biến". Chữ mới: "Giáo trình và bài luyện". Lý do: "phổ biến" không có số liệu. Hal Leonard (Music Sales America): "Frederick Noad ... Solo Guitar Playing ... thorough instruction in every phase of classical guitar playing".'
  - id: n18
    cau: Carcassi, Sor và Giuliani có các bài luyện cho guitar.
    loai: ten
    nguon:
      - imslp-carcassi
      - imslp-sor6
      - imslp-giuliani
    ket_qua: dung
    ghi_chu: 'IMSLP: Carcassi, Etudes Op.60 (25 studies); Sor, 12 Etudes Op.6; Giuliani, Studio per la chitarra Op.1 (1812). Tên Giuliani 120 right-hand studies (Op. 1a) không có trên trang IMSLP mở được; trang chỉ nói chung "các bài luyện của Giuliani".'
  - id: n19
    cau: Nên học guitar với giáo viên ngay từ đầu nếu có điều kiện.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "Nên học với thầy để có tư thế ngồi và kỹ thuật tay phải đúng ngay từ đầu." Chữ mới: "Nên học với giáo viên ngay từ đầu nếu có điều kiện." Lý do: bỏ "tư thế ngồi" và "kỹ thuật tay phải đúng" (dính tư thế, không tìm được nguồn y khoa hay giáo viên đã mở); "thầy" đổi thành "giáo viên" cho khớp các trang cùng loạt. Review D8-gom: như cello n26.'
  - id: n20
    cau: Máy lên dây của site có chế độ guitar.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trong mã: src/scripts/so-cao-do.js, bảng DAY.guitar (Mi E2, La A2, Rê D3, Sol G3, Si B3, Mi E4) và ô chọn "Guitar" (dòng 47); trang src/content/docs/luyen-tap/hat-lai.md mục "Máy lên dây" (id may-len-day) viết "chọn nhạc cụ (violin hoặc guitar)", giống trang cũ ../opus-zero/docs/luyen-tap/hat-lai.md. luyen-tap/hat-lai chưa khóa: ở bản thật link hiện "sắp có" cho tới khi trang ấy khóa. Giữ: id #may-len-day ở trang đích. Review D8-gom: src/scripts/so-cao-do.js: DAY.guitar và ô chọn "Guitar" (dòng 47); luyen-tap/hat-lai.md mục { #may-len-day }.'
    review: dung
  - id: n21
    cau: Opus tập trung vào piano; trang này thuộc phần nghe; xem Nhạc cụ trong dàn nhạc (/opus/nhac-cu/).
