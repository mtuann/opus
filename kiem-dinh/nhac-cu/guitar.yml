ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc. Nguồn chính: Britannica (guitar, Segovia, Bream; qua Wayback), COD (guitar), Orchestral Library (âm vực viết và âm thật), IMSLP (tác phẩm, số hiệu), trang Schott (Rodrigo), Hal Leonard (Noad), trang nghệ sĩ; bậc 3 (bổ trợ, kèm nguồn khác): This Is Classical Guitar (giáo viên), Sicca''s Guitars (cửa hàng; dùng cho "khóa Sol"). Chỗ sửa trang: n2, n3 (đã sửa nhưng chưa chắc), n8, n15, n16, n17, n19 (da-sua); xem doi_chu. Lời khuyên học: bỏ "tư thế ngồi và kỹ thuật tay phải đúng ngay từ đầu" (tư thế; không có nguồn). Chưa chắc (ket_qua null): n2 và n3 (cần đàn rộng hơn, gảy bằng ngón tay) chỉ có nguồn bậc 3 (This Is Classical Guitar); n4 ("guitar đọc khóa Sol") chỉ có Sicca''s Guitars (bậc 3) cộng suy luận từ âm vực viết E3–E6 của Orchestral Library; n13 (Bach lute): trang nói "các tổ khúc cho đàn lute (bản cho guitar)", IMSLP xác nhận tổ khúc lute của Bach và Britannica nói Tárrega chuyển soạn Bach, nhưng không nguồn nào liệt kê bản guitar của đúng các tổ khúc lute. Câu ve-site: n20 (máy lên dây: so-cao-do.js và hat-lai; hat-lai chưa khóa nên "sắp có" ở bản thật), n21, n22. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có bản ghi, cho D3-L5: étude (đã có tên étude), chuyển soạn (transcription/arrangement), nhạc cụ dịch giọng (transposing instrument).'
doi_chu:
  - cu: "Opus Zero tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    moi: "Opus tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    ly_do: "Site mới tên Opus (bản trước tên Opus Zero); chữ trong trang theo tên hiện hành. Không phải nhận định về nhạc."
  - cu: 'mô tả: Guitar cổ điển dùng dây nylon, cần đàn rộng hơn guitar dây sắt, và có kỹ thuật tay phải riêng: gảy bằng ngón tay và móng, không dùng phím gảy. Lưu ý: guitar…'
    moi: 'mô tả: Guitar cổ điển dùng dây nylon, các dây cách xa nhau hơn (cần đàn rộng hơn) guitar dây sắt, và thường gảy bằng ngón tay thay vì phím gảy. Lưu ý: guitar…'
    ly_do: 'n2, n3 (da-sua): mô tả đổi theo câu mở đầu (bỏ "móng" và "kỹ thuật tay phải riêng").'
  - cu: 'Guitar cổ điển dùng dây nylon, cần đàn rộng hơn guitar dây sắt, và có kỹ thuật tay phải riêng: gảy bằng ngón tay và móng, không dùng phím gảy. Lưu ý: guitar đọc khóa Sol nhưng âm thanh thật thấp hơn một quãng tám so với nốt viết.'
    moi: 'Guitar cổ điển dùng dây nylon, các dây cách xa nhau hơn (cần đàn rộng hơn) guitar dây sắt, và thường gảy bằng ngón tay thay vì phím gảy. Lưu ý: guitar đọc khóa Sol nhưng âm thanh thật thấp hơn một quãng tám so với nốt viết.'
    ly_do: 'n2, n3 (da-sua): This Is Classical Guitar, Britannica; "móng" và "kỹ thuật tay phải riêng" không có nguồn.'
  - cu: 'Isaac Albéniz: Asturias (vốn là một bản piano, nay nổi tiếng nhất ở dạng chuyển soạn cho guitar)'
    moi: 'Isaac Albéniz: Asturias (vốn là một bản piano, nay có nhiều bản chuyển soạn cho guitar)'
    ly_do: 'n8 (da-sua): "nổi tiếng nhất" không kiểm được; IMSLP liệt kê nhiều bản chuyển soạn.'
  - cu: Andrés Segovia, Julian Bream, John Williams (nghệ sĩ guitar người Úc, không phải nhà soạn nhạc phim), Ana Vidović, Marcin Dylla.
    moi: Andrés Segovia, Julian Bream, John Williams (nghệ sĩ guitar, không phải nhà soạn nhạc phim cùng tên), Ana Vidović, Marcin Dylla.
    ly_do: 'n15 (da-sua): bỏ "người Úc" (chỉ có nguồn bậc 3).'
  - cu: 'Chọn guitar cổ điển dây nylon, không phải guitar acoustic dây sắt: cần đàn và kỹ thuật khác hẳn. Giáo trình phổ biến: Frederick Noad Solo Guitar Playing, các bài luyện của Carcassi, Sor và Giuliani. Nên học với thầy để có tư thế ngồi và kỹ thuật tay phải đúng ngay từ đầu. Máy lên dây của site có chế độ guitar.'
    moi: 'Chọn guitar cổ điển dây nylon, không phải guitar acoustic dây sắt: dây và cần đàn khác nhau. Giáo trình và bài luyện: Frederick Noad, Solo Guitar Playing; các bài luyện của Carcassi, Sor và Giuliani. Nên học với giáo viên ngay từ đầu nếu có điều kiện. Máy lên dây của site có chế độ guitar.'
    ly_do: 'n16, n17, n19 (da-sua): "khác hẳn" và "phổ biến" không có nguồn; bỏ tư thế ngồi và kỹ thuật tay phải đúng (không có nguồn).'
