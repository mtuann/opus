nhan_dinh:
  - id: n1
    cau: Clarinet là một nhạc cụ bộ kèn gỗ, dùng dăm đơn.
    loai: dinh-nghia
    nguon:
      - cod-clarinet
      - br-clarinet
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Clarinet là nhạc cụ đa tính cách nhất bộ kèn gỗ … Một cây kèn mà như ba nhạc cụ trong một." Chữ mới: "Clarinet là một nhạc cụ bộ kèn gỗ, có ba âm vực mang tên riêng…". Lý do: "đa tính cách nhất" là so sánh tuyệt đối không có nguồn; "một cây kèn mà như ba nhạc cụ" là lời văn. COD: "Single-reed woodwind instr."; Britannica: single reed. Mô tả (description) đổi theo.'
  - id: n2
    cau: 'Clarinet có ba âm vực mang tên riêng: chalumeau (trầm), clarion (giữa), altissimo (cao).'
    loai: dinh-nghia
    nguon:
      - wfg-clarinet
      - cod-chalumeau
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ kèm tính từ về âm sắc từng âm vực: "dày và bí ẩn", "sáng và hát", "sắc và chói". Chữ mới chỉ giữ tên và vị trí. Lý do: các tính từ không có nguồn mở được nói đúng như vậy. Woodwind Fingering Guide: bảng bấm chia "Chalumeau, Clarion, Lower Altissimo, Upper Altissimo"; COD, chalumeau: "Term used to describe lowest register of cl.".'
  - id: n3
    cau: Âm vực chalumeau của clarinet từ nốt thấp nhất lên khoảng Si4 (nốt viết).
    loai: so-lieu
    nguon:
      - wfg-clarinet
      - ol-range
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ấm, dày, hơi u ám" (lời văn, bỏ). Chữ mới: giới hạn âm vực. Woodwind Fingering Guide: "Chalumeau E 3 to B 4" (chữ trang không hiện dấu hóa; thực tế là Si♭4, nên "khoảng Si4" là xấp xỉ); Orchestral Library: nốt thấp nhất E3.'
  - id: n4
    cau: Âm vực clarion của clarinet từ khoảng Si4 đến khoảng Đô6.
    loai: so-lieu
    nguon:
      - wfg-clarinet
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "sáng, rõ — âm vực ''hát'' chính" (lời văn, bỏ). Chữ mới: giới hạn âm vực. Woodwind Fingering Guide: "Clarion B 4 to C 6".'
  - id: n5
    cau: Âm vực altissimo của clarinet từ khoảng Đô6 trở lên.
    loai: so-lieu
    nguon:
      - wfg-clarinet
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "sắc, xuyên thấu" (lời văn, bỏ). Chữ mới: giới hạn âm vực. Woodwind Fingering Guide: "Lower Altissimo C 6 to G 6", "Upper Altissimo G 6 to A 7".'
  - id: n6
    cau: 'Clarinet dùng dăm đơn: một miếng dăm mỏng rung khi hơi thổi qua.'
    loai: dinh-nghia
    nguon:
      - cod-clarinet
      - br-clarinet
    ket_qua: dung
    ghi_chu: 'COD: "Single-reed woodwind instr."; Britannica: mouthpiece "over which a single reed, made from natural cane, is secured by a screw clip, or ligature". "Rung khi hơi thổi qua" là mô tả chung về dăm.'
  - id: n7
    cau: Người chơi clarinet điều khiển cao độ bằng hệ thống khóa và lỗ bấm.
    loai: dinh-nghia
    nguon:
      - br-clarinet
    ket_qua: dung
    ghi_chu: 'Britannica: "its notes, made with the finger holes and key mechanism, sound a step lower than written".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Clarinet" ]
    luot_2_ghi_chu: Clarinet dùng hệ thống khóa và lỗ bấm (tone holes) để đổi cao độ. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n8
    cau: Clarinet là nhạc cụ dịch giọng.
    loai: dinh-nghia
    nguon:
      - cod-transposing
      - cod-clarinet
    ket_qua: dung
    ghi_chu: 'COD: "transposing instruments ... cl. in B♭ and A ..."; "the B♭ clarinet is a transposing instr.".'
  - id: n9
    cau: 'Clarinet Si♭ là loại phổ biến nhất: nốt viết Đô vang thành Si♭, thấp hơn một cung (quãng 2 trưởng) so với nốt viết.'
    loai: dinh-nghia
    nguon:
      - cod-clarinet
      - cod-transposing
      - br-clarinet
    ket_qua: dung
    ghi_chu: 'COD: "The B♭ clarinet is a transposing instr., sounding a tone lower than written"; COD, transposing: "B♭ and A being the most often used"; Britannica: "tuned in B♭ ... sound a step lower than written".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Clarinet" ]
    luot_2_ghi_chu: "Clarinet Si♭ là loại phổ biến nhất; các nốt đọc Đô vang Si♭, thấp hơn một cung (Wikipedia: nhạc cho clarinet A chuyển tông lên một cung). Đúng chiều."
  - id: n10
    cau: Clarinet La vang thấp hơn quãng 3 thứ so với nốt viết.
    loai: dinh-nghia
    nguon:
      - cod-clarinet
      - cod-transposing
    ket_qua: dung
    ghi_chu: 'COD: "The A clarinet sounds a minor 3rd lower than written."'
  - id: n11
    cau: Clarinet La hợp với bản nhạc có nhiều dấu thăng.
    loai: quy-tac
    nguon:
      - cod-transposing
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Loại clarinet La (dùng nhiều trong nhạc Mozart, Brahms)". Chữ mới: "(hợp với bản nhạc có nhiều dấu thăng)". Lý do: "dùng nhiều trong nhạc Mozart, Brahms" không có nguồn mở nói trực tiếp (Britannica chỉ ghi Mozart, Brahms trong danh sách nhân vật chính của mục clarinet). COD, transposing instruments: kèn B♭ và A có để giảm số dấu giáng và dấu thăng; "with the A instrument a piece written in the key of B is notated in the key of D, i.e. 3 sharps fewer". Review D8-gom: giữ chữ. COD, Transposing instruments (lượt 1 đã mở, bậc 2): "with the A instrument a piece written in the key of B is notated in the key of D, i.e. 3 sharps fewer": kèn La làm bớt dấu thăng khi viết, nên hợp với bản nhạc nhiều dấu thăng. VSL và COD (mục Clarinet) chỉ nói ba loại kèn để chơi được mọi giọng, không trái.'
    luot_2: khong-chac
    luot_2_ghi_chu: Quy ước 'clarinet La cho nhiều dấu thăng' phổ biến trong phối khí nhưng chưa mở được nguồn bậc 2 nói đúng thế.
  - id: n12
    cau: Bản nhạc clarinet được viết theo loại kèn sẽ dùng; âm thanh thực tế trầm hơn nốt viết (ở kèn Si♭ và La).
    loai: dinh-nghia
    nguon:
      - cod-transposing
      - br-clarinet
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Người chơi clarinet đọc bản nhạc viết riêng cho loại kèn của mình". Chữ mới: "Bản nhạc clarinet được viết theo loại kèn sẽ dùng". Lý do: Britannica ghi ngoại lệ (ở Ý, nhạc công dàn nhạc chuyển bản La sang kèn Si♭), nên "viết riêng… của mình" nói quá. COD, transposing: nhạc cho kèn B♭ viết cao hơn âm thật một cung, kèn A cao hơn một quãng 3 thứ.'
  - id: n13
    cau: Âm vực viết của clarinet khoảng Mi3 đến Đô7 (vang thấp hơn tùy loại kèn).
    loai: so-lieu
    nguon:
      - ol-range
      - wfg-clarinet
    ket_qua: dung
    ghi_chu: 'Orchestral Library: "Clarinets (Bb-Eb-A) E3-C7"; Woodwind Fingering Guide: bảng bấm đến A7 (nốt rất cao, ít dùng).'
  - id: n14
    cau: Clarinet đọc khóa Sol.
    loai: dinh-nghia
    nguon:
      - cod-clarinet
    ket_qua: dung
    ghi_chu: 'COD: "clarinet in C, B♭, or A—the normal treble instr." và nhạc kèn bass viết ở "treble clef"; khóa Sol là khóa của nhạc clarinet thông thường.'
  - id: n15
    cau: Mở đầu Rhapsody in Blue của Gershwin là tiếng clarinet vuốt lên (glissando).
    loai: lich-su
    nguon:
      - isy-rhapsody
    ket_qua: dung
    ghi_chu: 'Indianapolis Symphony: "The iconic opening clarinet glissando (a slide from a low pitch to a high one)".'
  - id: n16
    cau: Mở đầu Rhapsody in Blue là một đoạn độc tấu clarinet nổi tiếng trong nhạc dàn nhạc.
    loai: lich-su
    nguon:
      - isy-rhapsody
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cầu nối giữa kèn gỗ và kèn đồng; nhiều đoạn độc tấu nổi tiếng (mở đầu Rhapsody in Blue…)". Chữ mới: "một đoạn độc tấu nổi tiếng là mở đầu Rhapsody in Blue…". Lý do: bỏ "cầu nối giữa kèn gỗ và kèn đồng" (nhận xét không kiểm được, cùng lý do d14 của nhac-cu/dan-nhac) và "nhiều đoạn" (chỉ có một ví dụ có nguồn). Indianapolis Symphony: "The iconic opening clarinet glissando".'
  - id: n17
    cau: Mozart viết tam tấu clarinet–viola–piano K. 498 (Kegelstatt).
    loai: danh-muc
    nguon:
      - imslp-mozart-498
    ket_qua: dung
    ghi_chu: 'IMSLP: "Clarinet Trio in E-flat major, K.498", cho clarinet, viola, piano; trang có liên kết tới bài phân tích "Kegelstatt K. 498".'
  - id: n18
    cau: Brahms viết sonata cho clarinet và piano (Op. 120).
    loai: danh-muc
    nguon:
      - imslp-brahms-120
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tứ tấu clarinet" (và Mozart K. 498). Chữ mới: bỏ "tứ tấu clarinet" (không rõ ý, không có nguồn), thêm sonata Brahms Op. 120. IMSLP: Clarinet Sonata No.1, Op.120 No.1, "For clarinet, piano".'
  - id: n19
    cau: Benny Goodman và Artie Shaw là hai nghệ sĩ clarinet jazz nổi tiếng.
    loai: lich-su
    nguon:
      - br-goodman
      - br-shaw
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Jazz và klezmer: clarinet là một trong những giọng solo jazz đầu tiên (Benny Goodman, Artie Shaw)". Chữ mới: "Jazz: Benny Goodman và Artie Shaw là hai nghệ sĩ clarinet jazz nổi tiếng". Lý do: bỏ "klezmer" (trang không nói gì về klezmer) và "một trong những giọng solo jazz đầu tiên" (không có nguồn). Britannica: Goodman "jazz musician, bandleader, and renowned 20th-century clarinet virtuoso"; Shaw "American clarinetist and popular bandleader of the 1930s and ''40s".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Benny_Goodman", "https://en.wikipedia.org/wiki/Artie_Shaw" ]
    luot_2_ghi_chu: Goodman và Shaw đều là nghệ sĩ clarinet jazz/swing. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n20
    cau: Mozart, Concerto clarinet cung La trưởng, K. 622.
    loai: danh-muc
    nguon:
      - imslp-mozart-622
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… K. 622 — đỉnh cao repertoire clarinet". Chữ mới: bỏ "đỉnh cao repertoire clarinet" (nhận xét không kiểm được). IMSLP: Clarinet Concerto in A major, K.622.'
  - id: n21
    cau: Mozart, Kegelstatt Trio, K. 498.
    loai: ten
    nguon:
      - imslp-mozart-498
    ket_qua: dung
    ghi_chu: 'IMSLP: Trio in E-flat major, K.498, trang liên kết tên "Kegelstatt".'
  - id: n22
    cau: Brahms, Sonata clarinet cung Fa thứ, Op. 120 số 1.
    loai: danh-muc
    nguon:
