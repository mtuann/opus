    ket_qua: dung
    ghi_chu: 'IMSLP: Clarinet Sonata No.1 in F minor, Op.120 No.1.'
  - id: n23
    cau: Weber, Concerto clarinet số 1 cung Fa thứ, Op. 73.
    loai: danh-muc
    nguon:
      - imslp-weber
    ket_qua: dung
    ghi_chu: 'IMSLP: Clarinet Concerto No.1 in F minor, Op.73.'
  - id: n24
    cau: 'Link hướng dẫn nghe Gershwin, Rhapsody in Blue: /opus/nghe-nhac/gershwin-rhapsody/; "nghe tiếng vuốt mở đầu".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: nghe-nhac/gershwin-rhapsody có ở src/data/trang.yml (dòng 166), chưa có file ở src/content/docs/nghe-nhac/: "sắp có". Lô chuyển phải giữ địa chỉ và hướng dẫn nghe có phần mở đầu bằng clarinet vuốt lên. Review D8-gom: trang.yml có nghe-nhac/gershwin-rhapsody ("sắp có"); trang cũ ../opus-zero/docs/nghe-nhac/gershwin-rhapsody.md dòng 16, 32: clarinet vuốt lên (glissando) mở đầu.'
    review: dung
  - id: n25
