  - id: n34
    cau: "Hình bàn phím Sol3–Đô4 ngay sau đoạn \"Clarinet là nhạc cụ dịch giọng\": nhãn \"viết Đô\" dưới Đô4; tô Đô4, Si♭3, La3; ngoặc Si♭3–Đô4 \"clarinet Si♭: một cung\" và La3–Đô4 \"clarinet La: 3 thứ\" (tầng trên). Câu dẫn: nốt viết Đô4 và âm vang lên của hai loại kèn."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 06/11/2026) và module dựng hình: veBanPhim (src/scripts/ve.js), docThongSoBanPhim (src/plugins/thanh-phan.mjs). Cú pháp ::cong-cu{ten=\"piano\" range=\"G3-C4\" notes=\"A3 Bb3 C4\" nhan=\"C4:viết_Đô\" ngoac=\"Bb3-C4:clarinet_Si♭:_một_cung A3-C4:clarinet_La:_3_thứ\"}. Khớp đoạn ngay trên: clarinet Si♭ viết Đô vang thành Si♭, thấp hơn một cung; clarinet La vang thấp hơn quãng 3 thứ. Hình chọn Đô4 làm nốt viết (trong âm vực viết Mi3–Đô7 của trang); một cung dưới Đô4 là Si♭3 (MIDI 58), 3 thứ (3 nửa cung) là La3 (57). Soát hình 2B (gộp review và kiểm mẫu): đối chiếu SVG trong dist/ (npm run build:xem, 07/11/2026; aria-label của hình và ảnh 360/1280 px) với chữ trang: Sol3–Đô4, tô La3, Si♭3, Đô4, nhãn viết Đô dưới Đô4, ngoặc Si♭3–Đô4 clarinet Si♭: một cung và La3–Đô4 clarinet La: 3 thứ (tầng trên); khớp đoạn Clarinet là nhạc cụ dịch giọng (Si♭ thấp hơn một cung, quãng 2 trưởng; La thấp hơn quãng 3 thứ; 2 và 3 nửa cung). Đô4 cho nốt viết Đô do câu dẫn ghi rõ. Không thêm điều trang không viết. Kết quả: dung."
    review: dung
