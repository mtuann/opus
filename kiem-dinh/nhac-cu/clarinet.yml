ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc. Nguồn chính: COD (Encyclopedia.com: clarinet, transposing instruments, chalumeau), Britannica (clarinet, Goodman, Shaw, qua Wayback), Orchestral Library và Woodwind Fingering Guide (âm vực và tên ba âm vực), IMSLP (số hiệu), Indianapolis Symphony (Rhapsody in Blue), trang Copland (Boosey & Hawkes), trang nghệ sĩ. Chỗ sửa trang (da-sua): n1 đến n5, n11, n12, n16, n18, n19, n20, n28; đã bỏ (da-bo): n29, n30. Chữ "ba âm vực chalumeau, clarion, altissimo" giữ tên, bỏ các tính từ âm sắc. Giới hạn âm vực lấy từ Woodwind Fingering Guide: "E 3 to B 4 / B 4 to C 6 / C 6 to G 6" (dấu hóa ở B 4 không hiện trong chữ của trang, thực tế là Si♭4), nên viết "khoảng". Câu ve-site: n24 (gershwin-rhapsody chưa chuyển nên "sắp có"), n31, n32, n33. Chưa chắc: không có. Câu "tứ tấu clarinet" trong bản cũ (Thính phòng) bỏ vì không rõ ý. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có bản ghi, cho D3-L5: nhạc cụ dịch giọng (transposing instrument), dăm đơn (single reed), embouchure, chalumeau, clarion, altissimo, glissando (đã có).'
doi_chu:
  - cu: "Opus Zero tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    moi: "Opus tập trung vào piano; trang này giúp bạn nghe hiểu nhạc cụ này khi nó xuất hiện trong dàn nhạc, nhạc thính phòng hay concerto. Xem Nhạc cụ trong dàn nhạc."
    ly_do: "Site mới tên Opus (bản trước tên Opus Zero); chữ trong trang theo tên hiện hành. Không phải nhận định về nhạc."
  - cu: 'mô tả: Clarinet là nhạc cụ đa tính cách nhất bộ kèn gỗ: âm vực trầm (chalumeau) dày và bí ẩn, âm vực giữa (clarion) sáng và hát, âm vực cao (altissimo) sắc và chói.…'
    moi: 'mô tả: Clarinet có ba âm vực mang tên riêng: trầm (chalumeau), giữa (clarion) và cao (altissimo).'
    ly_do: 'n1, n2 (da-sua): mô tả đổi theo câu mở đầu (bỏ "đa tính cách nhất" và tính từ âm sắc không có nguồn).'
  - cu: 'Clarinet là nhạc cụ đa tính cách nhất bộ kèn gỗ: âm vực trầm (chalumeau) dày và bí ẩn, âm vực giữa (clarion) sáng và hát, âm vực cao (altissimo) sắc và chói. Một cây kèn mà như ba nhạc cụ trong một.'
    moi: 'Clarinet là một nhạc cụ bộ kèn gỗ, có ba âm vực mang tên riêng: trầm (chalumeau), giữa (clarion) và cao (altissimo).'
    ly_do: 'n1, n2 (da-sua): "đa tính cách nhất" và tính từ về âm sắc không có nguồn.'
  - cu: 'Chalumeau (trầm): ấm, dày, hơi u ám.'
    moi: 'Chalumeau (trầm): từ nốt thấp nhất lên khoảng Si4 (nốt viết).'
    ly_do: 'n3 (da-sua): tính từ là lời văn; thay bằng giới hạn âm vực (Woodwind Fingering Guide).'
  - cu: 'Clarion (giữa): sáng, rõ — âm vực "hát" chính.'
    moi: 'Clarion (giữa): từ khoảng Si4 đến khoảng Đô6.'
    ly_do: 'n4 (da-sua): như trên.'
  - cu: 'Altissimo (cao): sắc, xuyên thấu.'
    moi: 'Altissimo (cao): từ khoảng Đô6 trở lên.'
    ly_do: 'n5 (da-sua): như trên.'
  - cu: 'Clarinet là nhạc cụ dịch giọng. Loại phổ biến nhất là clarinet Si♭: nốt viết Đô vang thành Si♭ — thấp hơn một cung (quãng 2 trưởng) so với nốt viết. Loại clarinet La (dùng nhiều trong nhạc Mozart, Brahms) vang thấp hơn quãng 3 thứ. Người chơi clarinet đọc bản nhạc viết riêng cho loại kèn của mình; khi nghe, nhớ rằng âm thanh thực tế trầm hơn nốt viết.'
    moi: 'Clarinet là nhạc cụ dịch giọng. Loại phổ biến nhất là clarinet Si♭: nốt viết Đô vang thành Si♭ — thấp hơn một cung (quãng 2 trưởng) so với nốt viết. Loại clarinet La (hợp với bản nhạc có nhiều dấu thăng) vang thấp hơn quãng 3 thứ. Bản nhạc clarinet được viết theo loại kèn sẽ dùng; khi nghe, nhớ rằng âm thanh thực tế trầm hơn nốt viết.'
    ly_do: 'n11, n12 (da-sua): theo COD, Britannica; bỏ "dùng nhiều trong nhạc Mozart, Brahms" (không có nguồn).'
  - cu: 'Dàn nhạc: cầu nối giữa kèn gỗ và kèn đồng; nhiều đoạn độc tấu nổi tiếng (mở đầu Rhapsody in Blue của Gershwin chính là tiếng clarinet vuốt lên).'
    moi: 'Dàn nhạc: một đoạn độc tấu nổi tiếng là mở đầu Rhapsody in Blue của Gershwin, tiếng clarinet vuốt lên.'
    ly_do: 'n16 (da-sua): bỏ "cầu nối giữa kèn gỗ và kèn đồng" (không kiểm được).'
  - cu: 'Thính phòng: tứ tấu clarinet, tam tấu clarinet–viola–piano của Mozart (K. 498 Kegelstatt).'
    moi: 'Thính phòng: tam tấu clarinet–viola–piano của Mozart (K. 498 Kegelstatt); sonata cho clarinet và piano của Brahms (Op. 120).'
    ly_do: 'n18 (da-sua): bỏ "tứ tấu clarinet" (không nguồn); thêm Brahms Op. 120 (IMSLP).'
  - cu: 'Jazz và klezmer: clarinet là một trong những giọng solo jazz đầu tiên (Benny Goodman, Artie Shaw).'
    moi: 'Jazz: Benny Goodman và Artie Shaw là hai nghệ sĩ clarinet jazz nổi tiếng.'
    ly_do: 'n19 (da-sua): bỏ klezmer (trang không nói gì) và "giọng solo jazz đầu tiên" (không nguồn).'
  - cu: Mozart, Concerto clarinet cung La trưởng, K. 622 — đỉnh cao repertoire clarinet
    moi: Mozart, Concerto clarinet cung La trưởng, K. 622
    ly_do: 'n20 (da-sua): bỏ "đỉnh cao" (không kiểm được).'
  - cu: 'Clarinet là lựa chọn phổ biến cho người mới học kèn: dễ phát tiếng hơn sáo hay oboe, nhạc cụ học sinh giá vừa phải. Khó nhất là hơi thở (cần luồng hơi ổn định, khỏe) và âm vực cao (altissimo) đòi hỏi kỹ thuật. Học với giáo viên để chỉnh thế ngậm dăm (embouchure) ngay từ đầu — ngậm sai lâu ngày rất khó sửa.'
    moi: Nên học với giáo viên ngay từ đầu nếu có điều kiện, để chỉnh thế ngậm dăm (embouchure).
    ly_do: 'n28 (da-sua), n29, n30 (da-bo): bỏ "phổ biến", "dễ hơn sáo hay oboe", "giá vừa phải", hơi thở, "ngậm sai khó sửa" (không có nguồn bậc 1-2; hơi thở/thế ngậm là sức khỏe).'
