  - id: n28
    cau: Nên học clarinet với giáo viên ngay từ đầu nếu có điều kiện, để chỉnh thế ngậm dăm (embouchure).
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "Học với giáo viên để chỉnh thế ngậm dăm (embouchure) ngay từ đầu — ngậm sai lâu ngày rất khó sửa." Chữ mới: bỏ "ngậm sai lâu ngày rất khó sửa" (khẳng định không có nguồn, dính tới thế ngậm/môi). Britannica mô tả thế ngậm (reed down, giữa môi và răng) nhưng không nói về chuyện sửa. Review D8-gom: như cello n26. Thế ngậm dăm là kỹ thuật, câu không nói về sức khỏe.'
  - id: n29
