doi_chu:
- cu: 'Site này tập trung vào piano. Các trang trong mục này thuộc phần nghe: giúp bạn nhận ra tiếng từng nhạc cụ, hiểu vai trò của chúng trong dàn nhạc và khi chơi cùng piano. Người học piano nghe kỹ các nhạc cụ khác sẽ chơi hay hơn, vì rất nhiều đoạn piano được viết để gợi tiếng dây, tiếng kèn hay giọng hát.'
  moi: 'Site này tập trung vào piano. Các trang trong mục này thuộc phần nghe: giúp bạn nhận ra tiếng từng nhạc cụ, hiểu vai trò của chúng trong dàn nhạc và khi chơi cùng piano. Người học piano nghe kỹ các nhạc cụ khác sẽ dễ hiểu hơn những đoạn piano gợi tiếng dây, tiếng kèn hay giọng hát.'
