    cau: "Ba hợp âm Le-be-wohl mở đầu sonata Les Adieux Op. 81a của Beethoven dựa trên một hình nét kèn horn tự nhiên: hai bè đi qua quãng 3 trưởng, quãng 5 đúng, quãng 6 thứ."
    loai: dinh-nghia
    nguon:
      - ptna-op81a
      - imslp-op81a
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… bắt đầu như thế, rồi bất ngờ rẽ sang hợp âm Đô thứ ở nốt thứ ba". IMSLP: Piano Sonata No.26, Op.81a, 1809–10, tên khác "Les Adieux/Das Lebewohl"; Wikipedia: Beethoven viết "Le-be-wohl" trên ba hợp âm đầu, "at first forming an interrupted cadence"; Listeners'' Club: hai hợp âm đầu "predictable pattern", hợp âm thứ ba "delivers a surprise, taking us to a completely new place". "Hợp âm Đô thứ" chưa kiểm được ở nguồn nào (cần bản nhạc: IMSLP chặn tải PDF): bỏ tên hợp âm, giữ "bất ngờ". Gợi ý cho lượt 2: ai mở được bản nhạc có thể thêm lại tên hợp âm. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://thelistenersclub.com/2017/09/20/beethovens-les-adieux-sonata-saying-goodbye-in-three-chords/ https://imslp.org/wiki/Piano_Sonata_No.26,_Op.81a_(Beethoven,_Ludwig_van); The Listeners'' Club: ba hợp âm mở đầu (Le-be-wohl), gợi quãng rộng của kèn horn săn bắn, hợp âm thứ ba bất ngờ. IMSLP: Op. 81a, 1809–10, chương 1 ''Das Lebewohl''. ''Tù và săn bắn'' khớp với ''horns, the instrument of the hunt''.. Review D8-gom: "gợi tiếng tù và săn bắn" và "hợp âm thứ ba đưa bài tới một nơi bất ngờ" chỉ có nguồn bậc 3 (Listeners'' Club, Wikipedia): bỏ. PTNA Piano Music Encyclopedia: "Its beginning features a motive based on a natural horn figure descending by thirds (a two-voice progression of major 3rd → perfect 5th → minor 6th), with the syllables ''Le-be-wohl'' attached to each note". Đây đúng là chi tiết quãng 3, 5, 6 của trang cũ mà lượt 1 đã bỏ vì chưa có nguồn. Ghi doi_chu. Đưa vào lượt 2 bổ sung. Review cuối D8-gom: giữ chữ. Tự mở lại PTNA (ptna-op81a): mở đầu là một motif dựa trên hình nét kèn horn tự nhiên đi xuống theo quãng ba, "a two-voice progression of major 3rd → perfect 5th → minor 6th", ba âm tiết Le-be-wohl gắn với từng nốt. Khớp câu (câu nói khuôn hai bè, không nói bè trầm của hợp âm thứ ba).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Sonata_No.26,_Op.81a_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "IMSLP chỉ xác nhận chương 1 là 'Das Lebewohl'. Chưa mở được nguồn nói ba hợp âm đầu dựa trên hình nét kèn horn và chuỗi quãng 3 trưởng, 5 đúng, 6 thứ (chưa đối chiếu bản nhạc; lưu ý: ở Beethoven hợp âm thứ ba có bè trầm xuống Đô, nên cần kiểm quãng thật hay ghi rõ là khuôn mẫu kèn horn)."
