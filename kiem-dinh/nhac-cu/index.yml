nhan_dinh:
  - id: n1
    cau: 'Site tập trung vào piano; các trang trong mục này thuộc phần nghe: giúp nhận ra tiếng từng nhạc cụ, hiểu vai trò trong dàn nhạc và khi chơi cùng piano.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: AGENTS.md và mục trang chủ: site Opus học piano; các trang trong src/content/docs/nhac-cu/ (đầu mỗi trang có hộp "Trang này thuộc phần nghe") đúng như câu mô tả. Câu "Site này tập trung vào piano" trùng với chữ "Opus tập trung vào piano" ở các trang nhạc cụ. Review D8-gom: câu đầu trang; tám trang trong mục đều có hộp "Trang này thuộc phần nghe" (trừ dan-nhac, trang lõi).'
    review: dung
  - id: n2
    cau: Người học piano nghe kỹ các nhạc cụ khác sẽ dễ hiểu hơn những đoạn piano gợi tiếng dây, tiếng kèn hay giọng hát.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "sẽ chơi hay hơn, vì rất nhiều đoạn piano được viết để gợi tiếng dây, tiếng kèn hay giọng hát". Bỏ "chơi hay hơn" (hứa hẹn) và "rất nhiều … được viết để" (số lượng và ý định nhà soạn nhạc không kiểm được); ví dụ có nguồn ở mục "Nghe dàn nhạc trong tiếng piano" (x16–x20). Lời khuyên nghe, không cần nguồn. Review D8-gom: như cello n26; lượt 2 đã ghi dung.'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên nghe và tập, hợp lý.
  - id: n3
    cau: 'Muốn học chơi piano: xem mục Piano.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: piano/index.md có trong bản build; link /opus/piano/ đúng. Review D8-gom: piano/index.md đã khóa; link /opus/piano/.'
    review: dung
  - id: n4
    cau: Bộ dây của dàn nhạc gồm violin, viola, cello, contrabass.
    loai: dinh-nghia
    nguon:
      - cod-orchestra
    ket_qua: dung
    ghi_chu: 'COD, Orchestra: dàn nhạc chia các nhóm dây, gỗ, đồng, gõ. Khớp trang dan-nhac (khóa, d3–d7: nguồn COD, VSL).'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Orchestra" ]
    luot_2_ghi_chu: Bộ dây gồm violin, viola, cello, double bass. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n5
    cau: 'Âm sắc nhóm dây: kéo vĩ liền mạch, có thể rung (vibrato), có thể gảy bằng ngón (pizzicato).'
    loai: dinh-nghia
    nguon:
      - vsl-violin
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Liền, ấm, thường có rung (vibrato); có thể gảy bằng ngón (pizzicato)". VSL, violin: "legato … one note flows into the next without a break" (kéo vĩ liền), vibrato (nhiều loại; "It was not until the 19th century that vibrato playing became widespread" nên "thường có rung" chưa đúng cho mọi thời kỳ), pizzicato "Plucking of the strings with the right hand". "Ấm" không nguồn chung cho cả họ dây: bỏ; "thường có rung" thành "có thể rung".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Violin" ]
    luot_2_ghi_chu: Kéo vĩ, vibrato, pizzicato đều là kỹ thuật của nhóm dây. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n6
    cau: Bộ gỗ gồm sáo, oboe, clarinet, bassoon.
    loai: dinh-nghia
    nguon:
      - cod-orchestra
    ket_qua: dung
    ghi_chu: COD, Orchestra (bộ gỗ); khớp dan-nhac (khóa, d9–d13; COD, VSL).
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Orchestra" ]
    luot_2_ghi_chu: "Bộ gỗ: flute, oboe, clarinet, bassoon. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được)."
  - id: n7
    cau: Sáo mềm, thanh ở âm vực giữa; oboe sáng, xuyên, có chất dăm; clarinet tròn, ấm, dịu ở âm vực trầm.
    loai: dinh-nghia
    nguon:
      - vsl-flute
      - vsl-oboe
      - vsl-clarinet
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sáo trong và thoáng; oboe hơi ''giọng mũi''; clarinet tròn, mềm ở âm vực trầm". VSL flute: giữa "mellow and graceful"; VSL oboe: "Clear, bright, penetrating, acerbic, keen, biting, rasping, reedy …" (không có "nasal"; khớp d11 của dan-nhac đã bỏ "hơi mũi"); VSL clarinet: âm vực trầm (chalumeau) "Darker, fuller, mellower and warmer timbre", "round". "Trong và thoáng" của sáo không nguồn: dùng mô tả VSL. Review D8-gom: giữ: chữ là tính từ của VSL dịch sát (flute giữa "mellow, light", oboe "bright, penetrating … reedy", clarinet trầm "darker, fuller, mellower and warmer", "round"), nên là mô tả có nguồn bậc 2, không phải nhận xét riêng của site.'
    luot_2: khong-chac
    luot_2_ghi_chu: Mô tả âm sắc chủ quan, không có nguồn bậc 2 mở được.
  - id: n8
    cau: Họ đồng gồm kèn horn, trumpet, trombone, tuba.
    loai: dinh-nghia
    nguon:
      - cod-orchestra
      - vsl-brass
    ket_qua: dung
    ghi_chu: COD, Orchestra (bộ đồng); khớp dan-nhac (khóa, d14–d17; VSL, brass).
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Orchestra" ]
    luot_2_ghi_chu: "Họ đồng: horn, trumpet, trombone, tuba. Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được)."
  - id: n9
    cau: Trumpet sáng, vang; horn ấm và dịu hơn.
    loai: dinh-nghia
    nguon:
      - vsl-trumpet-c
      - vsl-horn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sáng, vang xa; horn tròn và ấm hơn". VSL trumpet: "metallic, bright … powerful"; VSL horn: "Full, warm, velvety, clear, distant, mellow, metallic" và "mellow and romantic euphony … contrasts so sharply with the strident metallic quality of the trumpet"; VSL không dùng "round" cho horn, và không nói "vang xa": đổi "vang xa" thành "vang", "tròn và ấm hơn" thành "ấm và dịu hơn". Khớp dan-nhac d14. Review D8-gom: giữ: VSL trumpet "metallic, bright … brilliant, powerful", horn "full, warm, velvety … mellow", tương phản với "the strident metallic quality of the trumpet".'
    luot_2: khong-chac
    luot_2_ghi_chu: Mô tả âm sắc chủ quan.
  - id: n10
    cau: Họ gõ gồm timpani, trống, chũm chọe, chuông; timpani có cao độ.
    loai: dinh-nghia
    nguon:
      - cod-percussion
    ket_qua: dung
    ghi_chu: 'COD, Percussion: nhạc cụ gõ có cao độ xác định "definite pitch—kettledrum, tubular bells, …", không cao độ "triangle, gong, castanet…"; timpani = kettledrum (COD, Timpani: "See drum"). Chữ "Nhịp và màu sắc" là mô tả chung, bỏ qua.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Orchestra" ]
    luot_2_ghi_chu: Họ gõ gồm timpani, trống, chũm chọe, nhạc cụ gõ có cao độ (timpani có cao độ).
  - id: n11
    cau: Họ phím, gảy và giọng gồm piano, harpsichord, organ, harp, guitar, giọng hát; mỗi loại một âm sắc riêng (xem các trang ở cột bên).
