tang: khung
lan:
- so: 1
  ngay: 2026-11-05
  nhanh: moi/d8-l2
  ma_bam: null
  nguoi:
    luot_1: Claude Sonnet 5.5 (D8-L2 lượt 1, phần 2/2)
    luot_2: null
    review: null
    kiem_mau: null
ghi_chu: 'Trang lối vào nhóm (tầng khung). Theo chuẩn tầng khung hồ sơ không có nhận định khi chữ sinh từ dữ liệu; trang này có chữ viết tay nói về âm nhạc (bảng họ nhạc cụ, "Piano chơi cùng ai?", "Nghe dàn nhạc trong tiếng piano"), nên lập nhận định cho các câu ấy có nguồn; câu chỉ là danh sách link của site xếp ve-site. Không có khối abc. Sửa chữ: x2, x5, x7, x8, x10 (cột "Mỗi loại một trang riêng" sai: piano và harp không có trang riêng), x18, x19, x20, x22–x25 (Les Adieux: bỏ quãng 3, 5, 6 và hợp âm Đô thứ, chưa kiểm được; Scarlatti và guitar: chưa chắc, ket_qua null). Nguồn: VSL, COD, IMSLP, Wigmore Hall, Pärt Centre, wssymphony.org, Hollywood Bowl, The Listeners'' Club (bậc 3), Wikipedia (bậc 3, chỉ đối chiếu). Chưa quyết: x25. Dòng x4, x6, x7b chỉ dẫn lại các hồ sơ dan-nhac (khóa). doi_chu viết tay từ khối của dist/ cũ (dist chưa build lại sau sửa): người giao chạy node tools/chuyen/so-chu.mjs nhac-cu/index --doi-chu sau khi build để đối chiếu. Thuật ngữ trang dùng: pizzicato và legato đã có bản ghi ở src/data/thuat-ngu.yml; chưa có (cho D3-L5; không tạo bản ghi): vibrato, Lied, concerto, tam tấu piano, ngũ tấu.'
