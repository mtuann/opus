doi_chu:
  - cu: 'Site này tập trung vào piano. Các trang trong mục này thuộc phần nghe: giúp bạn nhận ra tiếng từng nhạc cụ, hiểu vai trò của chúng trong dàn nhạc và khi chơi cùng piano. Người học piano nghe kỹ các nhạc cụ khác sẽ chơi hay hơn, vì rất nhiều đoạn piano được viết để gợi tiếng dây, tiếng kèn hay giọng hát.'
    moi: 'Site này tập trung vào piano. Các trang trong mục này thuộc phần nghe: giúp bạn nhận ra tiếng từng nhạc cụ, hiểu vai trò của chúng trong dàn nhạc và khi chơi cùng piano. Người học piano nghe kỹ các nhạc cụ khác sẽ dễ hiểu hơn những đoạn piano gợi tiếng dây, tiếng kèn hay giọng hát.'
    ly_do: 'n2 (da-sua): bỏ hứa hẹn "chơi hay hơn" và "rất nhiều … được viết để".'
  - cu: Liền, ấm, thường có rung (vibrato); có thể gảy bằng ngón (pizzicato)
    moi: Kéo vĩ liền mạch, có thể rung (vibrato); có thể gảy bằng ngón (pizzicato)
    ly_do: 'n5 (da-sua): theo VSL; bỏ "ấm", "thường có rung".'
  - cu: Sáo trong và thoáng; oboe hơi "giọng mũi"; clarinet tròn, mềm ở âm vực trầm
    moi: Sáo mềm, thanh ở âm vực giữa; oboe sáng, xuyên, có chất dăm; clarinet tròn, ấm, dịu ở âm vực trầm
    ly_do: 'n7 (da-sua): theo VSL; bỏ "trong và thoáng", "hơi giọng mũi" (khớp d11 của dan-nhac).'
  - cu: Sáng, vang xa; horn tròn và ấm hơn
    moi: Trumpet sáng, vang; horn ấm và dịu hơn
    ly_do: 'n9 (da-sua): theo VSL; bỏ "vang xa", "tròn".'
  - cu: Mỗi loại một trang riêng
    moi: Mỗi loại một âm sắc riêng (xem các trang ở cột bên)
    ly_do: 'n11 (da-sua): chữ cũ sai (piano và harp không có trang riêng).'
  - cu: 'Nhiều nhà soạn nhạc nghĩ bằng dàn nhạc khi viết cho piano. Khi tập một bài, hãy tự hỏi: đoạn này là nhạc cụ gì?'
    moi: 'Có nhà soạn nhạc viết cho piano với âm sắc nhạc cụ khác trong đầu. Khi tập một bài, hãy tự hỏi: đoạn này là nhạc cụ gì?'
    ly_do: 'n24 (da-sua): "Nhiều … nghĩ bằng dàn nhạc" không kiểm được.'
  - cu: Hai bè đi song song qua các quãng 3, 5, 6 ("quãng năm kèn horn") gợi tiếng tù và của kèn horn. Ba hợp âm Le-be-wohl mở đầu sonata Les Adieux Op. 81a của Beethoven bắt đầu như thế, rồi bất ngờ rẽ sang hợp âm Đô thứ ở nốt thứ ba.
    moi: 'Lối hai bè quen thuộc của kèn horn tự nhiên ("quãng năm kèn horn") gợi tiếng kèn horn. Ba hợp âm Le-be-wohl mở đầu sonata Les Adieux Op. 81a của Beethoven dựa trên một hình nét kèn horn tự nhiên: hai bè đi qua quãng 3 trưởng, quãng 5 đúng, quãng 6 thứ.'
    ly_do: 'n25, n26 (da-sua): bỏ "quãng 3, 5, 6", "quãng năm kèn horn", "hợp âm Đô thứ" (không nguồn); giữ ý theo Listeners'' Club, Wikipedia. Review D8-gom: n25, n26 viết lại theo Yamaha (horn fifths) và PTNA (Op. 81a: hình nét kèn horn tự nhiên, quãng 3 trưởng, 5 đúng, 6 thứ); bỏ "tù và săn bắn", "hợp âm thứ ba … bất ngờ" (chỉ nguồn bậc 3).'
  - cu: Nốt lặp nhanh và hợp âm gõ trong các sonata của Scarlatti gợi guitar (hướng dẫn nghe).
    moi: Trong các sonata của Scarlatti có những hợp âm rải bắt chước tiếng gảy dây guitar (hướng dẫn nghe).
    ly_do: 'n27 (chưa chắc): bỏ "hợp âm gõ"; hạ giọng. Review D8-gom: n27 viết lại theo Hyperion (Hewitt, CDA67613).'
  - cu: 'Ca khúc nghệ thuật (Lied): trong Erlkönig, piano là tiếng vó ngựa và cơn bão, một người kể chuyện thứ hai.'
    moi: 'Ca khúc nghệ thuật (Lied): trong Erlkönig, phần piano gợi tiếng vó ngựa phi.'
    ly_do: 'n20 (da-sua): theo Wigmore Hall; bỏ "cơn bão", "người kể chuyện thứ hai".'
  - cu: 'Tĩnh lặng: Spiegel im Spiegel của Pärt, giai điệu violin trên những nốt piano chậm rãi.'
    moi: 'Tĩnh lặng: Spiegel im Spiegel của Pärt, giai điệu violin trên nền các nốt piano.'
    ly_do: 'n22 (da-sua): nguồn không nêu tốc độ.'
  - cu: 'Nhạc thính phòng: sonata cho violin và piano, cho cello và piano; tam tấu piano (piano, violin, cello); ngũ tấu như Con cá hồi của Schubert. Ở đây piano không phải "người đệm" mà là bạn diễn ngang hàng.'
    moi: 'Nhạc thính phòng: sonata cho violin và piano, cho cello và piano; tam tấu piano (piano, violin, cello); ngũ tấu như Con cá hồi của Schubert. Ở thể loại này, các phần đàn thường ngang hàng với nhau, piano không chỉ để đệm.'
    ly_do: 'n19 (da-sua): theo COD, Chamber music ("on equal terms"), bỏ tuyệt đối.'
