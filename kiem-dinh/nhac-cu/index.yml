  ghi_chu: 'Chữ cũ: "giai điệu violin trên những nốt piano chậm rãi". Trung tâm Arvo Pärt: 1978, "Violin and piano"; giai điệu và "the piano plays tintinnabuli notes". Trang không nêu tốc độ, nên bỏ "chậm rãi". Link nghe-nhac/part-spiegel chưa chuyển: "sắp có".'
