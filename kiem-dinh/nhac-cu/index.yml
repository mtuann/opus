nhan_dinh:
- id: n1
  cau: 'Site tập trung vào piano; các trang trong mục này thuộc phần nghe: giúp nhận ra tiếng từng nhạc cụ, hiểu vai trò trong dàn nhạc và khi chơi cùng piano.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Kiểm: AGENTS.md và mục trang chủ: site Opus học piano; các trang trong src/content/docs/nhac-cu/ (đầu mỗi trang có hộp "Trang này thuộc phần nghe") đúng như câu mô tả. Câu "Site này tập trung vào piano" trùng với chữ "Opus tập trung vào piano" ở các trang nhạc cụ.'
- id: n2
  cau: Người học piano nghe kỹ các nhạc cụ khác sẽ dễ hiểu hơn những đoạn piano gợi tiếng dây, tiếng kèn hay giọng hát.
  loai: khuyen-tap
  nguon: []
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "sẽ chơi hay hơn, vì rất nhiều đoạn piano được viết để gợi tiếng dây, tiếng kèn hay giọng hát". Bỏ "chơi hay hơn" (hứa hẹn) và "rất nhiều … được viết để" (số lượng và ý định nhà soạn nhạc không kiểm được); ví dụ có nguồn ở mục "Nghe dàn nhạc trong tiếng piano" (x16–x20). Lời khuyên nghe, không cần nguồn.'
- id: n3
  cau: 'Muốn học chơi piano: xem mục Piano.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Kiểm: piano/index.md có trong bản build; link /opus/piano/ đúng.'
- id: n4
  cau: Bộ dây của dàn nhạc gồm violin, viola, cello, contrabass.
  loai: dinh-nghia
  nguon:
  - cod-orchestra
  ket_qua: dung
  ghi_chu: 'COD, Orchestra: dàn nhạc chia các nhóm dây, gỗ, đồng, gõ. Khớp trang dan-nhac (khóa, d3–d7: nguồn COD, VSL).'
- id: n5
  cau: 'Âm sắc nhóm dây: kéo vĩ liền mạch, có thể rung (vibrato), có thể gảy bằng ngón (pizzicato).'
  loai: dinh-nghia
  nguon:
  - vsl-violin
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Liền, ấm, thường có rung (vibrato); có thể gảy bằng ngón (pizzicato)". VSL, violin: "legato … one note flows into the next without a break" (kéo vĩ liền), vibrato (nhiều loại; "It was not until the 19th century that vibrato playing became widespread" nên "thường có rung" chưa đúng cho mọi thời kỳ), pizzicato "Plucking of the strings with the right hand". "Ấm" không nguồn chung cho cả họ dây: bỏ; "thường có rung" thành "có thể rung".'
- id: n6
  cau: Bộ gỗ gồm sáo, oboe, clarinet, bassoon.
  loai: dinh-nghia
  nguon:
  - cod-orchestra
  ket_qua: dung
  ghi_chu: COD, Orchestra (bộ gỗ); khớp dan-nhac (khóa, d9–d13; COD, VSL).
- id: n7
  cau: Sáo mềm, thanh ở âm vực giữa; oboe sáng, xuyên, có chất dăm; clarinet tròn, ấm, dịu ở âm vực trầm.
  loai: dinh-nghia
  nguon:
  - vsl-flute
  - vsl-oboe
  - vsl-clarinet
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Sáo trong và thoáng; oboe hơi ''giọng mũi''; clarinet tròn, mềm ở âm vực trầm". VSL flute: giữa "mellow and graceful"; VSL oboe: "Clear, bright, penetrating, acerbic, keen, biting, rasping, reedy …" (không có "nasal"; khớp d11 của dan-nhac đã bỏ "hơi mũi"); VSL clarinet: âm vực trầm (chalumeau) "Darker, fuller, mellower and warmer timbre", "round". "Trong và thoáng" của sáo không nguồn: dùng mô tả VSL.'
- id: n8
  cau: Họ đồng gồm kèn horn, trumpet, trombone, tuba.
  loai: dinh-nghia
  nguon:
  - cod-orchestra
  - vsl-brass
  ket_qua: dung
  ghi_chu: COD, Orchestra (bộ đồng); khớp dan-nhac (khóa, d14–d17; VSL, brass).
- id: n9
  cau: Trumpet sáng, vang; horn ấm và dịu hơn.
  loai: dinh-nghia
  nguon:
  - vsl-trumpet-c
  - vsl-horn
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Sáng, vang xa; horn tròn và ấm hơn". VSL trumpet: "metallic, bright … powerful"; VSL horn: "Full, warm, velvety, clear, distant, mellow, metallic" và "mellow and romantic euphony … contrasts so sharply with the strident metallic quality of the trumpet"; VSL không dùng "round" cho horn, và không nói "vang xa": đổi "vang xa" thành "vang", "tròn và ấm hơn" thành "ấm và dịu hơn". Khớp dan-nhac d14.'
- id: n10
  cau: Họ gõ gồm timpani, trống, chũm chọe, chuông; timpani có cao độ.
  loai: dinh-nghia
  nguon:
  - cod-percussion
  ket_qua: dung
  ghi_chu: 'COD, Percussion: nhạc cụ gõ có cao độ xác định "definite pitch—kettledrum, tubular bells, …", không cao độ "triangle, gong, castanet…"; timpani = kettledrum (COD, Timpani: "See drum"). Chữ "Nhịp và màu sắc" là mô tả chung, bỏ qua.'
- id: n11
  cau: Họ phím, gảy và giọng gồm piano, harpsichord, organ, harp, guitar, giọng hát; mỗi loại một âm sắc riêng (xem các trang ở cột bên).
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Mỗi loại một trang riêng" (cột âm sắc). Sai: piano ở mục Piano và harp (đàn hạc) chỉ có ở trang dan-nhac, không có trang riêng; chỉ guitar có trang riêng, giọng hát, organ, harpsichord chung một trang (nhac-cu-khac). Đổi chữ trong cột này thành "Mỗi loại một âm sắc riêng (xem các trang ở cột bên)". Họ nhạc cụ (phím, gảy, giọng) là cách chia của trang. Người giao ghi doi_chu.'
- id: n12
  cau: 'Cột Trang trong bảng: link tới Violin, Cello, Sáo, Clarinet, Trumpet, Dàn nhạc giao hưởng, Guitar cổ điển, Giọng hát organ harpsichord.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Kiểm: violin.md, cello.md, sao.md, clarinet.md, trumpet.md, dan-nhac.md, guitar.md, nhac-cu-khac.md đều có trong src/content/docs/nhac-cu/; link đúng địa chỉ.'
- id: n13
  cau: Sơ đồ chỗ ngồi và âm vực từng nhạc cụ so với bàn phím piano có ở trang Dàn nhạc giao hưởng.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Kiểm: dan-nhac.md có mục "Sơ đồ chỗ ngồi thường gặp" (hình seating) và "Âm vực các nhạc cụ" ("So với bàn phím piano", hình ranges-orchestra).'
- id: n14
  cau: 'Concerto: piano đối thoại với cả dàn nhạc.'
  loai: dinh-nghia
  nguon:
  - cod-concerto
  ket_qua: dung
  ghi_chu: 'COD, Concerto: "A work in which a solo instr(s). is contrasted and blended with the orch." ("đối thoại" là cách nói của trang; hinh-thuc/concerto cũng nói "đối đáp").'
- id: n15
  cau: Mozart, Concerto số 21 cho piano (K. 467); Grieg, Concerto cho piano (Op. 16); Rachmaninoff, Concerto số 2 cho piano (Op. 18); Gershwin, Rhapsody in Blue (piano và dàn nhạc).
  loai: ten
  nguon:
  - imslp-mozart21
  - imslp-grieg
  - imslp-rach2
  - imslp-rhapsody
  ket_qua: dung
  ghi_chu: 'IMSLP: Mozart K.467, 1785 (piano, orchestra); Grieg Op.16, cung La thứ; Rachmaninoff Op.18, cung Đô thứ, 1900–01; Gershwin, Rhapsody in Blue, 1924 (piano, orchestra). Chữ trang chỉ ghi số hiệu: "Concerto số 21", "số 2"; số hiệu K., Op. khớp IMSLP.'
- id: n16
  cau: Link tới bốn hướng dẫn nghe concerto và trang Concerto và ritornello.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Kiểm: nghe-nhac/mozart-concerto-21, grieg-concerto, rachmaninoff-2, gershwin-rhapsody có trong src/data/trang.yml, chưa chuyển (hiện "sắp có", giữ địa chỉ đúng với trang cũ); hinh-thuc/concerto.md có trong bản build, tiêu đề "Concerto và ritornello".'
- id: n17
  cau: Nhạc thính phòng gồm sonata cho violin và piano, cho cello và piano, tam tấu piano (piano, violin, cello).
  loai: dinh-nghia
  nguon:
  - cod-chamber
  - cod-piano-trio
  ket_qua: dung
  ghi_chu: 'COD, Chamber music: "duet sonatas for vn. and pf., or vc. and pf."; COD, Piano trio: "Group of 3 players—pianist, violinist, cellist".'
- id: n18
  cau: Ngũ tấu Con cá hồi (Trout) của Schubert có piano.
  loai: ten
  nguon:
  - imslp-trout
  - cod-piano-quintet
  ket_qua: dung
  ghi_chu: 'IMSLP: Piano Quintet in A major, D.667, violin, viola, cello, contrabass, piano; tên khác "Trout Quintet (Die Forelle)"; COD, Piano quintet: "Schubert''s ‘Trout’ quintet, is for pf., vn., va., vc., and db.". Link nghe-nhac/schubert-ca-hoi: chưa chuyển, "sắp có".'
- id: n19
  cau: Ở nhạc thính phòng, các phần đàn thường ngang hàng với nhau, piano không chỉ để đệm.
  loai: dinh-nghia
  nguon:
  - cod-chamber
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ở đây piano không phải ''người đệm'' mà là bạn diễn ngang hàng". COD, Chamber music: "all the parts being on equal terms". Đổi thành "thường ngang hàng": COD nói chung, và COD, Sonata: "for … other instr(s). with pf. acc." (sonata có thể coi piano đệm) nên bỏ khẳng định tuyệt đối.'
- id: n20
  cau: Trong Erlkönig của Schubert, phần piano gợi tiếng vó ngựa phi.
  loai: dinh-nghia
  nguon:
  - wigmore-erlkonig
  - imslp-erlkonig
  - cod-lied
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "piano là tiếng vó ngựa và cơn bão, một người kể chuyện thứ hai". Wigmore Hall (gói tài liệu): "Throughout the piece, the piano plays very fast triplets to represent the galloping horse"; "a distinctive triplet melody in the left hand … represents the Erlking". "Cơn bão" và "người kể chuyện thứ hai" không có ở nguồn: bỏ. IMSLP: Lied D.328 cho giọng và piano; COD, Lied.'
- id: n21
