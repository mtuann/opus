- id: n24
  cau: Có nhà soạn nhạc viết cho piano với âm sắc nhạc cụ khác trong đầu.
  loai: lich-su
  nguon:
  - listeners-club
  - imslp-pictures
  - wsso-pictures
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nhiều nhà soạn nhạc nghĩ bằng dàn nhạc khi viết cho piano". "Nhiều" và "nghĩ bằng dàn nhạc" không kiểm được. Các ví dụ ngay dưới (Beethoven, Mussorgsky/Ravel) có nguồn; câu mở đầu hạ giọng thành "có". Ý định nhà soạn nhạc chỉ suy từ ví dụ, review nên cân nhắc giữ hay bỏ.'
- id: n25
  cau: Những quãng rộng, mở gợi tiếng của kèn horn.
  loai: dinh-nghia
  nguon:
  - listeners-club
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hai bè đi song song qua các quãng 3, 5, 6 (''quãng năm kèn horn'') gợi tiếng tù và của kèn horn". The Listeners'' Club (về ba hợp âm Le-be-wohl): "suggesting the wide-open intervals of horns, the instrument of the hunt" (không nêu quãng 3, 5, 6). Bỏ quãng cụ thể (không nguồn). Không nguồn bậc 1–2 nói "quãng năm kèn horn" trong đoạn này.'
- id: n26
  cau: Ba hợp âm Le-be-wohl mở đầu sonata Les Adieux Op. 81a của Beethoven gợi tiếng tù và săn bắn, rồi hợp âm thứ ba đưa bài tới một nơi bất ngờ.
  loai: dinh-nghia
  nguon:
  - listeners-club
  - wiki-op81a
  - imslp-op81a
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "… bắt đầu như thế, rồi bất ngờ rẽ sang hợp âm Đô thứ ở nốt thứ ba". IMSLP: Piano Sonata No.26, Op.81a, 1809–10, tên khác "Les Adieux/Das Lebewohl"; Wikipedia: Beethoven viết "Le-be-wohl" trên ba hợp âm đầu, "at first forming an interrupted cadence"; Listeners'' Club: hai hợp âm đầu "predictable pattern", hợp âm thứ ba "delivers a surprise, taking us to a completely new place". "Hợp âm Đô thứ" chưa kiểm được ở nguồn nào (cần bản nhạc: IMSLP chặn tải PDF): bỏ tên hợp âm, giữ "bất ngờ". Gợi ý cho lượt 2: ai mở được bản nhạc có thể thêm lại tên hợp âm.'
- id: n27
  cau: Nốt lặp nhanh trong các sonata của Scarlatti thường được cho là gợi guitar Tây Ban Nha.
  loai: dinh-nghia
  nguon:
  - cod-scarlatti
  - wiki-scarlatti
  ket_qua: null
  ghi_chu: 'chưa chắc: COD, Scarlatti: "Introduced many new technical devices (rapid repetitions, crossed hands, double-note passages, etc.)" và sống ở Tây Ban Nha, nhưng không nói guitar; Wikipedia (bậc 3): "The influence of the Spanish guitar can be seen in notes being played repeatedly"; chương sách của Indiana University Press về nhạc piano Tây Ban Nha (nguồn học thuật) không mở được nội dung. Chữ cũ "Nốt lặp nhanh và hợp âm gõ … gợi guitar": đã bỏ "hợp âm gõ" (không nguồn) và hạ giọng thành "thường được cho là". Người giao quyết: tìm nguồn bậc 1–2 hay bỏ câu. Link hướng dẫn nghe Scarlatti: chưa chuyển, "sắp có".'
- id: n28
  cau: Những bức tranh ở phòng triển lãm của Mussorgsky vốn viết cho piano, về sau Ravel phối cho dàn nhạc.
