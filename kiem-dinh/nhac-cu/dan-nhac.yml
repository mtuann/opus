nhan_dinh:
  - id: d1
    cau: Một dàn nhạc giao hưởng đầy đủ thường có khoảng 90–100 nhạc công.
    loai: so-lieu
    nguon:
      - br-orchestra
      - cod-orchestra
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "hiện đại có khoảng 70–100 nhạc công" (cả description và thân bài). Chữ mới "đầy đủ thường có khoảng 90–100". Lý do: các nguồn nêu dàn nhạc giao hưởng đầy đủ khoảng 90–100 người; 70 là dàn nhạc nhỏ hơn.'
  - id: d2
    cau: "Dàn nhạc giao hưởng chia thành bốn bộ: dây, gỗ, đồng, gõ."
    loai: dinh-nghia
    nguon:
      - cod-orchestra
      - br-orchestra
    ket_qua: dung
    ghi_chu: "Britannica và COD, Orchestra: bốn nhóm dây, gỗ, đồng, gõ (đàn hạc, piano, celesta đứng riêng hay xếp thêm)."
  - id: d3
    cau: Bộ dây là bộ đông nhất; nhạc cụ kéo vĩ, cũng có thể gảy dây (pizzicato); đàn hạc chỉ gảy.
    loai: dinh-nghia
    nguon:
      - br-orchestra
      - cod-pizzicato
      - vsl-harp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: bộ đông nhất, "là trái tim của dàn nhạc"; kéo vĩ, cũng gảy (pizzicato). Bỏ "trái tim" (lời văn, không kiểm được); thêm "đàn hạc chỉ gảy". COD, Pizzicato: gảy dây bằng ngón. VSL xếp harp vào strings; bài 20 xếp hạc riêng trong tổng phổ (không mâu thuẫn: bảng ở đây theo cách VSL).'
  - id: d4
    cau: "Violin chia hai bè: violin 1 thường chơi bè cao hơn, violin 2 thường bổ trợ ở âm vực trung; violin là nhạc cụ cao nhất bộ dây."
    loai: dinh-nghia
    nguon:
      - vsl-violin
      - br-orchestra
    ket_qua: da-sua
    ghi_chu: Chữ cũ "violin 1 thường chơi giai điệu chính, violin 2 hỗ trợ". Chữ mới hạ giọng như bài 20 (bỏ nhận định "giai điệu chính", không có nguồn bậc 1–2).
  - id: d5
    cau: Viola lớn hơn violin một chút, âm trầm ấm; đọc khóa Đô.
    loai: dinh-nghia
    nguon:
      - vsl-viola
    ket_qua: dung
    ghi_chu: "VSL, viola: khóa Đô alto; âm vực thấp hơn violin quãng năm. Đối chiếu bài 17 (đã khóa)."
  - id: d6
    cau: Cello đặt giữa hai chân; âm sắc thường được ví với giọng nam.
    loai: dinh-nghia
    nguon:
      - vsl-cello
    ket_qua: da-sua
    ghi_chu: Chữ cũ "âm sắc gần giọng người". Chữ mới thu hẹp lại như nguồn nói (giọng nam).
  - id: d7
    cau: Contrabass trầm nhất bộ dây, đứng hoặc ngồi ghế cao, giữ nền bè trầm.
    loai: dinh-nghia
    nguon:
      - vsl-double-bass
    ket_qua: dung
  - id: d8
    cau: Đàn hạc gảy dây, hay dùng glissando (lướt qua các dây liền nhau).
    loai: dinh-nghia
    nguon:
      - vsl-harp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "Gảy; thường tạo hiệu ứng lấp lánh". Chữ mới: glissando là kỹ thuật đặc trưng của harp theo VSL; "lấp lánh" là lời văn, bỏ.'
  - id: d9
    cau: "Bộ gỗ: tên gọi đến từ chất liệu vốn là gỗ; ngày nay không phải nhạc cụ nào cũng bằng gỗ (sáo thường bằng bạc hay hợp kim)."
    loai: dinh-nghia
    nguon:
      - cod-woodwind
      - vsl-concert-flute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "tên gọi đến từ nguồn gốc và cách tạo âm". Chữ mới nói đúng chất liệu; VSL, flute: sáo hiện đại bằng kim loại.'
  - id: d10
    cau: "Sáo (flute): thổi qua lỗ; piccolo là sáo nhỏ, cao hơn một quãng tám."
    loai: dinh-nghia
    nguon:
      - vsl-concert-flute
      - cod-piccolo
    ket_qua: dung
    ghi_chu: 'COD, Piccolo: sáo nhỏ, cao hơn flute một quãng tám. "Trong, nhẹ" là lời mô tả âm sắc, theo VSL.'
  - id: d11
    cau: "Oboe: dăm kép, âm sáng, xuyên, có chất dăm; dàn nhạc thường lên dây theo nốt La của oboe."
    loai: dinh-nghia
    nguon:
      - vsl-oboe
      - sfs-oboe
      - classicfm-oboe
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "Âm hơi mũi, rõ; dàn nhạc lên dây theo nốt La của oboe". Chữ mới: bỏ "hơi mũi"; thêm "thường". SF Symphony (bậc 2): oboe giữ nốt La để cả dàn nhạc lên dây.'
  - id: d12
    cau: "Clarinet: dăm đơn, mềm mại, âm vực rộng."
    loai: dinh-nghia
    nguon:
      - cod-clarinet
      - vsl-clarinet
    ket_qua: dung
    ghi_chu: "COD: dăm đơn. VSL: âm vực rộng."
  - id: d13
    cau: "Bassoon (fagotto): dăm kép, trầm; đôi khi hài hước."
    loai: dinh-nghia
    nguon:
      - cod-bassoon
      - vsl-bassoon
    ket_qua: null
    ghi_chu: 'chưa chắc: dăm kép, trầm, tên fagotto đúng (COD, VSL); "đôi khi hài hước" chưa có nguồn bậc 1–2. Lượt 2 xem xét có giữ.'
  - id: d14
    cau: "Kèn horn (cor): âm tròn, ấm; nối giữa bộ gỗ và bộ đồng."
    loai: dinh-nghia
    nguon:
      - vsl-horn
    ket_qua: null
    ghi_chu: 'chưa chắc: "tròn, ấm" theo VSL; "nối giữa bộ gỗ và bộ đồng" chưa thấy ở nguồn nào đã mở. Người giao quyết: giữ hay bỏ vế sau.'
  - id: d15
    cau: "Trumpet: sáng, vang, oai hùng."
    loai: dinh-nghia
    nguon:
      - vsl-trumpet
    ket_qua: dung
    ghi_chu: "VSL, trumpet: âm sáng, vang (mô tả âm sắc)."
  - id: d16
    cau: Trombone có ống trượt; uy nghi, mạnh mẽ.
    loai: dinh-nghia
    nguon:
      - cod-trombone
      - vsl-trombone
    ket_qua: dung
    ghi_chu: "COD: ống trượt."
  - id: d17
    cau: Tuba là nhạc cụ trầm nhất bộ đồng.
    loai: dinh-nghia
    nguon:
      - br-tuba
      - vsl-tuba
    ket_qua: dung
    ghi_chu: "Britannica, Tuba: nhạc cụ đồng trầm nhất."
  - id: d18
    cau: Timpani (trống định âm) là loại trống lên dây theo cao độ xác định.
    loai: dinh-nghia
    nguon:
      - cod-drum
      - grinnell-timp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "Timpani có cao độ và là nhạc cụ gõ quan trọng nhất". Bỏ "quan trọng nhất" (đánh giá không có nguồn); COD, Drum: trống lên dây theo cao độ xác định.'
  - id: d19
    cau: Ngoài timpani còn trống lớn, trống con, cymbal, triangle, glockenspiel, xylophone, chuông ống.
    loai: danh-muc
    nguon:
      - cod-drum
      - br-orchestra
    ket_qua: dung
  - id: d20
    cau: Dàn nhạc thời Cổ điển thường chỉ có timpani trong bộ gõ.
    loai: lich-su
    nguon:
      - kuz-1305
    ket_qua: dung
    ghi_chu: 'Kuznetsova 13.05: dàn nhạc Cổ điển có hai timpani, bộ gõ ít khác. Câu có chữ "thường".'
  - id: d21
    cau: "Chỗ ngồi: bộ dây ở phía trước (violin 1 bên trái, cello và contrabass bên phải, nhìn từ khán giả); bộ gỗ ở giữa; bộ đồng và bộ gõ phía sau; nhạc trưởng đứng giữa, quay lưng về khán giả; bố trí thay đổi tùy dàn nhạc."
    loai: dinh-nghia
    nguon:
      - berlin-seating
      - school-layout
    ket_qua: da-sua
    ghi_chu: Chữ cũ "bộ dây ở phía trước tạo thành hình quạt". Bỏ "hình quạt" (không nguồn). Cách xếp khớp n11 và n12 của bài 20 (đã khóa); câu đã dè dặt.
  - id: d22
    cau: Trang có hình "Sơ đồ chỗ ngồi" (seating) và hình "Âm vực các nhạc cụ" (ranges-orchestra), và chữ trang khớp hình.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Hình seating (src/components/hinh/seating.html, đã khóa D3-L3): chữ trong hình tiếng Anh "Harp", "Contra-bass", trang dùng "Đàn hạc", "Contrabass" (lệch nhỏ, người giao quyết có đồng nhất). Thứ tự các bộ khớp d21. Hình ranges-orchestra: hàng đầu là Piano (A0–C8), khớp "dải trên cùng là toàn bộ 88 phím" (đã sửa từ "dải dưới cùng"). Hình có thêm Guitar dù chữ trang không nói đến.'
    review: dung
  - id: d23
    cau: "Peter và chó sói (Prokofiev, 1936): có người kể, mỗi nhân vật một nhạc cụ: Peter bộ dây, chim sáo, vịt oboe, mèo clarinet, ông nội bassoon, chó sói ba kèn horn, tiếng súng timpani và trống lớn."
    loai: lich-su
    nguon:
      - hb-peter
    ket_qua: dung
    ghi_chu: "Hollywood Bowl (Orrin Howard) và bản chương trình Boise Philharmonic: người dẫn chuyện, 7 nhân vật và nhạc cụ khớp; năm 1936. Prokofiev 1891–1953 trong nha-soan-nhac.yml; trang không ghi năm sinh–mất."
  - id: d24
    cau: Britten, The Young Person's Guide to the Orchestra (1946) dùng chủ đề của Henry Purcell, lần lượt giới thiệu từng nhạc cụ từ cao xuống thấp trong từng bộ, kết bằng một fugue lớn.
    loai: lich-su
    nguon:
      - hb-yp
    ket_qua: dung
    ghi_chu: "Hollywood Bowl: chủ đề của Purcell, các bộ theo thứ tự, kết bằng fugue. Khớp hinh-thuc/fugue (đã khóa)."
  - id: d25
    cau: "Bài tập 2: Giao hưởng số 5 của Beethoven, chương 1: kèn horn dẫn vào chủ đề 2."
    loai: lich-su
    nguon:
      - bhso-b5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "horn giới thiệu chủ đề 2". Burgess Hill SO: tiếng gọi của horn "introduces the second subject". Chữ mới "dẫn vào" như bài 20 n28.'
  - id: d26
    cau: "Bài tập 3: Ravel, Boléro, hai giai điệu lặp đi lặp lại, mỗi lần do một nhạc cụ hay nhóm nhạc cụ khác trình bày."
    loai: cau-truc
    nguon:
      - tucson-bolero
    ket_qua: da-sua
