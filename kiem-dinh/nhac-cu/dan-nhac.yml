    moi: "mô tả: Một dàn nhạc giao hưởng đầy đủ thường có khoảng 90–100 nhạc công, chia thành bốn bộ. Nhận ra từng nhạc cụ khi nghe là bước lớn để nghe giao hưởng có chủ đích."
    ly_do: "d1 (da-sua): mô tả: dàn nhạc đầy đủ thường 90–100 nhạc công."
