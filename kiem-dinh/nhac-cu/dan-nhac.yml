    ghi_chu: 'Review D5-gom (da-sua): chữ cũ "Trumpet (B♭) từ E3 đến C6", chữ mới "Trumpet (C) từ F♯3 đến C6." (sửa src/components/hinh/ranges-orchestra.html). Hình cũ ghi "Trumpet (B♭)" E3–C6: E3 là âm thực, C6 là âm viết của trumpet B♭ (lượt 2: âm thực E3–B♭5, âm viết F♯3–C6), lẫn hai quy ước. VSL chỉ có trang trumpet in C (review đã mở): "Range of the trumpet in C: F#3 - C6 (occasionally F6)", "a non-transposing instrument, i.e. the sound is as written". Hình đổi nhãn thành "Trumpet (C)", F♯3–C6 (âm thực = âm viết), khớp quy ước âm thanh thật của hình. Cả hình ranges-orchestra nay theo một nguồn bậc 2 nhất quán (VSL Academy; contrabass, tuba, piano theo hai nguồn đã ghi), ghi âm thanh thật (chú thích hình: "âm thanh thật, gần đúng"). Lượt 2 trước: khong-chac: Hyperphysics: trumpet B♭ E3–B♭5 (âm thực); trang Bradford F#3–C6 (viết). Câu ghi E3 (âm thực) với C6 (âm viết) lẫn hai quy ước: không nguồn nào cho đúng E3–C6.. Cần lượt 2 bổ sung cho giá trị mới. Người gom (D5-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, VSL, OMT, IMSLP lỗi hay chặn) hay vì câu tả ví dụ soạn mà danh sách không kèm mã, không phải vì nguồn nói khác; giữ theo nguồn review đã mở, ghi ở trên.'
