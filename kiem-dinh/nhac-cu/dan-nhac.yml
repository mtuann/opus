khuong_nhac: []
ghi_chu: 'Trang dàn nhạc giao hưởng (tầng lõi), hai hình (seating, ranges-orchestra), không có khối abc. Nguồn: COD (Encyclopedia.com), Britannica, VSL Academy, Orchestral Library, Grinnell, SF Symphony, Berlin Phil, Hollywood Bowl, Tucson Symphony, Burgess Hill SO; sơ đồ trường học và Classic FM là bậc 3 (chỉ bổ trợ). Chỗ sửa trang: d1, d3, d4, d6, d8, d9, d11, d18, d21, d25, d26; lỗi thật: "dải dưới cùng" (piano) sửa thành "dải trên cùng". Hình ranges-orchestra lệch nguồn: violin (đỉnh E7, nguồn A7), sáo (đỉnh C7, nguồn D7), bassoon (đỉnh E5, nguồn E♭5); viola hai nguồn mâu thuẫn (d29, d30, d35, d38). Hình seating: nhãn "Harp", "Contra-bass". Chưa chắc: d13, d14. Trang đích chưa chuyển: /opus/nghe-nhac/beethoven-5/ (cần giữ câu horn giới thiệu chủ đề 2; trang ghi "dẫn vào"). Thuật ngữ chưa có: orchestra, woodwind, brass, percussion, strings, tên các nhạc cụ, timpani, score. Ràng buộc lô trước: hinh-thuc/fugue (giữ đường dẫn nhac-cu/dan-nhac, khớp), lich-su/thoi-ky/the-ky-20 (Peter và chó sói, khớp). Review D5-gom (29/10/2026): hình ranges-orchestra sửa theo VSL Academy, âm thanh thật: violin A7, viola A6, sáo D7, bassoon E♭5, trumpet đổi thành Trumpet (C) F♯3–C6, timpani C2–C4, bỏ Guitar (d29, d30, d35, d38, d40, d43, d44). d13 dung; d14 viết lại theo VSL; d15 dung. Nguồn vsl-horn/-trumpet/-trombone/-tuba (link không mở được) thay bằng vsl-horn-f, -trumpet-c, -tenor-trombone, -bass-tuba. Hình seating (đã khóa) còn "Harp", "Contra-bass".'
doi_chu:
  - cu: Một dàn nhạc giao hưởng hiện đại có khoảng 70–100 nhạc công, chia thành bốn bộ. Nhận ra từng nhạc cụ khi nghe là bước lớn để nghe giao hưởng có chủ đích.
    moi: Một dàn nhạc giao hưởng đầy đủ thường có khoảng 90–100 nhạc công, chia thành bốn bộ. Nhận ra từng nhạc cụ khi nghe là bước lớn để nghe giao hưởng có chủ đích.
    ly_do: "d1 (da-sua): con số theo nguồn.; d1 (da-sua): mô tả đổi theo câu mở đầu: dàn nhạc đầy đủ thường 90–100 nhạc công (nguồn trong hồ sơ)."
  - cu: Bộ đông nhất, là "trái tim" của dàn nhạc. Các nhạc cụ kéo vĩ, cũng có thể gảy (pizzicato).
    moi: Bộ đông nhất của dàn nhạc. Các nhạc cụ kéo vĩ, cũng có thể gảy dây (pizzicato); đàn hạc chỉ gảy.
    ly_do: "d3 (da-sua): bỏ lời văn, thêm đàn hạc."
  - cu: "Chia hai bè: violin 1 thường chơi giai điệu chính, violin 2 hỗ trợ"
    moi: "Chia hai bè: violin 1 thường chơi bè cao hơn, violin 2 thường bổ trợ ở âm vực trung"
    ly_do: 'd4 (da-sua): không có nguồn cho "giai điệu chính".'
  - cu: Đặt giữa hai chân; âm sắc gần giọng người
    moi: Đặt giữa hai chân; âm sắc thường được ví với giọng nam
    ly_do: "d6 (da-sua): theo VSL."
  - cu: Gảy; thường tạo hiệu ứng lấp lánh
    moi: Gảy dây; hay dùng glissando (lướt qua các dây liền nhau)
    ly_do: "d8 (da-sua): theo VSL."
  - cu: Ngày nay không phải nhạc cụ nào cũng làm bằng gỗ; tên gọi đến từ nguồn gốc và cách tạo âm.
    moi: Tên gọi đến từ chất liệu vốn là gỗ; ngày nay không phải nhạc cụ nào cũng làm bằng gỗ (sáo thường bằng bạc hay hợp kim).
    ly_do: "d9 (da-sua): nói đúng nguồn gốc tên gọi."
  - cu: Âm hơi mũi, rõ; dàn nhạc lên dây theo nốt La của oboe
    moi: Âm sáng, xuyên, có chất dăm; dàn nhạc thường lên dây theo nốt La của oboe
    ly_do: 'd11 (da-sua): bỏ "hơi mũi"; thêm "thường".'
  - cu: Tròn, ấm; nối giữa bộ gỗ và bộ đồng
    moi: Ấm, đầy đặn; hòa tiếng tốt với bộ gỗ và với cả dàn nhạc
    ly_do: 'd14 (da-sua, review D5-gom): theo VSL horn in F ("Full, warm…"; hòa tiếng tốt với bộ gỗ và mọi bộ); không có nguồn cho "nối giữa bộ gỗ và bộ đồng".'
  - cu: Timpani (trống định âm) có cao độ và là nhạc cụ gõ quan trọng nhất. Ngoài ra còn trống lớn, trống con, cymbal, triangle, glockenspiel, xylophone, chuông ống… Dàn nhạc thời Cổ điển thường chỉ có timpani.
    moi: Timpani (trống định âm) là loại trống lên dây theo cao độ xác định. Ngoài ra còn trống lớn, trống con, cymbal, triangle, glockenspiel, xylophone, chuông ống… Dàn nhạc thời Cổ điển thường chỉ có timpani.
    ly_do: 'd18 (da-sua): bỏ "quan trọng nhất".'
  - cu: "Nhìn từ khán giả: bộ dây ở phía trước tạo thành hình quạt (violin 1 bên trái, cello và contrabass bên phải); bộ gỗ ở giữa; bộ đồng và bộ gõ ở phía sau. Nhạc trưởng đứng giữa, quay lưng về phía khán giả. Bố trí có thể thay đổi tùy dàn nhạc và tác phẩm."
    moi: "Nhìn từ khán giả: bộ dây ở phía trước (violin 1 bên trái, cello và contrabass bên phải); bộ gỗ ở giữa; bộ đồng và bộ gõ ở phía sau. Nhạc trưởng đứng giữa, quay lưng về phía khán giả. Bố trí có thể thay đổi tùy dàn nhạc và tác phẩm."
    ly_do: "d21 (da-sua): không có nguồn."
  - cu: "Mỗi nhạc cụ chỉ chơi được trong một khoảng cao độ nhất định. So với bàn phím piano (dải dưới cùng là toàn bộ 88 phím):"
    moi: "Mỗi nhạc cụ chỉ chơi được trong một khoảng cao độ nhất định. So với bàn phím piano (dải trên cùng là toàn bộ 88 phím):"
    ly_do: "d9 (da-sua, lượt 1 D5-L3): thanh piano nằm ở dải trên cùng của hình ranges-orchestra, không phải dưới cùng."
  - cu:
      - "Nghe Giao hưởng số 5 của Beethoven, chương 1: tìm chỗ kèn horn giới thiệu chủ đề 2."
      - "Nghe Ravel Boléro: cùng một giai điệu được chuyền qua nhiều nhạc cụ khác nhau. Bạn nhận ra được bao nhiêu?"
    moi:
      - "Nghe Giao hưởng số 5 của Beethoven, chương 1: tìm chỗ kèn horn dẫn vào chủ đề 2."
      - "Nghe Ravel Boléro: hai giai điệu lặp đi lặp lại, mỗi lần do một nhạc cụ hay một nhóm nhạc cụ khác trình bày. Bạn nhận ra được bao nhiêu?"
    ly_do: "d25 (da-sua): Burgess Hill SO; khớp bài 20 n28.; d26 (da-sua): Tucson Symphony."
  - moi:
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: Orchestra, Woodwind, Clarinet, Bassoon, Piccolo, Trombone, Pizzicato, Drum (gồm timpani, trống lớn, trống con). Encyclopaedia Britannica: Orchestra."
      - "Vienna Symphonic Library, Academy (âm vực, âm sắc, cách chơi): violin, viola, cello, double bass, harp, piccolo, flute, oboe, clarinet, bassoon, horn, trumpet, trombone, tuba, timpani. Đối chiếu âm vực: Orchestral Library, bảng âm vực."
      - "Dàn nhạc lên dây theo oboe: Classic FM, San Francisco Symphony. Chỗ ngồi: Berliner Philharmoniker, sơ đồ của một trường học."
      - "Hollywood Bowl: Peter and the Wolf, The Young Person's Guide to the Orchestra. Tucson Symphony Orchestra, Boléro. Burgess Hill Symphony Orchestra, Beethoven, Giao hưởng số 5."
    ly_do: "Mục Nguồn (lượt 1 D5-L3): thêm các mục COD và trang dàn nhạc đã mở.; review D5-gom: âm vực trong hình theo VSL (thêm timpani), bỏ link Grinnell (guitar bỏ khỏi hình, timpani theo VSL)."
