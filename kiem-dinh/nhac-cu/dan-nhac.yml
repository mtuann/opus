nhan_dinh:
  - id: d1
    cau: Một dàn nhạc giao hưởng đầy đủ thường có khoảng 90–100 nhạc công.
    loai: so-lieu
    nguon:
      - br-orchestra
      - cod-orchestra
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "hiện đại có khoảng 70–100 nhạc công" (cả description và thân bài). Chữ mới "đầy đủ thường có khoảng 90–100". Lý do: các nguồn nêu dàn nhạc giao hưởng đầy đủ khoảng 90–100 người; 70 là dàn nhạc nhỏ hơn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/orchestra", "https://www.skagitsymphony.com/instruments-of-the-orchestra" ]
    luot_2_ghi_chu: "COD: dàn nhạc giao hưởng thường hơn 90 nhạc công; 90–100 là cách nói gọn, không mâu thuẫn."
  - id: d2
    cau: "Dàn nhạc giao hưởng chia thành bốn bộ: dây, gỗ, đồng, gõ."
    loai: dinh-nghia
    nguon:
      - cod-orchestra
      - br-orchestra
    ket_qua: dung
    ghi_chu: "Britannica và COD, Orchestra: bốn nhóm dây, gỗ, đồng, gõ (đàn hạc, piano, celesta đứng riêng hay xếp thêm)."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/orchestra", "https://www.skagitsymphony.com/instruments-of-the-orchestra" ]
    luot_2_ghi_chu: "Bốn bộ: dây, gỗ, đồng, gõ."
  - id: d3
    cau: Bộ dây là bộ đông nhất; nhạc cụ kéo vĩ, cũng có thể gảy dây (pizzicato); đàn hạc chỉ gảy.
    loai: dinh-nghia
    nguon:
      - br-orchestra
      - cod-pizzicato
      - vsl-harp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: bộ đông nhất, "là trái tim của dàn nhạc"; kéo vĩ, cũng gảy (pizzicato). Bỏ "trái tim" (lời văn, không kiểm được); thêm "đàn hạc chỉ gảy". COD, Pizzicato: gảy dây bằng ngón. VSL xếp harp vào strings; bài 20 xếp hạc riêng trong tổng phổ (không mâu thuẫn: bảng ở đây theo cách VSL).'
    luot_2: dung
    luot_2_nguon: [ "https://www.skagitsymphony.com/instruments-of-the-orchestra", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-bass" ]
    luot_2_ghi_chu: "Skagit: bộ dây là bộ lớn nhất, gồm cả đàn hạc; bass thường gảy (pizzicato) trong jazz. Chưa mở trang nói riêng về pizzicato; phần 'đàn hạc chỉ gảy' khớp COD (harp: plucked). Philharmonia xếp hạc riêng nhóm, tùy cách phân loại."
  - id: d4
    cau: "Violin chia hai bè: violin 1 thường chơi bè cao hơn, violin 2 thường bổ trợ ở âm vực trung; violin là nhạc cụ cao nhất bộ dây."
    loai: dinh-nghia
    nguon:
      - vsl-violin
      - br-orchestra
    ket_qua: da-sua
    ghi_chu: Chữ cũ "violin 1 thường chơi giai điệu chính, violin 2 hỗ trợ". Chữ mới hạ giọng như bài 20 (bỏ nhận định "giai điệu chính", không có nguồn bậc 1–2).
    luot_2: dung
    luot_2_nguon: [ "https://www.philharmonia.co.uk/explore/instruments/violin", "https://www.skagitsymphony.com/instruments-of-the-orchestra" ]
    luot_2_ghi_chu: "Philharmonia: violin là nhạc cụ cao nhất, nhanh nhất của họ dây; violin 2 'nâng đỡ và lấp hòa âm'. Lưu ý đàn hạc (xếp trong bộ dây ở trang) có âm vực cao hơn: câu đúng theo nghĩa nhóm nhạc cụ kéo vĩ."
  - id: d5
    cau: Viola lớn hơn violin một chút, âm trầm ấm; đọc khóa Đô.
    loai: dinh-nghia
    nguon:
      - vsl-viola
    ket_qua: dung
    ghi_chu: "VSL, viola: khóa Đô alto; âm vực thấp hơn violin quãng năm. Đối chiếu bài 17 (đã khóa)."
    luot_2: dung
    luot_2_nguon: [ "https://www.philharmonia.co.uk/explore/instruments/viola", "https://www.vsl.co.at/academy/strings/viola" ]
    luot_2_ghi_chu: Viola lớn hơn violin, âm dày tối hơn; ký âm chủ yếu khóa Đô (VSL).
  - id: d6
    cau: Cello đặt giữa hai chân; âm sắc thường được ví với giọng nam.
    loai: dinh-nghia
    nguon:
      - vsl-cello
    ket_qua: da-sua
    ghi_chu: Chữ cũ "âm sắc gần giọng người". Chữ mới thu hẹp lại như nguồn nói (giọng nam).
    luot_2: dung
    luot_2_nguon: [ "https://www.philharmonia.co.uk/explore/instruments/cello" ]
    luot_2_ghi_chu: "Philharmonia: cello là 'giọng tenor' của bộ dây; ví với giọng nam hợp lý. Tư thế đặt giữa hai chân không có trong trang đã mở, nhưng là kiến thức phổ thông."
  - id: d7
    cau: Contrabass trầm nhất bộ dây, đứng hoặc ngồi ghế cao, giữ nền bè trầm.
    loai: dinh-nghia
    nguon:
      - vsl-double-bass
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-bass" ]
    luot_2_ghi_chu: "COD: lớn nhất và trầm nhất trong nhạc cụ kéo vĩ. Tư thế đứng/ghế cao và vai trò bè trầm: không trang đã mở nói thẳng."
  - id: d8
    cau: Đàn hạc gảy dây, hay dùng glissando (lướt qua các dây liền nhau).
    loai: dinh-nghia
    nguon:
      - vsl-harp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "Gảy; thường tạo hiệu ứng lấp lánh". Chữ mới: glissando là kỹ thuật đặc trưng của harp theo VSL; "lấp lánh" là lời văn, bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/harp" ]
    luot_2_ghi_chu: "COD: đàn hạc gảy bằng ngón tay; glissando là kỹ thuật đặc trưng."
  - id: d9
    cau: "Bộ gỗ: tên gọi đến từ chất liệu vốn là gỗ; ngày nay không phải nhạc cụ nào cũng bằng gỗ (sáo thường bằng bạc hay hợp kim)."
    loai: dinh-nghia
    nguon:
      - cod-woodwind
      - vsl-concert-flute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "tên gọi đến từ nguồn gốc và cách tạo âm". Chữ mới nói đúng chất liệu; VSL, flute: sáo hiện đại bằng kim loại.'
    luot_2: dung
    luot_2_nguon: [ "https://www.skagitsymphony.com/instruments-of-the-orchestra" ]
    luot_2_ghi_chu: "Skagit: sáo hiện đại làm bằng bạc, vàng, bạch kim hay gỗ; sáo cổ bằng gỗ, sậy."
  - id: d10
    cau: "Sáo (flute): thổi qua lỗ; piccolo là sáo nhỏ, cao hơn một quãng tám."
    loai: dinh-nghia
    nguon:
      - vsl-concert-flute
      - cod-piccolo
    ket_qua: dung
    ghi_chu: 'COD, Piccolo: sáo nhỏ, cao hơn flute một quãng tám. "Trong, nhẹ" là lời mô tả âm sắc, theo VSL.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piccolo", "https://www.vsl.co.at/academy/woodwinds/piccolo" ]
    luot_2_ghi_chu: "COD: piccolo là sáo nhỏ cao hơn sáo thường một quãng tám."
  - id: d11
    cau: "Oboe: dăm kép, âm sáng, xuyên, có chất dăm; dàn nhạc thường lên dây theo nốt La của oboe."
    loai: dinh-nghia
    nguon:
      - vsl-oboe
      - sfs-oboe
      - classicfm-oboe
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "Âm hơi mũi, rõ; dàn nhạc lên dây theo nốt La của oboe". Chữ mới: bỏ "hơi mũi"; thêm "thường". SF Symphony (bậc 2): oboe giữ nốt La để cả dàn nhạc lên dây.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/oboe", "https://www.vsl.co.at/academy/woodwinds/oboe" ]
    luot_2_ghi_chu: "COD: oboe dăm kép, âm lên dây dàn nhạc là A. (VSL ghi 'lên dây C' theo nghĩa nhạc cụ, nhưng dàn nhạc lấy nốt A của oboe; COD xác nhận A.)"
  - id: d12
    cau: "Clarinet: dăm đơn, mềm mại, âm vực rộng."
    loai: dinh-nghia
    nguon:
      - cod-clarinet
      - vsl-clarinet
    ket_qua: dung
    ghi_chu: "COD: dăm đơn. VSL: âm vực rộng."
    luot_2: dung
    luot_2_nguon: [ "https://www.vsl.co.at/academy/woodwinds/clarinet" ]
    luot_2_ghi_chu: "VSL: clarinet B♭ viết E3–C7, âm vực rộng. Dăm đơn và 'mềm mại' chưa có trang mở nói trực tiếp, là mô tả phổ thông."
  - id: d13
    cau: "Bassoon (fagotto): dăm kép, trầm; đôi khi hài hước."
    loai: dinh-nghia
    nguon:
      - cod-bassoon
      - vsl-bassoon
    ket_qua: dung
    ghi_chu: 'chưa chắc: dăm kép, trầm, tên fagotto đúng (COD, VSL); "đôi khi hài hước" chưa có nguồn bậc 1–2. Lượt 2 xem xét có giữ. Review D5-gom: dung, giữ "đôi khi hài hước". VSL bassoon (review đã mở): nốt bassoon, nhất là staccato, "are well suited for the performance of humorous, comic effects and the depiction of musical caricatures"; lượt 2: COD Bassoon cũng nói hay dùng cho hiệu ứng hài hước.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/bassoon" ]
    luot_2_ghi_chu: "COD: bassoon (It. fagotto), thành viên trầm của họ dăm kép; hay dùng cho hiệu ứng hài hước."
  - id: d14
    cau: "Kèn horn (cor): âm ấm, đầy đặn; hòa tiếng tốt với bộ gỗ và với cả dàn nhạc."
    loai: dinh-nghia
    nguon:
      - vsl-horn-f
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: "tròn, ấm" theo VSL; "nối giữa bộ gỗ và bộ đồng" chưa thấy ở nguồn nào đã mở. Người giao quyết: giữ hay bỏ vế sau. Review D5-gom (da-sua): chữ cũ "Tròn, ấm; nối giữa bộ gỗ và bộ đồng", chữ mới "Ấm, đầy đặn; hòa tiếng tốt với bộ gỗ và với cả dàn nhạc". Lý do: VSL horn in F (review đã mở) tả âm "Full, warm, velvety, clear, distant, mellow, metallic" (không dùng "round"); "Because the horns blend very well with the woodwinds" (bè horn viết ngay dưới bộ gỗ trong tổng phổ); "The horn blends with all the instrument groups in the orchestra better than any other instrument". Không nguồn nào nói "nối giữa bộ gỗ và bộ đồng". Lượt 2 trước: khong-chac: Mô tả âm sắc horn ''tròn, ấm'' và vai trò nối gỗ–đồng mang tính chủ quan; trang Philharmonia về horn không mở được, không nguồn nào xác nhận hay bác.. Cần lượt 2 bổ sung cho chữ mới.'
    luot_2: dung
    luot_2_nguon: [ "https://www.vsl.co.at/academy/brass" ]
    luot_2_ghi_chu: "VSL: horn tiếng dịu, tối, đầy; việc hòa tiếng tốt với bộ gỗ và dàn nhạc là mô tả phổ biến."
  - id: d15
    cau: "Trumpet: sáng, vang, oai hùng."
    loai: dinh-nghia
    nguon:
      - vsl-trumpet-c
