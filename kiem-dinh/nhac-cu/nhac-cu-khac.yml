tang: ngoai-vi
lan:
  - so: 1
    ngay: 2026-11-05
    nhanh: moi/d7-d8-kiem-mau
    ma_bam: sha256:c3c9c7d2809925b66cb421e8656d9abc5e4cedc787ec0602a3b15a262997b208
    nguoi:
      luot_1: Claude Sonnet 5.5 (D8-L2 lượt 1, phần 2/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 8, 05/11/2026); Claude Opus 5.5 (lượt 2 làm lại cho câu khong-chac của lượt 2 bổ sung)
      review: Claude Opus 5.5 (review D8-gom, 05/11/2026)
      kiem_mau: "Claude Opus 5.5, kiểm thay chủ repo theo lời giao 05/11/2026 (chủ repo không tự kiểm): 12 nhận định mẫu của đợt 8, 9 đúng, 2 sai đã sửa (nhac-cu/trumpet n8 Si♭ và Đô là hai loại dùng nhiều nhất; n19 bè Baroque nay chơi bằng piccolo hoặc trumpet tự nhiên kiểu cổ; sửa theo cả n16, n25), 1 không kiểm được (nu-nha-soan-nhac n84: nguồn chỉ có bản lưu Wayback, bị chặn) (bao-cao/d8-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc; có hình ranges-voices (hình tĩnh). HÌNH KHÁC TRANG CŨ (người giao ghi doi_chu): hình ranges-voices đã sửa ở D5 so với site cũ (cũ: sáu giọng, tên nốt kiểu C4, âm vực hơi khác; mới: bảy giọng, thêm Countertenor, tên nốt Việt Đô4…, âm vực mới theo COD và OnMusic). Nguồn mở được ngày 05/11/2026: COD (Encyclopedia.com), Baker (Encyclopedia.com), IMSLP, Bate Collection (Oxford), Hall (The Diapason 2013), NATS Journal of Singing 2023, Chorus America. Chưa quyết: h5 (âm vực countertenor Sol3–Sol5, null), và vài nguồn bậc 3 cho c5. Chữ đã sửa: câu mở đầu và câu âm vực (i2, i3: trang dan-nhac không có giọng hát, organ, harpsichord), giọng hát (v1, v11, v12), organ (o1–o6, o13), harpsichord (c1, c5, c11). doi_chu viết tay từ khối của dist/ cũ (dist chưa build lại sau sửa): người giao chạy node tools/chuyen/so-chu.mjs nhac-cu/nhac-cu-khac --doi-chu sau khi build, và ghi thêm doi_chu của hình ranges-voices theo mô tả trên. Thuật ngữ trang dùng chưa có bản ghi ở src/data/thuat-ngu.yml (cho D3-L5; không tạo): manual, pedalboard, stop (đổi âm sắc organ), harpsichord, organ, contralto/alto, countertenor, toccata, fugue.'
