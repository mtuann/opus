nhan_dinh:
  - id: n1
    cau: Trang nói piano (mục Piano), violin, guitar, cello, sáo, clarinet, trumpet có trang riêng; giọng hát, organ, harpsichord là ba "giọng nói" quan trọng khác.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm: src/content/docs/nhac-cu/ có violin.md, guitar.md, cello.md, sao.md, clarinet.md, trumpet.md; piano/index.md có (mục Piano); link /opus/piano/ và /opus/nhac-cu/<tên>/ đúng. "Ba giọng nói quan trọng khác" là cách nói của trang, ba mục Giọng hát, Organ, Harpsichord đúng là ba mục trang. Review D8-gom: dòng 6 của trang: link /opus/piano/ và sáu trang nhạc cụ đều có trong src/content/docs/; ba mục Giọng hát, Organ, Harpsichord là ba mục của trang.'
    review: dung
  - id: n2
    cau: Xem thêm vị trí của các nhạc cụ khác trong dàn nhạc giao hưởng.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Xem thêm vị trí của chúng trong dàn nhạc giao hưởng" ("chúng" = giọng hát, organ, harpsichord). Kiểm nhac-cu/dan-nhac.md: sơ đồ chỗ ngồi (hình seating) và âm vực (ranges-orchestra) chỉ có nhạc cụ dàn nhạc; không có giọng hát, organ, harpsichord (chỉ piano trong thang âm vực). Đổi thành "các nhạc cụ khác". Người giao ghi doi_chu. Review D8-gom: dòng 6: "Xem thêm vị trí của các nhạc cụ khác trong dàn nhạc giao hưởng"; dan-nhac.md (đã khóa) có sơ đồ chỗ ngồi các nhạc cụ dàn nhạc, không có giọng hát, organ, harpsichord: chữ đã sửa đúng.'
    review: dung
  - id: n3
    cau: Âm vực của các nhạc cụ dàn nhạc được so sánh ở trang Dàn nhạc giao hưởng (mục Âm vực các nhạc cụ); âm vực các giọng hát ở hình bên dưới.
    loai: ve-site
    ket_qua: da-sua
