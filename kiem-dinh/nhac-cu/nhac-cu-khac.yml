doi_chu:
  - cu: Ngoài piano (mục Piano) và violin, guitar, cello, sáo, clarinet, trumpet, đây là ba "giọng nói" quan trọng khác của nhạc cổ điển. Xem thêm vị trí của chúng trong dàn nhạc giao hưởng.
    moi: Ngoài piano (mục Piano) và violin, guitar, cello, sáo, clarinet, trumpet, đây là ba "giọng nói" quan trọng khác của nhạc cổ điển. Xem thêm vị trí của các nhạc cụ khác trong dàn nhạc giao hưởng.
    ly_do: 'n2 (da-sua): giọng hát, organ, harpsichord không có trong sơ đồ và âm vực ở trang dan-nhac.'
  - cu: Âm vực của các nhạc cụ trong trang này và trong dàn nhạc được so sánh ở trang Dàn nhạc giao hưởng.
    moi: Âm vực của các nhạc cụ dàn nhạc được so sánh ở trang Dàn nhạc giao hưởng; âm vực các giọng hát ở hình bên dưới.
    ly_do: 'n3 (da-sua): hình ranges-orchestra ở dan-nhac không có giọng hát, organ, harpsichord.'
  - cu: 'Giọng hát là nhạc cụ đầu tiên và vẫn là trung tâm của rất nhiều nhạc cổ điển: opera, oratorio, thánh lễ, ca khúc nghệ thuật, hợp xướng. Các loại giọng (soprano, mezzo, alto, tenor, baritone, bass) được giới thiệu ở Nhập môn opera.'
    moi: 'Giọng hát có mặt trong nhiều thể loại nhạc cổ điển: opera, oratorio, thánh lễ, ca khúc nghệ thuật, hợp xướng. Các loại giọng (soprano, mezzo, alto, tenor, baritone, bass) được giới thiệu ở Nhập môn opera.'
    ly_do: 'n13 (da-sua): "nhạc cụ đầu tiên", "trung tâm của rất nhiều" không kiểm được.'
  - cu: 'Nếu học: luôn cần giáo viên thanh nhạc: hát sai kỹ thuật có thể làm tổn thương dây thanh. Cách bắt đầu dễ nhất là tham gia một dàn hợp xướng nghiệp dư; bạn sẽ học đọc nhạc, nghe hòa âm và hát cùng người khác. Thị tấu một bè và luyện tai trên site giúp ích trực tiếp.'
    moi: 'Nếu học: nên học với giáo viên thanh nhạc: dùng giọng sai kỹ thuật có thể làm tổn thương dây thanh. Một cách bắt đầu là tham gia một dàn hợp xướng nghiệp dư: có dàn nhận người mới, có nơi mở cả lớp ký âm và đọc nhạc nhập môn; ở đó bạn nghe hòa âm và hát cùng người khác. Thị tấu một bè và luyện tai trên site giúp ích trực tiếp.'
    ly_do: 'n23, n24, n25 (da-sua): sức khỏe giọng theo NATS (Martha et al. 2023), bớt tuyệt đối ("luôn", "dễ nhất", "bạn sẽ học đọc nhạc"); hợp xướng theo Chorus America.'
  - cu: 'Organ ống là nhạc cụ lớn nhất và phức tạp nhất: hàng trăm đến hàng nghìn ống, mỗi ống một cao độ và âm sắc, được điều khiển từ nhiều tầng phím tay (manual) và một bàn phím chân (pedalboard). Người chơi kéo các nút đổi âm sắc (stop) để chọn nhóm ống, tạo ra những âm sắc giống sáo, kèn, đàn dây hoặc rất mạnh, rất sáng. Organ gắn chặt với nhà thờ và với Bach, người là nghệ sĩ organ lừng danh nhất thời ông.'
    moi: 'Organ ống thường được gọi là "vua của các nhạc cụ" vì kích thước lớn: không khí thổi qua nhiều hàng ống, mỗi ống một cao độ, được điều khiển từ một hay nhiều tầng phím tay (manual) và một bàn phím chân (pedalboard). Người chơi kéo các nút đổi âm sắc (stop), mỗi nút chọn một hàng ống, để đổi âm sắc và độ mạnh. Organ gắn chặt với nhà thờ và với Bach, người từng làm nghệ sĩ organ ở nhiều nhà thờ và cung đình.'
    ly_do: 'n27, n28, n29, n30, n31, n32: theo COD (Organ, Stop, Manual, Bach); bỏ "lớn nhất và phức tạp nhất", "hàng trăm đến hàng nghìn ống", "âm sắc giống sáo, kèn, đàn dây", "lừng danh nhất thời ông" (không nguồn).'
  - cu: Bach, Toccata và Fugue cung Rê thứ, BWV 565 (nổi tiếng nhất, dù một số học giả nghi ngờ đây có thật là tác phẩm của Bach)
    moi: Bach, Toccata và Fugue cung Rê thứ, BWV 565 (dù một số học giả nghi ngờ đây có thật là tác phẩm của Bach)
    ly_do: 'n35 (da-bo): bỏ "nổi tiếng nhất" (xếp hạng); vế nghi ngờ giữ (o8).'
  - cu: Saint-Saëns, Giao hưởng số 3 "Organ", chương cuối
    moi: Saint-Saëns, Giao hưởng số 3 "Organ"
    ly_do: 'n39 (da-sua): bỏ "chương cuối" (IMSLP: hai chương; chưa có nguồn mở nói phần organ).'
  - cu: Harpsichord trông giống piano nhưng dây được gảy bởi những miếng gảy nhỏ (ban đầu làm từ lông vũ) thay vì gõ bằng búa. Vì vậy người chơi không điều chỉnh được to nhỏ bằng lực bấm; harpsichord lớn có hai tầng phím và các cơ cấu đổi âm sắc để tạo tương phản. Đây là nhạc cụ phím chính của thời Baroque, trước khi piano thay thế.
    moi: Harpsichord trông giống piano nhưng dây được gảy bởi những miếng gảy nhỏ (làm từ lông vũ, hay nhựa ở đàn hiện đại) thay vì gõ bằng búa. Vì vậy người chơi không điều chỉnh được to nhỏ bằng lực bấm; harpsichord lớn có hai tầng phím và các cơ cấu đổi âm sắc để tạo tương phản. Đây là nhạc cụ phím chính của thời Baroque, trước khi piano thay thế.
    ly_do: 'n41 (da-sua): Bate nói lông vũ hay nhựa, không nói "ban đầu".'
  - cu: Domenico Scarlatti, các sonata (có 555 bản), ví dụ K. 141
    moi: Domenico Scarlatti, các sonata (khoảng 550 bản, đánh số K. 1–555), ví dụ K. 141
    ly_do: 'n45 (da-sua): COD ghi 550; IMSLP có K.1–555.'
  - cu: 'Nghệ sĩ nên tìm: Gustav Leonhardt, Trevor Pinnock, Mahan Esfahani, Jean Rondeau. So sánh cùng một tác phẩm Bach trên harpsichord và trên piano (ví dụ Glenn Gould) là một bài nghe rất thú vị; xem Đọc tên tác phẩm và bản thu về phong cách biểu diễn lịch sử.'
    moi: 'Nghệ sĩ nên tìm: Gustav Leonhardt, Trevor Pinnock, Mahan Esfahani, Jean Rondeau. So sánh cùng một tác phẩm Bach trên harpsichord và trên piano là một bài nghe rất thú vị; xem Đọc tên tác phẩm và bản thu về phong cách biểu diễn lịch sử.'
    ly_do: 'n51 (da-sua): bỏ tên Glenn Gould (chưa kiểm được bản thu Bach của ông).'
