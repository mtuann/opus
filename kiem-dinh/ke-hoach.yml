      - imslp-cs-op14
      - ke-hoach-mo-rong
      - imslp-op35
    ket_qua: da-sua
    ghi_chu: "IMSLP: Op. 41, Op. 14 có; khao-sat-g6 lô B: Hensel chưa có bản thu được nhận. Lần mở 16/11/2026 (ke-hoach/tac-pham): chủ repo chốt thứ tự đợt 2, đợt 3 rồi đợt 1 (plans/ben-vung/lo-trinh-them-tac-pham.md mục 1; ke-hoach-mo-rong.md 6.1). Câu thành mục 2, chữ không đổi. Lần mở 17/11/2026 (mo/sau-dot-2): thêm Chaminade Automne (Études de concert Op. 35 số 2; IMSLP 6 Études de concert, Op.35: \"2. Automne\") vì không tìm được bản thu Hensel (Commons, IMSLP, Musopen; chủ repo tra Musopen 16/11/2026); lộ trình chốt lượt 6 làm Automne. Review (Claude Sonnet, 17/11/2026): câu mới đúng chữ trên trang; Automne thay Hensel khớp lo-trinh-them-tac-pham.md mục 1 và lượt 6; trang không ghi con số về site. Sửa lần mở 17/11/2026 (mo/sau-dot-3): ba bài học đã khóa (piano/tac-pham/chaminade-pierrette, clara-schumann-scherzo-2, chaminade-automne), ghi \"(đã có)\" và link như mục Thế kỷ 20 (n6). Review (Claude Sonnet, 17/11/2026): mục 2 \"(đã có)\" và ba link đúng chữ, đúng bài học đã khóa; giống mục 1; Hensel còn là dự định, khớp ke-hoach-mo-rong.md 6.1."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Pierrette,_Op.41_(Chaminade,_C%C3%A9cile)", "https://imslp.org/wiki/Scherzo_No.2,_Op.14_(Schumann,_Clara)", "https://imslp.org/wiki/6_%C3%89tudes_de_concert,_Op.35_(Chaminade,_C%C3%A9cile)" ]
    luot_2_ghi_chu: "Ba bài học có thật trong worktree: piano/tac-pham/chaminade-pierrette.md, chaminade-automne.md, clara-schumann-scherzo-2.md; ke-hoach.md đã link đủ ba. Tên khớp IMSLP (Pierrette Op.41; Automne = Op.35 số 2; Scherzo số 2 Op.14 của Clara Schumann). Về Fanny Hensel: câu chỉ nói dự định khi tìm được bản thu, không kiểm được từ nguồn ngoài (là kế hoạch của site)."
    review: dung
  - id: n8
    cau: "Thứ tự dự định, mục 4 \"Lấp chỗ còn trống\" (phần đã có): Haydn, chương 3 Sonata Sol trưởng Hob. XVI:27 và Scarlatti, Sonata La trưởng K. 208, bài học đầu tiên của hai tác giả; Bach, Prelude và fugue Sol thứ BWV 861, bài chặng 7 đầu tiên ngoài nhạc Lãng mạn; còn lại một sonata Beethoven trọn vẹn ở chặng 7. Mục 5: tác phẩm Việt Nam hết bảo hộ và bài cho người mới dùng dân ca Việt Nam, sau khảo sát bản quyền."
