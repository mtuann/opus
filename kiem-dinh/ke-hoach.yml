  - id: n7
    cau: "Thứ hai, nhà soạn nhạc nữ (đã có): Chaminade, Pierrette và Automne; Clara Schumann, Scherzo số 2, mỗi bài một link tới bài học. Fanny Hensel khi tìm được bản thu dùng được."
