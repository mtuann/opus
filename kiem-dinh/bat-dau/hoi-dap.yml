    ghi_chu: Lời khuyên tập, khớp trang piano/bai-tap-ngon (xem hồ sơ trang ấy). Phần "thả lỏng" có yếu tố tư thế nhưng không nói về đau hay chấn thương.
    luot_2: dung
    luot_2_ghi_chu: "Lời khuyên hợp lý, khớp cách dạy phổ biến: tập ngón với liều nhỏ, chậm, thả lỏng, đổi tiết tấu; không thay được gam, hợp âm rải, étude. Hợp với khuyến cáo BAPAM tránh lặp căng tay kéo dài."
  - id: n25
    cau: 'Cần thầy dạy: để học nhạc lý và nghe nhạc thì site và các tài nguyên miễn phí là đủ; để học piano nên có thầy, ít nhất vài buổi đầu để chỉnh tư thế và cách dùng lực, rồi định kỳ để được nghe và góp ý; tự học hoàn toàn vẫn được nếu thu âm, quay video và đối chiếu kỹ.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên; phần "chỉnh tư thế và cách dùng lực" khớp piano/tu-the và piano/thay-va-thi (cùng lô, trang tham chiếu). Không có sự kiện kiểm được.
  - id: n26
    cau: Thi cấp (ABRSM, Trinity) không bắt buộc; cho một mục tiêu có hạn chót và chương trình cân đối (tác phẩm, gam, thị tấu, nghe); có thể khiến chỉ tập đúng ba bài thi trong cả năm.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Ý kiến sư phạm. "Chương trình cân đối (tác phẩm, gam, thị tấu, nghe)" là mô tả đề cương ABRSM/Trinity; trang piano/thay-va-thi (cùng lô, phần 1) kiểm chương trình thi bằng nguồn hãng; câu này không đưa con số hay năm nên không cần nguồn riêng. "ba bài thi" khớp cấu trúc chung (ba bài ở ABRSM piano); chưa kiểm ở đây.
    luot_2: dung
    luot_2_ghi_chu: "Lời khuyên hợp lý, đúng cách dạy phổ biến: thi cấp không bắt buộc, có lợi khi có mốc thời hạn, nhưng dễ dồn vào ba bài thi."
  - id: n27
    cau: 'Đọc được nốt nhạc: mỗi người một khác; lộ trình piano năm đầu đặt mốc đọc đúng 9/10 nốt khóa Sol, rồi khóa Fa, trong công cụ đọc nốt; đọc nhanh như đọc chữ, đủ để thị tấu, thì cần luyện lâu hơn nhiều.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Với 20 phút mỗi ngày, phần lớn người học đọc được nốt ở khóa Sol sau 2–4 tuần và khóa Fa sau thêm 2–4 tuần… nhiều tháng". Con số không có nguồn (không kiểm được); bỏ. Mốc 9/10 nốt khóa Sol và khóa Fa là của site: đã kiểm src/content/docs/bat-dau/lo-trinh-choi.md ("Đọc đúng 9/10 nốt khóa Sol… khóa Fa"). Review D8-gom: bat-dau/lo-trinh-choi.md (đã khóa) dòng 29, 39: "Đọc đúng 9/10 nốt khóa Sol", "Đọc đúng 9/10 nốt khóa Fa".'
    review: dung
  - id: n28
    cau: Công cụ đọc nốt cho thấy tiến độ cụ thể; trang Đọc nhạc và thị tấu chỉ cách đọc trên đàn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang luyen-tap/doc-not (công cụ đọc nốt, có tiến độ theo src/scripts/tien-do.js) và piano/thi-tau (title kiểm ở src/content/docs/piano/thi-tau.md). Review D8-gom: luyen-tap/doc-not.md có; piano/thi-tau.md title "Đọc nhạc và thị tấu trên đàn".'
    review: dung
  - id: n29
    cau: 'Người chơi piano nên học nhạc lý: biết gam, hợp âm và kết giúp đọc nhanh hơn (thấy hình dạng thay vì từng nốt), chọn ngón dễ hơn, học thuộc chắc hơn và chơi có ý đồ hơn.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên sư phạm chung. Các vế "đọc nhanh hơn, học thuộc chắc hơn" là nhận xét phổ biến, không kèm con số; không có nguồn bậc 1–2 đã mở (nếu review coi là sự kiện thì cần nguồn hoặc bỏ).
  - id: n30
    cau: Mỗi bài nhạc lý cơ bản trên site có phần Trên phím đàn nối thẳng sang việc bạn làm ở đàn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: src/content/docs/nhac-ly/01 đến 14 đều có khối :::tip[Trên phím đàn] (grep). Các bài 15 trở đi chưa kiểm vì câu nói "cơ bản"; ở site cũ ../opus-zero/docs/nhac-ly cũng có. Review D8-gom: grep src/content/docs/nhac-ly/01–14: mỗi bài một ":::tip[Trên phím đàn]".'
    review: dung
  - id: n31
    cau: "Học nhạc lý nếu chỉ muốn nghe: không bắt buộc, nhưng rất nên học vài bài; lộ trình nghe hiểu 6 tháng chỉ dùng sáu bài nhạc lý: bài 1 và 4 (cao độ, nhịp), bài 6 và 7 (gam trưởng, gam thứ), bài 12 và 13 (hòa âm chức năng, kết)."
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm src/content/docs/bat-dau/lo-trinh-nghe.md: "chỉ dùng phần nhạc lý thật sự cần cho việc nghe"; nhánh nhạc lý của lộ trình xếp bài 1–9 ở tháng 1–4. Lưu ý: tuyến nghe chính chỉ yêu cầu bài 1, 4, 12, 13 (bảng tuần); "ít nhất 9 bài đầu" là gợi ý của hỏi đáp, lệch nhẹ với tuyến nghe, nên người giao xem có cần sửa thành "bài 1–9 ở nhánh nhạc lý". Vế "giúp hiểu vì sao nghe buồn, căng thẳng" là lời khuyên. Review D8-gom: chữ cũ "rất nên học ít nhất 9 bài đầu" lệch với bat-dau/lo-trinh-nghe (đã khóa): tuyến nghe 6 tháng dùng bài 1, 4 (tháng 1), 6, 7 (tháng 2), 12, 13 (tháng 3); bài 1–9 chỉ là nhánh nhạc lý tháng 1–4. Viết lại theo đúng sáu bài ấy (tên bài theo src/content/docs/nhac-ly/01, 04, 06, 07, 12, 13), bỏ "nó chỉ dùng phần nhạc lý cần thiết" vì câu mới đã nói cụ thể. Vế "biết gam, giọng và kết giúp hiểu vì sao nghe buồn, căng thẳng" là lời khuyên, khớp lo-trinh-nghe tháng 2 ("Hiểu vì sao giọng thứ hay được dùng cho nhạc buồn").'
    review: dung
  - id: n32
    cau: Site này luôn ghi cả hai cách gọi tên nốt (Đô Rê Mi và chữ cái).
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: '"Site này luôn ghi cả hai": đã kiểm src/content/docs/nhac-ly/01-cao-do-ten-not.md (đọc cả hai hệ). Câu "ở Việt Nam sách và thầy cô dùng Đô Rê Mi" là mô tả thực tế giảng dạy, không có nguồn đã mở (tìm kiếm không thấy tài liệu nói về nhạc viện Việt Nam); chưa chắc, ghi cho review. Review D8-gom: soát nhãn: câu cũ có vế cần nguồn ngoài ("ở Việt Nam sách và thầy cô dùng Đô Rê Mi; phần lớn tài liệu tốt trên mạng, phần mềm… dùng chữ cái"); tách sang n49 (ten), viết theo câu đã khóa ở nhac-ly/01 (n8, n9: bỏ "phần mềm", "tài liệu tốt"). Phần còn lại: src/content/docs/nhac-ly/01-cao-do-ten-not.md bảng "Hệ Việt Nam (solfège)" và chữ cái, cả hai hệ.'
    review: dung
  - id: n33
    cau: "Đô cố định: Đô luôn là nốt C, dù bản nhạc ở giọng nào; đây là cách dùng ở các nước như Pháp, Ý."
    loai: dinh-nghia
    nguon:
      - nhacly01-ho-so
      - wiki-solfege
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là cách dùng ở Việt Nam, Pháp, Ý". Wikipedia (Solfège, mục Modern use): fixed do ở Pháp, Ý, Tây Ban Nha, Bồ Đào Nha, Romania, Nga…; không nhắc Việt Nam; bỏ Việt Nam vì không có nguồn (nguồn bậc 3, mục không dẫn nguồn; thuật ngữ "Đô cố định" theo src/data/thuat-ngu.yml). Chưa chắc: lượt 2 tìm nguồn bậc 2 (từ điển Grove/Oxford) cho danh sách nước. Review D8-gom: trang tham chiếu không dựa riêng Wikipedia: danh sách nước rút còn "các nước như Pháp, Ý" theo nguồn bậc 2 ở hồ sơ đã khóa nhac-ly/01 (Dolmetsch: các nước nói tiếng Rô-man; Encyclopedia of Music in Canada: chủ yếu Pháp, Bỉ, Ý); định nghĩa theo OMT (mục từ fixed do, cùng hồ sơ). Bỏ Tây Ban Nha, Nga. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://en.wikipedia.org/wiki/Solf%C3%A8ge; Wikipedia Solfège (chỉ để định hướng): đô cố định (mỗi âm tiết luôn là một cao độ) dùng ở Pháp, Ý, Tây Ban Nha, Nga, Bồ Đào Nha, Romania...; khớp câu. Chưa đối chiếu Open Music Theory (chương này không mở được trong lượt này).'
    luot_2: dung
    luot_2_nguon: [ "https://thecanadianencyclopedia.ca/en/article/solmization-emc" ]
    luot_2_ghi_chu: "Canadian Encyclopedia: Đô cố định dùng chủ yếu ở trường học Pháp, Bỉ, Ý."
  - id: n34
    cau: 'Đô di động: "Đô" là chủ âm của giọng trưởng đang chơi (ở giọng Sol trưởng nốt Sol được hát là "Đô"); cách này phát triển trong dạy hát hợp xướng ở Anh, và Kodály chủ trương dùng nó để dạy đọc nhạc; phương pháp của ông dùng nó cho thị xướng, nghe chép và luyện tai.'
    loai: dinh-nghia
    nguon:
      - oake-kodaly
      - nhacly01-ho-so
      - wiki-solfege
    ket_qua: da-sua
    ghi_chu: 'Wikipedia: movable do ở Anh, Mỹ, Hungary (trung tâm của phương pháp Kodály). "Rất mạnh cho luyện tai" là nhận xét sư phạm, không kiểm được. Cùng nguồn bậc 3 và cùng điều chưa chắc như câu trên. Review D8-gom: chữ cũ "phổ biến ở Anh, Mỹ, Hungary (phương pháp Kodály), rất mạnh cho luyện tai": danh sách nước chỉ có Wikipedia, "rất mạnh" là nhận xét. Viết lại theo OAKE (bậc 2): hệ moveable do phát triển trong dạy hợp xướng ở Anh, Kodály chủ trương dùng để dạy đọc nhạc; solfège dùng cho thị xướng, nghe chép, luyện tai. Định nghĩa (do là bậc 1 của gam trưởng) theo Wikipedia và lượt 2 của nhac-ly/01 (OMT dùng do-re-mi cho bậc). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://en.wikipedia.org/wiki/Solf%C3%A8ge; Wikipedia Solfège: đô di động (âm tiết theo bậc của gam) dùng ở các nước Khối thịnh vượng chung, Mỹ, nước Đức, và Hungary chủ yếu qua phương pháp Kodály. Ví dụ Sol trưởng hát chủ âm là ''Đô'' đúng định nghĩa. Ý ''rất mạnh cho luyện tai'' là nhận xét của site.'
    luot_2: khong-chac
    luot_2_ghi_chu: Canadian Encyclopedia (https://thecanadianencyclopedia.ca/en/article/solmization-emc) xác nhận Đô di động (tonic sol-fa) do John Curwen hoàn thiện ở Anh và Kodály ưa dùng cho thị xướng. Phần "phát triển trong dạy hát hợp xướng" và "nghe chép, luyện tai" chưa có nguồn đã mở nói rõ.
