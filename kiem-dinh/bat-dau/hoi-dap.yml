  - cu: Học bằng ứng dụng (Simply Piano, Flowkey) hay video “phím rơi” (Synthesia) có được không?
    moi: Học bằng ứng dụng hay video “phím rơi” có được không?
    ly_do: Tên ứng dụng cụ thể là thông tin mau cũ (tên và tình trạng đổi); câu trả lời không phụ thuộc vào tên.
  - cu: 'IMSLP và Mutopia có bản nhạc cổ điển thuộc phạm vi công cộng; IMSLP ghi tình trạng bản quyền theo từng nước ngay trên trang tải, nên hãy đọc dòng đó. Các ấn bản Urtext mới, bản soạn lại và nhạc của tác giả còn sống hoặc mới mất vẫn được bảo hộ. Ở Việt Nam, quyền tác giả với phần lớn tác phẩm kéo dài suốt cuộc đời tác giả và 50 năm sau năm tác giả mất (Luật Sở hữu trí tuệ, Điều 27). Cách chọn ấn bản tốt: Tác phẩm theo cấp độ.'
    moi: 'IMSLP và Mutopia có bản nhạc cổ điển thuộc phạm vi công cộng hay dùng giấy phép mở; IMSLP gắn nhãn tình trạng bản quyền theo luật Canada, Mỹ và Liên minh châu Âu cho từng bản nhạc; ở nước khác, trong đó có Việt Nam, bạn cần đối chiếu luật nước mình. Các ấn bản Urtext mới, bản soạn lại và nhạc của tác giả còn sống hoặc mới mất vẫn được bảo hộ. Ở Việt Nam, quyền tác giả có thời hạn bảo hộ do Luật Sở hữu trí tuệ quy định (Điều 27); hết thời hạn thì tác phẩm thuộc về công chúng. Cách chọn ấn bản tốt: Tác phẩm theo cấp độ.'
    ly_do: IMSLP chỉ gắn nhãn ba khu vực (Canada, Mỹ, EU); Mutopia dùng giấy phép Creative Commons; bỏ con số "50 năm" vì không xác nhận được văn bản Điều 27 hiện hành (xem ghi_chu của nhận định tương ứng).
  - cu: Với 20 phút mỗi ngày, phần lớn người học đọc được nốt ở khóa Sol sau 2–4 tuần và khóa Fa sau thêm 2–4 tuần. Đọc nhanh như đọc chữ, đủ để thị tấu, thì cần nhiều tháng luyện tập. Công cụ đọc nốt cho bạn thấy tiến độ cụ thể; trang Đọc nhạc và thị tấu chỉ cách đọc trên đàn.
