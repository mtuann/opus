    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "quyền tác giả với phần lớn tác phẩm kéo dài suốt cuộc đời tác giả và 50 năm sau năm tác giả mất (Luật Sở hữu trí tuệ, Điều 27)". Không đọc được văn bản gốc Điều 27 sau Luật 07/2022/QH15 (thuvienphapluat, luatvietnam chặn công cụ; bản tổng hợp trên vcci không in lại Điều 27). Kết quả tìm kiếm cho thấy luật sửa đổi 2022 (hiệu lực 1/1/2023) nâng thời hạn một số loại tác phẩm lên 75 năm; chưa xác nhận loại tác phẩm âm nhạc, văn học còn "đời tác giả + 50 năm" không. Nên bỏ con số để câu không sai khi luật đổi; nếu muốn giữ con số, người giao cần nguồn là văn bản luật. Đã xác nhận: Điều 43 khoản 1 dẫn khoản 2 Điều 27 làm mốc hết thời hạn bảo hộ. Review D8-gom: giữ da-sua (câu chung, không ghi con số): lượt 2 đọc luatvietnam.vn dẫn Điều 27 về thời hạn bảo hộ; bản tổng hợp luật trên vanban.vcci.com.vn có Điều 43 dẫn Điều 27. Chưa đọc được văn bản luật trên cổng chính phủ; chữ không nêu con số nên không cũ khi luật đổi.'
    luot_2: dung
    luot_2_nguon: [ "https://luatvietnam.vn/tin-phap-luat/thoi-han-bao-ho-quyen-so-huu-tri-tue-230-30744-article.html" ]
    luot_2_ghi_chu: "luatvietnam.vn (bài 2021, dẫn Điều 27 Luật SHTT): quyền công bố và quyền tài sản thường suốt đời tác giả + 50 năm; quyền nhân thân không thời hạn. Phần 'hết thời hạn thì thuộc về công chúng' là hệ quả pháp lý chuẩn nhưng trang này không viết nguyên văn; chưa mở được văn bản luật gốc (thuvienphapluat.vn, wipolex trả 403) nên đối chiếu thêm với bản sửa đổi 2022 khi cần."
