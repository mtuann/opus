nhan_dinh:
  - id: n1
    cau: Chưa thấy câu hỏi của bạn? Hãy gửi qua trang GitHub của dự án (github.com/mtuann/opus-zero/issues), hoặc ghi lại trong nhật ký luyện tập để hỏi thầy ở buổi học sau.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Link issue của repo cũ giữ nguyên theo AGENTS.md (mục Chuyển trang từ site cũ: repo mới còn riêng tư; khi công khai thì đổi thành github.com/mtuann/opus/issues). Trang luyen-tap/nhat-ky có trong src/content/docs/luyen-tap/. Review D8-gom: trang có link https://github.com/mtuann/opus-zero/issues (giữ theo AGENTS.md, mục Chuyển trang); src/content/docs/luyen-tap/nhat-ky.md có.'
    review: dung
  - id: n2
    cau: "Người lớn bắt đầu học piano không muộn: người lớn vẫn học được piano và có lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp động tác, nên ngón tay người lớn có thể quen chậm hơn."
    loai: quy-tac
    nguon:
      - bai0-n4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Người lớn thường nắm nhạc lý và cách tập nhanh hơn trẻ em vì quen tư duy trừu tượng và biết tự sắp xếp việc học". Vế "nhanh hơn trẻ em" không có nguồn (cùng kết luận ở hồ sơ bat-dau/bai-0 n4, đã sửa ở D2-L1 sau lượt 2). Chữ mới khớp đúng câu đã khóa ở bai-0. Phần "nhiều người bắt đầu ở tuổi 40, 50, 60 vẫn chơi được những tác phẩm họ yêu thích" là quan sát chung, không có nguồn cụ thể (chưa chắc cho phần này; lượt 2 xem lại). Review D8-gom: bỏ câu "Nhiều người bắt đầu ở tuổi 40, 50, 60 vẫn chơi được những tác phẩm họ yêu thích": không có nguồn (lượt 1 ghi chưa chắc, lượt 2 không tìm được nguồn). Phần còn lại trùng nguyên văn câu đã khóa ở bat-dau/bai-0 (n4, nguồn Penhune 2011 và các nghiên cứu ở hồ sơ ấy). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac; Chỉ tìm được vài nghiên cứu nhỏ, cũ (một luận án 1996 ở London thấy người trưởng thành đầu 20 tuổi không thua trẻ em về độ trôi chảy trên phím). Chưa có nguồn bậc 2 nào xác nhận ý ''người lớn có lợi thế tự sắp xếp việc học, trẻ em có lợi thế phối hợp động tác''. Phần ''người lớn vẫn học được'' hợp lý nhưng không đủ để ghi đúng cả câu. Truy cập 05/11/2026.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu mang tính nhận định về học tập; Chưa mở được nguồn bậc 2 nào xác nhận câu này ở lượt 2, nên không ghi dung/sai.
  - id: n3
    cau: Piano điện đủ cho vài năm đầu nếu có 88 phím, phím nặng mô phỏng búa và bàn đạp vang thật (không phải nút bấm); tránh đàn organ hay keyboard 61 phím phím nhẹ; lên trình độ trung cấp thì sắc thái và bàn đạp tinh tế cần đàn tốt hơn hoặc đàn cơ.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp trang piano/chon-dan (bảng danh sách kiểm tra piano điện, và "nhiều người nâng cấp lên đàn cơ khi đến khoảng Grade 4–5"); phần kỹ thuật (phím nặng, 88 phím) có nguồn ở hồ sơ piano/chon-dan. Review D8-gom: đối chiếu src/content/docs/piano/chon-dan.md sau review D8-gom: 88 phím, phím búa nặng dần, bàn đạp liên tục (không phải công tắc); câu "nâng cấp lên đàn cơ khoảng Grade 4–5" ở chon-dan nay là gợi ý của site (khuyen-tap). Câu này cũng là lời khuyên của site ("trình độ trung cấp" = chặng 4, Grade 4–5), khớp. Không đổi chữ.'
  - id: n4
    cau: 'Chi tiết: link Chọn đàn và góc tập (/opus/piano/chon-dan/).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích có ở src/content/docs/piano/chon-dan.md (cùng lô D8-L1), tiêu đề "Chọn đàn và góc tập". Review D8-gom: src/content/docs/piano/chon-dan.md, title "Chọn đàn và góc tập".'
    review: dung
  - id: n5
    cau: Tăng thời gian tập từ từ và luôn xen giờ nghỉ (xem Giữ đôi tay khỏe).
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "20–45 phút mỗi ngày là đủ và an toàn cho tay… luôn có giờ nghỉ". Lời khuyên dính tới sức khỏe nên xếp quy-tac. Bỏ "an toàn cho tay" (không kiểm được); "tăng từ từ, xen nghỉ" theo BAPAM (khớp piano/suc-khoe đã khóa: 20 phút tập, 10 phút nghỉ; tăng dần qua nhiều tuần). Con số 20–45 phút khớp thoi_luong của chặng 1–3 trong src/data/cap-do.yml (20–30, 30, 30–45) và 60–90 phút khớp chặng 6; đã kiểm. Review D8-gom: tách câu. Con số không có nguồn ngoài (lượt 2 khong-chac đúng ở chỗ này), nên viết thành gợi ý của site theo thoi_luong của src/data/cap-do.yml (n47, ve-site); "chia hai buổi ngắn" thành lời khuyên (n48). Câu này chỉ còn phần sức khỏe, nguồn BAPAM (khớp piano/suc-khoe đã khóa); lượt 2 cũ đã xác nhận phần này. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac; Không có nguồn nào ấn định ''20–45 phút mỗi ngày trong năm đầu rồi tăng lên 60–90 phút''. Chỉ khớp phần ''xen giờ nghỉ'' (BAPAM: tập từng đợt 20 phút, nghỉ 10 phút; tăng thời gian tập từ từ). Con số cụ thể là lời khuyên của site, không kiểm bằng nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Lời khuyên tập hợp lý, nhưng câu được gắn loại quy-tac và chưa mở nguồn nào: Chưa mở được nguồn bậc 2 nào xác nhận câu này ở lượt 2, nên không ghi dung/sai."
  - id: n6
    cau: 'Für Elise: nhiều người lớn chơi được đoạn đầu sau vài tháng, cả bài khi tới chặng 4, thường sau hai năm rưỡi đến bốn năm; các bản nocturne dễ của Chopin sau khoảng bốn đến năm năm rưỡi; Clair de lune sau năm năm rưỡi trở lên; con số dao động nhiều theo người.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nocturne dễ "sau khoảng bốn đến sáu năm". Đã kiểm với src/data/cap-do.yml (moc_thoi_gian: chặng 4 = 2,5–4 năm; chặng 5 = 4–5,5 năm; chặng 6 = 5,5–9 năm), src/data/tac-pham.yml (fur-elise chặng 4; debussy-clair-de-lune chặng 6; chopin-nocturne-op9-2 chặng 6) và piano/tac-pham-theo-cap (Nocturne Mi thứ Op. 72 số 1 chặng 5). "Sáu năm" không khớp mốc chặng nào; đã sửa thành "năm năm rưỡi" (hết chặng 5). Câu "đoạn đầu sau vài tháng" là ước lượng của site, không có nguồn ngoài (không kiểm độc lập được). Bai-0 (đã khóa) ghi cùng con số cho Für Elise. Review D8-gom: src/data/cap-do.yml moc_thoi_gian (chặng 4: 2,5–4 năm; 5: 4–5,5 năm; 6: 5,5–9 năm); tac-pham.yml: fur-elise chặng 4, debussy-clair-de-lune chặng 6; Nocturne Mi thứ Op. 72 số 1 chặng 5 ở piano/tac-pham-theo-cap (dòng 165; chặng này còn chờ chủ repo quyết, câu hỏi 1 của d8-l1.md); "đoạn đầu sau vài tháng": Für Elise 8 ô đầu là bài 10 của 10 bài đầu tiên, ở tháng 5 của bat-dau/lo-trinh-choi.'
    review: dung
  - id: n7
    cau: 'Bài "Spring Waltz" không phải của Chopin: đó là Mariage d''Amour của Paul de Senneville, nổi tiếng qua các bản thu của Richard Clayderman.'
    loai: lich-su
    nguon: [ wiki-mariage, mn-spring-waltz, mn-mariage, bnf-senneville ]
    ket_qua: da-sua
    ghi_chu: 'Wikipedia: viết 1978 bởi Paul de Senneville, Clayderman thu lần đầu 1979; "Spring Waltz" là nhãn của một video YouTube dẫn tới việc gán nhầm cho Chopin. Senneville (1933–2023) khớp src/data/nha-soan-nhac.yml. Bậc 3 cho năm; trang tac-pham-theo-cap (cùng lô) dẫn thêm nguồn. Review D8-gom: hai lượt dung nhưng cả hai chỉ dựa Wikipedia (bậc 3) cho năm 1978. Giữ chữ: cùng chi tiết có ở piano/tac-pham-theo-cap (bảng Mariage d''Amour), review của trang ấy quyết nguồn; nếu trang ấy bỏ năm thì câu này bỏ theo. Review D8-gom (nguồn thay Wikipedia): Bỏ "viết năm 1978" (chỉ có Wikipedia; trang piano/tac-pham-theo-cap đã bỏ năm này, theo BnF). Musicnotes (MK0024235, bản "Chopin Spring Waltz (Mariage d''amour)"; MN0114635, bản Richard Clayderman): "Music by Paul De Senneville"; BnF: Paul de Senneville (1933–2023), nhà soạn nhạc và nhà sản xuất. Tên "Spring Waltz" gắn với Chopin: bản nhạc trên Musicnotes mang cả hai tên. Kết quả theo hồ sơ piano/tac-pham-theo-cap (n67, n68). Kết quả lượt 2 cũ (gỡ để vào lượt 2 bổ sung vì chữ đổi): dung, nguồn https://en.wikipedia.org/wiki/Mariage_d%27amour; Wikipedia (chỉ để định hướng): Mariage d''amour là tác phẩm piano của Paul de Senneville, sáng tác 1978; Richard Clayderman thu bản đầu năm 1979 (album Lettre à Ma Mère); bản George Davidson bị gán nhầm là ''Spring Waltz'' của Chopin vì một video YouTube đặt sai tên. Khớp câu viết.'
    luot_2: dung
    luot_2_nguon: [ "https://jacobspiano.com/2017/05/31/chopin-ever-write-spring-waltz/", "https://api.musicnotes.com/sheetmusic/paul-de-senneville/mariage-d-amour/MN0114635" ]
