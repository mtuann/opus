nhan_dinh:
- id: n1
  cau: Chưa thấy câu hỏi của bạn? Hãy gửi qua trang GitHub của dự án (github.com/mtuann/opus-zero/issues), hoặc ghi lại trong nhật ký luyện tập để hỏi thầy ở buổi học sau.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Link issue của repo cũ giữ nguyên theo AGENTS.md (mục Chuyển trang từ site cũ: repo mới còn riêng tư; khi công khai thì đổi thành github.com/mtuann/opus/issues). Trang luyen-tap/nhat-ky có trong src/content/docs/luyen-tap/.'
- id: n2
  cau: 'Người lớn bắt đầu học piano không muộn: người lớn vẫn học được piano và có lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp động tác, nên ngón tay người lớn có thể quen chậm hơn; nhiều người bắt đầu ở tuổi 40, 50, 60 vẫn chơi được những tác phẩm họ yêu thích.'
  loai: quy-tac
  nguon:
  - bai0-n4
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Người lớn thường nắm nhạc lý và cách tập nhanh hơn trẻ em vì quen tư duy trừu tượng và biết tự sắp xếp việc học". Vế "nhanh hơn trẻ em" không có nguồn (cùng kết luận ở hồ sơ bat-dau/bai-0 n4, đã sửa ở D2-L1 sau lượt 2). Chữ mới khớp đúng câu đã khóa ở bai-0. Phần "nhiều người bắt đầu ở tuổi 40, 50, 60 vẫn chơi được những tác phẩm họ yêu thích" là quan sát chung, không có nguồn cụ thể (chưa chắc cho phần này; lượt 2 xem lại).'
- id: n3
  cau: Piano điện đủ cho vài năm đầu nếu có 88 phím, phím nặng mô phỏng búa và bàn đạp vang thật (không phải nút bấm); tránh đàn organ hay keyboard 61 phím phím nhẹ; lên trình độ trung cấp thì sắc thái và bàn đạp tinh tế cần đàn tốt hơn hoặc đàn cơ.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Khớp trang piano/chon-dan (bảng danh sách kiểm tra piano điện, và "nhiều người nâng cấp lên đàn cơ khi đến khoảng Grade 4–5"); phần kỹ thuật (phím nặng, 88 phím) có nguồn ở hồ sơ piano/chon-dan.
- id: n4
  cau: 'Chi tiết: link Chọn đàn và góc tập (/opus/piano/chon-dan/).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: Trang đích có ở src/content/docs/piano/chon-dan.md (cùng lô D8-L1), tiêu đề "Chọn đàn và góc tập".
- id: n5
  cau: 'Mỗi ngày nên tập: năm đầu 20–45 phút mỗi ngày là đủ, nên chia hai buổi ngắn nếu được; sau đó tăng dần lên 60–90 phút, tăng từ từ và luôn xen giờ nghỉ.'
  loai: quy-tac
  nguon:
  - bapam
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "20–45 phút mỗi ngày là đủ và an toàn cho tay… luôn có giờ nghỉ". Lời khuyên dính tới sức khỏe nên xếp quy-tac. Bỏ "an toàn cho tay" (không kiểm được); "tăng từ từ, xen nghỉ" theo BAPAM (khớp piano/suc-khoe đã khóa: 20 phút tập, 10 phút nghỉ; tăng dần qua nhiều tuần). Con số 20–45 phút khớp thoi_luong của chặng 1–3 trong src/data/cap-do.yml (20–30, 30, 30–45) và 60–90 phút khớp chặng 6; đã kiểm.'
- id: n6
  cau: 'Für Elise: nhiều người lớn chơi được đoạn đầu sau vài tháng, cả bài khi tới chặng 4, thường sau hai năm rưỡi đến bốn năm; các bản nocturne dễ của Chopin sau khoảng bốn đến năm năm rưỡi; Clair de lune sau năm năm rưỡi trở lên; con số dao động nhiều theo người.'
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: nocturne dễ "sau khoảng bốn đến sáu năm". Đã kiểm với src/data/cap-do.yml (moc_thoi_gian: chặng 4 = 2,5–4 năm; chặng 5 = 4–5,5 năm; chặng 6 = 5,5–9 năm), src/data/tac-pham.yml (fur-elise chặng 4; debussy-clair-de-lune chặng 6; chopin-nocturne-op9-2 chặng 6) và piano/tac-pham-theo-cap (Nocturne Mi thứ Op. 72 số 1 chặng 5). "Sáu năm" không khớp mốc chặng nào; đã sửa thành "năm năm rưỡi" (hết chặng 5). Câu "đoạn đầu sau vài tháng" là ước lượng của site, không có nguồn ngoài (không kiểm độc lập được). Bai-0 (đã khóa) ghi cùng con số cho Für Elise.'
- id: n7
  cau: 'Bài "Spring Waltz" không phải của Chopin: đó là Mariage d''Amour của Paul de Senneville, viết năm 1978 và nổi tiếng qua bản thu của Richard Clayderman.'
  loai: lich-su
  nguon:
  - wiki-mariage
  ket_qua: dung
  ghi_chu: 'Wikipedia: viết 1978 bởi Paul de Senneville, Clayderman thu lần đầu 1979; "Spring Waltz" là nhãn của một video YouTube dẫn tới việc gán nhầm cho Chopin. Senneville (1933–2023) khớp src/data/nha-soan-nhac.yml. Bậc 3 cho năm; trang tac-pham-theo-cap (cùng lô) dẫn thêm nguồn.'
- id: n8
  cau: Bản piano solo đầy đủ của Mariage d'Amour ở khoảng Grade 5–6 (đầu chặng 5); có nhiều bản soạn dễ hơn cho chặng 2–3.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Khớp piano/tac-pham-theo-cap (bảng bài phổ biến: "Grade 5–6, đầu chặng 5"; "Bản soạn dễ: chặng 2–3"), vốn là nơi site quyết định chặng của mỗi bài. Cấp là ước lượng của site (trang ấy ghi rõ). Musicnotes xếp bản piano solo ở mức Intermediate.'
- id: n9
  cau: Mariage d'Amour còn bản quyền, nên hãy dùng bản nhạc được cấp phép.
  loai: quy-tac
  nguon:
  - musicnotes-mariage
  - vcci-sht
  ket_qua: dung
  ghi_chu: 'Senneville mất 2023 nên bản quyền còn (Điều 27 Luật SHTT: hết thời hạn mới thuộc về công chúng, Điều 43). Musicnotes bán bản piano solo "Official" (có giấy phép). Không phải tư vấn pháp lý.'
- id: n10
  cau: 'Các bài nhạc phim, River Flows in You, Kiss the Rain… còn bản quyền: hãy dùng bản nhạc được cấp phép (nhà xuất bản hoặc trang bán bản nhạc như Musicnotes), không dùng bản chép lậu.'
  loai: quy-tac
  nguon:
  - musicnotes-mariage
  ket_qua: dung
  ghi_chu: Yiruma (sinh 1978), Joe Hisaishi (1950), Yann Tiersen (1970), Ludovico Einaudi (1955) còn sống (src/data/nha-soan-nhac.yml, đã khóa). Musicnotes là nhà bán bản nhạc có giấy phép (đã mở).
- id: n11
  cau: 'Bản gốc của nhiều bài nhạc phim nghe đơn giản nhưng không dễ: tay trái rải rộng, bàn đạp nhiều, giai điệu phải hát trên phần đệm; phần lớn cần trình độ trung cấp, khoảng chặng 4–5, và có nhiều bản soạn dễ hơn.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Khớp piano/tac-pham-theo-cap: River Flows in You, Kiss the Rain, One Summer''s Day: Grade 5, chặng 4; Comptine d''un autre été, Nuvole bianche: Grade 6, chặng 5 (cấp là ước lượng của site). Phần mô tả kỹ năng là nhận xét chung.'
- id: n12
  cau: 'Những bài học dạy đúng các kỹ năng ấy: Gymnopédie số 1, Prélude Mi thứ, Arietta (link tới ba bài học tác phẩm).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: Ba trang có ở src/content/docs/piano/tac-pham/ khi lô sau chuyển; các slug satie-gymnopedie, chopin-prelude-mi-thu, grieg-arietta có trong src/data/tac-pham.yml (chặng 4, Grade 4/5/4). Link hiện "sắp có" tới khi trang lên (AGENTS.md, Link nội bộ). Tên các bài khớp bản ghi dữ liệu.
- id: n13
  cau: Cấp, kỹ năng cần, nơi mua bản nhạc được cấp phép và bản thu chính thức của từng bài (River Flows in You, Kiss the Rain, One Summer's Day của Joe Hisaishi, Comptine d'un autre été của Yann Tiersen, Nuvole bianche của Ludovico Einaudi, Mariage d'Amour) ở mục Bài phổ biến ngoài nhạc cổ điển (/opus/piano/tac-pham-theo-cap/#ngoai-co-dien).
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm piano/tac-pham-theo-cap (src/content/docs/): có mục "Bài phổ biến ngoài nhạc cổ điển { #ngoai-co-dien }" và đủ sáu bài; tác giả khớp nha-soan-nhac.yml. Lô D8-L1 phần 1 giữ id ngoai-co-dien (ghi cho người giao).'
- id: n14
  cau: 'Học bằng ứng dụng hay video "phím rơi" như một cách tạo động lực thì được; nhưng chúng thường bỏ qua ba thứ về sau rất cần: đọc nhạc, ngón bấm và tiếng đàn.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: 'Ý kiến sư phạm chung của trang cũ, không phải sự kiện kiểm được. Đã bỏ tên ứng dụng cụ thể (Simply Piano, Flowkey, Synthesia): tên đổi (Simply Piano nay là "Simply"), Synthesia lâu không cập nhật theo các so sánh 2026 (chỉ nguồn bậc 3) nên không còn là ví dụ bền; doi_chu.'
- id: n15
  cau: Nếu dùng, hãy dùng song song với đọc nốt và thị tấu mỗi ngày, tập theo bản nhạc có ghi số ngón, và thu âm để nghe lại chính mình (link tới luyen-tap/doc-not, piano/thi-tau, luyen-tap/thu-am).
  loai: ve-site
  ket_qua: dung
  ghi_chu: Ba trang đích có ở src/content/docs/ (luyen-tap/doc-not.md, piano/thi-tau.md, luyen-tap/thu-am.md).
- id: n16
  cau: 'Quay lại học sau nhiều năm nghỉ: làm bài kiểm tra đầu vào, rồi bắt đầu thấp hơn chặng nó gợi ý một chặng; tay cần vài tuần để nhớ lại; mấy tuần đầu dành nhiều thời gian cho gam và đọc nhạc, hai thứ hay mai một nhất sau nhiều năm nghỉ.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: 'Lời khuyên tập (không có sự kiện kiểm được ngoài "bài kiểm tra đầu vào" và "lộ trình piano": link tới bat-dau/kiem-tra-dau-vao và piano/lo-trinh, cả hai có ở src/content/docs/). Câu "hai thứ hay mai một nhất" là nhận xét chung của trang cũ, không có nguồn (ghi để lượt 2 và review xem lại; nếu cho là sự kiện thì cần nguồn hoặc bỏ vế này).'
- id: n17
  cau: IMSLP và Mutopia có bản nhạc cổ điển thuộc phạm vi công cộng hay dùng giấy phép mở.
  loai: lich-su
  nguon:
  - mutopia-legal
  - imslp-licensing
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…thuộc phạm vi công cộng". Mutopia (đã mở): mọi bản nhạc dưới giấy phép Creative Commons (gồm Public Domain); thêm "hay dùng giấy phép mở".'
- id: n18
  cau: IMSLP gắn nhãn tình trạng bản quyền theo luật Canada, Mỹ và Liên minh châu Âu cho từng bản nhạc; ở nước khác, trong đó có Việt Nam, bạn cần đối chiếu luật nước mình.
  loai: quy-tac
  nguon:
  - imslp-reviewers
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "IMSLP ghi tình trạng bản quyền theo từng nước ngay trên trang tải, nên hãy đọc dòng đó". IMSLP (Copyright Reviewers, đã mở) chỉ gắn nhãn ba khu vực Canada, Mỹ, EU; không phải "từng nước". Trang IMSLP không mở được phần trang tải (bot), nên bỏ "ngay trên trang tải"; chưa chắc vị trí chính xác của nhãn trên trang.'
- id: n19
  cau: Các ấn bản Urtext mới, bản soạn lại và nhạc của tác giả còn sống hoặc mới mất vẫn được bảo hộ.
  loai: quy-tac
  nguon:
  - imslp-licensing
  ket_qua: dung
  ghi_chu: 'IMSLP (Licensing Policy): bản biên tập và bản soạn lại có bản quyền riêng cho phần mới; "the copyright status of an edition cannot affect the public domain status of the underlying work". Chưa có trang IMSLP đã mở nói riêng về chữ "Urtext" (trang licensing không nhắc Urtext); tìm kiếm cho thấy IMSLP chờ 25 năm với ấn bản Urtext ở EU, chưa mở trang gốc. Chưa chắc riêng "Urtext": lượt 2 xem lại.'
- id: n20
  cau: Ở Việt Nam, quyền tác giả có thời hạn bảo hộ do Luật Sở hữu trí tuệ quy định (Điều 27); hết thời hạn thì tác phẩm thuộc về công chúng.
  loai: quy-tac
  nguon:
  - vcci-sht
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "quyền tác giả với phần lớn tác phẩm kéo dài suốt cuộc đời tác giả và 50 năm sau năm tác giả mất (Luật Sở hữu trí tuệ, Điều 27)". Không đọc được văn bản gốc Điều 27 sau Luật 07/2022/QH15 (thuvienphapluat, luatvietnam chặn công cụ; bản tổng hợp trên vcci không in lại Điều 27). Kết quả tìm kiếm cho thấy luật sửa đổi 2022 (hiệu lực 1/1/2023) nâng thời hạn một số loại tác phẩm lên 75 năm; chưa xác nhận loại tác phẩm âm nhạc, văn học còn "đời tác giả + 50 năm" không. Nên bỏ con số để câu không sai khi luật đổi; nếu muốn giữ con số, người giao cần nguồn là văn bản luật. Đã xác nhận: Điều 43 khoản 1 dẫn khoản 2 Điều 27 làm mốc hết thời hạn bảo hộ.'
- id: n21
  cau: 'Cách chọn ấn bản tốt: Tác phẩm theo cấp độ (link /opus/piano/tac-pham-theo-cap/).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: Trang piano/tac-pham-theo-cap có ở src/content/docs/piano/; trang ấy có hướng dẫn chọn ấn bản (đã xem nội dung mục đầu trang).
- id: n22
  cau: 'Tay nhỏ, ngón ngắn vẫn học piano được: phần lớn văn học piano không đòi bàn tay lớn; khi gặp quãng tám hay hợp âm rộng có cách chọn ngón, rải hợp âm, chia nốt cho tay kia; đừng cố căng tay quá sức.'
  loai: quy-tac
  ket_qua: dung
  ghi_chu: 'Câu có yếu tố sức khỏe ("đừng cố căng tay quá sức") nên xếp quy-tac, không xếp khuyen-tap; nguồn: khớp trang piano/suc-khoe đã khóa (mục bàn tay nhỏ, nguồn PASK và BAPAM ở hồ sơ trang đó) và trang piano/quang-tam-buoc-nhay; câu hỏi đáp chỉ tóm tắt hai trang ấy, không có nhận định mới. Chưa mở lại nguồn ngoài (lượt 2: kiểm với hồ sơ piano/suc-khoe n về bàn tay nhỏ).'
- id: n23
  cau: Link tới piano/suc-khoe (#ban-tay-nho-chon-bai-va-ngon-bam-cho-vua-tay) và piano/quang-tam-buoc-nhay.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/content/docs/piano/suc-khoe.md có tiêu đề "Bàn tay nhỏ: chọn bài và ngón bấm cho vừa tay" (id theo id-cu); piano/quang-tam-buoc-nhay.md có. tests/link.test.mjs kiểm anchor trên bản build.'
- id: n24
  cau: 'Hanon và các bài tập ngón: có thể tập với liều lượng nhỏ và có ý thức (chậm, thả lỏng, đổi tiết tấu), nhưng không thay được gam, hợp âm rải và các étude có nhạc tính.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên tập, khớp trang piano/bai-tap-ngon (xem hồ sơ trang ấy). Phần "thả lỏng" có yếu tố tư thế nhưng không nói về đau hay chấn thương.
- id: n25
  cau: 'Cần thầy dạy: để học nhạc lý và nghe nhạc thì site và các tài nguyên miễn phí là đủ; để học piano nên có thầy, ít nhất vài buổi đầu để chỉnh tư thế và cách dùng lực, rồi định kỳ để được nghe và góp ý; tự học hoàn toàn vẫn được nếu thu âm, quay video và đối chiếu kỹ.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên; phần "chỉnh tư thế và cách dùng lực" khớp piano/tu-the và piano/thay-va-thi (cùng lô, trang tham chiếu). Không có sự kiện kiểm được.
- id: n26
  cau: Thi cấp (ABRSM, Trinity) không bắt buộc; cho một mục tiêu có hạn chót và chương trình cân đối (tác phẩm, gam, thị tấu, nghe); có thể khiến chỉ tập đúng ba bài thi trong cả năm.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Ý kiến sư phạm. "Chương trình cân đối (tác phẩm, gam, thị tấu, nghe)" là mô tả đề cương ABRSM/Trinity; trang piano/thay-va-thi (cùng lô, phần 1) kiểm chương trình thi bằng nguồn hãng; câu này không đưa con số hay năm nên không cần nguồn riêng. "ba bài thi" khớp cấu trúc chung (ba bài ở ABRSM piano); chưa kiểm ở đây.
- id: n27
  cau: 'Đọc được nốt nhạc: mỗi người một khác; lộ trình piano năm đầu đặt mốc đọc đúng 9/10 nốt khóa Sol, rồi khóa Fa, trong công cụ đọc nốt; đọc nhanh như đọc chữ, đủ để thị tấu, thì cần luyện lâu hơn nhiều.'
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Với 20 phút mỗi ngày, phần lớn người học đọc được nốt ở khóa Sol sau 2–4 tuần và khóa Fa sau thêm 2–4 tuần… nhiều tháng". Con số không có nguồn (không kiểm được); bỏ. Mốc 9/10 nốt khóa Sol và khóa Fa là của site: đã kiểm src/content/docs/bat-dau/lo-trinh-choi.md ("Đọc đúng 9/10 nốt khóa Sol… khóa Fa").'
- id: n28
  cau: Công cụ đọc nốt cho thấy tiến độ cụ thể; trang Đọc nhạc và thị tấu chỉ cách đọc trên đàn.
  loai: ve-site
  ket_qua: dung
  ghi_chu: Trang luyen-tap/doc-not (công cụ đọc nốt, có tiến độ theo src/scripts/tien-do.js) và piano/thi-tau (title kiểm ở src/content/docs/piano/thi-tau.md).
- id: n29
  cau: 'Người chơi piano nên học nhạc lý: biết gam, hợp âm và kết giúp đọc nhanh hơn (thấy hình dạng thay vì từng nốt), chọn ngón dễ hơn, học thuộc chắc hơn và chơi có ý đồ hơn.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên sư phạm chung. Các vế "đọc nhanh hơn, học thuộc chắc hơn" là nhận xét phổ biến, không kèm con số; không có nguồn bậc 1–2 đã mở (nếu review coi là sự kiện thì cần nguồn hoặc bỏ).
- id: n30
  cau: Mỗi bài nhạc lý cơ bản trên site có phần Trên phím đàn nối thẳng sang việc bạn làm ở đàn.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/content/docs/nhac-ly/01 đến 14 đều có khối :::tip[Trên phím đàn] (grep). Các bài 15 trở đi chưa kiểm vì câu nói "cơ bản"; ở site cũ ../opus-zero/docs/nhac-ly cũng có.'
- id: n31
  cau: 'Học nhạc lý nếu chỉ muốn nghe: không bắt buộc, nhưng rất nên học ít nhất 9 bài đầu; biết gam, giọng và quãng giúp hiểu vì sao một đoạn nhạc nghe buồn, căng thẳng hay được giải tỏa; lộ trình nghe hiểu chỉ dùng phần nhạc lý cần thiết.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm src/content/docs/bat-dau/lo-trinh-nghe.md: "chỉ dùng phần nhạc lý thật sự cần cho việc nghe"; nhánh nhạc lý của lộ trình xếp bài 1–9 ở tháng 1–4. Lưu ý: tuyến nghe chính chỉ yêu cầu bài 1, 4, 12, 13 (bảng tuần); "ít nhất 9 bài đầu" là gợi ý của hỏi đáp, lệch nhẹ với tuyến nghe, nên người giao xem có cần sửa thành "bài 1–9 ở nhánh nhạc lý". Vế "giúp hiểu vì sao nghe buồn, căng thẳng" là lời khuyên.'
- id: n32
  cau: 'Nên học Đô Rê Mi hay C D E: cả hai; ở Việt Nam sách và thầy cô dùng Đô Rê Mi; phần lớn tài liệu tốt trên mạng, phần mềm và ký hiệu hợp âm dùng chữ cái; site này luôn ghi cả hai.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: '"Site này luôn ghi cả hai": đã kiểm src/content/docs/nhac-ly/01-cao-do-ten-not.md (đọc cả hai hệ). Câu "ở Việt Nam sách và thầy cô dùng Đô Rê Mi" là mô tả thực tế giảng dạy, không có nguồn đã mở (tìm kiếm không thấy tài liệu nói về nhạc viện Việt Nam); chưa chắc, ghi cho review.'
- id: n33
  cau: 'Đô cố định: Đô luôn là nốt C, dù bản nhạc ở giọng nào; đây là cách dùng ở Pháp, Ý, Tây Ban Nha, Nga…'
  loai: dinh-nghia
  nguon:
  - wiki-solfege
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là cách dùng ở Việt Nam, Pháp, Ý". Wikipedia (Solfège, mục Modern use): fixed do ở Pháp, Ý, Tây Ban Nha, Bồ Đào Nha, Romania, Nga…; không nhắc Việt Nam; bỏ Việt Nam vì không có nguồn (nguồn bậc 3, mục không dẫn nguồn; thuật ngữ "Đô cố định" theo src/data/thuat-ngu.yml). Chưa chắc: lượt 2 tìm nguồn bậc 2 (từ điển Grove/Oxford) cho danh sách nước.'
- id: n34
  cau: 'Đô di động: "Đô" là chủ âm của giọng đang chơi (ở giọng Sol trưởng nốt Sol được hát là "Đô"); phổ biến ở Anh, Mỹ, Hungary (phương pháp Kodály), rất mạnh cho luyện tai.'
  loai: dinh-nghia
  nguon:
  - wiki-solfege
  ket_qua: dung
  ghi_chu: 'Wikipedia: movable do ở Anh, Mỹ, Hungary (trung tâm của phương pháp Kodály). "Rất mạnh cho luyện tai" là nhận xét sư phạm, không kiểm được. Cùng nguồn bậc 3 và cùng điều chưa chắc như câu trên.'
- id: n35
  cau: Site này dùng Đô cố định để gọi tên nốt.
