lan:
- so: 1
  ngay: '2026-11-05'
  nhanh: moi/d8-l1
  ma_bam: null
  nguoi:
    luot_1: Claude Sonnet (D8-L1 lượt 1, phần 2/2)
    luot_2: null
    review: null
    kiem_mau: null
ghi_chu: 'Trang tham chiếu có hạn (ra_lai 2027-04). Kiểm định lượt 1 ngày 05/11/2026, mọi nguồn truy cập ngày ấy. Hỏi đáp tổng hợp nhiều chủ đề; mỗi câu hỏi-đáp tách thành nhận định theo ý chính. Nhiều câu là ve-site (link sang trang khác, con số theo chặng, hành vi công cụ): đã đối chiếu với src/data/, src/content/docs/ và src/scripts/; trang đích chưa chuyển (nghe-nhac/doc-ten-tac-pham, nghe-nhac/nghe-gi-tiep) kiểm ở ../opus-zero/docs/ và ghi điều cần giữ. Link issue của repo cũ giữ nguyên (AGENTS.md). Không có khối abc, thuật ngữ cần bản ghi mới ("Đô cố định", "Đô di động" thuộc thuat-ngu.yml; kiểm ở D3-L5). Điều cần người giao biết: (1) bai-0 (đã khóa) link vào #ve-hoc-piano của trang này: giữ nguyên tiêu đề "Về học piano". (2) "Ít nhất 9 bài đầu" (câu học nhạc lý để nghe) lệch nhẹ với tuyến nghe của lo-trinh-nghe, chỉ dùng bài 1, 4, 12, 13; để người giao quyết. (3) Điều 27 Luật SHTT: không đọc được văn bản gốc sau sửa đổi 2022, nên đã bỏ con số 50 năm; nếu muốn giữ số thì cần nguồn
  là văn bản luật. (4) Câu "ở Việt Nam, sách và thầy cô dùng Đô Rê Mi" không có nguồn (chưa chắc). (5) "Công tắc im lặng của iPhone chặn âm thanh trang web" chưa có nguồn Apple. (6) Nhận định n3 và nhiều lời khuyên (khuyen-tap) giữ nguyên chữ trang cũ.'
