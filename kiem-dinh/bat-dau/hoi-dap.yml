    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "IMSLP ghi tình trạng bản quyền theo từng nước ngay trên trang tải, nên hãy đọc dòng đó". IMSLP (Copyright Reviewers, đã mở) chỉ gắn nhãn ba khu vực Canada, Mỹ, EU; không phải "từng nước". Trang IMSLP không mở được phần trang tải (bot), nên bỏ "ngay trên trang tải"; chưa chắc vị trí chính xác của nhãn trên trang. Review D8-gom: giữ da-sua: lượt 2 đọc IMSLP Copyright Made Simple, cùng ba vùng Canada, Mỹ, EU (cùng vài nước theo luật tương tự).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/IMSLP%3ACopyright_Made_Simple" ]
    luot_2_ghi_chu: "IMSLP Copyright Made Simple: IMSLP gắn nhãn cho Canada, Hoa Kỳ và Liên minh châu Âu (kèm Đài Loan, Trung Quốc, Nam Phi, New Zealand, và nhóm EU gồm Hàn Quốc, Nhật). Trang chỉ nêu 'quy tắc đơn giản, có ngoại lệ', không nói rõ nước mình, nhưng 'ở nước khác (Việt Nam) cần đối chiếu luật nước mình' là suy luận hợp lý từ việc nhãn chỉ ba vùng."
  - id: n19
    cau: Các ấn bản Urtext mới, bản soạn lại và nhạc của tác giả còn sống hoặc mới mất vẫn được bảo hộ.
    loai: quy-tac
    nguon:
      - imslp-licensing
    ket_qua: dung
    ghi_chu: 'IMSLP (Licensing Policy): bản biên tập và bản soạn lại có bản quyền riêng cho phần mới; "the copyright status of an edition cannot affect the public domain status of the underlying work". Chưa có trang IMSLP đã mở nói riêng về chữ "Urtext" (trang licensing không nhắc Urtext); tìm kiếm cho thấy IMSLP chờ 25 năm với ấn bản Urtext ở EU, chưa mở trang gốc. Chưa chắc riêng "Urtext": lượt 2 xem lại. Review D8-gom: giữ: lượt 2 đọc IMSLP Copyright Made Simple: ấn bản có phần mới được bảo hộ riêng (EU 25–30 năm), tác giả còn sống hay mới mất còn bảo hộ. Chữ "Urtext mới" là ấn bản có phần biên tập mới.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/IMSLP%3ACopyright_Made_Simple" ]
    luot_2_ghi_chu: "IMSLP: ấn bản có đóng góp mới có thể được bảo hộ (EU tới 30 năm, IMSLP áp dụng 25 năm; Mỹ: phần chú giải, lời tựa); người sống hay mới mất nói chung còn bảo hộ (Canada: mất trước 1972; EU: trước 1956). Lưu ý Canada từ 2023 đã kéo dài lên 70 năm cho người mất từ 1972."
