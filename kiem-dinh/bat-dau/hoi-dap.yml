- id: n40
  cau: 'Đi xem hòa nhạc lần đầu: ăn mặc lịch sự là đủ, không bắt buộc trang trọng; đến sớm 15 phút; tắt chuông điện thoại; theo thông lệ khán giả không vỗ tay giữa các chương của một tác phẩm, nếu không chắc hãy đợi người xung quanh vỗ tay.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên ứng xử; thông lệ "không vỗ tay giữa các chương" là phổ biến, không có sự kiện số liệu.
- id: n41
  cau: Ở một buổi độc tấu piano, chọn ghế bên trái khán phòng nếu muốn nhìn thấy tay nghệ sĩ.
  loai: khuyen-tap
  nguon:
  - allen-phil
  ket_qua: dung
  ghi_chu: 'Allen Philharmonic FAQ (qua kết quả tìm kiếm): "people like to sit more towards the left side of the house so that you can see the pianist''s hands"; nhiều nguồn khác cùng ý. "Bên trái" là bên trái của khán giả nhìn ra sân khấu.'
