  cau: Trang Nghệ sĩ piano và bản thu gợi ý nên bắt đầu từ ai, và trang Đọc tên tác phẩm và bản thu giải thích cách đọc thông tin bản thu.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'piano/nghe-si (cùng lô, bảng "Nghe trước" cho từng nghệ sĩ); nghe-nhac/doc-ten-tac-pham chưa có ở src/content/docs/: đã kiểm ../opus-zero/docs/nghe-nhac/doc-ten-tac-pham.md (có, tiêu đề "Đọc tên tác phẩm và bản thu"). Lô chuyển trang ấy phải giữ tên.'
- id: n38
  cau: Nhạc cổ điển dễ nghe vẫn là nhạc cổ điển thật; Bốn Mùa hay Für Elise nổi tiếng vì chúng hay, không phải vì chúng dễ; đừng ngại bắt đầu từ tác phẩm quen thuộc.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Ý kiến chung; "nổi tiếng vì chúng hay" là đánh giá không kiểm được (không dùng như sự kiện).
