- id: n43
  cau: Dữ liệu luyện tập lưu trong trình duyệt trên máy bạn, không gửi đi đâu; dùng Dữ liệu của tôi để sao lưu và chuyển sang máy khác.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Khớp luyen-tap/du-lieu (description: "…được lưu trong trình duyệt trên máy này, không gửi lên đâu cả"); src/scripts/tien-do.js lưu localStorage opus-zero:v1 (không gọi mạng); công cụ sao lưu ở src/scripts/sao-luu.js. Lưu ý site có tìm kiếm và tải font/âm thanh nhưng không gửi dữ liệu luyện tập.'
- id: n44
  cau: 'Không nghe thấy âm thanh: kiểm tra điện thoại không ở chế độ im lặng (trên iPhone, công tắc im lặng chặn cả âm thanh trang web), và bấm vào trang một lần trước khi phát; âm thanh của khuông nhạc cần mạng ở lần đầu tiên.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/scripts/am-thanh.js (AudioContext chỉ chạy sau cử chỉ của người học: "chỉ phát khi người học bấm"; AGENTS.md); âm thanh khuông nhạc: soundfont abcjs tải từ paulrosen.github.io lần đầu (src/ung-dung/ung-dung.mjs MAY_NGOAI). Câu "công tắc im lặng của iPhone chặn cả âm thanh trang web" là hành vi iOS (khi trang dùng audio session mặc định); chưa mở nguồn Apple; chưa chắc phần này, ghi cho lượt 2.'
- id: n45
  cau: Đàn điện dùng được với site nếu đàn có cổng USB-MIDI (hoặc MIDI qua bộ chuyển) và bạn dùng trình duyệt có MIDI trên web; trình duyệt nào không có thì công cụ tự báo khi bạn bấm kết nối; khi đó các công cụ dùng micro (chơi theo, hát lại) vẫn chạy.
  loai: ve-site
  nguon:
  - mdn-midi
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…trình duyệt hỗ trợ Web MIDI (Chrome, Edge hoặc Opera trên máy tính). Safari và mọi trình duyệt trên iPhone, iPad chưa hỗ trợ MIDI trên web". Viết chung (MDN: Web MIDI không phải Baseline, cần HTTPS và người dùng cho phép; kết quả caniuse đã đọc qua tìm kiếm: Safari trên iOS chưa có, Firefox từ bản 154 có) để câu không cũ đi. Đã kiểm src/scripts/midi.js (coMidi, thông báo "Trình duyệt này không có MIDI trên web" ở ô midi-status) và src/scripts/micro.js (công cụ micro độc lập với MIDI).'
- id: n46
  cau: Đàn thay chuột trong các công cụ đọc nốt, chơi theo, chép giai điệu (link Kết nối đàn MIDI).
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm luyen-tap/ket-noi-midi.md (bảng công cụ dùng được đàn MIDI: Đọc nốt, Chơi theo, Chép giai điệu…); trang có ở src/content/docs/luyen-tap/.'
khuong_nhac: []
doi_chu:
- cu: Không. Người lớn thường nắm nhạc lý và cách tập nhanh hơn trẻ em vì quen tư duy trừu tượng và biết tự sắp xếp việc học. Ngón tay có thể linh hoạt chậm hơn một chút, nhưng nhiều người bắt đầu ở tuổi 40, 50, 60 vẫn chơi được những tác phẩm họ yêu thích. Xem lộ trình piano năm đầu.
  moi: Không. Người lớn vẫn học được piano, và có lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp động tác, nên ngón tay của người lớn có thể quen chậm hơn một chút. Nhiều người bắt đầu ở tuổi 40, 50, 60 vẫn chơi được những tác phẩm họ yêu thích. Xem lộ trình piano năm đầu.
  ly_do: '"Nhanh hơn trẻ em" không có nguồn; viết theo câu đã khóa ở bat-dau/bai-0 (n4).'
- cu: 'Năm đầu: 20–45 phút mỗi ngày là đủ và an toàn cho tay; nên chia thành hai buổi ngắn nếu được. Sau đó có thể tăng dần lên 60–90 phút, luôn có giờ nghỉ. Quan trọng hơn thời gian là cách tập: mục tiêu rõ, chậm, chia nhỏ. Xem Thói quen mỗi ngày và Cách tập hiệu quả.'
  moi: 'Năm đầu: 20–45 phút mỗi ngày là đủ; nên chia thành hai buổi ngắn nếu được. Sau đó có thể tăng dần lên 60–90 phút, tăng từ từ và luôn xen giờ nghỉ (xem Giữ đôi tay khỏe). Quan trọng hơn thời gian là cách tập: mục tiêu rõ, chậm, chia nhỏ. Xem Thói quen mỗi ngày và Cách tập hiệu quả.'
  ly_do: Bỏ "an toàn cho tay" (lời khẳng định sức khỏe không kiểm được); thêm tăng từ từ theo BAPAM (khớp piano/suc-khoe).
- cu: Với 30–45 phút mỗi ngày, tập đúng cách, nhiều người lớn chơi được đoạn đầu Für Elise sau vài tháng, cả bài khi tới chặng 4, thường sau hai năm rưỡi đến bốn năm; các bản nocturne dễ của Chopin sau khoảng bốn đến sáu năm; Clair de lune sau năm năm rưỡi trở lên. Con số dao động nhiều theo người. Xem từng chặng ở lộ trình piano và tác phẩm theo cấp độ.
  moi: Với 30–45 phút mỗi ngày, tập đúng cách, nhiều người lớn chơi được đoạn đầu Für Elise sau vài tháng, cả bài khi tới chặng 4, thường sau hai năm rưỡi đến bốn năm; các bản nocturne dễ của Chopin sau khoảng bốn đến năm năm rưỡi; Clair de lune sau năm năm rưỡi trở lên. Con số dao động nhiều theo người. Xem từng chặng ở lộ trình piano và tác phẩm theo cấp độ.
  ly_do: 'Khớp mốc thời gian chặng 5 (4–5,5 năm) ở src/data/cap-do.yml: nocturne dễ ở chặng 5.'
- cu: Học bằng ứng dụng (Simply Piano, Flowkey) hay video “phím rơi” (Synthesia) có được không?
  moi: Học bằng ứng dụng hay video “phím rơi” có được không?
  ly_do: Tên ứng dụng cụ thể là thông tin mau cũ (tên và tình trạng đổi); câu trả lời không phụ thuộc vào tên.
- cu: 'IMSLP và Mutopia có bản nhạc cổ điển thuộc phạm vi công cộng; IMSLP ghi tình trạng bản quyền theo từng nước ngay trên trang tải, nên hãy đọc dòng đó. Các ấn bản Urtext mới, bản soạn lại và nhạc của tác giả còn sống hoặc mới mất vẫn được bảo hộ. Ở Việt Nam, quyền tác giả với phần lớn tác phẩm kéo dài suốt cuộc đời tác giả và 50 năm sau năm tác giả mất (Luật Sở hữu trí tuệ, Điều 27). Cách chọn ấn bản tốt: Tác phẩm theo cấp độ.'
  moi: 'IMSLP và Mutopia có bản nhạc cổ điển thuộc phạm vi công cộng hay dùng giấy phép mở; IMSLP gắn nhãn tình trạng bản quyền theo luật Canada, Mỹ và Liên minh châu Âu cho từng bản nhạc; ở nước khác, trong đó có Việt Nam, bạn cần đối chiếu luật nước mình. Các ấn bản Urtext mới, bản soạn lại và nhạc của tác giả còn sống hoặc mới mất vẫn được bảo hộ. Ở Việt Nam, quyền tác giả có thời hạn bảo hộ do Luật Sở hữu trí tuệ quy định (Điều 27); hết thời hạn thì tác phẩm thuộc về công chúng. Cách chọn ấn bản tốt: Tác phẩm theo cấp độ.'
  ly_do: IMSLP chỉ gắn nhãn ba khu vực (Canada, Mỹ, EU); Mutopia dùng giấy phép Creative Commons; bỏ con số "50 năm" vì không xác nhận được văn bản Điều 27 hiện hành (xem ghi_chu của nhận định tương ứng).
- cu: Với 20 phút mỗi ngày, phần lớn người học đọc được nốt ở khóa Sol sau 2–4 tuần và khóa Fa sau thêm 2–4 tuần. Đọc nhanh như đọc chữ, đủ để thị tấu, thì cần nhiều tháng luyện tập. Công cụ đọc nốt cho bạn thấy tiến độ cụ thể; trang Đọc nhạc và thị tấu chỉ cách đọc trên đàn.
  moi: Mỗi người một khác. Lộ trình piano năm đầu đặt mốc đọc đúng 9/10 nốt khóa Sol, rồi khóa Fa, trong công cụ đọc nốt. Đọc nhanh như đọc chữ, đủ để thị tấu, thì cần luyện lâu hơn nhiều. Công cụ đọc nốt cho bạn thấy tiến độ cụ thể; trang Đọc nhạc và thị tấu chỉ cách đọc trên đàn.
  ly_do: Con số 2–4 tuần không có nguồn; thay bằng mốc của site ở bat-dau/lo-trinh-choi.
- cu: 'Đô cố định: Đô luôn là nốt C, dù bản nhạc ở giọng nào. Đây là cách dùng ở Việt Nam, Pháp, Ý. Đô di động: "Đô" là chủ âm của giọng đang chơi; ở giọng Sol trưởng, nốt Sol được hát là "Đô". Cách này phổ biến ở Anh, Mỹ, Hungary (phương pháp Kodály), rất mạnh cho luyện tai. Site này dùng Đô cố định để gọi tên nốt.'
  moi: 'Đô cố định: Đô luôn là nốt C, dù bản nhạc ở giọng nào. Đây là cách dùng ở Pháp, Ý, Tây Ban Nha, Nga… Đô di động: "Đô" là chủ âm của giọng đang chơi; ở giọng Sol trưởng, nốt Sol được hát là "Đô". Cách này phổ biến ở Anh, Mỹ, Hungary (phương pháp Kodály), rất mạnh cho luyện tai. Site này dùng Đô cố định để gọi tên nốt.'
  ly_do: Wikipedia (Solfège) liệt kê các nước dùng fixed do, không có Việt Nam; không có nguồn nào cho Việt Nam.
- cu: Được, nếu đàn có cổng USB-MIDI (hoặc MIDI qua bộ chuyển) và bạn dùng trình duyệt hỗ trợ Web MIDI (Chrome, Edge hoặc Opera trên máy tính). Safari và mọi trình duyệt trên iPhone, iPad chưa hỗ trợ MIDI trên web; khi đó các công cụ dùng micro (chơi theo, hát lại) vẫn chạy. Đàn thay chuột trong các công cụ đọc nốt, chơi theo, chép giai điệu. Xem Kết nối đàn MIDI.
  moi: Được, nếu đàn có cổng USB-MIDI (hoặc MIDI qua bộ chuyển) và bạn dùng trình duyệt có MIDI trên web. Trình duyệt nào không có thì công cụ tự báo khi bạn bấm kết nối; khi đó các công cụ dùng micro (chơi theo, hát lại) vẫn chạy. Đàn thay chuột trong các công cụ đọc nốt, chơi theo, chép giai điệu. Xem Kết nối đàn MIDI.
  ly_do: Danh sách trình duyệt hỗ trợ Web MIDI đổi theo thời gian (Firefox thêm hỗ trợ); viết chung như ô MIDI ở ket-noi-midi (công cụ tự báo trong src/scripts/midi.js).
