    ten: 'Organization of American Kodály Educators, The Kodály Concept: "The moveable do system, highly developed in English choral training, was advocated by Kodály as a tool for teaching musical literacy"; solfège là công cụ cho "Sight singing, Dictation, Ear training…" (truy cập 05/11/2026)'
    link: https://www.oake.org/about-us/the-kodaly-concept/
