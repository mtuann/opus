    bac: 2
    ten: 'Hồ sơ đã khóa nhac-ly/01-cao-do-ten-not: n7 (OMT Major Scales, mục từ fixed do: "do is always the pitch class C… regardless of scale"), n8 ("Ở Việt Nam, Pháp, Ý… người ta gọi tên nốt là Đô, Rê, Mi": Dolmetsch bài 1; lượt 2: Encyclopedia of Music in Canada, Solmization, fixed do dùng chủ yếu ở Pháp, Bỉ, Ý), n9 (tài liệu tiếng Anh viết tên nốt bằng chữ cái: OMT Reading Clefs). Không mở lại nguồn ở hồ sơ đó'
