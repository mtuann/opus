  ghi_chu: Đã kiểm src/content/docs/nhac-ly/01-cao-do-ten-not.md (Đô = C; gọi tên nốt theo Đô cố định) và src/data/thuat-ngu.yml.
- id: n36
  cau: 'Nên nghe bản thu nào: lúc đầu bản nào cũng được; khi đã thích một tác phẩm, nghe 2–3 bản thu khác nhau và chọn bản bạn thích.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên nghe nhạc.
