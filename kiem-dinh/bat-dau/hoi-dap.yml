    moi: 'Không bắt buộc, nhưng rất nên học vài bài. Lộ trình nghe hiểu 6 tháng chỉ dùng sáu bài nhạc lý: bài 1 và 4 (cao độ, nhịp), bài 6 và 7 (gam trưởng, gam thứ), bài 12 và 13 (hòa âm chức năng, kết). Biết gam, giọng và kết giúp bạn hiểu vì sao một đoạn nhạc nghe buồn, căng thẳng hay được giải tỏa.'
    ly_do: 'Review D8-gom: khớp bat-dau/lo-trinh-nghe (đã khóa): tuyến nghe dùng bài 1, 4, 6, 7, 12, 13, không phải 9 bài đầu.'
  - cu: Cả hai. Ở Việt Nam, sách và thầy cô dùng Đô Rê Mi; phần lớn tài liệu tốt trên mạng, phần mềm và ký hiệu hợp âm dùng chữ cái. Site này luôn ghi cả hai.
    moi: Cả hai. Ở Việt Nam, tên nốt gọi là Đô, Rê, Mi; trong tài liệu tiếng Anh và trong ký hiệu hợp âm (C, Am, G7), tên nốt viết bằng chữ cái. Site này luôn ghi cả hai.
    ly_do: 'Review D8-gom: viết theo câu đã khóa ở nhac-ly/01 (n8, n9 đã bỏ "phần mềm", "tài liệu tốt"); ký hiệu hợp âm theo OMT Chord Symbols.'
  - cu: Kiểm tra điện thoại không ở chế độ im lặng (trên iPhone, công tắc im lặng chặn cả âm thanh trang web), và bấm vào trang một lần trước khi phát. Âm thanh của khuông nhạc cần mạng ở lần đầu tiên.
    moi: 'Kiểm tra điện thoại không ở chế độ im lặng: trên iPhone, chế độ này mặc định tắt cả tiếng do trang web phát, kể cả tiếng của khuông nhạc trên site. Bấm vào trang một lần trước khi phát. Âm thanh của khuông nhạc cần mạng ở lần đầu tiên.'
    ly_do: 'Review D8-gom: theo WebKit Bugzilla 237322 (mặc định "ambient", bị tắt khi máy im lặng); công cụ dùng am-thanh.js đặt "playback" nên vẫn phát, còn khuông nhạc (abc.js) thì không.'
  - cu: Bài ấy không phải của Chopin. Đó là Mariage d'Amour của Paul de Senneville, viết năm 1978 và nổi tiếng qua bản thu của Richard Clayderman. Bản piano solo đầy đủ ở khoảng Grade 5–6 (đầu chặng 5); có nhiều bản soạn dễ hơn cho chặng 2–3. Bài còn bản quyền, nên hãy dùng bản nhạc được cấp phép. Xem Bài phổ biến ngoài nhạc cổ điển.
    moi: Bài ấy không phải của Chopin. Đó là Mariage d'Amour của Paul de Senneville, nổi tiếng qua các bản thu của Richard Clayderman. Bản piano solo đầy đủ ở khoảng Grade 5–6 (đầu chặng 5); có nhiều bản soạn dễ hơn cho chặng 2–3. Bài còn bản quyền, nên hãy dùng bản nhạc được cấp phép. Xem Bài phổ biến ngoài nhạc cổ điển.
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): bỏ "viết năm 1978" (chỉ có Wikipedia); Musicnotes và BnF xác nhận tác giả Paul de Senneville; trang piano/tac-pham-theo-cap cũng đã bỏ năm này.'
