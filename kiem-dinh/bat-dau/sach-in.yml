  - id: n26
    cau: "Chữ sinh ra trên bìa sách (src/sach/sach.mjs, SACH.mo_ta): mô tả bảy cuốn: \"Bài 1–14 và ba bài ôn tập: từ tên nốt đến hòa âm chức năng và ký hiệu biểu diễn.\"; \"Bài 15–32 và âm học: tiết tấu nâng cao, điệu thức, chuyển giọng, hòa âm bốn bè, đối âm, kết cấu, hình thức.\"; \"Tờ tóm tắt nhạc lý và từ điển thuật ngữ.\"; \"Các thời kỳ, nhà soạn nhạc, opera, nhạc cổ điển và nhạc truyền thống Việt Nam; lịch sử cây đàn piano, các thể loại, nhà soạn nhạc và nghệ sĩ piano.\"; \"Cách đọc tên tác phẩm và bản thu, cùng các hướng dẫn nghe từng bước, có chỗ để ghi mốc thời gian bằng tay.\"; \"Lộ trình 7 chặng và lộ trình năm đầu, chọn đàn, tư thế, … hòa âm bên phím và ứng tác.\"; \"10 bài hai tay có số ngón, tác phẩm theo cấp độ và các bài học tác phẩm, từ Minuet Fa trưởng của Mozart đến Ballade số 1 của Chopin: cấu trúc, chỗ khó, bài tập chuẩn bị, kế hoạch tập.\""
    loai: ve-site
    ket_qua: dung
    ghi_chu: "chưa chắc (cho review): chữ sinh ra, không qua so chữ (thêm theo review mã D7-L3). Mỗi mô tả phải khớp danh sách SACH[i].trang và các trang ấy; mô tả cũ của books.py bỏ số (42 hướng dẫn nghe, 16 về piano, 34 bài học, hơn 100 thuật ngữ). Review kiểm trên src/sach/sach.mjs và dist/sach/*.html của bản xem. Review D7-gom: src/sach/sach.mjs SACH[i].mo_ta khớp nguyên văn câu; đối chiếu với SACH[i].trang: nhạc lý cơ bản từ bài 1 (tên nốt) đến 12 (hòa âm chức năng), 14 (ký hiệu biểu diễn); nâng cao có 15, 16, 19, 21, 22, 28, 31; lịch sử có viet-nam (Nhạc cổ điển ở Việt Nam) và nhac-truyen-thong-viet-nam; hướng dẫn nghe có doc-ten-tac-pham (site cũ: \"Đọc tên tác phẩm và bản thu\"), bảng \"Theo dõi khi nghe\" giữ cột thời điểm \"…\" để ghi tay (dist/sach/huong-dan-nghe.html, chương bach-goldberg); piano-ky-thuat có piano/lo-trinh (7 chặng) và bat-dau/lo-trinh-choi (Lộ trình piano năm đầu); piano-tac-pham mở đầu mozart-minuet-k2, cuối chopin-ballade-1. Không ghi số bài."
    review: dung
  - id: n27
    cau: "Chữ sinh ra trên bìa sách: \"Bản in ngày <ngày build> · <số> chương · Bản trực tuyến: https://mtuann.github.io/opus/\"; khi thiếu chương: \"<số> chương (các trang đã lên site; trang khác sẽ có trong sách khi lên site)\"; khi không có chương nào: \"Chưa có chương nào: các trang của cuốn này chưa lên site\" (không có mục lục)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "chưa chắc (cho review): trangSach ở src/sach/sach.mjs; số chương là số trang của cuốn có trong bản build (dungSach). Sách chỉ dựng khi trang bat-dau/sach-in có trong bản build (review mã D7-L3, mục 1), nên bản thật chưa có dist/sach/ tới khi trang này khóa. Review D7-gom: trangSach: soChuong ba trường hợp đúng nguyên văn; mục lục chỉ dựng khi chuong.length > 0; dist/sach/huong-dan-nghe.html: \"1 chương (các trang đã lên site; …)\", nhac-ly-co-ban: \"17 chương\"."
    review: dung
