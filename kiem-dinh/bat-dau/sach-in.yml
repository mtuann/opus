    ghi_chu: "chưa chắc: Firefox có \"Print headers and footers\" (Mozilla Support, qua kết quả tìm kiếm). Không mở được trang Chrome hay Safari nói về mục này; chữ \"Đầu trang và chân trang\" là chữ của Chrome/Edge tiếng Việt, không kiểm được. Đề xuất: \"Nên tắt mục đầu trang và chân trang trong hộp thoại in (nếu có)\". Review D7-gom: Mozilla Support (bản lưu Wayback 29/12/2025): \"More settings: … Print headers and footers\". Không mở được trang chính thức của Chrome nói về mục này, nên viết \"nếu hộp thoại in có\", bỏ tên mục theo chữ của Chrome. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://support.google.com/chrome/answer/1069693; Trang Chrome đã mở không nhắc 'Headers and footers'. Tìm kiếm cho thấy tùy chọn nằm ở More settings, bỏ chọn thì mất tiêu đề, URL, ngày, số trang (nguồn bên thứ ba, chưa xác nhận ở trang chính thức). Lời khuyên hợp lý.."
    luot_2: dung
    luot_2_nguon: [ "https://support.mozilla.org/en-US/kb/how-print-web-pages-firefox" ]
    luot_2_ghi_chu: "Mozilla Support: mục Print headers and footers nằm trong More settings của hộp thoại in. Tắt mục này bỏ tiêu đề, địa chỉ, ngày, số trang khỏi bản in (nhiều hướng dẫn thứ cấp cho Chrome nói tương tự: Headers and footers trong More settings; trang Chrome Help chính thức không mở được phần này)."
  - id: n19
    cau: "Trên điện thoại, lệnh In nằm trong menu của trình duyệt (thường trong mục Chia sẻ)."
    loai: quy-tac
    ket_qua: dung
    ghi_chu: "chưa chắc: không mở được trang hỗ trợ Chrome (Android), Safari (iPhone) nào nói rõ. Kết quả tìm kiếm cho thấy Apple dùng Chia sẻ rồi In ở một số ứng dụng (Ghi chú) nhưng không phải bản Safari. Đề xuất viết chung hơn hoặc bỏ câu. Review D7-gom: Chrome Help (Android): \"At the top right, tap More > Share. Select Print\"; Apple, Print from iPhone: chạm nút Chia sẻ, Thêm, Trả lời hay menu Tác vụ (tùy ứng dụng), rồi Print. Khớp \"trong menu của trình duyệt (thường trong mục Chia sẻ)\"."
    luot_2: khong-chac
    luot_2_ghi_chu: Trang Apple đã mở (support.apple.com/guide/iphone/...) chỉ hiện mục lục, không có bước in. Theo hiểu biết chung lệnh In nằm trong menu Chia sẻ của Safari, nhưng chưa xác nhận bằng nguồn chính thức; Mozilla Support không tải được.
    nguon: [ chrome-print-android, apple-print-iphone ]
  - id: n20
