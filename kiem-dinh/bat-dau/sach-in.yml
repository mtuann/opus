    cau: "Chữ sinh ra trên bìa sách: \"Nội dung theo giấy phép CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/): được chia sẻ và chỉnh sửa nếu ghi nguồn và chia sẻ lại theo cùng giấy phép. Bản thu, font và nội dung trích từ nguồn khác giữ giấy phép riêng.\""
