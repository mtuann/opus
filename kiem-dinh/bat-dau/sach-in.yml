    loai: quy-tac
    ket_qua: dung
    ghi_chu: "chưa chắc: không có nguồn chính thức khớp đã mở. Đề xuất bỏ hoặc nói chung \"tùy trình duyệt\". Review D7-gom: Chrome Help (Android): \"To save your print preview as a PDF, tap Save as PDF\". Câu viết \"có thể\", không nói mọi trình duyệt; không mở được trang Apple nói về lưu PDF từ xem trước bản in."
    luot_2: khong-chac
    luot_2_ghi_chu: "Như n19: trang Apple không cho nội dung bước in. Hiểu biết chung: ở iOS xem trước bản in rồi Chia sẻ để lưu PDF; chưa xác nhận bằng nguồn chính thức."
    nguon: [ chrome-print-android ]
