ghi_chu: "Trang khung (D7-L3, phần 2/2). 25 nhận định: 20 ve-site (kiểm trên src/sach/sach.mjs, dist/sach/*.html, trang đích), 5 quy-tac về trình duyệt. Không sửa trang. n15 dung (Chrome, Firefox). n16, n18, n19, n20 chưa chắc: không mở được trang hỗ trợ Chrome/Apple (Safari iPhone) nói về \"Save as PDF\", \"Headers and footers\", Chia sẻ → In; chỉ Firefox có nguồn (xem từng ghi chú, có đề xuất viết chung hơn cho người giao quyết). Mã sách khớp trang ở mọi điểm đã kiểm; lưu ý n24: doi_chu của người giao nói abc.js, thực tế vẽ trước khi in nằm ở tai.js (beforeprint). Người giao đã sửa tiêu đề bảng thành \"Mở\" (thêm doi_chu): n12 vẫn đúng."
doi_chu:
  - cu: Đọc tên tác phẩm và 42 hướng dẫn nghe (16 về nhạc piano)
    moi: Đọc tên tác phẩm và các hướng dẫn nghe
    ly_do: Số hướng dẫn nghe theo site cũ; sách mới chỉ gồm trang đã lên site (src/sach/sach.mjs), nên bảng không ghi số mà bìa sách ghi số chương.
  - cu: 10 bài hai tay có số ngón, tác phẩm theo cấp và 34 bài học tác phẩm
    moi: 10 bài hai tay có số ngón, tác phẩm theo cấp và các bài học tác phẩm
    ly_do: "Như trên: số bài học tác phẩm theo site cũ (34); bài học tác phẩm lên site ở đợt 6."
  - cu: null
    moi: Sách chỉ gồm các trang đã lên site; trang nào chưa lên thì chưa có trong sách, và số chương ghi ở trang bìa.
    ly_do: "Thêm (D7-L3): sách sinh từ trang có trong bản build, chương chưa lên site thì bỏ, bìa ghi số chương (AGENTS.md mục D7-L3)."
  - cu: "Trên điện thoại: Android (Chrome) chọn menu ⋮ → Chia sẻ → In; iPhone (Safari) chọn Chia sẻ → In, rồi đặt hai ngón tay lên trang xem trước và kéo giãn ra (như phóng to ảnh) để mở bản PDF, sau đó bấm Chia sẻ → Lưu vào Tệp."
    moi: "Trên điện thoại: tìm lệnh In trong menu của trình duyệt (thường nằm trong mục Chia sẻ); từ màn hình xem trước bản in có thể lưu thành PDF."
    ly_do: "Hướng dẫn theo giao diện từng phiên bản trình duyệt (bao-cao/d2-bang-tang.md dòng 113: giữ ngắn hay bỏ): viết ngắn, không tả từng thao tác của iPhone."
  - cu: "Muốn in một bài lẻ: mở bài đó và bấm nút In bài này ở đầu trang. Muốn giấy kẻ khuông để làm bài tập: xem Giấy kẻ khuông."
    moi: "Muốn in một bài lẻ: mở bài đó rồi dùng lệnh In của trình duyệt (Ctrl+P, trên Mac Cmd+P); khuông nhạc trong bài được vẽ đủ trước khi in. Muốn giấy kẻ khuông để làm bài tập: xem Giấy kẻ khuông."
    ly_do: Site mới không có nút "In bài này" (nút của site cũ, mkdocs); in bằng lệnh In của trình duyệt, khuông nhạc vẽ hết trước khi in (beforeprint trong src/scripts/tai.js).
  - cu: null
    moi: Mở
    ly_do: Ô tiêu đề cột thứ ba của bảng rỗng ở site cũ; axe (empty-table-header) báo lỗi trợ năng, nên đặt tên cột "Mở".
