ghi_chu: >-
  Phần lớn trang là lời khuyên tập (khuyen-tap), đã đối chiếu với các trang lõi cũ trong ../opus-zero/docs/
  (piano/lo-trinh.md, piano/cach-tap.md, bat-dau/moi-ngay.md, piano/hai-tuan-dau.md, piano/10-bai-dau-tien.md,
  piano/nam-ngon.md, piano/hop-am-rai.md, piano/ban-dap.md, piano/not-hoa-my.md, piano/thi-tau.md,
  piano/hoc-thuoc-bieu-dien.md, luyen-tai/nghe-quang.md, luyen-tai/choi-bang-tai.md, luyen-tap/doc-not.md,
  luyen-tap/tiet-tau.md, luyen-tap/thi-tau.md, luyen-tap/hoa-bieu.md). Các câu chỉ dẫn sang bài nhạc lý (số bài và tên
  ngắn) là điều hướng, không tính là nhận định; đã so với tiêu đề trong ../opus-zero/docs/nhac-ly/: bài 1–3 (Cao độ và
  tên nốt; Khuông nhạc và khóa; Trường độ và dấu lặng), 4–5 và Ôn tập 1 (bài 1–5), 6–7 (Gam trưởng; Gam thứ), 8–9
  (Hóa biểu và vòng quãng năm; Quãng), Ôn tập 2 (bài 6–9) và bài 10 (Hợp âm ba), 11–12 (Hợp âm bảy và thể đảo; Hòa âm
  chức năng), 13 (Kết và câu nhạc), 14 (Ký hiệu biểu diễn) và Ôn tập 3 (bài 10–14), 15 (Tiết tấu nâng cao), 31 (Hình
  thức nhỏ), 26 (Phân tích một tác phẩm): đều khớp; năm đầu học tới bài 15, khớp câu "học hết bài 1–15 ngay trong 12
  tháng" của piano/lo-trinh.md và "nhánh nhạc lý từ bài 16" ở mục Năm thứ hai. Công cụ được nêu (đọc nốt khóa Sol và
  khóa Fa, tiết tấu cấp độ 1, thị tấu cấp độ 1, hóa biểu, nghe quãng, nghe hợp âm, chơi theo tai, nhật ký) đều có ở site
  cũ, sẽ chuyển ở đợt 3 và đợt 7; link tới chúng hiện "sắp có" cho tới khi lên. Không có chi tiết mau cũ (tên ứng dụng,
  dịch vụ, giá, sự kiện): "điện thoại để thu âm", "nhóm học đàn trực tuyến", "quay video" là thiết bị và cách làm
  chung, không gắn với sản phẩm nào. Chặng và Grade của bài học trên site theo dữ liệu đã kiểm của D2-0 (nhánh
  moi/d2-0-du-lieu, src/data/tac-pham.yml), cùng nguồn D2-0 đã dùng, mở lại khi kiểm. Hai chỗ sửa: n12 (quãng tháng 3)
  và n38 (danh sách bài năm thứ hai).
