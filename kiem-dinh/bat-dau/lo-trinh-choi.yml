    cau: 'Tháng 8, bên đàn: Mozart: Minuet Fa trưởng K. 2: câu bốn ô, kết nửa và kết trọn.'
    loai: cau-truc
    nguon: [ mutopia-k2, imslp-k2 ]
    ket_qua: dung
    ghi_chu: 'Review (24/10/2026): giữ: IMSLP và Mutopia gọi bài là Minuet (Köchel trực tuyến của Mozarteum ghi KV 2 là "Klavierstück in F"); kết nửa ở ô 8, kết trọn ở ô 16. Lượt 1: IMSLP: "Minuet in F major", "K.2", Fa trưởng, 1762 (sổ nhạc của Nannerl). Mutopia (ấn bản Breitkopf & Härtel), 24 ô nhịp 3/4, chia các câu bốn ô: ô 1–4 dừng ở hợp âm chủ Fa (bè trầm Đô–Fa), ô 5–8 dừng trên hợp âm Đô (V) có Si♭ ở ô 7, tức kết nửa; ô 13–16 và ô 21–24 kết trọn (V–I) ở Fa trưởng; ô 9–12 ghé Sol thứ; ô 20 dừng trên Rê (kết lừa, có dấu ngân). Câu của trang chỉ nêu kết nửa và kết trọn: đúng.'
    luot_2: dung
    luot_2_nguon: [ https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1770, "https://imslp.org/wiki/Minuet_in_F_major,_K.2_(Mozart,_Wolfgang_Amadeus)", https://kv.mozarteum.at/de/work/klavierstuck-in-f-1009, https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/ ]
    luot_2_ghi_chu: 'Bản gõ lại trên Mutopia (từ Breitkopf, Wolfgang Amadeus Mozarts Werke Serie 22 số 2): 3/4, Fa trưởng, ô 1–8 có dấu nhắc lại, các đoạn đều 4 ô: ô 4 kết về Fa, ô 8 kết trên Đô (V), ô 12 kết Sol thứ, ô 16 kết V7–I về Fa. Theo OMT (Introduction to Harmony), kết nửa là câu dừng ở V, kết trọn là V–I: khớp "kết nửa ở ô 8, kết trọn ở ô 16". Lưu ý tên: IMSLP (Minuet in F major, K.2, 1762, Nannerl-Notenbuch) và Mutopia gọi là Minuet/Menuett; Köchel online của Mozarteum ghi KV 2 là "Klavierstück in F" (NMA IX/27/1 số 58).'
