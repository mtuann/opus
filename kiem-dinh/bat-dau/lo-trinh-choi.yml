    ghi_chu: 'Câu trấn an, không phải số liệu; cùng ý với piano/cach-tap.md ("Gần như ai cũng có những tuần thấy mình không tiến bộ") và piano/lo-trinh.md, mục "Khi bị chững lại". Tháng 2 là tháng ghép hai tay với hợp âm tay trái, tháng 6 là tác phẩm thật đầu tiên (bản gốc Minuet Sol trưởng): khớp nội dung hai tháng.'
  - id: n42
    cau: 'Khi chậm hơn lộ trình: giữ thói quen, giảm mục tiêu (15 phút mỗi ngày tốt hơn bỏ một tuần); một bài thôi; kiểm tra cách tập (phần lớn "chững lại" đến từ tập quá nhanh hoặc luôn chơi từ đầu bài); đau là dừng, tiến độ không bao giờ đáng đổi lấy chấn thương.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp piano/cach-tap.md, mục "Khi bị giậm chân tại chỗ" ("Bạn đang tập hay chỉ đang chơi? Chơi đi chơi lại từ đầu dễ chịu nhưng ít tiến bộ"; "tập chậm hẳn") và "Ngày bận chỉ có 10 phút"; piano/suc-khoe.md (đau là dấu hiệu cảnh báo); bat-dau/moi-ngay.md ("Đau là tín hiệu dừng").'
