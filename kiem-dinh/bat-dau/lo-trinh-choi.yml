nhan_dinh:
  - id: n1
    cau: 'Kế hoạch 12 tháng cho người lớn bắt đầu học piano từ con số 0, tập 20–30 phút mỗi ngày trong sáu tháng đầu, rồi khoảng 30 phút, 5–6 ngày mỗi tuần.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp piano/lo-trinh.md, bảng tổng quan (chặng 1: "20–30 phút/ngày", 0–6 tháng; chặng 2: "30 phút") và thoi_luong của cap-do.yml (đã kiểm ở D2-0). piano/hai-tuan-dau.md dặn "ngày nào cũng tập" cho hai tuần đầu; kế hoạch cả năm tính 5–6 ngày mỗi tuần: không trái nhau, nhưng ghi lại để review xem có muốn nói một kiểu.'
    luot_2: dung
    luot_2_ghi_chu: Khuyến nghị 20–30 phút mỗi ngày cho người lớn mới học, tăng dần lên khoảng 30 phút, 5–6 ngày mỗi tuần, hợp lẽ thường của sư phạm piano; không có nguy cơ gì.
  - id: n2
    cau: 'Cuối năm, bạn có một chương trình nhỏ ba bài để chơi cho người khác nghe, ở khoảng trình độ ABRSM Grade 1–2.'
    loai: cap-do
    nguon: [ abrsm-1920, henle-hn134, imslp-k2 ]
    ket_qua: dung
    ghi_chu: 'Ba bài ví dụ của chương trình (tháng 11): Musette Rê trưởng: ABRSM 2019 & 2020, Grade 2 ("2 Anon. Musette in D, BWV Anh. II 126"); Minuet K. 2: không có trong đề cương ABRSM, Henle HN 134 ghi "Minuet (Nannerl Music Book) K. 2" mức "1 easy"; Bài ca Pháp cổ: ABRSM 2019 & 2020 xếp ở Grade 3 ("6 Tchaikovsky Old French Song (No. 16 from Album for the Young, Op. 39)"), dữ liệu D2-0 ghi Grade 2–3, chặng 2. Cuối năm đầu là chặng 2 (Grade 1–2, cap-do.yml). Chữ "khoảng" đủ rộng cho một bài ở đầu trên; review có thể cân nhắc.'
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2023-09/piano-2021-2022-syllabus-rev-sep-2020-final.pdf, https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf, https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf, https://www.henle.de/en/Album-for-the-Young-op.-68/HN-45, https://www.henle.de/Notebook-for-Anna-Magdalena-Bach/HN-349 ]
    luot_2_ghi_chu: 'Khoảng Grade 1–2 là hợp lý. Đề cương ABRSM: Schumann Melodie (Op. 68 số 1) Grade 1 (2021–22); L. Mozart Minuet in F (Nannerl-Notenbuch) Grade 1 (2025–28); Petzold Minuet No. 2 in G minor Grade 2 (2027–28); nhưng Wilder Reiter (Op. 68 số 8) và Tchaikovsky Chanson italienne (Op. 39 số 15) ở Grade 3. Henle: Melodie mức 2, Wilder Reiter và Fröhlicher Landmann mức 3, các Menuet BWV Anh. 114/115 và Musette BWV Anh. 126 mức 1. Dải thực tế của các bài nêu tên là Grade 1–3, nên giữ chữ "khoảng".'
  - id: n3
    cau: 'Thời gian chỉ là gợi ý. Đi chậm hơn một nửa vẫn hoàn toàn ổn, miễn là đều đặn và tay không đau.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp chú thích của bảng tổng quan ở piano/lo-trinh.md: "có người đi nhanh gấp đôi, có người mất gấp đôi thời gian, và cả hai đều bình thường".'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý; điều kiện "đều đặn và tay không đau" đúng nguyên tắc an toàn.
  - id: n4
    cau: '3 phút khởi động · 5 phút năm ngón hoặc gam · 15 phút bài đang học (đoạn khó trước) · 5 phút đọc nốt hoặc thị tấu · 2 phút ghi nhật ký. Nhạc lý, luyện tai và nghe nhạc làm thêm ngoài giờ ngồi đàn, khoảng 10 phút.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Cộng lại đúng 30 phút; khớp bảng "Buổi 30 phút (chuẩn)" của bat-dau/moi-ngay.md (cùng năm phần và số phút; khởi động ở đó gồm năm ngón chậm, kỹ thuật là gam) và câu "dành thêm 10 phút cho nghe chủ động hoặc một bài nhạc lý". piano/cach-tap.md, mục "Mẫu buổi tập", có cột 20 phút như câu dẫn "buổi 20 phút cho những tháng đầu".'
    luot_2: dung
    luot_2_ghi_chu: Cơ cấu buổi tập 30 phút (khởi động, kỹ thuật, bài đang học làm đoạn khó trước, đọc nốt/thị tấu, ghi nhật ký) phù hợp sư phạm phổ biến; 10 phút ngoài giờ cho lý thuyết, luyện tai và nghe là hợp lý.
  - id: n5
    cau: 'Trước khi bắt đầu: chuẩn bị đàn, ghế, máy đếm nhịp và điện thoại để thu âm theo danh sách Trước ngày đầu tiên; đọc Tư thế, thế tay và cách dùng lực và Cách tập hiệu quả; quyết định học với thầy, tự học hay kết hợp.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp piano/hai-tuan-dau.md, mục "Trước ngày đầu tiên": một cây đàn, một chiếc ghế chỉnh được độ cao, "Điện thoại để thu âm", máy đếm nhịp, bút chì, một khung giờ cố định. Neo #truoc-ngay-au-tien là id của mục ấy ở trang cũ.'
    luot_2: dung
    luot_2_ghi_chu: "Chuẩn bị đàn, ghế, máy đếm nhịp, thu âm; đọc trước tư thế và cách tập; quyết định học với thầy hay tự học: đều là bước chuẩn bị chuẩn."
  - id: n6
    cau: 'Tháng 1, bên đàn: Hai tuần đầu tiên (tư thế, Đô giữa, thế Đô), rồi 10 bài đầu tiên, bài 1–3; đọc nốt khóa Sol mỗi ngày. Danh sách kiểm tra: chơi bài 1–3 hai tay ở ♩ = 72, không dừng; đọc đúng 9/10 nốt khóa Sol trong công cụ đọc nốt; tìm được mọi phím Đô và Fa trên đàn chỉ trong một giây.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'piano/hai-tuan-dau.md, tuần 1: ngồi đúng, tìm Đô giữa, tay ở thế Đô; "kế hoạch đó dẫn thẳng vào ba bài đầu" của piano/10-bai-dau-tien.md. Ba bài đầu có tốc độ mẫu ♩ = 80, 88, 88 (dòng Q: của khuông), trang dặn tập hai tay ở ♩ = 50–60 rồi tăng dần: mục tiêu ♩ = 72 nằm giữa, không trái. Mức 9/10 khớp luyen-tap/doc-not.md ("Chỉ chuyển sang bước tiếp khi đúng ngay lần đầu khoảng 9/10"). piano/10-bai-dau-tien.md: "Lộ trình piano năm đầu trải mười bài trong khoảng năm tháng đầu", khớp lịch bài 1–3, 4–5, 6–7, 8, 9–10 của tháng 1–5.'
    luot_2: dung
    luot_2_ghi_chu: Kế hoạch tháng 1 hợp lý cho người mới (tư thế, Đô giữa, thế Đô trước, rồi các bài đầu); ♩ = 72 cho bài 1–3 là tốc độ vừa phải; tiêu chí 9/10 nốt khóa Sol và nhận phím Đô/Fa nhanh là cụ thể, kiểm được.
  - id: n7
    cau: 'Bach: Prelude Đô trưởng. Hãy nhớ cảm giác này: đến chặng 4 của lộ trình, chính bạn sẽ chơi nó.'
    loai: cap-do
    nguon: [ trinity-2023 ]
    ket_qua: dung
    ghi_chu: 'Trinity, danh sách tác phẩm piano từ 2023 (bản cập nhật tháng 8/2026), Grade 5: "Prelude in C, BWV 846". Chặng 4 = Grade 4–5 (cap-do.yml); dữ liệu D2-0: bach-prelude-do chang 4, grade "Grade 4–5".'
    luot_2: dung
    luot_2_nguon: [ https://www.henle.de/en/The-Well-Tempered-Clavier-Part-I-BWV-846-869/HN-14, https://www.henle.de/Notebook-for-Anna-Magdalena-Bach/HN-349, "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: Prelude Đô trưởng là BWV 846 (Das wohltemperierte Klavier I). Henle xếp mức 1 (dễ nhất) cho Prelude này (cả trong HN 14 lẫn trong Notebook for Anna Magdalena Bach, HN 349), nên "đến chặng 4 sẽ chơi được" là ước lượng thận trọng, không mâu thuẫn; độ khó của bài nằm ở nhạc cảm hơn là kỹ thuật.
  - id: n8
    cau: 'Tháng 2, bên đàn: 10 bài đầu tiên, bài 4–5 (hợp âm tay trái, Frère Jacques); Vị trí năm ngón: thế Đô, Sol, Fa, song song và ngược chiều; đọc nốt khóa Fa; tiết tấu cấp 1. Danh sách kiểm tra: đổi hợp âm Đô–Mi–Sol ↔ Si–Fa–Sol ở tay trái mà không nhìn tay; đọc đúng 9/10 nốt khóa Fa; gõ đúng tiết tấu cấp 1.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'piano/10-bai-dau-tien.md: bài 4 Hänschen klein, "hợp âm ba nốt ở tay trái", đổi giữa "hợp âm chủ Đô – Mi – Sol (ngón 5-3-1) và hợp âm át bảy Si – Fa – Sol (ngón 5-2-1)", tập "mắt nhìn bản nhạc chứ không nhìn tay"; bài 5 Frère Jacques; "Từ bài 4, tập song song các thế Sol và Fa ở Vị trí năm ngón". piano/nam-ngon.md có bài tập "Song song", "Ngược chiều" và "cùng bài ở thế Sol và thế Fa". Công cụ đọc nốt có khóa Fa; công cụ tiết tấu có "Cấp độ 1: tròn, trắng, đen" (docs/assets/js/rhythm.js).'
    luot_2: dung
    luot_2_ghi_chu: Kế hoạch tháng 2 hợp lý. Đổi hợp âm Đô–Mi–Sol ↔ Si–Fa–Sol (thế tay trái của I và V7 lược quãng năm) không nhìn tay là thế tay thông dụng cho người mới; 9/10 nốt khóa Fa cùng chuẩn với khóa Sol ở tháng 1.
  - id: n9
