nhan_dinh:
  - id: n1
    cau: 'Opus dạy nhạc cổ điển qua cây đàn piano: bạn học nhạc lý bằng mắt và tai, rồi biến nó thành thứ sờ được dưới mười ngón tay. Chưa có đàn vẫn bắt đầu được (nghe và đọc nhạc), nhưng piano là con đường chính của site.'
    loai: ten
    nguon: [ ke-hoach ]
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): câu về chính site, đã kiểm trên trang (câu mở đầu bài 0) và kế hoạch (tên Opus; piano là con đường chính, nghe và đọc nhạc đi kèm). Giữ da-sua vì câu đổi tên site so với trang cũ. Lượt 1: Câu cũ mở đầu bằng "Opus Zero dạy nhạc cổ điển…". Tên site đổi thành Opus ngày 23/10/2026 (kế hoạch, mục Quyết định); sửa ở commit a745865. Phần còn lại của câu tả cách site dạy, không đổi.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu tự mô tả mục tiêu của site (loại 'ten' ghi chưa đúng); không có nguồn ngoài để kiểm. Khớp với mô tả dự án trong AGENTS.md (sổ tay tiếng Việt học piano cổ điển cho người lớn tự học) nhưng đó không phải nguồn độc lập. Đề nghị coi là không cần nguồn hoặc bỏ khỏi danh sách nhận định.
  - id: n2
    cau: '"Nhạc cổ điển" ở đây là cả truyền thống âm nhạc nghệ thuật phương Tây, từ thánh ca thời Trung cổ đến các nhà soạn nhạc đang sống.'
    loai: dinh-nghia
    nguon: [ omt-khac ]
    ket_qua: dung
    ghi_chu: 'OMT, Stylistic Periods: "the ways in which music theorists and musicologists historically periodize Western classical music": "Medieval: c. 600–1400 … Post-tonal: c. 1900–present". Hiểu "nhạc cổ điển" theo nghĩa rộng (cả truyền thống, đến hôm nay) khớp cách OMT dùng "Western classical music".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/classicalmusichistory ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation, mục Stylistic Periods: 'Western classical music' được chia thành Medieval (c. 600–1400), Renaissance, Baroque, Classical, Romantic, Post-tonal (c. 1900–present). Naxos, Classical Music History: 'classical' là một truyền thống trải 'from the monastic intonings of Gregorian chant' trở đi, các thời kỳ kéo đến 'c.1920–Present'. Khớp với câu: nghĩa rộng gồm cả thánh ca Trung cổ lẫn nhạc đương đại."
  - id: n3
    cau: Thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven.
    loai: nam
    nguon: [ omt-khac, omt-sonata ]
    ket_qua: dung
    ghi_chu: 'OMT, Stylistic Periods: "Classical: c. 1750–1820". OMT, Sonata Form, tài liệu tham khảo: Caplin, "Classical Form: A Theory of Formal Functions for the Instrumental Music of Haydn, Mozart, and Beethoven" (1998): ba người tiêu biểu của thời kỳ.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/classicalmusichistory, https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/ ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation: Classical c. 1750–1820 (Baroque c. 1600–1750, Romantic c. 1800–1910, nên hai thời kỳ gối nhau). Naxos ghi c.1750–c.1830, nên 'khoảng' là hợp lý. Haydn và Mozart là hai nhà soạn nhạc trung tâm của thời kỳ (Naxos, mục Classical); Beethoven đứng ở lúc Cổ điển đạt đỉnh và chuyển sang Lãng mạn (Naxos, mục Early Romantic); OMT dẫn sách Caplin, Classical Form: ... the Instrumental Music of Haydn, Mozart, and Beethoven (Further Readings của chương Sonata Form). 'Chỉ' (nghĩa hẹp) đúng với cách dùng phổ biến."
  - id: n4
    cau: Người lớn vẫn học được piano và có lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp động tác, nên ngón tay người lớn có thể quen chậm hơn.
    loai: quy-tac
    nguon:
      - schneider-2008
      - king-2013
      - penhune-2011
      - bailey-penhune-2012
      - steele-2013
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): viết lại theo lượt 2. Câu trước: "Người lớn biết tự sắp xếp việc tập tốt hơn trẻ em; ngón tay có thể quen chậm hơn một chút, nhưng đó là chuyện thời gian chứ không phải giới hạn." Nghiên cứu về giai đoạn nhạy cảm cho thấy học sớm có lợi thế về vận động: người bắt đầu học nhạc trước 7 tuổi đồng bộ động tác với nhịp tốt hơn người bắt đầu muộn dù cùng số năm học (Penhune 2011; Bailey và Penhune 2012), kèm khác biệt ở thể chai (Steele và cộng sự 2013), nên bỏ vế "không phải giới hạn". Người lớn vẫn học được chuỗi động tác (King và cộng sự 2013: ở người lớn tuổi "the initial acquisition of motor sequences is not altered", trừ bài phức tạp); khả năng tự điều khiển việc học tăng dần qua tuổi thơ và tuổi dậy thì (Schneider 2008). Không ghi "hiểu lý thuyết": không có nguồn so sánh người lớn với trẻ em về mặt này. Lượt 1: Câu cũ: "Người lớn hiểu nhạc lý và biết tự sắp xếp việc tập tốt hơn trẻ em; …". Bỏ "hiểu nhạc lý": không tìm được nguồn so sánh người lớn và trẻ em về hiểu nhạc lý. Schneider 2008: kiến thức siêu nhận thức "show steady improvement through childhood and adolescence, mainly due to increases in knowledge about strategies", và "Age trends … are significant for self-control activities" (tự sắp xếp, tự điều khiển việc học tăng theo tuổi). King và cộng sự 2013 (người lớn tuổi): "the initial acquisition of motor sequences is not altered, except under conditions of increased task complexity"; "older adults demonstrate deficits in motor sequence memory consolidation" (chậm hơn ở vài khâu, vẫn học được).'
    luot_2: khong-chac
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/21665201/, https://pubmed.ncbi.nlm.nih.gov/23325263/, https://pubmed.ncbi.nlm.nih.gov/22524355/ ]
    luot_2_ghi_chu: "Không có nguồn trực tiếp cho cả hai vế. (1) 'Người lớn tự sắp xếp việc tập tốt hơn trẻ em': tôi không mở được nghiên cứu nào xác nhận. (2) 'Chỉ là chuyện thời gian chứ không phải giới hạn': bị làm yếu bởi các nghiên cứu về giai đoạn nhạy cảm: nhạc công bắt đầu học trước 7 tuổi vẫn giỏi hơn ở đồng bộ vận động-thính giác dù đã ghép cùng số năm kinh nghiệm (Penhune 2011; Steele et al. 2013; Bailey & Penhune 2012), tuy các nghiên cứu này nói về nhạc công chuyên nghiệp chứ không nói về việc người lớn đạt Grade 8. Đề nghị viết thận trọng hơn (bỏ so sánh với trẻ em và bỏ 'không phải giới hạn') hoặc chuyển thành lời khuyên."
  - id: n5
    cau: Sau năm đầu, bạn chơi trọn vẹn được những bài nhỏ như Minuet Sol trưởng hay Bài ca Pháp cổ.
    loai: cap-do
    nguon: [ henle-hn349, abrsm-1920, du-lieu-d20, lo-trinh-choi-cu ]
    ket_qua: dung
    ghi_chu: 'Review (24/10/2026): giữ, vì là ước lượng của site, khớp dữ liệu đã khóa (D2-0): minuet-sol (BWV Anh. 114) và tchaikovsky-bai-ca-phap-co ở chặng 2, mốc thời gian của chặng 2 trong cap-do.yml là 6 tháng – 1,5 năm. Henle HN 349 xếp BWV Anh. 114 mức 1 ("ideally playable after a year of good piano instruction"). Lượt 1: Henle HN 349: "Menuet BWV Anhang 114" mức 1 (easy). ABRSM 2019 & 2020, Grade 3, danh sách B, số 6: "Tchaikovsky Old French Song (No. 16 from Album for the Young, Op. 39)". Dữ liệu D2-0: minuet-sol chặng 2 (Grade 1–2), tchaikovsky-bai-ca-phap-co chặng 2 (Grade 2–3); cap-do.yml: chặng 2 ứng với mốc 6 tháng – 1,5 năm. Lộ trình năm đầu đặt Minuet Sol trưởng ở tháng 6, Bài ca Pháp cổ ở tháng 7 và trong chương trình tháng 11–12. Khớp nhau.'
    luot_2: khong-chac
    luot_2_nguon: [ https://www.henle.de/en/Levels-of-Difficulty/, https://www.henle.de/en/Notebook-for-Anna-Magdalena-Bach/HN-349, https://www.abrsm.org/sites/default/files/2024-06/Piano%202023%20&%202024%20Prac%20syllabus%2020230807.pdf, https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf, https://www.trinitycollege.com/resource?id=10125 ]
    luot_2_ghi_chu: "Gồm hai phần. (a) Độ khó: Henle HN 349 xếp Menuet BWV Anh. 114 ở mức 1 (easy), và trang Levels of Difficulty định nghĩa mức 1 là bài 'ideally playable after a year of good piano instruction': khớp phần Minuet nếu đó là Anh. 114. ABRSM piano 2021–2028 và Trinity (8/2026) không liệt kê Anh. 114; ABRSM 2023–24 có Minuet in G BWV Anh. II 116 (bài khác) ở Grade 3. 'Bài ca Pháp cổ' (Tchaikovsky, Album cho thiếu nhi Op. 39) không có mục riêng ở Henle, ABRSM hay Trinity; các bài khác của tập này được ABRSM xếp Grade 3–5 (Chanson italienne: Grade 3; Douce rêverie: Grade 5), nên chưa có cơ sở xếp bài này vào mức 'sau năm đầu'. (b) Mốc 'sau năm đầu' là ước lượng theo giờ tập, không nguồn bậc 2 nào gắn bài với thời gian của người tự học. Đề nghị bỏ mốc thời gian hoặc ghi rõ là ước lượng, và kiểm số danh mục của 'Minuet Sol trưởng' trong dữ liệu."
  - id: n6
    cau: Für Elise trọn bài thường đến sau hai năm rưỡi đến bốn năm.
    loai: cap-do
    nguon: [ henle-hn1347, du-lieu-d20, hoi-dap-cu ]
