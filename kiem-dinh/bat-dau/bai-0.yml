nhan_dinh:
  - id: n1
    cau: 'Opus dạy nhạc cổ điển qua cây đàn piano: bạn học nhạc lý bằng mắt và tai, rồi biến nó thành thứ sờ được dưới mười ngón tay. Chưa có đàn vẫn bắt đầu được (nghe và đọc nhạc), nhưng piano là con đường chính của site.'
    loai: ten
    nguon: [ ke-hoach ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ mở đầu bằng "Opus Zero dạy nhạc cổ điển…". Tên site đổi thành Opus ngày 23/10/2026 (kế hoạch, mục Quyết định); sửa ở commit a745865. Phần còn lại của câu tả cách site dạy, không đổi.'
  - id: n2
    cau: '"Nhạc cổ điển" ở đây là cả truyền thống âm nhạc nghệ thuật phương Tây, từ thánh ca thời Trung cổ đến các nhà soạn nhạc đang sống.'
    loai: dinh-nghia
    nguon: [ omt-khac ]
    ket_qua: dung
    ghi_chu: 'OMT, Stylistic Periods: "the ways in which music theorists and musicologists historically periodize Western classical music": "Medieval: c. 600–1400 … Post-tonal: c. 1900–present". Hiểu "nhạc cổ điển" theo nghĩa rộng (cả truyền thống, đến hôm nay) khớp cách OMT dùng "Western classical music".'
  - id: n3
    cau: Thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven.
    loai: nam
    nguon: [ omt-khac, omt-sonata ]
    ket_qua: dung
    ghi_chu: 'OMT, Stylistic Periods: "Classical: c. 1750–1820". OMT, Sonata Form, tài liệu tham khảo: Caplin, "Classical Form: A Theory of Formal Functions for the Instrumental Music of Haydn, Mozart, and Beethoven" (1998): ba người tiêu biểu của thời kỳ.'
  - id: n4
    cau: Người lớn biết tự sắp xếp việc tập tốt hơn trẻ em; ngón tay có thể quen chậm hơn một chút, nhưng đó là chuyện thời gian chứ không phải giới hạn.
    loai: quy-tac
    nguon: [ schneider-2008, king-2013 ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Người lớn hiểu nhạc lý và biết tự sắp xếp việc tập tốt hơn trẻ em; …". Bỏ "hiểu nhạc lý": không tìm được nguồn so sánh người lớn và trẻ em về hiểu nhạc lý. Schneider 2008: kiến thức siêu nhận thức "show steady improvement through childhood and adolescence, mainly due to increases in knowledge about strategies", và "Age trends … are significant for self-control activities" (tự sắp xếp, tự điều khiển việc học tăng theo tuổi). King và cộng sự 2013 (người lớn tuổi): "the initial acquisition of motor sequences is not altered, except under conditions of increased task complexity"; "older adults demonstrate deficits in motor sequence memory consolidation" (chậm hơn ở vài khâu, vẫn học được).'
  - id: n5
    cau: Sau năm đầu, bạn chơi trọn vẹn được những bài nhỏ như Minuet Sol trưởng hay Bài ca Pháp cổ.
    loai: cap-do
    nguon: [ henle-hn349, abrsm-1920, du-lieu-d20, lo-trinh-choi-cu ]
    ket_qua: dung
    ghi_chu: 'Henle HN 349: "Menuet BWV Anhang 114" mức 1 (easy). ABRSM 2019 & 2020, Grade 3, danh sách B, số 6: "Tchaikovsky Old French Song (No. 16 from Album for the Young, Op. 39)". Dữ liệu D2-0: minuet-sol chặng 2 (Grade 1–2), tchaikovsky-bai-ca-phap-co chặng 2 (Grade 2–3); cap-do.yml: chặng 2 ứng với mốc 6 tháng – 1,5 năm. Lộ trình năm đầu đặt Minuet Sol trưởng ở tháng 6, Bài ca Pháp cổ ở tháng 7 và trong chương trình tháng 11–12. Khớp nhau.'
  - id: n6
    cau: Für Elise trọn bài thường đến sau hai năm rưỡi đến bốn năm.
    loai: cap-do
    nguon: [ henle-hn1347, du-lieu-d20, hoi-dap-cu ]
    ket_qua: dung
    ghi_chu: 'Henle HN 1347: "Bagatelle (Für Elise) a minor WoO 59", mức 3 (easy). Dữ liệu D2-0: fur-elise chặng 4 (Grade 5); cap-do.yml: chặng 4 có mốc thời gian 2,5–4 năm (mốc là ước lượng của site, D2-0 ghi là lời khuyên). Trang Hỏi đáp cũ ghi cùng mốc ("cả bài khi tới chặng 4, thường sau hai năm rưỡi đến bốn năm").'
  - id: n7
    cau: Hỏi đáp có con số cho các bài khác.
    loai: so-lieu
    nguon: [ hoi-dap-cu ]
    ket_qua: dung
    ghi_chu: 'Hỏi đáp cũ, câu "Bao lâu thì chơi được Für Elise, Chopin hay Clair de lune?": "các bản nocturne dễ của Chopin sau khoảng bốn đến sáu năm; Clair de lune sau năm năm rưỡi trở lên". Trang Hỏi đáp ở tầng Tham chiếu (D8-L1): link hiện "sắp có" đến khi trang lên; lô đó giữ hay sửa các con số này.'
  - id: n8
    cau: Đọc nhạc, giữ nhịp, nghe ra hòa âm và điều khiển ngón tay đều là kỹ năng, và kỹ năng thì luyện được.
    loai: quy-tac
    nguon: [ simmons-2012, bonstrup-2019 ]
    ket_qua: dung
    ghi_chu: 'Simmons 2012: nhạc công học một chuỗi 9 nốt trên bàn phím qua ba buổi, độ chính xác và tốc độ tăng qua các buổi. Bönstrup 2019: kỹ năng tay (chuỗi bấm phím) tiến bộ rõ ngay trong buổi tập đầu. Câu trả lời cho hiểu lầm "phải có năng khiếu": không nói mọi người tiến bộ như nhau.'
  - id: n9
    cau: Bạn đã hiểu "ngữ pháp" âm nhạc phương Tây một cách vô thức qua hàng nghìn bài hát.
    loai: quy-tac
    nguon: [ bigand-2006 ]
    ket_qua: dung
    ghi_chu: 'Bigand và Poulin-Charronnat 2006 (tổng quan): "some musical capacities are acquired through exposure to music without the help of explicit training. These capacities reach such a degree of sophistication that they enable untrained listeners to respond to music as ''musically experienced listeners'' do" (gồm cảm nhận căng và nghỉ, dự đoán trong âm nhạc phương Tây).'
  - id: n10
    cau: 20–30 phút mỗi ngày, có mục tiêu rõ, đi xa hơn ba tiếng dồn vào cuối tuần.
    loai: khuyen-tap
    nguon: [ simmons-2012 ]
    ket_qua: dung
    ghi_chu: 'Simmons 2012: ba buổi tập cách nhau 24 giờ, so với 5 phút và 6 giờ: "Significant improvements in performance accuracy were observed in Session 2 only in the group whose sessions were separated by 24 hr". Khớp trang cũ Thói quen mỗi ngày (buổi 30 phút) và Hai tuần đầu tiên ("Vì sao 20 phút mỗi ngày hơn 3 tiếng cuối tuần").'
  - id: n11
    cau: Một phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ.
    loai: quy-tac
    nguon: [ bonstrup-2019, walker-2002 ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "vì phần lớn việc học động tác diễn ra *sau* buổi tập"; nay "vì một phần lớn …", như trang cũ Hai tuần đầu tiên ("Một phần lớn việc học động tác diễn ra *sau* buổi tập, kể cả trong giấc ngủ"). Nguồn không cho phép nói "phần lớn" cho mọi việc học. Bönstrup 2019: "performance improvements in between practice periods, when subjects were at rest, were significant and accounted for early procedural learning". Walker 2002: "a night of sleep results in a 20% increase in motor speed without loss of accuracy, while an equivalent period of time during wake provides no significant benefit".'
  - id: n12
    cau: Bạn không cần hát hay. Nhưng ngân nga (dù lệch) là công cụ học tốt nhất, vì nó buộc tai bạn chú ý đến cao độ.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên. Không trái trang lõi cũ: luyen-tai/index.md ("Luyện tai hiệu quả nhất khi bạn phát ra âm thanh, không chỉ nghe"), luyen-tap/hat-lai.md.'
  - id: n13
    cau: Phần lớn người tự nhận "lệch tông" thực ra chỉ chưa được luyện.
    loai: quy-tac
    nguon: [ cuddy-2005, wise-sloboda-2008 ]
    ket_qua: dung
    ghi_chu: 'Cuddy và cộng sự 2005: gần 17% sinh viên tự nhận "tone deaf"; "many individuals who consider themselves ''tone-deaf'' may not, in fact, have perceptual difficulties". Wise và Sloboda 2008: "most people self-defining as tone deaf are not congenitally amusic"; nhóm tự nhận "did not demonstrate the dense deficits characteristic of ''congenital amusics''".'
  - id: n14
    cau: Khả năng nghe và hát đúng cao độ cải thiện khi luyện tai đều đặn.
    loai: quy-tac
    nguon: [ wise-sloboda-2008 ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "khả năng nghe và hát đúng cao độ cải thiện rõ rệt sau vài tuần luyện tai đều đặn". Bỏ "rõ rệt sau vài tuần": không tìm được nghiên cứu cho mốc thời gian ấy. Wise và Sloboda 2008: người tự nhận lệch tông "are not facing an insurmountable difficulty, but are likely to improve with targeted intervention".'
  - id: n15
    cau: Chỉ một tỉ lệ rất nhỏ dân số gặp khó khăn thật sự về nhận biết cao độ (amusia).
    loai: so-lieu
    nguon: [ peretz-vuvan-2017 ]
    ket_qua: dung
    ghi_chu: 'Peretz và Vuvan (mẫu 20 000 người, không tự chọn): "the prevalence of congenital amusia is only 1.5%" (ước lượng cũ năm 1980 là 4%).'
  - id: n16
    cau: Nghe nhạc cổ điển không cần năng khiếu hay biết đọc nốt; điều cần là biết nghe cái gì.
    loai: khuyen-tap
    nguon: [ bigand-2006 ]
    ket_qua: dung
    ghi_chu: 'Bigand và Poulin-Charronnat 2006: người không học nhạc vẫn nghe và cảm nhận cấu trúc âm nhạc như người nghe có kinh nghiệm (xem n9). Cách nghe (từng chương, tìm giai điệu chính, nghe lại) khớp "Phương pháp 4 lần nghe" ở trang cũ nghe-nhac/index.md.'
  - id: n17
    cau: Mỗi bài học tác phẩm có bản thu và bảng "Theo dõi khi nghe" để bạn bắt đầu.
    loai: so-lieu
    nguon: [ du-lieu-d20, mau-bai-hoc ]
    ket_qua: dung
    ghi_chu: 'Nhận định về site. Dữ liệu D2-0: cả 34 bản ghi bài học (loai bai-hoc) có ban_thu. Mẫu bài học (AGENTS.md): mục "Nghe trước khi tập" có ::khoi-nghe, bảng "Theo dõi khi nghe" ngay sau. Bài học tác phẩm lên site ở đợt 6; trước đó link hiện "sắp có".'
  - id: n18
    cau: Đã chơi được một chút? Làm bài kiểm tra đầu vào (phần piano khoảng 2 phút) để biết nên vào từ đâu.
    loai: so-lieu
    nguon: [ kiem-tra-dau-vao ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ ghi "(5 phút)", trái với trang Kiểm tra đầu vào: phần piano khoảng 2 phút, phần nhạc lý 28 câu khoảng 5–10 phút. Người đã chơi được một chút cần phần piano để biết chặng, nên ghi thời lượng của phần ấy.'
  - id: n19
    cau: Chuẩn bị theo danh sách Trước ngày đầu tiên (đàn, ghế, máy đếm nhịp, một khung giờ cố định), rồi theo Hai tuần đầu tiên bên phím đàn.
    loai: so-lieu
    nguon: [ hai-tuan-dau-cu ]
    ket_qua: dung
    ghi_chu: 'Trang cũ Hai tuần đầu tiên, mục "Trước ngày đầu tiên": cây đàn, ghế chỉnh được độ cao, điện thoại để thu âm, máy đếm nhịp, bút chì, "Một khung giờ cố định". Câu của bài 0 kể bốn trong sáu mục, không sai. Trang lên site ở D4-L1; link hiện "sắp có" đến khi đó.'
  - id: n20
    cau: Sau năm đầu, lộ trình 7 chặng dẫn bạn tới những tác phẩm lớn.
    loai: so-lieu
    nguon: [ du-lieu-d20, ke-hoach ]
    ket_qua: dung
    ghi_chu: 'cap-do.yml có 7 chặng; kế hoạch, mục Quyết định: "Giữ 7 chặng". Chặng 7 ("Sau Grade 8") có các bài như Ballade số 1 của Chopin (dữ liệu D2-0).'
  - id: n21
    cau: Những thắc mắc thường gặp (đàn điện, tay nhỏ, có cần thầy, có nên thi cấp) có ở Hỏi đáp.
    loai: so-lieu
    nguon: [ hoi-dap-cu ]
    ket_qua: dung
    ghi_chu: 'Hỏi đáp cũ, mục "Về học piano" (id ve-hoc-piano): "Đàn piano điện có đủ để học piano cổ điển không?", "Tay tôi nhỏ, ngón ngắn, có học piano được không?", "Có cần thầy dạy không?", "Có nên thi cấp (ABRSM, Trinity) không?".'
khuong_nhac: []
doi_chu:
  - cu: 'Opus Zero dạy nhạc cổ điển qua cây đàn piano: bạn học nhạc lý bằng mắt và tai, rồi biến nó thành thứ sờ được dưới mười ngón tay. Chưa có đàn vẫn bắt đầu được (nghe và đọc nhạc), nhưng piano là con đường chính của site. "Nhạc cổ điển" ở đây là cả truyền thống âm nhạc nghệ thuật phương Tây, từ thánh ca thời Trung cổ đến các nhà soạn nhạc đang sống; còn thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven. Site sẽ ghi rõ khi nói về thời kỳ.'
    moi: 'Opus dạy nhạc cổ điển qua cây đàn piano: bạn học nhạc lý bằng mắt và tai, rồi biến nó thành thứ sờ được dưới mười ngón tay. Chưa có đàn vẫn bắt đầu được (nghe và đọc nhạc), nhưng piano là con đường chính của site. "Nhạc cổ điển" ở đây là cả truyền thống âm nhạc nghệ thuật phương Tây, từ thánh ca thời Trung cổ đến các nhà soạn nhạc đang sống; còn thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven. Site sẽ ghi rõ khi nói về thời kỳ.'
    ly_do: "n1 (da-sua): tên site đổi thành Opus (plans/lam-lai/README.md, Quyết định, 23/10/2026)."
  - cu: '"Bắt đầu ở tuổi này thì quá muộn." Không. Người lớn hiểu nhạc lý và biết tự sắp xếp việc tập tốt hơn trẻ em; ngón tay có thể quen chậm hơn một chút, nhưng đó là chuyện thời gian chứ không phải giới hạn. Điều cần chỉnh là kỳ vọng: sau năm đầu, bạn chơi trọn vẹn được những bài nhỏ như Minuet Sol trưởng hay Bài ca Pháp cổ; Für Elise trọn bài thường đến sau hai năm rưỡi đến bốn năm. Hỏi đáp có con số cho các bài khác.'
    moi: '"Bắt đầu ở tuổi này thì quá muộn." Không. Người lớn biết tự sắp xếp việc tập tốt hơn trẻ em; ngón tay có thể quen chậm hơn một chút, nhưng đó là chuyện thời gian chứ không phải giới hạn. Điều cần chỉnh là kỳ vọng: sau năm đầu, bạn chơi trọn vẹn được những bài nhỏ như Minuet Sol trưởng hay Bài ca Pháp cổ; Für Elise trọn bài thường đến sau hai năm rưỡi đến bốn năm. Hỏi đáp có con số cho các bài khác.'
    ly_do: 'n4 (da-sua): bỏ "hiểu nhạc lý và": không có nguồn so sánh người lớn với trẻ em về hiểu nhạc lý; phần còn lại có nguồn (Schneider 2008, King 2013).'
  - cu: '"Phải tập hàng giờ mỗi ngày." Không. 20–30 phút mỗi ngày, có mục tiêu rõ, đi xa hơn ba tiếng dồn vào cuối tuần, vì phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ. Xem Thói quen mỗi ngày.'
    moi: '"Phải tập hàng giờ mỗi ngày." Không. 20–30 phút mỗi ngày, có mục tiêu rõ, đi xa hơn ba tiếng dồn vào cuối tuần, vì một phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ. Xem Thói quen mỗi ngày.'
    ly_do: 'n11 (da-sua): "phần lớn" thành "một phần lớn": nghiên cứu cho thấy một phần đáng kể (không phải phần lớn) việc học động tác diễn ra sau buổi tập (Bönstrup 2019, Walker 2002); khớp câu của trang Hai tuần đầu tiên cũ.'
  - cu: 'Bạn không cần hát hay. Nhưng ngân nga (dù lệch) là công cụ học tốt nhất, vì nó buộc tai bạn chú ý đến cao độ. Phần lớn người tự nhận "lệch tông" thực ra chỉ chưa được luyện: khả năng nghe và hát đúng cao độ cải thiện rõ rệt sau vài tuần luyện tai đều đặn. Chỉ một tỉ lệ rất nhỏ dân số gặp khó khăn thật sự về nhận biết cao độ (amusia). Hãy cứ bắt đầu.'
    moi: 'Bạn không cần hát hay. Nhưng ngân nga (dù lệch) là công cụ học tốt nhất, vì nó buộc tai bạn chú ý đến cao độ. Phần lớn người tự nhận "lệch tông" thực ra chỉ chưa được luyện: khả năng nghe và hát đúng cao độ cải thiện khi luyện tai đều đặn. Chỉ một tỉ lệ rất nhỏ dân số gặp khó khăn thật sự về nhận biết cao độ (amusia). Hãy cứ bắt đầu.'
    ly_do: 'n14 (da-sua): bỏ "rõ rệt sau vài tuần": không có nguồn cho mốc thời gian (Wise và Sloboda 2008 chỉ cho thấy luyện thì cải thiện).'
  - cu: Đã chơi được một chút? Làm bài kiểm tra đầu vào (5 phút) để biết nên vào từ đâu. Chưa từng chơi thì bỏ qua bước này.
    moi: Đã chơi được một chút? Làm bài kiểm tra đầu vào (phần piano khoảng 2 phút) để biết nên vào từ đâu. Chưa từng chơi thì bỏ qua bước này.
    ly_do: 'n18 (da-sua): "(5 phút)" trái với trang Kiểm tra đầu vào (phần piano khoảng 2 phút, phần nhạc lý 5–10 phút); người đã chơi được một chút cần phần piano để biết chặng.'
