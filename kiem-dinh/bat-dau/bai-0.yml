    luot_2: dung
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/16412412/ ]
    luot_2_ghi_chu: "Lời khuyên nghe nhạc. Phù hợp với nghiên cứu: người nghe không học nhạc vẫn có nhiều năng lực xử lý nhạc phương Tây thu nhận qua tiếp xúc (Bigand & Poulin-Charronnat 2006). Không hại."
  - id: n17
    cau: Mỗi bài học tác phẩm có bảng "Theo dõi khi nghe" và một bản thu gợi ý để bạn bắt đầu.
    loai: so-lieu
    nguon: [ du-lieu-d20, mau-bai-hoc ]
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): viết lại theo lượt 2 và review. Câu trước: "Mỗi bài học tác phẩm có bản thu và bảng ''Theo dõi khi nghe'' để bạn bắt đầu." Dữ liệu hiện có ban_thu cho cả 34 bản ghi bài học, nhưng ban_thu chưa kiểm định (đợt 6 kiểm từng bản thu, bản không đạt thì bỏ), và bài không có bản thu thì người học tự dán link hay chọn file (AGENTS.md, khối nghe), nên câu mới không hứa mọi bài có bản thu. Bảng "Theo dõi khi nghe" có ở mọi bài học theo mẫu trang. Lượt 1: Nhận định về site. Dữ liệu D2-0: cả 34 bản ghi bài học (loai bai-hoc) có ban_thu. Mẫu bài học (AGENTS.md): mục "Nghe trước khi tập" có ::khoi-nghe, bảng "Theo dõi khi nghe" ngay sau. Bài học tác phẩm lên site ở đợt 6; trước đó link hiện "sắp có". mo/tong-quan (09/11/2026): bỏ "khi có". Đợt 6 đã kiểm và khóa bản thu của cả 34 bài học: dữ liệu src/data/tac-pham.yml (đã khóa) có ban_thu ở cả 34 bản ghi loai bai-hoc, và bản build có khung nghe với tệp âm thanh hay link ở cả 34 trang piano/tac-pham/*; nghe-nhac/index và piano/tac-pham/index (đã khóa) cũng nói mọi bài học có bản thu gợi ý.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Đặc điểm của chính site (bản thu và bảng 'Theo dõi khi nghe' ở mọi bài học tác phẩm); không có nguồn ngoài. Lưu ý: theo AGENTS.md, bản thu gợi ý lấy từ 'ban_thu' của bản ghi và 'không có bản thu thì người học tự dán link hay chọn file', nên 'mỗi bài có bản thu' có thể nói quá; kiểm bằng dữ liệu 'ban_thu' của các bản ghi bài học."
