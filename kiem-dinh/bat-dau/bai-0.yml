  - id: n8
    cau: Đọc nhạc, giữ nhịp, nghe ra hòa âm và điều khiển ngón tay đều là kỹ năng, và kỹ năng thì luyện được.
    loai: quy-tac
    nguon: [ simmons-2012, bonstrup-2019 ]
    ket_qua: dung
    ghi_chu: 'Simmons 2012: nhạc công học một chuỗi 9 nốt trên bàn phím qua ba buổi, độ chính xác và tốc độ tăng qua các buổi. Bönstrup 2019: kỹ năng tay (chuỗi bấm phím) tiến bộ rõ ngay trong buổi tập đầu. Câu trả lời cho hiểu lầm "phải có năng khiếu": không nói mọi người tiến bộ như nhau.'
    luot_2: dung
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/16839723/, https://pubmed.ncbi.nlm.nih.gov/18815249/ ]
    luot_2_ghi_chu: "Nhận định chung phù hợp sư phạm âm nhạc. Bằng chứng gián tiếp: người không học nhạc luyện phân biệt cao độ thì ngưỡng giảm mạnh, 4–8 giờ luyện đưa họ tới ngưỡng của nhạc sĩ cổ điển (Micheyl et al. 2006, Hearing Research); người lớn không chuyên học chơi một chuỗi nốt trên piano trong 2 tuần có thay đổi vỏ não tương ứng (Lappe et al. 2008, J Neurosci). Không có nghiên cứu riêng về 'đọc nhạc' và 'giữ nhịp' trong các nguồn tôi mở, nhưng không có gì trái với câu."
  - id: n9
    cau: Bạn đã hiểu "ngữ pháp" âm nhạc phương Tây một cách vô thức qua hàng nghìn bài hát.
    loai: quy-tac
    nguon: [ bigand-2006 ]
    ket_qua: dung
    ghi_chu: 'Bigand và Poulin-Charronnat 2006 (tổng quan): "some musical capacities are acquired through exposure to music without the help of explicit training. These capacities reach such a degree of sophistication that they enable untrained listeners to respond to music as ''musically experienced listeners'' do" (gồm cảm nhận căng và nghỉ, dự đoán trong âm nhạc phương Tây).'
    luot_2: dung
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/16412412/, https://pubmed.ncbi.nlm.nih.gov/11089410/, https://pubmed.ncbi.nlm.nih.gov/10931776/ ]
    luot_2_ghi_chu: "Bigand & Poulin-Charronnat 2006 (Cognition, tổng quan): một số năng lực xử lý nhạc phương Tây 'are acquired through exposure to music without the help of explicit training'; người nghe không học nhạc phản ứng như 'musically experienced listeners'. Tillmann, Bharucha & Bigand 2000: kiến thức ngầm về cấu trúc điệu tính hình thành từ 'mere exposure' (mô hình tính toán). Koelsch et al. 2000: người 'không chuyên' có phản ứng não với hợp âm vi phạm kỳ vọng hòa âm. 'Hàng nghìn bài hát' là cách nói ví von."
  - id: n10
    cau: 20–30 phút mỗi ngày, có mục tiêu rõ, đi xa hơn ba tiếng dồn vào cuối tuần.
    loai: khuyen-tap
    nguon: [ simmons-2012 ]
    ket_qua: dung
    ghi_chu: 'Simmons 2012: ba buổi tập cách nhau 24 giờ, so với 5 phút và 6 giờ: "Significant improvements in performance accuracy were observed in Session 2 only in the group whose sessions were separated by 24 hr". Khớp trang cũ Thói quen mỗi ngày (buổi 30 phút) và Hai tuần đầu tiên ("Vì sao 20 phút mỗi ngày hơn 3 tiếng cuối tuần").'
    luot_2: dung
    luot_2_ghi_chu: "Lời khuyên tập: phiên ngắn, đều, có mục tiêu thay vì dồn vào cuối tuần; phù hợp quan điểm sư phạm phổ biến (tập phân bố). Không hại."
  - id: n11
    cau: Kỹ năng vận động còn tiếp tục tiến bộ sau buổi tập, trong lúc nghỉ.
    loai: quy-tac
    nguon:
      - walker-2002
      - bonstrup-2019
      - pan-rickard-2015
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): viết lại theo lượt 2. Câu trước: "Một phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ." Bỏ "một phần lớn" (không định lượng được) và vế giấc ngủ: Walker và cộng sự 2002 thấy một đêm ngủ làm tốc độ tăng 20%, nhưng phân tích gộp của Pan và Rickard 2015 (34 bài, 1.296 người) kết luận, khi đã tính các biến gây nhiễu, "there was no evidence that sleep enhances learning". Câu mới chỉ giữ điều các nguồn cùng ủng hộ: Walker 2002 mở đầu "Improvement in motor skill performance is known to continue for at least 24 hr following training"; Bönstrup 2019: tiến bộ trong các quãng nghỉ giữa các lượt tập là phần chính của việc học sớm. Lượt 1: Câu cũ: "vì phần lớn việc học động tác diễn ra *sau* buổi tập"; nay "vì một phần lớn …", như trang cũ Hai tuần đầu tiên ("Một phần lớn việc học động tác diễn ra *sau* buổi tập, kể cả trong giấc ngủ"). Nguồn không cho phép nói "phần lớn" cho mọi việc học. Bönstrup 2019: "performance improvements in between practice periods, when subjects were at rest, were significant and accounted for early procedural learning". Walker 2002: "a night of sleep results in a 20% increase in motor speed without loss of accuracy, while an equivalent period of time during wake provides no significant benefit".'
    luot_2: khong-chac
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/12123620/, https://pubmed.ncbi.nlm.nih.gov/25822130/ ]
    luot_2_ghi_chu: "Nguồn không thống nhất. Walker et al. 2002 (Neuron): một đêm ngủ làm tốc độ gõ chuỗi ngón tăng 20%, cùng thời gian thức thì không. Nhưng Pan & Rickard 2015 (Psychological Bulletin, phân tích gộp 34 bài, 1.296 người): khi tính các biến gây nhiễu thì 'không có bằng chứng giấc ngủ làm tăng học vận động' và vai trò của giấc ngủ 'không thể kết luận'. 'Một phần lớn' cũng không định lượng được. Đề nghị viết bớt chắc chắn, ví dụ 'kỹ năng vận động vẫn tiếp tục được củng cố sau buổi tập', hoặc chuyển thành lời khuyên (tập đều, ngủ đủ)."
  - id: n12
    cau: Bạn không cần hát hay. Nhưng ngân nga (dù lệch) là công cụ học tốt nhất, vì nó buộc tai bạn chú ý đến cao độ.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên. Không trái trang lõi cũ: luyen-tai/index.md ("Luyện tai hiệu quả nhất khi bạn phát ra âm thanh, không chỉ nghe"), luyen-tap/hat-lai.md.'
    luot_2: dung
    luot_2_ghi_chu: "Lời khuyên luyện tai: ngân nga hay hát theo giai điệu là cách phổ biến (solfège, audiation). 'Tốt nhất' là so sánh tuyệt đối không có nguồn; nên viết bớt chắc chắn (ví dụ 'một công cụ rất hiệu quả'). Không hại."
  - id: n13
    cau: Phần lớn người tự nhận "lệch tông" thực ra chỉ chưa được luyện.
    loai: quy-tac
    nguon: [ cuddy-2005, wise-sloboda-2008 ]
    ket_qua: dung
    ghi_chu: 'Cuddy và cộng sự 2005: gần 17% sinh viên tự nhận "tone deaf"; "many individuals who consider themselves ''tone-deaf'' may not, in fact, have perceptual difficulties". Wise và Sloboda 2008: "most people self-defining as tone deaf are not congenitally amusic"; nhóm tự nhận "did not demonstrate the dense deficits characteristic of ''congenital amusics''".'
    luot_2: dung
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/16597781/, https://pubmed.ncbi.nlm.nih.gov/16597772/, https://pubmed.ncbi.nlm.nih.gov/28224991/, https://pubmed.ncbi.nlm.nih.gov/17348539/ ]
    luot_2_ghi_chu: "Gần 17% sinh viên tự nhận 'điếc nhạc' (Cuddy et al. 2005) trong khi amusia bẩm sinh thật chỉ khoảng 1,5% (Peretz & Vuvan 2017, mẫu 20.000 người; ước tính cũ 4%), nên phần lớn người tự nhận không có khiếm khuyết nhận biết cao độ thật. Sloboda, Wise & Peretz 2005: nhiều người có thần kinh bình thường tự cho là 'không có năng khiếu' vì tiêu chí hát/biểu diễn; thiếu các điều kiện cá nhân, xã hội, môi trường có thể dẫn đến thiếu thành tựu âm nhạc. Dalla Bella et al. 2007: chỉ thiểu số người hát nghiệp dư sai cao độ nhiều, hát chậm thì hầu hết chính xác như người chuyên. 'Chỉ chưa được luyện' là cách nói gọn của 'thiếu trải nghiệm/huấn luyện'; một số ít có khó khăn thuần về phát thanh vận động (Dalla Bella 2007)."
  - id: n14
    cau: Luyện tai đều đặn giúp nghe cao độ chính xác hơn; muốn hát đúng thì cần tập cả hát.
    loai: quy-tac
    nguon:
      - micheyl-2006
      - zarate-2010
      - wise-sloboda-2008
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): viết lại theo lượt 2. Câu trước: "Khả năng nghe và hát đúng cao độ cải thiện khi luyện tai đều đặn." Micheyl và cộng sự 2006: người không học nhạc luyện phân biệt cao độ 4–8 giờ thì ngưỡng nhỏ như nhạc công cổ điển. Zarate và cộng sự 2010: luyện phân biệt giai điệu làm nghe tốt hơn nhưng không làm hát chính xác hơn, nên tách hai vế: nghe nhờ luyện tai, hát cần tập hát. Wise và Sloboda 2008: người tự nhận lệch tông "are likely to improve with targeted intervention". Lượt 1: Câu cũ: "khả năng nghe và hát đúng cao độ cải thiện rõ rệt sau vài tuần luyện tai đều đặn". Bỏ "rõ rệt sau vài tuần": không tìm được nghiên cứu cho mốc thời gian ấy. Wise và Sloboda 2008: người tự nhận lệch tông "are not facing an insurmountable difficulty, but are likely to improve with targeted intervention".'
    luot_2: khong-chac
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/16839723/, https://pubmed.ncbi.nlm.nih.gov/20567521/, https://pubmed.ncbi.nlm.nih.gov/28224991/ ]
    luot_2_ghi_chu: "Vế 'nghe cao độ' được ủng hộ: người không học nhạc luyện phân biệt cao độ thì ngưỡng giảm, 4–8 giờ là đạt mức nhạc sĩ cổ điển (Micheyl et al. 2006). Vế 'hát đúng cao độ nhờ luyện tai' thì không: Zarate et al. 2010 (PLoS ONE) luyện phân biệt vi giai điệu làm nghe tốt hơn nhưng độ chính xác khi hát không đổi; kết luận 'perceptual discrimination training alone is not sufficient to improve vocal accuracy'. Với amusia thật (khoảng 1,5%) huấn luyện âm nhạc không làm giảm khiếm khuyết (Peretz & Vuvan 2017). Đề nghị tách: nghe cao độ cải thiện nhờ luyện tai; hát đúng cần tập hát có phản hồi."
  - id: n15
    cau: Chỉ một tỉ lệ rất nhỏ dân số gặp khó khăn thật sự về nhận biết cao độ (amusia).
    loai: so-lieu
    nguon: [ peretz-vuvan-2017 ]
    ket_qua: dung
    ghi_chu: 'Peretz và Vuvan (mẫu 20 000 người, không tự chọn): "the prevalence of congenital amusia is only 1.5%" (ước lượng cũ năm 1980 là 4%).'
    luot_2: dung
    luot_2_nguon: [ https://pubmed.ncbi.nlm.nih.gov/28224991/ ]
    luot_2_ghi_chu: "Peretz & Vuvan 2017 (Eur J Hum Genet, mẫu 20.000 người): amusia bẩm sinh ('tone deafness') chiếm khoảng 1,5% dân số, thấp hơn ước tính cũ 4% từ một bài thử năm 1980. 'Một tỉ lệ rất nhỏ' đúng."
