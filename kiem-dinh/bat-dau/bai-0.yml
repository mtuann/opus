doi_chu:
  - cu: 'Opus Zero dạy nhạc cổ điển qua cây đàn piano: bạn học nhạc lý bằng mắt và tai, rồi biến nó thành thứ sờ được dưới mười ngón tay. Chưa có đàn vẫn bắt đầu được (nghe và đọc nhạc), nhưng piano là con đường chính của site. "Nhạc cổ điển" ở đây là cả truyền thống âm nhạc nghệ thuật phương Tây, từ thánh ca thời Trung cổ đến các nhà soạn nhạc đang sống; còn thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven. Site sẽ ghi rõ khi nói về thời kỳ.'
    moi: 'Opus dạy nhạc cổ điển qua cây đàn piano: bạn học nhạc lý bằng mắt và tai, rồi biến nó thành thứ sờ được dưới mười ngón tay. Chưa có đàn vẫn bắt đầu được (nghe và đọc nhạc), nhưng piano là con đường chính của site. "Nhạc cổ điển" ở đây là cả truyền thống âm nhạc nghệ thuật phương Tây, từ thánh ca thời Trung cổ đến các nhà soạn nhạc đang sống; còn thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven. Site sẽ ghi rõ khi nói về thời kỳ.'
    ly_do: "n1 (da-sua): tên site đổi thành Opus (plans/lam-lai/README.md, Quyết định, 23/10/2026)."
  - cu: '"Bắt đầu ở tuổi này thì quá muộn." Không. Người lớn hiểu nhạc lý và biết tự sắp xếp việc tập tốt hơn trẻ em; ngón tay có thể quen chậm hơn một chút, nhưng đó là chuyện thời gian chứ không phải giới hạn. Điều cần chỉnh là kỳ vọng: sau năm đầu, bạn chơi trọn vẹn được những bài nhỏ như Minuet Sol trưởng hay Bài ca Pháp cổ; Für Elise trọn bài thường đến sau hai năm rưỡi đến bốn năm. Hỏi đáp có con số cho các bài khác.'
    moi: '"Bắt đầu ở tuổi này thì quá muộn." Không. Người lớn vẫn học được piano, và có lợi thế ở cách tự sắp xếp việc học. Người học từ nhỏ có lợi thế về phối hợp động tác, nên ngón tay của bạn có thể quen chậm hơn. Điều cần chỉnh là kỳ vọng: sau năm đầu, bạn chơi trọn vẹn được những bài nhỏ như Minuet Sol trưởng hay Bài ca Pháp cổ; Für Elise trọn bài thường đến sau hai năm rưỡi đến bốn năm. Hỏi đáp có con số cho các bài khác.'
    ly_do: 'n4 (da-sua): bỏ "hiểu nhạc lý và": không có nguồn so sánh người lớn với trẻ em về hiểu nhạc lý; phần còn lại có nguồn (Schneider 2008, King 2013). Review (24/10/2026), n4: viết lại: người lớn vẫn học được và có lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp động tác (giai đoạn nhạy cảm: Penhune 2011, Bailey và Penhune 2012), nên bỏ vế "không phải giới hạn".'
  - cu: '"Phải tập hàng giờ mỗi ngày." Không. 20–30 phút mỗi ngày, có mục tiêu rõ, đi xa hơn ba tiếng dồn vào cuối tuần, vì phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ. Xem Thói quen mỗi ngày.'
    moi: '"Phải tập hàng giờ mỗi ngày." Không. 20–30 phút mỗi ngày, có mục tiêu rõ, đi xa hơn ba tiếng dồn vào cuối tuần, vì kỹ năng vận động còn tiếp tục tiến bộ sau buổi tập, trong lúc nghỉ. Xem Thói quen mỗi ngày.'
    ly_do: 'n11 (da-sua): "phần lớn" thành "một phần lớn": nghiên cứu cho thấy một phần đáng kể (không phải phần lớn) việc học động tác diễn ra sau buổi tập (Bönstrup 2019, Walker 2002); khớp câu của trang Hai tuần đầu tiên cũ. Review (24/10/2026), n11: bỏ "một phần lớn" và vế giấc ngủ (bằng chứng trái nhau: Walker 2002 với Pan và Rickard 2015); giữ điều các nguồn cùng ủng hộ.'
  - cu: 'Bạn không cần hát hay. Nhưng ngân nga (dù lệch) là công cụ học tốt nhất, vì nó buộc tai bạn chú ý đến cao độ. Phần lớn người tự nhận "lệch tông" thực ra chỉ chưa được luyện: khả năng nghe và hát đúng cao độ cải thiện rõ rệt sau vài tuần luyện tai đều đặn. Chỉ một tỉ lệ rất nhỏ dân số gặp khó khăn thật sự về nhận biết cao độ (amusia). Hãy cứ bắt đầu.'
    moi: 'Bạn không cần hát hay. Nhưng ngân nga (dù lệch) là công cụ học tốt nhất, vì nó buộc tai bạn chú ý đến cao độ. Phần lớn người tự nhận "lệch tông" thực ra chỉ chưa được luyện: luyện tai đều đặn giúp nghe cao độ chính xác hơn, còn muốn hát đúng thì cần tập cả hát. Chỉ một tỉ lệ rất nhỏ dân số gặp khó khăn thật sự về nhận biết cao độ (amusia). Hãy cứ bắt đầu.'
    ly_do: 'n14 (da-sua): bỏ "rõ rệt sau vài tuần": không có nguồn cho mốc thời gian (Wise và Sloboda 2008 chỉ cho thấy luyện thì cải thiện). Review (24/10/2026), n14: tách nghe và hát: luyện tai giúp nghe cao độ (Micheyl 2006), hát đúng cần tập hát (Zarate 2010).'
  - cu: 'Hãy nghe kỹ bài mình sắp tập, và nghe rộng hơn những gì mình tập. Nghe nhạc cổ điển không cần năng khiếu hay biết đọc nốt; điều cần là biết nghe cái gì: nghe từng chương một, tìm giai điệu chính và nhận ra khi nó quay lại, nghe lại nhiều lần. Phương pháp nghe chủ động chỉ cách làm; mỗi bài học tác phẩm có bản thu và bảng "Theo dõi khi nghe" để bạn bắt đầu.'
    moi: 'Hãy nghe kỹ bài mình sắp tập, và nghe rộng hơn những gì mình tập. Nghe nhạc cổ điển không cần năng khiếu hay biết đọc nốt; điều cần là biết nghe cái gì: nghe từng chương một, tìm giai điệu chính và nhận ra khi nó quay lại, nghe lại nhiều lần. Phương pháp nghe chủ động chỉ cách làm; mỗi bài học tác phẩm có bảng "Theo dõi khi nghe" và một bản thu gợi ý để bạn bắt đầu.'
    ly_do: "n17 (mo/tong-quan, 09/11/2026): bỏ \"khi có\", cả 34 bài học đã có bản thu kiểm ở đợt 6. Trước đó: n17 (da-sua, review 24/10/2026): không hứa mọi bài học có bản thu: bản thu (ban_thu) kiểm định ở đợt 6, bài không có thì người học tự dán link."
  - cu: Đã chơi được một chút? Làm bài kiểm tra đầu vào (5 phút) để biết nên vào từ đâu. Chưa từng chơi thì bỏ qua bước này.
    moi: Đã chơi được một chút? Làm bài kiểm tra đầu vào (phần piano khoảng 2 phút) để biết nên vào từ đâu. Chưa từng chơi thì bỏ qua bước này.
    ly_do: 'n18 (da-sua): "(5 phút)" trái với trang Kiểm tra đầu vào (phần piano khoảng 2 phút, phần nhạc lý 5–10 phút); người đã chơi được một chút cần phần piano để biết chặng.'
