  Nhận định về nghiên cứu (học động tác, tập rải đều, amusia, "lệch tông", nghe không cần học) đối chiếu với bài báo khoa học; tóm tắt đọc qua Europe PMC hay Crossref (link trong nguon), vì PubMed và trang nhà xuất bản chặn truy cập tự động. Nhận định về site (nội dung trang khác, bài kiểm tra, bản thu) đối chiếu với trang cũ trong ../opus-zero/docs/ và dữ liệu D2-0 (nhánh moi/d2-0-du-lieu, đã kiểm lượt 1). Các trang được link tới (Hỏi đáp, Hai tuần đầu tiên, bài học tác phẩm) chưa lên site lúc D2-L1 gộp: link hiện "sắp có".
