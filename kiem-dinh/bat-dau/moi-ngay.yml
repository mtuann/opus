ghi_chu: >-
  Trang chỉ có lời khuyên tập (khuyen-tap): khuôn buổi tập, lịch tuần, khi nào đổi bài, khi đau. Không có tên tác phẩm,
  số liệu nhạc lý hay chi tiết mau cũ (ứng dụng, giá, thiết bị, sự kiện). Mỗi lời khuyên đã đối chiếu với các trang lõi
  cũ cùng chủ đề trong ../opus-zero/docs/: piano/cach-tap.md (mục "Mẫu buổi tập", "Kế hoạch một tuần khi học với thầy",
  "Tập khi không có đàn"), piano/suc-khoe.md, piano/10-bai-dau-tien.md, bat-dau/lo-trinh-choi.md, nghe-nhac/index.md
  (phương pháp 4 lần nghe), bat-dau/index.md; không thấy chỗ nào trái nhau. Link nội bộ trỏ tới trang có trong kế hoạch
  (tu-the, nam-ngon, gam, cach-tap, doc-not, thi-tau, nhat-ky, bai-tap-ngon, thu-am, suc-khoe), chưa lên site thì hiện
  "sắp có"; neo #mau-buoi-tap là id của mục "Mẫu buổi tập" ở trang cũ. Không sửa chữ nào của trang.
nguon: []
nhan_dinh:
  - id: n1
    cau: 'Một buổi tập piano tốt có cấu trúc: khởi động, kỹ thuật, bài đang học, đọc nhạc, rồi ghi lại. Dưới đây là ba khuôn mẫu theo thời gian bạn có. Chọn một khuôn và giữ nó đều đặn; đều đặn quan trọng hơn dài.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp piano/cach-tap.md, mục "Mẫu buổi tập": các phần "Khởi động", "Kỹ thuật", "Bài chính", "Thị tấu", "Chơi trọn bài, thu âm, ghi nhật ký". Trang có đúng ba khuôn (buổi 30 phút, buổi dài hơn, ngày bận). "Đều đặn quan trọng hơn dài" khớp bat-dau/index.md ("Ít nhưng đều. 30 phút mỗi ngày hiệu quả hơn 3 tiếng vào cuối tuần") và piano/hai-tuan-dau.md (hộp "Vì sao 20 phút mỗi ngày hơn 3 tiếng cuối tuần").'
  - id: n2
    cau: 'Buổi 30 phút (chuẩn): 3 phút khởi động (thả lỏng vai và cổ tay, năm ngón chậm hai tay); 5 phút kỹ thuật (gam và hợp âm rải của tuần); 15 phút bài đang học (đoạn khó trước, chậm, theo mục tiêu viết sẵn một dòng); 5 phút đọc nốt hoặc thị tấu một bài dễ; 2 phút ghi nhật ký (hôm nay sửa được gì, mai làm gì).'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Năm dòng cộng lại đúng 30 phút (3 + 5 + 15 + 5 + 2). Khớp bat-dau/lo-trinh-choi.md, hộp "Một buổi 30 phút trong năm đầu" (cùng năm phần, cùng số phút) và tỉ lệ của cột 20 phút ở piano/cach-tap.md (khởi động 2, kỹ thuật 3, bài chính 10, thị tấu 3, chơi trọn và ghi nhật ký 2). "Đoạn khó trước" khớp cach-tap.md ("Bài chính: các điểm nóng"); "thị tấu một bài dễ" khớp piano/thi-tau.md ("chọn tài liệu dễ hơn bài bạn đang tập khoảng hai cấp").'
  - id: n3
    cau: 'Ngoài giờ ngồi đàn, dành thêm 10 phút cho nghe chủ động hoặc một bài nhạc lý (lúc đi đường, lúc nghỉ trưa). Tai và đầu học được cả khi tay nghỉ.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp bat-dau/lo-trinh-choi.md ("Nhạc lý, luyện tai và nghe nhạc làm thêm ngoài giờ ngồi đàn, khoảng 10 phút") và piano/cach-tap.md, mục "Tập khi không có đàn" (tập trong đầu, phân tích, tiết tấu, nghe nhiều bản thu).'
  - id: n4
    cau: 'Khi buổi tập dài 45 hoặc 90 phút, thêm một bài thứ hai ở phong cách khác, một étude ngắn (Bài tập ngón và étude) và một quãng nghỉ đứng dậy thả tay giữa buổi. Bảng chia phút cho buổi 20, 45 và 90 phút ở Cách tập hiệu quả.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'piano/cach-tap.md, mục "Mẫu buổi tập", có đúng ba cột 20, 45, 90 phút; dòng "Bài thứ hai (phong cách khác) hoặc bài ôn" (5 và 15 phút ở buổi 45 và 90); "bài tập ngón hoặc étude" trong dòng Kỹ thuật; dòng "Nghỉ: đứng dậy, thả tay, xoay vai" (5–10 phút ở buổi 90). Bảng không ghi quãng nghỉ cho buổi 45 phút, nhưng piano/suc-khoe.md dặn "Nghỉ 5 phút sau mỗi 25–30 phút: đứng dậy, đi lại, buông thõng tay", nên lời khuyên nghỉ giữa buổi 45 phút không trái trang lõi nào.'
  - id: n5
    cau: 'Ngày bận (10 phút): Năm ngón hoặc một gam (2 phút), đoạn khó nhất của bài đang tập (6 phút), đọc nốt (2 phút). Mục tiêu của ngày bận là không làm đứt chuỗi, không phải tiến thêm. Ngay cả 10 phút cũng giữ cho tay và đầu không "nguội".'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Ba phần cộng lại đúng 10 phút (2 + 6 + 2). Khớp piano/cach-tap.md: "Ngày bận chỉ có 10 phút? Chọn một điểm nóng và tập nó cho thật đúng. Mười phút tập trung vẫn giữ được mạch tiến bộ, và quan trọng hơn là giữ được thói quen." Cùng ý với bat-dau/lo-trinh-choi.md, mục "Khi bạn chậm hơn lộ trình": "15 phút mỗi ngày tốt hơn bỏ một tuần."'
  - id: n6
    cau: 'Lịch tuần gợi ý, cột Bên đàn: thứ Hai bài mới (nghe, đọc, chia đoạn, ghi số ngón); thứ Ba đoạn khó, tay riêng, thật chậm; thứ Tư ghép hai tay chậm ở các điểm neo; thứ Năm tăng tốc theo nấc máy đếm nhịp; thứ Sáu chơi liền cả bài, thu âm; cuối tuần chơi cho người khác nghe, hoặc chơi tự do các bài cũ.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Cùng trình tự với piano/cach-tap.md, mục "Kế hoạch một tuần khi học với thầy" (ngày 1–2 tập điểm nóng; ngày 3–4 ghép tay, nâng tốc độ theo thang máy đếm nhịp; ngày 5 chơi trọn và thu âm) và mục "Học một bài mới: 12 bước". "Điểm neo" khớp piano/10-bai-dau-tien.md, bước 4 ("Dừng ở mỗi chỗ hai tay cùng đánh để kiểm tra: đó là các điểm neo").'
  - id: n7
    cau: 'Lịch tuần gợi ý, cột Nhạc lý và tai, cột Nghe: bài nhạc lý mới, bài tập của bài, luyện tai 10 phút, ôn bài tuần trước, thị tấu, nghỉ; nghe tác phẩm của tuần lần 1 (chỉ cảm nhận), lần 2 tìm giai điệu chính, lần 3 theo dõi cấu trúc, một bản thu khác, viết một trang nhật ký nghe, đi xem hòa nhạc hay nghe thứ mình thích.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Bốn lần nghe đúng thứ tự "Phương pháp 4 lần nghe" của nghe-nhac/index.md: "Lần 1 — Cảm nhận", "Lần 2 — Tìm giai điệu chính", "Lần 3 — Theo dõi cấu trúc", "Lần 4 — So sánh. Nghe một bản thu khác"; trang ấy cũng dặn ghi vài dòng theo mẫu nhật ký nghe (nghe-nhac/mau.md). "Luyện tai 10 phút" khớp luyen-tai/nghe-quang.md ("Mỗi ngày 10 phút đều đặn hiệu quả hơn một buổi 1 tiếng mỗi tuần").'
  - id: n8
    cau: 'Khi nào chuyển sang bài mới? Khi bạn chơi được bài hiện tại ở tốc độ mục tiêu ba lần liền mà không dừng. Bài cũ không bị bỏ: đưa nó vào danh sách "duy trì" và chơi lại một hai lần mỗi tuần, để cuối năm bạn có cả một chương trình chứ không chỉ một bài.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp piano/10-bai-dau-tien.md ("Tăng tốc độ một nấc ... chỉ khi đã chơi đúng ba lần liên tiếp"; "Đừng sang bài mới khi bài cũ còn phải dừng giữa chừng") và bat-dau/lo-trinh-choi.md (tháng 5: "chọn ba bài thích nhất làm tiết mục và chơi lại mỗi tuần để giữ"; tháng 11–12: chương trình ba bài cuối năm).'
  - id: n9
    cau: 'Đau là tín hiệu dừng: tay, cổ tay hay cẳng tay đau khi tập không phải dấu hiệu "đang cố gắng", mà là tín hiệu dừng lại. Nghỉ, kiểm tra tư thế, giảm thời gian và đọc Giữ đôi tay khỏe.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp piano/suc-khoe.md: mục "Đau vì chơi đàn: phổ biến, nhưng không bình thường", bảng dấu hiệu cảnh báo ("Đau ở một điểm, xuất hiện khi chơi và còn sau khi dừng: Dừng buổi tập, nghỉ chơi đàn vài ngày; không đỡ thì đi khám") và câu hỏi kiểm tra ("Tập liền ba tiếng không nghỉ cho quen áp lực" là đáp án sai). Lời khuyên y tế chi tiết thuộc trang suc-khoe (lô D4-L3), trang này chỉ dẫn sang.'
