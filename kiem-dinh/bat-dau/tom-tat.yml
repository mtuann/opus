ghi_chu: >-
  Trang tóm tắt nhạc lý cơ bản (14 ô, hai mặt A4). Nguồn chính: Open Music Theory (OMT), mở từng chương (tải bằng curl,
  ngày 24/10/2026; WebFetch bị trang trả 403). Thuật ngữ tiếng Việt đối chiếu src/data/thuat-ngu.yml (chưa khóa) và các
  bài nhạc lý cũ cùng chủ đề (../opus-zero/docs/nhac-ly/03, 04, 05, 06, 07, 08, 12): không lệch. Sửa cấu trúc trước lượt 1
  (agent chính, commit a745865): 14 tiêu đề "###" thành "##", vì trang không có h2 nào (axe heading-order); chữ tiêu đề và
  id giữ nguyên. Sửa chữ ở lượt 1: n24 (quy tắc số chỉ nhịp, thêm trường hợp 6/8), n30 (hạ át âm), n36 (hình vòng quãng
  năm: d♯/e♭), n51 (bảng chức năng: vi). Sửa không đổi chữ: chữ "Đô giữa (C4)" dưới hình bàn phím đổi fill="#222" thành
  fill="currentColor" để đọc được ở chế độ tối (nằm ngoài phím đàn, trên nền trang). Bố cục in hai mặt A4 (n3) tùy CSS
  của agent chính (lớp oz-sheet, oz-sheet-page, oz-cell, oz-fig, oz-fig-circle): agent chính kiểm sau khi build. Không
  tính là nhận định: câu mở đầu "Toàn bộ kiến thức đọc nhạc và nhạc lý cơ bản" (nói phạm vi của trang).
