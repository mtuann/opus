# Chỗ chữ trang khác trang cũ (so như tools/chuyen/so-chu.mjs, kiểm ở tests/chuyen.test.mjs); mỗi chỗ một lý do
doi_chu:
  - cu: "Số trên: số phách mỗi ô. Số dưới: hình nốt làm 1 phách (4 = đen, 8 = móc đơn)."
    moi: "Số trên: số phách mỗi ô. Số dưới: hình nốt làm 1 phách (4 = đen). Riêng 6/8: đếm 6 nốt móc đơn (8 = móc đơn), gộp ba nốt thành một phách lớn."
    ly_do: "n24 (da-sua): câu cũ trái với dòng 6/8 của bảng ngay trên (nhịp kép: phách lớn gồm ba nốt móc đơn); Open Music Theory, Simple and compound meter."
  - cu: Bậc I chủ âm · V át âm · IV hạ át · VII cảm âm.
    moi: Bậc I chủ âm · V át âm · IV hạ át âm · VII cảm âm.
    ly_do: "n30 (da-sua): tên bậc IV theo src/data/thuat-ngu.yml (subdominant: hạ át âm)."
  - cu: "C0aG1♯eD2♯bA3♯f♯E4♯c♯B5♯g♯F♯/G♭6♯/6♭e♭/d♯D♭5♭b♭A♭4♭fE♭3♭cB♭2♭gF1♭dngoài: trưởngtrong: thứ"
    moi: "C0aG1♯eD2♯bA3♯f♯E4♯c♯B5♯g♯F♯/G♭6♯/6♭d♯/e♭D♭5♭b♭A♭4♭fE♭3♭cB♭2♭gF1♭dngoài: trưởngtrong: thứ"
    ly_do: "n36 (da-sua): chữ trong hình vòng quãng năm. Ô trong ghi d♯/e♭, cùng thứ tự với ô ngoài F♯/G♭ (giọng thứ song song của F♯ trưởng là d♯ thứ, của G♭ trưởng là e♭ thứ)."
  - cu: I, vi
    moi: I (vi đôi khi thay I)
    ly_do: "n51 (da-sua): Open Music Theory xếp chỉ I là hợp âm chủ, vi là hạ át yếu, đôi khi mang chức năng chủ; MT21C xếp vi là kéo dài chủ. Hai nguồn khác nhau nên viết chung lại (chuan-kiem-dinh.md mục 2)."
