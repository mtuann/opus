nhan_dinh:
  - id: n1
    cau: "Bấm Ctrl+P (hoặc Cmd+P), chọn khổ A4."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "Hướng dẫn thao tác in; không trái trang lõi nào. Trang cũ ../opus-zero/docs/bat-dau/tom-tat.md ghi giống hệt."
    luot_2: dung
    luot_2_nguon: [ https://support.google.com/chrome/answer/1069693?hl=en ]
    luot_2_ghi_chu: "Loại khuyen-tap. Phím tắt in của trình duyệt: Ctrl+P (Windows/Linux), Cmd+P (Mac) (Chrome Help, 'Print from Chrome'); chọn khổ A4 hợp với trang hai mặt A4."
  - id: n2
    cau: "Menu và nút bấm tự ẩn khi in."
    loai: quy-tac
    nguon:
      - site-in
    ket_qua: dung
    ghi_chu: 'Nhận định về site mới. Starlight đặt lớp print:hidden (print.css: ".print\:hidden { display: none; }") cho thanh menu bên (PageFrame.astro: nav.sidebar), ô tìm kiếm và nhóm nút bên phải thanh trên (Header.astro), cột "Trên trang này" cả bản điện thoại (TwoColumnContent.astro: aside.right-sidebar-container), nút Trước, Tiếp (Pagination.astro), nút mở menu (MobileMenuToggle.astro). src/styles/thanh-phan.css (@media print) ẩn hàng nút và trình phát của khuông nhạc (.oz-abc-tools, .abc-audio). Thanh trên vẫn in tên site và logo.'
    luot_2: khong-chac
    luot_2_ghi_chu: Hành vi in của site (CSS in); không có nguồn ngoài. Kiểm bằng xem trước khi in ở Chromium, WebKit, Firefox hoặc kiểm thử của site.
  - id: n3
    cau: "Toàn bộ kiến thức đọc nhạc và nhạc lý cơ bản trên hai mặt giấy A4: mặt 1 là đọc nhạc, mặt 2 là nhạc lý."
    loai: quy-tac
    nguon:
      - site-in
    ket_qua: dung
    ghi_chu: "Nhận định về bản in của site mới, ĐÚNG CÓ ĐIỀU KIỆN: trang chia hai khối oz-sheet-page (ô 1–7 đọc nhạc, ô 8–14 nhạc lý); site cũ in mỗi khối một mặt A4 nhờ CSS ../opus-zero/docs/assets/css/opus.css dòng 366–394 (@media print: .oz-sheet-page hai cột, cỡ chữ 8.6pt; .oz-sheet-page + .oz-sheet-page { break-before: page }; ô inline-block không bị chia đôi). Agent chính thêm CSS tương đương (tiêu đề ô nay là h2 trong .sl-heading-wrapper của Starlight, không còn h3) rồi kiểm bằng in ra PDF khổ A4: đúng hai trang, mỗi khối một trang. Nếu không vừa thì sửa CSS hay câu này."
    luot_2: khong-chac
    luot_2_ghi_chu: "Nói về bố cục trang (hai mặt A4: mặt 1 đọc nhạc, mặt 2 nhạc lý), tự tham chiếu; không có nguồn ngoài. 'Toàn bộ kiến thức ... cơ bản' là nói rộng, khó kiểm; đề nghị viết 'tóm tắt kiến thức cơ bản'."
  - id: n4
    cau: "Nên chờ các khuông nhạc hiện đủ trước khi in."
    loai: khuyen-tap
    nguon:
      - site-khuong
    ket_qua: khong-can-nguon
    ghi_chu: "Vẫn đúng với site mới: khuông vẽ khi tới gần màn hình; trước khi in, src/scripts/tai.js khởi tạo mọi khối còn chờ và vẽ đồng bộ nếu abcjs đã tải (tải sẵn lúc rảnh, Safari sau 3 giây); nếu chưa tải, chỗ khuông in dòng 'Khuông nhạc chưa vẽ xong: đợi vài giây sau khi mở trang rồi in lại.' (thanh-phan.css). Đợi vài giây trước khi in là đủ."
    luot_2: dung
    luot_2_ghi_chu: "Loại khuyen-tap. Khớp cách site hoạt động theo AGENTS.md: khuông chỉ vẽ khi tới gần màn hình, in sớm thì chỗ khuông chưa vẽ in dòng nhắc; nên đợi khuông vẽ đủ. Không hại."
  - id: n5
    cau: "Hình bàn phím từ Đô3 (C3) đến Đô5 (C5): 15 phím trắng ghi tên hai hệ, 10 phím đen theo nhóm hai và ba, Đô giữa C4 được tô màu, bốn ngoặc ½ đánh dấu Mi–Fa và Si–Đô."
    loai: dinh-nghia
    nguon:
      - omt-keyboard
      - omt-steps
      - omt-aspn
    ket_qua: dung
    ghi_chu: 'Đã đọc từng phần tử SVG: phím trắng x=1…309 (rộng 22) ghi Đô C3, Rê D, Mi E, Fa F, Sol G, La A, Si B, Đô C4 (tô #f3e3b8), …, Đô C5; phím đen ở x=16.5, 38.5 | 82.5, 104.5, 126.5 | 170.5, 192.5 | 236.5, 258.5, 280.5: nhóm 2 rồi 3, không có phím đen giữa Mi–Fa và Si–Đô; ngoặc ½ nối tâm Mi–Fa (56–78, 210–232) và Si–Đô (144–166, 298–320); chữ "Đô giữa (C4)" dưới phím Đô thứ hai. OMT The Keyboard and the Grand Staff: "The black keys are grouped into sets of either three or two"; OMT ASPN: "Middle C is C4 in ASPN"; OMT Half Steps: "Two pairs of white keys—E/F and B/C—do not have black keys in between them ... E–F and B–C are both half steps." Sửa không đổi chữ: chữ "Đô giữa (C4)" (nằm trên nền trang) đổi fill="#222" thành currentColor để đọc được ở chế độ tối.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/, https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/, https://viva.pressbooks.pub/openmusictheory/chapter/aspn/ ]
    luot_2_ghi_chu: "Đếm theo OMT: C3–C5 gồm 15 phím trắng (7+7+1) và 10 phím đen (5 mỗi quãng tám) xếp theo nhóm 2 rồi 3 (OMT, Keyboard and Grand Staff); Middle C = C4 (OMT, ASPN); các cặp nửa cung tự nhiên E–F và B–C xuất hiện 4 lần trong C3–C5 (E3–F3, B3–C4, E4–F4, B4–C5) (OMT, Half Steps). Chi tiết thiết kế (tô màu C4, ghi tên hai hệ) là mô tả hình, không kiểm được bằng nguồn."
  - id: n6
    cau: "Bảy tên nốt lặp lại: Đô Rê Mi Fa Sol La Si = C D E F G A B."
    loai: dinh-nghia
    nguon:
      - omt-keyboard
      - omt-major
    ket_qua: dung
    ghi_chu: 'OMT The Keyboard and the Grand Staff: "pitches in Western musical notation are designated by the letters A, B, C, D, E, F, and G, repeating in a loop". Tên Đô Rê Mi… là solfège cố định (fixed do), bảng thuật ngữ của OMT Major Scales: "fixed do, where do is always the pitch class C". Cách viết tiếng Việt (Đô, Rê, Mi, Fa, Sol, La, Si) theo quy ước của site (bat-dau/index, mục Ký hiệu; bài nhạc lý 1 cũ).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT, Reading Clefs: tên cao độ là A B C D E F G lặp theo vòng; OMT, Major Scales, mục từ 'fixed do': do luôn là C, re là D, ... Vậy Đô Rê Mi Fa Sol La Si = C D E F G A B (Si tương ứng 'ti' trong OMT)."
  - id: n7
    cau: "Đô nằm bên trái nhóm 2 phím đen."
    loai: dinh-nghia
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'OMT: "The white note C is to the immediate left of the two-note black key pattern".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/ ]
    luot_2_ghi_chu: "OMT, Keyboard and Grand Staff: 'when the black keys appear as a set of two, the note to their immediate left is C'."
  - id: n8
    cau: "Phím đen mang hai tên (Đô♯ = Rê♭)."
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps, Whole Steps, and Accidentals, Example 6: "Each black key note has both a sharp and a flat name"; "C♯ and D♭ are enharmonically equivalent".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT, Half Steps, Whole Steps, and Accidentals: 'each key on the piano keyboard has more than one name'; C♯ và D♭ là tương đương enharmonic (cùng một phím đen)."
  - id: n9
    cau: "Nửa cung tự nhiên: Mi–Fa và Si–Đô (không có phím đen xen giữa)."
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT: "Two pairs of white keys—E/F and B/C—do not have black keys in between them (see Example 1). This is because E–F and B–C are both half steps."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT, Half Steps, Whole Steps, and Accidentals: 'Two pairs of white keys—E/F and B/C—do not have black keys in between them ... both half steps'."
  - id: n10
    cau: "Khóa Sol: các dòng, đếm từ dưới lên, là Mi Sol Si Rê Fa (E G B D F); các khe là Fa La Đô Mi (F A C E)."
    loai: dinh-nghia
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Chữ dưới khuông của khối abc 1. OMT Reading Clefs: "The letter names of the lines are labeled. Bottom to top these are: E, G, B, D, and F"; "The letter names of the spaces are labeled. From bottom to top these are: F, A, C, and E."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "OMT, Reading Clefs: dòng khóa Sol từ dưới lên E, G, B, D, F ('Every Good Bird Does Fly'); các khe F, A, C, E ('face')."
  - id: n11
    cau: "Nét xoắn của khóa Sol ôm dòng 2 = Sol (G4)."
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - omt-aspn
    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs: "the treble clef wraps around the G line (the second line from the bottom). For this reason, it is sometimes called the “G clef.”" OMT ASPN, Example 2: các nốt C4…B4 viết trên khóa Sol, nên Sol ở dòng 2 là G4 (nằm trên C4).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/ ]
    luot_2_ghi_chu: "OMT, Reading Clefs: khóa Sol 'wraps around the G line (the second line from the bottom)'; OMT, Notation of Notes: khóa Sol 'designates the second-lowest line of a staff as G₄'."
  - id: n12
    cau: "Khóa Fa: các dòng, đếm từ dưới lên, là Sol Si Rê Fa La (G B D F A); các khe là La Đô Mi Sol (A C E G)."
    loai: dinh-nghia
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Chữ dưới khuông của khối abc 2. OMT Reading Clefs: "Bottom to top these are: G, B, D, F, A"; spaces "(bottom to top): A, C, E, and G".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "OMT, Reading Clefs: dòng khóa Fa từ dưới lên G, B, D, F, A ('Good Bikes Don't Fall Apart'); các khe A, C, E, G ('All Cows Eat Grass')."
  - id: n13
    cau: "Hai chấm của khóa Fa kẹp dòng 4 = Fa (F3)."
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - omt-notation
      - omt-aspn
    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs: "the dot of the bass clef begins on the F line (the second line from the top)". OMT Notation of Notes: "Place two dots to the right of the backward C, centered respectively in the top two spaces of the staff" (hai khe kẹp dòng thứ hai từ trên xuống, tức dòng 4). F ở dòng ấy dưới Đô giữa C4 nên thuộc quãng tám 3 (OMT ASPN: mỗi quãng tám bắt đầu từ C).'
