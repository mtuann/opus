    luot_2_ghi_chu: "OMT, Minor Scales: 'The tonic of a minor key is always three half steps below the tonic of its relative major' (C → A). Thuật ngữ: OMT gọi A minor là 'relative minor' của C major (cùng hóa biểu, tonic thấp hơn ba nửa cung) và C minor là 'parallel minor' (cùng tonic). 'Giọng song song' trong tiếng Việt chỉ cặp cùng hóa biểu (Đô trưởng – La thứ) còn 'giọng cùng tên' chỉ cặp cùng chủ âm (hai trang giáo dục tiếng Việt đã mở nêu đúng định nghĩa này; chúng chỉ dùng để chứng thực cách gọi, không phải nguồn bậc 2). Nội dung câu đúng; chú ý 'song song' tiếng Việt tương ứng 'relative' của OMT, KHÔNG phải 'parallel', nên thuat-ngu.yml nên ghi rõ đối ứng tiếng Anh để khỏi lẫn."
  - id: n36
