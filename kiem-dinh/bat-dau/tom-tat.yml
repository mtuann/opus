    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT, Minor Scales (vòng quãng năm cho giọng trưởng và thứ): giọng trưởng chữ hoa ở vòng ngoài, giọng thứ chữ thường ở vòng trong, xếp theo số dấu hóa; từ C theo chiều kim đồng hồ thêm thăng, ngược chiều thêm giáng. Tôi tự đối chiếu: các giọng trưởng C, G, D, A, E, B, F♯/G♭, D♭, A♭, E♭, B♭, F với số dấu 0, 1♯ ... 5♯, 6♯/6♭, 5♭ ... 1♭ khớp các hóa biểu OMT liệt kê (Major Scales); giọng thứ song song tính bằng quy tắc 'ba nửa cung dưới' cho a, e, b, f♯, c♯, g♯, d♯/e♭, b♭, f, c, g, d: khớp. Thuật ngữ 'song song' = relative của OMT (xem n35)."
