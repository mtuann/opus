    ghi_chu: 'OMT Plagal Motion: "You may sometimes see all (IV)–I motions described as “plagal cadences” ... While true phrase endings involving the progression (IV)–I do exist, in 18th-century classical music, it''s more common to see a (IV)–I tonic prolongation". Tên kết đúng; OMT chỉ lưu ý kết này ít gặp ở cuối câu nhạc thế kỷ 18.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/plagal-motion/, https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/ ]
    luot_2_ghi_chu: "OMT, Plagal Motion: (IV)–I; OMT dùng 'plagal motion' thay vì 'plagal cadence' vì trong nhạc thế kỷ 18 (IV)–I thường kéo dài chủ âm sau PAC hay ở đầu câu, nhưng thừa nhận có trường hợp (IV)–I thật sự kết câu. FFF ch. 24 mục 24.5: 'plagal cadence' = IV về thẳng I ở cuối câu (cũng gọi amen cadence). Câu 'Kết plagal: IV → I' đúng theo FFF; muốn bám OMT thì thêm 'thường kéo dài chủ âm'."
  - id: n57
    cau: "Lừa (tránh kết): V → vi."
    loai: dinh-nghia
    nguon:
      - omt-la-bass
    ket_qua: da-sua
    ghi_chu: 'Ô bảng cũ: "Lừa | V → vi" trong bảng các loại kết. Open Music Theory (La in the Bass): V(7)–vi là "deceptive motion", "avoids a cadence rather than creating one", nên ghi thêm "(tránh kết)": không coi là một loại kết. src/data/thuat-ngu.yml chưa có tên gọi; lô D3 (bài 13) quyết.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/la-in-the-bass/, https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/ ]
    luot_2_ghi_chu: "OMT, La in the Bass: 'deceptive motion' phổ biến nhất khi V(7) đi tới vi thay vì I, 'avoids a cadence' (tránh kết). FFF ch. 22 mục 22.7: deceptive cadence = V7–vi. OMT thích 'deceptive motion' hơn 'deceptive cadence'."
  - id: n58
    cau: "Tốc độ: Largo < Adagio < Andante < Moderato < Allegro < Presto."
    loai: dinh-nghia
    nguon:
      - omt-other
    ket_qua: dung
    ghi_chu: 'OMT Other Aspects of Notation, Example 8: "Tempi are listed on a line from slowest to fastest. They are Grave, Lento, Largo, Adagio, Andante, Moderato, Allegretto, Allegro, Vivace, and Presto". Khớp khoảng BPM trong src/data/thuat-ngu.yml.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/Glossary/JKL, https://www.naxos.com/Glossary/ABC, https://www.naxos.com/Glossary/MNO, https://www.naxos.com/Glossary/PQR ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation, Ví dụ 8 (chú thích hình): 'Tempi are listed on a line from slowest to fastest: Grave, Lento, Largo, Adagio, Andante, Moderato, Allegretto, Allegro, Vivace, Presto' nên Largo < Adagio < Andante < Moderato < Allegro < Presto. Naxos Glossary: Largo (broad, slow), Adagio (slow), Andante (walking pace), Moderato (moderate), Allegro (fast, 'not as fast as vivace or presto'), Presto (fast)."
  - id: n59
    cau: "rit. chậm dần, accel. nhanh dần, a tempo trở lại."
    loai: dinh-nghia
    nguon:
      - omt-other
    ket_qua: dung
    ghi_chu: 'OMT: "ritardando (rit.) for a gradual decrease and accelerando (accel.) for a gradual increase"; "to return to the original tempo ... they will write a tempo".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/Glossary/PQR, https://www.naxos.com/Glossary/ABC ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation: ritardando (rit.) là giảm dần tốc độ, accelerando (accel.) tăng dần, 'a tempo' trở về tốc độ gốc. Naxos: Ritardando 'becoming slower', Accelerando 'becoming faster'."
  - id: n60
    cau: "Cường độ: pp < p < mp < mf < f < ff."
    loai: dinh-nghia
    nguon:
      - omt-other
    ket_qua: dung
    ghi_chu: "OMT liệt kê từ to đến nhỏ: fff, ff, f, mf, mp, p, pp, ppp (Example 1: Dynamics are arranged from quietest to loudest)."
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/Glossary/PQR, https://www.naxos.com/Glossary/DEF ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation: ppp, pp, p, mp, mf, f, ff, fff 'arranged from quietest to loudest' (ví dụ 1); p = piano, f = forte. Naxos: Piano 'soft', Forte 'loud', thêm chữ thì mạnh/nhẹ hơn. Thứ tự pp < p < mp < mf < f < ff đúng."
  - id: n61
    cau: "cresc. to dần, dim. nhỏ dần, sfz nhấn đột ngột."
    loai: dinh-nghia
    nguon:
      - omt-other
    ket_qua: dung
    ghi_chu: 'OMT: "Crescendo (cresc.) means to get louder, while decrescendo (decresc.) and diminuendo (dim.) both mean to get quieter"; "Accented notes can also be indicated by the italicized abbreviations sfz, sf, or fz (sforzando, forzando, or forzato). These accents are usually interpreted to be slightly more forceful". src/data/thuat-ngu.yml: sforzando "Nhấn mạnh đột ngột".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/Glossary/ABC, https://www.naxos.com/Glossary/DEF ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation: crescendo (cresc.) to dần; decrescendo/diminuendo (dim.) nhỏ dần; sfz, sf, fz (sforzando...) là dấu nhấn 'usually interpreted to be slightly more forceful (i.e., louder) than regular accents'. Naxos: Crescendo 'becoming louder', Diminuendo 'becoming less'. OMT không nói 'đột ngột' cho sfz, nhưng sforzando thường được định nghĩa là nhấn mạnh đột ngột (không có nguồn mở được trong lượt này)."
  - id: n62
    cau: "staccato ngắt, legato liền, fermata ngân dài."
    loai: dinh-nghia
    nguon:
      - omt-other
    ket_qua: dung
    ghi_chu: 'OMT: "Legato means to play or sing smoothly or connected"; "Staccato means to play or sing notes more separated"; "A fermata indicates that a note should be held longer than its regular duration."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/Glossary/JKL ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation: staccato = 'more separated, leaving space between notes'; legato = 'smoothly or connected'; fermata = 'hold a note longer than its regular duration'. Naxos: Legato (smooth), đối lập với staccato (rút ngắn và tách nốt)."
  - id: n63
    cau: "D.C. từ đầu, Fine hết."
    loai: dinh-nghia
    nguon:
      - omt-other
    ket_qua: dung
    ghi_chu: 'OMT: "D.C. al Fine, or da capo al fine, means to play or sing a work from the beginning until one sees D.C. al Fine. You then go back to the beginning, and play or sing until the Fine."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/, https://www.naxos.com/Glossary/DEF ]
    luot_2_ghi_chu: "OMT, Other Aspects of Notation: 'D.C. al Fine ... play or sing a work from the beginning until one sees D.C. al Fine. You then go back to the beginning, and play or sing until the Fine' (Fine = chỗ kết thúc). Naxos: Da capo (Italian: from the beginning), da capo al fine."
