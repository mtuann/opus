      kiem_mau: null
ghi_chu: >-
  Trang không đổi chữ. 28 câu hỏi nhạc lý kiểm theo Open Music Theory (chương ghi trong nguon) và bài nhạc lý cũ cùng số; thuật ngữ tiếng Việt theo bài cũ (giọng thứ song song là relative minor, giọng cùng tên là parallel; hạ át là subdominant, OMT gọi nhóm này là predominant; kết lừa là deceptive cadence). Tiêu chí từng chặng so với danh sách "Sẵn sàng lên chặng tiếp khi…" của trang cũ piano/lo-trinh.md; bài nêu làm ví dụ so với dữ liệu D2-0 và đề cương ABRSM, trang Henle. Các câu về cách bài kiểm tra chạy (lưu kết quả, "Tôi chưa biết", trang chủ dùng kết quả) đúng với site cũ (placement.js, practice.js, plan.js) và đúng ở site mới khi hai thành phần placement, piano-level và ô gợi ý tập ở trang chủ làm như vậy (agent chính làm trong D2-L1): review kiểm trên bản build trước khi khóa.
