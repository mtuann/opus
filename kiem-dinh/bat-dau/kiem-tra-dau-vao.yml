    nguon: [ omt-triads ]
    ket_qua: dung
    ghi_chu: 'OMT, Triads: "a minor triad''s third is minor and its fifth is perfect". Rê–Fa là quãng 3 thứ (3 nửa cung), Rê–La là quãng 5 đúng.'
  - id: n40
    cau: Trong giọng trưởng, hợp âm bậc vii là hợp âm giảm (không phải thứ hay tăng).
    loai: dinh-nghia
    nguon: [ omt-roman ]
    ket_qua: dung
    ghi_chu: 'OMT, Roman Numerals: "Lowercase Roman numerals followed by a superscript o (such as viio) represent diminished triads"; bảng hợp âm của giọng trưởng có viio.'
  - id: n41
    cau: Hợp âm Đô trưởng có Mi ở bè trầm là thể đảo 1 (không phải thể gốc hay đảo 2).
    loai: dinh-nghia
    nguon: [ omt-inversion ]
    ket_qua: dung
    ghi_chu: 'OMT, Inversion: "When the third is in the bass, we say the chord is in first inversion, when the fifth is in the bass we say the chord is in second inversion". Mi là quãng 3 của Đô trưởng.'
  - id: n42
    cau: G7 (Sol – Si – Rê – Fa) là hợp âm bảy át (không phải bảy trưởng hay bảy thứ).
    loai: dinh-nghia
    nguon: [ omt-seventh ]
    ket_qua: dung
    ghi_chu: 'OMT, Seventh Chords: "the major-minor seventh chord is also often called the dominant seventh chord"; hợp âm bảy trên sol (5̂) của giọng trưởng "have a major triad and a minor seventh (a dominant seventh chord)". Sol–Si–Rê là hợp âm trưởng, Sol–Fa là quãng 7 thứ.'
  - id: n43
    cau: Hợp âm IV thuộc chức năng hạ át (không phải chủ hay át).
    loai: dinh-nghia
    nguon: [ omt-harmony, bai-nhac-ly-cu ]
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Harmony: "Predominant (PD): Chords that transition away from tonic function toward dominant function … Strong predominants … IV and ii". Bài cũ 12 dùng tên "Hạ át (Subdominant / tiền át, S): IV, ii", tức nhóm OMT gọi là predominant.'
  - id: n44
    cau: Hợp âm vi có thể thay thế I vì cùng chức năng chủ (V thuộc chức năng át, ii thuộc chức năng hạ át).
    loai: dinh-nghia
    nguon: [ omt-harmony ]
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Harmony, bảng thuật ngữ: "The I chord is the paradigmatic tonic-function chord, but vi and iii occasionally have tonic function"; ii là predominant (hạ át). Bài cũ 12: "vi (La – Đô – Mi) chung hai nốt với I … nên có thể thay thế nhau".'
  - id: n45
    cau: Kết thúc câu nhạc ở hợp âm V gọi là kết nửa (không phải kết trọn hay kết plagal).
    loai: dinh-nghia
    nguon: [ omt-harmony, omt-plagal, omt-la-bass ]
    ket_qua: da-sua
    ghi_chu: 'Câu hỏi giữ nguyên, đổi một lựa chọn sai: "Kết lừa" thành "Kết plagal". Theo Open Music Theory (nguồn chính), V–vi là "deceptive motion", tránh kết chứ không phải một loại kết (La in the Bass: "we find that the term ''deceptive cadence'' inaccurately describes the progression''s purpose"), nên không đưa "kết lừa" vào như tên một loại kết. Kết plagal có thật dù ít gặp (Plagal Motion: "true phrase endings involving the progression (IV)–I do exist"). Kết nửa: Introduction to Harmony, "A half cadence (HC) occurs when a phrase ends on V".'
  - id: n46
    cau: 'Tai chờ kết mà V đi tới vi thay vì I: đó là lối "lừa", tránh kết (không phải kết plagal hay kết trọn).'
    loai: dinh-nghia
    nguon: [ omt-la-bass, omt-harmony ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "V – vi là loại kết nào? + Kết lừa". Open Music Theory, La in the Bass: "When a V chord sets up the expectation for a cadence, but moves instead to an unexpected, non-tonic harmony, this is called deceptive motion … Since the progression V(7)–vi avoids a cadence rather than creating one, we find that the term ''deceptive cadence'' inaccurately describes the progression''s purpose". Viết trung tính "Lừa (tránh kết)", như tờ tóm tắt (bat-dau/tom-tat n57). src/data/thuat-ngu.yml chưa có thuật ngữ này: lô D3 (bài 13) quyết tên gọi.'
  - id: n47
    cau: '"Allegro" nghĩa là nhanh, vui tươi (không phải chậm, thong thả, cũng không phải to dần).'
    loai: dinh-nghia
    nguon: [ omt-other, oxford-allegro, thuat-ngu ]
    ket_qua: dung
    ghi_chu: 'OMT, Other Aspects of Notation: "Fast tempi: vivace, presto, allegro, allegretto". Oxford Learner''s: allegro "(music) in a fast and lively manner". thuat-ngu.yml: "Allegro: Nhanh, vui tươi". To dần là crescendo.'
  - id: n48
    cau: Ký hiệu "p" nghĩa là nhỏ (piano), không phải to (forte) hay ngắt ngắn.
