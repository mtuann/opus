nhan_dinh:
  - id: n1
    cau: Bài kiểm tra có hai phần, làm phần nào trước cũng được.
    loai: so-lieu
    nguon: [ placement-js-cu, practice-js-cu ]
    ket_qua: dung
    ghi_chu: 'Nhận định về site. Hai phần là hai thành phần độc lập (site cũ: practice.js tính chặng từ các ô đánh dấu; placement.js chạy câu hỏi nhạc lý), không phần nào cần kết quả của phần kia.'
  - id: n2
    cau: Phần piano mất khoảng 2 phút.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Ước lượng của site cho 18 việc cần đánh dấu (6 nhóm, mỗi nhóm 3 việc). Bài 0 dùng cùng con số.
  - id: n3
    cau: Phần piano cho biết bạn đang ở chặng nào của lộ trình piano; phần nhạc lý cho biết nên bắt đầu từ bài nhạc lý nào.
    loai: so-lieu
    nguon: [ practice-js-cu, placement-js-cu ]
    ket_qua: dung
    ghi_chu: 'Nhận định về site. Site cũ: practice.js hiện "Chặng của bạn: …" từ các ô đã đánh dấu; placement.js kết thúc bằng "Gợi ý: bắt đầu từ bài …" (bài đầu tiên chưa đúng cả hai câu). Site mới: đúng khi thành phần piano-level và placement làm như vậy (agent chính, D2-L1).'
  - id: n4
    cau: Kết quả được lưu trong trình duyệt và dùng để gợi ý buổi tập hôm nay ở trang chủ.
    loai: so-lieu
    nguon: [ practice-js-cu, placement-js-cu, plan-js-cu ]
    ket_qua: dung
    ghi_chu: 'Nhận định về site. Site cũ: practice.js ghi store.pianoLevel { stage, date }, placement.js ghi store.placement { date, start }, cùng khóa opus-zero:v1; plan.js (khối "Hôm nay" ở trang chủ) đọc pianoLevel để gợi ý gam và bài. Site mới (D2-L1): piano-level lưu store.pianoLevel, placement lưu store.placement, cùng khóa opus-zero:v1 (src/scripts/muc-do.js, placement.js); ô gợi ý tập ở trang chủ (mục "Hôm nay tập gì?", src/scripts/goi-y.js) đọc cả hai: chặng và bài nên bắt đầu, bài nhạc lý nên bắt đầu. Kiểm trong trình duyệt (tests/trinh-duyet/kiem-thanh-phan.mjs).'
  - id: n5
    cau: Mỗi nhóm có ba việc; làm được hai trong ba là coi như xong chặng đó.
    loai: so-lieu
    nguon: [ practice-js-cu, khoi-placement ]
    ket_qua: dung
    ghi_chu: 'Trang có 6 nhóm, mỗi nhóm đúng 3 việc (18 ô). Site cũ, practice.js, hàm stage(): một nhóm xong khi số ô đánh dấu từ ceil(3 × 2/3) = 2; chặng là nhóm đầu tiên chưa xong. Site mới: thành phần piano-level phải giữ luật này (agent chính, D2-L1).'
  - id: n6
    cau: 'Sáu nhóm mang tên và Grade của chặng 1–6: Khởi đầu; Sơ cấp, ≈ Grade 1–2; Sơ trung cấp, ≈ Grade 3; Trung cấp, ≈ Grade 4–5; Trung cấp cao, ≈ Grade 6; Nâng cao, ≈ Grade 7–8.'
    loai: cap-do
    nguon: [ du-lieu-d20, abrsm-2526 ]
    ket_qua: dung
    ghi_chu: 'Khớp cap-do.yml (ten, nhan_grade của chặng 1–6; D2-0 đã kiểm). ABRSM 2025 & 2026: "ABRSM Practical Music qualifications are available from Grade 1 to Grade 8, and in some subjects from Initial Grade". Tên chặng là lựa chọn của site.'
  - id: n7
    cau: 'Xong chặng 1: chơi được bằng hai tay vài bài đơn giản, như 10 bài đầu tiên, không dừng, ở tốc độ chậm vừa; đọc được nốt ở cả khóa Sol lẫn khóa Fa; chơi gam Đô trưởng một quãng tám từng tay, luồn ngón cái không giật.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp trang cũ lo-trinh.md, chặng 1, "Sẵn sàng lên chặng tiếp khi…": "Chơi trọn 10 bài đầu tiên bằng hai tay, không dừng, ở tốc độ chậm vừa", "Đọc đúng ít nhất 9/10 nốt ở cả khóa Sol lẫn khóa Fa…", "Chơi gam Đô trưởng một quãng tám từng tay, luồn ngón cái không giật". 10 bài đầu tiên là bài của chặng 1 (lo-trinh.md, dòng Tác phẩm của chặng 1).'
  - id: n8
    cau: 'Xong chặng 2: chơi trọn vẹn vài bài cấp 1–2, có sắc thái, không dừng khi lỡ sai; chơi các gam trưởng và thứ đã học bằng hai tay, hai quãng tám; đổi bàn đạp theo hợp âm mà tiếng không bị nhòe.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp lo-trinh.md, chặng 2: "Chơi trọn vẹn 4–6 bài cấp 1–2, có sắc thái, không dừng khi lỡ sai", "Gam trưởng và thứ đã học: hai tay, hai quãng tám…", "Đổi bàn đạp theo hợp âm mà âm thanh không bị nhòe".'
  - id: n9
    cau: Minuet Sol trưởng là một bài cấp 1–2 (chặng 2).
    loai: cap-do
    nguon: [ henle-hn349, du-lieu-d20 ]
    ket_qua: dung
    ghi_chu: 'Henle HN 349: "Menuet BWV Anhang 114" mức 1 (easy). Dữ liệu D2-0: minuet-sol chặng 2, grade "Grade 1–2" (D2-0 đối chiếu thêm RCM Level 3 và minuet Sol thứ Anh. 115 ở ABRSM Grade 2).'
  - id: n10
    cau: 'Xong chặng 3: chơi trọn một sonatina, nhịp ổn định từ đầu đến cuối; đệm Alberti đều và nhỏ hơn giai điệu; chơi gam đến 3 dấu hóa, hai tay, hai quãng tám.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp lo-trinh.md, chặng 3: "Chơi một sonatina trọn vẹn, nhịp ổn định từ đầu đến cuối", "Đệm Alberti đều và nhỏ hơn giai điệu", "Gam đến 3 dấu hóa, hai tay, hai quãng tám".'
  - id: n11
    cau: Sonatina Op. 36 số 1 của Clementi là bài của chặng 3 (≈ Grade 3).
    loai: cap-do
    nguon: [ abrsm-2324, du-lieu-d20 ]
    ket_qua: dung
    ghi_chu: 'ABRSM 2023 & 2024, Grade 3, danh sách A, số 2: "Clementi Vivace (3rd movt from Sonatina in C, Op. 36 No. 1)". Dữ liệu D2-0: clementi-sonatina chặng 3, Grade 3.'
  - id: n12
    cau: 'Xong chặng 4: chơi hai bè độc lập, một bè to, một bè nhỏ, theo ý mình; chơi mọi gam trưởng và thứ, hai tay, hai quãng tám; biểu diễn thuộc lòng một chương trình khoảng 10 phút cho người khác nghe.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp lo-trinh.md, chặng 4: "Chơi hai bè độc lập: một bè to, một bè nhỏ, theo ý mình", "Mọi gam trưởng và thứ, hai tay, hai quãng tám", "Biểu diễn thuộc lòng một chương trình 10 phút cho người khác nghe".'
  - id: n13
    cau: 'Xong chặng 5: chơi trọn một chương sonata Cổ điển ở tốc độ gần với chỉ dẫn; làm nổi được giai điệu nằm ở giữa hoặc ở tay trái; hai bè của Bach rõ ràng, cách phát âm nhất quán từ đầu đến cuối.'
    loai: khuyen-tap
    nguon: [ oz-lo-trinh ]
    ket_qua: da-sua
    ghi_chu: 'Trang cũ: "Hai bè của Bach rõ ràng, như trong Invention số 1". D2-0 chuyển Invention số 1 xuống chặng 4 (Grade 4–5, theo đề cương ABRSM), nên ví dụ không còn hợp tiêu chí xong chặng 5; viết như danh sách chặng 5 của trang Lộ trình piano ("Hai bè của Bach rõ ràng, cách phát âm nhất quán từ đầu đến cuối"). Hai tiêu chí kia khớp trang ấy. Mã việc của mục này tính theo chữ nên đổi: dấu đã đánh ở site cũ cho mục này không còn hiện.'
  - id: n14
    cau: Invention số 1 của Bach là bài của chặng 5 (≈ Grade 6).
    loai: cap-do
    nguon: [ henle-hn591, abrsm-2526, du-lieu-d20 ]
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang (sau khi D2-0 gộp): dữ liệu mới xếp Invention số 1 ở chặng 4, Grade 4–5 (src/data/tac-pham.yml; hồ sơ kiem-dinh/du-lieu/tac-pham/bach-invention-1.yml), nên câu "Invention số 1 là bài của chặng 5" không còn đúng; tiêu chí chặng 5 không nêu ví dụ nữa (n13). Lượt 1 trước đó: Henle HN 591 mức 3; ABRSM 2025–2026 xếp Invention số 6 ở Grade 6, số 8 ở Grade 5.'
  - id: n15
    cau: 'Xong chặng 6: chơi thuộc lòng một chương trình 20–30 phút gồm ít nhất ba thời kỳ; chơi một prelude và fugue của Bach, các bè nghe rõ; tự quyết định ngón bấm, sắc thái và tốc độ cho một bài mới, và giải thích được vì sao.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp lo-trinh.md, chặng 6: "Một chương trình 20–30 phút gồm ít nhất ba thời kỳ, thuộc lòng", "Một prelude và fugue của Bach, các bè nghe rõ", "Tự quyết định ngón bấm, sắc thái và tốc độ cho một bài mới, và giải thích được vì sao".'
  - id: n16
    cau: Phần nhạc lý gồm 28 câu, mỗi bài nhạc lý có 2 câu.
    loai: so-lieu
    nguon: [ khoi-placement ]
    ket_qua: dung
    ghi_chu: Khối placement có 14 dòng @ (bài 1–14), mỗi bài đúng 2 câu ?, mỗi câu đúng một đáp án +.
  - id: n17
    cau: Phần nhạc lý mất khoảng 5–10 phút.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Ước lượng của site; 28 câu, mỗi câu khoảng 10–20 giây.
  - id: n18
    cau: 'Nếu không biết, hãy chọn "Tôi chưa biết" thay vì đoán: kết quả sẽ chính xác hơn.'
    loai: so-lieu
    nguon: [ placement-js-cu ]
    ket_qua: dung
    ghi_chu: 'Nhận định về site. Site cũ: placement.js thêm lựa chọn { t: "Tôi chưa biết", ok: false } sau các đáp án; chọn nó tính là chưa nắm, nên không bị tính đúng nhờ đoán may. Site mới: thành phần placement phải giữ lựa chọn này (agent chính, D2-L1).'
  - id: n19
