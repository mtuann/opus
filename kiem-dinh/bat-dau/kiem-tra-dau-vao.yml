    ghi_chu: 'OMT, Intervals: cách "Major Scale": quãng từ nốt dưới, nếu nốt trên thuộc gam trưởng của nốt dưới thì quãng 5 là đúng (perfect); Sol thuộc Đô trưởng và Đô–Sol là quãng 5 (Đô, Rê, Mi, Fa, Sol). Quãng 5 không có loại trưởng.'
  - id: n38
    cau: Đảo quãng 3 trưởng thì được quãng 6 thứ (không phải 6 trưởng hay 5 đúng).
