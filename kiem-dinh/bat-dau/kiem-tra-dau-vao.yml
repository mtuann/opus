    nguon: [ omt-major ]
    ket_qua: dung
    ghi_chu: 'OMT, Major Scales: "tonic, supertonic, mediant, subdominant, dominant, submediant, and leading tone" cho bậc 1–7. Tiếng Việt: chủ âm, át âm, cảm âm như bài cũ 6.'
  - id: n33
    cau: Giọng thứ song song của Đô trưởng là La thứ (Đô thứ là giọng thứ cùng tên).
    loai: dinh-nghia
    nguon: [ omt-minor, bai-nhac-ly-cu ]
    ket_qua: dung
    ghi_chu: 'OMT, Minor Scales: "C major is the relative major of A minor, and A minor is the relative minor of C major"; "C major and C minor … are parallel keys". Thuật ngữ tiếng Việt theo bài cũ 7: "Giọng thứ song song (relative minor) dùng chung hóa biểu"; "Giọng thứ cùng tên (parallel minor)". Lưu ý: "song song" tiếng Việt ứng với relative, không phải parallel của tiếng Anh.'
  - id: n34
    cau: Gam thứ hòa âm nâng bậc 7 (không phải bậc 3 hay bậc 6).
    loai: dinh-nghia
    nguon: [ omt-minor ]
    ket_qua: dung
    ghi_chu: 'OMT, Minor Scales: "In harmonic minor, ti (↑7̂) replaces te (7̂)"; bảng thuật ngữ: harmonic minor là "Like natural minor, but with a raised leading tone". Nâng bậc 6 và 7 là thể giai điệu khi đi lên.'
  - id: n35
    cau: Hóa biểu 3 dấu giáng là của Mi♭ trưởng (La♭ trưởng có 4 dấu giáng, Si♭ trưởng có 2).
    loai: dinh-nghia
    nguon: [ omt-major ]
    ket_qua: dung
    ghi_chu: 'OMT, Major Scales: thứ tự dấu giáng "B, E, A, D, G, C, F"; "In flat key signatures, the second-to-last flat is the tonic": ba dấu giáng Si♭, Mi♭, La♭ cho chủ âm Mi♭. Cùng luật: hai dấu giáng là Si♭ trưởng, bốn dấu giáng là La♭ trưởng.'
  - id: n36
    cau: Thứ tự dấu thăng bắt đầu bằng Fa – Đô – Sol (Si – Mi – La là thứ tự dấu giáng).
