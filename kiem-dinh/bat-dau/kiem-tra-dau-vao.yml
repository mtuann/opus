  - id: n21
    cau: Nốt Sol trong hệ chữ cái là G (không phải F hay A).
    loai: dinh-nghia
    nguon: [ omt-major, omt-keyboard ]
    ket_qua: dung
    ghi_chu: 'OMT, Major Scales: "a fixed do solmization system, in which do is always the pitch class C"; các âm tiết "do, re, mi, fa, sol, la, and ti" ứng với bảy bậc của gam trưởng, nên với Đô cố định: Sol là bậc 5 của Đô trưởng, tức G. OMT, Keyboard: tên nốt "A, B, C, D, E, F, and G".'
  - id: n22
    cau: Ký hiệu C4 chỉ Đô giữa trên piano (không phải nốt Đô thấp nhất trên piano, cũng không phải một hợp âm).
    loai: dinh-nghia
    nguon: [ omt-aspn, omt-keyboard ]
    ket_qua: dung
    ghi_chu: 'OMT, ASPN: "Middle C is C4 in ASPN". OMT, Keyboard: Đô giữa "is the note that appears to be around the middle of a piano keyboard", nên không phải nốt Đô thấp nhất. C4 là tên một nốt, không phải hợp âm.'
  - id: n23
    cau: Trong khóa Sol, nốt trên dòng 2 là Sol (không phải Mi hay Si).
    loai: dinh-nghia
    nguon: [ omt-clefs ]
    ket_qua: dung
    ghi_chu: 'OMT, Reading Clefs: các dòng của khóa Sol là "E, G, B, D, F" (từ dưới lên); "the treble clef wraps around the G line (the second line from the bottom)". Mi là dòng 1, Si là dòng 3.'
  - id: n24
    cau: Trong khóa Fa, nốt trên dòng 4 là Fa (không phải Rê hay La).
    loai: dinh-nghia
    nguon: [ omt-clefs ]
    ket_qua: dung
    ghi_chu: 'OMT, Reading Clefs: các dòng của khóa Fa là "G, B, D, F, A" (từ dưới lên); "the dot of the bass clef begins on the F line (the second line from the top)", tức dòng 4. Rê là dòng 3, La là dòng 5.'
  - id: n25
    cau: Một nốt trắng bằng 2 nốt đen (không phải 4 hay ½).
    loai: dinh-nghia
    nguon: [ omt-rhythm ]
    ket_qua: dung
    ghi_chu: 'OMT, Notating Rhythm: "a whole note divides into two half notes, four quarter notes", nên một nốt trắng bằng hai nốt đen. 4 nốt đen là nốt tròn; ½ nốt đen là nốt móc đơn.'
  - id: n26
    cau: Khi nốt đen là 1 phách, nốt đen chấm dôi dài 1 phách rưỡi (không phải 2, hay 1 và ¼).
    loai: dinh-nghia
    nguon: [ omt-rhythm ]
    ket_qua: dung
    ghi_chu: 'OMT, Notating Rhythm: "A dot … increases its duration by half"; "a quarter note is equivalent in duration to two eighth notes; therefore, a dotted quarter note would be equivalent to three eighth notes" (một phách rưỡi).'
  - id: n27
    cau: 'Số chỉ nhịp 3/4 nghĩa là mỗi ô nhịp 3 phách, nốt đen là 1 phách (không phải 4 phách với nốt móc ba là 1 phách, cũng không phải chơi với 3/4 tốc độ).'
    loai: dinh-nghia
    nguon: [ omt-simple ]
    ket_qua: dung
    ghi_chu: 'OMT, Simple Meter: "the top number of a time signature represents the number of beats in each measure, while the bottom number represents the beat unit"; số 4 ở dưới là nốt đen. "A time signature is not a fraction", nên không phải tỉ lệ tốc độ.'
  - id: n28
    cau: Nhịp 6/8 thường được cảm nhận thành 2 phách lớn (không phải 3 hay 6).
    loai: dinh-nghia
    nguon: [ omt-compound ]
    ket_qua: dung
    ghi_chu: 'OMT, Compound Meter: với 6/8 "each measure has two beats (6÷3=2), indicating duple meter. Each dotted quarter note (the beat) gets a count". 6 là số nốt móc đơn, 3 là số móc đơn mỗi phách.'
  - id: n29
    cau: Si – Đô cách nhau nửa cung tự nhiên; La – Si và Fa – Sol cách nhau một cung.
    loai: dinh-nghia
    nguon: [ omt-half-whole ]
    ket_qua: dung
    ghi_chu: 'OMT, Half Steps, Whole Steps, and Accidentals: "Two pairs of white keys—E/F and B/C—do not have black keys in between them … E–F and B–C are both half steps"; Example 2 ghi A–B là một cung. Fa – Sol có phím đen Fa♯ ở giữa, cũng là một cung.'
  - id: n30
    cau: Dấu hóa bất thường có hiệu lực đến hết ô nhịp (không phải hết bản nhạc, cũng không phải chỉ một nốt).
    loai: quy-tac
    nguon: [ ou-accidentals ]
    ket_qua: dung
    ghi_chu: 'OpenLearn 6.2: "Accidentals, unless cancelled, last throughout a bar". Mục 6.1 cùng khóa học: dấu hóa ở hóa biểu mới có hiệu lực cả bản ("throughout a piece"). OMT không có câu nói thẳng luật này nên dùng nguồn của Open University.'
  - id: n31
    cau: Gam Sol trưởng có dấu hóa Fa♯ (không phải Si♭ hay Đô♯).
    loai: dinh-nghia
    nguon: [ omt-major ]
    ket_qua: dung
    ghi_chu: 'OMT, Major Scales: thứ tự dấu thăng "F, C, G, D, A, E, B"; "In sharp key signatures, the last sharp is a half step below the tonic", nên một dấu thăng (Fa♯) là Sol trưởng. Si♭ là hóa biểu Fa trưởng; Đô♯ là dấu thăng thứ hai.'
  - id: n32
    cau: Bậc V của gam trưởng gọi là át âm (bậc I là chủ âm, bậc VII là cảm âm).
