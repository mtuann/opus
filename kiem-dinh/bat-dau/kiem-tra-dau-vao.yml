    nguon: [ omt-intervals ]
    ket_qua: dung
    ghi_chu: 'OMT, Intervals: "Thirds invert to sixths (3 + 6 = 9)"; "Major intervals invert to minor intervals"; Example 10: "A ma3 from C3 to E3 inverts to a mi6 from E3 to C4".'
  - id: n39
    cau: Hợp âm Rê – Fa – La là hợp âm thứ (không phải trưởng hay giảm).
