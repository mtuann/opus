    nguon: [ omt-major ]
    ket_qua: dung
    ghi_chu: 'OMT, Major Scales: "The order of sharps in key signatures is F, C, G, D, A, E, B, while the order of flats is the opposite: B, E, A, D, G, C, F".'
  - id: n37
    cau: Đô – Sol là quãng 5 đúng (không phải 5 trưởng hay 4 đúng).
