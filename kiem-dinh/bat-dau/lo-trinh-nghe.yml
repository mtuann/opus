tang: loi
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d2-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (D2-L1 lượt 1, phần D)
      luot_2: Claude Sonnet 5.5 (D2-L1 lượt 2 phần 2/2)
      review: Claude Opus 5.5 (review D2-L1, 24/10/2026)
      kiem_mau: null
ghi_chu: >-
  Tên tác phẩm, giọng, năm sáng tác, độ dài đối chiếu trang tác phẩm trên IMSLP (link lấy từ hồ sơ D2-0 của cùng bản ghi, mở lại ở lượt này); tác phẩm còn bản quyền (Pärt, Britten) đối chiếu cơ sở dữ liệu IRCAM và chương trình hòa nhạc của Utah Symphony. Câu về nội dung site (bài nhạc lý, công cụ, trang thời kỳ, mục Nhận diện) đối chiếu trang cũ trong ../opus-zero/docs/ và mkdocs.yml cũ; các trang ấy chưa lên site lúc D2-L1 gộp nên link hiện "sắp có". Đổi chữ: bỏ tên YouTube (chi tiết mau cũ, d2-bang-tang.md mục 4), bỏ hai con số viết tay ("hàng trăm bản thu", "16 hướng dẫn"), sửa "luôn hay hơn" và danh sách "các hướng dẫn còn lại". Hai mục việc - [ ] đổi chữ nên mã việc lưu trong trình duyệt của hai mục ấy đổi theo (dấu đã đánh ở site cũ cho hai mục này không còn hiện).
