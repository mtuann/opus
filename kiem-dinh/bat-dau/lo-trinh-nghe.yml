    ghi_chu: 'Review (24/10/2026): viết lại theo lượt 2. Câu trước: "…; hiểu vì sao giọng thứ nghe buồn." OMT, Minor Scales: "Minor is often (but not always!) used to depict negative emotions, such as sadness, in Western music": giọng thứ hay được dùng cho nhạc buồn, không phải lúc nào cũng buồn. Đây là một mục việc ("- [ ]"): đổi chữ thì mã việc đổi, dấu đã đánh ở site cũ cho mục này không còn. Lượt 1: Bài cũ 6 "Gam trưởng", 7 "Gam thứ". OMT, Minor Scales: "Minor is often (but not always!) used to depict negative emotions, such as sadness, in Western music". Câu của trang là mục tiêu học (hiểu vì sao), không nói giọng thứ lúc nào cũng buồn.'
    luot_2: khong-chac
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/triads/ ]
    luot_2_ghi_chu: 'OMT (Minor Scales): "Minor is often (but not always!) used to depict negative emotions, such as sadness, in Western music"; OMT (Triads): coi hợp âm thứ là "buồn" chỉ là cách ghép cảm xúc thường gặp. Vì vậy "hiểu vì sao giọng thứ nghe buồn" nên viết mềm: "hiểu vì sao giọng thứ thường gắn với cảm giác buồn, tối (nhưng không phải luôn luôn)". Số bài 6–7 là tham chiếu nội bộ.'
