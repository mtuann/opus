    luot_2: khong-chac
    luot_2_ghi_chu: 'Câu quá chung. Một phần lớn nhạc cổ điển là nhạc không lời (giao hưởng, sonata, tứ tấu), nhưng opera, lieder, hợp xướng, cantata, requiem có lời và chiếm tỷ trọng đáng kể; chưa tìm được nguồn bậc 2 mở được để xác nhận "thường không có lời". Đề nghị viết cụ thể hơn, ví dụ: "Nhiều tác phẩm cổ điển là nhạc không lời, nên âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ."'
  - id: n11
    cau: Đọc vài dòng về bối cảnh trước hay sau khi nghe, tùy bạn; nghe lại một tác phẩm vài lần, vì lần sau thường dễ nghe hơn lần đầu, nhưng đừng nghe một bài quá nhiều lần liền.
    loai: khuyen-tap
    nguon:
      - margulis-2010
      - schellenberg-2008
      - szpunar-2004
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): viết lại theo lượt 2 thành lời khuyên, không kèm con số và không nói như một kết quả khoa học (loại đổi từ quy-tac sang khuyen-tap). Câu trước: "Đọc vài dòng về bối cảnh trước khi nghe cho bạn một điểm bám, và lần thứ ba nghe một tác phẩm thường hay hơn lần đầu." Margulis 2010: mô tả bằng chữ đặt trước đoạn nhạc làm người không học nhạc thích ít hơn, nên không khuyên đọc trước. Schellenberg, Peretz và Vieillard 2008: nghe tập trung thì độ thích tăng sau 2 lần rồi giảm sau 8 hay 32 lần (hình chữ U ngược); Szpunar và cộng sự 2004 cũng thấy hình chữ U ngược. Không nguồn nào cho con số "lần thứ ba". Lượt 1: Câu cũ: "lần thứ ba nghe một tác phẩm luôn hay hơn lần đầu". Szpunar và cộng sự 2004: nghe kỹ thì độ thích "followed an inverted U-shaped function of exposure for the most ecologically valid stimuli (initial increases followed by decreases)": mấy lần nghe đầu thường làm thích hơn, nhưng không phải luôn luôn, nên "luôn" thành "thường".'
    luot_2: khong-chac
    luot_2_nguon: [ https://sites.utm.utoronto.ca/sites/sites.utm.utoronto.ca.glenn_website/files/download/SP&V2008.pdf, https://collaborate.princeton.edu/en/publications/when-program-notes-dont-help-music-descriptions-and-enjoyment/ ]
    luot_2_ghi_chu: 'Hai vế có bằng chứng trái chiều. (1) Đọc mô tả trước khi nghe: Margulis (2010, Psychology of Music 38) thấy mô tả bằng chữ trước đoạn nhạc làm giảm mức thích (mẫu nhỏ, người không học nhạc). (2) "Nghe lần ba hay hơn lần đầu": Schellenberg, Peretz & Vieillard (2008) thấy khi nghe tập trung, mức thích tăng sau 2 lần nghe rồi giảm sau 8 hoặc 32 lần (đường chữ U ngược); khi nghe không tập trung thì tăng tuyến tính theo số lần nghe. Không có nguồn nào xác nhận con số "lần thứ ba". Nên viết mềm: "nghe lặp lại thường giúp bạn thích hơn, nhưng đừng nghe quá nhiều lần liền".'
