nhan_dinh:
  - id: n1
    cau: Phần chính là lộ trình nghe khoảng 6 tháng, mỗi ngày 20 phút, chỉ dùng phần nhạc lý thật sự cần cho việc nghe.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Cách site xếp lộ trình. Không trái trang cũ Thói quen mỗi ngày (thêm 10 phút nghe chủ động hay một bài nhạc lý ngoài giờ ngồi đàn).
  - id: n2
    cau: Nhạc cổ điển được ghi lại bằng bản nhạc, nhưng mỗi người chơi diễn giải một khác.
    loai: dinh-nghia
    nguon: [ omt-notation ]
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Western Musical Notation: "No system of notation could capture every aspect of sound in full detail and still be useful or readable, so only some musical elements can be depicted" (phần không ghi được do người chơi quyết định).'
  - id: n3
    cau: Vì thế một tác phẩm có nhiều bản thu, và so sánh chúng là một phần niềm vui.
    loai: so-lieu
    nguon: [ imslp-b5 ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "một tác phẩm có hàng trăm bản thu". Không tìm được nguồn bậc 2 đếm số bản thu (Presto, Gramophone chặn truy cập; Wikipedia chỉ là nguồn bậc 3), nên bỏ con số. IMSLP, trang Giao hưởng số 5 của Beethoven: mục Recordings có nhiều bản thu trọn bản của các dàn nhạc khác nhau.'
  - id: n4
    cau: Một bản giao hưởng có thể dài 40 phút, chia thành các chương.
    loai: so-lieu
    nguon: [ imslp-brahms4, imslp-b5 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Giao hưởng số 4 của Brahms "Average Duration 40 minutes"; Giao hưởng số 5 của Beethoven "4 movements", "Average Duration 30 minutes".'
  - id: n5
    cau: Ý tưởng được giới thiệu, phát triển, biến đổi rồi quay lại.
    loai: dinh-nghia
    nguon: [ omt-sonata ]
    ket_qua: dung
    ghi_chu: 'OMT, Sonata Form: "The first reprise is called the exposition, and the second reprise contains the development and recapitulation"; "The recapitulation involves the restatement of material from the exposition". Câu của trang tả chung, ví dụ rõ nhất là hình thức sonata.'
  - id: n6
    cau: Hãy nghe từng chương một, tìm giai điệu chính và để ý khi nó trở lại.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp trang cũ Nghe nhạc, "Phương pháp 4 lần nghe": "Chọn một tác phẩm (hoặc một chương)", "Lần 2 — Tìm giai điệu chính", "Lần 3 — Theo dõi cấu trúc. Giai điệu chính quay lại khi nào?".'
  - id: n7
    cau: Dải âm lượng rất rộng, từ tiếng thì thầm của một cây violin đến tiếng gầm của cả dàn nhạc.
    loai: dinh-nghia
    nguon: [ omt-other ]
    ket_qua: dung
    ghi_chu: 'OMT, Dynamics: sắc thái đi từ pianissimo ("very quiet") đến fortissimo ("very loud"), có thể thêm nữa (pianississimo, fortississimo); Example 1 xếp tám mức "from quietest to loudest".'
  - id: n8
    cau: Đừng chỉnh âm lượng theo đoạn to nhất; hãy để đoạn nhỏ đủ nghe được.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên nghe; không trái trang lõi nào.
  - id: n9
    cau: 'Tai nghe hoặc loa tử tế giúp nhiều hơn bạn nghĩ: loa điện thoại làm mất gần hết âm trầm.'
    loai: so-lieu
    nguon: [ patent-harman ]
    ket_qua: dung
    ghi_chu: 'US10805754B2 (đo loa sau của một điện thoại): "smartphone speakers exhibit poor response in low-frequency regions"; "Although smartphone speakers have a limited frequency response, they can still render signals above approximately 600 Hz"; "the spectrum has uniform characteristics from about 700 Hz onwards". Câu nói chung về loa điện thoại, không nêu thiết bị cụ thể, nên không phải chi tiết mau cũ.'
  - id: n10
    cau: 'Nhạc cổ điển thường không có lời: âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ.'
    loai: dinh-nghia
    nguon: [ imslp-b5, imslp-brahms4, imslp-k331 ]
    ket_qua: dung
    ghi_chu: 'Các thể loại chính trang này cho nghe đều là nhạc không lời: giao hưởng (IMSLP xếp vào "Symphonies; For orchestra"), sonata cho piano, concerto, tứ tấu; nhạc có lời (opera, lied, requiem) có riêng ở tháng 5 và mục "Sau 6 tháng". "Thường" không có nghĩa là luôn luôn.'
  - id: n11
    cau: Đọc vài dòng về bối cảnh trước khi nghe cho bạn một điểm bám, và lần thứ ba nghe một tác phẩm thường hay hơn lần đầu.
    loai: quy-tac
    nguon: [ szpunar-2004 ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "lần thứ ba nghe một tác phẩm luôn hay hơn lần đầu". Szpunar và cộng sự 2004: nghe kỹ thì độ thích "followed an inverted U-shaped function of exposure for the most ecologically valid stimuli (initial increases followed by decreases)": mấy lần nghe đầu thường làm thích hơn, nhưng không phải luôn luôn, nên "luôn" thành "thường".'
  - id: n12
    cau: Thấy chán thường không phải do "không hợp", mà do chưa biết nghe cái gì; phương pháp 4 lần nghe giải quyết đúng chuyện này.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Khớp trang cũ Nghe nhạc, "Phương pháp 4 lần nghe" (mỗi lần nghe một việc cụ thể).
  - id: n13
    cau: Bản thu miễn phí trên mạng là đủ để bắt đầu; các dịch vụ chuyên nhạc cổ điển có ở Tài nguyên.
    loai: khuyen-tap
    nguon: [ d2-bang-tang, tai-nguyen-cu ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "YouTube là đủ để bắt đầu; …". Trang Lõi không giữ tên dịch vụ (chuan-kiem-dinh.md mục 3; d2-bang-tang.md mục 4: "Giữ câu trỏ sang Tài nguyên, bỏ tên YouTube"). Tài nguyên cũ, mục "Nghe nhạc trực tuyến", có dịch vụ chuyên nhạc cổ điển; trang ấy là Tham chiếu có hạn (D8-L1), link hiện "sắp có".'
  - id: n14
    cau: 'Tháng 1 nghe Vivaldi Mùa xuân, Mozart Eine kleine Nachtmusik, Haydn Surprise, và một tác phẩm piano: Mozart Sonata K. 331, chương 3 Alla turca.'
    loai: ten
    nguon: [ imslp-vivaldi, imslp-eine, imslp-haydn94, imslp-k331 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: RV 269 "La primavera (Spring) from Le quattro stagioni (The Four Seasons)"; "Eine kleine Nachtmusik, K.525"; Hob.I:94, tên khác "Surprise"; K.331, chương 3 "Rondo: Alla Turca (No.3)".'
  - id: n15
    cau: 'Nhạc lý tháng 1: bài 1 và bài 4, đủ để hiểu cao độ và nhịp.'
    loai: ten
    nguon: [ bai-nhac-ly-cu ]
    ket_qua: dung
    ghi_chu: 'Bài cũ 1 "Cao độ và tên nốt", bài 4 "Nhịp và số chỉ nhịp".'
  - id: n16
    cau: Mỗi ngày 5 phút nhận biết quãng ở bộ Khởi động.
    loai: so-lieu
    nguon: [ cong-cu-cu ]
    ket_qua: dung
    ghi_chu: 'Nhận định về site. luyen-tai/nghe-quang.md cũ: "Khởi động (3 trưởng, 5 đúng, 8 đúng)" là bộ đầu của công cụ nhận biết quãng. Trang và công cụ lên site ở đợt 3; link hiện "sắp có".'
  - id: n17
    cau: 'Nhạc lý tháng 2: bài 6, bài 7; hiểu vì sao giọng thứ nghe buồn.'
    loai: dinh-nghia
    nguon: [ omt-minor, bai-nhac-ly-cu ]
    ket_qua: dung
    ghi_chu: 'Bài cũ 6 "Gam trưởng", 7 "Gam thứ". OMT, Minor Scales: "Minor is often (but not always!) used to depict negative emotions, such as sadness, in Western music". Câu của trang là mục tiêu học (hiểu vì sao), không nói giọng thứ lúc nào cũng buồn.'
  - id: n18
    cau: 'Luyện tai hợp âm: phân biệt trưởng và thứ.'
    loai: so-lieu
    nguon: [ cong-cu-cu ]
    ket_qua: dung
