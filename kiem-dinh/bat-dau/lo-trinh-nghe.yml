doi_chu:
  - cu: Được ghi lại bằng bản nhạc, nhưng mỗi người chơi diễn giải một khác. Vì thế một tác phẩm có hàng trăm bản thu, và so sánh chúng là một phần niềm vui.
    moi: Được ghi lại bằng bản nhạc, nhưng mỗi người chơi diễn giải một khác. Vì thế một tác phẩm có nhiều bản thu, và so sánh chúng là một phần niềm vui.
    ly_do: 'n3 (da-sua): "hàng trăm bản thu" không có nguồn bậc 2 đếm số bản thu, viết "nhiều bản thu".'
  - cu: Thường không có lời. Âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ. Đọc vài dòng về bối cảnh trước khi nghe cho bạn một điểm bám, và lần thứ ba nghe một tác phẩm luôn hay hơn lần đầu.
    moi: Thường không có lời. Âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ. Đọc vài dòng về bối cảnh trước khi nghe cho bạn một điểm bám, và lần thứ ba nghe một tác phẩm thường hay hơn lần đầu.
    ly_do: 'n11 (da-sua): "luôn hay hơn" thành "thường hay hơn": độ thích theo số lần nghe theo đường chữ U ngược, không phải lúc nào cũng tăng (Szpunar 2004).'
  - cu: Thấy chán thường không phải do "không hợp", mà do chưa biết nghe cái gì; phương pháp 4 lần nghe giải quyết đúng chuyện này. YouTube là đủ để bắt đầu; các dịch vụ chuyên nhạc cổ điển có ở Tài nguyên.
    moi: Thấy chán thường không phải do "không hợp", mà do chưa biết nghe cái gì; phương pháp 4 lần nghe giải quyết đúng chuyện này. Bản thu miễn phí trên mạng là đủ để bắt đầu; các dịch vụ chuyên nhạc cổ điển có ở Tài nguyên.
