nhan_dinh:
  - id: n1
    cau: Phần chính là lộ trình nghe khoảng 6 tháng, mỗi ngày 20 phút, chỉ dùng phần nhạc lý thật sự cần cho việc nghe.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Cách site xếp lộ trình. Không trái trang cũ Thói quen mỗi ngày (thêm 10 phút nghe chủ động hay một bài nhạc lý ngoài giờ ngồi đàn).
    luot_2: dung
    luot_2_ghi_chu: "Kế hoạch nghe khoảng 6 tháng, 20 phút mỗi ngày, chỉ học phần nhạc lý cần cho việc nghe: hợp lý."
  - id: n2
    cau: Nhạc cổ điển được ghi lại bằng bản nhạc, nhưng mỗi người chơi diễn giải một khác.
    loai: dinh-nghia
    nguon: [ omt-notation ]
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Western Musical Notation: "No system of notation could capture every aspect of sound in full detail and still be useful or readable, so only some musical elements can be depicted" (phần không ghi được do người chơi quyết định).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/introduction-to-western-musical-notation/ ]
    luot_2_ghi_chu: 'OMT (Introduction to Western Musical Notation): "No system of notation could capture every aspect of sound in full detail and still be useful or readable, so only some musical elements can be depicted." Bản nhạc không ghi hết, người chơi quyết định phần còn lại, nên mỗi người diễn giải một khác.'
  - id: n3
    cau: Vì thế một tác phẩm có nhiều bản thu, và so sánh chúng là một phần niềm vui.
    loai: so-lieu
    nguon: [ imslp-b5 ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "một tác phẩm có hàng trăm bản thu". Không tìm được nguồn bậc 2 đếm số bản thu (Presto, Gramophone chặn truy cập; Wikipedia chỉ là nguồn bậc 3), nên bỏ con số. IMSLP, trang Giao hưởng số 5 của Beethoven: mục Recordings có nhiều bản thu trọn bản của các dàn nhạc khác nhau.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: IMSLP liệt kê 48 bản thu tự do cho Giao hưởng số 5 của Beethoven ("Recordings (48)"), nên "một tác phẩm có nhiều bản thu" đúng. "So sánh là một phần niềm vui" là nhận định chủ quan, không có số liệu để kiểm.
  - id: n4
    cau: Một bản giao hưởng có thể dài 40 phút, chia thành các chương.
    loai: so-lieu
    nguon: [ imslp-brahms4, imslp-b5 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Giao hưởng số 4 của Brahms "Average Duration 40 minutes"; Giao hưởng số 5 của Beethoven "4 movements", "Average Duration 30 minutes".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)", "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)" ]
    luot_2_ghi_chu: "IMSLP: Brahms Giao hưởng số 4 Op. 98 có 4 chương, thời lượng trung bình 40 phút; Shostakovich Giao hưởng số 5 Op. 47 có 4 chương, trung bình 45 phút."
  - id: n5
    cau: Ý tưởng được giới thiệu, phát triển, biến đổi rồi quay lại.
    loai: dinh-nghia
    nguon: [ omt-sonata ]
    ket_qua: dung
    ghi_chu: 'OMT, Sonata Form: "The first reprise is called the exposition, and the second reprise contains the development and recapitulation"; "The recapitulation involves the restatement of material from the exposition". Câu của trang tả chung, ví dụ rõ nhất là hình thức sonata.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/, https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/ ]
    luot_2_ghi_chu: 'OMT: hình thức sonata có exposition (trình bày chủ đề), development (phát triển, thường không ổn định) và recapitulation (nhắc lại chủ đề của exposition); hình thức ba đoạn ABA có "a return to the material from the opening section". Câu viết đúng ở mức khái quát.'
  - id: n6
    cau: Hãy nghe từng chương một, tìm giai điệu chính và để ý khi nó trở lại.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp trang cũ Nghe nhạc, "Phương pháp 4 lần nghe": "Chọn một tác phẩm (hoặc một chương)", "Lần 2 — Tìm giai điệu chính", "Lần 3 — Theo dõi cấu trúc. Giai điệu chính quay lại khi nào?".'
    luot_2: dung
    luot_2_ghi_chu: Nghe từng chương, tìm giai điệu chính và để ý khi nó trở lại là cách nghe chủ động chuẩn.
  - id: n7
    cau: Dải âm lượng rất rộng, từ tiếng thì thầm của một cây violin đến tiếng gầm của cả dàn nhạc.
    loai: dinh-nghia
    nguon: [ omt-other ]
    ket_qua: dung
    ghi_chu: 'OMT, Dynamics: sắc thái đi từ pianissimo ("very quiet") đến fortissimo ("very loud"), có thể thêm nữa (pianississimo, fortississimo); Example 1 xếp tám mức "from quietest to loudest".'
    luot_2: dung
    luot_2_nguon: [ http://hyperphysics.phy-astr.gsu.edu/hbase/Sound/dba2.html ]
    luot_2_ghi_chu: "HyperPhysics (Georgia State University, theo Backus): ppp khoảng 40 dB, p 60 dB, f 80 dB, fff 100 dB (tại C6), tức dải danh nghĩa khoảng 60 dB; đo ở buổi hòa nhạc dàn nhạc: Magic Flute 56–84 dBA, William Tell Overture 76–89 dBA. Dải âm lượng của nhạc dàn nhạc thực sự rộng."
  - id: n8
    cau: Đừng chỉnh âm lượng theo đoạn to nhất; hãy để đoạn nhỏ đủ nghe được, nhưng đừng mở quá to khi nghe lâu, nhất là với tai nghe.
    loai: khuyen-tap
    nguon:
      - who-nghe-an-toan
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): thêm lời dặn về an toàn thính giác theo ghi chú của lượt 2. Câu trước: "Đừng chỉnh âm lượng theo đoạn to nhất; hãy để đoạn nhỏ đủ nghe được." WHO (Safe listening): "with regular exposure to loud or prolonged noise, the sensory cells and other structures can become permanently damaged"; khuyên để âm lượng thiết bị không quá 60% mức tối đa. Lượt 1: Lời khuyên nghe; không trái trang lõi nào.'
    luot_2: dung
    luot_2_nguon: [ http://hyperphysics.phy-astr.gsu.edu/hbase/Sound/dba2.html ]
    luot_2_ghi_chu: "Lời khuyên đúng với cách nghe nhạc cổ điển, nhưng nên thêm lưu ý an toàn thính giác: HyperPhysics ghi mức fff khoảng 100 dB và ngưỡng đau 120 dB, nên đừng nâng âm lượng quá cao để nghe rõ đoạn nhỏ trong thời gian dài, nhất là khi dùng tai nghe."
  - id: n9
    cau: 'Tai nghe hoặc loa tử tế giúp nhiều hơn bạn nghĩ: loa điện thoại làm mất gần hết âm trầm.'
    loai: so-lieu
    nguon: [ patent-harman ]
    ket_qua: dung
    ghi_chu: 'US10805754B2 (đo loa sau của một điện thoại): "smartphone speakers exhibit poor response in low-frequency regions"; "Although smartphone speakers have a limited frequency response, they can still render signals above approximately 600 Hz"; "the spectrum has uniform characteristics from about 700 Hz onwards". Câu nói chung về loa điện thoại, không nêu thiết bị cụ thể, nên không phải chi tiết mau cũ.'
    luot_2: dung
    luot_2_nguon: [ https://cdn.eicom.ru/media/PDF/3468456.pdf ]
