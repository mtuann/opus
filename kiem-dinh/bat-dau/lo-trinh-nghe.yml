doi_chu:
  - cu: Được ghi lại bằng bản nhạc, nhưng mỗi người chơi diễn giải một khác. Vì thế một tác phẩm có hàng trăm bản thu, và so sánh chúng là một phần niềm vui.
    moi: Được ghi lại bằng bản nhạc, nhưng mỗi người chơi diễn giải một khác. Vì thế một tác phẩm có nhiều bản thu, và so sánh chúng là một phần niềm vui.
    ly_do: 'n3 (da-sua): "hàng trăm bản thu" không có nguồn bậc 2 đếm số bản thu, viết "nhiều bản thu".'
  - cu: Thường không có lời. Âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ. Đọc vài dòng về bối cảnh trước khi nghe cho bạn một điểm bám, và lần thứ ba nghe một tác phẩm luôn hay hơn lần đầu.
    moi: "Nhiều tác phẩm không có lời. Giao hưởng, sonata, tứ tấu là khí nhạc: âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ. Đọc vài dòng về bối cảnh trước hay sau khi nghe, tùy bạn thấy cách nào dễ vào hơn; và nghe lại một tác phẩm vài lần, vì lần sau thường dễ nghe hơn lần đầu, nhưng đừng nghe một bài quá nhiều lần liền."
    ly_do: 'n11 (da-sua): "luôn hay hơn" thành "thường hay hơn": độ thích theo số lần nghe theo đường chữ U ngược, không phải lúc nào cũng tăng (Szpunar 2004). Review (24/10/2026), n10, n11: nhạc có lời là một phần lớn của nhạc cổ điển, nên chỉ nói các thể loại khí nhạc; bỏ con số "lần thứ ba" và lời khuyên đọc trước (Margulis 2010; Schellenberg và cộng sự 2008), viết thành lời khuyên.'
