    moi: NHS (Anh), Repetitive strain injury (RSI).
    ly_do: "n62 (da-sua): Thêm vào mục Nguồn (cũ chưa có): nguồn bậc 2 cho dấu hiệu đau, tê, yếu và hướng dẫn đi khám (n10, n35–n37).; n64 (da-bo): Mục Nguồn: bỏ sách in chưa mở được nội dung (chuẩn mục 2: sách in chỉ là nguồn phụ); không câu nào của trang còn dựa riêng vào sách này.; n65 (da-bo): Mục Nguồn: bỏ sách in chưa mở được nội dung; không câu nào của trang còn dựa riêng vào sách này."
  - cu: "mô tả: Chơi piano là một hoạt động thể chất: một bài vài phút có thể cần hàng nghìn chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm. Phần lớn những cơn đau thường…"
    moi: "mô tả: Chơi piano là một hoạt động thể chất: một bài vài phút gồm rất nhiều chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm. Nhiều cơn đau thường…"
    ly_do: 'n1: mô tả đổi theo câu mở đầu, bỏ "hàng nghìn chuyển động" và "phần lớn" không có nguồn.'
  - cu: "id: ngu-van-ong-giu-am"
    moi: "id: ngu-van-dong-giu-am"
    ly_do: 'n34 (da-sua): BAPAM Healthy Pianist, Health and Posture: tập thể lực nhịp điệu đều (aerobic: bơi, đi bộ, chạy); tránh môn tạ nặng và nắm chặt. Cũ: "Ngủ đủ" (cơ thể hồi phục, củng cố kỹ năng) và "bài tập cho lưng và vai giúp ngồi lâu không gù": bỏ vì không có nguồn BAPAM/NHS cho lợi ích đó. Tiêu đề đổi thành "Vận động và giữ ấm" kèm neo cũ { #ngu-van-dong-giu-am }.'
  - cu: "câu hỏi: Đâu là tín hiệu cần dừng tập? | Cẳng tay hơi mỏi đều sau một buổi dài, nghỉ vài phút thì hết | ✓ Đau ở một điểm ở cổ tay, vẫn còn sau khi đã nghỉ | Thấy chán và muốn nghỉ | Mỏi đều và hết nhanh là bình thường; đau khu trú, kéo dài hoặc lặp lại ở cùng chỗ là tín hiệu cảnh báo."
    moi: "câu hỏi: Đâu là tín hiệu cần dừng tập? | Cẳng tay hơi mỏi đều sau một buổi dài, giảm đi khi nghỉ | ✓ Đau ở một điểm ở cổ tay, vẫn còn sau khi đã nghỉ | Thấy chán và muốn nghỉ | Mỏi và căng là lúc xem lại cách tập; đau khu trú, kéo dài hoặc lặp lại ở cùng chỗ là tín hiệu cần dừng."
    ly_do: 'n10 (da-sua): Cũ: tiêu đề "Mỏi bình thường | Tín hiệu cần dừng", có "Hết sau khi nghỉ vài phút đến vài giờ" (mốc thời gian không có nguồn). Sửa: bỏ chữ "bình thường" (BAPAM không gọi mỏi là bình thường, chỉ nói xem lại cách tập), bỏ mốc "vài phút đến vài giờ". Tê, kim châm, yếu là dấu hiệu BAPAM Warning Signs và NHS RSI liệt kê (đau, nhói, tê, kim châm, yếu, vụng về).; n52 (da-sua): Khớp n9–n10 (BAPAM). Cũ: "Mỏi đều và hết nhanh là bình thường" và "nghỉ vài phút thì hết" (không nguồn). Đáp án đúng giữ ở vị trí 2.'
  - cu: "câu hỏi: Tay bạn nhỏ, bài có nhiều quãng tám. Nên làm gì? | Giữ bàn tay mở căng suốt đoạn cho khỏi trượt | ✓ Khép tay lại giữa các quãng tám, di chuyển bằng cả cánh tay, và chọn bài khác nếu vẫn căng | Tập đoạn đó thêm vài giờ mỗi ngày cho tay giãn ra | Bàn tay mở căng hết cỡ và lặp lại nhiều lần là nguồn gốc của nhiều cơn đau."
    moi: "câu hỏi: Tay bạn nhỏ, bài có nhiều quãng tám. Nên làm gì? | Giữ bàn tay mở căng suốt đoạn cho khỏi trượt | ✓ Khép tay lại giữa các quãng tám, di chuyển bằng cả cánh tay, và chọn bài khác nếu vẫn căng | Tập đoạn đó thêm vài giờ mỗi ngày cho tay giãn ra | Bàn tay mở căng hết cỡ và lặp lại nhiều lần là một yếu tố nguy cơ gây quá tải."
    ly_do: 'n54 (da-sua): Khớp n14 và n30–n31 (Sakai: quãng tám và hợp âm là kỹ thuật bắt đầu triệu chứng thường gặp). Cũ: "là nguồn gốc của nhiều cơn đau" (quá mạnh); đổi "một yếu tố nguy cơ gây quá tải".'
