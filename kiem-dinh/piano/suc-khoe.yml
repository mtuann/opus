  - id: n51
    cau: "Danh sách kiểm tra hằng tuần: không tăng thời lượng quá nhiều so với tuần trước; nghỉ 10 phút sau mỗi 20 phút tập; chia đoạn nặng thành nhiều lần ngắn; quay video tay mình và đối chiếu với tư thế; không có cơn đau, tê hay yếu kéo dài."
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Dòng nghỉ sửa theo BAPAM 20/10, khớp n13 và n24. Cũ: "Buổi nào cũng có nghỉ 5 phút sau mỗi 25–30 phút". Các dòng còn lại khớp n25, n26, tu-the.md và n36. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016) ghi nguyên văn: "Practise in twenty minute sessions, interspersed with ten minute breaks, to allow the hands time to recover between sessions." Giữ mốc 20/10. Trang BAPAM "Returning to Playing" (nghỉ 3–5 phút sau mỗi 20–25 phút) dành cho người quay lại sau thời gian nghỉ hay hồi phục, nên không áp dụng ở đây. Nguồn BAPAM đổi link sang trang chính thức.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: Không mở được tờ The Healthy Pianist của BAPAM (PDF bị chặn robots). Trang BAPAM return-to-play (bối cảnh quay lại chơi sau nghỉ) ghi "Take a 3-5 minute break from playing every 20-25 minutes", không phải 20/10.
  - id: n52
    cau: "Câu hỏi 1: đau ở một điểm ở cổ tay, vẫn còn sau khi đã nghỉ, là tín hiệu cần dừng tập; cẳng tay hơi mỏi đều sau buổi dài, giảm đi khi nghỉ, chưa phải; lời giải thích: mỏi và căng là lúc xem lại cách tập, đau khu trú, kéo dài hoặc lặp lại là tín hiệu cần dừng."
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Khớp n9–n10 (BAPAM). Cũ: "Mỏi đều và hết nhanh là bình thường" và "nghỉ vài phút thì hết" (không nguồn). Đáp án đúng giữ ở vị trí 2.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/", "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: Phân biệt mỏi bình thường với đau khu trú kéo dài phù hợp NHS và BAPAM.
  - id: n53
    cau: "Câu hỏi 2: còn một tuần nữa là thi thì giữ thời lượng gần như cũ, nghỉ đều, tập chậm và tập trong đầu; không nhân đôi thời gian tập, không tập liền ba tiếng không nghỉ; tăng tải đột ngột là yếu tố nguy cơ, tuần cuối là lúc giữ sức."
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: dung
    ghi_chu: 'Khớp n25 (BAPAM: tránh tăng đột ngột thời lượng tập) và n13. Giữ nguyên tùy chọn "Tập liền ba tiếng không nghỉ" như moi-ngay.yml/lo-trinh yêu cầu (lô trước). Đáp án đúng ở vị trí 2 (nhóm kiểm tra không dựa vào vị trí). Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "Avoid sudden increase in practice time … before a performance or exam." Lượt 2 dẫn Bragge (yếu tố nguy cơ chưa thống nhất); câu trên trang nói "một yếu tố nguy cơ" theo BAPAM, và đoạn Yếu tố nguy cơ đã ghi Bragge chưa thống nhất. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Nguyên tắc giữ sức hợp lý, nhưng "tăng tải đột ngột là yếu tố nguy cơ" chưa được chứng minh chắc (Bragge 2006: các nghiên cứu không thống nhất).'
  - id: n54
    cau: "Câu hỏi 3: tay nhỏ, bài nhiều quãng tám: khép tay lại giữa các quãng tám, di chuyển bằng cả cánh tay, chọn bài khác nếu vẫn căng; lời giải thích: bàn tay mở căng hết cỡ và lặp lại nhiều lần là một yếu tố nguy cơ gây quá tải."
    loai: quy-tac
    nguon:
      - sakai
      - pask-epi
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Khớp n14 và n30–n31 (Sakai: quãng tám và hợp âm là kỹ thuật bắt đầu triệu chứng thường gặp). Cũ: "là nguồn gốc của nhiều cơn đau" (quá mạnh); đổi "một yếu tố nguy cơ gây quá tải".'
    luot_2: dung
    luot_2_nguon: [ "https://paskpiano.org/principles-of-ergonomics-and-biomechanics/", "https://paskpiano.org/stretching-exercises-benefits-limitations-and-dangers/" ]
    luot_2_ghi_chu: "PASK: hợp âm lớn, quãng tám lặp lại ép tay nhỏ ra khỏi tư thế trung tính; mở hết cỡ là yếu tố nguy cơ."
  - id: n55
    cau: "Câu hỏi 4: một ngón tự co lại mỗi khi chơi một đoạn chạy nốt, không đau, mọi việc khác bình thường: gặp bác sĩ thần kinh, tốt nhất là người có kinh nghiệm về rối loạn vận động; lời giải thích: đây có thể là loạn trương lực cơ khu trú, một rối loạn thần kinh hiếm gặp cần chuyên gia đánh giá."
    loai: quy-tac
    nguon:
      - bapam-fd
    ket_qua: dung
    ghi_chu: 'Khớp n38, n40, n41, n44. Đã kiểm lựa chọn sai: "tập thêm" trái với BAPAM (tập thêm làm nặng hơn); "uống thuốc giảm đau rồi tập tiếp" trái với "dừng khi đau" (n8).'
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/musicians-focal-dystonia/" ]
    luot_2_ghi_chu: 'BAPAM: thường không đau, cần gặp bác sĩ thần kinh có quan tâm rối loạn vận động; "một ngón co quắp ở đoạn chạy" phù hợp mô tả loạn trương lực.'
