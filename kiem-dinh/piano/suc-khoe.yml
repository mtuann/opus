nguon:
  - id: bapam-hp
    bac: 2
    ten: BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano; Penelope Roskell và Hara Trouli, BAPAM 2016), trang trên bapam.org.uk
    link: https://www.bapam.org.uk/the-healthy-pianist/
  - id: bapam-fd
    bac: 2
    ten: BAPAM, Musicians' Focal Dystonia (trang thông tin; tỷ lệ 1–2%, thường không đau lúc đầu, tập thêm làm nặng thêm)
    link: https://www.bapam.org.uk/musicians-focal-dystonia/
  - id: bapam-rtp
    bac: 2
    ten: "BAPAM, Returning to Playing (quay lại chơi: chậm, đơn giản, nhỏ tiếng)"
    link: https://www.bapam.org.uk/return-to-play/
  - id: bapam
    bac: 2
    ten: BAPAM, trang chủ (tổ chức từ thiện y tế cho người làm nghề biểu diễn ở Anh; dịch vụ tư vấn miễn phí)
    link: https://www.bapam.org.uk/
  - id: pama
    bac: 2
    ten: PAMA, Performing Arts Medicine Association (trang chủ; giới thiệu hội và danh bạ người cung cấp dịch vụ)
    link: https://artsmed.org/
  - id: pask-sizes
    bac: 2
    ten: PASK, How many sizes? (quãng tám 6,5 in / 16,5 cm; bàn phím DS5.5, DS6.0; số nguồn bán, giá, thời gian chờ)
    link: https://paskpiano.org/how-many-sizes/
  - id: pask-about
    bac: 2
    ten: PASK, What is PASK? (Pianists for Alternatively Sized Keyboards)
    link: https://paskpiano.org/about/
  - id: pask-spans
    bac: 2
    ten: PASK, Pianists' hand spans vary greatly (độ dang tay người lớn chênh tới khoảng 5 in; nam hơn nữ khoảng 1 in)
    link: https://paskpiano.org/pianists-hand-spans-vary-greatly/
  - id: pask-epi
    bac: 2
    ten: PASK, Epidemiological and clinical studies (tóm tắt các nghiên cứu, gồm Sakai 2002)
    link: https://paskpiano.org/epidemiological-and-clinical-studies/
  - id: bragge
    bac: 2
    ten: P. Bragge, A. Bialocerkowski, J. McMeeken, "A systematic review of prevalence and risk factors associated with playing-related musculoskeletal disorders in pianists", Occupational Medicine 56(1), 2006, tr. 28–38 (bản ghi Crossref/OpenAlex, có tóm tắt)
    link: https://api.crossref.org/works?query.bibliographic=Bragge+systematic+review+prevalence+risk+factors+playing-related+musculoskeletal+disorders+pianists
  - id: sakai
    bac: 2
    ten: 'N. Sakai, "Hand pain attributed to overuse among professional pianists: a study of 200 cases", Medical Problems of Performing Artists 17(4), 2002, tr. 178–180 (số liệu qua tóm tắt của PASK Epidemiological and clinical studies)'
    link: https://paskpiano.org/epidemiological-and-clinical-studies/
  - id: altenmuller
    bac: 2
    ten: 'E. Altenmüller, H.-C. Jabusch, "Focal dystonia in musicians: phenomenology, pathophysiology, triggering factors, and treatment", Medical Problems of Performing Artists 25(1), 2010, tr. 3–9 (bản ghi Crossref; chưa mở toàn văn)'
    link: https://api.crossref.org/works?query.bibliographic=Altenm%C3%BCller+Jabusch+Focal+dystonia+in+musicians+phenomenology+pathophysiology+triggering+factors+and+treatment
  - id: nhs-rsi
    bac: 2
    ten: NHS (Anh), Repetitive strain injury (RSI)
    link: https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/
  - id: pask-makers
    bac: 2
    ten: PASK, Manufacturers (danh sách nơi làm bàn phím hẹp; mở ngày 28/10/2026)
    link: https://paskpiano.org/manufacturers/
nhan_dinh:
  - id: n1
    cau: "Chơi piano là một hoạt động thể chất: một bài vài phút gồm rất nhiều chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm."
    loai: dinh-nghia
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "một bài vài phút có thể cần hàng nghìn chuyển động nhỏ". Con số "hàng nghìn" không có nguồn; đổi sang "rất nhiều" (mô tả định tính, đúng với BAPAM The Healthy Pianist: chơi piano là hoạt động lặp lại đòi hỏi thể lực). Sửa cả description.'
    luot_2: dung
    luot_2_nguon: [ "https://academic.oup.com/occmed/article/56/1/28/1380209" ]
    luot_2_ghi_chu: Bragge 2006 nhắc rối loạn cơ xương ở người chơi piano; mô tả chung hợp lý.
  - id: n2
    cau: Nhiều cơn đau thường gặp ở người chơi đàn liên quan đến quá tải và căng cơ, tức là những thứ bạn có thể điều chỉnh.
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Phần lớn những cơn đau thường gặp…" ("phần lớn" không có nguồn; Bragge 2006 ghi nhận chưa có đồng thuận về yếu tố nguy cơ). Đổi "Nhiều". Nhận định sức khỏe nên viết thận trọng: BAPAM nêu quá tải, tư thế, căng cơ là những điều tay có thể điều chỉnh (Healthy Pianist, Practising, General Technical Principles). Nhận định sức khỏe, dựa vào nguồn BAPAM.'
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.21091/mppa.2002.4028", "https://academic.oup.com/occmed/article/56/1/28/1380209" ]
    luot_2_ghi_chu: 'Sakai 2002: đau tay do "overuse" ở người chơi piano; Bragge 2006 xem xét các yếu tố nguy cơ.'
  - id: n3
    cau: Trang giúp nhận ra yếu tố nguy cơ, xây thói quen bảo vệ đôi tay, và biết khi nào phải dừng lại để đi khám.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: "Yếu tố nguy cơ", "Phòng ngừa: những thói quen nhỏ", "Dấu hiệu cảnh báo", "Đi khám ở đâu, nói gì". Review D4-gom: trang có các mục "Yếu tố nguy cơ", "Phòng ngừa: những thói quen nhỏ", "Dấu hiệu cảnh báo", "Đi khám ở đâu, nói gì".'
    review: dung
  - id: n4
    cau: "Hộp lưu ý: trang là thông tin chung để phòng ngừa, không thay thế việc khám và điều trị; đang đau, tê hoặc yếu tay thì gặp bác sĩ, đừng tự chẩn đoán dựa trên trang."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Mô tả phạm vi của trang (lời rào đón). Giữ nguyên. Review D4-gom: hộp :::caution[Trang này không phải lời khuyên y tế] có đúng ý ấy."
    review: dung
  - id: n5
    cau: Giới y khoa gọi chung các vấn đề này là rối loạn cơ xương liên quan đến chơi nhạc (playing-related musculoskeletal disorders).
    loai: ten
    nguon:
      - bragge
    ket_qua: dung
    ghi_chu: 'Đúng với tên trong tựa bài Bragge 2006: "playing-related musculoskeletal disorders in pianists". Thuật ngữ chưa có bản ghi thuat-ngu.yml (ghi cho D3-L5).'
    luot_2: dung
    luot_2_nguon: [ "https://academic.oup.com/occmed/article/56/1/28/1380209" ]
    luot_2_ghi_chu: Tựa bài Bragge dùng đúng "playing-related musculoskeletal disorders in pianists".
  - id: n6
    cau: Một tổng quan hệ thống về người chơi piano (Bragge và cộng sự, 2006) ghi nhận tỷ lệ mắc trong các nghiên cứu dao động rất rộng, từ 26% đến 93%.
    loai: so-lieu
    nguon:
      - bragge
    ket_qua: da-sua
    ghi_chu: 'Tóm tắt Bragge 2006 (OpenAlex): tỷ lệ mắc dao động 26–93% giữa các nghiên cứu; chưa có đồng thuận về yếu tố nguy cơ. Đã bỏ vế cũ "một phần vì mỗi nghiên cứu định nghĩa và đo lường khác nhau" vì tóm tắt tôi mở được không nói rõ lý do.'
    luot_2: dung
    luot_2_nguon: [ "https://academic.oup.com/occmed/article/56/1/28/1380209" ]
    luot_2_ghi_chu: "Bragge, Bialocerkowski, McMeeken 2006: tỷ lệ báo cáo 26-93%."
  - id: n7
    cau: "Con số chính xác khó biết, nhưng kết luận thì rõ: nhiều người chơi piano từng đau vì chơi đàn."
    loai: so-lieu
    nguon:
      - bragge
    ket_qua: da-sua
    ghi_chu: 'Cũ: "rất nhiều người". Đổi "nhiều" cho khớp biên độ 26–93% (không khẳng định đa số).'
    luot_2: dung
    luot_2_nguon: [ "https://academic.oup.com/occmed/article/56/1/28/1380209", "https://paskpiano.org/pain-injury-and-ergonomics/" ]
    luot_2_ghi_chu: "Bragge: tỷ lệ rất rộng; PASK: có nghiên cứu cho 70-80% nữ chơi piano bị đau hoặc chấn thương liên quan đến chơi đàn."
  - id: n8
    cau: Đau là tín hiệu, không phải bằng chứng của sự chăm chỉ; câu "không đau thì không tiến bộ" không áp dụng cho đôi tay của người chơi đàn.
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: dung
    ghi_chu: 'Khớp BAPAM The Healthy Pianist (Practising): "If you experience pain, stop immediately." Nhận định sức khỏe nên dẫn nguồn, không xếp khuyen-tap.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/return-to-play/", "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/" ]
    luot_2_ghi_chu: 'BAPAM return-to-play: "Do not play with discomfort"; NHS: đi khám khi triệu chứng không hết.'
  - id: n9
    cau: BAPAM coi mỏi và căng là dấu hiệu để xem lại kỹ thuật, cách tập và chương trình tập; còn đau thì dừng ngay.
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Thêm câu dẫn vào bảng. BAPAM The Healthy Pianist: nếu thấy mỏi hay căng thì xem lại kỹ thuật, cách tập, chương trình tập; "If you experience pain, stop immediately." Câu cũ không có câu dẫn mà đặt "mỏi bình thường" đối lập "tín hiệu cần dừng". Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016), mục Warning Signs: "If you do start to experience tension or fatigue, consider these as warning signs that you may need to reassess your technique, your practise methods, or to change your programme."; "If you experience pain, stop immediately". Lượt 2 không mở được tờ PDF. Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: Phần "đau thì dừng" đúng (BAPAM), nhưng không kiểm được việc BAPAM coi mỏi, căng là dấu hiệu xem lại kỹ thuật và chương trình tập (tờ Healthy Pianist không mở được).
  - id: n10
    cau: 'Bảng "Mỏi, căng: xem lại cách tập" và "Đau và dấu hiệu bất thường: dừng": mỏi đều ở cẳng tay hoặc vai sau buổi tập dài, giảm khi nghỉ, không gắn với động tác cụ thể, cảm giác bình thường; ngược lại, đau ở một điểm, đau không hết hoặc nặng dần, đau nhói ở một động tác, tê, kim châm, yếu tay, vụng về.'
    loai: quy-tac
    nguon:
      - bapam-hp
      - nhs-rsi
    ket_qua: da-sua
    ghi_chu: 'Cũ: tiêu đề "Mỏi bình thường | Tín hiệu cần dừng", có "Hết sau khi nghỉ vài phút đến vài giờ" (mốc thời gian không có nguồn). Sửa: bỏ chữ "bình thường" (BAPAM không gọi mỏi là bình thường, chỉ nói xem lại cách tập), bỏ mốc "vài phút đến vài giờ". Tê, kim châm, yếu là dấu hiệu BAPAM Warning Signs và NHS RSI liệt kê (đau, nhói, tê, kim châm, yếu, vụng về).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/" ]
    luot_2_ghi_chu: "NHS RSI: triệu chứng gồm đau (nóng, nhức, giật), cứng, yếu, tê/kim châm, sưng; cần đi khám nếu không hết hoặc nặng dần. Phần mỏi bình thường sau buổi dài là phân biệt hợp lý của site."
  - id: n11
    cau: Các nghiên cứu chưa thống nhất yếu tố nào quan trọng nhất (chính tổng quan của Bragge cũng ghi nhận điều đó), nhưng dưới đây là những yếu tố mà tài liệu về sức khỏe nhạc công (như BAPAM) nhắc tới.
    loai: quy-tac
    nguon:
      - bragge
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Cũ: "những yếu tố dưới đây được giáo viên, bác sĩ và tài liệu về sức khỏe nhạc công nhắc đến nhiều nhất" ("nhiều nhất", "giáo viên, bác sĩ" không có nguồn). Bragge 2006: chưa có đồng thuận về yếu tố nguy cơ. Viết lại thận trọng, chỉ nói BAPAM nhắc tới. Nhận định sức khỏe, dẫn nguồn BAPAM và Bragge.'
    luot_2: dung
    luot_2_nguon: [ "https://academic.oup.com/occmed/article/56/1/28/1380209", "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: "Bragge: các nghiên cứu không thống nhất yếu tố nguy cơ (chỉ 4 nghiên cứu có yếu tố có ý nghĩa thống kê); tài liệu BAPAM có nhắc các yếu tố liên quan."
  - id: n12
    cau: 'Hàng "Tăng thời lượng tập đột ngột": tay cần thời gian để thích nghi với tải mới; cách giảm: tăng dần qua nhiều tuần, học bài mới đủ sớm trước hạn.'
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'BAPAM Practising: tăng thời lượng tập dần, tránh tăng đột ngột. Cũ: "Cơ và gân cần thời gian…" (cơ chế giải phẫu không có nguồn) và "Tăng dần qua nhiều tuần" kèm số ở phần dưới. Đổi cơ chế thành "tay cần thời gian để thích nghi". Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016), mục Practising: "Avoid sudden increase in practice time by learning new pieces sufficiently well in advance", "Pace your practice, both on a daily basis and over longer periods." Vế "tay cần thời gian để thích nghi" là cách nói của ý "pace your practice". Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/", "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: 'NHS và BAPAM khuyên tăng dần hoạt động khi quay lại, nhưng "tăng đột ngột thời lượng tập" là yếu tố nguy cơ chưa được chứng minh chắc (Bragge: các nghiên cứu không thống nhất).'
  - id: n13
    cau: 'Hàng "Buổi tập dài không nghỉ": tay cần thời gian hồi phục giữa các lượt tập; tập khoảng 20 phút rồi nghỉ 10 phút, chia thành nhiều lượt ngắn.'
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'BAPAM Healthy Pianist (Practising): "Practise in twenty minute sessions, interspersed with ten minute breaks". Câu cũ "Nghỉ 5 phút sau mỗi 25–30 phút" không có nguồn nào; sửa theo BAPAM, khớp tu-the.md và cach-tap.md (lượt này). Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016) ghi nguyên văn: "Practise in twenty minute sessions, interspersed with ten minute breaks, to allow the hands time to recover between sessions." Giữ mốc 20/10. Trang BAPAM "Returning to Playing" (nghỉ 3–5 phút sau mỗi 20–25 phút) dành cho người quay lại sau thời gian nghỉ hay hồi phục, nên không áp dụng ở đây. Nguồn BAPAM đổi link sang trang chính thức.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: Không mở được tờ The Healthy Pianist của BAPAM (PDF bị chặn robots). Trang BAPAM return-to-play (bối cảnh quay lại chơi sau nghỉ) ghi "Take a 3-5 minute break from playing every 20-25 minutes", không phải 20/10.
  - id: n14
    cau: 'Hàng "Quãng tám, hợp âm rộng khi tay nhỏ": bàn tay mở căng hết cỡ, lặp lại nhiều lần; xem phần "Bàn tay nhỏ" bên dưới.'
    loai: quy-tac
    nguon:
      - bapam-hp
      - sakai
      - pask-epi
    ket_qua: dung
    ghi_chu: 'Khớp số liệu Sakai ở n31 (70/200 bắt đầu khi tập một kỹ thuật; quãng tám 30, hợp âm 22). Câu chỉ nối sang phần dưới. Review D4-gom: soát nhãn: hàng này nói bàn tay mở căng hết cỡ, lặp lại nhiều lần là yếu tố nguy cơ (sức khỏe), nên đổi khuyen-tap thành quy-tac. trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "Pianists with smaller hands need to be careful not to overstrain"; "avoid any technique involving repetition at the stretch for more than short periods of time"; "practise minimising tension between repetitive octaves or large chords". Sakai 2002 qua PASK: quãng tám và hợp âm là hai kỹ thuật gặp nhiều nhất lúc khởi phát. Giữ kết quả lượt 2 (lượt 2 đã dẫn PASK, Principles of ergonomics: quãng tám, hợp âm lớn ép bàn tay nhỏ ra khỏi tư thế trung tính), đủ cho nhận định cần nguồn.'
    luot_2: dung
