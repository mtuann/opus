ghi_chu: "Lượt 1 trang Giữ đôi tay khỏe (lô D4-L3, phần A). Nguồn đã mở: BAPAM The Healthy Pianist (PDF), Musicians' Focal Dystonia, Returning to Playing, trang chủ BAPAM; PASK (How many sizes?, What is PASK?, hand spans, Epidemiological and clinical studies); trang chủ PAMA; NHS RSI; Crossref/OpenAlex (Bragge 2006, Altenmüller và Jabusch 2010). Toàn văn Bragge, Sakai, Altenmüller không mở được (PubMed bị reCAPTCHA, tạp chí chặn): xem n6, n30, n40. Không còn nhận định sức khỏe nào xếp khuyen-tap; các chỗ không có nguồn tầng 1–2 đã bỏ hoặc nới (da-bo: n19, n20, n43, n63–n65). Điều lô trước yêu cầu giữ: mục \"Đau vì chơi đàn: phổ biến, nhưng không bình thường\" và bảng cảnh báo (moi-ngay.yml, lo-trinh.yml): KHỚP về cấu trúc; LỆCH ở hàng đầu bảng cảnh báo: moi-ngay.yml trích \"Dừng buổi tập, nghỉ chơi đàn vài ngày\" nay là \"Dừng buổi tập và cho tay nghỉ\" (n35), vì mốc \"vài ngày\" không có nguồn; lựa chọn \"Tập liền ba tiếng không nghỉ\" ở câu hỏi 2: KHỚP (n53). Câu ve-site trỏ trang chưa chuyển (đã kiểm ../opus-zero/docs/): piano/chon-dan (n16), piano/tac-pham-theo-cap (n31), tai-lieu-tham-khao (n66). Thuật ngữ chưa có bản ghi thuat-ngu.yml: rối loạn cơ xương liên quan đến chơi nhạc (playing-related musculoskeletal disorders), loạn trương lực cơ khu trú (musician's focal dystonia), y học nghệ thuật biểu diễn (performing arts medicine), bàn phím DS5.5 và DS6.0 (cho D3-L5/người giao). Người giao quyết: (1) có giữ \"(tính đến 2026)\" cho PASK và BAPAM hay bỏ chi tiết ngắn hạn này (n32, n48); (2) hai số khác của BAPAM (nghỉ 3–5 phút sau 20–25 phút khi quay lại chơi) không dùng, cần thống nhất với bảng Mẫu buổi tập của cach-tap; (3) n40: câu gắn 1–2% với Altenmüller và Jabusch chưa kiểm được toàn văn; (4) PDF BAPAM do trang thứ ba đăng (n59); (5) doi_chu cu/moi ở đây là văn bản thô: dựng lại bằng so-chu.mjs --doi-chu sau khi build."
doi_chu:
  - cu: "Chơi piano là một hoạt động thể chất: một bài vài phút có thể cần hàng nghìn chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm. Phần lớn những cơn đau thường gặp ở người chơi đàn liên quan đến quá tải và căng cơ, tức là những thứ bạn điều chỉnh được. Trang này giúp bạn nhận ra yếu tố nguy cơ, xây thói quen bảo vệ đôi tay, và biết khi nào phải dừng lại để đi khám."
    moi: "Chơi piano là một hoạt động thể chất: một bài vài phút gồm rất nhiều chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm. Nhiều cơn đau thường gặp ở người chơi đàn liên quan đến quá tải và căng cơ, tức là những thứ bạn có thể điều chỉnh. Trang này giúp bạn nhận ra yếu tố nguy cơ, xây thói quen bảo vệ đôi tay, và biết khi nào phải dừng lại để đi khám."
    ly_do: 'n1 (da-sua): Câu cũ: "một bài vài phút có thể cần hàng nghìn chuyển động nhỏ". Con số "hàng nghìn" không có nguồn; đổi sang "rất nhiều" (mô tả định tính, đúng với BAPAM The Healthy Pianist: chơi piano là hoạt động lặp lại đòi hỏi thể lực). Sửa cả description.; n2 (da-sua): Câu cũ: "Phần lớn những cơn đau thường gặp…" ("phần lớn" không có nguồn; Bragge 2006 ghi nhận chưa có đồng thuận về yếu tố nguy cơ). Đổi "Nhiều". Nhận định sức khỏe nên viết thận trọng: BAPAM nêu quá tải, tư thế, căng cơ là những điều tay có thể điều chỉnh (Healthy Pianist, Practising, General Technical Principles). Nhận định sức khỏe, dựa vào nguồn BAPAM.'
  - cu: "Giới y khoa gọi chung các vấn đề này là rối loạn cơ xương liên quan đến chơi nhạc (playing-related musculoskeletal disorders). Một tổng quan hệ thống về người chơi piano (Bragge và cộng sự, 2006) ghi nhận tỷ lệ mắc trong các nghiên cứu dao động rất rộng, từ 26% đến 93%, một phần vì mỗi nghiên cứu định nghĩa và đo lường khác nhau. Con số chính xác khó biết, nhưng kết luận thì rõ: rất nhiều người chơi piano từng đau vì chơi đàn."
    moi: "Giới y khoa gọi chung các vấn đề này là rối loạn cơ xương liên quan đến chơi nhạc (playing-related musculoskeletal disorders). Một tổng quan hệ thống về người chơi piano (Bragge và cộng sự, 2006) ghi nhận tỷ lệ mắc trong các nghiên cứu dao động rất rộng, từ 26% đến 93%. Con số chính xác khó biết, nhưng kết luận thì rõ: nhiều người chơi piano từng đau vì chơi đàn."
    ly_do: 'n6 (da-sua): Tóm tắt Bragge 2006 (OpenAlex): tỷ lệ mắc dao động 26–93% giữa các nghiên cứu; chưa có đồng thuận về yếu tố nguy cơ. Đã bỏ vế cũ "một phần vì mỗi nghiên cứu định nghĩa và đo lường khác nhau" vì tóm tắt tôi mở được không nói rõ lý do.; n7 (da-sua): Cũ: "rất nhiều người". Đổi "nhiều" cho khớp biên độ 26–93% (không khẳng định đa số).'
  - cu:
      - Mỏi bình thường
      - Tín hiệu cần dừng
      - Nặng, mỏi đều ở cẳng tay hay vai sau một buổi tập dài
    moi:
      - BAPAM coi mỏi và căng là dấu hiệu để xem lại kỹ thuật, cách tập và chương trình tập; còn đau thì dừng ngay.
      - "Mỏi, căng: xem lại cách tập"
      - "Đau và dấu hiệu bất thường: dừng"
      - Mỏi đều ở cẳng tay hay vai sau một buổi tập dài
    ly_do: 'n9 (da-sua): Thêm câu dẫn vào bảng. BAPAM The Healthy Pianist: nếu thấy mỏi hay căng thì xem lại kỹ thuật, cách tập, chương trình tập; "If you experience pain, stop immediately." Câu cũ không có câu dẫn mà đặt "mỏi bình thường" đối lập "tín hiệu cần dừng".'
  - cu:
      - Hết sau khi nghỉ vài phút đến vài giờ
      - Còn đau sau khi nghỉ, hoặc hôm sau quay lại đúng chỗ đó
    moi:
      - Giảm đi khi nghỉ
      - Đau không hết, hoặc nặng dần, dù đã nghỉ
    ly_do: 'n36, n37: bảng đau mỏi bình thường và dấu hiệu cảnh báo viết lại theo BAPAM (giảm khi nghỉ, hay đau không hết, nặng dần); bỏ mốc "vài phút đến vài giờ", "hôm sau" không có nguồn.'
  - cu: Các nghiên cứu chưa thống nhất yếu tố nào quan trọng nhất (chính tổng quan của Bragge cũng ghi nhận điều đó), nhưng những yếu tố dưới đây được giáo viên, bác sĩ và tài liệu về sức khỏe nhạc công nhắc đến nhiều nhất.
    moi: Các nghiên cứu chưa thống nhất yếu tố nào quan trọng nhất (chính tổng quan của Bragge cũng ghi nhận điều đó), nhưng dưới đây là những yếu tố mà tài liệu về sức khỏe nhạc công (như BAPAM) nhắc tới.
    ly_do: 'n11 (da-sua): Cũ: "những yếu tố dưới đây được giáo viên, bác sĩ và tài liệu về sức khỏe nhạc công nhắc đến nhiều nhất" ("nhiều nhất", "giáo viên, bác sĩ" không có nguồn). Bragge 2006: chưa có đồng thuận về yếu tố nguy cơ. Viết lại thận trọng, chỉ nói BAPAM nhắc tới. Nhận định sức khỏe, dẫn nguồn BAPAM và Bragge.'
  - cu:
      - Cơ và gân cần thời gian để thích nghi với tải mới
      - Tăng dần qua nhiều tuần
    moi:
      - Tay cần thời gian để thích nghi với tải mới
      - Tăng dần qua nhiều tuần; học bài mới đủ sớm trước hạn
    ly_do: 'n12 (da-sua): BAPAM Practising: tăng thời lượng tập dần, tránh tăng đột ngột. Cũ: "Cơ và gân cần thời gian…" (cơ chế giải phẫu không có nguồn) và "Tăng dần qua nhiều tuần" kèm số ở phần dưới. Đổi cơ chế thành "tay cần thời gian để thích nghi".'
  - cu:
      - Mô mềm không kịp hồi phục
      - Nghỉ 5 phút sau mỗi 25–30 phút; chia thành nhiều buổi ngắn
    moi:
      - Tay cần thời gian hồi phục giữa các lượt tập
      - Tập khoảng 20 phút rồi nghỉ 10 phút; chia thành nhiều lượt ngắn
    ly_do: 'n13 (da-sua): BAPAM Healthy Pianist (Practising): "Practise in twenty minute sessions, interspersed with ten minute breaks". Câu cũ "Nghỉ 5 phút sau mỗi 25–30 phút" không có nguồn nào; sửa theo BAPAM, khớp tu-the.md và cach-tap.md (lượt này).'
  - cu:
      - Bài quá khó quá sớm
      - Tay làm những việc chưa có kỹ thuật để làm
      - Chọn bài vừa sức (Tác phẩm theo cấp độ)
    ly_do: 'n19 (da-bo): Bỏ hàng khỏi bảng yếu tố nguy cơ vì không có nguồn BAPAM, NHS hay Bragge xác nhận "bài quá khó" là yếu tố nguy cơ của đau. Lời khuyên chọn bài vừa sức vẫn có ở tac-pham-theo-cap và cach-tap.'
  - cu:
      - Căng thẳng, thiếu ngủ
      - Cơ căng hơn, hồi phục chậm hơn
      - Ngủ đủ; để ý những lúc mình đang gồng
      - Tay lạnh
      - Ngón kém linh hoạt, dễ phải gồng
      - Làm ấm tay trước khi chơi
      - "Tải từ việc khác: gõ phím, điện thoại, nâng bế, thể thao dùng tay"
    moi:
      - Không khởi động
      - Cơ chưa được làm ấm, máu chưa đủ tới tay
      - Làm ấm tay và khởi động nhẹ trước khi tập kỹ thuật
      - "Tải từ việc khác: gõ phím, nhắn tin, xách đồ nặng, thể thao hay làm vườn"
    ly_do: 'n18 (da-sua): BAPAM General Technical Principles: khởi động trước khi tập các bài tập kỹ thuật. Câu cũ là hàng "Tay lạnh": "Ngón kém linh hoạt, dễ phải gồng" (không có nguồn); bỏ hàng ấy, thay bằng "Không khởi động" theo BAPAM. Lưu ý: "máu chưa đủ tới tay" là cách nói chung về làm ấm; không số liệu.; n20 (da-bo): Bỏ hàng khỏi bảng yếu tố nguy cơ vì không có nguồn tầng 1–2 mở được về chơi piano (BAPAM Healthy Pianist không nêu ngủ hay căng thẳng là yếu tố nguy cơ). Ý "ngủ củng cố kỹ năng" cũng bỏ ở mục dưới (n34).; n21 (da-sua): BAPAM The Healthy Pianist (General): tải từ các hoạt động khác (gõ phím, xách nặng, thể thao) cộng vào tải của tay. Cũ: "điện thoại, nâng bế, thể thao dùng tay"; đổi sang ví dụ đúng thời (bỏ "điện thoại" thành "nhắn tin", bỏ "nâng bế").'
  - cu:
      - "Năm phút là đủ, và mục đích là làm ấm chứ không phải kéo giãn:"
      - "Làm ấm tay: rửa tay bằng nước ấm, nhất là những ngày lạnh."
    moi: "Hãy khởi động nhẹ vài phút; mục đích là làm ấm chứ không phải kéo giãn:"
    ly_do: 'n22 (da-sua): BAPAM General Technical Principles: khởi động trước khi tập kỹ thuật, tay chưa nóng thì bắt đầu chậm, không vội kéo giãn mạnh. Cũ: "Năm phút là đủ" (mốc không có nguồn); đổi "Hãy khởi động nhẹ vài phút". Liên kết Tư thế và Gam đã có trong repo.; n22 (da-sua, review D4-gom): bỏ bước rửa tay nước ấm, không có nguồn (BAPAM, PASK).'
  - cu: "Nghỉ 5 phút sau mỗi 25–30 phút: đứng dậy, đi lại, buông thõng tay. Hãy đặt hẹn giờ, vì khi đang hăng không ai tự nhớ."
    moi: "Tập khoảng 20 phút rồi nghỉ 10 phút (theo BAPAM): đứng dậy, đi lại, buông thõng tay. Hãy đặt hẹn giờ, vì khi đang hăng không ai tự nhớ."
    ly_do: 'n24: mốc nghỉ "5 phút sau 25–30 phút" đổi thành BAPAM: tập khoảng 20 phút, nghỉ 10 phút.'
  - cu: Muốn tập 90 phút một ngày, hai buổi 45 phút cách nhau vài giờ tốt hơn một buổi liền.
    moi: Muốn tập lâu trong ngày, hãy chia thành nhiều lượt ngắn xen nghỉ thay vì một buổi liền.
    ly_do: 'n24 (da-sua): BAPAM Healthy Pianist, Practising: tập 20 phút, nghỉ 10 phút. Cũ: "Nghỉ 5 phút sau mỗi 25–30 phút" và "Muốn tập 90 phút một ngày, hai buổi 45 phút cách nhau vài giờ tốt hơn một buổi liền" (cả hai không có nguồn). Số khác của BAPAM (nghỉ 3–5 phút sau 20–25 phút) nằm ở trang Returning to Playing, dành cho người đang quay lại sau đau, nên không dùng ở đây (người giao cân nhắc).'
  - cu: "Đôi tay thích nghi với tải tăng dần, không phải với những cú nhảy. Ví dụ, nếu đang tập 30 phút mỗi ngày và muốn lên 60 phút, hãy đi qua vài tuần: thêm khoảng 5–10 phút mỗi tuần, chỉ khi tay vẫn thoải mái, và giữ một ngày tập nhẹ mỗi tuần. Trước kỳ thi hay buổi diễn, đừng nhân đôi thời gian tập trong tuần cuối: lúc đó nên tập chậm, tập trong đầu và giữ sức."
    moi: "Đôi tay thích nghi với tải tăng dần, không phải với những cú nhảy; BAPAM khuyên tránh tăng đột ngột thời lượng tập. Ví dụ, nếu đang tập 30 phút mỗi ngày và muốn lên 60 phút, hãy đi qua nhiều tuần và chỉ tăng khi tay vẫn thoải mái. Trước kỳ thi hay buổi diễn, đừng nhân đôi thời gian tập trong tuần cuối: lúc đó nên tập chậm, tập trong đầu và giữ sức."
    ly_do: 'n25 (da-sua): BAPAM Healthy Pianist, Practising: tăng dần thời lượng, tránh tăng đột ngột. Cũ có số: "thêm khoảng 5–10 phút mỗi tuần", "giữ một ngày tập nhẹ mỗi tuần" (không có nguồn); bỏ số, giữ ví dụ 30 lên 60 phút kèm "nhiều tuần" và "chỉ tăng khi tay vẫn thoải mái". Ghi chú: nếu muốn giữ con số "5–10 phút mỗi tuần", người giao phải tìm nguồn.'
  - cu: "Bàn phím tiêu chuẩn có quãng tám rộng khoảng 6,5 inch (khoảng 16,5 cm) cho mọi người chơi, bất kể cỡ tay. Một khảo sát ở Úc (Boyle, Boyle và Booker, 2015) đo độ dang tay phải từ đầu ngón cái đến đầu ngón út: trung bình khoảng 22,6 cm ở nam và 20,1 cm ở nữ, và hơn một nửa số phụ nữ trong mẫu có độ dang dưới 8 inch (khoảng 20,3 cm). Trong một nghiên cứu lâm sàng trên 200 nghệ sĩ piano Nhật Bản bị đau tay do tập quá mức (Sakai, 2002), nhiều trường hợp khởi phát khi đang luyện quãng tám và hợp âm."
    moi: Bàn phím piano phổ biến hiện nay có quãng tám rộng khoảng 6,5 inch (khoảng 16,5 cm) cho mọi người chơi, bất kể cỡ tay. Theo PASK, độ dang tay của người lớn có thể chênh nhau tới khoảng 12,7 cm (5 inch), và trung bình tay nam dang hơn tay nữ khoảng 2,5 cm. Trong một nghiên cứu lâm sàng trên 200 nghệ sĩ và sinh viên piano ở Nhật Bản bị đau tay do tập quá mức (Sakai, 2002), 70 người cho biết triệu chứng bắt đầu khi họ đang tập một kỹ thuật bàn phím nhất định; quãng tám (30 người) và hợp âm (22 người) là hai kỹ thuật gặp nhiều nhất.
    ly_do: "n28 (da-sua): PASK How many sizes?: quãng tám của bàn phím chuẩn rộng khoảng 6,5 in (16,5 cm). Cũ: \"Bàn phím tiêu chuẩn…\"; đổi \"phổ biến hiện nay\" cho đúng nghĩa. 6,5 in = 16,51 cm.; n29 (da-sua): PASK Pianists' hand spans vary greatly: chênh tới khoảng 5 in; nam hơn nữ khoảng 1 in (5 in = 12,7 cm; 1 in = 2,54 cm, làm tròn 2,5 cm). Cũ dựa vào Boyle, Boyle, Booker 2015 (22,6 cm nam, 20,1 cm nữ): bỏ vì chưa mở được bài gốc và tập số liệu khác; Boyle bị bỏ ở mục Nguồn (n63).; n30 (da-sua): Số liệu qua tóm tắt PASK Epidemiological and clinical studies về Sakai 2002 (MPPA 17(4):178–180): 200 ca, 70 ca bắt đầu khi tập một kỹ thuật, quãng tám 30, hợp âm 22. Chưa mở toàn văn Sakai; chưa chắc về chi tiết \"nghệ sĩ và sinh viên\" và \"Nhật Bản\" ngoài những gì PASK tóm tắt."
  - cu: 'Bàn phím hẹp: có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 (thường gọi là bàn phím "7/8") và DS6.0 ("15/16"); tổ chức PASK (Pianists for Alternatively Sized Keyboards) vận động để chúng phổ biến hơn. Hiện chúng còn ít, đắt và thường phải chờ lâu.'
    moi: "Bàn phím hẹp: có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 và DS6.0 (quãng tám rộng 5,5 và 6 inch); tổ chức PASK (Pianists for Alternatively Sized Keyboards) vận động để chúng phổ biến hơn và giữ danh sách những nơi làm loại bàn phím này."
    ly_do: 'n32 (da-sua): PASK How many sizes? (DS5.5, DS6.0; số ít nguồn bán, giá cao, chờ lâu) và What is PASK? (tổ chức vận động). Cũ: "Hiện chúng còn ít, đắt và thường phải chờ lâu." (không ghi nguồn hay thời điểm). Sửa theo bảng tầng: "Theo PASK (tính đến 2026)". Chi tiết ngắn hạn (giá, nơi bán) này là điều có thể đổi; nên xem lại khi bảo trì trang.; n32 (da-sua, review D4-gom): bỏ tên "7/8", "15/16" và vế "số ít nguồn, giá cao, chờ lâu (tính đến 2026)": không có trên trang PASK, trái với trang Manufacturers, và là chi tiết mau cũ.'
  - cu:
      - "Những điều cơ bản đã có ở Tư thế, thế tay và cách dùng lực: ghế đúng độ cao, cổ tay mềm, vai thả, dùng trọng lượng cánh tay. Thêm vài điều hay bị quên: giá nhạc hoặc máy tính bảng đặt đủ cao để cổ không cúi suốt buổi; ánh sáng đủ để bạn không phải chồm về phía bản nhạc; đàn điện có chân chắc, không rung; đàn cơ được cân chỉnh định kỳ, vì bộ máy phím nặng và không đều khiến tay phải làm việc nhiều hơn (Chọn đàn)."
      - Ngủ, vận động, giữ ấm
      - "Ngủ đủ: cơ thể hồi phục trong lúc ngủ, và giấc ngủ cũng giúp củng cố kỹ năng vừa tập."
      - "Vận động toàn thân: đi bộ, bơi, các bài tập cho lưng và vai giúp bạn ngồi lâu mà không gù."
      - "Giữ ấm: những ngày rét, làm ấm phòng tập, đeo găng tay hở ngón trước khi tập, rửa tay nước ấm."
    moi:
      - "Những điều cơ bản đã có ở Tư thế, thế tay và cách dùng lực: ghế đúng độ cao, cổ tay mềm, vai thả, dùng trọng lượng cánh tay. Thêm vài điều hay bị quên: đàn điện có chân chắc, không rung; và độ nặng phím hợp với tay bạn, vì BAPAM nhắc nên cân nhắc phím nhẹ hay nặng hợp hơn cho việc tập thường xuyên (Chọn đàn)."
      - Vận động
      - BAPAM khuyên giữ thể lực bằng vận động nhịp điệu đều như bơi, đi bộ hay chạy; các môn dùng tạ và nắm tay chặt không hợp với người chơi piano.
    ly_do: 'n33 (da-sua): Cũ còn: giá nhạc hoặc máy tính bảng đặt đủ cao, ánh sáng đủ để không chồm về phía bản nhạc, đàn cơ cân chỉnh định kỳ vì bộ máy phím nặng và khô gây mỏi. Bỏ vì không có nguồn BAPAM/NHS cho từng điều ("máy tính bảng" còn là chi tiết ngắn hạn). Giữ ý "độ nặng phím" của BAPAM.; n34 (da-sua, review D4-gom): bỏ gạch đầu dòng Giữ ấm (không có nguồn); tiêu đề giữ id cũ.'
  - cu: Dừng buổi tập, nghỉ chơi đàn vài ngày; không đỡ thì đi khám
    moi: Dừng buổi tập và cho tay nghỉ; không đỡ thì đi khám
    ly_do: 'n35 (da-sua): BAPAM Healthy Pianist, Warning Signs: dừng khi đau, đau kéo dài thì đi khám. Cũ: "nghỉ chơi đàn vài ngày" (mốc "vài ngày" không có nguồn); đổi "cho tay nghỉ". Lưu ý: moi-ngay.yml (lô trước) trích hàng này; câu mới khác câu cũ, xem ghi_chu cuối hồ sơ (lệch).'
  - cu: Tê, kim châm ở ngón tay, nhất là về đêm hay lúc thức dậy
    moi:
      - Tê, kim châm ở ngón tay
      - Đi khám
      - Yếu tay, vụng về khi cầm đồ vật
    ly_do: 'n36: hàng tê, kim châm tách theo BAPAM (tê, yếu tay); bỏ "về đêm hay lúc thức dậy" không có nguồn.'
  - cu: "Yếu tay: rơi đồ, khó cài cúc, khó mở nắp chai"
    moi: Sưng hay đỏ quanh khớp ngón hoặc cổ tay
    ly_do: 'n36 (da-sua): BAPAM Warning Signs và NHS RSI: đau, nhói, tê, kim châm, yếu, vụng về, sưng là dấu hiệu cần đánh giá. Cũ: "nhất là về đêm hay lúc thức dậy" (đặc trưng hội chứng ống cổ tay, không nằm trong nguồn BAPAM/NHS RSI mở được), "rơi đồ, khó cài cúc, khó mở nắp chai", "sưng, nóng, đỏ". Rút gọn theo nguồn; bỏ "nóng".'
  - cu: Sưng, nóng, đỏ quanh khớp hay cổ tay
    moi: Đau không hết hoặc nặng dần, kể cả khi đã nghỉ chơi đàn
    ly_do: 'n37: bỏ hàng "nóng" theo BAPAM; thay bằng dấu hiệu đau không hết hoặc nặng dần.'
  - cu:
      - Đau cả khi không chơi đàn, ảnh hưởng sinh hoạt hay giấc ngủ
      - Đi khám sớm
    ly_do: 'n37 (da-sua): Cũ: "Đau cả khi không chơi đàn, ảnh hưởng sinh hoạt hay giấc ngủ | Đi khám sớm" (mốc "sớm" và "giấc ngủ" không có nguồn). BAPAM/NHS: đau kéo dài, nặng dần thì đi khám.'
  - cu: "Đừng uống thuốc giảm đau để tập tiếp: thuốc làm tắt tín hiệu, không chữa nguyên nhân."
    ly_do: 'n39 (da-sua): BAPAM Healthy Pianist: dừng ngay khi đau. BAPAM Returning to Playing: quay lại chậm, đơn giản, nhỏ tiếng (khớp "bài chậm, đơn giản, nhỏ tiếng"). Cũ có bước 2 "Đừng uống thuốc giảm đau để tập tiếp: thuốc làm tắt tín hiệu, không chữa nguyên nhân": bỏ vì không có nguồn tầng 1–2 trong tài liệu đã mở (NHS RSI nói thuốc giảm đau là một cách điều trị, nên khẳng định cũ có thể lệch); bước còn lại đánh số lại 1–3. "bài dễ, chậm" đổi "bài chậm, đơn giản".'
  - cu: "Quay lại từ từ khi đã hết đau, hoặc theo chỉ dẫn của bác sĩ: buổi ngắn, bài dễ, chậm, nhỏ tiếng; dừng ngay nếu đau trở lại."
    moi: "Quay lại từ từ khi đã hết đau, hoặc theo chỉ dẫn của bác sĩ: buổi ngắn, bài chậm, đơn giản, nhỏ tiếng; dừng ngay nếu đau trở lại."
    ly_do: "n39: quay lại tập theo hướng dẫn BAPAM: buổi ngắn, bài chậm, đơn giản, nhỏ tiếng."
  - cu: "Loạn trương lực cơ khu trú ở nhạc công (musician's focal dystonia) là một rối loạn thần kinh hiếm gặp, ước tính khoảng 1% nhạc công chuyên nghiệp (Altenmüller và Jabusch, 2010). Nó thường không đau: một hay vài ngón co quắp, duỗi cứng hoặc không nghe lời, chỉ khi làm đúng một động tác đã luyện rất nhiều trên đàn, trong khi các việc khác vẫn bình thường. Cố tập nhiều hơn để \"sửa\" thường không giúp được. Nếu nghi ngờ, hãy gặp bác sĩ thần kinh, tốt nhất là người có kinh nghiệm về rối loạn vận động. Nhưng đừng vội hoảng: phần lớn những ngón tay \"vụng\" ở người mới học chỉ là chưa được tập đủ, hoặc đang bị căng."
    moi: "Loạn trương lực cơ khu trú ở nhạc công (musician's focal dystonia) là một rối loạn thần kinh hiếm gặp, ước tính khoảng 1–2% nhạc công chuyên nghiệp (Altenmüller và Jabusch, 2010; BAPAM). Nó thường không đau lúc đầu: một hay vài ngón tự co vào một tư thế bất thường hoặc không nghe lời khi chơi đàn; những việc khác có thể vẫn bình thường, dù đôi khi vấn đề lan sang các việc tinh khác như viết hay gõ phím. Cố tập nhiều hơn để \"sửa\" có thể làm triệu chứng nặng thêm. Nếu nghi ngờ, hãy nhờ bác sĩ gia đình giới thiệu đến bác sĩ thần kinh có quan tâm đặc biệt đến rối loạn vận động; BAPAM cũng khuyên nên được chuyên gia y học nghệ thuật biểu diễn đánh giá khi bạn chơi đàn."
    ly_do: "n40 (da-sua): BAPAM Musicians' Focal Dystonia: 1–2% nhạc công. Cũ ghi \"khoảng 1%\" gắn với Altenmüller và Jabusch 2010; chưa mở toàn văn bài Altenmüller để kiểm số 1%, nên đổi 1–2% theo BAPAM và ghi cả hai nguồn. CHƯA CHẮC: việc Altenmüller và Jabusch 2010 nêu đúng 1–2%; người giao có thể bỏ tên bài khỏi câu nếu không mở được toàn văn.; n41 (da-sua): BAPAM Musicians' Focal Dystonia: thường không đau lúc đầu; có thể lan sang viết, gõ phím. Cũ: \"co quắp, duỗi cứng hoặc không nghe lời, chỉ khi làm đúng một động tác đã luyện rất nhiều trên đàn\" (chi tiết \"chỉ khi\" quá chắc, không có nguồn); viết lại nhẹ hơn.; n42 (da-sua): BAPAM Musicians' Focal Dystonia: tập thêm làm triệu chứng nặng hơn. Câu cũ \"thường không giúp được\" yếu hơn nguồn; viết lại đúng nguồn.; n43 (da-bo): Bỏ câu \"phần lớn…\" vì không có nguồn tầng 1–2 (khẳng định y khoa về tần suất, có thể khiến người đọc chủ quan). Hướng dẫn \"nghi ngờ thì khám\" ở n44 đã đủ.; n44 (da-sua): BAPAM Musicians' Focal Dystonia và The Healthy Pianist (When to visit a Specialist): GP giới thiệu, bác sĩ thần kinh quan tâm rối loạn vận động; chuyên gia y học nghệ thuật biểu diễn. Cũ: \"Nếu nghi ngờ, hãy gặp bác sĩ thần kinh, tốt nhất là người có kinh nghiệm về rối loạn vận động.\" Thêm bước bác sĩ gia đình giới thiệu và gợi ý của BAPAM; bớt \"tốt nhất là\"."
  - cu: Ở Việt Nam, hãy bắt đầu với bác sĩ chuyên khoa cơ xương khớp, chấn thương chỉnh hình (có nơi có chuyên khoa bàn tay) hoặc phục hồi chức năng tại bệnh viện. Tê, yếu hay mất kiểm soát ngón tay thì nên gặp bác sĩ thần kinh. Kỹ thuật viên vật lý trị liệu có thể hướng dẫn bài tập và lộ trình quay lại đàn.
    moi: Ở Việt Nam, hãy bắt đầu bằng một bác sĩ ở cơ sở y tế bạn tin cậy, nói rõ mình chơi đàn và tập bao lâu mỗi ngày, rồi nhờ bác sĩ giới thiệu đến chuyên khoa phù hợp. Tê, yếu hay mất kiểm soát ngón tay thì nên nhờ giới thiệu đến bác sĩ thần kinh.
    ly_do: 'n45 (da-sua): Cũ liệt kê cụ thể chuyên khoa (cơ xương khớp, chấn thương chỉnh hình, phục hồi chức năng, kỹ thuật viên vật lý trị liệu có thể hướng dẫn lộ trình quay lại) mà không có nguồn; thay bằng hướng dẫn chung "bác sĩ giới thiệu". Nhận định sức khỏe, dẫn NHS RSI và BAPAM (đi khám, bác sĩ giới thiệu); đề nghị người giao xem lại nếu muốn nêu chuyên khoa cụ thể ở Việt Nam.'
  - cu:
      - "Khi bác sĩ đã cho phép chơi lại, nhờ thầy xem kỹ thuật ở đoạn gây đau: nhiều khi nguyên nhân nằm ở một thói quen nhỏ như cổ tay khóa hay ngón cái ép chặt."
      - Ở nước ngoài có cả một chuyên ngành gọi là y học nghệ thuật biểu diễn (performing arts medicine). Ở Anh, BAPAM (British Association for Performing Arts Medicine) là tổ chức từ thiện khám miễn phí cho người làm và học nghệ thuật biểu diễn tại Anh. Ở Mỹ, PAMA (Performing Arts Medicine Association) quy tụ bác sĩ, nhà trị liệu, nghệ sĩ và nhà giáo, và có danh bạ giới thiệu chuyên gia. Nếu bạn sống ở những nước này, đó là nơi nên tìm đến trước tiên.
    moi:
      - "Khi bác sĩ đã cho phép chơi lại, nhờ thầy xem kỹ thuật ở đoạn gây đau: BAPAM khuyên xem lại cách chơi để đau khỏi tái phát, vì nguyên nhân có thể nằm ở một thói quen nhỏ như cổ tay khóa hay ngón cái ép chặt."
      - Ở nước ngoài có những tổ chức chuyên về y học nghệ thuật biểu diễn (performing arts medicine). Ở Anh, BAPAM (British Association for Performing Arts Medicine) là tổ chức từ thiện y tế dành cho người làm nghề nghệ thuật biểu diễn ở Anh, có tư vấn miễn phí (tính đến 2026). Ở Mỹ, PAMA (Performing Arts Medicine Association) quy tụ chuyên gia y tế, nghệ sĩ, nhà giáo và nhà quản lý, và có danh bạ giới thiệu người cung cấp dịch vụ cho người biểu diễn. Nếu bạn sống ở những nước này, đó là nơi bạn có thể tìm đến.
    ly_do: 'n47 (da-sua): BAPAM Healthy Pianist (Warning Signs / When to visit a Specialist) và Returning to Playing: xem lại kỹ thuật để tránh tái phát. Cũ: "nhiều khi nguyên nhân nằm ở một thói quen nhỏ…" (không nguồn); thêm "BAPAM khuyên…" và "có thể".; n48 (da-sua): bapam.org.uk: tổ chức từ thiện y tế, dịch vụ tư vấn miễn phí cho người làm nghề biểu diễn. Cũ: "khám miễn phí cho người làm và học nghệ thuật biểu diễn tại Anh". Bảng tầng: bỏ "miễn phí" nếu không có nguồn hiện hành; đã mở trang BAPAM nên giữ nhưng thêm "(tính đến 2026)" và đổi "khám" thành "tư vấn", bỏ "học". CHƯA CHẮC: điều kiện hiện hành của dịch vụ miễn phí (đối tượng, phạm vi); nên xem lại khi bảo trì.; n49 (da-sua): artsmed.org: hội của chuyên gia y tế, nghệ sĩ, nhà giáo và nhà quản lý; có danh bạ. Cũ: "quy tụ bác sĩ, nhà trị liệu, nghệ sĩ và nhà giáo, và có danh bạ giới thiệu chuyên gia" (thiếu nhà quản lý, và "nhà trị liệu" không đối chiếu được); viết lại theo trang chủ.; n50 (da-sua): Cũ: "đó là nơi nên tìm đến trước tiên". Bỏ "trước tiên" vì dịch vụ ở nước ngoài không phải lựa chọn đầu tiên cho người ở Việt Nam (n45 đã nói bắt đầu từ bác sĩ gần nhà).'
  - cu: Buổi nào cũng có nghỉ 5 phút sau mỗi 25–30 phút
    moi: Buổi nào cũng nghỉ 10 phút sau mỗi 20 phút tập
    ly_do: 'n51 (da-sua): Dòng nghỉ sửa theo BAPAM 20/10, khớp n13 và n24. Cũ: "Buổi nào cũng có nghỉ 5 phút sau mỗi 25–30 phút". Các dòng còn lại khớp n25, n26, tu-the.md và n36.'
  - cu:
      - 'E. Altenmüller, H.-C. Jabusch, "Focal dystonia in musicians: phenomenology, pathophysiology and triggering factors", European Journal of Neurology 17 (Suppl. 1), 2010.'
      - 'Boyle, Boyle, Booker, "Pianist hand spans: Gender and ethnic differences and implications for piano playing", Australasian Piano Pedagogy Conference, 2015; các nghiên cứu về cỡ tay và bàn phím hẹp được tổng hợp tại PASK.'
    moi:
      - 'E. Altenmüller, H.-C. Jabusch, "Focal dystonia in musicians: phenomenology, pathophysiology, triggering factors, and treatment", Medical Problems of Performing Artists 25(1), 2010, tr. 3–9.'
      - BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano); Musicians' Focal Dystonia; Returning to Playing.
      - PASK, các trang How many sizes?, What is PASK?, Pianists' hand spans vary greatly và Epidemiological and clinical studies.
    ly_do: 'n58 (da-sua): Sửa theo Crossref (đã tìm theo tên bài): tạp chí là Medical Problems of Performing Artists 25(1):3–9, tựa có thêm "and treatment". Cũ ghi "European Journal of Neurology 17 (Suppl. 1), 2010" kèm tựa thiếu "and treatment": không khớp bản ghi Crossref của bài này.; n59 (da-sua): Thêm vào mục Nguồn vì trang dựa nhiều vào các tài liệu này. Đã mở cả ba. Bản PDF do trang thứ ba (crosseyedpianist.com) đăng, không phải bapam.org.uk: nên thay bằng bản trên bapam.org.uk nếu BAPAM đăng; người giao quyết.; n60 (da-sua): Cũ chỉ ghi chung "tại PASK (https://paskpiano.org/)"; thay bằng bốn trang cụ thể đã mở.; n63 (da-bo): Mục Nguồn: bỏ vì câu dùng nó (n29 cũ) đã thay bằng PASK; chưa mở được bài gốc.; n59 (da-sua, review D4-gom): link sang trang chính thức của BAPAM.'
