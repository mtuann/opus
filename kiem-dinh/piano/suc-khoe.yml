  - id: n31
    cau: "Nếu tay bạn nhỏ: biết vùng thoải mái của mình; đừng giữ bàn tay mở căng, khép lại giữa hai quãng tám, di chuyển bằng cả cánh tay; sắp xếp lại hợp âm rộng (bỏ nốt nhân đôi, chuyển sang tay kia, rải); chọn bài hợp tay, nhạc Baroque và Cổ điển có nhiều bài hay không đòi hỏi bàn tay lớn."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập (chọn bài, sắp xếp lại hợp âm, nhờ thầy). Liên kết Tác phẩm theo cấp độ: trang đích chưa chuyển, đã kiểm ../opus-zero/docs/piano/tac-pham-theo-cap.md. Vế "nhạc Baroque và Cổ điển có rất nhiều bài hay không đòi hỏi bàn tay lớn" là nhận xét chung, đúng với repertoire (ví dụ Bach Invention).'
    luot_2: dung
    luot_2_ghi_chu: "Khuyên tập hợp lý; PASK: không để bàn tay mở căng, dùng cả cánh tay; sắp xếp lại hợp âm là cách dạy phổ biến."
  - id: n32
    cau: Có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 và DS6.0 (quãng tám rộng 5,5 và 6 inch); PASK vận động để chúng phổ biến hơn và giữ danh sách những nơi làm loại bàn phím này.
    loai: so-lieu
    nguon:
      - pask-sizes
      - pask-about
      - pask-makers
    ket_qua: da-sua
    ghi_chu: 'PASK How many sizes? (DS5.5, DS6.0; số ít nguồn bán, giá cao, chờ lâu) và What is PASK? (tổ chức vận động). Cũ: "Hiện chúng còn ít, đắt và thường phải chờ lâu." (không ghi nguồn hay thời điểm). Sửa theo bảng tầng: "Theo PASK (tính đến 2026)". Chi tiết ngắn hạn (giá, nơi bán) này là điều có thể đổi; nên xem lại khi bảo trì trang. Review D4-gom: đã mở PASK How many sizes? và Manufacturers (28/10/2026). How many sizes? có DS6.0, DS5.5 nhưng không có tên "7/8", "15/16", giá hay thời gian chờ; trang Manufacturers liệt kê nhiều nơi làm (DS Standard Foundation tạm không nhận khách tư nhân; Pinkham "at no extra cost compared with a standard keyboard"; Kaduk "for the same price"), nên vế "số ít nguồn, giá cao, chờ lâu (tính đến 2026)" vừa không có nguồn vừa không bền: bỏ. Chữ cũ: "như loại DS5.5 (thường gọi là bàn phím "7/8") và DS6.0 ("15/16"); tổ chức PASK … vận động để chúng phổ biến hơn. Theo PASK (tính đến 2026), chúng chỉ có từ một số ít nguồn, giá cao và người mua thường phải chờ lâu."; chữ mới: "như loại DS5.5 và DS6.0 (quãng tám rộng 5,5 và 6 inch); tổ chức PASK … vận động để chúng phổ biến hơn và giữ danh sách những nơi làm loại bàn phím này." (Manufacturers: "5.5 inch (14.1 cm) octave keyboards (DS5.5®)", "6.0 inch (15.2 cm) octave keyboards (DS6.0®)"). Cần lượt 2 kiểm chữ mới.'
    luot_2: dung
    luot_2_nguon: [ "https://paskpiano.org/", "https://paskpiano.org/manufacturers/", "https://paskpiano.org/about/" ]
    luot_2_ghi_chu: PASK vận động DS5.5 và DS6.0 (DS6.5 là chuẩn, octave 6,5 inch); có trang 'Manufacturers' liệt kê nhà làm (Steingraeber, August Foerster ghi 'octave 6.0 và 5.5 inch'). Trang About không nêu thẳng 5,5/6 inch nhưng tên gọi và trang Manufacturers khớp.
  - id: n33
    cau: "Ghế, tư thế, cây đàn: đàn điện có chân chắc, không rung; độ nặng phím hợp với tay bạn, vì BAPAM nhắc nên cân nhắc phím nhẹ hay nặng hợp hơn cho việc tập thường xuyên."
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'Cũ còn: giá nhạc hoặc máy tính bảng đặt đủ cao, ánh sáng đủ để không chồm về phía bản nhạc, đàn cơ cân chỉnh định kỳ vì bộ máy phím nặng và khô gây mỏi. Bỏ vì không có nguồn BAPAM/NHS cho từng điều ("máy tính bảng" còn là chi tiết ngắn hạn). Giữ ý "độ nặng phím" của BAPAM. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016), mục Adapting to the Instrument: "If choosing a new piano, it is worth considering whether a lighter or heavier action is more appropriate for regular practice." Vế "đàn điện có chân chắc, không rung" là lời khuyên về dụng cụ, không phải khẳng định sức khỏe. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được tờ Healthy Pianist của BAPAM để kiểm vế phím nhẹ hay nặng.
  - id: n34
    cau: "Vận động: BAPAM khuyên giữ thể lực bằng vận động nhịp điệu đều như bơi, đi bộ hay chạy; các môn dùng tạ và nắm tay chặt không hợp với người chơi piano."
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'BAPAM Healthy Pianist, Health and Posture: tập thể lực nhịp điệu đều (aerobic: bơi, đi bộ, chạy); tránh môn tạ nặng và nắm chặt. Cũ: "Ngủ đủ" (cơ thể hồi phục, củng cố kỹ năng) và "bài tập cho lưng và vai giúp ngồi lâu không gù": bỏ vì không có nguồn BAPAM/NHS cho lợi ích đó. Tiêu đề đổi thành "Vận động và giữ ấm" kèm neo cũ { #ngu-van-dong-giu-am }. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "Maintain a certain level of fitness with regular aerobic activity such as swimming, walking or running (sports involving weights and tight hand grip are not recommended for pianists)." Trang BAPAM không nói về giữ ấm hay rửa tay nước ấm (PASK cũng không), nên bỏ gạch đầu dòng "Giữ ấm: những ngày rét, làm ấm tay trước khi tập, như rửa tay nước ấm"; tiêu đề "Vận động và giữ ấm" thành "Vận động", giữ id cũ { #ngu-van-dong-giu-am }; phần còn lại viết thành đoạn văn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/the-healthy-pianist/" ]
    luot_2_ghi_chu: "BAPAM: 'regular aerobic activity such as swimming, walking or running'; 'sports involving weights and tight hand grip are not recommended for pianists'."
  - id: n35
    cau: "Bảng dấu hiệu cảnh báo: đau ở một điểm khi chơi và còn sau khi dừng thì dừng buổi tập và cho tay nghỉ, không đỡ thì đi khám; đau quay lại mỗi lần chơi một đoạn nhất định thì giảm thời lượng, xem lại kỹ thuật với thầy, còn kéo dài thì đi khám."
    loai: quy-tac
    nguon:
      - bapam-hp
      - nhs-rsi
    ket_qua: da-sua
    ghi_chu: 'BAPAM Healthy Pianist, Warning Signs: dừng khi đau, đau kéo dài thì đi khám. Cũ: "nghỉ chơi đàn vài ngày" (mốc "vài ngày" không có nguồn); đổi "cho tay nghỉ". Lưu ý: moi-ngay.yml (lô trước) trích hàng này; câu mới khác câu cũ, xem ghi_chu cuối hồ sơ (lệch).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/", "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: "NHS: đi khám nếu triệu chứng không hết hoặc nặng dần; BAPAM: không chơi khi khó chịu, giảm tải rồi quay lại dần."
  - id: n36
    cau: "Tê, kim châm ở ngón tay; yếu tay, vụng về khi cầm đồ vật; sưng hay đỏ quanh khớp ngón hoặc cổ tay: đi khám."
    loai: quy-tac
    nguon:
      - bapam-hp
      - nhs-rsi
    ket_qua: da-sua
    ghi_chu: 'BAPAM Warning Signs và NHS RSI: đau, nhói, tê, kim châm, yếu, vụng về, sưng là dấu hiệu cần đánh giá. Cũ: "nhất là về đêm hay lúc thức dậy" (đặc trưng hội chứng ống cổ tay, không nằm trong nguồn BAPAM/NHS RSI mở được), "rơi đồ, khó cài cúc, khó mở nắp chai", "sưng, nóng, đỏ". Rút gọn theo nguồn; bỏ "nóng".'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/" ]
    luot_2_ghi_chu: 'NHS: tê, kim châm, yếu, sưng là triệu chứng RSI; đi khám nếu không hết. "Đỏ" và "vụng về khi cầm đồ vật" không có trong trang.'
  - id: n37
    cau: "Đau không hết hoặc nặng dần, kể cả khi đã nghỉ chơi đàn: đi khám."
    loai: quy-tac
    nguon:
      - bapam-hp
      - nhs-rsi
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Đau cả khi không chơi đàn, ảnh hưởng sinh hoạt hay giấc ngủ | Đi khám sớm" (mốc "sớm" và "giấc ngủ" không có nguồn). BAPAM/NHS: đau kéo dài, nặng dần thì đi khám.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/" ]
    luot_2_ghi_chu: "NHS: đi khám nếu triệu chứng không hết hoặc nặng dần."
  - id: n38
    cau: 'Một ngón co quắp hay "không nghe lời" ở một động tác nhất định, không đau: gặp bác sĩ thần kinh (xem bên dưới).'
    loai: quy-tac
    nguon:
      - bapam-fd
    ket_qua: dung
    ghi_chu: "BAPAM Musicians' Focal Dystonia: thường không đau lúc đầu, ngón co hoặc không nghe lời khi chơi; hướng dẫn gặp bác sĩ thần kinh khớp n44. Giữ nguyên hàng."
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/musicians-focal-dystonia/" ]
    luot_2_ghi_chu: "BAPAM: bất thường vận động khi chơi, thường không đau lúc đầu; cần gặp bác sĩ thần kinh."
  - id: n39
    cau: 'Hộp "Khi vừa thấy đau": 1. Dừng lại, đừng chơi xuyên qua cơn đau, kể cả khi sắp đến ngày thi; 2. Ghi lại đau ở đâu, đoạn nào, sau bao lâu, tuần này có tập nhiều hơn không; 3. Quay lại từ từ khi đã hết đau hoặc theo chỉ dẫn bác sĩ: buổi ngắn, bài chậm, đơn giản, nhỏ tiếng, dừng ngay nếu đau trở lại.'
    loai: quy-tac
    nguon:
      - bapam-hp
      - bapam-rtp
    ket_qua: da-sua
    ghi_chu: 'BAPAM Healthy Pianist: dừng ngay khi đau. BAPAM Returning to Playing: quay lại chậm, đơn giản, nhỏ tiếng (khớp "bài chậm, đơn giản, nhỏ tiếng"). Cũ có bước 2 "Đừng uống thuốc giảm đau để tập tiếp: thuốc làm tắt tín hiệu, không chữa nguyên nhân": bỏ vì không có nguồn tầng 1–2 trong tài liệu đã mở (NHS RSI nói thuốc giảm đau là một cách điều trị, nên khẳng định cũ có thể lệch); bước còn lại đánh số lại 1–3. "bài dễ, chậm" đổi "bài chậm, đơn giản".'
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/return-to-play/", "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/" ]
    luot_2_ghi_chu: "BAPAM: không chơi khi khó chịu, quay lại dần, tìm chuyên gia khi có đau; ghi lại đau là ý thực hành."
  - id: n40
    cau: Loạn trương lực cơ khu trú ở nhạc công (musician's focal dystonia) là một rối loạn thần kinh hiếm gặp, ước tính khoảng 1–2% nhạc công chuyên nghiệp (Altenmüller và Jabusch, 2010; BAPAM).
    loai: so-lieu
    nguon:
      - bapam-fd
      - altenmuller
    ket_qua: da-sua
    ghi_chu: "BAPAM Musicians' Focal Dystonia: 1–2% nhạc công. Cũ ghi \"khoảng 1%\" gắn với Altenmüller và Jabusch 2010; chưa mở toàn văn bài Altenmüller để kiểm số 1%, nên đổi 1–2% theo BAPAM và ghi cả hai nguồn. CHƯA CHẮC: việc Altenmüller và Jabusch 2010 nêu đúng 1–2%; người giao có thể bỏ tên bài khỏi câu nếu không mở được toàn văn."
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/musicians-focal-dystonia/", "https://api.crossref.org/works/10.21091/mppa.2010.1002" ]
    luot_2_ghi_chu: "BAPAM: ước tính 1-2% nhạc công chuyên nghiệp; Altenmüller & Jabusch 2010: khoảng 1%."
  - id: n41
    cau: "Nó thường không đau lúc đầu: một hay vài ngón tự co vào một tư thế bất thường hoặc không nghe lời khi chơi đàn; những việc khác có thể vẫn bình thường, dù đôi khi vấn đề lan sang các việc tinh khác như viết hay gõ phím."
    loai: dinh-nghia
    nguon:
      - bapam-fd
    ket_qua: da-sua
    ghi_chu: "BAPAM Musicians' Focal Dystonia: thường không đau lúc đầu; có thể lan sang viết, gõ phím. Cũ: \"co quắp, duỗi cứng hoặc không nghe lời, chỉ khi làm đúng một động tác đã luyện rất nhiều trên đàn\" (chi tiết \"chỉ khi\" quá chắc, không có nguồn); viết lại nhẹ hơn."
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/musicians-focal-dystonia/" ]
    luot_2_ghi_chu: 'BAPAM: thường không đau lúc đầu, mất phối hợp khi chơi, việc ngoài đàn thường bình thường; "lan sang viết, gõ phím" không có trong trang.'
  - id: n42
    cau: Cố tập nhiều hơn để "sửa" có thể làm triệu chứng nặng thêm.
    loai: quy-tac
    nguon:
      - bapam-fd
    ket_qua: da-sua
    ghi_chu: "BAPAM Musicians' Focal Dystonia: tập thêm làm triệu chứng nặng hơn. Câu cũ \"thường không giúp được\" yếu hơn nguồn; viết lại đúng nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/musicians-focal-dystonia/" ]
    luot_2_ghi_chu: BAPAM khuyên tránh tập quá mức, nhất là khi gây đau; cần chẩn đoán đúng.
  - id: n43
    cau: 'Nhưng đừng vội hoảng: phần lớn những ngón tay "vụng" ở người mới học chỉ là chưa được tập đủ, hoặc đang bị căng.'
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ câu "phần lớn…" vì không có nguồn tầng 1–2 (khẳng định y khoa về tần suất, có thể khiến người đọc chủ quan). Hướng dẫn "nghi ngờ thì khám" ở n44 đã đủ. Review D4-gom: đã kiểm trang: câu "phần lớn những ngón tay vụng ở người mới…" không còn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn cho nhận định "phần lớn ngón vụng ở người mới chỉ là chưa tập đủ hoặc căng".
  - id: n44
    cau: Nếu nghi ngờ loạn trương lực, nhờ bác sĩ gia đình giới thiệu đến bác sĩ thần kinh có quan tâm đặc biệt đến rối loạn vận động; BAPAM cũng khuyên nên được chuyên gia y học nghệ thuật biểu diễn đánh giá khi bạn chơi đàn.
    loai: quy-tac
    nguon:
      - bapam-fd
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: "BAPAM Musicians' Focal Dystonia và The Healthy Pianist (When to visit a Specialist): GP giới thiệu, bác sĩ thần kinh quan tâm rối loạn vận động; chuyên gia y học nghệ thuật biểu diễn. Cũ: \"Nếu nghi ngờ, hãy gặp bác sĩ thần kinh, tốt nhất là người có kinh nghiệm về rối loạn vận động.\" Thêm bước bác sĩ gia đình giới thiệu và gợi ý của BAPAM; bớt \"tốt nhất là\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/musicians-focal-dystonia/" ]
    luot_2_ghi_chu: "BAPAM: nhờ bác sĩ gia đình giới thiệu đến bác sĩ thần kinh chuyên rối loạn vận động; tìm chuyên gia y học nghệ thuật biểu diễn."
  - id: n45
    cau: "Ở Việt Nam: bắt đầu bằng một bác sĩ ở cơ sở y tế bạn tin cậy, nói rõ mình chơi đàn và tập bao lâu mỗi ngày, nhờ giới thiệu đến chuyên khoa phù hợp; tê, yếu hay mất kiểm soát ngón tay thì nhờ giới thiệu đến bác sĩ thần kinh."
    loai: quy-tac
    nguon:
      - nhs-rsi
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: Cũ liệt kê cụ thể chuyên khoa (cơ xương khớp, chấn thương chỉnh hình, phục hồi chức năng, kỹ thuật viên vật lý trị liệu có thể hướng dẫn lộ trình quay lại) mà không có nguồn; thay bằng hướng dẫn chung "bác sĩ giới thiệu". Nhận định sức khỏe, dẫn NHS RSI và BAPAM (đi khám, bác sĩ giới thiệu); đề nghị người giao xem lại nếu muốn nêu chuyên khoa cụ thể ở Việt Nam.
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/", "https://www.bapam.org.uk/musicians-focal-dystonia/" ]
    luot_2_ghi_chu: Phần chung phù hợp NHS và BAPAM (đi khám, giới thiệu chuyên khoa thần kinh); không có nguồn riêng cho hệ thống y tế Việt Nam.
  - id: n46
    cau: "Mang theo khi đi khám: mô tả việc tập (bao lâu mỗi ngày, tập gì, gần đây có tăng thời lượng hay đổi bài không); một video ngắn quay bạn chơi đoạn gây đau từ bên cạnh và từ trên xuống; câu hỏi (nghỉ bao lâu, tránh động tác nào, quay lại theo lộ trình nào)."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên chuẩn bị đi khám, không khẳng định y khoa.
  - id: n47
    cau: "Khi bác sĩ đã cho phép chơi lại, nhờ thầy xem kỹ thuật ở đoạn gây đau: BAPAM khuyên xem lại cách chơi để đau khỏi tái phát, vì nguyên nhân có thể nằm ở một thói quen nhỏ như cổ tay khóa hay ngón cái ép chặt."
    loai: quy-tac
    nguon:
      - bapam-hp
      - bapam-rtp
    ket_qua: da-sua
    ghi_chu: 'BAPAM Healthy Pianist (Warning Signs / When to visit a Specialist) và Returning to Playing: xem lại kỹ thuật để tránh tái phát. Cũ: "nhiều khi nguyên nhân nằm ở một thói quen nhỏ…" (không nguồn); thêm "BAPAM khuyên…" và "có thể".'
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: 'BAPAM return-to-play: chỉnh kỹ thuật (ngón bấm, nhấn, phân câu) với chuyên gia sức khỏe nghệ thuật biểu diễn; "nhờ thầy" là diễn giải của site.'
  - id: n48
    cau: Ở Anh, BAPAM (British Association for Performing Arts Medicine) là tổ chức từ thiện y tế dành cho người làm nghề nghệ thuật biểu diễn ở Anh, có tư vấn miễn phí (tính đến 2026).
    loai: ten
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'bapam.org.uk: tổ chức từ thiện y tế, dịch vụ tư vấn miễn phí cho người làm nghề biểu diễn. Cũ: "khám miễn phí cho người làm và học nghệ thuật biểu diễn tại Anh". Bảng tầng: bỏ "miễn phí" nếu không có nguồn hiện hành; đã mở trang BAPAM nên giữ nhưng thêm "(tính đến 2026)" và đổi "khám" thành "tư vấn", bỏ "học". CHƯA CHẮC: điều kiện hiện hành của dịch vụ miễn phí (đối tượng, phạm vi); nên xem lại khi bảo trì.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/" ]
    luot_2_ghi_chu: 'BAPAM: "The Medical Charity for the Performing Arts", tư vấn y tế miễn phí, bảo mật. "Ở Anh" và mốc 2026 theo trang hiện tại.'
  - id: n49
    cau: Ở Mỹ, PAMA (Performing Arts Medicine Association) quy tụ chuyên gia y tế, nghệ sĩ, nhà giáo và nhà quản lý, và có danh bạ giới thiệu người cung cấp dịch vụ cho người biểu diễn.
    loai: ten
    nguon:
      - pama
    ket_qua: da-sua
    ghi_chu: 'artsmed.org: hội của chuyên gia y tế, nghệ sĩ, nhà giáo và nhà quản lý; có danh bạ. Cũ: "quy tụ bác sĩ, nhà trị liệu, nghệ sĩ và nhà giáo, và có danh bạ giới thiệu chuyên gia" (thiếu nhà quản lý, và "nhà trị liệu" không đối chiếu được); viết lại theo trang chủ.'
    luot_2: dung
    luot_2_nguon: [ "https://artsmed.org/" ]
    luot_2_ghi_chu: "PAMA: Performing Arts Medicine Association; thành viên là chuyên gia y tế, nghệ sĩ, nhà giáo, quản lý; có danh bạ giới thiệu."
  - id: n50
    cau: Nếu bạn sống ở những nước này, đó là nơi bạn có thể tìm đến.
    loai: quy-tac
    nguon:
      - bapam
      - pama
    ket_qua: da-sua
    ghi_chu: 'Cũ: "đó là nơi nên tìm đến trước tiên". Bỏ "trước tiên" vì dịch vụ ở nước ngoài không phải lựa chọn đầu tiên cho người ở Việt Nam (n45 đã nói bắt đầu từ bác sĩ gần nhà).'
