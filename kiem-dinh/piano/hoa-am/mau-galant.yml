nhan_dinh:
  - id: n1
    cau: "Mẫu (schema) là một khung hai bè: bass đi theo một chuỗi bậc, giai điệu theo một chuỗi bậc khác, khớp nhau từng bước."
    loai: dinh-nghia
    nguon:
      - omt-gs
      - omt-gss
      - gjerd2
    ket_qua: dung
    ghi_chu: OMT và Gjerdingen mô tả schema là cặp bậc bass và bậc giai điệu đi cùng nhau.
  - id: n2
    cau: Gjerdingen, trong Music in the Galant Style (2007), đã gom và đặt tên cho nhiều khung như thế.
    loai: lich-su
    nguon:
      - omt-gs
      - gjerd2
    ket_qua: dung
    ghi_chu: OMT trích Gjerdingen 2007 làm nguồn tên các mẫu.
  - id: n3
    cau: 'Mô tả cũ: Gjerdingen gom "vài chục khung".'
    loai: so-lieu
    nguon:
      - gjerd2
    ket_qua: da-sua
    ghi_chu: Không mở được nguồn nào nêu con số "vài chục"; trang nay nói "nhiều khung".
  - id: n4
    cau: 'Phong cách galant là lối viết thanh nhã của thế kỷ 18 mà Mozart thời trẻ cũng viết theo (cũ: "Haydn và Mozart lớn lên cùng").'
    loai: dinh-nghia
    nguon:
      - cod-gal
    ket_qua: da-sua
    ghi_chu: "COD: galant, thế kỷ 18, J. C. Bach, Stamitz, Mozart thời đầu; không nêu Haydn. Đã sửa theo COD."
  - id: n5
    cau: Gjerdingen gọi các mẫu là "câu nhạc có sẵn" (stock musical phrases).
    loai: dinh-nghia
    nguon:
      - omt-gs
    ket_qua: dung
    ghi_chu: OMT trích Gjerdingen 2007, tr. 6.
  - id: n6
    cau: "Fonte (suối), Monte (núi), Ponte (cầu): nghĩa các tên tiếng Ý."
    loai: ten
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: nghĩa từ vựng tiếng Ý, nguồn đã mở không giải thích tên. Người gom quyết định có chấp nhận chú nghĩa theo từ điển Ý hay bỏ. Cùng ý: các chú nghĩa tiếng Việt của kết (kết đơn, ghép, kép, hội tụ) là bản dịch của trang."
  - id: n7
    cau: Fonte, Monte, Ponte là cách gọi của nhà lý luận Joseph Riepel.
    loai: ten
    nguon:
      - omt-gs
    ket_qua: dung
    ghi_chu: 'OMT: "were described by Joseph Riepel".'
  - id: n8
    cau: Riepel là "nhà lý luận người Áo" (cũ).
    loai: nam
    nguon:
      - wiki-riepel
    ket_qua: da-sua
    ghi_chu: Chỉ có Wikipedia (bậc 3) nêu quốc tịch, và nói "sinh ở Áo, người Đức"; đã bỏ chữ "người Áo".
  - id: n9
    cau: Riepel là tác giả các sách lý luận in từ năm 1752.
    loai: nam
    nguon:
      - gmth-riepel
    ket_qua: dung
    ghi_chu: "Eckert (GMTH): Anfangsgründe zur musicalischen Setzkunst, 1752–1768."
  - id: n10
    cau: Fonte và Monte là những chuỗi hòa âm (sequence) ngắn.
    loai: cau-truc
    nguon:
      - omt-gs
    ket_qua: dung
    ghi_chu: "OMT: Fonte và Monte đi theo chuỗi (hai bước, dời một cung)."
  - id: n11
    cau: Meyer là tên đặt theo nhà âm nhạc học Leonard Meyer.
    loai: ten
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: OMT tóm tắt không nói nguồn gốc tên; chưa mở nguồn bậc 1 nào nói thế."
  - id: n12
    cau: Romanesca mượn tên một công thức bass đã được nhắc đến từ thế kỷ 16 và phổ biến trong thế kỷ 17.
    loai: lich-su
    nguon:
      - gjerd2
      - cod-rom
    ket_qua: dung
    ghi_chu: "Gjerdingen tr. 27: đặt tên ở thế kỷ 16, bass nền phổ biến ở thế kỷ 17; COD cùng ý."
  - id: n13
    cau: Gjerdingen tìm câu trả lời cho việc cả thế hệ dùng chung khung ở lối dạy partimento tại các nhạc viện Napoli.
    loai: lich-su
    nguon:
      - mto-rab
      - mto-byros
    ket_qua: dung
    ghi_chu: "MTO 21.3: schemata và partimento ở Napoli; đây là luận điểm của Gjerdingen."
  - id: n14
    cau: 'Conservatorio là trường ở Napoli, Venezia và vài thành phố Ý, nơi trẻ em được "gìn giữ" (conserved) và học nhạc (cũ: "trẻ mồ côi khắp châu Âu").'
    loai: dinh-nghia
    nguon:
      - cod-cons
    ket_qua: da-sua
    ghi_chu: 'COD: trẻ em được gìn giữ và dạy. Chữ "mồ côi" và "khắp châu Âu" không có nguồn nên bỏ.'
  - id: n15
    cau: Lối dạy partimento nở rộ ở các nhạc viện Ý trong thế kỷ 17–18.
    loai: lich-su
    nguon:
      - mto-rab
    ket_qua: dung
    ghi_chu: "MTO: Napoli và các nhạc viện Ý ở thế kỷ 17–18."
  - id: n16
    cau: Partimento là một bè bass viết trên một khuông, có khi kèm số, có khi không.
    loai: dinh-nghia
    nguon:
      - cod-part
      - mto-rab
      - gjerd2
    ket_qua: dung
    ghi_chu: 'MTO: thường không đánh số; Gjerdingen tr. 25: "the instructional bass".'
  - id: n17
    cau: Học trò ngồi vào đàn và biến partimento thành nhạc hoàn chỉnh, tự thêm hòa âm và giai điệu.
    loai: dinh-nghia
    nguon:
      - mto-rab
      - cod-part
    ket_qua: dung
  - id: n18
    cau: Học trò học thuộc cách hòa âm cho từng bậc bass (quy tắc quãng tám), các kiểu kết, các chuỗi bass hay gặp.
    loai: quy-tac
    nguon:
      - mto-rab
    ket_qua: dung
    ghi_chu: "MTO: rule of the octave, cadences, schemata."
  - id: n19
    cau: Francesco Durante và Fedele Fenaroli là những thầy làm partimento.
    loai: ten
    nguon:
      - mto-rab
    ket_qua: dung
    ghi_chu: MTO nêu Durante và Fenaroli.
  - id: n20
    cau: "Một chuỗi bass quen tự gọi ra một giai điệu quen: đó là các mẫu dưới đây."
    loai: cau-truc
    nguon:
      - mto-rab
      - omt-gs
    ket_qua: dung
    ghi_chu: "MTO: schemata là cặp bè ngoài (bass với giai điệu)."
  - id: n21
    cau: Ví dụ viết ba bè (giai điệu, một bè giữa, bass), mỗi bước một ô 3/4; riêng bốn kết mỗi bước một phách trong 4/4.
    loai: cau-truc
    nguon: []
    ket_qua: dung
    ghi_chu: Kiểm trên các khối abc 1–10 (xem khuong_nhac). Mô tả cách soạn của trang, không phải sự kiện bên ngoài.
  - id: n22
    cau: "Romanesca: giai điệu 1–5–1–1, bass 1–7–6–3, hòa âm I – V6 – vi – I6, mở đầu."
    loai: cau-truc
    nguon:
      - omt-gss
    ket_qua: dung
    ghi_chu: "OMT: 1–5–1–1 trên 1–7–6–3, nhóm mở đầu (opening gambit)."
  - id: n23
    cau: "Do–Re–Mi: giai điệu 1–2–3, bass 1–7–1, hòa âm I – V6 – I, mở đầu."
    loai: cau-truc
    nguon:
      - omt-gss
    ket_qua: dung
  - id: n24
    cau: "Meyer: giai điệu 1–7 … 4–3, bass 1–2 … 7–1, hòa âm I – V4/3 … V6/5 – I, mở đầu."
    loai: cau-truc
    nguon:
      - omt-gss
    ket_qua: dung
    ghi_chu: OMT cho bậc và nhóm mở đầu. Số La Mã đọc theo bass (bass 2 là V4/3, bass 7 là V6/5).
  - id: n25
    cau: "Prinner: giai điệu 6–5–4–3, bass 4–3–2–1, hòa âm IV – I6 – vii°6 – I; đứng ở vị trí trả lời."
    loai: cau-truc
    nguon:
      - omt-gss
    ket_qua: dung
    ghi_chu: "OMT: nhóm Answer/Process/Transition."
  - id: n26
    cau: "Fonte: giai điệu 5–4 … 4–3, bass ♯1–2 … 7–1 (hòa âm V6/5 của ii – ii … V6/5 – I)."
    loai: cau-truc
    nguon:
      - omt-gss
      - omt-gs
    ket_qua: dung
    ghi_chu: "OMT: 5–4–4–3 trên ↑1–2–7–1, tonicize ii rồi I."
  - id: n27
    cau: "Monte: giai điệu ♭7–6 … 1–7, bass 3–4 … ♯4–5."
    loai: cau-truc
    nguon:
      - omt-gss
      - omt-gs
    ket_qua: dung
    ghi_chu: "OMT: bass 3–4–↑4–5, V/IV rồi V/V."
  - id: n28
    cau: "Ponte: giai điệu 5–7–2 trên bass giữ nguyên bậc 5."
    loai: cau-truc
    nguon:
      - omt-gss
    ket_qua: dung
    ghi_chu: "OMT: 5–7–2 trên pedal bậc 5."
  - id: n29
    cau: "Quiescenza: giai điệu ♭7–6–♮7–1 trên bass chủ âm giữ nguyên, đến sau kết."
    loai: cau-truc
    nguon:
      - omt-gss
    ket_qua: dung
    ghi_chu: "OMT: te–la–ti–do trên bass chủ âm, post-cadential."
  - id: n30
    cau: Fonte, Monte và Ponte thường đứng ngay sau vạch nhắc lại (Fonte đi xuống, Monte đi lên, Ponte chờ trên át âm).
    loai: cau-truc
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: OMT xếp ba mẫu vào nhóm Answer/Process/Transition và không nhắc vạch nhắc lại hay nửa sau của bài hai đoạn. Hướng đi xuống/lên/đứng chờ thì đúng theo bass."
  - id: n31
    cau: Hòa âm của Monte đọc là V6/5 của IV – IV … V6/5 của V – V.
    loai: cau-truc
    nguon:
      - omt-gss
    ket_qua: null
    ghi_chu: "chưa chắc: OMT chỉ nêu V/IV rồi V/V; số chỉ thể đảo là cách đọc của người soạn trang."
