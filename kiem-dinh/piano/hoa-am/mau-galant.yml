nhan_dinh:
  - id: n1
    cau: "Mẫu (schema) là một khung hai bè: bass đi theo một chuỗi bậc, giai điệu theo một chuỗi bậc khác, khớp nhau từng bước."
    loai: dinh-nghia
    nguon:
      - omt-gs
      - omt-gss
      - gjerd2
    ket_qua: dung
    ghi_chu: OMT và Gjerdingen mô tả schema là cặp bậc bass và bậc giai điệu đi cùng nhau.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/", "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas-summary/" ]
    luot_2_ghi_chu: "OMT: schema là khung bè trên và bass theo chuỗi bậc cố định."
  - id: n2
    cau: Gjerdingen, trong Music in the Galant Style (2007), đã gom và đặt tên cho nhiều khung như thế.
    loai: lich-su
    nguon:
      - omt-gs
      - gjerd2
    ket_qua: dung
    ghi_chu: OMT trích Gjerdingen 2007 làm nguồn tên các mẫu.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/", "https://academic.oup.com/book/49369" ]
    luot_2_ghi_chu: "OMT trích Gjerdingen 2007; OUP: Music in the Galant Style, 5/10/2007."
  - id: n3
    cau: 'Mô tả cũ: Gjerdingen gom "vài chục khung".'
    loai: so-lieu
    nguon:
      - gjerd2
    ket_qua: da-sua
    ghi_chu: 'Không mở được nguồn nào nêu con số "vài chục"; trang nay nói "nhiều khung". Review D4-gom: lượt 2 khong-chac vì con số "vài chục"; trang đã bỏ con số (chữ mới "nhiều khung như thế"), OMT Galant Schemas và bảng tóm tắt liệt kê hơn hai mươi mẫu nên "nhiều" đúng.'
    luot_2: khong-chac
    luot_2_ghi_chu: Con số "vài chục" là mô tả cũ, nguồn mở không nêu số khung của Gjerdingen.
  - id: n4
    cau: 'Phong cách galant là lối viết thanh nhã của thế kỷ 18 mà Mozart thời trẻ cũng viết theo (cũ: "Haydn và Mozart lớn lên cùng").'
    loai: dinh-nghia
    nguon:
      - cod-gal
    ket_qua: da-sua
    ghi_chu: "COD: galant, thế kỷ 18, J. C. Bach, Stamitz, Mozart thời đầu; không nêu Haydn. Đã sửa theo COD."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/galant" ]
    luot_2_ghi_chu: "Concise Oxford: galant là lối thanh nhã (courtly) thế kỷ 18; nêu J. C. Bach, nhà Stamitz và Mozart thời trẻ."
  - id: n5
    cau: Gjerdingen gọi các mẫu là "câu nhạc có sẵn" (stock musical phrases).
    loai: dinh-nghia
    nguon:
      - omt-gs
    ket_qua: dung
    ghi_chu: OMT trích Gjerdingen 2007, tr. 6.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/" ]
    luot_2_ghi_chu: "OMT: schema là stock musical phrases (Gjerdingen 2007, tr. 6)."
  - id: n6
    cau: "Fonte (giếng, nguồn nước), Monte (núi), Ponte (cầu): nghĩa các tên tiếng Ý."
    loai: ten
    nguon: [ omt1e-cont ]
    ket_qua: da-sua
    ghi_chu: "chưa chắc: nghĩa từ vựng tiếng Ý, nguồn đã mở không giải thích tên. Người gom quyết định có chấp nhận chú nghĩa theo từ điển Ý hay bỏ. Cùng ý: các chú nghĩa tiếng Việt của kết (kết đơn, ghép, kép, hội tụ) là bản dịch của trang. Review D4-gom: OMT 1e, 5.14: Fonte \"fountain\" hay \"well\", Monte \"mountain\", Ponte \"bridge\". Chữ cũ \"Fonte (suối)\": \"suối\" không khớp \"fountain/well\"; chữ mới \"Fonte (giếng, nguồn nước)\". Chữ mới cần lượt 2 bổ sung. Người gom (D4-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, encyclopedia.com, OMT, IMSLP chặn hay lỗi), không phải vì nguồn nói khác; giữ theo nguồn lượt 1 và review đã mở, ghi ở trên."
    luot_2: khong-chac
    luot_2_ghi_chu: OMT chỉ nói tên do Riepel mô tả, không giải nghĩa; nghĩa tiếng Ý (giếng/nguồn, núi, cầu) là từ vựng phổ thông, không thấy mâu thuẫn.
  - id: n7
    cau: Fonte, Monte, Ponte là cách gọi của nhà lý luận Joseph Riepel.
    loai: ten
    nguon:
      - omt-gs
    ket_qua: dung
    ghi_chu: 'OMT: "were described by Joseph Riepel".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/" ]
    luot_2_ghi_chu: "OMT: Monte, Fonte, Ponte do Riepel mô tả."
  - id: n8
    cau: Riepel là "nhà lý luận người Áo" (cũ).
    loai: nam
    nguon:
      - wiki-riepel
    ket_qua: da-sua
    ghi_chu: 'Chỉ có Wikipedia (bậc 3) nêu quốc tịch, và nói "sinh ở Áo, người Đức"; đã bỏ chữ "người Áo". Review D4-gom: đã xem trang: không còn "người Áo"; câu trên trang chỉ còn "nhà lý luận Joseph Riepel, tác giả các sách lý luận in từ năm 1752" (n9).'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Wikipedia (chỉ để tìm nguồn): sinh ở Thượng Áo, mất ở Regensburg, thường gọi "Austrian-born German". Gọi chung "người Áo" là đơn giản hóa; chưa mở Grove để chốt.'
  - id: n9
    cau: Riepel là tác giả các sách lý luận in từ năm 1752.
    loai: nam
    nguon:
      - gmth-riepel
    ket_qua: dung
    ghi_chu: "Eckert (GMTH): Anfangsgründe zur musicalischen Setzkunst, 1752–1768."
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Joseph_Riepel" ]
    luot_2_ghi_chu: "Anfangsgründe zur Musikalischen Setzkunst xuất bản 1752 (nguồn tìm được: Wikipedia, dẫn Grove/MGG; chưa mở Grove)."
  - id: n10
    cau: Fonte và Monte là những chuỗi hòa âm (sequence) ngắn.
    loai: cau-truc
    nguon:
      - omt-gs
    ket_qua: dung
    ghi_chu: "OMT: Fonte và Monte đi theo chuỗi (hai bước, dời một cung)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas-summary/", "https://en.wikipedia.org/wiki/Galant_Schemata" ]
    luot_2_ghi_chu: Fonte/Monte là chuỗi hòa âm ngắn (liên quan chuỗi quãng 5 xuống / quãng 10 song song lên).
  - id: n11
    cau: Meyer là tên đặt theo nhà âm nhạc học Leonard Meyer.
    loai: ten
    nguon: [ omt-gs ]
    ket_qua: dung
    ghi_chu: "chưa chắc: OMT tóm tắt không nói nguồn gốc tên; chưa mở nguồn bậc 1 nào nói thế. Review D4-gom: OMT Galant Schemas (đã mở lại): \"the Meyer is named after Leonard Meyer\"."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/" ]
    luot_2_ghi_chu: "OMT: Meyer đặt tên theo Leonard Meyer."
  - id: n12
    cau: Romanesca mượn tên một công thức bass đã được nhắc đến từ thế kỷ 16 và phổ biến trong thế kỷ 17.
    loai: lich-su
    nguon:
      - gjerd2
      - cod-rom
    ket_qua: dung
    ghi_chu: "Gjerdingen tr. 27: đặt tên ở thế kỷ 16, bass nền phổ biến ở thế kỷ 17; COD cùng ý."
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Galant_Schemata", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/romanesca" ]
    luot_2_ghi_chu: "Concise Oxford: giai điệu romanesca dùng nhiều như ground bass thế kỷ 17; Wikipedia: có từ thế kỷ 16."
  - id: n13
    cau: Gjerdingen tìm câu trả lời cho việc cả thế hệ dùng chung khung ở lối dạy partimento tại các nhạc viện Napoli.
    loai: lich-su
    nguon:
      - mto-rab
      - mto-byros
    ket_qua: dung
    ghi_chu: "MTO 21.3: schemata và partimento ở Napoli; đây là luận điểm của Gjerdingen."
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Galant_Schemata", "https://en.wikipedia.org/wiki/Partimento" ]
    luot_2_ghi_chu: Truyền thống partimento ở nhạc viện Napoli được dùng để giải thích việc dùng chung khung.
  - id: n14
    cau: 'Conservatorio là trường ở Napoli, Venezia và những nơi khác, nơi trẻ em được "gìn giữ" (conserved) và học nhạc.'
    loai: dinh-nghia
    nguon:
      - cod-cons
    ket_qua: da-sua
    ghi_chu: 'COD: trẻ em được gìn giữ và dạy. Chữ "mồ côi" và "khắp châu Âu" không có nguồn nên bỏ. Review D4-gom: COD, conservatory (đã mở lại): "Name derived from It. conservatorio, a sch. in Naples, Venice, and elsewhere where children were ''conserved''" "and educated in mus. and other matters". COD nói "elsewhere", không nói "thành phố Ý": chữ "và vài thành phố Ý khác" đổi thành "và những nơi khác". Chữ mới cần lượt 2 bổ sung.'
    luot_2: dung
    luot_2_nguon: [ "https://www.naplesldm.com/muscon.php" ]
    luot_2_ghi_chu: "Nguồn: conservatorio vốn là nơi 'conserve' (giữ gìn) trẻ mồ côi và phụ nữ; đào tạo nhạc mạnh ở Napoli và Venezia."
  - id: n15
    cau: Lối dạy partimento nở rộ ở các nhạc viện Ý trong thế kỷ 17–18.
    loai: lich-su
    nguon:
      - mto-rab
    ket_qua: dung
    ghi_chu: "MTO: Napoli và các nhạc viện Ý ở thế kỷ 17–18."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/partimento", "https://en.wikipedia.org/wiki/Partimento" ]
    luot_2_ghi_chu: Partimento là lối dạy ở nhạc viện Ý, nhất là Napoli, từ cuối thế kỷ 17 đến đầu thế kỷ 19.
  - id: n16
    cau: Partimento là một bè bass viết trên một khuông, có khi kèm số, có khi không.
    loai: dinh-nghia
    nguon:
      - cod-part
      - mto-rab
      - gjerd2
    ket_qua: dung
    ghi_chu: 'MTO: thường không đánh số; Gjerdingen tr. 25: "the instructional bass".'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/partimento", "https://en.wikipedia.org/wiki/Partimento" ]
    luot_2_ghi_chu: "Partimento là bè bass trên một khuông, thường có số: đúng."
  - id: n17
    cau: Học trò ngồi vào đàn và biến partimento thành nhạc hoàn chỉnh, tự thêm hòa âm và giai điệu.
    loai: dinh-nghia
    nguon:
      - mto-rab
      - cod-part
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/partimento", "https://en.wikipedia.org/wiki/Partimento" ]
    luot_2_ghi_chu: "Học trò biến bass thành nhạc hoàn chỉnh ngay trên bàn phím: đúng."
  - id: n18
    cau: Học trò học thuộc cách hòa âm cho từng bậc bass (quy tắc quãng tám), các kiểu kết, các chuỗi bass hay gặp.
    loai: quy-tac
    nguon:
      - mto-rab
    ket_qua: dung
    ghi_chu: "MTO: rule of the octave, cadences, schemata."
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Partimento" ]
    luot_2_ghi_chu: "Wikipedia (tìm nguồn): quy tắc quãng tám và các kiểu kết là bài học nền; khớp."
  - id: n19
    cau: Francesco Durante và Fedele Fenaroli là những thầy làm partimento.
    loai: ten
    nguon:
      - mto-rab
    ket_qua: dung
    ghi_chu: MTO nêu Durante và Fenaroli.
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Partimento" ]
    luot_2_ghi_chu: Durante và Fenaroli đều có partimenti/Regole nổi tiếng.
  - id: n20
    cau: "Một chuỗi bass quen tự gọi ra một giai điệu quen: đó là các mẫu dưới đây."
    loai: cau-truc
    nguon:
      - mto-rab
      - omt-gs
    ket_qua: dung
