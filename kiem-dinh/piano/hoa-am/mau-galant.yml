    moi: "Quiescenza đến sau kết: bass giữ chủ âm, giai điệu ♭7–6–♮7–1, bè giữa 3–4–4–3. Si♭ thoáng nghiêng về hạ át âm, Si♮ kéo trở lại, nhạc như thở ra trước khi dừng hẳn."
