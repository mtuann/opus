  - id: n40
    cau: 'Các dòng "Giọng khác": Romanesca ở Sol và Fa, Do–Re–Mi ở Đô và Rê, Meyer, Prinner, Fonte, Monte, Ponte, Quiescenza ở Sol (Prinner thêm Fa).'
