    cau: "Hình ::hinh{ten=\"galant\"} ngay dưới bảng đầu trang vẽ tám mẫu của bảng, mỗi mẫu một thẻ: hàng trên là bậc giai điệu, hàng dưới là bậc bass, trong vòng tròn, cùng cột là cùng một bước; \"…\" ngăn hai cặp nốt (Meyer, Fonte, Monte); \"giữ nguyên\" là thanh dài (Ponte, Quiescenza). Các bậc đúng cột Giai điệu và Bass của bảng."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 06/11/2026) và file src/components/hinh/galant.html. Từng thẻ đọc lại thành chữ khớp bảng: Romanesca 1–5–1–1 / 1–7–6–3; Do–Re–Mi 1–2–3 / 1–7–1; Meyer 1–7 … 4–3 / 1–2 … 7–1; Prinner 6–5–4–3 / 4–3–2–1; Fonte 5–4 … 4–3 / ♯1–2 … 7–1; Monte ♭7–6 … 1–7 / 3–4 … ♯4–5; Ponte 5–7–2 / 5 giữ nguyên (thanh dài ba bước); Quiescenza ♭7–6–♮7–1 / 1 giữ nguyên (bốn bước) (tests/hinh-ve-lai-bang.test.mjs so tự động; kiểm thử trình duyệt đo bước giai điệu và bass cùng cột). Cách đọc vòng tròn trang đã nói (\"số trong vòng tròn là bậc: phía trên khuông là giai điệu, phía dưới là bass\"). Không vẽ cột hòa âm, \"Thường đứng ở\", hay hai nửa lệch bậc của Fonte/Monte (đề xuất 26 có ý này nhưng trang không viết thành chữ), nên hình không nói điều mới. Soát hình 2C (gộp review và kiểm mẫu): người soát không phải người vẽ; đọc src/components/hinh/galant.html và HTML trong dist/piano/hoa-am/mau-galant/index.html (bản xem, 07/11/2026), ảnh chụp 360 px tối. Đọc lại từng thẻ, so với bảng: Romanesca 1 5 1 1 / 1 7 6 3; Do–Re–Mi 1 2 3 / 1 7 1; Meyer 1 7 … 4 3 / 1 2 … 7 1; Prinner 6 5 4 3 / 4 3 2 1; Fonte 5 4 … 4 3 / ♯1 2 … 7 1; Monte ♭7 6 … 1 7 / 3 4 … ♯4 5; Ponte 5 7 2 / thanh 5 giữ nguyên dài ba bước; Quiescenza ♭7 6 ♮7 1 / thanh 1 giữ nguyên dài bốn bước: đủ tám mẫu, đúng thứ tự bảng, đúng dấu hóa. Cùng cột là cùng bước (trang: \"khớp nhau từng bước\"); vòng là bậc, giai điệu trên, bass dưới như câu của trang. Không vẽ hòa âm, vị trí trong bài hay hai nửa lệch bậc. Hình không nói điều trang không viết."
    review: dung
khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem: &a1
      - cu-phap
      - nhip
      - giong
      - hop-am
      - bac-bass
      - giai-dieu
      - dan-be
