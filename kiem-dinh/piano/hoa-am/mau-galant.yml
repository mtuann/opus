    moi: "Giọng khác: ở Sol trưởng, giai điệu Fa♮ – Mi – Fa♯ – Sol, bè giữa Si – Đô – Đô – Si trên âm nền Sol. Bạn sẽ dùng đúng hình này để dạo đầu ở trang Ứng tác. Gặp ở đâu: sau kết cuối của một đoạn hay cả bài."
