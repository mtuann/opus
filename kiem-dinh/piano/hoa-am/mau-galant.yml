    ket_qua: dung
    ghi_chu: "Soạn cho trang. Romanesca, 3/4, K:C. Bass Đô3 – Si2 – La2 – Mi3 (1–7–6–3), giai điệu Đô5 – Sol4 – Đô5 – Đô5 (1–5–1–1), bè giữa Mi – Rê – Mi – Sol: hợp âm I, V6, vi, I6 khớp OMT. Không có quãng 5 hay 8 song song giữa giai điệu và bass. Ngón gợi ý hợp lý. Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 2
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Do–Re–Mi ở Sol, 3/4. Ô 1–2: bass 1–7–1 (Sol – Fa♯ – Sol), giai điệu 1–2–3. Ô 3–4 là biến thể soạn riêng, bass 1–5–1, ghi rõ trên trang (n41). Fa♯ trong khóa Sol đúng. Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 3
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Meyer ở Đô, 3/4. Giai điệu Đô5 – Si4 – Fa5 – Mi5 (1–7–4–3), bass Đô – Rê – Si – Đô (1–2–7–1). Lưu ý: giai điệu nhảy Si4 lên Fa5 là quãng 5 giảm (tritone); đây là đặc điểm của mẫu (7 lên 4), người gom cân nhắc có cần chú thích không. Si ở bass nghịch giải quyết lên Đô, Fa xuống Mi. Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 4
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Prinner và Prinner chuyển giọng, 8 ô, 3/4, Q:88. Ô 1–4: giai điệu 6–5–4–3 (La, Sol, Fa, Mi) trên bass Fa – Mi – Rê – Đô, song song quãng 10. Ô 5–8: giai điệu 3–2–1–7 (Mi, Rê, Đô, Si) trên bass Đô – Si – La – Sol, Fa♯ ở ô 7. Bè giữa không tạo 5/8 song song với bass. Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 5
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Fonte ở Đô, 3/4. Bass Đô♯ – Rê – Si – Đô (♯1–2–7–1), giai điệu Sol – Fa – Fa – Mi (5–4–4–3): Sol trên Đô♯ là quãng 5 giảm mở ra Fa trên Rê (quãng 3), rồi lặp ở Si – Đô. Đúng OMT. Đô♯ có dấu thăng cho bass. Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 6
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Monte ở Đô, 3/4. Bass Mi – Fa – Fa♯ – Sol (3–4–♯4–5), giai điệu Si♭ – La – Đô – Si (♭7–6–1–7). Si♭ trên Mi là quãng 5 giảm mở ra La trên Fa; Đô trên Fa♯ là quãng 5 giảm mở ra Si trên Sol (quãng 3). Khớp OMT. Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 7
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Ponte ở Đô, 3/4, 5 ô. Bass Sol2 giữ 4 ô rồi Đô3; giai điệu Sol – Si – Rê – Fa (5–7–2–4) rồi Mi (3) khi bass về Đô. 5–7–2 khớp OMT; nốt 4 và 3 là phần thêm của ví dụ (n53). Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 8
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Bốn kết ở Đô, 4/4 (mỗi bước một phách), Q:72. Semplice: bass Mi – Fa – Sol (nửa) – Đô, giai điệu Đô – Rê – Rê – Đô. Composta: bass Mi – Fa – Sol(2) – Đô, giai điệu Đô – Rê – Mi – Rê – Đô với bè giữa. Doppia: bass Sol giữ cả ô rồi Đô, giai điệu 4–3–2–2–1. Hội tụ: bass Mi – Fa – Fa♯(2) – Sol, giai điệu Mi – Rê – Đô(2) – Si. Khớp bảng OMT; ô cuối có nghỉ để đủ 4 phách. Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 9
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Quiescenza ở Đô, 3/4. Bass Đô giữ 4 ô, giai điệu Si♭ – La – Si♮ – Đô (♭7–6–♮7–1), bè giữa Mi – Fa – Fa – Mi. Giai điệu khớp OMT (te–la–ti–do trên bass chủ âm); bè giữa do người soạn (n62). Chạy node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 10
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Ví dụ ghép 8 ô, 3/4, K:C với Fa♯ tạm khi sang Sol (chấp nhận được, chỉ một Fa♯ lặp lại). Giai điệu Đô – Rê – Mi (Do–Re–Mi, bass Đô – Si – Đô); Mi, Rê, Đô, Si ở ô 3–6 là Prinner chuyển giọng trên bass Đô – Si – La – Sol; ô 7 [Sol Si] trên Rê (6/4) rồi [Fa♯ La] (V) rồi ô 8 [Rê Sol] trên Sol: kết ở Sol. Nốt Mi chung giữa hai mẫu đúng như trang nói (n42, n68). Chạy node tools/khuong-nhac.mjs: 0 lỗi."
ghi_chu: 'Trang mẫu galant (tầng lõi), 10 khối abc soạn riêng, lượt 1 (D4-L4 phần B). Nguồn chính: OMT Galant Schemas và bảng tóm tắt (mở và đọc), Gjerdingen chương 2 (UCI, tr. 25–40), COD qua Encyclopedia.com, MTO 21.3 (Rabinovitch–Slominski, Byros), Eckert (GMTH) cho Riepel; Wikipedia chỉ bậc 3. Khớp bài 29 (đã khóa): dạng nhảy 1–5–6–3 và dạng galant 1–7–6–3, cùng nguồn Gjerdingen tr. 28–33; trang đã thêm link sang bài 29, không phải sửa bài 29. Đã bỏ câu "1–7–6–5" (sai). Cần giữ theo các lô trước (grep piano/hoa-am kiem-dinh/): nhac-ly/29 n18 (đoạn Romanesca và link ngược về bài 29), luyen-tai/nghe-tien-trinh n17–n19 (Romanesca 1–7–6–3, Prinner 4–3–2–1), piano/index (Romanesca, Prinner, Fonte, Monte, Ponte, ứng tác), nhac-ly/index n9: tất cả khớp, không có điểm lệch. Link tới trang chưa chuyển: tai-lieu-tham-khao (n78), tồn tại ở site cũ, giữ link. Thuật ngữ chưa có trong src/data/thuat-ngu.yml (không tạo hồ sơ): schema, phong cách galant, Romanesca, Prinner, Do–Re–Mi, Meyer, Fonte, Monte, Ponte, Quiescenza, kết hội tụ, cadenza semplice/composta/doppia (kết đơn/ghép/kép), partimento, quy tắc quãng tám, conservatorio, opening gambit. Chưa chắc (ket_qua null): n6 (nghĩa tên Ý), n11 (Meyer), n30 (vị trí sau vạch nhắc lại), n31, n32, n34, n54, n62, n64, n85, n86. Ngân sách WebSearch hết nên không tra thêm. Review D4-gom (nhóm E, 28/10/2026): nghĩa Fonte/Monte/Ponte, Riepel, vị trí sau vạch nhắc lại và Ponte trước khi chủ đề trở lại có nguồn OMT 1e (5.14); Meyer theo Leonard Meyer (OMT); Quiescenza bỏ chú nghĩa; Romanesca hai dạng "chính" (không "cũ hơn"), khớp bài 29; n48 (Prinner bước 3 là vii°6) trang đã đúng; n58 doppia khớp OMT, viết rõ bè giữa; n60 composta có I6 ở đầu; conservatorio theo COD ("and elsewhere"); sách ở mục Nguồn có trang nhà xuất bản/thư viện.'
doi_chu:
  - cu: "Âm nhạc thế kỷ 18 được ghép từ những khung hai bè quen thuộc: một chuỗi bậc ở bass đi cùng một chuỗi bậc ở giai điệu. Trang này dạy tám khung thông dụng nhất và các kiểu kết chúng dẫn tới, như những hình tay chơi được ở mọi giọng. Học xong, bạn có sẵn vốn từ để ứng tác, và nhận ra chúng trong minuet, sonatina, sonata bạn đang tập."
    moi: "Âm nhạc thế kỷ 18 được ghép từ những khung hai bè quen thuộc: một chuỗi bậc ở bass đi cùng một chuỗi bậc ở giai điệu. Trang này dạy tám khung quen thuộc và các kiểu kết chúng dẫn tới, như những hình tay chơi được ở mọi giọng. Học xong, bạn có sẵn vốn từ để ứng tác, và nhận ra chúng trong minuet, sonatina, sonata bạn đang tập."
    ly_do: "n74 (da-sua): Không có nguồn xếp hạng."
  - cu:
      - 'Mẫu (schema, số nhiều schemata) là một khung hai bè: bass đi theo một chuỗi bậc, giai điệu theo một chuỗi bậc khác, khớp nhau từng bước. Nhà âm nhạc học Robert Gjerdingen, trong cuốn Music in the Galant Style (2007), đã gom và đặt tên cho vài chục khung như thế trong phong cách galant, ngôn ngữ âm nhạc giữa thế kỷ 18 mà Haydn và Mozart lớn lên cùng. Ông gọi chúng là những "câu nhạc có sẵn"; với người học đàn, chúng giống thành ngữ của một ngôn ngữ.'
      - "Vài cái tên có từ thế kỷ 18: Fonte (suối), Monte (núi) và Ponte (cầu) là cách gọi của nhà lý luận người Áo Joseph Riepel. Fonte và Monte là những chuỗi hòa âm (sequence) ngắn. Những tên khác do Gjerdingen đặt: Meyer theo nhà âm nhạc học Leonard Meyer; Romanesca mượn tên một công thức bass thế kỷ 16–17, dùng để hát thơ và làm nền cho biến tấu."
      - "Vì sao cả một thế hệ nhạc sĩ dùng chung những khung này? Gjerdingen tìm câu trả lời ở lối dạy partimento tại các nhạc viện Napoli. Các nhạc viện ấy vốn là nơi nuôi trẻ mồ côi (conservatorio gốc nghĩa là nơi gìn giữ), và trong thế kỷ 18 đã đào tạo nhiều nhạc sĩ làm việc khắp châu Âu. Một partimento là một bè bass viết trên một khuông, có khi kèm số (bè trầm số), có khi không; học trò ngồi vào đàn và biến nó thành nhạc hoàn chỉnh, tự thêm hòa âm và giai điệu. Các em học thuộc cách hòa âm cho từng bậc của bass (quy tắc quãng tám, regola dell'ottava), các kiểu kết và những chuỗi bass hay gặp, rồi làm thật nhiều partimento của các thầy như Francesco Durante hay Fedele Fenaroli. Đến lúc ấy, một chuỗi bass quen tự gọi ra một giai điệu quen: đó chính là các mẫu dưới đây."
      - "Trong các ví dụ, số trong vòng tròn là bậc: phía trên khuông là giai điệu, phía dưới là bass. Ví dụ viết ba bè (tay phải giai điệu và một bè giữa, tay trái bass), mỗi bước của mẫu một ô 3/4 như trong minuet; trong nhạc thật, một mẫu có thể gọn hơn hay giãn ra."
    moi:
      - 'Mẫu (schema, số nhiều schemata) là một khung hai bè: bass đi theo một chuỗi bậc, giai điệu theo một chuỗi bậc khác, khớp nhau từng bước. Nhà âm nhạc học Robert Gjerdingen, trong cuốn Music in the Galant Style (2007), đã gom và đặt tên cho nhiều khung như thế trong phong cách galant, lối viết thanh nhã của thế kỷ 18 mà Mozart thời trẻ cũng viết theo. Ông gọi chúng là những "câu nhạc có sẵn"; với người học đàn, chúng giống thành ngữ của một ngôn ngữ.'
      - "Vài cái tên có từ thế kỷ 18: Fonte (giếng, nguồn nước), Monte (núi) và Ponte (cầu) là cách gọi của nhà lý luận Joseph Riepel, tác giả các sách lý luận in từ năm 1752. Fonte và Monte là những chuỗi hòa âm (sequence) ngắn. Có tên đặt theo người nghiên cứu: Meyer, theo nhà âm nhạc học Leonard Meyer. Romanesca mượn tên một công thức bass đã được nhắc đến từ thế kỷ 16 và phổ biến trong thế kỷ 17."
      - "Vì sao cả một thế hệ nhạc sĩ dùng chung những khung này? Gjerdingen tìm câu trả lời ở lối dạy partimento tại các nhạc viện Napoli. Conservatorio là trường ở Napoli, Venezia và những nơi khác, nơi trẻ em được \"gìn giữ\" (conserved) và học nhạc; lối dạy partimento nở rộ ở đó trong thế kỷ 17–18. Một partimento là một bè bass viết trên một khuông, có khi kèm số (bè trầm số), có khi không; học trò ngồi vào đàn và biến nó thành nhạc hoàn chỉnh, tự thêm hòa âm và giai điệu. Các em học thuộc cách hòa âm cho từng bậc của bass (quy tắc quãng tám, regola dell'ottava), các kiểu kết và những chuỗi bass hay gặp, rồi làm các partimento của những thầy như Francesco Durante hay Fedele Fenaroli. Đến lúc ấy, một chuỗi bass quen tự gọi ra một giai điệu quen: đó chính là các mẫu dưới đây."
      - "Trong các ví dụ, số trong vòng tròn là bậc: phía trên khuông là giai điệu, phía dưới là bass. Ví dụ viết ba bè (tay phải giai điệu và một bè giữa, tay trái bass), mỗi bước của mẫu thường là một ô 3/4 như trong minuet (Do–Re–Mi gói hai bước đầu vào một ô; riêng bốn kết ở mục Kết, mỗi bước một phách trong nhịp 4/4); trong nhạc thật, một mẫu có thể gọn hơn hay giãn ra."
    ly_do: 'n3 (da-sua): Không có nguồn cho con số "vài chục".; n4 (da-sua): COD (Galant) không nêu Haydn.; n8 (da-sua): Quốc tịch chỉ có ở Wikipedia (bậc 3), không rõ ràng.; n14 (da-sua): COD (Conservatory) không nói mồ côi, không nói khắp châu Âu.; n63 (da-bo): Ẩn dụ không có nguồn.; n6 (da-sua, review D4-gom): OMT 1e: Fonte "fountain" hay "well".; n14 (da-sua, review D4-gom): COD: "Naples, Venice, and elsewhere".; n21 (da-sua, review D4-gom): khối abc 2 gói hai bước đầu của Do–Re–Mi vào một ô.'
  - cu: 5–7–2(–4)
    moi: 5–7–2
    ly_do: 'n53 (da-sua): OMT chỉ nêu 5–7–2; nốt 4 là của ví dụ.; n11: Meyer và nhóm mẫu mở đầu (Pastorella, Jupiter, Aprile) mô tả theo OMT thay cho câu gán cho Gjerdingen.; n53: Ponte theo OMT chỉ gồm 5–7–2 trên bass bậc 5; nốt 4 và việc rơi xuống 3 ghi là của ví dụ; bỏ câu "giữ càng lâu…".; n11: Meyer và nhóm mẫu mở đầu (Pastorella, Jupiter, Aprile) mô tả theo OMT thay cho câu gán cho Gjerdingen.; n53: Ponte theo OMT chỉ gồm 5–7–2 trên bass bậc 5; nốt 4 và việc rơi xuống 3 ghi là của ví dụ; bỏ câu "giữ càng lâu…".'
  - cu: Romanesca là mẫu mở đầu nổi tiếng nhất. Bass đi xuống 1–7–6 rồi nhảy về 3; giai điệu 1–5–1–1. Hòa âm I – V6 – vi – I6 xen kẽ hợp âm thể gốc và thể đảo 1, nên dù bass tuột dần, câu nhạc vẫn vững. Gjerdingen gọi nó là một "nước khai cuộc" (opening gambit), như trong cờ.
    moi: Romanesca là một mẫu mở đầu. Bass đi xuống 1–7–6 rồi nhảy về 3; giai điệu 1–5–1–1. Hòa âm I – V6 – vi – I6 xen kẽ hợp âm thể gốc và thể đảo 1. Bảng tóm tắt của OMT xếp nó vào nhóm "nước khai cuộc" (opening gambit), như trong cờ.
    ly_do: 'n3, n4: bỏ "nổi tiếng nhất", "nên dù bass tuột dần, câu nhạc vẫn vững" (không nguồn); "nước khai cuộc" theo bảng tóm tắt của OMT.'
  - cu: 'Giọng khác: ở Sol trưởng, bass Sol – Fa♯ – Mi – Si, giai điệu Sol – Rê – Sol – Sol; ở Fa trưởng, bass Fa – Mi – Rê – La. Ngoài bản galant này còn bản "nhảy" (bass 1–5–6–3: Đô – Sol – La – Mi) và bản "đi liền" (bass 1–7–6–5); bản galant lấy phần đầu của bản đi liền và cú nhảy cuối của bản kia. Gặp ở đâu: đầu bài hay đầu câu, thường được một Prinner trả lời. Minuet ở trang Ứng tác mở đầu đúng như thế.'
    moi: 'Giọng khác: ở Sol trưởng, bass Sol – Fa♯ – Mi – Si, giai điệu Sol – Rê – Sol – Sol; ở Fa trưởng, bass Fa – Mi – Rê – La. Romanesca còn hai dạng bass chính: dạng "nhảy" (xuống quãng 4 rồi lên một bậc, xen nhau: 1–5–6–3, như Đô – Sol – La – Mi) và dạng "đi liền" (bass đi bậc xuống). Theo Gjerdingen, dạng nhảy đặc trưng cho thế kỷ 17 và đầu thế kỷ 18, dạng đi liền cho cuối thế kỷ 18; bass galant 1–7–6–3 là dạng lai, phần đầu giống dạng đi liền, phần sau giống dạng nhảy. Canon của Pachelbel mở đầu bằng dạng nhảy (bài 29). Gặp ở đâu: đầu bài hay đầu câu; theo sau thường là một mẫu trả lời như Prinner. Minuet ở trang Ứng tác mở đầu đúng như thế.'
    ly_do: 'Romanesca: bỏ câu bản "đi liền" 1–7–6–5 (sai); hai dạng bass cũ (nhảy 1–5–6–3, đi liền) mô tả theo OMT, khớp bài 29.; n35 (da-sua, review D4-gom): Gjerdingen: "two main variants"; dạng đi bậc thuộc cuối thế kỷ 18, không cũ hơn dạng galant.; n34 (da-sua, review D4-gom): OMT: Prinner là câu trả lời điển hình cho một mẫu mở đầu; không nguồn nào nói riêng về cặp Romanesca–Prinner.'
  - cu: "Do–Re–Mi là mẫu ngắn nhất: giai điệu đi lên 1–2–3 trên bass 1–7–1, tức I – V6 – I. Bass cũng có thể đi 1–5–1, như hai ô sau của ví dụ."
    moi: "Do–Re–Mi là một mẫu ngắn, ba bước: giai điệu đi lên 1–2–3 trên bass 1–7–1, tức I – V6 – I. Hai ô sau của ví dụ là một biến thể soạn riêng cho trang này, bass đi 1–5–1."
    ly_do: "n41 (da-sua): OMT chỉ nêu bass 1–7–1."
  - cu: 'Giọng khác: ở Sol trưởng, giai điệu Sol – Fa♯ … Đô – Si, bass Sol – La … Fa♯ – Sol. Gặp ở đâu: mở đầu. Gjerdingen gọi một biến thể có giai điệu 1–2–4–3 là Jupiter, theo bốn nốt Đô – Rê – Fa – Mi ở chương cuối Giao hưởng số 41 "Jupiter" của Mozart.'
    moi: "Giọng khác: ở Sol trưởng, giai điệu Sol – Fa♯ … Đô – Si, bass Sol – La … Fa♯ – Sol. Gặp ở đâu: mở đầu. Cùng nhóm với Meyer, OMT kể thêm Pastorella, Jupiter và Aprile: mẫu nào cũng bắt đầu ở chủ âm, rời đi hai bước rồi về chủ âm. Jupiter có giai điệu 1–2–4–3 trên bass 1–7–5–1."
    ly_do: "n11: Meyer và nhóm mẫu mở đầu (Pastorella, Jupiter, Aprile) mô tả theo OMT thay cho câu gán cho Gjerdingen."
  - cu: "Prinner là mẫu trả lời thông dụng nhất: giai điệu đi xuống 6–5–4–3, bass đi xuống 4–3–2–1, hai bè song song quãng 10 suốt bốn bước. Gjerdingen gọi nó là đòn đáp trả (riposte, như trong đấu kiếm): một mẫu mở đầu nêu ý, Prinner đáp lại và đưa nhạc về chủ âm một cách nhẹ nhàng, chưa phải kết trọn. Hợp âm Rê – Fa – Si ở ô 3 có thể thay bằng V4/3. Prinner cũng có thể chen một át âm trước nốt cuối (bass 4–3–2–5–1) để thành một kết."
    moi: "Prinner là một mẫu trả lời điển hình: giai điệu đi xuống 6–5–4–3, bass đi xuống 4–3–2–1, hai bè song song quãng 10 suốt bốn bước. Một mẫu mở đầu nêu ý, Prinner đáp lại bằng một đường đi xuống dẫn tới kết; giai điệu dừng ở bậc 3 nên chưa phải kết trọn. OMT còn nêu một biến thể chen một át âm thể gốc trước nốt cuối (bass 4–3–2–5–1)."
    ly_do: "n48 (da-bo): OMT không dùng riposte và không nêu V4/3 cho Prinner."
  - cu: "Giọng khác: ở Sol trưởng, Mi – Rê – Đô – Si trên Đô – Si – La – Sol; ở Fa trưởng, Rê – Đô – Si♭ – La trên Si♭ – La – Sol – Fa. Gặp ở đâu: ngay sau một mẫu mở đầu. Bản chuyển giọng hay được dùng để đưa nửa đầu một minuet, hay một bài hai đoạn, sang giọng át."
    moi: "Giọng khác: ở Sol trưởng, Mi – Rê – Đô – Si trên Đô – Si – La – Sol; ở Fa trưởng, Rê – Đô – Si♭ – La trên Si♭ – La – Sol – Fa. Gặp ở đâu: ngay sau một mẫu mở đầu. Bản chuyển giọng đưa nhạc từ giọng chủ sang giọng át."
    ly_do: 'n30: bỏ "hay được dùng để đưa nửa đầu một minuet, hay một bài hai đoạn" (OMT không nói), chỉ giữ chức năng chuyển sang giọng át.'
  - cu: "Tay phải giữ một hình: ngón 1 ở bè giữa (La – La – Sol – Sol), ngón 5 ở giai điệu (Sol – Fa – Fa – Mi). Chỉ có hai quãng, 7 và 6, lặp lại."
    moi: "Tay phải giữ một hình: ngón 1 ở bè giữa (La4 – La4 – Sol4 – Sol4), ngón 5 ở giai điệu (Sol5 – Fa5 – Fa5 – Mi5). Chỉ có hai quãng, 7 và 6, lặp lại."
    ly_do: "n69 (khuyen-tap): Kiểm mẫu D4 (chủ repo, 28/10/2026): ghi rõ quãng tám của từng nốt trong gợi ý ngón tay phải của Fonte (La4, Sol5…), để thấy ngón 5 ở trên ngón 1."
  - cu: 'Nghe giai điệu và bass tạo quãng 5 giảm (Sol trên Đô♯) rồi mở ra quãng 10 (Fa trên Rê): đó là "chữ ký" của Fonte.'
    moi: 'Nghe giai điệu và bass tạo quãng 5 giảm (Sol trên Đô♯) rồi mở ra quãng 3 (Fa trên Rê): đó là "chữ ký" của Fonte.'
    ly_do: "n50 (da-sua): Ví dụ Fonte có quãng 5 giảm rồi quãng 3, không phải quãng 10."
  - cu: Tay phải ngón 1 trên Đô – Đô – Rê – Rê, ngón 5 hoặc 4 trên Si♭ – La – Đô – Si.
    moi: "Tay phải ngón 1 trên Đô4 – Đô4 – Rê4 – Rê4, ngón 5 (hay 4 nếu tay nhỏ) trên Si♭4 – La4 – Đô5 – Si4: quãng 7 rồi quãng 6, lặp lại."
    ly_do: "n69 (khuyen-tap): Kiểm mẫu D4 (chủ repo, 28/10/2026): ghi rõ quãng tám của từng nốt trong gợi ý ngón tay phải của Monte; ngón 4 chỉ là phương án cho tay nhỏ (quãng 7 và 6, không phải quãng 8)."
  - cu: "Giọng khác: ở Sol trưởng, bass Si – Đô … Đô♯ – Rê, giai điệu Fa♮ – Mi … Sol – Fa♯. Gặp ở đâu: sau vạch nhắc lại, hay bất cứ chỗ nào nhạc cần dâng lên."
    moi: "Giọng khác: ở Sol trưởng, bass Si – Đô … Đô♯ – Rê, giai điệu Fa♮ – Mi … Sol – Fa♯. Gặp ở đâu: sau vạch nhắc lại."
    ly_do: "n52 (da-bo): Không có nguồn."
  - cu: "Ponte đứng yên trên át âm: bass giữ bậc 5, giai điệu leo theo hợp âm át 5–7–2, có thể thêm 4 (nốt 7 của V7), rồi rơi xuống 3 khi chủ âm trở về. Giữ càng lâu, người nghe càng mong được về nhà."
    moi: "Ponte đứng yên trên át âm: bass giữ bậc 5, giai điệu leo theo hợp âm át 5–7–2. Trong ví dụ, giai điệu còn thêm 4 (nốt 7 của V7) rồi rơi xuống 3 khi chủ âm trở về."
    ly_do: 'n53: Ponte theo OMT chỉ gồm 5–7–2 trên bass bậc 5; nốt 4 và việc rơi xuống 3 ghi là của ví dụ; bỏ câu "giữ càng lâu…".'
  - cu: Các mẫu trên đều dẫn đến kết, dấu chấm câu bạn đã tập ở trang Kết ở mọi giọng. Sách dạy partimento phân biệt kết đơn, kết ghép và kết kép theo độ dài của át âm; Gjerdingen đặt thêm tên cho một kết nửa rất hay gặp, kết hội tụ.
    moi: "Các mẫu trên đều dẫn đến kết, dấu chấm câu bạn đã tập ở trang Kết ở mọi giọng. Bảng tóm tắt của OMT liệt kê ba kết trọn khác nhau ở độ dài của át âm (cadenza semplice, composta, doppia: kết đơn, kết ghép, kết kép) và một kết nửa, kết hội tụ (còn gọi là kết nửa fa–fi–sol theo đường bass)."
    ly_do: 'Kết: ba kết trọn (đơn, ghép, kép) và kết hội tụ theo bảng tóm tắt của OMT thay cho câu gán cho "sách dạy partimento" và Gjerdingen.'
