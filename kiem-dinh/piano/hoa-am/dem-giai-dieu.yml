nhan_dinh:
  - id: d1
    cau: Trang dạy chọn hợp âm cho giai điệu, quyết định đổi hợp âm khi nào, viết bè bass và lắp hình đệm.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Khớp các mục ## của trang: Nốt giai điệu nằm trong hợp âm nào; Nhịp hòa âm; Bè bass biết hát; Lắp hình đệm; Đến lượt bạn. Lô trước (hop-am-rai) yêu cầu giữ mục "Lắp hình đệm": còn nguyên.'
  - id: d2
    cau: Các ví dụ dùng những giai điệu bạn đã chơi trong 10 bài đầu tiên; hình đệm đã học ở hợp âm và hình đệm; muốn tìm giai điệu và bass bằng tai thì xem Chơi theo tai bên phím đàn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: piano/10-bai-dau-tien.md có Au clair de la lune (bài 1), Ode to Joy (bài 3), và bài Twinkle (Mozart K. 265, Đô trưởng); piano/hop-am-rai.md có "Bốn kiểu hình đệm"; luyen-tai/choi-bang-tai.md (title "Chơi theo tai bên phím đàn") có.'
  - id: d3
    cau: Ở Đô trưởng mỗi nốt của gam nằm trong ít nhất một trong ba hợp âm chính I, IV, V; bảng bậc, nốt, hợp âm chính và hợp âm khác (vi, ii, V7).
    loai: cau-truc
    nguon:
      - omt-triads
      - omt-roman
    ket_qua: dung
    ghi_chu: "Đã kiểm từng hàng: Đô ∈ I, IV (và vi); Rê ∈ V (ii, V7); Mi ∈ I (vi); Fa ∈ IV (ii, V7); Sol ∈ I, V (V7); La ∈ IV (ii, vi); Si ∈ V (V7)."
  - id: d4
    cau: Câu dừng ở bậc 2, 5 hoặc 7 thường là kết nửa (V); câu về chủ âm sau bậc 2 hoặc 7 là kết trọn (V–I).
    loai: quy-tac
    nguon:
      - omt-intro
    ket_qua: dung
    ghi_chu: 'OMT: HC kết ở V; PAC là V–I với bè trên về chủ âm. Bậc 2, 5, 7 là các nốt của V. "Thường" giữ nguyên.'
  - id: d5
    cau: "Nốt ngắn ở phách yếu, đi liền bậc, thường là nốt lướt hoặc nốt thêu: bỏ qua, giữ hợp âm cũ."
    loai: quy-tac
    nguon:
      - omt-embell
    ket_qua: dung
    ghi_chu: "OMT Embellishing Tones: nốt lướt và nốt thêu là nốt ngoài hợp âm đi liền bậc, thường ở phách yếu."
  - id: d6
    cau: "Khi một nốt thuộc hai hợp âm, chọn theo chức năng: chủ → hạ át → át → chủ; tránh đi từ V sang IV."
    loai: quy-tac
    nguon:
      - omt-intro
    ket_qua: dung
    ghi_chu: "OMT: tiến trình chủ – hạ át – át – chủ; V–IV là đi ngược chiều thông thường. Khớp bài 12."
  - id: d7
    cau: "Au clair de la lune, câu đầu: ô 1 Đô–Đô–Đô là I, Rê ở phách 4 là nốt lướt lên Mi; ô 2 Mi (I) rồi Rê (V); ô 3 Đô–Mi (I) rồi Rê–Rê (V); ô 4 Đô (I), kết trọn."
    loai: cau-truc
    nguon:
      - mutopia-auclair
      - omt-embell
    ket_qua: dung
    ghi_chu: "Giai điệu C C C D | E2 D2 | C E D D | C4 khớp bản Mutopia (Horetzky, Đô trưởng, 2/4 trong bản gốc; trang ghi 4/4 gộp đôi). Phân tích hòa âm là của trang, đã kiểm: Rê phách 4 đi Đô→Rê→Mi là nốt lướt."
  - id: d8
    cau: "Tay trái dùng hai hình đã quen từ bài Hänschen klein: Đô–Mi–Sol (5-3-1) và Si–Fa–Sol (5-2-1)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/10-bai-dau-tien.md bài 4 "Hänschen klein": hợp âm chủ Đô–Mi–Sol (ngón 5-3-1) và át bảy Si–Fa–Sol (ngón 5-2-1).'
  - id: d9
    cau: "Si–Fa–Sol cộng với Rê của giai điệu là đủ bốn nốt của V7, và cả câu tay trái chỉ đổi hai nốt: Đô với Si, Mi với Fa."
    loai: quy-tac
    nguon:
      - mount19
    ket_qua: dung
    ghi_chu: "V7 ở Đô trưởng là Sol–Si–Rê–Fa; Si–Fa–Sol thiếu Rê (nốt năm, được bỏ), Rê có ở giai điệu. Từ Đô–Mi–Sol sang Si–Fa–Sol: Đô→Si, Mi→Fa, Sol giữ. Đúng."
  - id: d10
    cau: "Đệm cả bài 16 ô ở 10 bài đầu tiên: câu này dùng cho ô 1–8 và 13–16; ô 9–12 để tay trái hát như cũ."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "piano/10-bai-dau-tien.md, bài 1: ô 9–12 tay phải nghỉ, tay trái hát (dòng 76); bài gồm 16 ô."
  - id: d11
    cau: Nhịp hòa âm là tốc độ đổi hợp âm.
    loai: dinh-nghia
    nguon:
      - bach-cantatas-hr
    ket_qua: null
    ghi_chu: "Chưa chắc: chỉ có nguồn bậc 3 (Bach Cantatas Website, Harmonic Rhythm); chưa tìm được định nghĩa bậc 1–2 (OMT, Mount không có mục riêng đã mở được). Bậc 3 không đủ làm nguồn duy nhất; lượt 2 tìm giáo trình."
  - id: d12
    cau: Trong nhạc cổ điển nhịp hòa âm thường đều (một hợp âm mỗi ô, hoặc mỗi nửa ô) và nhanh lên ở cuối câu, nơi kết cần hai hợp âm liền nhau.
    loai: quy-tac
    nguon:
      - bach-cantatas-hr
    ket_qua: null
    ghi_chu: 'Chưa chắc: chỉ có nguồn bậc 3 cho "nhanh lên ở cuối câu". Quiz 3 dựa vào câu này (xem q3).'
  - id: d13
    cau: Đổi hợp âm ở phách mạnh (phách 1, hoặc phách 3 trong 4/4); đừng đổi ở phách yếu rồi giữ qua phách mạnh kế tiếp; đừng đổi cho mỗi nốt.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên; hai câu giải thích bằng cảm giác nghe ("hụt chân", "mất hướng") giữ như lời khuyên.
  - id: d14
    cau: "Ode to Joy: ô 1–3 và 5–7 mỗi ô một hợp âm, ô 4 và 8 có hai; ở ô 4 Mi chấm dôi thuộc I, Rê móc đơn vang sớm nửa phách so với V, rồi V giữ hai phách cuối (kết nửa); ô 8 là V rồi I (kết trọn), Đô móc đơn cũng là nốt đón trước; ô 2 và 6 giai điệu đi qua Fa nên V thành V7."
    loai: cau-truc
    nguon:
      - mutopia-ode
      - imslp-sym9
      - omt-embell
    ket_qua: dung
    ghi_chu: 'Giai điệu E E F G | G F E D | C C D E | E. D D (ô 8: D. C C) khớp bản Mutopia (SATB, Sol trưởng, giai điệu soprano ô 1–16) khi hạ xuống Đô trưởng; IMSLP: chương 4 "An die Freude" của Giao hưởng số 9, Op. 125. Nhịp: E3/2 D/ D2 = 4 phách, Rê móc đơn nằm nửa phách trước phách 3: đúng. Ô 2 và 6 có Fa (nốt 7 của V7); ô 4 và 8 hai hợp âm như nói.'
  - id: d15
    cau: Nốt đón trước là nốt thuộc hợp âm kế tiếp nhưng vang sớm hơn.
    loai: dinh-nghia
    nguon:
      - omt-embell
    ket_qua: dung
    ghi_chu: "OMT Embellishing Tones: anticipation là nốt đến trước hợp âm mà nó thuộc về."
  - id: d16
    cau: Tay trái dưới đây dùng đúng hai nốt bass bạn đã chơi ở bài 3 của 10 bài đầu tiên, Đô và Sol, chỉ khác là Sol đặt thấp hơn một quãng tám; giờ bạn biết vì sao chúng đúng.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chính là các nốt bass bạn đã chơi ở bài 3". Sai ở chi tiết: bài 3 (piano/10-bai-dau-tien.md) viết bass C, và G, (Đô3, Sol3); ví dụ ở đây viết C, và G,, (Đô3, Sol2): Sol thấp hơn một quãng tám. Đã sửa câu.'
  - id: d17
    cau: 'Thí nghiệm: giữ I suốt ô 4, bỏ V; câu hỏi không còn "hỏi" nữa; trả V về phách 3 và nghe lại. Tay trái ngón 1 trên Đô3, ngón 4 trên Sol2; tập riêng rồi ghép ở ♩ = 72, sau đó 88.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập. Ngón khớp khối abc 2 (!1!C, và !4!G,,).
  - id: d18
    cau: "Bass chỉ gồm nốt gốc thì nhảy liên tục: Đô–Sol–Đô–Sol; một bè bass tốt đi liền bậc khi có thể, nhờ hợp âm đảo và các hợp âm thay thế."
    loai: quy-tac
    nguon:
      - mountguide
      - mount14
    ket_qua: dung
    ghi_chu: 'Mount (Guide to SATB part-writing): bass nhảy nhiều hơn các bè trên; đảo hợp âm cho bass đi bước. "Một bè bass tốt đi liền bậc khi có thể" là cách nói của trang.'
  - id: d19
    cau: V6 là Sol–Si–Rê với Si ở bass.
    loai: dinh-nghia
    nguon:
      - omt-figbass
    ket_qua: dung
    ghi_chu: "OMT: số 6 là thể đảo 1, nốt ba (Si) ở bass."
  - id: d20
    cau: V6 thay V khi bass cần đi Đô–Si.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên chọn hợp âm; khối abc 3 ô 2 đúng như nói.
  - id: d21
    cau: "vi (La–Đô–Mi) thay I: chung hai nốt Đô, Mi, mang màu thứ."
    loai: quy-tac
    nguon:
      - omt-roman
      - omt-triads
    ket_qua: dung
    ghi_chu: "vi = La–Đô–Mi, chung Đô, Mi với I (Đô–Mi–Sol); vi là hợp âm thứ. OMT: vi thay thế I (hợp âm chủ thay thế)."
  - id: d22
    cau: "ii6 (Rê–Fa–La, Fa ở bass) thay IV: chung hai nốt Fa, La."
    loai: quy-tac
    nguon:
      - mount24w
      - omt-figbass
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chung Fa, La, hướng về V rõ hơn". Mount 24: ii và IV cùng chức năng hạ át, chung bậc 4 và 6. "Hướng về V rõ hơn" là nhận xét nghe không có nguồn; bỏ (cùng sửa ở ket.md n35).'
  - id: d23
    cau: I6/4–V ở kết nửa, như ở trang Kết ở mọi giọng.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/hoa-am/ket.md có mục "I6/4 trước át âm". Trang đó dạy I6/4–V trong kết trọn; ở đây I6/4–V dừng ở V (kết nửa): cùng cặp hợp âm, chỉ khác có I sau hay không. Ghi cho người giao.'
  - id: d24
    cau: Cadential 6/4 có thể đứng trước V ở kết nửa.
    loai: quy-tac
    nguon:
      - omt-c64
    ket_qua: dung
    ghi_chu: "OMT Strengthening Endings with Cadential 6/4: 6/4 ở kết dùng cả ở PAC và HC."
  - id: d25
    cau: "Giữa bass và giai điệu: đi ngược hướng, hoặc song song quãng 3, 6, 10; không song song quãng 5 hay quãng 8."
    loai: quy-tac
    nguon:
      - omt-first
      - mountguide
      - mount14
    ket_qua: dung
    ghi_chu: "OMT First-Species: chuyển động ngược ưu tiên; quãng 3, 6 song song chấp nhận; quãng 5, 8 song song tránh. Quãng 10 là quãng 3 mở rộng."
  - id: d26
    cau: Bass đi xuống từng bậc Đô–Si–La–Sol, ngược với những đoạn giai điệu đi lên; cả bè nằm gọn trong một thế tay trái, ngón 5 trên Fa2 và ngón 1 trên Đô3.
    loai: cau-truc
    nguon:
      - mountguide
    ket_qua: dung
    ghi_chu: "Khối abc 3: bass C,–B,,–A,,–G,, ở dòng 1; dòng 2 có thêm F,, (ii6). Ngón !1!C, !2!B,, !3!A,, !4!G,, !5!F,, khớp. Ô 1→2 và 3→4: giai điệu đi lên trong khi bass đi xuống (ngược hướng); ô 2→3 cả hai đi xuống. Giữ câu."
  - id: d27
    cau: "Chuyển sang Sol trưởng: bass Sol–Fa♯–Mi–Rê, rồi Sol–Fa♯–Mi–Đô–Rê–Sol."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "Đã kiểm: dời bass khối abc 3 (Đô–Si–La–Sol; Đô–Si–La+Fa–Sol+Đô) lên quãng 5 cho Sol–Fa♯–Mi–Rê và Sol–Fa♯–Mi–Đô–Rê–Sol. Đúng."
  - id: d28
    cau: "So với phiên bản trước: ô 3 có màu thứ (vi), ô 4 có tiếng thở dài của I6/4, ô 7 mềm hơn nhờ ii6."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Khối abc 3: ô 3 là vi (A,,4), ô 4 là I6/4–V, ô 7 beats 3–4 là ii6. Khớp."
  - id: d29
