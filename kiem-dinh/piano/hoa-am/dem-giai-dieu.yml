nhan_dinh:
  - id: d1
    cau: Trang dạy chọn hợp âm cho giai điệu, quyết định đổi hợp âm khi nào, viết bè bass và lắp hình đệm.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Khớp các mục ## của trang: Nốt giai điệu nằm trong hợp âm nào; Nhịp hòa âm; Bè bass biết hát; Lắp hình đệm; Đến lượt bạn. Lô trước (hop-am-rai) yêu cầu giữ mục "Lắp hình đệm": còn nguyên. Review: trang có đủ bốn mục: Nốt giai điệu nằm trong hợp âm nào, Nhịp hòa âm, Bè bass biết hát, Lắp hình đệm.'
    review: dung
  - id: d2
    cau: Các ví dụ dùng những giai điệu bạn đã chơi trong 10 bài đầu tiên; hình đệm đã học ở hợp âm và hình đệm; muốn tìm giai điệu và bass bằng tai thì xem Chơi theo tai bên phím đàn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: piano/10-bai-dau-tien.md có Au clair de la lune (bài 1), Ode to Joy (bài 3), và bài Twinkle (Mozart K. 265, Đô trưởng); piano/hop-am-rai.md có "Bốn kiểu hình đệm"; luyen-tai/choi-bang-tai.md (title "Chơi theo tai bên phím đàn") có. Review: piano/10-bai-dau-tien.md có Au clair de la lune (bài 1), Ah! vous dirai-je (bài 2), Ode to Joy (bài 3); hop-am-rai.md có mục "Bốn kiểu hình đệm"; luyen-tai/choi-bang-tai.md có.'
    review: dung
  - id: d3
    cau: Ở Đô trưởng mỗi nốt của gam nằm trong ít nhất một trong ba hợp âm chính I, IV, V; bảng bậc, nốt, hợp âm chính và hợp âm khác (vi, ii, V7).
    loai: cau-truc
    nguon:
      - omt-triads
      - omt-roman
    ket_qua: dung
    ghi_chu: "Đã kiểm từng hàng: Đô ∈ I, IV (và vi); Rê ∈ V (ii, V7); Mi ∈ I (vi); Fa ∈ IV (ii, V7); Sol ∈ I, V (V7); La ∈ IV (ii, vi); Si ∈ V (V7)."
    luot_2: dung
    luot_2_nguon: [ "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/", "https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/" ]
    luot_2_ghi_chu: "C trưởng: Đô, Mi, Sol thuộc I; Fa, La thuộc IV; Rê, Si thuộc V; Sol thuộc cả I và V, Đô cả I và IV: mỗi nốt nằm trong ít nhất một hợp âm chính. vi, ii, V7 là thay thế (Mount: vi thay I, ii thay IV)."
  - id: d4
    cau: Câu dừng ở bậc 2, 5 hoặc 7 thường là kết nửa (V); câu về chủ âm sau bậc 2 hoặc 7 là kết trọn (V–I).
    loai: quy-tac
    nguon:
      - omt-intro
    ket_qua: dung
    ghi_chu: 'OMT: HC kết ở V; PAC là V–I với bè trên về chủ âm. Bậc 2, 5, 7 là các nốt của V. "Thường" giữ nguyên.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/" ]
    luot_2_ghi_chu: "OMT: kết nửa là câu kết ở V; kết trọn V–I cần bậc 1 ở giọng trên. V chứa bậc 2, 5, 7 (Mount: V có bậc 7 và 2)."
  - id: d5
    cau: "Nốt ngắn ở phách yếu, đi liền bậc, thường là nốt lướt hoặc nốt thêu: bỏ qua, giữ hợp âm cũ."
    loai: quy-tac
    nguon:
      - omt-embell
    ket_qua: dung
    ghi_chu: "OMT Embellishing Tones: nốt lướt và nốt thêu là nốt ngoài hợp âm đi liền bậc, thường ở phách yếu."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/23-auxiliary-sonorities/" ]
    luot_2_ghi_chu: "Nốt lướt và nốt thêu: nốt ngoài hợp âm đi liền bậc từ nốt hợp âm này sang nốt kia, nên giữ hợp âm cũ. Vị trí phách yếu là thực hành thường gặp (nguồn đã mở không quy định)."
  - id: d6
    cau: "Khi một nốt thuộc hai hợp âm, chọn theo chức năng: chủ → hạ át → át → chủ; tránh đi từ V sang IV."
    loai: quy-tac
    nguon:
      - omt-intro
    ket_qua: dung
    ghi_chu: "OMT: tiến trình chủ – hạ át – át – chủ; V–IV là đi ngược chiều thông thường. Khớp bài 12."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/" ]
    luot_2_ghi_chu: "Mô hình T–PD–D–T; OMT: câu 'hầu như luôn đi từ trái sang phải', V về IV (lùi chức năng) vì thế bị tránh."
  - id: d7
    cau: "Au clair de la lune, câu đầu: ô 1 Đô–Đô–Đô là I, Rê ở phách 4 là nốt lướt lên Mi; ô 2 Mi (I) rồi Rê (V); ô 3 Đô–Mi (I) rồi Rê–Rê (V); ô 4 Đô (I), kết trọn."
    loai: cau-truc
    nguon:
      - mutopia-auclair
      - omt-embell
    ket_qua: dung
    ghi_chu: "Giai điệu C C C D | E2 D2 | C E D D | C4 khớp bản Mutopia (Horetzky, Đô trưởng, 2/4 trong bản gốc; trang ghi 4/4 gộp đôi). Phân tích hòa âm là của trang, đã kiểm: Rê phách 4 đi Đô→Rê→Mi là nốt lướt."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: Phân tích hòa âm đúng với giai điệu quen thuộc Đô–Đô–Đô–Rê | Mi–Rê | Đô–Mi–Rê–Rê | Đô; Rê giữa Đô và Mi là nốt lướt (OMT). Không mở được bản nhạc mẫu của bài này; dựa vào giai điệu truyền thống.
  - id: d8
    cau: "Tay trái dùng hai hình đã quen từ bài Hänschen klein: Đô–Mi–Sol (5-3-1) và Si–Fa–Sol (5-2-1)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/10-bai-dau-tien.md bài 4 "Hänschen klein": hợp âm chủ Đô–Mi–Sol (ngón 5-3-1) và át bảy Si–Fa–Sol (ngón 5-2-1). Review: 10-bai-dau-tien.md bài 4 Hänschen klein: tay trái Đô–Mi–Sol (5-3-1) và Si–Fa–Sol (5-2-1).'
    review: dung
  - id: d9
    cau: "Si–Fa–Sol cộng với Rê của giai điệu là đủ bốn nốt của V7, và cả câu tay trái chỉ đổi hai nốt: Đô với Si, Mi với Fa."
    loai: quy-tac
    nguon:
      - mount19
    ket_qua: dung
    ghi_chu: "V7 ở Đô trưởng là Sol–Si–Rê–Fa; Si–Fa–Sol thiếu Rê (nốt năm, được bỏ), Rê có ở giai điệu. Từ Đô–Mi–Sol sang Si–Fa–Sol: Đô→Si, Mi→Fa, Sol giữ. Đúng."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/" ]
    luot_2_ghi_chu: "V7 ở C là Sol–Si–Rê–Fa; Si–Fa–Sol cộng Rê của giai điệu đủ bốn nốt. Từ I (Đô–Mi–Sol) sang V7 (Si–Fa–Sol) tay trái đổi Đô sang Si, Mi sang Fa, Sol giữ nguyên: đúng."
  - id: d10
    cau: "Đệm cả bài 16 ô ở 10 bài đầu tiên: câu này dùng cho ô 1–8 và 13–16; ô 9–12 để tay trái hát như cũ."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "piano/10-bai-dau-tien.md, bài 1: ô 9–12 tay phải nghỉ, tay trái hát (dòng 76); bài gồm 16 ô. Review: 10-bai-dau-tien.md bài 1 Au clair de la lune: 16 ô, ô 9–12 tay phải nghỉ, tay trái hát."
    review: dung
  - id: d11
    cau: Nhịp hòa âm là tốc độ đổi hợp âm.
    loai: dinh-nghia
    nguon:
      - bach-cantatas-hr
      - omt-gloss
      - iastate-hr
    ket_qua: dung
    ghi_chu: "Chưa chắc: chỉ có nguồn bậc 3 (Bach Cantatas Website, Harmonic Rhythm); chưa tìm được định nghĩa bậc 1–2 (OMT, Mount không có mục riêng đã mở được). Bậc 3 không đủ làm nguồn duy nhất; lượt 2 tìm giáo trình. Review D4-gom: OMT Glossary: harmonic rhythm \"The rate at which chords change\"; Iowa State 6.3: \"Harmonic rhythm is the rate at which chords change in a piece of music.\""
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://iastate.pressbooks.pub/comprehensivemusicianship/?p=248" ]
    luot_2_ghi_chu: "OMT glossary: harmonic rhythm là 'tốc độ đổi hợp âm'."
  - id: d12
    cau: Trong nhạc cổ điển nhịp hòa âm thường đều (một hợp âm mỗi ô, hoặc mỗi nửa ô) và nhanh lên ở cuối câu, nơi kết cần hai hợp âm liền nhau.
    loai: quy-tac
    nguon:
      - bach-cantatas-hr
      - omt-gloss
      - wanner-mel
      - iastate-hr
    ket_qua: dung
    ghi_chu: 'Chưa chắc: chỉ có nguồn bậc 3 cho "nhanh lên ở cuối câu". Quiz 3 dựa vào câu này (xem q3). Review D4-gom: OMT Glossary: "A common rate of chord change in 18th-century classical music is one chord per measure"; Wanner: nhịp hòa âm đều ở đầu câu, "with an increase in harmonic rhythm pushing towards the cadence"; Iowa State 6.3: "Harmonies most often change on strong beats".'
    luot_2: dung
    luot_2_nguon: [ "https://iastate.pressbooks.pub/comprehensivemusicianship/?p=248", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/chapter/techniques-for-creating-a-melody" ]
    luot_2_ghi_chu: "Iowa State: đổi hợp âm hay rơi vào phách mạnh, nhanh lên khi gần kết; harmonyandmusicianship: nhịp hòa âm 'tăng để đẩy về kết'."
  - id: d13
    cau: Đổi hợp âm ở phách mạnh (phách 1, hoặc phách 3 trong 4/4); đừng đổi ở phách yếu rồi giữ qua phách mạnh kế tiếp; đừng đổi cho mỗi nốt.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên; hai câu giải thích bằng cảm giác nghe ("hụt chân", "mất hướng") giữ như lời khuyên.
  - id: d14
    cau: "Ode to Joy: ô 1–3 và 5–7 mỗi ô một hợp âm, ô 4 và 8 có hai; ở ô 4 Mi chấm dôi thuộc I, Rê móc đơn vang sớm nửa phách so với V, rồi V giữ hai phách cuối (kết nửa); ô 8 là V rồi I (kết trọn), Đô móc đơn cũng là nốt đón trước; ô 2 và 6 giai điệu đi qua Fa nên V thành V7."
    loai: cau-truc
    nguon:
      - mutopia-ode
      - imslp-sym9
      - omt-embell
    ket_qua: dung
    ghi_chu: 'Giai điệu E E F G | G F E D | C C D E | E. D D (ô 8: D. C C) khớp bản Mutopia (SATB, Sol trưởng, giai điệu soprano ô 1–16) khi hạ xuống Đô trưởng; IMSLP: chương 4 "An die Freude" của Giao hưởng số 9, Op. 125. Nhịp: E3/2 D/ D2 = 4 phách, Rê móc đơn nằm nửa phách trước phách 3: đúng. Ô 2 và 6 có Fa (nốt 7 của V7); ô 4 và 8 hai hợp âm như nói.'
