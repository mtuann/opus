ghi_chu: 'Đệm cho một giai điệu (piano/hoa-am/dem-giai-dieu, lõi). Nguồn mở: Mutopia (Ode to Joy, Au clair de la lune), IMSLP (Giao hưởng số 9), Britannica (K. 265), OMT (Intro to Harmony, Embellishing Tones, Inversion and Figured Bass, First-Species, Cadential 6/4, Minor Scales), Mount ch. 14/19/24 và Guide to SATB, Bach Cantatas (bậc 3, Harmonic Rhythm). Sửa trang: d16 (nốt bass bài 3: Sol thấp hơn một quãng tám), d22 ("hướng về V rõ hơn"), d31 ("hai bậc sắc thái"); thay dòng Nguồn bằng nguồn đã mở (bản nhạc IMSLP, Mutopia). Chưa chắc: d11, d12, q3 (nhịp hòa âm: chỉ có nguồn bậc 3); d36 (giai điệu Ah! vous dirai-je chưa đối chiếu bản nhạc); d47 (ba sách in). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5; lượt 1 không tạo hồ sơ thuật ngữ): harmonic rhythm (nhịp hòa âm), anticipation (nốt đón trước), passing tone (nốt lướt), neighbor tone (nốt thêu), cadential 6/4, voice leading (dẫn bè), parallel fifths/octaves, accompaniment pattern (hình đệm); đã có: Alberti bass, inversion, cadence, leading tone. Lô trước yêu cầu giữ: KHỚP (hop-am-rai: mục "Lắp hình đệm" và đệm giai điệu bằng cùng hợp âm; luyen-tai/choi-bang-tai: dem-giai-dieu có; nhac-ly/index: trang có). Câu ve-site trỏ tới trang chưa chuyển: không có (hop-am-rai, 10-bai-dau-tien, choi-bang-tai, nhac-ly/10, 12, 13, 18, piano/hoa-am đã có trên site mới). Lưu ý cho người giao: nhãn I6/4 (site) và V6/4 (OMT); index tuần 7 chia việc khác dem tuần 2–3 (d46); "Đến lượt bạn" dùng melody Twinkle chưa đối chiếu bản nhạc (d36). Review D4-gom (nhóm E, 28/10/2026): d11, d12, q3 có nguồn bậc 2 (OMT Glossary, Iowa State, Wanner); d36 đối chiếu 10-bai-dau-tien và Mutopia K. 265; d47 thư viện ECU; d23 sửa (ket chỉ dạy I6/4–V–I). Index tuần 6–7 đã sửa cho khớp kế hoạch tuần 2–3 của trang này.'
doi_chu:
  - cu: "Trong Ode to Joy (Khúc ca niềm vui), ô 1–3 và 5–7 mỗi ô chỉ cần một hợp âm; ô 4 và 8 có hai. Ở ô 4, Mi chấm dôi thuộc I nên I giữ hai phách đầu; Rê móc đơn vang sớm nửa phách so với V (nốt đón trước), rồi V giữ hai phách cuối: kết nửa. Ở ô 8 là V rồi I, kết trọn, và Đô móc đơn cũng là nốt đón trước. Ở ô 2 và 6, giai điệu đi qua Fa nên V thành V7. Tay trái dưới đây chính là các nốt bass bạn đã chơi ở bài 3 của 10 bài đầu tiên; giờ bạn biết vì sao chúng đúng."
    moi: "Trong Ode to Joy (Khúc ca niềm vui), ô 1–3 và 5–7 mỗi ô chỉ cần một hợp âm; ô 4 và 8 có hai. Ở ô 4, Mi chấm dôi thuộc I nên I giữ hai phách đầu; Rê móc đơn vang sớm nửa phách so với V (nốt đón trước), rồi V giữ hai phách cuối: kết nửa. Ở ô 8 là V rồi I, kết trọn, và Đô móc đơn cũng là nốt đón trước. Ở ô 2 và 6, giai điệu đi qua Fa nên V thành V7. Tay trái dưới đây dùng đúng hai nốt bass bạn đã chơi ở bài 3 của 10 bài đầu tiên, Đô và Sol, chỉ khác là Sol đặt thấp hơn một quãng tám; giờ bạn biết vì sao chúng đúng."
    ly_do: 'd16 (da-sua): bài 3 viết Sol3 (G,), ví dụ ở đây viết Sol2 (G,,): không "chính là" cùng nốt.'
  - cu:
      - "ii6 (Rê–Fa–La, Fa ở bass) thay IV: chung Fa, La, hướng về V rõ hơn."
      - I6/4–V ở kết nửa, như ở trang Kết ở mọi giọng.
    moi:
      - "ii6 (Rê–Fa–La, Fa ở bass) thay IV: chung hai nốt Fa, La."
      - "I6/4–V ở kết nửa: cùng hợp âm 6/4 ở kết bạn đã tập trong I–IV–I6/4–V–I ở trang Kết ở mọi giọng, nhưng dừng ở V."
    ly_do: 'd22 (da-sua): "hướng về V rõ hơn" là nhận xét nghe không có nguồn; Mount 24 chỉ nói cùng chức năng hạ át.; d23 (da-sua, review D4-gom): trang ket chỉ dạy I6/4–V–I, không dạy I6/4–V ở kết nửa.'
  - cu: Tay trái nhỏ hơn tay phải khoảng hai bậc sắc thái, và không leo lên âm vực của giai điệu.
    moi: Tay trái nhỏ hơn tay phải vài bậc sắc thái, và không leo lên âm vực của giai điệu.
    ly_do: 'd31 (da-sua): "khoảng hai bậc" là số cụ thể không kiểm được; đổi thành "vài bậc".'
  - cu:
      - 'Bản nhạc: IMSLP (tìm "Symphony No.9, Op.125" của Beethoven; "Ah vous dirai-je, Maman, K.265" của Mozart).'
      - Open Music Theory.
    moi:
      - 'Bản nhạc đã đối chiếu: Mutopia, Ode to Joy (giai điệu chương 4 của Giao hưởng số 9, Op. 125 ở IMSLP); Mutopia, Au clair de la lune; Britannica, Twelve Variations on "Ah, vous dirai-je, Maman", K 265.'
      - "Open Music Theory: Introduction to Harmony, Cadences, and Phrase Endings, Embellishing Tones, Inversion and Figured Bass, First-Species Counterpoint."
      - "Andre Mount, Fundamentals, Function, and Form (Milne Publishing): 14. Three- and Four-Voice Progressions, 24. The Pre-Dominant Function."
      - "Nhịp hòa âm: Bach Cantatas Website, Harmonic Rhythm."
    ly_do: "Mục Nguồn: thay bằng các bản nhạc và nguồn lượt 1 đã đối chiếu (Mutopia, IMSLP, Britannica K. 265, OMT, Mount)."
