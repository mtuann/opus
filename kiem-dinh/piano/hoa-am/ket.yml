    ghi_chu: "I–IV–V–I ở Đô trưởng, ba vị trí: 4/4, L:1/4, 6 ô, mỗi ô hai hợp âm dài hai phách (đủ 4 phách; tools/khuong-nhac.mjs không báo lỗi). Bass C,–F,,–G,,–C, (Đô3, Fa2, Sol2, Đô3). Tay phải [EGc][FAc]|[DGB][EGc]; [Gce][Acf]|[GBd][Gce]; [CEG][CFA]|[B,DG][CEG]: nhãn I, IV, V, I đúng. Dẫn bè: nốt chung giữ, Si lên Đô, không song song quãng 5 hay 8 (kể cả với bass; bộ phân tích riêng). Bè trên cùng Đô–Đô–Si–Đô, Mi–Fa–Rê–Mi, Sol–La–Sol–Sol (nhảy Fa→Rê ở vị trí 3). Ngón 1-2-5 và 1-3-5 khớp bảng ngón. Q:1/4=60 khớp ♩ = 60 trong chữ."
  - khoi: 2
    loai: vi-du-soan
