    ket_qua: dung
    ghi_chu: "I–IV–I6/4–V–I ba vị trí: 4/4, L:1/4, 3 ô: I IV | I6/4 V | I; bass C,2 F,,2 | G,,2- G,,2 | C,4. Tay phải trên bass Sol là [EGc], thể đảo 2: nhãn I6/4 đúng. Dây nối giữ Sol từ I6/4 sang V. I6/4→V: Mi xuống Rê, Đô xuống Si, Sol giữ (cả ba vị trí). Không song song quãng 5, 8. Không có số ngón. Nhãn I6/4 là quy ước của site; OMT ghi V6/4."
