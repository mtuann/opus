    ghi_chu: "Chưa chắc: ba sách in không mở được ở lượt 1; chưa xác nhận từng tên, nhà xuất bản và điều mỗi sách đóng góp. Nguồn mở (OMT, Mount, COD, MT21C) đã bổ sung cuối trang và kiểm từng mục (xem nguon). Lượt 2 cần mở sách in, hay người giao bỏ các dòng sách chưa kiểm. Review D4-gom: đã mở trang của nhà sách và thư viện: Palmer, Manus, Lethco, The Complete Book of Scales, Chords, Arpeggios & Cadences (Alfred Publishing, số 00-5743; gam, hợp âm, hợp âm rải, kết ở mọi giọng trưởng và thứ); Kostka, Payne, Tonal Harmony (McGraw-Hill; mục lục có voice leading, inversions, cadences); Aldwell, Schachter, Harmony and Voice Leading (mục lục có four-part writing and voice leading; I, V, and V7; uses of IV, II, VI; 6/4 techniques). Điều từng sách đóng góp khớp mục lục."
    luot_2: khong-chac
    luot_2_ghi_chu: Ba sách có thật (Palmer/Manus/Lethco, Alfred; Kostka–Payne, McGraw-Hill; Aldwell–Schachter) nhưng tôi không mở được trang nhà xuất bản; phần "điều từng sách đóng góp" không kiểm được.
