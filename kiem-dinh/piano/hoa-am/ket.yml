      - so-ngon
    ket_qua: dung
    ghi_chu: "Kết nửa, plagal, lừa: 4/4, L:1/4, 4 ô mỗi dòng, đủ phách. Dòng 1: I–vi | IV–V (kết nửa, fermata trên V), I–IV | I (kết plagal). Dòng 2: I–IV | V–vi (kết lừa) | ii6–V7 | I. Nhãn đúng: [EAc]/A,, là vi, [DFA]/F,, là ii6, [DFB] trên G,, là V7 (tay phải Rê–Fa–Si, bass Sol: đủ bốn nốt). Dẫn bè: V→vi Si lên Đô, Rê xuống Đô, Sol xuống Mi (hai nốt Đô), không song song quãng 8 với bass. Ngón khớp bảng."
  - khoi: 3
