    ghi_chu: "I–ii6–V7–I ba vị trí: 4/4, L:1/4, 2 ô mỗi dòng, đủ phách. ii6 = Rê–Fa–La với bass Fa2 ([FAd], [Adf], [A,DF]); V7 = tay phải [FGB], [GBf], [G,B,F] cộng bass Sol2: có Sol, Si, Fa, thiếu nốt năm Rê (V7 thiếu nốt năm được Mount 19 nêu). Fa giữ từ ii6 sang V7 rồi xuống Mi; Si lên Đô. Vị trí quãng 5: [CEG]→[A,DF] đi xuống nên tránh quãng 5 song song. Ngón khớp bảng (1-2-5, 1-3-5, 1-2-4)."
  - khoi: 5
