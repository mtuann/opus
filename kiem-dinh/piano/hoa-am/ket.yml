    ghi_chu: "Kết ở La thứ (K:Am): 4/4, L:1/4, ba dòng 2, 3, 2 ô, đủ phách. Sol♯ ghi bằng ^G ở V và V7; bass A,,, D,,, E,,. Nhãn: i [CEA]/A,,; iv [DFA]/D,,; V [B,E^G]/E,,; i6/4 là [CEA] trên bass E,, (dây nối); ii°6 [DFB]/D,, (Si–Rê–Fa giảm, Rê ở bass); V7 [DE^G]/E,, (thiếu nốt năm). Fa luôn xuống Mi; Sol♯ đến từ La hay Si; không có quãng 2 tăng; không song song quãng 5, 8. Ngón khớp bảng."
ghi_chu: 'Kết ở mọi giọng (piano/hoa-am/ket, lõi). Nguồn mở: OMT (Intro to Harmony, Cadential 6/4, Plagal Motion, Roman Numerals, Inversion and Figured Bass, First-Species, Minor Scales), Mount ch. 16/19/24 và Guide to SATB, MT21C (Voice Leading Root Position, Minor Key Signatures), COD qua encyclopedia.com (cadence, cadenza). Sửa trang: n3 ("thông dụng nhất"), n10 ("nghe rỗng"), n32 (bè trên không chỉ đi bước liền: có Fa xuống Rê), n35 ("hướng về V rõ hơn"), n36 ("chuẩn bị"), n37 ("rất thường gặp"), n48 ("thường gặp nhất"); bỏ musictheory.net khỏi Nguồn (không kiểm được nội dung), thêm nguồn đã mở. Chưa chắc: n11 (hầu như tự tránh song song), n27 (cadenza concerto thời Cổ điển), n28 (phách của I6/4), n54 (ba sách in). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5; lượt 1 không tạo hồ sơ thuật ngữ): perfect authentic cadence (kết trọn), imperfect authentic cadence (kết chưa trọn), half cadence (kết nửa), plagal cadence (kết plagal), deceptive cadence (kết lừa), cadential 6/4 (hợp âm 6/4 ở kết), voice leading (dẫn bè), common tone (nốt chung), parallel fifths/octaves (quãng 5, 8 song song), open/close position (vị trí). Đã có: cadence, leading tone, inversion. Lô trước yêu cầu giữ: KHỚP (13-ket: bốn loại kết ở 24 giọng; hop-am-rai: kết với nhiều cách dẫn bè hơn; nghe-tien-trinh: neo #i64-truoc-at-am và #ii6-va-v7-ket-ay-u còn nguyên, không đổi ## ; nhac-ly/05-dau-hoa: "Fa thăng kép", "Đô thăng kép" còn trong bảng; nhac-ly/index và 12-hoa-am-chuc-nang: trang có). Câu ve-site trỏ trang chưa chuyển: n51 (luyen-tap/hoa-bieu#vong-quang-nam, luyen-tap/metronome, luyen-tap/nhat-ky, tai-lieu-tham-khao đã kiểm trên ../opus-zero/docs). Lưu ý cho người giao: "bốn loại kết" nhưng mục kể năm; nhãn I6/4 (site) và V6/4 (OMT); n53 danh sách "Sẵn sàng" thiếu i–iv–i6/4–V–i. Review D4-gom (nhóm E, 28/10/2026): quyết các mục null và lượt 2 khong-chac; sửa trang ở n11 (bỏ), n17 và n55 (bốn loại kết khớp nghe-tien-trinh, bài 13), n27 (cadenza), n53 (Sẵn sàng đủ ba tiến trình giọng thứ); n28, n54 có nguồn bậc 2. Giữ nhãn I6/4 (như nghe-tien-trinh đã khóa; bài 13 không dùng nhãn 6/4) và neo #i64-truoc-at-am, #ii6-va-v7-ket-ay-u (đã kiểm trong dist/).'
doi_chu:
  - cu: Kết là dấu chấm câu của âm nhạc (bài 13); trang này biến nó thành phản xạ của hai bàn tay. Tay trái chơi bè bass, tay phải chơi ba nốt dẫn bè gần nhất, ở ba vị trí và trong cả 24 giọng. Học xong, bạn chơi được bốn loại kết và ba tiến trình kết thông dụng nhất mà không cần nhìn bản nhạc.
    moi: Kết là dấu chấm câu của âm nhạc (bài 13); trang này biến nó thành phản xạ của hai bàn tay. Tay trái chơi bè bass, tay phải chơi ba nốt dẫn bè gần nhất, ở ba vị trí và trong cả 24 giọng. Học xong, bạn chơi được bốn loại kết và ba tiến trình kết mà không cần nhìn bản nhạc.
    ly_do: 'n3 (da-sua): "thông dụng nhất" là xếp hạng không kiểm được; bỏ.'
  - cu: "Không để hai bè đi song song quãng 5 hoặc quãng 8: hai bè nhập làm một và hòa âm nghe rỗng. Giữ quy tắc 1 và 2 thì hầu như tự tránh được."
    moi: "Không để hai bè đi song song quãng 5 hoặc quãng 8: hai bè nhập làm một và mất tính độc lập."
    ly_do: 'n10 (da-sua): nguồn (OMT, Mount) nói hai bè mất tính độc lập; "nghe rỗng" không có nguồn.; n11 (da-bo, review D4-gom): không có nguồn bậc 1–2 cho "hầu như tự tránh được"; chính trang có chỗ đi gần nhất vẫn ra quãng 5 song song.'
  - cu: "Đọc to bè trên cùng của từng vị trí: Đô–Đô–Si–Đô, Mi–Fa–Rê–Mi, Sol–La–Sol–Sol. Bè này chỉ đi bước liền hoặc đứng yên."
    moi: "Đọc to bè trên cùng của từng vị trí: Đô–Đô–Si–Đô, Mi–Fa–Rê–Mi, Sol–La–Sol–Sol. Bè này đi bước liền hoặc đứng yên, trừ một chỗ: Fa xuống Rê ở vị trí quãng 3."
    ly_do: "n32 (da-sua): sai, khối abc 1 vị trí quãng 3 có Fa xuống Rê (nhảy quãng 3)."
  - cu: "Vị trí quãng 8 ở ví dụ trên kết bằng kết trọn: V và I đều ở thể gốc, bè trên về chủ âm. Hai vị trí kia có cùng các hợp âm, nhưng bè trên dừng ở nốt ba hoặc nốt năm, nên là kết chưa trọn: đã kết nhưng còn hơi mở. Ba loại kết còn lại, cũng ở vị trí quãng 8:"
    moi: "Bốn loại kết ở trang này là kết trọn, kết nửa, kết plagal và kết lừa, như ở công cụ nhận biết kết. Vị trí quãng 8 ở ví dụ trên kết bằng kết trọn: V và I đều ở thể gốc, bè trên về chủ âm. Hai vị trí kia có cùng các hợp âm, nhưng bè trên dừng ở nốt ba hoặc nốt năm, nên là kết chưa trọn: vẫn là kết V–I, đã kết nhưng còn hơi mở. Trang này tính kết trọn và kết chưa trọn là hai dạng của cùng một loại kết V–I; bài 13 xếp chúng thành hai dòng riêng. Ba loại kết còn lại, cũng ở vị trí quãng 8:"
    ly_do: 'n17 (da-sua, review D4-gom): trang nói "bốn loại kết" mà mục kể năm tên; OMT: kết trọn và kết chưa trọn là hai dạng của authentic cadence (V–I). n55 (mới, ve-site): bốn loại như nghe-tien-trinh.'
  - cu: Trong I–IV–I6/4–V–I, tay phải chơi lại đúng hình hợp âm I, nhưng tay trái đã sang át âm. Đô–Mi–Sol với Sol ở bass (I6/4, thể đảo 2) nghe như một V còn đang "treo", và chỉ yên khi Mi xuống Rê, Đô xuống Si. Đây là hợp âm 6/4 ở kết (cadential 6/4); trong concerto thời Cổ điển, cadenza của nghệ sĩ độc tấu thường bắt đầu từ chính hợp âm này.
    moi: Trong I–IV–I6/4–V–I, tay phải chơi lại đúng hình hợp âm I, nhưng tay trái đã sang át âm. Đô–Mi–Sol với Sol ở bass (I6/4, thể đảo 2) nghe như một V còn đang "treo", và chỉ yên khi Mi xuống Rê, Đô xuống Si. Đây là hợp âm 6/4 ở kết (cadential 6/4); trong concerto, cadenza của nghệ sĩ độc tấu chen vào kết và bắt đầu từ chính hợp âm này.
    ly_do: 'n27 (da-sua, review D4-gom): COD (cadenza) nói cadenza chèn vào kết cuối và bắt đầu ở hợp âm chủ đảo 2; không giới hạn "thời Cổ điển", không nói "thường".'
  - cu:
      - 'ii6 là Rê–Fa–La với Fa ở bass. Nó chung hai nốt với IV (Fa, La) nên thay được IV, còn nốt Rê làm nó hướng về V rõ hơn. Ở cả ba vị trí, nốt Fa của tay phải giữ nguyên sang V7 và trở thành nốt 7, rồi đi xuống Mi: tai nghe nốt nghịch ấy đã được "chuẩn bị" từ trước.'
      - "Ở vị trí quãng 5, đi thẳng từ Đô–Mi–Sol lên Rê–Fa–La sẽ tạo quãng 5 song song (Đô–Sol lên Rê–La). Vì vậy tay phải đi xuống: bè trên hát Sol–Fa–Fa–Mi và kết ở nốt ba, một kết chưa trọn rất thường gặp."
    moi:
      - "ii6 là Rê–Fa–La với Fa ở bass. Nó chung hai nốt với IV (Fa, La) nên thay được IV; chỗ khác duy nhất là nốt Rê thay cho nốt Đô. Ở cả ba vị trí, nốt Fa của tay phải giữ nguyên sang V7 và trở thành nốt 7, rồi đi xuống Mi: nốt Fa đã có sẵn từ hợp âm trước."
      - "Ở vị trí quãng 5, đi thẳng từ Đô–Mi–Sol lên Rê–Fa–La sẽ tạo quãng 5 song song (Đô–Sol lên Rê–La). Vì vậy tay phải đi xuống: bè trên hát Sol–Fa–Fa–Mi và kết ở nốt ba, một kết chưa trọn."
    ly_do: 'n35 (da-sua): "hướng về V rõ hơn" là nhận xét nghe, nguồn chỉ nói cùng chức năng hạ át; thay bằng điều kiểm được.; n36 (da-sua): chỉ giữ phần kiểm được (Fa là nốt chung của ii6 và V7); bỏ phần "tai nghe".; n37 (da-sua): "rất thường gặp" là tần suất không kiểm được; bỏ.'
  - cu: Nói cảm âm trước khi chơi giọng thứ. Quên nâng cảm âm là lỗi thường gặp nhất, nhất là ở những giọng có cảm âm "lạ" như Mi♯ (Fa♯ thứ) hay Fa thăng kép (Sol♯ thứ).
    moi: Nói cảm âm trước khi chơi giọng thứ. Quên nâng cảm âm thì V thành hợp âm thứ, nhất là ở những giọng có cảm âm "lạ" như Mi♯ (Fa♯ thứ) hay Fa thăng kép (Sol♯ thứ).
    ly_do: 'n48 (da-sua): "thường gặp nhất" không kiểm được; thay bằng hệ quả kiểm được (V thành hợp âm thứ).'
  - cu: Chơi được i–iv–V–i và i–ii°6–V7–i ở La, Mi, Rê thứ
    moi: Chơi được ba tiến trình i–iv–V–i, i–iv–i6/4–V–i, i–ii°6–V7–i ở La, Mi, Rê thứ
    ly_do: "n53 (da-sua, review D4-gom): tuần 4 nói ba tiến trình ở giọng thứ; danh sách thiếu i–iv–i6/4–V–i."
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Introduction to Harmony, Cadences, and Phrase Endings, Strengthening Endings with Cadential 6/4, Plagal Motion, Roman Numerals, First-Species Counterpoint, Minor Scales, Scale Degrees, and Key Signatures."
      - "Andre Mount, Fundamentals, Function, and Form (Milne Publishing): 16. Minor Scale Variants, 19. The Dominant Seventh Chord, 24. The Pre-Dominant Function, Guide to SATB part-writing."
      - "The Concise Oxford Dictionary of Music (qua Encyclopedia.com): cadence, cadenza."
      - "Robert Hutchinson, Music Theory for the 21st-Century Classroom: Minor Key Signatures."
    ly_do: "Mục Nguồn: bỏ musictheory.net (không mở để đối chiếu), thêm các chương OMT và sách Mount đã mở ở lượt 1."
