nhan_dinh:
  - id: n1
    cau: Kết là dấu chấm câu của âm nhạc (bài 13); trang này biến nó thành phản xạ của hai bàn tay.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Link /opus/nhac-ly/13-ket/: src/content/docs/nhac-ly/13-ket.md có, dòng 6 mở bằng chính hình ảnh "dấu chấm câu". Review: đã kiểm src/content/docs/nhac-ly/13-ket.md dòng 6 ("Âm nhạc cũng có ''dấu chấm câu''"); link /opus/nhac-ly/13-ket/ có trong dist/.'
    review: dung
  - id: n2
    cau: Tay trái chơi bè bass, tay phải chơi ba nốt dẫn bè gần nhất, ở ba vị trí và trong cả 24 giọng.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên trang: mỗi ví dụ tay trái một nốt, tay phải ba nốt; bảng "Tập trong mọi giọng" có 12 hàng, mỗi hàng một giọng trưởng và một giọng thứ, tức 24 giọng. Khớp điều lô trước yêu cầu giữ (kiem-dinh/nhac-ly/13-ket: hộp "Trên phím đàn", chơi bốn loại kết ở 24 giọng). Review: đã kiểm trên trang: năm khối abc, tay trái một nốt, tay phải ba nốt; bảng "Tập trong mọi giọng" 12 hàng, mỗi hàng một giọng trưởng và một giọng thứ (24 giọng).'
    review: dung
  - id: n3
    cau: Học xong, bạn chơi được bốn loại kết và ba tiến trình kết mà không cần nhìn bản nhạc.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ba tiến trình kết thông dụng nhất". Ba tiến trình là I–IV–V–I, I–IV–I6/4–V–I, I–ii6–V7–I (các mục ## của trang). "Thông dụng nhất" là xếp hạng không kiểm được; bỏ. Lưu ý cho người giao: trang nói "bốn loại kết" nhưng mục "Bốn loại kết" gọi tên năm (trọn, chưa trọn, nửa, plagal, lừa); lô trước (13-ket, nghe-tien-trinh) yêu cầu giữ "bốn loại kết" nên không đổi. Review: ba tiến trình là I–IV–V–I, I–IV–I6/4–V–I, I–ii6–V7–I (khối abc 1, 3, 4). "Bốn loại kết" nay được trang nói rõ ở mục cùng tên (kết trọn, nửa, plagal, lừa; kết chưa trọn là một dạng của kết V–I, xem n17, n55), khớp luyen-tai/nghe-tien-trinh (đã khóa: "bốn loại kết", bảng bốn dòng) và bài 13 (đã khóa: bảng năm dòng, trang này nói rõ cách tính khác).'
    review: dung
  - id: n4
    cau: Bè bass là nốt trầm nhất; ở các tiến trình đầu trang là nốt gốc của hợp âm (trừ I6/4 và ii6).
    loai: dinh-nghia
    nguon:
      - omt-figbass
    ket_qua: dung
    ghi_chu: "OMT: thể gốc có nốt gốc ở bass, thể đảo có nốt khác. Đã kiểm 5 khối abc: bass là nốt gốc ở mọi hợp âm thể gốc; ngoại lệ đúng là I6/4 (Sol), ii6 (Fa), ii°6 (Rê)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/cadential-64/" ]
    luot_2_ghi_chu: Bass là nốt thấp nhất; trừ I6/4 (Sol) và ii6 (Fa) thì bass là gốc. Khớp định nghĩa đảo hợp âm.
  - id: n5
    cau: Tay phải chơi ba nốt sát nhau, gọn trong một quãng tám; cộng với tay trái là bốn bè như một dàn hợp xướng; nốt trên cùng của tay phải là bè giai điệu.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả cách chơi của trang; đã kiểm mọi hợp âm tay phải trong 5 khối abc nằm trong một quãng tám.
  - id: n6
    cau: Bạn đã chơi vòng I–IV–I–V7–I theo cách này ở trang hợp âm và hình đệm; trang này đi tiếp từ đó.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích /opus/piano/hop-am-rai/ đã chuyển (src/content/docs/piano/hop-am-rai.md), có mục "Hòa âm bàn phím: vòng kết I–IV–I–V7–I". Review: src/content/docs/piano/hop-am-rai.md, mục "Hòa âm bàn phím: vòng kết I–IV–I–V7–I" (dòng 181–183): tay trái nốt gốc, tay phải ba nốt dẫn giọng gần nhất.'
    review: dung
  - id: n7
    cau: Khi đổi hợp âm, dùng dẫn bè gần nhất (bài 12).
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Link /opus/nhac-ly/12-hoa-am-chuc-nang/: src/content/docs/nhac-ly/12-hoa-am-chuc-nang.md có, dòng 74 nói về dẫn bè gần nhất. Review: bài 12 (12-hoa-am-chuc-nang.md) mục \"Dẫn bè\": mỗi bè đi gần nhất có thể, giữ nguyên nốt chung."
    review: dung
  - id: n8
    cau: Nốt chung của hai hợp âm giữ nguyên; các nốt khác đi đến nốt gần nhất của hợp âm mới, thường là một bước liền.
    loai: quy-tac
    nguon:
      - mt21c-vl
      - mountguide
    ket_qua: dung
    ghi_chu: "MT21C 26.7: giữ nốt chung, các bè trên đi đến nốt gần nhất (bậc hai hoặc ba). Mount, Guide to SATB: tương tự."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/strengthening-endings-with-v7/" ]
    luot_2_ghi_chu: "Quy tắc nối bè chuẩn: giữ nốt chung, các bè còn lại đi nốt gần nhất (OMT nói cùng ý khi chọn nốt gần nhất để tránh song song)."
  - id: n9
    cau: Cảm âm (Si ở Đô trưởng) đi lên chủ âm; nốt 7 của V7 (Fa) đi xuống.
    loai: quy-tac
    nguon:
      - mount19
      - mountguide
    ket_qua: dung
    ghi_chu: "Mount 19: cảm âm lên chủ âm, nốt bảy xuống bậc liền. Khối abc 1, 3, 4, 5: mọi Si về Đô, mọi Fa về Mi."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/strengthening-endings-with-v7/" ]
    luot_2_ghi_chu: "Cảm âm lên chủ âm, nốt 7 của V7 (Fa) xuống Mi: đúng."
  - id: n10
    cau: "Không để hai bè đi song song quãng 5 hoặc quãng 8: hai bè nhập làm một và mất tính độc lập."
    loai: quy-tac
    nguon:
      - mountguide
      - omt-first
      - mount14
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hai bè nhập làm một và hòa âm nghe rỗng". Nguồn (OMT, Mount) nói quãng 5 và 8 song song làm hai bè mất tính độc lập; "nghe rỗng" không có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/" ]
    luot_2_ghi_chu: "OMT: song song quãng 5/8 làm hai bè nhập làm một, mất tính độc lập giai điệu."
  - id: n11
    cau: Giữ quy tắc 1 và 2 thì hầu như tự tránh được.
    loai: quy-tac
    nguon:
      - mt21c-vl
    ket_qua: da-bo
    ghi_chu: 'Chưa chắc: MT21C nêu giữ nốt chung và đi gần nhất là cách dẫn bè tốt, nhưng không nguồn nào nói nhờ đó "hầu như tự tránh" quãng 5, 8 song song. Chính ví dụ ii6 ở vị trí quãng 5 của trang là chỗ đi gần nhất mà vẫn song song quãng 5 (không có nốt chung). Lượt 2 hay người giao quyết: giữ hay bỏ câu. Review D4-gom: bỏ câu. Lượt 2 cho "dung" chỉ dựa vào tự dựng bè, không có nguồn bậc 1–2 nói giữ nốt chung và đi gần nhất thì "hầu như tự tránh" quãng 5, 8 song song; chính trang (mục ii6, vị trí quãng 5) có chỗ đi gần nhất vẫn ra quãng 5 song song. Chữ cũ: "... hai bè nhập làm một và mất tính độc lập. Giữ quy tắc 1 và 2 thì hầu như tự tránh được." Chữ mới: "... hai bè nhập làm một và mất tính độc lập." Đã xem trang: không còn chữ cũ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/strengthening-endings-with-v7/", "https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/" ]
    luot_2_ghi_chu: Giữ nốt chung và đi nốt gần nhất trong I–IV–V–I tránh được song song; kiểm bằng dựng bè, đúng.
  - id: n12
    cau: "Ta gọi tên vị trí theo nốt trên cùng của hợp âm I: vị trí quãng 8 (Mi–Sol–Đô), vị trí quãng 3 (Sol–Đô–Mi), vị trí quãng 5 (Đô–Mi–Sol)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Quy ước đặt tên của site (README thuật ngữ: vị trí gọi theo nốt trên cùng). Đã kiểm: nốt trên cùng Đô, Mi, Sol của ba hình đúng là quãng 8, 3, 5 so với nốt gốc Đô. Review: khối abc 1: nốt trên cùng của ba hình là Đô, Mi, Sol (quãng 8, 3, 5 tính từ nốt gốc Đô); tên vị trí là quy ước gọi của site, dùng thống nhất trong năm khối abc và bảng ngón."
    review: dung
  - id: n13
    cau: Hãy tập cả ba vị trí, vì khi đệm cho một giai điệu, nốt giai điệu nằm trên cùng sẽ chọn vị trí cho bạn.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
    luot_2: dung
    luot_2_ghi_chu: "Hợp lý: nốt giai điệu quyết định vị trí hợp âm."
  - id: n14
    cau: "Tay trái giữ một thế cho cả trang: ngón 1 trên Đô3, ngón 5 trên Fa2, ngón 4 trên Sol2, ngón 3 trên La2 khi cần."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "Ngón bấm tay trái: bass của trang chỉ gồm Đô3, Fa2, Sol2, La2 (khối abc 1–4) nên thế này đủ. Cùng thế với trang dem-giai-dieu (ngón 1 Đô3, ngón 4 Sol2, ngón 5 Fa2)."
  - id: n15
    cau: "Ngón tay phải tùy khoảng cách giữa ba nốt: quãng 3 + quãng 3 và quãng 4 ở dưới là 1-3-5; quãng 4 hoặc rộng hơn ở trên là 1-2-5; quãng 2 ở dưới là 1-2-4."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
