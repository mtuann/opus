    ket_qua: da-sua
    ghi_chu: 'OMT: appoggiatura và suspension rơi vào phách mạnh nên quy tắc không tuyệt đối; đã giới hạn "trong bài tập này".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "Nốt hợp âm ở phách mạnh, nốt ngoài hợp âm ở phách yếu: quy ước của bài tập, hợp lý."
  - id: n12
    cau: "Đừng để nốt trang trí che quãng 8 hay quãng 5 song song giữa giai điệu và bass: thêm một vài nốt không làm mất lỗi ấy."
