khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem: &a1
      - cu-phap
      - nhip
      - giong
      - hop-am
      - bac-bass
      - giai-dieu
      - dan-be
      - so-ngon
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Khung và trang trí trên I – IV – V – I, 4/4, L:1/8, Q:72. Hàng khung: Mi, Fa, Rê, Đô trên bass Đô, Fa, Sol, Đô, mỗi ô một nốt, đủ 8 móc đơn. Hàng trang trí: nốt thêu (Mi – Rê – Mi) và nốt lướt (Sol – Fa – Mi...) ghi đúng; ô 3 kết bằng trill trên Rê (!trill!d4) ở bass Sol, đủ 8 móc đơn. Ngón gợi ý hợp lý (3, 2). node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 2
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Chủ đề và hai biến tấu, 4/4, L:1/8, Q:80. Chủ đề trùng với bài 2 ở 10 bài đầu tiên (C C G G | A A G2 | F F E E | D D C2). Biến tấu A: giai điệu có nốt thêu, đủ 8 móc đơn mỗi ô. Biến tấu B: tay trái Alberti (Đô – Sol – Mi – Sol...), đúng hợp âm I, IV, I, V theo bass và giai điệu; ngón 5 1 3 1 hợp lý. node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 3
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Biến tấu C ở Đô thứ, 4/4, K:Cm, Q:80 (đã sửa từ 72 cho khớp chữ ♩ = 80). La♭, Mi♭ do khóa; Si♮ ở bass ô 4 có dấu hóa (=B,,) làm cảm âm cho V. Bass Đô – Rê – Mi♭ – Đô | Fa – La♭ – Đô | La♭ – Fa – Đô – Mi♭ | Sol – Si♮ – Đô: hợp âm Đô thứ, Fa thứ, Sol. Bè đối ở tay trái hợp lý. node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 4
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Câu hỏi và câu trả lời, 3/4, L:1/8, Q:80 (đã sửa từ 96). Mỗi ô đủ 6 móc đơn. Hai câu mở bằng Do–Re–Mi (bass Đô – Si – Đô, giai điệu 1–2–3). Câu hỏi: kết hội tụ, bass Mi – Fa – Fa♯ – Sol, giai điệu Mi – Rê – Đô – Si, dừng trên V với dấu lặng ô 4. Câu trả lời: Mi trên Sol (I6/4), Rê (V, láy rền), Đô (I), dấu lặng ô 8. node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 5
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Minuet 16 ô, 3/4, L:1/8, Q:96 (chữ bước 1 ghi tập chậm ♩ = 80). Ô 1–4: Romanesca, bass Đô – Si – La – Mi, nốt đầu mỗi ô của giai điệu Đô – Sol – Đô – Đô (1–5–1–1). Ô 5–8: Prinner chen V, bass Fa – Mi – Rê, Sol – Đô, giai điệu La – Sol – Fa – Mi (6–5–4–3). Có dấu nhắc lại :||: giữa ô 8 và 9. Ô 9–12: Fonte, bass Đô♯ – Rê – Si – Đô, khung Sol – Fa – Fa – Mi. Ô 13–16: cadenza composta, bass Mi – Fa – Sol – Đô, khung Đô – Rê – Mi – Rê – Đô. Mỗi ô đủ phách (6 móc đơn). node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 6
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Dạo đầu ở Sol, 4/4, K:G, Q:66. Ô 1: rải Sol – Rê – Si – Rê rồi chờ (z4), 8 móc đơn. Ô 2: Quiescenza (Fa♮ – Mi – Fa♯ – Sol trên bass Sol giữ). Ô 3: bass Si – Đô – Rê dẫn về V. Ô 4: dấu ngân trên Sol, đủ 8 móc đơn. Bàn đạp có ký hiệu. Ngón hợp lý. Dấu ngân trong ô 4 là ngoài đủ phách chuẩn 4/4 nhưng đủ 8 móc đơn. node tools/khuong-nhac.mjs: 0 lỗi."
ghi_chu: "Trang ứng tác (tầng lõi), 6 khối abc soạn riêng, lượt 1 (D4-L4 phần B). Nguồn mở và đọc: OMT (Embellishing Tones, Phrase Archetypes, 2.04 Third-Species, Galant Schemas, Minor Scales), C. P. E. Bach Versuch bản dịch trực tuyến, Britannica (K. 265), COD (Trill), IMSLP (Czerny Op. 200, Op. 300; Wq. 50), MTO 21.3. K. 265 chỉ có Wikipedia (bậc 3) cho niên đại 1778 và 1781–1782, số K. 300e, cấu trúc chủ đề (A–B–A, 8 ô 2/4) và đặc điểm biến tấu 1, 2, 8, 11, 12: ket_qua null, người gom tìm nguồn bậc 1 hay 2 (IMSLP và Henle không mở được) hoặc bỏ; câu hỏi kiểm tra 2 dựa vào đó. Các câu về lịch sử dạo đầu (mục đích, thói quen thế kỷ 18–19, thưa dần ở thế kỷ 20, Hamilton 2008) cũng null. Đã sửa: Q của khối abc 3 (72 thành 80) và khối abc 4 (96 thành 80) cho khớp chữ ♩ = 80; liên kết đoạn nhạc đổi từ bài 31 sang bài 13; quy tắc song song và phách 1 theo OMT; láy rền theo C. P. E. Bach; Czerny Op. 300. Khối abc 5 có Q:96 (mục tiêu tuần 12) trong khi bước tập 1 ghi 80: giữ, người gom cân nhắc. Cần giữ theo lô trước (grep piano/hoa-am kiem-dinh/): piano/index ghi ứng tác; nhac-ly/index n9; hop-am-rai, nhac-ly/12, 13, choi-bang-tai trỏ về hoa-am index, ket, dem-giai-dieu (phần A): không mâu thuẫn. Link tới trang chưa chuyển: piano/tac-pham/minuet-sol, luyen-tap/thu-am, luyen-tap/nhat-ky, tai-lieu-tham-khao (đều có ở site cũ, giữ link). Thuật ngữ chưa có trong src/data/thuat-ngu.yml (không tạo hồ sơ): nốt lướt (passing tone), nốt thêu (neighbor tone), biến tấu (variation), dạo đầu (preluding), đoạn nhạc (period), kết nửa (half cadence), partimento, schema và các tên mẫu. Dòng Nguồn của trang còn trích Wikipedia: nên thay (n60)."
doi_chu:
  - cu: "Mọi ứng tác cổ điển bắt đầu từ một khung: mỗi ô một nốt giai điệu thuộc hợp âm của ô ấy, như Mi – Fa – Rê – Đô trên I – IV – V – I. Giữa các nốt khung, bạn thêm hai loại nốt ngoài hợp âm (bài 18):"
    moi: "Ứng tác cổ điển thường bắt đầu từ một khung: mỗi ô một nốt giai điệu thuộc hợp âm của ô ấy, như Mi – Fa – Rê – Đô trên I – IV – V – I. Giữa các nốt khung, bạn thêm hai loại nốt ngoài hợp âm (bài 18):"
    ly_do: 'n2 (da-sua): không có nguồn cho "mọi".'
  - cu: "Đến kết, thêm một nốt hoa mỹ: láy rền trên bậc 2 khi bass ở át âm là một dấu hiệu rất quen của nhạc thế kỷ 18. Cách chơi láy rền, appoggiatura và láy quanh có ở trang nốt hoa mỹ."
    moi: "Đến kết, bạn có thể thêm một nốt hoa mỹ: láy rền trên bậc 2 khi bass ở át âm. Cách chơi láy rền, appoggiatura và láy quanh có ở trang nốt hoa mỹ."
    ly_do: "n3 (da-bo): không có nguồn."
  - cu: Chơi dòng trang trí như ghi. Theo lệ thời Cổ điển, láy rền bắt đầu từ nốt trên (Mi).
    moi: Chơi dòng trang trí như ghi. Theo C. P. E. Bach (Versuch, 1753), láy rền bắt đầu từ nốt trên (Mi).
    ly_do: 'n10 (da-sua): dẫn nguồn thay cho "lệ thời Cổ điển".'
  - cu: "Hai quy tắc giữ trang trí đúng phong cách. Phách 1 luôn là nốt hợp âm, thường chính là nốt khung. Và đừng để hai ô liền nhau cùng mở đầu bằng quãng 8 (hay cùng bằng quãng 5) với bass khi cả hai bè cùng chuyển: đó vẫn là quãng 8, quãng 5 song song, chỉ bị các nốt trang trí che đi."
    moi: "Hai lời khuyên để trang trí gọn. Trong bài tập này, phách 1 giữ một nốt hợp âm, thường chính là nốt khung; nốt ngoài hợp âm đặt ở phách yếu. Và đừng để các nốt trang trí che một quãng 8 hay quãng 5 song song giữa giai điệu và bass: thêm một vài nốt không làm mất lỗi ấy."
    ly_do: "n11 (da-sua): OMT cho appoggiatura và suspension ở phách mạnh nên không tuyệt đối.; n13 (da-bo): OMT 2.04 cho phép hai ô liền, chỉ cấm ba ô."
  - cu:
      - Mozart viết 12 biến tấu trên giai điệu Pháp Ah! vous dirai-je, maman (in lần đầu năm 1761), giai điệu bạn đã chơi ở 10 bài đầu tiên. Tác phẩm mang số K. 265 (300e). Người ta từng cho rằng nó được viết ở Paris năm 1778; phân tích bản thảo của Wolfgang Plath cho thấy khoảng 1781–1782 mới đúng hơn. Bản in đầu tiên ra năm 1785 ở Vienna.
      - "Chủ đề ở Đô trưởng, gồm ba đoạn tám ô (A–B–A). Mỗi biến tấu giữ khung ấy và đổi tiết tấu, kết cấu hay hòa âm: biến tấu 1 phủ giai điệu bằng chuỗi móc kép ở tay phải, biến tấu 2 chuyển chuyển động nhanh xuống tay trái, biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ), biến tấu 11 là Adagio, còn biến tấu 12 (Allegro) đổi sang nhịp 3/4 và khép lại bằng một coda."
    moi:
      - Mozart viết 12 biến tấu trên giai điệu Pháp Ah! vous dirai-je, maman, giai điệu bạn đã chơi ở 10 bài đầu tiên. Tác phẩm mang số K. 265 (300e). Người ta từng cho rằng nó được viết ở Paris năm 1778; phân tích bản thảo của Wolfgang Plath cho thấy khoảng 1781–1782 mới đúng hơn. Bản in đầu tiên ra năm 1785 ở Vienna.
      - "Chủ đề ở Đô trưởng, gồm ba đoạn A–B–A, mỗi đoạn tám ô nhịp 2/4 trong bản của Mozart (viết lại ở nhịp 4/4 như bên dưới, mỗi đoạn bốn ô, cả chủ đề mười hai ô). Mỗi biến tấu giữ khung ấy và đổi tiết tấu, kết cấu hay hòa âm: biến tấu 1 phủ giai điệu bằng chuỗi móc kép ở tay phải, biến tấu 2 chuyển chuyển động nhanh xuống tay trái, biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ), biến tấu 11 là Adagio, còn biến tấu 12 (Allegro) đổi sang nhịp 3/4 và khép lại bằng một coda."
    ly_do: "n20 (da-bo): không có nguồn bậc 1 hay 2."
  - cu: "Câu nhạc cổ điển hay đi thành cặp. Câu hỏi dừng ở át âm bằng một kết nửa; câu trả lời bắt đầu giống hệt, rồi rẽ về chủ âm bằng một kết trọn. Hai câu tạo thành một đoạn nhạc (period, xem hình thức nhỏ). Ví dụ dưới đây xây trên các mẫu galant: cả hai câu mở bằng Do–Re–Mi; câu hỏi dừng bằng kết hội tụ, câu trả lời về nhà qua I6/4 – V – I."
    moi: "Câu nhạc cổ điển hay đi thành cặp. Câu hỏi thường dừng ở át âm bằng một kết nửa; câu trả lời thường bắt đầu giống câu hỏi, rồi rẽ về chủ âm bằng một kết trọn. Hai câu tạo thành một đoạn nhạc (period, xem bài 13). Ví dụ dưới đây xây trên các mẫu galant: cả hai câu mở bằng Do–Re–Mi; câu hỏi dừng bằng kết hội tụ, câu trả lời về nhà qua I6/4 – V – I."
    ly_do: "n31 (da-sua): OMT: chỉ đoạn song song mới mở đầu giống nhau."
  - cu: "Thế kỷ 18 và 19, nghệ sĩ đàn phím thường không vào bài một cách đột ngột. Họ dạo đầu (preluding): vài hợp âm, một đường rải hay gam, một kết, đủ để báo giọng cho người nghe, thử cây đàn và căn phòng, làm ấm tay, hoặc nối hai bài khác giọng trong cùng một chương trình. Carl Czerny in cả một tập 120 đoạn dạo đầu mẫu, Die Kunst des Präludierens (Nghệ thuật dạo đầu), Op. 300, nhiều đoạn chưa đến một phút. Sang thế kỷ 20, thói quen này thưa dần trên sân khấu hòa nhạc; ở nhà, ở lớp hay khi chơi cho bạn bè, bạn vẫn dùng được nó."
    moi: "Thế kỷ 18 và 19, nghệ sĩ đàn phím thường không vào bài một cách đột ngột. Họ dạo đầu (preluding): vài hợp âm, một đường rải hay gam, một kết, đủ để báo giọng cho người nghe, thử cây đàn và căn phòng, làm ấm tay, hoặc nối hai bài khác giọng trong cùng một chương trình. Carl Czerny in cả một tập 120 ví dụ gồm đoạn dạo đầu, chuyển giọng, kết và fantasia, Die Kunst des Präludierens (Nghệ thuật dạo đầu), Op. 300. Sang thế kỷ 20, thói quen này thưa dần trên sân khấu hòa nhạc; ở nhà, ở lớp hay khi chơi cho bạn bè, bạn vẫn dùng được nó."
    ly_do: "n41 (da-sua): IMSLP mô tả 120 ví dụ gồm bốn loại; chi tiết độ dài không có nguồn."
