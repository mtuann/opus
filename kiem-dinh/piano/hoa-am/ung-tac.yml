    ket_qua: da-sua
    ghi_chu: 'Bach I-2-3 đoạn 5: láy rền luôn bắt đầu từ nốt kề trên nốt chính. Đã dẫn nguồn thay cho "lệ thời Cổ điển". Lưu ý: Bach là 1753 (phần 1) và đúng khi nhắc Versuch.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory33.htm", "https://imslp.org/wiki/Versuch_%C3%BCber_die_wahre_Art_das_Clavier_zu_spielen_(Bach,_Carl_Philipp_Emanuel)" ]
    luot_2_ghi_chu: "Dolmetsch: C. P. E. Bach, Versuch (1753), láy rền bắt đầu từ nốt phụ trên; IMSLP xác nhận Phần I năm 1753."
  - id: n11
    cau: "Hai lời khuyên: phách 1 giữ một nốt hợp âm, nốt ngoài hợp âm đặt ở phách yếu (trong bài tập này)."
    loai: quy-tac
    nguon:
