    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Biến tấu C ở Đô thứ, 4/4, K:Cm, Q:80 (đã sửa từ 72 cho khớp chữ ♩ = 80). La♭, Mi♭ do khóa; Si♮ ở bass ô 4 có dấu hóa (=B,,) làm cảm âm cho V. Bass Đô – Rê – Mi♭ – Đô | Fa – La♭ – Đô | La♭ – Fa – Đô – Mi♭ | Sol – Si♮ – Đô: hợp âm Đô thứ, Fa thứ, Sol. Bè đối ở tay trái hợp lý. node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 4
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Câu hỏi và câu trả lời, 3/4, L:1/8, Q:80 (đã sửa từ 96). Mỗi ô đủ 6 móc đơn. Hai câu mở bằng Do–Re–Mi (bass Đô – Si – Đô, giai điệu 1–2–3). Câu hỏi: kết hội tụ, bass Mi – Fa – Fa♯ – Sol, giai điệu Mi – Rê – Đô – Si, dừng trên V với dấu lặng ô 4. Câu trả lời: Mi trên Sol (I6/4), Rê (V, láy rền), Đô (I), dấu lặng ô 8. node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 5
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Minuet 16 ô, 3/4, L:1/8, Q:96 (chữ bước 1 ghi tập chậm ♩ = 80). Ô 1–4: Romanesca, bass Đô – Si – La – Mi, nốt đầu mỗi ô của giai điệu Đô – Sol – Đô – Đô (1–5–1–1). Ô 5–8: Prinner chen V, bass Fa – Mi – Rê, Sol – Đô, giai điệu La – Sol – Fa – Mi (6–5–4–3). Có dấu nhắc lại :||: giữa ô 8 và 9. Ô 9–12: Fonte, bass Đô♯ – Rê – Si – Đô, khung Sol – Fa – Fa – Mi. Ô 13–16: cadenza composta, bass Mi – Fa – Sol – Đô, khung Đô – Rê – Mi – Rê – Đô. Mỗi ô đủ phách (6 móc đơn). node tools/khuong-nhac.mjs: 0 lỗi."
  - khoi: 6
    loai: vi-du-soan
    kiem: *a1
    ket_qua: dung
    ghi_chu: "Soạn cho trang. Dạo đầu ở Sol, 4/4, K:G, Q:66. Ô 1: rải Sol – Rê – Si – Rê rồi chờ (z4), 8 móc đơn. Ô 2: Quiescenza (Fa♮ – Mi – Fa♯ – Sol trên bass Sol giữ). Ô 3: bass Si – Đô – Rê dẫn về V. Ô 4: dấu ngân trên Sol, đủ 8 móc đơn. Bàn đạp có ký hiệu. Ngón hợp lý. Dấu ngân trong ô 4 là ngoài đủ phách chuẩn 4/4 nhưng đủ 8 móc đơn. node tools/khuong-nhac.mjs: 0 lỗi."
ghi_chu: "Trang ứng tác (tầng lõi), 6 khối abc soạn riêng, lượt 1 (D4-L4 phần B). Nguồn mở và đọc: OMT (Embellishing Tones, Phrase Archetypes, 2.04 Third-Species, Galant Schemas, Minor Scales), C. P. E. Bach Versuch bản dịch trực tuyến, Britannica (K. 265), COD (Trill), IMSLP (Czerny Op. 200, Op. 300; Wq. 50), MTO 21.3. K. 265 chỉ có Wikipedia (bậc 3) cho niên đại 1778 và 1781–1782, số K. 300e, cấu trúc chủ đề (A–B–A, 8 ô 2/4) và đặc điểm biến tấu 1, 2, 8, 11, 12: ket_qua null, người gom tìm nguồn bậc 1 hay 2 (IMSLP và Henle không mở được) hoặc bỏ; câu hỏi kiểm tra 2 dựa vào đó. Các câu về lịch sử dạo đầu (mục đích, thói quen thế kỷ 18–19, thưa dần ở thế kỷ 20, Hamilton 2008) cũng null. Đã sửa: Q của khối abc 3 (72 thành 80) và khối abc 4 (96 thành 80) cho khớp chữ ♩ = 80; liên kết đoạn nhạc đổi từ bài 31 sang bài 13; quy tắc song song và phách 1 theo OMT; láy rền theo C. P. E. Bach; Czerny Op. 300. Khối abc 5 có Q:96 (mục tiêu tuần 12) trong khi bước tập 1 ghi 80: giữ, người gom cân nhắc. Cần giữ theo lô trước (grep piano/hoa-am kiem-dinh/): piano/index ghi ứng tác; nhac-ly/index n9; hop-am-rai, nhac-ly/12, 13, choi-bang-tai trỏ về hoa-am index, ket, dem-giai-dieu (phần A): không mâu thuẫn. Link tới trang chưa chuyển: piano/tac-pham/minuet-sol, luyen-tap/thu-am, luyen-tap/nhat-ky, tai-lieu-tham-khao (đều có ở site cũ, giữ link). Thuật ngữ chưa có trong src/data/thuat-ngu.yml (không tạo hồ sơ): nốt lướt (passing tone), nốt thêu (neighbor tone), biến tấu (variation), dạo đầu (preluding), đoạn nhạc (period), kết nửa (half cadence), partimento, schema và các tên mẫu. Dòng Nguồn của trang còn trích Wikipedia: nên thay (n60). Review D4-gom (nhóm E, 28/10/2026): K. 265 nay có nguồn bậc 1–2 (lời nói đầu Henle HN 116; Mutopia theo ấn bản Porro; IMSLP; Morgan Library): giữ số K, niên đại (bỏ tên Plath), cấu trúc chủ đề, biến tấu 1, 2, 8, 12; bỏ Adagio/Allegro. Lịch sử dạo đầu: bỏ các câu không có nguồn (thói quen thế kỷ 18–19, thưa dần ở thế kỷ 20, Hamilton 2008), giữ Czerny Op. 300; mục đích dạo đầu thành lời khuyên. Thời ấy đổi khác khi nhắc lại: bỏ. Dòng Wikipedia ở mục Nguồn: bỏ. Tốc độ minuet: thêm câu nói rõ 80 là tốc độ bắt đầu, 96 là mục tiêu. Câu n15 \"giai điệu Pháp\" giữ theo Britannica (\"French folk song\"); lời nói đầu Henle cho biết nguồn gốc Pháp của giai điệu bị nghi ngờ (giai điệu truy được từ thập niên 1760): ghi lại cho lô sau."
doi_chu:
  - cu: "Mọi ứng tác cổ điển bắt đầu từ một khung: mỗi ô một nốt giai điệu thuộc hợp âm của ô ấy, như Mi – Fa – Rê – Đô trên I – IV – V – I. Giữa các nốt khung, bạn thêm hai loại nốt ngoài hợp âm (bài 18):"
    moi: "Ứng tác cổ điển thường bắt đầu từ một khung: mỗi ô một nốt giai điệu thuộc hợp âm của ô ấy, như Mi – Fa – Rê – Đô trên I – IV – V – I. Giữa các nốt khung, bạn thêm hai loại nốt ngoài hợp âm (bài 18):"
    ly_do: 'n2 (da-sua): không có nguồn cho "mọi".'
  - cu: "Đến kết, thêm một nốt hoa mỹ: láy rền trên bậc 2 khi bass ở át âm là một dấu hiệu rất quen của nhạc thế kỷ 18. Cách chơi láy rền, appoggiatura và láy quanh có ở trang nốt hoa mỹ."
    moi: "Đến kết, bạn có thể thêm một nốt hoa mỹ: láy rền trên bậc 2 khi bass ở át âm. Cách chơi láy rền, appoggiatura và láy quanh có ở trang nốt hoa mỹ."
    ly_do: "n3 (da-bo): không có nguồn."
  - cu: Chơi dòng trang trí như ghi. Theo lệ thời Cổ điển, láy rền bắt đầu từ nốt trên (Mi).
    moi: Chơi dòng trang trí như ghi. Theo C. P. E. Bach (Versuch, 1753), láy rền bắt đầu từ nốt trên (Mi).
    ly_do: 'n10 (da-sua): dẫn nguồn thay cho "lệ thời Cổ điển".'
  - cu: "Hai quy tắc giữ trang trí đúng phong cách. Phách 1 luôn là nốt hợp âm, thường chính là nốt khung. Và đừng để hai ô liền nhau cùng mở đầu bằng quãng 8 (hay cùng bằng quãng 5) với bass khi cả hai bè cùng chuyển: đó vẫn là quãng 8, quãng 5 song song, chỉ bị các nốt trang trí che đi."
    moi: "Hai lời khuyên để trang trí gọn. Trong bài tập này, phách 1 giữ một nốt hợp âm, thường chính là nốt khung; nốt ngoài hợp âm đặt ở phách yếu. Và đừng để các nốt trang trí che một quãng 8 hay quãng 5 song song giữa giai điệu và bass: thêm một vài nốt không làm mất lỗi ấy."
    ly_do: "n11 (da-sua): OMT cho appoggiatura và suspension ở phách mạnh nên không tuyệt đối.; n13 (da-bo): OMT 2.04 cho phép hai ô liền, chỉ cấm ba ô."
  - cu:
      - Mozart viết 12 biến tấu trên giai điệu Pháp Ah! vous dirai-je, maman (in lần đầu năm 1761), giai điệu bạn đã chơi ở 10 bài đầu tiên. Tác phẩm mang số K. 265 (300e). Người ta từng cho rằng nó được viết ở Paris năm 1778; phân tích bản thảo của Wolfgang Plath cho thấy khoảng 1781–1782 mới đúng hơn. Bản in đầu tiên ra năm 1785 ở Vienna.
      - "Chủ đề ở Đô trưởng, gồm ba đoạn tám ô (A–B–A). Mỗi biến tấu giữ khung ấy và đổi tiết tấu, kết cấu hay hòa âm: biến tấu 1 phủ giai điệu bằng chuỗi móc kép ở tay phải, biến tấu 2 chuyển chuyển động nhanh xuống tay trái, biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ), biến tấu 11 là Adagio, còn biến tấu 12 (Allegro) đổi sang nhịp 3/4 và khép lại bằng một coda."
    moi:
      - Mozart viết 12 biến tấu trên giai điệu Pháp Ah! vous dirai-je, maman, giai điệu bạn đã chơi ở 10 bài đầu tiên. Tác phẩm mang số K. 265 (300e). Người ta từng cho rằng nó được viết ở Paris năm 1778; nghiên cứu chữ viết và giấy của bản thảo cho thấy khoảng 1781–1782 mới đúng hơn. Bản in đầu tiên ra năm 1785 ở Vienna.
      - "Chủ đề ở Đô trưởng, gồm ba đoạn A–B–A, mỗi đoạn tám ô nhịp 2/4 trong bản của Mozart (viết lại ở nhịp 4/4 như bên dưới, mỗi đoạn bốn ô, cả chủ đề mười hai ô). Mỗi biến tấu giữ khung ấy và đổi tiết tấu, kết cấu hay hòa âm: biến tấu 1 phủ giai điệu bằng chuỗi móc kép ở tay phải, biến tấu 2 chuyển chuyển động nhanh xuống tay trái, biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ), còn biến tấu 12 đổi sang nhịp 3/4 và khép lại bằng một coda."
    ly_do: "n20 (da-bo): không có nguồn bậc 1 hay 2.; n18 (da-sua, review D4-gom): Henle (lời nói đầu HN 116) nêu chữ viết và giấy của bản thảo, không nêu tên Plath.; n24 (da-sua, review D4-gom): Adagio, Allegro không có nguồn bậc 1–2 đã mở; phần còn lại theo Mutopia (ấn bản Porro)."
  - cu: "Câu nhạc cổ điển hay đi thành cặp. Câu hỏi dừng ở át âm bằng một kết nửa; câu trả lời bắt đầu giống hệt, rồi rẽ về chủ âm bằng một kết trọn. Hai câu tạo thành một đoạn nhạc (period, xem hình thức nhỏ). Ví dụ dưới đây xây trên các mẫu galant: cả hai câu mở bằng Do–Re–Mi; câu hỏi dừng bằng kết hội tụ, câu trả lời về nhà qua I6/4 – V – I."
    moi: "Câu nhạc cổ điển hay đi thành cặp. Câu hỏi thường dừng ở át âm bằng một kết nửa; câu trả lời thường bắt đầu giống câu hỏi, rồi rẽ về chủ âm bằng một kết trọn. Hai câu tạo thành một đoạn nhạc (period, xem bài 13). Ví dụ dưới đây xây trên các mẫu galant: cả hai câu mở bằng Do–Re–Mi; câu hỏi dừng bằng kết hội tụ, câu trả lời về nhà qua I6/4 – V – I."
    ly_do: "n31 (da-sua): OMT: chỉ đoạn song song mới mở đầu giống nhau."
  - cu: Chơi riêng bè bass, ♩ = 80, và hát giai điệu khung bên trên.
    moi: Chơi riêng bè bass, ♩ = 80, và hát giai điệu khung bên trên. Bản nghe ở trên chạy ở ♩ = 96, tốc độ mục tiêu của tuần 12.
    ly_do: "n54 (khong-can-nguon, review D4-gom): thống nhất tốc độ khối abc 5 (96) với bước tập (80)."
  - cu: Trang trí nửa sau theo cùng cách. Mỗi nửa chơi hai lần, lần nhắc lại trang trí khác đi. Thời ấy, đổi khác khi nhắc lại là chuyện bình thường; C. P. E. Bach còn in cả những sonata ghi sẵn các lần nhắc lại đã được biến đổi.
    moi: Trang trí nửa sau theo cùng cách. Mỗi nửa chơi hai lần, lần nhắc lại trang trí khác đi. C. P. E. Bach đã in cả những sonata ghi sẵn các lần nhắc lại được biến đổi (Sechs Sonaten für Clavier mit veränderten Reprisen, 1760).
    ly_do: 'n37 (da-bo, review D4-gom): "chuyện bình thường" không có nguồn; n36 (da-sua): thêm tên và năm theo IMSLP Wq. 50.'
  - cu: "Thế kỷ 18 và 19, nghệ sĩ đàn phím thường không vào bài một cách đột ngột. Họ dạo đầu (preluding): vài hợp âm, một đường rải hay gam, một kết, đủ để báo giọng cho người nghe, thử cây đàn và căn phòng, làm ấm tay, hoặc nối hai bài khác giọng trong cùng một chương trình. Carl Czerny in cả một tập 120 đoạn dạo đầu mẫu, Die Kunst des Präludierens (Nghệ thuật dạo đầu), Op. 300, nhiều đoạn chưa đến một phút. Sang thế kỷ 20, thói quen này thưa dần trên sân khấu hòa nhạc; ở nhà, ở lớp hay khi chơi cho bạn bè, bạn vẫn dùng được nó."
    moi: "Ở thế kỷ 19, dạo đầu (preluding) trước một bản nhạc là một kỹ năng được dạy hẳn hoi: Carl Czerny in cả một tập 120 ví dụ gồm đoạn dạo đầu, chuyển giọng, kết và fantasia, Die Kunst des Präludierens (Nghệ thuật dạo đầu), Op. 300. Một đoạn dạo đầu ngắn có thể chỉ là vài hợp âm, một đường rải hay gam và một kết, đủ để báo giọng cho người nghe, làm quen cây đàn, làm ấm tay, hoặc nối hai bài khác giọng. Ở nhà, ở lớp hay khi chơi cho bạn bè, bạn vẫn dùng được nó."
    ly_do: "n41 (da-sua): IMSLP mô tả 120 ví dụ gồm bốn loại; chi tiết độ dài không có nguồn.; n39 (da-sua), n40 (đổi thành khuyen-tap), n43 (da-bo), review D4-gom: COD (prelude) không nói về thói quen dạo đầu, mục đích hay sự thưa dần; chỉ giữ điều có nguồn (IMSLP Czerny Op. 300)."
  - cu:
      - 'Wolfgang Amadeus Mozart, 12 biến tấu về Ah, vous dirai-je, maman, K. 265 (300e): bản nhạc trên IMSLP (tìm "Ah vous dirai-je maman K.265"); bản Urtext của G. Henle Verlag.'
      - 'Twelve Variations on "Ah vous dirai-je, Maman" (Wikipedia): niên đại, bản in đầu và cấu trúc các biến tấu.'
    moi: "Wolfgang Amadeus Mozart, 12 biến tấu về Ah, vous dirai-je, maman, K. 265 (300e): bản nhạc trên IMSLP; bản cho hai guitar theo ấn bản Porro trên Mutopia (nhịp và giọng của chủ đề và các biến tấu); lời nói đầu của ấn bản Urtext G. Henle Verlag, HN 116 (PDF): niên đại, bản in đầu."
    ly_do: "n59 (da-sua), n60 (da-bo), n63 (da-bo), review D4-gom: thay Wikipedia và link chung bằng trang đã mở; bỏ Hamilton (không mở được, không còn câu dựa vào)."
  - cu: "Kenneth Hamilton, After the Golden Age: Romantic Pianism and Modern Performance (Oxford University Press, 2008): thói quen dạo đầu của nghệ sĩ piano thế kỷ 19."
    ly_do: "n63 (da-bo, review D4-gom): bỏ dòng Hamilton 2008 ở mục Nguồn vì đoạn lịch sử dạo đầu dựa vào nó đã bỏ."
