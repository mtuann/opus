nhan_dinh:
  - id: n1
    cau: "Ứng tác theo phong cách cổ điển là trang trí một khung có sẵn ngay tại đàn; các bước: tô điểm giai điệu, biến tấu chủ đề, câu hỏi và trả lời, minuet trên bè bass cho sẵn, dạo đầu."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả cách học của trang; hợp với mô tả partimento ở MTO 21.3 (thực hiện bè bass thành nhạc tại đàn).
  - id: n2
    cau: 'Cũ: "Mọi ứng tác cổ điển bắt đầu từ một khung"; nay "thường bắt đầu".'
    loai: quy-tac
    nguon:
      - mto-rab
    ket_qua: da-sua
    ghi_chu: 'Không có nguồn cho "mọi"; đã đổi thành "thường". Review D4-gom: lượt 2 cho "sai" là với chữ cũ ("Mọi ứng tác cổ điển"); câu đúng lượt 2 đề xuất ("thường bắt đầu từ một khung") trùng chữ mới lượt 1 đã sửa. Hai lượt thống nhất; giữ chữ mới.'
    luot_2: sai
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/", "https://en.wikipedia.org/wiki/Galant_Schemata" ]
    luot_2_ghi_chu: 'câu đúng: Ứng tác kiểu galant thường bắt đầu từ một khung (schema).; Nói "mọi" ứng tác cổ điển bắt đầu từ một khung là quá tuyệt đối; OMT/Gjerdingen coi schema là cách xây câu rất phổ biến, không phải mọi ứng tác.'
  - id: n3
    cau: 'Cũ: nốt khung ở mỗi ô "là một dấu hiệu rất quen của nhạc thế kỷ 18".'
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Không có nguồn; đã bỏ. Review D4-gom: đã xem trang: không còn "dấu hiệu rất quen".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu cũ, mơ hồ ("dấu hiệu rất quen"); không kiểm được.
  - id: n4
    cau: "Khung: mỗi ô một nốt giai điệu thuộc hợp âm của ô ấy, như Mi – Fa – Rê – Đô trên I – IV – V – I."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "Cách làm của trang; kiểm trên khối abc 1: Mi trên Đô, Fa trên Fa, Rê trên Sol, Đô trên Đô, đều là nốt hợp âm."
    luot_2: dung
    luot_2_ghi_chu: "Mi–Fa–Rê–Đô trên I–IV–V–I: mỗi nốt thuộc hợp âm, đúng."
  - id: n5
    cau: Nốt lướt đi bậc liền từ một nốt hợp âm sang một nốt hợp âm khác, theo một hướng (Sol – Fa – Mi).
    loai: dinh-nghia
    nguon:
      - omt-et
    ket_qua: dung
    ghi_chu: "OMT: passing tone."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "OMT: passing là nốt hợp âm đi bậc liền sang nốt hợp âm khác theo một hướng; Sol–Fa–Mi đúng."
  - id: n6
    cau: Nốt thêu rời một nốt hợp âm một bậc rồi quay về chính nó (Mi – Rê – Mi).
    loai: dinh-nghia
    nguon:
