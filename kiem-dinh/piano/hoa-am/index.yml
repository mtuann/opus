nhan_dinh:
  - id: i1
    cau: "Phần này dạy bạn chơi hòa âm bằng hai bàn tay: kết ở mọi giọng, tự đệm cho một giai điệu, rồi ứng tác những đoạn ngắn theo phong cách cổ điển."
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Khớp bốn trang của phần: ket.md, dem-giai-dieu.md, mau-galant.md, ung-tac.md (đều có trong src/content/docs/piano/hoa-am/). Lô trước yêu cầu giữ tiêu đề "Hòa âm bên phím và ứng tác" (hop-am-rai, 12-hoa-am-chuc-nang): còn nguyên. Review: bốn trang con (ket, dem-giai-dieu, mau-galant, ung-tac) đúng ba việc nêu ở câu: kết, đệm giai điệu, ứng tác theo phong cách cổ điển.'
    review: dung
  - id: i2
    cau: Dành cho người lớn đã xong chặng sơ cấp.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/lo-trinh.md: "## Chặng 2. Sơ cấp (≈ Grade 1–2)". Review: piano/lo-trinh.md (đã khóa): "## Chặng 2. Sơ cấp (≈ Grade 1–2)"; câu nay viết "đã xong chặng sơ cấp (chặng 2 của lộ trình, khoảng Grade 1–2)" (xem i3).'
    review: dung
  - id: i3
    cau: Phần này dành cho người lớn đã xong chặng sơ cấp (chặng 2 của lộ trình, khoảng Grade 1–2), cho đến hết chặng trung cấp.
    loai: cap-do
    nguon:
      - abrsm-2526
    ket_qua: da-sua
    ghi_chu: 'Chưa chắc: lo-trinh ghi chặng 2 ≈ Grade 1–2; ABRSM (Piano Practical Grades syllabus 2025–2026) đã mở để đối chiếu gam nhưng lượt này chưa đối chiếu nội dung "Grade 2 đến trung cấp". Lượt 2 xem lại. Review D4-gom: chữ cũ "từ khoảng Grade 2 đến trung cấp" không có nguồn cho mức đối tượng. Chữ mới chỉ nêu điều kiểm được: chặng 2 (Sơ cấp) ≈ Grade 1–2 theo piano/lo-trinh (đã khóa) và hành trang của chặng 2 (i4) nằm trong Grade 1–2 của ABRSM 2025–2026 (lượt 2 đã đối chiếu ở i4). "Cho đến hết chặng trung cấp" là lựa chọn của site (chặng 4 của lộ trình). Chữ mới cần lượt 2 bổ sung. Người gom (D4-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, encyclopedia.com, OMT, IMSLP chặn hay lỗi), không phải vì nguồn nói khác; giữ theo nguồn lượt 1 và review đã mở, ghi ở trên.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu cap-do: phần chặng là hệ của site; ánh xạ Grade 1–2 không kiểm được bằng nguồn ngoài."
  - id: i4
    cau: Gam trưởng Đô, Sol, Rê, Fa và gam thứ hòa âm La, Mi, Rê, hợp âm ba ở các thể đảo, vòng I–IV–I–V7–I ở Đô, Sol, Fa trưởng là hành trang của chặng 2 (khoảng Grade 1–2), xem trang hợp âm và hình đệm.
    loai: cap-do
    nguon:
      - abrsm-2526
    ket_qua: dung
    ghi_chu: 'Chưa chắc: phần chặng khớp lo-trinh.md (hàng "Gam, hợp âm" của chặng 2: đúng các gam và vòng kết ấy); phần "Grade 1–2" chưa đối chiếu từng gam với ABRSM (không đọc xong bảng gam trong PDF). Phần ve-site (link /opus/piano/hop-am-rai/ có) đã kiểm. Review D4-gom: lượt 2 đối chiếu ABRSM Piano 2025 & 2026: các gam Đô, Sol, Rê, Fa trưởng, La, Mi, Rê thứ thuộc Grade 1–2; phần chặng 2 khớp lo-trinh.md (đã khóa) hàng "Gam, hợp âm" của chặng 2 (dòng 61).'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf" ]
    luot_2_ghi_chu: "ABRSM Piano 2025 và 2026: Grade 1 có C, G, F trưởng, A và D thứ; Grade 2 thêm D, A trưởng, E, G thứ; D, G, F, C trưởng và A, E, D thứ nằm trong Grade 1–2 (thứ hòa âm được phép). Phần hợp âm đảo và vòng I–IV–I–V7–I là chương trình riêng của site, đúng mức, không thuộc đề ABRSM; 'chặng 2' là về site."
  - id: i5
    cau: Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, kể cả những nốt không ghi sẵn trên bản nhạc, và chuyển chúng sang các giọng khác.
    loai: dinh-nghia
    nguon:
      - cms-kh
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chơi các tiến trình hợp âm bằng tay, không cần bản nhạc, trong mọi giọng". CMS (A Re-Evaluation of Keyboard Harmony): chuyển giọng tiến trình, hòa âm giai điệu, ứng tác, chơi các nốt không viết ra. "Không cần bản nhạc" và "mọi giọng" quá rộng; sửa theo nguồn. Định nghĩa đồng bộ với hop-am-rai.'
    luot_2: dung
    luot_2_nguon: [ "https://admin.rcmusic.com/sites/default/files/files/Keyboard%20Harmony%209_Crossover%20Sample.pdf" ]
    luot_2_ghi_chu: "RCM Keyboard Harmony: hòa âm lời giai điệu, chơi tiến trình hợp âm, tạo đệm theo ký hiệu hợp âm; mẫu đã mở không nhắc chuyển giọng nhưng đó là yêu cầu thường kèm."
  - id: i6
    cau: "Hòa âm bên phím gắn với bốn việc: đọc nhạc (một phần lớn của đọc nhanh là nhận ra hình mẫu; I–IV–V–I hay một kết là hình mẫu), học thuộc (khung hòa âm là phần trí nhớ phân tích, cho chỗ bám lại khi lỡ quên), hiểu bản nhạc (luyện cả tai lẫn đầu óc, không chỉ ngón tay), ứng tác."
    loai: quy-tac
    nguon:
      - cms-kh
    ket_qua: da-sua
    ghi_chu: "Chưa chắc: CMS nêu chuyển giọng, hòa âm giai điệu và ứng tác là thành phần của hòa âm bên phím; chưa tìm được nguồn bậc 1–2 nêu lợi ích cho thị tấu và học thuộc. Lượt 2 xem lại; nếu không có nguồn thì người giao quyết bỏ hay nói nhẹ đi. Review D4-gom: lượt 2 khong-chac, không có nguồn bậc 1–2 cho \"đọc nhanh hơn\", \"học thuộc chắc hơn\" như lợi ích. Viết lại bảng: cột \"Bạn được gì\" thành \"Việc\", bỏ \"nhanh hơn\", \"chắc hơn\"; mỗi hàng chỉ nêu điều có ở trang đã kiểm định hay nguồn: đọc nhạc theo trang thi-tau (n1, nguồn Perra, MTNA); học thuộc theo trang hoc-thuoc-bieu-dien (bảng bốn loại trí nhớ, trí nhớ phân tích; Chaffin và Imreh: điểm mốc là chỗ bám lại); hiểu bản nhạc theo CMS Symposium 22 (trích Brings và cộng sự 1979: \"the true purpose of studying keyboard harmony is to train the mind and the ear, not the fingers\"); ứng tác: CMS \"Improvisation is an especially valuable tool in the keyboard harmony classroom\" và trang ung-tac. Chữ mới cần lượt 2 bổ sung. Người gom (D4-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, encyclopedia.com, OMT, IMSLP chặn hay lỗi), không phải vì nguồn nói khác; giữ theo nguồn lượt 1 và review đã mở, ghi ở trên."
    luot_2: khong-chac
    luot_2_ghi_chu: Nhận định tổng hợp/diễn giải, không có nguồn bậc 2 để xác nhận từng ý; không thấy sai.
  - id: i7
    cau: "Link: thị tấu (/opus/piano/thi-tau/) và học thuộc và biểu diễn (/opus/piano/hoc-thuoc-bieu-dien/)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "src/content/docs/piano/thi-tau.md và hoc-thuoc-bieu-dien.md có. Review: src/content/docs/piano/thi-tau.md và piano/hoc-thuoc-bieu-dien.md có (cùng nhánh)."
    review: dung
  - id: i8
    cau: Thời Baroque, người chơi đàn phím khi đệm thường chỉ có trước mặt một bè bass, đôi khi kèm các con số, và tự chơi hợp âm bên trên.
    loai: lich-su
    nguon:
      - cod-continuo
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "người chơi đàn phím trong dàn nhạc". COD (continuo): đàn phím chơi bè bass kèm số và tự thêm hợp âm; nguồn không giới hạn continuo vào "dàn nhạc"; đổi thành "khi đệm". Link bè trầm số (/opus/nhac-ly/25-be-tram-so/) có.'
    luot_2: dung
    luot_2_nguon: [ "https://www.eclassical.com/shop/17115/art95/4459595-663eb8-BIS-CD-1422_booklet.pdf" ]
    luot_2_ghi_chu: "Ghi chú BIS: phần hai Versuch dạy 'realizing' bè trầm số, dựng hòa âm từ các con số; hợp với thực hành continuo Baroque."
  - id: i9
    cau: "Ở các nhạc viện Napoli thế kỷ 18, học trò luyện partimento: những bè bass được hoàn thiện thành nhạc ngay trên bàn phím."
    loai: lich-su
    nguon:
      - gjerd-ch2
      - cod-partimento
    ket_qua: dung
    ghi_chu: "Gjerdingen ch. 2 (bản UCI): partimento ở nhạc viện Napoli, thực hiện tại đàn phím. COD (partimento): bè bass dạy hòa âm và ứng tác ở Ý thế kỷ 18. mo/link-hong (06/11/2026): bản trích UC Irvine trả 404; đổi sang bản lưu Wayback 09/02/2026, đã đối chiếu: các maestro \"developed a unique method of instruction centered on the partimento—the instructional bass\"; Tritto và Paisiello \"both of Naples\". Review link-hong (07/11/2026): bản lưu Wayback Gjerdingen ch. 2 09/02/2026 (id_) mở được, có chữ của chương; chỉ đổi link."
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20260209143103/https://music.arts.uci.edu/abauer/5.2/readings/Gjerdingen%20_Music_in_the_Galant_Style_Ch_2.pdf", "https://en.wikipedia.org/wiki/Partimento" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): Bản lưu Gjerdingen ch. 2: các maestro Ý dạy bằng partimento, \"became sound through realization at the keyboard\"; sổ partimento của Cimarosa \"used at the Conservatorio di Santa Maria di Loreto, Naples\" (1762). Wikipedia Partimento: \"guide for the improvisation ('realization') of a composition at the keyboard\", \"Neapolitan conservatories\"."
    review: dung
  - id: i10
    cau: "Carl Philipp Emanuel Bach, Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về cách chơi đàn phím đúng đắn): phần một 1753, phần hai 1762."
    loai: nam
    nguon:
      - imslp-versuch
      - brit-cpe
    ket_qua: dung
    ghi_chu: 'IMSLP: phần 1 năm 1753, phần 2 năm 1762. "Tiểu luận về cách chơi đàn phím đúng đắn" là bản dịch nghĩa của trang.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Versuch_%C3%BCber_die_wahre_Art_das_Clavier_zu_spielen_(Bach,_Carl_Philipp_Emanuel)" ]
    luot_2_ghi_chu: "IMSLP: phần 1 in 1753 (Henning), phần 2 in 1762 (Winter)."
  - id: i11
    cau: C.P.E. Bach dành phần hai của Versuch cho việc đệm, và kết thúc bằng fantasia tự do, tức ứng tác.
    loai: lich-su
    nguon:
      - imslp-versuch
      - brit-cpe
      - cpebach-toc
    ket_qua: dung
    ghi_chu: 'Chưa chắc: Britannica nói Versuch bàn về bè trầm số, nốt hoa mỹ, ngón bấm; chưa mở được mục lục phần 2 để xác nhận "dành cho việc đệm" và "kết thúc bằng fantasia tự do". Lượt 2 xem lại (IMSLP có bản quét). Review D4-gom: mục lục bản dịch Versuch (versuch.cpebach.org): phần II (1762) gồm 41 chương về hợp âm, bè trầm số và đệm ("On some precautions in accompaniment", "On recitative"…), chương cuối "Chapter 41. On the free fantasy".'
    luot_2: dung
    luot_2_nguon: [ "https://www.eclassical.com/shop/17115/art95/4459595-663eb8-BIS-CD-1422_booklet.pdf" ]
