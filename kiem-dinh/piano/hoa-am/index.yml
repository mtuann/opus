ghi_chu: 'Hòa âm bên phím và ứng tác (piano/hoa-am/index, lõi; trang không có khối abc). Nguồn mở: CMS Symposium vol. 22, COD (continuo, partimento, improvisation), Gjerdingen ch. 2 (bản UCI), OMT Galant Schemas, IMSLP và Britannica (Versuch), OMT/MT21C (giọng thứ), ABRSM 2025–2026 (chưa đối chiếu hết). Sửa trang: i5 (định nghĩa theo CMS), i8 ("trong dàn nhạc"), i18 (tên mẫu galant), i22 ("hiệu quả hơn một giờ dồn"). Chưa chắc: i3, i4 (Grade), i6 (lợi ích), i11 (phần hai Versuch kết bằng fantasia), i27 (ba sách in). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5; lượt 1 không tạo hồ sơ thuật ngữ): keyboard harmony (hòa âm bên phím), partimento, galant schema (mẫu galant), continuo/figured bass (bè trầm số), improvisation (ứng tác). Lô trước yêu cầu giữ: KHỚP (nhac-ly/12-hoa-am-chuc-nang và hop-am-rai: trang piano/hoa-am có, tiêu đề "Hòa âm bên phím và ứng tác"; nhac-ly/index: bốn trang con có; 29-chuoi-hoa-am: mau-galant có Romanesca và liên kết ngược, cần kiểm lại sau khi agent B sửa; nghe-tien-trinh: Romanesca 1–7–6–3, Prinner 4–3–2–1 ở mau-galant). Câu ve-site trỏ trang chưa chuyển: i24 (luyen-tap/metronome, nhat-ky), tai-lieu-tham-khao (dòng cuối Nguồn, không là nhận định). Lưu ý cho người giao: bảng 12 tuần tuần 7 chia việc hơi khác dem-giai-dieu (i20).'
doi_chu:
  - cu: "Nhiều người học piano cổ điển đọc từng nốt, tập từng ô và chưa bao giờ chơi một hợp âm mà bản nhạc không ghi. Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, không cần bản nhạc, trong mọi giọng. Nó cho bạn bốn thứ:"
    moi: "Nhiều người học piano cổ điển đọc từng nốt, tập từng ô và chưa bao giờ chơi một hợp âm mà bản nhạc không ghi. Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, kể cả những nốt không ghi sẵn trên bản nhạc, và chuyển chúng sang các giọng khác. Nó cho bạn bốn thứ:"
    ly_do: 'i5 (da-sua): sửa theo CMS (chuyển giọng, ứng tác, chơi nốt không viết ra); "không cần bản nhạc, trong mọi giọng" quá rộng.'
  - cu: "Đây cũng là cách người chơi đàn phím được đào tạo trong nhiều thế kỷ. Thời Baroque, người chơi đàn phím trong dàn nhạc thường chỉ có trước mặt một bè bass, đôi khi kèm các con số (bè trầm số), và tự chơi hợp âm bên trên. Ở các nhạc viện Napoli thế kỷ 18, học trò luyện partimento: những bè bass được hoàn thiện thành nhạc ngay trên bàn phím. Carl Philipp Emanuel Bach dành phần hai cuốn Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về cách chơi đàn phím đúng đắn, 1762) cho việc đệm, và kết thúc bằng fantasia tự do, tức ứng tác. Mozart và Beethoven đều nổi tiếng là những người ứng tác xuất sắc trước công chúng."
    moi: "Đây cũng là cách người chơi đàn phím được đào tạo trong nhiều thế kỷ. Thời Baroque, người chơi đàn phím khi đệm thường chỉ có trước mặt một bè bass, đôi khi kèm các con số (bè trầm số), và tự chơi hợp âm bên trên. Ở các nhạc viện Napoli thế kỷ 18, học trò luyện partimento: những bè bass được hoàn thiện thành nhạc ngay trên bàn phím. Carl Philipp Emanuel Bach dành phần hai cuốn Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về cách chơi đàn phím đúng đắn, 1762) cho việc đệm, và kết thúc bằng fantasia tự do, tức ứng tác. Mozart và Beethoven đều nổi tiếng là những người ứng tác xuất sắc trước công chúng."
    ly_do: 'i8 (da-sua): "trong dàn nhạc" thu hẹp không cần thiết; COD nói đàn phím đệm bè bass có số.'
  - cu: "Những công thức hai bè quen thuộc của âm nhạc thế kỷ 18 mà nhà nghiên cứu Robert Gjerdingen hệ thống hóa: Romanesca, Prinner, Monte, Fonte… (vài tên có từ thế kỷ 18, như Monte và Fonte của Joseph Riepel; vài tên do Gjerdingen đặt, như Prinner). Đó là vốn từ có sẵn cho ứng tác"
    moi: "Những công thức hai bè quen thuộc của âm nhạc thế kỷ 18 mà nhà nghiên cứu Robert Gjerdingen hệ thống hóa: Romanesca, Prinner, Monte, Fonte… (vài tên có từ thế kỷ 18, như Monte và Fonte của Joseph Riepel; vài tên đặt theo nhà lý thuyết, như Meyer). Đó là vốn từ có sẵn cho ứng tác"
    ly_do: 'i18 (da-sua): OMT nói Meyer đặt theo Leonard Meyer; "do Gjerdingen đặt Prinner" không kiểm được ở nguồn mở.'
  - cu: Mười phút đều đặn mỗi ngày hiệu quả hơn một giờ dồn vào cuối tuần. Đặt khối này ở đầu buổi tập, trước bài đang học.
    moi: Mười phút mỗi ngày là một khối nhỏ, dễ giữ đều. Đặt khối này ở đầu buổi tập, trước bài đang học.
    ly_do: "i22 (da-sua): so sánh hiệu quả học tập không có nguồn; bỏ."
