ghi_chu: 'Hòa âm bên phím và ứng tác (piano/hoa-am/index, lõi; trang không có khối abc). Nguồn mở: CMS Symposium vol. 22, COD (continuo, partimento, improvisation), Gjerdingen ch. 2 (bản UCI), OMT Galant Schemas, IMSLP và Britannica (Versuch), OMT/MT21C (giọng thứ), ABRSM 2025–2026 (chưa đối chiếu hết). Sửa trang: i5 (định nghĩa theo CMS), i8 ("trong dàn nhạc"), i18 (tên mẫu galant), i22 ("hiệu quả hơn một giờ dồn"). Chưa chắc: i3, i4 (Grade), i6 (lợi ích), i11 (phần hai Versuch kết bằng fantasia), i27 (ba sách in). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5; lượt 1 không tạo hồ sơ thuật ngữ): keyboard harmony (hòa âm bên phím), partimento, galant schema (mẫu galant), continuo/figured bass (bè trầm số), improvisation (ứng tác). Lô trước yêu cầu giữ: KHỚP (nhac-ly/12-hoa-am-chuc-nang và hop-am-rai: trang piano/hoa-am có, tiêu đề "Hòa âm bên phím và ứng tác"; nhac-ly/index: bốn trang con có; 29-chuoi-hoa-am: mau-galant có Romanesca và liên kết ngược, cần kiểm lại sau khi agent B sửa; nghe-tien-trinh: Romanesca 1–7–6–3, Prinner 4–3–2–1 ở mau-galant). Câu ve-site trỏ trang chưa chuyển: i24 (luyen-tap/metronome, nhat-ky), tai-lieu-tham-khao (dòng cuối Nguồn, không là nhận định). Lưu ý cho người giao: bảng 12 tuần tuần 7 chia việc hơi khác dem-giai-dieu (i20). Review D4-gom (nhóm E, 28/10/2026): i3 (viết lại theo mốc chặng của lo-trinh), i6 (bảng lợi ích viết lại cho kiểm được), i20 (tuần 6–7 khớp dem-giai-dieu); i4, i11, i27 có nguồn.'
doi_chu:
  - cu: "Phần này dạy bạn chơi hòa âm bằng hai bàn tay chứ không chỉ hiểu nó trên giấy: kết ở mọi giọng, tự đệm cho một giai điệu, rồi ứng tác những đoạn ngắn theo phong cách cổ điển. Dành cho người lớn đã xong chặng sơ cấp, từ khoảng Grade 2 đến trung cấp."
    moi: "Phần này dạy bạn chơi hòa âm bằng hai bàn tay chứ không chỉ hiểu nó trên giấy: kết ở mọi giọng, tự đệm cho một giai điệu, rồi ứng tác những đoạn ngắn theo phong cách cổ điển. Dành cho người lớn đã xong chặng sơ cấp (chặng 2 của lộ trình, khoảng Grade 1–2), cho đến hết chặng trung cấp."
    ly_do: 'i3 (da-sua, review D4-gom): không có nguồn cho "từ khoảng Grade 2"; dùng mốc chặng 2 ≈ Grade 1–2 của lo-trinh (đã khóa).'
  - cu:
      - "Nhiều người học piano cổ điển đọc từng nốt, tập từng ô và chưa bao giờ chơi một hợp âm mà bản nhạc không ghi. Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, không cần bản nhạc, trong mọi giọng. Nó cho bạn bốn thứ:"
      - Bạn được gì
      - Vì sao
      - Đọc nhạc nhanh hơn
      - Mắt nhận ra cả một khối như I–IV–V–I hay một kết, và tay đã quen hình. Thị tấu bớt đoán mò.
      - Học thuộc chắc hơn
      - '"Câu này đi I–V, dừng ở kết nửa" bền hơn một chuỗi nốt rời. Khi lỡ quên, bạn vẫn có điểm bám (học thuộc và biểu diễn).'
    moi:
      - "Nhiều người học piano cổ điển đọc từng nốt, tập từng ô và chưa bao giờ chơi một hợp âm mà bản nhạc không ghi. Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, kể cả những nốt không ghi sẵn trên bản nhạc, và chuyển chúng sang các giọng khác. Nó gắn với bốn việc của người chơi đàn:"
      - Việc
      - Hòa âm bên phím góp gì
      - Đọc nhạc
      - Một phần lớn của đọc nhanh là nhận ra hình mẫu (Thị tấu); I–IV–V–I hay một kết là những hình mẫu như thế, và tay bạn đã quen chúng.
      - Học thuộc
      - Hiểu khung hòa âm ("câu này đi I–V, dừng ở kết nửa") là phần trí nhớ phân tích, cho bạn chỗ để bám lại khi lỡ quên (học thuộc và biểu diễn).
    ly_do: 'i5 (da-sua): sửa theo CMS (chuyển giọng, ứng tác, chơi nốt không viết ra); "không cần bản nhạc, trong mọi giọng" quá rộng.'
  - cu:
      - Biết câu nhạc đang rời nhà hay sắp về nhà giúp bạn chọn sắc thái, chỗ thở và rubato.
      - Tự do ứng tác
    moi:
      - "Chơi tiến trình bằng tay luyện cả tai lẫn đầu óc, không chỉ ngón tay: bạn nghe ra câu nhạc đang rời nhà hay sắp về nhà."
      - Ứng tác
    ly_do: 'i6 (da-sua, review D4-gom): bỏ lời khẳng định lợi ích không có nguồn ("nhanh hơn", "chắc hơn", chọn sắc thái và rubato); mỗi hàng chỉ nêu điều có ở trang đã kiểm định (thi-tau, hoc-thuoc-bieu-dien) hay nguồn CMS.'
  - cu: "Đây cũng là cách người chơi đàn phím được đào tạo trong nhiều thế kỷ. Thời Baroque, người chơi đàn phím trong dàn nhạc thường chỉ có trước mặt một bè bass, đôi khi kèm các con số (bè trầm số), và tự chơi hợp âm bên trên. Ở các nhạc viện Napoli thế kỷ 18, học trò luyện partimento: những bè bass được hoàn thiện thành nhạc ngay trên bàn phím. Carl Philipp Emanuel Bach dành phần hai cuốn Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về cách chơi đàn phím đúng đắn, 1762) cho việc đệm, và kết thúc bằng fantasia tự do, tức ứng tác. Mozart và Beethoven đều nổi tiếng là những người ứng tác xuất sắc trước công chúng."
