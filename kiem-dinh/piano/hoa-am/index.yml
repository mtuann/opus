nhan_dinh:
  - id: i1
    cau: "Phần này dạy bạn chơi hòa âm bằng hai bàn tay: kết ở mọi giọng, tự đệm cho một giai điệu, rồi ứng tác những đoạn ngắn theo phong cách cổ điển."
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Khớp bốn trang của phần: ket.md, dem-giai-dieu.md, mau-galant.md, ung-tac.md (đều có trong src/content/docs/piano/hoa-am/). Lô trước yêu cầu giữ tiêu đề "Hòa âm bên phím và ứng tác" (hop-am-rai, 12-hoa-am-chuc-nang): còn nguyên.'
  - id: i2
    cau: Dành cho người lớn đã xong chặng sơ cấp.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/lo-trinh.md: "## Chặng 2. Sơ cấp (≈ Grade 1–2)".'
  - id: i3
    cau: Phần này dành cho người từ khoảng Grade 2 đến trung cấp.
    loai: cap-do
    nguon:
      - abrsm-2526
    ket_qua: null
    ghi_chu: 'Chưa chắc: lo-trinh ghi chặng 2 ≈ Grade 1–2; ABRSM (Piano Practical Grades syllabus 2025–2026) đã mở để đối chiếu gam nhưng lượt này chưa đối chiếu nội dung "Grade 2 đến trung cấp". Lượt 2 xem lại.'
  - id: i4
    cau: Gam trưởng Đô, Sol, Rê, Fa và gam thứ hòa âm La, Mi, Rê, hợp âm ba ở các thể đảo, vòng I–IV–I–V7–I ở Đô, Sol, Fa trưởng là hành trang của chặng 2 (khoảng Grade 1–2), xem trang hợp âm và hình đệm.
    loai: cap-do
    nguon:
      - abrsm-2526
    ket_qua: null
    ghi_chu: 'Chưa chắc: phần chặng khớp lo-trinh.md (hàng "Gam, hợp âm" của chặng 2: đúng các gam và vòng kết ấy); phần "Grade 1–2" chưa đối chiếu từng gam với ABRSM (không đọc xong bảng gam trong PDF). Phần ve-site (link /opus/piano/hop-am-rai/ có) đã kiểm.'
  - id: i5
    cau: Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, kể cả những nốt không ghi sẵn trên bản nhạc, và chuyển chúng sang các giọng khác.
    loai: dinh-nghia
    nguon:
      - cms-kh
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chơi các tiến trình hợp âm bằng tay, không cần bản nhạc, trong mọi giọng". CMS (A Re-Evaluation of Keyboard Harmony): chuyển giọng tiến trình, hòa âm giai điệu, ứng tác, chơi các nốt không viết ra. "Không cần bản nhạc" và "mọi giọng" quá rộng; sửa theo nguồn. Định nghĩa đồng bộ với hop-am-rai.'
  - id: i6
    cau: "Hòa âm bên phím cho bạn bốn thứ: đọc nhạc nhanh hơn (mắt nhận ra cả khối như I–IV–V–I hay một kết), học thuộc chắc hơn (có điểm bám khi quên), hiểu bản nhạc (chọn sắc thái, chỗ thở và rubato), tự do ứng tác."
    loai: quy-tac
    nguon:
      - cms-kh
    ket_qua: null
    ghi_chu: "Chưa chắc: CMS nêu chuyển giọng, hòa âm giai điệu và ứng tác là thành phần của hòa âm bên phím; chưa tìm được nguồn bậc 1–2 nêu lợi ích cho thị tấu và học thuộc. Lượt 2 xem lại; nếu không có nguồn thì người giao quyết bỏ hay nói nhẹ đi."
  - id: i7
    cau: "Link: thị tấu (/opus/piano/thi-tau/) và học thuộc và biểu diễn (/opus/piano/hoc-thuoc-bieu-dien/)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/piano/thi-tau.md và hoc-thuoc-bieu-dien.md có.
  - id: i8
    cau: Thời Baroque, người chơi đàn phím khi đệm thường chỉ có trước mặt một bè bass, đôi khi kèm các con số, và tự chơi hợp âm bên trên.
    loai: lich-su
    nguon:
      - cod-continuo
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "người chơi đàn phím trong dàn nhạc". COD (continuo): đàn phím chơi bè bass kèm số và tự thêm hợp âm; nguồn không giới hạn continuo vào "dàn nhạc"; đổi thành "khi đệm". Link bè trầm số (/opus/nhac-ly/25-be-tram-so/) có.'
  - id: i9
    cau: "Ở các nhạc viện Napoli thế kỷ 18, học trò luyện partimento: những bè bass được hoàn thiện thành nhạc ngay trên bàn phím."
    loai: lich-su
    nguon:
      - gjerd-ch2
      - cod-partimento
    ket_qua: dung
    ghi_chu: "Gjerdingen ch. 2 (bản UCI): partimento ở nhạc viện Napoli, thực hiện tại đàn phím. COD (partimento): bè bass dạy hòa âm và ứng tác ở Ý thế kỷ 18."
  - id: i10
    cau: "Carl Philipp Emanuel Bach, Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về cách chơi đàn phím đúng đắn): phần một 1753, phần hai 1762."
    loai: nam
    nguon:
      - imslp-versuch
      - brit-cpe
    ket_qua: dung
    ghi_chu: 'IMSLP: phần 1 năm 1753, phần 2 năm 1762. "Tiểu luận về cách chơi đàn phím đúng đắn" là bản dịch nghĩa của trang.'
  - id: i11
    cau: C.P.E. Bach dành phần hai của Versuch cho việc đệm, và kết thúc bằng fantasia tự do, tức ứng tác.
    loai: lich-su
    nguon:
      - imslp-versuch
      - brit-cpe
    ket_qua: null
    ghi_chu: 'Chưa chắc: Britannica nói Versuch bàn về bè trầm số, nốt hoa mỹ, ngón bấm; chưa mở được mục lục phần 2 để xác nhận "dành cho việc đệm" và "kết thúc bằng fantasia tự do". Lượt 2 xem lại (IMSLP có bản quét).'
  - id: i12
    cau: Mozart và Beethoven đều nổi tiếng là những người ứng tác xuất sắc trước công chúng.
    loai: lich-su
    nguon:
      - cod-improv
    ket_qua: dung
    ghi_chu: "COD (improvisation): các nghệ sĩ đàn phím như Bach, Mozart, Beethoven, Hummel, Clementi làm khán giả say mê bằng ứng tác điêu luyện."
  - id: i13
    cau: "Điều kiện trước khi bắt đầu: đã xong chặng 2 của lộ trình (gam, hợp âm ba ở các thể đảo, vòng I–IV–I–V7–I ở Đô, Sol, Fa), đã đọc ba bài nhạc lý (hợp âm ba, hòa âm chức năng, kết và câu nhạc)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: piano/lo-trinh.md hàng "Gam, hợp âm" của chặng 2 liệt kê đúng các gam và vòng kết ấy. Link /opus/piano/lo-trinh/, /opus/piano/hop-am-rai/, /opus/nhac-ly/10-hop-am-ba/, 12-hoa-am-chuc-nang/, 13-ket/ đều có trên site mới.
  - id: i14
    cau: "Giọng thứ cùng hóa biểu với một giọng trưởng: La thứ với Đô trưởng, Mi thứ với Sol trưởng."
    loai: quy-tac
    nguon:
      - omt-minor
      - mt21c-minsig
    ket_qua: dung
    ghi_chu: "OMT và MT21C: giọng thứ tương ứng cùng hóa biểu với giọng trưởng cách ba nửa cung phía trên; La thứ–Đô, Mi thứ–Sol đúng."
  - id: i15
    cau: Hát được một giai điệu quen và cảm nhận được chỗ nó "dừng lơ lửng", chỗ nó "về nhà"; nếu còn thiếu phần nhạc lý vẫn bắt đầu được trang đầu tiên và đọc song song.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên và điều kiện sư phạm.
  - id: i16
    cau: 'Bảng "Phần này gồm những gì": bốn trang với điều bạn làm được ở mỗi trang (kết; đệm; mẫu galant: Romanesca, Prinner, Monte, Fonte; ứng tác).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trên trang: ket.md (bốn loại kết, ba vị trí, ba tiến trình, giọng thứ, vòng 12 giọng); dem-giai-dieu.md (chọn hợp âm, nhịp hòa âm, bè bass, hình đệm); mau-galant.md (bảng có Romanesca, Prinner, Fonte, Monte); ung-tac.md có. Lô trước yêu cầu giữ: 29-chuoi-hoa-am (mau-galant có mục Romanesca và liên kết ngược bài 29: dòng 12 nói Fonte, Monte là chuỗi hòa âm) và nghe-tien-trinh (Romanesca 1–7–6–3, Prinner 4–3–2–1 trong bảng): KHỚP trên mau-galant.md hiện tại (agent B đang sửa trang này; cần kiểm lại sau khi sửa xong)."
  - id: i17
    cau: "Mẫu galant là những công thức hai bè quen thuộc của âm nhạc thế kỷ 18 mà nhà nghiên cứu Robert Gjerdingen hệ thống hóa: Romanesca, Prinner, Monte, Fonte…"
    loai: lich-su
    nguon:
      - gjerd-ch2
      - omt-galant
    ket_qua: dung
    ghi_chu: "OMT Galant Schemas: Gjerdingen (Music in the Galant Style, 2007) hệ thống hóa các schema; Romanesca, Prinner, Fonte, Monte nằm trong danh sách. Gjerdingen ch. 2: Romanesca."
  - id: i18
    cau: Vài tên mẫu có từ thế kỷ 18, như Monte và Fonte của Joseph Riepel; vài tên đặt theo nhà lý thuyết, như Meyer.
    loai: lich-su
    nguon:
      - omt-galant
      - gjerd-ch2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vài tên do Gjerdingen đặt, như Prinner". OMT: Monte, Fonte, Ponte là tên Riepel dùng (thế kỷ 18); Meyer đặt theo nhà âm nhạc học Leonard Meyer. Tên Prinner lấy từ nhà lý thuyết Johann Prinner (chưa xác nhận ở nguồn mở của lượt này), nên bỏ "do Gjerdingen đặt".'
  - id: i19
    cau: "Thứ tự này có chủ ý: kết là dấu chấm câu; đệm giai điệu là đặt câu; mẫu galant là thành ngữ; ứng tác là tự nói."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Ví von sư phạm.
  - id: i20
    cau: 'Lộ trình 12 tuần: tuần 1–4 Kết, 5–8 Đệm, 9–12 Mẫu galant và ứng tác; cột "Giọng khởi động" theo vòng 12 giọng ở trang Kết ở mọi giọng.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: cột giọng khởi động khớp bảng 12 cặp ở ket.md hàng 1–12 (Đô/La thứ … Fa♯/Rê♯ thứ); tuần 1–4 khớp kế hoạch 4 tuần của ket.md; tuần 5–8 khớp bảng khởi động của dem-giai-dieu.md. Lưu ý nhẹ: tuần 7 ghi "ii, vi, I6/4; lắp hình đệm" mà dem-giai-dieu.md dạy ii, vi, I6/4 ở tuần 2 và lắp hình đệm ở tuần 3. Tuần 9–12 theo mau-galant.md và ung-tac.md (agent B).'
  - id: i21
    cau: "Lịch chỉ là gợi ý: điều kiện để sang tuần sau là đạt mục tiêu của tuần trước; nếu một giọng còn vấp, giữ nó thêm một tuần."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên.
  - id: i22
    cau: Mười phút mỗi ngày là một khối nhỏ, dễ giữ đều.
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mười phút đều đặn mỗi ngày hiệu quả hơn một giờ dồn vào cuối tuần." Là so sánh hiệu quả học tập cần nguồn, không có nguồn đã mở; đổi thành câu không khẳng định hiệu quả.'
  - id: i23
    cau: "Bảng 10 phút: 0–3 kết trong giọng của tuần (♩ = 60); 3–7 việc chính; 7–9 hát và nghe; 9–10 chơi tự do; kèm ba lời nhắc (nói to bằng bậc, chậm mà liền, bỏ bản nhạc sớm)."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập. Phút cộng đủ 10.
  - id: i24
    cau: "Link trong bảng 10 phút: máy đếm nhịp (/opus/luyen-tap/metronome/), nhật ký tập (/opus/luyen-tap/nhat-ky/)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Trang đích chưa chuyển, kiểm trên bản cũ: ../opus-zero/docs/luyen-tap/metronome.md và nhat-ky.md có. Lô chuyển giữ hai đường dẫn."
  - id: i25
    cau: 'Hộp "Luyện tai song song": mỗi ngày làm vài câu với công cụ nhận biết kết (/opus/luyen-tai/nghe-tien-trinh/#luyen-voi-cong-cu).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'luyen-tai/nghe-tien-trinh.md có "## Luyện với công cụ { #luyen-voi-cong-cu }". Câu "nghe ra kết nửa hay kết trọn là nửa đầu của việc tự đệm" là lời khuyên.'
  - id: i26
    cau: "Nguồn: Gjerdingen, Music in the Galant Style (Oxford University Press, 2007)."
    loai: ten
    nguon:
      - omt-galant
      - gjerd-ch2
    ket_qua: dung
    ghi_chu: OMT Galant Schemas trích Gjerdingen 2007; bản trích ch. 2 ở UCI.
  - id: i27
    cau: "Nguồn: Sanguinetti, The Art of Partimento (Oxford University Press, 2012); Mortensen, The Pianist's Guide to Historic Improvisation (Oxford University Press, 2020); Kostka, Payne, Tonal Harmony (McGraw-Hill)."
    loai: ten
    nguon:
      - cod-partimento
      - cod-improv
    ket_qua: null
    ghi_chu: "Chưa chắc: ba sách in không mở được ở lượt 1 nên chưa xác nhận tên, năm và nhà xuất bản (đặc biệt năm 2012 và 2020). Lượt 2 xem lại hay người giao bỏ năm."
