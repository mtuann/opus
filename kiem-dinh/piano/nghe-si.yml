tang: tham-chieu
lan:
  - so: 1
    ngay: '2026-11-05'
    nhanh: moi/d8-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet (D8-L1 lượt 1, phần 2/2)
      luot_2: null
      review: Claude Opus 5.5 (D8-gom, không làm lượt 1, lượt 2 của trang này)
      kiem_mau: null
ghi_chu: 'Trang tham chiếu có hạn (ra_lai 2027-10). Kiểm định lượt 1 ngày 05/11/2026, mọi nguồn truy cập ngày ấy. Trang có hơn 70 mục (bảng ~45 nghệ sĩ, năm cuộc thi, 30 tác phẩm). Cách làm: mỗi hàng bảng nghệ sĩ là một nhận định; cột "Nghe trước" là gợi ý (khuyen-tap); năm sinh–mất của mọi nghệ sĩ khớp src/data/nha-soan-nhac.yml (đã khóa; đối chiếu bằng tay từng tên). Nguồn chủ yếu là Wikipedia (bậc 3) cho tiểu sử vì trang Grove/Britannica/nhà xuất bản không mở được; kết quả các cuộc thi mới (Chopin 2025, Cliburn 2025) có nguồn chính thức. Điều chưa kiểm được thành ket_qua null (chưa chắc): vế "Liszt chơi một mình, không cần bản nhạc", Schiff (không nguồn nào đã mở), giải Tư Chopin 2015 của Eric Lu (chỉ có kết quả tìm kiếm). Phần lớn tính từ nhận xét phong cách ("tiếng vàng", "tinh tế") là nhận xét của giới phê bình, không kiểm được từng chữ, giữ như trang cũ: nếu review coi đó là sự kiện thì phải bỏ hoặc có nguồn Schonberg, Dubal (sách in, agent không đọc được). Sửa trang: Hofmann (1887 thành cuối thập niên 1880), Ashkenazy (chung giải Tchaikovsky với Ogdon), Pires (ngừng biểu diễn từ 2025: ghi chú của bản ghi dữ liệu pires), Lang Lang, Yuja Wang, Lisiecki (bỏ nhận xét, thay bằng điều kiểm được), Levit (52 thành hơn 50), Queen Elisabeth (piano từ 1938, không phải 1952), Nghiêm Phú Phi (bỏ Dàn nhạc Giao hưởng Sài Gòn), câu "thường phát trực tiếp miễn phí". Giữ link đã có: /opus/lich-su/duong-dai/, /opus/lich-su/viet-nam/, /opus/nghe-nhac/* (chưa chuyển; có ở site cũ). Mục 30 tác phẩm: tên tác phẩm và số danh mục chuẩn, chưa đối chiếu IMSLP từng bài (lượt 2). Quiz: 4 câu, lời giải thích không dựa vào vị trí lựa chọn. NGƯỜI GIAO: (1) bản ghi dữ liệu pires đã khóa từng phần (ten, sinh, mat, khoang): trang giờ nhắc ngừng biểu diễn, không đụng trường nào chưa khóa; (2) Brendel mất 17/6/2025 (dữ liệu 1931–2025 khớp); (3) các bản ghi Eric Lu "giải Tư 2015" chỉ có nguồn qua tìm kiếm.'
