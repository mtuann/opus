nhan_dinh:
- id: n1
  cau: 'Cùng một bản nhạc, mỗi nghệ sĩ kể một câu chuyện khác: nhanh hay chậm, sáng hay tối, hát hay nói. Trang này giới thiệu các nghệ sĩ piano quan trọng từ thời Liszt đến hôm nay, các cuộc thi lớn, cách so sánh hai bản thu, và 30 tác phẩm piano nên nghe.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: trang có các mục Liszt và buổi độc tấu, Thời đầu của ghi âm, bốn bảng nghệ sĩ, Các cuộc thi lớn, Cách so sánh hai bản thu và đúng 30 tác phẩm đánh số 1–30. "Quan trọng" là nhận xét chung của trang.'
- id: n2
  cau: 'Không có bản thu "đúng": nghe nhiều cách chơi là đường ngắn nhất để tìm ra cách chơi của bạn; khi tìm bản thu, đọc kỹ thông tin theo hướng dẫn ở Đọc tên tác phẩm và bản thu (link /opus/nghe-nhac/doc-ten-tac-pham/).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: Trang đích chưa chuyển; có ở ../opus-zero/docs/nghe-nhac/doc-ten-tac-pham.md (tiêu đề "Đọc tên tác phẩm và bản thu"). Lô chuyển trang ấy phải giữ đường dẫn và tiêu đề. Phần "không có bản thu đúng" là lời khuyên.
- id: n3
  cau: 'Ngày 9/6/1840, buổi diễn của Liszt ở Hanover Square Rooms (London) được gọi là recital: lần đầu tiên chữ này, vốn chỉ việc đọc diễn cảm, được dùng cho âm nhạc.'
  loai: lich-su
  nguon:
  - cm-recital
  ket_qua: dung
