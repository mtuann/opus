  - { id: sfs-trifonov, bac: 2, ten: 'San Francisco Symphony, Daniil Trifonov (tiểu sử): Grammy 2018 Best Instrumental Solo Album cho Transcendental ("the Liszt collection"); mùa 2010–11: giải Ba Chopin Warsaw, giải Nhất Rubinstein Tel Aviv, giải Nhất và Grand Prix Tchaikovsky (truy cập 05/11/2026)', link: 'https://www.sfsymphony.org/Data/Event-Data/Artists/T/Daniil-Trifonov' }
  - { id: decca-uchida, bac: 2, ten: 'Decca Classics, Mitsuko Uchida (tiểu sử): 1970 giải Nhì Chopin; 1975 giải Nhì Leeds; Mozart, Schubert, Beethoven (truy cập 05/11/2026)', link: 'https://www.deccaclassics.com/en/artists/mitsuko-uchida' }
  - { id: decca-ashkenazy, bac: 2, ten: 'Decca Classics, Vladimir Ashkenazy (tiểu sử): giải Nhì Chopin Warsaw 1955; giải Nhất Queen Elisabeth 1956; chung giải Nhất với John Ogdon ở Tchaikovsky 1962 (truy cập 05/11/2026)', link: 'https://www.deccaclassics.com/en/artists/vladimir-ashkenazy' }
  - { id: chopin-official, bac: 2, ten: 'Viện Fryderyk Chopin, About Competition: thành lập 1927; chu kỳ 5 năm từ 1949; Pollini, Argerich, Ohlsson (1970, Uchida hạng nhì), Zimerman (1975), Seong-Jin Cho (2015), Bruce Liu (2021) là người thắng (truy cập 05/11/2026)', link: 'https://www.chopincompetition.pl/en/information/about-competition' }
  - id: praemium-zimerman
    bac: 2
    ten: 'Praemium Imperiale (Japan Art Association), Krystian Zimerman: "In 1998, he formed the Polish Festival Orchestra" để kỷ niệm 150 năm ngày mất của Chopin (1999), 39 buổi diễn ở các thành phố lớn (truy cập 05/11/2026)'
    link: https://www.praemiumimperiale.org/en/laureate-en/laureates-en/zimerman-en
nhan_dinh:
  - id: n1
    cau: 'Cùng một bản nhạc, mỗi nghệ sĩ kể một câu chuyện khác: nhanh hay chậm, sáng hay tối, hát hay nói. Trang này giới thiệu các nghệ sĩ piano quan trọng từ thời Liszt đến hôm nay, các cuộc thi lớn, cách so sánh hai bản thu, và 30 tác phẩm piano nên nghe.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: trang có các mục Liszt và buổi độc tấu, Thời đầu của ghi âm, bốn bảng nghệ sĩ, Các cuộc thi lớn, Cách so sánh hai bản thu và đúng 30 tác phẩm đánh số 1–30. "Quan trọng" là nhận xét chung của trang. Review D8-gom: trang có mục Liszt, Thời đầu của ghi âm, bốn bảng nghệ sĩ, Các cuộc thi lớn, Cách so sánh hai bản thu, 30 tác phẩm đánh số 1–30 (đếm lại trên src/content/docs/piano/nghe-si.md).'
    review: dung
  - id: n2
    cau: 'Mỗi nghệ sĩ có một gợi ý "nghe trước"; các chữ tả tiếng đàn và phong cách trong cột "Nổi tiếng với" là nhận xét của site; trang chỉ ghi năm thu khi chắc chắn; không có bản thu "đúng": nghe nhiều cách chơi là đường ngắn nhất để tìm ra cách chơi của bạn; khi tìm bản thu, đọc kỹ thông tin theo hướng dẫn ở Đọc tên tác phẩm và bản thu (link /opus/nghe-nhac/doc-ten-tac-pham/).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển; có ở ../opus-zero/docs/nghe-nhac/doc-ten-tac-pham.md (tiêu đề "Đọc tên tác phẩm và bản thu"). Lô chuyển trang ấy phải giữ đường dẫn và tiêu đề. Phần "không có bản thu đúng" là lời khuyên. Review D8-gom: nghe-nhac/doc-ten-tac-pham chưa chuyển, có trong src/data/trang.yml; ../opus-zero/docs/nghe-nhac/doc-ten-tac-pham.md có tiêu đề "Đọc tên tác phẩm và bản thu" và nói cách đọc tên bản thu (nghệ sĩ, hãng đĩa, năm thu). Câu thêm vế "nhận xét của site" (hộp đầu trang, thêm khi review).'
    review: dung
  - id: n3
    cau: 'Ngày 9/6/1840, buổi diễn của Liszt ở Hanover Square Rooms (London) được gọi là recital: lần đầu tiên chữ này, vốn chỉ việc đọc diễn cảm, được dùng cho âm nhạc.'
    loai: lich-su
    nguon:
      - cm-recital
    ket_qua: dung
    ghi_chu: 'BBC Music Magazine: "On 9 June 1840 … advertised as ''Liszt''s Pianoforte Recitals''… the first musical use of the word ''recital'', which had previously described dramatic readings."'
    luot_2: dung
    luot_2_nguon: [ "https://www.classical-music.com/features/composers/who-invented-the-piano-recital" ]
    luot_2_ghi_chu: "Bài viết: 9/6/1840, Hanover Square Rooms, quảng cáo là Liszts Pianoforte Recitals; lần đầu chữ này dùng theo nghĩa âm nhạc, trước đó chỉ chỉ việc đọc diễn cảm (dramatic readings)."
  - id: n4
    cau: Liszt đặt cây đàn nằm ngang sân khấu để khán giả thấy nghiêng mặt ông và nghe tiếng đàn rõ hơn.
    loai: lich-su
    nguon:
      - cm-recital
    ket_qua: dung
    ghi_chu: 'BBC Music Magazine: piano đặt "sideways" trên sân khấu, nắp mở, để khán giả thấy ông nhìn nghiêng và nghe rõ hơn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.classical-music.com/features/composers/who-invented-the-piano-recital" ]
    luot_2_ghi_chu: Liszt đặt đàn nằm ngang sân khấu, khán giả thấy nghiêng mặt, nắp mở thì tiếng đàn vang xa hơn.
  - id: n5
    cau: Liszt chơi một mình, chơi nhiều bài thuộc lòng (điều khán giả thời ấy chưa quen thấy), dù không phải bài nào ông cũng chơi thuộc.
    loai: lich-su
    nguon:
      - cm-recital
      - cm-memory
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: bài chỉ nói các tranh biếm họa thời ấy vẽ ông chơi không nhạc; không nói buổi 9/6/1840 ông chơi một mình hay thuộc lòng. Chữ trang cũ giữ nguyên; lượt 2 tìm nguồn bậc 2 (Grove, lịch sử buổi diễn). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac; Bài classical-music.com chỉ nói tranh biếm họa cho thấy ông chơi không nhạc; hai bài về chuyện chơi thuộc lòng (classical-music.com/features/science-of-music/history-of-memorising-music, interlude.hk) nói ông chỉ chơi thuộc một phần kho bài và luôn dùng bản nhạc cho tác phẩm của chính mình. Mệnh đề chơi một mình, không cần bản nhạc nói quá; nên viết lại cho chính xác hơn (hay bỏ).. Review D8-gom: lượt 2 đúng: "không cần bản nhạc" nói quá. BBC Music Magazine, History of memorising music: lối chơi thuộc lòng "began in earnest with Franz Liszt, in his solo concerts", nhưng ông "performed only a fraction of his repertoire from memory" và chơi tác phẩm của chính mình có bản nhạc; bài 1840 (cm-recital): các buổi độc tấu một mình ("musical soliloquies"), tranh biếm họa vẽ ông chơi không nhạc. Viết lại theo hai bài. Hai bài là tạp chí (bậc 3); không có nguồn bậc 2 đọc được trên mạng (Walker là sách in). Chữ cũ: "Liszt chơi một mình, không cần bản nhạc".'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.classical-music.com/features/composers/who-invented-the-piano-recital", "https://www.classical-music.com/features/science-of-music/history-of-memorising-music" ]
    luot_2_ghi_chu: "Đã đọc chữ thật hai bài của classical-music.com (BBC Music Magazine). Bài 1: các buổi diễn một mình của Liszt trước gọi là 'musical soliloquies'; tranh biếm họa vẽ ông 'playing without music – something audiences weren't used to seeing'. Bài 2: 'In truth, he performed only a fraction of his repertoire from memory and all of his own pieces from music'. Khớp cả ba vế: chơi một mình, chơi thuộc lòng là điều khán giả chưa quen, không phải bài nào cũng thuộc."
  - id: n6
    cau: Clara Schumann là một trong những nghệ sĩ đầu tiên biểu diễn thuộc lòng và góp phần biến việc đó thành chuẩn mực; hình mẫu quen thuộc hôm nay đã thành hình trong thế kỷ 19.
    loai: lich-su
    nguon:
      - w-clara
    ket_qua: dung
    ghi_chu: 'Wikipedia: "one of the first pianists to perform from memory, making it the standard for concerts" (bậc 3). "Một người, một cây đàn, cả buổi tối" là khái quát.'
    luot_2: dung
    luot_2_nguon: [ "https://interlude.hk/the-secret-history-of-memorisation-in-classical-music-from-taboo-to-tradition/" ]
    luot_2_ghi_chu: Clara Schumann được cha dạy thuộc lòng từ nhỏ, 1837 bị Bettina von Arnim chê vì chơi không nhạc; học trò của Liszt và Clara đưa tục lệ đi tiếp trong thế kỷ 19. Chữ mot trong những nghệ sĩ đầu tiên là hợp lý, không nói đầu tiên tuyệt đối.
  - id: n7
    cau: 'Thời đầu của ghi âm: cuối thập niên 1880, cậu bé Josef Hofmann, khi ấy khoảng 12 tuổi, có lẽ là nghệ sĩ piano có tiếng đầu tiên thu âm trên máy hát của Edison; các bản thu ấy đã thất lạc.'
    loai: nam
    nguon:
      - w-hofmann
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "1887: cậu bé Josef Hofmann, 11 tuổi, thu một trụ sáp cho Edison; bản này đã thất lạc". Wikipedia: ghi âm cho Edison khoảng 1888–1890 (c. 1890), "probably the first notable pianist to record on Edison''s phonograph" khi 12 tuổi (1888); các xy lanh thất lạc trong Thế chiến I. Không có năm 1887 hay "trụ sáp"; bỏ. Bậc 3 duy nhất; bản dẫn Gramophone (International Piano) chặn công cụ: chưa chắc, lượt 2 cần nguồn bậc 2. Review D8-gom: hai lượt khớp; lượt 2 thêm bài classical-music.com (First piano recording) độc lập với Wikipedia. Không có nguồn bậc 2 mở được (Gramophone chặn); giữ, ghi ở báo cáo.'
    luot_2: dung
    luot_2_nguon: [ "https://www.classical-music.com/features/instruments/first-piano-recording", "https://en.wikipedia.org/wiki/Josef_Hofmann" ]
    luot_2_ghi_chu: "Hofmann 12 tuổi, 1888, ghi trụ sáp cho Edison, nay thất lạc; Wikipedia: có lẽ là nghệ sĩ piano có tiếng đầu tiên thu trên máy Edison. Nguồn chính là bài classical-music.com, Wikipedia chỉ phụ."
    review: dung
  - id: n8
    cau: '1889: một nhân viên của Edison thu Brahms chơi một đoạn Hungarian Dance số 1 ở Vienna; bản ghi hư hỏng nặng, gần như không nghe rõ.'
    loai: nam
    nguon:
      - stanford-brahms
    ket_qua: dung
    ghi_chu: 'Kết quả tìm kiếm (Stanford CCRMA, trang chưa mở riêng): cylinder do Theo Wangemann (nhân viên Edison) thu 2/12/1889, các ô 13–72 của Hungarian Dance số 1; rất mòn. Lời giới thiệu đầu cylinder lâu nay gán cho Brahms nhưng nhiều khả năng là của Wangemann: trang không nói điều này.'
    luot_2: dung
    luot_2_nguon: [ "https://ccrma.stanford.edu/groups/edison/brahms/brahms.html" ]
    luot_2_ghi_chu: 2/12/1889, nhà Fellinger, Theo Wangemann (Edison) thu Brahms chơi ô nhịp 13-72 Hungarian Dance số 1 (bản soạn 1872) và một đoạn Libelle của Strauss; tiếng ồn gần như át cả nhạc. Trang không nêu tên thành phố; bài classical-music.com và tài liệu về Wangemann cho biết chuyến thu ở Vienna cuối 1889.
  - id: n9
    cau: 'Thời đĩa 78 vòng: mỗi mặt đĩa chỉ chứa khoảng bốn phút nhạc, nên tác phẩm dài bị cắt thành nhiều mặt và nghệ sĩ phải tính trước chỗ ngắt.'
    loai: so-lieu
    nguon:
      - time78
    ket_qua: dung
    ghi_chu: 'TIME (qua kết quả tìm kiếm): khoảng bốn phút mỗi mặt; tác phẩm dài bán thành bộ nhiều đĩa. "Nghệ sĩ phải tính trước chỗ ngắt" là hệ quả hợp lý; chưa mở trang gốc.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ajournalofmusicalthings.com/ongoing-history-daily-the-first-lp-part-1/", "https://en.wikipedia.org/wiki/LP_record" ]
    luot_2_ghi_chu: Mặt đĩa 78 vòng 12 inch chứa khoảng 4-5 phút; tác phẩm lớn trải ra nhiều đĩa. Câu nói về nghệ sĩ phải tính trước chỗ ngắt là suy luận hợp lý, nguồn không nói riêng.
  - id: n10
    cau: '1932–1935: Artur Schnabel thu trọn 32 sonata Beethoven ở London, lần đầu tiên trong lịch sử; hãng HMV bán theo hình thức đặt mua trước qua "Hội Sonata Beethoven".'
    loai: lich-su
    nguon:
      - w-schnabel
    ket_qua: dung
    ghi_chu: 'Wikipedia: "Between 1932 and 1935 he made the first recordings of the complete Beethoven piano sonatas"; kết quả tìm kiếm (Pristine, Wikipedia riêng về bản thu): HMV lập Beethoven Society 1932 để người mua đặt trước. "Ở London" chưa kiểm riêng (địa điểm phòng thu: Abbey Road); chưa chắc chi tiết này.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.com/wiki/Artur_Schnabel%27s_recordings_of_Beethoven%27s_piano_sonatas", "https://ionarts.blogspot.com/2009/05/beethoven-sonatas-survey-of-complete.html" ]
    luot_2_ghi_chu: Thu ở Abbey Road, London, 1932-1935 (một số bản sửa 1937), hãng HMV phát hành qua Beethoven (Sonata) Society đặt mua trước; được coi là bản thu trọn bộ đầu tiên. Nguồn chủ yếu là tổng hợp qua tìm kiếm và Wikipedia; trang Gramophone trả 403.
  - id: n11
    cau: '1933–1936: Edwin Fischer thu trọn Bình quân luật, cũng là lần đầu tiên.'
    loai: lich-su
    nguon:
      - w-fischer
    ket_qua: dung
    ghi_chu: 'Wikipedia: "first complete recording of Bach''s Well-Tempered Clavier for EMI, played on piano from 1933 to 1936".'
    luot_2: dung
    luot_2_nguon: [ "https://ijm.education/piano/edwin-fischer-the-first-complete-recording-of-bach-well-tempered-clavier/", "https://pristineclassical.com/products/pakm001" ]
    luot_2_ghi_chu: Fischer thu Bình quân luật (WTC) 1933-1936 cho HMV ở Abbey Road, thường được coi là bản thu trọn bộ đầu tiên.
  - id: n12
    cau: Sau Thế chiến II, đĩa LP và băng từ cho phép thu những đoạn dài và biên tập; Glenn Gould thôi biểu diễn trước công chúng năm 1964 để chỉ làm việc trong phòng thu.
    loai: lich-su
    nguon:
      - w-gould
    ket_qua: dung
    ghi_chu: 'Wikipedia: buổi diễn cuối 1964 ở tuổi 31, sau đó tập trung phòng thu. LP (1948) ra sau chiến tranh (kết quả tìm kiếm); "băng từ cho phép biên tập" là khái quát đúng (chưa có nguồn đã mở riêng cho băng từ).'
    luot_2: dung
    luot_2_nguon: [ "https://www.ajournalofmusicalthings.com/today-is-the-70th-anniversary-of-the-introduction-12-inch-33-1-3-lp/", "https://en.wikipedia.org/wiki/Glenn_Gould" ]
    luot_2_ghi_chu: LP ra 1948 (khoảng 22-25 phút mỗi mặt); Gould biểu diễn lần cuối 10/4/1964 rồi chỉ thu âm. Phần băng từ cho phép biên tập là kiến thức chung, nguồn mở không nêu riêng.
  - id: n13
    cau: 'Ignacy Jan Paderewski (1860–1941): thần tượng của các phòng hòa nhạc; năm 1919 làm Thủ tướng Ba Lan; Chopin; Minuet Sol trưởng Op. 14 số 1 của chính ông.'
    loai: lich-su
    nguon: [ w-paderewski, usc-paderewski, imslp-paderewski14 ]
    ket_qua: dung
    ghi_chu: 'Wikipedia: Thủ tướng và Ngoại trưởng từ 1/1919 đến cuối 1919; Minuet Op. 14 số 1 (1887). "Thần tượng của các phòng hòa nhạc" là nhận xét. Năm sinh–mất khớp dữ liệu (nha-soan-nhac). Review D8-gom (nguồn thay Wikipedia): USC Polish Music Center: virtuoso pianist, Thủ tướng Ba Lan năm 1919 (ký Hòa ước Versailles); IMSLP: Op. 14 số 1 "Menuet célèbre" giọng Sol trưởng, xuất bản 1887–88. "Thần tượng của các phòng hòa nhạc" là nhận xét của site.'
    luot_2: dung
    luot_2_nguon: [ 'https://en.wikipedia.org/wiki/Ignacy_Jan_Paderewski' ]
    luot_2_ghi_chu: 1860-1941 (một số nguồn ghi 1859); Thủ tướng Ba Lan 1919; Minuet Sol trưởng Op. 14 số 1 (1887); chủ biên ấn bản Chopin của Viện Chopin. Nguồn là Wikipedia.
  - id: n14
    cau: 'Sergei Rachmaninoff (1873–1943): một trong những nghệ sĩ piano lớn nhất thời mình; bốn concerto và Rhapsody on a Theme of Paganini do chính ông thu với Dàn nhạc Philadelphia.'
    loai: lich-su
    nguon:
      - w-rachmaninoff
    ket_qua: dung
    ghi_chu: 'Wikipedia (trang dài, chỉ đọc được phần đầu): nhắc bản thu các concerto và Rhapsody Paganini với Dàn nhạc Philadelphia. "Tiếng rõ, nhịp chắc, không ủy mị" và "lớn nhất thời mình" là nhận xét phong cách, không kiểm được (chưa chắc).'
    luot_2: dung
    luot_2_nguon: [ "https://pristineclassical.com/products/pasc544", "https://en.wikipedia.org/wiki/Sergei_Rachmaninoff" ]
    luot_2_ghi_chu: 1873-1943; bốn concerto và Rhapsody on a Theme of Paganini thu 1929-41 với Dàn nhạc Philadelphia (Stokowski, Ormandy; nguồn mâu thuẫn về nhạc trưởng từng bản, câu không nêu).
  - id: n15
    cau: 'Josef Hofmann (1876–1957): bậc thầy kỹ thuật và sự tiết chế; Rachmaninoff đề tặng ông Concerto số 3, nhưng ông không bao giờ chơi bản này; bản thu buổi hòa nhạc mừng 50 năm biểu diễn ở Metropolitan Opera, New York (28/11/1937).'
