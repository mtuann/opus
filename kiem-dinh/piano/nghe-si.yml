    ket_qua: dung
    ghi_chu: 'Sách in không đọc được (chuẩn kiểm định mục 2: nguồn phụ). Bài classical-music.com đã mở và khớp. Bài Gramophone (International Piano, Josef Hofmann) chặn công cụ (403). Các trang chính thức Leeds, Van Cliburn (đã mở), Queen Elisabeth (đã mở): còn tồn tại. Schonberg 1963 ấn bản đầu, sửa đổi 1987; Dubal 2004 tái bản lần 3: chưa kiểm (chưa chắc).'
