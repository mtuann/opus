  - id: n77
    cau: 'Câu hỏi kiểm tra nhanh (4 câu): chữ recital lần đầu dùng ở buổi diễn của Liszt ở London năm 1840 (không phải Mozart ở Vienna 1781 hay Chopin ở Paris 1832); Schnabel thu trọn 32 sonata Beethoven (1932–1935, London); so sánh hai bản thu nên chỉnh to ngang nhau để hai bản chỉ khác nhau ở cách chơi; Bruce Liu (2021) và Eric Lu (2025) là hai học trò của Đặng Thái Sơn thắng Chopin.'
    loai: lich-su
    nguon:
      - cm-recital
      - w-schnabel
      - w-liu
      - w-dts
    ket_qua: da-sua
    ghi_chu: 'Khớp các nhận định trên. Lời giải thích của câu hỏi không dựa vào vị trí lựa chọn (đã kiểm). Chỗ "London" trong lời giải thích câu Schnabel: chưa kiểm riêng (xem n về Schnabel). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://www.classical-music.com/features/composers/who-invented-the-piano-recital, https://en.wikipedia.org/wiki/Bruce_Liu, https://en.wikipedia.org/wiki/Eric_Lu; Recital (Liszt 1840), Schnabel thu trọn 32 sonata Beethoven 1932-35 London, Liu 2021 và Lu 2025 đều học với Đặng Thái Sơn: đều đúng. Mệnh đề chỉnh to ngang nhau khi so sánh bản thu là lời khuyên thực hành hợp lý. Chopin Paris 1832 và Mozart Vienna 1781 là phương án nhiễu, không kiểm.. Review D8-gom: đáp án câu 3 viết lại cho khớp bước 2 đã sửa. Chữ cũ: "✓ Vì bản to hơn thường có vẻ hay hơn, làm sai lệch nhận xét". Review cuối D8-gom: giữ chữ. Vế lượt 2 chưa xác nhận (chữ recital lần đầu dùng ở buổi diễn của Liszt ở London năm 1840) là nhận định n3 của trang này, lượt 2 dung theo cm-recital (BBC Music Magazine: 9/6/1840, Hanover Square Rooms, "the first musical use of the word ''recital''"). Các vế còn lại lượt 2 đã xác nhận.'
    review: dung
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.loc.gov/static/programs/national-recording-preservation-board/documents/SchnabelBeethovenPianoSonatas.pdf", "https://www.deutschegrammophon.com/en/artists/bruce-liu/biography", "https://www.bso.org/profiles/bruce-liu", "https://www.bso.org/profiles/eric-lu", "http://www.chopinatlanta.org/interviews/Eric.Lu.html", "https://www.npr.org/2011/10/22/141617637/how-franz-liszt-became-the-worlds-first-rock-star/" ]
    luot_2_ghi_chu: "Đã xác nhận: Schnabel thu trọn sonata Beethoven 1932–1935 ở Abbey Road Studio No. 3, London (bài của Thư viện Quốc hội Mỹ; có thu sửa năm 1937). Bruce Liu thắng Chopin 2021, học Đặng Thái Sơn (DG, BSO). Eric Lu giải Nhất Chopin lần 19 (2025), từng học Đặng Thái Sơn (BSO; phỏng vấn Chopin Atlanta: 'I am also studying with Dang Thai Son'). Lời khuyên chỉnh hai bản thu to ngang nhau là lời khuyên tập, hợp lý. Chưa xác nhận: chữ 'recital' lần đầu dùng ở buổi diễn của Liszt ở London năm 1840. NPR chỉ viết 'Even the name recital was his invention', không nêu London hay 1840; Britannica (bản lưu) chỉ viết Liszt là người đầu tiên chơi trọn buổi độc tấu. Chi tiết Hanover Square Rooms 9/6/1840 chỉ thấy ở Wikipedia, dẫn Grove (cần đăng nhập, chưa mở). Hết lượt tìm kiếm nên không tìm thêm được nguồn."
