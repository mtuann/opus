  ghi_chu: 'Câu bổ sung (ghi từ hồ sơ du-lieu/nha-soan-nhac/pires: trang cũ chưa nhắc). Wikipedia: tháng 6/2025 bà ngừng biểu diễn vô thời hạn khi hồi phục sau vấn đề sức khỏe mạch máu não; 11/2025 nói đã "retired from performing". The Violin Channel (3/11/2025): bà thông báo nghỉ khi nhận giải Helena Vaz da Silva. Không viết nguyên nhân sức khỏe trên trang (nguồn khác nhau: "đột quỵ nhẹ" hay "vấn đề mạch máu não"); bà từng thông báo nghỉ hưu từ 2017–2018 rồi quay lại: nên "đã kết thúc sự nghiệp" theo lời bà tháng 11/2025. Chữ cũ: không có phần này. Thông tin mau cũ: rà lại 10/2027. Brussels 1970: Wikipedia.'
