  ghi_chu: 'BWV 826 (Partita số 2 Đô thứ), BWV 988 (Goldberg), BWV 846–869 (Bình quân luật quyển 1: 24 cặp): kiến thức chuẩn, khớp src/data/tac-pham.yml (bach-prelude-do BWV 846) và hồ sơ lich-su-dan (IMSLP Goldberg BWV 988). Scarlatti K. 141, K. 380: chưa mở danh mục Kirkpatrick; K. 380 (Mi trưởng) và K. 141 (Rê thứ) là hai sonata nổi tiếng: chưa chắc, kiểm ở hướng dẫn nghe nghe-nhac/scarlatti-sonata khi chuyển (site cũ có). Các link nghe-nhac/* chưa chuyển, có ở site cũ; piano/tac-pham/bach-prelude-do có ở src/data/tac-pham.yml.'
- id: n71
  cau: 'Cổ điển (6–11): Haydn Sonata Mi♭ trưởng Hob. XVI:52 (một trong những sonata cuối, viết ở London); Mozart Sonata La trưởng K. 331; Concerto số 21 Đô trưởng K. 467; Beethoven Sonata Pathétique Op. 13; Ánh trăng Op. 27 số 2; Sonata số 32 Đô thứ Op. 111 (hai chương, arietta với chuỗi biến tấu).'
  loai: danh-muc
  ket_qua: dung
  ghi_chu: 'Hob. XVI:52 (Mi♭ trưởng, viết ở London 1794–95), K. 331 (La trưởng), K. 467 (Đô trưởng), Op. 13, Op. 27 số 2, Op. 111 (Đô thứ, hai chương): danh mục chuẩn; Op. 111 hai chương (Maestoso–Allegro con brio, Arietta): hiểu biết chung. Chưa đối chiếu nguồn bậc 1–2 riêng cho Hob. XVI:52 "viết ở London" (chưa chắc phần này). Các link bài học và hướng dẫn nghe: pathetique-adagio, beethoven-anh-trang, ... có ở src/data/tac-pham.yml hay site cũ.'
- id: n72
  cau: 'Lãng mạn (12–22): Schubert Impromptu D. 899; Sonata Si♭ trưởng D. 960; Schumann Kinderszenen Op. 15; Chopin Nocturne Op. 9 số 2; Étude Op. 10 và Op. 25; Ballade số 1 Sol thứ Op. 23; Liszt Liebestraum số 3; Sonata Si thứ (một chương dài khoảng nửa giờ); Brahms Intermezzo Op. 117 và Op. 118; Grieg Concerto La thứ Op. 16; Mussorgsky Tranh triển lãm.'
  loai: danh-muc
  ket_qua: dung
  ghi_chu: 'D. 899 (Schubert, bốn Impromptu), D. 960 (Sonata Si♭ trưởng), Op. 15 (Kinderszenen), Op. 9 số 2, Op. 10 và 25, Op. 23, Liebestraum số 3, Sonata Si thứ S. 178, Op. 117–118, Op. 16: danh mục chuẩn (khớp src/data/tac-pham.yml cho các bài có bản ghi). "Khoảng nửa giờ" của Sonata Liszt: hiểu biết chung (chưa chắc).'
- id: n73
  cau: 'Thế kỷ 20 và hôm nay (23–30): Satie Gymnopédies; Debussy Clair de lune rồi Préludes quyển 1; Ravel Gaspard de la nuit (Ondine, Le Gibet, Scarbo, theo thơ Aloysius Bertrand); Rachmaninoff Concerto số 2; Gershwin Rhapsody in Blue; Bartók Allegro barbaro; Prokofiev Sonata số 7 ("sonata chiến tranh", chương cuối nhịp 7/8); Ligeti Études quyển 1.'
  loai: danh-muc
  ket_qua: dung
  ghi_chu: 'Kiến thức chuẩn: Gaspard de la nuit (1908) theo ba bài thơ của Aloysius Bertrand: Ondine, Le Gibet, Scarbo; Prokofiev Sonata số 7 (Op. 83, "sonata chiến tranh", chương cuối nhịp 7/8); Bartók Allegro barbaro (1911). Chưa đối chiếu nguồn bậc 1–2 mở (IMSLP), lượt 2 nên kiểm. Concerto số 2 Rachmaninoff: trang hướng dẫn nghe ở site cũ.'
- id: n74
  cau: 'Phần "Nghe" của 30 tác phẩm: các tên nghệ sĩ gợi ý (Hewitt, Fischer, Richter, Schiff, Argerich, Gould, Schiff, Levit, Horowitz, Brendel, Hamelin, Uchida, Pires, Perahia, Serkin, Kempff, Schnabel, Pollini, Lupu, Zimerman, Rubinstein, Lim, Lipatti, Gieseking, Michelangeli, Pogorelich, Kocsis, Aimard, Ciccolini, Rogé).'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Gợi ý nghe, không phải khẳng định; các nghệ sĩ có bản ghi trong dữ liệu (nha-soan-nhac) đã khớp tên và năm. Gieseking, Pogorelich, Kocsis, Aimard, Ciccolini, Rogé không có bản ghi dữ liệu; chữ giữ nguyên.
- id: n75
  cau: 'Mỗi mô tả ngắn của tác phẩm (ví dụ: dòng nốt rải so le không dứt như tấm vải đang dệt; hợp âm đầy, tương phản mạnh, nhiều bất ngờ; giai điệu dài như bài hát và tiếng láy rền trầm ngay trang đầu; piano như trống, hợp âm dồn dập, nhịp trần trụi; những lớp nhịp chồng lên nhau đến chóng mặt).'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Mô tả nghe (chủ quan), không phải sự kiện kiểm được; giữ như trang cũ. Có thể bỏ ở lượt 2 nếu review thấy mơ hồ.
- id: n76
  cau: Muốn biết nên chơi gì của từng nhà soạn nhạc, xem Nhà soạn nhạc cho piano; nghe tiếp theo tâm trạng ở Nghe gì tiếp theo?.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'piano/nha-soan-nhac có ở src/content/docs/piano/; nghe-nhac/nghe-gi-tiep chưa chuyển: có ở ../opus-zero/docs/nghe-nhac/nghe-gi-tiep.md (tiêu đề "Nghe gì tiếp theo?"); lô chuyển giữ đường dẫn.'
- id: n77
  cau: 'Câu hỏi kiểm tra nhanh (4 câu): chữ recital lần đầu dùng ở buổi diễn của Liszt ở London năm 1840 (không phải Mozart ở Vienna 1781 hay Chopin ở Paris 1832); Schnabel thu trọn 32 sonata Beethoven (1932–1935, London); so sánh hai bản thu nên chỉnh to ngang nhau; Bruce Liu (2021) và Eric Lu (2025) là hai học trò của Đặng Thái Sơn thắng Chopin.'
  loai: lich-su
  nguon:
  - cm-recital
  - w-schnabel
  - w-liu
  - w-dts
  ket_qua: dung
  ghi_chu: 'Khớp các nhận định trên. Lời giải thích của câu hỏi không dựa vào vị trí lựa chọn (đã kiểm). Chỗ "London" trong lời giải thích câu Schnabel: chưa kiểm riêng (xem n về Schnabel).'
- id: n78
  cau: 'Mục Nguồn cuối trang: Schonberg The Great Pianists (Simon & Schuster, 1963; bản sửa đổi 1987); Dubal The Art of the Piano (tái bản lần 3, Amadeus Press, 2004); Grove Music Online; hai bài báo (classical-music.com, Gramophone International Piano); WFIMC và trang chính thức của các cuộc thi (Leeds, Van Cliburn, Queen Elisabeth).'
  loai: ten
  nguon:
  - cm-recital
  ket_qua: dung
  ghi_chu: 'Sách in không đọc được (chuẩn kiểm định mục 2: nguồn phụ). Bài classical-music.com đã mở và khớp. Bài Gramophone (International Piano, Josef Hofmann) chặn công cụ (403). Các trang chính thức Leeds, Van Cliburn (đã mở), Queen Elisabeth (đã mở): còn tồn tại. Schonberg 1963 ấn bản đầu, sửa đổi 1987; Dubal 2004 tái bản lần 3: chưa kiểm (chưa chắc).'
