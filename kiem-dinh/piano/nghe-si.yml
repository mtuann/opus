    ghi_chu: 'Khớp các nhận định trên. Lời giải thích của câu hỏi không dựa vào vị trí lựa chọn (đã kiểm). Chỗ "London" trong lời giải thích câu Schnabel: chưa kiểm riêng (xem n về Schnabel). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://www.classical-music.com/features/composers/who-invented-the-piano-recital, https://en.wikipedia.org/wiki/Bruce_Liu, https://en.wikipedia.org/wiki/Eric_Lu; Recital (Liszt 1840), Schnabel thu trọn 32 sonata Beethoven 1932-35 London, Liu 2021 và Lu 2025 đều học với Đặng Thái Sơn: đều đúng. Mệnh đề chỉnh to ngang nhau khi so sánh bản thu là lời khuyên thực hành hợp lý. Chopin Paris 1832 và Mozart Vienna 1781 là phương án nhiễu, không kiểm.. Review D8-gom: đáp án câu 3 viết lại cho khớp bước 2 đã sửa. Chữ cũ: "✓ Vì bản to hơn thường có vẻ hay hơn, làm sai lệch nhận xét".'
    review: dung
  - id: n78
    cau: 'Mục Nguồn cuối trang: Schonberg The Great Pianists (Simon & Schuster, 1963; bản sửa đổi 1987); Dubal The Art of the Piano (tái bản lần 3, Amadeus Press, 2004); Grove Music Online; hai bài báo (classical-music.com, Gramophone International Piano); WFIMC và trang chính thức của các cuộc thi (Leeds, Van Cliburn, Queen Elisabeth).'
    loai: ten
    nguon:
