  - cu: 'Các cuộc thi khác đáng theo dõi: Geneva (Michelangeli thắng năm 1939, Argerich năm 1957), Busoni ở Bolzano (Argerich 1957), Clara Haskil ở Vevey (từ 1963, hai năm một lần), Arthur Rubinstein ở Tel Aviv (Trifonov 2011). Các vòng thi lớn thường được phát trực tiếp miễn phí (xem Âm nhạc hôm nay): một dịp hiếm để nghe cùng một tác phẩm qua hàng chục cách chơi.'
    moi: 'Các cuộc thi khác đáng theo dõi: Geneva (Michelangeli thắng năm 1939, Argerich năm 1957), Busoni ở Bolzano (Argerich 1957), Clara Haskil ở Thụy Sĩ (từ 1963, hai năm một lần; nay ở Vevey), Arthur Rubinstein ở Tel Aviv (Trifonov 2011). Nhiều cuộc thi phát trực tiếp các vòng thi trên mạng (xem Âm nhạc hôm nay): một dịp hiếm để nghe cùng một tác phẩm qua hàng chục cách chơi.'
    ly_do: '"Thường… miễn phí" không kiểm được (chỉ cuộc thi Chopin có nguồn, xem lich-su/duong-dai). Review D8-gom (nguồn thay Wikipedia): Warner Classics, Geneva: Michelangeli thắng Geneva 1939; Staatsoper Berlin: Argerich thắng Bolzano và Geneva năm 1957; lưu trữ cuộc thi Haskil: các kỳ từ 1963, hai năm một lần, nay ở Vevey (các kỳ đầu ở Lucerne, theo kết quả tìm kiếm); San Francisco Symphony: Trifonov thắng Rubinstein (Tel Aviv) mùa 2010–11. Viết "Clara Haskil ở Thụy Sĩ (nay ở Vevey)".'
  - cu: 'Mỗi nghệ sĩ có một gợi ý "nghe trước". Trang chỉ ghi năm thu khi chắc chắn; khi tìm bản thu, đọc kỹ thông tin theo hướng dẫn ở Đọc tên tác phẩm và bản thu. Không có bản thu "đúng": nghe nhiều cách chơi là đường ngắn nhất để tìm ra cách chơi của bạn.'
    moi: 'Mỗi nghệ sĩ có một gợi ý "nghe trước". Các chữ tả tiếng đàn và phong cách trong cột "Nổi tiếng với" là nhận xét của site, để bạn có điều để lắng nghe; hãy tự nghe và tự nhận xét. Trang chỉ ghi năm thu khi chắc chắn; khi tìm bản thu, đọc kỹ thông tin theo hướng dẫn ở Đọc tên tác phẩm và bản thu. Không có bản thu "đúng": nghe nhiều cách chơi là đường ngắn nhất để tìm ra cách chơi của bạn.'
    ly_do: 'Review D8-gom: các tính từ tả tiếng đàn, phong cách trong bảng nghệ sĩ là nhận xét, không kiểm được bằng nguồn bậc 1–2 (sách Schonberg, Dubal là sách in); ghi rõ là nhận xét của site thay vì khẳng định.'
  - cu: 'Đầu thế kỷ 19, một buổi hòa nhạc thường là chương trình hỗn hợp: ca sĩ, dàn nhạc, nhiều nghệ sĩ thay nhau lên sân khấu. Franz Liszt đảo ngược điều đó. Ngày 9/6/1840, buổi diễn của ông ở Hanover Square Rooms (London) được gọi là recital: lần đầu tiên chữ này, vốn chỉ việc đọc diễn cảm, được dùng cho âm nhạc. Liszt chơi một mình, không cần bản nhạc, và đặt cây đàn nằm ngang sân khấu để khán giả thấy nghiêng mặt ông và nghe tiếng đàn rõ hơn.'
    moi: 'Đầu thế kỷ 19, một buổi hòa nhạc thường là chương trình hỗn hợp: ca sĩ, dàn nhạc, nhiều nghệ sĩ thay nhau lên sân khấu. Franz Liszt đảo ngược điều đó. Ngày 9/6/1840, buổi diễn của ông ở Hanover Square Rooms (London) được gọi là recital: lần đầu tiên chữ này, vốn chỉ việc đọc diễn cảm, được dùng cho âm nhạc. Liszt chơi một mình, chơi nhiều bài thuộc lòng (điều khán giả thời ấy chưa quen thấy, dù không phải bài nào ông cũng chơi thuộc), và đặt cây đàn nằm ngang sân khấu để khán giả thấy nghiêng mặt ông và nghe tiếng đàn rõ hơn.'
    ly_do: 'Review D8-gom: "không cần bản nhạc" nói quá. BBC Music Magazine (classical-music.com, History of memorising music): Liszt bắt đầu lối chơi thuộc lòng nhưng "performed only a fraction of his repertoire from memory"; tranh biếm họa thời ấy vẽ ông chơi không nhạc (bài 1840). Viết lại theo nguồn.'
  - cu: Chopin và Schumann giàu chất thơ, không hoàn hảo về nốt; soạn các ấn bản "để học" kèm bài tập chuẩn bị
    moi: Chopin và Schumann giàu chất thơ; soạn các ấn bản "để học" (Édition de travail) của Chopin
    ly_do: 'Review D8-gom: "không hoàn hảo về nốt" chỉ có nguồn Wikipedia; bỏ. "Giàu chất thơ" là nhận xét của site (xem hộp đầu trang). Review D8-gom (nguồn thay Wikipedia): IMSLP: ấn bản "Edition de travail des œuvres de Chopin" (Senart, 1929) do Cortot biên tập. Bỏ "kèm bài tập chuẩn bị" (chỉ có một bài nghiên cứu trên CiNii, chưa có nguồn bậc 1–2 đọc được); viết "để học" (Édition de travail) của Chopin.'
  - cu: Bach rõ ràng, ít bàn đạp; Beethoven, Schubert, Bartók
    moi: Bach rõ ràng, không dùng bàn đạp vang (theo bài viết của chính ông); Beethoven, Schubert, Bartók
    ly_do: 'Review D8-gom: viết theo bài của chính András Schiff (Vancouver Recital Society, "Senza pedale ma con tanti colori"): chơi Bach không dùng bàn đạp, theo lời khuyên của George Malcolm.'
  - cu: 'Nghe ở cùng âm lượng. Bản to hơn gần như luôn có vẻ "hay hơn". Nghe mỗi bản hai lần: một lần không nhìn bản nhạc, một lần có.'
    moi: 'Nghe ở cùng âm lượng, để hai bản chỉ khác nhau ở cách chơi. Nghe mỗi bản hai lần: một lần không nhìn bản nhạc, một lần có.'
    ly_do: 'Review D8-gom: "bản to hơn gần như luôn có vẻ hay hơn" là điều về cảm nhận âm thanh, cần nguồn; nguồn mở được chỉ là tạp chí và diễn đàn (trang khoa học bị chặn robot). Viết thành lý do của phương pháp: cùng âm lượng để hai bản chỉ khác ở cách chơi.'
  - cu: 'câu hỏi: Khi so sánh hai bản thu, vì sao nên chỉnh hai bản to ngang nhau? | ✓ Vì bản to hơn thường có vẻ hay hơn, làm sai lệch nhận xét | Vì bản nhỏ hơn luôn là bản thu cũ | Vì máy đếm nhịp cần âm lượng bằng nhau | So sánh công bằng bắt đầu từ cùng một đoạn nhạc và cùng một âm lượng.'
    moi: 'câu hỏi: Khi so sánh hai bản thu, vì sao nên chỉnh hai bản to ngang nhau? | ✓ Để hai bản chỉ khác nhau ở cách chơi, không khác ở độ to | Vì bản nhỏ hơn luôn là bản thu cũ | Vì máy đếm nhịp cần âm lượng bằng nhau | So sánh công bằng bắt đầu từ cùng một đoạn nhạc và cùng một âm lượng.'
    ly_do: 'Review D8-gom: đáp án đúng viết lại cho khớp bước 2 đã sửa (bỏ khẳng định "bản to hơn thường có vẻ hay hơn").'
  - cu: Beethoven và Schubert hát, tự nhiên; thu trọn 32 sonata Beethoven hai lần (mono 1951–1956, stereo 1964–1965)
    moi: Beethoven và Schubert hát, tự nhiên; thu trọn 32 sonata Beethoven hai lần (1951–56 và 1964–65)
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Deutsche Grammophon: hai trọn bộ sonata Beethoven 1951–56 và 1964–65, và toàn bộ sonata Schubert. Bỏ "mono/stereo" (DG không ghi cho từng bộ); "hát, tự nhiên" là nhận xét của site.'
  - cu: Mozart giản dị và sâu; cuộc thi mang tên bà ở Vevey (Thụy Sĩ) có từ năm 1963
    moi: Mozart giản dị và sâu; cuộc thi mang tên bà (Thụy Sĩ, nay ở Vevey) có từ năm 1963
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Trang chính thức của cuộc thi: lưu trữ các kỳ thi từ 1963, hai năm một lần, kỳ 32 năm 2027 ở Vevey; tiểu sử Haskil: Mozart K. 466, Grand Prix du Disque cho sonata Mozart (cùng Grumiaux). Kết quả tìm kiếm cho biết các kỳ đầu ở Lucerne, từ 1973 ở Vevey (trang chính thức không nói rõ): viết "nay ở Vevey". Concerto số 24 (K. 491): không kiểm (gợi ý nghe). "Giản dị và sâu" là nhận xét của site.'
  - cu: Kiểm soát âm thanh tuyệt đối, cầu toàn đến cả tình trạng cây đàn; giải Nhất Geneva 1939; thầy của Argerich và Pollini
    moi: Kiểm soát âm thanh tuyệt đối, cầu toàn đến cả tình trạng cây đàn; giải Nhất Geneva 1939; Pollini học riêng với ông
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Warner Classics: "arch-perfectionist", thắng áp đảo cuộc thi Geneva năm sau 1938 (tức 1939); Geneva (hồ sơ báo chí): lập 1939, Michelangeli trong số người đoạt giải. DG: Pollini học riêng với ông sau giải Chopin. Warner nói Argerich có học ông "from a great distance, as he claimed" (còn tranh cãi): bỏ Argerich.'
  - cu: Beethoven, Schubert, Haydn, Liszt; người đầu tiên thu âm trọn tác phẩm piano độc tấu của Beethoven; viết tiểu luận và thơ
    moi: Beethoven, Schubert, Haydn, Liszt; người đầu tiên thu âm trọn tác phẩm piano của Beethoven; viết tiểu luận và thơ
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Trang chính thức của Brendel: thập niên 1960 "the first pianist ever to record the entire piano works of Beethoven (Vox)"; Haydn, Mozart, Beethoven, Schubert, Brahms, Liszt; tiểu luận và thơ. Nguồn nói "toàn bộ tác phẩm piano" (không giới hạn độc tấu): sửa chữ.'
  - cu: Lửa và tốc độ; thắng Busoni và Geneva năm 1957, Chopin năm 1965; từ thập niên 1980 ít độc tấu, chủ yếu concerto và thính phòng
    moi: Lửa và tốc độ; thắng Busoni và Geneva năm 1957, Chopin năm 1965; ít bản thu độc tấu, chủ yếu concerto và thính phòng
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Staatsoper Berlin: 1957 thắng Bolzano (Busoni) và Geneva, 1965 thắng Chopin; thính phòng "a major share of her activity". DG: bản thu độc tấu "relatively few". Bỏ "từ thập niên 1980" (không có nguồn).'
  - cu: Giải Nhất Leeds 1972; vừa chơi vừa chỉ huy các concerto Mozart; Bach trong sáng
    moi: Giải Nhất Leeds 1972; vừa chơi vừa chỉ huy concerto (như của Beethoven) với Academy of St Martin in the Fields; Bach trong sáng
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Leeds (trang chính thức): kỳ 1972, Perahia thắng. DG: Principal Guest Conductor của Academy of St Martin in the Fields từ 2000, chơi và chỉ huy concerto Beethoven từ phím đàn; French Suites của Bach. Chưa có nguồn nói rõ concerto Mozart: bỏ "Mozart". "Bach trong sáng" là nhận xét của site.'
  - cu: Thắng Chopin năm 1975; cầu toàn; năm 1999 vừa chơi vừa chỉ huy hai concerto Chopin với dàn nhạc do ông lập
    moi: Thắng Chopin năm 1975; cầu toàn; năm 1998 lập Polish Festival Orchestra (dàn nhạc nhạc công trẻ Ba Lan) nhân 150 năm ngày mất của Chopin (1999), lưu diễn và thu hai concerto Chopin với dàn nhạc ấy
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Viện Chopin: Zimerman thắng ngày 29/10/1975; DG: 18 tuổi, người thắng trẻ nhất; Polish Festival Orchestra do ông lập nhân 150 năm ngày mất của Chopin (1999), thu hai concerto Chopin. Không nguồn nào nói "vừa chơi vừa chỉ huy" hay "cầu toàn" ở đây: bỏ "vừa chơi vừa chỉ huy". Review cuối D8-gom (n40): lượt 2 sai năm; Praemium Imperiale: lập dàn nhạc năm 1998, lưu diễn năm 1999 nhân 150 năm ngày mất Chopin.'
  - cu: 'Bach trên piano: thắng cuộc thi piano Bach quốc tế ở Toronto năm 1985, thu các tác phẩm phím lớn của Bach từ 1994 đến 2005'
    moi: 'Bach trên piano: thắng cuộc thi piano Bach quốc tế ở Toronto năm 1985, thu các tác phẩm phím đàn lớn của Bach cho hãng Hyperion'
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Trang chính thức: 1985 thắng Toronto International Bach Piano Competition, cycle Bach "of all the major keyboard works" cho Hyperion (không ghi năm 1994–2005: bỏ khoảng năm); đĩa Couperin. "Bach trên piano" là mô tả chung.'
  - cu: Giải Ba Chopin 2010; giải Nhất Rubinstein và Tchaikovsky (kèm Grand Prix) năm 2011; Grammy 2018 cho trọn bộ étude của Liszt
    moi: Giải Ba Chopin 2010; giải Nhất Rubinstein và Tchaikovsky (kèm Grand Prix) năm 2011; Grammy 2018 cho album Transcendental (Liszt)
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): San Francisco Symphony: Grammy 2018 Best Instrumental Solo Album cho Transcendental ("the Liszt collection"); mùa 2010–11: giải Ba Chopin, giải Nhất Rubinstein, giải Nhất và Grand Prix Tchaikovsky (năm 2011 của hai giải sau suy từ "2010–11 season" và lịch cuộc thi: Rubinstein 5/2011, Tchaikovsky 7/2011). Nguồn không nói "trọn bộ étude": viết "album Transcendental".'
  - cu: Giải Nhất Chopin 2021; học với Đặng Thái Sơn ở Montréal
    moi: Giải Nhất Chopin 2021; học với Đặng Thái Sơn
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Viện Chopin: Bruce Liu thắng 2021; Oberlin: Liu coi Đặng Thái Sơn là một trong những người thầy quan trọng nhất ("his student"). Oberlin không nói "ở Montréal": bỏ.'
  - cu: Huy chương vàng Van Cliburn 2022 lúc 18 tuổi, người trẻ nhất từng thắng; album Étude Chopin đoạt giải Gramophone 2024
    moi: Huy chương vàng Van Cliburn 2022 lúc 18 tuổi, người trẻ nhất từng thắng; album Étude Chopin đoạt ba giải của BBC Music Magazine năm 2025
    ly_do: 'Review D8-gom (nguồn thay Wikipedia): Cliburn Foundation: người trẻ nhất từng thắng, 18 tuổi (2022). Gramophone chặn robot (403), không mở được: thay giải Gramophone 2024 bằng điều BBC Music Magazine (classical-music.com) ghi: album Chopin đoạt ba giải ở BBC Music Magazine Awards 2025.'
