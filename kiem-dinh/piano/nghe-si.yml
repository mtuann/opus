  nguon:
  - w-hofmann
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "1887: cậu bé Josef Hofmann, 11 tuổi, thu một trụ sáp cho Edison; bản này đã thất lạc". Wikipedia: ghi âm cho Edison khoảng 1888–1890 (c. 1890), "probably the first notable pianist to record on Edison''s phonograph" khi 12 tuổi (1888); các xy lanh thất lạc trong Thế chiến I. Không có năm 1887 hay "trụ sáp"; bỏ. Bậc 3 duy nhất; bản dẫn Gramophone (International Piano) chặn công cụ: chưa chắc, lượt 2 cần nguồn bậc 2.'
- id: n8
  cau: '1889: một nhân viên của Edison thu Brahms chơi một đoạn Hungarian Dance số 1 ở Vienna; bản ghi hư hỏng nặng, gần như không nghe rõ.'
