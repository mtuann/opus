- id: n14
  cau: 'Sergei Rachmaninoff (1873–1943): một trong những nghệ sĩ piano lớn nhất thời mình; bốn concerto và Rhapsody on a Theme of Paganini do chính ông thu với Dàn nhạc Philadelphia.'
