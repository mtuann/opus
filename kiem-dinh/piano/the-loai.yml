    ket_qua: null
    ghi_chu: 'Prelude Đô trưởng BWV 846 trong tac-pham.yml xác nhận bản chép sạch quyển 1 đề 1722 và in 1801; 1742 và 48 cặp chưa chắc: chưa đối chiếu được nguồn bậc 1–2 trong lượt này.'
