  - cu: "Grieg viết 66 Lyric Pieces trong mười tập, từ năm 1867 đến 1901: những bức tranh nhỏ về thiên nhiên, dân gian Na Uy và đời sống thường ngày. Bản đầu tiên, Arietta, là bài chơi thử lý tưởng; bản cuối cùng của tập cuối gợi lại chính giai điệu Arietta dưới dạng một điệu valse, như một lời tạm biệt."
    moi: Grieg viết 66 Lyric Pieces trong mười tập, từ năm 1867 đến 1901. Bản đầu tiên, Arietta, là bài chơi thử lý tưởng; bản cuối cùng của tập cuối gợi lại chính giai điệu Arietta dưới dạng một điệu valse, như một lời tạm biệt.
    ly_do: "n53 (da-sua, review D4-gom): bỏ mô tả chung không nguồn về nội dung Lyric Pieces."
