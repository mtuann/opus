    cau: 'Bảng: cột Thời kỳ của từng thể loại (Baroque, Cổ điển, Lãng mạn, thế kỷ 20) và cột Nghe thử nêu các bản có thật: French Suite số 5 BWV 816, Bình quân luật, Goldberg, Diabelli, Scarlatti K. 141 và K. 380, Mozart K. 331, Pathétique, Rondo K. 511, Fantasia K. 397, Fantaisie Op. 49, Op. 126, D. 899, Op. 9 số 2, Op. 10 và Op. 25, Op. 28, Estampes, Gaspard de la nuit, Lieder ohne Worte, Kinderszenen, Carnaval, Op. 117 và 118, Lyric Pieces, BWV 911, Prokofiev Op. 11, Fantasia D. 940.'
