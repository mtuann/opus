    cau: 'Bach: French Suites BWV 812–817, English Suites BWV 806–811, Partita BWV 825–830, Partita số 2 Đô thứ BWV 826; Handel, tổ khúc Mi trưởng HWV 430 có "The Harmonious Blacksmith".'
