    ket_qua: da-sua
    ghi_chu: 'Ở trang Nhà soạn nhạc đã đổi The Little Shepherd về Grade 7 (chặng 6) theo ABRSM/Henle; sửa cho khớp. Review D4-gom: Henle HN 382 (review đã mở): The Little Shepherd "ABRSM: Piano Grade 7", nên chặng 6 theo cap-do.yml. Giữ da-sua.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chặng 5 là hệ của site, không kiểm được.
  - id: n7
    cau: 'Bảng: Schubert, Moment musical số 3 ở chặng 4.'
    loai: cap-do
    nguon:
