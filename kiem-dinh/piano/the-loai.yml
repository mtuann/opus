  - cu: "Một tổ khúc (suite) là chuỗi điệu nhảy cùng giọng. Lõi chuẩn gồm bốn điệu: allemande (nhịp chẵn, vừa phải, dòng nốt móc kép chảy đều), courante (nhịp ba, chạy nhanh hơn), sarabande (nhịp ba chậm, trang nghiêm, thường nhấn vào phách 2) và gigue (nhanh, thường nhịp 6/8 hoặc 12/8, hay mở đầu bằng lối bắt chước). Giữa sarabande và gigue thường chèn thêm minuet, gavotte, bourrée."
    moi: "Một tổ khúc (suite) là chuỗi điệu nhảy cùng giọng. Lõi chuẩn gồm bốn điệu: allemande (nhịp chẵn, vừa phải), courante (nhịp ba; kiểu Ý corrente thì nhanh), sarabande (nhịp ba chậm, trang nghiêm) và gigue (nhanh, nhịp ghép như 6/8). Giữa sarabande và gigue thường chèn thêm minuet, gavotte, bourrée."
    ly_do: "n15 (da-sua, review D4-gom): theo ODM; bỏ chi tiết không nguồn về allemande, sarabande, gigue; courante Pháp không nhanh."
  - cu: Prelude là phần mở đầu tự do, thường dựa trên một hình nốt lặp lại. Fugue là bản phức điệu trong đó một chủ đề được các bè lần lượt bắt chước (xem Fugue). Hai quyển Bình quân luật của Bach (quyển 1 năm 1722, quyển 2 khoảng 1742) gồm 48 cặp prelude và fugue qua đủ 24 giọng trưởng và thứ.
    moi: Prelude là phần mở đầu, đi trước một bản khác như fugue. Fugue là bản phức điệu trong đó một chủ đề được các bè lần lượt bắt chước (xem Fugue). Hai quyển Bình quân luật của Bach (quyển 1 năm 1722, quyển 2 đầu những năm 1740) gồm 48 cặp prelude và fugue qua đủ 24 giọng trưởng và thứ.
    ly_do: 'n18 (da-sua, review D4-gom): ODM: prelude đi trước một bản khác; bỏ "thường dựa trên một hình nốt lặp lại".'
  - cu: "Domenico Scarlatti để lại 555 sonata cho harpsichord, phần lớn chỉ một chương chia hai phần, mỗi phần nhắc lại: phần đầu đi từ giọng chính sang giọng khác, phần sau quay về. Nhạc của ông đầy vắt tay, nốt lặp, quãng nhảy rộng và âm hưởng guitar Tây Ban Nha. Xem hướng dẫn nghe Scarlatti. Bản dễ để chơi thử: K. 32 Rê thứ, có tên Aria."
    moi: "Domenico Scarlatti để lại hơn 550 sonata cho harpsichord (danh mục Kirkpatrick đánh số tới K. 555). Nhiều bản chỉ một chương ở hình thức hai phần, mỗi phần nhắc lại: phần đầu thường chuyển sang giọng khác, phần sau quay về giọng chính. Các bản về sau của ông hay mang nét nhạc dân gian bán đảo Iberia (fandango, seguidilla). Xem hướng dẫn nghe Scarlatti. Bản dễ để chơi thử: K. 32 Rê thứ, có tên Aria."
    ly_do: 'n23 (da-sua, review D4-gom): Britannica, Henle HN 581, OMT (Binary Form); bỏ "phần lớn" và các nét phong cách không nguồn.; n68 (da-sua, review D4-gom): OMT (Binary Form): phần đầu có thể chuyển giọng.'
  - cu: 'Sonata Cổ điển thường có ba chương nhanh – chậm – nhanh. Chương đầu ở hình thức sonata; chương cuối thường là rondo hoặc một chương nhanh vui tươi. Haydn để lại khoảng 60 sonata cho đàn phím, Mozart 18, Beethoven 32. Sonatina là "sonata nhỏ": ngắn hơn, đoạn phát triển rất ngắn hoặc không có, viết cho người học (Clementi Op. 36, Kuhlau Op. 20 và Op. 55, Diabelli Op. 151 và Op. 168).'
    moi: 'Sonata Cổ điển thường có ba chương nhanh – chậm – nhanh. Chương đầu thường ở hình thức sonata; chương cuối thường ở hình thức sonata hoặc rondo. Haydn để lại khoảng 60 sonata cho đàn phím, Mozart 18, Beethoven 32. Sonatina là "sonata nhỏ" (dạng thu nhỏ của chữ sonata trong tiếng Ý). Vài tập sonatina: Clementi Op. 36, Kuhlau Op. 20 và Op. 55, Diabelli Op. 151 và Op. 168.'
    ly_do: "n25, n27 (da-sua, review D4-gom): ODM (Sonata): chương đầu thường ở hình thức sonata, chương cuối thường sonata hoặc rondo; không mở được nguồn định nghĩa sonatina."
  - cu: 'Mozart viết 12 biến tấu trên giai điệu "Ah! vous dirai-je, maman" (bạn biết giai điệu này qua bài Twinkle, Twinkle), K. 265. Beethoven có 32 biến tấu Đô thứ WoO 80 và bộ Diabelli Variations Op. 120 khổng lồ. Rondo (xem hình thức) cho đoạn chính quay lại nhiều lần, xen các đoạn tương phản: Mozart, Rondo La thứ K. 511; Beethoven, Rondo a capriccio Op. 129 (biệt danh "Giận dữ vì đồng xu bị mất" không phải do Beethoven đặt). Für Elise là một rondo nhỏ A–B–A–C–A.'
    moi: 'Mozart viết 12 biến tấu trên giai điệu "Ah! vous dirai-je, maman" (bạn biết giai điệu này qua bài Twinkle, Twinkle), K. 265. Beethoven có 32 biến tấu Đô thứ WoO 80 và bộ Diabelli Variations Op. 120 khổng lồ. Rondo (xem hình thức) cho đoạn chính quay lại nhiều lần, xen các đoạn tương phản: Mozart, Rondo La thứ K. 511; Beethoven, Rondo a capriccio Op. 129 (biệt danh "Giận dữ vì đồng xu bị mất"). Für Elise là một rondo nhỏ A–B–A–C–A.'
    ly_do: 'n29 (da-sua, review D4-gom): không nguồn cho "không phải do Beethoven đặt" (IMSLP chỉ ghi tên khác).'
  - cu: "Thế kỷ 19 yêu tiểu phẩm tính cách (character piece): một bản ngắn khắc họa một tâm trạng hay một hình ảnh, rất hợp với cây đàn đứng trong phòng khách gia đình."
    moi: "Thế kỷ 19 có rất nhiều tiểu phẩm tính cách (character piece) cho piano: những bản ngắn khắc họa một tâm trạng hay một hình ảnh."
    ly_do: "n32 (da-sua, review D4-gom): Britannica (Nocturne); bỏ vế đàn đứng phòng khách (không nguồn)."
  - cu: '"Khúc nhạc đêm". Nhà soạn nhạc Ireland John Field viết những nocturne đầu tiên năm 1812 và thường được coi là người khai sinh thể loại; Chopin đưa nó lên đỉnh cao. Công thức: tay trái rải hợp âm rộng, tay phải hát một giai điệu kiểu opera Ý, có những chuỗi nốt hoa mỹ uốn lượn. Xem bài học Nocturne Op. 9 số 2, có bản thu và bản đồ nghe theo từng đoạn.'
    moi: '"Khúc nhạc đêm". Nhà soạn nhạc Ireland John Field in những nocturne đầu tiên khoảng năm 1812–1814 (các nguồn ghi khác nhau) và thường được coi là người khai sinh thể loại; Chopin đưa nó lên đỉnh cao. Ở Nocturne Op. 9 số 2 của Chopin, chẳng hạn, tay trái rải hợp âm rộng, tay phải hát một giai điệu có nhiều nốt hoa mỹ. Xem bài học Nocturne Op. 9 số 2, có bản thu và bản đồ nghe theo từng đoạn.'
    ly_do: 'n36, n37 (da-sua, review D4-gom): Henle (1812) và Britannica (1814) lệch nên viết khoảng; "công thức" nocturne không nguồn, viết lại thành ví dụ Op. 9 số 2.; n66 (da-sua, review D4-gom): như n36 (Henle 1812, Britannica 1814).'
  - cu: "Étude nghĩa là \"bài học\". Czerny, Cramer, Clementi viết hàng trăm bài để luyện ngón (xem Bài tập ngón và étude). Chopin biến étude thành nhạc hòa nhạc: mỗi bản trong 24 étude Op. 10 (1833) và Op. 25 (1837) giải một bài toán kỹ thuật nhưng là một tác phẩm trọn vẹn. Sau ông có Liszt (Études d'exécution transcendante), Debussy (12 étude, 1915), Rachmaninoff (Études-tableaux) và Ligeti. Xem hướng dẫn nghe các étude của Chopin."
    moi: "Étude nghĩa là \"bài học\". Czerny, Cramer, Clementi viết nhiều tập étude để luyện ngón (xem Bài tập ngón và étude). Chopin biến étude thành nhạc hòa nhạc: mỗi bản trong 24 étude Op. 10 (1833) và Op. 25 (1837) giải một bài toán kỹ thuật nhưng là một tác phẩm trọn vẹn. Sau ông có Liszt (Études d'exécution transcendante), Debussy (12 étude, 1915), Rachmaninoff (Études-tableaux) và Ligeti. Xem hướng dẫn nghe các étude của Chopin."
    ly_do: 'n38 (da-sua, review D4-gom): "hàng trăm bài" không nguồn đếm.'
  - cu: Không còn là "khúc dạo đầu" cho fugue nữa. 24 prelude Op. 28 của Chopin đi qua 24 giọng theo vòng quãng năm (Đô trưởng, La thứ, Sol trưởng, Mi thứ…), có bản chỉ dài vài chục giây. Sau ông có Scriabin (Op. 11), Rachmaninoff và Debussy, người đặt tên gợi hình ở cuối mỗi prelude để người nghe không bị tên gọi dẫn dắt từ đầu.
    moi: Không còn là "khúc dạo đầu" cho fugue nữa. 24 prelude Op. 28 của Chopin đi qua 24 giọng theo vòng quãng năm (Đô trưởng, La thứ, Sol trưởng, Mi thứ…). Sau ông có Scriabin (Op. 11), Rachmaninoff và Debussy, người đặt tên gợi hình ở cuối mỗi prelude, trong ngoặc, để người chơi gặp âm nhạc trước khi gặp tên gọi.
    ly_do: 'n40, n41 (da-sua, review D4-gom): bỏ "vài chục giây" (không nguồn); Henle (Lesure): tên ở cuối, trong ngoặc, để người chơi không cần biết tên trước.'
  - cu: Ba điệu nhịp ba của Chopin. Mazurka là điệu nhảy dân gian Ba Lan, phách nhấn thường rơi vào phách 2 hoặc 3; Chopin viết gần 60 bản, nhỏ mà rất riêng tư. Polonaise trang trọng, kiêu hãnh, như một cuộc diễu hành. Valse (waltz) của Chopin dành cho phòng khách và phòng hòa nhạc chứ không để nhảy. Bắt đầu chơi thử từ Valse La thứ.
    moi: Ba điệu nhịp ba của Chopin. Mazurka là điệu nhảy dân gian Ba Lan, phách nhấn thường rơi vào phách 2; Chopin viết khoảng 60 bản. Polonaise là điệu Ba Lan nhịp ba, tốc độ vừa, trang trọng như một cuộc rước; Chopin in bảy bản polonaise lớn lúc sinh thời (Op. 26, 40, 44, 53, 61), ngoài ra còn những bản thời trẻ. Valse (waltz) cũng ở nhịp ba. Bắt đầu chơi thử từ Valse La thứ.
    ly_do: "n43 (da-sua, người gom D4-gom): \"Chopin viết 13 bản\" không khớp nguồn; theo Henle HN 217/218. n42, n43 (da-sua, review D4-gom): ODM (Mazurka: nhấn phách 2; khoảng 60 bản), Concise ODM (Polonaise: 13 bản của Chopin); bỏ đánh giá không nguồn về valse."
  - cu: 'Chopin là người đầu tiên đặt tên ballade cho một bản nhạc không lời: bốn ballade lớn, như những câu chuyện kể không lời, kịch tính và tự do về hình thức. Scherzo nghĩa đen là "đùa", vốn là chương nhanh trong sonata và giao hưởng (xem Scherzo); bốn scherzo độc lập của Chopin thì dữ dội chứ không hề vui đùa. Xem Ballade số 1.'
    moi: Chopin là người đầu tiên đặt tên ballade cho một bản nhạc không lời; ông viết bốn ballade. Scherzo nghĩa đen là "đùa", vốn là chương nhanh trong sonata và giao hưởng (xem Scherzo); Chopin viết bốn scherzo độc lập cho piano. Xem Ballade số 1.
    ly_do: "n44 (da-sua, review D4-gom): Britannica (Chopin); bỏ đánh giá không nguồn về ballade, scherzo."
  - cu: Mendelssohn viết tám tập Lieder ohne Worte (Bài hát không lời), mỗi tập sáu bản; sáu tập đầu in khi ông còn sống, hai tập cuối (Op. 85, Op. 102) in sau khi ông mất. Mỗi bản là một giai điệu như ca khúc trên phần đệm piano. Ba bản có tên Venetianisches Gondellied (Khúc thuyền gondola Venice) là những barcarolle nhỏ rất đẹp; bản đầu tiên, Op. 19 số 6 Sol thứ, là bài chơi thử tốt ở chặng 5 (xem bài học).
    moi: Mendelssohn viết tám tập Lieder ohne Worte (Bài hát không lời), mỗi tập sáu bản; sáu tập đầu in khi ông còn sống, hai tập cuối (Op. 85, Op. 102) in sau khi ông mất. Mỗi bản là một giai điệu như ca khúc trên phần đệm piano. Ba bản có tên Venetianisches Gondellied (Khúc thuyền gondola Venice); bản đầu tiên, Op. 19 số 6 Sol thứ, là bài chơi thử tốt ở chặng 5 (xem bài học).
    ly_do: 'n46 (da-sua, review D4-gom): bỏ đánh giá "barcarolle nhỏ rất đẹp".'
  - cu:
      - "Rhapsody: tự do, thường có màu dân gian. 19 Hungarian Rhapsodies của Liszt thường đi từ phần chậm, u buồn sang phần nhanh, cuồng nhiệt; hai Rhapsody Op. 79 của Brahms thì đậm đặc và dữ dội."
