  - id: n8
    cau: 'Bảng: Diabelli Op. 149 ở chặng 1.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang Chơi cùng người khác xếp Op. 149 ở chặng 1–3, bắt đầu từ chặng 1. Review D4-gom: đổi nhãn cap-do thành ve-site. Đã kiểm src/content/docs/piano/choi-cung-nguoi-khac.md dòng 112: "| 1–3 | Diabelli, Melodische Übungsstücke Op. 149 |" (bắt đầu từ chặng 1). IMSLP: Op. 149 cho piano bốn tay.'
