ghi_chu: 'Phần Nguồn (sách) chưa xác nhận được vì Open Library bị chặn robots và nguồn khác không tải được. Nhiều số hiệu, năm và số lượng của thể loại chưa đối chiếu được nguồn bậc 1–2 nên để null. Ba chỗ chặng (Invention, Valse La thứ, Little Shepherd, Moment musical số 3) đã đồng bộ với tac-pham.yml và hồ sơ nha-soan-nhac. Chưa có hồ sơ thuật ngữ cho: courante, sarabande, allemande, gigue, toccata, fugue, rondo, barcarolle, berceuse, rhapsody, intermezzo, bagatelle, impromptu, moment musical, sonatina, tổ khúc, tiểu phẩm tính cách. Review D4-gom (nhóm C, 28/10/2026): quyết 58 câu null. Số hiệu, năm, số lượng đối chiếu IMSLP (đọc qua API), Henle, Britannica, ODM; chặng đối chiếu tac-pham.yml và cap-do.yml (khóa); bỏ chặng ở sáu bản không có nguồn Grade (n9–n11). Bỏ các mô tả đánh giá không nguồn. n2, n3, n4, n5, n8, n64 đổi nhãn thành ve-site; n13, n41, n70 thành lich-su; n37 thành cau-truc.'
