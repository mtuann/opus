  - cu: "Phần lớn nhạc phím Baroque viết cho harpsichord, clavichord hoặc organ (xem Lịch sử cây đàn piano), nhưng đây là kho bài quan trọng bậc nhất cho người học piano: nó dạy hai tay độc lập, phức điệu và nhịp vững."
