    cau: Allemande nhịp chẵn, vừa phải, dòng móc kép; courante nhịp ba, nhanh hơn; sarabande nhịp ba chậm, thường nhấn phách 2; gigue nhanh, thường 6/8 hoặc 12/8.
    loai: dinh-nghia
    ket_qua: null
    ghi_chu: 'chưa chắc: chưa đối chiếu được nguồn bậc 1–2 trong lượt này (đặc biệt "courante nhịp ba": courante Pháp thường 3/2 hoặc 6/4, courante Ý 3/4 nhanh).'
