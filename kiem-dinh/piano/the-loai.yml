    moi:
      - "Rhapsody: tự do, thường có màu dân gian: 19 Hungarian Rhapsodies của Liszt; hai Rhapsody Op. 79 của Brahms."
      - 'Intermezzo ("khúc chen giữa"): Brahms cuối đời viết nhiều intermezzo trong bốn tập Op. 116–119 (1892–1893). Xem hướng dẫn nghe Brahms Op. 118 số 2.'
    ly_do: "n49, n50 (da-sua, review D4-gom): IMSLP; bỏ mô tả không nguồn về Hungarian Rhapsodies, Op. 79 và intermezzo của Brahms."
