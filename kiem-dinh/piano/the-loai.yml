nhan_dinh:
  - id: n1
    cau: 'Mô tả định nghĩa: nocturne trữ tình và chậm rãi; étude đặt một bài toán kỹ thuật; mazurka nhịp ba, phách nhấn lệch.'
    loai: dinh-nghia
    ket_qua: dung
    ghi_chu: "chưa chắc: khong-can-nguon chỉ cho khuyen-tap; lượt 2 tìm nguồn hay hạ thành lời dẫn. Mô tả đặc trưng chung, dùng để dẫn vào bài; các chi tiết kiểm được nằm ở từng thể loại bên dưới. Review D4-gom: Britannica (Nocturne): tiểu phẩm tính cách trữ tình; ODM: étude là bài luyện kỹ thuật; ODM (Mazurka): nhịp ba, nhấn phách 2. Lời dẫn nói \"thường\", khớp. Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/nocturne", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mazurka", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/etude" ]
    luot_2_ghi_chu: Nocturne là tiểu phẩm tính cách trữ tình (Britannica); étude là bài luyện kỹ thuật (ODM); mazurka nhịp ba nhấn lệch phách 2 (ODM).
    nguon:
      - brit-noct
      - ency-etude
      - ency-mazurka
  - id: n2
    cau: Mức độ ghi ở cột "Chơi thử" (khi có) theo thang bảy chặng, chặng 1 là khởi đầu, chặng 7 là sau Grade 8.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Khớp cap-do.yml. Review D4-gom: đổi nhãn cap-do thành ve-site (thang bảy chặng là hệ của site). Đã kiểm src/data/cap-do.yml (khóa): 7 chặng, chặng 1 Khởi đầu, chặng 7 Sau Grade 8; anchor #thi-cap: ../opus-zero/docs/piano/thay-va-thi.md có "## Thi cấp". Chữ "(khi có)" thêm vì các ô không có nguồn Grade đã bỏ mức (n9–n11).'
    luot_2: khong-chac
    luot_2_ghi_chu: Thang bảy chặng là hệ của site; không kiểm được.
    review: dung
  - id: n3
    cau: 'Bảng tóm tắt: các bản "Chơi thử" có trang bài học đều có thật, và chặng ghi trong bảng khớp tac-pham.yml: Minuet Sol trưởng chặng 2, Prelude Đô trưởng chặng 4, Clementi Op. 36 số 1 chặng 3, Für Elise chặng 4, Burgmüller Arabesque chặng 3, Prélude Mi thứ chặng 4, Ballade số 1 chặng 7, Mendelssohn Op. 19 số 6 chặng 5, Schumann Album chặng 2, Grieg Arietta chặng 4.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đối chiếu từng dòng với tac-pham.yml; các dòng sai được tách riêng bên dưới. Review D4-gom: đổi nhãn cap-do thành ve-site. Đã đối chiếu từng ô với src/data/tac-pham.yml (trường chang đã khóa): minuet-sol 2, bach-prelude-do 4, bach-invention-1 4, clementi-sonatina 3, fur-elise 4, burgmuller-arabesque 3, chopin-prelude-mi-thu 4, chopin-valse-la-thu 5, chopin-ballade-1 7, mendelssohn-thuyen-ca 5, schumann-album 2, grieg-arietta 4: khớp."
    luot_2: khong-chac
    luot_2_ghi_chu: "Chặng là hệ riêng của site; không mở tac-pham.yml. Tham khảo ngoài: Arietta Op. 12/1 được xếp ABRSM Grade 4 theo trang bài giảng (không phải đề cương chính thức); Venetian Gondola Op. 19/6 Henle bậc 4. Các bản đều có thật."
    review: dung
  - id: n4
    cau: 'Bảng: Invention số 1 ở chặng 5.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: "tac-pham.yml (khóa) xếp bach-invention-1 ở chặng 4 (Grade 4–5); sửa thành chặng 4. Review D4-gom: đổi nhãn cap-do thành ve-site; đã kiểm chặng trên trang khớp src/data/tac-pham.yml (bach-invention-1 chặng 4, chopin-valse-la-thu chặng 5)."
    luot_2: khong-chac
    luot_2_ghi_chu: Chặng 5 là hệ của site, không kiểm được (Invention số 1 BWV 772 có thật).
    review: dung
  - id: n5
    cau: 'Bảng: Valse La thứ ở chặng 3.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: "tac-pham.yml xếp chopin-valse-la-thu ở chặng 5 (Grade 5–6; ABRSM Grade 6); sửa thành chặng 5. Review D4-gom: đổi nhãn cap-do thành ve-site; đã kiểm chặng trên trang khớp src/data/tac-pham.yml (bach-invention-1 chặng 4, chopin-valse-la-thu chặng 5)."
    luot_2: khong-chac
    luot_2_ghi_chu: Chặng 3 là hệ của site, không kiểm được.
    review: dung
  - id: n6
    cau: 'Bảng: Debussy, The Little Shepherd ở chặng 5.'
    loai: cap-do
