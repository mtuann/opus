      - h-sch
      - du-cd
    ket_qua: da-sua
    ghi_chu: 'Ở trang Nhà soạn nhạc đã đổi Moment musical số 3 về Grade 6 (chặng 5); sửa cho khớp. Review D4-gom: Henle HN 4 (review đã mở): Moment musical số 3 Fa thứ "ABRSM: Piano Grade 6", nên chặng 5. Giữ da-sua.'
