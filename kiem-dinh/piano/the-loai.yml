ghi_chu: 'Phần Nguồn (sách) chưa xác nhận được vì Open Library bị chặn robots và nguồn khác không tải được. Nhiều số hiệu, năm và số lượng của thể loại chưa đối chiếu được nguồn bậc 1–2 nên để null. Ba chỗ chặng (Invention, Valse La thứ, Little Shepherd, Moment musical số 3) đã đồng bộ với tac-pham.yml và hồ sơ nha-soan-nhac. Chưa có hồ sơ thuật ngữ cho: courante, sarabande, allemande, gigue, toccata, fugue, rondo, barcarolle, berceuse, rhapsody, intermezzo, bagatelle, impromptu, moment musical, sonatina, tổ khúc, tiểu phẩm tính cách.'
