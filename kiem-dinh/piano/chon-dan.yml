doi_chu:
  - cu: Cảm giác phím và tiếng đàn là mô phỏng; sắc thái rất nhỏ và bàn đạp kém tinh tế hơn đàn cơ tốt; mất giá nhanh
    moi: Cảm giác phím và tiếng đàn là mô phỏng; sắc thái rất nhỏ và bàn đạp kém tinh tế hơn đàn cơ tốt
    ly_do: '"Mất giá nhanh" là thông tin thị trường mau cũ, không kiểm được.'
  - cu:
      - Cảm biến
      - Ba cảm biến mỗi phím là điểm cộng
      - Đánh lặp nhanh một nốt chính xác hơn
    moi: null
    ly_do: 'Hàng bảng piano điện về ba cảm biến mỗi phím: thông tin kỹ thuật theo hãng, không có nguồn đã mở.'
  - cu:
      - 128 trở lên
      - Bàn đạp vang và mô phỏng cộng hưởng dây "ăn" polyphony rất nhanh; thiếu thì nốt cũ bị cắt đột ngột ở đoạn nhiều bàn đạp
    moi:
      - Cao, nhất là khi bạn hay dùng bàn đạp vang; con số ghi trong sách hướng dẫn của từng đàn
      - Nốt được bàn đạp vang giữ ngân vẫn tính vào polyphony; đàn có polyphony thấp có thể tắt nốt cũ để nhường chỗ cho nốt mới
    ly_do: 'Bỏ "mô phỏng cộng hưởng dây" (không có trong nguồn đã mở). Review D8-gom: bỏ con số 128 (chỉ có nguồn cửa hàng; hãng không nêu ngưỡng), viết theo Kawai (FAQ What is polyphony?).'
  - cu: Mối mọt, nấm mốc, côn trùng làm tổ
    moi: Côn trùng làm hỏng nỉ (búa, bộ giảm âm và các phần nỉ khác)
    ly_do: 'The Piano Book: moth damage to felt; không nhắc nấm mốc. Review D8-gom: bỏ "mối mọt" (nguồn chỉ nói côn trùng ăn nỉ của búa, damper và các phần nỉ khác).'
  - cu: Ở Việt Nam, đàn cơ đứng đã qua sử dụng nhập từ Nhật khá phổ biến. Chất lượng từng cây phụ thuộc vào tuổi đời, cách bảo quản và mức độ tân trang; tên hãng không bảo đảm tình trạng của một cây cụ thể. Hãy chơi thử thật lâu, nghe ý kiến của thợ, và đừng quyết định vì lớp sơn bóng đẹp.
    moi: Với đàn đã qua sử dụng, chất lượng từng cây phụ thuộc vào tuổi đời, cách bảo quản và mức độ tân trang; tên hãng không bảo đảm tình trạng của một cây cụ thể. Hãy chơi thử thật lâu, nghe ý kiến của thợ, và đừng quyết định vì lớp sơn bóng đẹp.
    ly_do: Bỏ thông tin thị trường (nhập từ Nhật) mau cũ, không kiểm được.
  - cu: 'Nếu tạm thời chỉ có đàn phím nhẹ, hãy coi đó là giải pháp ngắn hạn và lên kế hoạch đổi đàn trong vài tháng: thói quen dùng lực hình thành trên phím nhẹ rất khó sửa về sau.'
    moi: 'Nếu tạm thời chỉ có đàn phím nhẹ, hãy coi đó là giải pháp ngắn hạn và lên kế hoạch đổi đàn trong vài tháng: thói quen dùng lực hình thành trên phím nhẹ khiến việc chuyển sang đàn cơ khó hơn.'
    ly_do: 'Yamaha: khó chuyển sang đàn cơ; "rất khó sửa" mạnh hơn nguồn.'
  - cu: Đồng hồ hẹn giờ nhắc nghỉ 5 phút sau mỗi 25–30 phút tập (xem Giữ đôi tay khỏe).
    moi: Đồng hồ hẹn giờ nhắc nghỉ 10 phút sau mỗi 20 phút tập (theo BAPAM; xem Giữ đôi tay khỏe).
    ly_do: Trái trang piano/suc-khoe đã khóa (20 phút tập, 10 phút nghỉ theo BAPAM).
  - cu: 'Lên dây: Yamaha khuyên tối thiểu hai lần một năm. Đàn mới chuyển về cần vài tuần để quen với phòng rồi mới lên dây. Đàn bỏ lâu ngày có thể phải kéo dây nhiều lần.'
    moi: "Lên dây: Yamaha khuyên lên dây ít nhất một lần một năm, đàn mới hay đàn chơi nhiều thì hai lần một năm hoặc hơn. Đàn để quá lâu không lên dây thì khó đưa về trạng thái tốt, thợ tốn nhiều công hơn."
    ly_do: 'Yamaha Hub: ít nhất một lần mỗi năm; đàn mới hay chơi nhiều thì hai lần hoặc hơn. Review D8-gom: bỏ "vài tuần để quen phòng" (không nguồn); "kéo dây nhiều lần" thay bằng chữ của Yamaha Hub (để quá lâu thì khó đưa về trạng thái tốt).'
  - cu: 'Độ ẩm: Yamaha khuyên độ ẩm tương đối khoảng 40–45%. Ở Việt Nam, mức này khó giữ quanh năm (nồm ẩm ở miền Bắc, mùa mưa ở miền Nam), nên điều quan trọng là tránh ẩm cao kéo dài và tránh thay đổi đột ngột:'
    moi: 'Độ ẩm: Yamaha khuyên độ ẩm tương đối trong khoảng 35–55%, lý tưởng là 45%. Ở Việt Nam, giữ độ ẩm trong khoảng ấy quanh năm không dễ (nồm ẩm ở miền Bắc, mùa mưa ở miền Nam), nên điều quan trọng là tránh ẩm cao kéo dài và tránh thay đổi đột ngột:'
    ly_do: 'Yamaha Hub: 35–55%, tối ưu 45%.'
  - cu: Lau phím bằng khăn mềm, khô. Theo Yamaha, không dùng chất tẩy có cồn vì có thể làm nứt phím; vết bẩn nặng thì dùng khăn thấm nước xà phòng vắt thật kiệt, và không dùng khăn đó lau thân đàn.
    moi: Lau phím bằng khăn mềm, khô. Theo Yamaha, không dùng chất tẩy có cồn vì có thể làm phím đổi màu hay nứt về sau. Vết bẩn nặng thì dùng khăn mềm thấm nước pha ít nước rửa chén vắt thật kiệt, rồi lau lại bằng khăn khác hơi ẩm; không dùng khăn đó lau thân đàn.
    ly_do: 'Theo Yamaha Hub: có thể làm phím đổi màu hay nứt; nước rửa chén pha loãng rồi khăn hơi ẩm.'
  - cu:
      - 'Yamaha, "Caring for your Piano" (trang hỗ trợ khách hàng trên yamaha.com): độ ẩm, lên dây, vệ sinh phím.'
      - 'Larry Fine, The Piano Book: Buying & Owning a New or Used Piano, ấn bản 4 (Brookside Press, 2001); tạp chí trực tuyến Piano Buyer.'
    moi:
      - "Yamaha, Five simple steps for maintaining your piano (Yamaha Music Hub): độ ẩm, lên dây, vệ sinh phím."
      - "Larry Fine, The Piano Book: Buying & Owning a New or Used Piano, ấn bản 4 (Brookside Press); tạp chí trực tuyến Piano Buyer."
      - "Yamaha, A quick guide to weighted keys (Yamaha Music Hub): phím có trọng lượng, đánh lặp ở đàn đại và đàn đứng."
      - "Kawai, What is polyphony?: polyphony và bàn đạp vang."
    ly_do: "Bỏ năm 2001 (không kiểm được; trang Piano Buyer chỉ ghi ấn bản 4). Review D8-gom: thêm hai nguồn dùng khi review (Yamaha Weighted Keys, Kawai)."
  - cu: 'câu hỏi: Vì sao nên chọn đàn có polyphony từ 128 trở lên? | Để đàn to hơn | ✓ Vì bàn đạp vang làm nhiều nốt ngân cùng lúc; thiếu polyphony thì nốt cũ bị cắt | Để có nhiều tiếng nhạc cụ hơn | Mỗi nốt đang ngân, kể cả cộng hưởng mô phỏng, chiếm một "giọng" của đàn.'
    moi: "câu hỏi: Vì sao polyphony (số nốt phát đồng thời) quan trọng khi chơi có bàn đạp vang? | Để đàn to hơn | ✓ Vì nốt được bàn đạp giữ ngân vẫn tính vào polyphony; thiếu thì đàn tắt bớt nốt cũ | Để có nhiều tiếng nhạc cụ hơn | Polyphony là số nốt tối đa đàn phát được cùng lúc."
    ly_do: 'Cùng lý do bỏ "mô phỏng cộng hưởng". Review D8-gom: câu hỏi viết lại cho khớp hàng polyphony đã bỏ con số 128 (Kawai).'
  - cu: Bộ máy nằm ngang đánh lặp nhanh hơn; kiểm soát tiếng và bàn đạp tốt nhất
    moi: "Dây nằm ngang, búa rơi về nhờ trọng lượng; đánh lặp một nốt nhanh hơn đàn đứng (theo Yamaha: tới khoảng 15 lần mỗi giây, đàn đứng khoảng 7)"
    ly_do: 'Review D8-gom: "kiểm soát tiếng và bàn đạp tốt nhất" là nhận xét không nguồn; phần đánh lặp viết theo Yamaha Hub (Weighted Keys).'
  - cu: Giá cao
    moi: "Đàn cơ có hệ thống tắt tiếng vẫn là đàn cơ: vẫn cần lên dây và giữ độ ẩm"
    ly_do: 'Review D8-gom: "Giá cao" không có nguồn; Yamaha Hub: đàn tắt tiếng là đàn cơ thật có thanh chặn búa.'
  - cu: Với người lớn mới học, một cây piano điện tốt là khởi đầu hoàn toàn hợp lý. Điều quan trọng là thỉnh thoảng được chơi trên đàn cơ (ở lớp học, trung tâm, nhà bạn bè) để tay và tai biết "chuẩn" là thế nào. Nhiều người nâng cấp lên đàn cơ khi đến khoảng Grade 4–5, lúc các bài bắt đầu đòi hỏi sắc thái và bàn đạp tinh tế (xem Bàn đạp và Tạo tiếng đàn).
    moi: Với người lớn mới học, một cây piano điện tốt là khởi đầu hoàn toàn hợp lý. Điều quan trọng là thỉnh thoảng được chơi trên đàn cơ (ở lớp học, trung tâm, nhà bạn bè) để tay và tai biết "chuẩn" là thế nào. Site gợi ý tính chuyện nâng cấp lên đàn cơ khi đến khoảng Grade 4–5, lúc các bài bắt đầu đòi hỏi sắc thái và bàn đạp tinh tế (xem Bàn đạp và Tạo tiếng đàn).
    ly_do: 'Review D8-gom: "Nhiều người nâng cấp" là điều cần nguồn, không có; viết thành lời khuyên của site, giữ mốc Grade 4–5.'
  - cu:
      - Loại liên tục (cho phép nửa bàn đạp), tốt nhất là bộ ba bàn đạp gắn vào chân đàn
      - Bàn đạp dạng công tắc chỉ có bật và tắt; bàn đạp rời nhỏ hay trượt trên sàn
    moi:
      - Loại liên tục (cho phép nửa bàn đạp); nếu được, site khuyên chọn bộ ba bàn đạp gắn vào chân đàn
      - Bàn đạp dạng công tắc chỉ có bật và tắt, không cho nửa bàn đạp
    ly_do: 'Review D8-gom: bỏ "bàn đạp rời nhỏ hay trượt trên sàn" (không nguồn); bộ ba bàn đạp ghi rõ là lời khuyên của site.'
  - cu: Ghế chữ X của đàn organ thường lung lay và không đúng độ cao
    moi: Ghế chỉnh được thì đặt được độ cao hợp với người ngồi; cách ngồi xem Tư thế, thế tay và cách dùng lực
    ly_do: "Review D8-gom: nhận xét về ghế chữ X không có nguồn; trỏ sang trang tư thế đã khóa."
  - cu: Đàn lâu không lên dây có thể phải kéo dây nhiều lần mới ổn định
    moi: Đàn để quá lâu không lên dây thì khó đưa về trạng thái tốt, thợ tốn nhiều công hơn
    ly_do: 'Review D8-gom: viết theo Yamaha Hub (Five simple steps); "kéo dây nhiều lần" không có nguồn.'
  - cu: Thợ thường tra được năm sản xuất từ số seri của các hãng lớn. Hỏi thêm về bảo hành, chi phí vận chuyển, và lần lên dây sau khi đàn về nhà.
    moi: Từ số seri, có thể tra năm sản xuất trong sách tra cứu như Pierce Piano Atlas; không tra được thì thợ đôi khi ước đoán được. Hỏi thêm về bảo hành, chi phí vận chuyển, và lần lên dây sau khi đàn về nhà.
    ly_do: 'Review D8-gom: viết theo Piano Buyer (The Piano Book): tra Pierce Piano Atlas; "sometimes a technician can estimate".'
  - cu: USB-MIDI (cổng "USB to Host") hoặc Bluetooth MIDI
    moi: USB-MIDI (cổng "USB to Host")
    ly_do: "Review D8-gom: trang Kết nối đàn MIDI chỉ hướng dẫn cáp USB; Bluetooth MIDI chạy được hay không tùy hệ điều hành và trình duyệt, chưa có nguồn."
