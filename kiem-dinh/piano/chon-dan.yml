tang: tham-chieu
lan:
  - so: 1
    ngay: '2026-11-05'
    nhanh: moi/d8-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet (D8-L1 lượt 1, phần 2/2)
      luot_2: null
      review: Claude Opus 5.5 (D8-gom, không làm lượt 1, lượt 2 của trang này)
      kiem_mau: null
ghi_chu: 'Trang tham chiếu có hạn (ra_lai 2027-10). Kiểm định lượt 1 ngày 05/11/2026, mọi nguồn truy cập ngày ấy. Đã giữ những gì trang khác đã khóa dựa vào (tiêu đề "Chọn đàn và góc tập"; mục "Piano điện: danh sách kiểm tra"; mục "Chăm sóc và bảo dưỡng" id cham-soc-va-bao-duong, từ luyen-tap/hat-lai; bàn đạp vang loại liên tục dùng được nửa bàn đạp và nâng cấp ở Grade 4–5, từ piano/ban-dap; "Piano cơ: kiểm tra trước khi mua" và "Dựng góc tập" từ piano/index). Phát hiện: (1) "nghỉ 5 phút sau mỗi 25–30 phút" trái piano/suc-khoe đã khóa (20 phút tập, 10 phút nghỉ, BAPAM): đã sửa; (2) Yamaha khuyên lên dây ít nhất một lần/năm (không phải hai lần) và độ ẩm 35–55% (không phải 40–45%): đã sửa theo trang Yamaha Hub đã mở (trang Yamaha cũ chặn công cụ); (3) bỏ thông tin thị trường mau cũ (mất giá nhanh, đàn nhập từ Nhật, hàng "ba cảm biến"); (4) con số 128 cho polyphony chỉ có nguồn bậc 3 (cửa hàng đàn); hãng chưa mở được. Phần lớn là lời khuyên (khuyen-tap, không cần nguồn); lời khuyên có yếu tố sức khỏe (ghế, giờ nghỉ) xếp quy-tac. Khối quiz: 4 câu, lời giải thích không dựa vào vị trí lựa chọn. Không có khối abc. Người giao cần biết: link /opus/luyen-tap/ket-noi-midi/ và các link luyen-tap/* đều có trong bản build.'
nguon:
  - id: yamaha-weighted
    bac: 2
    ten: 'Yamaha Music Hub, A Quick Guide to Weighted Keys (nhà sản xuất): phím trầm nặng hơn phím cao; phím không trọng lượng khó chuyển sang đàn cơ (truy cập 05/11/2026)'
    link: https://hub.yamaha.com/pianos/p-digital/a-quick-guide-to-weighted-keys
  - id: yamaha-care
    bac: 2
    ten: 'Yamaha Music Hub, Five simple steps for maintaining your piano: lên dây ít nhất 1 lần/năm, đàn mới hay chơi nhiều thì 2 lần/năm hoặc hơn; độ ẩm 35–55%, lý tưởng 45%; không dùng chất tẩy có cồn lau phím; tránh luồng gió nóng lạnh trực tiếp (truy cập 05/11/2026)'
    link: https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano
  - id: yamaha-pedals
    bac: 2
    ten: 'Yamaha Music Hub, How to use keyboard pedals: bàn đạp giữa của đàn đại là sostenuto; của đàn đứng thường là bàn đạp tập (dải nỉ); bàn đạp vang rời cắm qua giắc Sustain (truy cập 05/11/2026)'
    link: https://hub.yamaha.com/keyboards/k-how-to/how-to-use-keyboard-pedals/
  - id: yamaha-howwork
    bac: 2
    ten: 'Yamaha Music Hub, How does a piano work?: cơ cấu thoát kép ở phần lớn đàn đại hiện đại, đánh lặp một nốt tới 15 lần mỗi giây; bàn đạp giữa đàn đứng là bàn đạp tập (truy cập 05/11/2026)'
    link: https://hub.yamaha.com/pianos/p-acoustic/how-does-a-piano-work/
  - id: merriam-poly
    bac: 3
    ten: 'Merriam Music (cửa hàng đàn), What is Polyphony?: bàn đạp vang giữ nốt ngân nên dùng polyphony; vượt giới hạn thì nốt cũ bị tắt; 128 đủ cho chơi piano thuần, 192–256 nếu xếp lớp âm sắc (truy cập 05/11/2026)'
    link: https://www.merriammusic.com/blog/what-is-polyphony/
  - id: pianobuyer
    bac: 2
    ten: 'Larry Fine, The Piano Book (ấn bản 4), đoạn trích trên Piano Buyer: danh sách kiểm tra đàn cũ (số seri và năm sản xuất, cao độ chuẩn, trục lên dây và pinblock, dây gỉ, bảng cộng hưởng, bộ máy, búa, bàn đạp, côn trùng ăn nỉ, thuê thợ đàn) (truy cập 05/11/2026)'
    link: https://pianobuyer.com/post/how-to-locate-the-serial-number-of-a-piano-and-checklist-for-inspecting-a-used-piano-before-buying
  - id: bapam
    bac: 2
    ten: 'BAPAM, The Healthy Pianist (Roskell và Trouli, 2016): ghế ở độ cao để cánh tay buông lỏng từ vai; chân đặt vững trên sàn hay chỗ tựa chắc; "twenty minute sessions, interspersed with ten minute breaks" (truy cập 05/11/2026)'
    link: https://www.bapam.org.uk/the-healthy-pianist/
  - id: roland-dp10
    bac: 2
    ten: 'Roland, bàn đạp DP-10: "Full and half-damper compatible"; dùng được như công tắc sustain thường (truy cập 05/11/2026)'
    link: https://www.roland.com/global/products/dp-10/
  - id: millers-hybrid
    bac: 3
    ten: 'Millers Music, Silent vs Hybrid Pianos: silent = đàn cơ có chức năng im lặng; hybrid = đàn số dùng bộ máy cơ, búa chạm cảm biến (truy cập 05/11/2026)'
    link: https://millersmusic.co.uk/blog/silent-vs-hybrid-pianos/
  - id: khoa-banphim
    bac: 2
    ten: 'Hồ sơ đã khóa piano/ban-do-ban-phim (n19, n8): đàn 88 phím từ A0 đến C8 (Open Music Theory, Britannica); La4 = 440 Hz (ISO 16)'
    link: https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/
  - id: kawai-poly
    bac: 2
    ten: 'Kawai America, FAQ "What is polyphony?" (nhà sản xuất): polyphony là số nốt tối đa phát cùng lúc; quan trọng nhất ở đoạn giữ bàn đạp vang; đàn polyphony thấp có thể bỏ nốt cũ cho nốt mới; số của từng đàn ghi trong sách hướng dẫn; 192 chỉ là ví dụ (truy cập 05/11/2026, review D8-gom)'
    link: https://kawaius.com/faq/what-is-polyphony
  - id: yamaha-acoustic-shop
    bac: 2
    ten: "Yamaha Music Hub, Pianos: What to look for when shopping for an acoustic piano: chế độ im lặng, thanh chặn búa không chạm dây, nghe tiếng đàn đại số hóa bằng tai nghe (truy cập 05/11/2026, review D8-gom)"
    link: https://hub.yamaha.com/pianos/p-acoustic/pianos-what-to-look-for-when-shopping-for-an-acoustic-piano/
  - id: yamaha-transacoustic
    bac: 2
    ten: 'Yamaha Music Hub, What is a TransAcoustic piano?: Yamaha gọi đàn cơ kèm âm thanh số là "hybrid acoustic and digital instrument"; chế độ tắt tiếng dây, nghe bằng tai nghe (truy cập 05/11/2026, review D8-gom)'
    link: https://hub.yamaha.com/pianos/p-acoustic/what-is-a-transacoustic-piano/
  - id: ptg-servicing
    bac: 2
    ten: "Piano Technicians Guild, Servicing: đặt đàn sát tường, xa cửa sổ, cửa gió nóng lạnh, lò sưởi và chỗ nắng chiếu trực tiếp; điều kiện ổn định, không quá ẩm hay khô (truy cập 05/11/2026, review D8-gom)"
    link: https://www.ptg.org/servicing
nhan_dinh:
  - id: n1
    cau: Phím quá nhẹ thì ngón tay không học được cách điều khiển sắc thái.
    loai: quy-tac
    nguon:
      - yamaha-weighted
    ket_qua: dung
    ghi_chu: 'Yamaha (Weighted Keys): "if you practice only on non-weighted keyboards, you will likely find it difficult to make the transition to acoustic piano"; phím có trọng lượng cho "touch piano teachers recommend for building proper technique". Review D8-gom: giữ chữ. Yamaha Hub (Weighted Keys, đã đọc lại): sức cản của phím "helps you gauge how hard to hit a key to get the sound you want"; "In order to develop proper piano technique … can only be accomplished with the use of weighted keys". Đủ cho câu mở đầu; lượt 2 không mở trang này.'
    luot_2: khong-chac
    luot_2_ghi_chu: Hợp lẽ thường sư phạm nhưng không có nguồn đã mở khẳng định 'phím quá nhẹ thì ngón không học được điều khiển sắc thái'. BAPAM chỉ nói khi chọn đàn mới nên cân nhắc phím nhẹ hay nặng hơn cho việc tập đều.
    review: dung
  - id: n2
    cau: Đàn lệch âm thì tai quen dần với cái sai, còn góc tập bất tiện khiến bạn ngại ngồi vào đàn.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Nhận xét chung của trang cũ, không có nguồn; giữ như lời mở đầu.
  - id: n3
    cau: 'Piano điện: không cần lên dây; tập bằng tai nghe vào ban đêm; gọn, nhẹ; kết nối được với máy tính; cảm giác phím và tiếng đàn là mô phỏng, sắc thái rất nhỏ và bàn đạp kém tinh tế hơn đàn cơ tốt; hợp với người mới bắt đầu, sống ở chung cư, cần tập muộn.'
    loai: quy-tac
    nguon:
      - yamaha-care
      - yamaha-weighted
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ thêm "mất giá nhanh" ở cột hạn chế (thông tin về giá thị trường, mau cũ, không kiểm được): bỏ. Yamaha: lên dây là việc của đàn cơ; đàn số mô phỏng cảm giác đàn cơ ("digital pianos typically have weighted keys"). "Bàn đạp kém tinh tế" khớp piano/ban-dap (đã khóa). Kết nối máy tính: USB-MIDI, khớp luyen-tap/ket-noi-midi. Review D8-gom: hai lượt khớp sau khi lượt 1 bỏ "mất giá nhanh"; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.musiciansfriend.com/thehub/digital-piano-buying-guide", "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano" ]
    luot_2_ghi_chu: "Musician's Friend: piano điện tập được bằng tai nghe, có phím búa nặng dần; Yamaha: piano cơ cần lên dây. Phần 'mô phỏng, sắc thái nhỏ và bàn đạp kém hơn đàn cơ tốt' là nhận định chung. Nội dung ý khớp."
    review: dung
  - id: n4
    cau: 'Piano cơ đứng: dây, búa và bảng cộng hưởng thật; cần lên dây định kỳ; nhạy với độ ẩm; tiếng to, khó tập đêm; nặng, chuyển nhà tốn kém; hợp với người có chỗ đặt đàn và muốn học lâu dài.'
    loai: quy-tac
    nguon:
      - yamaha-care
      - yamaha-howwork
    ket_qua: dung
    ghi_chu: 'Yamaha: lên dây ít nhất mỗi năm một lần; độ ẩm 35–55%; búa, dây thật, bảng cộng hưởng. "Phản hồi trung thực nhất về lực ngón" và "dùng được hàng chục năm nếu giữ tốt" là nhận xét chung, không có nguồn đã mở; "tiếng to, nặng" hiển nhiên.'
    luot_2: dung
    luot_2_nguon: [ "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano", "https://www.ptg.org/servicing", "https://en.wikipedia.org/wiki/Piano_pedals" ]
    luot_2_ghi_chu: "Yamaha/PTG: cần lên dây định kỳ, nhạy với độ ẩm; đàn cơ có dây và búa thật. 'Tiếng to, khó tập đêm' (nên có bàn đạp tập) hợp lý."
  - id: n5
    cau: 'Piano cơ đại: dây nằm ngang, búa rơi về nhờ trọng lượng; đánh lặp một nốt nhanh hơn đàn đứng (theo Yamaha: tới khoảng 15 lần mỗi giây, đàn đứng khoảng 7); rất đắt, cần phòng rộng.'
    loai: quy-tac
    nguon:
      - yamaha-howwork
      - yamaha-weighted
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đánh lặp nhanh hơn" (so với đàn đứng). Yamaha: cơ cấu thoát kép ở phần lớn đàn đại hiện đại, đánh lặp một nốt tới 15 lần mỗi giây; không nói đàn đứng chậm hơn bao nhiêu: chưa chắc phần so sánh. "Tốt nhất" là nhận xét; "rất đắt" mau cũ. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://en.wikipedia.org/wiki/Piano; Wikipedia: đàn đại thường cho âm tốt hơn và kiểm soát phím tốt hơn; cơ chế lặp (double escapement) có ở đàn đại; không nói ''đánh lặp nhanh hơn đàn đứng'', và ''kiểm soát bàn đạp tốt nhất'' là nhận định. Không đủ để ghi đúng cả câu.. Review D8-gom: bỏ "kiểm soát tiếng và bàn đạp tốt nhất" (nhận xét, không nguồn). Yamaha Hub (Weighted Keys): "Because the strings are mounted horizontally in grand pianos, the hammers return … under their own weight"; "roughly 15 times per second in grands, versus seven times per second in uprights". Chữ cũ: "Bộ máy nằm ngang đánh lặp nhanh hơn; kiểm soát tiếng và bàn đạp tốt nhất".'
    review: dung
    luot_2: sai
    luot_2_nguon: [ "https://www.yamaha.com/en/musical_instrument_guide/piano/selection/", "https://kawaius.com/faq/what-is-the-difference-between-a-grand-piano-and-an-upright-piano" ]
    luot_2_ghi_chu: "câu đúng: Piano cơ đại: dây nằm ngang, búa rơi về nhờ trọng lượng; đánh lặp một nốt nhanh hơn đàn đứng (theo Yamaha: tới khoảng 14 lần mỗi giây, đàn đứng khoảng 7); rất đắt, cần phòng rộng.; Yamaha: 'Because the hammers return to their rest position under their own weight … key repetition as fast as about 14 times per second is possible'; đàn đứng 'about seven times per second'. Câu ghi 15. Bản Yamaha Thái Lan cùng chữ (14). Kawai: đàn đứng gọn hơn; Yamaha: đàn đứng dựng dây đứng 'to be played in a limited space'. 'Rất đắt' không kiểm ở trang hãng."
  - id: n6
    cau: 'Đàn lai (hybrid) và đàn cơ có hệ thống tắt tiếng: bộ máy phím cơ (hoặc rất gần đàn cơ) kèm âm thanh số; tập được bằng tai nghe; đàn cơ có hệ thống tắt tiếng vẫn là đàn cơ: vẫn cần lên dây và giữ độ ẩm.'
    loai: quy-tac
    nguon:
      - millers-hybrid
      - yamaha-acoustic-shop
      - yamaha-transacoustic
    ket_qua: da-sua
    ghi_chu: 'Millers Music: silent piano là đàn cơ có chế độ im lặng (búa không chạm dây, cảm biến gửi sang bộ âm thanh); hybrid là đàn số dùng bộ máy cơ, búa chạm cảm biến; cả hai tập được bằng tai nghe. "Giá cao" là so sánh chung với piano điện thường (nguồn bậc 3 không bàn giá). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://en.wikipedia.org/wiki/Digital_piano; Wikipedia Digital piano: đàn lai (hybrid) có bộ máy cơ thật và mẫu âm số chất lượng cao. Không tìm được nguồn về đàn cơ có hệ thống tắt tiếng (silent) và ''giá cao''.. Review D8-gom: bỏ "Giá cao" (không nguồn), thay bằng điều suy ra từ nguồn: Yamaha Hub (What to look for when shopping for an acoustic piano): ở chế độ im lặng "a bar inside the piano that prevents the hammers from hitting the strings is automatically moved into place", nghe bằng tai nghe tiếng đàn đại số hóa: đây là cây đàn cơ thật, nên vẫn cần lên dây, giữ độ ẩm như mọi đàn cơ (yamaha-care). Yamaha Hub (TransAcoustic) gọi loại đàn cơ kèm âm thanh số là "hybrid". Chữ cũ: "Giá cao".'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://kawaius.com/faq/what-is-a-hybrid-piano", "https://usa.yamaha.com/products/musical_instruments/pianos/silent_piano/index.html", "https://kawaius.com/faq/do-kawai-pianos-require-tuning-and-maintenance", "https://kawaius.com/faq/where-should-i-place-my-piano-in-my-home" ]
    luot_2_ghi_chu: "Kawai: hybrid 'combines a real acoustic piano action with digital electronics', hợp nơi cần giới hạn âm lượng. Yamaha: 'Simply switch your Yamaha acoustic piano into SILENT mode' và nghe qua tai nghe, tức vẫn là đàn cơ. Kawai: đàn cơ cần lên dây đều; đàn nhạy với độ ẩm. Không tìm được trang hãng nói thẳng 'đàn silent cần lên dây', suy ra từ việc nó là đàn cơ."
  - id: n7
    cau: Với người lớn mới học, một cây piano điện tốt là khởi đầu hoàn toàn hợp lý; thỉnh thoảng chơi đàn cơ để tay và tai biết chuẩn.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên.
  - id: n8
    cau: Site gợi ý tính chuyện nâng cấp lên đàn cơ khi đến khoảng Grade 4–5, lúc các bài bắt đầu đòi hỏi sắc thái và bàn đạp tinh tế (link Bàn đạp, Tạo tiếng đàn).
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Giữ đúng "nâng cấp ở Grade 4–5" mà piano/ban-dap (đã khóa) dựa vào (kiem-dinh/piano/ban-dap.yml); chặng 4 = Grade 4–5 theo src/data/cap-do.yml. Hai trang đích piano/ban-dap, piano/tieng-dan có ở src/content/docs/piano/. Review D8-gom: soát nhãn: "Nhiều người nâng cấp lên đàn cơ khi …" là điều về người học ngoài site, cần nguồn, không phải ve-site; không có nguồn. Viết thành lời khuyên của site, giữ "nâng cấp ở Grade 4–5" mà piano/ban-dap (đã khóa) và bat-dau/hoi-dap dựa vào; đổi loại sang khuyen-tap. Hai trang đích có ở src/content/docs/piano/ (ban-dap, tieng-dan); chặng 4 = Grade 4–5 (src/data/cap-do.yml). Chữ cũ: "Nhiều người nâng cấp lên đàn cơ khi đến khoảng Grade 4–5".'
    review: sai
  - id: n9
    cau: 'Piano điện, danh sách kiểm tra: 88 phím, từ La0 (A0) đến Đô8 (C8); đàn 61 hay 76 phím buộc bạn bỏ bớt nốt hoặc dời quãng tám.'
    loai: dinh-nghia
    nguon:
      - khoa-banphim
    ket_qua: dung
    ghi_chu: 'Đàn 88 phím A0–C8: đã kiểm ở piano/ban-do-ban-phim (đã khóa, n8, n19). Vế "buộc bỏ bớt nốt hay dời quãng tám" là hệ quả hiển nhiên khi tác phẩm dùng cả bàn phím.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Piano" ]
    luot_2_ghi_chu: "Wikipedia Piano: piano hiện đại có 88 phím từ A0 tới C8. Phần 'đàn 61/76 phím buộc bỏ bớt nốt hay dời quãng tám' là hệ quả hiển nhiên."
  - id: n10
    cau: 'Bộ máy phím: phím búa nặng dần (graded hammer action): phím trầm nặng hơn phím cao, giống đàn cơ; phím nhẹ hay bán nặng không dạy được kỹ thuật điều khiển tốc độ phím.'
    loai: quy-tac
    nguon:
      - yamaha-weighted
    ket_qua: dung
    ghi_chu: 'Yamaha: "the lower keys heavier than the higher ones"; "Graded Hammer actions offer the graded, weighted touch piano teachers recommend for building proper technique"; bàn phím không trọng lượng khó chuyển sang đàn cơ. "Không dạy được" mạnh hơn nguồn một chút ("difficult to transition"). Review D8-gom: giữ. Yamaha Hub (Weighted Keys, đã đọc lại): bán nặng (semi-weighted) là "spring-action keys", không phải phím có trọng lượng; "In order to develop proper piano technique, players need to feel that they are pushing against a key … In a digital instrument, this can only be accomplished with the use of weighted keys". Khớp "không dạy được".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.musiciansfriend.com/thehub/digital-piano-buying-guide", "https://en.wikipedia.org/wiki/Digital_piano" ]
    luot_2_ghi_chu: Khớp phần định nghĩa phím búa nặng dần (phím trầm nặng hơn phím cao). Không có nguồn cho 'phím nhẹ hay bán nặng không dạy được kỹ thuật điều khiển tốc độ phím' (BAPAM chỉ nói cân nhắc phím nhẹ/nặng theo người tập).
    review: dung
  - id: n11
    cau: 'Âm thanh: lấy mẫu (sampling) hoặc mô hình hóa từ đàn đại; nghe kỹ tiếng trầm, cách nốt tắt dần, và khi chơi thật nhỏ.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên khi thử đàn; mô tả "lấy mẫu hoặc mô hình hóa" là cách làm phổ biến (không số liệu).
    luot_2: dung
    luot_2_ghi_chu: "Lời khuyên hợp lý: nghe tiếng trầm, độ tắt dần, nốt nhỏ khi thử đàn."
  - id: n12
    cau: 'Số nốt phát đồng thời (polyphony): nên cao, nhất là khi hay dùng bàn đạp vang; con số ghi trong sách hướng dẫn của từng đàn; nốt được bàn đạp vang giữ ngân vẫn tính vào polyphony; đàn có polyphony thấp có thể tắt nốt cũ để nhường chỗ cho nốt mới.'
    loai: quy-tac
    nguon:
      - kawai-poly
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bàn đạp vang và mô phỏng cộng hưởng dây \"ăn\" polyphony rất nhanh". Bỏ "mô phỏng cộng hưởng dây" (không kiểm được ở nguồn đã mở). Merriam Music (bậc 3, cửa hàng): bàn đạp vang làm nốt chồng lên, mỗi nốt cần một giọng; vượt giới hạn thì tắt nốt cũ nhất không còn bị giữ; 128 đủ cho chơi piano thuần. Nguồn hãng (Yamaha, Roland) về polyphony chưa mở: chưa chắc con số 128 là ngưỡng nên dùng; hồ sơ piano/ban-dap đã ghi "chưa có nguồn bậc 1–2". Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://www.musiciansfriend.com/thehub/digital-piano-buying-guide, https://en.wikipedia.org/wiki/Digital_piano; Musician''s Friend: tối thiểu 32 nốt, 64 là đủ cho âm phức tạp, đàn cao cấp tới 128, 256; Wikipedia: đàn thập niên 1990 hay giới hạn 32–64. Con số ''128 trở lên'' không có nguồn chung xác nhận là ngưỡng khuyến nghị; hiện tượng nốt cũ bị cắt khi đa bàn đạp thì hợp lý.. Review D8-gom: bỏ con số "128 trở lên": không hãng nào đã mở nêu ngưỡng (Kawai chỉ lấy 192 làm ví dụ; Musician''s Friend của lượt 2 nêu 64–256), nguồn duy nhất là cửa hàng (bậc 3). Viết theo Kawai (FAQ What is polyphony?, bậc 2): polyphony là số nốt tối đa phát cùng lúc; quan trọng nhất ở đoạn giữ bàn đạp vang; đàn polyphony thấp có thể bỏ nốt cũ cho nốt mới; số của từng đàn ghi trong sách hướng dẫn. Chữ cũ: "128 trở lên" và "Bàn đạp vang giữ nhiều nốt ngân cùng lúc nên ăn polyphony rất nhanh; thiếu thì nốt cũ bị cắt đột ngột ở đoạn nhiều bàn đạp".'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://kawaius.com/faq/what-is-polyphony" ]
    luot_2_ghi_chu: "Kawai: polyphony là 'maximum number of individual notes your piano can produce simultaneously'; quan trọng 'when the damper pedal is held and notes are accumulating — as a piano with low polyphony may drop older notes to accommodate new ones'; 'Check your piano's owner's manual for its specific polyphony rating'."
  - id: n13
    cau: 'Bàn đạp vang: loại liên tục (cho phép nửa bàn đạp); nếu được, site khuyên chọn bộ ba bàn đạp gắn vào chân đàn; bàn đạp dạng công tắc chỉ có bật và tắt, không cho nửa bàn đạp.'
    loai: quy-tac
    nguon:
      - roland-dp10
      - yamaha-pedals
    ket_qua: da-sua
    ghi_chu: 'Giữ "liên tục (cho phép nửa bàn đạp)" để piano/ban-dap (đã khóa) còn đúng. Roland DP-10: "full and half-damper compatible" và dùng được như công tắc thường; Yamaha: bàn đạp rời cắm qua giắc Sustain. "Bộ ba gắn chân đàn là tốt nhất" và "bàn đạp rời hay trượt" là lời khuyên. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://en.wikipedia.org/wiki/Piano_pedals; Wikipedia Piano pedals: bàn đạp vang cho phép nửa bàn đạp ở một số đàn điện; nhiều đàn điện chỉ có công tắc bật tắt; có thể cắm ba bàn đạp như đàn đại. ''Tốt nhất là bộ ba gắn chân đàn'' và ''bàn đạp rời trượt trên sàn'' là nhận định chưa có nguồn.. Review D8-gom: bỏ "bàn đạp rời nhỏ hay trượt trên sàn" (không nguồn); "bộ ba bàn đạp gắn chân đàn" viết rõ là lời khuyên của site. Phần sự kiện: Roland DP-10 ("Full and half-damper compatible", dùng được như công tắc thường); khớp piano/ban-dap (đã khóa): bàn đạp công tắc bật – tắt, bàn đạp dùng được nửa bàn đạp. Chữ cũ: "tốt nhất là bộ ba bàn đạp gắn vào chân đàn" và "bàn đạp rời nhỏ hay trượt trên sàn".'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://kawaius.com/faq/which-damper-pedals-are-compatible-with-my-kawai-digital-piano", "https://www.pianobuyer.com/post/what-can-i-buy-for-1995" ]
    luot_2_ghi_chu: "Kawai: bàn đạp chính hãng cho 'continuous control (half-pedalling)'; bàn đạp chung loại 'may work for basic on/off damper control, but may not support … continuous pedalling'. Piano Buyer: các đàn console đều có ba bàn đạp, half-pedaling ở bàn đạp vang. Vế 'site khuyên' là lời khuyên của site."
  - id: n14
    cau: 'Tai nghe: hai cổng tai nghe; tai nghe chụp tai kín, chất lượng tốt; để tập đêm, và thầy trò cùng nghe.'
    loai: khuyen-tap
