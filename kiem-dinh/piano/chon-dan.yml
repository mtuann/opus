    ghi_chu: 'luyen-tap/ket-noi-midi (có ở src/content/docs/luyen-tap/): nối đàn bằng cáp USB (cổng "USB to Host" trên đàn điện) hoặc bộ chuyển MIDI–USB. Bluetooth MIDI: src/scripts/midi.js dùng Web MIDI (nhận cả thiết bị Bluetooth khi trình duyệt cho phép); chưa có nguồn riêng cho Bluetooth, hạng mục phụ. Review D8-gom: trang luyen-tap/ket-noi-midi (có ở src/content/docs/) chỉ hướng dẫn cáp USB ("USB to Host") hay bộ chuyển MIDI–USB, không nói Bluetooth; Bluetooth MIDI chạy với Web MIDI hay không tùy hệ điều hành và trình duyệt (điều cần nguồn ngoài). Bỏ "hoặc Bluetooth MIDI". Chữ cũ: "USB-MIDI (cổng \"USB to Host\") hoặc Bluetooth MIDI".'
    review: sai
  - id: n16
    cau: 'Chân đàn và ghế: chân chắc, không rung; ghế chỉnh được độ cao; ghế chỉnh được thì đặt được độ cao hợp với người ngồi; cách ngồi xem Tư thế, thế tay và cách dùng lực.'
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: ghế ở độ cao để cánh tay buông lỏng từ vai. "Ghế chữ X thường lung lay" là nhận xét chung. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf; BAPAM: ghế cao sao cho tay rũ lỏng không căng khuỷu, vai, cổ tay; chân đặt vững. ''Ghế chữ X thường lung lay'' không có nguồn.. Review D8-gom: bỏ "Ghế chữ X của đàn organ thường lung lay và không đúng độ cao" (không nguồn). Giữ ghế chỉnh được độ cao theo BAPAM (ghế ở độ cao để cánh tay buông lỏng từ vai) và link piano/tu-the (đã có ở src/content/docs/piano/tu-the.md).'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.pianobuyer.com/post/what-can-i-buy-for-1995" ]
    luot_2_ghi_chu: "Piano Buyer: chân đàn chữ X đôi vững nhất, tránh chữ X đơn vì 'tend to wiggle during playing'. Ghế chỉnh được độ cao là lời khuyên phổ biến, không có trang hãng nói thẳng; câu không có điều có hại."
  - id: n17
