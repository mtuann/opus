  - id: n19
    cau: 'Năm phép thử khi đi chọn đàn điện: mang tai nghe của bạn; chơi một nốt thật nhỏ rồi thật to; đánh lặp nhanh một nốt và một hợp âm; giữ bàn đạp vang rồi chơi hợp âm rải dài từ trầm lên cao, xem có nốt nào bị cắt không; thử nửa bàn đạp, tiếng ngân phải tăng dần.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên thực hành; phép thử bàn đạp khớp ý polyphony và nửa bàn đạp ở trên.
  - id: n20
    cau: 'Piano cơ cũ: luôn nhờ một thợ đàn độc lập (không phải người của bên bán) đi cùng; phí kiểm tra rẻ hơn rất nhiều so với một cây đàn hỏng.'
    loai: khuyen-tap
    nguon:
      - pianobuyer
    ket_qua: dung
    ghi_chu: 'The Piano Book (Piano Buyer): khuyên thuê thợ đàn có chuyên môn khi danh sách kiểm tra quá nhiều; không nói "độc lập" hay so sánh chi phí; vế này là lời khuyên.'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý, khớp khuyến nghị PTG nhờ chuyên viên khi mua đàn cũ.
  - id: n21
    cau: 'Bảng kiểm tra đàn cơ: trục lên dây và thớt giữ trục (pin block): trục lỏng, đàn xuống dây nhanh; cao độ hiện tại so với chuẩn La4 = 440 Hz, đàn để quá lâu không lên dây thì khó đưa về trạng thái tốt; bảng cộng hưởng và các sườn gỗ nứt, bong; búa mòn, rãnh sâu; bộ máy: phím đều, không kẹt, bộ giảm âm tắt gọn; dây và khung gỉ, nứt; phím và bàn đạp; bên trong thùng đàn có côn trùng làm hỏng nỉ (búa, bộ giảm âm và các phần nỉ khác).'
    loai: quy-tac
    nguon:
      - pianobuyer
      - khoa-banphim
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ ở dòng cuối: "Mối mọt, nấm mốc, côn trùng làm tổ" → "Côn trùng làm hỏng nỉ, mối mọt" (The Piano Book: moth damage to felt; nấm mốc không có trong nguồn). The Piano Book có: pinblock, trục lỏng, cao độ "standard pitch", dây gỉ, bảng cộng hưởng và sườn, búa mòn, bộ máy, giảm âm, bàn đạp. La4 = 440 Hz: ISO 16 (hồ sơ ban-do-ban-phim, đã khóa). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://www.ptg.org/servicing; PTG khuyên nhờ chuyên viên khi mua đàn cũ, nhưng không có danh sách kiểm tra (trục lên dây, bảng cộng hưởng, búa, bộ máy, mối mọt). Chuẩn La4 = 440 Hz là đúng chung. Các mục kiểm đều hợp lý nhưng chưa có nguồn đã mở.. Review D8-gom: đã đọc trang Piano Buyer (trích The Piano Book): "loose tuning pins", "Is the piano up to standard pitch?", "excessive soundboard cracking", sườn "still firmly glued", búa "depth of grooves", "sticking or sluggish keys", "repetition", dampers, "excessive rust" trên dây, "cracks in the plate", phím và bàn đạp, "moth damage" ở búa, damper và các phần nỉ. Sửa hai ô: bỏ "mối mọt" (nguồn chỉ nói côn trùng ăn nỉ); "phải kéo dây nhiều lần mới ổn định" thay bằng ý của Yamaha Hub (Five simple steps): để quá lâu thì "hard to bring it back to perfect condition … more time spent by the technician". Chữ cũ: "Côn trùng làm hỏng nỉ, mối mọt"; "Đàn lâu không lên dây có thể phải kéo dây nhiều lần mới ổn định".'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.pianobuyer.com/post/how-to-locate-the-serial-number-of-a-piano-and-checklist-for-inspecting-a-used-piano-before-buying", "https://www.prnewswire.com/news-releases/piano-technicians-guild-offers-tips-for-avoiding-the-expense-of-the-free-piano-227073101.html", "https://kawaius.com/faq/what-is-pitch-raising", "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano" ]
    luot_2_ghi_chu: "Piano Buyer (trích The Piano Book): trục lên dây và thớt (vết keo làm chặt trục, thớt nứt), 'Is the piano up to standard pitch?', bảng cộng hưởng và sườn ('Soundboard and ribs', nứt, sườn bong), búa ('depth of grooves'), bộ giảm âm tắt gọn, phím kẹt, dây gỉ, bàn đạp, 'hammers, dampers, and other felt parts for moth damage'. PTG (thông cáo 2013): thớt hỏng thì trục trượt, đàn không giữ dây; rãnh sâu trên búa. Kawai: đàn lâu không lên dây tụt dưới A440, cần pitch raise. Yamaha: để quá lâu thì khó đưa về trạng thái tốt."
  - id: n22
    cau: Từ số seri, có thể tra năm sản xuất trong sách tra cứu như Pierce Piano Atlas; không tra được thì thợ đôi khi ước đoán được.
    loai: quy-tac
    nguon:
      - pianobuyer
    ket_qua: da-sua
    ghi_chu: 'The Piano Book: tìm số seri (4–8 chữ số) rồi tra năm trong Pierce Piano Atlas. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac; Việc tra năm sản xuất từ số seri bằng sách tra cứu (như Pierce Piano Atlas) là thông tin chung đúng, nhưng chưa mở được nguồn nào xác nhận ''thợ thường tra được, hãng lớn''.. Review D8-gom: Piano Buyer (The Piano Book): "look up its year of manufacture in the Pierce Piano Atlas"; không có số seri hay năm không có trong sách thì "sometimes a technician can estimate". Chữ cũ: "Thợ thường tra được năm sản xuất từ số seri của các hãng lớn" (nguồn không nói "thợ thường", "hãng lớn").'
    review: dung
