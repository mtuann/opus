    luot_2_nguon: [ "https://www.pianobuyer.com/post/how-to-locate-the-serial-number-of-a-piano-and-checklist-for-inspecting-a-used-piano-before-buying" ]
    luot_2_ghi_chu: "Piano Buyer: 'Find the serial number of the piano so you can look up its year of manufacture in the Pierce Piano Atlas … When no serial number can be found or if the year of manufacture isn't listed in Pierce, sometimes a technician can estimate.'"
  - id: n23
    cau: 'Đàn cơ đứng đã qua sử dụng: chất lượng từng cây phụ thuộc vào tuổi đời, cách bảo quản và mức độ tân trang; tên hãng không bảo đảm tình trạng một cây cụ thể; hãy chơi thử thật lâu, nghe ý kiến của thợ, và đừng quyết định vì lớp sơn bóng đẹp.'
    loai: khuyen-tap
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ mở đầu bằng "Ở Việt Nam, đàn cơ đứng đã qua sử dụng nhập từ Nhật khá phổ biến" (thông tin thị trường mau cũ, không kiểm được): bỏ; phần còn lại là lời khuyên.'
  - id: n24
    cau: 'Bàn đạp giữa: trên đàn đại thường là bàn đạp sostenuto (chỉ giữ ngân những nốt đang bấm); trên đàn đứng thường là bàn đạp tập, hạ một dải nỉ xuống để giảm tiếng.'
    loai: quy-tac
    nguon:
      - yamaha-pedals
      - yamaha-howwork
    ket_qua: dung
    ghi_chu: 'Yamaha (hai trang): đúng như vậy; một số đàn đại có bass sustain, một số đàn đứng (Yamaha YUS5) có sostenuto thật: "thường" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Piano_pedals" ]
    luot_2_ghi_chu: "Wikipedia Piano pedals: ở đàn đại bàn đạp giữa thường là sostenuto (chỉ giữ ngân nốt đang nhấn khi đạp); ở đàn đứng thường là bàn đạp tập hạ dải nỉ giữa búa và dây để giảm tiếng (không phải đàn nào cũng có)."
  - id: n25
    cau: 'Thứ tự ưu tiên khi chọn: bộ máy phím, âm thanh, độ bền và dịch vụ (bảo hành, thợ sửa gần nhà, linh kiện), tính năng phụ; đừng mua đàn rẻ nhất, cũng không cần mua đàn đắt nhất: một cây tầm trung được cân chỉnh tốt đủ cho nhiều năm đầu.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên.
  - id: n26
    cau: 'Nếu ngân sách eo hẹp: thuê đàn theo tháng trong vài tháng đầu; mua piano điện đã qua sử dụng có 88 phím búa nặng dần, kiểm tra từng phím và bàn đạp; tập thêm trên đàn cơ ở trung tâm hay trường âm nhạc; nếu tạm thời chỉ có đàn phím nhẹ, coi đó là giải pháp ngắn hạn: thói quen dùng lực hình thành trên phím nhẹ khiến việc chuyển sang đàn cơ khó hơn.'
    loai: quy-tac
    nguon:
      - yamaha-weighted
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thói quen dùng lực hình thành trên phím nhẹ rất khó sửa về sau". Yamaha: tập trên phím không trọng lượng thì khó chuyển sang đàn cơ; đổi theo nguồn. Các ý còn lại là lời khuyên. Review D8-gom: giữ. Yamaha Hub (Weighted Keys): "if you learn or practice exclusively on non-weighted keyboards, you will likely find it difficult to make the transition to acoustic piano": khớp vế cuối; các vế khác là lời khuyên (thuê đàn, mua đàn cũ, tập thêm ở trung tâm).'
    luot_2: khong-chac
    luot_2_ghi_chu: Các gợi ý thuê đàn, mua piano điện cũ có 88 phím búa nặng dần, tập thêm ở trung tâm hợp lý, nhưng khẳng định 'thói quen dùng lực hình thành trên phím nhẹ khiến chuyển sang đàn cơ khó hơn' không có nguồn đã mở.
    review: dung
  - id: n27
    cau: 'Góc tập: nơi bạn đi qua hằng ngày, nắp phím mở, bản nhạc đặt sẵn; ghế chỉnh được độ cao, người thấp cần bục kê chân; ánh sáng chiếu đều lên giá nhạc, không để bóng tay đổ lên phím; bút chì, tẩy, sổ tập hoặc nhật ký luyện tập; điện thoại hay máy tính bảng mở sẵn site; giá đỡ quay video; giờ tập yên tĩnh, thỏa thuận với hàng xóm, thảm dưới đàn giảm tiếng truyền qua sàn.'
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: dung
    ghi_chu: "Lời khuyên thực hành. Phần tư thế (ghế chỉnh được độ cao, chân đặt vững trên sàn hay chỗ tựa chắc) khớp BAPAM và piano/tu-the (đã khóa). Link piano/tu-the, luyen-tap/nhat-ky, metronome, thu-am, choi-theo, doc-not có ở src/content/docs/. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): undefined. Review D8-gom: soát nhãn: câu có phần tư thế (ghế chỉnh được độ cao, người thấp cần bục kê chân) là điều về sức khỏe, nên không xếp khuyen-tap; đổi sang quy-tac (nguồn BAPAM: chân đặt vững trên sàn hay chỗ tựa chắc), đưa vào lượt 2 bổ sung."
    review: dung
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu gần như toàn lời khuyên bố trí góc tập (hợp lý, không có hại). Vế cần nguồn ngoài, 'thảm dưới đàn giảm tiếng truyền qua sàn', chỉ thấy ở diễn đàn và trang bán hàng (thảm có đệm giảm rung truyền xuống sàn, hiệu quả hạn chế), không có nguồn bậc 2. Gợi ý: đổi nhãn sang khuyen-tap, hay viết 'thảm dày có thể giảm phần nào tiếng truyền qua sàn'."
  - id: n28
    cau: Đồng hồ hẹn giờ nhắc nghỉ 10 phút sau mỗi 20 phút tập (theo BAPAM; xem Giữ đôi tay khỏe).
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhắc nghỉ 5 phút sau mỗi 25–30 phút tập". Lời khuyên sức khỏe nên cần nguồn: BAPAM "twenty minute sessions, interspersed with ten minute breaks", và piano/suc-khoe (đã khóa) ghi "Tập khoảng 20 phút rồi nghỉ 10 phút (theo BAPAM)": trang cũ trái trang lõi; đã sửa. Review D8-gom: hai lượt khớp BAPAM và piano/suc-khoe (đã khóa).'
    luot_2: dung
    luot_2_nguon: [ "https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf" ]
    luot_2_ghi_chu: "BAPAM (The Healthy Pianist): tập từng đợt 20 phút xen nghỉ 10 phút để tay hồi phục. Khớp."
    review: dung
  - id: n29
    cau: 'Lên dây: Yamaha khuyên lên dây ít nhất một lần một năm, đàn mới hay đàn chơi nhiều thì hai lần một năm hoặc hơn; đàn để quá lâu không lên dây thì khó đưa về trạng thái tốt, thợ tốn nhiều công hơn.'
    loai: quy-tac
    nguon:
      - yamaha-care
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Yamaha khuyên tối thiểu hai lần một năm". Yamaha: "at least once a year… brand new should be tuned twice a year or more". Hai vế sau (vài tuần để quen phòng; kéo dây nhiều lần) là kinh nghiệm của thợ, nguồn Yamaha không nói (khuyen-tap). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano, https://www.ptg.org/servicing; Yamaha: lên dây ít nhất 1 lần một năm; đàn mới hay đàn chơi nhiều thì 2 lần hay hơn (khớp). Yamaha không nói gì về ''vài tuần ổn định sau chuyển nhà rồi mới lên dây'' hay ''đàn bỏ lâu phải kéo dây nhiều lần'' (PTG chỉ nói đàn đổi chỗ sẽ cần lên dây sớm hơn); câu quy cho Yamaha cả phần ấy nên chưa ghi đúng.. Review D8-gom: lượt 2 đúng: hai câu sau không có ở Yamaha. Bỏ "Đàn mới chuyển về cần vài tuần để quen với phòng rồi mới lên dây" (không nguồn); "Đàn bỏ lâu ngày có thể phải kéo dây nhiều lần" thay bằng chữ của Yamaha: "if you let it go for too long, it can be hard to bring it back to perfect condition … more time spent by the technician". Chữ cũ: "Đàn mới chuyển về cần vài tuần để quen với phòng rồi mới lên dây. Đàn bỏ lâu ngày có thể phải kéo dây nhiều lần."'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano", "https://www.yamaha.com/en/musical_instrument_guide/piano/maintenance/maintenance002.html" ]
    luot_2_ghi_chu: "Yamaha hub: 'you should have your piano tuned at least once a year, though instruments that are played often or are brand new should be tuned twice a year or more'; 'if you let it go for too long, it can be hard to bring it back to perfect condition … more time spent by the technician and more cost for you'."
  - id: n30
    cau: 'Độ ẩm: Yamaha khuyên độ ẩm tương đối trong khoảng 35–55%, lý tưởng là 45%; ở Việt Nam giữ độ ẩm trong khoảng ấy quanh năm không dễ, nên tránh ẩm cao kéo dài và thay đổi đột ngột; đặt ẩm kế, máy hút ẩm, đóng cửa sổ khi mưa; không đặt đàn sát cửa sổ, dưới nắng chiếu trực tiếp, ngay dưới luồng gió điều hòa hay cạnh bếp, phòng tắm; điều hòa chạy liên tục cũng có thể làm phòng quá khô; hỏi thợ về hệ thống kiểm soát độ ẩm lắp bên trong đàn.'
    loai: quy-tac
    nguon:
      - yamaha-care
      - ptg-servicing
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Yamaha khuyên độ ẩm tương đối khoảng 40–45%"; Yamaha Hub: "35-55% humidity, with 45% being optimal". Cũng Yamaha: "staying away from direct vents/radiators… warm or cool air". Các ý khác (nắng, bếp, phòng tắm, điều hòa làm khô, hệ thống kiểm soát độ ẩm) là kinh nghiệm chung, nguồn Yamaha đã mở không nhắc nắng trực tiếp (chưa chắc). Review D8-gom: giữ. Yamaha Hub: 35–55%, tối ưu 45%, ẩm kế, máy hút ẩm, tránh luồng gió nóng lạnh; trang dịch vụ của PTG (đã đọc): "away from windows or doors", "Avoid heating and air conditioning vents, fireplaces and areas which receive direct sunlight", điều kiện ổn định "neither too wet nor dry". Các ý về Việt Nam là lời khuyên.'
    luot_2: dung
    luot_2_nguon: [ "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano", "https://www.ptg.org/servicing" ]
    luot_2_ghi_chu: "Yamaha: độ ẩm 35–55%, tối ưu 45%; nên dùng ẩm kế, máy hút ẩm; tránh để đàn gần cửa gió, lò sưởi. PTG: tránh cửa sổ, nắng trực tiếp, cửa thông gió. Các nhận xét riêng về Việt Nam (ẩm cao, máy lạnh làm khô) là lời khuyên hợp lý."
    review: dung
  - id: n31
    cau: Đóng nắp phím sau khi tập để tránh bụi và ẩm; lau phím bằng khăn mềm, khô; theo Yamaha không dùng chất tẩy có cồn vì có thể làm phím đổi màu hay nứt; vết bẩn nặng thì dùng khăn mềm thấm nước pha ít nước rửa chén vắt thật kiệt, rồi lau lại bằng khăn hơi ẩm khác; không dùng khăn đó lau thân đàn.
    loai: quy-tac
    nguon:
      - yamaha-care
