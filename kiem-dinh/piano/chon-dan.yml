  - Đánh lặp nhanh một nốt chính xác hơn
  moi: null
  ly_do: 'Hàng bảng piano điện về ba cảm biến mỗi phím: thông tin kỹ thuật theo hãng, không có nguồn đã mở.'
- cu: Bàn đạp vang và mô phỏng cộng hưởng dây "ăn" polyphony rất nhanh; thiếu thì nốt cũ bị cắt đột ngột ở đoạn nhiều bàn đạp
  moi: Bàn đạp vang giữ nhiều nốt ngân cùng lúc nên "ăn" polyphony rất nhanh; thiếu thì nốt cũ bị cắt đột ngột ở đoạn nhiều bàn đạp
  ly_do: Bỏ "mô phỏng cộng hưởng dây" (không có trong nguồn đã mở).
- cu: Mối mọt, nấm mốc, côn trùng làm tổ
