lan:
- so: 1
  ngay: '2026-11-05'
  nhanh: moi/d8-l1
  ma_bam: null
  nguoi:
    luot_1: Claude Sonnet (D8-L1 lượt 1, phần 2/2)
    luot_2: null
    review: null
    kiem_mau: null
ghi_chu: 'Trang tham chiếu có hạn (ra_lai 2027-10). Kiểm định lượt 1 ngày 05/11/2026, mọi nguồn truy cập ngày ấy. Đã giữ những gì trang khác đã khóa dựa vào (tiêu đề "Chọn đàn và góc tập"; mục "Piano điện: danh sách kiểm tra"; mục "Chăm sóc và bảo dưỡng" id cham-soc-va-bao-duong, từ luyen-tap/hat-lai; bàn đạp vang loại liên tục dùng được nửa bàn đạp và nâng cấp ở Grade 4–5, từ piano/ban-dap; "Piano cơ: kiểm tra trước khi mua" và "Dựng góc tập" từ piano/index). Phát hiện: (1) "nghỉ 5 phút sau mỗi 25–30 phút" trái piano/suc-khoe đã khóa (20 phút tập, 10 phút nghỉ, BAPAM): đã sửa; (2) Yamaha khuyên lên dây ít nhất một lần/năm (không phải hai lần) và độ ẩm 35–55% (không phải 40–45%): đã sửa theo trang Yamaha Hub đã mở (trang Yamaha cũ chặn công cụ); (3) bỏ thông tin thị trường mau cũ (mất giá nhanh, đàn nhập từ Nhật, hàng "ba cảm biến"); (4) con số 128 cho polyphony chỉ có nguồn bậc 3 (cửa hàng đàn); hãng chưa mở được. Phần lớn là lời khuyên (khuyen-tap, không cần nguồn); lời khuyên có yếu tố
  sức khỏe (ghế, giờ nghỉ) xếp quy-tac. Khối quiz: 4 câu, lời giải thích không dựa vào vị trí lựa chọn. Không có khối abc. Người giao cần biết: link /opus/luyen-tap/ket-noi-midi/ và các link luyen-tap/* đều có trong bản build.'
nguon:
- id: yamaha-weighted
  bac: 2
  ten: 'Yamaha Music Hub, A Quick Guide to Weighted Keys (nhà sản xuất): phím trầm nặng hơn phím cao; phím không trọng lượng khó chuyển sang đàn cơ (truy cập 05/11/2026)'
  link: https://hub.yamaha.com/pianos/p-digital/a-quick-guide-to-weighted-keys
- id: yamaha-care
  bac: 2
  ten: 'Yamaha Music Hub, Five simple steps for maintaining your piano: lên dây ít nhất 1 lần/năm, đàn mới hay chơi nhiều thì 2 lần/năm hoặc hơn; độ ẩm 35–55%, lý tưởng 45%; không dùng chất tẩy có cồn lau phím; tránh luồng gió nóng lạnh trực tiếp (truy cập 05/11/2026)'
  link: https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano
- id: yamaha-pedals
  bac: 2
  ten: 'Yamaha Music Hub, How to use keyboard pedals: bàn đạp giữa của đàn đại là sostenuto; của đàn đứng thường là bàn đạp tập (dải nỉ); bàn đạp vang rời cắm qua giắc Sustain (truy cập 05/11/2026)'
  link: https://hub.yamaha.com/keyboards/k-how-to/how-to-use-keyboard-pedals/
- id: yamaha-howwork
  bac: 2
  ten: 'Yamaha Music Hub, How does a piano work?: cơ cấu thoát kép ở phần lớn đàn đại hiện đại, đánh lặp một nốt tới 15 lần mỗi giây; bàn đạp giữa đàn đứng là bàn đạp tập (truy cập 05/11/2026)'
  link: https://hub.yamaha.com/pianos/p-acoustic/how-does-a-piano-work/
- id: merriam-poly
  bac: 3
  ten: 'Merriam Music (cửa hàng đàn), What is Polyphony?: bàn đạp vang giữ nốt ngân nên dùng polyphony; vượt giới hạn thì nốt cũ bị tắt; 128 đủ cho chơi piano thuần, 192–256 nếu xếp lớp âm sắc (truy cập 05/11/2026)'
  link: https://www.merriammusic.com/blog/what-is-polyphony/
- id: pianobuyer
  bac: 2
  ten: 'Larry Fine, The Piano Book (ấn bản 4), đoạn trích trên Piano Buyer: danh sách kiểm tra đàn cũ (số seri và năm sản xuất, cao độ chuẩn, trục lên dây và pinblock, dây gỉ, bảng cộng hưởng, bộ máy, búa, bàn đạp, côn trùng ăn nỉ, thuê thợ đàn) (truy cập 05/11/2026)'
  link: https://pianobuyer.com/post/how-to-locate-the-serial-number-of-a-piano-and-checklist-for-inspecting-a-used-piano-before-buying
- id: bapam
  bac: 2
  ten: 'BAPAM, The Healthy Pianist (Roskell và Trouli, 2016): ghế ở độ cao để cánh tay buông lỏng từ vai; chân đặt vững trên sàn hay chỗ tựa chắc; "twenty minute sessions, interspersed with ten minute breaks" (truy cập 05/11/2026)'
  link: https://www.bapam.org.uk/the-healthy-pianist/
- id: roland-dp10
  bac: 2
  ten: 'Roland, bàn đạp DP-10: "Full and half-damper compatible"; dùng được như công tắc sustain thường (truy cập 05/11/2026)'
  link: https://www.roland.com/global/products/dp-10/
- id: millers-hybrid
  bac: 3
  ten: 'Millers Music, Silent vs Hybrid Pianos: silent = đàn cơ có chức năng im lặng; hybrid = đàn số dùng bộ máy cơ, búa chạm cảm biến (truy cập 05/11/2026)'
  link: https://millersmusic.co.uk/blog/silent-vs-hybrid-pianos/
- id: khoa-banphim
  bac: 2
  ten: 'Hồ sơ đã khóa piano/ban-do-ban-phim (n19, n8): đàn 88 phím từ A0 đến C8 (Open Music Theory, Britannica); La4 = 440 Hz (ISO 16)'
  link: https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/
nhan_dinh:
- id: n1
  cau: Phím quá nhẹ thì ngón tay không học được cách điều khiển sắc thái.
  loai: quy-tac
  nguon:
  - yamaha-weighted
  ket_qua: dung
  ghi_chu: 'Yamaha (Weighted Keys): "if you practice only on non-weighted keyboards, you will likely find it difficult to make the transition to acoustic piano"; phím có trọng lượng cho "touch piano teachers recommend for building proper technique".'
- id: n2
  cau: Đàn lệch âm thì tai quen dần với cái sai, còn góc tập bất tiện khiến bạn ngại ngồi vào đàn.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Nhận xét chung của trang cũ, không có nguồn; giữ như lời mở đầu.
- id: n3
  cau: 'Piano điện: không cần lên dây; tập bằng tai nghe vào ban đêm; gọn, nhẹ; kết nối được với máy tính; cảm giác phím và tiếng đàn là mô phỏng, sắc thái rất nhỏ và bàn đạp kém tinh tế hơn đàn cơ tốt; hợp với người mới bắt đầu, sống ở chung cư, cần tập muộn.'
  loai: quy-tac
  nguon:
  - yamaha-care
  - yamaha-weighted
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ thêm "mất giá nhanh" ở cột hạn chế (thông tin về giá thị trường, mau cũ, không kiểm được): bỏ. Yamaha: lên dây là việc của đàn cơ; đàn số mô phỏng cảm giác đàn cơ ("digital pianos typically have weighted keys"). "Bàn đạp kém tinh tế" khớp piano/ban-dap (đã khóa). Kết nối máy tính: USB-MIDI, khớp luyen-tap/ket-noi-midi.'
- id: n4
  cau: 'Piano cơ đứng: dây, búa và bảng cộng hưởng thật; cần lên dây định kỳ; nhạy với độ ẩm; tiếng to, khó tập đêm; nặng, chuyển nhà tốn kém; hợp với người có chỗ đặt đàn và muốn học lâu dài.'
  loai: quy-tac
  nguon:
  - yamaha-care
  - yamaha-howwork
  ket_qua: dung
  ghi_chu: 'Yamaha: lên dây ít nhất mỗi năm một lần; độ ẩm 35–55%; búa, dây thật, bảng cộng hưởng. "Phản hồi trung thực nhất về lực ngón" và "dùng được hàng chục năm nếu giữ tốt" là nhận xét chung, không có nguồn đã mở; "tiếng to, nặng" hiển nhiên.'
- id: n5
  cau: 'Piano cơ đại: bộ máy nằm ngang đánh lặp nhanh hơn; kiểm soát tiếng và bàn đạp tốt nhất; rất đắt, cần phòng rộng.'
  loai: quy-tac
  nguon:
  - yamaha-howwork
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đánh lặp nhanh hơn" (so với đàn đứng). Yamaha: cơ cấu thoát kép ở phần lớn đàn đại hiện đại, đánh lặp một nốt tới 15 lần mỗi giây; không nói đàn đứng chậm hơn bao nhiêu: chưa chắc phần so sánh. "Tốt nhất" là nhận xét; "rất đắt" mau cũ.'
- id: n6
  cau: 'Đàn lai (hybrid) và đàn cơ có hệ thống tắt tiếng: bộ máy phím cơ (hoặc rất gần đàn cơ) kèm âm thanh số; tập được bằng tai nghe; giá cao.'
  loai: quy-tac
  nguon:
  - millers-hybrid
  ket_qua: dung
  ghi_chu: 'Millers Music: silent piano là đàn cơ có chế độ im lặng (búa không chạm dây, cảm biến gửi sang bộ âm thanh); hybrid là đàn số dùng bộ máy cơ, búa chạm cảm biến; cả hai tập được bằng tai nghe. "Giá cao" là so sánh chung với piano điện thường (nguồn bậc 3 không bàn giá).'
- id: n7
  cau: Với người lớn mới học, một cây piano điện tốt là khởi đầu hoàn toàn hợp lý; thỉnh thoảng chơi đàn cơ để tay và tai biết chuẩn.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên.
- id: n8
  cau: Nhiều người nâng cấp lên đàn cơ khi đến khoảng Grade 4–5, lúc các bài bắt đầu đòi hỏi sắc thái và bàn đạp tinh tế (link Bàn đạp, Tạo tiếng đàn).
  loai: ve-site
  ket_qua: dung
  ghi_chu: Giữ đúng "nâng cấp ở Grade 4–5" mà piano/ban-dap (đã khóa) dựa vào (kiem-dinh/piano/ban-dap.yml); chặng 4 = Grade 4–5 theo src/data/cap-do.yml. Hai trang đích piano/ban-dap, piano/tieng-dan có ở src/content/docs/piano/.
- id: n9
  cau: 'Piano điện, danh sách kiểm tra: 88 phím, từ La0 (A0) đến Đô8 (C8); đàn 61 hay 76 phím buộc bạn bỏ bớt nốt hoặc dời quãng tám.'
  loai: dinh-nghia
  nguon:
  - khoa-banphim
  ket_qua: dung
  ghi_chu: 'Đàn 88 phím A0–C8: đã kiểm ở piano/ban-do-ban-phim (đã khóa, n8, n19). Vế "buộc bỏ bớt nốt hay dời quãng tám" là hệ quả hiển nhiên khi tác phẩm dùng cả bàn phím.'
- id: n10
  cau: 'Bộ máy phím: phím búa nặng dần (graded hammer action): phím trầm nặng hơn phím cao, giống đàn cơ; phím nhẹ hay bán nặng không dạy được kỹ thuật điều khiển tốc độ phím.'
  loai: quy-tac
  nguon:
  - yamaha-weighted
  ket_qua: dung
  ghi_chu: 'Yamaha: "the lower keys heavier than the higher ones"; "Graded Hammer actions offer the graded, weighted touch piano teachers recommend for building proper technique"; bàn phím không trọng lượng khó chuyển sang đàn cơ. "Không dạy được" mạnh hơn nguồn một chút ("difficult to transition").'
- id: n11
  cau: 'Âm thanh: lấy mẫu (sampling) hoặc mô hình hóa từ đàn đại; nghe kỹ tiếng trầm, cách nốt tắt dần, và khi chơi thật nhỏ.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên khi thử đàn; mô tả "lấy mẫu hoặc mô hình hóa" là cách làm phổ biến (không số liệu).
- id: n12
  cau: 'Số nốt phát đồng thời (polyphony): 128 trở lên; bàn đạp vang giữ nhiều nốt ngân cùng lúc nên ăn polyphony rất nhanh; thiếu thì nốt cũ bị cắt đột ngột ở đoạn nhiều bàn đạp.'
  loai: so-lieu
  nguon:
  - merriam-poly
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bàn đạp vang và mô phỏng cộng hưởng dây \"ăn\" polyphony rất nhanh". Bỏ "mô phỏng cộng hưởng dây" (không kiểm được ở nguồn đã mở). Merriam Music (bậc 3, cửa hàng): bàn đạp vang làm nốt chồng lên, mỗi nốt cần một giọng; vượt giới hạn thì tắt nốt cũ nhất không còn bị giữ; 128 đủ cho chơi piano thuần. Nguồn hãng (Yamaha, Roland) về polyphony chưa mở: chưa chắc con số 128 là ngưỡng nên dùng; hồ sơ piano/ban-dap đã ghi "chưa có nguồn bậc 1–2".'
- id: n13
  cau: 'Bàn đạp vang: loại liên tục (cho phép nửa bàn đạp), tốt nhất là bộ ba bàn đạp gắn vào chân đàn; bàn đạp dạng công tắc chỉ có bật và tắt; bàn đạp rời nhỏ hay trượt trên sàn.'
  loai: quy-tac
  nguon:
  - roland-dp10
  - yamaha-pedals
  ket_qua: dung
  ghi_chu: 'Giữ "liên tục (cho phép nửa bàn đạp)" để piano/ban-dap (đã khóa) còn đúng. Roland DP-10: "full and half-damper compatible" và dùng được như công tắc thường; Yamaha: bàn đạp rời cắm qua giắc Sustain. "Bộ ba gắn chân đàn là tốt nhất" và "bàn đạp rời hay trượt" là lời khuyên.'
- id: n14
  cau: 'Tai nghe: hai cổng tai nghe; tai nghe chụp tai kín, chất lượng tốt; để tập đêm, và thầy trò cùng nghe.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên.
- id: n15
  cau: 'Kết nối: USB-MIDI (cổng "USB to Host") hoặc Bluetooth MIDI; dùng phím thật với các công cụ của site (link Kết nối đàn MIDI).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'luyen-tap/ket-noi-midi (có ở src/content/docs/luyen-tap/): nối đàn bằng cáp USB (cổng "USB to Host" trên đàn điện) hoặc bộ chuyển MIDI–USB. Bluetooth MIDI: src/scripts/midi.js dùng Web MIDI (nhận cả thiết bị Bluetooth khi trình duyệt cho phép); chưa có nguồn riêng cho Bluetooth, hạng mục phụ.'
- id: n16
  cau: 'Chân đàn và ghế: chân chắc, không rung; ghế chỉnh được độ cao; ghế chữ X của đàn organ thường lung lay và không đúng độ cao.'
  loai: quy-tac
  nguon:
  - bapam
  ket_qua: dung
  ghi_chu: 'BAPAM: ghế ở độ cao để cánh tay buông lỏng từ vai. "Ghế chữ X thường lung lay" là nhận xét chung.'
- id: n17
  cau: 'Tiện ích: máy đếm nhịp, ghi âm tích hợp tiện nhưng không bắt buộc; site có máy đếm nhịp và thu âm (link luyen-tap/metronome, luyen-tap/thu-am).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: Hai trang có ở src/content/docs/luyen-tap/metronome.md và thu-am.md.
- id: n18
  cau: Hàng trăm tiếng nhạc cụ, điệu đệm tự động hay màn hình lớn gần như không giúp gì cho piano cổ điển; hãy dồn ngân sách vào bộ máy phím và tiếng piano.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên.
- id: n19
  cau: 'Năm phép thử khi đi chọn đàn điện: mang tai nghe của bạn; chơi một nốt thật nhỏ rồi thật to; đánh lặp nhanh một nốt và một hợp âm; giữ bàn đạp vang rồi chơi hợp âm rải dài từ trầm lên cao, xem có nốt nào bị cắt không; thử nửa bàn đạp, tiếng ngân phải tăng dần.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên thực hành; phép thử bàn đạp khớp ý polyphony và nửa bàn đạp ở trên.
- id: n20
  cau: 'Piano cơ cũ: luôn nhờ một thợ đàn độc lập (không phải người của bên bán) đi cùng; phí kiểm tra rẻ hơn rất nhiều so với một cây đàn hỏng.'
  loai: khuyen-tap
  nguon:
  - pianobuyer
  ket_qua: dung
  ghi_chu: 'The Piano Book (Piano Buyer): khuyên thuê thợ đàn có chuyên môn khi danh sách kiểm tra quá nhiều; không nói "độc lập" hay so sánh chi phí; vế này là lời khuyên.'
- id: n21
  cau: 'Bảng kiểm tra đàn cơ: trục lên dây và thớt giữ trục (pin block): trục lỏng, đàn xuống dây nhanh; cao độ hiện tại so với chuẩn La4 = 440 Hz; bảng cộng hưởng và các sườn gỗ nứt, bong; búa mòn, rãnh sâu; bộ máy: phím đều, không kẹt, bộ giảm âm tắt gọn; dây và khung gỉ; phím và bàn đạp; bên trong thùng đàn có côn trùng làm hỏng nỉ, mối mọt.'
  loai: quy-tac
  nguon:
  - pianobuyer
  - khoa-banphim
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ ở dòng cuối: "Mối mọt, nấm mốc, côn trùng làm tổ" → "Côn trùng làm hỏng nỉ, mối mọt" (The Piano Book: moth damage to felt; nấm mốc không có trong nguồn). The Piano Book có: pinblock, trục lỏng, cao độ "standard pitch", dây gỉ, bảng cộng hưởng và sườn, búa mòn, bộ máy, giảm âm, bàn đạp. La4 = 440 Hz: ISO 16 (hồ sơ ban-do-ban-phim, đã khóa).'
- id: n22
  cau: Thợ thường tra được năm sản xuất từ số seri của các hãng lớn.
  loai: quy-tac
  nguon:
  - pianobuyer
  ket_qua: dung
  ghi_chu: 'The Piano Book: tìm số seri (4–8 chữ số) rồi tra năm trong Pierce Piano Atlas.'
- id: n23
  cau: 'Đàn cơ đứng đã qua sử dụng: chất lượng từng cây phụ thuộc vào tuổi đời, cách bảo quản và mức độ tân trang; tên hãng không bảo đảm tình trạng một cây cụ thể; hãy chơi thử thật lâu, nghe ý kiến của thợ, và đừng quyết định vì lớp sơn bóng đẹp.'
  loai: khuyen-tap
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ mở đầu bằng "Ở Việt Nam, đàn cơ đứng đã qua sử dụng nhập từ Nhật khá phổ biến" (thông tin thị trường mau cũ, không kiểm được): bỏ; phần còn lại là lời khuyên.'
- id: n24
  cau: 'Bàn đạp giữa: trên đàn đại thường là bàn đạp sostenuto (chỉ giữ ngân những nốt đang bấm); trên đàn đứng thường là bàn đạp tập, hạ một dải nỉ xuống để giảm tiếng.'
  loai: quy-tac
  nguon:
  - yamaha-pedals
  - yamaha-howwork
  ket_qua: dung
  ghi_chu: 'Yamaha (hai trang): đúng như vậy; một số đàn đại có bass sustain, một số đàn đứng (Yamaha YUS5) có sostenuto thật: "thường" đúng.'
- id: n25
  cau: 'Thứ tự ưu tiên khi chọn: bộ máy phím, âm thanh, độ bền và dịch vụ (bảo hành, thợ sửa gần nhà, linh kiện), tính năng phụ; đừng mua đàn rẻ nhất, cũng không cần mua đàn đắt nhất: một cây tầm trung được cân chỉnh tốt đủ cho nhiều năm đầu.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên.
- id: n26
  cau: 'Nếu ngân sách eo hẹp: thuê đàn theo tháng trong vài tháng đầu; mua piano điện đã qua sử dụng có 88 phím búa nặng dần, kiểm tra từng phím và bàn đạp; tập thêm trên đàn cơ ở trung tâm hay trường âm nhạc; nếu tạm thời chỉ có đàn phím nhẹ, coi đó là giải pháp ngắn hạn: thói quen dùng lực hình thành trên phím nhẹ khiến việc chuyển sang đàn cơ khó hơn.'
  loai: quy-tac
  nguon:
  - yamaha-weighted
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thói quen dùng lực hình thành trên phím nhẹ rất khó sửa về sau". Yamaha: tập trên phím không trọng lượng thì khó chuyển sang đàn cơ; đổi theo nguồn. Các ý còn lại là lời khuyên.'
- id: n27
  cau: 'Góc tập: nơi bạn đi qua hằng ngày, nắp phím mở, bản nhạc đặt sẵn; ghế chỉnh được độ cao, người thấp cần bục kê chân; ánh sáng chiếu đều lên giá nhạc, không để bóng tay đổ lên phím; bút chì, tẩy, sổ tập hoặc nhật ký luyện tập; điện thoại hay máy tính bảng mở sẵn site; giá đỡ quay video; giờ tập yên tĩnh, thỏa thuận với hàng xóm, thảm dưới đàn giảm tiếng truyền qua sàn.'
  loai: khuyen-tap
  nguon:
  - bapam
  ket_qua: dung
  ghi_chu: Lời khuyên thực hành. Phần tư thế (ghế chỉnh được độ cao, chân đặt vững trên sàn hay chỗ tựa chắc) khớp BAPAM và piano/tu-the (đã khóa). Link piano/tu-the, luyen-tap/nhat-ky, metronome, thu-am, choi-theo, doc-not có ở src/content/docs/.
- id: n28
  cau: Đồng hồ hẹn giờ nhắc nghỉ 10 phút sau mỗi 20 phút tập (theo BAPAM; xem Giữ đôi tay khỏe).
  loai: quy-tac
  nguon:
  - bapam
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nhắc nghỉ 5 phút sau mỗi 25–30 phút tập". Lời khuyên sức khỏe nên cần nguồn: BAPAM "twenty minute sessions, interspersed with ten minute breaks", và piano/suc-khoe (đã khóa) ghi "Tập khoảng 20 phút rồi nghỉ 10 phút (theo BAPAM)": trang cũ trái trang lõi; đã sửa.'
- id: n29
  cau: 'Lên dây: Yamaha khuyên lên dây ít nhất một lần một năm, đàn mới hay đàn chơi nhiều thì hai lần một năm hoặc hơn; đàn mới chuyển về cần vài tuần để quen với phòng rồi mới lên dây; đàn bỏ lâu ngày có thể phải kéo dây nhiều lần.'
  loai: quy-tac
  nguon:
  - yamaha-care
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Yamaha khuyên tối thiểu hai lần một năm". Yamaha: "at least once a year… brand new should be tuned twice a year or more". Hai vế sau (vài tuần để quen phòng; kéo dây nhiều lần) là kinh nghiệm của thợ, nguồn Yamaha không nói (khuyen-tap).'
- id: n30
  cau: 'Độ ẩm: Yamaha khuyên độ ẩm tương đối trong khoảng 35–55%, lý tưởng là 45%; ở Việt Nam giữ độ ẩm trong khoảng ấy quanh năm không dễ, nên tránh ẩm cao kéo dài và thay đổi đột ngột; đặt ẩm kế, máy hút ẩm, đóng cửa sổ khi mưa; không đặt đàn sát cửa sổ, dưới nắng chiếu trực tiếp, ngay dưới luồng gió điều hòa hay cạnh bếp, phòng tắm; điều hòa chạy liên tục cũng có thể làm phòng quá khô; hỏi thợ về hệ thống kiểm soát độ ẩm lắp bên trong đàn.'
  loai: quy-tac
  nguon:
  - yamaha-care
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Yamaha khuyên độ ẩm tương đối khoảng 40–45%"; Yamaha Hub: "35-55% humidity, with 45% being optimal". Cũng Yamaha: "staying away from direct vents/radiators… warm or cool air". Các ý khác (nắng, bếp, phòng tắm, điều hòa làm khô, hệ thống kiểm soát độ ẩm) là kinh nghiệm chung, nguồn Yamaha đã mở không nhắc nắng trực tiếp (chưa chắc).'
- id: n31
  cau: Đóng nắp phím sau khi tập để tránh bụi và ẩm; lau phím bằng khăn mềm, khô; theo Yamaha không dùng chất tẩy có cồn vì có thể làm phím đổi màu hay nứt; vết bẩn nặng thì dùng khăn mềm thấm nước pha ít nước rửa chén vắt thật kiệt, rồi lau lại bằng khăn hơi ẩm khác; không dùng khăn đó lau thân đàn.
  loai: quy-tac
  nguon:
  - yamaha-care
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "không dùng chất tẩy có cồn vì có thể làm nứt phím; … khăn thấm nước xà phòng vắt thật kiệt". Yamaha: "Do not use any type of alcohol-based cleaner, as it can cause the keys to discolor and/or crack over time"; nước rửa chén pha loãng, rồi khăn hơi ẩm.'
- id: n32
  cau: 'Chăm sóc đàn cơ: cân chỉnh bộ máy (regulation) và chỉnh tiếng búa (voicing) sau vài năm sử dụng, tùy mức tập; thợ lên dây sẽ cho bạn biết khi nào cần.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên chung; nguồn Yamaha Hub (5 steps) không nói con số năm (chữ cũ "sau vài năm" mơ hồ, giữ).
- id: n33
  cau: 'Chăm sóc đàn điện: tránh nắng trực tiếp, nơi ẩm và bụi; phủ khăn khi không dùng; không đặt đồ uống hay vật nặng lên đàn; giữ dây bàn đạp và dây nguồn không bị gập hoặc giẫm lên.'
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên.
- id: n34
  cau: 'Câu hỏi kiểm tra nhanh (4 câu): 88 phím, búa nặng dần là tiêu chí quan trọng nhất; polyphony từ 128 trở lên vì bàn đạp vang làm nhiều nốt ngân cùng lúc; nhờ thợ đàn độc lập khi mua piano cơ đã qua sử dụng; ở khí hậu nồm ẩm, theo dõi bằng ẩm kế và hút ẩm.'
  loai: quy-tac
  nguon:
  - yamaha-weighted
  - merriam-poly
  - pianobuyer
  - yamaha-care
  ket_qua: da-sua
  ghi_chu: 'Đáp án và lời giải thích khớp các nhận định trên. Chữ cũ của lời giải thích câu polyphony: "Mỗi nốt đang ngân, kể cả cộng hưởng mô phỏng, chiếm một giọng": bỏ "kể cả cộng hưởng mô phỏng". Các lời giải thích không dựa vào vị trí lựa chọn (đã kiểm).'
- id: n35
  cau: 'Mục Nguồn cuối trang: Yamaha Hub (Five simple steps…), Larry Fine The Piano Book ấn bản 4 và Piano Buyer, link Kết nối đàn MIDI.'
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Yamaha, \"Caring for your Piano\" (trang hỗ trợ khách hàng trên yamaha.com)" (trang chặn công cụ, không mở được) thay bằng trang Yamaha Hub đã mở; bỏ năm "2001" của The Piano Book (không kiểm được; trang Piano Buyer chỉ ghi "Fourth Edition").'
