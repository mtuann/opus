  moi: Cảm giác phím và tiếng đàn là mô phỏng; sắc thái rất nhỏ và bàn đạp kém tinh tế hơn đàn cơ tốt
  ly_do: '"Mất giá nhanh" là thông tin thị trường mau cũ, không kiểm được.'
- cu:
  - Cảm biến
