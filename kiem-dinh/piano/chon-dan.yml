  - id: n33
    cau: 'Chăm sóc đàn điện: tránh nắng trực tiếp, nơi ẩm và bụi; phủ khăn khi không dùng; không đặt đồ uống hay vật nặng lên đàn; giữ dây bàn đạp và dây nguồn không bị gập hoặc giẫm lên.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên.
  - id: n34
    cau: 'Câu hỏi kiểm tra nhanh (4 câu): 88 phím, búa nặng dần là tiêu chí quan trọng nhất; polyphony quan trọng khi chơi có bàn đạp vang vì nốt được bàn đạp giữ ngân vẫn tính vào polyphony, thiếu thì đàn tắt bớt nốt cũ (polyphony là số nốt tối đa đàn phát được cùng lúc); nhờ thợ đàn độc lập khi mua piano cơ đã qua sử dụng; ở khí hậu nồm ẩm, theo dõi bằng ẩm kế và hút ẩm.'
    loai: quy-tac
    nguon:
      - yamaha-weighted
      - pianobuyer
      - yamaha-care
      - kawai-poly
    ket_qua: da-sua
    ghi_chu: 'Đáp án và lời giải thích khớp các nhận định trên. Chữ cũ của lời giải thích câu polyphony: "Mỗi nốt đang ngân, kể cả cộng hưởng mô phỏng, chiếm một giọng": bỏ "kể cả cộng hưởng mô phỏng". Các lời giải thích không dựa vào vị trí lựa chọn (đã kiểm). Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://www.musiciansfriend.com/thehub/digital-piano-buying-guide, https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano; Bốn ý trong câu hỏi: 88 phím búa nặng dần quan trọng nhất (nhận định); polyphony 128+ (như n12, không có nguồn chung); thợ độc lập khi mua đàn cũ (PTG khuyên nhờ chuyên viên); ẩm kế và hút ẩm (Yamaha). Không ghi đúng cả vì có ý chưa xác nhận.. Review D8-gom: câu 2 viết lại cho khớp hàng polyphony đã sửa (n12): bỏ "128 trở lên". Câu 1 khớp Yamaha (n10), câu 3 khớp Piano Buyer ("a technician who can execute a more thorough inspection"), câu 4 khớp Yamaha. Lời giải thích không dựa vào vị trí lựa chọn. Chữ cũ câu 2: "Vì sao nên chọn đàn có polyphony từ 128 trở lên? … ✓ Vì bàn đạp vang làm nhiều nốt ngân cùng lúc; thiếu polyphony thì nốt cũ bị cắt … Mỗi nốt đang ngân chiếm một \"giọng\" của đàn."'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://kawaius.com/faq/is-a-kawai-piano-good-for-beginners", "https://kawaius.com/faq/what-is-polyphony", "https://www.prnewswire.com/news-releases/piano-technicians-guild-offers-tips-for-avoiding-the-expense-of-the-free-piano-227073101.html", "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano" ]
    luot_2_ghi_chu: "Kawai: người mới nên chọn 'full 88-key piano with weighted keys'; polyphony như n12. PTG: nhờ thợ (RPT) kiểm trước khi mua đàn cũ. Yamaha: đo độ ẩm bằng nhiệt ẩm kế, dùng máy hút ẩm hay tạo ẩm khi cần. 'Quan trọng nhất' là cách site xếp hạng, hợp với Kawai."
  - id: n35
    cau: 'Mục Nguồn cuối trang: Yamaha Hub (Five simple steps…), Larry Fine The Piano Book ấn bản 4 và Piano Buyer, Yamaha Hub (A quick guide to weighted keys), Kawai (What is polyphony?), link Kết nối đàn MIDI.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Yamaha, \"Caring for your Piano\" (trang hỗ trợ khách hàng trên yamaha.com)" (trang chặn công cụ, không mở được) thay bằng trang Yamaha Hub đã mở; bỏ năm "2001" của The Piano Book (không kiểm được; trang Piano Buyer chỉ ghi "Fourth Edition"). Review D8-gom: thêm hai nguồn đã dùng khi review (Yamaha Weighted Keys, Kawai polyphony); kiểm danh sách trên trang.'
