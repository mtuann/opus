    luot_2: dung
    luot_2_nguon: [ "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano" ]
    luot_2_ghi_chu: "Yamaha: lau phím bằng khăn mềm thấm nước pha ít nước rửa chén, lau lại bằng khăn hơi ẩm; tránh chất tẩy có cồn vì làm đổi màu hay nứt; đóng nắp phím khi không dùng. Khớp."
    review: dung
  - id: n32
    cau: 'Chăm sóc đàn cơ: cân chỉnh bộ máy (regulation) và chỉnh tiếng búa (voicing) sau vài năm sử dụng, tùy mức tập; thợ lên dây sẽ cho bạn biết khi nào cần.'
