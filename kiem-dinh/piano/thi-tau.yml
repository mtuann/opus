nhan_dinh:
  - id: n1
    cau: Tin tốt là một phần lớn của đọc nhanh là kỹ năng nhận ra hình mẫu, và nó có thể tiến bộ nếu bạn đọc một chút mỗi ngày.
    loai: quy-tac
    nguon:
      - perra
      - lehmann
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đọc nhanh thực chất là kỹ năng nhận ra hình mẫu, và nó tăng đều nếu bạn đọc một chút mỗi ngày." "Thực chất", "tăng đều" quá chắc. Perra (2021) tóm tắt: khoảng mắt–tay tăng theo trình độ; nhận dạng hình mẫu là một phần của kỹ năng đọc. Chữ mới giữ ý ở mức "một phần lớn", "có thể". Chưa trích được câu nào nói "một phần lớn"; lượt 2 xem lại. Cùng sửa description ở frontmatter (cùng câu).'
    luot_2: dung
    luot_2_nguon: [ "https://test.mtna.org/downloads/Conference/Handouts/2013/Wednesday/LearnAtFirstSight.pdf", "https://bop.unibe.ch/JEMR/article/download/7845/11197/34672" ]
    luot_2_ghi_chu: Nhận ra hình mẫu (pattern recognition) là kỹ năng then chốt của người đọc giỏi (tổng quan MTNA); luyện đọc đều có nghiên cứu hỗ trợ (Ferrin, Pike và Carter); tuy nhiên tập luyện 'cần nhưng chưa đủ' (Meinz và Hambrick).
  - id: n2
    cau: Thị tấu (sight-reading) là chơi một bản nhạc ngay lần đầu nhìn thấy.
    loai: dinh-nghia
    nguon:
      - lehmann
    ket_qua: null
    ghi_chu: "chưa chắc: chỉ có bản ghi Crossref của chương Sight-reading, chưa mở nội dung; định nghĩa phổ thông (Wikipedia, Sight reading, bậc 3, cùng nghĩa). Cần trích bậc 1–2."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sight-reading" ]
    luot_2_ghi_chu: "Concise Oxford: đọc nhạc để trình diễn ngay ở lần nhìn đầu."
  - id: n3
    cau: "Đọc nhạc piano khó hơn đọc một bè: hai khuông, nhiều nốt vang cùng lúc, hai tay làm hai việc khác nhau."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả chung để mở bài, không phải số liệu.
  - id: n4
    cau: Người đọc giỏi nhìn khoảng cách giữa các nốt và hình dạng cả nhóm nốt, giống như ta đọc cả chữ chứ không đọc từng chữ cái; có ba cách nhận ra một nốt (nốt mốc, quãng tính từ nốt trước, hình mẫu), và người đọc giỏi dùng cả ba cùng lúc.
    loai: cau-truc
    nguon: []
    ket_qua: null
    ghi_chu: 'chưa chắc: ý "đọc theo khoảng cách và hình dạng" khớp tổng quan của Perra và Lehmann (chunking, nhận dạng hình mẫu), nhưng vế "ba cách" và "dùng cả ba cùng lúc" là cách chia của trang, chưa có nguồn bậc 1–2 đã mở. Giữ như cách dạy; đề xuất bỏ "người đọc giỏi dùng cả ba cùng lúc" hoặc tìm nguồn.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://test.mtna.org/downloads/Conference/Handouts/2013/Wednesday/LearnAtFirstSight.pdf" ]
    luot_2_ghi_chu: Chunking/nhận hình mẫu được hỗ trợ; cách chia ba kiểu nhận nốt (nốt mốc, quãng, hình mẫu) và việc người giỏi dùng cả ba cùng lúc là cách dạy, không thấy trong nguồn đã mở.
  - id: n5
    cau: "Nốt mốc: Đô giữa, Sol trên dòng 2 khóa Sol, Fa trên dòng 4 khóa Fa."
    loai: quy-tac
    nguon:
      - omt-clefs
      - omt-grand
    ket_qua: dung
    ghi_chu: "Open Music Theory (Clefs): khóa Sol quấn quanh dòng 2 (Sol4); khóa Fa đặt Fa3 trên dòng 4; Đô giữa (C4) trên dòng kẻ phụ giữa hai khuông."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/" ]
    luot_2_ghi_chu: "OMT: khóa Sol có G4 trên dòng 2, khóa Fa có F3 trên dòng 2 từ trên xuống (dòng 4); Đô giữa là nốt giữa hai khuông."
  - id: n6
    cau: "Bảng quãng trên khuông: dòng sang khe sát bên (hoặc khe sang dòng sát bên) là quãng 2, phím ngay cạnh; dòng sang dòng kế tiếp (hoặc khe sang khe kế tiếp) là quãng 3, bỏ qua một phím; dòng sang khe cách một là quãng 4, bỏ qua hai phím; dòng sang dòng cách một là quãng 5, ngón 1 và ngón 5 của thế tay năm ngón; nốt trên dòng và nốt trong khe cùng tên là quãng 8, hai phím cùng tên."
    loai: quy-tac
    nguon:
      - omt-intervals
      - omt-grand
    ket_qua: dung
    ghi_chu: 'Đối chiếu từng hàng bằng tên nốt. Quãng 2: Mi4 (dòng 1) sang Fa4 (khe 1). Quãng 3: Mi4 sang Sol4 (dòng 2), bỏ qua một phím trắng (Fa). Quãng 4: Mi4 sang La4 (khe 2), bỏ qua hai phím (Fa, Sol). Quãng 5: Mi4 sang Si4 (dòng 3), ngón 1 và 5 của thế tay Mi–Si. Quãng 8: Mi4 (dòng 1) sang Mi5 (khe 4). Đúng cả năm hàng. Cột "Trên phím trắng" đúng với các phím trắng liền nhau.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/" ]
    luot_2_ghi_chu: "OMT: quãng đếm theo dòng và khe, quãng 3 là dòng-dòng hoặc khe-khe, quãng 8 cách tám vị trí. Phần 'bỏ qua phím' tính trên bàn phím (Đô–Rê kề, Đô–Mi bỏ Rê...), đúng."
  - id: n7
    cau: "Quy tắc dễ nhớ: quãng lẻ (3, 5, 7) nối dòng với dòng hoặc khe với khe; quãng chẵn (2, 4, 6, 8) nối dòng với khe."
    loai: quy-tac
    nguon:
      - omt-intervals
    ket_qua: dung
    ghi_chu: "Open Music Theory (Intervals): các nốt cách nhau số bậc lẻ nằm cùng loại (dòng–dòng, khe–khe); chẵn thì khác loại. Đúng."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: "Quãng lẻ (3, 5, 7) cùng dòng hoặc cùng khe; quãng chẵn (2, 4, 6, 8) dòng-khe: đúng theo cách đếm vị trí của OMT."
  - id: n8
    cau: 'Ví dụ "Đọc bằng quãng": nốt đầu là Đô giữa, các nốt sau đọc bằng quãng ghi trên nốt (3, 2, 4 | 4, 4, 3, 3 | 5, 5).'
    loai: cau-truc
    nguon: []
    ket_qua: dung
    ghi_chu: "Khối abc 1: C E D G | c G E C | G2 C2: C→E quãng 3, E→D quãng 2, D→G quãng 4; G→c quãng 4, c→G quãng 4 (xuống), G→E quãng 3, E→C quãng 3; C→G quãng 5, G→C quãng 5. Khớp các số ghi trên nốt. Xem khuong_nhac khối 1."
    luot_2: khong-chac
    luot_2_ghi_chu: Khuông soạn riêng 'Đọc bằng quãng'; không xem được nên không đối chiếu 3, 2, 4 | 4, 4, 3, 3 | 5, 5.
  - id: n9
    cau: Ôn lại Quãng nếu cần (liên kết nhac-ly/09-quang).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'src/content/docs/nhac-ly/09-quang.md tồn tại, tiêu đề "9. Quãng". Các liên kết đã chuyển khác của trang: piano/ban-do-ban-phim ("Bản đồ bàn phím"), piano/hop-am-rai ("Hợp âm, hợp âm rải và hình đệm"), nhac-ly/03-truong-do ("3. Trường độ và dấu lặng"), 04-nhip ("4. Nhịp và số chỉ nhịp"), 07-gam-thu ("7. Gam thứ"), 10-hop-am-ba ("10. Hợp âm ba"), 11-hop-am-bay ("11. Hợp âm bảy và thể đảo"): đều tồn tại ở src/content/docs.'
  - id: n10
    cau: "Đọc theo chiều dọc: những nốt thẳng hàng trên hai khuông vang cùng lúc; đọc bè trầm trước vì nốt thấp nhất cho biết hòa âm và thường đi chậm hơn giai điệu."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên đọc; "thường" giữ.
  - id: n11
    cau: "Mô thức tay trái: nốt trầm rồi hai hợp âm (điệu valse), bè Alberti (trầm–cao–giữa–cao), hợp âm rải."
    loai: dinh-nghia
    nguon:
      - brit-alberti
    ket_qua: dung
    ghi_chu: 'Bè Alberti: hình đệm rải ba nốt hợp âm theo thứ tự thấp, cao, giữa, cao (Britannica; COD ở hồ sơ nhac-ly/28). "Điệu valse" cho hình trầm–hợp âm–hợp âm: chưa chắc về tên, như ghi chú ở kiem-dinh/piano/hop-am-rai.yml.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/alberti-bass" ]
    luot_2_ghi_chu: "Concise Oxford: bè Alberti = thấp–cao–giữa–cao (broken triad). Điệu valse nốt trầm rồi hai hợp âm (oom-pah-pah) là mô thức chuẩn."
  - id: n12
    cau: Hợp âm ba ở thế gốc là ba nốt trên ba dòng liên tiếp (hoặc ba khe liên tiếp); một quãng bốn "hở" trong chồng nốt là thể đảo.
    loai: quy-tac
    nguon:
      - omt-triads
      - baylor-inv
    ket_qua: dung
    ghi_chu: 'Open Music Theory (Triads): hợp âm ba thế gốc xếp chồng quãng ba, nên ba nốt nằm cách nhau một dòng hoặc một khe. Baylor (Triad Inversions): thể đảo có quãng bốn trong chồng nốt (thể 6: quãng bốn giữa hai nốt trên; thể 6/4: quãng bốn giữa hai nốt dưới). "Hở" là cách nói của trang.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/" ]
    luot_2_ghi_chu: "OMT: hợp âm ba gốc xếp chồng quãng ba; thể đảo một có quãng ba ở bè trầm (nên giữa các nốt có quãng bốn hở)."
  - id: n13
    cau: "Dòng kẻ phụ: Đô giữa (C4) trên một dòng kẻ phụ giữa hai khuông, Đô trên hai dòng kẻ phụ phía trên khóa Sol (C6), Đô trên hai dòng kẻ phụ phía dưới khóa Fa (C2)."
    loai: quy-tac
    nguon:
      - omt-grand
      - omt-clefs
    ket_qua: dung
    ghi_chu: "Suy từ tên dòng khuông (Open Music Theory, Grand Staff): khóa Sol dòng trên cùng Fa5, dòng kẻ phụ 1 phía trên La5, dòng kẻ phụ 2 Đô6; khóa Fa dòng dưới cùng Sol2, dòng kẻ phụ 1 phía dưới Mi2, dòng kẻ phụ 2 Đô2. Đúng."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/", "https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/" ]
    luot_2_ghi_chu: "Đô giữa trên một dòng kẻ phụ giữa hai khuông (OMT). Khuông Sol dòng trên cùng là Fa5 nên hai dòng kẻ phụ trên là Đô6; khuông Fa dòng dưới cùng là Sol2 nên hai dòng kẻ phụ dưới là Đô2: đúng."
  - id: n14
    cau: 8va phía trên nốt là chơi cao hơn một quãng tám so với nốt viết; 8vb (hoặc 8va phía dưới nốt) là thấp hơn một quãng tám; loco là trở về chơi như viết.
    loai: quy-tac
    nguon:
      - wiki-octave
    ket_qua: null
    ghi_chu: "chưa chắc: chỉ Wikipedia (bậc 3, Octave sign) mở được; chưa có trích Open Music Theory cho ký hiệu 8va, 8vb, loco. Nội dung đúng với thực hành ghi nhạc chung."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/ottava" ]
