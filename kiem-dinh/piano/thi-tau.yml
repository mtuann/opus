khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - quang
    ket_qua: dung
    ghi_chu: 'Đọc bằng quãng: 4/4, L:1/4, Đô trưởng, 3 ô đủ 4 phách. Nốt: C E D G | c G E C | G2 C2. Quãng ghi trên nốt: E 3, D 2, G 4; c 4, G 4, E 3, C 3; G2 5, C2 5. Đối chiếu từng cặp: Đô4–Mi4 quãng 3, Mi4–Rê4 quãng 2, Rê4–Sol4 quãng 4, Sol4–Đô5 quãng 4, Đô5–Sol4 quãng 4, Sol4–Mi4 quãng 3, Mi4–Đô4 quãng 3, Đô4–Sol4 quãng 5, Sol4–Đô4 quãng 5. Khớp. Câu trên khối nói "nốt đầu là Đô giữa": đúng (C = Đô4).'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - so-ngon
    ket_qua: dung
    ghi_chu: 'Bài đọc 1: 4/4, L:1/4, Đô trưởng, 4 ô, mỗi ô đủ 4 phách ở cả hai bè. Tay phải: E D C E | F E D2 | E G F D | C4 (Đô4–Sol4, thế tay Đô–Sol; !3! ở Mi đầu). Tay trái: C,4 | G,4 | C,2 G,2 | C,4 chỉ có Đô và Sol (ngón !5! ở Đô, !1! ở Sol). Khớp câu "Tay phải giữ nguyên thế tay Đô–Sol, tay trái chỉ có hai nốt Đô và Sol". Ngón: Mi4 với ngón 3 trong thế tay Đô–Sol là đúng (ngón 1 Đô, 2 Rê, 3 Mi, 4 Fa, 5 Sol).'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
    ket_qua: dung
    ghi_chu: "Bài đọc 2: 3/4, L:1/4, Sol trưởng (một dấu thăng), 8 ô đủ 3 phách. Tay phải: G B d | c2 A | B c A | G3 | d B G | c2 A | c B A | G3. Tay trái: G,,3 | A,,3 | D,3 | G,,3 | G,,3 | A,,3 | D,3 | G,,3. Hòa âm I | ii (Am, La–Đô–La) | V (Rê, La trong hợp âm, Si và Đô qua) | I; lặp lại. Câu 1 và câu 2 khác nhau ở ô 1 (G B d / d B G) và ô 3 (B c A / c B A), giống ở ô 2 và 4. Khớp câu trang viết sau khi sửa."
  - khoi: 4
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
    ket_qua: dung
    ghi_chu: 'Bài đọc 3: 4/4, L:1/8, La thứ (không dấu hóa biểu; ^G là Sol♯ bậc 7 nâng), 4 ô, mỗi ô đủ 8 nốt móc. Tay phải: e2 c2 A2 c2 | B2 ^G2 E2 ^G2 | A2 c2 e2 c2 | B2 ^G2 A4: Am, E, Am, E–Am. Tay trái: A,,2 [C,E,]2 ×3 (Am: La, Đô–Mi); E,,2 [^G,,D,]2 ×3 (E7 rút gọn: Sol♯–Rê, tức quãng 3 và 7); ô 4 E,,2 [^G,,D,]2 A,,4. Hòa âm i–V7–i–V7–i khớp tay phải (B, ^G, E là nốt của E7). Ngón: !5! ở e, B; !1! ở A; !4!, !2!, !3! ở ô 4 hợp lý cho thế tay Mi–Sol♯–La. Khớp câu "vì sao có Sol♯ (Gam thứ)".'
  - khoi: 5
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
    ket_qua: dung
    ghi_chu: 'Bài đọc 3 giản lược: cùng giai điệu tay phải với khối 4, tay trái chỉ nốt trầm (A,,8 | E,,8 | A,,8 | E,,4 A,,4), mỗi ô đủ 8 móc. Khớp câu "tay trái chỉ còn nốt trầm; hòa âm vẫn rõ".'
ghi_chu: 'Đọc nhạc và thị tấu (piano/thi-tau, lõi, D4-L3 phần C). Nguồn: Open Music Theory (clefs, grand staff, intervals, triads, minor/major scales), Baylor Piano Basics, Britannica (Alberti bass); Crossref (Lehmann và McArthur 2002); Perra và cộng sự 2021 (mdpi, tóm tắt tổng quan khoảng mắt–tay); Faber Music (Harris Grade 1, 3); trang chủ Sight Reading Factory; Henle và IMSLP (Schumann Op. 68, Anna Magdalena); Alfred (Diabelli Op. 149); trang Trinity (HTML). Công cụ web: WebFetch ngày 28/10/2026; WebSearch hết hạn mức; PubMed, PDF Trinity không đọc được. SỬA TRANG (đã ghi doi_chu): mở đầu và description ("thực chất", "tăng đều"); khoảng mắt–tay (bỏ "một ô nhịp hoặc hơn", "dài dần khi luyện"; thêm khoảng số nốt theo tổng quan 2021); Bài đọc 2 ("giống ở phần cuối" thành "khác ô 1 và 3, giống ô 2 và 4"); Mikrokosmos bỏ "rất"; Harris (mô tả theo Faber); hàng "Chuẩn bị thi" và bullet ABRSM, Trinity; SRF bỏ "(trả phí)" và "không bao giờ hết bài"; Phiếu bài tập ("tiết tấu" thành "quãng, hợp âm, hóa biểu"). GIỮ NGUYÊN: tiêu đề "Quét 30 giây trước khi chơi" (anchor quet-30-giay-truoc-khi-choi, luyen-tap/thi-tau-hai-tay cũ trỏ tới). CHƯA CHẮC (ket_qua null): định nghĩa thị tấu (chỉ Crossref); "ba cách nhận ra nốt, dùng cả ba cùng lúc"; 8va/8vb/loco (chỉ Wikipedia); Mikrokosmos "ngắn", quyển 1–2, nhà xuất bản Boosey & Hawkes; đề mẫu thị tấu ABRSM/Trinity. Số liệu 0,5–3,7 và 1,7–6,8 nốt lấy từ bản tóm tắt Perra (2021), cần lượt 2 xác nhận. LỆCH VỚI TRANG LÔ TRƯỚC (người giao quyết): piano/lo-trinh hàng "Đọc nhạc" chặng 3 ghi "Đọc trước nửa ô nhịp", chặng 4 ghi "Đọc trước một ô nhịp"; nhận định khoảng mắt–tay của trang này nói hiếm khi tới trọn một ô nhịp; đề xuất sửa lo-trinh ("đọc trước vài nốt") hoặc bỏ. Lô trước yêu cầu giữ: lo-trinh trỏ tới piano/thi-tau (bài hai tay 4–8 ô nhịp, ít dấu hóa, dễ hơn bài đang tập khoảng hai cấp; "danh sách quét" không nêu): KHỚP ở phần "dễ hơn khoảng hai cấp"; hàng "Đọc trước" lệch như trên. quang-tam-buoc-nhay, hop-am-rai, ban-do-ban-phim: trang này chỉ trỏ tới, không nêu điều cần giữ: KHỚP. Câu ve-site trỏ trang chưa chuyển: luyen-tap/doc-not, thi-tau, thi-tau-hai-tay, tiet-tau, phieu-bai-tap, ket-noi-midi, metronome, nhat-ky; piano/thay-va-thi: đã kiểm ở ../opus-zero/docs, điều cần giữ ghi ở nhận định (anchor quet-30-giay-truoc-khi-choi; bốn cấp của thi-tau-hai-tay; chấm MIDI cả cao độ lẫn nhịp ở thi-tau). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml có thể chưa có (cho D3-L5; lượt 1 không lập hồ sơ thuật ngữ): sight-reading (thị tấu), eye-hand span (khoảng mắt–tay), nốt mốc, dòng kẻ phụ (ledger line), 8va/8vb/loco, mô thức tay trái, bè Alberti, thể đảo, thế tay năm ngón, chorale. Ghi chú cho người giao: các nhận định phụ thuộc Perra cần lượt 2 kiểm số liệu; trang có 5 khối abc, tất cả ví dụ soạn, đã đối chiếu bằng tay.'
doi_chu:
  - cu: "Đọc nhạc piano khó hơn đọc một bè: hai khuông, nhiều nốt vang cùng lúc, hai tay làm hai việc khác nhau. Tin tốt là đọc nhanh thực chất là kỹ năng nhận ra hình mẫu, và nó tăng đều nếu bạn đọc một chút mỗi ngày. Trang này nói cách đọc, cách luyện thị tấu (sight-reading: chơi một bản nhạc ngay lần đầu nhìn thấy), và tài liệu cho từng trình độ."
    moi: "Đọc nhạc piano khó hơn đọc một bè: hai khuông, nhiều nốt vang cùng lúc, hai tay làm hai việc khác nhau. Tin tốt là một phần lớn của đọc nhanh là kỹ năng nhận ra hình mẫu, và nó có thể tiến bộ nếu bạn đọc một chút mỗi ngày. Trang này nói cách đọc, cách luyện thị tấu (sight-reading: chơi một bản nhạc ngay lần đầu nhìn thấy), và tài liệu cho từng trình độ."
    ly_do: 'n1 (da-sua): "thực chất", "tăng đều" quá chắc, không có nguồn.; n1 (da-sua): description theo câu mở đầu đã sửa, cắt lại ở ranh giới từ.'
  - cu: "Người đọc giỏi luôn nhìn trước chỗ đang chơi một quãng: từ vài nốt ở người mới đến khoảng một ô nhịp hoặc hơn ở người đọc thành thạo. Các nhà nghiên cứu gọi đó là khoảng mắt–tay (eye-hand span), và nó dài dần khi bạn luyện."
    moi: "Người đọc giỏi nhìn trước chỗ đang chơi một quãng. Các nhà nghiên cứu gọi đó là khoảng mắt–tay (eye-hand span): trong các nghiên cứu được tổng hợp, khoảng này chỉ vài nốt, từ chừng 0,5–3,7 nốt ở người mới đến chừng 1,7–6,8 nốt ở người đọc giỏi (tùy cách đo), và hiếm khi tới trọn một ô nhịp. Một vài thí nghiệm cho thấy luyện tập giúp kéo dài nó ở người đọc yếu, nhưng bằng chứng còn ít."
    ly_do: 'n16 (da-sua): "một ô nhịp hoặc hơn" không có trong các nghiên cứu tổng hợp (Perra 2021); "dài dần khi bạn luyện" quá chắc. Cần lượt 2 xác nhận số liệu.'
  - cu: "Hóa biểu một dấu thăng. Hai câu bốn ô nhịp giống nhau ở phần cuối: nhận ra điều đó khi quét là bạn chỉ phải đọc một nửa."
    moi: Hóa biểu một dấu thăng. Hai câu bốn ô nhịp chỉ khác nhau ở ô thứ nhất và thứ ba; ô thứ hai và thứ tư giống hệt. Nhận ra điều đó khi quét, bạn chỉ phải đọc kỹ hai ô của câu thứ hai.
    ly_do: 'n25 (da-sua): khối abc 3: hai câu khác nhau ở ô 1 và ô 3, giống ở ô 2 và ô 4; "đọc một nửa" không đúng.'
  - cu: Mikrokosmos bắt đầu bằng những bài rất ngắn và tăng độ khó từng chút
    moi: Mikrokosmos bắt đầu bằng những bài ngắn và tăng độ khó từng chút
    ly_do: 'n29 (chưa chắc): bỏ "rất", không kiểm được; vẫn cần nguồn cho "ngắn".'
  - cu: Mỗi cấp một quyển, có bài luyện tiết tấu, nhận dạng và bài đọc ngắn
    moi: Mỗi cấp một quyển, có bài tập tiết tấu và giai điệu, bài mẫu kèm câu hỏi, và bài đọc ngắn
    ly_do: 'n30 (da-sua): Faber mô tả bài tập tiết tấu và giai điệu, bài mẫu kèm câu hỏi, bài đọc chấm điểm; không nói "bài luyện nhận dạng".'
  - cu: Đề mẫu thị tấu của ABRSM và Trinity
    moi: Đề mẫu thị tấu của ABRSM; đề cương thi piano của Trinity (thị tấu là một trong các bài thi phụ)
    ly_do: 'n34 (chưa chắc): trang Trinity cho thấy đề cương và bài thi phụ, không thấy "đề mẫu thị tấu" riêng; tách hai tổ chức.'
