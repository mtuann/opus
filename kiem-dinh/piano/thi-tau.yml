  - id: n25
    cau: "Bài 2: Sol trưởng, nhịp 3/4, hóa biểu một dấu thăng. Hai câu bốn ô nhịp chỉ khác nhau ở ô thứ nhất và thứ ba; ô thứ hai và thứ tư giống hệt."
