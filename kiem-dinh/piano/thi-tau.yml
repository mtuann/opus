    cau: "Khoảng mắt–tay (eye-hand span): trong các nghiên cứu được tổng hợp, khoảng này chỉ vài nốt, từ chừng 0,5–3,7 nốt ở người mới đến chừng 1,7–6,8 nốt ở người đọc giỏi (tùy cách đo), và hiếm khi tới trọn một ô nhịp. Một vài thí nghiệm cho thấy luyện tập giúp kéo dài nó ở người đọc yếu, nhưng bằng chứng còn ít."
    loai: so-lieu
    nguon:
      - perra
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "từ vài nốt ở người mới đến khoảng một ô nhịp hoặc hơn ở người đọc thành thạo ... và nó dài dần khi bạn luyện." Perra và cộng sự (2021, tổng quan): EHS tăng theo trình độ và giảm khi bản nhạc phức tạp hơn; các khoảng số nốt theo cách đo khác nhau; "hơn một ô nhịp" không được các nghiên cứu ủng hộ. Chữ mới theo các khoảng ấy. Chỉ đọc bản tóm tắt trên mdpi.com; số liệu 0,5–3,7 và 1,7–6,8 lấy từ đó. Cần lượt 2 xác nhận từng con số và vế "luyện tập giúp kéo dài".'
    luot_2: dung
    luot_2_nguon: [ "https://bop.unibe.ch/JEMR/article/download/7845/11197/34672" ]
    luot_2_ghi_chu: "Tổng quan Perra 2021: 0,52–3,69 nốt ở người mới, 1,73–6,8 ở người giỏi; mắt hiếm khi nhìn trước tới một ô nhịp; Cara 2018: tập luyện nâng khoảng này ở người yếu, Rosemann 2016 không thấy tăng đáng kể."
