    nguon:
      - omt-major
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hai câu bốn ô nhịp giống nhau ở phần cuối: nhận ra điều đó khi quét là bạn chỉ phải đọc một nửa." Khối abc 3 (X:3): tay phải ô 1 "G B d", ô 2 "c2 A", ô 3 "B c A", ô 4 "G3"; câu 2: "d B G", "c2 A", "c B A", "G3". Ô 1 khác (G B d / d B G), ô 3 khác (B c A / c B A), ô 2 và 4 giống hệt. Chữ cũ sai (câu 2 không giống phần cuối ở ô 1 và 3 theo nghĩa "một nửa"). Sol trưởng một dấu thăng: Open Music Theory.'
    luot_2: khong-chac
