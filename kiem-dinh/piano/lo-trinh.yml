nhan_dinh:
  - id: n1
    cau: Mốc thời gian tính từ ngày bắt đầu, cho người lớn tập đều đặn và có người hướng dẫn; đây là con số rất thô (có người đi nhanh gấp đôi, có người mất gấp đôi thời gian), điều quyết định là có tiếp tục đi hay không.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên về cách đọc mốc thời gian (moc_thoi_gian của cap-do.yml, D2-0 xếp khuyen-tap). Khớp ../opus-zero/docs/bat-dau/lo-trinh-choi.md ("Thời gian chỉ là gợi ý. Đi chậm hơn một nửa vẫn hoàn toàn ổn"). Đổi chữ đầu câu "\* Tính từ ngày bắt đầu" thành "Mốc thời gian tính từ ngày bắt đầu" vì bảng có cột "Mốc thời gian*" đã thay bằng sơ đồ ::hinh{ten="lo-trinh"} sinh từ cap-do.yml (việc giao cho D2-L1); ý không đổi.
    luot_2: dung
    luot_2_ghi_chu: "Mốc thời gian chỉ là ước lượng rất thô, quyết định là có tiếp tục hay không: lời dặn hợp lý, không nguy hại."
  - id: n2
    cau: Hàng Nhạc lý ở mỗi chặng là mức tối thiểu; lộ trình năm đầu học hết bài 1–15 ngay trong 12 tháng.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp ../opus-zero/docs/bat-dau/lo-trinh-choi.md: tháng 1 bài 1–3, tháng 2 bài 4–5 và Ôn tập 1, tháng 3 bài 6–7, tháng 4 bài 8–9, tháng 5 Ôn tập 2 và bài 10, tháng 6 bài 11–12, tháng 7 bài 13, tháng 8 bài 14 và Ôn tập 3, tháng 9 bài 15 (và bài 31), tháng 10 bài 26.'
    luot_2: dung
    luot_2_ghi_chu: "Kế hoạch nội bộ hợp lý: nhạc lý ở mỗi chặng là mức tối thiểu, năm đầu học hết bài 1–15. Nhất quán với lo-trinh-choi n40 (năm hai bắt đầu từ bài 16)."
  - id: n3
    cau: Site dùng cấp (grade) của ABRSM làm thước đo độ khó, vì đây là một trong những hệ thống thi âm nhạc lớn nhất thế giới.
    loai: so-lieu
    nguon:
      - abrsm-impact-2024
      - trinity-about
      - musicmark-abrsm
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): sửa theo lượt 2: không có xếp hạng độc lập cho "phổ biến nhất". ABRSM Impact Report 2024: "the world''s largest music education provider, engaging with half a million learners a year from 93 countries" (ABRSM tự nhận); Trinity: "over 700,000 candidates a year in more than 80 countries" (mọi môn: nhạc, kịch, tiếng Anh). Nên viết "một trong những hệ thống thi âm nhạc lớn nhất thế giới". Lượt 1: Câu cũ thêm vế "và gần như mọi danh sách tác phẩm đều tham chiếu nó": không kiểm được, và sai với các danh sách lớn dùng thang riêng (Henle 1–9, RCM Level 1–10, Magrath, Hinson), nên đã bỏ vế ấy. Vế còn lại: Music Mark: ABRSM là "the world''s leading provider of music exams, holding over 650,000 assessments in more than 90 countries every year"; đề cương ABRSM 2025–2026 (About ABRSM): "a global music education charity … we offer face-to-face and digital exams … across the world". Không ghi con số lên trang (số thí sinh đổi hằng năm).'
    luot_2: khong-chac
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-09/Impact%20Report%202024%20FINAL.pdf, https://www.trinitycollege.com/about-us ]
    luot_2_ghi_chu: "ABRSM tự mô tả là \"the world's largest music education provider, engaging with half a million learners a year from 93 countries\" (Impact Report 2024); Trinity tự ghi \"over 700,000 candidates a year in more than 80 countries\" (mọi môn: nhạc, kịch, tiếng Anh). Không có nguồn độc lập nào xếp ABRSM là hệ thống \"phổ biến nhất thế giới\". Nên viết: \"một trong những hệ thống thi cấp lớn và quen thuộc nhất thế giới\"."
  - id: n4
    cau: ABRSM và Trinity College London (đều của Anh) có cấp Initial, rồi Grade 1 đến Grade 8, sau đó là các bằng diploma.
    loai: cap-do
    nguon:
      - abrsm-2526
      - trinity-syll
      - trinity-dipl
    ket_qua: dung
    ghi_chu: 'ABRSM 2025–2026: "ABRSM Practical Music qualifications are available from Grade 1 to Grade 8, and in some subjects from Initial Grade"; có mục "Piano Initial Grade"; "progress to ABRSM''s diploma offer, beginning with the performance-only ARSM … The LRSM and FRSM Diplomas are progressive from the ARSM"; "a company registered in England and Wales … registered office … London". Trinity, Piano Syllabus from 2023: "details of graded exams from Initial to Grade 8"; "After Grade 8 … candidates can progress to diplomas at Associate (ATCL), Licentiate (LTCL) and Fellowship (FTCL) levels"; "Charity number England & Wales: 1014792", "regulated by Ofqual … in England".'
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf, https://support.trinitycollege.com/support/solutions/articles/202000096383-entry-requirements-graded-diploma-levels, https://register-of-charities.charitycommission.gov.uk/charity-search/-/charity-details/1014792 ]
