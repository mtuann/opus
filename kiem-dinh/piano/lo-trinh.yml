ghi_chu: 'Lượt 1 kiểm mọi câu có thể đúng hay sai; câu điều hướng (link sang trang khác, "Năm đầu tiên được viết chi tiết ở…") và câu chỉ tả trang không tính. Lời khuyên (khuyen-tap) gom theo dòng bảng cùng loại của nhiều chặng. Hai thay đổi cấu trúc giao cho D2-L1: bảng Tổng quan (dữ liệu chặng viết tay) thay bằng sơ đồ ::hinh{ten="lo-trinh"} sinh từ cap-do.yml (D2-0 kiểm định, khóa cả bản ghi); dòng Tác phẩm của chặng 2–6 bỏ danh sách bài học trên site, thay bằng link tới trang chặng sinh từ tac-pham.yml (nên chặng của Valse La thứ, Valse Si thứ theo dữ liệu D2-0, không viết tay ở đây); chặng 1 và chặng 7 thêm link tới trang chặng. Đề cương ABRSM, RCM, Trinity và trang Henle đã tải và đọc ngày 24/10/2026. Open Music Theory chặn truy cập tự động (HTTP 403) nên hai câu nhạc lý dùng giáo trình mở khác.'
