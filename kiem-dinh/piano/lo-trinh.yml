    ghi_chu: 'Review (24/10/2026): giữ: Henle và ABRSM (LRSM, FRSM) xếp các tác phẩm này ở mức diploma; Kinderszenen trọn tập, khác n18 (vài bài). Lượt 1: RCM 2022, danh sách LRCM (diploma sau ARCT): "Ballade No. 1 in G Minor, op. 23"; Beethoven "Sonata in C Major, op. 53", op. 57, 81a, 101, 109, 110, 111; Bach "Partita No. 1" đến "No. 6" (trọn bài); Schumann "Kinderszenen, op. 15", "Kreisleriana, op. 16" (trọn tập). Debussy: Level 10 và ARCT có từng prelude của hai tập Préludes. Đã sửa "Kinderszenen" thành "trọn tập Kinderszenen": từng bài của op. 15 chỉ ở mức Henle 4–5 (HN 44; Träumerei là bài học chặng 5), chỉ trọn tập mới ở mức diploma.'
    luot_2: dung
    luot_2_nguon: [ https://www.henle.de/en/Ballade-g-minor-op.-23/HN-867, https://www.henle.de/Piano-Sonatas-Volume-II/HN-1034, https://www.henle.de/Six-Partitas-BWV-825-830/HN-1518, https://www.henle.de/Kreisleriana-op.-16/HN-253, https://www.henle.de/Preludes-Premier-livre/HN-383, https://www.henle.de/Scenes-from-Childhood-op.-15/HN-44 ]
    luot_2_ghi_chu: "Henle (kèm tham chiếu ABRSM trên trang): Ballade g minor op. 23 mức 8, ABRSM LRSM; sonata muộn của Beethoven mức 8–9 (op. 109, 110 mức 8; op. 101, 106, 111 mức 9), ABRSM FRSM; Partita của Bach mức 6–7 (Partita 2 có ABRSM LRSM và Grade 8; Partita 6 FRSM); Kreisleriana mức 8, ABRSM FRSM; Préludes Livre 1 mức 5–8 (nhiều bài ARSM hoặc LRSM). Riêng Kinderszenen từng bài mức 4–5: ở đây được nêu như một tác phẩm lớn khi chơi trọn tập, khác với n18 (một vài bài)."
