    ghi_chu: 'Review (24/10/2026): giữ, vì là ước lượng (Op. 55 số 1 không có trong đề cương ABRSM 2021–2028): nguồn gần nhất là Op. 55 số 3 chương 1 ở ABRSM Grade 5 (2025–2026), Trinity Op. 55 số 2 ở Grade 4; RCM xếp Op. 55 số 1 ở Level 5. Xếp vào chặng 4 là khoảng. Lượt 1: Trang cũ ghi bài này ở dòng Tác phẩm của chặng 3; đã chuyển sang chặng 4. RCM 2022: Kuhlau Op. 55 số 1 (chương 1, 2) ở Level 5, trong khi Clementi Op. 36 số 1 (bài học chặng 3, Grade 3) ở Level 3, và Grieg Op. 12 số 2 (Waltz) cũng ở Level 5 mà ABRSM 2025–2026 xếp Grade 4. Trinity từ 2023: Kuhlau "Allegretto (from Sonatina in G, op. 55 no. 2)" ở Grade 4, "Sonatina in C, op. 55 no. 3" chương 1 ở Grade 5; ABRSM 2025–2026 cũng xếp Op. 55 số 3 chương 1 ở Grade 5. Không đề cương nào xếp Op. 55 số 1 ở Grade 3.'
