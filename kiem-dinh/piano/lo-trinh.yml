doi_chu:
  - cu:
      - Chặng
      - Tương đương (≈ ABRSM)
      - Mốc thời gian*
      - Thời lượng tập gợi ý
      - Tác phẩm tiêu biểu
      - 1. Khởi đầu
      - trước Grade 1
      - 0–6 tháng
      - 20–30 phút/ngày
      - 10 bài đầu tiên
      - 2. Sơ cấp
      - Grade 1–2
      - 6 tháng – 1,5 năm
      - 30 phút
      - Minuet Sol trưởng, Schumann Op. 68
      - 3. Sơ trung cấp
      - Grade 3
      - 1,5–2,5 năm
      - 30–45 phút
      - Clementi Op. 36 số 1, Arabesque
      - 4. Trung cấp
      - Grade 4–5
      - 2,5–4 năm
      - 45 phút
      - "Bach: Prelude Đô trưởng, Für Elise"
      - 5. Trung cấp cao
      - Grade 6
      - 4–5,5 năm
      - 45–60 phút
      - Mozart K. 545, Invention số 1
      - 6. Nâng cao
      - Grade 7–8
      - 5,5–9 năm
      - 60–90 phút
      - Pathétique, chương 2, Clair de lune
      - 7. Sau Grade 8
      - diploma trở lên
      - không giới hạn
      - 1–3 giờ, chia nhiều buổi
      - Ballade số 1
      - "* Tính từ ngày bắt đầu, cho người lớn tập đều đặn và có người hướng dẫn (thầy, hoặc ít nhất là người nghe và góp ý định kỳ). Đây là con số rất thô: có người đi nhanh gấp đôi, có người mất gấp đôi thời gian, và cả hai đều bình thường. Điều quyết định không phải tốc độ, mà là bạn có tiếp tục đi hay không."
    moi: "Mốc thời gian tính từ ngày bắt đầu, cho người lớn tập đều đặn và có người hướng dẫn (thầy, hoặc ít nhất là người nghe và góp ý định kỳ). Đây là con số rất thô: có người đi nhanh gấp đôi, có người mất gấp đôi thời gian, và cả hai đều bình thường. Điều quyết định không phải tốc độ, mà là bạn có tiếp tục đi hay không."
    ly_do: 'Bảng tổng quan viết tay thay bằng sơ đồ 7 chặng sinh từ src/data/cap-do.yml (::hinh{ten="lo-trinh"}, D2-L1): thông tin chặng dùng ở nhiều trang lấy từ dữ liệu, không viết tay (AGENTS.md, Dữ liệu; plans/ben-vung/README.md, lớp dữ liệu: cap-do.yml thay bảng chặng của lo-trinh.md). Bốn cột đầu khớp cap-do.yml (D2-0 kiểm). Cột "Tác phẩm tiêu biểu" bỏ: bài học của từng chặng ở trang chặng, sinh từ dữ liệu.; n1: không còn cột có dấu sao (bảng thay bằng sơ đồ), nên chú thích gọi thẳng tên "Mốc thời gian".'
  - cu: Site dùng cấp (grade) của ABRSM làm thước đo độ khó, vì đây là hệ thống phổ biến nhất thế giới và gần như mọi danh sách tác phẩm đều tham chiếu nó.
    moi: Site dùng cấp (grade) của ABRSM làm thước đo độ khó, vì đây là một trong những hệ thống thi âm nhạc lớn nhất thế giới.
    ly_do: 'n3 (da-sua): vế "gần như mọi danh sách tác phẩm đều tham chiếu nó" không kiểm được và sai với Henle (thang 1–9 riêng) và RCM (Level riêng). Review (24/10/2026): "phổ biến nhất thế giới" không có xếp hạng độc lập; ABRSM tự nhận lớn nhất, Trinity hơn 700.000 thí sinh mỗi năm, nên viết "một trong những … lớn nhất".'
  - cu: Hát lại một nốt, nghe quãng 2, 3 và 5; gõ đúng tiết tấu đơn giản.
    moi: Hát lại một nốt, nghe quãng 3 trưởng, 5 đúng và 8 đúng; gõ đúng tiết tấu đơn giản.
    ly_do: "n15 (lời khuyên, đã sửa): khớp trang Nghe quãng (bộ Khởi động: 3 trưởng, 5 đúng, 8 đúng; quãng 2 ở bộ cuối) và tháng 3 của lộ trình năm đầu (bat-dau/lo-trinh-choi, n12), cùng chặng 1."
  - cu: Hai tuần đầu tiên, 10 bài đầu tiên, một giáo trình cho người lớn (Alfred, Faber), các bài đầu trong Türk, Bartók Mikrokosmos. Xem chặng 1 trong danh mục.
    moi: "Hai tuần đầu tiên, 10 bài đầu tiên, một giáo trình cho người lớn (Alfred, Faber), các bài đầu trong Bartók Mikrokosmos; cuối chặng, các bài đầu trong Türk (khoảng Grade 1). Bài học trên site: trang chặng 1. Xem thêm chặng 1 trong danh mục."
    ly_do: 'Kế hoạch D2-L1: mỗi mục chặng dẫn sang trang chặng (trang sinh từ dữ liệu). Review (24/10/2026), n17: ABRSM xếp bài đầu trong Türk (Arioso Fa trưởng) ở Grade 1, nên ghi "cuối chặng, … (khoảng Grade 1)".'
  - cu: "Những bài bạn sẽ chơi trong vài năm tới, để có đích đến: Bach: Prelude Đô trưởng, Schumann: Kinderszenen, Beethoven: Ánh trăng."
    moi: "Những bài bạn sẽ chơi trong vài năm tới, để có đích đến: Bach: Prelude Đô trưởng, vài bài trong Schumann: Kinderszenen, chương 1 của Beethoven: Ánh trăng."
    ly_do: 'n18 (da-sua, review 24/10/2026): chương 1 của Ánh trăng ở chặng 5 (dữ liệu đã khóa), cả sonata ở mức ARSM; Kinderszenen trọn tập ở chặng 7, nên ghi "vài bài trong".'
