    ket_qua: dung
    ghi_chu: 'MacEwan (Hart): "The treble clef, also known as the G clef", "the bass clef, also known as the F clef". LibreTexts (Wilson, Royston): "usually a treble clef (G clef) on the top and a bass clef (F clef) on the bottom staff", "The C in between the two staves is called middle C". UW Oshkosh: "The line that is surrounded by the curved part at the bottom of the clef is the note G". Khớp ../opus-zero/docs/piano/ban-do-ban-phim.md.'
