  - id: n24
    cau: 'Dòng Tay của chặng 4–6 (phức điệu hai bè, cân bằng giai điệu và đệm trong một tay, rubato; hình thức sonata thật ở Mozart K. 545, ba lớp âm thanh ở Träumerei, đa tiết tấu hai chọi ba, quãng tám, nốt lặp và nốt kép; tốc độ, sức bền, bàn đạp theo phong cách: tiết kiệm với Mozart, theo hòa âm với Chopin, đạp nửa và una corda với Debussy, fugue ba bè).'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp các trang cũ: ../opus-zero/docs/piano/ban-dap.md (mục Mozart: fortepiano dùng cần gạt đầu gối, Mozart gần như không ghi bàn đạp; mục Chopin: "Chopin tự ghi bàn đạp kỹ"), piano/tac-pham/mozart-k545.md ("I: hình thức sonata"; "gần như không dùng bàn đạp"), schumann-traumerei.md (giai điệu, bè trong, bè trầm), debussy-clair-de-lune.md ("una corda, đạp nửa"), chopin-nocturne-op9-2.md ("bàn đạp theo hòa âm"), bach-prelude-fugue-do-thu.md ("Fugue ba bè").'
    luot_2: dung
    luot_2_ghi_chu: Các kỹ thuật chặng 4–6 nêu trong ngoặc phù hợp sư phạm phổ biến (bàn đạp tiết kiệm với Mozart, theo hòa âm với Chopin, đạp nửa và una corda với Debussy; nhịp chéo hai chọi ba, quãng tám, nốt lặp, nốt kép, fugue ba bè); không có nguy cơ.
  - id: n25
    cau: 'Nốt hoa mỹ thời Baroque: láy rền thường bắt đầu từ nốt trên.'
    loai: quy-tac
    nguon:
      - imslp-wfbach
      - bbc-trill
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): thêm "thường" theo lượt 2: bảng ký hiệu của Bach (Klavierbüchlein cho W. F. Bach) giải trillo bắt đầu từ nốt trên, nhưng quy tắc có ngoại lệ (nhạc thế kỷ 17, vài bối cảnh). Lượt 1: IMSLP: Klavierbüchlein für Wilhelm Friedemann Bach (1720) có mục "II. Explication unterschiedlicher Zeichen", bảng nốt hoa mỹ Bach viết cho con, trong đó láy rền (trillo) viết ra bắt đầu từ nốt trên. BBC Music Magazine: "the modern trill starts on the lower note; the high Baroque trill, however, began on the upper note". Khớp ../opus-zero/docs/piano/not-hoa-my.md.'
    luot_2: dung
    luot_2_nguon: [ https://commons.wikimedia.org/wiki/File:Tableofornaments750.jpg ]
    luot_2_ghi_chu: 'Bảng ký hiệu của J. S. Bach trong Clavierbüchlein cho W. F. Bach (bản chụp trên Wikimedia Commons): "Trillo" được giải thành các nốt xen kẽ bắt đầu từ nốt trên. Đây là quy tắc chung của thời Baroque, nhưng có ngoại lệ (nhạc thế kỷ 17 và một số bối cảnh); nên viết "thường bắt đầu từ nốt trên" thì chắc hơn.'
