  - id: n56
    cau: "Thể gốc: các nốt xếp chồng quãng 3 nằm cùng loại vị trí trên khuông: dòng – dòng – dòng hoặc khe – khe – khe. Hợp âm bảy thể gốc có bốn nốt cùng dòng hoặc cùng khe."
    loai: quy-tac
    nguon:
      - mount13
      - mount18
    ket_qua: dung
    ghi_chu: 'Mount ch. 13: "a stack of thirds with the three notes occupying consecutive lines or spaces on the staff — the lowest note is called the root". Ch. 18: hợp âm bảy thêm một quãng 3 nữa lên trên nốt năm: bốn nốt liên tiếp trên dòng hoặc khe. Khối abc 9: C–E–G (dòng), D–F–A (khe), G–B–D–F (dòng).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/", "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: "Hợp âm xếp chồng quãng 3: mỗi quãng 3 đi từ dòng sang dòng hoặc khe sang khe, nên 3 hoặc 4 nốt cùng dòng hoặc cùng khe (suy ra từ định nghĩa xếp chồng quãng 3 'snowperson' của OMT)."
  - id: n57
    cau: Thể đảo của hợp âm ba có một khoảng rộng hơn (quãng 4); nốt nằm ngay trên quãng 4 là nốt gốc.
    loai: quy-tac
    nguon:
      - mount13
      - baylor-inv
    ket_qua: dung
    ghi_chu: "Mount ch. 13: đảo 2 (6/4) có quãng 4 và quãng 6 trên bass; dựng lại chồng quãng 3: nốt gốc nằm quãng 4 trên nốt trầm. Đếm: đảo 1 Mi–Sol–Đô: quãng 4 là Sol–Đô, nốt ngay trên là Đô = gốc; đảo 2 Sol–Đô–Mi: quãng 4 là Sol–Đô, nốt trên là Đô = gốc. Đúng; cả hai thể đảo cho cùng kết luận. Câu hỏi quiz 2 cùng ý."
    luot_2: dung
    luot_2_nguon: [ "https://www.gmajormusictheory.org/Fundamentals/Ch13.pdf", "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/" ]
    luot_2_ghi_chu: "GM13 mục 13.5: nếu đảo, gốc là nốt trên của quãng 4. OMT: gốc là nốt cho tên hợp âm. Đảo 1 (Mi–Sol–Đô) quãng 4 ở hai nốt trên, đảo 2 (Sol–Đô–Mi) ở hai nốt dưới; cả hai nốt trên quãng 4 là Đô."
  - id: n58
    cau: Thể đảo của hợp âm bảy có hai nốt "dính nhau" (quãng 2); nốt trên của quãng 2 là nốt gốc.
    loai: quy-tac
    nguon:
      - mount18
    ket_qua: dung
    ghi_chu: "Mount ch. 18 (không nêu mẹo này nhưng xác nhận xếp chồng quãng 3 và nốt bảy cách gốc quãng 7, đảo chỉ đổi nốt ở bè trầm): đếm trực tiếp với G7: đảo 1 B–D–F–G (F–G, trên là G), đảo 2 D–F–G–B (F–G), đảo 3 F–G–B–D (F–G). Gốc luôn là nốt trên của quãng 2 giữa nốt bảy và nốt gốc. Đúng; khối abc 9 có G7 gốc và đảo 1."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/", "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/" ]
    luot_2_ghi_chu: "Suy ra từ cấu tạo: bất kỳ thể đảo của hợp âm bảy xếp chồng 3 có một quãng 2 giữa nốt bảy và nốt gốc, nốt gốc ở trên (ví dụ Sol7: Si–Rê–Fa–Sol, Rê–Fa–Sol–Si, Fa–Sol–Si–Rê đều có Fa–Sol). OMT mở được không phát biểu quy tắc này nguyên văn."
  - id: n59
    cau: "Biết nốt gốc rồi, nhìn hóa biểu và ngữ cảnh để biết chức năng: trong Đô trưởng, Sol–Si–Rê–Fa là V7, dù nó đứng ở thể nào."
    loai: quy-tac
    nguon:
      - mount18
      - mount19
    ket_qua: dung
    ghi_chu: "Mount ch. 18–19: V7 trong Đô là G–B–D–F; tên và chức năng hợp âm không đổi theo thể đảo (Mount ch. 13 cho triad: chord members giữ nguyên tên)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/" ]
    luot_2_ghi_chu: "OMT: gốc là nốt cho tên hợp âm bất kể thể đảo ('the root of the chord is always A, regardless of its inversion'). Sol–Si–Rê–Fa là V7 của Đô trưởng."
  - id: n60
    cau: "Khối abc 9 ghi: C gốc [CEG], Dm gốc [DFA], C đảo 1 [EGc], C đảo 2 [Gce], G7 gốc [GBdf], G7 đảo 1 [Bdfg]."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm từng nốt: đúng; M:4/4, L:1/4, sáu hợp âm hai phách mỗi hợp âm, ba ô đủ 4 phách; khối này không có số ngón và không có Q (chỉ hình đọc nốt). Review: đã kiểm dòng 236: [CEG] [DFA] | [EGc] [Gce] | [GBdf] [Bdfg], nhãn khớp."
    review: dung
  - id: n61
    cau: "Bài tập hằng ngày: mở một bài thánh ca hay một bản nhạc dễ, chỉ đọc hợp âm của tay trái thành tên (C, G7, Am) mà không chơi, rồi chơi lại bằng hợp âm khối. Kỹ năng này giúp ích cho thị tấu và học thuộc."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "giúp rất nhiều"; "rất nhiều" không kiểm được, đổi thành "giúp ích". Lời khuyên tập (khuyen-tap); trỏ tới /opus/piano/thi-tau/ (xem ve-site bên dưới).'
  - id: n62
    cau: Phần "Đọc hợp âm nhanh" trỏ tới thị tấu (/opus/piano/thi-tau/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/piano/thi-tau.md ("# Đọc nhạc và thị tấu trên đàn") có mục "mô thức tay trái" (nốt trầm rồi hai hợp âm, Alberti, hợp âm rải) và "Đọc hợp âm bằng hình dạng" (ba nốt trên ba dòng liên tiếp là hợp âm ba thể gốc; quãng 4 "hở" là thể đảo), trỏ ngược hop-am-rai.md. Điều cần giữ: trang thi-tau ở đường dẫn này và hai ý ấy. Review: đã kiểm link /opus/piano/thi-tau/ nay có trong dist/ (đã chuyển).'
    review: dung
  - id: n63
    cau: "Bảng Lỗi thường gặp: ba nốt hợp âm không vang cùng lúc (đặt sẵn ngón, thả trọng lượng); phần đệm to hơn giai điệu (tay trái p, tay phải mf); Alberti gõ từng ngón (xoay cẳng tay, nốt trầm có trọng lượng); bước nhảy valse trễ nhịp (rời nốt trầm ngay, mắt nhìn trước hợp âm); hợp âm rải giật ở chỗ luồn (ngón cái đi sớm, cẳng tay dẫn đường); hợp âm rải rộng không có bàn đạp (đổi bàn đạp sau mỗi nốt trầm)."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập, nhất quán với thân bài; p và mf cách nhau hai bậc (p, mp, mf), khớp "vài bậc".
  - id: n64
    cau: "Câu hỏi 1: ngón bấm tay phải thường dùng cho Mi–Sol–Đô (Đô trưởng thể đảo 1) là 1-2-5 (quãng 4 Sol–Đô nằm trên, nên ngón 2 chơi nốt giữa để khoảng 2–5 đủ rộng)."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Cùng nguồn và cùng lý do với ngón bấm thể đảo 1 ở trên (chỉ có MuseScore bậc 3); đáp án trang khớp bảng; đáp án sai (1-3-5, 1-2-3) khớp thể gốc và không hợp lý. Review D4-gom (đổi nhãn): ngón bấm hợp âm khối là quy ước sư phạm có biến thể (MuseScore bậc 3: thể đảo 2 tay phải "either a 1-3-5 or 1-2-4"; Pianote ghi 1-2-5), không tìm được giáo trình đại học công khai viết ra con số (Baylor Piano Basics ch. 22 và Unit 53 chỉ ghi "Pay careful attention to fingering", số ngón nằm trong hình; Miami chỉ có ngón hợp âm rải; Evansville không có hợp âm khối). Đổi quy-tac thành khuyen-tap: đây là ngón bấm trang chọn và lô trước yêu cầu giữ (nhac-ly/10-hop-am-ba, 11-hop-am-bay), không phải sự kiện cần nguồn; không trái trang khác. Lượt 2 (dung) đối chiếu cùng nguồn MuseScore.'
    luot_2: dung
    luot_2_nguon: [ "https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads" ]
    luot_2_ghi_chu: Đảo 1 tay phải 1-2-5; quãng 4 Sol–Đô nằm trên.
  - id: n65
    cau: "Câu hỏi 2: trong hợp âm ba trên khuông có quãng 4 giữa hai nốt dưới, nốt nằm ngay trên quãng 4 là nốt gốc (ví dụ Sol–Đô–Mi: quãng 4 là Sol–Đô, nốt gốc là Đô)."
    loai: quy-tac
    nguon:
      - mount13
      - baylor-inv
    ket_qua: dung
    ghi_chu: 'Như nhận định về thể đảo ở mục Đọc hợp âm: Sol–Đô–Mi là đảo 2 của Đô; quãng 4 Sol–Đô, gốc Đô. Hai đáp án sai ("nốt dưới cùng", "nốt giữa của mọi hợp âm") đều sai.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gmajormusictheory.org/Fundamentals/Ch13.pdf" ]
    luot_2_ghi_chu: "GM13: gốc là nốt trên quãng 4. Sol–Đô–Mi: quãng 4 Sol–Đô, gốc Đô."
  - id: n66
    cau: "Câu hỏi 3: bass Alberti chơi các nốt của hợp âm theo thứ tự thấp – cao – giữa – cao (ví dụ Đô–Sol–Mi–Sol, ngón 5-1-3-1)."
    loai: dinh-nghia
    nguon:
      - cod-alberti
    ket_qua: dung
    ghi_chu: "COD: lowest, highest, middle, highest. Ngón 5-1-3-1 khớp khối abc 6."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/alberti-bass", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly" ]
    luot_2_ghi_chu: Thấp–cao–giữa–cao; Mutopia K. 545 ô 1 tay trái c(5) g(1) e(3) g, đúng ngón 5-1-3-1.
  - id: n67
    cau: "Câu hỏi 4: ở Đô trưởng, khi V7 (Si–Fa–Sol) về I, nốt Si đi lên Đô (Si là cảm âm đi lên chủ âm; Fa đi xuống Mi; Sol giữ nguyên)."
    loai: quy-tac
    nguon:
      - mount19
    ket_qua: dung
    ghi_chu: 'Mount ch. 19: cảm âm lên bậc nhất; nốt bảy xuống bậc ba; nốt gốc giữ. Hai đáp án sai ("xuống La", "giữ nguyên") đều sai.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/02%3A_Diatonic_Polyphony_and_Functional_Harmony/2.09%3A_The_Dominant_Seventh_Chord" ]
    luot_2_ghi_chu: "V7 (Si–Fa–Sol) về I: Si lên Đô, Fa xuống Mi, Sol giữ."
  - id: n68
    cau: "Câu hỏi 5: hợp âm rải Mi♭ trưởng có ngón bấm khác Đô trưởng vì ngón cái tránh phím đen, nên phải đặt trên Sol, phím trắng duy nhất của Mi♭–Sol–Si♭."
    loai: quy-tac
    nguon:
      - evansville
      - miami-fingers
    ket_qua: dung
    ghi_chu: 'Evansville và Miami: hợp âm rải Mi♭ bắt đầu bằng ngón 4 hoặc 3 trên Mi♭ và ngón cái trên Sol (ngón 1 ở nốt thứ hai); Evansville: với hợp âm rải bắt đầu trên phím đen, ngón cái chơi nốt trắng. Đáp án sai "Vì Mi♭ trưởng có bốn nốt" sai (ba nốt trong một nhóm); "tay trái không luồn ngón được" sai.'
    luot_2: dung
    luot_2_nguon: [ "https://robertkelleyphd.com/home/arpfing.htm" ]
    luot_2_ghi_chu: "Kelley: ngón cái giữ phím trắng; Mi♭–Sol–Si♭ chỉ Sol trắng."
  - id: n69
    cau: 'Nguồn: Palmer, Manus, Lethco, The Complete Book of Scales, Chords, Arpeggios & Cadences (Alfred); ABRSM, Piano Scales & Arpeggios; Evansville, Scale and Arpeggio Fingerings; MuseScore, "Inverting major triads"; Kostka & Payne, Tonal Harmony (McGraw-Hill).'
    loai: ten
    nguon:
