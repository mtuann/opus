ghi_chu: 'Hợp âm, hợp âm rải và hình đệm (piano/hop-am-rai, lõi). Nguồn: Baylor Piano Basics (Triad Inversions, One-Octave Arpeggios), Evansville và Miami (ngón bấm hợp âm rải), COD và encyclopedia.com (Alberti bass), Mutopia K 545, Mount ch. 13/18/19/22, CMS Symposium (hòa âm bàn phím), LibreTexts (nocturne), onmusic. MuseScore "Inverting major triads" chỉ đọc được qua bản sao (bậc 3): ngón bấm thể gốc, đảo 1, đảo 2 và câu hỏi quiz 1 để ket_qua null (chưa chắc, cần nguồn bậc 1–2). Sửa trang: bỏ "hầu hết mọi", "vô số", "nhanh nhất", "giúp rất nhiều", "rất thường gặp", "khoảng hai bậc"; thay "một số sách cho 5-3-2-1" bằng quy tắc Baylor; Mi♭ "ngón 2 hoặc 4" thành "2, 3 hoặc 4"; bỏ "và các bài hát không lời" ở nocturne; bỏ cột "Hay gặp ở" của bảng bốn kiểu đệm; định nghĩa "hòa âm bàn phím" viết lại theo CMS. Chưa chắc: tên "valse" cho hình nốt trầm–hợp âm–hợp âm (Baylor Accompaniment Styles không tải được); danh mục Nguồn cuối trang (sách in) chưa mở được. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5, lượt 1 không tạo hồ sơ thuật ngữ): arpeggio (hợp âm rải), broken chord (hợp âm rải gãy), block chord (hợp âm khối), keyboard harmony (hòa âm bàn phím), voice leading (dẫn giọng), waltz (valse, trong trang là điệu valse), common tone (nốt chung), thumb crossing (luồn ngón cái); đã có: Alberti bass, inversion, leading tone, nocturne. Câu về site: các trang chưa chuyển (piano/tac-pham/mozart-k545, piano/hoa-am, piano/hoa-am/ket, piano/hoa-am/dem-giai-dieu, luyen-tap/xay-hop-am, luyen-tai/nghe-hop-am, piano/thi-tau, tai-lieu-tham-khao) đã kiểm trên ../opus-zero/docs/; điều cần giữ ghi trong từng nhận định. Lô trước yêu cầu giữ: KHỚP. Các mục doi_chu tự viết bằng chữ thường; người giao chạy lại node tools/chuyen/so-chu.mjs piano/hop-am-rai --doi-chu sau khi build lại dist để chuẩn hóa. Lưu ý: trang này nói "cổ tay giữ ngang" khi luồn, trang hai-tay nói "cổ tay xoay nhẹ" cho Alberti: hai bối cảnh khác nhau.'
doi_chu:
  - cu: Hợp âm là "từ vựng" của tay trái và là khung của hầu hết mọi bản nhạc bạn sẽ chơi. Trang này đi từ hợp âm ba ở các thể đảo, qua hợp âm rải gãy và hợp âm rải, đến bốn kiểu hình đệm cơ bản và vòng kết I–IV–I–V7–I ở nhiều giọng. Phần lý thuyết nằm ở bài hợp âm ba và hợp âm bảy.
    moi: Hợp âm là "từ vựng" của tay trái và là khung hòa âm của nhiều bản nhạc bạn sẽ chơi. Trang này đi từ hợp âm ba ở các thể đảo, qua hợp âm rải gãy và hợp âm rải, đến bốn kiểu hình đệm cơ bản và vòng kết I–IV–I–V7–I ở nhiều giọng. Phần lý thuyết nằm ở bài hợp âm ba và hợp âm bảy.
    ly_do: 'n1 (khong-can-nguon): "hầu hết mọi bản nhạc" là mức độ không kiểm được; đổi thành "nhiều". Sửa cả description.'
  - cu: "Tay trái đi lên: ngón 4 vắt qua ngón cái. Nhóm đầu thường là 5-4-2-1; một số sách cho 5-3-2-1."
    moi: "Tay trái đi lên: ngón 4 vắt qua ngón cái. Nhóm đầu ở Đô trưởng là 5-4-2-1; theo giáo trình Baylor, ngón 4 dùng khi giữa nốt gốc và nốt ba có một phím trắng, ngón 3 khi có hai phím trắng."
    ly_do: "n20 (da-sua): không nguồn nào đọc được ghi 5-3-2-1 cho Đô trưởng (Evansville, Miami: 5-4-2-1); thay bằng quy tắc của Baylor."
  - cu: "Hợp âm rải có phím đen dùng ngón bấm khác, vì ngón cái vẫn tránh phím đen. Ví dụ Mi♭ trưởng (Mi♭–Sol–Si♭): ngón cái tay phải đặt trên Sol, phím trắng duy nhất của hợp âm, nên nhóm ngón phải bắt đầu bằng ngón 2 hoặc 4 trên Mi♭. Ngón bấm hợp âm rải ở các thể đảo và ở các giọng phím đen khác nhau giữa các sách; hãy theo sách gam và hợp âm rải bạn dùng, và ghi lại bằng bút chì."
    moi: "Hợp âm rải có phím đen dùng ngón bấm khác, vì ngón cái vẫn tránh phím đen. Ví dụ Mi♭ trưởng (Mi♭–Sol–Si♭): ngón cái tay phải đặt trên Sol, phím trắng duy nhất của hợp âm, nên nhóm ngón bắt đầu bằng ngón 2, 3 hoặc 4 trên Mi♭ (tùy tay và tùy sách). Ngón bấm hợp âm rải ở các thể đảo và ở các giọng phím đen khác nhau giữa các sách; hãy theo sách gam và hợp âm rải bạn dùng, và ghi lại bằng bút chì."
    ly_do: 'n22 (da-sua): Evansville cho 4, Miami cho 3 ở tay phải Mi♭ trưởng; "2 hoặc 4" thiếu ngón 3.'
  - cu: "Với mọi kiểu đệm: tập tay trái riêng đến khi tự động, rồi ghép, và giữ tay trái nhỏ hơn tay phải khoảng hai bậc sắc thái."
    moi: "Với mọi kiểu đệm: tập tay trái riêng đến khi tự động, rồi ghép, và giữ tay trái nhỏ hơn tay phải vài bậc sắc thái."
    ly_do: 'n27 (khong-can-nguon): "khoảng hai bậc" là con số không có nguồn; như trang hai-tay.'
  - cu: "Tay trái trải hợp âm trên một quãng rộng: nốt gốc, quãng 5, rồi quãng 10 (nốt ba ở quãng tám trên), và nhờ bàn đạp mà mọi nốt hòa thành một nền âm thanh. Đây là kết cấu quen thuộc của nocturne và các bài hát không lời thời Lãng mạn. Bàn tay mở ra và khép lại như chiếc quạt, cổ tay xoay theo hướng các nốt; nếu tay nhỏ, thay nốt quãng 10 bằng quãng 8 (Đô–Sol–Đô). Mỗi chữ Ped. là một lần đổi bàn đạp ngay sau nốt trầm mới."
    moi: "Tay trái trải hợp âm trên một quãng rộng: nốt gốc, quãng 5, rồi quãng 10 (nốt ba ở quãng tám trên), và nhờ bàn đạp mà mọi nốt hòa thành một nền âm thanh. Đây là kết cấu quen thuộc của nocturne thời Lãng mạn. Bàn tay mở ra và khép lại như chiếc quạt, cổ tay xoay theo hướng các nốt; nếu tay nhỏ, thay nốt quãng 10 bằng quãng 8 (Đô–Sol–Đô). Mỗi chữ Ped. là một lần đổi bàn đạp ngay sau nốt trầm mới."
    ly_do: 'n39 (da-sua): LibreTexts: nocturne Lãng mạn có đệm rải; không có nguồn cho "bài hát không lời", nên bỏ.'
  - cu: Hay gặp ở
    ly_do: 'n42 (da-bo): bỏ cột vì không kiểm được mức độ "hay gặp" và các thể loại.'
  - cu: Thánh ca, bài hát, các bài đầu tiên
    ly_do: 'n42: bỏ cột "Hay gặp ở" vì không kiểm được mức độ "hay gặp".'
  - cu: Valse, minuet, nhạc khiêu vũ
    ly_do: 'n42: bỏ cột "Hay gặp ở" vì không kiểm được mức độ "hay gặp".'
  - cu: Sonata và sonatina thời Cổ điển
    ly_do: 'n42: bỏ cột "Hay gặp ở" vì không kiểm được mức độ "hay gặp".'
  - cu: Nocturne, bài hát không lời, nhạc Lãng mạn
    ly_do: 'n42: bỏ cột "Hay gặp ở" vì không kiểm được mức độ "hay gặp".'
  - cu:
      - "Hòa âm bàn phím là chơi được các tiến trình hợp âm cơ bản ở mọi giọng mà không cần nhìn bản nhạc. Bài nền tảng là vòng kết I–IV–I–V7–I: tay trái chơi nốt gốc, tay phải chơi ba nốt với dẫn giọng gần nhất (mỗi nốt đi ít nhất có thể, nốt chung giữ nguyên). Đây là kết bạn sẽ gặp ở cuối vô số câu nhạc, và là cách nhanh nhất để tay và tai hiểu chức năng hòa âm."
      - "Ở Đô trưởng, tay phải chơi Đô–Mi–Sol, Đô–Fa–La, Đô–Mi–Sol, Si–Fa–Sol, Đô–Mi–Sol; tay trái chơi Đô, Fa, Đô, Sol, Đô. Hợp âm V7 ở tay phải chỉ có ba nốt: Si (nốt ba, cũng là cảm âm), Fa (nốt bảy) và Sol (nốt gốc); nốt năm Rê được bỏ, điều rất thường gặp khi chơi hợp âm bảy bằng ba nốt. Khi về I, Si đi lên Đô, Fa đi xuống Mi, Sol giữ nguyên."
    moi:
      - "Hòa âm bàn phím (keyboard harmony) là chơi các tiến trình hợp âm cơ bản và chuyển chúng sang các giọng khác ngay trên bàn phím. Bài nền tảng là vòng kết I–IV–I–V7–I: tay trái chơi nốt gốc, tay phải chơi ba nốt với dẫn giọng gần nhất (mỗi nốt đi ít nhất có thể, nốt chung giữ nguyên). Đây là kết bạn sẽ gặp ở cuối nhiều câu nhạc, và là một cách để tay và tai hiểu chức năng hòa âm."
      - "Ở Đô trưởng, tay phải chơi Đô–Mi–Sol, Đô–Fa–La, Đô–Mi–Sol, Si–Fa–Sol, Đô–Mi–Sol; tay trái chơi Đô, Fa, Đô, Sol, Đô. Hợp âm V7 ở tay phải chỉ có ba nốt: Si (nốt ba, cũng là cảm âm), Fa (nốt bảy) và Sol (nốt gốc); nốt năm Rê được bỏ, điều thường gặp khi chơi hợp âm bảy bằng ba nốt. Khi về I, Si đi lên Đô, Fa đi xuống Mi, Sol giữ nguyên."
    ly_do: 'n43 (da-sua): CMS Symposium: hòa âm bàn phím gồm chơi và chuyển giọng tiến trình hợp âm; "không cần nhìn bản nhạc" và "mọi giọng" không có nguồn.; n45 (da-sua): "vô số", "nhanh nhất" không kiểm được.; n48 (da-sua): Mount ch. 19: hợp âm thiếu nốt năm "common" trong V–I; bỏ "rất".'
  - cu: "Bài tập hằng ngày: mở một bài thánh ca hay một bản nhạc dễ, chỉ đọc hợp âm của tay trái thành tên (C, G7, Am) mà không chơi, rồi chơi lại bằng hợp âm khối. Kỹ năng này giúp rất nhiều cho thị tấu và học thuộc."
    moi: "Bài tập hằng ngày: mở một bài thánh ca hay một bản nhạc dễ, chỉ đọc hợp âm của tay trái thành tên (C, G7, Am) mà không chơi, rồi chơi lại bằng hợp âm khối. Kỹ năng này giúp ích cho thị tấu và học thuộc."
    ly_do: 'n61 (khong-can-nguon): "rất nhiều" không kiểm được.'
  - cu: 'mô tả: Hợp âm là "từ vựng" của tay trái và là khung của hầu hết mọi bản nhạc bạn sẽ chơi. Trang này đi từ hợp âm ba ở các thể đảo, qua hợp âm rải gãy và hợp âm rải…'
    moi: 'mô tả: Hợp âm là "từ vựng" của tay trái và là khung hòa âm của nhiều bản nhạc bạn sẽ chơi. Trang này đi từ hợp âm ba ở các thể đảo, qua hợp âm rải gãy và hợp âm rải…'
    ly_do: 'n1: mô tả đổi theo câu mở đầu, "hầu hết mọi bản nhạc" thành "nhiều bản nhạc".'
