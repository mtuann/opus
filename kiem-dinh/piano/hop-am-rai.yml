    review: dung
  - id: n47
    cau: Ở Đô trưởng, tay phải chơi Đô–Mi–Sol, Đô–Fa–La, Đô–Mi–Sol, Si–Fa–Sol, Đô–Mi–Sol; tay trái chơi Đô, Fa, Đô, Sol, Đô.
    loai: cau-truc
    nguon:
      - mount19
      - mount22
    ket_qua: dung
    ghi_chu: "Kiểm bằng cách dựng: I = C E G; IV = F A C (đảo 2: C F A); V7 = G B D F, bỏ nốt năm Rê giữ B F G; từ I → IV: Đô giữ, Mi → Fa, Sol → La; IV → I: Fa → Mi, La → Sol, Đô giữ; I → V7: Mi → Fa, Sol giữ, Đô → Si; V7 → I: Si → Đô, Fa → Mi, Sol giữ. Khớp khối abc 8 (ô 1–3: [CEG] [CFA] | [CEG] [B,FG] | [CEG])."
    luot_2: dung
    luot_2_nguon: [ "https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70" ]
    luot_2_ghi_chu: "Đô trưởng: I Đô–Mi–Sol, IV Đô–Fa–La, V7 thiếu nốt năm Si–Fa–Sol với bass Sol (V7 không nốt 5 gấp đôi gốc). Chuỗi nốt tay phải và tay trái đúng."
  - id: n48
    cau: "Hợp âm V7 ở tay phải có ba nốt: Si (nốt ba, cũng là cảm âm), Fa (nốt bảy), Sol (nốt gốc); nốt năm Rê được bỏ, điều thường gặp khi chơi hợp âm bảy bằng ba nốt."
    loai: cau-truc
    nguon:
      - mount18
      - mount19
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "điều rất thường gặp". Mount ch. 18: V7 = G–B–D–F ở Đô (gốc, nốt ba, nốt năm, nốt bảy); ch. 19: V7 thiếu nốt năm (incomplete), "Incomplete chords are common in dominant-to-tonic progressions"; cảm âm đi lên chủ âm, nốt bảy đi xuống. Bỏ "rất". Si là cảm âm (bậc 7) và nốt ba của V; Fa là nốt bảy của V7: đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.nebraska.edu/openmusictheory/?p=361", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70" ]
    luot_2_ghi_chu: "Si cảm âm (nốt ba), Fa nốt bảy, Sol nốt gốc; Rê (nốt 5) lược bỏ. HMS: 'V7 without the 5th (re) and with a doubled root is an incomplete V7'; OMT: nốt năm bỏ để giải về I đủ nốt."
  - id: n49
    cau: Khi về I, Si đi lên Đô, Fa đi xuống Mi, Sol giữ nguyên.
    loai: quy-tac
    nguon:
