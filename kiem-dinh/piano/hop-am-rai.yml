      - musescore-inv
      - alfred-complete
      - kostka-ecu
      - abrsm-se
    ket_qua: dung
    ghi_chu: "Chưa chắc: lượt 1 không mở được các sách in (Palmer/Manus/Lethco, ABRSM, Kostka–Payne); Evansville và MuseScore đã mở (xem nguon). Không có tên sách nào bị sai trong lượt này nhưng chưa xác nhận từng tên và nhà xuất bản. Đề nghị lượt 2 hoặc người giao kiểm danh mục sách ở thư viện/nhà xuất bản. Review D4-gom: lượt 2 đã mở trang nhà phát hành/thư viện cho từng tên: Stretta (Lethco, Manus, Palmer, The Complete Book of Scales, Chords, Arpeggios & Cadences, Alfred), ECU (Kostka & Payne, Tonal Harmony, McGraw-Hill), Musicroom (ABRSM Piano Scales & Arpeggios from 2021), Evansville, MuseScore. Tên đúng; câu chỉ nêu tên, không nêu nội dung sách in."
    luot_2: dung
    luot_2_nguon: [ "https://www.stretta-music.de/en/lethco-manus-palmer-the-complete-book-of-scales-chords-arpeggios-cadences-nr-373409.html", "https://lib.ecu.edu/catalog-preview/catalog/1355113", "https://faculty.evansville.edu/gu2/Scales.htm", "https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads", "https://www.musicroom.com/piano-scales-1-arpeggios-from-2021-grade-1-9781848499515" ]
    luot_2_ghi_chu: "Đã mở: Palmer/Manus/Lethco, The Complete Book of Scales, Chords, Arpeggios & Cadences (Alfred) tồn tại; Kostka & Payne, Tonal Harmony (McGraw-Hill, bản 5, 2004); trang Evansville; bài MuseScore 'inverting major triads' (qua bản chép lại); ABRSM Piano Scales & Arpeggios from 2021 tồn tại. Không kiểm nội dung từng trang sách in."
