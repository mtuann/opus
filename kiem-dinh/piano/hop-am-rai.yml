nhan_dinh:
  - id: n1
    cau: Hợp âm là "từ vựng" của tay trái và là khung hòa âm của nhiều bản nhạc bạn sẽ chơi.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "là khung của hầu hết mọi bản nhạc bạn sẽ chơi" (cả trong description). "Hầu hết mọi" là số liệu không kiểm được; đổi thành "khung hòa âm của nhiều bản nhạc".'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên chung, hợp lý.
  - id: n2
    cau: Trang đi từ hợp âm ba ở các thể đảo, qua hợp âm rải gãy và hợp âm rải, đến bốn kiểu hình đệm cơ bản và vòng kết I–IV–I–V7–I ở nhiều giọng.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Khớp các mục ## của trang: Hợp âm ba ở các thể đảo, Hợp âm rải gãy, Hợp âm rải, Bốn kiểu hình đệm (bốn mục ###), Hòa âm bàn phím (bảng bảy giọng). Bản cũ viết "ở mọi giọng" ở index; trang dùng "nhiều giọng" cho đúng bảng bảy giọng. Review: đã kiểm các mục ## và ### của hop-am-rai.md: Hợp âm ba ở các thể đảo, Hợp âm rải gãy, Hợp âm rải, Bốn kiểu hình đệm (### 1.–4.), Hòa âm bàn phím: vòng kết I–IV–I–V7–I (bảng các giọng Đô, Sol, Fa, Rê…).'
    review: dung
  - id: n3
    cau: Phần lý thuyết nằm ở bài hợp âm ba (/opus/nhac-ly/10-hop-am-ba/) và hợp âm bảy (/opus/nhac-ly/11-hop-am-bay/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Cả hai trang đã có: src/content/docs/nhac-ly/10-hop-am-ba.md, 11-hop-am-bay.md. Review: đã kiểm link /opus/nhac-ly/10-hop-am-ba/ và /opus/nhac-ly/11-hop-am-bay/ có trong dist/."
    review: dung
  - id: n4
    cau: "Hợp âm ba có ba thể: thể gốc (nốt gốc ở dưới: Đô–Mi–Sol), thể đảo 1 (nốt ba ở dưới: Mi–Sol–Đô) và thể đảo 2 (nốt năm ở dưới: Sol–Đô–Mi)."
    loai: dinh-nghia
    nguon:
      - mount13
      - baylor-inv
      - omt-inversion
    ket_qua: dung
    ghi_chu: 'Mount ch. 13: "A triad with the root in the bass is said to be in root position", "A first inversion triad has the third in the bass", "A second inversion triad has the fifth in the bass". Baylor: thể gốc có quãng 5 và 3 trên nốt trầm, đảo 1 quãng 6 và 3, đảo 2 quãng 6 và 4. Ví dụ Đô: C–E–G, E–G–C, G–C–E đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/" ]
    luot_2_ghi_chu: "Thể gốc: nốt gốc ở bass; đảo 1: nốt ba; đảo 2: nốt năm (OMT). Các nốt Đô–Mi–Sol, Mi–Sol–Đô, Sol–Đô–Mi đúng."
  - id: n5
    cau: "Ở thể gốc, ba nốt cách nhau hai quãng 3; ở thể đảo, một trong hai khoảng trở thành quãng 4 (đảo 1: quãng 3 rồi quãng 4; đảo 2: quãng 4 rồi quãng 3)."
    loai: cau-truc
    nguon:
      - mount13
      - baylor-inv
    ket_qua: dung
    ghi_chu: 'Mount ch. 13: hợp âm ba xếp chồng quãng 3; đảo 2 (6/4) chứa quãng 4 và quãng 6 trên nốt trầm. Đếm: C–E–G = 3+3; E–G–C = 3+4 (Sol–Đô là quãng 4); G–C–E = 4+3 (Sol–Đô là quãng 4). Cột "Khoảng, từ dưới lên" của bảng khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/", "https://www.gmajormusictheory.org/Fundamentals/Ch13.pdf", "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: "Đô–Mi–Sol = 3 trưởng + 3 thứ (hai quãng ba xếp chồng). Đảo 1 Mi–Sol–Đô: 3 thứ rồi 4 đúng; đảo 2 Sol–Đô–Mi: 4 đúng rồi 3 trưởng. GM13 nói đảo có một quãng 4."
  - id: n6
    cau: "Chính khoảng rộng (quãng 4) quyết định ngón bấm: quãng 4 cần hai ngón cách xa nhau hơn."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên về ngón bấm, suy từ nQ; không trái nguồn nào.
  - id: n7
    cau: "Ngón bấm thể gốc: tay phải 1-3-5, tay trái 5-3-1."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Chưa chắc: ngón bấm 1-3-5 và 5-3-1 cho thể gốc là cách bấm chuẩn và được lô trước yêu cầu giữ (kiem-dinh/nhac-ly/10-hop-am-ba, 11-hop-am-bay), nhưng bản đọc được của MuseScore (bậc 3) không nêu số ngón cho thể gốc (\"The page doesn't give an explicit fingering for root position\"); Baylor chỉ có hình. Chưa tìm được nguồn bậc 1–2 viết ra con số. Review D4-gom (đổi nhãn): ngón bấm hợp âm khối là quy ước sư phạm có biến thể (MuseScore bậc 3: thể đảo 2 tay phải \"either a 1-3-5 or 1-2-4\"; Pianote ghi 1-2-5), không tìm được giáo trình đại học công khai viết ra con số (Baylor Piano Basics ch. 22 và Unit 53 chỉ ghi \"Pay careful attention to fingering\", số ngón nằm trong hình; Miami chỉ có ngón hợp âm rải; Evansville không có hợp âm khối). Đổi quy-tac thành khuyen-tap: đây là ngón bấm trang chọn và lô trước yêu cầu giữ (nhac-ly/10-hop-am-ba, 11-hop-am-bay), không phải sự kiện cần nguồn; không trái trang khác. Lượt 2 (dung) đối chiếu cùng nguồn MuseScore."
    luot_2: dung
    luot_2_nguon: [ "https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads", "https://openbooks.library.baylor.edu/pianobasics/?p=152" ]
    luot_2_ghi_chu: "Gốc: tay phải 1-3-5, tay trái 5-3-1 (nguồn nói tay trái vẫn 5-3-1 ở đảo 1; Baylor tay phải 1-2-3-5 cho rải)."
  - id: n8
    cau: "Ngón bấm thể đảo 1: tay phải 1-2-5, tay trái 5-3-1; ngón 2 ở nốt giữa tay phải để khoảng 2–5 (quãng 4 nằm trên) đủ rộng."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chưa chắc: chỉ có MuseScore (bậc 3, qua bản sao): "use a 1-2-5 fingering for each right-hand chord", tay trái "still use fingers 5, 3, and 1". Không có nguồn bậc 1–2 đọc được (Baylor chỉ để số ngón trong hình). Suy luận về quãng 4 nằm trên đúng: E–G–C, quãng 4 là G–C, ngón 2 và 5. Review D4-gom (đổi nhãn): ngón bấm hợp âm khối là quy ước sư phạm có biến thể (MuseScore bậc 3: thể đảo 2 tay phải "either a 1-3-5 or 1-2-4"; Pianote ghi 1-2-5), không tìm được giáo trình đại học công khai viết ra con số (Baylor Piano Basics ch. 22 và Unit 53 chỉ ghi "Pay careful attention to fingering", số ngón nằm trong hình; Miami chỉ có ngón hợp âm rải; Evansville không có hợp âm khối). Đổi quy-tac thành khuyen-tap: đây là ngón bấm trang chọn và lô trước yêu cầu giữ (nhac-ly/10-hop-am-ba, 11-hop-am-bay), không phải sự kiện cần nguồn; không trái trang khác. Lượt 2 (dung) đối chiếu cùng nguồn MuseScore.'
    luot_2: dung
    luot_2_nguon: [ "https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads" ]
    luot_2_ghi_chu: "Đảo 1: tay phải 1-2-5, tay trái 5-3-1 (nguồn nói đúng như vậy). Quãng 4 Sol–Đô nằm giữa ngón 2 và 5 nên hợp lý."
  - id: n9
    cau: "Ngón bấm thể đảo 2: tay trái 5-2-1 (ngón 2 ở nốt giữa vì quãng 4 nằm dưới); tay phải 1-3-5, có người dùng 1-2-4."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chưa chắc: chỉ có MuseScore (bậc 3): đảo 2 tay phải "either a 1-3-5 or 1-2-4 fingering will work fine", tay trái "Use a 5-2-1 fingering". Khớp trang, nhưng chỉ có nguồn bậc 3. Review D4-gom (đổi nhãn): ngón bấm hợp âm khối là quy ước sư phạm có biến thể (MuseScore bậc 3: thể đảo 2 tay phải "either a 1-3-5 or 1-2-4"; Pianote ghi 1-2-5), không tìm được giáo trình đại học công khai viết ra con số (Baylor Piano Basics ch. 22 và Unit 53 chỉ ghi "Pay careful attention to fingering", số ngón nằm trong hình; Miami chỉ có ngón hợp âm rải; Evansville không có hợp âm khối). Đổi quy-tac thành khuyen-tap: đây là ngón bấm trang chọn và lô trước yêu cầu giữ (nhac-ly/10-hop-am-ba, 11-hop-am-bay), không phải sự kiện cần nguồn; không trái trang khác. Lượt 2 (dung) đối chiếu cùng nguồn MuseScore.'
    luot_2: dung
    luot_2_nguon: [ "https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads" ]
    luot_2_ghi_chu: "Đảo 2: tay trái 5-2-1; tay phải 'either 1-3-5 or 1-2-4' (nguồn). Pianote ghi 1-2-5 cho tay phải: cách dạy khác nhau, câu vẫn đúng."
  - id: n10
    cau: "Để đi qua các thể đảo mà âm thanh vẫn liền: tạo hình trước; cẳng tay đưa bàn tay đi; thả trọng lượng rồi nhả lực (cả ba ngón chạm đáy phím cùng lúc, ngay sau đó chỉ giữ phím vừa đủ); nốt trên cùng hát (hơi dồn trọng lượng về ngón 5 tay phải)."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập, đồng bộ trang tieng-dan (đã chuyển).
  - id: n11
    cau: Nếu ba nốt không vang cùng lúc, đặt sẵn ba ngón trên mặt phím rồi mới thả. Tập ở mọi giọng trưởng và thứ, mỗi tay riêng rồi hai tay; với hợp âm có phím đen, đẩy cả bàn tay vào sâu hơn thay vì duỗi thẳng ngón.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n12
    cau: Phần thể đảo trỏ tới /opus/piano/gam/ và /opus/piano/tieng-dan/.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "gam.md, tieng-dan.md đã có. Review: đã kiểm dòng 23–24: link /opus/piano/gam/ và /opus/piano/tieng-dan/ có trong dist/."
    review: dung
  - id: n13
    cau: Hợp âm rải gãy chơi các nốt của hợp âm lần lượt thay vì cùng lúc, nhưng bàn tay vẫn giữ nguyên thế hợp âm.
    loai: dinh-nghia
    nguon:
      - onmusic-arpeggio
      - baylor-arp
    ket_qua: dung
    ghi_chu: 'onmusic (arpeggio): "A broken chord in which the individual notes are sounded one after the other instead of simultaneously"; Baylor: "Arpeggios are chords played one note at a time". Phần "bàn tay giữ nguyên thế hợp âm" và việc dùng tên "hợp âm rải gãy" cho khác với "hợp âm rải" nhiều quãng tám là cách gọi riêng của trang (khối abc 2 chứng minh: mỗi nhóm bốn nốt nằm trong một thế tay). Tên "hợp âm rải gãy" chưa có trong src/data/thuat-ngu.yml.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/broken-chord", "https://www.britannica.com/art/Alberti-bass" ]
    luot_2_ghi_chu: "Oxford: hợp âm rải gãy là các nốt chơi lần lượt thay vì cùng lúc. Ý 'bàn tay giữ thế hợp âm' là lời dạy kỹ thuật, không mâu thuẫn."
  - id: n14
    cau: "Đây là cầu nối giữa hợp âm khối và hợp âm rải: chưa phải luồn ngón, chỉ đổi thế tay ở mỗi thể đảo. Để cẳng tay xoay nhẹ theo hướng các nốt, thay vì để từng ngón tự gõ. Khi tay phải chơi tới ngón 5, tay đã chuẩn bị thế của nhóm sau."
