    ghi_chu: 'KHỚP: kiem-dinh/nhac-ly/10-hop-am-ba, 11-hop-am-bay, 12-hoa-am-chuc-nang, bat-dau/lo-trinh-choi, piano/10-bai-dau-tien, piano/index, luyen-tai/choi-bang-tai, luyen-tai/nghe-tien-trinh. Các neo có trong dist: bon-kieu-hinh-em, hoa-am-ban-phim-vong-ket-iiviv7i, 3-bass-alberti. piano/index: hop-am-rai có mục Hợp âm ba ở các thể đảo, Bốn kiểu hình đệm, vòng kết I–IV–I–V7–I: đủ. Chữ "mọi giọng" trong piano/index chỉ là mô tả; trang chứa bảng bảy giọng (Đô, Sol, Fa, Rê, Si♭, La, Mi♭) và ví dụ La thứ. Review: đã kiểm bảng thể đảo (dòng 13–16), hình đệm valse và Alberti (### 2., ### 3.), dist/piano/hop-am-rai/index.html có id="bon-kieu-hinh-em", "hoa-am-ban-phim-vong-ket-iiviv7i", "3-bass-alberti"; khối 4 IV [C,F,A,] thể đảo 2, V [B,,D,G,] thể đảo 1; bảng vòng kết có Đô, Sol, Fa.'
