    ket_qua: dung
    ghi_chu: "Mount ch. 19: cảm âm lên bậc nhất; nốt bảy xuống bậc ba (Fa → Mi); nốt gốc giữ làm nốt chung. Khớp quiz câu 4."
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/02%3A_Diatonic_Polyphony_and_Functional_Harmony/2.09%3A_The_Dominant_Seventh_Chord" ]
    luot_2_ghi_chu: "HMS: 'always move ti to do and fa to mi'; Mount: 7̂→1̂, 4̂→3̂. Sol là nốt chung gốc giữ nguyên (trong bản bỏ nốt 5, Sol là bass và nốt gốc)."
  - id: n50
    cau: "Ngón bấm tay phải: 1-3-5 cho I và IV, 1-4-5 cho V7; tay trái đặt ngón 1 trên Đô3, ngón 5 trên Fa2, ngón 4 trên Sol2: cả vòng kết không phải dời tay."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Ngón bấm do trang đặt (khối abc 8 có !1!C, !5!F,, !4!G,,; tay phải không đánh số trong khối). Kiểm: Đô3 là C,, Fa2 là F,,, Sol2 là G,,: năm nốt trong khoảng F2–C3, vừa một thế tay. Tay phải: I Đô–Mi–Sol 1-3-5; IV Đô–Fa–La 1-3-5; V7 Si–Fa–Sol 1-4-5 (Si ngón 1, Fa ngón 4, Sol ngón 5): hợp lý, không trái nguồn nào. Review: đã kiểm dòng 187 và khối abc 8: tay trái !1!C, (Đô3), !5!F,, (Fa2), !4!G,, (Sol2); tay phải [CEG] [CFA] [B,FG]. (Ghi chú lượt 1 \"Đô3 là C,,\" là nhầm ký hiệu abc: C, là Đô3; trang đúng.)"
    review: dung
  - id: n51
    cau: "Cùng hình bàn tay ấy chuyển sang các giọng khác (bảng bảy giọng: Đô, Sol, Fa, Rê, Si♭, La, Mi♭): nốt dưới cùng của tay phải là chủ âm (ở I và IV) và cảm âm (ở V7); tay trái chơi gốc – IV – gốc – V – gốc."
    loai: cau-truc
    nguon:
      - mount19
      - mount22
    ket_qua: dung
    ghi_chu: "Dựng từng hàng bằng dẫn giọng gần nhất (đối chiếu Mount ch. 18–19): Sol: G–B–D, G–C–E, F♯–C–D (V7 của Sol = D F♯ A C, bỏ A), tay trái Sol Đô Sol Rê Sol. Fa: F–A–C, F–B♭–D, E–B♭–C; Rê: D–F♯–A, D–G–B, C♯–G–A; Si♭: B♭–D–F, B♭–E♭–G, A–E♭–F; La: A–C♯–E, A–D–F♯, G♯–D–E; Mi♭: E♭–G–B♭, E♭–A♭–C, D–A♭–B♭. Mọi ô khớp (cả chữ viết và nốt dưới cùng chủ âm/cảm âm). Bảng không có giọng thứ ở dạng bảng."
    luot_2: dung
    luot_2_nguon: [ "https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/", "https://pressbooks.nebraska.edu/openmusictheory/?p=361" ]
    luot_2_ghi_chu: "Theo mẫu I, IV, V7 ở bảy giọng: nốt thấp nhất tay phải là chủ âm ở I và IV, cảm âm ở V7; tay trái gốc–IV–gốc–V–gốc. Đúng theo cấu tạo hợp âm đã nêu ở n47/n48; bảng bảy giọng là phần về site không kiểm riêng từng giọng."
  - id: n52
    cau: "Giọng thứ (La thứ): La–Đô–Mi, La–Rê–Fa, La–Đô–Mi, Sol♯–Rê–Mi, La–Đô–Mi; V7 lấy cảm âm từ gam thứ hòa âm."
    loai: cau-truc
    nguon:
      - mount19
    ket_qua: dung
    ghi_chu: "Mount ch. 19: trong thứ nâng cảm âm (G → G♯ ở La thứ). IV của La thứ = D–F–A: La–Rê–Fa (đảo 2); V7 = E–G♯–B–D bỏ B: G♯–D–E = Sol♯–Rê–Mi. Đúng."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/04%3A_Diatonic_Harmony_Tonicization_and_Modulation/4.02%3A_Strengthening_Endings_with_V7" ]
    luot_2_ghi_chu: "La thứ: I La–Đô–Mi, iv La–Rê–Fa (iv đảo 2 của Rê thứ), V7 thiếu nốt 5: Sol♯–Rê–Mi. OMT: ở giọng thứ dùng ti (nốt Sol♯) trong V7 để hợp âm là trưởng-thứ (7)."
