  - id: n38
    cau: "Hình đệm rải rộng tay trái: nốt gốc, quãng 5, rồi quãng 10 (nốt ba ở quãng tám trên); nếu tay nhỏ, thay nốt quãng 10 bằng quãng 8 (Đô–Sol–Đô)."
    loai: cau-truc
    nguon:
      - mount13
    ket_qua: dung
    ghi_chu: "Khối abc 7: C2 G2 E3 G2: từ Đô2 đến Sol2 là quãng 5, đến Mi3 là quãng 10 (một quãng tám cộng quãng 3: Mount ch. 13, nốt ba cách gốc quãng 3). Quãng 8 thay cho quãng 10: Đô–Sol–Đô (C2 G2 C3) đúng. Suy luận trực tiếp từ khối nhạc, nguồn chỉ cho quãng ba/năm."
    luot_2: dung
    luot_2_nguon: [ "https://fass.open.ac.uk/sites/fass.open.ac.uk/files/files/music/A%20Level%20Music%20Chopin%20Nocturne%20Em%20Op72%201.pdf", "https://files.schudio.com/great-sankey-high-school/files/documents/Chopin_Nocturne_in_E_minor.pdf" ]
    luot_2_ghi_chu: "Hình đệm rải rộng nocturne: nốt trầm rồi rải lên (OU: tay trái 'spread over two octaves'); Đô–Sol–Mi' = gốc, 5, 10 đúng theo cấu tạo; bản thay bằng Đô–Sol–Đô' hợp lý cho tay nhỏ. Nguồn không nêu quãng 10 cụ thể."
  - id: n39
    cau: Đây là kết cấu quen thuộc của nocturne thời Lãng mạn (đệm rải ở tay trái, nhờ bàn đạp mà các nốt hòa thành một nền âm thanh).
    loai: lich-su
    nguon:
      - libretexts-nocturne
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "kết cấu quen thuộc của nocturne và các bài hát không lời thời Lãng mạn". LibreTexts (Music Appreciation, trích Wikipedia): nocturne Lãng mạn "characteristically features a cantabile melody over an arpeggiated, even guitar-like accompaniment"; nocturne Chopin Đô♯ thứ có arpeggio ở tay trái, "commonly found in other nocturnes as well", tay trái duỗi rộng. Không có nguồn cho "bài hát không lời" (Lieder ohne Worte) nên bỏ. Bàn đạp trong chú thích: nguồn không nêu; là lời khuyên (xem câu sau). Chưa chắc: LibreTexts lặp lại câu Wikipedia, chỉ cho khẳng định chung "đệm rải", không nói "rải rộng".'
    luot_2: dung
    luot_2_nguon: [ "https://fass.open.ac.uk/sites/fass.open.ac.uk/files/files/music/A%20Level%20Music%20Chopin%20Nocturne%20Em%20Op72%201.pdf", "https://files.schudio.com/great-sankey-high-school/files/documents/Chopin_Nocturne_in_E_minor.pdf" ]
    luot_2_ghi_chu: "OU và bài Chopin Op. 72/1: tay trái trải rộng, dùng bàn đạp giữ hòa âm; giai điệu tay phải. Khớp mô tả."
  - id: n40
    cau: Nhờ bàn đạp mà mọi nốt hòa thành một nền âm thanh. Bàn tay mở ra và khép lại như chiếc quạt, cổ tay xoay theo hướng các nốt. Mỗi chữ Ped. là một lần đổi bàn đạp ngay sau nốt trầm mới.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập và chú thích khối abc 7 (có bốn chữ Ped., mỗi chữ ở ô đầu).
  - id: n41
    cau: "Tính chất của bốn kiểu đệm (bảng): hợp âm khối vững, đơn giản, như hợp xướng; nốt trầm và hợp âm nhịp nhàng, có bước nhún; bass Alberti chuyển động đều, trong trẻo; hợp âm rải rộng ngân vang, tràn đầy."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Nhận xét cảm nhận. Chữ cũ có cột "Hay gặp ở" (thánh ca, valse/minuet, sonata Cổ điển, nocturne), đã bỏ cả cột vì không kiểm được "hay gặp" và các thể loại; hai phần tử vẫn còn ở thân bài (K. 545, nocturne).
  - id: n42
    cau: Cột "Hay gặp ở" của bảng bốn kiểu đệm (thánh ca, bài hát, valse, minuet, nhạc khiêu vũ, sonata và sonatina Cổ điển, nocturne, bài hát không lời).
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ cả cột: không kiểm được mức độ "hay gặp" và liệt kê thể loại; các ý đáng giữ (Alberti ở K. 545, rải rộng ở nocturne) đã có trong thân bài. Review D4-gom: đã kiểm trang không còn cột "Hay gặp ở" (bảng bốn kiểu đệm chỉ còn cột Tính chất).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/Alberti-bass", "https://fass.open.ac.uk/sites/fass.open.ac.uk/files/files/music/A%20Level%20Music%20Chopin%20Nocturne%20Em%20Op72%201.pdf" ]
    luot_2_ghi_chu: "Cột 'Hay gặp ở' ghép kiểu đệm với thể loại. Xác nhận được: Alberti (Britannica: nhạc phím đàn thế kỷ 18; Oxford), nocturne (OU, Schudio), valse nhịp 3/4 (Oxford). Phần thánh ca, minuet, nhạc khiêu vũ, bài hát không lời là liên hệ phổ biến nhưng không có trang đã mở nào nêu rõ. Không chắc cả cột."
  - id: n43
    cau: Hòa âm bàn phím (keyboard harmony) là chơi các tiến trình hợp âm cơ bản và chuyển chúng sang các giọng khác ngay trên bàn phím.
    loai: dinh-nghia
    nguon:
      - cms-keyboard-harmony
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "là chơi được các tiến trình hợp âm cơ bản ở mọi giọng mà không cần nhìn bản nhạc" (điều kiện "không cần nhìn bản nhạc" và "mọi giọng" không có nguồn). CMS Symposium (vol. 22): hòa âm bàn phím gồm chơi tiến trình hợp âm và chuyển giọng, hòa âm giai điệu, bè trầm số, ký hiệu hợp âm, đệm ứng tác; bài báo không nêu "một định nghĩa" duy nhất, nên câu viết lại ở mức "chơi và chuyển giọng". Chưa chắc: nguồn bậc 2 không có câu định nghĩa nguyên văn.'
    luot_2: dung
    luot_2_nguon: [ "https://symposium.music.org/volume-22/articles-1752877059/a-re-evaluation-of-keyboard-harmony" ]
    luot_2_ghi_chu: "Bài của College Music Society: môn keyboard harmony gồm chơi các ví dụ hòa âm trên đàn và chuyển giọng ('transposing progressions to different keys'). Không có định nghĩa chính thức mở được, nhưng khớp mô tả."
  - id: n44
    cau: "Dẫn giọng gần nhất: mỗi nốt đi ít nhất có thể, nốt chung giữ nguyên."
    loai: dinh-nghia
    nguon:
      - mount19
      - cms-keyboard-harmony
    ket_qua: dung
    ghi_chu: 'Mount ch. 19: nốt chung (Sol) giữ nguyên khi V7 về I; cảm âm lên, nốt bảy xuống một bậc. Định nghĩa "đi ít nhất có thể" là cách diễn đạt phổ thông của dẫn giọng gần nhất (voice leading); đúng với bảng của trang (mọi bước nhảy là bậc liền hoặc giữ). Tên "voice leading" chưa có trong src/data/thuat-ngu.yml.'
    luot_2: dung
    luot_2_nguon: [ "https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/" ]
    luot_2_ghi_chu: "RWU: giữ nguyên nốt chung ('hold over all common tones') và các bè khác đi tới nốt gần nhất của hợp âm sau."
  - id: n45
    cau: "Vòng kết I–IV–I–V7–I: tay trái chơi nốt gốc, tay phải chơi ba nốt; đây là kết (cadence) bạn gặp ở cuối nhiều câu nhạc."
    loai: dinh-nghia
    nguon:
      - mount22
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ở cuối vô số câu nhạc, và là cách nhanh nhất để tay và tai hiểu chức năng hòa âm". Mount ch. 22: câu nhạc "ends with a cadence"; kết trọn là V hoặc V7 về I. "Vô số", "nhanh nhất" không kiểm được; sửa thành "nhiều câu nhạc" và "một cách". Vòng I–IV–I–V7–I chứa kết trọn V7–I (đúng). Câu sau của trang: "là một cách để tay và tai hiểu chức năng hòa âm" là lời khuyên.'
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/cadences.html", "https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/" ]
    luot_2_ghi_chu: "MT21C: IV–I là cadence plagal, V–I là cadence authentic; chuỗi I–IV–I–V7–I gồm cả hai. Palmer/Manus/Lethco dùng đúng chuỗi này trong 'Cadences'."
