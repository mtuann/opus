khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Đoạn A ô 1–16, 3/4, L:1/8, K:G. Ấn bản: Bach-Gesellschaft qua Mutopia anna-magdalena-04 (.ly và .mid). Công cụ: script Python (mido) in nốt MIDI theo ô, đối chiếu từng nốt cả hai tay với khối ABC. Kết quả: 16/16 ô khớp cao độ và trường độ cả hai tay (tay trái ô 1 hợp âm Sol3–Si3–Rê4 nửa ô + La3; ô 7 Rê4 Si3 Sol3; ô 8 Rê4 Rê3 Đô4 Si3 La3; ô 15–16 Đô4 Rê4 Rê3 | Sol3 Sol2). Khác bản gốc đúng như trang nói: bỏ dấu trang trí (mordent ô 3, 5, 11, 13; appoggiatura ô 8). Số ngón chơi được.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4, mỗi ô 6 móc đơn. Đúng điều trang nói: nốt đen có dấu chấm (tách), móc đơn trong dấu luyến (ô 1, 3). Hòa âm Sol – Sol – Rê – Sol hợp giai điệu. Ngón tay phải 1-2-3-4-5, 5-4-3, 4-3-2-1-2; tay trái 5-3-1, 3-4-5, 1-3-5: chơi được, vừa chặng 2.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: '5 ô 3/4. Ô 1–2 tay phải giữ Si4, La4 trong khi tay trái chạy; ô 2 tay trái đúng hình ô 8 của bài (đối chiếu MIDI Mutopia); ô 3–4 đổi vai (tay phải Sol4–Rê5, Đô5–Fa♯4; tay trái Sol3, Rê4 giữ). Hòa âm Sol – Rê7 – Sol – Rê – Sol. Ngón chơi được.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, so-ngon ]
    ket_qua: dung
    ghi_chu: '6 ô 3/4, đủ phách (ô 2: g2 z G G2 = 6 móc đơn). Tay phải Sol5 ngón 5 xuống Sol4 ngón 1 với dấu lặng ngắn dần; ô 3 đúng ô 4 của bài. Tay trái ô 4–6 nhảy Rê4–Rê3, rồi hình ô 8 và Sol3–Sol2 (ô 16 của bài). Đúng điều trang nói.'
doi_chu:
  - cu: "Nghe ít nhất hai bản: một bản trên harpsichord (Gustav Leonhardt, Igor Kipnis hay Richard Egarr đều đã thu bài này) hoặc trên clavichord (Mahan Esfahani), và một bản trên piano. Mỗi lần nghe, chú ý một điều:"
    moi: "Nghe ít nhất hai bản: một bản trên harpsichord hoặc clavichord (ví dụ Igor Kipnis, hay Mahan Esfahani trên clavichord), và một bản trên piano. Mỗi lần nghe, chú ý một điều:"
    ly_do: "n28 (da-sua): bản thu của Kipnis (Apple Music, Nonesuch) và Esfahani (Hyperion, clavichord) có ghi bài này; chưa tìm được danh mục đĩa ghi bản thu của Leonhardt và Egarr."
  - cu: Tay phải chạy móc đơn khi tay trái giữ nốt dài; ở ô 8 và 12 thì ngược lại
    moi: Tay phải chạy móc đơn khi tay trái giữ nốt dài; ở ô 8 và 12 thì tay trái chạy móc đơn
    ly_do: "n47 (da-sua): ô 12 tay phải chơi nốt đen, không giữ nốt dài (Mutopia, Bach-Gesellschaft)."
  - cu: "Hans-Joachim Schulze, bài viết về cặp minuet và tổ khúc của Petzold, Bach-Jahrbuch 1979 (in năm 1980): bằng chứng chính cho việc ghi tên Petzold."
    moi: "Hans-Joachim Schulze, bài viết về cặp minuet và tổ khúc của Petzold, Bach-Jahrbuch 65 (1979), tr. 45–64 (bản số hóa): bằng chứng chính cho việc ghi tên Petzold."
    ly_do: "n79 (da-sua): số tập và trang theo bản số hóa đã đọc; năm in 1980 không có nguồn đọc được."
  - cu: "Năm 1725, J. S. Bach bắt đầu cuốn sổ tay âm nhạc thứ hai cho vợ, ca sĩ Anna Magdalena Bach. Cuốn sổ mở đầu bằng hai partita của chính Bach; phía sau là những bài nhỏ được chép vào dần: minuet, polonaise, aria, bài hát. Anna Magdalena tự tay chép các bài số 3 đến 11. Bài số 3 là một minuet Fa trưởng khuyết danh; bài số 4 và 5 là cặp minuet Sol trưởng và Sol thứ. Có thể Bach mang chúng về sau chuyến đi Dresden tháng 9 năm 1725, khi ông biểu diễn trên cây organ Silbermann mới của nhà thờ Sophienkirche, nơi Petzold là nghệ sĩ organ. Nhiều khả năng các bài dễ này dùng để dạy các con nhỏ trong nhà."
    moi: "Năm 1725, J. S. Bach bắt đầu cuốn sổ tay âm nhạc thứ hai cho vợ, ca sĩ Anna Magdalena Bach. Cuốn sổ mở đầu bằng hai partita của chính Bach; phía sau là những bài nhỏ được chép vào dần: minuet, polonaise, aria, bài hát. Anna Magdalena tự tay chép nhiều bài, trong đó có cặp minuet này. Bài số 3 là một minuet Fa trưởng khuyết danh; bài số 4 và 5 là cặp minuet Sol trưởng và Sol thứ. Có thể Bach mang chúng về sau chuyến đi Dresden tháng 9 năm 1725, khi ông biểu diễn trên cây organ Silbermann mới của nhà thờ Sophienkirche, nơi Petzold là nghệ sĩ organ."
    ly_do: "n6 (da-sua): không tìm được nguồn đọc được cho các bài 3–11; IMSLP ghi nguồn sớm nhất của BWV Anh. 114 là bản Anna Magdalena chép. n9 (da-bo): chỉ thấy ở Wikipedia (dẫn sách in); không có nguồn bậc 1–2 đọc được."
