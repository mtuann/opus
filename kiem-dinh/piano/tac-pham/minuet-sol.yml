ghi_chu: 'Bài học Minuet Sol trưởng BWV Anh. 114 (tầng Tác phẩm). Bản nhạc: tệp LilyPond và MIDI của Mutopia (anna-magdalena-04, nguồn Bach-Gesellschaft), đối chiếu từng nốt bằng script Python (mido) đọc MIDI Mutopia theo ô (script ở thư mục tạm, không trong repo). Lịch sử: bài của Hans-Joachim Schulze, Bach-Jahrbuch 65 (1979), tr. 45–64, bản số hóa trên bjb.publia.org (ảnh scan; đã đọc tr. 45, 52–58, 64). IMSLP mở qua WebFetch (curl bị trang kiểm tra bot). Bach-Digital không mở. Sửa trang ở lượt 1: n6 (người chép), n9 (bỏ câu dạy con, không có nguồn đọc được), n28 (bỏ tên Leonhardt và Egarr), n47 (ô 8 và 12), n79 (mục Nguồn: số tập, trang và link bản số hóa của bài Schulze). Còn mở: n11, n74, n75 (năm 1950 và nghĩa "Anh. II" chỉ thấy ở Wikipedia). Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi hay thành phần), mốc tham khảo trong ::khoi-nghe.'
