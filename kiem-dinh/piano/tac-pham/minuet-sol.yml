nhan_dinh:
  - id: n1
    cau: 'Bản minuet này thường được gọi là "Minuet của Bach".'
    loai: ten
    nguon: [ imslp-anh114, cbs-lover ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "formerly attributed to Johann Sebastian Bach as BWV Anhang 114"; CBS: "it was assumed that it was composed by Johann Sebastian Bach".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=75", "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)" ]
    luot_2_ghi_chu: Mutopia và Bach-Gesellschaft (BG 43.2, 1894) in bài dưới tên J. S. Bach; IMSLP ghi 'formerly attributed to Bach'. Tên 'Minuet của Bach' là tên quen gọi.
  - id: n2
    cau: Bài có hai bè độc lập (tay trái không đệm hợp âm mà đi một đường bè trầm riêng, lúc đứng yên, lúc chạy).
    loai: cau-truc
    nguon: [ mut-anh114 ]
    ket_qua: dung
    ghi_chu: 'Mutopia: bè trầm một nốt mỗi lúc, chỉ có hợp âm ở ô 1, 25, 26, 29, 32; ô 2–6 nốt trắng chấm dôi, ô 8, 12 chạy móc đơn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh114/anna-magdalena-04/anna-magdalena-04.ly" ]
    luot_2_ghi_chu: "Mutopia id 75 (theo BG), file .ly và PDF: tay trái đi bè trầm riêng (nốt trắng chấm dôi ô 2–6; chạy móc đơn ô 8, 12)."
  - id: n3
    cau: Bài gồm bốn câu 8 ô, mỗi câu chia đôi thành hai nửa 4 ô; tổng 32 ô.
    loai: cau-truc
    nguon: [ mut-anh114, schulze-1979 ]
    ket_qua: dung
    ghi_chu: 'Mutopia: hai đoạn nhắc lại, mỗi đoạn 16 ô; Schulze tr. 55 ghi "16 :||: 16 T." cho Menuet alternativement. Kết ở ô 8, 16, 24, 32.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh114/anna-magdalena-04/anna-magdalena-04.ly" ]
    luot_2_ghi_chu: "Mutopia id 75 (theo BG), file .ly và PDF: đếm được 32 ô (16 + 16, mỗi đoạn có dấu nhắc lại). Chia câu 8 ô và nửa câu 4 ô hợp với kết nửa ô 8, kết trọn ô 16, 24 (Rê), 32."
  - id: n4
    cau: Bản gốc gần như không ghi dấu luyến hay sắc thái.
    loai: cau-truc
    nguon: [ mut-anh114 ]
    ket_qua: dung
    ghi_chu: Bản Mutopia theo Bach-Gesellschaft không có dấu luyến, sắc thái hay tốc độ; chỉ có dấu trang trí (n63).
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh114/anna-magdalena-04/anna-magdalena-04.ly", "https://www.henle.de/media/09/da/7c/1690886061/0349-1690886061-sync.pdf" ]
    luot_2_ghi_chu: "Bản BG (qua Mutopia) không có dấu luyến hay sắc thái nào, chỉ có dấu trang trí. Henle HN 349: dấu trong ngoặc là dấu không có trong nguồn. Lượt 2 không xem trực tiếp bản chép tay P 225."
  - id: n5
    cau: 'Kỹ năng của bài: mở rộng thế tay năm ngón, đổi vị trí tay, nhảy quãng tám ở cả hai tay, đọc Fa♯ và Đô♯.'
    loai: cau-truc
    nguon: [ mut-anh114 ]
    ket_qua: dung
    ghi_chu: 'Nhảy quãng tám tay phải Sol5–Sol4 (ô 4, 12); tay trái Rê4–Rê3 (ô 8), Sol3–Sol2 (ô 16); Fa♯ trong hóa biểu, Đô♯ ở ô 20–23.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh114/anna-magdalena-04/anna-magdalena-04.ly" ]
    luot_2_ghi_chu: "Mutopia id 75 (theo BG), file .ly và PDF: có đổi thế tay (ô 3, 7), nhảy quãng tám tay phải (ô 4, 12) và tay trái (ô 8 Rê4→Rê3, ô 16 Sol3→Sol2, ô 20 La3→La2), có Fa♯ và Đô♯ (ô 20–23)."
  - id: n6
    cau: 'Năm 1725, J. S. Bach bắt đầu cuốn sổ tay âm nhạc thứ hai cho vợ, Anna Magdalena Bach; sổ mở đầu bằng hai partita của Bach, sau là những bài nhỏ (minuet, polonaise, aria, bài hát); Anna Magdalena tự tay chép nhiều bài, trong đó có cặp minuet này.'
    loai: lich-su
    nguon: [ imslp-nb, imslp-anh114, schulze-1979 ]
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Anna Magdalena tự tay chép các bài số 3 đến 11." Không tìm được nguồn đọc được nói đúng các bài 3–11 (Bach-Digital, NBA V/4 không mở). IMSLP Anh. 114: nguồn sớm nhất là bản "copied by Anna Magdalena Bach"; IMSLP notebook: số 1 BWV 827, số 2 BWV 830 (partita), rồi minuet, polonaise, aria, choral; người chép gồm Anna Magdalena và nhiều người khác. Schulze tr. 64: sổ bắt đầu nửa sau năm 1725. Mới: "Anna Magdalena tự tay chép nhiều bài, trong đó có cặp minuet này."'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/09/da/7c/1690886061/0349-1690886061-sync.pdf", "https://imslp.org/wiki/Notebooks_for_Anna_Magdalena_Bach_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "Henle HN 349 (lời tựa): sổ 1725 mở đầu bằng hai partita BWV 827 và 830 do Bach chép, sau đó là nhiều bài nhỏ; phần lớn do Anna Magdalena chép. IMSLP: số 3–5 minuet, polonaise, aria, chorale. IMSLP trang Anh. 114 ghi bản chép tay của Anna Magdalena (P 225, tr. 44)."
  - id: n7
    cau: Bài số 3 là một minuet Fa trưởng khuyết danh; bài số 4 và 5 là cặp minuet Sol trưởng và Sol thứ.
    loai: danh-muc
    nguon: [ imslp-nb ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "3. Menuet F-dur, BWV Anh.113; 4. Menuet G-dur, BWV Anh.114; 5. Menuet g-moll, BWV Anh.115" (bài 3 không ghi tác giả). Schulze tr. 64 chú thích 84: nguồn gốc của số 3 (BWV Anh. 113) còn chưa rõ.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Notebooks_for_Anna_Magdalena_Bach_(Bach,_Johann_Sebastian)", "https://imslp.org/wiki/Minuet_in_F_major,_BWV_Anh.113_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "IMSLP: số 3 Menuet F-dur BWV Anh. 113 (IMSLP: 'Bach's authorship of this work is uncertain', không ghi tác giả), số 4 Menuet G-dur Anh. 114, số 5 Menuet g-moll Anh. 115."
  - id: n8
    cau: Có thể Bach mang hai minuet về sau chuyến đi Dresden tháng 9 năm 1725, khi ông biểu diễn trên cây organ Silbermann mới của nhà thờ Sophienkirche, nơi Petzold là nghệ sĩ organ.
    loai: lich-su
    nguon: [ schulze-1979 ]
    ket_qua: dung
    ghi_chu: 'Schulze tr. 64: "das „Dresdner Menuett" BWV Anh. 114/115 als beziehungsvolles Mitbringsel von jener Reise im September 1725 ... dem Christian Petzold bereitwillig seinen Platz an der neuesten und schönsten Orgel der Stadt einräumte". Tr. 57: organ Silbermann ở Sophienkirche khánh thành 18/11/1720; Petzold là Sophienorganist. Trang viết "có thể", đúng mức giả thuyết của Schulze.'
    luot_2: dung
    luot_2_nguon: [ "https://bjb.publia.org/bjb/article/view/1686" ]
    luot_2_ghi_chu: "Schulze (BJ 1979, tr. 61): giả thuyết cặp minuet là quà mang về từ chuyến đi Dresden tháng 9/1725, khi Petzold nhường Bach chỗ chơi cây organ mới nhất của thành phố; tr. 57: organ Silbermann ở Sophienkirche khánh thành 1720, Petzold là organist Sophienkirche. Câu viết 'có thể' đúng với mức giả thuyết."
  - id: n9
    cau: Nhiều khả năng các bài dễ này dùng để dạy các con nhỏ trong nhà.
    loai: lich-su
    nguon: [ wiki-minuets ]
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang. Chỉ thấy ở Wikipedia (dẫn Schulenberg 2006, sách in); Schulze không nói. Không có nguồn bậc 1–2 đọc được.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/09/da/7c/1690886061/0349-1690886061-sync.pdf" ]
    luot_2_ghi_chu: "Henle HN 349 (lời tựa): một số bài trong sổ 'fulfilled an educational purpose in the musical instruction of the children'."
  - id: n10
    cau: Vì sổ tay không ghi tên tác giả cho phần lớn các bài, các nhà xuất bản thế kỷ 19 in chúng như nhạc của Bach.
    loai: lich-su
    nguon: [ imslp-anh114, mut-anh114 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Bach-Gesellschaft Ausgabe Bd. 43.2 (Waldersee, Breitkopf 1894) in bài trong toàn tập Bach; bài "formerly attributed to Johann Sebastian Bach". Tệp Mutopia (theo BG) ghi composer "Johann Sebastian Bach".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=75" ]
    luot_2_ghi_chu: "IMSLP: Bach-Gesellschaft Ausgabe tập 43.2 (1894) in bài trong tổng tập Bach; Mutopia (theo BG) vẫn ghi tác giả J. S. Bach."
  - id: n11
    cau: 'Danh mục tác phẩm Bach (BWV, 1950) xếp cặp minuet vào phụ lục (Anhang, viết tắt Anh.), nơi dành cho tác phẩm còn nghi vấn.'
    loai: danh-muc
    nguon: [ imslp-anh114, wiki-minuets ]
    ket_qua: null
    ghi_chu: 'chưa chắc: IMSLP ghi số "BWV Anh. II 114 / Anh. III 183" và "formerly attributed to Bach"; năm 1950 và nghĩa "Anh. II = tác phẩm nghi vấn" chỉ thấy ở Wikipedia (BWV Anh.). Bach-Digital, trang Breitkopf về BWV không đọc được chữ. Cùng điều ở câu hỏi 2 (n74, n75).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)", "https://imslp.org/wiki/Minuet_in_G_minor,_BWV_Anh.115_(Pezold,_Christian)" ]
    luot_2_ghi_chu: IMSLP ghi số danh mục 'BWV Anh. 114; BWV Anh. II 114 / Anh. III 183' (Anh. II của bản BWV 1950 là phần tác phẩm còn nghi vấn) và 'formerly attributed to Bach'. Năm 1950 và nghĩa của Anh. II chỉ thấy ở Wikipedia (BWV Anh.), chưa có nguồn bậc 2 nói rõ.
  - id: n12
    cau: 'Cuối thập niên 1970, Hans-Joachim Schulze chỉ ra rằng cặp minuet nằm trong một tổ khúc cho harpsichord mang tên Petzold.'
    loai: lich-su
    nguon: [ schulze-1979 ]
    ket_qua: dung
    ghi_chu: 'Schulze tr. 54: "eine Svite de Clavecin par C. Pezold"; tr. 56: "das Menuettpaar BWV Anh. 114/115 ... einer Cembalosuite des Dresdner Hoforganisten Christian Petzold entnommen".'
    luot_2: dung
    luot_2_nguon: [ "https://bjb.publia.org/bjb/article/view/1686" ]
    luot_2_ghi_chu: "Bach-Jahrbuch 65 (1979), tr. 45–64: Schulze công bố 'Svite de Clavecin par C. Pezold' trong tập chép tay của Tzschirich, có cặp minuet BWV Anh. 114/115."
  - id: n13
    cau: Tổ khúc do Johann Benjamin Tzschirich chép vào một tập nhạc khoảng giữa thập niên 1730.
    loai: lich-su
    nguon: [ schulze-1979 ]
    ket_qua: dung
    ghi_chu: 'Schulze tr. 52: Tzschirich là "Schreiber und Besitzer unserer Quelle"; tr. 54: tổ khúc thuộc các mục chép muộn nhất, "möglicherweise erst 1735/36 anzusetzen".'
    luot_2: dung
    luot_2_nguon: [ "https://bjb.publia.org/bjb/article/view/1686" ]
    luot_2_ghi_chu: "Schulze: tập nhạc của Johann Benjamin Tzschirich (ghi năm 1726); tổ khúc Petzold thuộc các bài chép muộn nhất, 'möglicherweise erst 1735/36'."
  - id: n14
    cau: Bài của Schulze đăng trên Bach-Jahrbuch số năm 1979.
    loai: nam
    nguon: [ schulze-1979 ]
    ket_qua: dung
    ghi_chu: Bach-Jahrbuch Bd. 65 (1979), tr. 45–64.
    luot_2: dung
    luot_2_nguon: [ "https://bjb.publia.org/bjb/article/view/1686" ]
    luot_2_ghi_chu: "Trang mục lục Bach-Jahrbuch Bd. 65 (1979): Schulze, 'Ein \"Dresdner Menuett\" im zweiten Klavierbüchlein der Anna Magdalena Bach', tr. 45–64."
  - id: n15
    cau: Từ đó, giới nghiên cứu ghi tên Petzold.
    loai: lich-su
    nguon: [ imslp-anh114, hyperion-esf ]
    ket_qua: dung
    ghi_chu: 'IMSLP xếp bài dưới tên "Pezold, Christian"; Hyperion (2023) ghi "Christian Pezold"; Apple Music ghi Christian Petzold.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)", "https://imslp.org/wiki/Category:Pezold,_Christian", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=75" ]
    luot_2_ghi_chu: IMSLP xếp bài dưới Pezold, Christian; Mutopia ghi 'attributed to Christian Petzold'.
  - id: n16
    cau: Link "Đọc tên tác phẩm" để hiểu cách đọc các ký hiệu như BWV hay Anh.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Trang đích nghe-nhac/doc-ten-tac-pham chưa chuyển; ../opus-zero/docs/nghe-nhac/doc-ten-tac-pham.md có bảng BWV và đoạn "Chữ Anh. (Anhang, phụ lục) trong BWV đánh dấu những tác phẩm còn nghi vấn". Lô chuyển trang ấy cần giữ phần BWV và Anh.'
  - id: n17
    cau: Từ điển âm nhạc của Johann Gottfried Walther (1732) nhắc đến Petzold như tác giả của những bản nhạc đàn phím hay.
    loai: lich-su
