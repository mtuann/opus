    moi: "Nếu chưa rải hợp âm đều và nhẹ, học trước Bach: Prelude Đô trưởng. Nếu chưa làm nổi được giai điệu trên phần đệm của cùng một tay, học Schumann: Träumerei, bài cùng chặng 5, nơi một bàn tay cũng phải vừa hát vừa đệm. Muốn trước hết một chương sonata trọn vẹn ở chặng 4: Op. 49 số 2."
    ly_do: "n12, n13: so sánh chưa có nguồn; viết theo trang đích và chặng đã khóa."
  - cu:
      - Năm 1802, Beethoven cho in hai sonata Op. 27 và đặt cho cả hai tên Sonata quasi una fantasia, "sonata gần như một fantasia". Thay vì mở đầu bằng một chương nhanh theo hình thức sonata như thông lệ, Op. 27 số 2 mở bằng một Adagio tĩnh lặng, tiếp theo là một Allegretto nhỏ nhắn ở Rê♭ trưởng, và để chương nhanh, kịch tính nhất, Presto agitato, ở cuối. Bản sonata được đề tặng nữ bá tước trẻ Giulietta Guicciardi, học trò của ông.
      - Cây đàn quan trọng để hiểu chương này. Trên nhiều cây đàn Vienna khoảng năm 1800, bộ giảm âm (những miếng nỉ đè lên dây để chặn tiếng) được nhấc lên bằng cần gạt đầu gối, còn đàn cũ hơn nữa dùng nút gạt bằng tay; tiếng đàn tắt nhanh và âm trầm mỏng hơn đàn hiện đại nhiều. Vì vậy chỉ dẫn bàn đạp ở đầu chương (xem phần Diễn tấu) không thể áp dụng y nguyên lên một cây đàn cánh ngày nay. Xem thêm Lịch sử cây đàn piano và thời kỳ Cổ điển.
