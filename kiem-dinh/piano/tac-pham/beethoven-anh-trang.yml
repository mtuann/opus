  - cu: "câu hỏi: Chỉ dẫn senza sordino ở đầu chương nghĩa là gì? | ✓ Không có bộ giảm âm: bộ giảm âm luôn nhấc lên, tức giữ bàn đạp vang | Không dùng bàn đạp trái (una corda) | Chơi không có tiếng đệm | Thời Beethoven, sordini là bộ giảm âm. Trên đàn hiện đại, người chơi thường đổi bàn đạp theo hòa âm, hoặc chỉ nhả một phần để giữ chút sương."
