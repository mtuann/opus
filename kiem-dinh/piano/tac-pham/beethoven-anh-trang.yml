  - cu: "Bản Urtext cho bạn đúng chữ của Beethoven. Các ấn bản cũ thường thêm ký hiệu bàn đạp, sắc thái và ngón bấm của người biên tập; bản Winterberger, chẳng hạn, ghi ngón đổi 5–4 và 4–5 trên các nốt giai điệu ngân dài ở ô 7–8. Ngón bấm cho chùm ba khác nhau nhiều giữa các ấn bản (1–2–3, 1–2–4 hay 1–3–5): chọn theo bàn tay của bạn, miễn ngón 4–5 luôn sẵn cho giai điệu."
    moi: "Bản Urtext cho bạn đúng chữ của Beethoven. Các ấn bản cũ có thể thêm ký hiệu bàn đạp, sắc thái và ngón bấm của người biên tập; bản Winterberger, chẳng hạn, ghi ngón đổi 5–4 và 4–5 trên các nốt giai điệu ngân dài ở ô 7–8. Ngón cho chùm ba đổi theo thế tay (ngay bản Winterberger ghi 1–3–5 ở ô 1, 1–2–4 ở đầu ô 3): chọn theo bàn tay của bạn, miễn ngón 4–5 luôn sẵn cho giai điệu."
    ly_do: "n91, n92: viết theo bản Winterberger đã đối chiếu; chưa mở ấn bản khác."
  - cu: "Cả bản sonata: chương 2 (Allegretto, Rê♭ trưởng) là bước tiếp theo nhẹ nhàng; chương 3 (Presto agitato) cần tốc độ và sức bền ở mức Grade 8 trở lên."
    moi: "Cả bản sonata: chương 2 (Allegretto, Rê♭ trưởng, 60 ô nhịp) ngắn; chương 3 (Presto agitato, 200 ô nhịp) khó hơn nhiều: Henle xếp cả bản sonata ở mức 7 và ghi ABRSM ARSM, bằng sau Grade 8."
    ly_do: "n94: theo IMSLP và Henle HN 1062."
