ghi_chu: 'Bài học Ánh trăng, chương 1 (tầng Tác phẩm). Bản nhạc: Mutopia moonlight (Stewart Holmes; nguồn Winterberger 1908; moonlight1-a4.ly và moonlight-mids.zip tải 05/11/2026, User-Agent opus-kiem-dinh), in nốt MIDI theo ô bằng script Python (mido): 69 ô, mọi số ô trên trang khớp. Lịch sử: lời tựa Henle HN 1062 (Gertsch, Perahia), Crumey, IMSLP; bàn đạp: Fitch (2017, trích Rosen), blog Henle. Sửa trang: n2, n6, n12, n13, n16, n18, n35 và n45 (ô 22 là hợp âm Đô♯ trưởng, không phải Đô♯ bảy, ở hai bảng), n88, n91, n92, n94, n104. Còn mở: n17 (chữ "trẻ" của nữ bá tước: chưa mở nguồn năm sinh; không đổi chữ), n87 ("cách thông dụng": giữ ở lời khuyên). Giữ cho hồ sơ khác: mục "### Bàn đạp: *senza sordino*" (id ban-ap-senza-sordino; piano/lich-su-dan n30, piano/ban-dap n62) không đổi; nốt Sol♯ lặp nhịp chấm dôi cuối ô 5, ô 6–9 (piano/not-lap-not-kep n10, n42); quãng tám Sol♯ ngân ở bè trầm ô 28–39 (piano/quang-tam-buoc-nhay n20, n45): đã đếm trên MIDI, đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ: chùm ba (liên ba móc đơn: trang dùng cả hai, như nhac-ly/15 dùng "liên ba"), hợp âm Napoli, senza sordino, una corda (thuat-ngu.yml). "Alla breve" chưa có bản ghi (như D6-L3).'
