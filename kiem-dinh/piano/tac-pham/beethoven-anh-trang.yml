  - cu: "Trên đàn của ông, giữ bộ giảm âm nhấc suốt chỉ tạo một làn sương mỏng, vì tiếng tắt nhanh. Trên đàn cánh hiện đại, cộng hưởng dày và kéo dài hơn nhiều; giữ nguyên bàn đạp qua các lần đổi hòa âm, nhất là khi bè trầm đổi, sẽ thành một khối âm thanh nhòe. Người chơi hôm nay có ba cách đọc chính:"
    moi: "Murray Perahia, trong lời tựa ấn bản Henle, cho rằng chỉ dẫn này không thể hiểu theo nghĩa đen: các hợp âm có thể hòa vào nhau, nhưng không được xóa mất nghĩa hòa âm, và chỗ hai hợp âm trái nhau (như trưởng và thứ ở ô 9–10) phải nghe rõ. Theo ông, chỉ dẫn có nghĩa là lúc nào cũng phải có tiếng bàn đạp. Giữ nguyên bàn đạp qua các lần đổi hòa âm, nhất là khi bè trầm đổi, sẽ làm nhòe đúng những chỗ ấy. Người chơi hôm nay có thể đọc chỉ dẫn theo ba cách:"
    ly_do: 'Review D6-L4-gom: n84: vế "làn sương mỏng, vì tiếng tắt nhanh" chỉ có ở blog Fitch; viết theo lời tựa Henle HN 1062 (Perahia: không hiểu theo nghĩa đen, giữ nghĩa hòa âm, ô 9–10, luôn có tiếng bàn đạp).'
