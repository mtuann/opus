      - giong
      - hop-am
      - ban-dap
      - so-ngon
    ket_qua: dung
    ghi_chu: '4 ô 2/2, K:Am. Bè trầm La, Sol–Fa, Mi–Mi, La; chữ Ped. ở nốt thứ hai của chùm ba đầu mỗi lần bè trầm đổi (ô 1, ô 2 phách 1 và 3, ô 3, ô 4), không có ở phách 3 ô 3 (Mi đánh lại, cùng hòa âm Mi rồi Mi bảy: Mi Sol♯ Si, Rê Sol♯ Si); dấu * ở ô cuối. Đúng lời dẫn; đủ phách.'
