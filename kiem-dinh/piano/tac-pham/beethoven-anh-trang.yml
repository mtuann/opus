  - id: n84
    cau: "Perahia (lời tựa Henle HN 1062): chỉ dẫn senza sordino không thể hiểu theo nghĩa đen; các hợp âm có thể hòa vào nhau nhưng không được xóa mất nghĩa hòa âm, chỗ trưởng và thứ va nhau ở ô 9–10 phải nghe rõ; chỉ dẫn nghĩa là lúc nào cũng có tiếng bàn đạp. Giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ làm nhòe những chỗ ấy."
    loai: "lich-su"
    nguon: [ "henle-1062-vorwort" ]
    ket_qua: "da-sua"
    ghi_chu: "Fitch: \"sustain was shorter ... surprisingly subtle\"; \"chaotic and immediately unacceptable\". Cùng ý trang đã khóa piano/ban-dap n48. Review D6-L4-gom: câu cũ \"Trên đàn của ông, giữ bộ giảm âm nhấc suốt chỉ tạo một làn sương mỏng, vì tiếng tắt nhanh; trên đàn cánh hiện đại … khối âm thanh nhòe\": vế đầu chỉ có ở blog Fitch. Viết lại theo lời tựa HN 1062 (review đọc PDF: \"Neither can be taken literally … I don't think they should obliterate the harmonic sense … the clash between major and minor at mm. 9 and 10 … there should always be a pedalled sound\"). Chữ mới có chi tiết lượt 2 chưa kiểm (ô 9–10): vào lượt 2 bổ sung. doi_chu. Kết quả lượt 2 cũ (cho chữ trước review) đã gỡ: luot_2 khong-chac; ghi chú lượt 2: \"Vế 'trên đàn hiện đại giữ bàn đạp qua các lần đổi hòa âm sẽ nhòe' hợp với Perahia (không được xóa nghĩa hòa âm), nhưng vế 'trên đàn của ông chỉ tạo làn sương mỏng vì tiếng tắt nhanh' chưa có nguồn bậc 2 đã mở.\"."
    review: "dung"
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/ca/21/5b/1697725842/1062-1697725842-sync.pdf", "https://www.henle.de/en/Piano-Sonata-no.-14-c-sharp-minor-op.-27-no.-2-Moonlight/HN-1062" ]
    luot_2_ghi_chu: "PDF phần đầu của HN 1062 (Vorwort, Preface, rồi 'Vorbemerkung / Introductory remarks' do Murray Perahia ký, tr. IX–X). Perahia viết: chỉ dẫn 'delicatissimo' như gió và 'without dampers (i. e. with pedal)', 'Neither can be taken literally'; 'Though chords can blend into each other to create a mystical sound, I don't think they should obliterate the harmonic sense. If two chords contradict each other (as for example the clash between major and minor at mm. 9 and 10) this should be clear and not be sacrificed for a tone colour. I think Beethoven's indication means that there should always be a pedalled sound.' Mọi vế khớp. Hai lưu ý nhỏ: (1) ý này nằm ở mục 'Lời dẫn' (Introductory remarks) của Perahia, in cùng lời tựa (Preface do Gertsch và Perahia cùng ký) trong phần đầu ấn bản, nên gọi chung là 'lời tựa' chấp nhận được; (2) câu cuối ('Giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ làm nhòe những chỗ ấy') là hệ quả suy ra, Perahia không viết nguyên văn, nhưng đúng với ý 'không được che mất nghĩa hòa âm'."
