      - doi-chieu-an-ban
    ket_qua: dung
    ghi_chu: 'Ô 1–9 (trong 69 ô), 2/2, L:1/8, K:C#m (bốn dấu thăng, như \key e \major của Mutopia). Ấn bản: Winterberger 1908 qua Mutopia moonlight1-a4.ly và moonlight1.mid (tải 05/11/2026). Công cụ: script Python (mido) in nốt MIDI theo ô và khuông, đọc .ly cho Rê♮, Si♯, phân khuông. Kết quả: 9/9 ô khớp từng nốt hai tay: chùm ba (G#3 C#4 E4 ×8; A3 C#4 E4 ×2, A3 D4 F#4 ×2; G#3 B#3 F#4, G#3 C#4 E4, G#3 C#4 D#4, F#3 B#3 D#4; E3 G#3 C#4 rồi G#3 C#4 E4; G#3 D#4 F#4; G#3 C#4 E4 ×2, A3 C#4 F#4 ×2; G#3 B3 E4 ×2, A3 B3 D#4 ×2; G#3 B3 E4 ×4), giai điệu (G#4 chấm dôi ở cuối ô 5, G#4, G#4 A4, G#4 F#4 B4, E4), bè trầm quãng tám (C#, B, A F#, G# G#, C# G# C#, B# G# B#, C# F#, B B, E). Trang ghi rõ hai chỗ khác bản in: mọi chùm ba để ở khuông trên (Winterberger để chùm ba đầu ô 5 cho tay trái), số ngón là gợi ý của trang.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - tiet-tau
      - so-ngon
      - hai-tay
    ket_qua: dung
    ghi_chu: '4 ô 2/2, L:1/8: mỗi ô bốn chùm ba (8 móc đơn) và giai điệu 6 + 3/2 + 1/2. Hòa âm Đô♯ thứ, Fa♯ thứ/Đô♯, Si♯ Rê♯ Fa♯ trên Sol♯ (át bảy), Đô♯ thứ. Giai điệu nhịp chấm dôi trên Đô♯5, ô 3 Si♯ ngón 4 rồi Đô♯ ngón 5: đúng lời dẫn. Ngón 1–2–3 cho chùm ba, 5 cho giai điệu chơi được.'
