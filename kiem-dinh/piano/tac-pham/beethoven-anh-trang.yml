  - id: n14
    cau: Năm 1802, Beethoven cho in hai sonata Op. 27 và đặt cho cả hai tên Sonata quasi una fantasia.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
      - imslp-op27-1
      - imslp-op27-2
    ket_qua: dung
    ghi_chu: 'Henle: op. 26, 27 số 1 và 27 số 2 "published in March 1802 by ... Johann Cappi"; tựa bản in đầu của số 2: "SONATA quasi una FANTASIA"; IMSLP số 1: tên khác "Sonata quasi una fantasia".'
  - id: n15
    cau: Sonata thời Haydn, Mozart thường mở bằng một chương nhanh; Op. 27 số 2 mở bằng một Adagio.
    loai: lich-su
    nguon:
      - cod-sonata
      - imslp-op27-2
    ket_qua: dung
    ghi_chu: 'COD: "The Haydn/Mozart sonata is usually in 3 movts., allegro–andante–allegro". "Theo hình thức sonata": COD "Most sonatas are written in sonata-form or a version of it".'
  - id: n16
    cau: Tiếp theo là một Allegretto ngắn ở Rê♭ trưởng, và chương nhanh Presto agitato ở cuối.
    loai: cau-truc
    nguon:
      - imslp-op27-2
    ket_qua: da-sua
    ghi_chu: 'IMSLP: Allegretto - Trio (D♭ major, 60 bars), Presto agitato (200 bars). Câu cũ: "nhỏ nhắn", "kịch tính nhất": đánh giá; đổi "ngắn" (60 ô), bỏ "kịch tính nhất" (doi_chu).'
  - id: n17
    cau: Bản sonata đề tặng nữ bá tước Giulietta Guicciardi, học trò của ông.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
      - fitch
      - imslp-op27-2
    ket_qua: null
    ghi_chu: 'chưa chắc: phần người được đề tặng và học trò đúng (Henle; Fitch: "his pupil, Countess Giulietta Guicciardi"; IMSLP: Dedication "Gräfin Giulietta Guicciardi"); chữ "trẻ" chưa có nguồn đã mở về năm sinh. Lượt 2 kiểm, hoặc bỏ chữ "trẻ".'
  - id: n18
    cau: Trên nhiều đàn Vienna khoảng 1800, bộ giảm âm được nhấc bằng cần gạt đầu gối; đàn cũ hơn dùng nút gạt bằng tay; tiếng đàn tắt nhanh hơn đàn hiện đại nhiều.
    loai: lich-su
    nguon:
      - tafelmusik
      - fitch
    ket_qua: da-sua
    ghi_chu: 'Tafelmusik (đàn kiểu Walter): "Knee levers are used to raise the dampers"; Fitch: "pianos were equipped with a handstop that lifted the dampers", "the sustain was shorter". Câu cũ có "và âm trầm mỏng hơn": không có nguồn đã mở, bỏ, như review D4-gom ở piano/ban-dap n48 (doi_chu).'
  - id: n19
    cau: Vì vậy chỉ dẫn bàn đạp không thể áp dụng y nguyên lên đàn cánh ngày nay (link Lịch sử cây đàn, thời kỳ Cổ điển).
    loai: quy-tac
    nguon:
      - fitch
    ket_qua: dung
    ghi_chu: 'Fitch: làm đúng chữ trên đàn hiện đại "produces chaotic and immediately unacceptable results". Link /opus/piano/lich-su-dan/, /opus/lich-su/thoi-ky/co-dien/ có.'
  - id: n20
    cau: Biệt danh "Ánh trăng" không phải của Beethoven.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
    ket_qua: dung
    ghi_chu: 'Henle: bản in đầu "simply as SONATA quasi una FANTASIA. Nowhere is there any allusion to the popular title".'
  - id: n21
    cau: Ludwig Rellstab (1799–1860), nhà thơ, nhà phê bình, người viết lời cho nhiều ca khúc trong Schwanengesang của Schubert.
    loai: nam
    nguon:
      - imslp-schwanengesang
      - crumey
    ket_qua: dung
    ghi_chu: 'IMSLP: "Nos.1-7: Ludwig Rellstab (1799–1860)"; Crumey: Rellstab viết bài điểm buổi diễn của Liszt năm 1842.'
  - id: n22
    cau: Rellstab tả chương này bằng mặt hồ lặng dưới ánh trăng mờ, sóng khẽ vỗ vào bờ tối, trong truyện ngắn Theodor đăng trên một tạp chí âm nhạc ở Berlin khoảng 1823–1824, khi Beethoven còn sống.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
      - crumey
    ket_qua: dung
    ghi_chu: 'Henle: "Theodor. Eine musikalische Skizze of 1823 ... The lake rests quiet under the light of the moon at twilight; the wave thuds against the dark bank" (Berliner Allgemeine musikalische Zeitung no. 32, 1824); Crumey: đăng nhiều kỳ mùa hè 1824.'
  - id: n23
    cau: Chuyện năm 1832 Rellstab ví bài với con thuyền dưới trăng trên hồ Lucerne bắt nguồn từ Beethoven et ses trois styles (1852) của Wilhelm von Lenz.
    loai: lich-su
    nguon:
      - crumey
    ket_qua: dung
    ghi_chu: 'Crumey: Lenz (1852): "Rellstab compare cette œuvre à une barque, visitant, par le clair de lune, les sites sauvages du lac des quatre cantons".'
  - id: n24
    cau: Lenz chỉ viết rằng Rellstab so sánh như thế "hai mươi năm trước"; năm 1832 là con số người đời sau suy ra.
    loai: lich-su
    nguon:
      - crumey
    ket_qua: dung
    ghi_chu: '"il y a vingt ans"; "if \"twenty years\" were taken literally, it would suggest a date of 1832".'
  - id: n25
    cau: Văn bản của Rellstab tả một mặt hồ, không có con thuyền nào và không nhắc tên hồ.
    loai: lich-su
    nguon:
      - crumey
      - henle-1062-vorwort
    ket_qua: dung
    ghi_chu: 'Đoạn văn trích ở Henle và Crumey không có thuyền, không tên hồ; Crumey: con thuyền "presumably a product of Lenz’s imperfect memory".'
  - id: n26
    cau: Đến khoảng năm 1840, tên Mondscheinsonate đã quen thuộc ở Đức.
    loai: lich-su
    nguon:
      - henle-1062-vorwort
      - crumey
    ket_qua: dung
    ghi_chu: 'Henle: "soon became established, for example in Anton Schindler’s Beethoven biography of 1840"; Crumey: "firmly established by 1840".'
  - id: n27
    cau: Đọc hướng dẫn nghe Sonata Ánh trăng (link).
    loai: ve-site
    nguon: []
    ket_qua: dung
