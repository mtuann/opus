doi_chu:
  - cu: "Chương nhạc nổi tiếng nhất của Beethoven có rất ít nốt khó. Cái khó nằm ở âm thanh: tay phải vừa rải chùm ba đều như hơi thở vừa hát giai điệu bằng ngón 5, trên những quãng tám trầm ngân dài, gần như suốt bài trong pp, dưới một chỉ dẫn bàn đạp mà người chơi vẫn còn bàn luận. Trang này hướng dẫn tập để ba lớp ấy tách bạch, bàn đạp không làm nhòe, và tốc độ chậm không bao giờ đứng lại."
    moi: "Chương 1 của bản sonata nổi tiếng này có rất ít nốt khó. Cái khó nằm ở âm thanh: tay phải vừa rải chùm ba đều như hơi thở vừa hát giai điệu bằng ngón 5, trên những quãng tám trầm ngân dài, gần như suốt bài trong pp, dưới một chỉ dẫn bàn đạp mà người chơi vẫn còn bàn luận. Trang này hướng dẫn tập để ba lớp ấy tách bạch, bàn đạp không làm nhòe, và tốc độ chậm không bao giờ đứng lại."
    ly_do: "n2: so sánh nhất chưa có nguồn (cả description và câu mở đầu)."
  - cu: "Khoảng ABRSM Grade 6–7 (ước lượng; chặng 5 của site): nốt không khó, cái khó nằm ở cân bằng âm thanh và bàn đạp. Henle xếp cả bản sonata, gồm chương 3 Presto agitato khó hơn nhiều, ở mức 7 (khó) trên thang 1–9; trang của Henle không ghi mức riêng cho chương 1"
    moi: "Khoảng ABRSM Grade 6–7 (ước lượng; chặng 5 của site): nốt không khó, cái khó nằm ở cân bằng âm thanh và bàn đạp. Henle xếp cả bản sonata, gồm chương 3 Presto agitato khó hơn nhiều, ở mức 7 (khó) trên thang 1–9; riêng chương 1, trong tuyển tập HN 1820 (At the Piano), Henle xếp mức 4 (trung bình)"
    ly_do: "Dòng Độ khó của thong_tin (hồ sơ bản ghi du-lieu/tac-pham/beethoven-anh-trang n23, plans/lam-lai/bao-cao/d6-l4/sua-A.yml): trang Henle HN 1820 (At the Piano) xếp riêng chương 1 ở mức 4 (medium), nên câu \"trang của Henle không ghi mức riêng cho chương 1\" sai."
  - cu: Ba lớp, một bàn tay hai việc. Tay phải vừa rải chùm ba (liên ba móc đơn) bằng ngón 1–2–3, vừa hát giai điệu bằng ngón 4–5; tay trái giữ bè trầm quãng tám. Bạn sẽ gặp lại kết cấu này rất nhiều trong nhạc piano Lãng mạn, từ nocturne của Chopin đến các bài ca không lời của Mendelssohn.
    moi: Ba lớp, một bàn tay hai việc. Tay phải vừa rải chùm ba (liên ba móc đơn) bằng ngón 1–2–3, vừa hát giai điệu bằng ngón 4–5; tay trái giữ bè trầm quãng tám.
