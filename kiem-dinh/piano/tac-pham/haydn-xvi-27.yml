nhan_dinh:
  - id: n1
    cau: 'Chương cuối (chương 3) của Sonata Sol trưởng Hob. XVI:27 của Joseph Haydn ghi Finale. Presto.'
    loai: ten
    nguon: [ pasler-1918, imslp-xvi27 ]
    ket_qua: dung
    ghi_chu: 'Bản quét trang PDF 7: "Finale." và "Presto." trên hệ đầu, hóa biểu một dấu thăng; trang PDF 10 kết bằng vạch kép. IMSLP: 3 chương, chương 3 "Finale. Presto (G)".'
  - id: n2
    cau: 'Chương này dựng trên một chủ đề 24 ô, Presto; chủ đề trở lại nhiều lần: thêm nốt móc kép, đổi sang Sol thứ, rồi tay trái chạy liên tục bên dưới.'
    loai: cau-truc
    nguon: [ pasler-1918, mutopia-187 ]
    ket_qua: dung
    ghi_chu: 'Bản quét trang PDF 7: chủ đề 8 ô có nhắc lại rồi 16 ô có nhắc lại (24 ô); biến tấu 1 (trang PDF 7 hệ 4) có móc kép; đoạn Sol thứ (trang PDF 9 từ ô thứ 9 của hệ 1: Sol–Si♭–Rê–Sol); biến tấu cuối (trang PDF 9 hệ 5 trở đi) tay trái móc kép liên tục. Mutopia .ly khớp.'
  - id: n3
    cau: 'Đây là bài học Haydn đầu tiên trên site; bài ở chặng 5 của lộ trình.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/data/tac-pham.yml: trước bản ghi này không có bản ghi tac_gia haydn loai bai-hoc (chỉ có haydn-94, loai nghe); bản ghi mới chang 5.'
  - id: n4
    cau: 'Đề cương RCM 2022 xếp chương này ở Level 8 (danh sách B); Henle xếp cả bản sonata ở mức 5 trên thang 1–9; ABRSM chưa đưa chương này vào đề cương, nên Grade 6 là ước lượng.'
    loai: cap-do
    nguon: [ rcm-2022, henle-hn1338, abrsm-2025, abrsm-2027 ]
    ket_qua: dung
    ghi_chu: 'RCM tr. 73: Level 8, List B, "Sonata in G Major, Hob. XVI:27 l 3rd movement: Finale". Henle HN 1338: "Piano Sonata G major Hob. XVI:27 5 medium" (thang Henle 1–9 như các trang tác phẩm khác). ABRSM 2025–2026 và 2027–2028: không có XVI:27 (tìm "Hob. XVI" trong chữ PDF); khảo sát đợt 4 đọc các đề cương 2011–2028. Grade 6 ước lượng: RCM Level 8 cũng có Beethoven Op. 49 số 2 (site ghi Grade 5, chặng 4) và lộ trình quy chặng 5 = Grade 6 (lo-trinh-them-tac-pham.md mục 2).'
  - id: n5
    cau: 'Nhịp 2/4 nhanh, nhưng tiếng đàn phải nhẹ và đều; các nốt móc kép của biến tấu phải rõ từng nốt.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập; nhịp 2/4 và móc kép ở biến tấu: bản quét trang PDF 7–8. Không trái trang lõi tieng-dan (Cổ điển: rõ, nhẹ).'
  - id: n6
    cau: 'Chương này là chủ đề và biến tấu, như chương 2 Giao hưởng số 94 của cùng tác giả, cũng là một bộ biến tấu có một biến tấu giọng thứ.'
    loai: cau-truc
    nguon: [ pasler-1918, mutopia-187, kern-sonata42-3, site-haydn-94 ]
    ket_qua: dung
    ghi_chu: 'Bản quét: một chủ đề hai nửa có nhắc lại, rồi các lượt cùng khung (8 ô + 16 ô, cùng hòa âm, cùng nốt chính của giai điệu) với hình nốt khác: trang PDF 7 hệ 4 (móc kép), trang PDF 8 hệ 2 (f, móc kép liên tục), trang PDF 9 (Sol thứ; Sol trưởng tay trái móc kép). Kern: các đoạn A–F có nhắc lại, G không nhắc lại. Hình thức đọc từ bản nhạc (lượt 1 không tìm được nguồn ngoài gọi tên hình thức chương này; IMSLP và Henle không ghi). Giao hưởng số 94: trang site đã khóa (biến tấu 2 Đô thứ).'
  - id: n7
    cau: 'Luyến hai nốt, nốt tách nhẹ, đệm mỏng là những thói quen dùng lại được cho Mozart và Beethoven thời trẻ.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp trang lõi piano/tieng-dan, bảng Phát âm theo phong cách (dòng Cổ điển: Haydn, Mozart, Beethoven thời trẻ).'
  - id: n8
    cau: 'Joseph Haydn (1732–1809) viết Sonata Sol trưởng Hob. XVI:27 khoảng năm 1774–1776; bản in đầu tiên ra năm 1778 (theo IMSLP).'
    loai: nam
    nguon: [ imslp-xvi27, imslp-hob, kern-sonata42-3 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Year/Date of Composition=1774-76 ca", "Year of First Publication=1778"; danh sách tác phẩm IMSLP: XVI:27 "1774-76 ca"; kern ODT ~1774/~1776. Năm sinh–mất: src/data/nha-soan-nhac.yml (haydn, đã khóa) 1732–1809; kern CDT 1732/03/31–1809/05/31.'
  - id: n9
    cau: 'Những năm ấy Haydn phục vụ gia đình quý tộc Esterházy.'
    loai: lich-su
    nguon: [ henle-hn1338 ]
    ket_qua: dung
    ghi_chu: 'Niên biểu trên trang Henle HN 1338: 1776, Hoàng thân Nikolaus đòi diễn opera đều đặn ở Eszterháza; Haydn chuyển từ Eisenstadt tới lâu đài Eszterháza, ở đó mười tháng mỗi năm. Trang site lich-su/nha-soan-nhac (đã khóa): Haydn phục vụ gia đình Esterházy gần 30 năm.'
  - id: n10
    cau: 'Sonata có ba chương: Allegro con brio, Menuetto với Trio Sol thứ, và Finale. Presto.'
    loai: ten
    nguon: [ imslp-xvi27, pasler-1918 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "3 movements: Allegro con brio (G); Minuet (G) - Trio (g); Finale. Presto (G)". Bản quét: trang PDF 1 "Allegro con brio.", trang PDF 5 "Menuetto.", trang PDF 7 "Finale. Presto.". Giọng Sol thứ của Trio theo IMSLP (lượt 1 không đọc Trio trên bản quét).'
  - id: n11
    cau: 'Hob. XVI:27 là số trong danh mục tác phẩm Haydn của Anthony van Hoboken; nhóm XVI là các sonata cho đàn phím; một cách đánh số khác gọi bài này là sonata số 42.'
    loai: danh-muc
    nguon: [ imslp-hob, imslp-xvi27, kern-sonata42-3 ]
    ket_qua: dung
    ghi_chu: 'IMSLP List of works: tiêu đề Hoboken, mục "Hob.XVI (1-52) Keyboard Sonatas". IMSLP trang tác phẩm: "Alternative Title=Klaviersonate Nr.42". Kern: OTL "Sonata No. 42 in G major", SCT Hob. XVI:27. Tên đầy đủ Anthony van Hoboken: lượt 2 kiểm.'
  - id: n12
    cau: 'Haydn viết cho đàn phím nói chung: thời ấy là đàn harpsichord hay piano đời đầu.'
    loai: lich-su
    nguon: [ imslp-xvi27, mutopia-187 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Instrumentation=keyboard", tên "Keyboard Sonata". Mutopia: Instrument(s) "Harpsichord, Piano". Cụm "piano đời đầu": cách nói chung, lượt 2 kiểm.'
  - id: n13
    cau: 'Bản nhạc trên trang chép từ ấn bản Haydns Werke (Toàn tập Haydn), Serie XIV, tập 2, do Karl Päsler biên tập, nhà Breitkopf & Härtel (Leipzig) in năm 1918.'
    loai: ten
    nguon: [ imslp-xvi27, pasler-1918 ]
    ket_qua: dung
