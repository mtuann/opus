  - id: n24
    cau: 'Dấu răng cưa ngắn trên nốt Rê ở ô 8 thường được chơi như láy trên: Rê–Mi–Rê, bắt đầu từ nốt chính, thật nhanh, đúng phách; bản thu gợi ý cũng chơi như vậy; có người chơi thành một láy rền ngắn bắt đầu từ Mi.'
    loai: dinh-nghia
    nguon: [ pasler-1918, site-not-hoa-my, dolmetsch-23, kolodin-file ]
    ket_qua: da-sua
    ghi_chu: 'Bản quét trang PDF 7 hệ 1 ô 8 (150 dpi): răng cưa ngắn không có gạch dọc trên Rê5 (Mutopia ghi \mordent). Cách chơi chính–trên–chính đúng phách theo trang not-hoa-my (cột thế kỷ 19); trang đó cũng nêu cách đọc Baroque (bắt đầu từ nốt trên). Ở Presto chỉ kịp ba nốt; lượt 2 kiểm có hợp với nhạc Haydn những năm 1770. Review (Claude, 24/11/2026): lượt 2 không chắc; viết lại. Bản quét 600 dpi và ảnh gốc: dấu răng cưa ngắn hai đỉnh (không phải dấu ba đỉnh có "(~)" ở Menuetto trang PDF 5); có một nét nhỏ ở giữa nhô ra khoảng 1–2 px ảnh gốc, không đủ để đọc chắc là gạch dọc; Mutopia (.ly tải lại, theo Peters) ghi d4\mordent (láy dưới). Câu cũ "răng cưa không gạch là láy trên" nên bỏ "không gạch". Cách chơi: Dolmetsch (Schneller = nốt viết, nốt trên, nốt viết, thay dần Pralltriller từ giữa thế kỷ 18; Pralltriller bốn nốt từ nốt trên, nối với nốt trước); trang not-hoa-my (đã khóa): láy trên đúng phách. Bản thu Kolodin (librosa CQT, bước 5,8 ms): Rê5 vào 7,93 s, Mi5 7,98 s, Rê5 lại 8,06 s, tức Rê–Mi–Rê bắt đầu từ nốt chính. Câu mới không khẳng định dấu chỉ có một cách đọc.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Keyboard_Sonata_in_G_major,_Hob.XVI:27_(Haydn,_Joseph)", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "Bản Päsler ô 8 ghi dấu răng cưa ngắn không gạch. Nguồn mở được không xác nhận cách chơi riêng cho Haydn thập niên 1770: Dolmetsch nói Pralltriller (C.P.E. Bach) là trill rất nhanh bốn nốt, nốt đầu (nốt trên) nối với nốt trước, chỉ dùng sau một bước đi xuống, và từ giữa thế kỷ 18 Schneller (nốt chính, nốt trên, nốt chính) dần thay nó; cũng nói trill bắt đầu từ nốt trên là lối chính giữa thế kỷ 18. Rê ở ô 8 đến từ Đô thăng (đi lên) nên kiểu Pralltriller nối nốt không hợp, Rê–Mi–Rê là cách đọc hợp lý, nhưng dấu này ở Haydn cũng được đọc là trill ngắn bắt đầu từ Mi; chính Päsler ghi '(w?)' ở Menuetto, cho thấy dấu của Haydn còn mơ hồ. Không mở được: lời tựa Wiener Urtext (wiener-urtext.com không kết nối, bản Wayback hỏng), luận văn Yang (core.ac.uk 403); lời tựa HN 1338 không bàn chuyện này. Gợi ý viết: 'thường chơi Rê–Mi–Rê (bắt đầu từ nốt chính), thật nhanh, đúng phách; có người chơi thành láy rền ngắn bắt đầu từ Mi'."
    review: dung
