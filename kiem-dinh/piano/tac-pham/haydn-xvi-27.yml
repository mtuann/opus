    ghi_chu: 'Cùng ý n6, n20, n24, n21, n15. Review (Claude, 24/11/2026): lượt 2 không chắc vế dấu láy. Bỏ câu hỏi về dấu láy (cách chơi không chỉ có một, n24); thay câu hỏi "hình thức nào" (không có nguồn ngoài gọi tên, n6) bằng câu hỏi về ô 73–80 (n19, bản quét trang PDF 9 hệ 1). Hai câu còn lại (hóa biểu đoạn Sol thứ, tay trái biến tấu cuối) giữ: khớp n20, n21, n15.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Keyboard_Sonata_in_G_major,_Hob.XVI:27_(Haydn,_Joseph)", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: Các vế hình thức, hóa biểu đoạn Sol thứ, tay trái đúng theo bản Päsler. Vế 'răng cưa không gạch ở ô 8 là láy trên Rê–Mi–Rê' không chắc, như n24.
    review: dung
