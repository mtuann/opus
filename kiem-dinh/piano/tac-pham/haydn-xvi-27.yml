khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Nhịp lấy đà và ô 1–8, K:G, 2/4, L:1/8. Ấn bản: pasler-1918 trang PDF 7 hệ 1 (đọc ở 100 và 150 dpi). Tay phải: lấy đà Rê4 móc đơn (mf); ô 1 Sol4 Si4 Rê5 Sol4; ô 2 Sol4 đen (luyến) Fa♯4 móc đơn, Rê4; ô 3 La4 Đô5 Mi5 [La4 Đô5]; ô 4 [La4 Đô5] đen, [Sol4 Si4] móc đơn, Si4 móc đơn; ô 5 Si5 Sol5 Rê♯5 Mi5; ô 6 La5 Fa♯5 Đô♯5 Rê5 (dấu bình); ô 7 Mi5 móc đơn, Sol5 đen, Đô♯5 móc đơn; ô 8 Rê5 đen có răng cưa không gạch, lặng móc đơn, vạch nhắc lại. Tay trái: lặng móc đơn; ô 1 [Sol3 Si3] đen, lặng, [Si3 Rê4]; ô 2 [La3 Đô4] đen, lặng đen; ô 3 lặng đen, lặng, Fa♯3; ô 4 Sol3 đen, Sol2 móc đơn, lặng, rồi khóa Sol; ô 5 Sol4 đen, lặng, Sol4; ô 6 Fa♯4 đen, lặng, Fa♯4; ô 7 Sol4 La4 đen; ô 8 khóa Fa, Rê4 đen, Rê3 móc đơn. Đối chiếu Mutopia MD/MS ô 1–8: cùng nốt, cùng trường độ; Mutopia ghi \mordent (có gạch) ở ô 8, Päsler không gạch: theo Päsler (!uppermordent!). Bỏ: dấu luyến, chấm ngắt (khối chỉ chép nốt, sắc thái, láy). Review (Claude, 24/11/2026): so từng nốt với bản quét trang PDF 7 hệ 1 ở 150 và 600 dpi (đo dòng kẻ: khuông trên Fa5 211, Rê5 244, Si4 277, Sol4 309, Mi4 343 px; khuông dưới La3 547, Fa3 581, Rê3 615, Si2 647, Sol2 682 px ở 150 dpi): lấy đà Rê4 mf; ô 1–4 tay phải và tay trái (Fa♯3 cuối ô 3 nằm trên dòng Fa3; Sol2 ô 4 trên dòng dưới cùng); ô 5–7 (Đô♯5, Rê5 có dấu bình ở ô 6; tay trái khóa Sol Sol4, Fa♯4, Sol4 La4); ô 8 Rê5 có dấu láy, Rê4 và Rê3. Khớp; Mutopia .ly cùng nốt (ô 8 d4\mordent). Giữ !uppermordent! (răng cưa không gạch), khớp chữ mới của trang (Rê–Mi–Rê) và cách bản thu chơi.'
  - khoi: 2
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Nhịp lấy đà và ô 25–28, K:G, 2/4, L:1/16. Ấn bản: pasler-1918 trang PDF 7 hệ 4 (đọc ở 100, 130 và 150 dpi). Tay phải: lấy đà Rê4 móc đơn; ô 25 Sol4 Rê4 Si4 Sol4 móc kép, Rê5 móc đơn, Sol4 móc đơn; ô 26 Sol4 đen (luyến) Fa♯4, La4 móc đơn; ô 27 Đô5, [Đô5 Mi5], [Si4 Rê5], [La4 Đô5] móc đơn; ô 28 [La4 Đô5] đen, [Sol4 Si4] móc đơn, Si4 móc đơn (Päsler; Mutopia ghi Sol4: theo Päsler, đầu nốt đo trên dòng 3 của khuông ở ảnh 150 dpi, như nốt cuối ô 4 của chủ đề). Tay trái: như ô 1–4 (lặng; [Sol3 Si3], lặng, [Si3 Rê4]; [La3 Đô4], lặng; lặng, lặng, Fa♯3; Sol3, Sol2, lặng). Khối dừng ở ô 28 trọn (không có vạch nhắc lại ở đó). Bỏ dấu chấm trên Rê5 ô 25, luyến. Review (Claude, 24/11/2026): so từng nốt với bản quét trang PDF 7 hệ 4 ở 150 và 300 dpi: ô 25 Sol4 Rê4 Si4 Sol4 móc kép, Rê5, Sol4 móc đơn; ô 26 Sol4 đen, Fa♯4, La4; ô 27 Đô5, [Đô5 Mi5], [Si4 Rê5], [La4 Đô5]; ô 28 [La4 Đô5] đen, [Sol4 Si4], rồi nốt cuối nằm trên dòng giữa (Si4) ở ảnh 300 dpi, không phải Sol4 (dòng thứ hai từ dưới); tay trái như ô 1–4. Khớp; Mutopia ô 28 ghi g (Sol4), trang theo Päsler là đúng.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, Sol trưởng, L:1/8: tay phải rải Sol4–Si4–Rê5–Si4 (Sol trưởng), La4–Đô5–Mi5–Đô5 (La thứ), Si4–Rê5–Sol5–Rê5 (Sol trưởng thế một), ngón 1-3-5-3; ô 4 Sol5 đen (5). Tay trái hợp âm đen đầu ô: [Sol3 Si3] (5,3), [La3 Đô4] (5,3), [Sol2 Sol3] (5,1) hai lần. Mỗi ô 4 móc đơn. Review (Claude, 24/11/2026): nhịp (4 móc đơn mỗi ô), hòa âm (Sol trưởng, La thứ, Sol trưởng thế một), số ngón (1-3-5-3; Si4–Sol5 là quãng sáu thứ với 1-5) và lời kèm: đúng.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, L:1/16: tay phải Si5–Sol5–Fa♯5–Mi5, Rê♯5–Mi5–Rê♯5–Mi5 (5-4-3-2, 1-2-1-2) trên tay trái [Mi3 Sol3 Si3] (Mi thứ); La5–Fa♯5–Mi5–Rê5, Đô♯5–Rê5–Đô♯5–Rê5 trên [Rê3 Fa♯3 La3] (Rê trưởng); Sol5–Mi5–Rê5–Đô5, Si4–Đô5–Si4–Đô5 trên [Đô3 Mi3 Sol3] (Đô trưởng); ô 4 Si4 đen trên [Sol2 Sol3] (Sol trưởng). Nốt quay quanh là nốt dưới cách nửa cung, tay phải không vượt ngón. Mỗi ô 8 móc kép. Review (Claude, 24/11/2026): nhịp (8 móc kép mỗi ô), hòa âm (Mi thứ, Rê trưởng, Đô trưởng, Sol trưởng), số ngón (5-4-3-2, 1-2-1-2; ngón 1 trên phím đen Rê♯, Đô♯ được ở mức này) và lời kèm: đúng.'
  - khoi: 5
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, L:1/16: tay trái móc kép Sol3–Rê4–Si3–Rê4 (5-1-3-1, Sol trưởng), La3–Rê4–Đô4–Rê4 (5-1-2-1, Rê bảy), Fa♯3–Rê4–La3–Rê4 (5-1-3-1, Rê trưởng), Sol3–Rê4–Si3–Rê4 rồi Sol3 đen; tay phải Si4, Rê5 (Sol trưởng); Đô5, La4 (Rê bảy); La4, Fa♯4 (Rê trưởng); Sol4 trắng. Mỗi ô 8 móc kép; tay phải mf, tay trái p như lời kèm. Review (Claude, 24/11/2026): nhịp (8 móc kép mỗi ô; ô 4: 4 móc kép + Sol3 đen), hòa âm (Sol trưởng, Rê bảy thiếu năm, Rê trưởng, Sol trưởng), số ngón và lời kèm (tay phải mf, tay trái p): đúng.'
