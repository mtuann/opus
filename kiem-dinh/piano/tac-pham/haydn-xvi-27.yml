ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 10, đợt 4). Nốt nhạc và chữ chỉ dẫn chép từ bản quét Päsler (IMSLP #472026, PDF 10 trang không có số trang in, chỉ có sonata XVI:27; chương 1 trang PDF 1–4, Menuetto trang PDF 5–6, chương 3 trang PDF 7–10), đọc ở 100–300 dpi bằng PyMuPDF, cao độ đọc theo dòng kẻ trên ảnh phóng to. Đối chiếu: Mutopia id 187 (file .ly và .mid tải 24/11/2026 từ mutopiaproject.org/ftp/HaydnFJ/HOB-XVI-27/hob-xvi-27-iii-presto/) và kern sonata42-3.krn (Craig Sapp, theo Universal Edition 1901; CC BY-NC-SA 4.0, chỉ dùng trên máy để đếm ô và soát hình thức: các đoạn A–F có nhắc lại rồi G, *>[A,A,B,B,C,C,D,D,E,E,F,F,G]). Số ô theo Mutopia, không tính nhịp lấy đà: chủ đề 1–24, biến tấu 1 25–48, biến tấu 2 49–72, nửa đầu chủ đề 73–80, Sol thứ 81–104, biến tấu cuối 105–152 (kern đánh số lệch một từ ô 58, ghi =153 ở vạch cuối). Một chỗ Päsler khác Mutopia: nốt cuối ô 28 tay phải Päsler là Si4 (ảnh 150 dpi: đầu nốt nằm trên dòng 3), Mutopia ghi Sol4; trang theo Päsler. Mốc: tools/audio/align (cấu hình tạm ngoài repo, không thêm vào pieces.py vì ngoài phạm vi nhánh: MIDI Mutopia đặt vào bộ nhớ đệm scores/ tên mutopia_hob-xvi-27-iii-presto.mid; segs mở mọi dấu nhắc lại [(0,7),(0,7),(8,23),(8,23),(24,31),(24,31),(32,47),(32,47),(48,55),(48,55),(56,71),(56,71),(72,151)]; explore.py structure: cách nối này chi phí 0,357, biến thiên tốc độ -0,19..+0,13, tốt hơn không nhắc lại (0,386) và bỏ nhắc lại ở biến tấu 2 (0,363), nên bản thu giữ mọi dấu nhắc lại). Biến thể thường và khởi âm khớp trong 1,5 s ở mọi dòng, biến thể thô→mịn hỏng (dồn về cuối); mỗi mốc kiểm lại bằng explore.py onsets (khởi âm từng cao độ, móc đơn khoảng 0,21–0,23 s): 2 (nhịp lấy đà Rê4 1,58 s, Sol4 1,86 s); 16 (Rê5–Si4–Sol♯4–Mi4 của ô 9 ở 15,79/16,02/16,21/16,39 s, lấy đà khoảng 15,58 s); 42 (căn ra 42,8; khởi âm: lấy đà Rê4 42,12 s, ô 25 Sol4 42,40 s, ô 26 Sol4 43,24 s, ô 27 Đô5 khoảng 44,1 s); 83 (lấy đà Rê5 83,36 s, rồi Sol5 83,55, Mi5 83,78, Rê5 83,87); 122 (ô 73 Sol4–Si4–Rê5–Sol4 ở 122,23/122,46/122,65/122,83 s, lấy đà khoảng 122,0); 129 (lấy đà Rê4 129,10 s, Si♭4 129,80, Rê5 130,03); 151 (ô 105 Sol4–Si4–Rê5 ở 150,88/151,12/151,35 s, lấy đà khoảng 150,7); 157 (căn ra 157,6; ô 113 Rê5–Sol5–Si5–Rê6 móc kép ở 157,52–157,80 s, hai móc kép lấy đà khoảng 157,34); 164 (lấy đà 163,84 s, Rê6 164,03, Sol♯5 164,49, Mi5 164,63); 177 (lấy đà Mi4 176,94 s, Sol♯4 177,08, rồi Si4, Rê5, Sol♯5, Si5, Rê6 tới 177,54). Hợp âm cuối khoảng 189,85 s; có tiếng từ 1,58 s tới khoảng 190,9 s. Ghi bằng attach.py --ref. File IMSLP tải tay (_imslp/IMSLP836476-…-i.mp3, 3 128 430 byte, khớp size trên IMSLP API) thật ra là MP4/AAC (DASH), đuôi .mp3; ffprobe 193,26 s. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/haydn-xvi-27. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe (cách đo ghi ở đây), câu hỏi để nghe.'
