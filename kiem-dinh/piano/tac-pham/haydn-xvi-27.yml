    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/data/tac-pham.yml: trước bản ghi này không có bản ghi tac_gia haydn loai bai-hoc (chỉ có haydn-94, loai nghe); bản ghi mới chang 5. Review (Claude, 24/11/2026): src/data/tac-pham.yml: bản ghi tac_gia haydn loai bai-hoc duy nhất là haydn-xvi-27 (haydn-94 loai nghe); chang 5. Đúng.'
    review: dung
  - id: n4
    cau: 'Đề cương RCM 2022 xếp chương này ở Level 8 (danh sách B); Henle xếp cả bản sonata ở mức 5 trên thang 1–9; ABRSM chưa đưa chương này vào đề cương, nên Grade 6 là ước lượng.'
    loai: cap-do
    nguon: [ rcm-2022, henle-hn1338, abrsm-2025, abrsm-2027 ]
    ket_qua: dung
    ghi_chu: 'RCM tr. 73: Level 8, List B, "Sonata in G Major, Hob. XVI:27 l 3rd movement: Finale". Henle HN 1338: "Piano Sonata G major Hob. XVI:27 5 medium" (thang Henle 1–9 như các trang tác phẩm khác). ABRSM 2025–2026 và 2027–2028: không có XVI:27 (tìm "Hob. XVI" trong chữ PDF); khảo sát đợt 4 đọc các đề cương 2011–2028. Grade 6 ước lượng: RCM Level 8 cũng có Beethoven Op. 49 số 2 (site ghi Grade 5, chặng 4) và lộ trình quy chặng 5 = Grade 6 (lo-trinh-them-tac-pham.md mục 2). Review (Claude, 24/11/2026): đọc lại RCM 2022 (PDF tải lại): tr. 73 Level 8 List B "Sonata in G Major, Hob. XVI:27 l 3rd movement: Finale", cùng trang có Beethoven Op. 49 số 2 (chương 1, 2); tr. 64 Level 7 chương 2. Henle HN 1338 (trang tải lại): "Piano Sonata G major Hob. XVI:27 5 medium". Giữ Grade 6 (ước lượng), chặng 5; so cách site xếp các bài RCM Level 8: mendelssohn-thuyen-ca (RCM 8, ABRSM 6, Henle 4) chặng 5, Grade 5–6; beethoven-op49-2 (RCM 8, Henle 3 "dễ") chặng 4, Grade 5; chopin-valse-si-thu (RCM 8, ABRSM 8, Henle 4) chặng 6. Bài này Henle 5 (cả sonata, cao hơn Op. 49 số 2 hai mức), móc kép liên tục ở Presto: đặt cạnh Mendelssohn ở chặng 5 là nhất quán; khảo sát đợt 4 (chủ repo duyệt) cũng ghi RCM Level 8 ≈ Grade 5–6. Chữ "ước lượng" có ở mục Vì sao và dòng Độ khó.'
    luot_2: dung
    luot_2_nguon: [ "https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf", "https://www.henle.de/us/Complete-Piano-Sonatas-Volume-II/HN-1338", "https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20%26%202026%20Prac%20syllabus%2020240524_access.pdf" ]
    luot_2_ghi_chu: "RCM Piano Syllabus 2022, Level 8 List B (tr. 73): 'Sonata in G Major, Hob. XVI:27, 3rd movement: Finale' (Level 7, tr. 64, chỉ có chương 2). Henle HN 1338: 'Piano Sonata G major Hob. XVI:27 5 medium'. Đề cương ABRSM Piano 2025 & 2026 không có Hob. XVI:27. Grade 6 là ước lượng hợp lý (RCM 8 khoảng ABRSM 6–7; Henle 5)."
    review: dung
