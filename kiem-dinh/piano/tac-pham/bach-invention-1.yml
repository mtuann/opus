khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not-tay-phai
      - not-tay-trai
      - doi-chieu-an-ban
    ket_qua: dung
    ghi_chu: 'Ô 1–2 (trong 22 ô), 4/4, L:1/16. Ấn bản: Bach-Gesellschaft qua Mutopia bach-invention-01 (.ly, .mid; tải 05/11/2026). Công cụ: đọc .ly (\relative) và in nốt MIDI theo ô bằng script Python (mido). Kết quả: khớp từng nốt cả hai tay (tay phải z C4 D E F D E C G4 C5 B4 C5 | D5 G4 A B C5 A4 B G D5 G5 F5 G5; tay trái z8 z C3 D E F D E C | G3 G2 z4 z G3 A B C4 A3 B G). Nốt hoa mỹ của bản gốc (\prall ở Si ô 1, Fa ô 2) cố ý không ghi, như trang nói.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - so-ngon
    ket_qua: dung
    ghi_chu: '4 ô 4/4, L:1/16; ô 1–3 mỗi nửa ô một dấu lặng móc kép cộng bảy móc kép (đủ 16), ô 4 nốt tròn. Chủ đề và chủ đề đảo ở Đô, Sol (Fa♯), Rê (Fa♯, Đô♯), đúng "qua ba giọng". Ngón 1-2-3-4-2-3-1 cho chủ đề đi lên, 5-4-3-2-4-3-5 cho chủ đề đảo ở tay phải: chơi được.'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - so-ngon
      - hai-tay
    ket_qua: dung
    ghi_chu: '3 ô 4/4, L:1/16; ô 1–2 đủ 16 móc kép mỗi tay; ô 3 là hợp âm kết dài nửa ô ([CEG]8, C,8), như các ô kết có dấu |]. Ô 1 tay phải móc kép luyến, tay trái móc đơn staccato; ô 2 đổi vai: đúng lời dẫn. Ngón 1 bắt đầu mỗi nhóm, 5 ở tay trái: chơi được.'
