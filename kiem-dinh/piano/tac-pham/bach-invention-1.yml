  - cu: "Một lựa chọn phổ biến và hợp lý: móc kép liền tiếng, móc đơn tách nhẹ (không phải staccato ngắn), nốt dài giữ đủ. Áp dụng như nhau cho cùng một môtip ở cả hai tay, để người nghe nhận ra chủ đề mỗi khi nó xuất hiện. Cũng có người chơi móc kép hơi tách; điều quan trọng là nhất quán và có lý do. Hai bè phải nghe như hai người hát, mỗi người một hơi thở."
    moi: "Một lựa chọn hợp lý: móc kép liền tiếng, móc đơn tách nhẹ (không phải staccato ngắn), nốt dài giữ đủ. Áp dụng như nhau cho cùng một môtip ở cả hai tay, để người nghe nhận ra chủ đề mỗi khi nó xuất hiện. Cũng có người chơi móc kép hơi tách; điều quan trọng là nhất quán và có lý do. Hai bè phải nghe như hai người hát, mỗi người một hơi thở."
    ly_do: 'n61: "phổ biến" chưa có nguồn. n80: như n61.'
  - cu: Trong bản Bach-Gesellschaft có láy rền ngắn ở vài nốt móc đơn (ví dụ nốt Si ở ô 1, nốt Fa ở ô 2) và láy ở vài nốt móc đơn chấm dôi. Theo thói quen thời Baroque, láy rền thường bắt đầu từ nốt trên và rơi đúng phách; láy (mordent) đi nốt chính – nốt dưới – nốt chính. Chính Bach đã viết một bảng giải thích các ký hiệu này trong Clavier-Büchlein của Wilhelm Friedemann; một số ấn bản in lại bảng này. Kiểm tra ký hiệu trong bản bạn dùng, và xem Nốt hoa mỹ.
    moi: Trong bản Bach-Gesellschaft có ký hiệu láy trên (răng cưa không gạch; theo bảng của Bach là một láy rền ngắn) ở vài nốt móc đơn (ví dụ nốt Si ở ô 1, nốt Fa ở ô 2) và láy dưới (có gạch) ở hai nốt móc đơn chấm dôi (ô 5 và ô 13). Theo thói quen thời Baroque, láy rền thường bắt đầu từ nốt trên và rơi đúng phách; láy dưới đi nốt chính – nốt dưới – nốt chính. Chính Bach đã viết một bảng giải thích các ký hiệu này trong Clavier-Büchlein của Wilhelm Friedemann; một số ấn bản in lại bảng này. Kiểm tra ký hiệu trong bản bạn dùng, và xem Nốt hoa mỹ.
    ly_do: 'n64–n66: tên ký hiệu theo thuật ngữ đã khóa; ghi rõ hai chỗ có láy dưới (Mutopia: \mordent ở ô 5, ô 13); giữ "láy rền ngắn" cho cách chơi (piano/not-hoa-my n116).'
  - cu: "Invention khác: số 4 (Rê thứ) và số 8 (Fa trưởng) là hai bước tiếp phổ biến; sau đó là các sinfonia ba bè và Prelude và fugue Đô thứ BWV 847, fugue ba bè nên học đầu tiên."
    moi: "Invention khác: số 4 (Rê thứ; Henle xếp cùng mức 3 như số 1) và số 8 (Fa trưởng; Henle mức 4, ABRSM Grade 5) là hai bước tiếp; sau đó là các sinfonia ba bè và Prelude và fugue Đô thứ BWV 847, fugue ba bè nên học đầu tiên."
