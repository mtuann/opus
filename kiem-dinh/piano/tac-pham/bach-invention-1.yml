  - id: n24
    cau: 'Ba điểm kết: Sol trưởng, La thứ, rồi Đô.'
    loai: cau-truc
    nguon: *id001
    ket_qua: dung
    ghi_chu: Đầu ô 7 (Sol), đầu ô 15 (La thứ, có Sol♯), ô 22 (Đô).
  - id: n25
    cau: 'Cách nghe: đếm chủ đề, tìm ba điểm kết, theo riêng tay trái.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n26
    cau: So sánh vài bản thu rất khác nhau trên piano hiện đại, cùng một bản trên harpsichord hoặc clavichord; ghi lại phát âm, sắc thái, tốc độ.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ nêu Glenn Gould ("nổi tiếng với lối chơi Bach rõ, tách tiếng"), András Schiff, Angela Hewitt: chưa mở trang bản thu nào, và vế về Gould là đánh giá. Bỏ tên (doi_chu), như D6-L3 làm với bản thu chưa thấy trang.'
