ghi_chu: 'Bài học Invention số 1 (tầng Tác phẩm). Bản nhạc: Mutopia bach-invention-01 (nguồn Bach-Gesellschaft; .ly, .mid tải 05/11/2026, User-Agent opus-kiem-dinh), đọc .ly và in nốt MIDI theo ô bằng script Python (mido): 22 ô, mọi số ô trên trang khớp. Lịch sử: lời tựa và bình chú Henle HN 591 (Scheideler 2014), trang bìa 1723 (bach-cantatas.com), Tomita (QUB, bản lưu Wayback). Sửa trang: n7, n20, n21, n26, n47, n52, n61, n64, n65, n66, n73, n76, n80, n82. Còn mở: n71 (ấn bản cũ thêm dấu). Giữ cho hồ sơ khác: khối chính theo Bach-Gesellschaft, nốt hoa mỹ "chưa ghi"; "láy rền ngắn" ở nốt Si ô 1 (piano/not-hoa-my n116; chữ mới gọi ký hiệu là láy trên, vẫn nói cách chơi là láy rền ngắn); hai bè quan trọng ngang nhau (piano/tieng-dan n59); invention hai bè (minuet-sol n71): đã kiểm trên bản nhạc, đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ: láy trên, láy dưới (thuat-ngu mordent), láy rền; "invention", "inventio", "phức điệu", "chủ đề đảo", "chuỗi" chưa có bản ghi trong thuat-ngu.yml (cho người giao). Hai mục doi_chu đầu (chip và dòng Độ khó) là của D2-0.'
