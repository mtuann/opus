    moi: Bước đầu vào phức điệu. Mỗi tay là một giọng hát độc lập, quan trọng ngang nhau. Đây là kỹ năng bạn sẽ cần cho các sinfonia, fugue và nhiều bài khác của Bach (xem Đối âm).
