nhan_dinh:
  - id: n1
    cau: 'Tiêu đề: "Bach: Invention số 1 Đô trưởng, BWV 772".'
    loai: ten
    nguon:
      - imslp-inv
      - henle-591
    ket_qua: dung
    ghi_chu: 'Henle: "Invention 1 C major BWV 772".'
  - id: n2
    cau: Bài có hai mươi hai ô nhịp, hai bè.
    loai: cau-truc
    nguon: &id001
      - mut-inv
    ket_qua: dung
    ghi_chu: 'Mutopia: 22 ô (ô cuối có dấu |.), hai khuông, mỗi khuông một bè.'
  - id: n3
    cau: Chủ đề (ý nhạc chính) dài nửa ô nhịp.
    loai: cau-truc
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Ô 1: dấu lặng móc kép rồi bảy móc kép, tức hai phách.'
  - id: n4
    cau: 'Invention số 1 là một bài phức điệu: hai tay cùng nói, đối đáp và nhại nhau, không chia vai giai điệu và đệm.'
    loai: dinh-nghia
    nguon:
      - cod-polyphony
      - cod-invention
      - mut-inv
    ket_qua: dung
    ghi_chu: 'COD polyphony: các bè "combined contrapuntally, as opposed to ... homophonic mus. (one melodic line, the other parts acting as acc.)"; COD invention: "highly contrapuntal, being largely in the nature of imitation".'
  - id: n5
    cau: Bach để lại gần như hoàn toàn cho người chơi việc quyết định cách phát âm.
    loai: lich-su
    nguon:
      - henle-591-vorwort
      - mut-inv
    ket_qua: dung
    ghi_chu: 'Henle HN 591: "Bach''s musical text contains hardly any indications as regards phrasing"; Mutopia (Bach-Gesellschaft) không có dấu luyến hay staccato.'
  - id: n6
    cau: Mỗi tay là một giọng độc lập, quan trọng ngang nhau.
    loai: cau-truc
    nguon:
      - mut-inv
      - cod-invention
    ket_qua: dung
    ghi_chu: Hai bè cùng mang chủ đề (tay phải ô 1, tay trái ô 1 và ô 7...). Giữ đúng điều hồ sơ piano/tieng-dan n59 dựa vào.
  - id: n7
    cau: Phức điệu hai bè là kỹ năng cần cho các sinfonia, fugue và nhiều bài khác của Bach (link Đối âm).
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ: "Đây là nền cho mọi fugue, sinfonia và phần lớn nhạc Bach": "mọi", "phần lớn" không kiểm được; viết lại thành lời khuyên (doi_chu). Link /opus/nhac-ly/22-doi-am/ có.'
  - id: n8
    cau: Bach gần như không ghi dấu luyến hay staccato.
    loai: lich-su
    nguon:
      - henle-591-vorwort
      - mut-inv
    ket_qua: dung
    ghi_chu: Như n5.
  - id: n9
    cau: Tự chọn cách nối và ngắt cho từng loại nốt, rồi giữ nhất quán.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n10
    cau: 'Gần như mọi nốt trong bài đến từ chủ đề ở ô 1: nguyên dạng, đảo ngược, chuyển giọng, nối thành chuỗi.'
    loai: cau-truc
    nguon:
      - mut-inv
      - cod-invention
    ket_qua: dung
    ghi_chu: 'Mutopia: mọi nhóm bốn móc kép là chủ đề hay chủ đề đảo (ô 1–2, 3–4 đảo, 7–8, 9–10 đảo cả hai tay, 11–12, 13–21); nốt móc đơn đi kèm. COD: "Each works out some short melodic motif". Link nhac-ly/30-phat-trien-motip có.'
  - id: n11
    cau: Một tay chạy móc kép trong khi tay kia đi móc đơn, rồi đổi vai.
    loai: cau-truc
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Ô 3–4: tay phải móc kép, tay trái móc đơn; ô 11–12 ngược lại. Phần "liền tiếng, tách tiếng" là lựa chọn phát âm (n61).'
  - id: n12
    cau: Chủ đề, nhại, chuỗi, kết là những khái niệm gặp lại trong fugue (link hinh-thuc/fugue).
    loai: dinh-nghia
    nguon:
      - cod-invention
      - cod-sequence
    ket_qua: dung
    ghi_chu: Link /opus/hinh-thuc/fugue/ có (src/content/docs).
  - id: n13
    cau: Bach dùng các invention và sinfonia để dạy con trai Wilhelm Friedemann, rồi các học trò khác.
    loai: lich-su
    nguon:
      - henle-591-vorwort
    ket_qua: dung
    ghi_chu: 'Henle: "Bach did, in fact, use the Inventions and Sinfonias not only to educate his son Wilhelm Friedemann, but other pupils too"; bản đầu nằm trong Clavier-Büchlein cho Friedemann (1720).'
  - id: n14
    cau: Năm 1723, khi chép sạch cả tập, Bach viết một trang bìa dài.
    loai: nam
    nguon:
      - henle-591-vorwort
      - henle-591-kb
      - bc-anleitung
    ket_qua: dung
    ghi_chu: 'Henle: "In 1723 Bach wrote out the Inventions and Sinfonias ... in fair copy ... an added title page and preface"; bình chú: P 610, lá 1r có tựa chi tiết, ghi "Anno Christi 1723".'
  - id: n15
    cau: 'Diễn ý trang bìa: hướng dẫn cho người yêu đàn phím, nhất là người ham học, học chơi sạch hai bè, rồi ba bè; tìm được ý nhạc hay và phát triển chúng; trên hết là đạt lối chơi như hát (cantabile) và nếm trước nghề sáng tác.'
    loai: lich-su
    nguon:
      - bc-anleitung
      - tomita
    ket_qua: dung
    ghi_chu: 'Nguyên văn: "Auffrichtige Anleitung, Wormit denen Liebhabern des Clavires, besonders aber denen Lehrbegierigen ... (1) mit 2 Stimmen reine spielen zu lernen ... (2) mit dreyen obligaten Partien ... gute inventiones ... selbige wohl durchzuführen, am allermeisten aber eine cantable Art im Spielen zu erlangen, und darneben einen starcken Vorschmack von der Composition zu überkommen". Bản diễn ý khớp từng vế.'
  - id: n16
    cau: 'Inventio là một từ của tu từ học: tìm ra một ý tưởng rồi khai triển nó.'
    loai: dinh-nghia
    nguon:
      - tomita
    ket_qua: dung
    ghi_chu: 'Tomita: "The word originally belonged to the term in rhetoric, and here Bach used to describe the idea that could be used as a compositional theme"; Cicero: inventio, dispositio...'
  - id: n17
    cau: Mỗi invention là một bài học về cách một ý nhạc nhỏ sinh ra cả một tác phẩm.
    loai: lich-su
    nguon:
      - tomita
      - cod-invention
    ket_qua: dung
    ghi_chu: 'Tomita: "how one can discover a good musical idea for a piece, and how to develop that into a full-scale composition".'
  - id: n18
    cau: Mục tiêu cao nhất Bach nêu ra trên trang bìa là lối chơi như hát, không phải sự nhanh nhẹn của ngón tay.
    loai: lich-su
    nguon:
      - bc-anleitung
      - tomita
    ket_qua: dung
    ghi_chu: '"am allermeisten aber eine cantable Art im Spielen" ("above all ... a cantabile manner of performance").'
  - id: n19
    cau: Hãy nhớ mục tiêu ấy mỗi khi muốn tăng tốc độ.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n20
    cau: Bach viết cho đàn phím thời ấy (trang bìa gọi chung là Clavier).
    loai: lich-su
    nguon:
      - bc-anleitung
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Bach viết cho đàn phím thời ấy (harpsichord, clavichord)". Trang bìa chỉ ghi "Liebhabern des Clavires"; chưa có nguồn đã mở nêu riêng hai đàn. Viết theo chữ trang bìa (doi_chu).'
  - id: n21
    cau: Trên piano hiện đại, bạn có độ ngân dài hơn và dải sắc thái rộng hơn; hãy dùng chúng tiết chế.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ: "bạn có sắc thái và độ ngân mà ông không có": clavichord có sắc thái theo lực ngón, nên "không có" là quá; viết lại (doi_chu).'
  - id: n22
