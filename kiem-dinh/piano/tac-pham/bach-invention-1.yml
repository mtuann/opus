  - cu: Bach viết cho đàn phím thời ấy (harpsichord, clavichord); trên piano hiện đại, bạn có sắc thái và độ ngân mà ông không có, nên phải dùng chúng một cách tiết chế. Xem thêm thời kỳ Baroque.
    moi: Bach viết cho đàn phím thời ấy (trang bìa gọi chung là Clavier); trên piano hiện đại, bạn có độ ngân dài hơn và dải sắc thái rộng hơn, nên hãy dùng chúng một cách tiết chế. Xem thêm thời kỳ Baroque.
    ly_do: 'n20, n21: trang bìa 1723 chỉ ghi "Clavier"; clavichord có sắc thái theo lực ngón nên "không có" là quá.'
  - cu: "So sánh vài cách chơi rất khác nhau, chẳng hạn Glenn Gould (nổi tiếng với lối chơi Bach rõ, tách tiếng), András Schiff và Angela Hewitt, cùng một bản trên harpsichord hoặc clavichord. Ghi lại: ai chơi móc kép liền, ai tách; ai dùng sắc thái nhiều; tốc độ chênh nhau bao nhiêu?"
    moi: "So sánh vài bản thu rất khác nhau trên piano hiện đại, cùng một bản trên harpsichord hoặc clavichord. Ghi lại: ai chơi móc kép liền, ai tách; ai dùng sắc thái nhiều; tốc độ chênh nhau bao nhiêu?"
