    luot_2_ghi_chu: "Bach Digital P 804: 'größtenteils aus dem Nachlass Johann Peter Kellner, bestehend aus 57 Einzelmanuskripten … (vornehmlich für Tasteninstrument), hauptsächlich von J. S. Bach'. ADB/Deutsche Biographie: Kellner 1705–1772, Kantor ở Gräfenroda (gần Gotha, Thüringen)."
