    ghi_chu: 'Chữ cũ: "Tập này gắn với Kellner ...: ông và những người quanh ông đã chép rất nhiều tác phẩm đàn phím của Bach, và với không ít bài, bản chép của họ là nguồn sớm nhất hoặc duy nhất còn lại." Vế "nguồn sớm nhất hoặc duy nhất" cho "không ít bài" chưa có nguồn đọc được (sách Stinson 1989 không mở được). Chữ mới theo Bach Digital P 804: "größtenteils aus dem Nachlass Johann Peter Kellner, bestehend aus 57 Einzelmanuskripten ... (vornehmlich für Tasteninstrument), hauptsächlich von J. S. Bach". Kellner: Baker''s "b. Gräfenroda, Thuringia, Sept. 28, 1705 ... in 1732 he became Kantor"; ADB: sinh và mất ở Gräfenroda; Henle: "the Thuringian cantor Johann Peter Kellner". Năm 1705–1772 khớp bản ghi kellner đã khóa. Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng. (Bach Digital P 804 fasc. 53 review tự mở bản lưu Wayback 21/1/2026: "No title or ascription to any composer", "1726/1727 oder später (Stinson)", provenance "J. P. Kellner".)'
