  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Ô 1–4, 4/4, L:1/8, K:C. Ấn bản: Bach-Gesellschaft Bd. 36 (Naumann 1890) qua Mutopia bwv-939 (.ly và .mid). Công cụ: script Python (mido) in nốt MIDI theo ô, đọc thêm tệp .ly. Kết quả: 4/4 ô khớp cao độ và trường độ hai tay (tay phải: lặng móc đơn, C4 E4 G4 E4 C4 B♭4 G4 | A4 C4 F4 A4 F4 C4 C5 A4 | B4 G4 B4 D5 B4 G4 F5 D5 | G4 C5 E5 trắng, lặng đen, G4 C5 E5 đen; tay trái C2+C3 nối ba ô | lặng móc đơn, C3 E3 G3 E3 C3 C4 E3). Nguồn không có dấu sắc thái, dấu luyến; khối cũng không thêm. Số ngón là gợi ý của trang, chơi được.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 4/4, đủ phách. Ô 1 tay phải rải Đô trưởng trên quãng tám Đô; ô 2 tay trái rải Fa trưởng (F2 A2 C3 F3), tay phải hợp âm Fa; ô 3 tay phải rải Sol bảy (B3 D4 F4 G4) trên quãng tám Sol; ô 4 Đô. Đúng lời dẫn (ô 1, 3 tay phải rải; ô 2 đổi vai). Ngón 1-2-3-5 và 5-3-2-1 chơi được; hợp chặng 3.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: 'Ô 1 viết ra láy dưới G3–F3–G3 (móc kép, móc kép, móc đơn) rồi G2 nốt đen, hai lần; ô 2–3 dùng !lowermordent! trên G3, khớp \mordent của bản gốc ô 9–11; tay phải B D F (Sol bảy, Fa♮ như ô 9 gốc); ô 4 Đô. Đủ phách. Ngón 1-2-1 rồi 5 cho G2 chơi được.'
