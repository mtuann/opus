ghi_chu: 'Bài học Bach, Prelude nhỏ Đô trưởng BWV 939 (tầng Tác phẩm). Bản nhạc: Mutopia bwv-939 (.ly và .mid, nguồn Bach-Gesellschaft Bd. 36, Naumann 1890; Hajo Dezelski), đối chiếu từng nốt cả 16 ô bằng script Python (mido) in nốt MIDI theo ô; MIDI ../opus-zero/_imslp/mid/mut_bwv939.mid cho cùng nốt với tệp tải từ Mutopia (chỉ khác tên track). Nguồn chép tay: Bach Digital đọc qua bản lưu Wayback (trang gốc chặn bot): trang BWV 939, P 804 tập nhỏ 53, cả tập P 804. Lời nói đầu Henle HN 106 (PDF trên henle.de). Ấn bản Peters: Bach Printed Music Database (bachbib.bw.edu). Kellner: ADB (Eitner) và Baker''s (Encyclopedia.com). Bản thu: Bach Cantatas Website (danh mục, bậc 3), Hyperion (album Hewitt), Österreichische Mediathek (album Gilbert), IMSLP (Kolodin, qua bản lưu Wayback). Sửa trang ở lượt 1: n14, n15 (Kellner, tập P 804, quyền tác giả), n20 (bỏ "một trong những bài Bach đầu tiên của rất nhiều người học đàn"), n21 (Bach-Gesellschaft và tên Fünf kleine Präludien), n23 (harpsichord: bỏ "nốt tắt khá nhanh", "ngân lâu hơn nhiều"), n29 (bỏ Nikolayeva), n64 (bỏ "các bản Urtext"), n75, n77, n78 (mục Nguồn: thay hai bài Wikipedia và sách Schulenberg chưa đọc bằng nguồn đã mở). Chưa chắc: n9 (định nghĩa nhịp điệu hòa âm, chưa thấy câu trong OMT). Không tính là nhận định: tiêu đề, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng, mốc trong ::khoi-nghe. Thuật ngữ trang dùng có trong thuat-ngu.yml: mordent (trang gọi "láy dưới", khớp nghĩa "chính – dưới – chính (có gạch)"), legato, non legato. Chưa có bản ghi: "nhịp điệu hòa âm" (harmonic rhythm), "nốt nền" (pedal point).'
