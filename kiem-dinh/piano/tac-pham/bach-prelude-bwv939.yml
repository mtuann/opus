doi_chu:
  - cu: "Không có bản viết tay nào của Bach cho bài này. Nguồn duy nhất từ thế kỷ 18 là một bản chép nằm trong tập P 804 ở Thư viện Quốc gia Berlin, một tập lớn đóng chung nhiều bản chép riêng lẻ. Tập này gắn với Johann Peter Kellner (1705–1772), cantor ở Gräfenroda, vùng Thüringen: ông và những người quanh ông đã chép rất nhiều tác phẩm đàn phím của Bach, và với không ít bài, bản chép của họ là nguồn sớm nhất hoặc duy nhất còn lại. Phần chứa BWV 939–942 do một người chép chưa rõ tên, và không ghi tên tác giả. Vì vậy quyền tác giả của Bach đôi khi bị đặt dấu hỏi, dù danh mục BWV và các ấn bản Urtext vẫn in bài dưới tên ông."
    moi: "Không có bản viết tay nào của Bach cho bài này. Nguồn duy nhất từ thế kỷ 18 là một bản chép nằm trong tập P 804 ở Thư viện Quốc gia Berlin, một tập lớn đóng chung nhiều bản chép riêng lẻ. Tập này phần lớn đến từ di sản của Johann Peter Kellner (1705–1772), cantor ở Gräfenroda, vùng Thüringen: 57 bản chép riêng lẻ, chủ yếu là nhạc đàn phím của Bach. Phần chứa BWV 939–942 do một người chép chưa rõ tên, và không ghi tên tác giả. Vì vậy không có bằng chứng trực tiếp rằng bài là của Bach, dù danh mục BWV và các ấn bản Urtext vẫn xếp bài dưới tên ông."
    ly_do: "n14 (da-sua), n15 (da-sua): Bach Digital, P 804: phần lớn từ di sản Kellner, 57 bản chép, chủ yếu nhạc Bach; vế \"nguồn sớm nhất hoặc duy nhất\" cho \"không ít bài\" và \"quyền tác giả đôi khi bị đặt dấu hỏi\" chưa có nguồn bậc 2 đọc được."
  - cu: "Cái tên \"prelude nhỏ\" là của thế kỷ 19. Năm 1843, nhà Peters ở Leipzig in một tập mười hai prelude ngắn, gom từ hai nguồn: Clavier-Büchlein (sổ tay đàn phím) mà Bach soạn cho con trai Wilhelm Friedemann, và tập P 804. Tên tập nói rõ mục đích: Douze petits Préludes ou Exercices pour les commençans (Mười hai prelude nhỏ, hay bài tập cho người mới bắt đầu). BWV 939 là số 2 của tập ấy, và từ đó trở thành một trong những bài Bach đầu tiên của rất nhiều người học đàn. Năm 1890, ấn bản toàn tập của Hội Bach (Bach-Gesellschaft) xếp nó đứng đầu nhóm Fünf kleine Präludien."
    moi: "Cái tên \"prelude nhỏ\" là của thế kỷ 19. Năm 1843, nhà Peters ở Leipzig in một tập mười hai prelude ngắn, gom từ hai nguồn: Clavier-Büchlein (sổ tay đàn phím) mà Bach soạn cho con trai Wilhelm Friedemann, và tập P 804. Tên tập nói rõ mục đích: Douze petits Préludes ou Exercices pour les commençans (Mười hai prelude nhỏ, hay bài tập cho người mới bắt đầu). BWV 939 là số 2 của tập ấy. Năm 1890, ấn bản toàn tập của Hội Bach (Bach-Gesellschaft, tập 36) in lại bài; danh mục BWV về sau xếp nó đứng đầu nhóm Fünf kleine Präludien (Năm prelude nhỏ, BWV 939–943)."
    ly_do: "n20 (da-sua), n21 (da-sua): vế \"một trong những bài Bach đầu tiên của rất nhiều người học đàn\" không kiểm được; IMSLP: BGA tập 36 in năm bài ở các trang rời (119, 123, 127, 134–35), tên Fünf kleine Präludien là nhóm theo số BWV."
  - cu: "Bach viết cho Clavier, tức đàn phím nói chung, như harpsichord hay clavichord. Trên harpsichord, nốt tắt khá nhanh và lực ngón gần như không làm tiếng to hay nhỏ đi; trên piano hiện đại, nốt ngân lâu hơn nhiều và bạn có cả một dải sắc thái. Chơi Bach trên piano vì thế là một chuỗi lựa chọn, bàn kỹ ở phần Diễn tấu. Xem thêm thời kỳ Baroque."
    moi: "Bach viết cho Clavier, tức đàn phím nói chung, như harpsichord hay clavichord. Trên harpsichord, lực ngón gần như không làm tiếng to hay nhỏ đi; trên piano, tiếng to hay nhỏ theo lực ngón, nên bạn có cả một dải sắc thái. Chơi Bach trên piano vì thế là một chuỗi lựa chọn, bàn kỹ ở phần Diễn tấu. Xem thêm thời kỳ Baroque."
    ly_do: "n23 (da-sua): Britannica (harpsichord) chỉ nói harpsichord không có dải mạnh nhẹ theo lực ngón; \"nốt tắt khá nhanh\", \"ngân lâu hơn nhiều\" chưa có nguồn."
  - cu: "Bài có mặt trong rất nhiều bản thu trọn các prelude nhỏ, cả trên harpsichord lẫn piano: chẳng hạn Kenneth Gilbert thu trên harpsichord, Angela Hewitt và Tatiana Nikolayeva thu trên piano. Hãy nghe ít nhất một bản harpsichord và một bản piano, rồi ghi lại: bản nào nhanh hơn, bản nào thay đổi sắc thái nhiều hơn, hình rải liền hay hơi tách. Muốn nghe trước bài bạn sẽ học ở chặng sau của lộ trình, mở bản thu và bảng Theo dõi khi nghe của Prelude BWV 846."
    moi: "Bài có mặt trong rất nhiều bản thu trọn các prelude nhỏ, cả trên harpsichord lẫn piano: chẳng hạn Kenneth Gilbert thu trên harpsichord, Angela Hewitt thu trên piano. Hãy nghe ít nhất một bản harpsichord và một bản piano, rồi ghi lại: bản nào nhanh hơn, bản nào thay đổi sắc thái nhiều hơn, hình rải liền hay hơi tách. Muốn nghe trước bài bạn sẽ học ở chặng sau của lộ trình, mở bản thu và bảng Theo dõi khi nghe của Prelude BWV 846."
    ly_do: "n29 (da-bo): bản thu của Nikolayeva chỉ thấy ở danh mục bậc 3 (Bach Cantatas Website)."
  - cu: "Bản Bach-Gesellschaft và các bản Urtext chỉ có nốt và các dấu láy. Nhiều ấn bản dạy đàn thêm sắc thái, dấu luyến, tốc độ và số ngón của người biên tập: có thể hữu ích, nhưng hãy biết đâu là của nguồn gốc, đâu là của người biên tập. Số ô nhịp trên trang này theo bản Bach-Gesellschaft."
    moi: "Bản Bach-Gesellschaft chỉ có nốt và các dấu láy. Nhiều ấn bản dạy đàn thêm sắc thái, dấu luyến, tốc độ và số ngón của người biên tập: có thể hữu ích, nhưng hãy biết đâu là của nguồn gốc, đâu là của người biên tập. Số ô nhịp trên trang này theo bản Bach-Gesellschaft."
    ly_do: "n64 (da-sua): phần \"các bản Urtext\" chưa kiểm được; bản BG (Mutopia) chỉ có nốt và dấu láy."
  - cu: "Bài \"Twelve Little Preludes\", Wikipedia tiếng Anh (tổng hợp từ cơ sở dữ liệu Bach Digital và danh mục BWV): nguồn P 804, người chép, các ấn bản Peters 1843 và Bach-Gesellschaft 1890."
    moi: "Bach Digital (Bach-Archiv Leipzig): trang BWV 939 và trang bản chép D-B Mus.ms. Bach P 804, tập nhỏ 53 (người chép chưa rõ, không ghi tên tác giả, khoảng 1726–1727 hoặc muộn hơn) và cả tập P 804 (phần lớn từ di sản của Kellner) (bach-digital.de)."
    ly_do: "n75 (da-sua): thay nguồn bậc 3 bằng Bach Digital đã đọc (bản lưu Wayback)."
  - cu: "Bài \"Johann Peter Kellner\", Wikipedia tiếng Anh: tiểu sử và vai trò người chép nhạc Bach."
    moi: "Bach Printed Music Database (Riemenschneider Bach Institute): tập 12 petits préludes của nhà Peters (F. K. Griepenkerl biên tập), thứ tự các bài (bachbib.bw.edu)."
    ly_do: "n77 (da-sua): thay nguồn bậc 3 bằng nguồn đã đọc cho ấn bản Peters."
  - cu: "David Schulenberg, The Keyboard Music of J. S. Bach, ấn bản 2, Routledge, 2006."
    moi: "Robert Eitner, \"Kellner, Johann Peter\", Allgemeine Deutsche Biographie 15 (1882) (deutsche-biographie.de)."
    ly_do: "n78 (da-sua): sách in chưa đọc, không nhận định nào dựa vào; thay bằng ADB cho Kellner."
  - cu: 'Khoảng ABRSM Grade 3 (ước lượng)'
    moi: 'Khoảng ABRSM Grade 3 (ước lượng); RCM xếp bài ở Level 5 (đề cương 2022)'
    ly_do: 'Review D6-L2-gom: bản ghi tac-pham/bach-prelude-bwv939 n20 (thong_tin, Độ khó): thêm mức RCM theo đề cương 2022 (tr. 44: Piano Repertoire 5, List A, Little Prelude in C Major, BWV 939); Grade 3 vẫn là ước lượng theo grade đã khóa.'
