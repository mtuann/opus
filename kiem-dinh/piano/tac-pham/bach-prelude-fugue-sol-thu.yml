nhan_dinh:
  - id: n1
    cau: 'Tiêu đề và câu mở đầu: Bach, Prelude và fugue Sol thứ BWV 861, cặp số 16 của Bình quân luật quyển 1.'
    loai: danh-muc
    nguon: [ bga-1866, imslp-wtc1, henle-hn14 ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 57: "PRAELUDIUM XVI.", hai dấu giáng (Sol thứ); Henle: "Prelude g minor BWV 861", "Fugue g minor BWV 861". Review (Claude, 24/11/2026): trang sản phẩm Henle HN 14 (tải lại): "Prelude g minor BWV 861", "Fugue g minor BWV 861"; bản quét tr. 57 "PRAELUDIUM XVI.": khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)", "https://www.henle.de/The-Well-Tempered-Clavier-Part-I-BWV-846-869/HN-14", "https://www.abrsm.org/sites/default/files/2024-06/ARSM%20Repertoire%20(June%202024%20-%20Piano)%20PROOF4%20(Final)%20(1).pdf" ]
    luot_2_ghi_chu: Henle liệt kê Prelude/Fugue g minor BWV 861 là cặp thứ 16 trong HN 14; ABRSM ghi 'Prelude and Fugue No. 16 in G minor, BWV 861' dưới WTC Part I.
    review: dung
  - id: n2
    cau: 'Fugue có bốn bè và 34 ô; prelude có 19 ô.'
    loai: cau-truc
    nguon: [ bga-1866, mut-805, mut-806 ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 58: "a 4."; fugue: số ô in 30 ở đầu hệ 5 tr. 59, hệ 6 có ô 32–34. Prelude tr. 57: 19 ô. explore.py bars trên MIDI Mutopia: prelude 19 ô, fugue 34 ô; kern cùng số ô.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=805", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=806" ]
    luot_2_ghi_chu: "BG: 'FUGA XVI. a 4.', đếm 34 ô (số ô in 5, 10, 15, 20, 25, 30); Praeludium 19 ô. MIDI Mutopia cũng 34 và 19 ô."
    review: dung
  - id: n3
    cau: 'Prelude không phải dòng móc kép đều như BWV 847 mà là một nốt ngân dài có láy rền, bên dưới các bè khác chuyển động.'
    loai: cau-truc
    nguon: [ bga-1866, mut-806 ]
    ket_qua: dung
    ghi_chu: 'Tr. 57 ô 1: Sol5 nốt tròn có tr, nối sang ô 2; khuông dưới móc kép và Sol3 móc đơn. Mutopia: g''''1^\trill. Phần so với BWV 847 (móc kép liên tục hai tay) theo trang đã khóa piano/tac-pham/bach-prelude-fugue-do-thu.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)", "https://www.mutopiaproject.org/ftp/BachJS/BWV861/BWV861_Praeludium16/BWV861_Praeludium16.ly" ]
    luot_2_ghi_chu: "BG ô 1: Sol5 tròn có tr, nối sang ô 2; hai bè dưới móc kép và Sol3 móc đơn lặp."
    review: dung
  - id: n4
    cau: 'Chủ đề fugue ngắn, có bước nhảy quãng 6 thứ đi xuống; bốn bè vào lần lượt trong bảy ô đầu.'
    loai: cau-truc
    nguon: [ bga-1866, kern-wtc1-16, wiki-bwv861 ]
    ket_qua: dung
    ghi_chu: 'Alto ô 1: Rê4 Mi♭4 Sol3 Fa♯3 Sol3 (Mi♭4 xuống Sol3: 8 nửa cung, quãng 6 thứ). Lần vào: alto ô 1, soprano ô 2 phách 3,5, bass ô 5 phách 1,5, tenor ô 6 phách 3,5 (kern; bản quét tr. 58 hệ 1–2 khớp). Wikipedia: "minor 6th leap in the first measure". Review (Claude, 24/11/2026): bản quét tr. 58 hệ 1 ở 300 dpi: alto ô 1 lặng móc đơn, Rê4 Mi♭4 (khuông trên), Sol3 móc đơn, Fa♯3 Sol3 móc đen; Mi♭4 xuống Sol3 là quãng 6 thứ; bốn lần vào ô 1, 2, 5, 6 khớp bản đồ: khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)", "https://www.mutopiaproject.org/ftp/BachJS/BWV861/BWV861_Fuga16/BWV861_Fuga16.mid" ]
    luot_2_ghi_chu: "Chủ đề Rê4–Mi♭4–Sol3 (Mi♭ xuống Sol = quãng 6 thứ). Lần vào: alto ô 1 phách 1,5; soprano ô 2 phách 3,5; bass ô 5 phách 1,5; tenor ô 6 phách 3,5 (đáp đề hết ở ô 7)."
    review: dung
  - id: n5
    cau: 'Ở ô 17 và ô 28–29 chủ đề vào ở bè mới khi bè trước chưa chơi xong (stretto); ở ô 28–29 ba bè vào liền nhau, mỗi bè cách bè trước nửa ô.'
    loai: cau-truc
    nguon: [ bga-1866, mut-805, kern-wtc1-16, earsense-16 ]
    ket_qua: dung
    ghi_chu: 'Kern: ô 17 bass Fa3 (phách 1,5) Sol3 Si♭2 La2 Si♭2, alto Đô5 (phách 3,5) Rê5 Fa4 Mi♭4 Fa4; ô 28 soprano Rê5 (phách 1,5) Mi♭5 Sol4 Fa♯4 Sol4, tenor Rê4 (phách 3,5) Mi♭4 Sol3 Fa♯3 Sol3; ô 29 bass Rê3 (phách 1,5) Mi♭3 Sol2 Fa♯2. Bản quét tr. 58 hệ 6 ô 2 (ô 17) và tr. 59 hệ 4 ô 3, hệ 5 ô 1 (ô 28–29) ở 300–500 dpi: khớp. Chủ đề dài một ô rưỡi (tới Si♭ móc đen phách 3 ô 2), nên các lần vào này chồng lên bè trước. Earsense: stretto ở nhiều chỗ. Review (Claude, 24/11/2026): bản quét tr. 59 hệ 4 ô 3 và hệ 5 ô 1 ở 450 dpi: soprano vào ô 28 phách 1,5 (Rê5 Mi♭5 Sol4, Fa♯4 móc đen phách 3), tenor phách 3,5 (Rê4 Mi♭4 Sol3), bass ô 29 phách 1,5 (Rê3 Mi♭3 Sol2, Fa♯2, La2): khớp.'
