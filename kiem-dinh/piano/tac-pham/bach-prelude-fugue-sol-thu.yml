  - id: n22
    cau: 'Láy rền thời Baroque bắt đầu từ nốt trên (ở đây La), đúng phách; kết bằng nốt kết dẫn vào nốt tiếp theo; khi mới học chốt một con số, khi đã chắc có thể bắt đầu thong thả rồi nhanh dần; không được làm trễ phách sau.'
    loai: quy-tac
    nguon: [ site-not-hoa-my, cpe-versuch, commons-bach-bang ]
    ket_qua: dung
    ghi_chu: 'piano/not-hoa-my (đã khóa) mục Láy rền: "Bắt đầu từ nốt nào" (Baroque: nốt trên, đúng phách), "Nốt kết", "Bao nhiêu nốt" ("chốt một con số", "bắt đầu thong thả rồi nhanh dần", "không được phép là làm trễ phách sau"). Nốt liền trên Sol theo hóa biểu Sol thứ là La. Review (Claude, 24/11/2026): thêm nguồn gốc thay cho Duffin, American Recorder của lượt 2: C. P. E. Bach, Versuch I.2.3 §5 (bản song ngữ, tải 24/11/2026): láy rền "always starts from the second above the main tone"; bảng Explication của J. S. Bach (Commons) là nguồn của trang đã khóa piano/not-hoa-my. "Đúng phách", "chốt một con số", "thong thả rồi nhanh dần", "không làm trễ phách sau" lấy từ trang đã khóa ấy (có nguồn riêng). Đủ.'
    luot_2: dung
    luot_2_nguon: [ "https://casfaculty.case.edu/ross-duffin/?p=2296", "https://americanrecorder.org/docs/AR_Fall2020_Ornaments1_appog_trill.pdf" ]
    luot_2_ghi_chu: "Duffin: láy rền là luân phiên nốt trên với nốt viết, chuẩn bị bằng nốt trên; có các kiểu kết dẫn vào nốt sau. American Recorder (2020): láy rền ngắn 'starts exactly on the beat'; láy rền dài 'start slowly and gradually increase in speed'. Phần 'chốt một con số khi mới học', 'không làm trễ phách sau' là lời khuyên tập, hợp lý. Không tìm được trang mở được trình bày bảng Explication của Bach."
