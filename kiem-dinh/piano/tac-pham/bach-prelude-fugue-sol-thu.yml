    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Fugue ô 28–29, K:Gm, L:1/16. Ấn bản: bga-1866 tr. 59 hệ 4 ô 3 (500 dpi) và hệ 5 ô 1 (400 dpi). Ô 28 soprano: Fa♯4 Rê5 Mi♭5 Sol4 móc đơn, Fa♯4 đen (dấu thăng in trước nốt), Sol4 đen; alto: Rê4 đen, lặng đen, lặng móc đơn, Rê5 Đô5 móc kép, Si♭4 móc đơn, Đô5 Rê5 móc kép; tenor: lặng trắng, lặng móc đơn, Rê4 Mi♭4 Sol3 móc đơn; bass: Rê3 đen, lặng đen, lặng trắng. Ô 29 soprano: lặng móc đơn, La4 Si♭4, Đô5, Si♭4 La4, Rê5 móc đơn, lặng móc đơn, lặng đen; alto: Mi♭5 Rê5 Đô5 Mi♭5 La4 móc đơn, lặng móc đơn, lặng đen; tenor: Fa♯3 đen, Sol3 đen, lặng móc đơn, La3 Si♭3, Đô4, Si♭3 La3; bass: lặng móc đơn, Rê3 Mi♭3 Sol2 móc đơn, Fa♯2 đen, La2 đen. Mutopia khuông trên "fis''8 d'''' ees'''' g'' fis''4 g''4 a''''8\rest a''16 bes'' c''''8 bes''16 a'' d''''8 …" (Fa♯4 phách 3) khớp bản in. Kern wtc1f16 ô 28 soprano phách 3 ghi "4f" (Fa♮4): khác bản in và Mutopia; khối theo bản in. Các nốt khác kern khớp. Review (Claude, 24/11/2026): so từng nốt với bản quét tr. 59 hệ 4 ô 3 và hệ 5 ô 1 ở 450 dpi: ô 28 soprano Fa♯4 (có dấu thăng) Rê5 Mi♭5 Sol4, Fa♯4 móc đen, Sol4; alto Rê4 móc đen, lặng, Rê5 Đô5, Si♭4, Đô5 Rê5; tenor lặng rồi Rê4 Mi♭4 Sol3 từ phách 3,5; bass Rê3 móc đen rồi lặng. Ô 29 soprano lặng móc đơn, La4 Si♭4, Đô5, Si♭4 La4, Rê5; alto Mi♭5 Rê5 Đô5 Mi♭5 La4; tenor Fa♯3 Sol3 móc đen, lặng, La3 Si♭3, Đô4, Si♭3 La3; bass lặng, Rê3 Mi♭3 Sol2, Fa♯2 móc đen, La2 móc đen. Bốn bè mỗi ô đủ 16 móc kép. Khớp, không sửa.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 4/4, K:Gm, L:1/16. Tay phải: ô 1 La5 Sol5 xen kẽ 14 móc kép rồi Fa♯5 Sol5 (ngón 4-3, 2-3); ô 2 16 móc ba La–Sol (bằng 8 móc kép) rồi Fa♯5 móc đơn, Sol5 đen chấm; ô 3 Sol5 nốt tròn có !trill!; ô 4 hợp âm Sol4–Si♭4–Rê5–Sol5. Tay trái ô 1–3 hình móc kép Si♭3 Rê4 Đô4 Mi♭4 Si♭3 Rê4 La3 Đô4 (ngón 4-1-2-1 4-1-5-2) như bè giữa ô 1 bản in; ô 4 Sol2–Rê3–Sol3. Đủ phách. Review (Claude, 24/11/2026): đếm phách: tay phải ô 1 16 móc kép, ô 2 tám cặp móc ba (bằng 8 móc kép) + Fa♯ móc đơn + Sol đen chấm = 16, ô 3–4 nốt tròn; tay trái 16 mỗi ô. Hòa âm như bè giữa ô 1 bản in (Sol thứ); ngón tay phải 4-3 cho láy rền, 2-3 cho nốt kết; tay trái 4-1-2-1 4-1-5-2 chơi được. Lời kèm khớp.'
  - khoi: 5
    loai: vi-du-soan
