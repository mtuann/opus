    bac: 2
    ten: 'Wikipedia (en), Prelude and Fugue in G minor, BWV 861 (wikitext đọc 24/11/2026), mục Harmonic analysis: prelude (m. 3 chuỗi nốt treo, La trưởng, Rê trưởng, về Sol thứ; "series of modulations … arriving in B♭ major for the recapitulation of the opening theme"; m. 9 "sequence … establishes C minor"; "recapitulation of the opening measure in mm. 11, this time in C minor"; m. 14 về Sol thứ; m. 17 Neapolitan, D7 có nốt treo 4-3; "penultimate measure begins with a pedal tone"; Picardy third); fugue (bè 2 vào "on the pickup to the fourth beat of m. 2", ở Rê thứ, nốt đầu là Sol; bè 3 ô 5 giọng chủ, bè 4 một ô sau ở giọng át; "first episode begins in D and modulates to the B♭ major"; "minor 6th leap in the first measure")'
