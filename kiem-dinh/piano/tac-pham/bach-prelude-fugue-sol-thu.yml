  - id: n24
    cau: 'Chủ đề dài một ô rưỡi, hai nửa: ba móc đơn Rê – Mi♭ – Sol với bước nhảy quãng 6 thứ đi xuống (Mi♭ xuống Sol), rồi hai móc đen Fa♯ – Sol; nửa sau, sau một dấu lặng móc đơn, là một nhóm móc kép quanh nốt Si♭ (La Si♭ móc kép, Đô móc đơn, Si♭ La móc kép), kết ở nốt Si♭ móc đen.'
