    loai: lich-su
    nguon: [ henle-848-vw ]
    ket_qua: da-sua
    ghi_chu: 'Henle: "Clementi''s contemporaries attested to his great dexterity and virtuosity at the keyboard". Chữ cũ "Ông là một trong những nghệ sĩ piano lớn đầu tiên" không kiểm được. Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.treccani.it/enciclopedia/muzio-clementi_(Dizionario-Biografico)/", "https://www.henle.de/en/Six-Piano-Sonatinas-op.-36/HN-848" ]
    luot_2_ghi_chu: "Treccani: ở London 'non tardò a farsi un nome come insegnante e pianista'; Mozart (thư 1782) công nhận 'molta speditezza nella mano destra' dù chê thiếu tình cảm; Henle: 'establishes himself as a piano virtuoso'. Ghi chú: Mozart chê nhiều hơn khen."
    review: dung
  - id: n13
    cau: 'Về sau Clementi chuyển sang dạy đàn, xuất bản nhạc và sản xuất đàn piano.'
    loai: lich-su
    nguon: [ henle-848-vw, treccani ]
    ket_qua: dung
    ghi_chu: 'Henle: "increasingly turned his attention to teaching ... and to his work as a publisher ... musical instrument dealer, and particularly fostered the construction of keyboard instruments"; Treccani: từ 1798 làm xuất bản với Longman, rồi Collard; mở xưởng làm và bán piano.'
    luot_2: dung
    luot_2_nguon: [ "https://www.treccani.it/enciclopedia/muzio-clementi_(Dizionario-Biografico)/" ]
    luot_2_ghi_chu: "Treccani: tăng cường dạy đàn; 1798 bắt đầu xuất bản (với Longman); cùng Collard 'aprì una fabbrica… di pianoforti'."
  - id: n14
    cau: 'Học trò của Clementi có John Field, người khởi xướng thể loại nocturne.'
