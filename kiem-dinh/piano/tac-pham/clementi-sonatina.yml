    ghi_chu: '4 ô 4/4 Đô trưởng, đủ phách. Tay phải gam Đô đi lên (C1 … F1 … c5), xuống (B4 … F1, E3), hợp âm rải, kết D–B–C; tay trái Alberti C G E G (trầm – cao – giữa – cao), B,, G, D, G, (Sol), G,, G, F, G, (Sol bảy), hợp âm Đô. Giai điệu hợp hợp âm. Ngón cái luồn sau ngón 3 (E3 → F1) đúng lời dẫn. Hợp chặng 3.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4 Fa trưởng. Tay trái chùm ba F A C, G B♭ C (Đô bảy), ô 3 F A C – D F B♭ – C E G (đổi hợp âm mỗi phách, đúng lời dẫn), F A C; tay phải c–A, B♭–G, A–F–G, F nằm trong hợp âm. Ngón 5-3-1, 5-2-1 chơi được.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/8 (L:1/16), đủ phách. Cặp luyến hai móc kép rồi hai móc đơn staccato, trên Sol – Rê bảy – Sol – Sol; tay trái nốt staccato. Giọng Sol trưởng (chương III gốc ở Đô trưởng, nhưng ví dụ soạn không trích). Ngón 3-1, 4-2, 5-1 (D5 → D4 quãng tám) chơi được.'
doi_chu:
  - cu: 'mô tả: Đây có lẽ là bản sonatina được học nhiều nhất thế giới: ba chương ngắn, sáng sủa, chứa gần như mọi "viên gạch" của nhạc Cổ điển, từ gam, hợp âm rải, hình đệm…'
    moi: 'mô tả: Đây là một trong những bản sonatina được học nhiều nhất: ba chương ngắn, sáng sủa, chứa gần như mọi "viên gạch" của nhạc Cổ điển, từ gam, hợp âm rải, hình đệm…'
    ly_do: 'n1 (da-sua): mô tả trang (description); "nhiều nhất thế giới" không kiểm được, Henle: Op. 36 "still extremely popular".'
  - cu: 'Đây có lẽ là bản sonatina được học nhiều nhất thế giới: ba chương ngắn, sáng sủa, chứa gần như mọi "viên gạch" của nhạc Cổ điển, từ gam, hợp âm rải, hình đệm Alberti đến một hình thức sonata thu nhỏ. Chơi trọn nó là cột mốc của chặng sơ trung cấp.'
    moi: 'Đây là một trong những bản sonatina được học nhiều nhất: ba chương ngắn, sáng sủa, chứa gần như mọi "viên gạch" của nhạc Cổ điển, từ gam, hợp âm rải, hình đệm Alberti đến một hình thức sonata thu nhỏ. Chơi trọn nó là cột mốc của chặng sơ trung cấp.'
    ly_do: 'n1 (da-sua): như trên, đoạn mở đầu.'
  - cu: 'Muzio Clementi sinh ở Roma năm 1752. Khi còn là thiếu niên, ông được một người Anh giàu có, Peter Beckford, đưa về Anh, và sống phần lớn đời mình ở London. Ông là một trong những nghệ sĩ piano lớn đầu tiên: năm 1781 ở Vienna, ông và Mozart thi tài trước Hoàng đế Joseph II. Về sau Clementi chuyển sang dạy đàn, xuất bản nhạc và sản xuất đàn piano; học trò của ông có John Field, người khởi xướng thể loại nocturne.'
    moi: 'Muzio Clementi sinh ở Roma năm 1752. Năm 1766, khi mới khoảng 14 tuổi, ông được một người Anh, Peter Beckford, đưa về Anh, và sống phần lớn đời mình ở London. Người đương thời khen ngón đàn điêu luyện của ông: năm 1781 ở Vienna, ông và Mozart thi tài trước Hoàng đế Joseph II. Về sau Clementi chuyển sang dạy đàn, xuất bản nhạc và sản xuất đàn piano; học trò của ông có John Field, người khởi xướng thể loại nocturne.'
    ly_do: 'n10 (da-sua): năm 1766 theo COD, Treccani; "giàu có" chưa có nguồn. n12 (da-sua): "một trong những nghệ sĩ piano lớn đầu tiên" không kiểm được; Henle: người đương thời khen ngón đàn điêu luyện.'
  - cu: 'Cùng chặng trên site: Burgmüller: Arabesque, Chopin: Valse La thứ.'
    moi: 'Cùng chặng trên site: Burgmüller: Arabesque, Bach: Prelude nhỏ BWV 939.'
    ly_do: 'n57 (da-sua): Chopin Valse La thứ ở chặng 5 (src/data/tac-pham.yml), không cùng chặng 3.'
  - cu: 'Leon Plantinga, Clementi: His Life and Music, Oxford University Press, 1977.'
    moi: Dizionario Biografico degli Italiani, mục "Clementi, Muzio" (treccani.it).
    ly_do: 'n63 (da-sua): sách in chưa đọc; thay bằng nguồn đã mở.'
  - cu: Muzio Clementi, Introduction to the Art of Playing on the Piano Forte, London, 1801.
    moi:
      - 'G. Henle Verlag, HN 848 Six Piano Sonatinas op. 36: lời nói đầu (henle.de).'
      - Muzio Clementi, Introduction to the Art of Playing on the Piano Forte, London, 1801; câu về legato đọc ở một lần in khoảng thập niên 1810 (Internet Archive).
    ly_do: 'n63 (da-sua): thêm Henle HN 848; ghi lần in đã đọc của sách Introduction. Hai dòng danh sách.'
  - cu: 'Nếu có thể, nghe thêm một bản trên đàn fortepiano (đàn piano thời Clementi): tiếng mỏng và rõ hơn, giúp bạn hình dung độ trong của nhạc Cổ điển. Để nghe hình thức sonata ở quy mô lớn hơn, xem hướng dẫn nghe Mozart, Sonata K. 331.'
    moi: 'Nếu có thể, nghe thêm một bản trên đàn fortepiano (đàn piano thời Clementi) để so tiếng đàn với đàn hiện đại. Để nghe hình thức sonata ở quy mô lớn hơn, xem hướng dẫn nghe Mozart, Sonata K. 331.'
    ly_do: 'Review D6-L2-gom: n22: bỏ vế "tiếng mỏng và rõ hơn, giúp bạn hình dung độ trong của nhạc Cổ điển" (nhận xét về âm sắc, không có nguồn), giữ lời khuyên nghe.'
  - cu: Khoảng ABRSM Grade 3 (ước lượng)
    moi: "Khoảng ABRSM Grade 3: ABRSM xếp chương 3 (Vivace) ở Grade 3 (đề cương 2023–2024), RCM xếp chương 1 ở Level 3; Henle mức 3"
    ly_do: 'mo/hoan-thien (09/11/2026, ke-hoach-mo-rong 4.3.2): dòng Độ khó ghi đề cương ABRSM thay "(ước lượng)", dữ kiện như n4 của hồ sơ bản ghi.'
