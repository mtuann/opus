    luot_2_ghi_chu: "Grove: sonatina cùng hình thức với sonata nhưng 'shorter, simpler, and slighter'; Hutchinson: 'sonatina form is sonata form without the development section'. Vế 'ít chương hơn' không thấy nói rõ ở hai nguồn này nhưng hợp với thực tế (Op. 36 ba chương, số 6 hai chương)."
