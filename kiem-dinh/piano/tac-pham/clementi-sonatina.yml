ghi_chu: 'Bài học Clementi, Sonatina Đô trưởng Op. 36 số 1 (tầng Tác phẩm). Bản nhạc: Mutopia sonatina-1 (.ly và ba tệp .mid, nguồn Sonatina Album, G. Schirmer 1893, Brian D. Rude); tệp .ly không có dấu luyến, staccato hay sắc thái, nên phát âm chương III đối chiếu thêm bản quét Sonatina Album (Schirmer, Köhler) trên Internet Archive (tr. 33–35). Số ô đếm trên .ly: I 38 ô, II 26 ô, III 70 ô (lặp viết ra). Ba khối abc đều là ví dụ soạn. Nguồn lịch sử: lời nói đầu Henle HN 848 (PDF), Dizionario Biografico degli Italiani (Treccani), Concise Oxford Dictionary of Music và Baker''s qua Encyclopedia.com, IMSLP (Op. 36), Britannica (sonatina, bản lưu Wayback), Open Music Theory (Sonata Form, đọc bằng curl), sách Introduction của Clementi (bản in khoảng thập niên 1810 trên Internet Archive). Sửa trang ở lượt 1: n1 (bỏ "có lẽ ... nhiều nhất thế giới", cả ở description), n10 (năm 1766, khoảng 14 tuổi; bỏ "giàu có"), n12 (bỏ "một trong những nghệ sĩ piano lớn đầu tiên"), n57 (Cùng chặng: Chopin Valse La thứ ở chặng 5, thay bằng Bach BWV 939 chặng 3), n63 (mục Nguồn: sách Plantinga chưa đọc thay bằng Treccani và Henle; ghi lần in của sách Introduction). Chưa chắc: n48 (tốc độ chương I: "nhiều ấn bản khác ghi Allegro"). Không tính là nhận định: tiêu đề, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng, mốc trong ::khoi-nghe.'
