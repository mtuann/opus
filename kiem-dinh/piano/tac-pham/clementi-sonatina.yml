    luot_2_nguon: [ "https://www.treccani.it/enciclopedia/muzio-clementi_(Dizionario-Biografico)/" ]
    luot_2_ghi_chu: "Treccani: năm 1766 Peter Beckford nghe ông chơi ở Roma và thuyết phục gia đình để đưa sang Anh; sau đó ông lập nghiệp ở London. Sinh 1/1752 nên năm 1766 khoảng 14 tuổi."
