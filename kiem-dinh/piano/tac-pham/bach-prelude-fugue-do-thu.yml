lan:
- so: 1
  ngay: '2026-11-05'
  nhanh: moi/d6-l5
  ma_bam: null
  nguoi:
    luot_1: Claude Opus 5.5, agent con, D6-L5 phần A
    luot_2: null
    review: null
    kiem_mau: null
ghi_chu: 'Bài học BWV 847 (tầng Tác phẩm). Bản nhạc: Mutopia bwv847a (prelude, Breitkopf & Härtel 1866) và fuga2 (fugue, Edition Peters), tải .ly và .mid 05/11/2026 với User-Agent opus-kiem-dinh; đếm ô và in nốt theo ô bằng script Python (mido): prelude 38 ô, fugue 31 ô; mọi số ô trên trang khớp. Script tìm đầu chủ đề cho ra tám lần vào (ô 1, 3, 7, 11, 15, 20, 26, 29). Mốc ::khoi-nghe "0 10 49 65 76 108 115 128 135 192" (10 mốc / 10 dòng) dùng bản thu Ishizaka hai phần (prelude 107,29 s, fugue 115,93 s); theo tools/audio/align/pieces.py mốc là ô 5, 21, 28, 34 của prelude và ô 3, 7, 9, 26 của fugue (cộng 107,29 s): khớp các dòng bảng. Không nghe lại bản thu. Sửa trang: n10 (bỏ "nhanh và gắt hơn"), n30 (bỏ "(tách tiếng, nhịp sắc)"), mục Nguồn (n126, n127, n128: bỏ hai sách in chưa đọc, thêm lời nói đầu Henle HN 14 và link tệp Mutopia). Chưa chắc: n23, n30 (các nghệ sĩ thu âm), n116, n118. Câu ve-site ở hồ sơ khác: hinh-thuc/fugue n33, lich-su/thoi-ky/baroque n48 (link tới trang này): trang có ở đúng đường dẫn, là bài học BWV 847: đúng. hinh-thuc/fugue n16–n29, n42 (BWV 847 ba bè, 31 ô, kết Đô trưởng): trang này nói giống. piano/tac-pham/bach-prelude-do n86, n87: trang này giữ (cặp ngay sau; Presto, Adagio, Allegro). Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ trang dùng (mordent, staccato, legato, non legato) có trong src/data/thuat-ngu.yml; "đáp đề điệu tính", "đối đề", "đoạn chuyển", "quãng 3 Picardy" dùng như trang đã khóa hinh-thuc/fugue.'
