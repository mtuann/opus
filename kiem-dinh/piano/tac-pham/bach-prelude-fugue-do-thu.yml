  ket_qua: dung
  ghi_chu: 'Ô 1–24 nốt đầu tay phải: C5 Ab4 B4 C5 Eb5 D5 D5 C5 C5 Bb4 Bb4 Ab4 Ab4 G4 F4 F4 F4 Eb4 … (thường là nốt cao nhất của hình).'
- id: n28
  cau: Trong fugue, chủ đề (kể cả đáp đề) vào tám lần.
  loai: cau-truc
  nguon: *id002
  ket_qua: dung
  ghi_chu: 'Script tìm đầu chủ đề trong MIDI: ô 1 alto, 3 soprano, 7 bass, 11 soprano, 15 alto, 20 soprano, 26 bass, 29 soprano (8 lần; các đầu chủ đề ở ô 9–10, 22–24 là mảnh trong đoạn chuyển).'
- id: n29
  cau: Bè alto là bè khó nghe nhất vì nằm giữa.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n30
  cau: Glenn Gould, Sviatoslav Richter, András Schiff, Angela Hewitt đều thu âm Bình quân luật; Gustav Leonhardt thu trên harpsichord.
  loai: ten
  nguon: []
  ket_qua: null
  ghi_chu: 'Đã sửa: bỏ "(tách tiếng, nhịp sắc)" sau tên Gould (đánh giá, không nguồn; như D6-L3 bỏ câu đánh giá về Gould ở bach-prelude-do n32). chưa chắc: chưa mở trang hãng đĩa hay danh mục bản thu của nghệ sĩ; lượt 2 kiểm.'
- id: n31
  cau: Link Prelude Đô trưởng (/opus/piano/tac-pham/bach-prelude-do/).
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: Trang có (src/content/docs).
- id: n32
  cau: 'Theo dõi: Prelude mở đầu ô 1–4, hai tay cùng một kiểu hình móc kép trên nốt Đô trầm đứng yên.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: Bè trầm C3 ở đầu mỗi nửa ô ô 1–6.
- id: n33
  cau: 'Theo dõi: Chuyển giọng ô 5–20, bè trầm đi xuống dần, hòa âm đổi mỗi ô; sáng lên quanh Mi♭ trưởng (ô 11–14) rồi về Đô thứ.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: Bè trầm C (1–6), B♭ (7–8), A♭ (9–10), G (11); ô 11 Mi♭/Sol, ô 14 Mi♭; ô 18 Đô thứ.
- id: n34
  cau: 'Theo dõi: Âm nền át ô 21–27, bè trầm dừng trên Sol; từ ô 25 hình nốt biến đổi.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: Bè trầm G2 ô 21–28; ô 25 tay trái chỉ G2 B2 D3, phần còn lại ở khuông dưới do tay phải.
- id: n35
  cau: 'Theo dõi: Presto ô 28–33, tay phải chạy trước, từ ô 29 tay trái đuổi theo cùng hình nốt.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
- id: n36
  cau: 'Theo dõi: Adagio rồi Allegro ô 34–38, một ô chậm tự do đầy nốt trang trí, rồi về hợp âm Đô trưởng cuối bài.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Ô 38 kết E4 (Mi♮) có dấu ngân: hợp âm Đô trưởng.'
- id: n37
  cau: 'Theo dõi: Fugue ô 1–2, bè alto một mình với chủ đề.'
