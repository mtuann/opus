nhan_dinh:
- id: n1
  cau: 'Tiêu đề: "Bach: Prelude và fugue Đô thứ, BWV 847".'
  loai: ten
  nguon: [henle-hn14, imslp-wtc1]
  ket_qua: dung
  ghi_chu: 'Henle: "Prelude c minor BWV 847", "Fugue c minor BWV 847".'
- id: n2
  cau: BWV 847 là cặp thứ hai của Bình quân luật quyển 1 (mô tả và câu mở đầu).
  loai: danh-muc
  nguon: [imslp-wtc1, henle-hn14]
  ket_qua: dung
- id: n3
  cau: Prelude dựng trên móc kép liên tục ở hai tay; fugue có ba bè (giọng) độc lập.
  loai: cau-truc
  nguon: [mut-847-pre, mut-847-fug]
  ket_qua: dung
  ghi_chu: 'Prelude ô 1–24 hai tay móc kép; fugue: subtitle "a 3 Voci", ba voice sopran, alt, bass trong .ly.'
- id: n4
  cau: 'Link Invention số 1 (/opus/piano/tac-pham/bach-invention-1/): bước từ một bè lên hai bè.'
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: 'Trang chưa chuyển, có ở ../opus-zero/docs/piano/tac-pham/bach-invention-1.md (Invention hai bè; tac-pham.yml: "Phức điệu hai bè"); hiện "sắp có". Điều cần giữ: bài học Invention số 1 hai bè.'
- id: n5
  cau: Fugue có 31 ô nhịp.
  loai: cau-truc
  nguon: &id002 [mut-847-fug]
  ket_qua: dung
  ghi_chu: 'MIDI Mutopia: 31 ô 4/4.'
- id: n6
  cau: Ba bè vào lần lượt rất rõ, chủ đề dễ nhận ra.
  loai: cau-truc
  nguon: [mut-847-fug, omt-fugue]
  ket_qua: dung
  ghi_chu: 'Alto ô 1 một mình, soprano ô 3, bass ô 7 (fuga2.ly: sopran R1 R1, bass R1*6).'
- id: n7
  cau: Chơi được một prelude và fugue mà các bè nghe rõ là một mốc của chặng 6 trong lộ trình (link /opus/piano/lo-trinh/).
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: 'src/content/docs/piano/lo-trinh.md, mục Chặng 6, "Sẵn sàng lên chặng tiếp khi…": "- [ ] Một prelude và fugue của Bach, các bè nghe rõ". tac-pham.yml: chang 6 (đã khóa).'
- id: n8
  cau: Suốt 24 ô đầu prelude, hai tay chơi cùng một kiểu hình móc kép.
  loai: cau-truc
  nguon: &id001 [mut-847-pre]
  ket_qua: dung
  ghi_chu: 'bwv847a.ly: ô 1–24 mỗi tay "\repeat unfold 2 { 8 móc kép }"; ô 25 đổi hình.'
- id: n9
  cau: 'Prelude là bài kiểm tra độ đều: một nốt vội hay một nốt to là lộ ngay; là bài luyện ngón có hòa âm để nghe.'
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n10
  cau: 'Prelude nghĩ theo hợp âm, giống BWV 846: mỗi ô một hợp âm, rải bằng một hình nốt lặp lại; fugue nghĩ theo đường nét.'
  loai: cau-truc
  nguon: *id001
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "giống BWV 846 nhưng nhanh và gắt hơn". Chữ mới: "giống BWV 846: mỗi ô một hợp âm, rải bằng một hình nốt lặp lại". "Nhanh và gắt hơn" là đánh giá, không nguồn (như D6-L3 bỏ "nhanh và mạnh hơn nhiều" ở bach-prelude-do n87). Mutopia: mỗi ô 1–24 một hợp âm rải theo một hình. Link /opus/piano/tac-pham/bach-prelude-do/ có (ve-site).'
- id: n11
  cau: Chặn hợp âm, tập theo nhịp chấm dôi, tập từng bè và từng cặp bè dùng được cho mọi tác phẩm phức điệu về sau.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n12
  cau: Sau bài này, các sinfonia, những cặp prelude và fugue khác và các partita sẽ bớt xa lạ.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n13
  cau: 'Bình quân luật (Das Wohltemperierte Klavier) gồm 24 cặp prelude và fugue, mỗi cặp ở một giọng, đi lên từng nửa cung, giọng trưởng trước giọng thứ: Đô trưởng, Đô thứ, Đô♯ trưởng, Đô♯ thứ…'
  loai: cau-truc
  nguon: [imslp-wtc1, henle-hn14]
  ket_qua: dung
  ghi_chu: IMSLP BWV 846–869 (24 cặp); Henle liệt kê Prelude C major BWV 846, c minor BWV 847, C sharp major BWV 848…
- id: n14
  cau: Vì thế BWV 847 là cặp số 2.
  loai: danh-muc
  nguon: [imslp-wtc1]
  ket_qua: dung
- id: n15
  cau: Trang bìa bản chép năm 1722 gọi tập nhạc là Praeludia und Fugen durch alle Tone und Semitonia, tức prelude và fugue qua mọi cung và nửa cung.
  loai: lich-su
  nguon: [henle-hn14-vorwort]
  ket_qua: dung
  ghi_chu: 'Henle (nguyên văn): "Das Wohltemperirte Clavier. oder Praeludia, und Fugen durch alle Tone und Semitonia ... Anno 1722".'
- id: n16
  cau: Tập nhạc viết cho những người trẻ ham học và cho cả những người đã thạo nghề.
  loai: lich-su
  nguon: [henle-hn14-vorwort, henle-blog-wtc]
  ket_qua: dung
  ghi_chu: '"Zum Nutzen und Gebrauch der Lehrbegierigen Musicalischen Jugend, als auch derer in diesem studio schon habil seyenden".'
- id: n17
  cau: Chữ wohltemperiert ("được điều hòa tốt") nói đến cách lên dây cho phép chơi ở mọi giọng.
  loai: dinh-nghia
  nguon: [henle-hn14-vorwort]
  ket_qua: dung
  ghi_chu: 'Henle: "tempered tuning ... allows performers to play in every key".'
- id: n18
  cau: 'Prelude trông như bài tập ngón: một hình nốt lặp lại ô này sang ô khác.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
- id: n19
  cau: Gần cuối prelude, Bach ghi liền ba chỉ dẫn tốc độ Presto, Adagio, Allegro.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'bwv847a.ly (Breitkopf 1866): Presto ô 28, Adagio ô 34, Allegro ô 35.'
- id: n20
  cau: Adagio là một ô tự do đầy nốt trang trí, rồi Allegro lao về hợp âm cuối.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Ô 34: móc ba, móc bốn, dấu láy; ô 35–38 móc kép tới hợp âm Đô trưởng có dấu ngân.'
- id: n21
  cau: 'Fugue ngắn, chủ đề có nhịp điệu riêng: một vòng móc kép quanh nốt Đô rồi những bước nhảy móc đơn.'
  loai: cau-truc
  nguon: *id002
  ket_qua: dung
  ghi_chu: 'Chủ đề: c16 b c8 g as c16 b c8 d | g, c16 b c8 d f,16 g as4 g16 f.'
- id: n22
  cau: Trang Fugue (/opus/hinh-thuc/fugue/) dùng chính bài này để giải thích hình thức.
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: hinh-thuc/fugue.md (đã khóa) phân tích Fugue BWV 847 (hồ sơ n16–n29, n44).
- id: n23
  cau: Bach viết cho đàn phím thời ấy (harpsichord, clavichord), không có bàn đạp vang.
  loai: lich-su
  nguon: [imslp-wtc1]
  ket_qua: null
  ghi_chu: 'chưa chắc: IMSLP ghi nhạc cụ "keyboard"; Mutopia ghi "Harpsichord, Piano". Chưa mở nguồn nói rõ harpsichord và clavichord; lượt 2 kiểm.'
- id: n24
  cau: Trên piano, độ liền và độ ngân phải đến từ ngón tay; bàn đạp, nếu có, chỉ là gia vị.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n25
  cau: Link thời kỳ Baroque (/opus/lich-su/thoi-ky/baroque/).
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: Trang có (đã khóa).
- id: n26
  cau: Mỗi nghệ sĩ xử lý Presto, Adagio, Allegro rất khác nhau.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n27
  cau: Nốt đầu của mỗi hình nửa ô ở tay phải (thường cũng là nốt cao nhất) nối với nhau thành một đường nét chậm.
  loai: cau-truc
