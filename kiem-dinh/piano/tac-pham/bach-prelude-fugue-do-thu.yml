    review: dung
  - id: n8
    cau: Suốt 24 ô đầu prelude, hai tay chơi cùng một kiểu hình móc kép.
    loai: cau-truc
    nguon: &id001 [ mut-847-pre ]
    ket_qua: dung
    ghi_chu: 'bwv847a.ly: ô 1–24 mỗi tay "\repeat unfold 2 { 8 móc kép }"; ô 25 đổi hình.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWV847/bwv847a/bwv847a.ly", "https://www.mutopiaproject.org/ftp/BachJS/BWV847/bwv847a/bwv847a-a4.pdf" ]
    luot_2_ghi_chu: Ô 1–24 mỗi tay một hình 8 móc kép lặp; ô 25 hình nốt đổi.
  - id: n9
    cau: 'Prelude là bài kiểm tra độ đều: một nốt vội hay một nốt to là lộ ngay; là bài luyện ngón có hòa âm để nghe.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n10
    cau: 'Prelude nghĩ theo hợp âm, giống BWV 846: mỗi ô một hợp âm, rải bằng một hình nốt lặp lại; fugue nghĩ theo đường nét.'
    loai: cau-truc
    nguon: *id001
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giống BWV 846 nhưng nhanh và gắt hơn". Chữ mới: "giống BWV 846: mỗi ô một hợp âm, rải bằng một hình nốt lặp lại". "Nhanh và gắt hơn" là đánh giá, không nguồn (như D6-L3 bỏ "nhanh và mạnh hơn nhiều" ở bach-prelude-do n87). Mutopia: mỗi ô 1–24 một hợp âm rải theo một hình. Link /opus/piano/tac-pham/bach-prelude-do/ có (ve-site). Review D6-L5-gom: lượt 1 đã sửa; lượt 2 xác nhận chữ mới; review đọc lại chữ trang, khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWV847/bwv847a/bwv847a.ly", "https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly" ]
    luot_2_ghi_chu: "BWV 847 ô 1–24: mỗi ô một hợp âm rải theo một hình lặp; BWV 846 prelude cũng mỗi ô một hợp âm rải (r8 g16 c' e' g c' e' …). Fugue viết theo bè."
    review: dung
