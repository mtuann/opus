khuong_nhac:
- khoi: 1
  loai: trich-doan
  kiem: [cu-phap, nhip, giong, not-tay-phai, not-tay-trai, so-ngon, doi-chieu-an-ban]
  ket_qua: dung
  ghi_chu: 'Prelude ô 1–4, 4/4, L:1/16, K:Cm. Ấn bản Breitkopf & Härtel 1866 qua Mutopia bwv847a (.ly, .mid tải 05/11/2026). Công cụ: script Python (mido) in nốt MIDI theo ô và hai tay. Kết quả: 4/4 ô khớp cao độ và trường độ cả hai tay (ô 1 tay phải C5 E♭4 D4 E♭4 C4 E♭4 D4 E♭4 ×2, tay trái C3 G3 F3 G3 E♭3 G3 F3 G3 ×2; ô 2 A♭4 F4 E♮4 F4 C4… / C3 A♭3 G3 A♭3 F3…; ô 3 B♮4 F4 E♭4 F4 D4… / C3 A♭3 G3 A♭3 F3…; ô 4 C5 G4 F4 G4 E♭4… / C3 E♭3 D3 E♭3 G3…). Số ngón là gợi ý của trang, chơi được.'
- khoi: 2
  loai: trich-doan
  kiem: [cu-phap, nhip, giong, not-tay-phai, doi-chieu-an-ban, chu-thich]
  ket_qua: dung
  ghi_chu: 'Fugue ô 1–4, cả hai bè ở khuông trên. Ấn bản Edition Peters qua Mutopia fuga2 (.ly, .mid). Đối chiếu từng nốt với MIDI: ô 1–2 alto chủ đề (r8 C5 B4 C5 G4 A♭4 C5 B4 C5 D5 | G4 C5 B4 C5 D5 F4 G4 A♭4 G4 F4); ô 3–4 soprano đáp đề (r8 G5 F♯5 G5 C5 E♭5 G5 F♯5 G5 A5 | D5 G5 F♯5 G5 A5 C5 D5 E♭5 D5 C5) và alto đối đề 1 (E♭4 C5 B4 A4 G4 F4 E♭4 D4 C4 E♭5 D5 C5 | B♭4 A4 B♭4 C5 F♯4 G4 A4 F♯4): khớp. Nhãn "Chủ đề (alto)", "Đáp đề (soprano)", "Đối đề 1 (alto)" đúng.'
- khoi: 3
  loai: trich-doan
  kiem: [cu-phap, nhip, giong, not-tay-phai, not-tay-trai, doi-chieu-an-ban, chu-thich]
  ket_qua: dung
  ghi_chu: 'Fugue ô 7–8. Edition Peters qua Mutopia fuga2. Soprano (F5 nối từ ô 6) E♭5 D5 C5 B♭4 A♭4 G4 F4 A♭5 G5 F5 | E♭5 D5 E♭5 F5 B4 C5 D5 B4; alto C5 (đen) – lặng – F5 E♭5 D5 | r A♭4 G4 F4 G4 F4 E♭4 F4 D4; bass chủ đề r C4 B3 C4 G3 A♭3 C4 B3 C4 D4 | G3 C4 B3 C4 D4 F3 G3 A♭3 G3 F3: khớp MIDI (nốt F5 đầu ô 7 không có khởi âm trong MIDI vì nối từ ô 6). Nhãn đúng.'
- khoi: 4
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, hop-am, tiet-tau, so-ngon]
  ket_qua: dung
  ghi_chu: Sol thứ, L:1/32, mỗi ô 32 phần. Ô 1 hợp âm khối Sol thứ, Rê7 (Fa♯ La Đô + Rê ở tay trái); ô 2 rải theo hình prelude (nốt cao – hai nốt kề – nốt giữa); ô 3 cùng nốt theo nhịp dài – ngắn (3+1); ô 4 hợp âm Sol thứ. Đúng lời dẫn. Ngón 5-3-2-3-1 tay phải, 5-1-2-1-3 tay trái chơi được.
- khoi: 5
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, so-ngon, hai-be]
  ket_qua: dung
  ghi_chu: Đô thứ, 4/4, L:1/8, 4 ô đủ phách. Ô 1–2 bè trên Sol5 rồi Fa5 nốt tròn, bè dưới móc đơn liền; ô 2 ghi "4→5" trên Fa, bè dưới Mi♭ ngón 4; ô 3 bè dưới Đô5 nốt tròn ngón 1, bè trên móc đơn; ô 4 Rê–Mi♭ trên Si♮–Đô (3/2 rồi 4/1). Khớp lời dẫn (đổi ngón trên phím, ngón 2 vắt qua ngón cái). Chơi được.
- khoi: 6
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, phat-am, so-ngon]
  ket_qua: dung
  ghi_chu: Sol thứ, L:1/16, 4 ô đủ 16 phần. Móc kép có dấu luyến (G A B♭ C), móc đơn có chấm (D B♭ G B♭ D); ô 1 tay phải, ô 2 tay trái, ô 3 hai tay, ô 4 hợp âm Sol thứ. Đúng lời dẫn.
doi_chu:
- cu: Khoảng ABRSM Grade 7–8 (ước lượng), chặng 6 của lộ trình. Henle xếp prelude mức 6, fugue mức 5 trên thang 9 (cả hai "trung bình")
  moi: ABRSM xếp bài ở Grade 8 (đề cương 2015–2016), RCM ở Level 9 (đề cương 2022); chặng 6 của lộ trình. Henle xếp prelude mức 6, fugue mức 5 trên thang 9 (cả hai "trung bình")
  ly_do: 'Dòng Độ khó của thong_tin (bản ghi tac-pham/bach-prelude-fugue-do-thu, hồ sơ bản ghi n21; plans/lam-lai/bao-cao/d6-l5/sua-A.yml): bỏ "(ước lượng)", ghi đề cương có thật: ABRSM Grade 8 (2015–2016, lần 1 n4), RCM Level 9 (2022). Grade và chip đã khóa không đổi.'
- cu: Hai cách nghĩ trong một cặp. Prelude nghĩ theo hợp âm, giống BWV 846 nhưng nhanh và gắt hơn; fugue nghĩ theo đường nét. Bạn tập chuyển qua lại giữa hai lối nghe.
  moi: 'Hai cách nghĩ trong một cặp. Prelude nghĩ theo hợp âm, giống BWV 846: mỗi ô một hợp âm, rải bằng một hình nốt lặp lại; fugue nghĩ theo đường nét. Bạn tập chuyển qua lại giữa hai lối nghe.'
  ly_do: 'n10 (da-sua): "nhanh và gắt hơn" là so sánh không nguồn; thay bằng điều kiểm được trên bản nhạc (Mutopia bwv847a: mỗi ô một hợp âm rải bằng hình nốt lặp lại).'
- cu: 'Rồi so sánh vài cách chơi thật khác nhau: Glenn Gould (tách tiếng, nhịp sắc), Sviatoslav Richter, András Schiff, Angela Hewitt, tất cả đều thu âm Bình quân luật; và một bản trên harpsichord, chẳng hạn Gustav Leonhardt. Ghi lại: ai chơi móc kép liền, ai tách; ai dùng nhiều sắc thái; tốc độ fugue chênh nhau bao nhiêu? Nếu chưa nghe cặp đứng trước, nghe thêm Prelude Đô trưởng.'
  moi: 'Rồi so sánh vài cách chơi thật khác nhau: Glenn Gould, Sviatoslav Richter, András Schiff, Angela Hewitt, tất cả đều thu âm Bình quân luật; và một bản trên harpsichord, chẳng hạn Gustav Leonhardt. Ghi lại: ai chơi móc kép liền, ai tách; ai dùng nhiều sắc thái; tốc độ fugue chênh nhau bao nhiêu? Nếu chưa nghe cặp đứng trước, nghe thêm Prelude Đô trưởng.'
  ly_do: 'n30: bỏ lời đánh giá "(tách tiếng, nhịp sắc)" sau tên Gould, không có nguồn.'
- cu:
  - 'David Ledbetter, Bach''s Well-tempered Clavier: The 48 Preludes and Fugues, Yale University Press, 2002.'
  - 'Christoph Wolff, Johann Sebastian Bach: The Learned Musician, W. W. Norton, 2000.'
  moi: 'G. Henle Verlag, HN 14: lời nói đầu của Ernst-Günter Heinemann (1997): trang bìa bản chép năm 1722, cách lên dây bình quân.'
  ly_do: 'n126–n128: bỏ hai sách in chưa đọc (Ledbetter, Wolff); thêm lời nói đầu Henle HN 14 đã mở và link tệp Mutopia đã dùng để đối chiếu.'
