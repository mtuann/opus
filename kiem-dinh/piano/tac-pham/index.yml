  - id: baerenreiter
    bac: 2
    ten: Bärenreiter, Urtext (truy cập 06/11/2026)
    link: https://emag.baerenreiter.com/en/baerenreiter-urtext/
  - id: mutopia-op66
    bac: 1
    ten: 'Mutopia Project, Chopin, Fantaisie-Impromptu Op. 66 (chopin_fantaisie-impromptu.ly): bè tay trái "	imes 4/6" với tupletSpannerDuration 1/2 (liên ba móc đơn) dưới móc kép tay phải (tải 06/11/2026)'
    link: https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/
