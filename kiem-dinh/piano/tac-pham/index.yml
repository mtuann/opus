doi_chu:
  - cu: 'Ba mươi tư tác phẩm, từ Minuet Fa trưởng K. 2 của Mozart đến Ballade số 1 của Chopin, được hướng dẫn tỉ mỉ như trong một buổi học với thầy: nghe gì, bài được xây dựng thế nào, chỗ nào khó và tập ra sao, tuần này làm gì. Trang này là nơi bắt đầu một bài học: mỗi bài học làm gì, dùng thế nào, chọn bài theo mục tiêu. Danh mục đầy đủ xếp theo 7 chặng, gồm cả rất nhiều bài chưa có bài học, nằm ở Tác phẩm theo cấp độ; đó cũng là nơi quyết định một bài thuộc chặng nào.'
    moi: 'Các bài học tác phẩm, từ Minuet Fa trưởng K. 2 của Mozart đến Ballade số 1 của Chopin, được hướng dẫn tỉ mỉ như trong một buổi học với thầy: nghe gì, bài được xây dựng thế nào, chỗ nào khó và tập ra sao, tuần này làm gì. Trang này là nơi bắt đầu một bài học: mỗi bài học làm gì, dùng thế nào, chọn bài theo mục tiêu. Mọi bài học có ở Danh mục bài học bên dưới. Danh mục đầy đủ xếp theo 7 chặng, gồm cả rất nhiều bài chưa có bài học, nằm ở Tác phẩm theo cấp độ; chặng của mỗi bài học ở đó và ở đây là một.'
    ly_do: 'n1, n3 (da-sua): bỏ con số (danh mục tự đếm); câu "nơi quyết định một bài thuộc chặng nào" sai từ khi chặng là trường dữ liệu (D2-0): viết lại; thêm link tới mục Danh mục bài học.'
  - cu: Nghe bản thu gợi ý có sẵn trên trang (cả 34 bài đều có một bản thu giấy phép mở), hoặc dán link YouTube, link file âm thanh, chọn một file trên máy; bấm ghi mốc khi nghe thấy từng đoạn; lần sau nghe lại, dòng đang vang được tô sáng
    moi: Nghe bản thu gợi ý có sẵn trên trang (mỗi bài học gợi ý một bản thu giấy phép mở, phần lớn phát được ngay trên trang), hoặc dán link YouTube, link file âm thanh, chọn một file trên máy; bấm ghi mốc khi nghe thấy từng đoạn; lần sau nghe lại, dòng đang vang được tô sáng
    ly_do: 'n6 (da-sua): bỏ con số; bản thu của Invention số 1 chỉ là link nên "phần lớn phát được ngay trên trang".'
