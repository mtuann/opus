    bac: 2
    ten: 'BAPAM, The Healthy Pianist: "Practise passages quietly and slowly with minimum effort initially, gradually building up to full tempo and dynamic without increasing tension." (truy cập 06/11/2026)'
    link: https://www.bapam.org.uk/the-healthy-pianist/
nhan_dinh:
  - id: n1
    cau: Các bài học tác phẩm đi từ Minuet Fa trưởng K. 2 của Mozart đến Ballade số 1 của Chopin (cả ở description).
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "Ba mươi tư tác phẩm, từ…": bỏ con số (danh mục tự đếm, tác phẩm thêm sau đợt 6 không làm chữ sai). Kiểm src/data/tac-pham.yml: mozart-minuet-k2 chặng 2 (chặng thấp nhất có bài học), chopin-ballade-1 chặng 7, "Sau Grade 8" (cao nhất). Review D6-L11-gom: tac-pham.yml (chang, grade đã khóa): mozart-minuet-k2 chặng 2, Grade 1–2 (mức thấp nhất của các bài học, cùng minuet-sol); chopin-ballade-1 chặng 7, "Sau Grade 8" (cao nhất). Câu nói phạm vi, không nói thứ tự xếp. Trang và mô tả trang khớp. Đúng.'
    review: dung
  - id: n2
    cau: Mỗi bài học hướng dẫn nghe gì, bài được xây dựng thế nào, chỗ nào khó và tập ra sao, tuần này làm gì; trang này nói mỗi bài học làm gì, dùng thế nào, chọn bài theo mục tiêu.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Các mục bắt buộc của bài học (MUC["bai-hoc"] trong tools/them-tac-pham.mjs, tests/tac-pham.test.mjs kiểm mọi bài học): Nghe trước khi tập, Cấu trúc, Chỗ khó và cách tập, Kế hoạch tập. Ba mục của trang này có thật. Review D6-L11-gom: MUC["bai-hoc"] (tools/them-tac-pham.mjs): Nghe trước khi tập, Cấu trúc, Chỗ khó và cách tập, Kế hoạch tập; trang có ba mục Mỗi bài học có gì, Cách dùng một bài học, Chọn bài theo mục tiêu. Đúng.'
    review: dung
  - id: n3
    cau: Mọi bài học có ở mục Danh mục bài học bên dưới; danh mục đầy đủ xếp theo 7 chặng, gồm cả nhiều bài chưa có bài học, ở Tác phẩm theo cấp độ; chặng của mỗi bài học ở đó và ở đây là một.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "đó cũng là nơi quyết định một bài thuộc chặng nào": nay chặng ghi ở dữ liệu (tac-pham.yml, khóa ở D2-0); tests/tac-pham-theo-cap.test.mjs bắt chặng trên trang ấy khớp dữ liệu, và danh mục ở đây dựng từ cùng dữ liệu (tests/danh-muc.test.mjs). Trang tac-pham-theo-cap có 7 mục "## Chặng N" và nhiều dòng không link (bài chưa có bài học). Review D6-L11-gom: Danh mục bài học (#danh-muc-bai-hoc) dựng từ tac-pham.yml; piano/tac-pham-theo-cap có, đã khóa, 7 mục "## Chặng N", nhiều dòng không link; tests/tac-pham-theo-cap.test.mjs bắt chặng trên trang ấy khớp dữ liệu. Đúng.'
    review: dung
  - id: n4
    cau: Thẻ tóm tắt ở đầu bài học có giọng, nhịp, cấp độ; nút "Tôi đang tập bài này" để bài vào kế hoạch hôm nay; bảng thông tin (tác giả, số tác phẩm, hình thức, ấn bản nên dùng) thu gọn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'hopTacPham (src/plugins/thanh-phan.mjs): chip (giọng · nhịp, cấp độ…), <details> "Thông tin tác phẩm và bản nhạc nên dùng" (dòng Nhà soạn nhạc, Tác phẩm, Hình thức, Bản nhạc: DONG_THONG_TIN của tools/them-tac-pham.mjs), hàng nút .oz-piece-actions (tap-bai.js, D6-L1); kế hoạch tập (ke-hoach.js) đọc store.repertoire. Review D6-L11-gom: hopTacPham (src/plugins/thanh-phan.mjs dòng 201: chip giọng · nhịp, tốc độ, cấp độ, hình thức), <details> "Thông tin tác phẩm và bản nhạc nên dùng", hàng nút .oz-piece-actions (tap-bai.js) có "Tôi đang tập bài này"; ke-hoach.js đọc store.repertoire. Đúng.'
    review: dung
  - id: n5
    cau: Mỗi bài học có các mục Vì sao nên học bài này, Bối cảnh, Nghe trước khi tập (link tới hướng dẫn nghe nếu có), Cấu trúc (sơ đồ hình thức và bảng các đoạn), Chỗ khó và cách tập, Kế hoạch tập (theo tuần, kèm tốc độ máy đếm nhịp), Diễn tấu, Lỗi thường gặp, Học tiếp, Kiểm tra nhanh, như bảng "Mỗi bài học có gì".
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'MUC["bai-hoc"] (tools/them-tac-pham.mjs), tests/tac-pham.test.mjs kiểm đủ mục, đúng thứ tự cho mọi bài học trong src/content/docs/piano/tac-pham/; ::hinh-cau-truc đầu mục Cấu trúc; ::hoc-tiep cuối Học tiếp; câu hỏi ```quiz ở Kiểm tra nhanh. Review D6-L11-gom: MUC["bai-hoc"] (tools/them-tac-pham.mjs dòng 33) có đủ các mục câu kể, theo thứ tự, và tests/tac-pham.test.mjs kiểm mọi bài học. Đúng.'
    review: dung
  - id: n6
    cau: Mục Theo dõi khi nghe có bản thu gợi ý (mỗi bài học gợi ý một bản thu giấy phép mở, phần lớn phát được ngay trên trang), hay dán link YouTube, link file âm thanh, chọn file trên máy; bấm ghi mốc; lần sau nghe lại, dòng đang vang được tô sáng.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "(cả 34 bài đều có một bản thu giấy phép mở)": bỏ con số; 34/34 bản ghi bài học có ban_thu với giấy phép phạm vi công cộng, CC0, CC BY, CC BY-SA; 33 phát được (mp3 trên site), bach-invention-1 chỉ có link (nên "phần lớn"). src/scripts/nghe.js: ô dán link YouTube hay file .mp3/.ogg, input type=file, "Ghi mốc", activeRow tô sáng dòng theo mốc. Review D6-L11-gom: tac-pham.yml: 34/34 bản ghi bai-hoc có ban_thu, giấy phép phạm vi công cộng, CC0, CC BY, CC BY-SA; 33 có mp3, bach-invention-1 chỉ có file .ogg trên Commons ("phần lớn"). src/scripts/nghe.js: ô dán link (YouTube, file âm thanh), input type="file", nút Ghi mốc, activeRow tô dòng đang vang. Đúng.'
    review: dung
  - id: n7
    cau: Mục Bài tập chuẩn bị có hai, ba bài tập ngắn soạn riêng trên khuông nhạc, phần lớn cho hai tay và có số ngón, bấm nghe được.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đếm khối ```abc trong mục "## Bài tập chuẩn bị" của 34 bài học: 30 bài có 3, 4 bài có 2. Khuông abc có trình phát (abc.js). Review D6-L11-gom: câu cũ sai một phần. Đếm 98 khối abc trong mục "## Bài tập chuẩn bị" của 34 bài học: 30 bài có 3 khối, 4 bài có 2 (đúng); nhưng 8 khối chỉ một khuông (một tay: bach-invention-1, bach-prelude-bwv939, bach-prelude-do, chopin-nocturne-op9-2, chopin-valse-la-thu, chopin-valse-si-thu, fur-elise, satie-gymnopedie) và 2 khối không ghi số ngón (burgmuller-arabesque khối 2, fur-elise khối 3). Sửa trang: "Hai, ba bài tập ngắn soạn riêng trên khuông nhạc, phần lớn cho hai tay và có số ngón, bấm nghe được" (doi_chu). Câu mới đúng. Chữ câu trước review: "Mục Bài tập chuẩn bị có hai, ba bài tập ngắn soạn riêng, viết trên khuông hai tay có số ngón, bấm nghe được."'
    review: sai
  - id: n8
    cau: 'Cách dùng một bài học, bước 1–4 và 6: nghe hai, ba bản thu trước khi mở bản nhạc; đánh dấu các đoạn bằng bút chì, đoạn lặp lại chỉ học một lần; tập chỗ khó từ tuần đầu; tập bài tập chuẩn bị trước hay song song; khi nốt đã chắc thì đọc phần diễn tấu, thu âm, so với các bản thu đã nghe.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập; không trái piano/cach-tap (đã khóa), trang ấy cũng bắt đầu bằng nghe và tập chỗ khó riêng.
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên học bài hợp lý, không có nguy cơ hại.
  - id: n9
    cau: Các mốc tốc độ trong kế hoạch tuần chỉ là gợi ý; chậm hơn kế hoạch là bình thường, nhanh hơn mà căng tay thì không.
    loai: quy-tac
    nguon: [ bapam ]
    ket_qua: dung
    ghi_chu: 'Vế "căng tay" dính sức khỏe nên không xếp khuyen-tap. BAPAM: tăng dần tới tốc độ đủ "without increasing tension".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mtna.org/Essential_Skills_Part_2.html" ]
    luot_2_ghi_chu: "MTNA: 'Discomfort, fatigue, pain and injury are unnecessary…'; cảnh báo áp lực học quá nhanh, cần thời gian làm chủ từng mức. Câu về căng tay khớp với khuyến nghị này."
  - id: n10
    cau: Quy trình chung để học một bài mới ở trang Cách tập một bản nhạc; ghi tiến độ ở nhật ký luyện tập.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/cach-tap (đã khóa, tiêu đề "Cách tập hiệu quả", bàn quy trình học bài mới), luyen-tap/nhat-ky (đã khóa, công cụ nhật ký). Review D6-L11-gom: piano/cach-tap có, đã khóa (tiêu đề "Cách tập piano hiệu quả"), mục "## Học một bài mới: 12 bước"; luyen-tap/nhat-ky có, đã khóa. Đúng.'
    review: dung
  - id: n11
    cau: Cấp là ước lượng theo thang ABRSM; "chặng" là chặng tương ứng trong lộ trình piano; cách đọc cấp và thang Henle ở mục Cách đọc danh mục của Tác phẩm theo cấp độ.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/tac-pham-theo-cap (đã khóa), mục "## Cách đọc danh mục" (id cach-oc-danh-muc): "Cấp chỉ là ước lượng… Site dùng cấp của ABRSM làm thước đo chung", "Thang Henle 1–9". Danh mục ghi "≈ Grade" (ganDung). Review D6-L11-gom: piano/tac-pham-theo-cap có, đã khóa; mục "## Cách đọc danh mục" (id cach-oc-danh-muc): "Cấp chỉ là ước lượng… Site dùng cấp của ABRSM", "Thang Henle 1–9". Đúng.'
    review: dung
  - id: n12
    cau: Bài nằm giữa hai cấp được xếp vào chặng của kỹ năng chính mà bài dạy.
    loai: ve-site
    ket_qua: da-bo
    ghi_chu: 'Câu nói cách site chọn chặng, nhưng không có chỗ nào của site ghi quy tắc này để đối chiếu, và chặng là trường dữ liệu đã khóa (D2-0) theo đề cương thi và Henle. Bỏ. Review D6-L11-gom: không có chỗ nào của site ghi quy tắc này, chặng là trường dữ liệu theo đề cương thi và Henle; giữ bỏ. Trang không còn câu "Bài nằm giữa hai cấp".'
    review: sai
  - id: n13
    cau: Danh mục dựng từ dữ liệu của site, lọc theo chặng, thời kỳ hay tác giả; mỗi bài ghi kỹ năng chính mà bài dạy.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'danhMucTacPham (src/plugins/thanh-phan.mjs), src/scripts/danh-muc.js; ô lọc chặng, thời kỳ, tác giả (loai="bai-hoc" nên không có ô loại); dòng kỹ năng là ky_nang_chinh. tests/danh-muc.test.mjs, tests/trinh-duyet/kiem-danh-muc.mjs. Review D6-L11-gom: danhMucTacPham với loai="bai-hoc": ô lọc chặng, thời kỳ, tác giả (không có ô loại); dòng kỹ năng là ky_nang_chinh. Đúng ở bản xem. Lưu ý khi khóa trang: thoi_ky, ky_nang_chinh chưa khóa ở bản ghi nào, nên bản thật sẽ không có ô thời kỳ và dòng kỹ năng; khóa trang sau khi khóa các trường ấy (xem báo cáo d6-l11-gom.md).'
    review: dung
  - id: n14
    cau: Mỗi bài dạy nhiều thứ, nhưng có một hai kỹ năng nó dạy tốt nhất; người học biết mình yếu ở đâu thì đi theo các chuỗi bài theo mục tiêu.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý.
  - id: n15
    cau: 'Các chuỗi bài theo mục tiêu đi từ dễ đến khó: Legato và tiếng hát; Ngón đều và nhanh; Phức điệu; Bàn đạp; Rubato; Hình thức sonata; Nghe hòa âm; Chuyền tay và bước nhảy; Nhiều lớp âm thanh.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu chặng trong tac-pham.yml (khóa ở D2-0): ba chuỗi trang cũ đi ngược chặng sau khi dữ liệu xếp lại chặng. Bàn đạp: Valse La thứ (chặng 5) đứng trước Prélude La trưởng, Gymnopédie (chặng 4): đưa Valse La thứ sau Gymnopédie. Rubato: Valse La thứ (5) trước Prélude Mi thứ (4): đổi chỗ. Nhiều lớp âm thanh: Impromptu Sol♭ (7) trước Clair de lune (6): đổi chỗ. Các chuỗi khác không giảm chặng. Mỗi bài trong chuỗi có kỹ năng ấy trong ky_nang_chinh hay trong bài học (chỉ là gợi ý chọn bài). Review D6-L11-gom: đối chiếu chang (đã khóa) của từng bài trong chín chuỗi: không chuỗi nào giảm chặng (Legato 3,4,4,5,5,6,6,7; Ngón đều 2,3,3,4,5,6,7,7; Phức điệu 2,2,4,6; Bàn đạp 4,4,5,5,5,6,7; Rubato 4,5,6,6,7; Sonata 3,3,4,5; Hòa âm 3,4,4,6; Chuyền tay 4,4,6,6,7; Nhiều lớp 3,4,5,5,6,6,7,7). Đúng.'
    review: dung
  - id: n16
