lan:
  - so: 1
    ngay: 2026-11-06
    nhanh: moi/d6-l11
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (chủ lô D6-L11)
      luot_2: Claude Opus 5.5 (lượt 2 nhánh gom D6-L11, 06/11/2026, ba phần)
      review: Claude Opus 5.5 (review D6-L11-gom)
      kiem_mau: null
ghi_chu: 'Trang lối vào nhóm Tác phẩm (tầng khung). Bảng 34 tác phẩm viết tay của trang cũ thay bằng danh mục sinh từ src/data/tac-pham.yml (::danh-muc-tac-pham{loai="bai-hoc"}, D6-L11): chặng, Grade, thời kỳ, kỹ năng chính là trường dữ liệu đã kiểm định ở hồ sơ bản ghi (đợt 2 và các lô D6), không lập nhận định lại ở đây; trang đã khóa chỉ hiện trường đã khóa. Con số "34" bỏ khỏi chữ (danh mục tự đếm). Chữ viết tay còn lại: mô tả cấu trúc bài học (ve-site, đối chiếu MUC của tools/them-tac-pham.mjs và các trang bài học), cách dùng (khuyen-tap; bước 5 có vế sức khỏe nên xếp quy-tac, nguồn BAPAM), chuỗi bài theo mục tiêu (thứ tự đối chiếu chặng trong dữ liệu), nguồn. Không có khối abc. Câu ve-site ở hồ sơ khác trỏ tới trang: tai-lieu-tham-khao t32 (đường dẫn còn), blog/posts/2026-10-21-trong-tam-piano n15 (bài học "chia theo chặng": danh mục xếp và lọc theo chặng). Thuật ngữ trang dùng (legato, rubato, cantabile, fioritura…) đã có hay không cần bản ghi mới.'
nguon:
