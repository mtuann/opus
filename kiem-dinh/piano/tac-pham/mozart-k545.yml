    ghi_chu: '4 ô 4/4. Ô 1 láy rền viết ra: Si–La bảy lần (14 móc kép) rồi nốt kết Sol – La, rơi vào Sol ở ô 2; ô 3 cùng nội dung bằng ký hiệu (!trill! La 12/16, Sol, La). Tay trái Rê – [Fa♯ La Đô] (Rê7) → Sol, như kết ở Sol trưởng của ô 25. Ngón 4-3, 2-3, 1 chơi được.'
doi_chu:
  - cu: Chương 1 khoảng ABRSM Grade 6 (ước lượng); chương 3 khó hơn chương 1 một chút
    moi: "Chương 1: ABRSM xếp ở Grade 6 (đề cương 2027–2028); chương 3 (Rondo) cũng có ở Grade 6 (đề cương 2017–2018) và, theo lời tựa Henle, khó hơn rõ rệt hai chương đầu"
    ly_do: "Dòng Độ khó của thong_tin (hồ sơ bản ghi du-lieu/tac-pham/mozart-k545 n20, plans/lam-lai/bao-cao/d6-l4/sua-A.yml): ABRSM xếp chương 1 ở Grade 6 (đề cương 2027–2028), chương 3 ở Grade 6 (2017–2018), nên bỏ \"(ước lượng)\"; lời tựa Henle HN 164 nói Rondo khó hơn rõ rệt (\"noticeably raises the level of difficulty\"), không phải \"một chút\"."
  - cu:
      - Một hình thức sonata hoàn chỉnh trong bốn, năm phút. Trình bày, phát triển, tái hiện đều ngắn và rõ. Học bài này là cách nhanh nhất để hiểu hình thức sonata bằng chính đôi tay.
      - Đệm Alberti (hợp âm rải theo thứ tự trầm – cao – giữa – cao) là "xương sống" của nhạc Cổ điển. Nếu nó đều và nhẹ ở bài này, bạn sẽ chơi được hàng trăm bài khác.
    moi:
      - Một hình thức sonata hoàn chỉnh trong 73 ô nhịp. Trình bày, phát triển, tái hiện đều ngắn và rõ. Học bài này là cách nhanh nhất để hiểu hình thức sonata bằng chính đôi tay.
      - Đệm Alberti (hợp âm rải theo thứ tự trầm – cao – giữa – cao) là lối đệm rất hay gặp trong nhạc piano thế kỷ 18. Tập cho nó đều và nhẹ ở bài này, bạn sẽ dùng lại được ở nhiều bài khác.
    ly_do: "n4: bản thu dài 2–3,5 phút khi không nhắc lại; thay bằng số ô (Mutopia, IMSLP). n6: hình ảnh và con số không kiểm được; COD Alberti bass."
  - cu: Trong suốt. Không có bàn đạp và hòa âm dày, từng nốt lệch nhịp hay to hơn nốt bên cạnh đều nghe thấy. Đó là trường luyện tai tốt nhất cho sự sạch sẽ.
    moi: Trong suốt. Không có bàn đạp và hòa âm dày, từng nốt lệch nhịp hay to hơn nốt bên cạnh đều nghe thấy. Đó là một bài luyện tai tốt cho sự sạch sẽ.
    ly_do: "n8: bỏ so sánh nhất."
  - cu: "Nếu Alberti và gam móc kép ở ♩ = 100 còn vất vả, hãy học trước Clementi: Sonatina Op. 36 số 1: cùng ngôn ngữ, ngắn hơn, chậm hơn. Một bước đệm khác là Beethoven: Sonata Op. 49 số 2, chương 1: cũng hình thức sonata, ít Alberti hơn."
    moi: "Nếu Alberti và gam móc kép ở ♩ = 100 còn vất vả, hãy học trước Clementi: Sonatina Op. 36 số 1: cùng ngôn ngữ Cổ điển, chương I chỉ 38 ô nhịp. Một bước đệm khác là Beethoven: Sonata Op. 49 số 2, chương 1: cũng hình thức sonata, ở chặng 4."
    ly_do: 'n9, n10: "chậm hơn" trái trang Clementi (cùng ♩ ≈ 120–132); "ít Alberti hơn" chưa kiểm; thay bằng số ô và chặng.'
  - cu: 'Mùa hè 1788 là một trong những giai đoạn sung sức nhất của Mozart: cùng ngày ghi K. 545 vào danh mục, ông ghi cả Giao hưởng số 39, và trong vài tuần sau đó hoàn thành hai giao hưởng cuối cùng (số 40 và số 41). Không ai biết chắc "người mới học" ở đây là ai; Mozart dạy đàn để kiếm sống, và bài này rất có thể dành cho học trò.'
    moi: 'Mùa hè 1788 là một giai đoạn sáng tác rất sung sức của Mozart: cùng ngày ghi K. 545 vào danh mục, ông ghi cả Giao hưởng số 39, và trong vài tuần sau đó hoàn thành hai giao hưởng cuối cùng (số 40 và số 41). Gần như không biết gì về hoàn cảnh ra đời của bài, kể cả "người mới học" ở đây là ai; ngày 2 tháng 8, Mozart gửi cho chị gái "những bài piano mới nhất" của mình, trong đó hẳn có K. 545.'
    ly_do: "n11, n14, n15: theo lời tựa Henle HN 164; bỏ vế dạy đàn kiếm sống (không nguồn)."
  - cu: Đàn của Mozart là fortepiano khung gỗ, âm vực khoảng năm quãng tám (từ Fa1 đến Fa6), tiếng nhẹ, tắt nhanh, búa bọc da. Trên đàn hiện đại, bạn cần "thu nhỏ" tay trái và giữ tiếng sáng, gọn. Xem thêm thời kỳ Cổ điển.
    moi: 'Đàn của Mozart là fortepiano kiểu Vienna, như cây đàn của Anton Walter mà ông sở hữu lúc qua đời: âm vực hơn năm quãng tám một chút (từ Fa1 đến Sol6), bộ giảm âm nhấc bằng cần gạt đầu gối. Trên đàn hiện đại, bạn cần "thu nhỏ" tay trái và giữ tiếng sáng, gọn. Xem thêm thời kỳ Cổ điển.'
    ly_do: 'n20, n21: Tafelmusik ("FF to g’’’", knee levers); bỏ chi tiết không có trong nguồn đã mở.'
  - cu: "So sánh một nghệ sĩ chơi đàn hiện đại (Mitsuko Uchida, Maria João Pires hay András Schiff đều thu trọn bộ sonata Mozart) với một bản thu trên fortepiano: tiếng đàn cũ mỏng và nhanh tắt khiến các chuỗi gam rõ như hạt ngọc. Sau đó đọc hướng dẫn nghe Sonata K. 331 để thấy Mozart viết thế nào khi không nghĩ đến người mới học."
    moi: "So sánh một bản thu trên đàn hiện đại với một bản trên fortepiano: nghe xem các chuỗi gam và tay trái khác nhau thế nào. Sau đó đọc hướng dẫn nghe Sonata K. 331 để nghe một sonata khác của Mozart."
    ly_do: "n24, n25: chưa mở trang bản thu; bỏ đánh giá."
  - cu: "Đoạn chuyển (ô 5–12): chuỗi gam móc kép đi xuống trên hợp âm tay trái; dừng trên hợp âm Rê trưởng"
    moi: "Đoạn chuyển (ô 5–12): chuỗi gam móc kép đi xuống trên hợp âm tay trái; dừng trên hợp âm Sol trưởng"
    ly_do: "n27: Mutopia ô 12 là hợp âm Sol trưởng. n27 (bảng Cấu trúc)."
  - cu: "Phát triển (ô 29–41): chất liệu kết trình bày đi qua Sol thứ, Rê thứ, La thứ; chuỗi gam lên xuống có sf"
    moi: "Phát triển (ô 29–41): chất liệu kết trình bày đi qua Sol thứ, Rê thứ, La thứ; chuỗi gam lên xuống"
    ly_do: "n30: sf là của người biên tập (Henle: nguồn gốc không có ký hiệu sắc thái). n30 (bảng Cấu trúc)."
  - cu: Chuỗi gam móc kép đi xuống, tay trái hợp âm; dừng trên hợp âm Rê trưởng
    moi: Chuỗi gam móc kép đi xuống, tay trái hợp âm; dừng trên hợp âm Sol trưởng
    ly_do: "n27: Mutopia ô 12 là hợp âm Sol trưởng. n27 (bảng Cấu trúc)."
  - cu: Chất liệu kết trình bày ở Sol thứ, Rê thứ, La thứ; chuỗi gam lên xuống có sf
    moi: Chất liệu kết trình bày ở Sol thứ, Rê thứ, La thứ; chuỗi gam lên xuống
    ly_do: "n30: sf là của người biên tập (Henle: nguồn gốc không có ký hiệu sắc thái). n30 (bảng Cấu trúc)."
  - cu: "Chương 2, Andante (Sol trưởng, 3/4): tay trái đệm Alberti gần như suốt chương. Phần đầu là một chủ đề tám ô nhịp rồi biến thể của nó, có nhắc lại; phần thứ hai mở ở giọng át rồi quay về; phần giữa tối lại ở Sol thứ, đi qua Si♭ trưởng và Đô thứ, trước khi chủ đề trở về và một coda ngắn khép lại. Khó nhất là giữ giai điệu hát trên lớp Alberti ở tốc độ chậm, nơi mọi nốt không đều đều lộ ra."
    moi: "Chương 2, Andante (Sol trưởng, 3/4): tay trái đệm Alberti gần như suốt chương. Phần đầu dài mười sáu ô nhịp (một chủ đề tám ô rồi tám ô tiếp nối), có nhắc lại; phần thứ hai mở ở giọng át rồi quay về; phần giữa tối lại ở Sol thứ, đi qua Si♭ trưởng và Đô thứ, trước khi chủ đề trở về và một coda ngắn khép lại. Khó nhất là giữ giai điệu hát trên lớp Alberti ở tốc độ chậm, nơi mọi nốt không đều đều lộ ra."
    ly_do: "n38: ô 9–16 không phải biến thể của chủ đề (Mutopia K545-2)."
  - cu: "Allegro thời Mozart là vui, nhanh vừa, không phải chạy đua. Nghĩ theo hai phách trắng mỗi ô: giai điệu sẽ có hướng đi. Giữ tốc độ ổn định; nhạc Cổ điển gần như không có rubato, chỉ hơi thở rất nhỏ ở cuối phần."
    moi: "Allegro thời Mozart là vui, nhanh vừa, không phải chạy đua. Nghĩ theo hai phách trắng mỗi ô: giai điệu sẽ có hướng đi. Giữ tốc độ ổn định; chỉ cho phép hơi thở rất nhỏ ở cuối phần."
    ly_do: "n61: nhận định chung không nguồn; viết lại thành lời khuyên."
  - cu: Vì không có sắc thái gốc, các ấn bản phổ thông thường in rất nhiều p, f, cresc. mà người đọc tưởng là của Mozart. Dùng một bản Urtext để biết đâu là của tác giả, rồi tự viết sắc thái của mình bằng bút chì.
    moi: Vì không có sắc thái gốc, mọi p, f, sf, cresc. trong một ấn bản (như bản trên IMSLP mà Mutopia chép lại) đều của người biên tập, dù người đọc dễ tưởng là của Mozart. Dùng một bản Urtext để biết đâu là của tác giả, rồi tự viết sắc thái của mình bằng bút chì.
    ly_do: "n68: viết theo điều đã thấy trên bản nhạc."
  - cu: "Cùng phong cách, khó hơn: Mozart Sonata K. 330 hoặc K. 283; nghe trước Sonata K. 331."
    moi: "Cùng tác giả: Mozart Sonata K. 330 hoặc K. 283; nghe trước Sonata K. 331."
    ly_do: "n70: so sánh độ khó chưa có nguồn."
  - cu:
      - 'Gerber, "Musical Insights" (macromusic.org, 1997) và các phân tích Schenker của chương 1: ranh giới phát triển (ô 29–41) và tái hiện ở Fa trưởng (ô 42).'
      - Charles Rosen, The Classical Style, Norton (bản mở rộng 1997).
      - "Bản nhạc: IMSLP. Xem thêm tài liệu tham khảo."
    moi: "Bản nhạc: IMSLP; số ô nhịp và các chi tiết nốt nhạc trên trang này đối chiếu với bản chép LilyPond (nguồn IMSLP) của Mutopia Project. Xem thêm tài liệu tham khảo."
    ly_do: "n80: bỏ nguồn chưa mở; thêm Mutopia."
