ghi_chu: 'Bài học K. 545 (tầng Tác phẩm). Bản nhạc: Mutopia K545-1, K545-2, K545-3 (nguồn IMSLP; .ly, .mid tải 05/11/2026, User-Agent opus-kiem-dinh), đọc .ly và in nốt MIDI theo ô bằng script Python (mido): chương 1 có 73 ô, mọi số ô trên trang khớp. Lịch sử: lời tựa Henle HN 164 (Herttrich 2012), IMSLP (K. 543, 550, 551), Tafelmusik. Sửa trang: n4, n6, n8, n9, n10, n11, n14, n15, n20, n21, n24, n25, n27 (ô 12 là hợp âm Sol trưởng, không phải Rê trưởng, ở hai bảng), n30 (bỏ "có sf" ở hai bảng: sf là của người biên tập), n38, n61, n68, n70, n80. Không có chỗ chưa chắc. Giữ cho hồ sơ khác: mục Cấu trúc (từng ô), Chỗ khó và cách tập, Bài tập chuẩn bị, Kế hoạch tập, Diễn tấu (hinh-thuc/sonata n13, piano/index n7); đệm Alberti trầm – cao – giữa – cao (piano/hop-am-rai n37, piano/hai-tay n34); láy rền ở ô 4, có nốt kết (piano/not-hoa-my n116, n15): đã kiểm trên bản nhạc, đúng. Sức khỏe: n45, n54 (cổ tay cứng, mỏi) xếp quy-tac, nguồn BAPAM. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe (8 mốc cho 10 dòng bảng: hai dòng chương 2, 3 không có mốc). Thuật ngữ: láy rền, acciaccatura, non legato, rubato (có trong thuat-ngu.yml hay trang đã khóa); "Alberti" chưa có bản ghi trong thuat-ngu.yml (cho người giao).'
