    cau: Đàn của Mozart là fortepiano kiểu Vienna; khi qua đời ông có một cây đàn của Anton Walter.
    loai: lich-su
    nguon:
      - tafelmusik
    ket_qua: da-sua
    ghi_chu: 'Tafelmusik: "at the time of his death Mozart owned an early-period Walter". Câu cũ: "fortepiano khung gỗ": đổi theo nguồn (doi_chu).'
    luot_2: dung
    luot_2_nguon: [ "https://mozarteum.at/en/museums/mozarts-birthplace" ]
    luot_2_ghi_chu: "Mozarteum: cây fortepiano không ký tên, quy cho Anton Walter (1752–1826), làm khoảng 1782, Mozart mua trước 1785; sau khi Mozart mất đàn ở lại gia đình, Carl Thomas tặng Mozarteum năm 1856."
  - id: n21
    cau: Âm vực đàn kiểu Walter hơn năm quãng tám một chút, từ Fa1 đến Sol6; bộ giảm âm nhấc bằng cần gạt đầu gối.
    loai: so-lieu
    nguon:
      - tafelmusik
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "âm vực khoảng năm quãng tám (từ Fa1 đến Fa6), tiếng nhẹ, tắt nhanh, búa bọc da". Tafelmusik (đàn theo mẫu Walter): "just over five octaves (from FF to g’’’)", "Knee levers are used to raise the dampers". FF = Fa1, g’’’ = Sol6, như hồ sơ beethoven-op49-2 n25. "tiếng nhẹ, tắt nhanh, búa bọc da" không có trong nguồn đã mở: bỏ (như op49-2). doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://tafelmusik.org/explore-baroque/articles/mozarts-piano-fortepiano/" ]
    luot_2_ghi_chu: "Tafelmusik: đàn theo mẫu Anton Walter (Wolf 1997) \"keyboard range of just over five octaves (from FF to g''')\", \"Knee levers are used to raise the dampers\". FF = Fa1, g''' = Sol6 theo ký hiệu khoa học. (Có tranh luận cần gạt đầu gối trên chính đàn của Mozart có từ thời ông hay thêm sau; câu nói về đàn kiểu Walter nên vẫn đúng.)"
