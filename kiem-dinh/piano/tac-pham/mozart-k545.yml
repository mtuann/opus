    ghi_chu: '4 ô 4/4, L:1/16, đủ 16 phần mỗi ô ở hai tay. Tay trái Alberti trầm – cao – giữa – cao: Đô (C G E G), Sol7 (B G F G), Fa/Đô (C A F A), Sol (B G D G), rồi hợp âm Đô; tay phải nốt trắng, đen hát trên đó (Mi ở ô 3 là nốt lướt trên Fa/Đô). mf tay phải, p tay trái đúng lời dẫn. Ngón 5-1-3-1, 5-1-2-1 chơi được.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - so-ngon
      - hai-tay
    ket_qua: dung
    ghi_chu: 3 ô 4/4. Ô 1 gam Đô trưởng lên xuống (1-2-3, 1-2-3-4-5; 5-4-3-2-1, 3-2-1), ô 2 từ Si (1-2-3, 1-2-3-4-5; 5-4-3-2, 1, 3-2-1), ô 3 kết; tay trái hợp âm Đô, Sol7 mỗi phách đen. Đúng lời dẫn; ngón chuẩn của gam Đô (piano/gam đã khóa).
