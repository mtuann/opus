ghi_chu: 'Bài học Prélude La trưởng Op. 28 số 7 (tầng Tác phẩm). Bản nhạc: ấn bản Peters qua Mutopia 470 (.ly tải ngày 05/11/2026; có dấu bàn đạp, "dolce e semplice"), đối chiếu thêm với kern của Craig Sapp (bản trong ../opus-zero/_imslp/, chỉ đọc): 16 ô và một phách lấy đà, tám câu hai ô. Bản IMSLP (PDF) không mở. Lịch sử: IMSLP (wikitext), Henle HN 882 (trang sản phẩm, Preface), Ấn bản Quốc gia (Performance/Source Commentary), COD và Britannica (mazurka), MusicWeb (Mompou), Naxos và DG (bản thu). Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/chopin-prelude-la-truong. Sửa trang: n13 (so sánh độ khó với Prélude Mi thứ: thay bằng mức Henle và số ô), n18 (bỏ "u buồn", thêm chỉ dẫn tốc độ số 6, số 8), n24 (tên bộ biến tấu Mompou viết theo tiếng Pháp), n55 (quãng mười, không "hơn"), n75 (hai đường rải riêng không nhất thiết rải cùng lúc, như piano/not-hoa-my). Chưa chắc: n77 (học trò kể về rubato, chỉ có sách Eigeldinger), n79 (bản Peters thế kỷ 19, Mutopia số 7 không ghi năm). Khuông: khối 1 trích đoạn khớp Mutopia; khối 2–4 ví dụ soạn, đúng. Thuật ngữ: Andantino, dolce, rubato, Urtext có trong thuat-ngu.yml; mazurka, semplice chưa có (ghi cho D3-L5).'
