  ghi_chu: 'Nhịp lấy đà và ô 1–4, ấn bản Peters qua Mutopia 470 (.ly tải mới); đối chiếu thêm với kern của Craig Sapp (../opus-zero/_imslp/_scripts/align/src/kern_prelude28-07.krn, đọc bằng mắt). Tay phải: e4 | cs''8. d16 <b gs d>4 <b gs d> | <b gs d>2 <d fs>4 | <bs ds>8. <cs e>16 <cs a''>4 <cs a''> | <cs a''>2 = ABC E2 | c3/2 d/ [DGB]2 [DGB]2 | [DGB]4 [df]2 | [^B^d]3/2 [ce]/ [ca]2 [ca]2 | [ca]4 (K:A): khớp. Tay trái: r4 | e,4 <e'' e''> <e e''> | <e e''>2 r4 | a,4 <a'' e''> <a e''> | <a e''>2 = z2 | E,,2 [E,E]2 [E,E]2 | [E,E]4 z2 | A,,2 [A,E]2 [A,E]2 | [A,E]4: khớp (kern 4EE, 4E 4e, 4AA, 4A 4e). Bàn đạp: \sustainOn ô 1 và 3, \sustainOff ở r4 ô 2 = "Ped." và "*" của khối (ô 4 dừng trước dấu nhả). p, Andantino khớp; Q:1/4=66 là gợi ý (bản nhạc không ghi số). Số ngón là gợi ý của trang (bản .ly không có số ngón), chơi được.'
