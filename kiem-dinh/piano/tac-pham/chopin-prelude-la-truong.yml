  ghi_chu: 'Rê trưởng, 3/4, L:1/8: mỗi ô 6. Tay phải hợp âm ba nốt, nốt trên Fa♯ Mi Rê | Đô♯ | Rê Mi Fa♯ | Rê: đúng chú thích bước 1. Hòa âm: Rê – La – Rê | La | Rê – La bảy (Sol Đô♯ Mi trên La) – Rê | Rê; tay trái nốt trầm Rê, La. Ngón 1-3-5, 1-2-4 chơi được. "Ped." mỗi nốt trầm, "*" ở dấu lặng ô 2: đúng bước 3.'
