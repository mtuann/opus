  - 'mut-470'
  ket_qua: 'da-sua'
  ghi_chu: 'Chữ cũ: "Có thể học bài này trước Prélude Mi thứ, bài khó hơn về kiểm soát tiếng đàn." Chữ mới như câu. Lý do: so sánh độ khó cần nguồn: Henle HN 882 xếp cả hai mức 4 ("Prelude A major op. 28,7 4 medium", "Prelude e minor op. 28,4 4 medium"), mức thấp nhất trong 24 bài (số 6 và 20 cũng 4, các bài khác 5–9); dữ liệu (đã khóa) ghi Grade 3–4 và Grade 5, cùng chặng 4. Số ô: Mutopia 470 (16) và 468 (25).'
