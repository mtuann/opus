doi_chu:
- cu: Bộ Op. 28 viết trong khoảng 1835–1839, hoàn tất ở Mallorca mùa đông 1838–1839; in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)
  moi: Bộ Op. 28 hoàn tất ở Mallorca mùa đông 1838–1839 (vài bài có thể có từ đầu thập niên 1830); in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)
  ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-B.yml, nhận định n14 của hồ sơ bản ghi: Không nguồn nào ghi mốc 1835. Ấn bản Quốc gia: "24 Preludes 1831(?)-1839"; Henle HN 882 Preface: "it remains unclear when Chopin began to conceive his Préludes, which may date back to the early 1830s"; IMSLP: "1838-39". Phần còn lại của dòng đúng (n15).'
- cu: Vừa sức sớm. Có thể học bài này trước Prélude Mi thứ, bài khó hơn về kiểm soát tiếng đàn.
  moi: 'Vừa sức sớm. Có thể học bài này trước Prélude Mi thứ: Henle xếp cả hai ở mức 4, mức thấp nhất trong bộ Op. 28, nhưng bài này chỉ có 16 ô nhịp, bài Mi thứ 25 ô.'
  ly_do: 'n13 (da-sua): so sánh độ khó cần nguồn; Henle HN 882 xếp hai bài cùng mức 4.'
- cu:
  - 'Bài số 7 đứng giữa Prélude Si thứ u buồn (số 6) và Prélude Fa♯ thứ dồn dập (số 8), như một khoảng lặng sáng sủa. Nhịp ba với hình chấm dôi ở phách 1 và hai hợp âm lặp ở phách 2–3 gợi điệu mazurka, điệu nhảy dân gian Ba Lan mà Chopin viết gần 60 bản (xem Thể loại). Nhưng đây không phải một điệu nhảy thật: không có nhấn lệch, không có tiếng dậm chân, chỉ là một giai điệu nhẹ nhàng như nhớ lại một điệu nhảy.'
  - Nhà soạn nhạc Catalunya Federico Mompou về sau lấy chính prélude này làm chủ đề cho một bộ biến tấu cho piano, Variaciones sobre un tema de Chopin (Biến tấu trên một chủ đề của Chopin). Xem thêm thời kỳ Lãng mạn.
  moi:
  - 'Bài số 7 đứng giữa Prélude Si thứ rất chậm (Lento assai, số 6) và Prélude Fa♯ thứ dồn dập (Molto agitato, số 8), như một khoảng lặng sáng sủa. Nhịp ba với hình chấm dôi ở phách 1 và hai hợp âm lặp ở phách 2–3 gợi điệu mazurka, điệu nhảy dân gian Ba Lan mà Chopin viết gần 60 bản (xem Thể loại). Nhưng đây không phải một điệu nhảy thật: không có nhấn lệch, không có tiếng dậm chân, chỉ là một giai điệu nhẹ nhàng như nhớ lại một điệu nhảy.'
  - Nhà soạn nhạc Catalunya Federico Mompou về sau lấy chính prélude này làm chủ đề cho một bộ biến tấu cho piano, Variations sur un thème de Chopin (Biến tấu trên một chủ đề của Chopin). Xem thêm thời kỳ Lãng mạn.
  ly_do: 'n24 (da-sua): tên tác phẩm theo đĩa Naxos 8.554570 (MusicWeb); tên tiếng Tây Ban Nha không có nguồn bậc 2.'
- cu: Tay phải trải hơn một quãng mười (La♯4–Đô♯6), cả hợp âm từ Fa♯3; dễ rải chậm như đàn harp, hoặc nốt trên cùng bị chìm
  moi: Tay phải trải một quãng mười (La♯4–Đô♯6), cả hợp âm từ Fa♯3; dễ rải chậm như đàn harp, hoặc nốt trên cùng bị chìm
  ly_do: 'n55 (da-sua): La♯4–Đô♯6 là quãng mười thứ, không hơn (Mutopia 470 ô 12).'
- cu: 'Đây là đỉnh của bài và là hợp âm lớn nhất: Fa♯ bảy, át của Si thứ, trải từ Fa♯3 lên Đô♯6. Theo lệ chung khi chơi Chopin (xem Nốt hoa mỹ), hợp âm rải bắt đầu đúng phách, từ nốt thấp nhất. Rải nhanh vừa phải, như một hơi thở sâu chứ không phải tiếng đàn harp; nốt trên cùng, Đô♯6, là nốt giai điệu và phải hát rõ nhất. Hãy xem bản Urtext của bạn ghi dấu rải thế nào: một đường liền qua hai khuông (rải liền một hơi từ tay trái lên tay phải) hay hai đường riêng (hai tay rải cùng lúc).'
  moi: 'Đây là đỉnh của bài và là hợp âm lớn nhất: Fa♯ bảy, át của Si thứ, trải từ Fa♯3 lên Đô♯6. Theo lệ chung khi chơi Chopin (xem Nốt hoa mỹ), hợp âm rải bắt đầu đúng phách, từ nốt thấp nhất. Rải nhanh vừa phải, như một hơi thở sâu chứ không phải tiếng đàn harp; nốt trên cùng, Đô♯6, là nốt giai điệu và phải hát rõ nhất. Hãy xem bản Urtext của bạn ghi dấu rải thế nào: một đường liền qua hai khuông (rải liền một hơi từ tay trái lên tay phải) hay hai đường riêng cho hai tay (không nhất thiết là hai tay rải cùng lúc).'
  ly_do: 'n75 (da-sua): khớp trang đã khóa piano/not-hoa-my và chú giải Ấn bản Quốc gia.'
