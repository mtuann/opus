  loai: 've-site'
  ket_qua: 'dung'
  ghi_chu: 'src/content/docs/piano/tac-pham/chopin-prelude-mi-thu.md có (cùng lô D6-L3); tac-pham.yml: chặng 4.'
- id: 'n15'
  cau: 'Câu chuyện của cả bộ Op. 28 (đảo Mallorca, George Sand, cây đàn Pleyel, lễ tang của Chopin) có ở trang Prélude Mi thứ.'
  loai: 've-site'
  ket_qua: 'dung'
  ghi_chu: 'Đã kiểm src/content/docs/piano/tac-pham/chopin-prelude-mi-thu.md mục Bối cảnh (sau sửa của lô này): Mallorca, Valldemossa, George Sand, thư gửi Camille Pleyel "trên cây đàn nhỏ của ông", lễ tang 30/10/1849 ở Madeleine.'
- id: 'n16'
  cau: 'Hai mươi bốn prélude đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song song, tiến theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ, Rê trưởng, Si thứ, rồi La trưởng ở số 7.'
  loai: 'cau-truc'
  nguon:
  - 'imslp-op28'
  ket_qua: 'dung'
