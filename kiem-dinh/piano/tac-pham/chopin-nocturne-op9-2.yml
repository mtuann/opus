  ket_qua: dung
  ghi_chu: '2 ô 12/8, L:1/16 (mỗi ô 24 móc kép). Tay phải ô 1: Sol5 (6) + chùm 7 nốt trong 6 (Si♭ La♭ Sol Fa Mi♭ Rê Đô, ngón 4 3 2 1 3 2 1) + Si♭4 (6) + Mi♭5 (6) = 24; ô 2: chùm 9 nốt trong 6 (Fa Mi♭ Rê Đô Si♭ La♭ Sol Fa Mi♭, ngón 5 4 3 2 1 3 2 1 2) + Sol4 + Fa4 + Mi♭4 = 24. Tay trái mỗi phách nốt trầm + hai hợp âm (Mi♭, Si♭7). Chùm 7 rơi trên Si♭7, đáp về Si♭ ở phách 3: đúng lời dẫn "đáp vào nốt đích đúng lúc tay trái sang phách mới". Ngón cái luồn và ngón 3 vắt qua chơi được.'
