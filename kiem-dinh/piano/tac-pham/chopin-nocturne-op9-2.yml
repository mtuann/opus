- cu: Khoảng 1830–1832, khi Chopin mới ngoài 20 tuổi; xuất bản năm 1832. Bộ Op. 9 đề tặng bà Marie Pleyel, một nghệ sĩ piano nổi tiếng ở Paris
  moi: Khoảng 1830–1831, khi Chopin mới ngoài 20 tuổi; in tháng 12 năm 1832 ở Paris (Schlesinger) và Leipzig (Kistner). Bộ Op. 9 đề tặng bà Marie Pleyel, một nghệ sĩ piano nổi tiếng ở Paris
  ly_do: 'Dòng Sáng tác của thong_tin (hồ sơ bản ghi tac-pham/chopin-nocturne-op9-2 n18; sua-B.yml): IMSLP ghi năm sáng tác 1830–31; chú giải Ấn bản Quốc gia Ba Lan ghi bản in đầu Schlesinger, Paris 20 XII 1832 và Kistner, Leipzig XII 1832.'
