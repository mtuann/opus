- cu: 'Karol Mikuli, học trò của Chopin và về sau là người biên tập các tác phẩm của ông, kể rằng khi Chopin co giãn giai điệu, tay đệm vẫn tiếp tục chơi đúng nhịp, và rằng Chopin rất nghiêm khắc về việc giữ nhịp. Hãy coi đó là nguyên tắc tập luyện: tay trái là khung, tay phải là giọng hát, có thể đến sớm một chút, nán lại một chút, nhưng không làm sụp khung. Rubato không có nghĩa là chậm lại ở mọi chỗ đẹp.'
  moi: 'Karol Mikuli, học trò của Chopin và về sau là người biên tập các tác phẩm của ông, kể rằng khi Chopin co giãn giai điệu, tay đệm vẫn tiếp tục chơi đúng nhịp. Học trò của ông còn nhớ lời dặn: "Hãy để tay trái làm nhạc trưởng và luôn giữ nhịp". Hãy coi đó là nguyên tắc tập luyện: tay trái là khung, tay phải là giọng hát, có thể đến sớm một chút, nán lại một chút, nhưng không làm sụp khung. Rubato không có nghĩa là chậm lại ở mọi chỗ đẹp.'
  ly_do: 'n53 (da-sua): Niecks dẫn lời dặn này từ bà Dubois và các học trò khác; câu "rất nghiêm khắc" không thấy dưới tên Mikuli.'
