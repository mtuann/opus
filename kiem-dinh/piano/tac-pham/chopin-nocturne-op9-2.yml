  ghi_chu: 'Khối 3: ô 1 e3-e2 d…, ô 2 kết D (Rê4), ô 3 mở e (Mi♭5).'
- id: n52
  cau: Karol Mikuli, học trò của Chopin và về sau là người biên tập các tác phẩm của ông, kể rằng khi Chopin co giãn giai điệu, tay đệm vẫn tiếp tục chơi đúng nhịp.
  loai: lich-su
  nguon:
  - niecks
  ket_qua: dung
  ghi_chu: 'Niecks: Mikuli "explains his master''s tempo rubato thus: While the singing hand … freed the truth of the musical expression from all rhythmical fetters, the other, the accompanying hand, continued to play strictly in time"; Carl (Karol) Mikuli "author of an edition of Chopin''s works".'
- id: n53
  cau: 'Học trò của Chopin còn nhớ lời dặn: "Hãy để tay trái làm nhạc trưởng và luôn giữ nhịp".'
  loai: lich-su
  nguon:
  - niecks
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "và rằng Chopin rất nghiêm khắc về việc giữ nhịp" (gán cho Mikuli, không thấy trong Niecks dưới tên Mikuli). Niecks: "From Madame Dubois and other pupils of Chopin we learn that he was in the habit of saying to them: ''Que votre main gauche soit votre maître de chapelle et garde toujours la mesure'' (Let your left hand be your conductor and always keep time)."'
- id: n54
  cau: Tay trái là khung, tay phải là giọng hát; rubato không có nghĩa là chậm lại ở mọi chỗ đẹp.
