  cau: 'Cấu trúc: A ô 1–4, A'' ô 5–8, B ô 9–12, A'''' ô 13–16, B'' ô 17–20, A'''''' ô 21–24, coda ô 25–34 (bảng Theo dõi khi nghe và bảng Cấu trúc).'
