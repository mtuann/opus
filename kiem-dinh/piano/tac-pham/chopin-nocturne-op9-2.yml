  ghi_chu: '4 ô 12/8, L:1/8, khóa Fa, K:Eb; mỗi ô 12 móc đơn (ô 4: 3 + nốt chín móc đơn). Hòa âm Mi♭ (Mi♭2 + Sol3 Si♭3 Mi♭4), Si♭7 (Si♭1 + Fa3 La♭3 Rê4), La♭ (La♭1 + La♭3 Đô4 Mi♭4): đúng kiểu nốt trầm – hai hợp âm của bài (Mutopia tay trái). Bước nhảy hơn quãng tám. Ngón 5 ở nốt trầm, "_Ped." ở mỗi nốt trầm đổi hòa âm như lời dẫn. Q:3/8=36 khớp bước 1.'
