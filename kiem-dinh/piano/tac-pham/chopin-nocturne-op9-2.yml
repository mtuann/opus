  cau: 'Cao trào và cadenza ở coda: một hình nốt nhắc đi nhắc lại, dồn dập dần, dễ vỡ tiếng và mỏi tay; tập các nhóm nốt đều và chậm trước, dồn tốc độ từng chút, thả lỏng cổ tay sau mỗi nhóm.'
