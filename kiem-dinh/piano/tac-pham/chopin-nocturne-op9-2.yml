nhan_dinh:
- id: n1
  cau: 'Mô tả và câu mở đầu: bản nocturne nổi tiếng nhất của Chopin là một bài học về nghệ thuật hát trên phím đàn: giai điệu dài như giọng ca opera trên lớp đệm tay trái.'
  loai: lich-su
  nguon:
  - henle-664
  - mut-noct
  ket_qua: dung
  ghi_chu: 'Henle HN 664: "among the most beloved works of this genre, and perhaps even of Chopin’s entire oeuvre. Echoing the operatic style, the sensual bel canto melody…". Lớp đệm tay trái: Mutopia (nốt trầm + hai hợp âm mỗi phách). "Nổi tiếng nhất" hiểu theo Henle ("most beloved works of this genre").'
- id: n2
  cau: 'Trang hướng dẫn cách tập chơi, kèm bản đồ nghe theo từng đoạn; người chỉ muốn nghe đọc phần Bối cảnh và Theo dõi khi nghe (link #boi-canh, #theo-doi-khi-nghe).'
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: 'Trang có "## Bối cảnh" (id boi-canh) và "## Theo dõi khi nghe" (id theo-doi-khi-nghe), cùng các mục tập. Giữ điều mà cap-nhat n51 và chopin-valse-la-thu n25 nói (lối tắt "Chỉ muốn nghe?", mục #theo-doi-khi-nghe).'
- id: n3
  cau: Tiếng piano tắt dần ngay sau khi đánh; muốn giai điệu liền như giọng hát, phải nghe đuôi nốt dài và cho nốt sau vào đúng độ to nốt trước còn lại.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
  ghi_chu: Lời khuyên tập (tiếng piano tắt dần là hiểu biết chung về nhạc cụ; câu chính là cách tập). Link Tạo tiếng đàn (piano/tieng-dan, đã có).
- id: n4
  cau: 'Tay trái kiểu valse trong nhịp 12/8: mỗi phách lớn là một nốt trầm và hai hợp âm.'
  loai: cau-truc
  nguon:
  - mut-noct
  ket_qua: dung
  ghi_chu: 'Mutopia, tay trái ô 1: "ef,-. <g'' ef''> (<bf ef g>)" lặp bốn lần mỗi ô; \time 12/8.'
- id: n5
  cau: 'Bước nhảy nốt trầm – hợp âm lặp lại trong nhiều tác phẩm Lãng mạn: valse, mazurka, nocturne; gặp fioritura lần đầu trong một bài ngắn dễ hơn trong một Ballade.'
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
  ghi_chu: Nhận xét sư phạm chung, không có số liệu; không trái trang lõi (piano/quang-tam-buoc-nhay nói bước nhảy nốt trầm – hợp âm ở valse, nocturne).
- id: n6
  cau: Fioritura là những chùm nốt nhỏ không chia đều theo phách, bắt chước lối luyến láy của ca sĩ.
  loai: dinh-nghia
  nguon:
  - tn
  - grove-fioriture
  - mut-noct
  ket_qua: dung
  ghi_chu: 'thuat-ngu.yml fioritura "Chùm nốt trang trí tự do"; Grove: "ornaments … introduced by singers into airs". Mutopia ô 16, 24: chùm móc ba chromatic không chia đều theo phách tay trái (NE: ô 16 "squeezes the rhythm of the run").'
- id: n7
  cau: 'Bài dạy rubato có kỷ luật: co giãn giai điệu mà không làm sụp nhịp.'
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
  ghi_chu: Mục tiêu tập; nguồn về rubato của Chopin ở n52.
- id: n8
  cau: Bài dài 34 ô nhịp, khoảng bốn đến năm phút.
  loai: so-lieu
  nguon:
  - mut-noct
  - commons-levy
  - imslp-op9
  ket_qua: da-sua
  ghi_chu: 'Mutopia: \partial 8 rồi 34 ô (chú thích %1…%34 ở tay phải). Chữ cũ "khoảng 4 phút"; bản thu Lévy 271,5 giây (4:31), bản thu Lucas-coelho trên IMSLP 4:17 và 6:41. Chữ mới "khoảng bốn đến năm phút".'
- id: n9
  cau: Đủ để học kỹ trong hai tháng và biểu diễn được.
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: Khớp kế hoạch 8 tuần ở mục Kế hoạch tập của chính trang.
- id: n10
  cau: Henle xếp Nocturne Mi thứ Op. 72 số 1 (di cảo) và Nocturne Đô♯ thứ (di cảo, B. 49) ở mức 5.
  loai: cap-do
  nguon:
  - henle-185
  ket_qua: dung
  ghi_chu: 'Henle HN 185: "Nocturne e minor op. post. 72,1 — 5 medium"; "Nocturne (version 1/2) c sharp minor KK IVa,16 — 5 medium" (Lento con gran espressione, B. 49). Op. 9 số 2 ở mức 6.'
- id: n11
  cau: 'Câu cũ: hai nocturne mức 5 "dạy cùng một cách hát nhưng ít trang trí hơn".'
  loai: cau-truc
  nguon: []
  ket_qua: da-bo
  ghi_chu: 'Chưa đối chiếu bản nhạc của Op. 72 số 1 và Nocturne Đô♯ thứ (Mutopia có Op. 72 số 1 nhưng so mật độ trang trí là nhận xét, không đếm được). Bỏ câu. Ghi cho review: chopin-valse-la-thu n67 (Nocturne Op. 9 số 2 "trang trí dày hơn") được review D6-L2-gom kiểm bằng câu này của trang cũ; trang này vẫn có bảng Chỗ khó, Bài tập 2 về chùm nốt hoa mỹ.'
- id: n12
  cau: Trên site, Valse La thứ ở chặng 5 là một bước chuẩn bị tốt (link).
  loai: ve-site
  nguon: []
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Valse Si thứ Op. 69 số 2 cũng là một bước chuẩn bị tốt". tac-pham.yml (đã khóa): chopin-valse-si-thu chặng 6, Grade 7–8, cùng chặng với Nocturne; chopin-valse-la-thu chặng 5. Đổi theo quy tắc mức độ của review D4-gom (dữ liệu đã khóa) và như piano/tac-pham-theo-cap n38 (đường "đi qua trước" của Nocturne: Valse La thứ 5). Trang chopin-valse-la-thu có trong src/content/docs.'
- id: n13
  cau: Nocturne (dạ khúc) không phải do Chopin đặt ra; người khởi xướng thể loại này cho piano là John Field.
  loai: lich-su
  nguon:
  - grove-field
  - henle-185
  - tn
  ket_qua: da-sua
  ghi_chu: 'Grove: "20 pieces to which … the name of Nocturnes is applied"; hình thức nocturne của Chopin "we owe to Field". Henle HN 185: Field "had already composed over 20 nocturnes, which presumably greatly influenced Chopin". Chữ cũ "(khúc nhạc đêm)", đổi thành "(dạ khúc)" theo thuat-ngu.yml (nocturne: Dạ khúc).'
- id: n14
  cau: John Field là nhà soạn nhạc người Ireland, sống 1782–1837.
  loai: nam
  nguon:
  - grove-field
  ket_qua: dung
  ghi_chu: 'Grove: "Born at Dublin July 26, 1782, died Jan. 11, 1837, at Moscow". Năm khớp nha-soan-nhac.yml (field: 1782–1837).'
- id: n15
  cau: 'Câu cũ: bản nocturne đầu tiên của Field in năm 1812.'
  loai: nam
  nguon:
  - imslp-field-h24
  ket_qua: da-bo
  ghi_chu: 'IMSLP, Nocturne in E-flat major, H 24 (Field, "Nocturne No.1"), ghi "Y/D of Comp. 1817 ca."; năm 1812 chỉ thấy ở nguồn phổ thông. Không có nguồn bậc 2 cho 1812: bỏ vế này.'
- id: n16
  cau: 'Khuôn mẫu nocturne của Field: một giai điệu hát ở tay phải trên lớp hợp âm rải rộng của tay trái, nhờ bàn đạp mà ngân vang.'
  loai: dinh-nghia
  nguon:
  - grove-field
  ket_qua: dung
  ghi_chu: 'Grove: "the type of melody and its graceful embellishments, the peculiar waving accompaniments in widespread chords, with their vaguely prolonged sound resting on the pedals".'
- id: n17
  cau: Chopin nhận lấy khuôn mẫu đó rồi phát triển nó xa hơn.
  loai: lich-su
  nguon:
  - niecks
  - henle-185
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "làm nó phong phú hơn hẳn về hòa âm và trang trí" (không có nguồn nói đúng hai mặt ấy). Niecks: "Chopin is more varied and passionate than Field, and has developed to the utmost some of the means of expression used by the latter"; Henle: "The latter continued to develop the light, song-like piano writing".'
- id: n18
  cau: Chopin rất thích nhạc của Bellini, và khi dạy cách chơi láy quanh, nốt dựa, ông khuyên học trò lấy các ca sĩ Ý lớn làm mẫu.
  loai: lich-su
  nguon:
  - niecks
  ket_qua: da-sua
  ghi_chu: 'Niecks: "Bellini''s music had a particular charm for Chopin"; Mikuli (Niecks trích): "For the turn (gruppetto) and the appoggiatura he recommended the great Italian singers as models." Chữ cũ: "Chopin mê lối hát bel canto của các ca sĩ thời ông" (đúng ý, viết lại theo nguồn). Thuật ngữ láy quanh, nốt dựa theo thuat-ngu.yml.'
- id: n19
  cau: Bel canto nghĩa là "hát đẹp"; lối hát ấy chuộng những câu hát dài, liền tiếng, và ca sĩ thường tự thêm những đường luyến láy vào giai điệu.
  loai: dinh-nghia
  nguon:
  - cod-belcanto
  - grove-fioriture
  ket_qua: da-sua
  ghi_chu: 'COD: "bel canto (It.). Beautiful singing … legato phrasing"; Grove Fioriture: "airs were often written plain, and were embroidered by the singers according to their taste and ability". Chữ cũ: "những câu hát dài, nốt cao mềm, và những đoạn luyến láy ngẫu hứng mà ca sĩ thêm vào khi một giai điệu được hát lại": "nốt cao mềm" và "khi hát lại" không có nguồn, bỏ.'
- id: n20
  cau: Mỗi lần chủ đề A trở lại, nó được "hát" với nhiều nốt hoa mỹ hơn.
  loai: cau-truc
  nguon:
  - henle-664
  - mut-noct
  ket_qua: dung
  ghi_chu: 'Henle HN 664: "become more ornamented with each repetition". Mutopia: ô 1 (một láy quanh ô 2) → ô 5 (láy, nhóm móc kép) → ô 13 (nốt hoa mỹ g bf ef, chùm chromatic) → ô 21 (như ô 13, thêm láy rền); ô 16 và 24 có chùm móc ba chromatic.'
- id: n21
  cau: Op. 9 là bộ nocturne đầu tiên Chopin xuất bản.
  loai: lich-su
  nguon:
  - niecks
  - ne-comm
  ket_qua: dung
  ghi_chu: 'Niecks liệt kê các tập nocturne Chopin in: Op. 9 (1833) trước Op. 15, 27, 32…; Op. 72 số 1 (1827/28) do Fontana in sau khi ông mất. NE: bản in đầu Pháp Schlesinger 20/12/1832, Đức Kistner 12/1832.'
- id: n22
  cau: Op. 9 viết trong những năm Chopin rời Warsaw (cuối năm 1830), sống ở Vienna rồi đến Paris (1831).
  loai: nam
  nguon:
  - imslp-op9
  - niecks
  ket_qua: dung
  ghi_chu: 'IMSLP: Composition Year 1830–31. Niecks: "left Warsaw on November 1, 1830 … travelled together to Vienna"; "Paris in 1831".'
- id: n23
  cau: Nhà xuất bản Henle gọi bài số 2 là một trong những nocturne được yêu thích nhất, có lẽ cả trong toàn bộ tác phẩm của Chopin.
  loai: lich-su
  nguon:
  - henle-664
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bài số 2 đến nay vẫn là một trong những bản nhạc piano được biết đến nhiều nhất" (không có nguồn bậc 2 nói đúng vậy). Henle HN 664: "belongs without a doubt among the most beloved works of this genre, and perhaps even of Chopin’s entire oeuvre".'
- id: n24
  cau: Khi chơi và khi dạy bài này, Chopin thêm vào bản in nhiều biến thể trang trí, lớn nhỏ khác nhau; nhiều biến thể ông tự tay ghi vào bản nhạc của học trò.
  loai: lich-su
  nguon:
  - ne-comm
  ket_qua: da-sua
  ghi_chu: 'NE: "while both performing the Nocturne and working on it with pupils, Chopin was introducing more or less significant variants into the printed text of the piece. The following are three examples of sets of variants written into his pupils'' copies." Chữ cũ: "Các học trò kể rằng Chopin thường thay đổi nét trang trí mỗi lần chơi, tùy cảm hứng. Một số biến thể do chính ông viết còn được lưu lại, và phần lớn chúng thuộc về chính bài này." Vế "mỗi lần chơi, tùy cảm hứng" không có nguồn (như review D4-gom đã bỏ ở piano/not-hoa-my n96).'
- id: n25
  cau: Ấn bản Wiener Urtext của Jan Ekier in các biến thể ở chú thích (bài này có nhiều biến thể nhất trong tập), và với riêng Op. 9 số 2 còn in thêm một phiên bản thứ hai chứa trọn các biến thể.
  loai: ten
  nguon:
  - wiener-50065
  ket_qua: da-sua
  ghi_chu: 'Mô tả của Wiener Urtext (UT 50065): "edited by Jan Ekier … authentic variants … given as footnotes to the musical text. Most of them are found in the famous E-flat Major Nocturne (Op 9, No. 2), which appears twice in our edition: In the second version the variants are reproduced in their entirety." Thêm "(bài này có nhiều biến thể nhất trong tập)" thay vế cũ "phần lớn chúng thuộc về chính bài này". Ấn bản Quốc gia Ba Lan (cũng do Ekier) in hai phiên bản có biến thể 2a, 2b (NE).'
- id: n26
  cau: Ba câu hỏi khi nghe (hơi thở, tay trái, trang trí); so sánh chủ đề ở ô 1, ô 5, ô 13 và ô 21.
