  ket_qua: dung
  ghi_chu: Tay phải và tay trái ô 17–20 gần như giống ô 9–12.
- id: n35
  cau: A''' (ô 21–24) là chủ đề lần cuối, trang trí nhiều nhất.
  loai: cau-truc
  nguon:
  - mut-noct
  - henle-664
  ket_qua: dung
  ghi_chu: 'Ô 21 thêm láy rền (\trill) so với ô 13; ô 22 thêm nốt hoa mỹ; ô 24 chùm móc ba chromatic dài hơn ô 16 (a, bf b c cs d … rồi chùm ba). Henle: "more ornamented with each repetition".'
- id: n36
  cau: 'Coda từ ô 25: nhạc dâng lên cao trào lớn nhất của bài; cadenza nhỏ senza tempo, chuỗi nốt nhanh trên cao; kết khép lại ở Mi♭ trưởng.'
  loai: cau-truc
  nguon:
  - mut-noct
  ket_qua: dung
  ghi_chu: 'Mutopia: "Coda" ô 25 (p, pp); ô 30 "con forza", ô 31 "stretto", ô 32 quãng tám ff "senza tempo" (dấu ff duy nhất của bài), rồi cadenza (\cadenzaOn) nốt nhỏ cf bf c a lặp, 8va, cresc., dimin., "rallent. smorz."; ô 33 Tempo I pp, ô 34 ppp, hợp âm Mi♭ có dấu ngân.'
