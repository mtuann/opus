  moi: Ô 1 của bài tập có chùm 7 nốt trong thời gian của một phách lớn (đáng lẽ là 6 nốt móc kép); ô 2 có chùm 9 nốt. Tay trái giữ nhịp tuyệt đối đều, tay phải phải đáp vào nốt đích đúng lúc tay trái sang phách mới.
