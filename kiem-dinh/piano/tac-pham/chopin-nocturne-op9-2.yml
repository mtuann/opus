- id: n32
  cau: Đoạn B (ô 9–12) quanh Si♭ trưởng (giọng át); hòa âm căng hơn, sắc thái rộng hơn.
  loai: cau-truc
  nguon:
  - mut-noct
  ket_qua: dung
  ghi_chu: 'Tay trái ô 9: Si♭ trưởng (bf, f d), ô 12 dừng ở Si♭ (bf d, a ds…, bf f''); át của Mi♭ trưởng là Si♭. Sắc thái B: p, pp (ô 9), f, "Tempo I" (ô 11), sf (ô 13 đầu). Ô 11 có hợp âm giảm Mi (e, df g bf). "Rộng hơn" so với A (p, f ở ô 4, 8): chấp nhận như mô tả nghe.'
- id: n33
  cau: A'' (ô 13–16) có trang trí dày hơn, với những chùm nốt nhỏ thật sự khó đầu tiên.
  loai: cau-truc
  nguon:
  - mut-noct
  - ne-comm
  ket_qua: dung
  ghi_chu: 'Ô 16: chùm móc ba chromatic c32 b bf a af f d cf … (NE: "Bar 16 R.H. … the run"). Trước đó (ô 1–12) chỉ có láy quanh, láy, nhóm móc kép.'
- id: n34
  cau: B' (ô 17–20) là đoạn B trở lại.
