  ghi_chu: 'Khối 2: (7:6:7 ở phách 2 ô 1, (9:6:9 ở phách 1 ô 2, L:1/16, phách lớn 12/8 = 6 móc kép. Chữ cũ "Ô 1 có chùm 7 nốt…" dễ hiểu nhầm là ô 1 của bản nocturne (Mutopia: ô 1, ô 2 của bài không có chùm 7, 9 nốt); thêm "của bài tập".'
- id: n51
  cau: 'Bài tập 3: nốt Mi♭ dài ở đầu ô 1 rồi Rê; nán lại ở bước nhảy lên Mi♭ cao đầu ô 3; ghép với máy đếm nhịp theo ♩.'
