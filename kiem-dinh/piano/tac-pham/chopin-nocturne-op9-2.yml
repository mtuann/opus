  moi:
  - 'Frederick Niecks, Frederick Chopin as a Man and Musician, 1888 (Project Gutenberg): lời kể của Mikuli và các học trò về rubato, Chopin và Field, Chopin và opera Ý.'
  - 'Jan Ekier và Paweł Kamiński, Ấn bản Quốc gia Ba Lan (Wydanie Narodowe), chú giải tập Nocturnes: các biến thể Chopin ghi vào bản nhạc của học trò.'
