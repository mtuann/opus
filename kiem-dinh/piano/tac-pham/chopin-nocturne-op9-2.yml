  ket_qua: dung
  ghi_chu: 'Mutopia: tay phải ô 1, 5, 13, 21 cùng mở bằng chủ đề (g''4. … f g f4. ef4 bf8 và biến thể); ô 9–12 và 17–20 giống nhau (f4. g4 f8 f4. c4. …); chữ "Coda" ở ô 25; 34 ô.'
- id: n31
  cau: 'Chủ đề A: một câu dài trên lớp đệm kiểu valse, đỉnh ở nốt cao.'
