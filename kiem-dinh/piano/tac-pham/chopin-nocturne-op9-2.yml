ghi_chu: 'Bài học Nocturne Op. 9 số 2 (tầng Tác phẩm). Bản nhạc: Mutopia chopin_nocturne_op9_n2 (G. Schirmer 1881; .ly, .mid, PDF tải 05/11/2026, User-Agent opus-kiem-dinh), đọc .ly theo ô (chú thích %1…%34): 34 ô sau nhịp lấy đà; mọi số ô trên trang khớp, trừ "ô áp chót ghi senza tempo" (đã sửa thành ô 32). Trang không có khuông trích đoạn: ba khối abc đều soạn cho trang. Lịch sử: Niecks (Gutenberg), Grove (Wikisource), chú giải Ấn bản Quốc gia Ba Lan, Henle HN 185/664, mô tả Wiener Urtext UT 50065. Sửa: n8, n12, n13, n17, n18, n19, n23, n24, n25, n27, n37, n50, n53, n62, n69; bỏ: n11, n15. Không tính là nhận định: tiêu đề mục, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (hồ sơ bản ghi), mốc ::khoi-nghe (kiểm ở hồ sơ bản ghi và báo cáo), ::cong-cu metronome. Thuật ngữ: nocturne (Dạ khúc), fioritura, rubato, cantabile, láy rền, láy quanh, nốt dựa, cadenza có trong thuat-ngu.yml; "bel canto", "senza tempo", "bàn đạp nối" chưa có bản ghi (cho D3-L5 hay lô sau). Câu ở hồ sơ khác đã kiểm: piano/not-hoa-my n100 (Bài tập 2 về fioritura: còn), n116 (hàng fioritura: còn); piano/quang-tam-buoc-nhay n34 ("một móc đơn để nhảy": còn, n39), n46 (tay trái nocturne); nhan-dien/dau-van-tay n53, lich-su/thoi-ky/lang-man n37, lich-su/nha-soan-nhac s5, piano/the-loai n74, piano/nha-soan-nhac n173 (đúng slug, tiêu đề "Chopin: Nocturne Mi♭ trưởng, Op. 9 số 2"); cap-nhat n51 (lối tắt "Chỉ muốn nghe?": còn); chopin-valse-la-thu n25 (mục #theo-doi-khi-nghe: còn), n60 (rubato: còn), n67 (xem n11); chopin-prelude-la-truong n86, chopin-prelude-mi-thu n71 (link còn đúng).'
