    loai: cau-truc
    nguon: &id001 [ mut-846 ]
    ket_qua: dung
    ghi_chu: '.ly Mutopia: tay trái nốt trầm nốt trắng, bè trên "r16 e''8. ~ e''4" (vào sau một móc kép, ngân hết nửa ô).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly" ]
    luot_2_ghi_chu: "Mutopia wtk1-prelude1.ly (tay phải viết thấp một quãng tám rồi \\transpose c c'): bè trầm TT là nốt trắng (c'2), nốt thứ hai vào sau dấu lặng móc kép (r16 e'8.~e'4), ngân đến hết nửa ô, trong khi TP rải sáu móc kép."
  - id: n6
    cau: Giữ nốt bằng ngón là cách tạo độ vang trên những cây đàn phím thời Bach, vốn chưa có bàn đạp vang.
    loai: lich-su
    nguon: [ henle-hn14-vorwort ]
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"cách tạo độ vang của thời chưa có bàn đạp, và nền của mọi lối đệm hợp âm rải về sau.\" Vế \"nền của mọi lối đệm hợp âm rải về sau\" không kiểm được: bỏ. Henle (Schiff): \"Bach's keyboard instruments all differ from the piano ... they do not have a sustaining pedal.\" Review D6-L3-gom: Hai lượt cùng kết luận, nguồn khớp; đồng ý chữ trang."
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/f4/14/7f/1690886046/0014-1690886046-sync.pdf", "https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly" ]
    luot_2_ghi_chu: "Lời Schiff trong HN 14 (tr. IX): các đàn phím của Bach 'do not have a sustaining pedal'; bản nhạc ghi nốt TT ngân bằng ngón (Mutopia)."
    review: "dung"
