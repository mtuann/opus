khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, hop-am, not-tay-phai, not-tay-trai, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Khung hòa âm 35 ô, 4/4, mỗi ô một hợp âm khối. Ấn bản: Mutopia wtk1-prelude1 (.ly và .mid; nguồn ghi "Unknown"), đối chiếu thêm bản Novello do Harold Brooke biên tập (bản quét, tr. 2–3) và tệp MusicXML của bộ ASAP (bản sao trong ../opus-zero/_imslp/_scripts/align/src/). Công cụ: script Python (mido) in năm nốt nửa ô đầu của từng ô từ MIDI Mutopia; music21 cho MusicXML. Kết quả: 35/35 ô khớp cả hai nốt tay trái và ba nốt tay phải; ô 33–34 khung ghi hợp âm chính (F/C: Đô2 Đô3 Fa3 La3 Đô4 Fa4; G7/C: Đô2 Si2 Sol4 Si4 Rê5 Fa5), khớp các nốt của ô. Ô 34 bè trên tay trái: Mutopia Si2, ASAP Đô3, MIDI CPM (bản sao cũ) Rê3; bản Novello in rõ Si2 (dòng thứ hai khóa Fa), nên khung (Si2) đúng. Tên hợp âm phía trên đúng cả 35 ô: C, Dm7/C, G7/B, C, Am/C, D7/C, G/B, Cmaj7/B, Am7, D7, G, C♯°7/G, Dm/F, B°7/F, C/E, Fmaj7/E, Dm7, G7, C, C7, Fmaj7, F♯°7, B°7/A♭ (Đô4 là nốt treo), G7, C/G, G7sus4, G7, F♯°7/G, C/G, G7sus4, G7, C7, F/C, G7/C, C. Không có ô Schwencke.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 4/4 Sol trưởng, L:1/16, mỗi nửa ô 8 móc kép: tay phải z2 + 6 nốt, tay trái nốt trầm nốt trắng và bè trên z + nốt3-nốt4 (vào sau một móc kép, ngân hết nửa ô), đúng cách ghi Bach (Mutopia). Hòa âm Sol (G B D) – Đô/Sol (G C E) – Rê7 (F♯ A C D) – Sol: I – IV – V7 – I như lời dẫn. Ngón tay phải 1-2-4, 1-2-5, 1-3-5; tay trái 5-3, 5-2: chơi được, hợp chặng 4.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, tiet-tau, so-ngon ]
    ket_qua: dung
    ghi_chu: '5 ô 4/4, đủ 16 móc kép mỗi ô: gốc, dài – ngắn (3+1), ngắn – dài (1+3), nhấn nốt giữa, gốc. Ô 2: nốt dài lần lượt D, B, G, D, nên trọng âm đi qua cả ba ngón như lời giải thích. Ngón 1-2-4 trên D G B chơi được.'
doi_chu:
  - cu: 'Khoảng ABRSM Grade 4–5 (ước lượng): nốt không khó, cái khó là sự đều đặn và tiếng đàn'
    moi: "Trinity xếp bài ở Grade 5 (danh sách từ 2023), Henle mức 1: nốt không khó, cái khó là sự đều đặn và tiếng đàn"
    ly_do: "Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-A.yml, nhận định n23 của hồ sơ bản ghi: Bài có trong đề cương Trinity (Grade 5, lần 1 n4): ghi kỳ đề cương thay \"(ước lượng)\", như D6-L1-gom làm cho minuet-sol-thu, musette-re. Grade đã khóa không đổi. Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang. Review D6-L3-gom: Bỏ \"Khoảng ABRSM Grade 4–5;\" (ước lượng, không đề cương ABRSM nào xếp bài; hồ sơ bản ghi n23)."
  - cu: 'Giữ nốt bằng ngón. Tay trái đánh hai nốt rồi giữ chúng suốt nửa ô trong khi tay phải rải tiếp: cách tạo độ vang của thời chưa có bàn đạp, và nền của mọi lối đệm hợp âm rải về sau.'
    moi: 'Giữ nốt bằng ngón. Tay trái đánh hai nốt rồi giữ chúng suốt nửa ô trong khi tay phải rải tiếp: cách tạo độ vang trên những cây đàn phím thời Bach, vốn chưa có bàn đạp vang.'
    ly_do: 'n6 (da-sua): vế "nền của mọi lối đệm hợp âm rải về sau" không kiểm được; Henle HN 14 (Schiff): đàn phím thời Bach không có bàn đạp vang.'
  - cu:
      - Bản prelude này khởi đầu như một bài dạy con. Trong Clavier-Büchlein viết cho Wilhelm Friedemann, khi đó chừng chín, mười tuổi, có một phiên bản sớm hơn, ngắn hơn. Ở bản chép sạch năm 1722, bài dài 35 ô nhịp như ta biết.
      - 'Kiểu prelude dựng trên một chuỗi hợp âm rải theo khuôn cố định rất gần với lối dạo đầu ngẫu hứng của người chơi đàn phím thời ấy: thử đàn, thử giọng, dọn đường cho tai trước khi vào fugue. Không có giai điệu để dựa vào, chỉ còn hòa âm và cách bạn làm nó sống.'
    moi:
      - Bản prelude này khởi đầu như một bài dạy con. Trong Clavier-Büchlein viết cho Wilhelm Friedemann, khi đó chừng chín, mười tuổi, có một phiên bản sớm hơn (BWV 846a). Ở bản chép sạch năm 1722, bài dài 35 ô nhịp như ta biết.
      - 'Prelude (khúc dạo đầu) là bản nhạc đi trước một bản khác, ở đây là fugue. Bài này dựng trên một chuỗi hợp âm rải theo khuôn cố định: không có giai điệu để dựa vào, chỉ còn hòa âm và cách bạn làm nó sống.'
    ly_do: 'n18 (da-sua): chưa có nguồn đã mở cho "ngắn hơn" (IMSLP không ghi số ô của BWV 846a). n20 (da-sua): không có nguồn đã mở cho "gần với lối dạo đầu ngẫu hứng"; định nghĩa prelude theo Concise Oxford Dictionary of Music.'
  - cu:
      - 'Một giai điệu bên trên. Năm 1853, Charles Gounod viết thêm một giai điệu lên trên prelude này, thành bài Ave Maria nổi tiếng. Nghe bản ấy rồi nghe lại bản gốc: hòa âm của Bach tự nó đã "hát" đến mức nào?'
      - 'Rồi so sánh vài nghệ sĩ đã thu trọn Bình quân luật, chẳng hạn Glenn Gould, Sviatoslav Richter và András Schiff. Gould nổi tiếng với lối chơi Bach rõ và tách tiếng; Schiff chủ trương chơi Bach không dùng bàn đạp vang. Ghi lại: ai chơi nhanh nhất, ai nghe vang nhất, ai để sắc thái thay đổi nhiều nhất? Nghe thêm một bản trên harpsichord để biết âm thanh mà Bach quen thuộc. Không có cách đúng duy nhất; điều quan trọng là bạn biết mình chọn gì và vì sao.'
    moi:
      - 'Một giai điệu bên trên. Năm 1853, Charles Gounod viết thêm một giai điệu lên trên prelude này, về sau thành bài Ave Maria nổi tiếng. Nghe bản ấy rồi nghe lại bản gốc: hòa âm của Bach tự nó đã "hát" đến mức nào?'
      - "Rồi so sánh vài nghệ sĩ đã thu trọn Bình quân luật, chẳng hạn Glenn Gould, Sviatoslav Richter và András Schiff. Schiff viết rằng có thể chơi trọn Bình quân luật mà không chạm tới bàn đạp vang, trừ đoạn cuối fugue La thứ của quyển 1. Ghi lại: ai chơi nhanh nhất, ai nghe vang nhất, ai để sắc thái thay đổi nhiều nhất? Nghe thêm một bản trên harpsichord để biết âm thanh mà Bach quen thuộc. Không có cách đúng duy nhất; điều quan trọng là bạn biết mình chọn gì và vì sao."
    ly_do: "n30 (da-sua): bản 1853 in dưới tên Méditation, lời Ave Maria có ở bản 1859 (IMSLP); viết như câu ở mục Bối cảnh. n32 (da-sua): vế về Gould không có nguồn; câu về Schiff viết đúng điều ông viết trong ghi chú diễn tấu của Henle HN 14. Review D6-L3-gom: n32: thêm ngoại lệ cuối fugue La thứ quyển 1, theo đúng lời Schiff (lượt 2)."
  - cu: Bàn đạp nhẹ, đổi mỗi ô. Nhấn ngay sau nốt trầm, đổi đúng lúc nốt trầm mới vào (bàn đạp nối, xem Bàn đạp). Chỉ nhấn nông, vì ba nốt tay phải được nhắc lại hai lần trong mỗi nửa ô và tiếng vang tích tụ rất nhanh.
    moi: Bàn đạp nhẹ, đổi mỗi ô. Nhấn ngay sau nốt trầm, đổi đúng lúc nốt trầm mới vào (bàn đạp nối, xem Bàn đạp). Chỉ nhấn nông, vì ba nốt tay phải được chơi hai lượt trong mỗi nửa ô và tiếng vang tích tụ rất nhanh.
    ly_do: 'n73: "nhắc lại hai lần" dễ hiểu thành ba lượt; Mutopia: ba nốt tay phải chơi hai lượt mỗi nửa ô.'
  - cu:
      - 'Cùng tập: Prelude và fugue Đô thứ BWV 847, ngay sau bài này trong quyển 1: cũng một hình nốt lặp lại, nhưng nhanh và mạnh hơn nhiều.'
      - 'Hòa âm trượt dần: Chopin: Prélude Mi thứ. 24 prelude Op. 28 của Chopin cũng đi qua đủ 24 giọng, theo gương Bach.'
    moi:
      - 'Cùng tập: Prelude và fugue Đô thứ BWV 847, ngay sau bài này trong quyển 1: cũng dựng trên một hình nốt lặp lại, và là một trong số ít bài của quyển 1 có chỉ dẫn tốc độ của chính Bach.'
      - 'Hòa âm trượt dần: Chopin: Prélude Mi thứ. 24 prelude Op. 28 của Chopin cũng đi qua đủ 24 giọng.'
    ly_do: 'n87 (da-sua): "nhanh và mạnh hơn nhiều" không kiểm được; Mutopia BWV 847 (Presto, Adagio, Allegro) và Henle HN 14. n89 (da-sua): "theo gương Bach" không có nguồn đã mở.'
  - cu:
      - 'David Ledbetter, Bach''s Well-tempered Clavier: The 48 Preludes and Fugues, Yale University Press, 2002.'
      - Hans T. David, Arthur Mendel, Christoph Wolff (biên tập), The New Bach Reader, W. W. Norton, 1998 (bản dịch trang bìa Bình quân luật và nhiều tư liệu thời Bach).
      - 'Christoph Wolff, Johann Sebastian Bach: The Learned Musician, W. W. Norton, 2000.'
      - 'Bản nhạc: IMSLP; khung hòa âm đối chiếu với bản chép LilyPond (phạm vi công cộng) của Mutopia Project. Xem thêm tài liệu tham khảo.'
    moi:
      - 'Bach, Das Wohltemperierte Klavier Teil I, G. Henle Verlag, HN 14 (biên tập Ernst-Günter Heinemann, ngón bấm András Schiff): lời nói đầu và ghi chú diễn tấu (trang bìa năm 1722, cách lên dây, chữ Clavier, bàn đạp, chỉ dẫn tốc độ và sắc thái).'
      - Norbert Müllemann, "On the lookout for the lost measure", blog của G. Henle Verlag, 2012 (ô nhịp Schwencke).
      - Alexander Wheelock Thayer, The Life of Ludwig van Beethoven, tập 1, bản tiếng Anh của Henry Edward Krehbiel, 1921, bản số hóa (bài viết của Neefe năm 1783).
      - 'Bản nhạc: IMSLP; khung hòa âm đối chiếu với bản chép LilyPond (phạm vi công cộng) của Mutopia Project và bản Novello do Harold Brooke biên tập (bản số hóa). Xem thêm tài liệu tham khảo.'
