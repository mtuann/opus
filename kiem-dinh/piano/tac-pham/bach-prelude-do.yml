    luot_2_ghi_chu: "IMSLP: 'Prelude and Fugue in C major, BWV 846', bài đầu của Das wohltemperierte Klavier I."
  - id: n2
    cau: 'Mô tả và câu mở đầu: bản prelude mở đầu Bình quân luật quyển 1 trông như một bài tập hợp âm rải: 35 ô nhịp, mỗi ô một hợp âm, cùng một hình nốt lặp lại gần như từ đầu đến cuối.'
    loai: cau-truc
    nguon: [ mut-846, novello-brooke, imslp-wtc1, henle-blog-schwencke ]
    ket_qua: dung
    ghi_chu: 'MIDI và .ly Mutopia: 35 ô, ô 1–32 cùng một khuôn (nốt trầm, nốt thứ hai, ba nốt tay phải chơi hai lượt mỗi nửa ô), ô 33–34 khác, ô 35 hợp âm. Bản Novello (Brooke) 35 ô. Henle blog: "The autograph of the C-major Prelude consisting of 35 measures".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly", "https://blog.henle.de/en/2012/04/16/on-the-lookout-for-the-lost-measure-bach%e2%80%99s-c-major-prelude-from-the-well-tempered-clavier-i/" ]
    luot_2_ghi_chu: "Mutopia wtk1-prelude1.ly (tay phải viết thấp một quãng tám rồi \\transpose c c'): đếm đủ 35 ô; mỗi ô một hợp âm rải theo cùng một hình (TT hai nốt, TP ba nốt nhắc lại), trừ ô 33–34 đổi hình và ô 35 hợp âm cuối. Blog Henle: bản Urtext 35 ô."
  - id: n3
    cau: Chơi bài cho đều, cho vang và có hướng đi là một bài học lớn về tiếng đàn và hòa âm; trang hướng dẫn cách tập chơi, kèm bản đồ nghe theo từng đoạn.
