ghi_chu: 'Bài học Prelude Đô trưởng BWV 846 (tầng Tác phẩm). Bản nhạc: Mutopia wtk1-prelude1 (.ly, .mid, tải 05/11/2026, User-Agent opus-kiem-dinh), đối chiếu từng ô bằng script Python (mido); kiểm chéo với bản quét Novello (Harold Brooke, Internet Archive) và MusicXML ASAP; bản Czerny (Schirmer 1893) để xem ô Schwencke. Lịch sử: lời nói đầu và ghi chú diễn tấu Henle HN 14 (PDF), blog Henle về ô Schwencke, Thayer (Neefe 1783), IMSLP. Bach-Digital không mở (thử thách chống bot). Sửa trang: n6, n18 (bỏ "ngắn hơn"), n20 (định nghĩa prelude thay câu dạo ngẫu hứng), n30 (Gounod), n32 (bỏ câu về Gould; Schiff), n73 (chữ), n87 (BWV 847), n89 (bỏ "theo gương Bach"), n96–n99 (mục Nguồn: thay ba sách in chưa đọc). Còn mở: n57 ("ngón 4 và 5 yếu hơn" chưa có nguồn). Giữ cho hồ sơ khác: lối tắt "Chỉ muốn nghe?" (cap-nhat n51), mục Theo dõi khi nghe id theo-doi-khi-nghe với bảng các ô 1–4, 5–11, 12, 14, 19–20, 22–24, 24–31, 32, 33–34, 35 (nhac-ly/26-phan-tich n7, bach-prelude-bwv939 n30), âm nền át ô 24–31 và âm nền chủ ô 32–35 (nhac-ly/18-am-ngoai-hop-am n19, luyen-tai/nghe-tien-trinh n34). Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ trang dùng (hợp âm bảy giảm, âm nền, nốt treo, Urtext, fermata) có trong src/data/thuat-ngu.yml hay trang nhạc lý đã khóa (bài 18).'
