khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Giai điệu số 1 ô 1–4, 3/4, K:F, L:1/8. Ấn bản: schott-1929 tr. 1, đọc ở 330 dpi. Ô 1: Đô5 móc đơn chấm dôi (ngón 2), Rê5 móc kép, Đô5 đen chấm dôi, Fa5 móc đơn có chấm; luyến từ Đô5 tới Fa5. Ô 2: La4 (1) chấm dôi, Si♭4 móc kép, La4 đen chấm dôi, Fa5 có chấm. Ô 3: La4 móc đơn (3), Fa♯4 đen (2), Sol4 móc đơn (1), nốt hoa mỹ Si♮4, La4, Sol4 móc đơn; luyến từ La4 đầu ô tới Sol4 cuối. Ô 4: Rê5 móc đơn (3), Si♮4 đen, Đô5 móc đơn, Sol5 đen; luyến cả ô. Khớp. Bỏ phần tay trái (ghi trên trang); "mf" của bản in ở giữa hai khuông, ghi vào giai điệu.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4: tay phải nhịp chấm dôi như ô 1–2 của số 1 (Fa–Sol–Fa–Đô, Sol–La–Sol–Đô, La–Si♭–La–Sol, Fa); tay trái nghỉ móc đơn rồi năm hợp âm La–Đô (Fa trưởng), Sol–Si♭ (Đô bảy), La–Đô, Fa–La–Đô. Ngón tay phải vừa thế tay Fa. Chặng 3.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 6/8, Mi thứ: bè dưới Si4 trắng chấm dôi (ngón 1) ngân cả ô, bè trên móc đơn (ngón 2–5) bắt đầu sau một móc đơn nghỉ: Đô Rê Mi Rê Đô; Rê♯ Mi Sol Mi Rê♯; ô cuối hai nốt Si–Mi. Tay trái Mi–Si, Si–Fa♯, Mi–Si, Mi. Như đoạn A số 7.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '3 ô 3/4, Fa trưởng: nốt hoa mỹ Si♮ trước La (như ô 3 số 1); tay trái quãng Fa–Đô, Mi–Đô, Fa–Đô.'
