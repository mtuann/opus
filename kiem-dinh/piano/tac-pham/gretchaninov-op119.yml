ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 2). Chọn số 1 và số 7 (lộ trình gợi ý 1, 4, 7, "chốt sau khi xem bản nhạc"): số 4 có nốt kép tay phải và hòa âm khó đọc chắc trên bản quét, để dành. Nốt nhạc, cấu trúc, sắc thái chép từ bản quét Schott IMSLP #269926 (tr. 1 số 1, tr. 5 số 7; đọc ở 150–330 dpi). Trích đoạn chỉ có giai điệu số 1 ô 1–4 (phần đệm tay trái có hợp âm chồng nốt sát nhau, không chép); số 7 không có trích đoạn (hai bè ô 1 đọc chưa chắc). Không có tài liệu lịch sử bậc 2 về Op. 119 ngoài IMSLP và bản in, nên Bối cảnh chỉ nói điều đọc được trên bản in và IMSLP. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/gretchaninov-op119.'
