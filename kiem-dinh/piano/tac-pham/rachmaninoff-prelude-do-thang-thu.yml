    loai: ve-site
    ket_qua: dung
    ghi_chu: 'chang: 7 trong bản ghi rachmaninoff-prelude-do-thang-thu
      (src/data/tac-pham.yml).'
  - id: n5
    cau: 'Bài dài 62 ô, tính ô lấy đà đầu bài (hai phách) là ô 1, như bản Mutopia.'
    loai: cau-truc
    nguon: [ gutheil-1893, mutopia ]
    ket_qua: dung
    ghi_chu: 'Mutopia .ly: "Bar RH-001" \partial 2 (ô lấy đà), ô cuối "RH-062"
      (cs1-- \fermata \bar "|."). Đếm trên bản quét: tr. 2 bốn hệ 4+4+3+3 = 14 ô
      (ô 1 là ô lấy đà hai nốt đen, không có dấu lặng); tr. 3 năm hệ 3+3+4+4+4 =
      18 ô (15–32); tr. 4 năm hệ 3+3+3+4+3 = 16 ô (33–48); tr. 5 ba hệ 3+3+8 =
      14 ô (49–62).'
    luot_2: dung
    luot_2_nguon:
      [
        "https://www.mutopiaproject.org/ftp/RachmaninoffS/O3/rach-prelude-op3\
          -no2/rach-prelude-op3-no2.ly",
        "https://imslp.org/wiki/Special:ImagefromIndex/86365"
      ]
    luot_2_ghi_chu: "Mu: Bar 001 là \\partial 2, chú thích ô tới RH-062 (ô cuối có
      fermata). Đếm trên G: ô lấy đà + 61 ô đủ = 62."
  - id: n6
    cau: 'Bài đòi sắc thái từ ppp tới sffff và có một đoạn giữa nhanh (Agitato).'
    loai: cau-truc
    nguon: [ gutheil-1893 ]
    ket_qua: dung
    ghi_chu: 'Bản quét: ppp tr. 2 hệ 1 (ô 3), hệ 3 (ô 9), hệ 4 (ô 13); sffff tr. 4
      hệ 5 (ô 47), tr. 5 hệ 1 (ô 50); Agitato. tr. 3 hệ 1 (ô 15), chùm ba móc
      đơn.'
    luot_2: dung
    luot_2_nguon:
      [
        "https://imslp.org/wiki/Special:ImagefromIndex/86365",
        "https://imslp.org/wiki/Special:ImagefromIndex/79003"
      ]
    luot_2_ghi_chu: 'G: ppp ô 3, sffff ô 47 và 50. Chữ Agitato ở ô 15: trang G bị
      hỏng phần đầu nên không thấy; Bo 1896 trang 4 và BH ghi "Agitato."; Mu
      cũng có.'
  - id: n7
    cau: 'Đoạn chủ đề trở lại viết trên bốn khuông, ghi fff pesante (pesante:
      nặng).'
    loai: cau-truc
    nguon: [ gutheil-1893, thuat-ngu ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 4 hệ 5: "Tempo primo.", bốn khuông, chữ m.d. (hai khuông
      trên) và m.g. (hai khuông dưới), "fff pesante" ở cả hai cặp khuông; bốn
      khuông tới hết ô 55 (tr. 5 hệ 3, ô đầu). Pesante: thuat-ngu.yml "Nặng, một
      cách nặng nề".'
    luot_2: dung
    luot_2_nguon:
      [
        "https://imslp.org/wiki/Special:ImagefromIndex/86365",
        "https://www.dolmetsch.com/defsp1.htm"
      ]
    luot_2_ghi_chu: "G trang 4: Tempo primo, bốn khuông, fff pesante ở cả m.d. và
      m.g. Dolmetsch: pesante = heavy, weighty."
  - id: n8
    cau: 'Tiếng to phải đến từ sức nặng cánh tay, không từ vai cứng; thả sức nặng
      cánh tay vào phím, cổ tay mềm, nhả ngay sau khi đánh.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp trang piano/nha-soan-nhac (mục Rachmaninoff: "Cần trọng lượng
      cánh tay để tiếng to mà không gắt") và cách tập hợp âm có dấu nhấn ở bài
      học clara-schumann-scherzo-2.'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp cách dạy phổ biến (dùng sức nặng cánh tay, cổ tay
      mềm, nhả căng), không có hại.
  - id: n9
    cau: 'Ở ô 3–4, bè trầm của hai tay nhắc lại ba nốt mở đầu (Đô♯, La, Sol♯), dưới
      những hợp âm móc đơn ppp ở giữa.'
    loai: cau-truc
    nguon: [ gutheil-1893, mutopia ]
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 1. Tay phải bè dưới: Đô♯3 trắng (nối từ ô 2),
      La3, Sol♯3 đen có chấm; tay trái bè dưới: Đô♯1–Đô♯2 trắng, La1–La2,
      Sol♯1–Sol♯2 đen có chấm; hợp âm móc đơn ở giữa có gạch tenuto.'
    luot_2: dung
    luot_2_nguon:
      [
        "https://imslp.org/wiki/Special:ImagefromIndex/86365",
        "https://www.mutopiaproject.org/ftp/RachmaninoffS/O3/rach-prelude-op3\
          -no2/rach-prelude-op3-no2.ly"
      ]
    luot_2_ghi_chu: "G ô 3–4: bè dưới tay phải Đô♯ (trắng) – La – Sol♯ (đen), tay
      trái quãng tám cùng nốt; ở giữa hợp âm móc đơn ppp. Mu RH-003v1/LH-003v1
