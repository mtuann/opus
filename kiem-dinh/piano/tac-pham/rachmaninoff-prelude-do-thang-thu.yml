      published in 1892 as part of the piano cycle Morceaux de Fantaisie op. 3,
      the work also soon became well known abroad, in particular due to the
      concert tours given by the pianist Alexander Siloti, Rachmaninoff''s
      cousin. And even Rachmaninoff himself was soon no longer able to perform
      any concerts in America, without someone in the audience crying out C
      sharp minor! at the end"; Difficulty: Prélude c sharp minor op. 3,2: 5
