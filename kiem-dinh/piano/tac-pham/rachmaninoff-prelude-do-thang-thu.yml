  - id: n37
    cau: 'Mục Nguồn: Op. 3 số 2 không có trong đề cương ABRSM 2021–2022, 2023–2024, 2025–2026; pianosyllabus ghi RCM 10, AMEB Certificate of Performance, ANZCA A.Dip.A.; Henle HN 1211 có ghi mức độ khó.'
    loai: cap-do
    nguon: [ abrsm, pianosyllabus, henle-1211 ]
    ket_qua: dung
    ghi_chu: "ABRSM: ba PDF, tìm \"Rachmanin\": chỉ Moment musical Op. 16 số 5 (Grade 8). Lộ trình và khảo sát ghi \"ABRSM có Op. 3 số 1, 3, 4 ở Grade 8\": không thấy trong ba kỳ 2021–2026 (có thể ở các kỳ 2011–2020, không đọc lại); trang không nói điều này. Review (Claude, 17/11/2026): hai lượt khớp nhau (ba PDF ABRSM, pianosyllabus, Henle); không đọc lại PDF ABRSM."
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2023-09/piano-2021-2022-syllabus-rev-sep-2020-final.pdf", "https://www.abrsm.org/sites/default/files/2023-10/Piano%202023%20%26%202024%20Prac%20syllabus%2020230807.pdf", "https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20%26%202026%20Prac%20syllabus%2020240524_access.pdf", "https://pianosyllabus.com/x-detail.php?ref=3082417", "https://www.henle.de/Prelude-c-sharp-minor-op.-3-no.-2/HN-1211" ]
    luot_2_ghi_chu: "Ba đề cương ABRSM (đọc chữ PDF): Rachmaninoff chỉ có Moment musical Op. 16 số 5 (Grade 8), không có Op. 3 số 2. pianosyllabus: RCM 10, AMEB Cert. Perf., ANZCA A.Dip.A. Henle ghi mức khó 5 (medium)."
    review: dung
khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: "Ô 1–4, M:4/4 (bản in ghi C), K:C#m (bốn dấu thăng), L:1/8, Q:1/4=40 chỉ để phát. Ấn bản: gutheil-1893 tr. 2 hệ 1 (đọc ở 400 dpi; đo dòng kẻ phụ cho nốt Đô♯3 ô 2), đối chiếu từng nốt với MIDI Mutopia (mido) và .ly. Ô 1 (lấy đà, hai phách): tay phải La3, Sol♯3 đen có dấu >, ff; tay trái quãng tám La1–La2, Sol♯1–Sol♯2 có >. Ô 2: tay phải Đô♯3 nốt tròn có >, nối sang ô 3; tay trái quãng tám Đô♯1–Đô♯2 nốt tròn có >, nối. Ô 3: tay phải bè dưới Đô♯3 trắng (nối), La3, Sol♯3 đen có chấm; bè trên lặng móc đơn, ppp, Đô♯4–Sol♯4–Đô♯5, Mi4–Si4–Mi5, Rê♯4–La♯4–Rê♯5 (ba hợp âm nối vạch), lặng móc đơn, Rê♮4–La♮4–Rê♮5, lặng móc đơn, Si♯3–Fa♯4–Si♯4; mọi hợp âm có gạch tenuto. Tay trái bè dưới Đô♯1–Đô♯2 trắng (nối từ ô 2), La1–La2, Sol♯1–Sol♯2 đen có chấm; bè trên lặng móc đơn, Mi3–Sol♯3–Mi4, Sol♯3–Si3–Sol♯4, Fa𝄪3–La♯3–Fa𝄪4, lặng, Fa♯3–Si♯3–Fa♯4, lặng, Rê♯3–Fa♯3–Rê♯4; có tenuto. Ô 4: như ô 3, bè dưới không nối từ ô trước. Khác cách ghi (không đổi nốt): dấu bình nhắc của bản in trước La3 (tay phải) và La1–La2 (tay trái) không ghi trong abc (đã là La bình theo hóa biểu); abc ghi thêm dấu thăng nhắc ở Fa♯3, Fa♯4 tay trái sau Fa𝄪; chữ ppp bản in đặt giữa hai khuông, abc đặt ở hợp âm đầu; chữ \"Lento.\" ở lời dẫn. Hai giọng trong một khuông viết bằng & (bè dưới là giọng chính để giữ dấu nối từ ô 2). Review (Claude, 17/11/2026): đọc lại từng nốt trên bản quét Gutheil #86365 tr. 2 hệ 1 ở 300 và 500 dpi (đo dòng kẻ khuông và dòng kẻ phụ): ô 1–2 ff, dấu nhấn, La3–Sol♯3–Đô♯3 nối; ô 3–4 bè dưới Đô♯–La (dấu bình nhắc)–Sol♯ có chấm; hợp âm tay phải Đô♯4–Sol♯4–Đô♯5, Mi4–Si4–Mi5, Rê♯4–La♯4–Rê♯5, Rê♮4–La♮4–Rê♮5, Si♯3–Fa♯4–Si♯4; tay trái Mi3–Sol♯3–Mi4, Sol♯3–Si3–Sol♯4, Fa𝄪3–La♯3–Fa𝄪4, Fa♯3–Si♯3–Fa♯4 (bản in ghi ♮♯ trước hai nốt Fa sau Fa𝄪), Rê♯3–Fa♯3–Rê♯4; lặng móc đơn, tenuto, ppp: khớp hoàn toàn, không sửa nốt. Đổi tiêu đề T: \"(bản Gutheil 1893)\" thành \"(bản Gutheil)\" vì bản in không ghi năm."
  - khoi: 2
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: "Ô 15–16, M:4/4, K:C#m, Q:1/4=120 chỉ để phát (bản in chỉ ghi \"Agitato.\"). Ấn bản: gutheil-1893 tr. 3 hệ 1 (400 dpi), đối chiếu MIDI Mutopia. Ô 15: tay phải giai điệu nốt đen có gạch tenuto Mi4 – Rê♯4 (dấu thăng nhắc) – Rê♮4 – Đô♯4, vòng luyến cả ô, mf; chùm ba móc đơn (Mi4 Sol♯3 Đô♯4), (Rê♯4 Fa𝄪3 Đô♯4), (Rê♮4 Fa♯3 Si♯3; bản in ghi ♮♯ trước Fa để bỏ thăng kép), (Đô♯4 Mi3 Sol♯3); nốt đầu chùm chung đầu nốt với giai điệu (abc viết hai lần, giọng chồng &). Tay trái bè dưới quãng tám Đô♯1–Đô♯2 nốt tròn; bè trên lặng đen, La♯2, La♮2, Sol♯2 đen có tenuto, vòng luyến. Ô 16: tay phải như ô 15; tay trái bè dưới Đô♯2 nốt tròn (một nốt); bè trên Si2 – La♯2 – La♮2 – Sol♯2 có tenuto, vòng luyến. Khác cách ghi: vòng cong có số 3 dưới mỗi chùm ba (Mutopia ghi là luyến từng chùm) abc chỉ ghi liên ba; Mutopia ghi \"simile\" và bỏ số 3 ở ô 16, bản Gutheil vẫn in số 3; chữ \"Agitato.\" ở lời dẫn. Review (Claude, 17/11/2026): đầu tr. 3 của bản quét Gutheil #86365 mất khuông trên (IMSLP: \"Pages 2-3 of No.2: Prélude damaged\"). Đọc được trên #86365 (300 dpi): mf; tay trái lặng đen, La♯2, La♮2, Sol♯2 tenuto và luyến trên Đô♯1–Đô♯2 nốt tròn; ô 16 Si2, La♯2, La♮2, Sol♯2 trên Đô♯2 một nốt; nốt dưới các chùm ba Sol♯3 · Fa𝄪3 · (♮♯)Fa♯3 Si♯3 · Mi3 Sol♯3, số 3 dưới mỗi chùm cả ở ô 16. Không đọc được (khuông trên mất): giai điệu Mi4–Rê♯4–Rê♮4–Đô♯4 và nốt Đô♯4 cuối mỗi chùm, vòng luyến tay phải, chữ \"Agitato.\": đối chiếu Bosworth 1896 (#79003, tr. 4 hệ 1, 400 dpi) và Mutopia: Agitato., giai điệu nốt đen có tenuto, chùm ba (Mi4 Sol♯3 Đô♯4) (Rê♯4 Fa𝄪3 Đô♯4) (Rê♮4 Fa♯3 Si♯3) (Đô♯4 Mi3 Sol♯3), mf: khớp abc. Bosworth thêm số ngón (biên tập Preston), abc không ghi. Đổi tiêu đề T: thành \"(bản Gutheil)\"."
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, so-ngon ]
    ket_qua: dung
    ghi_chu: "6 ô 4/4: quãng tám La – Sol♯ – Đô♯ mỗi tay (tay phải La3–La4, Sol♯3–Sol♯4, Đô♯3–Đô♯4, ngón 1-5; tay trái La1–La2, Sol♯1–Sol♯2, Đô♯1–Đô♯2, ngón 5-1), ba ô f có dấu nhấn, ba ô p. Mỗi ô 8 móc đơn. Review (Claude, 17/11/2026): 6 ô, mỗi ô 8 móc đơn ở cả hai tay; quãng tám La – Sol♯ – Đô♯ đúng ba nốt mở đầu (tay phải một quãng tám trên bản gốc, tay trái như bản gốc); ngón 1-5 tay phải, 5-1 tay trái; f có dấu nhấn ba ô đầu, p ba ô sau, như lời kèm: đúng."
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: "2 ô 4/4: tay trái quãng tám Đô♯1–Đô♯2 trắng, La1–La2, Sol♯1–Sol♯2 đen (mp, ngón 5-1), rồi Đô♯ tròn; tay phải hợp âm móc đơn pp sau phách: Đô♯4–Sol♯4–Đô♯5 (1-3-5), trên La: Mi4–La4–Mi5 (1-2-5), trên Sol♯: Si♯3–Rê♯4–Sol♯4 (Sol♯ trưởng, 1-2-5); ô 2 Đô♯ thứ. Như kết cấu ô 3 nhưng bè trầm chỉ ở tay trái. Review (Claude, 17/11/2026): ô 1 tay phải lặng, ba hợp âm, lặng, hợp âm, lặng, hợp âm = 8 móc đơn, như nhịp ô 3 của bài; ô 2 = 8; tay trái 4+2+2 và 8. Hòa âm: Đô♯ thứ trên Đô♯; Mi–La–Mi trên La (quãng năm trống, không có Đô♯: không sai, chỉ đơn giản hơn bài gốc); Si♯–Rê♯–Sol♯ (Sol♯ trưởng, V) trên Sol♯; kết Đô♯ thứ. Ngón 1-3-5, 1-2-5 hợp tầm tay; lời kèm (tay trái mp, tay phải pp ngay sau phách, tập tay trái trước) đúng."
  - khoi: 5
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: "2 ô 4/4, chùm ba móc đơn: tay phải hợp âm ở vị trí 1 và 3 của chùm thứ nhất, vị trí 2 của chùm thứ hai; tay trái ngược lại (như ô 36–43 của bài: phải, trái, phải | trái, phải, trái). Hợp âm: Đô♯ thứ (tay phải Mi4–Sol♯4–Đô♯5 ngón 1-2-5, tay trái Đô♯3–Mi3–Sol♯3 ngón 5-3-1), La trưởng (Mi–La–Đô♯ / Đô♯–Mi–La), Sol♯ thứ (Rê♯–Sol♯–Si / Si2–Rê♯3–Sol♯3), Đô♯ thứ nốt trắng. Mỗi ô đủ 8 móc đơn. Review (Claude, 17/11/2026): mỗi ô 4 phách (chùm ba móc đơn, ô 2 hai chùm và nốt trắng); tay phải vị trí 1, 3 | 2, tay trái 2 | 1, 3: phải, trái, phải; trái, phải, trái, đúng như bản quét Gutheil #86365 tr. 4 hệ 2 ô 36 (nửa sau, fff). Hòa âm Đô♯ thứ – La trưởng – Sol♯ thứ – Đô♯ thứ, hai tay cùng hợp âm; ngón 1-2-5 / 5-3-1 (5-3-1 cho Đô♯3–Mi3–La3) hợp lý; lời kèm đúng."
