nhan_dinh:
  - id: n1
    cau: 'Bài mở đầu bằng ba nốt rất to (ff), La – Sol♯ – Đô♯, mỗi nốt ở ba quãng
      tám (tay phải La3, Sol♯3, Đô♯3; tay trái một quãng tám ở dưới); nốt Đô♯
      ngân sang ô 3.'
    loai: cau-truc
    nguon: [ gutheil-1893, mutopia ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 2 hệ 1 (400 dpi): ô 1 hai nốt đen có dấu > (ff), tay phải
      La3 (dòng kẻ phụ thứ hai dưới khóa Sol), Sol♯3; tay trái quãng tám
      La1–La2, Sol♯1–Sol♯2; ô 2 nốt tròn Đô♯3 (đo: dòng kẻ phụ thứ tư ở y = 1161
      px, đầu nốt ở 1175 px, nửa khoảng dưới dòng Rê3) và quãng tám Đô♯1–Đô♯2,
      có dấu nối sang ô 3. MIDI Mutopia ô 1–2: A3, G#3, C#3 (6 phách); A1+A2,
      G#1+G#2, C#1+C#2.'
    luot_2: dung
    luot_2_nguon:
      [
        "https://imslp.org/wiki/Special:ImagefromIndex/86365",
        "https://www.mutopiaproject.org/ftp/RachmaninoffS/O3/rach-prelude-op3\
          -no2/rach-prelude-op3-no2.ly"
      ]
    luot_2_ghi_chu: "G trang 2, ô 1–2: ff, dấu nhấn, tay phải La3–Sol♯3–Đô♯3 (nốt
      đơn), tay trái quãng tám La1–La2, Sol♯1–Sol♯2, Đô♯1–Đô♯2; Đô♯ nốt tròn nối
      sang nốt trắng ô 3. Mu: a4-> gs-> | cs,1->~ (tay phải), <a,, a'> (tay
      trái). BH, Bo giống."
  - id: n2
    cau: 'Nhà xuất bản Henle gọi đây có lẽ là bài piano nổi tiếng nhất của cuối thời
      Lãng mạn.'
    loai: lich-su
    nguon: [ henle-1211 ]
    ket_qua: dung
    ghi_chu: 'Henle: "Possibly the most famous late Romantic piano work".'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/Prelude-c-sharp-minor-op.-3-no.-2/HN-1211" ]
    luot_2_ghi_chu: 'Henle HN 1211: "Possibly the most famous late Romantic piano work".'
