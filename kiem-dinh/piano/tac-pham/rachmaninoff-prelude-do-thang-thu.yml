  - id: n34
    cau: 'Bảng Chỗ khó và cách tập; ba bài tập chuẩn bị (quãng tám rơi bằng sức nặng cánh tay; hợp âm giữa nhẹ, bè trầm hát; hợp âm luân phiên hai tay); kế hoạch 8 tuần; mục Tốc độ (phần lời khuyên), Sắc thái, Bàn đạp; Lỗi thường gặp.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Lời khuyên tập, không dính sức khỏe; hợp với trang piano/ban-dap (đổi bàn đạp theo hòa âm), piano/tieng-dan (cân bằng để giai điệu hát), piano/nha-soan-nhac (trọng lượng cánh tay). Tốc độ máy đếm nhịp trong kế hoạch là gợi ý; trang ghi rõ bản in không có số. Review (Claude, 17/11/2026): ba bài tập: xem khuong_nhac khối 3–5 (nhịp, hòa âm, số ngón, lời kèm đúng). Bảng Chỗ khó: dòng \"Đọc bốn khuông (ô 46–55)\" sửa thành \"(từ ô 46 tới hết bài)\", và Lỗi thường gặp \"(ô 46–55)\" thành \"(từ ô 46)\", vì #86365 tr. 5 hệ 3 giữ bốn khuông tới ô 62; phần cách tập ghi rõ kết cấu móc đơn/hợp âm trầm là của ô 46–55. Kế hoạch tuần 5–6 (ô 46–55, 46–62) giữ nguyên. Lời khuyên tập còn lại hợp lý."
    luot_2: dung
    luot_2_ghi_chu: "Bảng chỗ khó, ba bài tập, kế hoạch 8 tuần, lời khuyên tốc độ, sắc thái, bàn đạp, lỗi thường gặp: hợp lý, không trái trang lõi, không có hại. Bài tập 1–3 (ABC) khớp mô tả: quãng tám ngón 1–5; bè trầm mp dưới hợp âm pp; hợp âm luân phiên phải–trái theo chùm ba."
