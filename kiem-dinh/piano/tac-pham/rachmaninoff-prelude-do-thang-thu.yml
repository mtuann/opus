lan:
  - so: 1
    ngay: 2026-11-17
    nhanh: them/rachmaninoff-prelude-do-thang-thu
    ma_bam: sha256:f289ef92588a2ce2eb6e352a2d7c9703af16bce93866ab17fe59d474dd0aed69
    nguoi:
      luot_1: Claude Opus 5.5 (lượt 1, them/rachmaninoff-prelude-do-thang-thu, 17/11/2026)
      luot_2: "Claude Opus 5.5 (agent riêng, độc lập với lượt 1, 17/11/2026; 49 câu, 49 đúng; đối chiếu bản Gutheil 1893 IMSLP #86365 và Bosworth 1896 #79003)"
      review: "Claude (agent riêng, không làm lượt 1, lượt 2; 17/11/2026)"
      kiem_mau: "Claude Sonnet (agent riêng), kiểm thay chủ repo theo lời giao 16/11/2026: 5 nhận định mẫu (khoa.mjs xuat --mau 5: trang n3, n6, n8, n9, n31), 5 đúng, 0 sai"
ghi_chu: "Bài học mới (lộ trình thêm tác phẩm, lượt 8). Nốt nhạc, chữ chỉ dẫn đọc từ bản quét IMSLP #868299 (4 trang, in số trang 2–5; đọc ở 100–400 dpi; đo dòng kẻ cho ô 2). IMSLP ghi đây là bản khắc Gutheil (Moskva, [1893], số bản in A. 6516 G) do Boosey & Hawkes in lại năm 1992 trong Preludes for Piano (B. & H. 20707). Chân trang đầu của bản quét ghi \"© Copyright 1893 by Hawkes & Son (London) Ltd. Revised edition © Copyright 1992\"; không thấy số bản in Gutheil trên bản quét (chân trang ghi B&H 20707); chữ khắc (Agitato., Tempo primo., m.d./m.g.) là kiểu khắc cũ. Vì chữ \"Revised edition\", mọi ô chép trên trang (ô 1–4, 15–16) đều đối chiếu thêm với bản Mutopia (nguồn Bosworth 1896 và UE 1910, độc lập với bản in lại 1992): nốt, trường độ, dấu hóa trùng khớp hoàn toàn, nên không có gì thuộc phần sửa 1992. Số ô theo bản Mutopia: ô lấy đà là ô 1 (RH-001 \\partial 2), Agitato ở ô 15, Tempo primo ở ô 46, ô cuối 62; đếm lại trên bản quét: tr. 2 ô 1–14, tr. 3 ô 15–32, tr. 4 ô 33–48, tr. 5 ô 49–62. Mốc đo trên file Commons (227,91 s, mono 44,1 kHz): bản thu lệch khoảng −0,4 nửa cung (librosa.estimate_tuning −0,38; đỉnh phổ nốt La đầu bài 106,8 Hz thay vì 110 Hz), nên căn DTW của tools/audio/align (core.align với MIDI Mutopia) chỉ dùng được sau khi chỉnh cao độ, và vẫn sai ở đoạn Lento; các mốc lấy theo khởi âm (librosa onset, hop 256) kèm 5 cao độ mạnh nhất sau mỗi khởi âm, so với nốt MIDI Mutopia từng ô (chi tiết ở n24). Cấu hình căn mốc không thêm vào tools/audio/align/pieces.py (ngoài phạm vi nhánh them/). Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/rachmaninoff-prelude-do-thang-thu. Review (Claude, 17/11/2026): ấn bản chính đổi sang bản quét Gutheil IMSLP #86365 (bản khắc đầu tiên, n.d. [1893], một lần in sau; hết bảo hộ), thay bản in lại B&H 1992 #868299 (chân trang ghi \"Revised edition © 1992\": phần sửa có thể còn bảo hộ). Hai bản cùng bản khắc A. 6516 G, cùng cách chia trang (tr. 2 ô 1–14, tr. 3 ô 15–32, tr. 4 ô 33–48, tr. 5 ô 49–62), nên số trang, hệ trong các ghi chú lượt 1 vẫn đúng với #86365. Review đọc lại trên #86365 (300–500 dpi) hai khối trích đoạn và các chỗ ghi ở n1, n6, n7, n9, n14, n25, n26, n28, n29, n33; đầu trang 3 của #86365 mất khuông trên (IMSLP: \"Pages 2-3 of No.2: Prélude damaged\"), nên tay phải ô 15–16 và chữ Agitato đối chiếu thêm Bosworth 1896 (#79003) và Mutopia. Năm in: IMSLP ghi 1893 (bản in không ghi năm, IMSLP ghi n.d. [1893]), Henle HN 1211 ghi \"First published in 1892\"; trang và bản ghi viết \"khoảng năm 1893 (bản in không ghi năm)\"."
nguon:
  - id: gutheil-1893
    bac: 1
    ten: "Rachmaninoff, Prélude Op. 3 số 2, bản khắc đầu tiên của A. Gutheil, Moskva, n.d. [1893], số bản in A. 6516 G (chân trang \"Moscou, A. Gutheil. A. 6516 G.\" và \"Gravure et Impression de Breitkopf & Härtel à Leipzig\"); bản quét IMSLP #86365 (Sibley Music Library, file SIBLEY1802.13503.f095-39087018824120piano.pdf, 27 trang cả Op. 3; IMSLP: \"First edition (later printing)\", Copyright Public Domain; \"Pages 2-3 of No.2: Prélude damaged\"), Prélude ở trang PDF 2–5 (in số trang 2–5); bìa liệt kê cả Op. 10 nên đây là một lần in sau 1894 của bản khắc 1893. Bản in không ghi năm. Bản tải tay ở ../opus-zero/_imslp/IMSLP86365-SIBLEY1802.13503.f095-39087018824120piano.pdf. Ấn bản chính của trang từ review (17/11/2026), thay bản in lại 1992 (bh-1992)."
    link: https://imslp.org/wiki/Special:ImagefromIndex/86365
  - id: bh-1992
    bac: 1
    ten: "Bản in lại bản khắc Gutheil A. 6516 G trong Preludes for Piano, Boosey & Hawkes, London, 1992 (B. & H. 20707, tr. 2–5); bản quét IMSLP #868299, file PMLP5664-B&H-1992-Rachmaninoff-Prelude-Op.3-No.2.pdf; chân trang đầu ghi \"Revised edition © Copyright 1992\". Lượt 1 đọc nốt và chữ chỉ dẫn trên bản này (cùng bản khắc với gutheil-1893); không còn là ấn bản chính vì phần sửa 1992 có thể còn bảo hộ."
    link: https://imslp.org/wiki/Special:ImagefromIndex/868299
  - id: bosworth-1896
    bac: 1
    ten: "Rachmaninoff-Album, Bosworth & Co., Leipzig, 1896 (B. & Co. 2871), John A. Preston biên tập; in lại Universal Edition ca. 1910 (U.E. 2417); bản quét IMSLP #79003, Prélude ở trang PDF 4–7 (in số trang 3–6); Public Domain. Dùng đối chiếu ô 15–16, chỗ đầu trang 3 bản quét Gutheil bị hỏng."
    link: https://imslp.org/wiki/Special:ImagefromIndex/79003
  - id: mutopia
    bac: 1
    ten: 'Mutopia Project, Prelude in C# minor Op. 3 No. 2, Petro Kostandy, Mutopia-2015/07/09-2033, CC BY-SA 4.0, source "Bosworth & Co. 1896; Universal Edition 1910"; file .ly và .mid (tải 17/11/2026, HTTP 200); nốt từng ô đọc từ MIDI bằng mido'
    link: https://www.mutopiaproject.org/ftp/RachmaninoffS/O3/rach-prelude-op3-no2/rach-prelude-op3-no2.ly
  - id: imslp-op3
    bac: 2
    ten: 'IMSLP, 5 Morceaux de fantaisie, Op.3 (Rachmaninoff, Sergei), đọc qua API wikitext 17/11/2026: số 2 "Prélude / Прелюдия, Lento (c#) — also known as The Bells of Moscow"; Year/Date of Composition 1892; First Performance 1892/09/20 in Moscow, Moscow Electrical Exhibition, Sergei Rachmaninoff (piano); Year of First Publication 1893 – Moscow: A. Gutheil, Plates A. 6516-6519 G.; Dedication Anton Arensky (1861–1906); Piece Style Romantic; file #868299: Publisher Information Gutheil, Moscow, n.d.[1893], A. 6516 G, Reprint Preludes for Piano (pp.2-5), Boosey & Hawkes, London, 1992, B. & H. 20707'
    link: https://imslp.org/wiki/Morceaux_de_fantaisie,_Op.3_(Rachmaninoff,_Sergei)
  - id: imslp-op23-32
    bac: 2
    ten: 'IMSLP, 10 Preludes, Op.23 (Year/Date of Composition 1901–03; 10 preludes) và 13 Preludes, Op.32 (1910; 13 pieces), đọc qua API wikitext 17/11/2026; trường Key của cả hai trang: tất cả các giọng, cùng với Op. 23 hay Op. 32 và "Prelude in C# minor (No.2) from Morceaux de fantaisie, Op.3"'
    link: https://imslp.org/wiki/13_Preludes,_Op.32_(Rachmaninoff,_Sergei)
  - id: imslp-rach
    bac: 2
    ten: 'IMSLP, Category:Rachmaninoff, Sergei: Born 1873 (4/1), Died 1943 (3/28)'
    link: https://imslp.org/wiki/Category:Rachmaninoff,_Sergei
  - id: henle-1211
    bac: 2
    ten: 'G. Henle Verlag, Prélude c sharp minor op. 3 no. 2, HN 1211 (đọc 17/11/2026): "Possibly the most famous late Romantic piano work … First published in 1892 as part of the piano cycle Morceaux de Fantaisie op. 3, the work also soon became well known abroad, in particular due to the concert tours given by the pianist Alexander Siloti, Rachmaninoff''s cousin. And even Rachmaninoff himself was soon no longer able to perform any concerts in America, without someone in the audience crying out C sharp minor! at the end"; Difficulty: Prélude c sharp minor op. 3,2: 5 (medium)'
    link: https://www.henle.de/Prelude-c-sharp-minor-op.-3-no.-2/HN-1211
  - id: abrsm
    bac: 2
    ten: 'ABRSM, Piano Practical Grades 2021 & 2022, 2023 & 2024, 2025 & 2026 (ba PDF tải 17/11/2026, đọc bằng PyMuPDF, tìm "Rachmanin"): tác phẩm Rachmaninoff duy nhất là Moment musical Op. 16 số 5 ở Grade 8 (2021–2022 tr. 36, 2023–2024 tr. 38, 2025–2026 tr. 44 của file); không có Op. 3. ARSM Repertoire (6/2024): Prelude Op. 23 số 6, 7, Op. 32 số 5, 12; không có Op. 3'
    link: https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20%26%202026%20Prac%20syllabus%2020240524_access.pdf
  - id: pianosyllabus
    bac: 2
    ten: 'pianosyllabus.com, Prelude in C# minor No 2 from Morceaux de fantaisie Op 3 (ref 3082417, đọc 17/11/2026): AMEB Cert. Perf.; AMEB PFL Cert. Perf.; ANZCA A.Dip.A.; RCM 10; RIAM Snr. Cert.; AGME 7; GCSE 9; Piano St 8; PS rating 9'
    link: https://pianosyllabus.com/x-detail.php?ref=3082417
  - id: commons-ban-thu
    bac: 1
    ten: 'Wikimedia Commons, File:Sergei Rachmaninoff performs Rachmaninoff''s Prelude in C sharp minor, Op. 3.ogg (trang mô tả đọc bằng tools/audio/commons.py --fresh page, 17/11/2026): "performed by the author himself. This is Edison Diamond Disc 82187-R, Matrix 6742-C-2-3 [2-1]. Recorded in 1919, released in December 1920"; Date 1920-12; thể loại 1919-04-24; "cleaned up and restored copy of File:Prelude 3 2 Rach playing.ogg, restored by Adam Cuerden"; giấy phép {{PD-old-auto-record-expired|deathyear=1943}}; ffprobe 227,908 s; file tải về và đo bằng ffmpeg, librosa'
    link: https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_performs_Rachmaninoff%27s_Prelude_in_C_sharp_minor,_Op._3.ogg
  - id: site-nghe-si
    bac: 2
    ten: 'Trang piano/nghe-si (đã khóa): Sergei Rachmaninoff (1873–1943), "Một trong những nghệ sĩ piano lớn nhất thời mình: tiếng rõ, nhịp chắc, không ủy mị"'
    link: https://mtuann.github.io/opus/piano/nghe-si/
  - id: site-lich-su
    bac: 2
    ten: 'Trang lich-su/nha-soan-nhac (đã khóa), mục Sergei Rachmaninoff (1873–1943): "Nghệ sĩ piano và nhà soạn nhạc Nga"'
    link: https://mtuann.github.io/opus/lich-su/nha-soan-nhac/
  - id: thuat-ngu
    bac: 2
    ten: 'src/data/thuat-ngu.yml (Từ điển của site, đã khóa): Lento "Chậm"; agitato "Kích động, bồn chồn"; Tempo primo "Trở lại tốc độ như lúc đầu"; pesante "Nặng, một cách nặng nề"; tenuto "Giữ đủ độ dài"'
    link: https://mtuann.github.io/opus/nhac-ly/tu-dien/
nhan_dinh:
  - id: n1
    cau: 'Bài mở đầu bằng ba nốt rất to (ff), La – Sol♯ – Đô♯, mỗi nốt ở ba quãng tám (tay phải La3, Sol♯3, Đô♯3; tay trái một quãng tám ở dưới); nốt Đô♯ ngân sang ô 3.'
    loai: cau-truc
    nguon: [ gutheil-1893, mutopia ]
    ket_qua: dung
    ghi_chu: "Bản quét tr. 2 hệ 1 (400 dpi): ô 1 hai nốt đen có dấu > (ff), tay phải La3 (dòng kẻ phụ thứ hai dưới khóa Sol), Sol♯3; tay trái quãng tám La1–La2, Sol♯1–Sol♯2; ô 2 nốt tròn Đô♯3 (đo: dòng kẻ phụ thứ tư ở y = 1161 px, đầu nốt ở 1175 px, nửa khoảng dưới dòng Rê3) và quãng tám Đô♯1–Đô♯2, có dấu nối sang ô 3. MIDI Mutopia ô 1–2: A3, G#3, C#3 (6 phách); A1+A2, G#1+G#2, C#1+C#2. Review (Claude, 17/11/2026): bản quét Gutheil #86365 tr. 2 hệ 1 (300–500 dpi): ff, dấu nhấn, tay phải La3, Sol♯3 rồi Đô♯3 nốt tròn nối sang ô 3, tay trái quãng tám La1–La2, Sol♯1–Sol♯2, Đô♯1–Đô♯2: khớp."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/86365", "https://www.mutopiaproject.org/ftp/RachmaninoffS/O3/rach-prelude-op3-no2/rach-prelude-op3-no2.ly" ]
    luot_2_ghi_chu: "G trang 2, ô 1–2: ff, dấu nhấn, tay phải La3–Sol♯3–Đô♯3 (nốt đơn), tay trái quãng tám La1–La2, Sol♯1–Sol♯2, Đô♯1–Đô♯2; Đô♯ nốt tròn nối sang nốt trắng ô 3. Mu: a4-> gs-> | cs,1->~ (tay phải), <a,, a'> (tay trái). BH, Bo giống."
    review: dung
  - id: n2
    cau: 'Nhà xuất bản Henle gọi đây có lẽ là bài piano nổi tiếng nhất của cuối thời Lãng mạn.'
    loai: lich-su
    nguon: [ henle-1211 ]
    ket_qua: dung
    ghi_chu: "Henle: \"Possibly the most famous late Romantic piano work\". Review (Claude, 17/11/2026): trang Henle HN 1211 đọc lại: \"Possibly the most famous late Romantic piano work\": khớp."
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/Prelude-c-sharp-minor-op.-3-no.-2/HN-1211" ]
    luot_2_ghi_chu: 'Henle HN 1211: "Possibly the most famous late Romantic piano work".'
    review: dung
  - id: n3
    cau: 'Bản thu gợi ý trên trang do chính Rachmaninoff chơi.'
    loai: ten
    nguon: [ commons-ban-thu ]
    ket_qua: dung
    ghi_chu: "Commons: \"performed by the author himself\". Bản thu này là ban_thu đầu tiên của bản ghi (src/data/tac-pham.yml). Review (Claude, 17/11/2026): wikitext Commons (API, đọc lại): \"performed by the author himself\": khớp."
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_performs_Rachmaninoff%27s_Prelude_in_C_sharp_minor,_Op._3.ogg" ]
    luot_2_ghi_chu: 'Trang mô tả Commons: "performed by the author himself", Edison Diamond Disc 82187-R. IMSLP (mục bản thu) cũng ghi người chơi là chính tác giả.'
    review: dung
  - id: n4
    cau: 'Bài ở chặng 7 của lộ trình trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: "chang: 7 trong bản ghi rachmaninoff-prelude-do-thang-thu (src/data/tac-pham.yml). Review (Claude, 17/11/2026): src/data/tac-pham.yml, bản ghi rachmaninoff-prelude-do-thang-thu: chang: 7. Đúng."
    review: dung
  - id: n5
    cau: 'Bài dài 62 ô, tính ô lấy đà đầu bài (hai phách) là ô 1, như bản Mutopia.'
    loai: cau-truc
    nguon: [ gutheil-1893, mutopia ]
    ket_qua: dung
    ghi_chu: "Mutopia .ly: \"Bar RH-001\" \\partial 2 (ô lấy đà), ô cuối \"RH-062\" (cs1-- \\fermata \\bar \"|.\"). Đếm trên bản quét: tr. 2 bốn hệ 4+4+3+3 = 14 ô (ô 1 là ô lấy đà hai nốt đen, không có dấu lặng); tr. 3 năm hệ 3+3+4+4+4 = 18 ô (15–32); tr. 4 năm hệ 3+3+3+4+3 = 16 ô (33–48); tr. 5 ba hệ 3+3+8 = 14 ô (49–62). Review (Claude, 17/11/2026): bản quét Gutheil #86365: tr. 5 hệ 3 đếm lại 8 ô (55–62), ô cuối có dấu ngân: khớp 62 ô."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/RachmaninoffS/O3/rach-prelude-op3-no2/rach-prelude-op3-no2.ly", "https://imslp.org/wiki/Special:ImagefromIndex/86365" ]
    luot_2_ghi_chu: "Mu: Bar 001 là \\partial 2, chú thích ô tới RH-062 (ô cuối có fermata). Đếm trên G: ô lấy đà + 61 ô đủ = 62."
    review: dung
  - id: n6
    cau: 'Bài đòi sắc thái từ ppp tới sffff và có một đoạn giữa nhanh (Agitato).'
    loai: cau-truc
    nguon: [ gutheil-1893 ]
    ket_qua: dung
    ghi_chu: "Bản quét: ppp tr. 2 hệ 1 (ô 3), hệ 3 (ô 9), hệ 4 (ô 13); sffff tr. 4 hệ 5 (ô 47), tr. 5 hệ 1 (ô 50); Agitato. tr. 3 hệ 1 (ô 15), chùm ba móc đơn. Review (Claude, 17/11/2026): bản quét Gutheil #86365: ppp ô 3 (tr. 2 hệ 1), sffff ô 47 (tr. 4 hệ 5); Agitato theo Bosworth 1896 (tr. 4 hệ 1) vì đầu tr. 3 #86365 hỏng: khớp."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/86365", "https://imslp.org/wiki/Special:ImagefromIndex/79003" ]
    luot_2_ghi_chu: 'G: ppp ô 3, sffff ô 47 và 50. Chữ Agitato ở ô 15: trang G bị hỏng phần đầu nên không thấy; Bo 1896 trang 4 và BH ghi "Agitato."; Mu cũng có.'
    review: dung
  - id: n7
    cau: 'Đoạn chủ đề trở lại viết trên bốn khuông, ghi fff pesante (pesante: nặng).'
    loai: cau-truc
    nguon: [ gutheil-1893, thuat-ngu ]
    ket_qua: dung
    ghi_chu: "Bản quét tr. 4 hệ 5: \"Tempo primo.\", bốn khuông, chữ m.d. (hai khuông trên) và m.g. (hai khuông dưới), \"fff pesante\" ở cả hai cặp khuông; bốn khuông tới hết ô 55 (tr. 5 hệ 3, ô đầu). Pesante: thuat-ngu.yml \"Nặng, một cách nặng nề\". Review (Claude, 17/11/2026): bản quét Gutheil #86365 tr. 4 hệ 5: Tempo primo., m.d. và m.g., fff pesante ở cả hai cặp khuông, sffff ô 47: khớp. Sửa ghi chú lượt 1: bốn khuông không dừng ở ô 55 mà kéo tới hết bài (tr. 5 hệ 3, ô 55–62 vẫn hai cặp khuông, mỗi khuông dưới giữ Đô♯ trầm nốt tròn). Câu này đúng; dòng \"Đọc bốn khuông\" của bảng Chỗ khó và Lỗi thường gặp sửa thành \"từ ô 46 (tới hết bài)\" (n34)."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/86365", "https://www.dolmetsch.com/defsp1.htm" ]
    luot_2_ghi_chu: "G trang 4: Tempo primo, bốn khuông, fff pesante ở cả m.d. và m.g. Dolmetsch: pesante = heavy, weighty."
    review: dung
  - id: n8
    cau: 'Tiếng to phải đến từ sức nặng cánh tay, không từ vai cứng; thả sức nặng cánh tay vào phím, cổ tay mềm, nhả ngay sau khi đánh.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
