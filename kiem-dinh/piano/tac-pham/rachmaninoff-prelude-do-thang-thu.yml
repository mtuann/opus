ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 8). Nốt nhạc, chữ chỉ dẫn
  đọc từ bản quét IMSLP #868299 (4 trang, in số trang 2–5; đọc ở 100–400 dpi; đo
  dòng kẻ cho ô 2). IMSLP ghi đây là bản khắc Gutheil (Moskva, [1893], số bản in
  A. 6516 G) do Boosey & Hawkes in lại năm 1992 trong Preludes for Piano (B. &
  H. 20707). Chân trang đầu của bản quét ghi "© Copyright 1893 by Hawkes & Son
  (London) Ltd. Revised edition © Copyright 1992"; không thấy số bản in Gutheil
  trên bản quét (chân trang ghi B&H 20707); chữ khắc (Agitato., Tempo primo.,
  m.d./m.g.) là kiểu khắc cũ. Vì chữ "Revised edition", mọi ô chép trên trang (ô
  1–4, 15–16) đều đối chiếu thêm với bản Mutopia (nguồn Bosworth 1896 và UE
  1910, độc lập với bản in lại 1992): nốt, trường độ, dấu hóa trùng khớp hoàn
  toàn, nên không có gì thuộc phần sửa 1992. Số ô theo bản Mutopia: ô lấy đà là
  ô 1 (RH-001 \partial 2), Agitato ở ô 15, Tempo primo ở ô 46, ô cuối 62; đếm
  lại trên bản quét: tr. 2 ô 1–14, tr. 3 ô 15–32, tr. 4 ô 33–48, tr. 5 ô 49–62.
  Mốc đo trên file Commons (227,91 s, mono 44,1 kHz): bản thu lệch khoảng −0,4
  nửa cung (librosa.estimate_tuning −0,38; đỉnh phổ nốt La đầu bài 106,8 Hz thay
  vì 110 Hz), nên căn DTW của tools/audio/align (core.align với MIDI Mutopia)
  chỉ dùng được sau khi chỉnh cao độ, và vẫn sai ở đoạn Lento; các mốc lấy theo
  khởi âm (librosa onset, hop 256) kèm 5 cao độ mạnh nhất sau mỗi khởi âm, so
  với nốt MIDI Mutopia từng ô (chi tiết ở n24). Cấu hình căn mốc không thêm vào
  tools/audio/align/pieces.py (ngoài phạm vi nhánh them/). Chữ do
  ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ
  du-lieu/tac-pham/rachmaninoff-prelude-do-thang-thu.'
