      luot_2: "Claude Opus 5.5 (agent riêng, độc lập với lượt 1, 17/11/2026; 49 câu,
        49 đúng; đối chiếu bản Gutheil 1893 IMSLP #86365 và Bosworth 1896
        #79003)"
      review: null
