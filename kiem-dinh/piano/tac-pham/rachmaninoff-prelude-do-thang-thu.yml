    ghi_chu: "IMSLP file #868299: Gutheil n.d.[1893] A. 6516 G, Reprint Preludes for Piano, Boosey & Hawkes 1992, B. & H. 20707. Mutopia header: maintainer Petro Kostandy, source \"Bosworth & Co. 1896; Universal Edition 1910\", license CC BY-SA 4.0. Commons: Diamond Disc 82187-R; PD-old-auto-record-expired (bản ghi âm phát hành 1920: ở Mỹ, bản ghi âm phát hành trước 1923 hết bảo hộ từ 1/1/2022; tác giả mất 1943). Review (Claude, 17/11/2026): mục Nguồn viết lại: ấn bản chính là bản khắc đầu tiên của Gutheil [khoảng 1893], bản quét một lần in sau (thư viện Sibley, IMSLP #86365); thêm Bosworth 1896 (John A. Preston biên tập, IMSLP #79003) làm bản đối chiếu; bỏ bản in lại B&H 1992. Giấy phép bản thu: wikitext Commons {{PD-old-auto-record-expired|deathyear=1943}}; đĩa phát hành 12/1920, ở Mỹ thuộc phạm vi công cộng theo Classics Protection and Access Act (bản ghi âm phát hành trước 1923 hết bảo hộ từ 1/1/2022), tác giả và người chơi mất 1943; nguồn file là National Park Service (Edison). Trang chỉ ghi \"phạm vi công cộng\", không nói thêm về luật: đúng."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Morceaux_de_fantaisie,_Op.3_(Rachmaninoff,_Sergei)", "https://www.mutopiaproject.org/ftp/RachmaninoffS/O3/rach-prelude-op3-no2/rach-prelude-op3-no2.ly", "https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_performs_Rachmaninoff%27s_Prelude_in_C_sharp_minor,_Op._3.ogg" ]
    luot_2_ghi_chu: "IMSLP file PMLP5664-B&H-1992: Gutheil n.d.[1893], A. 6516 G, in lại trong Preludes for Piano, Boosey & Hawkes London 1992 (B. & H. 20707); chân trang G cũng ghi A. 6516 G. Mu header: maintainer Petro Kostandy, CC BY-SA 4.0, source Bosworth 1896; Universal Edition 1910. Commons: 82187-R; giấy phép PD-old-auto-record-expired: ở Mỹ thuộc phạm vi công cộng theo Classics Protection and Access Act (17 U.S.C. § 1401) vì phát hành trước 1/1/1926."
