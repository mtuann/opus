  ghi_chu: 'Tay phải liền, tay trái nảy: 2/4, Sol thứ, 4 ô đủ 4 móc đơn. Tay trái rải staccato G2 D3 G3 B♭3 | C3 G3 C4 E♭4 | D3 A3 C4 F♯4 | G2 D3 G3 B♭3 (i – iv – V7 – i, cùng kiểu hợp âm rải ô 17–20 của bài: Đô thứ, Rê bảy), 5 rồi nảy lên 3-2-1 (tầm rải một quãng 10, đúng lời dẫn "nảy lên"). Tay phải D5 | E♭5 | D5 C5 | B♭4 legato, to dần đến Mi♭ rồi nhỏ dần (n55). Hòa âm khớp. Hợp chặng 2.'
