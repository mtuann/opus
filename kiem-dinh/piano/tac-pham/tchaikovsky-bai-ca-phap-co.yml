ghi_chu: 'Bài học Old French Song Op. 39 số 16 (tầng Tác phẩm). Bản nhạc: Mutopia 2080 (Schirmer 1904), .ly và PDF. Lịch sử: Tchaikovsky Research (Children''s Album, The Maid of Orleans), IMSLP. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/tchaikovsky-bai-ca-phap-co. Sửa trang: n9. Khuông: khối 1 (trích đoạn) khớp từng nốt; khối 2–4 ví dụ soạn đúng. Thuật ngữ trang dùng (cantabile, molto moderato, espressivo, una corda, kết nửa, kết trọn, cảm âm) đã có trong src/data/thuat-ngu.yml hay trang nhạc lý đã khóa.'
nguon:
- id: mutopia-2080
  bac: 1
  ten: 'Mutopia Project, Old French Song, Op. 39 No. 16 (David McNamara, nguồn Schirmer 1904, phạm vi công cộng), Mutopia-2015/11/27-2080: .ly, PDF A4, MIDI tải ngày 05/11/2026'
  link: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=2080
- id: tr-op39
  bac: 2
  ten: Tchaikovsky Research, Children's Album (danh sách 24 bài, thứ tự bản thảo, sáng tác, xuất bản, đề tặng, quan hệ với các tác phẩm khác)
  link: https://en.tchaikovsky-research.net/pages/Children's_Album
- id: tr-maid
  bac: 2
  ten: 'Tchaikovsky Research, The Maid of Orleans (Орлеанская дева): sáng tác 12/1878–3/1879; Act II No. 10 Chorus of Minstrels dùng bài hát Pháp "Mes belles amourettes", cũng là Old French Song số 16'
  link: https://en.tchaikovsky-research.net/pages/The_Maid_of_Orleans
- id: imslp-op39
  bac: 2
  ten: 'IMSLP, Children''s Album, Op.39 (Tchaikovsky): danh sách 24 bài (thứ tự bản in thời Tchaikovsky), lần in đầu 1878 Moskva, Jurgenson'
  link: https://imslp.org/wiki/Children's_Album,_Op.39_(Tchaikovsky,_Pyotr)
- id: ushakov-pesenka
  bac: 2
  ten: 'Từ điển giải nghĩa tiếng Nga Ushakov, mục "песенка" (trên gufo.me): "ласк. к песня"'
  link: https://gufo.me/dict/efremova/%D0%BF%D0%B5%D1%81%D0%B5%D0%BD%D0%BA%D0%B0
- id: omt-minor
  bac: 2
  ten: Open Music Theory, Minor Scales, Scale Degrees, and Key Signatures (leading tone trong gam thứ hòa âm, giai điệu)
  link: https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
- id: omt-ternary
  bac: 2
  ten: Open Music Theory, Ternary Form
  link: https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/
- id: omt-binary
  bac: 2
  ten: Open Music Theory, Binary Form (kết nửa trước chỗ trở lại của A)
  link: https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/
- id: kth-decay
  bac: 2
  ten: 'KTH, Five lectures on the acoustics of the piano, Klaus Wogram: Decay of the piano tone'
  link: https://www.speech.kth.se/music/5_lectures/wogram/decay.html
nhan_dinh:
- id: n1
  cau: Bài là một giai điệu Sol thứ hát chậm rãi trên nốt Sol trầm ngân dài.
  loai: cau-truc
  nguon:
  - mutopia-2080
  - tr-op39
  ket_qua: dung
  ghi_chu: 'TR: "Molto moderato (G minor, 32 bars)". Mutopia: bè trầm g2 ~ | g4 g4 ~ … dưới giai điệu.'
- id: n2
  cau: Bài nằm trong Album cho thiếu nhi Tchaikovsky viết năm 1878 "theo kiểu Schumann".
  loai: nam
  nguon:
  - tr-op39
  ket_qua: dung
  ghi_chu: 'TR: "subtitled \"24 simple pieces à la Schumann\", is a cycle of 24 piano pieces composed between May and July 1878."'
- id: n3
  cau: Bài dài 32 ô nhịp, một giai điệu vang lên ba lần.
  loai: cau-truc
  nguon:
  - mutopia-2080
  - tr-op39
  ket_qua: dung
  ghi_chu: 'TR: 32 bars. Mutopia: overallForm AABA, melodyAHead ba lần (ô 1–8, 9–16, 25–32).'
- id: n4
  cau: Toàn bộ nghệ thuật nằm ở chỗ để tay phải hát, còn tay trái với hai bè của nó chỉ thì thầm bên dưới.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n5
  cau: Giai điệu đi chậm, nhiều nốt dài, có nốt nhắc lại dưới dấu luyến.
  loai: cau-truc
  nguon: &id001
  - mutopia-2080
  ket_qua: dung
  ghi_chu: 'Mutopia: d4.) d8( (Rê dài rồi Rê nhắc lại trong dấu luyến mới) ô 2, 4; a4.. ô 7.'
- id: n6
  cau: Cantabile nghĩa là "như hát".
  loai: dinh-nghia
  nguon: []
  ket_qua: dung
  ghi_chu: Khớp Từ điển của site (src/data/thuat-ngu.yml, mục cantabile, đã khóa ở D3-L5).
- id: n7
  cau: Trên piano, nốt nào cũng tắt dần ngay sau khi đánh.
  loai: dinh-nghia
  nguon:
  - kth-decay
  ket_qua: dung
  ghi_chu: 'KTH (Wogram): "the decay of a piano tone… since the initial blow of the hammer sets the string in vibration". Vế sau ("hát được nghĩa là nối nốt sau vào đúng mức tiếng…") là lời khuyên.'
- id: n8
  cau: 'Tay trái đoạn A: ngón 5 giữ Sol trầm qua nhiều ô (dấu nối), trong khi các ngón khác chơi một giọng giữa có dấu luyến riêng.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: bassA g2 ~ | g4 g4 ~ (dấu nối); middleA bes8[( c d c] | bes2) | ees4( c | bes4) …. Số ngón 5 và 3-2-1 là gợi ý của trang, chơi được (Sol3 – Rê4 quãng 5).'
- id: n9
  cau: Đây là bước đầu để chơi hai bè trong một bàn tay.
  loai: cau-truc
  nguon: *id001
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là bước đầu của lối viết nhiều bè trong nhạc Lãng mạn." Chữ mới: "Đây là bước đầu để chơi hai bè trong một bàn tay." Lý do: vế "lối viết nhiều bè trong nhạc Lãng mạn" là khái quát lịch sử không có nguồn; câu mới chỉ nói điều bản nhạc cho thấy (tay trái hai bè, Mutopia: Voice "middle" và "bass" cùng khuông dưới).'
- id: n10
  cau: 'Ba lớp âm thanh: giai điệu, giọng giữa, nốt trầm ở ba mức to nhỏ khác nhau cùng lúc; làm được là một bước lớn về tiếng đàn.'
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n11
  cau: Link "tiếng đàn" (/opus/piano/tieng-dan/).
  loai: ve-site
  ket_qua: dung
  ghi_chu: Trang đích src/content/docs/piano/tieng-dan.md có.
- id: n12
  cau: Ở đầu đoạn B, tay phải hát legato trong khi tay trái rải hợp âm staccato.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia ô 17–20: tay trái c8\staccato[ g\staccato c''\staccato ees''\staccato] …; tay phải melodyB g4( g8 a | bes4.) có dấu luyến.'
- id: n13
  cau: 'Giai điệu A vang lên ba lần: p, pp, rồi p sau đoạn giữa.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia overallDynamics: s8\p (lấy đà), s8\pp (cuối ô 8), s4\p ô 17 (đoạn B, nên lần A thứ ba sau s8\p cuối ô 24).'
- id: n14
  cau: Album for the Young Op. 39 (1878) là tập 24 bài đơn giản "à la Schumann".
  loai: ten
  nguon:
  - tr-op39
  - imslp-op39
  ket_qua: dung
  ghi_chu: 'TR: "24 simple pieces à la Schumann", 1878.'
- id: n15
  cau: Câu chuyện đầy đủ của tập được kể ở bài Cầu nguyện buổi sáng (/opus/piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang/).
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Trang đích chưa chuyển; site cũ ../opus-zero/docs/piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang.md, mục "Bối cảnh" (dòng 30–34): Florence 2/1878, Kamenka, 24 bài phác thảo trong vài tuần, đề tặng Volodya Davydov. Điều cần giữ: trang ấy có đoạn bối cảnh đầy đủ của Op. 39.'
- id: n16
  cau: Cầu nguyện buổi sáng là bài số 1 của tập.
  loai: danh-muc
  nguon:
  - tr-op39
  - imslp-op39
  ket_qua: dung
  ghi_chu: 'TR, IMSLP: 1. Morning Prayer.'
- id: n17
  cau: 'Giữa tập có nhóm "bài hát nước ngoài": Bài ca Ý (số 15), Bài ca Pháp cổ (số 16), Bài ca Đức (số 17), Bài ca Napoli (số 18).'
  loai: danh-muc
  nguon:
  - tr-op39
  - imslp-op39
  ket_qua: dung
  ghi_chu: 'TR, IMSLP (thứ tự bản in): 15 Italian Song, 16 Old French Song, 17 German Song, 18 Neapolitan Song. "Nhóm bài hát nước ngoài" là cách gọi của trang cho bốn bài liền nhau.'
- id: n18
  cau: Tựa tiếng Nga Старинная французская песенка nghĩa là "bài hát Pháp xưa".
  loai: ten
  nguon:
  - tr-op39
  - imslp-op39
  ket_qua: dung
  ghi_chu: 'TR, IMSLP: "Old French Song (Старинная французская песенка)".'
- id: n19
  cau: Chữ песенка là dạng thân mật của "bài hát" (песня), như "bài hát nhỏ".
  loai: ten
  nguon:
  - ushakov-pesenka
  ket_qua: dung
  ghi_chu: 'Ushakov: "ПЕСЕНКА … (разг.). ласк. к песня" (dạng âu yếm, thân mật của песня).'
- id: n20
  cau: Tchaikovsky dùng lại chủ đề này trong bài hát của những người hát rong (minstrel) ở hồi II vở opera Орлеанская дева (Trinh nữ xứ Orléans).
  loai: lich-su
  nguon:
  - tr-op39
  - tr-maid
  ket_qua: dung
  ghi_chu: 'TR Children''s Album: "The theme of the Old French Song (No. 16) was used again in the Minstrels'' song from Act II of the opera The Maid of Orleans." TR Maid: "Act II, No. 10. The Minstrels'' Chorus … includes the French song ''Mes belles amourettes'', which Tchaikovsky also used as the Old French Song".'
- id: n21
  cau: Vở Trinh nữ xứ Orléans viết không lâu sau Album cho thiếu nhi.
  loai: nam
  nguon:
  - tr-maid
  - tr-op39
  ket_qua: dung
  ghi_chu: 'TR: Album sáng tác 5–7/1878, in 10/1878; The Maid of Orleans "composed between December 1878 and March 1879".'
- id: n22
  cau: Thứ tự các bài trong bản thảo của Tchaikovsky khác bản in đầu tiên ở vài chỗ.
  loai: danh-muc
  nguon:
  - tr-op39
  ket_qua: dung
  ghi_chu: 'TR: "The sequence of numbers differs in Tchaikovsky''s autograph score, where they appear in the following order: 1, 2, 4, 3, 5, 9, 6, 7, 8, 14, 10, 11, 12, 13, 15, 16, 17, 18, 19, 20, 21, 22, 24, and 23."'
- id: n23
  cau: Bài số 16 đứng thứ 16 trong cả bản in đầu lẫn bản thảo, nên "Op. 39 số 16" là cách gọi chắc chắn.
  loai: danh-muc
  nguon:
  - tr-op39
  - imslp-op39
  ket_qua: dung
  ghi_chu: 'Dãy của TR: vị trí thứ 16 là số 16 (đếm: 1, 2, 4, 3, 5, 9, 6, 7, 8, 14, 10, 11, 12, 13, 15, 16). IMSLP: số 16 theo thứ tự bản in thời Tchaikovsky.'
- id: n24
  cau: Một số bài mang số khác nhau giữa các ấn bản; trong tuyển tập và sách thi bài có thể mang số riêng của cuốn sách.
  loai: danh-muc
  nguon:
  - imslp-op39
  ket_qua: dung
  ghi_chu: 'IMSLP: "some later editions use different numbering based on the composer''s autograph score". Lời khuyên "tìm theo tên" là khuyên tập.'
- id: n25
  cau: 'Cách nghe: hai, ba bản thu, nghe trọn nhóm số 15–18; năm câu hỏi (mấy lần A, nốt Sol trầm, giọng giữa, đoạn B, tốc độ).'
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n26
  cau: Giọng giữa của tay trái đi Si♭ – Đô – Rê – Đô.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia middleA: bes8[( c d c].'
- id: n27
  cau: Ở đoạn B, tay trái đổi sang hợp âm rải nảy; giai điệu leo lên điểm cao nhất rồi lắng xuống.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: ô 17–20 hợp âm rải staccato; melodyB lên F5 ô 22 rồi xuống A4/F♯4 ô 24.'
- id: n28
  cau: 'Đoạn A (lấy đà và ô 1–8): p; giai điệu vươn từ Rê lên Sol rồi đứng trên Rê, chạm Mi♭; tay trái giữ Sol trầm, giọng giữa Si♭ – Đô – Rê – Đô; ô 7 hợp âm Rê bảy, ô 8 kết ở Sol thứ.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: d8( | g a bes c | d4.) …; ees ô 3, 5, 6; ô 7 tay phải a4.., giọng giữa c''2 (Đô4), bè trầm fis4 d: D – F♯ – A – C (Rê bảy); ô 8 g'' trên g, bes.'
- id: n29
  cau: 'Đoạn A lần hai (ô 9–16): pp; nguyên văn như lần đầu; ô 16 dừng trên hợp âm Sol thứ.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: \melodyAHead lặp, s8\pp; ô 16 g''2 trên bes2, g2 (kết thứ hai của \repeat unfold).'
- id: n30
  cau: 'Đoạn B, nửa đầu (ô 17–20): p; tay trái hợp âm rải staccato (Đô thứ, rồi Rê bảy); giai điệu Sol – Sol – La – Si♭ đi lên; to dần từ ô 20.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: ô 17–19 c g c'' ees'' (Đô thứ; ô 18 trên g,), ô 20 d a c'' fis'' (Rê bảy); melodyB g4( g8 a | bes4.); s2\< ô 20.'
- id: n31
  cau: 'Đỉnh (ô 21–22): tay trái liền lại; giai điệu lên Rê, rồi Mi♭ – Fa ở ô 22, mf: nốt cao nhất bài.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: ô 21 <g bes>8( d'' g'') r, d4. d8; ô 22 ees8 f16 ees d8 c, s2\mf; F5 cao nhất (đoạn A cao nhất Mi♭5).'
- id: n32
  cau: 'Kết đoạn B (ô 23–24): nhỏ dần, dừng trên hợp âm Rê trưởng (át âm).'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: s4\> ô 23; ô 24 tay phải <a fis>4., tay trái d''4 ( d4).'
- id: n33
  cau: 'Đoạn A trở lại (ô 25–32): p; ở hai ô cuối, tay phải có thêm một bè dưới, bè trầm đi Đô – Rê – Sol về hợp âm Sol thứ.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: s8\p cuối ô 24; bè dưới tay phải ees''4 d'' bes2 (ô 31–32); bè trầm c4( d4 | g,2).'
- id: n34
  cau: 'Bảng Cấu trúc, đoạn A (lấy đà, 1–8): p; Sol thứ trên âm nền Sol; Rê bảy (ô 7), kết trọn ở Sol thứ (ô 8); Sol trầm đánh lại ở phách 2 các ô 2, 4, 6.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia bassA: g2~ | g4 g4~ | g2~ | g4 g4~ | g2~ | g4 g4 (đánh lại phách 2 ô 2, 4, 6); ô 7–8 V7 – i, giai điệu về Sol.'
- id: n35
  cau: 'Đoạn A thứ hai (9–16): pp, nhắc lại nguyên văn; ô 16 dừng trên hợp âm Sol thứ nốt trắng.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: Như n29.
- id: n36
  cau: 'Đoạn B (17–24): p; to dần (ô 20–21), mf (ô 22), nhỏ dần (ô 23–24); Đô thứ (ô 17–19), Rê bảy (ô 20), Sol thứ (ô 21), Đô thứ (ô 22), dừng trên Rê trưởng (kết nửa, ô 24); giai điệu lên Fa5 ở ô 22.'
  loai: cau-truc
  nguon:
  - mutopia-2080
  - omt-binary
  ket_qua: dung
  ghi_chu: 'Mutopia: s2\< ô 20, s8\! cuối ô 21, \mf ô 22, \> ô 23; tay trái ô 21 <g bes> d'' g'', ô 22 <c'' ees'' g''>2, ô 24 D. Kết nửa trước khi A trở lại: OMT Binary Form.'
- id: n37
  cau: 'Đoạn A cuối (25–32): p; ô 31 Đô – Rê ở bè trầm, ô 32 Sol thứ; ô 31–32 tay phải thêm bè dưới Mi♭ – Rê, rồi Si♭.'
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: Như n33.
- id: n38
  cau: Bản nhạc không ghi chậm lại ở cuối.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: không có rit., rall. hay fermata.'
- id: n39
  cau: 'Hình dạng A A B A, mỗi đoạn 8 ô, là kiểu ba đoạn có tái hiện quen thuộc của ca khúc: một giai điệu, nhắc lại, một đoạn tương phản, rồi giai điệu trở về.'
  loai: cau-truc
  nguon:
  - mutopia-2080
  - omt-ternary
  ket_qua: dung
  ghi_chu: 'Mutopia: "overallForm=AABA". OMT Ternary Form: A – B – A, phần giữa tương phản, A trở lại. Gọi AABA là "ba đoạn có tái hiện" theo trang nhạc lý của site (nhac-ly/31-hinh-thuc-nho).'
