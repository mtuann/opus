    ket_qua: dung
    ghi_chu: 'Tay trái hai bè: 2/4, Sol thứ, 8 ô đủ 4 móc đơn. Ô 1–4 tay phải nghỉ; tay trái giọng giữa B♭3 A3 B♭3 C4 | D4 | C4 D4 C4 A3 | B♭3 (ngón 3-4-?-2, 1, 2-1-2-4, 3) trên Sol3 ngón 5 nối, đánh lại phách 2 ô 2, 4 như lời dẫn (n53). Ô 5–8 lặp, tay phải G4 A4 | B♭4 | C5 B♭4 | A4 G4 (1-2-3, 4-3-2-1) mp trên tay trái p. Hòa âm Sol thứ, nốt giọng giữa A, C là nốt qua/thêu. Chơi được, hợp chặng 2.'
