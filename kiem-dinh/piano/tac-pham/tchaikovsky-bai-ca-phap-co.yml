  ghi_chu: 'Hát một câu: 2/4, Sol thứ, L:1/16, lấy đà D4 rồi 5 ô đủ 8 móc kép: G4(4) B♭4 A4 | B♭4(6) B♭4(2) | C5 B♭4 A4 G4(2) A4(2) | F♯4(7) G4(1) | G4(4) z4. Chi tiết như lời dẫn (n56): lấy đà quãng bốn, nốt dài rồi nhắc lại, hai móc kép, chấm dôi kép. Thế Fa♯ – Đô ngón 1–5 sau lấy đà: khớp số ngón 2, 4, 5, 1, 2. Tay trái G3+B♭3, G3+D4, C3 E♭3 G3, D3 A3 C4, G2+G3: i – i – iv – V7 – i, F♯ trên V7, G móc kép cuối là nốt đón trước. Hợp chặng 2.'
doi_chu:
- cu: Một bàn tay, hai bè. Ngón 5 tay trái giữ Sol trầm qua nhiều ô (dấu nối), trong khi ngón 3-2-1 chơi một giọng giữa có dấu luyến riêng. Đây là bước đầu của lối viết nhiều bè trong nhạc Lãng mạn.
  moi: Một bàn tay, hai bè. Ngón 5 tay trái giữ Sol trầm qua nhiều ô (dấu nối), trong khi ngón 3-2-1 chơi một giọng giữa có dấu luyến riêng. Đây là bước đầu để chơi hai bè trong một bàn tay.
  ly_do: 'n9 (da-sua): "lối viết nhiều bè trong nhạc Lãng mạn" là khái quát không có nguồn; câu mới chỉ nói điều bản nhạc cho thấy (Mutopia 2080: tay trái hai bè).'
