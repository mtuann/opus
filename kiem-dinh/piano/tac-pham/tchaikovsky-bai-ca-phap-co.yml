    ten: 'Mutopia Project, Old French Song, Op. 39 No. 16 (David McNamara, nguồn Schirmer 1904, phạm vi công cộng), Mutopia-2015/11/27-2080: .ly, PDF A4, MIDI tải ngày 05/11/2026'
    link: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=2080
  - id: tr-op39
    bac: 2
    ten: Tchaikovsky Research, Children's Album (danh sách 24 bài, thứ tự bản thảo, sáng tác, xuất bản, đề tặng, quan hệ với các tác phẩm khác)
    link: https://en.tchaikovsky-research.net/pages/Children's_Album
