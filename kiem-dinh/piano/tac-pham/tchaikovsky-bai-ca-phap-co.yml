  ghi_chu: 'Đối chiếu từng nốt nhịp lấy đà và ô 1–8 với Mutopia 16OldFrenchSong.ly (Schirmer 1904, David McNamara), đọc tay cao độ tương đối/tuyệt đối của LilyPond. 2/4, Sol thứ (K:Gm), L:1/16, mỗi ô 8 móc kép. Tay phải D4 | G4 A4 B♭4 C5 | D5. D5 | C5 D5 E♭5 C5 | D5. D5 | C5 D5 E♭5 C5 | D5 E♭5/D5 C5 B♭4 | A4.. G4 | G4. rồi D4 lấy đà (pp): khớp; dấu luyến (lấy đà–ô 2, ô 2–4, ô 4–6, ô 6–8) khớp. Tay trái giọng giữa B♭3 C4 D4 C4 | B♭3 | E♭4 C4 | B♭3 G3 | E♭4 C4 | B♭3 G3 | C4 (espressivo, khối không vẽ dấu <>; lời dẫn nói rõ) | B♭3; bè trầm G3 nối, đánh lại phách 2 ô 2, 4, 6 (ô 6 không nối sang ô 7), F♯3 D3 ô 7, G3 rồi G2 staccato ô 8: khớp. Sắc thái p, pp khớp. Số ngón là gợi ý của trang (Mutopia không ghi), chơi được (n44, n49).'
