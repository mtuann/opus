    link: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=108
  - id: kern-sonata11-3
    bac: 2
    ten: 'Craig Stuart Sapp, mozart-piano-sonatas, kern/sonata11-3.krn (theo Alte Mozart-Ausgabe; CC BY-NC-SA 4.0, chỉ dùng trên máy): ô in 1–128, ô 96 kết 1, ô 97 kết 2, coda từ ô 98'
