    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV331/KV331_3_RondoAllaTurca/KV331_3_RondoAllaTurca-a4.pdf" ]
    luot_2_ghi_chu: "Đọc ba khối ABC của trang: bài 1 tay phải !3!!2!!1!!2! quanh La, Đô, Mi, La cao; tay trái !5! ở La (ngón 2, 1 cho hợp âm chỉ ghi ở chữ); bài 2 rải 5-3-2-1 ô 1, 3 rồi nốt nhỏ {A,,C,E,} trước nốt chính ô 2, 4; bài 3 quãng tám ngón 5 phím trắng, 4 ở [cc'] (Đô♯) và [Gg] (Sol♯ theo hóa biểu La trưởng). Chất liệu khớp hình móc kép và tay trái hành khúc của bản Mutopia; ngón bấm hợp lý."
    review: dung
    nguon:
