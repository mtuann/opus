khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Nhịp lấy đà và ô 1–8, 2/4, K:Am, L:1/16. Ấn bản: artaria-1784 tr. in 22 (PDF 20) hệ 1, đọc ở 300–900 dpi, cao độ suy từ vị trí dòng kẻ đo bằng máy. Nhịp lấy đà: tay phải nốt nhỏ Si4 (không gạch), La4 móc đơn, Sol♯4 La4 móc kép (vạch thứ hai chỉ trên hai nốt cuối); tay trái lặng đen. Ô 1: Đô5 móc đơn, lặng móc đơn, nốt nhỏ Rê5, Đô5 móc đơn, Si4 Đô5 móc kép; tay trái La3 rồi ba hợp âm Đô4–Mi4 móc đơn. Ô 2: Mi5 móc đơn, lặng, nốt nhỏ Fa5, Mi5 móc đơn, Rê♯5 Mi5 móc kép; tay trái như ô 1. Ô 3: hai lần [nốt nhỏ Si5] La5 móc đơn, Sol♯5 La5 móc kép; tay trái La3 [Đô4 Mi4] La3 [Đô4 Mi4]. Ô 4: Đô6 nốt đen, La5 Đô6 móc đơn; tay trái La3 và ba hợp âm Đô4–Mi4. Ô 5: hai nốt nhỏ Sol5 (có dấu bình) La5 (ba vạch), Si5 móc đơn, quãng ba Fa♯5–La5, Mi5–Sol5, Fa♯5–La5 móc đơn; tay trái Mi3 rồi ba hợp âm Si3–Mi4. Ô 6: như ô 5 (nốt nhỏ không có dấu bình). Ô 7: như ô 5, quãng ba cuối Rê♯5–Fa♯5; tay trái Mi3 [Si3 Mi4] Si2 Si3. Ô 8: Mi5 nốt đen; tay trái Mi3 nốt đen; vạch nhắc lại. Đối chiếu Mutopia righta/lefta: cùng nốt, cùng trường độ khi chơi (Mutopia viết nốt nhỏ ở nhịp lấy đà, ô 1–3 thành móc kép thật; ô 5–7 giữ \grace { g!32 a } như bản in). Bỏ: dấu staccato, luyến, số ngón, dấu nhấn của Mutopia (không có trong bản in); một nét ngắn khó đọc ở tay trái ô 1–2 bản in (có thể là dấu luyến) không chép.'
