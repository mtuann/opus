    ghi_chu: 'Định nghĩa theo trang piano/not-hoa-my và thuat-ngu.yml (appoggiatura). Mutopia righta: h,16 a, gis, a,; kern [0]: B4 A4 G#4 A4 (bốn nốt). Nốt nhỏ không gạch trong bản quét (900 dpi). Review (Claude, 17/11/2026): Mutopia righta viết bốn móc kép; thuat-ngu.yml appoggiatura: "Nốt dựa, đúng phách, lấy bớt độ dài của nốt chính", ghi chú "Nốt nhỏ không gạch"; nốt nhỏ ở nhịp lấy đà bản quét không gạch. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsa8.htm", "https://www.mutopiaproject.org/ftp/MozartWA/KV331/KV331_3_RondoAllaTurca/KV331_3_RondoAllaTurca-a4.pdf" ]
    luot_2_ghi_chu: "Dolmetsch, mục Appoggiatura: long appoggiatura nhận trọng âm và một nửa giá trị của nốt chính (không chấm). Nốt chính La là móc đơn, nên Si–La thành hai móc kép, cộng Sol♯–La: bốn móc kép đều. Mutopia viết nhịp lấy đà là bốn móc kép h, a, gis, a,."
    review: dung
  - id: n20
    cau: 'Chỗ khó và cách tập: hình móc kép (tập chậm, ngón 3-2-1-2 hay 4-3-2-3); nốt nhỏ đúng phách; hợp âm rải tay trái (tập chậm từng nốt rồi gom lại, cổ tay xoay nhẹ); quãng tám từ cổ tay; đoạn Fa♯ thứ với máy đếm nhịp; tương phản p và f.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập thông thường, khớp các trang piano/not-hoa-my, piano/quang-tam-buoc-nhay. Ngón 4-3-2-3 khớp số ngón 4 ở Si5 của Mutopia ô 3 (h-4 a gis a). Review (Claude, 17/11/2026): Nhãn khuyen-tap đúng: không có điều về sức khỏe hay sự kiện cần nguồn.'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập phổ biến, hợp lý (tập chậm, ngón 3-2-1-2 hay 4-3-2-3 cho hình vòng quanh nốt, quãng tám từ cổ tay, máy đếm nhịp); không thấy chỗ có hại.
    review: dung
  - id: n21
    cau: 'Ba bài tập soạn cho trang này: vòng quanh nốt chính (tay phải 3-2-1-2, tay trái ngón 5 ở La, 2 và 1 ở hợp âm); tiếng trống tay trái (rải chậm 5-3-2-1 rồi thành nốt nhỏ, nốt chính đúng phách); quãng tám từ cổ tay (ngón 1 nốt dưới, 5 trên phím trắng, 4 trên phím đen Đô♯, Sol♯).'
    loai: vi-du-soan
    ket_qua: dung
    ghi_chu: 'Khuông ở khuong_nhac khối 2–4. Review (Claude, 17/11/2026): xem khuong_nhac khối 2–4. Khớp. Nguồn (người gom thêm khi khóa): bài tập dựng theo hình nốt của bài (Artaria 1784, Mutopia 108).'
