  - id: n24
    cau: 'Bản in đầu ghi p ở đầu bài và f ở đầu hành khúc; coda có một đoạn p ở giữa (ô 110–116), rồi trở lại f.'
    loai: cau-truc
    nguon: [ artaria-1784 ]
    ket_qua: da-sua
    ghi_chu: 'Bản quét tr. 22 hệ 1 (p), tr. 23 hệ 2 (f ở hành khúc thứ hai; hành khúc đầu tr. 22 hệ 3), tr. 24 hệ 3 (p), hệ 4 (f). Review (Claude, 17/11/2026): Thêm số ô cho đoạn p của coda. Bản quét tr. 22 hệ 1 p, hệ 3 f; tr. 24 hệ 3 p (ô 110), hệ 4 f (ô 117). Mutopia (dynamics, tính cả ô kết 1 dài nửa ô): \p ở đầu ô 110, \f ở đầu ô 117.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331/300i_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: "Bản quét Artaria: 'p' dưới 'Alla Turca' ở đầu bài; 'f' ở đầu hành khúc (tr. 22 hệ 3, tr. 23 hệ 2); coda tr. 24: 'p' khi tay trái sang móc kép (ô 110), 'f' trở lại (ô 117)."
    review: dung
  - id: n25
    cau: 'Gần như không cần bàn đạp: độ rõ của móc kép và độ gọn của hợp âm rải tay trái làm nên tiếng "trống" của hành khúc.'
    loai: khuyen-tap
    nguon: [ site-k331 ]
    ket_qua: dung
    ghi_chu: 'Trang nghe-nhac/mozart-k331: "Gần như không cần bàn đạp; tiếng trống của hành khúc đến từ cách nhấn phím và độ gọn của hợp âm rải." Bản in đầu không có dấu bàn đạp. Review (Claude, 17/11/2026): Bản quét không có dấu bàn đạp (tr. 22–24); khớp trang nghe-nhac/mozart-k331.'
    luot_2: dung
    luot_2_ghi_chu: "Hợp lý: bản Artaria không có ký hiệu bàn đạp; tiếng rõ, gọn là cách chơi phổ biến cho chương này."
    review: dung
  - id: n26
    cau: 'Đoạn nào cũng có dấu nhắc lại, trừ coda; chơi một mình thì tự chọn dấu nhắc lại, giữ cân đối giữa các đoạn.'
    loai: khuyen-tap
    nguon: [ artaria-1784, mutopia-108 ]
    ket_qua: dung
    ghi_chu: 'Dấu nhắc lại: như n15. Review (Claude, 17/11/2026): Dấu nhắc lại như n15; nhãn đúng.'
    review: dung
  - id: n27
    cau: 'Lỗi thường gặp: chơi quá nhanh, nốt nhỏ trước phách, tay trái nặng, hợp âm rải chậm và nốt chính trễ phách, quãng tám gắt, đoạn Fa♯ thứ nhanh dần, đoạn p sau hành khúc còn to.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
