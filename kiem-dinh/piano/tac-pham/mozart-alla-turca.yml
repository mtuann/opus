khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Nhịp lấy đà và ô 1–8, 2/4, K:Am, L:1/16. Ấn bản: artaria-1784 tr. in 22 (PDF 20) hệ 1, đọc ở 300–900 dpi, cao độ suy từ vị trí dòng kẻ đo bằng máy. Nhịp lấy đà: tay phải nốt nhỏ Si4 (không gạch), La4 móc đơn, Sol♯4 La4 móc kép (vạch thứ hai chỉ trên hai nốt cuối); tay trái lặng đen. Ô 1: Đô5 móc đơn, lặng móc đơn, nốt nhỏ Rê5, Đô5 móc đơn, Si4 Đô5 móc kép; tay trái La3 rồi ba hợp âm Đô4–Mi4 móc đơn. Ô 2: Mi5 móc đơn, lặng, nốt nhỏ Fa5, Mi5 móc đơn, Rê♯5 Mi5 móc kép; tay trái như ô 1. Ô 3: hai lần [nốt nhỏ Si5] La5 móc đơn, Sol♯5 La5 móc kép; tay trái La3 [Đô4 Mi4] La3 [Đô4 Mi4]. Ô 4: Đô6 nốt đen, La5 Đô6 móc đơn; tay trái La3 và ba hợp âm Đô4–Mi4. Ô 5: hai nốt nhỏ Sol5 (có dấu bình) La5 (ba vạch), Si5 móc đơn, quãng ba Fa♯5–La5, Mi5–Sol5, Fa♯5–La5 móc đơn; tay trái Mi3 rồi ba hợp âm Si3–Mi4. Ô 6: như ô 5 (nốt nhỏ không có dấu bình). Ô 7: như ô 5, quãng ba cuối Rê♯5–Fa♯5; tay trái Mi3 [Si3 Mi4] Si2 Si3. Ô 8: Mi5 nốt đen; tay trái Mi3 nốt đen; vạch nhắc lại. Đối chiếu Mutopia righta/lefta: cùng nốt, cùng trường độ khi chơi (Mutopia viết nốt nhỏ ở nhịp lấy đà, ô 1–3 thành móc kép thật; ô 5–7 giữ \grace { g!32 a } như bản in). Bỏ: dấu staccato, luyến, số ngón, dấu nhấn của Mutopia (không có trong bản in); một nét ngắn khó đọc ở tay trái ô 1–2 bản in (có thể là dấu luyến) không chép. Review (Claude, 17/11/2026): So lại từng nốt ở 400 dpi (tr. 22 hệ 1, hai nửa) với ABC và Mutopia righta/lefta (file .ly tải lại): nhịp lấy đà, ô 1–8 hai tay, nốt nhỏ, dấu bình ô 5, Rê♯ ô 7, tay trái Mi3/[Si3 Mi4] và Si2 Si3 ô 7, p, vạch nhắc lại: khớp, không sửa. Nét khó đọc ở tay trái ô 1–2 (sau chữ p, và trước hợp âm đầu ô 2): nét cong ngắn nối La3 với hợp âm Đô4–Mi4 đầu tiên, đúng chỗ Mutopia ghi luyến a8( <c'' e''>) ở ô 1, 2; quyết là dấu luyến. Giữ không chép, như mọi luyến và chấm ngắt khác của khối (khối chỉ chép nốt, nốt nhỏ và p).'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, La thứ: tay phải hình vòng quanh Si–La–Sol♯–La, Rê–Đô–Si–Đô, Fa–Mi–Rê♯–Mi (3-2-1-2), Si–La–Sol♯–La cao (4-3-2-3), mỗi ô kết bằng nốt đen Đô5 (3), Mi5 (4), La5 (5), Đô6 (5); tay trái La3 và hợp âm Đô4–Mi4 (La thứ). Mỗi ô 8 móc kép. Review (Claude, 17/11/2026): K:Am, 4 ô × 8 móc kép; tay phải Si–La–Sol♯–La / Rê–Đô–Si–Đô / Fa–Mi–Rê♯–Mi / Si–La–Sol♯–La cao, đúng hình ô nhịp lấy đà–3 của bài; 3-2-1-2 rồi 3 (Đô5), 4 (Mi5), 5 (La5), và 4-3-2-3 rồi 5 (Đô6): chơi được. Tay trái La3 + Đô4–Mi4 (La thứ), ô 4 La3 nốt đen; lời kèm (ngón 5, 2, 1) khớp. Đúng.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, La trưởng: tay trái rải La2–Đô♯3–Mi3–La3 móc đơn (5-3-2-1), rồi cùng các nốt thành ba nốt nhỏ trước La3 và ba La3 lặp; tương tự trên Rê (Rê2–Fa♯2–La2–Rê3). Tay phải giữ hợp âm La trưởng (La4–Đô♯5–Mi5), Rê trưởng (Fa♯4–La4–Rê5). Review (Claude, 17/11/2026): K:A; tay trái A,,=La2, C,=Đô♯3, E,=Mi3, A,=La3 (5-3-2-1 trong một quãng tám), ô 2, 4 ba nốt nhỏ rồi nốt chính và ba nốt lặp, như stra/strd của Mutopia (\grace { a,32 cis e } a8); Rê2–Fa♯2–La2–Rê3 trên Rê trưởng; tay phải La trưởng, Rê trưởng nốt trắng. Đủ phách, đúng lời kèm.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, La trưởng: quãng tám tay phải La–Si–Đô♯–Si–La–Sol♯–La (ngón 5 phím trắng, 4 phím đen Đô♯, Sol♯; ngón 1 nốt dưới ghi trong lời kèm); tay trái quãng tám La2–La3, Mi2–Mi3 tách (5, 1). Review (Claude, 17/11/2026): K:A; quãng tám La–Si–Đô♯–Si | La–Sol♯ | La, ngón 5 phím trắng, 4 ở Đô♯ và Sol♯ (phím đen theo hóa biểu); tay trái quãng tám tách La2–La3, Mi2–Mi3. Đủ phách; lời kèm (ngón 1 nốt dưới) đúng.'
