  - id: site-k331
    bac: 2
    ten: 'Trang nghe-nhac/mozart-k331 (đã khóa): Vienna những năm 1780 mê "nhạc Thổ", ban nhạc quân đội Janissary; hành khúc La trưởng, hợp âm tay trái rải thật nhanh như tiếng trống; bản in đầu ghi Allegrino, nhiều ấn bản về sau ghi Allegretto; gần như không cần bàn đạp'
    link: https://mtuann.github.io/opus/nghe-nhac/mozart-k331/
  - id: site-not-hoa-my
    bac: 2
    ten: 'Trang piano/not-hoa-my (đã khóa), mục "Appoggiatura và acciaccatura": appoggiatura (nốt dựa) rơi đúng phách và lấy thời gian của nốt chính; src/data/thuat-ngu.yml appoggiatura: "Nốt dựa, đúng phách, lấy bớt độ dài của nốt chính"; allegretto: "Hơi nhanh"'
    link: https://mtuann.github.io/opus/piano/not-hoa-my/#appoggiatura-va-acciaccatura
nhan_dinh:
  - id: n1
    cau: 'Alla turca là chương cuối (chương 3) của Sonata La trưởng K. 331 của Mozart; bản in đầu ghi Alla Turca.'
    loai: ten
    nguon: [ imslp-k331, artaria-1784 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: 3 chương, Key A, Alternative Title Alla Turca. Bản quét tr. in 22 (PDF 20) hệ 1: "Alla Turca" dưới khuông khóa Sol; đây là chương cuối của Sonata II (tr. in 24 kết bằng vạch kép).'
  - id: n2
    cau: 'Đoạn La thứ nhẹ nhàng xen với những đoạn hành khúc La trưởng mạnh mẽ, nơi tay trái bắt chước tiếng trống.'
    loai: cau-truc
    nguon: [ artaria-1784, site-k331 ]
    ket_qua: dung
    ghi_chu: 'Bản quét: đoạn La thứ p (tr. 22 hệ 1), hành khúc ba dấu thăng, f, tay trái ba nốt nhỏ rải rồi nốt chính và nốt lặp (tr. 22 hệ 3, tr. 23 hệ 2). "Bắt chước tiếng trống": trang nghe-nhac/mozart-k331 (đã khóa) viết "hợp âm tay trái rải thật nhanh như tiếng trống và chũm chọe".'
  - id: n3
    cau: 'Bài ở chặng 6 của lộ trình; cả bản sonata được giới thiệu ở hướng dẫn nghe Sonata La trưởng K. 331 trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/data/tac-pham.yml: chang 6; trang nghe-nhac/mozart-k331 có trong bản build.'
  - id: n4
    cau: 'ABRSM xếp chương này ở Grade 8, danh sách A, trong đề cương 2025–2026, yêu cầu chơi dấu nhắc lại thứ nhất, thứ ba và cuối cùng; đề cương 2027–2028 không còn bài này.'
    loai: cap-do
    nguon: [ abrsm-2025, abrsm-2027 ]
    ket_qua: dung
    ghi_chu: 'PDF 2025 & 2026 tr. 42: Grade 8, chữ A ở cột trái (danh sách A), số 1 "with first, third and final repeat". PDF 2027 & 2028: chỉ có chương 1 K. 331 (Grade 8 số 13).'
  - id: n5
    cau: 'Hình móc kép vòng quanh một nốt (Si–La–Sol♯–La) mở đầu bài.'
    loai: cau-truc
    nguon: [ artaria-1784, mutopia-108 ]
    ket_qua: dung
    ghi_chu: 'Mutopia righta: h,16 a, gis, a, (Si4 La4 Sol♯4 La4). Bản in: nốt nhỏ Si4, La4 móc đơn, Sol♯4 La4 móc kép (xem khuong_nhac khối 1).'
  - id: n6
    cau: 'Đoạn La thứ nhỏ (p); hành khúc La trưởng to (f), quãng tám tay phải, tay trái rải hợp âm nhanh: ba nốt nhỏ rồi nốt chính.'
    loai: cau-truc
    nguon: [ artaria-1784, mutopia-108 ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 22 hệ 1: p đầu bài. Tr. 23 hệ 2 (250 dpi): sau vạch nhắc lại, hai quãng tám La–Si móc đơn, f dưới khuông, Đô♯ quãng tám, rồi số 8 với đường gạch; tay trái mỗi ô bắt đầu bằng ba nốt nhỏ (La2–Đô♯3–Mi3) trước La3, rồi La3 lặp. Mutopia rightc: quãng tám <a a,> …; stra = \grace { a,32 cis e } a8.'
  - id: n7
    cau: 'Bản in đầu viết nhiều nốt hoa mỹ bằng nốt nhỏ: Si trước La ở nhịp lấy đà, Rê trước Đô ở ô 1, Fa trước Mi ở ô 2 (và Si trước La ở ô 3, hai nốt Sol–La trước Si ở ô 5–7).'
    loai: cau-truc
    nguon: [ artaria-1784 ]
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 1 (đọc ở 400–900 dpi).'
  - id: n8
    cau: 'Mozart (1756–1791). Năm viết K. 331 chưa rõ: Neue Mozart-Ausgabe đoán năm 1783, ở Vienna hay Salzburg; lời tựa của Henle (2021) cho là sớm hơn, ở Vienna.'
    loai: lich-su
    nguon: [ henle-hn1300, imslp-k331 ]
    ket_qua: dung
    ghi_chu: 'Henle lời tựa (Seiffert 2021) như nguồn; IMSLP "1783?". Năm sinh–mất theo src/data/nha-soan-nhac.yml (mozart, đã khóa). Câu cùng ý với bảng đầu trang nghe-nhac/mozart-k331 (đã khóa).'
  - id: n9
    cau: 'Nhà Artaria ở Vienna in K. 331 lần đầu khoảng năm 1784, cùng K. 330 và K. 332, trong tập Trois Sonates pour le Clavecin ou Pianoforte, Oeuvre VI; số bản in 47.'
    loai: lich-su
    nguon: [ artaria-1784, imslp-k331, henle-hn1300 ]
    ket_qua: dung
    ghi_chu: 'Bìa bản quét: "Trois Sonates pour le Clavecin ou Pianoforte composées par W. A. Mozart, Oeuvre VI", "Publiées à Vienne chez Artaria Comp.", 47. IMSLP: n.d. (ca.1784), plate 47, "Also contains K.330 and K.332". Henle: tháng 8/1784.'
  - id: n10
    cau: 'Ở bản in đầu, chương cuối ghi tốc độ Allegrino và tên Alla Turca ("kiểu Thổ Nhĩ Kỳ"); theo lời tựa của Henle, tên này có lẽ chỉ được thêm vào lúc in, do Mozart hay nhà xuất bản.'
    loai: lich-su
    nguon: [ artaria-1784, henle-hn1300 ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 22 hệ 1: "Allegrino" trên khuông, "Alla Turca" dưới khuông. Henle như nguồn. Nghĩa "kiểu Thổ Nhĩ Kỳ": trang hinh-thuc/rondo (đã khóa) gọi là thể loại alla turca, mô phỏng âm nhạc quân đội Ottoman.'
  - id: n11
    cau: 'Vienna khi ấy đang mê "nhạc Thổ", âm thanh của ban nhạc quân đội Janissary.'
    loai: lich-su
    nguon: [ site-k331, henle-hn1300 ]
    ket_qua: dung
    ghi_chu: 'Câu của trang nghe-nhac/mozart-k331 (đã khóa, đã qua hai lượt và review ở hồ sơ trang ấy); Henle nhắc "janissary stop".'
  - id: n12
    cau: 'Bản thu gợi ý: Romuald Greiss, thu năm 2000 trong một buổi hòa nhạc, trên một cây đàn năm 1850; phạm vi công cộng.'
    loai: so-lieu
    nguon: [ commons-greiss ]
    ket_qua: dung
    ghi_chu: 'Commons: Date 2000, "Nagranie z koncertu w filharmonii w Zabrzu" (bản thu từ buổi hòa nhạc ở nhà hòa nhạc Zabrze), "old Budynowicz piano from 1850", {{PD-author|Romuald Greiss}}.'
  - id: n13
    cau: 'Đàn trong bản thu nghe thấp hơn cao độ chuẩn ngày nay gần nửa cung.'
    loai: so-lieu
    nguon: [ greiss-file ]
    ket_qua: dung
    ghi_chu: 'Đo trên file gốc: các lớp cao độ mạnh nhất ở đoạn La thứ là Sol♯, Rê♯, La♯ thay cho La, Mi, Si (chroma lệch một nửa cung); pyin ở nhịp lấy đà: nốt viết Si4 vang khoảng 465 Hz (Si4 chuẩn 494), nốt viết Đô5 vang khoảng 493 Hz (Đô5 chuẩn 523); estimate_tuning +0,15 bậc so với lưới La = 440. Thấp khoảng 0,85 nửa cung (La khoảng 419 Hz). Bộ căn chỉ cho kết quả gần đúng khi hạ bản nhạc một nửa cung.'
  - id: n14
    cau: 'Người chơi trong bản thu chơi lại cả phần đầu (đoạn La thứ và hành khúc) trước khi sang đoạn Fa♯ thứ.'
    loai: so-lieu
    nguon: [ greiss-file ]
    ket_qua: dung
    ghi_chu: 'Tự tương quan chroma: chủ đề La thứ vang ở 1,0 và 35,1 s (và 6,5, 40,5 s: nhắc lại ô 1–8), phần Đô trưởng ở 12,6 và 46,6 s, hành khúc ở 24,0/29,7 và 58,3/63,9 s, Fa♯ thứ từ 69,5 s. Mỗi lần, ô 9–24 chỉ vang một lần.'
  - id: n15
    cau: 'Các đoạn và số ô (đếm như bản Mutopia, không tính nhịp lấy đà, ô kết 1 và kết 2 của hành khúc cuối tính là hai ô): đoạn La thứ ô 1–24 (ô 1–8 chủ đề; ô 9–24 sáng lên ở Đô trưởng rồi chủ đề trở lại), hành khúc La trưởng 25–32, đoạn Fa♯ thứ 33–56, hành khúc 57–64, đoạn La thứ 65–88 (như ô 1–24), hành khúc 89–97 có kết 1 và kết 2, coda 98–128; đoạn nào cũng có dấu nhắc lại, trừ coda.'
    loai: cau-truc
    nguon: [ artaria-1784, mutopia-108, kern-sonata11-3 ]
    ket_qua: dung
    ghi_chu: 'Kern: [1]–[24], [25]–[32] (La trưởng), [33]–[56], [57]–[64], [65]–[88], [89]–[95] + [96] kết 1 + [97] kết 2, [98]–[128]; Mutopia \barNumberCheck #98 ở đầu coda, các \repeat volta trong right/left. Bản quét (90–250 dpi): vạch nhắc lại sau ô 8 (tr. 22 hệ 1), sau ô 24 (hệ 3), sau hành khúc (hệ 4), đoạn Fa♯ thứ kết bằng vạch nhắc lại ở tr. 23 hệ 2, hành khúc thứ hai ở tr. 23 hệ 2–3, đoạn La thứ trở lại tr. 23 hệ 3–5 (vạch nhắc lại ở hệ 4 và cuối hệ 5), hành khúc cuối tr. 24 hệ 1–2 có kết "1", "2" rồi chữ "Coda"; coda không có vạch nhắc lại. Ô 9 mở bằng quãng ba Đô5–Mi5, Rê5–Fa5 (lấy đà) rồi Mi5–Sol5 trên Đô3 (Đô trưởng). Lượt 1 không đếm từng ô trên bản quét; số ô theo kern và Mutopia, nội dung từng đoạn đối chiếu bản quét.'
  - id: n16
    cau: 'Đoạn Fa♯ thứ (p): dòng móc kép chạy liên tục ở tay phải, tay trái đệm móc đơn.'
    loai: cau-truc
    nguon: [ artaria-1784, mutopia-108 ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 22 hệ 4–5, tr. 23 hệ 1–2: ba dấu thăng, p, tay phải móc kép, tay trái nốt trầm rồi hợp âm móc đơn. Mutopia rightd, leftd (fis8 <a cis> …).'
  - id: n17
    cau: 'Coda (từ ô 98, f): La trưởng, hợp âm tay phải, tay trái rải hợp âm và nốt lặp; giữa coda một đoạn p, tay trái rải hợp âm móc kép liên tục, tay phải hợp âm có nốt hoa mỹ; rồi trở lại f.'
