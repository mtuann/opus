    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20%26%202026%20Prac%20syllabus%2020240524_access.pdf", "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20%26%202028.pdf" ]
    luot_2_ghi_chu: "Đề cương 2025–2026, tr. 42 (PDF tr. 43): Grade 8, danh sách A số 1: Mozart 'Alla Turca (3rd movt from Sonata in A, K. 331) with first, third and final repeat'. Đề cương 2027–2028: cả file không có chữ 'Turca'; K. 331 chỉ còn chương 1 (Andante grazioso và Vars. 1–6) ở Grade 8 danh sách A."
    review: dung
  - id: n5
    cau: 'Hình móc kép vòng quanh một nốt (Si–La–Sol♯–La) mở đầu bài.'
    loai: cau-truc
    nguon: [ artaria-1784, mutopia-108 ]
    ket_qua: dung
    ghi_chu: 'Mutopia righta: h,16 a, gis, a, (Si4 La4 Sol♯4 La4). Bản in: nốt nhỏ Si4, La4 móc đơn, Sol♯4 La4 móc kép (xem khuong_nhac khối 1). Review (Claude, 17/11/2026): Mutopia KV331_3_RondoAllaTurcaNotes.ly (tải lại từ GitHub MutopiaProject, nhánh master) righta: h,16 a, gis, a, (transpose c c''''): Si4 La4 Sol♯4 La4. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV331/KV331_3_RondoAllaTurca/KV331_3_RondoAllaTurca-a4.pdf" ]
    luot_2_ghi_chu: "Mutopia (PDF và file .ly): nhịp lấy đà h, a, gis, a, (Si–La–Sol♯–La móc kép). Bản Artaria viết Si thành nốt nhỏ trước La móc đơn, Sol♯–La móc kép."
    review: dung
  - id: n6
    cau: 'Đoạn La thứ nhỏ (p); hành khúc La trưởng to (f), quãng tám tay phải, tay trái rải hợp âm nhanh: ba nốt nhỏ rồi nốt chính.'
    loai: cau-truc
    nguon: [ artaria-1784, mutopia-108 ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 22 hệ 1: p đầu bài. Tr. 23 hệ 2 (250 dpi): sau vạch nhắc lại, hai quãng tám La–Si móc đơn, f dưới khuông, Đô♯ quãng tám, rồi số 8 với đường gạch; tay trái mỗi ô bắt đầu bằng ba nốt nhỏ (La2–Đô♯3–Mi3) trước La3, rồi La3 lặp. Mutopia rightc: quãng tám <a a,> …; stra = \grace { a,32 cis e } a8. Review (Claude, 17/11/2026): bản quét tr. 22 hệ 1 "P" dưới "Alla Turca"; hệ 3 "f" ở tay trái đầu hành khúc, tay trái ba nốt nhỏ rồi nốt chính; quãng tám tay phải ghi bằng số 8 và đường gạch (Mutopia rightc viết thẳng quãng tám). Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331/300i_(Mozart,_Wolfgang_Amadeus)", "https://www.mutopiaproject.org/ftp/MozartWA/KV331/KV331_3_RondoAllaTurca/KV331_3_RondoAllaTurca-a4.pdf" ]
    luot_2_ghi_chu: "Bản quét Artaria tr. 22: 'p' ở đầu bài; 'f' ở đầu hành khúc (sau dấu nhắc lại, ô 25); tay phải quãng tám, tay trái ba nốt nhỏ rồi nốt chính. Mutopia: ba nốt hoa mỹ móc ba rồi nốt chính, tay phải quãng tám (rightc trong file .ly)."
    review: dung
  - id: n7
    cau: 'Bản in đầu viết nhiều nốt hoa mỹ bằng nốt nhỏ: Si trước La ở nhịp lấy đà, Rê trước Đô ở ô 1, Fa trước Mi ở ô 2 (và Si trước La ở ô 3, hai nốt Sol–La trước Si ở ô 5–7).'
