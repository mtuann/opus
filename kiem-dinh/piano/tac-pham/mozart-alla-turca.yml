  - id: henle-hn1300
    bac: 2
    ten: 'G. Henle Verlag, HN 1300, lời tựa (Wolf-Dieter Seiffert, 2021; PDF): NMA (Plath/Rehm) "most probably composed in the year 1783 (in Vienna or Salzburg)", Seiffert cho là sớm hơn, ở Vienna; in "in August 1784 from the Viennese publishing house Artaria, along with … K. 330 … and … K. 332"; "Alla Turca" "apparently not added to the unusual tempo marking Allegrino (which appears in the copy and first edition) until printing of the first edition, either by Mozart or his publisher"; "janissary stop" (trích theo hồ sơ nghe-nhac/mozart-k331, nguồn henle-hn1300; lượt 1 không đọc lại PDF)'
    link: https://www.henle.de/media/a0/fe/38/1697725845/1300-1697725845-sync.pdf
  - id: henle-hn1300p
    bac: 2
    ten: 'G. Henle Verlag, HN 1300 (trang sản phẩm, tải 17/11/2026): "Piano Sonata (Alla Turca) A major K. 331 (300i) 6 medium ABRSM: Piano Grade 8"'
    link: https://www.henle.de/en/Piano-Sonata-A-major-K.-331-Alla-Turca/HN-1300
  - id: abrsm-2025
    bac: 2
    ten: 'ABRSM, Piano Practical Grades 2025 & 2026 (PDF), tr. 42 (trang PDF 43), GRADE 8, danh sách A số 1: "Mozart Alla Turca (3rd movt from Sonata in A, K. 331) with first, third and final repeat", Piano Exam Pieces 2025 & 2026, Grade 8 (ABRSM), nhãn NEW'
    link: https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20%26%202026%20Prac%20syllabus%2020240524_access.pdf
  - id: abrsm-2027
    bac: 2
    ten: 'ABRSM, Piano Practical Grades Qualification Specification 2027 & 2028 (PDF, tải 17/11/2026): tìm "331" và "Turca" chỉ thấy Grade 8 số 13 "Andante grazioso and Vars. 1–6 (1st movt from Sonata in A, K. 331)"; không có Alla Turca'
    link: https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20%26%202028.pdf
  - id: commons-greiss
    bac: 1
    ten: 'Wikimedia Commons, File:Mozart-Marsz turecki-(Romuald Greiss).ogg (trang mô tả, đọc 17/11/2026): "Rondo alla turca (KV 331, 3. Movement) performed by Romuald Greiss on old Budynowicz piano from 1850"; tiếng Ba Lan: "Nagranie z koncertu w filharmonii w Zabrzu"; Date=2000; {{PD-author|Romuald Greiss}}, PermissionTicket 2007081710004688'
