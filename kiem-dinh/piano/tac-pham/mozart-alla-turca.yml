nhan_dinh:
  - id: n1
    cau: 'Alla turca là chương cuối (chương 3) của Sonata La trưởng K. 331 của Mozart; bản in đầu ghi Alla Turca.'
    loai: ten
    nguon: [ imslp-k331, artaria-1784 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: 3 chương, Key A, Alternative Title Alla Turca. Bản quét tr. in 22 (PDF 20) hệ 1: "Alla Turca" dưới khuông khóa Sol; đây là chương cuối của Sonata II (tr. in 24 kết bằng vạch kép). Review (Claude, 17/11/2026): bản quét tr. 22 (PDF 20) hệ 1: "Allegrino", "Alla Turca"; tr. 24 hệ 5 kết bằng vạch kép. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331/300i_(Mozart,_Wolfgang_Amadeus)", "https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331/300i_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: "IMSLP (wikitext): K.331, 3 chương, chương 3 'Alla Turca'. Bản quét Artaria (IMSLP292670, đã xem trang 22 của bản in): đầu chương ghi 'Allegrino' và 'Alla Turca'."
    review: dung
  - id: n2
    cau: 'Đoạn La thứ nhẹ nhàng xen với những đoạn hành khúc La trưởng mạnh mẽ, nơi tay trái bắt chước tiếng trống.'
    loai: cau-truc
    nguon: [ artaria-1784, site-k331 ]
    ket_qua: dung
    ghi_chu: 'Bản quét: đoạn La thứ p (tr. 22 hệ 1), hành khúc ba dấu thăng, f, tay trái ba nốt nhỏ rải rồi nốt chính và nốt lặp (tr. 22 hệ 3, tr. 23 hệ 2). "Bắt chước tiếng trống": trang nghe-nhac/mozart-k331 (đã khóa) viết "hợp âm tay trái rải thật nhanh như tiếng trống và chũm chọe".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=108", "https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331/300i_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: "Bản Artaria và PDF Mutopia: đoạn La thứ p; các đoạn hành khúc La trưởng f, tay trái rải hợp âm nhanh (nốt nhỏ) rồi nốt lặp. Lời tựa Henle HN 1300 (2021) nói tới hiệu ứng 'janissary' của Rondo."
    review: dung
  - id: n3
    cau: 'Bài ở chặng 6 của lộ trình; cả bản sonata được giới thiệu ở hướng dẫn nghe Sonata La trưởng K. 331 trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/data/tac-pham.yml: chang 6; trang nghe-nhac/mozart-k331 có trong bản build. Review (Claude, 17/11/2026): tac-pham.yml chang: 6; trang link tay sang nghe-nhac/mozart-k331 ở mở đầu, Bối cảnh và Học tiếp (bản ghi chưa có cap, xem hồ sơ bản ghi); trang đích có trong bản xem.'
    review: dung
  - id: n4
    cau: 'ABRSM xếp chương này ở Grade 8, danh sách A, trong đề cương 2025–2026, yêu cầu chơi dấu nhắc lại thứ nhất, thứ ba và cuối cùng; đề cương 2027–2028 không còn bài này.'
    loai: cap-do
    nguon: [ abrsm-2025, abrsm-2027 ]
    ket_qua: dung
    ghi_chu: 'PDF 2025 & 2026 tr. 42: Grade 8, chữ A ở cột trái (danh sách A), số 1 "with first, third and final repeat". PDF 2027 & 2028: chỉ có chương 1 K. 331 (Grade 8 số 13).'
