    loai: so-lieu
    nguon: [ artaria-1784, henle-hn1300, mutopia-108, site-k331 ]
    ket_qua: dung
    ghi_chu: 'Bản quét: "Allegrino". Henle: "the unusual tempo marking Allegrino". Mutopia piece "Allegretto"; thuat-ngu.yml allegretto: Hơi nhanh. Câu cùng ý với trang nghe-nhac/mozart-k331. Review (Claude, 17/11/2026): lời tựa Henle (PDF): "the unusual tempo marking Allegrino"; Mutopia: piece "Allegretto" (file .ly header); thuat-ngu.yml allegretto "Hơi nhanh", presto "Rất nhanh". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/a0/fe/38/1697725845/1300-1697725845-sync.pdf", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=108" ]
    luot_2_ghi_chu: "Lời tựa Henle: 'the unusual tempo marking Allegrino (which appears in the copy and first edition)'. Bản Mutopia (theo nguồn IMSLP) ghi 'Allegretto'; IMSLP có bản thu tên '03_Allegretto_alla_turca'. Không nguồn nào ghi Presto."
