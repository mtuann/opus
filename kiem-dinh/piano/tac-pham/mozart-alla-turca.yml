ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 9). Nốt nhạc và chữ chỉ dẫn chép từ bản quét bản in đầu Artaria (IMSLP #292670, PDF 40 trang; chương 3 ở trang PDF 20–22, số trang in 22–24); đọc ở 90–900 dpi, đo vị trí dòng kẻ bằng tổng điểm đen theo hàng (ảnh 400 dpi của hệ 1: dòng kẻ khóa Sol ở y ≈ 120/152/182/212/244, khóa Fa ở y ≈ 383/413/443/474/506) rồi suy cao độ. Đối chiếu: Mutopia KV331_3_RondoAllaTurca (Mutopia-2015/08/13-108, phạm vi công cộng, nguồn ghi "IMSLP"; file .ly ghim commit 2144afd của MutopiaProject) và kern sonata11-3.krn (Craig Sapp, theo Alte Mozart-Ausgabe; chỉ dùng trên máy để đánh số ô và căn mốc). Mốc: bộ căn tools/audio/align (kern, đối chiếu Mutopia; cấu hình tạm ngoài repo vì pieces.py ngoài phạm vi nhánh) không ổn định, kể cả khi hạ bản nhạc một nửa cung cho khớp đàn và neo nốt cuối ở 163,9 s; nên đo tay: tự tương quan chroma của bản thu (librosa chroma_cqt, hop 1024: chủ đề ở 1,0/6,5/35,1/40,5/104,4/109,9 s; phần Đô trưởng 12,6/46,6/116,0 s; hành khúc 24,0/29,7/58,3/63,9/93,1/98,9/129,3/135,0 s; Fa♯ thứ 69,5/75,1 s; coda 141,0 s), khởi âm (librosa onset_detect) và độ to, cộng số ô (một ô khoảng 0,69 s). Mốc 1: nốt đầu 1,0 s; 12: hai quãng ba lấy đà của ô 9 ở 12,10/12,27 s; 24: hai quãng tám lấy đà f ở 23,55/23,77 s; 69: lấy đà p của đoạn Fa♯ thứ 69,32 s; 93: lấy đà f 92,67 s; 104: chủ đề trở lại 104,4 s; 129: lấy đà khoảng 128,85 s (tính từ độ lệch của hành khúc đầu); 140: kết 2 (hợp âm f) 139,9 s, coda (ô 98) khoảng 140,4 s; 149: đoạn p giữa coda ước theo số ô từ ô 98 (12 ô) và độ to giảm, có thể lệch một giây. Nhạc từ 1,0 s tới hợp âm cuối khoảng 163,9 s, sau đó là tiếng vỗ tay. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/mozart-alla-turca. Không tính là nhận định: tiêu đề mục, tiêu đề cột, mốc trong ::khoi-nghe (cách đo ghi ở đây), câu hỏi để nghe. Review (Claude, 17/11/2026): đo lại mốc trên mp3 Commons (tải lại; librosa onset, chroma, RMS, cửa sổ 0,5 s; bản thu thấp gần nửa cung nên La trưởng nghe thành Sol♯–Đô–Rê♯): 1 (nốt đầu 0,94–1,07 s), 12 (12,10), 24 (23,55), 69 (69,32), 93 (92,67), 104 (104,0), 129 (ô 89 ở 129,18, nhịp lấy đà nhỏ ngay trước), 140 (ô 98 ở 140,33) khớp. Mốc 149 sửa thành 150: ô 109 (hợp âm Mi trưởng có nốt nhỏ, f) vang tới khoảng 149,4 s; ô 110 (La trưởng, tay trái móc kép, p) vào ở 149,79 s, độ to giảm từ -25 dB còn -29 đến -33 dB ở 150–151 s. Ghi bằng attach.py --ref.'
