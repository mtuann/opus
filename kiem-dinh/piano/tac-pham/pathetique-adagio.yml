  - id: n73
    cau: Ở chủ đề, dấu luyến thường nối qua hai ô; ở đoạn B, dấu luyến ngắn hơn, mỗi dấu luyến gọn trong một ô; có chấm staccato ở đoạn C và coda.
    loai: cau-truc
    nguon: *id001
    ket_qua: da-sua
    ghi_chu: "Luyến dài ô 1–2, 3–4 (\"( … )\" qua 2 ô); ô 7 c16^.( bes^. as^. g)^.; coda ô 66–70 các nốt -. trong chùm ba. Review D6-L5-gom: lượt 2 khong-chac: đoạn B (ô 17–28) không có chấm staccato (Peters, Bülow); có ở ô 7, 15, 35 (cuối câu chủ đề), đoạn C (ô 42–44) và coda. Ý độ dài dấu luyến chưa có nguồn: review đọc lại pathetique-2.ly (Mutopia, Peters 1910; tải 05/11/2026): tay phải ô 1–2, 4–5, 6–7 luyến qua hai ô; ô 17–22, 25–26 các dấu luyến nằm gọn trong một ô. Viết lại theo đó (doi_chu). Vế dấu luyến là chữ mới: lượt 2 bổ sung. Chữ câu cũ: \"Dấu luyến của Beethoven thường dài hơn ở giai điệu và ngắn ở các mảnh đối đáp; có chấm staccato trong đoạn B và coda.\". Kết quả lượt 2 cũ (gỡ để vào lượt 2 bổ sung): khong-chac; nguồn ['https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-2/pathetique-2.ly', 'https://archive.org/details/b10332741']; ghi chú: Có chấm staccato ở coda (ô 66–68) và ở đoạn C (ô 42–44), nốt dẫn cuối ô 8; nhưng ở đoạn B (ô 17–28) bản Peters và bản Bülow đều không thấy chấm staccato. Ý về độ dài dấu luyến là nhận xét chung, chưa có nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=295", "https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-2/pathetique-2-a4.pdf", "https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-2/pathetique-2.ly" ]
    luot_2_ghi_chu: "Mutopia 295 (nguồn Berners 1908, Winterberger; Peters 1910), đọc nguồn LilyPond sinh ra PDF. Chủ đề ô 1–8: luyến c–bes | es–des nối ô 1–2, ô 4–5 (es–e | f), ô 5–7 (bes–…–des) qua ô; ô 3 gọn trong ô. Đoạn B (ô 17–28, Fa thứ): mọi dấu luyến tay phải gọn trong một ô (như 'c16( as' g f)' ô 17–19, ô 20–23, 26). Chấm staccato có ở đoạn C (ô 37–50: hợp âm ba ô 42–43 có '-.', bè giữa 47–50) và coda (ô 66–73). Lưu ý: chủ đề ô 7 và 15 cũng có chấm dưới luyến (c16 bes as g), và nhạc đệm chùm ba ở A' (ô 51–66) có chấm: câu không nói 'chỉ', nên vẫn đúng. Đây là ấn bản có hiệu đính (phrasing của Winterberger chỉ chép một phần), không phải Urtext; bản Breitkopf Gesamtausgabe trên IMSLP không tải được bằng công cụ."
