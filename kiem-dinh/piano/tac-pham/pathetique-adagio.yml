    moi: Hòa âm đổi mỗi phách hoặc nửa phách; giai điệu phần lớn đi bậc, có vài bước nhảy
    ly_do: 'n52 (review D6-L5-gom): giai điệu có bước nhảy ở ô 2–4 (lượt 2).'
  - cu: 'Tôn trọng dấu luyến của Beethoven: chúng thường dài hơn ở giai điệu và ngắn ở các mảnh đối đáp. Nốt cuối của dấu luyến nhẹ hơn. Các nốt có chấm staccato trong đoạn B và coda vẫn mềm, như những giọt nước.'
    moi: 'Tôn trọng dấu luyến của Beethoven: ở chủ đề, dấu luyến thường nối qua hai ô; ở đoạn B, dấu luyến ngắn hơn, mỗi dấu luyến gọn trong một ô. Nốt cuối của dấu luyến nhẹ hơn. Các nốt có chấm staccato trong đoạn C và coda vẫn mềm, như những giọt nước.'
    ly_do: 'n73 (review D6-L5-gom): đoạn B không có chấm staccato, đoạn C có (ô 42–44; lượt 2); độ dài dấu luyến viết theo bản Peters (Mutopia).'
  - cu: Các bản thế kỷ 19 (như của Hans von Bülow) thêm nhiều sắc thái, bàn đạp và thay đổi dấu luyến. Dùng bản Urtext để biết đâu là của Beethoven; nếu muốn có gợi ý ngón bấm và giải thích, ấn bản ABRSM của Barry Cooper ghi rõ phần nào là của người biên tập.
    moi: Các bản thế kỷ 19 (như của Hans von Bülow) thêm nhiều sắc thái, bàn đạp và thay đổi dấu luyến. Dùng bản Urtext để biết đâu là của Beethoven; nếu muốn có lời bình về nguồn và cách chơi, có ấn bản ABRSM The 35 Piano Sonatas do Barry Cooper biên tập.
    ly_do: 'n80 (review D6-L5-gom): bỏ hai vế chưa có nguồn (ngón bấm, ghi rõ phần của người biên tập); giữ điều lượt 2 kiểm được (Forsyths).'
