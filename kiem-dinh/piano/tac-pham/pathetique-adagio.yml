  loai: nam
  nguon: [hyperion-hewitt]
  ket_qua: dung
  ghi_chu: 'Hewitt: "When he went there in 1792". Chữ "(1792)" thêm ở lượt này.'
- id: n13
  cau: Lúc ấy ông đã nổi tiếng như một nghệ sĩ piano, nhất là tài ứng tác.
  loai: lich-su
  nguon: [beethoven-haus-pianist]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "lúc ông nổi tiếng như một nghệ sĩ piano biểu diễn ngẫu hứng hơn là một nhà soạn nhạc". Beethoven-Haus: "Beethoven''s fame as a pianist was in part due to ... his talent for improvisation"; không nguồn nào đã mở so sánh hơn kém với danh tiếng nhà soạn nhạc (như D6-L3 bỏ "được biết đến trước hết như nghệ sĩ piano" ở beethoven-op49-2).'
- id: n14
  cau: Tên Grande Sonate pathétique có ngay trên bản in đầu tiên năm 1799.
  loai: ten
  nguon: [henle-hn1348-vorwort, beethoven-haus-op13, imslp-op13]
  ket_qua: dung
  ghi_chu: 'Henle: nguồn duy nhất là bản in gốc 1799; Beethoven-Haus: "op. 13 has always been the Pathétique ... Beethoven himself gave it the title".'
- id: n15
  cau: Link hướng dẫn nghe (/opus/nghe-nhac/beethoven-pathetique/) cho chuyện cái tên.
  loai: ve-site
  nguon: []
  ket_qua: dung
  ghi_chu: Trang có (cùng lô); mục "Ai đặt tên Pathétique?".
- id: n16
  cau: '"Pathétique" ở đây gần nghĩa "đầy xúc động, bi tráng", không phải "thảm hại".'
  loai: dinh-nghia
  nguon: [hyperion-hewitt, henle-hn1348-vorwort]
  ket_qua: dung
  ghi_chu: 'Hewitt: nghĩa hiện đại "pitiable" chỉ dùng đùa; "the expression of exalted passion" (Behrend). Henle: "pronounced passionate character".'
