ghi_chu: 'Bài học Pathétique chương 2 (tầng Tác phẩm). Bản nhạc: Mutopia pathetique-2 (Berners 1908, Winterberger; Köhler & Ruthardt, Peters 1910), tải .ly và .mid 05/11/2026 với User-Agent opus-kiem-dinh; script Python (mido) in nốt theo ô: 73 ô 2/4; mọi số ô trên trang khớp (A 1–16, B 17–28, A 29–36, C 37–50 với Mi trưởng ô 42–47, bảy giảm ô 48–49, Mi♭7 ô 50, A 51–66 với ô 59 lên quãng tám, coda 66–73). Mốc ::khoi-nghe "1 45 88 155 198 222 259 297 330" (9 mốc / 9 dòng), bản thu Daniel Veesey (Commons, CC0, 380,54 s). Theo tools/audio/align/pieces.py mốc là ô 1, 9, 17, 29 (đo tay 154,5 s), 37, 43, 51, 59, 66: khớp các dòng bảng; dòng "Mi trưởng bất ngờ" đặt ở ô 43 (hợp âm Mi trưởng), trong khi Si7 và nốt sf đầu tiên ở ô 42, lệch một ô (khoảng 5 s), vẫn trong đoạn ấy. Không nghe lại bản thu. Thuật ngữ trang dùng (cantabile, chùm ba, láy quanh, enharmonic, staccato, legato, sf, rondo) có trong src/data/thuat-ngu.yml. Câu ve-site ở hồ sơ khác: piano/not-lap-not-kep n18 (đoạn C ô 37–50 có giai điệu và nốt lặp cùng một tay) và n43 (ô 17–28 tay trái, ô 37–50 tay phải): đúng theo bản nhạc, trang giữ số ô ấy. piano/tac-pham/beethoven-op49-2 n105, fur-elise n79 (link tới trang này): trang có. piano/nha-soan-nhac n57 (chặng 6): đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Giữ hai mục doi_chu của D2-0 ở đầu danh sách doi_chu.'
