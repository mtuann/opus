- id: n6
  cau: 'Chủ đề vang lên ba lần (ô 1, 29, 51), kết cấu đổi dần: lần đầu được nhắc lại cao hơn một quãng tám với phần đệm dày hơn; lần cuối phần đệm chuyển sang chùm ba.'
  loai: cau-truc
  nguon: *id001
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chủ đề quay lại ba lần, mỗi lần một kết cấu khác." Chủ đề có ba lần (ô 1, 29, 51), tức chỉ quay lại hai lần; lần ô 29 cùng kết cấu với ô 1–8. Chữ mới theo bản nhạc (như D6-L3 sửa "quay lại ba lần" thành "vang lên ba lần" ở fur-elise).'
- id: n7
