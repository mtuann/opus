khuong_nhac:
- khoi: 1
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, hop-am, so-ngon, sac-thai]
  ket_qua: dung
  ghi_chu: La♭ trưởng, 2/4, L:1/16, 4 ô đủ 8 phần. Giai điệu nốt đen (Đô5–Si♭4, Mi♭5–Rê♭5, Đô5–Si♭4, La♭4) ngón 5-4, 5-4, 4-3, 3 ở bè trên; móc kép E♭–A♭, G–B♭… ngón 1–2 ở bè dưới; tay trái La♭2, Sol2, Mi♭2, Đô3, quãng tám La♭. Hòa âm La♭ – Mi♭7 luân phiên; mf/pp/p đúng ba mức lời dẫn. Chơi được.
- khoi: 2
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, so-ngon]
  ket_qua: dung
  ghi_chu: 4 ô 2/4. Ô 1 Đô5 nối, ngón 5 → 4; ô 2 Rê♭5 nối, 5 → 3; ô 3 Mi♭5 (4) rồi Fa5 (5); đệm móc kép ngón 1–2. Tay trái La♭, Rê♭, Mi♭. Đúng lời dẫn (đổi ngón trên phím đang giữ).
- khoi: 3
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, hop-am, ban-dap, so-ngon]
  ket_qua: dung
  ghi_chu: 4 ô 2/4. Tay trái hợp âm rải móc kép (La♭, Mi♭7/Sol, Fa thứ, Si♭ thứ/Rê♭, Mi♭, Mi♭7, La♭); "Ped." đặt trước nốt thứ hai mỗi hòa âm; nửa sau ô 3 (Mi♭ Si♭ Rê♭ Si♭) cùng hòa âm Mi♭, không đổi bàn đạp. Đúng lời dẫn. Ngón 5-2-1-2 chơi được.
