  - cu: Chủ đề quay lại ba lần, mỗi lần một kết cấu khác. Bạn học cách giữ cùng một giai điệu đẹp trong ba hoàn cảnh khác nhau.
    moi: Chủ đề vang lên ba lần, kết cấu đổi dần. Lần đầu, chủ đề được nhắc lại cao hơn một quãng tám với phần đệm dày hơn; lần cuối, phần đệm chuyển sang chùm ba. Bạn học cách giữ cùng một giai điệu đẹp trong ba hoàn cảnh khác nhau.
    ly_do: 'n6 (da-sua): chủ đề có ba lần (ô 1, 29, 51), chỉ quay lại hai lần; lần ô 29 cùng kết cấu ô 1–8 (Mutopia).'
  - cu: Beethoven viết Pathétique khi khoảng 27 tuổi, vài năm sau khi đến Vienna, lúc ông nổi tiếng như một nghệ sĩ piano biểu diễn ngẫu hứng hơn là một nhà soạn nhạc. Tên Grande Sonate pathétique có ngay trên bản in đầu tiên năm 1799 (chuyện cái tên ở hướng dẫn nghe); "pathétique" ở đây gần nghĩa với "đầy xúc động, bi tráng", không phải "thảm hại".
    moi: Beethoven viết Pathétique khi khoảng 27 tuổi, vài năm sau khi đến Vienna (1792), lúc ông đã nổi tiếng như một nghệ sĩ piano, nhất là tài ứng tác. Tên Grande Sonate pathétique có ngay trên bản in đầu tiên năm 1799 (chuyện cái tên ở hướng dẫn nghe); "pathétique" ở đây gần nghĩa với "đầy xúc động, bi tráng", không phải "thảm hại".
    ly_do: 'n13 (da-sua): Beethoven-Haus nói danh tiếng nghệ sĩ piano nhờ tài ứng tác; vế so sánh với danh tiếng nhà soạn nhạc không nguồn. Thêm năm 1792 (Hewitt, Hyperion).'
  - cu: 'Đây là một rondo nhỏ: chủ đề A quay lại ba lần, xen giữa là hai đoạn tương phản.'
    moi: 'Đây là một rondo nhỏ: chủ đề A vang lên ba lần, xen giữa là hai đoạn tương phản.'
    ly_do: 'n37 (da-sua): A có ba lần nên "quay lại ba lần" sai.'
  - cu: Đàn của Beethoven năm 1798 có tiếng tắt nhanh hơn đàn hiện đại. Trên đàn hiện đại, đạp nông và đổi theo hòa âm, thường mỗi phách hoặc nửa phách. Giai điệu phải liền nhờ ngón tay trước, bàn đạp chỉ thêm độ ấm. Xem Bàn đạp.
    moi: Trên đàn hiện đại, đạp nông và đổi theo hòa âm, thường mỗi phách hoặc nửa phách. Giai điệu phải liền nhờ ngón tay trước, bàn đạp chỉ thêm độ ấm. Xem Bàn đạp.
