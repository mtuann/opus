ghi_chu: 'Bài học Op. 49 số 2, chương 1 (tầng Tác phẩm). Bản nhạc: Mutopia LVB_Sonate_49no2_1 (Breitkopf & Härtel 1862–1865; .ly, .mid tải 05/11/2026, User-Agent opus-kiem-dinh), đếm ô và đối chiếu bằng script Python (mido): 122 ô, mọi số ô trên trang khớp. Lịch sử: lời giới thiệu Henle HN 1327 (PDF), IMSLP. Sửa trang: n2, n12, n18, n19, n20, n23, n24, n25, n33, n48, n66, n83, n101, n102, n109; bỏ: n112 (hai sách in chưa đọc ở mục Nguồn). Còn mở: n87 ("ma non troppo" chưa có nguồn đã mở). Giữ cho hồ sơ khác: hình đệm nốt lặp ô 6–8, 21–24 (và 29–32), nốt lặp ô 59–62, quãng ba ngân ô 44–48 (piano/not-lap-not-kep n41), đoạn chuyển ô 15–19 có bước nhảy Fa♯4–La5 (piano/quang-tam-buoc-nhay n37, n45): đã đếm trên bản nhạc, đúng. hinh-thuc/sonata n13: trang có cấu trúc từng ô, chỗ khó, kế hoạch tập. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ trang dùng (chùm ba, láy rền, láy quanh, staccato, alla breve, Alberti) có trong src/data/thuat-ngu.yml hay trang đã khóa.'
