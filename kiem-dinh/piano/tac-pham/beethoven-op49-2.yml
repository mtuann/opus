doi_chu:
  - cu: 'Đây là chương sonata thật đầu tiên mà nhiều người học có thể chơi trọn: 122 ô nhịp, đủ trình bày, phát triển và tái hiện, không chỗ nào đòi sức mạnh hay tốc độ ghê gớm. Trang này hướng dẫn tập chương 1 (Allegro, ma non troppo) để bạn nghe hình thức sonata từ bên trong: lúc nào nhạc rời nhà, đi đâu, và trở về bằng cách nào.'
    moi: 'Đây là một chương sonata trọn vẹn mà bản in đầu tiên gọi là "sonata dễ": 122 ô nhịp, đủ trình bày, phát triển và tái hiện, không chỗ nào đòi sức mạnh hay tốc độ ghê gớm. Trang này hướng dẫn tập chương 1 (Allegro, ma non troppo) để bạn nghe hình thức sonata từ bên trong: lúc nào nhạc rời nhà, đi đâu, và trở về bằng cách nào.'
    ly_do: 'n2 (da-sua): "đầu tiên", "nhiều người học" không kiểm được; Henle HN 1327: bản in đầu tên "Deux Sonates faciles".'
  - cu: Viết khoảng 1796–1798, cùng thời với ba sonata Op. 10 (theo Henle); in năm 1805 ở Vienna cùng sonata Op. 49 số 1, với tên Sonates faciles ("những sonata dễ")
    moi: Có lẽ viết năm 1796 (số 1 năm 1797/98), gần cùng thời với ba sonata Op. 10 (theo Henle); in năm 1805 ở Vienna cùng sonata Op. 49 số 1, với tên Sonates faciles ("những sonata dễ")
    ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-A.yml, nhận định n17 của hồ sơ bản ghi: Bản ghi là số 2; Henle: số 2 có lẽ năm 1796 (IMSLP: 1795–96). Trang đã sửa theo (hồ sơ trang). Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang.'
  - cu: Khoảng ABRSM Grade 5 (ước lượng; chặng 4 của site); Henle xếp mức 3 (dễ) trên thang 1–9
    moi: "RCM xếp chương 1 và 2 ở Level 8 (đề cương 2022); Henle xếp mức 3 (dễ) trên thang 1–9"
    ly_do: "Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-A.yml, nhận định n22 của hồ sơ bản ghi: Bài có trong đề cương RCM 2022 (Level 8 List B, tr. 73): ghi kỳ đề cương thay \"(ước lượng)\". Grade đã khóa không đổi. Nếu người giao muốn giữ \"(ước lượng)\" vì không có trong ABRSM, Trinity thì viết \"(ước lượng; không có trong đề cương ABRSM, Trinity)\". Review D6-L3-gom: Bỏ \"Khoảng ABRSM Grade 5 (chặng 4 của site);\" (ước lượng, không đề cương ABRSM nào xếp bài; hồ sơ bản ghi n22)."
  - cu: Tay trái nhiều vai. Một bè trầm đi từng bước (ô 2–4), hình đệm nốt lặp (ô 6–8, 21–24), hợp âm rải chùm ba (ô 15–19), nốt lặp đều (ô 59–62). Học xong bài này, tay trái của bạn không còn chỉ biết "đệm".
    moi: Tay trái nhiều vai. Một bè trầm có giai điệu riêng (ô 2–4), hình đệm nốt lặp (ô 6–8, 21–24), hợp âm rải chùm ba (ô 15–19), nốt lặp đều (ô 59–62). Học xong bài này, tay trái của bạn không còn chỉ biết "đệm".
    ly_do: 'n12 (da-sua): bè trầm ô 2–4 có bước nhảy, không đi từng bước (Mutopia).'
  - cu:
      - 'Hai sonata Op. 49 đều chỉ có hai chương. Theo lời giới thiệu của ấn bản Henle, Beethoven viết chúng khoảng 1796–1798, cùng thời với ba sonata Op. 10, khi ông chưa đến ba mươi tuổi và được biết đến ở Vienna trước hết như một nghệ sĩ piano. Chúng không được in ngay. Việc chúng được in có lẽ là nhờ người em trai Carl, người lo việc giao dịch với các nhà xuất bản cho anh: Carl đem chào vài nơi không thành, đến năm 1805 mới có một nhà xuất bản ở Vienna nhận in. Bản in đầu tiên gọi chúng là Sonates faciles, "những sonata dễ".'
      - 'Vì in muộn, hai bản sonata nhỏ này mang số Op. 49, lớn hơn cả Sonata Ánh trăng Op. 27 (1801), bài được viết sau chúng. Ở đây số Op. cho biết lúc in, không phải lúc viết: Op. 49 số 2 thuộc về Beethoven của những năm 1790, còn rất gần ngôn ngữ của Haydn và Mozart.'
      - Chương 2 (Tempo di Menuetto) có chủ đề mà Beethoven dùng lại trong chương minuet của bản Septet Op. 20 (1799–1800), một tác phẩm rất được ưa chuộng thời ông.
      - Đàn Vienna cuối thế kỷ 18 có âm vực khoảng năm quãng tám (Fa1–Fa6), tiếng nhẹ và tắt nhanh; cả chương này nằm gọn trong khoảng Sol1–Mi6. Trên đàn hiện đại, hãy giữ tiếng gọn, sáng, và rất ít bàn đạp. Xem thêm thời kỳ Cổ điển.
    moi:
      - 'Hai sonata Op. 49 đều chỉ có hai chương. Theo lời giới thiệu của ấn bản Henle, Beethoven viết chúng khoảng 1796–1798 (số 2 có lẽ năm 1796), gần cùng thời với ba sonata Op. 10, khi ông chưa đến ba mươi tuổi. Chúng không được in ngay. Việc chúng được in có lẽ là nhờ người em trai Carl, người lục tìm trong các bản thảo của anh những bài có thể đem bán: từ cuối năm 1802, Carl đem chào vài nơi không thành, đến tháng 1 năm 1805 một nhà xuất bản ở Vienna mới in chúng. Bản in đầu tiên gọi chúng là Sonates faciles, "những sonata dễ".'
      - 'Vì in muộn, hai bản sonata nhỏ này mang số Op. 49, lớn hơn cả Sonata Ánh trăng Op. 27 (1801), bài được viết sau chúng. Ở đây số Op. cho biết lúc in, không phải lúc viết: Op. 49 số 2 thuộc về Beethoven của những năm 1790.'
      - Chương 2 (Tempo di Menuetto) có chủ đề mà Beethoven dùng lại trong chương minuet của bản Septet Op. 20 (1799), một tác phẩm rất được ưa chuộng thời ông.
      - 'Đàn piano Vienna cuối thế kỷ 18 có âm vực khoảng năm quãng tám (kiểu đàn của Anton Walter: Fa1–Sol6); cả chương này nằm gọn trong khoảng Sol1–Mi6. Trên đàn hiện đại, hãy giữ tiếng gọn, sáng, và rất ít bàn đạp. Xem thêm thời kỳ Cổ điển.'
    ly_do: 'n18, n19, n20 (da-sua): theo lời giới thiệu Henle HN 1327; bỏ vế "nghệ sĩ piano" chưa có nguồn. n23 (da-sua): bỏ nhận định phong cách chưa có nguồn. n24 (da-sua): Henle: "Septet op. 20 of 1799". n25 (da-sua): Tafelmusik: đàn kiểu Walter FF–g''''''; bỏ "tiếng nhẹ và tắt nhanh" chưa có nguồn.'
  - cu: Mọi nghệ sĩ thu trọn 32 sonata của Beethoven đều có bài này, ví dụ Wilhelm Kempff, Alfred Brendel hay András Schiff. So sánh tốc độ họ chọn cho ma non troppo, độ tách tiếng của các nốt đen và độ nổi của tay trái. Nghe thêm một bản trên fortepiano (Ronald Brautigam thu trọn các sonata của Beethoven trên loại đàn này) để thấy chùm ba và gam trong trẻo thế nào trên một cây đàn gần với đàn thời Beethoven. Site chưa có hướng dẫn nghe riêng cho Op. 49; hướng dẫn nghe Pathétique giới thiệu một sonata lớn hơn của Beethoven cùng thời kỳ, và Nghệ sĩ piano và bản thu nên nghe giúp bạn chọn bản thu.
