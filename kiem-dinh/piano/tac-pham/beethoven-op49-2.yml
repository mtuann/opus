  - cu: "câu hỏi: Đoạn chuyển ở phần tái hiện (ô 82–87) khác đoạn chuyển ở phần trình bày (ô 15–20) thế nào? | ✓ Gần như giống hệt, nhưng lần này dẫn sang chủ đề 2 ở Sol trưởng thay vì Rê trưởng | Được viết lại hoàn toàn ở Đô trưởng | Bị bỏ đi: chủ đề 2 đến ngay sau chủ đề 1 | Cùng những nốt ấy, hợp âm Rê cuối đoạn được nghe như một giọng mới ở phần trình bày, và như át âm của Sol ở phần tái hiện."
    moi: "câu hỏi: Đoạn chuyển ở phần tái hiện (ô 82–87) khác đoạn chuyển ở phần trình bày (ô 15–20) thế nào? | ✓ Gần như giống hệt, nhưng lần này dẫn sang chủ đề 2 ở Sol trưởng thay vì Rê trưởng | Được viết lại hoàn toàn ở Đô trưởng | Bị bỏ đi: chủ đề 2 đến ngay sau chủ đề 1 | Cả hai lần đoạn chuyển đều dừng trên hợp âm Rê, át âm của Sol; ở phần trình bày, chủ đề 2 sau đó vào Rê trưởng, ở phần tái hiện chủ đề 2 ở lại Sol trưởng."
