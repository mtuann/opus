    luot_2_ghi_chu: "Mutopia id 776: 'Sonata No. 20 (1st Movement: Allegro, ma non troppo)', Opus 'Op. 49, No. 2'; file .ly có \\key g \\major. Henle: 'Piano Sonata G major op. 49,2'."
  - id: n2
    cau: 'Mô tả và câu mở đầu: đây là một chương sonata trọn vẹn mà bản in đầu tiên gọi là "sonata dễ".'
    loai: lich-su
    nguon: [ henle-1327-vorwort ]
    ket_qua: da-sua
    ghi_chu: "Câu cũ (cả description): \"Đây là chương sonata thật đầu tiên mà nhiều người học có thể chơi trọn\". \"Đầu tiên\", \"nhiều người học\" không kiểm được. Henle: bản in đầu tiên mang tên \"Deux Sonates faciles\". Review D6-L3-gom: Hai lượt cùng kết luận, nguồn khớp; đồng ý chữ trang."
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/df/c7/fd/1697725885/1327-1697725884-sync.pdf", "https://www.henle.de/en/Two-Easy-Piano-Sonatas-no.-19-and-no.-20-g-minor-and-G-major-op.-49-no.-1-and-no.-2/HN-1327" ]
    luot_2_ghi_chu: "Lời giới thiệu Henle HN 1327: 'The Deux Sonates faciles op. 49 – the title is thus in the original edition'. Trang sản phẩm: 'described in their first publication as Sonates faciles'. Chương 1 là chương sonata trọn vẹn: file .ly Mutopia có trình bày (ô 1–52, nhắc lại), phát triển, tái hiện."
    review: "dung"
