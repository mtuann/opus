    luot_2_ghi_chu: "câu đúng: Câu hỏi 2: đoạn chuyển ở tái hiện gần như giống hệt đoạn ở trình bày, và cả hai lần đều dừng trên hợp âm Rê, át âm của Sol; ở trình bày, chủ đề 2 sau đó vào Rê trưởng, ở tái hiện chủ đề 2 ở lại Sol trưởng.; Vế đầu đúng: ô 82–86 trùng nốt ô 15–19, chủ đề 2 ở Sol (ô 88) thay vì Rê (ô 21). Vế sau sai như n60: ô 15–19 là Rê bảy (c''!) xen Sol trên nốt Rê trầm, nên hợp âm Rê ô 20 là át âm của Sol ở cả hai lần (OMT: đoạn chuyển kết bằng nửa kết ở giọng chủ thì tái hiện giữ nguyên và chủ đề 2 vào giọng chủ). Giọng mới ở trình bày đến từ chủ đề 2, không từ hợp âm Rê."
