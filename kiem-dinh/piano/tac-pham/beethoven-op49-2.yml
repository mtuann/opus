    ly_do: "Review D6-L3-gom: dữ liệu, hồ sơ bản ghi n25: bỏ \"có chú thích hữu ích\" (đánh giá, không kiểm được)."
  - cu: "Điều đáng chú ý nhất: hợp âm Rê cuối đoạn chuyển. Ở ô 20, tai nghe nó như một giọng mới (Rê trưởng); ở ô 87, cũng hợp âm ấy, sau cũng những nốt ấy, lại nghe như át âm kéo về Sol. Chơi hai chỗ này liền nhau vài lần, bạn sẽ hiểu vì sao phần tái hiện \"giải quyết\" phần trình bày."
    moi: "Điều đáng chú ý nhất: hợp âm Rê cuối đoạn chuyển. Cả hai lần (ô 20 và ô 87), đoạn chuyển dừng trên hợp âm Rê, át âm của Sol. Ở phần trình bày, chủ đề 2 vào thẳng Rê trưởng ngay sau đó, nên tai nghe lại hợp âm Rê như chủ âm của một giọng mới; ở phần tái hiện, chủ đề 2 ở lại Sol trưởng. Chơi hai chỗ này liền nhau vài lần, bạn sẽ hiểu vì sao phần tái hiện \"giải quyết\" phần trình bày."
    ly_do: "Review D6-L3-gom: n60 (lượt 2 sai): ô 15–19 là âm át ngân trong Sol trưởng (Rê bảy có Đô♮), ô 20 là nửa kết ở giọng chủ; viết theo câu đúng của lượt 2."
  - cu: "Nốt đen không có dấu luyến (giai điệu ô 2–4, đoạn chuyển): hơi tách, gọn, nhưng không khô."
    moi: "Nốt đen không có dấu luyến (giai điệu ô 3–4, đoạn chuyển; ở ô 2, ba nốt Sol–Fa♯–Sol có dấu luyến): hơi tách, gọn, nhưng không khô."
