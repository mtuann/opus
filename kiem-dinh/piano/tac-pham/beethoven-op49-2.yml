    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly" ]
    luot_2_ghi_chu: "So từng ô: tay phải ô 82–86 trùng ô 15–19 (fis'4, tam liên a''-fis''-d'', c''4…), tay trái ô 82–86 trùng ô 15–19 (tam liên d-fis-a / d-g-b); ô 87 khác ô 20 chỉ ở ba nốt làm đà (d' thay a'). Chủ đề 2: ô 21 Rê trưởng, ô 88 Sol trưởng."
  - id: n8
    cau: Ô 1 có chùm ba (ba nốt móc đơn trong một phách đen), ô 3 có nhịp chấm dôi (nốt đen chấm dôi rồi nốt móc đơn).
    loai: cau-truc
    nguon: [ mut-op49 ]
    ket_qua: dung
    ghi_chu: 'Ô 1: "\times 2/3 { d''8 g'' b'' d'''' c'''' a'' }"; ô 3: a''4. a''8 b''4. b''8.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly" ]
    luot_2_ghi_chu: "Ô 1: <b d' g'>2 rồi \\times 2/3 { d'8 g' b' d'' c'' a' } với tupletSpannerDuration 1/4, tức hai nhóm ba móc đơn, mỗi nhóm một phách đen. Ô 3: a'4. a'8 b'4. b'8 (đen chấm dôi + móc đơn)."
