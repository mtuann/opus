    ket_qua: dung
    ghi_chu: 'Ô 1–8, 2/2, L:1/8, K:G. Ấn bản: Breitkopf & Härtel (1862–1865) qua Mutopia LVB_Sonate_49no2_1 (.ly và .mid, tải 05/11/2026). Công cụ: script Python (mido) in nốt MIDI theo ô và hai tay, đọc .ly cho dấu luyến, láy, sắc thái, khóa. Kết quả: 8/8 ô khớp cao độ và trường độ cả hai tay (ô 1 hợp âm B3 D4 G4 + chùm ba D G B D C A; ô 4 D5, C5 láy rền, nốt kết Si–Đô, B4; tay trái ô 2–4 B A G | F♯ D G F♮ | E F♯ G G B D; ô 6–8 hình đệm nốt lặp B D A D G D | F♯ D D D G D F D | E G F♯ A G); dấu luyến (G F♯ G) ô 2, 6, (B A G) tay trái ô 2, (b c c♯ d) ô 8; p ở tay trái ô 6 cùng chỗ đổi khóa Sol; không có sắc thái ở ô 1. Số ngón là gợi ý, chơi được.'
