  - id: n60
    cau: "Hợp âm Rê cuối đoạn chuyển: cả hai lần (ô 20 và ô 87) đoạn chuyển dừng trên hợp âm Rê, át âm của Sol; ở phần trình bày, chủ đề 2 vào thẳng Rê trưởng ngay sau đó nên hợp âm Rê được nghe lại như chủ âm của giọng mới; ở phần tái hiện, chủ đề 2 ở lại Sol trưởng; vì vậy phần tái hiện \"giải quyết\" phần trình bày."
    loai: cau-truc
    nguon: [ mut-op49, omt-sonata ]
    ket_qua: "da-sua"
    ghi_chu: "Ô 21 chủ đề 2 ở Rê trưởng; ô 88 ở Sol trưởng. OMT Sonata Form: chủ đề 2 ở giọng khác trong phần trình bày, về giọng chủ ở phần tái hiện. Review D6-L3-gom: Lượt 2 đúng. Review đọc Mutopia LVB_Sonate_49no2_1.ly: ô 15–19 tay trái rải Rê–Fa♯–La xen Rê–Sol–Si trên nốt Rê trầm, tay phải có Đô♮ (c''! ô 15, 17): âm át ngân trong Sol trưởng; ô 20 hợp âm Rê là nửa kết ở giọng chủ, Rê trưởng chỉ đến khi chủ đề 2 vào ở ô 21. Sửa đoạn văn theo câu đúng của lượt 2 (doi_chu), không chạy lại."
    luot_2: sai
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/" ]
    luot_2_ghi_chu: "câu đúng: Hai lần đoạn chuyển giống hệt nhau và đều dừng trên hợp âm Rê, át âm của Sol (nửa kết ở giọng chủ). Ở phần trình bày, chủ đề 2 vào thẳng Rê trưởng ngay sau đó (ô 21), nên hợp âm Rê được nghe lại thành chủ âm của giọng mới; ở phần tái hiện, chủ đề 2 ở lại Sol trưởng (ô 88). Vì vậy phần tái hiện \"giải quyết\" phần trình bày.; Bản nhạc: đoạn chuyển ở trình bày (ô 15–19) đã là Rê bảy có Đô♮ (c''! ô 15, 17) xen hợp âm Sol trên nốt Rê trầm, tức một nốt át ngân trong Sol trưởng; ô 82–86 trùng nốt. Vậy hợp âm Rê ô 20 cũng là át âm của Sol (nửa kết ở giọng chủ), giống hệt ô 87. Open Music Theory, Sonata Form: 'If the exposition's transition ended with a half cadence in the original key…, then the recapitulation can actually be restated in full without changes, and the secondary theme can simply start in the tonic key'. Giọng mới Rê trưởng chỉ đến khi chủ đề 2 vào ở ô 21. Ý 'tái hiện giải quyết trình bày' (chủ đề 2 về giọng chủ) vẫn đúng."
    review: "dung"
