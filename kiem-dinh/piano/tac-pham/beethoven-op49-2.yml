- id: n16
  cau: So với Op. 49 số 2, K. 545 có nhiều đệm Alberti hơn và ít chùm ba hơn.
  loai: cau-truc
  nguon: [mut-op49, mut-k545]
  ket_qua: dung
  ghi_chu: 'Mutopia K. 545 chương 1: tay trái mở đầu bằng Alberti (c8 g'' e'' g''), không có chùm ba (\times). Op. 49 số 2 không có Alberti, có nhiều chùm ba.'
- id: n17
  cau: Hai sonata Op. 49 đều chỉ có hai chương.
  loai: cau-truc
  nguon: [henle-1327-vorwort, imslp-op49-2, imslp-op49-1]
  ket_qua: dung
  ghi_chu: 'Henle: Carl chào "2 small, easy sonatas, each of which has only two movements"; IMSLP: hai chương mỗi bài.'
- id: n18
  cau: Theo lời giới thiệu của ấn bản Henle, Beethoven viết chúng khoảng 1796–1798 (số 2 có lẽ năm 1796), gần cùng thời với ba sonata Op. 10.
  loai: nam
  nguon: [henle-1327-vorwort, imslp-op49-2]
  ket_qua: da-sua
  ghi_chu: 'Câu cũ: "viết chúng khoảng 1796–1798, cùng thời với ba sonata Op. 10". Henle: "the 2nd Sonata was probably written in 1796, and the 1st Sonata in 1797/98 ... in close proximity to the three Sonatas op. 2 (1794/95), the Grande Sonate op. 7 (1796/97) and the three Sonatas op. 10 (1795 – 98)". IMSLP ghi số 2: 1795–96. Thêm năm của số 2 vì trang nói về số 2.'
- id: n19
  cau: Khi viết chúng, Beethoven chưa đến ba mươi tuổi.
  loai: nam
  nguon: [henle-1327-vorwort]
  ket_qua: da-sua
  ghi_chu: 'Henle: Beethoven 1770–1827; 1796–98 là 25–28 tuổi. Câu cũ có thêm "và được biết đến ở Vienna trước hết như một nghệ sĩ piano": chưa có nguồn đã mở, bỏ.'
- id: n20
  cau: 'Việc chúng được in có lẽ là nhờ người em trai Carl, người lục tìm trong các bản thảo của anh những bài có thể đem bán: từ cuối năm 1802 Carl đem chào vài nơi không thành, đến tháng 1 năm 1805 một nhà xuất bản ở Vienna mới in chúng.'
  loai: lich-su
  nguon: [henle-1327-vorwort]
  ket_qua: da-sua
  ghi_chu: 'Câu cũ: "người em trai Carl, người lo việc giao dịch với các nhà xuất bản cho anh: Carl đem chào vài nơi không thành, đến năm 1805 mới có một nhà xuất bản ở Vienna nhận in". Henle: "We instead probably owe their publication to the keen business sense of his brother Kaspar Karl, who while sifting through Beethoven''s manuscripts ... came across the two Sonatas. Starting in November 1802 he offered ... first of all to André in Offenbach, then in 1803 to Breitkopf & Härtel ... and, probably in 1804, to the Wiener Kunst- und Industrie-Comptoir, which was awarded the contract"; "published in January 1805". Viết lại theo đúng điều Henle nói.'
- id: n21
  cau: Bản in đầu tiên gọi chúng là Sonates faciles, "những sonata dễ".
  loai: ten
  nguon: [henle-1327-vorwort]
  ket_qua: dung
  ghi_chu: 'Henle: "The Deux Sonates faciles op. 49 – the title is thus in the original edition".'
- id: n22
  cau: Vì in muộn, hai sonata mang số Op. 49, lớn hơn Sonata Ánh trăng Op. 27 (1801), bài được viết sau chúng; số Op. ở đây cho biết lúc in, không phải lúc viết.
  loai: danh-muc
  nguon: [henle-1327-vorwort, henle-1062-vorwort]
  ket_qua: dung
  ghi_chu: 'Henle HN 1327: "their relatively high opus number means that they have been erroneously classified as nos. 19 and 20 ... chronologically ... approximately nos. 4 and 5". Henle HN 1062: "his 1801 Sonata".'
- id: n23
  cau: Op. 49 số 2 thuộc về Beethoven của những năm 1790.
  loai: nam
  nguon: [henle-1327-vorwort]
  ket_qua: da-sua
  ghi_chu: 'Câu cũ có thêm "còn rất gần ngôn ngữ của Haydn và Mozart": nhận định phong cách, chưa có nguồn đã mở, bỏ.'
- id: n24
  cau: Chương 2 (Tempo di Menuetto) có chủ đề mà Beethoven dùng lại trong chương minuet của bản Septet Op. 20 (1799), một tác phẩm rất được ưa chuộng thời ông.
  loai: lich-su
  nguon: [henle-1327-vorwort]
  ket_qua: da-sua
  ghi_chu: 'Câu cũ ghi Septet "(1799–1800)". Henle: "he included it in his Septet op. 20 of 1799. The borrowed melody was so popular, as was the whole Septet". Đổi năm theo Henle.'
- id: n25
  cau: 'Đàn piano Vienna cuối thế kỷ 18 có âm vực khoảng năm quãng tám (kiểu đàn của Anton Walter: Fa1–Sol6).'
  loai: lich-su
  nguon: [tafelmusik]
  ket_qua: da-sua
  ghi_chu: 'Câu cũ: "Đàn Vienna cuối thế kỷ 18 có âm vực khoảng năm quãng tám (Fa1–Fa6), tiếng nhẹ và tắt nhanh". Tafelmusik: đàn kiểu Walter "just over five octaves (from FF to g'''''')", tức Fa1–Sol6; "tiếng nhẹ và tắt nhanh" không có ở nguồn đã mở, bỏ.'
- id: n26
  cau: Cả chương này nằm gọn trong khoảng Sol1–Mi6.
  loai: cau-truc
  nguon: [mut-op49]
  ket_qua: dung
  ghi_chu: 'MIDI: nốt thấp nhất 31 (Sol1, ô 122), cao nhất 88 (Mi6, ô 111).'
