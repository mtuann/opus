  - id: n12
    cau: 'Tay trái nhiều vai: một bè trầm có giai điệu riêng (ô 2–4), hình đệm nốt lặp (ô 6–8, 21–24), hợp âm rải chùm ba (ô 15–19), nốt lặp đều (ô 59–62).'
    loai: cau-truc
    nguon: [ mut-op49 ]
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"Một bè trầm đi từng bước (ô 2–4)\": bè trầm Si La Sol | Fa♯ Rê Sol Fa | Mi Fa♯ Sol có bước nhảy (Fa♯–Rê, Rê–Sol), nên sửa theo chính câu ở mục Tám ô đầu. Các ô khác khớp MIDI. Giữ cho piano/not-lap-not-kep n41. Review D6-L3-gom: Hai lượt cùng kết luận, nguồn khớp; đồng ý chữ trang."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly" ]
    luot_2_ghi_chu: "Tay trái: ô 2–4 r4 b(a g) | fis d g f | e fis g8…: bè trầm có giai điệu; ô 6–8 b'8 d'' a' d'' g' d''… (Rê lặp); ô 21–24 fis' a' g' a'… (La lặp); ô 15–19 tam liên d-fis-a, d-g-b; ô 59–62 móc đơn toàn nốt Si."
    review: "dung"
  - id: n13
    cau: 'Gợi ý chuẩn bị: gam Sol trưởng và Rê trưởng hai quãng tám, mỗi phách ba nốt, ở ♩ = 120.'
