    cau: 'Việc chúng được in có lẽ là nhờ người em trai Carl, người lục tìm trong các bản thảo của anh những bài có thể đem bán: từ cuối năm 1802 Carl đem chào vài nơi không thành, đến tháng 1 năm 1805 một nhà xuất bản ở Vienna mới in chúng.'
    loai: lich-su
    nguon: [ henle-1327-vorwort ]
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"người em trai Carl, người lo việc giao dịch với các nhà xuất bản cho anh: Carl đem chào vài nơi không thành, đến năm 1805 mới có một nhà xuất bản ở Vienna nhận in\". Henle: \"We instead probably owe their publication to the keen business sense of his brother Kaspar Karl, who while sifting through Beethoven's manuscripts ... came across the two Sonatas. Starting in November 1802 he offered ... first of all to André in Offenbach, then in 1803 to Breitkopf & Härtel ... and, probably in 1804, to the Wiener Kunst- und Industrie-Comptoir, which was awarded the contract\"; \"published in January 1805\". Viết lại theo đúng điều Henle nói. Review D6-L3-gom: Hai lượt cùng kết luận, nguồn khớp; đồng ý chữ trang."
