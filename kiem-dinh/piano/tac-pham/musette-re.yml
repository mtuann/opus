ghi_chu: 'Bài học Musette Rê trưởng BWV Anh. 126 (tầng Tác phẩm). Bản nhạc: Mutopia anna-magdalena-22 (.ly và .mid, nguồn Bach-Gesellschaft, Allen Garvin), đối chiếu từng nốt bằng script Python (mido) theo ô. Nhạc cụ musette: Britannica (bản lưu Wayback vì trang gốc trả 403), Concise Oxford Dictionary of Music (qua Encyclopedia.com), bản ghi nhạc cụ của Đại học Edinburgh. BWV 808: IMSLP, Hội Bach Hà Lan, PTNA. Sửa trang ở lượt 1: n3 (bỏ "tự nhiên nhất"), n13 (bỏ "kẹp dưới cánh tay" và "giấc mơ đồng quê" của nhạc cụ; "quý tộc" thành "cung đình"), n24 ("phần lớn" thành "nhiều"), n67 (tiếng vọng: bỏ câu khẳng định thói quen Baroque, sửa câu harpsichord), n87 (mục Nguồn: thay Grove, không đọc được, bằng Britannica và COD). Lời khuyên về mỏi tay ở bè trầm quãng tám (n52, n84) xếp khuyen-tap vì nói về độ đều và độ mỏi, không về đau hay chấn thương; review soát nhãn. Không tính là nhận định: tiêu đề, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng, mốc trong ::khoi-nghe (đã nghe thử bản thu Commons bằng chroma: A A B A B A, các mốc 16, 21, 26, 37, 49 khớp đầu đoạn B, âm nền Mi, kết B, B nhắc lại, A cuối).'
