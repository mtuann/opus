doi_chu:
  - cu: "Trong nhạc Baroque, một ý lặp lại hay được chơi như tiếng vọng: lần sau nhỏ hơn, như từ xa vọng lại. Trên harpsichord hai bàn phím, người chơi đổi bàn phím; trên piano, bạn đổi lực tay và màu tiếng. Bản nhạc không ghi gì, nên đây chỉ là một gợi ý:"
    moi: "Một ý lặp lại có thể chơi như tiếng vọng: lần sau nhỏ hơn, như từ xa vọng lại. Trên harpsichord hai bàn phím, người chơi có thể đổi sang bàn phím kia; trên piano, bạn đổi lực tay và màu tiếng. Bản nhạc không ghi gì, nên đây chỉ là một gợi ý:"
    ly_do: "n67 (da-sua): chưa có nguồn đọc được cho thói quen tiếng vọng của nhạc Baroque; viết lại thành gợi ý."
  - cu: 'The New Grove Dictionary of Music and Musicians, các mục "Musette": nhạc cụ và kiểu bản nhạc mang tên ấy.'
    moi: 'Encyclopaedia Britannica, mục "musette", và The Concise Oxford Dictionary of Music, mục "musette" (qua Encyclopedia.com): nhạc cụ và kiểu bản nhạc mang tên ấy.'
    ly_do: "n87 (da-sua): Grove cần đăng nhập, không đọc được; thay bằng hai nguồn đã đọc khi kiểm định."
  - cu: "Tay trái có một việc riêng. Không phải hợp âm, cũng không phải một bè hát: tay trái giữ một nhịp đập quãng tám gần như suốt bài. Đây là bài tập xoay cẳng tay và giữ đều tự nhiên nhất ở cấp độ này."
