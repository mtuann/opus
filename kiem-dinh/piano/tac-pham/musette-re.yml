    ghi_chu: 'Cũ: "Trong nhạc Baroque, một ý lặp lại hay được chơi như tiếng vọng: lần sau nhỏ hơn, như từ xa vọng lại. Trên harpsichord hai bàn phím, người chơi đổi bàn phím; trên piano, ...". Mới: "Một ý lặp lại có thể chơi như tiếng vọng: lần sau nhỏ hơn, như từ xa vọng lại. Trên harpsichord hai bàn phím, người chơi có thể đổi sang bàn phím kia; trên piano, ...". Chưa có nguồn đọc được nói tiếng vọng là thói quen của nhạc Baroque; Encyclopedia.com (harpsichord): đàn có hai tầng phím, mỗi tầng một bộ dây, nên đổi tầng phím đổi màu tiếng. Câu mới là gợi ý. Review D6-L1-gom: giữ. Britannica (review tự mở qua bản lưu web.archive.org/web/2026/…): "it would not ordinarily be possible to produce the rapid changes in loudness required for pieces in echo style ... To accomplish this, it is necessary to have two keyboards or manuals"; Grove 1900 (lượt 2): hiệu ứng to–nhỏ phổ biến trong nhạc đàn phím tới thời Handel. Câu trên trang là gợi ý ("có thể"). Đủ nguồn.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Echo" ]
    luot_2_ghi_chu: "Grove 1900 (Echo): hiệu ứng tiếng vọng to–nhỏ phổ biến trong nhạc cho đàn phím đến thời Handel. Chưa mở được nguồn bậc 2 nói việc đổi bàn phím trên harpsichord hai bàn phím để tạo tiếng vọng (Britannica bị chặn)."
