nhan_dinh:
  - id: n1
    cau: 'Bài bắt chước tiếng kèn túi: tay trái đập đều quãng tám Rê như ống kèn giữ một nốt trầm, tay phải hát giai điệu ở phía trên.'
    loai: cau-truc
    nguon: [ mut-musette, cod-musette ]
    ket_qua: dung
    ghi_chu: 'Tay trái ô 1–2, 5–6 Rê2 Rê3 móc đơn; COD: musette (bản nhạc) có bè trầm giữ nốt gợi tiếng nhạc cụ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh126/anna-magdalena-22/anna-magdalena-22.ly", "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/musette" ]
    luot_2_ghi_chu: 'Đếm trên bản Mutopia (Bach-Gesellschaft, người nhập Allen Garvin). Tay trái ô 1–2, 5–6: Rê2–Rê3 móc đơn liên tục; tay phải giai điệu ở trên. Concise Oxford: musette là kèn túi có drone, bản nhạc musette có "persistent drone bass".'
  - id: n2
    cau: 'Tay trái giữ một nhịp đập quãng tám gần như suốt bài (không phải hợp âm, cũng không phải một bè hát).'
    loai: cau-truc
    nguon: [ mut-musette ]
    ket_qua: dung
    ghi_chu: Quãng tám ở ô 1–2, 5–6, 9–18 (14/20 ô); ô 3–4, 7–8, 19–20 tay trái chơi giai điệu.
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh126/anna-magdalena-22/anna-magdalena-22.ly" ]
    luot_2_ghi_chu: Đếm trên bản Mutopia (Bach-Gesellschaft, người nhập Allen Garvin). Tay trái đập quãng tám ở ô 1–2, 5–6, 9–18 (14/20 ô); ô 3–4, 7–8, 19–20 tay trái chơi giai điệu, nên 'gần như suốt bài' đúng.
  - id: n3
    cau: Đây là bài tập tốt để xoay cẳng tay và giữ đều ở cấp độ này.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Cũ: "Đây là bài tập xoay cẳng tay và giữ đều tự nhiên nhất ở cấp độ này." So sánh "tự nhiên nhất" không kiểm được; viết lại thành lời khuyên. Review D6-L1-gom: chữ trang khớp câu mới (lời khuyên, bỏ so sánh "tự nhiên nhất"); lời khuyên tập không cần nguồn, nên đổi da-sua thành khong-can-nguon (như hồ sơ đã khóa nhac-ly/30 n32), chữ cũ vẫn ghi ở trên. Không dính sức khỏe.'
    review: dung
  - id: n4
    cau: 'Tay phải liên tục chuyển giữa hai vùng: trên cao quanh La5 và ở giữa, ngay trên Đô giữa.'
    loai: cau-truc
    nguon: [ mut-musette ]
    ket_qua: dung
    ghi_chu: Ô 1–2, 5–6 La5–Rê5; ô 3–4, 7–8 Fa♯4–La4, Rê4, Mi4 (ngay trên Đô4).
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh126/anna-magdalena-22/anna-magdalena-22.ly" ]
    luot_2_ghi_chu: "Đếm trên bản Mutopia (Bach-Gesellschaft, người nhập Allen Garvin). Tay phải: ô 1–2 từ La5 xuống Rê5, ô 3–4 Fa♯4–Rê4; ô 10–11 La5–Mi5, ô 13–16 nhảy Mi5 ↔ Mi4."
  - id: n5
    cau: Ở ô 3–4 và 7–8, hai tay chơi cùng một giai điệu, cách nhau một quãng tám.
    loai: cau-truc
    nguon: [ mut-musette ]
    ket_qua: dung
    ghi_chu: Ô 3 tay phải Fa♯4 Sol4 La4 Sol4 Fa♯4, tay trái Fa♯3 Sol3 La3 Sol3 Fa♯3; ô 4, 7, 8 tương tự.
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh126/anna-magdalena-22/anna-magdalena-22.ly" ]
    luot_2_ghi_chu: "Đếm trên bản Mutopia (Bach-Gesellschaft, người nhập Allen Garvin). Ô 3–4: tay phải Fa♯4 Sol4 La4 Sol4 Fa♯4 | Mi4 La4 Fa♯4 Rê4, tay trái cùng nốt thấp quãng tám; ô 7–8 tương tự."
  - id: n6
    cau: 'Bài đầy ý lặp lại: ô 2 giống hệt ô 1, ô 5–8 lặp lại ô 1–4, ô 15–16 lặp lại ô 13–14.'
    loai: cau-truc
    nguon: [ mut-musette ]
    ket_qua: dung
    ghi_chu: 'Ô 1 = ô 2; ô 5–7 = ô 1–3, ô 8 khác ô 4 ở nửa sau (Rê4 nốt đen có dấu ngân); ô 15–16 = ô 13–14.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh126/anna-magdalena-22/anna-magdalena-22.ly" ]
    luot_2_ghi_chu: "Đếm trên bản Mutopia (Bach-Gesellschaft, người nhập Allen Garvin). Ô 2 = ô 1; ô 5–7 = ô 1–3 (ô 8 khác ô 4 ở nhịp cuối: Mi–La–Rê đen thay cho Mi–La–Fa♯–Rê); ô 15–16 = ô 13–14."
  - id: n7
    cau: Trọn bài, kể cả nhắc lại và da capo, dài khoảng một đến hai phút.
    loai: so-lieu
    nguon: [ commons-musette ]
    ket_qua: da-sua
    ghi_chu: 'Bản thu Commons (piano, chơi A A B A B A) dài 63,59 giây. Tính: A A B B A = 48 ô 2/4 = 96 phách, ở ♩ = 96 là 60 giây. Review D6-L1-gom: chữ cũ "chỉ khoảng một phút"; các bản thu dài khác nhau (lượt 2: IMSLP 1:07, 1:44, 2:11; bản Commons của site 63,59 s). Chữ mới theo đề nghị của lượt 2 ("khoảng một đến hai phút"), phần còn lại lượt 2 đã xác nhận.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Musette_in_D_major,_BWV_Anh.126_(Bach,_Johann_Sebastian)", "https://classical.music.apple.com/in/album/1459978633" ]
    luot_2_ghi_chu: "Tính: 48 ô 2/4 (A nhắc lại, B nhắc lại, A) ở khoảng 100–120 phách/phút là 48–58 giây. Các bản thu dài khác nhau: IMSLP có bản trọn bài 1:07, 1:44, 2:11; Liardet (harpsichord) 1:05. Không có nguồn chung; có thể viết 'khoảng một đến hai phút'."
    review: dung
  - id: n8
    cau: 'Musette vừa là tên một nhạc cụ, vừa là tên một kiểu bản nhạc.'
    loai: dinh-nghia
    nguon: [ cod-musette ]
    ket_qua: dung
    ghi_chu: 'COD: "(1) Type of Fr. bagpipe ..." và "(2) Variety of gavotte in which persistent drone bass suggests the above instr."'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/musette", "https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Musette" ]
    luot_2_ghi_chu: 'Concise Oxford: (1) loại kèn túi Pháp, (2) "Variety of gavotte in which persistent drone bass suggests the above instr."; Grove 1900: nhạc cụ và "an air… appropriate to the instrument".'
  - id: n9
    cau: 'Nhạc cụ ấy, gọi đầy đủ là musette de cour, là một loại kèn túi nhỏ của Pháp; người chơi bơm hơi bằng một ống bễ thay vì thổi bằng miệng.'
    loai: dinh-nghia
    nguon: [ brit-musette, cod-musette, ed-musette ]
    ket_qua: dung
    ghi_chu: 'Britannica: "small, elegant bagpipe that was fashionable in French court circles ... The bagpipe was bellows-blown"; Edinburgh: "Musette de cour ... Bellows-blown bagpipe". Phần "kẹp dưới cánh tay" đã bỏ (n13).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/musette", "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/musette" ]
    luot_2_ghi_chu: "Britannica (đọc qua bản lưu web.archive.org/web/20260102144559): \"musette, small, elegant bagpipe that was fashionable in French court circles… bellows-blown\"; Concise Oxford: \"Was bellows-blown\". Tên 'musette de cour' chỉ thấy ở link tham khảo của Britannica, không trong chữ bài."
  - id: n10
    cau: Thế kỷ 17–18, musette thịnh hành trong giới cung đình Pháp.
    loai: lich-su
    nguon: [ brit-musette, cod-musette ]
    ket_qua: dung
    ghi_chu: 'Britannica: "fashionable in French court circles in the 17th and 18th centuries"; COD: "popular in court circles in 17th and 18th cents."'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/musette", "https://www.britannica.com/art/musette" ]
    luot_2_ghi_chu: 'Concise Oxford: "popular in court circles in 17th and 18th cents."; Britannica: "fashionable in French court circles in the 17th and 18th centuries".'
  - id: n11
    cau: 'Như mọi loại kèn túi, musette có những ống kèn chỉ phát một nốt trầm không đổi, vang suốt dưới giai điệu (drone).'
    loai: dinh-nghia
    nguon: [ brit-musette, cod-musette, ed-musette ]
    ket_qua: dung
    ghi_chu: 'Britannica: "shuttle drone ... to supply four drones"; COD: "4 or 5 drones enclosed in cylinder". "Như mọi loại kèn túi" là cách nói chung.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/musette", "https://www.britannica.com/art/musette" ]
    luot_2_ghi_chu: 'Concise Oxford: "4 or 5 drones"; Britannica: "shuttle drone… to supply four drones". Drone là ống phát một nốt trầm cố định.'
  - id: n12
    cau: 'Âm nền (pedal point): bè trầm giữ hoặc lặp lại một nốt trong khi phía trên đổi hòa âm; trên đàn phím, các nhà soạn nhạc bắt chước tiếng musette bằng âm nền.'
    loai: dinh-nghia
    nguon: [ omt-embell, cod-musette ]
    ket_qua: dung
    ghi_chu: 'OMT: "Pedal tones are often found in the bass. They consist of a series of static notes below chord changes". COD: musette (bản nhạc) có "persistent drone bass".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/", "https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Musette" ]
    luot_2_ghi_chu: 'OMT (Embellishing Tones): "Pedal tones are often found in the bass. They consist of a series of static notes below chord changes"; Grove 1900: "a musette generally has a pedal-bass answering to the drone or bourdon".'
  - id: n13
    cau: Musette (nhạc cụ) bơm hơi bằng ống bễ, thịnh hành ở cung đình Pháp (chỗ sửa).
    loai: lich-su
    nguon: [ brit-musette, ed-musette ]
    ket_qua: da-sua
    ghi_chu: 'Cũ: "người chơi bơm hơi bằng một ống bễ kẹp dưới cánh tay thay vì thổi bằng miệng. Thế kỷ 17–18, nó thịnh hành trong giới quý tộc Pháp, gắn với giấc mơ về đời sống đồng quê, mục đồng." Mới: "người chơi bơm hơi bằng một ống bễ thay vì thổi bằng miệng. Thế kỷ 17–18, nó thịnh hành trong giới cung đình Pháp." Nguồn đã mở (Britannica, COD, Edinburgh) nói ống bễ và giới cung đình, không nói kẹp dưới cánh tay hay mối gắn với đời sống mục đồng (chỉ Wikipedia, không dẫn nguồn). Review D6-L1-gom: chữ trang khớp câu (ống bễ, cung đình Pháp); lượt 2 xác nhận. Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/musette", "https://www.britannica.com/art/musette" ]
    luot_2_ghi_chu: Như n9, n10.
    review: dung
  - id: n14
    cau: Link Âm ngoài hợp âm.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'src/content/docs/nhac-ly/18-am-ngoai-hop-am.md có dòng "Âm nền (pedal point)". Review D6-L1-gom: nhac-ly/18-am-ngoai-hop-am có dòng "Âm nền (pedal point)". Đúng.'
    review: dung
  - id: n15
    cau: Những bản nhạc mang tên musette thường có tính chất đồng quê và hay nằm trong tổ khúc.
    loai: lich-su
    nguon: [ nbs-808, cod-musette ]
    ket_qua: dung
    ghi_chu: 'Hội Bach Hà Lan: Musette là "a simple pastorale dance often used by French composers like Rameau and Couperin"; COD: một kiểu gavotte (điệu nhảy của tổ khúc).'
