  - cu: "Musette vừa là tên một nhạc cụ, vừa là tên một kiểu bản nhạc. Nhạc cụ ấy, gọi đầy đủ là musette de cour (musette cung đình), là một loại kèn túi nhỏ của Pháp: người chơi bơm hơi bằng một ống bễ kẹp dưới cánh tay thay vì thổi bằng miệng. Thế kỷ 17–18, nó thịnh hành trong giới quý tộc Pháp, gắn với giấc mơ về đời sống đồng quê, mục đồng."
    moi: "Musette vừa là tên một nhạc cụ, vừa là tên một kiểu bản nhạc. Nhạc cụ ấy, gọi đầy đủ là musette de cour (musette cung đình), là một loại kèn túi nhỏ của Pháp: người chơi bơm hơi bằng một ống bễ thay vì thổi bằng miệng. Thế kỷ 17–18, nó thịnh hành trong giới cung đình Pháp."
    ly_do: "n13 (da-sua): Britannica, COD, Edinburgh nói ống bễ và giới cung đình Pháp; không nguồn đọc được nói kẹp dưới cánh tay hay giấc mơ mục đồng."
  - cu: 'Bài là số 22 trong cuốn sổ tay thứ hai mà J. S. Bach bắt đầu cho vợ, ca sĩ Anna Magdalena Bach, năm 1725 (chuyện về cuốn sổ có ở trang Minuet Sol trưởng). Phần lớn các bài trong sổ do chính bà chép, và nhiều bài không ghi tên tác giả. Ngay trước Musette là một minuet ghi rõ "Menuet fait par Mons. Böhm", tức của Georg Böhm; vài bài trước nữa là những bản hành khúc và polonaise thường được ghi là của Carl Philipp Emanuel Bach, con trai J. S. Bach. Riêng Musette thì không rõ tác giả. Thế kỷ 19 in nó như nhạc của Bach; danh mục BWV xếp nó vào phụ lục (Anhang, viết tắt Anh.), cùng nhóm với những bài còn nghi vấn (cách đọc ký hiệu: Đọc tên tác phẩm).'
