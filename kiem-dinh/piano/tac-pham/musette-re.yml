    nguoi:
      luot_1: "Claude Opus 5.5 (D6-L1 phần A)"
      luot_2: Claude Opus 5.5 (lượt 2 nhánh gom D6-L1, 06/11/2026, bốn phần; bổ sung sau review)
      review: Claude Opus 5.5 (review D6-L1-gom, 05/11/2026)
