    luot_2_ghi_chu: "Sakai và cộng sự 2006 (J Hand Surg Am, PubMed 16713851): quãng tám và hợp âm chiếm 74% kỹ thuật người bệnh đang tập khi bắt đầu bị chấn thương do dùng quá mức. PLoS One 2022 (PMC8939780): chơi quãng tám dồn tải lên vùng mu cẳng tay; chấn thương nghề của nghệ sĩ piano chủ yếu ở cổ tay và cẳng tay, thường do dùng quá mức. Factsheet BAPAM 'The Healthy Pianist': 'practise minimising tension between repetitive octaves', mở bàn tay tự nhiên từ cổ tay mềm, phối hợp cổ tay và cánh tay thay vì gồng duỗi ngón. Xoay cẳng tay giữa ngón 5 và ngón 1 là cách dạy phổ biến; các nguồn y khoa không nói riêng về nó nhưng hợp các nguyên tắc trên. Bè trầm quãng tám Rê2–Rê3 liên tục: xác nhận trên bản Mutopia (ô 1–2, 5–6)."
