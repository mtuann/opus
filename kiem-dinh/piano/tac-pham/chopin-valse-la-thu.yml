ghi_chu: 'Bài học Valse La thứ B. 150 (tầng Tác phẩm). Bản nhạc: bản LilyPond chép theo bản thảo ở Paris (kho rdj/music trên GitHub, chopin-b150-waltz-in-a-minor.ly, tải ngày 05/11/2026; có \barNumberCheck): A ô 1–16, ‖: B :‖ ô 17–24, ‖: A'' C :‖ ô 25–40, A'''' ô 41–52, coda ô 53–56, 56 ô và một phách lấy đà. Bản IMSLP (PDF) không mở (bị chặn). Lịch sử: IMSLP (wikitext), Henle HN 131 (Bemerkungen/Comments, Vorwort), Henle HN 1822 (trang mẫu có lời bình Valse La thứ), Ấn bản Quốc gia Ba Lan (bảng số WN), Henle blog (valse 2024). Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/chopin-valse-la-thu. Sửa trang: n1 (bỏ "với nhiều người là bản Chopin đầu tiên", thay bằng mức Henle; cả description), n4 (chặng: "vừa sức người mới qua chặng sơ cấp" sai với chặng 5 đã khóa), n10, n12 (bối cảnh valse: bỏ "món không thể thiếu của các phòng khách", "khoảnh khắc ngẫu hứng" thành "chỗ co giãn nhịp"), n16 (bỏ Prod''homme 1939 và "số đặc biệt": không mở được nguồn), n20 (Op. 34 số 2: bỏ "dài hơn", thêm mức Henle), n24 (bỏ đánh giá về Lipatti, Rubinstein), n33 và n34 (coda: bỏ "nhỏ dần đến lặng", bản thảo không ghi), n69 (link cùng chặng: Clementi, Arabesque ở chặng 3; thay bằng hai bài chặng 5). Chưa chắc: n56 (học trò kể về rubato), n62 (nốt hoa mỹ vào đúng phách, theo Eigeldinger), n78 (bản WIMA 1999 và 56 ô), n79 (sách Brown 1960): chỉ có sách in hay PDF IMSLP bị chặn. Khuông: ba khối đều là ví dụ soạn, đúng. Thuật ngữ (Allegretto, rubato, rondo, trill, legato) có trong src/data/thuat-ngu.yml; "đạp trễ" là chữ của trang piano/ban-dap (đã khóa, mục Bàn đạp nối).'
