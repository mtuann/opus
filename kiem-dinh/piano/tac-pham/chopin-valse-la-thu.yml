nhan_dinh:
  - id: n1
    cau: Đây là valse dễ nhất của Chopin theo thang độ khó của Henle.
    loai: cap-do
    nguon: [henle-hn131]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (câu mở đầu và description): "Với nhiều người, đây là bản nhạc Chopin đầu tiên: nó dạy tay trái valse, …". Chữ mới: "Đây là valse dễ nhất của Chopin theo thang độ khó của Henle: nó dạy tay trái valse, …". Lý do: "với nhiều người là bản Chopin đầu tiên" không đo được; Henle HN 131 xếp "Waltz a minor KK IVb,11" mức 3, thấp nhất trong các valse của tập (op. 18 mức 6, op. 34 mức 5–6, op. 42 mức 7, op. 64 mức 6, op. 70,3 mức 5, KK IVa,12/13/14/15 mức 5–6, KK IVb,10 mức 4).'
  - id: n2
    cau: Bài là một bản valse ngắn, không có số opus, chỉ được in sau khi Chopin mất.
    loai: lich-su
    nguon: [imslp-b150, henle-hn131-bem]
    ket_qua: dung
    ghi_chu: 'IMSLP: Op./Cat. No. "B.150 ; CT 224" (không opus), in 1860 (Chopin mất 1849). Henle: in 1955. rdj: 56 ô. "Buồn và giản dị" là diễn giải (La thứ).'
  - id: n3
    cau: Bài dạy tay trái valse, giai điệu hát, bàn đạp mỗi ô nhịp và những bước đầu của rubato.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Phần kiểm được (tay trái nốt trầm – hợp âm – hợp âm) ở n6.'
  - id: n4
    cau: Bài có đủ nét phong cách Chopin (giai điệu hát, tay trái nhảy, bàn đạp, rubato) ở mức vừa sức người đã vững trình độ trung cấp.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhưng ở mức độ vừa sức người mới qua chặng sơ cấp." Chữ mới: "nhưng ở mức độ vừa sức người đã vững trình độ trung cấp." Lý do: src/data/tac-pham.yml (đã khóa) chang 5, grade Grade 5–6; src/data/cap-do.yml: chặng 2 "Sơ cấp", chặng 4 "Trung cấp", chặng 5 "Trung cấp cao". Grade đã kiểm ở hồ sơ bản ghi lần 1 (ABRSM Grade 6).'
  - id: n5
    cau: Bài có giai điệu hát, tay trái nhảy kiểu valse.
    loai: cau-truc
    nguon: &r
      - rdj-b150
    ket_qua: dung
    ghi_chu: 'rdj: tay phải a8( b c4) c | d8( e f2) … có dấu luyến; tay trái a,,4 <a'''' c e> q (nốt trầm rồi hợp âm cách hơn quãng 8).'
  - id: n6
    cau: 'Tay trái valse: nốt trầm ở phách 1, hai hợp âm ở phách 2 và 3.'
    loai: cau-truc
    nguon: *r
    ket_qua: dung
    ghi_chu: 'rdj: a,,4 <a'''' c e> q | d,, <a'''' d f> q … gần như mọi ô. Vế "hình đệm này lặp lại trong hàng trăm tác phẩm Lãng mạn; học kỹ một lần, dùng mãi" là lời giới thiệu (khuyên tập).'
  - id: n7
    cau: Giai điệu đơn giản, có vài nốt hoa mỹ nhỏ.
    loai: cau-truc
    nguon: *r
    ket_qua: dung
    ghi_chu: 'rdj: \grace { e16^( f } ô 4, 12, 20, 22, 23, 28, 35, 36, 39, 44; \prall ô 33, 38, 51. Vế "chuẩn bị tốt cho Nocturne Op. 9 số 2" là lời khuyên.'
  - id: n8
    cau: Bàn đạp mỗi ô là bài tập tự nhiên cho kỹ thuật đạp trễ (nhấn sau nốt trầm, đổi đúng lúc).
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: '"Đạp trễ" (bàn đạp nối) là cách gọi của trang piano/ban-dap (đã khóa).'
  - id: n9
    cau: Đoạn giữa chuyển sang La trưởng, cùng nốt chủ âm với La thứ.
    loai: cau-truc
    nguon: *r
    ket_qua: dung
    ghi_chu: 'rdj ô 33–40: cs, fs (Đô♯, Fa♯), tay trái <e'' a cs> (La trưởng), kết a4 ô 40.'
  - id: n10
    cau: Valse (waltz) là điệu nhảy nhịp 3 đến từ vùng nói tiếng Đức, điệu khiêu vũ thịnh hành nhất thế kỷ 19.
    loai: dinh-nghia
    nguon: [britannica-waltz]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… đến từ vùng nói tiếng Đức, phổ biến khắp châu Âu đầu thế kỷ 19, và là món không thể thiếu của các phòng khách (salon) ở Paris, nơi Chopin sống từ năm 1831." Chữ mới: "… đến từ vùng nói tiếng Đức, điệu khiêu vũ thịnh hành nhất thế kỷ 19; Chopin sống ở Paris từ năm 1831." Lý do: Britannica: "(from German walzen…) highly popular ballroom dance evolved from the Ländler… in 3/4 time… the ballroom dance par excellence of the 19th century"; "món không thể thiếu của các phòng khách ở Paris" không tìm được nguồn.'
  - id: n11
    cau: Chopin sống ở Paris từ năm 1831.
    loai: nam
    nguon: [chopin-pl-paris]
    ket_qua: dung
    ghi_chu: 'chopin.pl: "Fryderyk Chopin arrived in Paris on October 5, 1831."'
  - id: n12
    cau: 'Valse của Chopin là nhạc để nghe hơn là để nhảy: ông giữ nhịp 3 và tay trái kiểu valse, nhưng thêm vào đó nỗi buồn, sự tinh tế và những chỗ co giãn nhịp.'
    loai: lich-su
    nguon: [henle-hn1822]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… nỗi buồn, sự tinh tế và những khoảnh khắc ngẫu hứng." Chữ mới: "… nỗi buồn, sự tinh tế và những chỗ co giãn nhịp." Lý do: Henle HN 1822: "With his waltzes Chopin … by no means intended people to get up and dance. Thus although his waltzes take up the swaying air of this fashionable dance of the time, they are first and foremost gossamer-like pieces, often infused with a tender melancholy that would also understandably be unsuitable for dancing due to their frequent change of tempo and subtle rhythmic shifts." Nguồn nói "change of tempo", không nói "ngẫu hứng".'
  - id: n13
    cau: 'Lúc còn sống, Chopin chỉ cho in tám bản valse: Op. 18, ba bản Op. 34, Op. 42 và ba bản Op. 64.'
    loai: so-lieu
    nguon: [ne-numbering, henle-hn131-vorwort]
    ket_qua: dung
    ghi_chu: 'Ấn bản Quốc gia, series A (tác phẩm in lúc Chopin sống): 18 Waltz (1834), 34 3 Waltzes (1838), 42 Waltz (1840), 64 3 Waltzes (1847): 1 + 3 + 1 + 3 = 8. Henle: "the waltzes op. 18, 34, 42 and 64, which were published during Chopin’s lifetime".'
  - id: n14
    cau: Sau khi Chopin mất, người bạn Julian Fontana in thêm các bản Op. 69 và Op. 70 (1855).
    loai: lich-su
    nguon: [henle-hn131-vorwort, henle-hn131-bem, imslp-op69, imslp-op70]
    ket_qua: dung
    ghi_chu: 'Henle Preface: "After the death of the composer, Julian Fontana, his friend and collaborator, published a number of Frederic Chopin’s posthumous works … waltzes op. 69 and 70"; bảng Henle: op. 69, 70 "Date of publication 1855". IMSLP Op. 69: Editor Julian Fontana; ghi thêm một số valse (69 số 2, 70 số 2) đã in sớm hơn năm 1852 (Krakow: Wildt), không trái với câu (câu nói ấn bản của Fontana).'
  - id: n15
    cau: Bài được in năm 1860 nhưng mang tên người khác, là số 3 của tập 4 Pièces pour piano đề tên Charlotte de Rothschild.
    loai: nam
    nguon: [imslp-b150]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Year of First Publication=1860 in 4 Pièces pour piano (Rothschild, Charlotte de) (No.3)*", "[*] Published as Valse by Charlotte de Rothschild (1825–1899)". Khớp kiem-dinh/cap-nhat.yml n30, blog phien-ban-15 n26.'
  - id: n16
    cau: Năm 1955, bài được in trong tạp chí La Revue musicale và được công nhận là của Chopin.
    loai: nam
    nguon: [henle-hn131-bem, henle-hn1822]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Năm 1939, nhà nghiên cứu Jacques-Gabriel Prod''homme giới thiệu bản valse La thứ này trên tạp chí *The Musical Quarterly*; năm 1955, nó được in trong một số đặc biệt của tạp chí *La Revue musicale* và được công nhận là của Chopin." Chữ mới: "Năm 1955, nó được in trong tạp chí *La Revue musicale* và được công nhận là của Chopin." Lý do: chi tiết Prod''homme 1939 chỉ thấy ở Wikipedia (bậc 3); Crossref: bài của J.-G. Prod''homme trong The Musical Quarterly 25(1), 1939, tr. 34–47 tên "Two Musical Libraries of Paris" (DOI 10.1093/mq/XXV.1.34), không đọc được nội dung (trả phí). "Số đặc biệt" không có ở Henle. Henle Comments: "This piece first appeared in print in the French periodical La Revue Musicale (1955)"; HN 1822: "The Waltz was only published in 1955 in the periodical La Revue musicale". Henle in bài trong tập valse của Chopin (KK IVb no. 11).'
  - id: n17
    cau: 'Các ký hiệu B., KK, WN là số trong các danh mục tác phẩm Chopin do Maurice Brown, Krystyna Kobylańska và Ấn bản Quốc gia Ba Lan lập ra.'
    loai: danh-muc
    nguon: [imslp-b150, henle-hn131-bem, ne-numbering]
    ket_qua: dung
    ghi_chu: 'Henle Comments: "KK = Krystyna Kobylanska: Frédéric Chopin, Thematisch-bibliographisches Werkverzeichnis"; Ấn bản Quốc gia: WN 63 Waltz A minor; IMSLP: B.150. B. = Brown: tựa sách của Brown (Chopin: An Index of His Works in Chronological Order) chỉ thấy ở Wikipedia, nhưng số "B." trên IMSLP là danh mục Brown (IMSLP dùng ký hiệu này cho mọi tác phẩm Chopin).'
  - id: n18
    cau: Vì không có số opus, bài được gọi bằng một trong các số danh mục, hoặc "Valse La thứ (di cảo)".
    loai: ten
    nguon: [imslp-b150, henle-hn131]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Waltz in A minor, B.150"; Henle: "Waltz a minor KK IVb,11"; RCM 2022: "Waltz in A Minor, op. posth., B 150".'
  - id: n19
    cau: Link "Đọc tên tác phẩm" (/opus/nghe-nhac/doc-ten-tac-pham/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển; site cũ ../opus-zero/docs/nghe-nhac/doc-ten-tac-pham.md có, nói về số opus và các danh mục tác phẩm. Điều cần giữ: trang ấy giải thích số danh mục khi không có opus.'
  - id: n20
    cau: Chopin còn có Valse La thứ Op. 34 số 2, một bản Lento khó hơn nhiều (Henle xếp mức 5, bài này mức 3).
    loai: cap-do
    nguon: [imslp-op34, henle-hn131]
    ket_qua: da-sua
