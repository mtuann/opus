khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem: [cu-phap, giong, hop-am, so-ngon, ban-dap]
    ket_qua: dung
    ghi_chu: 'Tay trái valse, La thứ, 3/4, L:1/4: mỗi ô 3 phách. Tiến trình Am – E7 (D G♯ B trên E) – E7 – Am – Dm – Am – E7 – Am; nốt trầm ngón 5, hợp âm ba nốt (4-2-1 hay 5-3-1 chơi được). "Ped." mỗi ô ở nốt trầm, "*" ở ô cuối: đúng chú thích (đổi bàn đạp sau nốt trầm). Mức khó hợp chặng 5.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [cu-phap, giong, hop-am, so-ngon, not-hoa-my]
    ket_qua: dung
    ghi_chu: 'Giai điệu trên tay trái valse, La thứ, 3/4, L:1/8: mỗi ô 6. Tay trái cùng tiến trình khối 1. Giai điệu e–d–c | B–G♯ | B–c–d | A | f–e–d | c–e | d–c–B | A: nốt hợp âm ở phách mạnh (E, B, G♯ trên E7; F trên Dm), nốt lướt d, c, e. Nốt hoa mỹ {/c} ô 2, {/d} ô 6; Mi ô 1 và Fa ô 5 là nốt trắng: đúng chú thích. Ngón 5-4-3 | 2-1 | 2-3-4 | 1 … chơi được.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [cu-phap, giong, hop-am, so-ngon]
    ket_qua: dung
    ghi_chu: 'Hợp âm rải đi lên, La thứ, 3/4, L:1/16: mỗi ô 12. Tay phải E A c (1-2-3) rồi ngón cái luồn sang e (1), a (4): đúng chú thích "ngón cái luồn dưới ngón 3"; ô 2 E G♯ B e g♯ trên E7. Mô phỏng hình rải ô 21 của bản nhạc (n27) ở mức dễ hơn.'
doi_chu:
- cu: La thứ · 3/4 Allegretto ≈ Grade 3–4 Rondo nhỏ
  moi: La thứ · 3/4 Allegretto ≈ Grade 5–6 Rondo nhỏ
  ly_do: 'Chip cấp độ dựng từ bản ghi tac-pham/chopin-valse-la-thu: D2-0 sửa grade Grade 3–4 thành Grade 5–6 và chang 3 thành 5 (ABRSM Grade 6, 2025 & 2026 và 2027 & 2028; RCM Level 6; plans/lam-lai/bao-cao/d2-0/sua-A.yml, hồ sơ du-lieu/tac-pham/chopin-valse-la-thu n4, n5).'
- cu: Khoảng ABRSM Grade 3–4 (ước lượng); một trong những valse dễ nhất của Chopin
  moi: 'Khoảng ABRSM Grade 5–6: ABRSM xếp bài ở Grade 6 (đề cương 2025–2026 và 2027–2028), RCM Level 6; Henle mức 3. Một trong những valse dễ nhất của Chopin'
  ly_do: Dòng Độ khó của thong_tin sửa ở D2-0 theo đề cương ABRSM và RCM (sua-A.yml); lượt 1 D6-L2 kiểm lại ở hồ sơ bản ghi.
- cu: 'mô tả: Một bản valse ngắn, buồn và giản dị, không có số opus, chỉ được in sau khi Chopin mất. Với nhiều người, đây là bản nhạc Chopin đầu tiên: nó dạy tay trái valse…'
  moi: 'mô tả: Một bản valse ngắn, buồn và giản dị, không có số opus, chỉ được in sau khi Chopin mất. Đây là valse dễ nhất của Chopin theo thang độ khó của Henle: nó dạy…'
  ly_do: 'n1 (da-sua), mô tả trang: "với nhiều người là bản Chopin đầu tiên" không đo được; Henle HN 131 xếp bài mức 3, thấp nhất trong các valse.'
- cu: 'Một bản valse ngắn, buồn và giản dị, không có số opus, chỉ được in sau khi Chopin mất. Với nhiều người, đây là bản nhạc Chopin đầu tiên: nó dạy tay trái valse, giai điệu hát, bàn đạp mỗi ô nhịp và những bước đầu của rubato.'
  moi: 'Một bản valse ngắn, buồn và giản dị, không có số opus, chỉ được in sau khi Chopin mất. Đây là valse dễ nhất của Chopin theo thang độ khó của Henle: nó dạy tay trái valse, giai điệu hát, bàn đạp mỗi ô nhịp và những bước đầu của rubato.'
  ly_do: 'n1 (da-sua): như mô tả trang.'
- cu: Cửa vào Chopin. Phong cách của Chopin (giai điệu hát, tay trái nhảy, bàn đạp, rubato) có đủ ở đây, nhưng ở mức độ vừa sức người mới qua chặng sơ cấp.
  moi: Cửa vào Chopin. Phong cách của Chopin (giai điệu hát, tay trái nhảy, bàn đạp, rubato) có đủ ở đây, nhưng ở mức độ vừa sức người đã vững trình độ trung cấp.
  ly_do: 'n4 (da-sua): bài ở chặng 5 (Trung cấp cao, Grade 6) theo tac-pham.yml và cap-do.yml đã khóa, không phải ngay sau chặng 2 (Sơ cấp).'
- cu: 'Valse (waltz) là điệu nhảy nhịp 3 đến từ vùng nói tiếng Đức, phổ biến khắp châu Âu đầu thế kỷ 19, và là món không thể thiếu của các phòng khách (salon) ở Paris, nơi Chopin sống từ năm 1831. Valse của Chopin là nhạc để nghe hơn là để nhảy: ông giữ nhịp 3 và tay trái kiểu valse, nhưng thêm vào đó nỗi buồn, sự tinh tế và những khoảnh khắc ngẫu hứng.'
  moi: 'Valse (waltz) là điệu nhảy nhịp 3 đến từ vùng nói tiếng Đức, điệu khiêu vũ thịnh hành nhất thế kỷ 19; Chopin sống ở Paris từ năm 1831. Valse của Chopin là nhạc để nghe hơn là để nhảy: ông giữ nhịp 3 và tay trái kiểu valse, nhưng thêm vào đó nỗi buồn, sự tinh tế và những chỗ co giãn nhịp.'
  ly_do: 'n10, n12 (da-sua): Britannica ("the ballroom dance par excellence of the 19th century"); "món không thể thiếu của các phòng khách ở Paris" không có nguồn; Henle HN 1822 nói "frequent change of tempo and subtle rhythmic shifts", không nói ngẫu hứng.'
- cu: 'Lúc còn sống, Chopin chỉ cho in tám bản valse (Op. 18, ba bản Op. 34, Op. 42 và ba bản Op. 64). Sau khi ông mất, người bạn Julian Fontana in thêm các bản Op. 69 và Op. 70 (1855); những bản không có số opus, trong đó có bài này, xuất hiện muộn hơn nữa. Bài này được in năm 1860 nhưng mang tên người khác: nó là số 3 của tập 4 Pièces pour piano đề tên Charlotte de Rothschild. Năm 1939, nhà nghiên cứu Jacques-Gabriel Prod''homme giới thiệu bản valse La thứ này trên tạp chí The Musical Quarterly; năm 1955, nó được in trong một số đặc biệt của tạp chí La Revue musicale và được công nhận là của Chopin.'
  moi: 'Lúc còn sống, Chopin chỉ cho in tám bản valse (Op. 18, ba bản Op. 34, Op. 42 và ba bản Op. 64). Sau khi ông mất, người bạn Julian Fontana in thêm các bản Op. 69 và Op. 70 (1855); những bản không có số opus, trong đó có bài này, xuất hiện muộn hơn nữa. Bài này được in năm 1860 nhưng mang tên người khác: nó là số 3 của tập 4 Pièces pour piano đề tên Charlotte de Rothschild. Năm 1955, nó được in trong tạp chí La Revue musicale và được công nhận là của Chopin.'
  ly_do: 'n16 (da-sua): chi tiết Prod''homme 1939 và "số đặc biệt" chỉ thấy ở Wikipedia; Henle (HN 131 Comments, HN 1822): bài in lần đầu dưới tên Chopin trong La Revue musicale năm 1955.'
- cu: 'Chopin còn có Valse La thứ Op. 34 số 2: một bản Lento dài hơn và khó hơn nhiều. Năm 2024 còn có một bản valse La thứ rất ngắn được công bố từ một bản thảo tìm thấy ở Thư viện và Bảo tàng Morgan (New York). Bài trên trang này là bản B. 150.'
  moi: 'Chopin còn có Valse La thứ Op. 34 số 2: một bản Lento khó hơn nhiều (Henle xếp mức 5, bài này mức 3). Năm 2024 còn có một bản valse La thứ rất ngắn được công bố từ một bản thảo tìm thấy ở Thư viện và Bảo tàng Morgan (New York). Bài trên trang này là bản B. 150.'
  ly_do: 'n20 (da-sua): "dài hơn" chưa đếm được trên bản nhạc; mức khó theo Henle HN 131.'
- cu: 'Rồi nghe Valse Si thứ Op. 69 số 2, bản bạn sẽ học tiếp, qua bản thu của Dinu Lipatti và Arthur Rubinstein. Nhiều người thấy Lipatti thanh thoát và chặt chẽ hơn, Rubinstein ung dung như đang trò chuyện: hãy tự nghe và quyết định. Muốn hiểu lối hát của Chopin, nghe bản thu kèm bản đồ nghe trong bài học Nocturne Op. 9 số 2.'
  moi: 'Rồi nghe Valse Si thứ Op. 69 số 2, bản bạn sẽ học tiếp, qua hai bản thu khác nhau: bản nào thanh thoát và chặt chẽ hơn, bản nào ung dung như đang trò chuyện? Hãy tự nghe và quyết định. Muốn hiểu lối hát của Chopin, nghe bản thu kèm bản đồ nghe trong bài học Nocturne Op. 9 số 2.'
  ly_do: 'n24 (da-sua): "nhiều người thấy" là đánh giá không có nguồn; tên hai bản thu bỏ vì chưa mở được nguồn cho bản Rubinstein. (Chữ hiển thị viết tay: các link tới trang chưa chuyển hiện "sắp có"; người giao đối chiếu với so-chu.mjs.)'
