nhan_dinh:
  - id: n1
    cau: Đây là valse dễ nhất của Chopin theo thang độ khó của Henle.
    loai: cap-do
    nguon: [ henle-hn131 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (câu mở đầu và description): "Với nhiều người, đây là bản nhạc Chopin đầu tiên: nó dạy tay trái valse, …". Chữ mới: "Đây là valse dễ nhất của Chopin theo thang độ khó của Henle: nó dạy tay trái valse, …". Lý do: "với nhiều người là bản Chopin đầu tiên" không đo được; Henle HN 131 xếp "Waltz a minor KK IVb,11" mức 3, thấp nhất trong các valse của tập (op. 18 mức 6, op. 34 mức 5–6, op. 42 mức 7, op. 64 mức 6, op. 70,3 mức 5, KK IVa,12/13/14/15 mức 5–6, KK IVb,10 mức 4). Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/en/Waltzes/HN-131", "https://www.henle.de/media/2a/f6/a2/1686734195/hn_1822_a_chopin_s_6-7_sj.pdf" ]
    luot_2_ghi_chu: "Henle HN 131: Waltz a minor KK IVb,11 mức 3 (easy), các bản valse khác mức 4–7; HN 1822 cũng ghi 'Level of difficulty 3'."
    review: dung
  - id: n2
    cau: Bài là một bản valse ngắn, không có số opus, chỉ được in sau khi Chopin mất.
    loai: lich-su
    nguon: [ imslp-b150, henle-hn131-bem ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Op./Cat. No. "B.150 ; CT 224" (không opus), in 1860 (Chopin mất 1849). Henle: in 1955. rdj: 56 ô. "Buồn và giản dị" là diễn giải (La thứ).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Waltz_in_A_minor,_B.150_(Chopin,_Frédéric)", "https://www.henle.de/media/2a/f6/a2/1686734195/hn_1822_a_chopin_s_6-7_sj.pdf" ]
    luot_2_ghi_chu: "IMSLP: Op./Cat. No. B.150, không có opus; in lần đầu 1860 (Chopin mất 1849). Henle HN 1822: in năm 1955."
  - id: n3
    cau: Bài dạy tay trái valse, giai điệu hát, bàn đạp mỗi ô nhịp và những bước đầu của rubato.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Phần kiểm được (tay trái nốt trầm – hợp âm – hợp âm) ở n6.'
  - id: n4
    cau: Bài có đủ nét phong cách Chopin (giai điệu hát, tay trái nhảy, bàn đạp, rubato) ở mức vừa sức người đã vững trình độ trung cấp.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhưng ở mức độ vừa sức người mới qua chặng sơ cấp." Chữ mới: "nhưng ở mức độ vừa sức người đã vững trình độ trung cấp." Lý do: src/data/tac-pham.yml (đã khóa) chang 5, grade Grade 5–6; src/data/cap-do.yml: chặng 2 "Sơ cấp", chặng 4 "Trung cấp", chặng 5 "Trung cấp cao". Grade đã kiểm ở hồ sơ bản ghi lần 1 (ABRSM Grade 6). Review D6-L2-gom: cap-do.yml: chặng 4 "Trung cấp", chặng 5 "Trung cấp cao"; bài chặng 5, grade 5–6 (đã khóa): "người đã vững trình độ trung cấp" khớp. Đúng.'
    review: dung
  - id: n5
    cau: Bài có giai điệu hát, tay trái nhảy kiểu valse.
    loai: cau-truc
    nguon: &r
      - rdj-b150
    ket_qua: dung
    ghi_chu: 'rdj: tay phải a8( b c4) c | d8( e f2) … có dấu luyến; tay trái a,,4 <a'''' c e> q (nốt trầm rồi hợp âm cách hơn quãng 8).'
    luot_2: dung
    luot_2_nguon: [ "https://raw.githubusercontent.com/rdj/music/HEAD/chopin-b150-waltz-in-a-minor.ly" ]
    luot_2_ghi_chu: "Bản LilyPond (theo bản thảo BnF): tay phải giai điệu có luyến dài, tay trái nốt trầm phách 1, hợp âm phách 2–3."
  - id: n6
    cau: 'Tay trái valse: nốt trầm ở phách 1, hai hợp âm ở phách 2 và 3.'
    loai: cau-truc
    nguon: *r
    ket_qua: dung
    ghi_chu: 'rdj: a,,4 <a'''' c e> q | d,, <a'''' d f> q … gần như mọi ô. Vế "hình đệm này lặp lại trong hàng trăm tác phẩm Lãng mạn; học kỹ một lần, dùng mãi" là lời giới thiệu (khuyên tập).'
    luot_2: dung
    luot_2_nguon: [ "https://raw.githubusercontent.com/rdj/music/HEAD/chopin-b150-waltz-in-a-minor.ly" ]
    luot_2_ghi_chu: "LY: tay trái mỗi ô dạng a,,4 <a'' c e> q (nốt trầm, rồi hai hợp âm ba nốt)."
  - id: n7
    cau: Giai điệu đơn giản, có vài nốt hoa mỹ nhỏ.
    loai: cau-truc
    nguon: *r
    ket_qua: dung
    ghi_chu: 'rdj: \grace { e16^( f } ô 4, 12, 20, 22, 23, 28, 35, 36, 39, 44; \prall ô 33, 38, 51. Vế "chuẩn bị tốt cho Nocturne Op. 9 số 2" là lời khuyên.'
    luot_2: dung
    luot_2_nguon: [ "https://raw.githubusercontent.com/rdj/music/HEAD/chopin-b150-waltz-in-a-minor.ly", "https://www.henle.de/media/2a/f6/a2/1686734195/hn_1822_a_chopin_s_6-7_sj.pdf" ]
    luot_2_ghi_chu: "LY: nốt hoa mỹ \\grace {e16 f} ở ô 4, 12, 18–20, 22…; Henle: 'The little ornaments'."
  - id: n8
    cau: Bàn đạp mỗi ô là bài tập tự nhiên cho kỹ thuật đạp trễ (nhấn sau nốt trầm, đổi đúng lúc).
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: '"Đạp trễ" (bàn đạp nối) là cách gọi của trang piano/ban-dap (đã khóa).'
  - id: n9
    cau: Đoạn giữa chuyển sang La trưởng, cùng nốt chủ âm với La thứ.
    loai: cau-truc
    nguon: *r
    ket_qua: dung
    ghi_chu: 'rdj ô 33–40: cs, fs (Đô♯, Fa♯), tay trái <e'' a cs> (La trưởng), kết a4 ô 40.'
    luot_2: dung
    luot_2_nguon: [ "https://raw.githubusercontent.com/rdj/music/HEAD/chopin-b150-waltz-in-a-minor.ly" ]
    luot_2_ghi_chu: "LY: ô 33–40 có Đô♯, Fa♯, Sol♯ (La trưởng), tay trái E7 – A; La trưởng và La thứ cùng chủ âm La."
  - id: n10
    cau: Valse (waltz) là điệu nhảy nhịp 3 đến từ vùng nói tiếng Đức, điệu khiêu vũ thịnh hành nhất thế kỷ 19.
    loai: dinh-nghia
    nguon: [ britannica-waltz ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… đến từ vùng nói tiếng Đức, phổ biến khắp châu Âu đầu thế kỷ 19, và là món không thể thiếu của các phòng khách (salon) ở Paris, nơi Chopin sống từ năm 1831." Chữ mới: "… đến từ vùng nói tiếng Đức, điệu khiêu vũ thịnh hành nhất thế kỷ 19; Chopin sống ở Paris từ năm 1831." Lý do: Britannica: "(from German walzen…) highly popular ballroom dance evolved from the Ländler… in 3/4 time… the ballroom dance par excellence of the 19th century"; "món không thể thiếu của các phòng khách ở Paris" không tìm được nguồn. Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Waltz" ]
    luot_2_ghi_chu: "Grove (Dictionary of Music and Musicians): tổ tiên thật là Ländler, điệu nhảy ở Bohemia, Áo, Bavaria; nhịp 3/4 hay 3/8; 'immense popularity… in the 19th century'."
    review: dung
  - id: n11
    cau: Chopin sống ở Paris từ năm 1831.
    loai: nam
    nguon: [ chopin-pl-paris ]
    ket_qua: dung
    ghi_chu: 'chopin.pl: "Fryderyk Chopin arrived in Paris on October 5, 1831."'
    luot_2: dung
    luot_2_nguon: [ "https://www.treccani.it/enciclopedia/fryderyk-franciszek-chopin/" ]
    luot_2_ghi_chu: "Treccani: 'si stabilì dal 1831 a Parigi'."
  - id: n12
    cau: 'Valse của Chopin là nhạc để nghe hơn là để nhảy: ông giữ nhịp 3 và tay trái kiểu valse, nhưng thêm vào đó nỗi buồn, sự tinh tế và những chỗ co giãn nhịp.'
    loai: lich-su
    nguon: [ henle-hn1822 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… nỗi buồn, sự tinh tế và những khoảnh khắc ngẫu hứng." Chữ mới: "… nỗi buồn, sự tinh tế và những chỗ co giãn nhịp." Lý do: Henle HN 1822: "With his waltzes Chopin … by no means intended people to get up and dance. Thus although his waltzes take up the swaying air of this fashionable dance of the time, they are first and foremost gossamer-like pieces, often infused with a tender melancholy that would also understandably be unsuitable for dancing due to their frequent change of tempo and subtle rhythmic shifts." Nguồn nói "change of tempo", không nói "ngẫu hứng". Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/2a/f6/a2/1686734195/hn_1822_a_chopin_s_6-7_sj.pdf", "https://www.henle.de/en/Waltzes/HN-131", "https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Waltz" ]
    luot_2_ghi_chu: "Henle HN 1822: Chopin 'by no means intended people to get up and dance', 'tender melancholy', 'frequent change of tempo and subtle rhythmic shifts'; HN 131: 'one cannot and should not dance to them'."
    review: dung
  - id: n13
    cau: 'Lúc còn sống, Chopin chỉ cho in tám bản valse: Op. 18, ba bản Op. 34, Op. 42 và ba bản Op. 64.'
    loai: so-lieu
