  - cu: 'Niên đại chưa thống nhất: Ấn bản Quốc gia Ba Lan xếp vào 1847–1849, Maurice Brown ghi 1843, có học giả cho là sớm hơn nhiều (1832–1833). In lần đầu năm 1860, sau khi Chopin mất, nhưng mang tên người khác: số 3 của tập 4 Pièces pour piano đề tên Charlotte de Rothschild (1825–1899). Được công nhận là của Chopin sau khi tạp chí La Revue musicale (Paris) in năm 1955'
    moi: 'Niên đại chưa thống nhất: Ấn bản Quốc gia Ba Lan xếp vào 1847–1849, Maurice Brown ghi 1843. In lần đầu năm 1860, sau khi Chopin mất, nhưng mang tên người khác: số 3 của tập 4 Pièces pour piano đề tên Charlotte de Rothschild (1825–1899). Được công nhận là của Chopin sau khi tạp chí La Revue musicale (Paris) in năm 1955'
    ly_do: 'Review D6-L2-gom: bản ghi tac-pham/chopin-valse-la-thu n18 (thong_tin): bỏ vế "có học giả cho là sớm hơn nhiều (1832–1833)": chỉ thấy ở Wikipedia (dẫn Belotti 1984, sách in), cả hai lượt và review không tìm được nguồn bậc 1–2.'
  - cu: 'Các album valse kinh điển thường gồm 14 bản quen thuộc, và bản này không nằm trong số đó, nên bạn có thể phải tìm nó trong các bộ thu âm "toàn tập Chopin". Nghe ít nhất hai nghệ sĩ khác nhau, mỗi lần một câu hỏi:'
    moi: 'Một số album valse nổi tiếng chỉ gồm 14 bản, như album 14 Waltzes của Dinu Lipatti, và bản này không nằm trong số đó, nên bạn có thể phải tìm nó trong các bộ thu âm "toàn tập Chopin". Nghe ít nhất hai nghệ sĩ khác nhau, mỗi lần một câu hỏi:'
    ly_do: 'Review D6-L2-gom: n22: "thường gồm 14 bản" không có nguồn (lượt 2: tập Schirmer 15 bản, Henle 19 bản); viết theo nguồn đã có: album 14 Waltzes của Lipatti (BBC Music Magazine), bài này không có trong album (in dưới tên Chopin năm 1955, Henle).'
  - cu: 'Các học trò của Chopin kể rằng khi ông co giãn giai điệu, tay đệm vẫn giữ nhịp (xem trang Nocturne Op. 9 số 2). Với bài này, rubato chỉ cần đơn giản: nán một chút ở nốt cao nhất của câu hoặc ở một bước nhảy đẹp, rồi trả lại thời gian ngay sau đó; chậm lại nhẹ ở cuối đoạn A (câu thứ tư), trước khi vào đoạn B. Không co giãn ở mọi ô.'
    moi: 'Carl Mikuli, một học trò của Chopin, kể rằng khi ông co giãn giai điệu, tay đệm vẫn giữ đúng nhịp (xem trang Nocturne Op. 9 số 2). Với bài này, rubato chỉ cần đơn giản: nán một chút ở nốt cao nhất của câu hoặc ở một bước nhảy đẹp, rồi trả lại thời gian ngay sau đó; chậm lại nhẹ ở cuối đoạn A (câu thứ tư), trước khi vào đoạn B. Không co giãn ở mọi ô.'
    ly_do: 'Review D6-L2-gom: n56: lượt 2 tìm được nguồn là lời tựa của Carl Mikuli (Kistner 1879, Internet Archive gb-lam-0156896; review tự đọc: "Selbst bei seinem so viel verleumdeten Tempo rubato spielte immer eine, die begleitende Hand streng gemessen fort"). Câu viết theo đúng nguồn này: một học trò, không phải "các học trò".'
  - cu: 'Nhiều chuyên gia về Chopin, trong đó có Jean-Jacques Eigeldinger, cho rằng các nốt hoa mỹ nhỏ trong nhạc Chopin thường vào đúng phách, cùng lúc với nốt trầm, chứ không chen vào trước phách. Hãy chơi chúng nhẹ và gọn. Phần lớn bài nằm trong vùng p đến mf; đoạn La trưởng sáng hơn nhưng không cần to hơn; kết bài nhỏ dần đến lặng.'
    moi: 'Lời bình của Ấn bản Quốc gia Ba Lan (Jan Ekier, Paweł Kamiński) cho bài này: chơi nốt đầu của các cặp nốt hoa mỹ cùng lúc với tay trái thì hợp phong cách hơn; nhưng điều quan trọng hơn là chúng nhẹ và nhanh, nên chơi chúng trước phách cũng được. Hãy chơi chúng nhẹ và gọn. Phần lớn bài nằm trong vùng p đến mf; đoạn La trưởng sáng hơn nhưng không cần to hơn; kết bài nhỏ dần đến lặng.'
    ly_do: 'Review D6-L2-gom: n62: bỏ ý của Eigeldinger (sách in, không đọc được, cả hai lượt). Thay bằng lời bình của Ấn bản Quốc gia Ba Lan cho chính bài này (Ekier, Kamiński, Walce seria B, mục "9. Walc a WN 63": "Wykonanie podwójnych przednutek tak, by ich pierwsza nuta wypadła równocześnie z l.r., trzeba uznać za bardziej stylowe. Ważniejszy niż moment uderzenia jest jednak walor brzmieniowy – przednutki powinny być lekkie i szybkie, toteż wykonanie ich w sposób antycypowany jest również dopuszczalne").'
  - cu: 'Bản nhạc dùng để đối chiếu cấu trúc và số ô nhịp: bản khắc của André Van Ryckeghem cho Werner Icking Music Archive (1999), nay có trên IMSLP; và bản LilyPond chép theo bản thảo của Chopin ở Thư viện Quốc gia Pháp, trong kho rdj/music trên GitHub. Hai bản cùng cho 56 ô nhịp, với dấu nhắc lại ở ô 17–24 và ô 25–40.'
    moi: 'Bản nhạc dùng để đối chiếu cấu trúc và số ô nhịp: ấn bản Urtext của G. Henle Verlag (HN 1822, 2017; trang mẫu); và bản LilyPond chép theo bản thảo của Chopin ở Thư viện Quốc gia Pháp, trong kho rdj/music trên GitHub. Hai bản cùng cho 56 ô nhịp, với dấu nhắc lại ở ô 17–24 và ô 25–40.'
    ly_do: 'Review D6-L2-gom: n78: bản WIMA của Van Ryckeghem không mở được (IMSLP chặn PDF), năm 1999 không có nguồn (IMSLP ghi tải lên 2012). Thay bằng trang mẫu Henle HN 1822 (2017), review đọc: Allegretto, 3/4, nhịp lấy đà, 56 ô, dấu nhắc lại ô 17–24 và 25–40.'
