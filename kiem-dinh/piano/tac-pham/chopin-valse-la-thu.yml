  - id: n62
    cau: 'Lời bình của Ấn bản Quốc gia Ba Lan (Jan Ekier, Paweł Kamiński) cho bài này: chơi nốt đầu của các cặp nốt hoa mỹ cùng lúc với tay trái thì hợp phong cách hơn; nhưng quan trọng hơn là chúng nhẹ và nhanh, nên chơi trước phách cũng được.'
    loai: lich-su
    nguon: [ ne-walce-b ]
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: chỉ có sách in (Eigeldinger 1986), không mở được bản trên mạng. Henle HN 1822 về bài này chỉ nói "The little ornaments are to be played in a gentle manner with a delicate touch… as if “en passant”", không nói vào phách. Đề nghị người giao: nếu lượt 2 cũng không có nguồn, viết lại thành lời khuyên ("chơi các nốt hoa mỹ nhỏ nhẹ và gọn, như lướt qua") và bỏ tên Eigeldinger ở đây và ở mục Nguồn. Review D6-L2-gom: cả hai lượt không đọc được Eigeldinger (sách in); lượt 2 khong-chac. Agent con và review tìm được lời bình của Ấn bản Quốc gia cho chính bài này, review tự đọc PDF: "9. Walc a WN 63. Wykonanie podwójnych przednutek tak, by ich pierwsza nuta wypadła równocześnie z l.r., trzeba uznać za bardziej stylowe. Ważniejszy niż moment uderzenia jest jednak walor brzmieniowy – przednutki powinny być lekkie i szybkie, toteż wykonanie ich w sposób antycypowany jest również dopuszczalne. Jan Ekier, Paweł Kamiński". Bài có nốt hoa mỹ kép (hai nốt nhỏ) ở ô 4, 12, 18, 19… (Henle). Viết lại theo nguồn này, bỏ tên Eigeldinger. Gỡ kết quả lượt 2 cũ để lượt 2 bổ sung. doi_chu.'
    review: dung
