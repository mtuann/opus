    ghi_chu: 'Ô 2 (tr. 9 hệ 1): bè dưới móc đơn đuôi xuống Rê♭4 Mi♭4 Fa4 La♭4 | Fa4
      Mi♭4 Rê♭4–Rê♭4 Đô4 là giai điệu; móc kép đuôi lên gồm chính nốt ấy và các
      cặp nốt [Fa La♭], [La♭ Rê♭], [Rê♭ Fa] phía trên. Ở a Tempo 1° (tr. 10 hệ
      3) giai điệu lên nốt cao nhất (xem n15). Review (Claude, 17/11/2026): ô 2 tr. 9 hệ 1 đọc lại ở 400 dpi: giai điệu móc đơn đuôi xuống ở bè dưới, cặp nốt móc kép phía trên.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/768244" ]
    luot_2_ghi_chu: "Bản quét tr. 9–10: tay phải có giai điệu móc đơn đuôi xuống ở
      bè dưới và cặp nốt móc kép (đuôi lên) phía trên, suốt phần Lento."
    review: dung
  - id: n6
    cau: 'Đoạn giữa cần ngón nhanh, hợp âm và quãng tám mạnh tới fff.'
    loai: cau-truc
