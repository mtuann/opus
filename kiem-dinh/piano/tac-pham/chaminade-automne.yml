nhan_dinh:
  - id: n1
    cau: 'Automne là tiếng Pháp, nghĩa là Mùa thu; étude de concert là bài luyện
      ngón viết để biểu diễn trên sân khấu.'
    loai: dinh-nghia
    nguon: [ enoch, trinity-thuat-ngu ]
    ket_qua: dung
    ghi_chu: 'Tựa "AUTOMNE", tập "ÉTUDES DE CONCERT" (tr. 9). Étude: bài luyện; "de
      concert": để biểu diễn (khác étude chỉ để tập).'
    luot_2: dung
    luot_2_nguon:
      [
        "https://fr.wiktionary.org/wiki/automne",
        "https://en.wikipedia.org/wiki/%C3%89tude"
      ]
    luot_2_ghi_chu: "automne = mùa thu (Wiktionary tiếng Pháp, nghĩa 1). Bài Étude
      (mục lịch sử thế kỷ 19): bài luyện vừa có giá trị dạy vừa để chơi cho khán
      giả trong hòa nhạc thì gọi là concert study (Wikipedia chỉ dùng để tìm
      nguồn; không mở được Britannica: trang chặn)."
    review: dung
  - id: n2
    cau: 'Hai đầu bài chậm và hát (Lento), đoạn giữa nhanh, mạnh (Con fuoco: rực
      lửa).'
    loai: cau-truc
    nguon: [ enoch, thuat-ngu-site ]
    ket_qua: dung
    ghi_chu: 'Lento ♪=112 tr. 9; Con fuoco ♩=84, 2/4, f tr. 11 hệ 2; Lento a Tempo
      1° tr. 15. Con fuoco: thuat-ngu.yml "Với lửa, rực lửa". Review (Claude, 17/11/2026): bản quét tr. 9 (Lento ♪ = 112, p), tr. 11 hệ 2 (Con fuoco ♩ = 84, f), tr. 15 (Lento a Tempo 1°): khớp; con fuoco khớp thuat-ngu.yml.'
    luot_2: dung
    luot_2_nguon:
      [
        "https://imslp.org/wiki/Special:ImagefromIndex/768244",
        "https://en.wikipedia.org/wiki/Glossary_of_music_terminology"
