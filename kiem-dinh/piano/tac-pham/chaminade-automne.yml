khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Ô 1–2, C (4/4), K:Db, L:1/16, Q:1/8=112. Ấn bản: enoch tr. 9 hệ 1, đọc
      ở 250–300 dpi, đo dòng kẻ và đầu nốt bằng máy (khuông trên Fa5=94,
      Rê5=115, Si4=135, Sol4=155, Mi4=176 px; khuông dưới La3=353 … Sol2=434
      px). Ô 1: lặng trắng, lặng đen, lặng móc đơn, rồi La♭3 và La♭4 móc kép nối
      vạch đôi, p; La♭3 có thêm đuôi xuống (bè dưới, móc đơn). Tay trái lặng cả
      ô. Ô 2 tay phải: bè trên 8 móc kép (hai vạch nối) Rê♭4 [Fa4 La♭4] Mi♭4
      [Fa4 La♭4] Fa4 [La♭4 Rê♭5] La♭4 [Rê♭5 Fa5]; bè dưới móc đơn Rê♭4 Mi♭4 Fa4
      La♭4 (dùng chung đầu nốt); nửa sau: bè dưới Fa4 Mi♭4 móc kép, Rê♭4 móc đơn
      nối Rê♭4 móc đơn, Đô4 móc đơn; bè trên lặng móc đơn rồi sáu móc kép Rê♭4
      [La♭4 Rê♭5] Rê♭4 [La♭4 Rê♭5] Đô4 [La♭4 Đô5] (vạch phụ in đứt quãng: móc
      đầu và móc thứ tư có vạch cụt, hai móc cuối nối đủ; vị trí đầu nốt cách
      đều theo móc kép nên ghi sáu móc kép). Tay trái ô 2: bè dưới Rê♭2 trắng
      (dòng kẻ phụ Mi2 phía trên) rồi Rê♭2 đen chấm dôi; bè trên móc đơn Rê♭2
      (chung) La♭2 nối La♭2, La♭2 | Rê♭2 (chung) Fa3 nối Fa3, Fa2 (Fa2 đuôi lên
      có cờ, ghi vào bè trên). Luyến: hai vòng luyến tay phải (ô 1 cuối tới hết
      nửa đầu ô 2; nửa sau ô 2) ghi trong ô 2 vì abc khó nối luyến qua & và vạch
      nhịp. Bỏ: dấu Ped., chấm nhỏ trên cặp nốt [La♭4 Rê♭5] ở nửa đầu ô 2 (mờ,
      không chắc là staccato). Review (Claude, 17/11/2026): so lại từng nốt với tr. 9 hệ 1 ở 400–450 dpi: ô 1 (lặng trắng, đen, móc đơn; La♭3 rồi La♭4 móc kép nối vạch đôi, La♭3 thêm đuôi xuống móc đơn; p), ô 2 tay phải (tám móc kép nửa đầu, lặng móc đơn và sáu móc kép nửa sau; bè dưới Rê♭ Mi♭ Fa La♭ | Fa Mi♭ móc kép, Rê♭ nối Rê♭, Đô), tay trái (Rê♭2 trắng, Rê♭2 đen chấm dôi; bè trên Rê♭2 La♭2 nối La♭2 La♭2 | Rê♭2 Fa3 nối Fa3, Fa2 có cờ), hai vòng luyến tay phải, dấu nối, sắc thái: khớp. Không sửa.'
