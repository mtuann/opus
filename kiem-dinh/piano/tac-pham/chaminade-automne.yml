ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 6, thay Hensel). Nốt nhạc,
  sắc thái, chữ chỉ dẫn chép từ bản quét Enoch IMSLP #768244 (file
  PMLP7098-Chaminade_-_6_Études_de_concert,_Op._35.pdf, 55 trang; Automne ở
  trang 9–16 của file, số trang in 9–16, chân trang E. F. & C. 1312; đọc ở
  110–300 dpi, ô 1–2 đo dòng kẻ và đầu nốt bằng máy). Trang chỉ nêu số ô ở ô
  1–2; các đoạn sau mô tả theo sự kiện (chữ chỉ dẫn, sắc thái, kiểu viết). Đếm ô
  (lượt 1, theo hệ trên bản quét): phần A ô 1–29 (ô 27 là ô 2/4), Con fuoco ô
  30, Poco più largo ô 38, a Tempo p ô 50, Tempo 1° lento ô 60, molto agitato ô
  66, ff rapido energico ô 76, Lento (A trở lại) ô 78, kết ô 107; dùng để tính
  mốc, không ghi trên trang. Bản in có dấu ⊕ kèm (1) ở tr. 15 và ⊕ ở tr. 16 (có
  thể là chỗ được cắt) nhưng không in chú thích; trang không nói tới. Mốc của
  bảng Theo dõi khi nghe: khoảng lặng (ffmpeg silencedetect −45 dB, 0,6 s:
  198,97–199,74; 226,72–227,95; 232,40–233,02; 233,84–236,70; 366,54–367,44;
  379,47 s–hết), độ to (RMS) và sắc âm (chroma) theo giây, và số ô: phần A
  khoảng 4,24 s mỗi ô 4/4 (♪ ≈ 113), nên các mốc trong phần A và A trở lại tính
  theo số ô rồi soát bằng độ to, có thể lệch 2–4 s. Chữ do ::hop-tac-pham,
  ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ
  du-lieu/tac-pham/chaminade-automne.'
