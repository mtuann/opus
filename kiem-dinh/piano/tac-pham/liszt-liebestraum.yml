    moi: 'Vì sao Si trưởng nghe sáng đến vậy? Si trưởng cùng âm với Đô♭ trưởng, tức giọng dựng trên bậc III hạ của La♭ trưởng. Hai hợp âm trưởng cách nhau quãng ba và chỉ chung một nốt (Mi♭) là quan hệ trung âm hóa (chromatic mediant); bước chuyển này không đi qua giọng át hay hạ át (xem Át phụ và chuyển giọng). Trên phím, bạn đi từ bốn dấu giáng sang năm dấu thăng: địa hình dưới tay đổi hẳn, nên phải học đoạn này như một bài mới.'
    ly_do: 'Open Music Theory (Mediants): chromatic mediant có một nốt chung và cùng tính chất hợp âm; vế "rất đặc trưng của thời Lãng mạn" không có nguồn đã mở.'
