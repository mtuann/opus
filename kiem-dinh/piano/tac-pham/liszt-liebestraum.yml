    loai: ten
    nguon:
      - imslp-s541
      - henle-hn634
      - kistner-1850
    ket_qua: dung
    ghi_chu: 'IMSLP: Liebesträume S.541 số 3; S.298 Key Ab; bản in đầu: "Notturno. No 3", hóa biểu bốn dấu giáng, kết hợp âm La♭.'
    luot_2: dung
    luot_2_nguon: ["https://imslp.org/wiki/Liebestr%C3%A4ume%2C_S.541_(Liszt%2C_Franz)", "https://api.digitale-sammlungen.de/iiif/image/v2/bsb00051595_00017/full/1400,/0/default.jpg"]
    luot_2_ghi_chu: IMSLP S.541 số 3; bản in đầu hóa biểu 4 giáng.
  - id: n2
    cau: Giai điệu chậm, hát trên lớp hợp âm rải; giai điệu nằm giữa lớp đệm và do hai ngón cái hát.
    loai: cau-truc
    nguon:
      - kistner-1850
      - schirmer-1915
      - ptna-23749
    ket_qua: dung
    ghi_chu: 'Bản in đầu (Kistner 1850, bản BSB) và Schirmer 1915 (Joseffy): ô 1: nốt giai điệu Đô4 (tay phải, đuôi xuống, dưới chùm móc đơn Mi♭4–La♭4–Đô5), rồi ở phách 4 Đô4 ghi ở khuông dưới (tay trái); bên dưới là nốt trầm La♭2. Schirmer ghi ngón 1 cho các nốt giai điệu ở cả hai khuông. PTNA liệt kê các nốt giai điệu giao cho tay này hay tay kia (ô 3, 5, 10, 11, 13, 15…).'
    luot_2: dung
    luot_2_nguon: ["https://api.digitale-sammlungen.de/iiif/image/v2/bsb00051595_00017/full/1400,/0/default.jpg"]
    luot_2_ghi_chu: "Bản in đầu ô 1–5: giai điệu ở giữa, chuyền giữa hai tay (ngón cái), móc đơn rải ở trên."
  - id: n3
    cau: Phần đệm chia cho hai tay.
    loai: cau-truc
    nguon:
      - kistner-1850
      - schirmer-1915
      - ptna-23749
    ket_qua: dung
    ghi_chu: 'Nốt trầm ở tay trái, chùm hợp âm rải ở tay phải; PTNA gợi ý giao cho tay phải "melody … and accompaniment" ở ô 13, 15, 16, 19, 20 (tức theo cách chia của bản in, tay trái chơi cả nốt đệm đầu tiên cùng nốt giai điệu): lớp đệm chuyền giữa hai tay.'
    luot_2: dung
    luot_2_nguon: ["https://api.digitale-sammlungen.de/iiif/image/v2/bsb00051595_00017/full/1400,/0/default.jpg"]
    luot_2_ghi_chu: Nốt trầm và một phần hợp âm ở tay trái, chuỗi rải ở tay phải.
  - id: n4
    cau: Bài có hai cadenza và một cao trào quãng tám đòi kỹ thuật thật sự.
    loai: cau-truc
    nguon:
