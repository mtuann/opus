    ket_qua: dung
    ghi_chu: 'Mi♭ trưởng, 6/4, L:1/8. Tay phải quãng tám Sol, La♭ | Fa, Mi♭ (giai điệu của khối 1, đúng lời dẫn), rồi hợp âm Mi♭; f. Tay trái: nốt trầm (ngón 5) rồi hợp âm ở quãng tám trên (Mi♭3–Sol3–Si♭3, Mi♭3–La♭3–Đô4, Fa3–La♭3–Si♭3), mỗi nửa ô 2+2+2 móc đơn: bước nhảy khoảng một quãng tám, đúng "tay trái nhảy". Hòa âm Mi♭ – La♭/Mi♭ | Si♭7/Rê – Mi♭. Quãng tám La♭ là phím đen (lời dẫn: có thể ngón 1–4). Đủ phách (6+6, 12). Ped. ở mỗi nốt trầm.'
ghi_chu: 'Bài học Liebestraum số 3 (tầng Tác phẩm; dùng chung bản ghi liszt-liebestraum với hướng dẫn nghe, cap là cấu trúc). Bản nhạc: bản in đầu Kistner [1850] (bản BSB, số bản in 1751/6847: lần in lại từ cùng bản khắc, Henle gọi E 2), ảnh trang qua IIIF, tr. 16–22; đối chiếu Schirmer 1915 (Joseffy, Internet Archive lisztconsolation00unse, tr. 34–39) và bản gõ lại RSB 2011 (Commons/Internet Archive, chỉ để so cách đếm). Số ô đếm được (không tính nhịp lấy đà; mỗi cadenza một ô): 1–23 giai điệu (ô 23 là ô ngân, tay trái Fa♭…), 24 dẫn vào, 25 cadenza 1, 26 Più animato con passione (Si trưởng), 36 f, 37 sempre stringendo (Đô trưởng), 41 ff quãng tám, 50 appassionato assai (La♭), 56 affrettando, 58 hợp âm rải lớn, 59 chuỗi đi xuống dimin., 60 cadenza 2 (leggiero), 61 Tempo primo, 75 più smorz. e rit., 85 hết. Henle Comments đánh số khớp cách này (ô 44, 51, 53). PTNA đặt Più animato ở 27 (lệch một ô). Sửa trang: dòng Theo dõi cadenza 1 và Più animato, bảng cấu trúc (cadenza 24–25, A'''' 26–36), ghi chú cách đếm, đoạn Si trưởng ô 26–36 (bảng Chỗ khó, Kế hoạch tuần 3–4), bỏ "nốt nhỏ"; chromatic mediant thay "đặc trưng thời Lãng mạn"; bỏ "mở cửa cho Schubert…", "nhận ra sau vài nốt", "nổi tiếng nhất"; lời thơ in trước bài theo Henle; Howard "nhạc piano độc tấu"; câu sức khỏe theo BAPAM; mục Nguồn bỏ Walker. Dữ liệu cần sửa theo (hinh, chip/thong_tin): plans/lam-lai/bao-cao/d6-l6/sua-B.yml. Không có câu chưa chắc. Câu ở hồ sơ khác: quang-tam-buoc-nhay n47 (ô 37–60 quãng tám, bước nhảy): đúng, trang giữ; lo-trinh n37 (ba chọi bốn, quãng tám, cadenza): trang giữ quãng tám và hai cadenza; "khoảng năm phút" hơi dài so với bản thu trên Commons (3:58, 3:59, 4:43; hướng dẫn nghe ghi 4–5 phút); tac-pham-theo-cap n26, n38 (Henle 7; Consolation số 3 trước Liebestraum): trang giữ; nha-soan-nhac n96 (chặng 7): đúng. Không tính là nhận định: tiêu đề mục, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (hồ sơ du-lieu/tac-pham/liszt-liebestraum), mốc trong ::khoi-nghe (không đo lại; tám dòng khớp tám mốc). Thuật ngữ có trong thuat-ngu.yml: allegro, cadenza, nocturne, dolce, cantabile, legato, rubato, fermata, ottava, Urtext. Thuật ngữ chưa có (cho D3-L5): Più animato (animato), con passione, con affetto, poco, cantando, sempre stringendo (stringendo), Tempo I (Tempo primo), notturno, chromatic mediant (trung âm hóa).'
doi_chu:
  - cu: Một tiết mục được chờ đợi. Người nghe thường nhận ra bài này sau vài nốt; vì thế họ cũng nghe rõ từng chỗ giai điệu bị chìm hay nhòe.
    moi: Một tiết mục ai cũng biết. Henle gọi bài này là một trong những bản nhạc piano được chơi nhiều nhất; người nghe đã thuộc giai điệu thì cũng nghe rõ từng chỗ nó bị chìm hay nhòe.
    ly_do: '"Nhận ra sau vài nốt" không kiểm được; Henle HN 634: "one of the most frequently played piano pieces of all".'
  - cu: 'Henle xếp hai Liebestraum đầu ở mức 6, bài số 3 ở mức 7: bài nổi tiếng nhất cũng là bài khó nhất của tập. Xem thêm thời kỳ Lãng mạn.'
    moi: 'Henle xếp hai Liebestraum đầu ở mức 6, bài số 3 ở mức 7: bài số 3 khó hơn hai bài kia. Xem thêm thời kỳ Lãng mạn.'
    ly_do: '"Nổi tiếng nhất" không có nguồn so sánh; mức Henle giữ.'
  - cu: 'Giai điệu lần một (ô 1–23): La♭ trưởng; giai điệu ở âm vực giữa, trên và dưới là hợp âm rải nhẹ'
    moi: 'Giai điệu lần một (ô 1–23): La♭ trưởng; giai điệu ở âm vực giữa, dưới là nốt trầm, trên là hợp âm rải nhẹ'
    ly_do: 'Bản in đầu (Kistner 1850): dưới giai điệu là nốt trầm, không phải hợp âm rải; cùng chữ với hướng dẫn nghe.'
  - cu: 'Cadenza thứ nhất (từ ô 24): chuỗi nốt nhỏ không vạch nhịp, mở sang một màu khác'
    moi: 'Cadenza thứ nhất (ô 24–25): chuỗi nốt chạy liền không chia vạch nhịp, mở sang một màu khác'
    ly_do: 'Đếm ô và đọc trên bản in đầu (Kistner 1850, bản BSB) và Schirmer 1915: ô 24 dẫn vào, cadenza in trong một ô (25), nốt cỡ thường, không phải nốt nhỏ.'
  - cu: 'Più animato (ô 27): giai điệu trở lại, bắt đầu ở Si trưởng; sáng và sôi nổi hơn'
    moi: 'Più animato (ô 26): giai điệu trở lại, bắt đầu ở Si trưởng; sáng và sôi nổi hơn'
    ly_do: 'Bản in đầu (bản Henle dựa vào): Più animato con passione ở ô 26; stringendo 37, Tempo primo 61, 85 ô. PTNA ghi 27 nhưng cũng ghi stringendo ở 37, trái với 11 ô Si trưởng của bản nhạc.'
  - cu: Số ô nhịp theo phân tích của Piano Encyclopedia (Hội giáo viên piano Nhật Bản, PTNA). Ấn bản của bạn có thể đếm lệch một hai ô quanh các cadenza, vì một cadenza dài thường được in trong một ô duy nhất.
    moi: 'Số ô nhịp đếm trên bản in đầu (Kistner, 1850), bản mà ấn bản Henle dựa vào: không tính nốt lấy đà, và mỗi khúc không chia vạch nhịp nằm giữa hai vạch nhịp tính là một ô: cadenza thứ nhất là ô 25; trước cadenza thứ hai (ô 60, leggiero) còn ô 59, chuỗi nốt hai tay dimin. cũng không chia vạch nhịp. Piano Encyclopedia (Hội giáo viên piano Nhật Bản, PTNA) đặt Più animato ở ô 27; ấn bản của bạn cũng có thể đếm lệch một ô quanh các cadenza.'
    ly_do: 'Đếm lại trên bản in đầu (BSB) và Schirmer 1915; Henle theo bản in đầu (lời tựa), Comments đánh số khớp. PTNA lệch một ô ở Più animato. Review D6-L6-gom: Review đếm lại bản in đầu (BSB bsb00051595 và bsb11307527, cùng bản khắc, tr. 17–22): ô 58 có vạch nhịp ở cuối; ô 59 (chuỗi nốt hai tay, dimin.) kết bằng vạch nhịp; ô 60 (leggiero) tới vạch nhịp trước Tempo primo. Ghi rõ ô 59 để người đọc đếm như trang.'
  - cu: Ở đoạn quãng tám, tập ngắn và nghỉ đều; nếu cổ tay hay cẳng tay mỏi căng, dừng ngay (xem Giữ đôi tay khỏe).
    moi: Ở đoạn quãng tám, tập ngắn và nghỉ đều; cổ tay hay cẳng tay mỏi, căng thì dừng lại xem lại cách tập; đau thì dừng ngay (xem Giữ đôi tay khỏe).
    ly_do: 'BAPAM, The Healthy Pianist: đau thì dừng ngay; mỏi, căng là dấu hiệu xem lại kỹ thuật và cách tập. Khớp trang đã khóa piano/suc-khoe.'
  - cu: Alan Walker, Franz Liszt (3 tập, 1983–1996).
    moi:
      - 'G. Henle Verlag, HN 634: lời tựa (Ernst-Günter Heinemann, 1998): niên đại ca khúc và bản piano, lời thơ in trước mỗi bài, bản in đầu làm nguồn.'
      - 'Bản in đầu: Liszt, Liebesträume, 3 Notturnos für das Pianoforte (Kistner, Leipzig, [1850]), bản số hóa của Thư viện Quốc gia Bayern: đếm ô nhịp, chỉ dẫn tốc độ và sắc thái.'
    ly_do: Sách in chưa đọc, không làm nguồn; thay bằng nguồn đã mở.
  - cu: Khoảng ABRSM Grade 8 trở lên (ước lượng), chặng 7 của lộ trình. Henle xếp mức 7 trên thang 9 ("khó"), trên hai bài kia của tập (mức 6)
    moi: Henle xếp mức 7 trên thang 9 ("khó"), trên hai bài kia của tập (mức 6); RCM (đề cương 2022) đặt bài ở danh sách ARCT; ABRSM không xếp bài vào Grade nào
    ly_do: 'Dòng Độ khó của thong_tin (bản ghi, sua-B.yml): bỏ ước lượng ABRSM không nguồn; Henle HN 634 xếp bài mức 7, hai bài kia mức 6; RCM 2022 đặt bài ở danh sách ARCT; ABRSM không có bài trong đề cương 2017–2028.'
  - cu: Hát bằng ngón cái. Trong Nocturne Op. 9 số 2 của Chopin, giai điệu nằm trên cùng, phía ngón 5. Ở đây nó nằm giữa, và ngón cái phải hát trong khi các ngón còn lại của cùng bàn tay thì thầm. Kỹ năng này mở cửa cho Schubert, Schumann, Brahms, Rachmaninoff.
    moi: Hát bằng ngón cái. Trong Nocturne Op. 9 số 2 của Chopin, giai điệu nằm trên cùng, phía ngón 5. Ở đây nó nằm giữa, và ngón cái phải hát trong khi các ngón còn lại của cùng bàn tay thì thầm.
    ly_do: Bỏ câu chung chung, không kiểm được (chuẩn kiểm định mục 1).
  - cu: Liszt là nghệ sĩ piano lừng lẫy nhất thời ông, và cũng là người đưa rất nhiều ca khúc, của Schubert, Schumann và của chính ông, lên phím đàn. Liebesträume là ba ca khúc của ông được viết lại thành ba notturno (nocturne) cho piano, in năm 1850. Theo Henle, bản piano in lời thơ ở đầu mỗi bài, như để người chơi đọc thơ trước khi chạm phím.
    moi: Liszt là nghệ sĩ piano lừng lẫy nhất thời ông, và cũng là người đưa rất nhiều ca khúc, của Schubert, Schumann và của chính ông, lên phím đàn. Liebesträume là ba ca khúc của ông được viết lại thành ba notturno (nocturne) cho piano, in năm 1850. Theo Henle, bản piano in lời thơ ở đầu mỗi bài, cho thấy bài thơ vẫn quan trọng cả trong bản không lời.
    ly_do: 'Lời tựa Henle HN 634: Liszt in bài thơ trước bản nhạc "thereby underscoring the central significance of his literary models even in the piano transcriptions"; không nói ý để người chơi đọc trước.'
  - cu: 'So sánh vài nghệ sĩ gắn bó với nhạc Liszt, như Jorge Bolet và Leslie Howard (người thu âm toàn bộ nhạc piano của Liszt). Ai giữ được bước "đi" của Poco allegro, ai chậm và đậm hơn? Hai cadenza được nắn hình ra sao: đều đặn hay nhanh dần, chậm dần? Gợi ý cách chọn bản thu: Nghệ sĩ piano và bản thu.'
    moi: 'So sánh vài nghệ sĩ gắn bó với nhạc Liszt, như Jorge Bolet và Leslie Howard (người thu âm toàn bộ nhạc piano độc tấu của Liszt). Ai giữ được bước "đi" của Poco allegro, ai chậm và đậm hơn? Hai cadenza được nắn hình ra sao: đều đặn hay nhanh dần, chậm dần? Gợi ý cách chọn bản thu: Nghệ sĩ piano và bản thu.'
    ly_do: 'Hyperion: bộ đĩa của Leslie Howard là "Liszt''s complete music for solo piano".'
