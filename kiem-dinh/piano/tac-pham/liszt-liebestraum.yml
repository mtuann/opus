    ly_do: 'Đếm lại trên bản in đầu (BSB) và Schirmer 1915; Henle theo bản in đầu (lời tựa), Comments đánh số khớp. PTNA lệch một ô ở Più animato. Review D6-L6-gom: Review đếm lại bản in đầu (BSB bsb00051595 và bsb11307527, cùng bản khắc, tr. 17–22): ô 58 có vạch nhịp ở cuối; ô 59 (chuỗi nốt hai tay, dimin.) kết bằng vạch nhịp; ô 60 (leggiero) tới vạch nhịp trước Tempo primo. Ghi rõ ô 59 để người đọc đếm như trang.'
