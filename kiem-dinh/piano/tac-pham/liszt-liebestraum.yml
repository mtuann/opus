    cau: Hai hợp âm trưởng cách nhau quãng ba và chỉ chung một nốt (Mi♭) là quan hệ trung âm hóa (chromatic mediant); bước chuyển không đi qua giọng át hay hạ át.
    loai: dinh-nghia
    nguon:
      - omt-mediants
      - kistner-1850
      - schirmer-1915
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bước chuyển giữa hai giọng trưởng cách nhau quãng ba, không đi qua giọng át hay hạ át, là một màu hòa âm rất đặc trưng của thời Lãng mạn". Lý do: OMT định nghĩa chromatic mediant (một nốt chung, cùng tính chất hợp âm: La♭ = La♭–Đô–Mi♭, Đô♭ = Đô♭–Mi♭–Sol♭); vế "rất đặc trưng của thời Lãng mạn" không có trong nguồn đã mở. Bản nhạc: cuối ô 25 hợp âm Mi♭ (át của La♭) rồi nốt Rê♮, vào thẳng ô 26 Si trưởng, không qua hợp âm Fa♯. Review D6-L6-gom: lượt 2 dung; đọc lại chữ trang và dữ liệu, khớp câu.'
