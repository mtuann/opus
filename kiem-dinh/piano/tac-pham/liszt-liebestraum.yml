      - ptna-23749
    ket_qua: dung
    ghi_chu: 'Bản in đầu (Kistner 1850, bản BSB) và Schirmer 1915 (Joseffy): ô 25 và ô 60 là hai đoạn không chia vạch nhịp; ô 41–49 giai điệu quãng tám (ff, sempre più rinforzando). PTNA: đoạn 37–60 "the most technically demanding section".'
    luot_2: dung
    luot_2_nguon: ["https://api.digitale-sammlungen.de/iiif/image/v2/bsb00051595_00018/full/1400,/0/default.jpg", "https://api.digitale-sammlungen.de/iiif/image/v2/bsb00051595_00020/full/1400,/0/default.jpg", "https://api.digitale-sammlungen.de/iiif/image/v2/bsb00051595_00021/full/1400,/0/default.jpg", "https://enc.piano.or.jp/en/musics/23749"]
    luot_2_ghi_chu: "Hai cadenza (tr. 18, 21); ô 41 trở đi quãng tám; PTNA: phần 3 'the most technically demanding section'."
