  - id: n13
    cau: Henle gọi bài này là một trong những bản nhạc piano được chơi nhiều nhất.
    loai: lich-su
    nguon:
      - henle-hn634
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một tiết mục được chờ đợi. Người nghe thường nhận ra bài này sau vài nốt; vì thế họ cũng nghe rõ từng chỗ giai điệu bị chìm hay nhòe." Chữ mới: "Một tiết mục ai cũng biết. Henle gọi bài này là một trong những bản nhạc piano được chơi nhiều nhất; người nghe đã thuộc giai điệu thì cũng nghe rõ từng chỗ nó bị chìm hay nhòe." Lý do: "nhận ra sau vài nốt" không kiểm được; Henle: "The third Liebestraum … is one of the most frequently played piano pieces of all". Review D6-L6-gom: lượt 2 dung; đọc lại chữ trang và dữ liệu, khớp câu.'
    luot_2: dung
    luot_2_nguon: ["https://www.henle.de/en/Liebestraeume-3-Notturnos/HN-634"]
    luot_2_ghi_chu: "Henle: 'one of the most frequently played piano pieces of all'."
    review: dung
  - id: n14
    cau: Liszt là nghệ sĩ piano lừng lẫy nhất thời ông.
    loai: lich-su
    nguon:
      - henle-hn634
    ket_qua: dung
    ghi_chu: 'Henle (mục về tác giả): "The most famous piano virtuoso of the nineteenth century".'
    luot_2: dung
    luot_2_nguon: ["https://www.henle.de/en/Liebestraeume-3-Notturnos/HN-634"]
    luot_2_ghi_chu: "Henle: 'The most famous piano virtuoso of the nineteenth century'."
  - id: n15
    cau: Liszt chuyển soạn rất nhiều ca khúc, của Schubert, Schumann và của chính ông, cho piano.
    loai: lich-su
    nguon:
      - henle-634-vorwort
      - imslp-myrthen
    ket_qua: dung
    ghi_chu: 'Henle lời tựa: "Liszt had already made piano arrangements of a great many songs by other composers, including Franz Schubert"; Buch der Lieder (1843) và bản cho piano một năm sau. IMSLP: Schumann Widmung (Myrthen) chuyển soạn cho piano, S.566.'
    luot_2: dung
    luot_2_nguon: ["https://www.henle.de/media/5f/df/70/1690886072/0634-1690886072-sync.pdf", "https://imslp.org/wiki/Myrthen,_Op.25_(Schumann,_Robert)"]
    luot_2_ghi_chu: "Lời tựa Henle: Liszt chuyển soạn nhiều ca khúc của người khác (ví dụ Schubert) và Buch der Lieder của chính ông; IMSLP Myrthen của Schumann có 'Liszt, Franz/Arranger' (Widmung)."
  - id: n16
    cau: Liebesträume là ba ca khúc của Liszt được viết lại thành ba notturno (nocturne) cho piano, in năm 1850.
    loai: nam
    nguon:
      - henle-634-vorwort
      - imslp-s541
    ket_qua: dung
    ghi_chu: 'Henle: "appeared in 1850 in two versions simultaneously … songs … and as transcriptions for piano two-hands"; phụ đề "Notturnos". Bản in đầu: "3 Notturnos für das Pianoforte".'
    luot_2: dung
    luot_2_nguon: ["https://www.henle.de/media/5f/df/70/1690886072/0634-1690886072-sync.pdf"]
    luot_2_ghi_chu: "Henle: Liebesträume in 1850, bản piano là chuyển soạn ca khúc, phụ đề Notturnos."
  - id: n17
    cau: Theo Henle, bản piano in lời thơ ở đầu mỗi bài, cho thấy bài thơ vẫn quan trọng cả trong bản không lời.
    loai: lich-su
    nguon:
      - henle-634-vorwort
      - kistner-1850
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…in lời thơ ở đầu mỗi bài, như để người chơi đọc thơ trước khi chạm phím." Lý do: Henle không nói ý "để người chơi đọc trước"; Henle: "Liszt preceded each arrangement with the poem … thereby underscoring the central significance of his literary models even in the piano transcriptions". Bản in đầu tr. 16 in bài thơ "O lieb" trước bản nhạc. Review D6-L6-gom: lượt 2 dung; đọc lại chữ trang và dữ liệu, khớp câu.'
    luot_2: dung
    luot_2_nguon: ["https://www.henle.de/media/5f/df/70/1690886072/0634-1690886072-sync.pdf"]
    luot_2_ghi_chu: "Lời tựa Henle: Liszt đặt lời thơ trước phần nhạc, cho thấy tầm quan trọng của văn bản cả trong bản piano."
    review: dung
