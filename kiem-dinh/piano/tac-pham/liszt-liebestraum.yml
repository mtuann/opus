    ghi_chu: 'Chữ cũ: "Số ô nhịp theo phân tích của Piano Encyclopedia (Hội giáo viên piano Nhật Bản, PTNA). Ấn bản của bạn có thể đếm lệch một hai ô quanh các cadenza, vì một cadenza dài thường được in trong một ô duy nhất." Lý do: đếm trên bản in đầu: 1–23, 24, cadenza 25, Più animato 26, stringendo 37, ff 41, appassionato 50, cadenza 60, Tempo primo 61, kết 85. Henle: "Our edition follows the text presented in Kistner''s first edition of 1850". Ô 25 trải hai dòng không có vạch nhịp; ô 59 có vạch nhịp ở cuối, cadenza 2 là ô riêng. Review D6-L6-gom: Như n38. Lượt 2 sai vì đếm 84; review chọn quy ước của lượt 1 (85 ô, khớp lượt 2 phần dữ liệu, PTNA cũng có Tempo I 61 và hết 85). Ghi chú cũ "mỗi cadenza một ô (25, 60)" để lọt ô 59, chính chỗ lượt 2 đếm lệch: viết lại cho rõ, bỏ vế "tức đếm cadenza thứ nhất thành hai ô" (PTNA vẫn đặt stringendo ở ô 37). Cùng chữ với ghi chú hình (dữ liệu n31). doi_chu. Chữ mới vào lượt 2 bổ sung. Kết quả lượt 2 cũ (gỡ để chạy lại trên chữ mới): sai; câu đúng: Ghi chú cách đếm: số ô theo bản in đầu (Kistner 1850, bản Henle dựa vào); mỗi cadenza một ô (25, 59), không tính nốt lấy đà; PTNA đánh số khác (Più animato ô 27, Tempo I ô 61).; Đếm ô trên bản in đầu Kistner (BSB bsb00051595, tr. 17–22), không tính nhịp lấy đà: A ô 1–23, ô 24 dẫn, cadenza 1 = ô 25, Più animato ô 26, sempre stringendo ô 37, affrettando ô 56–58, cadenza 2 = ô 59, Tempo primo ô 60, hết bài ô 84. Đánh số này khớp lời bình của Henle (ghi chú T13–14 staccato, T28, T44/51/53 dấu nhấn rơi đúng các ô ấy). PTNA đánh số khác (Più animato 27, stringendo 37, Tempo I 61, hết 85), nên 61/85 là số của PTNA, không theo quy ước ''bản in đầu, không tính lấy đà, mỗi cadenza một ô''.'
