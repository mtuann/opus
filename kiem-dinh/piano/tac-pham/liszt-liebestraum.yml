    ghi_chu: 'Mi♭ trưởng, 6/4, L:1/8. Giai điệu Sol4 – La♭4 | Fa4 – Mi♭4 (ngón 1, mf, nốt trắng chấm dôi) nằm dưới lớp móc đơn pp ở bè trên của cùng tay phải (z B e g e B; z c e a e c | z A B d B A; z G B e B G), ngón 2-4-5 / 2-3-5: đúng lời dẫn "ngón cái hát, các ngón khác thì thầm", giai điệu ở giữa (trên nốt trầm, dưới lớp đệm). Hòa âm: Mi♭ – La♭/Mi♭ | Si♭7/Rê – Mi♭ | Mi♭. Tay phải giữ ngón cái và với ngón 5 tới quãng tám (Sol4–Sol5, La♭4–La♭5): chơi được ở chặng 7. Mỗi ô: 6+6 móc đơn mỗi lớp, ô cuối 12 móc đơn; tay trái 6+6, 12: đủ phách. "Ped." ở mỗi nốt trầm, khớp lời dẫn bước 3. Bốn nốt giai điệu, khớp bước 1.'
