    ghi_chu: 'Mi♭ trưởng, 4/4, L:1/16. Ô 1: a f d B | f d B A | d B A F | B A F D: chỉ các nốt Si♭–Rê–Fa–La♭ (Si♭ bảy), mỗi nhóm bốn nốt bắt đầu từ nốt thứ hai của nhóm trước, đúng lời dẫn; ô 2 rơi xuống Si♭3 rồi vọt lên Si♭5 (b4); ô 3 Sol5 rồi hợp âm Mi♭. Ngón 5-3-2-1 / 5-4-2-1 mỗi nhóm; ô 2 ngón cái luồn dưới sau La♭4 (4 → 1 Si♭4): chơi được. 16 móc kép mỗi ô; tay trái Si♭1 ngân hai ô rồi Mi♭ (8+8): đủ phách. p, Ped. ở Si♭1.'
