    ket_qua: dung
    ghi_chu: 'Dolmetsch defst4: "an ornament used by Dominico Scarletti in about two dozen of his sonatas … the tremulo uses the lower auxiliary, whereas the trill always uses the upper". Wiktionary: tremulo (Ý) = trembling, quivering. Trang ghi rõ đây là ý của Dolmetsch.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defst4.htm" ]
    luot_2_ghi_chu: "Dolmetsch: 'Tremulo — an ornament used by Dominico Scarletti in about two dozen of his sonatas, which is to be distinguished from the trill by the fact that the tremulo uses the lower auxiliary, whereas the trill always uses the upper'. Nghĩa 'run rẩy': cùng trang có 'tremore (Italian) tremor, trembling'."
