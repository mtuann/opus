nhan_dinh:
  - id: n1
    cau: 'Sonata La trưởng K. 208 (L. 238) của Domenico Scarlatti; chỉ dẫn gốc Adagio e cantabile (chậm và hát).'
    loai: ten
    nguon: [ gouin, imslp-k208, wiki-list, thuat-ngu-site ]
    ket_qua: dung
    ghi_chu: 'Gouin tr. 1: "Sonata K. 208", "Adagio e cantabile", hóa biểu ba thăng. IMSLP: K.208 ; L.238, Number of Movements/Sections "Adagio e cantabile". Wikipedia: K 208, L 238, A major, Adagio e cantabile. adagio "Chậm, thong thả", cantabile "Như hát" (thuat-ngu.yml).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/api.php?action=parse&page=Keyboard_Sonata_in_A_major,_K.208_(Scarlatti,_Domenico)&prop=wikitext&format=json", "https://imslp.org/wiki/Keyboard_Sonata_in_A_major,_K.208_(Scarlatti,_Domenico)" ]
    luot_2_ghi_chu: "IMSLP: Keyboard Sonata in A major, K.208 ; L.238 ; P.315; mục Movements/Sections ghi 'Adagio e cantabile'. Bản Urtext Gouin (PDF IMSLP #293023, đã đọc bản tải sẵn) ghi 'Adagio e cantabile' ở đầu bài."
  - id: n2
    cau: 'Sonata của Scarlatti là một bản nhạc một chương cho đàn phím, chia hai nửa, mỗi nửa nhắc lại; K. 208 là một bản chậm như vậy.'
    loai: cau-truc
    nguon: [ gouin, longo, imslp-k208 ]
    ket_qua: dung
    ghi_chu: 'K. 208: IMSLP ghi một phần "Adagio e cantabile", nhạc cụ "keyboard"; Gouin và Longo đều có vạch nhắc lại sau ô 14 và ở cuối ô 25. Câu chung về sonata Scarlatti (một chương, hai nửa có nhắc lại) khớp trang nghe-nhac/scarlatti-sonata đã khóa (sơ đồ "‖: Nửa đầu … :‖"); ở đây chỉ kiểm trên K. 208.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/", "https://imslp.org/wiki/Keyboard_Sonata_in_A_major,_K.208_(Scarlatti,_Domenico)" ]
    luot_2_ghi_chu: "OMT (Binary form): hai phần (reprise), mỗi phần thường nhắc lại; ví dụ là sonata Scarlatti K. 322. K. 208 (bản Gouin, bản Longo): một chương, 25 ô, dấu nhắc lại sau ô 14 và ô 25, tốc độ Adagio. Câu chung 'sonata của Scarlatti là một chương' đúng với số đông; vài sonata sớm nhiều chương (như K. 81) là ngoại lệ, không ảnh hưởng nội dung trang."
  - id: n3
    cau: 'Tay phải hát một giai điệu có nốt hoa mỹ (nốt dựa, trill, nhóm nốt nhanh); tay trái đi đều từng phách bằng nốt đen, khi một nốt, khi hai nốt.'
    loai: cau-truc
    nguon: [ gouin, longo ]
    ket_qua: dung
    ghi_chu: 'Gouin: nốt dựa ô 1 (Fa♯ trước Mi), ô 2 (Mi trước Rê, Đô♯ trước Si); tr ô 11 và 25; nhóm móc ba ô 23, 25; tay trái nốt đen gần như suốt bài (một nốt ô 1–2, ô 15; hai nốt phần lớn các ô; ô 14 nốt tròn, ô 25 có lặng đen cuối).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Keyboard_Sonata_in_A_major,_K.208_(Scarlatti,_Domenico)", "https://github.com/craigsapp/scarlatti-keyboard-sonatas/blob/master/reference-edition/L238K208.pdf" ]
    luot_2_ghi_chu: "Đọc bản Gouin (IMSLP #293023) và bản Longo: tay phải có nốt dựa (ô 1, 2), trill (ô 11, 25), nhóm móc tam (ô 23, 25); tay trái nốt đen đều, một nốt (ô 1–2, 15) hay hai nốt (ô 3…). Ngoại lệ nhỏ: ô 14 tay trái nốt tròn, ô 25 có dấu lặng."
  - id: n4
    cau: 'ABRSM xếp K. 208 ở Grade 6, danh sách A, trong cả bốn kỳ 2021–2022, 2023–2024, 2025–2026, 2027–2028; RCM 2022 Level 7; Henle mức 4 trên thang 1–9; Grade 6 ứng với chặng 5 của lộ trình.'
    loai: cap-do
    nguon: [ abrsm-2122, abrsm-2324, abrsm-2526, abrsm-2728, rcm-2022, henle-581, cap-do ]
    ket_qua: dung
    ghi_chu: 'Bản chữ trích của bốn PDF ABRSM (scratchpad ks4/pdf): dòng "D. Scarlatti Sonata in A, Kp. 208, L. 238" nằm sau tiêu đề "GRADE 6" (2025–2026: tiêu đề dòng 1709, bài dòng 1737); số thứ tự 10 (2021–2024), 14 (2025–2028) trong danh sách đầu của Grade 6 (danh sách A; đánh số lại từ 1 ở mỗi danh sách). RCM tr. 60, 63: Level 7, List A. Henle HN 581: K. 208 mức 4, ABRSM Piano Grade 6. Chặng 5 = Grade 6 (lo-trinh-them-tac-pham.md mục 2).'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2023-09/piano-2021-2022-syllabus-rev-sep-2020-final.pdf", "https://www.abrsm.org/sites/default/files/2023-10/Piano%202023%20%26%202024%20Prac%20syllabus%2020230807.pdf", "https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20%26%202026%20Prac%20syllabus%2020240524_access.pdf", "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20%26%202028.pdf", "https://teacherportal.rcmusic.com/getattachment/57f3734d-97e5-4777-b67e-4b1111ee31a3/piano-syllabus-2022-edition.pdf", "https://www.henle.de/Selected-Piano-Sonatas-Volume-IV/HN-581" ]
    luot_2_ghi_chu: "ABRSM Grade 6 List A: 2021–22 (A10, tr. 32), 2023–24 (A10, tr. 32), 2025–26 (A14, tr. 36, đã xem ảnh trang: mục A), 2027–28 (A14, tr. 36): 'D. Scarlatti, Sonata in A, Kp. 208, L. 238'. RCM 2022: Level 7, List A (Baroque Repertoire), có trong Piano Repertoire 7 tr. 16. Henle HN 581: 'Piano Sonata A major K. 208 — 4 medium — ABRSM: Piano Grade 6'. Vế 'Grade 6 ứng với chặng 5' là quy ước của site, không kiểm bằng nguồn ngoài."
  - id: n5
    cau: 'Ở chặng 5, K. 208 là bài Baroque duy nhất: sau hai bài Bach ở chặng 4 (Invention số 1, Prelude Đô trưởng) và trước Prelude và Fugue Đô thứ ở chặng 6; đây là bài học Scarlatti đầu tiên trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/data/tac-pham.yml (24/11/2026): bài học chặng 5 là bartok-romanian-folk-dances (Thế kỷ 20), beethoven-anh-trang, mozart-k545 (Cổ điển), chopin-valse-la-thu, mendelssohn-thuyen-ca, schumann-traumerei (Lãng mạn) và scarlatti-k208 (Baroque); chặng 4 có bach-invention-1, bach-prelude-do; chặng 6 có bach-prelude-fugue-do-thu; không bài học nào khác có tac_gia scarlatti (scarlatti-sonata là loai nghe).'
  - id: n6
    cau: 'Nửa đầu đi từ La trưởng sang Mi trưởng, nửa sau trở về La trưởng; gần cuối mỗi nửa có một trill (ô 11 trên Fa♯, ô 25 trên Si).'
    loai: cau-truc
    nguon: [ gouin, longo ]
    ket_qua: dung
    ghi_chu: 'Gouin: ô 13–14 tay phải [Mi4 Sol♯4], [Rê♯4 Fa♯4] có dấu láy, rồi Mi4 nốt tròn; tay trái về Mi3 nốt tròn (kết ở Mi trưởng). Ô 25: Si4 chấm có tr, La4; tay trái La2 (kết ở La trưởng). Ô 11: Fa♯4 chấm có tr rồi Mi Fa♯ móc ba. Ô 23 Gouin ghi dấu láy (không phải tr) trên Si; trang chỉ nói ô 11 và 25.'
    luot_2: dung
    luot_2_nguon: [ "https://github.com/craigsapp/scarlatti-keyboard-sonatas/blob/master/reference-edition/L238K208.pdf", "https://imslp.org/wiki/Keyboard_Sonata_in_A_major,_K.208_(Scarlatti,_Domenico)" ]
