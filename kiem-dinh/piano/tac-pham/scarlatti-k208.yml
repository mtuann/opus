    cau: 'Tremulo (tiếng Ý: run rẩy) là một kiểu nốt hoa mỹ Scarlatti dùng trong khoảng hai chục sonata; từ điển Dolmetsch cho rằng nó khác láy rền ở chỗ dùng nốt phụ phía dưới.'
