    ghi_chu: 'Cách chơi của khối 3: Fa♯5 đen có dấu nhấn (ngón 5) đúng phách 2, cùng nốt La3 thứ hai của tay trái; Mi5 móc đơn (4); Rê5 Đô♯5 móc kép. Fa♯ lấy hai phần ba của Mi chấm dôi (một đen trên một đen chấm dôi), đúng quy tắc ở n29. Tay trái như khối 3. Mỗi ô 16 móc kép.'
  - khoi: 5
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '2 ô 4/4, La trưởng: tay phải Đô♯5 Si4 La4 Đô♯5 đen (3-2-1-3) | Si4 móc đơn chấm có !trill! (3), La4 Si4 móc kép (2-3), La4 đen (2), lặng đen; tay trái La3 Sol♯3 Fa♯3 Đô♯3 đen (1-2-3-5) | Mi3 trắng (1), La2 đen (5), lặng đen. Kết V–I (Mi dưới trill Si, La ở nốt kết). Mỗi ô 16 móc kép. Lời kèm: trill bắt đầu từ nốt trên Đô♯ (theo n30); ngón 3 trên Si, trill Đô♯–Si bằng 4-3 hay 3-2: chơi được.'
