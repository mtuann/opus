ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 10, khảo sát đợt 4). Nốt của trích đoạn chép từ bản quét bản Longo (Ricordi 1906, tập 5, E.R. 545, tr. 147–148, số 238; file reference-edition/L238K208.pdf của kho GitHub craigsapp/scarlatti-keyboard-sonatas, tải 24/11/2026, 2 trang), đọc ở 110–450 dpi; soát với PDF của Pierre Gouin (IMSLP #293023, 2 trang) và MIDI cùng bộ (IMSLP #293026: liệt kê nốt ô 1–3 bằng mido). Bản chép tay không xem trực tiếp: "chữ của bản chép tay" trên trang dựa vào bản Gouin (IMSLP ghi "Urtext keyboard score") và vào chú thích "C. V." của chính Longo; bản Gouin ô 4 (Fa♯ Sol♯ La Sol♯ | Si Đô♯ Rê Đô♯, tay trái [Rê3 La3]) khớp cách viết "C. V." Longo in ở chú thích a), nên coi bản Gouin theo bản chép tay Venice. Đếm ô: 25 ô (Longo đánh số (5), (10), (15), (20), (25)); nửa đầu ô 1–14, nửa sau ô 15–25, mỗi nửa có dấu nhắc lại. Bản thu: Robert Stephen Hill (fortepiano), IMSLP #961413, chỉ dẫn link; file FLAC chủ repo tải tay vào ../opus-zero/_imslp/ (ffprobe 281,186667 s). Mốc: căn bằng tools/audio/align/run.py với cấu hình tạm ngoài repo (scratchpad scarlatti-k208/align_k208.py: src imslp_Scarlatti_K208.mid = MIDI Gouin, sha256 f253c962…caec, đã viết ra hai dấu nhắc lại, 50 ô; tuning -1 vì bản thu thấp hơn La 440 một nửa cung; rows {0: first, 1: 3, 2: 4, 3: 7, 4: 10, 5: 14, 6: 28, 7: 30, 8: 36, 9: 39, 10: 47}); cả 11 dòng được nhận (hai trong ba biến thể khớp trong 2 s). Dòng 6 (nửa đầu nhắc lại) run.py cho 78,5 s, nhưng khởi âm và sắc âm cho thấy nốt Mi tròn tắt khoảng 74,6 s và nốt La (nghe như La♭) của ô 1 vang ở 75,2 s, Đô♯ ở 76,3 s, Rê của ô 2 ở 78,9 s: ghi 75. Dòng 11 (ô 23 lần hai): khởi âm La có Đô♯ ở 245,2 s sau ô 22 (Rê–La, 240–244,6 s): khớp 245. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/scarlatti-k208.'
