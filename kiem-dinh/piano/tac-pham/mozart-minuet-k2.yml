  - id: n26
    cau: Minuet K. 2 được in lần đầu năm 1828, trong cuốn tiểu sử Mozart của Georg Nikolaus Nissen, người chồng sau của Constanze, vợ góa Mozart.
    loai: lich-su
    nguon: [ kv-2, ndb-wam ]
    ket_qua: dung
    ghi_chu: 'Köchel: "Erstdruck, 1828, in G. N. Nissen''s Biographie W. A. Mozarts". NDB (W. A. Mozart): vợ Constanze, "⚭ 2] Georg Nicolai v. Nissen". IMSLP ghi "First publication 1878" là ấn bản Breitkopf có trên trang, không phải bản in đầu.'
  - id: n27
    cau: Chữ K. (hay KV) chỉ danh mục tác phẩm Mozart do Ludwig von Köchel lập năm 1862.
    loai: danh-muc
