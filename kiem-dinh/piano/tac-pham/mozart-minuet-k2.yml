    review: dung
  - id: n15
    cau: Leopold Mozart là nhạc công violin và nhà soạn nhạc trong dàn nhạc của Tổng giám mục Salzburg.
    loai: lich-su
    nguon: [ ndb-lm ]
    ket_qua: dung
    ghi_chu: 'NDB: "im Juni 1747 wurde M. eine endgültige und voll besoldete Stelle als Violinist zugesprochen" ở Salzburger Hofkapelle; 1757 "Hof- und Cammer-Componist".'
    luot_2: dung
    luot_2_nguon: [ "https://www.deutsche-biographie.de/sfz65883.html" ]
    luot_2_ghi_chu: 'NDB (Leopold Mozart): từ 1747 là Violinist chính thức của Salzburger Hofkapelle, 1757 "Hof- und Cammer-Componist", 1763 Vizekapellmeister; phần ADB ghi "Kapelle des Erzbischofs".'
  - id: n16
    cau: 'Một ghi chú nổi tiếng kể rằng Wolfgang học một minuet và trio trong nửa giờ, lúc chín giờ rưỡi tối ngày 26 tháng 1 năm 1761, một ngày trước sinh nhật năm tuổi.'
    loai: lich-su
    nguon:
      - jahn-1882
      - ndb-wam
    ket_qua: dung
    ghi_chu: 'chưa chắc: chỉ thấy ở Wikipedia (Nannerl Notenbuch, bảng số 11, kèm chữ Đức "einen Tag vor seinem 5ten Jahr um halb 10 uhr nachts in einer halben stund"); Köchel (trang sổ nhạc) và lời tựa Henle đã mở không trích ghi chú này. Phần "một ngày trước sinh nhật năm tuổi" khớp NDB (sinh 27.1.1756). Lượt 2 hay review tìm NMA IX/27/1 (dme.mozarteum.at) để xác nhận. Review D6-L1-gom: lượt 2 tìm được nguồn ngoài Wikipedia; review tự mở bản Gutenberg: Otto Jahn, Life of Mozart, quyển 1 (bản dịch Pauline D. Townsend, 1882), trích ghi chú của Leopold: "This minuet and trio were learned by Wolfgangerl in half-an-hour, at half-past nine at night, on January 26, 1761, one day before his fifth year." Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/43411" ]
    luot_2_ghi_chu: 'Otto Jahn, Life of Mozart, quyển 1 (Gutenberg #43411) dẫn ghi chú của Leopold: "This minuet and trio were learned by Wolfgangerl in half-an-hour, at half-past nine at night, on January 26, 1761, one day before his fifth year." Chưa tìm được bản gốc trong NMA trên mạng.'
    review: dung
  - id: n17
    cau: Năm 1756, năm Wolfgang ra đời, Leopold xuất bản một cuốn sách dạy violin rất có tiếng.
    loai: nam
    nguon: [ imslp-violinschule, ndb-lm, ndb-wam ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Augsburg: Johann Jacob Lotter, 1756"; NDB: Violinschule 1756 "der seinen bleibenden Ruhm begründete".'
    luot_2: dung
    luot_2_nguon: [ "https://www.deutsche-biographie.de/sfz65883.html" ]
    luot_2_ghi_chu: "NDB: \"1756 war M.s pädagogisch-theoretisches Hauptwerk, der 'Versuch einer gründlichen Violinschule', erschienen, der seinen bleibenden Ruhm begründete.\""
  - id: n18
    cau: Leopold tự dạy đàn phím cho hai con.
    loai: lich-su
    nguon: [ henle-1236 ]
    ket_qua: dung
    ghi_chu: 'Henle: Nannerl học đàn từ khoảng tám tuổi, cha làm sổ nhạc cho con; Wolfgang lên bốn học đàn bằng sổ của chị; cha ghi các bài con sáng tác.'
