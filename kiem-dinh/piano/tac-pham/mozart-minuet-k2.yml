  - id: n10
    cau: 'Tay trái chỉ chơi một nốt mỗi lúc nhưng là một giọng thật: đi lên, đứng yên, rơi xuống quãng tám ở chỗ kết.'
    loai: cau-truc
    nguon: [ mut-k2 ]
    ket_qua: dung
    ghi_chu: 'Ô 1–3 Fa3 La3 Si♭3 Đô4 (đi lên), ô 5–6 Đô3 giữ, ô 4, 8, 16, 24 rơi quãng tám (Fa3–Fa2, Đô4–Đô3).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV2/menuet_k2/menuet_k2.ly" ]
    luot_2_ghi_chu: "Đếm trên bản Mutopia (Breitkopf & Härtel, Mozarts Werke Serie XXII, plate W.A.M. 2.4). Tay trái: Fa3–La3 | Si♭3 | Đô4–Đô3 (đi lên rồi rơi quãng tám), ô 5–6 giữ Đô3, các ô kết đi xuống (Fa3–Đô3–Fa2…)."
  - id: n11
    cau: Link Minuet Sol trưởng (bài hai bè thời Baroque).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "src/content/docs/piano/tac-pham/minuet-sol.md có (hai bè). Review D6-L1-gom: piano/tac-pham/minuet-sol (cùng lô) là bài hai bè. Đúng."
    review: dung
  - id: n12
    cau: Sáu lần trong bài, phách 1 là một nốt nghịch ngân hai phách rồi mới đi tới nốt hợp âm.
    loai: cau-truc
    nguon: [ mut-k2, omt-embell ]
    ket_qua: dung
    ghi_chu: 'Ô 4, 16, 24 Mi4 (trắng) → Fa4 trên Fa; ô 8 La4 → Sol4 trên Đô; ô 12 Fa♯4 → Sol4 trên Sol; ô 20 Mi4 → Fa4 trên Rê. Ô 8: La trên hợp âm Đô là âm ngoài hợp âm (quãng sáu, nghịch theo hòa âm, không theo quãng); OMT: nốt treo, appoggiatura là âm ngoài hợp âm trên phách mạnh.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV2/menuet_k2/menuet_k2.ly", "https://enc.piano.or.jp/musics/63258" ]
    luot_2_ghi_chu: 'Đếm trên bản Mutopia (Breitkopf & Härtel, Mozarts Werke Serie XXII, plate W.A.M. 2.4). Phách 1 các ô 4 (Mi trên Fa), 8 (La trên Đô), 12 (Fa♯ trên Sol), 16, 20 (Mi trên Rê), 24 là nốt trắng (hai phách) không thuộc hợp âm, giải ở phách 3. PTNA (大井和郎): "非和声音...6箇所...いずれも稽留音" ở các ô 4, 8, 12, 16, 20, 24.'
  - id: n13
    cau: 'Bài ghé qua Sol thứ, có một kết lừa và một dấu ngân.'
    loai: cau-truc
    nguon: [ mut-k2, cod-cadence ]
    ket_qua: dung
    ghi_chu: Ô 9–12 Mi♭, Fa♯ (Sol thứ); ô 19–20 Đô → Rê (kết lừa) với dấu ngân (Mutopia "f4\fermata", "d2.\fermata").
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV2/menuet_k2/menuet_k2.ly", "https://enc.piano.or.jp/musics/63258" ]
    luot_2_ghi_chu: 'Đếm trên bản Mutopia (Breitkopf & Härtel, Mozarts Werke Serie XXII, plate W.A.M. 2.4). Ô 9–12 có Mi♭, Fa♯, kết về Sol (Sol thứ); ô 20 bè trầm Rê với dấu ngân. PTNA: "g-mollへの転調や偽終止によるフェルマータ".'
  - id: n14
    cau: Link Kết và câu nhạc.
    loai: ve-site
