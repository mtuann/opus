    nguon: [ mut-k2, kv-2 ]
    ket_qua: dung
    ghi_chu: Bài trọn vẹn 24 ô (Köchel "completed work"); khối 1 trích đúng 8 ô đầu.
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV2/menuet_k2/menuet_k2.ly", "https://kv.mozarteum.at/en/work/piano-piece-in-f-1009" ]
    luot_2_ghi_chu: Đếm trên bản Mutopia (Breitkopf & Härtel, Mozarts Werke Serie XXII, plate W.A.M. 2.4). Bản Breitkopf chỉ có hai bè, 24 ô; Köchel online ghi 24 ô cho tác phẩm (không có bè hay đoạn nào khác).
