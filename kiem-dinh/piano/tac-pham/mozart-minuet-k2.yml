ghi_chu: 'Bài học Mozart Minuet Fa trưởng K. 2 (tầng Tác phẩm). Bản nhạc: Mutopia menuet_k2 (.ly và .mid, nguồn Breitkopf & Härtel, Mozarts Werke, Nicolas Morant), đối chiếu từng nốt cả 24 ô bằng script Python (mido). Köchel online: trang KV 2 và trang sổ nhạc Nannerl đọc qua WebFetch (trang dựng bằng JavaScript; curl không thấy chữ; địa chỉ có tên mới hiện nội dung). Tiểu sử: Neue Deutsche Biographie (deutsche-biographie.de) cho W. A. và Leopold Mozart. Lời tựa Henle HN 1236 (PDF trên henle.de) cho sổ nhạc Nannerl. Türk: bản scan Klavierschule 1789 trên Internet Archive (OCR). Sửa trang ở lượt 1: n30 (bỏ tên Guy Penson, chưa tìm thấy bản thu), n70 (dấu ngân ô 20), n86 (bỏ dòng PTNA ở mục Nguồn: trang PTNA về KV 2 không tìm thấy). Còn mở: n16 (ghi chú 26/1/1761 chỉ thấy ở Wikipedia), n24 (mô tả phong cách galant). Không tính là nhận định: tiêu đề, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng, mốc trong ::khoi-nghe.'
