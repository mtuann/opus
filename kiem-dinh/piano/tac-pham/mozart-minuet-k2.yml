    nguon: [ mut-k2, cod-cadence ]
    ket_qua: dung
    ghi_chu: Câu 4 ô; nốt nghịch ở phách 1 các ô 4, 8, 12, 16, 20, 24; kết lừa ô 19–20 (n57).
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV2/menuet_k2/menuet_k2.ly", "https://enc.piano.or.jp/musics/63258" ]
    luot_2_ghi_chu: Đếm trên bản Mutopia (Breitkopf & Härtel, Mozarts Werke Serie XXII, plate W.A.M. 2.4). Các câu 4 ô; nốt nghịch ngân ở phách 1 các ô 4, 8, 12, 16, 20, 24; ô 20 bè trầm tới Rê (kết lừa) trước 4 ô cuối. PTNA (bài của 熊本陵平 và 大井和郎) cũng nêu 6 nốt treo ở phách 1 và kết lừa ô 20.
  - id: n6
    cau: 'Đây không phải bản phối giản lược: đó là toàn bộ những gì Mozart viết.'
