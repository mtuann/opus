    ghi_chu: 'Köchel: "Salzburg, 1762 – 01.1762"; NDB: sinh 27.1.1756. Tháng 1/1762 Mozart vừa hay sắp tròn 6 tuổi.'
    luot_2: dung
    luot_2_nguon: [ "https://kv.mozarteum.at/en/work/piano-piece-in-f-1009", "https://www.deutsche-biographie.de/pnd118584596.html" ]
