    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV2/menuet_k2/menuet_k2.ly", "https://kv.mozarteum.at/en/work/piano-piece-in-f-1009" ]
    luot_2_ghi_chu: 'Đếm trên bản Mutopia (Breitkopf & Härtel, Mozarts Werke Serie XXII, plate W.A.M. 2.4). Tay phải và tay trái đều 24 ô (ô 1–8 có nhắc lại). Köchel online ghi "measures": "24", 3/4, Fa trưởng.'
  - id: n2
