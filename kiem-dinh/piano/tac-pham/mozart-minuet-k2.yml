  - id: n24
    cau: 'Phong cách galant: chữ galant nghĩa là "lịch lãm, kiểu cung đình"; đó là lối viết thế kỷ 18 mà Mozart thời đầu ưa dùng.'
    loai: dinh-nghia
    nguon:
      - cod-galant
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: chưa mở được nguồn bậc 2 mô tả phong cách galant như vậy (OMT Galant Schemas chỉ nói các schema của "Galant style", dẫn Gjerdingen 2007, không định nghĩa). Đặc điểm câu ngắn, bè trầm giản dị đúng với bài (Mutopia). Review D6-L1-gom: cả hai lượt không tìm được nguồn bậc 2 cho "câu ngắn, giai điệu dễ hát, bè trầm giản dị" (chỉ Wikipedia). Viết lại theo Concise Oxford Dictionary of Music (encyclopedia.com, mục galant): "Courtly. 18th-cent. term to describe elegant style ... favoured by, for example, J. C. Bach, the Stamitzes, and early Mozart." Chữ cũ: "theo phong cách galant giữa thế kỷ 18: câu ngắn, giai điệu dễ hát, bè trầm giản dị". Câu có điều mới: gỡ kết quả lượt 2 cũ (khong-chac: không tìm được nguồn bậc 2 mô tả các đặc điểm; OMT chỉ nói schema; Britannica bị chặn), chờ lượt 2 bổ sung.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cnrtl.fr/definition/galant/adjectif", "https://web.archive.org/web/2024/https://www.merriam-webster.com/dictionary/galant%20style", "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/", "https://www.henle.de/Piano-Pieces-from-the-Nannerl-Music-Book/HN-1236" ]
    luot_2_ghi_chu: "TLFi (CNRTL), tính từ galant: 'qui sait plaire en société par l'élégance de son allure et la politesse raffinée de ses manières'; mục MUS.: 'qui a un caractère mondain, léger et brillant', style galant nằm giữa lối viết nghiêm của đầu thế kỷ 18 và phong cách các nhà cổ điển lớn. Merriam-Webster: 'a light and elegant free homophonic style of musical composition in the 18th century'. OMT (Galant Schemas): khuôn mẫu của nhà soạn nhạc thế kỷ 18 'in the Galant style'. Trang Henle HN 1236, phần tiểu sử Mozart: từ 1782 ông đưa 'learned style' vào tác phẩm 'beside the galant style', tức lối galant là nền từ trước. 'Kiểu cung đình' hơi hẹp hơn 'mondain' (giới thượng lưu) của TLFi, nhưng không sai về ý."
