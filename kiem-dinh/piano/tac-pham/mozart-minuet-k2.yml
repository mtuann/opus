  - id: n15
    cau: Leopold Mozart là nhạc công violin và nhà soạn nhạc trong dàn nhạc của Tổng giám mục Salzburg.
    loai: lich-su
    nguon: [ ndb-lm ]
    ket_qua: dung
    ghi_chu: 'NDB: "im Juni 1747 wurde M. eine endgültige und voll besoldete Stelle als Violinist zugesprochen" ở Salzburger Hofkapelle; 1757 "Hof- und Cammer-Componist".'
  - id: n16
    cau: 'Một ghi chú nổi tiếng kể rằng Wolfgang học một minuet và trio trong nửa giờ, lúc chín giờ rưỡi tối ngày 26 tháng 1 năm 1761, một ngày trước sinh nhật năm tuổi.'
    loai: lich-su
    nguon: [ wiki-nannerl, ndb-wam ]
    ket_qua: null
    ghi_chu: 'chưa chắc: chỉ thấy ở Wikipedia (Nannerl Notenbuch, bảng số 11, kèm chữ Đức "einen Tag vor seinem 5ten Jahr um halb 10 uhr nachts in einer halben stund"); Köchel (trang sổ nhạc) và lời tựa Henle đã mở không trích ghi chú này. Phần "một ngày trước sinh nhật năm tuổi" khớp NDB (sinh 27.1.1756). Lượt 2 hay review tìm NMA IX/27/1 (dme.mozarteum.at) để xác nhận.'
  - id: n17
    cau: Năm 1756, năm Wolfgang ra đời, Leopold xuất bản một cuốn sách dạy violin rất có tiếng.
    loai: nam
    nguon: [ imslp-violinschule, ndb-lm, ndb-wam ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Augsburg: Johann Jacob Lotter, 1756"; NDB: Violinschule 1756 "der seinen bleibenden Ruhm begründete".'
  - id: n18
    cau: Leopold tự dạy đàn phím cho hai con.
    loai: lich-su
    nguon: [ henle-1236 ]
    ket_qua: dung
    ghi_chu: 'Henle: Nannerl học đàn từ khoảng tám tuổi, cha làm sổ nhạc cho con; Wolfgang lên bốn học đàn bằng sổ của chị; cha ghi các bài con sáng tác.'
  - id: n19
    cau: 'Năm 1759, Leopold làm cho Nannerl, khi ấy sắp tròn tám tuổi, một cuốn sổ nhạc chép tay gồm những minuet và bài nhỏ, xếp dần từ dễ đến khó; ngày nay gọi là Nannerl Notenbuch.'
    loai: lich-su
    nguon: [ henle-1236, kv-nb ]
    ket_qua: dung
    ghi_chu: 'Henle: bìa "Pour le Clavecin ce Livre Appartient a Mademoiselle Marie Anne Mozart 1759" (Köchel trích cùng dòng), Nannerl học đàn "around the age of eight", các bài "soon became longer and more difficult". Nannerl sinh tháng 7/1751 (Henle: hơn em bốn năm rưỡi).'
  - id: n20
    cau: Leopold dùng chính cuốn sổ ấy để dạy cậu em Wolfgang, kém chị gần năm tuổi, và ghi bên lề những gì con trai học được.
    loai: lich-su
    nguon: [ henle-1236 ]
    ket_qua: dung
    ghi_chu: 'Henle: "four and a half years older"; Wolfgang "started off with the one used by his older sister". Ghi chú bên lề: xem n16.'
  - id: n21
    cau: Ít lâu sau, Wolfgang tự nghĩ ra những bài nhỏ, chúng được chép vào cùng cuốn sổ; những bài đầu tiên ra đời trong năm 1761.
    loai: lich-su
    nguon: [ henle-1236, kv-nb ]
    ket_qua: dung
    ghi_chu: 'Henle: Leopold ghi "Wolfgang''s compositions from the first three months after his fifth birthday" (tức đầu năm 1761). Köchel KV 1d: autograph 1761.'
  - id: n22
    cau: 'Minuet K. 2 được ghi ngày tháng 1 năm 1762, ở Salzburg; Mozart sinh ngày 27 tháng 1 năm 1756, nên khi ấy cậu vừa hoặc sắp tròn sáu tuổi.'
    loai: nam
    nguon: [ kv-2, ndb-wam ]
    ket_qua: dung
    ghi_chu: 'Köchel: "Salzburg, 1762 – 01.1762"; NDB: "* 27.1.1756 Salzburg".'
  - id: n23
    cau: Có lẽ cậu chưa tự viết nhạc ra giấy được; nhiều khả năng Leopold đã ghi lại những gì con trai chơi.
    loai: lich-su
    nguon: [ kv-nb, henle-1236 ]
    ket_qua: dung
    ghi_chu: 'Köchel: "A large number of Mozart''s keyboard pieces was entered by Leopold Mozart" và Wolfgang chưa tự ghi được trước tám tuổi; Henle: "his father mostly did this for him". Câu dùng "có lẽ", "nhiều khả năng".'
  - id: n24
    cau: 'Phong cách galant giữa thế kỷ 18: câu ngắn, giai điệu dễ hát, bè trầm giản dị.'
    loai: dinh-nghia
    nguon: []
    ket_qua: null
    ghi_chu: 'chưa chắc: chưa mở được nguồn bậc 2 mô tả phong cách galant như vậy (OMT Galant Schemas chỉ nói các schema của "Galant style", dẫn Gjerdingen 2007, không định nghĩa). Đặc điểm câu ngắn, bè trầm giản dị đúng với bài (Mutopia).'
  - id: n25
    cau: Về sau nhiều trang bị tách khỏi cuốn sổ.
    loai: lich-su
    nguon: [ henle-1236 ]
    ket_qua: dung
