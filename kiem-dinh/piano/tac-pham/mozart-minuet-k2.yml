khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Đoạn A ô 1–8, 3/4, L:1/8, K:F. Ấn bản: Breitkopf & Härtel (Mozarts Werke) qua Mutopia menuet_k2 (.ly và .mid). Công cụ: script Python (mido) in nốt MIDI theo ô, đối chiếu từng nốt cả hai tay. Kết quả: 8/8 ô khớp cao độ và trường độ hai tay (tay phải Fa5 La5 Đô5 Đô5 | Rê5 Fa5 Si♭4 Si♭4 | La4 Đô5 Fa4 Mi4 | Mi4 Fa4 | Đô4 Mi4 Sol4 Sol4 | Đô4 Fa4 La4 La4 | chùm ba Đô4 Mi4 Sol4, Si♭4 La4 | La4 Sol4; tay trái Fa3 La3 | Si♭3 Si♭3 | Đô4 Đô3 | Fa3 Đô3 Fa2 | Đô3 | Đô3 | Đô3 Mi3 Fa3 | Đô4 Sol3 Đô3). Dấu luyến khớp tệp .ly. Số ngón chơi được.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4, đủ phách. Cặp móc đơn luyến lên quãng ba rồi rơi quãng sáu xuống hai nốt đen có dấu chấm (Fa–La–Đô, Sol–Si♭–Rê, La–Đô–Mi), đúng mô tả; nền Fa, Sol, La, Fa. Ngón 2-4-1 chơi được.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4, đủ phách. Ô 1–3 khớp từng nốt ô 4, 8, 12 của bài (MIDI Mutopia), hai tay; ô 4 cùng hình ở Rê thứ (Đô♯–Rê trên Rê). Dấu nhỏ dần (>( >)) đúng ý "dựa và nhả". Ngón chơi được.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: '5 ô 3/4, đủ phách (chùm ba = một phách). Ô 1–2 khớp từng nốt ô 5 và ô 7 của bài hai tay; ô 3–4 cùng hình cao một bậc. Ngón 1-2-3-5-4 chơi được.'
doi_chu:
  - cu: "Cả bài chỉ dài chừng một phút. Nghe ít nhất hai bản: một bản trên harpsichord (ví dụ của Guy Penson) và một bản trên piano (ví dụ của Alessandro Deljavan, trong album dành cho cuốn sổ nhạc của Nannerl). Mỗi lần nghe, chú ý một điều:"
    moi: "Cả bài chỉ dài chừng một phút. Nghe ít nhất hai bản: một bản trên harpsichord và một bản trên piano (ví dụ của Alessandro Deljavan, trong album dành cho cuốn sổ nhạc của Nannerl). Mỗi lần nghe, chú ý một điều:"
    ly_do: "n30 (da-sua): chưa tìm được bản thu bài này của Guy Penson; bản của Deljavan có track K. 2 (OnClassical 2022)."
  - cu: 'PTNA Piano Encyclopedia, mục "Menuet F-Dur K2" (enc.piano.or.jp): phân tích hình thức và các nốt treo.'
    ly_do: "n86 (da-bo): không tìm thấy mục PTNA riêng cho KV 2; link chỉ trỏ trang chủ."
  - cu: "Ở ô 20, tai chờ hợp âm Fa trưởng thì bè trầm lại đi tới Rê: một kết lừa (xem Kết và câu nhạc). Dấu ngân cho người nghe một khoảnh khắc để nhận ra bất ngờ ấy. Không phải ấn bản nào cũng in dấu ngân ở ô 20; nếu bản của bạn không có, vẫn nên thở nhẹ ở đó trước khi chủ đề trở lại."
    moi: "Ở ô 20, tai chờ hợp âm Fa trưởng thì bè trầm lại đi tới Rê: một kết lừa (xem Kết và câu nhạc). Dấu ngân cho người nghe một khoảnh khắc để nhận ra bất ngờ ấy. Bản Breitkopf in dấu ngân ở ô 20; nếu bản của bạn không có, vẫn nên thở nhẹ ở đó trước khi chủ đề trở lại."
    ly_do: "n70 (da-sua): câu cũ không kiểm được; bản Breitkopf (Mutopia) có dấu ngân ở ô 20."
