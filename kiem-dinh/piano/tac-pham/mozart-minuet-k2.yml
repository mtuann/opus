  - cu: "Bài được viết cho đàn phím của thời ấy, harpsichord hoặc clavichord (xem Lịch sử cây đàn piano), theo phong cách galant giữa thế kỷ 18: câu ngắn, giai điệu dễ hát, bè trầm giản dị. Minuet là điệu nhảy cung đình nhịp 3/4; về sau nó thành chương ba quen thuộc của giao hưởng và sonata Cổ điển (xem Minuet và Trio và thời kỳ Cổ điển)."
    moi: Bài được viết cho đàn phím của thời ấy, harpsichord hoặc clavichord (xem Lịch sử cây đàn piano), theo phong cách galant ("lịch lãm, kiểu cung đình"), lối viết thế kỷ 18 mà Mozart thời đầu ưa dùng. Minuet là điệu nhảy cung đình nhịp 3/4; về sau nó thành chương ba quen thuộc của giao hưởng và sonata Cổ điển (xem Minuet và Trio và thời kỳ Cổ điển).
    ly_do: "Review D6-L1-gom (n24): các đặc điểm cũ không có nguồn bậc 2; viết theo Concise Oxford Dictionary of Music, mục galant."
