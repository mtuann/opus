  - id: n34
    cau: 'Theo dõi khi nghe, đoạn A (ô 1–8): cặp móc đơn đi lên rồi rơi xuống hai nốt đen, ba lần liền, mỗi lần thấp hơn; ô 5–8 đi lên và dừng lơ lửng.'
