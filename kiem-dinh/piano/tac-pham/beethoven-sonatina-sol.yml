  - cu: Rải nhanh từ dưới lên; quyết định trước độ dài dấu lặng ngân và giữ đúng như thế mỗi lần
    moi: Rải nhanh từ dưới lên; quyết định trước độ dài dấu ngân và giữ đúng như thế mỗi lần
    ly_do: 'n25 (da-sua): như trên.'
  - cu: 'Bản Breitkopf ghi khá ít, và những gì có đều đáng tôn trọng: p ở đầu chương I, nhỏ dần trên các cặp nốt đi xuống ở ô 2, mf ở đoạn B (ô 9) và ở coda (ô 25), dolce khi chủ đề trở lại ở ô 17. Ở Romanze: lớn dần ở ô 9, nhỏ dần trước dấu lặng ngân ở ô 19, p ở coda. Giữa các chỉ dẫn đó, để câu nhạc tự lên xuống nhẹ theo giai điệu. Tay trái luôn nhỏ hơn tay phải một bậc. Các ấn bản khác có thể ghi khác; xem thêm Tạo tiếng đàn.'
    moi: 'Bản Breitkopf ghi khá ít, và những gì có đều đáng tôn trọng: p ở đầu chương I, nhỏ dần trên các cặp nốt đi xuống ở ô 2, mf ở đoạn B (ô 9) và ở coda (ô 25), dolce khi chủ đề trở lại ở ô 17. Ở Romanze: lớn dần ở ô 9, nhỏ dần ngay trên nốt có dấu ngân ở ô 19, p ở coda. Giữa các chỉ dẫn đó, để câu nhạc tự lên xuống nhẹ theo giai điệu. Tay trái luôn nhỏ hơn tay phải một bậc. Các ấn bản khác có thể ghi khác; xem thêm Tạo tiếng đàn.'
    ly_do: 'n25 (da-sua): như trên (đoạn Sắc thái, chỉ trích câu đổi). Review D6-L2-gom: n56 (lượt 2 sai): MEI TROMPA (Nr1_2) ô 19: hairpin dim tstamp 1 tới 3,5, fermata đặt trên nốt Mi5 ở phách 1: nhỏ dần bắt đầu ngay trên nốt có dấu ngân, không phải trước nó.'
  - cu: Kéo dấu lặng ngân ở ô 19 quá lâu, hoặc bỏ qua nó.
    moi: Kéo dấu ngân ở ô 19 quá lâu, hoặc bỏ qua nó.
