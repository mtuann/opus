  - cu: 'Wiener Urtext Edition, UT 50290 Drei Sonatinen für Klavier (Anh. 5 số 1 và 2, WoO 50; Jochen Reutter biên tập, 2021): lời giới thiệu về quyền tác giả.'
    moi: 'Wiener Urtext Edition, UT 50290 Drei Sonatinen für Klavier (Anh. 5 số 1 và 2, WoO 50; Jochen Reutter biên tập, 2020): phần giới thiệu của nhà xuất bản về quyền tác giả.'
    ly_do: 'n72 (da-sua): chỉ đọc được mô tả của nhà xuất bản. Review D6-L2-gom: n72 (lượt 2 sai): năm 2020 theo DNB (như n12).'
  - cu: Gustav Nottebohm, Thematisches Verzeichniss der im Druck erschienenen Werke von Ludwig van Beethoven, ấn bản 2, Breitkopf & Härtel, Leipzig, 1868.
    moi:
      - Alexander Wheelock Thayer, Chronologisches Verzeichniss der Werke Ludwig van Beethoven's, Berlin, 1865, số 24 (Internet Archive).
      - Gustav Nottebohm, Thematisches Verzeichniss der im Druck erschienenen Werke von Ludwig van Beethoven, ấn bản 2, Breitkopf & Härtel, Leipzig, 1868, tr. 148 (Internet Archive).
    ly_do: 'n74 (da-sua): thêm nguồn của câu về Thayer và số trang Nottebohm; hai dòng danh sách.'
  - cu: 'Bước đệm trước Clementi. Ngắn và dễ hơn Clementi: Sonatina Op. 36 số 1, nhưng cùng một thế giới âm thanh.'
    moi: 'Bước đệm trước Clementi. Ngắn hơn Clementi: Sonatina Op. 36 số 1 (hai chương thay vì ba), nhưng cùng một thế giới âm thanh.'
    ly_do: 'Review D6-L2-gom: n7: bỏ "dễ hơn" (lượt 2 khong-chac: Henle xếp cả Anh. 5,1 và Op. 36,1 mức 3; ABRSM xếp hai chương khác nhau của hai bài, không so được cả bài); thêm lý do "ngắn hơn": hai chương thay vì ba (MEI TROMPA, Mutopia).'
  - cu: 'Bài có mặt trong rất nhiều tuyển tập sonatina cho người học, nên bạn sẽ gặp đủ loại bản thu, từ nghệ sĩ chuyên nghiệp đến học sinh. Hãy chọn hai bản khác nhau rõ rệt và so sánh: tốc độ Moderato, độ ngắn của nốt láy, cách Romanze chuyển động (trôi hay kéo). Nếu tìm được, nghe thêm một bản trên fortepiano (đàn piano của thời ấy) để hình dung tiếng đàn mỏng và rõ mà bài này vốn hướng tới.'
    moi: 'Bài có mặt trong rất nhiều tuyển tập sonatina cho người học, nên bạn sẽ gặp đủ loại bản thu, từ nghệ sĩ chuyên nghiệp đến học sinh. Hãy chọn hai bản khác nhau rõ rệt và so sánh: tốc độ Moderato, độ ngắn của nốt láy, cách Romanze chuyển động (trôi hay kéo). Nếu tìm được, nghe thêm một bản trên fortepiano (đàn piano của thời ấy) để so tiếng đàn với đàn hiện đại.'
    ly_do: 'Review D6-L2-gom: n27: bỏ vế "để hình dung tiếng đàn mỏng và rõ mà bài này vốn hướng tới" (nhận xét về âm sắc fortepiano, không có nguồn), giữ lời khuyên nghe.'
  - cu: 'Nhiều tuyển tập cho người học in bài dưới tên Beethoven mà không ghi chú gì, kèm sắc thái và số ngón của người biên tập. Bản Urtext ghi rõ số Anh. 5 và cho biết đâu là chỉ dẫn của nguồn. Khi giới thiệu bài trong một buổi biểu diễn, cách nói trung thực là: "Sonatina Sol trưởng, Anh. 5 số 1, gán cho Beethoven".'
    moi: 'Từ thế kỷ 19, bài được in nhiều lần dưới tên Beethoven mà không ghi chú gì về chuyện tác giả, như trong toàn tập Breitkopf & Härtel. Bản Urtext ghi rõ số Anh. 5 và cho biết đâu là chỉ dẫn của nguồn. Khi giới thiệu bài trong một buổi biểu diễn, cách nói trung thực là: "Sonatina Sol trưởng, Anh. 5 số 1, gán cho Beethoven".'
    ly_do: 'Review D6-L2-gom: n59: bỏ vế "kèm sắc thái và số ngón của người biên tập" (không nguồn; lượt 2 khong-chac); viết theo nguồn: Nottebohm 1868 liệt kê các bản in dưới tên Beethoven; bản Breitkopf in "von L. van Beethoven", không ghi chú (MEI TROMPA).'
