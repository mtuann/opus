nhan_dinh:
  - id: n1
    cau: Với rất nhiều người học đàn, đây là bài "Beethoven" đầu tiên, dù rất có thể ông không hề viết nó.
    loai: lich-su
    nguon: [ wu-50290, henle-365 ]
    ket_qua: dung
    ghi_chu: 'Wiener Urtext: "likely the first encounter with Beethoven''s piano music for many aspiring players. Yet one cannot even be sure whether it ... was written by Beethoven"; Henle: "firmly established in the repertoire for beginners", "very unlikely that they were actually written by Beethoven".'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2026/https://www.schott-music.com/en/3-sonatinas-for-piano-no446369.html", "https://henle.de/2-Piano-Sonatinas-G-major-and-F-major-Anh.-5/HN-365" ]
    luot_2_ghi_chu: "Wiener Urtext (Schott): 'likely the first encounter with Beethoven's piano music for many aspiring players. Yet one cannot even be sure whether it … was written by Beethoven'. Henle: 'very unlikely that they were actually written by Beethoven'."
  - id: n2
    cau: 'Bài có hai chương ngắn, Moderato và Romanze.'
    loai: cau-truc
    nguon: [ trompa, imslp-anh5 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Sonatina in G major (Moderato, Romanze); MEI: tempo "Moderato", chương 2 "Romanze".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/2_Sonatinas_for_Piano,_Anh.5_(Beethoven,_Ludwig_van)", "https://github.com/trompamusic-encodings/Beethoven_WoOAnh5_BreitkopfHaertel/blob/master/Beethoven_WoOAnh5-Breitkopf.pdf" ]
    luot_2_ghi_chu: "IMSLP: Sonatina in G major: Moderato; Romanze. Breitkopf ghi đúng hai chương."
  - id: n3
    cau: 'Bài dạy câu nhạc rõ ràng, dấu luyến ngắn, nốt láy gọn, tay trái nhẹ nhàng bên dưới; câu nhạc bốn ô hỏi rồi đáp, dấu luyến hai nốt, nốt láy, kết rõ ràng.'
    loai: cau-truc
    nguon: [ trompa ]
    ket_qua: dung
    ghi_chu: 'Câu 4 ô (ô 1–4 dừng ở Rê, 5–8 về Sol); luyến hai nốt ô 2, 7, 18, 23; nốt láy (grace) ô 1, 3, 5, 6.'
    luot_2: dung
    luot_2_nguon: [ "https://github.com/trompamusic-encodings/Beethoven_WoOAnh5_BreitkopfHaertel/blob/master/Beethoven_WoOAnh5-Breitkopf.pdf" ]
    luot_2_ghi_chu: "Bản Breitkopf & Härtel (Serie 16, No. 160, bản quét trong kho TROMPA) và bản MEI cùng kho: câu 4 ô hỏi–đáp (ô 1–4, 5–8), luyến hai nốt (ô 2, 7), nốt láy (ô 1, 3, 5, 6), tay trái hợp âm hai nốt rồi Alberti."
  - id: n4
    cau: Những viên gạch ấy bạn sẽ gặp lại ở Clementi, Haydn, Mozart.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: "Lời khuyên tập: các 'viên gạch' Cổ điển (câu bốn ô, Alberti, nốt láy) gặp lại ở Clementi, Haydn, Mozart: hợp lý."
  - id: n5
    cau: 'Moderato duyên dáng và nhanh nhẹn; Romanze hát, mềm, có một khoảnh khắc dừng lại đầy chờ đợi.'
    loai: cau-truc
    nguon: [ trompa ]
    ket_qua: dung
    ghi_chu: Phần tính cách là cảm nhận; "khoảnh khắc dừng lại" là fermata ô 19 (MEI).
    luot_2: dung
    luot_2_nguon: [ "https://github.com/trompamusic-encodings/Beethoven_WoOAnh5_BreitkopfHaertel/blob/master/Beethoven_WoOAnh5-Breitkopf.pdf" ]
    luot_2_ghi_chu: "Bản Breitkopf & Härtel (Serie 16, No. 160, bản quét trong kho TROMPA) và bản MEI cùng kho: Moderato; Romanze 6/8 giai điệu hát, có dấu ngân ở ô 19. Tính chất 'duyên dáng, mềm' là nhận xét."
  - id: n6
    cau: 'Tay trái dùng hợp âm hai nốt, hình Alberti (nốt trầm – nốt cao – nốt giữa – nốt cao), hình đệm 6/8.'
    loai: cau-truc
    nguon: [ trompa ]
    ket_qua: dung
    ghi_chu: 'Ô 1–4 hợp âm hai nốt; ô 5 G3 D4 B3 D4 (trầm – cao – giữa – cao), khớp thuat-ngu.yml alberti-bass "trầm – cao – giữa – cao"; Romanze nốt trầm + hai hợp âm.'
    luot_2: dung
    luot_2_nguon: [ "https://github.com/trompamusic-encodings/Beethoven_WoOAnh5_BreitkopfHaertel/blob/master/Beethoven_WoOAnh5-Breitkopf.pdf" ]
    luot_2_ghi_chu: "Bản Breitkopf & Härtel (Serie 16, No. 160, bản quét trong kho TROMPA) và bản MEI cùng kho: chương I ô 1–4 hợp âm hai nốt, ô 5–6 Alberti G–D–B–D (trầm–cao–giữa–cao); Romanze đệm nốt trầm + hai hợp âm 6/8."
  - id: n7
    cau: 'Bài ngắn hơn Clementi Sonatina Op. 36 số 1 (link): hai chương thay vì ba, cùng một thế giới âm thanh.'
    loai: cap-do
    nguon: [ trompa, mut-cl-o36 ]
    ket_qua: da-sua
    ghi_chu: 'Ngắn hơn: Anh. 5/1 có 34 + 40 ô; Op. 36/1 có 38 + 26 + 70 ô (Mutopia, hồ sơ clementi-sonatina). Dễ hơn: ABRSM 2025–2026 xếp Moderato ở Grade 2, ABRSM 2023–2024 xếp Vivace của Op. 36/1 ở Grade 3 (hồ sơ bản ghi lần 1); Henle cùng mức 3. Link: src/content/docs/piano/tac-pham/clementi-sonatina.md có. Review D6-L2-gom: lượt 2 khong-chac vế "dễ hơn": Henle xếp cả Anh. 5,1 (HN 365) và Op. 36,1 (HN 848) mức 3; ABRSM xếp chương I của bài này ở Grade 2 và chương III của Clementi ở Grade 3, không so được cả bài. Bỏ "dễ hơn"; "ngắn hơn" lượt 2 đã xác nhận, thêm lý do: hai chương (MEI) và ba chương (Mutopia). doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://henle.de/2-Piano-Sonatinas-G-major-and-F-major-Anh.-5/HN-365", "https://www.henle.de/en/Six-Piano-Sonatinas-op.-36/HN-848", "https://www.mutopiaproject.org/ftp/ClementiM/O36/sonatina-1/sonatina-1.ly" ]
    luot_2_ghi_chu: "Ngắn hơn: đúng (2 chương; Clementi Op. 36 số 1 có 3 chương, Mutopia). 'Dễ hơn' không được nguồn xác nhận: Henle xếp cả Anh. 5,1 và Op. 36,1 cùng mức 3 (easy)."
    review: dung
  - id: n8
    cau: Danh mục chuẩn về tác phẩm Beethoven do Georg Kinsky soạn và Hans Halm hoàn tất (1955).
    loai: lich-su
    nguon: [ ddb-kh, db-kinsky, henle-2207 ]
    ket_qua: dung
    ghi_chu: 'DDB: "Das Werk Beethovens: thematisch-bibliographisches Verzeichnis seiner sämtlichen vollendeten Kompositionen", Henle 1955, Kinsky tác giả, Halm cộng tác; Deutsche Biographie: Kinsky 1882–1951 (mất trước khi sách ra); Henle: "In 1955 G. Henle Publishers released a catalogue ... Georg Kinsky and Hans Halm".'
    luot_2: dung
    luot_2_nguon: [ "https://portal.dnb.de/opac/simpleSearch?query=Kinsky+Halm+Das+Werk+Beethovens+1955" ]
    luot_2_ghi_chu: "DNB: 'Das Werk Beethovens: thematisch-bibliographisches Verzeichnis …' / Georg Kinsky; 'Nach d. Tode d. Verf. abgeschlossen u. hrsg. von Hans Halm', München: Henle, 1955."
  - id: n9
    cau: 'Danh mục chia tác phẩm thành ba nhóm: có số opus; không có số opus (WoO, Werke ohne Opuszahl); và Anhang, phụ lục cho tác phẩm mà quyền tác giả đáng ngờ; hai sonatina nằm ở mục thứ năm của phụ lục, nên mang số Anh. 5.'
    loai: danh-muc
    nguon: [ henle-2207, henle-365, imslp-anh5 ]
    ket_qua: dung
    ghi_chu: 'Henle HN 2207: "Works with opus number", "Works without opus number", "Spurious and dubious works" (danh mục mới giữ cấu trúc ấy); Henle HN 365: "listed in his catalogue of works as Anhang/Appendix 5"; IMSLP: "WoO Anh.5".'
    luot_2: dung
    luot_2_nguon: [ "https://henle.de/2-Piano-Sonatinas-G-major-and-F-major-Anh.-5/HN-365", "https://portal.dnb.de/opac/simpleSearch?query=Kinsky+Halm+Das+Werk+Beethovens+1955" ]
    luot_2_ghi_chu: "Henle: không có số opus mà 'listed in his catalogue of works as Anhang/Appendix 5'. Danh mục Kinsky–Halm có ba phần: Op., WoO (Werke ohne Opuszahl), Anhang."
  - id: n10
    cau: 'Không còn bản viết tay, và không có thư từ hay ghi chép nào của Beethoven nhắc đến hai bài.'
    loai: lich-su
    nguon: [ lvb-anh5 ]
    ket_qua: dung
    ghi_chu: 'lvbeethoven.it: "I manoscritti originali sono sconosciuti. Beethoven non menzionò mai le sonatine durante la sua vita." Review D6-L2-gom: lvbeethoven.it (bản lưu Wayback 14/7/2026, review tự mở): "Le due sonatine Anhang 5 apparvero a stampa intorno al 1807, vivente Beethoven, presso Altona, Rudolphus. I manoscritti originali sono sconosciuti. Beethoven non menzionò mai le sonatine durante la sua vita." Lượt 2 không mở được trang; review mở được: đúng cả hai vế.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không nguồn đã mở nào nói rõ không có bản viết tay hay thư từ nhắc tới. Thayer (1865) chỉ đoán có thể là 'Zwei vollständige kleine Stücke' trong danh mục đấu giá di sản (số 157).
    review: dung
  - id: n11
    cau: 'Henle ghi rằng hai bài được in khi Beethoven còn sống, khoảng năm 1807; bản in ấy (nhà Rudolphus ở Altona) ghi tên ông là tác giả.'
    loai: nam
    nguon: [ henle-365, lvb-anh5 ]
    ket_qua: da-sua
    ghi_chu: 'Henle: "published during Beethoven''s lifetime in ca. 1807" (không nói "dưới tên ông"). lvbeethoven.it: "1807 circa. Altona, Rudolphus ... Titolo: II SONATINES / pour le Piano-Forte / Composées par / L. van Beethoven". Chữ cũ: "Henle ghi rằng chúng được in khi Beethoven còn sống, khoảng năm 1807, dưới tên ông"; tách phần tên tác giả ra, dẫn đúng nguồn. Review D6-L2-gom: lvbeethoven.it (bản lưu Wayback 14/7/2026, review tự mở): "Le due sonatine Anhang 5 apparvero a stampa intorno al 1807, vivente Beethoven, presso Altona, Rudolphus. I manoscritti originali sono sconosciuti. Beethoven non menzionò mai le sonatine durante la sua vita." Henle: "published during Beethoven''s lifetime in ca. 1807" (lượt 2 xác nhận). Bản in Altona, Rudolphus khoảng 1807 có trong lvbeethoven.it; Nottebohm 1868 và Thayer 1865 không biết bản này, trang đã nói các nguồn khác nhau (n12). Giữ.'
