    ghi_chu: 'MEI: chương I: A ô 1–8 (không nhắc), ‖: B ô 9–16, A ô 17–24 :‖, coda 25–34; chương II: ‖: nhịp lấy đà + A ô 1–8 :‖ ‖: B 9–21, A 22–29 :‖, coda 29–40. OMT Ternary Form: "A and B do not repeat together, and neither do B and A"; OMT Binary Form: rounded binary là hai phần nhắc lại, chủ đề đầu trở lại trong phần hai. Trang Hình thức nhỏ (đã khóa): "Hai đoạn có tái hiện: A B A'', ‖: A :‖ ‖: B A'' :‖". Chữ cũ: "cả hai đều là ba đoạn A – B – A thêm một coda". Không có phần phát triển hay giọng át cho chủ đề hai, nên không phải hình thức sonata. Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn (MEI TROMPA, COD, OMT, Thayer, Nottebohm). Đúng.'
