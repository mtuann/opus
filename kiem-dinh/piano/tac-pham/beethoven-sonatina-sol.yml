    moi: Nốt nhắc lại nhẹ; hợp âm cuối có dấu ngân
    ly_do: 'n25 (da-sua): như trên.'
  - cu: Chuỗi nốt chấm dưới dấu luyến, lớn dần (ô 9); ba hợp âm rải Rê bảy và dấu lặng ngân (ô 17–19); tay phải một mình ở ô 20–21, có La♯
    moi: Chuỗi nốt chấm dưới dấu luyến, lớn dần (ô 9); ba hợp âm rải Rê bảy và dấu ngân (ô 17–19); tay phải một mình ở ô 20–21, có La♯
    ly_do: 'n25 (da-sua): như trên.'
