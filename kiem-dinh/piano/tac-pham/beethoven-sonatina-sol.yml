khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Chương I ô 1–8, 4/4, L:1/8, K:G. Ấn bản: Breitkopf & Härtel Serie 16 No. 160 qua MEI TROMPA (Nr1_1). Công cụ: script Python đọc MEI (nốt, dấu hóa con <accid>, nốt láy, luyến, dynam, hairpin). Kết quả: 8/8 ô khớp cao độ, trường độ hai tay; nốt láy (B4 ô 1, 5; C5 ô 3; F♯5 ô 6) khớp; số dấu luyến từng ô khớp (3 ở ô 2, 4 ở ô 7); p ô 1, dim ô 2 (phách 2–4) khớp; Fa♮ ô 5 tay trái khớp. Số ngón chơi được.'
  - khoi: 2
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Romanze nhịp lấy đà và ô 1–4, 6/8. Cùng ấn bản (MEI Nr1_2). Khớp: nhịp lấy đà B4 C5 D5 (có luyến); tay phải ô 1–4; tay trái nốt trầm + hai hợp âm, ô 3 hai bè (E3 nốt đen chấm dôi hai lần) với hợp âm G3+C♯4 (MEI ghi ♯ ở hợp âm đầu, hợp âm sau theo dấu hóa trong ô; ABC [G,^C][G,C] cùng nghĩa), ô 4 D3 với F♯3+D4. Không có sắc thái ở đầu chương, khớp. Số ngón chơi được.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 4/4 Sol trưởng, đủ phách. Cặp luyến (D B)(C A)(B G)(A F♯) trên Sol – Rê bảy – Sol – Rê bảy; ô 2 nốt láy A vào G ở phách 3 như lời dẫn; tay trái hợp âm hai nốt như ô 1–4 gốc. Ngón 5-3, 4-2, 3-1, 2-1 chơi được.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 4/4. Alberti tay trái G D B D (Sol), G E C E (Đô), F♯ D C D (Rê bảy), G D B D rồi hợp âm; giai điệu B–D, C–E, D–C, B nằm trong hợp âm. Sắc thái mp/pp đúng lời dẫn. Ngón 5-1-2-1 chơi được (quãng 5–6).'
  - khoi: 5
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 6/8, đủ phách. Hình đệm nốt trầm + hai hợp âm (G – B D, F♯ – C D) như Romanze; giai điệu legato trên Sol và Rê bảy, kết Sol. Ngón tay phải 3-4-5-3, 4-2-1-2 chơi được.'
doi_chu:
  - cu: 'Những gì ta biết khá ít. Không còn bản viết tay, và không có thư từ hay ghi chép nào của Beethoven nhắc đến hai bài. Henle ghi rằng chúng được in khi Beethoven còn sống, khoảng năm 1807, dưới tên ông; lời giới thiệu ấn bản Wiener Urtext (2021) thì nói bản in đầu tiên ra đời sau khi ông mất. Toàn tập Breitkopf & Härtel ở thế kỷ 19 ghi nhà xuất bản gốc là August Cranz ở Hamburg, rất xa Vienna, nơi Beethoven sống từ năm 1792.'
    moi: 'Những gì ta biết khá ít. Không còn bản viết tay, và không có thư từ hay ghi chép nào của Beethoven nhắc đến hai bài. Henle ghi rằng chúng được in khi Beethoven còn sống, khoảng năm 1807; bản in ấy (nhà Rudolphus ở Altona) ghi tên ông là tác giả. Phần giới thiệu ấn bản Wiener Urtext (2020) thì nói bản in đầu tiên ra đời sau khi ông mất. Toàn tập Breitkopf & Härtel ở thế kỷ 19 ghi nhà xuất bản gốc là August Cranz ở Hamburg, rất xa Vienna, nơi Beethoven sống từ năm 1792.'
    ly_do: 'n11 (da-sua), n12 (da-sua): Henle không nói "dưới tên ông"; tên trên bản in Altona theo lvbeethoven.it; chỉ đọc được mô tả của Wiener Urtext, không phải lời tựa. Review D6-L2-gom: n12 (lượt 2 sai): năm của ấn bản Wiener Urtext UT 50290 là 2020 (DNB d-nb.info/1228647941: "Erscheinungsdatum: [2020] © 2020"), không phải 2021.'
  - cu: 'Âm nhạc thuộc phong cách Cổ điển phổ biến cuối thế kỷ 18: giai điệu chia thành câu bốn ô, hòa âm chủ yếu là chủ âm và át âm, tay trái đệm bằng hợp âm hai nốt và hình Alberti. Tuy mang tên sonatina, không chương nào có hình thức sonata: cả hai đều là ba đoạn A – B – A thêm một coda (xem Hình thức nhỏ). Romanze (romance) là cái tên thời ấy hay đặt cho một chương chậm vừa, giản dị, có tính chất bài hát; chương hai của Eine kleine Nachtmusik (Một khúc nhạc đêm nhỏ) của Mozart cũng mang tên này. Xem thêm thời kỳ Cổ điển.'
    moi: 'Âm nhạc thuộc phong cách Cổ điển phổ biến cuối thế kỷ 18: giai điệu chia thành câu bốn ô, hòa âm chủ yếu là chủ âm và át âm, tay trái đệm bằng hợp âm hai nốt và hình Alberti. Tuy mang tên sonatina, không chương nào có hình thức sonata: cả hai đều là hình thức hai đoạn có tái hiện (A – B – A, trong đó B và A nhắc lại cùng nhau) thêm một coda (xem Hình thức nhỏ). Romanze (romance) là cái tên không gắn với một hình thức cố định, thường gợi tính chất dịu dàng, riêng tư; Mozart đặt tên này cho chương chậm của Concerto piano Rê thứ K. 466, và chương hai của Eine kleine Nachtmusik (Một khúc nhạc đêm nhỏ) cũng mang tên này. Xem thêm thời kỳ Cổ điển.'
    ly_do: 'n20 (da-sua): B và A nhắc lại cùng nhau là hai đoạn có tái hiện (OMT Ternary Form, Binary Form; trang Hình thức nhỏ). n21 (da-sua): định nghĩa romance theo COD.'
  - cu: Romanze. Bạn cảm mỗi ô hai phách hay sáu phách? Ở đâu nhạc dừng lại trên một dấu lặng ngân (fermata)?
    moi: Romanze. Bạn cảm mỗi ô hai phách hay sáu phách? Ở đâu nhạc dừng lại trên một dấu ngân (fermata)?
    ly_do: 'n25 (da-sua): fermata đặt trên nốt, không trên dấu lặng; thuật ngữ theo thuat-ngu.yml (fermata: ngân dài tùy ý).'
  - cu: 'II. B (ô 9–21): chuỗi nốt đi lên, lớn dần, sang Rê trưởng; ba hợp âm rải và dấu lặng ngân ở ô 19; tay phải một mình dẫn về'
    moi: 'II. B (ô 9–21): chuỗi nốt đi lên, lớn dần, sang Rê trưởng; ba hợp âm rải và dấu ngân ở ô 19; tay phải một mình dẫn về'
    ly_do: 'n25 (da-sua): như trên.'
