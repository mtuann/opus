      kiem_mau: "Claude Opus 5.5, kiểm thay chủ repo theo lời giao 06/11/2026 (chủ repo không tự kiểm): 8 nhận định mẫu của D6-L2, 8 đúng, 0 sai (bao-cao/d6-l2-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Bài học Sonatina Sol trưởng Anh. 5 số 1, gán cho Beethoven (tầng Tác phẩm). Bản nhạc: bản mã hóa MEI của TROMPA (Werner Goebl, CC BY 4.0) theo Breitkopf & Härtel, Beethovens Werke Serie 16 No. 160 (B.160), kèm PDF dựng từ MEI; đọc bằng script Python (xml.etree) in nốt, dấu hóa, dấu luyến, sắc thái, fermata theo ô; đối chiếu từng nốt khối 1 (8 ô) và khối 2 (nhịp lấy đà + 4 ô). Nguồn lịch sử: Henle HN 365 (trang sản phẩm), mô tả của Wiener Urtext UT 50290 (chép lại trên trang bán lẻ), Centro Ricerche Musicali Beethoveniane (lvbeethoven.it, qua bản lưu Wayback: mạng chặn trang gốc), Thayer 1865 và Nottebohm 1868 (bản OCR trên Internet Archive), Deutsche Biographie (Kinsky, Nottebohm, Beethoven), DDB (bản ghi Kinsky–Halm). Sửa trang ở lượt 1: n11 (bản in 1807 ghi tên Beethoven: nguồn là lvbeethoven.it, không phải Henle), n12 (Wiener Urtext: "phần giới thiệu" của nhà xuất bản), n20 (hình thức: hai đoạn có tái hiện thêm coda, không phải ba đoạn, theo OMT và trang Hình thức nhỏ đã khóa), n21 (định nghĩa Romanze theo COD), n25 (thuật ngữ: "dấu lặng ngân" thành "dấu ngân", 8 chỗ; fermata ở ô 19 và ô 34 đặt trên nốt và hợp âm, không trên dấu lặng; thuat-ngu.yml fermata "Ngân dài tùy ý"), n72 (mục Nguồn: Wiener Urtext), n74 (thêm Thayer 1865, số trang Nottebohm). Chưa chắc: n53 (Moderato, chỉ thiếu nguồn bậc 2). Không tính là nhận định: tiêu đề, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng, mốc trong ::khoi-nghe (bản thu của León Egea: chương II không chơi dấu nhắc lại, khớp dòng "-" của mốc; khoảng cách mốc 153→181→229→258 ứng với 8, 13, 8 ô).'
