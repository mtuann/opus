    cau: Câu "Cái tên Lieder ohne Worte có lẽ do chính Mendelssohn nghĩ ra" và câu về vai trò của Fanny Mendelssohn.
    loai: lich-su
    nguon:
      - britannica-sww
    ket_qua: da-bo
    ghi_chu: "Đã bỏ hai câu: \"Cái tên Lieder ohne Worte có lẽ do chính Mendelssohn nghĩ ra. Chị gái ông, Fanny, cũng viết nhiều bài hát cho piano, và một số nhà nghiên cứu cho rằng bà góp phần gợi ý cho thể loại này.\" Lý do: chỉ thấy ở Wikipedia; Henle Preface và Britannica không nói. Review D6-L4-gom: giữ bỏ. Lượt 2 (lời tựa Henle HN 327): tập đầu in ở London với tên Original Melodies; tháng 1/1832 Mendelssohn gọi là \"Romanzen\", thư 15/6/1832 mới dùng \"Lieder ohne Worte\"; nguồn không nói cái tên \"có lẽ do chính Mendelssohn nghĩ ra\". Câu về Fanny không có nguồn bậc 2."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.henle.de/media/7d/7b/e0/1690886047/0327-1690886047-sync.pdf" ]
    luot_2_ghi_chu: 'Lời tựa Henle HN 327: tập đầu in ở London với tên "Original Melodies"; tháng 1/1832 ông gọi là "Romanzen", trong thư 15/6/1832 mới dùng "Lieder ohne Worte". Nguồn không nói cái tên "có lẽ do chính Mendelssohn nghĩ ra". Danh sách không ghi nội dung câu về Fanny Mendelssohn nên không kiểm được.'
