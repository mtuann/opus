    ket_qua: dung
    ghi_chu: 'Henle Preface: op. 30 no. 6 in mùa xuân 1835, op. 62 no. 5 in tháng 4/1844; trang sản phẩm: "Venetian Gondola Song" f sharp minor op. 30,6, a minor op. 62,5.'
