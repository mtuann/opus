khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not-tay-phai
      - not-tay-trai
      - sac-thai
      - doi-chieu-an-ban
    ket_qua: dung
    ghi_chu: 'Ô 7–11, 6/8, L:1/8, K:Gm. Ấn bản: Breitkopf & Härtel 1874–77 qua Mutopia 1679 (.ly và .mid, tải 05/11/2026). Công cụ: script Python (mido) in nốt theo ô; đọc .ly cho dấu luyến, sắc thái, chữ. Kết quả: 5/5 ô khớp cao độ, trường độ cả hai tay (tay phải ô 7 B♭4–D5 ở móc đơn cuối; ô 8 A–C, G–B♭, F♯–A, A–C; ô 9 D4–B♭4, C4–A4, B♭3–G4, D4; ô 10 C–E♭ ×2, C–E♭/D–F móc kép, E♭–G, C–E♭ staccato; ô 11 D4 cả ô (giọng 2, dấu nhấn) và B♭4–D5 p; tay trái G2, G3–B♭3/A3–C4/G3/G3–C4, D3/E♭3). cantabile ô 7, p tay trái ô 1 (đặt ở ô 7 của đoạn trích), dấu luyến khớp. Q:3/8=40 là tốc độ phát của site (bản nhạc không ghi số).'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
      - ban-dap
    ket_qua: dung
    ghi_chu: 'Sol thứ, 6/8: tay trái nốt trầm – hợp âm – nốt giữa hai lần mỗi ô (Gm – Cm – D7 – Gm); tay phải B♭ – C – A – G ngân trọn ô, mỗi nốt thuộc hợp âm. Ngón 5 / 2-1 / 4 chơi được; Ped. ở mỗi nốt trầm. Ô 3 D2 → A3–C4 xa nhất, đúng lời dẫn.'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
    ket_qua: dung
    ghi_chu: 'Sol thứ, 6/8, hai bè trong tay phải: bè trên Rê Đô Rê Si♭ | Đô Rê Đô La | Si♭ Đô La Fa♯ | Sol, bè dưới cách quãng ba (kết quãng sáu Si♭3–Sol4). Cặp ngón 5/3, 4/2, 5/3, 3/1 … chơi được; ô 3–4 ngón cái nhảy Fa♯ → Rê, Rê → Si♭: đúng lời dẫn. Mỗi ô 6 móc đơn ở cả hai bè; tay trái nốt trầm Sol, Rê, Đô, Rê, Sol.'
  - khoi: 4
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
    ket_qua: dung
    ghi_chu: 'Sol thứ, 6/8: giai điệu (thân lên) ở phách 1 và 4 (móc đơn 1, 3/4…), hợp âm đệm (thân xuống) giữa phách; hòa âm Gm – D7 – Gm – D7 – Cm – D7 – Gm. Ô 3: Sol rồi La giữ ba móc đơn trong khi đánh [C E♭] hai lần và [C F♯] hai lần: đúng lời dẫn. Mỗi bè đủ 6 móc đơn. Ô 1 ngón 3 ở La (lời dẫn nói 4–5): chơi được, khác chút ít với lời dẫn.'
ghi_chu: 'Bài học Thuyền ca Venice Op. 19 số 6 (tầng Tác phẩm). Bản nhạc: Mutopia 1679 (Breitkopf & Härtel 1874–77, Ryan Prince, CC BY 3.0; .ly từ kho GitHub và .mid từ mutopiaproject.org, tải 05/11/2026; .mid khớp ../opus-zero/_imslp/mid/mut_mendel196.mid về số ô), đọc bằng script Python (mido): 46 ô, mọi số ô, sắc thái, sfz, bàn đạp trên trang khớp. Lịch sử: lời tựa Henle HN 1172 (Scheideler 2012, PDF), trang sản phẩm Henle HN 1172, Britannica (bản lưu Wayback), IMSLP (wikitext). Sửa trang: n6 (kỹ năng nền: Träumerei thay ba tên), n9 (barcarolle khác), n18 (bỏ hai câu về tên Lieder ohne Worte và Fanny, chỉ có ở Wikipedia), n19, n21 (tên Venetianisches Gondellied: thư 1835; bỏ 12/8), n29 (bỏ Barenboim), n100 (bỏ vế IMSLP), n103 (hai bài Venetianisches Gondellied và Gondellied La trưởng), n115 (Nguồn: Britannica thay Wikipedia). Không có câu chưa chắc. Câu ở hồ sơ khác (đã khóa) trỏ tới trang này, đã kiểm trên bản nhạc: giai điệu quãng ba, quãng sáu ô 7–17, 34–39 (piano/not-lap-not-kep n27, n42: đúng); quãng tám Rê ô 36–39 (piano/quang-tam-buoc-nhay n38): quãng tám ở ô 36, 38, 39; bản nhạc ghi mf ô 34, dim. ô 36, pp ô 38, không có p; "p rồi pp" là lời khuyên cho quãng tám (nhỏ hơn giai điệu), không trái bản nhạc; giữ nguyên chữ; tay trái đung đưa 6/8, nhảy nốt trầm – hợp âm (n34: đúng); bản thu Wikimedia Commons FAE Piano cafe (cap-nhat n46: đúng, xem hồ sơ bản ghi). Không tính là nhận định: tiêu đề mục, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (hồ sơ du-lieu/tac-pham/mendelssohn-thuyen-ca), mốc trong ::khoi-nghe. Thuật ngữ trang dùng có trong src/data/thuat-ngu.yml: Andante, sostenuto, cantabile, sforzando, staccato, legato, diminuendo, crescendo, leading-tone (cảm âm); chưa có bản ghi: barcarolle, portato, sempre, âm nền (pedal point), hợp âm sáu tăng (ghi cho D3-L5).'
doi_chu:
- cu: Khoảng ABRSM Grade 5–6 (ước lượng; chặng 5 của site); Henle xếp mức 4 (trung bình) trên thang 1–9
  moi: 'Khoảng ABRSM Grade 5–6: ABRSM xếp bài ở Grade 6 (đề cương 2023–2024), RCM Level 8; Henle mức 4 (trung bình) trên thang 1–9'
  ly_do: 'Dòng Độ khó của thong_tin (hồ sơ bản ghi du-lieu/tac-pham/mendelssohn-thuyen-ca n17, plans/lam-lai/bao-cao/d6-l4/sua-B.yml): ABRSM 2023–2024 xếp bài ở Grade 6, RCM 2022 Level 8; bỏ "(ước lượng)", ghi kỳ đề cương như D6-L1-gom, D6-L3.'
- cu:
  - Hát bằng hai nốt cùng lúc. Suốt phần chủ đề, giai điệu đi thành từng cặp quãng ba hoặc quãng sáu trong tay phải, như hai giọng hát song song. Bạn phải cho nốt trên nổi lên và nốt dưới lùi lại trong cùng một cú đánh. Đây là kỹ năng nền cho Chopin, Schumann, Brahms về sau (xem mục cân bằng trong Tạo tiếng đàn và Nốt lặp, nốt kép).
  - 'Một kiểu đệm kinh điển. Nốt trầm, hợp âm, nốt giữa, hai lần mỗi ô: nhịp đung đưa của barcarolle, bài ca người chèo thuyền (xem Thể loại). Học kỹ ở đây, bạn sẽ gặp lại nó ở Chopin, Fauré, Tchaikovsky.'
  moi:
  - Hát bằng hai nốt cùng lúc. Suốt phần chủ đề, giai điệu đi thành từng cặp quãng ba hoặc quãng sáu trong tay phải, như hai giọng hát song song. Bạn phải cho nốt trên nổi lên và nốt dưới lùi lại trong cùng một cú đánh. Đây là kỹ năng nền cho nhiều bài Lãng mạn về sau, như Träumerei của Schumann (xem mục cân bằng trong Tạo tiếng đàn và Nốt lặp, nốt kép).
  - 'Một kiểu đệm kinh điển. Nốt trầm, hợp âm, nốt giữa, hai lần mỗi ô: nhịp đung đưa của barcarolle, bài ca người chèo thuyền (xem Thể loại). Học kỹ ở đây, bạn sẽ gặp lại nó ở các barcarolle khác.'
  ly_do: 'n6 (da-sua): ba tên nhà soạn nhạc là khẳng định chung không nguồn; thay bằng một bài của site dạy cân bằng nhiều bè trong một tay. n9 (da-sua): chưa đối chiếu kiểu đệm của từng bài; trang Thể loại đã nêu các barcarolle cụ thể.'
- cu:
  - Đầu năm 1832, Mendelssohn quyết định gom một loạt tiểu phẩm piano thành tập mang tên Lieder ohne Worte và chọn thuyền ca này làm bài cuối. Tập in năm 1832 ở London (nhà Novello) với tên tiếng Anh Original Melodies for the Pianoforte, và năm 1833 ở Paris và Bonn. Cái tên Lieder ohne Worte có lẽ do chính Mendelssohn nghĩ ra. Chị gái ông, Fanny, cũng viết nhiều bài hát cho piano, và một số nhà nghiên cứu cho rằng bà góp phần gợi ý cho thể loại này. Cả bộ gồm tám tập, mỗi tập sáu bài; hai tập cuối chỉ ra mắt sau khi ông mất.
  - 'Phần lớn những cái tên gắn với từng bài do các nhà xuất bản thêm vào về sau. Venetianisches Gondellied là một trong số rất ít tên gọi được coi là của chính Mendelssohn, và ông dùng nó thêm hai lần: Op. 30 số 6 (Fa♯ thứ, 1835) và Op. 62 số 5 (La thứ, in năm 1844). Thuyền ca mô phỏng bài hát của người chèo gondola: nhịp kép 6/8 hoặc 12/8, tay trái đung đưa đều như mái chèo, giai điệu trải dài phía trên. Xem thêm thời kỳ Lãng mạn và các nhà soạn nhạc cho piano.'
  moi:
  - Đầu năm 1832, Mendelssohn quyết định gom một loạt tiểu phẩm piano thành tập mang tên Lieder ohne Worte và chọn thuyền ca này làm bài cuối. Tập in năm 1832 ở London (nhà Novello) với tên tiếng Anh Original Melodies for the Pianoforte, và năm 1833 ở Paris và Bonn. Cả bộ gồm tám tập, mỗi tập sáu bài; hai tập cuối chỉ ra mắt sau khi ông mất.
  - 'Mendelssohn dùng tên Venetianisches Gondellied thêm hai lần: Op. 30 số 6 (Fa♯ thứ, 1835) và Op. 62 số 5 (La thứ, in năm 1844); trong một lá thư năm 1835, chính ông gọi bài Fa♯ thứ là "das Venetianische Gondolierlied". Thuyền ca mô phỏng bài hát của người chèo gondola: ở bài này là nhịp 6/8, tay trái đung đưa đều như mái chèo, giai điệu trải dài phía trên. Xem thêm thời kỳ Lãng mạn và các nhà soạn nhạc cho piano.'
  ly_do: 'n18 (da-bo): hai câu chỉ có ở Wikipedia; lời tựa Henle HN 1172 và Britannica không nói. n19, n21 (da-sua): vế "nhà xuất bản thêm tên" không có nguồn đã mở; lời tựa Henle HN 1172 trích thư gửi Klingemann 17/4/1835; nhịp 12/8 không có nguồn, bài này 6/8.'
- cu: 'Rồi so sánh ít nhất hai bản thu. Daniel Barenboim đã thu trọn tám tập Lieder ohne Worte; đặt bản của ông cạnh một nghệ sĩ khác và ghi lại: ai chơi chậm hơn, ai để tay trái đung đưa rõ hơn, ai dùng nhiều bàn đạp hơn ở đoạn staccato (ô 26–31)? Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu.'
  moi: 'Rồi so sánh ít nhất hai bản thu của hai nghệ sĩ khác nhau và ghi lại: ai chơi chậm hơn, ai để tay trái đung đưa rõ hơn, ai dùng nhiều bàn đạp hơn ở đoạn staccato (ô 26–31)? Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu.'
  ly_do: 'n29 (da-sua): chưa mở nguồn hãng đĩa cho bản thu Barenboim; bỏ tên.'
- cu: 'Dùng một bản Urtext: Henle in cả trọn bộ Lieder ohne Worte lẫn tập riêng bốn bài thuyền ca (HN 1172). Bản Breitkopf & Härtel 1874–77 (bản Mutopia, miễn phí) đáng tin để đối chiếu nốt; nhiều bản in cũ trên IMSLP có thêm số ngón và dấu bàn đạp của người biên tập. Số ngón chỉ là gợi ý: chọn ngón giúp bè trên legato, và ghi vào bản nhạc ngay từ tuần đầu.'
  moi: 'Dùng một bản Urtext: Henle in cả trọn bộ Lieder ohne Worte lẫn tập riêng bốn bài thuyền ca (HN 1172). Bản Breitkopf & Härtel 1874–77 (bản Mutopia, miễn phí) dùng được để đối chiếu nốt. Số ngón chỉ là gợi ý: chọn ngón giúp bè trên legato, và ghi vào bản nhạc ngay từ tuần đầu.'
  ly_do: 'n100 (da-sua): vế về các bản in trên IMSLP chưa kiểm (PDF IMSLP bị chặn).'
- cu: 'Hai thuyền ca còn lại: Op. 30 số 6 (Fa♯ thứ) và Op. 62 số 5 (La thứ), Henle xếp mức 5; cả bốn bài thuyền ca của Mendelssohn nằm trong tập Henle HN 1172.'
  moi: 'Hai bài Venetianisches Gondellied còn lại: Op. 30 số 6 (Fa♯ thứ) và Op. 62 số 5 (La thứ), Henle xếp mức 5; tập Henle HN 1172 in cả bốn bài thuyền ca của Mendelssohn (thêm Gondellied La trưởng, không số opus).'
  ly_do: 'n103 (da-sua): HN 1172 gồm ba Venetianisches Gondellied và Gondellied La trưởng U 136 (Henle).'
- cu: 'Songs Without Words, Wikipedia tiếng Anh: tám tập, mỗi tập sáu bài; tập 1 in ở London năm 1832 với tên Original Melodies for the Pianoforte; tên Lieder ohne Worte; vai trò có thể có của Fanny Mendelssohn.'
  moi: 'Britannica, Songs Without Words (Betsy Schwarm): 48 bài trong tám tập, hai tập cuối in sau khi Mendelssohn mất; tập 1 in ở Anh năm 1832 với tên Original Melodies for the Pianoforte.'
  ly_do: 'n115 (da-sua): Wikipedia không làm nguồn.'
- cu: 'Hình thức tổng thể là ba phần có mở đầu và coda (xem Hình thức nhỏ). Đoạn B không đưa ra chủ đề mới mà làm giai điệu căng lên bằng hòa âm: hợp âm bảy giảm (xem Hợp âm bảy) và hợp âm sáu tăng (xem Hợp âm Napoli và sáu tăng).'
