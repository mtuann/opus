    ghi_chu: 'Chữ cũ: "nhịp kép 6/8 hoặc 12/8". Chữ mới: "ở bài này là nhịp 6/8". Lý do: Henle chỉ nói thuyền ca bắt nguồn từ bài hát người chèo gondola; nhịp 12/8 chưa có nguồn đã mở; bài này 6/8 (.ly).'
