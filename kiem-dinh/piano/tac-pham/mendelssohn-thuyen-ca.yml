    nguon: *id002
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Phần lớn những cái tên gắn với từng bài do các nhà xuất bản thêm vào về sau. Venetianisches Gondellied là một trong số rất ít tên gọi được coi là của chính Mendelssohn, và ông dùng nó thêm hai lần\". Chữ mới: \"Mendelssohn dùng tên Venetianisches Gondellied thêm hai lần … ; trong một lá thư năm 1835, chính ông gọi bài Fa♯ thứ là \\\"das Venetianische Gondolierlied\\\".\" Lý do: không có nguồn đã mở cho vế \"nhà xuất bản thêm\"; Henle trích thư gửi Klingemann 17/4/1835: \"Aber ich mag das Venetianische Gondolierlied auch leiden\". Review D6-L4-gom: danh sách lượt 2 đã ghi chữ cũ (vế \"phần lớn tên do nhà xuất bản thêm\", lượt 1 đã bỏ). Lượt 2 (HN 327) xác nhận phần lớn tên phụ không do Mendelssohn đặt nhưng không nói \"nhà xuất bản thêm\": giữ bỏ. Vế \"dùng tên Venetianisches Gondellied thêm hai lần\" là n20 (lượt 2 dung). Câu này nay chỉ còn lá thư 1835 (lời tựa HN 1172), lượt 2 chưa kiểm: vào lượt 2 bổ sung. Kết quả lượt 2 cũ (cho chữ trước review) đã gỡ: luot_2 khong-chac; ghi chú lượt 2: \"Henle HN 327: phần lớn các tên phụ \"were not appended by Mendelssohn\", tên không để trong ngoặc thì của ông. Henle HN 1172: Op. 30 số 6 và Op. 62 số 5 có tiêu đề \"Venetianisches Gondellied\" do chính Mendelssohn viết, nên vế sau đúng. Nhưng nguồn không nói các tên ấy \"do nhà xuất bản thêm vào\". Riêng Op. 19 số 6, autograph đề \"Auf einer Gondel\"/\"On a Gondola\", bản Pháp đề \"Barcarolle\".\"."
    review: "dung"
