    cau: "Đoạn B làm giai điệu căng lên bằng hòa âm: hợp âm bảy giảm (ô 22–23) và hợp âm sáu tăng (ô 24) (link Hợp âm bảy, Napoli và sáu tăng)."
    loai: cau-truc
    nguon: *id001
    ket_qua: "da-sua"
    ghi_chu: "Ô 18–21 hình giai điệu c g aes b dựa vào nét chủ đề; ô 22–23 F♯°7; ô 24 sáu tăng. Trang nhac-ly/11-hop-am-bay, 24-napoli-sau-tang có (đã khóa). Review D6-L4-gom: lượt 2: hòa âm đúng; vế \"không đưa ra chủ đề mới\" là diễn giải, ô 18–21 và hình staccato ô 26–31 là chất liệu mới. Bỏ vế ấy (doi_chu); không chạy lại."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1679", "https://www.mutopiaproject.org/ftp/Mendelssohn-BartholdyF/O19/Lieder-ohne-Worte-Venetianisches-Gondellied-Op19-No6/Lieder-ohne-Worte-Venetianisches-Gondellied-Op19-No6-a4.pdf", "https://www.mutopiaproject.org/ftp/Mendelssohn-BartholdyF/O19/Lieder-ohne-Worte-Venetianisches-Gondellied-Op19-No6/Lieder-ohne-Worte-Venetianisches-Gondellied-Op19-No6.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/" ]
    luot_2_ghi_chu: 'Phần hòa âm đúng: bảy giảm ô 22–23, sáu tăng ô 24. Vế "không đưa ra chủ đề mới" là diễn giải: ô 18–21 (Fa – Rê – Đô – Si; Đô – Sol – La♭ – Si) và hình staccato ô 26–31 là chất liệu mới so với A. OMT nói phần B thường mang chất liệu tương phản.'
