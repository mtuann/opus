  - id: n13
    cau: Mùa thu 1830, trong chuyến du hành lớn qua châu Âu, Mendelssohn, 21 tuổi, đến Venice.
    loai: lich-su
    nguon: *id002
    ket_qua: dung
    ghi_chu: 'Henle: thư từ Venice ngày 11/10/1830; "grand tour" từ tháng 5/1830; sinh 1809 (Preface "(1809–47)"): tháng 10/1830 ông 21 tuổi.'
  - id: n14
    cau: Theo lời tựa Henle, bản viết tay còn lại đề Auf einer Gondel và ghi ngày 16/10/1830; đây là bài thuyền ca duy nhất trong bốn bài được viết tại Venice.
    loai: lich-su
    nguon: *id002
    ket_qua: dung
    ghi_chu: 'Henle: "the only one to have been actually written in Venice … the surviving autograph, headed \"Auf einer Gondel\" … carries the date 16 October 1830".'
  - id: n15
    cau: Ông định gửi nó làm quà đáp lễ cho Delphine von Schauroth ở München, người đã viết tặng ông một bài trong album; lá thư gửi ngày 17/10 bị thất lạc.
    loai: lich-su
    nguon: *id002
    ket_qua: dung
    ghi_chu: 'Henle: "She had written her own Lied ohne Worte into an album for Mendelssohn … He sent it to Munich on 17 October, though it got lost in the post." "Nữ nghệ sĩ piano trẻ": "outstanding pianist", "four years younger".'
  - id: n16
    cau: Đầu năm 1832 Mendelssohn gom một loạt tiểu phẩm thành tập Lieder ohne Worte và chọn thuyền ca này làm bài cuối; tập in năm 1832 ở London (Novello) với tên Original Melodies for the Pianoforte, năm 1833 ở Paris và Bonn.
    loai: nam
    nguon:
      - henle-hn1172-vorwort
      - britannica-sww
    ket_qua: dung
    ghi_chu: 'Henle: "at the beginning of 1832 … published in London by Novello that same year, and in 1833 by Schlesinger in Paris and Simrock in Bonn"; Britannica: "Original Melodies for the Pianoforte".'
  - id: n17
    cau: Cả bộ gồm tám tập, mỗi tập sáu bài; hai tập cuối chỉ ra mắt sau khi ông mất.
    loai: so-lieu
    nguon:
      - britannica-sww
    ket_qua: dung
    ghi_chu: 'Britannica: 48 bài, 36 bài trong sáu tập lúc ông còn sống, "Two further volumes — with 12 more songs — were published after Mendelssohn''s death in 1847". IMSLP: Op. 85 (1850–51), Op. 102 (1867–68).'
  - id: n18
    cau: Câu "Cái tên Lieder ohne Worte có lẽ do chính Mendelssohn nghĩ ra" và câu về vai trò của Fanny Mendelssohn.
    loai: lich-su
    nguon:
      - britannica-sww
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ hai câu: "Cái tên Lieder ohne Worte có lẽ do chính Mendelssohn nghĩ ra. Chị gái ông, Fanny, cũng viết nhiều bài hát cho piano, và một số nhà nghiên cứu cho rằng bà góp phần gợi ý cho thể loại này." Lý do: chỉ thấy ở Wikipedia; Henle Preface và Britannica không nói.'
  - id: n19
    cau: Câu "Phần lớn những cái tên gắn với từng bài do các nhà xuất bản thêm vào; Venetianisches Gondellied là một trong số rất ít tên của chính Mendelssohn".
    loai: lich-su
    nguon: *id002
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phần lớn những cái tên gắn với từng bài do các nhà xuất bản thêm vào về sau. Venetianisches Gondellied là một trong số rất ít tên gọi được coi là của chính Mendelssohn, và ông dùng nó thêm hai lần". Chữ mới: "Mendelssohn dùng tên Venetianisches Gondellied thêm hai lần … ; trong một lá thư năm 1835, chính ông gọi bài Fa♯ thứ là \"das Venetianische Gondolierlied\"." Lý do: không có nguồn đã mở cho vế "nhà xuất bản thêm"; Henle trích thư gửi Klingemann 17/4/1835: "Aber ich mag das Venetianische Gondolierlied auch leiden".'
  - id: n20
    cau: 'Mendelssohn dùng tên Venetianisches Gondellied thêm hai lần: Op. 30 số 6 (Fa♯ thứ, 1835) và Op. 62 số 5 (La thứ, in năm 1844).'
    loai: danh-muc
    nguon:
