    ket_qua: dung
    ghi_chu: 'Ô 1–4, M:4/2, L:1/8, K:Gb. Ấn bản: Breitkopf & Härtel 1888 qua Mutopia SchubertF-D899-3-Impromptu (.ly tải 05/11/2026). Công cụ: đọc tay .ly (relative, tên nốt italiano) từng nốt, ba bè. Giai điệu (hautI): sib1 (sib2-. sib2-.) | sib1 solb1 | lab1 solb4 fa mib reb | solb2 sib lab2. la4 = B8 .B4 .B4 | B8 G8 | A8 G2 F2 E2 D2 | G4 B4 A6 =A2 (Si♭4… La♮4): khớp. Dòng đệm (hautII): ô 1 r8 sib reb solb reb sib | reb sib… | r8… | r8…; ô 2 r8 sib mib solb mib sib | mib sib… | r8 solb sib mib sib solb | sib solb sib mib sib solb; ô 3 hai nhóm sáu La♭3 Đô♭4 Mi♭4 rồi bốn chùm ba (r lab dob ×3, r fa lab); ô 4 r solb sib reb sib solb | r do mib solb mib do (Đô♮ = =C) | r lab reb fa reb lab | reb lab reb fa reb lab: khớp từng nốt và quãng tám. Bè trầm (basIa, basIaP bản dàn trang): <solb reb''>1 <solb reb''>2 ×2 | <mib mib''>1~ | <dob dob''>1 <reb reb''>2. <dob'' reb>4 | <sib reb>2 <solb mib''>2 <reb fa''>1\arpeggio = [G,,D,] … [D,,F,]: khớp, dấu rải ô 4 là \arpeggio thường (không có \arpeggioBracket trong tệp). Sắc thái: pp ô 1, "Andante." ô 1, cresc. nhóm 1 và dim. nhóm 2 ô 4 (dynPartCom): khớp. Không ghi ngón (bản gốc không có ngón). Dấu luyến giai điệu: khớp.'
