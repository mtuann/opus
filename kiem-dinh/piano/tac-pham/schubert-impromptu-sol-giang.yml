  - cu: 'Năm 1827, năm trọn vẹn cuối cùng của đời mình, Schubert viết hai tập, mỗi tập bốn bản: D. 899 và D. 935. Cái tên Impromptu (ngẫu hứng) do nhà xuất bản Tobias Haslinger đặt cho tập đầu. Haslinger in bài số 1 và 2 ngay cuối năm 1827; bài số 3 và 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai ông, Carl Haslinger, in ra. Toàn bộ câu chuyện có trong hướng dẫn nghe; dưới đây chỉ là những điều ảnh hưởng trực tiếp đến việc tập.'
    moi: 'Năm 1827, năm trọn vẹn cuối cùng của đời mình, Schubert viết hai tập, mỗi tập bốn bản: D. 899 và D. 935. Cái tên Impromptu (ngẫu hứng) có lẽ do nhà xuất bản Tobias Haslinger đặt cho tập đầu: chính ông ghi tên này lên bản thảo bài số 1. Haslinger in bài số 1 và 2 ngay cuối năm 1827; bài số 3 và 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai ông, Carl Haslinger, in ra. Toàn bộ câu chuyện có trong hướng dẫn nghe; dưới đây chỉ là những điều ảnh hưởng trực tiếp đến việc tập.'
    ly_do: 'n10 (da-sua): PTNA nói người đặt tên chưa rõ; tên trên bản thảo số 1 do Haslinger ghi.'
  - cu: 'Lần in năm 1857 dịch bài lên Sol trưởng cho dễ đọc (chuyện này kể ở hướng dẫn nghe); dễ đọc hơn nhưng không dễ chơi hơn. Ở Sol♭ trưởng, năm trong bảy nốt của gam là phím đen; chỉ Đô♭ (chính là phím Si) và Fa là phím trắng. Phím đen cao và hẹp, nằm vừa dưới đầu các ngón dài: bàn tay đặt sâu vào trong phím, vững, dễ nối legato và dễ dồn trọng lượng sang ngón 4–5 để hát. Nếu bản nhạc trong tay bạn ở Sol trưởng, đó là bản theo lần in 1857; hãy đổi sang bản Urtext ở giọng gốc. Xem thêm Hóa biểu và Dịch giọng.'
    moi: 'Lần in năm 1857 dịch bài lên Sol trưởng cho dễ chơi hơn (chuyện này kể ở hướng dẫn nghe); Henle nhận xét việc dịch giọng làm phai màu riêng của bài. Một dấu thăng dễ đọc hơn sáu dấu giáng, nhưng không vì thế mà dễ chơi hơn. Ở Sol♭ trưởng, năm trong bảy nốt của gam là phím đen; chỉ Đô♭ (chính là phím Si) và Fa là phím trắng. Phím đen cao và hẹp, nằm vừa dưới đầu các ngón dài: bàn tay đặt sâu vào trong phím, vững, dễ nối legato và dễ dồn trọng lượng sang ngón 4–5 để hát. Nếu bản nhạc trong tay bạn ở Sol trưởng, đó là bản theo lần in 1857; hãy đổi sang bản Urtext ở giọng gốc. Xem thêm Hóa biểu và Dịch giọng.'
    ly_do: 'n13 (da-sua): PTNA ("for ease of playability"), Henle HN 488 ("diminishes the distinctive colour"); câu cũ dựa vào Wikipedia.'
  - cu: 'Mi♭ trưởng và đường về (ô 49–54): giai điệu đứng yên trên Mi♭; bè trầm đi xuống tới láy rền rất trầm trên Sol♭1 (ô 53), rồi dấu ngân (ô 54)'
    moi: 'Mi♭ trưởng và đường về (ô 49–54): giai điệu dừng lại trên Mi♭ (ô 51–53); bè trầm đi xuống tới láy rền rất trầm trên Sol♭1 (ô 53), rồi dấu ngân (ô 54)'
