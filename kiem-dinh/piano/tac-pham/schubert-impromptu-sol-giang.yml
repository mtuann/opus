  - cu: Bản Breitkopf viết sẵn nốt kết cho phần lớn các láy rền (hai nốt hoa mỹ nhỏ ngay trước nốt sau). Nhiều nghệ sĩ bắt đầu láy rền của Schubert từ nốt chính; điều quan trọng hơn là nó nhỏ, đều, và tan vào nốt sau như tiếng sấm xa. Xem Nốt hoa mỹ.
