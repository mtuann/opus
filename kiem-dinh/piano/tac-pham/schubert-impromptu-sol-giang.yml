    ghi_chu: '2 ô 4/2, L:1/8 (16 móc đơn mỗi ô): tay phải d8 c8 | B8- B8; dòng đệm bốn nhóm (6:4 = 16 | 4 + 4 + [DG]8 = 16; tay trái 8 + 8 | 16. Hòa âm Sol♭ | Rê♭7 (Rê♭ Fa La♭ + Đô♭ của giai điệu) | Sol♭: đúng lời dẫn (Đô♭ nốt bảy đi xuống Si♭). Ngón giai điệu 5–4–3, dòng đệm 1–2–3: tay trải Rê♭4–Rê♭5 (quãng tám), chơi được. "_Ped." mỗi nửa ô.'
