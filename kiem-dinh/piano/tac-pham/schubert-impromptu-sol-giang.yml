    moi: 'Hình "thở dài": nốt nhấn rơi xuống một bậc (ô 41, 45); láy rền ở ô 46; ô 49–52 sáng lên Mi♭ trưởng, rồi giai điệu đứng yên trên nốt Mi♭ (ô 51–53)'
