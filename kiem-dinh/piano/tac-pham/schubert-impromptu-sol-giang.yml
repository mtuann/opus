    ghi_chu: '2 ô 4/2, L:1/16 (32 móc kép mỗi ô). Tay trái ô 1: 24 móc kép (Rê♭2–Mi♭2 luân phiên, ngón 3–2; cuối Đô♭2–Rê♭2 ngón 4–3 là nốt kết) + Sol♭1 nốt trắng (8) = 32; ô 2: !trill!D,,24 + {C,,D,,} + G,,,8 = 32. Tay phải hợp âm Fa–La♭–Đô♭ (24) rồi Sol♭–Si♭–Rê♭ (8): át bảy thiếu nốt gốc trên nền Rê♭, giải về Sol♭. Mô phỏng láy rền ô 19 của bản nhạc (Rê♭2, nốt kết Đô♭–Rê♭; Mutopia). Đúng lời dẫn.'
