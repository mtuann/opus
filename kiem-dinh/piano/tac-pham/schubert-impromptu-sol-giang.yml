  - cu: 'câu hỏi: Lần in đầu tiên của bài này (năm 1857) khác bản Schubert viết ở điểm nào? | ✓ Bài bị dịch sang Sol trưởng và các ô nhịp dài bị chia đôi | Bài được thêm một đoạn giữa mới | Bài in ở Sol♭ trưởng nhưng bỏ phần coda | Nhà xuất bản lo người chơi nghiệp dư ngại sáu dấu giáng. Bản Urtext ngày nay trả lại giọng Sol♭ trưởng và nhịp 4/2.'
    moi: 'câu hỏi: Lần in đầu tiên của bài này (năm 1857) khác bản Schubert viết ở điểm nào? | ✓ Bài bị dịch sang Sol trưởng và các ô nhịp dài bị chia đôi | Bài được thêm một đoạn giữa mới | Bài in ở Sol♭ trưởng nhưng bỏ phần coda | Nhà xuất bản đổi cho dễ chơi hơn: sáu dấu giáng và nhịp 4/2 là điều khác thường với một bản nhạc ngắn thời ấy. Bản Urtext ngày nay trả lại giọng Sol♭ trưởng và nhịp 4/2.'
