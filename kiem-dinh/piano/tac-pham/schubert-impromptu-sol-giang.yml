ghi_chu: 'Bài học Impromptu Sol♭ trưởng D. 899 số 3 (tầng Tác phẩm). Bản nhạc: Mutopia SchubertF-D899-3-Impromptu (Breitkopf & Härtel 1888; .ly, .mid, PDF tải 05/11/2026, User-Agent opus-kiem-dinh); đọc .ly theo ô (chú thích %1-4 … %85-86 của từng bè, phần sắc thái dynPartCom, dynPartBas): 86 ô; mọi số ô, sắc thái, láy rền, dấu ngân, dấu giáng kép nêu trên trang khớp, trừ "giai điệu đứng yên trên Mi♭" ở ô 49–52 (đúng ở ô 51–53, đã sửa). Lịch sử: PTNA mục D 899, D 935; lời tựa và trang Henle HN 4, HN 488; IMSLP; NDB (Haslinger). Sửa: n10, n13, n31, n39, n79, n86, n87, n92. Không bỏ câu nào. Giữ hai mục doi_chu D2-0 (chip, Độ khó). Không tính là nhận định: tiêu đề mục, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (hồ sơ bản ghi), mốc ::khoi-nghe (hồ sơ bản ghi, báo cáo). Thuật ngữ: andante, cantabile, láy rền (trill), una corda, fermata (dấu ngân), accent có trong thuat-ngu.yml; "portato", "chùm sáu" (sextuplet), "bàn đạp nối", "nửa bàn đạp" chưa có bản ghi (cho lô sau). Câu ở hồ sơ khác đã kiểm: nhac-ly/05-dau-hoa n12 (trang có "dấu giáng kép": còn, n57); piano/quang-tam-buoc-nhay n46, n65 (link đã bỏ ở trang ấy, không phụ thuộc); piano/nha-soan-nhac n173, n190, piano/tac-pham-theo-cap n3, n29, n53 (chặng 7: trang này nay ghi chặng 7, n86); cap-nhat n82 (bài có trên site).'
