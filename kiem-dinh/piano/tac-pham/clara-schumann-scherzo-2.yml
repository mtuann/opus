  - id: n12
    cau: 'Bảng Theo dõi khi nghe: mở đầu f Con fuoco, tay trái rải hợp âm Đô thứ đi lên, tay phải nối tiếp, chuỗi móc đơn đi xuống; diminuendo rồi giai điệu mới p (nốt dài ở trên, móc đơn ở dưới); f hợp âm rải đi lên trở lại, tay trái chuyển sang khóa Sol; chủ đề đầu trở lại f; hợp âm f, một ô im lặng, hết phần scherzo; trio hóa biểu bốn dấu giáng, un poco più tranquillo, p, tay trái ngân nốt trầm dài; ben legato p hợp âm liền tiếng, giai điệu ở trên; Tempo I; sempre f đoạn kết; hai hợp âm f rải nhanh, dấu ngân trên ô lặng cuối.'
    loai: cau-truc
    nguon: [ breitkopf-1879, kolodin-ban-thu ]
    ket_qua: da-sua
    ghi_chu: 'Tr. 2 hệ 1 (mở đầu); tr. 3 hệ 3–4 (diminuendo, p, tay phải nốt chấm dôi trên móc đơn); tr. 4 hệ 1 (f, khuông dưới khóa Sol), hệ 3 (f, chủ đề như ô 2); tr. 5 hệ 2 (hợp âm f, ô lặng), hệ 3 (bốn dấu giáng, un poco più tranquillo, p, tay trái nốt nối dài; ben legato p); tr. 7 (Tempo I°); tr. 9 hệ 3 (sempre f), hệ 6 (hai hợp âm f có dấu rải, ô lặng có dấu ngân). Mốc: 0 (đầu file), 40 (độ to giảm), 61 (tăng), 69 (ước), 95 (trước khoảng lặng 96,9 s), 97 (sau khoảng lặng), 106 (sau khoảng lặng 105–106,4 s), 182 (ước), 232 (độ to tăng), 246. Review (Claude, 17/11/2026): bản quét: tr. 4 hệ 1 ô 5 (f, hợp âm Sol–Si♮–Rê, tay trái rải Sol đi lên rồi sang khóa Sol), tr. 4 hệ 3 ô 5–6 (chủ đề: tay trái rải Đô thứ, f, rồi tay phải f như ô 2), tr. 5 hệ 2 (hợp âm f, ô lặng số 1), tr. 7 hệ 1 (Tempo I°), tr. 9 hệ 3 (sempre f) và hệ cuối (hai hợp âm f rải, dấu ngân trên ô lặng). Đo bản thu (chroma và độ to mỗi 0,1–0,34 s, numpy): hợp âm f Sol trưởng sau hợp âm Fa♯ giảm bảy bắt đầu ở 63,1 s (không phải 61: ở 61 s chỉ là chỗ lớn dần trong đoạn p); chủ đề trở lại (chuỗi hòa âm Đô thứ, La♭, Rê–Fa–La♭, Sol bảy, mỗi ô khoảng 0,85 s, lặp lại ở 75,3 s và 78,4 s) bắt đầu ở 71,8 s, tay phải f vào ở 72,7 s; mốc 69 cũ rơi vào ô tay trái rải Sol đi lên (tr. 4 hệ 3 ô 1). Tempo I: hợp âm Sol–Si♮–Rê ở 182,2 s ngay sau hòa âm Rê♭–Fa–La♭ cuối trio, nên 182 đúng. Hợp âm f cuối scherzo ở 94,75 s (95 đúng). Đã sửa mốc 61 thành 63 và 69 thành 72 bằng tools/audio/attach.py --ref; chữ bảng không đổi.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Scherzo_No.2,_Op.14_(Schumann,_Clara)" ]
    luot_2_ghi_chu: "Bản quét #611197: f Con fuoco, tay trái rải Đô thứ, tay phải nối, móc đơn đi xuống (trang 2 hệ 1); diminuendo rồi p, nốt chấm dôi ở trên, móc đơn ở dưới (trang 3 hệ 4); f rải đi lên, tay trái sang khóa Sol (trang 4 hệ 1); chủ đề đầu trở lại f (trang 4 hệ 3); hợp âm f, ô lặng có số 1, hết scherzo (trang 5 hệ 2); trio bốn giáng, un poco più tranquillo, Mi♭ trầm ngân (trang 5 hệ 2–3); ben legato p, giai điệu ở trên (trang 5 hệ 2 trở đi, trang 6); Tempo I (trang 7 hệ 1); sempre f (trang 9 hệ 3); hai hợp âm f rải, dấu ngân trên ô lặng cuối (trang 9 hệ 5)."
