khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Ô 1–5, 3/4, K:Cm, L:1/8, Q:3/4=88. Ấn bản: breitkopf-1879 tr. 2 hệ 1, đọc ở 300–500 dpi, đo vị trí dòng kẻ và đầu nốt bằng máy. Ô 1: tay phải nghỉ cả ô; tay trái f, sáu móc đơn nối vạch Đô2 Sol2 Đô3 Mi♭3 Sol3 Đô4. Ô 2: tay phải móc đơn nghỉ, f, Đô4 Mi♭4 La♭4 Đô5 Mi♭5 nối vạch; tay trái bè trên La♭3 trắng, La♭3 đen; bè dưới Đô3–Mi♭3 trắng chấm dôi. Ô 3: tay phải móc đơn nghỉ, Rê4 Fa4 La♭4 Rê5 La♭5; tay trái hợp âm trắng chấm dôi Đô3–Rê3–Fa3–La♭3 có dấu nhấn, Rê3 và Fa3 nối sang ô 4. Ô 4: tay phải Sol5 Fa5 Rê5 Si♮4 Sol4 Fa4; tay trái hợp âm đen Si♮2–Rê3–Fa3–Sol3, hai lặng đen. Ô 5: tay phải Mi♭4 đen, hai lặng đen; tay trái như ô 1. Bỏ: không có.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4: tay trái rải Đô thứ (Đô2–Đô4), tay phải nối tiếp Đô4–Mi♭5 (ngón 1-2-3-1-2); tay trái rải Sol trưởng (Sol1–Sol3), tay phải Rê4–Sol5 có Si♮; ô 2, 4 tay trái giữ hợp âm. Mỗi ô 6 móc đơn.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am ]
    ket_qua: dung
    ghi_chu: '5 ô 3/4: hợp âm tay phải có dấu nhấn (trắng) trên nốt trầm tay trái: Đô thứ, La♭ trưởng, Rê–Fa–La♭ trên Rê, Rê–Fa–Si♮ trên Sol, Đô thứ.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '3 ô 3/4, La♭ trưởng: bè dưới Mi♭4 trắng chấm dôi (ngón 1, ghi trong lời kèm) suốt ba ô; bè trên Đô5–Si♭4, La♭4–Sol4, La♭4 (ngón 5-4, 3-2, 3); tay trái La♭2, Mi♭2, La♭2.'
