nhan_dinh:
  - id: n1
    cau: 'Clara Schumann viết hai bản scherzo cho piano; bản thứ hai, Op. 14, ở Đô thứ.'
    loai: ten
    nguon: [ breitkopf-1879, imslp-op14 ]
    ket_qua: dung
    ghi_chu: 'Bìa Pianoforte-Werke: Erstes Scherzo Op. 10, Zweites Scherzo Op. 14. IMSLP: Key C minor. Bản in: ba dấu giáng, ô 1 hợp âm rải Đô thứ.'
  - id: n2
    cau: 'Bài dài khoảng bốn phút.'
    loai: so-lieu
    nguon: [ kolodin-ban-thu, imslp-op14 ]
    ket_qua: dung
    ghi_chu: 'Bản thu 251 s (4:11), tiếng đàn tới 249,6 s.'
  - id: n3
    cau: 'Bài ở chặng 6 của lộ trình trên site; đây là bài học tác phẩm đầu tiên của Clara Schumann trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'chang: 6 trong bản ghi; tac-pham.yml không có bản ghi nào khác có tac_gia clara-schumann.'
  - id: n4
    cau: 'Hợp âm rải bắt đầu ở tay trái rồi tay phải nối tiếp; bài nhanh, nhiều hợp âm lớn có dấu nhấn.'
    loai: cau-truc
    nguon: [ breitkopf-1879 ]
    ket_qua: dung
    ghi_chu: 'Ô 1 tay trái Đô2–Đô4, ô 2 tay phải Đô4–Mi♭5; ô 3 hợp âm tay trái có dấu nhấn; tr. 3, tr. 5, tr. 8 hợp âm có dấu nhấn, sf, fz.'
  - id: n5
    cau: 'Phần scherzo ghi Con fuoco (nồng nhiệt); trio ghi un poco più tranquillo (yên hơn một chút) và ben legato (thật liền tiếng), p.'
    loai: dinh-nghia
    nguon: [ breitkopf-1879 ]
    ket_qua: dung
    ghi_chu: 'Tr. 2: "Con fuoco."; tr. 5 hệ 3: "un poco più tranquillo", hệ 3 giữa: "ben legato", p. Nghĩa: con fuoco = với lửa; più tranquillo = yên hơn; ben legato = thật liền.'
  - id: n6
    cau: 'Clara Schumann là một trong những nghệ sĩ piano lừng danh nhất thế kỷ 19.'
    loai: lich-su
    nguon: []
    ket_qua: dung
    ghi_chu: 'Như trang lich-su/nu-nha-soan-nhac (đã khóa, đã kiểm định): "Một trong những nghệ sĩ piano lừng danh nhất thế kỷ 19, vợ của Robert Schumann". Lượt 2 kiểm nguồn ngoài.'
  - id: n7
    cau: 'Clara Schumann (1819–1896), nhũ danh Wieck, là nghệ sĩ piano và nhà soạn nhạc người Đức, vợ của Robert Schumann.'
    loai: nam
    nguon: [ imslp-clara ]
    ket_qua: dung
    ghi_chu: 'Năm khớp nha-soan-nhac.yml (1819, 1896) và trang lich-su/nu-nha-soan-nhac.'
  - id: n8
    cau: 'Scherzo số 2 được viết năm 1845 và nhà Breitkopf & Härtel ở Leipzig in cùng năm.'
    loai: nam
    nguon: [ imslp-op14 ]
    ket_qua: dung
  - id: n9
    cau: 'Năm 1879, Breitkopf in lại các bài piano của bà trong bộ Pianoforte-Werke zu zwei Händen, gồm Scherzo số 1 Op. 10, Scherzo số 2 Op. 14, Vier flüchtige Stücke Op. 15, ba Prelude và Fugue Op. 16, Biến tấu Op. 20 và ba Romance Op. 21.'
    loai: nam
    nguon: [ breitkopf-1879, imslp-op14 ]
    ket_qua: dung
    ghi_chu: 'Bìa: Erstes Scherzo Op. 10, Zweites Scherzo Op. 14, Vier flüchtige Stücke Op. 15, Drei Praeludien und Fugen Op. 16, Variationen über ein Thema von Robert Schumann Op. 20, Drei Romanzen Op. 21. Năm [1879] theo IMSLP (bản in không ghi năm).'
  - id: n10
    cau: 'Scherzo trong tiếng Ý nghĩa là "trò đùa": một bài nhanh, thường ở nhịp 3, có một đoạn giữa tương phản gọi là trio.'
    loai: dinh-nghia
    nguon: [ site-scherzo ]
    ket_qua: dung
  - id: n11
    cau: 'Bản thu gợi ý là của nghệ sĩ piano Luis Kolodin, đăng trên IMSLP (IMSLP ghi nhà phát hành Felipe Sarro), giấy phép CC BY-SA 4.0.'
    loai: ten
    nguon: [ imslp-op14 ]
    ket_qua: dung
  - id: n12
    cau: 'Bảng Theo dõi khi nghe: mở đầu f Con fuoco, tay trái rải hợp âm Đô thứ đi lên, tay phải nối tiếp, chuỗi móc đơn đi xuống; diminuendo rồi giai điệu mới p (nốt dài ở trên, móc đơn ở dưới); f hợp âm rải đi lên trở lại, tay trái chuyển sang khóa Sol; chủ đề đầu trở lại f; hợp âm f, một ô im lặng, hết phần scherzo; trio hóa biểu bốn dấu giáng, un poco più tranquillo, p, tay trái ngân nốt trầm dài; ben legato p hợp âm liền tiếng, giai điệu ở trên; Tempo I; sempre f đoạn kết; hai hợp âm f rải nhanh, dấu ngân trên ô lặng cuối.'
    loai: cau-truc
    nguon: [ breitkopf-1879, kolodin-ban-thu ]
    ket_qua: dung
    ghi_chu: 'Tr. 2 hệ 1 (mở đầu); tr. 3 hệ 3–4 (diminuendo, p, tay phải nốt chấm dôi trên móc đơn); tr. 4 hệ 1 (f, khuông dưới khóa Sol), hệ 3 (f, chủ đề như ô 2); tr. 5 hệ 2 (hợp âm f, ô lặng), hệ 3 (bốn dấu giáng, un poco più tranquillo, p, tay trái nốt nối dài; ben legato p); tr. 7 (Tempo I°); tr. 9 hệ 3 (sempre f), hệ 6 (hai hợp âm f có dấu rải, ô lặng có dấu ngân). Mốc: 0 (đầu file), 40 (độ to giảm), 61 (tăng), 69 (ước), 95 (trước khoảng lặng 96,9 s), 97 (sau khoảng lặng), 106 (sau khoảng lặng 105–106,4 s), 182 (ước), 232 (độ to tăng), 246.'
  - id: n13
    cau: 'Bảng Cấu trúc: scherzo Đô thứ 3/4 Con fuoco có giai điệu mới p ở giữa; trio hóa biểu bốn dấu giáng, un poco più tranquillo, ben legato, p, giai điệu ở bè trên; scherzo trở lại Tempo I với chất liệu phần đầu, có chỗ đổi; đoạn kết sempre f.'
    loai: cau-truc
    nguon: [ breitkopf-1879 ]
    ket_qua: dung
    ghi_chu: 'Tempo I tr. 7–8: mở đầu bằng hợp âm rải tay trái và hợp âm lớn, khác ô 1–5; chủ đề như ô 2–5 trở lại ở tr. 7 hệ 4.'
  - id: n14
    cau: 'Ô 1–5: ô 1 tay trái rải hợp âm Đô thứ từ Đô rất thấp lên Đô giữa; ô 2–3 tay phải nối tiếp, hai lần lên cao, trên hợp âm La♭ trưởng rồi hợp âm có dấu nhấn; ô 4 chuỗi đi xuống có Si♮ trên hợp âm Sol bảy; ô 5 về Mi♭, tay trái bắt đầu lại.'
    loai: cau-truc
    nguon: [ breitkopf-1879 ]
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 1. Ô 2: tay phải Đô4–Mi♭4–La♭4–Đô5–Mi♭5, tay trái La♭3 và Đô3–Mi♭3 (La♭ trưởng). Ô 3: Rê–Fa–La♭ (Rê nửa giảm bảy). Ô 4: tay trái Si♮2–Rê3–Fa3–Sol3 (Sol bảy).'
  - id: n15
    cau: 'Bản Breitkopf 1879 ghi Con fuoco và nốt trắng chấm dôi = 88: mỗi ô là một phách.'
    loai: so-lieu
    nguon: [ breitkopf-1879 ]
