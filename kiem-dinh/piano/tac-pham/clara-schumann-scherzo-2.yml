ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 5). Lộ trình dặn tìm bản thu mở cho Op. 15 trước: trang IMSLP Op. 15 không có bản thu (chỉ link YouTube ngoài), Commons không có bản thu Clara Schumann Op. 15 hay Scherzo (17/11/2026), nên giữ Op. 14. Nốt nhạc, chữ chỉ dẫn chép từ bản quét Breitkopf & Härtel Pianoforte-Werke [1879], IMSLP #611197 (9 trang; đọc ở 90–500 dpi, đo dòng kẻ và đầu nốt bằng máy cho ô 1–5). Bản in đầu 1845 không có bản quét mở; trang ghi số máy đếm nhịp là "số in trên bản Breitkopf 1879". Trang không nêu số ô ngoài ô 1–5; các phần sau mô tả theo sự kiện. Mốc: bản thu bắt đầu ngay ở 0 s; khoảng lặng ffmpeg silencedetect −40 dB: 96,90–97,52 s, 105,01–106,38 s, 249,61 s–hết; độ to theo giây; tốc độ phần scherzo khoảng 0,68 s mỗi ô (nốt trắng chấm dôi ≈ 88). Mốc 69 (chủ đề trở lại) và 182 (Tempo I) ước theo số ô từ mốc gần nhất và độ to, có thể lệch vài giây. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/clara-schumann-scherzo-2.'
