    ghi_chu: 'Tr. 2: "Con fuoco. 𝅗𝅥. = 88". Nốt trắng chấm dôi dài trọn một ô 3/4.'
  - id: n16
    cau: 'Phần scherzo phần lớn to (f, sf), xen những đoạn nhỏ dần và một giai điệu p; trio nhỏ (p) và liền tiếng; đoạn kết sempre f.'
    loai: cau-truc
    nguon: [ breitkopf-1879 ]
    ket_qua: dung
    ghi_chu: 'Tr. 2: f, sf, dim.; tr. 3: sf, diminuendo, p; tr. 4: f, cresc.; tr. 5–6 trio p, ben legato; tr. 8 fz; tr. 9 sempre f.'
  - id: n17
    cau: 'Trio đổi sang hóa biểu bốn dấu giáng.'
    loai: cau-truc
    nguon: [ breitkopf-1879 ]
    ket_qua: dung
    ghi_chu: 'Tr. 5 hệ 2 cuối: vạch kép, hóa biểu bốn dấu giáng; tr. 6 cuối: trở lại ba dấu giáng.'
  - id: n18
    cau: 'Op. 14 không có trong các đề cương ABRSM đã đọc; ước lượng Grade 8. ABRSM 2025–2026 xếp Op. 15 số 4 (Scherzo) ở Grade 7 và Op. 15 số 2 ở Grade 8.'
