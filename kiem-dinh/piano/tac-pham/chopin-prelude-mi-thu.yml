ghi_chu: 'Bài học Prélude Mi thứ Op. 28 số 4 (tầng Tác phẩm). Bản nhạc: ấn bản Peters 1879 qua Mutopia 468 (.ly tải ngày 05/11/2026): 25 ô và một nhịp lấy đà, 2/2, Largo; bảng hòa âm ô 1–5 khớp từng nốt. Bản IMSLP (PDF) không mở. Lịch sử: Henle HN 882 (Preface, trang sản phẩm), Ấn bản Quốc gia (Commentary), NIFC (niên biểu 1849, qua Wayback), Ville de Paris và chopin.pl (lễ tang), COD, Trinity, Treccani (thuật ngữ), Naxos và DG (bản thu). Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/chopin-prelude-mi-thu. Sửa trang: n4 (câu mở đầu và mô tả: bỏ "trang nhạc buồn nhất", thay bằng lễ tang), n12 (bỏ "lý tưởng", "âm nhạc sâu", thêm mức Henle), n14 (bỏ "tôn sùng Bach", thay bằng việc mang Bình quân luật tới Mallorca), n18 (bỏ tên Bülow), n19 và n70 (bài thứ hai ở lễ tang: NIFC ghi Si♭ thứ, Ville de Paris ghi Si thứ; viết chung), n45 (bỏ vế sức khỏe "cẳng tay dễ mỏi và cứng"), n82 (dòng Wikipedia ở mục Nguồn thay bằng Henle và NIFC). Không còn chỗ chưa chắc. Khuông: hai khối ví dụ soạn, đúng. Thuật ngữ: Largo, espressivo có trong thuat-ngu.yml; stretto, smorzando chưa có (ghi cho D3-L5).'
