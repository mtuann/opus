    luot_2_ghi_chu: 'Ô 2–8: mỗi lần đổi chỉ một bè xuống nửa cung; vài chỗ (Mi thứ → Fa♯–La–Mi, ô 9–10) có hai bè đổi hay đi lên, nên "gần như" là đúng.'
