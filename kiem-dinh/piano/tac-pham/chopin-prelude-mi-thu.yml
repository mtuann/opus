    ket_qua: 'dung'
    ghi_chu: 'Henle: "winter stay together on Mallorca at the turn of the year 1838/39"; "his room in the monastery in Valdemosa"; "The outbreak of Chopin''s lung disease"; "the Préludes were quickly completed" (đầu 1839).'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/cb/de/28/1690886065/0882-1690886065-sync.pdf", "https://web.archive.org/web/20191207212426/https://en.chopin.nifc.pl/chopin/life/calendar/year/1838", "https://web.archive.org/web/20190515165944/http://en.chopin.nifc.pl/chopin/life/calendar/year/1839" ]
