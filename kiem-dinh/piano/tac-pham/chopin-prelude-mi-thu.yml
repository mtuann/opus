    ghi_chu: 'src/content/docs/piano/tieng-dan.md (đã khóa) có; hồ sơ piano/tieng-dan n57 nói tay trái Prélude Mi thứ phải nghe được các bè trong hợp âm lặp: trang này giữ ý ấy (n42, Diễn tấu).'
  - id: 'n11'
    cau: 'Một cao trào trong 25 ô: dồn lên, bùng nổ, lắng xuống, im lặng, kết.'
    loai: 'cau-truc'
    nguon:
      - 'mut-468'
