  - id: 'n42'
    cau: 'Từ hợp âm thứ hai trở đi, mỗi lần đổi chỉ một bè đi xuống nửa cung, khi ở bè trên, khi ở bè dưới, khi ở bè giữa.'
    loai: 'cau-truc'
    nguon:
      - 'mut-468'
    ket_qua: 'dung'
    ghi_chu: 'Ô 1→2 hai bè đổi (Sol→Fa♯, Si→La), nên câu nói "từ hợp âm thứ hai". Từ đó: Mi→Rê♯ (trên), Fa♯→Fa (dưới), Rê♯→Rê (trên), La→Sol♯ (giữa), Fa→Mi (dưới), Sol♯→Sol (giữa), Rê→Đô♯ (trên), Đô♯→Đô (trên), Sol→Fa♯ (giữa): đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-4/Chop-28-4.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-4/Chop-28-4-a4.pdf" ]
    luot_2_ghi_chu: Đúng cho ô 1–8 (từ hợp âm thứ hai, mỗi lần một bè xuống nửa cung). Ô 9–10 có chỗ hai bè đổi, có chỗ đi lên; câu đặt sau bảng ô 1–5 nên hiểu theo đoạn ấy.
  - id: 'n43'
