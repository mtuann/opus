    moi: 'mô tả: Hai mươi lăm ô nhịp, một giai điệu gần như chỉ đi lại giữa hai nốt cạnh nhau, một tay trái lặp đi lặp lại những hợp âm móc đơn: ít nốt đến thế mà được chơi trong…'
