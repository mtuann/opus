khuong_nhac:
  - khoi: 1
    loai: 'vi-du-soan'
    kiem:
      - 'cu-phap'
      - 'giong'
      - 'hop-am'
      - 'so-ngon'
      - 'ban-dap'
    ket_qua: 'dung'
    ghi_chu: 'La thứ, 4/4, L:1/8: mỗi ô 8. Tay trái tám hợp âm mỗi ô (bốn mỗi nửa ô), bè trầm La – Sol♯ – Sol – Fa♯ – Fa – Mi rồi La: đúng chú thích. Tay phải Mi ngân, Fa (nốt lạ, "thở dài") ô 1, Mi–Rê, Rê–Đô–Si, La: ngón 3-4-3-2-4-3-2-1 chơi được. "Ped." mỗi lần hợp âm đổi: đúng bước 1.'
  - khoi: 2
    loai: 'vi-du-soan'
    kiem:
      - 'cu-phap'
      - 'giong'
      - 'hop-am'
      - 'sac-thai'
      - 'so-ngon'
    ket_qua: 'dung'
    ghi_chu: 'La thứ, 4/4, L:1/8: mỗi ô 8. Ô 2 hợp âm đổi mỗi hai móc đơn (ô 1 mỗi bốn): đúng "nhanh gấp đôi"; \< ô 2, !f! ô 3 (Đô6), \> rồi !p! ô 4. Ô 4: Fa–La–Đô (tay trái) + Rê♯ (tay phải) = hợp âm sáu tăng kiểu Đức của La thứ, giải quyết về Mi (Mi–Sol♯–Si ô 5) rồi La thứ: đúng chú thích. Dấu lặng có dấu ngân ô 4. Ngón 2-3-4-5, 5-4-3 chơi được.'
doi_chu:
  - cu: 'Hai mươi lăm ô nhịp, một giai điệu gần như chỉ đi lại giữa hai nốt cạnh nhau, một tay trái lặp đi lặp lại những hợp âm móc đơn: ít nốt đến thế mà là một trong những trang nhạc buồn nhất Chopin để lại. Đây là bài học về hòa âm trượt từng nửa cung, về chơi hợp âm thật khẽ và đều, và về sức nặng của im lặng.'
    moi: 'Hai mươi lăm ô nhịp, một giai điệu gần như chỉ đi lại giữa hai nốt cạnh nhau, một tay trái lặp đi lặp lại những hợp âm móc đơn: ít nốt đến thế mà được chơi trong lễ tang của chính Chopin. Đây là bài học về hòa âm trượt từng nửa cung, về chơi hợp âm thật khẽ và đều, và về sức nặng của im lặng.'
    ly_do: 'n4 (da-sua): "buồn nhất" là đánh giá; NIFC và Ville de Paris ghi bài được chơi ở lễ tang Chopin.'
  - cu: Bộ Op. 28 viết trong khoảng 1835–1839, hoàn tất ở Mallorca mùa đông 1838–1839; in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)
    moi: Bộ Op. 28 hoàn tất ở Mallorca mùa đông 1838–1839 (vài bài có thể có từ đầu thập niên 1830); in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)
    ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-B.yml, nhận định n14 của hồ sơ bản ghi: Như chopin-prelude-la-truong. Henle: bản nháp số 2 và số 4 ghi "Palma, 28 9bra" (28/11/1838), nên số 4 "most probably" viết ở Mallorca. Vế "bài này viết ở Mallorca" là tùy chọn; bỏ nếu muốn hai bản ghi cùng chữ.'
  - cu: 'Khoảng ABRSM Grade 5 (ước lượng): ít nốt, nhưng đòi hỏi kiểm soát tiếng đàn rất tinh'
    moi: 'Khoảng ABRSM Grade 5: RCM xếp bài ở Level 7 (đề cương 2022); Henle mức 4. Ít nốt, nhưng đòi hỏi kiểm soát tiếng đàn rất tinh'
    ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-B.yml, nhận định n18 của hồ sơ bản ghi: Bài có trong đề cương RCM 2022 (trang 65, Level 7: "Prelude in E Minor, op. 28, no. 4"), nên "(ước lượng)" không còn đúng; ghi kỳ đề cương như D6-L1-gom (minuet-sol-thu, musette-re). ABRSM, Trinity không xếp bài (hồ sơ lần 1 n4). Grade đã khóa (Grade 5) giữ nguyên; RCM Level 7 cao hơn: người giao cân nhắc khi mở khóa.'
  - cu: Bài Chopin đầu tiên lý tưởng. Khoảng hai phút, kỹ thuật vừa sức, âm nhạc sâu.
    moi: Một bài Chopin đầu tiên vừa sức. Khoảng hai phút; Henle xếp bài ở mức 4, mức thấp nhất trong bộ Op. 28.
    ly_do: 'n12 (da-sua): thay đánh giá bằng mức Henle (HN 882).'
  - cu:
      - 'Bộ 24 Prélude Op. 28 đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song song của nó, tiến theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ… Chopin tôn sùng Bach, và ý tưởng một bộ prelude đủ mọi giọng gợi nhớ Bình quân luật. Nhưng prelude của Chopin không còn là "khúc dạo đầu" cho một fugue: mỗi bài là một bức tranh độc lập, có bài chỉ dài vài chục giây.'
      - Chopin hoàn tất bộ này ở đảo Mallorca, nơi ông trú đông 1838–1839 cùng nhà văn George Sand, trong một tu viện cũ ở Valldemossa, khi bệnh phổi đã hành hạ ông. Trong thư gửi Camille Pleyel, ông viết rằng mình đã viết xong các prelude "trên cây đàn nhỏ của ông". Nhạc trưởng Hans von Bülow về sau đặt cho bài số 4 biệt danh "Ngạt thở"; biệt danh ấy không phải của Chopin.
      - Ngày 30 tháng 10 năm 1849, tại lễ tang Chopin ở nhà thờ Madeleine (Paris), nghệ sĩ organ Louis Lefébure-Wély chơi hai prelude Mi thứ và Si thứ (số 4 và số 6) trên đàn organ, và Requiem của Mozart được trình diễn. Xem thêm thời kỳ Lãng mạn.
    moi:
      - 'Bộ 24 Prélude Op. 28 đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song song của nó, tiến theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ… Chopin mang theo bản Bình quân luật của Bach tới Mallorca, và ý tưởng một bộ prelude đủ mọi giọng gợi nhớ tác phẩm ấy. Nhưng prelude của Chopin không còn là "khúc dạo đầu" cho một fugue: mỗi bài là một bức tranh độc lập, có bài chỉ dài vài chục giây.'
      - Chopin hoàn tất bộ này ở đảo Mallorca, nơi ông trú đông 1838–1839 cùng nhà văn George Sand, trong một tu viện cũ ở Valldemossa, khi bệnh phổi đã hành hạ ông. Trong thư gửi Camille Pleyel, ông viết rằng mình đã viết xong các prelude "trên cây đàn nhỏ của ông". Bài số 4 có khi được gọi bằng biệt danh "Ngạt thở" (Suffocation); biệt danh ấy không phải của Chopin, ông chỉ ghi tốc độ Largo.
      - Ngày 30 tháng 10 năm 1849, tại lễ tang Chopin ở nhà thờ Madeleine (Paris), nghệ sĩ organ Louis Lefébure-Wély chơi trên đàn organ hai prelude của Chopin, trong đó có bài Mi thứ này, và Requiem của Mozart được trình diễn. Xem thêm thời kỳ Lãng mạn.
    ly_do: 'n14 (da-sua): Henle HN 882 (lời tựa). n18 (da-sua): việc Bülow đặt biệt danh chỉ có ở Wikipedia. n19 (da-sua): NIFC ghi bài thứ hai là Si♭ thứ, Ville de Paris ghi Si thứ; viết chung phần hai nguồn cùng nói.'
  - cu: Tám hợp âm mỗi ô; một hợp âm to hơn là lộ ngay; cẳng tay dễ mỏi và cứng
    moi: Tám hợp âm mỗi ô; một hợp âm to hơn là lộ ngay; động tác lớn dễ làm tiếng to và không đều
