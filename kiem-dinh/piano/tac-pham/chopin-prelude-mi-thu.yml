    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-4/Chop-28-4.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-4/Chop-28-4-a4.pdf" ]
    luot_2_ghi_chu: Stretto ô 16, f ô 17, dim. ô 18, p ô 19, smorz. ô 21, dấu lặng có dấu ngân ô 23, kết ô 24–25.
  - id: 'n12'
    cau: 'Một bài Chopin đầu tiên vừa sức: khoảng hai phút; Henle xếp bài ở mức 4, mức thấp nhất trong bộ Op. 28.'
    loai: 'cap-do'
    nguon:
      - 'henle-hn882'
      - 'commons-ilic4'
    ket_qua: 'da-sua'
    ghi_chu: 'Chữ cũ: "Bài Chopin đầu tiên lý tưởng. Khoảng hai phút, kỹ thuật vừa sức, âm nhạc sâu." Chữ mới: "Một bài Chopin đầu tiên vừa sức. Khoảng hai phút; Henle xếp bài ở mức 4, mức thấp nhất trong bộ Op. 28." Lý do: "lý tưởng", "âm nhạc sâu" là đánh giá; Henle HN 882: "Prelude e minor op. 28,4 4 medium", mức thấp nhất (số 6, 7, 20 cũng 4); bản thu gợi ý 109,81 giây. Dữ liệu (đã khóa) ghi Grade 5, chặng 4; RCM 2022 xếp bài ở Level 7 (hồ sơ bản ghi lần 1 n4).'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/en/Preludes/HN-882", "https://musicbrainz.org/release/b8a53e43-a383-46c0-87ce-0e567c10e795" ]
    luot_2_ghi_chu: "Henle: số 4 mức 4, thấp nhất của Op. 28 (cùng số 6, 7, 20). Pollini (DG 2012): 1:47."
  - id: 'n13'
    cau: 'Bộ 24 Prélude Op. 28 đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song song, theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ…'
    loai: 'cau-truc'
    nguon:
      - 'imslp-op28'
    ket_qua: 'dung'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Preludes,_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)", "https://www.halleonard.com/product/132308/preludes" ]
    luot_2_ghi_chu: Như câu n16 của trang La trưởng.
  - id: 'n14'
    cau: 'Chopin mang theo bản Bình quân luật của Bach tới Mallorca, và ý tưởng một bộ prelude đủ mọi giọng gợi nhớ tác phẩm ấy.'
    loai: 'lich-su'
    nguon:
      - 'henle-hn882-vorwort'
      - 'imslp-op28'
    ket_qua: 'da-sua'
    ghi_chu: 'Chữ cũ: "Chopin tôn sùng Bach, và ý tưởng một bộ prelude đủ mọi giọng gợi nhớ *Bình quân luật*." Chữ mới như câu. Lý do: "tôn sùng" chưa có nguồn bậc 2 đã mở; Henle HN 882 Preface: "Bach [Chopin had taken the score of the Well-tempered Clavier to Mallorca with him]". Vế "gợi nhớ" là so sánh: cả hai đi qua đủ 24 giọng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/cb/de/28/1690886065/0882-1690886065-sync.pdf", "https://web.archive.org/web/20191207212426/https://en.chopin.nifc.pl/chopin/life/calendar/year/1838", "https://web.archive.org/web/20210923144314/https://www.britannica.com/print/article/2087780" ]
    luot_2_ghi_chu: 'Lời tựa Henle: "Chopin had taken the score of the Well-tempered Clavier to Mallorca with him"; NIFC thư 28/12/1838 nói có "Bach" trên bàn. Britannica nói bộ prelude theo mẫu bộ prelude đủ giọng của Bach.'
  - id: 'n15'
    cau: 'Prelude của Chopin không còn là khúc dạo đầu cho một fugue: mỗi bài là một bức tranh độc lập, có bài chỉ dài vài chục giây.'
    loai: 'cau-truc'
    nguon:
      - 'imslp-op28'
    ket_qua: 'dung'
    ghi_chu: 'IMSLP: Op. 28 gồm 24 prelude, không có fugue. Số 7 dài 38 giây (hồ sơ chopin-prelude-la-truong n17).'
    luot_2: dung
