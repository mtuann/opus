ghi_chu: 'Bài học Morning Prayer Op. 39 số 1 (tầng Tác phẩm). Bản nhạc: Mutopia 2032 (Rem Zolotykh, nguồn Schirmer 1904, phạm vi công cộng), .ly, PDF A4 và MIDI tải ngày 05/11/2026; MIDI tải mới khác file ../opus-zero/_imslp/mid/mut_tch01.mid ở phần đầu. Hòa âm từng ô đọc trên MIDI (nốt theo phách) và .ly. Lịch sử: Tchaikovsky Research (Children''s Album, Liturgy of Saint John Chrysostom, Symphony No. 6, Kamenka, Vladimir Davydov), IMSLP, Henle HN 45 (Album für die Jugend). Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/tchaikovsky-cau-nguyen-buoi-sang. Sửa trang: n14 (phác thảo 24 bài "trong vài tuần" thành "xong vào đầu tháng 5": TR cho thấy chỉ vài ngày, 12–16/5 lịch mới), n23 (Phụng vụ Op. 41 viết tháng 5–6/1878, không phải mùa hè; "nhạc lễ Chính thống giáo Nga hát không có nhạc cụ" nói chung thay bằng điều TR ghi về chính Op. 41: hợp xướng bốn bè không nhạc đệm), n35 (ô 12 "chỗ to nhất bài": coda cũng mở bằng f, nên viết lại là đỉnh của câu 2). Các điều hồ sơ tchaikovsky-bai-ca-phap-co n15 đòi giữ (Florence 2/1878, Kamenka, 24 bài phác thảo, đề tặng Volodya Davydov, kết cấu hợp xướng bốn bè) vẫn còn; chữ "trong vài tuần" đổi thành mốc thời gian đúng. Khuông: khối 1 trích đoạn ô 1–8 khớp từng nốt cả hai tay với Mutopia; khối 2–4 ví dụ soạn, đúng. Thuật ngữ (Andante, Lento, legato, nốt treo, âm nền, kết trọn, kết chưa trọn, hợp âm mượn) có trong src/data/thuat-ngu.yml hay trang nhạc lý đã khóa.'
