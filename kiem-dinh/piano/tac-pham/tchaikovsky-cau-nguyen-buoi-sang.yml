nhan_dinh:
  - id: n1
    cau: Cầu nguyện buổi sáng là bài mở đầu Album for the Young của Tchaikovsky và chỉ có 24 ô nhịp.
    loai: cau-truc
    nguon: [ tr-op39, mutopia-2032 ]
    ket_qua: dung
    ghi_chu: 'TR: "1. Morning Prayer … Andante (G major, 24 bars)". Mutopia MIDI: 24 ô 3/4.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Children's_Album", "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly" ]
    luot_2_ghi_chu: "TR: số 1 Morning Prayer, Andante (G major, 24 bars); file LY đếm được 24 ô, vạch kết |. ở ô 24."
  - id: n2
    cau: 'Bài viết như một bài hát nhà thờ cho bốn giọng: chậm, khẽ, các nốt nối liền nhau.'
    loai: cau-truc
    nguon: [ mutopia-2032 ]
    ket_qua: dung
    ghi_chu: 'Mutopia: mỗi tay hai nốt (bốn bè) gần như suốt bài; Lento (Schirmer), \p ở đầu; dấu luyến dài. So sánh "bài hát nhà thờ" là cách nói của trang (tựa "Cầu nguyện").'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly" ]
    luot_2_ghi_chu: "LY: bốn bè (tay phải hai nốt, tay trái hai nốt), chỉ dẫn Lento, p ở đầu, nhiều dấu luyến; kiểu hợp xướng nhà thờ là mô tả hợp lý."
  - id: n3
    cau: Bài dạy kết cấu hợp xướng trên phím đàn, làm cho bè trên hát và giữ tiếng liền bằng ngón tay trước khi nhờ bàn đạp.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n4
    cau: Tay phải giữ bè trên (soprano) và bè alto, tay trái giữ bè tenor và bè trầm.
    loai: cau-truc
    nguon: &m
      - mutopia-2032
    ket_qua: dung
    ghi_chu: 'Mutopia: khuông trên <g b> … (hai bè), khuông dưới <g d''> … (hai bè); ô 5–8 mỗi khuông hai Voice (<< … \\ … >>).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly" ]
    luot_2_ghi_chu: "LY: khuông trên viết hai bè (soprano, alto), khuông dưới hai bè (tenor, bass), ví dụ ô 5–8 dùng << \\\\ >> ở cả hai tay."
  - id: n5
    cau: Nghe được bốn đường đi cùng lúc là nền cho Bach, thánh ca và nhạc nhiều bè về sau; link "Hòa âm bốn bè" (/opus/nhac-ly/21-hoa-am-bon-be/).
