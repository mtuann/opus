  - id: n6
    cau: Trong mỗi hợp âm, nốt trên cùng là giai điệu và phải rõ hơn các nốt dưới; kỹ năng nổi bè theo bạn đến Chopin, Schumann, Grieg; link "Tạo tiếng đàn" (/opus/piano/tieng-dan/).
    loai: khuyen-tap
    nguon: []
