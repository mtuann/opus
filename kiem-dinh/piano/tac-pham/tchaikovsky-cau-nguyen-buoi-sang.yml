    loai: so-lieu
    nguon: [ imslp-op39 ]
    ket_qua: dung
    ghi_chu: 'Bản thu gợi ý (Luis Kolodin, IMSLP; public/audio/tchaikovsky-cau-nguyen-buoi-sang.mp3) dài 79,80 giây (ffprobe). 24 ô 3/4 = 72 phách: ♩ = 56 khoảng 77 giây.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Children's_Album,_Op.39_(Tchaikovsky,_Pyotr)" ]
    luot_2_ghi_chu: "Danh sách bản thu (Naxos) trên trang IMSLP: No. 1 Morning Prayer dài 68–107 giây (10 bản thu), đều dưới 2 phút; 24 ô 3/4 ở ♩≈60 cũng khoảng 75 giây."
  - id: n11
    cau: Bài có một cao trào, một vòng quãng năm và những hợp âm mượn màu thứ.
    loai: cau-truc
    nguon: [ mutopia-2032, omt-sequences, omt-mixture ]
    ket_qua: dung
    ghi_chu: 'Cao trào ô 12 (f); vòng quãng năm ô 13–14 (B – E – A – D – G – C); Mi♭ (ô 17, 19) và Si♭ (ô 21) ở coda: nốt của Sol thứ trong Sol trưởng (OMT: mixture là mượn nốt của giọng cùng tên).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly" ]
    luot_2_ghi_chu: "LY: cao trào ô 12 (Fa♯ trưởng, f, dấu nhấn); ô 13–14 B7–E–A7–D–G–C (vòng quãng năm); coda có Mi♭ (Đô thứ, bảy giảm Fa♯) mượn từ Sol thứ."
  - id: n12
    cau: Tháng 2 năm 1878, khi đang ở Florence, Tchaikovsky viết cho nhà xuất bản Pyotr Jurgenson rằng ông muốn soạn một loạt bài dễ.
    loai: lich-su
    nguon: [ tr-op39 ]
    ket_qua: dung
    ghi_chu: 'TR: "while staying in Florence on 14/26 February, Tchaikovsky told Pyotr Jurgenson that he wanted “to write a number of easy pieces, like Kinderstück”". Chữ "cho trẻ em" của trang là nghĩa của Kinderstück.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Children's_Album" ]
    luot_2_ghi_chu: "TR: 'while staying in Florence on 14/26 February, Tchaikovsky told Pyotr Jurgenson that he wanted \"to write a number of easy pieces\"' (thư 761)."
  - id: n13
    cau: Kamenka là điền trang của gia đình em gái Tchaikovsky, Aleksandra Davydova, ở Ukraina; ông trở về Kamenka (tháng 4/1878).
    loai: lich-su
    nguon: [ tr-kamenka, tr-op39 ]
    ket_qua: dung
    ghi_chu: 'TR Kamenka: "Kamenka was the home of the composer''s sister Aleksandra, and her husband Lev Davydov, who managed his family''s extensive estates there"; thành phố ở Ukraina; chuyến 11/23 April 1878. TR Children''s Album: "after his return to Kamenka in April he decided to begin composition".'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Kamenka", "https://en.tchaikovsky-research.net/pages/Children's_Album" ]
    luot_2_ghi_chu: "TR Kamenka: ở Ukraina, là nhà của em gái Aleksandra và chồng Lev Davydov, người quản lý điền trang của gia đình ở đó; chuyến 11/23 tháng 4 1878. Trang Children's Album: 'after his return to Kamenka in April'."
  - id: n14
    cau: Ở Kamenka, Tchaikovsky phác thảo xong cả 24 bài vào đầu tháng 5, rồi sửa và chép sạch vào mùa hè.
    loai: lich-su
    nguon: [ tr-op39 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ông phác thảo cả 24 bài trong vài tuần, rồi sửa và chép sạch vào mùa hè." Chữ mới: "ông phác thảo xong cả 24 bài vào đầu tháng 5, rồi sửa và chép sạch vào mùa hè." Lý do: TR: thư 30 April/12 May "Tomorrow I shall start work on my collection"; "On 4/16 May the sketches for all 24 pieces were ready" (vài ngày, không phải vài tuần); chép sạch bắt đầu khoảng 13/25 July, xong 20 July/1 August. Câu mới vẫn giữ điều hồ sơ tchaikovsky-bai-ca-phap-co n15 nêu (24 bài phác thảo ở Kamenka).'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Children's_Album", "https://en.tchaikovsky-research.net/pages/Kamenka" ]
    luot_2_ghi_chu: "TR: phác thảo xong cả 24 bài ngày 4/16 tháng 5 (ở Kamenka); sửa từ cuối tháng 6, chép sạch từ 13/25 đến 20 tháng 7/1 tháng 8. Lưu ý: TR ghi việc sửa và chép sạch ở Verbovka (điền trang gần Kamenka), nên 'ở Kamenka' chỉ đúng cho phần phác thảo."
  - id: n15
    cau: Trong thư gửi Nadezhda von Meck, người bảo trợ của mình, Tchaikovsky nói muốn có những bản nhạc nhỏ với tên gọi hấp dẫn, như của Schumann.
    loai: lich-su
    nguon: [ tr-op39 ]
    ket_qua: dung
    ghi_chu: 'TR: thư 30 April/12 May 1878 gửi von Meck: "I want to create a series of little individual pieces just for children, and with an attractive title, like Schumann''s". TR, trang Nadezhda von Meck (https://en.tchaikovsky-research.net/pages/Nadezhda_von_Meck): "Patroness and close friend of Tchaikovsky".'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Children's_Album" ]
    luot_2_ghi_chu: "TR, thư 820 gửi von Meck 30/4–12/5/1878: 'a series of little individual pieces just for children, and with an attractive title, like Schumann's'."
