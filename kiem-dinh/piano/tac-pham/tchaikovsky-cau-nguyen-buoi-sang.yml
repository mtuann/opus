khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ not-tay-phai, not-tay-trai, tiet-tau, giong, nhip, sac-thai, so-ngon ]
    ket_qua: dung
    ghi_chu: 'Cầu nguyện buổi sáng ô 1–8, ấn bản Schirmer 1904 qua Mutopia 2032. Đối chiếu từng nốt, cả hai tay, bằng MIDI tải mới (đọc nốt theo phách bằng script Python không thư viện) và .ly: tay phải ô 1–4 [GB]2 [GB]3 [FA] | [Gc]2 [GB]4 | [FA]2 [EG]2 [EA]2 | [^DB]6; ô 5–8 hai bè B2 E3 A & =D2 ^C4 | A2 D3 F & =C2 B,2 C2 | G2 G2 e3/2 A/ & D2 E2 G2 | A6 & G2 F E F2; tay trái ô 1–4 [G,D]2 [G,D]3 [D,D] | [E,C]2 [G,D]4 | [D,D]2 [E,B,]2 [C,E,]2 | [B,,F,]6; ô 5–8 E,2 E,4 & ^G,,2 A,,2 =G,,2 | D,2 D,4 & F,,2 G,,2 A,,2 | [B,,G,]2 [C,G,]2 [^C,A,]2 | A,4 D2 & D,6: khớp từng nốt và trường độ. Sắc thái p ô 1 khớp; Q:1/4=60 (bản Mutopia: MIDI 62, chữ Lento). Số ngón phần lớn như Schirmer (<g b-3>, <fis-1 a-2>, <g-1 c-4>, cis2-1, b-1( c-1), e''8.-5, a2.-4 …), phần còn lại là gợi ý chơi được.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: 'Bè trên hát, đổi ngón trên phím, Sol trưởng, 3/4, L:1/8: mỗi ô 6. Bè trên B c d | e d | c B A | B với ngón 2-3-4 | 5 (4–5) | 4-3-2 | 3; bè alto G G G | G G | E G F | G bằng ngón cái. Hợp âm G – C/G – G/B… – Am – G – D – G hợp lý. Đúng chú thích (đổi 4 sang 5 trên Rê ở ô 2).'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, giong, hop-am, so-ngon, ban-dap ]
    ket_qua: dung
    ghi_chu: 'Hợp xướng bốn bè và bàn đạp nối, Sol trưởng, 3/4, L:1/8: mỗi ô 6. Hợp âm G – D/F♯ – Em | C – D(4) – D | G – C | G; Sol alto và Mi bè trên nối từ ô 1 sang ô 2; Sol treo trên Rê rồi xuống Fa♯ (phách 3 ô 2): đúng chú thích về nốt treo và đổi bàn đạp. Ngón 1-3, 2-4, 1-5 … chơi được.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, giong, hop-am, so-ngon, am-nen ]
    ket_qua: dung
    ghi_chu: 'Âm nền, Sol trưởng, 3/4, L:1/8: mỗi ô 6. Tay trái hai bè: Sol2 móc đơn ×6 (ngón 5, pp) dưới bè giữa D3 – E3 – C3 – B2 nốt trắng chấm dôi (ngón 2-1-3-4; khoảng Sol2–Mi3 là quãng 6, vừa tay). Tay phải G – C/G – D7/G – G. Đúng chú thích; ô 2 đổi E thành E♭ cho Đô thứ như câu dưới khối.'
doi_chu:
  - cu: Sol trưởng · 3/4 Andante ≈ Grade 3 24 ô nhịp
    moi: Sol trưởng · 3/4 Andante ≈ Grade 3–4 24 ô nhịp
    ly_do: 'Chip cấp độ dựng từ bản ghi tac-pham/tchaikovsky-cau-nguyen-buoi-sang: D2-0 sửa grade Grade 3 thành Grade 3–4 (ABRSM Grade 4, 2019 & 2020; RCM Level 3; plans/lam-lai/bao-cao/d2-0/sua-A.yml, hồ sơ du-lieu/tac-pham/tchaikovsky-cau-nguyen-buoi-sang n4).'
  - cu: 'Khoảng ABRSM Grade 3 (ước lượng): nốt dễ đọc, nhưng giữ bốn bè liền và cân bằng đòi hỏi kiểm soát tốt'
    moi: 'Khoảng ABRSM Grade 3–4: ABRSM xếp bài ở Grade 4 (đề cương 2019–2020), RCM Level 3. Nốt dễ đọc, nhưng giữ bốn bè liền và cân bằng đòi hỏi kiểm soát tốt'
    ly_do: Dòng Độ khó của thong_tin sửa ở D2-0 theo đề cương ABRSM và RCM (sua-A.yml); lượt 1 D6-L2 kiểm lại ở hồ sơ bản ghi.
  - cu: 'Tháng 2 năm 1878, khi đang ở Florence, Tchaikovsky viết cho nhà xuất bản Pyotr Jurgenson rằng ông muốn soạn một loạt bài dễ cho trẻ em. Trở về Kamenka, điền trang của gia đình em gái ông, Aleksandra Davydova, ở Ukraina, ông phác thảo cả 24 bài trong vài tuần, rồi sửa và chép sạch vào mùa hè. Trong thư gửi bà Nadezhda von Meck, người bảo trợ của mình, Tchaikovsky nói muốn có những bản nhạc nhỏ với "tên gọi hấp dẫn, như của Schumann". Bản in mang phụ đề 24 bài dễ (theo kiểu Schumann): hình mẫu là tập Album für die Jugend mà Schumann viết cho các con năm 1848.'
    moi: 'Tháng 2 năm 1878, khi đang ở Florence, Tchaikovsky viết cho nhà xuất bản Pyotr Jurgenson rằng ông muốn soạn một loạt bài dễ cho trẻ em. Trở về Kamenka, điền trang của gia đình em gái ông, Aleksandra Davydova, ở Ukraina, ông phác thảo xong cả 24 bài vào đầu tháng 5, rồi sửa và chép sạch vào mùa hè. Trong thư gửi bà Nadezhda von Meck, người bảo trợ của mình, Tchaikovsky nói muốn có những bản nhạc nhỏ với "tên gọi hấp dẫn, như của Schumann". Bản in mang phụ đề 24 bài dễ (theo kiểu Schumann): hình mẫu là tập Album für die Jugend mà Schumann viết cho các con năm 1848.'
    ly_do: 'n14 (da-sua): Tchaikovsky Research: bắt đầu khoảng 13/5 (lịch mới), "On 4/16 May the sketches for all 24 pieces were ready": vài ngày, không phải vài tuần. (Đoạn viết tay ở đây chỉ gồm hai câu đầu của đoạn; phần sau đoạn không đổi.)'
  - cu: 'Cũng trong mùa hè 1878, Tchaikovsky đang viết Phụng vụ thánh Gioan Kim Khẩu (Op. 41) cho hợp xướng. Nhạc lễ Chính thống giáo Nga hát không có nhạc cụ, nên bốn bè luôn là bốn giọng người. Kết cấu của Cầu nguyện buổi sáng rất gần lối hát ấy: hãy chơi như thể mỗi bè là một ca sĩ cần lấy hơi. Xem thêm thời kỳ Lãng mạn.'
    moi: 'Cũng trong tháng 5 và tháng 6 năm 1878, Tchaikovsky viết Phụng vụ thánh Gioan Kim Khẩu (Op. 41), nhạc lễ Chính thống giáo Nga cho hợp xướng bốn bè không nhạc đệm: bốn bè là bốn giọng người. Kết cấu của Cầu nguyện buổi sáng rất gần lối hát ấy: hãy chơi như thể mỗi bè là một ca sĩ cần lấy hơi. Xem thêm thời kỳ Lãng mạn.'
    ly_do: 'n23 (da-sua): Tchaikovsky Research: Liturgy "composed between 4/16 May and 27 May/8 June 1878", "for unaccompanied voices", "unaccompanied mixed chorus (SATB)"; câu chung về mọi nhạc lễ Chính thống giáo Nga chưa có nguồn đã mở.'
  - cu: 'Cao trào (ô 12): hợp âm Fa♯ trưởng, chỗ to nhất bài'
    moi: 'Cao trào (ô 12): hợp âm Fa♯ trưởng, f có dấu nhấn, đỉnh của câu 2'
    ly_do: 'n35 (da-sua): bản Schirmer ghi f cả ở ô 12 lẫn đầu coda (ô 16), nên "chỗ to nhất bài" không rõ trên bản nhạc.'
  - cu: Codaô 17–24 · âm nền Sol · pp
    moi: Codaô 17–24 · âm nền Sol · f → pp
    ly_do: 'sua-B.yml đã áp (hồ sơ du-lieu/tac-pham/tchaikovsky-cau-nguyen-buoi-sang n27, da-sua): bản Schirmer 1904 (Mutopia 2032) mở coda bằng f (ô 16), mf ô 18, dim. ô 20, pp chỉ ở hợp âm cuối. Chữ hiện qua ::hinh-cau-truc.'
