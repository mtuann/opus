    ket_qua: dung
    ghi_chu: 'MIDI: ô 3 D – Em – Am/C; ô 5 E7/G♯ – A – A7/G; ô 6 D7/F♯ – G – D7/A; ô 7 G/B – C – A7/C♯; ô 13 B7 – E – A7; ô 14 D7 – G – C. Vế "nên bàn đạp không cứu được" là lời khuyên.'
