    nguon: [ tr-liturgy, tr-op39 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cũng trong mùa hè 1878, Tchaikovsky đang viết *Phụng vụ thánh Gioan Kim Khẩu* (Op. 41) cho hợp xướng. Nhạc lễ Chính thống giáo Nga hát không có nhạc cụ, nên bốn bè luôn là bốn giọng người." Chữ mới: "Cũng trong tháng 5 và tháng 6 năm 1878, Tchaikovsky viết *Phụng vụ thánh Gioan Kim Khẩu* (Op. 41), nhạc lễ Chính thống giáo Nga cho hợp xướng bốn bè không nhạc đệm: bốn bè là bốn giọng người." Lý do: TR Liturgy: "composed between 4/16 May and 27 May/8 June 1878" (cuối xuân, không phải mùa hè; TR Children''s Album: 21 July/2 August ông còn làm tiếp bản Liturgy); "a setting … from the Russian Orthodox Liturgy for unaccompanied voices", "Scored for unaccompanied mixed chorus (SATB)". Câu chung về mọi nhạc lễ Chính thống giáo Nga không tìm được nguồn bậc 2 đã mở, nên chỉ nói điều nguồn ghi về Op. 41.'
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Liturgy_of_Saint_John_Chrysostom" ]
    luot_2_ghi_chu: "TR: Op. 41, phụng vụ Chính thống giáo Nga cho 'unaccompanied mixed chorus (SATB)', sáng tác 4/16 tháng 5 – 27 tháng 5/8 tháng 6 năm 1878."
