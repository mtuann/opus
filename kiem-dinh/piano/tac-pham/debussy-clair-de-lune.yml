  - id: n46
    cau: 'Độ to theo tốc độ phím đi xuống: ấn quá chậm thì nốt không kêu, hơi nhanh là đã to.'
    loai: quy-tac
    nguon:
      - askenfelt-hammer
      - goebl-2004
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: chưa mở nguồn về bộ máy đàn piano trong lô này; lượt 2 kiểm (hay bỏ phần "escapement"). Review D6-L5-gom: nguồn lượt 2 là trang của thợ đàn (bậc 3). Viết lại theo điều trang piano/tieng-dan (đã khóa) đã kiểm: độ to theo tốc độ phím đi xuống (Askenfelt, Goebl 2004: hồ sơ piano/tieng-dan n4), đẩy chậm quá thì nốt không kêu (tieng-dan n47, như review D4-gom). Bỏ chữ "điểm thoát (escapement)". Đổi loại sang quy-tac (doi_chu). Chữ mới có nội dung khác: lượt 2 bổ sung. Chữ câu cũ: "Phím đàn có "điểm thoát" (escapement): ấn quá chậm thì nốt không kêu, quá nhanh thì to.". Kết quả lượt 2 cũ (gỡ để vào lượt 2 bổ sung): dung; nguồn [''https://www.howardpianoindustries.com/how-a-vertical-piano-action-works/'']; ghi chú: Thợ đàn Howard Piano Industries: ấn rất chậm thì búa đến sát dây rồi nhả, không đánh vào dây; đánh mạnh thì búa đánh hết vào dây. Vế ''nhanh thì to'' là kiến thức chung, nguồn chỉ nói gián tiếp.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2015/http://www.speech.kth.se/music/5_lectures/askenflt/pianist.html", "https://web.archive.org/web/2015/http://www.speech.kth.se/music/5_lectures/askenflt/timing.html", "https://web.archive.org/web/2015/http://www.speech.kth.se/music/5_lectures/askenflt/motions.html" ]
    luot_2_ghi_chu: "Askenfelt & Jansson, 'From touch to string vibration' (Five lectures on the acoustics of the piano, Royal Swedish Academy of Music 1990; trang KTH gốc đã gỡ, đọc bản lưu Wayback). Vế 1: pianist.html: búa rời phím trước khi chạm dây nên người chơi chỉ điều khiển được vận tốc cuối của búa, tức độ to. Vế 2: timing.html: khoảng let-off được chỉnh bằng cách 'quan sát khoảng cách giữa dây và đỉnh búa ở điểm cao nhất, khi phím được ấn chậm' (1–3 mm), tức ấn đủ chậm thì búa thoát rồi dừng dưới dây, không đánh. Vế 3 là cách nói gần đúng: motions.html ghi vận tốc phím ở mezzo forte chỉ khoảng 0,3–0,5 m/s, forte hiếm khi quá 1 m/s, nên khoảng tốc độ phím từ nhẹ tới to rất hẹp."
