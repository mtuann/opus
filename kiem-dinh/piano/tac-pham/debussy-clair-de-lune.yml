ghi_chu: 'Bài học Clair de lune (tầng Tác phẩm). Bản nhạc: Mutopia debussy_Ste_Bergamesq_Clair (Keith OHara, theo bản in E. Fromont 1905, IMSLP #02907), tải .ly và .mid 05/11/2026 với User-Agent opus-kiem-dinh; script Python (mido) in nốt theo ô (72 ô 9/8) và script đếm vạch nhịp trong \parallelMusic để gắn chỉ dẫn với số ô: Andante très expressif, pp, con sordina ô 1; Tempo rubato ô 15; peu à peu cresc. et animé ô 19; diminuendo molto ô 25; Un poco mosso ô 27; En animant (hóa biểu Đô♯ thứ) ô 37; f ô 41; Calmato ô 43; a Tempo 1º, ppp ô 51; morendo jusqu''à la fin, ppp ô 66. Không có mf nào. Lịch sử: lời tựa Henle HN 381 (PDF, Lesure 1983). Mốc ::khoi-nghe "2 57 71 97 140 162 201 268" (8 mốc / 8 dòng), bản thu Laurens Goedhart 2011 (Commons, phạm vi công cộng, 304,09 s); theo tools/audio/align/pieces.py mốc là ô 1, 15, 19, 27, 37, 43 (đo tay 162,3 s), 51, 66: khớp các dòng bảng. Không nghe lại bản thu. Câu ve-site ở hồ sơ khác: piano/hai-tay n47 (nhóm hai nốt trong 9/8) và n48 (link tới trang này, giữ "Rê♭ trưởng · 9/8" và cách đếm 9/8): trang giữ đúng. piano/not-lap-not-kep n43 (Clair de lune ô 1–14, nốt kép): đúng, quãng ba, quãng sáu ô 1–14. cap-nhat n51 (lối tắt "Chỉ muốn nghe?"): có. piano/tac-pham/satie-gymnopedie n67 (link tới trang này): có. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ trang dùng (una corda, con sordina, rubato, Andante, pp, legato, staccato) có trong src/data/thuat-ngu.yml; "đạp nửa", "rung bàn đạp", "điểm thoát (escapement)" chưa có bản ghi (ghi cho người giao).'
