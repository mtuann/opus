khuong_nhac:
- khoi: 1
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, tiet-tau, so-ngon]
  ket_qua: dung
  ghi_chu: 'Rê♭ trưởng, 9/8, L:1/8, 4 ô đủ 9 móc đơn (ô 2, 3 có (2: hai nốt chiếm ba móc đơn). Tay phải vào sau phách một móc đơn (z), quãng ba có dấu nối; tay trái ba phách chấm (Rê♭–La♭–Fa; Sol♭–Rê♭–Si♭; La♭–Mi♭–Sol♭; Rê♭/La♭). Đúng lời dẫn.'
- khoi: 2
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, so-ngon]
  ket_qua: dung
  ghi_chu: '3 ô 9/8: quãng sáu đi xuống La♭4/Fa5, Sol♭4/Mi♭5, Fa4/Rê♭5, Mi♭4/Đô5, Rê♭4/Si♭4, Đô4/La4… ngón 5-4-5-4-5-4 cho nốt trên; tay trái quãng năm ngân. Đúng lời dẫn.'
- khoi: 3
  loai: vi-du-soan
  kiem: [cu-phap, nhip, giong, hop-am, so-ngon]
  ket_qua: dung
  ghi_chu: '4 ô 9/8. Tay trái mỗi ô một vòng cung chín móc đơn (Rê♭, Sol♭, La♭7, Rê♭), ngón 5-2-1-3-2-3-1-3-5: đi lên ngón 3 vắt qua ngón cái, đi xuống ngón cái luồn; nốt thứ năm là đỉnh. Tay phải giai điệu Fa5–Mi♭5, Rê♭5–Đô5, Si♭4–La♭4. Đúng lời dẫn.'
doi_chu:
- cu: Khoảng ABRSM Grade 8 (ước lượng)
  moi: Trinity xếp bài ở Grade 8 (danh sách từ 2023); không có trong đề cương ABRSM; RCM xếp ở Level 10 (đề cương 2022); Henle xếp mức 5 (trung bình) trên thang 1–9
  ly_do: 'Dòng Độ khó của thong_tin (hồ sơ bản ghi tac-pham/debussy-clair-de-lune n22; sua-A.yml): bỏ ước lượng ABRSM không nguồn; Trinity Grade 8 (từ 2023, lần 1 n4), RCM Level 10 (2022), Henle HN 381 mức 5; ABRSM không xếp bài. Chip đã khóa không đổi.'
- cu:
  - Tên bài lấy từ bài thơ Clair de lune của Paul Verlaine trong tập Fêtes galantes (1869), bài thơ mà Debussy đã phổ nhạc thành ca khúc. Chữ bergamasque cũng đến từ chính bài thơ đó. Bài thơ tả những nhân vật đeo mặt nạ dưới ánh trăng, vui mà buồn; âm nhạc giữ đúng cái vẻ nửa sáng nửa tối ấy.
  - 'Debussy viết bộ tổ khúc khi khoảng 28 tuổi, nhưng chỉ in nó 15 năm sau, khi phong cách của ông đã khác hẳn. Bản in năm 1905 là bản đã sửa; bản thảo gốc không còn, nên không ai biết chắc phần nào thuộc năm 1890, phần nào thuộc năm 1905. Bài nằm ở ngưỡng giữa thế kỷ 19 và thế kỷ 20: hòa âm còn chức năng (có át, có kết rõ) nhưng màu sắc đã là của Debussy. Xem thế kỷ 20.'
  moi:
  - Tên bài trùng tên bài thơ Clair de lune của Paul Verlaine, bài mở đầu tập Fêtes galantes (1869), bài thơ mà Debussy đã phổ nhạc thành ca khúc. Chữ bergamasque có ngay trong bài thơ ấy ("masques et bergamasques"); theo lời tựa của ấn bản Henle, tên tổ khúc thường được coi là một gợi nhớ tới tập thơ này. Bài thơ tả những nhân vật đeo mặt nạ dưới ánh trăng, vui mà buồn; âm nhạc giữ đúng cái vẻ nửa sáng nửa tối ấy.
  - 'Debussy viết bộ tổ khúc khi khoảng 28 tuổi, nhưng chỉ in nó 15 năm sau; chính ông ghi năm 1890 lên bản in thử để cho biết đây là tác phẩm thời trẻ. Bản in năm 1905 là bản đã sửa; bản thảo gốc đến nay chưa tìm thấy, nên không ai biết chắc phần nào thuộc năm 1890, phần nào thuộc năm 1905. Bài nằm ở ngưỡng giữa thế kỷ 19 và thế kỷ 20: hòa âm còn chức năng (có át, có kết rõ) nhưng màu sắc đã là của Debussy. Xem thế kỷ 20.'
  ly_do: 'n10 (da-sua), n13 (da-sua): Gutenberg (Verlaine), Henle HN 381. n17 (da-sua), n19 (da-sua): theo lời tựa Henle HN 381.'
