  - cu: "Bài sống trong vùng từ pp đến p, với vài lần lên mf và một cao trào ở đoạn B. Hãy có ít nhất ba mức nhỏ khác nhau: thì thầm, nhỏ, nhỏ mà ấm. Luôn có ba tầng: giai điệu, phần hòa âm, bè trầm. Bè trầm thường là nốt ngân dài: đánh nó sâu một chút để bàn đạp có thứ để giữ."
    moi: "Bài gần như chỉ sống trong vùng từ ppp đến p; chỉ một lần lên f, ở cao trào của đoạn B (ô 41). Hãy có ít nhất ba mức nhỏ khác nhau: thì thầm, nhỏ, nhỏ mà ấm. Luôn có ba tầng: giai điệu, phần hòa âm, bè trầm. Bè trầm thường là nốt ngân dài: đánh nó sâu một chút để bàn đạp có thứ để giữ."
    ly_do: "n69 (da-sua): bản Fromont 1905 không có mf; f duy nhất ở ô 41."
  - cu: "Debussy được kể là muốn người chơi làm người nghe quên rằng piano có búa: tiếng đàn như không bắt đầu bằng một cú đánh. Chạm phím từ rất gần, ngón phẳng hơn, phần thịt của đầu ngón. Ở những hợp âm lớn, dùng trọng lượng cả cánh tay rơi xuống, cổ tay mềm như lò xo."
    moi: "Marguerite Long kể một câu Debussy hay nói: phải quên rằng piano có búa. Hãy để tiếng đàn như không bắt đầu bằng một cú đánh. Chạm phím từ rất gần, ngón phẳng hơn, phần thịt của đầu ngón. Ở những hợp âm lớn, dùng trọng lượng cả cánh tay rơi xuống, cổ tay mềm như lò xo."
    ly_do: "n74 (review D6-L5-gom): ghi người kể theo nguồn (Grayson 2014, dẫn Long, At the Piano with Debussy, tr. 13)."
