  loai: lich-su
  nguon: [gutenberg-verlaine, henle-hn381-vorwort]
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chữ bergamasque cũng đến từ chính bài thơ đó." Bài thơ: "Que vont charmants masques et bergamasques". Henle: "the traditional belief of the work being a basic reflection of Verlaine''s Fêtes galantes", có giả thuyết khác. Viết theo Henle.'
- id: n14
  cau: Bài thơ tả những nhân vật đeo mặt nạ dưới ánh trăng, vui mà buồn.
  loai: lich-su
  nguon: [gutenberg-verlaine]
  ket_qua: dung
  ghi_chu: '"masques et bergamasques, / Jouant du luth et dansant et quasi / Tristes sous leurs déguisements fantasques ... Au calme clair de lune triste et beau".'
