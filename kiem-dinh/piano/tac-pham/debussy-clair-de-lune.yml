  - cu: "Tay trái riêng: mỗi ô là một vòng cung lên rồi xuống. Đi lên, ngón 3 vắt qua ngón cái; đi xuống, ngón cái luồn dưới. Cổ tay đi theo hướng của chuỗi nốt, không nhấc ngón cao. Nốt đỉnh của vòng cung (nốt thứ năm) không được to lên."
    moi: "Tay trái riêng: mỗi ô 1–3 là một vòng cung lên rồi xuống; ô cuối đi lên rồi giữ hợp âm kết. Đi lên, ngón 3 vắt qua ngón cái; đi xuống, ngón cái luồn dưới. Cổ tay đi theo hướng của chuỗi nốt, không nhấc ngón cao. Nốt đỉnh của vòng cung (nốt thứ năm) không được to lên."
