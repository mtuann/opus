    ghi_chu: 'chưa chắc: chưa mở nguồn ghi lời này (thường dẫn từ Marguerite Long); lượt 2 kiểm hay bỏ. Review D6-L5-gom: nguồn lượt 2 là trang cá nhân dẫn sách. Review tìm được bài của David Grayson trên Nineteenth-Century Music Review (Cambridge, 2014; tải 05/11/2026, User-Agent opus-kiem-dinh) dẫn Long, At the Piano with Debussy, tr. 13. Viết lại theo nguồn ấy; vế "Hãy để tiếng đàn như không bắt đầu bằng một cú đánh" thành lời khuyên. doi_chu. Có tên người kể (Long): lượt 2 bổ sung. Chữ câu cũ: "Debussy được kể là muốn người chơi làm người nghe quên rằng piano có búa.". Kết quả lượt 2 cũ (gỡ để vào lượt 2 bổ sung): dung; nguồn [''https://djupdal.org/karstein/debussy/method/m08.shtml'']; ghi chú: Trang dẫn Marguerite Long: "''One must forget that the piano has hammers,'' was one of his most frequent sayings" và Vallas. Nguồn thứ cấp (trang cá nhân dẫn sách).'
    luot_2: dung
    luot_2_nguon: [ "https://www.cambridge.org/core/journals/nineteenth-century-music-review/article/claude-debussy-claude-debussy-album-debussy-le-compositeur-et-ses-interpretes-claude-debussy-and-ricardo-vines-pf-ninon-vallin-jane-bathori-claire-croiza-mary-garden-hector-dufranne-and-gerard-souzay-voice-camille-chevillard-and-arturo-toscanini-cond-aeon-1215-2012-3-cds-227-minutes-claude-debussy-clair-de-lune-natalie-dessay-sop-karine-deshayes-mezzosop-catherine-michel-harp-philippe-cassard-pf-le-jeune-choeur-de-paris-virgin-classics-7307692-2012-1-cd-73-minutes-claude-debussy-the-claude-debussy-collection-sony-193179-2012-18-cds-1148-minutes-claude-debussy-the-debussy-edition-deutsche-grammophon-47900566-18-cds-1032-minutes-claude-debussy-hommage-a-debussy-works-for-piano-julia-dahlkvist-chenyin-li-juliana-steinbach-and-amir-tebenikhin-pf-genuin-classics-12230-2012-4-cds-302-minutes-claude-debussy-piano-music-4-volumes-roy-howat-pf-tall-poppies-vol-1-94-1997-1-cd-79-minutes-vol-2-123-2000-1-cd-71-minutes-vol-3-164-2002-1-cd-75-minutes-vol-4-165-2003-1-cd-73-minutes/E1F1D03E3D57CC5B9671937E0A620D8D" ]
    luot_2_ghi_chu: "Bài điểm đĩa trên Nineteenth-Century Music Review (Cambridge) dẫn Marguerite Long, At the Piano with Debussy (bản dịch Olive Senior-Ellis, Dent 1972), tr. 13: một trong những câu Debussy 'hay nói nhất' là 'one must forget that the piano has hammers'. Trang djupdal.org/karstein/debussy/method/m08.shtml (nguồn phổ thông, chỉ để đối chiếu) dẫn cùng câu, cùng trang."
