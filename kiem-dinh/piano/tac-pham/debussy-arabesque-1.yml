    luot_2_ghi_chu: "Bản quét Durand & Fils 1904 (IMSLP #255354, file đã tải ở _imslp/, xem 5 trang): ô 10 chùm ba Si–La–Si rồi Đô♯ đen, móc đơn; ô 12 chùm ba Rê♯–Đô♯–Rê♯ rồi móc đơn. Mutopia khớp."
    review: dung
  - id: n29
    cau: 'Bài đổi hóa biểu hai lần (ô 39 sang ba dấu thăng, ô 71 về bốn dấu thăng); phần lớn bài nhỏ: mở đầu p, chủ đề pp; to nhất là f ở đoạn giữa và ở Risoluto; đoạn kết dim., più dim., p ở ô 99, rồi pp từ ô 101 tới hết.'
    loai: cau-truc
    nguon: [ durand-1904 ]
    ket_qua: da-sua
    ghi_chu: 'Đọc cả 5 trang ở 110 dpi: sắc thái ghi p, pp, cresc., sempre cresc., poco a poco cresc., < >, f (tr. 3 hệ 3–4, tr. 4 hệ 1), sf (tr. 3 hệ 1 ô cuối, dấu nhấn trong khung < >), dim., dim. molto, più dim.; không thấy ff. Đoạn kết tr. 5 hệ 3–5: dim., più dim., p, pp, pp. Review (Claude, 17/11/2026): Sửa: lượt 2 ghi câu bỏ qua p ở ô 99. Bản quét tr. 5 hệ 4 ô 1 (ô 99): p dưới khuông trên, ô 101 pp, ô 106 pp; không thấy ff ở tr. 1, 3, 4, 5. Trang mục Sắc thái thành "Đoạn kết ghi dim., più dim., p ở ô 99, rồi pp từ ô 101 tới hết".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/DebussyC/L66/debussy_Arabesque_1/debussy_Arabesque_1.ly" ]
    luot_2_ghi_chu: "Bản quét Durand & Fils 1904 (IMSLP #255354, file đã tải ở _imslp/, xem 5 trang): hóa biểu đổi ở ô 39 (ba thăng) và ô 71 (bốn thăng); ô 63 không đổi hóa biểu (dùng dấu hoàn). Sắc thái lớn nhất là f (ô 49, 53, 54, 63; ô 42 có sf), không có ff. Đoạn kết: dim. ô 95, più dim. ô 97, p ô 99 (chủ đề), pp ô 101 và 106: câu bỏ qua p ở ô 99 nhưng không sai."
    review: sai
