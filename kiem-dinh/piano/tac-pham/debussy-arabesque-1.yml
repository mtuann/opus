    luot_2_ghi_chu: "Mi trưởng, ô 39 La trưởng: bản quét 1904. Chia ba/chia hai: ô 6–9. un peu moins vite: Dolmetsch như n31. In lần đầu 11/1891 Durand et Schoenewerk, 1904 khắc lại: IMSLP. Mất 1918: Henle."
