ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 7). Nốt nhạc, chữ chỉ dẫn, sắc thái chép từ bản quét Durand & Fils 1904, IMSLP #255354 (file IMSLP255354-PMLP02383-Debussy,_Claude-Deux_Arabesques_Durand_4395_filter.pdf, 11 trang; Arabesque số 1 ở trang PDF 1–5, số trang in 1–5; đọc toàn bài ở 110 dpi, các ô trích ở 300–400 dpi). Số ô đếm trên bản quét (16 + 21 + 25 + 24 + 21 = 107) và đối chiếu với barNumberCheck của bản Mutopia (ô 6, 13, 17, 26, 47, 55, 63, 76, 83, 87, 95) và với MIDI Mutopia (107 ô). Mốc: căn bằng tools/audio/align (DTW) với MIDI Mutopia (cấu hình và nguồn thêm vào pieces.py và sources.json trong worktree rồi trả lại như cũ vì ngoài phạm vi nhánh them/; bản vá ghi ở báo cáo); 10 dòng ba biến thể khớp trong 2 giây; dòng 6 (ô 39), 11 (ô 95), 13 (ô cuối) đo tay trên khởi âm và phổ (xem n16, n17, n24). Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/debussy-arabesque-1.'
