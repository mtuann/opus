    ghi_chu: 'Ô 1–2, 4/4, K:E, L:1/8. Ấn bản: durand-1904 tr. 1 hệ 1, đọc ở 400 dpi (khuông trên khóa Sol; khuông dưới khóa Sol tới cuối ô 2, khóa Fa đặt cuối ô 2). Ô 1: tay phải nghỉ phách 1, chùm ba Đô♯5–Mi5–Fa♯5 (phách 2), Sol♯5–Rê♯5–Si4 (phách 3), nghỉ phách 4; tay trái chùm ba Đô♯4–Mi4–La4 (phách 1), nghỉ, chùm ba Sol♯4–Rê♯4–Si3 (phách 4). Ô 2: tay phải La4–Đô♯5–Rê♯5, Mi5–Si4–Sol♯4; tay trái La3–Đô♯4–Fa♯4, Mi4–Si3–Sol♯3. Đối chiếu Mutopia: rhDownE "\ohn cs8*2/3 s s cs'' e fs gs ds b s s \ohn b,", "a'' cs ds e b gs"; lhUpE "\times2/3{cs''8\p e'' a''} s2 \times2/3{gs'' ds'' b}", "a8*2/3 cs'' fs'' s2 e'' b gs": khớp. Bản in không ghi dấu lặng (các nốt ẩn của Mutopia giữ chỗ); abc ghi dấu lặng để đủ phách. p đặt ở khuông dưới (bản in đặt giữa hai khuông). Bỏ: vòng luyến dài nối bốn chùm ba của mỗi ô, chữ "Andantino con moto" (ghi trong lời dẫn). Review (Claude, 17/11/2026): tr. 1 hệ 1 đọc lại ở 400 dpi: tay phải Đô♯5–Mi5–Fa♯5, Sol♯5–Rê♯5–Si4 | La4–Đô♯5–Rê♯5, Mi5–Si4–Sol♯4; tay trái (khóa Sol) Đô♯4–Mi4–La4 … Sol♯4–Rê♯4–Si3 | La3–Đô♯4–Fa♯4 … Mi4–Si3–Sol♯3; p: khớp từng nốt.'
