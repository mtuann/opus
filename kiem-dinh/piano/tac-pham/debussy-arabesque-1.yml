    cau: 'Câu hỏi kiểm tra: Mi trưởng, đoạn giữa La trưởng từ ô 39; ở chủ đề tay phải chia ba, tay trái chia hai; Tempo rubato (un peu moins vite) là tự do hơn và chậm hơn một chút; Deux Arabesques in lần đầu năm 1891 (Durand et Schoenewerk), 1904 là bản khắc lại của Durand & Fils, Debussy mất năm 1918.'
