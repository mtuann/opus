    luot_2_ghi_chu: "OMT (Other Rhythmic Essentials): 'A triplet is a type of tuplet in which a beat ... in simple meter is divided into three parts'. Phần 3 chọi 2 là phép tính: chùm ba ở 0, 1/3, 2/3 phách; móc đơn ở 0, 1/2: nốt 2 của chùm ba trước, nốt 3 sau nốt thứ hai của tay kia; khoảng cách 2/6, 1/6, 1/6, 2/6 = dài–ngắn–ngắn–dài."
