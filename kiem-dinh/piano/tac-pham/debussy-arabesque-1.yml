    ghi_chu: 'Ô 6–9, 4/4, K:E. Ấn bản: durand-1904 tr. 1 hệ 2 ô 3–4 và hệ 3 ô 1–2, đọc ở 300–350 dpi. Ô 6: tay phải lặng đen, chùm ba Mi5–Fa♯5–Đô♯5, Mi5–Si4–Đô♯5, Sol♯4–Si4–Fa♯4 (có số 3); tay trái pp, móc đơn Mi2–Si2–Mi3–Sol♯3–Si3–Sol♯3–Mi3–Si2. Ô 7: tay phải chùm ba Sol♯4–Mi4–Sol♯4 (bản in không in số 3, nhưng ô đủ 4 phách chỉ khi là chùm ba; Mutopia "gs8*2/3 e gs"), Rê♯4 trắng, Đô♯4 đen; tay trái Mi2–Đô♯3–Mi3–Sol♯3–Đô♯4–Sol♯3–Mi3–Si2. Ô 8: tay phải Si3 móc đơn, lặng móc đơn, ba chùm ba như ô 6; tay trái như ô 6. Ô 9: như ô 7. Đối chiếu Mutopia rhUpE ô 6–9 và lhUpE "e,8(\pp b, e gs b gs e b,)", "e,8( cs e gs cs'' gs e b,)": khớp. Bỏ: vòng luyến (tay phải ô 6–7 và 8–9, tay trái mỗi ô), chữ "a Tempo". Review (Claude, 17/11/2026): Sửa: đo dòng kẻ và đầu nốt bằng máy ở 600 dpi (tr. 1, khuông dưới khóa Fa: La3=100, Fa3=138, Rê3=175, Si2=213, Sol2=250 px ở hệ 2; hệ 3: 148/185/223/261/298): nốt cuối tay trái ô 6 ở 212 (Si2) và ô 8 ở 264 (Si2), nhưng ô 7 ở 192 và ô 9 ở 240, đúng khe Đô3 như nốt thứ hai của chính ô ấy (191, 242): Đô♯3, không phải Si2. Mutopia ghi b, ở cả ô 7 và 9 ("e,8( cs e gs cs'' gs e b,)"), lượt 1 và lượt 2 theo Mutopia. Bản quét là ấn bản đối chiếu nên sửa abc: ô 7, 9 tay trái "E,,C,E,G, CG,E,C,". Phần còn lại (tay phải ô 6–9, tay trái ô 6, 8, pp) đọc lại ở 400 dpi: khớp.'
