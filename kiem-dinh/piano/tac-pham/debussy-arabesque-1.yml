    cau: 'Các link: Clair de lune, Hai tay (#hai-choi-ba), hợp âm rải (#hop-am-rai), bàn đạp (#cac-kieu-ap-khac, #debussy), Préludes quyển 1 (nghe-nhac/debussy-preludes), Thế kỷ 20 (#cac-huong-chinh), thu âm; trang Thế kỷ 20 xếp Debussy vào trường phái Ấn tượng.'
