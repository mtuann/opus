  - id: n31
    cau: 'Đoạn giữa ghi Tempo rubato (un peu moins vite); un peu moins vite là tiếng Pháp, "chậm hơn một chút"; rubato là co giãn tốc độ để diễn cảm.'
    loai: dinh-nghia
    nguon: [ durand-1904, larousse, site-du-lieu ]
    ket_qua: dung
    ghi_chu: 'Bản quét tr. 3 hệ 1: "Tempo rubato (un peu moins vite)". Larousse: un peu moins = a little less; moins vite = slow down, not so fast. Thuật ngữ rubato: "Co giãn tốc độ tự do để diễn cảm".'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsr2.htm", "https://www.dolmetsch.com/defsm2.htm", "https://www.dolmetsch.com/defsu1.htm", "https://www.mutopiaproject.org/ftp/DebussyC/L66/debussy_Arabesque_1/debussy_Arabesque_1.ly" ]
    luot_2_ghi_chu: "Dolmetsch: tempo rubato 'a limited freedom of rhythm and tempo'; un peu = a little; moins vite = less fast, slower. Bản quét Durand & Fils 1904 (IMSLP #255354, file đã tải ở _imslp/, xem 5 trang) ô 39 ghi 'Tempo rubato (un peu moins vite)'."
    review: dung
  - id: n32
    cau: 'Bản Durand 1904 không ghi ký hiệu bàn đạp.'
    loai: cau-truc
    nguon: [ durand-1904, mutopia ]
    ket_qua: dung
    ghi_chu: 'Đọc cả 5 trang: không có Ped., dấu * hay đường bàn đạp. Mutopia: voice "pedal" rỗng, không có \sustainOn. Review (Claude, 17/11/2026): xem lại tr. 1, 3, 4, 5 ở 90 dpi: không có Ped. hay dấu nhả: khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/DebussyC/L66/debussy_Arabesque_1/debussy_Arabesque_1.ly" ]
    luot_2_ghi_chu: "Bản quét Durand & Fils 1904 (IMSLP #255354, file đã tải ở _imslp/, xem 5 trang): xem hết 5 trang của bài số 1, không có Ped. hay dấu nhả bàn đạp. Mutopia cũng không có bàn đạp (voice pedal rỗng)."
    review: dung
  - id: n33
    cau: 'Lời khuyên tập (Vì sao nên học, cột Cách tập, Kế hoạch tập, Tốc độ, Bàn đạp, Lỗi thường gặp): đọc riêng chỗ đổi hóa biểu, tay trái nhỏ hơn tay phải, tập đều trước rồi mới co giãn, về tốc độ cũ ở a Tempo, bàn đạp đổi theo hòa âm của tay trái, nửa bàn đạp để giữ nốt trầm, kế hoạch 8 tuần 30–40 phút mỗi ngày với tốc độ gợi ý ♩ = 40 tới khoảng 92, tốc độ tuần 8 là đích.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Nửa bàn đạp viết như trang piano/ban-dap (mục Các kiểu đạp khác, mục Debussy: "Nửa bàn đạp và đổi một phần: thử làm sạch âm vực cao mà vẫn giữ nốt trầm"). Tốc độ là gợi ý, trang ghi rõ bản nhạc không có số máy đếm nhịp. Review (Claude, 17/11/2026): Sửa theo ghi chú lượt 2: bản thu Prati, mốc ô 6 ở 15,3 s và ô 13 ở khoảng 33 s, 7 ô (28 phách) trong khoảng 17,7 s: ♩ ≈ 95; cả bài 2,4–288,4 s cho 106,5 ô (426 phách): ♩ ≈ 89 trung bình. Tốc độ tuần 7 nâng từ 60–72 lên 66–80, tuần 8 từ ≈ 66–80 lên ≈ 80–92, thêm câu "Tốc độ tuần 8 là đích; chưa tới được thì giữ tốc độ chậm hơn mà đều". Mục Diễn tấu (Tốc độ) không nêu số nên vẫn nhất quán. Lời khuyên hợp lý, không có hại.'
    luot_2: dung
    luot_2_ghi_chu: "Hợp lý, không có hại. Lưu ý: bản thu trên trang chơi chủ đề khoảng ♩ = 95 (ô 6–13: 7 ô trong 17,7 s; cả bài trung bình ♩ ≈ 89), nên 'tốc độ cuối ♩ ≈ 66–80' chậm hơn hẳn bản thu; có thể ghi rõ đây là mức đích cho người học, hay nâng lên khoảng 80–90."
    review: dung
  - id: n34
    cau: 'Ba bài tập chuẩn bị (khối 3–5) soạn cho trang này: hai chọi ba trên hợp âm Mi trưởng, hợp âm rải chia hai tay, chùm ba rồi móc đơn trong một tay; lời kèm mỗi bài.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khuông ở khuong_nhac khối 3–5. Review (Claude, 17/11/2026): ba khối soạn đọc lại (xem khuong_nhac khối 3–5): nhịp đủ, hòa âm Mi trưởng và Si bảy (Fa♯ La Si Rê♯), số ngón chơi được, lời kèm đúng điều khối cho thấy.'
    luot_2: dung
    luot_2_ghi_chu: "Xem ba khối: bài 1 (2/4) tay phải chùm ba Mi–Sol♯–Si trên móc đơn Mi–Si; bài 2 rải chia hai tay theo hình ô 1; bài 3 hai phách chùm ba rồi hai phách móc đơn, tay trái đen đều. Đúng điều lời kèm nói, ngón bấm chơi được."
    review: dung
