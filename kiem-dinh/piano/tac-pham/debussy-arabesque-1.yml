    ket_qua: dung
    ghi_chu: 'Thuật ngữ triplet: "Chùm ba: chia một phách nhịp đơn thành ba phần". Trang hai-tay, lưới 6: tay chơi ba ở 1, 3, 5; tay chơi hai ở 1, 4 (nốt 3 trước 4, nốt 5 sau 4); hình chung dài – ngắn – ngắn – dài.'
