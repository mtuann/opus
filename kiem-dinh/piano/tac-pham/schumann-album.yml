    ghi_chu: 'chưa chắc: nghĩa đúng ("nicht schnell" = không nhanh), nhưng không chắc Schumann ghi chỉ dẫn này ở số 1. Bản Peters trên Mutopia ghi "pas vite" (bản Pháp của Nicht schnell); hai bản in đọc được trên Internet Archive (Schuberth 1867 bản Klauser; một bản in không ghi tên) để trống chỉ dẫn tốc độ ở Melodie, trong khi số 3, số 5 (cùng bản) ghi "Nicht schnell". Chưa xem được bản in đầu hay Henle (PDF IMSLP bị chặn; lời tựa và Bemerkungen của Henle không nói tới). Đề nghị người giao quyết: (a) giữ nếu Henle/bản in đầu có "Nicht schnell"; (b) không có thì viết "Schumann không ghi chữ chỉ tốc độ; nhiều ấn bản (như Peters) thêm Nicht schnell / pas vite (không nhanh)", sửa theo câu hỏi 2 (n70), dòng Giọng · nhịp · tốc độ của bản ghi (hồ sơ bản ghi du-lieu/tac-pham/schumann-album n19).'
