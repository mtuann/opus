ghi_chu: 'Bài học ba tiểu phẩm Op. 68 số 1, 8, 10 (tầng Tác phẩm). Không có trích đoạn: ba khối abc là ví dụ soạn. Bản nhạc: Mutopia 647, 655, 659 (Peters, CC BY-SA 2.5; tựa và chỉ dẫn tiếng Pháp), thêm hai bản in trên Internet Archive (Schuberth 1867 bản Klauser; một bản không ghi tên) để xem chỉ dẫn tốc độ tiếng Đức. Lịch sử: lời tựa và Bemerkungen của Henle HN 45 (Herttrich 2007), PDF tải từ trang sản phẩm. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/schumann-album. Hai mục doi_chu đầu (chip cấp độ, dòng Độ khó) do người giao ghi, giữ nguyên. Sửa trang: n47, n78; bỏ: n64. Chưa chắc: n56, n72 (Nicht schnell ở Melodie).'
