    cau: Link "thời kỳ Lãng mạn" (/opus/lich-su/thoi-ky/lang-man/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: Trang đích src/content/docs/lich-su/thoi-ky/lang-man.md có.
  - id: n31
    cau: Phần một của album gồm số 1–18.
    loai: cau-truc
    nguon:
      - imslp-op68
    ket_qua: dung
    ghi_chu: 'IMSLP: Erste Abteilung (für Kleinere) số 1–18.'
  - id: n32
    cau: 'Cách nghe: nghe trọn phần một, rồi nghe riêng ba bài mỗi bài ít nhất ba lần với các câu hỏi; so sánh tốc độ các bản thu.'
    loai: khuyen-tap
    nguon: []
