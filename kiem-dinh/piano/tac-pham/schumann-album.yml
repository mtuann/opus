  - id: n33
    cau: Link "hướng dẫn nghe Kinderszenen" (/opus/nghe-nhac/schumann-kinderszenen/), trang viết về tuổi thơ cho người lớn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển; site cũ ../opus-zero/docs/nghe-nhac/schumann-kinderszenen.md có ("Schumann: Kinderszenen (Cảnh tuổi thơ), Op. 15"). Điều cần giữ: hướng dẫn nghe Kinderszenen Op. 15.'
  - id: n34
    cau: 'Số 1 Melodie, câu a (vang hai lần): giai điệu legato ở tay phải trên lớp móc đơn đều của tay trái, mỗi hơi hai ô; câu dừng lơ lửng.'
    loai: cau-truc
    nguon: &id002
      - mutopia-647
    ket_qua: dung
    ghi_chu: 'Mutopia: \repeat volta 2 ô 1–4; dấu luyến e4( d c b | a8 c b d c4 g) (hai ô); ô 4 kết trên hợp âm Sol (b <fis a> g trên d g c, d b d g,): kết nửa.'
