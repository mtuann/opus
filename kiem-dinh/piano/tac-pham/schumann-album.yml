nhan_dinh:
  - id: n1
    cau: Năm 1848, Schumann viết cho các con mình 43 bản nhạc ngắn (Album für die Jugend).
    loai: nam
    nguon:
      - henle-hn45-vorwort
      - imslp-op68
    ket_qua: dung
    ghi_chu: 'Henle: quà sinh nhật Marie 1/9/1848, phần lớn viết trong tháng 9/1848; IMSLP: 43 pieces, Year/Date of Composition 1848.'
  - id: n2
    cau: Tập nhạc đến nay vẫn là một trong những cánh cửa đẹp nhất để bước vào âm nhạc Lãng mạn.
    loai: khuyen-tap
    nguon:
      - henle-hn45-vorwort
    ket_qua: khong-can-nguon
    ghi_chu: Nhận xét giới thiệu; Henle gọi là "eine der populärsten Sammlungen von Klavierstücken überhaupt".
  - id: n3
    cau: Trang này chọn ba bài nền tảng (Melodie, Wilder Reiter, Fröhlicher Landmann), kèm ghi chú nhanh về hai bài nữa.
    loai: ve-site
    ket_qua: dung
    ghi_chu: Trang có mục Cấu trúc, Diễn tấu cho ba bài số 1, 8, 10 và mục "Hai bài nên học kèm" (số 2, số 16).
  - id: n4
    cau: Schumann không viết bài tập mà viết những tiểu phẩm có tên gọi, có nhân vật, có cảm xúc.
    loai: ten
    nguon:
      - imslp-op68
    ket_qua: dung
    ghi_chu: 'IMSLP: mỗi bài có tên (Melodie, Soldatenmarsch, Wilder Reiter, Fröhlicher Landmann…). Vế "mỗi bài dạy một kỹ năng" là lời khuyên.'
  - id: n5
    cau: Melodie dạy hát legato trên lớp đệm nhẹ; Wilder Reiter dạy staccato và chuyển giai điệu từ tay phải sang tay trái; Fröhlicher Landmann dạy để tay trái hát, rồi bắt một tay vừa hát vừa đệm.
    loai: cau-truc
    nguon:
      - mutopia-647
      - mutopia-655
      - mutopia-659
    ket_qua: dung
    ghi_chu: 'Mutopia: số 1 tay phải nốt đen có luyến trên móc đơn tay trái; số 8 staccato, đoạn B giai điệu ở tay trái; số 10 giai điệu tay trái ô 1–8, ô 9–10 tay phải hai bè (giai điệu trên, hợp âm dưới).'
  - id: n6
    cau: 'Câu nhạc dài, sắc thái có ý nghĩa, tiếng đàn có màu: những điều sẽ cần cho Chopin và Schumann về sau.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n7
    cau: Mỗi bài chỉ dài khoảng một phút.
    loai: so-lieu
    nguon:
      - imslp-op68
    ket_qua: dung
    ghi_chu: 'Bản thu Mississippi College trên IMSLP (file của site): số 1 66,5 s; số 8 29,8 s (không nhắc lại A); số 10 41,7 s (ffprobe). "Khoảng một phút" là đầu trên; không bài nào dài hơn.'
  - id: n8
    cau: Ba bài liền nhau thành một nhóm nhỏ đủ cho một buổi chơi đàn ở nhà.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n9
    cau: 'Ngày 31 tháng 8 năm 1848, Schumann ghi trong sổ chi tiêu gia đình: "ý tưởng về album cho trẻ em, những bản nhỏ cho Marie".'
    loai: lich-su
    nguon: &id001
      - henle-hn45-vorwort
    ket_qua: dung
    ghi_chu: 'Henle: "Im sogenannten Haushaltbuch Schumanns … unter dem Datum 31. August …: „Idee d. Kinderalbum''s – Stückchen f. Marie.“"'
  - id: n10
    cau: Ngày 1 tháng 9 (1848) là sinh nhật lần thứ bảy của Marie, con gái lớn của Robert và Clara Schumann; quà của bố là một tập bài nhỏ chép tay.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: "ein Geburtstagsgeschenk Schumanns für sein ältestes Kind, die Tochter Marie – ein kleines Notenheft mit „Stückchen für''s Clavier / Zu Marie''chens 7tem Geburtstag / den 1sten September 1848 / gemacht vom Papa.“"'
  - id: n11
    cau: Những ngày tiếp theo Schumann ghi "rất nhiều bản nhỏ cho trẻ em", đến 9 tháng 9 thì album "gần xong"; vài bài còn được viết thêm trong tháng 9.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: 3., 4., 5. September „Viele Kinderstükchen“; 9. September „das Album zieml.[ich] beendigt“; 10.–12. và 19. September thêm „neue Stükchen“, „vier Kinderstükchen“.'
  - id: n12
    cau: Schumann định đặt tên Weihnachtsalbum für Kinder (Album Giáng sinh cho trẻ em) để in kịp Giáng sinh.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: "Da der Titel Weihnachtsalbum für Kinder lauten sollte, drängte er auf ein Erscheinen noch im Dezember des Jahres."'
  - id: n13
    cau: Nhà Breitkopf & Härtel từ chối in; Julius Schuberth ở Hamburg nhận lời.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: Breitkopf & Härtel "konnte sich … nicht zu einer Herausgabe des Werkes entschließen. Schumann wandte sich daraufhin an den Hamburger Verleger Julius Schuberth"; thư Schuberth 13/10: "Gut, ich behalte blindlings das Manuscript".'
  - id: n14
    cau: Schuberth đề nghị bỏ chữ "Giáng sinh" để tập nhạc bán được quanh năm.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: "Der Titel Weihnachtsalbum war auf Wunsch von Schuberth weggefallen, damit … das Album sich „ewig & täglich“ absetzen lasse."'
  - id: n15
    cau: Bản in đầu tiên ra tháng 12/1848.
    loai: nam
    nguon:
      - henle-hn45-bemerkungen
    ket_qua: dung
    ghi_chu: 'Henle Bemerkungen: "E1 Erstausgabe. Hamburg, Schuberth & Comp., Plattennummer 1232, erschienen im Dezember 1848." (IMSLP ghi năm in đầu 1849, theo bản 1849; Henle gần nguồn hơn.)'
  - id: n16
    cau: Bản in đầu có tranh bìa trong của họa sĩ Ludwig Richter, bốn góc vẽ bốn mùa.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: Richter "erklärte, eine Titelzeichnung zu entwerfen… Die vier Eck-Vignetten stellen … die vier Jahreszeiten dar"; "Richters Titelzeichnung wurde nur für den Innentitel verwendet."'
  - id: n17
    cau: Trang bìa ghi nhầm "40 bản nhạc" dù tập có đủ 43 bài.
    loai: lich-su
    nguon:
      - henle-hn45-vorwort
      - henle-hn45-bemerkungen
    ket_qua: dung
    ghi_chu: 'Henle: "Beide Titelseiten enthalten die Angabe „40 Clavierstücke“. Tatsächlich umfasste diese erste Auflage aber bereits die selben 43 Stücke"; Bemerkungen: "Titel: 40 [recte: 43] / Clavierstücke".'
  - id: n18
    cau: Trong vòng một năm, nhà xuất bản quảng cáo đã bán gần 2.000 bản.
    loai: so-lieu
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: quảng cáo của Schuberth trên Signale für die musikalische Welt (8/1850): "binnen Jahresfrist … eine Auflage von nahe an 2000 Exempl. Absatz gefunden hat".'
  - id: n19
    cau: 'Trong một lá thư năm 1848, Schumann phân biệt: Kinderszenen là hồi tưởng của người lớn, viết cho người lớn; album mới hướng về phía trước, dành cho các em nhỏ.'
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: thư gửi Carl Reinecke 6/10/1848: "Von den Kinderscenen unterscheiden sie sich durchaus. Diese sind Rückspiegelungen eines älteren und für ältere, während das Weihnachtsalbum mehr Vorspiegelungen, Ahnungen, zukünftige Zustände für Jüngere enthält".'
  - id: n20
    cau: Kinderszenen (Cảnh tuổi thơ) viết năm 1838.
    loai: nam
    nguon:
      - imslp-op15
    ket_qua: dung
    ghi_chu: 'IMSLP: Year/Date of Composition 1838.'
  - id: n21
    cau: Phần hai của album khó hơn và mang nhiều màu sắc người lớn hơn.
    loai: lich-su
    nguon:
      - imslp-op68
    ket_qua: dung
    ghi_chu: 'IMSLP: hai phần "Erste Abteilung (für Kleinere)" và "Zweite Abteilung (für Erwachsenere)". Henle xếp các bài phần hai ở mức khó cao hơn (trang HN 45, Levels of Difficulty).'
  - id: n22
    cau: Bài số 28, Erinnerung (Kỷ niệm), ghi ngày 4 tháng 11 năm 1847, ngày Mendelssohn qua đời.
    loai: lich-su
    nguon:
      - imslp-op68
      - henle-hn45-bemerkungen
      - imslp-mendelssohn
    ket_qua: dung
    ghi_chu: 'IMSLP: "28. Erinnerung (4 November 1847)". Henle Bemerkungen: tựa ở Stichvorlage "Zur Erinnerung an Felix Mendelssohn Bartholdy / gest. d. 4ten November 1847". IMSLP Mendelssohn: mất 4/11/1847.'
  - id: n23
    cau: Cùng thời gian đó, Schumann viết Musikalische Haus- und Lebensregeln, một chuỗi câu ngắn gửi người học nhạc.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: phần lớn Regeln đã có trong tập phác thảo của album (1848), Schumann sắp xếp và chép sạch mùa thu 1849.'
  - id: n24
    cau: Haus- und Lebensregeln được in trên Neue Zeitschrift für Musik năm 1850, rồi in kèm album từ lần in thứ hai (12/1850).
    loai: nam
    nguon:
      - henle-hn45-vorwort
      - ws-regeln
    ket_qua: dung
    ghi_chu: 'Henle: "schon am 28. Juni 1850 als Beilage Nr. 36 zur NZfM erschienen"; "in die Neuauflage vom Dezember 1850 aufgenommen". Wikisource ghi Beilage zu Nr. 36 (3. Mai 1850): hai nguồn lệch ngày, cùng năm 1850, trang chỉ ghi năm.'
  - id: n25
    cau: Ấn bản năm 1859 in Haus- und Lebensregeln ba thứ tiếng; bản tiếng Pháp do Franz Liszt dịch.
    loai: lich-su
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Henle: "In einer 1859 herausgebrachten Auflage … in einer dreisprachigen Version … die französische Übersetzung stammt von keinem Geringeren als Franz Liszt".'
  - id: n26
    cau: '"Spiele im Takte!" Chơi đúng nhịp! Lối chơi của một số virtuoso giống như dáng đi của người say.'
    loai: lich-su
    nguon:
      - ws-regeln
    ket_qua: dung
    ghi_chu: 'Wikisource: "Spiele im Takte! Das Spiel mancher Virtuosen ist wie der Gang eines Betrunkenen."'
  - id: n27
    cau: '"Schleppen und Eilen sind gleich große Fehler." Kéo lê và chạy vội là hai lỗi lớn ngang nhau.'
    loai: lich-su
    nguon:
      - ws-regeln
    ket_qua: dung
    ghi_chu: 'Wikisource (bản NZfM 1850): "Schleppen und eilen sind gleich große Fehler." Chỉ khác chữ hoa ở "eilen"; không sửa (các bản in sau viết hoa danh từ hóa "Eilen"; không đổi nghĩa).'
  - id: n28
    cau: Hãy cố chơi những bài dễ thật hay và đẹp; như thế tốt hơn chơi bài khó một cách tầm thường.
    loai: lich-su
    nguon:
      - ws-regeln
    ket_qua: dung
    ghi_chu: 'Wikisource: "Bemühe dich, leichte Stücke gut und schön zu spielen; es ist besser, als schwere mittelmäßig vorzutragen."'
  - id: n29
    cau: '"Es ist des Lernens kein Ende." Việc học không bao giờ kết thúc.'
    loai: lich-su
    nguon:
      - ws-regeln
    ket_qua: dung
    ghi_chu: 'Wikisource: câu cuối "Es ist des Lernens kein Ende."'
