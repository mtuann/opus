khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
      - chang
    ket_qua: dung
    ghi_chu: 'Hát trên lớp đệm móc đơn: 4/4, Đô trưởng, 4 ô đủ 8 móc đơn. Tay phải E5 D5 C5 E5 | F5 G5 F5 E5 | D5 F5 E5 D5 | C5, thế Đô năm ngón (3-2-1-3 | 4-5-4-3 | 2-4-3-2 | 1). Tay trái hợp âm rải C3 G3 E3 G3 (5-1-3), F3 C4 A3 C4 (5-1-2), G2 F3 D3 F3 (5-1-3, quãng 7 thứ chơi được), C3 G3 E3 G3 rồi hợp âm Đô. Hòa âm I – IV – V7 – I, giai điệu khớp (Sol ô 2, Mi ô 3 là nốt qua). Đỉnh câu Sol5 ở ô 2 khớp lời dẫn. Kết cấu như Melodie (giai điệu nốt đen trên móc đơn). Hợp chặng 2.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
      - chang
    ket_qua: dung
    ghi_chu: 'Staccato và giai điệu đổi tay: 6/8, La thứ, 5 ô đủ 6 móc đơn. Ô 1–2 tay phải A4 C5 E5 A5 E5 C5 | E5 D5 C5 B4 (1-2-3-5, 4…) trên tay trái A2+E3, G♯2+E3 (i – V); ô 3–4 tay trái F2 A2 C3 F3 C3 A2 | C3 B♭2 A2 G2 (5-3-2-1-2-3, 2-3-4-5) = đúng giai điệu ô 1–2 dời sang Fa trưởng, tay phải [A C], [E G] (Fa, Đô bảy) rồi hợp âm Fa ô 5. Khớp lời dẫn n52 và đoạn B của số 8 (Mutopia 655). Hợp chặng 2.'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
      - chang
    ket_qua: dung
    ghi_chu: 'Hát và đệm trong cùng một tay: 4/4, Fa trưởng, 4 ô đủ phách (chồng bè "&": bè trên nốt trắng ngón 5, bè dưới z + hai hợp âm móc đơn staccato + z). Bè trên C5 D5 | C5 B♭4 | A4 G4 | F4; hợp âm dưới F4+A4, F4+B♭4 | F4+A4, E4+G4 | C4+F4, B♭3+E4 | A3+C4: tầm tay rộng nhất một quãng 6 (B♭3 – G4), chơi được bằng 1-3 và 5. Tay trái F3 B♭2 | F3 C3 | F3 C3 | F2. Hòa âm I – IV | I – V7 | I – V7 | I, khớp. Đúng kết cấu đoạn b số 10 (Mutopia 659: bè trên giai điệu, bè dưới hợp âm ngắn cùng tay phải). Hợp chặng 2.'
