nhan_dinh:
  - { id: n1, cau: 'Bartók viết sáu điệu múa này cho piano năm 1915.', loai: nam, nguon: [ henle-hn1402 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)", "https://www.henle.de/en/Romanian-Folk-Dances/HN-1402" ], luot_2_ghi_chu: "IMSLP (wikitext qua API): Year/Date of Composition=1915, Instrumentation=piano, 6 dances. Henle HN 1402: 'composed in 1915'." }
  - { id: n2, cau: 'Mỗi điệu dựng trên một giai điệu múa dân gian của người Romania; bản in ghi nơi tìm thấy từng giai điệu.', loai: lich-su, nguon: [ ue-1918 ], ket_qua: dung, ghi_chu: 'Tựa "Rumänische Volkstänze aus Ungarn"; chân trang mỗi điệu: "aus / lelőhelye / din: <làng> (<hạt>)".', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét UE 1918 (file tải tay): tựa 'Rumänische Volkstänze aus Ungarn', trang bìa trong 'gyűjtötte és zongorára két kézre átírta' (sưu tầm và soạn cho piano); mỗi điệu có chú thích chân trang 'aus / lelőhelye / din: <làng> (<hạt>)' (tr. 2, 4, 6, 7, 8)." }
  - { id: n3, cau: 'Sáu điệu chơi liền thành một tổ khúc khoảng năm phút; hai điệu cuối nhanh nhất.', loai: so-lieu, nguon: [ ue-1918, breemer-ban-thu ], ket_qua: dung, ghi_chu: 'Bản thu 5:22 kể cả lặng đầu, cuối. Số máy đếm nhịp: 80, 144, 112, 100, 152, 152→160.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "Bản quét: số máy đếm nhịp 80, 144, 112, 100, 152, 152 → Più allegro 160; hai điệu cuối nhanh nhất. Bản thu Breemer dài 322,0 s, phần nhạc từ 2,6 s tới 318,3 s (ffmpeg silencedetect), tức khoảng năm phút." }
  - { id: n4, cau: 'Đây là một trong những tác phẩm nổi tiếng nhất của Bartók.', loai: lich-su, nguon: [ henle-hn1402 ], ket_qua: dung, ghi_chu: 'Henle: "are among his best-known works".', luot_2: dung, luot_2_nguon: [ "https://www.henle.de/en/Romanian-Folk-Dances/HN-1402" ], luot_2_ghi_chu: "Henle: 'Bartók’s Romanian Folk Dances, composed in 1915, are among his best-known works.'" }
  - { id: n5, cau: 'Trang ở chặng 5 của lộ trình.', loai: ve-site, ket_qua: dung, ghi_chu: 'chang: 5 trong bản ghi; trang piano/tac-pham-theo-cap (đã khóa) cũng xếp ở chặng 5. Review (Claude Opus, 17/11/2026): chang: 5 ở bản ghi (src/data/tac-pham.yml); piano/tac-pham-theo-cap (đã khóa trong khoa.json) xếp Romanian Folk Dances ở mục "Chặng 5. Trung cấp cao (≈ Grade 6)".', review: dung }
  - { id: n6, cau: 'Điệu 3 có trong đề cương ABRSM Grade 4, điệu 4 trong danh sách Trinity Grade 5.', loai: cap-do, nguon: [ abrsm-1516-g4, trinity-2023 ], ket_qua: dung, ghi_chu: 'ABRSM 2015 & 2016 Grade 4 List C 4; Trinity từ 2023 Grade 5 số 9 (ô 1–18, không nhắc lại).', luot_2: dung, luot_2_nguon: [ "https://web.archive.org/web/2015/http://gb.abrsm.org/fileadmin/user_upload/syllabuses/piano0415.pdf", "https://www.trinitycollege.com/qualifications/music/grade-exams/piano/piano-grade-5" ], luot_2_ghi_chu: "ABRSM Piano 2015 & 2016, Grade 4, List C số 4: 'Bartók Der Stampfer (Topogó; Pe loc): No. 3 from Rumänische Volkstänze (Universal UE 5802)'. Trinity Grade 5 (from 2023) số 9: 'Dance of Buchum (bars 1-18 only, with no repeat)', Romanian Folk Dances, Henle HN1402 (Henle: Dance of Buchum = BB 68,4, điệu 4)." }
  - { id: n7, cau: 'Từ năm 1906, Bartók đi nhiều chuyến về nông thôn để ghi lại dân ca.', loai: lich-su, nguon: [ henle-hn1225-vorwort ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://bartok-gyujtesek.zti.hu/en" ], luot_2_ghi_chu: "Bartók Archívum (ZTI): 'Bartók’s first year of substantial folk song collection was 1906' (trước đó 1904–1905 chỉ ghi vài giai điệu); năm 1906 ghi hơn 1.000 bài Hungary và khoảng 300 bài Slovak; các chuyến đi kết thúc sau Thế chiến I. Henle ghi 'from 1905' bắt đầu nghiên cứu cùng Kodály; câu 'từ năm 1906 đi nhiều chuyến' khớp nguồn ZTI." }
  - { id: n8, cau: 'Universal Edition (Wien, Leipzig) in năm 1918 với tựa ba thứ tiếng: Rumänische Volkstänze aus Ungarn, Magyarországi népi román táncok, Jocuri poporale românești din Ungaria.', loai: ten, nguon: [ ue-1918 ], ket_qua: dung, ghi_chu: 'Tr. 2: "UNIVERSAL-EDITION A. G. WIEN Copyright 1918 by Universal-Edition LEIPZIG"; tr. 3: ba tựa. Nghĩa: điệu múa dân gian Romania ở Hungary.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)" ], luot_2_ghi_chu: "Bản quét tr. 2 (đầu bản nhạc): 'Rumänische Volkstänze aus Ungarn. / Magyarországi népi román táncok. / Jocuri poporale românești din Ungaria.'; bìa trong: 'Universal-Edition A. G. Wien Copyright 1918 … Leipzig'. IMSLP: Universal Edition, Vienna, 1918, U.E. 5802. (Bìa ngoài và bìa trong chỉ ghi tựa ngắn không có 'aus Ungarn'.)" }
  - { id: n9, cau: 'Bản in đề tặng giáo sư Ioan Bușiția.', loai: lich-su, nguon: [ ue-1918 ], ket_qua: dung, ghi_chu: 'Tr. 3: "Domnului Prof. Ioan Bușiția."', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét tr. 2, dòng trên cùng: 'Domnului Prof. Ioan Bușiția.'" }
  - { id: n10, cau: 'Về sau Bartók soạn thêm một bản cho dàn nhạc.', loai: lich-su, nguon: [ henle-hn1402 ], ket_qua: dung, ghi_chu: 'Henle: "a later orchestral version of his own".', luot_2: dung, luot_2_nguon: [ "https://www.henle.de/en/Romanian-Folk-Dances/HN-1402", "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)" ], luot_2_ghi_chu: "Henle: 'a later orchestral version of his own'. IMSLP: 'For the orchestral setting, see Romanian Folk Dances (orchestra), Sz.68'." }
  - { id: n11, cau: 'Bảng tên sáu điệu (Đức – Hungary – Romania), nghĩa, nơi tìm thấy: 1 Der Tanz mit dem Stabe – Bot-tánc – Jocul cu bâtă, Mezőszabad (Maros-Torda); 2 Brâul, Egres (Torontál); 3 Der Stampfer – Topogó – Pe loc, Egres (Torontál); 4 Tanz der Butschumer – Bucsumi tánc – Buciumeana, Bisztra (Torda-Aranyos); 5 Rumänische „Polka" – Román „polka" – „Poarga" românească, Belényes (Bihar); 6 Schnell-Tanz – Aprózó – Mănunțel, Belényes (Bihar), đoạn Più allegro Nyágra (Torda-Aranyos).', loai: ten, nguon: [ ue-1918, henle-hn1402 ], ket_qua: dung, ghi_chu: 'Đọc trên tiêu đề và chân trang từng điệu. Nghĩa đối chiếu tên tiếng Anh của Henle: Stick Dance, Sash Dance (brâu: dây thắt lưng), In One Spot (pe loc: tại chỗ; Stampfer, topogó: giậm chân), Dance of Buchum, Romanian Polka, Fast Dance.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Đối chiếu tiêu đề và chú thích chân trang bản quét: 1 'Der Tanz mit dem Stabe.– Bot-tánc.– Jocul cu bâtă', Mezőszabad (Maros-Torda) (tr. 2); 2 'Brâul', 3 'Der Stampfer.– Topogó.– Pe loc', cả hai Egres (Torontál) (tr. 4); 4 'Tanz der Butschumer.– Bucsumi tánc.– Buciumeana', Bisztra (Torda-Aranyos) (tr. 6); 5 'Rumänische „Polka“ – Román „polka“ – „Poarga“ românească', Belényes (Bihar) (tr. 7); 6 'Schnell-Tanz.– Aprózó.– Mănunţel', Belényes (Bihar), Più allegro có chú thích riêng Nyágra (Torda-Aranyos) (tr. 8). Khớp từng chữ. Phần 'nghĩa' không nằm trong câu nên không kiểm." }
  - { id: n12, cau: 'Link Thế kỷ 20 và For Children (một tập khác của Bartók trên site, dễ hơn nhiều).', loai: ve-site, ket_qua: dung, ghi_chu: 'For Children ở chặng 2; trang này chặng 5. Review (Claude Opus, 17/11/2026): lich-su/thoi-ky/the-ky-20 (đã khóa) có Bartók ở dòng "Dân tộc"; piano/tac-pham/bartok-for-children có thật, bản ghi chang: 2, tiêu đề "For Children, Sz. 42, số 1 và 6".', review: dung }
  - { id: n13, cau: 'Bản thu gợi ý là của Chris Breemer, đăng trên IMSLP, chơi liền cả sáu điệu.', loai: ten, nguon: [ imslp-sz56, breemer-ban-thu ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/991622", "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)" ], luot_2_ghi_chu: "IMSLP wikitext: File 'PMLP3387-bartok-romanian-folk-dances-breemer.mp3', 'Complete Performance', Performer Breemer, Chris (piano). File tải tay một file 322,01 s chứa cả sáu điệu (sáu đoạn nhạc tách bằng khoảng lặng, kiểm bằng ffmpeg)." }
  - { id: n14, cau: 'Điệu 1: Allegro moderato, 2/4, f, giai điệu tay phải trên hợp âm nhấn của tay trái; kết bằng sf poco allarg. Mốc 3 s.', loai: cau-truc, nguon: [ ue-1918, breemer-ban-thu ], ket_qua: dung, ghi_chu: 'Tr. 3–4. Mốc: hết lặng đầu 2,59 s.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "Bản quét tr. 2–3: Allegro moderato (♩=80), 2/4, không hóa biểu, f; giai điệu tay phải trên hợp âm có gạch ngang (tenuto) của tay trái; ô cuối 'sf poco allarg.' với sopra/sotto. Bản thu: nhạc bắt đầu 2,59 s (silencedetect −45 dB), mốc 3 s trong ±1 s." }
  - { id: n15, cau: 'Điệu 2: Allegro, 2/4, p, giai điệu móc đơn tách nhẹ trên nốt trầm và hợp âm ngắn; cả điệu nhắc lại. Mốc 76 s.', loai: cau-truc, nguon: [ ue-1918, mutopia-2162, breemer-ban-thu ], ket_qua: dung, ghi_chu: 'Tr. 5: "p", chấm dưới mọi móc đơn ô 1–2; vạch nhắc :|| cuối điệu. Mốc 76,25 s.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "Bản quét tr. 4: 'Brâul', Allegro (♩=144), 2/4, p; móc đơn có chấm staccato trên nốt trầm và hợp âm ngắn của tay trái; dấu nhắc lại ở cuối (không có dấu mở nhắc lại, nên nhắc cả điệu). Bản thu: khoảng lặng 72,97–76,25 s, điệu 2 vào 76,25 s; mốc 76 s đúng." }
  - { id: n16, cau: 'Điệu 3: Andante, 2/4, hai dấu thăng; tay trái mở pp một mình, phần lớn viết khóa Sol, lặp hình nốt trầm – nốt cao; giai điệu rất cao ở tay phải, nhiều nốt láy; kết ppp, smorzando. Mốc 111 s.', loai: cau-truc, nguon: [ ue-1918, breemer-ban-thu ], ket_qua: dung, ghi_chu: 'Tr. 5–6: ba ô đầu tay phải nghỉ; dấu láy trên nhiều nốt; ô cuối "ppp", "smorzando"; khóa Fa chỉ ở hàng cuối. Mốc 111,49 s.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "Bản quét tr. 4–5: Andante (♩=112), 2/4, hai dấu thăng; tay trái pp ba ô một mình, viết khóa Sol (chỉ chuyển khóa Fa ở bốn ô cuối), hình nốt trầm (quãng) rồi nốt cao nối luyến; tay phải p, rất cao (trên khuông, nhiều dòng kẻ phụ), nhiều nốt láy (dấu láy và nốt hoa mỹ); cuối 'ppp' rồi 'smorzando'. Bản thu: khoảng lặng 107,78–111,49 s; mốc 111 s đúng." }
  - { id: n17, cau: 'Điệu 4: Molto moderato, 3/4, không hóa biểu; tay trái mở p; giai điệu molto espressivo dùng thang La–Si♭–Đô♯–Rê (quãng hai tăng Si♭–Đô♯), sau đó mf più espr. Mốc 182 s.', loai: cau-truc, nguon: [ ue-1918, breemer-ban-thu ], ket_qua: da-sua, ghi_chu: 'Tr. 7: hai ô đầu tay phải nghỉ; ô 4–5 Đô♯ và Si♭ liền nhau (quãng hai tăng); "molto espr." ô 3, "mf più espr." hàng 3. Mốc 181,56 s. Review (Claude Opus, 17/11/2026): Bản quét tr. 6 (file tr. 7): giai điệu luôn đi Đô♯–La–Si♭–Rê (ô 5, 6, 10…), Si♭ và Đô♯ không bao giờ liền nhau; quãng hai tăng nằm trong thang La–Si♭–Đô♯–Rê. Câu ở đây (giai điệu có quãng hai tăng Si♭–Đô♯) chấp nhận được theo nghĩa thang âm; ghi_chu lượt 1 "ô 4–5 Đô♯ và Si♭ liền nhau" không đúng. Xem n27. Sửa sau review (17/11/2026): câu cũ "giai điệu … có quãng hai tăng Si♭–Đô♯" ngụ ý hai nốt liền nhau; trong bài giai điệu đi Đô♯–La–Si♭–Rê, quãng hai tăng nằm trong thang La–Si♭–Đô♯–Rê. Ghi chú lượt 1 "ô 4–5 Đô♯ và Si♭ liền nhau" là sai.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "Bản quét tr. 6: Molto moderato (♩=100), 3/4, không hóa biểu; tay trái p hai ô một mình; 'molto espr.' ở ô 3; giai điệu dùng Si♭ và Đô♯ (hình Đô♯–La–Si♭–Rê, thang La–Si♭–Đô♯–Rê); sau đó 'mf più espr.'. Bản thu: khoảng lặng 177,31–181,56 s; mốc 182 s trong ±1 s.", review: dung }
  - { id: n18, cau: 'Điệu 5: Allegro, nhịp 2/4 và 3/4 xen nhau, hai dấu thăng, f, nhiều nốt hoa mỹ; tay trái móc đơn nốt trầm – hợp âm tách; kết bằng sf, dấu ngân trên vạch kết. Mốc 227 s.', loai: cau-truc, nguon: [ ue-1918, breemer-ban-thu ], ket_qua: da-sua, ghi_chu: 'Tr. 8: 2/4 bốn ô đầu rồi 3/4, 2/4… nhiều lần. Mốc 227,03 s. Sửa theo ghi chú lượt 2: câu cũ "kết bằng một nốt có dấu ngân"; dấu ngân nằm trên vạch kết, ô cuối có sf. Review (Claude Opus, 17/11/2026): Bản quét tr. 7 (file tr. 8), ô cuối: nốt trắng có gạch ngang và sf ở cả hai tay, dấu ngân trên và dưới vạch kết; 2/4–3/4 đổi liên tục, hai thăng, f, nốt hoa mỹ gạch chéo, tay trái móc đơn nốt trầm – hợp âm chấm. Câu đã sửa đúng.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "Bản quét tr. 7: Allegro (♩=152), 2/4 và 3/4 đổi liên tục, hai dấu thăng, f; nốt hoa mỹ (gạch chéo) gần như mỗi phách; tay trái móc đơn nốt trầm – hợp âm có chấm staccato; ô cuối nốt trắng có gạch ngang (tenuto) và sf, dấu lặng ngân (fermata) trên vạch kết. Bản thu: khoảng lặng 223,53–227,03 s; mốc 227 s đúng.", review: dung }
  - { id: n19, cau: 'Điệu 6: Allegro, 2/4, hai dấu thăng, f, nhiều sf; sang Più allegro đổi sang một dấu thăng và nhanh hơn, có cresc. Mốc 260 s.', loai: cau-truc, nguon: [ ue-1918, breemer-ban-thu ], ket_qua: dung, ghi_chu: 'Tr. 9: "Più allegro (♩ = 160)", hóa biểu đổi; "cresc." hàng cuối tr. 9. Mốc 260,15 s (sau khoảng lặng ngắn 259,58–260,15).', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "Bản quét tr. 8–9: Allegro (♩=152), 2/4, hai dấu thăng, f, sf nhiều chỗ; 'Più allegro (♩=160)' với hóa biểu đổi thành một dấu thăng; có 'cresc.' (tr. 8 dòng cuối). Bản thu: điệu 5 tắt ở 259,6 s (RMS xuống −59 dB tại 260,0 s), điệu 6 vào 260,2 s (librosa RMS); mốc 260 s đúng." }
  - { id: n20, cau: 'Tốc độ bản in 1918: 1 Allegro moderato ♩ = 80; 2 Allegro ♩ = 144; 3 Andante ♩ = 112; 4 Molto moderato ♩ = 100; 5 Allegro ♩ = 152; 6 Allegro ♩ = 152, Più allegro ♩ = 160.', loai: so-lieu, nguon: [ ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét: 1 Allegro moderato (♩=80) tr. 2; 2 Allegro (♩=144), 3 Andante (♩=112) tr. 4; 4 Molto moderato (♩=100) tr. 6; 5 Allegro (♩=152) tr. 7; 6 Allegro (♩=152), Più allegro (♩=160) tr. 8." }
  - { id: n21, cau: 'Nhịp và hóa biểu: điệu 1, 2 nhịp 2/4 không hóa biểu; điệu 3 2/4 hai dấu thăng; điệu 4 3/4 không hóa biểu; điệu 5 2/4 và 3/4, hai dấu thăng; điệu 6 2/4, hai dấu thăng rồi một dấu thăng.', loai: cau-truc, nguon: [ ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét: điệu 1, 2: 2/4 không hóa biểu; điệu 3: 2/4 hai thăng; điệu 4: 3/4 không hóa biểu; điệu 5: 2/4 và 3/4, hai thăng; điệu 6: 2/4 hai thăng, Più allegro một thăng." }
  - { id: n22, cau: 'Điệu 1 có chỗ hai tay chồng lên nhau, bản in ghi sopra và sotto.', loai: cau-truc, nguon: [ ue-1918 ], ket_qua: dung, ghi_chu: 'Tr. 3 hàng 2, 4; tr. 4 hàng 3, 5.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét tr. 2–3: 'sopra' (tay phải) và 'sotto' (tay trái) ở các ô 7, 13 và ô cuối của điệu 1, nơi tay phải xuống chơi nốt dưới tay trái." }
  - { id: n23, cau: 'Trích đoạn điệu 2 ô 1–4 theo Universal Edition 1918, đối chiếu bản Mutopia; số ngón như bản in.', loai: cau-truc, nguon: [ ue-1918, mutopia-2162 ], ket_qua: dung, ghi_chu: 'Xem khuong_nhac khối 1. Review (Claude Opus, 17/11/2026): So khối 1 từng nốt với bản quét tr. 4 (file tr. 5) và Mutopia .ly: tay phải D4 E4 F4 G4 | A G D G | A(đen) A(móc đơn) lặng móc kép B(móc kép) luyến sang | A(trắng); tay trái D2 [F3 A3] | D2 [G3 B3] | D2 [A3 D4 F4] | [A3 D4 F4] trắng: khớp. Số ngón 1, 3 (tay phải), 5 (Rê trầm), chấm, p khớp bản in. Khối bỏ dấu ngoặc bàn đạp (bản in có ở ô 1, 2, 3–4): chấp nhận được với trích đoạn, nên ghi vào ghi_chu khối.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://raw.githubusercontent.com/MutopiaProject/MutopiaProject/master/ftp/BartokB/rom_folk_dance_1_bartok/rom_folk_dance_1_bartok.ly" ], luot_2_ghi_chu: "Không mở trang nên chỉ kiểm phía nguồn; review so khuông trong trang với chỗ này. Mutopia (thư mục rom_folk_dance_1_bartok, title 'Romanian Folk Dance No.2', mutopiasource 'Vienna: Universal Edition, 1918', Public Domain) ô 1–4 tay phải d' e' f' g' | a' g' d' g' | a'4 a'8 r16 b'16 | a'2; tay trái d,4 <f a> | d,4 <g b> | d,4 <a d' f'> | <a d' f'>2: khớp bản quét tr. 4. Mutopia không có số ngón, chấm staccato, p. Số ngón UE ô 1–4: tay phải 1 trên Rê (ô 1), 3 trên La móc đơn (ô 3); tay trái 5 trên Rê trầm, hợp âm 1-3 (ô 1), 1-2 (ô 2), 1-2-4 (ô 3).", review: dung }
  - { id: n24, cau: 'Quãng hai tăng giữa Si♭ và Đô♯ rộng hơn một quãng hai thường.', loai: dinh-nghia, nguon: [ omt-intervals ], ket_qua: dung, ghi_chu: 'Định nghĩa nhạc lý (Si♭–Đô♯: ba nửa cung, quãng hai tăng). Nguồn chính là định nghĩa quãng; Henle chỉ là nguồn bản nhạc. Lượt 2 kiểm bằng Open Music Theory. Review (Claude Opus, 17/11/2026): Định nghĩa đúng (Si♭–Đô♯ ba nửa cung). Nguồn lượt 1 chỉ có henle-hn1402, không phải nguồn định nghĩa; nên thêm vào nguon nguồn định nghĩa quãng (Open Music Theory, Intervals, như lượt 2, hay trang lõi nhac-ly/09-quang) trước khi khóa. Sửa sau review: nguồn định nghĩa đổi từ Henle sang Open Music Theory, Intervals.', luot_2: dung, luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ], luot_2_ghi_chu: "OMT, mục Augmented and Diminished Qualities: 'Augmented intervals are one half step larger than a perfect or major interval.' Si♭–Đô♯ là quãng hai tăng (3 nửa cung), rộng hơn quãng hai trưởng một nửa cung.", review: dung }
  - { id: n25, cau: 'Bản in ghi bàn đạp bằng dấu ngoặc dưới khuông, chú thích ở trang đầu: nhấn ở đầu ngoặc, nhả ở cuối.', loai: cau-truc, nguon: [ ue-1918 ], ket_qua: dung, ghi_chu: 'Tr. 3 chân trang: "Pedalgebrauch wird durch [ngoặc] bezeichnet: herabdrücken … loslassen".', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét tr. 2, chú thích **): 'Pedalgebrauch wird durch: └──┘ bezeichnet' với mũi tên 'herabdrücken / lenyomni / apasă' ở đầu ngoặc và 'loslassen / elengedni / lasă' ở cuối." }
  - { id: n26, cau: 'Điệu 2 dễ nhất theo mức Henle.', loai: cap-do, nguon: [ henle-hn1402 ], ket_qua: dung, ghi_chu: 'Henle: Sash Dance mức 2, các điệu khác 3–4.', luot_2: dung, luot_2_nguon: [ "https://www.henle.de/en/Romanian-Folk-Dances/HN-1402" ], luot_2_ghi_chu: "Henle: Stick Dance 3, Sash Dance (BB 68,2) 2, In One Spot 3, Dance of Buchum 3, Romanian Polka 4, Fast Dance 4; điệu 2 thấp nhất." }
  - { id: n27, cau: 'Câu hỏi 1–4 (sáu điệu; điệu 5 đổi nhịp; quãng hai tăng điệu 4; bản in ghi chữ và số máy đếm nhịp) và lời giải thích.', loai: cau-truc, nguon: [ ue-1918 ], ket_qua: da-sua, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Kiểm điều câu hỏi dựa vào: bản in có sáu điệu; điệu 5 đổi 2/4–3/4; điệu 4 có Si♭ và Đô♯; mỗi điệu ghi chữ tốc độ và số máy đếm nhịp trong ngoặc. Lời giải thích cụ thể không nằm trong câu được giao nên không đọc.", ghi_chu: 'Review (Claude Opus, 17/11/2026): Lời giải thích câu hỏi 3 ("Hai nốt liền nhau trong giai điệu cách nhau một quãng hai tăng") sai với bản quét tr. 6: giai điệu đi Đô♯–La–Si♭–Rê, Si♭ và Đô♯ không liền nhau; quãng hai tăng là giữa hai bậc liền nhau của thang La–Si♭–Đô♯–Rê. Câu hỏi khi nghe số 3 ("giữa hai nốt liền nhau trong giai điệu") sai cùng lý do. Phải sửa hai chỗ; các câu hỏi 1, 2, 4 và giải thích của chúng đúng. Sửa sau review: lời giải thích câu hỏi 3 và câu hỏi khi nghe số 3 viết lại theo thang La–Si♭–Đô♯–Rê (Si♭ và Đô♯ không đứng liền nhau trong giai điệu).', review: sai }
  - { id: n28, cau: 'Link Nốt hoa mỹ, Bàn đạp, Điệu thức, Tác phẩm theo cấp độ, Thu âm đúng trang.', loai: ve-site, ket_qua: dung, ghi_chu: 'Review (Claude Opus, 17/11/2026): Năm trang đích có trong src/content/docs (piano/not-hoa-my, piano/ban-dap, nhac-ly/16-dieu-thuc-ngu-cung, piano/tac-pham-theo-cap, luyen-tap/thu-am), đều đã khóa; bản xem không có chữ "sắp có" ở trang này; nội dung đích hợp chỗ trỏ.', review: dung }
  - { id: n29, cau: 'Vì sao nên học (sáu tính cách, từng điệu học riêng được) và câu hỏi khi nghe.', loai: khuyen-tap, nguon: [], ket_qua: khong-can-nguon, luot_2: dung, luot_2_ghi_chu: "khuyen-tap. Phần 'từng điệu học riêng được' khớp việc ABRSM, Trinity chọn riêng điệu 3, điệu 4 và Henle chấm mức từng điệu.", ghi_chu: 'Review (Claude Opus, 17/11/2026): Nhãn khuyen-tap đúng: không có điều về sức khỏe hay sự kiện cần nguồn (phần ABRSM, Trinity nằm ở n6).', review: dung }
  - { id: n30, cau: 'Bảng "Chỗ khó và cách tập" (sáu dòng).', loai: khuyen-tap, nguon: [], ket_qua: khong-can-nguon, ghi_chu: 'Nhấn bằng sức nặng cánh tay, cổ tay mềm: khớp các trang lõi piano; không có nội dung y khoa. Review (Claude Opus, 17/11/2026): Nhãn khuyen-tap đúng; "tay dễ cứng", "nhấn bằng sức nặng" là lời khuyên kỹ thuật, không phải lời khuyên sức khỏe.', luot_2: dung, luot_2_ghi_chu: "khuyen-tap: không thấy dấu hiệu sai hay có hại từ mô tả; hợp cách dạy phổ biến.", review: dung }
  - { id: n31, cau: 'Ba bài tập soạn riêng và lời dùng kèm; kế hoạch 6 tuần; diễn tấu (tốc độ, phát âm, bàn đạp); lỗi thường gặp.', loai: khuyen-tap, nguon: [], ket_qua: khong-can-nguon, luot_2: dung, luot_2_ghi_chu: "khuyen-tap: không thấy dấu hiệu sai hay có hại từ mô tả; hợp cách dạy phổ biến.", ghi_chu: 'Review (Claude Opus, 17/11/2026): Nhãn khuyen-tap đúng; câu "Bản in ghi bàn đạp…" đã tách thành n25. Lời bài tập 2 "Kiểu giai điệu của điệu 4" nên đổi thành "thang âm của điệu 4", vì bài tập đi thẳng Đô♯–Si♭ còn điệu 4 không (xem n27).', review: dung }
  - id: n32
    cau: "Học tiếp, cùng tác giả, khó hơn: Sonatina, viết cùng năm 1915 từ giai điệu múa dân gian Romania."
    loai: lich-su
    nguon: [ henle-hn1401 ]
    ket_qua: dung
    ghi_chu: "Henle HN 1401: Sonatina dùng giai điệu nhạc khí dân gian Romania, hình thành năm 1915; Romanian Folk Dances viết năm 1915 (n1). Hướng dẫn nghe (đã khóa) ghi cả ba tập \"Romania\" năm 1915 trong cùng bản thảo. \"Khó hơn\": chương 1 ABRSM Grade 7 (chặng 6), bài này chặng 5 (n5). Review (Claude, 17/11/2026): đúng; khớp hướng dẫn nghe nghe-nhac/bartok-sonatina (đã khóa): viết 1915 từ giai điệu múa dân gian Romania; \"khó hơn\": chương 1 chặng 6, bài này chặng 5."
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/Sonatina/HN-1401", "https://www.henle.de/Romanian-Folk-Dances/HN-1402", "https://www.henle.de/media/44/c9/ff/1697725864/1401-1697725864-sync.pdf" ]
    luot_2_ghi_chu: "Lời tựa Henle HN 1401 (Somfai): Colinde BB 67, Romanian Folk Dances BB 68 và Sonatina BB 69 phác gần như cùng lúc mùa xuân 1915 (có thể một phần từ 1914); Sonatina dựa trên giai điệu nhạc khí dân gian Romania, Bartók nói chương 1 'is a dance', chương 2 là Bear Dance; bản dàn nhạc 1931 tên Transylvanian Dances. HN 1402: Romanian Folk Dances 'composed in 1915'."
    review: dung
  - id: n33
