ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 3). Ấn bản: bản quét Universal Edition IMSLP #918136; đã kiểm là bản in trước 1934 theo ba dấu hiệu lộ trình nêu: không có "(1915)" sau ô cuối (tr. 10), dòng "Copyright 1918 by Universal-Edition" (tr. 2, 3), điệu 4 tên "Tanz der Butschumer"; không thấy ghi thời lượng. Trang không đếm số ô từng điệu (bản quét nhiều hàng, dễ đếm sai), chỉ nói điều đọc chắc. Khối 4 (bài tập đổi nhịp) khai M:none và ghi nhịp trong dòng vì tools/khuong-nhac.mjs chỉ dùng dòng M: cuối; đã đếm tay. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/bartok-romanian-folk-dances.'
