    ghi_chu: 'Ô 5–8, L:1/16, K:C#m. Ấn bản: Herrmann Scholtz qua Mutopia chopin_fantaisie-impromptu (.ly, .mid, tải 05/11/2026). Công cụ: script Python (mido) in nốt MIDI theo ô hai tay, đọc .ly cho sắc thái, luyến, bàn đạp. Kết quả 4/4 ô khớp cao độ và trường độ cả hai tay: tay phải ô 5–6 nghỉ móc kép rồi G♯4 A4 G♯4 F𝄪4 G♯4 C♯5 E5 D♯5 C♯5 D♯5 C♯5 B♯4 C♯5 E5 G♯5; ô 7 A4 C♯5 D♯5 F♯5 A5 C♯6 D♯6 B6 A6 G♯6 F♯6 E6 D♯6 F♯6 C♯6; ô 8 B♯5 D♯6 A5 G♯5 F♯5 A5 E5 D♯5 | F♯5 C♯5 B♯4 D♯5 A4 G♯4 B4 A4. Tay trái C♯3 G♯3 C♯4 E4 C♯4 G♯3 E3 G♯3 C♯4 E4 C♯4 G♯3 (ô 5–6), D♯3 A3 C♯4 F♯4 C♯4 A3 F♯3 C♯4 D♯4 A4 D♯4 C♯4 (ô 7), G♯2 D♯3 F♯3 B♯3 F♯3 D♯3 hai lần (ô 8). p ô 5, cresc/dim ô 7, luyến tay phải, Ped./* mỗi ô khớp .ly. Khác bản in có chủ ý, trang đã nói: nhóm sáu tay trái viết thành hai nhóm liên ba; M:2/2 (bản Mutopia ghi \time 4/4, số máy đếm theo nốt trắng, xem n69); tay trái không ghi luyến như .ly; 8va ô 7 viết thẳng nốt. Q:1/4=60 là tốc độ phát của site.'
