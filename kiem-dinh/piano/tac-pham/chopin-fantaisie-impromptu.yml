  - cu: null
    moi: 'Impromptu nghĩa là "ngẫu hứng": một bản nhạc như bật ra tức thì. Chopin tự cho in ba bản impromptu (Op. 29, Op. 36, Op. 51). Bản này, theo Fontana viết năm 1834, ông không cho in. Sau khi Chopin mất, người bạn Julian Fontana in nó năm 1855, cùng với các valse Op. 69 và Op. 70 (trong đó có Valse Si thứ). Theo Henle, bản tay của Chopin chỉ ghi chỉ dẫn tốc độ, bản chép của Auguste Franchomme ghi "Impromptu"; cái tên ghép Fantaisie-Impromptu nhiều khả năng do Fontana đặt.'
    ly_do: 'Kiểm định D6-L6 (n13–n16): năm 1834 là theo Fontana (bình chú Henle HN 1320; IMSLP ghi 1834–35); bỏ "không ai biết chắc vì sao" và lời dặn của Chopin (chưa có nguồn đã mở); tên bài theo bình chú Henle.'
  - cu:
      - 'Impromptu nghĩa là "ngẫu hứng": một bản nhạc như bật ra tức thì. Chopin tự cho in ba bản impromptu (Op. 29, Op. 36, Op. 51). Bản này, viết năm 1834, ông giữ lại và không bao giờ cho in; không ai biết chắc vì sao. Sau khi Chopin mất, dù ông đã dặn không in các bản thảo chưa xuất bản, người bạn Julian Fontana vẫn in nó năm 1855, cùng với các valse Op. 69 và Op. 70 (trong đó có Valse Si thứ). Theo Henle, các nguồn gốc của bài không ghi tên; cái tên ghép Fantaisie-Impromptu là tên của bản in di cảo.'
      - Năm 1960, Arthur Rubinstein mua lại "album của Nam tước phu nhân d'Este" trong một cuộc đấu giá ở Paris. Trong album có bản tay của chính Chopin, đề năm 1835, trang bìa ghi bằng tiếng Pháp rằng bài được "soạn cho Nam tước phu nhân d'Este". Rubinstein coi đây là bản hoàn chỉnh, với "nhiều cải thiện về hòa âm và văn phong" so với bản đã in, và cho xuất bản năm 1962 (G. Schirmer). Trong lời tựa, ông đoán chữ "soạn cho" (thay cho một lời đề tặng) nghĩa là Chopin đã nhận tiền đặt hàng, tức là đã bán bài cho bà; nếu vậy, đó có thể là lý do Chopin không tự in nó.
    moi: null
    ly_do: 'Kiểm định D6-L6 (n13–n16): năm 1834 là theo Fontana (bình chú Henle HN 1320; IMSLP ghi 1834–35); bỏ "không ai biết chắc vì sao" và lời dặn của Chopin (chưa có nguồn đã mở); tên bài theo bình chú Henle.'
