nguon:
  - id: mutopia-op66
    bac: 1
    ten: 'Mutopia Project, Fantaisie-Impromptu Op. 66 (chopin_fantaisie-impromptu.ly, .mid, -a4.pdf): source "Herrmann Scholtz (1845-1918)", Guy D. Lederfein, phạm vi công cộng; \time 4/4, \tempo 2 = 84; ghi chú: "A : bars 5-40, B : bars 41-82, A : bars 83-118, C : bars 119-138"; tải 05/11/2026'
    link: https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/
  - id: henle-hn1320
    bac: 2
    ten: 'G. Henle Verlag, HN 1320 Chopin, Fantaisie-Impromptu (trang sản phẩm): "7 difficult"; "the piece … is untitled in the source materials, and was not published until after the composer’s death. Moreover, there exist two versions; we print them both"'
    link: https://www.henle.de/en/Fantaisie-Impromptu-c-sharp-minor-op.-post.-66/HN-1320
  - id: henle-hn1320-comments
    bac: 2
    ten: 'G. Henle Verlag, HN 1320, Bemerkungen/Comments (Ewald Zimmermann, 1974): bản tay "from the Artur Rubinstein Collection", "part of the Baroness d’Este album", ngày "Paris Vendredi 1835", "According to Fontana … composed in 1834", "may therefore be a later copy", bản Fontana "departs not inconsiderably" và khớp bản chép của Franchomme; GE Berlin Schlesinger 1855, FE Paris Meissonnier 1856; "In all probability the term Fantaisie-Impromptu also originated with Fontana, for A only gives the tempo mark and CM the term Impromptu"; số máy đếm 84 của Fontana'
    link: https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf
