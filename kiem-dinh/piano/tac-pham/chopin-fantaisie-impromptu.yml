    moi: Một bản tay của chính Chopin, đề "Paris Vendredi 1835" (Paris, thứ Sáu, 1835), nằm trong một album của Nam tước phu nhân d'Este, ghi rằng bài được "soạn cho" bà; sau này bản tay thuộc bộ sưu tập của Arthur Rubinstein, và Rubinstein cho in nó năm 1962 (G. Schirmer). Theo Henle, đây có thể là một bản chép lại sau của bài đã viết năm trước; bản Fontana in khác bản tay khá nhiều, và nhiều chỗ khác ấy khớp với bản chép của Franchomme.
    ly_do: 'Kiểm định D6-L6 (n17–n20): giữ phần có nguồn (bình chú Henle HN 1320: "Paris Vendredi 1835", album d''Este, bộ sưu tập Artur Rubinstein; bản in G. Schirmer 1962); bỏ năm mua 1960, cuộc đấu giá và các ý của lời tựa Rubinstein (chỉ thấy ở nguồn phổ thông).'
ghi_chu: 'Lượt 1 D6-L6 phần A (05–06/11/2026). Bản nhạc: Mutopia chopin_fantaisie-impromptu (ấn bản Herrmann Scholtz, văn bản Fontana; .ly, .mid, PDF), đọc nốt MIDI theo ô bằng mido; 138 ô (4 + 36 + 42 + 36 + 20), khớp hinh.bai-hoc của bản ghi. Henle HN 1320 (trang sản phẩm, bình chú 1974 của Ewald Zimmermann; PDF lời tựa không trích được chữ). Sửa chính: bỏ "rất nhiều người lớn mơ", "nổi tiếng nhất"; năm 1834 "theo Fontana"; bỏ lời dặn của Chopin, năm mua 1960, cuộc đấu giá và các ý của lời tựa Rubinstein (chưa đọc được); tên bài theo bình chú Henle; nghỉ theo BAPAM; bỏ Eigeldinger; mục Nguồn. Chưa chắc: n69 (nhịp 2/2: Mutopia in \time 4/4 nhưng số máy đếm theo nốt trắng; dữ liệu nhip: 2/2). Thuật ngữ trang dùng chưa có trong thuat-ngu.yml (đã grep): impromptu, đa tiết tấu (polyrhythm, ba chọi bốn), pesante, liên bảy (septuplet). Có sẵn: agitato, cantabile, sotto voce, marcato, tranquillo, nocturne, coda. Câu ve-site ở hồ sơ khác: piano/hai-tay n61–n63 (Op. 66; bốn nốt tay phải, ba nốt tay trái mỗi phách đen; link) đúng, trang mới giữ "mỗi phách đen có bốn móc kép tay phải trên ba nốt liên ba tay trái"; quang-tam-buoc-nhay n37, n47 (cú vọt lên Si6 ở ô 7; ô 37–40): đúng, giữ ở bảng Chỗ khó và câu sau khối 1; lo-trinh n37 (ba chọi bốn, khoảng năm phút: Commons 5 phút 27 giây); tac-pham-theo-cap n25, n38; chopin-valse-si-thu n102 (Fontana in năm 1855): giữ; the-loai n35: giữ (ba impromptu Op. 29, 36, 51, Op. 66 in sau khi mất).'
