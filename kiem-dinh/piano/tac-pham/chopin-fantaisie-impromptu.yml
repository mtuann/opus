  - cu: Ở phần nhanh, ấn bản Scholtz ghi đổi bàn đạp theo hòa âm, mỗi ô hoặc mỗi nửa ô. Đạp nông và ngắn để móc kép tay phải không nhòe thành một vệt; ở các gam nửa cung, đạp thật nông, chỉ đủ giữ nốt trầm. Ở đoạn giữa, đạp trễ, đổi theo hòa âm để giữ tay trái rải rộng thành một nền âm thanh. Ở coda, đổi theo từng nốt của giai điệu tay trái. Xem Bàn đạp.
