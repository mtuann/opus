doi_chu:
  - cu: 'Bài mà rất nhiều người lớn mơ được chơi: hai phần nhanh trong đó tay phải chơi bốn nốt trên mỗi ba nốt của tay trái, kẹp giữa một đoạn hát Rê♭ trưởng như một nocturne. Trang này chỉ cách học ba chọi bốn từng bước, cách giữ đôi tay bền và khỏe qua những trang móc kép liên tục, và một kế hoạch 12 tuần.'
    moi: Hai phần nhanh trong đó tay phải chơi bốn nốt trên mỗi ba nốt của tay trái, kẹp giữa một đoạn hát Rê♭ trưởng như một nocturne. Trang này chỉ cách học ba chọi bốn từng bước, cách giữ đôi tay bền và khỏe qua những trang móc kép liên tục, và một kế hoạch 12 tuần.
