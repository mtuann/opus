    link: https://www.bapam.org.uk/?p=59585
nhan_dinh:
  - id: n1
    cau: Hai phần nhanh trong đó tay phải chơi bốn nốt trên mỗi ba nốt của tay trái, kẹp giữa một đoạn hát Rê♭ trưởng như một nocturne (cả ở description).
    loai: cau-truc
    nguon:
      - mutopia-op66
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ mở đầu bằng "Bài mà rất nhiều người lớn mơ được chơi:" (không kiểm được): bỏ, ở câu mở đầu và description. Phần còn lại: Mutopia ô 5–40, 83–118 tay phải móc kép, tay trái \times 4/6 (ba nốt mỗi phách đen); ô 41–82 \key des \major, Moderato cantabile. doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly", "https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf" ]
    luot_2_ghi_chu: "Mutopia (Scholtz): A ô 5–40 và 83–118 tay phải bốn móc kép mỗi phách trên ba nốt tay trái; đoạn giữa Rê♭ trưởng Moderato cantabile, sotto voce. 'như một nocturne' là so sánh."
  - id: n2
    cau: Trang chỉ cách học ba chọi bốn từng bước, cách giữ tay khỏe, và kế hoạch 12 tuần.
    loai: ve-site
    ket_qua: dung
    ghi_chu: Trang có mục "Ba chọi bốn, từng bước", ô Sức bền và link suc-khoe, bảng Kế hoạch 12 tuần.
  - id: n3
    cau: Gần như suốt hai phần nhanh, mỗi phách đen có bốn móc kép tay phải trên ba nốt liên ba tay trái.
    loai: cau-truc
    nguon:
      - mutopia-op66
    ket_qua: da-sua
    ghi_chu: 'Mutopia: đúng ở ô 5–34 và 83–112; ô 35–40 (113–118) tay trái hợp âm, quãng tám nốt đen ("gần như"). Chữ cũ của tiêu đề gạch đầu dòng: "Ba chọi bốn ở dạng nổi tiếng nhất" (không kiểm được), nay "Ba chọi bốn liên tục". Khớp hồ sơ đã khóa piano/hai-tay n62. doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly" ]
    luot_2_ghi_chu: "Mutopia: tay phải móc kép, tay trái \\times 4/6 (sáu móc đơn mỗi nửa ô = ba nốt mỗi phách đen)."
  - id: n4
    cau: Học xong bài này, đa tiết tấu không còn là nỗi sợ.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n5
    cau: Tay phải có những vòng nốt quanh một nốt trục, nhiều nốt nửa cung (Fa thăng kép, Si♯), gam nửa cung đi xuống, những cú vọt lên âm vực cao.
    loai: cau-truc
    nguon:
      - mutopia-op66
    ket_qua: dung
    ghi_chu: 'Ô 5: G♯ A G♯ F𝄪 (fisis), ô 5 B♯ (bis); gam nửa cung ô 33–36; ô 7 vọt lên B6; ô 37 8va.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly" ]
    luot_2_ghi_chu: "Mutopia ô 5: gis a gis fisis gis… (vòng quanh Sol♯, có Fa𝄪, Si♯); ô 33–36 gam nửa cung đi xuống; ô 7 lên Si6 (8va)."
  - id: n6
    cau: 'Tay trái rải hợp âm trải quá một quãng tám: Đô♯3 – Sol♯3 – Đô♯4 – Mi4.'
    loai: cau-truc
    nguon:
      - mutopia-op66
    ket_qua: dung
    ghi_chu: 'MIDI ô 5: C♯3 G♯3 C♯4 E4 C♯4 G♯3.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly" ]
    luot_2_ghi_chu: "Mutopia tay trái ô 5: cis gis' cis e (relative c) = Đô♯3 – Sol♯3 – Đô♯4 – Mi4."
  - id: n7
    cau: Hình rải rộng cần xoay cẳng tay thay vì căng ngón.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: dung
    ghi_chu: 'Có yếu tố mỏi, căng: xếp quy-tac. BAPAM: "Avoid excessive stretches". Trang đã khóa piano/hop-am-rai: "Để cẳng tay xoay nhẹ theo hướng các nốt".'
    luot_2: dung
    luot_2_nguon: [ "https://www.golandskyinstitute.org/resources/" ]
    luot_2_ghi_chu: "Golandsky Institute: chuyển động xoay cẳng tay để ngón, bàn tay, cẳng tay đi cùng nhau, tránh căng ngón ('avoiding stretching, a major cause of tension and injury')."
  - id: n8
    cau: 'Phần nhanh bồn chồn và đoạn giữa hát như một nocturne: tập chuyển tiếng đàn, nhịp thở, bàn đạp.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Chỉ dẫn agitato, Moderato cantabile, sotto voce: Mutopia, IMSLP.'
  - id: n9
    cau: Nên chơi vững hai chọi ba, quen ba chọi bốn ở mức bài tập (trang Phối hợp hai tay), đã học Valse Si thứ và Nocturne Op. 9 số 2, móc kép đều ở khoảng ♩ = 120.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'piano/hai-tay có mục Hai chọi ba, Ba chọi bốn (bài 9, 10). tac-pham.yml: chopin-valse-si-thu chặng 6, chopin-nocturne-op9-2 chặng 6 (dưới chặng 7). Nocturne chưa chuyển: ../opus-zero/docs/piano/tac-pham/chopin-nocturne-op9-2.md có.'
  - id: n10
    cau: Hai phần nhanh có thể gây mỏi, đau cẳng tay nếu tập sai; đọc Giữ đôi tay khỏe.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: dung
    ghi_chu: 'BAPAM: "If you experience pain, stop immediately", tránh căng quá mức. Link /opus/piano/suc-khoe/ có, tiêu đề "Giữ đôi tay khỏe".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4086404/" ]
    luot_2_ghi_chu: "PMC: bài khó, thiếu nghỉ, cơ học kém là yếu tố nguy cơ đau do chơi nhạc."
  - id: n11
    cau: 'Impromptu nghĩa là "ngẫu hứng": một bản nhạc như bật ra tức thì.'
    loai: dinh-nghia
    nguon:
      - cod-impromptu
    ket_qua: dung
    ghi_chu: 'COD: "Literally ‘improvised’ or ‘on the spur of the moment’".'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20160324055227/http://www.britannica.com:80/art/impromptu", "https://www.henle.de/Impromptus/HN-235" ]
    luot_2_ghi_chu: "Britannica: impromptu là bản piano thế kỷ 19 'intended to produce the illusion of spontaneous improvisation'; Henle HN 235: 'strongly improvisatory character'."
  - id: n12
    cau: Chopin tự cho in ba bản impromptu (Op. 29, Op. 36, Op. 51).
    loai: danh-muc
    nguon:
      - imslp-impromptus
    ket_qua: dung
    ghi_chu: 'IMSLP: Op. 29 in 1837, Op. 36 in 1840, Op. 51 in 1843 (khi Chopin còn sống). Khớp hồ sơ đã khóa piano/the-loai n35.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Impromptu_No.1,_Op.29_(Chopin,_Frédéric)", "https://imslp.org/wiki/Impromptu_No.2,_Op.36_(Chopin,_Frédéric)", "https://imslp.org/wiki/Impromptu_No.3,_Op.51_(Chopin,_Frédéric)" ]
    luot_2_ghi_chu: "IMSLP: Op. 29 in 1837, Op. 36 in 1840, Op. 51 in 1843, khi Chopin còn sống; Op. 66 in 1855 (sau khi mất)."
  - id: n13
    cau: Theo Fontana, bài viết năm 1834; Chopin không cho in.
    loai: nam
    nguon:
      - henle-hn1320-comments
      - henle-hn1320
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bản này, viết năm 1834, ông giữ lại và không bao giờ cho in; không ai biết chắc vì sao." Henle: "According to Fontana, the Fantasy-Impromptu – only published after the composer’s death – was composed in 1834"; IMSLP ghi 1834–35. Thêm "theo Fontana"; bỏ "không ai biết chắc vì sao" (không kiểm được). doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf", "https://imslp.org/wiki/Fantaisie-Impromptu,_Op.66_(Chopin,_Frédéric)" ]
    luot_2_ghi_chu: "Bình chú Henle: 'According to Fontana, the Fantasy-Impromptu – only published after the composer's death – was composed in 1834.'"
  - id: n14
    cau: Dù Chopin đã dặn không in các bản thảo chưa xuất bản, Fontana vẫn in.
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: Chưa mở được nguồn bậc 1–2 (Niecks trên Gutenberg chưa tìm được bản). Bỏ vế này. doi_chu.
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/cache/epub/4972/pg4972.txt", "https://www.henle.de/Impromptus/HN-235" ]
    luot_2_ghi_chu: "Niecks: 'the composer unequivocally expressed the wish that his manuscripts should not be published', rồi nhắc Fantaisie-Impromptu trong tuyển của Fontana; Henle: bài chỉ ra đời sau khi Chopin mất nhờ Fontana."
  - id: n15
    cau: Julian Fontana in bài năm 1855, sau khi Chopin mất, cùng các valse Op. 69 và Op. 70 (có Valse Si thứ).
    loai: nam
    nguon:
      - imslp-op66
      - henle-hn1320-comments
      - imslp-op70
      - henle-hn131-bem
    ket_qua: dung
    ghi_chu: 'IMSLP Op. 66: "Year of First Publication=1855"; Henle: GE Berlin Schlesinger 1855 (bản Pháp 1856). IMSLP Op. 70: in 1855, biên tập Fontana; Henle HN 131: op. 69 số 2 in 1855. Link Valse Si thứ có (src/content/docs). Khớp chopin-valse-si-thu n102.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Fantaisie-Impromptu,_Op.66_(Chopin,_Frédéric)", "https://www.gutenberg.org/cache/epub/4972/pg4972.txt", "https://imslp.org/wiki/Waltzes,_Op.69_(Chopin,_Frédéric)", "https://imslp.org/wiki/3_Waltzes,_Op.70_(Chopin,_Frédéric)" ]
    luot_2_ghi_chu: "IMSLP: Op. 66 in lần đầu 1855 (Fontana; Schlesinger S. 4392, Meissonnier J.M. 3523); Op. 70 in 1855, Op. 69 Meissonnier [1855], số 2 Si thứ. Niecks: Fontana in Op. 66–74 năm 1855. Lưu ý: Op. 69 số 2 và Op. 70 số 2 đã in ở Kraków năm 1852."
  - id: n16
    cau: Theo Henle, bản tay của Chopin chỉ ghi chỉ dẫn tốc độ, bản chép của Franchomme ghi "Impromptu"; cái tên Fantaisie-Impromptu nhiều khả năng do Fontana đặt.
    loai: ten
    nguon:
      - henle-hn1320-comments
      - henle-hn1320
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Theo Henle, các nguồn gốc của bài không ghi tên; cái tên ghép Fantaisie-Impromptu là tên của bản in di cảo." Trang sản phẩm Henle: "untitled in the source materials"; bình chú: "A only gives the tempo mark and CM the term Impromptu … In all probability the term Fantaisie-Impromptu also originated with Fontana". Viết theo bình chú (cụ thể hơn, đúng hơn). doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf" ]
    luot_2_ghi_chu: "Henle: 'In all probability the term Fantaisie-Impromptu also originated with Fontana, for A only gives the tempo mark and CM the term Impromptu' (CM: bản chép của Franchomme)."
  - id: n17
    cau: Bản tay của Chopin, đề "Paris Vendredi 1835", nằm trong album của Nam tước phu nhân d'Este, ghi bài được "soạn cho" bà.
    loai: lich-su
    nguon:
      - henle-hn1320-comments
      - imslp-op66
    ket_qua: da-sua
    ghi_chu: 'Henle: "bears the somewhat unusual date ‘Paris Vendredi 1835’ … part of an album owned by Baroness d’Este". IMSLP: "Composed for Madame la Baronne Frances Sarah d''Este". Chữ cũ mở đầu bằng "Năm 1960, Arthur Rubinstein mua lại … trong một cuộc đấu giá ở Paris": chỉ thấy ở nguồn phổ thông, bỏ năm mua và cuộc đấu giá. doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf", "https://imslp.org/wiki/Fantaisie-Impromptu,_Op.66_(Chopin,_Frédéric)" ]
    luot_2_ghi_chu: "Henle: bản tay trong bộ sưu tập Rubinstein đề 'Paris Vendredi 1835', là một phần album của Nam tước phu nhân d'Este. IMSLP: 'Composed for Madame la Baronne Frances Sarah d'Este'."
  - id: n18
    cau: Bản tay sau thuộc bộ sưu tập của Arthur Rubinstein; Rubinstein cho in nó năm 1962 (G. Schirmer).
    loai: nam
    nguon:
      - henle-hn1320-comments
      - hope-schirmer
    ket_qua: da-sua
    ghi_chu: 'Henle: "from the Artur Rubinstein Collection". Thư viện Hope: "Ms. ed. from the collection of Artur Rubinstein", G. Schirmer [1962]. doi_chu cùng mục n17.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf" ]
    luot_2_ghi_chu: "Henle: bản tay thuộc 'Artur Rubinstein Collection', từng nằm trong album của Nam tước phu nhân d'Este: vế này đúng. Hinson (chỉ thấy đoạn trích tìm kiếm archive.org): Schirmer có ấn bản bản tay từ bộ sưu tập Rubinstein, kèm lời tựa và bản chụp. Năm 1962 không tìm được nguồn mở được."
  - id: n19
    cau: Rubinstein coi bản d'Este là bản hoàn chỉnh, "nhiều cải thiện về hòa âm và văn phong", và đoán chữ "soạn cho" nghĩa là Chopin đã bán bài cho bà.
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Lời tựa Rubinstein (Schirmer 1962) chưa đọc được; chỉ thấy ở nguồn phổ thông. Bỏ; thay bằng điều Henle nói: bản tay có thể là bản chép lại sau; bản Fontana khác bản tay khá nhiều, nhiều chỗ khớp bản chép của Franchomme (n20). doi_chu.'
