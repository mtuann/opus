    luot_2_ghi_chu: "Đếm ô trên Mutopia (Leichte Stücke, 1900) và Peters (Dörffel): nhịp lấy đà rồi 24 ô 4/4."
  - id: n2
    cau: 'Bài là một bài học lớn về nhiều giọng trong hai bàn tay: giai điệu, bè trong, bè trầm đan vào nhau như một bản hợp xướng nhỏ.'
    loai: cau-truc
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Mutopia ghi bốn giọng (viola, violatwo… trên hai khuông): giai điệu, bè trong tay phải, tenor và bè trầm tay trái. "Bài học lớn", "hợp xướng" là lời giới thiệu. Giữ cho chopin-prelude-mi-thu n73, tchaikovsky-cau-nguyen-buoi-sang n72 (giai điệu hát, nhiều bè).'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/musics/65", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly" ]
    luot_2_ghi_chu: "PTNA: giai điệu bốn bè (４声). Mutopia viết bốn bè (soprano, alto, tenor, bass)."
  - id: n3
    cau: Trang hướng dẫn cách tập để mỗi bè hát đúng vị trí, câu nhạc dài, nhịp tự do có chừng mực.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý.
