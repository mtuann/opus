  - cu:
      - "Đây là nhạc về tuổi thơ cho người lớn, không phải nhạc cho trẻ em (Schumann viết riêng tập Album für die Jugend Op. 68 cho con mình, xem Schumann: Album cho tuổi trẻ). Các tên bài, theo lời Schumann, chỉ là những gợi ý tinh tế cho cách chơi và cách hiểu. Träumerei đứng đúng giữa chu trình, bài thứ 7 trên 13."
      - 'Về tốc độ: số máy đếm nhịp ♩ = 100 có từ ấn bản đầu tiên (trong một lần in lại), và Schumann đã để nguyên khi duyệt bản in. Con số này nhanh hơn nhiều so với thói quen chơi rất chậm sau này. Nhà nghiên cứu Michael Struck (nhóm biên tập Henle) cho rằng câu chuyện "máy đếm nhịp của Schumann bị hỏng" là một huyền thoại, và Henle in con số này như chỉ dẫn của tác giả. Clara Schumann, trong ấn bản của bà, gợi ý chậm hơn (♩ = 80). Xem thêm thời kỳ Lãng mạn.'
    moi:
      - "Đây là nhạc về tuổi thơ cho người lớn, không phải nhạc cho trẻ em (nhạc cho người trẻ tập đàn là tập Album für die Jugend Op. 68, Schumann viết mười năm sau, xem Schumann: Album cho tuổi trẻ). Các tên bài, theo lời Schumann, chỉ là những gợi ý tinh tế cho cách chơi và cách hiểu. Träumerei đứng đúng giữa chu trình, bài thứ 7 trên 13."
      - 'Về tốc độ: số máy đếm nhịp ♩ = 100 có từ ấn bản đầu tiên (trong một lần in lại), và Schumann đã để nguyên khi duyệt bản in. Con số này nhanh hơn nhiều so với thói quen chơi rất chậm sau này. Michael Struck, chuyên gia về Schumann và biên tập viên của Henle, cho rằng câu chuyện "máy đếm nhịp của Schumann bị hỏng" là một huyền thoại, và Henle in con số này như chỉ dẫn của tác giả. Clara Schumann, trong ấn bản của bà, gợi ý chậm hơn (♩ = 80). Xem thêm thời kỳ Lãng mạn.'
