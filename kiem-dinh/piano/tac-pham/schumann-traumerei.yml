  - cu: "Vladimir Horowitz hay chơi bài này như một bản encore: trong buổi hòa nhạc trở lại Carnegie Hall năm 1965 và trong buổi diễn ở Moskva năm 1986 (bản ghi hình cho thấy khán giả rơi lệ). Cách chơi của ông chậm, tự do, rất hát, khác hẳn một bản thu theo đúng ♩ = 100. So sánh hai cách ấy với bản thu trọn Kinderszenen của một nghệ sĩ khác (ví dụ Martha Argerich hoặc Alfred Brendel) để tự quyết định tốc độ của mình. Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu."
    moi: Vladimir Horowitz chơi bài này ở cuối buổi hòa nhạc trở lại Carnegie Hall ngày 9/5/1965 và trong buổi diễn ở Moskva năm 1986; cả hai buổi đều có đĩa thu trực tiếp. So sánh tốc độ của ông với ♩ = 100 và với bản thu trọn Kinderszenen của một nghệ sĩ khác (ví dụ Martha Argerich, Deutsche Grammophon) để tự quyết định tốc độ của mình. Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu.
    ly_do: 'n21, n22 (da-sua): đĩa Sony (Carnegie Hall 9/5/1965, Träumerei là bài cuối) và DG Horowitz in Moscow (1986) đã mở; "khán giả rơi lệ", "chậm, tự do, rất hát" không có nguồn; bản thu Brendel chưa mở nguồn.'
