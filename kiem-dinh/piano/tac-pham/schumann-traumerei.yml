nguon:
  - id: mutopia-504
    bac: 1
    ten: Mutopia Project, Kinderscenen – Träumerei (SchumannOp15No07.ly, .mid; source "Leichte Stucke, 1900", Ying-Chun Liu, phạm vi công cộng; tải 05/11/2026)
    link: https://github.com/MutopiaProject/MutopiaProject/blob/master/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly
  - id: peters-ia
    bac: 1
    ten: 'Rob. Schumann''s Werke für Pianoforte solo, Bd. 1 (C. F. Peters, Leipzig, [188-?]), Kinderscenen tr. 60–72 (Internet Archive robschumannswerk01schu, ảnh trang n65–n77): Träumerei "M.M. ♩ = 100", không chữ chỉ tốc độ'
    link: https://archive.org/details/robschumannswerk01schu
  - id: henle-hn44
    bac: 2
    ten: 'G. Henle Verlag, HN 44 Scenes from Childhood op. 15 (trang sản phẩm): "Träumerei op. 15,7 5 medium"; "Von fremden Ländern … 4 medium ABRSM: Piano Grade 5"; "Kind im Einschlummern … 5 medium ABRSM: Piano Grade 7"'
    link: https://www.henle.de/en/Scenes-from-Childhood-op.-15/HN-44
  - id: henle-hn44-vorwort
    bac: 2
    ten: 'G. Henle Verlag, HN 44, Preface (Ernst Herttrich, 2007; PDF): nhật ký 24/2/1838 "composed a little thing called Träumerei"; thư gửi Reinecke 6/10/1848 "reminiscences by a grown-up for grown-ups"; thư gửi Dorn 5/9/1839 "the titles were added later, and are nothing more than subtle hints for the interpretation and comprehension"'
    link: https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf
  - id: henle-hn44-bem
    bac: 2
    ten: 'G. Henle Verlag, HN 44, Comments (PDF): "FE2 Later, corrected printing of the first edition. Published in March 1839 … What is new in the corrected print are the metronome markings"; ghi chú của Otto Böhme'
    link: https://www.henle.de/media/f1/4e/7c/1740992228/0044x.pdf
  - id: henle-seiffert
    bac: 2
    ten: 'Wolf-Dieter Seiffert, "From deep sleep to MM 100. Some thoughts on Robert Schumann''s Träumerei" (G. Henle Verlag, 2010; PDF): "Schumann specifies a ritardando only in the three instances, where parts meet", "Schumann notes only one fermate, namely shortly before the end", "the legend of Schumann''s malfunctioning metronome is a musicological myth", "the Henle Urtext edition rightly instructs the musician to play ♩ = 100"'
    link: https://www.henle.de/media/0a/2b/f0/1687445046/essay_traeumerei.pdf
  - id: henle-struck
    bac: 2
    ten: 'Phone interview with Dr. Michael Struck on Schumann''s metronome markings (G. Henle Verlag, 2010; PDF): "The story about the broken metronome is untrue"; Kinderszenen: markings not by Schumann "And yet, they are authorized, for Schumann did not correct them"; "Schumann set the tempo of the Träumerei at quarter note = 100"; "Clara Schumann, in her instructive edition set the tempo for Träumerei at quarter note = 80"'
    link: https://www.henle.de/media/54/e7/73/1687438503/interview_struck.pdf
  - id: henle-blog-2021
    bac: 2
    ten: 'Henle Blog, Wolf-Dieter Seiffert, "Schumann''s metronome markings in his Kinderszenen. Opportunity, not nuisance." (6/12/2021): Struck "editor of several works of our Neuen Brahms Gesamtausgabe as well as eminent Schumann specialist"; MM "initially in the first edition''s revised second issue"'
    link: https://blog.henle.de/en/2021/12/06/schumanns-metronome-markings-in-his-kinderszenen-opportunity-not-nuisance/
  - id: qobuz-1965
    bac: 2
    ten: 'Qobuz, Vladimir Horowitz, Carnegie Hall Concert, May 9, 1965 "An Historic Return" (Sony Classical): bài cuối đĩa 2 "Kinderszenen, Op. 15, No. 7: Träumerei", (P) 1965'
    link: https://www.qobuz.com/ie-en/album/vladimir-horowitz-carnegie-hall-concert-may-9-1965-an-historic-return-vladimir-horowitz/tku4c053rxlsb
  - id: qobuz-1986
    bac: 2
    ten: 'Qobuz, Horowitz in Moscow (Live) (Deutsche Grammophon, ℗ 1986): bài 13 "Schumann: Kinderszenen, Op. 15: VII. Träumerei (Live)"'
    link: https://www.qobuz.com/no-en/album/horowitz-in-moscow-vladimir-horowitz/0002894194992
  - id: dg-argerich
    bac: 2
    ten: Deutsche Grammophon, SCHUMANN Kinderszenen · Kreisleriana, Martha Argerich (16/1/1984)
    link: https://www.deutschegrammophon.com/en/catalogue/products/schumann-kinderszenen-argerich-7066
  - id: commons-musopen-7
    bac: 2
    ten: Wikimedia Commons, File:Robert Schumann - scenes from childhood, op. 15 - vii. dreaming.ogg (Musopen, phạm vi công cộng, 203,0 giây)
    link: https://commons.wikimedia.org/wiki/File:Robert_Schumann_-_scenes_from_childhood,_op._15_-_vii._dreaming.ogg
nhan_dinh:
  - id: n1
    cau: Träumerei (Mơ màng) chỉ có 24 ô nhịp.
    loai: cau-truc
    nguon: &id001
      - mutopia-504
      - peters-ia
    ket_qua: dung
    ghi_chu: 'Mutopia: \partial 4, \repeat volta { 8 ô }, 16 ô tiếp: 24 ô và nhịp lấy đà.'
  - id: n2
    cau: 'Bài là một bài học lớn về nhiều giọng trong hai bàn tay: giai điệu, bè trong, bè trầm đan vào nhau như một bản hợp xướng nhỏ.'
    loai: cau-truc
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Mutopia ghi bốn giọng (viola, violatwo… trên hai khuông): giai điệu, bè trong tay phải, tenor và bè trầm tay trái. "Bài học lớn", "hợp xướng" là lời giới thiệu. Giữ cho chopin-prelude-mi-thu n73, tchaikovsky-cau-nguyen-buoi-sang n72 (giai điệu hát, nhiều bè).'
  - id: n3
    cau: Trang hướng dẫn cách tập để mỗi bè hát đúng vị trí, câu nhạc dài, nhịp tự do có chừng mực.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n4
    cau: 'Đây là bước tiếp sau những bài "giai điệu tay phải, đệm tay trái": một bàn tay thường phải vừa hát vừa đệm.'
    loai: cau-truc
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'MIDI khuông trên ô 1–2: giai điệu (F4 … F5) cùng hợp âm đệm F3–C4 và F4 giữ; tay trái F2 và tenor D4 C4 B♭3 ở ô 2. Giữ cho piano/tieng-dan n57.'
  - id: n5
    cau: Kỹ năng này đã được giới thiệu ở mục cân bằng của Tạo tiếng đàn (link).
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/piano/tieng-dan.md (đã khóa) có mục cân bằng và nhắc Träumerei (n57).
  - id: n6
    cau: Mỗi câu bốn ô nhịp là một hơi thở; cả bài là một vòng cung lớn.
    loai: cau-truc
    nguon: *id001
    ket_qua: dung
    ghi_chu: Sáu câu bốn ô (1–4, 5–8, 9–12, 13–16, 17–20, 21–24). "Hơi thở", "vòng cung" là lời khuyên.
  - id: n7
    cau: Không thể nối các hợp âm chỉ bằng ngón; phải đổi bàn đạp sạch.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mutopia ghi bàn đạp ô 1–2, 5–6, 9, 13, 17–18, 21–24.
  - id: n8
    cau: Hai, ba phút nhạc; có thể dành sáu tuần.
    loai: so-lieu
    nguon:
      - qobuz-1965
      - qobuz-1986
      - commons-musopen-7
    ket_qua: dung
    ghi_chu: Horowitz 2:24 (1986), 3:02 (1965); Musopen 3:23. Phần "sáu tuần" là lời khuyên.
  - id: n9
    cau: Schumann viết Kinderszenen năm 1838, khi đang yêu Clara Wieck; câu chuyện ở hướng dẫn nghe (link).
    loai: lich-su
    nguon: &id002
      - henle-hn44-vorwort
    ket_qua: dung
    ghi_chu: 'Henle: tháng 2–3/1838, "the escalating controversy over his engagement to Clara Wieck". Trang nghe-nhac/schumann-kinderszenen cùng lô.'
  - id: n10
    cau: Đây là nhạc về tuổi thơ cho người lớn, không phải nhạc cho trẻ em.
    loai: lich-su
    nguon: *id002
    ket_qua: dung
    ghi_chu: 'Henle: thư gửi Reinecke 1848: "They are reminiscences by a grown-up for grown-ups". (Henle cũng ghi Schumann có lúc nói chúng "very easy for children".)'
  - id: n11
    cau: Nhạc cho người trẻ tập đàn là Album für die Jugend Op. 68, Schumann viết mười năm sau (link Album cho tuổi trẻ).
    loai: lich-su
    nguon: *id002
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(Schumann viết riêng tập Album für die Jugend Op. 68 cho con mình, …)". Chữ mới: "(nhạc cho người trẻ tập đàn là tập Album für die Jugend Op. 68, Schumann viết mười năm sau, …)". Lý do: Henle (thư 1848): Christmas Album [op. 68] "for those who are still young"; nguồn đã mở không nói "cho con mình". 1838 → 1848. Trang schumann-album có (đã khóa).'
  - id: n12
    cau: Các tên bài, theo lời Schumann, chỉ là những gợi ý tinh tế cho cách chơi và cách hiểu.
    loai: lich-su
    nguon: *id002
    ket_qua: dung
    ghi_chu: 'Thư gửi Dorn 1839: "the titles were added later, and are nothing more than subtle hints for the interpretation and comprehension".'
  - id: n13
    cau: Träumerei đứng đúng giữa chu trình, bài thứ 7 trên 13.
    loai: so-lieu
    nguon:
      - henle-hn44
    ket_qua: dung
    ghi_chu: 'Henle: 13 bài, Träumerei op. 15,7; Seiffert: "exactly in the middle of the 13".'
  - id: n14
    cau: Số máy đếm nhịp ♩ = 100 có từ ấn bản đầu tiên (trong một lần in lại), và Schumann đã để nguyên khi duyệt bản in.
    loai: lich-su
    nguon:
      - henle-hn44-bem
      - henle-struck
      - henle-blog-2021
    ket_qua: dung
    ghi_chu: 'Henle Comments: "FE2 Later, corrected printing of the first edition. Published in March 1839 … What is new in the corrected print are the metronome markings"; Struck: "they are authorized, for Schumann did not correct them in … any of the later editions".'
  - id: n15
    cau: Con số này nhanh hơn nhiều so với thói quen chơi rất chậm sau này.
    loai: lich-su
    nguon:
      - henle-seiffert
    ket_qua: dung
    ghi_chu: 'Seiffert: "Schumann''s metronome marking reads ♩ = 100, and that is truly surprisingly lively"; "arduously stretched out".'
  - id: n16
    cau: Michael Struck, chuyên gia về Schumann và biên tập viên của Henle, cho rằng chuyện "máy đếm nhịp của Schumann bị hỏng" là huyền thoại; Henle in con số này như chỉ dẫn của tác giả.
    loai: lich-su
    nguon:
      - henle-struck
      - henle-blog-2021
      - henle-seiffert
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhà nghiên cứu Michael Struck (nhóm biên tập Henle)". Chữ mới: "Michael Struck, chuyên gia về Schumann và biên tập viên của Henle". Lý do: Henle Blog: "editor of several works of our Neuen Brahms Gesamtausgabe as well as eminent Schumann specialist"; Struck: "The story about the broken metronome is untrue"; Seiffert: "the Henle Urtext edition rightly instructs the musician to play ♩ = 100".'
  - id: n17
    cau: Clara Schumann, trong ấn bản của bà, gợi ý chậm hơn (♩ = 80).
    loai: so-lieu
    nguon:
      - henle-struck
    ket_qua: dung
    ghi_chu: 'Struck: "even Clara Schumann, in her instructive edition set the tempo for Träumerei at quarter note = 80".'
