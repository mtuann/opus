  - cu: Fa trưởng · 4/4 · Schumann không ghi chữ chỉ tốc độ, chỉ ghi số máy đếm nhịp ♩ = 100; Clara Schumann về sau gợi ý ♩ = 80
    moi: Fa trưởng · 4/4 · không có chữ chỉ tốc độ; số máy đếm nhịp ♩ = 100 in từ lần in sửa của bản in đầu (1839), Schumann để nguyên; Clara Schumann về sau gợi ý ♩ = 80
    ly_do: "Dòng Giọng · nhịp · tốc độ của thong_tin (hồ sơ bản ghi du-lieu/tac-pham/schumann-traumerei n16, plans/lam-lai/bao-cao/d6-l4/sua-B.yml): theo Henle HN 44 (Comments), số máy đếm nhịp có từ lần in sửa của bản in đầu (1839), không do Schumann ghi; Schumann để nguyên (Struck)."
  - cu:
      - "Đây là nhạc về tuổi thơ cho người lớn, không phải nhạc cho trẻ em (Schumann viết riêng tập Album für die Jugend Op. 68 cho con mình, xem Schumann: Album cho tuổi trẻ). Các tên bài, theo lời Schumann, chỉ là những gợi ý tinh tế cho cách chơi và cách hiểu. Träumerei đứng đúng giữa chu trình, bài thứ 7 trên 13."
      - 'Về tốc độ: số máy đếm nhịp ♩ = 100 có từ ấn bản đầu tiên (trong một lần in lại), và Schumann đã để nguyên khi duyệt bản in. Con số này nhanh hơn nhiều so với thói quen chơi rất chậm sau này. Nhà nghiên cứu Michael Struck (nhóm biên tập Henle) cho rằng câu chuyện "máy đếm nhịp của Schumann bị hỏng" là một huyền thoại, và Henle in con số này như chỉ dẫn của tác giả. Clara Schumann, trong ấn bản của bà, gợi ý chậm hơn (♩ = 80). Xem thêm thời kỳ Lãng mạn.'
    moi:
      - "Đây là nhạc về tuổi thơ cho người lớn, không phải nhạc cho trẻ em (nhạc cho người trẻ tập đàn là tập Album für die Jugend Op. 68, Schumann viết mười năm sau, xem Schumann: Album cho tuổi trẻ). Các tên bài, theo lời Schumann, chỉ là những gợi ý tinh tế cho cách chơi và cách hiểu. Träumerei đứng đúng giữa chu trình, bài thứ 7 trên 13."
      - 'Về tốc độ: số máy đếm nhịp ♩ = 100 có từ ấn bản đầu tiên (trong một lần in lại), và Schumann đã để nguyên khi duyệt bản in. Con số này nhanh hơn nhiều so với thói quen chơi rất chậm sau này. Michael Struck, chuyên gia về Schumann và biên tập viên của Henle, cho rằng câu chuyện "máy đếm nhịp của Schumann bị hỏng" là một huyền thoại, và Henle in con số này như chỉ dẫn của tác giả. Clara Schumann, trong ấn bản của bà, gợi ý chậm hơn (♩ = 80). Xem thêm thời kỳ Lãng mạn.'
    ly_do: 'n11 (da-sua): lời tựa Henle HN 44 (thư gửi Reinecke 1848) nói op. 68 dành cho "those who are still young"; nguồn đã mở không nói "cho con mình". n16 (da-sua): Henle Blog 2021 gọi Struck là "eminent Schumann specialist", biên tập viên Neue Brahms-Gesamtausgabe của Henle.'
  - cu: "Vladimir Horowitz hay chơi bài này như một bản encore: trong buổi hòa nhạc trở lại Carnegie Hall năm 1965 và trong buổi diễn ở Moskva năm 1986 (bản ghi hình cho thấy khán giả rơi lệ). Cách chơi của ông chậm, tự do, rất hát, khác hẳn một bản thu theo đúng ♩ = 100. So sánh hai cách ấy với bản thu trọn Kinderszenen của một nghệ sĩ khác (ví dụ Martha Argerich hoặc Alfred Brendel) để tự quyết định tốc độ của mình. Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu."
    moi: Vladimir Horowitz chơi bài này ở cuối buổi hòa nhạc trở lại Carnegie Hall ngày 9/5/1965 và trong buổi diễn ở Moskva năm 1986; cả hai buổi đều có đĩa thu trực tiếp. So sánh tốc độ của ông với ♩ = 100 và với bản thu trọn Kinderszenen của một nghệ sĩ khác (ví dụ Martha Argerich, Deutsche Grammophon) để tự quyết định tốc độ của mình. Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu.
    ly_do: 'n21, n22 (da-sua): đĩa Sony (Carnegie Hall 9/5/1965, Träumerei là bài cuối) và DG Horowitz in Moscow (1986) đã mở; "khán giả rơi lệ", "chậm, tự do, rất hát" không có nguồn; bản thu Brendel chưa mở nguồn.'
  - cu: "Câu 6: lên đến La, hợp âm đỉnh có dấu lặng ngân (fermata) duy nhất của bài, rồi ritardando về kết"
    moi: "Câu 6: lên đến La, hợp âm đỉnh có dấu ngân (fermata) duy nhất của bài, rồi ritardando về kết"
    ly_do: "n42 (da-sua): fermata ở ô 22 đặt trên hợp âm, không phải dấu lặng (thuat-ngu.yml: fermata)."
  - cu: Ấn bản của Clara Schumann sửa nhiều dấu nhấn và đổi tốc độ; nhiều bản in phổ thông dựa vào đó. Dùng bản Urtext để thấy ký hiệu của chính Schumann.
    moi: "Ấn bản của Clara Schumann đổi các số máy đếm nhịp (Träumerei: ♩ = 80). Dùng bản Urtext để thấy ký hiệu của bản in đầu."
    ly_do: 'n67 (da-sua): phỏng vấn Struck (Henle): ♩ = 80 trong ấn bản của Clara; vế "sửa nhiều dấu nhấn" chưa có nguồn; số máy đếm nhịp có từ lần in sửa của bản in đầu, không do Schumann ghi (Henle Comments).'
  - cu:
      - Schumann, Kinderszenen Op. 15, G. Henle Verlag; bài viết của Henle về tốc độ Träumerei và phỏng vấn Michael Struck về các số máy đếm nhịp của Schumann (henle.de).
      - "Henle Blog, \"Schumann's metronome markings in his Kinderszenen: opportunity, not nuisance\" (2021)."
      - Rob Kapilow, phân tích Träumerei (cấu trúc 24 ô nhịp, các vùng giọng của đoạn B).
      - Chương trình hòa nhạc của Vladimir Horowitz ở Carnegie Hall (9/5/1965) và Moskva (1986).
    moi:
      - "G. Henle Verlag, Scenes from Childhood op. 15, HN 44: lời tựa (Ernst Herttrich, 2007) và phần Comments (các số máy đếm nhịp có từ lần in sửa của bản in đầu, 1839)."
      - 'Wolf-Dieter Seiffert, "From deep sleep to MM 100" (Henle, 2010): ba chỗ ritardando, một fermata, ♩ = 100.'
      - "Phỏng vấn Michael Struck (Henle, 2010) và Henle Blog, \"Schumann's metronome markings in his Kinderszenen: opportunity, not nuisance\" (2021)."
