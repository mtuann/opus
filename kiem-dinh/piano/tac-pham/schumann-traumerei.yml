    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(ví dụ Martha Argerich hoặc Alfred Brendel)". Chữ mới: "(ví dụ Martha Argerich, Deutsche Grammophon)". Lý do: DG có đĩa Kinderszenen · Kreisleriana của Argerich (1984); bản thu Brendel chưa mở nguồn.'
