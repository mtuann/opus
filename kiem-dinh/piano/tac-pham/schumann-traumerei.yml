      - henle-seiffert
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Ấn bản của Clara Schumann sửa nhiều dấu nhấn và đổi tốc độ; nhiều bản in phổ thông dựa vào đó. Dùng bản Urtext để thấy ký hiệu của chính Schumann.\" Chữ mới: \"Ấn bản của Clara Schumann đổi các số máy đếm nhịp (Träumerei: ♩ = 80). Dùng bản Urtext để thấy ký hiệu của bản in đầu.\" Lý do: Struck: ♩ = 80 trong \"instructive edition\"; Seiffert: \"It is Clara Schumann's fault that the basic tempi … are often not taken seriously\". \"Sửa nhiều dấu nhấn\", \"nhiều bản in phổ thông dựa vào đó\" chưa có nguồn đã mở. Số máy đếm nhịp không phải do Schumann ghi (Henle Comments), nên viết \"bản in đầu\". Review D6-L4-gom: đã xem chữ trên trang (và dữ liệu), khớp câu; lượt 2 xác nhận chữ đã sửa. Giữ."
