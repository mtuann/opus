  - id: n21
    cau: Horowitz chơi bài này ở cuối buổi hòa nhạc trở lại Carnegie Hall ngày 9/5/1965 và trong buổi diễn ở Moskva năm 1986; cả hai buổi đều có đĩa thu trực tiếp.
    loai: lich-su
    nguon:
      - qobuz-1965
      - qobuz-1986
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Vladimir Horowitz hay chơi bài này như một bản encore: … (bản ghi hình cho thấy khán giả rơi lệ). Cách chơi của ông chậm, tự do, rất hát, khác hẳn một bản thu theo đúng ♩ = 100." Chữ mới: câu ở cột này. Lý do: Qobuz (Sony Classical): Träumerei là bài cuối của đĩa Carnegie Hall 9/5/1965; DG "Horowitz in Moscow" ℗ 1986 có Träumerei; "khán giả rơi lệ", "chậm, tự do, rất hát" không có nguồn đã mở.'
  - id: n22
    cau: So sánh tốc độ của Horowitz với ♩ = 100 và với bản thu trọn Kinderszenen của nghệ sĩ khác (ví dụ Martha Argerich, Deutsche Grammophon).
    loai: ten
