ghi_chu: 'Bài học Träumerei Op. 15 số 7 (tầng Tác phẩm). Bản nhạc: Mutopia SchumannOp15No07 (theo "Leichte Stücke", 1900; .ly, .mid tải 05/11/2026), đọc bằng script Python (mido); đối chiếu thêm ấn bản Peters (Internet Archive robschumannswerk01schu, ảnh trang). 24 ô và nhịp lấy đà, ô 1–8 nhắc lại; ritard. ô 8, 16, ritardando ô 22; fermata ô 22 (bản Mutopia 1900 in thêm fermata ở hợp âm cuối, trang theo Henle/Seiffert: một fermata). Lịch sử và tốc độ: Henle HN 44 (lời tựa Herttrich 2007, Comments), bài viết Seiffert (Henle 2010), phỏng vấn Struck (Henle 2010), Henle Blog 2021. Sửa trang: n11 (Album für die Jugend: "cho người trẻ tập đàn", bỏ "cho con mình"), n16 (Struck), n21, n22 (Horowitz: bỏ "khán giả rơi lệ" và đánh giá; bỏ Brendel), n42 (dấu ngân, không phải "dấu lặng ngân"), n67 (ấn bản Clara: số máy đếm nhịp, bỏ "sửa nhiều dấu nhấn"), n79 (mục Nguồn). Không có câu chưa chắc. Câu ở hồ sơ khác (đã khóa): piano/tieng-dan n57 (một bàn tay vừa hát vừa đệm: giữ, n4); chopin-prelude-mi-thu n73, tchaikovsky-cau-nguyen-buoi-sang n72 (giai điệu hát, nhiều bè, legato bằng ngón và bàn đạp: giữ, n2, n7, chỗ khó); schumann-album n69 gọi Träumerei là "bản nổi tiếng nhất của Kinderszenen": trang này không viết câu ấy; nguồn bậc 2 gần nhất là Seiffert (Henle): "Robert Schumann''s probably most famous piano composition from the Children''s Scenes cycle" (có chữ "probably"): người giao cân nhắc khi mở khóa schumann-album (thêm "có lẽ" hay ghi nguồn). Không tính là nhận định: tiêu đề mục, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (hồ sơ du-lieu/tac-pham/schumann-traumerei), mốc trong ::khoi-nghe. Thuật ngữ có trong src/data/thuat-ngu.yml: fermata, ritardando, rubato, cantabile, legato, crescendo; bè tenor, bàn đạp nối theo trang đã khóa.'
