khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Câu 1 ô 1–8, 3/4, L:1/8, K:Gm. Ấn bản: Bach-Gesellschaft qua Mutopia anna-magdalena-05 (.ly và .mid). Công cụ: script Python (mido) in nốt MIDI theo ô, đối chiếu từng nốt cả hai tay. Kết quả: 8/8 ô khớp cao độ và trường độ hai tay (tay phải Si♭5 La5 Sol5 | La5 Rê5 Rê5 | Sol5 Sol4 La4 Si♭4 Đô5 | Rê5 | Mi♭5 Fa5 Mi♭5 Rê5 Đô5 | Rê5 Mi♭5 Rê5 Đô5 Si♭4 | Đô5 Rê5 Đô5 Si♭4 Đô5 | La4; tay trái Sol3 | Fa3 | Mi♭3 | Rê3 Rê4 Đô4 Si♭3 La3 | Sol3+Si♭3 La3 | Si♭3 Sol3 | La3 Fa♯3 Sol3 | Rê3 Rê4 Đô4 Si♭3 La3). Láy trên ô 8 (!uppermordent!) đúng "\prall" của bản. Số ngón chơi được.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '7 ô 3/4, đủ phách. Ô 1–2 Sol trưởng (=B), ô 3–4 Sol thứ (Si♭) cùng thế tay; ô 5–7 Rê Đô Si♭ | Đô La Fa♯ | Sol trên Sol thứ – Rê trưởng – Sol thứ: Fa♯ cảm âm về Sol, đúng điều trang nói. Ngón chơi được, vừa chặng 2.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4. Ô 1 tay phải Sol4–Rê5 chạy, tay trái Sol3 giữ; ô 2 tay phải Rê5 giữ, tay trái Rê4 Đô4 Si♭3 La3 Sol3; ô 3 Đô5 Si♭4 La4 Sol4 Fa♯4 trên Rê3; ô 4 Sol. Đúng mô tả; ngón chơi được.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 3/4, đủ phách (ô 3: bốn móc kép + La trắng = 6 móc đơn). Nốt đen có dấu chấm, móc đơn trong dấu luyến (ô 1); ô 3 viết ra láy trên từ nốt trên Si♭; ô 4 La có láy trên Rê3 như ô 8 của bài. Ngón 3-2 cho láy chơi được.'
doi_chu:
  - cu: "Bè trầm biết hát. Bốn ô đầu, tay trái đi xuống Sol – Fa – Mi♭ – Rê bằng nốt trắng chấm dôi: bốn bậc từ chủ âm xuống át âm, một công thức rất quen của giọng thứ thời Baroque. Giữ đủ trường độ, bạn sẽ nghe hai tay như hai giọng hát."
    moi: "Bè trầm biết hát. Bốn ô đầu, tay trái đi xuống Sol – Fa – Mi♭ – Rê, ba nốt đầu là nốt trắng chấm dôi: bốn bậc từ chủ âm xuống át âm. Giữ đủ trường độ, bạn sẽ nghe hai tay như hai giọng hát."
    ly_do: 'n5 (da-sua): ô 4 tay trái là Rê nốt đen rồi móc đơn (Mutopia, Bach-Gesellschaft); bỏ vế "công thức rất quen" chưa có nguồn đọc được.'
  - cu: "Nghe ít nhất hai bản: một bản trên harpsichord (Gustav Leonhardt, Igor Kipnis và Richard Egarr đều đã thu cặp minuet này) hoặc trên clavichord (Mahan Esfahani), và một bản trên piano. Nếu được, nghe trọn cặp theo thứ tự trưởng – thứ – trưởng. Mỗi lần nghe, chú ý một điều:"
    moi: "Nghe ít nhất hai bản: một bản trên harpsichord hoặc clavichord (ví dụ Igor Kipnis, hay Mahan Esfahani trên clavichord), và một bản trên piano. Nếu được, nghe trọn cặp theo thứ tự trưởng – thứ – trưởng. Mỗi lần nghe, chú ý một điều:"
    ly_do: "n19 (da-sua): chỉ giữ bản thu đã thấy trong danh mục đĩa (Kipnis: Apple Music; Esfahani: Hyperion)."
  - cu: Giai điệu và bè trầm cùng đi xuống; tay trái Sol – Fa – Mi♭ – Rê bằng nốt trắng chấm dôi
    moi: Giai điệu và bè trầm cùng đi xuống; tay trái Sol – Fa – Mi♭ (nốt trắng chấm dôi) – Rê
    ly_do: "n24 (da-sua): như n5."
  - cu: "Hans-Joachim Schulze, bài viết về cặp minuet và tổ khúc của Petzold, Bach-Jahrbuch 1979 (in năm 1980): bằng chứng chính cho việc ghi tên Petzold."
    moi: "Hans-Joachim Schulze, bài viết về cặp minuet và tổ khúc của Petzold, Bach-Jahrbuch 65 (1979), tr. 45–64 (bản số hóa): bằng chứng chính cho việc ghi tên Petzold."
    ly_do: "n75 (da-sua): số tập, trang theo bản số hóa đã đọc; năm in 1980 không có nguồn đọc được."
  - cu:
      - "Trong tổ khúc cho harpsichord của Petzold, nơi chúng được tìm thấy, hai minuet hợp thành một chương, bên cạnh tám chương khác, và được chơi theo thứ tự: Sol trưởng, Sol thứ, rồi Sol trưởng lần nữa (da capo). Minuet thứ hai, cùng chủ âm nhưng khác màu, giữ vai trò tương phản mà về sau người ta gọi là trio (xem Minuet và Trio)."
      - 'Petzold viết cho harpsichord: dây được gảy, tiếng tắt nhanh, to nhỏ không đổi theo lực ngón, nên câu nhạc được "nói" bằng phát âm và nhịp điệu. Piano hiện đại ngân lâu và dễ to nhỏ, nhưng cũng dễ làm mọi thứ dính và nặng (xem Lịch sử cây đàn piano và thời Baroque).'
    moi:
      - "Trong tổ khúc cho harpsichord của Petzold, nơi chúng được tìm thấy, hai minuet hợp thành một chương, bên cạnh các chương prelude, allemande, courante, sarabande, bourrée, gigue và passepied (kèm trio), và được chơi theo thứ tự: Sol trưởng, Sol thứ, rồi Sol trưởng lần nữa (da capo). Minuet thứ hai, cùng chủ âm nhưng khác màu, giữ vai trò tương phản mà về sau người ta gọi là trio (xem Minuet và Trio)."
      - 'Petzold viết cho harpsichord: dây được gảy, to nhỏ không đổi theo lực ngón, nên câu nhạc được "nói" bằng phát âm và nhịp điệu. Piano hiện đại dễ to nhỏ, nhưng cũng dễ làm mọi thứ dính và nặng (xem Lịch sử cây đàn piano và thời Baroque).'
    ly_do: 'n13 (da-sua): Schulze (Bach-Jahrbuch 1979, tr. 54–56) in các chương của tổ khúc; tính cặp minuet là một chương thì còn bảy chương khác, nên liệt kê tên. n16 (da-sua): nguồn đã mở (Met) chỉ nói gảy dây và lực ngón; bỏ "tiếng tắt nhanh", "ngân lâu".'
  - cu: "Ngón gợi ý: Rê 1, Mi 2, Fa♯ 3, luồn ngón cái sang Sol 1, La 2, Si♭ 3. Tập gam Sol thứ giai điệu ở Gam và ngón bấm trước"
    moi: "Ngón gợi ý: Rê 1, Mi 2, Fa♯ 3, luồn ngón cái sang Sol 1, La 2, Si♭ 3. Tập trước gam Sol thứ hòa âm ở Gam và ngón bấm (trang ấy chưa có ngón gam thứ giai điệu)"
    ly_do: "n52 (da-sua): trang piano/gam chỉ có gam thứ hòa âm, ghi rõ chưa đưa ngón gam thứ giai điệu."
