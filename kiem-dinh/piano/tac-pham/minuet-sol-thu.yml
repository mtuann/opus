nhan_dinh:
  - id: n1
    cau: Đây là bài thứ hai của cặp minuet trong cuốn sổ tay năm 1725 của Anna Magdalena Bach, đi liền sau Minuet Sol trưởng (bài số 5, ngay sau bài số 4).
    loai: danh-muc
    nguon: [ imslp-nb ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "4. Menuet G-dur, BWV Anh.114; 5. Menuet g-moll, BWV Anh.115".'
  - id: n2
    cau: Cùng nhịp 3/4, cùng 32 ô nhịp với Minuet Sol trưởng.
    loai: cau-truc
    nguon: [ mut-anh115, schulze-1979 ]
    ket_qua: dung
    ghi_chu: 'Mutopia: 3/4, hai đoạn 16 ô có nhắc lại; Schulze tr. 56: Menuet 2 "16 :||: 16 T.".'
  - id: n3
    cau: Cùng độ khó với Minuet Sol trưởng.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'src/data/tac-pham.yml (chang đã khóa): cả hai chang 2. Mức Henle 1 cho cả hai đã ghi ở hồ sơ khóa du-lieu/tac-pham/minuet-sol n4.'
  - id: n4
    cau: Trong giọng thứ, bè trầm đi xuống từng bậc, nốt Fa♯ kéo về Sol.
    loai: cau-truc
    nguon: [ mut-anh115 ]
    ket_qua: dung
    ghi_chu: 'Tay trái ô 1–4 Sol3 Fa3 Mi♭3 Rê3; Fa♯ đi lên Sol ở ô 7 (Fa♯3–Sol3), ô 31–32 (Fa♯4–Sol4).'
  - id: n5
    cau: 'Bốn ô đầu, tay trái đi xuống Sol – Fa – Mi♭ – Rê, ba nốt đầu là nốt trắng chấm dôi: bốn bậc từ chủ âm xuống át âm.'
    loai: cau-truc
    nguon: [ mut-anh115 ]
    ket_qua: da-sua
    ghi_chu: 'Cũ: "tay trái đi xuống Sol – Fa – Mi♭ – Rê bằng nốt trắng chấm dôi: bốn bậc từ chủ âm xuống át âm, một công thức rất quen của giọng thứ thời Baroque." MIDI Mutopia: ô 1–3 Sol3, Fa3, Mi♭3 trắng chấm dôi; ô 4 Rê3 nốt đen rồi Rê4 Đô4 Si♭3 La3 móc đơn. Bỏ "công thức rất quen của giọng thứ thời Baroque": chưa tìm được nguồn bậc 1–2 đọc được.'
  - id: n6
    cau: Petzold chưa từng biết cây đàn piano (ông viết cho harpsichord).
    loai: lich-su
    nguon: [ schulze-1979, met-crist ]
    ket_qua: dung
    ghi_chu: 'Tổ khúc là "Svite de Clavecin" (Schulze tr. 54). Pianoforte của Cristofori có từ khoảng 1700 ở Florence (Met) nhưng Petzold không viết cho nó; "chưa từng biết" là cách nói, đúng về ý bài không viết cho piano. Review cân nhắc.'
  - id: n7
    cau: 'Giọng thứ có những nốt riêng (Fa♯, Mi♮) và một đường đi hòa âm riêng.'
    loai: dinh-nghia
    nguon: [ omt-minor ]
    ket_qua: dung
    ghi_chu: 'OMT: gam thứ hòa âm nâng bậc 7 (Fa♯ ở Sol thứ), gam thứ giai điệu nâng bậc 6 và 7 khi đi lên (Mi♮, Fa♯).'
  - id: n8
    cau: 'Hóa biểu chỉ có Si♭ và Mi♭; gần như mỗi lần nhạc dừng trên hợp âm Rê hay kết ở Sol thứ đều có Fa♯, cảm âm nằm dưới chủ âm nửa cung.'
    loai: cau-truc
    nguon: [ mut-anh115, omt-minor ]
    ket_qua: dung
    ghi_chu: 'Mutopia: \key g \minor. Fa♯ ở ô 7 (trước chỗ dừng ô 8), ô 27–29, 31 (trước kết ô 32). OMT: "leading tone" là bậc 7 nâng, cách chủ âm nửa cung.'
  - id: n9
    cau: Link Gam thứ.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: src/content/docs/nhac-ly/07-gam-thu.md có, nói cảm âm và gam thứ giai điệu.
