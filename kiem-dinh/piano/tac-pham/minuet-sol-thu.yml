    ghi_chu: 'Cũ: "(Gustav Leonhardt, Igor Kipnis và Richard Egarr đều đã thu cặp minuet này) hoặc trên clavichord (Mahan Esfahani)". Mới: "hoặc clavichord (ví dụ Igor Kipnis, hay Mahan Esfahani trên clavichord)". Như hồ sơ minuet-sol n28.'
  - id: n20
    cau: Nghe ít nhất hai bản, nghe trọn cặp trưởng – thứ – trưởng nếu được; mỗi lần nghe chú ý một điều (màu thứ, bè trầm, phát âm, nốt hoa mỹ, tốc độ).
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n21
    cau: Cuối đoạn A sáng hẳn (đoạn A kết ở Si♭ trưởng).
    loai: cau-truc
    nguon: [ mut-anh115 ]
    ket_qua: dung
    ghi_chu: Ô 16 hợp âm Si♭ trưởng (Rê4 Fa4 Si♭4 trên Si♭3–Si♭2).
  - id: n22
    cau: 'Theo dõi khi nghe, câu 1 (ô 1–8): giai điệu đi xuống từ Si♭ cao rồi nhảy xuống Rê; tay trái đi xuống Sol – Fa – Mi♭ – Rê; câu dừng lơ lửng trên hợp âm Rê (kết nửa).'
    loai: cau-truc
    nguon: [ mut-anh115, omt-intro ]
    ket_qua: dung
    ghi_chu: 'Ô 1–2 Si♭5 La5 Sol5 | La5 Rê5 Rê5; ô 8 La4 trên Rê3 Rê4 Đô4 Si♭3 La3 (V của Sol thứ): kết nửa.'
  - id: n23
    cau: 'Câu 2 (ô 9–16): mở đầu như câu 1, rồi rẽ sang Si♭ trưởng; màu sáng lên và kết trọn ở Si♭ trưởng.'
    loai: cau-truc
    nguon: [ mut-anh115 ]
    ket_qua: dung
    ghi_chu: 'Ô 9–12 như ô 1–4 (tay trái ô 12 có Si♮); ô 15 Rê5 Sol5 Đô5 trên Si♭3 Mi♭3 Fa3 La3, ô 16 Si♭: V–I ở Si♭ trưởng.'
  - id: n24
    cau: 'Bảng cấu trúc, câu 1: Sol thứ, kết nửa ở ô 8 (dừng trên hợp âm Rê); giai điệu và bè trầm cùng đi xuống; tay trái Sol – Fa – Mi♭ (nốt trắng chấm dôi) – Rê; Fa♯ đầu tiên ở tay trái ô 7; ô 4 và 8 tay phải giữ, tay trái chạy.'
    loai: cau-truc
    nguon: [ mut-anh115 ]
    ket_qua: da-sua
    ghi_chu: 'Cũ: "tay trái Sol – Fa – Mi♭ – Rê bằng nốt trắng chấm dôi" (Rê ở ô 4 là nốt đen). Mới: "tay trái Sol – Fa – Mi♭ (nốt trắng chấm dôi) – Rê". Phần còn lại đúng: Fa♯3 ở ô 7 là Fa♯ đầu tiên; ô 4 tay phải Rê5 trắng chấm dôi, ô 8 La4.'
  - id: n25
    cau: 'Bảng cấu trúc, câu 2: sang Si♭ trưởng, giọng trưởng song song của Sol thứ; kết trọn ở ô 16; ô 9–12 như ô 1–4 (tay trái ô 12 có Si♮); ô 13–16 hợp âm Sol – Đô – Fa – Si♭ theo vòng quãng năm.'
    loai: cau-truc
    nguon: [ mut-anh115, omt-minor ]
    ket_qua: dung
    ghi_chu: 'OMT: giọng trưởng song song có chủ âm cao hơn ba nửa cung (Sol → Si♭). Tay trái ô 12 Rê4 Đô4 Si♮3 La3; ô 13 Si♮3–Rê4 trên Sol3 (Sol), ô 14 Đô4 La3 Fa3 (Đô rồi Fa), ô 15 Si♭3 Mi♭3 Fa3–La3, ô 16 Si♭: chuỗi gốc Sol – Đô – Fa – Si♭ đi theo quãng năm.'
  - id: n26
    cau: 'Câu 3 (ô 17–24): giai điệu leo lên Si♭ cao, dừng ở Fa trưởng (ô 20), rồi chuỗi móc đơn đi lên ở ô 21 đưa về Si♭ trưởng (ô 24); Mi♮ cuối ô 17 dẫn sang Fa trưởng; ô 18 hai tay đi ngược chiều; Si♭ cao trở lại ở ô 19.'
    loai: cau-truc
    nguon: [ mut-anh115 ]
    ket_qua: dung
    ghi_chu: 'Ô 17 tay phải Rê5 Si♭4 Đô5 Rê5 Mi♮5 (LilyPond "e!"); ô 18 tay phải Fa5 Sol5 La5 đi lên, tay trái La3 Sol3 Fa3 đi xuống; ô 19 Si♭5; ô 20 La5 Sol5 La5 Fa5 trên Fa3; ô 21 Fa4 Sol4 La4 Si♭4 Đô5 Rê5; ô 24 Si♭4 trên Si♭2.'
  - id: n27
    cau: 'Câu 4 (ô 25–32): màu tối trở lại, qua Đô thứ; nốt nhảy zíc zắc ở ô 27; dừng trên hợp âm Rê (ô 28); ô 29 gam Sol thứ giai điệu đi lên Rê – Mi♮ – Fa♯ – Sol – La – Si♭; láy ngắn ở ô 31; kết trọn ở Sol thứ (ô 32).'
    loai: cau-truc
    nguon: [ mut-anh115, omt-minor ]
    ket_qua: dung
    ghi_chu: 'Ô 26 Sol4 Mi♭5 Rê5 Mi♭5 trên Đô4 (Đô thứ); ô 27 Sol4 Rê5 Fa♯4 Đô5 Sol4 Si♭4; ô 28 La4 trên Rê4 La3 Sol3 Fa♯3 Mi3; ô 29 Rê4 Mi4 Fa♯4 Sol4 La4 Si♭4; ô 31 láy trên Si♭4; ô 32 Sol thứ. OMT: gam thứ giai điệu đi lên nâng bậc 6 và 7.'
  - id: n28
    cau: 'Dấu hóa bất thường ở câu 4: Si♮ (ô 25), Fa♯ (ô 27, 28, 29, 31), Mi♮ (ô 28, 29).'
    loai: cau-truc
    nguon: [ mut-anh115 ]
    ket_qua: dung
