    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: src/content/docs/piano/lich-su-dan.md (bảng harpsichord, clavichord) và lich-su/thoi-ky/baroque.md có.
  - id: n19
    cau: Igor Kipnis đã thu cặp minuet; Mahan Esfahani thu cặp minuet trên clavichord.
    loai: ten
    nguon: [ apple-kipnis, hyperion-esf ]
