  - id: n11
    cau: 'Bài cùng nằm trong sổ tay 1725, cùng được xác định là của Christian Petzold chứ không phải của Bach.'
    loai: lich-su
    nguon: [ imslp-anh115, schulze-1979 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Pezold, Christian"; "formerly attributed to Johann Sebastian Bach as BWV Anhang 115". Schulze tr. 56.'
  - id: n12
    cau: Link trang Minuet Sol trưởng (có câu chuyện đầy đủ và cách đọc ký hiệu BWV Anh.).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: src/content/docs/piano/tac-pham/minuet-sol.md có mục Bối cảnh kể việc ghi tên Petzold và giải thích Anh. (phụ lục).
  - id: n13
    cau: 'Trong tổ khúc cho harpsichord của Petzold, hai minuet hợp thành một chương, bên cạnh các chương prelude, allemande, courante, sarabande, bourrée, gigue và passepied (kèm trio), và được chơi theo thứ tự Sol trưởng, Sol thứ, rồi Sol trưởng lần nữa (da capo).'
    loai: cau-truc
    nguon: [ schulze-1979 ]
    ket_qua: da-sua
    ghi_chu: 'Cũ: "bên cạnh tám chương khác". Schulze tr. 54–56 in mở đầu từng chương: Prelude, Allemande, Courante, Sarabande, Bourrée, Menuet alternativement, Menuet 2 ("On reprend le premier Menuet."), Gigve, Passepied alternativement, Trio ("Passepied da Capo. Fin."). Nếu cặp minuet tính là một chương thì passepied và trio cũng là một: còn 7 chương khác, không phải 8. Liệt kê tên chương để khỏi phụ thuộc cách đếm.'
  - id: n14
    cau: Minuet thứ hai, cùng chủ âm nhưng khác màu, giữ vai trò tương phản mà về sau người ta gọi là trio.
    loai: lich-su
    nguon: [ cod-minuet ]
    ket_qua: dung
    ghi_chu: 'COD: minuet có phần B là một minuet tương phản "called trio"; hình thức ABA.'
  - id: n15
    cau: Link Minuet và Trio.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: src/content/docs/hinh-thuc/minuet-trio.md có.
  - id: n16
    cau: 'Harpsichord: dây được gảy, to nhỏ không đổi theo lực ngón; piano hiện đại dễ to nhỏ.'
    loai: dinh-nghia
    nguon: [ met-crist ]
    ket_qua: da-sua
    ghi_chu: 'Cũ: "dây được gảy, tiếng tắt nhanh, to nhỏ không đổi theo lực ngón ... Piano hiện đại ngân lâu và dễ to nhỏ". Met: harpsichord "jack and quill action", không đáp ứng lực ngón; pianoforte ra đời để to nhỏ theo lực. Bỏ "tiếng tắt nhanh" và "ngân lâu": nguồn đã mở không nói.'
  - id: n17
    cau: Câu nhạc trên harpsichord được "nói" bằng phát âm và nhịp điệu; trên piano dễ làm mọi thứ dính và nặng.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
