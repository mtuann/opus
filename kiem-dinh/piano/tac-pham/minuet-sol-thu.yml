ghi_chu: 'Bài học Minuet Sol thứ BWV Anh. 115 (tầng Tác phẩm). Bản nhạc: Mutopia anna-magdalena-05 (.ly và .mid, nguồn Bach-Gesellschaft, Allen Garvin), đối chiếu từng nốt bằng script Python (mido) theo ô. Lịch sử: Schulze, Bach-Jahrbuch 65 (1979) (bản số hóa, ảnh scan; tr. 54–58, 64), như hồ sơ trang minuet-sol. Sửa trang ở lượt 1: n5 (tay trái ô 4 không phải nốt trắng chấm dôi; bỏ "công thức rất quen" không có nguồn), n13 (liệt kê các chương thay "tám chương khác"), n16 (bỏ "tiếng tắt nhanh", "ngân lâu"), n19 (tên nghệ sĩ thu âm), n24 (bảng câu 1), n52 (trang Gam và ngón bấm chưa có gam thứ giai điệu), n75 (mục Nguồn, bài Schulze). Thuật ngữ "láy trên" (răng cưa không gạch) theo src/data/thuat-ngu.yml (mordent: "Không gạch là láy trên"); trang minuet-sol gọi cùng ký hiệu là "láy rền ngắn" như trang Nốt hoa mỹ: người giao cân nhắc thống nhất. Không tính là nhận định: tiêu đề, tiêu đề cột, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep, ::cong-cu dựng, mốc trong ::khoi-nghe.'
