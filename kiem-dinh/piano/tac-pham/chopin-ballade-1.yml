  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "số 3 (La♭ trưởng, Op. 47) thường được coi là \"dễ\" nhất trong bốn bản; số 2 và số 4 khó hơn, nhất là số 4." Henle HN 862: op. 23, 38, 47 "8 difficult", op. 52 "9 difficult". Không có nguồn cho "số 3 dễ nhất". doi_chu.'
