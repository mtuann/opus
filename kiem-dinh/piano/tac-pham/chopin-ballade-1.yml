- id: n6
  cau: 'Cùng một giai điệu có thể thì thầm rồi bùng nổ fortissimo: chủ đề 2 vào sotto voce ở ô 68 rồi trở lại ff ở La trưởng và Mi♭ trưởng.'
  loai: cau-truc
  nguon:
  - mutopia-op23
  ket_qua: dung
  ghi_chu: 'Mutopia: "Meno mosso. sotto voce pp" ô 67–68; "ff" quanh ô 108 (La trưởng) và ô 165–166 (Mi♭ trưởng).'
- id: n7
  cau: Bài có tiếng hát, hợp âm dày, quãng tám, nhảy xa, lướt nhẹ, bàn đạp nhiều tầng.
  loai: cau-truc
  nguon:
  - mutopia-op23
  ket_qua: dung
  ghi_chu: 'Mutopia: hợp âm và quãng tám ff ô 106–125, 166–193; leggiero ô 150–158; gam và quãng tám ở coda. "Đa tiết tấu": liên ba, liên năm (\times 3/5 ô 170–172, \times 4/5 ô 207) có trong .ly.'
- id: n8
  cau: Học cách Chopin biến đổi chủ đề là học cách diễn tấu các tác phẩm Lãng mạn lớn.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n9
  cau: Henle gọi đây là một trong những tác phẩm được yêu thích nhất của Chopin và ghi bài thuộc danh sách thi bằng LRSM của ABRSM.
  loai: cap-do
  nguon:
  - henle-hn867-vorwort
  - henle-hn867
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bài này được biểu diễn rất thường xuyên trong hòa nhạc và các cuộc thi piano." Không kiểm được. Chữ mới: Henle lời tựa "The g-minor-Ballade is one of Chopin’s most popular works"; trang HN 867 "ABRSM: Piano LRSM". doi_chu.'
- id: n10
  cau: Chưa chơi vững một tác phẩm Grade 8 thì nên đợi; ví dụ Clair de lune (link).
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/data/tac-pham.yml (đã khóa): debussy-clair-de-lune grade "Grade 8", chặng 6. Trang đích chưa chuyển: ../opus-zero/docs/piano/tac-pham/debussy-clair-de-lune.md có.'
- id: n11
  cau: Coda có thể gây đau cổ tay, cẳng tay nếu tập sai hay tập quá sớm; đọc trang Giữ đôi tay khỏe.
  loai: quy-tac
  nguon:
  - bapam
  ket_qua: dung
  ghi_chu: 'Sức khỏe: không xếp khuyen-tap. BAPAM: "minimising tension between repetitive octaves or large chords", "If you experience pain, stop immediately". Link /opus/piano/suc-khoe/ có (chữ link "Sức khỏe khi chơi đàn", tiêu đề trang "Giữ đôi tay khỏe").'
- id: n12
  cau: Chopin là người đầu tiên đặt tên ballade cho một tác phẩm khí nhạc không lời.
  loai: lich-su
  nguon:
  - henle-hn867-vorwort
  - cod-ballade
  ket_qua: dung
  ghi_chu: 'Henle: Schumann 1842 "Chopin was the first to apply the word Ballade to music"; "for the first time applied the term to a work for solo piano". COD: "A term given by Chopin…". Khớp hồ sơ đã khóa piano/the-loai n44.'
- id: n13
  cau: Chữ ballade vốn chỉ một thể thơ kể chuyện, nhiều khi là truyền thuyết, được các nhà thơ Lãng mạn ưa chuộng.
  loai: dinh-nghia
  nguon:
  - henle-hn867-vorwort
  ket_qua: dung
  ghi_chu: 'Henle: "folk ballade, a strophically-constructed poem that described a dramatic, often also a demonic or mystical scenario … The Romantics and their circle took it up with particular enthusiasm".'
- id: n14
  cau: Lịch sử sáng tác ít tài liệu; hợp đồng in với Breitkopf & Härtel ký ngày 9/1/1836 nên bài xong năm 1835, ở Paris; IMSLP ghi một bản đầu có thể từ năm 1831, kèm dấu hỏi.
  loai: nam
  nguon:
  - henle-hn867-vorwort
  - imslp-op23
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ballade số 1 được phác thảo trong những tháng Chopin ở Vienna năm 1831, khi cuộc khởi nghĩa tháng Mười Một ở Ba Lan đang đi đến thất bại, rồi hoàn thành ở Paris." Henle: "The compositional history … is sparsely documented, and the surviving autograph is undated … Thus the work was composed in 1835." IMSLP: "1831? (first version), 1834-35? (final version)". Không có nguồn đã mở nói phác thảo ở Vienna; bỏ vế khởi nghĩa (chỉ để gắn với năm 1831). doi_chu.'
- id: n15
  cau: Từ năm 1831 Chopin sống ở Paris cho đến khi mất.
  loai: lich-su
  nguon:
  - henle-hn1320
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chopin không bao giờ trở về quê hương nữa." Henle (About the Composer): "1831 … he goes to Paris, where he will remain until the end of his life". Viết theo nguồn, như hồ sơ chopin-valse-si-thu n12. doi_chu.'
- id: n16
  cau: Schumann, thư gửi Heinrich Dorn ngày 14/9/1836, khen đây là một trong những tác phẩm xuất sắc nhất của Chopin; khi ông nói mình thích nó nhất, Chopin lặng nghĩ rồi đáp ông cũng thích nó nhất.
  loai: lich-su
  nguon:
  - henle-hn867-vorwort
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "trong một lá thư năm 1836, viết rằng đây là tác phẩm \"gần với thiên tài của Chopin nhất (dù không phải rực rỡ nhất)\"; … đó là tác phẩm thân thương nhất của ông." Henle trích nguyên văn: "Sie scheint mir sein genialischstes (nicht genialstes) Werk"; bản Anh của Henle: "one of his most brilliant (not most inspired) works … ‘That pleases me, for it is also my favourite’". Câu trích cũ dịch ngược nghĩa so với bản dịch của Henle; viết lại không trích, theo Henle. doi_chu.'
- id: n17
  cau: Schumann thuật lại rằng Chopin nói các ballade được gợi hứng từ thơ của Adam Mickiewicz, nhà thơ Ba Lan cũng sống ở Paris và quen Chopin.
  loai: lich-su
  nguon:
  - henle-hn867-vorwort
  ket_qua: da-sua
  ghi_chu: 'Henle: Schumann: Chopin "was inspired to write his Ballades by some poems of Adam Mickiewicz" (Gesammelte Schriften, 1914, II, 32); Mickiewicz "had left … Poland for Paris, where he numbered among the composer’s circle of acquaintances". Chữ cũ "nhà thơ lớn của Ba Lan, cũng sống lưu vong ở Paris": bỏ đánh giá "lớn", ghi "quen Chopin" theo Henle. doi_chu.'
- id: n18
  cau: Không có lời nào của Chopin còn lại cho thấy ông muốn chuyển nội dung một bài thơ cụ thể của Mickiewicz vào Ballade số 1; liên hệ với một bài thơ cụ thể là suy đoán của người đời sau.
  loai: lich-su
  nguon:
  - henle-hn867-vorwort
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chopin không bao giờ nói bài thơ nào gợi hứng cho Ballade số 1, và ông vốn không thích gán chương trình cho âm nhạc. Những liên hệ cụ thể (ví dụ với trường ca Konrad Wallenrod của Mickiewicz) là suy đoán của người đời sau." Henle: "no testimony from Chopin survives to support the idea that he was attempting to apply the poetic substance of Mickiewicz’s ballades to his own piano compositions". Bỏ "không thích gán chương trình" và ví dụ Konrad Wallenrod (chưa có nguồn đã mở). doi_chu.'
- id: n19
  cau: Hãy coi ballade như một cách kể, không phải cốt truyện để minh họa.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
  ghi_chu: 'Hợp với Henle: Chopin "likely allowing himself to be led by the atmosphere and narrative gesture of the literary ballades".'
- id: n20
  cau: Trong phim The Pianist (2002) của Roman Polanski, Szpilman chơi bài này cho sĩ quan Đức Wilm Hosenfeld; tiếng piano trong phim là của Janusz Olejniczak.
  loai: lich-su
  nguon:
  - wosu-pianist
  - sony-pianist
  ket_qua: da-sua
  ghi_chu: 'WOSU: Hosenfeld "orders him to play … he begins to play Chopin''s Ballade in G Minor"; "features the playing of Polish pianist Janusz Olejniczak throughout". Sony: phim của Polanski, nhạc phim phát hành 2002. Chữ cũ "một sĩ quan Đức; phần piano trong nhạc phim do Janusz Olejniczak thu": thêm tên Hosenfeld theo WOSU; năm 2002: thông cáo Sony (nhạc phim phát hành 26/11/2002), phim có Oscar 2003. doi_chu.'
