    ket_qua: dung
    ghi_chu: '6/4, L:1/8, K:Gm, Q:3/4=40 (hai phách trắng chấm mỗi ô, như lời dẫn). Mỗi ô 12 móc đơn cả hai tay. Tay phải D–C–E♭–D | C–B♭–D–nghỉ | B♭–A | G: dấu lặng cuối ô 2, nốt Mi♭ ở ô 1 đúng lời dẫn. Tay trái nốt trầm – hợp âm – hợp âm: Sol thứ, Rê bảy (A–C với F♯ ở ô 2, 3), Đô thứ (G–E♭), kết G–D–G. Ngón 3 2 4 3 | 2 1 3 | 2 1 | 1 chơi được. Hợp chặng 7.'
  - khoi: 2
    loai: vi-du-soan
