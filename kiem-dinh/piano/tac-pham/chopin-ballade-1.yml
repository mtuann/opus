  ghi_chu: 'Chữ cũ: "bản thảo của Chopin ghi Mi♭…; một số ấn bản cũ (ví dụ của Karl Klindworth) đưa Rê làm lựa chọn thay thế… Các bản Urtext hiện nay đều thảo luận chỗ này." Henle: "7 l: We give e♭1 in accordance with main source F, AFr … Later impression of Scholtz has d1 in the main text … Mikuli’s footnote … maintain the authenticity of this E♭ against the D of older editions … The d1 reading in G". Mutopia (Klindworth) ô 7 tay trái D3–G3–E♭4: Klindworth in Mi♭, không đưa Rê (.ly có ghi chú "Add ossia to bar 6", chưa làm). "Đều thảo luận" không kiểm được. doi_chu.'
