  ghi_chu: 'Chữ cũ: "Ấn bản Quốc gia Ba Lan (Jan Ekier) và Henle đều dựa trên các nguồn gốc và ghi rõ các biến thể. Tránh những bản in thế kỷ 19 thêm bàn đạp, ngón bấm và cả nốt của người biên tập mà không ghi chú." NE: "Redaktorzy Jan Ekier, Paweł Kamiński", "źródłowo-krytycznym". Henle bình chú liệt kê nguồn và biến thể. Câu khuyên chung về bản in thế kỷ 19 thay bằng một ví dụ có nguồn (Scholtz, Henle). doi_chu.'
