  ghi_chu: 'Chữ cũ dòng coda: "Coda bắt đầu quá to, quá nhanh, rồi không còn đường lên; hoặc …". Klindworth ghi ff ngay từ đầu coda (n37), nên bỏ vế "bắt đầu quá to". Lời khuyên, khong-can-nguon về nội dung. doi_chu.'
