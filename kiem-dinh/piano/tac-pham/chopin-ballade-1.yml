- id: n4
  cau: Trang này giúp hiểu cấu trúc, chọn cách tập và có kế hoạch 12 tuần.
  loai: ve-site
  ket_qua: dung
  ghi_chu: Trang có mục Cấu trúc, Chỗ khó và cách tập, Kế hoạch tập (bảng 12 tuần, tuần 1–12).
- id: n5
  cau: Sau những bài ba, bốn phút, đây là lần đầu người học phải giữ mạch một câu chuyện gần mười phút.
