doi_chu:
  - cu: Về \"câu chuyện\" của bài
    moi: Về "câu chuyện" của bài
    ly_do: 'Cú pháp: site cũ (MkDocs) in nguyên dấu \ trước dấu nháy trong tiêu đề hộp ghi chú; tiêu đề aside của site mới hiện đúng dấu nháy. Chữ không đổi.'
  - cu: Một mục tiêu biểu diễn thật. Bài này được biểu diễn rất thường xuyên trong hòa nhạc và các cuộc thi piano.
    moi: Một mục tiêu biểu diễn thật. Henle gọi đây là một trong những tác phẩm được yêu thích nhất của Chopin, và ghi bài thuộc danh sách thi bằng LRSM của ABRSM.
    ly_do: 'Kiểm định D6-L6 (n9): "biểu diễn rất thường xuyên" không kiểm được; thay bằng lời tựa Henle HN 867 ("one of Chopin’s most popular works") và trang HN 867 ("ABRSM: Piano LRSM").'
  - cu: Robert Schumann, trong một lá thư năm 1836, viết rằng đây là tác phẩm "gần với thiên tài của Chopin nhất (dù không phải rực rỡ nhất)"; khi ông nói với Chopin rằng mình thích nó nhất, Chopin đáp rằng ông cũng vậy, đó là tác phẩm thân thương nhất của ông. Schumann còn thuật lại rằng Chopin từng nói các ballade của mình được gợi hứng từ thơ của Adam Mickiewicz, nhà thơ lớn của Ba Lan, cũng sống lưu vong ở Paris.
    moi: Robert Schumann, trong thư gửi Heinrich Dorn ngày 14/9/1836, khen đây là một trong những tác phẩm xuất sắc nhất của Chopin; khi ông nói với Chopin rằng mình thích nó nhất, Chopin lặng nghĩ một lúc rồi đáp rằng ông cũng thích nó nhất. Schumann còn thuật lại rằng Chopin từng nói các ballade của mình được gợi hứng từ thơ của Adam Mickiewicz, nhà thơ Ba Lan cũng sống ở Paris và quen Chopin.
    ly_do: 'Kiểm định D6-L6 (n16, n17): thư trích theo lời tựa Henle HN 867 ("genialischstes (nicht genialstes)", bản Anh của Henle "one of his most brilliant (not most inspired) works"): câu trích cũ dịch ngược nghĩa. Mickiewicz: Henle ("among the composer’s circle of acquaintances"); bỏ đánh giá "nhà thơ lớn".'
  - cu: 'Chủ đề 1 trở lại (Sol thứ): trên âm nền Rê kéo dài, kết lửng; lắng xuống trước cơn bão'
    moi: 'Chủ đề 1 trở lại (Sol thứ, sotto voce): trên âm nền Rê kéo dài, lớn dần tới il più forte possibile rồi ập vào coda'
    ly_do: 'Kiểm định D6-L6 (n36): Mutopia (Klindworth) ô 194–206: sotto voce pp, sempre cresc., molto cresc., "appassionato il più forte possibile" ô 206; không lắng xuống. Cùng chỗ sửa ở dòng của bảng Cấu trúc.'
  - cu: 'Coda (Presto con fuoco, 2/2): từ pp lên forte possibile; gam hai tay xen kẽ, hợp âm, một mô-típ gợi lại phần mở đầu; kết bằng chuỗi quãng tám chạy'
    moi: 'Coda (Presto con fuoco, từ ô 208): hợp âm nhấn fz, gam quãng tám hai tay; kết bằng chuỗi quãng tám nửa cung hai tay chạy ngược chiều'
    ly_do: 'Kiểm định D6-L6 (n37): Mutopia (Klindworth): ff ở ô 208, "il più forte possibile" ở ô 206 trước coda; gam quãng tám ô 249–255; quãng tám nửa cung ngược chiều ô 258–261. Cùng chỗ sửa ở dòng Coda của bảng Cấu trúc. "2/2" chưa chắc (n38): bỏ khỏi hai bảng vì Klindworth in 4/4. Review D6-L6-gom: Bản in Pháp đầu (Schlesinger 1836, CFEO tr. 12) ghi ₵ và fz ở hợp âm đầu coda (ô 208); ff là của Klindworth (lượt 2 n37).'
  - cu: 'Coda: bắt đầu từ pp thật sự, để còn chỗ đi lên.'
    moi: 'Coda: bản in đầu chỉ ghi fz ở hợp âm đầu, ngay sau il più forte possibile; ấn bản Klindworth ghi ff ngay từ đầu và fff ở những ô cuối; giữ tiếng to mà tròn, dành phần to nhất cho những ô cuối.'
    ly_do: 'Kiểm định D6-L6 (n68): Mutopia (Klindworth) ff ô 208, fff ô 258. Review D6-L6-gom: Bản in Pháp đầu chỉ ghi fz ở đầu coda; Klindworth ghi ff, fff (lượt 2 n68): ghi rõ cả hai ấn bản.'
  - cu: Ấn bản Quốc gia Ba Lan (Jan Ekier) và Henle đều dựa trên các nguồn gốc và ghi rõ các biến thể. Tránh những bản in thế kỷ 19 thêm bàn đạp, ngón bấm và cả nốt của người biên tập mà không ghi chú.
    moi: 'Ấn bản Quốc gia Ba Lan (biên tập Jan Ekier, Paweł Kamiński) và Henle đều dựa trên các nguồn gốc và ghi các biến thể. Bản in thế kỷ 19 có chỗ khác nguồn gốc: theo Henle, bản Scholtz in sau đổi Mi♭ ở ô 7 thành Rê. Khi so ấn bản, xem phần chú thích nguồn.'
    ly_do: 'Kiểm định D6-L6 (n72): người biên tập theo trang Wydanie Narodowe; câu khuyên chung thay bằng ví dụ có nguồn (bình chú Henle HN 867).'
  - cu: Coda bắt đầu quá to, quá nhanh, rồi không còn đường lên; hoặc tốc độ vượt quá khả năng, nốt rơi rụng.
    moi: Coda nhanh quá khả năng, nốt rơi rụng.
    ly_do: 'Kiểm định D6-L6 (n73): Klindworth ghi ff ngay từ đầu coda (n37), nên bỏ vế "bắt đầu quá to".'
  - cu: 'Ballade khác: số 3 (La♭ trưởng, Op. 47) thường được coi là "dễ" nhất trong bốn bản; số 2 và số 4 khó hơn, nhất là số 4.'
    moi: 'Ballade khác: Henle xếp số 2 (Fa trưởng, Op. 38) và số 3 (La♭ trưởng, Op. 47) cùng mức 8 như số 1, số 4 (Fa thứ, Op. 52) mức 9.'
    ly_do: 'Kiểm định D6-L6 (n75): Henle HN 862 (op. 23, 38, 47 mức 8; op. 52 mức 9). Không nguồn cho "số 3 dễ nhất".'
  - cu: Phác thảo ở Vienna năm 1831, hoàn thành ở Paris năm 1835; in năm 1836 đồng thời ở Leipzig, Paris và London. Đề tặng "Monsieur le Baron de Stockhausen", một nhà ngoại giao của Hanover ở Paris
    moi: Hoàn thành năm 1835, ở Paris (hợp đồng in ký ngày 9/1/1836); IMSLP ghi một bản đầu có thể từ năm 1831. In năm 1836 ở Leipzig (tháng 6), Paris (tháng 7) và London (tháng 8). Đề tặng "Mr le Baron de Stockhausen", đại sứ của Hanover ở Paris
    ly_do: 'thong_tin của bản ghi (plans/lam-lai/bao-cao/d6-l6/sua-A.yml): Lời tựa Henle HN 867: lịch sử sáng tác ít tài liệu, hợp đồng Breitkopf 9/1/1836, "Thus the work was composed in 1835"; bản Đức 6/1836, Pháp 7/1836, Anh 8/1836 (không đồng thời). Không nguồn đã mở nói phác thảo ở Vienna; IMSLP "1831? (first version)". Đề tặng theo trang bìa bản tay (Henle) và IMSLP ("Hanover''s ambassador to Paris"). Trang bài học đã viết theo cùng nguồn (hồ sơ trang n14).'
  - cu: Trình độ diploma, sau ABRSM Grade 8 (ước lượng)
    moi: 'Henle mức 8 ("khó") trên thang 1–9; Henle ghi ABRSM: bằng LRSM (diploma)'
    ly_do: 'thong_tin của bản ghi (plans/lam-lai/bao-cao/d6-l6/sua-A.yml): Trang HN 867: "8 difficult ABRSM: Piano LRSM". Bỏ "(ước lượng)" như D6-L3, D6-L4. Grade đã khóa không đổi.'
  - cu: 'IMSLP (tìm "Ballade No.1, Op.23 (Chopin, Frédéric)"); bản Urtext: Ấn bản Quốc gia Ba Lan (Wydanie Narodowe, biên tập Jan Ekier), G. Henle Verlag, Wiener Urtext, Bärenreiter'
    moi: 'IMSLP (tìm "Ballade No.1, Op.23 (Chopin, Frédéric)"); bản Urtext: Ấn bản Quốc gia Ba Lan (Wydanie Narodowe, biên tập Jan Ekier), G. Henle Verlag (HN 867)'
    ly_do: 'thong_tin của bản ghi (plans/lam-lai/bao-cao/d6-l6/sua-A.yml): Chưa mở được trang nhà xuất bản Wiener Urtext, Bärenreiter cho đúng tác phẩm: bỏ, như D6-L4-gom. Link Henle trỏ đúng ấn bản.'
  - cu: null
    moi: 'Chopin là người đầu tiên đặt tên ballade cho một tác phẩm khí nhạc không lời. Chữ này vốn chỉ một thể thơ kể chuyện, nhiều khi là truyền thuyết, được các nhà thơ Lãng mạn rất ưa chuộng. Lịch sử sáng tác của Ballade số 1 có rất ít tài liệu: theo Henle, hợp đồng in với Breitkopf & Härtel ký ngày 9/1/1836, nên bài đã xong năm 1835, ở Paris; IMSLP ghi một bản đầu có thể từ năm 1831, kèm dấu hỏi. Từ năm 1831 Chopin sống ở Paris cho đến khi mất.'
    ly_do: 'Kiểm định D6-L6 (n14, n15): Henle HN 867 nói lịch sử sáng tác ít tài liệu, hợp đồng 9/1/1836, "Thus the work was composed in 1835"; IMSLP ghi "1831? (first version)". Không nguồn đã mở nói phác thảo ở Vienna. "Không bao giờ trở về" viết lại theo Henle HN 1320 (ở Paris đến cuối đời).'
  - cu: Chopin là người đầu tiên đặt tên ballade cho một tác phẩm khí nhạc không lời. Chữ này vốn chỉ một thể thơ kể chuyện, nhiều khi là truyền thuyết, được các nhà thơ Lãng mạn rất ưa chuộng. Ballade số 1 được phác thảo trong những tháng Chopin ở Vienna năm 1831, khi cuộc khởi nghĩa tháng Mười Một ở Ba Lan đang đi đến thất bại, rồi hoàn thành ở Paris. Chopin không bao giờ trở về quê hương nữa.
    moi:
      - 'Không có lời nào của Chopin còn lại cho thấy ông muốn chuyển nội dung một bài thơ cụ thể của Mickiewicz vào Ballade số 1. Những liên hệ với một bài thơ cụ thể là suy đoán của người đời sau. Hãy coi "ballade" như một cách kể: có người kể, có biến cố, có kết thúc bi thảm, chứ không phải một cốt truyện để minh họa.'
      - 'Bài này cũng quen thuộc với khán giả ngoài phòng hòa nhạc: trong phim The Pianist (2002) của Roman Polanski, nhân vật Władysław Szpilman chơi nó cho sĩ quan Đức Wilm Hosenfeld; tiếng piano trong phim là của Janusz Olejniczak. Xem thêm thời kỳ Lãng mạn.'
    ly_do: 'Kiểm định D6-L6 (n14, n15): Henle HN 867 nói lịch sử sáng tác ít tài liệu, hợp đồng 9/1/1836, "Thus the work was composed in 1835"; IMSLP ghi "1831? (first version)". Không nguồn đã mở nói phác thảo ở Vienna. "Không bao giờ trở về" viết lại theo Henle HN 1320 (ở Paris đến cuối đời).'
  - cu:
      - 'Chopin không bao giờ nói bài thơ nào gợi hứng cho Ballade số 1, và ông vốn không thích gán chương trình cho âm nhạc. Những liên hệ cụ thể (ví dụ với trường ca Konrad Wallenrod của Mickiewicz) là suy đoán của người đời sau. Hãy coi "ballade" như một cách kể: có người kể, có biến cố, có kết thúc bi thảm, chứ không phải một cốt truyện để minh họa.'
      - 'Bài này cũng quen thuộc với khán giả ngoài phòng hòa nhạc: trong phim The Pianist (2002) của Roman Polanski, nhân vật Władysław Szpilman chơi nó cho một sĩ quan Đức; phần piano trong nhạc phim do Janusz Olejniczak thu. Xem thêm thời kỳ Lãng mạn.'
    moi: null
    ly_do: 'Kiểm định D6-L6 (n18): viết theo lời tựa Henle HN 867 ("no testimony from Chopin survives…"); bỏ vế "không thích gán chương trình" và ví dụ Konrad Wallenrod (chưa có nguồn đã mở).'
  - cu: 'Rồi so sánh các cách chơi. Vladimir Horowitz đưa bài này vào chương trình buổi hòa nhạc trở lại Carnegie Hall năm 1965: kịch tính, tương phản cực mạnh. Bản thu bốn ballade của Krystian Zimerman cho Deutsche Grammophon là một mẫu mực về cấu trúc và độ chi tiết. Arthur Rubinstein chơi tự nhiên, ít cường điệu. Bạn không cần chọn ai đúng; hãy ghi lại mỗi người chọn đỉnh của bài ở đâu. Xem thêm Nghệ sĩ piano và bản thu.'
    moi: Rồi so sánh các cách chơi. Vladimir Horowitz chơi bài này trong buổi hòa nhạc trở lại Carnegie Hall ngày 9/5/1965 (Sony Classical có bản thu); Krystian Zimerman thu bốn ballade cho Deutsche Grammophon (1988). Bạn không cần chọn ai đúng; hãy ghi lại mỗi người chọn đỉnh của bài ở đâu, và ai nhanh, ai chậm ở phần Moderato. Xem thêm Nghệ sĩ piano và bản thu.
    ly_do: 'Kiểm định D6-L6 (n24–n26): giữ hai bản thu có trang hãng đĩa (Sony 2003: chương trình 9/5/1965; DG: CHOPIN Ballades / Zimerman, 1988); bỏ ba lời đánh giá phong cách không nguồn và câu về Rubinstein; thêm câu hỏi để người học tự nghe.'
  - cu:
      - Trên âm nền Rê kéo dài, kết lửng
      - Lắng xuống thật sự trước cơn bão
      - Coda
    moi:
      - Meno mosso, sotto voce, trên âm nền Rê kéo dài; lớn dần tới il più forte possibile
      - Xây cao trào từ tiếng rất nhỏ
      - Coda (từ ô 208)
    ly_do: 'Kiểm định D6-L6 (n36): Mutopia (Klindworth) ô 194–206: sotto voce pp, sempre cresc., molto cresc., "appassionato il più forte possibile" ô 206; không lắng xuống. Cùng chỗ sửa ở dòng của bảng Cấu trúc.'
  - cu: 'Presto con fuoco, 2/2: từ pp lên forte possibile; gam hai tay xen kẽ, hợp âm, một mô-típ gợi lại phần mở đầu; kết bằng chuỗi quãng tám chạy'
    moi: 'Presto con fuoco: hợp âm nhấn fz, gam quãng tám hai tay; kết bằng chuỗi quãng tám nửa cung hai tay chạy ngược chiều'
    ly_do: 'Kiểm định D6-L6 (n37): Mutopia (Klindworth): ff ở ô 208, "il più forte possibile" ở ô 206 trước coda; gam quãng tám ô 249–255; quãng tám nửa cung ngược chiều ô 258–261. Cùng chỗ sửa ở dòng Coda của bảng Cấu trúc. "2/2" chưa chắc (n38): bỏ khỏi hai bảng vì Klindworth in 4/4. Review D6-L6-gom: Bản in Pháp đầu (Schlesinger 1836, CFEO tr. 12) ghi ₵ và fz ở hợp âm đầu coda (ô 208); ff là của Klindworth (lượt 2 n37).'
  - cu: 'Tăng tốc theo nấc ♩ = 4 mỗi ngày tập tốt. Bất kỳ cảm giác căng hay đau nào ở cẳng tay: dừng lại, nghỉ, quay về tốc độ trước.'
    moi: 'Tăng tốc mỗi lần 4 vạch máy đếm nhịp (nốt trắng), vào những ngày tập tốt. Bất kỳ cảm giác căng hay đau nào ở cẳng tay: dừng lại, nghỉ, quay về tốc độ trước.'
    ly_do: 'Kiểm định D6-L6 (n60): khối 2 đặt tốc độ theo nốt trắng (Q:1/2=50); "♩ = 4" lệch đơn vị.'
  - cu: 'Hợp âm kết thúc phần Largo có một nốt mà các ấn bản in khác nhau: bản thảo của Chopin ghi Mi♭, tạo một âm nghịch tai treo lơ lửng; một số ấn bản cũ (ví dụ của Karl Klindworth) đưa Rê làm lựa chọn thay thế, nghe êm hơn. Các bản Urtext hiện nay đều thảo luận chỗ này trong phần chú thích. Hãy đọc chú thích trong ấn bản bạn dùng, nghe cả hai, rồi chọn một cách và chơi nó với niềm tin.'
    moi: 'Hợp âm kết thúc phần Largo (ô 7) có một nốt tay trái mà các ấn bản in khác nhau: bản Pháp in đầu và bản tay dở dang của Chopin ghi Mi♭, tạo một âm nghịch tai treo lơ lửng; bản Đức in đầu (Breitkopf & Härtel, 1836) và một số ấn bản sau ghi Rê, nghe êm hơn. Henle chọn Mi♭ và bàn chỗ này trong phần bình chú. Hãy đọc chú thích trong ấn bản bạn dùng, nghe cả hai, rồi chọn một cách và chơi nó với niềm tin.'
    ly_do: 'Kiểm định D6-L6 (n70): bình chú Henle HN 867 (ô 7 tay trái: e♭1 theo F, AFr; d1 ở G, bản Scholtz in sau, "older editions" theo Mikuli). Bản Klindworth (Mutopia) in Mi♭, nên bỏ ví dụ Klindworth; "đều thảo luận" không kiểm được.'
  - cu:
      - 'Jim Samson, Chopin: The Four Ballades, Cambridge University Press (Cambridge Music Handbooks), 1992.'
      - Jim Samson, The Music of Chopin, Routledge & Kegan Paul, 1985.
      - 'Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by His Pupils, Cambridge University Press, 1986 (rubato, cách dạy của Chopin).'
      - Robert Schumann, Gesammelte Schriften über Musik und Musiker (nhận xét về các ballade và Mickiewicz); thư năm 1836 về Ballade số 1.
      - Chopin, Ballady, Wydanie Narodowe (biên tập Jan Ekier), phần chú thích nguồn.
      - 'Bản nhạc: IMSLP. Xem thêm tài liệu tham khảo.'
    moi:
