    ket_qua: dung
    ghi_chu: '2/2, L:1/8, K:Gm, Q:1/2=50. Tay phải quãng tám đi lên nửa cung G, A♭, A, B♭ | B, C, C♯, D | D: mỗi ô 8 móc đơn. Ngón 1–5 trên phím trắng (G, A, B, C, D), 1–4 trên phím đen (A♭, B♭, C♯), đúng lời dẫn. Tay trái G1 rồi hợp âm D3–G3–B♭3, rồi D2 và A2–C3–F♯3 (Rê bảy): bước nhảy hơn một quãng mười hai, đúng "nhảy xa tay trái". Kết G1–D2–G2.'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
    ket_qua: dung
    ghi_chu: '6/4, L:1/8, K:Eb, Q:3/4=46. Tay phải 12 móc đơn mỗi ô: gam Mi♭ lên Rê6 rồi xuống, hợp âm rải Mi♭, Si♭ bảy (D–F–A♭), kết G–E♭. Ngón 1 2 3 1 2 3 4 3 2 1 3 2 (luồn ngón cái) và 1 2 3 5 cho hợp âm rải chơi được. Tay trái nốt trầm – hai hợp âm (E♭, A♭, B♭ bảy), đúng "bè trầm valse". Đúng kiểu đoạn valse của bài (Mi♭ trưởng, Mutopia ô 138 trở đi).'
ghi_chu: 'Lượt 1 D6-L6 phần A (05–06/11/2026). Bản nhạc: Mutopia chopin-op23-ballade-1 (ấn bản Klindworth, Bote & Bock ~1880; .ly, -defs.ly, .mid, PDF), đọc nốt MIDI theo ô bằng mido, chỉ dẫn từ PDF và .ly; 264 ô. Henle HN 867 (trang, lời tựa 2007, bình chú 2025), HN 862 (mức khó bốn ballade). Số ô đã đếm: Largo 1–7, Moderato 6/4 từ 8, agitato 36, Meno mosso sotto voce 67/68, La thứ 94, La trưởng 106, valse 138 (đoạn nối từ 126), Mi♭ ff 166, chủ đề 1 Sol thứ 194 (âm nền D2 194–205), Presto con fuoco 208, kết 264: khớp hinh.bai-hoc của bản ghi (7+28+32+26+12+20+40+28+14+57 = 264). Sửa chính: năm sáng tác (Henle: 1835, ít tài liệu), câu trích Schumann (dịch ngược nghĩa), Mickiewicz, nốt Mi♭/Rê ô 7 (Rê là của bản Đức in đầu; Klindworth in Mi♭), cuối chủ đề 1 trở lại và đầu coda (Klindworth: lớn dần tới il più forte possibile ở ô 206, coda ff), bỏ đánh giá nghệ sĩ, mục Nguồn. Chưa chắc: n38 (coda 2/2: Klindworth in 4/4), n67 (nguồn rubato: nên là Mikuli 1879). Lượt 2 nên đối chiếu sắc thái đầu coda với một bản Urtext. Thuật ngữ trang dùng chưa có trong thuat-ngu.yml (đã grep): ballade, hợp âm Napoli (Neapolitan), con fuoco, il più forte possibile, pesante. Có sẵn: meno mosso, sotto voce, leggiero, agitato, rubato, coda. Câu ve-site ở hồ sơ khác (piano/quang-tam-buoc-nhay n47 "Ballade số 1 (đoạn agitato, coda)"; the-loai n3, n44; thay-va-thi n4; lo-trinh n38; tac-pham-theo-cap n28, n38; index n7; nha-soan-nhac n82): trang mới giữ đúng (đoạn chuyển agitato, coda Presto con fuoco, tiêu đề "Chopin: Ballade số 1 cung Sol thứ, Op. 23", chặng 7).'
