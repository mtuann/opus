    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(09_of_14).jpg", "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(10_of_14).jpg", "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(11_of_14).jpg", "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(12_of_14).jpg", "https://www.mutopiaproject.org/ftp/SatieE/gymnopedie_1/gymnopedie_1.ly" ]
