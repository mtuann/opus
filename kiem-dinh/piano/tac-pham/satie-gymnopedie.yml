nhan_dinh:
- id: 'n1'
  cau: 'Ít nốt, chậm, lặp lại: Gymnopédie số 1 trông như một bài dễ, đọc hết nốt được trong một buổi (câu mở đầu và mô tả trang).'
  loai: 'cap-do'
  nguon:
  - 'henle-hn1072-vorwort'
  - 'commons-or'
  ket_qua: 'dung'
  ghi_chu: 'Henle: "technically unchallenging mood pictures"; Henle xếp cả ba Gymnopédie mức 2 (hồ sơ bản ghi lần 1 n4). Bản in gốc: 78 ô, ít nốt, đoạn sau gần như nhắc lại đoạn trước. "Trong một buổi" là ước lượng của lời khuyên.'
- id: 'n2'
  cau: 'Bài kéo dài mấy phút liền.'
  loai: 'so-lieu'
  nguon:
  - 'commons-alciatore'
  ket_qua: 'dung'
  ghi_chu: 'Bản thu gợi ý dài 183,59 giây (khoảng 3 phút).'
- id: 'n3'
  cau: 'Cái khó là làm cho sự giản dị ấy đều, tĩnh và hát; bài học về nhịp chậm, bước nhảy tay trái, màu sắc tiếng đàn.'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
- id: 'n4'
  cau: 'Nhịp đều khi chậm: ở tốc độ chậm mọi chênh lệch nhỏ đều lộ ra; bài rèn "đồng hồ bên trong".'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
- id: 'n5'
  cau: 'Tay trái đánh một nốt trầm rồi nhảy lên một hợp âm, gần như ô nào cũng vậy.'
  loai: 'cau-truc'
  nguon:
  - 'commons-or'
  ket_qua: 'da-sua'
  ghi_chu: 'Chữ cũ: "ô nào cũng vậy". Chữ mới: "gần như ô nào cũng vậy". Lý do: bản in gốc: các ô 38–39 và 77–78 (hai ô cuối mỗi lượt) là hợp âm khối cả ô, không có nốt trầm rồi hợp âm; mọi ô khác đúng mẫu. Khớp hồ sơ piano/quang-tam-buoc-nhay n34 (tay trái nhảy từ nốt trầm lên hợp âm).'
- id: 'n6'
  cau: 'Đây là dạng đệm của valse, nocturne và vô số bài sau này, ở đây được tập chậm nhất có thể.'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
  ghi_chu: 'Lời giới thiệu; dạng đệm nốt trầm – hợp âm của valse có ở trang chopin-valse-la-thu (đã kiểm ở hồ sơ ấy).'
- id: 'n7'
  cau: 'Cả bài gần như ở p và pp.'
  loai: 'cau-truc'
  nguon:
  - 'commons-or'
  ket_qua: 'dung'
  ghi_chu: 'Bản in gốc: pp ô 1, 5, 13, 40, 44, 52; p ô 22, 61; f chỉ ở ô 9 và 48.'
- id: 'n8'
  cau: 'Bạn học tạo khác biệt bằng cân bằng ba lớp, bàn đạp và una corda, chứ không bằng to nhỏ.'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
- id: 'n9'
  cau: 'Hợp âm bảy trưởng, màu điệu thức, sự lặp lại không phát triển: những hợp âm còn mới lạ năm 1888 cho thấy Satie là người đi tiên phong về hòa âm.'
  loai: 'lich-su'
  nguon:
  - 'brit-satie'
  - 'henle-hn1072-vorwort'
  - 'commons-or'
  ket_qua: 'da-sua'
  ghi_chu: 'Chữ cũ: "… sự lặp lại không phát triển: những thứ Debussy, Ravel và các nhạc sĩ tối giản về sau đi tiếp". Chữ mới như câu. Lý do: ảnh hưởng tới Debussy, Ravel và nhạc tối giản không tìm được nguồn bậc 2 (Britannica còn viết nhạc Satie "stands in opposition to the works of composer Claude Debussy"); Britannica: Trois Gymnopédies "use then-novel chords that reveal him as a pioneer in harmony"; Henle: "avoiding any sort of development". Bản in gốc ô 1–4: Sol–Si–Rê–Fa♯ và Rê–La–Đô♯–Fa♯ (hợp âm bảy trưởng).'
- id: 'n10'
  cau: 'Link "Điệu thức" (/opus/nhac-ly/16-dieu-thuc-ngu-cung/) và "thế kỷ 20" (/opus/lich-su/thoi-ky/the-ky-20/).'
  loai: 've-site'
  ket_qua: 'dung'
  ghi_chu: 'src/content/docs/nhac-ly/16-dieu-thuc-ngu-cung.md và lich-su/thoi-ky/the-ky-20.md có.'
- id: 'n11'
  cau: 'Dễ học thuộc, dễ biểu diễn: lượt hai gần như lặp lại lượt một.'
  loai: 'cau-truc'
  nguon:
  - 'commons-or'
  ket_qua: 'dung'
  ghi_chu: 'Bản in gốc: ô 40–70 lặp ô 1–31; khác ở phần kết (ô 71–78 so với 32–39).'
- id: 'n12'
  cau: 'Năm 1888, Satie hơn hai mươi tuổi, vừa rời nhà cha mẹ và sống ở khu Montmartre của Paris, giữa giới nghệ sĩ và các quán cabaret.'
  loai: 'lich-su'
  nguon:
  - 'henle-hn1072-vorwort'
  ket_qua: 'da-sua'
  ghi_chu: 'Chữ cũ: "Năm 1888, Satie hơn hai mươi tuổi, sống ở khu Montmartre của Paris, giữa giới nghệ sĩ và các quán cabaret." Chữ mới thêm "vừa rời nhà cha mẹ và". Lý do: Henle: "shortly after Satie had left his parents'' home and moved to the artistic quarter of Montmartre"; tháng 12/1887 Satie vào làm pianist ở Le Chat noir. Satie sinh 17/5/1866 (IMSLP, nha-soan-nhac.yml): đầu 1888 ông 21 tuổi, khớp "hơn hai mươi tuổi".'
- id: 'n13'
  cau: 'Âm nhạc châu Âu lúc ấy đang say mê sự đồ sộ của Wagner: dàn nhạc khổng lồ, hòa âm đặc, cảm xúc dâng trào.'
  loai: 'lich-su'
  nguon: []
  ket_qua: 'da-bo'
  ghi_chu: 'Đã bỏ khỏi trang. Câu khái quát về thời đại, không tìm được nguồn bậc 2 nói gì về Wagner liên quan tới Gymnopédies; câu sau ("đi theo hướng ngược lại hoàn toàn") viết lại thành n14.'
- id: 'n14'
  cau: 'Gymnopédies được viết thật giản dị: vài lớp nhạc mỏng, một giai điệu đơn giản, không cao trào, không phát triển.'
  loai: 'cau-truc'
  nguon:
  - 'henle-hn1072-vorwort'
  - 'commons-or'
  ket_qua: 'da-sua'
  ghi_chu: 'Chữ cũ: "*Gymnopédies* đi theo hướng ngược lại hoàn toàn: vài lớp nhạc mỏng, …". Chữ mới: "*Gymnopédies* được viết thật giản dị: vài lớp nhạc mỏng, …". Lý do: bỏ vế so với Wagner (n13). Henle: "statically conceived throughout, avoiding any sort of development".'
- id: 'n15'
  cau: 'Tên gọi gợi đến gymnopaedia, một lễ hội ở Sparta thời cổ Hy Lạp có những điệu múa của các chàng trai trẻ.'
  loai: 'lich-su'
  nguon:
  - 'brit-tg'
  - 'henle-hn1072-vorwort'
  ket_qua: 'dung'
  ghi_chu: 'Britannica: "derived from a festival of ancient Sparta at which young men danced". Henle: "festival events at which young, unarmed men displayed their warrior prowess in sporting competitions and dances".'
- id: 'n16'
  cau: 'Những lời Satie tự giải thích về bài (ông nói mình có cảm hứng khi đọc tiểu thuyết Salammbô của Flaubert) thường đầy mỉa mai.'
  loai: 'lich-su'
  nguon:
  - 'henle-hn1072-vorwort'
  ket_qua: 'da-sua'
  ghi_chu: 'Chữ cũ: "Satie thích những cái tên bí ẩn và hiếm khi giải thích chúng". Chữ mới như câu. Lý do: chưa có nguồn cho "thích tên bí ẩn"; Henle: "By his own admission he had been inspired to write the composition on reading Flaubert''s novel Salammbô, but – as frequently with Satie – such admissions are full of irony and therefore consciously misleading". Vế "đừng tìm một câu chuyện trong bài" giữ (lời khuyên).'
- id: 'n17'
  cau: 'Hãy nghe bài như một bức phù điêu: chậm, cân đối, xa xăm.'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
  ghi_chu: 'Henle cũng so ba bài với "a sculpture".'
- id: 'n18'
  cau: 'Bộ ba bài trở nên nổi tiếng một phần nhờ Debussy, bạn của Satie, người về sau phối khí cho dàn nhạc hai bài số 1 và số 3.'
  loai: 'lich-su'
  nguon:
  - 'henle-hn1072-vorwort'
  - 'brit-tg'
  ket_qua: 'dung'
  ghi_chu: 'Henle: Debussy "on friendly terms with Satie since 1891, orchestrated both pieces", buổi diễn 20/2/1897 "laid the foundation for the pieces'' success". Britannica: "a friend, later orchestrated Gymnopédies No. 3 and No. 1".'
- id: 'n19'
  cau: 'Ngày nay ba bài Gymnopédie là những bản piano nổi tiếng nhất của Satie.'
  loai: 'lich-su'
  nguon:
  - 'brit-tg'
  - 'henle-hn1072-vorwort'
  ket_qua: 'da-sua'
  ghi_chu: 'Chữ cũ: "Đến thế kỷ 20, *Gymnopédie* số 1 thành một trong những bản piano được nghe nhiều nhất, trong phim, quảng cáo, phòng chờ." Chữ mới như câu. Lý do: "được nghe nhiều nhất", "phim, quảng cáo, phòng chờ" không có nguồn bậc 2; Britannica: "The Trois gymnopédies are the best-known of Satie''s piano pieces"; Henle: "among the most popular works".'
- id: 'n20'
  cau: 'Sự quen thuộc ấy là cái bẫy: rất dễ chơi nó như nhạc nền; việc của bạn là làm người nghe lắng tai trở lại.'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
- id: 'n21'
  cau: 'Bốn ô đầu chỉ có tay trái; giai điệu vào ở phách thứ hai của ô 5; đoạn giữa có các nốt Đô♮ và Fa♮.'
  loai: 'cau-truc'
  nguon:
  - 'commons-or'
  ket_qua: 'dung'
  ghi_chu: 'Bản in gốc: ô 1–4 tay phải lặng (dấu lặng cả ô); ô 5 dấu lặng đen rồi Fa♯5, La5; ô 22 Đô♮, ô 27 Fa♮.'
- id: 'n22'
  cau: 'Câu hỏi khi nghe (hai lớp, chỗ thở, màu sắc đoạn giữa, phần kết lượt hai).'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
- id: 'n23'
  cau: 'Aldo Ciccolini và Pascal Rogé, cả hai thu nhiều nhạc piano của Satie.'
  loai: 'ten'
  nguon:
  - 'warner-ciccolini'
  - 'decca-roge'
  ket_qua: 'dung'
  ghi_chu: 'Warner: Ciccolini "launched the Satie ‘boom’ when this album first appeared in 1956", hộp "Tout Satie!". Decca: Rogé "extensively documenting the music of … Satie".'
- id: 'n24'
  cau: 'Reinbert de Leeuw nổi tiếng với tốc độ cực chậm.'
  loai: 'ten'
  nguon:
  - 'musicweb-satie'
  ket_qua: 'dung'
  ghi_chu: 'MusicWeb: "Reinbert de Leeuw on his much-praised recording … is actually slower in Nos.1 and 3" (chậm hơn một bản đã bị chê là chậm). "Cực chậm" là cách nói mạnh; lượt 2 cân nhắc.'
- id: 'n25'
  cau: 'Cùng một bài mà độ dài các bản thu chênh nhau rất nhiều.'
  loai: 'so-lieu'
  nguon:
  - 'musicweb-satie'
  ket_qua: 'dung'
  ghi_chu: 'MusicWeb: "There certainly is a wide variety of tempi on offer".'
- id: 'n26'
  cau: 'Ghi lại tốc độ nào giữ được mạch; nghe bản phối khí của Debussy.'
  loai: 'khuyen-tap'
  nguon: []
  ket_qua: 'khong-can-nguon'
- id: 'n27'
  cau: 'Theo dõi, dạo đầu (4 ô): chỉ tay trái, nốt trầm rồi hợp âm; Sol bảy trưởng và Rê bảy trưởng đung đưa.'
  loai: 'cau-truc'
  nguon:
  - 'commons-or'
