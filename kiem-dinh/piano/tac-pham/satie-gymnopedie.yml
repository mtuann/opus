    luot_2_ghi_chu: "Britannica (Debussy): ảnh hưởng chính là Wagner, 'Wagner fulfilled the sensuous ambitions not only of composers but also of the Symbolist poets and the Impressionist painters', có 'Wagner's French disciples'; Britannica (Wagner): ảnh hưởng 'revolutionary' lên nhạc phương Tây. Phần 'dàn nhạc khổng lồ, hòa âm đặc, cảm xúc dâng trào' là mô tả khái quát phổ biến, nguồn không nói từng chữ."
  - id: 'n14'
    cau: 'Gymnopédies được viết thật giản dị: vài lớp nhạc mỏng, một giai điệu đơn giản, không cao trào, không phát triển.'
