    ten: 'G. Henle Verlag, HN 1072 Satie, Gymnopédies, Preface (Ulrich Krämer, 2011): "composed at the age of 22"; "technically unchallenging mood pictures"; Gymnopedie "festival events at which young, unarmed men displayed their warrior prowess in sporting competitions and dances … young Spartan women danced"; "composed … between February and early April 1888, shortly after Satie had left his parents'' home and moved to the artistic quarter of Montmartre"; Chat noir: "He was hired as a pianist"; "inspired … on reading Flaubert''s novel Salammbô, but … such admissions are full of irony"; "dedicated to Jeanne de Bret"; Debussy "on friendly terms with Satie since 1891, orchestrated both pieces [1ère và 3ème]"; "This laid the foundation for the pieces'' success"; "statically conceived throughout, avoiding any sort of development"; "they resemble a sculpture"; "among the most popular works"'
    link: 'https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf'
