    luot_2_ghi_chu: "Henle lời tựa: Gymnopédies viết tháng 2 đến đầu tháng 4/1888 'shortly after Satie had left his parents' home and moved to the artistic quarter of Montmartre'; từ 12/1887 ông làm pianist ở cabaret Le Chat noir. Satie sinh 17/5/1866 nên lúc ấy 21 tuổi ('hơn hai mươi' đúng). Bản in còn ghi 'ERIK SATIE, 6 rue Cortot' (Montmartre)."
  - id: 'n13'
    cau: 'Âm nhạc châu Âu lúc ấy đang say mê sự đồ sộ của Wagner: dàn nhạc khổng lồ, hòa âm đặc, cảm xúc dâng trào.'
