doi_chu:
- cu: 1888, khi Satie 22 tuổi; bài số 1 đề tặng cô Jeanne de Bret
  moi: 1888 (tháng 2 đến đầu tháng 4), khi Satie chưa đầy 22 tuổi; bài số 1 đề tặng cô Jeanne de Bret
  ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-B.yml, nhận định n13 của hồ sơ bản ghi: Satie sinh 17/5/1866 (IMSLP); bài viết "between February and early April 1888" (Henle), IMSLP "1888 (March-April)": lúc ấy ông 21 tuổi. Henle Preface viết "composed at the age of 22" (lệch với hai mốc trên); "chưa đầy 22 tuổi" đúng với cả hai. Trang bài học viết "hơn hai mươi tuổi", đã đúng.'
- cu: Mẫu đệm nốt trầm – hợp âm. Tay trái đánh một nốt trầm rồi nhảy lên một hợp âm, ô nào cũng vậy. Đây là dạng đệm của valse, nocturne và vô số bài sau này, ở đây được tập chậm nhất có thể.
  moi: Mẫu đệm nốt trầm – hợp âm. Tay trái đánh một nốt trầm rồi nhảy lên một hợp âm, gần như ô nào cũng vậy. Đây là dạng đệm của valse, nocturne và vô số bài sau này, ở đây được tập chậm nhất có thể.
  ly_do: 'n5 (da-sua): hai ô cuối mỗi lượt là hợp âm khối.'
- cu: 'Cửa sổ sang thế kỷ 20. Hợp âm bảy trưởng, màu điệu thức, sự lặp lại không phát triển: những thứ Debussy, Ravel và các nhạc sĩ tối giản về sau đi tiếp (xem Điệu thức và thế kỷ 20).'
  moi: 'Cửa sổ sang thế kỷ 20. Hợp âm bảy trưởng, màu điệu thức, sự lặp lại không phát triển: những hợp âm còn mới lạ năm 1888 cho thấy Satie là người đi tiên phong về hòa âm (xem Điệu thức và thế kỷ 20).'
  ly_do: 'n9 (da-sua): Britannica ("then-novel chords … pioneer in harmony"); ảnh hưởng tới Debussy, Ravel, tối giản không có nguồn bậc 2.'
- cu:
  - 'Năm 1888, Satie hơn hai mươi tuổi, sống ở khu Montmartre của Paris, giữa giới nghệ sĩ và các quán cabaret. Âm nhạc châu Âu lúc ấy đang say mê sự đồ sộ của Wagner: dàn nhạc khổng lồ, hòa âm đặc, cảm xúc dâng trào. Gymnopédies đi theo hướng ngược lại hoàn toàn: vài lớp nhạc mỏng, một giai điệu đơn giản, không cao trào, không phát triển.'
  - 'Tên gọi gợi đến gymnopaedia, một lễ hội ở Sparta thời cổ Hy Lạp có những điệu múa của các chàng trai trẻ. Satie thích những cái tên bí ẩn và hiếm khi giải thích chúng; đừng tìm một "câu chuyện" trong bài. Hãy nghe nó như một bức phù điêu: chậm, cân đối, xa xăm.'
  - 'Bộ ba bài trở nên nổi tiếng một phần nhờ Debussy, bạn của Satie, người về sau phối khí cho dàn nhạc hai bài số 1 và số 3. Đến thế kỷ 20, Gymnopédie số 1 thành một trong những bản piano được nghe nhiều nhất, trong phim, quảng cáo, phòng chờ. Sự quen thuộc ấy là cái bẫy: rất dễ chơi nó như nhạc nền. Việc của bạn là làm người nghe lắng tai trở lại.'
  moi:
  - 'Năm 1888, Satie hơn hai mươi tuổi, vừa rời nhà cha mẹ và sống ở khu Montmartre của Paris, giữa giới nghệ sĩ và các quán cabaret. Gymnopédies được viết thật giản dị: vài lớp nhạc mỏng, một giai điệu đơn giản, không cao trào, không phát triển.'
  - 'Tên gọi gợi đến gymnopaedia, một lễ hội ở Sparta thời cổ Hy Lạp có những điệu múa của các chàng trai trẻ. Những lời Satie tự giải thích về bài (ông nói mình có cảm hứng khi đọc tiểu thuyết Salammbô của Flaubert) thường đầy mỉa mai; đừng tìm một "câu chuyện" trong bài. Hãy nghe nó như một bức phù điêu: chậm, cân đối, xa xăm.'
  - 'Bộ ba bài trở nên nổi tiếng một phần nhờ Debussy, bạn của Satie, người về sau phối khí cho dàn nhạc hai bài số 1 và số 3. Ngày nay ba bài Gymnopédie là những bản piano nổi tiếng nhất của Satie. Sự quen thuộc ấy là cái bẫy: rất dễ chơi nó như nhạc nền. Việc của bạn là làm người nghe lắng tai trở lại.'
  ly_do: 'n12, n14 (da-sua), n13 (da-bo): theo lời tựa Henle HN 1072; câu về Wagner không có nguồn. n16 (da-sua): Henle HN 1072. n19 (da-sua): Britannica ("best-known of Satie''s piano pieces").'
- cu: '"Đau đớn" ở đây không phải bi kịch. Đó là một nỗi buồn xa xăm, kiềm chế, như nhìn qua một lớp kính. Sắc thái hẹp, chỉ những đợt to nhỏ rất nhẹ theo câu; không có chỗ nào cần f.'
  moi: '"Đau đớn" ở đây không phải bi kịch. Đó là một nỗi buồn xa xăm, kiềm chế, như nhìn qua một lớp kính. Sắc thái hẹp: bản in gốc ghi pp ở đầu bài và ở hai câu giai điệu, p ở đoạn giữa, và chỉ một chữ f mỗi lượt, dưới nốt Fa♯ ngân dài của câu 1 (ô 9 và ô 48). Ngoài chỗ ấy, chỉ những đợt to nhỏ rất nhẹ theo câu.'
  ly_do: 'n58 (da-sua): bản in gốc có f ở ô 9 và ô 48.'
- cu: 'Bản nhạc: IMSLP; nốt nhạc và chỉ dẫn được đối chiếu với bản chép LilyPond của Mutopia Project (từ bản in lại bản gốc của Dover). Xem thêm tài liệu tham khảo.'
  moi:
  - 'G. Henle Verlag, Satie: Gymnopédies (HN 1072), lời tựa của Ulrich Krämer (2011): năm viết, lời đề tặng, Montmartre, bản phối khí của Debussy.'
  - 'Bản nhạc: IMSLP; nốt nhạc, số ô và chỉ dẫn được đối chiếu với bản in gốc (bản quét trên Wikimedia Commons). Xem thêm tài liệu tham khảo.'
  ly_do: 'n76, n77 (da-sua): thêm lời tựa Henle; Mutopia không còn bản Gymnopédie, đối chiếu với bản in gốc.'
