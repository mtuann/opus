nhan_dinh:
  - id: 'n1'
    cau: 'Ít nốt, chậm, lặp lại: Gymnopédie số 1 trông như một bài dễ, đọc hết nốt được trong một buổi (câu mở đầu và mô tả trang).'
    loai: 'cap-do'
    nguon:
      - 'henle-hn1072-vorwort'
      - 'commons-or'
    ket_qua: 'dung'
    ghi_chu: 'Henle: "technically unchallenging mood pictures"; Henle xếp cả ba Gymnopédie mức 2 (hồ sơ bản ghi lần 1 n4). Bản in gốc: 78 ô, ít nốt, đoạn sau gần như nhắc lại đoạn trước. "Trong một buổi" là ước lượng của lời khuyên.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/Gymnopedies/HN-1072", "https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf" ]
    luot_2_ghi_chu: Henle xếp cả ba bài ở độ khó 2 (easy); lời tựa gọi là 'technically unchallenging mood pictures'. Bài 78 ô, nửa sau gần như lặp nửa đầu, nên đọc hết nốt trong một buổi là hợp lý.
