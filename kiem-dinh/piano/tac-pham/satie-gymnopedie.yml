ghi_chu: 'Bài học Gymnopédie số 1 (tầng Tác phẩm). Bản nhạc: bản in gốc ba Gymnopédie (Paris 1888, bản quét IMSLP 03213 trên Wikimedia Commons, PD-old; PDF tải ngày 05/11/2026, xem ảnh từng trang): 78 ô viết liền (4 + 8 + 9 + 10 + 8, rồi 31 + 8), 3/4, hai dấu thăng, Lent et douloureux, đề tặng Jeanne de Bret. Mutopia không có Gymnopédie; PDF IMSLP không mở. Lịch sử: lời tựa Henle HN 1072 (Krämer 2011), IMSLP, Britannica (Wayback), Warner, Decca, MusicWeb, CNRTL, Trinity. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/satie-gymnopedie. Sửa trang: n5 ("gần như ô nào"), n9 (bỏ ảnh hưởng tới Debussy, Ravel, tối giản; thay bằng Britannica), n12, n14 (Montmartre theo Henle; bỏ so với Wagner), n13 (bỏ câu Wagner), n16 (Salammbô, lời tự giải thích đầy mỉa mai), n19 (bỏ "được nghe nhiều nhất, trong phim, quảng cáo"), n58 và n71 (bản in gốc có f ở ô 9 và 48: sửa "không có chỗ nào cần f"), n76, n77 (mục Nguồn: thêm Henle, thay Mutopia/Dover bằng bản in gốc). Không có chỗ chưa chắc; n24 ("cực chậm") là cách nói mạnh, lượt 2 cân nhắc. Khuông: hai khối ví dụ soạn, đúng. Thuật ngữ: una corda có trong thuat-ngu.yml; Lent, douloureux (tiếng Pháp) chưa có (ghi cho D3-L5).'
