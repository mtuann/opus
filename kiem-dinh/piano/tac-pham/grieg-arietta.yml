    ghi_chu: 'Mi♭ trưởng, 2/4, L:1/16: mỗi ô 8 (giai điệu nốt trắng 8 và dòng móc kép 8 bằng & trong cùng tay phải). Giai điệu Sol5 – La♭5 – Fa5 – Mi♭5, ngón 4-5-4-3; móc kép ngón 1-2 bên dưới (Si♭4–Mi♭5, Đô5–Mi♭5, Si♭4–Rê5, Sol4–Si♭4). Hòa âm Mi♭ – La♭ – Si♭ – Mi♭ khớp tay trái (Mi♭3, La♭2, Si♭2, Mi♭2). "Ped." mỗi ô: đúng bước 3.'
