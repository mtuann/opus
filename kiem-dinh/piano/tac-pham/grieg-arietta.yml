    ghi_chu: 'Mi♭ trưởng, 2/4, L:1/16: mỗi ô 8. Ô 1: Đô thứ (Đô–Mi♭–Sol trên Đô) rồi Rê bảy (Rê, Fa♯–La–Đô, giai điệu Fa♯); ô 2: Mi♭ trưởng (bậc VI của Sol thứ): kết lừa, giống PTNA "IVadd6 → V9 → VI". Ô 3–4: La♭ – Si♭ bảy – Mi♭: kết trọn. Giai điệu Sol–Fa♯–Sol và Mi♭–Rê–Mi♭ (chủ âm, cảm âm, chủ âm): đúng chú thích. !p! rồi !mp!; chú thích "^Sol thứ: kết lừa", "^Mi♭ trưởng: kết trọn". Ngón chơi được.'
doi_chu:
  - cu: 'Khoảng ABRSM Grade 4 (ước lượng): ít nốt, không có nét chạy nhanh, nhưng giữ hai lớp cân bằng trong một bàn tay và đổi bàn đạp sạch đòi hỏi tai tốt'
    moi: ABRSM xếp bài ở Grade 4 (đề cương 2019–2020), RCM Level 6; Henle mức 4. Ít nốt, không có nét chạy nhanh, nhưng giữ hai lớp cân bằng trong một bàn tay và đổi bàn đạp sạch đòi hỏi tai tốt
    ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-B.yml, nhận định n17 của hồ sơ bản ghi: ABRSM 2019 & 2020, Grade 4, danh sách B, mục 2: "Grieg Arietta (No. 1 from Lyriske småstykker, Op. 12)"; RCM 2022 trang 57, Level 6; Henle HN 619: "Arietta op. 12,1 4 medium". Bài có trong đề cương chính thức, nên bỏ "(ước lượng)"; khớp grade đã khóa (Grade 4) và chip "≈ Grade 4".'
  - cu:
      - 'Tập Op. 12 được viết khoảng 1866–1867 và in năm 1867. Tám bài trong tập là những bức tranh rất ngắn: Arietta, Vals (Valse), Vektersang (Bài ca người gác đêm, gợi hứng từ Macbeth), Alfedans (Điệu múa yêu tinh), Folkevise (Dân ca), Norsk (Điệu Na Uy), Albumblad (Trang album) và Fedrelandssang (Bài ca quê hương). Chỉ một năm sau, năm 1868, Grieg viết Concerto cho piano La thứ.'
      - Trong 34 năm tiếp theo, ông viết thêm chín tập; cả bộ gồm 66 bài trong mười tập, gọi chung là Lyriske stykker. Giai điệu của Arietta là một trong những giai điệu Grieg yêu thích nhất. Ở bài cuối cùng của tập cuối, Op. 71 số 7 Efterklang (Dư âm; tên tiếng Anh Remembrances, Hồi ức), viết và in năm 1901, ông cho nó trở lại, lần này thành một điệu valse. Bài đầu và bài cuối ôm lấy cả bộ như hai trang bìa của một cuốn nhật ký.
    moi:
      - 'Tập Op. 12 được viết khoảng 1866–1867 và in năm 1867. Tám bài trong tập là những bức tranh rất ngắn: Arietta, Vals (Valse), Vægtersang (Bài ca người gác đêm, gợi hứng từ Macbeth), Alfedans (Điệu múa yêu tinh), Folkevise (Dân ca), Norsk (Điệu Na Uy), Albumblad (Trang album) và Fædrelandssang (Bài ca quê hương). Chỉ một năm sau, năm 1868, Grieg viết Concerto cho piano La thứ.'
      - Trong 34 năm tiếp theo, ông viết thêm chín tập; cả bộ gồm 66 bài trong mười tập, gọi chung là Lyriske stykker. Ở bài cuối cùng của tập cuối, Op. 71 số 7 Efterklang (Dư âm; tên tiếng Anh Remembrances, Hồi ức), viết và in năm 1901, ông cho nó trở lại, lần này thành một điệu valse. Bài đầu và bài cuối ôm lấy cả bộ như hai trang bìa của một cuốn nhật ký.
    ly_do: 'n19 (da-sua): tên hai bài viết theo IMSLP (bản in). n23 (da-bo): "giai điệu Grieg yêu thích nhất" chỉ có ở Wikipedia.'
  - cu: 'Rồi so sánh ít nhất hai bản thu, chẳng hạn Emil Gilels, người đưa Arietta vào tuyển tập Lyric Pieces nổi tiếng của mình, và Einar Steen-Nøkleberg, nghệ sĩ Na Uy đã thu trọn các tác phẩm piano của Grieg. Ghi lại: ai chơi chậm nhất, ai để nốt trầm vang rõ nhất, ai cho ô cuối tan lâu nhất? Cuối cùng, nghe Efterklang Op. 71 số 7 ngay sau Arietta: cùng một giai điệu, nhưng đã thành điệu valse của một người nhìn lại. Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu.'
    moi: 'Rồi so sánh ít nhất hai bản thu, chẳng hạn Emil Gilels, người mở đầu tuyển tập Lyric Pieces của mình (Deutsche Grammophon) bằng Arietta, và Einar Steen-Nøkleberg, nghệ sĩ Na Uy đã thu trọn các tác phẩm piano của Grieg. Ghi lại: ai chơi chậm nhất, ai để nốt trầm vang rõ nhất, ai cho ô cuối tan lâu nhất? Cuối cùng, nghe Efterklang Op. 71 số 7 ngay sau Arietta: cùng một giai điệu, nhưng đã thành điệu valse của một người nhìn lại. Muốn biết thêm về các nghệ sĩ, xem Nghệ sĩ piano và bản thu.'
