    ghi_chu: 'Mi♭ trưởng, 2/4, L:1/16: mỗi ô 8. Tay phải bốn Sol5 (móc đơn) với !<( !<)! rồi La♭–Sol, Fa–La♭, Sol; móc kép như khối 1. Tay trái Mi♭2 nối qua ô 1–2 (E,,8- | E,,4- E,,4), có "Ped." ở giữa: đúng bước 1 (ngón giữ phím khi đổi bàn đạp). Hòa âm Mi♭ – La♭/Mi♭ – Mi♭ | Si♭ bảy | Mi♭. Ngón chơi được.'
