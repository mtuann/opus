nhan_dinh:
  - id: 'n1'
    cau: 'Arietta (Aria nhỏ) mở đầu cho cả 66 Lyric Pieces của Grieg (câu mở đầu và mô tả trang).'
    loai: 'so-lieu'
    nguon:
      - 'imslp-op12'
      - 'imslp-lyric'
      - 'brit-grieg'
    ket_qua: 'dung'
    ghi_chu: 'IMSLP: Op. 12 số 1 là Arietta; mười tập (Britannica: "ten collections"), cộng số bài trên IMSLP: 8+8+6+7+6+6+6+6+6+7 = 66.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Lyric_Pieces,_Op.12_(Grieg,_Edvard)", "https://enc.piano.or.jp/en/musics/650" ]
    luot_2_ghi_chu: "IMSLP: Op. 12 số 1 là Arietta; PTNA (Op. 71): cả bộ 10 tập, 66 bài; Op. 12 là tập đầu (1867)."
  - id: 'n2'
    cau: 'Arietta dài 23 ô nhịp, khoảng một phút rưỡi.'
    loai: 'so-lieu'
    nguon:
      - 'schirmer-op12'
      - 'ptna'
    ket_qua: 'dung'
    ghi_chu: 'Schirmer 1899 trang 3: 23 ô (4 + 5 + 5 + 4 + 5 ô mỗi hệ khuông). PTNA: "Total Playing Time: 1 min 30 sec". Bản thu gợi ý 87,8 giây.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/schirmers-library-vol-201-edvard-grieg-op-12/Schirmer%27s%20Library%20Vol%20201%20Edvard%20Grieg%20Op%2012.pdf", "https://enc.piano.or.jp/en/musics/21051" ]
    luot_2_ghi_chu: "Đếm trên bản Schirmer 1899 (archive.org), trang 3: 4 + 5 + 5 + 4 + 5 = 23 ô. PTNA: tổng thời lượng 1 phút 30 giây."
  - id: 'n3'
    cau: 'Bài là một bài hát không lời thu nhỏ; bài học: giai điệu hát trên dòng móc kép trong cùng tay phải, ba lớp cân bằng, bàn đạp Lãng mạn, không lần nào lặp lại y hệt.'
    loai: 'khuyen-tap'
    nguon: []
    ket_qua: 'khong-can-nguon'
    ghi_chu: 'Phần kiểm được (dòng móc kép ở tay phải): n4.'
  - id: 'n4'
    cau: "Giai điệu nằm ở bè trên, tay phải; ngay bên dưới là dòng móc kép của bè trong, chia cho hai tay: hai nốt đầu mỗi nhóm do tay trái đánh, hai nốt sau do tay phải, dưới giai điệu."
    loai: 'cau-truc'
    nguon:
      - 'schirmer-op12'
    ket_qua: "da-sua"
    ghi_chu: "Schirmer: tay phải giai điệu nốt móc đơn (đuôi lên), bên dưới các nhóm móc kép (đuôi xuống) chia giữa hai tay (khuông trên và dưới), khớp PTNA (\"eighth-note reiterations\"). Review D6-L3-gom: Lượt 2 đúng; ghi_chu của lượt 1 cũng nói các nhóm móc kép chia giữa hai khuông. Sửa theo câu đúng của lượt 2 (doi_chu), không chạy lại."
    luot_2: sai
    luot_2_nguon: [ "https://archive.org/download/schirmers-library-vol-201-edvard-grieg-op-12/Schirmer%27s%20Library%20Vol%20201%20Edvard%20Grieg%20Op%2012.pdf" ]
    luot_2_ghi_chu: "câu đúng: Giai điệu nằm ở bè trên, tay phải; ngay bên dưới là dòng móc kép của bè trong, chia cho hai tay: hai nốt đầu mỗi nhóm do tay trái đánh (cùng nốt trầm), hai nốt sau do tay phải.; Giai điệu ở bè trên (tay phải) đúng. Nhưng dòng móc kép không nằm trọn trong tay phải: bản Schirmer 1899 ghi mỗi nhóm bốn móc kép thành hai cặp: cặp dưới (Si♭3–Mi♭4) ở khuông dưới, tay trái đánh cùng nốt trầm Mi♭3 ngân; cặp trên (Sol4–Si♭4) ở khuông trên, tay phải đánh dưới giai điệu. Từ Si♭3 lên Sol5 một bàn tay không với tới."
    review: "dung"
  - id: 'n5'
    cau: 'Các ngón phía ngoài (4–5) phải hát, các ngón phía trong (1–2) phải thì thầm; kỹ năng nền của nhạc Lãng mạn.'
    loai: 'khuyen-tap'
    nguon: []
    ket_qua: 'khong-can-nguon'
    ghi_chu: 'Schirmer ghi ngón 5, 4 cho giai điệu (ô 1, 2, 4), 1, 2 cho móc kép.'
