  - cu: "Hai lớp trong một bàn tay. Giai điệu nằm ở bè trên; ngay bên dưới, cũng trong tay phải, là dòng móc kép của bè trong. Các ngón phía ngoài (4–5) phải hát, các ngón phía trong (1–2) phải thì thầm. Đây là kỹ năng nền của hầu hết nhạc Lãng mạn về sau (xem mục cân bằng trong Tạo tiếng đàn)."
    moi: "Hai lớp trong một bàn tay. Giai điệu nằm ở bè trên, tay phải; ngay bên dưới là dòng móc kép của bè trong, chia cho hai tay: hai nốt đầu mỗi nhóm do tay trái đánh, hai nốt sau do tay phải, dưới giai điệu. Các ngón phía ngoài (4–5) phải hát, các ngón phía trong (1–2) phải thì thầm. Đây là kỹ năng nền của hầu hết nhạc Lãng mạn về sau (xem mục cân bằng trong Tạo tiếng đàn)."
