khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Ô 1–5, 2/4, K:Eb, L:1/8. Ấn bản: bernard tr. 3, hệ 1, đọc ở 200–600 dpi (đo dòng kẻ). Khuông trên ô 1–4 nghỉ. Khuông dưới hai bè. Bè trên: ô 1 và 3: móc đơn nghỉ, hợp âm [Mi♭3 Sol3 Si♭3] móc đen có dấu nhấn (>), móc đơn nghỉ; ô 2: móc đơn nghỉ, hợp âm móc đơn có chấm, lặng đen; ô 4 như ô 2 nhưng không thấy chấm. Bè dưới: ô 1 và 3: Mi♭2 móc đơn có chấm, Si♭2 móc đen, Si♭1 hai móc kép; ô 2 và 4: Mi♭2, Si♭2 móc đơn có chấm, móc đơn nghỉ, Si♭1 móc đơn. mf ở ô 1. Ô 5: khuông trên p, móc đơn nghỉ, [Mi♭4 Sol4] móc kép, Si♭4 móc kép, [Rê4 Fa♯4] móc đen (luyến từ móc kép đầu, nối sang ô 6); khuông dưới Mi♭2 móc đơn, Si♭3 móc đen, Si♭2 hai móc kép. Bỏ: chữ Ped. ở ô 1; luyến của ô 5 kết ở hợp âm Rê–Fa♯ (bản in nối sang ô 6). Không có số ngón trong ô 1–5.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, tay trái: nốt trầm (ngón 5) Mi♭2/Si♭1/Fa2 xen với hợp âm Mi♭ trưởng [Mi♭3 Sol3 Si♭3] và Si♭ bảy [Rê3 Fa3 La♭3]; ô 1 hợp âm có dấu nhấn, ô 2 hợp âm có chấm. Mỗi ô 4 móc đơn.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, L:1/16: tay phải móc kép có chấm, quãng ba (ngón 1–3) xen nốt trên (ngón 5): Mi♭–Sol/Si♭, Fa–La♭/Rê5, Mi♭–Sol/Si♭, hợp âm Mi♭ trưởng; tay trái nốt trầm và hợp âm móc đen (Mi♭, Si♭ bảy, Mi♭). Mỗi ô 8 móc kép.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4: tay trái ba nốt hoa mỹ (Si♭2–Đô3–Rê3; Fa2–Sol2–La♭2) lên nốt trắng có dấu nhấn (Mi♭3, Si♭2), ô cuối Mi♭2; tay phải hợp âm Mi♭ trưởng [Sol4 Si♭4 Mi♭5], Si♭ bảy [Fa4 La♭4 Rê5] có dấu nhấn ở phách 2. Như khối ff ở tr. 5 bản in (kiểu viết, không chép nốt).'
