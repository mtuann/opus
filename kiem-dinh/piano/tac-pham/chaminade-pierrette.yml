    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/07257", "https://www.dolmetsch.com/defsl.htm", "https://www.dolmetsch.com/defsm2.htm", "http://catalogue.bnf.fr/ark:/12148/cb42900932d", "https://imslp.org/wiki/Pierrette,_Op.41_(Chaminade,_C%C3%A9cile)" ]
    luot_2_ghi_chu: Bốn ô đầu chỉ tay trái (tr. 3); leggierissimo, m.g. như n20, n21; Enoch & Costallat, Paris, 1889 (BnF, bản sớm nhất tìm thấy); tam tấu Carl Fischer, New York, 1914 (IMSLP).
    review: dung
khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, doi-chieu-an-ban ]
    ket_qua: da-sua
    ghi_chu: 'Ô 1–5, 2/4, K:Eb, L:1/8. Ấn bản: bernard tr. 3, hệ 1, đọc ở 200–600 dpi (đo dòng kẻ). Khuông trên ô 1–4 nghỉ. Khuông dưới hai bè. Bè trên: ô 1 và 3: móc đơn nghỉ, hợp âm [Mi♭3 Sol3 Si♭3] móc đen có dấu nhấn (>), móc đơn nghỉ; ô 2: móc đơn nghỉ, hợp âm móc đơn có chấm, lặng đen; ô 4 như ô 2 nhưng không thấy chấm. Bè dưới: ô 1 và 3: Mi♭2 móc đơn có chấm, Si♭2 móc đen, Si♭1 hai móc kép; ô 2 và 4: Mi♭2, Si♭2 móc đơn có chấm, móc đơn nghỉ, Si♭1 móc đơn. mf ở ô 1. Ô 5: khuông trên p, móc đơn nghỉ, [Mi♭4 Sol4] móc kép, Si♭4 móc kép, [Rê4 Fa♯4] móc đen (luyến từ móc kép đầu, nối sang ô 6); khuông dưới Mi♭2 móc đơn, Si♭3 móc đen, Si♭2 hai móc kép. Bỏ: chữ Ped. ở ô 1; luyến của ô 5 kết ở hợp âm Rê–Fa♯ (bản in nối sang ô 6). Không có số ngón trong ô 1–5. Review (Claude, 17/11/2026): so từng nốt với bản quét tr. 3 hệ 1 ở 400–800 dpi (đo dòng kẻ): nốt, trường độ, dấu nhấn, chấm, mf, p, luyến ô 5, Fa♯ khớp; ô 4 hợp âm không chấm khớp. Sửa: ô 3 Mi♭2 không có chấm staccato (ô 1 có, ô 3 không; đã bỏ dấu chấm trong khối). Dấu nối Rê–Fa♯ sang ô 6 không chép (khối dừng ở ô 5).'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, tay trái: nốt trầm (ngón 5) Mi♭2/Si♭1/Fa2 xen với hợp âm Mi♭ trưởng [Mi♭3 Sol3 Si♭3] và Si♭ bảy [Rê3 Fa3 La♭3]; ô 1 hợp âm có dấu nhấn, ô 2 hợp âm có chấm. Mỗi ô 4 móc đơn. Review (Claude, 17/11/2026): kiểm: 4 ô 2/4 đủ, ngón 5 nốt trầm, Mi♭ – Si♭ bảy (Rê–Fa–La♭ trên Si♭1, Fa2) – Mi♭; khớp lời kèm.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, L:1/16: tay phải móc kép có chấm, quãng ba (ngón 1–3) xen nốt trên (ngón 5): Mi♭–Sol/Si♭, Fa–La♭/Rê5, Mi♭–Sol/Si♭, hợp âm Mi♭ trưởng; tay trái nốt trầm và hợp âm móc đen (Mi♭, Si♭ bảy, Mi♭). Mỗi ô 8 móc kép. Review (Claude, 17/11/2026): kiểm: mỗi ô 8 móc kép, ngón 1–3 quãng ba và 5 nốt trên (Fa–La♭/Rê5 là quãng sáu, vừa tay), tay trái móc đen; hòa âm Mi♭ – Si♭ bảy – Mi♭.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4: tay trái ba nốt hoa mỹ (Si♭2–Đô3–Rê3; Fa2–Sol2–La♭2) lên nốt trắng có dấu nhấn (Mi♭3, Si♭2), ô cuối Mi♭2; tay phải hợp âm Mi♭ trưởng [Sol4 Si♭4 Mi♭5], Si♭ bảy [Fa4 La♭4 Rê5] có dấu nhấn ở phách 2. Như khối ff ở tr. 5 bản in (kiểu viết, không chép nốt). Review (Claude, 17/11/2026): kiểm: nốt hoa mỹ Si♭2–Đô3–Rê3 lên Mi♭3, Fa2–Sol2–La♭2 lên Si♭2, nhấn phách 1; tay phải vào phách 2 (Mi♭, Si♭ bảy); đủ nhịp, chơi được ở chặng 6.'
