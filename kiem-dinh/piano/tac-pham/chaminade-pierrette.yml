    nguon: [ bnf-delta ]
    ket_qua: dung
    ghi_chu: 'BnF ghi "Pierrette, op. 41 / Chaminade, comp.; Cécile Chaminade, p" trong đĩa Delta TQD 3037, London, 1963 (tuyển các bản thu cũ của Pachmann, Grünfeld, Pugno, Grieg…). "In lại" vì đĩa 1963 tuyển bản thu của các nghệ sĩ đã mất (Grieg mất 1907); năm thu gốc không ghi trên mục lục, trang không nêu. Review (Claude, 17/11/2026): BnF API SRU cb41369878p: Masters of the piano Vol. 1, Delta records (London), 1963, có "Pierrette, op. 41 / Chaminade, comp. ; Cécile Chaminade, p", Delta TQD 3037.'
