  - id: n20
    cau: 'Leggierissimo là thật nhẹ (leggiero: nhẹ); marcatissimo là thật rõ từng nốt; sec (tiếng Pháp) là khô, ngắn; sf, sff, sfff là nhấn mạnh đột ngột.'
    loai: dinh-nghia
    nguon: [ trinity-thuat-ngu ]
    ket_qua: da-sua
    ghi_chu: 'Đuôi -issimo là mức cao nhất (rất). Sec: tiếng Pháp "khô". sf/sfz: nhấn mạnh đột ngột. Review (Claude, 17/11/2026): đổi "nhấn mạnh bất ngờ" thành "nhấn mạnh đột ngột" ở mục Sắc thái cho khớp thuat-ngu.yml (sforzando: Nhấn mạnh đột ngột) và nhac-ly/14.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsl.htm", "https://www.dolmetsch.com/defsm2.htm", "https://www.dolmetsch.com/defss1a.htm", "https://www.dolmetsch.com/defss2.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/" ]
    luot_2_ghi_chu: "Dolmetsch: leggierissimo 'as light as possible'; leggiero 'light, swift, delicate'; marcatissimo 'very strongly marked'; sec (French) 'dry, crisp … similar to staccato'; sff 'abbreviation for sforzatissimo'; sforzando 'strongly accented … sudden loudness'. OMT: -issimo nghĩa 'very', sfz/sf là dấu nhấn mạnh hơn dấu nhấn thường. Không tìm thấy định nghĩa sfff riêng; hiểu theo cùng cách là hợp lý. Dolmetsch không phải OMT (OMT không có các từ này), nên chỉ coi là từ điển chuẩn."
    review: dung
  - id: n21
    cau: 'm.g. là viết tắt tiếng Pháp main gauche, tay trái.'
    loai: dinh-nghia
    nguon: [ bernard ]
    ket_qua: da-sua
    ghi_chu: 'Chữ m.g. in trên khuông trên ở những chỗ có nốt rất cao hay rất thấp tách khỏi bè tay phải (tr. 5, 6, 7). main gauche: tay trái (tiếng Pháp); m.d. main droite: tay phải. Review (Claude, 17/11/2026): Dolmetsch như lượt 2. Sửa lời giải thích câu hỏi m.g.: câu cũ "Ở những chỗ ấy tay trái bắt chéo lên trên tay phải" nói quá, vì ở tr. 6 hệ 1 và tr. 7 hệ 4 m.g. chỉ là tay trái chơi nốt viết ở khuông trên, dưới tay phải; câu mới: "Có chỗ tay trái chơi nốt viết ở khuông trên, dưới tay phải; có chỗ tay trái bắt chéo lên trên tay phải."'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsm2.htm" ]
    luot_2_ghi_chu: "Dolmetsch: 'M.G., m.g. abbreviation of main gauche (French: left hand)'. Khớp src/data/thuat-ngu.yml (m.d./m.s., ghi chú main gauche)."
