    luot_2_ghi_chu: "Tr. 3 hệ 1: ô 1–4 tay trái, nốt trầm Mi♭2 (móc đơn), Si♭1 (móc kép), hợp âm Si♭–Mi♭–Sol–Si♭ (Mi♭ trưởng) sau lặng móc đơn; ô 1 và 3 hợp âm đen có dấu nhấn >, ô 2 và 4 hợp âm móc đơn có chấm. Mở đầu trở lại tr. 4 hệ 3 (marcatissimo); A lần hai kết sff 'sec.' và ô lặng tr. 5 hệ 1; đoạn giữa tr. 5; chuyển tr. 6 hệ 1–2; a tempo tr. 6 hệ 2; đoạn kết tr. 7."
