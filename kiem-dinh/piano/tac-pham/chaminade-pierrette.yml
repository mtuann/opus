    review: dung
  - id: n4
    cau: 'Bài ở chặng 6 của lộ trình trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'chang: 6 trong bản ghi tac-pham/chaminade-pierrette; cap-do.yml: chặng 6 ứng với Grade 7–8. Review (Claude, 17/11/2026): tac-pham.yml chang: 6; cap-do.yml id 6 Grade 7–8.'
    review: dung
  - id: n5
    cau: 'Phần lớn bài là móc kép nhẹ ở sắc thái nhỏ (p, pp), có chỗ luyến, có chỗ chấm staccato.'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: da-sua
    ghi_chu: 'Chủ đề (tr. 3 từ ô 5; tr. 4, tr. 6) móc kép có chấm, p; đoạn giữa chùm ba móc kép pp, móc kép pp leggieriss., ppp leggieriss. (tr. 5); đoạn kết pp (tr. 7). Các chỗ f, ff, sff ngắn. Sửa theo lượt 2 (17/11/2026): nhiều nhóm móc kép tay phải có luyến, không chấm (tr. 3 hệ 3–4, tr. 4 hệ 4 legato dolce, tr. 5 pp leggieriss.); chủ đề ô 6 có chấm. Đã sửa câu ở Vì sao nên học, dòng 2 bảng Theo dõi khi nghe ("xen nốt có chấm staccato"), bảng Cấu trúc, bảng Chỗ khó, Bàn đạp, Lỗi thường gặp, description, ky_nang_chinh và dòng Kỹ năng chính của bản ghi. Review (Claude, 17/11/2026): bản quét tr. 3–5: móc kép tay phải phần lớn có luyến (tr. 4 hệ 4 legato dolce, tr. 5 hệ 3–5 pp/ppp leggieriss. có luyến, không chấm), chấm staccato ở móc đơn tay trái và hợp âm đệm; câu đã sửa khớp.'
    luot_2: sai
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/07257" ]
    luot_2_ghi_chu: "câu đúng: Phần lớn bài là móc kép nhẹ ở sắc thái nhỏ (p, pp), phần nhiều có luyến; dấu chấm staccato chủ yếu ở móc đơn và hợp âm đệm của tay trái.; Đọc bản quét #07257: các nhóm móc kép của tay phải phần lớn có luyến, không chấm (tr. 3 hệ 3–4: chủ đề và đoạn leo nửa cung pp có luyến; tr. 4 hệ 4 'legato dolce'; tr. 5 hệ 1 và hệ 3–5: chùm ba pp và các nhóm 'pp leggieriss.' có luyến, không chấm). Chấm staccato dày nhất ở móc đơn tay trái (tr. 3 hệ 2–3, tr. 5 hệ 1 khóa Sol) và hợp âm đệm sau phách. Câu viết 'phần lớn là móc kép có chấm staccato' không khớp. Nếu ý câu chỉ là tính cách nhẹ, ngắt của bài thì nên viết lại như cau_dung."
    review: dung
  - id: n6
    cau: 'Tay trái nhảy giữa nốt trầm và hợp âm, vuốt nốt hoa mỹ lên nốt nhấn, và có chỗ bắt chéo lên trên tay phải (m.g.).'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Nốt trầm – hợp âm: ô 1–4, các ô đệm của chủ đề. Nốt hoa mỹ: tr. 5, khối ff, ba nốt nhỏ ở khuông dưới lên nốt trắng có dấu ^. m.g.: tr. 5 hệ 2 (dolciss.), tr. 6 hệ 1, tr. 7 hệ 1 (dolcissimo) và hệ 4: nốt viết ở khuông trên, chữ m.g. (main gauche). Review (Claude, 17/11/2026): bản quét: tay trái nốt trầm và hợp âm (tr. 3 ô 1–4), ba nốt hoa mỹ lên nốt có dấu ^ (tr. 5 hệ 3–4, ff), m.g. ở tr. 5 hệ 2, tr. 6 hệ 1, tr. 7 hệ 1 và hệ 4; bắt chéo lên trên tay phải thật ở tr. 5 hệ 2 và tr. 7 hệ 1 (nốt rất cao), còn tr. 6 hệ 1 tay trái chơi nốt trắng Sol♭4 dưới hợp âm tay phải.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/07257" ]
    luot_2_ghi_chu: "Bản quét: tr. 3 ô 1–4 tay trái nốt trầm Mi♭, Si♭ rồi hợp âm sau phách; tr. 5 hệ 3–4 (ff) tay trái vuốt nốt hoa mỹ lên nốt có dấu nhấn ^; 'm.g.' ở tr. 5 hệ 2, tr. 6 hệ 1, tr. 7 hệ 1 và hệ 4 (nốt tay trái viết trên khuông tay phải)."
    review: dung
  - id: n7
    cau: 'Bản nhạc ghi sắc thái từ ppp đến fff, có cả sf, sff, sfff; dùng ppp, pp, p, mp, mf, f, ff, fff, sf, sff, sfff.'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: da-sua
    ghi_chu: 'Tr. 3: mf, p, pp, f; tr. 4: mf, f, pp; tr. 5: sff, pp, ff, mf, ppp; tr. 6: mp, p, f, sff; tr. 7: pp, sf, ff, fff (trong "ff sempre", sfff ở hệ 4), ppp, fff ở hai hợp âm cuối. Sửa theo lượt 2: thêm sf (tr. 7 hệ 2 "<sf" hai lần, hệ 5 "sf p"), ở Vì sao nên học và mục Sắc thái. Review (Claude, 17/11/2026): bản quét: sf ở tr. 7 hệ 2 (hai lần sau dấu lớn dần) và hệ 5 ("sf p"); sfff hai lần tr. 7 hệ 4; ppp tr. 5 hệ 5 và tr. 7 hệ 5; fff tr. 7 hệ 5. Câu đã sửa khớp.'
    luot_2: sai
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/07257" ]
    luot_2_ghi_chu: "câu đúng: Bản nhạc ghi sắc thái từ ppp đến fff, có cả sfff; dùng ppp, pp, p, mp, mf, f, ff, fff, sf, sff, sfff.; Mọi mức trong câu đều có (ppp: tr. 5 hệ 5 '8va', tr. 7 hệ 5; mp: tr. 6 hệ 1–2; fff: tr. 7 hệ 5; sff: tr. 5 hệ 1, tr. 6 hệ 5, tr. 7 hệ 3; sfff: tr. 7 hệ 4). Nhưng danh sách thiếu sf: tr. 7 hệ 2 có hai lần '<sf' (sau dấu lớn dần, ô 1 và 3 của hệ) và tr. 7 hệ 5 có 'sf p'. Sửa danh sách cho đủ, hay bỏ chữ 'dùng …' nếu không muốn liệt kê hết."
    review: dung
  - id: n8
    cau: 'Đây là bài học tác phẩm đầu tiên trên site của một nhà soạn nhạc nữ.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'tac-pham.yml: tac_gia của các bản ghi loai bai-hoc khác: bach, bartok, beethoven, burgmuller, chopin, clementi, debussy, gretchaninov, grieg, liszt, mendelssohn, mozart, petzold, satie, schubert, schumann, tchaikovsky, đều là nam; riêng musette-re (BWV Anh. 126) khuyết danh, không có tac_gia; Chaminade là bài học đầu của đợt nhà soạn nhạc nữ (lộ trình lượt 4). Review (Claude, 17/11/2026): tac_gia các bản ghi loai bai-hoc trong tac-pham.yml: chỉ chaminade là nữ (một bản ghi không có tac_gia).'
    review: dung
  - id: n9
    cau: 'Cécile Chaminade (1857–1944) là nhà soạn nhạc người Pháp.'
    loai: nam
    nguon: [ imslp-chaminade ]
    ket_qua: dung
    ghi_chu: 'Năm khớp nha-soan-nhac.yml (chaminade: 1857, 1944) và trang lich-su/nu-nha-soan-nhac (đã khóa: "Cécile Chaminade (1857–1944), Pháp").'
    luot_2: dung
    luot_2_nguon: [ "http://catalogue.bnf.fr/ark:/12148/cb147860408" ]
    luot_2_ghi_chu: "Bản ghi tên người của BnF: 'Chaminade, Cécile (1857-1944)', mã nước FR, ngày 08/08/1857 – 13/04/1944, 'Compositrice, pianiste et chef d'orchestre' (đọc qua API SRU catalogue.bnf.fr)."
    review: dung
  - id: n10
    cau: 'Pierrette do nhà Enoch & Costallat ở Paris in năm 1889.'
    loai: nam
    nguon: [ bnf-1889 ]
    ket_qua: dung
    ghi_chu: 'BnF: Enoch & Costallat (Paris), 1889, cotage E. F. & C. 1641. Không thấy bản in nào sớm hơn trong kết quả tìm của BnF (tìm "Pierrette" và "Chaminade"). IMSLP không ghi năm in lần đầu. Review (Claude, 17/11/2026): BnF API SRU, cb42900932d: Enoch & Costallat (Paris), 1889, cotage E. F. & C. 1641.'
    luot_2: dung
    luot_2_nguon: [ "http://catalogue.bnf.fr/ark:/12148/cb42900932d" ]
