nhan_dinh:
  - id: n1
    cau: 'Pierrette là một Air de ballet (điệu múa ballet) viết cho piano.'
    loai: ten
    nguon: [ bnf-1889, bernard ]
    ket_qua: dung
    ghi_chu: 'BnF: "Pierrette, air de ballet pour piano. Op. 41". Bản in: "PIERRETTE. AIR DE BALLET … PIANO".'
  - id: n2
    cau: 'Bài dài khoảng hai phút rưỡi.'
    loai: so-lieu
    nguon: [ kolodin-ban-thu ]
    ket_qua: dung
    ghi_chu: 'Bản thu gợi ý: tiếng đàn từ 8,87 s đến 155,91 s, tức 147 s. Ở ♩ = 104 (1,15 s mỗi ô 2/4), độ dài bản nhạc cũng khoảng như vậy.'
  - id: n3
    cau: 'Bài có trong danh sách thi Grade 8 của ABRSM (danh sách C, đề cương 2025–2026).'
    loai: cap-do
    nguon: [ abrsm-2025 ]
    ket_qua: dung
    ghi_chu: 'PDF đề cương 2025 & 2026, Grade 8, danh sách C, số 6. Khảo sát G6 ghi thêm các kỳ 2021–2022, 2023–2024, 2027–2028; trang chỉ nêu kỳ đã đọc.'
  - id: n4
    cau: 'Bài ở chặng 6 của lộ trình trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'chang: 6 trong bản ghi tac-pham/chaminade-pierrette; cap-do.yml: chặng 6 ứng với Grade 7–8.'
  - id: n5
    cau: 'Phần lớn bài là móc kép có chấm staccato ở sắc thái nhỏ.'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Chủ đề (tr. 3 từ ô 5; tr. 4, tr. 6) móc kép có chấm, p; đoạn giữa chùm ba móc kép pp, móc kép pp leggieriss., ppp leggieriss. (tr. 5); đoạn kết pp (tr. 7). Các chỗ f, ff, sff ngắn.'
  - id: n6
    cau: 'Tay trái nhảy giữa nốt trầm và hợp âm, vuốt nốt hoa mỹ lên nốt nhấn, và có chỗ bắt chéo lên trên tay phải (m.g.).'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Nốt trầm – hợp âm: ô 1–4, các ô đệm của chủ đề. Nốt hoa mỹ: tr. 5, khối ff, ba nốt nhỏ ở khuông dưới lên nốt trắng có dấu ^. m.g.: tr. 5 hệ 2 (dolciss.), tr. 6 hệ 1, tr. 7 hệ 1 (dolcissimo) và hệ 4: nốt viết ở khuông trên, chữ m.g. (main gauche).'
  - id: n7
    cau: 'Bản nhạc ghi sắc thái từ ppp đến fff, có cả sfff; dùng ppp, pp, p, mp, mf, f, ff, fff, sff, sfff.'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Tr. 3: mf, p, pp, f; tr. 4: mf, f, pp; tr. 5: sff, pp, ff, mf, ppp; tr. 6: mp, p, f, sff; tr. 7: pp, sf, ff, fff (trong "ff sempre", sfff ở hệ 4), ppp, fff ở hai hợp âm cuối.'
  - id: n8
    cau: 'Đây là bài học tác phẩm đầu tiên trên site của một nhà soạn nhạc nữ.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'tac-pham.yml: tac_gia của các bản ghi loai bai-hoc khác: bach, bartok, beethoven, burgmuller, chopin, clementi, debussy, gretchaninov, grieg, liszt, mendelssohn, mozart, petzold, satie, schubert, schumann, tchaikovsky, đều là nam; riêng musette-re (BWV Anh. 126) khuyết danh, không có tac_gia; Chaminade là bài học đầu của đợt nhà soạn nhạc nữ (lộ trình lượt 4).'
  - id: n9
    cau: 'Cécile Chaminade (1857–1944) là nhà soạn nhạc người Pháp.'
    loai: nam
    nguon: [ imslp-chaminade ]
    ket_qua: dung
    ghi_chu: 'Năm khớp nha-soan-nhac.yml (chaminade: 1857, 1944) và trang lich-su/nu-nha-soan-nhac (đã khóa: "Cécile Chaminade (1857–1944), Pháp").'
  - id: n10
    cau: 'Pierrette do nhà Enoch & Costallat ở Paris in năm 1889.'
    loai: nam
    nguon: [ bnf-1889 ]
    ket_qua: dung
    ghi_chu: 'BnF: Enoch & Costallat (Paris), 1889, cotage E. F. & C. 1641. Không thấy bản in nào sớm hơn trong kết quả tìm của BnF (tìm "Pierrette" và "Chaminade"). IMSLP không ghi năm in lần đầu.'
  - id: n11
    cau: 'Nhà Enoch in thêm bản cho piano bốn tay (1897), măng-đô-lin (1899) và dàn nhạc (1900); nhà Carl Fischer ở New York in một bản tam tấu cho violin, cello và piano (1914).'
    loai: nam
    nguon: [ bnf-soan-lai, imslp-op41 ]
    ket_qua: dung
    ghi_chu: 'BnF: bốn tay 1897 (E. & C. 3324), măng-đô-lin với guitar hay piano 1899 (E. & Cie 3797, 3798), dàn nhạc (A. Stubbe) 1900. IMSLP: Gaston Borch, The Carl Fischer Favorite Trio Album No. 8, New York, Carl Fischer, 1914, violin, cello, piano.'
  - id: n12
    cau: 'Chính Chaminade cũng thu Pierrette bằng tiếng đàn của bà; đĩa Masters of the piano (Delta, London, 1963) in lại bản thu ấy.'
    loai: lich-su
    nguon: [ bnf-delta ]
    ket_qua: dung
    ghi_chu: 'BnF ghi "Pierrette, op. 41 / Chaminade, comp.; Cécile Chaminade, p" trong đĩa Delta TQD 3037, London, 1963 (tuyển các bản thu cũ của Pachmann, Grünfeld, Pugno, Grieg…). "In lại" vì đĩa 1963 tuyển bản thu của các nghệ sĩ đã mất (Grieg mất 1907); năm thu gốc không ghi trên mục lục, trang không nêu.'
  - id: n13
    cau: 'Bản nhạc dùng trên trang là bản in của M. Bernard ở St. Petersburg, không ghi năm, có trên IMSLP.'
    loai: so-lieu
    nguon: [ imslp-op41, bernard ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "St. Petersburg: M. Bernard, n.d.(ca.1885?)". Năm ca.1885 của IMSLP sớm hơn năm in ở Paris (1889) nên trang không nêu.'
  - id: n14
    cau: 'Bản thu gợi ý là của nghệ sĩ piano Luis Kolodin, đăng trên IMSLP năm 2023, giấy phép CC BY-SA 4.0.'
    loai: ten
    nguon: [ imslp-op41 ]
    ket_qua: dung
    ghi_chu: 'IMSLP #848447: Performer Luis Kolodin (Piano), Luis Kolodin, 2023, Creative Commons Attribution-ShareAlike 4.0, đăng 2023/4/4.'
  - id: n15
    cau: 'Bảng Theo dõi khi nghe: mở đầu ô 1–4 mf chỉ tay trái; chủ đề từ ô 5 p, ô 5 dừng trên hợp âm Rê–Fa♯; giai điệu leo theo nửa cung pp rồi lớn dần; f chuỗi chùm ba móc kép đi xuống, rồi bốn ô mở đầu trở lại marcatissimo, nhỏ dần; chủ đề trở lại p; lớn dần trên chùm ba, hợp âm sff (sec), một ô im lặng; đoạn giữa pp chùm ba tay phải, tay trái khóa Sol móc đơn staccato; ff nốt hoa mỹ tay trái, hợp âm nhấn tay phải, ff và mf xen nhau; pp leggierissimo hai tay khóa Sol; ppp leggierissimo 8va; chuyển mp, p marcato, nhỏ dần, poco rit.; chủ đề lần ba a tempo mp; sau một ô im lặng đoạn kết pp chùm ba, tay trái bắt chéo (m.g.); hai hợp âm sfff; chuỗi móc kép đi xuống ở hai tay tới ppp, một ô im lặng, hai hợp âm fff.'
    loai: cau-truc
    nguon: [ bernard, kolodin-ban-thu ]
    ket_qua: dung
    ghi_chu: 'Theo thứ tự bản in: tr. 3 hệ 1 (ô 1–5), hệ 4 (pp, nửa cung đi lên); tr. 4 hệ 2 (mf cresc., f, chùm ba đi xuống ở khuông trên), hệ 3 (marcatissimo, dim.; p chủ đề); tr. 5 hệ 1 (cresc., sff sec., ô nghỉ cả hai khuông, pp chùm ba, tay trái khóa Sol Sol–Fa♯–Sol–Fa có chấm), hệ 3–4 (ff, nốt hoa mỹ ba nốt, mf; pp leggieriss., khuông dưới khóa Sol), hệ 5 (8va ppp leggieriss.); tr. 6 hệ 1–2 (mp, m.g., p marcato, dim., pp poco rit., a tempo mp), hệ 5 (cresc., sff sec., ô nghỉ); tr. 7 hệ 1 (pp chùm ba, dolcissimo m.g.), hệ 4 (sfff hai ô), hệ 5 (pp dim., ppp, ô nghỉ, fff hai hợp âm). Mốc trên bản thu Kolodin: xem ghi_chu của hồ sơ; 66,7 s và 123,0 s là hai ô im lặng, khớp tốc độ ♩ ≈ 104.'
  - id: n16
    cau: 'Bảng Cấu trúc: mở đầu ô 1–4 (nốt trầm Mi♭, Si♭, hợp âm Mi♭ trưởng sau phách; ô 1 và 3 hợp âm có dấu nhấn ngân một phách, ô 2 và 4 hợp âm dài một móc đơn); A; mở đầu trở lại và A lần hai kết bằng sff và một ô im lặng; đoạn giữa nhiều khối sắc thái; chuyển; A lần ba a tempo; đoạn kết.'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Ô 1–4 đọc ở 400 dpi (xem khuong_nhac khối 1). Các phần còn lại như n15. Chủ đề vang ba lần: tr. 3 ô 5, tr. 4 hệ 3 ô cuối (p), tr. 6 hệ 2 (a tempo, mp).'
  - id: n17
    cau: 'Ở ô 5 chủ đề vào p: một cặp móc kép (Mi♭–Sol rồi Si♭), rồi hợp âm Rê–Fa♯ có dấu thăng, lạ trong giọng Mi♭ trưởng; câu nhạc tiếp sang ô 6.'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Đọc ô 5 ở 600 dpi: z, [Mi♭4 Sol4] móc kép, Si♭4 móc kép, [Rê4 Fa♯4] móc đen, luyến sang ô 6.'
  - id: n18
    cau: 'Bản in ghi Allegretto, ♩ = 104; Allegretto là hơi nhanh.'
    loai: dinh-nghia
    nguon: [ bernard, trinity-thuat-ngu ]
    ket_qua: dung
    ghi_chu: 'Tr. 3: "Allegretto. ♩=104".'
  - id: n19
    cau: 'Trong bản thu gợi ý, tốc độ chung rất gần số in trên bản nhạc.'
    loai: so-lieu
    nguon: [ kolodin-ban-thu ]
    ket_qua: dung
    ghi_chu: 'Từ 8,87 s (ô 1) tới ô im lặng thứ hai (123,04 s): khoảng 99 ô, 1,153 s mỗi ô 2/4, ♩ ≈ 104.'
  - id: n20
    cau: 'Leggierissimo là thật nhẹ (leggiero: nhẹ); marcatissimo là thật rõ từng nốt; sec (tiếng Pháp) là khô, ngắn; sff, sfff là nhấn mạnh bất ngờ.'
    loai: dinh-nghia
    nguon: [ trinity-thuat-ngu ]
    ket_qua: dung
    ghi_chu: 'Đuôi -issimo là mức cao nhất (rất). Sec: tiếng Pháp "khô". sf/sfz: nhấn mạnh đột ngột.'
  - id: n21
    cau: 'm.g. là viết tắt tiếng Pháp main gauche, tay trái.'
    loai: dinh-nghia
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Chữ m.g. in trên khuông trên ở những chỗ có nốt rất cao hay rất thấp tách khỏi bè tay phải (tr. 5, 6, 7). main gauche: tay trái (tiếng Pháp); m.d. main droite: tay phải.'
  - id: n22
    cau: '8va: chơi cao hơn nốt viết một quãng tám.'
    loai: dinh-nghia
    nguon: [ omt-ky-hieu ]
    ket_qua: dung
  - id: n23
    cau: 'Bản in ghi chỗ đạp (Ped.) và chỗ nhả (✱) ở nhiều ô, thường đặt ở nốt trầm của tay trái.'
    loai: cau-truc
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Ví dụ ô 1 (Ped. dưới Mi♭2), tr. 3 hệ 2–4, tr. 5, tr. 7: Ped. dưới nốt trầm, ✱ sau đó.'
  - id: n24
    cau: 'Nhịp phải đều để người múa bước theo được.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
