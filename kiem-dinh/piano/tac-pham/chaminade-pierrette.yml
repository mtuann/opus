ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 4). Nốt nhạc, sắc thái, chữ chỉ dẫn chép từ bản quét M. Bernard IMSLP #07257 (5 trang, đánh số 3–7; đọc ở 110–600 dpi). Bản quét mờ, nốt ở nhiều ô khó đọc chắc, nên trang chỉ nêu số ô ở bốn ô mở đầu và ô 5 (đã đọc ở 400–600 dpi); các đoạn sau mô tả theo sự kiện (sắc thái, chữ chỉ dẫn, kiểu viết), không theo số ô. Trích đoạn: ô 1–5. Năm in lần đầu lấy từ mục lục BnF (khảo sát G6 ghi "chưa kiểm được"). Mốc của bảng Theo dõi khi nghe: khoảng lặng (ffmpeg silencedetect −35 dB: 0–8,87 s, 66,71–67,88 s, 123,04–124,19 s, 151,37–151,75 s, 155,91 s–hết) và độ to theo nửa giây; tốc độ bản thu từ đầu tiếng đàn (8,87 s) tới ô im lặng thứ hai (123,04 s) khoảng 1,15 s mỗi ô 2/4, tức ♩ ≈ 104. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/chaminade-pierrette.'
