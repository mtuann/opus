  - id: n15
    cau: 'Bảng Theo dõi khi nghe: mở đầu ô 1–4 mf chỉ tay trái; chủ đề từ ô 5 p, ô 5 dừng trên hợp âm Rê–Fa♯; giai điệu leo theo nửa cung pp rồi lớn dần; f chuỗi chùm ba móc kép đi xuống, rồi bốn ô mở đầu trở lại marcatissimo, nhỏ dần; chủ đề trở lại p; lớn dần trên chùm ba, hợp âm sff (sec), một ô im lặng; đoạn giữa pp chùm ba tay phải, tay trái khóa Sol móc đơn staccato; ff nốt hoa mỹ tay trái, hợp âm nhấn tay phải, ff và mf xen nhau; pp leggierissimo hai tay khóa Sol; ppp leggierissimo 8va; chuyển mp, p marcato, nhỏ dần, poco rit.; chủ đề lần ba a tempo mp; sau một ô im lặng đoạn kết pp chùm ba, tay trái bắt chéo (m.g.); hai hợp âm sfff; chuỗi móc ba đi xuống ở hai tay tới ppp, một ô im lặng, hai hợp âm fff.'
    loai: cau-truc
    nguon: [ bernard, kolodin-ban-thu ]
    ket_qua: da-sua
    ghi_chu: 'Theo thứ tự bản in: tr. 3 hệ 1 (ô 1–5), hệ 4 (pp, nửa cung đi lên); tr. 4 hệ 2 (mf cresc., f, chùm ba đi xuống ở khuông trên), hệ 3 (marcatissimo, dim.; p chủ đề); tr. 5 hệ 1 (cresc., sff sec., ô nghỉ cả hai khuông, pp chùm ba, tay trái khóa Sol Sol–Fa♯–Sol–Fa có chấm), hệ 3–4 (ff, nốt hoa mỹ ba nốt, mf; pp leggieriss., khuông dưới khóa Sol), hệ 5 (8va ppp leggieriss.); tr. 6 hệ 1–2 (mp, m.g., p marcato, dim., pp poco rit., a tempo mp), hệ 5 (cresc., sff sec., ô nghỉ); tr. 7 hệ 1 (pp chùm ba, dolcissimo m.g.), hệ 4 (sfff hai ô), hệ 5 (pp dim., ppp, ô nghỉ, fff hai hợp âm). Mốc trên bản thu Kolodin: xem ghi_chu của hồ sơ; 66,7 s và 123,0 s là hai ô im lặng, khớp tốc độ ♩ ≈ 104. Sửa theo lượt 2 (17/11/2026): chuỗi đi xuống ở tr. 7 hệ 5 nối ba gạch (móc ba), không phải móc kép; đã sửa dòng cuối bảng và dòng Đoạn kết của bảng Cấu trúc. Lượt 2 đã soát mọi mục khác của bảng trên bản quét. Review (Claude, 17/11/2026): soát lại trên bản quét tr. 3–7 và độ to bản thu. Sửa thêm: trước hai hợp âm fff (tr. 7 hệ 5, ô thứ tư) không phải ô im lặng: tay phải lặng cả ô nhưng tay trái có một móc đơn ở phách 1, hai móc đơn lặng, rồi quãng tám fff ở móc đơn cuối nối sang ô sau (đọc ở 400–700 dpi); bản thu chỉ lặng 0,37 s (151,37–151,75 s). Đã đổi "một ô im lặng" thành "một khoảng lặng ngắn" ở dòng cuối bảng Theo dõi khi nghe và "ô im lặng trước chúng" thành "khoảng lặng ngắn trước chúng" ở dòng Đoạn kết của bảng Cấu trúc. Chuỗi đi xuống đúng là ba gạch nối (móc ba), có chấm. Hai ô im lặng thật (sau sff, tr. 5 hệ 1 và tr. 6 hệ 5) đúng, khớp 66,71–67,88 s và 123,04–124,19 s. Ghi nhận: giữa khối pp leggierissimo và ppp 8va còn một khối ff–mf nữa (tr. 5 hệ 4); bảng không nêu, không sai.'
    luot_2: sai
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/07257" ]
    luot_2_ghi_chu: "câu đúng: Bảng Theo dõi khi nghe: … hai hợp âm sfff; chuỗi móc ba đi xuống ở hai tay tới ppp, một ô im lặng, hai hợp âm fff. (các phần khác giữ nguyên); Đã soát từng mục trên bản quét: mở đầu mf tay trái (tr. 3); ô 5 p, Rê–Fa♯; leo nửa cung pp rồi lớn dần (tr. 3 hệ 4); f chùm ba đi xuống (tr. 4 hệ 2); marcatissimo, dim. (tr. 4 hệ 3); A p; cresc. chùm ba, sff 'sec.', ô lặng (tr. 5 hệ 1); pp chùm ba, tay trái khóa Sol móc đơn staccato; ff hoa mỹ tay trái xen mf; pp leggieriss. hai tay khóa Sol; ppp leggieriss. 8va (tr. 5); mp, p marcato, dim., poco rit. (tr. 6, có cả pp); a tempo mp; ô lặng rồi pp chùm ba, m.g. (tr. 7); hai sfff (tr. 7 hệ 4). Chỗ sai duy nhất: chuỗi đi xuống ở tr. 7 hệ 5 (pp dim. ở tay phải, ppp ở tay trái) có ba gạch nối, tức móc ba, không phải móc kép. Bản thu: ô lặng sau sff ở 66,9–67,9 s và 123,2–124,2 s."
    review: dung
  - id: n16
    cau: 'Bảng Cấu trúc: mở đầu ô 1–4 (nốt trầm Mi♭, Si♭, hợp âm Mi♭ trưởng sau phách; ô 1 và 3 hợp âm có dấu nhấn ngân một phách, ô 2 và 4 hợp âm dài một móc đơn); A; mở đầu trở lại và A lần hai kết bằng sff và một ô im lặng; đoạn giữa nhiều khối sắc thái; chuyển; A lần ba a tempo; đoạn kết.'
