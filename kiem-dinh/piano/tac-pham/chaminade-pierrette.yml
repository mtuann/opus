    ghi_chu: 'BnF: bốn tay 1897 (E. & C. 3324), măng-đô-lin với guitar hay piano 1899 (E. & Cie 3797, 3798), dàn nhạc (A. Stubbe) 1900. IMSLP: Gaston Borch, The Carl Fischer Favorite Trio Album No. 8, New York, Carl Fischer, 1914, violin, cello, piano. Review (Claude, 17/11/2026): BnF API SRU cb42900933r: bản dàn nhạc A. Stubbe, Enoch, 1900, E. & C. 4485 (chỉ kiểm mục này).'
    luot_2: dung
    luot_2_nguon: [ "http://catalogue.bnf.fr/ark:/12148/cb41016296p", "http://catalogue.bnf.fr/ark:/12148/cb448408500", "http://catalogue.bnf.fr/ark:/12148/cb42900933r", "https://imslp.org/wiki/Pierrette,_Op.41_(Chaminade,_C%C3%A9cile)" ]
    luot_2_ghi_chu: "BnF: bản bốn tay (Ch. Steiger), Enoch, 1897; mandoline (J. A. Carboni, kèm guitar hay piano), Enoch et Cie, 1899; dàn nhạc (A. Stubbe), Enoch, 1900. IMSLP: bản soạn cho violin, cello và piano (Gaston Borch), The Carl Fischer Favorite Trio Album No. 8, Carl Fischer, New York, 1914."
