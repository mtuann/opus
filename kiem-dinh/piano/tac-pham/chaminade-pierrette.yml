nhan_dinh:
  - id: n1
    cau: 'Pierrette là một Air de ballet (điệu múa ballet) viết cho piano.'
    loai: ten
    nguon: [ bnf-1889, bernard ]
    ket_qua: dung
    ghi_chu: 'BnF: "Pierrette, air de ballet pour piano. Op. 41". Bản in: "PIERRETTE. AIR DE BALLET … PIANO". Review (Claude, 17/11/2026): bản quét #07257 tr. 3 (150 dpi): "PIERRETTE. AIR DE BALLET", "C. CHAMINADE. Op. 41", khuông PIANO; BnF SRU cb42900932d: "Pierrette, air de ballet pour piano. Op. 41".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Pierrette,_Op.41_(Chaminade,_C%C3%A9cile)", "https://imslp.org/wiki/Special:ImagefromIndex/07257" ]
    luot_2_ghi_chu: "Bản quét IMSLP #07257, tr. 3 (trang đầu): tiêu đề 'PIERRETTE. AIR DE BALLET', 'C. Chaminade Op. 41', khuông 'PIANO'. IMSLP: Alternative Title 'Air de ballet', Instrumentation piano."
    review: dung
  - id: n2
