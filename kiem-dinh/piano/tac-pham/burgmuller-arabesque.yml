    nguon: [imslp-op105, imslp-op109]
    ket_qua: dung
    ghi_chu: 'IMSLP: "12 Études brillantes et mélodiques", Op.105 (12 etudes); "18 Études de genre", Op.109 (18 bài).'
  - id: n20
    cau: Tựa đề đầy đủ của Op. 100 nói các bài được soạn và ghi số ngón cho bàn tay nhỏ.
    loai: ten
    nguon: [imslp-op100]
    ket_qua: dung
    ghi_chu: 'IMSLP Alternative Title: "25 études faciles et progressives, composées et doigtées expressément pour l''etendue des petites mains".'
  - id: n21
    cau: 'Mỗi bài trong tập có một tựa tiếng Pháp gợi hình ảnh: sự ngây thơ, khúc đồng quê, dòng suối trong, cuộc săn.'
    loai: ten
    nguon: [imslp-op100]
    ket_qua: dung
    ghi_chu: 'IMSLP: La candeur (1), La pastorale (3), Le courant limpide (7), La chasse (9). "Khác với những tập luyện ngón thuần túy" là cách đặt đối lập, không phải nhận định riêng.'
  - id: n22
    cau: Op. 100 đặc biệt phổ biến trong giáo trình piano ở Nhật Bản và ở nhiều nước khác.
    loai: lich-su
    nguon: [ptna-burgmuller, abrsm-1920, rcm-2022]
    ket_qua: dung
    ghi_chu: 'PTNA: "In Japan, however, he is widely renowned as the composer of “25 Études faciles et progressives, Op. 100”, a foundational work for piano learners." Nước khác: ABRSM 2019–2020 (Anh) xếp Arabesque ở Grade 2; RCM 2022 (Canada) xếp ở Level 3; hồ sơ bản ghi lần 1 n4: Innocence, Douce plainte, Ballade, La tarentelle có trong các đề cương ABRSM.'
  - id: n23
    cau: Arabesque vốn là tên một kiểu hoa văn trang trí gồm những đường cong uốn lượn đan vào nhau.
    loai: dinh-nghia
    nguon: [cnrtl-arabesque]
    ket_qua: dung
    ghi_chu: 'CNRTL: "Sorte d’ornement … qui consiste en des entrelacements de feuillages, de fruits, de fleurs…"; gốc tiếng Ý arabesco "ornement formé de plantes, de branches, de feuillages... entrelacés".'
  - id: n24
    cau: Trong âm nhạc, chữ arabesque chỉ những bản nhạc có nét trang trí bay bổng.
    loai: dinh-nghia
    nguon: [cnrtl-arabesque]
    ket_qua: dung
    ghi_chu: 'CNRTL: nghĩa "musique: Ornementation musicale"; mục MUS. "le premier violon l''orne (un thème) d''une arabesque bouclée".'
  - id: n25
    cau: Schumann và Debussy cũng có bản Arabesque, không liên quan đến bài này.
    loai: ten
    nguon: [imslp-schumann-op18, imslp-debussy-arabesques]
    ket_qua: dung
    ghi_chu: 'IMSLP: Schumann, Arabeske Op. 18 (1838, in 1839); Debussy, Deux Arabesques L. 66 (1890–91). Hai tác phẩm riêng, ra đời trước và sau Op. 100 (1851). "Nổi tiếng" là cách nói thông thường; RCM 2022 có Deux arabesques trong danh sách.'
  - id: n26
    cau: Ở bài này, "hoa văn" là chùm năm nốt chạy lên xuống, cứ xuất hiện rồi biến mất.
    loai: cau-truc
    nguon: *m
    ket_qua: dung
    ghi_chu: 'Mutopia: a16 b c b a (lên rồi xuống), a16 b c d e (lên); mỗi chùm kết bằng móc đơn staccato rồi lặng (r8). Hình ảnh "nét vẽ" là diễn giải.'
