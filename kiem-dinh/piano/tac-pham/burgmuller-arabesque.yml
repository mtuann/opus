nhan_dinh:
  - id: n1
    cau: Arabesque là bài số 2 trong tập étude Op. 100 của Burgmüller.
    loai: danh-muc
    nguon: [imslp-op100]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (câu mở đầu): "*Arabesque* là một trong những bài được yêu thích nhất trong tập étude của Burgmüller, vì nó nghe khó hơn thực tế, và vì nó dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin." Chữ mới: "*Arabesque* là bài số 2 trong tập étude Op. 100 của Burgmüller, và dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin." Lý do: "được yêu thích nhất" và "nghe khó hơn thực tế" là đánh giá không đo được (như La candeur n2 của D6-L1); IMSLP: number=2, title=L''arabesque. Sửa cả description (frontmatter). Vế "dạy đúng những thứ cần có trước Czerny hay Chopin" là lời khuyên (n2).'
  - id: n2
    cau: Bài dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n3
    cau: Bài dài khoảng một phút.
    loai: so-lieu
    nguon: [imslp-op100, mutopia-203]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chưa đầy một phút" (câu mở đầu, description). Chữ mới: "Khoảng một phút". Lý do: bản thu gợi ý của trang (Luis Kolodin, IMSLP; file public/audio/burgmuller-arabesque.mp3, ffprobe 65,43 giây) dài hơn một phút. Tính trên bản nhạc: chơi đủ hai dấu nhắc lại là 55 ô 2/4 (2 + 2×8 + 2×16 + 5) = 110 phách: ♩ = 132 khoảng 50 giây, ♩ = 100 khoảng 66 giây.'
  - id: n4
    cau: Bài có những chùm nốt chạy nhanh, hợp âm ngắn gọn và sắc thái đổi liên tục.
    loai: cau-truc
    nguon: &m
      - mutopia-203
    ket_qua: dung
    ghi_chu: 'Mutopia: a16( b c b a8-.) …; hợp âm <a c e>4-. ở dẫn nhập; p, cresc., sf, f, dim. e poco rall., a tempo, p, dolce, risoluto f, sf.'
  - id: n5
    cau: 'Hình nốt chính là năm nốt liền bậc trong một thế tay, ở tốc độ Allegro.'
    loai: cau-truc
    nguon: *m
    ket_qua: dung
    ghi_chu: 'Mutopia: meter "Allegro scherzando"; a16 b c b a8, a16 b c d e8, d16 e f g a8 (năm nốt liền bậc, vừa năm ngón).'
  - id: n6
    cau: Phải chơi hình nốt ấy đều, nhẹ và rõ; đây là cửa vào của mọi đoạn chạy ngón về sau.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
  - id: n7
    cau: Ở đoạn giữa, tay trái chạy đúng hình nốt ấy.
    loai: cau-truc
    nguon: *m
    ket_qua: dung
    ghi_chu: 'Mutopia, tay trái ô 11–17: gis16( a b a gis8) …, a16( b c d e8) …, cis16 d e d cis8, d16 e f g a8 (khóa Sol).'
  - id: n8
    cau: Bài có hợp âm ngắn, nốt kết câu ngắn, p đổi sang f nhanh và sf bất ngờ; tính cách scherzando nằm ở đó.
    loai: cau-truc
    nguon: *m
    ket_qua: dung
    ghi_chu: 'Mutopia: hợp âm staccato ô 1–2; a8-. kết mỗi chùm; e4-5_\sf (kết thứ nhất của A); e,4.-5_\f ngay sau kết thứ hai (p sang f); "Allegro scherzando". Vế "tính cách nằm ở đó" là cách diễn giải.'
  - id: n9
    cau: Mỗi bài của Burgmüller trong Op. 100 có một cái tên gợi hình.
    loai: ten
    nguon: [imslp-op100]
    ket_qua: dung
    ghi_chu: 'IMSLP: 25 tựa (La candeur, L''arabesque, La pastorale, … La chevaleresque). "Không viết bài tập khô khan; học kỹ thuật mà vẫn chơi nhạc" là lời giới thiệu.'
  - id: n10
    cau: Bài khoảng một phút, dễ học thuộc, hợp để chơi cho người khác nghe.
    loai: so-lieu
    nguon: [imslp-op100]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chưa đến một phút, dễ học thuộc". Chữ mới: "Khoảng một phút, dễ học thuộc". Lý do như n3 (bản thu gợi ý 65 giây). "Dễ học thuộc, hợp để chơi cho người khác nghe" là lời khuyên.'
  - id: n11
    cau: Friedrich Burgmüller sinh năm 1806 ở Regensburg.
    loai: nam
    nguon: [db-burgmuller, ptna-burgmuller]
    ket_qua: dung
    ghi_chu: 'Deutsche Biographie: Lebensdaten 1806–1874, Geburtsort Regensburg. PTNA: "Born in Regensburg, Germany".'
  - id: n12
    cau: Burgmüller sinh trong một gia đình nhạc sĩ.
    loai: lich-su
    nguon: [ndb-burgmuller, ptna-burgmuller]
    ket_qua: dung
    ghi_chu: 'NDB: bài gia đình Burgmüller (cha Johann August Franz, em Norbert, đều là nhạc sĩ; Friedrich ở mục "B"). PTNA: "In Europe, the name Burgmüller typically refers to his father, Johann August Franz, or his brother, Norbert."'
  - id: n13
    cau: Năm 1832 Burgmüller sang Paris.
    loai: nam
    nguon: [ndb-burgmuller, ptna-burgmuller]
    ket_qua: dung
    ghi_chu: 'NDB: "lebte seit 1832 in Paris". PTNA: "moved to Paris at the age of 26" (1806 + 26 = 1832).'
  - id: n14
    cau: Burgmüller sống ở Pháp đến cuối đời; ông dạy piano.
    loai: lich-su
    nguon: [db-burgmuller, ptna-burgmuller, ndb-burgmuller]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Năm 1832 ông sang Paris và ở lại đó đến cuối đời. Ông là thầy dạy piano được ưa chuộng, viết nhiều nhạc salon…". Chữ mới: "Năm 1832 ông sang Paris và sống ở Pháp đến cuối đời. Ông dạy piano, viết nhiều nhạc salon…". Lý do: Deutsche Biographie ghi Sterbeort Beaulieu; PTNA: "died in Beaulieu, Marolles-en-Hurepoix" (gần Paris, không phải Paris); "được ưa chuộng" là đánh giá không có nguồn, PTNA chỉ ghi "active as a salon musician and educator". Cùng cách sửa với La candeur n16 (D6-L1). Chú ý cho người giao: hồ sơ La candeur n16 viết Beaulieu-sur-Mer; PTNA ghi Beaulieu ở Marolles-en-Hurepoix (Essonne). Chữ "sống ở Pháp" đúng với cả hai.'
  - id: n15
    cau: Burgmüller viết nhiều nhạc salon cho người chơi nghiệp dư.
    loai: lich-su
    nguon: [ndb-burgmuller, ptna-burgmuller]
    ket_qua: dung
    ghi_chu: 'NDB: "Komponist populärer Klaviermusik". PTNA: "In Paris, he was active as a salon musician and educator". IMSLP Category Burgmüller: nhiều "Valse de salon", "Fantaisie brillante" trên giai điệu opera.'
  - id: n16
    cau: Burgmüller viết nhạc cho vở ballet La Péri (1843).
    loai: nam
    nguon: [imslp-peri, ptna-burgmuller]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Work Title=La Peri", "Number of Movements/Sections=3 acts", "First Performance=1843-02-22", "Tags=ballets ; orch". PTNA: "His major work includes the ballet music “La Péri”".'
  - id: n17
    cau: Ngày nay tên Burgmüller gắn với ba tập étude cho người học, Op. 100, Op. 105 và Op. 109.
    loai: lich-su
    nguon: [ptna-burgmuller, imslp-op105, imslp-op109]
    ket_qua: dung
    ghi_chu: 'PTNA: "he is primarily known for his pedagogical piano pieces, Op. 100, 105, and 109".'
  - id: n18
    cau: 25 Études faciles et progressives, Op. 100 in năm 1851.
    loai: nam
    nguon: [imslp-op100]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Year of First Publication=1851 – Paris: Benoît aîné"; Bibliographie de la France 27/12/1851.'
  - id: n19
