    luot_2: dung
    luot_2_nguon: [ "https://www.deutsche-biographie.de/sfz7530.html", "https://data.bnf.fr/fr/ark:/12148/cb14788755q" ]
    luot_2_ghi_chu: "Deutsche Biographie (chỉ mục, GND 117168890): 1806–1874, nơi sinh Regensburg. BnF: sinh 04-12-1806 (trường birthPlace của JSON-LD BnF ghi nhầm 'Paris', không dùng)."
  - id: n12
    cau: Burgmüller sinh trong một gia đình nhạc sĩ.
    loai: lich-su
    nguon: [ ndb-burgmuller, ptna-burgmuller ]
    ket_qua: dung
    ghi_chu: 'NDB: bài gia đình Burgmüller (cha Johann August Franz, em Norbert, đều là nhạc sĩ; Friedrich ở mục "B"). PTNA: "In Europe, the name Burgmüller typically refers to his father, Johann August Franz, or his brother, Norbert."'
    luot_2: dung
    luot_2_nguon: [ "https://www.deutsche-biographie.de/sfz7532.html", "https://web.archive.org/web/20250326184610/https://www.staatsoper.de/en/biographies/burgmueller-friedrich" ]
    luot_2_ghi_chu: "ADB (mục August Friedrich Burgmüller): cha là nhạc trưởng thành phố Düsseldorf, nhà soạn nhạc, 'ist der Vater von Friedrich und Norbert B.'; em Norbert là nhà soạn nhạc. Staatsoper: học nghề nhạc từ cha."
  - id: n13
    cau: Năm 1832 Burgmüller sang Paris.
    loai: nam
    nguon: [ ndb-burgmuller, ptna-burgmuller ]
    ket_qua: dung
    ghi_chu: 'NDB: "lebte seit 1832 in Paris". PTNA: "moved to Paris at the age of 26" (1806 + 26 = 1832).'
    luot_2: dung
    luot_2_nguon: [ "https://data.bnf.fr/fr/ark:/12148/cb14788755q", "https://web.archive.org/web/20190820105426/https://www.naxos.com/ecard/grandpiano/GP816/", "https://web.archive.org/web/20250326184610/https://www.staatsoper.de/en/biographies/burgmueller-friedrich", "https://www.onleihe.de/static/content/bookwire_inter/20211108/9783795729882/v9783795729882.pdf" ]
    luot_2_ghi_chu: "BnF: 'Installé à Paris en 1832'; Naxos GP816: 'In 1832 … settled in Paris'; Staatsoper: 'Around 1832'. Riêng lời tựa Schott ghi 1834 ('1834 wandte er sich nach Paris'); đa số nguồn, gồm BnF, ghi 1832."
  - id: n14
    cau: Burgmüller sống ở Pháp đến cuối đời; ông dạy piano.
    loai: lich-su
    nguon: [ db-burgmuller, ptna-burgmuller, ndb-burgmuller ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Năm 1832 ông sang Paris và ở lại đó đến cuối đời. Ông là thầy dạy piano được ưa chuộng, viết nhiều nhạc salon…". Chữ mới: "Năm 1832 ông sang Paris và sống ở Pháp đến cuối đời. Ông dạy piano, viết nhiều nhạc salon…". Lý do: Deutsche Biographie ghi Sterbeort Beaulieu; PTNA: "died in Beaulieu, Marolles-en-Hurepoix" (gần Paris, không phải Paris); "được ưa chuộng" là đánh giá không có nguồn, PTNA chỉ ghi "active as a salon musician and educator". Cùng cách sửa với La candeur n16 (D6-L1). Chú ý cho người giao: hồ sơ La candeur n16 viết Beaulieu-sur-Mer; PTNA ghi Beaulieu ở Marolles-en-Hurepoix (Essonne). Chữ "sống ở Pháp" đúng với cả hai. Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng. Nơi mất (n14): Beaulieu thuộc Marolles-en-Hurepoix, gần Paris (Weber-Gesamtausgabe A0025C9: "† February 13, 1874 in Beaulieu bei Marolles-en-Hurepoix"); "sống ở Pháp đến cuối đời" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.onleihe.de/static/content/bookwire_inter/20211108/9783795729882/v9783795729882.pdf", "https://www.deutsche-biographie.de/sfz7530.html", "https://web.archive.org/web/20250326184610/https://www.staatsoper.de/en/biographies/burgmueller-friedrich" ]
    luot_2_ghi_chu: "Schott: ở Paris dạy rất nhiều học trò; từ 1855 lui về Beaulieu gần Fontainebleau và mất ở đó năm 1874. Deutsche Biographie: nơi mất Beaulieu, nghề có 'Musiklehrer'. Staatsoper: 'piano teacher', nhập quốc tịch Pháp 1842."
