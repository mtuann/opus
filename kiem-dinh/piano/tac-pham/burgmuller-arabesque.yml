doi_chu:
  - cu: 'mô tả: Chưa đầy một phút tinh nghịch: những chùm nốt chạy vụt qua như nét hoa văn, hợp âm ngắn gọn, sắc thái đổi liên tục. Arabesque là một trong những bài được yêu…'
    moi: 'mô tả: Khoảng một phút tinh nghịch: những chùm nốt chạy vụt qua như nét hoa văn, hợp âm ngắn gọn, sắc thái đổi liên tục. Arabesque là bài số 2 trong tập étude Op. 100…'
    ly_do: 'n1, n3 (da-sua), mô tả trang: bỏ đánh giá "được yêu thích nhất"; bản thu gợi ý dài 65 giây nên "chưa đầy một phút" thành "khoảng một phút".'
  - cu: 'Chưa đầy một phút tinh nghịch: những chùm nốt chạy vụt qua như nét hoa văn, hợp âm ngắn gọn, sắc thái đổi liên tục. Arabesque là một trong những bài được yêu thích nhất trong tập étude của Burgmüller, vì nó nghe khó hơn thực tế, và vì nó dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin.'
    moi: 'Khoảng một phút tinh nghịch: những chùm nốt chạy vụt qua như nét hoa văn, hợp âm ngắn gọn, sắc thái đổi liên tục. Arabesque là bài số 2 trong tập étude Op. 100 của Burgmüller, và dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin.'
    ly_do: 'n1, n3 (da-sua): "được yêu thích nhất", "nghe khó hơn thực tế" là đánh giá không đo được (IMSLP: số 2 của Op. 100); bản thu gợi ý (Kolodin) dài 65 giây.'
  - cu: Ngắn mà trọn vẹn. Chưa đến một phút, dễ học thuộc, rất hợp để chơi cho người khác nghe.
    moi: Ngắn mà trọn vẹn. Khoảng một phút, dễ học thuộc, rất hợp để chơi cho người khác nghe.
    ly_do: 'n10 (da-sua): bản thu gợi ý dài 65 giây; chơi đủ nhắc lại ở ♩ = 100–132 là 50–66 giây.'
  - cu: Friedrich Burgmüller sinh năm 1806 ở Regensburg, trong một gia đình nhạc sĩ. Năm 1832 ông sang Paris và ở lại đó đến cuối đời. Ông là thầy dạy piano được ưa chuộng, viết nhiều nhạc salon cho người chơi nghiệp dư, và cả nhạc cho vở ballet La Péri (1843).
    moi: Friedrich Burgmüller sinh năm 1806 ở Regensburg, trong một gia đình nhạc sĩ. Năm 1832 ông sang Paris và sống ở Pháp đến cuối đời. Ông dạy piano, viết nhiều nhạc salon cho người chơi nghiệp dư, và cả nhạc cho vở ballet La Péri (1843).
    ly_do: 'n14 (da-sua): Burgmüller mất ở Beaulieu, không ở Paris (Deutsche Biographie, GND 117168890; PTNA); "được ưa chuộng" không có nguồn.'
