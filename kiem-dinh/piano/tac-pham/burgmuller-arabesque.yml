    luot_2_nguon: [ "https://imslp.org/wiki/25_%C3%89tudes_faciles_et_progressives,_Op.100_(Burgm%C3%BCller,_Friedrich)", "https://web.archive.org/web/20190820105426/https://www.naxos.com/ecard/grandpiano/GP816/", "https://www.onleihe.de/static/content/bookwire_inter/20211108/9783795729882/v9783795729882.pdf" ]
    luot_2_ghi_chu: "Thời lượng: IMSLP 0:59, Naxos 0:51. 'Dễ học thuộc, hợp để chơi cho người khác nghe' là nhận xét sư phạm; lời tựa Schott (M. Twelsiek, ED 175) nói các étude của Burgmüller ngắn, vừa sức người chơi trẻ và 'als kleine Bravourstücke jedes Konzert bereichern'."
