ghi_chu: 'Bài học Arabesque Op. 100 số 2 (tầng Tác phẩm). Bản nhạc: Mutopia 203 (25EF-02, Bas Wassink theo Collection Litolff, phạm vi công cộng), .ly, PDF A4 và MIDI tải ngày 05/11/2026; MIDI tải mới khác file ../opus-zero/_imslp/mid/mut_burg02.mid ở phần đầu (tên track), nốt giống nhau. Bản Mutopia không đánh số ô; số ô ở hồ sơ đếm trên .ly (dẫn nhập ô 1–2, A ô 3–10 với hai kết, B ô 11–18, A'' ô 19–26 với hai kết, coda ô 27–31; 31 ô đã viết). Tiểu sử: Deutsche Biographie, NDB, PTNA. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/burgmuller-arabesque. Sửa trang: n1 (bỏ đánh giá "được yêu thích nhất", "nghe khó hơn thực tế"; cả description), n3 và n10 ("chưa đầy một phút" thành "khoảng một phút": bản thu gợi ý dài 65 giây), n14 (Burgmüller không mất ở Paris; "thầy dạy piano được ưa chuộng" thành "dạy piano"), n29 (bỏ "được thu rất nhiều"), n65 (link cùng chặng: Valse La thứ nay ở chặng 5, thay bằng Cầu nguyện buổi sáng, chặng 3). Khuông: ba khối đều là ví dụ soạn, đúng. Thuật ngữ trang dùng (scherzando, leggiero, dolce, a tempo, sforzando, staccato, legato) có trong src/data/thuat-ngu.yml; risoluto chưa có bản ghi thuật ngữ (cho lô sau): nghĩa đã kiểm ở n35 (Treccani).'
