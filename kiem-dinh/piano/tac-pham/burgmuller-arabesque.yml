    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Diễn giải tính cách. Phần kiểm được: giọng La thứ (Mutopia \key a\minor), Allegro scherzando (n5).'
  - id: n29
    cau: Bài này được thu rất nhiều, cả bởi nghệ sĩ lẫn giáo viên.
    loai: so-lieu
    nguon: [imslp-op100]
    ket_qua: da-bo
