nhan_dinh:
  - id: n1
    cau: Arabesque là bài số 2 trong tập étude Op. 100 của Burgmüller.
    loai: danh-muc
    nguon: [ imslp-op100 ]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (câu mở đầu): "*Arabesque* là một trong những bài được yêu thích nhất trong tập étude của Burgmüller, vì nó nghe khó hơn thực tế, và vì nó dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin." Chữ mới: "*Arabesque* là bài số 2 trong tập étude Op. 100 của Burgmüller, và dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin." Lý do: "được yêu thích nhất" và "nghe khó hơn thực tế" là đánh giá không đo được (như La candeur n2 của D6-L1); IMSLP: number=2, title=L''arabesque. Sửa cả description (frontmatter). Vế "dạy đúng những thứ cần có trước Czerny hay Chopin" là lời khuyên (n2). Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng. Nơi mất (n14): Beaulieu thuộc Marolles-en-Hurepoix, gần Paris (Weber-Gesamtausgabe A0025C9: "† February 13, 1874 in Beaulieu bei Marolles-en-Hurepoix"); "sống ở Pháp đến cuối đời" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/25_%C3%89tudes_faciles_et_progressives,_Op.100_(Burgm%C3%BCller,_Friedrich)" ]
    luot_2_ghi_chu: "IMSLP, mục Movements: '2. L'arabesque' trong 25 Études faciles et progressives, Op.100."
    review: dung
  - id: n2
    cau: Bài dạy đúng những thứ cần có trước khi bước vào Czerny hay Chopin.
