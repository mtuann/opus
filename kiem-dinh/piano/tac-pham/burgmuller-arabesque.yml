    ghi_chu: 'Chữ cũ: "Chưa đầy một phút" (câu mở đầu, description). Chữ mới: "Khoảng một phút". Lý do: bản thu gợi ý của trang (Luis Kolodin, IMSLP; file public/audio/burgmuller-arabesque.mp3, ffprobe 65,43 giây) dài hơn một phút. Tính trên bản nhạc: chơi đủ hai dấu nhắc lại là 55 ô 2/4 (2 + 2×8 + 2×16 + 5) = 110 phách: ♩ = 132 khoảng 50 giây, ♩ = 100 khoảng 66 giây. Review D6-L2-gom: đọc lại chỗ sửa của lượt 1 và kết quả lượt 2: chữ trang khớp nguồn. Đúng. Nơi mất (n14): Beaulieu thuộc Marolles-en-Hurepoix, gần Paris (Weber-Gesamtausgabe A0025C9: "† February 13, 1874 in Beaulieu bei Marolles-en-Hurepoix"); "sống ở Pháp đến cuối đời" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/25_%C3%89tudes_faciles_et_progressives,_Op.100_(Burgm%C3%BCller,_Friedrich)", "https://web.archive.org/web/20190820105426/https://www.naxos.com/ecard/grandpiano/GP816/" ]
    luot_2_ghi_chu: "IMSLP: bản thu MP3 '2. Arabesque' (Mississippi College Piano Pedagogy, CC BY-SA) dài 0:59; Naxos GP816 (Carl Petersson): L'Arabesque 00:51. Khoảng một phút là đúng."
