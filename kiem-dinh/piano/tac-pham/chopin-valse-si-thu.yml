- cu: 'Bản valse Chopin viết năm 19 tuổi và không bao giờ tự cho in: buồn, mềm mại, hát nhiều hơn nhảy. Sau Valse La thứ, đây là bước tiếp tự nhiên: tay trái đổi thế nhiều hơn, giai điệu nhiều trang trí hơn, và một trio Si trưởng có những câu nhạc đi bằng quãng ba.'
  moi: 'Bản valse Chopin viết năm 19 tuổi và không bao giờ tự cho in: buồn, mềm mại, hát nhiều hơn nhảy. Sau Valse La thứ, đây là bước tiếp tự nhiên: tay trái đổi hợp âm gần như mỗi ô, giai điệu có những nốt trang trí viết ra bằng nốt thường, và một trio Si trưởng có những câu nhạc đi bằng quãng ba.'
  ly_do: 'Review D6-L4-gom: n4 (câu mở đầu: bỏ so sánh "đổi thế nhiều hơn, nhiều trang trí hơn", viết bằng điều đã kiểm ở n5, n6).'
- cu: 'Về thể loại valse và chỗ đứng của nó trong các phòng khách Paris, xem lại trang Valse La thứ. Valse của Chopin là nhạc để nghe hơn là để nhảy, và bản Si thứ là ví dụ rõ: nhịp 3 vẫn đều đặn ở tay trái, nhưng giai điệu như một lời than thở nhỏ.'
  moi: 'Về thể loại valse và những năm Chopin sống ở Paris, xem lại trang Valse La thứ. Valse của Chopin là nhạc để nghe hơn là để nhảy, và bản Si thứ là ví dụ rõ: nhịp 3 vẫn đều đặn ở tay trái, nhưng giai điệu như một lời than thở nhỏ.'
  ly_do: 'Review D6-L4-gom: n15 (ve-site): trang đích Valse La thứ (đã khóa) không còn nói về phòng khách Paris; sửa theo trang đích.'
