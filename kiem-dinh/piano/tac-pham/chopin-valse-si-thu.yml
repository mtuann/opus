    ket_qua: dung
    ghi_chu: 'Tay trái valse, Mi thứ, 3/4, L:1/4: mỗi ô 3 phách. Em – Em – B7 – B7 – Am – Am – B7 – Em; ba cặp ô đầu nốt trầm xuống một quãng tám (E3→E2, B2→B1, A2→A1), đúng lời dẫn. Nốt trầm ngón 5, hợp âm ba nốt chơi được; Ped. ở nốt trầm, * ở phách 3. Bước nhảy tới hơn hai quãng tám (B1 → F♯3–D♯4) hợp chặng 6.'
