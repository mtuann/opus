  - 'Chặng trước (chặng 5), cũng là giai điệu hát: Nocturne Mi thứ Op. 72 số 1 của Chopin; Mendelssohn: Thuyền ca Venice, Op. 19 số 6, giai điệu hát trên nhịp đung đưa.'
  - 'Valse khó hơn: Valse Đô♯ thứ Op. 64 số 2 (Henle mức 6, bài này mức 4). Danh sách theo cấp: Tác phẩm theo cấp độ.'
  ly_do: 'n98 (da-sua): tac-pham.yml (đã khóa): chopin-nocturne-op9-2 và chopin-valse-si-thu cùng chặng 6 (D2-0 đổi bài này từ chặng 5). n99 (da-sua): mendelssohn-thuyen-ca chặng 5 (tac-pham.yml), Nocturne Op. 72 số 1 ở bảng Chặng 5 của piano/tac-pham-theo-cap (đã khóa); bài này chặng 6. n100 (da-sua): "khó hơn" theo Henle HN 131 (op. 64,2 mức 6; op. post. 69,2 mức 4).'
