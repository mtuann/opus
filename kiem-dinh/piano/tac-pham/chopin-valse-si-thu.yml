  - id: n44
    cau: "Si♭ đầu đoạn B là một nốt nghịch rơi đúng phách, rồi giải bậc xuống La: nhấn rồi nhả."
    loai: "cau-truc"
    nguon: *id001
    ket_qua: "da-sua"
    ghi_chu: "Ô 33: Si♭4 (marcato, chấm dôi) trên hợp âm A7 của tay trái (C♯ G A E), xuống La (a8). thuat-ngu.yml (đã khóa): appoggiatura \"Nốt dựa, đúng phách, lấy bớt độ dài của nốt chính\". \"Nhấn rồi nhả\" là lời khuyên. Review D6-L4-gom: lượt 2: Si♭ ô 33 được chuẩn bị bằng chính nốt Si♭ cuối ô 32, nên theo Open Music Theory (nguồn chính về tên gọi) không hẳn là appoggiatura (vào bằng bước nhảy). Bỏ tên gọi, viết theo điều lượt 2 mô tả (nốt nghịch nhấn đúng phách rồi giải bậc xuống). Không chạy lại. doi_chu."
    luot_2: khong-chac
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly" ]
    luot_2_ghi_chu: 'Si♭4 ở ô 33 có dấu nhấn, nghịch trên hợp âm La bảy, đi bậc xuống La: đúng nghĩa rộng "nốt nghịch nhấn rồi giải". Nhưng nốt này không được vào bằng bước nhảy: ô 32 kết bằng chính nốt Si♭4 (Si – Si♭), rồi đánh lại. Open Music Theory định nghĩa appoggiatura là "approached by leap and left by step", còn nốt vào bằng nốt đứng yên thì xếp vào suspension. Theo tên gọi của OMT, chữ "appoggiatura" ở đây chưa chắc đúng.'
    review: "dung"
