    ket_qua: dung
    ghi_chu: 'Nhịp lấy đà và ô 1–8, 3/4, L:1/8, K:Bm. Ấn bản: Peters (Herrmann Scholtz) qua Mutopia w10-h-moll-cfi (.ly và .mid, tải 05/11/2026). Công cụ: script Python (mido) in nốt MIDI theo ô và hai tay; đọc .ly cho ngón, sắc thái, bàn đạp. Kết quả: 8/8 ô và nhịp lấy đà khớp cao độ, trường độ cả hai tay (tay phải F♯5 nối | F♯ G F♯ C♯ D B | A♯4 F♯5… | ô 5 F♯ G E♯ F♯ B D6 | ô 6 D6. E♯5 D6 nối | ô 7 E5 C♯6 nối | ô 8 C♯6 B A♯ G F♯ C♯; tay trái B2/C♯3/A♯2/B2… với hợp âm F♯B D, F♯C♯E, F♯A♯E, G♯BD, GBE). Ngón (4 1 2 4 … 2 1 4 2), p ô 1, cresc. ô 5, rf và staccato ô 6, dim. ô 8, dấu nhấn, dấu luyến, Ped. phách 1 – * phách 3 khớp .ly. Q:1/4=126 là tốc độ phát của site (Peters ghi Moderato, ♩ = 152); tiêu đề không nói tốc độ.'
