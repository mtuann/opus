  moi: Bước tiếp sau Valse La thứ. Vẫn tay trái nốt trầm – hợp âm – hợp âm, nhưng nốt trầm đổi liên tục (Si, Đô♯, La♯, Rê, Mi, Fa♯…), hợp âm đổi thế gần như mỗi ô, và bài dài hơn gấp đôi (144 ô so với 56 ô).
