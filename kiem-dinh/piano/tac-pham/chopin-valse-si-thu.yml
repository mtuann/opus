- cu: Năm 1829, Chopin 19 tuổi và vẫn sống ở Warsaw; khoảng một năm sau ông rời Ba Lan và không bao giờ trở lại. Bản valse Si thứ ra đời trong những năm ấy, và Chopin không tự cho in nó. Bài được in lần đầu năm 1852, ba năm sau khi ông mất, cùng với bản Valse Fa thứ (sau này là Op. 70 số 2). Năm 1855, người bạn của Chopin là Julian Fontana in các tập tác phẩm di cảo, trong đó có hai tập valse Op. 69 và Op. 70; bản này trở thành Op. 69 số 2.
  moi: Năm 1829, Chopin 19 tuổi và vẫn sống ở Warsaw; cuối năm 1830 ông rời Ba Lan, rồi sống ở Paris cho đến khi mất (1849). Bản valse Si thứ ra đời trong những năm ấy, và Chopin không tự cho in nó. Bài được in lần đầu năm 1852, ba năm sau khi ông mất, cùng với bản Valse Fa thứ (sau này là Op. 70 số 2). Năm 1855, người bạn của Chopin là Julian Fontana in các tập tác phẩm di cảo, trong đó có hai tập valse Op. 69 và Op. 70; bản này trở thành Op. 69 số 2.
  ly_do: 'n12 (da-sua): Britannica (rời Ba Lan sau tháng 10/1830, rồi tới Paris), Henle HN 131 (mất ở Paris 1849); không có nguồn đã mở nói thẳng "không bao giờ trở lại".'
- cu: 'Bản thu các valse của Dinu Lipatti và của Arthur Rubinstein là hai điểm tựa quen thuộc; Alfred Cortot co giãn tự do hơn. Nghe một người rồi người kia và đánh dấu lên bản nhạc chỗ mỗi người nán lại: đó là bản đồ rubato đầu tiên của bạn. Xem thêm Nghệ sĩ piano và bản thu nên nghe.'
  moi: 'Nghe hai bản thu của hai nghệ sĩ khác nhau, bản này rồi bản kia, và đánh dấu lên bản nhạc chỗ mỗi người nán lại: đó là bản đồ rubato đầu tiên của bạn. Xem thêm Nghệ sĩ piano và bản thu nên nghe.'
