    luot_2: khong-chac
    luot_2_ghi_chu: 'Bản Peters/Mutopia của bài này có 144 ô, trio Si trưởng có những câu đi bằng quãng ba (ô 81–92). Chưa đếm được số ô của Valse La thứ (KK IVb/11): trang IMSLP mở được, nhưng PDF IMSLP chặn bot và bản viết tay trên Gallica trả 403. Ý "tay trái đổi thế nhiều hơn, nhiều trang trí hơn" là so sánh diễn giải.'
