- cu: Theo lời kể của các học trò Chopin, được Jean-Jacques Eigeldinger tập hợp, khi giai điệu co giãn thì tay đệm vẫn giữ nhịp. Trong bài này, những chỗ đáng nán lại là nốt Fa♯ ngân đầu mỗi câu, bước nhảy Si – Rê ở ô 5, nốt Rê cao có dấu rf ở ô 6; nán xong thì trả lại thời gian ngay. Chỉ ở những chỗ đã ghi rit. (như ô 14–15) hay calando, cả hai tay mới cùng chậm lại.
  moi: Carl Mikuli, một học trò của Chopin, kể rằng ngay cả khi chơi rubato, Chopin vẫn để tay đệm giữ nhịp thật đều. Trong bài này, những chỗ đáng nán lại là nốt Fa♯ ngân đầu mỗi câu, bước nhảy Si – Rê ở ô 5, nốt Rê cao có dấu rf ở ô 6; nán xong thì trả lại thời gian ngay. Chỉ ở những chỗ đã ghi rit. (như ô 14–15) hay calando, cả hai tay mới cùng chậm lại.
  ly_do: 'n83 (da-sua): nguồn đọc được là lời tựa Mikuli 1879 ("die begleitende Hand streng gemessen fort"); sách Eigeldinger chỉ có metadata. Như chopin-valse-la-thu n56.'
