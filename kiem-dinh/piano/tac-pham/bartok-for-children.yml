    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/87/71/16/1697725809/1225-1697725809-sync.pdf", "https://imslp.org/wiki/Special:ImagefromIndex/893790" ]
    luot_2_ghi_chu: "Henle: 'real peasant music that had been scientifically collected and written down … did not solely turn to his own store … also consulted various other collections'. Jegyzetek ghi cả bài hát trẻ em (gyermekdal) và nguồn của Kiss."
