    ghi_chu: 'Jegyzetek, mục 6: "Hej tulipán, tulipán, Teljes szegfű szarkaláb; Tele kendő zsályával, Szerelemnek lángjával. (Kiss: Gy. gyűjt.: 220 l.)". "Gy. gyűjt." là viết tắt của "Magy. Gyermekjátékgyűjtemény" ghi đủ ở mục 2 (tuyển tập trò chơi trẻ em Hungary). Không ghi tên đầy đủ của Kiss vì bản in chỉ ghi họ.'
