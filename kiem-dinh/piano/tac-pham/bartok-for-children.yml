    ket_qua: dung
    ghi_chu: 'IMSLP: tập 1–2 in năm 1909, tập 3–4 năm 1911. Henle: bản in đầu ra 1909–1911 thành bốn tập. Tựa tiếng Hungary Gyermekeknek ở trang bìa bản quét.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/For_Children,_Sz.42_(Bartók,_Béla)", "https://www.henle.de/media/87/71/16/1697725809/1225-1697725809-sync.pdf" ]
