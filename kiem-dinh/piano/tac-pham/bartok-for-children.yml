    nguon: [ rozsnyai-1909, henle-hn1225-comments ]
    ket_qua: dung
    ghi_chu: 'Trang tựa: "Apró darabok kezdő zongorázóknak (oktávfogás nélkül) magyarországi gyermek- és népdalok felhasználásával" / "Kleine Stücke für Anfänger (ohne Oktavenspannung) mit Benützung ungarländischer Kinder- und Volkslieder" (Henle chép lại cùng tựa ở mục ER).'
