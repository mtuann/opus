    ghi_chu: 'Số 1 ô 1–4, 2/4, L:1/8, K:C, hai khuông khóa Sol. Ấn bản: Rozsnyai 1909 (rozsnyai-1909, tr. 2), chép tay, đối chiếu từng nốt trên ảnh 300–400 dpi. Tay phải: Sol5(chấm, 4) (Sol5 4, La5 chấm 5) (La5 5 | Sol5 chấm 4) (Sol5 4, Mi5 đen gạch ngang) | Fa5(chấm 3) (Fa5 3, Rê5 chấm 1) (Rê5 1 | Mi5 chấm 3) (Mi5 3, Đô5 đen gạch ngang). Tay trái: Mi4 Sol4 Fa4 Sol4 | Mi4 Sol4 Đô4 Sol4 | Rê4 Sol4 Fa4 Sol4 | Đô4 Sol4 Rê4 Sol4, "sempre legato". Khớp. Khác bản in: bỏ số ngón tay trái ô 1 (bản quét in mờ, chữ số dưới Mi4 không đọc chắc là 3); "p semplice" ghi thành !p! (chữ semplice ở câu dưới khuông, n55); Q:1/4=96 là của trang.'
  - khoi: 2
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not, so-ngon, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Số 6 ô 5–8, 2/4, K:C (không hóa biểu). Ấn bản: rozsnyai-1909, tr. 6. Tay phải: La4 ×4 staccato (ngón 2 1 2 1), "f molto marcato" | (Sol4 La4) luyến (2 3), Fa4 đen gạch ngang (1) | La4 ×4 staccato | (Sol4 La4), Fa4 gạch ngang. Tay trái: Rê3–La3 bốn móc đơn mỗi ô (không chấm ở ô 5–8; chấm chỉ ở ô 1). Khớp. Q:1/4=132 là của trang.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, mỗi ô 4 móc đơn. Đúng điều trang nói: nốt chấm, cặp luyến không bắt đầu ở phách (như số 1), nốt gạch ngang hai phách ở ô 2, 4. Tay trái Đô3, Sol3, Đô3, Sol3–Đô3: hòa âm I–V–I–V–I hợp giai điệu. Ngón tay phải 1-1-3-3-2-2-1, 3-3-4-4-3-2-1: chơi được ở chặng 2.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '5 ô 2/4. Tay phải Rê4 nối dây năm ô (như Rê ngân sau mỗi lần giai điệu của số 6). Tay trái móc đơn: Rê–La, Rê–Si♭, Đô–La, Si–Sol (đều có trong số 6, n37), Rê–La trắng. Si♭ chỉ trong ô 2 (dấu hóa giữ tới hết ô). Ngón 5–1 cho Rê–La như bản in; quãng sáu Rê–Si♭, Đô–La, Si–Sol vừa tay người lớn.'
  - khoi: 5
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon ]
    ket_qua: dung
    ghi_chu: '4 ô 2/4, hai khuông khóa Sol như số 1. Ô 2, 4: tay phải nốt trắng (Đô6, Mi5), tay trái hai cặp móc đơn luyến (Mi4–Rê4, Rê4–Đô4; Rê4–Đô4, Đô4–Si3): kiểu hỏi đáp của câu b, c (n43). Ô 1, 3 tay trái nghỉ. Ngón tay phải 1-2-5, 4-3-1 (Mi5–Sol5–Đô6: quãng sáu, chơi được); tay trái 1-2-2-3, 2-3-3-4.'
