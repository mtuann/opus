  - id: n22
    cau: 'Cuối năm 1943, khi đã sang Mỹ, Bartók sửa toàn bộ tập nhạc cho Boosey & Hawkes: thêm số máy đếm nhịp và thời lượng, sửa hòa âm, bỏ bớt một số bài (cả tập còn 79 bài), đặt tên cho nhiều bài.'
    loai: lich-su
    nguon: [ henle-hn1225-vorwort, henle-hn1225, imslp-sz42 ]
    ket_qua: da-sua
    ghi_chu: 'Sửa theo lượt 2: câu cũ "bỏ hai bài, đặt tên cho mọi bài" sai: Henle chỉ nói hai bài bỏ ở phần Hungary (số 25, 29), cả bộ từ 85 xuống 79 bài (IMSLP); mục lục bản sửa trên trang Henle còn nhiều bài không tên (số 3, 11, 12, 14, 15…) dù câu giới thiệu ghi "every movement". Câu hỏi 1 sửa lời giải thích theo. Nguồn cũ: Henle: "in autumn 1943, together with his new publisher Boosey & Hawkes, he planned a new edition ... completely revised the collection"; "completed his revision by the end of 1943"; "As well as the inclusion of metronome markings and durations ... also revised the musical text, in particular the harmony. Two pieces from the early version (nos. 25 and 29 there) were deleted." Tên bài: trang sản phẩm. Sang Mỹ: tiểu sử Henle "1940 Emigrates to the United States".'
    luot_2: sai
    luot_2_nguon: [ "https://www.henle.de/media/87/71/16/1697725809/1225-1697725809-sync.pdf", "https://www.henle.de/en/For-Children-Volume-I/HN-1225", "https://imslp.org/wiki/For_Children,_Sz.42_(Bartók,_Béla)" ]
    luot_2_ghi_chu: "câu đúng: Cuối năm 1943, khi đã sang Mỹ, Bartók sửa toàn bộ tập nhạc cho Boosey & Hawkes: thêm số máy đếm nhịp và thời lượng, sửa hòa âm, bỏ hai bài của phần Hungary (số 25 và 29 của bản đầu), đặt tên cho nhiều bài.; Henle: 'two pieces from the early version (nos. 25 and 29 there) were deleted': đó là hai bài của phần Hungary (tập I–II); cả bộ từ 85 xuống 79 bài (IMSLP) nên bỏ sáu bài. Mục lục Henle HN 1225 vẫn để nhiều bài không tên (số 3, 11, 12, 14, 15…), dù câu giới thiệu của Henle nói 'gave every movement a title'. Các ý khác (cuối 1943, Boosey & Hawkes, số máy đếm nhịp, thời lượng, hòa âm) đúng."
