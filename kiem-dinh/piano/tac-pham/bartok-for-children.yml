ghi_chu: 'Bài học mới (lộ trình thêm tác phẩm, lượt 1, chạy thử quy trình them-tac-pham.md). Hai bài số 1 và số 6 của For Children tập I, theo bản in đầu Rozsnyai 1909 (bản sửa Boosey & Hawkes 1946 không dùng: không lấy tên bài, số máy đếm nhịp của bản sửa). Nốt nhạc, cấu trúc, sắc thái của hai bài chép tay từ bản quét IMSLP #893790 (đọc ảnh trang 2, 6, 7 ở 170–400 dpi); lời bài hát ở trang Jegyzetek (trang 21 của file). Khảo sát G6 ghi số 6 "tay trái giữ giai điệu": sai với bản in 1909 (giai điệu ở tay phải, tay trái đánh quãng; tên "Study for the Left Hand" của bản sửa nói về phần đệm tay trái), trang viết theo bản in. Khảo sát (theo IMSLP) ghi số 6 "Rê Dorian": bản in có cả Si (tay trái Si–Sol, Sol–Si) và Si giáng, nên trang không gọi tên điệu thức, chỉ tả nốt. Chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng thuộc hồ sơ du-lieu/tac-pham/bartok-for-children.'
