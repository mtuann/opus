  - id: n19
    cau: 'Số 1 dựng trên bài hát trẻ em Süssünk, süssünk valamit (tạm dịch "Ta nướng, ta nướng món gì đây"), ghi ở Gyergyóújfalu; lời bài kể về một chiếc bánh tròn bằng bột, có nhân, thật ngọt.'
    loai: ten
    nguon: [ rozsnyai-1909 ]
    ket_qua: dung
    ghi_chu: 'Như n3. "Lisztből legyen kerekes, töltelékes, jó édes" = làm bằng bột, tròn, có nhân, thật ngọt. Bản dịch tên là tạm dịch của trang.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893790", "https://en.wiktionary.org/wiki/süt", "https://en.wiktionary.org/wiki/liszt", "https://en.wiktionary.org/wiki/töltelék", "https://en.wiktionary.org/wiki/édes" ]
    luot_2_ghi_chu: "Jegyzetek bài 1: 'Süssünk, süssünk valamit … Lisztből legyen kerekes, Töltelékes, jó édes … (Gyermekdal; Gyergyóújfalu.)'. süt = nướng; liszt = bột; kerek(es) = tròn; töltelék = nhân; édes = ngọt."
  - id: n20
    cau: 'Số 6 dựng trên bài Hej tulipán, tulipán (tạm dịch "Này hoa tulip, hoa tulip"), lấy từ một tuyển tập trò chơi trẻ em của Kiss.'
