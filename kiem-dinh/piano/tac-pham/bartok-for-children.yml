  - id: n12
    cau: 'Năm 1940, trong một bài giảng ở Mỹ, Bartók kể ông muốn viết bài dễ cho học trò piano ngay từ đầu sự nghiệp, vì thấy nhạc cho người mới học hầu như không có giá trị âm nhạc, trừ vài tác phẩm như những bài dễ nhất của Bach và Album für die Jugend của Schumann; theo ông, cách tốt nhất lúc ấy là dùng giai điệu dân gian, vì giai điệu dân gian thường có giá trị âm nhạc lớn nên ít nhất phần chủ đề được bảo đảm.'
    loai: lich-su
    nguon: [ henle-hn1225-vorwort ]
    ket_qua: dung
    ghi_chu: 'Henle (Preface) trích Béla Bartók Essays, tr. 426: "Already at the very beginning of my career as a composer I had the idea of writing some easy works for piano students ... with the exception of very few works – for instance, Bach''s easiest pieces and Schumann''s Jugendalbum ... At that time the best thing to do would be to use folk tunes. Folk melodies, in general, have great musical value; so, at least the thematical value would be secured."'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/87/71/16/1697725809/1225-1697725809-sync.pdf" ]
    luot_2_ghi_chu: "Lời tựa Henle (bản tiếng Anh) trích nguyên văn bài giảng ở Mỹ năm 1940: easy works for piano students; no real musical value, trừ Bach's easiest pieces và Schumann's Jugendalbum; 'the best thing to do would be to use folk tunes … at least the thematical value would be secured'. Khớp từng ý."
  - id: n13
    cau: Từ năm 1906, Bartók đi nhiều chuyến về nông thôn để ghi lại dân ca.
    loai: lich-su
    nguon: [ henle-hn1225-vorwort ]
    ket_qua: dung
    ghi_chu: 'Henle: "real peasant music that had been scientifically collected and written down, something which Bartók had himself done on extended field trips since 1906".'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/87/71/16/1697725809/1225-1697725809-sync.pdf" ]
    luot_2_ghi_chu: "Lời tựa Henle: 'something which Bartók had himself done on extended field trips since 1906'."
