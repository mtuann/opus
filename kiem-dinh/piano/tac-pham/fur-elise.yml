    ket_qua: dung
    ghi_chu: 'Henle: Beethoven tặng bản viết tay của WoO 59; năm 1822 định xếp WoO 59 vào một tập "Bagatelles" (số 12). IMSLP: 7 Bagatelles Op. 33. "Để chơi trong nhà" là cách tả.'
