nhan_dinh:
  - id: n1
    cau: 'Tiêu đề: "Beethoven: Für Elise, WoO 59".'
    loai: ten
    nguon: [ imslp-elise, henle-1347 ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/F%C3%BCr_Elise,_WoO_59_(Beethoven,_Ludwig_van)", "https://www.henle.de/us/Bagatelle-in-a-minor-WoO-59-Fuer-Elise/HN-1347" ]
    luot_2_ghi_chu: IMSLP và Henle HN 1347 ghi tên Für Elise, số WoO 59; tác giả Beethoven.
  - id: n2
    cau: 'Mô tả và câu mở đầu: Für Elise là một trong những tác phẩm nổi tiếng nhất của Beethoven, nhưng bài không dừng ở tám ô nhịp đầu.'
    loai: lich-su
    nguon: [ henle-1347-vorwort ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ (cả description): "Tám ô nhịp đầu của Für Elise thuộc loại nổi tiếng nhất trong nhạc piano". "Nổi tiếng nhất trong nhạc piano" không kiểm được; Henle: "one of Ludwig van Beethoven''s (1770 – 1827) best-known works. The popular piano piece...". Viết theo Henle.'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf", "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: "Lời nói đầu Henle: \"one of Ludwig van Beethoven's best-known works\". Bản B&H 1888 (Mutopia) dài hơn 100 ô, tám ô đầu chỉ là câu a của đoạn A."
  - id: n3
    cau: 'Học trọn bài, bạn gặp ba nhân vật rất khác nhau: chủ đề La thứ trôi như nước, đoạn Fa trưởng duyên dáng với những đường chạy nhanh, đoạn kịch tính trên nốt La trầm gõ liên tục.'
    loai: cau-truc
    nguon: [ mut-elise ]
    ket_qua: dung
    ghi_chu: 'Mutopia: A La thứ (móc kép liên tục), B Fa trưởng có hai đường chạy móc ba, C tay trái móc kép La2 liên tục. Tính từ là cách tả.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: "Đối chiếu bản B&H 1888 (file .ly của Mutopia): A La thứ, chuỗi móc kép; B Fa trưởng có nốt láy và đường chạy móc ba (32nd); C với La trầm (a,16) lặp liên tục ở tay trái."
  - id: n4
    cau: Ở chủ đề, dòng móc kép đi từ tay trái sang tay phải.
    loai: cau-truc
    nguon: [ mut-elise ]
    ket_qua: dung
    ghi_chu: 'Ô 2: tay trái A2 E3 A3, tay phải C4 E4 A4.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: "Ô 2: tay trái a,16 e a (La2–Mi3–La3), rồi tay phải c' e' a' (Đô4–Mi4–La4): dòng móc kép đi từ tay trái sang tay phải."
