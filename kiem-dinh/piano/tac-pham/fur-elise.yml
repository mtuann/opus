  - id: n22
    cau: 'Giả thuyết Therese Malfatti: học trò mà Beethoven được cho là muốn cầu hôn khoảng năm 1810.'
    loai: lich-su
    nguon: [ bh-woo59, bh-116, lvbwv-woo59 ]
    ket_qua: dung
    ghi_chu: 'Beethoven-Haus: "in love with Therese Malfatti, whom he intended to marry"; BH 116: "gave her piano lessons". LvBWV: "die Beethoven 1810 umwarb (zu einem möglichen Heiratsantrag ...)".'
    luot_2: dung
    luot_2_nguon: [ "https://www.beethoven.de/en/media/view/5010945952710656", "https://www.beethoven.de/de/media/view/5525208693735424/scan/0", "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf" ]
    luot_2_ghi_chu: 'Beethoven-Haus: Beethoven dạy piano cho Therese Malfatti và bị cô cuốn hút; mùa xuân 1810 ông yêu Therese và có ý định cưới (nhờ Wegeler gửi giấy rửa tội), Therese từ chối. "Được cho là muốn cầu hôn" là cách nói thận trọng, đúng.'
  - id: n23
