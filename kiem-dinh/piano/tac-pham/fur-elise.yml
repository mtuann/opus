    luot_2_ghi_chu: 'Henle: Beethoven tặng bản viết tay và không giữ bản sao; mùa thu 1822 ông định đưa WoO 59 vào một tập "Bagatellen" (số 12), tập về sau in thành Op. 119; Henle gọi bài là Bagatelle. Op. 33, Op. 119 là các tập bagatelle của chính ông. Câu hơi khái quát (không phải mọi bagatelle đều để tặng), nhưng không sai.'
