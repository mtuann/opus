  - id: n24
    cau: 'Giả thuyết Elisabeth Röckel, về sau là vợ nhà soạn nhạc Johann Nepomuk Hummel: giả thuyết của Klaus Martin Kopitz, đã bị Michael Lorenz phản bác.'
