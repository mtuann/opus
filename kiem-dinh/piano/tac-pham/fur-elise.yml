ghi_chu: 'Bài học Für Elise WoO 59 (tầng Tác phẩm; trang đã chuyển ở D1.8, kiểm định lần đầu). Bản nhạc: Mutopia fur_Elise_WoO59 (Breitkopf & Härtel 1888; .ly, .mid tải 05/11/2026, User-Agent opus-kiem-dinh), đọc bằng script Python (mido) theo ô. Lịch sử: lời nói đầu và bình chú Henle HN 1347 (PDF), mục WoO 59 của danh mục Beethoven (Henle 2014, PDF), Beethoven-Haus. Sửa trang: n2, n8, n10, n24, n25, n31, n70, n74, n81, n83, n87, n88, n89. Còn mở: n14, n16, n30, n84 (đánh giá "những năm sáng tác dồi dào nhất"; nghĩa của bagatelle và poco: chưa mở được từ điển). Giữ cho hồ sơ khác: 8 ô đầu như Beethoven viết, hai tay thay phiên, móc kép, 3/8 (piano/10-bai-dau-tien n2, n34; khối 1 khớp bản 1888); đoạn C nốt La lặp tay trái (piano/not-lap-not-kep n10, n41); rondo A–B–A–C–A (hinh-thuc/rondo n20: ghi chú hồ sơ ấy chép chữ cũ "quay lại ba lần", nay là "vang lên ba lần"; câu n20 chỉ nói về link nên vẫn đúng); link từ piano/hai-tay n16, tai-lieu-tham-khao t32, blog phiên bản 15 n7 không bị chạm. Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng, chữ do ::hop-tac-pham, ::hinh-cau-truc, ::hoc-tiep dựng (thuộc hồ sơ bản ghi), mốc trong ::khoi-nghe. Thuật ngữ trang dùng (rondo, appoggiatura, móc ba, chùm ba, Urtext) có trong src/data/thuat-ngu.yml; "bagatelle", "poco moto" chưa có bản ghi thuật ngữ (cho D3-L5 hay người giao).'
