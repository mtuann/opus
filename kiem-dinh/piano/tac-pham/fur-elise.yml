khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem: [ cu-phap, nhip, giong, not-tay-phai, not-tay-trai, sac-thai, doi-chieu-an-ban ]
    ket_qua: dung
    ghi_chu: 'Nhịp lấy đà và ô 1–8 (ô 8 lần một), 3/8, L:1/16, K:Am. Ấn bản: Breitkopf & Härtel 1888 qua Mutopia fur_Elise_WoO59 (.ly và .mid, tải 05/11/2026). Công cụ: đọc .ly và MIDI (mido) theo ô. Kết quả: khớp cả hai tay từng nốt: nhịp lấy đà E5 D♯5; ô 1 E D♯ E B D C; ô 2 A4 (móc đơn) + C4 E4 A4, tay trái A2 E3 A3; ô 3 B4 + E4 G♯4 B4, tay trái E2 E3 G♯3; ô 4 C5 + E4 E5 D♯5; ô 5–7 như ô 1–3 (ô 7 E4 C5 B4); ô 8 A4 nốt đen, tay trái A2 E3 A3; "Poco moto" và pp ở nhịp lấy đà khớp. Khối không ghi bàn đạp (bản gốc có): trang không nói khối ghi bàn đạp. Không có số ngón.'
  - khoi: 2
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, so-ngon, hai-tay ]
    ket_qua: dung
    ghi_chu: '8 ô 3/8, mỗi ô 6 móc kép: tay trái ba nốt rải, tay phải ba nốt tiếp, đúng kiểu chuyền tay của chủ đề. Hòa âm La thứ, Rê thứ, Mi, La thứ, Fa, Rê thứ, Mi, La thứ. Ngón tay trái 5-?-1, tay phải 1 ở nốt đầu: chơi được.'
  - khoi: 3
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, so-ngon ]
    ket_qua: dung
    ghi_chu: '5 ô 3/8, L:1/32, mỗi ô 12 nốt móc ba: ngón 5 lặp một nốt cao (Rê, Mi, Fa, Sol), dòng dưới đi lên đi xuống bằng ngón 1–4, như lời dẫn và giống kiểu đường chạy đoạn B (Sol5 lặp). Ô cuối Đô nốt dài. Ngón chơi được.'
  - khoi: 4
    loai: vi-du-soan
    kiem: [ cu-phap, nhip, giong, hop-am, sac-thai ]
    ket_qua: dung
    ghi_chu: 4 ô 3/8, K:Em. Tay trái Mi1 móc kép liên tục (6 mỗi ô) pp, tay phải hợp âm Mi thứ, Si bảy (D♯ F♯ A), Mi thứ – Đô/Mi, Si; p với dấu to dần như lời dẫn "tăng dần sắc thái". Giống kiểu đoạn C (nốt trầm lặp dưới hợp âm) ở giọng khác.
doi_chu:
  - cu: 'Tám ô nhịp đầu của Für Elise thuộc loại nổi tiếng nhất trong nhạc piano, nhưng bài không dừng ở đó. Học trọn bài, bạn gặp ba nhân vật rất khác nhau: chủ đề La thứ trôi như nước, đoạn Fa trưởng duyên dáng với những đường chạy nhanh, và đoạn kịch tính trên nốt La trầm gõ liên tục.'
    moi: 'Für Elise là một trong những tác phẩm nổi tiếng nhất của Beethoven, nhưng bài không dừng ở tám ô nhịp đầu. Học trọn bài, bạn gặp ba nhân vật rất khác nhau: chủ đề La thứ trôi như nước, đoạn Fa trưởng duyên dáng với những đường chạy nhanh, và đoạn kịch tính trên nốt La trầm gõ liên tục.'
    ly_do: 'n2 (da-sua): Henle HN 1347: "one of Ludwig van Beethoven''s best-known works".'
  - cu: Bản viết tay mà nhà nghiên cứu Ludwig Nohl được xem đề ngày 27 tháng 4 năm 1810. Nohl in bài này lần đầu năm 1867, bốn mươi năm sau khi Beethoven mất; bản viết tay ấy nay đã thất lạc
    moi: Bản viết tay mà nhà nghiên cứu Ludwig Nohl được xem đề ngày 27 tháng 4, không ghi năm (có lẽ năm 1810). Nohl in bài này lần đầu năm 1867, bốn mươi năm sau khi Beethoven mất; bản viết tay ấy nay đã thất lạc
    ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-A.yml, nhận định n18 của hồ sơ bản ghi: Henle HN 1347: "the 27th of April (without mention of a year)"; LvBWV: bản viết tay "wohl ebenfalls 1810". Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang sau khi áp.'
  - cu: Khoảng ABRSM Grade 5 cho cả bài (ước lượng); riêng đoạn A khoảng Grade 3
    moi: Khoảng ABRSM Grade 5 cho cả bài; RCM xếp bài ở Level 7 (đề cương 2022); riêng đoạn A khoảng Grade 3
    ly_do: 'Dữ liệu (thong_tin, hiện qua ::hop-tac-pham) sửa theo sua-A.yml, nhận định n23 của hồ sơ bản ghi: Bài có trong đề cương RCM 2022 (Level 7, List B): ghi kỳ đề cương thay "(ước lượng)". Có điều kiện: bỏ "riêng đoạn A khoảng Grade 3" nếu lượt 2 không tìm được nguồn; khi ấy sửa luôn chip.'
  - cu:
      - Rondo thu nhỏ. Chủ đề quay lại ba lần, xen hai đoạn tương phản; bạn hiểu rondo bằng chính đôi tay.
      - Đi hết bài. Rất nhiều người dừng ở tám ô đầu. Chơi trọn vẹn và hay cả bài là một bước trưởng thành thật sự.
    moi:
      - Rondo thu nhỏ. Chủ đề vang lên ba lần, xen giữa là hai đoạn tương phản; bạn hiểu rondo bằng chính đôi tay.
      - Đi hết bài. Tám ô đầu chỉ là một phần nhỏ của bài. Chơi trọn vẹn và hay cả bài là một bước trưởng thành thật sự.
    ly_do: 'n8 (da-sua): chủ đề có ba lần trong A–B–A–C–A. n10 (da-sua): "rất nhiều người dừng ở tám ô đầu" không kiểm được.'
  - cu:
      - Elisabeth Röckel, một nữ ca sĩ trẻ trong vòng bạn bè của Beethoven (có tài liệu gọi bà là "Elise"), về sau là vợ nhà soạn nhạc Johann Nepomuk Hummel.
      - Elise Barensfeld, một cô bé ca sĩ có tài, quê ở Regensburg, sống ở Vienna vào thời gian đó.
    moi:
      - Elisabeth Röckel, về sau là vợ nhà soạn nhạc Johann Nepomuk Hummel. Đây là giả thuyết của Klaus Martin Kopitz; Michael Lorenz đã phản bác.
      - Elise (Lisette) Barensfeld, có thể là học trò piano của Therese Malfatti năm 1810. Đây là giả thuyết của Rita Steblin.
    ly_do: 'n24 (da-sua): theo LvBWV (Henle 2014); bỏ chi tiết chỉ có ở Wikipedia. n25 (da-sua): theo LvBWV (Henle 2014); quê Regensburg, ca sĩ: chưa có nguồn đã mở. n25 (da-sua): theo LvBWV (Henle 2014).'
  - cu: 'So sánh vài bản thu. Để ý tốc độ: nhiều người chơi chủ đề rất chậm và mơ màng, trong khi Poco moto nghĩa là "hơi chuyển động". Nếu tìm được, nghe thêm một bản trên fortepiano, loại đàn piano thời Beethoven: tiếng nhẹ hơn, tắt nhanh hơn, và bàn đạp nghe khác hẳn.'
    moi: 'So sánh vài bản thu. Để ý tốc độ: Poco moto nghĩa là "hơi chuyển động", nên chủ đề không cần chậm và mơ màng. Nếu tìm được, nghe thêm một bản trên fortepiano, loại đàn piano thời Beethoven, để nghe tiếng đàn và bàn đạp khác piano hiện đại thế nào.'
    ly_do: 'n30, n31 (da-sua): bỏ nhận định về người chơi và về tiếng fortepiano chưa có nguồn.'
  - cu: 'Bản Breitkopf & Härtel và nhiều ấn bản khác ghi bàn đạp cho từng ô có hợp âm rải tay trái ở chủ đề, nhả trước ô Mi–Rê♯. Nguyên tắc chung: đổi theo hòa âm, nhả hẳn khi giai điệu đi một mình. Ở đoạn B, dùng bàn đạp nông, đổi theo hợp âm; với đường chạy móc ba, giảm bàn đạp để từng nốt còn rõ. Ở đoạn C, bàn đạp ngắn cho từng hợp âm, hoặc rất ít, để nốt La lặp lại không thành tiếng ù.'
    moi: 'Bản Breitkopf & Härtel 1888 ghi bàn đạp cho từng ô có hợp âm rải tay trái ở chủ đề, nhả trước ô Mi–Rê♯. Nguyên tắc chung: đổi theo hòa âm, nhả hẳn khi giai điệu đi một mình. Ở đoạn B, dùng bàn đạp nông, đổi theo hợp âm; với đường chạy móc ba, giảm bàn đạp để từng nốt còn rõ. Ở đoạn C, bàn đạp ngắn cho từng hợp âm, hoặc rất ít, để nốt La lặp lại không thành tiếng ù.'
    ly_do: 'n70 (da-sua): "nhiều ấn bản khác" chưa kiểm.'
  - cu: 'Vì bản viết tay đã mất, các ấn bản có thể khác nhau ở vài chi tiết như dấu luyến hay bàn đạp. Hãy dùng một bản Urtext và đọc phần chú thích của người biên tập. Các bản "đơn giản hóa" cho người mới học thường cắt bớt đoạn B và C hoặc đổi tay trái: tránh chúng khi bạn học bài thật.'
    moi: Vì bản viết tay đã mất, các ấn bản có thể khác nhau ở vài chi tiết như dấu luyến. Hãy dùng một bản Urtext và đọc phần chú thích của người biên tập. Khi học bài thật, tránh các bản "đơn giản hóa" cho người mới học.
    ly_do: 'n74 (da-sua), n75: bỏ "bàn đạp" và nhận định chung về bản đơn giản hóa (không nguồn).'
