    luot_2_ghi_chu: PTNA ghi thời lượng 3 phút 30 giây; MIDI của Mutopia (♩ = 72) dài khoảng 2 phút 10 giây; các bản thu thường 2½–3½ phút. "Ba phút" là con số tròn chấp nhận được.
  - id: n8
    cau: 'Rondo thu nhỏ: chủ đề vang lên ba lần, xen giữa là hai đoạn tương phản.'
    loai: cau-truc
    nguon: [ mut-elise, omt-rondo ]
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Chủ đề quay lại ba lần, xen hai đoạn tương phản". Chủ đề có ba lần (A B A C A), tức quay lại hai lần; "quay lại ba lần" dễ hiểu thành bốn lần. OMT Rondo: refrain (A) trở lại, xen các episode B, C. Chữ trang hinh-thuc/rondo không đổi; ghi chú ở hinh-thuc/rondo n20 dùng chữ cũ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/", "https://enc.piano.or.jp/en/musics/446" ]
    luot_2_ghi_chu: 'Bản B&H 1888: A – B (Fa trưởng) – A – C (La trầm lặp) – A, chủ đề ba lần. Open Music Theory, chương Rondo: dạng ABACA (rondo năm phần). PTNA ghi "ロンド形式" (hình thức rondo).'
