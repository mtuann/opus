  - id: n2
    cau: La candeur là bài mở đầu tập 25 Études faciles et progressives, Op. 100 của Burgmüller.
    loai: lich-su
    nguon:
      - imslp-op100
    ket_qua: da-sua
    ghi_chu: 'Người giao (chủ lô) sửa: bỏ "được yêu thích nhất" và "với nhiều người là étude đầu tiên…" (đánh giá không đo được), giữ điều IMSLP ghi (số 1 của Op. 100); sửa cả câu mở đầu và description, ghi doi_chu. Lượt 1 ghi: câu đánh giá, không có nguồn đo "được yêu thích nhất". IMSLP có trang "See Also: List of Intermediate Piano Repertoire" và nhiều bản chép, bản thu cho Op. 100 (nhiều hơn hẳn các opus khác của Burgmüller trên Category), nhưng không nói thẳng. Đề nghị người giao: giữ như lời giới thiệu (chữ ở câu mở đầu và mô tả trang) hay viết lại "một trong những tập étude được dùng nhiều nhất". Không sửa vì câu nằm cả ở description (frontmatter). Review D6-L1-gom: chữ trang (câu mở đầu, description) chỉ còn điều IMSLP ghi (số 1 của Op. 100); lượt 2 xác nhận (IMSLP, Henle HN 1726). Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/25_%C3%89tudes_faciles_et_progressives,_Op.100_(Burgm%C3%BCller,_Friedrich)", "https://www.henle.de/25-Etudes-op.-100/HN-1726" ]
    luot_2_ghi_chu: "IMSLP: La candeur là số 1, đứng đầu tập; Henle HN 1726 liệt kê bài 1 ở đầu."
    review: dung
