ghi_chu: 'Bài học tác phẩm (tầng Tác phẩm). Bản nhạc: Mutopia 25EF-01 (Litolff), .ly, PDF A4 và MIDI tải ngày 05/11/2026 (User-Agent opus-kiem-dinh). Chữ do ::hop-tac-pham dựng (chip, bảng thông tin), ::hinh-cau-truc và ::hoc-tiep không tách ở đây: thuộc hồ sơ du-lieu/tac-pham/burgmuller-la-candeur. Sửa trang: n16 (Burgmüller mất ở Beaulieu-sur-Mer, không ở Paris), n30 (bỏ câu "được thu rất nhiều"), khối 1 (nốt cuối ô 8 là Sol5). Chưa chắc: n2 (câu đánh giá "tập étude được yêu thích nhất", có cả trong description). Thuật ngữ trang dùng (legato, dolce, poco rit., sf, coda, kết nửa, kết trọn, át âm) đều đã có trong src/data/thuat-ngu.yml hay trang nhạc lý đã khóa.'
