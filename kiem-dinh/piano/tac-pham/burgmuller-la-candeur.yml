  ket_qua: dung
  ghi_chu: 'IMSLP: La candeur, L''arabesque, La pastorale, La petite réunion, Innocence, Progrès, Le courant limpide … La chevaleresque; vài tựa là tên thể loại (Ballade, Barcarolle, La tarentelle), vẫn gợi một hình ảnh.'
- id: n23
