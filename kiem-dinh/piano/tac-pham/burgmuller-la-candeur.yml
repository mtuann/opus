nhan_dinh:
- id: n1
  cau: La candeur là bài mở đầu (số 1) của tập 25 Études faciles et progressives, Op. 100 của Burgmüller.
  loai: danh-muc
  nguon:
  - imslp-op100
  ket_qua: dung
  ghi_chu: 'IMSLP: "{{#subitem:...|number=1|title=La candeur}}" trong danh sách 25 bài của Op.100.'
- id: n2
  cau: Tập étude Op. 100 là tập étude được yêu thích nhất của Burgmüller, và với nhiều người La candeur là étude đầu tiên nghe như nhạc thật.
  loai: lich-su
  nguon:
  - imslp-op100
  ket_qua: null
  ghi_chu: 'chưa chắc: câu đánh giá, không có nguồn đo "được yêu thích nhất". IMSLP có trang "See Also: List of Intermediate Piano Repertoire" và nhiều bản chép, bản thu cho Op. 100 (nhiều hơn hẳn các opus khác của Burgmüller trên Category), nhưng không nói thẳng. Đề nghị người giao: giữ như lời giới thiệu (chữ ở câu mở đầu và mô tả trang) hay viết lại "một trong những tập étude được dùng nhiều nhất". Không sửa vì câu nằm cả ở description (frontmatter).'
- id: n3
  cau: Bài có giai điệu móc đơn hát liền tiếng ở tay phải trên những hợp âm ngân của tay trái, rồi hai tay đổi vai.
  loai: cau-truc
  nguon: &id001
  - mutopia-202
  ket_qua: dung
  ghi_chu: 'Mutopia: ô 1–8 tay phải móc đơn có dấu luyến, tay trái hợp âm nốt tròn; ô 9–12 tay trái chạy móc đơn (g8-5 ( b c d) …) trong khi tay phải giữ <c e>1.'
- id: n4
  cau: Chữ candeur nghĩa là trong sáng, ngây thơ.
  loai: ten
  nguon:
  - cnrtl-candeur
  ket_qua: dung
  ghi_chu: 'CNRTL: "Pureté de l''âme qui se manifeste par un comportement simple et sincère"; "Innocence de cœur d''une pers. sans expérience de la vie".'
- id: n5
  cau: Muốn chơi đúng tính cách candeur, cần một legato thật đều và sự cân bằng tinh tế giữa hai tay.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n6
  cau: Burgmüller mở tập Op. 100 bằng một bài hát không lời có câu, có chỗ to dần, một nốt nhấn sf ở đỉnh, một chỗ dolce e poco rit. và một coda nhỏ dần đến pp.
  loai: cau-truc
  nguon:
  - mutopia-202
  - imslp-op100
  ket_qua: dung
  ghi_chu: 'Mutopia: cresc. ô 5, \< ô 7, 10, 12; a8-5_\sf ô 14; "dolce e poco rit." ô 15; coda có \> mỗi nhóm, "dim. e poco rit.", <e c''>1_\pp. "Bài luyện ngón khô khan" là cách nói đối lập, không phải nhận định riêng.'
- id: n7
  cau: Gần như ô nào cũng là một chuỗi móc đơn có dấu luyến, từng nhóm bốn hoặc tám nốt.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: dấu luyến bốn nốt (ô 1, 2, 5, 6), tám nốt (ô 3, 4, 9, 11); vài ô không có móc đơn (ô 10, 12 tay phải nốt tròn, ô 13 nốt trắng, ô 21–23), nên "gần như" đúng.'
- id: n8
  cau: Đều về nhịp và đều về tiếng là nền của mọi giai điệu bạn sẽ chơi về sau.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n9
  cau: Suốt đoạn A, tay trái chỉ giữ hợp âm.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia vThree ô 1–8: <c e g>1, <c f a>, <c e g>~<c e g>, <b f'' g>, <c e g>, <d fis c''>, <g b>2. r4.'
- id: n10
  cau: Đoạn A là hoàn cảnh lý tưởng để tập cho tay phải hát, còn tay trái lùi về phía sau.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n11
  cau: Link "Phối hợp hai tay" tới /opus/piano/hai-tay/ (trang cùng nói về cân bằng hai tay).
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Trang đích src/content/docs/piano/hai-tay.md có trong site mới. Điều cần giữ: trang ấy nói về phối hợp và cân bằng hai tay.'
- id: n12
  cau: Đoạn B đưa hình móc đơn xuống tay trái trong khi tay phải giữ hai nốt ngân; ô 13 bắt một bàn tay chơi hai bè cùng lúc.
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: ô 10, 12 tay phải <c-2 e-4>1 trên tay trái móc đơn; ô 13 vOne g''2-5 fis (bè trên) và vTwo r8 es d c (bè dưới), cùng khuông tay phải.'
- id: n13
  cau: Bài ở Đô trưởng nhưng có Fa♯ (ô 7), Mi♭ (ô 13) và La♭ (coda).
  loai: cau-truc
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Mutopia: \key c\major; <d fis c''> ô 7; es ô 13 (vTwo); <c f as> ở coda (ô 18, 20).'
- id: n14
  cau: Nghe ra những màu hòa âm ấy ngay khi đang chơi là bước đầu của việc nghe hòa âm.
  loai: khuyen-tap
  nguon: []
  ket_qua: khong-can-nguon
- id: n15
  cau: Friedrich Burgmüller sinh năm 1806 ở Regensburg.
  loai: nam
  nguon:
  - db-burgmuller
  - imslp-burgmuller
  ket_qua: dung
  ghi_chu: 'Deutsche Biographie: Lebensdaten 1806–1874, Geburtsort Regensburg. IMSLP: Born 1806/12/4.'
- id: n16
  cau: Burgmüller sang Paris năm 1832 và sống ở Pháp đến cuối đời.
  loai: lich-su
  nguon:
  - ndb-burgmuller
  - bnf-burgmuller
  - db-burgmuller
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "sang Paris năm 1832 và ở lại đó đến cuối đời". Chữ mới: "sang Paris năm 1832 và sống ở Pháp đến cuối đời". Lý do: Deutsche Biographie ghi Sterbeort Beaulieu (Beaulieu-sur-Mer, ở Pháp), không phải Paris; NDB: "lebte seit 1832 in Paris"; BnF: "Installé à Paris en 1832". (BnF ghi deathPlace Paris trong dữ liệu máy, cùng lúc ghi birthPlace Paris là sai rõ, nên theo Deutsche Biographie.) Trang Arabesque cũ có cùng câu "ở lại đó đến cuối đời": lô chuyển trang ấy cần sửa theo.'
- id: n17
  cau: Ở Paris, Burgmüller làm thầy dạy piano và viết nhạc salon (nhạc piano phổ thông) cho người chơi nghiệp dư.
  loai: lich-su
  nguon:
  - db-burgmuller
  - ndb-burgmuller
  ket_qua: dung
  ghi_chu: 'Deutsche Biographie: Beruf "Komponist; Musiker; Pianist; Musiklehrer". NDB: "Komponist populärer Klaviermusik". "Nhạc salon cho người chơi nghiệp dư" là cách gọi loại nhạc piano phổ thông ấy; Op. 100 ghi rõ cho người học (n20).'
- id: n18
  cau: Chân dung đầy đủ hơn của Burgmüller có ở trang Arabesque (/opus/piano/tac-pham/burgmuller-arabesque/).
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Trang đích chưa chuyển (D6, lô khác). Site cũ ../opus-zero/docs/piano/tac-pham/burgmuller-arabesque.md, mục "Bối cảnh" dòng 32: đoạn tiểu sử Burgmüller (Regensburg 1806, Paris 1832, thầy dạy piano, nhạc salon, ballet La Péri 1843). Điều cần giữ: trang Arabesque có đoạn tiểu sử dài hơn trang này. Chú ý cho lô chuyển trang ấy: câu "ở lại đó đến cuối đời" ở trang cũ sai (xem n16).'
- id: n19
  cau: Arabesque là bài số 2 của cùng tập Op. 100, đứng ngay sau La candeur.
  loai: danh-muc
  nguon:
  - imslp-op100
