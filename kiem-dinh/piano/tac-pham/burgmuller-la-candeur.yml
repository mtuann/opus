khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
      - hop-am
      - so-ngon
      - doi-chieu-an-ban
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu từng nốt ô 1–8 (cả dấu luyến, sắc thái, số ngón, dấu nhắc lại) với Mutopia 25EF-01.ly (Litolff, Bas Wassink), đọc tay theo cao độ tương đối của LilyPond, rồi so với MIDI Mutopia tải mới (25EF-01.mid, mido: in nốt theo ô) và ảnh PDF A4 (vẽ bằng PDFKit). 4/4, Đô trưởng, mỗi ô 8 móc đơn. Khớp mọi nốt trừ nốt cuối ô 8 của tay phải: khối ghi G2 (Sol4), Mutopia ghi g4 sau d (Sol5, PDF thấy nốt đen trên dòng kẻ trên cùng; MIDI tải mới: G5). Đã sửa "GBcd G2) z2 :|" thành "GBcd g2) z2 :|". (File MIDI cũ ../opus-zero/_imslp/mid/mut_burg01.mid ghi G4: file này khác file trên Mutopia, có lẽ dựng lại bằng công cụ khác, nên lỗi lọt qua lần đối chiếu ở site cũ.) Tay trái: C3 E3 G3 / C3 F3 A3 / C3 E3 G3 (nối) / B2 F3 G3 / C3 E3 G3 / D3 F#3 C4 / G3 B3 nốt trắng chấm: khớp. Số ngón 5,3 / 5 / 5,2,1,3 / 2,1 / 4 / 3,4: đúng chỗ Mutopia ghi; "dolce" ở tay trái, cresc. ô 5, dấu nhỏ dần ô 2, to dần ô 7: khớp. Doi_chu đã ghi.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
      - chang
    ket_qua: dung
    ghi_chu: 'Tay phải hát, tay trái trải thảm: 4/4, Đô trưởng, 4 ô đủ 8 móc đơn. Tay phải thế Đô năm ngón (1 trên C5, 5 trên G5; ô 4 F-D-C 4-2-1); tay trái Đô – Mi – Sol 5-3-1 và Si – Fa – Sol 5-2-1 như lời dẫn (n69). Hòa âm I – V7 – I – V7 I, giai điệu khớp hợp âm (nốt qua ở ô 2). mf/pp khớp lời dẫn. Hợp chặng 2.'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
      - chang
    ket_qua: dung
    ghi_chu: 'Hai tay ngược chiều, rồi đổi vai: 4/4, Đô trưởng, đủ phách. Ô 1, 3: tay phải G5-F-E-D (5) rồi C5-D-E-F (1), tay trái C3-D-E-F (5) rồi G3-F-E-D (1): ngược chiều từng cặp, như ô 9 của bài. Ô 2, 4: tay phải [C5 E5] nốt tròn, tay trái chạy, !<(! ở ô 2 và !>(! ở ô 4 như lời dẫn (n71). Thế năm ngón cả hai tay, hợp chặng 2.'
  - khoi: 4
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
      - chang
    ket_qua: dung
    ghi_chu: 'Giữ nốt trên, nhấn rồi buông: 4/4, Đô trưởng, 4 ô đủ 8 móc đơn (ô 1–2 dùng chồng bè "&": bè trên nốt tròn/trắng, bè dưới z + ba móc đơn hai lần). Ô 1: G5 (5) giữ, E-D-C (3-2-1), F-E-D (4-3-2); ô 2: F5 rồi E5 (5) giữ, D-C-B và C-B-A (3-2-1), mỗi nửa ô dời xuống một bậc như lời dẫn (n72). Hòa âm: C, G7, G7 (Sol – Fa), La thứ (La – Mi), C, G7, C: nốt trên khớp. Ô 3–4 cặp nhấn (A-G, G-F, F-E) như nốt sf La – Sol ở ô 14; poco rit. ô cuối. Tay trái quãng 7 Sol2 – Fa3 (ô 2) chơi được bằng 5-1. Hợp chặng 2.'
doi_chu:
  - cu: Friedrich Burgmüller sinh năm 1806 ở Regensburg, sang Paris năm 1832 và ở lại đó đến cuối đời, làm thầy dạy piano và viết nhạc salon cho người chơi nghiệp dư. Chân dung đầy đủ hơn có ở trang Arabesque, bài số 2 của cùng tập.
    moi: Friedrich Burgmüller sinh năm 1806 ở Regensburg, sang Paris năm 1832 và sống ở Pháp đến cuối đời, làm thầy dạy piano và viết nhạc salon cho người chơi nghiệp dư. Chân dung đầy đủ hơn có ở trang Arabesque, bài số 2 của cùng tập.
    ly_do: "n16 (da-sua): Burgmüller mất ở Beaulieu(-sur-Mer), không ở Paris (Deutsche Biographie, GND 117168890); NDB và BnF: sống ở Paris từ 1832."
  - cu: "Bài này được thu rất nhiều, cả bởi nghệ sĩ lẫn giáo viên. Nghe hai, ba bản và mỗi lần chú ý một điều:"
    moi: "Nghe hai, ba bản thu và mỗi lần chú ý một điều:"
    ly_do: 'n30 (da-bo): "được thu rất nhiều, cả bởi nghệ sĩ lẫn giáo viên" không kiểm được (IMSLP chỉ có một bản thu số 1).'
