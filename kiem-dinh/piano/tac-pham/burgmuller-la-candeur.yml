  - cu: "Bài mở đầu tập étude được yêu thích nhất của Burgmüller, và với nhiều người là étude đầu tiên nghe như nhạc thật: một giai điệu móc đơn hát liền tiếng ở tay phải trên những hợp âm ngân của tay trái, rồi hai tay đổi vai. Muốn chơi đúng tính cách candeur (trong sáng, ngây thơ), bạn cần một legato thật đều và một sự cân bằng tinh tế giữa hai tay."
    moi: "Bài mở đầu tập 25 Études faciles et progressives, Op. 100 của Burgmüller, một étude nghe như nhạc thật: một giai điệu móc đơn hát liền tiếng ở tay phải trên những hợp âm ngân của tay trái, rồi hai tay đổi vai. Muốn chơi đúng tính cách candeur (trong sáng, ngây thơ), bạn cần một legato thật đều và một sự cân bằng tinh tế giữa hai tay."
    ly_do: "n2 (da-sua, người giao): bỏ đánh giá \"được yêu thích nhất\", \"với nhiều người là étude đầu tiên\" (không có nguồn đo được); giữ điều IMSLP ghi: bài số 1 của Op. 100."
  - cu: "mô tả: Bài mở đầu tập étude được yêu thích nhất của Burgmüller, và với nhiều người là étude đầu tiên nghe như nhạc thật: một giai điệu móc đơn hát liền tiếng ở tay…"
    moi: "mô tả: Bài mở đầu tập 25 Études faciles et progressives, Op. 100 của Burgmüller, một étude nghe như nhạc thật: một giai điệu móc đơn hát liền tiếng ở tay phải…"
    ly_do: "n2 (da-sua, người giao): bỏ đánh giá \"được yêu thích nhất\", \"với nhiều người là étude đầu tiên\" (không có nguồn đo được); giữ điều IMSLP ghi: bài số 1 của Op. 100."
