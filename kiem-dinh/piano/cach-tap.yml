khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - khoa
      - nhip
      - not
      - so-ngon
    ket_qua: dung
    ghi_chu: "Bốn cách tập một đoạn chạy nốt: 2/4, L:1/16, K:C, một quãng tám gam Đô trưởng tay phải. Ô 1 (Gốc): c d e f g a b c' = 8 nốt 1/16 = 2/4; ngón !1!c, !1!f, !5!c' = 1 2 3, luồn cái (1 ở Fa), 1 2 3 4 5 khớp lời dẫn. Ô 2–3 (Dài – ngắn): c3 d e3 f | g3 a b3 c' = 3+1+3+1 = 8, đủ ô. Ô 4–5 (Ngắn – dài): c d3 e f3 | g a3 b c'3 = 1+3+1+3 = 8, đủ ô. Ô 6 (Đổi trọng âm): cùng tám nốt với !accent! ở c, f, b (nhóm ba–ba–hai) = 8. Ô 7: c'8 nốt kết. Cả bốn dạng đi đúng các nốt gam; nhịp đúng 2/4 mỗi ô. Chơi được (tay phải một bè, ngón 1 2 3 + luồn cái + 1 2 3 4 5). Kiểm bằng tay và bằng node tools/khuong-nhac.mjs (không cảnh báo)."
ghi_chu: 'Lượt 1 trang Cách tập piano hiệu quả (lô D4-L3, phần A). Nguồn đã mở: BAPAM The Healthy Pianist (PDF), Chang Fundamentals of Piano Practice (mục lục, III.6; III.14 và III.15 dùng cho hoc-thuoc-bieu-dien), Crossref và OpenAlex (Ericsson 1993; Pascual-Leone 1995; Roediger, Karpicke 2006), trang chủ Practising the Piano. Toàn văn Ericsson, Pascual-Leone, Brooks, Chaffin không mở được (PubMed bị reCAPTCHA, tạp chí chặn): xem n3 và n43. Đã sửa (da-sua): n3 (Ericsson), n13 (bước 5), n20 (bước 10), n27 (căng tay), n33 (thêm câu BAPAM dưới bảng), n38, n39, n41, n43, n46 (hai ô công cụ), n48, n55–n57 (mục Nguồn), n60. Đã bỏ (da-bo): n58, n59 (sách và bài trong mục Nguồn). Điều lô trước yêu cầu giữ: bảng Mẫu buổi tập và neo #mau-buoi-tap (bai-tap-ngon.yml, moi-ngay.yml, lo-trinh-choi.yml, piano/index.yml): KHỚP, giữ nguyên số; ví dụ đoạn chạy gam (bai-tap-ngon.yml, gam.yml): KHỚP, còn khối "Bốn cách tập một đoạn chạy nốt"; tên mục "Ví dụ một thang máy đếm nhịp" (hai-tay.yml): KHỚP; neo #khi-bi-giam-chan-tai-cho (lo-trinh.md): KHỚP; mục Chia đoạn "Chia theo câu nhạc" (13-ket.yml): KHỚP (bước 4); "Đếm to" (03-truong-do.yml, 04-nhip.yml): KHỚP (bước 5, hàng "Nhịp" của bảng lỗi). Câu ve-site trỏ trang chưa chuyển (đã kiểm trên ../opus-zero/docs/): n6 (nhat-ky), n18 (metronome), n22 (thu-am), n37 (thay-va-thi), n42 và n49 (tac-pham-theo-cap), n45 (tiet-tau, doc-not), n46 (choi-theo, ket-noi-midi). Thuật ngữ chưa có bản ghi thuat-ngu.yml: điểm neo, thang máy đếm nhịp, nối ngược (backward chaining), điểm nóng, bài bảo trì, biến thể tiết tấu, tập có chủ đích (deliberate practice) (cho D3-L5/người giao). Người giao quyết: (1) hàng "Nghỉ" của bảng Mẫu buổi tập (5–10 phút ở buổi 90) thấp hơn mốc BAPAM 20/10: hiện chỉ thêm câu n33, chưa đổi số; (2) "Học với thầy và thi cấp", "Máy đếm nhịp", "Thu âm", "Nhật ký" chưa chuyển: giữ tiêu đề; (3) hai ô công cụ đã sửa (n46) cần giữ khi chuyển luyen-tap/choi-theo, nhat-ky.'
doi_chu:
  - cu: 'Ba mươi phút tập đúng cách có ích hơn hai giờ "chơi đi chơi lại từ đầu". Trang này gom lại những điều mà giáo viên giỏi và các nghiên cứu về học kỹ năng đều đồng ý: quy trình học một bài mới từ trang nhạc đầu tiên đến lúc chơi được cho người khác nghe, cách sửa một lỗi cho dứt điểm, và các mẫu buổi tập 20, 45, 90 phút.'
    moi: 'Ba mươi phút tập đúng cách có ích hơn hai giờ "chơi đi chơi lại từ đầu". Trang này gom lại một cách tập: quy trình học một bài mới từ trang nhạc đầu tiên đến lúc chơi được cho người khác nghe, cách sửa một lỗi cho dứt điểm, và các mẫu buổi tập 20, 45, 90 phút.'
    ly_do: 'n60 (da-sua): Câu cũ: "Trang này gom lại những điều mà giáo viên giỏi và các nghiên cứu về học kỹ năng vận động đều đồng ý…" Khẳng định "đều đồng ý" không có nguồn; bỏ. Đã sửa cả mô tả (description) ở đầu trang.'
  - cu: 'Nhà tâm lý học K. Anders Ericsson gọi cách tập của người giỏi là tập có chủ đích (deliberate practice): mỗi lần tập có một mục tiêu cụ thể, bạn tập trung hoàn toàn, nhận phản hồi ngay (từ tai mình, máy đếm nhịp, bản ghi âm, thầy), và làm việc ở mức hơi khó hơn khả năng hiện tại. Trái ngược với nó là "chơi cho vui từ đầu đến cuối": dễ chịu, nhưng tiến bộ chậm.'
    moi: 'Nhà tâm lý học K. Anders Ericsson và đồng nghiệp gọi những hoạt động đòi hỏi nỗ lực và được thiết kế để cải thiện thành tích là tập có chủ đích (deliberate practice). Trang này mượn tinh thần ấy làm khuôn cho buổi tập: mỗi lần tập có một mục tiêu cụ thể, bạn tập trung hoàn toàn, nhận phản hồi ngay (từ tai mình, máy đếm nhịp, bản ghi âm, thầy), và làm việc ở mức hơi khó hơn khả năng hiện tại. Trái ngược với nó là "chơi cho vui từ đầu đến cuối": dễ chịu, nhưng ít tiến bộ.'
    ly_do: 'n3 (da-sua): Câu cũ gán cho Ericsson bốn đặc điểm (mục tiêu cụ thể, tập trung hoàn toàn, phản hồi ngay, hơi khó hơn khả năng) và gọi đó là "cách tập của người giỏi". Tóm tắt bài (OpenAlex): tập có chủ đích là "a regimen of effortful activities designed to optimize improvement"; chênh lệch thành tích liên quan chặt với lượng tập có chủ đích. Không mở được toàn văn nên bốn đặc điểm không còn gán cho Ericsson: viết lại thành định nghĩa của tóm tắt, và chuyển bốn đặc điểm thành lời khuyên của trang (n4). Tên bài, tác giả, tạp chí 100(3), 1993, trang 363–406: Crossref.'
  - cu: Tập từng tay, thật chậm. Đúng nốt, đúng ngón, đúng nhịp, đúng dấu luyến, staccato và sắc thái ngay từ đầu. Đếm to. Học sai rồi sửa tốn gấp nhiều lần học đúng ngay lần đầu.
    moi: Tập từng tay, thật chậm. Đúng nốt, đúng ngón, đúng nhịp, đúng dấu luyến, staccato và sắc thái ngay từ đầu. Đếm to. Học đúng ngay từ đầu thì đỡ phải sửa về sau.
    ly_do: 'n13 (da-sua): Câu cũ: "Học sai rồi sửa tốn gấp nhiều lần học đúng ngay lần đầu." "Gấp nhiều lần" là con số không có nguồn; viết lại thành lời khuyên.'
  - cu: Xen kẽ và giãn cách. Trong một buổi, luân phiên 2–3 điểm nóng thay vì tập một chỗ 30 phút liền; ôn lại sau 1 ngày, 3 ngày, 1 tuần. Cảm giác khó hơn và có vẻ "kém hơn" ngay trong buổi, nhưng các nghiên cứu về học kỹ năng vận động cho thấy cách này giúp nhớ lâu hơn.
    moi: Xen kẽ và giãn cách. Trong một buổi, luân phiên 2–3 điểm nóng thay vì tập một chỗ 30 phút liền; ôn lại sau 1 ngày, 3 ngày, 1 tuần. Cách này tạo cảm giác khó hơn và có vẻ "kém hơn" ngay trong buổi; hãy thử vài tuần rồi tự so sánh.
    ly_do: 'n20 (da-sua): Câu cũ: "…nhưng các nghiên cứu về học kỹ năng vận động cho thấy cách này giúp nhớ lâu hơn." Không mở được nghiên cứu nào về học kỹ năng vận động (Pascual-Leone, Gebrian không mở được; Roediger và Karpicke 2006 là về đoạn văn xuôi, không phải kỹ năng vận động). Bỏ vế kết luận từ nghiên cứu, giữ lời khuyên tập.'
  - cu: "Ở 76 bắt đầu căng tay: dừng, không cố"
    moi: "Ở 76 bắt đầu căng tay: dừng tăng tốc độ và xem lại cách chơi"
    ly_do: 'n27 (da-sua): BAPAM The Healthy Pianist, Warning Signs (tr. 3): "If you do start to experience tension or fatigue" thì coi đó là dấu hiệu "you may need to reassess your technique, your practise methods" hoặc đổi chương trình tập; "If you experience pain, stop immediately." Câu cũ: "Ở 76 bắt đầu căng tay: dừng, không cố"; "dừng" quá rộng với căng, nên viết "dừng tăng tốc độ và xem lại cách chơi". Nhận định về sức khỏe, không xếp khuyen-tap.'
  - cu: Số trong bảng là phút.
    moi: 'Số trong bảng là phút. Dòng "Nghỉ" theo lời khuyên của BAPAM: tập khoảng 20 phút rồi nghỉ 10 phút (xem Giữ đôi tay khỏe).'
    ly_do: "n33 (da-sua, review D4-gom): dòng Nghỉ của bảng nay theo mốc BAPAM."
