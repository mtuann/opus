  - id: n43
    cau: "Tập trong đầu: nhìn bản nhạc, nghe nhạc trong đầu, tưởng tượng cảm giác từng ngón trên phím; muốn thuộc bền, hãy tập đến khi chơi được cả bài trong đầu."
    loai: khuyen-tap
    nguon:
      - chang
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Trong một nghiên cứu nổi tiếng năm 1995, nhóm của Alvaro Pascual-Leone cho thấy người chỉ tập trong tưởng tượng một bài tập năm ngón trên piano cũng có những thay đổi ở vùng não điều khiển vận động; tuy vậy, hiệu quả rõ nhất vẫn là khi kết hợp với tập thật." Đã mở bản ghi bài (Crossref, OpenAlex; DOI 10.1152/jn.1995.74.3.1037): tên bài, tác giả, J Neurophysiol 74(3), 1995, tr. 1037–1045 đúng; tóm tắt chỉ cho thấy bản đồ vỏ não mở rộng sau năm ngày tập piano năm ngón và có so sánh tập trong đầu với tập thật, nhưng phần tóm tắt về tập trong đầu bị cắt nên không kiểm được "những thay đổi ở vùng não" của nhóm chỉ tập tưởng tượng. Bỏ câu; thay bằng lời khuyên theo Chang III.6, mục j: "You have not really memorized until you can play the piece in your mind." Nếu người giao muốn giữ câu, cần mở toàn văn bài.'
