nhan_dinh:
  - id: n1
    cau: Ba mươi phút tập đúng cách có ích hơn hai giờ "chơi đi chơi lại từ đầu".
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập, cùng ý với "Bạn đang tập hay chỉ đang chơi?" ở mục giậm chân tại chỗ.
  - id: n2
    cau: Trang gồm quy trình học một bài mới, cách sửa một lỗi cho dứt điểm và các mẫu buổi tập 20, 45, 90 phút.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: mục "Học một bài mới: 12 bước", "Sửa một lỗi cho dứt điểm", "Mẫu buổi tập" (bảng ba cột 20, 45, 90 phút). Review D4-gom: trang có "## Học một bài mới: 12 bước", "## Sửa một lỗi cho dứt điểm", "## Mẫu buổi tập" (bảng ba cột 20, 45, 90 phút).'
    review: dung
  - id: n3
    cau: Ericsson và đồng nghiệp gọi những hoạt động đòi hỏi nỗ lực và được thiết kế để cải thiện thành tích là tập có chủ đích (deliberate practice).
    loai: dinh-nghia
    nguon:
      - ericsson
      - ericsson-crossref
    ket_qua: da-sua
    ghi_chu: 'Câu cũ gán cho Ericsson bốn đặc điểm (mục tiêu cụ thể, tập trung hoàn toàn, phản hồi ngay, hơi khó hơn khả năng) và gọi đó là "cách tập của người giỏi". Tóm tắt bài (OpenAlex): tập có chủ đích là "a regimen of effortful activities designed to optimize improvement"; chênh lệch thành tích liên quan chặt với lượng tập có chủ đích. Không mở được toàn văn nên bốn đặc điểm không còn gán cho Ericsson: viết lại thành định nghĩa của tóm tắt, và chuyển bốn đặc điểm thành lời khuyên của trang (n4). Tên bài, tác giả, tạp chí 100(3), 1993, trang 363–406: Crossref.'
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1037/0033-295X.100.3.363" ]
    luot_2_ghi_chu: Ericsson, Krampe, Tesch-Römer 1993 (Psychological Review 100(3)) là nguồn của khái niệm; chỉ mở được bản ghi thư mục, chưa đọc nguyên văn định nghĩa. Định nghĩa trên trang khớp cách hiểu phổ biến.
  - id: n4
    cau: 'Khuôn cho buổi tập: mỗi lần tập có một mục tiêu cụ thể, tập trung hoàn toàn, nhận phản hồi ngay (từ tai mình, máy đếm nhịp, bản ghi âm, thầy) và làm việc ở mức hơi khó hơn khả năng hiện tại; "chơi cho vui từ đầu đến cuối" dễ chịu nhưng ít tiến bộ.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập. Câu cũ viết "tiến bộ chậm"; đổi thành "ít tiến bộ" cho khớp mục giậm chân tại chỗ ("dễ chịu nhưng ít tiến bộ").
  - id: n5
    cau: 'Trước mỗi buổi viết một dòng mục tiêu (ví dụ "ô nhịp 9–16 tay trái, ngón bấm mới ở ô 12, ♩ = 72, ba lần liền không vấp"); cuối buổi ghi một dòng vào nhật ký: đạt chưa, mai làm gì.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập. Ví dụ nhất quán với nhịp độ của thang máy đếm nhịp (n17).
  - id: n6
    cau: Liên kết Nhật ký luyện tập (/opus/luyen-tap/nhat-ky/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển; đã kiểm ../opus-zero/docs/luyen-tap/nhat-ky.md ("# Nhật ký luyện tập"; có mục Bài đang tập, Tiến bộ theo tuần, ô lịch từng ngày, và khung "Ghi chú tốt trông như thế nào?"). Lô chuyển phải giữ: trang là nơi ghi lịch tập và ghi chú. Review D4-gom: trang đích chưa chuyển: ../opus-zero/docs/luyen-tap/nhat-ky.md có.'
