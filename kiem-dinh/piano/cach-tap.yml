  - cu:
      - "Gần như ai cũng có những tuần thấy mình không tiến bộ. Thường đó là dấu hiệu bạn đang tập lặp lại theo cùng một cách, hoặc tay đang tiêu hóa những gì đã học. Nếu kéo dài, đi qua danh sách này:"
      - "Bài có quá khó không? Một bài vượt hai chặng tốn thời gian gấp nhiều lần và dễ làm căng tay. Lùi lại, học nhiều bài vừa sức: số bài đã chơi trọn là thứ làm bạn tiến nhanh nhất (xem Tác phẩm theo cấp độ)."
    moi:
      - "Gần như ai cũng có những tuần thấy mình không tiến bộ. Thường đó là dấu hiệu bạn đang tập lặp lại theo cùng một cách. Nếu kéo dài, đi qua danh sách này:"
      - "Bài có quá khó không? Một bài vượt hai chặng thường tốn nhiều thời gian hơn hẳn. Lùi lại, học nhiều bài vừa sức: số bài đã chơi trọn là thứ làm bạn tiến nhanh nhất (xem Tác phẩm theo cấp độ)."
    ly_do: 'n38 (da-sua): Câu cũ: "…hoặc tay đang tiêu hóa những gì đã học." Vế này nói về nguyên nhân sinh lý không có nguồn; lo-trinh.yml đã bỏ cùng vế ở trang Lộ trình. Giữ câu trấn an và nguyên nhân tập lặp lại.; n39 (da-sua): Câu cũ: "…tốn thời gian gấp nhiều lần và dễ làm căng tay." "Gấp nhiều lần" không có nguồn, "dễ làm căng tay" là điều về sức khỏe không có nguồn; viết lại cho nhẹ hơn. Trang cũ tac-pham-theo-cap (chưa chuyển) có cùng câu: lô chuyển nhớ đồng bộ.'
  - cu: Nghỉ một hai ngày. Nhiều nghiên cứu về học kỹ năng vận động cho thấy giấc ngủ giúp củng cố những gì đã tập; đôi khi bài "tự nhiên" chắc hơn sau một ngày nghỉ.
    moi: Nghỉ một hai ngày. Có khi quay lại sau một hai ngày nghỉ, bài thấy chắc hơn.
    ly_do: 'n41 (da-sua): Câu cũ: "Nhiều nghiên cứu về học kỹ năng vận động cho thấy giấc ngủ giúp củng cố những gì đã tập; đôi khi bài "tự nhiên" chắc hơn sau một ngày nghỉ." Không mở được nghiên cứu nào về giấc ngủ và kỹ năng vận động; bỏ vế "nhiều nghiên cứu cho thấy", giữ lời khuyên.'
  - cu: "Tập trong đầu: nhìn bản nhạc, nghe nhạc trong đầu, tưởng tượng cảm giác từng ngón trên phím. Trong một nghiên cứu nổi tiếng năm 1995, nhóm của Alvaro Pascual-Leone cho thấy người chỉ tập trong tưởng tượng một bài tập năm ngón trên piano cũng có những thay đổi ở vùng não điều khiển vận động; tuy vậy, hiệu quả rõ nhất vẫn là khi kết hợp với tập thật."
    moi: "Tập trong đầu: nhìn bản nhạc, nghe nhạc trong đầu, tưởng tượng cảm giác từng ngón trên phím. Muốn thuộc bền, hãy tập đến khi chơi được cả bài trong đầu (xem Học thuộc và biểu diễn)."
    ly_do: 'n43 (da-sua): Câu cũ: "Trong một nghiên cứu nổi tiếng năm 1995, nhóm của Alvaro Pascual-Leone cho thấy người chỉ tập trong tưởng tượng một bài tập năm ngón trên piano cũng có những thay đổi ở vùng não điều khiển vận động; tuy vậy, hiệu quả rõ nhất vẫn là khi kết hợp với tập thật." Đã mở bản ghi bài (Crossref, OpenAlex; DOI 10.1152/jn.1995.74.3.1037): tên bài, tác giả, J Neurophysiol 74(3), 1995, tr. 1037–1045 đúng; tóm tắt chỉ cho thấy bản đồ vỏ não mở rộng sau năm ngày tập piano năm ngón và có so sánh tập trong đầu với tập thật, nhưng phần tóm tắt về tập trong đầu bị cắt nên không kiểm được "những thay đổi ở vùng não" của nhóm chỉ tập tưởng tượng. Bỏ câu; thay bằng lời khuyên theo Chang III.6, mục j: "You have not really memorized until you can play the piece in your mind." Nếu người giao muốn giữ câu, cần mở toàn văn bài.'
