  - cu: 'mô tả: Ba mươi phút tập đúng cách có ích hơn hai giờ "chơi đi chơi lại từ đầu". Trang này gom lại những điều mà giáo viên giỏi và các nghiên cứu về học kỹ năng đều…'
    moi: 'mô tả: Ba mươi phút tập đúng cách có ích hơn hai giờ "chơi đi chơi lại từ đầu". Trang này gom lại một cách tập: quy trình học một bài mới từ trang nhạc đầu tiên đến lúc chơi được cho người khác…'
