  - id: n32
    cau: 'Bảng "Mẫu buổi tập" (số phút) với ba cột 20, 45, 90: Khởi động 2/3/5; Kỹ thuật (gam, hợp âm rải, bài tập ngón hoặc étude) 3/7/15; Bài chính (các điểm nóng xen kẽ) 10/15/20; Nghỉ 10 (một lần) ở cột 45 và 30 (ba lần) ở cột 90; Bài thứ hai hoặc bài ôn 5/10 ở cột 45/90; Thị tấu 3/3/5; Chơi trọn bài, thu âm, ghi nhật ký 2/2/5.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập (khuôn buổi tập). Đã kiểm cộng: cột 20 = 2+3+10+3+2 = 20; cột 45 = 5+7+20+5+5+3 = 45; cột 90 = 5+15+30+15+10 = 75 cộng Nghỉ (5–10) và Chơi trọn bài (5–10) nên đủ 90 khi hai dòng ấy cộng 15 phút. Điều các lô trước yêu cầu giữ: KHỚP. Giữ đủ: bai-tap-ngon.yml (hàng Kỹ thuật 3/20, 7/45, 15/90 phút = 15%, 16%, 17%, gần một phần sáu), moi-ngay.yml (các phần Khởi động, Kỹ thuật, Bài chính, Thị tấu, Chơi trọn bài; dòng "Bài thứ hai (phong cách khác) hoặc bài ôn" 5 và 15; dòng Nghỉ 5–10 ở buổi 90; "bài tập ngón hoặc étude" trong dòng Kỹ thuật), lo-trinh-choi.yml (tỉ lệ cột 20 phút), piano/index.yml (neo #mau-buoi-tap và bảng 20, 45, 90). Tiêu đề "Mẫu buổi tập" và neo giữ nguyên. Review D4-gom: bảng đổi theo n33 (dòng Nghỉ theo BAPAM); cột 20 = 20, cột 45 = 3+7+15+10+5+3+2 = 45, cột 90 = 5+15+20+30+10+5+5 = 90. Kỹ thuật 7/45 = 16%, 15/90 = 17% vẫn khoảng một phần sáu (bai-tap-ngon n4).'
  - id: n33
    cau: 'Dòng "Nghỉ" của bảng Mẫu buổi tập theo lời khuyên của BAPAM: tập khoảng 20 phút rồi nghỉ 10 phút; buổi 45 phút có một lần nghỉ 10 phút, buổi 90 phút ba lần.'
    loai: quy-tac
    nguon:
      - bapam-hp
    ket_qua: da-sua
    ghi_chu: 'BAPAM The Healthy Pianist, Practising (tr. 3): "Practise in twenty minute sessions, interspersed with ten minute breaks". Thêm câu này dưới bảng vì dòng Nghỉ (5–10 phút trong buổi 90 phút) ít hơn mốc BAPAM; không đổi số trong bảng (các hồ sơ moi-ngay.yml, bai-tap-ngon.yml, piano/index.yml yêu cầu giữ bảng). Nhất quán với tu-the.md ("Hẹn giờ nghỉ: 10 phút sau mỗi 20 phút tập"). Người giao quyết: có muốn đổi hàng Nghỉ của bảng (hiện là mốc thấp hơn BAPAM) không. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016) ghi nguyên văn: "Practise in twenty minute sessions, interspersed with ten minute breaks, to allow the hands time to recover between sessions." Giữ mốc 20/10. Trang BAPAM "Returning to Playing" (nghỉ 3–5 phút sau mỗi 20–25 phút) dành cho người quay lại sau thời gian nghỉ hay hồi phục, nên không áp dụng ở đây. Nguồn BAPAM đổi link sang trang chính thức. Sửa trang cho khớp, như người giao yêu cầu: câu dưới tiêu đề cũ "Buổi dài cần nghỉ thường hơn dòng Nghỉ ghi: BAPAM khuyên…" thành "Dòng "Nghỉ" theo lời khuyên của BAPAM: tập khoảng 20 phút rồi nghỉ 10 phút"; bảng: Nghỉ 45 phút "10 (một lần)", 90 phút "30 (ba lần)" (cũ: chỉ "5–10" ở buổi 90). Các dòng khác chỉnh để mỗi cột vẫn cộng đúng: 45 phút 3+7+15+10+5+3+2; 90 phút 5+15+20+30+10+5+5 (60 phút tập chia bốn lượt 15 phút). Dòng Kỹ thuật giữ 3/7/15 (bai-tap-ngon n4: "khoảng một phần sáu"); cột 20 phút không đổi (lo-trinh-choi, moi-ngay dựa vào nó); dòng "Bài thứ hai" vẫn có ở 45 và 90 (moi-ngay). Cần lượt 2 kiểm chữ mới.'
    luot_2: dung
