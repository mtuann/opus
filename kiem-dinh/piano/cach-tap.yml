    ghi_chu: 'Câu cũ: "Học sai rồi sửa tốn gấp nhiều lần học đúng ngay lần đầu." "Gấp nhiều lần" là con số không có nguồn; viết lại thành lời khuyên. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
