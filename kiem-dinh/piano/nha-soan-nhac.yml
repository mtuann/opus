  - id: n2
    cau: 'Hộp "Đọc mức độ thế nào": "Grade 5" nghĩa là bản ấy (hay một chương, một bản trong tập) có trong đề cương thi piano của ABRSM ở Grade 5, các kỳ 2021–2022 đến 2025–2026; "Initial Grade" là cấp trước Grade 1.'
    loai: dinh-nghia
    nguon:
      - ab2526
      - ab2122
      - ab2324
    ket_qua: da-sua
    ghi_chu: 'cap-do.yml: chặng 7 "Sau Grade 8", tuong_duong "diploma trở lên"; ABRSM thi Grade 1–8 và các diploma (ARSM, LRSM, FRSM). Review D4-gom: hộp viết lại theo quy tắc mức độ của review D4-gom (ghi_chu cuối hồ sơ); câu cũ ("≈ Grade 5" là ước lượng; "sau Grade 8" là diploma) bỏ cùng mọi Grade ước lượng. Đề cương ABRSM có Initial Grade trước Grade 1 (Kabalevsky A Little Scherzo ở Initial Grade, 2021–22 và 2025–26). Phần chặng tách thành n185 (ve-site). Cần lượt 2 bổ sung cho chữ mới.'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2023-09/piano-2021-2022-syllabus-rev-sep-2020-final.pdf", "https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf" ]
    luot_2_ghi_chu: Đề cương 2021–22 và 2025–26 có Initial Grade (vd. Kabalevsky A Little Scherzo, Initial Grade, List A) và Grade 1–8, đều chọn bài theo từng grade; Initial đứng trước Grade 1.
