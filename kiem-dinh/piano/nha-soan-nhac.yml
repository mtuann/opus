  - cu: "Đặc trưng khi chơi: thời đầu như Chopin qua lăng kính Nga: tay trái nhảy rộng và rải qua hơn một quãng mười, nhịp chồng nhịp (ba chồng hai, năm chồng ba), bàn đạp dày. Thời cuối, hòa âm rời xa giọng trưởng thứ, âm thanh lung linh và nóng bỏng. Bàn tay ông nhỏ, khó vươn tới quãng chín, nên chính nhạc của ông dạy cách rải nhanh và dùng bàn đạp khéo."
