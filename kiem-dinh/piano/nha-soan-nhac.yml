  - cu:
      - "György Kurtág (sinh 1926, tròn 100 tuổi năm 2026): bộ Játékok (Trò chơi), viết từ năm 1973, nay đã mười tập. Ý tưởng đến từ những đứa trẻ coi cây đàn như món đồ chơi; Kurtág nói đây không phải giáo trình mà là chỗ để thử nghiệm: những bản rất ngắn với chùm nốt bấm bằng cả lòng bàn tay, những cú lướt khắp bàn phím, những khoảng lặng. Chơi được từ những tuần đầu, và bản nào cũng dạy bạn nghe từng âm thanh."
      - "Arvo Pärt (sinh 1935): Für Alina (1976) và Variationen zur Gesundung von Arinuschka rất ít nốt (≈ Grade 2–4), nhưng là bài học về độ vang, bàn đạp và sự tĩnh lặng. Nghe thêm Spiegel im Spiegel."
      - "Philip Glass (sinh 1937): Opening trong album Glassworks (1982), Metamorphosis, 20 Étude. Mẫu hình lặp lại rất lâu, có chỗ nhịp ba chồng lên nhịp hai; dạy sự đều đặn và sức bền (≈ Grade 5–8)."
    moi:
      - "György Kurtág (sinh 1926): bộ Játékok (Trò chơi), viết từ năm 1973 cho việc dạy đàn, nhưng không phải giáo trình kỹ thuật đi từ dễ đến khó: những bản rất ngắn với chùm nốt bấm bằng cả lòng bàn tay, những cú lướt khắp bàn phím, những khoảng lặng. Chơi được từ những tuần đầu, và bản nào cũng dạy bạn nghe từng âm thanh."
      - "Arvo Pärt (sinh 1935): Für Alina (1976) và Variationen zur Gesundung von Arinuschka rất ít nốt, nhưng là bài học về độ vang, bàn đạp và sự tĩnh lặng. Nghe thêm Spiegel im Spiegel."
      - "Philip Glass (sinh 1937): Opening trong album Glassworks, Metamorphosis, 20 Étude. Mẫu hình lặp lại rất lâu; dạy sự đều đặn và sức bền."
    ly_do: 'n165 (da-bo): Câu cũ: "(sinh 1926, tròn 100 tuổi năm 2026)". Theo ghi chú d2-bang-tang, câu phụ thuộc năm viết; bỏ phần "tròn 100 tuổi năm 2026", giữ "sinh 1926" (khớp nha-soan-nhac.yml).; n166 (da-bo): Câu cũ: "viết từ năm 1973, nay đã mười tập". Số tập thay đổi theo thời gian, nguồn chưa mở được; bỏ "nay đã mười tập" (người giao yêu cầu bỏ hay ghi năm; chọn bỏ).; n167 (da-sua, review D4-gom): Schott (nhà xuất bản): Játékok bắt đầu năm 1973 như loạt bài sư phạm, "neither an introductory nor progressive course for acquiring piano technique"; bỏ chuyện "trẻ em coi đàn như đồ chơi" và lời "chỗ để thử nghiệm" (không có nguồn mở).; n169 (da-sua, review D4-gom): bỏ Grade ước lượng (ABRSM chỉ có Für Anna Maria, bản khác).; n170 (da-sua, review D4-gom): năm 1982 của Glassworks không có ở nguồn mở; bỏ.; n170 (da-sua, review D4-gom): bỏ Grade ước lượng và "có chỗ nhịp ba chồng lên nhịp hai" (không có nguồn mở).'
