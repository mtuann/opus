  - cu: "György Kurtág (sinh 1926, tròn 100 tuổi năm 2026): bộ Játékok (Trò chơi), viết từ năm 1973, nay đã mười tập. Ý tưởng đến từ những đứa trẻ coi cây đàn như món đồ chơi; Kurtág nói đây không phải giáo trình mà là chỗ để thử nghiệm: những bản rất ngắn với chùm nốt bấm bằng cả lòng bàn tay, những cú lướt khắp bàn phím, những khoảng lặng. Chơi được từ những tuần đầu, và bản nào cũng dạy bạn nghe từng âm thanh."
