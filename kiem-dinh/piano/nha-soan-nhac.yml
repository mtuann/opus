    ly_do: "Chuyển trang: câu hỏi trắc nghiệm của site cũ hiện nguyên dấu * quanh tên tập (tên tập Musica ricercata), site mới bỏ dấu này; nội dung không đổi."
ghi_chu: 'Lượt 1 trang Nhà soạn nhạc cho piano (lô D4-L3, phần B). Nguồn đã mở: đề cương ABRSM 2021–22, 2023–24, 2025–26, 2027–28; ~35 trang Henle (mức 1–9 và ghi chú ABRSM); IMSLP (Couperin, Rameau, Chopin, Brahms, Grieg, Schumann); dữ liệu khóa src/data/(tac-pham, nha-soan-nhac, cap-do).yml. Tên và năm sinh–mất khớp 100% src/data/nha-soan-nhac.yml (không lệch). Phần "Đặc trưng khi chơi" xếp loại khuyen-tap/khong-can-nguon (mô tả và lời khuyên), dữ kiện cụ thể tách riêng. Đã sửa (da-sua): Grade của K. 380 (8 thành 7), Invention 1/4/8 (6 thành 4–5), Handel gavotte (2–3 thành 1–3), Clementi Op. 36 số 2 và 3 (4 thành 4–5), Schubert Moment musical số 3 (5 thành 6) và D. 935 số 2 (7 thành 8), Chopin Valse La thứ (3–4 thành 5–6) và Prélude số 7/4/20 (4–5 thành 3–5), Schumann Album (phần hai 4–6 thành 4–7; Marie thay cho ba con gái), Debussy Little Shepherd (6 thành 7) và Fille/Rêverie (6–7 thành 8, dời sau Clair de lune), Ravel Ma mère l''Oye (3–6 thành 2–6), Bartók For Children (1–4 thành 2–5). Đã bỏ (da-bo): "tròn 100 tuổi năm 2026" và "nay đã mười tập" của Kurtág; dòng Nguồn Grove. LỆCH dữ liệu khóa chưa sửa (người giao quyết): Valse Si thứ Op. 69 số 2 (trang 5–6, dữ liệu 7–8, Henle 4); Impromptu D. 899 số 3 (trang 7–8, dữ liệu Grade 8 trở lên); Op. 118 số 2 (trang 7–8, Henle ARSM). Chưa chắc (null): các số liệu danh mục và bắt đầu bằng của Couperin, Rameau, Scarlatti, Handel, C. P. E. Bach, Haydn (khoảng 60 sonata), Mozart, Liszt, Fauré, Scriabin, Rachmaninoff, Gershwin, Shostakovich, Ligeti, Kurtág, Pärt, Glass, Albéniz/Granados; Tchaikovsky Op. 37a so với Op. 37b/37bis (IMSLP, ABRSM). Thuật ngữ chưa có bản ghi: Empfindsamkeit, hemiola, Prellmechanik, bel canto, rubato, stride, acciaccatura, enharmonic, toccata, ordre. REVIEW D4-gom (nhóm D, 28/10/2026). Quy tắc mức độ: (1) chặng là hệ của site: bản có bài học trong src/data/tac-pham.yml ghi "(chặng N)" theo bản ghi đã khóa, kể cả chỗ lệch với trang cũ (Valse Si thứ Op. 69 số 2 chặng 6, Impromptu D. 899 số 3 chặng 7; Intermezzo Op. 118 số 2 là bản ghi nghe, không có chặng, nên không ghi mức); (2) "Grade N" chỉ giữ khi bản ấy (hay một chương, một bản trong tập) có trong đề cương thi ABRSM 2021–22, 2023–24 hay 2025–26: review mở ba PDF bằng công cụ đọc web và hỏi từng bản (kết quả khớp ghi chú lượt 1; chỗ không khớp thì bỏ, như Clementi Op. 36 số 3 không thấy ở 2021–22, chỉ ghi 2025–26); (3) mọi "≈ Grade", "sau Grade 8" ước lượng khác bị bỏ, không thay bằng mô tả mềm, trừ "trình độ hòa nhạc" ở cuối ba chuỗi (Mussorgsky, Scriabin, Ligeti) giữ như mô tả mềm; mức Henle không đưa lên trang. Hộp "Đọc mức độ thế nào" viết lại theo quy tắc ấy. Phần "Đặc trưng khi chơi": bỏ các điều lịch sử, phong cách không có nguồn (luth, guitar Tây Ban Nha, clavichord, bàn tay Scriabin, Rachmaninoff, thời lượng Bartók, Bach phức điệu ở Shostakovich, tâm huyết giáo dục của Kabalevsky, Clara thuộc lòng); điều có nguồn tách thành nhận định mới (n186 Promenade 5/4–6/4, n187 lời dặn trong Gnossienne, n188 Empfindsamkeit). Tchaikovsky Các mùa: chọn "Op. 37a" theo tên trang IMSLP (The Seasons, Op.37a); ABRSM ghi "Op. 37bis"; the-loai nên thống nhất "Op. 37a". Câu ve-site mới: n185 (chặng trong hộp mức độ), n189 (link bài học mới), n190 (các số chặng).'
