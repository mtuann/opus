  - cu: "Phần lớn nhạc phím thời này viết cho harpsichord hoặc clavichord, chưa có bàn đạp vang (xem Lịch sử cây đàn piano). Trên piano: rất ít bàn đạp, rõ từng bè, nốt hoa mỹ đúng phong cách (xem Nốt hoa mỹ)."
    moi: "Phần lớn nhạc phím thời này viết cho harpsichord, clavichord hay organ, chưa phải cho piano (xem Lịch sử cây đàn piano). Trên piano: rất ít bàn đạp, rõ từng bè, nốt hoa mỹ đúng phong cách (xem Nốt hoa mỹ)."
    ly_do: 'n7 (da-sua, review D4-gom): bỏ "chưa có bàn đạp vang" (không có nguồn mở); IMSLP ghi nhạc cụ harpsichord cho Couperin, Rameau, Handel; Essercizi per gravicembalo; trang bìa Goldberg ghi Clavicimbal.'
  - cu:
      - "Đặc trưng khi chơi: nhạc phím Pháp tinh tế. Gần như nốt dài nào cũng có nốt hoa mỹ (agrément), và chúng là một phần của giai điệu chứ không phải đồ trang sức thêm vào. Nhiều bản rải nốt so le giữa các bè, bắt chước đàn luth."
      - "Tác phẩm chính: bốn quyển Pièces de clavecin (1713–1730) gồm 27 ordre (tổ khúc) với những cái tên gợi hình; sách L'art de toucher le clavecin (1716) về ngón bấm, cách chạm phím và nốt hoa mỹ."
      - "Bắt đầu bằng: Les Bergeries (có trong Notebook for Anna Magdalena Bach, 1725; ≈ Grade 5) → Sœur Monique (≈ Grade 6–7) → Les Barricades mystérieuses (≈ Grade 7–8) → Le Tic-Toc-Choc, hai tay đan chồng lên nhau vì vốn viết cho hai tầng phím (sau Grade 8)."
