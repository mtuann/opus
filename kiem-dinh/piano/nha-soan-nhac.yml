doi_chu:
  - cu: "Bắt đầu bằng: K. 32 Rê thứ, Aria (≈ Grade 4) → K. 1 Rê thứ, K. 466 Fa thứ (≈ Grade 6–7) → K. 380 Mi trưởng (≈ Grade 8) → K. 141 Rê thứ với chuỗi nốt lặp rất nhanh (sau Grade 8)."
    moi: "Bắt đầu bằng: K. 32 Rê thứ, Aria (≈ Grade 4) → K. 1 Rê thứ, K. 466 Fa thứ (≈ Grade 6–7) → K. 380 Mi trưởng (≈ Grade 7) → K. 141 Rê thứ với chuỗi nốt lặp rất nhanh (sau Grade 8)."
    ly_do: 'n19 (da-sua): Câu cũ: "K. 380 Mi trưởng (≈ Grade 8)". ABRSM xếp K. 380 ở Grade 7 (2021–22, 2023–24, 2025–26); Henle HN 574: "Piano Grade 7".'
  - cu: "Bắt đầu bằng: Minuet Sol trưởng của Petzold trong Notebook (≈ Grade 1–2) → Little Preludes như BWV 939, BWV 999 (≈ Grade 3–5) → Prelude Đô trưởng BWV 846 (≈ Grade 4–5) → Invention số 1, số 4, số 8 (≈ Grade 6) → Sinfonia, các chương trong French Suites, Prelude và fugue Đô thứ BWV 847 (≈ Grade 7–8) → các prelude và fugue khác trong Bình quân luật, Partita (sau Grade 8) → Goldberg."
    moi: "Bắt đầu bằng: Minuet Sol trưởng của Petzold trong Notebook (≈ Grade 1–2) → Little Preludes như BWV 939, BWV 999 (≈ Grade 3–5) → Prelude Đô trưởng BWV 846 (≈ Grade 4–5) → Invention số 1, số 4, số 8 (≈ Grade 4–5) → Sinfonia, các chương trong French Suites, Prelude và fugue Đô thứ BWV 847 (≈ Grade 7–8) → các prelude và fugue khác trong Bình quân luật, Partita (sau Grade 8) → Goldberg."
    ly_do: 'n25 (da-sua): Câu cũ: "(≈ Grade 6)". tac-pham.yml (đã khóa): Invention số 1 chặng 4, Grade 4–5; Henle: mức 3, 3, 4; ABRSM: Invention 8 ở Grade 5.'
  - cu: "Bắt đầu bằng: các minuet, gavotte ngắn (≈ Grade 2–3) → Sarabande HWV 437 cùng hai biến tấu (≈ Grade 4–5) → các chương trong tổ khúc (≈ Grade 6–7) → trọn The Harmonious Blacksmith, Chaconne HWV 435 (≈ Grade 8 trở lên)."
    moi: "Bắt đầu bằng: các minuet, gavotte ngắn (≈ Grade 1–3) → Sarabande HWV 437 cùng hai biến tấu (≈ Grade 4–5) → các chương trong tổ khúc (≈ Grade 6–7) → trọn The Harmonious Blacksmith, Chaconne HWV 435 (≈ Grade 8 trở lên)."
    ly_do: 'n30 (da-sua): Câu cũ: "(≈ Grade 2–3)". ABRSM: Gavotte in C ở Grade 1 (nhiều đề cương), Gavotte in G HWV 491 ở Grade 3.'
  - cu: "Bắt đầu bằng: Sonatina Op. 36 số 1 (≈ Grade 3) → Op. 36 số 2 và 3 (≈ Grade 4) → số 4 đến 6 (≈ Grade 5–6) → các sonata lớn và Gradus (sau Grade 8)."
    moi: "Bắt đầu bằng: Sonatina Op. 36 số 1 (≈ Grade 3) → Op. 36 số 2 và 3 (≈ Grade 4–5) → số 4 đến 6 (≈ Grade 5–6) → các sonata lớn và Gradus (sau Grade 8)."
