nhan_dinh:
  - id: n1
    cau: Trang tóm tắt cảm giác khi chơi nhạc của hơn 30 nhà soạn nhạc piano.
    loai: so-lieu
    ket_qua: dung
    ghi_chu: 'Đếm các tiêu đề ###: 34 nhà soạn nhạc (Albéniz và Granados chung một mục) cộng ba người ở mục Hôm nay.'
  - id: n2
    cau: '"Sau Grade 8" là trình độ diploma trở lên; "≈ Grade 5" là ước lượng theo thang ABRSM.'
    loai: dinh-nghia
    nguon:
      - du-cd
    ket_qua: dung
    ghi_chu: 'cap-do.yml: chặng 7 "Sau Grade 8", tuong_duong "diploma trở lên"; ABRSM thi Grade 1–8 và các diploma (ARSM, LRSM, FRSM).'
  - id: n3
    cau: Các cột đặc trưng chung (tay nhỏ thấy Rachmaninoff khó hơn, người đọc nhạc chậm thấy Bach khó hơn) và Bach cần hai tay độc lập, Mozart cần sự trong suốt, Chopin giọng hát và bàn đạp, Bartók nhịp chính xác (câu mở đầu).
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời mô tả cảm giác khi chơi và lời khuyên tập. Điểm kiểm được (năm, số hiệu, tên bản, ngữ cảnh lịch sử) đã tách thành nhận định riêng.
  - id: n4
    cau: 'Bảng "Muốn chơi… thì bắt đầu với…", dòng Bach, Mozart, Beethoven, Chopin, Schumann, nhạc thế kỷ 20: các bản và số hiệu đều có thật (Minuet Sol trưởng, Little Preludes, Invention số 1, Sinfonia, French Suites; Clementi Op. 36 số 1, Mozart K. 545 và K. 283; Für Elise, hai sonata Op. 49, Pathétique, Op. 79; Valse La thứ, Prélude Mi thứ, Nocturne Op. 9 số 2, Ballade số 1; Album für die Jugend, Träumerei, Kinderszenen, Waldszenen; Mikrokosmos, Kabalevsky Op. 39, Prokofiev Music for Children, Romanian Folk Dances).'
    loai: danh-muc
    nguon:
      - h-nbk
      - h-prel
      - h-inv
      - h-invsin
      - ab2324
      - h-cle
      - h-moz
      - h-bag
      - h-op49
      - h-beet2
      - h-chp
      - h-chw
      - h-chn
      - h-chb
      - h-alb
      - h-kin
      - h-mik
      - h-rfd
      - ab2526
      - du-tp
    ket_qua: dung
    ghi_chu: 'Từng bản đã gặp trong Henle, đề cương ABRSM hay tac-pham.yml (Waldszenen Op. 82: ABRSM 2025–26 Grade 6; K. 283 trong Henle HN 3; Op. 79 Henle HN 1034; Prokofiev Op. 65 và Kabalevsky Op. 39: ABRSM). Chỉ kiểm sự tồn tại và số hiệu, không kiểm thứ tự độ khó (có nhận định riêng ở từng nhà soạn nhạc).'
  - id: n5
    cau: 'Bảng "Muốn chơi… thì bắt đầu với…", các dòng còn lại: Czerny Op. 299 và Op. 740, Chopin Op. 25 số 1 và số 2 và ba Nouvelles études (étude vừa phải), Liszt Nuages gris, Consolation số 3, Liebestraum số 3, Un sospiro, Brahms Valse Op. 39 số 15, Intermezzo Op. 117 số 1 và Op. 118 số 2, Debussy Menuet sur le nom d''Haydn, Ravel Pavane, Rachmaninoff Prelude Op. 3 số 2 và Op. 23 số 4, Satie, Pärt Für Alina, Glass Opening, Gershwin Prelude số 2, Kapustin.'
    loai: danh-muc
    nguon:
      - h-chb
      - h-b118
      - h-gym
    ket_qua: null
    ghi_chu: 'chưa chắc: chưa kiểm sự tồn tại của nhiều bản (Czerny Op. 299/740, Nuages gris, Un sospiro, Op. 117, Menuet sur le nom d''Haydn, Op. 23 số 4, Für Alina, Opening, Kapustin). Liebestraum, Op. 118 số 2, Gymnopédie, Prélude Mi thứ đã khớp (dòng trên).'
  - id: n6
    cau: 'Ba mục link ngoài dòng "Những người viết riêng cho người học": Carl Czerny (1791–1857, học trò của Beethoven, thầy của Liszt) với Op. 599, 299, 740; Burgmüller (1806–1874) Op. 100 (25 étude dễ); Stephen Heller (1813–1888) Op. 45–47; sonatina của Kuhlau và Diabelli.'
    loai: lich-su
    nguon:
      - du-nsn
      - h-cle
      - ab2122
    ket_qua: null
    ghi_chu: 'chưa chắc: năm sinh–mất của ba người khớp src/data/nha-soan-nhac.yml; Burgmüller Op. 100 gồm 25 étude (Henle HN 1726; ABRSM có Op. 100) và Heller Op. 45, Op. 47 có trong ABRSM 2021–22 (Study A minor Op. 45 số 2, E minor Op. 47 số 15). Czerny là học trò của Beethoven và thầy của Liszt, Op. 599 và Op. 740, sonatina Kuhlau/Diabelli: chưa có nguồn.'
  - id: n7
    cau: Phần lớn nhạc phím Baroque viết cho harpsichord hoặc clavichord, chưa có bàn đạp vang.
    loai: lich-su
    ket_qua: null
    ghi_chu: 'chưa chắc: chưa có nguồn mở (xem lich-su-dan n16).'
  - id: n8
    cau: 'Tên và năm sinh–mất ở các tiêu đề mục Baroque: François Couperin (1668–1733), Jean-Philippe Rameau (1683–1764), Domenico Scarlatti (1685–1757), J. S. Bach (1685–1750), G. F. Handel (1685–1759).'
    loai: nam
    nguon:
      - du-nsn
    ket_qua: dung
    ghi_chu: Khớp src/data/nha-soan-nhac.yml (couperin, rameau, scarlatti, bach, handel).
  - id: n9
    cau: 'Couperin: bốn quyển Pièces de clavecin (1713–1730) gồm 27 ordre; sách L''art de toucher le clavecin (1716).'
    loai: danh-muc
    nguon:
      - im-cp
    ket_qua: dung
    ghi_chu: 'IMSLP: Livre 1 (1713, 5 ordre), Livre 2 (1716–17, ordre VI–XII = 7), Livre 3 (1722, XIII–XIX = 7), Livre 4 (1730, XX–XXVII = 8): 27 ordre; L''art de toucher le clavecin 1716, phân loại Methods, For harpsichord.'
  - id: n10
    cau: L'art de toucher le clavecin là sách về ngón bấm, cách chạm phím và nốt hoa mỹ.
    loai: dinh-nghia
    nguon:
      - im-cp
    ket_qua: null
    ghi_chu: 'chưa chắc: IMSLP chỉ xếp vào Methods và cho thấy các prélude, allemande; không nêu các chủ đề này.'
  - id: n11
    cau: 'Couperin: gần như nốt dài nào cũng có nốt hoa mỹ; nhiều bản rải nốt so le giữa các bè, bắt chước đàn luth; (Đặc trưng khi chơi).'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời mô tả cảm giác khi chơi và lời khuyên tập. Điểm kiểm được (năm, số hiệu, tên bản, ngữ cảnh lịch sử) đã tách thành nhận định riêng.
  - id: n12
    cau: 'Couperin, Bắt đầu bằng: Les Bergeries (có trong Notebook for Anna Magdalena Bach, 1725; ≈ Grade 5) → Sœur Monique (≈ Grade 6–7) → Les Barricades mystérieuses (≈ Grade 7–8) → Le Tic-Toc-Choc, hai tay đan chồng vì vốn viết cho hai tầng phím (sau Grade 8).'
    loai: cap-do
    nguon:
      - im-cp
      - ab2526
      - h-nbk
    ket_qua: null
    ghi_chu: 'chưa chắc: IMSLP xác nhận Les Bergeries và Les Barricades mystérieuses ở Livre 2 ordre VI, Le Tic-Toc-Choc ở Livre 3 ordre XVIII; Sœur Monique không thấy ở trang Livre 2. Couperin không có trong ABRSM các đề cương đã mở và Henle không có (tìm kiếm bị chặn), nên chưa có mức Grade nào; "có trong Notebook 1725" chưa thấy ở danh sách Henle HN 349.'
  - id: n13
    cau: 'Rameau: ba tập nhạc cho harpsichord (1706, 1724, khoảng 1726–1727) với Le Rappel des oiseaux, Tambourin, Les Sauvages, La Poule, Gavotte et six doubles; Hình ảnh cụ thể: tiếng chim, con gà mái cục tác (La Poule).'
    loai: danh-muc
    nguon:
      - im-ra
    ket_qua: null
    ghi_chu: 'chưa chắc: IMSLP xác nhận 1724 (Pièces de clavecin avec une méthode; Le Rappel des oiseaux, Tambourin, Les Sauvages) và 1727 (Nouvelles suites; Le Rappel, Tambourin, Les Sauvages, La Poule, Gavotte et six doubles, Les cyclopes); trang Premier livre (1706) không mở được.'
  - id: n14
    cau: 'Rameau: khỏe và phô diễn hơn Couperin: vắt tay, nốt lặp, nhảy quãng rộng, hợp âm rải nhanh, nhịp nhảy múa; cần ngón chắc, tiếng gọn.'
