doi_chu:
  - cu: '"≈ Grade 5" là ước lượng theo thang ABRSM; "sau Grade 8" là trình độ diploma trở lên. Tay nhỏ sẽ thấy Rachmaninoff khó hơn, người đọc nhạc chậm sẽ thấy Bach khó hơn. Đối chiếu với Lộ trình và Tác phẩm theo cấp độ.'
    moi: Mỗi dòng "Bắt đầu bằng" đi từ bản dễ đến bản khó. "Chặng 4" là chặng của bài học tác phẩm trên site, theo Lộ trình. "Grade 5" nghĩa là bản ấy (hay một chương, một bản trong tập) có trong đề cương thi piano của ABRSM ở Grade 5, các kỳ 2021–2022 đến 2025–2026; "Initial Grade" là cấp trước Grade 1. Bản không ghi gì là chưa có nguồn xếp cấp. Tay nhỏ sẽ thấy Rachmaninoff khó hơn, người đọc nhạc chậm sẽ thấy Bach khó hơn. Xem thêm Tác phẩm theo cấp độ.
    ly_do: 'n2, n185 (da-sua, review D4-gom): bỏ thang ước lượng "≈ Grade"; Grade chỉ ghi khi bản ấy có trong đề cương ABRSM 2021–2022, 2023–2024, 2025–2026 (review đã mở và hỏi từng bản), bài học của site ghi chặng theo src/data/tac-pham.yml.'
