doi_chu:
  - cu: "Bắt đầu bằng: K. 32 Rê thứ, Aria (≈ Grade 4) → K. 1 Rê thứ, K. 466 Fa thứ (≈ Grade 6–7) → K. 380 Mi trưởng (≈ Grade 8) → K. 141 Rê thứ với chuỗi nốt lặp rất nhanh (sau Grade 8)."
    moi: "Bắt đầu bằng: K. 32 Rê thứ, Aria (≈ Grade 4) → K. 1 Rê thứ, K. 466 Fa thứ (≈ Grade 6–7) → K. 380 Mi trưởng (≈ Grade 7) → K. 141 Rê thứ với chuỗi nốt lặp rất nhanh (sau Grade 8)."
    ly_do: 'n19 (da-sua): Câu cũ: "K. 380 Mi trưởng (≈ Grade 8)". ABRSM xếp K. 380 ở Grade 7 (2021–22, 2023–24, 2025–26); Henle HN 574: "Piano Grade 7".'
  - cu: "Bắt đầu bằng: Minuet Sol trưởng của Petzold trong Notebook (≈ Grade 1–2) → Little Preludes như BWV 939, BWV 999 (≈ Grade 3–5) → Prelude Đô trưởng BWV 846 (≈ Grade 4–5) → Invention số 1, số 4, số 8 (≈ Grade 6) → Sinfonia, các chương trong French Suites, Prelude và fugue Đô thứ BWV 847 (≈ Grade 7–8) → các prelude và fugue khác trong Bình quân luật, Partita (sau Grade 8) → Goldberg."
    moi: "Bắt đầu bằng: Minuet Sol trưởng của Petzold trong Notebook (≈ Grade 1–2) → Little Preludes như BWV 939, BWV 999 (≈ Grade 3–5) → Prelude Đô trưởng BWV 846 (≈ Grade 4–5) → Invention số 1, số 4, số 8 (≈ Grade 4–5) → Sinfonia, các chương trong French Suites, Prelude và fugue Đô thứ BWV 847 (≈ Grade 7–8) → các prelude và fugue khác trong Bình quân luật, Partita (sau Grade 8) → Goldberg."
    ly_do: 'n25 (da-sua): Câu cũ: "(≈ Grade 6)". tac-pham.yml (đã khóa): Invention số 1 chặng 4, Grade 4–5; Henle: mức 3, 3, 4; ABRSM: Invention 8 ở Grade 5.'
  - cu: "Bắt đầu bằng: các minuet, gavotte ngắn (≈ Grade 2–3) → Sarabande HWV 437 cùng hai biến tấu (≈ Grade 4–5) → các chương trong tổ khúc (≈ Grade 6–7) → trọn The Harmonious Blacksmith, Chaconne HWV 435 (≈ Grade 8 trở lên)."
    moi: "Bắt đầu bằng: các minuet, gavotte ngắn (≈ Grade 1–3) → Sarabande HWV 437 cùng hai biến tấu (≈ Grade 4–5) → các chương trong tổ khúc (≈ Grade 6–7) → trọn The Harmonious Blacksmith, Chaconne HWV 435 (≈ Grade 8 trở lên)."
    ly_do: 'n30 (da-sua): Câu cũ: "(≈ Grade 2–3)". ABRSM: Gavotte in C ở Grade 1 (nhiều đề cương), Gavotte in G HWV 491 ở Grade 3.'
  - cu: "Bắt đầu bằng: Sonatina Op. 36 số 1 (≈ Grade 3) → Op. 36 số 2 và 3 (≈ Grade 4) → số 4 đến 6 (≈ Grade 5–6) → các sonata lớn và Gradus (sau Grade 8)."
    moi: "Bắt đầu bằng: Sonatina Op. 36 số 1 (≈ Grade 3) → Op. 36 số 2 và 3 (≈ Grade 4–5) → số 4 đến 6 (≈ Grade 5–6) → các sonata lớn và Gradus (sau Grade 8)."
    ly_do: 'n49 (da-sua): Câu cũ: "(≈ Grade 4)". ABRSM xếp Sonatina Op. 36 số 3 ở Grade 5; số 2 không nằm trong đề cương (Henle mức 3).'
  - cu: "Bắt đầu bằng: ländler, valse, écossaise (≈ Grade 2–4) → Moment musical số 3 Fa thứ (≈ Grade 5) → Impromptu La♭ trưởng D. 935 số 2 (≈ Grade 7) → Impromptu Sol♭ trưởng D. 899 số 3 (≈ Grade 7–8; hướng dẫn nghe) → Impromptu D. 899 số 2 và 4 (≈ Grade 8 trở lên) → Sonata La trưởng D. 664 → ba sonata cuối."
    moi: "Bắt đầu bằng: ländler, valse, écossaise (≈ Grade 2–4) → Moment musical số 3 Fa thứ (≈ Grade 6) → Impromptu La♭ trưởng D. 935 số 2 (≈ Grade 8) → Impromptu Sol♭ trưởng D. 899 số 3 (≈ Grade 7–8; hướng dẫn nghe) → Impromptu D. 899 số 2 và 4 (≈ Grade 8 trở lên) → Sonata La trưởng D. 664 → ba sonata cuối."
    ly_do: 'n64 (da-sua): Câu cũ: "(≈ Grade 5)". ABRSM 2025–26: Moment musical Fa thứ số 3 ở Grade 6; Henle HN 4: "Piano Grade 6".; n65 (da-sua): Câu cũ: "(≈ Grade 7)". ABRSM: D. 935 số 2 ở Grade 8; Henle: "Piano Grade 8 recommended".'
  - cu: "Bắt đầu bằng: Valse La thứ (di cảo) (≈ Grade 3–4) → Prélude số 7 La trưởng, số 4 Mi thứ, số 20 Đô thứ (≈ Grade 4–5) → các mazurka dễ, Valse Si thứ Op. 69 số 2 (≈ Grade 5–6) → Nocturne Đô♯ thứ (di cảo), Nocturne Mi thứ Op. 72 số 1 (≈ Grade 6) → Nocturne Op. 9 số 2, Valse Op. 64 số 2 (≈ Grade 7–8) → Fantaisie-Impromptu, các polonaise → Ballade số 1, scherzo, étude."
    moi: "Bắt đầu bằng: Valse La thứ (di cảo) (≈ Grade 5–6) → Prélude số 7 La trưởng, số 4 Mi thứ, số 20 Đô thứ (≈ Grade 3–5) → các mazurka dễ, Valse Si thứ Op. 69 số 2 (≈ Grade 5–6) → Nocturne Đô♯ thứ (di cảo), Nocturne Mi thứ Op. 72 số 1 (≈ Grade 6) → Nocturne Op. 9 số 2, Valse Op. 64 số 2 (≈ Grade 7–8) → Fantaisie-Impromptu, các polonaise → Ballade số 1, scherzo, étude."
    ly_do: 'n77 (da-sua): Câu cũ: "(≈ Grade 3–4)". tac-pham.yml (đã khóa): chopin-valse-la-thu chặng 5, Grade 5–6; ABRSM: Waltz La thứ KK IVb/11 ở Grade 6.; n78 (da-sua): Câu cũ: "(≈ Grade 4–5)". tac-pham.yml: Prélude số 7 Grade 3–4 và số 4 Grade 5; Henle: số 20 cùng mức 4 với hai bản kia.'
  - cu:
      - "Tác phẩm chính: Album für die Jugend Op. 68 (1848, 43 bản viết cho ba con gái), Kinderszenen Op. 15, Papillons, Carnaval, Kreisleriana, Fantasie Op. 17, Arabeske, Waldszenen, Concerto La thứ."
      - "Bắt đầu bằng: Album für die Jugend, phần đầu dành cho trẻ nhỏ: Melodie, Soldatenmarsch, Wilder Reiter (≈ Grade 1–3) → phần hai, từ số 19 trở đi (≈ Grade 4–6) → Kinderszenen, Träumerei (≈ Grade 5–7) → Waldszenen, Arabeske (≈ Grade 8) → Papillons, Carnaval, Kreisleriana (sau Grade 8)."
    moi:
      - "Tác phẩm chính: Album für die Jugend Op. 68 (1848, 43 bản; khởi đầu là album sinh nhật cho con gái Marie), Kinderszenen Op. 15, Papillons, Carnaval, Kreisleriana, Fantasie Op. 17, Arabeske, Waldszenen, Concerto La thứ."
      - "Bắt đầu bằng: Album für die Jugend, phần đầu dành cho trẻ nhỏ: Melodie, Soldatenmarsch, Wilder Reiter (≈ Grade 1–3) → phần hai, từ số 19 trở đi (≈ Grade 4–7) → Kinderszenen, Träumerei (≈ Grade 5–7) → Waldszenen, Arabeske (≈ Grade 8) → Papillons, Carnaval, Kreisleriana (sau Grade 8)."
    ly_do: 'n83 (da-sua): Câu cũ: "43 bản viết cho ba con gái". Henle HN 45: ban đầu là album sinh nhật cho con gái Marie; IMSLP không nêu người được tặng. Sửa theo Henle.; n87 (da-sua): Câu cũ: "(≈ Grade 4–6)". ABRSM 2025–26: Album für die Jugend số 30 ở Grade 7 (mục B); Henle: các bản từ số 19 mức 4–5.'
  - cu: "Bắt đầu bằng: The Little Shepherd trong Children's Corner (≈ Grade 6) → Arabesque số 1, La fille aux cheveux de lin, Rêverie (≈ Grade 6–7) → Clair de lune (≈ Grade 7–8) → Golliwogg's Cakewalk, Doctor Gradus ad Parnassum, bản nhại các bài tập của Clementi (≈ Grade 8) → các prelude khác, Estampes, Images → Études."
    moi: "Bắt đầu bằng: The Little Shepherd trong Children's Corner (≈ Grade 7) → Arabesque số 1 → Clair de lune (≈ Grade 7–8) → La fille aux cheveux de lin, Rêverie (≈ Grade 8) → Golliwogg's Cakewalk, Doctor Gradus ad Parnassum, bản nhại các bài tập của Clementi (≈ Grade 8) → các prelude khác, Estampes, Images → Études."
    ly_do: 'n122 (da-sua): Câu cũ: "The Little Shepherd (≈ Grade 6) → Arabesque số 1, La fille aux cheveux de lin, Rêverie (≈ Grade 6–7) → Clair de lune". ABRSM xếp The Little Shepherd ở Grade 7 (Henle cũng ghi). La fille và Rêverie chuyển xuống sau Clair de lune với Grade 8 (nhận định kế tiếp).; n123 (da-sua): Câu cũ: La fille aux cheveux de lin và Rêverie "(≈ Grade 6–7)" đứng trước Clair de lune. ABRSM xếp cả hai ở Grade 8 nên chuyển xuống sau Clair de lune (Grade 7–8).'
  - cu: "Bắt đầu bằng: Ma mère l'Oye, chơi bốn tay (≈ Grade 3–6 tùy bè và tùy bài) → Menuet sur le nom d'Haydn (1909), Prélude La thứ (1913) (≈ Grade 6–7) → Pavane (≈ Grade 8) → Sonatine, Menuet và Forlane trong Le tombeau de Couperin (sau Grade 8) → Jeux d'eau, Miroirs → Gaspard de la nuit."
    moi: "Bắt đầu bằng: Ma mère l'Oye, chơi bốn tay (≈ Grade 2–6 tùy bè và tùy bài) → Menuet sur le nom d'Haydn (1909), Prélude La thứ (1913) (≈ Grade 6–7) → Pavane (≈ Grade 8) → Sonatine, Menuet và Forlane trong Le tombeau de Couperin (sau Grade 8) → Jeux d'eau, Miroirs → Gaspard de la nuit."
    ly_do: 'n142 (da-sua): Câu cũ: "(≈ Grade 3–6)". ABRSM xếp số 1 (Pavane de la belle au bois dormant) ở Grade 2, dưới mức thấp nhất của trang; cận trên 6 chưa kiểm.'
  - cu: "Bắt đầu bằng: Mikrokosmos tập 1–2 (ngay từ những tháng đầu) → For Children (≈ Grade 1–4) → Mikrokosmos tập 3–4 (≈ Grade 3–6) → Romanian Folk Dances, Sonatina (≈ Grade 6–7) → Allegro barbaro, Suite Op. 14 (sau Grade 8) → Out of Doors, Sonata."
    moi: "Bắt đầu bằng: Mikrokosmos tập 1–2 (ngay từ những tháng đầu) → For Children (≈ Grade 2–5) → Mikrokosmos tập 3–4 (≈ Grade 3–6) → Romanian Folk Dances, Sonatina (≈ Grade 6–7) → Allegro barbaro, Suite Op. 14 (sau Grade 8) → Out of Doors, Sonata."
    ly_do: 'n147 (da-sua): Câu cũ: "(≈ Grade 1–4)". ABRSM không có bài For Children ở Grade 1; ghi từ Grade 2 (Sorrow) đến Grade 5 (Winter Solstice Song).'
  - cu: "György Kurtág (sinh 1926, tròn 100 tuổi năm 2026): bộ Játékok (Trò chơi), viết từ năm 1973, nay đã mười tập. Ý tưởng đến từ những đứa trẻ coi cây đàn như món đồ chơi; Kurtág nói đây không phải giáo trình mà là chỗ để thử nghiệm: những bản rất ngắn với chùm nốt bấm bằng cả lòng bàn tay, những cú lướt khắp bàn phím, những khoảng lặng. Chơi được từ những tuần đầu, và bản nào cũng dạy bạn nghe từng âm thanh."
    moi: "György Kurtág (sinh 1926): bộ Játékok (Trò chơi), viết từ năm 1973. Ý tưởng đến từ những đứa trẻ coi cây đàn như món đồ chơi; Kurtág nói đây không phải giáo trình mà là chỗ để thử nghiệm: những bản rất ngắn với chùm nốt bấm bằng cả lòng bàn tay, những cú lướt khắp bàn phím, những khoảng lặng. Chơi được từ những tuần đầu, và bản nào cũng dạy bạn nghe từng âm thanh."
    ly_do: 'n165 (da-bo): Câu cũ: "(sinh 1926, tròn 100 tuổi năm 2026)". Theo ghi chú d2-bang-tang, câu phụ thuộc năm viết; bỏ phần "tròn 100 tuổi năm 2026", giữ "sinh 1926" (khớp nha-soan-nhac.yml).; n166 (da-bo): Câu cũ: "viết từ năm 1973, nay đã mười tập". Số tập thay đổi theo thời gian, nguồn chưa mở được; bỏ "nay đã mười tập" (người giao yêu cầu bỏ hay ghi năm; chọn bỏ).'
