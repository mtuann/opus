    cau: 'Couperin, Bắt đầu bằng: Les Bergeries (có trong Notebook for Anna Magdalena Bach, 1725) → Sœur Monique → Les Barricades mystérieuses → Le Tic-Toc-Choc, hai tay đan chồng lên nhau.'
    loai: cap-do
    nguon:
      - im-cp
      - ab2526
      - h-nbk
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: IMSLP xác nhận Les Bergeries và Les Barricades mystérieuses ở Livre 2 ordre VI, Le Tic-Toc-Choc ở Livre 3 ordre XVIII; Sœur Monique không thấy ở trang Livre 2. Couperin không có trong ABRSM các đề cương đã mở và Henle không có (tìm kiếm bị chặn), nên chưa có mức Grade nào; "có trong Notebook 1725" chưa thấy ở danh sách Henle HN 349. Review D4-gom: quy tắc mức độ của review D4-gom (ghi_chu cuối hồ sơ): bỏ mọi Grade (Couperin không có trong đề cương ABRSM đã mở) và lý do "vốn viết cho hai tầng phím" (không có nguồn mở). Les Bergeries là BWV Anh. 183 trong Notebook 1725 (lượt 2, IMSLP). Thứ tự dễ đến khó là lời khuyên.'
