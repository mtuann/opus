  - cu: "Đặc trưng khi chơi: ít nốt, chậm, lặp lại: tay trái một nốt trầm rồi một hợp âm, tay phải một giai điệu mảnh. Không khó về ngón, nhưng khó giữ tiếng đều, nhịp tĩnh và không làm điệu. Các Gnossienne viết không có vạch nhịp, kèm những lời dặn kỳ quặc thay cho thuật ngữ tốc độ."
