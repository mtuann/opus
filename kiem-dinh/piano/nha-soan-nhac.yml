ghi_chu: 'Lượt 1 trang Nhà soạn nhạc cho piano (lô D4-L3, phần B). Nguồn đã mở: đề cương ABRSM 2021–22, 2023–24, 2025–26, 2027–28; ~35 trang Henle (mức 1–9 và ghi chú ABRSM); IMSLP (Couperin, Rameau, Chopin, Brahms, Grieg, Schumann); dữ liệu khóa src/data/(tac-pham, nha-soan-nhac, cap-do).yml. Tên và năm sinh–mất khớp 100% src/data/nha-soan-nhac.yml (không lệch). Phần "Đặc trưng khi chơi" xếp loại khuyen-tap/khong-can-nguon (mô tả và lời khuyên), dữ kiện cụ thể tách riêng. Đã sửa (da-sua): Grade của K. 380 (8 thành 7), Invention 1/4/8 (6 thành 4–5), Handel gavotte (2–3 thành 1–3), Clementi Op. 36 số 2 và 3 (4 thành 4–5), Schubert Moment musical số 3 (5 thành 6) và D. 935 số 2 (7 thành 8), Chopin Valse La thứ (3–4 thành 5–6) và Prélude số 7/4/20 (4–5 thành 3–5), Schumann Album (phần hai 4–6 thành 4–7; Marie thay cho ba con gái), Debussy Little Shepherd (6 thành 7) và Fille/Rêverie (6–7 thành 8, dời sau Clair de lune), Ravel Ma mère l''Oye (3–6 thành 2–6), Bartók For Children (1–4 thành 2–5). Đã bỏ (da-bo): "tròn 100 tuổi năm 2026" và "nay đã mười tập" của Kurtág; dòng Nguồn Grove. LỆCH dữ liệu khóa chưa sửa (người giao quyết): Valse Si thứ Op. 69 số 2 (trang 5–6, dữ liệu 7–8, Henle 4); Impromptu D. 899 số 3 (trang 7–8, dữ liệu Grade 8 trở lên); Op. 118 số 2 (trang 7–8, Henle ARSM). Chưa chắc (null): các số liệu danh mục và bắt đầu bằng của Couperin, Rameau, Scarlatti, Handel, C. P. E. Bach, Haydn (khoảng 60 sonata), Mozart, Liszt, Fauré, Scriabin, Rachmaninoff, Gershwin, Shostakovich, Ligeti, Kurtág, Pärt, Glass, Albéniz/Granados; Tchaikovsky Op. 37a so với Op. 37b/37bis (IMSLP, ABRSM). Thuật ngữ chưa có bản ghi: Empfindsamkeit, hemiola, Prellmechanik, bel canto, rubato, stride, acciaccatura, enharmonic, toccata, ordre.'
