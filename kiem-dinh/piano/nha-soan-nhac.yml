  - cu: "Đặc trưng khi chơi: phức điệu. Mỗi tay thường giữ hai bè, bè nào cũng phải hát. Bản gốc gần như không ghi sắc thái hay dấu luyến, nên bạn tự chọn cách phát âm cho chủ đề và giữ nhất quán mỗi lần nó trở lại. Ghi ngón từ đầu, tập từng bè, ghép hai bè trong một tay rồi mới ghép hai tay."
