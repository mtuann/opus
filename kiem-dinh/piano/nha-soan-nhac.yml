  - cu:
      - 'Đặc trưng khi chơi: phong cách "nhạy cảm" (Empfindsamkeit): tâm trạng đổi đột ngột, dấu lặng bất ngờ, hòa âm rẽ ngang. Ông yêu clavichord, nơi ngón tay điều khiển được những sắc thái rất nhỏ. Hãy chơi như đang nói: có ngập ngừng, có nhấn giọng.'
      - 'Tác phẩm chính: sách Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về nghệ thuật chơi đàn phím đích thực, 1753 và 1762), các sonata "Phổ" và "Württemberg", sáu tập Für Kenner und Liebhaber, Solfeggietto Đô thứ.'
      - "Bắt đầu bằng: các hành khúc và polonaise BWV Anh. 122–125 trong Notebook for Anna Magdalena Bach, thường được cho là của ông (≈ Grade 1–3) → Solfeggietto (≈ Grade 5–6) → sonata và rondo trong Für Kenner und Liebhaber (≈ Grade 7–8) → các fantasia tự do (sau Grade 8)."
