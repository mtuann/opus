nhan_dinh:
  - id: n1
    cau: "Nhiều người mới học piano có lúc nghĩ: cho hai tay làm hai việc khác nhau là không thể. Đó là một kỹ năng, và như mọi kỹ năng, nó có cách tập."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ: "Gần như ai mới học piano cũng có lúc nghĩ". "Gần như ai" là khái quát không kiểm được; đổi thành "Nhiều người" (cả mô tả của trang). Phần còn lại là lời mở đầu, không trái trang nào.'
  - id: n2
    cau: "Trang đưa ra một quy trình sáu bậc, sáu kiểu phối hợp hay gặp kèm bài tập, rồi đến đa tiết tấu: hai chọi ba và ba chọi bốn."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: mục "Sáu bậc ghép hai tay" (6 mục đánh số), "Sáu kiểu phối hợp" (6 tiêu đề ### đánh số 1–6, mỗi kiểu một khối abc), "Hai chọi ba", "Ba chọi bốn".'
  - id: n3
    cau: Hai tay của chúng ta có xu hướng bắt chước nhau. Chuyển động đối xứng gương, khi hai tay dùng các ngón tương ứng cùng lúc, là dễ và ổn định nhất.
    loai: quy-tac
    nguon:
      - hkb
      - fau-surf23
      - fau-biophys
    ket_qua: dung
    ghi_chu: 'HKB (Springer, tóm tắt): "a symmetrical, in-phase mode involving simultaneous activation of homologous muscle groups"; nhóm Kelso (FAU, biophys2000 tr. 85): "Beyond this frequency only the inphase state is stable"; SURF23: "the more stable in-phase pattern". Nguồn nói "ổn định hơn", không có chữ "dễ nhất": chữ "dễ" là cách nói của người dạy. Giữ nguyên, vì khớp nam-ngon (chuyển động ngược chiều là cách dễ nhất để bắt đầu).'
  - id: n4
    cau: Mô hình Haken–Kelso–Bunz (1985).
    loai: ten
    nguon:
      - hkb
    ket_qua: dung
    ghi_chu: Haken, H., Kelso, J.A.S., Bunz, H. (1985), Biological Cybernetics 51(5), 347–356, DOI 10.1007/BF00336922 (trang Springer).
  - id: n5
    cau: Các thí nghiệm kinh điển của nhà khoa học vận động J. A. Scott Kelso, và mô hình Haken–Kelso–Bunz rút ra từ đó, cho thấy khi tăng tốc, hai tay đang chuyển động lệch nhau có xu hướng tự "trượt" về đối xứng.
    loai: quy-tac
    nguon:
      - hkb
      - fau-biophys
      - fau-surf23
      - fau-kelso
    ket_qua: dung
    ghi_chu: 'HKB (Springer): "the originally prepared out-of-phase, antisymmetric mode is replaced by a symmetrical, in-phase mode" khi tăng tần số; mô hình "reproduces ... the dramatic change in coordinative pattern observed between the hands" trong thí nghiệm của Kelso (Kelso 1984, Am. J. Physiol. 246(6), R1000–R1004, qua SURF23). Kelso: FAU mô tả lĩnh vực coordination dynamics, nghiên cứu điều khiển và phát triển vận động, nên "nhà khoa học vận động" chấp nhận được.'
  - id: n6
    cau: 'Vì thế chơi ngược chiều với cùng số ngón dễ hơn chơi song song, và một tay hay bị tay kia "kéo theo": nhả nốt cùng lúc, nhấn cùng lúc, staccato cùng lúc.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Nhận xét sư phạm suy từ n3: ngược chiều từ hai ngón cái dùng cùng số ngón (cơ tương ứng, mẫu đối xứng), còn song song là cùng hướng (không đối xứng). Khớp nam-ngon (ngược chiều là cách dễ nhất để bắt đầu hai tay) và bảng lỗi cùng trang ("Lây" phát âm). Không có nghiên cứu piano trực tiếp: giữ ở mức lời khuyên.'
  - id: n7
    cau: Cái khó thứ hai là sự chú ý. Khi chưa quen, rất khó theo dõi từng nốt của hai dòng nhạc khác nhau cùng một lúc. Lối ra không phải là cố chú ý nhiều hơn, mà là làm cho một phần việc (thường là phần đệm) trở thành tự động; khi ấy tai nghe hai tay như một hình tiết tấu chung, rồi như hai giọng.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "Không ai chủ động điều khiển được từng nốt của hai dòng nhạc khác nhau cùng một lúc. Người chơi giỏi cũng không làm vậy: một phần việc ... đã trở thành tự động". "Không ai" và mô tả người chơi giỏi là khẳng định quá rộng, không có nguồn; viết lại thành mô tả cách tập (lời khuyên). Không trái bậc 1 và 5 của trang.'
  - id: n8
    cau: Tin tốt là cả hai cái khó đều giảm dần khi tập đúng cách. Những buổi đầu ghép tay một bài mới thường vụng về; sau vài ngày tập đúng cách, hai tay dần "tự nhiên khớp".
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "giảm rất nhanh"; "luôn vụng về; sau vài ngày, phần lớn mọi người thấy hai tay tự nhiên khớp". "Rất nhanh", "luôn", "phần lớn mọi người" không có nguồn; viết lại cho vừa với điều kiểm được (lời động viên, không số liệu).'
  - id: n9
    cau: 'Mục "Sáu bậc ghép hai tay" có sáu bậc đánh số; bậc 4 là "Điểm neo"; neo của mục là #sau-bac-ghep-hai-tay.'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Lô trước yêu cầu giữ (kiem-dinh/piano/10-bai-dau-tien.yml n19 và n18; nhac-ly/10 và 11 không liên quan). Đã kiểm: src/content/docs/piano/hai-tay.md có "## Sáu bậc ghép hai tay", mục 4 là "**Điểm neo.**"; dist/piano/hai-tay/index.html có id="sau-bac-ghep-hai-tay"; link ở 10-bai-dau-tien trỏ đúng neo này. KHỚP.'
  - id: n10
    cau: "Bậc 1: Tay riêng cho đến khi tự động. Đúng nốt, đúng ngón, đúng phát âm và sắc thái. Phép thử: bạn chơi được tay đó trong khi đếm to, hoặc trong khi nhìn đi chỗ khác. Tập tay riêng ở đúng tốc độ chậm mà bạn sẽ dùng khi ghép, không phải ở tốc độ nhanh nhất mình đạt được."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập. Chang (II.7, II.13) khuyên tập tay riêng lên nhanh hơn tốc độ cuối: khác trường phái, nhưng trang này khớp cách dạy chậm của Bernstein/Fitch; không trái trang lõi nào của site (piano/cach-tap bước "Ghép hai tay, chậm hơn nữa").'
  - id: n11
    cau: "Bậc 2: Hai tay thật chậm. Thường chỉ bằng khoảng một nửa tốc độ tay riêng. Đếm to, bật máy đếm nhịp. Nếu phải dừng giữa chừng, tốc độ vẫn còn quá nhanh."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập; khớp ../opus-zero/docs/piano/cach-tap.md bước 6 ("Tốc độ ghép tay thường chỉ bằng khoảng một nửa tốc độ tay riêng").
  - id: n12
    cau: Bậc 2 trỏ tới trang Cách tập (/opus/piano/cach-tap/) cho điều "hai tay chỉ bằng khoảng một nửa tốc độ tay riêng" và tới Máy đếm nhịp (/opus/luyen-tap/metronome/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Chưa chuyển cả hai: ../opus-zero/docs/piano/cach-tap.md (dòng 24: "6. Ghép hai tay, chậm hơn nữa. Tốc độ ghép tay thường chỉ bằng khoảng một nửa tốc độ tay riêng", có "Ví dụ một thang máy đếm nhịp"); ../opus-zero/docs/luyen-tap/metronome.md ("# Máy đếm nhịp"; "Khi đã làm đúng 3 lần liên tiếp, tăng 2–4 BPM"). Lô chuyển giữ đúng hai điều ấy (và mục "Ví dụ một thang máy đếm nhịp" của cach-tap, được bảng Lỗi thường gặp nhắc).'
  - id: n13
    cau: "Bậc 3: Ghép từng khúc. Một phách, rồi hai phách, một ô, một câu. Mỗi khúc dừng ở nốt đầu của phách sau, để mối nối cũng được tập."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n14
    cau: "Bậc 4: Điểm neo. Khoanh bằng bút chì những chỗ hai tay đánh cùng lúc. Chơi từ điểm neo này tới điểm neo kia: đầu óc nhắm tới điểm neo, các nốt ở giữa tự đi. Khi hai tay đan xen mà không có điểm chung, hãy hát hình tiết tấu chung của cả hai tay."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập; "điểm neo" là cách gọi của site (khớp piano/cach-tap cũ: "Coi mỗi phách hai tay cùng đánh là một điểm neo" và 10-bai-dau-tien n18). Thuật ngữ này chưa có bản ghi thuat-ngu.yml.'
  - id: n15
    cau: Ở chủ đề của Für Elise, dòng móc kép chuyền từ tay trái sang tay phải.
    loai: cau-truc
    nguon:
      - mutopia-elise
    ket_qua: dung
    ghi_chu: "Mutopia (3/8): ô thứ ba của chủ đề, tay trái A,16 e a (ba móc kép đầu ô) rồi tay phải c' e' a' (ba móc kép cuối ô): dòng móc kép A–E–A–C–E–A chuyền từ tay trái sang tay phải. Phần giai điệu A (móc đơn) ở tay phải ngân song song là chuyện khác."
  - id: n16
    cau: Bậc 4 trỏ tới trang Für Elise (/opus/piano/tac-pham/fur-elise/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: src/content/docs/piano/tac-pham/fur-elise.md đã có.
  - id: n17
    cau: "Bậc 5: Một tay tự động, chú ý vào tay kia, rồi đổi. Chơi hai tay nhưng chỉ lắng nghe tay trái; lượt sau chỉ nghe tay phải; lượt sau nữa nghe cả hai. Biến thể: chơi một tay, tay kia gõ tiết tấu của nó lên đùi; hoặc chơi tay trái và hát giai điệu tay phải."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n18
    cau: "Bậc 6: Lên tốc độ từng nấc nhỏ, như với một đoạn chạy nốt bình thường."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập; khớp luyen-tap/metronome cũ (tăng 2–4 BPM mỗi nấc).
  - id: n19
    cau: "Khi vấp mãi ở cùng một chỗ: thường là một tay chưa thật sự tự động. Chơi riêng tay đó, đúng chỗ đó, trong khi đếm to. Nếu bạn ngập ngừng, hãy quay lại bậc 1 cho riêng ô nhịp ấy, đừng tập lại cả bài."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập (hộp tip); khớp bảng Lỗi thường gặp cùng trang.
  - id: n20
    cau: Các bài tập (bài 1–10) soạn cho trang này; ba kiểu đầu nối tiếp các bài tập cùng loại ở Vị trí năm ngón, khó hơn một bậc.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'src/content/docs/piano/nam-ngon.md có "Một tay giữ, một tay đi" (bài 3), "Song song" và "Ngược chiều" (bài 1, 2), "Legato một tay, staccato tay kia" (bài 4): đúng ba loại ở ba kiểu đầu của trang này (1 giữ/đi, 2 song song/ngược chiều, 3 legato/staccato); mỗi bài ở đây thêm một chiều (gam, nhịp, nhớ ngón). Khớp. "Soạn cho trang này": các khối là bản soạn của site, không trích tác phẩm.'
  - id: n21
