    ket_qua: dung
    ghi_chu: "Bài 10: 2/4, L:1/16, Q:1/4=40; tay phải 4 móc kép mỗi phách (c d e f g f e d), tay trái 3 móc đơn liên ba mỗi phách (C, E, G,): ba chọi bốn, đủ 8/16 mỗi ô. Ngón tay phải 1-2-3-4-5-4-3-2, tay trái 5-3-1. Đúng."
ghi_chu: 'Phối hợp hai tay và đa tiết tấu (piano/hai-tay, lõi). Nguồn chính: Haken–Kelso–Bunz và nhóm Kelso (FAU) cho phần khoa học; Mutopia (Für Elise, K 545, Fantaisie-Impromptu, Arabesque 1, Clair de lune) cho trích tác phẩm; COD, OMT, Hook (MTO), Evansville cho định nghĩa, ngón bấm; Chang (II.25) cho 4 chọi 3 của Chopin. Mở ngày 28/10/2026. Sửa chữ: n1, n9, n8 (cũ: "không ai điều khiển được"), n6 (Chopin bỏ khỏi câu Brahms), Arabesque ("rất nhiều" bỏ "rất"), Scarlatti ("đầy" thành "nhiều ... có"), Fantaisie-Impromptu ("mỗi phách" thành "mỗi phách đen"), "Lỗi hay gặp nhất" bỏ "nhất", "Phổ biến nhất" thành "Một dạng phổ biến", ngắt khối 4: "khoảng hai bậc" thành "vài bậc"; đổi Q của khối 4 và 5 (66 thành 60). Lô trước yêu cầu giữ: neo #sau-bac-ghep-hai-tay, tiêu đề "Sáu bậc ghép hai tay", bậc 4 "Điểm neo" (10-bai-dau-tien n18, n19): KHỚP. Còn: link tới trang chưa chuyển (cach-tap, metronome, scarlatti-sonata, mozart-k545, chopin-fantaisie-impromptu, debussy-clair-de-lune, tai-lieu-tham-khao): xem các câu ve-site. Thuật ngữ chưa có ở thuat-ngu.yml: đa tiết tấu (polyrhythm), hai chọi ba, ba chọi bốn, liên ba (triplet), liên hai (duplet), bắt chéo tay (hand crossing), ngược chiều / song song (contrary / parallel motion), luồn ngón cái, vắt ngón, điểm neo, bass Alberti (dữ liệu là "Alberti bass"). Chưa chắc: "dễ" trong "dễ và ổn định nhất" (nguồn nói ổn định hơn); "nhà khoa học vận động" cho Kelso (FAU: coordination dynamics, motor control).'
doi_chu:
  - cu: "Gần như ai mới học piano cũng có lúc nghĩ: cho hai tay làm hai việc khác nhau là không thể. Đó là một kỹ năng, và như mọi kỹ năng, nó có cách tập. Trang này đưa ra một quy trình sáu bậc, sáu kiểu phối hợp hay gặp kèm bài tập, rồi đến đa tiết tấu: hai chọi ba và ba chọi bốn."
    moi: "Nhiều người mới học piano có lúc nghĩ: cho hai tay làm hai việc khác nhau là không thể. Đó là một kỹ năng, và như mọi kỹ năng, nó có cách tập. Trang này đưa ra một quy trình sáu bậc, sáu kiểu phối hợp hay gặp kèm bài tập, rồi đến đa tiết tấu: hai chọi ba và ba chọi bốn."
    ly_do: 'n1 (khong-can-nguon): "gần như ai cũng" là số liệu về người học mà không nguồn nào cho; đổi thành "nhiều người", là nhận xét hợp lý không đòi nguồn.'
  - cu:
      - "Cái khó thứ hai là sự chú ý. Không ai chủ động điều khiển được từng nốt của hai dòng nhạc khác nhau cùng một lúc. Người chơi giỏi cũng không làm vậy: một phần việc (thường là phần đệm) đã trở thành tự động, và tai họ nghe hai tay như một hình tiết tấu chung, rồi như hai giọng."
      - Tin tốt là cả hai cái khó đều giảm rất nhanh khi tập đúng cách. Những buổi đầu ghép tay một bài mới luôn vụng về; sau vài ngày, phần lớn mọi người thấy hai tay "tự nhiên khớp".
    moi:
      - Cái khó thứ hai là sự chú ý. Khi chưa quen, rất khó theo dõi từng nốt của hai dòng nhạc khác nhau cùng một lúc. Lối ra không phải là cố chú ý nhiều hơn, mà là làm cho một phần việc (thường là phần đệm) trở thành tự động; khi ấy tai nghe hai tay như một hình tiết tấu chung, rồi như hai giọng.
      - Tin tốt là cả hai cái khó đều giảm dần khi tập đúng cách. Những buổi đầu ghép tay một bài mới thường vụng về; sau vài ngày tập đúng cách, hai tay dần "tự nhiên khớp".
    ly_do: 'n7 (khong-can-nguon): "không ai", "người chơi giỏi cũng không làm vậy" là khẳng định tuyệt đối về nhận thức mà không nguồn nào kiểm được; viết lại thành lời khuyên về cách tập (khuyen-tap tương đương).; n8 (khong-can-nguon): "rất nhanh", "luôn", "phần lớn mọi người" là số liệu không nguồn; làm nhẹ thành "dần", "thường".'
  - cu: 'Giai điệu to hơn phần đệm khoảng hai bậc sắc thái. Tay trái: ngón sát phím, phím đi xuống chậm; tay phải: trọng lượng cánh tay đi vào từng nốt. Nếu khó, thử bấm "câm" tay trái (phím xuống mà không ra tiếng) trong khi tay phải hát, rồi cho tay trái kêu dần lên (xem Tạo tiếng đàn).'
    moi: 'Giai điệu to hơn phần đệm vài bậc sắc thái. Tay trái: ngón sát phím, phím đi xuống chậm; tay phải: trọng lượng cánh tay đi vào từng nốt. Nếu khó, thử bấm "câm" tay trái (phím xuống mà không ra tiếng) trong khi tay phải hát, rồi cho tay trái kêu dần lên (xem Tạo tiếng đàn).'
    ly_do: 'n30 (khong-can-nguon): "khoảng hai bậc" là con số cụ thể mà không nguồn nào cho; đổi thành "vài bậc".'
  - cu: Mắt nhìn đích trước. Tay trái rời phím ngay sau khi đánh nốt trầm; khuỷu tay và vai dẫn đường, đừng để bàn tay "bay" một mình. Tay phải hơi hạ thấp để chừa chỗ. Khi đã quen, thêm bàn đạp để nốt trầm ngân dưới nốt cao. Các sonata của Scarlatti đầy những bước bắt chéo như thế (xem hướng dẫn nghe).
    moi: Mắt nhìn đích trước. Tay trái rời phím ngay sau khi đánh nốt trầm; khuỷu tay và vai dẫn đường, đừng để bàn tay "bay" một mình. Tay phải hơi hạ thấp để chừa chỗ. Khi đã quen, thêm bàn đạp để nốt trầm ngân dưới nốt cao. Nhiều sonata của Scarlatti có những bước bắt chéo như thế (xem hướng dẫn nghe).
    ly_do: 'n40 (da-sua): bắt chéo tay là nét nổi tiếng của sonata Scarlatti (encyclopedia.com), nhưng "đầy" là mức độ không kiểm được; đổi thành "nhiều".'
  - cu: "Đa tiết tấu là khi hai tay chia cùng một khoảng thời gian theo hai cách khác nhau. Phổ biến nhất là hai chọi ba: một tay chơi hai nốt đều, tay kia chơi ba nốt đều trong cùng một phách (ôn lại liên ba). Chopin và Brahms dùng nó rất thường xuyên, Arabesque số 1 của Debussy có rất nhiều đoạn hai chọi ba, và Clair de lune xen những nhóm hai nốt (liên hai) vào nhịp 9/8 vốn chia ba."
    moi: "Đa tiết tấu là khi hai tay chia cùng một khoảng thời gian theo hai cách khác nhau. Một dạng phổ biến là hai chọi ba: một tay chơi hai nốt đều, tay kia chơi ba nốt đều trong cùng một phách (ôn lại liên ba). Nó thường gặp ở Brahms, Arabesque số 1 của Debussy có nhiều đoạn hai chọi ba, và Clair de lune xen những nhóm hai nốt (liên hai) vào nhịp 9/8 vốn chia ba."
    ly_do: 'n45 (da-sua): "phổ biến nhất" là xếp hạng không kiểm được; đổi thành "một dạng phổ biến".; n45 (da-sua): Hook (MTO) nêu Brahms với hai chọi ba; "Chopin" và "rất thường xuyên" không có nguồn kiểm được nên bỏ.; n46 (da-sua): bản Mutopia cho thấy các đoạn hai chọi ba; "rất nhiều" không đếm được nên đổi thành "nhiều".'
  - cu: 'Lỗi hay gặp nhất: nốt thứ hai của tay chơi hai bị kéo trùng vào một nốt của tay kia, biến hai chọi ba thành một nhịp lắc dài – ngắn. Nốt ấy phải rơi đúng giữa "ly" và "phê", tức đúng vào chữ "cà".'
    moi: 'Lỗi hay gặp: nốt thứ hai của tay chơi hai bị kéo trùng vào một nốt của tay kia, biến hai chọi ba thành một nhịp lắc dài – ngắn. Nốt ấy phải rơi đúng giữa "ly" và "phê", tức đúng vào chữ "cà".'
    ly_do: 'n55 (khong-can-nguon): "hay gặp nhất" là xếp hạng không kiểm được; bỏ "nhất".'
  - cu: "Tập theo đúng các bước của hai chọi ba: gõ trên bàn thật chậm, rồi bài 9 (viết chính xác trên lưới 12), rồi bài 10 (liên ba chọi móc kép). Fantaisie-Impromptu Op. 66 của Chopin là ví dụ nổi tiếng: ở hai phần nhanh, tay phải chơi bốn nốt trong khi tay trái chơi ba nốt ở mỗi phách."
    moi: "Tập theo đúng các bước của hai chọi ba: gõ trên bàn thật chậm, rồi bài 9 (viết chính xác trên lưới 12), rồi bài 10 (liên ba chọi móc kép). Fantaisie-Impromptu Op. 66 của Chopin là ví dụ nổi tiếng: ở hai phần nhanh, tay phải chơi bốn nốt trong khi tay trái chơi ba nốt trong mỗi phách đen."
    ly_do: 'n62 (da-sua): bản Mutopia ghi nhịp alla breve (phách là nốt trắng), nên "ở mỗi phách" dễ hiểu sai; tay phải bốn nốt và tay trái ba nốt tính trong mỗi nốt đen, nên viết "phách đen".'
  - cu: "mô tả: Gần như ai mới học piano cũng có lúc nghĩ: cho hai tay làm hai việc khác nhau là không thể. Đó là một kỹ năng, và như mọi kỹ năng, nó có cách tập. Trang này…"
    moi: "mô tả: Nhiều người mới học piano có lúc nghĩ: cho hai tay làm hai việc khác nhau là không thể. Đó là một kỹ năng, và như mọi kỹ năng, nó có cách tập. Trang này…"
    ly_do: "n1: mô tả đổi theo câu mở đầu, \"gần như ai\" thành \"nhiều người\" vì không có nguồn cho mức tuyệt đối."
