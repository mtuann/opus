khuong_nhac: []
ghi_chu: 'Lượt 1 trang Piano (trang mục lục, lô D4-L1, phần 2/2). Trang chủ yếu là mô tả site (ve-site) nên không cần nguồn ngoài; đã đối chiếu từng bảng "Bạn sẽ có" với tiêu đề mục của trang cũ ở ../opus-zero/docs/piano (bằng grep mục ##), và đếm: 33 trang piano cũ, 22 có khối abc, 34 bài học tác phẩm. Nguồn ngoài chỉ cho: Simmons 2012 (n20, như bat-dau/bai-0 n10), BAPAM và Lee University (n22), OMT (n3). Khuông nhạc: trang không có khối abc, nên khuong_nhac để trống. Câu chưa chắc: n2 (một người chơi cùng lúc giai điệu, hòa âm và bè trầm), ket_qua null. Trang chưa chuyển mà trang này hứa hẹn, phải giữ (chi tiết ở từng nhận định): piano/chon-dan, nam-ngon, gam, hop-am-rai, tieng-dan, ban-dap, not-hoa-my, hai-tay, quang-tam-buoc-nhay, not-lap-not-kep, bai-tap-ngon, cach-tap (mục Mẫu buổi tập, neo #mau-buoi-tap), thi-tau, hoc-thuoc-bieu-dien, choi-cung-nguoi-khac, suc-khoe, thay-va-thi, hoa-am (index, ket, dem-giai-dieu, mau-galant, ung-tac), tac-pham-theo-cap, tac-pham (34 bài), lich-su-dan, the-loai, nha-soan-nhac, nghe-si; luyen-tap/ket-noi-midi, choi-theo, thu-am; lich-su/ và lich-su/nha-soan-nhac; nghe-nhac/ (chỉ bach-goldberg đã chuyển) cùng beethoven-moonlight, beethoven-pathetique, chopin-etude, rachmaninoff-2, schumann-kinderszenen. Đợt 3 "giữ": không có mục đợt 3 nào trỏ tới piano/index (grep ra rỗng). Thuật ngữ chưa có trong src/data/thuat-ngu.yml (grep 28/10/2026): không phát sinh thêm ngoài danh sách ở hai trang kia; riêng "bè trầm" và "hình đệm" chưa có mục. Công cụ: ::cong-cu{ten="repertoire" compact=""} và ::cong-cu{ten="plan"} không đọc; chỉ nhận xét tiêu đề mục (n14). Không sửa wrapper <div class="oz-paths"> và các dòng ::cong-cu. Lưu ý cho người gọi: trang 10-bai-dau-tien còn "Opus Zero" ở dòng 9 và 333 (nên là Opus); 10-bai dùng "hợp âm át bảy" còn bài nhạc lý 11 dùng "hợp âm bảy át".'
doi_chu:
  - cu:
      - Piano là nhạc cụ tốt nhất để hiểu nhạc cổ điển. Một người với mười ngón tay chơi được cùng lúc giai điệu, hòa âm và bè trầm; bàn phím là tấm bản đồ nhìn thấy được của mọi khái niệm nhạc lý; và kho tác phẩm viết cho piano phong phú hơn bất kỳ nhạc cụ nào khác, từ Bach, Mozart, Beethoven, Chopin đến Debussy và các nhà soạn nhạc hôm nay.
      - "Mục này là trung tâm của Opus Zero: một con đường cho người lớn đi từ lần đầu chạm phím đến những tác phẩm lớn, chia thành những bước nhỏ tập được mỗi ngày. Gần như trang nào cũng có ví dụ bấm nghe được ngay, nhiều trang có khuông nhạc hai tay kèm số ngón, và mọi thứ nối với phần nhạc lý, luyện tai và nghe nhạc của site."
    moi:
      - Trên piano, một người với mười ngón tay chơi được cùng lúc giai điệu, hòa âm và bè trầm; bàn phím là tấm bản đồ nhìn thấy được của các khái niệm nhạc lý; và kho tác phẩm chơi được trên piano rất phong phú, từ Bach, Mozart, Beethoven, Chopin đến Debussy và các nhà soạn nhạc hôm nay.
      - "Mục này là trung tâm của Opus: một con đường cho người lớn đi từ lần đầu chạm phím đến những tác phẩm lớn, chia thành những bước nhỏ tập được mỗi ngày. Nhiều trang có ví dụ bấm nghe được ngay, nhiều trang có khuông nhạc hai tay kèm số ngón, và mọi thứ nối với phần nhạc lý, luyện tai và nghe nhạc của site."
    ly_do: 'n1, n3, n4 (da-sua và da-bo): bỏ "tốt nhất để hiểu nhạc cổ điển" và "phong phú hơn bất kỳ nhạc cụ nào khác" (xếp hạng không kiểm được); "mọi khái niệm" thành "các khái niệm"; "viết cho piano" thành "chơi được trên piano".; n5 (da-sua): đổi theo tên site hiện tại (Opus).; n6 (da-sua): 22 trên 33 trang piano cũ có khối abc, nên "gần như trang nào cũng có" không đúng; đổi thành "Nhiều trang có".'
  - cu: Phần đọc nhạc và luyện tai hôm nay
    moi: Buổi tập hôm nay
    ly_do: "n14 (da-sua): công cụ in cả buổi tập hôm nay (bắt đầu bên đàn, rồi đọc nhạc, nhạc lý, nghe), không chỉ phần đọc nhạc và luyện tai; giữ neo cũ bằng { #phan-oc-nhac-va-luyen-tai-hom-nay }."
  - cu:
      - Nhạc lý giải thích những gì tay bạn đang chơi. Gam trưởng và gam thứ là nền của ngón bấm; hóa biểu cho biết bài ở giọng nào; hợp âm ba, hòa âm chức năng và kết giúp học thuộc nhanh hơn hẳn; ký hiệu biểu diễn dạy đọc pedal, sắc thái và nốt hoa mỹ. Toàn bộ chương trình ở Nhạc lý.
      - "Luyện tai: khi nghe ra hợp âm và tiến trình hòa âm, bạn tự phát hiện nốt sai, học thuộc bằng tai và đệm được cho người khác hát. Bài Chơi theo tai bên phím đàn đưa những kỹ năng ấy lên phím: tìm giai điệu, đệm, dịch giọng."
    moi:
      - Nhạc lý giải thích những gì tay bạn đang chơi. Gam trưởng và gam thứ là nền của các gam bạn tập; hóa biểu cho biết bài ở giọng nào; hợp âm ba, hòa âm chức năng và kết giúp bạn hiểu hòa âm của bài đang tập; ký hiệu biểu diễn dạy đọc pedal, sắc thái và nốt hoa mỹ. Toàn bộ chương trình ở Nhạc lý.
      - "Luyện tai: luyện nghe hợp âm và tiến trình hòa âm. Bài Chơi theo tai bên phím đàn đưa những kỹ năng ấy lên phím: tìm giai điệu, đệm, dịch giọng."
    ly_do: 'n15 (da-sua): bỏ "là nền của ngón bấm", đổi thành điều site có thật (gam bạn tập).; n15 (da-sua): bỏ "giúp học thuộc nhanh hơn hẳn", hiệu quả không có nguồn.; n16 (da-sua): bỏ "bạn tự phát hiện nốt sai, học thuộc bằng tai và đệm được cho người khác hát", hiệu quả không có nguồn.'
