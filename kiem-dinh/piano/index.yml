nhan_dinh:
  - id: n1
    cau: Piano là nhạc cụ tốt nhất để hiểu nhạc cổ điển.
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Câu cũ ở đầu trang (và đầu mô tả): bỏ, xếp hạng "tốt nhất" không kiểm được. Trang bắt đầu bằng câu về điều piano làm được. Review D4-gom: đã kiểm trang và description: không còn "tốt nhất".'
    luot_2: khong-chac
    luot_2_ghi_chu: Nhận định chủ quan ('tốt nhất'), không kiểm được; nên viết lại hay bỏ.
  - id: n2
    cau: Một người với mười ngón tay chơi được cùng lúc giai điệu, hòa âm và bè trầm.
    loai: quy-tac
    nguon:
      - omt-keyboard
      - mutopia-elise
    ket_qua: dung
    ghi_chu: 'chưa chắc: đúng về hiểu biết chung (piano là nhạc cụ nhiều âm, hai tay chơi các bè khác nhau) nhưng chưa có nguồn bậc 2 mở được để dán: Concise Oxford Dictionary of Music, mục piano (encyclopedia.com), chỉ định nghĩa nhạc cụ ("kbd. instr. whose full name is pianoforte"), nói piano chủ yếu dùng độc tấu, không nói chơi cùng lúc giai điệu và hòa âm. Cần lượt 2 tìm nguồn (giáo trình mở về kết cấu nhạc piano, ví dụ OMT chương về texture). Review D4-gom: OMT The Keyboard and the Grand Staff (mở lại 28/10/2026): nhạc piano viết trên khuông kép, "the pianist plays the lower notes (in the bass clef) with their left hand" và nốt cao bằng tay phải, tức một người chơi cả hai khuông; bản Mutopia Für Elise (bậc 1) cho thấy một người chơi cùng lúc giai điệu (tay phải) và bè trầm rải hợp âm (tay trái: a,16 e a), và các hợp âm tay trái (<f a>, <g b>) dưới giai điệu. Giữ câu.'
    luot_2: khong-chac
    luot_2_ghi_chu: Đúng theo hiểu biết chung (piano chơi được cùng lúc giai điệu, hòa âm, bè trầm); chưa mở nguồn bậc 2 nêu điều này.
  - id: n3
    cau: Bàn phím là tấm bản đồ nhìn thấy được của các khái niệm nhạc lý.
    loai: quy-tac
    nguon:
      - omt-keyboard
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "của mọi khái niệm nhạc lý". Bỏ "mọi": bàn phím minh họa cao độ, quãng, gam (OMT, The Keyboard and the Grand Staff) chứ không phải mọi khái niệm (ví dụ nhịp, hình thức). Phần ẩn dụ "tấm bản đồ" giữ. Review D4-gom: câu là hình ảnh so sánh; phần kiểm được (bàn phím cho thấy cao độ, nửa cung và cung, gam) theo OMT The Keyboard and the Grand Staff và trang Bản đồ bàn phím. "Mọi" đã bỏ ở lượt 1. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Hình ảnh ẩn dụ, không kiểm được.
  - id: n4
    cau: Kho tác phẩm chơi được trên piano rất phong phú, từ Bach, Mozart, Beethoven, Chopin đến Debussy và các nhà soạn nhạc hôm nay.
    loai: ve-site
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "kho tác phẩm viết cho piano phong phú hơn bất kỳ nhạc cụ nào khác". Bỏ so sánh "hơn bất kỳ nhạc cụ nào khác" (không kiểm được) và đổi "viết cho piano" thành "chơi được trên piano" (nhạc Bach viết cho đàn phím). Về site: 34 bài học tác phẩm gồm Bach, Mozart, Beethoven, Chopin, Debussy (src và opus-zero/docs/piano/tac-pham). Review D4-gom: Bach, Mozart, Beethoven, Chopin, Debussy có trong 34 bài học tác phẩm (../opus-zero/docs/piano/tac-pham/) và dữ liệu nhà soạn nhạc (src/data, có cả nhà soạn nhạc đương đại như Adams, Adès).'
    review: dung
  - id: n5
    cau: "Mục này là trung tâm của Opus: một con đường cho người lớn đi từ lần đầu chạm phím đến những tác phẩm lớn, chia thành những bước nhỏ tập được mỗi ngày."
    loai: ve-site
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "trung tâm của Opus Zero". Đổi theo tên site hiện tại (Opus; ghi ở quyết định lô D4). Còn lại khớp mục lục Piano (lộ trình 7 chặng, bước nhỏ mỗi ngày). Review D4-gom: tên site Opus; trang mục lục Piano dẫn tới lộ trình 7 chặng và các trang tập mỗi ngày.'
    review: dung
  - id: n6
    cau: Nhiều trang có ví dụ bấm nghe được ngay, nhiều trang có khuông nhạc hai tay kèm số ngón, và mọi thứ nối với phần nhạc lý, luyện tai và nghe nhạc của site.
    loai: ve-site
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Gần như trang nào cũng có ví dụ bấm nghe được ngay". Đếm ở opus-zero/docs/piano (33 trang): 22 trang có khối abc (nghe được), 18 trang có số ngón; 11 trang không có (chon-dan, lich-su-dan, lo-trinh, nghe-si, nha-soan-nhac, suc-khoe, tac-pham-theo-cap, thay-va-thi, the-loai và hai trang index) nên "gần như trang nào cũng có" không đúng. Đổi thành "Nhiều trang có". Review D4-gom: đếm lại theo ghi chú lượt 1 (22/33 trang piano cũ có khối abc, 18 có số ngón); "nhiều trang" đúng; link nhạc lý, luyện tai, nghe nhạc có trong trang.'
    review: dung
  - id: n7
    cau: 'Bốn lối vào "Bắt đầu từ đâu?" (chưa từng chạm phím, đã chơi một chút, muốn chơi một tác phẩm, muốn nghe) trỏ đúng tới các trang: 34 bài học tác phẩm từ Minuet Fa trưởng K. 2 của Mozart đến Ballade số 1 của Chopin; mỗi bài có cấu trúc, chỗ khó và cách tập, bài tập chuẩn bị, kế hoạch theo tuần, gợi ý diễn tấu.'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đếm opus-zero/docs/piano/tac-pham: 34 bài học (ngoài index.md); đầu bài mozart-minuet-k2 là "Mozart: Minuet Fa trưởng, K. 2", chopin-ballade-1 là "Chopin: Ballade số 1 cung Sol thứ, Op. 23". Mục mỗi bài (ví dụ mozart-k545): Cấu trúc, Chỗ khó và cách tập, Bài tập chuẩn bị, Kế hoạch tập, Diễn tấu. Các trang đích: hai-tuan-dau, tu-the, 10-bai-dau-tien, lo-trinh (đã chuyển); chon-dan, gam, thi-tau, ban-dap, tac-pham, the-loai, nghe-si và các hướng dẫn nghe (chưa chuyển). Review D4-gom: ../opus-zero/docs/piano/tac-pham/ có 34 bài (ngoài index.md); mọi bài có mục "Nghe trước" và "Theo dõi khi nghe" (grep 35/35 tệp gồm index); bốn lối vào trỏ đúng trang.'
    review: dung
  - id: n8
    cau: "Lộ trình nhìn nhanh: bảy chặng từ lần đầu chạm phím đến sau Grade 8, kèm liên kết tới từng chặng ở trang Lộ trình piano."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'piano/lo-trinh (đã chuyển) có đúng bảy mục "Chặng 1. Khởi đầu (0–6 tháng)" đến "Chặng 7. Sau Grade 8 (diploma trở lên)"; các neo #chang-… khớp id tạo từ tiêu đề. Review D4-gom: dist/piano/lo-trinh/index.html có đủ bảy id chang-1-khoi-au-06-thang … chang-7-sau-grade-8-diploma-tro-len (link với neo sống).'
    review: dung
  - id: n9
    cau: 'Bản đồ mục: bảng "Bắt đầu bên phím đàn" mô tả đúng năm trang (chọn đàn; tư thế; bản đồ bàn phím gồm 88 phím, Đô giữa, tên quãng tám, nốt mốc; hai tuần đầu; 10 bài đầu).'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đối chiếu tiêu đề mục: tu-the (Ghế và khoảng cách, Dùng lực), ban-do-ban-phim (88 phím, Tên các quãng tám, Nốt mốc để đọc nhạc nhanh), hai-tuan-dau (14 ngày), 10-bai-dau-tien (có số ngón). Chưa chuyển: chon-dan phải giữ "Piano điện: danh sách kiểm tra", "Piano cơ: kiểm tra trước khi mua", "Dựng góc tập" (ghế, ánh sáng, độ ẩm trong mục Chăm sóc và bảo dưỡng). Review D4-gom: tu-the, ban-do-ban-phim, hai-tuan-dau, 10-bai-dau-tien đã chuyển, nội dung khớp; ../opus-zero/docs/piano/chon-dan.md có "Piano điện: danh sách kiểm tra", "Piano cơ: kiểm tra trước khi mua", "Dựng góc tập".'
    review: dung
  - id: n10
    cau: Bảng "Kỹ thuật" mô tả đúng mười trang (vị trí năm ngón, gam, hợp âm rải và hình đệm, tạo tiếng đàn, bàn đạp, nốt hoa mỹ, phối hợp hai tay, quãng tám và bước nhảy, nốt lặp và nốt kép, bài tập ngón và étude).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đối chiếu tiêu đề mục ở opus-zero/docs/piano. nam-ngon: Năm ngón trưởng và thứ ở mười hai giọng, Bài tập hai tay; gam: Luồn ngón cái, Bảng ngón bấm 12 gam trưởng; hop-am-rai: Hợp âm ba ở các thể đảo, Bốn kiểu hình đệm, vòng kết I–IV–I–V7–I (có "mọi giọng"); tieng-dan: Legato, Staccato, Sắc thái: điều khiển tốc độ phím; ban-dap: Ba bàn đạp, bàn đạp nối (đạp trễ), theo phong cách; not-hoa-my: Láy rền, láy, láy quanh, appoggiatura; hai-tay: Sáu bậc ghép hai tay, Hai chọi ba; quang-tam-buoc-nhay: Thế tay quãng tám, Cổ tay và cẳng tay, Bước nhảy: nhảy sớm, đánh đúng lúc; not-lap-not-kep: Nốt lặp, Nốt kép (quãng ba, quãng sáu); bai-tap-ngon: Hanon, Czerny, Burgmüller, mục Rủi ro. Các trang đều chưa chuyển, phải giữ các mục này. Review D4-gom: các trang kỹ thuật nay đã chuyển (nam-ngon, gam, hop-am-rai, tieng-dan, ban-dap, not-hoa-my, hai-tay, quang-tam-buoc-nhay, not-lap-not-kep, bai-tap-ngon); tiêu đề và mục khớp mô tả của bảng.'
    review: dung
  - id: n11
    cau: Bảng "Tập luyện" mô tả đúng sáu trang (cách tập một bản nhạc, đọc nhạc và thị tấu, học thuộc và biểu diễn, chơi cùng người khác, giữ đôi tay khỏe, học với thầy và thi cấp).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đối chiếu tiêu đề mục: cach-tap (Học một bài mới: 12 bước, Mẫu buổi tập, Sửa một lỗi cho dứt điểm); thi-tau (Đọc hai khuông cùng lúc, Kế hoạch 5–10 phút mỗi ngày); hoc-thuoc-bieu-dien (Bốn loại trí nhớ, Tám cách xây trí nhớ bền gồm tự kiểm tra, Hồi hộp khi biểu diễn); choi-cung-nguoi-khac (Piano bốn tay, Hai đàn piano, Đệm hát, Song tấu, Tập chung); suc-khoe (Phòng ngừa, Dấu hiệu cảnh báo, Đi khám ở đâu, nói gì); thay-va-thi (Một người thầy tốt làm gì, Học trực tuyến, Thi cấp). Trang chưa chuyển: giữ các mục ấy. Ghi chú: nhãn trong bảng ("Cách tập một bản nhạc", "Đọc nhạc và thị tấu") khác H1 trang cũ ("Cách tập piano hiệu quả", "Đọc nhạc và thị tấu trên đàn"): khi chuyển hai trang cần chọn một cách gọi. Review D4-gom: cach-tap, thi-tau, hoc-thuoc-bieu-dien, choi-cung-nguoi-khac, suc-khoe đã chuyển, mục khớp; ../opus-zero/docs/piano/thay-va-thi.md có "Học trực tuyến", mục ABRSM và Trinity.'
    review: dung
  - id: n12
    cau: Bảng "Hòa âm bên phím" và "Tác phẩm" và "Văn học piano" mô tả đúng các trang (hòa âm bên phím và ứng tác kế hoạch 12 tuần 10 phút mỗi ngày; kết ở ba vị trí tay qua mọi giọng; đệm giai điệu; mẫu Romanesca, Prinner, Fonte, Monte; ứng tác; tác phẩm theo cấp độ chia 7 chặng; 34 bài học tác phẩm; lịch sử cây đàn; thể loại; nhà soạn nhạc; nghệ sĩ và các cuộc thi).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đối chiếu opus-zero/docs/piano: hoa-am/index (Lộ trình 12 tuần, Mỗi ngày 10 phút); hoa-am/ket ("ở ba vị trí và trong cả 24 giọng", Bốn loại kết); dem-giai-dieu; mau-galant (Romanesca có 11 lần xuất hiện, Prinner, Fonte, Monte, Ponte); ung-tac; tac-pham-theo-cap (Chặng 1 đến 7); tac-pham (34); lich-su-dan (Cristofori, Silbermann, Bach, Beethoven, thế kỷ 20); the-loai; nha-soan-nhac; nghe-si (Các cuộc thi lớn). Tất cả chưa chuyển, phải giữ các mục ấy. Review D4-gom: hoa-am/ và các trang con, the-loai, nha-soan-nhac, lich-su-dan đã chuyển; tac-pham-theo-cap, tac-pham (34 bài), nghe-si (có "Các cuộc thi lớn", "Cách so sánh hai bản thu") ở ../opus-zero/docs/piano/.'
    review: dung
  - id: n13
    cau: 'Mục "Một buổi tập": khuôn buổi 30 phút, ngày bận 10 phút và lịch tuần ở Thói quen mỗi ngày; buổi 20, 45 và 90 phút ở Cách tập hiệu quả (mục Mẫu buổi tập); hãy dành 10 phút nghe một bản thu hay hướng dẫn nghe.'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'bat-dau/moi-ngay (đã chuyển): Buổi 30 phút (chuẩn), Ngày bận (10 phút), Lịch tuần gợi ý. piano/cach-tap (chưa chuyển): "## Mẫu buổi tập" (neo #mau-buoi-tap) có bảng 20, 45, 90 phút; trang phải giữ mục này và neo. "Dành 10 phút nghe" là lời khuyên tập. Review D4-gom: bat-dau/moi-ngay.md có Buổi 30 phút, Ngày bận (10 phút), Lịch tuần gợi ý; cach-tap.md có "## Mẫu buổi tập" với ba cột 20, 45, 90 phút; dist/piano/cach-tap/ có id="mau-buoi-tap".'
    review: dung
  - id: n14
    cau: 'Mục "Buổi tập hôm nay": công cụ kế hoạch tự gợi ý dựa trên kết quả các công cụ bạn đã dùng.'
    loai: ve-site
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Đổi tiêu đề từ "Phần đọc nhạc và luyện tai hôm nay" thành "Buổi tập hôm nay": công cụ (src/scripts/ke-hoach.js) in "Buổi tập hôm nay (khoảng N phút), bắt đầu bên đàn, rồi đến đọc nhạc, nhạc lý và nghe", tức cả buổi tập chứ không chỉ phần đọc nhạc và luyện tai. Giữ neo cũ bằng { #phan-oc-nhac-va-luyen-tai-hom-nay }. Không sửa thành phần ::cong-cu{ten="plan"}. Review D4-gom: src/scripts/ke-hoach.js dòng 227: "Buổi tập hôm nay (khoảng … phút), … site tự chọn dựa trên việc bạn đã tập"; tiêu đề giữ id cũ { #phan-oc-nhac-va-luyen-tai-hom-nay }.'
    review: dung
  - id: n15
    cau: "Nhạc lý: gam trưởng và gam thứ là nền của các gam bạn tập; hóa biểu cho biết bài ở giọng nào; hợp âm ba, hòa âm chức năng và kết giúp bạn hiểu hòa âm của bài đang tập; ký hiệu biểu diễn dạy đọc pedal, sắc thái và nốt hoa mỹ."
    loai: ve-site
    nguon: []
