    moi: "Nghe nhạc: các hướng dẫn nghe tác phẩm piano, như Bach: Biến tấu Goldberg, Beethoven: Ánh trăng, Beethoven: Pathétique, Chopin: Étude, Schumann: Kinderszenen và Rachmaninoff: Concerto số 2; mỗi bài học tác phẩm cũng có bảng theo dõi khi nghe, kèm bản thu gợi ý khi có. Danh sách đầy đủ ở Nghe nhạc."
