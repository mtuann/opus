nhan_dinh:
  - id: n1
    cau: Mười giai điệu quen thuộc, soạn lại cho hai tay trên khuông kép, có ghi số ngón.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Trang có đúng 10 bài, 11 khối abc (bài 5 có thêm khối canon), mọi khối đều có khuông kép và số ngón. Review D4-gom: đã kiểm trang: 11 khối abc (X:1 đến X:11), khối nào cũng có %%score {RH LH} và số ngón."
    review: dung
  - id: n2
    cau: "Mỗi bài thêm đúng một kỹ năng hai tay mới: chuyền giai điệu qua lại giữa hai tay, giữ nốt trầm, hợp âm tay trái, canon, nhịp 3/4 và 6/8, bàn đạp, rồi đến đoạn mở đầu Für Elise đúng như Beethoven viết."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đối chiếu bảng lộ trình: bài 1 chuyền giai điệu, bài 2 nốt trầm, bài 4 hợp âm, bài 5 canon, bài 6 và 7 nhịp 3/4 và 6/8, bài 8 bàn đạp, bài 10 Für Elise. Câu là lời giới thiệu, "đúng một kỹ năng" là cách nói. Review D4-gom: đã kiểm bảng lộ trình và các khối: đúng thứ tự kỹ năng (chuyền giai điệu, nốt trầm, hợp âm, canon, 3/4 và 6/8, bàn đạp, Für Elise). ket_qua đổi từ khong-can-nguon (chỉ cho khuyen-tap) thành dung.'
    review: dung
  - id: n3
    cau: Giai điệu là dân ca hoặc tác phẩm đã thuộc phạm vi công cộng.
    loai: lich-su
    nguon:
      - mutopia-ode
      - mutopia-minuet
      - mutopia-elise
    ket_qua: dung
    ghi_chu: "Tác giả mất từ lâu hoặc vô danh: Beethoven (m. 1827), Petzold (m. 1733), Dvořák (m. 1904); dân ca và thánh ca vô danh; Mutopia chỉ nhận tác phẩm công cộng hay giấy phép mở."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Für_Elise,_WoO_59_(Beethoven,_Ludwig_van)", "https://www.antonin-dvorak.cz/en/work/symphony-no-9/", "https://imslp.org/wiki/Minuet%20in%20G%20major,%20BWV%20Anh.114%20(Pezold,%20Christian)" ]
    luot_2_ghi_chu: Beethoven mất 1827, Dvořák 1904, Petzold thế kỷ 18; các dân ca không có tác giả còn bảo hộ. Không kiểm bản quyền từng bản chuyển soạn.
  - id: n4
    cau: Phần tay trái (trừ bài 10) do Opus soạn cho người mới, giữ hòa âm đơn giản nhất có thể.
    loai: ve-site
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ viết "Opus Zero": tên site đã đổi thành Opus (README ngày 23/10/2026). Phần tay trái: bài 10 là nguyên văn Beethoven (n97); các bài 1–9 là bản soạn; hòa âm chỉ dùng I, IV, V, V7 và vài hợp âm khác (i, E, G, C trong Greensleeves): đơn giản, đúng. Review D4-gom: trang (hộp "Về các bản soạn") ghi "do Opus soạn"; khối 1–9 là bản soạn, khối 11 là nguyên văn Beethoven; hòa âm tay trái chỉ có I, IV, V, V7 (và i, VII, VI, V ở bài 7).'
    review: dung
  - id: n5
    cau: Bài 9 giữ nguyên giai điệu của Petzold nhưng giản lược tay trái; bản gốc đầy đủ hai tay có ở bài học Minuet Sol trưởng.
    loai: cau-truc
    nguon:
      - mutopia-minuet
    ket_qua: dung
    ghi_chu: "Giai điệu tay phải khớp bản Mutopia (khuong_nhac khối 10); tay trái bản gốc là hai bè chuyển động, trang chỉ ghi một nốt trầm mỗi ô. Trang piano/tac-pham/minuet-sol chưa chuyển; có ở ../opus-zero/docs/piano/tac-pham/minuet-sol.md (# Petzold: Minuet Sol trưởng, BWV Anh. 114). Review D4-gom: đã mở lại tệp Mutopia anna-magdalena-04.ly (Menuet in G, BWV Anh. 114, 3/4, Sol trưởng, phần đầu 16 ô): khớp ghi chú khối 10 của lượt 1; tay trái khối 10 chỉ một nốt mỗi ô. Lượt 2 không mở được tệp. Giữ."
    luot_2: khong-chac
    luot_2_ghi_chu: Cần đối chiếu khuông của trang với bản Minuet BWV Anh. 114 và trang Minuet Sol trưởng; không mở được.
  - id: n6
    cau: Bạn nên đã ngồi đúng tư thế và biết số ngón (liên kết Tư thế, thế tay và cách dùng lực).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'piano/tu-the đã chuyển; có mục "Số ngón tay" và tiêu đề đúng. Review D4-gom: src/content/docs/piano/tu-the.md có tiêu đề "Tư thế, thế tay và cách dùng lực" và mục "Số ngón tay". ket_qua đổi thành dung.'
    review: dung
  - id: n7
    cau: Bạn nên đã tìm được Đô giữa và các nốt mốc (liên kết Bản đồ bàn phím).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'piano/ban-do-ban-phim (trang bạn đang kiểm, có mục "Nốt mốc để đọc nhạc nhanh"). Review D4-gom: src/content/docs/piano/ban-do-ban-phim.md có mục "Nốt mốc để đọc nhạc nhanh" và Đô giữa. ket_qua đổi thành dung.'
    review: dung
  - id: n8
    cau: "Bạn nên đã quen thế Đô: năm ngón trên Đô–Rê–Mi–Fa–Sol (tuần 1 của Hai tuần đầu tiên)."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'piano/hai-tuan-dau ngày 2–3: "Đặt tay phải vào thế Đô: ngón 1 trên Đô giữa, mỗi ngón một phím trắng, ngón 5 trên Sol4" (trang đã chuyển, người khác đang kiểm lượt 1). Review D4-gom: đã kiểm src/content/docs/piano/hai-tuan-dau.md, đoạn "Ngày 2–3": "Đặt tay phải vào thế Đô: ngón 1 trên Đô giữa, … ngón 5 trên Sol4".'
    review: dung
  - id: n9
    cau: Từ bài 4, tập song song các thế Sol và Fa ở Vị trí năm ngón.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Trang cũ ../opus-zero/docs/piano/nam-ngon.md có bảng thế Đô, Sol, Fa và bài tập "cùng một bài ở thế Sol và thế Fa"; ../opus-zero/docs/bat-dau/lo-trinh-choi.md (tháng 2): bài 4–5 song song với Vị trí năm ngón. Trang chưa chuyển. Review D4-gom: piano/nam-ngon đã chuyển (src/content/docs/piano/nam-ngon.md, có bản xem); link Vị trí năm ngón sống. Phần "từ bài 4" khớp hồ sơ khóa bat-dau/lo-trinh-choi (tháng 2).'
    review: dung
  - id: n10
    cau: Hai tuần đầu tiên là kế hoạch dẫn thẳng vào ba bài đầu của trang này.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'piano/hai-tuan-dau: tuần 1 ngày 5–6 là bài 1 (Au clair de la lune), tuần 2 ngày 10 là bài 2, tổng duyệt "ba bài" ở ngày 13 và "ba bài đầu của 10 bài đầu tiên ... ở ♩ = 60–72"; khớp hồ sơ đã khóa bat-dau/lo-trinh-choi (n6–n15 phần này). Review D4-gom: hai-tuan-dau.md: ngày 5–6 bài 1, ngày 8–10 bài 2, ngày 11–12 bài 3, mục "Cuối tuần 2" có "Chơi ba bài đầu của 10 bài đầu tiên".'
    review: dung
  - id: n11
    cau: Con số nhỏ trên nốt là số ngón (1 = ngón cái).
    loai: dinh-nghia
    nguon:
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: 'Quy ước đánh số ngón của site: piano/hai-tuan-dau ngày 2–3 ("ngón cái là 1, ngón út là 5"), khớp tu-the "Số ngón tay"; không trái trang đã khóa. Review D4-gom: quy ước số ngón (1 = ngón cái): Baylor Piano Basics, mục Finger Numbers ("Thumbs are 1…"), đã kiểm ở hồ sơ khóa du-lieu/thuat-ngu/fingering. Lượt 2 không mở được nguồn; giữ câu, thêm nguồn; ket_qua đổi từ khong-can-nguon (sai loại) thành dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Quy ước đánh số ngón (1 = ngón cái) đúng theo thông lệ nhưng chưa mở được nguồn bậc 2 nêu rõ.
  - id: n12
    cau: Số ngón chỉ ghi ở nốt đầu và ở chỗ đổi thế tay; các nốt ở giữa dùng ngón kế tiếp một cách tự nhiên.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Quy ước ghi của site; các khối abc đúng như vậy (xem khuong_nhac). Review D4-gom: đã đọc các khối abc: số ngón ghi ở nốt đầu và chỗ đổi thế (ví dụ khối 7, 8, 10)."
    review: dung
  - id: n13
    cau: Khuông trên (khóa Sol) là tay phải, khuông dưới (khóa Fa) là tay trái.
    loai: quy-tac
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: "OMT The Keyboard and the Grand Staff; mọi khối dùng %%score {RH LH}, V:RH clef=treble, V:LH clef=bass. (Quy ước, không phải luật: xem ban-do-ban-phim n40.) Review D4-gom: OMT The Keyboard and the Grand Staff (mở lại ngày 28/10/2026): \"Typically, the pianist plays the lower notes (in the bass clef) with their left hand\" và nốt cao ở khóa Sol bằng tay phải. Lượt 2 chỉ mở chương Clefs. Giữ."
    luot_2: khong-chac
    luot_2_ghi_chu: Quy ước khóa Sol cho tay phải, khóa Fa cho tay trái đúng theo thông lệ; trang Clefs của OMT chỉ nói vị trí G4/F3, không nói về tay.
  - id: n14
    cau: Bấm nút phát để nghe trước và nhìn con trỏ chạy theo từng nốt.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'src/scripts/abc.js: "Vẽ khối abc thành khuông nhạc kèm trình phát luyện tập (abcjs)", có "Con trỏ: tô sáng nốt đang phát". Chưa mở trình duyệt thật để xem; người làm thành phần xác nhận. Review D4-gom: src/scripts/abc.js có trình phát và "Con trỏ: tô sáng nốt đang phát" (dòng 30); các khối trên dist/piano/10-bai-dau-tien/ có nút phát.'
    review: dung
  - id: n15
    cau: "Cách tập 1: nghe mẫu hai lần, mắt dõi theo bản nhạc."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
