  - cu: 'Dvořák, Giao hưởng số 9 "Từ Thế giới mới", chương 2 (1893), chủ đề chính, bản rút gọn. Đô trưởng. Học được: chơi legato chậm như hát, và dùng bàn đạp vang lần đầu: mỗi ô nhịp đổi bàn đạp một lần.'
