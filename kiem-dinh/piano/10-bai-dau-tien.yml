ghi_chu: '10 bài đầu tiên (hai tay), piano/10-bai-dau-tien. Nguồn chính: bản phổ Mutopia Project (Ode to Joy, Minuet BWV Anh. 114, Für Elise, New Britain, Greensleeves) và IMSLP (Minuet, Für Elise) cho các khối nhạc; The Cleveland Orchestra, EBSCO, Britannica, UC Davis, Berliner Philharmoniker và BSO, Carleton cho niên đại và xuất xứ; bài hát dân gian chỉ có Wikibooks và Wikipedia (bậc 3, chấp nhận vì rủi ro thấp). Mở ngày 28/10/2026. Sửa chữ ở lượt 1 (da-sua): n4 và n109 ("Opus Zero" thành "Opus"), n20 (nấc tăng tốc 2–4 nhịp/phút), n24 ("khó gấp đôi" thành "khó hơn"), n36 và n43 (bỏ "thế kỷ 18"), n51 và n81 (ghi bản gốc ở Rê trưởng, Rê♭ trưởng), n54 (ô 12 tay phải còn chơi hai nốt), n63 (bỏ "tiếng kèn túi"), n70 (mô tả thế tay bài 6 đúng số ngón), n75 (Greensleeves: năm đăng ký 1580), n79 và n80 (bài 7: bậc 6, 7 nâng; các chỗ đổi thế), n94 (bài 9: ba chỗ đổi thế), n108 (mục Nguồn: danh sách bản nhạc đã đối chiếu). Chưa chắc (ket_qua null): n83, n84 (ký hiệu và kỹ thuật bàn đạp nối; trang Bàn đạp chưa chuyển, chưa có nguồn bậc 2) và hai khối nhạc: khối 7 (Amazing Grace, ô 6–9 khác bản Mutopia ở nhịp điệu) và khối 9 (Largo, không có bản phổ đọc được). Không tính là nhận định: tiêu đề mục; câu "Về các bản soạn" tính ở n3–n5; mô tả trang (cắt từ câu mở đầu). Khối abc: 11/11 qua tools/khuong-nhac.mjs; khối 1–6, 8, 10, 11 đúng; 7 và 9 chưa chắc. Điểm cần dispatcher quyết: (1) khối 7, 9 nên đối chiếu bằng bản phổ khác hoặc ghi "bản rút gọn" rõ hơn; (2) bài 4 gọi Si–Fa–Sol là "hợp âm át bảy" (thiếu quãng 5), đúng nhưng nên cân nhắc ghi chú; (3) bài 5 canon có chỗ va nhẹ giữa hai bè (n65). Hồ sơ đã khóa trỏ tới trang này (nhac-ly/04, bat-dau/lo-trinh-choi, bat-dau/moi-ngay, piano/lo-trinh, luyen-tai/choi-bang-tai, luyen-tai/nghe-tien-trinh, luyen-tai/index, nhac-ly/01, nhac-ly/03, nhac-ly/05): các chỗ đã kiểm đều khớp (tiêu đề từng bài, bảng lộ trình, số ngón khối 4 "5-3-1" và "5-2-1", Q: của ba bài đầu 80, 88, 88, khối bài 3 và bài 8, hợp âm bài 4): không thấy lệch. ve-site trỏ trang chưa chuyển (kiểm trên ../opus-zero/docs/): luyen-tap/choi-theo (n105), luyen-tap/metronome (n20), luyen-tap/thu-am và nhat-ky (n21), nghe-nhac/dvorak-9-largo (n88), piano/ban-dap (n83, n84), piano/gam, piano/hai-tay (n19: giữ tiêu đề "Sáu bậc ghép hai tay"), piano/hop-am-rai (n58), piano/nam-ngon (n9), piano/tac-pham/minuet-sol, schumann-album, piano/tac-pham-theo-cap, piano/tieng-dan (n42), tai-lieu-tham-khao. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có, ghi cho D3-L5: "canon", "nhịp lấy đà", "dấu nối", "thế tay" và tên các thế (thế Đô, thế Sol, thế Fa), "điểm neo", "gam thứ giai điệu", "hợp âm át bảy", "nốt đen chấm dôi", "nốt móc đơn", "nốt móc kép", "dấu hóa bất thường" (đã có), "hạ át âm" (đã có), "legato" (đã có), "bàn đạp vang" (đã có).'
doi_chu:
  - cu: Giai điệu là dân ca hoặc tác phẩm đã thuộc phạm vi công cộng. Phần tay trái (trừ bài 10) do Opus Zero soạn cho người mới, giữ hòa âm đơn giản nhất có thể. Bài 9 giữ nguyên giai điệu của Petzold nhưng giản lược tay trái; bản gốc đầy đủ hai tay có ở bài học Minuet Sol trưởng.
    moi: Giai điệu là dân ca hoặc tác phẩm đã thuộc phạm vi công cộng. Phần tay trái (trừ bài 10) do Opus soạn cho người mới, giữ hòa âm đơn giản nhất có thể. Bài 9 giữ nguyên giai điệu của Petzold nhưng giản lược tay trái; bản gốc đầy đủ hai tay có ở bài học Minuet Sol trưởng.
    ly_do: "n4 (da-sua): tên site đã đổi từ Opus Zero thành Opus (README, 23/10/2026)."
  - cu: Tăng tốc độ một nấc (khoảng 4 nhịp/phút) chỉ khi đã chơi đúng ba lần liên tiếp.
    moi: Tăng tốc độ một nấc (2–4 nhịp/phút) chỉ khi đã chơi đúng ba lần liên tiếp.
    ly_do: 'n20 (da-sua): khớp trang cũ luyen-tap/metronome ("tăng 2–4 BPM").'
  - cu: "Mỗi bài mất vài ngày đến vài tuần tùy người; Lộ trình piano năm đầu trải mười bài trong khoảng năm tháng đầu. Đừng sang bài mới khi bài cũ còn phải dừng giữa chừng: dừng lại nghĩa là tay chưa biết đường, và bài sau sẽ khó gấp đôi."
    moi: "Mỗi bài mất vài ngày đến vài tuần tùy người; Lộ trình piano năm đầu trải mười bài trong khoảng năm tháng đầu. Đừng sang bài mới khi bài cũ còn phải dừng giữa chừng: dừng lại nghĩa là tay chưa biết đường, và bài sau sẽ khó hơn."
    ly_do: 'n24 (da-sua): "khó gấp đôi" là con số không có nguồn.'
  - cu: 'Dân ca Pháp, thế kỷ 18. Đô trưởng. Học được: chơi hai tay mà mỗi lúc chỉ một tay "hát": tay phải hát đoạn đầu và đoạn cuối, tay trái hát đoạn giữa.'
    moi: 'Dân ca Pháp. Đô trưởng. Học được: chơi hai tay mà mỗi lúc chỉ một tay "hát": tay phải hát đoạn đầu và đoạn cuối, tay trái hát đoạn giữa.'
