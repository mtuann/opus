  - id: n56
    cau: "Học được ở bài 4: hợp âm ba nốt ở tay trái và đổi giữa hai hình: hợp âm chủ Đô – Mi – Sol (ngón 5-3-1) và hợp âm bảy át Si – Fa – Sol (ngón 5-2-1)."
    loai: dinh-nghia
    nguon:
      - omt-seventh
    ket_qua: da-sua
    ghi_chu: 'Đô – Mi – Sol là hợp âm chủ I của Đô trưởng. Si – Fa – Sol là hợp âm át bảy V7 (Sol – Si – Rê – Fa) thiếu quãng năm (Rê): vẫn có đủ nốt đặc trưng (Si là bậc 7, Fa là quãng bảy), cách đệm thông dụng; câu gọi là "hợp âm át bảy", chấp nhận. Khớp khối 4 và hồ sơ đã khóa bat-dau/lo-trinh-choi (tháng 2). Review D4-gom: chữ cũ: "hợp âm át bảy"; chữ mới: "hợp âm bảy át", thống nhất thuật ngữ với bài nhạc lý 11 (đã khóa, mục "Hợp âm bảy át (V7)") và hai-tuan-dau. Si – Fa – Sol là V7 của Đô trưởng thiếu quãng năm (OMT Seventh Chords: hợp âm bảy át = ba trưởng cộng bảy thứ). Nguồn wikibooks-hanschen không liên quan đến định nghĩa, thay bằng omt-seventh. Người gom (D4-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, encyclopedia.com, OMT, IMSLP chặn hay lỗi), không phải vì nguồn nói khác; giữ theo nguồn lượt 1 và review đã mở, ghi ở trên.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Tính theo nhạc lý: Đô–Mi–Sol ngón 5-3-1; Si–Fa–Sol (G7 thiếu Rê, thế đảo ba) ngón 5-2-1. Không cần nguồn ngoài (nguon rỗng chấp nhận vì là kiểm trực tiếp). (Người gom: lượt 2 tự kiểm bằng nhạc lý, không ghi trang đã mở nên chuyển thành khong-chac.)"
