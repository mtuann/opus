  - id: n36
    cau: Au clair de la lune là dân ca Pháp.
    loai: lich-su
    nguon:
      - manitoba-auclair
      - crem-auclair
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Dân ca Pháp, thế kỷ 18". Bỏ "thế kỷ 18": nguồn bậc 3 (Wikipedia) chỉ ghi là bài hát dân gian Pháp, gán lúc cho Lully (thế kỷ 17), lúc cho nhà soạn nhạc vô danh thế kỷ 18; không có nguồn bậc 1–2 đã mở để chọn thế kỷ. "Dân ca Pháp" chắc chắn. Review D4-gom: thêm nguồn bậc 2: Manitoba Education, Chansons folkloriques ("Au Clair de la Lune is a common French folk song"; tài liệu dẫn lại about.com) và lưu trữ CREM-CNRS (bản ghi Au clair de la lune ở Rouergue, Pháp). Mutopia chỉ có một bản cho guitar của Horetzky, không ghi xuất xứ. Giữ "dân ca Pháp".'
    luot_2: khong-chac
    luot_2_ghi_chu: Au clair de la lune là bài hát Pháp thế kỷ 18, tác giả vô danh (theo Wikipedia); chưa mở được nguồn bậc 1-2.
