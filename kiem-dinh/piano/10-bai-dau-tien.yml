  - cu: "Tay phải chơi ở quãng tám trên Đô giữa (ngón 1 trên Đô5). Ô 5–6 mở tay: ngón 5 vươn lên La. Ô 7–8 dời tay xuống để ngón 1 bắt Sol4. Tay trái giữ quãng 5 Đô–Sol (ngón 5 và 1) như tiếng kèn túi."
    moi: "Tay phải chơi ở quãng tám trên Đô giữa (ngón 1 trên Đô5). Ô 5–6 mở tay: ngón 5 vươn lên La. Ô 7–8 dời tay xuống để ngón 1 bắt Sol4. Tay trái giữ quãng 5 Đô–Sol (ngón 5 và 1) như một âm nền ngân dài."
