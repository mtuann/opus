  - cu: "Tay phải có ba thế: thế Sol (ngón 1 trên Sol4) cho câu 1 và câu 4, thế Đô (ngón 1 trên Đô5) cho câu 2, và đầu câu 3 dời tay để ngón 5 ở Sol5, ngón 2 ở Đô5. Đổi thế ở nốt dài, khi tay có thời gian chuẩn bị. Tay trái: một nốt trầm mỗi ô (Đô, Fa, Sol)."
    moi: "Tay phải đổi thế ba lần: câu 1 và câu 4 mở đầu bằng ngón 1 trên Sol4, rồi dời tay lên một nấc để ngón 3 rơi vào Đô5 và ngón 5 vào Mi5; câu 2 ở thế Đô (ngón 1 trên Đô5); đầu câu 3 dời tay để ngón 5 ở Sol5, ngón 2 ở Đô5. Đổi thế ở nốt dài, khi tay có thời gian chuẩn bị. Tay trái: một nốt trầm mỗi ô (Đô, Fa, Sol)."
    ly_do: "n70 (da-sua): số ngón của khối (Đô5 ngón 3, Mi5 ngón 5) không phải thế Sol như câu cũ nói; câu mới mô tả đúng số ngón đã ghi."
  - cu: "Giai điệu dân gian Anh, thế kỷ 16. La thứ, nhịp 6/8. Học được: cảm nhịp 6/8 (hai phách lớn, mỗi phách ba móc đơn) và dấu hóa bất thường: Sol♯ và Fa♯ không có trong hóa biểu mà ghi ngay trước nốt (xem Gam thứ)."
    moi: "Dân ca Anh; bài ca được đăng ký ở London năm 1580. La thứ, nhịp 6/8. Học được: cảm nhịp 6/8 (hai phách lớn, mỗi phách ba móc đơn) và dấu hóa bất thường: Sol♯ và Fa♯ không có trong hóa biểu mà ghi ngay trước nốt (xem Gam thứ)."
