    ghi_chu: 'chưa chắc: độ trễ của cuộc gọi video khiến chơi cùng lúc khó là hiểu biết chung nhưng chưa mở nguồn bậc 2 (nghiên cứu về độ trễ trong chơi nhạc từ xa); "không thể" mạnh. Đề xuất viết "khó chơi cùng lúc vì độ trễ" hay bỏ. Review D8-gom: Trinity College London (tài nguyên giáo viên, bậc 2): "The time delay makes it impossible for musicians to play together online", nên "không thể chơi cùng lúc" có nguồn. Thầy làm mẫu, máy đếm nhịp phía học trò là lời khuyên, cùng mục "accompaniments and metronomes" của trang ấy.'
