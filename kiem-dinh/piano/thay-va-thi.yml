  - id: n35
    cau: "Zoom: Settings → Audio, chọn Original sound for musicians, tắt Automatically adjust microphone volume; bật High-fidelity music mode nếu dùng mạng dây; nên dùng tai nghe, còn nếu nghe qua loa thì bật Echo cancellation."
    loai: quy-tac
    nguon:
      - berklee-zoom
    ket_qua: da-sua
    ghi_chu: 'Berklee Online (cập nhật 18/12/2025): "Ensure that the Automatically adjust microphone volume toggle is toggled off"; "Under the Microphone Modes header, select Original sound for musicians"; "If you are using a wired ethernet connection, check the box next to High-fidelity music mode… not recommended for wireless connections"; "If you are not using headphones… make sure the box next to Echo cancellation is checked". Review D8-gom: lượt 2 khong-chac ở Echo cancellation. Berklee (mở lại): "It is recommended to use headphones when performing"; "If you are not using headphones… make sure the box next to Echo cancellation is checked". Berklee không nói phải tắt khi dùng tai nghe, nên chữ "chỉ bật… khi dùng loa" nói quá; viết lại đúng theo Berklee. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac, nguồn https://oit.colorado.edu/node/26441, https://support.getacceptd.com/hc/en-us/articles/4409910357133-Best-Audio-Quality; Original sound, tắt Automatically adjust microphone volume (Acceptd), High-fidelity music mode với mạng dây (Zoom blog): khớp. Riêng Echo cancellation: Colorado khuyên luôn bật để tránh vọng, Acceptd cũng bật, cộng đồng Zoom nói tắt khi dùng tai nghe; không khớp với ''chỉ bật khi dùng loa''.'
    luot_2: dung
    luot_2_nguon: [ "https://online.berklee.edu/help/en_US/zoom/1793280-how-to-configure-zoom-audio-settings-for-music-performance" ]
    luot_2_ghi_chu: "Berklee Online: Settings > Audio > chọn 'Original sound for musicians'; tắt 'Automatically adjust microphone volume'; High-fidelity music mode chỉ khi dùng mạng dây ('not recommended for wireless connections'); nên dùng tai nghe, nếu dùng loa thì 'make sure the box next to Echo cancellation is checked'. Trang hỗ trợ Zoom (support.zoom.com) dựng bằng JavaScript, công cụ không đọc được chữ."
  - id: n36
    cau: Ứng dụng nào không có chế độ cho nhạc thì bộ lọc tiếng ồn có thể "nuốt" những nốt nhỏ và tiếng ngân.
