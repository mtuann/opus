nhan_dinh:
  - id: n1
    cau: Tiêu đề trang "Học với thầy và thi cấp", mục "## Thi cấp" (id thi-cap), mục "### ABRSM" có câu về chơi thuộc, hàng "Góc máy" trong bảng học trực tuyến và hộp "Grade nghĩa là gì trên site này" giữ nguyên như trang cũ, vì các trang đã khóa trỏ tới.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã grep kiem-dinh/: piano/cach-tap (n… liên kết tới thay-va-thi), hoc-thuoc-bieu-dien n4 ("mục ABRSM có câu về chơi thuộc"), the-loai (anchor #thi-cap), luyen-tap/thu-am (n14: bảng góc máy), thi-tau, choi-cung-nguoi-khac, lo-trinh, bat-dau/lo-trinh-choi, cap-nhat.yml (hộp Grade nghĩa là gì), piano/suc-khoe. Trên trang mới: title "Học với thầy và thi cấp"; "## Thi cấp" (id thi-cap theo id-cu.mjs); "### ABRSM"; dòng "| **Góc máy** |"; hộp ":::note[Grade nghĩa là gì trên site này]"; câu "Chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm trực tiếp; gam và hợp âm rải thì phải chơi thuộc" nguyên văn. Review D8-gom: trang hiện: title "Học với thầy và thi cấp", "## Thi cấp", "### ABRSM" với câu chơi thuộc nguyên văn (dòng 115), hàng "| **Góc máy** |" (dòng 65, khớp luyen-tap/thu-am n14: góc bên cạnh thấy vai, khuỷu tay, cổ tay, chân; góc từ trên), hộp ":::note[Grade nghĩa là gì trên site này]". Các sửa của review không chạm những chỗ này.'
    review: dung
  - id: n2
    cau: Các link nội bộ trong trang (lo-trinh, tu-the, cach-tap, thi-tau, suc-khoe, chon-dan, hoc-thuoc-bieu-dien, 10-bai-dau-tien, tac-pham/…, tac-pham-theo-cap, gam, luyen-tai, luyen-tap/thu-am, luyen-tap/nhat-ky, tai-lieu-tham-khao) trỏ tới trang có trong kế hoạch.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Mọi id có trong src/data/trang.yml (tests/link.test.mjs kiểm trên bản build; link tới trang chưa lên hiện "sắp có"). Link tới bài học tác phẩm (/opus/piano/tac-pham/<slug>/) có bản ghi trong src/data/tac-pham.yml (xem n4). Review D8-gom: mọi link nội bộ trỏ tới id có trong src/data/trang.yml hay bài có bản ghi trong tac-pham.yml (tests/link.test.mjs kiểm trên bản build).'
    review: dung
  - id: n3
    cau: 'Bảng hộp "Grade nghĩa là gì": Initial–chặng 1; Grade 1–2–chặng 2; Grade 3–chặng 3; Grade 4–5–chặng 4; Grade 6–chặng 5; Grade 7–8–chặng 6; sau Grade 8–chặng 7 ("Diploma trở lên"); tên chặng khớp cap-do.yml.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/data/cap-do.yml (khóa): nhan_grade/tuong_duong 1: trước Grade 1, 2: Grade 1–2, 3: Grade 3, 4: Grade 4–5, 5: Grade 6, 6: Grade 7–8, 7: Sau Grade 8 / diploma trở lên; tên Khởi đầu, Sơ cấp, Sơ trung cấp, Trung cấp, Trung cấp cao, Nâng cao, Sau Grade 8. Chữ ở cột đầu "Initial" cho chặng 1: cap-do.yml ghi "trước Grade 1" (Initial Grade của ABRSM nằm trước Grade 1: n5). Review D8-gom: src/data/cap-do.yml (đã khóa) nhan_grade 1–7: trước Grade 1, Grade 1–2, 3, 4–5, 6, 7–8, Sau Grade 8; tên Khởi đầu… Nâng cao khớp. Chặng 7 trong data tên "Sau Grade 8" (tuong_duong "diploma trở lên"); ô ghi "7. Diploma trở lên" lấy tuong_duong, như tiêu đề "Chặng 7. Sau Grade 8 (diploma trở lên)" của piano/lo-trinh đã khóa. Không đổi.'
    review: dung
  - id: n4
    cau: 'Bảng hộp Grade: bài ví dụ của mỗi chặng có chặng khớp src/data/tac-pham.yml: Minuet Sol trưởng và Schumann Op. 68 (chặng 2); Clementi Op. 36 số 1 và Arabesque (3); Prelude Đô trưởng BWV 846 và Für Elise (4); K. 545 và Träumerei (5); Pathétique chương 2 và Clair de lune (6); Ballade số 1 (7).'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Dữ liệu src/data/tac-pham.yml (chang): minuet-sol 2; schumann-album 2; clementi-sonatina 3; burgmuller-arabesque 3; bach-prelude-do 4; fur-elise 4; mozart-k545 5; schumann-traumerei 5; pathetique-adagio 6; debussy-clair-de-lune 6; chopin-ballade-1 7. Chữ cũ: hàng Grade 6 / chặng 5 ghi "K. 545, Invention số 1": Invention số 1 là chặng 4 theo dữ liệu (đã khóa D2-0, hồ sơ nói cần cập nhật theo bảng "Tác phẩm theo cấp độ"). Chữ mới: "K. 545, Träumerei" (chặng 5, Grade 6). Grade của bài khớp dữ liệu: Träumerei Grade 6, K. 545 Grade 6 (ABRSM 2027 & 2028 có Mozart K. 545 ở Grade 6, tr. 37 của PDF). Review D8-gom: src/data/tac-pham.yml: minuet-sol 2, schumann-album 2, clementi-sonatina 3, burgmuller-arabesque 3, bach-prelude-do 4, fur-elise 4, mozart-k545 5, schumann-traumerei 5, pathetique-adagio 6, debussy-clair-de-lune 6, chopin-ballade-1 7.'
    review: dung
  - id: n5
    cau: Grade là thang độ khó của các hội đồng thi Anh, từ Initial (trước Grade 1) đến Grade 8.
    loai: dinh-nghia
    nguon:
      - abrsm-prac-2728
      - trinity-piano
    ket_qua: dung
    ghi_chu: 'ABRSM Practical 2027 & 2028: "Initial Grade" (Entry Level Award, Entry 3) và Grade 1–8 ("available from Grade 1 to Grade 8, and in some subjects from Initial Grade"); Trinity: "graded exams from Initial to Grade 8".'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20&%202028.pdf", "https://trinitycollege.com/resource?id=9079" ]
    luot_2_ghi_chu: "Đề cương ABRSM: Initial Grade và Grade 1–8; Trinity: Initial đến Grade 8. Cả hai là hội đồng thi của Anh."
  - id: n6
    cau: Site dùng thang của ABRSM để ghi độ khó, và chia đường học thành 7 chặng.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "src/data/cap-do.yml (7 chặng, Grade ABRSM); piano/lo-trinh (đã khóa). Review D8-gom: src/data/cap-do.yml: 7 chặng, nhan_grade theo Grade ABRSM; piano/lo-trinh (đã khóa)."
    review: dung
  - id: n7
    cau: Chữ "≈ Grade N" trên các bài học là ước lượng độ khó, không có nghĩa bài nằm trong chương trình thi Grade N.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Cột grade trong src/data/tac-pham.yml ("Grade 5–6" v.v.) là ước lượng của site; hộp thông tin bài học hiện "≈". Khớp piano/tac-pham-theo-cap ("Cấp chỉ là ước lượng"). Review D8-gom: src/plugins/thanh-phan.mjs (dòng 323): chip cấp hiện "≈ Grade N"; tac-pham.yml grade là ước lượng; piano/tac-pham-theo-cap ghi "ước lượng của site".'
    review: dung
  - id: n8
    cau: ABRSM và Trinity College London là hai hội đồng thi của Anh.
    loai: ten
    nguon:
      - abrsm-prac-2728
      - trinity-piano
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hai hội đồng thi phổ biến nhất là ABRSM và Trinity College London, đều của Anh." "Phổ biến nhất" không có nguồn: đổi thành "Hai hội đồng thi của Anh được nói đến ở đây là ABRSM và Trinity College London." ABRSM: regulated by Ofqual, Qualifications Wales, CCEA (PDF 2027 & 2028, tr. 5); Trinity College London: "charity number England & Wales" (Piano Syllabus, tr. 2). Review D8-gom: giữ da-sua: lượt 2 dung, cùng điều với lượt 1.'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20&%202028.pdf", "https://trinitycollege.com/resource?id=9079" ]
    luot_2_ghi_chu: ABRSM (đăng ký ở Anh, Ofqual quản lý) và Trinity College London (Anh) xác nhận qua đề cương của hai bên.
  - id: n9
    cau: 'ABRSM có Initial Grade và Grade 1 đến Grade 8, với hai hình thức thi: Practical Grades và Performance Grades.'
    loai: dinh-nghia
    nguon:
      - abrsm-prac-2728
      - abrsm-perf-spec
    ket_qua: dung
    ghi_chu: 'Practical 2027 & 2028: "available from Grade 1 to Grade 8, and in some subjects from Initial Grade"; bảng chứng chỉ ghi "ABRSM Entry Level Award in Practical Music (Initial Grade)". Performance Grades "run alongside… Practical Grades" (Performance spec, tr. 12).'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf", "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20&%202028.pdf" ]
    luot_2_ghi_chu: "Đề cương 2027–2028: Practical Grades và Performance Grades, Initial Grade đến Grade 8."
  - id: n10
    cau: 'Practical Grades: 3 bài (mỗi bài từ một danh sách A, B, C), gam và hợp âm rải (chơi thuộc), thị tấu, kiểm tra nghe; thi trực tiếp với giám khảo.'
    loai: dinh-nghia
    nguon:
      - abrsm-prac-2728
    ket_qua: dung
    ghi_chu: 'PDF 2027 & 2028: "THREE PIECES: one chosen by the candidate from each of the three Lists, A, B and C"; "SCALES AND ARPEGGIOS: from memory"; "Sight-reading", "Aural tests"; "How is it assessed? Face-to-face exam".'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20&%202028.pdf" ]
    luot_2_ghi_chu: "Practical Grades: ba bài chọn từ ba danh sách A, B, C; gam và hợp âm rải (chơi thuộc); thị tấu; kiểm tra nghe; thi trực tiếp (face-to-face)."
  - id: n11
    cau: 'Performance Grades: 4 bài chơi liền một mạch, ít nhất một bài từ mỗi danh sách A, B, C, bài thứ tư lấy trong danh sách hoặc tự chọn; không có gam, thị tấu, kiểm tra nghe.'
    loai: dinh-nghia
    nguon:
      - abrsm-perf-2728
      - abrsm-perf-spec
    ket_qua: dung
    ghi_chu: 'Syllabus 2027 & 2028, "Selecting repertoire": "Candidates present four pieces in one continuous performance (without a break). They choose at least one piece from each of the three lists (A, B and C). The fourth piece can be from the repertoire lists or a piece of the candidate''s choice"; "Performance Grades are accessible exams, without the assessment of any supporting tests".'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf", "https://www.abrsm.org/sites/default/files/2026-04/00%20Performance%20Grades%20Qual%20Spec%20-%20Generic%20Parts%2020260130_Final.pdf" ]
    luot_2_ghi_chu: Bốn bài một mạch, ít nhất một bài từ mỗi danh sách A, B, C, bài thứ tư từ danh sách hoặc tự chọn; Performance Grades không đánh giá bài bổ trợ (gam, thị tấu, nghe).
  - id: n12
    cau: 'Performance Grades: tự quay video một lượt liền, không cắt ghép, rồi nộp trực tuyến.'
    loai: quy-tac
    nguon:
      - abrsm-perf-spec
    ket_qua: dung
    ghi_chu: 'Spec tr. 11: "performances are video recorded and submitted"; "performed and recorded in one continuous take and the recording must not be paused"; tr. 16 (vi phạm): "Submitting a video of the performance that has not been made in one single take or that has been edited in some other way".'
    luot_2: dung
    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2026-04/00%20Performance%20Grades%20Qual%20Spec%20-%20Generic%20Parts%2020260130_Final.pdf" ]
    luot_2_ghi_chu: Thi qua video, ghi hình một lượt liền, không ngắt, không cắt ghép (cắt ghép là vi phạm); nộp cho ABRSM chấm.
  - id: n13
