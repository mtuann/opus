    luot_2_nguon: [ "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf", "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Practical%20Grades%20Qualification%20Specification%202027%20&%202028.pdf", "https://www.abrsm.org/sites/default/files/2026-04/00%20Performance%20Grades%20Qual%20Spec%20-%20Generic%20Parts%2020260130_Final.pdf", "https://trinitycollege.com/resource?id=9079", "https://www.abrsm.org/sites/default/files/2023-11/Performance%20LRSM%20and%20FRSM%20Qualification%20Specification%20from%202024%20English.pdf" ]
    luot_2_ghi_chu: "Các tài liệu có thật và tên khớp: Performance Grades Piano Syllabus 2027 & 2028, Qualification Specification (Performance và Practical), Trinity Piano Syllabus (online edition 2/2026), ABRSM diplomas. Chưa mở được riêng tệp 'Practical Music Grades: Piano Syllabus 2025 & 2026' nhưng đề cương 2027–2028 nhắc đến."
