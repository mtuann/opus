ghi_chu: 'D8-L1 phần 1/2, lượt 1 (05/11/2026). Nguồn chính: hai PDF ABRSM Practical Grades Qualification Specification 2025 & 2026 và 2027 & 2028 (63 tr.), Music Performance Grades Piano Syllabus 2027 & 2028 và Qualification Specification (generic parts), Trinity Piano Syllabus (bản trực tuyến 02/2026), bản lưu Wayback Machine trang ABRSM diplomas; đã đọc PDF bằng PyMuPDF. Đã sửa: n4 (Invention số 1 chặng 4, thay bằng Träumerei ở hộp Grade), n8 (bỏ "phổ biến nhất"), n16 (hiệu lực 2025–2026 vs overlap đến 31/12/2027), n25–n26 (diploma: bỏ ngày 31/12/2023, "vẫn có giá trị", "độc tấu"), n28 (Trinity Việt Nam: hai nơi liên hệ), n32 (tên bộ phận năng khiếu ở hcmcons), n50 (mục Nguồn). Chưa chắc (null): n30, n31, n37, n51. Người giao cần: đồng bộ doi_chu; cân nhắc thêm Practical Grades Piano Syllabus 2027 & 2028 vào mục Nguồn; câu "Gam và hợp âm rải thì phải chơi thuộc" giữ nguyên chữ cho hoc-thuoc-bieu-dien n4.'
