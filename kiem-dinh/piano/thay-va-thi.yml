doi_chu:
  - cu: K. 545, Invention số 1
    moi: K. 545, Träumerei
    ly_do: Invention số 1 là chặng 4 theo dữ liệu (bach-invention-1); Träumerei (schumann-traumerei) là chặng 5, Grade 6. Chỉ hàng Grade 6 đổi.
  - cu: Hai hội đồng thi phổ biến nhất là ABRSM và Trinity College London, đều của Anh. Thông tin dưới đây đúng vào thời điểm viết; hội đồng thi thay đổi chương trình định kỳ, nên hãy luôn kiểm tra lại trên website của họ trước khi đăng ký.
    moi: Hai hội đồng thi của Anh được nói đến ở đây là ABRSM và Trinity College London. Thông tin dưới đây đúng vào thời điểm viết; hội đồng thi thay đổi chương trình định kỳ, nên hãy luôn kiểm tra lại trên website của họ trước khi đăng ký.
    ly_do: '"Phổ biến nhất" không có nguồn (n8 của hồ sơ).'
  - cu: 'Chương trình đổi định kỳ: chương trình piano 2027–2028 dùng được từ 1/1/2027; chương trình 2025–2026 vẫn có hiệu lực đến hết 31/12/2027. Trong năm 2027 bạn chọn được một trong hai, nhưng các bài trong danh sách phải lấy từ cùng một chương trình.'
    moi: 'Chương trình đổi định kỳ: chương trình piano 2027–2028 dùng được từ 1/1/2027. Trong năm 2027, các bài của chương trình 2025–2026 vẫn được chơi, đến hết 31/12/2027; bạn chọn một trong hai chương trình, và các bài phải lấy từ cùng một chương trình.'
    ly_do: 'PDF ABRSM 2027 & 2028, mục Overlap: bản đặc tả 2025 & 2026 hết hạn 31/12/2026; chỉ các bài của nó được chơi đến 31/12/2027, mọi bài phải cùng một chương trình.'
  - cu: 'ABRSM: ARSM dành cho người đã qua Grade 8, thi trực tiếp hoặc qua video; LRSM và FRSM theo định dạng mới từ 2024, nộp video một buổi độc tấu, yêu cầu đã có Grade 8 (của ABRSM hoặc của một hội đồng thi khác nằm trong danh sách ABRSM chấp nhận). Bằng DipABRSM đã ngừng nhận thi (hạn cuối 31/12/2023), nhưng những bằng đã cấp vẫn có giá trị.'
    moi: 'ABRSM: ARSM dành cho người đã qua Grade 8, thi trực tiếp (nơi có tổ chức) hoặc qua video; LRSM và FRSM theo định dạng mới từ 2024, nộp video buổi biểu diễn kèm tài liệu bổ trợ. Cả ba yêu cầu đã đỗ Grade 8 của ABRSM (Performance hoặc Practical), hay bằng tương đương của một hội đồng thi khác nằm trong danh sách ABRSM chấp nhận; với LRSM và FRSM, kinh nghiệm biểu diễn chuyên nghiệp được ABRSM duyệt trước cũng thay được Grade 8. Các bằng DipABRSM, LRSM và FRSM kiểu cũ đã được ABRSM ngừng.'
    ly_do: 'Bản lưu trang ABRSM diplomas (08/09/2025): "We have now withdrawn our previous DipABRSM, LRSM and FRSM diplomas (ending 2024)"; ngày 31/12/2023 và "đã cấp vẫn có giá trị" không có trong trang; ARSM cũng cần Grade 8 và có thi trực tiếp "nơi có tổ chức"; LRSM, FRSM nộp video kèm "supporting evidence". Review D8-gom: thêm lối thay Grade 8 bằng kinh nghiệm chuyên nghiệp (đặc tả LRSM, FRSM 2024).'
  - cu: Trang dành cho Việt Nam trên website Trinity liệt kê các kỳ thi âm nhạc và nhạc lý, cùng thông tin liên hệ một trung tâm thi ở Hà Nội.
    moi: Trang dành cho Việt Nam trên website Trinity liệt kê các kỳ thi (có âm nhạc và nhạc lý), cùng thông tin liên hệ của đại diện Trinity tại Việt Nam.
    ly_do: Trang Trinity Vietnam (05/11/2026) ghi hai nơi liên hệ (Hà Nội, TP. HCM) và nhiều loại kỳ thi (Music, Theory of Music, Rock & Pop…); viết chung cho bền.
  - cu: Ba cơ sở đào tạo âm nhạc chuyên nghiệp lớn có đào tạo piano là Học viện Âm nhạc Quốc gia Việt Nam (Hà Nội), Nhạc viện Thành phố Hồ Chí Minh và Học viện Âm nhạc Huế. Các trường này đào tạo nhạc công chuyên nghiệp, nhiều hệ bắt đầu từ khi học sinh còn nhỏ; một số có trung tâm bồi dưỡng năng khiếu hoặc lớp ngắn hạn (Nhạc viện TP. Hồ Chí Minh chẳng hạn có Trung tâm Bồi dưỡng Năng khiếu Âm nhạc). Chương trình thay đổi theo năm, nên hãy hỏi trực tiếp phòng đào tạo về lớp cho người lớn.
    moi: Trong các cơ sở đào tạo âm nhạc chuyên nghiệp ở Việt Nam có Học viện Âm nhạc Quốc gia Việt Nam (Hà Nội), Nhạc viện Thành phố Hồ Chí Minh và Học viện Âm nhạc Huế; hai trường đầu có khoa Piano. Các trường này đào tạo nhạc công chuyên nghiệp; một số có trung tâm bồi dưỡng năng khiếu hoặc lớp ngắn hạn (Nhạc viện TP. Hồ Chí Minh chẳng hạn có bộ phận Năng khiếu âm nhạc). Chương trình thay đổi theo năm, nên hãy hỏi trực tiếp phòng đào tạo về lớp cho người lớn.
    ly_do: 'hcmcons.vn ghi "Thông tin thư viện và Năng khiếu âm nhạc" và "Website Năng khiếu âm nhạc"; không thấy tên "Trung tâm Bồi dưỡng Năng khiếu Âm nhạc". Review D8-gom: bỏ "ba… lớn" và "nhiều hệ bắt đầu từ khi học sinh còn nhỏ" (không có nguồn bậc 2); chỉ ghi khoa Piano ở hai trường có nêu trên trang chủ.'
  - cu: 'ABRSM, Music Performance diplomas: ARSM, LRSM, FRSM và lịch ngừng DipABRSM.'
    moi: 'ABRSM, Music Performance diplomas: ARSM, LRSM, FRSM và việc ngừng các bằng cũ.'
    ly_do: Khớp câu đã sửa ở mục Sau Grade 8 (không còn ngày 31/12/2023).
  - cu: 'Trên Zoom, vào Settings → Audio: chọn Original sound for musicians, tắt Automatically adjust microphone volume; bật High-fidelity music mode nếu dùng mạng dây; chỉ bật Echo cancellation khi dùng loa thay vì tai nghe. Ứng dụng nào không có chế độ cho nhạc thì bộ lọc tiếng ồn có thể "nuốt" những nốt nhỏ và tiếng ngân'
    moi: 'Trên Zoom, vào Settings → Audio: chọn Original sound for musicians, tắt Automatically adjust microphone volume; bật High-fidelity music mode nếu dùng mạng dây; nên dùng tai nghe, còn nếu nghe qua loa thì bật Echo cancellation. Ứng dụng nào không có chế độ cho nhạc thì bộ lọc tiếng ồn có thể "nuốt" những nốt nhỏ và tiếng ngân'
    ly_do: 'Review D8-gom: theo Berklee Online (khuyên dùng tai nghe; dùng loa thì bật Echo cancellation), bỏ "chỉ".'
  - cu: Với ABRSM, nhiều trung tâm âm nhạc trong nước giới thiệu lớp luyện thi. Hãy kiểm tra lịch thi, địa điểm và cách đăng ký trực tiếp trên website ABRSM, nhất là với các kỳ thi trực tiếp (Practical Grades).
    moi: Với ABRSM, hãy kiểm tra lịch thi, địa điểm và cách đăng ký trực tiếp trên website ABRSM, nhất là với các kỳ thi trực tiếp (Practical Grades).
    ly_do: "Review D8-gom: bỏ câu về trung tâm luyện thi trong nước (không có nguồn)."
