    cau: "ABRSM: ARSM dành cho người đã qua Grade 8, thi trực tiếp (nơi có tổ chức) hoặc qua video; LRSM và FRSM theo định dạng mới từ 2024, nộp video buổi biểu diễn kèm tài liệu bổ trợ; cả ba yêu cầu đã đỗ Grade 8 ABRSM (Performance hoặc Practical) hay bằng tương đương của hội đồng thi khác trong danh sách ABRSM chấp nhận; với LRSM và FRSM, kinh nghiệm biểu diễn chuyên nghiệp được ABRSM duyệt trước cũng thay được Grade 8."
    loai: quy-tac
    nguon:
      - abrsm-dip-wb
      - abrsm-lrsm-2024
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "LRSM và FRSM theo định dạng mới từ 2024, nộp video một buổi độc tấu, yêu cầu đã có Grade 8 (của ABRSM hoặc của một hội đồng thi khác nằm trong danh sách ABRSM chấp nhận)." Bản lưu trang ABRSM (08/09/2025): "New LRSM and FRSM from 2024"; ARSM: "A digital exam assessed from a video recording… A face-to-face exam – if these are available in your country"; LRSM, FRSM "digitally-assessed… you''ll need to arrange a video recording of your performance… supporting evidence"; "To enter for a Performance ARSM, LRSM or FRSM you must have passed ABRSM Grade 8 (Performance or Practical Grade)… In place of ABRSM Grade 8, we accept the equivalent qualification from… Trinity College London…". Chữ mới thêm "kiểm tra trực tiếp nơi có tổ chức", "kèm tài liệu bổ trợ", bỏ "độc tấu" (trang không dùng chữ này), nêu điều kiện cho cả ARSM. Review D8-gom: lượt 2 ghi chú: LRSM, FRSM còn cho thay Grade 8 bằng kinh nghiệm nghề nghiệp. Đã đọc bản đặc tả LRSM, FRSM 2024 (PDF): đúng, và phải được duyệt trước khi đăng ký. Thêm vế này để câu "cả ba yêu cầu…" không nói quá. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://www.abrsm.org/sites/default/files/2023-09/arsm-qualification-spec-march-2023-v2.pdf, https://www.abrsm.org/sites/default/files/2023-11/Performance%20LRSM%20and%20FRSM%20Qualification%20Specification%20from%202024%20English.pdf; ARSM: Grade 8 ABRSM (Practical hay Performance) hoặc bằng tương đương; thi trực tiếp hoặc số (video). LRSM/FRSM (từ 2024): digital, video buổi biểu diễn kèm phần viết hoặc video thuyết trình. Lưu ý nhỏ: LRSM/FRSM còn cho thay Grade 8 bằng kinh nghiệm nghề nghiệp phù hợp (câu không nhắc).'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20250908072910/https://www.abrsm.org/en-gb/other-assessments/diplomas/music-performance" ]
    luot_2_ghi_chu: "ABRSM (bản lưu 09/2025; abrsm.org trả lỗi chuyển hướng): ARSM 'A digital exam assessed from a video recording – available worldwide; A face-to-face exam – if these are available in your country'; LRSM, FRSM 'from 2024' là 'digitally-assessed', quay video buổi biểu diễn kèm 'a piece of supporting evidence'; 'To enter for a Performance ARSM, LRSM or FRSM you must have passed ABRSM Grade 8 (Performance or Practical Grade)' hay bằng tương đương của danh sách hội đồng được chấp nhận; 'You can also apply to offer Appropriate Professional Experience (APE) or Recognised Prior Learning (RPL) as a substitute for entry requirements'. Lưu ý: trang đặt câu APE/RPL sau điều kiện chung của cả ba bằng, không riêng LRSM, FRSM; câu của site hẹp hơn nguồn nhưng không sai."
