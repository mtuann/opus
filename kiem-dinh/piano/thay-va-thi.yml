    luot_2_ghi_chu: "Scoring Notes: bản cập nhật Zoom nói về chất lượng âm thanh, không giảm độ trễ; khó chơi ghép nhịp phức tạp qua Zoom. Lời khuyên cụ thể (đặt máy đếm nhịp phía bạn) là cách làm hợp lý, không có nguồn riêng."
