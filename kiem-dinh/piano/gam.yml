    cau: "Hình sau mục \"Cách đọc bảng\" (::hinh{ten=\"ngon-gam\"}) vẽ mười hai bàn phím nhỏ theo thứ tự của \"Bảng ngón bấm 12 gam trưởng\" (Đô, Sol, Rê, La, Mi, Si, Fa♯ = Sol♭, Rê♭ = Đô♯, La♭, Mi♭, Si♭, Fa): mỗi bàn phím tô tám nốt của gam một quãng tám đi lên và ghi số ngón tay phải (hình tròn), tay trái (hình vuông) trên từng phím, đúng từng ô của cột \"Tay phải\", \"Tay trái\"; số trong ngoặc của bảng vẽ viền đứt, chú thích ghi số ấy chỉ dùng ở đầu mút của gam (nốt cao nhất của tay phải, nốt thấp nhất của tay trái)."
