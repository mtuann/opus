    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 07/11/2026: HTML trong dist/<trang>/index.html), module dựng hình và ảnh chụp 360 và 1280 px. src/scripts/ve-piano-3.js (NGON_GAM chép nguyên 12 dòng của bảng, hinhNgonGam dùng veBanPhim của đợt hình 1). tests/piano-3.test.mjs so NGON_GAM với bảng trong trang từng ô, so cột \"Ngón 4 tay phải/trái\" với nốt có ngón 4 (không kể số trong ngoặc) và đọc lại số ngón từng phím trong SVG. Câu chú thích về số trong ngoặc lấy từ gạch đầu \"Số trong ngoặc\" của \"Cách đọc bảng\". Soát hình 3A (gộp review và kiểm mẫu): đối chiếu trên bản xem (npm run build:xem 07/11/2026, dist/<trang>/index.html). 12 bàn phím đúng thứ tự bảng; đọc lại từng số ngón hai tay trên từng phím trong SVG: khớp từng ô cột Tay phải, Tay trái; 14 số trong ngoặc (tay phải: (5) ở Đô, Sol, Rê, La, Mi, Si, (4) ở Fa; tay trái: (5) ở Đô, Sol, Rê, La, Mi, Fa, (4) ở Si) viền đứt đúng nốt đầu mút; cột Ngón 4 hai tay khớp nốt mang ngón 4. Đúng."
    review: dung
