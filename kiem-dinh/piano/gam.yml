ghi_chu: 'Lượt 1 trang Gam và ngón bấm (lô D4-L2, phần A). Nguồn đã mở: Evansville Scale and Arpeggio Fingerings, PianoScales.org (gam trưởng và thứ hòa âm, bậc 3, chỉ đối chiếu), Fitch Nimble Chromatics, Hanon bản scan (số 39, bài 32–36), ABRSM. Mục Nguồn viết lại theo các nguồn này (bỏ Palmer-Manus-Lethco, Sándor, ABRSM tập in: chưa mở). Chỉ có một sửa chữ (da-sua): n30 (bỏ Trinity); chưa chắc (ket_qua null): n17 (gam thứ giai điệu), n29 (mốc gợi ý theo trình độ). Hình tĩnh luon-ngon.html: lời chú "ngón cái luồn dưới bàn tay, sang Fa" (tay phải) đúng; lời chú tay trái "ngón 3 vắt qua ngón cái, sang La" đúng, nhưng aria-label ghi "ngón cái luồn dưới bàn tay từ Đô sang Fa" và "ngón 3 vắt qua ngón cái từ Mi sang La" (không đồng nhất với nhãn "Sol" trên hình và với bảng ngón: ngón cái chơi Đô rồi nhảy tới Fa trong khi ngón 2, 3 chơi Rê, Mi; ngón 3 vắt sang La sau khi ngón cái chơi Sol): người giao nên sửa aria-label thành "…luồn dưới bàn tay, ngón 3 chơi Mi rồi ngón cái chơi Fa" và "…sau Sol (ngón cái), ngón 3 vắt qua sang La". Chữ chú thích dưới hình ("Khi đi xuống thì ngược lại…") đúng. Ngoài ra không lỗi. So hồ sơ khóa trước: nhac-ly/06-gam-truong.yml (bảng 12 gam trưởng và mục Cách tập: giữ, có; cả hai câu về luồn ngón cái/vắt ngón: có), 07-gam-thu.yml (tiêu đề "Gam và ngón bấm", mục Gam thứ hòa âm, mục "Vòng quãng năm mỗi tuần" với tuần 1 Đô – La thứ: có), 08-hoa-bieu.yml ("Mỗi giọng có một hình phím đen – phím trắng riêng", Vòng quãng năm mỗi tuần: có), hai-tay.yml (trỏ tới Gam: có), 10-bai-dau-tien.yml (gam Đô trưởng ở tháng 3: có). Thuật ngữ chưa có trong thuat-ngu.yml (grep 28/10/2026): luồn ngón cái, vắt ngón, gam nửa cung (chromatic scale), ngón bấm (có "fingering"), gam thứ hòa âm, hóa biểu (có ở nhạc lý). Không còn chi tiết mau cũ (tên ứng dụng, giá, thiết bị) trong trang; "Graham Fitch" là tác giả được dẫn, không phải sản phẩm.'
doi_chu:
  - cu: Ngón 4 chỉ dùng một lần trong mỗi quãng tám. Vì vậy chỉ cần nhớ ngón 4 rơi vào nốt nào, phần còn lại tự suy ra.
    moi: "Ngón 4 chỉ dùng một lần trong mỗi quãng tám, không kể nốt mở đầu của gam: tay trái Si trưởng bắt đầu bằng ngón 4 trên Si rồi dùng ngón 4 lần nữa ở Fa♯ (từ quãng tám thứ hai, Si là ngón 1). Vì vậy chỉ cần nhớ ngón 4 rơi vào nốt nào, phần còn lại tự suy ra."
    ly_do: "n8 (da-sua, review D4-gom): lượt 2 chỉ ra Si trưởng tay trái 4 3 2 1 4 3 2 1 dùng ngón 4 hai lần trong quãng tám đầu (PianoScales)."
  - cu: "Si♭ trưởng: nhiều sách cho nốt Si♭ đầu tiên của tay phải dùng ngón 2 (2 1 2 3 1 2 3 4); từ quãng tám thứ hai trở đi, Si♭ luôn là ngón 4."
    moi: "Si♭ trưởng: một số bảng ngón bấm (như PianoScales) cho nốt Si♭ đầu tiên của tay phải dùng ngón 2 (2 1 2 3 1 2 3 4); từ quãng tám thứ hai trở đi, Si♭ luôn là ngón 4."
    ly_do: 'n13 (da-sua, review D4-gom): không có nguồn cho "nhiều sách"; PianoScales ghi Si♭ trưởng tay phải 2 1 2 3 1 2 3 4.'
  - cu: "Một số sách cho tay phải Fa♯ thứ và Sol♯ thứ bắt đầu bằng 2 3 thay vì 3 4, và Si♭ thứ bắt đầu bằng ngón 2: chỉ khác ở nốt đầu tiên. Gam thứ giai điệu (đi lên khác đi xuống) đổi ngón ở vài giọng; khi học đến, hãy theo sách gam bạn đang dùng."
    moi: "Một số bảng ngón bấm (như PianoScales) cho tay phải Fa♯ thứ và Sol♯ thứ bắt đầu bằng 2 3 thay vì 3 4, và Si♭ thứ bắt đầu bằng ngón 2: chỉ khác ở hai nốt đầu (Si♭ thứ: nốt đầu). Trang này chưa đưa ngón bấm gam thứ giai điệu (đi lên khác đi xuống); khi học đến, hãy theo bảng của sách gam bạn đang dùng."
    ly_do: 'n16 (da-sua, review D4-gom): 3 4 thành 2 3 là khác hai nốt đầu (PianoScales, Evansville). n17 (da-bo, review D4-gom): bỏ "đổi ngón ở vài giọng" vì không có nguồn bậc 1–2.'
  - cu: Các mốc trên là gợi ý của trang này để bạn tự đo tiến bộ, khớp với lộ trình của site. ABRSM và Trinity có danh sách gam, số quãng tám và tốc độ riêng cho từng cấp, và thay đổi theo chương trình. Nếu định thi, hãy tra chương trình hiện hành.
