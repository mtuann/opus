  - id: n31
    cau: "Hình đệm nốt trầm – hợp âm là một dạng bước nhảy hay gặp của tay trái: valse ở nhịp 3/4, nhịp chèo 6/8 của Thuyền ca Venice, và kiểu stride của jazz (lớn lên từ ragtime), khi nốt trầm ở phách mạnh xen với hợp âm."
    loai: quy-tac
    nguon:
      - cod-waltz
      - carnegie-stride
    ket_qua: da-sua
    ghi_chu: "chưa chắc: chưa mở nguồn về nhịp của valse, barcarolle (6/8, có bài ở 12/8 như Nocturne Op. 9 số 2 hay Barcarolle Op. 60) và stride (2/4, 4/4). Cần nguồn bậc 1–2. Review D4-gom: Concise Oxford Dictionary of Music (encyclopedia.com, mở 28/10/2026) waltz: \"Dance in 3/4 time\"; Carnegie Hall, Timeline of African American Music, Stride Piano (mở 28/10/2026): \"an outgrowth of ragtime\", tay trái \"alternating between a bass note (on the strong first and third beats of each measure)\" và hợp âm. Không có nguồn cho \"barcarolle ở 6/8\" nói chung (Chopin Barcarolle ở 12/8) và \"stride ở 2/4\", \"gặp nhiều nhất\": bỏ. Thuyền ca Venice 6/8 là câu về site (../opus-zero/docs/piano/tac-pham/mendelssohn-thuyen-ca.md dòng 6, 16). Chữ cũ: \"là bước nhảy gặp nhiều nhất: valse ở nhịp 3/4, nhịp chèo của barcarolle ở 6/8, và kiểu **stride** ở 2/4 như trong ragtime, khi tay nhảy đi nhảy về trên từng phách.\" Chữ mới: \"là một dạng bước nhảy hay gặp của tay trái: valse ở nhịp 3/4, nhịp chèo 6/8 của [Thuyền ca Venice](…), và kiểu **stride** của jazz (lớn lên từ ragtime), khi nốt trầm ở phách mạnh xen với hợp âm và tay nhảy đi nhảy về trên từng phách.\" Cần lượt 2 bổ sung cho chữ mới."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/stride-style", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/barcarolle" ]
    luot_2_ghi_chu: "Britannica: stride, tay trái đánh nốt trầm ở phách mạnh rồi hợp âm, lớn lên từ ragtime. Barcarolle là thuyền ca (gondolier Venice, 6/8 là đặc trưng nhịp chèo); valse 3/4 là chuẩn."
