nhan_dinh:
  - id: n1
    cau: Trang đi từ thế tay quãng tám qua staccato, legato, quãng tám lặp và gam quãng tám, đến cách tập bước nhảy ở cả hai tay, kèm sáu bài tập và một bảng tập theo lộ trình.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Trang có các mục tương ứng và đúng sáu khối abc (bài 1 đến 6); bảng "Tập theo chặng" có. Review: đã kiểm câu mở đầu (dòng 6) khớp các mục Thế tay quãng tám, Quãng tám staccato, Quãng tám legato, Quãng tám lặp, Gam quãng tám, Bước nhảy (tay trái, tay phải), sáu khối abc (Bài 1–6), bảng "## Tập theo chặng".'
    review: dung
  - id: n2
    cau: Quãng tám là khoảng cách giữa hai nốt cùng tên, ví dụ Đô4 – Đô5.
    loai: dinh-nghia
    nguon:
      - omt-intervals
    ket_qua: dung
    ghi_chu: "Đã kiểm ở kiem-dinh/nhac-ly/09-quang.yml (n1): cách một quãng tám là quãng 8."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/" ]
    luot_2_ghi_chu: "OMT: đồng âm quãng tám là 'pitches that share a letter name but are separated by one or more octaves'; Đô4–Đô5 là quãng tám."
  - id: n3
    cau: "Hai nốt của một quãng tám luôn cùng màu phím: cả hai phím trắng, hoặc cả hai phím đen."
    loai: quy-tac
    nguon:
      - omt-intervals
    ket_qua: dung
    ghi_chu: "Suy trực tiếp từ bàn phím: hai nốt cùng tên cách nhau 12 phím và mẫu màu phím lặp theo chu kỳ 12 (không cần nguồn ngoài; lượt 2 tự kiểm). Review D4-gom: thêm nguồn: OMT Intervals (quãng tám đúng là hai nốt cùng tên, 12 nửa cung); mẫu phím trắng – đen lặp lại mỗi 12 nửa cung, nên hai nốt của quãng tám cùng màu phím. Lượt 2 dung."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/" ]
    luot_2_ghi_chu: "Hai nốt cùng tên (quãng tám) luôn cùng loại phím: Đô–Đô cùng trắng; Rê♭–Rê♭ cùng đen. Suy ra từ OMT (cùng tên, cách nhau quãng tám)."
  - id: n4
    cau: "Ngón bấm quãng tám: phím trắng 1–5; phím đen 1–4 nếu tay đủ rộng, vì ngón 4 dài hơn và với tới phím đen (nằm sâu hơn) dễ hơn ngón 5; nếu ngón 4 phải căng mới tới thì dùng 1–5."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên bấm ngón (các nhận xét về độ dài ngón và vị trí phím đen đi kèm lời khuyên).
  - id: n5
    cau: "Khung bàn tay quãng tám: hai điểm chạm là cạnh đầu ngón cái và đầu ngón 5 (hoặc 4); ngón 2, 3, 4 hơi cong, nổi trên mặt phím mà không bấm; bàn tay hơi vòm; đặt tay sâu vào trong ở đoạn có cả phím trắng và đen."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên về thế tay.
  - id: n6
    cau: Giữ tay mở căng suốt một đoạn dài làm mỏi tay; nên khép tay một chút giữa hai quãng tám.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"Giữ tay mở căng suốt một đoạn dài là nguyên nhân mỏi tay hàng đầu.\" Không có nguồn cho \"nguyên nhân hàng đầu\". BAPAM: \"Avoid excessive stretches\", \"avoid any technique involving repetition at the stretch for more than short periods\". Sửa lời: bỏ \"hàng đầu\"."
    luot_2: dung
    luot_2_nguon: [ "https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf" ]
    luot_2_ghi_chu: "BAPAM: 'Look out for resting points and practise minimising tension between repetitive octaves or large chords'. Khép tay giữa hai quãng tám là cách thực hiện hợp lý."
  - id: n7
    cau: "Phép thử khung tay: đặt một quãng tám Đô, giữ phím bằng lực vừa đủ, lắc nhẹ cổ tay lên xuống và sang ngang; cổ tay lắc được mà hai phím không bật lên là khung tay vừa vững vừa mềm."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tự kiểm.
  - id: n8
    cau: "Công cụ bàn phím ::cong-cu (piano, C4–C6) tô bốn nốt C4, C5, F♯4, F♯5: hai quãng tám, một trên phím trắng và một trên phím đen."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Chỉ thị ::cong-cu{ten=\"piano\" range=\"C4-C6\" notes=\"C4 C5 F#4 F#5\"}: C4–C5 cùng là phím trắng, F♯4–F♯5 cùng là phím đen, đều nằm trong C4–C6. Review kiểm trên bản xem và module công cụ (src/scripts/ban-phim.js). Review: đã kiểm dòng 17 ::cong-cu{ten=\"piano\" range=\"C4-C6\" notes=\"C4 C5 F#4 F#5\"} và module src/plugins/thanh-phan.mjs (bàn phím tô nốt)."
    review: dung
  - id: n9
    cau: "Tay nhỏ: nếu chỉ vừa với tới quãng tám, đừng ép; dùng 1–5 cả trên phím đen, chơi bằng cạnh ngón cái, đừng giữ tay mở giữa các quãng tám; với đoạn quãng tám dày đặc, hỏi thầy cách bỏ bớt một nốt nhân đôi hoặc chuyển nốt sang tay kia."
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: dung
    ghi_chu: "BAPAM: người tay nhỏ phải cẩn thận để không gắng quá sức, tránh duỗi quá mức. Phần \"1–5 trên phím đen\", \"bỏ bớt nốt nhân đôi\" là lời khuyên đi kèm."
    luot_2: dung
    luot_2_nguon: [ "https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf", "https://www.livingpianos.com/articles/how-to-finger-octaves/" ]
    luot_2_ghi_chu: "BAPAM: người tay nhỏ cẩn thận không căng quá; livingpianos: 1-5 trên phím trắng, 1-4 trên phím đen 'unless very large hands'. Ý 1–5 cả trên phím đen cho tay nhỏ và bỏ bớt nốt nhân đôi: lời khuyên chấp nhận được, không nguy hại, có hỏi thầy."
  - id: n10
    cau: "Ngón tay chỉ là điểm chạm: sức nặng đến từ cánh tay, độ nảy từ cổ tay, hướng đi do vai và cẳng tay dẫn; ba động tác làm nên mọi kiểu quãng tám."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả sư phạm về chuyển động, không nêu số liệu.
  - id: n11
    cau: "Rơi và nảy: cánh tay thả rơi từ vài phân trên phím, hai ngón chạm đáy phím cùng lúc, cổ tay nảy lên như lò xo; phần \"nảy\" quan trọng ngang phần \"rơi\" vì nhả lực ngay khi nốt đã kêu."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên kỹ thuật; liên kết tới tieng-dan (đã chuyển, mục về nhả lực sau khi nốt kêu).
  - id: n12
    cau: "Xoay cẳng tay: lăn qua lại giữa ngón cái và ngón út như vặn nắm cửa; đây là động tác của quãng tám gãy, khi hai nốt chơi luân phiên."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên kỹ thuật; liên kết tới tu-the (đã chuyển).
  - id: n13
    cau: "Không bao giờ khóa cổ tay: cổ tay là bộ giảm xóc; hãy giữ nó linh hoạt, không gồng khuỷu, vai và cổ tay."
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"cổ tay cứng thì mọi cú đánh dội ngược lên cẳng tay và vai, tiếng đàn gắt và bước nhảy trượt.\" Cơ chế \"dội ngược lên cẳng tay và vai\" không có nguồn. BAPAM: \"no clenching of elbow, shoulder or wrist\". Giữ phần BAPAM, bỏ cơ chế."
    luot_2: dung
    luot_2_nguon: [ "https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf", "https://www.livingpianos.com/articles/how-to-finger-octaves/" ]
    luot_2_ghi_chu: "BAPAM: động tác 'tension-free'; livingpianos: 'the wrists accomplish octaves, but the arms have an essential role'. Câu 'không bao giờ khóa cổ tay' là cách nói mạnh nhưng đúng hướng, không gây hại."
  - id: n14
    cau: "Bài 1 (rơi và nảy): ô 1–2 tay phải quãng tám Đô, Rê, Mi, Rê; ô 3–4 tay trái; ô 5–6 ghép hai tay; mf, mỗi quãng tám nốt đen xen dấu lặng."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Khối 1: tay phải [Cc] [Dd] [Ee] [Dd] ô 1–2, tay trái [C,C] [B,,B,] [A,,A,] [B,,B,] ô 3–4, hai tay ô 5–6; mỗi ô 4 phách có dấu lặng sau mỗi nốt. Khớp văn bản. Review D4-gom (soát nhãn): mô tả bài tập do trang soạn; đổi cau-truc thành ve-site. Review: đã kiểm khối abc 1 (4/4, L:1/4): tay phải ô 1–2 [Cc] z [Dd] z | [Ee] z [Dd] z, !mf!; tay trái ô 3–4; hai tay ô 5–6; mỗi ô đủ 4 phách."
    luot_2: khong-chac
    luot_2_ghi_chu: "Bài soạn riêng: không mở khuông nên không kiểm được số ô, quãng tám Đô-Rê-Mi-Rê, mf, dấu lặng."
    review: dung
  - id: n15
    cau: Tiếng phải tròn, không có tiếng "cạch" của phím đập đáy; chỉ ghép hai tay (ô 5–6) khi từng tay đã mềm; trong dấu lặng bàn tay khép lại và nổi trên phím.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n16
    cau: "Staccato cổ tay: cẳng tay gần như yên, bàn tay vẫy từ cổ tay, ngón sát phím; nhỏ, nhanh, nhẹ, hợp với p. Staccato cánh tay: cả cẳng tay rơi và nảy; lớn và nặng, hợp với f và nốt nhấn."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên kỹ thuật.
    luot_2: dung
    luot_2_nguon: [ "https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf" ]
    luot_2_ghi_chu: "Staccato cổ tay (nhỏ, nhanh, nhẹ) và staccato cánh tay (lớn, nặng): cách phân loại dạy phổ biến; BAPAM nhấn mạnh giảm căng. Hợp lý."
  - id: n17
    cau: "Bài 2 (gam quãng tám, cổ tay rồi cánh tay): ô 1–2 (và 5–6 tay trái) cổ tay, p; ô 3–4 (và 7–8) cánh tay, f; khi đã quen, chơi gam Rê trưởng với Fa♯ và Đô♯ bằng 1–4."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Khối 2: tay phải ô 1–2 gam Đô một quãng tám staccato !p!, ô 3–4 Đô–Mi–Sol–Đô quãng tám !f!; tay trái ô 5–8 tương ứng; Fa♯ và Đô♯ là hai phím đen của gam Rê trưởng, hợp quy tắc 1–4. Mỗi ô đủ 8 móc đơn. Review D4-gom (soát nhãn): đổi cau-truc thành ve-site. Review: đã kiểm khối abc 2 (4/4, L:1/8): tay phải ô 1–2 \"cổ tay\" !p!, ô 3–4 \"cánh tay\" !f!; tay trái ô 5–8 như thế; mỗi ô đủ 8 móc đơn; dòng 71 khớp; Fa♯, Đô♯ là phím đen nên dùng 1–4 theo quy tắc dòng 12."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.livingpianos.com/articles/how-to-finger-octaves/" ]
    luot_2_ghi_chu: "Bài soạn riêng: không mở khuông nên không kiểm số ô, p/f. Phần ngón: gam Rê trưởng với Fa♯ và Đô♯ dùng 1–4 khớp quy tắc 1-5 trắng, 1-4 đen (livingpianos)."
    review: dung
  - id: n18
    cau: "Legato quãng tám là một ảo giác dựng từ ba thứ: bè trên nối bằng ngón, luân phiên 5 và 4 (ngón 4 thường nhận phím đen, ngón 5 phím trắng; hai phím trắng liền nhau thì một phím dùng ngón 4, như Sol – La ở bài 3; tay lớn thêm 3), ngón cái trượt từ phím đen xuống phím trắng liền cạnh, tai và bàn đạp lấp chỗ hở bên dưới; ở bè trầm legato quãng tám gần như hoàn toàn nhờ bàn đạp; tay trái thì ngược lại."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
