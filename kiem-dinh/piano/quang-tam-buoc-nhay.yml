doi_chu:
  - cu: Khép tay giữa hai quãng tám. Sau mỗi cú đánh, bàn tay khép lại một chút trong lúc di chuyển, rồi mới mở ra ở nốt sau. Giữ tay mở căng suốt một đoạn dài là nguyên nhân mỏi tay hàng đầu.
    moi: Khép tay giữa hai quãng tám. Sau mỗi cú đánh, bàn tay khép lại một chút trong lúc di chuyển, rồi mới mở ra ở nốt sau. Giữ tay mở căng suốt một đoạn dài làm mỏi tay.
    ly_do: 'n6 (da-sua): bỏ "nguyên nhân hàng đầu" (không có nguồn); BAPAM: tránh duỗi quá mức.'
  - cu: Không bao giờ khóa cổ tay. Cổ tay là bộ giảm xóc; cổ tay cứng thì mọi cú đánh dội ngược lên cẳng tay và vai, tiếng đàn gắt và bước nhảy trượt.
    moi: "Không bao giờ khóa cổ tay. Cổ tay là bộ giảm xóc: hãy giữ nó linh hoạt, không gồng khuỷu, vai và cổ tay."
    ly_do: 'n13 (da-sua): bỏ cơ chế "dội ngược lên cẳng tay và vai, tiếng gắt, bước nhảy trượt" (không có nguồn); giữ lời BAPAM.'
  - cu: "Bè trên nối bằng ngón: ngón 5 trên phím trắng, ngón 4 trên phím đen. Vì phím đen cao và nằm sâu, ngón 4 vắt qua ngón 5 lên phím đen, hay ngón 5 luồn dưới ngón 4 xuống phím trắng, đều khá dễ. Tay lớn dùng thêm ngón 3 trên phím đen."
    moi: "Bè trên nối bằng ngón, luân phiên ngón 5 và 4: ngón 4 thường nhận phím đen, ngón 5 phím trắng; hai phím trắng liền nhau thì một phím dùng ngón 4 (như Sol – La ở bài 3). Vì phím đen cao và nằm sâu, ngón 4 vắt qua ngón 5 lên phím đen, hay ngón 5 luồn dưới ngón 4 xuống phím trắng, đều khá dễ. Tay lớn dùng thêm ngón 3 trên phím đen."
    ly_do: "n18 (da-sua, review D4-gom): khớp quy tắc với khối abc 3 (ngón 4 trên Sol cạnh La)."
  - cu: "Tai và bàn đạp: người nghe theo bè trên; bàn đạp lấp chỗ hở bên dưới khi phong cách cho phép. Ở bè trầm, legato quãng tám gần như hoàn toàn nhờ bàn đạp, như các quãng tám trầm của Ánh trăng."
    moi: "Tai và bàn đạp: tai người nghe có xu hướng ưu tiên bè cao nhất (Trainor và cộng sự, 2014; xem Nguồn); bàn đạp lấp chỗ hở bên dưới khi phong cách cho phép. Ở bè trầm, legato quãng tám gần như hoàn toàn nhờ bàn đạp, như các quãng tám trầm của Ánh trăng."
    ly_do: "n19 (da-sua, review D4-gom): viết theo Trainor và cộng sự (2014)."
  - cu: "Hình đệm nốt trầm – hợp âm (xem Hợp âm và hình đệm) là bước nhảy gặp nhiều nhất: valse ở nhịp 3/4, nhịp chèo của barcarolle ở 6/8, và kiểu stride ở 2/4 như trong ragtime, khi tay nhảy đi nhảy về trên từng phách."
    moi: "Hình đệm nốt trầm – hợp âm (xem Hợp âm và hình đệm) là một dạng bước nhảy hay gặp của tay trái: valse ở nhịp 3/4, nhịp chèo 6/8 của Thuyền ca Venice, và kiểu stride của jazz (lớn lên từ ragtime), khi nốt trầm ở phách mạnh xen với hợp âm và tay nhảy đi nhảy về trên từng phách."
    ly_do: "n31 (da-sua, review D4-gom): theo Concise Oxford (waltz) và Carnegie Hall (stride); bỏ phần không có nguồn."
  - cu: "Quãng tám và bước nhảy là lúc nhiều người bắt đầu đau tay (xem Giữ đôi tay khỏe). Tập quãng tám thành vài đợt 3–5 phút xen việc nhẹ tay; tập mf cho tới khi tay thả lỏng hẳn rồi mới thêm f. Đau, tê hay căng ở cẳng tay, cổ tay, khuỷu: dừng ngay, không chơi xuyên cơn đau; đau trở lại thì đi khám."
    moi: "Quãng tám lặp và bước nhảy dễ làm mỏi tay nếu tập lâu hoặc gồng, nên giảm gồng giữa các quãng tám (xem Giữ đôi tay khỏe). Tập quãng tám thành các đợt ngắn xen nghỉ (BAPAM gợi ý các đợt 20 phút tập xen 10 phút nghỉ); tập mf cho tới khi tay thả lỏng hẳn rồi mới thêm f. Đau, tê hay căng ở cẳng tay, cổ tay, khuỷu: dừng ngay, không chơi xuyên cơn đau; đau trở lại thì đi khám."
    ly_do: 'n40 (da-sua): bỏ "nhiều người bắt đầu đau tay" (không số liệu); thay bằng lời BAPAM.; n41 (da-sua): thay "3–5 phút xen việc nhẹ tay" (không có nguồn) bằng gợi ý BAPAM 20 phút tập, 10 phút nghỉ.; n41 (da-sua, review D4-gom): con số có nguyên văn trên bapam.org.uk (The Healthy Pianist).'
  - cu: Tay trái của Nocturne Op. 9 số 2; bè trầm Impromptu Sol♭ ô 25–52
    moi: Tay trái của Nocturne Op. 9 số 2
    ly_do: "n46 (da-sua, review D4-gom): không kiểm được quãng tám ở bè trầm Impromptu Sol♭ ô 25–52."
  - cu: "Xa hơn nữa: Czerny, 6 Octave Studies (Sáu étude quãng tám) Op. 553; Theodor Kullak, Die Schule des Octavenspiels (Trường phái chơi quãng tám) Op. 48; Étude Op. 25 số 10 của Chopin, étude quãng tám cho cả hai tay. Chủ đề Étude Op. 10 số 12 cũng đi bằng quãng tám ở tay phải (hướng dẫn nghe)."
    moi: "Xa hơn nữa: Czerny, 6 Octave Studies (Sáu étude quãng tám) Op. 553; Theodor Kullak, Die Schule des Octavenspiels (Giáo trình chơi quãng tám) Op. 48; Étude Op. 25 số 10 của Chopin, étude quãng tám cho cả hai tay. Chủ đề Étude Op. 10 số 12 cũng đi bằng quãng tám ở tay phải (hướng dẫn nghe)."
