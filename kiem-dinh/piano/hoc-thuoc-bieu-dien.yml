    ghi_chu: 'Đã có trên site: ban-dap.md ("Bàn đạp"), tieng-dan.md. Chưa chuyển, đã kiểm ../opus-zero/docs/luyen-tap/: thu-am.md ("# Thu âm buổi tập"), nhat-ky.md ("# Nhật ký luyện tập"), metronome.md ("# Máy đếm nhịp"). Lô chuyển giữ các trang ấy.'
  - id: n43
    cau: "Khởi động trước biểu diễn: làm ấm tay, xoay vai, vài gam và hợp âm rải chậm ở giọng của bài, chơi thật chậm phần mở đầu từng đoạn; đừng chơi cả chương trình ở tốc độ diễn ngay trước giờ lên sân khấu, đừng kiểm tra đi kiểm tra lại đoạn khó nhất."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập; Chang III.14 ("mild warm-up exercises… can be beneficial"; tránh gắng sức nặng trước).
  - id: n44
    cau: "Quy tắc số một khi biểu diễn: giữ nhịp, không quay lại; nhạc dừng giữa chừng làm hỏng cả mạch bài nhiều hơn một nốt sai."
    loai: khuyen-tap
    nguon:
      - chang-14
    ket_qua: da-sua
    ghi_chu: 'Chang III.14: "Another way to play through mistakes is to at least keep the rhythm." Câu cũ: "Phần lớn người nghe không nhận ra một nốt sai, nhưng ai cũng nhận ra khi nhạc dừng." Khẳng định về cảm nhận của người nghe, Chang không nói (đã đọc III.15: "Not covered"); viết lại thành lời khuyên và sửa cả lời giải thích câu hỏi 5 (n68).'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.14.html" ]
    luot_2_ghi_chu: "Chang III.14: khi quên, đừng cố bắt đầu lại đúng chỗ quên, giữ nhịp ổn định."
  - id: n45
    cau: 'Bảng "Nếu… thì…": sai một nốt thì bỏ qua đi tiếp; tay phải lạc đường thì tay trái giữ khung hòa âm đúng nhịp; quên hẳn thì nhảy đến điểm xuất phát gần nhất phía sau và vào lại đúng nhịp; nhịp bị vội thì nghĩ đến phách mạnh, thở ra, chơi câu kế tiếp nhỏ hơn và rộng hơn.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập; Chang III.14: khi quên "restart from a section you know well, preferably a later one", "keep the rhythm"; nhịp vội vì hồi hộp: "Inexperienced performers often play too fast…".'
  - id: n46
    cau: 'Kế hoạch "chơi tiếp" cũng phải tập: trong một lần diễn thử, nhờ ai đó vỗ tay bất chợt; nghe tiếng vỗ tay thì nhảy ngay đến điểm xuất phát kế tiếp và chơi tiếp, giữ nguyên nhịp.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n47
    cau: "Hồi hộp trước khi biểu diễn rất phổ biến; nó gắn với adrenaline, chất giúp con người thoát khỏi nguy hiểm: tim có thể đập nhanh và cơ căng lên."
    loai: dinh-nghia
    nguon:
      - chang-15
      - brooks
      - nhs-gad
    ket_qua: da-sua
    ghi_chu: "Brooks 2014 (tóm tắt): \"People often feel nervous before tasks like public speaking\". Chang III.15: hồi hộp gắn với \"a flow of adrenalin\"; \"fear helps us to escape danger\". NHS (lo âu nói chung): triệu chứng gồm \"a more noticeable or unusual heartbeat (palpitations)\" và \"feeling tense\". Nguồn không chuyên về nhạc công; câu đã bỏ các vế không có nguồn. Câu cũ: \"Hồi hộp… rất phổ biến, kể cả ở nghệ sĩ chuyên nghiệp; nó cho thấy bạn coi trọng việc mình làm. Cơ thể đọc tình huống 'nhiều người đang nghe mình' như một mối đe dọa và bật phản ứng chiến hay chạy: adrenaline tăng, tim đập nhanh, thở nông, tay run hoặc lạnh, đầu óc dễ trống rỗng. Phản ứng ấy có ích khi cần chạy trốn, nhưng không hợp với mười ngón tay…\": \"kể cả ở nghệ sĩ chuyên nghiệp\", \"coi trọng việc mình làm\", \"chiến hay chạy\", \"thở nông, tay run hoặc lạnh, đầu óc trống rỗng\", \"không hợp với mười ngón tay\" đều bỏ (không có nguồn mở được; NHS không nhắc \"fight or flight\" và không nhắc thở hay run)."
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/anxiety-fear-panic/" ]
    luot_2_ghi_chu: 'NHS: lo âu giải phóng adrenaline, tim đập nhanh hơn hoặc rõ hơn; "cơ căng lên" không thấy trong trang này.'
  - id: n48
    cau: Người ít kinh nghiệm hay chơi nhanh hơn mức bài chịu được vì hồi hộp.
    loai: quy-tac
    nguon:
      - chang-14
    ket_qua: dung
    ghi_chu: 'Chang III.14: "Inexperienced performers often play too fast for their skill level because of nervousness during the recital." (Câu cũ có thêm "khó chơi nhỏ, tiếng cứng": đã bỏ, xem n47.)'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.14.html" ]
    luot_2_ghi_chu: 'Chang III.14: "Inexperienced performers often play too fast for their skill level because of nervousness".'
  - id: n49
    cau: "Chuẩn bị kỹ và diễn thử nhiều lần: diễn thử cho bạn thêm kinh nghiệm và sự tự tin, và hai thứ ấy làm bớt nỗi sợ điều chưa biết."
    loai: quy-tac
    nguon:
      - chang-15
    ket_qua: da-sua
    ghi_chu: 'Chang III.15: "Mock recitals will give you more experience and confidence; both will reduce the fear of the unknown." Câu cũ: "Không kỹ thuật thở nào thay được việc biết chắc rằng bạn đã chơi trọn bài này trước người khác nhiều lần." Là ý kiến, không có nguồn; thay bằng ý của Chang.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.15.html" ]
    luot_2_ghi_chu: "Chang III.15: diễn thử cho thêm kinh nghiệm và tự tin."
  - id: n50
    cau: Trong một thử nghiệm ngẫu nhiên với 46 nhạc công, chỉ một buổi tập thở chậm dài 30 phút đã giúp điều hòa phản ứng sinh lý khi chờ biểu diễn; những người vốn rất lo âu thì giảm lo âu nhiều hơn nhóm không tập (Wells và cộng sự, 2012).
    loai: so-lieu
    nguon:
      - wells
    ket_qua: dung
    ghi_chu: 'PLOS ONE: 46 nhạc công, thiết kế ngẫu nhiên có đối chứng, một buổi 30 phút, hai nhóm thở chậm (6 nhịp thở/phút) và nhóm không can thiệp; nhóm thở chậm cải thiện chỉ số biến thiên nhịp tim (HF, LF/HF) trong 5 phút chờ biểu diễn; chung cả nhóm không giảm lo âu tự báo, nhưng ở người lo âu nền cao thì nhóm can thiệp giảm lo âu nhiều hơn nhóm chứng ("slow breathing is particularly helpful for musicians with high levels of anxiety"). Tác giả ghi hạn chế: mẫu nhỏ, một buổi.'
    luot_2: dung
    luot_2_nguon: [ "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0046597" ]
    luot_2_ghi_chu: "Wells et al. 2012 PLoS ONE 7(10) e46597: 46 nhạc công, một buổi 30 phút; nhóm lo âu cao giảm lo âu nhiều hơn (n=15 so với n=7). Can thiệp là HRV biofeedback/thở chậm."
  - id: n51
    cau: "Thở ra chậm: hít vào khoảng 4 nhịp đếm, thở ra từ từ khoảng 6 nhịp (khoảng sáu nhịp thở mỗi phút), trong vài phút trước khi lên sân khấu."
    loai: khuyen-tap
    nguon:
      - wells
    ket_qua: da-sua
    ghi_chu: 'Lời khuyên; 4+6 nhịp là một chu kỳ khoảng 10 giây, tức khoảng sáu nhịp thở mỗi phút, đúng tốc độ thở chậm của thử nghiệm Wells (6 nhịp/phút). Câu cũ có "bằng mũi": thử nghiệm không nói; bỏ.'
  - id: n52
    cau: Trong các thí nghiệm của Alison Wood Brooks (2014) với hát karaoke, nói trước người khác và làm toán, những người tự nhủ "Tôi đang hào hứng" làm tốt hơn những người cố tự trấn an "Bình tĩnh lại".
    loai: so-lieu
    nguon:
      - brooks
    ket_qua: dung
    ghi_chu: 'Tóm tắt (OpenAlex): nhiều nghiên cứu về hát karaoke, nói trước đám đông và làm toán; người "recast their arousal as excitement" thấy hào hứng hơn và làm tốt hơn người cố bình tĩnh; thậm chí chỉ cần nói "I am excited" thành tiếng. Tóm tắt không có chữ "I am calm" mà chỉ nói "trying to calm down": câu "Bình tĩnh lại" là cách diễn đạt gần nghĩa. Năm: JEP General 143(3), 2014 (đăng trực tuyến 12/2013).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://api.crossref.org/works/10.1037/a0035325" ]
    luot_2_ghi_chu: Crossref xác nhận J Exp Psychol Gen 143(3), 1144-1158, 2014; không đọc được tóm tắt nên không kiểm được ba nhiệm vụ và nhóm "calm down".
  - id: n53
    cau: "Tim đập nhanh là năng lượng: đừng cố dập nó, hãy dùng nó."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên; ý của Brooks (n52).
  - id: n54
    cau: 'Đặt sự chú ý vào âm nhạc: trước mỗi đoạn, nghĩ đến tính cách của nó bằng một hai chữ ("dịu dàng", "rộn ràng"), giống các điểm mốc ở phần trên; nghĩ về âm thanh muốn tạo ra, không phải về ngón tay.'
    loai: khuyen-tap
    nguon:
      - chang-15
    ket_qua: da-sua
    ghi_chu: 'Chang III.15: "Playing musically, of course, is always the answer" (tập trung vào biểu cảm âm nhạc). Câu cũ: "…giống các mốc diễn tả của Chaffin": đã bỏ phân loại bốn mốc của Chaffin (n19), nên đổi thành "các điểm mốc ở phần trên".'
    luot_2: dung
    luot_2_ghi_chu: Khuyên tập hợp lý, không có hại.
  - id: n55
    cau: "Một nghi thức cố định: cùng một bài khởi động, cùng một chuỗi việc trước khi đặt tay lên phím (chỉnh ghế, thở ra, nghe câu đầu)."
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ có thêm: "Nghi thức quen làm tình huống lạ bớt lạ." Là giải thích tâm lý không có nguồn; bỏ.'
  - id: n56
    cau: 'Uống rượu bia "cho bớt run": rượu làm giảm khả năng điều khiển tinh và phán đoán.'
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi mục "Những điều nên tránh": khẳng định về tác động của rượu không có nguồn (NHS "risks of drinking too much" chỉ nói "misjudging risky situations", không nói điều khiển tinh hay lo âu; Chang III.15 không nói tới rượu). Lời khuyên sức khỏe nên không xếp khuyen-tap.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/live-well/alcohol-advice/the-risks-of-drinking-too-much/", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/anxiety-fear-panic/" ]
    luot_2_ghi_chu: 'NHS: rượu, ma túy là cách không nên dùng để giảm lo âu; uống nhiều gây đánh giá sai tình huống. "Giảm điều khiển tinh" là hệ quả chung, chưa thấy câu riêng trong các trang NHS đã mở.'
  - id: n57
    cau: "Không nên tự dùng thuốc chẹn beta hay xin của người khác: một số nhạc công dùng theo đơn bác sĩ, nhưng đó là thuốc kê đơn, không dùng được cho một số người (chẳng hạn người bị hen suyễn)."
    loai: quy-tac
    nguon:
      - nhs-beta
      - chang-15
    ket_qua: dung
    ghi_chu: 'NHS Beta blockers: "They are only available on prescription"; liệt kê vấn đề hô hấp như hen suyễn là lý do thuốc "may not be suitable"; dùng cho cả lo âu. Chang III.15: có người cho rằng Inderal, Atenolol làm dịu hồi hộp khi có bác sĩ giám sát. NHS không nhắc "lo âu biểu diễn" riêng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/beta-blockers/", "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.15.html" ]
    luot_2_ghi_chu: "NHS: thuốc chẹn beta chỉ bán theo đơn, có thể không phù hợp với người bị hen; Chang III.15 nhắc Inderal, Atenolol dùng dưới giám sát bác sĩ."
  - id: n58
    cau: Nên tránh thay đổi vào phút chót, tập quá nhiều trong ngày diễn, quá nhiều cà phê.
    loai: khuyen-tap
    nguon:
      - chang-14
      - chang-15
    ket_qua: da-sua
    ghi_chu: 'Chang III.14: "within the last week, adding new material or making changes in the piece (such as fingering) is not recommended"; III.15: cà phê, trà làm hồi hộp tệ hơn. "Tập quá nhiều trong ngày diễn" là lời khuyên của site. Câu cũ có thêm "bỏ bữa": bỏ (không có nguồn, lời khuyên dinh dưỡng).'
  - id: n59
    cau: 'Thay vì tự nhủ "đừng sai", "đừng run", hãy nói điều bạn muốn làm: "hát câu đầu", "giữ nhịp".'
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ có thêm: "câu đó hướng sự chú ý đúng vào lỗi." Giải thích tâm lý không có nguồn; bỏ, giữ lời khuyên.'
  - id: n60
    cau: Nếu hồi hộp khiến bạn khổ sở, né mọi dịp chơi cho người khác nghe, mất ngủ hoặc có những cơn hoảng sợ, hãy nói chuyện với bác sĩ hoặc chuyên gia tâm lý.
    loai: quy-tac
    nguon:
      - bapam-hr
      - nhs-gad
    ket_qua: da-sua
    ghi_chu: 'BAPAM liệt kê tài liệu "Managing Performance Anxiety", "Psychological Self-Care", "Mental Health Support" cho người biểu diễn; NHS: mất ngủ ("difficulty sleeping") là triệu chứng lo âu. Câu cũ: "…né mọi dịp… trong nhiều tháng, mất ngủ nhiều ngày trước buổi diễn… hãy nói chuyện với chuyên gia tâm lý": ngưỡng "nhiều tháng", "nhiều ngày" không có nguồn, bỏ; thêm "bác sĩ" vì BAPAM và NHS đều đưa người có triệu chứng tới bác sĩ trước. Lời khuyên sức khỏe nên không xếp khuyen-tap.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/anxiety-fear-panic/" ]
    luot_2_ghi_chu: "NHS: đi khám bác sĩ khi khó đối phó với lo âu, sợ hãi, hoảng sợ."
  - id: n61
    cau: Liệu pháp nhận thức – hành vi (CBT) là một hướng điều trị thường dùng cho lo âu.
    loai: quy-tac
    nguon:
      - nhs-cbt
    ket_qua: da-sua
    ghi_chu: 'NHS CBT: "anxiety, including social anxiety, phobias and obsessive compulsive disorder (OCD)". Câu cũ: "…thường được dùng cho lo âu biểu diễn": NHS không nhắc lo âu biểu diễn; bỏ chữ "biểu diễn".'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/talking-therapies-medicine-treatments/talking-therapies-and-counselling/cognitive-behavioural-therapy-cbt/overview/" ]
    luot_2_ghi_chu: "NHS: CBT là điều trị được khuyến nghị cho nhiều vấn đề, gồm lo âu xã hội, ám ảnh sợ."
  - id: n62
    cau: Trong vòng 24 giờ sau buổi diễn, ghi vào nhật ký luyện tập ba điều làm tốt, hai điều cần cải thiện, một thay đổi cho lần sau; hôm sau mới nghe bản ghi.
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ có thêm: "thường bạn chơi tốt hơn mình tưởng." Khẳng định không có nguồn; bỏ.'
  - id: n63
    cau: "Bảng sau buổi diễn: quên ở chỗ rẽ nhánh (đoạn chỉ có trí nhớ vận động; phân tích chỗ rẽ, tập hai phiên bản liền nhau); vấp ở đoạn khó cả khi tập một mình (bài chưa chắc; chuẩn bị lâu hơn hay chọn bài vừa sức hơn); chỉ vấp khi có người nghe (chưa quen áp lực; diễn thử nhiều hơn); nhanh hơn hẳn lúc tập (adrenaline; bật máy đếm nhịp vài giây trước mỗi lần diễn thử rồi tắt)."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập (chẩn đoán); Chang III.14 về tốc độ vì hồi hộp.
  - id: n64
    cau: "Những sân khấu nhỏ, đi từng bậc: thu âm cho riêng mình rồi gửi bạn; chơi cho gia đình (hẹn giờ, xếp chỗ, cúi chào); hòa nhạc tại gia 4–8 người, mỗi người 5–10 phút; chia sẻ bản thu ở diễn đàn và nhóm người lớn học piano; buổi biểu diễn của lớp, của trung tâm (hỏi xem học trò người lớn có tham gia được không, hỏi thầy); không gian cộng đồng (viện dưỡng lão, trường học, quán cà phê có đàn, xin phép trước), rồi kỳ thi và hòa nhạc thật."
    loai: khuyen-tap
    nguon: []
