    cau: "Bảng chuẩn bị cho buổi biểu diễn: 6–8 tuần trước chọn bài đã chơi chắc, thấp hơn khả năng hiện tại; 4 tuần trước diễn thử lần đầu, quay video, đánh dấu điểm nhảy; 2–3 tuần trước diễn thử 2–3 lần mỗi tuần có người nghe, thử một cây đàn khác; 1 tuần trước chốt ngón bấm, tốc độ, sắc thái, tập chậm nhiều hơn, tổng duyệt; ngày trước tập nhẹ, chạy bài trong đầu, ngủ đủ; ngày diễn ăn nhẹ, làm ấm tay, khởi động 10–15 phút, đến sớm thử đàn và chỉnh ghế."
