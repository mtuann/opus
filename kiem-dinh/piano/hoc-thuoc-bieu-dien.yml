nhan_dinh:
  - id: n1
    cau: Chơi thuộc lòng và chơi cho người khác nghe đều là kỹ năng có thể tập.
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "…đều là kỹ năng tập được, không phải năng khiếu trời cho." Vế "không phải năng khiếu trời cho" là khẳng định về bản chất kỹ năng, không có nguồn trực tiếp về chơi thuộc hay biểu diễn (tóm tắt Ericsson 1993 nói về chuyên môn nói chung); bỏ vế ấy, giữ lời trấn an. Sửa cả mô tả (description).'
  - id: n2
    cau: Trang giải thích các loại trí nhớ của người chơi đàn, vì sao "thuộc tay" chưa đủ, cách xây và kiểm tra trí nhớ bền, cách chuẩn bị cho buổi diễn và sống chung với hồi hộp.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: "Bốn loại trí nhớ", "Vì sao thuộc tay thôi là mong manh", "Tám cách xây trí nhớ bền", "Chuẩn bị cho buổi biểu diễn", "Hồi hộp khi biểu diễn".'
  - id: n3
    cau: Trong kỳ thi Practical Grades của ABRSM (theo chương trình hiện hành), chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm riêng; chỉ gam và hợp âm rải là bắt buộc chơi thuộc.
    loai: cap-do
    nguon:
      - abrsm
    ket_qua: da-sua
    ghi_chu: 'ABRSM Qualification Specification: Practical Music Piano 2025 & 2026, mục Playing from memory (tr. 13): "Candidates may perform any of their pieces from memory"; "No extra marks are directly awarded for playing from memory."; "Memory: All requirements must be played from memory." (scales and arpeggios). Câu cũ chỉ nói "Trong kỳ thi ABRSM" và "không được cộng điểm trực tiếp"; theo ghi chú bảng tầng, bỏ tên chương trình 2025 & 2026, thêm "Practical Grades" (hình thức thi trực tiếp: đã đối chiếu ở đề cương Practical; Performance Grades chưa kiểm) và trỏ sang trang Học với thầy và thi cấp. "Hiện hành" đúng đến khi ABRSM đổi chương trình: người giao nhớ rà khi đổi kỳ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được đề cương ABRSM hiện hành (trang HTML và PDF đều không tải được từ máy kiểm).
  - id: n4
    cau: "Liên kết Học với thầy và thi cấp (/opus/piano/thay-va-thi/): trang ấy có mục ABRSM nói về chơi thuộc."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: Trang đích chưa chuyển; đã kiểm ../opus-zero/docs/piano/thay-va-thi.md ("# Học với thầy và thi cấp"; mục "### ABRSM" có dòng "Chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm trực tiếp; gam và hợp âm rải thì phải chơi thuộc"). Lô chuyển giữ đúng điều ấy (và đổi tên chương trình thành "hiện hành" cho nhất quán với n3); trang ấy còn nhắc 2025 & 2026 ở mục Nguồn.
  - id: n5
    cau: "Có những nghệ sĩ lớn vẫn chơi với bản nhạc trên giá: những năm cuối sự nghiệp, Sviatoslav Richter biểu diễn trong khán phòng gần như tối, chỉ một ngọn đèn nhỏ chiếu lên bản nhạc trước mặt."
    loai: lich-su
    nguon:
      - gramophone
      - dg-richter
    ket_qua: da-sua
    ghi_chu: 'Gramophone (Plaistow, 10/1997), nói về các buổi diễn cuối ở London: "By then he had retreated into darkness and was almost invisible as he played"; ông chỉnh "an angle poise lamp at his side so that the only light on the platform fell on the music-rest". Deutsche Grammophon: "In his last years he preferred to play in darkness, with just one lamp on the piano to light the music"; "always playing from the score". Câu cũ có thêm "Trong nhạc thính phòng, nghệ sĩ gần như luôn đặt bản nhạc trên giá": không có nguồn, bỏ; thay bằng câu nói chung về nghệ sĩ lớn. Nguồn nói "bóng tối" và "một ngọn đèn", không nói "khán phòng", nên "khán phòng gần như tối" là cách diễn đạt gần nghĩa.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chỉ tìm thấy Wikipedia (Richter chơi nơi phòng tối với một đèn nhỏ chiếu bản nhạc, dẫn Monsaingeon, Notebooks and Conversations tr. 108); không có nguồn bậc 2 mở được.
  - id: n6
    cau: Vẫn nên học thuộc ít nhất vài bài. Khi mắt không bận đọc, bạn có thể dành chú ý cho tai nghe tiếng đàn của mình và cho mắt nhìn tay ở những bước nhảy xa.
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "…tai nghe tiếng đàn của chính mình rõ hơn hẳn và mắt theo được tay ở những bước nhảy xa." "Rõ hơn hẳn" là khẳng định không có nguồn; viết lại thành khả năng, giữ lời khuyên.'
  - id: n7
    cau: Muốn thuộc bền thì phải hiểu bài được xây thế nào.
    loai: quy-tac
    nguon:
      - chang
    ket_qua: dung
    ghi_chu: 'Chang III.6, mục j: "theoretical memory has deeper associations because theory leads to a better understanding of the music" (đã đọc, qua tóm tắt công cụ đọc web).'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.6.html" ]
    luot_2_ghi_chu: "Chang III.6: nhớ theo cụm, đoạn logic, không nhớ từng nốt."
  - id: n8
    cau: Hiểu biết về cấu trúc bài vẫn cứu bạn khi chơi với bản nhạc mà mắt lạc dòng.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n9
    cau: Lộ trình piano gợi ý học thuộc bài đầu tiên ở chặng 2 (/opus/piano/lo-trinh/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm src/content/docs/piano/lo-trinh.md: mục "Chặng 2. Sơ cấp (≈ Grade 1–2)", bảng, hàng "Biểu diễn": "Học thuộc một bài. Quay video chơi trọn 3 bài như một buổi hòa nhạc nhỏ."'
  - id: n10
    cau: Khi chơi thuộc, người chơi dùng nhiều loại trí nhớ cùng lúc; người chơi chắc có nhiều đường dẫn đến cùng một nốt nhạc, một đường bị chặn thì còn đường khác.
    loai: dinh-nghia
    nguon:
      - chang
      - chaffin
    ket_qua: dung
    ghi_chu: 'Chang III.6, mục j: "Practically everybody uses a combination of them"; các liên tưởng khiến "even if some of them are forgotten there are enough left"; "hand memory is always a good backup". Chaffin và Imreh 2002 (tóm tắt): trí nhớ của nghệ sĩ gồm "conceptual, motor, and auditory memory".'
    luot_2: khong-chac
    luot_2_ghi_chu: Cần bài Chaffin & Imreh 2002 (không mở được nội dung, chỉ thấy bản ghi Crossref).
  - id: n11
    cau: 'Bốn loại trí nhớ: vận động ("thuộc tay": chuỗi chuyển động của ngón và tay, hình thành qua lặp lại), thính giác (nghe trước trong đầu điều sắp vang lên), thị giác (hình ảnh trang nhạc hoặc hình bàn tay trên phím), phân tích (hiểu cấu trúc: đoạn, giọng, hợp âm, chỗ lặp, chỗ khác).'
    loai: dinh-nghia
    nguon:
      - chang
      - chaffin
    ket_qua: dung
    ghi_chu: 'Chang III.6 mục j liệt kê năm cách: hand memory ("acquired by simple repetition until the music is in the hands"), music memory (aural: "based on the music: the melody, rhythm, expression…"), photographic memory (visual: "picture the sheet music"), keyboard memory ("the sequence of keys and hand motions"), theoretical memory (hiểu lý thuyết). Bảng của site gom thành bốn (vận động, thính giác, thị giác, phân tích): đúng nghĩa các nhóm; tên "phân tích" là của site (Chang: "theoretical"; Chaffin và Imreh: "conceptual"). Thuật ngữ "trí nhớ vận động/thính giác/thị giác/phân tích" chưa có bản ghi thuat-ngu.yml (cho người giao).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.14.html" ]
    luot_2_ghi_chu: Chang III.14 chỉ bàn về trí nhớ tay; bốn loại trí nhớ cần nguồn khác (không mở được).
  - id: n12
    cau: 'Cột "Dấu hiệu" và "Cách củng cố" của bảng bốn loại trí nhớ: ngón bấm cố định, tập chậm đúng đều; hát hai bè, nghe bản thu mắt theo bản nhạc; nhìn kỹ từng trang rồi nhắm mắt hình dung; đặt tên các đoạn, viết khung hòa âm.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập (khớp các cách 1, 5, 6 và Chang III.6).
  - id: n13
    cau: Dễ chỉ dựa vào loại trí nhớ đầu tiên mà không biết; mục tiêu là có cả bốn, với trí nhớ phân tích làm bộ khung.
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Người tự học thường chỉ dùng loại đầu tiên mà không biết." "Người tự học thường" là khẳng định về một nhóm người, không có nguồn; viết lại thành lời cảnh báo.'
  - id: n14
    cau: "Trí nhớ vận động giống một chuỗi mắt xích: mỗi chuyển động gọi chuyển động tiếp theo; nó nhanh và không tốn sự chú ý nên không thể thiếu, nhưng có hai điểm yếu."
    loai: dinh-nghia
    nguon:
      - chang
    ket_qua: da-sua
    ghi_chu: "Chang III.6: hand memory \"is a reflex motion plus a brain reflex triggered by the piano's sound\", \"mostly hand memory which bypasses the brain\", \"always a good backup\". \"Chuỗi mắt xích\" là ví dụ so sánh của site. Câu cũ nói \"ba điểm yếu\": đã bỏ điểm yếu thứ hai (n16), nên sửa thành \"hai\"."
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.14.html" ]
    luot_2_ghi_chu: 'Chang III.14: trí nhớ tay dựa vào lặp lại và mỗi nốt gọi nốt sau; vế "nhanh, không tốn chú ý" không có trong nguồn.'
  - id: n15
    cau: 'Đứt một mắt là đứt cả chuỗi: một nốt sai, một tiếng ho, một ý nghĩ "đoạn sau là gì nhỉ?" và tay dừng; chuỗi chỉ chạy từ những chỗ bắt đầu quen thuộc nên phải quay lại đầu câu, có khi đầu bài.'
    loai: quy-tac
    nguon:
      - chang
      - chang-14
    ket_qua: dung
    ghi_chu: "Chang III.6 mục e: \"practice the art of starting play from anywhere in the piece\" (vì thường không bắt đầu được giữa bài); Chang III.14: sau khi quên, \"don't try to restart from where you blacked out unless you know exactly how to restart\". Ý chính khớp; \"tiếng ho\", \"ý nghĩ\" là minh họa của site."
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.6.html", "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.14.html" ]
    luot_2_ghi_chu: "Chang: quên giữa chừng thì không nên bắt đầu lại đúng chỗ quên, nên có điểm xuất phát quen thuộc để khởi động lại."
  - id: n16
    cau: "Nó không chịu được sự soi xét: khi hồi hộp, bạn bắt đầu để ý từng ngón tay, đúng điều mà chuỗi tự động không chịu nổi."
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ điểm yếu thứ hai: khẳng định về tâm lý (chú ý có ý thức làm hỏng chuỗi tự động) không có nguồn mở được (Chang không nói; các nghiên cứu về "choking under pressure" không mở được).'
    luot_2: khong-chac
    luot_2_ghi_chu: Không tìm được nguồn bậc 1-2 mở được cho cơ chế "không chịu soi xét".
  - id: n17
    cau: "Trí nhớ vận động phụ thuộc hoàn cảnh: đàn lạ, ghế lạ, tốc độ khác (thường nhanh hơn vì hồi hộp) đều làm chuỗi dễ trật đường."
    loai: quy-tac
    nguon:
      - chang-14
    ket_qua: dung
    ghi_chu: 'Chang III.14: "Can you adjust to a different piano – especially one that is out of tune or difficult to play?"; "Inexperienced performers often play too fast for their skill level because of nervousness during the recital." "Ghế lạ" là minh họa của site; nguồn nói về đàn lạ và tốc độ.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.14.html", "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.6.html" ]
    luot_2_ghi_chu: "Chang III.14: người ít kinh nghiệm chơi quá nhanh vì hồi hộp; III.6: đàn lạ, môi trường lạ ảnh hưởng trí nhớ."
  - id: n18
    cau: Nhà tâm lý học Roger Chaffin và nghệ sĩ piano Gabriela Imreh đã ghi lại và phân tích quá trình Imreh học chương cuối (Presto) của Italienisches Konzert (Concerto Ý), BWV 971, của Bach.
    loai: lich-su
    nguon:
      - chaffin
      - imslp-bwv971
    ket_qua: da-sua
    ghi_chu: "OpenAlex (tóm tắt Chaffin và Imreh 2002): \"A concert pianist recorded her practice while learning the third movement (Presto) of J.S. Bach's Italian Concerto.\" IMSLP: Italienisches Konzert, BWV 971, ba chương, chương 3 Presto. Câu cũ: \"Nhóm của nhà tâm lý học Roger Chaffin đã ghi lại…\": đổi thành tên hai tác giả bài báo (Chaffin và Imreh); không kiểm được vai trò \"nhóm\"."
    luot_2: khong-chac
    luot_2_nguon: [ "https://api.crossref.org/works/10.1111/1467-9280.00462" ]
    luot_2_ghi_chu: Crossref xác nhận bài Chaffin & Imreh 2002 nhưng không có tóm tắt; chi tiết Presto, BWV 971 không kiểm được.
  - id: n19
    cau: Imreh ghi lại việc tập, rồi mô tả cấu trúc bản nhạc và các quyết định về ngón bấm, phân câu và những điểm mốc (performance cues) bà chú ý tới lúc biểu diễn; các chỗ bà ngập ngừng khi chơi thuộc, và những chỗ bà còn nhớ hai năm sau, đều gắn với các điểm mốc ấy.
    loai: lich-su
    nguon:
      - chaffin
    ket_qua: da-sua
    ghi_chu: "Tóm tắt (OpenAlex): bà \"recorded her practice\", \"described the piece's formal structure and explained her decisions about fingering, phrasing, and the cues she attended to during performance\"; các báo cáo cho biết \"which spots caused hesitations when she first played from memory, and which affected her recall two years later\"; \"retrieval depended on performance cues\". Câu cũ: Người chơi chuyên nghiệp mang một bản đồ với bốn loại mốc (cấu trúc, diễn tả, diễn tấu, kỹ thuật), \"được chọn có chủ ý trong lúc tập\", và hai năm sau Imreh còn nhớ \"các mốc cấu trúc và diễn tả\". Không mở được toàn văn (Psychological Science, PubMed bị chặn), nên bỏ phân loại bốn mốc, \"chọn có chủ ý trong lúc tập\" và \"cấu trúc và diễn tả\"; chỉ giữ điều tóm tắt xác nhận."
    luot_2: khong-chac
    luot_2_nguon: [ "https://api.crossref.org/works/10.1111/1467-9280.00462" ]
    luot_2_ghi_chu: Như n18, không đọc được nội dung bài.
  - id: n20
    cau: "Với các điểm mốc, người chơi mang trong đầu một bản đồ của tác phẩm: chẳng hạn ranh giới các đoạn, cảm xúc muốn truyền đến người nghe, cách phân câu, một ngón bấm then chốt; ngón tay chạy tự động, còn đầu óc đi theo bản đồ; khi có sự cố, các điểm mốc là chỗ để bám lại."
