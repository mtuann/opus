khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - khoa
      - nhip
      - not
      - so-ngon
      - hop-am
    ket_qua: dung
    ghi_chu: "Tám ô nhịp, bốn điểm xuất phát: 4/4 L:1/8, hai khuông (RH treble, LH bass), K:C. Tay phải ô 1 E2 G2 c3 B = 8; ô 2 A2 F2 A2 c2 = 8; ô 3 G2 E2 G2 c2 = 8; ô 4 d2 B2 G4 = 8; ô 5 = ô 1; ô 6 = ô 2; ô 7 G2 B2 d2 B2 = 8; ô 8 c8 = 8. Tay trái ô 1, 3, 5 C, G, E, G, C, G, E, G, (I, tám móc); ô 2, 6 C, A, F, A, … (IV); ô 4, 7 G,, D, B,, D, … (V); ô 8 [C,E,G,]8. Hòa âm khớp lời dẫn: ô 3 trên I (Sol–Mi–Sol–Đô), ô 4 dừng lửng ở Sol trên V, ô 7 Sol–Si–Rê trên V, ô 8 Đô trên I. Ô 1–2 và 5–6 giống hệt (cả ngón bấm); nhãn ^1 (A), ^2, ^3 (A'), ^4 ở ô 1, 3, 5, 7. Ngón bấm chơi được: tay phải ô 1 E(1) G(2) c(5) B(4) (quãng ba 1–2 hơi chật nhưng chơi được), ô 2 A(3) F(1) A c(5), ô 4 d(5) B(3) G(1); tay trái ngón 5–3–1 (hoặc 5–2–1 ở ô IV) đúng với thế tay ba nốt. Lời dẫn nói đúng: ô 2 → 3 và 6 → 7 là chỗ rẽ nhánh. Bài chơi được ở mức chặng 2–3."
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - khoa
      - nhip
      - not
      - hop-am
    ket_qua: dung
    ghi_chu: "Khung hòa âm tay trái rút gọn: 4/4 L:1/4, K:C clef=bass, mỗi ô hai hợp âm khối nốt đen kép ([..]2 [..]2 = 4 phách), 8 ô: I [C,E,G,], IV [C,F,A,], I, V [G,,B,,D,], I, IV, V, I (ô cuối [C,E,G,]4). Khớp bè tay trái của khối 1 ô 1–8 và nhãn I/IV/V ở trang. Không ngón bấm (khung hợp âm)."
ghi_chu: 'Lượt 1 trang Học thuộc và biểu diễn (lô D4-L3, phần A). Nguồn đã mở: ABRSM Qualification Specification Practical Music Piano 2025 & 2026 (PDF, tr. 13), Gramophone (Plaistow, 10/1997) và trang Deutsche Grammophon, Crossref và OpenAlex (Chaffin và Imreh 2002; Roediger, Karpicke 2006; Brooks 2014), PLOS ONE (Wells 2012), IMSLP (BWV 971), Chang III.6, III.14, III.15, OMT Sonata form, NHS (CBT, Beta blockers, GAD symptoms), BAPAM health-resources. Không mở được toàn văn Chaffin và Imreh, Brooks, Roediger (PubMed, tạp chí chặn): dùng tóm tắt của OpenAlex và chỉ giữ điều tóm tắt xác nhận. Đã sửa (da-sua): n1, n3 (ABRSM: "theo chương trình hiện hành", thêm Practical Grades, trỏ sang trang Học với thầy và thi cấp), n5 (Richter), n6, n13, n14, n18, n19, n20, n36, n41, n44, n47, n49, n51, n54, n55, n58, n59, n60, n61, n62, n64, n69, n70, n71, n73. Đã bỏ (da-bo): n16 (điểm yếu thứ hai của trí nhớ vận động), n56 (rượu bia), n74 (ba sách in ở mục Nguồn). Đổi tiêu đề ### "Những điều có bằng chứng giúp" thành "Những điều có thể giúp" (id cũ giữ: { #nhung-ieu-co-bang-chung-giup }, slug của site cũ): khi dịch chuyển, người giao ghi doi_chu cho tiêu đề này nếu công cụ báo. Điều các lô trước yêu cầu giữ: mục "Bốn loại trí nhớ" (neo #bon-loai-tri-nho, luyen-tai/choi-bang-tai.md trỏ tới): KHỚP, có thính giác; mục "Chuẩn bị cho buổi biểu diễn" (diễn thử): KHỚP; "7. Chạy bài trong đầu": KHỚP (n34); "khoanh tròn các kết" và điểm mốc cấu trúc là chỗ để bám lại (13-ket.yml, lo-trinh-choi.yml): KHỚP một phần: còn "khoanh tròn các kết" (n22) và "chỗ để bám lại" (n20), nhưng nhóm "mốc cấu trúc" ở dạng bốn loại đã bỏ khỏi trang (n19) vì không mở được toàn văn Chaffin; lo-trinh-choi.yml trích đúng "Chọn điểm xuất phát… Khi biểu diễn, chính những điểm này là điểm nhảy: lỡ quên, bạn vào lại ở điểm gần nhất phía sau": còn nguyên (n25). "Học thuộc bằng phân tích, điểm xuất phát" (lo-trinh-choi.yml): KHỚP (n22, n25). Câu ve-site trỏ trang chưa chuyển (đã kiểm ../opus-zero/docs/): thay-va-thi (n4, n65), thu-am, nhat-ky, metronome (n42). Thuật ngữ chưa có bản ghi thuat-ngu.yml: trí nhớ vận động, trí nhớ thính giác, trí nhớ thị giác, trí nhớ phân tích, điểm mốc (performance cue), điểm xuất phát, điểm nhảy, diễn thử, hiệu ứng kiểm tra (testing effect), loạn trương lực… (cho D3-L5/người giao). Người giao quyết: (1) trang thay-va-thi khi chuyển phải đồng bộ câu chơi thuộc của ABRSM (n4); (2) có muốn khôi phục phân loại bốn mốc của Chaffin nếu mở được toàn văn bài 2002 hay chương sách; (3) tên "Practical Grades" chưa kiểm cho Performance Grades (video).'
doi_chu:
  - cu: Chơi thuộc lòng và chơi cho người khác nghe đều là kỹ năng tập được, không phải năng khiếu trời cho. Trang này giải thích các loại trí nhớ mà người chơi đàn dùng, vì sao "thuộc tay" thôi là chưa đủ, cách xây và kiểm tra một trí nhớ bền, rồi cách chuẩn bị cho buổi diễn và sống chung với hồi hộp.
    moi: Chơi thuộc lòng và chơi cho người khác nghe đều là kỹ năng có thể tập. Trang này giải thích các loại trí nhớ mà người chơi đàn dùng, vì sao "thuộc tay" thôi là chưa đủ, cách xây và kiểm tra một trí nhớ bền, rồi cách chuẩn bị cho buổi diễn và sống chung với hồi hộp.
    ly_do: 'n1 (da-sua): Câu cũ: "…đều là kỹ năng tập được, không phải năng khiếu trời cho." Vế "không phải năng khiếu trời cho" là khẳng định về bản chất kỹ năng, không có nguồn trực tiếp về chơi thuộc hay biểu diễn (tóm tắt Ericsson 1993 nói về chuyên môn nói chung); bỏ vế ấy, giữ lời trấn an. Sửa cả mô tả (description).'
  - cu:
      - Không. Trong kỳ thi ABRSM, chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm trực tiếp (chỉ gam và hợp âm rải là bắt buộc chơi thuộc). Trong nhạc thính phòng, nghệ sĩ gần như luôn đặt bản nhạc trên giá; những năm cuối sự nghiệp, Sviatoslav Richter biểu diễn trong khán phòng gần như tối, chỉ một ngọn đèn nhỏ chiếu lên bản nhạc trước mặt.
      - Dù vậy, vẫn nên học thuộc ít nhất vài bài. Khi mắt không bận đọc, tai nghe tiếng đàn của chính mình rõ hơn hẳn và mắt theo được tay ở những bước nhảy xa. Quan trọng hơn, muốn thuộc bền thì phải hiểu bài được xây thế nào, và hiểu biết ấy vẫn cứu bạn khi chơi với bản nhạc mà mắt lạc dòng. Lộ trình piano gợi ý học thuộc bài đầu tiên ở chặng 2.
    moi:
      - "Không. Trong kỳ thi Practical Grades của ABRSM (theo chương trình hiện hành), chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm riêng; chỉ gam và hợp âm rải là bắt buộc chơi thuộc (xem Học với thầy và thi cấp). Có những nghệ sĩ lớn vẫn chơi với bản nhạc trên giá: những năm cuối sự nghiệp, Sviatoslav Richter biểu diễn trong khán phòng gần như tối, chỉ một ngọn đèn nhỏ chiếu lên bản nhạc trước mặt."
      - Dù vậy, vẫn nên học thuộc ít nhất vài bài. Khi mắt không bận đọc, bạn có thể dành chú ý cho tai nghe tiếng đàn của chính mình và cho mắt nhìn tay ở những bước nhảy xa. Quan trọng hơn, muốn thuộc bền thì phải hiểu bài được xây thế nào, và hiểu biết ấy vẫn cứu bạn khi chơi với bản nhạc mà mắt lạc dòng. Lộ trình piano gợi ý học thuộc bài đầu tiên ở chặng 2.
    ly_do: 'n3 (da-sua): ABRSM Qualification Specification: Practical Music Piano 2025 & 2026, mục Playing from memory (tr. 13): "Candidates may perform any of their pieces from memory"; "No extra marks are directly awarded for playing from memory."; "Memory: All requirements must be played from memory." (scales and arpeggios). Câu cũ chỉ nói "Trong kỳ thi ABRSM" và "không được cộng điểm trực tiếp"; theo ghi chú bảng tầng, bỏ tên chương trình 2025 & 2026, thêm "Practical Grades" (hình thức thi trực tiếp: đã đối chiếu ở đề cương Practical; Performance Grades chưa kiểm) và trỏ sang trang Học với thầy và thi cấp. "Hiện hành" đúng đến khi ABRSM đổi chương trình: người giao nhớ rà khi đổi kỳ.; n5 (da-sua): Gramophone (Plaistow, 10/1997), nói về các buổi diễn cuối ở London: "By then he had retreated into darkness and was almost invisible as he played"; ông chỉnh "an angle poise lamp at his side so that the only light on the platform fell on the music-rest". Deutsche Grammophon: "In his last years he preferred to play in darkness, with just one lamp on the piano to light the music"; "always playing from the score". Câu cũ có thêm "Trong nhạc thính phòng, nghệ sĩ gần như luôn đặt bản nhạc trên giá": không có nguồn, bỏ; thay bằng câu nói chung về nghệ sĩ lớn. Nguồn nói "bóng tối" và "một ngọn đèn", không nói "khán phòng", nên "khán phòng gần như tối" là cách diễn đạt gần nghĩa.; n6 (da-sua): Câu cũ: "…tai nghe tiếng đàn của chính mình rõ hơn hẳn và mắt theo được tay ở những bước nhảy xa." "Rõ hơn hẳn" là khẳng định không có nguồn; viết lại thành khả năng, giữ lời khuyên.'
  - cu: Người tự học thường chỉ dùng loại đầu tiên mà không biết. Mục tiêu là có cả bốn, với trí nhớ phân tích làm bộ khung.
    moi: Dễ chỉ dựa vào loại đầu tiên mà không biết. Mục tiêu là có cả bốn, với trí nhớ phân tích làm bộ khung.
    ly_do: 'n13 (da-sua): Câu cũ: "Người tự học thường chỉ dùng loại đầu tiên mà không biết." "Người tự học thường" là khẳng định về một nhóm người, không có nguồn; viết lại thành lời cảnh báo.'
  - cu: "Trí nhớ vận động giống một chuỗi mắt xích: mỗi chuyển động gọi chuyển động tiếp theo. Nó nhanh và không tốn sự chú ý, nên không thể thiếu, nhưng có ba điểm yếu:"
    moi: "Trí nhớ vận động giống một chuỗi mắt xích: mỗi chuyển động gọi chuyển động tiếp theo. Nó nhanh và không tốn sự chú ý, nên không thể thiếu, nhưng có hai điểm yếu:"
    ly_do: "n14 (da-sua): Chang III.6: hand memory \"is a reflex motion plus a brain reflex triggered by the piano's sound\", \"mostly hand memory which bypasses the brain\", \"always a good backup\". \"Chuỗi mắt xích\" là ví dụ so sánh của site. Câu cũ nói \"ba điểm yếu\": đã bỏ điểm yếu thứ hai (n16), nên sửa thành \"hai\"."
  - cu: Nó không chịu được sự soi xét. Khi hồi hộp, bạn bắt đầu để ý từng ngón tay, đúng điều mà chuỗi tự động không chịu nổi.
    ly_do: 'n16 (da-bo): Bỏ điểm yếu thứ hai: khẳng định về tâm lý (chú ý có ý thức làm hỏng chuỗi tự động) không có nguồn mở được (Chang không nói; các nghiên cứu về "choking under pressure" không mở được).'
  - cu: "Nhóm của nhà tâm lý học Roger Chaffin đã ghi lại và phân tích quá trình nghệ sĩ piano Gabriela Imreh học chương cuối (Presto) của Italienisches Konzert (Concerto Ý), BWV 971, của Bach. Người chơi chuyên nghiệp mang trong đầu một bản đồ của tác phẩm với những điểm mốc (performance cues) được chọn có chủ ý trong lúc tập: mốc cấu trúc (ranh giới các đoạn), mốc diễn tả (cảm xúc muốn truyền đến người nghe), mốc diễn tấu (tốc độ, sắc thái, phân câu) và mốc kỹ thuật (một ngón bấm then chốt). Ngón tay chạy tự động, còn đầu óc đi theo bản đồ; khi có sự cố, các điểm mốc là chỗ để bám lại. Khoảng hai năm sau, những gì Imreh còn nhớ về bản nhạc vẫn xoay quanh các mốc cấu trúc và diễn tả."
    moi: "Nhà tâm lý học Roger Chaffin và nghệ sĩ piano Gabriela Imreh đã ghi lại và phân tích quá trình Imreh học chương cuối (Presto) của Italienisches Konzert (Concerto Ý), BWV 971, của Bach. Bà ghi lại việc tập, rồi mô tả cấu trúc bản nhạc và các quyết định về ngón bấm, phân câu và những điểm mốc (performance cues) bà chú ý tới trong lúc biểu diễn; các chỗ bà ngập ngừng khi chơi thuộc, và những chỗ bà còn nhớ hai năm sau, đều gắn với các điểm mốc ấy. Với các điểm mốc, người chơi mang trong đầu một bản đồ của tác phẩm: chẳng hạn ranh giới các đoạn, cảm xúc muốn truyền đến người nghe, cách phân câu, một ngón bấm then chốt. Ngón tay chạy tự động, còn đầu óc đi theo bản đồ; khi có sự cố, các điểm mốc là chỗ để bám lại."
    ly_do: "n18 (da-sua): OpenAlex (tóm tắt Chaffin và Imreh 2002): \"A concert pianist recorded her practice while learning the third movement (Presto) of J.S. Bach's Italian Concerto.\" IMSLP: Italienisches Konzert, BWV 971, ba chương, chương 3 Presto. Câu cũ: \"Nhóm của nhà tâm lý học Roger Chaffin đã ghi lại…\": đổi thành tên hai tác giả bài báo (Chaffin và Imreh); không kiểm được vai trò \"nhóm\".; n19 (da-sua): Tóm tắt (OpenAlex): bà \"recorded her practice\", \"described the piece's formal structure and explained her decisions about fingering, phrasing, and the cues she attended to during performance\"; các báo cáo cho biết \"which spots caused hesitations when she first played from memory, and which affected her recall two years later\"; \"retrieval depended on performance cues\". Câu cũ: Người chơi chuyên nghiệp mang một bản đồ với bốn loại mốc (cấu trúc, diễn tả, diễn tấu, kỹ thuật), \"được chọn có chủ ý trong lúc tập\", và hai năm sau Imreh còn nhớ \"các mốc cấu trúc và diễn tả\". Không mở được toàn văn (Psychological Science, PubMed bị chặn), nên bỏ phân loại bốn mốc, \"chọn có chủ ý trong lúc tập\" và \"cấu trúc và diễn tả\"; chỉ giữ điều tóm tắt xác nhận.; n20 (da-sua): Ý chính khớp tóm tắt Chaffin và Imreh (\"her retrieval depended on performance cues\", chuyên gia nhớ nhanh và tự động qua \"conceptual, motor, and auditory memory\") và Chang III.6/III.14 (khi quên, vào lại từ chỗ biết rõ). Các ví dụ về mốc (ranh giới đoạn, cảm xúc, phân câu, ngón bấm then chốt) là minh họa của site, không còn gán thành bốn loại của Chaffin. \"Người chơi chuyên nghiệp\" đã đổi thành \"người chơi\". Chưa mở được toàn văn nên không khẳng định phân loại của tác giả."
  - cu: "Gấp bản nhạc, chơi một đoạn, rồi mở ra đối chiếu ngay; thỉnh thoảng thử viết lại vài ô đầu của mỗi đoạn mà không nhìn. Các nghiên cứu về học tập cho thấy chủ động gợi lại từ trí nhớ giúp nhớ lâu hơn đọc lại, gọi là hiệu ứng kiểm tra (Roediger và Karpicke, 2006). Kiểm tra ngay đầu buổi, khi chưa chơi bài lần nào, và giãn cách các lần ôn: sau 1 ngày, 3 ngày, 1 tuần."
    moi: "Gấp bản nhạc, chơi một đoạn, rồi mở ra đối chiếu ngay; thỉnh thoảng thử viết lại vài ô đầu của mỗi đoạn mà không nhìn. Trong các thí nghiệm với đoạn văn xuôi, Roediger và Karpicke (2006) thấy rằng tự kiểm tra bằng cách gợi lại từ trí nhớ giúp nhớ lâu hơn đọc lại (sau 2 ngày và sau 1 tuần), gọi là hiệu ứng kiểm tra. Kiểm tra ngay đầu buổi, khi chưa chơi bài lần nào, và giãn cách các lần ôn: sau 1 ngày, 3 ngày, 1 tuần."
    ly_do: 'n36 (da-sua): Tóm tắt (OpenAlex): hai thí nghiệm với đoạn văn xuôi; kiểm tra sau 5 phút thì đọc lại tốt hơn, sau 2 ngày hoặc 1 tuần thì đã kiểm tra trước đó nhớ tốt hơn hẳn; "testing effect". Câu cũ: "Các nghiên cứu về học tập cho thấy chủ động gợi lại từ trí nhớ giúp nhớ lâu hơn đọc lại": quá tổng quát và bỏ qua rằng thí nghiệm là về văn xuôi, nên viết đúng phạm vi.'
  - cu: 'Thử nhiều cây đàn. Mỗi cây có độ nặng phím, độ sâu bàn đạp và độ sáng tiếng khác nhau; nếu chỉ tập trên đàn điện, hãy tìm dịp chơi đàn cơ trước buổi diễn. Khi thử đàn ở nơi diễn, đừng chơi đoạn khó nhất mà kiểm tra: chơi thật nhỏ có ra tiếng không, bàn đạp bắt đầu "ăn" ở độ sâu nào, bè trầm có lấn giai điệu không (Bàn đạp, Tạo tiếng đàn).'
    moi: 'Thử nhiều cây đàn. Mỗi cây có thể khác nhau về độ nặng phím, độ sâu bàn đạp và độ sáng tiếng khác nhau; nếu chỉ tập trên đàn điện, hãy tìm dịp chơi đàn cơ trước buổi diễn. Khi thử đàn ở nơi diễn, đừng chơi đoạn khó nhất mà kiểm tra: chơi thật nhỏ có ra tiếng không, bàn đạp bắt đầu "ăn" ở độ sâu nào, bè trầm có lấn giai điệu không (Bàn đạp, Tạo tiếng đàn).'
    ly_do: 'n41 (da-sua): Chang III.14: "Can you adjust to a different piano – especially one that is out of tune or difficult to play?"; đàn lớn thường dễ chơi hơn đàn nhỏ. Câu cũ: "Mỗi cây có độ nặng phím…": đổi thành "có thể khác nhau" để khỏi là khẳng định tuyệt đối.'
  - cu: "Quy tắc số một khi biểu diễn: giữ nhịp, không quay lại. Phần lớn người nghe không nhận ra một nốt sai, nhưng ai cũng nhận ra khi nhạc dừng."
    moi: "Quy tắc số một khi biểu diễn: giữ nhịp, không quay lại. Nhạc dừng giữa chừng làm hỏng cả mạch bài nhiều hơn một nốt sai."
    ly_do: 'n44 (da-sua): Chang III.14: "Another way to play through mistakes is to at least keep the rhythm." Câu cũ: "Phần lớn người nghe không nhận ra một nốt sai, nhưng ai cũng nhận ra khi nhạc dừng." Khẳng định về cảm nhận của người nghe, Chang không nói (đã đọc III.15: "Not covered"); viết lại thành lời khuyên và sửa cả lời giải thích câu hỏi 5 (n68).'
  - cu:
      - 'Hồi hộp trước khi biểu diễn rất phổ biến, kể cả ở nghệ sĩ chuyên nghiệp; nó cho thấy bạn coi trọng việc mình làm. Cơ thể đọc tình huống "nhiều người đang nghe mình" như một mối đe dọa và bật phản ứng chiến hay chạy: adrenaline tăng, tim đập nhanh, thở nông, tay run hoặc lạnh, đầu óc dễ trống rỗng. Phản ứng ấy có ích khi cần chạy trốn, nhưng không hợp với mười ngón tay cần điều khiển tinh tế: nhịp bị vội, khó chơi nhỏ, tiếng cứng.'
      - Những điều có bằng chứng giúp
      - Chuẩn bị kỹ và diễn thử nhiều lần. Không kỹ thuật thở nào thay được việc biết chắc rằng bạn đã chơi trọn bài này trước người khác nhiều lần.
      - Thở ra chậm. Hít vào bằng mũi khoảng 4 nhịp đếm, thở ra từ từ khoảng 6 nhịp, trong vài phút trước khi lên sân khấu. Trong một thử nghiệm ngẫu nhiên với 46 nhạc công, chỉ một buổi tập thở chậm dài 30 phút đã giúp điều hòa phản ứng sinh lý khi chờ biểu diễn; những người vốn rất lo âu thì giảm lo âu nhiều hơn nhóm không tập (Wells và cộng sự, 2012).
    moi:
      - "Hồi hộp trước khi biểu diễn rất phổ biến. Nó gắn với adrenaline, chất giúp con người thoát khỏi nguy hiểm: tim có thể đập nhanh và cơ căng lên. Người ít kinh nghiệm hay chơi nhanh hơn mức bài chịu được vì hồi hộp."
      - Những điều có thể giúp
      - Chuẩn bị kỹ và diễn thử nhiều lần. Diễn thử cho bạn thêm kinh nghiệm và sự tự tin, và hai thứ ấy làm bớt nỗi sợ điều chưa biết.
      - Thở ra chậm. Hít vào khoảng 4 nhịp đếm, thở ra từ từ khoảng 6 nhịp (khoảng sáu nhịp thở mỗi phút), trong vài phút trước khi lên sân khấu. Trong một thử nghiệm ngẫu nhiên với 46 nhạc công, chỉ một buổi tập thở chậm dài 30 phút đã giúp điều hòa phản ứng sinh lý khi chờ biểu diễn; những người vốn rất lo âu thì giảm lo âu nhiều hơn nhóm không tập (Wells và cộng sự, 2012).
    ly_do: "n47 (da-sua): Brooks 2014 (tóm tắt): \"People often feel nervous before tasks like public speaking\". Chang III.15: hồi hộp gắn với \"a flow of adrenalin\"; \"fear helps us to escape danger\". NHS (lo âu nói chung): triệu chứng gồm \"a more noticeable or unusual heartbeat (palpitations)\" và \"feeling tense\". Nguồn không chuyên về nhạc công; câu đã bỏ các vế không có nguồn. Câu cũ: \"Hồi hộp… rất phổ biến, kể cả ở nghệ sĩ chuyên nghiệp; nó cho thấy bạn coi trọng việc mình làm. Cơ thể đọc tình huống 'nhiều người đang nghe mình' như một mối đe dọa và bật phản ứng chiến hay chạy: adrenaline tăng, tim đập nhanh, thở nông, tay run hoặc lạnh, đầu óc dễ trống rỗng. Phản ứng ấy có ích khi cần chạy trốn, nhưng không hợp với mười ngón tay…\": \"kể cả ở nghệ sĩ chuyên nghiệp\", \"coi trọng việc mình làm\", \"chiến hay chạy\", \"thở nông, tay run hoặc lạnh, đầu óc trống rỗng\", \"không hợp với mười ngón tay\" đều bỏ (không có nguồn mở được; NHS không nhắc \"fight or flight\" và không nhắc thở hay run).; n49 (da-sua): Chang III.15: \"Mock recitals will give you more experience and confidence; both will reduce the fear of the unknown.\" Câu cũ: \"Không kỹ thuật thở nào thay được việc biết chắc rằng bạn đã chơi trọn bài này trước người khác nhiều lần.\" Là ý kiến, không có nguồn; thay bằng ý của Chang.; n51 (da-sua): Lời khuyên; 4+6 nhịp là một chu kỳ khoảng 10 giây, tức khoảng sáu nhịp thở mỗi phút, đúng tốc độ thở chậm của thử nghiệm Wells (6 nhịp/phút). Câu cũ có \"bằng mũi\": thử nghiệm không nói; bỏ."
  - cu:
      - Đặt sự chú ý vào âm nhạc. Trước mỗi đoạn, nghĩ đến tính cách của nó bằng một hai chữ ("dịu dàng", "rộn ràng"), giống các mốc diễn tả của Chaffin. Nghĩ về âm thanh muốn tạo ra, không phải về ngón tay.
      - "Một nghi thức cố định: cùng một bài khởi động, cùng một chuỗi việc trước khi đặt tay lên phím (chỉnh ghế, thở ra, nghe câu đầu). Nghi thức quen làm tình huống lạ bớt lạ."
    moi:
      - Đặt sự chú ý vào âm nhạc. Trước mỗi đoạn, nghĩ đến tính cách của nó bằng một hai chữ ("dịu dàng", "rộn ràng"), giống các điểm mốc ở phần trên. Nghĩ về âm thanh muốn tạo ra, không phải về ngón tay.
      - "Một nghi thức cố định: cùng một bài khởi động, cùng một chuỗi việc trước khi đặt tay lên phím (chỉnh ghế, thở ra, nghe câu đầu)."
    ly_do: 'n54 (da-sua): Chang III.15: "Playing musically, of course, is always the answer" (tập trung vào biểu cảm âm nhạc). Câu cũ: "…giống các mốc diễn tả của Chaffin": đã bỏ phân loại bốn mốc của Chaffin (n19), nên đổi thành "các điểm mốc ở phần trên".; n55 (da-sua): Câu cũ có thêm: "Nghi thức quen làm tình huống lạ bớt lạ." Là giải thích tâm lý không có nguồn; bỏ.'
  - cu: 'Uống rượu bia "cho bớt run": rượu làm giảm khả năng điều khiển tinh và phán đoán.'
    ly_do: 'n56 (da-bo): Bỏ khỏi mục "Những điều nên tránh": khẳng định về tác động của rượu không có nguồn (NHS "risks of drinking too much" chỉ nói "misjudging risky situations", không nói điều khiển tinh hay lo âu; Chang III.15 không nói tới rượu). Lời khuyên sức khỏe nên không xếp khuyen-tap.'
  - cu:
      - Thay đổi vào phút chót, tập quá nhiều trong ngày diễn, quá nhiều cà phê, bỏ bữa.
      - 'Tự nhủ "đừng sai", "đừng run": câu đó hướng sự chú ý đúng vào lỗi. Hãy nói điều bạn muốn làm: "hát câu đầu", "giữ nhịp".'
    moi:
      - Thay đổi vào phút chót, tập quá nhiều trong ngày diễn, quá nhiều cà phê.
      - 'Tự nhủ "đừng sai", "đừng run": hãy nói điều bạn muốn làm: "hát câu đầu", "giữ nhịp".'
    ly_do: 'n58 (da-sua): Chang III.14: "within the last week, adding new material or making changes in the piece (such as fingering) is not recommended"; III.15: cà phê, trà làm hồi hộp tệ hơn. "Tập quá nhiều trong ngày diễn" là lời khuyên của site. Câu cũ có thêm "bỏ bữa": bỏ (không có nguồn, lời khuyên dinh dưỡng).; n59 (da-sua): Câu cũ có thêm: "câu đó hướng sự chú ý đúng vào lỗi." Giải thích tâm lý không có nguồn; bỏ, giữ lời khuyên.'
  - cu: Nếu hồi hộp khiến bạn né mọi dịp chơi cho người khác nghe trong nhiều tháng, mất ngủ nhiều ngày trước buổi diễn, hoặc có những cơn hoảng sợ, hãy nói chuyện với chuyên gia tâm lý. Liệu pháp nhận thức – hành vi (CBT) là một hướng thường được dùng cho lo âu biểu diễn.
    moi: Nếu hồi hộp khiến bạn khổ sở, né mọi dịp chơi cho người khác nghe, mất ngủ hoặc có những cơn hoảng sợ, hãy nói chuyện với bác sĩ hoặc chuyên gia tâm lý. Liệu pháp nhận thức – hành vi (CBT) là một hướng điều trị thường dùng cho lo âu.
    ly_do: 'n60 (da-sua): BAPAM liệt kê tài liệu "Managing Performance Anxiety", "Psychological Self-Care", "Mental Health Support" cho người biểu diễn; NHS: mất ngủ ("difficulty sleeping") là triệu chứng lo âu. Câu cũ: "…né mọi dịp… trong nhiều tháng, mất ngủ nhiều ngày trước buổi diễn… hãy nói chuyện với chuyên gia tâm lý": ngưỡng "nhiều tháng", "nhiều ngày" không có nguồn, bỏ; thêm "bác sĩ" vì BAPAM và NHS đều đưa người có triệu chứng tới bác sĩ trước. Lời khuyên sức khỏe nên không xếp khuyen-tap.; n61 (da-sua): NHS CBT: "anxiety, including social anxiety, phobias and obsessive compulsive disorder (OCD)". Câu cũ: "…thường được dùng cho lo âu biểu diễn": NHS không nhắc lo âu biểu diễn; bỏ chữ "biểu diễn".'
  - cu: "Trong vòng 24 giờ, ghi vào nhật ký luyện tập: ba điều làm tốt, hai điều cần cải thiện, một thay đổi cho lần sau. Hôm sau mới nghe bản ghi: thường bạn chơi tốt hơn mình tưởng. Rồi tách các loại vấn đề, vì mỗi loại cần một cách sửa khác:"
    moi: "Trong vòng 24 giờ, ghi vào nhật ký luyện tập: ba điều làm tốt, hai điều cần cải thiện, một thay đổi cho lần sau. Hôm sau mới nghe bản ghi. Rồi tách các loại vấn đề, vì mỗi loại cần một cách sửa khác:"
    ly_do: 'n62 (da-sua): Câu cũ có thêm: "thường bạn chơi tốt hơn mình tưởng." Khẳng định không có nguồn; bỏ.'
  - cu:
      - "Cộng đồng trực tuyến: nhiều diễn đàn và nhóm của người lớn học piano có chủ đề chia sẻ bản thu, một số tổ chức cả buổi độc tấu trực tuyến định kỳ."
      - "Buổi biểu diễn của lớp, của trung tâm: học trò người lớn thường được chào đón; hãy hỏi thầy (Học với thầy và thi cấp)."
    moi:
      - "Cộng đồng trực tuyến: chia sẻ bản thu ở các diễn đàn và nhóm của người lớn học piano."
      - "Buổi biểu diễn của lớp, của trung tâm: hãy hỏi xem học trò người lớn có tham gia được không, và hỏi thầy (Học với thầy và thi cấp)."
    ly_do: 'n64 (da-sua): Lời khuyên; hai câu cũ đã viết lại vì khẳng định về tình hình bên ngoài không kiểm được và dễ đổi: "nhiều diễn đàn và nhóm của người lớn học piano có chủ đề chia sẻ bản thu, một số tổ chức cả buổi độc tấu trực tuyến định kỳ" (chi tiết mau cũ) và "học trò người lớn thường được chào đón".'
  - cu:
      - "Roger Chaffin, Gabriela Imreh, Mary Crawford, Practicing Perfection: Memory and Piano Performance (Lawrence Erlbaum Associates, 2002)."
      - 'Roger Chaffin, T. Logan, "Practicing perfection: How concert soloists prepare for performance", Advances in Cognitive Psychology 2(2–3), 2006, tr. 113–130.'
    moi:
      - 'Roger Chaffin, Gabriela Imreh, "Practicing perfection: Piano performance as expert memory", Psychological Science 13(4), 2002, tr. 342–349.'
      - Chuan C. Chang, Fundamentals of Piano Practice, mục III.6 (học thuộc), III.14 (chuẩn bị biểu diễn) và III.15 (hồi hộp).
    ly_do: "n70 (da-sua): Thay hai dòng cũ: sách Chaffin, Imreh, Crawford, Practicing Perfection (Lawrence Erlbaum, 2002) và bài Chaffin, Logan 2006 (Advances in Cognitive Psychology 2(2–3), 113–130): chưa mở được nội dung của cả hai. Bài mới là bài đã mở bản ghi (OpenAlex: tên, hai tác giả, Psychological Science 13(4), 342–349, 2002) và là bài nói về Imreh học Presto của Concerto Ý."
  - cu: Dianna T. Kenny, The Psychology of Music Performance Anxiety (Oxford University Press, 2011).
    ly_do: "n74 (da-bo): Bỏ ba sách in chưa mở được nội dung (chuẩn mục 2: sách in chỉ là nguồn phụ); không câu nào của trang dựa riêng vào chúng."
  - cu:
      - "Gerald Klickstein, The Musician's Way: A Guide to Practice, Performance, and Wellness (Oxford University Press, 2009)."
      - "Molly Gebrian, Learn Faster, Perform Better: A Musician's Guide to the Neuroscience of Practicing (Oxford University Press, 2024)."
      - "ABRSM, Practical Music Grades: Piano Syllabus 2025 & 2026, phần quy định về chơi thuộc: ABRSM."
    moi:
      - "ABRSM, chương trình thi piano Practical Grades hiện hành, phần quy định về chơi thuộc: ABRSM."
      - NHS (Anh), Cognitive behavioural therapy (CBT) và Beta blockers.
      - Open Music Theory, Sonata form.
    ly_do: 'n71 (da-sua): Ba dòng thêm vào mục Nguồn theo các nguồn đã mở. Chang: tác giả ghi ở dòng bản quyền "Chuan C. Chang".; n73 (da-sua): Câu cũ: "ABRSM, Practical Music Grades: Piano Syllabus 2025 & 2026, phần quy định về chơi thuộc". Theo ghi chú bảng tầng, bỏ tên chương trình và năm; tên tài liệu thật của bản PDF đã mở là "Qualification Specification: Practical Music Piano 2025 & 2026" (khác tên cũ).'
  - cu: "mô tả: Chơi thuộc lòng và chơi cho người khác nghe đều là kỹ năng tập được, không phải năng khiếu trời cho. Trang này giải thích các loại trí nhớ mà người chơi đàn…"
    moi: "mô tả: Chơi thuộc lòng và chơi cho người khác nghe đều là kỹ năng có thể tập. Trang này giải thích các loại trí nhớ mà người chơi đàn…"
    ly_do: "n1: mô tả đổi theo câu mở đầu, bỏ \"không phải năng khiếu trời cho\"."
  - cu: "câu hỏi: Đang diễn thì quên mất đoạn tiếp theo. Nên làm gì? | Dừng lại và chơi lại từ đầu bài | ✓ Giữ nhịp, nhảy đến điểm xuất phát gần nhất phía sau và chơi tiếp | Xin lỗi khán giả rồi xin chơi lại | Người nghe ít khi nhận ra một nốt sai, nhưng ai cũng nhận ra khi nhạc dừng."
    moi: "câu hỏi: Đang diễn thì quên mất đoạn tiếp theo. Nên làm gì? | Dừng lại và chơi lại từ đầu bài | ✓ Giữ nhịp, nhảy đến điểm xuất phát gần nhất phía sau và chơi tiếp | Xin lỗi khán giả rồi xin chơi lại | Nhạc dừng giữa chừng làm hỏng cả mạch bài nhiều hơn một nốt sai."
    ly_do: 'n69 (da-sua): Chang III.14: restart từ chỗ biết rõ, "keep the rhythm". Lời giải thích cũ: "Người nghe ít khi nhận ra một nốt sai, nhưng ai cũng nhận ra khi nhạc dừng." (không có nguồn) đổi thành cùng câu với n44; độc lập vị trí lựa chọn.'
