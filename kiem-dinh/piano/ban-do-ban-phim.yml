khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
    ket_qua: dung
    ghi_chu: "Soạn cho trang: bảy nốt mốc. M:4/4, L:1/4, K:C, Q:1/4=100; mỗi ô một nốt dài 4 phách (z4 = ô nghỉ trọn), 7 ô mỗi tay, đủ 4 phách (tools/khuong-nhac.mjs không báo lỗi). Tay phải: nghỉ ba ô, rồi C4 (Đô giữa), G4, c = C5, c' = C6; nhãn \"^Đô giữa C4\", \"^G4\", \"^C5\", \"^C6\" khớp nốt. Tay trái: C,, = C2, C, = C3, F, = F3, rồi nghỉ bốn ô; nhãn \"_C2\", \"_C3\", \"_F3\" khớp. Đúng với bảng nốt mốc (n45–n51). Hai khóa: V:RH clef=treble, V:LH clef=bass. Không có hóa biểu, hợp âm hay số ngón."
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
    ket_qua: dung
    ghi_chu: "Soạn cho trang: năm cặp nốt, mỗi nốt cách một mốc một bậc. M:4/4, L:1/4, K:C. Tay phải F4, A4, B4, d = D5, b = B5; tay trái D,, = D2, B,, = B2, E, = E3, G, = G3, B, = B3; mỗi ô một nốt dài 4 phách, 5 ô, đủ nhịp. Tên nốt khớp đáp án trong khối thu gọn (n55, n56). Đối chiếu từng nốt với khuông Sol/Fa: đúng."
ghi_chu: "Bản đồ bàn phím (piano/ban-do-ban-phim). Nguồn chính: Open Music Theory (The Keyboard and the Grand Staff, Reading Clefs, Half Steps, ASPN), MT21C 1.3 Octave Registers, Beethoven-Haus (Broadwood CC–c''''), ISO 16 (mục lục), Humdrum Tonh và danh sách B-A-C-H của IMSLP (B/H); trang nhà sản xuất (Yamaha, Kawai) cho damper. Mở ngày 28/10/2026. Sửa chữ ở lượt 1: n38 (bỏ số phím không damper; \"bộ tắt tiếng\" thành \"bộ giảm âm\"), n60 (𝄪, 𝄫 thành ×, ♭♭), n81 và n82 (mục Nguồn: bỏ Helmholtz 1863 và Grove, không đối chiếu được; thay bằng trang đã mở). Chưa chắc (ket_qua null): n35 (mô tả âm thanh từng vùng), n37 (tay trái, tay phải theo vùng), n43 (\"nhanh hơn nhiều\" khi đọc theo mốc). Không tính là nhận định: tiêu đề mục; câu mở đầu mang tính hình ảnh (\"hàng rào\"); mô tả trang (cắt từ câu mở đầu). Hai khối abc đúng (khuong_nhac). Hình piano-88 (src/components/hinh/piano-88.html, không sửa): 88 phím (52 trắng, 36 đen), nhãn A0, C1–C8, \"Đô giữa (C4)\", \"La4 = 440 Hz\" và hai nhãn tay trái/tay phải; không thấy lỗi. ve-site trỏ trang chưa chuyển (kiểm trên ../opus-zero/docs/): piano/thi-tau (n44: phải giữ \"Nốt mốc\" và link về Bản đồ bàn phím), piano/lich-su-dan (n84: phải giữ đoạn Broadwood CC–c''''), piano/nam-ngon, luyen-tap/doc-not, luyen-tap/ban-phim, tai-lieu-tham-khao. Hồ sơ đã khóa trỏ tới trang này đều khớp (nhac-ly/01 n19–n25, nhac-ly/05 n12 và n24, nhac-ly/03, nhac-ly/04, piano/lo-trinh, bat-dau/lo-trinh-choi, bat-dau/moi-ngay, luyen-tai/*): không thấy chỗ lệch. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có, ghi cho D3-L5: \"ký hiệu khoa học\" (scientific / ASPN), \"ký hiệu Helmholtz\", \"nốt mốc\", \"Đô giữa\", \"nhóm 2 / nhóm 3 phím đen\", \"trùng âm\", \"dấu thăng kép / giáng kép\" (×, ♭♭); \"bộ giảm âm\" đã có (mục sordino) nhưng chưa có mục \"damper\" riêng."
