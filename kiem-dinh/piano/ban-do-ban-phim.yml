    ghi_chu: 'chưa chắc: khớp thông lệ phân khuông (n40) nhưng chưa có nguồn bậc 1–2 cho "tay trái đệm, đôi khi giai điệu" và "trang trí, hiệu ứng". Có chữ "thường" nên không sai. Review D4-gom: chữ cũ của cột: "Tay trái: nốt trầm, quãng tám", "Tay trái đệm, đôi khi giai điệu", "Tay phải: giai điệu", "Tay phải: trang trí, hiệu ứng"; chữ mới chỉ còn tay nào. Lý do: các vai trò (đệm, giai điệu, trang trí) không có nguồn bậc 1–2; phần tay có nguồn: OMT The Keyboard and the Grand Staff, "Typically, the pianist plays the lower notes (in the bass clef) with their left hand", nốt cao bằng tay phải. Cần lượt 2 kiểm chữ mới.'
