    ket_qua: da-sua
    ghi_chu: "OMT The Keyboard and the Grand Staff: khuông kép, khóa Sol trên và khóa Fa dưới; OMT Reading Clefs: khóa có thể đổi giữa bản nhạc. Review D4-gom: chữ cũ: \"tay trái có thể chơi trên khuông khóa Sol và ngược lại, và khóa có thể đổi giữa chừng\"; chữ mới: \"khóa có thể đổi giữa chừng, và tay trái có khi chơi trên khuông khóa Sol\". Lý do: OMT (The Keyboard and the Grand Staff, Clefs) chỉ nói \"Typically…\" và không nói khóa đổi giữa chừng; bản Mutopia của Für Elise (fur_Elise_WoO59.ly) có khuông dưới (tay trái) đổi \\clef treble rồi \\clef bass nhiều lần giữa bài: chứng minh cả hai ý. Vế \"và ngược lại\" (tay phải trên khóa Fa) chưa có bản phổ đã mở, nên bỏ. Cần lượt 2 kiểm chữ mới."
    luot_2: khong-chac
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
    luot_2_ghi_chu: "OMT: khóa Sol quấn quanh G4, khóa Fa là F3 bằng hai chấm; không nói về tay. Quy ước tay phải khóa Sol, tay trái khóa Fa đúng theo thông lệ nhưng chưa có nguồn mở."
