  - id: n38
    cau: Ở vùng rất cao, những phím cao nhất của đàn không có bộ giảm âm (damper), nên các nốt ở đó tự ngân cho đến khi tắt dù bạn không giữ bàn đạp.
    loai: quy-tac
    nguon:
      - kawai-faq
      - yamaha-hub
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "bộ tắt tiếng (damper): khoảng hơn một quãng tám trên cùng không có damper". Kawai FAQ: "the strings for the uppermost notes are not fitted with dampers", các dây ấy "sustain freely regardless of pedal use". Không nguồn nào đã mở nêu số phím (một trang thợ đàn bậc 3 chỉ nói "the top couple of octaves"), nên bỏ "khoảng hơn một quãng tám". "Bộ tắt tiếng" đổi thành "bộ giảm âm" theo src/data/thuat-ngu.yml (mục sordino) và trang Bàn đạp cũ. Review D4-gom: nguồn của nhà sản xuất về chính đàn của họ (Kawai FAQ: "the strings for the uppermost notes are not fitted with dampers", ngân "regardless of pedal use") xếp bậc 2 như trang của nhà xuất bản; khớp Yamaha (n39). Câu không nêu số phím. Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/piano" ]
    luot_2_ghi_chu: Đúng theo hiểu biết chung (khoảng 18 phím cao nhất không có bộ giảm âm) nhưng không mở được nguồn bậc 1-2; Britannica, Yamaha và Wikipedia (Sustain pedal, Action) đã mở đều không nói.
  - id: n39
    cau: Ở vùng rất cao, dây ngắn và tiếng tắt nhanh đến mức đàn không cần bộ giảm âm.
