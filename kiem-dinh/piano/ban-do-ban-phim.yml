    ly_do: "n35, n37 (review D4-gom): bỏ cột Âm thanh; cột tay theo OMT."
  - cu:
      - Lấp lánh, tắt rất nhanh
      - "Tay phải: trang trí, hiệu ứng"
      - "Ở vùng rất cao, dây ngắn và tiếng tắt nhanh đến mức đàn không cần bộ tắt tiếng (damper): khoảng hơn một quãng tám trên cùng không có damper, nên các nốt ở đó tự ngân cho đến khi tắt, dù bạn không giữ bàn đạp."
      - "Trên bản nhạc piano, khuông khóa Sol thường dành cho tay phải và khuông khóa Fa cho tay trái. Đó là quy ước, không phải luật: tay trái có thể chơi trên khuông khóa Sol và ngược lại, và khóa có thể đổi giữa chừng. Hãy luôn nhìn khóa ở đầu khuông."
    moi:
      - Tay phải
      - "Ở vùng rất cao, dây ngắn và tiếng tắt nhanh đến mức đàn không cần bộ giảm âm (damper): những phím cao nhất không có damper, nên các nốt ở đó tự ngân cho đến khi tắt, dù bạn không giữ bàn đạp."
      - "Trên bản nhạc piano, khuông khóa Sol thường dành cho tay phải và khuông khóa Fa cho tay trái. Đó là quy ước, không phải luật: khóa có thể đổi giữa chừng, và tay trái có khi chơi trên khuông khóa Sol. Hãy luôn nhìn khóa ở đầu khuông."
    ly_do: 'n38 (da-sua): không nguồn nào đã mở nêu số phím không có damper (Kawai FAQ, Yamaha Hub, một trang thợ đàn chỉ nói "những nốt cao nhất" hay "top couple of octaves"), nên bỏ "khoảng hơn một quãng tám trên cùng"; "bộ tắt tiếng" đổi thành "bộ giảm âm" theo src/data/thuat-ngu.yml (mục sordino) và trang Bàn đạp cũ.; n40 (da-sua, review D4-gom): bỏ "và ngược lại" (chưa có nguồn); khóa đổi giữa chừng và tay trái trên khóa Sol theo bản Mutopia Für Elise.'
  - cu: 'Thay vì đếm dòng kẻ từ đầu mỗi lần, hãy thuộc lòng vài nốt mốc, vừa trên khuông vừa trên phím, rồi đọc các nốt khác theo khoảng cách tới mốc gần nhất: "trên G4 một bậc là La4", "dưới C5 một quãng ba là La4". Cách đọc theo mốc và theo quãng này nhanh hơn nhiều so với đọc từng nốt, và là nền tảng của đọc thị tấu.'
    moi: 'Thay vì đếm dòng kẻ từ đầu mỗi lần, hãy thuộc lòng vài nốt mốc, vừa trên khuông vừa trên phím, rồi đọc các nốt khác theo khoảng cách tới mốc gần nhất: "trên G4 một bậc là La4", "dưới C5 một quãng ba là La4". Cách đọc theo mốc và theo quãng này là nền tảng của đọc thị tấu.'
    ly_do: 'n43 (da-bo, review D4-gom): bỏ "nhanh hơn nhiều so với đọc từng nốt", không có nguồn.'
  - cu: "Dấu thăng kép (𝄪) và giáng kép (𝄫): Fa𝄪 là phím Sol (gặp trong gam Sol♯ thứ hòa âm), Si𝄫 là phím La."
    moi: "Dấu thăng kép (×) và giáng kép (♭♭): Fa× là phím Sol (gặp trong gam Sol♯ thứ hòa âm), Si♭♭ là phím La."
    ly_do: "n60 (da-sua): đổi ký hiệu sang × và ♭♭ theo quyết định thuật ngữ trong README (27/10/2026) và nhac-ly/05-dau-hoa đã khóa; nội dung đúng, không đổi."
  - cu:
      - Hermann von Helmholtz, Die Lehre von den Tonempfindungen (1863), cuốn sách làm phổ biến cách ghi quãng tám mang tên ông.
