nhan_dinh:
  - id: n1
    cau: Chỉ cần hai nhóm phím đen và vài nốt mốc, bạn tìm được bất kỳ nốt nào mà không phải đếm, kể cả khi mắt đang nhìn bản nhạc.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời hứa về cách học (đoạn mở đầu; câu "88 phím trông như một hàng rào" là hình ảnh, không tính). Các mục n9–n15, n45–n51 đúng; bài tập n67–n71 luyện đúng việc này.
  - id: n2
    cau: "Đàn piano tiêu chuẩn có 88 phím: 52 phím trắng và 36 phím đen."
    loai: so-lieu
    nguon:
      - omt-keyboard
      - brit-piano
    ket_qua: dung
    ghi_chu: Khớp hồ sơ đã khóa nhac-ly/01-cao-do-ten-not (n22, 88 phím, OMT The Keyboard). 52 + 36 = 88. Hình piano-88 có 88 hình chữ nhật phím; đếm 52 trắng và 36 đen (kiểm hình ngày 28/10/2026).
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Britannica: 88 phím, mỗi quãng tám 7 phím trắng 5 phím đen; A0-C8 gồm A0,B0 + 49 + C8 = 52 phím trắng, 36 phím đen."
  - id: n3
    cau: Đàn có phím từ La0 (A0) ở đầu trầm đến Đô8 (C8) ở đầu cao.
    loai: so-lieu
    nguon:
      - omt-keyboard
      - brit-piano
    ket_qua: dung
    ghi_chu: "Piano 88 phím: A0 đến C8 (OMT The Keyboard and the Grand Staff; Britannica, Piano). Hình ghi nhãn A0 ở đầu trái và C8 ở đầu phải."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "http://www.dolmetsch.com/musictheory1.htm" ]
    luot_2_ghi_chu: "88 phím tới C8 nên phím thấp nhất là La0; Dolmetsch: Đô thấp nhất là C1, quãng tám C0 ghi theo CCC-BBB."
  - id: n4
    cau: Từ La0 đến Đô8 là hơn bảy quãng tám.
    loai: so-lieu
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'A0 đến A7 là 7 quãng tám, thêm tới C8 là thêm một quãng ba thứ: 7 quãng tám và một phần tư, "hơn bảy" đúng; hình âm vực ở trang lịch sử cũ cũng ghi "La0–Đô8 · 7¼ quãng tám".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano" ]
    luot_2_ghi_chu: "Britannica: bảy quãng tám đầy đủ cộng vài phím (thực ra bảy quãng tám cộng một quãng ba thứ)."
  - id: n5
    cau: Phím đen xếp thành nhóm 2 và nhóm 3 xen kẽ nhau.
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: "OMT The Keyboard and the Grand Staff: các phím đen xếp theo nhóm hai và nhóm ba; hình piano-88 vẽ đúng thứ tự (A♯0 đứng riêng ở đầu trầm, rồi nhóm 2, nhóm 3 xen kẽ)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "OMT: quãng hai giữa phím trắng đều là quãng hai trưởng trừ Mi-Fa và Si-Đô; suy ra phím đen ở Đô-Rê, Rê-Mi (nhóm 2) và Fa-Sol, Sol-La, La-Si (nhóm 3)."
  - id: n6
    cau: "Nhóm 2 và nhóm 3 phím đen là chìa khóa của mọi định hướng: mắt và ngón tay nhận ra chúng ngay lập tức."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời giải thích cách học; không trái n5.
  - id: n7
    cau: "Giữa Mi–Fa và Si–Đô không có phím đen: đó là hai nửa cung tự nhiên."
    loai: quy-tac
    nguon:
      - omt-steps
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: Mi–Fa và Si–Đô là hai chỗ nửa cung giữa hai phím trắng, không có phím đen xen. Liên kết "bài 5" tới nhac-ly/05-dau-hoa (đã chuyển, đã khóa).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: "OMT: mọi quãng hai giữa phím trắng là trưởng, trừ Mi-Fa và Si-Đô là quãng hai thứ (nửa cung)."
  - id: n8
    cau: 'Hình piano-88: bàn phím 88 phím, ghi nhãn A0 và các nốt Đô C1–C8, nhãn "Đô giữa (C4)" và "La4 = 440 Hz", cùng nhãn "thường là vùng của tay trái / tay phải".'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm hình src/components/hinh/piano-88.html (không sửa): 88 hình chữ nhật, 52 trắng và 36 đen; C4 là phím trắng thứ 24 từ trái (phím thứ 40 trong 88) và A4 phím thứ 49; nhãn C1–C8 nằm trên đúng các phím Đô. Nhãn tay trái/tay phải: xem n37. Không thấy lỗi trong hình. Review D4-gom: đã đọc src/components/hinh/piano-88.html: 52 phím trắng, 36 phím đen; nhãn A0, C1–C8, \"Đô giữa (C4)\" trên phím trắng thứ 24, \"La4 = 440 Hz\", \"thường là vùng của tay trái/phải\"; chú thích khớp. Không sửa hình."
    review: dung
  - id: n9
    cau: "Cách tìm Đô: phím trắng ngay bên trái nhóm 2 phím đen."
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: "OMT: Đô nằm ngay bên trái nhóm hai phím đen."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Suy ra từ vị trí phím đen: nhóm 2 gồm Đô♯/Rê♭ và Rê♯/Mi♭, nhóm 3 gồm Fa♯, Sol♯, La♯. Cách tìm Đô đúng."
  - id: n10
    cau: "Cách tìm Rê: phím trắng kẹp giữa hai phím đen của nhóm 2."
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: "OMT The Keyboard: D nằm giữa hai phím đen của nhóm hai."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Suy ra từ vị trí phím đen: nhóm 2 gồm Đô♯/Rê♭ và Rê♯/Mi♭, nhóm 3 gồm Fa♯, Sol♯, La♯. Cách tìm Rê đúng."
  - id: n11
    cau: "Cách tìm Mi: phím trắng ngay bên phải nhóm 2."
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: OMT The Keyboard.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Suy ra từ vị trí phím đen: nhóm 2 gồm Đô♯/Rê♭ và Rê♯/Mi♭, nhóm 3 gồm Fa♯, Sol♯, La♯. Cách tìm Mi đúng."
  - id: n12
    cau: "Cách tìm Fa: phím trắng ngay bên trái nhóm 3 phím đen."
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: OMT The Keyboard.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Suy ra từ vị trí phím đen: nhóm 2 gồm Đô♯/Rê♭ và Rê♯/Mi♭, nhóm 3 gồm Fa♯, Sol♯, La♯. Cách tìm Fa đúng."
  - id: n13
    cau: "Cách tìm Sol: giữa phím đen thứ nhất và thứ hai của nhóm 3."
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: Nhóm 3 là Fa♯, Sol♯, La♯; Sol nằm giữa Fa♯ và Sol♯ (OMT The Keyboard).
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Suy ra từ vị trí phím đen: nhóm 2 gồm Đô♯/Rê♭ và Rê♯/Mi♭, nhóm 3 gồm Fa♯, Sol♯, La♯. Cách tìm Sol đúng."
  - id: n14
    cau: "Cách tìm La: giữa phím đen thứ hai và thứ ba của nhóm 3."
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: La nằm giữa Sol♯ và La♯ (OMT The Keyboard).
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Suy ra từ vị trí phím đen: nhóm 2 gồm Đô♯/Rê♭ và Rê♯/Mi♭, nhóm 3 gồm Fa♯, Sol♯, La♯. Cách tìm La đúng."
  - id: n15
    cau: "Cách tìm Si: phím trắng ngay bên phải nhóm 3."
    loai: cau-truc
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: OMT The Keyboard.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument" ]
    luot_2_ghi_chu: "Suy ra từ vị trí phím đen: nhóm 2 gồm Đô♯/Rê♭ và Rê♯/Mi♭, nhóm 3 gồm Fa♯, Sol♯, La♯. Cách tìm Si đúng."
  - id: n16
    cau: "Phím đen mang tên của phím trắng bên cạnh cộng dấu thăng hoặc dấu giáng: phím đen giữa Đô và Rê vừa là Đô♯ vừa là Rê♭."
    loai: ten
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: phím đen trên một nửa cung của phím trắng lấy tên phím trắng cộng "sharp", phím đen dưới thì cộng "flat"; Đô♯ và Rê♭ là cùng một phím.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/" ]
    luot_2_ghi_chu: "OMT: Đô♯ và Rê♭ cùng một phím (tương đương đồng âm); phím đen giữa Đô và Rê có hai tên."
  - id: n17
    cau: "Ký hiệu khoa học: mỗi quãng tám bắt đầu từ một nốt Đô và được đánh số; Đô giữa là C4, Rê ngay trên nó là D4, Si ngay dưới nó là B3."
    loai: ten
    nguon:
      - omt-aspn
      - omt-keyboard
    ket_qua: dung
    ghi_chu: "OMT ASPN: số quãng tám đổi ở nốt C; middle C = C4. Khớp nhac-ly/01-cao-do-ten-not (đã khóa)."
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory1.htm" ]
    luot_2_ghi_chu: "Dolmetsch: ký hiệu khoa học, Đô giữa là C4; quãng tám đổi số ở Đô nên Si ngay dưới là B3."
  - id: n18
    cau: Nốt La ngay trên Đô giữa, A4, là nốt chuẩn để lên dây, ở tần số 440 Hz.
    loai: so-lieu
    nguon:
      - iso16
      - omt-aspn
    ket_qua: dung
    ghi_chu: ISO 16:1975 (nốt A trên khuông Sol = 440 Hz); khớp hồ sơ đã khóa nhac-ly/01-cao-do-ten-not (n21). La4 là nốt La ngay trên Đô4.
    luot_2: dung
    luot_2_nguon: [ "https://www.iso.org/standard/3601.html" ]
    luot_2_ghi_chu: "ISO 16:1975: a' = 440 Hz; La ngay trên Đô giữa là A4."
  - id: n19
    cau: Trên đàn 88 phím, hai phím trắng thấp nhất là A0 và B0; tiếp theo là C1, C2… cho tới C8, phím cuối cùng.
    loai: cau-truc
    nguon:
      - omt-keyboard
      - brit-piano
    ket_qua: dung
    ghi_chu: A0, B0 rồi C1 (quãng tám đổi ở C); C8 là phím trắng cuối.
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory1.htm", "https://www.britannica.com/art/piano" ]
    luot_2_ghi_chu: "Dolmetsch: Đô thấp nhất của đàn grand là C1; 88 phím nên bên dưới có A0, B0; C8 là phím cuối."
  - id: n20
    cau: Đàn có tám nốt Đô; Đô giữa là nốt Đô thứ tư tính từ dưới lên, nằm gần chính giữa đàn.
    loai: so-lieu
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'C1…C8 là tám nốt Đô, C4 là thứ tư. C4 là phím số 40 trong 88 (giữa đàn là giữa phím 44 và 45): "gần chính giữa" đúng.'
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory1.htm", "https://www.britannica.com/art/piano" ]
    luot_2_ghi_chu: "C1 đến C8 là tám nốt Đô; Đô giữa C4 là thứ tư; Dolmetsch: Đô giữa nằm khoảng giữa bàn phím."
  - id: n21
    cau: "Sách cũ, sách về lịch sử đàn và nhiều bản nhạc châu Âu dùng ký hiệu Helmholtz: chữ hoa, chữ thường và dấu phẩy trên."
    loai: ten
    nguon:
      - wiki-helm
      - bh-broadwood
      - mt21c-octave
    ket_qua: dung
    ghi_chu: "Ký hiệu Helmholtz dùng chữ hoa (lặp chữ) cho các quãng tám thấp, chữ thường và dấu phẩy trên cho các quãng tám cao: đúng theo bảng quãng tám của MT21C 1.3 và Wikipedia; tài liệu về đàn của Beethoven-Haus dùng đúng ký hiệu này (CC–c''''). Phần \"nhiều bản nhạc châu Âu\" chỉ có bậc 3; câu viết ở mức chung, chấp nhận."
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory1.htm" ]
    luot_2_ghi_chu: Dolmetsch có mục ký hiệu Helmholtz (chữ hoa, chữ thường, dấu phẩy trên); mức 'nhiều bản nhạc châu Âu' chưa kiểm.
  - id: n22
    cau: Cây đàn Broadwood của Beethoven có âm vực "CC–c''''" (tức C1–C7, sáu quãng tám).
    loai: so-lieu
    nguon:
      - bh-broadwood
      - wiki-helm
    ket_qua: dung
    ghi_chu: "Beethoven-Haus: đàn Broadwood sáu quãng tám, CC đến c''''. CC = C1 và c'''' = C7 theo bảng Helmholtz; C1 đến C7 là sáu quãng tám. Khớp trang cũ lich-su-dan (\"gửi năm 1817\"). Review D4-gom: ghi chú lượt 1 dẫn tài liệu Beethoven-Haus (âm vực CC–c''''); trang lich-su-dan đã chuyển ghi cùng âm vực; CC = C1, c'''' = C7 theo bảng Helmholtz (MT21C). Lượt 2 chỉ thiếu nguồn mở được cho âm vực. Giữ."
    luot_2: khong-chac
    luot_2_ghi_chu: Beethoven nhận Broadwood 1817 (Beethoven-Haus), sáu quãng tám (Wikipedia); âm vực CC-c'''' = C1-C7 (sáu quãng tám theo bảng Dolmetsch) đúng theo hiểu biết chung nhưng chưa mở được nguồn nêu rõ âm vực.
