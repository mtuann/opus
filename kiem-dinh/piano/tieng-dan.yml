nhan_dinh:
  - id: n1
    cau: Trang đi từ cơ chế sinh tiếng đàn qua legato, staccato, dấu luyến, sắc thái, cân bằng và phong cách, kèm sáu bài abc, bảng tập mười phút, bảng lỗi và bốn câu quiz.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: Trang có đủ các mục và đúng sáu khối abc.
    review: null
  - id: n2
    cau: "Tiếng đàn khác nhau giữa hai người chơi đến từ vài thứ người chơi điều khiển được: tốc độ phím đi xuống, thời điểm nhả phím, độ to tương đối giữa các nốt vang cùng lúc, và bàn đạp."
    loai: quy-tac
    nguon:
      - goebl-2004
      - askenfelt-hammer
    ket_qua: dung
    ghi_chu: "Goebl, Bresin, Galembo 2004 và Askenfelt: người chơi chỉ tác động lên âm thanh qua vận tốc búa (tốc độ phím), thời điểm và độ dài nốt, và bàn đạp."
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/askenflt/pianist.html", "https://www.speech.kth.se/music/5_lectures/askenflt/askenflt.html" ]
    luot_2_ghi_chu: "Askenfelt: người chơi chỉ điều khiển gián tiếp qua tốc độ búa; độ to tương đối và thời điểm giữa các nốt quyết định cân bằng. Thời điểm nhả phím và bàn đạp là kiến thức nền (Oxford legato nói về giữ phím)."
  - id: n3
    cau: Khi bấm phím, búa bọc nỉ tách khỏi cơ cấu ngay trước khi chạm dây (cơ chế thoát, escapement), bay tự do, đập dây rồi bật ra; từ đó người chơi không còn tác động lên nốt nữa, chỉ còn giữ (phím hoặc bàn đạp) hoặc dừng (nhả phím, búa chặn rơi xuống dây).
    loai: cau-truc
    nguon:
      - askenfelt-hammer
      - yamaha-mech
    ket_qua: dung
    ghi_chu: "Askenfelt: búa chuyển động tự do sau khi thoát; người chơi chỉ quyết định được vận tốc cuối. Yamaha: cơ cấu thoát tách búa khỏi phím."
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/askenflt/pianist.html", "https://www.speech.kth.se/music/5_lectures/askenflt/timing.html" ]
    luot_2_ghi_chu: "Askenfelt: 'the mechanical contact between the key and the hammer is broken before the hammer strikes the string'; cơ cấu thoát (escapement) làm búa bay tự do."
  - id: n4
    cau: Độ to phụ thuộc vào tốc độ búa, tức tốc độ phím đi xuống, không phải lực ấn vào đáy phím; ấn thêm sau khi nốt đã kêu không làm nốt to hơn.
    loai: quy-tac
    nguon:
      - askenfelt-hammer
      - goebl-2004
    ket_qua: dung
    ghi_chu: "Goebl 2004: âm thanh chỉ phụ thuộc vận tốc búa lúc chạm dây; cách chạm khác nhau cho cùng vận tốc búa không khác tiếng. Vế \"chỉ làm tay căng\" là lời khuyên đi kèm."
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/askenflt/pianist.html" ]
    luot_2_ghi_chu: "Askenfelt: người chơi chỉ ảnh hưởng đến vận tốc cuối của búa và qua đó độ to; búa đã rời phím trước khi chạm dây nên ấn thêm không làm nốt to hơn. Lưu ý: tiếng 'thump' của phím chạm đáy vẫn có, nhưng không làm nốt to hơn."
  - id: n5
    cau: "Nốt càng to càng sáng: búa đập càng nhanh, nỉ càng cứng lại khi chạm dây và tạo nhiều bồi âm cao."
    loai: quy-tac
    nguon:
      - askenfelt-nonlin
      - russell-psu
    ket_qua: dung
    ghi_chu: "Askenfelt: nỉ búa phi tuyến, cứng dần khi bị nén mạnh; Russell: nốt to có nhiều thành phần tần số cao hơn."
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/askenflt/nonlinea.html", "https://www.speech.kth.se/music/5_lectures/askenflt/stricont.html" ]
    luot_2_ghi_chu: "Askenfelt: búa có độ cứng phi tuyến; đánh nhanh thì nỉ như cứng hơn, tiếp xúc ngắn hơn, nhiều bồi âm cao hơn, tiếng sáng hơn khi to."
  - id: n6
    cau: Một tiếng ff gõ thô nghe chói, còn ff đẹp cần trọng lượng cánh tay và cổ tay mềm.
    loai: khuyen-tap
    nguon:
      - askenfelt-nonlin
    ket_qua: da-sua
    ghi_chu: Vế "gõ thô nghe chói" gắn một nhận xét thẩm mỹ vào một cơ chế không có nguồn. Bỏ "gõ thô nghe chói", giữ lời khuyên về trọng lượng cánh tay và cổ tay mềm. Xin review xác nhận loại.
  - id: n7
    cau: Có thể xem và đọc về bồi âm ở bài Âm học cơ bản, mục Âm sắc (#am-sac).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Đã chuyển: nhac-ly/am-hoc.md có mục \"Âm sắc\" với bồi âm và hai công cụ ::cong-cu (overtones, spectrum); liên kết #am-sac tồn tại (hồ sơ nhac-ly/am-hoc.yml)."
    review: null
  - id: n8
    cau: Mọi nốt piano đều nhỏ dần ngay sau khi đánh.
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở nguồn về sự tắt dần của dây piano (Askenfelt và Russell không nêu trong phần đã mở). Gợi ý: dẫn Fletcher & Rossing hoặc Askenfelt về tắt dần, hoặc đổi thành lời khuyên."
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/weinreic/weinreic.html" ]
    luot_2_ghi_chu: "Weinreich: nốt piano bắt đầu to và tắt nhanh, rồi chuyển sang tốc độ tắt chậm hơn nhiều (aftersound); vẫn là nhỏ dần."
  - id: n9
    cau: "Một \"giai điệu hát\" trên piano là ảo giác dựng nên: mỗi nốt sau đánh khớp với độ vang còn lại của nốt trước, các nốt nối nhau không hở, thời gian giữa chúng co giãn tinh tế."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Cách nói hình ảnh về kỹ năng nghe và nối nốt.
  - id: n10
    cau: "Bảng \"Bạn điều khiển / Người nghe nhận ra\", hàng 1: tốc độ phím đi xuống quyết định to hay nhỏ, phần nào sáng hay tối."
    loai: quy-tac
    nguon:
      - askenfelt-nonlin
      - goebl-2004
    ket_qua: dung
    ghi_chu: Cùng nguồn các nhận định về độ to và độ sáng.
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/askenflt/pianist.html", "https://www.speech.kth.se/music/5_lectures/askenflt/stricont.html" ]
    luot_2_ghi_chu: Tốc độ phím quyết định tốc độ búa nên quyết định độ to; độ sáng tối đổi theo độ to (Askenfelt).
  - id: n11
    cau: "Bảng, hàng 2: thời điểm bấm quyết định tiết tấu, nhấn nhá, rubato."
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: hiển nhiên về nghĩa nhưng chưa dẫn nguồn; có thể hạ thành khuyen-tap hoặc coi là định nghĩa."
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/askenflt/pianist.html" ]
    luot_2_ghi_chu: "Askenfelt: 'the timing and strength of certain notes relative to other notes'; thời điểm bấm quyết định tiết tấu là hiển nhiên."
  - id: n12
    cau: "Bảng, hàng 3: thời điểm nhả quyết định độ dài nốt: legato, staccato, ngắt câu."
    loai: quy-tac
    nguon:
      - goebl-2004
    ket_qua: dung
    ghi_chu: "Goebl 2004: người chơi điều khiển thời điểm và độ dài nốt (articulation)."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/legato", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/staccato" ]
    luot_2_ghi_chu: "COM: legato = giữ phím cho tới khi ngón kế chạm phím; staccato = giữ ngắn hơn giá trị. Thời điểm nhả quyết định độ dài nốt."
  - id: n13
    cau: "Bảng, hàng 4: độ to tương đối giữa các nốt vang cùng lúc tạo cân bằng: giai điệu nổi, phần đệm lùi."
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa dẫn nguồn; có thể xem là định nghĩa \"cân bằng\" (voicing)."
    luot_2: dung
    luot_2_nguon: [ "https://www.speech.kth.se/music/5_lectures/askenflt/pianist.html" ]
    luot_2_ghi_chu: "Askenfelt: cân bằng hợp âm 'seems mainly to be a question of the timing and strength of certain notes relative to other notes'."
  - id: n14
    cau: "Bảng, hàng 5: bàn đạp quyết định độ vang, độ nối, màu âm thanh."
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa dẫn nguồn cho \"màu âm thanh\"; chi tiết ở trang ban-dap (đã chuyển, hồ sơ riêng)."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano" ]
    luot_2_ghi_chu: "Britannica: bàn đạp phải nhấc toàn bộ búa chặn để dây rung tự do; bàn đạp trái dịch cơ cấu sang bên đổi cách búa chạm dây. Hợp với 'độ vang, độ nối, màu âm thanh'."
  - id: n15
    cau: "Hộp mẹo \"Đáy phím không phải nơi để ấn\": khi nốt đã kêu chỉ giữ phím bằng lực vừa đủ để phím không bật lên, nhả lực ngay khi chạm đáy."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập, kèm bài tự kiểm.
  - id: n16
    cau: Đây là thói quen quan trọng nhất để chơi lâu mà không mỏi (xem Giữ đôi tay khỏe và Tư thế, thế tay).
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: "Không có nguồn cho \"quan trọng nhất\". BAPAM: tránh gồng, tập đợt ngắn. Sửa thành \"Thói quen này giúp tay đỡ gồng khi chơi lâu\"."
    luot_2: khong-chac
    luot_2_ghi_chu: Câu chỉ dẫn tới mục khác của site và là nhận định về sức khỏe ('chơi lâu không mỏi'). Không đủ ngữ cảnh để kiểm; không mở trang.
  - id: n17
    cau: Liên kết sang Giữ đôi tay khỏe (piano/suc-khoe) và Tư thế, thế tay (piano/tu-the).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: tu-the đã chuyển và có mục tương ứng; suc-khoe chưa chuyển (opus-zero/docs/piano/suc-khoe.md tồn tại); lô chuyển phải giữ mục "Dấu hiệu cảnh báo".
    review: null
  - id: n18
    cau: Legato (thường ghi bằng dấu luyến) nghĩa là các nốt nối nhau không hở.
    loai: dinh-nghia
    nguon:
      - dolmetsch-art
    ket_qua: dung
    ghi_chu: "Dolmetsch: legato là chơi các nốt nối liền, thường ghi bằng dấu luyến."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/legato" ]
    luot_2_ghi_chu: "COM: legato = 'bound together', không dừng giữa hai nốt, ghi bằng dấu luyến (slur)."
  - id: n19
    cau: "Legato bằng ngón là chuyện thời điểm nhả: ngón trước rời phím đúng lúc ngón sau chạm đáy phím; hở là nhả sớm, dính là nhả muộn."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên và hình ảnh "hai bàn chân khi đi bộ".
  - id: n20
    cau: Ở giai điệu chậm, nhiều nghệ sĩ cho hai nốt chồng nhau một chút (legatissimo) để câu hát liền hơn.
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở nguồn cho legatissimo hay cho thực hành của \"nhiều nghệ sĩ\". Gợi ý: đổi thành lời khuyên (\"có thể thử cho hai nốt chồng nhau một chút\") hoặc dẫn nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://open.bu.edu/items/ee3547df-d786-4b26-a531-e93edb2bf945", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/legato" ]
    luot_2_ghi_chu: "Jacobs và Bullock (1997): thời gian chồng nốt (key overlap time) tăng khi tempo chậm lại ở thang và rải; COM có thuật ngữ legatissimo."
  - id: n21
    cau: "Bài tập: năm nốt Đô–Rê–Mi–Fa–Sol thật chậm, mỗi nốt hai giây, chỉ nghe chỗ nối."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Bài tập.
    luot_2: dung
    luot_2_ghi_chu: Bài tập nghe chỗ nối hợp lý và an toàn.
  - id: n22
    cau: "Ba công cụ ngón bấm cho legato: luồn ngón cái và vắt ngón như khi chơi gam; đổi ngón trên phím đang giữ (finger substitution), hay gặp trong nhạc nhiều bè của Bach và chuỗi hợp âm; trượt ngón từ phím đen xuống phím trắng bằng cùng một ngón."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên ngón bấm; liên kết sang gam (đã chuyển). "Hay gặp trong nhạc nhiều bè của Bach" là nhận xét kèm theo.
  - id: n23
    cau: Trượt ngón là cách nối mà Chopin dùng nhiều.
    loai: lich-su
    nguon:
      - rosen-nyrb
    ket_qua: da-sua
    ghi_chu: "Rosen (NYRB) nói Chopin dùng ngón bấm kiểu trượt/thay ngón trên phím đen; không có nguồn cho \"nhiều\". Sửa: \"mà Chopin cũng dùng\"."
