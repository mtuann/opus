  - cu: "Trong nhạc Cổ điển, dấu luyến trước hết là dấu phát âm: các nốt dưới dấu luyến được nối liền, nốt đầu hơi nặng hơn, nốt cuối nhẹ và hơi ngắn lại, rồi có một khoảng ngắt nhỏ trước nốt tiếp theo. Türk mô tả điều này trong sách dạy đàn phím năm 1789: nốt mở đầu dấu luyến được nhấn rất nhẹ, gần như không nhận ra."
