doi_chu:
  - cu: Nốt càng to càng sáng. Búa đập càng nhanh, nỉ càng "cứng" lại khi chạm dây và tạo nhiều bồi âm cao. Vì vậy một tiếng ff gõ thô nghe chói, còn ff đẹp cần trọng lượng cánh tay và cổ tay mềm. Bạn có thể nhìn thấy bồi âm, và đọc lý thuyết về chúng, ở bài Âm học cơ bản.
    moi: Nốt càng to càng sáng. Búa đập càng nhanh, nỉ càng "cứng" lại khi chạm dây và tạo nhiều bồi âm cao. Vì vậy muốn một tiếng ff đầy, hãy dùng trọng lượng cánh tay và cổ tay mềm. Bạn có thể nhìn thấy bồi âm, và đọc lý thuyết về chúng, ở bài Âm học cơ bản.
    ly_do: 'n6 (da-sua): bỏ "gõ thô nghe chói" (nhận xét không có nguồn), giữ lời khuyên.'
  - cu: "Khi nốt đã kêu, chỉ giữ phím bằng lực vừa đủ để phím không bật lên. Bấm thử một nốt f rồi để ý khoảnh khắc ngay sau khi chạm đáy: tay bạn có còn ấn không? Nếu có, nhả lực đó ra. Đây là thói quen quan trọng nhất để chơi lâu mà không mỏi (xem Giữ đôi tay khỏe và Tư thế, thế tay)."
