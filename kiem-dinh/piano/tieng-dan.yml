  - id: n40
    cau: "Trong nhạc Cổ điển, dấu luyến trước hết là dấu phát âm: nốt dưới dấu luyến nối liền, nốt đầu hơi nặng hơn, nốt cuối nhẹ và hơi ngắn lại, rồi có một khoảng ngắt nhỏ trước nốt tiếp theo."
    loai: quy-tac
    nguon:
      - dolmetsch-art
      - oup-gunn
    ket_qua: dung
    ghi_chu: "Dolmetsch: dấu luyến Classical nhấn nốt đầu và nhẹ dần nốt cuối; Gunn (OUP): luyến hai nốt kiểu \"tiếng thở dài\" nhấn nốt đầu, nốt sau nhẹ và ngắn."
    luot_2: khong-chac
    luot_2_nguon: [ "https://ncem.co.uk/slurs/", "https://www.dolmetsch.com/musictheory21.htm" ]
    luot_2_ghi_chu: "Không mở được văn bản của Türk (1789) về dấu luyến. Leopold Mozart (Violinschule 1756, qua NCEM): nốt đầu mạnh và giữ lâu hơn, các nốt sau nhẹ dần; Dolmetsch dẫn Türk: nhấc ngón sớm hơn giá trị nốt. Hướng khớp nhưng chưa xác nhận chi tiết 'nốt cuối nhẹ, ngắn' và 'khoảng ngắt nhỏ' cho đàn phím Cổ điển."
  - id: n41
    cau: "Türk mô tả trong sách dạy đàn phím năm 1789: nốt mở đầu dấu luyến được nhấn rất nhẹ"
    loai: quy-tac
    nguon: []
    ket_qua: da-sua
    ghi_chu: "Chưa mở bản Klavierschule nên không xác nhận được Türk nói đúng như vậy; câu còn mâu thuẫn nhẹ với câu trước (\"nốt đầu hơi nặng hơn\"). Thay bằng câu không gán cho Türk, theo Dolmetsch và Gunn: nốt đầu dưới dấu luyến được nhấn hơn, các nốt sau nhạt dần."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory21.htm" ]
    luot_2_ghi_chu: Không mở được đoạn của Türk về dấu luyến. Dolmetsch dẫn Türk ở chỗ khác (nhấc ngón sớm hơn giá trị nốt). Chưa xác nhận câu 'nốt mở đầu dấu luyến được nhấn rất nhẹ' là của Türk 1789.
  - id: n42
    cau: "Dấu luyến hai nốt (dạng \"tiếng thở dài\", nốt nghịch đi xuống nốt thuận) chơi bằng động tác thả – lăn – nhấc: thả trọng lượng vào nốt đầu, cổ tay lăn lên khi chơi nốt hai nhẹ hơn, tay rời phím cùng chuyển động nên nốt hai hơi ngắn."
