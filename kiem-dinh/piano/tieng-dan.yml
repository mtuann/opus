    ket_qua: null
    ghi_chu: "chưa chắc: vế dấu luyến Cổ điển có nguồn (xem nhận định về dấu luyến); các vế còn lại (Alberti nhẹ, bàn đạp ngắn) chưa có nguồn."
    luot_2: khong-chac
    luot_2_ghi_chu: "Tóm tắt phong cách Cổ điển (dấu luyến ngắn nhấc tay, Alberti nhẹ, bàn đạp ngắn): không có nguồn bậc 2 đã mở xác nhận từng ý. Không thấy mâu thuẫn."
  - id: n63
    cau: "Bảng, hàng Lãng mạn (Chopin, Schumann, Brahms, Liszt): legato hát (cantabile), dài nhiều tầng; dải rộng, rubato, cân bằng nhiều lớp; bàn đạp gần như liên tục, đổi theo hòa âm."
