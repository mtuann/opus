    cau: "Bảng, hàng Thế kỷ 20 (Bartók, Prokofiev): thường sắc, nhịp nhàng như máy; tương phản với staccato khô; nhấn mạnh tiết tấu; bàn đạp theo ký hiệu, thường khô."
