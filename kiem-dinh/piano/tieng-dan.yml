    cau: "Trong cùng một tay: dồn trọng lượng về ngón chơi giai điệu (thường ngón 4 hoặc 5), ngón ấy chắc và đi trước một phần nghìn giây, các ngón kia nhẹ như chỉ chạm phím."
    loai: khuyen-tap
    nguon: []
    ket_qua: da-sua
    ghi_chu: Số "một phần nghìn giây" không có nguồn và là chi tiết đo lường, không phải lời khuyên tập. Bỏ vế "đi trước một phần nghìn giây", giữ phần dồn trọng lượng.
  - id: n54
    cau: "Bốn bước tập cân bằng trong một tay: chơi riêng giai điệu, bấm câm các nốt dưới, cho nốt dưới kêu thật khẽ, chơi bình thường."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n55
    cau: "Khối abc 6: tay phải ba hợp âm mẫu Đô–Mi–Sol, Đô–Fa–La, Si–Rê–Fa; nốt trên mf, các nốt dưới p."
    loai: cau-truc
    nguon: []
    ket_qua: dung
    ghi_chu: "Khối 6 (4/4, K:C): ô 1 G4 A4 trên [CE]4 [CF]4 (C–E–G, C–F–A), ô 2 G4 F4 trên [CE]4 [B,D]4 (C–E–G, B–D–F), ô 3 E8 trên [G,C]8; khớp văn bản. Đô–Fa–La là thể đảo hai của Fa trưởng."
    luot_2: khong-chac
    luot_2_ghi_chu: "Mô tả khuông trên site, không mở trang. Về nhạc lý: Đô–Mi–Sol, Đô–Fa–La (Fa/Đô), Si–Rê–Fa là ba hợp âm hợp lý để tập cân bằng."
  - id: n56
    cau: Tay phải dùng ngón 1–3–5 cho hợp âm thể gốc và thể đảo hai, ngón 1–2–4 cho Si–Rê–Fa.
