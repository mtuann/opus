    ghi_chu: "Dolmetsch: dấu luyến Classical nhấn nốt đầu và nhẹ dần nốt cuối; Gunn (OUP): luyến hai nốt kiểu \"tiếng thở dài\" nhấn nốt đầu, nốt sau nhẹ và ngắn. Review D4-gom: Gunn (OUP blog): \"The first note under a slur is accentuated more strongly\", các nốt sau nhỏ dần, tay nhấc lên ở nốt cuối (\"The slur indicates attack and release\"); NCEM (Leopold Mozart 1756): nốt đầu nhấn hơn, giữ lâu hơn, các nốt sau nhỏ dần; Dolmetsch: dấu luyến bỏ tiếng tấn công ở mọi nốt trừ nốt đầu. Đủ cho nốt đầu nặng, nốt cuối nhẹ, ngắn lại rồi ngắt. Giữ."
    luot_2: khong-chac
    luot_2_nguon: [ "https://ncem.co.uk/slurs/", "https://www.dolmetsch.com/musictheory21.htm" ]
    luot_2_ghi_chu: "Không mở được văn bản của Türk (1789) về dấu luyến. Leopold Mozart (Violinschule 1756, qua NCEM): nốt đầu mạnh và giữ lâu hơn, các nốt sau nhẹ dần; Dolmetsch dẫn Türk: nhấc ngón sớm hơn giá trị nốt. Hướng khớp nhưng chưa xác nhận chi tiết 'nốt cuối nhẹ, ngắn' và 'khoảng ngắt nhỏ' cho đàn phím Cổ điển."
  - id: n41
    cau: "Türk mô tả trong sách dạy đàn phím năm 1789: nốt mở đầu dấu luyến được nhấn rất nhẹ"
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: "Chưa mở bản Klavierschule nên không xác nhận được Türk nói đúng như vậy; câu còn mâu thuẫn nhẹ với câu trước (\"nốt đầu hơi nặng hơn\"). Thay bằng câu không gán cho Türk, theo Dolmetsch và Gunn: nốt đầu dưới dấu luyến được nhấn hơn, các nốt sau nhạt dần. Review D4-gom: Câu thay thế của lượt 1 (\"Nốt đầu dưới dấu luyến được nhấn hơn, các nốt sau nhạt dần.\") lặp ý câu trước (n40); bỏ. Trang không còn câu gán cho Türk."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory21.htm" ]
    luot_2_ghi_chu: Không mở được đoạn của Türk về dấu luyến. Dolmetsch dẫn Türk ở chỗ khác (nhấc ngón sớm hơn giá trị nốt). Chưa xác nhận câu 'nốt mở đầu dấu luyến được nhấn rất nhẹ' là của Türk 1789.
