  - id: n61
    cau: "Bảng phong cách, hàng Baroque (Bach, Handel, Scarlatti): nhiều nốt hơi tách, phát âm làm rõ môtip; legato có nhưng không phải mặc định; sắc thái theo câu và kết cấu; bàn đạp rất ít."
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa dẫn nguồn cho khái quát về phát âm Baroque. Gợi ý: hạ cả bảng xuống khuyen-tap nếu người gọi coi là lời khuyên, hoặc dẫn Neuhaus, Sándor, Dolmetsch."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory21.htm" ]
    luot_2_ghi_chu: "Dolmetsch: 'music then was played in a more detached manner'; legato không phải mặc định. Các chi tiết còn lại của hàng là tóm tắt phong cách, không thấy mâu thuẫn."
  - id: n62
    cau: "Bảng, hàng Cổ điển (Haydn, Mozart, Beethoven thời trẻ): rõ, nhẹ; dấu luyến ngắn khép lại bằng nhấc tay; legato đúng dấu ghi; tương phản nhanh (fp, sf); đệm Alberti rất nhẹ; bàn đạp ngắn, nhẹ."
