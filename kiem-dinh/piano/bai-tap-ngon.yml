ghi_chu: 'Lượt 1 trang Bài tập ngón và étude (lô D4-L2, phần A). Nguồn đã mở: IMSLP (trang tác phẩm Hanon, Brahms, Czerny, Burgmüller, Heller, Cramer, Clementi, Moszkowski, Chopin, Liszt, Debussy), Henle (Burgmüller Op. 100, Chopin), bản scan Hanon trên Internet Archive (mục lục), Chang Fundamentals of Piano Practice III.7, BAPAM The Healthy Pianist, ABRSM 2025–26. Mục Nguồn của trang đã viết lại theo các nguồn này (bỏ danh sách sách in chưa mở: Thomas Mark, Gerig, Bernstein, Bartók/Boosey, Dohnányi/Rózsavölgyi, Cortot bản dịch). Điều cần người giao quyết định: (1) cột Cấp độ của bảng étude (n34): không có nguồn cho từng khoảng Grade; hoặc xóa cột, hoặc chấp nhận như ước lượng đã tự nêu "ước lượng thô"; Moszkowski, Liszt, Debussy (n36) cũng chưa kiểm; (2) Bartók Mikrokosmos (n16), Kabalevsky Op. 39 (n17), Brahms "tích lũy qua nhiều năm" (n39): chưa mở nguồn; (3) khối abc 4 và n51 (mẫu Hanon rút gọn): chưa đối chiếu từng nốt với bản in. Đã sửa (da-sua): n5, n6, n7, n8, n10, n11, n21 (Czerny 636), n23 (Heller), n26 (Cramer), n42, n43, n45, n49, n55, n56; không có nhận định da-bo. Hình tĩnh luon-ngon.html và pedal-timing.html thuộc trang Gam và Bàn đạp, xem hồ sơ hai trang đó. So hồ sơ khóa trước: kiem-dinh/du-lieu/nha-soan-nhac/burgmuller.yml và heller.yml ghi Burgmüller Op. 100 (Arabesque), Heller Op. 45, 46, 47 và trỏ về piano/bai-tap-ngon.md: khớp (Op. 100, 105, 109; Op. 45, 46, 47 đều còn trên trang). Hồ sơ lo-trinh-choi và 10-bai-dau-tien không trỏ tới trang này ngoài mục Kỹ thuật (khớp). Thuật ngữ chưa có trong src/data/thuat-ngu.yml (grep 28/10/2026): étude có (id etude), còn thiếu: bài tập ngón (exercise), Hanon, tuyển étude Op. (không cần). Không tính là nhận định: tiêu đề, mô tả, các đề mục.'
doi_chu:
  - cu:
      - Lặp vô thức. Tay chạy, đầu ở chỗ khác. Khi ấy bạn đang luyện chính sự lơ đễnh, và tai cùn dần. Nhiều nhà sư phạm coi đây là tác hại lớn nhất của bài tập ngón.
      - "Căng cơ. Nâng ngón thật cao rồi đập xuống, khóa cổ tay, ấn đáy phím sau khi nốt đã kêu (xem Tạo tiếng đàn). Cố luyện cho ngón 4 nhấc lên độc lập hoàn toàn là đi ngược giải phẫu: gân duỗi của ngón 4 được nối với gân của các ngón bên cạnh, nên nó không bao giờ nhấc lên tự do như ngón 2."
      - "Quá tải. Cùng một chuyển động lặp hàng trăm lần, to, nhanh, với bàn tay mở rộng (quãng tám, hợp âm lớn), không nghỉ: đó là công thức của chấn thương do lặp lại. Xem Giữ đôi tay khỏe."
    moi:
      - Lặp vô thức. Tay chạy, đầu ở chỗ khác. Khi ấy bạn đang luyện chính sự lơ đễnh, và tai cùn dần. Tập mà không nghe không chỉ vô ích mà còn có hại.
      - "Căng cơ. Tránh nâng ngón thật cao rồi đập xuống, khóa cổ tay, ấn đáy phím sau khi nốt đã kêu (xem Tạo tiếng đàn). Cố luyện cho ngón 4 nhấc lên hoàn toàn độc lập là đi ngược giải phẫu: gân duỗi của ngón 4 có sợi nối sang gân của ngón 3 và ngón 5, và nhấc ngón 4 quá cao dễ làm ngón 3 và 5 căng theo."
      - Quá tải. Nên tránh lặp một kỹ thuật liền quá một thời gian ngắn và tránh căng tay quá mức (như quãng tám hay hợp âm lớn liên tục). Xem Giữ đôi tay khỏe.
    ly_do: 'n5 (da-sua): Câu cũ: "…tai cùn dần. Nhiều nhà sư phạm coi đây là tác hại lớn nhất của bài tập ngón." "Nhiều nhà sư phạm" và "tác hại lớn nhất" không có nguồn nào mở được, nên bỏ; giữ lời khuyên tập nghe.; n7 (da-sua): Câu cũ: "gân duỗi của ngón 4 được nối với gân của các ngón bên cạnh, nên nó không bao giờ nhấc lên tự do như ngón 2". "Không bao giờ" và "như ngón 2" quá tuyệt đối; sửa theo Chang III.7 (các gân duỗi nối nhau, độc lập ngón có giới hạn): nêu đúng ngón 3 và 5 và hệ quả "dễ căng theo". Sửa tương ứng ở câu quiz (n55).; n6 (da-sua): Câu cũ mô tả như khẳng định ("Nâng ngón thật cao rồi đập xuống…"); đổi thành lời khuyên "Tránh…", bỏ ngụ ý nguyên nhân chấn thương. Liên kết Tạo tiếng đàn: xem n58.; n8 (da-sua): Câu cũ: "Cùng một chuyển động lặp hàng trăm lần, to, nhanh, với bàn tay mở rộng…: đó là công thức của chấn thương do lặp lại". "Hàng trăm lần" và "công thức của chấn thương" không có nguồn; viết lại theo BAPAM (tránh lặp một kỹ thuật quá lâu, tránh căng tay quá mức). Sức khỏe không xếp khuyen-tap.'
  - cu: Một số trường phái sư phạm, như của Dorothy Taubman, còn cho rằng bài tập ngón rời rạc hại nhiều hơn lợi. Bạn không cần đi xa đến vậy, nhưng nên dùng chúng ít, ngắn và có chủ đích.
    moi: Có tác giả còn khuyên bỏ hẳn Hanon và dành thời gian ấy cho bản nhạc thật. Bạn không cần đi xa đến vậy, nhưng nên dùng bài tập ngón ít, ngắn và có chủ đích.
    ly_do: 'n10 (da-sua): Câu cũ: "Một số trường phái sư phạm, như của Dorothy Taubman, còn cho rằng bài tập ngón rời rạc hại nhiều hơn lợi." Không mở được nguồn cho phát biểu về trường phái Taubman; Chang III.7 đề nghị bỏ Hanon, nên sửa thành "Có tác giả…" và bỏ tên Taubman.'
  - cu: "Đau, tê, ngứa ran, hoặc mỏi không hết sau một đêm nghỉ: dừng bài tập ngay, nghỉ, và đọc Giữ đôi tay khỏe. Nếu kéo dài, hãy đi khám. Không bài tập nào đáng để đổi lấy đôi tay."
    moi: "Đau, tê hoặc ngứa ran: dừng bài tập ngay, nghỉ, và đọc Giữ đôi tay khỏe. Nếu lo ngại hay kéo dài, hãy đi khám. Không bài tập nào đáng để đổi lấy đôi tay."
    ly_do: 'n11 (da-sua): Câu cũ: "Đau, tê, ngứa ran, hoặc mỏi không hết sau một đêm nghỉ… Nếu kéo dài, hãy đi khám." Bỏ ngưỡng "mỏi không hết sau một đêm nghỉ" (không có nguồn); BAPAM khuyên dừng khi đau và đi khám khi triệu chứng không hết. Câu "Không bài tập nào đáng để đổi lấy đôi tay" là lời kết, không tính. Liên kết Giữ đôi tay khỏe: n58.'
  - cu: Czerny, Op. 636 (24 bài; tên tiếng Anh Preliminary School of Finger Dexterity)
    moi: Czerny, Op. 636 (24 bài; tên gốc Vorschule der Fingerfertigkeit)
    ly_do: 'n21 (da-sua): Câu cũ: "tên tiếng Anh Preliminary School of Finger Dexterity". Tên gốc tiếng Đức là Vorschule der Fingerfertigkeit (IMSLP, Op. 636, 24 bài); chữ tiếng Anh là bản dịch của nhà in, nên đổi sang tên gốc cho khớp cách ghi các tập khác trong bảng.'
  - cu:
      - "Grade 4–7 (thường xếp từ dễ đến khó: Op. 47, 45, 46)"
      - Câu nhạc, tiết tấu, hát giai điệu. Tên gốc của Op. 47 là "để rèn cảm giác tiết tấu và biểu cảm", của Op. 45 là "nhập môn nghệ thuật phân câu"
    moi:
      - Grade 4–7
      - Câu nhạc, tiết tấu, hát giai điệu. Tên gốc của Op. 47 là "để rèn cảm giác tiết tấu và biểu cảm"; Op. 45 là tập chuẩn bị cho L'art de phraser Op. 16 ("nghệ thuật phân câu")
    ly_do: "n23 (da-sua): Câu cũ: tên gốc của Op. 45 là \"nhập môn nghệ thuật phân câu\". IMSLP ghi Op. 45 là \"Introduction à l'art de phraser\" (25 études préparatoires à l'Art de phraser Op. 16); sửa thành mô tả tập chuẩn bị cho Op. 16. Cũng bỏ vế \"thường xếp từ dễ đến khó: Op. 47, 45, 46\" (không nguồn; xem n34)."
  - cu: Cramer, tuyển étude do Hans von Bülow chọn và chú giải
    moi: Cramer, 60 étude do Hans von Bülow chọn
    ly_do: 'n26 (da-sua): Câu cũ: "tuyển étude do Hans von Bülow chọn và chú giải". IMSLP: 60 Studies selected by Hans von Bülow (từ 84 étude); "chú giải" không kiểm được nên bỏ, ghi con số 60.'
  - cu: 'Charles-Louis Hanon in Le Pianiste virtuose ("nghệ sĩ piano điêu luyện") ở Boulogne năm 1873. Sách có ba phần: bài 1–20 là bài chuẩn bị, mỗi bài một mẫu tám nốt được nhắc lại từ từng bậc, đi lên hai quãng tám rồi đi xuống; bài 21–43 thêm gam và hợp âm rải; bài 44–60 gồm nốt lặp, nốt kép, gam quãng ba, quãng tám và tremolo.'
    moi: 'Charles-Louis Hanon in Le Pianiste virtuose ("nghệ sĩ piano điêu luyện") ở Boulogne năm 1873. Sách có ba phần: bài 1–20 là bài chuẩn bị (ngón độc lập, giãn ngón, chuẩn bị cho trill), trong đó bài 1 là một mẫu tám nốt được nhắc lại từ từng bậc, đi lên hai quãng tám rồi đi xuống; bài 21–43 thêm gam ở mọi giọng và hợp âm rải; bài 44–60 gồm nốt lặp, nốt kép (quãng ba, quãng sáu), gam quãng ba, gam quãng tám và tremolo.'
    ly_do: 'n42 (da-sua): Câu cũ: "bài 1–20 là bài chuẩn bị, mỗi bài một mẫu tám nốt…; bài 21–43 thêm gam và hợp âm rải; bài 44–60 gồm nốt lặp, nốt kép, gam quãng ba, quãng tám và tremolo." Mục lục bản scan: Part I (1–20) chuẩn bị độc lập ngón, giãn ngón, chuẩn bị trill; Part II (21–43) gam ở mọi giọng và hợp âm rải; Part III (44–60) nốt lặp, nốt kép (quãng ba, sáu), gam quãng ba, quãng tám, tremolo. "Mỗi bài một mẫu tám nốt" không đúng cho cả 1–20 nên chuyển thành riêng bài 1; chi tiết thêm từ mục lục.'
  - cu: "Phần 1 toàn phím trắng ở Đô trưởng: không luyện được địa hình phím đen"
    moi: "Bài 1 chỉ có phím trắng ở Đô trưởng: không luyện được địa hình phím đen"
    ly_do: 'n43 (da-sua): Câu cũ: "Phần 1 toàn phím trắng ở Đô trưởng". Sai: Phần 1 (bài 1–20) có cả bài ở giọng khác; chỉ bài 1 là Đô trưởng toàn phím trắng. Sửa cả câu quiz (n56).; n56 (da-sua): Câu cũ: "Phần 1 (bài 1–20) của Hanon có hạn chế gì? + Toàn phím trắng ở Đô trưởng". Sửa cho khớp n43 (chỉ bài 1).'
  - cu: Tập to, nhanh và lâu là đường ngắn nhất tới quá tải
    moi: Tập to, nhanh và lâu mà không nghỉ dễ dẫn tới quá tải
    ly_do: 'n45 (da-sua): Câu cũ: "Tập to, nhanh và lâu là đường ngắn nhất tới quá tải". "Đường ngắn nhất" quá mạnh; sửa theo BAPAM (lặp lâu và căng quá mức dễ gây quá tải). Sức khỏe không xếp khuyen-tap.'
  - cu: Các bài dưới đây soạn cho trang này; riêng bài 4 là mẫu bài số 1 của Hanon (sách đã hết bản quyền), rút gọn. Bắt đầu ở ♩ = 60 hoặc chậm hơn.
    moi: Các bài dưới đây soạn cho trang này; bài 4 dùng mẫu của bài số 1 của Hanon, rút gọn. Bắt đầu ở ♩ = 60 hoặc chậm hơn.
    ly_do: 'n49 (da-sua): Câu cũ: "…riêng bài 4 là mẫu bài số 1 của Hanon (sách đã hết bản quyền), rút gọn." Bỏ vế "đã hết bản quyền" (khẳng định pháp lý, không kiểm bằng nguồn trang này); giữ việc mượn mẫu Hanon số 1.'
  - cu:
      - Charles-Louis Hanon, Le Pianiste virtuose en 60 exercices (Boulogne, 1873).
      - "Carl Czerny, Op. 599, 636, 299, 740, 849; Friedrich Burgmüller, Op. 100, 105, 109; Stephen Heller, Op. 45, 46, 47; Muzio Clementi, Gradus ad Parnassum Op. 44; Johann Baptist Cramer; Johannes Brahms, 51 Übungen WoO 6 (Berlin: Simrock, 1893): bản nhạc trên IMSLP."
      - Béla Bartók, Mikrokosmos (Boosey & Hawkes).
      - "Ernő Dohnányi, Essential Finger Exercises (Budapest: Rózsavölgyi, 1929)."
      - "Alfred Cortot, Principes rationnels de la technique pianistique (bản tiếng Anh: Rational Principles of Pianoforte Technique)."
      - Thomas Mark, What Every Pianist Needs to Know About the Body (2003).
      - Reginald R. Gerig, Famous Pianists and Their Technique (1974).
      - Seymour Bernstein, With Your Own Two Hands (1981).
    moi:
      - "Bản nhạc và danh mục tác phẩm: trang tác phẩm trên IMSLP (Hanon, Brahms WoO 6, Dohnányi, Cortot, Czerny, Burgmüller, Heller, Cramer, Clementi, Moszkowski, Liszt, Debussy); bản Urtext của G. Henle Verlag cho Burgmüller Op. 100 và các étude của Chopin."
      - Charles-Louis Hanon, Le Pianiste virtuose en 60 exercices (Boulogne, 1873); bản tiếng Anh The Virtuoso Pianist (G. Schirmer, 1900), bản số hóa trên Internet Archive.
      - Chuan C. Chang, Fundamentals of Piano Practice, mục Exercises.
      - BAPAM, The Healthy Pianist.
    ly_do: "Mục Nguồn: viết lại theo các nguồn lượt 1 đã mở (IMSLP, Henle, bản scan Hanon, Chang, BAPAM); bỏ các sách in chưa mở."
