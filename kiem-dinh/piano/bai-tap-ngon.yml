    ghi_chu: 'Câu cũ: "tên tiếng Anh Preliminary School of Finger Dexterity". Tên gốc tiếng Đức là Vorschule der Fingerfertigkeit (IMSLP, Op. 636, 24 bài); chữ tiếng Anh là bản dịch của nhà in, nên đổi sang tên gốc cho khớp cách ghi các tập khác trong bảng.'
