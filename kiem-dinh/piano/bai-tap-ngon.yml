nhan_dinh:
  - id: n1
    cau: "Bài tập ngón (exercise) là một mẫu chuyển động lặp đi lặp lại, gần như không có âm nhạc: Hanon, 51 Übungen của Brahms, Dohnányi, Cortot."
    loai: dinh-nghia
    nguon:
      - chang
      - imslp
    ket_qua: dung
    ghi_chu: Cách dùng thuật ngữ thông thường; các tập Hanon, Brahms WoO 6 ("51 Übungen"), Dohnányi, Cortot có trên IMSLP; Chang III.7 bàn về bài tập ngón kiểu Hanon.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/51_Exercises,_WoO_6_(Brahms,_Johannes)", "https://imslp.org/wiki/The_Virtuoso_Pianist_(Hanon,_Charles-Louis)" ]
    luot_2_ghi_chu: "Phân loại chuẩn: Hanon, Brahms WoO 6 là bài tập (exercise); IMSLP ghi Hanon là 60 bài tập ngón. Dohnányi, Cortot không mở được nguồn riêng; câu là định nghĩa, không sai."
  - id: n2
    cau: 'Étude (tiếng Pháp: "bài học") là một bản nhạc thật xây quanh một vấn đề kỹ thuật: Czerny, Burgmüller, Heller…, rồi đến Chopin, Liszt, Debussy, ở đó étude đã là nhạc hòa nhạc.'
    loai: dinh-nghia
    nguon:
      - imslp
      - henle
    ket_qua: dung
    ghi_chu: Étude = "bài học" (tiếng Pháp). Các tập kể tên đều có trên IMSLP; Henle xếp Chopin Op. 10 và Op. 25 ở mức hòa nhạc. Link "Các thể loại" là n58 (ve-site).
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/etude" ]
    luot_2_ghi_chu: "Oxford: étude = 'study', bản nhạc xoay quanh một loại đoạn kỹ thuật; Chopin, Debussy (và Liszt) có étude dùng được cả ở hòa nhạc."
  - id: n3
    cau: Cả hai dùng để tách riêng một kỹ năng, xây vốn mẫu hình (gam, hợp âm rải, nốt lặp, quãng ba, bước nhảy), khởi động và chẩn đoán.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả mục đích tập, không phải sự kiện kiểm được.
  - id: n4
    cau: Trong các mẫu buổi tập, phần kỹ thuật (gam, hợp âm rải, bài tập ngón, étude) chỉ chiếm khoảng một phần sáu thời gian.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên ../opus-zero/docs/piano/cach-tap.md, mục "Mẫu buổi tập": hàng Kỹ thuật 3/20, 7/45, 15/90 phút = 15%, 16%, 17%, tức gần một phần sáu. Trang cach-tap chưa chuyển: lô chuyển phải giữ bảng này (hoặc sửa câu cho khớp). Review: đã kiểm src/content/docs/piano/cach-tap.md (nay đã chuyển), mục "## Mẫu buổi tập", dòng 88: Kỹ thuật 3/20, 7/45, 15/90 phút (15–17%), khoảng một phần sáu. Link /opus/piano/cach-tap/ có trong dist/.'
    review: dung
  - id: n5
    cau: "Lặp vô thức: tay chạy, đầu ở chỗ khác; tập mà không nghe không chỉ vô ích mà còn có hại."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ: "…tai cùn dần. Nhiều nhà sư phạm coi đây là tác hại lớn nhất của bài tập ngón." "Nhiều nhà sư phạm" và "tác hại lớn nhất" không có nguồn nào mở được, nên bỏ; giữ lời khuyên tập nghe. Review D4-gom: lời khuyên tập (nghe khi tập), không về sức khỏe; chữ đã sửa ở lượt 1 giữ nguyên; ket_qua đổi thành khong-can-nguon (khuyen-tap).'
  - id: n6
    cau: "Căng cơ: tránh nâng ngón thật cao rồi đập xuống, khóa cổ tay, ấn đáy phím sau khi nốt đã kêu."
    loai: quy-tac
    ket_qua: da-sua
    ghi_chu: 'Câu cũ mô tả như khẳng định ("Nâng ngón thật cao rồi đập xuống…"); đổi thành lời khuyên "Tránh…", bỏ ngụ ý nguyên nhân chấn thương. Liên kết Tạo tiếng đàn: xem n58. Review D4-gom (soát nhãn): câu thuộc mục Rủi ro "Căng cơ", dính sức khỏe, không xếp khuyen-tap; đổi thành quy-tac, cần lượt 2 bổ sung. Nguồn: BAPAM, The Healthy Pianist (bapam.org.uk/?p=59585, mở 28/10/2026): "avoiding excessive lifting or curving of the fingers"; "with no clenching of elbow, shoulder or wrist"; "After playing the note, there is nothing to be gained musically or technically from continuing pressure on the keybed."'
    nguon:
      - bapam
  - id: n7
    cau: Gân duỗi của ngón 4 có sợi nối sang gân của ngón 3 và ngón 5, và nhấc ngón 4 quá cao dễ làm ngón 3 và 5 căng theo; vì vậy không cố luyện cho ngón 4 nhấc lên hoàn toàn độc lập.
    loai: quy-tac
    nguon:
      - chang
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "gân duỗi của ngón 4 được nối với gân của các ngón bên cạnh, nên nó không bao giờ nhấc lên tự do như ngón 2". "Không bao giờ" và "như ngón 2" quá tuyệt đối; sửa theo Chang III.7 (các gân duỗi nối nhau, độc lập ngón có giới hạn): nêu đúng ngón 3 và 5 và hệ quả "dễ căng theo". Sửa tương ứng ở câu quiz (n55).'
    luot_2: dung
    luot_2_nguon: [ "https://www.kenhub.com/en/library/anatomy/extensor-digitorum-muscle" ]
    luot_2_ghi_chu: "Kenhub (giải phẫu): các gân duỗi chung có nối liên gân (juncturae) thay đổi từng người, gắn với việc ngón nhẫn khó duỗi độc lập. Chi tiết 'sang ngón 3 và 5' là mô tả chuẩn, nguồn chỉ nói chung. Lời khuyên không có hại."
  - id: n8
    cau: "Quá tải: nên tránh lặp một kỹ thuật liền quá một thời gian ngắn và tránh căng tay quá mức (như quãng tám hay hợp âm lớn liên tục)."
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Cùng một chuyển động lặp hàng trăm lần, to, nhanh, với bàn tay mở rộng…: đó là công thức của chấn thương do lặp lại". "Hàng trăm lần" và "công thức của chấn thương" không có nguồn; viết lại theo BAPAM (tránh lặp một kỹ thuật quá lâu, tránh căng tay quá mức). Sức khỏe không xếp khuyen-tap. Review D4-gom: BAPAM (bapam.org.uk/?p=59585, mở 28/10/2026): "avoid any technique involving repetition at the stretch for more than short periods of time"; "Avoid excessive stretches"; "practise minimising tension between repetitive octaves or large chords". Câu đã sửa khớp; giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn mở nào nêu cụ thể 'lặp một kỹ thuật quá một thời gian ngắn' hay quãng tám/hợp âm lớn liên tục. Lời khuyên hợp lý, không có hại.
  - id: n9
    cau: Chạy Hanon nhanh không tự động giúp bạn chơi nhanh một đoạn Mozart; kỹ năng chuyển sang được khi bài tập giống đoạn nhạc thật về hình nốt, ngón bấm và cách nghe.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên chọn bài tập; không có nguồn bậc 1–2 cho cơ chế "chuyển kỹ năng". Giữ như khuyen-tap, chờ lượt 2.
  - id: n10
    cau: Có tác giả còn khuyên bỏ hẳn Hanon và dành thời gian ấy cho bản nhạc thật.
    loai: lich-su
    nguon:
      - chang
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Một số trường phái sư phạm, như của Dorothy Taubman, còn cho rằng bài tập ngón rời rạc hại nhiều hơn lợi." Không mở được nguồn cho phát biểu về trường phái Taubman; Chang III.7 đề nghị bỏ Hanon, nên sửa thành "Có tác giả…" và bỏ tên Taubman. Review D4-gom: Chang III.7 (mở 28/10/2026): "start by quitting Hanon exercises"; "If students used their ''Hanon time'' to practice real music, they would acquire a lot more technique." Câu đã sửa ("Có tác giả còn khuyên bỏ hẳn Hanon…") đúng; giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.practisingthepiano.com/?s=hanon" ]
    luot_2_ghi_chu: Graham Fitch (các bài về Hanon) ủng hộ dùng có chọn lọc, không bảo bỏ hẳn. Nguồn chỉ trích Hanon (Taubman, Whiteside) tìm thấy chỉ ở Wikipedia, không dùng được làm nguồn.
  - id: n11
    cau: "Đau, tê hoặc ngứa ran: dừng bài tập ngay, nghỉ; nếu lo ngại hay kéo dài, hãy đi khám."
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Đau, tê, ngứa ran, hoặc mỏi không hết sau một đêm nghỉ… Nếu kéo dài, hãy đi khám." Bỏ ngưỡng "mỏi không hết sau một đêm nghỉ" (không có nguồn); BAPAM khuyên dừng khi đau và đi khám khi triệu chứng không hết. Câu "Không bài tập nào đáng để đổi lấy đôi tay" là lời kết, không tính. Liên kết Giữ đôi tay khỏe: n58.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/bapam-welcome-pack/" ]
    luot_2_ghi_chu: "Lời khuyên an toàn, hợp thông lệ: BAPAM Welcome Pack nêu nghỉ đều đặn và gọi tổ chức khi có vấn đề sức khỏe; chưa thấy BAPAM nêu rõ 'đau, tê, ngứa ran thì dừng' trong trang mở được. Không có hại."
  - id: n12
    cau: "Dùng an toàn: ngắn (5–10 phút mỗi ngày), chậm và đều trước, nhẹ, nghe từng nốt, biến hóa, có chủ đích."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n13
    cau: Nên nghỉ giữa các bài tập và dừng ngay khi thấy căng.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: dung
    ghi_chu: "BAPAM The Healthy Pianist: nghỉ đều đặn và dừng khi căng hoặc đau. Nhận định về sức khỏe, không xếp khuyen-tap."
    luot_2: dung
    luot_2_nguon: [ "https://www.bapam.org.uk/bapam-welcome-pack/" ]
    luot_2_ghi_chu: "BAPAM Welcome Pack: checklist luyện tập lành mạnh hỏi có nghỉ giữa giờ đều đặn không."
  - id: n14
    cau: Bảng dưới xếp các tuyển tập gần đúng từ dễ đến khó; đây là ước lượng thô của trang này, không phải xếp hạng của ABRSM hay của nhà xuất bản, nên trang không ghi Grade cho từng tập; muốn biết một bài hợp chặng nào, xem lộ trình và Tác phẩm theo cấp độ.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: khong-can-nguon chỉ dành cho khuyen-tap; quyết cùng cột Grade (n34) ở gom. Câu tự nêu giới hạn của bảng (không khẳng định cấp cụ thể); lô chuyển giữ nguyên chữ "ước lượng thô". Liên kết lộ trình: n58. Review D4-gom: cột Cấp độ (Grade) của bảng étude không có nguồn cho từng khoảng (n34, n35, n36): xóa cột. Chữ cũ: "Cấp độ trong bảng là ước lượng thô, quy về [cấp ABRSM](/opus/piano/lo-trinh/); trong cùng một tuyển tập, bài đầu và bài cuối có thể cách nhau vài cấp." Chữ mới: "Bảng dưới xếp các tuyển tập gần đúng từ dễ đến khó. Đây là ước lượng thô của trang này, không phải xếp hạng của ABRSM hay của nhà xuất bản, nên trang không ghi Grade cho từng tập; muốn biết một bài hợp chặng nào, xem [lộ trình](/opus/piano/lo-trinh/) và [Tác phẩm theo cấp độ](/opus/piano/tac-pham-theo-cap/)." Câu mới chỉ nói về cách trang xếp bảng (ve-site). Review: đã kiểm bảng nay hai cột (Tác phẩm, Luyện gì), thứ tự hàng giữ như cũ; /opus/piano/lo-trinh/ có trong dist/; tac-pham-theo-cap chưa chuyển, ../opus-zero/docs/piano/tac-pham-theo-cap.md có. Mở đầu trang cũng đổi "cuốn nào hợp trình độ nào" thành "nên đi qua các cuốn theo thứ tự nào" (n60).'
    luot_2: khong-chac
    luot_2_ghi_chu: "Cấp ABRSM của từng tập: không mở được Henle (robots) hay đề cương ABRSM. Câu có nêu rõ là ước lượng thô, nhưng không đối chiếu được."
    review: dung
  - id: n15
    cau: Bản nhạc của phần lớn các tác phẩm thế kỷ 19 có trên IMSLP.
    loai: ten
    nguon:
      - imslp
    ket_qua: dung
    ghi_chu: IMSLP có bản phổ các tập trong bảng (đã mở trang tác phẩm Hanon, Czerny, Burgmüller, Heller, Cramer, Clementi, Moszkowski, Chopin, Liszt, Debussy).
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/The_Virtuoso_Pianist_(Hanon,_Charles-Louis)", "https://imslp.org/wiki/51_Exercises,_WoO_6_(Brahms,_Johannes)", "https://imslp.org/wiki/Die_Kunst_der_Fingerfertigkeit,_Op.740_(Czerny,_Carl)", "https://imslp.org/wiki/25_Etudes,_Op.47_(Heller,_Stephen)", "https://imslp.org/wiki/Category:Moszkowski,_Moritz", "https://imslp.org/wiki/Category:Chopin,_Fr%C3%A9d%C3%A9ric", "https://imslp.org/wiki/%C3%89tudes_d%27ex%C3%A9cution_transcendante,_S.139_(Liszt,_Franz)", "https://imslp.org/wiki/Etudes,_CD_143_(Debussy,_Claude)" ]
    luot_2_ghi_chu: "Mọi tác phẩm thế kỷ 19 trong danh sách mà tôi mở đều có trang trên IMSLP. Tác giả còn bản quyền (Kabalevsky) không có trên IMSLP: câu chỉ nói 'phần lớn các tác phẩm thế kỷ 19'."
  - id: n16
    cau: "Bartók, Mikrokosmos: 153 bài, 6 quyển."
    loai: so-lieu
    ket_qua: dung
    ghi_chu: "chưa chắc: chưa mở nguồn cho Mikrokosmos (không có trên IMSLP ở Mỹ); số bài và số quyển theo kiến thức chung. Người giao quyết định: kiểm bằng nguồn nhà in hay bỏ hàng. Review D4-gom: IMSLP Mikrokosmos, Sz.107 (mở 28/10/2026): \"153 pieces in 6 volumes\". Giữ."
