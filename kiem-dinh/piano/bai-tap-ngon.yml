  - id: n23
    cau: Tên gốc của Op. 47 là "để rèn cảm giác tiết tấu và biểu cảm"; Op. 45 là tập chuẩn bị cho L'art de phraser Op. 16 ("nghệ thuật phân câu").
    loai: ten
    nguon:
      - imslp
    ket_qua: da-sua
    ghi_chu: "Câu cũ: tên gốc của Op. 45 là \"nhập môn nghệ thuật phân câu\". IMSLP ghi Op. 45 là \"Introduction à l'art de phraser\" (25 études préparatoires à l'Art de phraser Op. 16); sửa thành mô tả tập chuẩn bị cho Op. 16. Cũng bỏ vế \"thường xếp từ dễ đến khó: Op. 47, 45, 46\" (không nguồn; xem n34)."
