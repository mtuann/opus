  - cu: 'Không phải của Chopin. Trên YouTube và nhiều trang chia sẻ nhạc, bài này hay mang tên "Spring Waltz" (Valse mùa xuân) và được gắn cho Chopin. Chopin không viết bài nào như vậy, và đây cũng không phải một điệu valse: valse ở nhịp 3/4, còn bài này chủ yếu ở 4/4. Nhầm lẫn được cho là bắt đầu từ một video đăng bản thu của George Davidson (một bản soạn hơi khác của bài) dưới tên sai. Video ấy có hàng chục triệu lượt xem trước khi bị gỡ, nhưng các bản sao mang cùng tên sai vẫn tiếp tục lan truyền. Muốn chơi một valse thật của Chopin ở tầm tương đương, xem Valse Si thứ Op. 69 số 2 (chặng 5) hoặc Valse La thứ (chặng 3).'
    moi: 'Không phải của Chopin. Trên mạng, bài này có khi mang tên "Spring Waltz" (Valse mùa xuân) và bị gắn cho Chopin. Bản nhạc được cấp phép ghi tác giả là Paul de Senneville; Chopin không có bài nào như vậy. Muốn chơi một valse thật của Chopin ở tầm tương đương, xem Valse La thứ (chặng 5); cao hơn một chặng là Valse Si thứ Op. 69 số 2 (chặng 6).'
    ly_do: 'Review D8-gom (n68): câu về video của George Davidson và số lượt xem chỉ có ở Wikipedia và blog (hai nguồn ghi số khác nhau); bỏ. Tác giả lấy theo bản nhạc được cấp phép (Musicnotes: "Music by Paul De Senneville"). Vế cuối (lượt 1): chặng theo dữ liệu, Valse La thứ 5, Valse Si thứ 6. Review cuối D8-gom (n61): bỏ vế "không phải một điệu valse … chủ yếu ở 4/4": phần chính của bài ở 3/4 (MN0114635, lượt 2 và review cuối).'
