    luot_2_nguon: [ "https://www.musicnotes.com/sheetmusic/yann-tiersen/comptine-dun-autre-%c3%a9t%c3%a9-lapr%c3%a8s-midi/MN0091413", "https://www.musicnotes.com/images/productimages/large/mtd/mn0091413.gif" ]
    luot_2_ghi_chu: "Ảnh trang 1 MN0091413 (16 ô đầu trong 3 trang): tay trái hai bè ở mọi ô, bè dưới nốt đen ghi ngón 5 và 4, bè trên móc đơn lặp; tay phải ô 5–8 nhóm móc kép ngắn, ô 13–16 nốt kép; sắc thái p, mf, cặp dấu to dần – nhỏ dần (ô 6–7, 10–11, 14–15). 'Gần như suốt bài' chỉ thấy trên trang 1 (hai trang sau không xem được)."
