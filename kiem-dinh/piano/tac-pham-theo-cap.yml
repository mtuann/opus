    luot_2_ghi_chu: "Kiểm từng hàng trên trang tác phẩm IMSLP (số danh mục, giọng, năm trong khung thông tin): Ballade số 2–4 Op.38, 47, 52; Scherzo số 1–4 Op.20, 31, 39, 54; Études Op.10, Op.25; Sonata số 2 Op.35, số 3 Op.58; Barcarolle Op.60; Bình quân luật I BWV 846–869, II BWV 870–893; Partitas BWV 825–830; Goldberg BWV 988; Beethoven số 21 Op.53 'Waldstein', số 23 Op.57 'Appassionata' (tên ở danh sách bản thu trên trang), Op.109, 110, 111; Op.110 chương III có 'Fuga: Allegro ma non troppo'; Haydn Hob.XVI:52 Mi♭ trưởng (1794); Mozart K.310 La thứ, Concerto số 21 K.467; Schubert D.958, 959, 960 (1828), D.760 'Wandererfantasie'; Schumann Op.9 Carnaval, Op.16 Kreisleriana, Op.17 Fantasie; Liszt Sonata S.178, Études d'exécution transcendante S.139; Brahms Op.118, 119, Op.24 (Handel); Debussy Préludes hai quyển, Estampes, Images; Ravel Sonatine, Le tombeau de Couperin, Jeux d'eau, Gaspard de la nuit; Rachmaninoff Op.23, 32, Études-tableaux Op.33, 39, Concerto số 2 (Op.18); Prokofiev Sonata số 7 Op.83, Toccata Op.11; Bartók Sonata Sz.80 (1926), Out of Doors Sz.81. Hai tác phẩm còn bản quyền không có trên IMSLP: Messiaen Vingt regards sur l'Enfant-Jésus (1944) ở PTNA và tờ chương trình Philharmonie de Paris; Ligeti Musica ricercata ở BnF (1951), Études (Book 1–3, Schott ED 7989, ED 8654…) ở pianolibrary.org (trang Schott trả 403). Không thấy hàng sai."
