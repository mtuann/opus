- id: n29
  cau: 'Cột "Chặng ở site" của bảng Henle khớp src/data/tac-pham.yml: Melodie (qua Album Op. 68) 2; Für Elise 4; Op. 49 số 2 4; Invention số 1 4; Thuyền ca Venice 5; K. 545 5; Ánh trăng (chương 1) 5; Valse Si thứ 6; Clair de lune 6; Prelude và fugue Đô thứ 6; Nocturne Op. 9 số 2 6; Impromptu Sol♭ 7; Fantaisie-Impromptu 7; Liebestraum 7; Ballade 7. Ngoài dữ liệu: Troldhaugen 6.'
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Kiểm thử tests/tac-pham-theo-cap.test.mjs (cột "Chặng ở site") đạt. Đã sửa: Invention số 1 từ 5 thành 4; Valse Si thứ từ 5 thành 6; hàng Schubert Impromptu Sol♭ thêm mới (chặng 7); hàng Valse Si thứ chuyển xuống sau Ánh trăng và hàng Impromptu sau Liebestraum cho các hàng xếp theo chặng. Troldhaugen không có bản ghi: chặng 6 là cách xếp của site (Henle 6; ABRSM không có bài này trong danh sách 2025–2028 theo tìm "Troldhaugen|Wedding" ở cả hai PDF).'
- id: n30
  cau: Henle xếp Für Elise và Invention số 1 cùng mức 3, còn Clair de lune và K. 545 cùng mức 5.
