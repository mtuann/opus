nhan_dinh:
- id: n1
  cau: Danh mục xếp tác phẩm theo đúng 7 chặng của lộ trình piano; mỗi chặng có một bảng gồm tác phẩm, thời kỳ và điều học được; bài có bài học chi tiết trên site được gắn link.
  loai: ve-site
  ket_qua: dung
  ghi_chu: src/data/cap-do.yml (7 chặng, khóa); trang có đúng bảy mục "## Chặng 1…7" với tiêu đề khớp cap-do.yml (tests/tac-pham-theo-cap.test.mjs, phép thử "tiêu đề mỗi chặng" đạt ngày 05/11/2026); mỗi bảng có ba cột Tác phẩm, Thời kỳ, Học được gì; bài có bản ghi ở src/data/tac-pham.yml có link tới /opus/piano/tac-pham/<slug>/.
- id: n2
  cau: Câu "và là nơi site quyết định mỗi bài thuộc chặng nào" (đoạn mở đầu và mô tả trang).
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…theo đúng 7 chặng của lộ trình piano, và là nơi site quyết định mỗi bài thuộc chặng nào." Chữ mới: bỏ vế sau. Lý do: chặng của bài có bản ghi do src/data/tac-pham.yml quyết (trường chang, khóa ở D2-0), các trang chặng piano/lo-trinh/chang-N sinh từ dữ liệu; trang này chỉ ghi lại và tests/tac-pham-theo-cap.test.mjs bắt chỗ lệch. Mô tả trang (frontmatter) bỏ cùng vế.'
- id: n3
  cau: Chặng ghi trên trang cho mọi bài có bản ghi trong src/data/tac-pham.yml khớp trường chang của bản ghi (bảng mức Henle, bảng "Bài bạn mơ", bảng từng chặng, các câu "(chặng N)" ở mục ngoài cổ điển).
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Kiểm thử node --test tests/tac-pham-theo-cap.test.mjs đạt (3/3) ngày 05/11/2026. Đã sửa bốn bài lệch: chopin-valse-la-thu (3→5), bach-invention-1 (5→4), chopin-valse-si-thu (5→6), schubert-impromptu-sol-giang (6→7): chuyển hàng sang bảng chặng đúng, tách phần không có bản ghi ra giữ ở chặng cũ, đổi các bài "đi qua trước" cho hợp lý (bài đi qua trước thấp hơn bài đích): Für Elise (bỏ Valse La thứ, thêm Sonatina Op. 36 số 1, chặng 3); Nocturne Op. 9 số 2 (Valse Si thứ 5 → Valse La thứ 5); Fantaisie-Impromptu (Valse Si thứ ghi 6); Liebestraum (bỏ Impromptu Sol♭ chặng 7, thêm Consolation số 3 chặng 6, vì bảng chặng 6 ghi Consolation là bước chuẩn bị cho Liebestraum); River Flows in You, Mariage d''Amour (Valse La thứ chặng 3 → Cầu nguyện buổi sáng chặng 3); câu "valse thật của Chopin ở tầm tương đương" của Mariage d''Amour (La thứ chặng 5, Si thứ chặng 6). Thêm link /opus/piano/tac-pham/<slug>/ cho tên bài có bản ghi ở bảng Henle và bảng "Bài bạn mơ".'
- id: n4
  cau: Mục "Bài phổ biến ngoài nhạc cổ điển" giữ id ngoai-co-dien; các tiêu đề con giữ id river-flows-in-you, kiss-the-rain, one-summers-day, comptine, nuvole-bianche; mục Mariage d'Amour có id tự sinh paul-de-senneville-mariage-damour.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Id cố định "{ #… }" giữ nguyên trong trang. Link tới #ngoai-co-dien từ trang khác (kiem-dinh/blog/posts/2026-10-23-phien-ban-15.yml n…, cap-nhat.yml, đầu trang này) vẫn đúng; bảng sáu bài dẫn tới #river-flows-in-you… và #paul-de-senneville-mariage-damour, id sinh theo src/plugins/id-cu.mjs (tests/link.test.mjs sẽ kiểm trên bản build).'
- id: n5
  cau: Site dùng cấp của ABRSM làm thước đo chung.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/data/cap-do.yml: mỗi chặng có nhan_grade/tuong_duong theo Grade ABRSM; piano/lo-trinh dùng cùng thang.'
- id: n6
  cau: Các danh sách tham khảo khác nhau thường xếp cùng một bài lệch nhau một, hai cấp.
  loai: cap-do
  nguon:
  - henle-levels
  - abrsm-prac-2728
  - abrsm-prac-2526
  ket_qua: dung
  ghi_chu: 'Ví dụ kiểm được: Nocturne e minor Op. 72 số 1 là mức 5 ở Henle HN 185 nhưng ở danh sách Grade 8 của ABRSM 2027 & 2028 (tr. 43, mục 2); Invention số 8 là Grade 5 ở ABRSM 2025–2028 còn Invention số 6 và 14 ở Grade 6. "Thường" là nhận xét chung, hai ví dụ trên cùng bảng Henle ở trang cho thấy độ lệch.'
- id: n7
  cau: Các chương trong cùng một sonata có thể chênh nhau nhiều.
  loai: cap-do
  nguon:
  - henle-hn32
  - henle-hn34
  ket_qua: dung
  ghi_chu: 'Henle HN 32 (Beethoven, Sonatas Volume I): Op. 14 số 1 và 2 mức 6, Op. 27 số 1 mức 8, Moonlight Op. 27 số 2 mức 7 cho cả bản. Trang nêu ví dụ Ánh trăng: chương 1 chặng 5, chương 3 Presto agitato "rất khó". Ví dụ Beethoven: Sonata Op. 49 số 2 mức 3 (HN 34) là sonata dễ nhất của Henle trong tập.'
- id: n8
  cau: Thời kỳ gồm Baroque, Cổ điển, Lãng mạn, Ấn tượng (Debussy), thế kỷ 20 và đương đại; có link tới trang Baroque, Cổ điển, Lãng mạn, thế kỷ 20.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Link /opus/lich-su/thoi-ky/{baroque,co-dien,lang-man,the-ky-20}/: có trong src/data/trang.yml (tests/link.test.mjs kiểm trên bản build; trang chưa lên thì hiện "sắp có"). Tên nhãn thời kỳ trong cột "Thời kỳ" là cách xếp của site; không kiểm riêng từng hàng.'
- id: n9
  cau: Tên tác phẩm giữ ngôn ngữ gốc, kèm nghĩa tiếng Việt khi cần; tập nhạc Nga ghi theo tên tiếng Anh thường in trên ấn bản; "Số" là số thứ tự trong tập (No.).
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Quy ước ghi tên của site (đã đọc trang: ví dụ "Tchaikovsky: Album for the Young Op. 39: Old French Song (Bài ca Pháp cổ)", "Bartók: For Children (Cho thiếu nhi)").'
- id: n10
  cau: Nhà xuất bản G. Henle ghi cho từng tác phẩm piano trong các ấn bản Urtext của họ một mức độ khó từ 1 đến 9.
  loai: cap-do
  nguon:
  - henle-levels
  ket_qua: dung
  ghi_chu: 'Trang Levels of Difficulty: bộ lọc "easy medium difficult" với các số 1–9 cho piano solo; trang sản phẩm ghi mức cho từng bản (ví dụ HN 591: Invention 1 "3 easy").'
- id: n11
  cau: Mức 1–3 là dễ, 4–6 trung bình, 7–9 khó (thang Henle).
  loai: cap-do
  nguon:
  - henle-levels
  - henle-hn591
  - henle-hn185
  - henle-hn235
  ket_qua: dung
  ghi_chu: 'Trang sản phẩm Henle: "3 easy" (HN 591), "4 medium", "6 medium" (HN 185), "7 difficult" (HN 235), "8 difficult" (HN 862): nhãn khớp các khoảng. Chưa tìm được dòng chữ ghi rõ ba khoảng trên trang Levels of Difficulty (trang chỉ hiện các nút easy, medium, difficult và số 1–9 sau JavaScript), suy từ nhãn của các trang sản phẩm.'
- id: n12
  cau: Thang Henle không trùng khít với cấp ABRSM hay với các chặng ở site.
  loai: cap-do
  nguon:
  - henle-hn131
  - abrsm-prac-2728
  ket_qua: dung
  ghi_chu: 'Ví dụ: Valse Si thứ Op. 69 số 2 mức Henle 4 nhưng site xếp chặng 6 (Grade 7–8); Nocturne Op. 72 số 1 Henle 5, ABRSM Grade 8 (2027 & 2028).'
- id: n13
  cau: 'Schumann: Melodie, Op. 68 số 1: mức Henle 2.'
  loai: cap-do
  nguon:
  - henle-hn928
  ket_qua: dung
  ghi_chu: 'HN 928: "Melodie op. 68,1 | 2 easy". Ngày kiểm: truy cập 05/11/2026.'
- id: n14
  cau: 'Beethoven: Für Elise WoO 59: mức Henle 3.'
  loai: cap-do
  nguon:
  - henle-hn1347
  ket_qua: dung
