- cu: Không phải bài Ghibli nào cũng của Hisaishi. Bài hát Itsumo nando demo (Always with Me) trong phim Spirited Away có nhạc của Youmi Kimura và lời của Wakako Kaku; ABRSM ghi đúng hai tên ấy khi đưa một bản soạn của bài vào danh sách Grade 3 (chương trình 2025–2026). Còn Summer, một bài piano quen thuộc khác của Hisaishi, là nhạc phim Kikujiro (1999) của Takeshi Kitano, không phải phim Ghibli.
  moi: Không phải bài Ghibli nào cũng của Hisaishi. Bài hát Itsumo nando demo (Always with Me) trong phim Spirited Away có nhạc của Youmi Kimura và lời của Wakako Kaku; ABRSM ghi tên Youmi Kimura, không ghi Hisaishi, khi đưa một bản soạn của bài vào danh sách Grade 3 (chương trình 2025–2026). Còn Summer, một bài piano quen thuộc khác của Hisaishi, là nhạc phim Kikujiro (1999) của Takeshi Kitano, không phải phim Ghibli.
  ly_do: 'PDF ABRSM 2025 & 2026, tr. 28: chỉ ghi "Youmi Kimura, Always with Me (from Spirited Away)"; không có tên Wakako Kaku. (Đoạn văn chứa câu này còn lại giữ nguyên.)'
- cu: 'Không phải của Chopin. Trên YouTube và nhiều trang chia sẻ nhạc, bài này hay mang tên "Spring Waltz" (Valse mùa xuân) và được gắn cho Chopin. Chopin không viết bài nào như vậy, và đây cũng không phải một điệu valse: valse ở nhịp 3/4, còn bài này chủ yếu ở 4/4. Nhầm lẫn được cho là bắt đầu từ một video đăng bản thu của George Davidson (một bản soạn hơi khác của bài) dưới tên sai. Video ấy có hàng chục triệu lượt xem trước khi bị gỡ, nhưng các bản sao mang cùng tên sai vẫn tiếp tục lan truyền. Muốn chơi một valse thật của Chopin ở tầm tương đương, xem Valse Si thứ Op. 69 số 2 (chặng 5) hoặc Valse La thứ (chặng 3).'
  moi: 'Không phải của Chopin. Trên YouTube và nhiều trang chia sẻ nhạc, bài này hay mang tên "Spring Waltz" (Valse mùa xuân) và được gắn cho Chopin. Chopin không viết bài nào như vậy, và đây cũng không phải một điệu valse: valse ở nhịp 3/4, còn bài này chủ yếu ở 4/4. Nhầm lẫn được cho là bắt đầu từ một video đăng bản thu của George Davidson (một bản soạn hơi khác của bài) dưới tên sai. Video ấy có hàng chục triệu lượt xem trước khi bị gỡ, nhưng các bản sao mang cùng tên sai vẫn tiếp tục lan truyền. Muốn chơi một valse thật của Chopin ở tầm tương đương, xem Valse La thứ (chặng 5); cao hơn một chặng là Valse Si thứ Op. 69 số 2 (chặng 6).'
  ly_do: 'Chặng theo dữ liệu: Valse La thứ 5, Valse Si thứ 6.'
