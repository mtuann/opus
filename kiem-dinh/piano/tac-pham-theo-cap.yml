  ghi_chu: 'Henle HN 32: "Moonlight Sonata … op. 27,2 | 7 difficult" cho cả sonata. Chương 3 là Presto agitato (tên chương là điều quen thuộc; Henle chỉ ghi cả bản). "Rất khó" là nhận xét theo mức 7 "difficult" của Henle. Chặng 5 của chương 1: dữ liệu beethoven-anh-trang (chang 5, Grade 6–7).'
