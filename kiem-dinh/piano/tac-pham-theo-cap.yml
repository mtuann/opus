  ghi_chu: 'chưa chắc: Henle có ấn bản Urtext (đã mở henle.de, các trang HN ở trên) và IMSLP đúng là kho bản quét (imslp.org mở được 05/11/2026); Wiener Urtext, Bärenreiter, Wydanie Narodowe do Jan Ekier biên tập chưa mở nguồn bậc 2 trong lượt này. Câu "cho đúng những gì nhà soạn nhạc viết" là cách mô tả chung của Urtext.'
