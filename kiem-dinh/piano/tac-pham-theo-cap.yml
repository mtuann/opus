    cau: "Mariage d'Amour: Sol thứ, mở đầu Moderato ♩ = 72 ở 4/4 có xen ô 3/4, rồi phần chính (mục A, Faster ♩. = 50) ở 3/4 (Musicnotes MN0114635); Comptine: Mi thứ, 4/4, ♩ = 100 (Musicnotes MN0091413); Nuvole bianche: Fa thứ, mở đầu 4/4 ♩ = khoảng 40, phần chính 12/8 ♩. = 78 (Musicnotes MN0106486)."
