    ghi_chu: "chưa chắc: Musicnotes: Mariage d'Amour \"G Minor, 4/4, Moderato, q = 72\"; Comptine \"E Minor, 4/4, q = 100\"; Nuvole bianche \"F Minor, 4/4, q = 40\". Chỗ đổi nhịp 5/4, 3/4 của Mariage d'Amour và phần 12/8 (♩. = 78) của Nuvole bianche không có trong mô tả sản phẩm: chưa chắc phần ấy (cần bản in). Review D8-gom (Claude Opus 5.5): trang mẫu ba bản: Mariage \"Moderato ♩ = 72\", 4/4 có ô 3/4 (không thấy 5/4: bỏ); Comptine \"♩ = 100\"; Nuvole \"♩ = ca. 40 allarg.\" rồi 12/8 \"♩. = 78 poco accel.\" (phần 12/8 nay đã kiểm). Nói rõ ấn bản cho Mariage, Comptine. Kết quả lượt 2 cũ (gỡ để vào lượt 2 bổ sung vì chữ đổi): khong-chac: Mariage d Amour: Sol thứ, 4/4, Moderato, q = 72 (đúng). Comptine (Mi thứ, q = 100 ở một ấn bản, q = 176 ở ấn bản khác) và Nuvole bianche (Fa thứ; nhịp 12/8 và tempo chưa kiểm) tùy ấn bản.. Review cuối D8-gom: lượt 2 ghi sai (\"chủ yếu 4/4\"). Tự xem lại ảnh trang 1 MN0114635: ô 1–2 ở 4/4, ô 3 và ô 5 ở 3/4, rồi mục A \"Faster ♩. = 50\" ở 3/4 suốt phần còn lại của trang. Chữ mới theo câu đúng của lượt 2; ô thông tin trên trang sửa theo, và bỏ vế \"đây cũng không phải một điệu valse: valse ở nhịp 3/4, còn bài này chủ yếu ở 4/4\" ở đoạn Không phải của Chopin (cùng điều sai; vế ấy không có nhận định riêng, n68 không gồm nó). Chữ mới chỉ là câu đúng của lượt 2 và bỏ vế sai: không cần lượt 2 nữa."
    luot_2: sai
    luot_2_nguon: [ "https://www.musicnotes.com/sheetmusic/richard-clayderman/mariage-damour/MN0114635", "https://www.musicnotes.com/images/productimages/large/mtd/mn0114635.gif", "https://www.musicnotes.com/sheetmusic/yann-tiersen/comptine-dun-autre-%c3%a9t%c3%a9-lapr%c3%a8s-midi/MN0091413", "https://www.musicnotes.com/images/productimages/large/mtd/mn0091413.gif", "https://www.musicnotes.com/sheetmusic/ludovico-einaudi/nuvole-bianche/MN0106486", "https://www.musicnotes.com/images/productimages/large/mtd/mn0106486.gif" ]
    luot_2_ghi_chu: "câu đúng: Mariage d'Amour: Sol thứ, mở đầu Moderato ♩ = 72 ở 4/4 có xen ô 3/4, rồi phần chính (mục A, Faster ♩. = 50) ở 3/4 (Musicnotes MN0114635); Comptine: Mi thứ, 4/4, ♩ = 100 (Musicnotes MN0091413); Nuvole bianche: Fa thứ, mở đầu 4/4 ♩ = khoảng 40, phần chính 12/8 ♩. = 78 (Musicnotes MN0106486).; Mariage d'Amour (MN0114635): trang sản phẩm ghi Sol thứ, Moderato, q = 72, nhịp 4/4 (chỉ ghi nhịp đầu bài). Ảnh trang 1: ô 1–2 ở 4/4, ô 3 đổi 3/4, ô 4 về 4/4, ô 5 lại 3/4 (rit., dấu ngân), rồi mục A 'Faster ♩. = 50' giữ 3/4 suốt các dòng còn lại của trang 1 (khoảng 15 ô, mỗi ô ba phách: đen + hai cặp móc đơn); ♩. = 50 cũng là cách ghi đập một phách mỗi ô 3/4. Vậy 'chủ yếu 4/4 có vài ô 3/4' sai: 4/4 chỉ ở đoạn dạo đầu, phần chính là 3/4 (trang 2 không xem được). Comptine (MN0091413): trang sản phẩm ghi Mi thứ, 4/4, 100 BPM; ảnh trang 1 có ♩ = 100, khóa một dấu thăng, 4/4. Nuvole bianche (MN0106486): trang sản phẩm ghi Fa thứ, 4/4, 40 BPM; ảnh trang 1: '♩ = ca. 40 allarg.' ở 4/4, rồi 12/8 với '♩. = 78 poco accel.' — khớp."
