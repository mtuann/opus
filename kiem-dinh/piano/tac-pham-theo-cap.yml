  ghi_chu: Cùng ý với piano/cach-tap n39 ("số bài đã chơi trọn là thứ làm bạn tiến nhanh nhất"). Không có nguồn nên không nêu số liệu.
- id: n36
  cau: Một bài cao hơn hai chặng thường tốn nhiều thời gian hơn hẳn, và thường chỉ dừng ở mức "chơi được các nốt"; bạn còn bỏ lỡ những kỹ năng mà các bài ở giữa dạy.
  loai: khuyen-tap
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Một bài cao hơn hai chặng tốn thời gian gấp nhiều lần, dễ làm căng tay, và thường chỉ dừng ở mức…". "Gấp nhiều lần" không có nguồn; "dễ làm căng tay" là điều về sức khỏe không có nguồn. Viết lại như piano/cach-tap n39 (D4-L3: "thường tốn nhiều thời gian hơn hẳn"), đồng bộ như cach-tap.yml dặn. Lời khuyên còn lại không dính sức khỏe nên giữ khuyen-tap.'
- id: n37
  cau: 'Người lớn thường muốn đi thẳng tới bài mình yêu: Clair de lune, Ballade số 1, chương cuối Ánh trăng.'
