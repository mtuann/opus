    luot_2_ghi_chu: "Kiểm từng hàng. Clementi Op. 36: IMSLP ghi số 2 Sol trưởng, số 3 Đô trưởng. Kuhlau: IMSLP Op. 20 số 1 Đô trưởng (in 1820), Op. 55 số 1 Đô trưởng (1823). Diabelli: IMSLP Op. 151 (Le bouquetier, 4 sonatina, in 1830) và Op. 168 (7 sonatina, in 1839), đều thế kỷ 19; nhãn 'phong cách Cổ điển' là cách site xếp: IMSLP ghi Op. 168 'Piece Style: Classical' (Op. 151 ghi 'Romantic', thời kỳ của Diabelli trên IMSLP là Romantic), nên chấp nhận theo quy ước site. Burgmüller Op. 100: số 9 La chasse, số 15 Ballade (IMSLP). Bach: BWV 926 Rê thứ; BWV 999 Đô thứ, nhan đề gốc 'Prælude in C moll pour la Lute' (IMSLP). Tchaikovsky Op. 39 có Sweet Dreams, Italian Song, Waltz (IMSLP). Schumann Op. 68 số 16 Erster Verlust (IMSLP). Kabalevsky Toccatina Op. 27 số 12 (Hal Leonard ghi 'Toccatina, Op. 27, No. 12'). Prokofiev Op. 65: số 1 Morning, số 2 Promenade (IMSLP). Heller Op. 47: 25 Études (IMSLP). Pärt Für Alina: arvopart.ee ghi 'Written in February 1976'."
