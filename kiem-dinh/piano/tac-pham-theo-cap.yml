    luot_2_ghi_chu: "Kiểm từng hàng trên trang tác phẩm IMSLP (khung thông tin, đọc chữ thật bằng curl): K.330 Đô trưởng (1783); K.397 Rê thứ, mục Extra Information: 'The ending as it currently exists (last 10 measures) is believed to have been written by August Eberhard Müller' (khớp 'khoảng mười ô cuối có lẽ do A. E. Müller'); Sinfonias BWV 787–801 (15 bài); French Suite số 5 Sol trưởng BWV 816; D.899 số 2 Allegro Mi♭ trưởng; Op.118 số 2 Intermezzo Andante teneramente La trưởng; Op.117 số 1 Mi♭ trưởng; Op.64 số 1 Rê♭ trưởng, số 2 Đô♯ thứ; Op.28 số 15 Sostenuto Rê♭ trưởng 'Raindrop', đoạn giữa Đô♯ thứ theo mfiles (IMSLP chỉ ghi giọng chính); Grieg Op.65 số 6 là Bryllupsdag på Troldhaugen (câu chỉ ghi số, đúng có số 6); Arabesque số 1 Mi trưởng (CD 74, 1890–91); Préludes quyển 1 số 8 La fille aux cheveux de lin; Consolations S.172 số 3 Lento placido Rê♭ trưởng; Rachmaninoff Op.3 số 2 Prélude Đô♯ thứ; Ravel M.58, 1909, Sol trưởng, motif năm nốt từ tên Haydn (thelistenersclub, viết cho kỷ niệm 100 năm ngày mất Haydn; IMSLP không mô tả chủ đề); Gershwin 3 Preludes (1926). Không thấy hàng sai."
