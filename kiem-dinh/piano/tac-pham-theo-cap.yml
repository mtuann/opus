    ghi_chu: 'Review D8-gom (Claude Opus 5.5): kiểm từng hàng (agent Sonnet, review đọc lại; bảng kết quả trong scratchpad của phiên, hang-chang-5-7.yml). Bài có link (bản ghi đã khóa) không kiểm lại. Chặng là lựa chọn của site, không kiểm. Sửa: "Fugue bốn, năm bè" thành "Fugue nhiều bè" (số bè từng fugue chưa có nguồn bậc 1–2 đọc được); "fugue (Op. 110), biến tấu (Op. 109, Op. 111)" thành "chương fugue của Op. 110" (IMSLP "4. Fuga"; phần biến tấu chưa có nguồn đọc được). Messiaen 1944: PTNA; Ligeti 1951–53: bản lưu Wayback trang Schott.'
