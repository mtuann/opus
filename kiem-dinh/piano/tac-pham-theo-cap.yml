  ghi_chu: Nhận xét quen thuộc, nêu làm ví dụ; không nêu tỉ lệ.
- id: n38
  cau: 'Bảng "Bài bạn mơ": chặng của bài đích khớp dữ liệu (Für Elise 4; Ánh trăng chương 1 5; Nocturne Op. 9 số 2 6; Clair de lune 6; Pathétique chương 2 6; Fantaisie-Impromptu 7; Liebestraum 7; Ballade số 1 7) và chặng của các bài "đi qua trước" có bản ghi khớp dữ liệu (Minuet Sol trưởng 2; Arabesque 3; Sonatina Op. 36 số 1 3; Prelude BWV 846 4; Prélude Mi thứ 4; Valse La thứ 5; Gymnopédie 4; Träumerei 5; Op. 49 số 2 4; K. 545 5; Valse Si thứ 6; Nocturne Op. 9 số 2 6; Thuyền ca Venice 5).'
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Kiểm thử (cột "Chặng" và cột "Đi qua trước (chặng)") đạt. Đường "đi qua trước" mỗi dòng thấp hơn hay bằng bài đích: Für Elise 4 ← 2, 3, 3; Ánh trăng 5 ← 4, 4; Nocturne Op. 9/2 6 ← 4, 5, 5; Clair de lune 6 ← 4, 5, 5; Pathétique 6 ← 3, 4, 5; Fantaisie-Impromptu 7 ← 6, 6, bài tập; Liebestraum 7 ← 5, 6, 6; Ballade 7 ← 6, 6, 6. Các bài không có bản ghi (The Little Shepherd 5, Nocturne Op. 72 số 1 5, Consolation số 3 6, Valse Op. 64 số 2 6, Impromptu Op. 90 số 2 6) lấy chặng từ bảng chặng của trang. Đã sửa các dòng: Für Elise, Nocturne Op. 9 số 2, Fantaisie-Impromptu, Liebestraum (xem n3).'
- id: n39
  cau: 'Phép thử tám ô nhịp (chơi từng tay tám ô nhịp đầu thật chậm: gần như trôi chảy là bài dễ; dừng vài lần mỗi dòng là bài vừa; ô nào cũng phải dò từng nốt thì để dành sau); tìm chỗ khó nhất, nghe trọn bài, cân bằng thời kỳ mỗi năm.'
