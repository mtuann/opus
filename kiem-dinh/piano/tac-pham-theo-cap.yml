  - cu: Henle xếp Für Elise và Invention số 1 cùng mức 3, và Clair de lune (mức 5) gần ngang K. 545 (mức 4–5). Site đặt Clair de lune cao hơn một chặng vì âm thanh, bàn đạp và sự tự do nhịp điệu mà bài này đòi hỏi. Mức 7 của Sonata Ánh trăng là cho cả bản, gồm chương 3 Presto agitato rất khó; riêng chương 1 thì site xếp ở chặng 5. Hãy dùng các thang để so sánh tương đối, đừng coi chúng là phép đo chính xác.
    moi: Henle xếp Für Elise và Invention số 1 cùng mức 3, còn Clair de lune và K. 545 cùng mức 5. Site đặt Clair de lune cao hơn K. 545 một chặng vì âm thanh, bàn đạp và sự tự do nhịp điệu mà bài này đòi hỏi. Mức 7 của Sonata Ánh trăng là cho cả bản, gồm cả chương 3 Presto agitato; riêng chương 1 thì site xếp ở chặng 5. Hãy dùng các thang để so sánh tương đối, đừng coi chúng là phép đo chính xác.
    ly_do: 'K. 545 là mức 5 ở Henle (HN 62, HN 2); câu so sánh nói rõ "cao hơn K. 545 một chặng" cho khỏi hiểu nhầm (lượt 1, n30). Review D8-gom (n32): bỏ "rất khó" (nhận xét không có nguồn; Henle chỉ ghi mức 7 cho cả bản sonata), giữ tên chương Presto agitato (IMSLP).'
  - cu: 'Người lớn thường muốn đi thẳng tới bài mình yêu: Clair de lune, Ballade số 1, chương cuối Ánh trăng. Một bài cao hơn hai chặng tốn thời gian gấp nhiều lần, dễ làm căng tay, và thường chỉ dừng ở mức "chơi được các nốt". Bạn còn bỏ lỡ những kỹ năng mà các bài ở giữa dạy một cách nhẹ nhàng. Thay vì nhảy cóc, hãy đi đường vòng có chủ đích:'
    moi: 'Người lớn thường muốn đi thẳng tới bài mình yêu: Clair de lune, Ballade số 1, chương cuối Ánh trăng. Một bài cao hơn hai chặng thường tốn nhiều thời gian hơn hẳn, và thường chỉ dừng ở mức "chơi được các nốt". Bạn còn bỏ lỡ những kỹ năng mà các bài ở giữa dạy một cách nhẹ nhàng. Thay vì nhảy cóc, hãy đi đường vòng có chủ đích:'
    ly_do: '"Gấp nhiều lần" không có nguồn; "dễ làm căng tay" là điều về sức khỏe không có nguồn. Viết như piano/cach-tap (đã khóa D4-L3), theo ghi chú của cach-tap.yml n39.'
