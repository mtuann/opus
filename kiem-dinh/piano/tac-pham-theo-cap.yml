nhan_dinh:
  - id: n1
    cau: Danh mục xếp tác phẩm theo đúng 7 chặng của lộ trình piano; mỗi chặng có một bảng gồm tác phẩm, thời kỳ và điều học được; bài có bài học chi tiết trên site được gắn link.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/data/cap-do.yml (7 chặng, khóa); trang có đúng bảy mục "## Chặng 1…7" với tiêu đề khớp cap-do.yml (tests/tac-pham-theo-cap.test.mjs, phép thử "tiêu đề mỗi chặng" đạt ngày 05/11/2026); mỗi bảng có ba cột Tác phẩm, Thời kỳ, Học được gì; bài có bản ghi ở src/data/tac-pham.yml có link tới /opus/piano/tac-pham/<slug>/. Review D8-gom (Claude Opus 5.5): trang có bảy mục "## Chặng 1…7", tiêu đề khớp src/data/cap-do.yml (node --test tests/tac-pham-theo-cap.test.mjs đạt 3/3), mỗi bảng ba cột Tác phẩm, Thời kỳ, Học được gì.'
    review: dung
  - id: n2
    cau: Câu "và là nơi site quyết định mỗi bài thuộc chặng nào" (đoạn mở đầu và mô tả trang).
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…theo đúng 7 chặng của lộ trình piano, và là nơi site quyết định mỗi bài thuộc chặng nào." Chữ mới: bỏ vế sau. Lý do: chặng của bài có bản ghi do src/data/tac-pham.yml quyết (trường chang, khóa ở D2-0), các trang chặng piano/lo-trinh/chang-N sinh từ dữ liệu; trang này chỉ ghi lại và tests/tac-pham-theo-cap.test.mjs bắt chỗ lệch. Mô tả trang (frontmatter) bỏ cùng vế. Review D8-gom (Claude Opus 5.5): đoạn mở đầu và description ở frontmatter không còn vế "là nơi site quyết định"; doi_chu có mục chữ và mục "mô tả:".'
    review: dung
  - id: n3
    cau: Chặng ghi trên trang cho mọi bài có bản ghi trong src/data/tac-pham.yml khớp trường chang của bản ghi (bảng mức Henle, bảng "Bài bạn mơ", bảng từng chặng, các câu "(chặng N)" ở mục ngoài cổ điển).
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: "Kiểm thử node --test tests/tac-pham-theo-cap.test.mjs đạt (3/3) ngày 05/11/2026. Đã sửa bốn bài lệch: chopin-valse-la-thu (3→5), bach-invention-1 (5→4), chopin-valse-si-thu (5→6), schubert-impromptu-sol-giang (6→7): chuyển hàng sang bảng chặng đúng, tách phần không có bản ghi ra giữ ở chặng cũ, đổi các bài \"đi qua trước\" cho hợp lý (bài đi qua trước thấp hơn bài đích): Für Elise (bỏ Valse La thứ, thêm Sonatina Op. 36 số 1, chặng 3); Nocturne Op. 9 số 2 (Valse Si thứ 5 → Valse La thứ 5); Fantaisie-Impromptu (Valse Si thứ ghi 6); Liebestraum (bỏ Impromptu Sol♭ chặng 7, thêm Consolation số 3 chặng 6, vì bảng chặng 6 ghi Consolation là bước chuẩn bị cho Liebestraum); River Flows in You, Mariage d'Amour (Valse La thứ chặng 3 → Cầu nguyện buổi sáng chặng 3); câu \"valse thật của Chopin ở tầm tương đương\" của Mariage d'Amour (La thứ chặng 5, Si thứ chặng 6). Thêm link /opus/piano/tac-pham/<slug>/ cho tên bài có bản ghi ở bảng Henle và bảng \"Bài bạn mơ\". Review D8-gom (Claude Opus 5.5): tests/tac-pham-theo-cap.test.mjs đạt (bốn chỗ đọc chặng: bảng của mục, \"(chặng N)\", cột Chặng, cột \"(chặng)\")."
    review: dung
  - id: n4
    cau: Mục "Bài phổ biến ngoài nhạc cổ điển" giữ id ngoai-co-dien; các tiêu đề con giữ id river-flows-in-you, kiss-the-rain, one-summers-day, comptine, nuvole-bianche; mục Mariage d'Amour có id tự sinh paul-de-senneville-mariage-damour.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Id cố định \"{ #… }\" giữ nguyên trong trang. Link tới #ngoai-co-dien từ trang khác (kiem-dinh/blog/posts/2026-10-23-phien-ban-15.yml n…, cap-nhat.yml, đầu trang này) vẫn đúng; bảng sáu bài dẫn tới #river-flows-in-you… và #paul-de-senneville-mariage-damour, id sinh theo src/plugins/id-cu.mjs (tests/link.test.mjs sẽ kiểm trên bản build). Review D8-gom (Claude Opus 5.5): trang có \"{ #ngoai-co-dien }\", \"{ #river-flows-in-you }\", \"{ #kiss-the-rain }\", \"{ #one-summers-day }\", \"{ #comptine }\", \"{ #nuvole-bianche }\"; tiêu đề \"Paul de Senneville: Mariage d'Amour\" sinh id paul-de-senneville-mariage-damour (id-cu.mjs), bảng sáu bài trỏ đúng."
    review: dung
  - id: n5
    cau: Site dùng cấp của ABRSM làm thước đo chung.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "src/data/cap-do.yml: mỗi chặng có nhan_grade/tuong_duong theo Grade ABRSM; piano/lo-trinh dùng cùng thang. Review D8-gom (Claude Opus 5.5): src/data/cap-do.yml ghi Grade ABRSM tương đương cho từng chặng."
    review: dung
  - id: n6
    cau: Các danh sách tham khảo khác nhau thường xếp cùng một bài lệch nhau một, hai cấp.
    loai: cap-do
    nguon:
      - henle-levels
      - abrsm-prac-2728
      - abrsm-prac-2526
    ket_qua: dung
    ghi_chu: 'Ví dụ kiểm được: Nocturne e minor Op. 72 số 1 là mức 5 ở Henle HN 185 nhưng ở danh sách Grade 8 của ABRSM 2027 & 2028 (tr. 43, mục 2); Invention số 8 là Grade 5 ở ABRSM 2025–2028 còn Invention số 6 và 14 ở Grade 6. "Thường" là nhận xét chung, hai ví dụ trên cùng bảng Henle ở trang cho thấy độ lệch.'
    luot_2: dung
    luot_2_nguon:
      - https://www.henle.de/Piano-Sonata-A-major-K.-331-Alla-Turca/HN-1300
      - https://www.henle.de/Levels-of-Difficulty/
    luot_2_ghi_chu: "Ví dụ: Mozart K. 331 mức Henle 6 (medium) nhưng Henle ghi ABRSM Grade 8, chênh hai bậc; Henle nói thang chỉ là điểm tham chiếu và có chủ quan."
  - id: n7
    cau: Các chương trong cùng một sonata có thể chênh nhau nhiều.
    loai: cap-do
    nguon:
      - henle-hn32
      - henle-hn34
    ket_qua: dung
    ghi_chu: 'Henle HN 32 (Beethoven, Sonatas Volume I): Op. 14 số 1 và 2 mức 6, Op. 27 số 1 mức 8, Moonlight Op. 27 số 2 mức 7 cho cả bản. Trang nêu ví dụ Ánh trăng: chương 1 chặng 5, chương 3 Presto agitato "rất khó". Ví dụ Beethoven: Sonata Op. 49 số 2 mức 3 (HN 34) là sonata dễ nhất của Henle trong tập.'
    luot_2: dung
    luot_2_nguon:
      - https://www.henle.de/Levels-of-Difficulty/
    luot_2_ghi_chu: "Henle: có tác phẩm chỉ vài đoạn khó hơn hẳn phần còn lại, mức xếp theo ô nhịp khó nhất; từ đó mức cả sonata (như Ánh trăng 7) khác chương dễ hơn. Câu nhận định chung, hợp lý."
  - id: n8
    cau: Thời kỳ gồm Baroque, Cổ điển, Lãng mạn, Ấn tượng (Debussy), thế kỷ 20 và đương đại; có link tới trang Baroque, Cổ điển, Lãng mạn, thế kỷ 20.
    loai: ve-site
    ket_qua: dung
