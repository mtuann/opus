  ghi_chu: 'chưa chắc: chưa kiểm từng hàng một. Đã kiểm: Türk (n43), Stravinsky (n44), Ravel Menuet 1909 (n50); các hàng có bản ghi dữ liệu đã khóa (tên, danh mục, chặng). Khoảng 170 hàng ngoài bản ghi (ví dụ Kuhlau Op. 20, Diabelli Op. 151, Scarlatti K. 32, Handel HWV 437, Gurlitt Op. 117, Pärt Für Alina 1976, "54 ô nhịp" của Ravel Menuet) chưa có nguồn bậc 1–2 mở được trong lượt này; người giao cân nhắc để đợt rà lại (ra_lai 2027-01) hay một lượt 1 riêng cho cột này.'
