doi_chu:
  - cu: Danh mục này xếp những tác phẩm thật, từ bài đầu tiên đến sân khấu hòa nhạc, theo đúng 7 chặng của lộ trình piano, và là nơi site quyết định mỗi bài thuộc chặng nào. Mỗi chặng có một bảng gồm tác phẩm, thời kỳ và điều bạn học được từ nó; những bài có bài học chi tiết trên site được gắn link. Cuối trang có một mục riêng cho những bài phổ biến ngoài nhạc cổ điển, như Mariage d'Amour, River Flows in You hay Nuvole bianche.
    moi: Danh mục này xếp những tác phẩm thật, từ bài đầu tiên đến sân khấu hòa nhạc, theo đúng 7 chặng của lộ trình piano. Mỗi chặng có một bảng gồm tác phẩm, thời kỳ và điều bạn học được từ nó; những bài có bài học chi tiết trên site được gắn link. Cuối trang có một mục riêng cho những bài phổ biến ngoài nhạc cổ điển, như Mariage d'Amour, River Flows in You hay Nuvole bianche.
    ly_do: 'Chặng của bài có bản ghi do src/data/tac-pham.yml quyết (khóa ở D2-0) và các trang piano/lo-trinh/chang-N sinh từ dữ liệu; trang này chỉ ghi lại (tests/tac-pham-theo-cap.test.mjs bắt chỗ lệch). Mô tả trang (frontmatter) bỏ cùng vế: "…theo đúng 7 chặng của lộ trình piano, và là nơi site quyết định mỗi bài thuộc…" thành "…theo đúng 7 chặng của lộ trình piano. Mỗi chặng có một bảng gồm tác phẩm, thời kỳ và điều bạn…".'
