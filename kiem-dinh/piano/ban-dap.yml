    ghi_chu: "Bài 1 chuỗi hợp âm: 4/4 L:1/8, 4 ô, mỗi ô hai hợp âm nốt trắng (I vi | IV V | I IV | V7 I) ở tay phải; tay trái nốt trầm ngón 5 viết thành hai nốt nối cho ký hiệu Ped./✱ đúng chỗ. Mỗi ô đủ 4 phách. Chuỗi hòa âm khớp nhãn I, vi, IV, V, I, IV, V7, I; Si–Fa–Sol (1-4-5) cho V7 (bỏ quãng năm, chấp nhận được trong bài tập). Ngón bấm lời dẫn chơi được. Ký hiệu Ped. và ✱ theo quy ước đã nêu ở n18 (chưa chắc nguồn)."
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
