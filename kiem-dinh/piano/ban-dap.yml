    ghi_chu: 'Bài 2 giai điệu: 3/4 L:1/8, 8 ô; tay trái valse (nốt trầm rồi hai hợp âm), tay phải giai điệu; ô 6 Fa–Mi–Rê trên Rê–Fa–La khớp lời dẫn "đi bậc liền trên cùng một hợp âm". Mỗi ô đủ 3 phách. Ngón bấm tay phải chơi được. Bàn đạp đổi sau nốt trầm mỗi ô (đã nêu ở lời dẫn).'
ghi_chu: 'Lượt 1 trang Bàn đạp (lô D4-L2, phần A). Nguồn đã mở: Wikipedia Piano pedals và Glossary of musical terminology (bậc 3, chỉ dùng cho điều ít rủi ro), Fitch Pedalling the Moonlight Sonata, Wydanie Narodowe Nocturnes commentary. Không mở được nội dung các sách in (Banowetz, Rowland, Schnabel, Neuhaus) nên mục Nguồn viết lại theo bốn nguồn trên (bỏ các sách in và bài Fitch về Voiles, chưa đọc). Đã sửa (da-sua): n9 (Cristofori), n27 (câu senza sordino), n52 (Chopin: bỏ vế una corda và Pleyel). Đã bỏ (da-bo): n24 (hàng Sost. Ped.), n26 (hàng con sordino/mit Verschiebung), n28 (câu "phần lớn ký hiệu… do biên tập"), n53 (Chopin hiếm khi ghi una corda). Chưa chắc (ket_qua null): n3, n5, n8, n11, n15, n16, n18, n19, n20, n31, n33, n37, n40, n41, n43, n44, n46, n49, n54, n57; người giao quyết định bỏ hay xin lượt 2 tìm nguồn bậc 1–2 (nhất là bàn đạp nối và ký hiệu Ped./✱, còn tồn từ 10-bai-dau-tien n83, n84). So hồ sơ khóa trước: lo-trinh-choi.yml (mục "Bàn đạp nối": giữ, có), 10-bai-dau-tien.yml n83/n84 (bảng ký hiệu và mục Bàn đạp nối: giữ, có), 14-ky-hieu-bieu-dien.yml (bảng ký hiệu có u.c. và t.c.: giữ, có), lo-trinh.yml (Mozart cần gạt đầu gối và gần như không ghi bàn đạp; Chopin tự ghi bàn đạp kỹ: giữ, có), hai-tay.yml (trang tồn tại, kiểu 6 trỏ tới Bàn đạp: khớp). Thuật ngữ có sẵn trong thuat-ngu.yml: una corda, senza sordino, con sordino, sostenuto (bàn đạp), bàn đạp vang, bộ giảm âm; chưa có: bàn đạp nối (legato/syncopated pedal), cộng hưởng giao cảm, nửa bàn đạp, rung bàn đạp (flutter pedal), bàn đạp tập, laissez vibrer, simile, damper. MỤC thuat-ngu "con-sordino-con-sordina" nói điều trang đã bỏ (xem n26). Hình tĩnh pedal-timing.html: không lỗi. Không còn chi tiết mau cũ (tên ứng dụng, giá, thiết bị) trên trang lõi này; "bộ ba bàn đạp gắn vào chân đàn" là mô tả loại đàn, không gắn hãng.'
doi_chu:
  - cu:
      - "Dịch cả bàn phím và bộ máy sang phải: ở âm vực mỗi nốt có ba dây, búa chỉ gõ hai, bằng phần nỉ chưa bị dây in rãnh. Tiếng nhỏ hơn, mềm và tối lại"
      - Đưa cả hàng búa lại gần dây; búa đi quãng ngắn hơn nên tiếng nhỏ hơn, nhưng màu tiếng gần như không đổi và cảm giác phím hơi khác
    moi:
      - Dịch cả bàn phím và bộ máy sang bên, để búa gõ ít dây hơn ở mỗi nốt. Tiếng nhỏ hơn và đổi màu
      - Đưa cả hàng búa lại gần dây; búa đi quãng ngắn hơn nên tiếng nhỏ hơn
    ly_do: "n2, n3, n5 (review D4-gom): bảng Ba bàn đạp, hàng una corda."
  - cu:
      - "Thường là bàn đạp tập: hạ một dải nỉ vào giữa búa và dây để giảm tiếng (nhiều đàn gạt sang bên để khóa). Một số đàn đứng có sostenuto thật, hoặc bàn đạp chỉ nhấc bộ giảm âm phần trầm"
      - Tên una corda ("một dây") có từ thời bộ máy dịch được tới mức búa chỉ gõ một dây; trong Concerto số 4, Beethoven còn ghi cả una corda, due corde và tre corde. Lịch sử của bàn đạp, từ cần gạt bằng đầu gối đến sostenuto, ở trang lịch sử cây đàn.
      - "Piano điện. Bàn đạp đi kèm nhiều đàn là loại công tắc: chỉ có bật và tắt, không có nửa bàn đạp. Loại tốt hơn có cảm biến liên tục đọc được độ sâu, nên dùng được nửa bàn đạp. Nhiều đàn có bộ ba bàn đạp gắn vào chân đàn hoặc bán rời; khi đó bàn đạp giữa thường là sostenuto, bàn đạp trái làm tiếng nhỏ và tối đi. Đàn tốt còn mô phỏng cộng hưởng dây khi nhấn bàn đạp. Nếu bạn định học đến trình độ trung cấp, bàn đạp liên tục là khoản đáng đầu tư (xem chọn đàn)."
    moi:
      - Một số đàn đứng có sostenuto thật. Nếu bàn đạp giữa của đàn bạn không phải sostenuto, xem sách hướng dẫn của đàn để biết nó làm gì
      - Una corda nghĩa là "một dây". Hai cây đàn còn lại của Cristofori (1722 và 1726) có bàn phím trượt được sang bên, để búa chỉ gõ một trong hai dây của mỗi nốt. Lịch sử của bàn đạp, từ cần gạt bằng đầu gối đến sostenuto, ở trang lịch sử cây đàn.
      - Piano điện. Có bàn đạp chỉ là công tắc bật – tắt, và có bàn đạp dùng được nửa bàn đạp (half-damper). Nếu bạn định học đến trình độ trung cấp, bàn đạp dùng được nửa bàn đạp là khoản đáng đầu tư (xem chọn đàn).
    ly_do: 'n9 (da-sua): Câu cũ: "có từ thời bộ máy dịch được tới mức búa chỉ gõ một dây". Thêm tên Cristofori (Wikipedia: trên đàn Cristofori bộ máy dịch để búa gõ một dây thay vì hai) cho rõ nghĩa. Beethoven Concerto số 4: Wikipedia ghi una corda, due corde, tre corde. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.; n7, n8 (review D4-gom): bỏ bàn đạp tập, không có nguồn.; n9 (da-sua, review D4-gom): theo Met; bỏ Concerto số 4.; n10, n11, n12 (review D4-gom): piano điện viết gọn theo nguồn hãng.'
  - cu:
      - "Bàn đạp vang nhấc tất cả bộ giảm âm cùng lúc. Nốt vẫn ngân sau khi nhả phím, và mọi dây khác cũng được tự do rung: đó là cộng hưởng giao cảm. Dây nào trùng tần số với một bồi âm của nốt đang vang sẽ rung khẽ theo, tạo một quầng âm thanh ấm quanh nốt. Vì vậy một nốt có bàn đạp nghe khác hẳn cùng nốt ấy giữ bằng ngón, dù dài như nhau."
      - "Các nốt cao nhất (cỡ quãng tám trên cùng, tùy đàn) không có bộ giảm âm: dây ngắn, tự tắt nhanh."
      - Bàn đạp không phải công tắc. Độ sâu quyết định bộ giảm âm nhấc cao hay thấp; nhả nhanh hay chậm quyết định tiếng tắt gọn hay có đuôi. Phần lớn nghệ thuật bàn đạp nằm ở những chuyển động nhỏ quanh điểm bộ giảm âm vừa rời dây.
    moi:
      - "Bàn đạp vang nhấc tất cả bộ giảm âm cùng lúc. Nốt vẫn ngân sau khi nhả phím, và mọi dây khác cũng được tự do rung theo những nốt đang chơi: đó là cộng hưởng giao cảm. Vì vậy một nốt có bàn đạp nghe khác hẳn cùng nốt ấy giữ bằng ngón, dù dài như nhau."
      - Các nốt ở âm vực cao nhất (cỡ hai quãng tám trên cùng, tùy đàn) không có bộ giảm âm.
      - "Bàn đạp không phải công tắc: có thể đạp nông hay sâu (như nửa bàn đạp, khi bộ giảm âm chỉ chạm nhẹ dây) và nhả nhanh hay chậm. Hãy tập cho chân quen những chuyển động nhỏ quanh điểm bộ giảm âm vừa rời dây."
    ly_do: "n14 (da-sua, review D4-gom): theo AES 2008.; n15 (da-sua, review D4-gom): theo AES 2008 (hai quãng tám trên cùng).; n16 (da-sua, review D4-gom)."
  - cu:
      - "Nhấn bàn đạp vang ở Ped., nhả ở dấu sao. Một chữ Ped. mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại"
      - Đường kẻ dưới khuông, có móc ở hai đầu
      - Nhấn ở đầu đường kẻ, nhả ở cuối; mỗi chỗ gãy nhọn (∧) là một lần nhả rồi nhấn lại ngay
      - con pedale, con Ped.
      - Dùng bàn đạp; người chơi tự quyết chỗ đổi
      - senza pedale, senza Ped.
      - Không dùng bàn đạp
    moi:
      - "Nhấn bàn đạp vang ở Ped., nhả ở dấu sao. Trong các bài trên site này, một chữ Ped. mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại"
      - Đường kẻ dưới khuông, có vạch dọc ở hai đầu
      - Nhấn ở đầu đường kẻ, giữ đến vạch dọc ở cuối thì nhả; chỗ gãy nhọn (∧) trên đường kẻ là nhả rồi nhấn lại ngay (đổi bàn đạp); vài ấn bản dùng nó cho nửa bàn đạp (chỉ nhả một phần)
    ly_do: "n19 (da-sua, người gom D4-gom): ∧ đọc là nhả rồi nhấn lại (MEI), vài ấn bản dùng cho nửa bàn đạp. n18 (da-sua, review D4-gom): quy ước Ped. mới là của các bài trên site.; n19, n20 (review D4-gom): ∧ là nửa bàn đạp (Dolmetsch, OnMusic); bỏ con/senza pedale."
  - cu:
      - Sost. Ped.
      - Bàn đạp giữ âm (giữa)
    ly_do: 'n24 (da-bo): Bỏ hàng: không có nguồn cho chữ viết tắt "Sost. Ped." (Wikipedia xác nhận không nói); thuat-ngu.yml đã có "sostenuto (bàn đạp)" nên thuật ngữ vẫn còn ở dữ liệu.'
  - cu:
      - con sordino (về sau), mit Verschiebung (Schumann)
      - Thường chỉ bàn đạp una corda
      - "Hai dòng cuối là một cái bẫy: cùng chữ sordino, ở Beethoven là bộ giảm âm, còn ở nhiều nhà soạn nhạc về sau là una corda. Bản Urtext tốt giữ nguyên chữ của tác giả và giải thích trong chú thích. Cũng nhớ rằng phần lớn ký hiệu bàn đạp trong các bản in phổ thông là của người biên tập. Các ký hiệu biểu diễn khác ở bài ký hiệu biểu diễn."
    moi: Chữ senza sordino của Beethoven là chỉ dẫn về bộ giảm âm (bàn đạp vang), không phải bàn đạp trái. Các ký hiệu biểu diễn khác ở bài ký hiệu biểu diễn.
    ly_do: 'n26 (da-bo): Bỏ hàng: Wikipedia glossary chỉ nói "con sordino" là dạng sai của con sordina (mute) và không có "mit Verschiebung" (Schumann); không nguồn nào xác nhận nghĩa "una corda". Câu "Hai dòng cuối là một cái bẫy…" đã sửa (n27). Hệ quả cho dữ liệu: src/data/thuat-ngu.yml còn mục con-sordino-con-sordina ("Ở một số nhà soạn nhạc về sau (như Scriabin): dùng bàn đạp trái una corda") và ghi "Xem Bàn đạp: ký hiệu"; trang không còn nói điều đó: người giao phải sửa hoặc bỏ mục này (không sửa ở đây).; n27 (da-sua) và n28 (da-bo): Câu cũ: "Hai dòng cuối là một cái bẫy: cùng chữ sordino, ở Beethoven là bộ giảm âm, còn ở nhiều nhà soạn nhạc về sau là una corda. Bản Urtext tốt giữ nguyên chữ của tác giả và giải thích trong chú thích." Phần "về sau là una corda" và "Urtext tốt…" không có nguồn nên bỏ; giữ phần Beethoven (Fitch).'
  - cu: "Ô 6 là chỗ cần nghe: giai điệu Fa–Mi–Rê đi bậc liền trên cùng một hợp âm, nên dưới bàn đạp, Mi và Rê chồng lên nhau. Nếu nghe nhòe, đổi hẳn bàn đạp ở phách 3 sẽ làm mất nốt trầm Rê. Thử cách khác: đạp nông hơn ngay từ đầu ô, hoặc nhả một nửa rồi nhấn lại thật nhanh ở phách 3 (nửa bàn đạp, xem dưới): dây cao tắt trước, dây trầm còn ngân."
    moi: "Ô 6 là chỗ cần nghe: giai điệu Fa–Mi–Rê đi bậc liền trên cùng một hợp âm, nên dưới bàn đạp, Mi và Rê chồng lên nhau. Nếu nghe nhòe, đổi hẳn bàn đạp ở phách 3 sẽ làm mất nốt trầm Rê. Thử cách khác: đạp nông hơn ngay từ đầu ô, hoặc nhả một nửa rồi nhấn lại thật nhanh ở phách 3 (nửa bàn đạp, xem dưới), rồi nghe xem nốt trầm Rê còn ngân không."
    ly_do: n36, n37 (review D4-gom).
