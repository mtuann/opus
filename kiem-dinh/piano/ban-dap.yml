nhan_dinh:
  - id: n1
    cau: "Bàn đạp phải là bàn đạp vang (damper, sustain): nhấc mọi bộ giảm âm khỏi dây, trên đàn đứng cũng vậy."
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: 'Wikipedia Piano pedals: sustain pedal "raises all the dampers off the strings". Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Britannica: bàn đạp phải nhấc mọi bộ giảm âm cho dây rung tự do; Oxford: nhấc 'cả dãy' bộ giảm âm. Đàn đứng cũng có (Oxford/Britannica nói chung cho piano)."
  - id: n2
    cau: "Bàn đạp trái trên đàn cánh là una corda (soft pedal): dịch cả bàn phím và bộ máy sang bên, để búa gõ ít dây hơn ở mỗi nốt; tiếng nhỏ hơn và đổi màu."
    loai: dinh-nghia
    nguon:
      - cod-piano
      - cod-corda
      - britannica-piano
      - baylor-pedal
      - dolmetsch-p1
    ket_qua: da-sua
    ghi_chu: "Wikipedia: ở âm cao búa gõ hai dây thay vì ba; đổi màu tiếng, không chỉ giảm to. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Review D4-gom: hai nguồn bậc 2 khác nhau ở số dây: Concise Oxford (mục piano) \"moving the kbd. and set of hammers sideways, so as to leave unstruck 1 str. of each note\", Concise Oxford (mục corda) \"to strike only one str.\", Britannica \"strike only one of the two or three unison strings\"; Baylor ch. 28 \"strike fewer strings per note\". Viết chung theo Baylor. Dolmetsch: các bàn đạp cho \"a change of tone\". Chữ cũ (bảng, cột đàn cánh): \"Dịch cả bàn phím và bộ máy sang phải: ở âm vực mỗi nốt có ba dây, búa chỉ gõ hai, bằng phần nỉ chưa bị dây in rãnh. Tiếng nhỏ hơn, mềm và tối lại\"; chữ mới: \"Dịch cả bàn phím và bộ máy sang bên, để búa gõ ít dây hơn ở mỗi nốt. Tiếng nhỏ hơn và đổi màu\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/soft-pedal", "https://www.popularbeethoven.com/?p=3222" ]
    luot_2_ghi_chu: "COD Music (soft pedal): pedal chân trái, giảm âm lượng 'by causing fewer than the normal number of strings to be struck, or by bringing the hammers nearer'. popularbeethoven: đàn cánh dịch bộ máy để mỗi nốt gõ ít dây hơn. 'Đổi màu' là mô tả chuẩn."
  - id: n3
    cau: Trên đàn cánh bàn đạp una corda dịch cả bàn phím và bộ máy sang phải, và búa gõ bằng phần nỉ chưa bị dây in rãnh.
    loai: dinh-nghia
    ket_qua: da-bo
    ghi_chu: 'chưa chắc: Wikipedia không nói chiều dịch ("sang phải") và phần nỉ chưa in rãnh; chưa mở nguồn nhà chế tạo. Người giao quyết định bỏ hai chi tiết này hay xin nguồn. Review D4-gom: không có nguồn bậc 1–2 cho chiều dịch "sang phải" và "phần nỉ chưa bị dây in rãnh": bỏ hai chi tiết (xem n2).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.metmuseum.org/toah/hd/cris/hd_cris.htm" ]
    luot_2_ghi_chu: "Britannica, Met: bàn phím và bộ máy dịch ngang (Met: bàn phím của Cristofori trượt). Hướng 'sang phải' và chi tiết 'nỉ chưa bị dây in rãnh' không có trong nguồn mở được."
  - id: n4
    cau: Trên đàn đứng, bàn đạp trái đưa cả hàng búa lại gần dây; búa đi quãng ngắn hơn nên tiếng nhỏ hơn.
    loai: dinh-nghia
    nguon:
      - cod-piano
    ket_qua: dung
    ghi_chu: "Wikipedia: half-blow pedal, búa lại gần dây, quãng đánh ngắn hơn, nhỏ hơn. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Review D4-gom: Concise Oxford (piano): \"in uprights by moving the whole set of hammers nearer to the str., so that the force of their blows is diminished\". Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Oxford (Pedals): trên đàn đứng, bàn đạp mềm đưa búa gần dây hơn (hoặc chèn nỉ). Búa đi quãng ngắn hơn nên nhỏ hơn: hệ quả cơ học."
  - id: n5
    cau: Trên đàn đứng, màu tiếng gần như không đổi và cảm giác phím hơi khác khi dùng bàn đạp trái.
    loai: dinh-nghia
    ket_qua: da-bo
    ghi_chu: 'chưa chắc: Wikipedia chỉ nói bàn đạp trái đàn đứng không phải una corda thật; "màu tiếng gần như không đổi", "cảm giác phím" chưa có nguồn. Review D4-gom: không có nguồn cho "màu tiếng gần như không đổi", "cảm giác phím hơi khác": bỏ khỏi bảng.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn bậc 2 nói về màu tiếng, cảm giác phím của bàn đạp trái trên đàn đứng.
  - id: n6
    cau: "Bàn đạp giữa trên đàn cánh là bàn đạp giữ âm (sostenuto): chỉ giữ nhấc những bộ giảm âm đang được nhấc vào lúc nhấn bàn đạp, tức của những phím đang giữ."
    loai: dinh-nghia
    nguon:
      - britannica-piano
      - baylor-pedal
    ket_qua: dung
    ghi_chu: "Wikipedia: sostenuto giữ các nốt đã đang được giữ phím khi nhấn. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Review D4-gom: Britannica: bàn đạp giữa \"usually holds up the dampers only of those keys depressed when the pedal is depressed\"; Baylor ch. 28: \"suspends the dampers of whichever keys are already depressed\". Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.dolmetsch.com/musicalsymbols.htm" ]
    luot_2_ghi_chu: "Britannica: sostenuto giữ bộ giảm âm nhấc chỉ cho các phím đã nhấn khi bàn đạp được nhấn. Dolmetsch: bàn đạp giữa là bộ giảm âm chọn lọc."
  - id: n7
    cau: "Một số đàn đứng có sostenuto thật; nếu bàn đạp giữa của đàn không phải sostenuto, xem sách hướng dẫn của đàn để biết nó làm gì."
    loai: dinh-nghia
    nguon:
      - britannica-piano
    ket_qua: da-sua
    ghi_chu: 'Wikipedia: practice rail (dải nỉ giữa búa và dây); sostenuto thật hiếm ở đàn đứng; có thể chỉ điều khiển bộ giảm âm bass. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Vế "nhiều đàn gạt sang bên để khóa" không có trong nguồn (n8). Review D4-gom: Britannica: bàn đạp giữa "generally available on grand pianos but also found on some upright pianos". Không tìm được nguồn bậc 1–2 (hãng đàn) cho "bàn đạp tập" và "chỉ nhấc bộ giảm âm phần trầm": bỏ. Chữ cũ (bảng, cột đàn đứng): "Thường là **bàn đạp tập**: hạ một dải nỉ vào giữa búa và dây để giảm tiếng (nhiều đàn gạt sang bên để khóa). Một số đàn đứng có sostenuto thật, hoặc bàn đạp chỉ nhấc bộ giảm âm phần trầm"; chữ mới: "Một số đàn đứng có sostenuto thật. Nếu bàn đạp giữa của đàn bạn không phải sostenuto, xem sách hướng dẫn của đàn để biết nó làm gì".'
    luot_2: dung
    luot_2_nguon: [ "https://www.popularbeethoven.com/?p=3222", "https://en.wikipedia.org/wiki/Piano_pedals" ]
    luot_2_ghi_chu: "popularbeethoven: sostenuto thường ở đàn cánh; bàn đạp giữa đàn đứng thường là practice pedal. Wikipedia (chỉ để tìm nguồn, trích Good 1982): true sostenuto hiếm trên đàn đứng trừ loại đắt như Steinway, Bechstein. Câu 'một số đàn đứng có sostenuto thật' khớp."
  - id: n8
    cau: Nhiều đàn đứng gạt bàn đạp tập sang bên để khóa.
    loai: dinh-nghia
    ket_qua: da-bo
    ghi_chu: "chưa chắc: Wikipedia không nói; chưa có nguồn. Review D4-gom: không có nguồn: bỏ cùng n7."
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn bậc 2 về cơ chế khóa bàn đạp tập.
  - id: n9
    cau: Una corda nghĩa là "một dây"; hai cây đàn còn lại của Cristofori (1722 và 1726) có bàn phím trượt được sang bên, để búa chỉ gõ một trong hai dây của mỗi nốt.
    loai: lich-su
    nguon:
      - met-cristofori
      - cod-corda
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "có từ thời bộ máy dịch được tới mức búa chỉ gõ một dây". Thêm tên Cristofori (Wikipedia: trên đàn Cristofori bộ máy dịch để búa gõ một dây thay vì hai) cho rõ nghĩa. Beethoven Concerto số 4: Wikipedia ghi una corda, due corde, tre corde. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Review D4-gom: Met (The Pianofortes of Bartolomeo Cristofori, mở 28/10/2026): bàn phím của hai đàn Cristofori còn lại (Rome 1722, Leipzig 1726) "can be shifted slightly so that only one of the two strings of each pitch will be struck"; Concise Oxford (corda): una corda = "one string". Không có nguồn bậc 1–2 cho "tên có từ thời Cristofori" và cho Concerto số 4 (chỉ Wikipedia): bỏ. Chữ cũ: "Tên *una corda* ("một dây") có từ thời đàn của Cristofori, khi bộ máy dịch sang bên để búa chỉ gõ một dây; trong Concerto số 4, Beethoven còn ghi cả *una corda*, *due corde* và *tre corde*." Chữ mới: "*Una corda* nghĩa là "một dây". Hai cây đàn còn lại của Cristofori (1722 và 1726) có bàn phím trượt được sang bên, để búa chỉ gõ một trong hai dây của mỗi nốt." Cần lượt 2 bổ sung cho chữ mới.'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731" ]
    luot_2_ghi_chu: "Met: 'The keyboards of the two other surviving pianos by Cristofori can be shifted slightly so that only one of the two strings of each pitch will be struck, i.e., una corda'; các đàn là 1722 (Rome) và 1726 (Leipzig)."
  - id: n10
    cau: "Piano điện: có bàn đạp chỉ là công tắc bật – tắt, và có bàn đạp dùng được nửa bàn đạp (half-damper)."
    loai: dinh-nghia
    nguon:
      - roland-dp10
    ket_qua: da-sua
    ghi_chu: 'Wikipedia: trên piano điện bàn đạp "usually a simple switch", loại tinh vi hơn "can detect and transmit a signal for half-pedaling". Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Review D4-gom: Roland DP-10 (trang sản phẩm của hãng, mở 28/10/2026): "compatible with half-damper capable keyboards, and it can also serve as a standard pedal switch". Không có nguồn cho "cảm biến liên tục", "nhiều đàn": viết gọn, không nêu tên sản phẩm trên trang. Chữ cũ: "Bàn đạp đi kèm nhiều đàn là loại **công tắc**: chỉ có bật và tắt, không có nửa bàn đạp. Loại tốt hơn có **cảm biến liên tục** đọc được độ sâu, nên dùng được nửa bàn đạp." Chữ mới: "Có bàn đạp chỉ là **công tắc** bật – tắt, và có bàn đạp dùng được **nửa bàn đạp** (*half-damper*)." Cần lượt 2 bổ sung cho chữ mới.'
    luot_2: dung
    luot_2_nguon: [ "https://faq.yamaha.com/usa/s/article/000025469", "https://en.wikipedia.org/wiki/Piano_pedals" ]
    luot_2_ghi_chu: "Yamaha FAQ: FC5, FC4A là công tắc on/off, FC3A là half-damper. Chung: bàn đạp đàn điện thường là công tắc đơn giản, loại tinh vi hơn phát tín hiệu half-pedaling."
  - id: n11
    cau: Nhiều piano điện có bộ ba bàn đạp gắn vào chân đàn hoặc bán rời, bàn đạp giữa thường là sostenuto, bàn đạp trái làm tiếng nhỏ và tối đi; đàn tốt còn mô phỏng cộng hưởng dây khi nhấn bàn đạp.
    loai: dinh-nghia
