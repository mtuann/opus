    luot_2: khong-chac
    luot_2_ghi_chu: "Nhận xét về các bản in phổ thông: không có nguồn bậc 2 mở được."
  - id: n29
    cau: "Đặt chân: gót chân phải trên sàn, mũi bàn chân đặt lên bàn đạp; chuyển động từ cổ chân; chân luôn chạm bàn đạp; chân trái phẳng; giày đế mỏng không trơn."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên kỹ thuật; không khẳng định nguyên nhân chấn thương. Ghi chú "tránh giày cao gót và dép" cũng là lời khuyên.
  - id: n30
    cau: "Tìm điểm bắt: bấm lặp một nốt staccato trong khi nhấn bàn đạp thật chậm; tới một độ sâu nốt bắt đầu ngân sau khi nhả phím, đó là điểm bộ giảm âm rời dây."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Bài tập nghe; phần mô tả hiện tượng ("điểm bộ giảm âm rời dây") là nghĩa của chính bộ giảm âm (n14).
  - id: n31
    cau: "Bàn đạp nối (bàn đạp trễ, legato pedal, syncopated pedal): nhấn bàn đạp sau khi chơi hợp âm, nhả đúng lúc hợp âm mới vang rồi nhấn lại ngay; chân đi lệch nhịp với tay."
    loai: quy-tac
    ket_qua: dung
    ghi_chu: 'chưa chắc: chưa mở nguồn bậc 1–2 (Banowetz, Rowland, Schnabel, Neuhaus chỉ có thông tin xuất bản, không đọc được nội dung). Wikipedia chỉ nói bàn đạp vang giúp nối nốt (legato); không có tên "syncopated pedal" hay các bước. Cùng tình trạng với n83, n84 của 10-bai-dau-tien.yml. Review D4-gom: Yamaha Music Educators Hub (Creviston): "There are three names for this time of pedaling: legato, syncopated or overlapping"; cổ chân nâng và hạ bàn đạp ngay sau khi nốt mới vang, ngón vẫn giữ phím. Baylor ch. 28: "play-up-down" (Play: bấm phím; Up: nhả bàn đạp; Down: nhấn lại). Giữ; tên "bàn đạp trễ" là cách gọi tiếng Việt của site.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kỹ thuật bàn đạp nối (syncopated pedal) là chuẩn, nhưng không mở được nguồn bậc 2.
    nguon:
      - yamaha-pedaling
      - baylor-pedal
  - id: n32
    cau: Nếu nhấn bàn đạp cùng lúc với phím, giữa hai hợp âm có khe hở (nhả quá sớm) hoặc vệt nhòe (nhả quá muộn).
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả lỗi nghe được của kỹ thuật, đi cùng n31.
    luot_2: dung
    luot_2_ghi_chu: "khuyen-tap: hợp lý."
  - id: n33
    cau: "Hình pedal-timing: chân nhả đúng lúc hợp âm mới vang (tay xuống, chân lên) rồi nhấn lại ngay; hợp âm nối liền mà không lẫn."
    loai: quy-tac
    ket_qua: dung
    ghi_chu: 'chưa chắc: cùng n31. Hình tĩnh src/components/hinh/pedal-timing.html khớp lời văn năm bước: aria-label, nhãn "chân nhả", "chân nhấn", "Hợp âm 1–3", ① nhả đúng lúc hợp âm mới vang, ② nhấn lại ngay sau đó, chú thích. Không có lỗi chữ nào cần sửa; hình không sửa ở đây. Review D4-gom: như n31; đã kiểm hình src/components/hinh/pedal-timing.html: nhãn "chân nhả", "chân nhấn", "① nhả đúng lúc hợp âm mới vang", "② nhấn lại ngay sau đó, khi ngón tay còn giữ phím", chú thích và aria-label khớp lời văn và nguồn. Hình không cần sửa.'
    luot_2: khong-chac
    luot_2_ghi_chu: Như n31.
    nguon:
      - yamaha-pedaling
      - baylor-pedal
  - id: n34
    cau: "Bài khởi động: chơi Đô–Rê–Mi–Fa–Sol thật chậm chỉ bằng ngón 3, đổi bàn đạp ở mỗi nốt; không bàn đạp các nốt hở vì ngón phải nhấc lên."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Bài tập.
    luot_2: dung
    luot_2_ghi_chu: "khuyen-tap: bài khởi động hợp lý, không có hại."
  - id: n35
    cau: "Bài 1 (chuỗi hợp âm): tay phải 1-3-5 cho Đô–Mi–Sol và Đô–Fa–La, 1-2-5 cho Đô–Mi–La và Si–Rê–Sol, 1-4-5 cho Si–Fa–Sol; ở hợp âm cuối nhả bàn đạp cùng lúc nhấc tay; kiểm tra bằng tai."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Ngón bấm chơi được và khớp khối abc 1.
  - id: n36
    cau: "Bài 2: tay trái kiểu valse (nốt trầm ngón 5 rồi hai hợp âm nhẹ), bàn đạp đổi ngay sau mỗi nốt trầm; ô 6 giai điệu Fa–Mi–Rê đi bậc liền trên cùng một hợp âm: thử đạp nông hay nhả một nửa ở phách 3, rồi nghe xem nốt trầm Rê còn ngân không."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Khớp khối abc 2 (ô 6: tay phải F E D trên Rê–Fa–La ở tay trái). Phần nửa bàn đạp thuộc n37. Review D4-gom: chữ đổi ở câu cuối (nửa bàn đạp, theo n37): chữ cũ \"…(nửa bàn đạp, xem dưới): dây cao tắt trước, dây trầm còn ngân.\"; chữ mới \"…(nửa bàn đạp, xem dưới), rồi nghe xem nốt trầm Rê còn ngân không.\""
  - id: n37
    cau: "Các kiểu đạp khác: đạp cùng lúc (direct, rhythmic pedal), đạp trước, nửa bàn đạp (nhấn nông, bộ giảm âm chạm nhẹ dây; hoặc nhả một nửa rồi nhấn lại), rung bàn đạp (flutter pedal: nhả và nhấn rất nhanh, liên tục)."
    loai: dinh-nghia
    ket_qua: da-sua
    ghi_chu: "chưa chắc: chưa mở nguồn bậc 1–2 (Banowetz, Rowland, Schnabel, Neuhaus chỉ có thông tin xuất bản, không đọc được nội dung). Wikipedia không định nghĩa nửa bàn đạp ở đàn cơ hay flutter pedal. Review D4-gom: Yamaha Hub: \"direct or rhythmic pedaling\" (đạp cùng lúc), \"half pedal and flutter pedal\", flutter = \"moving the foot up and down quickly and continually\"; Dolmetsch: flutter pedal \"a constant up and down motion\"; bằng sáng chế Yamaha: ở vùng nửa bàn đạp bộ giảm âm chạm nhẹ dây. Không có nguồn cho \"dây cao tắt, dây trầm còn ngân\": bỏ, thay bằng lời khuyên nghe nốt trầm. \"Đạp trước\" là lời khuyên tập (không cần nguồn). Chữ cũ (hàng Nửa bàn đạp): \"Hoặc chỉ nhấn nông, bộ giảm âm vừa rời dây; hoặc khi đổi, chỉ nhả một nửa rồi nhấn lại: dây cao (ngắn, nhẹ) tắt, dây trầm (dài, nặng) còn ngân | Giữ nốt trầm qua những thay đổi ở âm vực cao; làm mờ vừa phải\"; chữ mới: \"Hoặc chỉ nhấn nông, bộ giảm âm chạm nhẹ dây; hoặc khi đổi, chỉ nhả một nửa rồi nhấn lại | Làm mờ vừa phải; thử giữ nốt trầm qua những thay đổi ở âm vực cao, nghe xem nốt trầm còn ngân không\". Hàng Đạp cùng lúc thêm tên *direct*, *rhythmic pedal*. Cần lượt 2 bổ sung."
    luot_2: dung
    nguon:
      - yamaha-pedaling
      - dolmetsch-symbols
      - yamaha-patent-half
    luot_2_nguon: [ "https://melaniespanswick.com/2015/05/19/perfect-pedalling/", "https://www.pianistmagazine.com/blogs/5-top-tips-to-help-with-pedalling/" ]
    luot_2_ghi_chu: "Spanswick: direct pedalling (nhấn cùng ngón), anticipatory (nhấn trước khi chơi), half-pedalling/half-damping, flutter ('very quick, light, frequent'). Pianist: flutter 'rapidly oscillates up and down'. Khớp."
