    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở nguồn bậc 1–2; cùng ý ở ../opus-zero/docs/piano/lich-su-dan.md dòng 35. Harpsichord/clavichord không có bàn đạp vang kiểu piano là kiến thức chuẩn nhưng chưa kèm nguồn."
