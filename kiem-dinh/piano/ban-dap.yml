    ghi_chu: 'Đã có: piano/tu-the, hop-am-rai, tieng-dan, nhac-ly/14-ky-hieu-bieu-dien, nhac-ly/am-hoc. Chưa chuyển, đã kiểm ở ../opus-zero/docs/: luyen-tap/thu-am; piano/chon-dan (bàn đạp liên tục, bàn đạp giữa sostenuto/đàn đứng là bàn đạp tập, nâng cấp ở Grade 4–5); piano/lich-su-dan (cần đầu gối của Stein, Walter; ba bàn đạp; senza sordino; bảng sáng chế nói Steinway 1874 cho sostenuto, trong khi Wikipedia Piano pedals ghi Boisselot 1844, Debain 1860, Montal 1862, Steinway hoàn thiện và đăng ký 1874: người giao xem lại câu ở lich-su-dan khi chuyển); piano/tac-pham/beethoven-anh-trang (mục "### Bàn đạp: *senza sordino*", slug ban-ap-senza-sordino: có, khớp anchor); bach-prelude-do (giữ nốt và bàn đạp); mozart-k545 (gần như không bàn đạp); chopin-nocturne-op9-2 (đổi bàn đạp theo nốt trầm); debussy-clair-de-lune (una corda, đạp nửa); tai-lieu-tham-khao. Lô chuyển các trang đó phải giữ các nội dung ấy. Mục thuat-ngu.yml trỏ tới ban-dap/#beethoven và #ky-hieu: hai tiêu đề này có ("### Beethoven", "## Ký hiệu"). Review D4-gom: Review: đã kiểm từng link trên trang: tu-the, hop-am-rai, tieng-dan, lich-su-dan (nay đã chuyển), nhac-ly/14-ky-hieu-bieu-dien, nhac-ly/am-hoc có trong dist/; luyen-tap/thu-am, piano/chon-dan, tac-pham/bach-prelude-do (mục Giữ nốt và bàn đạp), beethoven-anh-trang (### Bàn đạp: *senza sordino*, slug ban-ap-senza-sordino), chopin-nocturne-op9-2, debussy-clair-de-lune, mozart-k545, tai-lieu-tham-khao có ở ../opus-zero/docs/. dist/piano/ban-dap/index.html có id "ba-ban-ap", "ky-hieu", "beethoven" (hồ sơ lich-su-dan, thuat-ngu trỏ tới).'
