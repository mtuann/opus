  - id: n13
    cau: Mỗi nốt có một bộ giảm âm bọc nỉ nằm trên dây; bấm phím thì bộ giảm âm nhấc lên, nhả phím thì rơi xuống chặn dây.
    loai: dinh-nghia
    nguon:
      - baylor-pedal
      - britannica-piano
    ket_qua: dung
    ghi_chu: 'Cơ chế cơ bản của bộ giảm âm theo Wikipedia (pedal nhấc tất cả bộ giảm âm khỏi dây); cùng nội dung ../opus-zero/docs/piano/lich-su-dan.md dòng 98. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Review D4-gom: Baylor ch. 28: không có bàn đạp thì bộ giảm âm chặn dây ngay khi nhả phím; Britannica: "felt dampers". Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano", "https://www.britannica.com/art/piano" ]
    luot_2_ghi_chu: "Oxford/Britannica: bàn đạp vang nhấc cả dãy bộ giảm âm khỏi dây; ngụ ý mỗi dây có bộ giảm âm hạ xuống khi nhả phím. Chi tiết bọc nỉ là kiến thức chuẩn."
  - id: n14
    cau: "Bàn đạp vang nhấc tất cả bộ giảm âm cùng lúc; nốt ngân sau khi nhả phím, và mọi dây khác cũng được tự do rung theo những nốt đang chơi: cộng hưởng giao cảm; vì vậy một nốt có bàn đạp nghe khác cùng nốt ấy giữ bằng ngón."
    loai: dinh-nghia
    nguon:
      - aes-pedal
      - baylor-pedal
    ket_qua: da-sua
    ghi_chu: 'Wikipedia: nhấn bàn đạp "makes every string on the piano a sympathetic string". Cơ chế bồi âm trùng tần số là vật lý chuẩn, cũng ở nhac-ly/am-hoc (đã chuyển). Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Review D4-gom: AES 124th Convention (Schutz và cộng sự 2008, mở 28/10/2026): "When the sustain pedal is pressed, all the dampers of the piano are kept raised"; "Raising the dampers leaves all the strings free to vibrate sympathetically with whichever notes are being played"; hiệu ứng chi phối "the behavior of the partials, not only in duration but also in terms of spectral evolution". Không có nguồn bậc 1–2 cho "dây trùng tần số với một bồi âm … tạo quầng âm ấm": bỏ vế ấy. Chữ cũ: "…mọi dây khác cũng được tự do rung: đó là **cộng hưởng giao cảm**. Dây nào trùng tần số với một bồi âm của nốt đang vang sẽ rung khẽ theo, tạo một quầng âm thanh ấm quanh nốt." Chữ mới: "…mọi dây khác cũng được tự do rung theo những nốt đang chơi: đó là **cộng hưởng giao cảm**."'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano", "https://en.wikipedia.org/wiki/Piano_pedals" ]
    luot_2_ghi_chu: "COD Music: bàn đạp vang kéo dài âm, làm giàu tiếng nhờ 'sympathetic resonance'. Bàn đạp nhấc mọi bộ giảm âm, nên mọi dây cùng rung cộng hưởng giao cảm (Wikipedia trích Siepmann, chỉ để tìm nguồn). Khớp."
  - id: n15
    cau: "Các nốt ở âm vực cao nhất (cỡ hai quãng tám trên cùng, tùy đàn) không có bộ giảm âm."
    loai: so-lieu
    ket_qua: da-sua
    ghi_chu: "chưa chắc: chưa mở nguồn nhà chế tạo cho số nốt không có bộ giảm âm; kết quả tìm kiếm chỉ có trang hỗ trợ piano điện (Roland, Kawai) nói đúng hiện tượng ở đàn điện. Review D4-gom: AES (Schutz và cộng sự 2008): \"the two higher octaves of the piano do not have any damper\". Chữ cũ: \"Các nốt cao nhất (cỡ quãng tám trên cùng, tùy đàn) không có bộ giảm âm: dây ngắn, tự tắt nhanh.\" Chữ mới: \"Các nốt ở âm vực cao nhất (cỡ hai quãng tám trên cùng, tùy đàn) không có bộ giảm âm.\" (bỏ vế \"dây ngắn, tự tắt nhanh\", không có nguồn). Cần lượt 2 bổ sung."
    luot_2: dung
    nguon:
      - aes-pedal
    luot_2_nguon: [ "https://markgoodwinpianos.co.uk/yamaha/top-register-no-dampers", "https://kawaius.com/faq/why-do-the-upper-notes-of-my-kawai-digital-piano-sustain-without-using-the-damper-pedal" ]
    luot_2_ghi_chu: "Kỹ thuật viên: 'top couple of octaves' không có giảm âm (đàn cánh cũng vậy); Kawai: dây các nốt cao nhất không gắn giảm âm. 'Cỡ hai quãng tám, tùy đàn' là hơi thoáng nhưng chấp nhận được (thực tế thường khoảng 1,5–2 quãng tám)."
  - id: n16
    cau: "Bàn đạp không phải công tắc: có thể đạp nông hay sâu (như nửa bàn đạp, khi bộ giảm âm chỉ chạm nhẹ dây) và nhả nhanh hay chậm."
    loai: quy-tac
    ket_qua: da-sua
    ghi_chu: "chưa chắc: Wikipedia chỉ nhắc nửa bàn đạp ở piano điện; chưa có nguồn bậc 1–2 cho mô tả độ sâu, chuyển động nhỏ. Review D4-gom: Yamaha Music Educators Hub (Creviston, mở 28/10/2026): \"Quarter pedal, half pedal and flutter pedal\"; Dolmetsch: ký hiệu \"slow release of pedal over a period of time\" và \"half pedal mark\"; bằng sáng chế Yamaha US 8.502.059: \"The damper pedal is lightly in contact with the string in the half pedal region\". Bỏ đánh giá \"phần lớn nghệ thuật bàn đạp nằm ở…\" (thành lời khuyên). Chữ cũ: \"Bàn đạp không phải công tắc. Độ sâu quyết định bộ giảm âm nhấc cao hay thấp; nhả nhanh hay chậm quyết định tiếng tắt gọn hay có đuôi. Phần lớn nghệ thuật bàn đạp nằm ở những chuyển động nhỏ quanh điểm bộ giảm âm vừa rời dây.\" Chữ mới: \"Bàn đạp không phải công tắc: có thể đạp nông hay sâu (như nửa bàn đạp, khi bộ giảm âm chỉ chạm nhẹ dây) và nhả nhanh hay chậm. Hãy tập cho chân quen những chuyển động nhỏ quanh điểm bộ giảm âm vừa rời dây.\" Cần lượt 2 bổ sung."
    luot_2: dung
    nguon:
      - yamaha-pedaling
      - dolmetsch-symbols
      - yamaha-patent-half
    luot_2_nguon: [ "https://melaniespanswick.com/2015/05/19/perfect-pedalling/", "https://www.pianistmagazine.com/blogs/5-top-tips-to-help-with-pedalling/" ]
    luot_2_ghi_chu: "Half-pedalling: chỉ nhấn một phần, 'never pressed all the way down'; flutter/vibrato pedalling dùng chuyển động nhỏ, nhanh; đạp là động tác chia mức nông-sâu, không phải công tắc. Nguồn dạy đàn, không có nguồn bậc 2 nói trái."
  - id: n17
    cau: "Thử nghiệm nghe cộng hưởng giao cảm: bấm câm hợp âm Đô4–Mi4–Sol4, đánh mạnh rồi nhả ngay Đô2, sẽ nghe hợp âm vang khẽ lên."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Bài thử tại nhà, không khẳng định số liệu. (Cơ chế: n14.)"
  - id: n18
    cau: "Ký hiệu Ped.: nhấn bàn đạp vang; dấu sao ✱ là chỗ nhả; trong các bài trên site này, một chữ Ped. mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại."
    loai: quy-tac
    nguon:
      - onmusic-damper
      - onmusic-pedal
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: Wikipedia glossary xác nhận "Ped." = nhấn bàn đạp vang; chưa mở nguồn cho dấu sao và quy ước "Ped. mới = đổi". Trùng với n83, n84 của kiem-dinh/piano/10-bai-dau-tien.yml (cũng chưa chắc): trang Bàn đạp là nơi chuẩn bị nguồn cho cả hai. Review D4-gom: OnMusic Dictionary (damper pedal, pedal; mở 28/10/2026): "Ped" là chỉ dẫn nhấn bàn đạp vang, chỗ nhả ghi bằng "a flowery looking asterisk symbol" (khớp lượt 2: Dolmetsch). Không có nguồn cho quy ước chung "Ped. mới không có dấu sao = đổi bàn đạp"; viết thành quy ước của các bài trên site (khối abc của trang này, 10-bai-dau-tien bài 8; hồ sơ đã khóa 10-bai-dau-tien n83, bat-dau/lo-trinh-choi dựa vào câu này). Chữ cũ: "Một chữ *Ped.* mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại"; chữ mới: "Trong các bài trên site này, một chữ *Ped.* mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại".'
    luot_2: dung
    luot_2_nguon: [ "https://dev-dictionary.onmusic.org/terms/1020-damper_pedal", "https://music-encoding.org/guidelines/v4/attribute-classes/att.pedal.vis.html" ]
    luot_2_ghi_chu: "Từ điển: 'Ped.' là chỉ dẫn nhấn bàn đạp vang, dấu sao là chỗ nhả. MEI: kiểu pedstar, bounce (đổi bàn đạp) viết '* Ped.'; kiểu altpedstar bounce chỉ viết 'Ped.' (đúng quy ước 'một chữ Ped. mới = đổi'). Quy ước 'trên site này' là của site."
  - id: n19
    cau: "Ký hiệu bàn đạp dạng đường kẻ dưới khuông có vạch dọc hai đầu: nhấn ở đầu, nhả ở vạch cuối; chỗ gãy nhọn (∧) là nhả rồi nhấn lại ngay (đổi bàn đạp); vài ấn bản dùng nó cho nửa bàn đạp."
    loai: quy-tac
    ket_qua: da-sua
    ghi_chu: "chưa chắc: chưa mở nguồn cho ký hiệu đường kẻ bàn đạp. Review D4-gom: Dolmetsch (Chart of Musical Symbols): \"the pedal is depressed at the Ped. mark and kept pressed down until the right hand vertical line\", \"unless a half pedal or variable pedal mark (an inverted V) appears\"; OnMusic (pedal): nửa bàn đạp ghi bằng một đường có chỗ nhọn (\"spike\"), (damper pedal): nhấn hết, nhả nửa chừng rồi nhấn lại. Câu cũ \"mỗi chỗ gãy nhọn (∧) là một lần nhả rồi nhấn lại ngay\" trái hai nguồn. Chữ cũ: \"| Đường kẻ dưới khuông, có móc ở hai đầu | Nhấn ở đầu đường kẻ, nhả ở cuối; mỗi chỗ gãy nhọn (∧) là một lần nhả rồi nhấn lại ngay |\"; chữ mới: \"| Đường kẻ dưới khuông, có vạch dọc ở hai đầu | Nhấn ở đầu đường kẻ, giữ đến vạch dọc ở cuối thì nhả; chỗ gãy nhọn (∧) trên đường kẻ là nửa bàn đạp: nhả một phần rồi nhấn lại |\". Cần lượt 2 bổ sung. Người gom (D4-gom): lượt 2 bổ sung: nguồn không thống nhất về ∧ (MEI: bounce, tức nhả rồi nhấn lại; onmusic, MuseScore: nhả một phần). Trang ghi cả hai cách đọc, nghĩa đổi bàn đạp trước."
    luot_2: khong-chac
    nguon:
      - dolmetsch-symbols
      - onmusic-pedal
      - onmusic-damper
    luot_2_nguon: [ "https://music-encoding.org/guidelines/v4/attribute-classes/att.pedal.vis.html", "https://dev-dictionary.onmusic.org/terms/1020-damper_pedal", "https://musescore.org/en/node/27136" ]
    luot_2_ghi_chu: "Đường kẻ có vạch dọc hai đầu: MEI xác nhận. Còn dấu gãy nhọn: MEI gọi là 'bounce' (nhả hẳn rồi nhấn lại = đổi bàn đạp), từ điển onmusic mô tả half-pedal là nhấn hết, nhả một phần rồi nhấn lại, MuseScore thì nói ^ là 'partial release'. Các nguồn khác nhau về việc ∧ là đổi bàn đạp hay nửa bàn đạp; nên nói 'nhả rồi nhấn lại (đổi bàn đạp)' và để 'nhả một phần' cho ký hiệu half-pedal riêng."
