  - id: n41
    cau: "Bach: phần lớn nhạc phím của Bach viết cho harpsichord, clavichord và organ, những đàn không có bàn đạp vang (bàn đạp organ là bàn phím cho chân)."
    loai: lich-su
    ket_qua: dung
    ghi_chu: "chưa chắc: chưa mở nguồn bậc 1–2; cùng ý ở ../opus-zero/docs/piano/lich-su-dan.md dòng 35. Harpsichord/clavichord không có bàn đạp vang kiểu piano là kiến thức chuẩn nhưng chưa kèm nguồn. Review D4-gom: lượt 2 dung. Dolmetsch (defsp1): \"Ped.\" trên organ là \"notes are to be played on the pedals\" (bàn phím chân); Concise Oxford chỉ mô tả bàn đạp vang ở piano (mục piano). Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsp1.htm", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
