  - id: n31
    cau: "Bàn đạp nối (bàn đạp trễ, legato pedal, syncopated pedal): nhấn bàn đạp sau khi chơi hợp âm, nhả đúng lúc hợp âm mới vang rồi nhấn lại ngay; chân đi lệch nhịp với tay."
    loai: quy-tac
    ket_qua: null
    ghi_chu: 'chưa chắc: chưa mở nguồn bậc 1–2 (Banowetz, Rowland, Schnabel, Neuhaus chỉ có thông tin xuất bản, không đọc được nội dung). Wikipedia chỉ nói bàn đạp vang giúp nối nốt (legato); không có tên "syncopated pedal" hay các bước. Cùng tình trạng với n83, n84 của 10-bai-dau-tien.yml.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kỹ thuật bàn đạp nối (syncopated pedal) là chuẩn, nhưng không mở được nguồn bậc 2.
