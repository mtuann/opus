    luot_2_nguon: [ "https://www.dolmetsch.com/defsp1.htm", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Dolmetsch: 'Ped.' trên organ là phím chân (pedal). Oxford chỉ mô tả bàn đạp vang cho piano. Harpsichord, clavichord không có bàn đạp vang là kiến thức chuẩn."
