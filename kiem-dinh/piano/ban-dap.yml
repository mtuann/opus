    ghi_chu: 'Fitch: trên đàn cổ sustain ngắn nên tiếng bàn đạp tinh tế; trên đàn hiện đại làm đúng chữ "unacceptable" vì sustain dài. "Đàn Vienna" và "âm vực trầm nhẹ" là chi tiết thêm, cùng ý ở beethoven-anh-trang cũ; không kiểm riêng. Review D4-gom: Fitch (Pedalling the Moonlight Sonata): "the sustain was shorter than the pianos we have today"; trên đàn hiện đại làm đúng chữ thì "chaotic and immediately unacceptable". Không có nguồn cho "đàn Vienna", "âm vực trầm nhẹ": bỏ. Chữ cũ: "Trên đàn Vienna đầu thế kỷ 19, tiếng tắt nhanh và âm vực trầm nhẹ, nên…"; chữ mới: "Trên đàn thời Beethoven, tiếng ngân ngắn hơn đàn hiện đại, nên…".'
