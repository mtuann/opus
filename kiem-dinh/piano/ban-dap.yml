    ly_do: "n37 (review D4-gom): thêm tên direct, rhythmic pedal (Yamaha Hub)."
  - cu:
      - "Hoặc chỉ nhấn nông, bộ giảm âm vừa rời dây; hoặc khi đổi, chỉ nhả một nửa rồi nhấn lại: dây cao (ngắn, nhẹ) tắt, dây trầm (dài, nặng) còn ngân"
      - Giữ nốt trầm qua những thay đổi ở âm vực cao; làm mờ vừa phải
    moi:
      - Hoặc chỉ nhấn nông, bộ giảm âm chạm nhẹ dây; hoặc khi đổi, chỉ nhả một nửa rồi nhấn lại
      - Làm mờ vừa phải; thử giữ nốt trầm qua những thay đổi ở âm vực cao, nghe xem nốt trầm còn ngân không
    ly_do: n37 (da-sua, review D4-gom).
  - cu:
      - "Khi giai điệu đi bậc liền trong cùng một hòa âm, các nốt chồng lên nhau và nhòe, nhất là ở âm vực giữa và khi chơi chậm. Ở âm vực cao, tiếng tắt nhanh nên nhòe ít hơn. Không quy tắc nào thay được tai: nghe, rồi chọn đổi thêm, đạp nông hay nửa bàn đạp."
      - "Ở âm vực trầm, cùng một độ sâu bàn đạp nghe đục hơn nhiều: đổi thường hơn hoặc đạp nông."
    moi:
      - "Khi giai điệu đi bậc liền trong cùng một hòa âm, các nốt chồng lên nhau và nhòe, nhất là khi chơi chậm. Không quy tắc nào thay được tai: nghe, rồi chọn đổi thêm, đạp nông hay nửa bàn đạp."
      - Ở âm vực trầm, nghe kỹ xem có đục không; nếu có, đổi thường hơn hoặc đạp nông.
    ly_do: n40 (review D4-gom).
  - cu: "Những bản viết bằng hợp âm rải như Prelude Đô trưởng BWV 846 là trường hợp riêng: có người đổi bàn đạp mỗi ô nhịp theo hòa âm, có người chỉ giữ nốt bằng ngón đúng như bản nhạc ghi."
    moi: Với những bản viết bằng hợp âm rải như Prelude Đô trưởng BWV 846, bạn có thể đổi bàn đạp mỗi ô nhịp theo hòa âm, hoặc chỉ giữ nốt bằng ngón đúng như bản nhạc ghi; bài học Prelude bàn hai cách này.
    ly_do: n43 (review D4-gom).
  - cu: "Đàn fortepiano thời Mozart nhấc bộ giảm âm bằng cần gạt bằng đầu gối chứ chưa có bàn đạp; cây đàn Anton Walter của Mozart có loại cần gạt này. Mozart gần như không ghi bàn đạp vào bản nhạc, nhưng điều đó không có nghĩa là ông không dùng. Trên piano hiện đại:"
    moi: "Đàn fortepiano của Stein, mà Mozart rất khen năm 1777, nhấc bộ giảm âm bằng cần gạt bằng đầu gối; trong thư, Mozart viết rằng cơ cấu điều khiển bằng đầu gối của đàn này tốt hơn ở các đàn khác. Mozart ít ghi bàn đạp vào bản nhạc (chương 1 Sonata K. 545, chẳng hạn, không có ký hiệu bàn đạp nào), nhưng điều đó không có nghĩa là ông không dùng. Trên piano hiện đại:"
    ly_do: n44 (da-sua, review D4-gom).
  - cu:
      - 'Beethoven ghi bàn đạp thường xuyên hơn hẳn Mozart, và nhiều chỉ dẫn của ông là một phần của ý tưởng âm thanh. Ví dụ nổi tiếng nhất là chương 1 Sonata Ánh trăng (Op. 27 số 2): đầu chương, ông ghi senza sordino, "không có bộ giảm âm". Thời đó sordini là bộ giảm âm, nên chỉ dẫn này nghĩa là giữ bộ giảm âm nhấc lên, tức giữ bàn đạp vang, suốt chương.'
      - Trên đàn Vienna đầu thế kỷ 19, tiếng tắt nhanh và âm vực trầm nhẹ, nên giữ bàn đạp suốt chỉ tạo một lớp sương mỏng; trên đàn hiện đại, giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ thành một khối âm thanh hỗn độn. Nguyên văn chỉ dẫn, ba cách đọc thường gặp và cách tập bàn đạp cho chương này nằm ở bài học Sonata Ánh trăng, chương 1.
    moi:
      - 'Theo Concise Oxford Dictionary of Music, Beethoven là người đầu tiên tận dụng trọn vẹn bàn đạp vang. Một ví dụ nổi tiếng là chương 1 Sonata Ánh trăng (Op. 27 số 2): đầu chương, ông ghi senza sordino, "không có bộ giảm âm". Thời đó sordini là bộ giảm âm, nên chỉ dẫn này nghĩa là giữ bộ giảm âm nhấc lên, tức giữ bàn đạp vang, suốt chương.'
      - Trên đàn thời Beethoven, tiếng ngân ngắn hơn đàn hiện đại, nên giữ bàn đạp suốt chỉ tạo một lớp sương mỏng; trên đàn hiện đại, giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ thành một khối âm thanh hỗn độn. Nguyên văn chỉ dẫn, ba cách đọc thường gặp và cách tập bàn đạp cho chương này nằm ở bài học Sonata Ánh trăng, chương 1.
    ly_do: n46 (da-sua, review D4-gom).; n48 (da-sua, review D4-gom).
  - cu:
      - "Chopin tự ghi bàn đạp kỹ: Ped. và dấu sao xuất hiện thường xuyên trong bản thảo và các bản in đầu tiên của ông."
      - Bắt đầu từ ký hiệu của chính Chopin, trong một bản Urtext. Trong Wydanie Narodowe (bản Ekier), chỉ dẫn do người biên tập thêm vào được đặt trong ngoặc vuông; phương án khác cũng có nguồn gốc từ tác giả thì đặt trong ngoặc tròn.
    moi: Bắt đầu từ ký hiệu bàn đạp của chính Chopin, trong một bản Urtext. Trong Wydanie Narodowe (bản Ekier), chỉ dẫn do người biên tập thêm vào được đặt trong ngoặc vuông; phương án khác cũng có nguồn gốc từ tác giả thì đặt trong ngoặc tròn.
    ly_do: n49 (da-bo, review D4-gom).
  - cu:
      - Ông rất hiếm khi ghi una corda.
      - Đàn Pleyel mà ông ưa chuộng tắt tiếng nhanh hơn đàn hiện đại. Ở âm vực trầm hoặc khi giai điệu đi bậc liền, có thể phải đổi thêm, đạp nông hay rung bàn đạp. Điều chỉnh để giữ ý định của ông (nốt trầm ngân, hòa âm hòa quyện), không phải để xóa nó.
    moi: Trên đàn hiện đại, ở âm vực trầm hoặc khi giai điệu đi bậc liền, có thể phải đổi thêm, đạp nông hay rung bàn đạp. Điều chỉnh để giữ ý định của ông (nốt trầm ngân, hòa âm hòa quyện), không phải để xóa nó.
    ly_do: 'n53 (da-bo): Bỏ: không có nguồn.; n52 (da-sua): Câu cũ: "Ông rất hiếm khi ghi una corda. Đàn Pleyel mà ông ưa chuộng tắt tiếng nhanh hơn đàn hiện đại." Cả hai khẳng định không có nguồn nên bỏ (n53 da-bo cho câu una corda); giữ phần lời khuyên.'
  - cu:
      - "Debussy ghi rất ít bàn đạp và để việc ấy cho người chơi, nhưng bàn đạp là một phần màu âm thanh của ông: các hòa âm hòa vào nhau như những lớp màu nước, nốt trầm ngân dài dưới những hợp âm đổi phía trên, tiếng ngân được để tự tan."
      - "Nửa bàn đạp và đổi một phần: làm sạch âm vực cao mà nốt trầm vẫn ngân."
    moi:
      - "Khi chơi Debussy, hãy coi bàn đạp là một phần màu âm thanh: để các hòa âm hòa vào nhau như những lớp màu nước, nốt trầm ngân dài dưới những hợp âm đổi phía trên, tiếng ngân tự tan."
      - "Nửa bàn đạp và đổi một phần: thử làm sạch âm vực cao mà vẫn giữ nốt trầm."
    ly_do: n54 (review D4-gom).; n55 (review D4-gom).
  - cu:
      - Joseph Banowetz, The Pianist's Guide to Pedaling (Indiana University Press, 1985).
      - David Rowland, A History of Pianoforte Pedalling (Cambridge University Press, 1993).
      - Karl Ulrich Schnabel, Modern Technique of the Pedal.
      - "Heinrich Neuhaus, The Art of Piano Playing: chương về bàn đạp."
      - "Graham Fitch, Practising the Piano: bàn đạp trong Sonata Ánh trăng và gợi ý cho Voiles của Debussy."
    moi: "Graham Fitch, Practising the Piano: bàn đạp trong Sonata Ánh trăng."
    ly_do: "Mục Nguồn: bỏ các sách in chưa mở được nội dung (Banowetz, Rowland, Schnabel, Neuhaus); Fitch chỉ giữ phần Ánh trăng đã đối chiếu."
  - cu: 'Bản nhạc: IMSLP (tìm "Op.27 No.2" cho Beethoven); bản Urtext của G. Henle Verlag.'
    moi:
      - "Concise Oxford Dictionary of Music (qua Encyclopedia.com): các mục piano, corda, sordino."
      - "Encyclopaedia Britannica, Piano: ba bàn đạp."
      - 'Michael Clark, Baylor Piano Basics, chương 28: Pedal: bàn đạp nối ("play-up-down"), ba bàn đạp.'
      - 'Hannah Creviston, "Piano Pedagogy: Pedaling", Yamaha Music Educators Hub: bàn đạp nối, đạp theo nhịp, nửa bàn đạp, rung bàn đạp, đặt chân.'
      - "OnMusic Dictionary: damper pedal, pedal; Dolmetsch Online, Chart of Musical Symbols: ký hiệu bàn đạp."
      - "A. Schutz và cộng sự, \"Piano 'Forte Pedal' Analysis and Detection\", AES 124th Convention (2008): cộng hưởng giao cảm, nốt cao không có bộ giảm âm."
      - The Metropolitan Museum of Art, The Pianofortes of Bartolomeo Cristofori; Early Music Studio, Fortepiano after Johann Andreas Stein 1785 (thư của Mozart về cần đầu gối).
    ly_do: "Mục Nguồn: thay dòng IMSLP/Henle chung bằng Wikipedia Piano pedals, nguồn thật sự dùng để đối chiếu cấu tạo và lịch sử bàn đạp.; Mục Nguồn (review D4-gom): thay Wikipedia bằng các nguồn bậc 2 đã mở."
  - cu: "câu hỏi: Trên đàn cánh, bàn đạp una corda làm gì? | Hạ một dải nỉ vào giữa búa và dây | ✓ Dịch bộ máy sang bên để búa gõ ít dây hơn | Đưa búa lại gần dây | Hạ dải nỉ là bàn đạp tập của đàn đứng; đưa búa lại gần dây là bàn đạp trái của đàn đứng."
    moi: "câu hỏi: Trên đàn cánh, bàn đạp una corda làm gì? | Giữ nhấc bộ giảm âm của những phím đang giữ | ✓ Dịch bộ máy sang bên để búa gõ ít dây hơn | Đưa búa lại gần dây | Giữ nhấc bộ giảm âm của những phím đang giữ là việc của bàn đạp giữa (sostenuto); đưa búa lại gần dây là bàn đạp trái của đàn đứng."
