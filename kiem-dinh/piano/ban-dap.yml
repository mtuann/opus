  - id: ne-nocturnes
    bac: 2
    ten: "Wydanie Narodowe (Chopin National Edition, Jan Ekier), Nocturnes: phần bình giải (Commentaries)"
    link: https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf
nhan_dinh:
  - id: n1
    cau: "Bàn đạp phải là bàn đạp vang (damper, sustain): nhấc mọi bộ giảm âm khỏi dây, trên đàn đứng cũng vậy."
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: 'Wikipedia Piano pedals: sustain pedal "raises all the dampers off the strings". Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Britannica: bàn đạp phải nhấc mọi bộ giảm âm cho dây rung tự do; Oxford: nhấc 'cả dãy' bộ giảm âm. Đàn đứng cũng có (Oxford/Britannica nói chung cho piano)."
  - id: n2
    cau: "Bàn đạp trái trên đàn cánh là una corda (soft pedal): dịch bộ máy, ở âm vực mỗi nốt có ba dây búa chỉ gõ hai; tiếng nhỏ hơn, mềm và tối lại."
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: "Wikipedia: ở âm cao búa gõ hai dây thay vì ba; đổi màu tiếng, không chỉ giảm to. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/corda", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Nguồn bậc 2 nói đơn giản: Britannica 'búa gõ chỉ một dây', Oxford 'một dây không bị gõ' / 'một dây thay vì ba'. Cách nói 'ba dây gõ hai' của modern grand (chỉ ở âm vực ba dây) đúng về kỹ thuật nhưng không có trong nguồn mở được; hai nguồn không khớp chi tiết. Phần dịch bộ máy, tiếng nhỏ-mềm: khớp."
  - id: n3
    cau: Trên đàn cánh bàn đạp una corda dịch cả bàn phím và bộ máy sang phải, và búa gõ bằng phần nỉ chưa bị dây in rãnh.
    loai: dinh-nghia
    ket_qua: null
    ghi_chu: 'chưa chắc: Wikipedia không nói chiều dịch ("sang phải") và phần nỉ chưa in rãnh; chưa mở nguồn nhà chế tạo. Người giao quyết định bỏ hai chi tiết này hay xin nguồn.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.metmuseum.org/toah/hd/cris/hd_cris.htm" ]
    luot_2_ghi_chu: "Britannica, Met: bàn phím và bộ máy dịch ngang (Met: bàn phím của Cristofori trượt). Hướng 'sang phải' và chi tiết 'nỉ chưa bị dây in rãnh' không có trong nguồn mở được."
  - id: n4
    cau: Trên đàn đứng, bàn đạp trái đưa cả hàng búa lại gần dây; búa đi quãng ngắn hơn nên tiếng nhỏ hơn.
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: "Wikipedia: half-blow pedal, búa lại gần dây, quãng đánh ngắn hơn, nhỏ hơn. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Oxford (Pedals): trên đàn đứng, bàn đạp mềm đưa búa gần dây hơn (hoặc chèn nỉ). Búa đi quãng ngắn hơn nên nhỏ hơn: hệ quả cơ học."
  - id: n5
    cau: Trên đàn đứng, màu tiếng gần như không đổi và cảm giác phím hơi khác khi dùng bàn đạp trái.
    loai: dinh-nghia
    ket_qua: null
    ghi_chu: 'chưa chắc: Wikipedia chỉ nói bàn đạp trái đàn đứng không phải una corda thật; "màu tiếng gần như không đổi", "cảm giác phím" chưa có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn bậc 2 nói về màu tiếng, cảm giác phím của bàn đạp trái trên đàn đứng.
  - id: n6
    cau: "Bàn đạp giữa trên đàn cánh là bàn đạp giữ âm (sostenuto): chỉ giữ nhấc những bộ giảm âm đang được nhấc vào lúc nhấn bàn đạp, tức của những phím đang giữ."
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: "Wikipedia: sostenuto giữ các nốt đã đang được giữ phím khi nhấn. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.dolmetsch.com/musicalsymbols.htm" ]
    luot_2_ghi_chu: "Britannica: sostenuto giữ bộ giảm âm nhấc chỉ cho các phím đã nhấn khi bàn đạp được nhấn. Dolmetsch: bàn đạp giữa là bộ giảm âm chọn lọc."
  - id: n7
    cau: "Bàn đạp giữa của đàn đứng thường là bàn đạp tập: hạ một dải nỉ vào giữa búa và dây để giảm tiếng; một số đàn đứng có sostenuto thật, hoặc bàn đạp chỉ nhấc bộ giảm âm phần trầm."
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: 'Wikipedia: practice rail (dải nỉ giữa búa và dây); sostenuto thật hiếm ở đàn đứng; có thể chỉ điều khiển bộ giảm âm bass. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Vế "nhiều đàn gạt sang bên để khóa" không có trong nguồn (n8).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/piano", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Britannica: bàn đạp giữa là sostenuto trên đàn cánh và một số đàn đứng. Chi tiết 'bàn đạp tập hạ dải nỉ' và 'chỉ nhấc giảm âm phần trầm' không có trong nguồn mở được."
  - id: n8
    cau: Nhiều đàn đứng gạt bàn đạp tập sang bên để khóa.
    loai: dinh-nghia
    ket_qua: null
    ghi_chu: "chưa chắc: Wikipedia không nói; chưa có nguồn."
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn bậc 2 về cơ chế khóa bàn đạp tập.
  - id: n9
    cau: Tên una corda ("một dây") có từ thời đàn của Cristofori, khi bộ máy dịch sang bên để búa chỉ gõ một dây; trong Concerto số 4, Beethoven còn ghi cả una corda, due corde và tre corde.
    loai: lich-su
    nguon:
      - wiki-pedals
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "có từ thời bộ máy dịch được tới mức búa chỉ gõ một dây". Thêm tên Cristofori (Wikipedia: trên đàn Cristofori bộ máy dịch để búa gõ một dây thay vì hai) cho rõ nghĩa. Beethoven Concerto số 4: Wikipedia ghi una corda, due corde, tre corde. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.metmuseum.org/toah/hd/cris/hd_cris.htm" ]
    luot_2_ghi_chu: "Met: hai đàn Cristofori (Rome 1722, Leipzig 1726) có bàn phím trượt để mỗi nốt chỉ gõ một trong hai dây: khớp với phần 'búa chỉ gõ một dây'. Không xác nhận được cụm 'tên una corda có từ thời Cristofori', và Concerto số 4 của Beethoven ghi una corda/due corde/tre corde (chỉ thấy ở Wikipedia)."
  - id: n10
    cau: "Piano điện: bàn đạp đi kèm nhiều đàn là loại công tắc (bật, tắt, không nửa bàn đạp); loại tốt hơn có cảm biến liên tục đọc được độ sâu nên dùng được nửa bàn đạp."
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: 'Wikipedia: trên piano điện bàn đạp "usually a simple switch", loại tinh vi hơn "can detect and transmit a signal for half-pedaling". Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được nguồn bậc 2 về bàn đạp piano điện (loại công tắc, cảm biến liên tục).
  - id: n11
    cau: Nhiều piano điện có bộ ba bàn đạp gắn vào chân đàn hoặc bán rời, bàn đạp giữa thường là sostenuto, bàn đạp trái làm tiếng nhỏ và tối đi; đàn tốt còn mô phỏng cộng hưởng dây khi nhấn bàn đạp.
    loai: dinh-nghia
    ket_qua: null
    ghi_chu: "chưa chắc: chưa có nguồn bậc 1–2 cho cấu hình bàn đạp piano điện và tính năng mô phỏng cộng hưởng dây (hãng sản xuất). Cũng dựa vào ../opus-zero/docs/piano/chon-dan.md, chưa chuyển."
    luot_2: khong-chac
    luot_2_ghi_chu: Như n10.
  - id: n12
    cau: Nếu định học đến trình độ trung cấp, bàn đạp liên tục là khoản đáng đầu tư.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên mua đàn; không có sự kiện sức khỏe. Khớp ../opus-zero/docs/piano/chon-dan.md (bàn đạp vang loại liên tục; nâng cấp ở Grade 4–5).
  - id: n13
    cau: Mỗi nốt có một bộ giảm âm bọc nỉ nằm trên dây; bấm phím thì bộ giảm âm nhấc lên, nhả phím thì rơi xuống chặn dây.
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: Cơ chế cơ bản của bộ giảm âm theo Wikipedia (pedal nhấc tất cả bộ giảm âm khỏi dây); cùng nội dung ../opus-zero/docs/piano/lich-su-dan.md dòng 98. Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano", "https://www.britannica.com/art/piano" ]
    luot_2_ghi_chu: "Oxford/Britannica: bàn đạp vang nhấc cả dãy bộ giảm âm khỏi dây; ngụ ý mỗi dây có bộ giảm âm hạ xuống khi nhả phím. Chi tiết bọc nỉ là kiến thức chuẩn."
  - id: n14
    cau: "Bàn đạp vang nhấc tất cả bộ giảm âm cùng lúc; nốt ngân sau khi nhả phím, mọi dây khác cũng rung tự do: cộng hưởng giao cảm. Dây trùng tần số với một bồi âm của nốt đang vang rung theo, tạo quầng âm ấm."
    loai: dinh-nghia
    nguon:
      - wiki-pedals
    ket_qua: dung
    ghi_chu: 'Wikipedia: nhấn bàn đạp "makes every string on the piano a sympathetic string". Cơ chế bồi âm trùng tần số là vật lý chuẩn, cũng ở nhac-ly/am-hoc (đã chuyển). Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Phần bàn đạp nhấc mọi giảm âm: khớp. Phần cộng hưởng giao cảm (dây khác rung theo bồi âm) là vật lý chuẩn nhưng tôi không mở được nguồn bậc 2."
  - id: n15
    cau: "Các nốt cao nhất (cỡ quãng tám trên cùng, tùy đàn) không có bộ giảm âm: dây ngắn, tự tắt nhanh."
    loai: so-lieu
    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở nguồn nhà chế tạo cho số nốt không có bộ giảm âm; kết quả tìm kiếm chỉ có trang hỗ trợ piano điện (Roland, Kawai) nói đúng hiện tượng ở đàn điện."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: Oxford không nói nốt nào không có bộ giảm âm; không mở được nguồn cho 'cỡ quãng tám trên cùng'.
  - id: n16
    cau: Độ sâu bàn đạp quyết định bộ giảm âm nhấc cao hay thấp; nhả nhanh hay chậm quyết định tiếng tắt gọn hay có đuôi; nghệ thuật nằm ở những chuyển động nhỏ quanh điểm bộ giảm âm vừa rời dây.
    loai: quy-tac
    ket_qua: null
    ghi_chu: "chưa chắc: Wikipedia chỉ nhắc nửa bàn đạp ở piano điện; chưa có nguồn bậc 1–2 cho mô tả độ sâu, chuyển động nhỏ."
    luot_2: khong-chac
    luot_2_ghi_chu: "Quy tắc kỹ thuật bàn đạp nửa độ: không có nguồn bậc 2 mở được. Không có hại."
  - id: n17
    cau: "Thử nghiệm nghe cộng hưởng giao cảm: bấm câm hợp âm Đô4–Mi4–Sol4, đánh mạnh rồi nhả ngay Đô2, sẽ nghe hợp âm vang khẽ lên."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Bài thử tại nhà, không khẳng định số liệu. (Cơ chế: n14.)"
  - id: n18
    cau: "Ký hiệu Ped.: nhấn bàn đạp vang; dấu sao ✱ là chỗ nhả; một chữ Ped. mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại."
    loai: quy-tac
    nguon:
      - wiki-glossary
    ket_qua: null
    ghi_chu: 'chưa chắc: Wikipedia glossary xác nhận "Ped." = nhấn bàn đạp vang; chưa mở nguồn cho dấu sao và quy ước "Ped. mới = đổi". Trùng với n83, n84 của kiem-dinh/piano/10-bai-dau-tien.yml (cũng chưa chắc): trang Bàn đạp là nơi chuẩn bị nguồn cho cả hai.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsp1.htm", "https://www.dolmetsch.com/musicalsymbols.htm" ]
    luot_2_ghi_chu: "Dolmetsch: 'Ped.' = nhấn bàn đạp phải (damper); '*' = nhả. Quy ước 'Ped. mới không có * trước' nghĩa là nhả và nhấn lại là quy ước ghi bản nhạc chuẩn, nguồn không nói rõ."
  - id: n19
    cau: "Đường kẻ dưới khuông có móc ở hai đầu: nhấn ở đầu, nhả ở cuối; mỗi chỗ gãy nhọn (∧) là một lần nhả rồi nhấn lại ngay."
    loai: quy-tac
    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở nguồn cho ký hiệu đường kẻ bàn đạp."
    luot_2: khong-chac
    luot_2_ghi_chu: "Ký hiệu đường kẻ có móc: Dolmetsch chỉ nhắc 'đường dọc bên phải' cho sostenuto; không xác nhận được ký hiệu đường gãy nhọn."
  - id: n20
    cau: "con pedale, con Ped.: dùng bàn đạp (người chơi tự quyết chỗ đổi); senza pedale, senza Ped.: không dùng bàn đạp."
    loai: quy-tac
    ket_qua: null
    ghi_chu: "chưa chắc: Wikipedia glossary không có con pedale/senza pedale; nghĩa đen tiếng Ý, nhưng chưa có nguồn từ điển."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.dolmetsch.com/defsp1.htm" ]
    luot_2_ghi_chu: "Dolmetsch: pedale (Ý) = bàn đạp nhấc giảm âm; không thấy mục 'con/senza pedale' trong phần đọc được."
  - id: n21
    cau: "Ped. simile: tiếp tục đạp như các ô trước."
    loai: quy-tac
    nguon:
      - wiki-glossary
    ket_qua: dung
    ghi_chu: 'Glossary: simile = "continue applying the preceding directive … to the following passage". Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/simile" ]
