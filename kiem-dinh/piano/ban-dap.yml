    ghi_chu: "chưa chắc: chưa mở nguồn; trang bài học ../opus-zero/docs/piano/tac-pham/bach-prelude-do.md (mục Giữ nốt và bàn đạp, dòng 206–207) nói cùng hai lựa chọn. Review D4-gom: không có nguồn cho \"có người … có người …\"; viết thành lời khuyên và câu về site (bài học Prelude ở ../opus-zero/docs/piano/tac-pham/bach-prelude-do.md, mục Giữ nốt và bàn đạp, dòng 206–207, bàn hai cách này). Chữ cũ: \"Những bản viết bằng hợp âm rải như [Prelude…] là trường hợp riêng: có người đổi bàn đạp mỗi ô nhịp theo hòa âm, có người chỉ giữ nốt bằng ngón đúng như bản nhạc ghi.\"; chữ mới: \"Với những bản viết bằng hợp âm rải như [Prelude…], bạn có thể đổi bàn đạp mỗi ô nhịp theo hòa âm, hoặc chỉ giữ nốt bằng ngón đúng như bản nhạc ghi; bài học Prelude bàn hai cách này.\""
    luot_2: khong-chac
