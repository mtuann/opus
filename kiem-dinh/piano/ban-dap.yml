    luot_2_ghi_chu: "Oxford: una corda = dùng bàn đạp mềm; tre corde, tutte le corde hủy una corda. Dolmetsch: u.c. = una corda. 't.c.' không thấy trong nguồn mở được nhưng là quy ước chuẩn."
