    ghi_chu: 'Glossary: una corda = nhấn bàn đạp mềm; tre corde (tc) = nhả. Wikipedia Piano pedals ghi Beethoven Op. 106 "due ed allora tutte le corde" (tutte le corde = mọi dây). Nguồn bậc 3 (Wikipedia), chấp nhận vì rủi ro thấp; người giao có thể xin lượt 2 đối chiếu thêm. Khớp yêu cầu của kiem-dinh/nhac-ly/14-ky-hieu-bieu-dien.yml (bảng ký hiệu có u.c., t.c.).'
