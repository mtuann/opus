    ket_qua: dung
    ghi_chu: 'Fitch: "Senza sordini … without mutes, the dampers are lifted off the strings and the sustain pedal is effectively held down." Wikipedia Piano pedals không nhắc, nhưng Fitch đủ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino" ]
    luot_2_ghi_chu: "Oxford: sordini trên piano = bộ giảm âm; senza sordini = không có bộ giảm âm, tức bàn đạp vang đạp xuống."
  - id: n26
    cau: "con sordino (về sau), mit Verschiebung (Schumann): thường chỉ bàn đạp una corda."
    loai: quy-tac
    ket_qua: da-bo
    ghi_chu: 'Bỏ hàng: Wikipedia glossary chỉ nói "con sordino" là dạng sai của con sordina (mute) và không có "mit Verschiebung" (Schumann); không nguồn nào xác nhận nghĩa "una corda". Câu "Hai dòng cuối là một cái bẫy…" đã sửa (n27). Hệ quả cho dữ liệu: src/data/thuat-ngu.yml còn mục con-sordino-con-sordina ("Ở một số nhà soạn nhạc về sau (như Scriabin): dùng bàn đạp trái una corda") và ghi "Xem Bàn đạp: ký hiệu"; trang không còn nói điều đó: người giao phải sửa hoặc bỏ mục này (không sửa ở đây). Review D4-gom: đã kiểm trang không còn chữ ấy (bảng ký hiệu không có Sost. Ped., con sordino, mit Verschiebung; không còn câu về ký hiệu của người biên tập trong bản in phổ thông và về una corda của Chopin). Ghi thêm cho n53: Wydanie Narodowe (Nocturnes, Source Commentary tr. 44) có câu "Indications for the use of the left pedal — extremely rare in Chopin"; có thể khôi phục câu ở lần sau nếu cần.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino" ]
    luot_2_ghi_chu: "Oxford: con sordini = để giảm âm vào (bộ giảm âm hạ xuống, tức nhả bàn đạp vang), nên 'con sordino' thường là hủy senza sordino, không phải 'thường chỉ una corda'. Cách dùng 'con sordino' hay 'mit Verschiebung' của Schumann cho bàn đạp trái không xác nhận được ở nguồn mở được."
  - id: n27
    cau: Chữ senza sordino của Beethoven là chỉ dẫn về bộ giảm âm (bàn đạp vang), không phải bàn đạp trái.
