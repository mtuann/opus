  - id: n63
    cau: "Hình sau bảng \"Ký hiệu\" (::hinh{ten=\"ky-hieu-ban-dap\"}) vẽ một khuông hai ô nhịp và dưới đó hai cách ghi cùng một cách đạp: kiểu chữ (Ped. ở đầu ô 1, Ped. mới ở đầu ô 2 không có dấu sao trước đó, dấu sao ở cuối ô 2) và kiểu đường kẻ (vạch dọc ở đầu, chỗ gãy nhọn ∧ ở đầu ô 2, vạch dọc ở cuối); dóng thẳng hàng với ba chữ \"nhấn\", \"nhả rồi nhấn lại (đổi bàn đạp)\", \"nhả\"."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 07/11/2026: HTML trong dist/<trang>/index.html), module dựng hình và ảnh chụp 360 và 1280 px. Hình tĩnh src/components/hinh/ky-hieu-ban-dap.html. Khớp hai dòng đầu của bảng: \"Nhấn bàn đạp vang ở Ped., nhả ở dấu sao … một chữ Ped. mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại\" (chú thích giữ \"như trong các bài trên site này\") và \"Nhấn ở đầu đường kẻ, giữ đến vạch dọc ở cuối thì nhả; chỗ gãy nhọn (∧) … là nhả rồi nhấn lại ngay (đổi bàn đạp)\". Nghĩa \"nửa bàn đạp\" của ∧ ở vài ấn bản không vẽ. Khuông không có nốt."
