  - id: n30
    cau: "Tìm điểm bắt: bấm lặp một nốt staccato trong khi nhấn bàn đạp thật chậm; tới một độ sâu nốt bắt đầu ngân sau khi nhả phím, đó là điểm bộ giảm âm rời dây."
