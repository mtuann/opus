    ghi_chu: "chưa chắc: chưa mở nguồn bậc 1–2. Cùng ý ở ../opus-zero/docs/piano/lich-su-dan.md dòng 39 (Stein, Walter, cần đầu gối). Hồ sơ lo-trinh.yml đã khóa dựa trên đúng câu này (mục Mozart): giữ nguyên chữ khi chuyển. Review D4-gom: Early Music Studio (Fortepiano after J. A. Stein 1785, mở 28/10/2026): cơ cấu \"actuated by a knee-lever, which elevates the rack of dampers all at once\"; thư Mozart: \"The device too, which you work with your knee is better than on other instruments.\" Met (Viennese instruments): Stein \"credited with introducing knee-lever controls for the dampers\". Bản Mutopia K. 545 chương 1 (theo IMSLP): không có ký hiệu bàn đạp nào. Không có nguồn cho \"chứ chưa có bàn đạp\" (Yamaha ghi đàn của Mozart còn có pedal-board) và \"đàn Walter của Mozart có loại cần gạt này\": bỏ. Chữ cũ: \"Đàn fortepiano thời Mozart nhấc bộ giảm âm bằng **cần gạt bằng đầu gối** chứ chưa có bàn đạp; cây đàn Anton Walter của Mozart có loại cần gạt này. Mozart gần như không ghi bàn đạp vào bản nhạc, nhưng …\"; chữ mới: \"Đàn fortepiano của Stein, mà Mozart rất khen năm 1777, nhấc bộ giảm âm bằng **cần gạt bằng đầu gối**; trong thư, Mozart viết rằng cơ cấu điều khiển bằng đầu gối của đàn này tốt hơn ở các đàn khác. Mozart ít ghi bàn đạp vào bản nhạc (chương 1 Sonata K. 545, chẳng hạn, không có ký hiệu bàn đạp nào), nhưng …\". Hồ sơ đã khóa lo-trinh (n24) chỉ cần \"tiết kiệm với Mozart\": còn khớp. Cần lượt 2 bổ sung."
