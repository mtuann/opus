  - id: n43
    cau: "Với những bản viết bằng hợp âm rải như Prelude Đô trưởng BWV 846, có thể đổi bàn đạp mỗi ô nhịp theo hòa âm, hoặc chỉ giữ nốt bằng ngón đúng như bản nhạc ghi; bài học Prelude bàn hai cách này."
