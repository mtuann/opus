    cau: Ở âm vực trầm, nghe kỹ xem có đục không; nếu có, đổi thường hơn hoặc đạp nông.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "chưa chắc: chưa có nguồn bậc 1–2 cho hai nhận xét âm học này. Review D4-gom: không có nguồn bậc 1–2 cho hai nhận xét âm học: bỏ vế \"Ở âm vực cao tiếng tắt nhanh nên nhòe ít hơn\" và \"cùng một độ sâu bàn đạp nghe đục hơn nhiều\"; giữ thành lời khuyên nghe. Chữ cũ: \"…nhất là ở âm vực giữa và khi chơi chậm. Ở âm vực cao, tiếng tắt nhanh nên nhòe ít hơn.\" và \"- **Ở âm vực trầm**, cùng một độ sâu bàn đạp nghe đục hơn nhiều: đổi thường hơn hoặc đạp nông.\"; chữ mới: \"…nhất là khi chơi chậm.\" và \"- **Ở âm vực trầm**, nghe kỹ xem có đục không; nếu có, đổi thường hơn hoặc đạp nông.\""
