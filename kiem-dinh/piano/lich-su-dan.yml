doi_chu:
  - cu: "Trước năm 1700, người chơi nhạc phím có ba lựa chọn chính. Không cái nào làm được điều mà piano làm được: to hay nhỏ tùy theo lực ngón tay, mà vẫn đủ vang cho một căn phòng lớn."
    moi: Trước khi có piano, người chơi nhạc phím dùng những nhạc cụ như ba loại dưới đây. Không loại nào vừa to hay nhỏ tùy theo lực ngón tay, vừa đủ vang cho một căn phòng lớn.
    ly_do: 'n7 (da-sua, review D4-gom): "ba lựa chọn chính" không có nguồn; Met: harpsichord không đổi to nhỏ theo lực ngón, clavichord quá nhỏ tiếng.'
  - cu: Rung nhẹ ngón trên phím tạo tiếng rung (Bebung). Nhạc cụ để tập và chơi ở nhà; C. P. E. Bach rất yêu thích nó
    moi: Rung nhẹ ngón trên phím tạo tiếng rung (Bebung). Tiếng quá nhỏ để chơi hòa nhạc, nên chủ yếu dùng để tập riêng; các sonata và fantasia của C. P. E. Bach rất hợp với tiếng của nó
    ly_do: 'n3 (da-sua, review D4-gom): ODM (Clavichord): chủ yếu để tập riêng, quá nhỏ tiếng cho hòa nhạc; không nguồn cho "rất yêu thích".'
  - cu: Đổi màu tiếng bằng các bộ dây (register) và hai tầng phím. Nhạc cụ phím chính của thời Baroque
    moi: Đổi màu tiếng bằng các bộ dây (register) và hai tầng phím. Một trong những nhạc cụ phím quan trọng nhất của thời Baroque
    ly_do: 'n4 (da-sua): Câu cũ: "Nhạc cụ phím chính". Britannica: "one of the most important keyboard instruments in European music from the 16th through the first half of the 18th century"; không nói là nhạc cụ chính duy nhất.'
  - cu: Ước mơ của người chơi thế kỷ 17 là một nhạc cụ có sức vang của harpsichord nhưng lại "nói" theo ngón tay như clavichord.
    ly_do: 'n7 (da-sua, review D4-gom): bỏ câu "Ước mơ của người chơi thế kỷ 17": không có nguồn.'
  - cu:
      - Bartolomeo Cristofori (1655–1731) phụ trách nhạc cụ cho hoàng tử Ferdinando de' Medici ở Florence. Bản kiểm kê nhạc cụ nhà Medici năm 1700 đã ghi một chiếc arpicimbalo "mới được Bartolomeo Cristofori phát minh", có búa và bộ giảm âm, âm vực bốn quãng tám. Vì vậy năm 1700 thường được coi là năm sinh của piano.
      - 'Năm 1711, nhà văn Scipione Maffei viết một bài báo nhiệt tình về chiếc đàn, gọi nó là gravicembalo col piano, e forte: "harpsichord có nhỏ và có to". Từ đó sinh ra hai chữ pianoforte và piano.'
    moi:
      - Bartolomeo Cristofori (1655–1732) phụ trách nhạc cụ cho hoàng tử Ferdinando de' Medici ở Florence. Bản kiểm kê nhạc cụ nhà Medici năm 1700 đã ghi một chiếc arpicimbalo "mới được Bartolomeo Cristofori phát minh", có búa và bộ giảm âm, âm vực bốn quãng tám. Vì vậy năm 1700 thường được coi là năm sinh của piano.
      - 'Năm 1711, nhà văn Scipione Maffei viết bài mô tả chiếc đàn, gọi nó là gravicembalo col piano, e forte: "harpsichord có nhỏ và có to". Từ đó sinh ra hai chữ pianoforte và piano.'
    ly_do: 'n9 (da-sua): Dữ liệu đã khóa (src/data/nha-soan-nhac.yml, hồ sơ du-lieu/nha-soan-nhac/cristofori.yml n3) ghi năm mất 1732 theo lịch hiện hành (27/1/1732; giấy tờ Florence ghi 1731 vì năm Florence bắt đầu ngày 25/3); hồ sơ ấy dặn trang lịch sử đàn sửa theo. Met viết 1731 (cũng là tên bài Met ở mục Nguồn, giữ nguyên vì là tên bài).; n10 (da-sua): Câu cũ: "viết một bài báo nhiệt tình". Met chỉ nói Maffei (nhà thơ, nhà báo) mô tả chiếc đàn năm 1711 và gọi nó là "gravicembalo col piano, e forte"; không nêu tên báo, không nói "nhiệt tình".'
  - cu:
      - Bài báo của Maffei được dịch sang tiếng Đức năm 1725. Đọc nó, thợ làm đàn Gottfried Silbermann bắt đầu làm piano theo thiết kế của Cristofori từ những năm 1730. J. S. Bach chê một cây đàn Silbermann đời đầu vì phím nặng và âm cao yếu; về sau ông khen những cây đã cải tiến và còn giúp bán đàn Silbermann. Vua Frederick Đại đế nước Phổ mua nhiều cây đàn này, và Bach đã chơi chúng khi đến cung điện của nhà vua ở Potsdam năm 1747, chuyến thăm sinh ra tác phẩm Musikalisches Opfer (Lễ vật âm nhạc).
      - Dù vậy, phần lớn nhạc phím của Bach được viết cho harpsichord, clavichord hoặc organ. Chơi Bach trên piano là một lựa chọn diễn giải, không có gì sai, nhưng nên biết điều đó khi quyết định dùng bàn đạp hay chơi luyến (xem Bàn đạp).
    moi:
      - Bài viết của Maffei được dịch sang tiếng Đức năm 1725. Đọc nó, thợ làm đàn Gottfried Silbermann bắt đầu làm piano theo thiết kế của Cristofori từ những năm 1730. J. S. Bach chê một cây đàn Silbermann đời đầu vì phím nặng và âm cao yếu; về sau ông khen những cây đã cải tiến và còn giúp bán đàn Silbermann. Vua Frederick Đại đế nước Phổ mua nhiều cây đàn này, và Bach đã chơi chúng khi đến cung điện của nhà vua ở Potsdam năm 1747, chuyến thăm sinh ra tác phẩm Musikalisches Opfer (Lễ vật âm nhạc).
      - "Dù vậy, Bach viết nhạc phím cho những nhạc cụ của thời ông: harpsichord, clavichord và organ. Trang bìa bản in Biến khúc Goldberg (1741), chẳng hạn, ghi rõ bản nhạc viết cho harpsichord hai tầng phím (Clavicimbal mit 2 Manualen). Chơi Bach trên piano là một lựa chọn diễn giải, không có gì sai, nhưng nên biết điều đó khi quyết định dùng bàn đạp hay chơi luyến (xem Bàn đạp)."
    ly_do: 'n14 (da-sua): Thống nhất với n10: nguồn (Met) gọi đó là bài mô tả; bản dịch in trong Critica musica của Mattheson năm 1725.; n16 (da-sua, review D4-gom): "phần lớn" không có nguồn đếm; thay bằng ví dụ có nguồn bậc 1 (IMSLP, BWV 988: vors Clavicimbal mit 2 Manualen, 1741).'
  - cu: "Bộ máy Vienna (Prellmechanik). Người đặt nền móng là Johann Andreas Stein (1728–1792) ở Augsburg; con gái ông, Nannette Streicher, chuyển xưởng đến Vienna năm 1794, và Anton Walter làm đàn theo mẫu này ở Vienna. Phím nông và nhẹ, búa nhỏ, tiếng trong và tắt nhanh. Stein được cho là người đưa vào cần đầu gối (knee lever): đẩy đầu gối lên để nhấc bộ giảm âm, tiền thân của bàn đạp vang."
    moi: "Bộ máy Vienna (Prellmechanik). Người đặt nền móng là Johann Andreas Stein (1728–1792) ở Augsburg; con gái ông, Nannette Streicher, chuyển xưởng đến Vienna năm 1794, và Anton Walter làm đàn theo mẫu này ở Vienna. Bộ máy nhẹ và đơn giản, búa bọc da, tiếng nhẹ và thanh hơn đàn hiện đại. Stein được cho là người đưa vào cần đầu gối (knee lever): đẩy đầu gối lên để nhấc bộ giảm âm, tiền thân của bàn đạp vang."
    ly_do: 'n19 (da-sua, review D4-gom): PTG (bộ máy Vienna nhẹ, đơn giản; tiếng nhẹ, thanh hơn đàn hiện đại), Met 503049 (búa bọc da); không nguồn cho "phím nông", "tắt nhanh".'
  - cu:
      - Bộ máy Anh. Ở London, Johannes Zumpe làm piano vuông (square piano) nhỏ gọn từ những năm 1760, loại đàn gia đình rất được ưa chuộng. Các xưởng London, nổi bật là Broadwood, làm đàn cánh với bộ máy nặng hơn, tiếng to và ngân hơn đàn Vienna.
      - Cả hai loại đàn thời này đều có âm vực khoảng năm quãng tám. Mozart viết nhạc phím trong khoảng FF–f''' (Fa1–Fa6) suốt đời mình.
    moi:
      - Bộ máy Anh. Ở London, Johannes Zumpe làm piano vuông (square piano) nhỏ gọn từ những năm 1760, loại đàn gia đình rất được ưa chuộng. Các xưởng London, nổi bật là Broadwood, làm đàn cánh với bộ máy Anh (English action), khác hẳn bộ máy Vienna.
      - Cả hai loại đàn thời này đều có âm vực khoảng năm quãng tám; đàn Stein, chẳng hạn, chạy từ FF đến f''' (Fa1–Fa6).
    ly_do: "n23 (da-sua): Câu cũ: \"bộ máy nặng hơn, tiếng to và ngân hơn đàn Vienna\". Beethoven-Haus: Broadwood 1817 dùng bộ máy \"push-tongue\" gọi là English action, Graf dùng Prellzungen, hai đàn \"khác nhau chủ yếu ở bộ máy\"; chỉ có nhận xét chung \"more overtone, quieter, finer and less voluminous, but very vocal\" cho cả hai, không nói đàn Anh to hơn. Met cũng không so sánh.; n24 (da-sua): Câu cũ: \"Mozart viết nhạc phím trong khoảng FF–f''' (Fa1–Fa6) suốt đời mình\". Không nguồn nào mở được nói điều này (Met: chuẩn cuối thế kỷ 18 là năm quãng tám, 61 phím; fortepiano.eu: bản sao đàn Stein 1788 có âm vực FF–f3). Chuyển thành âm vực của đàn Stein, có nguồn."
