nhan_dinh:
  - id: n1
    cau: Cây đàn bạn tập hôm nay là kết quả của hơn ba thế kỷ cải tiến.
    loai: lich-su
    nguon:
      - met-crist
    ket_qua: dung
    ghi_chu: 'Met: bản kiểm kê năm 1700 ghi chiếc đàn có búa của Cristofori; từ 1700 đến nay hơn ba thế kỷ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/art/collection/search/501788" ]
    luot_2_ghi_chu: "Cristofori làm đàn từ khoảng 1700; Met: bản 1720 còn lại; hơn ba thế kỷ là hợp lý."
  - id: n2
    cau: 'Clavichord: một lưỡi đồng nhỏ (tangent) gõ vào dây rồi nằm lại trên dây cho đến khi nhả phím; to nhỏ theo lực ngón nhưng rất nhỏ tiếng; rung nhẹ ngón trên phím tạo tiếng rung (Bebung).'
    loai: dinh-nghia
    nguon:
      - brit-clav
      - met-crist
    ket_qua: dung
    ghi_chu: 'Britannica: tangent chạm dây khi nhấn phím và rời dây khi nhả phím (suy ra nằm lại khi giữ); "can achieve dynamic variation ... by the player''s touch alone"; "vibrato, or bebung, if finger pressure on the key is varied"; tiếng "silvery and soft". Met: clavichord quá nhỏ cho hòa tấu và hòa nhạc.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/clavichord" ]
    luot_2_ghi_chu: "ODM: clavichord rất nhỏ tiếng, 'bridge' chạm dây khi nhấn phím (tức tangent), không đủ cho hòa nhạc. Riêng Bebung không có trên trang đã mở; mô tả chuẩn, không mâu thuẫn."
  - id: n3
    cau: Clavichord là nhạc cụ để tập và chơi ở nhà; C. P. E. Bach rất yêu thích nó.
    loai: lich-su
    nguon:
      - brit-clav
    ket_qua: null
    ghi_chu: 'chưa chắc: Britannica chỉ nói tiếng clavichord hợp nhất với nhạc thân mật như sonata và fantasia của C. P. E. Bach; không nói "tập và chơi ở nhà" hay "rất yêu thích". Chưa mở nguồn nào khác.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/clavichord" ]
    luot_2_ghi_chu: ODM xác nhận clavichord quá nhỏ tiếng để biểu diễn hòa nhạc; phần 'C. P. E. Bach rất yêu thích' và 'tập ở nhà' không có trên trang nào đã mở.
  - id: n4
    cau: 'Harpsichord: miếng gảy gắn trên con đẩy (jack) gảy dây; không to nhỏ theo lực ngón; là một trong những nhạc cụ phím quan trọng nhất của thời Baroque.'
    loai: dinh-nghia
    nguon:
      - brit-harp
      - met-crist
    ket_qua: da-sua
    ghi_chu: 'Britannica: "strings are set in vibration by plucking"; Met: "jack and quill action", "lacked the ability to respond to the strength of the player''s touch". Câu "nhạc cụ phím chính" sửa thành "một trong những ... quan trọng nhất" theo Britannica.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/harpsichord" ]
    luot_2_ghi_chu: "Britannica: harpsichord gảy dây, một trong những nhạc cụ phím quan trọng nhất từ thế kỷ 16 đến nửa đầu thế kỷ 18. Chi tiết jack/không đổi to nhỏ theo lực không có trên trang; mô tả chuẩn."
  - id: n5
    cau: Harpsichord đổi màu tiếng bằng các bộ dây (register) và hai tầng phím.
    loai: dinh-nghia
    ket_qua: null
    ghi_chu: 'chưa chắc: Britannica và Met (đoạn đã mở) không nêu register hay hai tầng phím; Dolmetsch không mở được mục Harpsichord (trang bị cắt).'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được trang nào nói về register và hai tầng phím của harpsichord (Met chỉ nói arpicimbalo 1700 có hai tầng phím); mô tả quen thuộc nhưng chưa có nguồn bậc 2.
  - id: n6
    cau: 'Organ: hơi thổi qua ống; tiếng giữ nguyên chừng nào còn giữ phím; đổi màu bằng các bộ ống.'
    loai: dinh-nghia
    ket_qua: null
    ghi_chu: 'chưa chắc: chưa mở nguồn nào về organ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Trang Britannica về organ không mở được; chưa có nguồn bậc 2 cho định nghĩa này.
  - id: n7
    cau: Trước năm 1700, người chơi nhạc phím có ba lựa chọn chính (clavichord, harpsichord, organ); không cái nào làm được điều piano làm được; ước mơ của người chơi thế kỷ 17 là nhạc cụ có sức vang của harpsichord mà "nói" theo ngón như clavichord.
    loai: lich-su
    nguon:
      - met-crist
    ket_qua: null
    ghi_chu: 'chưa chắc: Met nói harpsichord to và sáng nhưng không đổi theo lực ngón, clavichord đổi theo lực ngón nhưng quá nhỏ; "ba lựa chọn chính" và "ước mơ thế kỷ 17" là lời diễn giải của trang, chưa có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu mang tính dẫn dắt/văn phong ('ước mơ của người chơi thế kỷ 17'); không nguồn nào đã mở xác nhận hay bác bỏ.
  - id: n8
    cau: Bản kiểm kê nhạc cụ nhà Medici năm 1700 ghi một chiếc arpicimbalo "mới được Bartolomeo Cristofori phát minh", có búa và bộ giảm âm, âm vực bốn quãng tám; vì vậy năm 1700 thường được coi là năm sinh của piano.
    loai: lich-su
    nguon:
      - met-crist
    ket_qua: dung
    ghi_chu: 'Met: kiểm kê 1700 ghi "arpicimbalo ... newly invented by Bartolomeo Cristofori", búa và bộ giảm âm, bốn quãng tám (C–c''''''); "giving us a precise birthdate for the piano", "around 1700". Britannica (Piano) ghi "approximately 1709"; ghi chú cho người giao, trang dùng cách nói "thường được coi" nên giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731", "https://www.metmuseum.org/art/collection/search/501788", "https://www.britannica.com/biography/Bartolomeo-Cristofori" ]
    luot_2_ghi_chu: "Met: kiểm kê Medici nhắc arpicimbalo 'mới được Bartolomeo Cristofori phát minh', có búa và giảm âm, bốn quãng tám (Met còn ghi hai tầng phím). 'Thường coi 1700' là hợp lý (Met: đến 1700 đã có ít nhất một cây); Britannica nêu khoảng 1709, nên câu viết 'thường được coi' là vừa."
  - id: n9
    cau: Bartolomeo Cristofori (1655–1732) phụ trách nhạc cụ cho hoàng tử Ferdinando de' Medici ở Florence.
    loai: nam
    nguon:
      - du-crist
      - met-crist
    ket_qua: da-sua
    ghi_chu: 'Năm mất sửa 1731 thành 1732 theo dữ liệu đã khóa. Met: bổ nhiệm năm 1688 vào triều đình Grand Prince Ferdinando de'' Medici ở Florence để chăm sóc đàn harpsichord và về sau cả bộ sưu tập nhạc cụ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731", "https://www.britannica.com/biography/Bartolomeo-Cristofori" ]
    luot_2_ghi_chu: "Met: Cristofori (Padua, 1655–1731) vào triều Ferdinando de' Medici năm 1688 để trông nom đàn harpsichord. Britannica ghi mất 27/1/1732 (khác cách tính lịch); 1732 chấp nhận được."
  - id: n10
    cau: Năm 1711, nhà văn Scipione Maffei viết bài mô tả chiếc đàn, gọi nó là gravicembalo col piano, e forte ("harpsichord có nhỏ và có to"); từ đó sinh ra hai chữ pianoforte và piano.
    loai: lich-su
    nguon:
      - met-crist
    ket_qua: da-sua
    ghi_chu: 'Met: Maffei (nhà thơ, nhà báo) 1711 gọi "gravicembalo col piano, e forte"; đây là lần đầu chiếc đàn được gọi bằng tên về sau, pianoforte. Bỏ "bài báo nhiệt tình" (xem doi_chu).'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731" ]
    luot_2_ghi_chu: "Met: Maffei 1711 gọi 'gravicembalo col piano, e forte', lần đầu dùng tên pianoforte."
  - id: n11
    cau: 'Điều thiên tài của Cristofori là bộ máy: búa gõ dây thay vì miếng gảy (bấm nhanh thì tiếng to, bấm chậm thì tiếng nhỏ); cơ cấu thoát cho búa rời dây ngay sau khi gõ; bộ giảm âm là miếng chặn rơi xuống dây khi nhả phím.'
    loai: dinh-nghia
    nguon:
      - met-crist
    ket_qua: dung
    ghi_chu: 'Met: escapement "enabled the hammer to fall away from the string instantly after striking it"; "a dampening mechanism on a jack to silence the string when not in use"; piano "capable of gradations of soft and loud".'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/art/collection/search/501788", "https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731" ]
    luot_2_ghi_chu: "Met: búa thay miếng gảy, bộ máy thiết kế rất tốt, có giảm âm. Chi tiết cơ cấu thoát/miếng chặn là mô tả chuẩn, không mâu thuẫn."
  - id: n12
    cau: 'Ba cây đàn của Cristofori còn tồn tại: cây năm 1720 ở Metropolitan (New York, 54 phím), cây 1722 ở Bảo tàng Nhạc cụ Quốc gia ở Rome, cây 1726 ở Bảo tàng Nhạc cụ của Đại học Leipzig.'
    loai: so-lieu
    nguon:
      - met-crist
    ket_qua: dung
    ghi_chu: 'Met: 1720 Metropolitan ("54 rather than 88 keys"), 1722 Museo Strumenti Musicali Rome, 1726 Musikinstrumenten-Museum Leipzig University.'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731" ]
    luot_2_ghi_chu: "Met: 1720 (Met, 54 phím), 1722 (Bảo tàng Nhạc cụ, Rome), 1726 (Leipzig)."
  - id: n13
    cau: Silbermann bắt đầu làm piano theo thiết kế Cristofori từ những năm 1730 sau khi đọc bài của Maffei dịch sang tiếng Đức năm 1725; Bach chê một cây đời đầu vì phím nặng và âm cao yếu, về sau khen và giúp bán đàn; Frederick Đại đế mua nhiều cây.
    loai: lich-su
    nguon:
      - met-crist
    ket_qua: dung
    ghi_chu: 'Met: bản dịch trong Critica musica của Mattheson 1725, Silbermann "began work on his own pianos in the 1730s"; Bach: "too heavy a touch and too weak a treble", sau đó khen và làm đại lý bán; Frederick Đại đế (trị vì 1740–86) mua nhiều cây. Chỉ đổi "bài báo" thành "bài viết" ở câu liền sau (n14).'
    luot_2: dung
