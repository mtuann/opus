nhan_dinh:
  - id: n1
    cau: Cây đàn bạn tập hôm nay là kết quả của hơn ba thế kỷ cải tiến.
    loai: lich-su
    nguon:
      - met-crist
    ket_qua: dung
    ghi_chu: 'Met: bản kiểm kê năm 1700 ghi chiếc đàn có búa của Cristofori; từ 1700 đến nay hơn ba thế kỷ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/art/collection/search/501788" ]
    luot_2_ghi_chu: "Cristofori làm đàn từ khoảng 1700; Met: bản 1720 còn lại; hơn ba thế kỷ là hợp lý."
  - id: n2
    cau: 'Clavichord: một lưỡi đồng nhỏ (tangent) gõ vào dây rồi nằm lại trên dây cho đến khi nhả phím; to nhỏ theo lực ngón nhưng rất nhỏ tiếng; rung nhẹ ngón trên phím tạo tiếng rung (Bebung).'
    loai: dinh-nghia
    nguon:
      - brit-clav
      - met-crist
    ket_qua: dung
    ghi_chu: 'Britannica: tangent chạm dây khi nhấn phím và rời dây khi nhả phím (suy ra nằm lại khi giữ); "can achieve dynamic variation ... by the player''s touch alone"; "vibrato, or bebung, if finger pressure on the key is varied"; tiếng "silvery and soft". Met: clavichord quá nhỏ cho hòa tấu và hòa nhạc.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/clavichord" ]
    luot_2_ghi_chu: "ODM: clavichord rất nhỏ tiếng, 'bridge' chạm dây khi nhấn phím (tức tangent), không đủ cho hòa nhạc. Riêng Bebung không có trên trang đã mở; mô tả chuẩn, không mâu thuẫn."
  - id: n3
    cau: Clavichord là nhạc cụ để tập và chơi ở nhà; C. P. E. Bach rất yêu thích nó.
    loai: lich-su
    nguon:
      - brit-clav
      - ency-clav
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: Britannica chỉ nói tiếng clavichord hợp nhất với nhạc thân mật như sonata và fantasia của C. P. E. Bach; không nói "tập và chơi ở nhà" hay "rất yêu thích". Chưa mở nguồn nào khác. Review D4-gom: ODM (Clavichord): "essentially an instr. for private practice, being too soft in tone for concert use"; Britannica (lượt 1): tiếng clavichord hợp nhất với nhạc thân mật như sonata, fantasia của C. P. E. Bach. Không nguồn nào nói "rất yêu thích". Cũ: "Nhạc cụ để tập và chơi ở nhà; C. P. E. Bach rất yêu thích nó". Mới: "Tiếng quá nhỏ để chơi hòa nhạc, nên chủ yếu dùng để tập riêng; các sonata và fantasia của C. P. E. Bach rất hợp với tiếng của nó".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/clavichord" ]
    luot_2_ghi_chu: ODM xác nhận clavichord quá nhỏ tiếng để biểu diễn hòa nhạc; phần 'C. P. E. Bach rất yêu thích' và 'tập ở nhà' không có trên trang nào đã mở.
  - id: n4
    cau: 'Harpsichord: miếng gảy gắn trên con đẩy (jack) gảy dây; không to nhỏ theo lực ngón; là một trong những nhạc cụ phím quan trọng nhất của thời Baroque.'
    loai: dinh-nghia
    nguon:
      - brit-harp
      - met-crist
    ket_qua: da-sua
    ghi_chu: 'Britannica: "strings are set in vibration by plucking"; Met: "jack and quill action", "lacked the ability to respond to the strength of the player''s touch". Câu "nhạc cụ phím chính" sửa thành "một trong những ... quan trọng nhất" theo Britannica.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/harpsichord" ]
    luot_2_ghi_chu: "Britannica: harpsichord gảy dây, một trong những nhạc cụ phím quan trọng nhất từ thế kỷ 16 đến nửa đầu thế kỷ 18. Chi tiết jack/không đổi to nhỏ theo lực không có trên trang; mô tả chuẩn."
  - id: n5
    cau: Harpsichord đổi màu tiếng bằng các bộ dây (register) và hai tầng phím.
    loai: dinh-nghia
    ket_qua: dung
    ghi_chu: 'chưa chắc: Britannica và Met (đoạn đã mở) không nêu register hay hai tầng phím; Dolmetsch không mở được mục Harpsichord (trang bị cắt). Review D4-gom: Encyclopedia.com (World Encyclopedia, Oxford): stop đưa thêm bộ dây vào; đàn lịch sử có hai, hiếm khi ba tầng phím; Gale: mỗi tầng phím nối với một bộ dây. Giữ.'
    luot_2: khong-chac
