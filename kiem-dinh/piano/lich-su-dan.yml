  - id: n44
    cau: Đến giữa thế kỷ 19, đàn đứng nhỏ gọn thành món quen thuộc trong gia đình; khoảng năm 1800 nhiều thợ thử dựng dây theo chiều đứng, như đàn "hươu cao cổ" (giraffe) ở Vienna; vì thế thế kỷ 19 có nhiều nhạc dễ chơi, chuyển soạn và nhạc bốn tay.
    loai: lich-su
    nguon:
      - met-vien
      - brit-piano
      - ptg
      - yam-struct
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: Met không nhắc giraffe hay đàn đứng ở Vienna; Britannica chỉ nêu John Isaac Hawkins làm đàn đứng nhỏ hơn. Chưa có nguồn cho các ý còn lại. Review D4-gom: PTG: giraffe piano ra đời ở Vienna khoảng 1798; Yamaha: Hawkins làm cây piano đứng thực thụ đầu tiên năm 1800 ở Philadelphia. Câu "đến giữa thế kỷ 19 quen thuộc trong gia đình" và quan hệ nhân quả "Vì thế thế kỷ 19 có rất nhiều nhạc dễ chơi ..." không có nguồn: bỏ. Cũ: "Song song là đàn đứng (upright). Khoảng năm 1800, nhiều thợ làm đàn thử dựng dây theo chiều đứng, như kiểu \"đàn hươu cao cổ\" (giraffe piano) ở Vienna. Đến giữa thế kỷ 19, ... (xem Các thể loại nhạc piano)." Mới: "Song song là đàn đứng (upright): dây dựng theo chiều đứng để cây đàn gọn hơn. Kiểu \"đàn hươu cao cổ\" (giraffe piano) xuất hiện ở Vienna khoảng năm 1798; năm 1800, John Isaac Hawkins làm cây piano đứng thực thụ đầu tiên, ở Philadelphia. Về nhạc bốn tay và các thể loại khác cho piano, xem Các thể loại nhạc piano."'
    luot_2: dung
    luot_2_nguon: [ "https://www.yamaha.com/en/musical_instrument_guide/piano/structure/structure003.html", "https://my.ptg.org/teacher-resources/history-of-the-piano" ]
    luot_2_ghi_chu: "Yamaha: piano đứng thực thụ đầu tiên 1800 (Hawkins); PTG: đàn giraffe xuất hiện khoảng 1798. Vế 'vì thế có nhiều nhạc dễ chơi, chuyển soạn, bốn tay' là diễn giải, không có trong nguồn."
