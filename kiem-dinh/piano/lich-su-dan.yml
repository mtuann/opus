    moi: "câu hỏi: Khi chơi một sonata của Mozart trên đàn hiện đại, lựa chọn nào hợp lý nhất? | Giữ bàn đạp vang suốt để tiếng đầy | ✓ Ít bàn đạp, bè trầm nhẹ, luyến và staccato rõ | Chơi bè trầm thật to vì đàn thời đó có bè trầm yếu | Đàn thời Mozart nhẹ, tiếng thanh và ngân ngắn; đàn hiện đại ngân dài và tiếng dày hơn."
    ly_do: "n67 (da-sua, review D4-gom): lời giải thích câu hỏi theo bảng mới (PTG, Fitch)."
ghi_chu: 'Lượt 1 trang Lịch sử cây đàn piano (lô D4-L3, phần B). Nguồn đã mở: Met (hai bài Heilbrunn), Britannica (Piano, Clavichord, Harpsichord, Keyboard instrument), ba bằng sáng chế Google Patents, thư Mozart (bản dịch web), Beethoven-Haus (PDF), Fitch, Yamaha, Askenfelt (KTH), Finchcocks/Horniman/squarepianos (qua hồ sơ not-lap-not-kep), trang hãng Bösendorfer/Fazioli/Yamaha/Steinway/Bechstein. Wikipedia chỉ để tìm nguồn. Đã sửa (da-sua): n9 (Cristofori mất 1732), n10 và n14 (bài báo Maffei thành bài viết), n4 (nhạc cụ phím quan trọng nhất), n23 (Broadwood bộ máy Anh; bỏ to hơn, ngân hơn), n24 (bỏ Mozart FF–f'''''' suốt đời, thay bằng âm vực Stein), n26 (Broadwood tặng 1818, bỏ gửi 1817), n34 (búa bọc nỉ, Pape 1826), n36 (sostenuto: Montal 1862, Steinway 1874), n37 (88 phím: bỏ Steinway cuối 1880s), n40 (Steinway lập bởi Henry Engelhard Steinway), n61 (230 dây, 16–30 tấn). Chưa chắc (ket_qua null): n3, n5, n6, n7, n15, n16, n18, n19, n22, n25, n27, n28, n33, n38, n41, n44, n47, n49, n51, n52, n53, n55, n56, n60, n62, n65, n67, n69, n70. Hình keyboard-ranges: nhãn "Thời Bach và Mozart" (Fa1–Fa6) và "Graf của Beethoven (1825)" lệch/chưa chắc so với trang; không sửa file hình. Lô trước yêu cầu giữ (ban-dap: cần đầu gối của Stein, Walter, ba bàn đạp, senza sordino với anchor ban-ap-senza-sordino, bảng sáng chế sostenuto): giữ cả, đã sửa câu Steinway 1874 theo yêu cầu. Cristofori 1731 đã sửa 1732 theo du-lieu cristofori n3. Thuật ngữ chưa có bản ghi (ghi để người giao): bộ máy Vienna (Prellmechanik), bộ máy Anh, đàn vuông, cần đầu gối, cơ cấu thoát kép, dây bắt chéo. Review D4-gom (nhóm C, 28/10/2026): quyết 29 câu null và các câu lượt 2 khong-chac; sửa trang ở n3, n7, n16, n19, n27, n44, n49, n51, n52, n55, n60, n61, n65, n67, n69, n70; sửa file hình keyboard-ranges (n28). Ghi đổi chữ ở ghi_chu từng câu; người giao dựng lại doi_chu bằng công cụ.'
