  - cu:
      - "Mỗi nghệ sĩ có cây đàn mình thích. Chopin gắn bó với đàn Pleyel ở Paris, tiếng mềm và nhạy với những sắc thái nhỏ; Liszt thường chơi đàn Érard, mạnh mẽ và lặp nốt nhanh. Nhiều hãng đàn lớn ra đời trong giai đoạn này: Bösendorfer (Vienna, 1828), Steinway & Sons (New York, 1853, do Heinrich Engelhard Steinweg lập; xưởng Hamburg mở năm 1880), C. Bechstein (Berlin, 1853) và Blüthner (Leipzig, 1853)."
      - Song song là đàn đứng (upright). Khoảng năm 1800, nhiều thợ làm đàn thử dựng dây theo chiều đứng, như kiểu "đàn hươu cao cổ" (giraffe piano) ở Vienna. Đến giữa thế kỷ 19, đàn đứng nhỏ gọn đã thành món đồ quen thuộc trong các gia đình. Vì thế thế kỷ 19 có rất nhiều nhạc dễ chơi cho người học, những bản chuyển soạn giao hưởng và opera cho piano, và nhạc bốn tay để chơi cùng nhau ở nhà (xem Các thể loại nhạc piano).
    moi:
      - "Mỗi nghệ sĩ có cây đàn mình thích. Chopin gắn bó với đàn Pleyel ở Paris, tiếng mềm và nhạy với những sắc thái nhỏ; Liszt thường chơi đàn Érard, mạnh mẽ và lặp nốt nhanh. Nhiều hãng đàn lớn ra đời trong giai đoạn này: Bösendorfer (Vienna, 1828), Steinway & Sons (New York, 1853, do Henry Engelhard Steinway lập; xưởng Hamburg mở năm 1880), C. Bechstein (Berlin, 1853) và Blüthner (Leipzig, 1853)."
      - 'Song song là đàn đứng (upright): dây dựng theo chiều đứng để cây đàn gọn hơn. Kiểu "đàn hươu cao cổ" (giraffe piano) xuất hiện ở Vienna khoảng năm 1798; năm 1800, John Isaac Hawkins làm cây piano đứng thực thụ đầu tiên, ở Philadelphia. Về nhạc bốn tay và các thể loại khác cho piano, xem Các thể loại nhạc piano.'
    ly_do: 'n40 (da-sua): Trang chủ Steinway: "Founded in 1853 by German immigrant Henry Engelhard Steinway in a Manhattan loft". Tên "Steinweg" không có trong nguồn đã mở.; n44 (da-sua, review D4-gom): PTG (giraffe ở Vienna khoảng 1798), Yamaha (Hawkins 1800); bỏ câu không nguồn về đàn đứng giữa thế kỷ 19 và quan hệ nhân quả với nhạc bốn tay.'
