  - cu: Dây đàn. Ở vùng trầm nhất, mỗi nốt có một dây quấn đồng; lên cao một chút là hai dây; phần lớn bàn phím mỗi nốt có ba dây. Một cây đàn cánh có khoảng hơn hai trăm dây, với tổng lực căng thường được ước tính vào khoảng 20 tấn, do khung gang gánh chịu.
    moi: Dây đàn. Ở vùng trầm nhất, mỗi nốt chỉ có một dây; lên cao hơn là hai dây, rồi ba dây ở các nốt cao. Một cây piano có hơn 200 dây (đàn concert Steinway D có 243 dây); tổng lực căng là 16 tấn vào năm 1862 và có thể lên tới 30 tấn ở đàn hiện đại, do khung gang gánh chịu.
