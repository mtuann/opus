doi_chu:
  - cu: Đổi màu tiếng bằng các bộ dây (register) và hai tầng phím. Nhạc cụ phím chính của thời Baroque
    moi: Đổi màu tiếng bằng các bộ dây (register) và hai tầng phím. Một trong những nhạc cụ phím quan trọng nhất của thời Baroque
    ly_do: 'n4 (da-sua): Câu cũ: "Nhạc cụ phím chính". Britannica: "one of the most important keyboard instruments in European music from the 16th through the first half of the 18th century"; không nói là nhạc cụ chính duy nhất.'
  - cu:
      - Bartolomeo Cristofori (1655–1731) phụ trách nhạc cụ cho hoàng tử Ferdinando de' Medici ở Florence. Bản kiểm kê nhạc cụ nhà Medici năm 1700 đã ghi một chiếc arpicimbalo "mới được Bartolomeo Cristofori phát minh", có búa và bộ giảm âm, âm vực bốn quãng tám. Vì vậy năm 1700 thường được coi là năm sinh của piano.
      - 'Năm 1711, nhà văn Scipione Maffei viết một bài báo nhiệt tình về chiếc đàn, gọi nó là gravicembalo col piano, e forte: "harpsichord có nhỏ và có to". Từ đó sinh ra hai chữ pianoforte và piano.'
    moi:
      - Bartolomeo Cristofori (1655–1732) phụ trách nhạc cụ cho hoàng tử Ferdinando de' Medici ở Florence. Bản kiểm kê nhạc cụ nhà Medici năm 1700 đã ghi một chiếc arpicimbalo "mới được Bartolomeo Cristofori phát minh", có búa và bộ giảm âm, âm vực bốn quãng tám. Vì vậy năm 1700 thường được coi là năm sinh của piano.
      - 'Năm 1711, nhà văn Scipione Maffei viết bài mô tả chiếc đàn, gọi nó là gravicembalo col piano, e forte: "harpsichord có nhỏ và có to". Từ đó sinh ra hai chữ pianoforte và piano.'
    ly_do: 'n9 (da-sua): Dữ liệu đã khóa (src/data/nha-soan-nhac.yml, hồ sơ du-lieu/nha-soan-nhac/cristofori.yml n3) ghi năm mất 1732 theo lịch hiện hành (27/1/1732; giấy tờ Florence ghi 1731 vì năm Florence bắt đầu ngày 25/3); hồ sơ ấy dặn trang lịch sử đàn sửa theo. Met viết 1731 (cũng là tên bài Met ở mục Nguồn, giữ nguyên vì là tên bài).; n10 (da-sua): Câu cũ: "viết một bài báo nhiệt tình". Met chỉ nói Maffei (nhà thơ, nhà báo) mô tả chiếc đàn năm 1711 và gọi nó là "gravicembalo col piano, e forte"; không nêu tên báo, không nói "nhiệt tình".'
  - cu: Bài báo của Maffei được dịch sang tiếng Đức năm 1725. Đọc nó, thợ làm đàn Gottfried Silbermann bắt đầu làm piano theo thiết kế của Cristofori từ những năm 1730. J. S. Bach chê một cây đàn Silbermann đời đầu vì phím nặng và âm cao yếu; về sau ông khen những cây đã cải tiến và còn giúp bán đàn Silbermann. Vua Frederick Đại đế nước Phổ mua nhiều cây đàn này, và Bach đã chơi chúng khi đến cung điện của nhà vua ở Potsdam năm 1747, chuyến thăm sinh ra tác phẩm Musikalisches Opfer (Lễ vật âm nhạc).
    moi: Bài viết của Maffei được dịch sang tiếng Đức năm 1725. Đọc nó, thợ làm đàn Gottfried Silbermann bắt đầu làm piano theo thiết kế của Cristofori từ những năm 1730. J. S. Bach chê một cây đàn Silbermann đời đầu vì phím nặng và âm cao yếu; về sau ông khen những cây đã cải tiến và còn giúp bán đàn Silbermann. Vua Frederick Đại đế nước Phổ mua nhiều cây đàn này, và Bach đã chơi chúng khi đến cung điện của nhà vua ở Potsdam năm 1747, chuyến thăm sinh ra tác phẩm Musikalisches Opfer (Lễ vật âm nhạc).
    ly_do: "n14 (da-sua): Thống nhất với n10: nguồn (Met) gọi đó là bài mô tả; bản dịch in trong Critica musica của Mattheson năm 1725."
  - cu:
      - Bộ máy Anh. Ở London, Johannes Zumpe làm piano vuông (square piano) nhỏ gọn từ những năm 1760, loại đàn gia đình rất được ưa chuộng. Các xưởng London, nổi bật là Broadwood, làm đàn cánh với bộ máy nặng hơn, tiếng to và ngân hơn đàn Vienna.
      - Cả hai loại đàn thời này đều có âm vực khoảng năm quãng tám. Mozart viết nhạc phím trong khoảng FF–f''' (Fa1–Fa6) suốt đời mình.
    moi:
      - Bộ máy Anh. Ở London, Johannes Zumpe làm piano vuông (square piano) nhỏ gọn từ những năm 1760, loại đàn gia đình rất được ưa chuộng. Các xưởng London, nổi bật là Broadwood, làm đàn cánh với bộ máy Anh (English action), khác hẳn bộ máy Vienna.
      - Cả hai loại đàn thời này đều có âm vực khoảng năm quãng tám; đàn Stein, chẳng hạn, chạy từ FF đến f''' (Fa1–Fa6).
    ly_do: "n23 (da-sua): Câu cũ: \"bộ máy nặng hơn, tiếng to và ngân hơn đàn Vienna\". Beethoven-Haus: Broadwood 1817 dùng bộ máy \"push-tongue\" gọi là English action, Graf dùng Prellzungen, hai đàn \"khác nhau chủ yếu ở bộ máy\"; chỉ có nhận xét chung \"more overtone, quieter, finer and less voluminous, but very vocal\" cho cả hai, không nói đàn Anh to hơn. Met cũng không so sánh.; n24 (da-sua): Câu cũ: \"Mozart viết nhạc phím trong khoảng FF–f''' (Fa1–Fa6) suốt đời mình\". Không nguồn nào mở được nói điều này (Met: chuẩn cuối thế kỷ 18 là năm quãng tám, 61 phím; fortepiano.eu: bản sao đàn Stein 1788 có âm vực FF–f3). Chuyển thành âm vực của đàn Stein, có nguồn."
  - cu: "Một cây Broadwood từ London (gửi năm 1817, đến tay ông năm 1818): sáu quãng tám, từ CC đến c'''' (Đô1–Đô7)."
    moi: "Một cây Broadwood từ London (Thomas Broadwood tặng năm 1818): sáu quãng tám, từ CC đến c'''' (Đô1–Đô7)."
    ly_do: 'n26 (da-sua): Câu cũ: "gửi năm 1817, đến tay ông năm 1818". Beethoven-Haus: "1818 schenkte ... Thomas Broadwood Ludwig van Beethoven einen Flügel"; cây đàn 1817 trưng bày ở Bonn là cây cùng kiểu, làm trước đàn của Beethoven khoảng ba tháng, không phải đàn của ông; không có nguồn nào nói "gửi năm 1817".'
  - cu: Dần thay búa bọc da trong nửa đầu thế kỷ 19
    moi: Jean-Henri Pape (Paris) lấy bằng sáng chế năm 1826; búa bọc nỉ thay dần búa bọc da, chỉ phổ biến hẳn sau năm 1855
    ly_do: 'n34 (da-sua): Câu cũ: "Dần thay búa bọc da trong nửa đầu thế kỷ 19". Britannica (Keyboard instrument): "Felt-covered hammers were patented in 1826 by ... Jean-Henri Pape"; việc dùng nỉ chưa phổ biến cho đến sau 1855, nên "trong nửa đầu thế kỷ 19" không đúng.'
  - cu: Steinway, bằng sáng chế năm 1874
    moi: Claude Montal làm cơ cấu giữ âm năm 1862; Albert Steinway được cấp bằng sáng chế năm 1874
    ly_do: 'n36 (da-sua): Câu cũ: "Steinway, bằng sáng chế năm 1874". Britannica: Claude Montal năm 1862 làm bàn đạp chỉ giữ những dây đã được nhấn phím; bằng sáng chế Hoa Kỳ số 156.388 của Albert Steinway cấp 27/10/1874. Sửa cho khỏi lệch với trang Bàn đạp (hồ sơ ban-dap n7 ghi chú: Wikipedia cũng nêu Boisselot 1844 và Debain 1860, hai mốc này chỉ có Wikipedia nên không đưa vào).'
  - cu: Steinway cuối những năm 1880; các hãng khác làm theo
    moi: Chuẩn của đàn piano hiện đại
    ly_do: 'n37 (da-sua): Câu cũ: "Steinway cuối những năm 1880; các hãng khác làm theo". Không nguồn nào mở được nêu hãng hay năm (Britannica chỉ nói đàn chuẩn hiện đại có 88 phím; Wikipedia không nêu năm), nên bỏ phần ai/khi nào.'
  - cu: "Mỗi nghệ sĩ có cây đàn mình thích. Chopin gắn bó với đàn Pleyel ở Paris, tiếng mềm và nhạy với những sắc thái nhỏ; Liszt thường chơi đàn Érard, mạnh mẽ và lặp nốt nhanh. Nhiều hãng đàn lớn ra đời trong giai đoạn này: Bösendorfer (Vienna, 1828), Steinway & Sons (New York, 1853, do Heinrich Engelhard Steinweg lập; xưởng Hamburg mở năm 1880), C. Bechstein (Berlin, 1853) và Blüthner (Leipzig, 1853)."
    moi: "Mỗi nghệ sĩ có cây đàn mình thích. Chopin gắn bó với đàn Pleyel ở Paris, tiếng mềm và nhạy với những sắc thái nhỏ; Liszt thường chơi đàn Érard, mạnh mẽ và lặp nốt nhanh. Nhiều hãng đàn lớn ra đời trong giai đoạn này: Bösendorfer (Vienna, 1828), Steinway & Sons (New York, 1853, do Henry Engelhard Steinway lập; xưởng Hamburg mở năm 1880), C. Bechstein (Berlin, 1853) và Blüthner (Leipzig, 1853)."
    ly_do: 'n40 (da-sua): Trang chủ Steinway: "Founded in 1853 by German immigrant Henry Engelhard Steinway in a Manhattan loft". Tên "Steinweg" không có trong nguồn đã mở.'
  - cu: Dây đàn. Ở vùng trầm nhất, mỗi nốt có một dây quấn đồng; lên cao một chút là hai dây; phần lớn bàn phím mỗi nốt có ba dây. Một cây đàn cánh có khoảng hơn hai trăm dây, với tổng lực căng thường được ước tính vào khoảng 20 tấn, do khung gang gánh chịu.
    moi: Dây đàn. Ở vùng trầm nhất, mỗi nốt có một dây quấn đồng; lên cao một chút là hai dây; phần lớn bàn phím mỗi nốt có ba dây. Một cây piano có thể có tới 230 dây; tổng lực căng là 16 tấn vào năm 1862 và có thể lên tới 30 tấn ở đàn hiện đại, do khung gang gánh chịu.
    ly_do: 'n61 (da-sua): Câu cũ: "khoảng hơn hai trăm dây ... khoảng 20 tấn". Yamaha Hub: "as many as 230 strings". Britannica: "String tension, determined at 16 tons in 1862, increased to as much as 30 tons in modern instruments"; khung gang chịu lực căng (Britannica). Không nguồn nào cho "20 tấn".'
ghi_chu: 'Lượt 1 trang Lịch sử cây đàn piano (lô D4-L3, phần B). Nguồn đã mở: Met (hai bài Heilbrunn), Britannica (Piano, Clavichord, Harpsichord, Keyboard instrument), ba bằng sáng chế Google Patents, thư Mozart (bản dịch web), Beethoven-Haus (PDF), Fitch, Yamaha, Askenfelt (KTH), Finchcocks/Horniman/squarepianos (qua hồ sơ not-lap-not-kep), trang hãng Bösendorfer/Fazioli/Yamaha/Steinway/Bechstein. Wikipedia chỉ để tìm nguồn. Đã sửa (da-sua): n9 (Cristofori mất 1732), n10 và n14 (bài báo Maffei thành bài viết), n4 (nhạc cụ phím quan trọng nhất), n23 (Broadwood bộ máy Anh; bỏ to hơn, ngân hơn), n24 (bỏ Mozart FF–f'''''' suốt đời, thay bằng âm vực Stein), n26 (Broadwood tặng 1818, bỏ gửi 1817), n34 (búa bọc nỉ, Pape 1826), n36 (sostenuto: Montal 1862, Steinway 1874), n37 (88 phím: bỏ Steinway cuối 1880s), n40 (Steinway lập bởi Henry Engelhard Steinway), n61 (230 dây, 16–30 tấn). Chưa chắc (ket_qua null): n3, n5, n6, n7, n15, n16, n18, n19, n22, n25, n27, n28, n33, n38, n41, n44, n47, n49, n51, n52, n53, n55, n56, n60, n62, n65, n67, n69, n70. Hình keyboard-ranges: nhãn "Thời Bach và Mozart" (Fa1–Fa6) và "Graf của Beethoven (1825)" lệch/chưa chắc so với trang; không sửa file hình. Lô trước yêu cầu giữ (ban-dap: cần đầu gối của Stein, Walter, ba bàn đạp, senza sordino với anchor ban-ap-senza-sordino, bảng sáng chế sostenuto): giữ cả, đã sửa câu Steinway 1874 theo yêu cầu. Cristofori 1731 đã sửa 1732 theo du-lieu cristofori n3. Thuật ngữ chưa có bản ghi (ghi để người giao): bộ máy Vienna (Prellmechanik), bộ máy Anh, đàn vuông, cần đầu gối, cơ cấu thoát kép, dây bắt chéo.'
