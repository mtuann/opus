    review: dung
  - id: n95
    cau: "Fioritura (tiếng Ý: \"nở hoa\"; số nhiều fioriture) là những chùm nốt trang trí dài, viết bằng nốt nhỏ hoặc thành những nhóm không chia đều theo phách của tay trái, bắt chước lối luyến láy của ca sĩ bel canto."
    loai: dinh-nghia
    nguon:
      - rider-chopin
      - oxford-fioritura
      - ntnu-chopin
    ket_qua: da-sua
    ghi_chu: "chưa chắc: nghĩa \"nở hoa\" của fioritura và các số 7, 11, 22 chưa mở bản nhạc hay từ điển; chưa có nguồn bậc 1–2. Review D4-gom: Oxford Learner's Dictionaries (lượt 2): fioritura từ tiếng Ý \"flowering\", nốt thêm vào giai điệu của ca sĩ opera; NTNU: trang trí của Chopin nối với bel canto. Các con số \"7, 11, 22 nốt\" không mở được bản nhạc để đếm: bỏ. Cũ: \"thành những nhóm không chia đều (7, 11, 22 nốt… trên một phách của tay trái)\". Mới: \"thành những nhóm không chia đều theo phách của tay trái\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.oxfordlearnersdictionaries.com/us/definition/english/fioritura", "https://en.wikipedia.org/wiki/Fioritura" ]
    luot_2_ghi_chu: "Oxford Learner's: nốt trang trí ca sĩ thêm vào giai điệu, từ tiếng Ý 'flowering'; mục từ trích Oxford Companion to Music/Grove: florid embellishment, dài, phức tạp, khác láy rền/láy ngắt chuẩn; số nhiều fioriture. Liên hệ bel canto là hợp lý, nguồn đã mở không nói riêng về Chopin."
  - id: n96
    cau: Chopin còn viết thêm biến thể vào bản nhạc của học trò; Nocturne Op. 9 số 2 có cả một bộ biến thể như thế.
    loai: lich-su
    nguon:
      - hebis-eigeldinger
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "chưa chắc: Eigeldinger (Cambridge University Press 1986) là nguồn thích hợp nhưng chưa mở được nội dung; bản ghi thư mục chỉ xác nhận sách tồn tại. Review D4-gom: Chú giải Wydanie Narodowe, Nocturne Op. 9 số 2 (review đã mở): \"Chopin was introducing more or less significant variants into the printed text of the piece\", có bộ biến thể chính thức (variants) ghi trong bản của học trò. \"Thường đổi chúng mỗi lần chơi\" không nguồn. Cũ: \"Chopin thường đổi chúng mỗi lần chơi; một số biến thể do chính ông viết còn được giữ lại (xem Nocturne Op. 9 số 2).\" Mới: \"Chopin còn viết thêm biến thể vào bản nhạc của học trò; Nocturne Op. 9 số 2 có cả một bộ biến thể như thế.\""
    luot_2: dung
    luot_2_nguon: [ "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf", "https://www.fabermusic.com/shop/the-complete-chopin-nocturne-in-e-flat-major-op-9-no-2-p462289" ]
    luot_2_ghi_chu: "Chú giải Quốc gia: Op. 9 số 2 có ba bộ biến thể Chopin viết vào bản của học trò và hai bản hoàn chỉnh; Faber: bản biến thể 'to have flowed from Chopin's pen after the work was first completed'."
  - id: n97
    cau: Theo chú giải của ấn bản Quốc gia Ba Lan, hợp âm rải và những nốt nhỏ tạo thành hợp âm rải hay quãng rải, theo lệ chung, bắt đầu đúng phách; một nhóm vài nốt nhỏ có hai cách chơi, đúng phách hoặc trước phách.
    loai: quy-tac
    nguon:
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"có những nhóm vài nốt nhỏ chơi trước phách lại thuận hơn\". Chú giải Nocturne: nốt nhỏ tạo hợp âm rải bắt đầu cùng nốt tay trái, và với nhóm nốt nhỏ có hai cách chơi có thể; không nói cách nào \"thuận hơn\" nên bỏ so sánh."
    luot_2: dung
    luot_2_nguon: [ "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf" ]
    luot_2_ghi_chu: "Chú giải: hợp âm rải bắt đầu cùng nốt tay trái tương ứng; với nhóm nốt nhỏ, 'less important whether the grace-note sounds together with the corresponding bass note or a little before it' (Op. 32 số 1), tức hai cách."
  - id: n98
    cau: Với láy rền của Chopin, một nốt nhỏ cùng cao độ với nốt chính đứng ngay trước dấu tr cho biết láy bắt đầu từ nốt chính.
    loai: quy-tac
    nguon:
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "Câu cũ thêm: \"ở trên thì từ nốt trên\". Chú giải Nocturne: nốt nhỏ cùng cao độ với nốt láy nghĩa là láy bắt đầu từ nốt chính; không có câu tương ứng cho nốt nhỏ ở trên. Bỏ vế đó (đồng thời sửa lời giải thích của câu hỏi cuối)."
    luot_2: dung
    luot_2_nguon: [ "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf", "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/sonatas_commentaries.pdf" ]
    luot_2_ghi_chu: "Chú giải Wydanie Narodowe: khi nốt nhỏ trùng nốt trill thì 'the trill should begin on the main note without its repetition' (Op. 62 số 1; Sonata Op. 58)."
  - id: n99
    cau: "Với chùm nốt dài của Chopin, điều quan trọng hơn cả là những điểm gặp nhau với tay trái; bốn bước: học giai điệu khung, đánh dấu điểm khớp, tập riêng chùm cho đều rồi ghép chậm, tạo dáng và giữ chùm nhỏ hơn giai điệu."
