  - cu: 'Bảng viết cho một cậu bé chín tuổi nên rất gọn: nó không nói chơi bao nhiêu nốt, nhanh đến đâu, khi nào được phép làm khác. Giới nghiên cứu vẫn tranh luận về những chỗ trống ấy. Frederick Neumann (1978), chẳng hạn, cho rằng các quy tắc kiểu "luôn bắt đầu từ nốt trên, luôn đúng phách" đã bị áp dụng cứng nhắc hơn nhiều so với cách nhạc công thời đó thực sự chơi.'
    moi: "Bảng viết cho một cậu bé chín tuổi nên rất gọn: nó không nói chơi bao nhiêu nốt, nhanh đến đâu, khi nào được phép làm khác. Giới nghiên cứu vẫn tranh luận về những chỗ trống ấy. Frederick Neumann (1978), chẳng hạn, đặt câu hỏi về các quy tắc cứng nhắc trong cách chơi nốt hoa mỹ Baroque, vì nhạc công thời đó có nhiều tự do hơn."
    ly_do: "n31 (da-sua): viết lại theo mô tả nhà xuất bản Princeton UP."
  - cu: 'C. P. E. Bach (1753): láy rền "luôn bắt đầu từ nốt trên". Ngoại lệ: nốt trên vừa vang ngay trước đó (giai điệu đi xuống liền bậc) thì được nối sang, không đánh lại'
    moi: 'C. P. E. Bach (1753): láy rền thường (ordentlicher Triller) "luôn bắt đầu từ nốt trên"; ông còn tả những kiểu láy khác, như láy đi lên từ dưới. Ngoại lệ: nốt trên vừa vang ngay trước đó (giai điệu đi xuống liền bậc) thì được nối sang, không đánh lại'
    ly_do: 'n35 (da-sua, kiểm mẫu D4 của chủ repo): chữ "luôn" chỉ đúng cho láy rền thường (Versuch §5); C. P. E. Bach còn tả kiểu láy đi lên từ dưới.'
  - cu:
      - ngày càng thường từ nốt chính
      - Hummel, trong bộ sách dạy piano in ở Vienna năm 1827–1828, khuyên bắt đầu mọi láy rền từ nốt chính
      - "Lý do của quy tắc Baroque: nốt trên rơi đúng phách là một nốt nghịch tựa vào nốt chính, giống một appoggiatura được nhắc lại thật nhanh. Bắt đầu từ nốt chính, láy rền mất đi sức nặng ấy và chỉ còn là một tiếng rung."
    moi:
      - cả hai cách
      - "Hummel, trong bộ sách dạy piano in ở Vienna năm 1827–1828, khuyên bắt đầu mọi láy rền từ nốt chính. Với Chopin, các nguồn chưa thống nhất: có nhà nghiên cứu cho rằng ông nhìn chung vẫn bắt đầu từ nốt trên, còn chú giải của ấn bản Quốc gia Ba Lan chỉ ra nhiều chỗ nên bắt đầu từ nốt chính; đọc chú giải của từng bản"
      - Theo cách đọc Baroque, nốt trên rơi đúng phách là một nốt nghịch tựa vào nốt chính, nên láy rền nghe như một chuỗi appoggiatura nối nhau thật nhanh.
    ly_do: 'n40 (da-sua, review D4-gom): Dolmetsch (Chopin nhìn chung từ nốt trên) mâu thuẫn chú giải Wydanie Narodowe (nhiều chỗ từ nốt chính); viết theo mức nguồn.; n43 (da-sua, review D4-gom): bỏ phần "lý do" và đánh giá không nguồn; giữ ý chuỗi appoggiatura (Fitch).'
  - cu: "một láy rền ngắn (Trillo của Bach), thường từ nốt trên: trên–chính–trên–chính"
    moi: "một láy rền (Trillo của Bach), thường từ nốt trên, đúng phách; trên nốt ngắn chỉ còn bốn nốt: trên–chính–trên–chính"
    ly_do: "n62, n69 (da-sua, review D4-gom): bảng Bach ghi Trillo dài hơn bốn nốt; bốn nốt là dạng ngắn trên nốt ngắn (Dolmetsch: Pralltriller)."
  - cu:
      - "Giai điệu đi lên tới nốt có ký hiệu: không có gì để nối, nên láy bắt đầu từ nốt trên, đúng phách."
      - "Trong bản Bach-Gesellschaft của Invention số 1, nốt Si móc đơn ở ô 1 mang ký hiệu không gạch và đi xuống từ nốt Đô ngay trước nó: đúng trường hợp thứ nhất. Bài này cũng có ký hiệu có gạch, còn Aria mở đầu Biến khúc Goldberg gần như ô nào cũng có nốt hoa mỹ: hai nơi tốt để luyện mắt. Một dấu hóa nhỏ đặt trên hoặc dưới ký hiệu láy áp dụng cho nốt phụ."
    moi:
      - "Giai điệu đi lên tới nốt có ký hiệu: C. P. E. Bach không dùng Pralltriller ở chỗ này; ký hiệu thường được đọc như Trillo của bảng Bach 1720: láy rền bắt đầu từ nốt trên, đúng phách."
      - "Trong bản Bach-Gesellschaft của Invention số 1, nốt Si móc đơn ở ô 1 mang ký hiệu không gạch và đi xuống từ nốt Đô ngay trước nó: đúng trường hợp thứ nhất. Bài này cũng có ký hiệu có gạch, còn Aria mở đầu Biến khúc Goldberg có nốt hoa mỹ ở phần lớn các ô: hai nơi tốt để luyện mắt. Một dấu hóa nhỏ đặt trên hoặc dưới ký hiệu láy áp dụng cho nốt phụ."
    ly_do: "n65 (da-sua): Pralltriller chỉ sau nốt đi xuống liền bậc (Dolmetsch); trường hợp đi lên đọc theo bảng Bach.; n62, n69 (da-sua, review D4-gom): đọc theo Trillo của bảng Bach 1720 (từ nốt trên, đúng phách).; n67 (da-sua, review D4-gom): Mutopia (Bach-Gesellschaft): 25 trên 32 ô có nốt hoa mỹ."
  - cu:
      - "Đặt giữa hai nốt: chơi nốt chính trước, rồi láy quanh ở cuối giá trị của nốt đó và nối thẳng vào nốt sau. Kiểu này rất hay gặp trong giai điệu Cổ điển và Lãng mạn."
      - "Láy quanh ngược (ký hiệu có gạch dọc, hoặc lộn ngược): bắt đầu từ nốt dưới: dưới – chính – trên – chính."
    moi:
      - "Đặt giữa hai nốt: chơi nốt chính trước, rồi láy quanh ở cuối giá trị của nốt đó và nối thẳng vào nốt sau."
