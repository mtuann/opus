    ghi_chu: "Câu cũ: \"cho rằng các quy tắc kiểu \"luôn bắt đầu từ nốt trên, luôn đúng phách\" đã bị áp dụng cứng nhắc hơn nhiều so với cách nhạc công thời đó thực sự chơi.\" Mô tả nhà xuất bản (Princeton UP) chỉ nói sách đặt câu hỏi về các nguyên tắc cứng nhắc, quy tắc chặt chẽ mâu thuẫn với sự tự do của thời đại; không nêu cụm \"luôn bắt đầu từ nốt trên, luôn đúng phách\". Viết lại theo mô tả. Năm 1978 và nhà xuất bản đúng."
    luot_2: dung
