  - cu: "Không phải nốt nhỏ không gạch nào cũng dài: trước nốt nhanh, trước nốt lặp lại, hoặc ở tốc độ nhanh, nhiều nốt dựa được chơi ngắn. Chú giải của bản Urtext và tai bạn sẽ quyết định."
    moi: "Không phải nốt nhỏ không gạch nào cũng dài: C. P. E. Bach nêu những nốt dựa luôn ngắn, thường đứng trước một nốt ngắn, có khi trước một nốt được nhắc lại nhiều lần. Chú giải của bản Urtext và tai bạn sẽ quyết định."
