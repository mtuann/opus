nhan_dinh:
  - id: n1
    cau: Nốt hoa mỹ là những nốt trang trí được ghi tắt bằng một ký hiệu hoặc bằng nốt nhỏ.
    loai: dinh-nghia
    nguon:
      - cod-orn
    ket_qua: dung
    ghi_chu: "Concise Oxford Dictionary of Music, mục Ornaments: nốt trang trí ghi bằng ký hiệu hay nốt nhỏ (grace notes); cùng nghĩa với trang này."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/ornaments", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "COM: ornaments là embellishment của giai điệu bằng nốt nhỏ hoặc ký hiệu đặc biệt."
  - id: n2
    cau: Cùng một ký hiệu có thể được chơi khác nhau tùy thời kỳ và tùy nhà soạn nhạc.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: trước thế kỷ 19 ký hiệu được ghi với nhiều tự do; chữ \"mordent\" và \"inverted mordent\" đổi nghĩa theo thời và theo tác giả."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory23.htm", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura" ]
    luot_2_ghi_chu: "Dolmetsch: ornamentation thay đổi theo thời kỳ và từng nước; COM: cách hiểu appoggiatura khác nhau giữa các thời kỳ. Phần 'tùy nhà soạn nhạc' khớp với ví dụ Couperin ghi rõ, Bach/d'Anglebert mỗi người một bảng."
  - id: n3
    cau: Một láy rền hay một appoggiatura rơi vào phách mạnh tạo ra một nốt nghịch rồi mới giải quyết, như một từ được nhấn giọng.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - cpe-triller
    ket_qua: dung
    ghi_chu: Láy rền Baroque bắt đầu từ nốt trên đúng phách (C. P. E. Bach §5), nốt trên nghịch với hòa âm; appoggiatura rơi đúng phách và lấy thời gian của nốt chính (Dolmetsch).
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura", "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/" ]
    luot_2_ghi_chu: "COM: appoggiatura hoạt động như nốt chậm giải (suspension); Fitch: láy rền Bach bắt đầu từ nốt trên, đúng phách, là chuỗi appoggiatura."
  - id: n4
    cau: Trên đàn harpsichord, vốn gần như không đổi được độ to, đây là một trong những cách nhấn chủ yếu.
    loai: quy-tac
    nguon:
      - britannica-orn
    ket_qua: da-sua
    ghi_chu: "Britannica, Ornamentation: trên đàn harpsichord nốt hoa mỹ dùng để phát âm và nhấn (articulation, accentuation). \"Gần như không đổi được độ to\" và \"một trong những cách chủ yếu\" không có trong nguồn đã mở; viết lại theo Britannica."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/ornamentation-music" ]
    luot_2_ghi_chu: "Britannica: nhạc harpsichord Pháp dùng nốt hoa mỹ để nhấn và phát âm. Phần 'harpsichord gần như không đổi được độ to' là kiến thức nền, chưa có trang đã mở nói thẳng; không thấy mâu thuẫn."
  - id: n5
    cau: "Giữ cho nốt dài còn sống: tiếng harpsichord và piano thời đầu tắt nhanh; một láy rền làm nốt dài tiếp tục rung."
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Không tìm được nguồn bậc 1 hay 2 cho việc láy rền được dùng để giữ nốt dài vang (đã đọc Britannica, Concise Oxford Dictionary of Music, Dolmetsch). Bỏ gạch đầu dòng. Review D4-gom: Đã kiểm trang không còn câu "giữ cho nốt dài còn sống" hay "tiếp tục rung". Giữ da-bo.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không có trang nguồn đã mở xác nhận chức năng 'giữ nốt dài còn sống' của láy rền trên harpsichord/piano thời đầu. Versuch (I.2.3 §1) chỉ nói láy rền 'làm sống động giai điệu'. Không thấy mâu thuẫn.
  - id: n6
    cau: Láy rền ở nốt áp chót của câu là dấu hiệu quen thuộc của kết trong nhạc Baroque và Cổ điển.
    loai: quy-tac
    nguon:
      - cpe-triller
      - ency-trill
      - cpe-app9
    ket_qua: dung
    ghi_chu: "chưa chắc: C. P. E. Bach §13 nói láy rền trên nốt khá dài (kể cả cuối bài và trên dấu ngân) luôn có nốt kết, nhưng chưa thấy ở nguồn đã mở câu nói về \"nốt áp chót của câu\" như dấu hiệu của kết. Cần nguồn về láy rền ở kết (cadential trill). Review D4-gom: ODM (Trill, lượt 2): láy rền thường gắn với kết; C. P. E. Bach, Versuch I.2.2 §9 nói tới láy rền ở kết. \"Dấu hiệu quen thuộc\" chỉ mức độ, khớp. Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/trill", "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p9.html" ]
    luot_2_ghi_chu: "COM: láy rền thường gắn với kết (cadence); C. P. E. Bach nói tới láy rền kết (cadential trills) trước nốt cuối."
  - id: n7
    cau: Nhạc piano thế kỷ 19, nhất là của Chopin, bắt chước những đường luyến láy của ca sĩ opera.
    loai: lich-su
    nguon:
      - rider-chopin
      - ntnu-chopin
    ket_qua: dung
    ghi_chu: "chưa chắc: chỉ có bản ghi thư viện của phim Chopin at the Opera (bậc 3) nói trang trí của Chopin phản ánh ảnh hưởng bel canto (Bellini, Donizetti, Rossini). Chưa mở được Eigeldinger (Cambridge University Press 1986) hay nguồn bậc 1–2 khác. Review D4-gom: Bài nghiên cứu của NTNU (lượt 2): giai điệu hát và trang trí kiểu coloratura của Chopin nối với bel canto; chú giải Wydanie Narodowe nói Chopin thêm biến thể khi dạy. Câu nói chung (\"bắt chước những đường luyến láy của ca sĩ opera\"). Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://artsandculture.google.com/story/1gVhSXNkNEwf-g", "https://www.musicollege.ntnu.edu.tw/wp-content/uploads/2022/12/37.01-安派‧布拉納普拉普魯克／蕭邦的歌唱旋律：花腔及其他【英文】.pdf" ]
    luot_2_ghi_chu: Nocturne của Chopin có trang trí 'rich and refined ornamentation' mang tính hát; ông muốn bắt chước hát opera trên piano; nghiên cứu NTNU nối lối trang trí với coloratura/bel canto.
  - id: n8
    cau: Thời Baroque, người chơi được trông đợi tự thêm nốt hoa mỹ.
    loai: lich-su
    nguon:
      - wiki-orn
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Wikipedia: \"In the Baroque period, it was common for performers to improvise ornamentation\"; Dolmetsch: trước thế kỷ 19 ký hiệu ghi với nhiều tự do."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/ornamentation-music", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "Britannica: thế kỷ 18 người chơi tự thêm vào những đường giai điệu thưa; Dolmetsch: ngoài ký hiệu còn thêm passaggi, roulades ngay tại chỗ."
  - id: n9
    cau: Quy ước nốt hoa mỹ khác nhau theo từng nước, có khi theo từng nhà soạn nhạc.
    loai: lich-su
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: bảng ký hiệu Pháp từ Chambonnières (1670); Wikipedia: agrément là cách trang trí kiểu Pháp; bảng d'Anglebert (1689) khác bảng Bach (1720)."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "Dolmetsch: ornamentation khác nhau từng thời kỳ và từng nước; Couperin đòi chơi đúng như ghi, d'Anglebert dùng hệ thống riêng."
  - id: n10
    cau: Nhiều tập nhạc Pháp in kèm bảng giải thích ký hiệu ngay ở đầu.
    loai: lich-su
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: bảng ký hiệu Pháp từ Chambonnières (1670); Wikipedia: bảng ở Pièces de clavecin (1689) của d'Anglebert."
