ghi_chu: 'Review D4-gom (nhóm C, 28/10/2026): quyết các câu null, khong-chac, ve-site. Láy rền của Chopin (n40): hai nguồn mâu thuẫn (Dolmetsch: Weber, Chopin, Mendelssohn nhìn chung bắt đầu từ nốt trên; chú giải Wydanie Narodowe: nhiều chỗ bắt đầu từ nốt chính) nên trang nêu cả hai; n37, n39 (Cổ điển, đầu thế kỷ 19) giữ, khớp Dolmetsch. "Nachschlag": Dolmetsch dùng chữ Nachslag cho một kiểu nốt hoa mỹ khác (nốt nhỏ sau nốt chính, C. P. E. Bach không ưa), còn Versuch I.2.3 §13 dùng Nachschlag cho nốt kết của láy rền (đã đọc lại: "hat allezeit einen Nachschlag"); trang dùng theo Versuch, không mâu thuẫn. Sửa trang ở n40, n43, n62 và n69 (khối 8), n67, n73, n74, n82, n89, n90 (bỏ), n95, n96; n15, n94 đổi nhãn thành ve-site.'
