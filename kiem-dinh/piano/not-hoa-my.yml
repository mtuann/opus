    luot_2_ghi_chu: "Mutopia (nguồn IMSLP), Aria BWV 988: các ký hiệu láy rền, láy ngắt, láy quanh, nốt nhỏ xuất hiện ở khoảng 24 trên 32 ô tay phải; 'phần lớn các ô' đúng (số đếm do công cụ đọc web tóm tắt, mang tính ước lượng)."
  - id: n68
    cau: Một dấu hóa nhỏ đặt trên hoặc dưới ký hiệu láy áp dụng cho nốt phụ.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: dấu hóa phía trên ký hiệu cho nốt phụ phía trên, phía dưới cho nốt phụ phía dưới."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto" ]
    luot_2_ghi_chu: "COM: dấu hóa trên ký hiệu mordent áp dụng cho nốt trên, dưới ký hiệu cho nốt dưới; turn: dấu hóa trên hay dưới chỉ biến âm nốt trên hay dưới."
  - id: n69
    cau: "Ví dụ 3: (a) đi xuống tới nốt có láy trên, (b) đi lên, (c) láy dưới; khối 7 chơi theo cách đọc thế kỷ 19, khối 8 \"Chơi theo cách đọc Baroque (láy rền ngắn, bốn nốt)\"; ở (a) hai khối gần giống nhau, nốt Mi ngân thêm vào phách; ở (b) bốn nốt từ Mi so với ba nốt từ Rê. Với giai điệu đi lên, ký hiệu thường được đọc như Trillo của bảng Bach 1720: láy rền bắt đầu từ nốt trên, đúng phách."
    loai: cau-truc
    nguon:
      - dolmetsch-orn
      - commons-bach-bang
    ket_qua: da-sua
    ghi_chu: "Khối 6, 7, 8 đối chiếu từng nốt: 7(a) e2 d e d, 8(a) e2- e d e d với nốt Mi nối, 7(b) c2 d e d (ba nốt từ Rê), 8(b) c2 e d e d (bốn nốt từ Mi), (c) A G A. Tiêu đề khối 8 \"theo bảng của Bach\" dùng bốn nốt, trong khi bảng Bach cho Trillo dài sáu nốt; bốn nốt hợp với Pralltriller (Dolmetsch), xem ghi chú khuông nhạc. Review D4-gom: Khối 8 dùng láy trên bốn nốt (trên–chính–trên–chính) nhưng tiêu đề ghi \"theo bảng của Bach\", trong khi bảng Bach viết Trillo dài hơn. Đổi tiêu đề khối 8: \"Chơi theo bảng của Bach\" thành \"Chơi theo cách đọc Baroque (láy rền ngắn, bốn nốt)\"; sửa cùng ô bảng láy trên (n62): \"một láy rền ngắn (Trillo của Bach), thường từ nốt trên: trên–chính–trên–chính\" thành \"một láy rền (Trillo của Bach), thường từ nốt trên, đúng phách; trên nốt ngắn chỉ còn bốn nốt: trên–chính–trên–chính\", và câu giai điệu đi lên: \"như một láy rền ngắn của bảng Bach 1720\" thành \"như Trillo của bảng Bach 1720: láy rền bắt đầu từ nốt trên, đúng phách\". Dolmetsch: Pralltriller bốn nốt; bảng Bach (Commons): Trillo từ nốt trên. Phần còn lại của câu (khối 6, 7, 8 từng nốt) lượt 1 đã đối chiếu, review đọc lại khớp. Người gom (D4-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, encyclopedia.com, OMT, IMSLP chặn hay lỗi), không phải vì nguồn nói khác; giữ theo nguồn lượt 1 và review đã mở, ghi ở trên."
    luot_2: khong-chac
    luot_2_nguon: [ "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat", "https://blog.henle.de/en/2015/04/27/about-the-difficulties-of-notating-ornamentation-%e2%80%93-the-riddle-of-a-neighbouring-trill-tone-in-chopin%e2%80%99s-berceuse/" ]
    luot_2_ghi_chu: Trillo của bảng Bach 1720 bắt đầu từ nốt trên đúng phách (đúng). Nhưng phần 'ví dụ 3' (a, b, c, khối 7/8, nốt Mi ngân thêm, bốn nốt so với ba nốt) mô tả một khuông nhạc cụ thể, và 'giai điệu đi lên thì thường đọc như Trillo' là khái quát không có nguồn đã mở nói; cần đối chiếu khuông.
  - id: n70
    cau: "Dù đọc theo cách nào, láy trên và láy dưới đều phải nhanh và nhẹ: nốt được nghe rõ là nốt chính."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên biểu diễn.
  - id: n71
    cau: "Láy quanh (turn), ký hiệu như chữ S nằm ngang, gồm bốn nốt quanh nốt chính: trên – chính – dưới – chính."
    loai: dinh-nghia
    nguon:
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: \"four notes, the note above, the note itself, the note below\" rồi nốt chính."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto" ]
    luot_2_ghi_chu: "COM: turn (gruppetto) gồm bốn nốt: nốt trên, nốt chính, nốt dưới, nốt chính."
  - id: n72
    cau: Láy quanh đặt ngay trên nốt bắt đầu ngay, đúng phách; đây là Cadence trong bảng của Bach.
    loai: quy-tac
    nguon:
      - commons-bach-bang
    ket_qua: dung
    ghi_chu: "Bảng Bach: Cadence d–c–b–c trên nốt chính c (bắt đầu từ nốt trên)."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto", "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat" ]
    luot_2_ghi_chu: "COM: ký hiệu đặt trên nốt thì thay cho nốt (bắt đầu ngay); bảng Bach: Cadence Rê–Đô–Si–Đô."
  - id: n73
    cau: "Láy quanh đặt giữa hai nốt: chơi nốt chính trước, rồi láy quanh ở cuối giá trị của nốt đó và nối thẳng vào nốt sau."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - ency-gruppetto
    ket_qua: da-sua
    ghi_chu: "chưa chắc: Dolmetsch (phần đã đọc) không nói về vị trí giữa hai nốt; cần nguồn như Rosenblum (1988), Türk hoặc Hummel. Review D4-gom: ODM (Gruppetto, lượt 2): ký hiệu đặt sau nốt thì hình láy theo sau nốt, người chơi tự chia thời gian. Vế \"rất hay gặp trong giai điệu Cổ điển và Lãng mạn\" không nguồn: bỏ. Cũ: \"... nối thẳng vào nốt sau. Kiểu này rất hay gặp trong giai điệu Cổ điển và Lãng mạn.\" Mới: \"... nối thẳng vào nốt sau.\""
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto" ]
    luot_2_ghi_chu: "COD Music (gruppetto/turn): 'perf. after the note itself or instead of it' tùy ký hiệu đặt sau hay trên nốt; láy quanh đặt giữa hai nốt: chơi nốt chính rồi láy ở cuối giá trị nối vào nốt sau là cách đọc chuẩn."
  - id: n74
    cau: "Láy quanh ngược bắt đầu từ nốt dưới: dưới – chính – trên – chính."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - ency-gruppetto
    ket_qua: da-sua
    ghi_chu: "chưa chắc: Dolmetsch xác nhận dãy nốt của inverted turn (dưới, chính, trên, chính) nhưng ở phần đã đọc không mô tả hình ký hiệu (gạch dọc hay lộn ngược). Review D4-gom: ODM, Dolmetsch: láy quanh ngược là dưới–chính–trên–chính. Hình ký hiệu (\"có gạch dọc, hoặc lộn ngược\") không nguồn nào đã mở nói thẳng (Dolmetsch: ký hiệu có gạch trong nhạc Haydn là một kiểu riêng; Bach có khi viết ký hiệu láy quanh dựng đứng): bỏ. Cũ: \"Láy quanh ngược (ký hiệu có gạch dọc, hoặc lộn ngược): bắt đầu từ nốt dưới: ...\" Mới: \"Láy quanh ngược: bắt đầu từ nốt dưới: dưới – chính – trên – chính.\""
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto" ]
    luot_2_ghi_chu: "COD Music: 'the inverted turn, which begins with the lower auxiliary note'; chuỗi dưới–chính–trên–chính là hình chuẩn."
  - id: n75
    cau: Dấu hóa nhỏ phía trên ký hiệu láy quanh áp dụng cho nốt trên, phía dưới cho nốt dưới.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - ency-gruppetto
    ket_qua: dung
    ghi_chu: "chưa chắc: Dolmetsch nêu quy tắc cho ký hiệu láy rền và để tham chiếu \"accidentals and ornamentation\"; không nêu riêng cho láy quanh. Review D4-gom: ODM (Gruppetto, lượt 2): dấu hóa trên hay dưới ký hiệu láy quanh áp cho nốt trên hay nốt dưới. Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto" ]
    luot_2_ghi_chu: "COM: dấu hóa đặt trên hay dưới ký hiệu turn chỉ biến âm nốt trên hay nốt dưới."
  - id: n76
    cau: Ở tốc độ chậm, đừng chơi bốn nốt của láy quanh nhanh như một cú giật ngón, hãy hát chúng.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên biểu diễn.
  - id: n77
    cau: "Ví dụ 4: láy quanh trên nốt Fa và giữa hai nốt Mi–Fa; khối \"chơi\" viết g f e f, g/f/e/f/, và láy quanh ngược e f g f."
    loai: cau-truc
    nguon:
      - ency-gruppetto
    ket_qua: dung
    ghi_chu: "Khối 9, 10: !turn! trên f cho g f e f (trên–chính–dưới–chính); giữa hai nốt: nốt Mi chính rồi g f e f nối vào Sol; ngược: e f g f (dưới–chính–trên–chính). Đúng dãy nốt. Review D4-gom: Thêm nguồn cho dãy nốt láy quanh (ODM). Đã đọc khối 9, 10: !turn!f2 chơi g f e f; giữa hai nốt e4 rồi f2 g/f/e/f/ (Mi giữ trước, láy quanh quanh Fa nối vào Sol); ngược e f g f. Giữ dung."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto" ]
    luot_2_ghi_chu: Về nhạc lý, g f e f là turn thường (trên–chính–dưới–chính) trên Fa; e f g f là turn ngược; đặt giữa Mi–Fa thì chơi sau nốt Mi. Khớp COM. Không mở trang để xem khuông.
  - id: n78
    cau: "Appoggiatura (tiếng Ý appoggiare: tựa vào), còn gọi là nốt dựa."
    loai: ten
    nguon:
      - ency-appog
    ket_qua: dung
    ghi_chu: "chưa chắc: chưa mở từ điển nêu nguồn gốc từ appoggiare. Review D4-gom: ODM (Appoggiatura, lượt 2): từ tiếng Ý, \"leaning note\". Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura" ]
    luot_2_ghi_chu: "COM: appoggiatura từ tiếng Ý, 'Leaning note' (nốt dựa)."
  - id: n79
    cau: Appoggiatura thường viết bằng nốt nhỏ không gạch, có dấu luyến tới nốt chính; rơi đúng phách và lấy thời gian của nốt chính.
    loai: dinh-nghia
    nguon:
      - dolmetsch-orn
      - cpe-versuch
    ket_qua: dung
    ghi_chu: "Dolmetsch: appoggiatura đứng trước nốt chính và lấy một phần giá trị của nó; C. P. E. Bach, mục Vorschläge."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "COM và Dolmetsch (theo C. P. E. Bach): appoggiatura là nốt nhỏ, rơi đúng phách, thời gian lấy từ nốt chính. Dấu luyến chỉ là cách viết thường gặp."
  - id: n80
    cau: Appoggiatura là nốt nghịch nên được nhấn, rồi nốt chính giải quyết nhẹ hơn, như một tiếng thở dài.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: appoggiatura rơi đúng phách, nhấn; nốt chính giải quyết sau đó."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "COM: về hòa âm giống nốt chậm giải; Dolmetsch/C. P. E. Bach: appoggiatura đúng phách, nốt chính theo sau. Mô tả 'tiếng thở dài' là hình ảnh."
  - id: n81
    cau: Trước một nốt chia đôi được (nốt đen, nốt trắng…), appoggiatura lấy một nửa giá trị; trước một nốt có chấm dôi lấy hai phần ba, nốt chính chỉ còn lại giá trị của dấu chấm; quy tắc của C. P. E. Bach (1753) và nhiều sách thế kỷ 18.
    loai: quy-tac
    nguon:
      - cpe-versuch
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "C. P. E. Bach §11: dài bằng nửa nốt chính theo sau; nốt chính có số phách lẻ thì bằng hai phần ba. Dolmetsch: \"takes half its value\", dotted \"two thirds\"."
    luot_2: dung
    luot_2_nguon: [ "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p11.html", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "C. P. E. Bach §11: nửa độ dài nốt chính khi nốt chính chia đôi, hai phần ba khi nốt chính có số phách lẻ; COM: 'half... or two-thirds if dotted'; Dolmetsch: nốt chấm dôi thì lấy hai phần ba."
  - id: n82
    cau: "Không phải nốt nhỏ không gạch nào cũng dài: C. P. E. Bach nêu những nốt dựa luôn ngắn, thường đứng trước một nốt ngắn, có khi trước một nốt được nhắc lại nhiều lần."
    loai: quy-tac
    nguon:
      - cpe-versuch
      - cpe-app13
    ket_qua: da-sua
    ghi_chu: "chưa chắc: C. P. E. Bach §11 nói khi nốt dựa lệch quy tắc nên viết đủ nốt, §26 hứa bàn các nốt nhỏ không phải appoggiatura; các trường hợp ngắn cụ thể chưa đọc. Review D4-gom: C. P. E. Bach, Versuch I.2.2 §13 (review đã mở): nốt dựa ngắn không đổi \"most frequently precede a short main note\", có khi trước nốt dài \"when a note is repeated several times\"; không nói tốc độ nhanh (còn nói nốt dựa ngắn chơi nhanh \"even in a slow tempo\"). Cũ: \"Không phải nốt nhỏ không gạch nào cũng dài: trước nốt nhanh, trước nốt lặp lại, hoặc ở tốc độ nhanh, nhiều nốt dựa được chơi ngắn.\" Mới: \"Không phải nốt nhỏ không gạch nào cũng dài: C. P. E. Bach nêu những nốt dựa luôn ngắn, thường đứng trước một nốt ngắn, có khi trước một nốt được nhắc lại nhiều lần.\""
    luot_2: dung
    luot_2_nguon: [ "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p13.html" ]
    luot_2_ghi_chu: "Versuch I.2.2 §13: 'invariable short appoggiaturas most frequently precede a short main note'; 'sometimes precede long notes when a note is repeated several times'. Khớp."
  - id: n83
    cau: "Acciaccatura (tiếng Ý: \"giập, nghiền\") là nốt nhỏ có gạch chéo, ngắn hết mức có thể; trọng âm rơi vào nốt chính."
    loai: dinh-nghia
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: \"very short (literally crushed)\", lie in front of the principal note; Wikipedia: acciaccare = nghiền."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura" ]
    luot_2_ghi_chu: "COM: acciaccatura ('crushed'), nốt nhỏ có gạch chéo, 'crushed in as quickly as possible', trọng âm và gần hết giá trị ở nốt chính."
  - id: n84
    cau: Trong nhạc đàn phím thế kỷ 18, acciaccatura có khi còn được đánh cùng lúc với nốt chính rồi nhả ngay.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: \"played on the beat together with, or imperceptibly before, the principal note\"; Wikipedia: acciaccatura thế kỷ 18 áp dụng cho nốt của hợp âm rải."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura" ]
    luot_2_ghi_chu: "COM: có nghệ sĩ đàn phím đánh cả hai nốt cùng lúc rồi nhả acciaccatura ngay. COM không nói rõ 'thế kỷ 18'."
  - id: n85
    cau: Đặt acciaccatura đúng phách hay ngay trước phách là chuyện phong cách và vẫn còn được tranh luận.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - ne-nocturnes
    ket_qua: dung
    ghi_chu: "Dolmetsch: cùng lúc hoặc ngay trước phách; ấn bản Quốc gia Chopin: hai cách có thể cho nhóm nốt nhỏ."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory23.htm", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura" ]
    luot_2_ghi_chu: "Dolmetsch: acciaccatura chơi 'on the beat with, or just before' nốt chính; COM: thời gian lấy từ nốt sau, có khi từ nốt trước. Nguồn xác nhận chưa có quy tắc thống nhất."
  - id: n86
    cau: "Bảng so sánh appoggiatura và acciaccatura: hình, thời điểm, độ dài, trọng âm."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - cpe-versuch
    ket_qua: dung
    ghi_chu: Tóm tắt các câu trên, cùng nguồn.
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura" ]
    luot_2_ghi_chu: "Nội dung bảng khớp COM: hình (không gạch/có gạch), thời điểm (đúng phách), độ dài (nửa hay hai phần ba so với 'ngắn hết mức'), trọng âm (nốt dựa nhấn, acciaccatura dồn vào nốt chính)."
  - id: n87
    cau: "Ví dụ 5: ô 1 nốt dựa Mi trước nốt trắng Rê lấy một nốt đen; ô 2 nốt dựa Si trước nốt trắng chấm dôi Đô lấy hai phần ba, Đô còn một phách; ô 3 acciaccatura Fa♯ ngắn hết mức, trọng âm vào Sol."
    loai: cau-truc
    nguon:
      - cpe-versuch
    ket_qua: dung
    ghi_chu: "Khối 11 và 12: g2 {e}d4 chơi e8 d8 (e = 1/2 của d trắng = đen) ; {B}c6 chơi B16 c8 (B = 2/3 của 3 phách = 2 phách, c còn 1 phách); {/^f}g chơi ^f g7. Đối chiếu số học."
    luot_2: dung
    luot_2_nguon: [ "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p11.html", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura" ]
    luot_2_ghi_chu: "Về nhạc lý khớp quy tắc: trước nốt trắng lấy nửa (nốt đen); trước nốt trắng chấm dôi (ba phách) lấy hai phần ba (hai phách), nốt chính còn một phách; Fa♯ là nửa cung dưới Sol cho acciaccatura. Không mở trang để xem khuông."
  - id: n88
    cau: "Một đường lượn sóng thẳng đứng trước hợp âm nghĩa là rải hợp âm: chơi lần lượt từ nốt thấp nhất lên, rất nhanh, và giữ các nốt lại."
    loai: dinh-nghia
    nguon:
      - ne-nocturnes
    ket_qua: dung
    ghi_chu: "Ấn bản Quốc gia Chopin: \"All the arpeggios should start together with the corresponding L.H. notes\" dùng ký hiệu theo nghĩa rải từ dưới lên."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musicalsymbols.htm", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "Dolmetsch: arpeggio là hợp âm rải, ký hiệu đường lượn sóng dọc, thường từ dưới lên, mũi tên chỉ xuống nếu rải từ trên xuống. 'Giữ các nốt lại' là cách chơi chuẩn, không trang đã mở nói thẳng."
  - id: n89
    cau: "Đường lượn sóng liền qua cả hai khuông: rải một lần từ nốt thấp nhất của tay trái lên nốt cao nhất của tay phải; hai đường riêng cho hai tay: không nhất thiết rải cùng lúc (chú giải ấn bản Quốc gia Ba Lan cho các nocturne của Chopin: hai đường riêng không nhất thiết rải đồng thời, có chỗ chỉ cho biết cách chia hợp âm giữa hai tay); có mũi tên chỉ xuống: rải từ trên xuống."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "chưa chắc: quy ước ký hiệu chuẩn nhưng chưa có nguồn bậc 1–2 đã mở (ví dụ giáo trình lý thuyết nhạc ký hiệu). Review D4-gom: Dolmetsch (review đã mở): \"if a single arpeggio sign extends across both staves then the two hands play successively\"; mũi tên chỉ xuống cho rải từ trên xuống. Chú giải Wydanie Narodowe (Nocturne Op. 48 số 1): \"Separate wavy lines for chords played with the left and right hands need not denote simultaneous arpeggiation\"; Op. 55 số 1: hai đường riêng \"merely indicate the division of the chords between the hands\". Cũ: \"Hai đường riêng cho hai tay: hai tay rải cùng lúc.\" Mới: \"Hai đường riêng cho hai tay: không nhất thiết là hai tay rải cùng lúc. Chú giải của ấn bản Quốc gia Ba Lan cho các nocturne của Chopin ghi rằng hai đường riêng không nhất thiết là rải đồng thời, có chỗ chỉ cho biết cách chia hợp âm giữa hai tay.\""
    luot_2: dung
    luot_2_nguon: [ "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf" ]
    luot_2_ghi_chu: "Chú giải Nocturnes (Op. 48 số 1): 'Separate wavy lines for chords played with the left and right hands need not denote simultaneous arpeggiation', nguyên tắc áp dụng cho các tác phẩm khác của Chopin. Quy ước đường lượn liền hai khuông và mũi tên xuống là chuẩn."
  - id: n90
    cau: Trong nhạc Baroque và Cổ điển, nốt thấp nhất của hợp âm rải thường rơi đúng phách.
    loai: quy-tac
    nguon:
      - wiki-orn
    ket_qua: da-bo
    ghi_chu: "chưa chắc: Wikipedia chỉ nói acciaccatura thế kỷ 18 áp dụng cho nốt của hợp âm rải. Cần nguồn riêng. Review D4-gom: Không nguồn bậc 1–2 nào đã mở nói nốt thấp nhất của hợp âm rải Baroque và Cổ điển thường rơi đúng phách (Dolmetsch không nói thời điểm). Bỏ câu \"Trong nhạc Baroque và Cổ điển, nốt thấp nhất thường rơi đúng phách.\"; khối 14 vẫn là ví dụ của site (nốt thấp nhất vào phách, n94)."
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn bậc 2 đã mở nói thẳng nốt thấp nhất của hợp âm rải Baroque/Cổ điển rơi đúng phách (Dolmetsch không nêu thời điểm). Không thấy mâu thuẫn; đúng với thông lệ giảng dạy.
  - id: n91
    cau: Với Chopin, chú giải của ấn bản Quốc gia Ba Lan khuyên bắt đầu hợp âm rải cùng lúc với nốt tương ứng của tay trái.
    loai: quy-tac
    nguon:
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"chú giải của ấn bản Quốc gia Ba Lan (biên tập Jan Ekier) cũng khuyên theo lệ chung bắt đầu hợp âm rải đúng phách, nốt thấp nhất vang cùng tay trái; ngoại lệ là khi hòa âm đã được bàn đạp giữ sẵn, lúc ấy thời điểm bắt đầu không còn quan trọng lắm.\" Chú giải Nocturne: \"All the arpeggios should start together with the corresponding L.H. notes\". Không thấy câu về ngoại lệ bàn đạp; bỏ ngoại lệ và bỏ tên Jan Ekier (chưa mở trang nêu chủ biên)."
    luot_2: dung
    luot_2_nguon: [ "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf", "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/ballades_commentaries.pdf", "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/sonatas_commentaries.pdf" ]
    luot_2_ghi_chu: "Chú giải Wydanie Narodowe nhiều chỗ: hợp âm rải tay phải bắt đầu cùng lúc với nốt tương ứng của tay trái (Ballade Op. 23 ô 32, Sonata Op. 35 ô 41...)."
