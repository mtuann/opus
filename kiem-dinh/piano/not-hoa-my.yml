  - cu: "Hai đường riêng cho hai tay: hai tay rải cùng lúc."
    moi: "Hai đường riêng cho hai tay: không nhất thiết là hai tay rải cùng lúc. Chú giải của ấn bản Quốc gia Ba Lan cho các nocturne của Chopin ghi rằng hai đường riêng không nhất thiết là rải đồng thời, có chỗ chỉ cho biết cách chia hợp âm giữa hai tay."
    ly_do: "n89 (da-sua, review D4-gom): chú giải Wydanie Narodowe (Op. 48 số 1, Op. 55 số 1): hai đường riêng không nhất thiết rải đồng thời."
  - cu: Trong nhạc Baroque và Cổ điển, nốt thấp nhất thường rơi đúng phách. Với Chopin, chú giải của ấn bản Quốc gia Ba Lan (biên tập Jan Ekier) cũng khuyên theo lệ chung bắt đầu hợp âm rải đúng phách, nốt thấp nhất vang cùng tay trái; ngoại lệ là khi hòa âm đã được bàn đạp giữ sẵn, lúc ấy thời điểm bắt đầu không còn quan trọng lắm. Trong nhiều bản nhạc Lãng mạn khác, khi nốt trên cùng là giai điệu, người chơi có thể rải sớm một chút để nốt giai điệu rơi đúng phách; các nghệ sĩ không làm giống nhau.
    moi: Với Chopin, chú giải của ấn bản Quốc gia Ba Lan khuyên bắt đầu hợp âm rải cùng lúc với nốt tương ứng của tay trái. Trong nhiều bản nhạc Lãng mạn khác, khi nốt trên cùng là giai điệu, người chơi có thể rải sớm một chút để nốt giai điệu rơi đúng phách; các nghệ sĩ không làm giống nhau.
    ly_do: "n91 (da-sua): bỏ ngoại lệ bàn đạp và tên người biên tập (chưa có nguồn đã mở).; n90 (da-bo, review D4-gom): không nguồn cho nốt thấp nhất rơi đúng phách ở nhạc Baroque, Cổ điển."
  - cu:
      - 'Fioritura (tiếng Ý: "nở hoa"; số nhiều fioriture) là những chùm nốt trang trí dài, viết bằng nốt nhỏ hoặc thành những nhóm không chia đều (7, 11, 22 nốt… trên một phách của tay trái), bắt chước lối luyến láy của ca sĩ bel canto. Chopin thường đổi chúng mỗi lần chơi; một số biến thể do chính ông viết còn được giữ lại (xem Nocturne Op. 9 số 2).'
      - "Câu hỏi muôn thuở: nốt đầu của chùm vào đúng phách, cùng nốt trầm, hay trước phách? Chú giải của ấn bản Quốc gia Ba Lan trả lời theo từng trường hợp: hợp âm rải và những nốt nhỏ tạo thành hợp âm rải hay quãng rải, theo lệ chung, bắt đầu đúng phách; có những nhóm vài nốt nhỏ chơi trước phách lại thuận hơn; với láy rền, một nốt nhỏ đứng ngay trước dấu tr cho biết láy bắt đầu từ nốt nào (cùng cao độ với nốt chính thì bắt đầu từ nốt chính, ở trên thì từ nốt trên). Với những chùm dài, điều quan trọng hơn cả là những điểm gặp nhau với tay trái:"
    moi:
      - 'Fioritura (tiếng Ý: "nở hoa"; số nhiều fioriture) là những chùm nốt trang trí dài, viết bằng nốt nhỏ hoặc thành những nhóm không chia đều theo phách của tay trái, bắt chước lối luyến láy của ca sĩ bel canto. Chopin còn viết thêm biến thể vào bản nhạc của học trò; Nocturne Op. 9 số 2 có cả một bộ biến thể như thế.'
      - "Câu hỏi muôn thuở: nốt đầu của chùm vào đúng phách, cùng nốt trầm, hay trước phách? Chú giải của ấn bản Quốc gia Ba Lan trả lời theo từng trường hợp: hợp âm rải và những nốt nhỏ tạo thành hợp âm rải hay quãng rải, theo lệ chung, bắt đầu đúng phách; một nhóm vài nốt nhỏ có thể chơi đúng phách hoặc trước phách; với láy rền, một nốt nhỏ đứng ngay trước dấu tr cho biết láy bắt đầu từ nốt nào (nốt nhỏ cùng cao độ với nốt chính thì láy bắt đầu từ nốt chính). Với những chùm dài, điều quan trọng hơn cả là những điểm gặp nhau với tay trái:"
    ly_do: 'n97 (da-sua): sửa theo chú giải: hai cách chơi nhóm nốt nhỏ, bỏ so sánh "thuận hơn".; n98 (da-sua): bỏ vế "ở trên thì từ nốt trên" (chú giải không có).; n95, n96 (da-sua, review D4-gom): bỏ các con số 7, 11, 22 (chưa đếm được trên bản nhạc) và "thường đổi mỗi lần chơi"; theo chú giải Wydanie Narodowe về biến thể Op. 9 số 2.'
