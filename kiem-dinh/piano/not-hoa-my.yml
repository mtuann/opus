  - id: n43
    cau: "Theo cách đọc Baroque, nốt trên rơi đúng phách là một nốt nghịch tựa vào nốt chính, nên láy rền nghe như một chuỗi appoggiatura nối nhau thật nhanh."
    loai: quy-tac
    nguon:
      - fitch-orn
    ket_qua: da-sua
    ghi_chu: "chưa chắc: lời giải thích thẩm mỹ thông dụng, chưa tìm được câu tương ứng trong nguồn đã mở (C. P. E. Bach §3–§5 nói láy rền luôn bắt đầu từ nốt trên nhưng không nói theo cách này). Review D4-gom: Fitch (lượt 2): láy rền kiểu Bach \"begins on the upper note and on the beat\", \"a chain of two or more appoggiaturas\". Phần \"lý do của quy tắc\" và \"bắt đầu từ nốt chính, láy rền mất sức nặng, chỉ còn tiếng rung\" là đánh giá không nguồn: bỏ. Cũ: \"Lý do của quy tắc Baroque: nốt trên rơi đúng phách là một nốt nghịch tựa vào nốt chính, giống một appoggiatura được nhắc lại thật nhanh. Bắt đầu từ nốt chính, láy rền mất đi sức nặng ấy và chỉ còn là một tiếng rung.\" Mới: \"Theo cách đọc Baroque, nốt trên rơi đúng phách là một nốt nghịch tựa vào nốt chính, nên láy rền nghe như một chuỗi appoggiatura nối nhau thật nhanh.\""
    luot_2: dung
    luot_2_nguon: [ "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html" ]
    luot_2_ghi_chu: "C. P. E. Bach, Versuch I.2.3 §5: láy rền thường 'always starts from the second above the main tone'; nốt trên rơi đúng phách là nốt nghịch tựa vào nốt chính theo cách đọc Baroque là mô tả chuẩn; chưa mở được chương OMT nói riêng."
  - id: n44
    cau: "Láy rền thường khép lại bằng nốt kết (tiếng Đức Nachschlag): nốt liền dưới rồi nốt chính, dẫn vào nốt tiếp theo."
    loai: dinh-nghia
    nguon:
      - cpe-triller
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "C. P. E. Bach §13: láy rền trên nốt khá dài có Nachschlag. Dolmetsch: nốt kết là một nốt đơn hoặc một láy quanh; lưu ý Dolmetsch ghi C. P. E. Bach \"không ưa\" Nachschlag, trái với §13 đã đọc; để review xem hai cách dùng chữ Nachschlag có khác nhau không."
    luot_2: dung
    luot_2_nguon: [ "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p13.html", "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p14.html" ]
    luot_2_ghi_chu: "Versuch I.2.3 §§13–14: láy rền có 'termination' (nốt kết), liền dưới rồi nốt chính, nối vào nốt kế (Nachschlag)."
