doi_chu:
  - cu:
      - Nhấn. Một láy rền hay một appoggiatura rơi vào phách mạnh tạo ra một nốt nghịch rồi mới giải quyết, như một từ được nhấn giọng. Trên đàn harpsichord, vốn gần như không đổi được độ to, đây là một trong những cách nhấn chủ yếu.
      - Giữ cho nốt dài còn sống. Tiếng harpsichord và piano thời đầu tắt nhanh; một láy rền làm nốt dài tiếp tục rung.
    moi: Nhấn. Một láy rền hay một appoggiatura rơi vào phách mạnh tạo ra một nốt nghịch rồi mới giải quyết, như một từ được nhấn giọng. Trên đàn harpsichord, nốt hoa mỹ là một cách để nhấn và làm rõ phát âm.
    ly_do: "n5 (da-bo): bỏ gạch đầu dòng, không có nguồn.; n4 (da-sua): viết lại theo Britannica (articulation, accentuation)."
  - cu: Vì vậy hãy học nốt hoa mỹ từ một bản Urtext. Lời nói đầu và phần chú giải của G. Henle, Wiener Urtext hay Bärenreiter thường bàn về nốt hoa mỹ của tác giả, và tách bạch ký hiệu có trong nguồn gốc với gợi ý của người biên tập (thường in trong ngoặc hoặc in nhỏ). Các ấn bản "có hướng dẫn" kiểu cũ hay thêm, bớt hoặc viết lại nốt hoa mỹ mà không nói rõ. Bảng tóm tắt ở bài 14 là điểm xuất phát; trang này đi sâu hơn.
    moi: Vì vậy hãy học nốt hoa mỹ từ một bản Urtext. Ấn bản Urtext tách bạch ký hiệu có trong nguồn gốc với gợi ý của người biên tập (thường in trong ngoặc hoặc in nhỏ), và lời nói đầu của nhà xuất bản như G. Henle nêu cách hiểu các dấu của tác giả. Các ấn bản "có hướng dẫn" thêm cách hiểu của người biên tập vào bản nhạc. Bảng tóm tắt ở bài 14 là điểm xuất phát; trang này đi sâu hơn.
    ly_do: 'n12 (da-sua): bỏ tên Wiener Urtext, Bärenreiter và chữ "thường bàn về nốt hoa mỹ" (chưa có nguồn); giữ phần Shar Music và Henle xác nhận.; n13 (da-sua): bỏ "thêm, bớt hoặc viết lại ... mà không nói rõ" (không có nguồn).'
