    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory23.htm", "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/" ]
    luot_2_ghi_chu: "Dolmetsch: Hummel (1828) mới đề nghị bắt đầu từ nốt chính, nghĩa là trước đó nốt trên vẫn là chuẩn; Dùng chữ 'phần lớn' là thận trọng."
  - id: n38
    cau: Một nốt nhỏ đứng ngay trước dấu tr cho biết rõ nốt bắt đầu của láy rền (thời Cổ điển).
    loai: quy-tac
    nguon:
