    luot_2_ghi_chu: "Mô tả sách của Princeton UP: Neumann 'questions the validity of the rigid principles' về cách chơi nốt hoa mỹ và cho rằng ràng buộc cứng nhắc không hợp với tự do của nhạc công thời ấy."
