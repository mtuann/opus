  - id: n35
    cau: Thời Baroque (Bach, Handel), láy rền bắt đầu từ nốt trên, đúng phách; C. P. E. Bach (1753) nói láy rền thường (ordentlicher Triller) "luôn bắt đầu từ nốt trên", và còn tả những kiểu láy khác, như láy đi lên từ dưới.
    loai: quy-tac
    nguon:
      - cpe-triller
      - wiki-orn
    ket_qua: da-sua
    ghi_chu: "C. P. E. Bach, Versuch, §5: láy rền luôn bắt đầu từ nốt phụ trên. Wikipedia: thời Baroque và Cổ điển láy rền bắt đầu bằng nốt trên. Kiểm mẫu D4 (chủ repo, 28/10/2026): chữ \"luôn\" chỉ đúng cho láy rền thường; C. P. E. Bach liệt kê bốn kiểu láy rền (§3), có kiểu đi lên từ dưới. Trang giới hạn lại câu."
    luot_2: dung
    luot_2_nguon: [ "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html", "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: "C. P. E. Bach, Versuch I.2.3 §5: 'It always starts from the second above the main tone.' Dolmetsch: bắt đầu từ nốt trên là thực hành chủ đạo giữa thế kỷ 18."
  - id: n36
    cau: "Ngoại lệ ở thời Baroque: nốt trên vừa vang ngay trước đó (giai điệu đi xuống liền bậc) thì được nối sang, không đánh lại."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - fitch-orn
    ket_qua: dung
    ghi_chu: "chưa chắc: Dolmetsch chỉ nêu nối nốt đầu cho Pralltriller (chỉ sau một nốt đi xuống liền bậc, nốt đầu nối với nốt đứng trước). Chưa thấy ở nguồn đã mở quy tắc nối tương ứng cho láy rền thường. Review D4-gom: Fitch (lượt 2): láy rền nối (tremblement lié), nốt đầu trùng nốt trước thì nối, không đánh lại; Dolmetsch: Pralltriller chỉ sau bước đi xuống, nốt đầu nối với nốt trước. Giữ."
    luot_2: dung
