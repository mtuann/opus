    ket_qua: dung
    ghi_chu: "chưa chắc: ấn bản Quốc gia Chopin nêu nguyên tắc này cho Chopin (nốt nhỏ cùng cao độ với nốt chính thì láy bắt đầu từ nốt chính); chưa có nguồn riêng cho thời Cổ điển. Review D4-gom: C. P. E. Bach, Versuch I.2.3 §5 (lượt 2): nốt nhỏ đứng trước láy rền chỉ cách bắt đầu. Giữ."
    luot_2: dung
    luot_2_nguon: [ "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html" ]
