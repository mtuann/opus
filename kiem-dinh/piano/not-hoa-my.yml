    ghi_chu: "Câu cũ gọi cả hai trường hợp là \"láy trên\". Dolmetsch: Pralltriller chỉ xuất hiện sau một nốt đi xuống liền bậc; ở chỗ khác ký hiệu răng cưa không gạch đọc như láy rền ngắn của bảng Bach 1720, bắt đầu từ nốt trên. Sửa lời để không gán Pralltriller cho trường hợp đi lên."
  - id: n66
    cau: Trong bản Bach-Gesellschaft của Invention số 1, nốt Si móc đơn ở ô 1 mang ký hiệu không gạch và đi xuống từ nốt Đô ngay trước nó; bài này cũng có ký hiệu có gạch.
    loai: cau-truc
    nguon:
      - mutopia-inv1
    ket_qua: dung
    ghi_chu: "Bản chép Mutopia của bản Bach-Gesellschaft: ô 1 \"g8 c b^\\prall c\" (prall trên nốt si sau c đi xuống); ô 5 \"\\mordent\" trên c', ô 13 trên d'. Ô 2, 6, 8 cũng có prall."
  - id: n67
    cau: Aria mở đầu Biến khúc Goldberg gần như ô nào cũng có nốt hoa mỹ.
    loai: cau-truc
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở bản nhạc Aria BWV 988. Trang nghe-nhac/bach-goldberg đã chuyển; để lô tác phẩm kiểm."
  - id: n68
    cau: Một dấu hóa nhỏ đặt trên hoặc dưới ký hiệu láy áp dụng cho nốt phụ.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: dấu hóa phía trên ký hiệu cho nốt phụ phía trên, phía dưới cho nốt phụ phía dưới."
  - id: n69
    cau: "Ví dụ 3: (a) đi xuống tới nốt có láy trên, (b) đi lên, (c) láy dưới; đọc theo thế kỷ 19 hai khối \"chơi\" gần giống nhau ở (a), nốt Mi ngân thêm vào phách; (b) bốn nốt từ Mi so với ba nốt từ Rê."
    loai: cau-truc
    nguon: []
    ket_qua: dung
    ghi_chu: "Khối 6, 7, 8 đối chiếu từng nốt: 7(a) e2 d e d, 8(a) e2- e d e d với nốt Mi nối, 7(b) c2 d e d (ba nốt từ Rê), 8(b) c2 e d e d (bốn nốt từ Mi), (c) A G A. Tiêu đề khối 8 \"theo bảng của Bach\" dùng bốn nốt, trong khi bảng Bach cho Trillo dài sáu nốt; bốn nốt hợp với Pralltriller (Dolmetsch), xem ghi chú khuông nhạc."
  - id: n70
    cau: "Dù đọc theo cách nào, láy trên và láy dưới đều phải nhanh và nhẹ: nốt được nghe rõ là nốt chính."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên biểu diễn.
  - id: n71
    cau: "Láy quanh (turn), ký hiệu như chữ S nằm ngang, gồm bốn nốt quanh nốt chính: trên – chính – dưới – chính."
    loai: dinh-nghia
    nguon:
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: \"four notes, the note above, the note itself, the note below\" rồi nốt chính."
  - id: n72
    cau: Láy quanh đặt ngay trên nốt bắt đầu ngay, đúng phách; đây là Cadence trong bảng của Bach.
    loai: quy-tac
    nguon:
      - commons-bach-bang
    ket_qua: dung
    ghi_chu: "Bảng Bach: Cadence d–c–b–c trên nốt chính c (bắt đầu từ nốt trên)."
  - id: n73
    cau: "Láy quanh đặt giữa hai nốt: chơi nốt chính trước, rồi láy quanh ở cuối giá trị của nốt đó và nối thẳng vào nốt sau; kiểu này rất hay gặp trong giai điệu Cổ điển và Lãng mạn."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: null
    ghi_chu: "chưa chắc: Dolmetsch (phần đã đọc) không nói về vị trí giữa hai nốt; cần nguồn như Rosenblum (1988), Türk hoặc Hummel."
  - id: n74
    cau: "Láy quanh ngược (ký hiệu có gạch dọc, hoặc lộn ngược) bắt đầu từ nốt dưới: dưới – chính – trên – chính."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: null
    ghi_chu: "chưa chắc: Dolmetsch xác nhận dãy nốt của inverted turn (dưới, chính, trên, chính) nhưng ở phần đã đọc không mô tả hình ký hiệu (gạch dọc hay lộn ngược)."
  - id: n75
    cau: Dấu hóa nhỏ phía trên ký hiệu láy quanh áp dụng cho nốt trên, phía dưới cho nốt dưới.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: null
    ghi_chu: "chưa chắc: Dolmetsch nêu quy tắc cho ký hiệu láy rền và để tham chiếu \"accidentals and ornamentation\"; không nêu riêng cho láy quanh."
  - id: n76
    cau: Ở tốc độ chậm, đừng chơi bốn nốt của láy quanh nhanh như một cú giật ngón, hãy hát chúng.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên biểu diễn.
  - id: n77
    cau: "Ví dụ 4: láy quanh trên nốt Fa và giữa hai nốt Mi–Fa; khối \"chơi\" viết g f e f, g/f/e/f/, và láy quanh ngược e f g f."
    loai: cau-truc
    nguon: []
    ket_qua: dung
    ghi_chu: "Khối 9, 10: !turn! trên f cho g f e f (trên–chính–dưới–chính); giữa hai nốt: nốt Mi chính rồi g f e f nối vào Sol; ngược: e f g f (dưới–chính–trên–chính). Đúng dãy nốt."
  - id: n78
    cau: "Appoggiatura (tiếng Ý appoggiare: tựa vào), còn gọi là nốt dựa."
    loai: ten
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở từ điển nêu nguồn gốc từ appoggiare."
  - id: n79
    cau: Appoggiatura thường viết bằng nốt nhỏ không gạch, có dấu luyến tới nốt chính; rơi đúng phách và lấy thời gian của nốt chính.
    loai: dinh-nghia
    nguon:
      - dolmetsch-orn
      - cpe-versuch
    ket_qua: dung
    ghi_chu: "Dolmetsch: appoggiatura đứng trước nốt chính và lấy một phần giá trị của nó; C. P. E. Bach, mục Vorschläge."
  - id: n80
    cau: Appoggiatura là nốt nghịch nên được nhấn, rồi nốt chính giải quyết nhẹ hơn, như một tiếng thở dài.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: appoggiatura rơi đúng phách, nhấn; nốt chính giải quyết sau đó."
  - id: n81
    cau: Trước một nốt chia đôi được (nốt đen, nốt trắng…), appoggiatura lấy một nửa giá trị; trước một nốt có chấm dôi lấy hai phần ba, nốt chính chỉ còn lại giá trị của dấu chấm; quy tắc của C. P. E. Bach (1753) và nhiều sách thế kỷ 18.
    loai: quy-tac
    nguon:
      - cpe-versuch
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "C. P. E. Bach §11: dài bằng nửa nốt chính theo sau; nốt chính có số phách lẻ thì bằng hai phần ba. Dolmetsch: \"takes half its value\", dotted \"two thirds\"."
  - id: n82
    cau: "Không phải nốt nhỏ không gạch nào cũng dài: trước nốt nhanh, trước nốt lặp lại, hoặc ở tốc độ nhanh, nhiều nốt dựa được chơi ngắn."
    loai: quy-tac
    nguon:
      - cpe-versuch
    ket_qua: null
    ghi_chu: "chưa chắc: C. P. E. Bach §11 nói khi nốt dựa lệch quy tắc nên viết đủ nốt, §26 hứa bàn các nốt nhỏ không phải appoggiatura; các trường hợp ngắn cụ thể chưa đọc."
  - id: n83
    cau: "Acciaccatura (tiếng Ý: \"giập, nghiền\") là nốt nhỏ có gạch chéo, ngắn hết mức có thể; trọng âm rơi vào nốt chính."
    loai: dinh-nghia
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: \"very short (literally crushed)\", lie in front of the principal note; Wikipedia: acciaccare = nghiền."
  - id: n84
    cau: Trong nhạc đàn phím thế kỷ 18, acciaccatura có khi còn được đánh cùng lúc với nốt chính rồi nhả ngay.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: \"played on the beat together with, or imperceptibly before, the principal note\"; Wikipedia: acciaccatura thế kỷ 18 áp dụng cho nốt của hợp âm rải."
  - id: n85
    cau: Đặt acciaccatura đúng phách hay ngay trước phách là chuyện phong cách và vẫn còn được tranh luận.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - ne-nocturnes
    ket_qua: dung
    ghi_chu: "Dolmetsch: cùng lúc hoặc ngay trước phách; ấn bản Quốc gia Chopin: hai cách có thể cho nhóm nốt nhỏ."
  - id: n86
    cau: "Bảng so sánh appoggiatura và acciaccatura: hình, thời điểm, độ dài, trọng âm."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - cpe-versuch
    ket_qua: dung
    ghi_chu: Tóm tắt các câu trên, cùng nguồn.
  - id: n87
    cau: "Ví dụ 5: ô 1 nốt dựa Mi trước nốt trắng Rê lấy một nốt đen; ô 2 nốt dựa Si trước nốt trắng chấm dôi Đô lấy hai phần ba, Đô còn một phách; ô 3 acciaccatura Fa♯ ngắn hết mức, trọng âm vào Sol."
    loai: cau-truc
    nguon:
      - cpe-versuch
    ket_qua: dung
    ghi_chu: "Khối 11 và 12: g2 {e}d4 chơi e8 d8 (e = 1/2 của d trắng = đen) ; {B}c6 chơi B16 c8 (B = 2/3 của 3 phách = 2 phách, c còn 1 phách); {/^f}g chơi ^f g7. Đối chiếu số học."
  - id: n88
    cau: "Một đường lượn sóng thẳng đứng trước hợp âm nghĩa là rải hợp âm: chơi lần lượt từ nốt thấp nhất lên, rất nhanh, và giữ các nốt lại."
    loai: dinh-nghia
    nguon:
      - ne-nocturnes
    ket_qua: dung
    ghi_chu: "Ấn bản Quốc gia Chopin: \"All the arpeggios should start together with the corresponding L.H. notes\" dùng ký hiệu theo nghĩa rải từ dưới lên."
  - id: n89
    cau: "Đường lượn sóng liền qua cả hai khuông: rải một lần từ nốt thấp nhất của tay trái lên nốt cao nhất của tay phải; hai đường riêng cho hai tay: rải cùng lúc; có mũi tên chỉ xuống: rải từ trên xuống."
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: quy ước ký hiệu chuẩn nhưng chưa có nguồn bậc 1–2 đã mở (ví dụ giáo trình lý thuyết nhạc ký hiệu)."
  - id: n90
    cau: Trong nhạc Baroque và Cổ điển, nốt thấp nhất của hợp âm rải thường rơi đúng phách.
    loai: quy-tac
    nguon:
      - wiki-orn
    ket_qua: null
    ghi_chu: "chưa chắc: Wikipedia chỉ nói acciaccatura thế kỷ 18 áp dụng cho nốt của hợp âm rải. Cần nguồn riêng."
  - id: n91
    cau: Với Chopin, chú giải của ấn bản Quốc gia Ba Lan khuyên bắt đầu hợp âm rải cùng lúc với nốt tương ứng của tay trái.
    loai: quy-tac
    nguon:
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"chú giải của ấn bản Quốc gia Ba Lan (biên tập Jan Ekier) cũng khuyên theo lệ chung bắt đầu hợp âm rải đúng phách, nốt thấp nhất vang cùng tay trái; ngoại lệ là khi hòa âm đã được bàn đạp giữ sẵn, lúc ấy thời điểm bắt đầu không còn quan trọng lắm.\" Chú giải Nocturne: \"All the arpeggios should start together with the corresponding L.H. notes\". Không thấy câu về ngoại lệ bàn đạp; bỏ ngoại lệ và bỏ tên Jan Ekier (chưa mở trang nêu chủ biên)."
  - id: n92
    cau: Trong nhiều bản nhạc Lãng mạn khác, khi nốt trên cùng là giai điệu, người chơi có thể rải sớm một chút để nốt giai điệu rơi đúng phách; các nghệ sĩ không làm giống nhau.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Gợi ý biểu diễn dùng từ "có thể"; không khẳng định sự kiện.
  - id: n93
    cau: "Tốc độ rải tùy tính cách: chậm như đàn harp trong một đoạn mơ màng, nhanh và gọn trong một đoạn mạnh mẽ; hợp âm quá rộng so với bàn tay (chẳng hạn quãng mười) thường cũng được rải dù không có ký hiệu."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên biểu diễn.
  - id: n94
    cau: "Ví dụ 6: hợp âm được rải chậm (mỗi nốt cách nhau một móc kép); khối \"chơi\" cho nốt thấp nhất vào đúng phách, các nốt được giữ lại."
    loai: cau-truc
    nguon: []
    ket_qua: dung
    ghi_chu: "Khối 13, 14: E-[EG]-[EGc]6 trong 2/4 với L:1/16 là E, rồi [EG] sau một móc kép, rồi [EGc]; đủ 8 móc kép mỗi ô."
  - id: n95
    cau: "Fioritura (tiếng Ý: \"nở hoa\"; số nhiều fioriture) là những chùm nốt trang trí dài, viết bằng nốt nhỏ hoặc thành những nhóm không chia đều (7, 11, 22 nốt… trên một phách của tay trái), bắt chước lối luyến láy của ca sĩ bel canto."
    loai: dinh-nghia
    nguon:
      - rider-chopin
    ket_qua: null
    ghi_chu: "chưa chắc: nghĩa \"nở hoa\" của fioritura và các số 7, 11, 22 chưa mở bản nhạc hay từ điển; chưa có nguồn bậc 1–2."
  - id: n96
    cau: Chopin thường đổi chúng mỗi lần chơi; một số biến thể do chính ông viết còn được giữ lại (Nocturne Op. 9 số 2).
    loai: lich-su
    nguon:
      - hebis-eigeldinger
    ket_qua: null
    ghi_chu: "chưa chắc: Eigeldinger (Cambridge University Press 1986) là nguồn thích hợp nhưng chưa mở được nội dung; bản ghi thư mục chỉ xác nhận sách tồn tại."
  - id: n97
    cau: Theo chú giải của ấn bản Quốc gia Ba Lan, hợp âm rải và những nốt nhỏ tạo thành hợp âm rải hay quãng rải, theo lệ chung, bắt đầu đúng phách; một nhóm vài nốt nhỏ có hai cách chơi, đúng phách hoặc trước phách.
    loai: quy-tac
    nguon:
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"có những nhóm vài nốt nhỏ chơi trước phách lại thuận hơn\". Chú giải Nocturne: nốt nhỏ tạo hợp âm rải bắt đầu cùng nốt tay trái, và với nhóm nốt nhỏ có hai cách chơi có thể; không nói cách nào \"thuận hơn\" nên bỏ so sánh."
  - id: n98
    cau: Với láy rền của Chopin, một nốt nhỏ cùng cao độ với nốt chính đứng ngay trước dấu tr cho biết láy bắt đầu từ nốt chính.
    loai: quy-tac
    nguon:
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "Câu cũ thêm: \"ở trên thì từ nốt trên\". Chú giải Nocturne: nốt nhỏ cùng cao độ với nốt láy nghĩa là láy bắt đầu từ nốt chính; không có câu tương ứng cho nốt nhỏ ở trên. Bỏ vế đó (đồng thời sửa lời giải thích của câu hỏi cuối)."
  - id: n99
    cau: "Với chùm nốt dài của Chopin, điều quan trọng hơn cả là những điểm gặp nhau với tay trái; bốn bước: học giai điệu khung, đánh dấu điểm khớp, tập riêng chùm cho đều rồi ghép chậm, tạo dáng và giữ chùm nhỏ hơn giai điệu."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n100
    cau: Trang Nocturne Op. 9 số 2 có một bài tập chuẩn bị riêng cho kỹ năng fioritura.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Trang piano/tac-pham/chopin-nocturne-op9-2 chưa chuyển. Đã kiểm trên opus-zero/docs/piano/tac-pham/chopin-nocturne-op9-2.md: bảng khó khăn có hàng \"Chùm nốt hoa mỹ (fioritura)\" kèm cách tập; lô chuyển trang đó phải giữ bài tập này (hoặc sửa câu ở trang này)."
    review: null
  - id: n101
    cau: "Mục \"Tập nốt hoa mỹ thế nào\": quyết định cách chơi trước rồi viết bằng bút chì; tập chậm với đúng số nốt; nhẹ hơn nốt chính (trừ appoggiatura); giữ nhịp, lỗi phổ biến nhất là \"dừng lại để láy\"; ít mà sạch; nghe đúng phong cách (Bach trên harpsichord, Mozart trên fortepiano, ca sĩ trước khi chơi Chopin)."
    loai: khuyen-tap
