nhan_dinh:
  - id: n1
    cau: Nốt hoa mỹ là những nốt trang trí được ghi tắt bằng một ký hiệu hoặc bằng nốt nhỏ.
    loai: dinh-nghia
    nguon:
      - cod-orn
    ket_qua: dung
    ghi_chu: "Concise Oxford Dictionary of Music, mục Ornaments: nốt trang trí ghi bằng ký hiệu hay nốt nhỏ (grace notes); cùng nghĩa với trang này."
  - id: n2
    cau: Cùng một ký hiệu có thể được chơi khác nhau tùy thời kỳ và tùy nhà soạn nhạc.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: trước thế kỷ 19 ký hiệu được ghi với nhiều tự do; chữ \"mordent\" và \"inverted mordent\" đổi nghĩa theo thời và theo tác giả."
  - id: n3
    cau: Một láy rền hay một appoggiatura rơi vào phách mạnh tạo ra một nốt nghịch rồi mới giải quyết, như một từ được nhấn giọng.
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - cpe-triller
    ket_qua: dung
    ghi_chu: Láy rền Baroque bắt đầu từ nốt trên đúng phách (C. P. E. Bach §5), nốt trên nghịch với hòa âm; appoggiatura rơi đúng phách và lấy thời gian của nốt chính (Dolmetsch).
  - id: n4
    cau: Trên đàn harpsichord, vốn gần như không đổi được độ to, đây là một trong những cách nhấn chủ yếu.
    loai: quy-tac
    nguon:
      - britannica-orn
    ket_qua: da-sua
    ghi_chu: "Britannica, Ornamentation: trên đàn harpsichord nốt hoa mỹ dùng để phát âm và nhấn (articulation, accentuation). \"Gần như không đổi được độ to\" và \"một trong những cách chủ yếu\" không có trong nguồn đã mở; viết lại theo Britannica."
  - id: n5
    cau: "Giữ cho nốt dài còn sống: tiếng harpsichord và piano thời đầu tắt nhanh; một láy rền làm nốt dài tiếp tục rung."
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: Không tìm được nguồn bậc 1 hay 2 cho việc láy rền được dùng để giữ nốt dài vang (đã đọc Britannica, Concise Oxford Dictionary of Music, Dolmetsch). Bỏ gạch đầu dòng.
  - id: n6
    cau: Láy rền ở nốt áp chót của câu là dấu hiệu quen thuộc của kết trong nhạc Baroque và Cổ điển.
    loai: quy-tac
    nguon:
      - cpe-triller
    ket_qua: null
    ghi_chu: "chưa chắc: C. P. E. Bach §13 nói láy rền trên nốt khá dài (kể cả cuối bài và trên dấu ngân) luôn có nốt kết, nhưng chưa thấy ở nguồn đã mở câu nói về \"nốt áp chót của câu\" như dấu hiệu của kết. Cần nguồn về láy rền ở kết (cadential trill)."
  - id: n7
    cau: Nhạc piano thế kỷ 19, nhất là của Chopin, bắt chước những đường luyến láy của ca sĩ opera.
    loai: lich-su
    nguon:
      - rider-chopin
    ket_qua: null
    ghi_chu: "chưa chắc: chỉ có bản ghi thư viện của phim Chopin at the Opera (bậc 3) nói trang trí của Chopin phản ánh ảnh hưởng bel canto (Bellini, Donizetti, Rossini). Chưa mở được Eigeldinger (Cambridge University Press 1986) hay nguồn bậc 1–2 khác."
  - id: n8
    cau: Thời Baroque, người chơi được trông đợi tự thêm nốt hoa mỹ.
    loai: lich-su
    nguon:
      - wiki-orn
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Wikipedia: \"In the Baroque period, it was common for performers to improvise ornamentation\"; Dolmetsch: trước thế kỷ 19 ký hiệu ghi với nhiều tự do."
  - id: n9
    cau: Quy ước nốt hoa mỹ khác nhau theo từng nước, có khi theo từng nhà soạn nhạc.
    loai: lich-su
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: bảng ký hiệu Pháp từ Chambonnières (1670); Wikipedia: agrément là cách trang trí kiểu Pháp; bảng d'Anglebert (1689) khác bảng Bach (1720)."
  - id: n10
    cau: Nhiều tập nhạc Pháp in kèm bảng giải thích ký hiệu ngay ở đầu.
    loai: lich-su
    nguon:
      - dolmetsch-orn
      - wiki-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: bảng ký hiệu Pháp từ Chambonnières (1670); Wikipedia: bảng ở Pièces de clavecin (1689) của d'Anglebert."
  - id: n11
    cau: Càng về sau, nhà soạn nhạc càng ghi chính xác hơn, nhiều khi viết đủ từng nốt.
    loai: lich-su
    nguon:
      - dolmetsch-orn
      - mutopia-k545
    ket_qua: dung
    ghi_chu: "Dolmetsch: trước thế kỷ 19 còn nhiều tự do khi ghi; Mozart K. 545 ô 4 viết đủ nốt kết của láy rền (Mutopia). Câu nói xu hướng chung."
  - id: n12
    cau: Vì vậy hãy học nốt hoa mỹ từ một bản Urtext. Ấn bản Urtext tách bạch ký hiệu của tác giả với phần người biên tập thêm vào (thường in trong ngoặc hoặc in nhỏ).
    loai: quy-tac
    nguon:
      - shar-urtext
      - henle-mozart
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"Lời nói đầu và phần chú giải của G. Henle, Wiener Urtext hay Bärenreiter thường bàn về nốt hoa mỹ của tác giả, và tách bạch ký hiệu có trong nguồn gốc với gợi ý của người biên tập (thường in trong ngoặc hoặc in nhỏ)\". Shar Music: Urtext đánh dấu phần biên tập bằng ngoặc hoặc chữ nhỏ; Henle (Mozart, Klaviersonaten) bàn trong lời nói đầu về dấu của Mozart. Bỏ tên Wiener Urtext và Bärenreiter (chưa mở lời nói đầu của hai nhà này) và chữ \"thường bàn về nốt hoa mỹ\"."
  - id: n13
    cau: Các ấn bản "có hướng dẫn" thêm cách hiểu của người biên tập.
    loai: quy-tac
    nguon:
      - shar-urtext
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"Các ấn bản \"có hướng dẫn\" kiểu cũ hay thêm, bớt hoặc viết lại nốt hoa mỹ mà không nói rõ.\" Shar Music: ấn bản có biên tập thêm cách hiểu của người biên tập; không có nguồn nói \"thêm, bớt hoặc viết lại ... mà không nói rõ\". Giữ phần có nguồn."
  - id: n14
    cau: Liên kết sang bài 13 (Kết) và bài 14 (Ký hiệu biểu diễn); bảng tóm tắt ở bài 14 là điểm xuất phát, trang này đi sâu hơn.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Bài nhac-ly/13-ket và nhac-ly/14-ky-hieu-bieu-dien đã chuyển; bài 14 có bảng ký hiệu nốt hoa mỹ (hồ sơ kiem-dinh/nhac-ly/14-ky-hieu-bieu-dien.yml n57 yêu cầu trang này giải thích kỹ các loại láy: khớp)."
    review: null
  - id: n15
    cau: "Bảng chặng trong lộ trình: chặng 3 (≈ Grade 3) học láy, appoggiatura đơn giản; chặng 4 (≈ Grade 4–5) láy rền Baroque bắt đầu từ nốt trên; chặng 5 (≈ Grade 6) láy rền có nốt kết (Mozart K. 545); chặng 6 (≈ Grade 7–8) fioritura và trang trí kiểu Chopin."
    loai: cap-do
    nguon: []
    ket_qua: dung
    ghi_chu: Nhãn chặng khớp src/data/cap-do.yml (chặng 3 = Grade 3, 4 = Grade 4–5, 5 = Grade 6, 6 = Grade 7–8) và hồ sơ lo-trinh.yml / bat-dau/lo-trinh-choi.yml (đã kiểm ở các lô trước). Nội dung học từng chặng là gợi ý lộ trình của site, không phải quy định của hội đồng thi.
  - id: n16
    cau: Ngày 22 tháng 1 năm 1720, ở Köthen, Johann Sebastian Bach bắt đầu một cuốn sổ dạy đàn cho con trai cả là Wilhelm Friedemann.
    loai: lich-su
    nguon:
      - henle-wfb
      - wiki-wfb
    ket_qua: dung
    ghi_chu: "Lời nói đầu Henle: \"angefangen in Cöthen den 22. Januarii Ao. 1720\"; Friedemann sinh năm 1710."
  - id: n17
    cau: "Khi ấy Wilhelm Friedemann chín tuổi (câu hai lần trên trang: \"khi ấy chín tuổi\" và \"một cậu bé chín tuổi\")."
    loai: nam
    nguon:
      - henle-wfb
    ket_qua: null
    ghi_chu: "chưa chắc: Henle chỉ nêu năm sinh 1710, không nêu ngày; tuổi suy ra từ ngày sinh chưa mở được nguồn (một chỉ dẫn trên mạng ghi \"ten-year-old\"). Cần ngày sinh 22/11/1710 từ nguồn bậc 1–2 mới kết luận \"chín tuổi\"."
  - id: n18
    cau: "Tên cuốn sổ: Clavier-Büchlein vor Wilhelm Friedemann Bach."
    loai: ten
    nguon:
      - wiki-wfb
      - henle-wfb
    ket_qua: dung
    ghi_chu: Tên trên bìa bản gốc theo Wikipedia và IMSLP; Henle dùng tên Klavierbüchlein für Wilhelm Friedemann Bach.
  - id: n19
    cau: "Ngay sau trang giải thích khóa nhạc là bảng Explication unterschiedlicher Zeichen… (\"giải thích các ký hiệu…\"): mười ba kiểu nốt hoa mỹ, mỗi kiểu kèm cách chơi viết đủ nốt."
    loai: cau-truc
    nguon:
      - commons-bach-bang
      - henle-wfb
    ket_qua: dung
    ghi_chu: "Ảnh bảng trên Wikimedia Commons: 13 mục (Trillo, Mordant, Trillo und Mordant, Cadence, hai Doppelt-Cadence, hai Doppelt-Cadence und Mordant, Accent steigend, Accent fallend, Accent und Mordant, hai Accent und Trillo). IMSLP liệt kê \"I. Claves signatae\", rồi \"II. Explication unterschiedlicher Zeichen\"."
  - id: n20
    cau: Cũng cuốn sổ này chứa bản đầu tiên của các Invention, trong đó có Invention số 1.
    loai: lich-su
    nguon:
      - henle-wfb
      - wiki-wfb
    ket_qua: dung
    ghi_chu: "Henle: Invention ở cuối sổ dưới tên Praeambula; IMSLP: 15 Invention là Praeambula 1–15 (Invention 1 = Praeambulum 1)."
  - id: n21
    cau: "Bảng Bach, hàng Trillo (răng cưa ngắn): Rê–Đô–Rê–Đô…, bắt đầu từ nốt trên; gọi ngày nay là láy rền."
    loai: quy-tac
    nguon:
      - commons-bach-bang
      - cpe-triller
    ket_qua: dung
    ghi_chu: "Bảng gốc: Trillo bắt đầu từ nốt trên; C. P. E. Bach §5: láy rền luôn bắt đầu từ nốt trên."
  - id: n22
    cau: "Bảng Bach, hàng Mordant (răng cưa có gạch dọc): Đô–Si–Đô; gọi ngày nay là láy dưới (mordent)."
    loai: quy-tac
    nguon:
      - commons-bach-bang
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Bảng gốc: mordant chơi Đô–Si–Đô; Dolmetsch: mordent dưới là răng cưa có gạch dọc."
  - id: n23
    cau: "Bảng Bach, hàng Trillo und Mordant: láy rền kết bằng Si–Đô; gọi ngày nay là láy rền có nốt kết."
    loai: quy-tac
    nguon:
      - commons-bach-bang
    ket_qua: dung
    ghi_chu: Đối chiếu ảnh bảng (mục 3).
  - id: n24
    cau: "Bảng Bach, hàng Cadence (∽): Rê–Đô–Si–Đô; gọi ngày nay là láy quanh."
    loai: quy-tac
    nguon:
      - commons-bach-bang
    ket_qua: dung
    ghi_chu: "Bảng gốc: Cadence là d–c–b–c khi nốt chính là c."
  - id: n25
    cau: "Bảng Bach, hàng Doppelt-Cadence (hai kiểu): láy quanh, từ trên hoặc từ dưới, nối vào láy rền."
    loai: quy-tac
    nguon:
      - commons-bach-bang
    ket_qua: dung
    ghi_chu: Mục 5 và 6 của bảng.
  - id: n26
    cau: "Bảng Bach, hàng Doppelt-Cadence und Mordant (hai kiểu): như trên, kết bằng Si–Đô."
    loai: quy-tac
    nguon:
      - commons-bach-bang
    ket_qua: dung
    ghi_chu: Mục 7 và 8 của bảng.
  - id: n27
    cau: "Bảng Bach, hàng Accent steigend, Accent fallend: Si rồi Đô; Rê rồi Đô (nốt phụ rơi vào phách); gọi ngày nay là appoggiatura từ dưới, từ trên."
    loai: quy-tac
    nguon:
      - commons-bach-bang
    ket_qua: dung
    ghi_chu: Mục 9 và 10 của bảng.
  - id: n28
    cau: "Bảng Bach, hàng Accent und Mordant và Accent und Trillo: appoggiatura nối vào láy dưới hoặc láy rền."
    loai: quy-tac
