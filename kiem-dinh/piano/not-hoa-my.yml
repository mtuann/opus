  - id: n39
    cau: "Đầu thế kỷ 19 (Beethoven, Schubert) là vùng chuyển tiếp: cần đọc chú giải của bản Urtext, xét từng chỗ."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
    ket_qua: dung
    ghi_chu: "Dolmetsch: cách bắt đầu từ nốt viết chỉ \"nói chung đúng\" cho nhạc sau cuối 1700, Hummel (1828) đã khuyên bắt đầu từ nốt chính; phần \"đọc chú giải\" là lời khuyên."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory23.htm", "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/" ]
    luot_2_ghi_chu: "Dolmetsch: Hummel (1828), Spohr đề nghị bắt đầu từ nốt chính, Weber/Chopin/Mendelssohn vẫn nghiêng nốt trên; đầu thế kỷ 19 là vùng chuyển tiếp, cần xét từng chỗ."
  - id: n40
    cau: "Thời Lãng mạn (Chopin, Schumann, Liszt), láy rền bắt đầu theo cả hai cách; Hummel (1827–1828) khuyên bắt đầu mọi láy rền từ nốt chính; với Chopin các nguồn chưa thống nhất: có nhà nghiên cứu cho rằng ông nhìn chung vẫn bắt đầu từ nốt trên, còn chú giải ấn bản Quốc gia Ba Lan chỉ ra nhiều chỗ nên bắt đầu từ nốt chính."
    loai: quy-tac
    nguon:
      - dolmetsch-orn
      - ne-nocturnes
    ket_qua: da-sua
    ghi_chu: "Chú giải ấn bản Quốc gia Chopin: \"The trills should begin on the principal notes\"; Hummel 1828. Với Schumann, Liszt chưa đọc nguồn riêng; câu nói xu hướng. Review D4-gom: Hai nguồn mâu thuẫn: Dolmetsch (musictheory23, review đã mở lại): \"Weber, Chopin and Mendelssohn generally favoured an upper-note start\", \"Hummel published his unambiguous opinion that a main-note start should be the norm\"; chú giải Wydanie Narodowe (Nocturne) chỉ ra từng chỗ nên bắt đầu từ nốt chính (Op. 55 số 2: \"The trills should begin on the principal notes\"; Op. 62 số 1: nốt nhỏ cùng cao độ). Viết theo mức nguồn, nêu cả hai. Cũ: \"| Lãng mạn (Chopin, Schumann, Liszt) | ngày càng thường từ nốt chính | Hummel, ... khuyên bắt đầu mọi láy rền từ nốt chính |\". Mới: \"| Lãng mạn (Chopin, Schumann, Liszt) | cả hai cách | Hummel, ... khuyên bắt đầu mọi láy rền từ nốt chính. Với Chopin, các nguồn chưa thống nhất: có nhà nghiên cứu cho rằng ông nhìn chung vẫn bắt đầu từ nốt trên, còn chú giải của ấn bản Quốc gia Ba Lan chỉ ra nhiều chỗ nên bắt đầu từ nốt chính; đọc chú giải của từng bản |\". Schumann, Liszt: không nguồn riêng, câu chỉ nói \"cả hai cách\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.earlymusicamerica.org/web-articles/book-review-hummel-provides-invaluable-keyboard-advice/", "https://chopin-nationaledition.com/wp-content/uploads/2019/11/various-works_commentaries.pdf", "https://blog.henle.de/en/2015/04/27/about-the-difficulties-of-notating-ornamentation-%e2%80%93-the-riddle-of-a-neighbouring-trill-tone-in-chopin%e2%80%99s-berceuse/" ]
    luot_2_ghi_chu: "Hummel: 'unequivocal endorsement of commencing all trills on the main note', bản dịch Anh 1828. Ấn bản Quốc gia Chopin (Bolero, Allegro de Concert, Variations Op. 12...): nhiều chỗ 'begin from the main note', vài chỗ từ nốt trên. Henle: có tranh luận main note hay neighbouring note ở Chopin. Chỉ phần 'có nhà nghiên cứu cho rằng ông nhìn chung bắt đầu từ nốt trên' là chưa mở được nguồn cụ thể."
