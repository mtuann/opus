doi_chu:
  - cu:
      - Nhấn. Một láy rền hay một appoggiatura rơi vào phách mạnh tạo ra một nốt nghịch rồi mới giải quyết, như một từ được nhấn giọng. Trên đàn harpsichord, vốn gần như không đổi được độ to, đây là một trong những cách nhấn chủ yếu.
      - Giữ cho nốt dài còn sống. Tiếng harpsichord và piano thời đầu tắt nhanh; một láy rền làm nốt dài tiếp tục rung.
    moi: Nhấn. Một láy rền hay một appoggiatura rơi vào phách mạnh tạo ra một nốt nghịch rồi mới giải quyết, như một từ được nhấn giọng. Trên đàn harpsichord, nốt hoa mỹ là một cách để nhấn và làm rõ phát âm.
    ly_do: "n5 (da-bo): bỏ gạch đầu dòng, không có nguồn.; n4 (da-sua): viết lại theo Britannica (articulation, accentuation)."
  - cu: Vì vậy hãy học nốt hoa mỹ từ một bản Urtext. Lời nói đầu và phần chú giải của G. Henle, Wiener Urtext hay Bärenreiter thường bàn về nốt hoa mỹ của tác giả, và tách bạch ký hiệu có trong nguồn gốc với gợi ý của người biên tập (thường in trong ngoặc hoặc in nhỏ). Các ấn bản "có hướng dẫn" kiểu cũ hay thêm, bớt hoặc viết lại nốt hoa mỹ mà không nói rõ. Bảng tóm tắt ở bài 14 là điểm xuất phát; trang này đi sâu hơn.
    moi: Vì vậy hãy học nốt hoa mỹ từ một bản Urtext. Ấn bản Urtext tách bạch ký hiệu có trong nguồn gốc với gợi ý của người biên tập (thường in trong ngoặc hoặc in nhỏ), và lời nói đầu của nhà xuất bản như G. Henle nêu cách hiểu các dấu của tác giả. Các ấn bản "có hướng dẫn" thêm cách hiểu của người biên tập vào bản nhạc. Bảng tóm tắt ở bài 14 là điểm xuất phát; trang này đi sâu hơn.
    ly_do: 'n12 (da-sua): bỏ tên Wiener Urtext, Bärenreiter và chữ "thường bàn về nốt hoa mỹ" (chưa có nguồn); giữ phần Shar Music và Henle xác nhận.; n13 (da-sua): bỏ "thêm, bớt hoặc viết lại ... mà không nói rõ" (không có nguồn).'
  - cu:
      - Accent und Mordant, Accent und Trillo (hai kiểu)
      - appoggiatura nối vào láy dưới hoặc láy rền
    moi:
      - Accent und Mordant; Accent und Trillo (hai dạng)
      - appoggiatura nối vào láy dưới; appoggiatura nối vào láy rền
    ly_do: "n28 (da-sua): bảng gốc: Accent und Mordant một mục, Accent und Trillo hai mục; tách rõ."
  - cu: 'Bảng viết cho một cậu bé chín tuổi nên rất gọn: nó không nói chơi bao nhiêu nốt, nhanh đến đâu, khi nào được phép làm khác. Giới nghiên cứu vẫn tranh luận về những chỗ trống ấy. Frederick Neumann (1978), chẳng hạn, cho rằng các quy tắc kiểu "luôn bắt đầu từ nốt trên, luôn đúng phách" đã bị áp dụng cứng nhắc hơn nhiều so với cách nhạc công thời đó thực sự chơi.'
    moi: "Bảng viết cho một cậu bé chín tuổi nên rất gọn: nó không nói chơi bao nhiêu nốt, nhanh đến đâu, khi nào được phép làm khác. Giới nghiên cứu vẫn tranh luận về những chỗ trống ấy. Frederick Neumann (1978), chẳng hạn, đặt câu hỏi về các quy tắc cứng nhắc trong cách chơi nốt hoa mỹ Baroque, vì nhạc công thời đó có nhiều tự do hơn."
    ly_do: "n31 (da-sua): viết lại theo mô tả nhà xuất bản Princeton UP."
  - cu: "Giai điệu đi lên tới nốt có ký hiệu: không có gì để nối, nên láy bắt đầu từ nốt trên, đúng phách."
    moi: "Giai điệu đi lên tới nốt có ký hiệu: C. P. E. Bach không dùng Pralltriller ở chỗ này; ký hiệu thường được đọc như một láy rền ngắn của bảng Bach 1720, bắt đầu từ nốt trên, đúng phách."
    ly_do: "n65 (da-sua): Pralltriller chỉ sau nốt đi xuống liền bậc (Dolmetsch); trường hợp đi lên đọc theo bảng Bach."
  - cu: Trong nhạc Baroque và Cổ điển, nốt thấp nhất thường rơi đúng phách. Với Chopin, chú giải của ấn bản Quốc gia Ba Lan (biên tập Jan Ekier) cũng khuyên theo lệ chung bắt đầu hợp âm rải đúng phách, nốt thấp nhất vang cùng tay trái; ngoại lệ là khi hòa âm đã được bàn đạp giữ sẵn, lúc ấy thời điểm bắt đầu không còn quan trọng lắm. Trong nhiều bản nhạc Lãng mạn khác, khi nốt trên cùng là giai điệu, người chơi có thể rải sớm một chút để nốt giai điệu rơi đúng phách; các nghệ sĩ không làm giống nhau.
    moi: Trong nhạc Baroque và Cổ điển, nốt thấp nhất thường rơi đúng phách. Với Chopin, chú giải của ấn bản Quốc gia Ba Lan khuyên bắt đầu hợp âm rải cùng lúc với nốt tương ứng của tay trái. Trong nhiều bản nhạc Lãng mạn khác, khi nốt trên cùng là giai điệu, người chơi có thể rải sớm một chút để nốt giai điệu rơi đúng phách; các nghệ sĩ không làm giống nhau.
    ly_do: "n91 (da-sua): bỏ ngoại lệ bàn đạp và tên người biên tập (chưa có nguồn đã mở)."
  - cu: "Câu hỏi muôn thuở: nốt đầu của chùm vào đúng phách, cùng nốt trầm, hay trước phách? Chú giải của ấn bản Quốc gia Ba Lan trả lời theo từng trường hợp: hợp âm rải và những nốt nhỏ tạo thành hợp âm rải hay quãng rải, theo lệ chung, bắt đầu đúng phách; có những nhóm vài nốt nhỏ chơi trước phách lại thuận hơn; với láy rền, một nốt nhỏ đứng ngay trước dấu tr cho biết láy bắt đầu từ nốt nào (cùng cao độ với nốt chính thì bắt đầu từ nốt chính, ở trên thì từ nốt trên). Với những chùm dài, điều quan trọng hơn cả là những điểm gặp nhau với tay trái:"
