    luot_2_ghi_chu: "Dolmetsch: Pralltriller chỉ xuất hiện sau quãng hai đi xuống, nốt đầu nối với nốt trước; Fitch: láy rền nối (tremblement lié): nốt đầu trùng nốt trước thì nối chứ không đánh lại."
  - id: n37
    cau: Thời Cổ điển (Haydn, Mozart), láy rền phần lớn vẫn bắt đầu từ nốt trên.
