nhan_dinh:
  - id: n1
    cau: Piano điện 88 phím có phím nặng mô phỏng cơ chế búa của đàn cơ.
    loai: dinh-nghia
    nguon:
      - yamaha-weighted
    ket_qua: dung
    ghi_chu: 'Yamaha: weighted keys là "keys to which weights have been added so as to simulate the complex mechanics" của piano cơ, trong đó "a series of levers ... cause a hammer to strike" dây; phím không nặng thì "usually spring-loaded". Số 88 phím: tổng số phím của đàn tiêu chuẩn, khớp trang Bản đồ bàn phím (đã có bản ghi riêng).'
    luot_2: dung
    luot_2_nguon: [ "https://usa.yamaha.com/products/musical_instruments/pianos/p_series/p-145/index.html" ]
    luot_2_ghi_chu: "Yamaha: phím có trọng lượng (Graded Hammer) tái tạo phản ứng của đàn cơ."
  - id: n2
    cau: Đàn phím nhẹ dùng tạm được, nhưng cảm giác phím khác đàn cơ.
    loai: quy-tac
    nguon:
      - yamaha-weighted
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Đàn phím nhẹ dùng tạm được vài tuần, nhưng tay sẽ quen với lực sai." Bỏ "vài tuần" và "tay sẽ quen với lực sai": không nguồn nào cho mốc thời gian hay cho việc tay "quen lực sai". Giữ điều Yamaha xác nhận: phím không có trọng lượng thì không có lực cản như cơ phím. Review D4-gom: Yamaha (nguồn của nhà sản xuất, bậc 2), A quick guide to weighted keys: phím có trọng lượng mô phỏng cơ phím đàn cơ, phím không có trọng lượng "usually spring-loaded"; câu chỉ nói cảm giác phím khác đàn cơ. Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://usa.yamaha.com/products/musical_instruments/pianos/p_series/p-145/index.html" ]
    luot_2_ghi_chu: Yamaha nói phím trọng lượng tái tạo cảm giác đàn cơ; chiều ngược lại suy ra, chưa có nguồn nói trực tiếp.
  - id: n3
    cau: 20 phút mỗi ngày tốt hơn 3 tiếng dồn vào cuối tuần.
    loai: khuyen-tap
    nguon:
      - simmons-2012
    ket_qua: dung
    ghi_chu: 'Simmons 2012: ba buổi cách nhau 24 giờ cho tiến bộ ở buổi 2, các buổi cách 5 phút hay 6 giờ thì không ("Significant improvements in performance accuracy were observed in Session 2 only in the group whose sessions were separated by 24 hr"). Cùng nguồn với bat-dau/bai-0 n10 (đã khóa).'
  - id: n4
    cau: Việc học động tác còn tiếp tục tiến bộ sau buổi tập, trong lúc nghỉ.
    loai: quy-tac
    nguon:
      - walker-2002
      - bonstrup-2019
      - pan-rickard-2015
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Một phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ. Bảy buổi ngắn cho bảy lần như vậy; một buổi dài chỉ cho một lần, kèm theo đôi tay mỏi." Sửa theo quyết định đã khóa ở bat-dau/bai-0 n11: bỏ "một phần lớn" (không định lượng được) và vế giấc ngủ (Walker 2002 thấy một đêm ngủ tăng 20% tốc độ, nhưng Pan và Rickard 2015, 34 bài, kết luận "there was no evidence that sleep enhances learning" khi đã tính biến gây nhiễu). Giữ điều các nguồn cùng ủng hộ: Bönstrup 2019, "performance improvements in between practice periods, when subjects were at rest, were significant". Bỏ "kèm theo đôi tay mỏi" (da-bo: không nguồn cho việc buổi dài làm mỏi tay ở người mới). Review D4-gom: cùng câu và cùng cách giải quyết với hồ sơ đã khóa bat-dau/bai-0 n11 (review 24/10/2026): Walker 2002 ("Improvement in motor skill performance is known to continue for at least 24 hr following training") và Bönstrup 2019 (tiến bộ trong các quãng nghỉ giữa các lượt tập); bỏ vế giấc ngủ vì Pan và Rickard 2015. Lượt 2 không mở được bài. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Củng cố kỹ năng vận động lúc nghỉ/ngủ có nghiên cứu ủng hộ (như Bönstrup 2019) nhưng chưa mở được bài nào.
  - id: n5
    cau: Một buổi tập mẫu gồm 2 phút thả lỏng và kiểm tra ghế, 5 phút việc mới, 5 phút đọc nốt hoặc nhạc lý, 8–15 phút bài khởi động và bài đang tập, 2–3 phút chơi trọn vẹn và ghi nhật ký (tổng 22–30 phút), và các trang được trỏ tới.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Cộng các dòng bảng: 2+5+5+8–15+2–3 = 22–30 phút, khớp "mỗi ngày 20–30 phút". Danh sách kiểm tra có ở cuối trang Tư thế (đã có), cột "Trọng tâm" có trong các bảng tuần; nhạc lý bài 1–3 là bài 1 (cao độ), 2 (khuông, khóa), 3 (trường độ) của site mới. Review D4-gom: cộng bảng "Một buổi tập trong hai tuần này": 2 + 5 + 5 + 8–15 + 2–3 = 22–30 phút; link Tư thế, Đọc nốt (cũ), Nhật ký (cũ), nhạc lý bài 1–3 đều sống.'
    review: dung
  - id: n6
    cau: Nếu chỉ có 20 phút, rút ngắn phần bài đang tập nhưng đừng bỏ phần đọc nốt.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ có thêm vế "đọc nhạc là kỹ năng người tự học hay bỏ qua nhất": bỏ (da-bo vế đó), vì là khái quát về người tự học, không có nguồn đo được. Phần còn lại là lời khuyên tập. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập hợp lý.
  - id: n7
    cau: Bảng tuần 1 (ngày 1–7) khớp phần giải thích bên dưới (Đô giữa, thế Đô, đếm to, khuông kép, bài 1, thu âm ngày 7) và các trang nhạc lý, 10 bài, bản đồ bàn phím.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đối chiếu từng ngày: ngày 1–7 có mục giải thích tương ứng; khởi động 1 dùng ở ngày 3–4 và 7; bài 1 *Au clair de la lune* là bài 1 của trang 10-bai-dau-tien (đã kiểm: "giai điệu chuyền từ tay phải sang tay trái", tay trái ở thế Sol). Review D4-gom: bảng tuần 1 khớp các đoạn Ngày 1 đến Ngày 7 và khởi động 1; link nhạc lý bài 1, 2, 10 bài đầu tiên, Bản đồ bàn phím sống.'
    review: dung
  - id: n8
    cau: Khi chỉnh ghế, cẳng tay gần song song với mặt phím và hai bàn chân đặt phẳng.
    loai: quy-tac
    nguon:
      - lee-health
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Lee University: "Adjust bench height so forearms are approximately parallel to the floor", "Sit with feet flat on the floor"; BAPAM: "Feet should be firmly placed on the floor (or on a firm support)". Mặt phím nằm ngang nên "song song với mặt phím" cùng nghĩa với "song song với sàn". Câu cũ có thêm "khuỷu tay ngang hoặc hơi cao hơn phím" và "ngồi ở nửa trước của ghế": cả hai nguồn y khoa đều không có (BAPAM nói rõ không đề cập nửa trước hay cả mặt ghế), nên bỏ (da-bo hai vế). Review D4-gom: Lee University, Pianist Health and Injury Prevention (mở lại 28/10/2026): "Adjust bench height so forearms are approximately parallel to the floor", "Sit with feet flat on the floor"; trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "Feet should be firmly placed on the floor (or on a firm support)." Giữ. Nguồn bapam đổi link sang trang chính thức.'
    luot_2: khong-chac
    luot_2_ghi_chu: Tư thế ngồi chuẩn (cẳng tay gần song song, bàn chân phẳng) là cách dạy phổ biến; chưa mở nguồn bậc 2.
  - id: n9
    cau: Thả rơi cánh tay xuống đùi vài lần để cảm nhận sức nặng của nó.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Bài tập cảm nhận; không phải nhận định về sức khỏe.
  - id: n10
    cau: Đô giữa (C4) là phím trắng ngay bên trái nhóm hai phím đen nằm gần giữa đàn.
    loai: dinh-nghia
    nguon:
      - omt-keyboard
    ket_qua: da-sua
    ghi_chu: 'OMT, The Keyboard and the Grand Staff: Đô giữa là C4, phím trắng bên trái nhóm hai phím đen; đàn 88 phím có C1 ở nốt Đô thấp nhất, nên C4 là nốt Đô thứ tư. Câu cũ có thêm "thường gần chỗ in tên hãng đàn": bỏ (da-bo), vị trí bảng tên khác nhau giữa các đàn và không có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Đô giữa C4 gần giữa bàn phím (Dolmetsch); là phím trắng trái nhóm hai phím đen.
  - id: n11
    cau: "Hai tay được đánh số giống nhau: ngón cái là 1, trỏ 2, giữa 3, áp út 4, út 5."
    loai: quy-tac
    nguon:
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: 'Baylor Piano Basics: "Pianists represent each finger with a number." Cách đánh số (cái = 1 đến út = 5) là quy ước chuẩn của cách bấm kiểu Anh (đã khóa ở du-lieu/thuat-ngu/fingering). Review D4-gom: Baylor Piano Basics, mục Finger Numbers: "Thumbs are 1, index fingers are 2, middle fingers are 3, ring fingers are 4, and little fingers are 5." (đã kiểm ở hồ sơ khóa du-lieu/thuat-ngu/fingering). Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Quy ước đánh số ngón (1 = cái ... 5 = út, hai tay giống nhau) đúng theo thông lệ; chưa mở nguồn bậc 2.
  - id: n12
    cau: "Thế Đô: tay phải ngón 1 trên Đô giữa đến ngón 5 trên Sol4; tay trái ngón 5 trên Đô3 đến ngón 1 trên Sol3. Thế Sol của tay trái: ngón 5 trên Sol2, ngón 1 trên Rê3."
    loai: quy-tac
    nguon:
      - omt-keyboard
      - baylor-gam-do
    ket_qua: dung
    ghi_chu: 'Suy ra từ tên nốt (OMT: Đô giữa = C4; năm phím trắng liền từ C4 là C D E F G) và cách bấm gam Đô trưởng hai tay ở Baylor (tay phải 1 trên C, tay trái 5 trên C, ngón số giảm dần khi đi lên). Tay trái: C3 D3 E3 F3 G3 ứng 5-4-3-2-1; thế Sol: G2 A2 B2 C3 D3 ứng 5-4-3-2-1. Khớp trang 10-bai-dau-tien (bài 1: "ngón 5 trên Sol2, ngón 1 trên Rê3").'
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Đô4-Sol4 (tay phải), Đô3-Sol3 (tay trái), Sol2-Rê3 (thế Sol tay trái) đều là quãng năm đúng, phủ bằng ngón 1-5.
  - id: n13
    cau: "Nếu ngón 4 và 5 chưa đều bằng các ngón khác, đó là chuyện bình thường khi mới tập: đừng bù bằng cách ép mạnh."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ: "Ngón 4 và 5 sẽ yếu hơn: chuyện bình thường, đừng bù bằng cách ép mạnh." Khẳng định giải phẫu "yếu hơn" chưa có nguồn đã mở; đổi thành điều kiện và giữ lời khuyên. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
  - id: n14
    cau: Hãy đếm to "một – hai – ba – bốn" thành tiếng và giữ tiếng đếm cả khi đang chơi.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n15
    cau: Thói quen đếm to này phân biệt người giữ được nhịp với người không.
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Câu cũ: "Nghe có vẻ trẻ con, nhưng thói quen này phân biệt người giữ được nhịp với người không." Bỏ: khẳng định nhân quả không có nguồn. Review D4-gom: đã kiểm trang: câu "phân biệt người giữ được nhịp với người không" không còn.'
    luot_2: khong-chac
    luot_2_ghi_chu: "'Phân biệt người giữ được nhịp với người không' là khẳng định quá mức, không có nguồn; nên viết lại thành khuyên tập."
  - id: n16
    cau: Nốt tròn ngân 4 phách, nốt trắng 2 phách, nốt đen 1 phách (nhịp 4/4).
    loai: quy-tac
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: "OMT, Notating Rhythm: nốt tròn = 4 phách, nốt trắng = 2, nốt đen = 1 khi phách là nốt đen (nhịp 4/4)."
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory2.htm" ]
    luot_2_ghi_chu: "Dolmetsch: nốt tròn = hai nốt trắng = bốn nốt đen; trong 4/4 nốt đen một phách."
  - id: n17
    cau: Nốt đen chấm dôi dài một phách rưỡi; nốt móc đơn dài nửa phách; dấu chấm dôi thêm một nửa độ dài của nốt.
    loai: quy-tac
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'OMT, Notating Rhythm: dấu chấm kéo dài nốt thêm một nửa giá trị; nốt đen chấm = 1 + 1/2 = 1,5 phách; nốt móc đơn = 1/2 phách khi phách là nốt đen. Dùng cho đoạn "Ngày 11–12", khởi động 3 và câu hỏi 4 của bài kiểm tra.'
    luot_2: dung
    luot_2_nguon: [ "http://www.dolmetsch.com/musictheory2.htm" ]
    luot_2_ghi_chu: "Dolmetsch: chấm dôi tăng một nửa giá trị; nốt đen chấm dôi = ba móc đơn (một phách rưỡi), móc đơn nửa phách."
  - id: n18
