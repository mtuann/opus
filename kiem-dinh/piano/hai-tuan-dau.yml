    ghi_chu: 'OMT, The Keyboard and the Grand Staff (C4, C1 đến C8); phần tay trái xem n12. Review D4-gom: theo lượt 2 (sai): Đô8 (C8) là phím cuối của đàn 88 phím (OMT; ban-do-ban-phim n19), bên phải nó không còn phím đen. Chữ cũ của lời giải thích câu hỏi 1: "Mọi nốt Đô đều nằm ngay bên trái nhóm 2 phím đen"; chữ mới: "Mọi nốt Đô (trừ Đô8 ở đầu cao của đàn) đều nằm ngay bên trái nhóm 2 phím đen". Người gom (D4-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, encyclopedia.com, OMT, IMSLP chặn hay lỗi), không phải vì nguồn nói khác; giữ theo nguồn lượt 1 và review đã mở, ghi ở trên.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Đàn 88 phím A0–C8: các nốt Đô là C1…C8, nên Đô giữa C4 là Đô thứ tư; mọi Đô trừ C8 ở sát nhóm hai phím đen bên trái; thế Đô tay trái ngón 5 trên C3 (dưới Đô giữa một quãng tám). Kiểm trực tiếp, không cần nguồn. (Người gom: lượt 2 tự kiểm bằng nhạc lý, không ghi trang đã mở nên chuyển thành khong-chac.)"
  - id: n40
    cau: "Bài kiểm tra: lần đầu ghép hai tay nên chơi chậm bằng khoảng nửa tốc độ từng tay, mỗi lần một câu ngắn, đếm to; thu âm ngày 7 và ngày 14 để nghe lại chính mình và so sánh hai bản thu."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Hai lời giải thích của đáp án đã sửa: "cho não đủ thời gian điều khiển hai tay cùng lúc" thành "mỗi lần ghép chỉ có một việc mới để theo dõi"; đáp án thu âm cũ "để nghe ra những điều không nhận thấy khi đang chơi, và so sánh tiến bộ" cùng lời giải thích "Lúc chơi, tai bận theo dõi tay..." thành "để nghe lại chính mình và so sánh hai bản thu". Các câu cũ đều là khái quát tâm lý không có nguồn. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
  - id: n41
    cau: "Phần Sau hai tuần: đây là những tuần đầu của chặng 1 trong lộ trình 7 chặng; lộ trình piano năm đầu ở bat-dau/lo-trinh-choi."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'piano/lo-trinh (đã chuyển): "Chặng 1. Khởi đầu (0–6 tháng)"; bat-dau/lo-trinh-choi đã chuyển (tồn tại ở site mới). Review D4-gom: src/content/docs/piano/lo-trinh.md: "Chặng 1. Khởi đầu (0–6 tháng)"; link bat-dau/lo-trinh-choi sống.'
    review: dung
khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - khoa
      - not
    ket_qua: dung
    ghi_chu: "Hỏi và đáp (khởi động 1): 4/4, 9 ô, mỗi ô 4 phách (ô cuối C4 của hai tay). Tay phải C D E F | G2 z2 | z4 | z4 | G F E D | C2 z2 | ... ; tay trái đáp C, D, E, F, | G,2 z2 ở ô 3–4 và G, F, E, D, | C,2 z2 ở ô 7–8, thấp hơn một quãng tám. Ngón bấm chơi được ở thế Đô (tay phải 1 trên C4 đến 5 trên G4; tay trái 5 trên C3 đến 1 trên G3). Khớp lời dẫn sau khi sửa."
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - khoa
      - not
    ket_qua: dung
    ghi_chu: "Tay trái giữ nhịp (khởi động 2): 8 ô 4/4; tay trái nốt trắng C,2 C,2 | G,2 G,2 | C,2 G,2 | C,4 ... ; tay phải đi từng phách (có hai nốt trắng D2). Ngón bấm trong thế Đô, không có chỗ phải đổi thế."
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - khoa
      - not
      - nhip
    ket_qua: dung
    ghi_chu: "Nốt đen chấm dôi (khởi động 3): D3/2 E/ = 1,5 + 0,5 phách, các ô đều tròn 4 phách. Tay trái nốt tròn và trắng. Không phải giai điệu Ode to Joy (bài tập tiết tấu), lời dẫn không nói là Ode."
ghi_chu: 'Lượt 1 trang Hai tuần đầu tiên (lô D4-L1, phần 2/2). Nguồn: OMT (keyboard-and-grand-staff, clefs, notating-rhythm, pitch-and-pitch-class) mở bằng WebFetch, Yamaha weighted keys, Baylor Piano Basics (qua bản ghi thuật ngữ fingering đã khóa), BAPAM The Healthy Pianist và tài liệu Lee University (sức khỏe, tư thế: bậc 2 y học biểu diễn), Simmons 2012, Walker 2002, Bönstrup 2019, Pan và Rickard 2015 (như đã khóa ở bat-dau/bai-0 n10, n11), Britannica (Ah vous dirai-je), IMSLP và Mutopia ode.ly (Ode to Joy). Wikipedia chỉ dùng tìm nguồn. Không tính là nhận định: tiêu đề mục, tên người học, dòng "Chọn ... thứ tự", mục Nguồn (sách in Faber, Alfred, Klickstein: đã đối chiếu bản ghi danh mục sách, chỉ tả nội dung chung, không kiểm thêm). abc: 3 khối, đã đếm tay từng ô (4 phách mỗi ô), ngón bấm chơi được ở thế Đô (tay phải C4–G4, tay trái C3–G3); xem khuong_nhac. Đợt 3 "giữ": mọi mục đợt 3 liên quan trang này khớp trang mới (kiểm bằng grep). Chưa chuyển, trang này trỏ tới: luyen-tap/doc-not, metronome, nhat-ky, thu-am, piano/chon-dan, gam, hai-tay, hoc-thuoc-bieu-dien, nam-ngon, suc-khoe, thay-va-thi, tai-lieu-tham-khao; mỗi trang phải giữ: doc-not (công cụ đọc nốt, khóa Sol và Fa, ngưỡng 9/10 so mục tiêu 8/10 của trang này), metronome (máy đếm nhịp ♩ = 60 chỉnh được), nhat-ky và thu-am (ghi nhật ký, thu âm), chon-dan (phím nặng 88 phím, ghế, góc tập), gam (gam Đô trưởng một quãng tám từng tay), hai-tay (ghép hai tay từng bước), hoc-thuoc-bieu-dien (lỡ sai đi tiếp), nam-ngon (bảng thế tay, thế Sol và thế Fa), suc-khoe (dấu hiệu cảnh báo, nghỉ), thay-va-thi (học với thầy), tai-lieu-tham-khao. Thuật ngữ chưa có trong src/data/thuat-ngu.yml (grep 28/10/2026), để D4 thuật ngữ: phím nặng (weighted keys), nốt mốc, thế Đô / thế Sol (hand position, five-finger position), ghép tay (hands together), canon, nốt chấm dôi (dotted note), nốt móc đơn (eighth note), nốt tròn / trắng / đen, khuông kép (grand staff), máy đếm nhịp (metronome), Đô giữa (middle C), hợp âm chủ (tonic), thị tấu (sight-reading), ngón bấm. Cách gọi hợp âm át bảy: trang 10-bai-dau-tien dùng "hợp âm át bảy", bài nhạc lý 11 dùng "hợp âm bảy át"; trang này theo bài 11, cần thống nhất. Công cụ: ::cong-cu{ten="piano" range="C3-C5" notes="C4"} chỉ tô Đô giữa, đúng ngày 1; ::cong-cu{ten="metronome"} đúng mô tả. Không sửa thành phần.'
doi_chu:
  - cu: "Một cây đàn: piano cơ, hoặc piano điện 88 phím có phím nặng (mô phỏng cơ chế búa của đàn cơ). Đàn phím nhẹ dùng tạm được vài tuần, nhưng tay sẽ quen với lực sai. Xem Chọn đàn và góc tập."
    moi: "Một cây đàn: piano cơ, hoặc piano điện 88 phím có phím nặng (mô phỏng cơ chế búa của đàn cơ). Đàn phím nhẹ dùng tạm được, nhưng cảm giác phím khác đàn cơ. Xem Chọn đàn và góc tập."
    ly_do: 'n2 (da-sua): bỏ "vài tuần" và "tay sẽ quen với lực sai", không có nguồn; giữ điều Yamaha xác nhận (phím không nặng thì không có lực cản như cơ phím).'
  - cu: Một phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ. Bảy buổi ngắn cho bảy lần như vậy; một buổi dài chỉ cho một lần, kèm theo đôi tay mỏi.
    moi: Việc học động tác còn tiếp tục tiến bộ sau buổi tập, trong lúc nghỉ. Bảy buổi ngắn cho bảy quãng nghỉ như vậy; một buổi dài chỉ cho một.
    ly_do: 'n4 (da-sua): theo quyết định đã khóa ở bat-dau/bai-0 n11: bỏ "một phần lớn" và vế giấc ngủ (Pan và Rickard 2015 trái với Walker 2002); bỏ "kèm theo đôi tay mỏi" (không nguồn).'
  - cu: "Nếu chỉ có 20 phút, rút ngắn phần bài đang tập nhưng đừng bỏ phần đọc nốt: đọc nhạc là kỹ năng người tự học hay bỏ qua nhất."
    moi: Nếu chỉ có 20 phút, rút ngắn phần bài đang tập nhưng đừng bỏ phần đọc nốt.
    ly_do: 'n6 (da-sua): bỏ "đọc nhạc là kỹ năng người tự học hay bỏ qua nhất", khái quát không có nguồn.'
  - cu:
      - "Ngày 1. Chưa vội chơi bài. Chỉnh ghế để cẳng tay gần song song với mặt phím, khuỷu tay ngang hoặc hơi cao hơn phím; ngồi ở nửa trước của ghế, hai bàn chân đặt phẳng. Thả rơi cánh tay xuống đùi vài lần để cảm nhận sức nặng của nó: đó là nguồn lực bạn sẽ dùng thay cho việc ép ngón. Rồi tìm Đô giữa (C4): phím trắng ngay bên trái nhóm hai phím đen nằm gần giữa đàn, thường gần chỗ in tên hãng đàn."
      - "Ngày 2–3. Hai tay được đánh số giống nhau: ngón cái là 1, ngón út là 5. Đặt tay phải vào thế Đô: ngón 1 trên Đô giữa, mỗi ngón một phím trắng, ngón 5 trên Sol4. Tay trái là ảnh gương: ngón 5 trên Đô3, ngón 1 trên Sol3 (Vị trí năm ngón). Chơi thật chậm, nối mỗi nốt liền vào nốt sau (legato), và nghe xem năm nốt có to đều nhau không. Ngón 4 và 5 sẽ yếu hơn: chuyện bình thường, đừng bù bằng cách ép mạnh."
      - Từ ngày 3, hãy đếm to "một – hai – ba – bốn" thành tiếng, và giữ tiếng đếm cả khi đang chơi. Nghe có vẻ trẻ con, nhưng thói quen này phân biệt người giữ được nhịp với người không. Nốt tròn ngân 4 phách, nốt trắng 2 phách, nốt đen 1 phách.
    moi:
      - "Ngày 1. Chưa vội chơi bài. Chỉnh ghế để cẳng tay gần song song với mặt phím, hai bàn chân đặt phẳng. Thả rơi cánh tay xuống đùi vài lần để cảm nhận sức nặng của nó: đó là nguồn lực bạn sẽ dùng thay cho việc ép ngón. Rồi tìm Đô giữa (C4): phím trắng ngay bên trái nhóm hai phím đen nằm gần giữa đàn."
      - "Ngày 2–3. Hai tay được đánh số giống nhau: ngón cái là 1, ngón út là 5. Đặt tay phải vào thế Đô: ngón 1 trên Đô giữa, mỗi ngón một phím trắng, ngón 5 trên Sol4. Tay trái là ảnh gương: ngón 5 trên Đô3, ngón 1 trên Sol3 (Vị trí năm ngón). Chơi thật chậm, nối mỗi nốt liền vào nốt sau (legato), và nghe xem năm nốt có to đều nhau không. Nếu ngón 4 và 5 chưa đều bằng các ngón khác, đó là chuyện bình thường khi mới tập: đừng bù bằng cách ép mạnh."
      - Từ ngày 3, hãy đếm to "một – hai – ba – bốn" thành tiếng, và giữ tiếng đếm cả khi đang chơi. Nốt tròn ngân 4 phách, nốt trắng 2 phách, nốt đen 1 phách.
    ly_do: 'n8 (da-sua): bỏ "khuỷu tay ngang hoặc hơi cao hơn phím" và "nửa trước của ghế": nguồn y khoa (Lee, BAPAM) không có hai ý này.; n10 (da-sua): bỏ "thường gần chỗ in tên hãng đàn", không có nguồn.; n13 (da-sua): "sẽ yếu hơn" là khẳng định giải phẫu chưa có nguồn; đổi thành điều kiện, giữ lời khuyên.'
  - cu: 'Cả hai tay ở thế Đô. Tay phải "hỏi" hai ô nhịp, tay trái "đáp" bằng cùng năm nốt, thấp hơn một quãng tám; rồi lại đổi vai. Ô cuối cùng, hai tay chơi Đô cùng lúc: lần "hai tay" đầu tiên của bạn.'
    moi: 'Cả hai tay ở thế Đô. Tay phải "hỏi" hai ô nhịp, tay trái "đáp" bằng cùng năm nốt, thấp hơn một quãng tám; rồi cả hai tay chơi lại theo chiều đi xuống, vẫn tay phải trước. Ô cuối cùng, hai tay chơi Đô cùng lúc: lần "hai tay" đầu tiên của bạn.'
    ly_do: 'n22 (da-sua): khối abc cho thấy tay phải luôn vào trước, ô 5–8 là lượt đi xuống, không có "đổi vai".'
  - cu: Tay trái chơi nốt trắng, đổi nốt ở phách 1 và phách 3; tay phải đi từng phách. Đây chính là cách hai tay phối hợp trong bài 2.
    moi: Tay trái chơi nốt trắng ở phách 1 và phách 3 (ô cuối mỗi câu là nốt tròn); tay phải chủ yếu đi từng phách. Đây chính là cách hai tay phối hợp trong bài 2.
    ly_do: "n23 (da-sua): tay trái ở khối abc đánh vào phách 1 và 3 nhưng nhiều ô lặp lại cùng một nốt; tay phải có ô nốt trắng.; n23 (da-sua, review D4-gom): ô 4 và ô 8 của khởi động 2, tay trái là nốt tròn."
  - cu:
      - "Tay trái gần như đứng yên, để toàn bộ sự chú ý dồn vào tiết tấu của tay phải. Nốt móc đơn thường bị chơi quá sớm: hãy để nốt chấm dôi ngân đủ."
      - "Ngày 13–14: buổi biểu diễn nhỏ. Chọn thứ tự (bài chắc nhất trước) và một tốc độ thoải mái, không phải tốc độ nhanh nhất bạn từng chơi được. Ngày 13, chạy thử một lần như thật. Ngày 14, mời một người thân nghe, hoặc đặt điện thoại quay như thể có khán giả. Trước mỗi bài, đặt tay vào thế, đếm thầm một ô nhịp, rồi mới bắt đầu. Lỡ sai thì đi tiếp: đó là kỹ năng biểu diễn đầu tiên và quan trọng nhất (Học thuộc và biểu diễn). Sau đó nghe hai bản thu liền nhau, và viết vào nhật ký ba điều đã khác đi."
    moi:
      - Tay trái gần như đứng yên, để toàn bộ sự chú ý dồn vào tiết tấu của tay phải. Hãy để nốt chấm dôi ngân đủ, đừng chơi nốt móc đơn quá sớm.
      - "Ngày 13–14: buổi biểu diễn nhỏ. Chọn thứ tự (bài chắc nhất trước) và một tốc độ thoải mái, không phải tốc độ nhanh nhất bạn từng chơi được. Ngày 13, chạy thử một lần như thật. Ngày 14, mời một người thân nghe, hoặc đặt điện thoại quay như thể có khán giả. Trước mỗi bài, đặt tay vào thế, đếm thầm một ô nhịp, rồi mới bắt đầu. Lỡ sai thì đi tiếp: đó là kỹ năng biểu diễn đầu tiên cần tập (Học thuộc và biểu diễn). Sau đó nghe hai bản thu liền nhau, và viết vào nhật ký ba điều đã khác đi."
    ly_do: 'n31 (da-sua): bỏ "thường bị chơi quá sớm", khái quát không có nguồn; giữ lời khuyên.; n32 (da-sua): bỏ "quan trọng nhất", xếp hạng không kiểm được.'
  - cu: Hầu như ai cũng thấy vậy. Người lớn hiểu rất nhanh điều phải làm, nhưng đôi tay học với tốc độ như của mọi người; cảm giác "sao mình vụng thế" nằm ở khoảng cách đó, và nó thu hẹp dần sau vài tuần tập đều.
    moi: 'Nếu thấy "sao mình vụng thế", đó là bình thường ở người mới tập: hãy tập đều và cho đôi tay thời gian.'
    ly_do: 'n33 (da-sua): bỏ "hầu như ai", vế so sánh tốc độ hiểu với tốc độ tay và "sau vài tuần": không có nguồn.'
  - cu: Bám vào ba nốt mốc; đọc theo bước (sang dòng hoặc khe kề bên) và nhảy (cách một dòng); hai lần đọc nốt 5 phút tốt hơn một lần 10 phút
    moi: Bám vào ba nốt mốc; đọc theo bước (sang dòng hoặc khe kề bên) và nhảy (cách một dòng); thử chia thành hai lần đọc nốt 5 phút thay vì một lần 10 phút
    ly_do: 'n34 (da-sua): bỏ so sánh "tốt hơn một lần 10 phút", không có nguồn riêng; giữ làm gợi ý.'
  - cu: Dừng lại. Kiểm tra độ cao ghế, thả rơi cánh tay, nghỉ hẳn một ngày nếu cần; đọc Giữ đôi tay khỏe
    moi: Dừng lại và nghỉ. Kiểm tra độ cao ghế, thả rơi cánh tay; đọc Giữ đôi tay khỏe
    ly_do: 'n35 (da-sua): bỏ "nghỉ hẳn một ngày nếu cần" (không nguồn cho thời gian nghỉ); giữ dừng và nghỉ (BAPAM, Lee).'
  - cu: "Nếu có điều kiện, hai, ba buổi học với một giáo viên trong tháng đầu đáng giá hơn nhiều buổi về sau: thói quen tư thế hình thành rất nhanh, và sửa sớm dễ hơn sửa muộn. Xem Học với thầy và thi cấp."
    moi: Nếu có điều kiện, hai, ba buổi học với một giáo viên trong tháng đầu giúp bạn được sửa tư thế và thế tay ngay từ đầu. Xem Học với thầy và thi cấp.
    ly_do: 'n36 (da-sua): bỏ "thói quen tư thế hình thành rất nhanh, và sửa sớm dễ hơn sửa muộn" và "đáng giá hơn nhiều buổi về sau", không có nguồn.'
  - cu: Tiếp tục 10 bài đầu tiên từ bài 4. Hänschen klein đưa vào hai hợp âm đầu tiên của tay trái, hợp âm chủ (I) và hợp âm bảy át (V7); Frère Jacques có thử thách chơi canon với một người bạn.
    moi: Tiếp tục 10 bài đầu tiên từ bài 4. Hänschen klein đưa vào hai hợp âm đầu tiên của tay trái, hợp âm chủ (I) và hợp âm bảy át (V7); Frère Jacques có thử thách chơi canon bằng hai tay.
    ly_do: 'n37 (da-sua): canon ở 10-bai-dau-tien là canon bằng hai tay ("hai tay hát cùng một giai điệu, lệch nhau hai ô nhịp"), không phải chơi với một người bạn.'
  - cu: "câu hỏi: Đô giữa (C4) nằm ở đâu trên bàn phím? | ✓ Phím trắng ngay bên trái nhóm hai phím đen nằm gần giữa đàn | Phím trắng ngay bên trái nhóm ba phím đen ở giữa đàn | Phím trắng đầu tiên bên trái của đàn | Mọi nốt Đô đều nằm ngay bên trái nhóm 2 phím đen; Đô giữa là nốt Đô gần giữa đàn nhất, nốt Đô thứ tư tính từ dưới lên."
    moi: "câu hỏi: Đô giữa (C4) nằm ở đâu trên bàn phím? | ✓ Phím trắng ngay bên trái nhóm hai phím đen nằm gần giữa đàn | Phím trắng ngay bên trái nhóm ba phím đen ở giữa đàn | Phím trắng đầu tiên bên trái của đàn | Mọi nốt Đô (trừ Đô8 ở đầu cao của đàn) đều nằm ngay bên trái nhóm 2 phím đen; Đô giữa là nốt Đô gần giữa đàn nhất, nốt Đô thứ tư tính từ dưới lên."
    ly_do: "n39 (da-sua, review D4-gom): Đô8 là phím cuối, không có nhóm phím đen bên phải (lượt 2)."
  - cu: "câu hỏi: Lần đầu ghép hai tay, nên làm gì? | ✓ Chơi chậm bằng khoảng nửa tốc độ từng tay, mỗi lần một câu ngắn, đếm to | Chơi đúng tốc độ của từng tay để hai tay quen nhau | Chơi cả bài từ đầu đến cuối nhiều lần cho thuộc | Đoạn ngắn và tốc độ chậm cho não đủ thời gian điều khiển hai tay cùng lúc."
    moi: "câu hỏi: Lần đầu ghép hai tay, nên làm gì? | ✓ Chơi chậm bằng khoảng nửa tốc độ từng tay, mỗi lần một câu ngắn, đếm to | Chơi đúng tốc độ của từng tay để hai tay quen nhau | Chơi cả bài từ đầu đến cuối nhiều lần cho thuộc | Đoạn ngắn và tốc độ chậm giúp mỗi lần ghép chỉ có một việc mới để theo dõi, như các bước ghép tay ở trên."
    ly_do: 'n40 (da-sua): giải thích "cho não đủ thời gian điều khiển hai tay" là khái quát tâm lý không có nguồn; viết lại theo cách ghép tay từng bước của trang.'
  - cu: "câu hỏi: Vì sao nên thu âm vào ngày 7 và ngày 14? | ✓ Để nghe ra những điều không nhận thấy khi đang chơi, và so sánh tiến bộ | Để gửi đi thi | Vì máy đếm nhịp không đủ chính xác | Lúc chơi, tai bận theo dõi tay; khi nghe lại, bạn nghe được nhịp và âm thanh thật của mình."
    moi: "câu hỏi: Vì sao nên thu âm vào ngày 7 và ngày 14? | ✓ Để nghe lại chính mình và so sánh hai bản thu | Để gửi đi thi | Vì máy đếm nhịp không đủ chính xác | Nghe hai bản thu liền nhau cho bạn một cách so sánh cụ thể giữa tuần 1 và tuần 2."
    ly_do: 'n40 (da-sua): đáp án "nghe ra những điều không nhận thấy khi đang chơi" là khẳng định tâm lý không có nguồn; đáp án mới chỉ nói điều chắc chắn (nghe lại và so sánh hai bản thu).; n40 (da-sua): như dòng trên, giải thích khớp đáp án mới.'
