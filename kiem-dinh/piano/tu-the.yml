    ket_qua: da-sua
    ghi_chu: 'Chữ trong hình (src/components/hinh/the-tay.html), cùng ý các nhận định về thế tay và bảng lỗi ở trên. Người giao sửa hình theo lượt 1: "cổ tay ngang mặt phím" thành "cổ tay trung tính" (BAPAM: vị trí trung tính); bỏ "tiếng yếu và không đều" (không nguồn); chú thích "hai lỗi người mới hay mắc nhất" thành "hai lỗi trong bảng lỗi ở cuối trang".'
