  - cu: 'mô tả: Tư thế không phải chuyện "ngồi cho đẹp". Nó quyết định tiếng đàn của bạn, tốc độ bạn có thể đạt tới, và đôi tay có còn khỏe sau nhiều năm chơi đàn hay không.…'
    moi: 'mô tả: Tư thế không phải chuyện "ngồi cho đẹp". Nó ảnh hưởng đến cách bạn điều khiển tiếng đàn và đến sức khỏe đôi tay. Hãy đọc kỹ trang này và quay lại tự kiểm tra…'
    ly_do: 'Mô tả trang lấy từ đoạn đầu, đổi theo n1.'
