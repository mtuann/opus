  - cu: Mỏi cơ nhẹ sau một buổi tập dài là bình thường. Đau, tê, buốt hoặc yếu tay thì không. Hãy dừng lại, nghỉ, và đọc Giữ đôi tay khỏe. Nếu tình trạng kéo dài, hãy đi khám.
    moi: Đau, tê hoặc ngứa ran khi tập là tín hiệu dừng. Hãy dừng lại, nghỉ, và đọc Giữ đôi tay khỏe. Nếu tình trạng kéo dài, hãy đi khám.
