nhan_dinh:
  - id: n1
    cau: Tư thế ảnh hưởng đến cách bạn điều khiển tiếng đàn và đến sức khỏe đôi tay.
    loai: quy-tac
    nguon:
      - tummolo-2026
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Nó quyết định tiếng đàn của bạn, tốc độ bạn có thể đạt tới, và đôi tay có còn khỏe sau nhiều năm chơi đàn hay không. Thói quen của vài tháng đầu rất khó sửa về sau". "Quyết định", "tốc độ", "sau nhiều năm" và "rất khó sửa" không có nguồn, nên bỏ (da-bo cho vế "thói quen ... khó sửa"). Còn lại là "ảnh hưởng": tổng quan Tummolo 2026 và BAPAM xếp tư thế vào các yếu tố liên quan đến sức khỏe người chơi; vế "điều khiển tiếng đàn" là lời dẫn chung, đã có n2 làm chỗ dựa.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html", "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/" ]
    luot_2_ghi_chu: "Chang: thả lỏng là yếu tố quan trọng nhất; NHS: tư thế kém là yếu tố nguy cơ RSI."
  - id: n2
    cau: Một nốt piano to hay nhỏ phụ thuộc vào tốc độ phím đi xuống.
    loai: quy-tac
    nguon:
      - goebl-2004
    ket_qua: dung
    ghi_chu: 'Goebl, Bresin, Galembo 2004: "it is only the endmost velocity of the hammer that determines the intensity and thus the timbre of the piano tone"; vận tốc búa do tốc độ phím đi xuống quyết định vì người chơi "loses control over the hammer after the jack is escaped by the let-off button" (suy ra: tốc độ phím đến lúc thoát quyết định vận tốc búa). Cùng ý với n24, n25.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.1.html" ]
    luot_2_ghi_chu: 'Chang III.1: "faster downstroke generally means louder sound".'
  - id: n3
    cau: Một cánh tay thả lỏng điều khiển tốc độ phím tinh tế hơn nhiều so với những ngón tay gồng cứng.
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Câu cũ ở gạch đầu dòng "Tiếng đàn". Bỏ: so sánh "tinh tế hơn nhiều" không có nguồn đo được.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html" ]
    luot_2_ghi_chu: Chang III.4 "The most important aspect is relaxation"; vế so sánh "tinh tế hơn nhiều" chỉ được ủng hộ gián tiếp.
  - id: n4
    cau: "Hãy tập sao cho động tác không gồng: khuỷu tay, vai và cổ tay không siết."
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Câu cũ (gạch đầu dòng "Tốc độ và độ đều"): "Khi cơ gồng, các nhóm cơ đối nghịch kéo ngược nhau: ngón tay chậm lại, nốt không đều, và bạn mau mệt." Bỏ cơ chế đồng co cơ: đã đọc Ashkenazi 2025 (Frontiers in Psychology) và các tổng quan, kết luận về đồng co cơ và độ đều chưa thống nhất, không đủ để khẳng định. BAPAM: "no clenching of elbow, shoulder or wrist", "Refine movements to the point where they are tension-free."'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html" ]
    luot_2_ghi_chu: "Chang III.4: thả lỏng, giảm căng ở cánh tay, vai."
  - id: n5
    cau: Đau cổ tay, cẳng tay, cổ và vai là những vấn đề thường gặp ở người chơi piano; tư thế và việc tập lâu không nghỉ là các yếu tố nguy cơ.
    loai: quy-tac
    nguon:
      - tummolo-2026
      - lee-health
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Một chút căng thẳng lặp lại hàng nghìn lần mỗi buổi là nguyên nhân phổ biến của đau cổ tay, cẳng tay và vai ở người chơi đàn." "Căng thẳng lặp lại hàng nghìn lần" là cơ chế không có nguồn. Tổng quan Tummolo 2026 (PMID 42478673) mô tả rối loạn cơ xương khớp ở vùng cổ tay, cẳng tay, cổ, vai và liệt kê tư thế, thời gian tập dài là yếu tố nguy cơ; Lee University: "Do not practice for long periods without breaks". Chưa trích được số liệu tỷ lệ nên không viết "phổ biến" bằng số.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/", "https://academic.oup.com/occmed/article/56/1/28/1380209" ]
    luot_2_ghi_chu: 'NHS: dùng lặp lại và tư thế kém là yếu tố nguy cơ RSI (tay, cẳng tay, vai); Bragge 2006 ghi các nghiên cứu chưa thống nhất yếu tố nguy cơ, nên chỉ đúng ở mức "yếu tố nguy cơ" chung.'
  - id: n6
    cau: Chiều cao ghế đúng khi cẳng tay gần song song với mặt phím; cẳng tay dốc lên là ghế quá thấp, dốc xuống nhiều là quá cao.
    loai: quy-tac
    nguon:
      - lee-health
    ket_qua: da-sua
    ghi_chu: 'Lee University: "Adjust bench height so forearms are approximately parallel to the floor"; mặt phím nằm ngang nên "song song với mặt phím" cùng nghĩa. Phần kiểm tra (dốc lên là thấp, dốc xuống là cao) suy ra từ hình học. Câu cũ có thêm "khuỷu tay ngang hoặc hơi cao hơn mặt phím trắng": bỏ (da-bo), không nguồn y khoa nào nêu độ cao khuỷu. Review D4-gom: Lee University (mở lại 28/10/2026): "Adjust bench height so forearms are approximately parallel to the floor"; mặt phím nằm ngang. Lượt 2 không mở được tài liệu Lee. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chang III.4 nói hạ ghế thấp để chơi ngón phẳng là được, cổ tay, khuỷu có thể thấp hơn mặt phím; không có nguồn bậc 1-2 cho quy tắc "cẳng tay song song". Quy tắc phổ biến trong dạy đàn nhưng không tuyệt đối.
  - id: n7
    cau: "Khoảng cách tới đàn: ngồi đủ xa để ngực mở; thấy ngực bị bó là quá gần, phải chồm người về trước là quá xa."
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "Distance from keys should be such that the chest remains open". Câu cũ: "Khuỷu tay ở hơi trước thân người ... Khuỷu tay bị ép vào sườn là ngồi quá gần": bỏ (da-bo), không có nguồn. "Chỉ cần nghiêng người là chạm được phím thấp nhất và cao nhất" giữ như dấu hiệu kiểm tra thực hành. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "Distance from keys should be such that the chest remains open, and there is enough space to enable the arms to move freely towards the extremes of the keyboard"; dấu hiệu ngực bị bó và chồm người là cách tự kiểm của trang theo ý ấy. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chang III.4 chỉ ghi nhiều người ngồi quá gần và quá cao; vế "ngực bị bó/chồm người" không có nguồn.
  - id: n8
    cau: Trọng lượng cơ thể chia đều cho hai bên mông và hai bàn chân; kiểm tra bằng cách nghiêng người sang hai bên mà không mất thăng bằng.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "The body weight should be evenly distributed between the sitting bones". Câu cũ: "Nửa trước mặt ghế": bỏ (da-bo): BAPAM và Lee đều không nói ngồi nửa trước hay cả mặt ghế. Hình tu-the-ngoi vẫn vẽ "ngồi nửa trước" (xem ghi_chu hồ sơ). Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "The body weight should be evenly distributed between the sitting bones, with the bones pointing down and very slightly backwards into the chair." Phép thử nghiêng người là cách tự kiểm của trang. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không tìm được nguồn bậc 1-2 mở được cho cách chia trọng lượng và bài kiểm tra nghiêng người.
  - id: n9
    cau: "Vị trí ngang: thân người đối diện khoảng giữa bàn phím, quanh Đô giữa; hai tay với tới hai đầu đàn dễ như nhau."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên cách ngồi.
  - id: n10
    cau: "Chân: hai bàn chân đặt vững trên sàn hoặc trên một bục chắc; chân phải ở gần bàn đạp vang; không phải nhón chân hay duỗi thẳng chân mới tới bàn đạp."
    loai: quy-tac
    nguon:
      - bapam
      - lee-health
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "Feet should be firmly placed on the floor (or on a firm support)."; Lee: "Sit with feet flat on the floor". Câu cũ có "gót chạm sàn": bỏ (da-bo), BAPAM nói chân xoay nhẹ từ cổ chân khi đạp, không nêu gót. Vị trí chân phải gần bàn đạp là cách bố trí thực hành. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "Feet should be firmly placed on the floor (or on a firm support)."; Lee: "Sit with feet flat on the floor". Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn mở được; hợp cách dạy phổ biến.
  - id: n11
    cau: Nên dùng ghế đàn chỉnh được độ cao; ghế cố định rất khó đưa cẳng tay về song song với mặt phím; người nhỏ người, chân không chạm sàn thì kê một bục thấp.
    loai: khuyen-tap
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Ghế ăn hay ghế văn phòng thường quá cao hoặc quá thấp, và làm hỏng mọi điều bên dưới. ... nếu chưa với tới bàn đạp, có loại bàn đạp nối dài làm riêng cho trường hợp này." Bỏ "thường", "làm hỏng mọi điều" và câu về bàn đạp nối dài: không nguồn (và là chi tiết về món hàng). Giữ lời khuyên ghế chỉnh được và bục (BAPAM: "firm support").'
  - id: n12
    cau: Lưng thẳng tự nhiên, không gù, không gồng.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "The spine needs to be erect and lengthening: neither overly tense, nor slumped." Câu cũ có "hơi nghiêng về trước từ khớp hông" và "không ưỡn cứng": bỏ vế nghiêng hông (da-bo, không nguồn), "ưỡn cứng" gộp vào "không gồng". Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "The spine needs to be erect and ''lengthening'': neither overly tense, nor slumped." Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không có nguồn bậc 1-2 mở được.
  - id: n13
    cau: Vai thả xuống; hãy tự kiểm tra vai mỗi khi lật trang.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "no clenching of elbow, shoulder or wrist". Câu cũ có "Đoạn khó thường khiến vai nhô lên dần mà ta không biết": bỏ (da-bo), khái quát không nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html" ]
    luot_2_ghi_chu: 'Chang III.4: thả lỏng cơ, chơi f bằng vai. Gợi ý "mỗi khi lật trang" là lời khuyên tập.'
  - id: n14
    cau: Cánh tay trên thả lỏng từ vai, khuỷu tay không gồng.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "let the elbows hang loosely from the shoulder". Câu cũ: "treo từ vai như dây đu; khuỷu tay không ép sát sườn, không xòe rộng như cánh gà": bỏ vế ép sườn, xòe rộng (da-bo, không nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html" ]
    luot_2_ghi_chu: "Chang III.4: thả lỏng cánh tay."
  - id: n15
    cau: Nhìn từ trên xuống, cẳng tay thẳng hàng với ngón 3, 4, 5 chứ không phải với ngón cái; khi chơi xa sang hai bên, để cẳng tay di chuyển theo, đừng bẻ cổ tay sang ngang.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "Aim to align the forearm with the third, fourth and fifth fingers, not with the thumb." Câu cũ: "Cẳng tay, cổ tay và bàn tay ... gần như một đường thẳng". Vế "đừng bẻ cổ tay sang ngang" là hướng dẫn kỹ thuật, nhất quán với "wrist neutral" của BAPAM.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html" ]
    luot_2_ghi_chu: "Chang III.4: ngón chơi nên song song cẳng tay; cổ tay bẻ ngang thường xuyên là dấu hiệu sẽ có rắc rối."
  - id: n16
    cau: Cổ tay ở vị trí trung tính, không quá cao cũng không quá thấp; cách tìm là thả cánh tay buông thõng bên người rồi đưa lên phím; quan trọng hơn vị trí là sự linh hoạt, đừng khóa cứng cổ tay.
    loai: quy-tac
    nguon:
      - bapam
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "Discover the balanced, neutral position of your wrist by allowing the arm to hang loosely by the side." "Start each practise session from this neutral position with the wrist neither habitually too high nor too low." Câu cũ: "ngang mặt phím hoặc hơi cao hơn", "Một cổ tay khóa cứng truyền mọi chấn động lên cẳng tay và vai, và làm tiếng đàn khô, chát": bỏ (da-bo), cả vị trí "ngang mặt phím" lẫn cơ chế chấn động đều không có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://paskpiano.org/principles-of-ergonomics-and-biomechanics/", "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html" ]
    luot_2_ghi_chu: "PASK: góc cổ tay lệch khỏi trung tính, lặp lại, dùng lực là yếu tố nguy cơ; Chang: không để cổ tay lệch. Cách tìm bằng thả tay buông thõng là mẹo, không có nguồn."
  - id: n17
    cau: "Thế tay: chạm bằng phần thịt gần đầu ngón (không phải móng); cắt móng ngắn; khớp đầu ngón vững, không gãy; các khớp ngón ở mu bàn tay tạo vòm; ngón cái chạm bằng cạnh đầu ngón; ngón út đứng trên đầu ngón; các ngón không chơi nghỉ nhẹ trên hoặc sát mặt phím."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "Hướng dẫn kỹ thuật theo sách phương pháp (Neuhaus, Sándor, Mark, Bernstein: bản in, đã đối chiếu mục lục). Không phải khẳng định sức khỏe."
    luot_2: dung
    luot_2_ghi_chu: Khuyên tập hợp cách dạy phổ biến, không thấy chỗ sai hoặc có hại.
  - id: n18
    cau: Thả hai tay buông thõng bên hông vài giây thì các ngón tự cong nhẹ; đó là hình dạng mang lên phím.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Gợi ý cảm nhận, cùng ý với "neutral position" của BAPAM nhưng không là khẳng định kiểm được.
  - id: n19
    cau: Ngón út ngắn hơn các ngón khác, nên cần cẳng tay xoay nhẹ về phía nó để đỡ.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ: "Nó ngắn và yếu nhất". Bỏ "yếu nhất" (không nguồn); giữ "ngắn hơn" (hiển nhiên về giải phẫu bàn tay). Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
  - id: n20
    cau: Hãy nghĩ bàn tay đang khum quanh một quả bóng nhỏ, nhưng mềm; thế tay đúng là thế tay tự nhiên nhất.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Hình ảnh gợi ý.
  - id: n21
    cau: "Hai tay đánh số giống nhau: ngón cái = 1, trỏ = 2, giữa = 3, áp út = 4, út = 5."
    loai: quy-tac
    nguon:
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: 'Baylor Piano Basics: "Pianists represent each finger with a number."; cách đánh số cái = 1 đến út = 5 đã khóa ở du-lieu/thuat-ngu/fingering.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Fingering_(music)" ]
    luot_2_ghi_chu: Quy ước chuẩn (ngón cái = 1 cả hai tay); chỉ mở được Wikipedia (dẫn Grove, không mở được).
  - id: n22
    cau: Cùng năm nốt Đô–Rê–Mi–Fa–Sol, tay phải chơi bằng 1–2–3–4–5 còn tay trái chơi bằng 5–4–3–2–1.
    loai: quy-tac
    nguon:
      - baylor-gam-do
    ket_qua: dung
    ghi_chu: "Cách bấm gam Đô trưởng hai tay ở Baylor: tay phải 1 trên Đô, tay trái 5 trên Đô; năm nốt đầu đi lên là 1-2-3-4-5 (phải) và 5-4-3-2-1 (trái). Khối abc 1 của trang ghi đúng điều này."
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Fingering_(music)" ]
    luot_2_ghi_chu: "Hệ quả của quy ước số ngón: tay phải 1-5 đi lên, tay trái 5-1 từ Đô lên Sol. Chỉ mở được Wikipedia."
  - id: n23
    cau: Hãy làm theo số ngón ngay từ đầu để tay quen một cách bấm ổn định; khi tự chọn ngón thì viết lên bản nhạc bằng bút chì và giữ nguyên mỗi lần tập.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Câu cũ: "ngón bấm hợp lý quyết định bạn có chơi nhanh và chắc được về sau hay không". Bỏ vế quyết định (không nguồn), giữ lời khuyên. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
    luot_2: dung
    luot_2_ghi_chu: Khuyên tập hợp lý, không có hại.
  - id: n24
    cau: Khi phím đi xuống, bộ máy đàn hất búa về phía dây; ngay trước khi chạm dây, búa được thả ra (cơ chế thoát, escapement) và bay tự do vào dây.
    loai: dinh-nghia
    nguon:
      - goebl-2004
      - yamaha-weighted
    ket_qua: dung
    ghi_chu: 'Goebl 2004: người chơi "loses control over the hammer after the jack is escaped by the let-off button"; Yamaha: cơ cấu phím là "a series of levers that eventually cause a hammer to strike" dây. Cơ chế thoát (escapement, let-off) là phần chung của cơ phím đàn cơ.'
    luot_2: dung
    luot_2_nguon: [ "https://kawaius.com/technology/piano-action/" ]
    luot_2_ghi_chu: 'Kawai: let-off, jack nhả khỏi knuckle ngay trước khi búa chạm dây. Chang III.1 lưu ý búa không hoàn toàn "tự do" ngay sau let-off (shank flex), nên "bay tự do" là cách nói đơn giản hóa.'
  - id: n25
    cau: Tiếng đàn đã được quyết định trong khoảnh khắc phím đi xuống; muốn to hơn thì phím phải đi xuống nhanh hơn.
    loai: quy-tac
    nguon:
      - goebl-2004
    ket_qua: dung
    ghi_chu: 'Goebl 2004: "it is only the endmost velocity of the hammer that determines the intensity and thus the timbre of the piano tone". Bài báo xét liệu cách chạm có đổi âm sắc ngoài cường độ không; "tiếng đã quyết định ở khoảnh khắc phím đi xuống" là cách nói của trang cho điều đó, đúng với "vận tốc cuối của búa".'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.1.html" ]
    luot_2_ghi_chu: 'Chang III.1: xuống phím nhanh hơn thì to hơn; Chang cũng cho rằng âm sắc nốt đơn vẫn điều khiển được, nên "đã được quyết định hoàn toàn" là mức giản lược.'
  - id: n26
    cau: "Ép phím sau khi chạm đáy không đổi được tiếng đàn: tiếng không to hơn, chỉ thêm lực thừa cho tay."
    loai: quy-tac
    nguon:
      - goebl-2004
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Ép phím sau khi chạm đáy là vô ích: tiếng không to hơn, không dài hơn, chỉ làm tay mỏi và căng." Bỏ "không dài hơn" (đàn vẫn ngân khi giữ phím, đây là điều sai nếu hiểu theo nghĩa đen) và "làm tay mỏi và căng" (không nguồn). "Không to hơn" suy ra từ Goebl 2004 (búa đã thoát, người chơi không còn điều khiển được búa): chưa có câu nguyên văn nói thẳng về lực sau khi phím chạm đáy, nên ghi là suy ra.'
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.1.html" ]
    luot_2_ghi_chu: "Chang III.1: không đẩy xuống khi giữ phím, trọng lực đủ để giữ."
  - id: n27
    cau: Người mới thường làm ngược lại (ngón tay đẩy cứng, cánh tay gồng treo trên không), kết quả là tiếng đàn chát và tay mỏi sau mười lăm phút; khi quen dùng trọng lượng, chơi to dễ hơn và chơi nhỏ cũng đều hơn.
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ các vế "người mới thường", "tiếng chát và tay mỏi sau mười lăm phút", "chơi to dễ hơn mà chơi nhỏ cũng đều hơn": không có nguồn; giữ lời khuyên "đừng làm ngược lại". Review D4-gom: đã kiểm trang: câu "Người mới thường làm ngược lại…mười lăm phút…" không còn; chỉ còn lời khuyên "Đừng làm ngược lại".'
    luot_2: khong-chac
    luot_2_ghi_chu: '"Mỏi sau mười lăm phút" và so sánh người mới không có nguồn; vế dùng trọng lượng, tay đỡ mỏi phù hợp Chang nhưng không đủ.'
  - id: n28
    cau: 'Nguyên tắc "nhấn rồi buông": sau khi nhấn chỉ giữ lực vừa đủ để phím không bật lên; nguồn năng lượng là cả cánh tay, ngón tay vững truyền trọng lượng xuống phím, cổ tay và cẳng tay điều chỉnh.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Hướng dẫn kỹ thuật theo các sách phương pháp liệt kê ở Nguồn; kết hợp n26 cho phần cơ chế.
  - id: n29
    cau: "Năm bài tập: thả rơi cánh tay, cầu tay và đầu ngón vững, legato chậm và kiểm tra buông, xoay cẳng tay, gương và điện thoại."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Bài tập; đối chiếu khối abc: bài 1 (ngón 3-2-4-1-5 như văn bản), bài 3 (legato nốt trắng) và bài 4 (ngón 1 và 5, 1 và 4, 1 và 3) khớp lời dẫn. Câu cũ ở bài 5: "Những gì bạn không cảm thấy khi chơi thường lộ ra rất rõ trên video" đã bỏ (xem n30).'
  - id: n30
    cau: Những gì bạn không cảm thấy khi chơi thường lộ ra rất rõ trên video.
    loai: quy-tac
    nguon: []
    ket_qua: da-bo
    ghi_chu: "Bỏ: khái quát không có nguồn; giữ lời khuyên quay video từ bên cạnh và từ trên xuống."
    luot_2: dung
    luot_2_nguon: [ "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.13.html" ]
    luot_2_ghi_chu: "Chang III.13: quay video cho thấy khác với hình dung của mình về cách chơi (tư thế, phối hợp thân-tay)."
  - id: n31
    cau: "Bảng lỗi thường gặp (gãy khớp đầu ngón, cổ tay võng, cổ tay nhô cao và khóa cứng, vai nhô, ngón út bẹt, ngón cái treo cứng, ngón vểnh, ép phím, ngồi sai, nín thở): dấu hiệu và cách sửa."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Bỏ "tiếng yếu và không đều" ở dấu hiệu gãy khớp đầu ngón (da-bo, không nguồn; hình the-tay cũng ghi câu này); đổi cách sửa cổ tay võng từ "nhắc cổ tay ngang mặt phím" thành "đưa cổ tay về vị trí trung tính" (theo n16); đổi dấu hiệu "ngồi sai" từ "khuỷu tay ép vào sườn" thành "cẳng tay dốc lên hoặc dốc xuống nhiều, hoặc phải chồm người về trước" (theo n6, n7). Còn lại là hướng dẫn kỹ thuật. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
  - id: n32
    cau: "Kiểm tra trước mỗi buổi: cổ tay ở vị trí trung tính và mềm; hẹn giờ nghỉ 10 phút sau mỗi 20 phút tập."
    loai: quy-tac
    nguon:
      - bapam
      - lee-health
    ket_qua: da-sua
    ghi_chu: 'BAPAM: "Practise in twenty minute sessions, interspersed with ten minute breaks"; Lee: "Divide practice into focused segments with regular breaks". Câu cũ: "5 phút sau mỗi 25–30 phút tập": sửa theo BAPAM. Lưu ý cho trang suc-khoe (chưa chuyển): tổng quan Tummolo 2026 dẫn mốc 30–45 phút, BAPAM 20 phút, hai mốc khác nhau; trang đó nên nêu cả hai, không chốt một con số. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016) ghi nguyên văn: "Practise in twenty minute sessions, interspersed with ten minute breaks, to allow the hands time to recover between sessions." Giữ mốc 20/10. Trang BAPAM "Returning to Playing" (nghỉ 3–5 phút sau mỗi 20–25 phút) dành cho người quay lại sau thời gian nghỉ hay hồi phục, nên không áp dụng ở đây. Nguồn BAPAM đổi link sang trang chính thức. Lee: "Divide practice into focused segments with regular breaks".'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được tờ The Healthy Pianist của BAPAM (PDF bị chặn robots). Trang BAPAM return-to-play (bối cảnh quay lại chơi sau nghỉ) ghi "Take a 3-5 minute break from playing every 20-25 minutes", không phải 20/10.
  - id: n33
    cau: Đau, tê hoặc ngứa ran khi tập là tín hiệu dừng; hãy dừng lại, nghỉ.
    loai: quy-tac
    nguon:
      - lee-health
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Lee: "Do not practice through pain, numbness, or tingling"; BAPAM: "If you experience pain, stop immediately." Câu cũ: "Mỏi cơ nhẹ sau một buổi tập dài là bình thường. Đau, tê, buốt hoặc yếu tay thì không." Bỏ "mỏi cơ nhẹ ... là bình thường" (không nguồn) và "buốt hoặc yếu tay" (chỉ có đau, tê, ngứa ran trong nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/", "https://www.bapam.org.uk/return-to-play/" ]
    luot_2_ghi_chu: 'NHS: đau, tê, ngứa ran là triệu chứng RSI; BAPAM: "Do not play with discomfort".'
  - id: n34
    cau: Nếu tình trạng (đau, tê) kéo dài, hãy đi khám.
    loai: quy-tac
    nguon:
      - bapam
      - nhs-rsi
    ket_qua: dung
    ghi_chu: 'chưa chắc: lời khuyên đi khám khi đau kéo dài hợp lý, nhưng chưa trích được câu nguyên văn ở BAPAM hay Lee University để dán vào hồ sơ. Giữ câu vì an toàn người đọc; chờ lượt 2 hay lô suc-khoe (trang cũ có mục "Đi khám ở đâu, nói gì") để chốt nguồn. Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016): "it is generally advisable to seek a medical opinion if concerned"; NHS RSI (lượt 2): đi khám khi triệu chứng không đỡ hay nặng dần. Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/" ]
    luot_2_ghi_chu: "NHS: đi khám khi triệu chứng không hết hoặc nặng dần."
  - id: n35
    cau: "Bài kiểm tra: ghế đàn cao vừa khi cẳng tay gần song song với mặt phím; khi tay đau trong lúc tập nên dừng lại, nghỉ và tìm nguyên nhân; đau là tín hiệu cảnh báo, không phải dấu hiệu tiến bộ."
    loai: quy-tac
    nguon:
      - lee-health
      - bapam
    ket_qua: da-sua
    ghi_chu: 'Đáp án ghế (n6) và đáp án dừng khi đau (n33) khớp nguồn. Câu cũ giải thích đáp án ghế: "Ghế quá thấp làm cổ tay võng; quá cao làm tay đè nặng xuống phím." Bỏ: cơ chế không nguồn; đáp án đúng cũng bỏ "khuỷu tay ngang hoặc hơi cao hơn phím" (n6). Review D4-gom: Lee University: "Adjust bench height so forearms are approximately parallel to the floor"; đau là tín hiệu dừng theo BAPAM ("If you experience pain, stop immediately"). Lời giải thích câu hỏi ghế dẫn Lee University. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Phần đau là tín hiệu dừng đúng (NHS, BAPAM return-to-play), nhưng phần chiều cao ghế (cẳng tay song song) không có nguồn bậc 1-2 (xem n6).
  - id: n36
    cau: 'Bài kiểm tra: ngón cái chạm phím bằng cạnh đầu ngón giúp ngón cái nằm thoải mái và dễ luồn dưới bàn tay khi chơi gam; "nhấn rồi buông" là sau khi phím chạm đáy chỉ giữ lực vừa đủ.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên kỹ thuật, khớp phần thân bài (n17, n28).
    luot_2: dung
    luot_2_ghi_chu: "Khuyên tập, hợp cách dạy phổ biến (Chang III.4: ngón cái luôn chơi ở tư thế phẳng)."
  - id: n37
    cau: 'Các liên kết: Giữ đôi tay khỏe (suc-khoe), Tạo tiếng đàn (tieng-dan), Vị trí năm ngón (nam-ngon), Bản đồ bàn phím (ban-do-ban-phim), tài liệu tham khảo; bảng lỗi nhắc "bài cầu tay" và "bài thả rơi cánh tay" của chính trang.'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'ban-do-ban-phim đã chuyển; các trang còn lại ở site cũ: suc-khoe phải giữ "Dấu hiệu cảnh báo" (đau, tê) và mốc nghỉ; tieng-dan phải giữ mục "Sắc thái: điều khiển tốc độ phím" (khớp n2); nam-ngon phải giữ bảng thế tay năm ngón và các bài hai tay đầu tiên; tai-lieu-tham-khao. Bài tập 2 "Cầu tay và đầu ngón vững" và bài tập 1 "Thả rơi cánh tay" có thật trong trang. Review D4-gom: suc-khoe.md (đã chuyển) có "Dấu hiệu cảnh báo" và mốc nghỉ 20/10; tieng-dan.md có "## Sắc thái: điều khiển tốc độ phím"; nam-ngon và ban-do-ban-phim đã chuyển; tai-lieu-tham-khao ở ../opus-zero/docs/; trang có bài tập 1 "Thả rơi cánh tay" và 2 "Cầu tay và đầu ngón vững".'
    review: dung
  - id: n38
    cau: "Hình tu-the-ngoi (::hinh): tư thế ngồi nhìn ngang: lưng thẳng, vai và khuỷu tay thả lỏng, cẳng tay gần song song mặt phím, cổ tay không võng, bàn chân đặt vững, chân phải gần bàn đạp; ghế đàn chỉnh được độ cao."
    loai: quy-tac
    nguon:
      - bapam
      - lee-health
    ket_qua: da-sua
    ghi_chu: 'Chữ trong hình (src/components/hinh/tu-the-ngoi.html), cùng ý các nhận định về ghế và tư thế ở trên (BAPAM, Lee). Người giao (agent làm lô) sửa hình theo lượt 1: bỏ "ngồi nửa trước mặt ghế", "khuỷu tay ngang mặt phím", "gót chạm sàn" (trang đã bỏ, không nguồn); nhãn ghế thành "ghế đàn chỉnh được độ cao"; "cẳng tay song song" thành "gần song song", như bảng chỉnh ghế của trang. Review D4-gom: đã đọc src/components/hinh/tu-the-ngoi.html: nhãn "khuỷu tay, vai thả lỏng", "cẳng tay gần song song mặt phím, cổ tay không võng", "lưng thẳng, vai thả lỏng", "ghế đàn chỉnh được độ cao", "bàn chân đặt vững, chân phải gần bàn đạp"; mỗi ý khớp một nhận định có nguồn (n6, n10, n12–n14: BAPAM, Lee). Không còn "nửa trước mặt ghế", "gót chạm sàn". Hình đúng; không sửa.'
    luot_2: khong-chac
    luot_2_ghi_chu: Mô tả hình ảnh không kiểm được từ nguồn; các ý riêng lẻ (ghế, chân) xem n6, n10, n12.
  - id: n39
    cau: "Hình the-tay (::hinh): thế đúng là cổ tay ở vị trí trung tính, khớp gốc ngón thành vòm, chạm phím bằng đầu ngón; hai lỗi là cổ tay võng xuống dưới mặt phím và gãy khớp đầu ngón khi nhấn (hai lỗi có trong bảng lỗi của trang)."
    loai: quy-tac
    nguon:
      - bapam
      - baylor-ky-thuat
    ket_qua: da-sua
    ghi_chu: 'Chữ trong hình (src/components/hinh/the-tay.html), cùng ý các nhận định về thế tay và bảng lỗi ở trên. Người giao sửa hình theo lượt 1: "cổ tay ngang mặt phím" thành "cổ tay trung tính" (BAPAM: vị trí trung tính); bỏ "tiếng yếu và không đều" (không nguồn); chú thích "hai lỗi người mới hay mắc nhất" thành "hai lỗi trong bảng lỗi ở cuối trang". Review D4-gom: đã đọc src/components/hinh/the-tay.html: thế đúng "cổ tay trung tính" (BAPAM: "neutral position"), "khớp gốc ngón thành vòm, chạm phím bằng đầu ngón" (hướng dẫn kỹ thuật như n17, lượt 2 xác nhận ở mẫu lời khuyên tập); hai lỗi khớp bảng lỗi của trang. Hình đúng; không sửa.'
    luot_2: khong-chac
    luot_2_ghi_chu: Phần hình không kiểm được; Chang III.4 dạy chơi ngón phẳng, không nhắc "vòm khớp gốc ngón"; lỗi cổ tay võng/gãy khớp đầu ngón chỉ hợp cách dạy phổ biến.
  - id: n40
    cau: 'Hình ghe-cao-thap (::hinh, src/components/hinh/ghe-cao-thap.html), đặt sau hình tu-the-ngoi: ba người ngồi nhìn ngang, đàn và phím cùng chiều cao; ghế quá thấp thì khuỷu tay thấp hơn mặt phím, cẳng tay dốc lên; ghế vừa thì cẳng tay gần song song với mặt phím; ghế quá cao thì khuỷu tay cao hơn mặt phím nhiều, cẳng tay dốc xuống nhiều. Đường gạch là đường ngang qua khuỷu tay.'
    loai: quy-tac
    nguon:
      - bapam
      - lee-health
      - yamaha-tu-the
      - uniarts-piano
    ket_qua: dung
    ghi_chu: 'Vẽ lại dòng "Chiều cao" của bảng "Ghế và khoảng cách" ("Cẳng tay gần song song với mặt phím"; "cẳng tay dốc lên là ghế quá thấp, dốc xuống nhiều là ghế quá cao"), cùng nguồn các nhận định về ghế ở trên (BAPAM, Lee: chỉnh ghế để cẳng tay gần song song). Hình không thêm số đo hay góc. Hình có thông tin so sánh tư thế nên đi thủ tục đủ (chuan-kiem-dinh.md mục 7): cần lượt 2.'
    luot_2: dung
    luot_2_ghi_chu: 'Nguồn bậc 2 khác lượt 1: (1) Yamaha, Correct Posture When Playing the Piano, Adjusting the Height of the Bench: "It is difficult to play with your wrists and elbows positioned much lower than the keyboard. Adjust the height of the piano bench so that your elbows are almost level with the keyboard" (khuỷu thấp hơn phím: ghế quá thấp, cẳng tay dốc lên; khuỷu gần ngang phím: cẳng tay gần song song). (2) Uniarts Helsinki, Piano: "The piano height should be such that the elbow joints are at a 90-110 degree angle"; "If the forearm and the wrist bend because the piano is too low, the piano should be raised ... or the pianist should ... sit on a lower seat" (ghế cao so với phím thì cẳng tay, cổ tay gập xuống). Kết luận: đúng; ba hình (dốc lên, gần song song, dốc xuống nhiều) khớp nguồn. Hình không cần sửa.'
    review: dung
