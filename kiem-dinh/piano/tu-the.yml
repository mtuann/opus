    ket_qua: dung
    ghi_chu: 'Xoay cẳng tay: L:1/8, mỗi ô 8 nốt móc đơn (4 phách), ô cuối C8; luân phiên ngón 1-5, 1-4, 1-3 (C–G, C–F, C–E), khớp "ngón 1 và 5, rồi 1–4, 1–3". Một bè khóa Sol; lời chú "tay trái làm tương tự một quãng tám dưới" là lời dẫn, không có bè tay trái.'
ghi_chu: 'Lượt 1 trang Tư thế, thế tay và cách dùng lực (lô D4-L1, phần 2/2). Trang sức khỏe: nguồn bậc 2 y học biểu diễn: BAPAM The Healthy Pianist (tờ thông tin PDF), Lee University Pianist Health and Injury Prevention, tổng quan phạm vi Tummolo và cộng sự 2026 (IJOMEH, PMID 42478673); đã đọc thêm Horvath 2014 (American Music Teacher), Kaufman-Cohen 2018 (PLoS ONE), Ashkenazi 2025 (Frontiers in Psychology) để quyết định bỏ cơ chế đồng co cơ. Cơ cấu búa và vận tốc: Goebl, Bresin, Galembo 2004; Yamaha weighted keys; số ngón: Baylor (qua bản ghi thuật ngữ fingering đã khóa). Chỉ chọn câu nào có trong nguồn y học mới giữ; hướng dẫn kỹ thuật thuần (điểm chạm, vòm, ngón cái, bài tập) xếp khuyen-tap, không dùng làm khẳng định sức khỏe. Đã bỏ hoặc sửa: khuỷu tay ngang hoặc hơi cao hơn phím, ngồi nửa trước mặt ghế, gót chạm sàn, cổ tay "ngang mặt phím", cơ chế đồng co cơ, mọi so sánh "tinh tế hơn nhiều", "mỏi cơ nhẹ là bình thường", nghỉ 5 phút sau 25–30 phút (sửa theo BAPAM: 10 phút sau 20 phút). Còn một câu chưa chốt nguồn: n34 (đi khám khi kéo dài), ket_qua null. CẦN SỬA THÀNH PHẦN (không sửa ở đây): ::hinh{ten="tu-the-ngoi"} (src/components/hinh/tu-the-ngoi.html) vẫn ghi "ngồi nửa trước mặt ghế" (aria-label, nhãn "ngồi nửa trước", chú thích) và "khuỷu tay ngang mặt phím" (nhãn, đường đứt nét, chú thích); ::hinh{ten="the-tay"} (the-tay.html) vẫn ghi "cổ tay ngang mặt phím", nhãn "tiếng yếu và không đều" ở lỗi gãy khớp đầu ngón và chú thích "hai lỗi người mới hay mắc nhất" (không nguồn). Trang đã bỏ các ý đó, nên hình và chữ đang lệch nhau. ::hinh{ten="hands"} (đánh số ngón) đúng. Khối abc: 4 khối, ô nào cũng đủ 4 phách (khối 4 dùng L:1/8, 8 nốt mỗi ô); ngón bấm khớp lời dẫn (bài 1 ngón 3-2-4-1-5; bài 4 ngón 1-5, 1-4, 1-3). Đợt 3 "giữ" của trang này khớp trang mới. Chưa chuyển, trang này trỏ tới: piano/nam-ngon, suc-khoe, tieng-dan, tai-lieu-tham-khao; mỗi trang phải giữ: xem n37. Thuật ngữ chưa có trong src/data/thuat-ngu.yml (grep 28/10/2026): cơ chế thoát (escapement), thế tay (hand position), vị trí trung tính của cổ tay (neutral wrist), nhấn rồi buông, trọng lượng cánh tay (arm weight), đầu ngón vững. Không tính là nhận định: tiêu đề, mục Nguồn (sách in Neuhaus, Mark, Sándor, Bernstein; Fitch: đã đối chiếu thông tin xuất bản, chỉ tả chung) và các dòng liên kết "Học tiếp".'
doi_chu:
  - cu: Tư thế không phải chuyện "ngồi cho đẹp". Nó quyết định tiếng đàn của bạn, tốc độ bạn có thể đạt tới, và đôi tay có còn khỏe sau nhiều năm chơi đàn hay không. Thói quen của vài tháng đầu rất khó sửa về sau, nên hãy đọc kỹ trang này và quay lại tự kiểm tra mỗi tuần.
    moi: Tư thế không phải chuyện "ngồi cho đẹp". Nó ảnh hưởng đến cách bạn điều khiển tiếng đàn và đến sức khỏe đôi tay. Hãy đọc kỹ trang này và quay lại tự kiểm tra mỗi tuần.
    ly_do: 'n1 (da-sua): bỏ "quyết định", "tốc độ", "sau nhiều năm" và "rất khó sửa về sau", không có nguồn; giữ "ảnh hưởng" (tổng quan Tummolo 2026, BAPAM).'
  - cu:
      - Tiếng đàn. Một nốt piano to hay nhỏ phụ thuộc vào tốc độ phím đi xuống. Một cánh tay thả lỏng điều khiển tốc độ ấy tinh tế hơn nhiều so với những ngón tay gồng cứng.
      - "Tốc độ và độ đều. Khi cơ gồng, các nhóm cơ đối nghịch kéo ngược nhau: ngón tay chậm lại, nốt không đều, và bạn mau mệt."
      - Sức khỏe. Một chút căng thẳng lặp lại hàng nghìn lần mỗi buổi là nguyên nhân phổ biến của đau cổ tay, cẳng tay và vai ở người chơi đàn. Xem thêm Giữ đôi tay khỏe.
    moi:
      - Tiếng đàn. Một nốt piano to hay nhỏ phụ thuộc vào tốc độ phím đi xuống.
      - "Thả lỏng. Hãy tập sao cho động tác không gồng: khuỷu tay, vai và cổ tay không siết."
      - Sức khỏe. Đau cổ tay, cẳng tay, cổ và vai là những vấn đề thường gặp ở người chơi piano; tư thế và việc tập lâu không nghỉ là các yếu tố nguy cơ. Xem thêm Giữ đôi tay khỏe.
    ly_do: 'n4 (da-sua): bỏ cơ chế đồng co cơ (kết luận chưa thống nhất); thay bằng lời BAPAM về động tác không gồng.; n5 (da-sua): bỏ cơ chế "căng thẳng lặp lại hàng nghìn lần"; giữ yếu tố nguy cơ có trong tổng quan Tummolo 2026 và hướng dẫn Lee University.'
  - cu: Cẳng tay gần song song với mặt phím; khuỷu tay ngang hoặc hơi cao hơn mặt phím trắng
    moi: Cẳng tay gần song song với mặt phím
    ly_do: 'n6 (da-sua): bỏ "khuỷu tay ngang hoặc hơi cao hơn mặt phím trắng", nguồn y khoa không nêu độ cao khuỷu; giữ cẳng tay song song (Lee).; n35 (da-sua): đáp án đúng bỏ "khuỷu tay ngang hoặc hơi cao hơn phím" theo n6.'
  - cu:
      - Khuỷu tay ở hơi trước thân người; chỉ cần nghiêng người là chạm được phím thấp nhất và cao nhất
      - Khuỷu tay bị ép vào sườn là ngồi quá gần; phải chồm người về trước là quá xa
    moi:
      - Ngồi đủ xa để ngực mở; chỉ cần nghiêng người là chạm được phím thấp nhất và cao nhất
      - Thấy ngực bị bó lại là ngồi quá gần; phải chồm người về trước là quá xa
    ly_do: 'n7 (da-sua): khoảng cách theo BAPAM ("chest remains open"); bỏ các mô tả về khuỷu tay không có nguồn.'
  - cu: Nửa trước mặt ghế; trọng lượng chia cho mông và hai bàn chân
    moi: Trọng lượng chia đều cho hai bên mông và hai bàn chân
    ly_do: 'n8 (da-sua): bỏ "nửa trước mặt ghế" (BAPAM, Lee không nêu); theo BAPAM trọng lượng chia đều cho hai xương ngồi.'
  - cu: Hai bàn chân đặt phẳng; chân phải ở gần bàn đạp vang, gót chạm sàn
    moi: Hai bàn chân đặt vững trên sàn hoặc trên một bục chắc; chân phải ở gần bàn đạp vang
    ly_do: 'n10 (da-sua): bỏ "gót chạm sàn"; theo BAPAM và Lee, chân đặt vững trên sàn hoặc bục chắc.'
  - cu: "Nên dùng ghế đàn chỉnh được độ cao (có núm vặn hai bên). Ghế ăn hay ghế văn phòng thường quá cao hoặc quá thấp, và làm hỏng mọi điều bên dưới. Người nhỏ người, chân không chạm sàn: kê một bục thấp để bàn chân có chỗ tựa; nếu chưa với tới bàn đạp, có loại bàn đạp nối dài làm riêng cho trường hợp này."
    moi: "Nên dùng ghế đàn chỉnh được độ cao (có núm vặn hai bên): ghế cố định rất khó đưa cẳng tay về song song với mặt phím. Người nhỏ người, chân không chạm sàn: kê một bục thấp để bàn chân có chỗ tựa."
    ly_do: 'n11 (da-sua): bỏ "thường quá cao hoặc quá thấp", "làm hỏng mọi điều bên dưới" và câu về bàn đạp nối dài (không nguồn, là chi tiết món hàng).'
  - cu:
      - Lưng thẳng tự nhiên, hơi nghiêng về trước từ khớp hông. Không gù, không ưỡn cứng.
      - Vai thả xuống. Đoạn khó thường khiến vai nhô lên dần mà ta không biết; hãy tự kiểm tra mỗi khi lật trang.
      - Cánh tay trên treo từ vai như dây đu; khuỷu tay không ép sát sườn, không xòe rộng như cánh gà.
      - Cẳng tay, cổ tay và bàn tay nhìn từ trên xuống gần như một đường thẳng. Khi chơi xa sang hai bên, hãy để cẳng tay di chuyển theo, đừng bẻ cổ tay sang ngang.
    moi:
      - Lưng thẳng tự nhiên, không gù, không gồng.
      - Vai thả xuống. Hãy tự kiểm tra vai mỗi khi lật trang.
      - Cánh tay trên thả lỏng từ vai, khuỷu tay không gồng.
      - Cẳng tay nhìn từ trên xuống thẳng hàng với ngón 3, 4, 5 chứ không phải với ngón cái. Khi chơi xa sang hai bên, hãy để cẳng tay di chuyển theo, đừng bẻ cổ tay sang ngang.
    ly_do: 'n12 (da-sua): theo BAPAM (lưng thẳng, không gù, không gồng); bỏ "hơi nghiêng về trước từ khớp hông" (không nguồn).; n13 (da-sua): bỏ "Đoạn khó thường khiến vai nhô lên dần mà ta không biết", khái quát không nguồn.; n14 (da-sua): theo BAPAM (khuỷu tay thả lỏng từ vai); bỏ "ép sát sườn, xòe rộng như cánh gà".; n15 (da-sua): theo BAPAM, cẳng tay thẳng hàng với ngón 3-4-5, không phải ngón cái.'
  - cu: 'Cổ tay nằm ngang mặt phím hoặc hơi cao hơn: không võng xuống dưới mặt phím, không nhô cao như đang múa. Quan trọng hơn vị trí là sự linh hoạt. Cổ tay khẽ lên xuống theo câu nhạc, xoay nhẹ khi chơi các nốt cách xa, đi ngang theo ngón tay. Một cổ tay "khóa cứng" truyền mọi chấn động lên cẳng tay và vai, và làm tiếng đàn khô, chát.'
    moi: "Cổ tay ở vị trí trung tính, không quá cao cũng không quá thấp. Cách tìm: thả cánh tay buông thõng bên người, rồi đưa tay lên phím mà giữ nguyên cảm giác ấy. Quan trọng hơn vị trí là sự linh hoạt. Cổ tay khẽ lên xuống theo câu nhạc, xoay nhẹ khi chơi các nốt cách xa, đi ngang theo ngón tay; đừng khóa cứng nó."
    ly_do: 'n16 (da-sua): theo BAPAM, cổ tay ở vị trí trung tính (không quá cao hay thấp); bỏ "ngang mặt phím hoặc hơi cao hơn" và cơ chế "truyền chấn động, tiếng khô, chát".'
  - cu: Ngón út "đứng" trên đầu ngón, hơi cong. Nó ngắn và yếu nhất, nên cần cẳng tay xoay nhẹ về phía nó để đỡ, thay vì nằm bẹt ra.
    moi: Ngón út "đứng" trên đầu ngón, hơi cong. Nó ngắn hơn các ngón khác, nên cần cẳng tay xoay nhẹ về phía nó để đỡ, thay vì nằm bẹt ra.
    ly_do: 'n19 (da-sua): bỏ "yếu nhất", không nguồn.'
  - cu: "Trên bản nhạc, số ngón được in sát nốt. Hãy làm theo số ngón ngay từ đầu: ngón bấm hợp lý quyết định bạn có chơi nhanh và chắc được về sau hay không. Khi tự chọn ngón bấm, viết nó lên bản nhạc bằng bút chì và giữ nguyên mỗi lần tập."
    moi: "Trên bản nhạc, số ngón được in sát nốt. Hãy làm theo số ngón ngay từ đầu: để tay quen một cách bấm ổn định. Khi tự chọn ngón bấm, viết nó lên bản nhạc bằng bút chì và giữ nguyên mỗi lần tập."
    ly_do: 'n23 (da-sua): bỏ "quyết định bạn có chơi nhanh và chắc", không nguồn; giữ lời khuyên.'
  - cu: 'Ép phím sau khi chạm đáy là vô ích: tiếng không to hơn, không dài hơn, chỉ làm tay mỏi và căng. Sau khi nhấn, chỉ giữ một lực vừa đủ để phím không bật lên. Đó là nguyên tắc "nhấn rồi buông".'
    moi: 'Ép phím sau khi chạm đáy không đổi được tiếng đàn: tiếng không to hơn, chỉ thêm lực thừa cho tay. Sau khi nhấn, chỉ giữ một lực vừa đủ để phím không bật lên. Đó là nguyên tắc "nhấn rồi buông".'
    ly_do: 'n26 (da-sua): bỏ "không dài hơn" (đàn vẫn ngân khi giữ phím) và "làm tay mỏi và căng" (không nguồn).'
  - cu: 'Người mới thường làm ngược lại: ngón tay "đẩy" cứng còn cánh tay gồng treo trên không. Kết quả là tiếng đàn chát và tay mỏi sau mười lăm phút. Khi đã quen dùng trọng lượng, bạn sẽ thấy chơi to dễ hơn mà chơi nhỏ cũng đều hơn. Cách điều khiển tiếng đàn chi tiết hơn nằm ở trang Tạo tiếng đàn.'
    moi: 'Đừng làm ngược lại: ngón tay "đẩy" cứng còn cánh tay gồng treo trên không. Cách điều khiển tiếng đàn chi tiết hơn nằm ở trang Tạo tiếng đàn.'
    ly_do: 'n27, n28 (da-sua): bỏ "người mới thường", "tiếng chát, tay mỏi sau mười lăm phút" và lời hứa "chơi to dễ hơn" (không nguồn); trỏ sang trang Tạo tiếng đàn.'
  - cu: Mỗi tuần quay một đoạn video một phút từ bên cạnh (thấy vai, khuỷu tay, cổ tay) và từ phía trên (thấy hình dạng bàn tay). Đối chiếu với bảng lỗi bên dưới. Những gì bạn không cảm thấy khi chơi thường lộ ra rất rõ trên video.
    moi: Mỗi tuần quay một đoạn video một phút từ bên cạnh (thấy vai, khuỷu tay, cổ tay) và từ phía trên (thấy hình dạng bàn tay). Đối chiếu với bảng lỗi bên dưới.
    ly_do: 'n29 (da-sua): bỏ câu khái quát "những gì không cảm thấy khi chơi thường lộ ra rất rõ trên video" (không nguồn); giữ cách làm.'
