doi_chu:
  - cu:
      - "Đàn cánh có cơ cấu thoát kép (double escapement), do Sébastien Érard đăng ký bằng sáng chế ở Anh năm 1821; nó là tiền thân của cơ cấu đàn cánh ngày nay. Sau khi búa đập dây, một cần lặp có lò xo đỡ búa ở lưng chừng, nên khi phím mới trồi lên một phần, bộ máy đã sẵn sàng: bạn đánh lại được mà không cần nhả phím hết."
      - "Đàn đứng thông thường không có cần ấy: phím phải trồi lên gần như hết mới đánh lại được. Nốt lặp rất nhanh trên đàn đứng vì thế khó hơn, và bạn phải nhả phím nhiều hơn."
    moi:
      - "Đàn cánh có cơ cấu thoát kép (double escapement), do nhà Érard đăng ký bằng sáng chế ở Anh năm 1821; nó là tiền thân của cơ cấu đàn cánh ngày nay. Sau khi búa đập dây, búa được giữ ở lưng chừng và một cần lặp đặt lại cơ cấu đẩy, nên khi phím mới trồi lên một phần, bộ máy đã sẵn sàng: bạn đánh lại được mà không cần nhả phím hết."
      - "Đàn đứng thông thường không có cơ cấu thoát kép: phím phải trồi lên gần như hết mới đánh lại được. Nốt lặp rất nhanh trên đàn đứng vì thế khó hơn, và bạn phải nhả phím nhiều hơn."
    ly_do: "n4 (da-sua): Finchcocks ghi Pierre Érard đăng ký ở London; không nguồn nào nói Sébastien.; n5 (da-sua): Wikipedia Piano action: back check giữ búa, cần lặp đặt lại jack; không nói cần lặp có lò xo đỡ búa.; n6 (da-sua): khớp câu trước; Steinert: đàn đứng phải để phím lên gần hết."
  - cu: "Nốt kép là hai nốt chơi cùng lúc bằng một tay, thường là quãng ba hoặc quãng sáu (xem Quãng). Có ba cái khó: hai nốt phải vào cùng lúc, hai bè phải nối (khi legato), và nốt trên, thường là giai điệu, phải to hơn nốt dưới trong cùng một cú đánh."
    moi: "Trang này gọi hai nốt chơi cùng lúc bằng một tay là nốt kép, và bàn về hai loại: quãng ba và quãng sáu (xem Quãng). Có ba cái khó: hai nốt phải vào cùng lúc, hai bè phải nối (khi legato), và nốt trên, thường là giai điệu, phải to hơn nốt dưới trong cùng một cú đánh."
    ly_do: "n21 (da-sua, review D4-gom): không có nguồn bậc 1–2 cho định nghĩa; viết thành cách gọi của site."
  - cu: Bè trên được ưu tiên. Giữ bè trên legato bằng ngón; bè dưới (thường là ngón cái) được hở một chút. Tai người nghe theo bè trên.
    moi: Bè trên được ưu tiên. Giữ bè trên legato bằng ngón; bè dưới (thường là ngón cái) được hở một chút. Tai người nghe có xu hướng ưu tiên bè cao nhất (Trainor và cộng sự, 2014; xem Nguồn).
    ly_do: "n25 (da-sua, review D4-gom): viết theo Trainor và cộng sự (2014), Hearing Research 308."
  - cu: "Bè trên luân phiên 4 và 5: 5 trên phím trắng, 4 trên phím đen, như quãng tám legato (xem Quãng tám và bước nhảy). Tay lớn dùng thêm 3."
    moi: "Bè trên luân phiên 4 và 5: 4 thường nhận phím đen, 5 phím trắng; hai phím trắng liền nhau thì một phím dùng 4 (như Rê – Mi ở bài 5), như quãng tám legato (xem Quãng tám và bước nhảy). Tay lớn dùng thêm 3."
    ly_do: "n30 (da-sua, review D4-gom): khớp quy tắc với khối abc 5 (ngón 4 trên Rê cạnh Mi)."
  - cu: "Quãng ba nửa cung là một trong những kỹ thuật khó nhất của piano: ngón bấm đặc biệt, mỗi sách một kiểu, và đòi hỏi bàn tay đã thật thả lỏng ở quãng ba thường. Đừng tập trước khi gam quãng ba đã trôi chảy. Đích đến nổi tiếng là Étude Op. 25 số 6 (Sol♯ thứ) của Chopin, một étude về quãng ba; cùng tập ấy, số 8 (Rê♭ trưởng) là étude về quãng sáu. Trong 12 Études, Debussy cũng viết riêng Pour les tierces (cho quãng ba), Pour les sixtes (cho quãng sáu) và Pour les notes répétées (cho nốt lặp)."
    moi: Quãng ba nửa cung cần ngón bấm riêng (Graham Fitch có một mục về quãng ba thứ nửa cung trong bài "Nimble Chromatics") và đòi hỏi bàn tay đã thật thả lỏng ở quãng ba thường. Đừng tập trước khi gam quãng ba đã trôi chảy. Đích đến nổi tiếng là Étude Op. 25 số 6 (Sol♯ thứ) của Chopin, một étude về quãng ba; cùng tập ấy, số 8 (Rê♭ trưởng) là étude về quãng sáu. Trong 12 Études, Debussy cũng viết riêng Pour les tierces (cho quãng ba), Pour les sixtes (cho quãng sáu) và Pour les notes répétées (cho nốt lặp).
    ly_do: "n35 (da-sua, review D4-gom): bỏ đánh giá không kiểm được; dẫn Fitch."
  - cu: Ánh trăng cuối ô 5, ô 6–9; Valse Si thứ ô 69–72, 77–80 (nốt lặp), ô 81–88 (quãng ba); Thuyền ca Venice ô 7–17, 34–39
    moi: Ánh trăng cuối ô 5, ô 6–9; Thuyền ca Venice ô 7–17, 34–39
