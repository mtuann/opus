    ghi_chu: "chưa chắc: nhận định tri giác (người nghe chú ý bè trên) lặp lại ở tieng-dan và quang-tam; chưa mở nguồn (ví dụ nghiên cứu về melody lead hay về ưu thế của bè cao). Nếu không có nguồn, nên viết lại thành lời khuyên \"ưu tiên bè trên\" bỏ vế giải thích. Review D4-gom: nguồn bậc 2 (bài báo có bình duyệt, bản PDF trên trang phòng thí nghiệm của tác giả, mở 28/10/2026): Trainor, Marie, Bruce, Bidelman (2014), Hearing Research 308: 60–70: \"human listeners show a systematic perceptual bias in processing the highest voice\"; \"compositional practice is to place the most important melody line in the voice or stream with highest pitch\". Bài không nói người nghe chỉ theo bè trên, nên viết mềm lại. Chữ cũ: \"Tai người nghe theo bè trên.\" Chữ mới: \"Tai người nghe có xu hướng ưu tiên bè cao nhất (Trainor và cộng sự, 2014; xem Nguồn).\" Thêm nguồn vào mục Nguồn của trang."
