    ket_qua: da-sua
    ghi_chu: "chưa chắc: vế \"tai người nghe theo bè trên\" cùng nhận định tri giác ở trên, chưa có nguồn; vế \"ưu tiên bè trên\" là lời khuyên tập. Review D4-gom: nguồn bậc 2 (bài báo có bình duyệt, bản PDF trên trang phòng thí nghiệm của tác giả, mở 28/10/2026): Trainor, Marie, Bruce, Bidelman (2014), Hearing Research 308: 60–70: \"human listeners show a systematic perceptual bias in processing the highest voice\"; \"compositional practice is to place the most important melody line in the voice or stream with highest pitch\". Bài không nói người nghe chỉ theo bè trên, nên viết mềm lại. Chữ cũ (lời giải thích): \"Bè trên thường là giai điệu, và tai người nghe theo bè trên.\" Chữ mới: \"… và tai người nghe có xu hướng ưu tiên bè cao nhất.\" Lời giải thích không dựa vào vị trí lựa chọn."
