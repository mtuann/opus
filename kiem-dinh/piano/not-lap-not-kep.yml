nhan_dinh:
  - id: n1
    cau: Trang đi từ nốt lặp đến nốt kép (quãng ba legato, quãng sáu, nốt kép staccato), kèm sáu bài tập và bảng tập theo lộ trình.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Trang có đúng sáu bài tập (6 khối abc) và các bảng "Tập theo chặng"; khớp mô tả. Review: đã kiểm câu mở đầu (dòng 6) khớp các mục: Nốt lặp, Nốt kép (Quãng ba legato, Quãng sáu, Nốt kép staccato), sáu khối abc (Bài 1–6), bảng "## Tập theo chặng"; link /opus/piano/lo-trinh/ có trong dist/.'
    review: dung
  - id: n2
    cau: Muốn đánh lại một nốt, bộ máy bên trong (phím, cần đẩy, búa) phải về lại vị trí sẵn sàng; nếu ngón đè phím xuống trước khi phím trồi lên đủ, nốt sẽ không kêu, hoặc lúc kêu lúc không.
    loai: quy-tac
    nguon:
      - yamaha-mech
      - wiki-action
      - steinert
    ket_qua: dung
    ghi_chu: "Yamaha: cơ cấu lặp của Érard cho phép đánh lại nốt mà không phải nhả hết phím; Steinert: trên đàn đứng người chơi phải để phím lên gần hết; Wikipedia Piano action: cần lặp đặt lại cơ cấu đẩy (jack). \"Lúc kêu lúc không\" là hệ quả suy ra, không có câu nguyên văn."
    luot_2: dung
    luot_2_nguon: [ "https://www.yamaha.com/en/musical_instrument_guide/piano/mechanism/mechanism003.html", "https://msteinert.com/blog/grand-vs-upright-piano-actions" ]
    luot_2_ghi_chu: "Cơ cấu thường (đàn đứng) cần phím trồi lại gần hết mới đánh lại; Steinert: trên đàn đứng phải nhấc phím gần hết về vị trí nghỉ. Pianist: ở nốt lặp chậm có nốt không kêu vì chưa nhả đủ."
  - id: n3
    cau: Nốt lặp nhanh ít phụ thuộc vào "ngón khỏe" mà phụ thuộc vào việc nhả phím đúng mức và đổi ngón.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập, lập luận từ n trước.
  - id: n4
    cau: Đàn cánh có cơ cấu thoát kép (double escapement), do nhà Érard đăng ký bằng sáng chế ở Anh năm 1821; nó là tiền thân của cơ cấu đàn cánh ngày nay.
    loai: lich-su
    nguon:
      - finchcocks
      - horniman
      - squarepianos
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"do Sébastien Érard đăng ký bằng sáng chế ở Anh năm 1821\". Finchcocks: bằng sáng chế do Pierre Érard (cháu Sébastien) đăng ký ở London năm 1821; Horniman: \"In 1821 Erard patented ... the double escapement\"; squarepianos: đăng ký tháng 12/1821, cơ sở của mọi cơ cấu đàn hiện đại. Không nguồn nào nói người đăng ký là Sébastien nên đổi thành \"nhà Érard\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.horniman.ac.uk/object/M99-1983", "https://www.finchcocks.co.uk/Richard-Burnett-Collection/file/erard.php", "https://www.mbam.qc.ca/en/articles/bourgie-halls-erard-piano/" ]
    luot_2_ghi_chu: "Horniman: 'In 1821, Erard patented a new action ... the double escapement'; Finchcocks: cơ cấu thoát kép 'patented by Pierre in London in 1821' (Pierre là cháu Sébastien, cùng nhà Érard). Yamaha: cơ cấu lặp (thoát kép) do Érard phát minh. 'Tiền thân cơ cấu đàn cánh ngày nay': MBAM Montréal gọi 'a direct antecedent of the modern grand piano'."
  - id: n5
    cau: "Sau khi búa đập dây, búa được giữ ở lưng chừng và một cần lặp (repetition lever) đặt lại cơ cấu đẩy, nên khi phím mới trồi lên một phần, bộ máy đã sẵn sàng: bạn đánh lại được mà không cần nhả phím hết."
    loai: quy-tac
    nguon:
      - wiki-action
      - yamaha-mech
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"một cần lặp có lò xo đỡ búa ở lưng chừng\". Wikipedia Piano action: back check giữ búa ở lưng chừng, cần lặp đặt lại jack; không nói cần lặp có lò xo đỡ búa. Yamaha: cơ cấu lặp cho phép lặp nốt nhanh mà không nhả hết phím. Sửa lời theo hai nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://www.yamaha.com/en/musical_instrument_guide/piano/mechanism/mechanism003.html", "https://msteinert.com/blog/grand-vs-upright-piano-actions" ]
    luot_2_ghi_chu: "Yamaha: cơ cấu lặp 'lets a pianist quickly repeat a note without having to fully release the key'; Steinert: búa đánh lại được khi phím chưa về hết. Chi tiết 'búa giữ lưng chừng' (back check) và 'cần lặp đặt lại cơ cấu đẩy' khớp mô tả cơ cấu cánh."
  - id: n6
    cau: "Đàn đứng thông thường không có cơ cấu thoát kép: phím phải trồi lên gần như hết mới đánh lại được; nốt lặp rất nhanh trên đàn đứng vì thế khó hơn, và bạn phải nhả phím nhiều hơn."
    loai: quy-tac
    nguon:
      - steinert
      - yamaha-mech
    ket_qua: da-sua
    ghi_chu: "Câu cũ: \"không có cần ấy\" (cần lặp có lò xo, đã sửa ở trên). Steinert: trên đàn đứng \"lift the key almost entirely back up\". Đổi \"cần ấy\" thành \"cơ cấu thoát kép\" cho khớp câu trước; chưa có nguồn nói mọi đàn đứng đều thiếu bộ phận lặp nên giữ chữ \"thông thường\"."
    luot_2: dung
    luot_2_nguon: [ "https://msteinert.com/blog/grand-vs-upright-piano-actions", "https://www.yamaha.com/en/musical_instrument_guide/piano/mechanism/mechanism003.html" ]
    luot_2_ghi_chu: "Steinert: đàn đứng 'requires the pianist to lift the key almost entirely back up', nên lặp nốt chậm hơn đàn cánh. Câu 'đàn đứng thông thường không có thoát kép' khớp."
  - id: n7
    cau: "Đàn điện mỗi loại một khác; hãy thử ngay trên đàn của bạn: đánh một nốt, nhả từ từ, xem phím phải trồi lên tới đâu thì đánh lại được."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên thử trên đàn của mình; không khẳng định số liệu.
  - id: n8
    cau: Nốt lặp chậm, hát, có thể dùng một ngón; nốt lặp nhanh thì đổi ngón từ ngón ngoài vào ngón cái (3-2-1, 4-3-2-1), mỗi ngón rút nhẹ về phía lòng bàn tay; cổ tay xoay nhẹ theo mỗi nhóm; một xung nhỏ của cẳng tay ở nốt đầu mỗi nhóm.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên kỹ thuật và bấm ngón.
  - id: n9
    cau: Chùm ba dùng 3-2-1, móc kép dùng 4-3-2-1.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên bấm ngón.
  - id: n10
    cau: "Bảng \"Trên site\": bốn nốt lặp của Arietta (ô 1–4); nốt Sol♯ lặp nhịp chấm dôi của Ánh trăng (cuối ô 5, ô 6–9); nốt lặp tay trái của đoạn C Für Elise."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Trang cũ grieg-arietta (chưa chuyển): bốn nốt giai điệu lặp cùng cao độ ở ô 1–4 (dòng 44, 58 của opus-zero/docs/piano/tac-pham/grieg-arietta.md). Trang cũ beethoven-anh-trang (chưa chuyển): nhịp lấy đà cuối ô 5, ô 6–9 nốt Sol♯ lặp với nhịp chấm dôi (dòng 61). Trang mới tac-pham/fur-elise đã chuyển: đoạn C tay trái gõ La trầm liên tục, bài tập 3 đổi ngón 3–2–1 (dòng 59, 107). Lô chuyển Arietta và Ánh trăng phải giữ các ô nhịp này. Review: đã kiểm bảng dòng 27–32 và trang cũ (chưa chuyển): ../opus-zero/docs/piano/tac-pham/grieg-arietta.md dòng 44 (bốn nốt giai điệu lặp); beethoven-anh-trang.md dòng 61 (nhịp lấy đà cuối ô 5, ô 6–9, Sol♯ lặp chấm dôi); fur-elise có trong dist/. Lô chuyển Arietta, Ánh trăng giữ các ô ấy."
    review: dung
  - id: n11
    cau: "Nốt lặp nhịp chấm dôi ở Valse Si thứ: ô 69–72 và 77–80, đổi ngón 3-2-1."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "chưa chắc: trang cũ chopin-valse-si-thu (chưa chuyển) ghi trio ô 65–80 và \"những nốt lặp nhịp chấm dôi ở ô 69–72\" (dòng 63); không thấy ô 77–80. Lô chuyển trang đó phải giữ ô 69–72 và kiểm ô 77–80 trên bản nhạc. Review: đã kiểm ../opus-zero/docs/piano/tac-pham/chopin-valse-si-thu.md (chưa chuyển): dòng 123 bảng chỗ khó \"Nốt lặp nhịp chấm dôi (ô 69–72, 77–80) … Đổi ngón trên nốt lặp (ví dụ 3 – 2 – 1)\"; dòng 82 trio là câu 8 ô nói hai lần (65–80), nên 77–80 ứng với 69–72. Lô chuyển giữ hai cụm ô này. Sửa nhỏ (mo/sua-nho, 07/11/2026, kế hoạch mở rộng mục 4): Valse Si thứ (dữ liệu chặng 6, Grade 7–8) chuyển từ hàng chặng 5 sang hàng chặng 6 của bảng (d6-l4-gom). Sửa nhỏ (mo/sua-nho, 07/11/2026, kế hoạch mở rộng mục 4): bỏ chữ \"Sol♯\" sai ở câu hồ sơ (nốt lặp không phải Sol♯; trang không ghi tên nốt)."
    review: dung
  - id: n12
    cau: "Beethoven, Sonata Op. 49 số 2: hình đệm nốt lặp tay trái ở ô 6–8, 21–24, nốt lặp ở ô 59–62 và quãng ba ngân ở ô 44–48."
    loai: cau-truc
    nguon:
      - mutopia-op49
    ket_qua: dung
    ghi_chu: "Bản chép Mutopia (Breitkopf & Härtel), số ô đếm từ bản nhạc: nốt lặp tay trái ở ô 6–8, 21–24, 29–32; Si lặp ô 59–62; quãng ba ngân ô 44–48. Trang cũ beethoven-op49-2 (chưa chuyển) cũng ghi ô 6–8, 21–24, 44–48 và 59–62 (dòng 27, 86, 87): khớp. Review D4-gom: lượt 2 không mở được bản nhạc. Đã đọc tệp Mutopia (LVB_Sonate_49no2_1.ly, mở 28/10/2026), đếm ô của khuông dưới: ô 6–8 hình đệm có nốt Rê5 lặp xen (b' d'' a' d'' g' d'' …); ô 59–62 tám móc đơn Si mỗi ô (b8 b' b' …). Khớp; giữ."
    luot_2: khong-chac
    luot_2_ghi_chu: Không tìm được bản nhạc Op. 49 số 2 mở được (không có trên Mutopia trong danh sách Beethoven; PDF IMSLP bị chặn), nên không kiểm được các số ô 6–8, 21–24, 59–62, 44–48.
  - id: n13
    cau: "Bài 1 (đổi ngón trên nốt lặp): ô 1–2 nhóm ba với 3-2-1, ô 3–4 nhóm bốn với 4-3-2-1; tay trái chơi hợp âm lặp."
    loai: ve-site
