    ket_qua: null
    ghi_chu: 'chưa chắc: chỉ Wikipedia (bậc 3): "You must have played well today, for I did not notice you"; Moore gọi Bos là "the doyen of accompanists". Nguồn gốc là sách của Moore (không đọc được).'
