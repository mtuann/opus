nhan_dinh:
  - id: n1
    cau: Trang dành cho bạn từ khoảng chặng 3 của lộ trình trở lên.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm ở src/content/docs/piano/lo-trinh.md: chặng 3 "Sơ trung cấp (≈ Grade 3)"; chặng 4 hàng "Đọc nhạc" ghi "Bắt đầu đọc nhạc bốn tay cùng người khác", chặng 5 hàng "Biểu diễn" ghi "Thử song tấu bốn tay hoặc đệm cho một người bạn". "Từ khoảng chặng 3" không trái điều đó.'
  - id: n2
    cau: Trang nói về bốn tay và hai đàn, đệm hát, song tấu với nhạc cụ khác, nhạc thính phòng, cách tập chung và nơi tìm bạn chơi.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Các mục ## trên trang: Piano bốn tay, Hai đàn piano, Đệm hát, Song tấu với một nhạc cụ, Nhạc thính phòng, Tập chung cho hiệu quả, Tìm bạn chơi; đủ bảy ý."
  - id: n3
    cau: "Liên kết sang trang đã chuyển: lộ trình, bàn đạp vang, tư thế, hợp âm rải và hình đệm, thể loại, thị tấu, nhà soạn nhạc (Schubert), học thuộc và biểu diễn, khóa Đô và dịch giọng, đọc tổng phổ, bè trầm số."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên src/content/docs: piano/lo-trinh, ban-dap, tu-the, hop-am-rai, the-loai (mục "Piano chơi cùng người khác" có bốn tay và hai đàn; đoạn lịch sử riêng cho bốn tay không có, chỉ có dòng bảng "Mọi thời kỳ"), thi-tau, nha-soan-nhac (có mục Franz Schubert), hoc-thuoc-bieu-dien, nhac-ly/17-khoa-do-dich-giong, 20-doc-tong-pho, 25-be-tram-so.'
  - id: n4
    cau: 'Liên kết sang trang chưa chuyển: luyen-tap/metronome ("Máy đếm nhịp"), choi-theo ("Chơi theo"), thu-am ("Thu âm buổi tập"), nhat-ky ("Nhật ký luyện tập"), thi-tau-hai-tay ("Thị tấu hai tay"), nghe-nhac/mozart-concerto-21, schubert-erlkonig, schubert-ca-hoi, nhac-cu/violin, cello, sao, piano/thay-va-thi ("Học với thầy và thi cấp"), tai-lieu-tham-khao.'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Chưa chuyển; đã kiểm ở ../opus-zero/docs/: các trang tồn tại với tiêu đề đúng (metronome "Máy đếm nhịp"; thu-am "Thu âm buổi tập"; nhat-ky "Nhật ký luyện tập"; thi-tau-hai-tay "Thị tấu hai tay"; thay-va-thi "Học với thầy và thi cấp"; tai-lieu-tham-khao "Tài liệu tham khảo"; violin "Violin", cello "Cello", sao "Sáo (flute)"). Điều cần giữ: các trang đích ở đúng đường dẫn ấy.'
  - id: n5
    cau: Công cụ Chơi theo giúp quen vào đúng sau bốn tiếng đếm.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/luyen-tap/choi-theo.md: "nghe 4 tiếng đếm rồi chơi (hoặc hát) theo nhịp". Điều cần giữ: công cụ đếm bốn tiếng trước khi vào.'
  - id: n6
    cau: "Trang nghe-nhac/mozart-concerto-21 nói về phần dàn nhạc: dàn nhạc mở đầu, piano vào sau, chỗ cadenza."
