    ket_qua: dung
    ghi_chu: 'Đệm một giai điệu: 3/4, L:1/4, Sol trưởng, 10 ô, đủ 3 phách. Giai điệu: z3 | z3 | B2 c | d2 B | c B A | B2 z | B c d | e d c | B A2 | G3 (ô 6 có chú thích "thở", ô 9 bắt đầu bằng Si). Piano tay phải nghỉ phách 1 rồi hai hợp âm ở phách 2, 3; tay trái một nốt trầm mỗi ô (G, D, G, B, D, G, G, C, D, G). Hòa âm I | V7 | I | I6 | V7 | I | I | IV | I6/4–V7 | I khớp giai điệu. Fermata cuối cả giọng và piano; "colla voce" ở ô 9. Khớp câu dưới khối nhạc.'
ghi_chu: 'Chơi cùng người khác (piano/choi-cung-nguoi-khac, lõi, D4-L3 phần C). Nguồn chính: IMSLP trang tác phẩm; Henle HN 1278; Faber Music (K. 448); Alfred, Peters (Diabelli); Concise Oxford Dictionary of Music qua Encyclopedia.com; Internet Archive và Crossref (sách); Warner Classics (Moore); Menuhin School (tuổi hai trẻ Godebski). Công cụ web: WebFetch ngày 28/10/2026; WebSearch hết hạn mức giữa chừng; PubMed, PDF Trinity, nhiều trang nhà xuất bản không tải được. SỬA TRANG (đã ghi doi_chu): bỏ "vài tháng, nhiều người" (e1); bỏ "tốt nhất" (e2); "một bậc" thành p so với mf (e3); Diabelli bỏ "hai tay cách nhau một quãng tám"; Universal Edition thành Peters EP 2442; Fantasia D. 940 "kết bằng" thành "phần cuối có", bỏ "một đỉnh cao"; Grade 5–6 của Sonatina thành chặng 4–5; tên sonata Beethoven, Brahms thu hẹp về Op. 24, Op. 38; độ trễ mạng "không chơi được" thành "rất khó"; đoạn nghệ sĩ piano hợp tác bỏ múa ba lê, chương trình nhạc viện, "thay dàn nhạc"; "nhiều nhất"; nhà in sách Moore (Methuen 1953; bỏ nhà in 1962); tên trang IMSLP trong mục Nguồn; bỏ bullet Wikipedia, thêm bullet COD. CHƯA CHẮC (ket_qua null): bìa trang trái/phải bốn tay; "số 1 nổi tiếng nhất" (D. 733); D. 940 chơi liền và fugue; Erlkönig (vó ngựa, recitative; chỉ Wikipedia); hohe/mittlere/tiefe Stimme; giữ giọng cho ca sĩ (quy-tac dính sức khỏe, chưa có nguồn: đề xuất bỏ); chương 4 Con cá hồi "im hẳn"; tam tấu Haydn; độ trễ mạng; nghệ sĩ piano hợp tác đổi tên; Gerald Moore (Bos, "bóng nhợt nhạt", An die Musik một mình, "người góp phần lớn thay đổi cách nhìn"; chỉ Wikipedia hoặc COD gián tiếp). Không dùng làm câu có nguồn: cột Chặng bảng bốn tay, nhận xét độ khó (K. 521, secondo Dvořák, Pavane), xếp khuyen-tap. Câu ve-site trỏ trang chưa chuyển: luyen-tap/choi-theo, metronome, thu-am, nhat-ky, thi-tau-hai-tay; nghe-nhac/mozart-concerto-21, schubert-erlkonig, schubert-ca-hoi; nhac-cu/violin, cello, sao; piano/thay-va-thi; tai-lieu-tham-khao: đã kiểm ở ../opus-zero/docs/, điều cần giữ ghi ở từng nhận định. Lô trước yêu cầu giữ: quang-tam-buoc-nhay và lo-trinh trỏ tới trang này (chặng 4 đọc nhạc bốn tay, chặng 5 song tấu và đệm; nhịp và lắng nghe): KHỚP; the-loai ("Diabelli Op. 149 ngay từ chặng 1"): KHỚP (bảng ghi chặng 1–3); du-lieu/nha-soan-nhac/moore ("Gerald Moore (1899–1987), nghệ sĩ piano người Anh"): KHỚP. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml có thể chưa có (cho D3-L5; lượt 1 không lập hồ sơ thuật ngữ): primo, secondo, piano four hands, piano duo, colla voce, a tempo, Lied, mélodie, répétiteur, collaborative pianist, accompanist, piano trio, piano quartet, piano quintet, tutti, piano reduction, continuo/figured bass. Ghi chú cho người giao: (1) ô đầu bảng Primo/Secondo đã đổi "Phần" theo lời giao, không ghi doi_chu; (2) mục Nguồn cuối trang có "Xem thêm tài liệu tham khảo" trỏ trang chưa chuyển; (3) lượt 2 nên tìm nguồn cho các câu null, nhất là Moore, D. 940, Erlkönig. REVIEW D4-gom (nhóm D, 28/10/2026): quyết 14 câu null; sửa trang ở n15 (the-loai chỉ có danh sách nghe thử), n46, n52, n57, n83, n98, n104, n113; bỏ n21 (bố cục ấn bản bốn tay) và n65 (hàng "Giữ giọng cho ca sĩ"). Câu cau-truc về ba khuông soạn riêng (n30, n32–n35, n66, n67): lượt 2 không xem được khuông, review đối chiếu từng nốt với mã abc trên trang: đúng. Câu ve-site: đã kiểm trên src/content/docs, dist/ và ../opus-zero/docs/. Mục Nguồn cuối "Xem thêm tài liệu tham khảo": ../opus-zero/docs/tai-lieu-tham-khao.md có (n4).'
