    ket_qua: dung
    ghi_chu: 'IMSLP: 30/7/1899 – 13/3/1987, "English collaborative pianist"; kiem-dinh/du-lieu/nha-soan-nhac/moore.yml (đã khóa) cùng năm sinh–mất.'
  - id: n98
    cau: 'Moore nhắc lại, với ý không đồng tình, lời "khen" của một ca sĩ dành cho người đệm Coenraad V. Bos: "Hôm nay chắc anh chơi hay lắm, vì tôi chẳng để ý thấy anh."'
    loai: lich-su
    nguon:
