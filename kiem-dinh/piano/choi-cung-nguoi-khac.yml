    cau: 'Moore dẫn lại, với ý không đồng tình, lời "khen" mà giọng tenor Raimund von zur Mühlen viết cho người đệm Coenraad V. Bos: "Tối qua chắc anh chơi hay lắm, vì suốt buổi tôi chẳng để ý thấy tiếng đàn của anh."'
    loai: lich-su
    nguon:
      - wholenote-moore
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: chỉ Wikipedia (bậc 3): "You must have played well today, for I did not notice you"; Moore gọi Bos là "the doyen of accompanists". Nguồn gốc là sách của Moore (không đọc được). Review D4-gom: The WholeNote (review đã mở): von zur Mühlen viết cho Bos "Last night you must have played well, because I was not conscious of your playing throughout the recital"; Moore trích trong Am I Too Loud? và "expressed his dissent". Câu cũ "Hôm nay … chẳng để ý thấy anh" sửa theo nguồn, thêm tên người viết.'
    luot_2: dung
    luot_2_nguon: [ "https://www.thewholenote.com/index.php/newsroom/beatcolumns-sp-2121861476/art-song/22266-the-unashamed-accompanist" ]
