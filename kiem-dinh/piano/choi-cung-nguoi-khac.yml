    cau: "Bảng tập chung: ghi số ô nhịp cùng một ấn bản; chọn trước điểm hẹn; nhìn nhau ở nốt đầu, sau dấu ngân, chỗ đổi tốc độ, hợp âm cuối (nhiều nhạc công vẽ một cặp kính nhỏ lên bản nhạc ở những chỗ ấy); thu mỗi lượt chạy bài và cùng nghe; máy đếm nhịp cho lúc tập riêng, chơi chung thì tắt; nhờ bạn thu bè của họ để tập theo ở nhà; thị tấu theo thứ tự nhịp, bè trầm hoặc giai điệu, hòa âm."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập. Thứ tự nhịp, bè trầm, hòa âm không trái piano/thi-tau ("Nhịp trước, nốt sau"; "Đọc bè trầm trước").
  - id: n89
    cau: Công cụ Chơi theo, Thị tấu hai tay, Thu âm buổi tập, Nhật ký luyện tập như công cụ luyện tập của site.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: Xem câu ve-site về các liên kết trang chưa chuyển ở trên.
  - id: n90
    cau: "Một buổi tập 60 phút: 5 phút chuẩn bị và đưa nốt La; 10 phút chạy bài có thu âm; 10 phút nghe lại, mỗi người chọn một chỗ; 25 phút tập những chỗ ấy; 10 phút chạy bài lần hai, ghi mục tiêu vào nhật ký luyện tập."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập; 5 + 10 + 10 + 25 + 10 = 60.
  - id: n91
    cau: "Buổi tập đầu tiên: danh sách sáu việc (cùng ấn bản đã ghi số ô; đã nghe bản thu và tập bè mình; thống nhất tốc độ và dấu lặp; phân công đếm vào, bàn đạp, lật trang; đánh dấu chỗ thở khi có ca sĩ hay nhạc cụ hơi; mang bút chì, tẩy, máy đếm nhịp, điện thoại để thu)."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
  - id: n92
    cau: "Tìm bạn chơi: nhờ thầy chơi bè kia trong giờ học; một người lớn cùng trình độ là bạn bốn tay lý tưởng, đổi bè sau mỗi bài; sinh viên violin, cello, thanh nhạc luôn cần người đệm; hợp xướng, nhóm thính phòng nghiệp dư thường thiếu người đệm đàn; diễn đàn trực tuyến thường có chủ đề tìm bạn theo thành phố."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên đi tìm bạn; "luôn cần" hơi tuyệt đối nhưng giữ.
  - id: n93
    cau: Link Học với thầy và thi cấp.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/piano/thay-va-thi.md ("# Học với thầy và thi cấp"). Điều cần giữ: trang ở đúng đường dẫn.'
  - id: n94
    cau: "Độ trễ thường làm việc chơi cùng lúc qua mạng rất khó, nhưng có thể song tấu từ xa: một người thu bè mình theo máy đếm nhịp, người kia đeo tai nghe chơi theo, rồi ghép hai bản thu."
    loai: quy-tac
    nguon: []
    ket_qua: null
    ghi_chu: 'chưa chắc: chữ cũ "không chơi cùng lúc được qua mạng" quá tuyệt đối (có hệ thống độ trễ thấp); đổi thành "thường rất khó". Chưa mở được bài tổng quan nào đo ngưỡng trễ (Rottondi và cộng sự, IEEE Access 2016, DOI 10.1109/access.2016.2628440: IEEE chặn đọc). Phần quy trình thu bè từ xa là lời khuyên.'
  - id: n95
    cau: Ngày nay người ta hay nói nghệ sĩ piano hợp tác (collaborative pianist) thay cho "người đệm đàn" (accompanist), để nhấn mạnh vai bạn diễn ngang hàng.
    loai: lich-su
    nguon:
      - cod-accomp
    ket_qua: null
    ghi_chu: "chưa chắc: COD (accompaniment) nói đệm ban đầu không hàm ý lệ thuộc và nghệ thuật đệm phát triển cao ở thế kỷ 20; chưa có nguồn bậc 1–2 nói thẳng việc đổi tên."
  - id: n96
    cau: Nghề này gồm đệm cho ca sĩ và nhạc công, làm répétiteur ở nhà hát opera (người tập vở cùng ca sĩ) và chơi nhạc thính phòng.
    loai: dinh-nghia
    nguon:
      - cod-repetiteur
      - cod-accomp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghề này gồm đệm cho ca sĩ, nhạc công trong hòa nhạc, kỳ thi, lớp học; làm répétiteur ở nhà hát opera (đệm cho ca sĩ tập, thay dàn nhạc); đệm lớp múa ba lê; và nhạc thính phòng. Nhiều nhạc viện có chương trình đào tạo riêng." Đã bỏ "đệm lớp múa ba lê", "nhiều nhạc viện có chương trình đào tạo riêng", "thay dàn nhạc" (không có nguồn đã mở); COD: répétiteur "coaching singers on their parts" trong ban nhạc nhà hát opera.'
  - id: n97
    cau: Gerald Moore (1899–1987), nghệ sĩ piano người Anh.
    loai: nam
    nguon:
