  - cu: "Tam tấu piano gồm piano, violin, cello; tứ tấu piano thêm viola; ngũ tấu piano thường là piano với bốn đàn dây. Con cá hồi của Schubert là ngoại lệ, có contrabass thay violin thứ hai: nghe chương 4, để ý khi nào piano dẫn, khi nào nó im hẳn. Trong bè piano, các bè đàn dây thường in nhỏ phía trên, nên bạn là người duy nhất thấy cả tổng phổ (Đọc tổng phổ) và hay được trông vào để gọi chỗ bắt đầu lại. Bắt đầu với tam tấu của Haydn, nơi piano nổi bật và cello phần lớn đi cùng bè trầm của piano."
    moi: "Tam tấu piano gồm piano, violin, cello; tứ tấu piano thêm viola; ngũ tấu piano thường là piano với bốn đàn dây. Con cá hồi của Schubert là ngoại lệ, có contrabass thay violin thứ hai: nghe chương 4 (chủ đề và biến tấu), để ý khi nào piano dẫn, khi nào nó lùi lại. Trong bè piano, các bè đàn dây thường in nhỏ phía trên, nên bạn là người duy nhất thấy cả tổng phổ (Đọc tổng phổ) và hay được trông vào để gọi chỗ bắt đầu lại. Bắt đầu với tam tấu của Haydn, nơi piano nổi bật và cello phần lớn đi cùng bè trầm của piano."
