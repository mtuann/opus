khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - so-ngon
    ket_qua: dung
    ghi_chu: 'Song tấu đầu tiên: 4/4, L:1/4, Đô trưởng, 9 ô, mỗi ô đủ 4 phách ở cả hai bè (ô 1 primo nghỉ z4). Primo toàn trong Đô5–Sol5, ngón 3 ở Mi5 đầu (!3!) đúng thế tay Đô–Sol. Secondo: nốt trầm Đô3/Sol2 với hợp âm [E,G,C] (Đô), [F,G,B,] (Sol7), [D,G,B,] (Sol); ô cuối [C,,C,E,G,]. Hòa âm I–I–V7–I–V–I–V7–I–I khớp giai điệu. Primo !mf!, secondo !p!: khớp câu "Secondo chơi nhẹ hơn primo (p so với mf)" sau khi sửa. Đối chiếu bằng tay; chạy node tools/khuong-nhac.mjs ở cuối.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: "Gặp nhau ở Đô giữa: 4/4, L:1/4, Đô trưởng, 4 ô, đủ 4 phách. Primo: [Ee]2 [Dd]2 | [Cc] [Dd] [Ee] [Gg] | [Ff]2 [Dd]2 | [Cc]4 (hai tay cách một quãng tám). Secondo: C, [CE] G,, [B,D] | C, [CE] C, [CE] | G,, [B,DF] G,, [B,DF] | [C,,C,]4. Điểm va chạm: ô 1 phách 2 Mi4 và phách 4 Rê4; ô 3 phách 2 Fa4 và phách 4 Rê4; ô 2 phách 2 Rê4 giữa Đô4 và Mi4: đúng như câu dưới khối nhạc."
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: 'Đệm một giai điệu: 3/4, L:1/4, Sol trưởng, 10 ô, đủ 3 phách. Giai điệu: z3 | z3 | B2 c | d2 B | c B A | B2 z | B c d | e d c | B A2 | G3 (ô 6 có chú thích "thở", ô 9 bắt đầu bằng Si). Piano tay phải nghỉ phách 1 rồi hai hợp âm ở phách 2, 3; tay trái một nốt trầm mỗi ô (G, D, G, B, D, G, G, C, D, G). Hòa âm I | V7 | I | I6 | V7 | I | I | IV | I6/4–V7 | I khớp giai điệu. Fermata cuối cả giọng và piano; "colla voce" ở ô 9. Khớp câu dưới khối nhạc.'
ghi_chu: 'Chơi cùng người khác (piano/choi-cung-nguoi-khac, lõi, D4-L3 phần C). Nguồn chính: IMSLP trang tác phẩm; Henle HN 1278; Faber Music (K. 448); Alfred, Peters (Diabelli); Concise Oxford Dictionary of Music qua Encyclopedia.com; Internet Archive và Crossref (sách); Warner Classics (Moore); Menuhin School (tuổi hai trẻ Godebski). Công cụ web: WebFetch ngày 28/10/2026; WebSearch hết hạn mức giữa chừng; PubMed, PDF Trinity, nhiều trang nhà xuất bản không tải được. SỬA TRANG (đã ghi doi_chu): bỏ "vài tháng, nhiều người" (e1); bỏ "tốt nhất" (e2); "một bậc" thành p so với mf (e3); Diabelli bỏ "hai tay cách nhau một quãng tám"; Universal Edition thành Peters EP 2442; Fantasia D. 940 "kết bằng" thành "phần cuối có", bỏ "một đỉnh cao"; Grade 5–6 của Sonatina thành chặng 4–5; tên sonata Beethoven, Brahms thu hẹp về Op. 24, Op. 38; độ trễ mạng "không chơi được" thành "rất khó"; đoạn nghệ sĩ piano hợp tác bỏ múa ba lê, chương trình nhạc viện, "thay dàn nhạc"; "nhiều nhất"; nhà in sách Moore (Methuen 1953; bỏ nhà in 1962); tên trang IMSLP trong mục Nguồn; bỏ bullet Wikipedia, thêm bullet COD. CHƯA CHẮC (ket_qua null): bìa trang trái/phải bốn tay; "số 1 nổi tiếng nhất" (D. 733); D. 940 chơi liền và fugue; Erlkönig (vó ngựa, recitative; chỉ Wikipedia); hohe/mittlere/tiefe Stimme; giữ giọng cho ca sĩ (quy-tac dính sức khỏe, chưa có nguồn: đề xuất bỏ); chương 4 Con cá hồi "im hẳn"; tam tấu Haydn; độ trễ mạng; nghệ sĩ piano hợp tác đổi tên; Gerald Moore (Bos, "bóng nhợt nhạt", An die Musik một mình, "người góp phần lớn thay đổi cách nhìn"; chỉ Wikipedia hoặc COD gián tiếp). Không dùng làm câu có nguồn: cột Chặng bảng bốn tay, nhận xét độ khó (K. 521, secondo Dvořák, Pavane), xếp khuyen-tap. Câu ve-site trỏ trang chưa chuyển: luyen-tap/choi-theo, metronome, thu-am, nhat-ky, thi-tau-hai-tay; nghe-nhac/mozart-concerto-21, schubert-erlkonig, schubert-ca-hoi; nhac-cu/violin, cello, sao; piano/thay-va-thi; tai-lieu-tham-khao: đã kiểm ở ../opus-zero/docs/, điều cần giữ ghi ở từng nhận định. Lô trước yêu cầu giữ: quang-tam-buoc-nhay và lo-trinh trỏ tới trang này (chặng 4 đọc nhạc bốn tay, chặng 5 song tấu và đệm; nhịp và lắng nghe): KHỚP; the-loai ("Diabelli Op. 149 ngay từ chặng 1"): KHỚP (bảng ghi chặng 1–3); du-lieu/nha-soan-nhac/moore ("Gerald Moore (1899–1987), nghệ sĩ piano người Anh"): KHỚP. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml có thể chưa có (cho D3-L5; lượt 1 không lập hồ sơ thuật ngữ): primo, secondo, piano four hands, piano duo, colla voce, a tempo, Lied, mélodie, répétiteur, collaborative pianist, accompanist, piano trio, piano quartet, piano quintet, tutti, piano reduction, continuo/figured bass. Ghi chú cho người giao: (1) ô đầu bảng Primo/Secondo đã đổi "Phần" theo lời giao, không ghi doi_chu; (2) mục Nguồn cuối trang có "Xem thêm tài liệu tham khảo" trỏ trang chưa chuyển; (3) lượt 2 nên tìm nguồn cho các câu null, nhất là Moore, D. 940, Erlkönig.'
doi_chu:
  - cu: Sau vài tháng chơi bốn tay, nhiều người thấy bài độc tấu của mình cũng vững nhịp hơn.
    moi: Chơi bốn tay đều đặn, bài độc tấu của bạn cũng có thể vững nhịp hơn.
    ly_do: 'n10 (khong-can-nguon): "vài tháng", "nhiều người" là con số và mức độ không kiểm được.'
  - moi: Phần
    ly_do: 'n52 (chưa chắc): finale dựng fugue rồi nhắc lại chủ đề đầu (Wikipedia, bậc 3), nên "kết bằng" không đúng; bỏ "một đỉnh cao" (so sánh không kiểm được). Vẫn chưa chắc ở "chơi liền", "fugue".; n76 (khong-can-nguon): không có nguồn cho Grade của phần piano; đổi sang ước lượng chặng của site.'
  - cu: "Nhiều ấn bản in secondo ở trang trái, primo ở trang phải, cùng một đoạn nhạc. Hãy đọc lướt cả bè người kia để biết khi nào mình phải nhường. Và đừng chỉ giành primo: cả bài đứng trên bè trầm, nên secondo là chỗ học hòa âm và giữ nhịp tốt nhất."
    moi: "Nhiều ấn bản in secondo ở trang trái, primo ở trang phải, cùng một đoạn nhạc. Hãy đọc lướt cả bè người kia để biết khi nào mình phải nhường. Và đừng chỉ giành primo: cả bài đứng trên bè trầm, nên secondo là chỗ rất tốt để học hòa âm và giữ nhịp."
    ly_do: "n22 (khong-can-nguon): so sánh nhất không kiểm được."
  - cu: "Mỗi người tập bè mình với máy đếm nhịp, rồi chơi cùng nhau (secondo đếm thầm một ô trước khi vào), rồi đổi bè. Secondo nhỏ hơn primo một bậc sắc thái: nốt trầm rõ, hợp âm nhẹ."
    moi: "Mỗi người tập bè mình với máy đếm nhịp, rồi chơi cùng nhau (secondo đếm thầm một ô trước khi vào), rồi đổi bè. Secondo chơi nhẹ hơn primo (p so với mf): nốt trầm rõ, hợp âm nhẹ."
    ly_do: "n32 (da-sua): khối abc 1 ghi primo mf, secondo p: hai bậc, không phải một."
  - cu: 28 bài ngắn, khó dần. Bè học trò (primo) nằm trong năm nốt, hai tay thường cách nhau một quãng tám; secondo dành cho thầy. Từ chặng 3, thử chơi secondo
    moi: 28 bài ngắn, khó dần. Bè học trò (primo) giữ mỗi tay trong một thế tay năm ngón; secondo dành cho thầy. Từ chặng 3, thử chơi secondo
    ly_do: 'n40 (da-sua): Alfred chỉ nói hai tay của primo ở thế năm ngón; "cách nhau một quãng tám" không kiểm được.'
  - cu: Bốn phần chơi liền, kết bằng một fugue; một đỉnh cao của nhạc bốn tay (Schubert)
    moi: Bốn phần chơi liền, phần cuối có một fugue (Schubert)
    ly_do: "n52: bỏ \"kết bằng fugue\" và \"một đỉnh cao\" (chỉ có nguồn cho việc phần cuối có fugue)."
  - cu: "Trong sonata cho violin, cello hay sáo, piano là bạn diễn ngang hàng: Beethoven và Brahms đều đặt tên các sonata ấy là sonata cho piano và violin (hay cello), piano đứng trước. Xem thêm violin, cello, sáo."
    moi: "Trong sonata cho violin, cello hay sáo, piano là bạn diễn ngang hàng: tên nhiều sonata ấy ghi piano trước, như Op. 24 của Beethoven và Op. 38 của Brahms: Sonate für Pianoforte und Violine (hay Violoncello), tức sonata cho piano và violin (hay cello). Xem thêm violin, cello, sáo."
    ly_do: "n68 (da-sua): IMSLP chỉ xác nhận hai sonata ấy."
  - cu: "Bài để bắt đầu (phần piano khoảng Grade 5–6): ba Sonatina cho violin D. 384, 385, 408 của Schubert; Sicilienne Op. 78 cho cello của Fauré; sonata cho sáo của Handel, phần piano viết ra từ bè trầm số. Khi vững hơn: Mozart, Sonata Mi thứ K. 304 và Beethoven, Sonata Fa trưởng Op. 24 cho violin; Brahms, Sonata Mi thứ Op. 38 cho cello; Fauré, Fantaisie Op. 79 cho sáo."
    moi: "Bài để bắt đầu (phần piano khoảng chặng 4–5): ba Sonatina cho violin D. 384, 385, 408 của Schubert; Sicilienne Op. 78 cho cello của Fauré; sonata cho sáo của Handel, phần piano viết ra từ bè trầm số. Khi vững hơn: Mozart, Sonata Mi thứ K. 304 và Beethoven, Sonata Fa trưởng Op. 24 cho violin; Brahms, Sonata Mi thứ Op. 38 cho cello; Fauré, Fantaisie Op. 79 cho sáo."
    ly_do: "n76: \"Grade 5–6\" đổi thành chặng 4–5 theo hệ chặng của site; không có nguồn cho mức Grade."
  - cu: "Trực tuyến: diễn đàn và nhóm của người lớn chơi nhạc cổ điển thường có chủ đề tìm bạn chơi theo thành phố. Độ trễ khiến không chơi cùng lúc được qua mạng, nhưng có thể song tấu từ xa: một người thu bè mình theo máy đếm nhịp, người kia đeo tai nghe chơi theo, rồi ghép hai bản thu."
    moi: "Trực tuyến: diễn đàn và nhóm của người lớn chơi nhạc cổ điển thường có chủ đề tìm bạn chơi theo thành phố. Độ trễ thường làm việc chơi cùng lúc qua mạng rất khó, nhưng có thể song tấu từ xa: một người thu bè mình theo máy đếm nhịp, người kia đeo tai nghe chơi theo, rồi ghép hai bản thu."
    ly_do: 'n94 (chưa chắc): "không được" quá tuyệt đối; vẫn cần nguồn.'
  - cu:
      - Ngày nay người ta hay nói nghệ sĩ piano hợp tác (collaborative pianist) thay cho "người đệm đàn" (accompanist), để nhấn mạnh vai bạn diễn ngang hàng. Nghề này gồm đệm cho ca sĩ, nhạc công trong hòa nhạc, kỳ thi, lớp học; làm répétiteur ở nhà hát opera (đệm cho ca sĩ tập, thay dàn nhạc); đệm lớp múa ba lê; và nhạc thính phòng. Nhiều nhạc viện có chương trình đào tạo riêng.
      - 'Người góp phần lớn thay đổi cách nhìn ấy là Gerald Moore (1899–1987), nghệ sĩ piano người Anh. Ông nhắc lại, với ý không đồng tình, lời "khen" của một ca sĩ dành cho người đệm đàn Coenraad V. Bos: "Hôm nay chắc anh chơi hay lắm, vì tôi chẳng để ý thấy anh." Moore chơi cùng Dietrich Fischer-Dieskau (bản thu Erlkönig gợi ý trong hướng dẫn nghe), Elisabeth Schwarzkopf, Victoria de los Ángeles; Fischer-Dieskau viết rằng với Moore, bên phím đàn không còn "cái bóng nhợt nhạt" nữa. Buổi hòa nhạc chia tay của ông năm 1967 ở Royal Festival Hall (London) có cả ba ca sĩ ấy, và khép lại khi Moore chơi một mình bản chuyển soạn cho piano của An die Musik (Gửi âm nhạc) của Schubert. Câu người đệm nên tự hỏi nhiều nhất chính là tên hồi ký của ông: Am I Too Loud? (Tôi có to quá không?, 1962).'
    moi:
      - Ngày nay người ta hay nói nghệ sĩ piano hợp tác (collaborative pianist) thay cho "người đệm đàn" (accompanist), để nhấn mạnh vai bạn diễn ngang hàng. Nghề này gồm đệm cho ca sĩ và nhạc công, làm répétiteur ở nhà hát opera (người tập vở cùng ca sĩ) và chơi nhạc thính phòng.
      - 'Người góp phần lớn thay đổi cách nhìn ấy là Gerald Moore (1899–1987), nghệ sĩ piano người Anh. Ông nhắc lại, với ý không đồng tình, lời "khen" của một ca sĩ dành cho người đệm đàn Coenraad V. Bos: "Hôm nay chắc anh chơi hay lắm, vì tôi chẳng để ý thấy anh." Moore chơi cùng Dietrich Fischer-Dieskau (bản thu Erlkönig gợi ý trong hướng dẫn nghe), Elisabeth Schwarzkopf, Victoria de los Ángeles; Fischer-Dieskau viết rằng với Moore, bên phím đàn không còn "cái bóng nhợt nhạt" nữa. Buổi hòa nhạc chia tay của ông năm 1967 ở Royal Festival Hall (London) có cả ba ca sĩ ấy, và khép lại khi Moore chơi một mình bản chuyển soạn cho piano của An die Musik (Gửi âm nhạc) của Schubert. Tên hồi ký của ông cũng là câu người đệm nên tự hỏi: Am I Too Loud? (Tôi có to quá không?, 1962).'
    ly_do: 'n96 (da-sua): bỏ phần không có nguồn (múa ba lê, chương trình nhạc viện, "thay dàn nhạc"); répétiteur theo COD.; n103 (khong-can-nguon): "nhiều nhất" không kiểm được.'
  - cu: "Gerald Moore, The Unashamed Accompanist (London: Ascherberg, Hopwood & Crew, 1943); Singer and Accompanist: The Performance of Fifty Songs (London: Macmillan, 1953); Am I Too Loud? Memoirs of an Accompanist (London: Macmillan, 1962); The Schubert Song Cycles: With Thoughts on Performance (London: Hamish Hamilton, 1975)."
    moi: "Gerald Moore, The Unashamed Accompanist (London: Ascherberg, Hopwood & Crew, 1943); Singer and Accompanist: The Performance of Fifty Songs (London: Methuen, 1953); Am I Too Loud? Memoirs of an Accompanist (1962); The Schubert Song Cycles: With Thoughts on Performance (London: Hamish Hamilton, 1975)."
