  - cu: Sau vài tháng chơi bốn tay, nhiều người thấy bài độc tấu của mình cũng vững nhịp hơn.
    moi: Chơi bốn tay đều đặn, bài độc tấu của bạn cũng có thể vững nhịp hơn.
    ly_do: 'n10 (khong-can-nguon): "vài tháng", "nhiều người" là con số và mức độ không kiểm được.'
  - cu: Piano bốn tay là hai người chung một đàn; lịch sử và danh sách nghe thử có ở Các thể loại nhạc piano.
    moi: Piano bốn tay là hai người chung một đàn; danh sách nghe thử có ở Các thể loại nhạc piano.
    ly_do: 'n15 (da-sua, review D4-gom): the-loai chỉ có danh sách nghe thử (mục "Piano chơi cùng người khác", dòng bảng "Bốn tay, hai đàn"), không có đoạn lịch sử bốn tay.'
  - moi: Phần
    ly_do: 'n52 (chưa chắc): finale dựng fugue rồi nhắc lại chủ đề đầu (Wikipedia, bậc 3), nên "kết bằng" không đúng; bỏ "một đỉnh cao" (so sánh không kiểm được). Vẫn chưa chắc ở "chơi liền", "fugue".; n76 (khong-can-nguon): không có nguồn cho Grade của phần piano; đổi sang ước lượng chặng của site.; n52: bỏ "kết bằng fugue" và "một đỉnh cao" (chỉ có nguồn cho việc phần cuối có fugue).; n76: "Grade 5–6" đổi thành chặng 4–5 theo hệ chặng của site; không có nguồn cho mức Grade.; n96 (da-sua): bỏ phần không có nguồn (múa ba lê, chương trình nhạc viện, "thay dàn nhạc"); répétiteur theo COD.; n103 (khong-can-nguon): "nhiều nhất" không kiểm được.; n52 (da-sua, review D4-gom): bỏ "chơi liền" và "phần cuối có một fugue" (IMSLP không nói; chỉ có Wikipedia, classicalconnect); ghi bốn phần theo IMSLP.; n104, n98 (da-sua, review D4-gom): "Người góp phần lớn" thành "Một trong những người góp phần lớn" (nguồn chỉ nói Moore nâng vai người đệm); lời khen theo The WholeNote: mảnh giấy tenor Raimund von zur Mühlen viết cho Bos, "Last night you must have played well, because I was not conscious of your playing throughout the recital", Moore dẫn trong Am I Too Loud? và không đồng tình.'
  - cu: "Nhiều ấn bản in secondo ở trang trái, primo ở trang phải, cùng một đoạn nhạc. Hãy đọc lướt cả bè người kia để biết khi nào mình phải nhường. Và đừng chỉ giành primo: cả bài đứng trên bè trầm, nên secondo là chỗ học hòa âm và giữ nhịp tốt nhất."
