  - cu: "Trong ca khúc nghệ thuật (Lied tiếng Đức, mélodie tiếng Pháp), piano cùng kể chuyện với giọng hát: trong Erlkönig của Schubert, piano là tiếng vó ngựa phi suốt bài, rồi im bặt trước câu cuối. Phần dạo đầu đặt tốc độ và không khí; phần kết thường nói nốt điều lời ca để ngỏ."
    moi: "Trong ca khúc nghệ thuật (Lied tiếng Đức, mélodie tiếng Pháp), piano cùng kể chuyện với giọng hát: trong Erlkönig của Schubert, piano là tiếng vó ngựa phi suốt bài, đến câu cuối mới dừng để giọng hát kể như nói (recitative). Phần dạo đầu đặt tốc độ và không khí; phần kết thường nói nốt điều lời ca để ngỏ."
