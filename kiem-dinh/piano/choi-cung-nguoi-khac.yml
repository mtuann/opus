nhan_dinh:
  - id: n1
    cau: Trang dành cho bạn từ khoảng chặng 3 của lộ trình trở lên.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Đã kiểm ở src/content/docs/piano/lo-trinh.md: chặng 3 "Sơ trung cấp (≈ Grade 3)"; chặng 4 hàng "Đọc nhạc" ghi "Bắt đầu đọc nhạc bốn tay cùng người khác", chặng 5 hàng "Biểu diễn" ghi "Thử song tấu bốn tay hoặc đệm cho một người bạn". "Từ khoảng chặng 3" không trái điều đó. Review D4-gom: đã kiểm src/content/docs/piano/lo-trinh.md: "Chặng 3. Sơ trung cấp"; chặng 4 hàng Đọc nhạc "Bắt đầu đọc nhạc bốn tay cùng người khác" (dòng 108); chặng 5 hàng Biểu diễn "Thử song tấu bốn tay hoặc đệm cho một người bạn" (dòng 136).'
    review: dung
  - id: n2
    cau: Trang nói về bốn tay và hai đàn, đệm hát, song tấu với nhạc cụ khác, nhạc thính phòng, cách tập chung và nơi tìm bạn chơi.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Các mục ## trên trang: Piano bốn tay, Hai đàn piano, Đệm hát, Song tấu với một nhạc cụ, Nhạc thính phòng, Tập chung cho hiệu quả, Tìm bạn chơi; đủ bảy ý. Review D4-gom: đã kiểm các mục ## trên trang: đủ bảy ý."
    review: dung
  - id: n3
    cau: "Liên kết sang trang đã chuyển: lộ trình, bàn đạp vang, tư thế, hợp âm rải và hình đệm, thể loại, thị tấu, nhà soạn nhạc (Schubert), học thuộc và biểu diễn, khóa Đô và dịch giọng, đọc tổng phổ, bè trầm số."
    loai: ve-site
    nguon: []
    ket_qua: dung
