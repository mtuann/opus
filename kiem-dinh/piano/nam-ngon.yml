  - id: n28
    cau: Rê♭ thứ cần tám dấu giáng nên không có hóa biểu, còn La♭ thứ cần bảy; Đô♯ thứ có bốn dấu thăng và Sol♯ thứ có năm; cùng phím đàn, ít dấu hóa hơn.
    loai: cau-truc
    nguon:
      - mt21c-minor-keysig
      - mount-keysig
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Rê♭ thứ và La♭ thứ hầu như luôn được viết thành Đô♯ thứ và Sol♯ thứ". MT21C: hóa biểu thứ = hóa biểu trưởng song song thêm ba dấu giáng (hay bớt ba dấu thăng): Rê♭ thứ 5+3 = 8 giáng; La♭ thứ 4+3 = 7 giáng; Đô♯ thứ 7−3 = 4 thăng; Sol♯ thứ 8−3 = 5 thăng. Mount ch. 9 dừng ở bảy dấu, nên "không có hóa biểu" cho tám giáng là hệ quả đúng. "Hầu như luôn" không có nguồn: nay trang viết "có thể viết hai giọng này thành Đô♯ thứ và Sol♯ thứ" (cùng phím đàn).'
    luot_2: dung
    luot_2_nguon: [ "https://m.basicmusictheory.com/minor-scales" ]
    luot_2_ghi_chu: "basicmusictheory: Rê♭ thứ là khóa lý thuyết (6 giáng và 1 giáng kép, tức tám dấu giáng nếu đếm giáng kép là hai); La♭ thứ 7 giáng; Đô♯ thứ 4 thăng; Sol♯ thứ 5 thăng; có tương đương đồng âm ít dấu hóa hơn."
