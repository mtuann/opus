    ghi_chu: "KHỚP: nhac-ly/08-hoa-bieu (bảng 12 giọng), 09-quang (ngón 1 và 5 cách quãng 5), 03-truong-do, 04-nhip, bat-dau/lo-trinh-choi, luyen-tai/choi-bang-tai, piano/10-bai-dau-tien, hai-tuan-dau, ban-do-ban-phim, tu-the, index, lo-trinh. Neo #6-chuyen-giong-cung-bai-o-the-sol-va-the-fa có trong dist. Review: đã kiểm trên trang: bảng thế tay (Đô, Đô giữa, Sol, Fa), mục \"## Năm ngón trưởng và thứ ở mười hai giọng\" (bảng 12 giọng), \"## Bài tập hai tay\", neo 6-chuyen-giong… trong dist/, ngón 1 trên Đô (chủ âm) ở thế Đô, khối 2 và 3 có !1! trên bậc 1 và !3! trên bậc 3 (Mi), hộp Học tiếp trỏ gam."
