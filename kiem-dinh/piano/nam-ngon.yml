nhan_dinh:
  - id: n1
    cau: 'Những tuần đầu chơi piano có thể diễn ra trọn trong thế tay năm ngón: mỗi ngón đặt sẵn trên một phím, nên bạn không phải lo "ngón nào", và dồn được sự chú ý vào đọc nhạc, giữ nhịp, nghe tiếng đàn, và việc khó nhất: cho hai tay chơi cùng lúc.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ (cả description): "gần như diễn ra trọn trong". "Gần như" là mức độ không kiểm được; đổi thành "có thể". Khớp lộ trình: hai-tuan-dau và 10-bai-dau-tien đều ở thế năm ngón.'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập, hợp cách dạy phổ biến.
  - id: n2
    cau: "Thế tay năm ngón: năm ngón đặt trên năm phím liền nhau, ứng với năm bậc đầu của một gam."
    loai: dinh-nghia
    nguon:
      - omt-major
      - omt-minor
    ket_qua: dung
    ghi_chu: Năm bậc đầu của gam (OMT; W-W-H-W cho trưởng, W-H-W-W cho thứ). Tên "thế tay năm ngón" là thuật ngữ sư phạm piano (Baylor Piano Basics có chương Major và Minor Five-Finger Patterns) nhưng lượt này không mở được chương ấy; nội dung suy từ OMT. Cụm "five-finger position" chưa có trong src/data/thuat-ngu.yml.
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=82" ]
    luot_2_ghi_chu: "Baylor: mẫu năm ngón gồm năm nốt đầu của gam (do re mi fa sol)."
  - id: n3
    cau: Ngón nào chưa chơi vẫn nằm nhẹ trên phím của nó, sẵn sàng.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập.
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên chung (ngón chưa chơi nằm nhẹ trên phím), hợp cách dạy phổ biến.
  - id: n4
    cau: "Hai tay đánh số ngón giống nhau: ngón cái là 1, ngón út là 5."
    loai: quy-tac
    nguon:
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: "Baylor (Finger Numbers): thumb 1 … pinky 5, cả hai tay. Trang hai-tuan-dau cũng ghi như vậy."
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=59", "https://openbooks.library.baylor.edu/pianobasics/?p=108" ]
    luot_2_ghi_chu: "Baylor: ngón cái là 1, ngón 5 dùng cho nốt cao nhất tay phải / thấp nhất tay trái; hai tay bắt đầu cùng số ngón (hai ngón cái trên Đô giữa)."
  - id: n5
    cau: "Thế Đô: tay phải Ngón 1 trên Đô4 … ngón 5 trên Sol4; tay trái Ngón 5 trên Đô3 … ngón 1 trên Sol3."
    loai: cau-truc
    nguon:
      - omt-aspn
      - omt-keyboard
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: "C4–G4: Đô4 Rê4 Mi4 Fa4 Sol4; C3–G3: Đô3 Rê3 Mi3 Fa3 Sol3 (ASPN: Đô giữa là C4, Đô3 thấp hơn một quãng tám)"
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=59", "https://openbooks.library.baylor.edu/pianobasics/?p=82" ]
    luot_2_ghi_chu: Đô4 = Đô giữa. Tay phải Đô4–Sol4 (1–5); tay trái ngón 5 trên Đô3 (Đô–Rê–Mi–Fa–Sol với 5-4-3-2-1 lên Sol3). Suy ra từ tên nốt và Baylor.
  - id: n6
    cau: "Thế Đô giữa: tay phải Ngón 1 trên Đô4 … ngón 5 trên Sol4; tay trái Ngón 5 trên Fa3 … ngón 1 trên Đô4."
    loai: cau-truc
    nguon:
      - omt-aspn
      - omt-keyboard
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: "Tay trái Fa3 Sol3 La3 Si3 Đô4: ngón 5 trên Fa3, ngón 1 trên Đô4: hai ngón cái cùng phím Đô4 (Đô giữa)"
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=59" ]
    luot_2_ghi_chu: "Baylor: hai ngón cái cùng trên Đô giữa. Tay trái Fa3–Sol3–La3–Si3–Đô4 với 5-4-3-2-1: ngón 5 trên Fa3, ngón 1 trên Đô4, đúng."
  - id: n7
    cau: "Thế Sol: tay phải Ngón 1 trên Sol4 … ngón 5 trên Rê5; tay trái Ngón 5 trên Sol2 … ngón 1 trên Rê3."
    loai: cau-truc
    nguon:
      - omt-aspn
      - omt-keyboard
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: "Tay phải Sol4 La4 Si4 Đô5 Rê5; tay trái Sol2 La2 Si2 Đô3 Rê3: khớp hai-tuan-dau và 10-bai-dau-tien (tay trái ngón 5 trên Sol2, ngón 1 trên Rê3)"
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=82" ]
    luot_2_ghi_chu: "Sol–La–Si–Đô–Rê: tay phải Sol4–Rê5, tay trái Sol2–Rê3 (5-4-3-2-1); đúng theo tên nốt."
  - id: n8
    cau: "Thế Fa: tay phải Ngón 1 trên Fa4 … ngón 5 trên Đô5; phím đen Si♭ (ngón 4 tay phải, ngón 2 tay trái); tay trái Ngón 5 trên Fa2 … ngón 1 trên Đô3."
    loai: cau-truc
    nguon:
      - omt-aspn
      - omt-keyboard
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: "Tay phải Fa4 Sol4 La4 Si♭4 Đô5: Si♭ là ngón 4; tay trái Fa2 Sol2 La2 Si♭2 Đô3 (5-4-3-2-1): Si♭ ngón 2; Si♭ là phím đen duy nhất"
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=82" ]
    luot_2_ghi_chu: "Fa–Sol–La–Si♭–Đô: Si♭ là ngón 4 tay phải (1 Fa, 2 Sol, 3 La, 4 Si♭, 5 Đô) và ngón 2 tay trái (5 Fa, 4 Sol, 3 La, 2 Si♭, 1 Đô). Tay phải Fa4–Đô5, tay trái Fa2–Đô3 đúng."
  - id: n9
    cau: Thế Đô là thế đầu tiên của trang này.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Chữ cũ: "Thế đầu tiên của hầu hết giáo trình". "Hầu hết giáo trình" là số liệu không kiểm được; đổi thành "của trang này", khớp thứ tự trong bảng và trang hai-tuan-dau. Review D4-gom (soát nhãn): câu chỉ nói thứ tự trong trang, đổi khuyen-tap thành ve-site. Review: đã kiểm bảng thế tay (dòng 14) hàng đầu là Thế Đô, ghi chú "Thế đầu tiên của trang này"; các bài 1–5 đều ở thế Đô.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu chỉ nói về thứ tự trong trang (Thế Đô là thế đầu tiên của trang), không có gì âm nhạc để kiểm; cần kiểm trên trang.
    review: dung
  - id: n10
    cau: "Công cụ bàn phím Đô3–Sol4 ghi số ngón thế Đô của hai tay (tay phải ngón 1–5 trên Đô4–Sol4, tay trái ngón 5–1 trên Đô3–Sol3), tô mười phím ấy, và nút \"Nghe các nốt được tô\" phát mười nốt; câu dẫn: \"bấm nút nghe để nghe mười nốt\"."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Lần 1: ::cong-cu{ten=\"piano\" range=\"C3-G4\" notes=\"C3 D3 E3 F3 G3 C4 D4 E4 F4 G4\"}, review dung. mo/hinh-dot-1 (06/11/2026): đổi thành ::cong-cu{ten=\"piano\" range=\"C3-G4\" phai=\"C4:1 D4:2 E4:3 F4:4 G4:5\" trai=\"C3:5 D3:4 E3:3 F3:2 G3:1\"}; phím có số ngón là phím được tô (docThongSoBanPhim), nên vẫn đúng mười phím và nút nghe phát mười nốt. Số ngón khớp dòng Thế Đô của bảng (\"Ngón 1 trên Đô4 … ngón 5 trên Sol4\", \"Ngón 5 trên Đô3 … ngón 1 trên Sol3\"). Kiểm trên bản xem (npm run build:xem, 06/11/2026) và module dựng hình: veBanPhim (src/scripts/ve.js), docThongSoBanPhim (src/plugins/thanh-phan.mjs). Câu dẫn giữ nguyên. Cần review lại. Review hình đợt 1 (06/11/2026): SVG trong dist/piano/nam-ngon/index.html (bản xem): mười phím tô Đô3–Sol3, Đô4–Sol4; dấu tròn tay phải 1–5 trên Đô4–Sol4, dấu vuông tay trái 5–1 trên Đô3–Sol3, có dòng chú giải hai tay; không có play nên nút là \"Nghe các nốt được tô\" (thanh-phan.mjs), phát mười phím tô (ban-phim.js); câu dẫn giữ nguyên. Khớp dòng Thế Đô của bảng."
    review: dung
  - id: n11
    cau: "Tay trái là ảnh gương của tay phải: khi hai tay cùng đi lên (sang phải), tay phải đi 1 → 5 còn tay trái đi 5 → 1; khi hai tay đi ngược chiều từ hai ngón cái ra ngoài, hai tay dùng cùng số ngón cùng lúc."
    loai: cau-truc
    nguon:
      - baylor-ky-thuat
      - hkb
    ket_qua: dung
    ghi_chu: "Suy từ số ngón: ngón cái là 1 ở cả hai tay; đi lên (sang phải) tay phải đi 1 → 5, tay trái đi 5 → 1. Ngược chiều từ hai ngón cái: tay phải lên 1-2-3.., tay trái xuống 1-2-3..: cùng số ngón. Khớp khối abc 2."
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=59" ]
    luot_2_ghi_chu: "Baylor: ngón bấm tay trái là nghịch đảo của tay phải (123+12345 / 54321+321); hai ngón cái cùng trên Đô giữa, đi ngược chiều dùng cùng ngón mỗi tay."
  - id: n12
    cau: Vì vậy chuyển động ngược chiều thường là cách dễ nhất để bắt đầu chơi hai tay.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên tập; đồng bộ trang hai-tay (HKB: chuyển động đối xứng gương là dễ và ổn định nhất; n3 của kiem-dinh/piano/hai-tay.yml). "Thường" đã đủ nhẹ.'
  - id: n13
    cau: Năm nốt trưởng luôn theo mẫu cung – cung – nửa cung – cung.
    loai: dinh-nghia
    nguon:
      - omt-major
    ket_qua: dung
    ghi_chu: "OMT: gam trưởng W-W-H-W-W-W-H; bốn quãng đầu (bậc 1–5) là W-W-H-W. Đúng cho cả mười hai giọng."
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=82" ]
    luot_2_ghi_chu: "Baylor: nốt đầu + cung + cung + nửa cung + cung."
  - id: n14
    cau: Muốn đổi sang thứ, chỉ cần hạ bậc 3 xuống nửa cung, tức ngón 3 của cả hai tay dịch xuống một phím.
    loai: quy-tac
    nguon:
      - omt-minor
      - omt-major
    ket_qua: dung
    ghi_chu: "OMT: gam thứ tự nhiên W-H-W-W (năm nốt đầu) so với trưởng W-W-H-W: chỉ khác bậc 3; ngón 3 chơi bậc 3 trong thế năm ngón. Bậc 6 và 7 nằm ngoài năm nốt."
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=130" ]
    luot_2_ghi_chu: "Baylor: mẫu thứ là mẫu trưởng với nốt ba hạ nửa cung (cung + nửa + cung + cung)."
  - id: n15
    cau: "Bảng mười hai giọng, nhóm 1. trắng – trắng – trắng, giọng Đô: năm nốt (bậc 1–5) Đô Rê Mi Fa Sol; phím đen (ngón tay phải) –; thế thứ: bậc 3 thành Mi♭."
    loai: cau-truc
    nguon:
      - omt-major
      - omt-minor
      - omt-keyboard
    ket_qua: dung
    ghi_chu: Dựng bằng W-W-H-W (OMT) và kiểm màu phím (OMT, The Keyboard) cho bậc 1, 3, 5 và vị trí ngón; bậc 3 thứ = bậc 3 trưởng hạ nửa cung. Đã đếm từng ô của hàng này; đúng.
    luot_2: dung
    luot_2_nguon: [ "https://openbooks.library.baylor.edu/pianobasics/?p=82", "https://openbooks.library.baylor.edu/pianobasics/?p=130" ]
    luot_2_ghi_chu: "Bảng giọng Đô: suy ra từ mẫu cung–cung–nửa–cung (Baylor) và hạ bậc 3 cho thứ. Đô Rê Mi Fa Sol, không phím đen; thứ: Mi♭ đúng."
  - id: n16
    cau: "Bảng mười hai giọng, nhóm 1. trắng – trắng – trắng, giọng Sol: năm nốt (bậc 1–5) Sol La Si Đô Rê; phím đen (ngón tay phải) –; thế thứ: bậc 3 thành Si♭."
    loai: cau-truc
    nguon:
      - omt-major
      - omt-minor
      - omt-keyboard
