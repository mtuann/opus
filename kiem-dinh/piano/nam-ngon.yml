ghi_chu: 'Vị trí năm ngón và những bài hai tay đầu tiên (piano/nam-ngon, lõi). Nguồn: OMT (ASPN, The Keyboard, Major Scales, Minor Scales), MT21C và Mount ch. 9 (hóa biểu), Baylor (số ngón), Evansville (luồn ngón cái), BYU và Wikipedia (thay ngón), HKB (đối xứng gương), Hal Leonard (Faber, Mikrokosmos), ICPL (Alfred). Bảng thế tay và bảng mười hai giọng: dựng lại từng ô bằng W-W-H-W và màu phím, đều đúng. Mỗi khối abc kiểm ô nhịp, số ngón và chuyển cung; Q 66–80 nằm trong ♩ = 60–80. Sửa trang: "gần như" thành "có thể" (cả description); "hầu hết giáo trình" thành "của trang này"; bỏ "cách nhiều giáo trình dùng"; "hầu như luôn viết thành Đô♯ thứ, Sol♯ thứ" thành "có thể viết" kèm số dấu hóa (Rê♭ thứ 8 giáng, La♭ thứ 7, Đô♯ thứ 4 thăng, Sol♯ thứ 5); "hiếm khi" thành "thường không", "Có năm cách" thành "Dưới đây là năm cách"; ví dụ mở rộng "ngón 5 với từ Sol lên La" thành "ngón 4 đặt trên Sol để ngón 5 với lên La" (lỗi thật); bỏ "rất hay gặp trong Bach và các bản nhạc chậm"; "ba bài đầu chỉ cần thế Đô" (sai) sửa; Mikrokosmos sửa theo Hal Leonard. Chưa chắc: tên "thế tay năm ngón" (Baylor không tải được; nội dung suy từ OMT). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): five-finger position (thế tay năm ngón), extension (mở rộng), contraction (thu hẹp), thumb crossing (luồn ngón cái), finger substitution (thay ngón), parallel motion và contrary motion (chuyển động song song, ngược chiều), unison (đồng âm), enharmonic (đồng âm khác tên); đã có: key signature, legato, staccato, tonic. Câu về site: các trang chưa chuyển (luyen-tap/metronome, tai-lieu-tham-khao) đã kiểm trên ../opus-zero/docs/. Lô trước yêu cầu giữ: KHỚP. Lưu ý: piano/gam và piano/lo-trinh nói "sáu giọng" cho chặng khởi đầu, trang này có mười hai giọng: không mâu thuẫn. Các mục doi_chu tự viết bằng chữ thường; người giao chạy lại node tools/chuyen/so-chu.mjs piano/nam-ngon --doi-chu sau khi build lại dist.'
doi_chu:
  - cu: 'Những tuần đầu chơi piano gần như diễn ra trọn trong thế tay năm ngón: mỗi ngón đặt sẵn trên một phím, nên bạn không phải lo "ngón nào", và dồn được sự chú ý vào đọc nhạc, giữ nhịp, nghe tiếng đàn, và việc khó nhất: cho hai tay chơi cùng lúc.'
    moi: 'Những tuần đầu chơi piano có thể diễn ra trọn trong thế tay năm ngón: mỗi ngón đặt sẵn trên một phím, nên bạn không phải lo "ngón nào", và dồn được sự chú ý vào đọc nhạc, giữ nhịp, nghe tiếng đàn, và việc khó nhất: cho hai tay chơi cùng lúc.'
    ly_do: 'n1 (khong-can-nguon): "gần như" là mức độ không kiểm được; sửa cả description.'
  - cu: Thế đầu tiên của hầu hết giáo trình
    moi: Thế đầu tiên của trang này
    ly_do: 'n9 (khong-can-nguon): "hầu hết giáo trình" không kiểm được.'
  - cu: Năm nốt trưởng luôn theo mẫu cung – cung – nửa cung – cung. Muốn đổi sang thứ, chỉ cần hạ bậc 3 xuống nửa cung, tức ngón 3 của cả hai tay dịch xuống một phím. Bảng dưới xếp mười hai giọng theo màu phím của bậc 1, 3 và 5 (cũng là ba nốt của hợp âm chủ), cách nhiều giáo trình dùng để tay nhớ hình dạng.
    moi: Năm nốt trưởng luôn theo mẫu cung – cung – nửa cung – cung. Muốn đổi sang thứ, chỉ cần hạ bậc 3 xuống nửa cung, tức ngón 3 của cả hai tay dịch xuống một phím. Bảng dưới xếp mười hai giọng theo màu phím của bậc 1, 3 và 5 (cũng là ba nốt của hợp âm chủ), để tay nhớ hình dạng.
    ly_do: 'n27 (da-sua): bỏ "cách nhiều giáo trình dùng" vì không kiểm được.'
  - cu: "Trên bản nhạc, Rê♭ thứ và La♭ thứ hầu như luôn được viết thành Đô♯ thứ và Sol♯ thứ: cùng phím đàn, ít dấu hóa hơn."
    moi: "Rê♭ thứ cần tám dấu giáng nên không có hóa biểu, còn La♭ thứ cần bảy. Trên bản nhạc, có thể viết hai giọng này thành Đô♯ thứ (bốn dấu thăng) và Sol♯ thứ (năm dấu thăng): cùng phím đàn, ít dấu hóa hơn."
    ly_do: 'n28 (da-sua): MT21C: số dấu hóa; "hầu như luôn" không có nguồn.'
  - cu:
      - "Nhạc thật hiếm khi nằm yên trong năm phím. Có năm cách để tay đi ra khỏi thế:"
      - "Mở rộng: một ngón duỗi ra với tới phím ngoài thế tay trong khi các ngón khác giữ chỗ, ví dụ ngón 5 với từ Sol lên La."
    moi:
      - "Nhạc thật thường không nằm yên trong năm phím. Dưới đây là năm cách để tay đi ra khỏi thế:"
      - "Mở rộng: một ngón duỗi ra với tới phím ngoài thế tay trong khi các ngón khác giữ chỗ, ví dụ ngón 4 đặt trên Sol để ngón 5 với lên La."
    ly_do: 'n42 (khong-can-nguon): "hiếm khi" và "có năm cách" (khẳng định đủ) không kiểm được.; n43 (khong-can-nguon): ngón 5 đặt trên Sol là thế Đô chứ không phải mở rộng; khớp 10-bai-dau-tien bài 2 và khối abc 9.'
  - cu: "Thay ngón trên một phím: giữ phím rồi đổi ngón (ví dụ ngón 3 thay ngón 1) để chuẩn bị thế mới mà vẫn liền tiếng; rất hay gặp trong Bach và các bản nhạc chậm."
    moi: "Thay ngón trên một phím: giữ phím rồi đổi ngón (ví dụ ngón 3 thay ngón 1) để chuẩn bị thế mới mà vẫn liền tiếng."
    ly_do: 'n47 (da-sua): bỏ "rất hay gặp trong Bach và các bản nhạc chậm" vì không kiểm được.'
  - cu: Trang này đi song song với 10 bài đầu tiên từ bài 4 trở đi (ba bài đầu chỉ cần thế Đô của Hai tuần đầu tiên). Khi các bài trên đã trơn tru, bắt đầu gam một quãng tám.
    moi: Trang này đi song song với 10 bài đầu tiên từ bài 4 trở đi (ba bài đầu dùng các thế tay đã gặp ở Hai tuần đầu tiên; riêng bài 2 có mở rộng tay, xem mục Rời khỏi thế năm ngón). Khi các bài trên đã trơn tru, bắt đầu gam một quãng tám.
    ly_do: 'n51 (da-sua): bài 1 có tay trái ở thế Sol và bài 2 mở rộng tay phải (10-bai-dau-tien), nên "chỉ cần thế Đô" sai.'
  - cu: "Béla Bartók, Mikrokosmos, quyển 1: những bài đầu là giai điệu hai tay đồng âm trong thế năm ngón."
