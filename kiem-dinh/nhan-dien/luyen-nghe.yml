ghi_chu: 'Trang gồm hai công cụ; chữ trong công cụ đã đọc: nhan-dien.js (CHU_ND, VI_DU) và luyen-tai.js (FJ, KET_CAU, notKetCau, texture-trainer). Bốn kết cấu khớp bài 28 đã khóa. Lệch cần người giao quyết: tên "Frère Jacques" (n11). Chỗ phải sửa trong nhan-dien.js đã ghi ở kiem-dinh/nhan-dien/so-sanh-thoi-ky.yml (ghi_chu cấp hồ sơ và nhận định b1a…m2c). Không có chỗ phải sửa trong luyen-tai.js. Câu ve-site n4 trỏ trang chưa chuyển (luyen-tap/nhat-ky). Thuật ngữ chưa có hồ sơ: đơn âm, chủ điệu, phức điệu, dị âm đã có ở bài 28; luyến láy chưa có. Review D5-gom (nhóm D, 29/10/2026): tên Frère Jacques giữ (n11, Britannica và Carleton); soát nhãn đổi n2, n3, n12 thành ve-site.'
