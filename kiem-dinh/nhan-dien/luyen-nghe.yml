nhan_dinh:
  - id: n1
    cau: Công cụ nhận biết kết nằm ở bài Nghe tiến trình hòa âm (link luyen-tai/nghe-tien-trinh#luyen-voi-cong-cu).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: nghe-tien-trinh.md có mục "Luyện với công cụ { #luyen-voi-cong-cu }" và mục "Bốn loại kết". Hồ sơ kiem-dinh/luyen-tai/index.yml ghi giữ nhan-dien/luyen-nghe.'
  - id: n2
    cau: Tất cả phát bằng âm thanh tổng hợp trong trình duyệt.
    loai: cau-truc
    nguon:
      - js-lt
      - abc
    ket_qua: dung
    ghi_chu: "Đã đọc mã: luyen-tai.js dùng chuanBi, choiNot (am-thanh.js); nhan-dien.js dùng trình phát abcjs với %%MIDI program."
  - id: n3
    cau: Mỗi câu đều có đáp án và giải thích.
    loai: cau-truc
    nguon:
      - js-lt
      - abc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mỗi câu đều có đáp án và giải thích". Sai với công cụ kết cấu: texture-trainer chỉ hiện "Đúng: {tên kết cấu}. Bấm Câu mới để tiếp tục." (luyen-tai.js, dòng dung), không giải thích. Công cụ đoán phong cách thì hiện đáp án và danh sách dấu hiệu. Sửa chữ trên trang cho khớp.'
  - id: n4
    cau: Kết quả được tính vào nhật ký luyện tập (link luyen-tap/nhat-ky).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chưa chuyển sang opus; đã có ở opus-zero/docs/luyen-tap/. Điều cần giữ: nhận diện được ghi vào kỹ năng "styles" (nhan-dien.js: ghiNgay("styles", 1); luyen-tai.js: ngay "styles", kyNang "texture"); khi trang nhật ký chuyển, phải còn mục ghi "styles".'
  - id: n5
    cau: Mười đoạn nhạc ngắn, mỗi đoạn viết theo đặc trưng của một thời kỳ (Baroque, Cổ điển, Lãng mạn, Ấn tượng, Thế kỷ 20).
    loai: danh-muc
    nguon:
      - abc
    ket_qua: dung
    ghi_chu: "src/scripts/nhan-dien.js: VI_DU có 10 đoạn, hai đoạn mỗi thời kỳ; THOI_KY_ND có đúng 5 thời kỳ. Hồ sơ so-sanh-thoi-ky đã kiểm từng đoạn (xem ghi_chu ở đó)."
  - id: n6
    cau: Nghe, đoán thời kỳ, rồi xem khuông nhạc và các dấu hiệu; khuông và dấu hiệu chỉ hiện sau khi trả lời.
    loai: ve-site
    ket_qua: dung
    ghi_chu: Khớp CHU_ND.dan và CHU_ND.dung trong nhan-dien.js ("Khuông nhạc và các dấu hiệu chỉ hiện sau khi bạn trả lời").
  - id: n7
    cau: "Gợi ý: nghe nhạc cụ trước (harpsichord? piano? dàn dây? marimba?)."
    loai: khuyen-tap
    nguon:
      - abc
    ket_qua: khong-can-nguon
    ghi_chu: "Danh sách nhạc cụ khớp %%MIDI program trong VI_DU: 6 (harpsichord), 0 (piano), 48 (dàn dây), 12 (marimba)."
  - id: n8
    cau: "Gợi ý: rồi bè trầm (đi liên tục? hình đệm lặp lại? đứng yên?), rồi hòa âm (đơn giản? nhiều nửa cung? mơ hồ?)."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Gợi ý thứ tự nghe. Nội dung dấu hiệu đã kiểm ở hồ sơ so-sanh-thoi-ky.
  - id: n9
    cau: Link tới bảng so sánh các thời kỳ (nhan-dien/so-sanh-thoi-ky).
    loai: ve-site
    ket_qua: dung
    ghi_chu: Trang cùng lô, đã chuyển.
  - id: n10
    cau: Cùng một giai điệu được phát theo bốn kết cấu khác nhau (xem bài 28).
    loai: cau-truc
    nguon:
      - js-lt
    ket_qua: dung
    ghi_chu: "luyen-tai.js: KET_CAU có 4 loại (mono, homo, poly, hetero) và notKetCau dựng đủ bốn, cùng dùng giai điệu FJ. Khớp nhac-ly/28-ket-cau (bốn loại, đã khóa)."
  - id: n11
    cau: Giai điệu đó là Frère Jacques.
    loai: ten
    ket_qua: null
    ghi_chu: 'chưa chắc: Britannica (canon) có nêu "Frère Jacques" là ví dụ canon (bậc 2) nhưng bài 28 đã khóa bỏ tên này vì không có nguồn bậc 1–2 cho cao độ. Cao độ trong FJ (luyen-tai.js) là bản quen thuộc, không có bản nhạc đọc được để đối chiếu. Người giao quyết: giữ tên (cần mở khóa bài 28) hay bỏ tên ở trang này cho thống nhất.'
  - id: n12
    cau: Tốc độ và giọng thay đổi ngẫu nhiên.
    loai: cau-truc
    nguon:
      - js-lt
    ket_qua: dung
    ghi_chu: "luyen-tai.js: giọng dịch từ -3 đến +3 nửa cung, mỗi phách 0,38 đến 0,5 giây (cau)."
  - id: n13
    cau: Link tới bài 28 (nhac-ly/28-ket-cau).
    loai: ve-site
    ket_qua: dung
    ghi_chu: Đã chuyển và đã khóa; có mục "Bốn loại kết cấu".
  - id: n14
    cau: Chỉ một giai điệu → đơn âm.
    loai: dinh-nghia
    nguon:
      - omt-tex
    ket_qua: dung
    ghi_chu: "OMT Texture: monophony. Mã: mono = một bè FJ."
  - id: n15
    cau: Giai điệu + hợp âm bên dưới → chủ điệu.
    loai: dinh-nghia
    nguon:
      - omt-tex
    ket_qua: dung
    ghi_chu: "OMT Texture: homophony, melody with accompaniment. Mã: homo = FJ + hợp âm Đô–Đô–Đô–Đô–Đô–Sol–Đô–Sol (DEM_FJ), khớp bài 28."
  - id: n16
    cau: Giai điệu thứ hai vào sau, bắt chước giai điệu đầu → phức điệu.
    loai: dinh-nghia
    nguon:
      - omt-tex
      - brit-canon
    ket_qua: dung
    ghi_chu: "OMT Texture: polyphony; Britannica: canon. Mã: poly = canon, bè hai vào sau 8 phách, thấp hơn một quãng tám, khớp bài 28. Ghi chú: phức điệu nói chung không đòi hỏi bắt chước, nhưng đây là gợi ý cho đúng ví dụ của công cụ."
  - id: n17
    cau: Hai bản cùng giai điệu, một bản có thêm nốt luyến láy, vang cùng lúc → dị âm.
    loai: dinh-nghia
    nguon:
      - omt-tex
    ket_qua: dung
    ghi_chu: 'OMT Texture: heterophony, simultaneous variations of the same melody. Mã: hetero = FJ và bản cao hơn một quãng tám có thêm nốt láy (khớp bài 28). Trang nói "một bản có thêm nốt luyến láy" đúng với mã.'
  - id: n18
    cau: 'Chữ trong công cụ đoán phong cách: CHU_ND (lời dẫn, nút "Chọn thời kỳ", "Chưa đúng. Nghe lại: để ý nhạc cụ, kết cấu và hòa âm.", "Đúng: {thời kỳ}. Các dấu hiệu:", "Lượt này: đúng ngay lần đầu x/y").'
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đã đọc nhan-dien.js: không có khẳng định cần nguồn; giữ nguyên."
  - id: n19
    cau: 'Chữ trong công cụ kết cấu: "Cùng một giai điệu được phát theo một trong bốn kết cấu", "Chưa đúng. Đếm xem có mấy đường nét độc lập.", "Đúng: {tên}. Bấm Câu mới để tiếp tục."'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã đọc luyen-tai.js: không có khẳng định cần nguồn. Lời khuyên "đếm mấy đường nét độc lập" hợp với phân biệt đơn âm, chủ điệu, phức điệu, dị âm nhưng là gợi ý chứ không phải định nghĩa.'
  - id: n20
    cau: "Tên bốn nút kết cấu: Đơn âm, Chủ điệu, Phức điệu, Dị âm."
    loai: ten
    nguon:
      - omt-tex
    ket_qua: dung
    ghi_chu: Khớp thuật ngữ đã khóa ở bài 28 và KET_CAU (luyen-tai.js).
  - id: n21
    cau: 'Mười đoạn nhạc: thời kỳ, mã ABC và dòng "Dấu hiệu" trong VI_DU.'
    loai: cau-truc
    nguon:
      - abc
    ket_qua: da-sua
    ghi_chu: "Đã kiểm trong hồ sơ so-sanh-thoi-ky (b1a…m2c): có 6 chỗ phải sửa trong nhan-dien.js (baroque-1, classical-1 hai chỗ, romantic-2, impressionist-1, modern-1, modern-2). Hồ sơ này không lặp lại; xem ghi_chu của so-sanh-thoi-ky. Không sửa file .js."
khuong_nhac: []
ghi_chu: 'Trang gồm hai công cụ; chữ trong công cụ đã đọc: nhan-dien.js (CHU_ND, VI_DU) và luyen-tai.js (FJ, KET_CAU, notKetCau, texture-trainer). Bốn kết cấu khớp bài 28 đã khóa. Lệch cần người giao quyết: tên "Frère Jacques" (n11). Chỗ phải sửa trong nhan-dien.js đã ghi ở kiem-dinh/nhan-dien/so-sanh-thoi-ky.yml (ghi_chu cấp hồ sơ và nhận định b1a…m2c). Không có chỗ phải sửa trong luyen-tai.js. Câu ve-site n4 trỏ trang chưa chuyển (luyen-tap/nhat-ky). Thuật ngữ chưa có hồ sơ: đơn âm, chủ điệu, phức điệu, dị âm đã có ở bài 28; luyến láy chưa có.'
doi_chu:
  - cu: Hai công cụ luyện tai cho kỹ năng nhận diện (công cụ nhận biết kết nằm ở bài Nghe tiến trình hòa âm). Tất cả phát bằng âm thanh tổng hợp trong trình duyệt; mỗi câu đều có đáp án và giải thích. Kết quả được tính vào nhật ký luyện tập.
    moi: Hai công cụ luyện tai cho kỹ năng nhận diện (công cụ nhận biết kết nằm ở bài Nghe tiến trình hòa âm). Tất cả phát bằng âm thanh tổng hợp trong trình duyệt; mỗi câu đều có đáp án; ở phần đoán phong cách, mỗi đoạn còn kèm các dấu hiệu. Kết quả được tính vào nhật ký luyện tập.
    ly_do: 'n3: công cụ kết cấu chỉ hiện "Đúng: …", không giải thích.'
