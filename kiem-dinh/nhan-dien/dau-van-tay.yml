    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời dẫn của trang.
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý.
  - id: n2
    cau: "Đây là xu hướng, không phải quy luật: mọi nhà soạn nhạc giỏi đều có lúc làm khác thói quen của mình."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời dặn người đọc.
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý.
