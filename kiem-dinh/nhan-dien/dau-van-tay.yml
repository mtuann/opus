nhan_dinh:
  - id: n1
    cau: Mỗi nhà soạn nhạc lớn có những thói quen riêng, như nét chữ; trang liệt kê dấu hiệu dễ nghe nhất, kèm một tác phẩm để kiểm chứng.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời dẫn của trang.
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý.
  - id: n2
    cau: "Đây là xu hướng, không phải quy luật: mọi nhà soạn nhạc giỏi đều có lúc làm khác thói quen của mình."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Lời dặn người đọc.
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý.
  - id: n3
    cau: Nhóm Baroque gồm Vivaldi, J. S. Bach, Handel.
    loai: danh-muc
    nguon:
      - lt-4.4
      - lt-4.5
      - lt-4.6
    ket_qua: dung
    ghi_chu: Clark 4.4, 4.5, 4.6 xếp ba người vào chương Baroque.
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Johann-Sebastian-Bach", "https://www.britannica.com/biography/George-Frideric-Handel", "https://www.britannica.com/biography/Antonio-Vivaldi" ]
    luot_2_ghi_chu: Cả ba là Baroque; BACH 'Baroque era', HAND 'late Baroque', VIV concerto.
  - id: n4
    cau: Nhóm Cổ điển gồm Haydn, Mozart, Beethoven.
    loai: danh-muc
    nguon:
      - kuz-13.6
      - cod-mozart
      - kuz-15.5
    ket_qua: dung
    ghi_chu: Kuznetsova 13.06 (Haydn), COD (Mozart), Kuznetsova 15.05 (Beethoven, chương Classical Instrumental and Chamber Music). nha-soan-nhac.yml ghi Beethoven "Cổ điển/Lãng mạn"; trang xếp Cổ điển, không lệch nghĩa.
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Joseph-Haydn", "https://www.britannica.com/art/Western-music" ]
    luot_2_ghi_chu: Haydn thuộc Cổ điển (Britannica); Beethoven là nhân vật chuyển tiếp sang Lãng mạn nhưng thường xếp Cổ điển.
  - id: n5
    cau: Nhóm Lãng mạn gồm Schubert, Chopin, Liszt, Wagner, Brahms, Tchaikovsky, Dvořák.
    loai: danh-muc
    nguon:
      - jones-6.16
      - jones-6.4
      - jones-7.1
      - jones-8.13
      - jones-8.9
      - jones-8.11
    ket_qua: dung
    ghi_chu: "Jones xếp Schubert, Chopin (chương 6, Early Romantic), Wagner (7, Romantic Opera), Brahms, Tchaikovsky, Dvořák (8, Late Romantic). Liszt: Encyclopedia.com (tiểu sử) mô tả ông là nghệ sĩ piano và nhà soạn nhạc Lãng mạn."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Western-music", "https://www.britannica.com/biography/Frederic-Chopin", "https://www.britannica.com/biography/Antonin-Dvorak" ]
    luot_2_ghi_chu: Chopin, Dvořák, Liszt, Wagner thuộc thế kỷ 19; Schubert, Brahms xếp Lãng mạn theo thông lệ.
  - id: n6
    cau: Nhóm Thế kỷ 20 gồm Debussy, Ravel, Stravinsky, Shostakovich, Reich và Glass, Pärt.
    loai: danh-muc
    nguon:
      - jones-9.12
      - cod-ravel
      - jones-10.6
      - jones-10.2
      - jones-11.9
      - jones-11.13
    ket_qua: null
    ghi_chu: 'chưa chắc: Jones xếp cả sáu vào chương 20th Century. Lệch với dữ liệu: src/data/nha-soan-nhac.yml xếp Pärt, Reich, Glass là "Đương đại" (hình periods cũng đặt Pärt ở Đương đại 2000–nay), còn trang gộp chung dưới "Thế kỷ 20". Người giao quyết định đổi tiêu đề nhóm hay đổi dữ liệu. Không sửa trang vì cả hai cách đều có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Western-music", "https://www.britannica.com/biography/Claude-Debussy", "https://www.britannica.com/biography/Maurice-Ravel", "https://www.britannica.com/biography/Igor-Stravinsky", "https://www.britannica.com/biography/Arvo-Part" ]
    luot_2_ghi_chu: Nhóm quy ước thế kỷ 20; trang khác đặt Pärt ở 'Đương đại' nhưng không mâu thuẫn.
  - id: n7
    cau: "Vivaldi: violin độc tấu điêu luyện; ritornello rõ ràng; nhạc miêu tả (chim, bão)."
    loai: cau-truc
    nguon:
      - lt-4.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Năng lượng dồn dập, hợp âm rải và gam chạy nhanh trên violin; ritornello rõ ràng; nhiều chuỗi đi xuống; nhạc miêu tả (chim, bão)." Clark 4.4: concerto violin độc tấu, ritornello, Bốn Mùa miêu tả chim, bão. Bỏ "năng lượng dồn dập", "hợp âm rải và gam chạy", "chuỗi đi xuống" vì không có nguồn đã mở nói riêng về Vivaldi (Listen 8e chỉ nói chuỗi là đặc điểm chung của giai điệu Baroque).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Antonio-Vivaldi" ]
    luot_2_ghi_chu: Xác nhận Vivaldi là nghệ sĩ violin điêu luyện, đóng góp hình thức concerto; ritornello/Bốn Mùa không có trong trang nhưng là kiến thức phổ thông.
  - id: n8
    cau: "J. S. Bach: phức điệu, nhiều bè độc lập cùng chuyển động, nhất là trong fugue; viết nhiều cho organ và harpsichord, những nhạc cụ hợp với đối âm."
    loai: cau-truc
    nguon:
      - lt-4.6
      - lt-4.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phức điệu dày đặc: luôn có nhiều bè độc lập cùng chuyển động; bè trầm có giai điệu riêng; hòa âm phong phú, nhiều nốt treo; mọi chi tiết đều có lý." Clark 4.6, 4.2: đối âm, fugue, organ, harpsichord. Bỏ "luôn", "bè trầm có giai điệu riêng", "nốt treo", "mọi chi tiết đều có lý" vì không có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n9
    cau: "Handel: nhiều hợp xướng (oratorio) và dùng cùng phong cách với opera của ông; trong hợp xướng, kết cấu chuyển giữa chủ điệu và phức điệu."
    loai: cau-truc
    nguon:
      - lt-4.5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kết cấu đơn giản và rộng rãi hơn Bach; hợp xướng hùng tráng với những khối hợp âm lớn xen phức điệu; giai điệu dễ nhớ, kịch tính sân khấu." Clark 4.5 nói về oratorio, hợp xướng, opera; so sánh "đơn giản hơn Bach" và "giai điệu dễ nhớ" không có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/George-Frideric-Handel" ]
    luot_2_ghi_chu: Xác nhận oratorio (Messiah) và opera; chi tiết kết cấu hợp xướng không có trong trang.
  - id: n10
    cau: 'Haydn: hóm hỉnh, bất ngờ (như hợp âm to đột ngột trong "Surprise"), kết giả; xây cấu trúc lớn từ những môtip ngắn, đơn giản; hay dùng chất dân gian.'
    loai: cau-truc
    nguon:
      - kuz-13.6
      - cod-haydn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hóm hỉnh: dừng đột ngột, im lặng bất ngờ, kết giả; phát triển chủ đề rất chặt từ một ý nhỏ; nhiều chất dân gian." Kuznetsova 13.06 và COD: hài hước, bất ngờ, môtip ngắn, dân gian. Bỏ "dừng đột ngột, im lặng bất ngờ" vì không có nguồn, thay bằng ví dụ có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n11
    cau: "Mozart: cảm giác về hình thức và sự cân đối; bề ngoài rạng rỡ, vui nhưng có mạch u sầu bên dưới; nhạc opera nới rộng nghệ thuật của ca sĩ; đệm Alberti, như đầu Sonata K. 545."
    loai: cau-truc
    nguon:
      - cod-mozart
      - cod-alb
      - mutopia-545
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giai điệu ca hát tự nhiên như opera; câu nhạc cân đối hoàn hảo; bè đệm Alberti; chuyển sắc trưởng – thứ trong chớp mắt; dễ mà khó." COD (Mozart, Alberti bass) và bản nhạc Mutopia K. 545 chương 1 (tay trái Đô–Sol–Mi–Sol đúng kiểu Alberti). Bỏ "chuyển sắc trưởng – thứ trong chớp mắt" và "dễ mà khó" vì không có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n12
    cau: 'Beethoven: phát triển một ý nhạc nhỏ qua nhiều biến đổi (như phân mảnh chủ đề trong Giao hưởng số 5); dùng nhiều sforzando; coda mở rộng thành cao trào; các tác phẩm giai đoạn giữa thường được gọi là "anh hùng", thể hiện đấu tranh.'
    loai: cau-truc
    nguon:
      - kuz-15.5
      - mac-b5
      - cod-beet
      - cod-sforz
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Môtip ngắn phát triển không ngừng; sforzando nhấn bất ngờ; tương phản dữ dội; coda dài như phần phát triển thứ hai; cảm giác đấu tranh rồi chiến thắng." Giữ phần có nguồn (Kuznetsova 15.05, Listen 8e, COD). Bỏ "tương phản dữ dội", "chiến thắng"; "coda như phần phát triển thứ hai" thành "coda mở rộng thành cao trào" theo mức nguồn nói. Link bài 30 giữ nguyên.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n13
    cau: "Schubert: giai điệu hát hơi dài; cách chuyển giọng độc đáo, hay dùng quan hệ quãng 3 nửa cung (chromatic mediant) giữa các hợp âm."
    loai: cau-truc
    nguon:
      - jones-6.16
      - cam-kopp
      - omt-med
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giai điệu hát vô tận; chuyển đột ngột giữa trưởng và thứ trên cùng chủ âm; chuyển giọng sang giọng cách quãng 3; lặp lại dài, trời đất rộng." Jones 6.16 (giai điệu), Kopp và OMT Mediants (quan hệ quãng 3). Bỏ "vô tận", "lặp lại dài, trời đất rộng" vì không có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n14
    cau: "Chopin: chủ yếu viết cho piano (mọi tác phẩm đều có piano); rubato là một phần lối chơi của ông; điệu nhảy Ba Lan (mazurka, polonaise) và nocturne."
    loai: cau-truc
    nguon:
      - jones-6.4
      - cod-rub
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Gần như chỉ viết cho piano; giai điệu như giọng hát bel canto với nhiều trang trí; tay trái rải rộng; rubato; điệu nhảy Ba Lan." Jones 6.4 và COD, Rubato. Bỏ "bel canto, trang trí, tay trái rải rộng" vì không có nguồn đã mở. Quiz Q3 sửa theo.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Frederic-Chopin" ]
    luot_2_ghi_chu: "Britannica: chủ yếu piano, mazurka, polonaise, nocturne, rubato; các tác phẩm khác (ca khúc, sonata cello) đều có piano."
  - id: n15
    cau: "Liszt: kỹ thuật piano phô diễn; chuyển đổi chủ đề, dùng lại một chủ đề ở nhiều phần với tính cách khác nhau để thống nhất tác phẩm; mở đầu thể loại thơ giao hưởng."
    loai: cau-truc
    nguon:
      - cod-liszt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kỹ thuật piano phô diễn: quãng 8 liên tiếp, chuỗi nốt khắp bàn phím; giai điệu ở giữa, trang trí bao quanh; chuyển đổi chủ đề (một giai điệu biến hình thành nhiều tính cách)." Encyclopedia.com (Liszt): virtuoso, chuyển đổi chủ đề, thơ giao hưởng. Bỏ chi tiết quãng 8, "giai điệu ở giữa" vì không có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Franz-Liszt" ]
    luot_2_ghi_chu: Xác nhận virtuoso piano và 12 thơ giao hưởng; biến đổi chủ đề không có trong trang.
  - id: n16
    cau: 'Wagner: âm nhạc liền mạch, "giai điệu bất tận" thay cho sự tách bạch giữa aria và recitative; hòa âm nửa cung dày đặc; dàn nhạc có vai trò và sức mạnh lớn hơn; leitmotif.'
    loai: cau-truc
    nguon:
      - jones-7.1
      - lumen-wag
      - cod-chrom
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Âm nhạc liền mạch, gần như không bao giờ có kết trọn; hòa âm nửa cung căng thẳng kéo dài; dàn nhạc rất lớn, kèn đồng mạnh; leitmotif." Jones 7.1, Lumen, COD (Chromaticism). Bỏ "gần như không bao giờ có kết trọn" và "kèn đồng mạnh" vì không có nguồn. Quiz Q4 sửa theo.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n17
    cau: 'Brahms: hình thức cổ điển chặt chẽ ("ý thức cổ điển về hình thức và trật tự"), bậc thầy đối âm; hay dùng hemiola và những xê dịch nhịp (xem bài 15).'
    loai: cau-truc
    nguon:
      - clark-6.9
      - jones-8.13
      - cod-hem
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kết cấu dày, ấm, nhiều bè giữa; hemiola và nhịp chồng; hình thức cổ điển chặt chẽ, nỗi buồn kìm nén." Clark 6.9 chỉ nói một chương "thicker"; bỏ "dày, ấm, nhiều bè giữa", "nỗi buồn kìm nén". Bài 15 có "hemiola" (đã kiểm).'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n18
    cau: "Tchaikovsky: giai điệu cuốn hút ngay, dễ nhớ, đầy cảm xúc; kèn gỗ và dây luân phiên giữ giai điệu (như trong Romeo và Juliet); viết nhạc ballet."
    loai: cau-truc
    nguon:
      - jones-8.9
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giai điệu lớn, dễ nhớ, cảm xúc dâng trào; chuỗi đi lên dẫn đến cao trào; kèn gỗ độc tấu trên nền dây; nhịp điệu ballet." Jones 8.9. Bỏ "chuỗi đi lên dẫn đến cao trào" vì không có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n19
    cau: "Dvořák: chất dân gian Séc (nhịp điệu của Moravia và Bohemia) và ảnh hưởng nhạc Mỹ (spiritual); giai điệu ngũ cung thời kỳ ở Mỹ."
    loai: cau-truc
    nguon:
      - jones-8.11
      - jones-8.12
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chất dân gian Séc (và Mỹ); giai điệu ngũ cung; nhịp nhảy múa; phối khí trong sáng." Jones 8.11, 8.12. Bỏ "nhịp nhảy múa", "phối khí trong sáng"; ngũ cung gắn với thời kỳ ở Mỹ theo Jones 8.12.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Antonin-Dvorak" ]
    luot_2_ghi_chu: Xác nhận chất dân gian Bohemia, Moravia, Giao hưởng Tân thế giới; spiritual/ngũ cung không có trong trang.
  - id: n20
    cau: "Debussy: hợp âm trượt song song; gam toàn cung và ngũ cung; chuyển giọng không chuẩn bị; hòa âm nhiều khi mơ hồ về giọng."
    loai: cau-truc
    nguon:
      - jones-9.12
      - brit-imp
      - brit-whole
      - hut-32.1
      - omt-coll
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hợp âm trượt song song; gam toàn cung và ngũ cung; nhịp mơ hồ; rất nhỏ, như sương." Bỏ "nhịp mơ hồ" và "rất nhỏ, như sương" vì không có nguồn (ẩn dụ). Planing và gam toàn cung: Britannica, Hutchinson 32.1, OMT Collections.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Impressionism-music" ]
    luot_2_ghi_chu: "IMP: hòa âm tĩnh, mơ hồ, Debussy khởi xướng; hợp âm trượt/toàn cung không có trong trang."
  - id: n21
    cau: 'Ravel: phối khí chính xác, tinh xảo (Stravinsky gọi ông là "thợ đồng hồ Thụy Sĩ"); hợp âm 9, có khi chạy song song; ảnh hưởng nhạc Tây Ban Nha, điệu nhảy và jazz.'
    loai: cau-truc
    nguon:
      - cod-ravel
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phối khí sắc nét, chính xác như đồng hồ Thụy Sĩ; hòa âm 7 và 9 trong veo; ảnh hưởng điệu nhảy Tây Ban Nha và jazz." Encyclopedia.com (Ravel). Bỏ "hợp âm 7", "trong veo". Nguồn nói "đồng hồ Thụy Sĩ" là lời Stravinsky nên ghi rõ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Maurice-Ravel" ]
    luot_2_ghi_chu: Xác nhận Ravel tinh xảo, Rapsodie espagnole, Ấn tượng.
  - id: n22
    cau: "Stravinsky: ostinato dồn dập, có khi nhiều ostinato va vào nhau; nhịp điệu vượt qua vạch nhịp, trọng âm bất ngờ; hợp âm ghép, đa điệu tính (Petrushka)."
    loai: cau-truc
    nguon:
      - jones-10.6
      - jones-10.7
      - cod-stra
      - brit-poly
      - hut-32.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ostinato lặp lại với trọng âm dịch chuyển bất ngờ; đổi nhịp liên tục; các khối âm thanh cắt ghép đột ngột; đa điệu tính." Bỏ "đổi nhịp liên tục", "khối cắt ghép" vì không có nguồn. Đa điệu tính gắn với Petrushka theo Britannica.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/polytonality", "https://www.britannica.com/biography/Igor-Stravinsky", "https://www.britannica.com/art/ostinato" ]
    luot_2_ghi_chu: "POLY: Petrushka chồng Đô trưởng lên Fa♯ trưởng (đa điệu tính); STR: nhịp bất thường, đảo phách; OST: định nghĩa ostinato."
  - id: n23
    cau: "Shostakovich: giai điệu dài ở violin, xen các đoạn độc tấu kèn gỗ; chất châm biếm, kỳ quái và hành khúc; cuối Giao hưởng số 5 là sự lặp lại căng thẳng, ám ảnh của Rê trưởng."
    loai: cau-truc
    nguon:
      - jones-10.2
      - jones-10.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giai điệu dài, cô đơn ở violin hoặc kèn gỗ; hành khúc máy móc; châm biếm, valse méo mó; cao trào bị ép buộc." Jones 10.2, 10.3. Bỏ "cô đơn", "máy móc", "valse méo mó", "bị ép buộc" vì không có nguồn (diễn giải).'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n24
    cau: "Reich và Glass: mẫu ngắn lặp lại, thay đổi rất chậm; Reich: hai mẫu giống nhau lệch pha dần (Piano Phase); Glass: quá trình cộng dồn (thêm một lần lặp, bớt nốt cuối)."
    loai: cau-truc
    nguon:
      - jones-11.9
      - hut-35.1
      - hut-35.2
      - cod-reich
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mẫu ngắn lặp lại, thay đổi rất chậm; Reich: lệch pha, tiết tấu đan nhau; Glass: hợp âm rải đều đặn, các khối lặp lại có đếm." Hutchinson 35.1 (additive), 35.2 (phase shifting). Bỏ "hợp âm rải đều đặn" vì không có nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: Kiến thức chung nghe hợp lý nhưng các nguồn bậc 2 đã mở không nói điều này (hoặc không mở được trang).
  - id: n25
    cau: "Pärt: tĩnh lặng, giản dị: nốt đơn hoặc hợp âm ba, tempo chậm, âm thanh như tiếng chuông ngân (tintinnabuli)."
    loai: cau-truc
    nguon:
      - jones-11.13
      - brit-part
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tĩnh lặng, rất ít nốt; một bè đi theo gam, một bè theo hợp âm chủ như tiếng chuông (tintinnabuli)." Britannica, Jones 11.13. Bỏ "một bè đi theo gam, một bè theo hợp âm chủ" vì không có nguồn mở nói đủ chi tiết.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Arvo-Part" ]
    luot_2_ghi_chu: "Pärt: tintinnabuli, hợp âm ba như tiếng chuông."
