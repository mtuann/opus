  - id: n6
    cau: Nhóm Thế kỷ 20 gồm Debussy, Ravel, Stravinsky, Shostakovich; nhóm Đương đại gồm Reich và Glass, Pärt.
    loai: danh-muc
    nguon:
      - jones-9.12
      - cod-ravel
      - jones-10.6
      - jones-10.2
      - jones-11.9
      - jones-11.13
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: Jones xếp cả sáu vào chương 20th Century. Lệch với dữ liệu: src/data/nha-soan-nhac.yml xếp Pärt, Reich, Glass là "Đương đại" (hình periods cũng đặt Pärt ở Đương đại 2000–nay), còn trang gộp chung dưới "Thế kỷ 20". Người giao quyết định đổi tiêu đề nhóm hay đổi dữ liệu. Không sửa trang vì cả hai cách đều có nguồn. Review D5-gom: theo dữ liệu đã khóa: src/data/nha-soan-nhac.yml xếp part, reich, glass "Đương đại" (kiem-dinh/khoa.json: nha-soan-nhac/<id>#khoang,mat,sinh,ten,thoi_ky), hình periods đặt Pärt ở Đương đại. Trang thêm tiêu đề "## Đương đại" trước Reich và Glass (id mới duong-dai; id the-ky-20 giữ). Nguồn bậc 2 (Jones chương 11) xếp ba người trong chương "20th Century" theo năm sáng tác; nhãn thời kỳ là quy ước của site, theo dữ liệu. Bốn người còn lại ở Thế kỷ 20 khớp thoi_ky đã khóa.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/minimalism" ]
    luot_2_ghi_chu: Reich, Glass là nhà tối giản; việc xếp nhóm là quy ước của site (Pärt chưa mở nguồn).
  - id: n7
    cau: "Vivaldi: violin độc tấu điêu luyện; ritornello rõ ràng; nhạc miêu tả (chim, bão)."
