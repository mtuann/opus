khuong_nhac: []
ghi_chu: 'Trang không có năm sinh–mất. Thuật ngữ chưa có hồ sơ riêng (D3-L5 kiểm): tintinnabuli, leitmotif, hemiola, planing (hợp âm trượt), ostinato, hợp âm ghép, chromatic mediant, sforzando, rubato. Lệch cần người giao quyết: Reich, Glass, Pärt xếp dưới "Thế kỷ 20" trên trang, trong khi src/data/nha-soan-nhac.yml ghi "Đương đại" (xem n6). Beethoven ghi "Cổ điển/Lãng mạn" trong dữ liệu, trang xếp Cổ điển. Phần lớn dòng nhà soạn nhạc đã viết lại theo mức nguồn nói (mỗi dòng một nhận định da-sua). Câu ve-site n52, n53 trỏ trang chưa chuyển, xem ghi_chu từng câu. Review D5-gom (nhóm D, 29/10/2026): đã quyết các nhận định chưa quyết (n6 tách nhóm Đương đại theo dữ liệu đã khóa; tên tác phẩm n28, n34, n35, n36, n40, n45 có nguồn IMSLP, NYPL và bản ghi tac-pham đã khóa); sửa n18 (Tchaikovsky), n23 (Shostakovich) theo Jones 8.9, 10.3.'
doi_chu:
  - cu: "Năng lượng dồn dập, hợp âm rải và gam chạy nhanh trên violin; ritornello rõ ràng; nhiều chuỗi đi xuống; nhạc miêu tả (chim, bão). Kiểm chứng: Bốn Mùa."
    moi: "Violin độc tấu điêu luyện; ritornello rõ ràng; nhạc miêu tả (chim, bão). Kiểm chứng: Bốn Mùa."
    ly_do: "n7: bỏ ý không có nguồn."
  - cu: 'Phức điệu dày đặc: luôn có nhiều bè độc lập cùng chuyển động; bè trầm có giai điệu riêng; hòa âm phong phú, nhiều nốt treo; mọi chi tiết đều "có lý". Kiểm chứng: Brandenburg Concerto, Fugue BWV 847.'
    moi: "Phức điệu: nhiều bè độc lập cùng chuyển động, nhất là trong fugue; viết nhiều cho organ và harpsichord, những nhạc cụ hợp với đối âm. Kiểm chứng: Brandenburg Concerto, Fugue BWV 847."
    ly_do: "n8: bỏ ý không có nguồn."
  - cu: "Kết cấu đơn giản và rộng rãi hơn Bach; hợp xướng hùng tráng với những khối hợp âm lớn xen phức điệu; giai điệu dễ nhớ, kịch tính sân khấu. Kiểm chứng: Messiah, Hallelujah."
    moi: "Nhiều hợp xướng (oratorio) và dùng cùng phong cách với opera của ông; trong hợp xướng, kết cấu chuyển giữa chủ điệu và phức điệu. Kiểm chứng: Messiah, Hallelujah."
    ly_do: "n9: theo Clark 4.5."
  - cu: "Hóm hỉnh: dừng đột ngột, im lặng bất ngờ, kết giả; phát triển chủ đề rất chặt từ một ý nhỏ; nhiều chất dân gian. Kiểm chứng: Giao hưởng số 94."
    moi: 'Hóm hỉnh: bất ngờ (như hợp âm to đột ngột trong "Surprise"), kết giả; xây cấu trúc lớn từ những môtip ngắn, đơn giản; hay dùng chất dân gian. Kiểm chứng: Giao hưởng số 94.'
    ly_do: "n10: theo Kuznetsova 13.06 và COD."
  - cu: 'Giai điệu ca hát tự nhiên như opera; câu nhạc cân đối hoàn hảo; bè đệm Alberti; chuyển sắc trưởng – thứ trong chớp mắt; "dễ mà khó". Kiểm chứng: Giao hưởng số 40, Sonata K. 545.'
    moi: "Cảm giác về hình thức và sự cân đối; bề ngoài rạng rỡ, vui nhưng có mạch u sầu bên dưới; nhạc opera nới rộng nghệ thuật của ca sĩ; đệm Alberti, như đầu Sonata K. 545. Kiểm chứng: Giao hưởng số 40, Sonata K. 545."
    ly_do: "n11: theo COD và bản nhạc K. 545."
  - cu: "Môtip ngắn phát triển không ngừng (xem bài 30); sforzando nhấn bất ngờ; tương phản dữ dội; coda dài như phần phát triển thứ hai; cảm giác đấu tranh rồi chiến thắng. Kiểm chứng: Giao hưởng số 5."
    moi: 'Phát triển một ý nhạc nhỏ qua nhiều biến đổi (xem bài 30), như phân mảnh chủ đề trong Giao hưởng số 5; dùng nhiều sforzando; coda mở rộng thành cao trào; các tác phẩm giai đoạn giữa thường được gọi là "anh hùng", thể hiện đấu tranh. Kiểm chứng: Giao hưởng số 5.'
    ly_do: "n12: theo Kuznetsova 15.05, Listen 8e."
  - cu: 'Giai điệu hát vô tận; chuyển đột ngột giữa trưởng và thứ trên cùng chủ âm; chuyển giọng sang giọng cách quãng 3; lặp lại dài, "trời đất rộng". Kiểm chứng: Con cá hồi.'
    moi: "Giai điệu hát hơi dài; cách chuyển giọng độc đáo, hay dùng quan hệ quãng 3 nửa cung (chromatic mediant) giữa các hợp âm. Kiểm chứng: Con cá hồi."
    ly_do: "n13: theo Jones 6.16, Kopp, OMT."
  - cu: "Gần như chỉ viết cho piano; giai điệu như giọng hát bel canto với nhiều trang trí; tay trái rải rộng; rubato; điệu nhảy Ba Lan (mazurka, polonaise). Kiểm chứng: Nocturne Op. 9 số 2."
    moi: "Chủ yếu viết cho piano (mọi tác phẩm đều có piano); rubato là một phần lối chơi của ông; điệu nhảy Ba Lan (mazurka, polonaise) và nocturne. Kiểm chứng: Nocturne Op. 9 số 2."
    ly_do: "n14: theo Jones 6.4 và COD."
  - cu: "Kỹ thuật piano phô diễn: quãng 8 liên tiếp, chuỗi nốt khắp bàn phím; giai điệu ở giữa, trang trí bao quanh; chuyển đổi chủ đề (một giai điệu biến hình thành nhiều tính cách). Kiểm chứng: Liebestraum số 3."
    moi: "Kỹ thuật piano phô diễn; chuyển đổi chủ đề: dùng lại một chủ đề ở nhiều phần với tính cách khác nhau để thống nhất tác phẩm; mở đầu thể loại thơ giao hưởng. Kiểm chứng: Liebestraum số 3."
    ly_do: "n15: theo Encyclopedia.com."
  - cu: "Âm nhạc liền mạch, gần như không bao giờ có kết trọn; hòa âm nửa cung căng thẳng kéo dài; dàn nhạc rất lớn, kèn đồng mạnh; leitmotif. Kiểm chứng: Tristan und Isolde, Khúc dạo đầu."
    moi: 'Âm nhạc liền mạch: "giai điệu bất tận" thay cho sự tách bạch giữa aria và recitative; hòa âm nửa cung dày đặc; dàn nhạc có vai trò và sức mạnh lớn hơn; leitmotif. Kiểm chứng: Tristan und Isolde, Khúc dạo đầu.'
    ly_do: "n16: theo Jones 7.1, Lumen."
  - cu: "Kết cấu dày, ấm, nhiều bè giữa; hemiola và nhịp chồng (xem bài 15); hình thức cổ điển chặt chẽ, nỗi buồn kìm nén. Kiểm chứng: Giao hưởng số 4."
    moi: 'Hình thức cổ điển chặt chẽ ("ý thức cổ điển về hình thức và trật tự"), bậc thầy đối âm; hay dùng hemiola và những xê dịch nhịp (xem bài 15). Kiểm chứng: Giao hưởng số 4.'
    ly_do: "n17: theo Clark 6.9, Jones 8.13."
  - cu: "Giai điệu lớn, dễ nhớ, cảm xúc dâng trào; chuỗi đi lên dẫn đến cao trào; kèn gỗ độc tấu trên nền dây; nhịp điệu ballet. Kiểm chứng: Hồ thiên nga."
    moi: "Giai điệu cuốn hút ngay, đầy cảm xúc; dây và kèn gỗ trao qua lại chất liệu (như trong Romeo và Juliet); viết nhạc ballet. Kiểm chứng: Hồ thiên nga."
    ly_do: 'n18: theo Jones 8.9.; n18 (da-sua, review D5-gom): Jones 8.9 không nói "dễ nhớ" và không nói hai bộ luân phiên giữ giai điệu.'
  - cu: "Chất dân gian Séc (và Mỹ); giai điệu ngũ cung; nhịp nhảy múa; phối khí trong sáng. Kiểm chứng: Giao hưởng số 9."
    moi: "Chất dân gian Séc (nhịp điệu của Moravia và Bohemia) và ảnh hưởng nhạc Mỹ (spiritual); giai điệu ngũ cung thời kỳ ở Mỹ. Kiểm chứng: Giao hưởng số 9."
    ly_do: "n19: theo Jones 8.11, 8.12."
  - cu: "Hợp âm trượt song song; gam toàn cung và ngũ cung; nhịp mơ hồ; rất nhỏ, như sương. Kiểm chứng: Clair de lune, Voiles và La cathédrale engloutie trong Préludes, Prélude à l'après-midi d'un faune."
    moi: "Hợp âm trượt song song; gam toàn cung và ngũ cung; chuyển giọng không chuẩn bị; hòa âm nhiều khi mơ hồ về giọng. Kiểm chứng: Clair de lune, Voiles và La cathédrale engloutie trong Préludes, Prélude à l'après-midi d'un faune."
    ly_do: "n20: bỏ ẩn dụ không có nguồn."
  - cu: "Phối khí sắc nét, chính xác như đồng hồ Thụy Sĩ; hòa âm 7 và 9 trong veo; ảnh hưởng điệu nhảy Tây Ban Nha và jazz. Kiểm chứng: Boléro."
    moi: 'Phối khí chính xác, tinh xảo (Stravinsky gọi ông là "thợ đồng hồ Thụy Sĩ"); hợp âm 9, có khi chạy song song; ảnh hưởng nhạc Tây Ban Nha, điệu nhảy và jazz. Kiểm chứng: Boléro.'
    ly_do: "n21: theo Encyclopedia.com."
  - cu: "Ostinato lặp lại với trọng âm dịch chuyển bất ngờ; đổi nhịp liên tục; các khối âm thanh cắt ghép đột ngột; đa điệu tính. Kiểm chứng: Le Sacre du printemps."
    moi: "Ostinato dồn dập, có khi nhiều ostinato va vào nhau; nhịp điệu vượt qua vạch nhịp, trọng âm bất ngờ; hợp âm ghép, đa điệu tính (Petrushka). Kiểm chứng: Le Sacre du printemps."
    ly_do: "n22: theo Jones 10.6, 10.7, Britannica."
  - cu: "Giai điệu dài, cô đơn ở violin hoặc kèn gỗ; hành khúc máy móc; châm biếm, valse méo mó; cao trào bị ép buộc. Kiểm chứng: Giao hưởng số 5."
    moi:
      - "Giai điệu dài, xen các đoạn độc tấu kèn gỗ (chương Largo của Giao hưởng số 5); chất châm biếm, kỳ quái và hành khúc; cuối Giao hưởng số 5 là sự lặp lại kéo dài, ám ảnh của Rê trưởng. Kiểm chứng: Giao hưởng số 5."
      - Đương đại
    ly_do: 'n23: theo Jones 10.2, 10.3.; n23 (da-sua, review D5-gom): Jones 10.3 nói giai điệu dài ở chương Largo, không nói violin; "extended and obsessive reiteration".'
  - cu: "Mẫu ngắn lặp lại, thay đổi rất chậm; Reich: lệch pha, tiết tấu đan nhau; Glass: hợp âm rải đều đặn, các khối lặp lại có đếm. Kiểm chứng: Reich Music for 18 Musicians, Glass Glassworks."
    moi: "Mẫu ngắn lặp lại, thay đổi rất chậm; Reich: hai mẫu giống nhau lệch pha dần (Piano Phase); Glass: quá trình cộng dồn (thêm một lần lặp, bớt nốt cuối). Kiểm chứng: Reich Music for 18 Musicians, Glass Glassworks."
    ly_do: "n24: theo Hutchinson 35.1, 35.2."
  - cu: "Tĩnh lặng, rất ít nốt; một bè đi theo gam, một bè theo hợp âm chủ như tiếng chuông (tintinnabuli). Kiểm chứng: Spiegel im Spiegel."
    moi: "Tĩnh lặng, giản dị: nốt đơn hoặc hợp âm ba, tempo chậm, âm thanh như tiếng chuông ngân (tintinnabuli). Kiểm chứng: Spiegel im Spiegel."
    ly_do: "n25: theo Britannica, Jones 11.13."
  - cu: Grove Music Online, mục từ về từng nhà soạn nhạc; Alex Ross, The Rest Is Noise (thế kỷ 20). Xem tài liệu tham khảo.
    moi:
      - "Clark và cộng sự, Understanding Music: Past and Present; Kuznetsova, Music Appreciation II; Jones, Music Appreciation I (giáo trình mở trên LibreTexts), các mục về từng nhà soạn nhạc."
      - The Concise Oxford Dictionary of Music (qua Encyclopedia.com), Encyclopaedia Britannica, Open Music Theory, Hutchinson (thế kỷ 20); bản nhạc Mutopia Project (Mozart, K. 545).
      - Xem tài liệu tham khảo.
    ly_do: "n51: Grove và Ross chưa mở, thay bằng nguồn đã đọc."
  - moi: "id: uong-ai"
    ly_do: 'n6 (da-sua, review D5-gom): thêm tiêu đề "## Đương đại" trước Reich, Glass, Pärt theo thoi_ky đã khóa trong nha-soan-nhac.yml.'
  - cu:
      - "câu hỏi: Hợp âm trượt song song, gam toàn cung, rất nhỏ. Tác giả có thể nhất là ai? | Wagner | ✓ Debussy | Vivaldi | Dấu vân tay ấn tượng."
      - "câu hỏi: Piano độc tấu, giai điệu như giọng hát có trang trí, tay trái rải rộng, rubato. Tác giả có thể nhất là ai? | ✓ Chopin | Bach | Stravinsky | Phong cách nocturne."
      - "câu hỏi: Âm nhạc liền mạch, hòa âm nửa cung căng thẳng mãi không có kết trọn, dàn nhạc rất lớn. Tác giả có thể nhất là ai? | Haydn | Pärt | ✓ Wagner | Như Khúc dạo đầu Tristan und Isolde."
    moi:
      - "câu hỏi: Hợp âm trượt song song, gam toàn cung, hòa âm nhiều khi mơ hồ về giọng. Tác giả có thể nhất là ai? | Wagner | ✓ Debussy | Vivaldi | Hợp âm trượt song song và gam toàn cung là dấu vân tay của Debussy."
      - "câu hỏi: Chủ yếu viết cho piano, hay dùng rubato, mazurka, polonaise và nocturne. Tác giả có thể nhất là ai? | ✓ Chopin | Bach | Stravinsky | Piano, rubato, điệu nhảy Ba Lan và nocturne là dấu hiệu của Chopin."
      - 'câu hỏi: Âm nhạc liền mạch như "giai điệu bất tận", hòa âm nửa cung dày đặc, leitmotif. Tác giả có thể nhất là ai? | Haydn | Pärt | ✓ Wagner | Giai điệu bất tận, leitmotif và hòa âm nửa cung là dấu hiệu của Wagner, như trong Tristan und Isolde.'
    ly_do: "n48: theo n20.; n48: giải thích nêu rõ dấu hiệu.; n49: theo n14.; n49: giải thích theo đề mới.; n50: theo n16.; n50: giải thích theo đề mới."
