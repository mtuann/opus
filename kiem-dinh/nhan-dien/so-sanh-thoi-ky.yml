nhan_dinh:
  - id: n1
    cau: Bảng đặt các thời kỳ cạnh nhau theo bảy yếu tố (link tới nhan-dien/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: bảng có 7 hàng (Biên chế, Kết cấu, Giai điệu, Hòa âm, Tiết tấu, Sắc thái, Hình thức); src/content/docs/nhan-dien/index.md (cùng worktree, phần B) cũng nói "7 yếu tố". Review: đã kiểm trang (bảng 7 hàng) và src/content/docs/nhan-dien/index.md dòng 13 và 28 ("7 yếu tố").'
    review: dung
  - id: n2
    cau: Mỗi thời kỳ có ví dụ minh họa ngắn, do site viết theo đặc trưng của thời kỳ, không phải trích tác phẩm thật.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang và src/scripts/nhan-dien.js: VI_DU có 10 đoạn, hai đoạn cho mỗi thời kỳ (baroque, classical, romantic, impressionist, modern); trang có đúng 10 dòng ::cong-cu{ten="style-example"}; đoạn nào cũng là mã ABC soạn riêng. Review: đã kiểm VI_DU (10 đoạn, 2 mỗi thời kỳ), trang có 10 dòng ::cong-cu style-example, bản xem dist/nhan-dien/so-sanh-thoi-ky có đủ 10 data-vd và 10 dòng "Dấu hiệu:".'
    review: dung
  - id: n3
    cau: "Hình thời kỳ: Trung cổ ~500–1400; Phục hưng ~1400–1600; Baroque ~1600–1750; Cổ điển ~1750–1820; Lãng mạn ~1820–1900; Thế kỷ 20 ~1900–2000; Đương đại 2000–nay."
    loai: nam
    nguon:
      - cod-baroque
    ket_qua: dung
    ghi_chu: 'Mốc là quy ước của site, khớp n1 của kiem-dinh/lich-su/thoi-ky/{trung-co,phuc-hung,baroque,co-dien,lang-man,the-ky-20}.yml (đã qua lượt 1) và lich-su/index. COD, Baroque: "from about 1600 to the deaths of Bach and Handel in 1750 and 1759". Hình là src/components/hinh/periods.html; chữ đã đọc cả 7 ô.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Baroque-music", "https://www.britannica.com/art/Western-music" ]
    luot_2_ghi_chu: "BAR: Baroque ~1600–1750; các mốc khác là quy ước thông dụng, chưa mở nguồn riêng cho từng mốc."
  - id: n4
    cau: "Hình xếp nhà soạn nhạc: Hildegard, Machaut (Trung cổ); Josquin, Palestrina (Phục hưng); Vivaldi, Bach, Handel (Baroque); Haydn, Mozart, Beethoven (Cổ điển); Chopin, Brahms, Tchaikovsky (Lãng mạn); Debussy, Stravinsky (Thế kỷ 20); Pärt, Adams, Shaw (Đương đại)."
    loai: danh-muc
    nguon:
      - lt-4.4
      - kuz-13.1
      - jones-6.4
      - jones-8.13
      - jones-8.9
      - jones-9.12
      - jones-10.6
      - jones-11.13
    ket_qua: dung
    ghi_chu: 'chưa chắc: khớp src/data/nha-soan-nhac.yml (thoi_ky của các nhà soạn nhạc trong hình đều trùng nhãn hình; Beethoven ghi "Cổ điển/Lãng mạn"). Nguồn mở đọc được: Clark 4.4 (Vivaldi, Bach, Handel là Baroque), Jones chương 6, 8, 9, 10 (Chopin Early Romantic; Brahms, Tchaikovsky Late Romantic; Debussy, Stravinsky thế kỷ 20). Chưa mở nguồn cho Hildegard, Machaut, Josquin, Palestrina, Adams, Shaw. Lệch cần người giao quyết: Jones 11.13 đặt Pärt trong chương "20th Century" (tối giản), còn hình và dữ liệu xếp Pärt vào Đương đại (2000–nay); trang dau-van-tay lại xếp Pärt, Reich, Glass dưới "Thế kỷ 20". Hình không ghi năm sinh–mất nên không có gì để đối chiếu năm. Review D5-gom: chữ trong hình (src/components/hinh/periods.html, đã đọc) khớp trường thoi_ky đã khóa của 18 bản ghi nha-soan-nhac (kiem-dinh/khoa.json, nha-soan-nhac/<id>#khoang,mat,sinh,ten,thoi_ky; nguồn ở kiem-dinh/du-lieu/nha-soan-nhac/); Beethoven dữ liệu ghi "Cổ điển/Lãng mạn", hình đặt ở Cổ điển (vế đầu). Pärt ở Đương đại theo dữ liệu đã khóa; trang dau-van-tay đã tách nhóm Đương đại cho khớp. Hình còn dùng ở lich-su/index (chưa khóa, nhóm A/B của nhánh gom): không sửa hình.'
