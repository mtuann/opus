      - clark-6.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ngắn, cân đối 4 + 4, dễ hát". Kuz 13.01: "Melodies tended to be shorter than those of baroque music, with clear-cut phrases and clearly marked cadences"; Clark 6.2: giai điệu Lãng mạn "even more songlike than classical style melodies" (hàm ý Cổ điển đã hát được). Bỏ "4 + 4" cho khớp co-dien.yml n14 (câu thường dài 4 hay 8 ô nhịp). Review D5-gom: mở lại Kuznetsova 13.01: "Melodies tended to be shorter than those of baroque music, with clear-cut phrases and clearly marked cadences"; Clark 6.2: giai điệu thế kỷ 19 "even more songlike than classical style melodies". Giữ.'
