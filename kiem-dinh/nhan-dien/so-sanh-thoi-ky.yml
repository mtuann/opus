  - cu: 'Beethoven vẫn giữ hình thức rõ ràng và phát triển môtip chặt chẽ; Schubert, Chopin hát dài hơn, hòa âm nhiều màu hơn. Ranh giới thật sự mờ: đừng ngại trả lời "giao thời".'
    moi: 'Beethoven phát triển môtip rất khéo léo; Schubert viết giai điệu hát dài, chuyển giọng độc đáo. Ranh giới thật sự mờ: đừng ngại trả lời "giao thời".'
