    ghi_chu: 'CẦN SỬA TRONG src/scripts/nhan-dien.js (người giao, không sửa tệp này): chữ cũ "Hai hợp âm khác giọng chồng lên nhau (đa điệu tính, kiểu Stravinsky)" → chữ mới như trên. Lý do: tay phải [_E G _B _d] = Mi♭7, tay trái [_F,, _A,, _C,] = Fa♭ trưởng: đúng hợp âm Le Sacre mà Hutchinson 32.4 mô tả ("an E♭7 sounding over an F♭ major chord in the Dance of the Adolescents"). Hutchinson gọi đó là polychord ("two triads sounding simultaneously"), không gọi là đa điệu tính; Britannica chỉ nêu Petrushka (Đô trưởng + Fa♯ trưởng) cho đa điệu tính. Thuật ngữ polychord (hợp âm ghép) cần kiểm có trong thuat-ngu.yml chưa: ghi cho D3-L5. Review D5-gom: lượt 2 không đọc được mã ABC; review kiểm trên mã thật trong src/scripts/nhan-dien.js (VI_DU) bằng nhạc lý: tay phải [_EG_B_d] = Mi♭ – Sol – Si♭ – Rê♭ (Mi♭7), tay trái [_F,,_A,,_C,] = Fa♭ – La♭ – Đô♭ (Fa♭ trưởng). Hutchinson 32.4 (đã mở): polychord "two triads sounding simultaneously", ví dụ "an E♭7 chord sounding over an F♭ major chord" ở Dance of the Adolescents. Đúng.'
