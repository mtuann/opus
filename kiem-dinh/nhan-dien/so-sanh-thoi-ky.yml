  - id: n22
    cau: "Giai điệu Lãng mạn: dài, hát, bước nhảy rộng, cảm xúc mạnh."
    loai: cau-truc
    nguon:
      - clark-6.2
      - jones-6.16
      - cod-rom
    ket_qua: dung
    ghi_chu: 'Clark 6.2: "even more songlike", bước nhảy rộng hơn ("wider leaps"); Jones 6.16: Schubert "long-breathed Romantic melody"; COD, Romanticism: "emotional and picturesque expression". Lưu ý lang-man.yml n10 đã bỏ dòng "giai điệu dài, hát, đầy cảm xúc" khỏi trang Lãng mạn vì giai điệu hát cũng có ở thời khác; ô này là so sánh giữa các thời kỳ nên giữ, người giao cân nhắc cho thống nhất. Review D5-gom: mở lại Clark 6.2: "perhaps even more songlike than classical style melodies", "may contain wider leaps"; Jones 6.16: Schubert "long-breathed Romantic melody". Giữ ô (so sánh giữa các thời kỳ); lệch với lang-man.yml n10 ghi cho nhóm A/B.'
