  - cu: Nhạc phim Hollywood thừa hưởng trực tiếp ngôn ngữ của Wagner, Tchaikovsky, Rachmaninoff. Nếu bạn nghe "như nhạc phim", rất có thể đó là Lãng mạn muộn.
    moi: Nhạc phim Hollywood thời đầu thừa hưởng ngôn ngữ của nhạc Lãng mạn thế kỷ 19, như cách Max Steiner dùng leitmotif theo Wagner. Nếu bạn nghe "như nhạc phim", rất có thể đó là Lãng mạn muộn.
    ly_do: "x6a (da-sua): Prince George's 13.2; Tchaikovsky, Rachmaninoff không có trong nguồn."
  - cu: 'Hai thời kỳ này ít gặp trên radio nhưng dễ nhận ra: chủ yếu là giọng hát, không có (hoặc rất ít) nhạc cụ, không có nhịp mạnh rõ ràng, hòa âm "rỗng" với nhiều quãng 5 và quãng 8 (Trung cổ) hoặc êm và trong với các bè đan nhau đều đặn (Phục hưng). Xem Trung cổ và Phục hưng.'
    moi: "Hai thời kỳ này ít gặp trên radio nhưng dễ nhận ra: chủ yếu là giọng hát, phần lớn không có nhạc cụ đệm, và không có nhịp mạnh rõ ràng. Trung cổ: thánh ca một dòng giai điệu, nhịp tự do như lời nói; về sau thêm các bè song song (organum). Phục hưng: nhiều bè đan nhau theo lối mô phỏng, nhịp êm, nhiều quãng ba và hợp âm ba. Xem Trung cổ và Phục hưng."
    ly_do: "p1, p2, p3 (da-sua): COD Plainsong, COD Organum, Clark 3.2."
  - cu:
      - Craig Wright, Listening to Music, các chương về đặc trưng phong cách từng thời kỳ.
      - Burkholder, Grout, Palisca, A History of Western Music. Xem tài liệu tham khảo.
    moi:
      - Mốc năm là quy ước của site, thống nhất với các trang thời kỳ trong Lịch sử.
      - "Clark và cộng sự, Understanding Music: Past and Present (giáo trình mở), chương 3, 4, 6 và 7; Kuznetsova, Music Appreciation II, chương 13 và 15; Jones, Music Appreciation I (LibreTexts), chương 2, 6, 8, 9, 10, 11; Prince George's Community College, Music Appreciation: A Topical Approach (LibreTexts), mục 6.2 và 13.2."
      - Hutchinson, Music Theory for the 21st-Century Classroom, các mục Impressionism, Polychords, Additive Minimalism, Phase Shifting; Open Music Theory (Texture, Sequences, Mediants, Collections).
      - The Concise Oxford Dictionary of Music qua Encyclopedia.com (Baroque, Plainsong, Organum, Orchestra, Chromaticism, Impressionism, Minimalism, Rubato, Alberti bass và các mục khác); Encyclopaedia Britannica (Impressionism, whole-tone scale, polytonality, canon). Xem tài liệu tham khảo.
    ly_do: "s1 (da-sua): thay hai sách in không mở được bằng nguồn đã mở.; n99 (da-sua, review D5-gom): thêm nguồn review đã dùng (Clark 7.1, Prince George's 6.2) và Prince George's 13.2 lượt 1 đã dùng."
