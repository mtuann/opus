khuong_nhac: []
ghi_chu: 'Trang So sánh các thời kỳ (tầng lõi): hình ::hinh{ten="periods"}, bảng 35 ô, 10 ví dụ ::cong-cu{ten="style-example"}, mục dễ nhầm, mục Trước 1600. Nguồn chính: Clark chương 3, 4, 6; Kuznetsova 13, 15; Jones chương 2, 6, 8 đến 11; Hutchinson 32, 35; OMT; COD; Britannica. KHUÔNG NHẠC: trang không có khối abc nên khuong_nhac để trống; 10 đoạn ABC nằm trong src/scripts/nhan-dien.js (VI_DU, loại vi-du-soan), đã đối chiếu từng nốt, ghi ở các nhận định b1a đến m2c (id dạng n*, câu bắt đầu bằng tên đoạn). CHỮ TRONG CÔNG CỤ: dau_hieu của 10 đoạn ghi ở đây; luyen-nghe.yml dẫn lại. KHÔNG SỬA .js: các chỗ cần sửa đánh dấu "CẦN SỬA TRONG src/scripts/nhan-dien.js" (nhận định của baroque-1 móc đơn, classical-1 Alberti và I–IV–V, romantic-2 hai dòng, impressionist-1 planing, modern-1 ô 5–6, modern-2 hai dòng): người giao sửa JS và kiểm thử, rồi các nhận định ấy thành đúng nguyên. Năm sinh–mất nhà soạn nhạc: trang không ghi năm nào; hình periods chỉ có mốc thời kỳ và tên (thoi_ky khớp src/data/nha-soan-nhac.yml). Điều lô trước yêu cầu giữ (grep "nhan-dien/" kiem-dinh/): lich-su/thoi-ky/{baroque,co-dien,lang-man,the-ky-20}.yml trỏ tới trang này (link và bảng so sánh): còn nguyên, khớp; nhac-ly/28 và 29 trỏ tới luyen-nghe và so-sánh: xem luyen-nghe.yml. Lệch cần người giao quyết: (1) baroque.yml n15 đã bỏ "nhịp đều, cỗ máy" nhưng Clark 4.2 nói "motor rhythm" (r5b, b1b); (2) lang-man.yml n10 bỏ "giai điệu dài, hát" nhưng ô Lãng mạn của bảng giữ (r3l); (3) Reich, Glass, Pärt: Thế kỷ 20 hay Đương đại (f2; trang dau-van-tay); (4) hình periods Thế kỷ 20 ~1900–2000 nhưng bảng ghi "từ ~1910" (h5, đã sửa theo hình). Các ô để null (chưa chắc): kết cấu Lãng mạn và Ấn tượng, giai điệu thế kỷ 20, tiết tấu Ấn tượng, sắc thái Ấn tượng và thế kỷ 20, mục "Beethoven/Schubert, Chopin", "Lãng mạn muộn", "Debussy thời trẻ", hình f2 (người giao quyết giữ hay bỏ; chưa sửa trang). Thuật ngữ chưa có hay cần kiểm trong thuat-ngu.yml (ghi cho D3-L5): vô điệu tính, hợp âm ghép (polychord), planing (hợp âm trượt song song), ostinato, ritornello, sforzando, hemiola, trill, leitmotif. Review D5-gom (nhóm D, 29/10/2026): các chỗ "CẦN SỬA TRONG src/scripts/nhan-dien.js" ở trên đã được sửa ở lô D5-L3 (mã và chữ khớp đề nghị, trừ romantic-2 bỏ phần "(hợp âm chung một nốt)"); review sửa thêm romantic-1 (bỏ "hợp âm mượn", đoạn ở La thứ) và modern-1 (bỏ "quá trình cộng dồn"), DA_SUA trong tests/nhan-dien.test.mjs cập nhật, node --test tests/nhan-dien.test.mjs đạt (kiểm thử gồm mười mã ABC không cảnh báo, đủ ô). Mười ô bảng chưa quyết đã quyết (n17, n18, n24, n33, n38, n39, n85, n87, n88). Lệch (1) baroque n15: Clark 4.2 "motor rhythm" (review đã mở) ủng hộ; (2) lang-man n10 và n20 (hợp âm mượn của cùng đoạn ABC): ghi cho nhóm A/B; (3) Pärt, Reich, Glass: dau-van-tay tách nhóm Đương đại theo dữ liệu đã khóa. Hình periods không sửa (còn dùng ở lich-su/index).'
