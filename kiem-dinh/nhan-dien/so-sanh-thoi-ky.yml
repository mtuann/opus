  - cu: 'Hai thời kỳ này ít gặp trên radio nhưng dễ nhận ra: chủ yếu là giọng hát, không có (hoặc rất ít) nhạc cụ, không có nhịp mạnh rõ ràng, hòa âm "rỗng" với nhiều quãng 5 và quãng 8 (Trung cổ) hoặc êm và trong với các bè đan nhau đều đặn (Phục hưng). Xem Trung cổ và Phục hưng.'
    moi: "Hai thời kỳ này ít gặp trên radio nhưng dễ nhận ra: chủ yếu là giọng hát, phần lớn không có nhạc cụ đệm, và không có nhịp mạnh rõ ràng. Trung cổ: thánh ca một dòng giai điệu, nhịp tự do như lời nói; về sau thêm các bè song song (organum). Phục hưng: nhiều bè đan nhau theo lối mô phỏng, nhịp êm, nhiều quãng ba và hợp âm ba. Xem Trung cổ và Phục hưng."
