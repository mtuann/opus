    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "...; kèn trumpet sáng". Bỏ "sáng": Clark 4.4 chỉ nói trumpet thời này không van, "extremely difficult to play", không nói âm sắc. Dàn nhỏ: Clark 4.4 "a smaller ensemble than the later orchestra", họ violin là "backbone"; harpsichord: "almost always accompanied by harpsichord"; organ: Clark 4.2 "such as the organ, harpsichord or clavichord"; trumpet: Wisconsin 3 liệt kê trumpet trong dàn nhạc. Review D5-gom: mở lại Clark 4.2: "the organ, harpsichord or clavichord"; các trích Clark 4.4, Wisconsin 3 của lượt 1 là nguyên văn, cụ thể. Lượt 2 không mở được trang; giữ.'
