nhan_dinh:
  - id: n1
    cau: Bảng đặt các thời kỳ cạnh nhau theo bảy yếu tố (link tới nhan-dien/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: bảng có 7 hàng (Biên chế, Kết cấu, Giai điệu, Hòa âm, Tiết tấu, Sắc thái, Hình thức); src/content/docs/nhan-dien/index.md (cùng worktree, phần B) cũng nói "7 yếu tố".'
  - id: n2
    cau: Mỗi thời kỳ có ví dụ minh họa ngắn, do site viết theo đặc trưng của thời kỳ, không phải trích tác phẩm thật.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang và src/scripts/nhan-dien.js: VI_DU có 10 đoạn, hai đoạn cho mỗi thời kỳ (baroque, classical, romantic, impressionist, modern); trang có đúng 10 dòng ::cong-cu{ten="style-example"}; đoạn nào cũng là mã ABC soạn riêng.'
  - id: n3
    cau: "Hình thời kỳ: Trung cổ ~500–1400; Phục hưng ~1400–1600; Baroque ~1600–1750; Cổ điển ~1750–1820; Lãng mạn ~1820–1900; Thế kỷ 20 ~1900–2000; Đương đại 2000–nay."
    loai: nam
    nguon:
      - cod-baroque
    ket_qua: dung
    ghi_chu: 'Mốc là quy ước của site, khớp n1 của kiem-dinh/lich-su/thoi-ky/{trung-co,phuc-hung,baroque,co-dien,lang-man,the-ky-20}.yml (đã qua lượt 1) và lich-su/index. COD, Baroque: "from about 1600 to the deaths of Bach and Handel in 1750 and 1759". Hình là src/components/hinh/periods.html; chữ đã đọc cả 7 ô.'
  - id: n4
    cau: "Hình xếp nhà soạn nhạc: Hildegard, Machaut (Trung cổ); Josquin, Palestrina (Phục hưng); Vivaldi, Bach, Handel (Baroque); Haydn, Mozart, Beethoven (Cổ điển); Chopin, Brahms, Tchaikovsky (Lãng mạn); Debussy, Stravinsky (Thế kỷ 20); Pärt, Adams, Shaw (Đương đại)."
    loai: danh-muc
    nguon:
      - lt-4.4
      - kuz-13.1
      - jones-6.4
      - jones-8.13
      - jones-8.9
      - jones-9.12
      - jones-10.6
      - jones-11.13
    ket_qua: null
    ghi_chu: 'chưa chắc: khớp src/data/nha-soan-nhac.yml (thoi_ky của các nhà soạn nhạc trong hình đều trùng nhãn hình; Beethoven ghi "Cổ điển/Lãng mạn"). Nguồn mở đọc được: Clark 4.4 (Vivaldi, Bach, Handel là Baroque), Jones chương 6, 8, 9, 10 (Chopin Early Romantic; Brahms, Tchaikovsky Late Romantic; Debussy, Stravinsky thế kỷ 20). Chưa mở nguồn cho Hildegard, Machaut, Josquin, Palestrina, Adams, Shaw. Lệch cần người giao quyết: Jones 11.13 đặt Pärt trong chương "20th Century" (tối giản), còn hình và dữ liệu xếp Pärt vào Đương đại (2000–nay); trang dau-van-tay lại xếp Pärt, Reich, Glass dưới "Thế kỷ 20". Hình không ghi năm sinh–mất nên không có gì để đối chiếu năm.'
  - id: n5
    cau: Baroque (~1600–1750)
    loai: nam
    nguon:
      - cod-baroque
    ket_qua: dung
    ghi_chu: "Mốc quy ước của site; COD: 1600 đến 1750/1759."
  - id: n6
    cau: Cổ điển (~1750–1820)
    loai: nam
    nguon:
      - kuz-13.1
    ket_qua: dung
    ghi_chu: Mốc quy ước của site, khớp kiem-dinh/lich-su/thoi-ky/co-dien.yml n1 (COD 1750–1830, Kuznetsova 1750–1820). Lượt này không đọc lại chỗ ghi năm ở Kuznetsova 13.01; dựa vào hồ sơ đã qua lượt 1.
  - id: n7
    cau: Lãng mạn (~1820–1900)
    loai: nam
    nguon:
      - cohen-4.10
    ket_qua: dung
    ghi_chu: 'Cohen 4.10: "Romantic (ca. 1820–1900)". Khớp lang-man.yml n1.'
  - id: n8
    cau: Ấn tượng (~1890–1920)
    loai: nam
    nguon:
      - jones-9.11
      - brit-imp
    ket_qua: dung
    ghi_chu: 'Mốc là quy ước của site. Britannica: do Debussy khởi xướng "at the end of the 19th century"; Jones 9.11: "arose in the late 19th century and continued into the middle of the 20th century" (rộng hơn mốc của site, không mâu thuẫn).'
  - id: n9
    cau: Thế kỷ 20 (~1900–2000)
    loai: nam
    nguon:
      - jones-9.10
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thế kỷ 20 (từ ~1910)". Đổi cho khớp mốc ~1900–2000 của hình periods, lich-su/thoi-ky/the-ky-20 (n1) và lich-su/index. Hàng Ấn tượng (~1890–1920) chồng lên mốc này vì Ấn tượng là một hướng trong thế kỷ 20 (nha-soan-nhac.yml xếp Debussy, Ravel vào "Thế kỷ 20").'
  - id: n10
    cau: "Biên chế Baroque: dàn dây nhỏ; harpsichord hoặc organ; kèn trumpet."
    loai: cau-truc
    nguon:
      - lt-4.4
      - lt-4.2
      - wisc-3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "...; kèn trumpet sáng". Bỏ "sáng": Clark 4.4 chỉ nói trumpet thời này không van, "extremely difficult to play", không nói âm sắc. Dàn nhỏ: Clark 4.4 "a smaller ensemble than the later orchestra", họ violin là "backbone"; harpsichord: "almost always accompanied by harpsichord"; organ: Clark 4.2 "such as the organ, harpsichord or clavichord"; trumpet: Wisconsin 3 liệt kê trumpet trong dàn nhạc.'
  - id: n11
    cau: "Biên chế Cổ điển: piano; dàn nhạc cỡ vừa, biên chế điển hình; tứ tấu đàn dây."
    loai: cau-truc
    nguon:
      - kuz-13.1
      - kuz-13.5
      - kuz-13.6
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dàn nhạc chuẩn cỡ vừa". Kuznetsova 13.05 chỉ nói "typical classical orchestra", "considerably smaller than the modern symphony orchestra", và chính các ví dụ (Beethoven 5 thêm piccolo, contrabassoon, 3 trombone) cho thấy biên chế không cố định; nên "điển hình" thay "chuẩn". Piano thay harpsichord: Kuz 13.01; tứ tấu: Kuz 13.06 (Haydn, "more justly" cha đẻ của tứ tấu).'
  - id: n12
    cau: "Biên chế Lãng mạn: dàn nhạc rất lớn, kèn đồng mạnh, nhiều bộ gõ; piano hiện đại."
    loai: cau-truc
    nguon:
      - cod-orch
      - clark-6.2
      - cohen-4.10
    ket_qua: dung
    ghi_chu: 'COD, Orchestra: "enlarged the orch. enormously", Berlioz "enlarged the woodwind, brass, and perc. departments", "Huge brass sections are often a feature of their scores". Clark 6.2: piano 88 phím, khung sắt, dải âm lượng rộng hơn; dàn nhạc có khi trên 100 người (Cohen: 80 trở lên).'
  - id: n13
    cau: "Biên chế Ấn tượng: chú trọng âm sắc của từng nhạc cụ."
    loai: cau-truc
    nguon:
      - brit-imp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Màu sắc nhạc cụ tinh tế: sáo, harp, celesta, dây có câm tiếng". Britannica chỉ nói "emphasis on instrumental timbres"; danh sách sáo, harp, celesta, dây có câm không có trong nguồn nào đã mở nên bỏ.'
  - id: n14
    cau: "Biên chế thế kỷ 20: rất đa dạng, từ dàn nhạc lớn với nhiều nhạc cụ gõ đến nhạc cụ điện tử."
    loai: cau-truc
    nguon:
      - jones-10.5
      - jones-10.7
      - jones-9.10
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mọi thứ: từ nhóm nhỏ khác thường đến dàn nhạc khổng lồ, nhạc cụ gõ, điện tử". Jones 10.5: Le Sacre "extensive use of percussion"; 10.7: "the largest orchestra Stravinsky ever employed"; 9.10: "magnetic tape, computers, synthesizers". Không nguồn nào mở nói về "nhóm nhỏ khác thường" nên bỏ.'
  - id: n15
    cau: "Kết cấu Baroque: nhiều phức điệu; bè trầm liên tục."
    loai: cau-truc
    nguon:
      - lt-4.2
      - wisc-3
    ket_qua: dung
    ghi_chu: 'Clark 4.2: "more elaborate techniques of imitative polyphony", basso continuo "a continuous bass line"; Wisconsin 3: "a continuous bass line".'
  - id: n16
    cau: "Kết cấu Cổ điển: chủ điệu, giai điệu rõ trên phần đệm."
    loai: cau-truc
    nguon:
      - kuz-13.1
      - omt-tex
    ket_qua: dung
    ghi_chu: 'Kuz 13.01: "mainly homophonic—melody above chordal accompaniment"; OMT Texture: "melody with accompaniment". Khớp bài 28 và co-dien.yml n12.'
  - id: n17
    cau: "Kết cấu Lãng mạn: chủ điệu, nhưng dày, nhiều lớp."
    loai: cau-truc
    ket_qua: null
    ghi_chu: 'chưa chắc: không nguồn đã mở nói về kết cấu Lãng mạn nói chung (Clark 6.2 chỉ nói âm sắc, âm lượng đa dạng hơn; Clark 6.9 nói một chương của Brahms "thicker"). Người giao quyết định giữ hay bỏ ô này.'
  - id: n18
    cau: "Kết cấu Ấn tượng: các lớp âm thanh như sương mù."
    loai: cau-truc
    ket_qua: null
    ghi_chu: 'chưa chắc: ẩn dụ, không nguồn nào mở nói về kết cấu Ấn tượng (Jones 9.11 chỉ nói "suggestion and atmosphere"). Người giao quyết định giữ hay bỏ.'
  - id: n19
    cau: "Kết cấu thế kỷ 20: rất đa dạng."
    loai: cau-truc
    nguon:
      - jones-9.10
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Rất đa dạng; có khi chỉ là các khối âm thanh". Jones 9.10: "unprecedented linguistic plurality of styles, techniques"; "các khối âm thanh" không có nguồn nên bỏ.'
  - id: n20
    cau: "Giai điệu Baroque: nhiều trang trí, nhiều chuỗi."
    loai: cau-truc
    nguon:
      - wisc-3
      - jones-2.38
      - mac-seq
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dài, liên tục, nhiều trang trí, chuỗi". Wisconsin 3: giai điệu "filled with all sorts of ornamentations and embellishments"; Listen 8e: sequence là "one easily recognized feature of Baroque melodies". Bỏ "dài, liên tục": Jones 2.38 nói giai điệu Baroque giữa kỳ "built from short, cadentially delimited ideas". Khớp baroque.yml n17 (nhiều trang trí).'
  - id: n21
    cau: "Giai điệu Cổ điển: ngắn, cân đối, phân câu rõ, dễ hát."
    loai: cau-truc
    nguon:
      - kuz-13.1
      - clark-6.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ngắn, cân đối 4 + 4, dễ hát". Kuz 13.01: "Melodies tended to be shorter than those of baroque music, with clear-cut phrases and clearly marked cadences"; Clark 6.2: giai điệu Lãng mạn "even more songlike than classical style melodies" (hàm ý Cổ điển đã hát được). Bỏ "4 + 4" cho khớp co-dien.yml n14 (câu thường dài 4 hay 8 ô nhịp).'
  - id: n22
    cau: "Giai điệu Lãng mạn: dài, hát, bước nhảy rộng, cảm xúc mạnh."
    loai: cau-truc
    nguon:
      - clark-6.2
      - jones-6.16
      - cod-rom
    ket_qua: dung
    ghi_chu: 'Clark 6.2: "even more songlike", bước nhảy rộng hơn ("wider leaps"); Jones 6.16: Schubert "long-breathed Romantic melody"; COD, Romanticism: "emotional and picturesque expression". Lưu ý lang-man.yml n10 đã bỏ dòng "giai điệu dài, hát, đầy cảm xúc" khỏi trang Lãng mạn vì giai điệu hát cũng có ở thời khác; ô này là so sánh giữa các thời kỳ nên giữ, người giao cân nhắc cho thống nhất.'
  - id: n23
    cau: "Giai điệu Ấn tượng: không hướng tới một đích rõ ràng; hay dùng gam ngũ cung và toàn cung."
    loai: cau-truc
    nguon:
      - brit-imp
      - jones-9.12
      - jones-9.11
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mơ hồ, ngắn, dùng gam ngũ cung và toàn cung". Britannica: "melodies that lack directed motion"; Jones 9.12 (theo Reti): dùng gam toàn cung và ngũ cung; Jones 9.11: gam toàn cung. Bỏ "ngắn": không nguồn.'
  - id: n24
    cau: "Giai điệu thế kỷ 20: có khi gãy gọn, góc cạnh; có khi gần như không có."
    loai: cau-truc
    ket_qua: null
    ghi_chu: "chưa chắc: không nguồn đã mở nói về giai điệu thế kỷ 20 nói chung. Người giao quyết định giữ hay bỏ."
  - id: n25
    cau: "Hòa âm Baroque: giọng trưởng – thứ và các chuỗi hợp âm được dùng ngày càng nhiều."
    loai: cau-truc
    nguon:
      - lt-4.2
      - cod-baroque
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trưởng – thứ rõ; chuỗi quãng 5". Khớp baroque.yml n14. Clark 4.2: "increased use of major and minor keys and chord progressions". "Chuỗi quãng 5" không có nguồn như đặc trưng của riêng Baroque: OMT Diatonic Sequences chỉ nói chuỗi giảm quãng 5 "quite common", không gắn thời kỳ.'
  - id: n26
    cau: "Hòa âm Cổ điển: rõ ràng, cấu trúc giọng dễ nghe, kết rõ."
    loai: cau-truc
    nguon:
      - kuz-13.1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đơn giản, rõ ràng, kết rõ". Kuz 13.01: "the tonal structure of a piece of music became more audible", "clearly marked cadences"; không nguồn nào mở nói hòa âm "đơn giản" (COD Alberti chỉ nói đệm Alberti "Simple (and often commonplace)").'
  - id: n27
    cau: "Hòa âm Lãng mạn: nhiều nửa cung, nốt nghịch được giữ rồi mới giải, chuyển giọng qua nhiều giọng."
    loai: cau-truc
    nguon:
      - cod-chrom
      - clark-6.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhiều nửa cung, chuyển giọng xa, hợp âm bảy giảm". COD, Chromaticism: Lãng mạn "explored chromaticism further because of need for emotional expression". Clark 6.2: "dissonances can be held before resolving", "multi-key modulations". Bỏ "hợp âm bảy giảm" (không nguồn nói là đặc trưng; ví dụ romantic-1 dùng một hợp âm bảy giảm là chuyện riêng của ví dụ).'
  - id: n28
    cau: "Hòa âm Ấn tượng: hợp âm trượt song song, hợp âm 9, 11, 13; nhiều khi mơ hồ về giọng."
    loai: cau-truc
    nguon:
      - hut-32.1
      - cod-imp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hợp âm trượt song song, hợp âm 9, không có kết rõ". Hutchinson 32.1: planing, hợp âm có nốt 9, 11, 13; COD, Impressionism: "parallel movement in a group of chords of triads, 7ths, and 9ths", hợp âm 9, 11, 13 thay hợp âm ba và bảy, "often ambiguous as to tonality". "Không có kết rõ" không có nguồn.'
  - id: n29
    cau: "Hòa âm thế kỷ 20: nghịch tai tự do; vô điệu tính; đa điệu tính; hoặc tĩnh tại (tối giản)."
    loai: cau-truc
    nguon:
      - jones-9.2
      - brit-poly
      - jones-11.9
      - cod-min
    ket_qua: dung
    ghi_chu: 'Jones 9.2: Schoenberg, "absence of traditional keys or tonal centers" và "Emancipator of Dissonance"; Britannica: đa điệu tính là "the simultaneous occurrence of two or more different tonalities or keys"; Jones 11.9: tối giản "consonant harmony", "stasis"; COD: "simple harmonic idiom". Thuật ngữ "vô điệu tính" cần kiểm có trong thuat-ngu.yml chưa (đa điệu tính đã có): ghi cho D3-L5.'
  - id: n30
    cau: "Tiết tấu Baroque: nhịp rõ và đều, phách được chia nhỏ liên tục."
    loai: cau-truc
    nguon:
      - lt-4.2
      - wisc-3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đều như máy, không ngừng". Clark 4.2: "Definite and regular rhythms in the form of meter and “motor rhythm” (the constant subdivision of the beat)"; Wisconsin 3: "tended to use the same general rhythmic patterns". Lệch với baroque.yml n15 (da-bo "nhịp đều, mạnh mẽ... cỗ máy"): lô đó không đọc câu này của Clark 4.2; câu mới ở mức nguồn nói, người giao cân nhắc cho trang Baroque khớp.'
  - id: n31
    cau: "Tiết tấu Cổ điển: rõ ràng, có tương phản giữa các phần."
    loai: cau-truc
    nguon:
      - kuz-13.1
    ket_qua: dung
    ghi_chu: 'Kuz 13.01: "characteristic rhythms", "It favored clearer divisions between parts, brighter contrasts", "Variety and contrast within a piece became more pronounced".'
  - id: n32
    cau: "Tiết tấu Lãng mạn: linh hoạt, rubato."
    loai: cau-truc
    nguon:
      - clark-6.2
      - cod-rub
    ket_qua: dung
    ghi_chu: 'Clark 6.2: "more rubato and tempo fluctuation within a composition"; COD, Rubato: "Robbed time". Khớp lang-man.yml n14; n15 của hồ sơ ấy để mở việc rubato có phải đặc trưng của Lãng mạn: Clark 6.2 nay nói tempo linh hoạt tăng ở thời kỳ này.'
  - id: n33
    cau: "Tiết tấu Ấn tượng: trôi nổi, khó cảm thấy phách."
    loai: cau-truc
    ket_qua: null
    ghi_chu: 'chưa chắc: Jones 9.11/9.12 và Hutchinson 32.1 không nói về nhịp; chỉ Britannica nói giai điệu "lack directed motion". Người giao quyết định giữ hay bỏ.'
  - id: n34
    cau: "Tiết tấu thế kỷ 20: thử nghiệm nhịp và trọng âm (trọng âm bất thường); hoặc lặp lại đều đặn (tối giản)."
    loai: cau-truc
    nguon:
      - jones-10.7
      - jones-10.6
      - jones-11.9
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trọng âm bất thường, đổi nhịp liên tục; hoặc lặp lại đều đặn (tối giản)". Jones 10.7: Le Sacre có "experiments in tonality, metre, rhythm, stress and dissonance"; Jones 10.6: "pushing the rhythms across the bar lines"; Jones 11.9: tối giản có "steady pulse". Bỏ "đổi nhịp liên tục": Jones 10.7 không nói.'
  - id: n35
    cau: "Sắc thái Baroque: to – nhỏ theo từng khối (đột ngột)."
    loai: cau-truc
    nguon:
      - lt-4.2
      - wisc-3
      - jones-2.38
    ket_qua: dung
    ghi_chu: 'Clark 4.2: "terraced dynamics"; Jones 2.38: "a sharp transition from loud to soft and back again"; Wisconsin 3: "sudden and dramatic changes in volume". Khớp baroque.yml n16.'
  - id: n36
    cau: "Sắc thái Cổ điển: crescendo, diminuendo, sforzando; tương phản trong tác phẩm."
    loai: cau-truc
    nguon:
      - kuz-13.1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Crescendo, diminuendo; tương phản trong câu". Kuz 13.01: "dynamics (using crescendo, diminuendo and sforzando)", "Variety and contrast within a piece became more pronounced"; nguồn nói "trong tác phẩm", không nói "trong câu". Khớp co-dien.yml n18.'
  - id: n37
    cau: "Sắc thái Lãng mạn: dải âm lượng rộng hơn trước, crescendo và decrescendo phổ biến hơn."
    loai: cau-truc
    nguon:
      - clark-6.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dải cực rộng, từ ppp đến fff". Clark 6.2: "more diverse registers, dynamic ranges, and timbres", "crescendos and decrescendos became more common". "Cực rộng, ppp đến fff" không nguồn; khớp lang-man.yml n16 (đã bỏ "dải âm lượng cực rộng").'
  - id: n38
    cau: "Sắc thái Ấn tượng: phần lớn rất nhỏ, tinh tế."
    loai: cau-truc
    ket_qua: null
    ghi_chu: "chưa chắc: không nguồn đã mở nói về sắc thái Ấn tượng (Jones 9.12 và Hutchinson 32.1 không nói). Ví dụ impressionist-1 dùng pp là chuyện riêng của ví dụ."
  - id: n39
    cau: "Sắc thái thế kỷ 20: cực đoan theo cả hai chiều."
    loai: cau-truc
    ket_qua: null
    ghi_chu: "chưa chắc: Jones 9.10 không nói về sắc thái."
  - id: n40
    cau: "Hình thức Baroque: fugue, ritornello, tổ khúc; một tâm trạng mỗi chương."
    loai: cau-truc
    nguon:
      - lt-4.2
      - wisc-3
    ket_qua: dung
    ghi_chu: 'Clark 4.2: "ritornello form and binary form", concerto, fugue, suite; Wisconsin 3: "An entire piece would reflect one mood" (nguồn nói "cả tác phẩm", ô nói "mỗi chương": cùng ý với các tác phẩm một chương).'
  - id: n41
    cau: "Hình thức Cổ điển: sonata, rondo, minuet; hai chủ đề tương phản."
    loai: cau-truc
    nguon:
      - kuz-13.1
      - wisc-4
      - cod-rondo
    ket_qua: dung
    ghi_chu: "Kuz 13.01: sonata form \"became the most important form\", minuet; COD, Rondo: \"By Mozart's day it was the usual form for the last movt. of a conc. or sonata\"; Wisconsin 4: \"the second theme contrasts the first in character, mood, and key\"."
  - id: n42
    cau: "Hình thức Lãng mạn: tự do; tiểu phẩm ngắn hoặc tác phẩm rất dài; âm nhạc chương trình."
    loai: cau-truc
    nguon:
      - cod-rom
      - clark-6.2
      - cohen-4.10
    ket_qua: dung
    ghi_chu: 'COD: biểu cảm "appeared to be more important than formal or structural considerations"; Clark 6.2: tiểu phẩm (Lied, piano) và tác phẩm lớn, "Program music became increasingly prominent"; Cohen: "short, intimate songs and piano miniatures", giao hưởng cho phòng hòa nhạc lớn, program symphony.'
  - id: n43
    cau: "Hình thức Ấn tượng: tránh các hình thức truyền thống; ưa hình thức ngắn (prelude, nocturne, arabesque)."
    loai: cau-truc
    nguon:
      - brit-imp
      - jones-9.11
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tự do, như những bức tranh". Britannica: "an avoidance of traditional musical form"; Jones 9.11: "favored short forms, including the nocturne, arabesque, and prelude". "Như những bức tranh" là ẩn dụ, bỏ.'
  - id: n44
    cau: "Hình thức thế kỷ 20: nhiều nhà soạn nhạc bỏ cấu trúc truyền thống của các thể loại."
    loai: cau-truc
    nguon:
      - jones-9.10
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mỗi tác phẩm tự tạo hình thức riêng". Jones 9.10: "abandoning the traditional structures of those genres"; "mỗi tác phẩm" quá mạnh (tân cổ điển quay lại hình thức cũ, xem the-ky-20.yml n16).'
