    ket_qua: dung
    ghi_chu: 'src/data/nha-soan-nhac.yml ghi Beethoven "Cổ điển/Lãng mạn"; lang-man.yml n1: Jones/Kuznetsova đặt ranh giới quanh 1815. Kuz 15.5 chia Beethoven thành giai đoạn đầu, giữa, cuối.'
  - id: n85
    cau: Beethoven vẫn giữ hình thức rõ ràng và phát triển môtip chặt chẽ; Schubert, Chopin hát dài hơn, hòa âm nhiều màu hơn.
