    ghi_chu: 'CẦN SỬA TRONG src/scripts/nhan-dien.js (người giao, không sửa tệp này): chữ cũ "Trọng âm rơi vào những chỗ không đoán trước, không theo phách mạnh" → chữ mới như trên. Lý do: dấu nhấn !>! ở vị trí 1 và 4 (ô 2), 2 (ô 3), 3 (ô 4) của bốn móc; ô 2 nhấn ngay phách đầu, nên "không theo phách mạnh" không đúng hoàn toàn. Jones 10.7: Le Sacre "experiments in... metre, rhythm, stress".'
  - id: n83
    cau: "Baroque và Cổ điển: nghe bè trầm (Baroque có bè trầm chơi suốt tác phẩm, Cổ điển thường lặp một hình đệm như đệm Alberti); nhạc cụ phím (harpsichord gợi Baroque, piano gợi Cổ điển); câu nhạc (Cổ điển có chỗ ngắt hơi rõ, thường sau 4 hay 8 ô nhịp)."
    loai: cau-truc
    nguon:
      - lt-4.2
      - wisc-3
      - kuz-13.1
      - cod-alb
      - lt-4.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Baroque đi liên tục, đều đặn; Cổ điển thường đứng yên hoặc lặp hình đệm... harpsichord gần như chắc chắn là Baroque... ngắt hơi rõ sau mỗi 4 ô nhịp". Bè trầm: Clark 4.2, Wisconsin 3 ("a continuous bass line"); Alberti: Kuz 13.01, COD; harpsichord: Clark 4.4 "almost always accompanied by harpsichord", Kuz 13.01 (piano thay harpsichord); "đứng yên" không nguồn nên bỏ; "mỗi 4 ô" đổi 4 hay 8 cho khớp co-dien.yml n14 và Kuz 13.01 ("clear-cut phrases and clearly marked cadences").'
  - id: n84
    cau: 'Cổ điển muộn (Beethoven) và Lãng mạn sớm: ranh giới thật sự mờ, đừng ngại trả lời "giao thời".'
