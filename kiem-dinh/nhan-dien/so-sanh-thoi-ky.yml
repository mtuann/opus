    moi: 'Lãng mạn: giai điệu hát rõ ràng, nốt nghịch được giữ lâu rồi mới giải quyết. Ấn tượng: không có "đường đi" rõ, hợp âm trượt song song, không khí hơn là cảm xúc. Debussy thời trẻ ở giữa hai bên.'
