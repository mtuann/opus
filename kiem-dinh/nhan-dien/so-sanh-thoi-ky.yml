    ghi_chu: 'Chữ cũ: "dàn nhạc chuẩn cỡ vừa". Kuznetsova 13.05 chỉ nói "typical classical orchestra", "considerably smaller than the modern symphony orchestra", và chính các ví dụ (Beethoven 5 thêm piccolo, contrabassoon, 3 trombone) cho thấy biên chế không cố định; nên "điển hình" thay "chuẩn". Piano thay harpsichord: Kuz 13.01; tứ tấu: Kuz 13.06 (Haydn, "more justly" cha đẻ của tứ tấu). Review D5-gom: mở lại Kuznetsova 13.01: piano (fortepiano) thay harpsichord; Kuznetsova 13.06: Haydn "Father of the String Quartet". Giữ.'
    luot_2: khong-chac
