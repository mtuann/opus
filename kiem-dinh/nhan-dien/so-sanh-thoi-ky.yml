      - clark-6.2
      - cohen-4.10
    ket_qua: dung
    ghi_chu: 'COD, Orchestra: "enlarged the orch. enormously", Berlioz "enlarged the woodwind, brass, and perc. departments", "Huge brass sections are often a feature of their scores". Clark 6.2: piano 88 phím, khung sắt, dải âm lượng rộng hơn; dàn nhạc có khi trên 100 người (Cohen: 80 trở lên). Review D5-gom: mở lại Clark 6.2: "Orchestras also increased in size and became more diverse in makeup", "over fifty (and sometimes over 100) musicians", piano "full eighty-eight-note keyboard", khung sắt. Vế kèn đồng, bộ gõ theo COD Orchestra (lượt 1 trích nguyên văn). Giữ.'
