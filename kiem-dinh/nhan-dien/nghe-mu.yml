nhan_dinh:
- id: n1
  cau: Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Định nghĩa cách luyện của site (tên gọi một cách tập), không phải thuật ngữ cần nguồn.
- id: n2
  cau: Cách này cho biết bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin về bài.
  loai: khuyen-tap
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là cách duy nhất để kiểm tra xem bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin." "Duy nhất" là nói quá, không kiểm được; viết lại (cả mô tả trang). Ghi doi_chu.'
- id: n3
  cau: 'Trang này có hai công cụ: một bộ 10 bản thu thật để luyện, và một phiếu ghi cho bản thu của riêng bạn.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm trang (::cong-cu{ten="blind"}, ::cong-cu{ten="blind-log"}) và src/scripts/nghe-mu.js: BAN_THU có 10 bản. Giữ đúng điều nhan-dien/index.yml i6 và so-sanh-thoi-ky.yml ghi cho trang này (10 bản thu, tên ẩn, phiếu).'
- id: n4
  cau: Các bản thu dưới đây lấy từ Wikimedia Commons, đều có giấy phép mở (Creative Commons, EFF Open Audio License hoặc phạm vi công cộng).
  loai: so-lieu
  nguon:
  - c-t1
  - c-t2
  - c-t3
  - c-t4
  - c-t5
  - c-t6
  - c-t7
  - c-t8
  - c-t9
  - c-t10
  ket_qua: dung
  ghi_chu: 'Mười trang tệp (đọc wikitext và extmetadata qua API Commons ngày 05/11/2026): t1, t4, t5, t7 CC BY-SA 2.0 (gốc EFF OAL, tương đương CC BY-SA 2.0); t2 CC BY 2.0; t3 CC BY-SA 1.0+; t6 EFF Open Audio License (OAL-1); t8 PD-self và CC0; t9, t10 CC BY-SA 4.0. Mười tệp đều còn trên Commons. Hai mươi nguồn phát (mp3 chuyển mã và ogg gốc) đều trả 206 với yêu cầu Range ngày 05/11/2026.'
- id: n5
  cau: Tên tác phẩm và người biểu diễn được ẩn cho đến khi bạn trả lời.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/nghe-mu.js: tên, người biểu diễn, dấu hiệu, link trang tệp chỉ dựng vào .oz-nm-dap-an khi bấm "Xem đáp án" (xem()); ô dựng sẵn không có tên. Lưu ý: tên tệp nằm trong địa chỉ nguồn của thẻ audio sau khi bấm "Nghe bản thu" (như bản cũ).'
- id: n6
  cau: Bộ gồm bản thu thời Baroque, Cổ điển, Lãng mạn và Ấn tượng; site chưa tìm được bản thu thế kỷ 20 có giấy phép mở để đưa vào.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'BAN_THU: 4 Baroque, 4 Cổ điển, 1 Lãng mạn, 1 Ấn tượng; không bản nào modern (tests/nghe-mu.test.mjs kiểm). Vế "chưa tìm được" là câu về việc của site.'
- id: n7
  cau: Phần thế kỷ 20 hãy luyện bằng đoán phong cách (/opus/nhan-dien/luyen-nghe/) và phiếu nghe mù bên dưới.
  loai: ve-site
  ket_qua: dung
  ghi_chu: src/content/docs/nhan-dien/luyen-nghe.md có công cụ style-trainer với hai đoạn modern-1, modern-2 (VI_DU, nhan-dien.js).
- id: n8
  cau: Số lượng còn ít, nên sau vài vòng bạn sẽ nhớ đáp án; khi đó chuyển sang phiếu nghe mù với nguồn nhạc phong phú hơn.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
- id: n9
  cau: Bản thu chỉ tải khi bạn bấm "Nghe bản thu", và được phát trực tiếp từ máy chủ Wikimedia nên cần có mạng. Nếu một bản không phát được, bấm "Bản khác".
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bản thu được phát trực tiếp từ máy chủ Wikimedia, cần có mạng. …" Thêm vế "chỉ tải khi bạn bấm Nghe bản thu" theo công cụ mới (nghe-mu.js: nguồn chỉ gắn vào thẻ audio trong phat(); kiem-nghe-mu.mjs kiểm không có yêu cầu nào tới Wikimedia trước khi bấm). Nguồn phát là upload.wikimedia.org và commons.wikimedia.org (BAN_THU.nguon); lỗi tải thì báo "Không phát được bản thu này. Bấm “Bản khác”." Ghi doi_chu.'
- id: n10
  cau: 'Radio nhạc cổ điển: BBC Radio 3 nghe được trực tuyến.'
  loai: ten
  nguon:
  - bbc-r3
  ket_qua: dung
  ghi_chu: BBC Sounds có trang "Radio 3 – Listen Live" (mở 05/11/2026, curl với User-Agent trình duyệt). Vế "các kênh nhạc cổ điển trên ứng dụng nghe nhạc" viết chung, không nêu tên.
- id: n11
  cau: 'Danh sách phát ngẫu nhiên: bật chế độ trộn bài trên một danh sách phát nhạc cổ điển lớn của ứng dụng nghe nhạc, úp màn hình xuống, nghe 1–2 phút rồi mới xem.'
  loai: khuyen-tap
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ có ví dụ "Classical Essentials": tìm (WebSearch 05/11/2026) không thấy danh sách phát nào đúng tên ấy (Apple Music có nhiều danh sách "… Essentials" khác tên). Tên danh sách phát là thông tin mau cũ: bỏ ví dụ, viết chung. Ghi doi_chu.'
- id: n12
  cau: Nhờ bạn bè chọn một bài trong danh sách hướng dẫn nghe (/opus/nghe-nhac/) hoặc các trang thời kỳ, rồi bật cho bạn nghe.
  loai: ve-site
  ket_qua: dung
  ghi_chu: nghe-nhac/index chưa chuyển (đợt 6), hiện "sắp có"; ../opus-zero/docs/nghe-nhac/index.md là danh mục các hướng dẫn nghe. Lô chuyển giữ đường dẫn.
- id: n13
  cau: Ghi dự đoán trước khi xem tên, rồi ghi đáp án thật; site lưu lịch sử và tính tỉ lệ đoán đúng của bạn theo thời gian.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'nghe-mu.js ganPhieu: lưu store.blindLog (opus-zero:v1), bảng 15 lần gần nhất, dòng "Đã ghi N lần nghe mù; đoán đúng thời kỳ x/N." (kiem-nghe-mu.mjs kiểm).'
- id: n14
  cau: Nghe ít nhất 60 giây trước khi đoán; đoạn mở đầu đôi khi gây nhầm.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
  ghi_chu: Công cụ đổi lời dẫn "Nghe ít nhất 30–60 giây" thành "60 giây" cho khớp câu này (chữ của công cụ, data-sinh).
- id: n15
  cau: Một giao hưởng Lãng mạn có thể mở đầu bằng một đoạn chậm.
  loai: lich-su
  nguon:
  - i-brahms1
  ket_qua: dung
  ghi_chu: 'Ví dụ: Giao hưởng số 1 của Brahms, chương 1 mở bằng phần Un poco sostenuto trước Allegro (IMSLP, danh sách chương). Chữ "rất cổ" là cảm nhận, giữ.'
- id: n16
  cau: 'Đi theo quy trình ba câu hỏi: biên chế → thời kỳ → tác giả (xem Nghe để nhận diện, /opus/nhan-dien/).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/content/docs/nhan-dien/index.md mục "Quy trình ba câu hỏi": 1. Biên chế và thể loại, 2. Thời kỳ, 3. Tác giả.'
- id: n17
  cau: Nói ra lý do ("Có harpsichord, bè trầm đi đều, nhiều chuỗi, nên là Baroque"); lý do quan trọng hơn kết quả đúng hay sai.
  loai: khuyen-tap
  ket_qua: khong-can-nguon
- id: n18
  cau: Khi sai, tìm xem yếu tố nào đánh lừa bạn, và đọc lại dòng tương ứng trong bảng so sánh (/opus/nhan-dien/so-sanh-thoi-ky/).
  loai: ve-site
  ket_qua: dung
  ghi_chu: src/content/docs/nhan-dien/so-sanh-thoi-ky.md có bảng so sánh theo yếu tố.
- id: n19
  cau: 'Mục "Nguồn và giấy phép": mười link tới trang tệp trên Wikimedia Commons, tên mỗi link khớp tệp.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã so mười link của khối <details> với BAN_THU.trang trong nghe-mu.js: cùng mười trang tệp, cùng thứ tự t1–t10. Workflow kiem-link.yml kiểm các link này hằng tuần (đọc cả trang và nghe-mu.js).'
- id: n20
  cau: 'Bản thu t1 (chữ của công cụ nghe mù): J. S. Bach, Brandenburg Concerto số 6, BWV 1051, chương 2 (Adagio ma non tanto); Advent Chamber Orchestra.'
  loai: ten
  nguon:
  - c-t1
  - i-1051
  ket_qua: dung
  ghi_chu: 'src/scripts/nghe-mu.js, BAN_THU t1: tên tác phẩm, số danh mục, chương, người biểu diễn khớp trang tệp và IMSLP.'
- id: n21
  cau: 'Bản thu t1, đáp án và dấu hiệu: Hai viola song tấu, cello và harpsichord đệm: kết cấu phức điệu, bè trầm đi đều. Chương chậm chỉ dùng nhóm nhỏ, dù cả tác phẩm là concerto; xếp Baroque, nhóm thính phòng.'
  loai: cau-truc
  nguon:
  - c-t1
  - i-1051
  - omt-tex
  ket_qua: dung
  ghi_chu: 'Commons: "This second movement is a duet for the two solo violas with cello and harpsichord"; IMSLP: chương 2 Adagio, ma non tanto.'
- id: n22
  cau: 'Bản thu t2 (chữ của công cụ nghe mù): J. S. Bach, Brandenburg Concerto số 4, BWV 1049, chương 1 (Allegro); Kevin MacLeod (incompetech.com).'
  loai: ten
  nguon:
  - c-t2
  - i-1049
  ket_qua: dung
  ghi_chu: 'src/scripts/nghe-mu.js, BAN_THU t2: tên tác phẩm, số danh mục, chương, người biểu diễn khớp trang tệp và IMSLP.'
- id: n23
  cau: 'Bản thu t2, đáp án và dấu hiệu: Một nhóm độc tấu (violin và hai sáo dọc) đối đáp với dàn dây: concerto grosso; nhiều chuỗi, đoạn tutti quay lại như ritornello; xếp Baroque, dàn nhạc và nghệ sĩ độc tấu.'
  loai: cau-truc
  nguon:
  - c-t2
  - i-1049
  ket_qua: dung
  ghi_chu: 'Commons (it): "Concerto 4ta à Violino Principale, due Fiauti d''Echo, due Violini, una Viola è Violone in Ripieno, Violoncello è Continuo". Bản thu của incompetech là bản dựng của Kevin MacLeod (trang tệp ghi "Copyright: Kevin MacLeod").'
- id: n24
  cau: 'Bản thu t3 (chữ của công cụ nghe mù): Vivaldi, Concerto "Mùa xuân" cung Mi trưởng, Op. 8 số 1, RV 269, chương 1 (Allegro); John Harrison (violin), Robert Turizziani chỉ huy, Wichita State University Chamber Players.'
  loai: ten
  nguon:
  - c-t3
  - i-rv269
  ket_qua: dung
  ghi_chu: 'src/scripts/nghe-mu.js, BAN_THU t3: tên tác phẩm, số danh mục, chương, người biểu diễn khớp trang tệp và IMSLP.'
- id: n25
  cau: 'Bản thu t3, đáp án và dấu hiệu: Dàn dây mở đầu bằng chủ đề, violin độc tấu đối đáp xen các đoạn tutti quay lại (ritornello); xếp Baroque, dàn nhạc và nghệ sĩ độc tấu.'
  loai: cau-truc
  nguon:
  - c-t3
  - i-rv269
  ket_qua: dung
- id: n26
  cau: 'Bản thu t4 (chữ của công cụ nghe mù): J. S. Bach, Concerto violin cung Mi trưởng, BWV 1042, chương 2 (Adagio); Advent Chamber Orchestra, Jacques Israelievitch (violin).'
  loai: ten
  nguon:
  - c-t4
  - i-1042
  ket_qua: dung
