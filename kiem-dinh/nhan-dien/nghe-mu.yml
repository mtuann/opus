ghi_chu: 'Trang tầng tham chiếu có hạn (D8-L1), người làm lô làm lượt 1. Chữ của hai công cụ nghe mù (src/scripts/nghe-mu.js, data-sinh) có nhận định riêng cho mười bản thu: tên và người biểu diễn (loai ten), đáp án và dấu hiệu (cau-truc). Nguồn: trang tệp Wikimedia Commons (mô tả, người biểu diễn, giấy phép; đọc qua API của Commons với User-Agent opus-kiem-dinh/1.0) và trang tác phẩm IMSLP (danh mục, chương, giọng; đọc qua api.php). Không có khối abc.'
doi_chu:
- cu: 'Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán. Đây là cách duy nhất để kiểm tra xem bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin. Trang này có hai công cụ: một bộ 10 bản thu thật để luyện, và một phiếu ghi cho bản thu của riêng bạn.'
  moi: 'Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán. Cách này cho biết bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin về bài. Trang này có hai công cụ: một bộ 10 bản thu thật để luyện, và một phiếu ghi cho bản thu của riêng bạn.'
  ly_do: 'n2: "duy nhất" là nói quá, không kiểm được; viết lại.'
- cu: Bản thu được phát trực tiếp từ máy chủ Wikimedia, cần có mạng. Nếu một bản không phát được, bấm "Bản khác".
  moi: Bản thu chỉ tải khi bạn bấm "Nghe bản thu", và được phát trực tiếp từ máy chủ Wikimedia nên cần có mạng. Nếu một bản không phát được, bấm "Bản khác".
  ly_do: 'n9: công cụ mới chỉ tải bản thu khi người học bấm "Nghe bản thu" (nghe-mu.js).'
- cu: 'Danh sách phát ngẫu nhiên: bật chế độ trộn bài trên một danh sách lớn (ví dụ "Classical Essentials"), úp màn hình xuống, nghe 1–2 phút rồi mới xem.'
  moi: 'Danh sách phát ngẫu nhiên: bật chế độ trộn bài trên một danh sách phát nhạc cổ điển lớn của ứng dụng nghe nhạc, úp màn hình xuống, nghe 1–2 phút rồi mới xem.'
  ly_do: 'n11: không có danh sách phát nào tên đúng "Classical Essentials" (tìm 05/11/2026); tên danh sách phát là thông tin mau cũ, viết chung.'
- cu: 'mô tả: Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán. Đây là cách duy nhất để kiểm tra xem bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin. Trang…'
  moi: 'mô tả: Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán: mười bản thu thật trên Wikimedia Commons để luyện, và một phiếu ghi cho bản thu của riêng bạn.'
  ly_do: 'Mô tả cũ bị cắt ("Trang…") và có câu "cách duy nhất" (n2): viết lại thành câu trọn, nói đúng hai công cụ của trang.'
