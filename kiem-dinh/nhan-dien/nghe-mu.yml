nhan_dinh:
  - id: n1
    cau: Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Định nghĩa cách luyện của site (tên gọi một cách tập), không phải thuật ngữ cần nguồn.
    luot_2: dung
    luot_2_ghi_chu: Định nghĩa đúng cách dùng thông thường.
  - id: n2
    cau: Cách này cho biết bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin về bài.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "Đây là cách duy nhất để kiểm tra xem bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin." "Duy nhất" là nói quá, không kiểm được; viết lại (cả mô tả trang). Ghi doi_chu. Review D8-gom: đồng ý chữ mới (bỏ "duy nhất", lượt 2 dung). Câu là lời khuyên, không chứa điều về sức khỏe. Review cuối D8-gom: lời khuyên tập đã đổi chữ: ket_qua da-sua đổi thành khong-can-nguon (khoa.mjs đòi nguồn cho da-sua; lời khuyên tập không dính sức khỏe thì không cần nguồn, như hồ sơ đã khóa nhac-ly/30 n32); chữ cũ ghi ở trên.'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý, khớp cách dạy phổ biến.
  - id: n3
    cau: 'Trang này có hai công cụ: một bộ 10 bản thu thật để luyện, và một phiếu ghi cho bản thu của riêng bạn.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trang (::cong-cu{ten="blind"}, ::cong-cu{ten="blind-log"}) và src/scripts/nghe-mu.js: BAN_THU có 10 bản. Giữ đúng điều nhan-dien/index.yml i6 và so-sanh-thoi-ky.yml ghi cho trang này (10 bản thu, tên ẩn, phiếu). Review D8-gom: trang có ::cong-cu{ten="blind"} và ::cong-cu{ten="blind-log"}; src/scripts/nghe-mu.js BAN_THU có 10 mục t1–t10.'
    review: dung
  - id: n4
    cau: Các bản thu dưới đây lấy từ Wikimedia Commons, đều có giấy phép mở (Creative Commons, EFF Open Audio License hoặc phạm vi công cộng).
    loai: so-lieu
    nguon:
      - c-t1
      - c-t2
      - c-t3
      - c-t4
      - c-t5
      - c-t6
      - c-t7
      - c-t8
      - c-t9
      - c-t10
    ket_qua: dung
    ghi_chu: 'Mười trang tệp (đọc wikitext và extmetadata qua API Commons ngày 05/11/2026): t1, t4, t5, t7 CC BY-SA 2.0 (gốc EFF OAL, tương đương CC BY-SA 2.0); t2 CC BY 2.0; t3 CC BY-SA 1.0+; t6 EFF Open Audio License (OAL-1); t8 PD-self và CC0; t9, t10 CC BY-SA 4.0. Mười tệp đều còn trên Commons. Hai mươi nguồn phát (mp3 chuyển mã và ogg gốc) đều trả 206 với yêu cầu Range ngày 05/11/2026.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Bach_-_Brandenburg_Concerto_6_-_2._Adagio.ogg", "https://commons.wikimedia.org/wiki/File:Brandenburg_Concerto_No._4_in_G,_Movement_I_(Allegro),_BWV_1049_(ISRC_USUAN1100303).oga", "https://commons.wikimedia.org/wiki/File:FurElise.ogg" ]
    luot_2_ghi_chu: "Wikimedia Commons: các tệp mẫu có giấy phép CC BY-SA 2.0 (Advent Chamber Orchestra, EFF Open Audio License tương đương), CC BY 2.0 (Kevin MacLeod, Brandenburg 4), CC BY-SA 4.0 (Wichita State, Patrizia Prati), EEF OAL-1 (Fulda), phạm vi công cộng/CC0 (Für Elise). Khớp câu."
  - id: n5
    cau: Tên tác phẩm và người biểu diễn được ẩn cho đến khi bạn trả lời.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/nghe-mu.js: tên, người biểu diễn, dấu hiệu, link trang tệp chỉ dựng vào .oz-nm-dap-an khi bấm "Xem đáp án" (xem()); ô dựng sẵn không có tên. Lưu ý: tên tệp nằm trong địa chỉ nguồn của thẻ audio sau khi bấm "Nghe bản thu" (như bản cũ). Review D8-gom: nghe-mu.js: ô dựng sẵn (nút "Nghe bản thu", "Xem đáp án", "Bản khác") không có tên; tên, người biểu diễn, dấu hiệu chỉ dựng khi bấm "Xem đáp án".'
    review: dung
  - id: n6
    cau: Bộ gồm bản thu thời Baroque, Cổ điển, Lãng mạn và Ấn tượng; site chưa tìm được bản thu thế kỷ 20 có giấy phép mở để đưa vào.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'BAN_THU: 4 Baroque, 4 Cổ điển, 1 Lãng mạn, 1 Ấn tượng; không bản nào modern (tests/nghe-mu.test.mjs kiểm). Vế "chưa tìm được" là câu về việc của site. Review D8-gom: nghe-mu.js BAN_THU: thoi_ky baroque ×4, classical ×4, romantic ×1, impressionist ×1, không có modern; tests/nghe-mu.test.mjs kiểm không có modern.'
    review: dung
  - id: n7
    cau: Phần thế kỷ 20 hãy luyện bằng đoán phong cách (/opus/nhan-dien/luyen-nghe/) và phiếu nghe mù bên dưới.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/nhan-dien/luyen-nghe.md có công cụ style-trainer với hai đoạn modern-1, modern-2 (VI_DU, nhan-dien.js). Review D8-gom: src/content/docs/nhan-dien/luyen-nghe.md (đã khóa) dòng 12 ::cong-cu{ten="style-trainer"}; src/scripts/nhan-dien.js VI_DU có modern-1, modern-2.'
    review: dung
  - id: n8
    cau: Số lượng còn ít, nên sau vài vòng bạn sẽ nhớ đáp án; khi đó chuyển sang phiếu nghe mù với nguồn nhạc phong phú hơn.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý (ít bản thu thì dễ nhớ đáp án).
  - id: n9
    cau: Bản thu chỉ tải khi bạn bấm "Nghe bản thu", và được phát trực tiếp từ máy chủ Wikimedia nên cần có mạng. Nếu một bản không phát được, bấm "Bản khác".
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bản thu được phát trực tiếp từ máy chủ Wikimedia, cần có mạng. …" Thêm vế "chỉ tải khi bạn bấm Nghe bản thu" theo công cụ mới (nghe-mu.js: nguồn chỉ gắn vào thẻ audio trong phat(); kiem-nghe-mu.mjs kiểm không có yêu cầu nào tới Wikimedia trước khi bấm). Nguồn phát là upload.wikimedia.org và commons.wikimedia.org (BAN_THU.nguon); lỗi tải thì báo "Không phát được bản thu này. Bấm “Bản khác”." Ghi doi_chu. Review D8-gom: nghe-mu.js: nguồn chỉ gắn vào thẻ audio khi bấm "Nghe bản thu" (chú thích dòng 5, dòng 281); BAN_THU.nguon chỉ ở upload.wikimedia.org, commons.wikimedia.org; CHU_NM.loi: "Không phát được bản thu này. Bấm “Bản khác”."'
    review: dung
  - id: n10
    cau: 'Radio nhạc cổ điển: BBC Radio 3 nghe được trực tuyến.'
    loai: ten
    nguon:
      - bbc-r3
    ket_qua: dung
    ghi_chu: BBC Sounds có trang "Radio 3 – Listen Live" (mở 05/11/2026, curl với User-Agent trình duyệt). Vế "các kênh nhạc cổ điển trên ứng dụng nghe nhạc" viết chung, không nêu tên.
    luot_2: dung
    luot_2_nguon: [ "https://www.bbc.co.uk/radio3" ]
    luot_2_ghi_chu: BBC Radio 3 nghe trực tuyến (Listen Live, BBC Sounds).
  - id: n11
    cau: 'Danh sách phát ngẫu nhiên: bật chế độ trộn bài trên một danh sách phát nhạc cổ điển lớn của ứng dụng nghe nhạc, úp màn hình xuống, nghe 1–2 phút rồi mới xem.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ có ví dụ "Classical Essentials": tìm (WebSearch 05/11/2026) không thấy danh sách phát nào đúng tên ấy (Apple Music có nhiều danh sách "… Essentials" khác tên). Tên danh sách phát là thông tin mau cũ: bỏ ví dụ, viết chung. Ghi doi_chu. Review cuối D8-gom: lời khuyên tập đã đổi chữ: ket_qua da-sua đổi thành khong-can-nguon (khoa.mjs đòi nguồn cho da-sua; lời khuyên tập không dính sức khỏe thì không cần nguồn, như hồ sơ đã khóa nhac-ly/30 n32); chữ cũ ghi ở trên.'
  - id: n12
    cau: Nhờ bạn bè chọn một bài trong danh sách hướng dẫn nghe (/opus/nghe-nhac/) hoặc các trang thời kỳ, rồi bật cho bạn nghe.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'nghe-nhac/index chưa chuyển (đợt 6), hiện "sắp có"; ../opus-zero/docs/nghe-nhac/index.md là danh mục các hướng dẫn nghe. Lô chuyển giữ đường dẫn. Review D8-gom: trang đích nghe-nhac/index chưa chuyển (chưa có trong src/content/docs/nghe-nhac/, hiện "sắp có"); ở ../opus-zero/docs/nghe-nhac/index.md là trang "Nghe nhạc" mở ra các hướng dẫn nghe. Lô chuyển trang đích phải giữ đường dẫn /opus/nghe-nhac/ và danh sách hướng dẫn nghe.'
    review: dung
  - id: n13
    cau: Ghi dự đoán trước khi xem tên, rồi ghi đáp án thật; site lưu lịch sử và tính tỉ lệ đoán đúng của bạn theo thời gian.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'nghe-mu.js ganPhieu: lưu store.blindLog (opus-zero:v1), bảng 15 lần gần nhất, dòng "Đã ghi N lần nghe mù; đoán đúng thời kỳ x/N." (kiem-nghe-mu.mjs kiểm). Review D8-gom: nghe-mu.js: datKho(''blindLog'', …) mỗi lần ghi; tomTatPhieu: 15 lần gần nhất và số lần đoán đúng thời kỳ; CHU_NM.tomTat "Đã ghi N lần nghe mù; đoán đúng thời kỳ x/N."'
    review: dung
  - id: n14
    cau: Nghe ít nhất 60 giây trước khi đoán; đoạn mở đầu đôi khi gây nhầm.
