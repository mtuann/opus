ghi_chu: 'Trang tầng tham chiếu có hạn (D8-L1), người làm lô làm lượt 1. Chữ của hai công cụ nghe mù (src/scripts/nghe-mu.js, data-sinh) có nhận định riêng cho mười bản thu: tên và người biểu diễn (loai ten), đáp án và dấu hiệu (cau-truc). Nguồn: trang tệp Wikimedia Commons (mô tả, người biểu diễn, giấy phép; đọc qua API của Commons với User-Agent opus-kiem-dinh/1.0) và trang tác phẩm IMSLP (danh mục, chương, giọng; đọc qua api.php). Không có khối abc.'
doi_chu:
  - cu: 'Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán. Đây là cách duy nhất để kiểm tra xem bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin. Trang này có hai công cụ: một bộ 10 bản thu thật để luyện, và một phiếu ghi cho bản thu của riêng bạn.'
