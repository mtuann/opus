nhan_dinh:
  - id: n1
    cau: "Nhạc thính phòng: nhóm nhỏ, mỗi bè một người."
    loai: dinh-nghia
    nguon:
      - cod-chamber-music
    ket_qua: dung
    ghi_chu: "COD, Chamber music: nhạc cho nhóm nhỏ, mỗi bè do một người chơi."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/chamber-music" ]
    luot_2_ghi_chu: "Britannica: nhóm nhỏ, thường mỗi bè một người."
  - id: n2
    cau: Cây quyết định, nhánh mô tả "Vài người, mỗi bè một người" dẫn tới nhạc thính phòng.
    loai: dinh-nghia
    nguon:
      - cod-chamber-music
      - cod-string-quartet
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "2–9 người, mỗi bè một người". Chữ mới "Vài người, mỗi bè một người". Lý do: con số 2–9 không có ở nguồn bậc 2 nào đã mở; COD chỉ nói nhóm nhỏ, mỗi bè một người.'
    luot_2: khong-chac
    luot_2_ghi_chu: Nói về cây quyết định của site (nhánh, nhãn); không kiểm được từ nguồn ngoài, nên do review kiểm trên trang.
  - id: n3
    cau: "Có giọng hát, có dàn dựng sân khấu, nhân vật, đối thoại: opera."
    loai: dinh-nghia
    nguon:
      - br-opera
      - cod-aria
    ket_qua: dung
    ghi_chu: "Britannica, Opera: kịch có nhạc, nhân vật hát trên sân khấu; COD, Aria: bài hát độc xướng trong opera, oratorio, cantata."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/opera-music" ]
    luot_2_ghi_chu: "Britannica: opera là kịch dựng sân khấu hoàn toàn bằng âm nhạc, có ca sĩ, dàn nhạc, bối cảnh."
  - id: n4
    cau: "Lời tôn giáo, không dựng sân khấu: Thánh lễ, Requiem, cantata, oratorio."
    loai: danh-muc
    nguon:
      - cod-mass
      - cod-requiem
      - br-cantata
      - cod-oratorio
    ket_qua: dung
    ghi_chu: COD Mass, Requiem, Oratorio; Britannica Cantata (cantata nhà thờ). Sơ đồ nói chung, "lời tôn giáo" là manh mối, không phải luật.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Requiem,_K.626_(Mozart,_Wolfgang_Amadeus)", "https://imslp.org/wiki/Schweigt_stille,_plaudert_nicht,_BWV_211_(Bach,_Johann_Sebastian)", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto" ]
    luot_2_ghi_chu: Thánh lễ, Requiem (lời Latin, IMSLP K.626), cantata (có loại thế tục, vd BWV 211) và oratorio là thể loại hợp xướng; 'không dựng sân khấu' đúng với Requiem, oratorio. Chưa mở trang riêng cho oratorio.
  - id: n5
    cau: "Một giọng hát với piano: ca khúc nghệ thuật (Lied)."
    loai: dinh-nghia
    nguon:
      - cod-lied
    ket_qua: dung
    ghi_chu: 'COD, Lied: ca khúc nghệ thuật tiếng Đức cho giọng hát và piano. Tên "ca khúc nghệ thuật" theo từ điển site.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/lied", "https://www.britannica.com/art/Lied" ]
    luot_2_ghi_chu: "Lied: bài hát nghệ thuật Đức, giọng hát với piano."
  - id: n6
    cau: Hợp xướng, cantata thế tục (ví dụ Bach, BWV 211).
    loai: danh-muc
    nguon:
      - br-cantata
      - bach-211
      - clark-cantata
    ket_qua: null
    ghi_chu: "chưa chắc: cantata thế tục có thật: BWV 211 (Coffee Cantata) là cantata thế tục (bach-cantatas.com, bậc 3); Clark (LibreTexts): Bach viết cả cantata nhà thờ lẫn thế tục. Hai nguồn đều bậc 3; lượt 2 nên tìm nguồn bậc 2."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Schweigt_stille,_plaudert_nicht,_BWV_211_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "IMSLP: BWV 211 là cantata thế tục (Cà phê), Leipzig 1734–35."
  - id: n7
    cau: "Một người chơi: sonata độc tấu, tiểu phẩm (nocturne, étude, prélude…)."
    loai: danh-muc
    nguon:
      - cod-sonata
    ket_qua: dung
    ghi_chu: "COD, Sonata: sonata cho một nhạc cụ. Các tiểu phẩm piano khớp piano/the-loai (trang đã khóa)."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/chamber-music" ]
    luot_2_ghi_chu: "Sonata độc tấu, tiểu phẩm (nocturne, étude, prélude) là thể loại cho một người chơi: Britannica chamber music định nghĩa thính phòng là nhóm nhỏ; mục nhạc độc tấu là phân loại phổ thông, không mâu thuẫn."
  - id: n8
    cau: Nhạc thính phòng gồm sonata cho nhạc cụ và piano, tam tấu, tứ tấu.
    loai: danh-muc
    nguon:
      - cod-chamber-music
      - cod-sonata
      - cod-piano-trio
      - cod-string-quartet
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/chamber-music", "https://www.britannica.com/art/piano-trio", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/string-quartet" ]
    luot_2_ghi_chu: "Britannica/COD: tam tấu, tứ tấu thuộc nhạc thính phòng; sonata nhạc cụ-piano cũng thuộc thính phòng."
  - id: n9
    cau: "Nhánh dàn nhạc: có nhạc cụ nổi bật đối đáp với dàn nhạc là concerto."
    loai: dinh-nghia
    nguon:
      - cod-concerto
    ket_qua: dung
    ghi_chu: "COD, Concerto: tác phẩm cho nhạc cụ độc tấu với dàn nhạc, tương phản và đối đáp."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto" ]
    luot_2_ghi_chu: "COD: concerto là tác phẩm có nhạc cụ độc tấu tương phản và hòa với dàn nhạc."
  - id: n10
    cau: "Dàn nhạc không có nhạc cụ nổi bật: giao hưởng, thơ giao hưởng, overture, tổ khúc ballet."
    loai: danh-muc
    nguon:
      - cod-symphony
      - cod-symphonic-poem
      - cod-overture
      - cod-suite
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphony", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphonic-poem", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/suite" ]
    luot_2_ghi_chu: Giao hưởng, thơ giao hưởng, tổ khúc ballet (COD nêu Daphnis et Chloé); overture là tác phẩm dàn nhạc không độc tấu.
  - id: n11
    cau: "Một nhạc cụ khác và piano: sonata cho violin (cello, sáo…) và piano, hai nhạc cụ ngang hàng."
    loai: dinh-nghia
    nguon:
      - cod-sonata
    ket_qua: dung
    ghi_chu: 'COD, Sonata: sonata cho nhạc cụ và keyboard từ thế kỷ 18 là thể loại hai bè ngang nhau. Kiểm chữ "ngang hàng" ở mục Sonata.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/chamber-music" ]
    luot_2_ghi_chu: Sonata violin–piano, cello–piano, flute–piano là thính phòng hai nhạc cụ; 'ngang hàng' là cách nói phổ thông.
  - id: n12
    cau: Tổ khúc cello của Bach (BWV 1007–1012) và sonata, partita violin độc tấu (BWV 1001–1006) là nhạc cho một nhạc cụ không đệm.
    loai: danh-muc
    nguon:
      - imslp-cello-suites
      - imslp-violin-solo
    ket_qua: dung
    ghi_chu: "IMSLP: sáu tổ khúc cello (1717-23), sáu sonata và partita violin (1720), đều độc tấu."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Cello_Suites,_BWV_1007-1012_(Bach,_Johann_Sebastian)", "https://imslp.org/wiki/Sonatas_and_Partitas_for_Solo_Violin,_BWV_1001-1006_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "IMSLP: Tổ khúc cello BWV 1007–1012 (cello một nhạc cụ), Sonata và Partita violin BWV 1001–1006 (violin độc tấu)."
  - id: n13
    cau: Debussy, Syrinx (flute độc tấu) là tác phẩm thế kỷ 20 cho một nhạc cụ không đệm.
    loai: nam
    nguon:
      - imslp-syrinx
    ket_qua: dung
    ghi_chu: "IMSLP: Syrinx, 1913, flute độc tấu (trang IMSLP Syrinx (Debussy, Claude) đã mở)."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Syrinx_(Debussy,_Claude)" ]
    luot_2_ghi_chu: "IMSLP: Syrinx, năm sáng tác 1913, cho flute độc tấu."
  - id: n14
    cau: Tứ tấu đàn dây gồm 2 violin, viola, cello; là thể loại thính phòng quan trọng nhất.
    loai: dinh-nghia
    nguon:
      - cod-string-quartet
    ket_qua: dung
    ghi_chu: "COD, String quartet: \"almost always 2 vn., va., vc.\"; \"highest medium for a composer's thought\" trong nhạc thính phòng. Câu \"quan trọng nhất\" là cách nói gần với đánh giá ấy."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/string-quartet" ]
    luot_2_ghi_chu: "COD: tứ tấu đàn dây gồm hai violin, viola, cello; là 'phương tiện hàng đầu' của nhạc thính phòng. 'Quan trọng nhất' là diễn đạt gần đúng."
  - id: n15
    cau: Tam tấu piano gồm piano, violin, cello.
    loai: dinh-nghia
    nguon:
      - cod-piano-trio
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/piano-trio" ]
    luot_2_ghi_chu: "Britannica: tam tấu piano gồm piano, violin, cello."
  - id: n16
    cau: Ngũ tấu piano gồm piano và 4 đàn dây; Schubert, Con cá hồi (D. 667) dùng violin, viola, cello, contrabass và piano.
    loai: dinh-nghia
    nguon:
      - cod-piano-quintet
      - imslp-trout
    ket_qua: dung
