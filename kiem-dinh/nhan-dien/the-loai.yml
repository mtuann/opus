  - cu: "Câu hỏi đầu tiên khi nghe một bản nhạc lạ: ai đang chơi? Biết biên chế là bạn đã đoán được thể loại trong phần lớn trường hợp."
    moi: "Câu hỏi đầu tiên khi nghe một bản nhạc lạ: ai đang chơi? Biên chế (nhạc cụ nào, bao nhiêu người, có giọng hát không) là manh mối đầu tiên để đoán thể loại."
    ly_do: 'Câu mở đầu (lượt 1 D5-L3): bỏ "đoán được thể loại trong phần lớn trường hợp" (không nguồn); biên chế là manh mối đầu tiên.'
