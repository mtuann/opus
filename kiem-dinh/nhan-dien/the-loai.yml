      - Harpsichord hoặc sáo dọc (recorder) → gần như chắc chắn Baroque (hoặc tái hiện Baroque).
      - Clarinet hiếm trước khoảng 1780; tuba và cor anglais nổi bật là dấu hiệu thế kỷ 19.
      - Saxophone trong dàn nhạc → cuối thế kỷ 19 hoặc thế kỷ 20 (như Boléro).
      - Bộ gõ rất nhiều, marimba, vibraphone, piano dùng như nhạc cụ gõ → thế kỷ 20.
      - Dàn nhạc trên 80 người, 8 kèn horn → Lãng mạn muộn (Mahler, Strauss) hoặc thế kỷ 20.
    moi:
      - Harpsichord hoặc sáo dọc (recorder) → thường là Baroque (sáo dọc cũng có trong nhạc Phục hưng); bản thu hiện đại có thể là tái hiện lối chơi cũ.
      - Clarinet vào dàn nhạc giao hưởng muộn hơn các kèn gỗ khác, trong thế kỷ 18; tuba (bản đầu được cấp bằng năm 1835) và cor anglais (ít dùng trước thế kỷ 19) là dấu hiệu của thế kỷ 19 trở đi.
      - Saxophone trong dàn nhạc → từ giữa thế kỷ 19 trở đi (Adolphe Sax chế tạo khoảng 1840–45, cấp bằng 1846), như Boléro.
      - Bộ gõ đa dạng, có marimba hay vibraphone → thường là thế kỷ 20 (Grainger dùng marimba trước 1916; Berg, Britten, Messiaen dùng vibraphone).
      - Dàn nhạc rất lớn (bộ đồng đông, bộ gỗ gấp ba hay gấp bốn) → cuối thế kỷ 19 hoặc thế kỷ 20.
    ly_do: 'n25 (da-sua): nguồn không cho phép nói "gần như chắc chắn".; n26 (da-sua): mốc 1780 không có ở COD.; n27 (da-sua): thêm mốc có nguồn; n28 cùng câu.; n29 (da-sua): COD, Saxophone.; n30 (da-sua): bỏ vế piano dùng như nhạc cụ gõ.; n31 (da-sua): ngưỡng 80 người không có nguồn.'
