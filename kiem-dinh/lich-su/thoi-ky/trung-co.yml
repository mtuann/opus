      - "Clark và cộng sự, Understanding Music: Past and Present (giáo trình mở), chương 2."
      - "Encyclopaedia Britannica: các mục Léonin, Pérotin, trouvère, Minnesinger, organ, shawm."
      - IMSLP (trang các tác phẩm); International Society of Hildegard von Bingen Studies. Xem tài liệu tham khảo.
    ly_do: "n29 (da-sua): mục Nguồn viết lại theo nguồn đã mở (COD, Clark, Britannica, IMSLP) thay cho Burkholder/Taruskin/Grove chưa mở."
