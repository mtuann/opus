khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
    ket_qua: dung
    ghi_chu: 'Soạn cho trang này. K:D dorian: các nốt D E F G A B c d C toàn phím trắng (Rê Dorian, OMT). M:none, L:1/8; không ô nhịp đều (đúng với lời mô tả "không nhịp đều"). Không cảnh báo abcjs (tools/khuong-nhac.mjs).'
ghi_chu: 'Trang thời kỳ Trung cổ. Nguồn chính: COD (Encyclopedia.com), Clark chương 2, Britannica (Léonin, Pérotin, troubadour, trouvère, Minnesinger, organ, shawm). Đã sửa/bỏ: mở đầu, Guido (mốc 1025), "chưa có trưởng – thứ", Notre-Dame, nhạc cụ, Léonin Viderunt omnes, Ma fin est mon commencement, Llibre Vermell, câu "Cách nghe", mục Nguồn. Chưa chắc: Sumer is icumen in (thế kỷ 13, canon), Bernart de Ventadorn (tác phẩm 7). Mốc 500–1400 là quy ước của site. Thuật ngữ không thấy trong src/data/thuat-ngu.yml: neume, organum, phụng vụ, vielle, shawm.'
doi_chu:
  - cu:
      - "Ở châu Âu thời Trung cổ, nhà thờ là trung tâm của học vấn, và cũng là nơi âm nhạc được ghi chép, giảng dạy, bảo tồn. Phần lớn âm nhạc còn lại đến ngày nay là nhạc phụng vụ: hát trong thánh lễ và các giờ kinh của tu viện. Bên ngoài nhà thờ có âm nhạc thế tục của các hát rong (troubadour ở miền Nam nước Pháp, trouvère ở miền Bắc, Minnesinger ở Đức), nhưng được ghi lại ít hơn nhiều."
      - "Đây cũng là thời ký âm ra đời: từ những dấu hiệu gợi nhớ hướng đi của giai điệu (neume), đến khuông nhạc nhiều dòng mà Guido d'Arezzo mô tả khoảng năm 1025, cùng các âm tiết ut – re – mi – fa – sol – la để dạy hát, tiền thân của Đô Rê Mi."
    moi:
      - Ở châu Âu thời Trung cổ, nhà thờ và các triều đình quý tộc để lại dấu ấn lớn trong âm nhạc. Một phần lớn âm nhạc còn lại đến ngày nay là nhạc phụng vụ, hát trong thờ phụng. Bên ngoài nhà thờ có âm nhạc thế tục của các nhà thơ – nhạc sĩ hát rong (troubadour ở vùng Provence miền Nam nước Pháp, trouvère ở miền Bắc, Minnesinger ở Đức).
      - "Đây cũng là thời ký âm ra đời: từ những dấu hiệu gợi nhớ hướng đi của giai điệu (neume), đến khuông nhạc bốn dòng, thường được ghi công cho Guido d'Arezzo (thế kỷ 11). Ông cũng đặt ra các âm tiết ut – re – mi… để dạy hát, tiền thân của Đô Rê Mi."
    ly_do: "n30 (da-sua): description lấy từ đoạn đầu, đổi theo n2, n3.; n2 (da-sua), n3, n4: xem ghi_chu từng nhận định.; n6 (da-sua), n7 (da-sua): bỏ mốc 1025 không chốt được, ghi công Guido."
  - cu:
      - Dùng các điệu thức nhà thờ (xem bài 16), chưa có trưởng – thứ.
      - "Từ khoảng thế kỷ 9 trở đi, người ta thêm bè thứ hai (organum), rồi ba, bốn bè: phức điệu ra đời. Trường phái Notre-Dame ở Paris (Léonin, Pérotin) khoảng cuối thế kỷ 12 viết những bản organum lớn đầu tiên."
    moi:
      - Dùng các điệu thức nhà thờ (xem bài 16).
      - "Từ khoảng thế kỷ 9 trở đi, người ta thêm bè thứ hai (organum), rồi ba, bốn bè: phức điệu ra đời. Trường phái Notre-Dame ở Paris (Léonin, Pérotin), khoảng cuối thế kỷ 12 đến đầu thế kỷ 13, để lại những bộ organum hai bè (Léonin) và bốn bè (Pérotin)."
    ly_do: 'n9 (da-sua): bỏ "chưa có trưởng – thứ". n11 (da-sua): khoảng thời gian và số bè.'
  - cu: "Nghe một giai điệu viết theo kiểu thánh ca (do site soạn để minh họa): một bè, không nhịp đều, điệu thức Dorian, nhiều nốt trên một âm tiết:"
    moi: "Nghe một giai điệu viết theo kiểu thánh ca (do site soạn để minh họa): một bè, không nhịp đều, điệu thức Dorian, giai điệu đi chủ yếu từng bước:"
    ly_do: "n13 (da-sua): mô tả kiểm được trên khối abc."
  - cu: Giọng hát là chính. Nhạc cụ thời đó có đàn harp, đàn lute, đàn vielle (tổ tiên của các đàn kéo vĩ), sáo, kèn shawm, đàn organ trong nhà thờ, trống nhỏ.
    moi: Giọng hát là chính. Nhạc cụ thời đó có đàn lute, đàn vielle (tên gọi thời Trung cổ của nhiều nhạc cụ, như fiddle và hurdy-gurdy), kèn shawm (tiền thân của oboe) và đàn organ (gắn với nhà thờ từ thế kỷ 10).
    ly_do: "n14 (da-sua), n15, n16, n17: bỏ harp, sáo, trống nhỏ; giải thích vielle, shawm, organ theo nguồn."
  - cu: Léonin, Viderunt omnes (organum hai bè), để so sánh với Pérotin.
    moi: Léonin, Magnus liber organi (các bản organum hai bè), để so sánh với Pérotin.
    ly_do: "n22 (da-sua): Viderunt omnes hai bè của Léonin không xác nhận được."
  - cu:
      - Machaut, Ma fin est mon commencement (ca khúc có thể đọc xuôi ngược).
      - Llibre Vermell de Montserrat (ca khúc hành hương thế kỷ 14).
      - 'Cách nghe: nhạc Trung cổ không có "giai điệu bắt tai" theo nghĩa hiện đại. Hãy nghe như nghe không gian: tiếng vang của nhà thờ đá, sự hòa quyện của những quãng 5 và quãng 8 rỗng.'
    moi:
      - Machaut, Ma fin est mon commencement.
      - Llibre Vermell de Montserrat (bản chép tay các bài ca sùng đạo, khoảng năm 1399).
      - 'Cách nghe: nhạc Trung cổ không có "giai điệu bắt tai" theo nghĩa hiện đại. Hãy nghe như nghe không gian: tiếng vang của nhà thờ đá, sự hòa quyện của các bè chạy song song.'
    ly_do: 'n26 (da-sua): bỏ "có thể đọc xuôi ngược". n27 (da-sua): mô tả theo COD, mốc khoảng 1399.; n28 (da-sua): bỏ "quãng 5 và quãng 8 rỗng".'
  - cu:
