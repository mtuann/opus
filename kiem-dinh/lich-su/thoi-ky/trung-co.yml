nhan_dinh:
  - id: n1
    cau: Thời Trung cổ (khoảng 500–1400)
    loai: nam
    nguon:
      - lt-2.2
      - cod-plainsong
    ket_qua: dung
    ghi_chu: Mốc thời kỳ là quy ước của site (Clark, mục 2.2 dùng khoảng 500–1400); các nguồn lệch nhau vài chục năm (ghi ở mục Nguồn của trang lich-su/index).
    luot_2: dung
    luot_2_nguon: [ "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/", "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm" ]
    luot_2_ghi_chu: "Quy ước gần đúng: 500–1400 (Louis); 500–1450 (WMich)."
  - id: n2
    cau: Ở châu Âu thời Trung cổ, nhà thờ và các triều đình quý tộc để lại dấu ấn lớn trong âm nhạc.
    loai: lich-su
    nguon:
      - lt-2.3
      - lt-2.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhà thờ là trung tâm của học vấn, và cũng là nơi âm nhạc được ghi chép, giảng dạy, bảo tồn". Clark có hai mục, Christian Worship (2.3) và Medieval Courts (2.4); "trung tâm của học vấn" và "bảo tồn" không có ở nguồn đã mở, nên đổi sang câu nói đúng điều hai mục ấy nêu.'
    luot_2: dung
    luot_2_nguon: [ "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/", "https://www.encyclopedia.com/humanities/culture-magazines/monophonic-secular-tradition" ]
    luot_2_ghi_chu: Nhạc nhà thờ và nhạc triều đình (troubadour, trouvère) là hai dấu ấn lớn.
  - id: n3
    cau: Một phần lớn âm nhạc còn lại đến ngày nay là nhạc phụng vụ, hát trong thờ phụng.
    loai: lich-su
    nguon:
      - lt-2.3
      - cod-plainsong
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phần lớn ... hát trong thánh lễ và các giờ kinh của tu viện". Bỏ "Phần lớn" thành "Một phần lớn" và bỏ "giờ kinh của tu viện" vì nguồn đã mở không nêu mức đó.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Gregorian-chant", "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/" ]
    luot_2_ghi_chu: Thánh ca Gregorian là nhạc phụng vụ; phần lớn nhạc còn lại từ thời này là nhạc nhà thờ (khái quát chung).
  - id: n4
    cau: Bên ngoài nhà thờ có âm nhạc thế tục của các nhà thơ – nhạc sĩ hát rong (troubadour ở vùng Provence miền Nam nước Pháp, trouvère ở miền Bắc, Minnesinger ở Đức).
    loai: lich-su
    nguon:
      - brit-troubadour
      - brit-trouvere
      - brit-minnesinger
      - cod-troub
      - lt-2.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "các hát rong ... nhưng được ghi lại ít hơn nhiều". Bỏ vế "ghi lại ít hơn nhiều" (không nguồn đã mở so mức ghi chép); thêm Provence cho troubadour (Britannica, Troubadour).'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/humanities/culture-magazines/monophonic-secular-tradition" ]
    luot_2_ghi_chu: "Troubadour: nam Pháp (Occitan/Provençal); trouvère: bắc Pháp; Minnesinger: Đức."
  - id: n5
    cau: "Đây cũng là thời ký âm ra đời: từ những dấu hiệu gợi nhớ hướng đi của giai điệu (neume) ..."
    loai: lich-su
    nguon:
      - cod-neume
      - brit-guido
    ket_qua: dung
    ghi_chu: "COD, Neume: neume là ký hiệu gợi hướng đi của giai điệu, tiền thân của khuông nhạc."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/neume" ]
    luot_2_ghi_chu: 'Neume: ký hiệu hướng đi giai điệu, tiền thân nốt nhạc; câu "thời ký âm" có thể là lỗi gõ (nên viết "thời kỳ ký âm ra đời").'
  - id: n6
    cau: đến khuông nhạc bốn dòng, thường được ghi công cho Guido d'Arezzo (thế kỷ 11).
    loai: lich-su
    nguon:
      - cod-guido
      - brit-guido
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"khuông nhạc nhiều dòng mà Guido d'Arezzo mô tả khoảng năm 1025\". Mốc \"1025\" và \"mô tả\" không chốt được ở nguồn đã mở; đổi sang \"thường được ghi công\" và thế kỷ 11 (Guido sống thế kỷ 11 theo COD/Britannica)."
    luot_2: dung
    luot_2_nguon: [ "https://www.stevenestrella.com/composers/composerfiles/guido1050.html", "https://www.britannica.com/art/neume" ]
    luot_2_ghi_chu: "Guido d'Arezzo (khoảng 991–1050) gắn với khuông bốn dòng khoảng 1025; Britannica: khuông bốn dòng phát triển khoảng năm 1000."
  - id: n7
    cau: Ông cũng đặt ra các âm tiết ut – re – mi… để dạy hát, tiền thân của Đô Rê Mi.
    loai: lich-su
    nguon:
      - cod-guido
      - cod-solm
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ liệt kê "ut – re – mi – fa – sol – la". Rút gọn bằng "…"; COD, Solmization: ut–re–mi–fa–sol–la gắn với Guido, là gốc của Đô Rê Mi.'
    luot_2: dung
    luot_2_nguon: [ "https://www.stevenestrella.com/composers/composerfiles/guido1050.html" ]
    luot_2_ghi_chu: Ut re mi fa sol la là do Guido; "ut" còn dùng ở Pháp, "do" ở hầu hết nơi khác.
  - id: n8
    cau: "Thánh ca Gregorian: một bè giai điệu (đơn âm), hát không đệm, tiếng Latin, nhịp tự do theo lời."
    loai: dinh-nghia
    nguon:
      - cod-greg
      - cod-plainsong
      - brit-greg
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Gregorian-chant" ]
    luot_2_ghi_chu: Đơn âm (monophonic), nhạc phụng vụ; hát không đệm, tiếng Latin, nhịp tự do là mô tả chuẩn nhưng trang đã mở chỉ xác nhận phần "monophonic".
  - id: n9
    cau: Dùng các điệu thức nhà thờ.
    loai: lich-su
    nguon:
      - cod-modesec
      - omt-modes
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ thêm ", chưa có trưởng – thứ". Không nguồn đã mở nói điều này theo cách kiểm được (Britannica, Mode, chỉ đọc được đề mục), nên bỏ vế đó. Review D5-gom: giữ. Open Music Theory (omt-modes, review đã mở): các điệu thức này "often called church, white-note, or Gregorian modes"; "the last note of a Gregorian chant will always be the final of the mode". Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/Gregorian-chant" ]
    luot_2_ghi_chu: Thánh ca Gregorian dùng điệu thức nhà thờ (church modes) là mô tả chuẩn, nhưng nguồn đã mở không xác nhận.
  - id: n10
    cau: "Từ khoảng thế kỷ 9 trở đi, người ta thêm bè thứ hai (organum), rồi ba, bốn bè: phức điệu ra đời."
    loai: lich-su
    nguon:
      - cod-organum
      - cod-poly
      - lt-2.3
    ket_qua: dung
    ghi_chu: "COD, Organum: c.900 trở đi; Clark: organum, phức điệu."
    luot_2: dung
    luot_2_nguon: [ "https://www.Britannica.Com/art/organum", "https://nerd.wwnorton.com/ebooks/epub/concisehwm5anth/EPUB/content/1.3.1-chapter03.xhtml" ]
    luot_2_ghi_chu: Organum bắt đầu thế kỷ 9 (Musica enchiriadis, khoảng 900); Notre-Dame có organum 3, 4 bè.
  - id: n11
    cau: Trường phái Notre-Dame ở Paris (Léonin, Pérotin), khoảng cuối thế kỷ 12 đến đầu thế kỷ 13, để lại những bộ organum hai bè (Léonin) và bốn bè (Pérotin).
    loai: lich-su
    nguon:
      - cod-notredame
      - brit-leonin
      - brit-perotin
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khoảng cuối thế kỷ 12 viết những bản organum lớn đầu tiên". "Lớn đầu tiên" không kiểm được; khoảng thời gian mở rộng theo Britannica (Pérotin hoạt động quanh 1200) và gắn mỗi người với số bè.'
    luot_2: dung
    luot_2_nguon: [ "https://courses.lumenlearning.com/suny-musicapp-medieval-modern/chapter/perotinus-perotin-e", "https://nerd.wwnorton.com/ebooks/epub/concisehwm5anth/EPUB/content/1.3.1-chapter03.xhtml" ]
    luot_2_ghi_chu: "Léonin: organum duplum hai bè; Pérotin fl. khoảng 1200: ba, bốn bè; Viderunt omnes là organum quadruplum."
  - id: n12
    cau: "Thế kỷ 14 (Ars nova): ký âm tiết tấu tinh vi hơn, nhạc thế tục phát triển; Machaut viết một trong những bản thánh lễ đa âm hoàn chỉnh đầu tiên của một tác giả."
    loai: lich-su
    nguon:
      - cod-arsnova
      - cod-machaut
      - brit-machaut
    ket_qua: dung
    ghi_chu: "COD, Ars nova và Machaut: Messe de Nostre Dame là bản thánh lễ đa âm trọn vẹn đầu tiên của một tác giả được biết."
    luot_2: dung
    luot_2_nguon: [ "https://courses.lumenlearning.com/suny-musicapp-medieval-modern/chapter/guillaume-de-machaut-e/" ]
    luot_2_ghi_chu: Machaut thuộc ars nova; Messe de Nostre Dame là "first complete setting of the Ordinary of the mass by a single composer that has survived".
  - id: n13
    cau: "Một giai điệu viết theo kiểu thánh ca: một bè, không nhịp đều, điệu thức Dorian, giai điệu đi chủ yếu từng bước."
    loai: cau-truc
    nguon:
      - abc
      - omt-modes
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhiều nốt trên một âm tiết" (khối abc không có lời nên không kiểm được). Chữ mới kiểm được trên khối: K:D dorian, M:none, hầu hết các bước là bậc liền kề (chỉ có hai bước nhảy ba D–F, A–c). Review D5-gom: giữ. Đã đọc khối abc trên trang: một bè, M:none, K:D dorian (Si tự nhiên, Đô tự nhiên); đa số bước đi liền bậc. Ghi chú lượt 1 nói "chỉ có hai bước nhảy ba" là thiếu: có bốn bước nhảy quãng ba (Rê–Fa, La–Đô ở ô 2, La–Fa qua vạch ô, Sol–Mi), so với khoảng 26 bước liền bậc; câu "chủ yếu từng bước" vẫn đúng.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Ví dụ soạn trên khuông (giai điệu kiểu thánh ca, điệu thức Dorian, đi từng bước): không xem được khuông từ danh sách."
