nhan_dinh:
  - id: n1
    cau: Thời Trung cổ (khoảng 500–1400)
    loai: nam
    nguon:
      - lt-2.2
      - cod-plainsong
    ket_qua: dung
    ghi_chu: Mốc thời kỳ là quy ước của site (Clark, mục 2.2 dùng khoảng 500–1400); các nguồn lệch nhau vài chục năm (ghi ở mục Nguồn của trang lich-su/index).
  - id: n2
    cau: Ở châu Âu thời Trung cổ, nhà thờ và các triều đình quý tộc để lại dấu ấn lớn trong âm nhạc.
    loai: lich-su
    nguon:
      - lt-2.3
      - lt-2.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhà thờ là trung tâm của học vấn, và cũng là nơi âm nhạc được ghi chép, giảng dạy, bảo tồn". Clark có hai mục, Christian Worship (2.3) và Medieval Courts (2.4); "trung tâm của học vấn" và "bảo tồn" không có ở nguồn đã mở, nên đổi sang câu nói đúng điều hai mục ấy nêu.'
  - id: n3
    cau: Một phần lớn âm nhạc còn lại đến ngày nay là nhạc phụng vụ, hát trong thờ phụng.
    loai: lich-su
    nguon:
      - lt-2.3
      - cod-plainsong
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phần lớn ... hát trong thánh lễ và các giờ kinh của tu viện". Bỏ "Phần lớn" thành "Một phần lớn" và bỏ "giờ kinh của tu viện" vì nguồn đã mở không nêu mức đó.'
  - id: n4
    cau: Bên ngoài nhà thờ có âm nhạc thế tục của các nhà thơ – nhạc sĩ hát rong (troubadour ở vùng Provence miền Nam nước Pháp, trouvère ở miền Bắc, Minnesinger ở Đức).
    loai: lich-su
    nguon:
      - brit-troubadour
      - brit-trouvere
      - brit-minnesinger
      - cod-troub
      - lt-2.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "các hát rong ... nhưng được ghi lại ít hơn nhiều". Bỏ vế "ghi lại ít hơn nhiều" (không nguồn đã mở so mức ghi chép); thêm Provence cho troubadour (Britannica, Troubadour).'
  - id: n5
    cau: "Đây cũng là thời ký âm ra đời: từ những dấu hiệu gợi nhớ hướng đi của giai điệu (neume) ..."
    loai: lich-su
    nguon:
      - cod-neume
      - brit-guido
    ket_qua: dung
    ghi_chu: "COD, Neume: neume là ký hiệu gợi hướng đi của giai điệu, tiền thân của khuông nhạc."
  - id: n6
    cau: đến khuông nhạc bốn dòng, thường được ghi công cho Guido d'Arezzo (thế kỷ 11).
    loai: lich-su
    nguon:
      - cod-guido
      - brit-guido
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"khuông nhạc nhiều dòng mà Guido d'Arezzo mô tả khoảng năm 1025\". Mốc \"1025\" và \"mô tả\" không chốt được ở nguồn đã mở; đổi sang \"thường được ghi công\" và thế kỷ 11 (Guido sống thế kỷ 11 theo COD/Britannica)."
  - id: n7
    cau: Ông cũng đặt ra các âm tiết ut – re – mi… để dạy hát, tiền thân của Đô Rê Mi.
    loai: lich-su
    nguon:
      - cod-guido
      - cod-solm
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ liệt kê "ut – re – mi – fa – sol – la". Rút gọn bằng "…"; COD, Solmization: ut–re–mi–fa–sol–la gắn với Guido, là gốc của Đô Rê Mi.'
  - id: n8
    cau: "Thánh ca Gregorian: một bè giai điệu (đơn âm), hát không đệm, tiếng Latin, nhịp tự do theo lời."
    loai: dinh-nghia
    nguon:
      - cod-greg
      - cod-plainsong
      - brit-greg
    ket_qua: dung
  - id: n9
    cau: Dùng các điệu thức nhà thờ.
    loai: lich-su
    nguon:
      - cod-modesec
      - omt-modes
    ket_qua: da-sua
    ghi_chu: Chữ cũ thêm ", chưa có trưởng – thứ". Không nguồn đã mở nói điều này theo cách kiểm được (Britannica, Mode, chỉ đọc được đề mục), nên bỏ vế đó.
  - id: n10
    cau: "Từ khoảng thế kỷ 9 trở đi, người ta thêm bè thứ hai (organum), rồi ba, bốn bè: phức điệu ra đời."
    loai: lich-su
    nguon:
      - cod-organum
      - cod-poly
      - lt-2.3
    ket_qua: dung
    ghi_chu: "COD, Organum: c.900 trở đi; Clark: organum, phức điệu."
  - id: n11
    cau: Trường phái Notre-Dame ở Paris (Léonin, Pérotin), khoảng cuối thế kỷ 12 đến đầu thế kỷ 13, để lại những bộ organum hai bè (Léonin) và bốn bè (Pérotin).
    loai: lich-su
    nguon:
      - cod-notredame
      - brit-leonin
      - brit-perotin
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khoảng cuối thế kỷ 12 viết những bản organum lớn đầu tiên". "Lớn đầu tiên" không kiểm được; khoảng thời gian mở rộng theo Britannica (Pérotin hoạt động quanh 1200) và gắn mỗi người với số bè.'
  - id: n12
    cau: "Thế kỷ 14 (Ars nova): ký âm tiết tấu tinh vi hơn, nhạc thế tục phát triển; Machaut viết một trong những bản thánh lễ đa âm hoàn chỉnh đầu tiên của một tác giả."
    loai: lich-su
    nguon:
      - cod-arsnova
      - cod-machaut
      - brit-machaut
    ket_qua: dung
    ghi_chu: "COD, Ars nova và Machaut: Messe de Nostre Dame là bản thánh lễ đa âm trọn vẹn đầu tiên của một tác giả được biết."
  - id: n13
    cau: "Một giai điệu viết theo kiểu thánh ca: một bè, không nhịp đều, điệu thức Dorian, giai điệu đi chủ yếu từng bước."
    loai: cau-truc
    nguon:
      - abc
      - omt-modes
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhiều nốt trên một âm tiết" (khối abc không có lời nên không kiểm được). Chữ mới kiểm được trên khối: K:D dorian, M:none, hầu hết các bước là bậc liền kề (chỉ có hai bước nhảy ba D–F, A–c).'
  - id: n14
    cau: Giọng hát là chính. Nhạc cụ thời đó có đàn lute, đàn vielle, kèn shawm và đàn organ.
    loai: lich-su
    nguon:
      - lt-2.4
      - lumen-med
      - cod-vielle
      - brit-shawm
      - brit-organ
    ket_qua: da-sua
    ghi_chu: Chữ cũ liệt kê thêm đàn harp, sáo, trống nhỏ và nói vielle là "tổ tiên của các đàn kéo vĩ"; các mục này không có ở nguồn đã mở (hoặc nguồn nói khác) nên bỏ.
  - id: n15
    cau: Đàn vielle là tên gọi thời Trung cổ của nhiều nhạc cụ, như fiddle và hurdy-gurdy.
    loai: dinh-nghia
    nguon:
      - cod-vielle
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tổ tiên của các đàn kéo vĩ". COD, Vielle: tên Pháp thời Trung cổ chỉ fiddle và hurdy-gurdy.'
  - id: n16
    cau: Kèn shawm là tiền thân của oboe.
    loai: lich-su
    nguon:
      - brit-shawm
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "kèn shawm" không giải thích. Britannica, Shawm: shawm là kèn dăm đôi, tổ tiên của oboe.'
  - id: n17
    cau: Đàn organ gắn với nhà thờ từ thế kỷ 10.
    loai: lich-su
    nguon:
      - brit-organ
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đàn organ trong nhà thờ" không có mốc. Britannica, Organ: organ có mặt ở nhà thờ phương Tây từ khoảng thế kỷ 10.'
  - id: n18
    cau: "Thánh ca Gregorian: Kyrie hoặc Alleluia từ một bản thu của dàn hợp xướng tu viện (tác phẩm 1)."
    loai: ten
    nguon:
      - cod-greg
      - brit-greg
    ket_qua: dung
    ghi_chu: Kyrie và Alleluia là phần thường gặp của thánh ca Gregorian.
  - id: n19
    cau: Hildegard von Bingen, O vis aeternitatis (tác phẩm 2).
    loai: ten
    nguon:
      - imslp-ovis
      - brit-hildegard
      - hildegard-soc
    ket_qua: dung
  - id: n20
    cau: Hildegard von Bingen, Ordo Virtutum, trích đoạn (tác phẩm 3).
    loai: ten
    nguon:
      - imslp-ordo
      - brit-hildegard
    ket_qua: dung
  - id: n21
    cau: Pérotin, Viderunt omnes, organum bốn bè (tác phẩm 4).
    loai: ten
    nguon:
      - brit-perotin
      - cod-notredame
    ket_qua: dung
    ghi_chu: "Britannica, Pérotin: Viderunt omnes (1198?) và Sederunt principes là organum bốn bè."
  - id: n22
    cau: Léonin, Magnus liber organi, các bản organum hai bè, để so sánh với Pérotin (tác phẩm 5).
    loai: ten
    nguon:
      - brit-leonin
      - cod-notredame
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Léonin, Viderunt omnes (organum hai bè)". Viderunt omnes hai bè của Léonin không xác nhận được ở nguồn mở (nổi tiếng là bản bốn bè của Pérotin); Magnus liber organi là bộ organum hai bè gắn tên Léonin (Britannica, COD).'
  - id: n23
    cau: Sumer is icumen in, canon tiếng Anh, thế kỷ 13 (tác phẩm 6).
    loai: ten
    nguon: []
    ket_qua: null
    ghi_chu: 'chưa chắc: chưa mở được mục nguồn riêng để xác nhận "thế kỷ 13" và "canon"; lượt 2 kiểm (COD hoặc Britannica, Sumer is icumen in).'
  - id: n24
    cau: Bernart de Ventadorn, một ca khúc troubadour (tác phẩm 7).
    loai: ten
    nguon:
      - brit-bernart
      - brit-troubadour
    ket_qua: null
    ghi_chu: "chưa chắc: Britannica chỉ đọc được đề mục; Bernart de Ventadorn là troubadour thì có ở mục Troubadour nhưng chưa mở được đoạn nêu tên. Lượt 2 kiểm."
  - id: n25
    cau: Guillaume de Machaut, Messe de Nostre Dame (tác phẩm 8).
    loai: ten
    nguon:
      - cod-machaut
      - brit-machaut
    ket_qua: dung
  - id: n26
    cau: Machaut, Ma fin est mon commencement (tác phẩm 9).
    loai: ten
    nguon:
      - cod-machaut
    ket_qua: da-sua
    ghi_chu: Chữ cũ thêm "ca khúc có thể đọc xuôi ngược" (không nguồn đã mở xác nhận), đã bỏ. Tên bài là rondeau của Machaut (COD, Machaut).
  - id: n27
    cau: Llibre Vermell de Montserrat, bản chép tay các bài ca sùng đạo, khoảng năm 1399 (tác phẩm 10).
    loai: ten
    nguon:
      - cod-llibre
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ca khúc hành hương thế kỷ 14". COD, Llibre Vermell: bản chép tay khoảng 1399 của tu viện Montserrat, các bài ca sùng đạo.'
  - id: n28
