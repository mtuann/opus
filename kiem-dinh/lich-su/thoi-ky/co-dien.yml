    ma_bam: sha256:ddfeb0c875e4d9d7eb8ffa64b6bb79f70097a777c6d603c78e077f31b1661552
    nguoi:
      luot_1: Claude Sonnet 5.5 (D5-L1 lượt 1, phần C)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 5, 29/10/2026; bổ sung sau review)
      review: Claude (review D5-gom, nhóm B, 29/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 5 (D5-L1 đến D5-L3): 7 đúng (2 có điều kiện, đã sửa theo: chữ concerto ở hinh-thuc/index, bỏ hai mốc chưa kiểm trong ghi chú Stravinsky; bỏ link COD Notre Dame school 404), 0 sai, 3 câu về site không kiểm độc lập được trên máy kiểm (người gom kiểm lại, khớp) (bao-cao/d5-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Trang thời kỳ Cổ điển (tầng lõi), 1 khối abc soạn riêng. Nguồn: Kuznetsova (LibreTexts), Freese (Wisconsin), OMT, COD qua Encyclopedia.com, IMSLP (trang tác phẩm); WebFetch ngày 28/10/2026. Britannica không mở được (bị chặn), Mutopia 403 và archive.org không tới được nên không kiểm được K. 545 (đã bỏ khỏi trang). Thuật ngữ trang dùng nhưng chưa có hồ sơ thuật ngữ: đệm Alberti, hòa nhạc công cộng, trường phái Vienna thứ nhất, hỏi – đáp (đoạn nhạc/period), basso continuo, fortepiano. Yêu cầu từ lô trước (grep "lich-su/thoi-ky" trong kiem-dinh/): đang có yêu cầu với trang baroque (25-be-tram-so) và the-ky-20 (32-ky-thuat-the-ky-20), không có yêu cầu riêng với co-dien; mục "Thời kỳ trước/tiếp theo" của trang vẫn trỏ đúng baroque và lang-man. Review D5-gom (29/10/2026): n14, n20 giữ; n39 đổi nhãn thành ve-site; n44 dung (Norton, bản ghi thư viện); các câu ve-site đã kiểm trên trang, dist và site cũ.'
