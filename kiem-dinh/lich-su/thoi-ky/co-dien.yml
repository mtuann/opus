  - id: n14
    cau: Câu nhạc cân đối, thường dài 4 hay 8 ô nhịp.
    loai: cau-truc
    nguon:
      - omt-phr
    ket_qua: da-sua
    ghi_chu: 'OMT: câu dài 4, 8 hoặc 16 ô nhịp. Bản cũ nói "4 + 4", đã sửa thành "thường dài 4 hay 8". Review D5-gom: dung với chữ đã sửa. OMT, The Phrase, Archetypes, and Unique Forms (review đã mở): "A phrase can be any length, but phrases of 4, 8, or 16 measures are particularly common." Trang viết "thường dài 4 hay 8 ô nhịp", nằm trong nguồn; Clark (lượt 2) không nêu số ô, không trái. Giữ da-sua.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chu kỳ 4+4 ô nhịp là mô tả phổ biến nhưng nguồn đã mở (Clark) không nêu số ô; không kiểm được 'thường 4 hay 8'.
