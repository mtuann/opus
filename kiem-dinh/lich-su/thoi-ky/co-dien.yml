    ghi_chu: "Soạn cho trang. K:C, M:4/4, L:1/8, 8 ô. Mỗi ô đủ 8 nốt móc đơn. Tay phải: 2 câu 4 ô (câu 1 dừng Re trên Sol, câu 2 dừng Do). Tay trái, bản cũ sai (ví dụ ô 2 là F,A,CA, không phải mẫu Alberti và sai bậc hợp âm); đã sửa thành mẫu thấp–cao–giữa–cao: C,G,E,G, (I), F,CA,C (IV), E,CG,C (I6), G,,D,B,,D, (V). Hòa âm: I | IV I6 | IV I | V ; I | IV I6 | ii V | I. Khớp n13, n20. Review D5-gom: đã tự kiểm lại (xem n20): đủ phách, mẫu Alberti, nửa kết ô 4, kết hoàn toàn ô 8."
doi_chu:
  - cu: "Thời Khai sáng: lý trí, sự rõ ràng, tính tự nhiên. Tầng lớp trung lưu lớn mạnh, hòa nhạc công cộng có bán vé xuất hiện ở London, Paris, Vienna; người nghiệp dư mua bản nhạc in và chơi piano tại nhà. Nhạc sĩ dần chuyển từ người làm công cho quý tộc sang nghệ sĩ tự do: Haydn phục vụ gia đình Esterházy gần 30 năm, Mozart rời Salzburg đến Vienna làm nghề tự do, Beethoven sống bằng tiền tài trợ, học trò và xuất bản."
    moi: "Thời Khai sáng, khuyến khích tư duy khoa học; âm nhạc chuộng sự cân đối, đối xứng và giản dị. Âm nhạc rời cung đình và nhà thờ để đến với hòa nhạc công cộng (ở London, Paris, Vienna) và gia đình trung lưu; người nghiệp dư mua bản nhạc in và chơi piano tại nhà. Nhạc sĩ dần chuyển từ người làm công cho quý tộc sang nghệ sĩ tự do: Haydn phục vụ gia đình Esterházy gần 30 năm, Mozart rời Salzburg đến Vienna làm nghề tự do, Beethoven sống bằng tiền tài trợ, học trò và xuất bản."
    ly_do: 'n2 (da-sua): nguồn không nói "có bán vé" hay "trung lưu lớn mạnh"; mô tả viết lại khớp mục Bối cảnh.; n5 (da-sua): nguồn nói về hòa nhạc công cộng và gia đình trung lưu, không đủ để khẳng định "có bán vé" hay "trung lưu lớn mạnh" như câu cũ; n3, n4 viết lại theo Kuznetsova và Freese.'
  - cu:
      - "Giai điệu rõ ràng, có đệm: một giai điệu chính, bè dưới đệm hợp âm (như kiểu đệm Alberti trong Mozart K. 545), khác với phức điệu Baroque."
      - "Câu nhạc cân đối: 4 + 4 ô nhịp, câu hỏi – câu trả lời (xem bài 13)."
      - "Tương phản trong cùng một chương: hai chủ đề với tính cách khác nhau."
    moi:
      - "Giai điệu rõ ràng, có đệm: một giai điệu chính, bè dưới đệm hợp âm (như kiểu đệm Alberti trong ví dụ bên dưới), khác với phức điệu Baroque."
      - "Câu nhạc cân đối: thường dài 4 hay 8 ô nhịp; hai câu ghép thành một đoạn nhạc hỏi – đáp (xem bài 13)."
      - "Tương phản trong cùng một chương: như hai chủ đề khác nhau về tính cách trong hình thức sonata."
    ly_do: "n13 (da-sua): không mở được bản nhạc K. 545 (Mutopia, archive.org bị chặn) nên không xác nhận được chỗ đệm Alberti; chuyển sang ví dụ của chính trang.; n14 (da-sua): OMT nói câu dài 4, 8 hay 16 ô nhịp, không cố định 4 + 4.; n17 (da-sua): gắn tương phản với hình thức sonata cho đúng nguồn."
  - cu: "Piano (fortepiano) thay thế harpsichord. Dàn nhạc giao hưởng được chuẩn hóa: bộ dây, từng cặp sáo, oboe, bassoon, horn, trumpet, timpani; clarinet gia nhập từ cuối thế kỷ 18. Tứ tấu đàn dây trở thành thể loại thính phòng hàng đầu."
    moi: "Piano (fortepiano) thay thế harpsichord. Dàn nhạc giao hưởng được chuẩn hóa: bộ dây, từng cặp sáo, oboe, bassoon, horn, trumpet, timpani; clarinet gia nhập từ cuối thế kỷ 18. Tứ tấu đàn dây là một thể loại thính phòng chính."
    ly_do: 'n25 (da-sua): nguồn không xếp hạng "hàng đầu".'
  - cu: Giao hưởng, concerto cho piano và các nhạc cụ khác, sonata piano, tứ tấu đàn dây, opera (Mozart). Hình thức sonata là khung của hầu hết các chương đầu (xem Hình thức sonata).
    moi: Giao hưởng, concerto cho piano và các nhạc cụ khác, sonata piano, tứ tấu đàn dây, opera (Mozart). Hình thức sonata là khung thường dùng cho chương đầu (xem Hình thức sonata).
    ly_do: 'n27 (da-sua): "hầu hết" quá mạnh so với nguồn.'
  - cu: 'Cách nghe: đếm ô nhịp theo nhóm 4. Bạn sẽ thấy câu nhạc Cổ điển gần như luôn chia đôi rất đều, và cảm giác "hỏi – đáp" ở cuối mỗi cặp câu.'
    moi: 'Cách nghe: đếm ô nhịp theo nhóm 4. Bạn sẽ thấy câu nhạc Cổ điển thường chia đôi khá đều, và cảm giác "hỏi – đáp" ở cuối mỗi cặp câu.'
    ly_do: "n40 (khuyen-tap): hạ giọng cho khớp n14, n15."
  - cu:
      - Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music.
      - Grove Music Online; Encyclopaedia Britannica. Xem tài liệu tham khảo.
    moi:
      - "Mốc năm là quy ước của site: The Concise Oxford Dictionary of Music ghi thời kỳ Cổ điển khoảng 1750–1830 (Classical, qua Encyclopedia.com); giáo trình của Kuznetsova ghi khoảng 1750–1820."
      - "Kuznetsova, Music Appreciation II, chương 13–15 (LibreTexts): tổng quan thời Cổ điển, dàn nhạc, Haydn, Mozart, Beethoven."
      - 'Freese, People and Music, chương 4 "The Classical Era" (Đại học Wisconsin): Khai sáng, hòa nhạc công cộng, nhạc sĩ tự do, "trường phái Vienna thứ nhất".'
      - "Open Music Theory, chương The Phrase, Archetypes, and Unique Forms: câu dài 4, 8 hay 16 ô nhịp; đoạn nhạc gồm câu hỏi và câu trả lời."
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: Alberti bass, Concert, Clarinet, Pre-classical."
      - "IMSLP, trang tác phẩm: C. P. E. Bach, Sinfonia cung Si thứ, Wq. 182/5, Gluck, Orfeo ed Euridice, Haydn, Giao hưởng số 94, Haydn, Tứ tấu Hob. III:77, Mozart, K. 525, K. 550, K. 467, Beethoven, Op. 13."
      - "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music. Xem tài liệu tham khảo."
    ly_do: "n1 (da-sua): Nguồn cũ chỉ nêu tên chung; thay bằng nguồn cụ thể có liên kết và nói rõ mốc năm là quy ước của site."
