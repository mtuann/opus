nhan_dinh:
  - id: n1
    cau: Thời Cổ điển khoảng 1750–1820 (tiêu đề).
    loai: nam
    nguon:
      - cod-class
      - kuz-ov
    ket_qua: da-sua
    ghi_chu: "Mốc là quy ước của site, đã nói ở mục Nguồn: COD ghi khoảng 1750–1830, Kuznetsova ghi khoảng 1750–1820. Trang piano/the-loai và nhac-ly không nêu mốc khác. Trang không có năm sinh–mất nhà soạn nhạc nào để đối chiếu nha-soan-nhac.yml."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/05%3A_Music_of_the_Classical_Period/5.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: khoảng 1750–1815; nguồn khác thường kéo đến 1820, câu có 'khoảng'."
  - id: n2
    cau: "Mô tả (description): thời Khai sáng, âm nhạc chuộng sự cân đối, đối xứng và giản dị; hòa nhạc công cộng ở London, Paris, Vienna; người nghiệp dư mua nhạc in và chơi piano tại nhà."
    loai: lich-su
    nguon:
      - wis4
      - kuz-ov
      - cod-conc
    ket_qua: da-sua
    ghi_chu: Mô tả rút gọn của mục Bối cảnh (n3 đến n6). Bản cũ nói "lý trí, sự rõ ràng, tính tự nhiên", "trung lưu lớn mạnh", "có bán vé"; nguồn đã mở không nói vậy nên viết lại cho khớp phần thân.
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/05%3A_Music_of_the_Classical_Period/5.01%3A_Introduction_and_Historical_Context", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/05%3A_Music_of_the_Classical_Period/5.02%3A_Music_in_the_Classical_period" ]
