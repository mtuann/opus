ghi_chu: 'Trang thời kỳ Cổ điển (tầng lõi), 1 khối abc soạn riêng. Nguồn: Kuznetsova (LibreTexts), Freese (Wisconsin), OMT, COD qua Encyclopedia.com, IMSLP (trang tác phẩm); WebFetch ngày 28/10/2026. Britannica không mở được (bị chặn), Mutopia 403 và archive.org không tới được nên không kiểm được K. 545 (đã bỏ khỏi trang). Thuật ngữ trang dùng nhưng chưa có hồ sơ thuật ngữ: đệm Alberti, hòa nhạc công cộng, trường phái Vienna thứ nhất, hỏi – đáp (đoạn nhạc/period), basso continuo, fortepiano. Yêu cầu từ lô trước (grep "lich-su/thoi-ky" trong kiem-dinh/): đang có yêu cầu với trang baroque (25-be-tram-so) và the-ky-20 (32-ky-thuat-the-ky-20), không có yêu cầu riêng với co-dien; mục "Thời kỳ trước/tiếp theo" của trang vẫn trỏ đúng baroque và lang-man.'
