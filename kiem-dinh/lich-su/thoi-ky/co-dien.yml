nhan_dinh:
  - id: n1
    cau: Thời Cổ điển khoảng 1750–1820 (tiêu đề).
    loai: nam
    nguon:
      - cod-class
      - kuz-ov
    ket_qua: da-sua
    ghi_chu: "Mốc là quy ước của site, đã nói ở mục Nguồn: COD ghi khoảng 1750–1830, Kuznetsova ghi khoảng 1750–1820. Trang piano/the-loai và nhac-ly không nêu mốc khác. Trang không có năm sinh–mất nhà soạn nhạc nào để đối chiếu nha-soan-nhac.yml."
  - id: n2
    cau: "Mô tả (description): thời Khai sáng, âm nhạc chuộng sự cân đối, đối xứng và giản dị; hòa nhạc công cộng ở London, Paris, Vienna; người nghiệp dư mua nhạc in và chơi piano tại nhà."
    loai: lich-su
    nguon:
      - wis4
      - kuz-ov
      - cod-conc
    ket_qua: da-sua
    ghi_chu: Mô tả rút gọn của mục Bối cảnh (n3 đến n6). Bản cũ nói "lý trí, sự rõ ràng, tính tự nhiên", "trung lưu lớn mạnh", "có bán vé"; nguồn đã mở không nói vậy nên viết lại cho khớp phần thân.
  - id: n3
    cau: Thời Khai sáng khuyến khích tư duy khoa học.
    loai: lich-su
    nguon:
      - wis4
      - kuz-ov
    ket_qua: da-sua
    ghi_chu: Lượt 1 viết lại đoạn Bối cảnh theo Kuznetsova (khóa học mở) và tài liệu Wisconsin (nguồn trong danh sách); chữ cũ ở doi_chu của hồ sơ (mục Bối cảnh).
  - id: n4
    cau: Âm nhạc thời này chuộng sự cân đối, đối xứng và giản dị.
    loai: lich-su
    nguon:
      - kuz-ov
      - wis4
    ket_qua: da-sua
    ghi_chu: Lượt 1 viết lại đoạn Bối cảnh theo Kuznetsova (khóa học mở) và tài liệu Wisconsin (nguồn trong danh sách); chữ cũ ở doi_chu của hồ sơ (mục Bối cảnh).
  - id: n5
    cau: Âm nhạc rời cung đình và nhà thờ để đến với hòa nhạc công cộng (ở London, Paris, Vienna) và gia đình trung lưu.
    loai: lich-su
    nguon:
      - wis4
      - cod-conc
      - kuz-ov
    ket_qua: da-sua
    ghi_chu: 'Câu đã sửa lại cho khớp nguồn: không còn nói trung lưu "lớn mạnh" như bản cũ.'
  - id: n6
    cau: Người nghiệp dư mua bản nhạc in và chơi piano tại nhà.
    loai: lich-su
    nguon:
      - wis4
      - kuz-ov
    ket_qua: dung
  - id: n7
    cau: Nhạc sĩ dần chuyển từ người làm công cho quý tộc sang nghệ sĩ tự do.
    loai: lich-su
    nguon:
      - wis4
      - kuz-ov
    ket_qua: dung
  - id: n8
    cau: Haydn phục vụ gia đình Esterházy gần 30 năm.
    loai: so-lieu
    nguon:
      - kuz-hay
    ket_qua: dung
    ghi_chu: Haydn làm cho gia đình Esterházy từ 1761, 1790 hoàng thân kế vị giải tán dàn nhạc; gần 30 năm.
  - id: n9
    cau: Mozart rời Salzburg đến Vienna làm nghề tự do.
    loai: lich-su
    nguon:
      - kuz-moz
    ket_qua: dung
  - id: n10
    cau: Beethoven sống bằng tiền tài trợ, học trò và xuất bản.
    loai: lich-su
    nguon:
      - kuz-bee
    ket_qua: dung
  - id: n11
    cau: Vienna là trung tâm; Haydn, Mozart, Beethoven được gọi chung là "trường phái Vienna thứ nhất".
    loai: ten
    nguon:
      - wis4
      - kuz-ov
    ket_qua: dung
    ghi_chu: Tên "trường phái Vienna thứ nhất" (First Viennese School) có ở Freese. Cách gọi theo quy ước, không phải một trường phái chính thức.
  - id: n12
    cau: "Giai điệu rõ ràng, có đệm: một giai điệu chính, bè dưới đệm hợp âm, khác với phức điệu Baroque."
    loai: dinh-nghia
    nguon:
      - kuz-ov
      - cod-alb
    ket_qua: dung
  - id: n13
    cau: Kiểu đệm Alberti (hợp âm rải) là cách đệm điển hình; ví dụ bên dưới dùng nó.
    loai: dinh-nghia
    nguon:
      - cod-alb
    ket_qua: da-sua
    ghi_chu: "COD: bè trầm là hợp âm rải theo mẫu thấp – cao – giữa – cao. Ví dụ ở khối 1 khớp (xem khuong_nhac)."
  - id: n14
    cau: Câu nhạc cân đối, thường dài 4 hay 8 ô nhịp.
    loai: cau-truc
    nguon:
      - omt-phr
    ket_qua: da-sua
    ghi_chu: 'OMT: câu dài 4, 8 hoặc 16 ô nhịp. Bản cũ nói "4 + 4", đã sửa thành "thường dài 4 hay 8".'
  - id: n15
    cau: Hai câu ghép thành một đoạn nhạc hỏi – đáp.
    loai: dinh-nghia
    nguon:
      - omt-phr
    ket_qua: dung
    ghi_chu: "OMT: period gồm antecedent (hỏi) và consequent (đáp)."
  - id: n16
    cau: Link [bài 13](/opus/nhac-ly/13-ket/) nói về câu hỏi – đáp.
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/nhac-ly/13-ket.md tồn tại, bài đã chuyển.
  - id: n17
    cau: "Tương phản trong cùng một chương: như hai chủ đề khác nhau về tính cách trong hình thức sonata."
    loai: lich-su
    nguon:
      - kuz-ov
    ket_qua: da-sua
    ghi_chu: Bản cũ nói chung chung "hai chủ đề"; câu mới gắn vào hình thức sonata cho đúng nguồn.
  - id: n18
    cau: "Sắc thái chuyển dần: crescendo, diminuendo thay cho to – nhỏ đột ngột."
    loai: lich-su
    nguon:
      - kuz-ov
      - kuz-orch
    ket_qua: dung
  - id: n19
    cau: Basso continuo dần biến mất.
    loai: lich-su
    nguon:
      - cod-pre
      - kuz-ov
    ket_qua: dung
  - id: n20
    cau: "Đoạn ví dụ do site viết: giai điệu đơn giản, đệm Alberti, hai câu 4 ô nhịp hỏi – đáp."
    loai: cau-truc
    nguon:
      - cod-alb
      - omt-phr
    ket_qua: dung
    ghi_chu: "Đối chiếu khối abc: 8 ô, hai câu 4 ô; câu 1 dừng ở Re (ô 4, trên Sol, nửa kết), câu 2 dừng ở Do (ô 8, kết hoàn toàn). Tay trái toàn hợp âm rải Alberti."
