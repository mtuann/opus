    cau: Hai câu ghép thành một đoạn nhạc hỏi – đáp.
    loai: dinh-nghia
    nguon:
      - omt-phr
    ket_qua: dung
    ghi_chu: "OMT: period gồm antecedent (hỏi) và consequent (đáp)."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/05%3A_Music_of_the_Classical_Period/5.02%3A_Music_in_the_Classical_period" ]
    luot_2_ghi_chu: "Clark: câu hỏi-đáp (antecedent-consequent)."
