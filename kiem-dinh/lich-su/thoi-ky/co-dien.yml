    moi: "mô tả: Thời Khai sáng: âm nhạc chuộng sự cân đối, đối xứng và giản dị. Hòa nhạc công cộng ở London, Paris, Vienna; người nghiệp dư mua nhạc in và chơi piano tại nhà…"
    ly_do: 'n2 (da-sua): mô tả viết lại theo phần Bối cảnh, bỏ "có bán vé", "trung lưu lớn mạnh" (không nguồn).'
