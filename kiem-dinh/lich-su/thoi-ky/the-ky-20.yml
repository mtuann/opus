    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/32%3A_Impressionism_and_Extended_Tonality/32.01%3A_Impressionism", "https://viva.pressbooks.pub/openmusictheorycopy/chapter/collections/", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/09%3A_20th_Century-_Impressionism_Expressionism_and_Twelve-Tone/9.11%3A_Impressionism", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/09%3A_20th_Century-_Impressionism_Expressionism_and_Twelve-Tone/9.12%3A_Claude_Debussy" ]
