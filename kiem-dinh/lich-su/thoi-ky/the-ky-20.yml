    nguoi:
      luot_1: Claude Sonnet 5.5 (D5-L1 lượt 1, phần C)
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: 'Trang Thế kỷ 20 (tầng lõi), 2 khối abc soạn riêng. Nguồn: Jones (LibreTexts), Hutchinson, COD qua Encyclopedia.com, OMT, LoC, Elbphilharmonie, sin80; WebFetch ngày 28/10/2026. Britannica không mở được. Chưa chắc: Boulez, Stockhausen, Cage, Ligeti trong hướng "sau 1945" (n22), tên sách đọc thêm (n43). Lệch dữ liệu: nha-soan-nhac.yml xếp Pärt, Reich, Glass là "Đương đại", trang này liệt họ ở Thế kỷ 20 (n24). Thuật ngữ trang dùng nhưng chưa có hồ sơ thuật ngữ: hợp âm trượt song song (planing), điệu thức, nhạc chuỗi toàn phần, nhạc ngẫu nhiên, tối giản, trường phái Vienna thứ hai, chủ nghĩa hình thức (Liên Xô). Yêu cầu từ lô trước (grep "lich-su/thoi-ky" trong kiem-dinh/): nhac-ly/32 n2 (bảng phong trào có gam toàn cung, nhạc 12 âm, tối giản, ngẫu nhiên) được giữ; lo-trinh-nghe (mục "10 tác phẩm để nghe") được giữ.'
