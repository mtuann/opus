      - loc
    ket_qua: da-sua
    ghi_chu: 'Mô tả viết lại khớp mục Bối cảnh (n3, n4, n6): bỏ "chế độ toàn trị", "khoa học bùng nổ", "thay đổi hoàn toàn".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/07%3A_The_Twentieth_Century_and_Beyond/7.01%3A_Introduction_and_Historical_Context-_1900_to_today" ]
