doi_chu:
  - cu: 'Hai cuộc chiến tranh thế giới, các chế độ toàn trị, khoa học và công nghệ bùng nổ, máy hát, radio, đĩa than, phim ảnh thay đổi hoàn toàn cách con người nghe nhạc. Lần đầu tiên, âm nhạc của mọi thời kỳ và mọi nền văn hóa có thể được nghe lại ở bất cứ đâu. Không còn một "ngữ pháp" chung: mỗi nhà soạn nhạc, mỗi trường phái tự tìm đường riêng. Nhiều nhạc sĩ phải rời bỏ quê hương (Stravinsky, Rachmaninoff, Schoenberg, Bartók); ở Liên Xô, âm nhạc chịu sự kiểm duyệt chính trị (Shostakovich, Prokofiev).'
    moi: 'Hai cuộc chiến tranh thế giới và những biến động chính trị lớn, cùng sự phát triển của công nghệ ghi âm: máy hát, đĩa, radio, phim ảnh thay đổi cách con người nghe nhạc, vì lần đầu tiên một buổi biểu diễn có thể được ghi lại và nghe lại. Không còn một "ngữ pháp" chung: các nhà soạn nhạc đi nhiều hướng khác nhau. Nhiều nhạc sĩ phải rời bỏ quê hương (Stravinsky, Rachmaninoff, Schoenberg, Bartók); ở Liên Xô, âm nhạc chịu sự kiểm soát chính trị: Shostakovich và Prokofiev đều bị lên án là "chủ nghĩa hình thức".'
    ly_do: 'n3, n4, n5 (da-sua): "chế độ toàn trị, khoa học bùng nổ", "hoàn toàn" và "mọi nền văn hóa... bất cứ đâu" không có nguồn đã mở; viết theo LoC Recorded Sound Timeline.; n6 (da-sua): giảm bớt cho khớp nguồn.'
  - cu: Màu sắc âm thanh, hòa âm mơ hồ, gam ngũ cung và gam toàn cung
    moi: Hòa âm mơ hồ về giọng, hợp âm trượt song song, điệu thức, gam toàn cung và gam ngũ cung
    ly_do: 'n9, n10 (da-sua, da-bo): bỏ "màu sắc âm thanh" không có trong định nghĩa nguồn; thêm hợp âm trượt song song và điệu thức theo Hutchinson.'
  - cu: Stravinsky Le Sacre du printemps, Bartók
    moi: Stravinsky Le Sacre du printemps
    ly_do: "n13 (da-sua): Jones xếp Bartók vào hướng Dân tộc."
  - cu: Bỏ hẳn cảm giác giọng chủ; 12 nốt có vai trò ngang nhau
    moi: Không dựa vào giọng chủ; 12 nốt có vai trò gần như ngang nhau
    ly_do: "n14 (da-sua): chính xác hơn."
  - cu: Trở lại hình thức và sự rõ ràng của thế kỷ 18 với hòa âm mới
    moi: Trở lại trật tự, sự cân đối và rõ ràng của nhạc thế kỷ 18, với hòa âm tonal được cập nhật
    ly_do: "n16 (da-sua): khớp Jones 10.01."
  - cu: Ghi âm và nghiên cứu dân ca thật, đưa vào nhạc nghệ thuật
    moi: Dựa vào nhạc dân gian của dân tộc mình; có người thu thập và ghi âm dân ca thật
    ly_do: "n18 (da-sua): khớp Jones."
  - cu:
      - Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music.
      - Grove Music Online; Encyclopaedia Britannica. Xem tài liệu tham khảo.
    moi:
      - Mốc năm là quy ước của site, thống nhất với trang Lịch sử và bài Kỹ thuật thế kỷ 20.
      - "Jones, Music Appreciation I, chương 9–11 (LibreTexts): Music of the 20th Century, Impressionism, Claude Debussy, Arnold Schoenberg, Neoclassicism, Primitivism, The Return of Nationalism, Béla Bartók, Minimalist Music, Holy Minimalism."
      - "Hutchinson, Music Theory for the 21st-Century Classroom, mục Impressionism: điệu thức, hợp âm mở rộng, hợp âm trượt song song ở Debussy và Ravel."
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: Impressionism, Serialism, Stravinsky, Rachmaninov, Bartók, Shostakovich, Prokofiev, Gershwin, Copland, Bernstein, Janáček, Villa-Lobos, Messiaen; Schoenberg, Ravel và Steve Reich, cũng trên Encyclopedia.com."
      - "Thư viện Quốc hội Mỹ, Recorded Sound Timeline: máy hát, đĩa, phim có tiếng."
      - "Elbphilharmonie, Olivier Messiaen im Portrait: Quatuor pour la fin du temps công diễn lần đầu ngày 15/1/1941 trong trại tù binh Stalag VIII A; sin80, trang tác phẩm: sáng tác 1940–1941."
      - "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music. Xem tài liệu tham khảo."
    ly_do: "n1 (dung): Nguồn cũ chỉ nêu tên chung; thay bằng nguồn cụ thể có liên kết."
  - cu: "mô tả: Hai cuộc chiến tranh thế giới, các chế độ toàn trị, khoa học và công nghệ bùng nổ, máy hát, radio, đĩa than, phim ảnh thay đổi hoàn toàn cách con người nghe…"
    moi: "mô tả: Hai cuộc chiến tranh thế giới, những biến động chính trị lớn, công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc, và nhiều hướng sáng tác khác nhau…"
    ly_do: "n2 (da-sua): khớp phần thân đã sửa."
