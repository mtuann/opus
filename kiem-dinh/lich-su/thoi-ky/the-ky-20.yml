    moi: "mô tả: Hai cuộc chiến tranh thế giới, những biến động chính trị lớn, công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc, và nhiều hướng sáng tác khác nhau…"
