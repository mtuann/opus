nhan_dinh:
  - id: n1
    cau: Thế kỷ 20 khoảng 1900–2000 (tiêu đề).
    loai: nam
    nguon:
      - j-20c
    ket_qua: dung
    ghi_chu: Mốc là quy ước của site, thống nhất với src/content/docs/lich-su/index.md (Lãng mạn ~1820–1900, Thế kỷ 20 ~1900–2000, Đương đại 2000–nay) và co-dien (~1750–1820). Trang piano/the-loai và nhac-ly/32 dùng nhãn "Thế kỷ 20" không nêu mốc khác.
  - id: n2
    cau: "Mô tả (description): hai cuộc chiến tranh thế giới, những biến động chính trị lớn, công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc, và nhiều hướng sáng tác khác nhau."
    loai: lich-su
    nguon:
      - j-20c
      - loc
    ket_qua: da-sua
    ghi_chu: 'Mô tả viết lại khớp mục Bối cảnh (n3, n4, n6): bỏ "chế độ toàn trị", "khoa học bùng nổ", "thay đổi hoàn toàn".'
  - id: n3
    cau: Hai cuộc chiến tranh thế giới và những biến động chính trị lớn tác động tới âm nhạc thế kỷ 20.
    loai: lich-su
    nguon:
      - j-20c
    ket_qua: da-sua
    ghi_chu: Bản cũ liệt kê "các chế độ toàn trị, khoa học và công nghệ bùng nổ"; câu mới gọn hơn, chỉ giữ ý nguồn nói.
  - id: n4
    cau: Công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc.
    loai: lich-su
    nguon:
      - loc
      - j-20c
    ket_qua: da-sua
    ghi_chu: 'LoC timeline: máy hát 1877, đĩa, radio, phim có tiếng. Bản cũ: "thay đổi hoàn toàn".'
  - id: n5
    cau: Lần đầu tiên một buổi biểu diễn có thể được ghi lại và nghe lại.
    loai: lich-su
    nguon:
      - loc
    ket_qua: da-sua
    ghi_chu: Thay cho câu cũ "âm nhạc của mọi thời kỳ và mọi nền văn hóa có thể được nghe lại ở bất cứ đâu" (không nguồn, quá rộng).
  - id: n6
    cau: 'Không còn một "ngữ pháp" chung: các nhà soạn nhạc đi nhiều hướng khác nhau.'
    loai: lich-su
    nguon:
      - j-20c
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "mỗi nhà soạn nhạc, mỗi trường phái tự tìm đường riêng".'
  - id: n7
    cau: Nhiều nhạc sĩ phải rời bỏ quê hương (Stravinsky, Rachmaninoff, Schoenberg, Bartók).
    loai: lich-su
    nguon:
      - c-stra
      - c-rach
      - c-sch
      - c-bar
    ket_qua: dung
    ghi_chu: Rachmaninoff và Stravinsky rời Nga sau 1917, Schoenberg rời Đức 1933, Bartók sang Mỹ 1940.
  - id: n8
    cau: 'Ở Liên Xô, âm nhạc chịu sự kiểm soát chính trị: Shostakovich và Prokofiev đều bị lên án là "chủ nghĩa hình thức".'
    loai: lich-su
    nguon:
      - c-sho
      - c-pro
    ket_qua: dung
    ghi_chu: "COD: Shostakovich 1936 và 1948, Prokofiev 1948."
  - id: n9
    cau: "Ấn tượng: hòa âm mơ hồ về giọng, hợp âm trượt song song, điệu thức, gam toàn cung và gam ngũ cung."
    loai: dinh-nghia
    nguon:
      - j-imp
      - mt-imp
      - c-imp
      - omt-col
    ket_qua: da-sua
    ghi_chu: 'Hutchinson: điệu thức, hợp âm mở rộng, hợp âm trượt song song. Bản cũ có "màu sắc âm thanh" (xem n10).'
  - id: n10
    cau: Ấn tượng gắn với "màu sắc âm thanh".
    loai: dinh-nghia
    ket_qua: da-bo
    ghi_chu: Cụm "màu sắc âm thanh" không có trong định nghĩa các nguồn dùng; bỏ khỏi bảng (mục Cách nghe vẫn hỏi "Màu sắc (Debussy)?" như lời khuyên).
  - id: n11
    cau: "Ấn tượng: Debussy, Ravel."
    loai: ten
    nguon:
      - c-imp
      - c-rav
      - j-deb
    ket_qua: dung
  - id: n12
    cau: "Nguyên thủy, tiết tấu: tiết tấu dồn dập, trọng âm bất thường, nghịch tai mạnh."
    loai: dinh-nghia
    nguon:
      - j-prim
      - c-stra
    ket_qua: dung
  - id: n13
    cau: "Nguyên thủy, tiết tấu: Stravinsky, Le Sacre du printemps."
    loai: ten
    nguon:
      - j-prim
      - c-stra
    ket_qua: da-sua
    ghi_chu: Bản cũ thêm Bartók vào hàng này; Jones xếp Bartók ở Dân tộc (n18), nên bỏ khỏi đây.
  - id: n14
    cau: "Vô điệu tính, 12 âm: không dựa vào giọng chủ; 12 nốt có vai trò gần như ngang nhau."
    loai: dinh-nghia
    nguon:
      - j-sch
      - c-ser
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "Bỏ hẳn cảm giác giọng chủ; ngang nhau". "Gần như" cho chính xác hơn.'
  - id: n15
    cau: 'Vô điệu tính, 12 âm: Schoenberg, Berg, Webern ("trường phái Vienna thứ hai").'
    loai: ten
    nguon:
      - j-sch
      - c-ser
      - c-sch
    ket_qua: dung
    ghi_chu: Nhất quán tên "trường phái Vienna thứ nhất" ở co-dien (cách gọi theo quy ước).
  - id: n16
    cau: "Tân cổ điển: trở lại trật tự, sự cân đối và rõ ràng của nhạc thế kỷ 18, với hòa âm tonal được cập nhật."
    loai: dinh-nghia
    nguon:
      - j-neo
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "hình thức và sự rõ ràng của thế kỷ 18 với hòa âm mới".'
  - id: n17
    cau: "Tân cổ điển: Stravinsky, Pulcinella; Prokofiev, Giao hưởng số 1."
    loai: ten
    nguon:
      - j-neo
      - c-stra
      - c-pro
    ket_qua: dung
  - id: n18
    cau: "Dân tộc: dựa vào nhạc dân gian của dân tộc mình; có người thu thập và ghi âm dân ca thật."
    loai: dinh-nghia
    nguon:
      - j-nat
      - j-bar
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "Ghi âm và nghiên cứu dân ca thật, đưa vào nhạc nghệ thuật"; Jones: Bartók (và Kodály) thu thập dân ca.'
  - id: n19
    cau: "Dân tộc: Bartók, Kodály, Janáček, Villa-Lobos."
    loai: ten
    nguon:
      - j-bar
      - j-nat
      - c-bar
      - c-jan
      - c-vl
    ket_qua: dung
    ghi_chu: Kodály xuất hiện cùng Bartók ở Jones 10.09; COD không có mục riêng trong danh sách nguồn.
  - id: n20
    cau: "Nhạc Mỹ: ảnh hưởng jazz, nhạc dân gian Mỹ, nhạc kịch; Gershwin, Copland, Bernstein."
    loai: lich-su
    nguon:
      - c-ger
      - c-cop
      - c-ber
      - j-20c
    ket_qua: dung
  - id: n21
    cau: "Tiên phong sau 1945: nhạc chuỗi toàn phần, nhạc điện tử, nhạc ngẫu nhiên."
    loai: danh-muc
    nguon:
      - c-ser
      - j-20c
    ket_qua: dung
    ghi_chu: "Yêu cầu lô trước (nhac-ly/32 n2: trang này nhắc gam toàn cung, nhạc 12 âm, tối giản, ngẫu nhiên) được giữ."
  - id: n22
    cau: "Tiên phong sau 1945: Messiaen, Boulez, Stockhausen, Cage, Ligeti."
    loai: ten
    nguon:
      - c-mes
    ket_qua: null
    ghi_chu: 'chưa chắc: chỉ kiểm được Messiaen (COD). Boulez, Stockhausen, Cage, Ligeti là tên chuẩn của hướng này nhưng chưa mở nguồn nào nêu từng người trong hướng "sau 1945". Messiaen thường nằm ở khoảng 1940 đến 1949 nên "sau 1945" hơi lỏng.'
  - id: n23
    cau: "Tối giản: mẫu ngắn lặp lại, biến đổi rất chậm."
    loai: dinh-nghia
    nguon:
      - j-min
      - c-rei
    ket_qua: dung
  - id: n24
    cau: 'Tối giản: Reich, Glass, Riley; "tối giản thần thánh" của Pärt, Górecki.'
    loai: ten
    nguon:
      - j-min
      - j-holy
      - c-rei
    ket_qua: dung
    ghi_chu: 'Lệch dữ liệu: src/data/nha-soan-nhac.yml xếp Pärt, Reich, Glass vào thoi_ky "Đương đại", trang này xếp họ vào Thế kỷ 20. Không mâu thuẫn thực chất (hoạt động từ thập niên 1960 đến nay), cần người giao quyết định nhãn.'
  - id: n25
    cau: "Đoạn ví dụ Ấn tượng do site viết: hợp âm trượt song song trên một nốt trầm giữ suốt."
    loai: cau-truc
    nguon:
      - mt-imp
    ket_qua: dung
    ghi_chu: "Đối chiếu khối abc 1: tay trái Do trầm (C,,) nối bằng dấu luyến suốt 4 ô; tay phải các hợp âm bảy chồng quãng ba Rê thứ7, Mi thứ7, Fa trưởng7, Mi thứ7 | Rê thứ7, Đô trưởng7, Rê thứ7. Đây là hợp âm trượt song song theo giọng (diatonic planing), không giữ nguyên chất lượng hợp âm: Hutchinson cũng gọi planing theo giọng."
  - id: n26
    cau: Link [So sánh các thời kỳ](/opus/nhan-dien/so-sanh-thoi-ky/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: Trang đích chưa chuyển; ../opus-zero/docs/nhan-dien/so-sanh-thoi-ky.md có tồn tại.
  - id: n27
    cau: "Đoạn ví dụ Tối giản do site viết: một mẫu ngắn lặp lại, thay đổi từng nốt một."
