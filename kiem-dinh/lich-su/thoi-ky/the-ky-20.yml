    ghi_chu: 'chưa chắc: chỉ kiểm được Messiaen (COD). Boulez, Stockhausen, Cage, Ligeti là tên chuẩn của hướng này nhưng chưa mở nguồn nào nêu từng người trong hướng "sau 1945". Messiaen thường nằm ở khoảng 1940 đến 1949 nên "sau 1945" hơi lỏng. Review D5-gom: dung, giữ dòng "Tiên phong sau 1945" (nhạc chuỗi toàn phần, nhạc điện tử, nhạc ngẫu nhiên). Nguồn review đã mở: COD Serialism: "The next stage in serialism was foreshadowed in 1944 by Messiaen"; vào thập niên 1950 "several components (parameters) of a work were being serialized by, for example, Babbitt, Boulez, and Stockhausen" (tức nhạc chuỗi toàn phần); Jones 11.03: "John Cage became a strong proponent of aleatoric techniques", Music of Changes (1951); Jones 11.17: Ligeti "one of the most important avant-garde composers in the latter half of the twentieth century", gặp Stockhausen khi ông "working on groundbreaking electronic music". Messiaen mở đường từ 1944–1949, nên xếp ở hàng này hợp với COD. Lượt 2 (Britannica Boulez, Stockhausen) cũng dung.'
