nhan_dinh:
  - id: n1
    cau: Thế kỷ 20 khoảng 1900–2000 (tiêu đề).
    loai: nam
    nguon:
      - j-20c
    ket_qua: dung
    ghi_chu: Mốc là quy ước của site, thống nhất với src/content/docs/lich-su/index.md (Lãng mạn ~1820–1900, Thế kỷ 20 ~1900–2000, Đương đại 2000–nay) và co-dien (~1750–1820). Trang piano/the-loai và nhac-ly/32 dùng nhãn "Thế kỷ 20" không nêu mốc khác.
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/07%3A_The_Twentieth_Century_and_Beyond/7.01%3A_Introduction_and_Historical_Context-_1900_to_today" ]
    luot_2_ghi_chu: "Clark: 'from 1900 to today'; 'khoảng 1900–2000' hợp lý."
  - id: n2
    cau: "Mô tả (description): hai cuộc chiến tranh thế giới, những biến động chính trị lớn, công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc, và nhiều hướng sáng tác khác nhau."
    loai: lich-su
