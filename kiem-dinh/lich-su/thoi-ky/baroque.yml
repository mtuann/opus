    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.40%3A_Doctrine_of_the_Affections" ]
    luot_2_ghi_chu: "Jones: một affect cho mỗi chương là đặc trưng, tuy Bach có thể đổi affect trong chương."
  - id: n19
    cau: "Đoạn do site viết để minh họa: chuyển động móc đơn liên tục, chuỗi giai điệu đi xuống, bè trầm đi đều, láy rền ở kết."
    loai: cau-truc
    nguon:
      - abc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "theo đặc trưng Baroque: chuyển động móc kép liên tục". Khối abc dùng L:1/16 nhưng nốt là bước 2/16 = móc đơn (thuat-ngu và bài 3: móc đơn = eighth), nên "móc kép" sai; đã sửa thành "móc đơn". Phần "chuỗi đi xuống" đổi "chuỗi giai điệu đi xuống"; "để minh họa" thay cho "theo đặc trưng Baroque".'
    luot_2: khong-chac
    luot_2_ghi_chu: Đoạn do site viết, không có nguồn ngoài để kiểm; không mở trang/khuông nên không đối chiếu được với bản trên khuông.
  - id: n20
