nhan_dinh:
  - id: n1
    cau: Thời Baroque (khoảng 1600–1750)
    loai: nam
    nguon:
      - cod-baroque
      - lt-4.2
    ket_qua: dung
    ghi_chu: "Mốc là quy ước của site. COD, Baroque: khoảng 1600 đến 1750 (có chỗ 1759, Handel mất); Clark chương 4: 1600–1750."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.01%3A_Introduction_and_Historical_Context", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.37%3A_The_Baroque_Period" ]
    luot_2_ghi_chu: Hai nguồn cùng ghi khoảng 1600–1750.
  - id: n2
    cau: Thời của các vương triều chuyên chế (Louis XIV ở Pháp) và của cuộc xung đột giữa Cải cách và Phản Cải cách.
    loai: lich-su
    nguon:
      - lt-4.2
      - lumen-bar
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Louis XIV ở Versailles, nhà thờ Công giáo lộng lẫy sau Phản Cải cách, các thành phố buôn bán giàu có". "Lộng lẫy" và "thành phố buôn bán giàu có" không kiểm được; Versailles không cần cho nhận định. Giữ chuyên chế/Louis XIV/Cải cách và Phản Cải cách theo Clark 4.1–4.2.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: Louis XIV trị vì 1643–1715, quân chủ chuyên chế; xung đột Cải cách/Phản Cải cách nằm trong bối cảnh thời kỳ."
  - id: n3
    cau: "Nhạc sĩ thường là người làm công: cho nhà thờ (Bach ở Leipzig)."
    loai: lich-su
    nguon:
      - lt-4.6
    ket_qua: dung
    ghi_chu: "Clark, 4.6: Bach ở Leipzig (Thomaskantor từ 1723)."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.06%3A_Music_of_Johann_Sebastian_Bach_(1685-1750)", "https://smithsonianassociates.org/ticketing/attachments/264655/pdf/Masterworks-Choral-Tradition-Bach-Handout" ]
    luot_2_ghi_chu: Bach làm Thomaskantor ở Leipzig từ 1723 và viết cantata cho nhà thờ Luther.
  - id: n4
    cau: Cho triều đình (Lully, nhà soạn nhạc triều đình Pháp).
    loai: lich-su
    nguon:
      - brit-lully
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lully ở Versailles". Britannica, Lully: nhà soạn nhạc triều đình Louis XIV; nói "ở Versailles" quá cụ thể.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Jean-Baptiste-Lully" ]
    luot_2_ghi_chu: "Britannica: Lully từ 1662 nắm toàn quyền âm nhạc triều đình Pháp."
  - id: n5
    cau: Cho công chúng opera ở London (Handel, người lập đoàn opera riêng).
    loai: lich-su
    nguon:
      - lt-4.5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cho nhà hát opera thương mại (Handel ở London)". Clark, 4.5: Handel lập các công ty opera ở London; bỏ "thương mại" vì không chốt được.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.05%3A_Music_of_George_Frideric_Handel_(1685-1759)", "https://grubstreetproject.net/essays/royal-academy-of-music", "https://courses.lumenlearning.com/rangercollege-musicappreciation/chapter/g-f-handel/" ]
    luot_2_ghi_chu: Handel lập/điều hành đoàn opera Ý ở London (Royal Academy of Music 1719, rồi hai đoàn nữa).
  - id: n6
    cau: Cho Ospedale della Pietà, nhà nuôi trẻ bị bỏ rơi ở Venice (Vivaldi).
    loai: lich-su
    nguon:
      - brit-vivaldi
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "các tổ chức từ thiện (Vivaldi ở trại trẻ mồ côi Pietà, Venice)". Britannica, Vivaldi: Ospedale della Pietà, nhà nuôi trẻ bị bỏ rơi ở Venice; đổi "trại trẻ mồ côi" thành mô tả sát nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Antonio-Vivaldi", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.04%3A_New_Music_for_Instruments" ]
    luot_2_ghi_chu: "Britannica: Vivaldi làm thầy dạy vĩ cầm ở Pietà từ 1703; Clark gọi là nhà nuôi trẻ mồ côi."
  - id: n7
    cau: Chủ nghĩa nhân văn đem lại mối quan tâm mới tới Hy Lạp và La Mã cổ.
    loai: lich-su
    nguon:
      - lt-4.3
    ket_qua: da-sua
    ghi_chu: Câu thêm để làm nền cho đoạn Camerata, theo Clark 4.3 (Birth of Opera).
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: ảnh hưởng văn hóa Hy Lạp/La Mã cổ; thuật ngữ 'chủ nghĩa nhân văn' không có trong nguồn đã mở nhưng ý đúng với nhóm Camerata."
  - id: n8
    cau: "Khoảng năm 1600, ở Florence, nhóm Camerata thử nghiệm kiểu hát lời kịch (recitative): một người hát giai điệu trên phần đệm đơn giản."
    loai: lich-su
    nguon:
      - lt-4.3
      - cod-recit
      - cod-opera
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"ở Florence và Mantua, người ta muốn hồi sinh kịch Hy Lạp cổ bằng cách hát lời kịch trên một bè đệm đơn giản\". Camerata ở Florence (Clark 4.3, COD); Mantua chuyển xuống câu sau (L'Orfeo)."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.03%3A_Birth_of_Opera", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.03%3A_Monody" ]
    luot_2_ghi_chu: "Camerata họp ở nhà một quý tộc Florence, phát triển monody/recitative (Jones: từ thập niên 1580; opera đầu tiên khoảng 1600), một giọng hát trên bè trầm và hợp âm continuo."
  - id: n9
    cau: Từ đó opera ra đời (Monteverdi L'Orfeo, 1607) ...
    loai: nam
    nguon:
      - cod-orfeo
      - imslp-orfeo
      - lt-4.3
    ket_qua: dung
    ghi_chu: L'Orfeo, công diễn 1607 ở Mantua.
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.03%3A_Birth_of_Opera", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.04%3A_Monteverdis_LOrfeo" ]
    luot_2_ghi_chu: Orfeo 1607, Mantua.
  - id: n10
    cau: L'Orfeo viết khi Monteverdi làm việc cho công tước xứ Mantua.
    loai: lich-su
    nguon:
      - cod-orfeo
      - lt-4.3
    ket_qua: da-sua
    ghi_chu: "Câu thêm thay cho \"ở Florence và Mantua\": L'Orfeo viết cho triều Gonzaga, Mantua."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.03%3A_Birth_of_Opera", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.04%3A_Monteverdis_LOrfeo" ]
    luot_2_ghi_chu: Monteverdi làm cho công tước Mantua (Vincenzo Gonzaga) khi viết Orfeo; Tarantino lưu ý Francesco Gonzaga là người đặt cho buổi diễn đầu, không mâu thuẫn.
  - id: n11
    cau: Cách viết "một giai điệu trên một bè trầm" trở thành nền tảng của cả thời kỳ.
    loai: lich-su
    nguon:
      - lt-4.2
      - cod-bc
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.03%3A_Monody", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.39%3A_Basso_Continuo" ]
    luot_2_ghi_chu: "Monody + basso continuo: giai điệu trên bè trầm là nền tảng thời kỳ."
  - id: n12
    cau: "Bè trầm liên tục (basso continuo): một bè trầm (như cello, viola da gamba) cùng một nhạc cụ hòa âm (harpsichord, organ, lute) chơi suốt tác phẩm."
    loai: dinh-nghia
    nguon:
      - cod-bc
      - lt-4.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(cello, bassoon)". COD, Basso continuo: bè trầm có thể do cello, viola da gamba, bassoon...; giữ hai ví dụ chắc chắn. Lời hứa lô trước (bè trầm số, basso continuo, bài 25): vẫn giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.02%3A_Music_in_the_Baroque_Period", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.39%3A_Basso_Continuo" ]
    luot_2_ghi_chu: "Cả hai nguồn: continuo gồm bè trầm (cello, gamba) và nhạc cụ hòa âm (harpsichord, organ, lute)."
  - id: n13
    cau: Bè trầm được ghi bằng bè trầm số, người chơi tự ứng tác hợp âm bên trên.
    loai: dinh-nghia
    nguon:
      - cod-bc
      - omt-figured
    ket_qua: dung
    ghi_chu: 'Điều lô trước (nhac-ly/25-be-tram-so) yêu cầu giữ: mục "Âm thanh đặc trưng" nêu basso continuo ghi bằng bè trầm số. Còn nguyên.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.39%3A_Basso_Continuo" ]
    luot_2_ghi_chu: "Jones: bè trầm số (figured bass), người chơi ứng tác hợp âm."
  - id: n14
    cau: Các giọng trưởng – thứ và những chuỗi hợp âm được dùng ngày càng nhiều (xem bài 12).
    loai: lich-su
    nguon:
      - lt-4.2
      - cod-baroque
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hệ thống trưởng – thứ được xác lập; hòa âm chức năng trở thành ngữ pháp chung". "Được xác lập" và "ngữ pháp chung" mạnh hơn nguồn đã mở; đổi thành mức nguồn nói.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.02%3A_Music_in_the_Baroque_Period", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.37%3A_The_Baroque_Period" ]
    luot_2_ghi_chu: Hệ giọng trưởng-thứ được xác lập thời này.
  - id: n15
    cau: Câu "Nhịp đều, mạnh mẽ, chuyển động liên tục như một cỗ máy".
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: ẩn dụ "cỗ máy" và "nhịp đều, mạnh mẽ" không kiểm được. Đã xem trang: không còn câu.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.02%3A_Music_in_the_Baroque_Period" ]
    luot_2_ghi_chu: "Clark: nhịp điệu rõ, đều, vạch nhịp nổi bật; hình ảnh 'cỗ máy' là cách nói của site, không có trong nguồn."
  - id: n16
