      - brit-vivaldi
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thay thế dần họ viol và trở thành trung tâm của dàn nhạc". "Thay thế dần họ viol" bỏ; Clark 4.4: violin là nền của dàn nhạc Baroque.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/04%3A_Music_of_the_Baroque_Period/4.04%3A_New_Music_for_Instruments", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_I_%28Jones%29/02%3A_Baroque/2.38%3A_More_on_the_Baroque_Period" ]
    luot_2_ghi_chu: "Clark: họ violin là 'xương sống' dàn nhạc Baroque."
