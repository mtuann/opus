khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
    ket_qua: dung
    ghi_chu: 'Soạn cho trang này. K:G, M:4/4, L:1/16: mỗi ô 16 đơn vị 1/16. Bè trên 8 nốt (G B d g f a d f ...) mỗi nốt 2/16 = móc đơn (đã sửa chữ "móc kép" thành "móc đơn", xem doi_chu); bè trầm nốt 4/16 và 8/16. Có !trill! ở ô cuối. Không cảnh báo abcjs; tools/khuong-nhac.mjs: các ô đủ 16/16.'
ghi_chu: "Trang thời kỳ Baroque. Nguồn chính: COD (Baroque, basso continuo, recitative, piano, Orfeo, Dido and Aeneas), Clark chương 4, Britannica (Vivaldi, Lully). Đã sửa/bỏ: mở đầu (Versailles, Pietà, Handel), Camerata, cello/bassoon, trưởng–thứ, nhịp đều (bỏ), affect (bỏ), móc kép thành móc đơn, nhạc cụ phím, piano 1698–1700, dàn nhạc nhỏ, cantata, Orfeo 1607, Dido, mục Nguồn. Chưa chắc: Corelli Op.6 số 8, Rameau Les Sauvages. Mốc 1600–1750 là quy ước của site (COD: có chỗ đến 1759). Lô trước (bài 25, lo-trinh-nghe) yêu cầu giữ basso continuo/bè trầm số và mục 10 tác phẩm: đều còn."
doi_chu:
  - cu:
      - "Thời của các vương triều chuyên chế (Louis XIV ở Versailles), của nhà thờ Công giáo lộng lẫy sau Phản Cải cách và của các thành phố buôn bán giàu có. Nhạc sĩ thường là người làm công: cho nhà thờ (Bach ở Leipzig), cho triều đình (Lully ở Versailles), cho nhà hát opera thương mại (Handel ở London), hay cho các tổ chức từ thiện (Vivaldi ở trại trẻ mồ côi Pietà, Venice)."
      - Khoảng năm 1600, ở Florence và Mantua, người ta muốn hồi sinh kịch Hy Lạp cổ bằng cách hát lời kịch trên một bè đệm đơn giản. Từ đó opera ra đời (Monteverdi L'Orfeo, 1607), và cách viết "một giai điệu trên một bè trầm" trở thành nền tảng của cả thời kỳ.
    moi:
      - "Thời của các vương triều chuyên chế (Louis XIV ở Pháp) và của cuộc xung đột giữa Cải cách và Phản Cải cách. Nhạc sĩ thường là người làm công: cho nhà thờ (Bach ở Leipzig), cho triều đình (Lully, nhà soạn nhạc triều đình Pháp), cho công chúng opera ở London (Handel, người lập đoàn opera riêng), hay cho Ospedale della Pietà, nhà nuôi trẻ bị bỏ rơi ở Venice (Vivaldi)."
      - "Chủ nghĩa nhân văn đem lại mối quan tâm mới tới Hy Lạp và La Mã cổ. Khoảng năm 1600, ở Florence, nhóm Camerata thử nghiệm kiểu hát lời kịch (recitative): một người hát giai điệu trên phần đệm đơn giản. Từ đó opera ra đời (Monteverdi L'Orfeo, 1607, viết khi ông làm việc cho công tước xứ Mantua), và cách viết \"một giai điệu trên một bè trầm\" trở thành nền tảng của cả thời kỳ."
    ly_do: "n40 (da-sua): description theo đoạn mở đầu mới.; n2 (da-sua), n4, n5, n6: xem ghi_chu từng nhận định.; n7 (da-sua), n8, n10: Camerata, Florence; Mantua chuyển sang L'Orfeo."
  - cu:
      - "Bè trầm liên tục (basso continuo): một bè trầm (cello, bassoon) cùng một nhạc cụ hòa âm (harpsichord, organ, lute) chơi suốt tác phẩm. Bè trầm được ghi bằng bè trầm số, người chơi tự ứng tác hợp âm bên trên."
      - Hệ thống trưởng – thứ được xác lập; hòa âm chức năng (xem bài 12) trở thành "ngữ pháp" chung.
      - Nhịp đều, mạnh mẽ, chuyển động liên tục như một cỗ máy.
    moi:
      - "Bè trầm liên tục (basso continuo): một bè trầm (như cello, viola da gamba) cùng một nhạc cụ hòa âm (harpsichord, organ, lute) chơi suốt tác phẩm. Bè trầm được ghi bằng bè trầm số, người chơi tự ứng tác hợp âm bên trên."
      - Các giọng trưởng – thứ và những chuỗi hợp âm được dùng ngày càng nhiều (xem bài 12).
    ly_do: 'n12 (da-sua), n14, n15 (da-bo): bassoon bỏ, bỏ "xác lập", bỏ "cỗ máy".'
  - cu: Mỗi chương thường giữ một tâm trạng (affect) từ đầu đến cuối.
    ly_do: "n18 (da-bo): bỏ câu về affect."
  - cu: "Một đoạn ngắn do site viết theo đặc trưng Baroque: chuyển động móc kép liên tục, chuỗi đi xuống, bè trầm đi đều, láy rền ở kết:"
    moi: "Một đoạn ngắn do site viết để minh họa: chuyển động móc đơn liên tục, chuỗi giai điệu đi xuống, bè trầm đi đều, láy rền ở kết:"
    ly_do: 'n19 (da-sua): "móc kép" thành "móc đơn".'
  - cu: Họ đàn violin thay thế dần họ viol và trở thành trung tâm của dàn nhạc. Harpsichord và organ là nhạc cụ phím chính (piano mới ra đời khoảng 1700 và chưa phổ biến). Kèn trumpet và horn chưa có van, chỉ chơi được chuỗi bồi âm (xem Âm học). Dàn nhạc còn nhỏ, chủ yếu là đàn dây.
    moi: Họ đàn violin là xương sống của dàn nhạc Baroque. Harpsichord thường đệm cho dàn nhạc, và organ cũng là nhạc cụ phím quan trọng; piano mới ra đời ở Florence khoảng 1698–1700. Kèn trumpet và horn chưa có van, chỉ chơi được chuỗi bồi âm (xem Âm học). Dàn nhạc chủ yếu là đàn dây.
    ly_do: "n21 (da-sua), n22, n24: xem ghi_chu từng nhận định."
  - cu: Opera, oratorio, cantata (Bach viết hơn 200 cantata nhà thờ còn lại đến nay), concerto và concerto grosso (xem Concerto và ritornello), tổ khúc các điệu nhảy, sonata cho một vài nhạc cụ, prelude và fugue (xem Fugue).
    moi: Opera, oratorio, cantata (Bach viết hơn 200 cantata, nhà thờ và thế tục), concerto và concerto grosso (xem Concerto và ritornello), tổ khúc các điệu nhảy, sonata cho một hay vài nhạc cụ, prelude và fugue (xem Fugue).
    ly_do: n25 (da-sua), n26.
  - cu:
      - Monteverdi, L'Orfeo, Toccata mở đầu và màn 2.
      - Purcell, Dido and Aeneas, aria When I am laid in earth (dựng trên một bè trầm lặp lại).
    moi:
      - Monteverdi, L'Orfeo (1607), Toccata mở đầu và màn 2.
      - Purcell, Dido and Aeneas, aria When I am laid in earth (Dido's Lament, màn 3).
    ly_do: 'n28 (da-sua), n29: thêm năm 1607, bỏ "bè trầm lặp lại".'
  - cu:
      - Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music.
      - Grove Music Online; Encyclopaedia Britannica. Xem tài liệu tham khảo.
    moi:
      - "The Concise Oxford Dictionary of Music (Kennedy và Bourne) qua encyclopedia.com: các mục Baroque, basso continuo, recitative, aria, piano."
      - "Clark và cộng sự, Understanding Music: Past and Present (giáo trình mở), chương 4."
      - Encyclopaedia Britannica (mục Vivaldi, Lully); IMSLP (trang các tác phẩm). Xem tài liệu tham khảo.
    ly_do: "n39 (da-sua): mục Nguồn viết lại theo nguồn đã mở thay cho Burkholder/Taruskin/Grove chưa mở."
  - cu: "mô tả: Thời của các vương triều chuyên chế (Louis XIV ở Versailles), của nhà thờ Công giáo lộng lẫy sau Phản Cải cách và của các thành phố buôn bán giàu có. Nhạc sĩ…"
    moi: "mô tả: Thời của các vương triều chuyên chế (Louis XIV ở Pháp) và của cuộc xung đột giữa Cải cách và Phản Cải cách. Nhạc sĩ thường là người làm công: cho nhà thờ…"
    ly_do: 'Mô tả (lượt 1 D5-L1): đổi theo câu mở đầu, bỏ Versailles và "thành phố buôn bán giàu có".'
