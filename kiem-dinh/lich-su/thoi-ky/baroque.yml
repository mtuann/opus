    luot_2_ghi_chu: "Jones: trang trí dày (extensive ornamentation); việc người chơi tự thêm hoa mỹ là thực hành chuẩn của thời kỳ."
  - id: n18
    cau: Câu "Mỗi chương thường giữ một tâm trạng (affect) từ đầu đến cuối".
    loai: lich-su
    nguon:
      - cod-affect
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: COD, Affections, doctrine of, nói về lý thuyết cảm xúc, không khẳng định "mỗi chương giữ một tâm trạng"; không nguồn đã mở nói đủ rộng. Đã xem trang: không còn câu.'
