nhan_dinh:
  - id: n1
    cau: Thời Baroque (khoảng 1600–1750)
    loai: nam
    nguon:
      - cod-baroque
      - lt-4.2
    ket_qua: dung
    ghi_chu: "Mốc là quy ước của site. COD, Baroque: khoảng 1600 đến 1750 (có chỗ 1759, Handel mất); Clark chương 4: 1600–1750."
  - id: n2
    cau: Thời của các vương triều chuyên chế (Louis XIV ở Pháp) và của cuộc xung đột giữa Cải cách và Phản Cải cách.
    loai: lich-su
    nguon:
      - lt-4.2
      - lumen-bar
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Louis XIV ở Versailles, nhà thờ Công giáo lộng lẫy sau Phản Cải cách, các thành phố buôn bán giàu có". "Lộng lẫy" và "thành phố buôn bán giàu có" không kiểm được; Versailles không cần cho nhận định. Giữ chuyên chế/Louis XIV/Cải cách và Phản Cải cách theo Clark 4.1–4.2.'
  - id: n3
    cau: "Nhạc sĩ thường là người làm công: cho nhà thờ (Bach ở Leipzig)."
    loai: lich-su
    nguon:
      - lt-4.6
    ket_qua: dung
    ghi_chu: "Clark, 4.6: Bach ở Leipzig (Thomaskantor từ 1723)."
  - id: n4
    cau: Cho triều đình (Lully, nhà soạn nhạc triều đình Pháp).
    loai: lich-su
    nguon:
      - brit-lully
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lully ở Versailles". Britannica, Lully: nhà soạn nhạc triều đình Louis XIV; nói "ở Versailles" quá cụ thể.'
  - id: n5
    cau: Cho công chúng opera ở London (Handel, người lập đoàn opera riêng).
    loai: lich-su
    nguon:
      - lt-4.5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cho nhà hát opera thương mại (Handel ở London)". Clark, 4.5: Handel lập các công ty opera ở London; bỏ "thương mại" vì không chốt được.'
  - id: n6
    cau: Cho Ospedale della Pietà, nhà nuôi trẻ bị bỏ rơi ở Venice (Vivaldi).
    loai: lich-su
    nguon:
      - brit-vivaldi
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "các tổ chức từ thiện (Vivaldi ở trại trẻ mồ côi Pietà, Venice)". Britannica, Vivaldi: Ospedale della Pietà, nhà nuôi trẻ bị bỏ rơi ở Venice; đổi "trại trẻ mồ côi" thành mô tả sát nguồn.'
  - id: n7
    cau: Chủ nghĩa nhân văn đem lại mối quan tâm mới tới Hy Lạp và La Mã cổ.
    loai: lich-su
    nguon:
      - lt-4.3
    ket_qua: da-sua
    ghi_chu: Câu thêm để làm nền cho đoạn Camerata, theo Clark 4.3 (Birth of Opera).
  - id: n8
    cau: "Khoảng năm 1600, ở Florence, nhóm Camerata thử nghiệm kiểu hát lời kịch (recitative): một người hát giai điệu trên phần đệm đơn giản."
    loai: lich-su
    nguon:
      - lt-4.3
      - cod-recit
      - cod-opera
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"ở Florence và Mantua, người ta muốn hồi sinh kịch Hy Lạp cổ bằng cách hát lời kịch trên một bè đệm đơn giản\". Camerata ở Florence (Clark 4.3, COD); Mantua chuyển xuống câu sau (L'Orfeo)."
  - id: n9
    cau: Từ đó opera ra đời (Monteverdi L'Orfeo, 1607) ...
    loai: nam
    nguon:
      - cod-orfeo
      - imslp-orfeo
      - lt-4.3
    ket_qua: dung
    ghi_chu: L'Orfeo, công diễn 1607 ở Mantua.
  - id: n10
    cau: L'Orfeo viết khi Monteverdi làm việc cho công tước xứ Mantua.
    loai: lich-su
    nguon:
      - cod-orfeo
      - lt-4.3
    ket_qua: da-sua
    ghi_chu: "Câu thêm thay cho \"ở Florence và Mantua\": L'Orfeo viết cho triều Gonzaga, Mantua."
  - id: n11
    cau: Cách viết "một giai điệu trên một bè trầm" trở thành nền tảng của cả thời kỳ.
    loai: lich-su
    nguon:
      - lt-4.2
      - cod-bc
    ket_qua: dung
  - id: n12
    cau: "Bè trầm liên tục (basso continuo): một bè trầm (như cello, viola da gamba) cùng một nhạc cụ hòa âm (harpsichord, organ, lute) chơi suốt tác phẩm."
    loai: dinh-nghia
    nguon:
      - cod-bc
      - lt-4.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(cello, bassoon)". COD, Basso continuo: bè trầm có thể do cello, viola da gamba, bassoon...; giữ hai ví dụ chắc chắn. Lời hứa lô trước (bè trầm số, basso continuo, bài 25): vẫn giữ.'
  - id: n13
    cau: Bè trầm được ghi bằng bè trầm số, người chơi tự ứng tác hợp âm bên trên.
    loai: dinh-nghia
    nguon:
      - cod-bc
      - omt-figured
    ket_qua: dung
    ghi_chu: 'Điều lô trước (nhac-ly/25-be-tram-so) yêu cầu giữ: mục "Âm thanh đặc trưng" nêu basso continuo ghi bằng bè trầm số. Còn nguyên.'
  - id: n14
    cau: Các giọng trưởng – thứ và những chuỗi hợp âm được dùng ngày càng nhiều (xem bài 12).
    loai: lich-su
    nguon:
      - lt-4.2
      - cod-baroque
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hệ thống trưởng – thứ được xác lập; hòa âm chức năng trở thành ngữ pháp chung". "Được xác lập" và "ngữ pháp chung" mạnh hơn nguồn đã mở; đổi thành mức nguồn nói.'
  - id: n15
    cau: Câu "Nhịp đều, mạnh mẽ, chuyển động liên tục như một cỗ máy".
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: ẩn dụ "cỗ máy" và "nhịp đều, mạnh mẽ" không kiểm được. Đã xem trang: không còn câu.'
  - id: n16
    cau: "Tương phản: to – nhỏ đột ngột (terraced dynamics), độc tấu – cả dàn nhạc."
    loai: dinh-nghia
    nguon:
      - lt-4.2
      - cod-baroque
    ket_qua: dung
  - id: n17
    cau: Giai điệu nhiều trang trí; người biểu diễn được kỳ vọng tự thêm nốt hoa mỹ.
    loai: lich-su
    nguon:
      - lt-4.2
    ket_qua: dung
  - id: n18
    cau: Câu "Mỗi chương thường giữ một tâm trạng (affect) từ đầu đến cuối".
    loai: lich-su
    nguon:
      - cod-affect
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: COD, Affections, doctrine of, nói về lý thuyết cảm xúc, không khẳng định "mỗi chương giữ một tâm trạng"; không nguồn đã mở nói đủ rộng. Đã xem trang: không còn câu.'
  - id: n19
    cau: "Đoạn do site viết để minh họa: chuyển động móc đơn liên tục, chuỗi giai điệu đi xuống, bè trầm đi đều, láy rền ở kết."
    loai: cau-truc
    nguon:
      - abc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "theo đặc trưng Baroque: chuyển động móc kép liên tục". Khối abc dùng L:1/16 nhưng nốt là bước 2/16 = móc đơn (thuat-ngu và bài 3: móc đơn = eighth), nên "móc kép" sai; đã sửa thành "móc đơn". Phần "chuỗi đi xuống" đổi "chuỗi giai điệu đi xuống"; "để minh họa" thay cho "theo đặc trưng Baroque".'
  - id: n20
    cau: Họ đàn violin là xương sống của dàn nhạc Baroque.
    loai: lich-su
    nguon:
      - lt-4.4
      - brit-vivaldi
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thay thế dần họ viol và trở thành trung tâm của dàn nhạc". "Thay thế dần họ viol" bỏ; Clark 4.4: violin là nền của dàn nhạc Baroque.'
  - id: n21
    cau: Harpsichord thường đệm cho dàn nhạc, và organ cũng là nhạc cụ phím quan trọng.
    loai: lich-su
    nguon:
      - lt-4.4
      - cod-bc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Harpsichord và organ là nhạc cụ phím chính". "Chính" là xếp hạng; đổi theo nguồn.'
  - id: n22
    cau: Piano mới ra đời ở Florence khoảng 1698–1700.
    loai: nam
    nguon:
      - cod-piano
      - cod-crist
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khoảng 1700 và chưa phổ biến". COD, Piano và Cristofori: Cristofori chế gravicembalo col piano e forte ở Florence khoảng 1698–1700; "chưa phổ biến" bỏ.'
  - id: n23
    cau: Kèn trumpet và horn chưa có van, chỉ chơi được chuỗi bồi âm (xem Âm học).
    loai: lich-su
    nguon:
      - lt-4.4
    ket_qua: dung
    ghi_chu: Điều nhạc cụ không van được nêu ở Clark 4.4 (natural trumpet và horn); liên kết kiểm ở ve-site bên dưới.
  - id: n24
    cau: Dàn nhạc chủ yếu là đàn dây.
    loai: lich-su
    nguon:
      - lt-4.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dàn nhạc còn nhỏ, chủ yếu là đàn dây". "Còn nhỏ" không có chuẩn so sánh ở nguồn đã mở; bỏ.'
  - id: n25
    cau: Bach viết hơn 200 cantata, nhà thờ và thế tục.
    loai: so-lieu
    nguon:
      - lt-4.6
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hơn 200 cantata nhà thờ còn lại đến nay". Clark 4.6: Bach viết hơn 200 cantata (nhà thờ và thế tục); bỏ "còn lại đến nay". Số lượng là xấp xỉ.'
  - id: n26
    cau: Sonata cho một hay vài nhạc cụ.
    loai: dinh-nghia
    nguon:
      - lt-4.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một vài nhạc cụ". Đổi cách viết, nghĩa không đổi.'
  - id: n27
    cau: "Thể loại chính: opera, oratorio, cantata, concerto và concerto grosso, tổ khúc các điệu nhảy, sonata, prelude và fugue."
    loai: lich-su
    nguon:
      - lt-4.2
      - lt-4.4
      - cod-baroque
    ket_qua: dung
  - id: n28
    cau: Monteverdi, L'Orfeo (1607), Toccata mở đầu và màn 2 (tác phẩm 1).
    loai: ten
    nguon:
      - cod-orfeo
      - imslp-orfeo
    ket_qua: da-sua
    ghi_chu: Thêm năm 1607 (COD, Orfeo). Chữ cũ không năm.
  - id: n29
    cau: Purcell, Dido and Aeneas, aria When I am laid in earth (Dido's Lament, màn 3) (tác phẩm 2).
    loai: ten
    nguon:
      - cod-dido
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"dựng trên một bè trầm lặp lại\". Ground bass của Dido's Lament không kiểm được ở nguồn mở đủ chắc (OMT Lament bass đã mở nhưng không chốt trường hợp này), nên bỏ và ghi tên Dido's Lament, màn 3 (COD, Dido and Aeneas)."
  - id: n30
    cau: Corelli, Concerto grosso Op. 6 số 8, "Giáng sinh" (tác phẩm 3).
    loai: danh-muc
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chưa mở được nguồn bậc 1–2 cho Op. 6 số 8 và biệt danh; lượt 2 kiểm (IMSLP, Britannica Corelli)."
  - id: n31
    cau: Vivaldi, Mùa xuân (tác phẩm 4).
    loai: ten
    nguon:
      - imslp-seasons
      - cod-seasons
      - brit-vivaldi
    ket_qua: dung
    ghi_chu: Liên kết sang trang nghe-nhac kiểm ở ve-site bên dưới.
  - id: n32
    cau: Bach, Prelude và fugue cung Đô trưởng, BWV 846, cặp mở đầu Bình quân luật quyển 1 (tác phẩm 5).
    loai: danh-muc
    nguon:
      - lt-4.6
    ket_qua: dung
    ghi_chu: "Nghe tiếp cặp Đô thứ BWV 847: kiểm cùng nguồn; trang đích kiểm ở ve-site."
  - id: n33
    cau: Bach, Tổ khúc cello số 1 (tác phẩm 6).
    loai: ten
    nguon:
      - lt-4.6
    ket_qua: dung
  - id: n34
    cau: Bach, Brandenburg Concerto số 5 (tác phẩm 7).
    loai: ten
    nguon:
      - lt-4.6
