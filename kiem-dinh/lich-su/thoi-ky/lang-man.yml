nhan_dinh:
  - id: n1
    cau: Thời Lãng mạn khoảng 1820–1900 (tiêu đề).
    loai: nam
    nguon:
      - c-rom
      - j-rom
      - kuz-bee
    ket_qua: dung
    ghi_chu: 'Mốc là quy ước của site (đã nói ở mục Nguồn): COD dùng "Romantic" cho nhạc khoảng 1830–1900; Jones/Kuznetsova đặt ranh giới quanh 1815 (Beethoven giai đoạn cuối). Mốc 1900 khá chặt: Mahler 8 (1906–07) và Puccini (mất 1924) vẫn được liệt vào Lãng mạn muộn, trùng với nha-soan-nhac.yml (cả hai thoi_ky = Lãng mạn). Không mâu thuẫn trang khóa piano/the-loai, nơi Lãng mạn chỉ là nhãn thời kỳ, không nêu mốc.'
  - id: n2
    cau: "Mô tả (description): từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên, chủ nghĩa dân tộc; piano mạnh hơn, dàn nhạc phình to, nghệ sĩ bậc thầy."
    loai: lich-su
    nguon:
      - j-rom
      - j-nat
      - c-rom
    ket_qua: da-sua
    ghi_chu: Mô tả viết lại cho khớp mục Bối cảnh và Nhạc cụ. Bản cũ mở bằng "Sau Cách mạng Pháp và các cuộc chiến Napoleon... truyện cổ tích" không có nguồn đã mở.
  - id: n3
    cau: Từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên và chủ nghĩa dân tộc.
    loai: lich-su
    nguon:
      - j-rom
      - j-nat
      - c-nat
    ket_qua: da-sua
    ghi_chu: 'Bản cũ gắn với "Cách mạng Pháp và chiến tranh Napoleon" và "truyện cổ tích": không tìm được trong nguồn mở nên bỏ.'
  - id: n4
    cau: Âm nhạc được xem là nghệ thuật thích hợp nhất để biểu đạt cảm xúc; nhạc sĩ muốn bày tỏ thế giới nội tâm của mình.
    loai: lich-su
    nguon:
      - j-rom
      - c-rom
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "Nhạc sĩ được coi là thiên tài, nghệ sĩ tự do bày tỏ thế giới nội tâm"; "thiên tài" không có nguồn nên bỏ.'
  - id: n5
    cau: Công nghiệp hóa giúp chế tạo piano mạnh hơn và hàng loạt hơn, đưa đàn vào nhiều gia đình trung lưu.
    loai: lich-su
    nguon:
      - yam
      - met
      - j-piano
    ket_qua: da-sua
    ghi_chu: 'Yamaha: sản xuất piano hàng loạt ở thế kỷ 19; Met: piano là vật mong ước của gia đình trung lưu Mỹ thế kỷ 19. Bản cũ nói "làm piano phổ biến".'
  - id: n6
    cau: Nhạc sĩ viết nhiều cho hòa nhạc công cộng và liên hoan.
    loai: lich-su
    nguon:
      - j-rom
      - c-orc
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "nhà hát lớn và phòng hòa nhạc mọc lên ở mọi thành phố"; câu ấy quá rộng, thay bằng ý nguồn có.'
  - id: n7
    cau: Thời của những nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt, được hâm mộ như ngôi sao.
    loai: lich-su
    nguon:
      - c-pag
      - c-liszt
      - j-rom
    ket_qua: dung
  - id: n8
    cau: Beethoven giai đoạn cuối (Giao hưởng số 9, các tứ tấu cuối) là cây cầu dẫn vào thời kỳ này.
    loai: lich-su
    nguon:
      - kuz-bee
    ket_qua: dung
    ghi_chu: "Kuznetsova: giai đoạn cuối từ khoảng 1815, cầu nối sang Lãng mạn."
  - id: n9
    cau: "Cảm xúc đặt lên hàng đầu: biểu cảm quan trọng hơn khuôn khổ hình thức."
    loai: lich-su
    nguon:
      - j-rom
      - c-rom
    ket_qua: dung
  - id: n10
    cau: Giai điệu dài, hát, đầy cảm xúc (đặc trưng cũ).
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: Bản cũ có dòng này; không có nguồn mở nói thế là đặc trưng riêng của Lãng mạn (giai điệu hát cũng có ở Cổ điển, Baroque). Đã thay bằng n9.
  - id: n11
    cau: "Hòa âm giàu màu sắc: dùng nhiều hợp âm nửa cung (chromatic) để biểu đạt cảm xúc."
    loai: lich-su
    nguon:
      - c-chr
      - j-rom
    ket_qua: da-sua
    ghi_chu: Bản cũ thêm "chuyển giọng xa và bất ngờ"; không có nguồn nên bỏ.
  - id: n12
    cau: "Ví dụ về hòa âm nửa cung: Tristan und Isolde của Wagner."
    loai: lich-su
    nguon:
      - c-chr
      - i-tri
    ket_qua: dung
  - id: n13
    cau: Link [bài 19](/opus/nhac-ly/19-at-phu-chuyen-giong/) về hợp âm át phụ và chuyển giọng.
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/nhac-ly/19-at-phu-chuyen-giong.md tồn tại, bài đã chuyển và nói về át phụ và chuyển giọng.
  - id: n14
    cau: Rubato nghĩa là co giãn tốc độ để diễn cảm.
    loai: dinh-nghia
    nguon:
      - c-rub
    ket_qua: dung
  - id: n15
    cau: Diễn tấu tự do bằng rubato là một đặc trưng của lối chơi Lãng mạn.
    loai: lich-su
    nguon:
      - c-rub
    ket_qua: null
    ghi_chu: 'chưa chắc: nguồn đã mở chỉ định nghĩa rubato, không khẳng định nó là đặc trưng của riêng Lãng mạn. Bản cũ gọi rubato là "linh hồn của lối chơi Lãng mạn" (đã bỏ); mục "Cách nghe" hạ thành "Đó có thể là rubato". Người giao quyết định giữ hay bỏ dòng này.'
  - id: n16
    cau: "Quy mô co giãn: từ tiểu phẩm một chương cho piano và ca khúc đến tác phẩm cỡ lớn (Giao hưởng số 8 của Mahler, opera của Wagner)."
    loai: lich-su
    nguon:
      - j-mah8
      - j-rom
      - c-orc
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "dải âm lượng và tốc độ cực rộng" (không có nguồn, bỏ) và "giao hưởng Mahler". Mahler 8 viết 1906–07, ngoài mốc 1900: Jones xếp vào Lãng mạn muộn.'
  - id: n17
    cau: "Âm nhạc chương trình: kể chuyện hoặc vẽ cảnh theo một nội dung ngoài âm nhạc (Berlioz, Giao hưởng kỳ ảo; thơ giao hưởng của Liszt)."
    loai: dinh-nghia
    nguon:
      - c-prog
      - j-prog
      - c-sp
      - i-berl
    ket_qua: dung
  - id: n18
    cau: "Bản sắc dân tộc: dân ca, điệu nhảy dân gian hay nét nhạc dân tộc của Ba Lan (Chopin), Séc (Dvořák, Smetana), Na Uy (Grieg), Nga (Nhóm Năm người)."
    loai: lich-su
    nguon:
      - j-nat
      - j-dvo
      - c-grieg
      - c-five
      - c-nat
    ket_qua: dung
    ghi_chu: Jones 8.10 nêu Chopin với Ba Lan và định nghĩa nhạc dân tộc là dùng dân ca, điệu nhảy dân gian; Dvořák ở 8.11, Grieg và Nhóm Năm ở COD.
  - id: n19
    cau: Tchaikovsky thuộc nhóm nhạc sĩ mang bản sắc dân tộc Nga.
    loai: lich-su
    nguon:
      - j-nat
      - c-five
    ket_qua: null
    ghi_chu: 'chưa chắc: Jones 8.10 không nêu tên Tchaikovsky; COD nói về Nhóm Năm chứ không về Tchaikovsky. Không mở được mục Tchaikovsky của COD. Câu trang giữ "Nga (Nhóm Năm người, Tchaikovsky)"; người giao quyết định bỏ tên Tchaikovsky khỏi dòng này hay thêm nguồn.'
  - id: n20
    cau: "Đoạn ví dụ do site viết: tay trái rải rộng, hợp âm bảy giảm, hợp âm mượn, chậm dần trước kết."
    loai: cau-truc
    nguon:
      - omt-mm
      - c-chr
    ket_qua: dung
    ghi_chu: 'Đối chiếu khối abc (xem khuong_nhac): tay trái rải 6 nốt móc trải hơn một quãng tám; ô 2 là Do♯ bảy giảm (vii°7/ii); ô 6 là Fa thứ (iv) mượn từ giọng thứ song song, nốt La♭; "rit." ở ô 7. Ghi chú: giọng K:C nhưng đoạn bắt đầu và kết ở La thứ (vi), nên "hợp âm mượn" hiểu theo Đô.'
  - id: n21
    cau: Link [So sánh các thời kỳ](/opus/nhan-dien/so-sanh-thoi-ky/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: Trang đích chưa chuyển; ../opus-zero/docs/nhan-dien/so-sanh-thoi-ky.md có tồn tại.
  - id: n22
    cau: Piano có khung gang, âm thanh lớn và vang hơn.
    loai: lich-su
    nguon:
      - yam
      - c-pno
      - j-piano
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "Piano hiện đại"; bỏ chữ "hiện đại" và hạ thành so sánh "lớn và vang hơn".'
  - id: n23
    cau: "Dàn nhạc phình to: kèn đồng có van chơi được đủ các nốt của gam nửa cung."
    loai: lich-su
    nguon:
      - c-val
      - c-orc
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "chơi được mọi nốt"; sửa cho chính xác.'
  - id: n24
    cau: Dàn nhạc thêm tuba, cor anglais, harp, nhiều nhạc cụ gõ.
    loai: danh-muc
    nguon:
      - c-tuba
      - c-cor
      - c-orc
