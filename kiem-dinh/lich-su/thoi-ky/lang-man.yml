  - id: n20
    cau: "Đoạn ví dụ do site viết: tay trái rải rộng, hợp âm bảy giảm, hợp âm Fa trưởng chuyển sang Fa thứ (nốt La hạ nửa cung), chậm dần trước kết."
    loai: cau-truc
    nguon:
      - omt-mm
      - c-chr
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu khối abc (xem khuong_nhac): tay trái rải 6 nốt móc trải hơn một quãng tám; ô 2 là Do♯ bảy giảm (vii°7/ii); ô 6 là Fa thứ (iv) mượn từ giọng thứ song song, nốt La♭; "rit." ở ô 7. Ghi chú: giọng K:C nhưng đoạn bắt đầu và kết ở La thứ (vi), nên "hợp âm mượn" hiểu theo Đô. Review D5-gom: đã tự kiểm khối abc: L:1/8, M:3/4, 8 ô, mỗi ô đủ 6/8 ở hai bè; tay trái rải sáu nốt trải hơn một quãng tám (A,,E,CEC E,…); ô 2 tay trái ^C,G,_B,E = Đô♯ bảy giảm, bè trên _b a g nằm trong hợp âm; ô 6 F,,C,_A,F = Fa thứ (iv mượn, La♭); "^rit." ở ô 7 trước ô kết a6 trên La thứ. Khớp câu. Giữ dung. Người gom (D5-gom): đoạn quy về La thứ (mở và kết ở La thứ, V7/vi), nên gọi Fa thứ ở ô 6 là "hợp âm mượn" theo định nghĩa bài 23 (giọng trưởng mượn từ giọng thứ cùng tên) không khớp; sửa như ví dụ romantic-1 ở trang So sánh các thời kỳ (review nhóm D). Người gom (D5-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, VSL, OMT, IMSLP lỗi hay chặn) hay vì câu tả ví dụ soạn mà danh sách không kèm mã, không phải vì nguồn nói khác; giữ theo nguồn review đã mở, ghi ở trên.'
    luot_2: khong-chac
    luot_2_ghi_chu: Ví dụ do site soạn; không đọc được mã ABC. Phần Fa trưởng sang Fa thứ (La hạ nửa cung) đúng nhạc lý nhưng 'hợp âm bảy giảm', 'tay trái rải rộng' chưa kiểm.
