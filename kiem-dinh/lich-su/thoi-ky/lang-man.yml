ghi_chu: 'Trang thời kỳ Lãng mạn (tầng lõi), 1 khối abc soạn riêng. Nguồn: Jones (LibreTexts), Kuznetsova, COD qua Encyclopedia.com, Yamaha, Met, OMT, IMSLP; WebFetch ngày 28/10/2026. Britannica không mở được. Chưa chắc: rubato như đặc trưng Lãng mạn (n15), Tchaikovsky trong nhóm bản sắc dân tộc Nga (n19), tên sách đọc thêm (n40). Thuật ngữ trang dùng nhưng chưa có hồ sơ thuật ngữ: virtuoso (nghệ sĩ bậc thầy), âm nhạc chương trình, thơ giao hưởng, rubato, hợp âm mượn, hợp âm bảy giảm, hợp âm nửa cung (chromatic), Lied. Năm sinh–mất nhà soạn nhạc: trang không nêu. Yêu cầu từ lô trước (grep "lich-su/thoi-ky" trong kiem-dinh/): lo-trinh-nghe (mục "10 tác phẩm để nghe" ở sáu trang) được giữ; không có yêu cầu riêng với lang-man.'
