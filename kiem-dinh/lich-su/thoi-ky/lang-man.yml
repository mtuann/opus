nhan_dinh:
  - id: n1
    cau: Thời Lãng mạn khoảng 1820–1900 (tiêu đề).
    loai: nam
    nguon:
      - c-rom
      - j-rom
      - kuz-bee
    ket_qua: dung
    ghi_chu: 'Mốc là quy ước của site (đã nói ở mục Nguồn): COD dùng "Romantic" cho nhạc khoảng 1830–1900; Jones/Kuznetsova đặt ranh giới quanh 1815 (Beethoven giai đoạn cuối). Mốc 1900 khá chặt: Mahler 8 (1906–07) và Puccini (mất 1924) vẫn được liệt vào Lãng mạn muộn, trùng với nha-soan-nhac.yml (cả hai thoi_ky = Lãng mạn). Không mâu thuẫn trang khóa piano/the-loai, nơi Lãng mạn chỉ là nhãn thời kỳ, không nêu mốc.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: từ Cách mạng Pháp đến trước Thế chiến I; mốc 1820–1900 chấp nhận được với 'khoảng'."
  - id: n2
    cau: "Mô tả (description): từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên, chủ nghĩa dân tộc; piano mạnh hơn, dàn nhạc phình to, nghệ sĩ bậc thầy."
    loai: lich-su
    nguon:
      - j-rom
      - j-nat
      - c-rom
    ket_qua: da-sua
    ghi_chu: Mô tả viết lại cho khớp mục Bối cảnh và Nhạc cụ. Bản cũ mở bằng "Sau Cách mạng Pháp và các cuộc chiến Napoleon... truyện cổ tích" không có nguồn đã mở.
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.02%3A_Music_in_the_Nineteenth_Century" ]
    luot_2_ghi_chu: Mô tả khớp nguồn.
  - id: n3
    cau: Từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên và chủ nghĩa dân tộc.
    loai: lich-su
    nguon:
      - j-rom
      - j-nat
      - c-nat
    ket_qua: da-sua
    ghi_chu: 'Bản cũ gắn với "Cách mạng Pháp và chiến tranh Napoleon" và "truyện cổ tích": không tìm được trong nguồn mở nên bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: cảm xúc, thiên nhiên, siêu nhiên, chủ nghĩa dân tộc."
  - id: n4
    cau: Âm nhạc được xem là nghệ thuật thích hợp nhất để biểu đạt cảm xúc; nhạc sĩ muốn bày tỏ thế giới nội tâm của mình.
    loai: lich-su
    nguon:
      - j-rom
      - c-rom
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "Nhạc sĩ được coi là thiên tài, nghệ sĩ tự do bày tỏ thế giới nội tâm"; "thiên tài" không có nguồn nên bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: Romantic cố nắm 'every shade of human emotion'; ý 'nghệ thuật thích hợp nhất' là quan điểm phổ biến, đúng hướng."
  - id: n5
    cau: Công nghiệp hóa giúp chế tạo piano mạnh hơn và hàng loạt hơn, đưa đàn vào nhiều gia đình trung lưu.
    loai: lich-su
    nguon:
      - yam
      - met
      - j-piano
    ket_qua: da-sua
    ghi_chu: 'Yamaha: sản xuất piano hàng loạt ở thế kỷ 19; Met: piano là vật mong ước của gia đình trung lưu Mỹ thế kỷ 19. Bản cũ nói "làm piano phổ biến".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.02%3A_Music_in_the_Nineteenth_Century", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: piano khung gang, 88 phím; piano là trung tâm sinh hoạt gia đình/salon. 'Hàng loạt' không có trong nguồn."
  - id: n6
    cau: Nhạc sĩ viết nhiều cho hòa nhạc công cộng và liên hoan.
    loai: lich-su
    nguon:
      - j-rom
      - c-orc
    ket_qua: da-sua
    ghi_chu: 'Bản cũ: "nhà hát lớn và phòng hòa nhạc mọc lên ở mọi thành phố"; câu ấy quá rộng, thay bằng ý nguồn có.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context" ]
    luot_2_ghi_chu: "Clark: tăng số người dự hòa nhạc công cộng; 'liên hoan' không nêu nhưng không sai."
  - id: n7
    cau: Thời của những nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt, được hâm mộ như ngôi sao.
    loai: lich-su
    nguon:
      - c-pag
      - c-liszt
      - j-rom
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.07%3A_Music_of_Franz_Liszt" ]
    luot_2_ghi_chu: "Clark: virtuoso như ngôi sao; Liszt chịu ảnh hưởng Paganini năm 1831."
  - id: n8
    cau: Beethoven giai đoạn cuối (Giao hưởng số 9, các tứ tấu cuối) là cây cầu dẫn vào thời kỳ này.
    loai: lich-su
    nguon:
      - kuz-bee
    ket_qua: dung
    ghi_chu: "Kuznetsova: giai đoạn cuối từ khoảng 1815, cầu nối sang Lãng mạn."
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.01%3A_Introduction_and_Historical_Context", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_(Clark_et_al.)/05%3A_Music_of_the_Classical_Period/5.05%3A_Music_of_Ludwig_van_Beethoven_(1770-1827)" ]
    luot_2_ghi_chu: "Clark: Beethoven ảnh hưởng nhất thế kỷ 19; các tác phẩm cuối là 'revolutionary'."
  - id: n9
    cau: "Cảm xúc đặt lên hàng đầu: biểu cảm quan trọng hơn khuôn khổ hình thức."
    loai: lich-su
    nguon:
      - j-rom
      - c-rom
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Understanding_Music_-_Past_and_Present_%28Clark_et_al.%29/06%3A_Nineteenth-Century_Music_and_Romanticism/6.02%3A_Music_in_the_Nineteenth_Century" ]
