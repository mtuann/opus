khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - giong
      - not
      - nhip
    ket_qua: dung
    ghi_chu: "Soạn cho trang. K:C, M:3/4, L:1/8, 8 ô, Q:1/4=60. Mỗi ô đủ 6 móc đơn: tay phải e4 c' b = 4+1+1, a6 ở ô cuối = 6; tay trái 6 nốt mỗi ô (ô cuối A,,E,C A,3 = 1+1+1+3). Hòa âm đọc ở Đô: vi (La thứ) | vii°7/ii (Do♯ giảm bảy) | ii (Re thứ) | V7/vi (Mi7) | IV (Fa) | iv (Fa thứ, La♭ mượn từ Đô thứ) | V7/vi | vi. Khớp n20. \"rit.\" ở ô 7."
doi_chu:
  - cu: Sau Cách mạng Pháp và các cuộc chiến Napoleon, châu Âu bước vào thời đại của cảm xúc cá nhân, thiên nhiên, truyện cổ tích, cái siêu nhiên và chủ nghĩa dân tộc. Nhạc sĩ được coi là thiên tài, nghệ sĩ tự do bày tỏ thế giới nội tâm. Công nghiệp hóa làm piano trở nên phổ biến trong các gia đình trung lưu; các nhà hát lớn và phòng hòa nhạc mọc lên ở mọi thành phố. Thời của những nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt, được hâm mộ như ngôi sao.
    moi: Từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên và chủ nghĩa dân tộc. Âm nhạc được xem là nghệ thuật thích hợp nhất để biểu đạt cảm xúc, và nhạc sĩ muốn bày tỏ thế giới nội tâm của mình. Công nghiệp hóa giúp chế tạo piano mạnh hơn và hàng loạt hơn, đưa đàn vào nhiều gia đình trung lưu; nhạc sĩ viết nhiều cho hòa nhạc công cộng và liên hoan. Thời của những nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt, được hâm mộ như ngôi sao.
    ly_do: 'n3 (da-sua): bỏ phần không có nguồn.; n4 (da-sua): "thiên tài" không có nguồn; viết theo Jones.; n5 (da-sua): khớp Yamaha và Met.; n6 (da-sua): câu cũ quá rộng, không có nguồn.'
  - cu:
      - Giai điệu dài, hát, đầy cảm xúc.
      - "Hòa âm giàu màu sắc: nhiều hợp âm nửa cung, chuyển giọng xa và bất ngờ (xem bài 19)."
      - Dải âm lượng và tốc độ cực rộng; rubato (co giãn tốc độ) để diễn cảm.
      - "Hình thức co giãn: tác phẩm rất ngắn (tiểu phẩm piano, ca khúc) hoặc rất dài (giao hưởng Mahler, opera Wagner)."
    moi:
      - "Cảm xúc đặt lên hàng đầu: biểu cảm quan trọng hơn khuôn khổ hình thức."
      - "Hòa âm giàu màu sắc: dùng nhiều hợp âm nửa cung (chromatic) để biểu đạt cảm xúc, như trong Tristan und Isolde của Wagner (xem bài 19 về hợp âm át phụ và chuyển giọng)."
      - "Diễn tấu tự do: rubato (co giãn tốc độ) để diễn cảm."
      - "Quy mô co giãn: từ tiểu phẩm một chương cho piano và ca khúc đến tác phẩm cỡ lớn (Giao hưởng số 8 của Mahler, opera của Wagner)."
    ly_do: 'n10 (da-bo): không có nguồn nói đó là đặc trưng riêng của Lãng mạn; thay bằng n9.; n11 (da-sua): bỏ "chuyển giọng xa và bất ngờ" vì không có nguồn.; n15 (null): bỏ "dải âm lượng và tốc độ cực rộng" không nguồn; vế rubato là đặc trưng Lãng mạn còn chưa chắc.; n16 (da-sua): nêu cụ thể Giao hưởng số 8 theo Jones.'
  - cu: "Bản sắc dân tộc: dân ca và điệu nhảy dân gian của Ba Lan (Chopin), Séc (Dvořák, Smetana), Na Uy (Grieg), Nga (Nhóm Năm người, Tchaikovsky)."
    moi: "Bản sắc dân tộc: dân ca, điệu nhảy dân gian hay nét nhạc dân tộc của Ba Lan (Chopin), Séc (Dvořák, Smetana), Na Uy (Grieg), Nga (Nhóm Năm người, Tchaikovsky)."
    ly_do: 'Bản sắc dân tộc (lượt 1 D5-L1): thêm "nét nhạc dân tộc" cho khớp các ví dụ (Jones 8.10).'
  - cu: "Piano hiện đại với khung gang, âm thanh lớn và vang. Dàn nhạc phình to: kèn đồng có van chơi được mọi nốt, thêm tuba, cor anglais, harp, nhiều nhạc cụ gõ. Giao hưởng cuối thế kỷ 19 có thể cần hơn 100 nhạc công."
    moi: "Piano với khung gang, âm thanh lớn và vang hơn. Dàn nhạc phình to: kèn đồng có van chơi được đủ các nốt của gam nửa cung, thêm tuba, cor anglais, harp, nhiều nhạc cụ gõ; Berlioz mở rộng mạnh các bộ kèn gỗ, kèn đồng và nhạc cụ gõ."
    ly_do: 'n22 (da-sua): bỏ "hiện đại", so sánh rõ hơn.; n23 (da-sua): "mọi nốt" thiếu chính xác.; n25 (da-sua): bỏ số liệu "hơn 100 nhạc công" không nguồn.'
  - cu: Ca khúc nghệ thuật (Lied), tiểu phẩm piano (nocturne, ballade, étude, mazurka, valse), giao hưởng và thơ giao hưởng, concerto của nghệ sĩ bậc thầy, opera (Verdi, Wagner, Puccini), ballet (Tchaikovsky).
    moi: Ca khúc nghệ thuật (Lied), tiểu phẩm piano (nocturne, ballade, étude, mazurka, valse), giao hưởng và thơ giao hưởng, concerto, opera (Verdi, Wagner, Puccini), ballet (Tchaikovsky).
    ly_do: "n26 (da-sua): bỏ phần không có nguồn."
  - cu: "Cách nghe: hãy để ý những khoảnh khắc nhạc chậm lại hoặc dồn lên mà không có chỉ dẫn rõ ràng trên bản nhạc. Đó là rubato, linh hồn của lối chơi Lãng mạn. So sánh hai bản thu của cùng một nocturne Chopin để nghe sự khác biệt."
    moi: "Cách nghe: hãy để ý những khoảnh khắc nhạc chậm lại hoặc dồn lên mà không có chỉ dẫn rõ ràng trên bản nhạc. Đó có thể là rubato (xem trên). So sánh hai bản thu của cùng một nocturne Chopin để nghe sự khác biệt."
    ly_do: "n38 (khuyen-tap): hạ giọng, liên quan n15."
  - cu:
      - Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music.
      - Grove Music Online; Encyclopaedia Britannica. Xem tài liệu tham khảo.
    moi:
      - 'Mốc năm là quy ước của site: The Concise Oxford Dictionary of Music dùng "Romantic" cho nhạc viết khoảng 1830–1900 (Romantic(ism), qua Encyclopedia.com); giáo trình của Jones đặt ranh giới Cổ điển – Lãng mạn quanh đầu giai đoạn cuối của Beethoven (khoảng 1815).'
      - "Jones, Music Appreciation I, chương 6–8 (LibreTexts): Romantic Music, The Piano, Program Music, Nationalism, Antonín Dvořák, Symphony No. 8 của Mahler, La Bohème."
      - "Kuznetsova, Music Appreciation II, Ludwig van Beethoven: giai đoạn cuối từ khoảng 1815, cầu nối sang Lãng mạn."
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: Chromaticism, Rubato, Orchestra, Valve, Tuba, Cor anglais, Piano, Paganini, Symphonic poem, Grieg, The Five; Program Music; Franz Liszt và Nationalism in the Arts, cũng trên Encyclopedia.com."
      - "Yamaha, The origins of the piano: sản xuất piano hàng loạt ở thế kỷ 19; Bảo tàng Metropolitan, Upright Piano: đàn piano là vật mong ước của gia đình trung lưu Mỹ thế kỷ 19."
      - "IMSLP, trang tác phẩm: Berlioz, Symphonie fantastique, Schubert, Erlkönig, Schubert, Ngũ tấu D. 667, Chopin, Nocturnes Op. 9, Mendelssohn, Op. 64, Verdi, La traviata, Wagner, Tristan und Isolde, Brahms, Giao hưởng số 4, Tchaikovsky, Swan Lake, Dvořák, Giao hưởng số 9."
      - "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music. Xem tài liệu tham khảo."
    ly_do: "n1 (da-sua): Nguồn cũ chỉ nêu tên chung; thay bằng nguồn cụ thể có liên kết và nói rõ mốc năm là quy ước của site."
