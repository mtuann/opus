    moi: "mô tả: Phục hưng là thời của chủ nghĩa nhân văn, của Leonardo và Michelangelo. Âm nhạc vẫn gắn với nhà thờ, nhưng nhạc thế tục cũng phát triển (madrigal, chanson, nhạc khiêu vũ)…"
