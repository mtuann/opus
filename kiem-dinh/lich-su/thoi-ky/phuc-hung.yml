khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
    ket_qua: dung
    ghi_chu: "Soạn cho trang này (đối âm loại 1, trích bài 22). Hai bè, mỗi nốt một ô 2/2 (L:1/1), 11 ô. Bè trên A d c d B d c e d ^c d, bè dưới D F E D G F A G F E D: quãng giữa hai bè (5, 6, 6, 8, 6, 6, 3, 6, 6, 6, 8 so với nốt dưới) đều là quãng thuận; bắt đầu quãng 5 đúng (D–A), kết quãng 8 đúng (D–d); bè trên có ^c ở ô áp chót (cảm âm) lên d. Không cảnh báo abcjs."
ghi_chu: 'Trang thời kỳ Phục hưng. Nguồn chính: COD (Renaissance, madrigal, motet, polyphony, pavan, galliard, Petrucci, Word painting), Clark chương 3, Britannica (Petrucci, Fux). Đã sửa/bỏ: mở đầu, Petrucci, "bè nào cũng quan trọng như nhau", "êm, trong", vẽ chữ, câu trưởng–thứ (bỏ), đối âm Fux, madrigal, Lied (bỏ), nhạc khí, Du Fay, Weelkes, Dowland, mục Nguồn. Chưa chắc: Du Fay (ngày công diễn), Lassus Matona mia cara, Victoria O magnum mysterium. Mốc 1400–1600 là quy ước của site (COD: đầu thế kỷ 15 đến đầu thế kỷ 17).'
doi_chu:
  - cu: "Phục hưng là thời của chủ nghĩa nhân văn, của Leonardo và Michelangelo. Âm nhạc vẫn gắn với nhà thờ, nhưng triều đình các thành bang Ý, Pháp, vùng Burgundy và Flanders cũng nuôi những dàn hát và nhạc công riêng. Máy in nhạc ra đời: năm 1501, Ottaviano Petrucci ở Venice in tuyển tập nhạc đa âm đầu tiên bằng chữ in rời. Âm nhạc bắt đầu lan rộng ngoài các trung tâm tôn giáo."
    moi: "Phục hưng là thời của chủ nghĩa nhân văn, của Leonardo và Michelangelo. Âm nhạc vẫn gắn với nhà thờ, nhưng nhạc thế tục cũng phát triển (madrigal, chanson, nhạc khiêu vũ). Máy in nhạc ra đời: năm 1501, Ottaviano Petrucci, người làm việc ở Venice, in tuyển tập nhạc đa âm đầu tiên bằng chữ in rời. Việc xuất bản nhạc in là một nét mới của thời kỳ."
    ly_do: "n29 (da-sua): description theo đoạn đầu mới (n2).; n2 (da-sua), n3, n4: xem ghi_chu từng nhận định."
  - cu:
      - "Phức điệu mô phỏng: các bè lần lượt bắt chước nhau, bè nào cũng quan trọng như nhau."
      - "Hòa âm êm, trong: dùng nhiều quãng 3 và quãng 6, xử lý nghịch tai cẩn thận."
      - 'Âm nhạc gắn chặt với lời: nhà soạn nhạc "vẽ chữ" (word painting), ví dụ giai điệu đi lên ở chữ "thiên đàng", đi xuống ở chữ "xuống".'
      - Vẫn chủ yếu dùng điệu thức, nhưng đã nghe ra cảm giác trưởng – thứ ngày càng rõ.
      - "Hai bè độc lập, chỉ dùng quãng thuận, bắt đầu và kết bằng quãng đúng: kiểu đối âm mà các nhà soạn nhạc Phục hưng dùng (ví dụ từ bài 22):"
    moi:
      - "Phức điệu mô phỏng: các bè lần lượt bắt chước nhau."
      - "Hòa âm: quãng ba và hợp âm ba được dùng ngày càng nhiều."
      - 'Âm nhạc gắn chặt với lời: nhà soạn nhạc "vẽ chữ" (word painting), ví dụ giai điệu đi lên ở lời nói về sự thăng thiên, những nốt nhanh ở lời nói về chạy.'
      - "Hai bè độc lập, chỉ dùng quãng thuận, bắt đầu và kết bằng quãng đúng: một ví dụ đối âm loại 1 theo kiểu của Fux (từ bài 22) để thấy các bè đi độc lập mà vẫn hòa hợp:"
    ly_do: 'n8 (da-sua), n9, n10, n11 (da-bo): bỏ "bè nào cũng quan trọng như nhau", "êm, trong", câu "trưởng – thứ"; ví dụ vẽ chữ đổi theo COD.; n12 (da-sua): đối âm loại 1 theo Fux.'
  - cu:
      - "Madrigal: ca khúc thế tục nhiều bè, thơ tình, rất thịnh ở Ý và Anh."
      - Chanson (Pháp), Lied (Đức).
      - Nhạc khí cho lute, đàn phím, nhóm viol; các điệu nhảy như pavane, galliard.
    moi:
      - "Madrigal: ca khúc thế tục nhiều bè, gốc Ý, có cả madrigal Anh; lời thường tình ái, châm biếm hay ngụ ngôn."
      - Chanson (Pháp).
      - Nhạc khí cho đàn lute; các điệu nhảy như pavane, galliard.
    ly_do: "n14 (da-sua), n15, n16: bỏ Lied, đàn phím, nhóm viol; madrigal theo COD."
  - cu: Guillaume Du Fay, Nuper rosarum flores (viết cho lễ khánh thành mái vòm nhà thờ Florence, 1436).
    moi: Guillaume Du Fay, Nuper rosarum flores (motet, công diễn lần đầu ngày 25/3/1436 tại nhà thờ chính tòa Santa Maria del Fiore, Florence).
    ly_do: "n17 (chưa chắc): chữ mới nêu motet và ngày công diễn; xem ghi_chu."
  - cu:
      - Thomas Weelkes, As Vesta was from Latmos hill descending (madrigal Anh, nhiều "vẽ chữ").
      - John Dowland, Flow, my tears (ca khúc với đàn lute).
    moi:
      - Thomas Weelkes, As Vesta was from Latmos hill descending (madrigal Anh).
      - John Dowland, Flow, my tears.
    ly_do: "n24 (da-sua), n25: bỏ lời giải thích không kiểm được."
  - cu:
      - Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music.
      - Grove Music Online; Encyclopaedia Britannica. Xem tài liệu tham khảo.
    moi:
      - "The Concise Oxford Dictionary of Music (Kennedy và Bourne) qua encyclopedia.com: các mục Renaissance, madrigal, motet, polyphony, pavan, galliard."
      - "Clark và cộng sự, Understanding Music: Past and Present (giáo trình mở), chương 3."
      - Encyclopaedia Britannica (mục Petrucci); Baker's Biographical Dictionary of Musicians qua encyclopedia.com (Petrucci).
      - IMSLP (trang các tác phẩm). Xem tài liệu tham khảo.
    ly_do: "n28 (da-sua): mục Nguồn viết lại theo nguồn đã mở thay cho Burkholder/Taruskin/Grove chưa mở."
