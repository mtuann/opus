nhan_dinh:
  - id: n1
    cau: Thời Phục hưng (khoảng 1400–1600)
    loai: nam
    nguon:
      - cod-ren
      - lt-3.2
    ket_qua: dung
    ghi_chu: "Mốc là quy ước của site. COD, Renaissance: đầu thế kỷ 15 đến đầu thế kỷ 17; Clark chương 3 cũng lấy khoảng 1400–1600."
  - id: n2
    cau: Âm nhạc vẫn gắn với nhà thờ, nhưng nhạc thế tục cũng phát triển (madrigal, chanson, nhạc khiêu vũ).
    loai: lich-su
    nguon:
      - lt-3.3
      - lt-3.4
      - cod-madrigal
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "triều đình các thành bang Ý, Pháp, vùng Burgundy và Flanders cũng nuôi những dàn hát và nhạc công riêng". Danh sách địa điểm và "nuôi dàn hát, nhạc công riêng" không kiểm được ở nguồn mở; Clark 3.4 (Secular Music) nêu nhạc thế tục.'
  - id: n3
    cau: "Máy in nhạc ra đời: năm 1501, Ottaviano Petrucci, người làm việc ở Venice, in tuyển tập nhạc đa âm đầu tiên bằng chữ in rời."
    loai: nam
    nguon:
      - cod-petrucci
      - brit-petrucci
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ottaviano Petrucci ở Venice". Thêm "người làm việc ở Venice" vì Petrucci sinh ở Fossombrone (Britannica). Năm 1501 và tuyển tập Harmonice Musices Odhecaton khớp COD/Britannica.'
  - id: n4
    cau: Việc xuất bản nhạc in là một nét mới của thời kỳ.
    loai: lich-su
    nguon:
      - cod-petrucci
      - brit-petrucci
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Âm nhạc bắt đầu lan rộng ngoài các trung tâm tôn giáo" (nhận định xã hội học không nguồn). Thay bằng câu hẹp hơn, kiểm được.'
  - id: n5
    cau: Từ thế kỷ 16 (Luther, từ năm 1517), cuộc Cải cách Tin lành và Phản Cải cách của Công giáo ảnh hưởng mạnh đến âm nhạc nhà thờ.
    loai: lich-su
    nguon:
      - lt-3.3
      - cod-ren
    ket_qua: dung
    ghi_chu: "Clark, 3.3 Worship Music: Cải cách và Phản Cải cách; 1517 là năm Luther đưa ra 95 luận đề."
  - id: n6
    cau: Luther khuyến khích giáo dân cùng hát thánh ca bằng tiếng mẹ đẻ.
    loai: lich-su
    nguon:
      - lt-3.3
    ket_qua: dung
  - id: n7
    cau: Công đồng Trent (1545–1563) đòi hỏi lời hát phải nghe rõ.
    loai: lich-su
    nguon:
      - lt-3.3
      - cod-ren
    ket_qua: dung
    ghi_chu: "Clark, 3.3: Council of Trent, lời phải nghe được."
  - id: n8
    cau: "Phức điệu mô phỏng: các bè lần lượt bắt chước nhau."
    loai: dinh-nghia
    nguon:
      - cod-poly
      - lt-3.2
      - lt-3.3
    ket_qua: da-sua
    ghi_chu: Chữ cũ thêm ", bè nào cũng quan trọng như nhau" (không nguồn đã mở nói về mọi bè); đã bỏ. Bắt chước giữa các bè (imitation) có ở Clark chương 3.
  - id: n9
    cau: "Hòa âm: quãng ba và hợp âm ba được dùng ngày càng nhiều."
    loai: lich-su
    nguon:
      - lt-3.2
      - cod-ren
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hòa âm êm, trong: dùng nhiều quãng 3 và quãng 6, xử lý nghịch tai cẩn thận" (cảm nhận "êm, trong" và quãng 6 không kiểm được). Chữ mới trùng nhận định ở trang lich-su/index (đoạn Phục hưng).'
  - id: n10
    cau: "Nhà soạn nhạc vẽ chữ (word painting): giai điệu đi lên ở lời nói về sự thăng thiên, những nốt nhanh ở lời nói về chạy."
    loai: lich-su
    nguon:
      - cod-wordp
      - lt-3.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giai điệu đi lên ở chữ thiên đàng, đi xuống ở chữ xuống". COD, Word painting nêu ví dụ lên ở lời lên trời và nốt nhanh ở lời chạy; ví dụ "xuống" bỏ vì chưa thấy trong nguồn.'
  - id: n11
    cau: Câu "Vẫn chủ yếu dùng điệu thức, nhưng đã nghe ra cảm giác trưởng – thứ ngày càng rõ".
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: nguồn đã mở không chốt được thời điểm "cảm giác trưởng – thứ rõ dần" ở Phục hưng (Britannica, Mode, chỉ đọc được đề mục). Đã xem trang: không còn câu.'
  - id: n12
    cau: "Hai bè độc lập, chỉ dùng quãng thuận, bắt đầu và kết bằng quãng đúng: một ví dụ đối âm loại 1 theo kiểu của Fux để thấy các bè đi độc lập mà vẫn hòa hợp."
    loai: quy-tac
    nguon:
      - brit-fux
      - abc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "kiểu đối âm mà các nhà soạn nhạc Phục hưng dùng". Fux (1725) sống sau Phục hưng và dạy theo kiểu Palestrina; đổi sang "đối âm loại 1 theo kiểu của Fux". Kiểm khối abc: xem khuong_nhac.'
  - id: n13
    cau: "Thánh lễ (mass) và motet: nhạc nhà thờ đa âm."
    loai: dinh-nghia
    nguon:
      - cod-motet
      - lt-3.3
    ket_qua: dung
  - id: n14
    cau: "Madrigal: ca khúc thế tục nhiều bè, gốc Ý, có cả madrigal Anh; lời thường tình ái, châm biếm hay ngụ ngôn."
    loai: dinh-nghia
    nguon:
      - cod-madrigal
      - lt-3.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thơ tình, rất thịnh ở Ý và Anh". "Rất thịnh" là so sánh không kiểm được; đổi theo COD, Madrigal (gốc Ý thế kỷ 14 và 16, madrigal Anh; đề tài tình ái, châm biếm).'
  - id: n15
    cau: Chanson (Pháp).
    loai: ten
    nguon:
      - lt-3.4
      - cod-ren
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chanson (Pháp), Lied (Đức)". Lied Đức ở Phục hưng không xác nhận được ở nguồn mở (Lied gắn với thế kỷ 19 trong COD); bỏ.'
  - id: n16
    cau: Nhạc khí cho đàn lute; các điệu nhảy như pavane, galliard.
    loai: lich-su
    nguon:
      - cod-pavan
      - cod-galliard
      - lt-3.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đàn phím, nhóm viol" thêm; không xác nhận được ở nguồn mở nên bỏ. Pavane (COD, Pavan) và galliard (COD, Galliard) là điệu nhảy thế kỷ 16.'
  - id: n17
    cau: Guillaume Du Fay, Nuper rosarum flores, motet, công diễn lần đầu ngày 25/3/1436 tại nhà thờ chính tòa Santa Maria del Fiore, Florence (tác phẩm 1).
    loai: nam
