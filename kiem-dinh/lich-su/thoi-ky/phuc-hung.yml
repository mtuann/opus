    ket_qua: null
    ghi_chu: 'chưa chắc: lượt 1 đã chuyển từ "viết cho lễ khánh thành mái vòm, 1436" sang ngày 25/3/1436 (lễ thánh hiến nhà thờ), nhưng chưa mở lại được nguồn bậc 1–2 có ngày; lượt 2 kiểm (Britannica Dufay, COD).'
