nhan_dinh:
  - id: n1
    cau: '"Nhạc cổ điển" theo nghĩa rộng là truyền thống âm nhạc nghệ thuật phương Tây kéo dài hơn một nghìn năm.'
    loai: lich-su
    nguon:
      - cod-classical
      - lt-2.2
    ket_qua: dung
    ghi_chu: 'Từ khoảng 500 đến nay là hơn 1500 năm; "hơn một nghìn năm" đúng. COD, Classical: nghĩa rộng "classical music" là nhạc nghệ thuật phương Tây.'
    luot_2: dung
    luot_2_nguon: [ "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/", "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm" ]
    luot_2_ghi_chu: "Từ khoảng 500 đến nay: hơn một thiên niên kỷ."
  - id: n2
    cau: Theo nghĩa hẹp, thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven thời trẻ.
    loai: nam
    nguon:
      - cod-classical
      - lt-5
    ket_qua: dung
    ghi_chu: "Mốc là quy ước của site: Clark chương 5 lấy 1750–1815, COD lấy 1750–1830. Haydn 1732–1809, Mozart 1756–1791, Beethoven 1770–1827 khớp src/data/nha-soan-nhac.yml."
    luot_2: dung
    luot_2_nguon: [ "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm", "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/" ]
    luot_2_ghi_chu: Classic c.1750–1820 (WMich); Louis dùng 1750–1810 nên mốc cuối chưa thống nhất.
  - id: n3
    cau: Các mốc năm dưới đây là quy ước gần đúng; phong cách thay đổi dần dần chứ không đổi trong một đêm.
    loai: lich-su
    nguon:
      - cod-baroque
      - cod-ren
      - cod-classical
      - cod-romantic
    ket_qua: dung
    ghi_chu: "Các nguồn lệch nhau vài chục năm (Baroque kết thúc 1750 hay 1759; Cổ điển 1815, 1820 hay 1830; Lãng mạn 1830 hay 1820): xem mục Nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/", "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm" ]
    luot_2_ghi_chu: "Các giáo trình cho mốc khác nhau (Phục hưng 1400 hay 1450; Cổ điển kết 1810 hay 1820): đúng là quy ước."
  - id: n4
    cau: Mỗi thời kỳ có một trang chi tiết (bối cảnh, đặc điểm âm nhạc, 10 tác phẩm để nghe).
    loai: ve-site
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(bối cảnh, âm thanh đặc trưng, nhạc cụ, 10 tác phẩm để nghe)". Trang thế kỷ 20 không có mục "Âm thanh đặc trưng" và "Nhạc cụ" (có "Các hướng chính"), Phục hưng không có "Nhạc cụ". Đã kiểm trên src/content/docs/lich-su/thoi-ky/*.md: cả sáu trang có "Bối cảnh" và mục "10 tác phẩm để nghe" (10 mục mỗi trang). Phụ thuộc phần C (co-dien, lang-man, the-ky-20): nếu phần C đổi tên mục thì câu này phải xem lại.'
  - id: n5
    cau: "Thời Đương đại có trang Âm nhạc hôm nay: những nhà soạn nhạc nên nghe, tin đáng chú ý, tên tuổi Việt Nam và các cuộc thi lớn."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: Trang đích chưa chuyển; ../opus-zero/docs/lich-su/duong-dai.md có các mục "Một số nhà soạn nhạc nên nghe", "Tin đáng chú ý gần đây", "Tên tuổi Việt Nam nên biết", "Các cuộc thi lớn". Lô chuyển trang đó phải giữ các mục này hay sửa câu ở đây.
  - id: n6
    cau: Trung cổ | ~500–1400 | Thánh ca nhà thờ, từ một bè đến những bản nhiều bè đầu tiên
    loai: nam
    nguon:
      - lt-2.2
    ket_qua: dung
    ghi_chu: Mốc là quy ước của site; Clark và COD lệch vài chục năm.
    luot_2: dung
    luot_2_nguon: [ "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/", "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm" ]
    luot_2_ghi_chu: Trung cổ ~500–1400 (Louis).
  - id: n7
    cau: Phục hưng | ~1400–1600 | Nhiều bè đan xen hài hòa, chủ yếu cho giọng hát
    loai: nam
    nguon:
      - lt-3.2
      - cod-ren
    ket_qua: dung
    ghi_chu: Mốc là quy ước của site; Clark và COD lệch vài chục năm.
    luot_2: dung
    luot_2_nguon: [ "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/", "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm" ]
    luot_2_ghi_chu: Phục hưng 1400–1600 (Louis); WMich dùng 1450.
  - id: n8
    cau: Baroque | ~1600–1750 | Nhiều trang trí, tương phản, bè trầm liên tục, ra đời opera
    loai: nam
    nguon:
      - lt-4.2
      - cod-baroque
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhiều trang trí, nhịp đều, bè trầm liên tục, ra đời opera". Bỏ "nhịp đều" (không kiểm được), thêm "tương phản" (Clark 4.2, COD Baroque).'
    luot_2: dung
    luot_2_nguon: [ "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/", "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm" ]
    luot_2_ghi_chu: "Baroque 1600–1750; Louis: opera được phát minh, basso continuo."
  - id: n9
    cau: Cổ điển | ~1750–1820 | Rõ ràng, cân đối, hình thức sonata, giao hưởng
    loai: nam
    nguon:
      - lt-5
    ket_qua: dung
    ghi_chu: Mốc là quy ước của site; Clark và COD lệch vài chục năm.
    luot_2: dung
    luot_2_nguon: [ "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm" ]
    luot_2_ghi_chu: Classic c.1750–1820 (WMich); Louis cho 1750–1810.
  - id: n10
    cau: Lãng mạn | ~1820–1900 | Cảm xúc cá nhân, dàn nhạc lớn, nghệ sĩ bậc thầy
    loai: nam
    nguon:
      - lt-6
    ket_qua: dung
    ghi_chu: Mốc là quy ước của site; Clark và COD lệch vài chục năm.
    luot_2: dung
    luot_2_nguon: [ "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm", "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/" ]
    luot_2_ghi_chu: Romantic c.1820–1900 (WMich); Louis 1810–1900. Louis nhắc nghệ sĩ bậc thầy và hòa nhạc hiện đại.
  - id: n11
    cau: "Thế kỷ 20 | ~1900–2000 | Phá vỡ quy tắc: ấn tượng, vô điệu tính, tối giản"
    loai: nam
    nguon:
      - lt-7
    ket_qua: null
    ghi_chu: 'chưa chắc: mốc ~1900–2000 là quy ước của site (lô trước yêu cầu giữ). "Vô điệu tính" giữ như bài nhạc lý; "tối giản" xem nhận định ở mục Thế kỷ 20.'
    luot_2: dung
    luot_2_nguon: [ "https://wmich.edu/mus-gened/mus152/Elements/tsld035.htm", "https://louis.pressbooks.pub/musicappreciation/chapter/introduction-to-western-music-history/" ]
    luot_2_ghi_chu: Hiện đại c.1900 đến nay; chia "thế kỷ 20 ~1900–2000" là quy ước gần đúng.
