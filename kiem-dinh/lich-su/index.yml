ghi_chu: 'Trang tổng quan lịch sử (tang khung). Nguồn chính: COD (Encyclopedia.com), Clark chương 2 đến 7, Britannica; năm sinh–mất kiểm với src/data/nha-soan-nhac.yml. Hình periods: chữ trong hình (7 thời kỳ, mốc năm, tên nhà soạn nhạc) khớp bảng của trang; Pärt, Adams, Shaw ở Đương đại khớp nha-soan-nhac.yml. Đã sửa/bỏ: mô tả "đặc điểm âm nhạc", bảng (Baroque, Đương đại), Trung cổ, Phục hưng, Baroque, Cổ điển, Lãng mạn (Beethoven), Thế kỷ 20 (ấn tượng), Đọc thêm, mục Nguồn. Chưa chắc: "Cuối thế kỷ" cho tối giản; Schoenberg và Copland không có trong nha-soan-nhac.yml; Reich và Glass ở Thế kỷ 20 trong trang nhưng ở Đương đại trong dữ liệu. Mốc các thời kỳ là quy ước của site.'
doi_chu:
  - cu: "Các mốc năm dưới đây là quy ước gần đúng; phong cách thay đổi dần dần chứ không đổi trong một đêm. Mỗi thời kỳ có một trang chi tiết (bối cảnh, âm thanh đặc trưng, nhạc cụ, 10 tác phẩm để nghe): Trung cổ, Phục hưng, Baroque, Cổ điển, Lãng mạn, Thế kỷ 20. Thời Đương đại có trang Âm nhạc hôm nay: những nhà soạn nhạc nên nghe, tin đáng chú ý, tên tuổi Việt Nam và các cuộc thi lớn. Xem cả dòng thời gian và Nhạc truyền thống Việt Nam và nhạc cổ điển."
    moi: "Các mốc năm dưới đây là quy ước gần đúng; phong cách thay đổi dần dần chứ không đổi trong một đêm. Mỗi thời kỳ có một trang chi tiết (bối cảnh, đặc điểm âm nhạc, 10 tác phẩm để nghe): Trung cổ, Phục hưng, Baroque, Cổ điển, Lãng mạn, Thế kỷ 20. Thời Đương đại có trang Âm nhạc hôm nay: những nhà soạn nhạc nên nghe, tin đáng chú ý, tên tuổi Việt Nam và các cuộc thi lớn. Xem cả dòng thời gian và Nhạc truyền thống Việt Nam và nhạc cổ điển."
    ly_do: 'n4 (da-sua): "âm thanh đặc trưng, nhạc cụ" thành "đặc điểm âm nhạc" vì trang thế kỷ 20 không có hai mục ấy.'
  - cu: Nhiều trang trí, nhịp đều, bè trầm liên tục, ra đời opera
    moi: Nhiều trang trí, tương phản, bè trầm liên tục, ra đời opera
    ly_do: 'n8 (da-sua): bỏ "nhịp đều".; n23 (da-sua): bỏ "nhịp đều và mạnh".'
  - cu: Đa dạng, giao thoa với điện tử, nhạc phim, nhạc dân gian
    moi: Đa dạng phong cách, nhiều nhà soạn nhạc vẫn đang sáng tác
    ly_do: 'n12 (da-sua): bỏ "giao thoa với điện tử, nhạc phim, nhạc dân gian".'
  - cu: Âm nhạc được ghi lại chủ yếu là nhạc nhà thờ. Thánh ca Gregorian chỉ có một bè giai điệu, hát không đệm, nhịp tự do theo lời. Dần dần người ta thêm bè thứ hai, thứ ba, mở đầu cho phức điệu (polyphony). Hệ thống ký hiệu khuông nhạc cũng hình thành trong giai đoạn này.
    moi: Một phần lớn âm nhạc còn lại từ thời này là nhạc nhà thờ. Thánh ca Gregorian chỉ có một bè giai điệu, hát không đệm, nhịp tự do theo lời. Dần dần người ta thêm bè thứ hai, thứ ba, mở đầu cho phức điệu (polyphony). Hệ thống ký hiệu khuông nhạc cũng hình thành trong giai đoạn này.
    ly_do: 'n13 (da-sua): "chủ yếu" bỏ.'
  - cu: Các bè giọng hát đan xen, bè nào cũng quan trọng như nhau, hòa âm êm hơn. Bên cạnh nhạc nhà thờ (thánh lễ, motet) còn có nhạc thế tục như madrigal. In ấn giúp bản nhạc lan rộng.
    moi: Các bè giọng hát đan xen và bắt chước nhau; quãng ba và hợp âm ba được dùng ngày càng nhiều. Bên cạnh nhạc nhà thờ (thánh lễ, motet) còn có nhạc thế tục như madrigal. In ấn giúp bản nhạc lan rộng.
    ly_do: 'n19 (da-sua): bỏ "bè nào cũng quan trọng như nhau, hòa âm êm hơn".'
  - cu: Đặc trưng là bè trầm liên tục (basso continuo), nhịp đều và mạnh, giai điệu nhiều trang trí, sự tương phản giữa nhóm nhỏ và cả dàn nhạc. Opera ra đời (Monteverdi L'Orfeo, 1607). Các thể loại concerto, fugue, tổ khúc (suite) phát triển mạnh. Giai đoạn này thường được coi là kết thúc năm 1750, năm Bach mất.
    moi: Đặc trưng là bè trầm liên tục (basso continuo), giai điệu nhiều trang trí, sự tương phản giữa nhóm nhỏ và cả dàn nhạc. Opera ra đời (Monteverdi L'Orfeo, 1607). Các thể loại concerto, fugue, tổ khúc (suite) phát triển mạnh. Giai đoạn này thường được coi là kết thúc năm 1750, năm Bach mất.
    ly_do: 'Bảng thời kỳ (lượt 1 D5-L1): Baroque bỏ "nhịp đều và mạnh" (không nguồn bậc 1–2).'
  - cu: "Phản ứng lại sự phức tạp của Baroque: giai điệu rõ ràng, câu nhạc cân đối, kết cấu nhẹ nhàng hơn. Hình thức sonata trở thành khung xương của giao hưởng, concerto, sonata và tứ tấu đàn dây. Đàn piano dần thay thế đàn harpsichord. Trung tâm là Vienna."
    moi: Âm nhạc cân đối, có giai điệu chính được đệm bên dưới. Hình thức sonata trở thành khung xương của giao hưởng, concerto, sonata và tứ tấu đàn dây. Đàn piano dần thay thế đàn harpsichord. Trung tâm là Vienna.
    ly_do: 'n29 (da-sua): bỏ "Phản ứng lại sự phức tạp của Baroque".'
  - cu: Âm nhạc trở thành tiếng nói của cảm xúc cá nhân, thiên nhiên, truyện kể và bản sắc dân tộc. Dàn nhạc lớn hơn, hòa âm nhiều màu sắc hơn. Thời của các nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt. Beethoven giai đoạn cuối là cây cầu bước vào thời kỳ này.
    moi: Âm nhạc trở thành tiếng nói của cảm xúc cá nhân, thiên nhiên, truyện kể và bản sắc dân tộc. Dàn nhạc lớn hơn, hòa âm nhiều màu sắc hơn. Thời của các nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt. Beethoven mất năm 1827, nên những năm cuối đời của ông rơi vào thời kỳ này theo mốc năm ở trên.
    ly_do: 'n37 (da-sua): mốc thay cho ẩn dụ "cây cầu".'
  - cu: Không còn một phong cách chung. Chủ nghĩa ấn tượng (Debussy, Ravel) dùng màu sắc âm thanh mơ hồ. Stravinsky gây chấn động với Le Sacre du printemps (1913). Schoenberg phát triển nhạc 12 âm, bỏ hẳn cảm giác giọng chủ. Bartók đưa dân ca Đông Âu vào nhạc nghệ thuật. Cuối thế kỷ, chủ nghĩa tối giản (minimalism) dùng những mẫu ngắn lặp lại.
