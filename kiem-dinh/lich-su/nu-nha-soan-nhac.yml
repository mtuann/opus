    ghi_chu: 'Chữ cũ: "giao hưởng đầu tiên do một phụ nữ Mỹ viết được xuất bản". Chữ mới thêm "lớn". Runyan Program Notes: "it is the first major symphony composed and published by an American woman". Nguồn bậc 3 (lời giới thiệu chương trình); Britannica ("first symphony by an American woman composer to gain public attention") chặn công cụ nên không dẫn được. Đủ vì câu viết "được coi là". Review D8-gom: nguồn cũ bậc 3; thêm bậc 2: Library of Congress (NLS Music Notes): "the first American woman to compose and publish a large scale musical work, her Gaelic Symphony, written between 1894 and 1896 and premiered in 1896"; Orchestre Métropolitain: "the first American woman composer to publish a symphony and to have it performed". Chữ "được coi là giao hưởng lớn đầu tiên do một phụ nữ Mỹ sáng tác và xuất bản" khớp; giữ.'
