  - id: n13
    cau: 'Strozzi là nhà soạn nhạc có nhiều nhạc thanh nhạc thế tục được in nhất ở Venice thời bà: tám tập aria, madrigal, motet và cantata, in từ 1644 đến 1664.'
    loai: so-lieu
    nguon:
      - ebsco-strozzi
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Được cho là nhà soạn nhạc thế tục xuất bản nhiều nhất ở Venice thời bà, chủ yếu là cantata cho giọng hát." Chữ mới như trên. Lý do: EBSCO: "Strozzi was the most prolific composer of printed secular vocal music in Venice ... published eight volumes of arias, madrigals, motets, and cantatas between 1644 and 1664"; "chủ yếu là cantata" không đúng nguyên văn (có aria, madrigal, motet), đã sửa.'
