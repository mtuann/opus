    luot_2_ghi_chu: Fanny Hensel (1805–1847). Nguồn là Wikipedia (chỉ để xác nhận ý chung, không tìm được nguồn bậc 2 mở được).
  - id: n22
    cau: Fanny Mendelssohn Hensel là người Đức, chị của Felix Mendelssohn.
    loai: lich-su
    nguon:
      - im-hensel
      - yale-zwolf
      - oup-todd
    ket_qua: dung
    ghi_chu: 'Yale: "his older sister Fanny (1805-1847)"; OUP: "Fanny Hensel (1805-1847) was a granddaughter of the philosopher Moses Mendelssohn, a devoted sister of Felix Mendelssohn Bartholdy"; IMSLP Category:Hensel, Fanny xếp vào "German people"; OUP nhắc cantata viết ở Berlin 1831.'
  - id: n23
    cau: Fanny là nghệ sĩ piano và nhà soạn nhạc xuất sắc, nhưng gia đình cho rằng nghề nhạc sĩ chuyên nghiệp không phù hợp với một phụ nữ nên không cho bà theo.
    loai: lich-su
    nguon:
      - yale-zwolf
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "được nhiều người đánh giá tài năng không kém em trai, nhưng gia đình không cho phép bà theo nghề công khai." Chữ mới như trên. Lý do: bỏ so sánh khó kiểm. Yale: "Fanny Mendelssohn (later Fanny Hensel) was an extraordinary musician. ... became an outstanding composer, pianist, and conductor. Unlike her brother, she was not allowed to pursue a career as a professional musician, because her family believed that it would be inappropriate for a woman".'
  - id: n24
    cau: Sáu ca khúc của Fanny được xuất bản dưới tên Felix, trong hai tập Op. 8 và Op. 9 của ông.
    loai: lich-su
    nguon:
      - oup-todd
      - yale-zwolf
      - henle-hn1610
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một số ca khúc của bà từng được xuất bản dưới tên Felix." Chữ mới cụ thể hơn. OUP (R. Larry Todd): "Six of Fanny''s early songs were published under her brother''s name in his first two song collections, Op. 8 and Op. 9." Yale: tập Op. 8 "includes only nine by Mendelssohn. The other three ... are actually by his older sister Fanny". Nguồn khác đếm khác (năm lieder và một song ca): giữ "sáu" theo OUP/Todd, một nhà nghiên cứu Mendelssohn. Review D8-gom: thêm Henle HN 1610: "''Das Heimweh'' (1824), ''Italien'' (1825), and ''Suleika and Hatem'' (1825) are published in the volumes of her brother''s Op. 8 (1827), ''Sehnsucht'' (1827), ''Verlust'' (1828), and ''Die Nonne'' (1822) in that of his Op. 9 (1830)": ba bài ở Op. 8, ba bài ở Op. 9, đủ sáu. Giữ chữ.'
  - id: n25
    cau: 'Nghe: Das Jahr (Một năm, 1841, chùm bản piano theo 12 tháng, thêm một khúc kết).'
