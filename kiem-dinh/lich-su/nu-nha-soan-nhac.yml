      - loc-hil
    ket_qua: dung
    ghi_chu: 'Vatican: "She was born in 1098 ... and died in 1179". LoC: "Hildegard, Saint, 1098-1179". Khớp src/data/nha-soan-nhac.yml (hildegard 1098–1179).'
  - id: n5
    cau: Hildegard von Bingen là người Đức.
    loai: lich-su
    nguon:
      - vat-hil
      - hpc-hil
    ket_qua: dung
    ghi_chu: 'Vatican: "St Hildegard of Bingen, who lived in Germany in the 12th century"; Hildegard Publishing: "Born in Germany".'
  - id: n6
    cau: Hildegard là nữ tu dòng Biển Đức, người đứng đầu một cộng đoàn nữ tu.
    loai: lich-su
    nguon:
      - vat-hil
      - hpc-hil
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nữ tu viện trưởng, nhà thần học, thầy thuốc và nhà soạn nhạc." Chữ mới: "Nữ tu dòng Biển Đức, người đứng đầu một cộng đoàn nữ tu; bà viết về tôn giáo, y học và tự nhiên, và soạn nhạc." Vatican: tu viện theo "the Rule of St Benedict"; 1136 các nữ tu "chose Hildegard to succeed" Jutta, "magistra (Prioress)". "Thầy thuốc" bỏ: nguồn chỉ nói bà quan tâm y học ("Hildegard took an interest in medicine and in the natural sciences as well as in music"); Hildegard Publishing: viết về "religion, art, politics, philosophy, science, medicine, and herbs".'
  - id: n7
    cau: Hildegard viết về tôn giáo, y học và tự nhiên.
    loai: lich-su
    nguon:
      - vat-hil2
      - hpc-hil
    ket_qua: dung
    ghi_chu: 'Vatican 8/9/2010: "Hildegard took an interest in medicine and in the natural sciences as well as in music". Hildegard Publishing: "wrote about religion, art, politics, philosophy, science, medicine, and herbs".'
  - id: n8
    cau: 'Hildegard soạn nhạc: để lại khoảng 77 bài ca (sequence, antiphon, responsory, thánh ca) với lời do chính bà soạn, và một vở kịch nhạc.'
    loai: so-lieu
    nguon:
      - hpc-hil
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Là một trong những nhà soạn nhạc sớm nhất mà ta biết tên và còn giữ được nhiều tác phẩm." Chữ mới: câu số liệu theo nhà xuất bản. Lý do: "sớm nhất" không có nguồn bậc 1-2 (Britannica chặn công cụ). Hildegard Publishing: "Hildegard''s musical corpus, which consists of settings of her own poetry, includes approximately seventy-seven sequences, antiphons, responsories, and hymns, as well as a liturgical drama, the Ordo virtutum."'
  - id: n9
