khuong_nhac: []
ghi_chu: 'Trang Đọc thêm (ngoại vi), không có khối abc. Mọi nguồn truy cập 2026-11-05. Nguồn chính: IMSLP (năm sinh–mất, tên và năm tác phẩm), Encyclopedia.com (Women in World History: Clara, Chaminade, Clarke, Lili và Nadia Boulanger, Bacewicz), Vatican và Hildegard Publishing (Hildegard), EBSCO (Strozzi), CSO (Price), Yale và OUP (Fanny), Library of Congress (năm của Hildegard, Gubaidulina, Chin, Thorvaldsdottir, Frank), Boston Globe/NYT, BSO, CSO, ISCM (Gubaidulina), PBS/NYCR/Wise (Saariaho), Boosey (Chin), NPR/Princetonian (Shaw), ASO/Dallas Symphony (Montgomery), YourClassical (NPR) và Time Out (Frank), TTVH/Hội Nhạc sĩ VN/Dân trí (Nguyễn Thị Nhung), Hội Nhạc sĩ VN (Trần Kim Ngọc), Tuổi Trẻ/SGGP/TTVH (Sa Huỳnh). pulitzer.org, Britannica, Grove và PDF British Council trả 403 cho công cụ; Wikipedia chỉ để đối chiếu. Chỗ sửa trang (da-sua): n6, n8, n13, n20, n23, n24, n25, n29, n39, n50, n55, n65, n72, n77, n82, n83, n84, n89 đến n93, n95, n97, n98, n100, n102; đã bỏ (da-bo): Romance (1999) của Nguyễn Thị Nhung (n87), mục Nguồn cũ gồm sách Burkholder/Taruskin, Grove, Britannica (n103) và link PDF British Council (n104). Câu ''đầu tiên'' đã kiểm: Lili Boulanger Prix de Rome 1913 (Encyclopedia.com, dung); Price 1933 (CSO, dung); Beach Gaelic (Runyan Program Notes bậc 3, Britannica chặn: thêm ''lớn'', giữ ''được coi là''); Jacquet ''một trong những người đầu tiên'' (TSPR, Kvast; được bao hàm bởi ''first woman in France to compose an opera''); Nguyễn Thị Nhung ''tiên phong'' (TTVH: ''nữ nhạc sĩ đầu tiên sáng tác nhạc giao hưởng của Việt Nam''); ''người phụ nữ duy nhất nhận Giải thưởng Nhà nước đợt I'' đã bỏ (chỉ Wikipedia). Strozzi ''xuất bản nhiều nhất'' theo EBSCO (''most prolific composer of printed secular vocal music in Venice''). Gabriela Lena Frank giải Pulitzer Âm nhạc 2026: ĐÚNG (Picaflor: A Future Myth; YourClassical/NPR 4/5/2026, Time Out), giữ. Gubaidulina mất 13/3/2025 ở tuổi 93 (CSO, BSO, ISCM). Saariaho 1952–2023 (PBS, Wise). Shaw Pulitzer 2013 (NPR, Princetonian). Montgomery 1981 (ASO, Dallas Symphony), Thorvaldsdottir 1977 (Wise, LoC), Chin 1961 (Boosey, LoC). Năm sinh–mất khớp src/data/nha-soan-nhac.yml cho mọi người có bản ghi; không phát hiện bản ghi sai. Hồ sơ dữ liệu sa-huynh dặn xử lý ''tên khai sinh Nguyễn Sa Huỳnh'': đã sửa thành Lương Sa Huỳnh (Tuổi Trẻ 2015); sinh 1988 (Tuổi Trẻ). Có hai người nghệ danh Sa Huỳnh, trang nói về nhạc sĩ con gái Triều Dâng. Câu ve-site (n3, n76, n105): link /opus/lich-su/duong-dai/ chưa khóa (không có trong khoa.json) nên ''sắp có'' ở bản thật cho tới khi trang ấy khóa; /opus/tai-lieu-tham-khao/ đã khóa. Anchor #the-ky-19 (tiêu đề ''## Thế kỷ 19'') giữ nguyên vì piano/nha-soan-nhac trỏ vào. Dấu vân tay của Sa Huỳnh (n100) chỉ có nguồn bậc 3 (Doanh nhân Trẻ Việt Nam, lời nhận xét ''dưới góc nhìn của ca sĩ Tùng Dương''): chỗ cần lượt 2 hay review quyết, bỏ được. Thuật ngữ trang dùng, chưa có ở src/data/thuat-ngu.yml cho D3-L5 (đã có: concerto, symphony, sonata, string quartet, suite, oratorio): cantata, harpsichord, Prix de Rome, bayan, concertino, opera, thơ giao hưởng (symphonic poem), tam tấu piano (piano trio), spiritual, aria, madrigal, motet, sequence, antiphon, responsory, kịch nhạc (liturgical drama), thánh ca (hymn), psalm.'
doi_chu:
  - cu: Lịch sử âm nhạc thường được kể qua những cái tên nam giới. Không phải vì phụ nữ không sáng tác, mà vì trong nhiều thế kỷ họ bị hạn chế học hành, xuất bản và biểu diễn công khai. Ngày nay, nhiều tác phẩm của họ đang được tái khám phá, ghi âm và đưa vào chương trình hòa nhạc. Trang này giới thiệu một số tên tuổi nên biết.
    moi: Lịch sử âm nhạc thường được kể qua những cái tên nam giới. Không phải vì phụ nữ không sáng tác, mà vì trong nhiều thế kỷ họ bị hạn chế học hành, xuất bản và biểu diễn công khai. Ngày nay, nhiều tác phẩm của họ đang được tái khám phá, ghi âm và đưa vào chương trình hòa nhạc. Trang này giới thiệu một số nhà soạn nhạc nữ.
    ly_do: 'n3 (da-sua): "một số tên tuổi nên biết" bỏ "nên biết" (lời khuyên văn hoa, không kiểm được); đoạn mở bài còn lại giữ (n1, n2).'
  - cu: 'Hildegard von Bingen (1098–1179), Đức. Nữ tu viện trưởng, nhà thần học, thầy thuốc và nhà soạn nhạc. Là một trong những nhà soạn nhạc sớm nhất mà ta biết tên và còn giữ được nhiều tác phẩm. Nghe: O vis aeternitatis; Ordo Virtutum (vở kịch nhạc đạo đức).'
    moi: 'Hildegard von Bingen (1098–1179), Đức. Nữ tu dòng Biển Đức, người đứng đầu một cộng đoàn nữ tu; bà viết về tôn giáo, y học và tự nhiên, và soạn nhạc. Bà để lại khoảng 77 bài ca (sequence, antiphon, responsory, thánh ca) với lời do chính bà soạn, và một vở kịch nhạc. Nghe: O vis aeternitatis; Ordo Virtutum (vở kịch nhạc đạo đức).'
    ly_do: 'n6, n8 (da-sua): "Nữ tu viện trưởng, nhà thần học, thầy thuốc" thành nữ tu dòng Biển Đức đứng đầu một cộng đoàn; bỏ "thầy thuốc" và "một trong những nhà soạn nhạc sớm nhất mà ta biết tên" (nguồn bậc 1-2 chỉ có số liệu "khoảng 77 bài ca"; theo Vatican, Hildegard Publishing).'
  - cu: 'Barbara Strozzi (1619–1677), Ý. Được cho là nhà soạn nhạc thế tục xuất bản nhiều nhất ở Venice thời bà, chủ yếu là cantata cho giọng hát. Nghe: Che si può fare; Lagrime mie.'
    moi: 'Barbara Strozzi (1619–1677), Ý. Bà là nhà soạn nhạc có nhiều nhạc thanh nhạc thế tục được in nhất ở Venice thời bà: tám tập aria, madrigal, motet và cantata, in từ 1644 đến 1664. Nghe: Che si può fare; Lagrime mie.'
    ly_do: 'n13 (da-sua): "được cho là ... xuất bản nhiều nhất" thành câu có số liệu (tám tập aria, madrigal, motet, cantata, 1644–1664) và bỏ "chủ yếu là cantata"; theo EBSCO.'
  - cu: 'Élisabeth Jacquet de La Guerre (1665–1729), Pháp. Thần đồng đàn harpsichord trong triều Louis XIV, một trong những người phụ nữ đầu tiên ở Pháp viết opera. Nghe: các tổ khúc cho harpsichord.'
    moi: 'Élisabeth Jacquet de La Guerre (1665–1729), Pháp. Thần đồng đàn harpsichord trong triều Louis XIV, một trong những người phụ nữ đầu tiên ở Pháp viết opera. Nghe: Pièces de clavecin (hai tập) cho harpsichord.'
    ly_do: 'n20 (da-sua): "các tổ khúc cho harpsichord" thành tên tập Pièces de clavecin (IMSLP); không có nguồn đã mở nói "tổ khúc".'
  - cu: 'Fanny Mendelssohn Hensel (1805–1847), Đức. Chị của Felix Mendelssohn, được nhiều người đánh giá tài năng không kém em trai, nhưng gia đình không cho phép bà theo nghề công khai. Một số ca khúc của bà từng được xuất bản dưới tên Felix. Nghe: Das Jahr (Một năm, chùm 12 bản piano); Tứ tấu đàn dây cung Mi♭ trưởng.'
    moi: 'Fanny Mendelssohn Hensel (1805–1847), Đức. Chị của Felix Mendelssohn. Bà là nghệ sĩ piano và nhà soạn nhạc xuất sắc, nhưng gia đình cho rằng nghề nhạc sĩ chuyên nghiệp không phù hợp với một phụ nữ nên không cho bà theo. Sáu ca khúc của bà từng được xuất bản dưới tên Felix, trong hai tập Op. 8 và Op. 9 của ông. Nghe: Das Jahr (Một năm, 1841, chùm bản piano theo 12 tháng, thêm một khúc kết); Tứ tấu đàn dây cung Mi♭ trưởng.'
    ly_do: 'n23, n24, n25 (da-sua): bỏ "tài năng không kém em trai" (so sánh không kiểm được), nói rõ lý do gia đình (Yale); "một số ca khúc" thành "sáu ca khúc ... Op. 8 và Op. 9" (OUP, Yale); Das Jahr: IMSLP ghi 13 phần (12 tháng cộng khúc kết), 1841, không phải "12 bản".'
  - cu: 'Clara Schumann (1819–1896), Đức. Một trong những nghệ sĩ piano lừng danh nhất thế kỷ 19, vợ của Robert Schumann và bạn thân của Brahms. Bà vừa biểu diễn, vừa dạy, vừa sáng tác. Nghe: Concerto piano cung La thứ; Tam tấu piano cung Sol thứ.'
    moi: 'Clara Schumann (1819–1896), Đức. Một trong những nghệ sĩ piano lừng danh nhất thế kỷ 19, vợ của Robert Schumann và bạn của Brahms. Bà vừa biểu diễn, vừa dạy, vừa sáng tác. Nghe: Concerto piano cung La thứ; Tam tấu piano cung Sol thứ.'
    ly_do: 'n29 (da-sua): "bạn thân của Brahms" thành "bạn của Brahms" (Yale: "became friends"); nguồn không dùng "thân".'
  - cu: 'Amy Beach (1867–1944), Mỹ. Nhà soạn nhạc Mỹ tự học phần lớn; Giao hưởng Gaelic (1896) của bà được coi là giao hưởng đầu tiên do một phụ nữ Mỹ viết được xuất bản. Nghe: Giao hưởng Gaelic; Concerto piano.'
    moi: 'Amy Beach (1867–1944), Mỹ. Nhà soạn nhạc Mỹ tự học phần lớn; Giao hưởng Gaelic (1896) của bà được coi là giao hưởng lớn đầu tiên do một phụ nữ Mỹ sáng tác và xuất bản. Nghe: Giao hưởng Gaelic; Concerto piano.'
    ly_do: 'n39 (da-sua): thêm "lớn" và đổi "viết được xuất bản" thành "sáng tác và xuất bản" theo Runyan Program Notes ("the first major symphony composed and published by an American woman").'
  - cu: 'Rebecca Clarke (1886–1979), Anh. Nghệ sĩ viola và nhà soạn nhạc; Sonata viola của bà là một trong những tác phẩm quan trọng nhất cho nhạc cụ này. Nghe: Sonata viola (1919).'
    moi: 'Rebecca Clarke (1886–1979), Anh. Nghệ sĩ viola và nhà soạn nhạc; Sonata viola (1919) của bà hòa hạng nhất với tác phẩm của Ernest Bloch trong cuộc thi sáng tác do Elizabeth Sprague Coolidge tổ chức ở Berkshire; phiếu quyết định của bà Coolidge xếp Clarke thứ nhì. Nghe: Sonata viola (1919).'
    ly_do: 'n50 (da-sua): "là một trong những tác phẩm quan trọng nhất cho nhạc cụ này" (tuyệt đối, không có nguồn) thành sự kiện đã kiểm: hòa hạng nhất với Bloch ở cuộc thi Berkshire 1919, Coolidge xếp nhì (Hildegard Publishing, The Strad).'
  - cu: 'Lili Boulanger (1893–1918), Pháp. Năm 1913, bà trở thành người phụ nữ đầu tiên giành Giải thưởng Rome (Prix de Rome) về sáng tác. Bà mất năm 24 tuổi. Chị gái Nadia Boulanger (1887–1979) trở thành một trong những người thầy dạy sáng tác có ảnh hưởng nhất thế kỷ 20, với học trò như Aaron Copland, Philip Glass, Astor Piazzolla. Nghe: Lili Boulanger D''un matin de printemps; Psaume 130.'
    moi: 'Lili Boulanger (1893–1918), Pháp. Năm 1913, bà trở thành người phụ nữ đầu tiên giành Giải thưởng Rome (Prix de Rome) về sáng tác. Bà mất năm 24 tuổi. Chị gái Nadia Boulanger (1887–1979) trở thành một trong những người thầy âm nhạc có ảnh hưởng của thế kỷ 20, với học trò như Aaron Copland, Philip Glass, Astor Piazzolla. Nghe: Lili Boulanger D''un matin de printemps; Psaume 130.'
    ly_do: 'n55 (da-sua): bỏ "nhất" và "dạy sáng tác" (nguồn: "one of the most influential musicians of the 20th century").'
  - cu: 'Sofia Gubaidulina (1931–2025), Nga, sống ở Đức từ năm 1992. Âm nhạc mang chiều sâu tâm linh, thường dùng nhạc cụ khác thường như bayan (accordion Nga). Bà mất tháng 3 năm 2025 ở tuổi 93. Nghe: Offertorium (concerto violin); De profundis cho bayan.'
    moi: 'Sofia Gubaidulina (1931–2025), Nga, sống ở Đức từ năm 1992. Âm nhạc mang chiều sâu tâm linh; bà gắn bó đặc biệt với bayan (accordion nút bấm của Nga) và viết nhiều tác phẩm có phần bayan. Bà mất tháng 3 năm 2025 ở tuổi 93. Nghe: Offertorium (concerto violin); De profundis cho bayan.'
    ly_do: 'n65 (da-sua): "thường dùng nhạc cụ khác thường như bayan" thành "gắn bó đặc biệt với bayan ... viết nhiều tác phẩm có phần bayan" (Boston Globe/NYT: "special affinity with the bayan").'
  - cu: Kaija Saariaho (1952–2023), Phần Lan; Unsuk Chin (sinh 1961), Hàn Quốc; Caroline Shaw (sinh 1982), Mỹ, giải Pulitzer 2013; Jessie Montgomery (sinh 1981), Mỹ; Anna Thorvaldsdottir (sinh 1977), Iceland; Gabriela Lena Frank, Mỹ, giải Pulitzer Âm nhạc 2026. Xem thêm ở Âm nhạc hôm nay.
    moi: Kaija Saariaho (1952–2023), Phần Lan; Unsuk Chin (sinh 1961), Hàn Quốc; Caroline Shaw (sinh 1982), Mỹ, giải Pulitzer Âm nhạc 2013; Jessie Montgomery (sinh 1981), Mỹ; Anna Thorvaldsdottir (sinh 1977), Iceland; Gabriela Lena Frank, Mỹ, giải Pulitzer Âm nhạc 2026. Xem thêm ở Âm nhạc hôm nay.
    ly_do: 'n72 (da-sua): "giải Pulitzer 2013" thành "giải Pulitzer Âm nhạc 2013" (hạng mục; NPR, Princetonian).'
  - cu: Ở Việt Nam, phụ nữ cũng đã ghi dấu ấn trong sáng tác — từ những bản thơ giao hưởng đầu tiên của thế kỷ 20 đến âm nhạc thể nghiệm hôm nay.
    moi: Ở Việt Nam, phụ nữ cũng đã ghi dấu ấn trong sáng tác — từ nhạc giao hưởng của thế kỷ 20 đến âm nhạc thể nghiệm hôm nay.
    ly_do: 'n77 (da-sua): "những bản thơ giao hưởng đầu tiên của thế kỷ 20" thành "nhạc giao hưởng của thế kỷ 20" (bản thơ giao hưởng đầu tiên của Nguyễn Thị Nhung là năm 1972).'
  - cu: 'Nguyễn Thị Nhung (sinh 1936), Hà Nội. Bà được xem là nữ nhạc sĩ Việt Nam tiên phong trong việc sáng tác nhạc giao hưởng: bản thơ giao hưởng Nữ anh hùng miền Nam (1972). Vợ của nhạc sĩ Huy Du, bà còn là nhà lý luận âm nhạc và từng là Phó giám đốc Nhạc viện Hà Nội, đào tạo nhiều thế hệ nhạc sĩ. Năm 2001, bà là người phụ nữ duy nhất nhận Giải thưởng Nhà nước về văn học nghệ thuật đợt I. Dấu vân tay: chất liệu dân ca được đặt trong cấu trúc giao hưởng châu Âu. Nghe: thơ giao hưởng Nữ anh hùng miền Nam (1972); thơ giao hưởng Khát vọng (1986); Romance cho violin và piano (1999).'
    moi: 'Nguyễn Thị Nhung (sinh 1936), Hà Nội. Bà được xem là nữ nhạc sĩ Việt Nam tiên phong trong việc sáng tác nhạc giao hưởng: bản thơ giao hưởng Nữ anh hùng miền Nam (1972). Vợ của nhạc sĩ Huy Du, bà còn là nhà lý luận âm nhạc và từng là Phó giám đốc Nhạc viện Hà Nội, đào tạo nhiều thế hệ sinh viên âm nhạc. Năm 2001, bà nhận Giải thưởng Nhà nước về văn học nghệ thuật. Dấu vân tay: âm hưởng dân ca Việt Nam kết hợp với chất liệu âm nhạc phương Tây trong các tác phẩm giao hưởng. Nghe: thơ giao hưởng Nữ anh hùng miền Nam (1972); thơ giao hưởng Khát vọng (1986).'
    ly_do: 'n82, n83, n84 (da-sua): "nhạc sĩ" thành "sinh viên âm nhạc" (Hội Nhạc sĩ VN); bỏ "người phụ nữ duy nhất" và "đợt I" (chỉ có ở Wikipedia, bậc 3; Hội Nhạc sĩ VN ghi 2001); "Dấu vân tay" theo TTVH, bỏ "cấu trúc giao hưởng châu Âu". n87 (da-bo): bỏ Romance cho violin và piano (1999) (chỉ Wikipedia tiếng Việt, tự mâu thuẫn 1998/1999).'
  - cu: 'Trần Kim Ngọc (sinh 1975), Hà Nội. Chị trở thành thành viên Hội Nữ nhạc sĩ Quốc tế từ năm 20 tuổi, từng học 3 năm tại Đức, rồi rẽ hẳn sang âm nhạc thể nghiệm đương đại; chị sáng lập nhóm Đom Đóm (2012) và Liên hoan Nhạc mới Hà Nội. Dấu vân tay: lấy chất liệu từ Tuồng cổ và dân gian đặt cạnh nhạc cụ phương Tây, video và trình diễn đa phương tiện. Nghe: Hồ Nguyệt Cô hoá cáo (2017, cho ngũ tấu và video, dựa trên tích Tuồng cổ — có bản ghi hình trên YouTube).'
    moi: 'Trần Kim Ngọc (sinh 1975), Hà Nội. Chị trở thành thành viên Hội Nữ nhạc sĩ Quốc tế ở tuổi 20, từng học 3 năm tại Đức, rồi tập trung vào âm nhạc đương đại và thể nghiệm; chị sáng lập Trung tâm Đom Đóm (2012) và Liên hoan Nhạc mới Hà Nội. Dấu vân tay: nghệ thuật xuyên ngành, như đặt video trình diễn Tuồng cạnh nhạc cụ cổ điển phương Tây. Nghe: Hồ Nguyệt Cô hoá cáo (cho ngũ tấu nhạc cụ cổ điển cùng bộ gõ, và video trình diễn Tuồng; công diễn ở Liên hoan Nhạc mới Hà Nội 2018).'
    ly_do: 'n89 đến n93 (da-sua): "từ năm 20 tuổi" thành "ở tuổi 20" (Hội Nhạc sĩ VN: 1995, độ tuổi 20); "rẽ hẳn sang" thành "tập trung vào"; "nhóm Đom Đóm" thành "Trung tâm Đom Đóm"; dấu vân tay chỉ giữ điều nguồn nói (xuyên ngành, video trình diễn Tuồng, nhạc cụ cổ điển); Hồ Nguyệt Cô hoá cáo: bỏ năm 2017 (chưa mở được nguồn nói) và "có bản ghi hình trên YouTube" (chi tiết mau, chưa mở), thêm thành phần và nơi công diễn theo Hội Nhạc sĩ VN.'
  - cu: 'Sa Huỳnh (sinh 1988), tên khai sinh Nguyễn Sa Huỳnh. Con gái cố nhạc sĩ Triều Dâng, chị tốt nghiệp đại học chuyên ngành Sáng tác tại Nhạc viện TP. Hồ Chí Minh với nền tảng khí nhạc cổ điển vững chắc, rồi đi con đường riêng: dân gian đương đại, art rock, progressive rock. Dấu vân tay: hòa âm và cấu trúc phức điệu của nhạc cổ điển được "mặc" lên chất liệu dân gian và rock thể nghiệm; nhiều ca khúc bắt đầu từ những quan sát rất đời thường. Nghe: Về ăn cơm; Chiếc ô ngăn đôi; các ca khúc chủ đề trong album Human của Tùng Dương.'
    moi: 'Sa Huỳnh (sinh 1988), tên khai sinh Lương Sa Huỳnh. Con gái cố nhạc sĩ Triều Dâng, chị học Khoa Piano, Nhạc viện TP. Hồ Chí Minh, được biết đến từ ca khúc Về ăn cơm (Bài hát Việt 2007), rồi viết nhiều ca khúc cho ca sĩ Tùng Dương. Dấu vân tay: các ca khúc trong album Human đi qua những chặng đường của đời người, những suy nghĩ về cuộc sống. Nghe: Về ăn cơm; Chiếc ô ngăn đôi; sáu ca khúc của chị trong album Human của Tùng Dương.'
    ly_do: 'n95, n97, n98, n100, n102 (da-sua): "Nguyễn Sa Huỳnh" thành "Lương Sa Huỳnh" (Tuổi Trẻ); bỏ "chuyên ngành Sáng tác", "khí nhạc cổ điển vững chắc", "dân gian đương đại, art rock, progressive rock" và dấu vân tay cũ (không nguồn đã mở: SGGP ghi Khoa Piano); thay bằng điều nguồn có (Về ăn cơm, Bài hát Việt 2007, Tùng Dương, 6 bài trong Human); "các ca khúc chủ đề" thành "sáu ca khúc" (TTVH). Review D8-gom: n100 viết lại theo TTVH 2021 (nguồn cũ bậc 3).'
  - cu: Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music.
