    ghi_chu: 'Chữ cũ: "(Một năm, chùm 12 bản piano)". IMSLP: "13 movements" (1. January ... 12. December, 13. Postlude), "Composition Year 1841"; "later edited publications ... have the subtitle ''12 Charakterstücke''". Đã sửa cho khớp.'
