    cau: Lịch sử âm nhạc thường được kể qua những cái tên nam giới; trong nhiều thế kỷ phụ nữ bị hạn chế học hành, xuất bản và biểu diễn công khai.
    loai: lich-su
    nguon:
      - ebsco-strozzi
      - yale-zwolf
    ket_qua: dung
    ghi_chu: 'EBSCO (Strozzi): "In an era when women composers were uncommon or unwelcome, and when few composers of either gender had their music printed". Yale (Fanny): "she was not allowed to pursue a career as a professional musician, because her family believed that it would be inappropriate for a woman". Câu tổng quát, giữ vì có hai ví dụ đã kiểm.'
  - id: n2
    cau: Ngày nay nhiều tác phẩm của các nhà soạn nhạc nữ đang được tái khám phá, ghi âm và đưa vào chương trình hòa nhạc.
    loai: lich-su
    nguon:
      - cso-price
      - udm-price
    ket_qua: dung
    ghi_chu: 'CSO: Price là "a Black woman composer ... whose music had long been overlooked, neglected and dismissed" nay có "renaissance"; uDiscover: đĩa "Florence Price: Symphonies Nos. 1 & 3" (Philadelphia Orchestra, DG) đoạt Grammy. Câu chung, giữ ở mức "nhiều".'
  - id: n3
    cau: Câu "Trang này giới thiệu một số nhà soạn nhạc nữ."
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Kiểm: trang liệt kê 22 nhà soạn nhạc nữ (kể cả Nadia Boulanger) chia theo thời kỳ. Chữ cũ "một số tên tuổi nên biết" đã đổi (doi_chu). Review D8-gom: câu cuối đoạn mở đầu; trang giới thiệu các nhà soạn nhạc nữ theo thời kỳ.'
    review: dung
