    luot_2_nguon: [ "https://baophapluat.vn/do-nhuan-nguoi-dung-hoa-tinh-dan-toc-va-quoc-te-post64743.html", "https://vietnamnews.vn/life-style/297147/viet-nam-stages-its-second-opera.html", "https://baobinhduong.vn/en/historic-vietnamese-opera-re-staged-a72400.html" ]
