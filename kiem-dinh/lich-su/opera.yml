    ghi_chu: 'Chữ cũ: "đời sống thường ngày, cảm xúc mãnh liệt. Puccini (...)". Đổi theo COD, Verismo; nói Puccini được xếp vào đại diện thay vì khẳng định ông là verismo thuần.'
    luot_2: dung
    luot_2_nguon: [ "https://courses.lumenlearning.com/suny-musicapp-medieval-modern/chapter/verismo/", "https://www.britannica.com/biography/Giacomo-Puccini" ]
    luot_2_ghi_chu: 'Verismo = hiện thực, đề tài đời thường đương thời; Cavalleria rusticana (Mascagni, 1890) thường coi là vở verismo đầu tiên; Puccini là một đại diện (Britannica: "operatic realism"); Tosca được xếp verismo.'
