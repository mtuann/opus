  - id: n47
    cau: Vở kể về A Sao, cô gái người Thái mồ côi, chịu bất công dưới sự cai trị thực dân rồi được cách mạng thuyết phục đứng lên chống Pháp; âm nhạc mang âm điệu Tây Bắc.
    loai: lich-su
    nguon:
      - vn-binhduong
      - vn-phapluat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cô gái người Thái bị hủ tục ruồng bỏ rồi được cách mạng giác ngộ" và "viết khi đang du học tại Nhạc viện Tchaikovsky (Moskva)", "kết hợp kỹ thuật hát bel canto châu Âu với chất liệu dân tộc Tây Bắc, công thức nhiều opera Việt sau này đi theo". Cốt truyện viết lại theo nguồn; hai vế còn lại bỏ vì không kiểm được (du học Moskva không xác nhận được ở nguồn đã mở).'
    luot_2: dung
    luot_2_nguon: [ "https://baobinhduong.vn/en/historic-vietnamese-opera-re-staged-a72400.html" ]
    luot_2_ghi_chu: A Sao mồ côi người Thái, chịu bất công dưới cai trị thực dân rồi được cách mạng thuyết phục chống Pháp; bối cảnh Sơn La. Chi tiết "âm điệu Tây Bắc" không được nguồn xác nhận trực tiếp.
