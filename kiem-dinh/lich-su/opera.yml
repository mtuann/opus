  - id: n25
    cau: "Verismo (cuối thế kỷ 19, Ý): chủ nghĩa hiện thực, thường lấy đề tài đương thời và đời thường (như Cavalleria rusticana của Mascagni). Puccini (La bohème, Tosca, Madama Butterfly) được xếp vào những đại diện lớn của chủ nghĩa hiện thực trong opera."
