nhan_dinh:
  - id: n1
    cau: Opera là kịch được hát toàn bộ (hoặc gần như toàn bộ), với dàn nhạc, dàn dựng sân khấu, trang phục và diễn xuất.
    loai: dinh-nghia
    nguon:
      - cod-opera
      - brit-opera
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/opera-music", "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446" ]
    luot_2_ghi_chu: 'Britannica: kịch dàn dựng được phổ nhạc toàn bộ; "gần như" hợp lý vì có thể có lời thoại nói (Singspiel).'
  - id: n2
    cau: Opera ra đời ở Ý khoảng năm 1600.
    loai: nam
    nguon:
      - cod-opera
      - lt-4.3
      - brit-opera
    ket_qua: da-sua
    ghi_chu: Chữ cũ thêm "và là một trong những thể loại quan trọng nhất của nhạc cổ điển" (xếp hạng không kiểm được); bỏ. Opera ra đời ở Ý khoảng 1600 (COD, Clark 4.3).
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446", "https://stageagent.com/learn/yud6qqllqrxy6dfclithw/the-birth-of-opera-and-the-early-baroque", "https://www.sfopera.com/link/7206a7082bae4fd281843cc90f6b730b.aspx" ]
    luot_2_ghi_chu: Opera hình thành ở Florence (Ý) cuối thế kỷ 16 đầu 17; Peri Euridice 1600, Monteverdi L'Orfeo 1607.
  - id: n3
    cau: Nhiều nhà soạn nhạc như Verdi, Wagner, Puccini nổi tiếng chủ yếu nhờ opera.
    loai: lich-su
    nguon:
      - brit-verdi
      - brit-wagner
      - brit-puccini
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Giuseppe-Verdi", "https://www.britannica.com/biography/Richard-Wagner-German-composer", "https://www.britannica.com/biography/Giacomo-Puccini" ]
    luot_2_ghi_chu: Ba người nổi tiếng chủ yếu nhờ opera/nhạc kịch; các trang Britannica liệt kê opera là tác phẩm chính.
  - id: n4
    cau: "Overture: khúc mở màn của dàn nhạc; giới thiệu không khí, đôi khi cả các giai điệu của vở."
    loai: dinh-nghia
    nguon:
      - cod-overture
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446" ]
    luot_2_ghi_chu: '"Operas often began with an instrumental piece called the overture."'
  - id: n5
    cau: 'Recitative: hát "nói", nhịp tự do, đệm đơn giản; đẩy câu chuyện đi tiếp (đối thoại, sự kiện).'
    loai: dinh-nghia
    nguon:
      - cod-recit
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446", "https://www.metopera.org/link/6720ce5733ef43f6a416d4e6ff08d203.aspx" ]
    luot_2_ghi_chu: "Recitative: hát theo nhịp điệu và ngữ điệu lời nói, đệm basso continuo; mang tình tiết/đối thoại."
  - id: n6
    cau: "Aria: bài hát đơn, giai điệu đẹp; dừng thời gian để nhân vật bày tỏ cảm xúc."
    loai: dinh-nghia
    nguon:
      - cod-aria
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.metopera.org/link/6720ce5733ef43f6a416d4e6ff08d203.aspx", "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446" ]
    luot_2_ghi_chu: "Aria: bài đơn, thường là lúc dừng suy tư (reflective pause), trữ tình."
  - id: n7
    cau: "Ensemble: song ca, tam ca, tứ ca… (nhiều nhân vật cùng hát)."
    loai: dinh-nghia
    nguon:
      - cod-ensemble
    ket_qua: da-sua
    ghi_chu: Chữ cũ thêm "mỗi người một cảm xúc" (không kiểm được); bỏ.
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446" ]
    luot_2_ghi_chu: Không có định nghĩa trực tiếp ở nguồn đã mở (chỉ liệt kê các tiết mục opera); đây là nghĩa chuẩn của thuật ngữ.
  - id: n8
    cau: "Hợp xướng: cả nhóm người hát; vai trò dân làng, binh lính, khách dự tiệc…"
    loai: dinh-nghia
    nguon:
      - cod-chorus
    ket_qua: null
    ghi_chu: 'chưa chắc: COD, Chorus xác nhận hợp xướng là nhóm hát; ví dụ "dân làng, binh lính, khách dự tiệc" là minh họa chung, chưa có nguồn đã mở nêu đúng các nhóm này. Lượt 2 kiểm hay bỏ ví dụ.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446" ]
    luot_2_ghi_chu: Hợp xướng là nhóm ca sĩ trong opera; vai dân làng/binh lính là cách dùng thông thường.
  - id: n9
    cau: "Libretto: kịch bản (lời), thường do nhà thơ viết, nhà soạn nhạc phổ nhạc."
    loai: dinh-nghia
    nguon:
      - cod-libretto
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=446" ]
    luot_2_ghi_chu: Libretto là văn bản của opera để phổ nhạc; do người viết lời (thường là nhà thơ/kịch tác gia) soạn.
  - id: n10
    cau: "Hình ranges-voices (chữ trong hình): sáu giọng (Soprano, Mezzo-soprano, Alto, Tenor, Baritone, Bass) và âm vực từng giọng."
    loai: ve-site
    nguon:
      - met-bohe
      - cod-soprano
      - cod-tenor
    ket_qua: null
    ghi_chu: 'chưa chắc: đã đọc src/components/hinh/ranges-voices.html (module dựng hình). (1) Hình có sáu giọng, không có countertenor, còn bảng bên dưới có bảy giọng: người giao thêm hay ghi chú. (2) Hình ghi "Alto", bảng ghi "Contralto (còn gọi là alto)": Met Opera (hướng dẫn La bohème) cho contralto = alto, nên không sai, nên thống nhất. (3) Hình dùng tên nốt chữ (C4, A3), các trang khác dùng Đô4: nên thống nhất. (4) Âm vực: soprano và tenor khớp COD; mezzo, contralto/alto, baritone, bass lệch 1–2 nửa cung so với COD và các nguồn khác (Wikipedia, McKinney): giữ null, người giao chọn một nguồn. Không sửa file hình.'
  - id: n11
    cau: "Soprano: giọng nữ cao; ví dụ vai Mimì (La bohème)."
    loai: dinh-nghia
    nguon:
      - cod-soprano
      - met-bohe
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhân vật nữ chính, người tình trẻ" (không kiểm được); thay bằng ví dụ vai cụ thể (Met: Mimì là soprano).'
    luot_2: dung
    luot_2_nguon: [ "https://operavision.eu/feature/voice-types", "https://www.britannica.com/topic/La-Boheme-opera-by-Puccini" ]
