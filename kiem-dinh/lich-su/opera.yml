    ly_do: 'n11 (da-sua), n12, n13, n14, n15, n16, n17: cột "Vai thường gặp" (nhận định về kiểu vai) thay bằng "Ví dụ vai" cụ thể.'
  - cu: Nhân vật mạnh mẽ, quyến rũ (Carmen), hoặc vai nam thiếu niên
