ghi_chu: 'Nhập môn opera. Nguồn chính: COD (opera, giọng, từng vở), Britannica, Clark chương 4, Met Opera (La bohème), VNOB, Hội Nhạc sĩ VN, Pháp Luật; báo (Thể thao & Văn hóa, ArtTimes, Vietnam News, Bình Dương) chỉ là bậc 3. Đã sửa/bỏ: mô tả, bảng giọng (ví dụ vai thay cho kiểu vai), truyền thống (năm, bỏ 15 tiếng), bảng 10 vở, mục xem opera (bỏ Hồ Gươm 2026, vỗ tay), toàn bộ mục "Opera ở Việt Nam" viết lại (bỏ Công nữ Anio, giọng ca Việt, Giấc mơ Chí Phèo, thời Pháp thuộc), mục Nguồn. Chưa chắc: Hợp xướng (ví dụ), năm/ngày Người tạc tượng (1970 hay 1971), Lá đỏ 2016, 1.000 trang bản nháp Cô Sao, HBSO. Hình ranges-voices: sáu giọng (không có countertenor), "Alto" so với "Contralto", tên nốt bằng chữ, âm vực mezzo/alto/baritone/bass lệch 1–2 nửa cung so với COD: người giao quyết. Lô trước không yêu cầu điều gì ở trang này. Liên kết sang trang chưa chuyển: lich-su/viet-nam, tai-lieu-tham-khao, nghe-nhac/mozart-nu-hoang-bong-dem, nghe-nhac/bizet-habanera.'
doi_chu:
  - cu: "Opera là kịch được hát toàn bộ (hoặc gần như toàn bộ), với dàn nhạc, dàn dựng sân khấu, trang phục và diễn xuất. Opera ra đời ở Ý khoảng năm 1600 và là một trong những thể loại quan trọng nhất của nhạc cổ điển: nhiều nhà soạn nhạc như Verdi, Wagner, Puccini nổi tiếng chủ yếu nhờ opera."
    moi: Opera là kịch được hát toàn bộ (hoặc gần như toàn bộ), với dàn nhạc, dàn dựng sân khấu, trang phục và diễn xuất. Opera ra đời ở Ý khoảng năm 1600; nhiều nhà soạn nhạc như Verdi, Wagner, Puccini nổi tiếng chủ yếu nhờ opera.
    ly_do: 'n59 (da-sua): description theo đoạn mở đầu mới.; n2 (da-sua): bỏ "một trong những thể loại quan trọng nhất".'
  - cu: Nhiều nhân vật cùng hát, mỗi người một cảm xúc
