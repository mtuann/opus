  - id: n14
    cau: Nhạc cổ điển phương Tây dùng hệ bình quân 12 nửa cung, cao độ cố định (piano lên dây theo hệ này).
    loai: dinh-nghia
    nguon:
      - cod-temperament
    ket_qua: dung
    ghi_chu: 'COD (Temperament): "in which each semitone is made an equal interval"; piano, organ và các nhạc cụ cao độ cố định lên dây theo hệ này. Số 12 và 100 cent: trang nhac-ly/am-hoc (đã khóa), dòng 98.'
  - id: n15
    cau: "Nhạc truyền thống Việt Nam: thang năm âm làm khung; nhiều âm được nhấn, rung, vuốt, nằm giữa các phím đàn piano."
    loai: dinh-nghia
    nguon:
      - vinhbao
    ket_qua: dung
    ghi_chu: "Nguyễn Vĩnh Bảo: \"the Vietnamese musician adorns his sound with ornamentations which we might call 'bent' notes… bends almost every note\"; \"the idea of absolute pitch is not taken into considerations, a fact that gives a certain impression of false notes to Westerner's ears\"; Xự (D) và Cống (A) là \"changing tones\", có thể nâng lên gần Mi, Si."
  - id: n16
