    ly_do: n36…n45 (bảng di sản UNESCO; xem hồ sơ từng hàng)
  - cu: Hát kèm đàn tính
    moi: Thầy Then hát và gảy đàn tính trong nghi lễ
    ly_do: n36…n45 (bảng di sản UNESCO; xem hồ sơ từng hàng)
  - cu: "Chèo là sân khấu ca kịch dân gian của đồng bằng Bắc Bộ, có từ khoảng thế kỷ 10. Tương truyền người đặt nền móng là bà Phạm Thị Trân, một nghệ nhân múa hát trong cung đình nhà Đinh; đất tổ chèo ở Hoa Lư, Ninh Bình. Chèo lớn lên cùng hội làng: diễn trên sân đình sau mùa gặt, cho chính bà con trong làng xem — vì thế lời ca, tích truyện của chèo luôn gần gũi đời sống người nông dân."
    moi: Chèo là sân khấu ca kịch dân gian của đồng bằng Bắc Bộ, hình thành và phát triển vào khoảng thế kỷ 10. Theo các tư liệu lịch sử và truyền thuyết dân gian, người đặt nền móng là bà Phạm Thị Trân, ở cung đình nhà Đinh; Hoa Lư, Ninh Bình, được xem là đất tổ của chèo. Chèo được diễn ở hội làng, nơi sân đình, cho chính bà con trong làng xem.
    ly_do: n48…n55 (mục Chèo)
  - cu: 'Nhận diện chèo qua ba dấu hiệu. Trống chèo giữ nhịp và dẫn dắt cả buổi diễn — tiếng trống giục giã được coi là "linh hồn" của đêm hát. Hề chèo: nhân vật hề vừa gây cười vừa nói hộ nỗi lòng người dân, nhiều khi chua chát. Và các làn điệu trữ tình với lời ca giàu hình ảnh dân gian. Chèo vừa bi vừa hài: cùng một vở có thể khiến khán giả khóc rồi bật cười ngay sau đó. Các vở kinh điển: Quan Âm Thị Kính, Lưu Bình – Dương Lễ, Trương Viên.'
    moi: "Vài nét của chèo: trống chèo vang lên gọi bà con tới sân đình; hề là một trong các vai chính, cùng đào, kép, lão, mụ. Các vở chèo cổ: Quan Âm Thị Kính, Lưu Bình – Dương Lễ."
    ly_do: n48…n55 (mục Chèo)
  - cu: "Lưu ý: khác với quan họ hay ca trù, chèo chưa được UNESCO ghi danh — từ năm 2021, nghệ thuật chèo mới được lập hồ sơ đề nghị UNESCO công nhận, tức vẫn đang trong quá trình đề cử."
    moi: "Lưu ý: khác với quan họ hay ca trù, chèo chưa được UNESCO ghi danh (tính đến cuối năm 2025); ngày 20/10/2021, Thủ tướng đồng ý để Bộ Văn hóa, Thể thao và Du lịch lập hồ sơ nghệ thuật chèo đệ trình UNESCO."
    ly_do: n48…n55 (mục Chèo)
  - cu: Tuồng — ở miền Nam gọi là hát bội — là sân khấu ca kịch cổ nhất Việt Nam; theo tư liệu phổ biến, tuồng xuất hiện từ thời Trần (thế kỷ 13) trong cung đình rồi lan ra dân gian, đặc biệt ở miền Trung. Đỉnh cao của tuồng gắn với thời vua Tự Đức, với công lớn của Đào Tấn (1845–1907), người để lại hàng chục vở tuồng mẫu mực.
    moi: Tuồng (còn gọi là hát bội) là sân khấu ca kịch cổ truyền của Việt Nam; thời điểm tuồng xuất hiện chưa có sự đồng thuận, nhưng sử sách cho thấy chắc đã có từ thời Trần. Tuồng cung đình đạt cực thịnh thời nhà Nguyễn, và Đào Tấn (1845–1907) được xem là người có công lớn với tuồng, để lại khoảng 40 vở.
    ly_do: n56…n63 (mục Tuồng)
  - cu: "Khác với chèo mộc mạc, tuồng lộng lẫy và ước lệ rất cao. Diễn viên vẽ mặt: mặt đỏ là người trung dũng, chững chạc; mặt trắng là dung mạo đẹp, tính trầm tĩnh; mặt xanh là vai quỷ quái, linh hồn; còn các kiểu mặt rằn, mặt mốc, mặt tròng xéo… chỉ tính nóng nảy, nịnh hót hay phản trắc — chỉ nhìn mặt đã đoán được tính cách nhân vật. Trang phục rực rỡ kiểu vua quan, đạo cụ có kiếm, cờ, quạt, roi ngựa. Lối hát tuồng to, cao, vang, thường mở đầu bằng nói lối (nói một lúc rồi mới hát), kể những chuyện trung hiếu, tiết nghĩa với chất bi tráng đặc trưng."
    moi: "Tuồng mang tính biểu tượng, ước lệ cao: bối cảnh, trang phục, hóa trang và cử chỉ đều theo quy ước. Diễn viên vẽ mặt theo vai: nền đỏ là tướng trung hậu, nền trắng là gian thần, nền xanh là quỷ quái hoặc linh hồn; vai hung tợn có nét vằn vện trên mặt. Hát tuồng gồm ba thành phần: nói lối (lối nói cách điệu, có tiết tấu và giai điệu), nhịp phách và làn điệu; truyện thường mang đạo lý Nho giáo."
    ly_do: n56…n63 (mục Tuồng)
  - cu: 'Một chi tiết độc đáo: trống chầu, được mệnh danh là "vua của sân khấu". Người đánh trống chầu ngồi xem và "chấm điểm" diễn viên ngay trong lúc diễn — tiếng trống là lời khen, tiếng trống dồn dập là lời chê, thưởng phạt rõ ràng ngay trên sân khấu.'
    moi: "Một nét riêng của tuồng là trống chầu: người cầm trống chầu dẫn dắt khán giả và đóng vai giám khảo, đánh vào mặt trống để khen, đánh vào cạnh trống để chê, và dùng tiếng trống để thưởng hay phạt kép hát."
    ly_do: n56…n63 (mục Tuồng)
  - cu: 'Cải lương là sân khấu ca kịch của Nam Bộ, ra đời đầu thế kỷ 20 từ phong trào đờn ca tài tử. "Cải lương" nghĩa là cải cách cho tốt hơn: các gánh hát đưa những bài bản tài tử lên sân khấu, thêm cốt truyện, đối thoại và diễn xuất.'
    moi: 'Cải lương ("cải cách") là sân khấu ca kịch của Nam Bộ, ra đời ở thế kỷ 20 từ nhạc tài tử, kết hợp với kịch Pháp và các yếu tố truyền thống. Theo mô tả của Nguyễn Vĩnh Bảo (1970), ca hát là phần quan trọng nhất: khoảng 70–80% buổi diễn là các bài hát, đệm bằng đàn nguyệt (đàn kìm), đàn tranh, đàn nhị, đàn gáo, đàn tam, đàn bầu.'
    ly_do: n64…n73 (mục Cải lương)
  - cu: 'Trái tim của cải lương là điệu vọng cổ. Năm 1919, tại Bạc Liêu, nhạc sĩ Cao Văn Lầu (Sáu Lầu) công bố bản "Dạ cổ hoài lang" — nghĩa là "nghe tiếng trống đêm nhớ chồng" — viết từ nỗi nhớ vợ của chính ông. Từ bản 20 câu này, các thế hệ nghệ sĩ phát triển thành điệu vọng cổ mà ngày nay thường hát 6 câu, với cách hát luyến láy, ngân dài, nhấn nhá từng chữ trên nền đàn tranh, đàn bầu, guitar phím lõm. Nghe một câu vọng cổ, bạn sẽ nhận ra ngay: giọng hát như đang kể một nỗi niềm, dứt câu nào cũng như còn dang dở.'
    moi: Một điệu hát nổi bật của cải lương là vọng cổ. Bản "Dạ cổ hoài lang" do nhạc sĩ Cao Văn Lầu (Sáu Lầu) ở Bạc Liêu sáng tác, thường được ghi vào khoảng năm 1918–1919; tên bài nghĩa là "nghe tiếng trống đêm nhớ chồng", gắn với nỗi nhớ của người vợ xa chồng và của chính ông. Bản gốc có 20 câu nhịp đôi; về sau được kéo dài thành nhịp 4, nhịp 8 và tới nhịp 32, và bản nhịp 32 được rút lại còn 6 câu.
    ly_do: n64…n73 (mục Cải lương)
  - cu: "Những giọng ca thành huyền thoại: Út Trà Ôn, Minh Vương, Lệ Thủy. Soạn giả Viễn Châu được xem là người khai sinh tân cổ giao duyên — xen một đoạn tân nhạc vào giữa các câu vọng cổ, rất được yêu thích."
    moi: "Nghệ sĩ cải lương có thể nghe: Minh Vương, Lệ Thủy. Soạn giả Viễn Châu được ghi nhận có công khai mở thể loại tân cổ giao duyên, kết hợp tân nhạc với làn điệu vọng cổ."
    ly_do: n64…n73 (mục Cải lương)
  - cu: "Nhà soạn nhạc Việt Nam viết cho dàn nhạc giao hưởng thường lấy chất liệu từ dân ca và các thang năm âm: giao hưởng Quê hương của Hoàng Việt, opera Cô Sao của Đỗ Nhuận, các bản chuyển soạn dân ca như Trống cơm, Lý hoài nam cho dàn dây (xem Nhạc cổ điển ở Việt Nam)."
    moi: "Nhà soạn nhạc Việt Nam viết cho dàn nhạc giao hưởng và opera, có khi lấy chất liệu từ ca khúc và dân ca: giao hưởng Quê hương của Hoàng Việt (khai thác chất liệu từ 9 ca khúc cách mạng và hai bài dân ca), opera Cô Sao (1965) của Đỗ Nhuận, các bản chuyển soạn dân ca như Trống cơm, Lý hoài nam cho dàn dây (xem Nhạc cổ điển ở Việt Nam)."
    ly_do: "n74, n75, n76 (da-sua): theo Nhân Dân, Pháp luật, VnExpress."
  - cu: "Nhạc cụ dân tộc độc tấu cùng dàn nhạc giao hưởng: đàn bầu, đàn tranh, sáo trúc thường xuất hiện trong vai trò độc tấu với dàn nhạc trong các chương trình hòa nhạc trong nước."
    moi: "Nhạc cụ dân tộc cùng dàn nhạc giao hưởng: nhạc cụ dân tộc cũng được viết thành concerto với dàn nhạc phương Tây; Nguyễn Vĩnh Bảo đã ghi nhận hiện tượng này từ năm 1970."
    ly_do: "n77 (da-sua): theo Nguyễn Vĩnh Bảo (1970)."
  - cu: "Bài tập nghe so sánh: nghe liền nhau một bản độc tấu đàn bầu và một chương chậm cho violin (ví dụ Pärt Spiegel im Spiegel). Hãy để ý: violin giữ từng nốt ổn định và đi theo hòa âm của piano; đàn bầu thì uốn lượn cao độ ngay trong một nốt. Đó chính là khác biệt về cách nghĩ về cao độ ở bảng đầu trang."
    moi: "Bài tập nghe so sánh: nghe liền nhau một bản độc tấu đàn bầu và một chương chậm cho violin (ví dụ Pärt Spiegel im Spiegel). Hãy để ý: violin và piano chơi theo những nốt đã ghi sẵn trên bản nhạc; đàn bầu thì uốn lượn cao độ ngay trong một nốt. Đó chính là khác biệt về cách nghĩ về cao độ ở bảng đầu trang."
    ly_do: "n80 (da-sua): bỏ mô tả bản thu cụ thể không kiểm được."
  - cu:
      - Tiết tấu
