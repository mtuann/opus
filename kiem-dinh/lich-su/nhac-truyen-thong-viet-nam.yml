  - id: n20
    cau: "Nhạc truyền thống Việt Nam có các hơi, điệu: điệu Bắc (vui tươi); điệu Nam với các hơi Xuân (thanh thản), Ai và Oán (buồn sâu)."
    loai: dinh-nghia
    nguon:
      - vinhbao
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "điệu Bắc (vui, sáng), điệu Nam với các hơi Xuân, Ai, Oán (buồn, da diết)". Lý do: Nguyễn Vĩnh Bảo: Bắc "used for playing happy melodies"; Nam Xuân "(serenity)"; Nam Ai và Oán "(profound sadness)": Nam Xuân không buồn, nên tách ra.'
  - id: n21
    cau: "Hai truyền thống chú trọng những điều khác nhau: phương Tây phát triển hòa âm và các kỹ thuật phát triển chủ đề trong tác phẩm dài; Việt Nam chú trọng sắc thái từng âm và ứng tác."
    loai: dinh-nghia
    nguon:
      - vinhbao
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không truyền thống nào "tiến bộ" hơn. Nhạc phương Tây phát triển cực mạnh hòa âm và kiến trúc của những tác phẩm dài; nhạc truyền thống Việt Nam tinh tế ở từng âm và nghệ thuật ứng tác." Lý do: bỏ lời đánh giá ("tiến bộ", "cực mạnh", "tinh tế"). Nguyễn Vĩnh Bảo: "The thematic and developmental techniques of the Western composition are no commonly found in Vietnamese music"; "It beauty lies not so much in the succession of notes as in each separate note itself"; có đoạn dạo ứng tấu (mục VII "The Improvised Prelude").'
  - id: n22
    cau: "Nhạc châu Âu cũng từng có lối ứng tác: ca sĩ ứng tác trang trí (thanh nhạc và opera thời đầu); thế kỷ 17–18 bè trầm số (basso continuo) chỉ ghi bộ khung cho người chơi đàn phím; cadenza vốn là đoạn ứng tác."
    loai: lich-su
    nguon:
      - cod-ornaments
      - cod-continuo
      - cod-cadenza
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhạc Baroque cũng từng như vậy. Nghệ sĩ thời Bach và Vivaldi ứng tác trang trí trên giai điệu, và bè trầm số chỉ ghi bộ khung hòa âm… Cadenza trong concerto Mozart vốn cũng được ứng tác." Lý do: COD (Ornaments): "In early vocal mus. and opera, embellishments were improvised by the singers"; COD (Basso continuo): "Figured bass from which in concerted mus. of the 17th and 18th cents. the cembalist or organist played"; COD (Cadenza): "A flourish (properly, improvised)…" và nói không riêng Mozart (COD chỉ nói Beethoven, Brahms để cadenza cho người chơi). Bỏ "Bach và Vivaldi", "Mozart" vì không có nguồn.'
  - id: n23
    cau: Nếu Hò lấy cao độ Đô (C), thang năm âm cơ bản là Hò–Xự–Xang–Xê–Cống ứng với Đô–Rê–Fa–Sol–La (C D F G A); cách đối chiếu phổ biến trong ký âm phương Tây.
