    ghi_chu: 'Chữ cũ: "từ năm 2021, nghệ thuật chèo mới được lập hồ sơ đề nghị UNESCO công nhận, tức vẫn đang trong quá trình đề cử." Lý do: Cục Di sản: "Ngày 20/10/2021, Thủ tướng Chính phủ đồng ý để Bộ VHTTDL lập hồ sơ… Nghệ thuật Chèo đồng bằng sông Hồng… đệ trình UNESCO"; danh sách UNESCO (17 yếu tố) không có chèo. "Vẫn đang đề cử" không kiểm được tới nay: bỏ.'
  - id: n56
    cau: Tuồng (còn gọi là hát bội) là sân khấu ca kịch cổ truyền của Việt Nam; thời điểm xuất hiện chưa có sự đồng thuận, nhưng sử sách cho thấy chắc đã có từ thời Trần.
    loai: lich-su
    nguon:
      - vienamnhac-tuong
      - vinhbao
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tuồng — ở miền Nam gọi là hát bội — là sân khấu ca kịch cổ nhất Việt Nam; theo tư liệu phổ biến, tuồng xuất hiện từ thời Trần (thế kỷ 13) trong cung đình rồi lan ra dân gian, đặc biệt ở miền Trung." Lý do: Viện Âm nhạc: thời điểm du nhập "chưa được minh xác", truyền thuyết nói thời Tiền Lê (1005), sử sách (Trần Quốc Tuấn tha một kép hát) cho thấy "chắc đã có từ thời Trần". Vĩnh Bảo dùng Hát Bội cho sân khấu cổ điển miền Trung, không "ở miền Nam gọi là". Bỏ "cổ nhất", "thế kỷ 13", "trong cung đình rồi lan ra dân gian".'
  - id: n57
    cau: Đào Tấn sống 1845–1907.
    loai: nam
    nguon:
      - sggp-daotan
    ket_qua: dung
    ghi_chu: 'SGGP English: "1845–1907"; Hà Nội kỷ niệm 110 năm ngày mất (2017).'
  - id: n58
    cau: Tuồng cung đình đạt cực thịnh thời nhà Nguyễn; Đào Tấn được xem là người có công lớn với tuồng, để lại khoảng 40 vở.
    loai: lich-su
    nguon:
      - vienamnhac-tuong
      - sggp-daotan
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đỉnh cao của tuồng gắn với thời vua Tự Đức, với công lớn của Đào Tấn (1845–1907), người để lại hàng chục vở tuồng mẫu mực." Lý do: Viện Âm nhạc: tuồng cung đình "cực thịnh" thời nhà Nguyễn, không nhắc Tự Đức; SGGP: "the innovator of Tuong", "wrote 40 tuồng plays". Bỏ "Tự Đức", "mẫu mực".'
  - id: n59
    cau: "Tuồng mang tính biểu tượng, ước lệ cao: bối cảnh, trang phục, hóa trang và cử chỉ đều theo quy ước."
    loai: dinh-nghia
    nguon:
      - vinhbao
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khác với chèo mộc mạc, tuồng lộng lẫy và ước lệ rất cao… Trang phục rực rỡ kiểu vua quan, đạo cụ có kiếm, cờ, quạt, roi ngựa." Lý do: Vĩnh Bảo (chú thích 1): "The Hat Boi is a conventionalized and symbolic art form… symbolic use of scenery, the costumes, makeup, and the gestures". Bỏ so sánh "chèo mộc mạc", "lộng lẫy", và danh sách đạo cụ (không nguồn).'
  - id: n60
    cau: "Diễn viên tuồng vẽ mặt theo vai: nền đỏ là tướng trung hậu, nền trắng là gian thần, nền xanh là quỷ quái hoặc linh hồn; vai hung tợn có nét vằn vện trên mặt."
    loai: dinh-nghia
    nguon:
      - vienamnhac-tuong
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mặt đỏ là người trung dũng, chững chạc; mặt trắng là dung mạo đẹp, tính trầm tĩnh; mặt xanh là vai quỷ quái, linh hồn; còn các kiểu mặt rằn, mặt mốc, mặt tròng xéo… chỉ tính nóng nảy, nịnh hót hay phản trắc — chỉ nhìn mặt đã đoán được tính cách nhân vật". Lý do SỬA SAI: Viện Âm nhạc: "tướng trung hậu có nền mặt đỏ, gian thần có nền mặt trắng, nền xanh dành cho quỷ quái hoặc linh hồn; các vai hung tợn có nét vằn vện". Trang cũ nói mặt trắng là "dung mạo đẹp, tính trầm tĩnh", trái nguồn; bỏ mặt mốc, mặt tròng xéo (không nguồn).'
  - id: n61
    cau: "Hát tuồng gồm ba thành phần: nói lối (lối nói cách điệu, có tiết tấu và giai điệu), nhịp phách và làn điệu; truyện thường mang đạo lý Nho giáo."
    loai: dinh-nghia
    nguon:
      - vienamnhac-tuong
      - vinhbao
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lối hát tuồng to, cao, vang, thường mở đầu bằng nói lối (nói một lúc rồi mới hát), kể những chuyện trung hiếu, tiết nghĩa với chất bi tráng đặc trưng." Lý do: Viện Âm nhạc: nói lối là hình thức nói cách điệu có tiết tấu và giai điệu, một trong ba thành phần cùng nhịp phách và làn điệu; Vĩnh Bảo: "stories remain mostly Chinese or translations of Chinese historical tales which have a Confucian moral". Bỏ "to, cao, vang", "mở đầu bằng", "bi tráng" (không nguồn).'
  - id: n62
    cau: "Trống chầu của tuồng: người cầm trống dẫn dắt khán giả và đóng vai giám khảo, đánh vào mặt trống để khen, đánh vào cạnh trống để chê, và dùng tiếng trống để thưởng hay phạt kép hát."
    loai: dinh-nghia
    nguon:
      - vienamnhac-tuong
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trống chầu, được mệnh danh là "vua của sân khấu". Người đánh trống chầu ngồi xem và "chấm điểm" diễn viên ngay trong lúc diễn — tiếng trống là lời khen, tiếng trống dồn dập là lời chê, thưởng phạt rõ ràng ngay trên sân khấu." Lý do SỬA SAI: Viện Âm nhạc: người cầm trống chầu "dẫn dắt khán giả và đóng vai giám khảo"; đánh vào mặt trống để khen, vào cạnh trống để chê (không phải "dồn dập"); thưởng hay phạt kép hát. "Vua của sân khấu" không nguồn: bỏ.'
