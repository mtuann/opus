    ly_do: "n9: nguồn thêm cho các chỗ đã sửa."
  - cu: "mô tả: Người Việt học nhạc cổ điển phương Tây có một lợi thế ít ai nói đến: chúng ta lớn lên cùng một truyền thống âm nhạc khác, với những thang âm, nhạc cụ và cách…"
    moi: "mô tả: Nhạc truyền thống Việt Nam có những thang âm, nhạc cụ và cách nghe riêng, khác nhạc cổ điển phương Tây. Trang này đặt hai truyền thống cạnh nhau…"
    ly_do: 'Mô tả trang lấy từ câu mở đầu mới (n81, da-sua). Review D8-gom: mô tả đổi theo n81.'
ghi_chu: 'Trang Đọc thêm (ngoại vi), có 1 khối abc (thang Hò–Xự–Xang–Xê–Cống). Nguồn chính: UNESCO ICH (danh sách Việt Nam 17 yếu tố; trang từng di sản: nhã nhạc, cồng chiêng, quan họ, ca trù, hát Xoan, đờn ca tài tử, Ví Giặm, thờ Mẫu, Bài chòi, Then); Nguyễn Vĩnh Bảo, Introduction to Vietnamese Music (1970, PDF; bậc 2, tác giả chuyên môn nhưng là bài tổng quan cũ, một số nhận xét theo cách nhìn thập niên 1960); báo chính thống Việt Nam (Báo Lào Cai, Nhân Dân, Báo Văn hóa, Znews, RFA, VnExpress, SGGP) cho chèo, tuồng, cải lương, nhà soạn nhạc; Viện Âm nhạc (tuồng); Cục Di sản (hồ sơ chèo); COD (Encyclopedia.com) cho dị âm, cadenza, continuo, hệ bình quân, trang trí; UiTM (Debussy). Không mở được: Britannica, Met Opera, Lyric Opera, CUNY (luận văn Phong Nguyen: 403, đã không dùng cách vòng chặn), Wikipedia chỉ dùng tìm manh mối. Chỗ sửa trang (da-sua), nhiều chỗ sửa SAI so với nguồn: mặt trắng trong tuồng là gian thần chứ không phải "dung mạo đẹp, trầm tĩnh" (n60); trống chầu khen bằng mặt trống, chê bằng cạnh trống, không phải "dồn dập" (n62); năm Dạ cổ hoài lang 1918–1919 chứ không riêng 1919 (n66); nhã nhạc và cồng chiêng 2003 và 2005 là năm công bố, ghi danh 2008 (n36, n37). Chỗ bỏ (da-bo): hàng "Tiết tấu" của bảng đầu (n18), "chèo vừa bi vừa hài" (n52), mô tả vọng cổ và guitar phím lõm (n69), Út Trà Ôn (n70), "vua của sân khấu", Tự Đức, "cổ nhất", Trương Viên, "linh hồn" của trống chèo. Chỗ chưa chắc: n25 (Liu = Đô cao, ket_qua null; cần nguồn hay bỏ Liu khỏi khối abc), n79 (Puccini: chỉ có nguồn bậc 3 và báo chí), n71 (Minh Vương, Lệ Thủy), n54 (danh hiệu NSND chưa mở được trang), n43 (hát văn bỏ vì không nguồn). Câu ve-site: n1, n2, n3, n4, n5, n6, n7, n8, n9: trang nghe-nhac/doc-ten-tac-pham và nghe-nhac/part-spiegel CHƯA chuyển (hiện "sắp có"; lô chuyển phải giữ mục phong cách biểu diễn lịch sử ở trang trước, và đúng tác phẩm Spiegel im Spiegel ở trang sau); lich-su/viet-nam chưa khóa (hiện "sắp có" ở bản thật; giữ mục Hoàng Việt và Đỗ Nhuận); nhac-ly/16 và nhac-ly/am-hoc đã khóa. Hồ sơ nhac-ly/16-dieu-thuc-ngu-cung (đã khóa) có câu về Debussy 1889 và đối chiếu Hò–Xự–Xang–Xê–Cống: khớp. doi_chu: viết tay theo từng ô bảng và đoạn; người giao chạy node tools/chuyen/so-chu.mjs lich-su/nhac-truyen-thong-viet-nam --doi-chu sau khi build để thay các khối chưa khớp (chữ cũ có "xem Âm học: bồi âm" ở ô đàn bầu và cột "Gần giống ở phương Tây" đổi tên thành "Loại nhạc cụ (để so sánh)": n27..n33). Thuật ngữ trang dùng chưa có bản ghi ở src/data/thuat-ngu.yml (cho D3-L5; không tạo): bồi âm (harmonic/overtone), basso continuo (bè trầm số), ngũ cung (pentatonic), hệ bình quân (equal temperament), ứng tác (improvisation), dị âm (heterophony: đã có bản ghi id heterophony), cadenza (đã có bản ghi id cadenza), monochord, zither, lute. Thuật ngữ Việt (hơi, điệu, bài bản, ca nương, đàn đáy, trống chầu…) thuộc nhạc truyền thống, ngoài phạm vi từ điển Tây phương.'
