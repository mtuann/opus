    ket_qua: da-sua
    ghi_chu: 'Câu mới thay vế "đờn tranh, đàn bầu, guitar phím lõm" ở chữ cũ. Vĩnh Bảo (chú thích 2): "Singing is the most important feature, as 70 % to 80 % of a performance may be devoted to songs, accompanied by instruments such as the dan Kim or dan Nguyet…, dan Tranh…, dan Co or dan Nhi and dan Gao…, dan Tam…, dan Doc huyen or dan Bau". Không nhắc guitar phím lõm: bỏ.'
  - id: n66
    cau: Nhạc sĩ Cao Văn Lầu (Sáu Lầu) ở Bạc Liêu sáng tác bản "Dạ cổ hoài lang", thường được ghi vào khoảng năm 1918–1919.
    loai: nam
    nguon:
      - vanchuong
      - vietnamnews-camau
      - rfa-vongco
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Năm 1919, tại Bạc Liêu, nhạc sĩ Cao Văn Lầu (Sáu Lầu) công bố bản "Dạ cổ hoài lang"". Lý do: nguồn mâu thuẫn: Văn chương Phương Nam: "thời điểm khai sinh ra bản Dạ cổ hoài lang là năm 1919" (cùng bài kể đặt tên Tết Trung Thu 1918); Viet Nam News: 1919; RFA: "sáng tác năm 1918". Viết chung "khoảng 1918–1919" như chuẩn mục 2. "Công bố … tại Bạc Liêu" không nguồn nào nói: đổi "sáng tác" và "ở Bạc Liêu" (RFA: "Sáu Lầu (Cao Văn Lầu, Bạc Liêu)").'
  - id: n67
    cau: '"Dạ cổ hoài lang" nghĩa là "nghe tiếng trống đêm nhớ chồng", gắn với nỗi nhớ của người vợ xa chồng và của chính Cao Văn Lầu; vọng cổ là điệu hát nổi bật của cải lương.'
    loai: lich-su
    nguon:
      - vanchuong
      - vietnamnews-camau
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trái tim của cải lương là điệu vọng cổ… viết từ nỗi nhớ vợ của chính ông." Lý do: Văn chương Phương Nam: tên bài "nghe tiếng trống đêm, nhớ chồng"; bài "thể hiện nỗi nhớ của người vợ xa chồng và của Cao Văn Lầu" (không phải riêng "nhớ vợ"); Viet Nam News: "was known as the first vọng cổ song", Cao Văn Lầu là "guru of cải lương". "Trái tim" là lời văn: đổi "điệu hát nổi bật".'
  - id: n68
    cau: Bản gốc có 20 câu nhịp đôi; về sau được kéo dài thành nhịp 4, nhịp 8 và tới nhịp 32, và bản nhịp 32 được rút lại còn 6 câu.
