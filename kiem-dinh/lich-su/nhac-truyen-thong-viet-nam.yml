    ghi_chu: 'Chữ cũ: "đàn bầu, đàn tranh, sáo trúc thường xuất hiện trong vai trò độc tấu với dàn nhạc trong các chương trình hòa nhạc trong nước." Lý do: Vĩnh Bảo: "there have been traditional instruments concerto with Western orchestra" (1970). Bỏ danh sách ba nhạc cụ, "thường", "chương trình trong nước" (không nguồn).'
  - id: n78
    cau: Debussy nghe dàn gamelan Java ở Paris năm 1889 và viết Pagodes bằng gam ngũ cung.
    loai: lich-su
    nguon:
      - uitm-pagodes
    ket_qua: dung
    ghi_chu: 'UiTM: "at the 1889 Paris Exposition Universelle, Debussy first encountered the music of a Javanese gamelan ensemble"; "Pagodes", bản piano 1903, mở đầu bộ Estampes; "built almost entirely on a five-note scale corresponding to the black keys of the piano". Ghi chú: bài 16 (đã khóa) cũng nói câu tương tự.'
  - id: n79
    cau: Puccini dùng giai điệu dân ca Trung Quốc Mạt lỵ hoa (Mo Li Hua) trong opera Turandot.
    loai: lich-su
    nguon:
      - ilsole-turandot
      - wiki-turandot
      - met-turandot
      - lyric-turandot
    ket_qua: dung
    ghi_chu: 'Il Sole 24 Ore: chủ đề nổi tiếng nhất của opera "based on the Chinese traditional melody Mò Li Hūa (茉莉花)", hộp nhạc có nhiều giai điệu Trung Quốc, Puccini dùng ba; Wikipedia (Turandot): hộp nhạc bốn giai điệu, Puccini dùng ba, nổi tiếng nhất "Mòlìhuā… Jasmine Flower", "serves as a leitmotif for Princess Turandot". Cả hai chỉ bậc 3 và báo chí; không mở được Met Opera và Lyric Opera (403, hàng chờ). Nên lượt 2 tìm nguồn bậc 1–2 (Grove, Met Opera). Tên tiếng Việt "Mạt lỵ hoa" là phiên âm Hán-Việt của 茉莉花. Review D8-gom: nguồn cũ bậc 3; thêm bậc 2: Met Opera (Wayback): "Puccini discovered the folk song ''Mo Li Hua,'' or ''Jasmine Flower'' … ''Mo Li Hua'' became the main theme used to represent Princess Turandot"; Lyric Opera of Chicago: "the main Turandot theme. This is based on a Chinese folk song ''Jasmine Flower'' or ''Mo-Li-Hua''". Giữ chữ.'
  - id: n80
    cau: "Bài tập nghe so sánh: violin và piano chơi theo những nốt đã ghi sẵn trên bản nhạc; đàn bầu uốn lượn cao độ ngay trong một nốt."
    loai: dinh-nghia
    nguon:
      - ircam-part
      - vinhbao
      - baophapluat-danbau
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "violin giữ từng nốt ổn định và đi theo hòa âm của piano; đàn bầu thì uốn lượn cao độ ngay trong một nốt". Lý do: IRCAM: Spiegel im Spiegel (1978) cho violin và piano; "giữ từng nốt ổn định và đi theo hòa âm" mô tả bản thu cụ thể, không mở được nguồn: đổi thành điều chắc (nhạc ghi sẵn, Vĩnh Bảo "accurate notation"). Vế đàn bầu: Vĩnh Bảo ("bends almost every note"), Báo Pháp luật (nhấn, rung, luyến láy).'
  - id: n81
    cau: Nhạc truyền thống Việt Nam có những thang âm, nhạc cụ và cách nghe riêng, khác nhạc cổ điển phương Tây.
    loai: dinh-nghia
    nguon:
      - vinhbao
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (cả mô tả trang): "có một lợi thế ít ai nói đến: chúng ta lớn lên cùng một truyền thống âm nhạc khác". Lý do: "lợi thế ít ai nói đến" là lời văn, không kiểm được; "lớn lên cùng" tuyệt đối đổi "thường đã quen với". Phần còn lại (nội dung hai truyền thống) đã có nguồn ở các nhận định khác. Review D8-gom: câu "Người Việt học nhạc cổ điển phương Tây thường đã quen với một truyền thống âm nhạc khác" nói về người học, không có nguồn (khoa.mjs: thiếu nguon). Viết lại theo điều Nguyễn Vĩnh Bảo (1970) nói: thang năm âm Hò–Xự–Xang–Xê–Cống, nhạc cụ riêng, "Vietnamese music is built on melodic construction and single note colorations". Mô tả trang đổi theo. Ghi doi_chu. Đưa vào lượt 2 bổ sung.'
  - id: n82
    cau: "Gợi ý nghe: tìm các từ khóa (Nhã nhạc cung đình Huế, đờn ca tài tử, ca trù, quan họ, độc tấu đàn bầu, hát văn, trích đoạn chèo, hát bội, Dạ cổ hoài lang); ưu tiên bản thu của nghệ nhân, viện nghiên cứu hoặc nhà hát, có ghi rõ tên người biểu diễn."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên cách tìm bản thu, không dính sức khỏe; từ khóa tìm kiếm không phải nhận định. Không trái trang lõi nào (nghe-nhac/doc-ten-tac-pham chưa chuyển; cách chọn bản thu giống mục "Chọn bản thu" ở site cũ). Review D8-gom: lời khuyên tìm bản thu, không cần nguồn: ket_qua dung đổi thành khong-can-nguon (khoa.mjs đòi nguồn cho dung).'
  - id: n83
    cau: "Gợi ý xem/nghe cho chèo, tuồng, vọng cổ: các từ khóa tìm YouTube; ưu tiên bản diễn của Nhà hát Chèo Việt Nam, bản thu của nghệ sĩ gạo cội."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Từ khóa tìm kiếm ("chèo Quan Âm Thị Kính", "hát bội", "tuồng Đào Tấn", "trống chầu", "vọng cổ 6 câu", "tân cổ giao duyên"): gợi ý tìm, không phải nhận định; không xếp ve-site vì không nói về site. Nhà hát Chèo Việt Nam là đơn vị có thật (Znews). Review D8-gom: như n82.'
