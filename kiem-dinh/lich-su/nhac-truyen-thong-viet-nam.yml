  - id: n17
    cau: Nhạc truyền thống Việt Nam xây trên giai điệu và sắc thái từng âm, không lấy chuỗi hợp âm làm trung tâm; các nhạc cụ cùng chơi một giai điệu theo cách riêng (dị âm, heterophony).
    loai: dinh-nghia
    nguon:
      - vinhbao
      - cod-heterophony
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ít hợp âm; các nhạc cụ cùng chơi một giai điệu theo cách riêng của mình (dị âm, heterophony)". Lý do: "ít hợp âm" thay bằng điều nguồn nói. Nguyễn Vĩnh Bảo: "Vietnamese music is built on melodic construction and single note colorations"; COD (Heterophony): "simultaneous variation of one melody… singing traditions of the Near and Far East, where an instrument ornaments the vocal line".'
  - id: n18
    cau: "Tiết tấu: phương Tây nhịp đều, ô nhịp, phách mạnh – nhẹ; Việt Nam có bài theo nhịp phách rõ, có bài co giãn tự do, cuối câu thường dừng ở nhịp phách chính."
    loai: dinh-nghia
