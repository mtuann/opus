  - id: n64
    cau: Cải lương ("cải cách") là sân khấu ca kịch của Nam Bộ, ra đời ở thế kỷ 20 từ nhạc tài tử, kết hợp với kịch Pháp và các yếu tố truyền thống.
    loai: lich-su
    nguon:
      - vinhbao
      - vietnamnews-camau
      - britannica-cailuong
      - sggp-cailuong
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ra đời đầu thế kỷ 20 từ phong trào đờn ca tài tử. "Cải lương" nghĩa là cải cách cho tốt hơn: các gánh hát đưa những bài bản tài tử lên sân khấu, thêm cốt truyện, đối thoại và diễn xuất." Lý do: Vĩnh Bảo: "The Renovated Theater of the South (Hat Cai Luong)… born in the twentieth century as a mixture of Chamber music, French theater, and traditional element"; "The Nhac Tai Tu music was not enough; so many new pieces were written"; Viet Nam News: tài tử và cải lương "originated over 100 years ago". Bỏ "đầu thế kỷ" và vế "cho tốt hơn", "các gánh hát đưa bài bản lên sân khấu" (không nguồn). Review D8-gom: giữ chữ. Vĩnh Bảo: "born in the twentieth century as a mixture of Chamber music, French theater, and traditional element"; Britannica (Wayback): "evolved during the French colonial period … clearly showed the influence of European drama"; SGGP: "ra đời ở Nam bộ vào đầu thế kỷ XX". Câu "ở thế kỷ 20" nhẹ hơn các nguồn, đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://vi.wikipedia.org/wiki/Cải_lương" ]
    luot_2_ghi_chu: Cải lương có nguồn gốc Nam Bộ, hình thành từ đờn ca tài tử (đầu thế kỷ 20); bố cục học theo kịch nói. Không đọc thấy 'kịch Pháp' cụ thể.
  - id: n65
    cau: "Ở cải lương, ca hát là phần quan trọng nhất: khoảng 70–80% buổi diễn là các bài hát, đệm bằng đàn nguyệt (đàn kìm), đàn tranh, đàn nhị, đàn gáo, đàn tam, đàn bầu (theo mô tả năm 1970)."
    loai: so-lieu
    nguon:
