  - id: n24
    cau: Cao độ thật của các bậc tùy từng hơi và người chơi; nhiều âm được nhấn, rung, không đứng yên như trên phím đàn.
    loai: dinh-nghia
    nguon:
      - vinhbao
    ket_qua: dung
    ghi_chu: 'Nguyễn Vĩnh Bảo: "There is no fixed basic pitch to which the instruments are tuned. The pitch of the HÒ… can take any pitch"; "The XU (U) can be raised to the pitch of the Mi (E) and the CONG to that of the Si (B)" (điệu buồn); "Xự và Cống là changing tones".'
  - id: n25
    cau: Liu (cuối hàng chữ Hò Xự Xang Xê Cống Liu) ứng với Đô cao (c), quãng tám của Hò.
    loai: dinh-nghia
    nguon:
      - vnam-cohuyhung
    ket_qua: dung
    ghi_chu: 'chưa chắc: không mở được nguồn nói rõ "Liu = Đô cao". Nguyễn Vĩnh Bảo không liệt kê Liu trong thang năm âm. Bài vi.wikipedia "Nhạc tài tử" (chỉ để tìm nguồn) nói ở hơi Bắc "mổ các chữ hò, xàng, xê, líu" (Liu là một bậc vững), và luận văn Phong Nguyen (CUNY) theo bản tóm tắt tìm kiếm xếp liu là bậc 8, nhưng luận văn đó trả 403 khi mở. Cần người giao hay lượt 2 tìm nguồn (sách Phong Nguyen, Trần Văn Khê), hoặc bỏ "Liu" và "Đô" thứ hai khỏi khối abc (đổi trọn mã abc: ghi doi_chu). Review D8-gom: Cồ Huy Hùng (luận án tiến sĩ 2016, Học viện Âm nhạc Quốc gia Việt Nam, bậc 2), tr. 88: "Hò Xự Xừ Xang Xê Cống Phan Líu … bậc Hò ở đây luôn được bắt đầu bằng âm sol"; tr. 89: "Các âm xang (đô), Líu (sol)": Líu cao hơn Hò một quãng tám. Nên khi Hò là Đô thì Líu là Đô cao: giữ khối abc nguyên như lượt 1, không đổi chữ. Luận án viết "Líu" (có dấu); trang viết "Liu" như trang cũ: chủ repo quyết có thêm dấu không (đổi trọn mã abc, ghi doi_chu).'
