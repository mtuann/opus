doi_chu:
  - cu: "Người Việt học nhạc cổ điển phương Tây có một lợi thế ít ai nói đến: chúng ta lớn lên cùng một truyền thống âm nhạc khác, với những thang âm, nhạc cụ và cách nghe riêng. Trang này đặt hai truyền thống cạnh nhau để mỗi bên soi sáng bên kia. Nên đọc sau bài 16: Điệu thức và gam ngũ cung."
    moi: "Nhạc truyền thống Việt Nam có những thang âm, nhạc cụ và cách nghe riêng, khác nhạc cổ điển phương Tây. Trang này đặt hai truyền thống cạnh nhau để mỗi bên soi sáng bên kia. Nên đọc sau bài 16: Điệu thức và gam ngũ cung."
    ly_do: 'Lời văn "lợi thế ít ai nói đến" và "chúng ta lớn lên cùng" không kiểm được (n81, da-sua). Review D8-gom: n81 viết lại theo Nguyễn Vĩnh Bảo (câu về người học không có nguồn).'
