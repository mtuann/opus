  - cu: Không truyền thống nào "tiến bộ" hơn. Nhạc phương Tây phát triển cực mạnh hòa âm và kiến trúc của những tác phẩm dài; nhạc truyền thống Việt Nam tinh tế ở từng âm và nghệ thuật ứng tác.
    moi: Hai truyền thống chú trọng những điều khác nhau. Nhạc phương Tây phát triển hòa âm và các kỹ thuật phát triển chủ đề trong tác phẩm dài; nhạc truyền thống Việt Nam chú trọng sắc thái của từng âm và nghệ thuật ứng tác.
    ly_do: n12…n21 (bảng "Hai cách nghĩ"; xem hồ sơ từng ô)
  - cu: "Điều thú vị: nhạc Baroque cũng từng như vậy. Nghệ sĩ thời Bach và Vivaldi ứng tác trang trí trên giai điệu, và bè trầm số chỉ ghi bộ khung hòa âm (xem Đọc tên tác phẩm và bản thu về phong cách biểu diễn lịch sử). Cadenza trong concerto Mozart vốn cũng được ứng tác."
    moi: "Điều thú vị: nhạc châu Âu cũng từng có lối này. Trong thanh nhạc và opera thời đầu, ca sĩ ứng tác trang trí trên giai điệu; ở thế kỷ 17–18, bè trầm số (basso continuo) chỉ ghi bộ khung để người chơi đàn phím dựa vào (xem Đọc tên tác phẩm và bản thu về phong cách biểu diễn lịch sử). Cadenza vốn cũng là đoạn ứng tác của người độc tấu."
    ly_do: 'n22 (da-sua): theo COD, bỏ "Bach và Vivaldi", "Mozart" vì không có nguồn.'
  - cu: "Các tên trong ký âm nhạc tài tử, theo cách đối chiếu phổ biến với Đô di động (cao độ thật tùy từng hơi và người chơi; nhiều âm được nhấn, rung, không đứng yên như trên phím đàn):"
    moi: "Các tên trong ký âm nhạc truyền thống Việt Nam (như nhạc tài tử), theo cách đối chiếu phổ biến với Đô di động (cao độ thật tùy từng hơi và người chơi; nhiều âm được nhấn, rung, không đứng yên như trên phím đàn):"
