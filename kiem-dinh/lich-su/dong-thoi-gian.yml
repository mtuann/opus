    ghi_chu: 'Dữ liệu khóa: Stravinsky 1882–1971; Tchaikovsky mất 1893 (Stravinsky sinh khi Tchaikovsky đang sáng tác); Reich, Glass viết nhạc tối giản từ thập niên 1960 (Gale). "Nhạc tối giản" chưa có trong thuat-ngu.yml.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Igor-Stravinsky", "https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/peter-ilyich-tchaikovsky", "https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/steve-reich" ]
    luot_2_ghi_chu: Stravinsky sinh 1882, mất 1971; Tchaikovsky mất 1893 (Sym. 6 công diễn 10/1893); Reich là một người khai sinh tối giản (thập niên 1960).
  - id: t7
    cau: "~1025: Guido d'Arezzo mô tả khuông nhạc kẻ dòng và cách hát bằng các âm tiết \"Ut, Re, Mi…\", tiền thân của Đô Rê Mi."
    loai: nam
    nguon:
      - ec-guido
      - grove
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mô tả hệ thống khuông nhạc và tên nốt \"Ut, Re, Mi…\"". Lý do: nguồn (Encyclopedia.com, Guido of Arezzo) nói ông mô tả khuông kẻ dòng (đường kẻ và khóa nhạc) và dùng âm tiết ut–re–mi từ bài thánh ca Ut queant laxis để dạy hát; "tên nốt" là cách nói sau này. Năm ~1025 là Micrologus (khoảng 1025–26), nên giữ dấu ~.'
    luot_2: dung
    luot_2_nguon: [ "https://www.metmuseum.org/perspectives/musical-bodies-guidonian-hand" ]
    luot_2_ghi_chu: 'Met: Guido phát triển khuông bốn dòng khoảng 1020, Micrologus khoảng 1026; ut-re-mi-fa-sol-la lấy từ bài thánh ca. "~1025" nằm trong sai số.'
  - id: t8
    cau: "1607: Monteverdi L'Orfeo, một trong những vở opera đầu tiên còn được diễn."
