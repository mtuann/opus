nhan_dinh:
  - id: t1
    cau: Mỗi thanh ngang là cuộc đời một nhà soạn nhạc; thanh màu khác là người còn sống. Các dải nền là các thời kỳ.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trong src/scripts/dong-thoi-gian.js (hàng nào cũng một thanh từ sinh tới mất; người mat === null dùng lớp oz-dtg-con-song, tô màu --oz-h-vang thay --oz-h-xanh ở src/styles/thanh-phan.css; dải nền oz-dtg-dai theo thời kỳ). Review: đã kiểm src/scripts/dong-thoi-gian.js (mỗi người một hàng, lớp oz-dtg-con-song khi mat null), src/styles/thanh-phan.css (.oz-dtg-con-song .oz-dtg-thanh tô --oz-h-vang) và dist/lich-su/dong-thoi-gian/index.html (5 hàng còn sống, 7 dải oz-dtg-dai)."
    review: dung
  - id: t2
    cau: Di chuột vào thanh để xem năm sinh, năm mất (các năm này cũng có trong bảng ở cuối trang). Trên điện thoại, vuốt ngang để xem hết.
    loai: ve-site
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Di chuột (hoặc chạm) vào thanh để xem năm sinh, năm mất." (cả mô tả của trang). Lý do: năm sinh–mất nằm trong phần tử <title> của SVG (src/scripts/dong-thoi-gian.js dòng 111), chỉ hiện khi di chuột; trang không có mã xử lý chạm (không có addEventListener), và tôi không thử được trên điện thoại; nhiều trình duyệt di động không hiện <title> SVG khi chạm. Bỏ "(hoặc chạm)" và chỉ sang bảng cuối trang, nơi năm luôn thấy được. "Vuốt ngang": .oz-dtg-khung { overflow-x: auto } với .oz-dtg-svg { min-width: 56rem }: đúng. Review: đã kiểm src/scripts/dong-thoi-gian.js (<title> mỗi hàng ghi sinh–mất), src/styles/thanh-phan.css (.oz-dtg-khung overflow-x: auto) và bảng cuối trang trong dist có cột Sinh, Mất.'
    review: dung
