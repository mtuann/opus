ghi_chu: 'Khuông nhạc: trang không có khối abc. Chưa có hồ sơ thuật ngữ cho "nhạc tối giản". Câu "Di chuột (hoặc chạm)" đã bỏ "(hoặc chạm)" vì trang chỉ có <title> SVG (hover), không có xử lý chạm (t2). Cristofori ~1700: Met và Britannica lệch (1700 so với 1709), giữ ~1700 (t9). Nhà hát Lớn 1911 chỉ có nguồn bậc 3, để null (t21). Các mốc 1956, 1982, 2023 chỉ có nguồn bậc 2 một phần hoặc bậc 3 (t24, t26, t27). Link tai-lieu-tham-khao trỏ trang chưa chuyển (t30). Review D5-gom (nhóm A): Nhà hát Lớn 1911 giữ theo Báo Điện tử Chính phủ (báo chính thức, t21); Cristofori ~1700 giữ theo Met (t9, lượt 2 đúng).'
