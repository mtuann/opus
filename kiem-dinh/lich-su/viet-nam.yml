nhan_dinh:
  - id: n1
    cau: Nhạc cổ điển phương Tây đến Việt Nam từ thời Pháp thuộc, rồi được đào tạo bài bản từ giữa thế kỷ 20.
    loai: lich-su
    nguon:
      - wiki-vnam
      - wiki-hcmc
    ket_qua: dung
    ghi_chu: 'Hai nhạc viện lớn lập năm 1956 (Học viện Âm nhạc Quốc gia: Vietnam School of Music, 1956; Nhạc viện TP.HCM: 12/4/1956); Nhà hát Lớn Sài Gòn khánh thành 1900 (thời Pháp thuộc). "Từ thời Pháp thuộc" là câu khái quát; không có nguồn riêng nói thời điểm nhạc cổ điển phương Tây tới Việt Nam.'
    luot_2: dung
    luot_2_nguon: [ "https://vi.wikipedia.org/wiki/Nh%C3%A0_h%C3%A1t_Th%C3%A0nh_ph%E1%BB%91_H%E1%BB%93_Ch%C3%AD_Minh", "https://vi.wikipedia.org/wiki/H%E1%BB%8Dc_vi%E1%BB%87n_%C3%82m_nh%E1%BA%A1c_Qu%E1%BB%91c_gia_Vi%E1%BB%87t_Nam", "https://vi.wikipedia.org/wiki/Nh%E1%BA%A1c_vi%E1%BB%87n_Th%C3%A0nh_ph%E1%BB%91_H%E1%BB%93_Ch%C3%AD_Minh" ]
    luot_2_ghi_chu: Nhà hát Lớn Sài Gòn khánh thành 1/1/1900 thời Pháp thuộc; hai trường nhạc lớn thành lập 1956 (Trường Âm nhạc Việt Nam ở Hà Nội, Trường Quốc gia Âm nhạc Sài Gòn). Khớp tổng quát.
  - id: n2
    cau: Ngày nay, Hà Nội và TP.HCM có các nhạc viện, dàn nhạc giao hưởng và nhà hát đủ sức đón những vở opera và nghệ sĩ quốc tế.
    loai: lich-su
    nguon:
      - vnnet-hoguom
      - vntourism-hcm
      - dbnd-nhaccodien
    ket_qua: dung
    ghi_chu: 'Hồ Gươm (hợp tác với Opéra Royal de Versailles khi khai trương), Nhà hát TP.HCM (HBSO ballet, giao hưởng, opera), các dàn nhạc VNSO, SSO, HBSO. "Đủ sức đón" là cách nói chung: giữ vì khớp các sự kiện đã có.'
    luot_2: dung
    luot_2_nguon: [ "https://baodautu.vn/ha-noi-khanh-thanh-nha-hat-ho-guom-ung-dung-cong-nghe-tan-tien-hang-dau-the-gioi-d193629.html", "https://vi.wikipedia.org/wiki/Nh%C3%A0_h%C3%A1t_Th%C3%A0nh_ph%E1%BB%91_H%E1%BB%93_Ch%C3%AD_Minh" ]
    luot_2_ghi_chu: Hà Nội có Nhà hát Hồ Gươm (900 chỗ cho opera, ballet, giao hưởng, từ 2023) và TP.HCM có Nhà hát Thành phố; các nhạc viện, dàn nhạc có ở các câu sau. 'Đủ sức đón' là nhận định.
  - id: n3
    cau: Thông tin về các đơn vị và lịch diễn thay đổi thường xuyên; hãy kiểm tra trang chính thức trước khi đi.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: Khuyên kiểm tra trang chính thức. Ngày kiểm và ngày rà lại hiện tự động ở đầu trang (doi_chu đã có của người giao).
  - id: n4
    cau: 'Học viện Âm nhạc Quốc gia Việt Nam (Hà Nội): thành lập 1956, tiền thân là Trường Âm nhạc Việt Nam; sau đổi tên thành Nhạc viện Hà Nội, và mang tên hiện nay từ năm 2008; học viện âm nhạc quốc gia ở Hà Nội.'
    loai: ten
    nguon:
      - wiki-vnam
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ ghi chú: "Cơ sở đào tạo âm nhạc hàng đầu cả nước" (xếp hạng không kiểm được); sửa thành "học viện âm nhạc quốc gia, ở Hà Nội". Wikipedia (bậc 3): lập 1956 là Vietnam School of Music, được đổi tên 2008; quy chế HVANQG 2023 (kết quả tìm kiếm, chưa mở) ghi chuỗi đổi tên qua Nhạc viện Hà Nội. Có nguồn bậc 3; nguồn bậc 2 là quy chế tổ chức của học viện (vnam.edu.vn, PDF) chưa mở được: chưa chắc năm đổi tên Nhạc viện Hà Nội (1981 hay 1982 theo các nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://vnam.edu.vn", "https://vi.wikipedia.org/wiki/H%E1%BB%8Dc_vi%E1%BB%87n_%C3%82m_nh%E1%BA%A1c_Qu%E1%BB%91c_gia_Vi%E1%BB%87t_Nam" ]
    luot_2_ghi_chu: "Trang chính thức của Học viện: bắt đầu là Trường Âm nhạc Việt Nam 1956, thành Nhạc viện Hà Nội, đổi tên Học viện Âm nhạc Quốc gia Việt Nam năm 2008. Wikipedia tiếng Việt: Nhạc viện Hà Nội từ 1982. Khớp."
  - id: n5
    cau: 'Nhạc viện TP.HCM: thành lập 12/4/1956, khi ấy là Trường Quốc gia Âm nhạc ở Sài Gòn; 112 Nguyễn Du, TP.HCM; đào tạo cả nhạc phương Tây và nhạc truyền thống.'
    loai: ten
    nguon:
      - wiki-hcmc
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tiền thân là trường Quốc gia Âm nhạc Sài Gòn". Wikipedia: tên cũ Trường Quốc gia Âm nhạc, ngày 12/4/1956, địa chỉ 112 Nguyễn Du, đào tạo nhạc châu Âu và nhạc truyền thống; tiền thân trực tiếp là phân khoa nhạc của Trường Mỹ thuật Gia Định. Tên "Trường Quốc gia Âm nhạc Sài Gòn" (có chữ Sài Gòn) cũng có trong các nguồn báo.'
    luot_2: dung
    luot_2_nguon: [ "https://vi.wikipedia.org/wiki/Nh%E1%BA%A1c_vi%E1%BB%87n_Th%C3%A0nh_ph%E1%BB%91_H%E1%BB%93_Ch%C3%AD_Minh" ]
    luot_2_ghi_chu: "Wikipedia tiếng Việt: thành lập 12/4/1956 là Trường Quốc gia Âm nhạc ở Sài Gòn; địa chỉ 112 Nguyễn Du. Chưa mở được trang chính thức của Nhạc viện; chưa xác nhận riêng câu 'đào tạo cả nhạc phương Tây và truyền thống' (trang chỉ nói đào tạo âm nhạc nhiều chuyên ngành)."
