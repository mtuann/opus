doi_chu:
  - cu: 'Cập nhật lần cuối: 10/2026. Thông tin về các đơn vị và lịch diễn thay đổi thường xuyên; hãy kiểm tra trang chính thức trước khi đi.'
    moi: Thông tin về các đơn vị và lịch diễn thay đổi thường xuyên; hãy kiểm tra trang chính thức trước khi đi.
    ly_do: Ngày kiểm và ngày rà lại hiện tự động ở đầu trang tham chiếu (src/components/PageTitle.astro, lớp oz-ra-lai; tháng kiểm từ lan của hồ sơ, tháng rà lại từ ra_lai của trang.yml), thay dòng ngày viết tay (bao-cao/d8-chuan-bi.md, 'Đã chọn' 2).
  - cu: Cơ sở đào tạo âm nhạc hàng đầu cả nước
    moi: Học viện âm nhạc quốc gia, ở Hà Nội
    ly_do: '"Hàng đầu cả nước" là xếp hạng không kiểm được.'
  - cu: 12/4/1956, tiền thân là trường Quốc gia Âm nhạc Sài Gòn
    moi: 12/4/1956, khi ấy là Trường Quốc gia Âm nhạc ở Sài Gòn
    ly_do: 'Wikipedia: tên cũ Trường Quốc gia Âm nhạc; tiền thân trực tiếp là phân khoa nhạc của Trường Mỹ thuật Gia Định.'
  - cu:
      - Đại diện khu vực miền Trung
      - Các cơ sở này thường có hệ năng khiếu hoặc lớp ngắn hạn, và nhiều giảng viên, sinh viên nhận dạy riêng. Đây là nơi tốt để tìm thầy (xem Học với thầy và thi cấp).
    moi:
      - Cơ sở đào tạo âm nhạc ở miền Trung
      - Hãy hỏi trực tiếp các cơ sở này về lớp ngắn hạn hay giảng viên nhận dạy riêng. Đây là nơi tốt để tìm thầy (xem Học với thầy và thi cấp).
    ly_do: Khái quát về các cơ sở không kiểm được; đổi thành lời khuyên.
  - cu:
      - 'Dàn nhạc Giao hưởng Việt Nam (VNSO, Hà Nội): dàn nhạc giao hưởng hàng đầu cả nước. Tiền thân hình thành từ năm 1959, được tổ chức lại năm 1984 (năm 2024 kỷ niệm 40 năm thành lập). Dàn nhạc biểu diễn khoảng 60 buổi mỗi năm, cả tác phẩm kinh điển lẫn tác phẩm của nhà soạn nhạc Việt Nam, và đã lưu diễn ở nhiều nước, trong đó có Carnegie Hall (New York).'
      - 'Dàn nhạc Giao hưởng Mặt Trời (Sun Symphony Orchestra, SSO): thành lập năm 2017 tại Hà Nội, là dàn nhạc giao hưởng tư nhân, do nhạc trưởng người Pháp Olivier Ochanine làm giám đốc âm nhạc.'
    moi:
      - 'Dàn nhạc Giao hưởng Việt Nam (VNSO, Hà Nội): một trong những đơn vị nghệ thuật chuyên nghiệp hàng đầu của cả nước. Tiền thân hình thành từ năm 1959, được tổ chức lại năm 1984 (năm 2024 kỷ niệm 40 năm thành lập). Dàn nhạc đã lưu diễn nước ngoài, trong đó có Carnegie Hall (New York) năm 2011.'
      - 'Dàn nhạc Giao hưởng Mặt Trời (Sun Symphony Orchestra, SSO): thành lập năm 2017, hoạt động dưới sự bảo trợ của Tập đoàn Sun Group, có nhạc trưởng người Pháp Olivier Ochanine.'
    ly_do: Thư của Bộ trưởng nói "một trong những đơn vị… hàng đầu"; bỏ số buổi mỗi năm (mau cũ) và "ở nhiều nước"; thêm năm 2011.
  - cu:
      - 'Các dàn nhạc khác: Dàn nhạc Giao hưởng Trẻ Việt Nam (VYO), Dàn nhạc Giao hưởng Quân đội (MSO), cùng dàn nhạc của Học viện Âm nhạc Quốc gia và Nhạc viện TP.HCM với các buổi hòa nhạc sinh viên, giá vé thấp hoặc miễn phí.'
      - Hội Nhạc cổ điển Việt Nam được thành lập cuối năm 2025, một cột mốc cho đời sống nhạc cổ điển trong nước.
    moi:
      - 'Các dàn nhạc khác: Dàn nhạc Giao hưởng Trẻ Việt Nam (VYO), Dàn nhạc Giao hưởng Quân đội (MSO).'
      - Hội Nhạc cổ điển Việt Nam được thành lập năm 2025.
    ly_do: Bỏ vế giá vé và dàn nhạc sinh viên (không kiểm được, mau cũ).
  - cu: 'Nhà hát Lớn Hà Nội: công trình kiến trúc Pháp hoàn thành năm 1911, nơi diễn ra nhiều buổi hòa nhạc giao hưởng lớn.'
    moi: 'Nhà hát Lớn Hà Nội: công trình kiến trúc Pháp xây từ 1901, hoàn thành năm 1911. Từ đầu năm 2026 nhà hát đóng cửa để trùng tu, dự kiến khoảng hai năm: hãy kiểm tra thông báo mới nhất.'
    ly_do: 'Thông tin mau cũ: nhà hát đóng cửa trùng tu (báo Lâm Đồng 24/12/2025).'
  - cu: 'Nhà hát Hồ Gươm (40 Hàng Bài, Hà Nội): khai trương tháng 7/2023, kiến trúc tân cổ điển, trang bị âm học hiện đại. Đây là nơi đã đón nhiều chương trình opera, ballet và giao hưởng quốc tế; năm 2023 được World Travel Awards đưa vào danh sách 10 nhà hát opera tuyệt vời nhất thế giới.'
    moi: 'Nhà hát Hồ Gươm (40 Hàng Bài, Hà Nội): khai trương ngày 9/7/2023, kiến trúc tân cổ điển, sảnh chính 900 chỗ, dùng cho opera, ballet và giao hưởng. Tháng 12/2023, nhà hát được World Travel Awards đưa vào danh sách 10 nhà hát opera tuyệt vời nhất thế giới.'
    ly_do: VietNamNet và báo Văn hóa; bỏ "âm học hiện đại" và "đã đón nhiều chương trình quốc tế" (không kiểm được).
  - cu:
      - 'Hoàng Việt (1928–1967) viết giao hưởng Quê hương khi học ở Nhạc viện Sofia (Bulgaria) và tốt nghiệp loại ưu với tác phẩm này vào khoảng 1964–1965. Đây được coi là bản giao hưởng đầu tiên của Việt Nam: 4 chương, khai thác chất liệu từ ca khúc cách mạng và dân ca. Ông còn để lại giao hưởng Cửu Long dang dở.'
      - Đỗ Nhuận (1922–1991), học tại Nhạc viện Tchaikovsky (Moskva), là người viết vở opera đầu tiên của Việt Nam, Cô Sao (1965).
      - Các thế hệ tiếp theo như Nguyễn Văn Thương, Trọng Bằng, Ca Lê Thuần tiếp tục viết giao hưởng, thơ giao hưởng và nhạc thính phòng, thường lấy chất liệu từ dân ca. Có những tên tuổi hoạt động ở nước ngoài, như Tôn Thất Tiết (sống ở Pháp).
    moi:
      - 'Hoàng Việt (1928–1967) viết giao hưởng Quê hương khi học ở Nhạc viện Sofia (Bulgaria) và tốt nghiệp hạng ưu tú cuối năm 1964 với tác phẩm này. Đây được coi là bản giao hưởng đầu tiên của Việt Nam: 4 chương, mang tính sử thi về cuộc kháng chiến. Ông còn để lại giao hưởng Cửu Long dang dở.'
      - Đỗ Nhuận (1922–1991), học tại Nhạc viện Tchaikovsky (Moskva), viết Cô Sao (1965), vở thường được coi là opera đầu tiên của Việt Nam.
      - Các thế hệ tiếp theo, như Ca Lê Thuần, tiếp tục viết giao hưởng, thơ giao hưởng và nhạc thính phòng, thường mang chất liệu dân gian.
    ly_do: 'Đại biểu Nhân dân: tốt nghiệp cuối 1964, sử thi; vế chất liệu ca khúc cách mạng và dân ca không có nguồn.'
  - cu: 'Nhạc cổ điển phương Tây có mặt ở Sài Gòn từ thời Pháp thuộc: đoàn hát Pháp đã sang biểu diễn từ năm 1863, và Nhà hát Lớn Sài Gòn (khánh thành 1900) thời đó chủ yếu phục vụ khán giả người Pháp. Sau 1954, Trường Quốc gia Âm nhạc Sài Gòn (tiền thân của Nhạc viện TP.HCM ngày nay) đào tạo bài bản lứa nghệ sĩ mới, Sài Gòn có Dàn nhạc Giao hưởng Sài Gòn (tư liệu về năm thành lập và biên chế còn rất ít), và các đài phát thanh lớn đều có ban nhạc cổ điển phương Tây riêng.'
    moi: Ở Sài Gòn, Nhà hát Lớn khánh thành năm 1900, thời Pháp thuộc. Từ năm 1956, Trường Quốc gia Âm nhạc (nay là Nhạc viện TP.HCM) đào tạo bài bản lứa nghệ sĩ mới, và các đài phát thanh ở Sài Gòn có ban nhạc cổ điển phương Tây riêng.
    ly_do: Bỏ các chi tiết không có nguồn đã mở (1863, khán giả người Pháp, Dàn nhạc Giao hưởng Sài Gòn); trường lập 1956.
  - cu:
      - Tốt nghiệp hạng ưu Nhạc viện Paris về piano và hòa âm, về Sài Gòn năm 1958; là nghệ sĩ piano độc tấu của Dàn nhạc Giao hưởng Sài Gòn, rồi Phó Giám đốc (1965–1970) và Giám đốc (1970–4/1975) Trường Quốc gia Âm nhạc và Kịch nghệ.
      - Divertimento I (1960) và Divertimento II (1965) viết theo thang âm ngũ cung, phối hợp đàn bầu, đàn tranh, đàn nhị với dàn nhạc giao hưởng phương Tây; được trình diễn nhiều lần ở Sài Gòn và được báo chí nước ngoài chú ý. Tứ tấu dây Fantasia I (1974) thử nghiệm nhiều cách diễn tấu mới.
    moi:
      - Tốt nghiệp hạng ưu ở Paris về piano và hòa âm; làm Phó Giám đốc (từ 1965) rồi Giám đốc (từ 1970) Trường Quốc gia Âm nhạc và Kịch nghệ ở Sài Gòn.
      - Ông nghiên cứu nhạc cụ cổ truyền và kết hợp chúng với dàn nhạc giao hưởng phương Tây; tác phẩm gồm Divertimento (1960, 1965) và Fantasia I (1974).
    ly_do: RFA chỉ xác nhận các điều này.
  - cu: 'Ngoài ra, tư liệu ghi nhận một số tác phẩm hình thức lớn khác: giao hưởng Symphony Viet Nam 1975 của Lê Văn Khoa (viết trong khoảng 20 năm, công diễn lần đầu năm 1995), vũ kịch Kim Trọng Thúy Kiều (1962–1966) và nhạc kịch Sắc lụa trữ la (1958–1960) của Phạm Thế Mỹ, hợp xướng Cửu Long Giang (5 chương, 1972) của Phan Miêng, cùng các hợp xướng tôn giáo quy mô lớn của linh mục Anton Nguyễn Tiến Dũng. Nghệ sĩ violin Đỗ Thế Phiệt (giải Grand Prix du Violon 1954) giảng dạy tại Trường Quốc gia Âm nhạc thời kỳ này.'
    moi: 'Ngoài ra, tư liệu ghi nhận một số tác phẩm hình thức lớn khác: giao hưởng Symphony Viet Nam 1975 của Lê Văn Khoa (viết trong khoảng 20 năm, công diễn lần đầu năm 1995), vũ kịch Kim Trọng Thúy Kiều (1962–1966) và nhạc kịch Sắc lụa trữ la (1958–1960) của Phạm Thế Mỹ, hợp xướng Cửu Long Giang (5 chương, 1972) của Phan Miêng, cùng các hợp xướng tôn giáo quy mô lớn của linh mục Nguyễn Tiến Dũng. Nghệ sĩ violin Đỗ Thế Phiệt đoạt giải Grand Prix du Violon năm 1954.'
    ly_do: Bỏ "Anton" (chữ lỗi nhận dạng) và "giảng dạy tại Trường Quốc gia Âm nhạc" (không kiểm được).
  - cu:
      - 'Các dàn nhạc trong nước ngày nay thường xuyên đưa tác phẩm của nhạc sĩ Việt vào chương trình, và HBSO hằng năm đặt hàng sáng tác mới từ đội ngũ tác giả trẻ. Vài cái tên nên biết:'
      - 'Đỗ Hồng Quân (sinh 1956), con trai nhạc sĩ Đỗ Nhuận: học sáng tác và chỉ huy ở Nhạc viện Moskva, tốt nghiệp bằng đỏ với Concerto cho violon và dàn nhạc; giảng dạy sáng tác ở Nhạc viện Hà Nội hơn 25 năm, từng là Chủ tịch Hội Nhạc sĩ Việt Nam. Tác phẩm tiêu biểu: Rhapsodie Việt Nam, Concerto cho violon và dàn nhạc, Trổ Một (2007), tổ khúc giao hưởng Dáng rồng lên (2010, kỷ niệm 1000 năm Thăng Long – Hà Nội), Sắc xuân (đàn bầu và dàn nhạc), opera Vầng trăng Him Lam (2024). Tác phẩm của ông được biểu diễn ở Pháp, Nga, Đức, Nhật, Singapore...'
      - 'Đặng Hữu Phúc (sinh 1953): học sáng tác và piano ở Trường Âm nhạc Việt Nam, tu nghiệp Nhạc viện Paris (1991–1992), từng công tác tại Dàn nhạc Giao hưởng Việt Nam, giảng viên Học viện Âm nhạc Quốc gia Việt Nam. Nổi tiếng với nhạc phim (Thời xa vắng), ông đồng thời viết nhiều khí nhạc: Ouverture Ngày hội (2003) — tác phẩm mở màn chuyến lưu diễn châu Âu đầu tiên của VNSO năm 2007; Pizzicato Việt Nam (2009); tổ khúc Chùm hoa Việt Nam (Đặng Thái Sơn biểu diễn và ghi CD ở Nhật).'
      - 'Nguyễn Mạnh Duy Linh (sinh 1980): học sáng tác ở Nhạc viện Magnitogorsk (Nga), tốt nghiệp loại xuất sắc; hiện là Trưởng phòng Tổ chức biểu diễn của HBSO và giảng viên sáng tác ở Nhạc viện TP.HCM. Tác phẩm tiêu biểu: Concerto cho violin và dàn nhạc (giải Nhạc sĩ xuất sắc, Liên hoan Âm nhạc quốc tế Chelyabinsk 2007), Concerto Grosso cho violin, piano, bộ gõ và dàn nhạc dây (VNSO biểu diễn năm 2011).'
      - 'Lương Huệ Trinh (sinh 1985): tốt nghiệp Học viện Âm nhạc Quốc gia Việt Nam, thạc sĩ sáng tác đa phương tiện ở Hamburg (học bổng DAAD); đại diện cho hướng "nhạc mới" của Việt Nam. Tác phẩm tiêu biểu: Thư Hà Nội (2019, cùng nghệ sĩ Pháp Jean-David Caillouët), Vệt, và các tác phẩm thính phòng kết hợp đàn tranh, đàn bầu với điện tử; tác phẩm của cô được phát trên đài phát thanh nhiều nước.'
      - 'Gợi ý: khi xem chương trình hòa nhạc của VNSO, HBSO hay SSO, hãy để ý mục "tác phẩm Việt Nam" — đó thường là những buổi công diễn đầu tiên, và là cách trực tiếp nhất để nghe nhạc cổ điển Việt Nam hôm nay.'
    moi:
      - 'Các dàn nhạc trong nước đưa tác phẩm của nhạc sĩ Việt vào chương trình. Vài cái tên nên biết:'
      - 'Đỗ Hồng Quân (sinh 1956), con trai nhạc sĩ Đỗ Nhuận: học sáng tác và chỉ huy ở Nhạc viện Tchaikovsky (Moskva), giảng dạy sáng tác ở Nhạc viện Hà Nội hơn 25 năm. Tác phẩm gồm Sắc xuân (đàn bầu và dàn nhạc) và opera Vầng trăng Him Lam (2024). Tác phẩm của ông được biểu diễn ở Nga, Mỹ, Pháp, Đức, Nhật, Singapore...'
      - 'Đặng Hữu Phúc (sinh 1953): học sáng tác và piano ở Hà Nội, học tiếp ở Paris, giảng viên sáng tác ở Học viện Âm nhạc Quốc gia Việt Nam. Ông viết nhạc phim và cả khí nhạc: ouverture Ngày hội (2003), Pizzicato Việt Nam (2009); nghệ sĩ Đặng Thái Sơn biểu diễn các tác phẩm piano của ông.'
      - 'Nguyễn Mạnh Duy Linh: nhạc sĩ sáng tác; Concerto Grosso của ông được trình diễn trong hòa nhạc kỷ niệm 30 năm HBSO (tháng 8/2023).'
      - 'Lương Huệ Trinh (sinh 1985): học tại Học viện Âm nhạc Quốc gia Việt Nam, rồi học sáng tác đa phương tiện ở Hamburg (2015–2018, tốt nghiệp loại ưu); đại diện cho hướng "nhạc mới" của Việt Nam. Tác phẩm gồm buổi hòa nhạc đa phương tiện Thư Hà Nội (viết cùng nhà soạn nhạc Pháp Jean-David Caillouët).'
      - 'Gợi ý: khi xem chương trình hòa nhạc của VNSO, HBSO hay SSO, hãy để ý mục "tác phẩm Việt Nam": đó là cách trực tiếp nhất để nghe nhạc cổ điển Việt Nam hôm nay.'
    ly_do: 'Mục nhạc sĩ đương đại: chỉ giữ những điều nguồn đã mở nói (Hội Nhạc sĩ Việt Nam, ArtTimes, Viet Nam News); bỏ chức vụ (mau cũ), "thường xuyên", "HBSO hằng năm đặt hàng" và các chi tiết không tìm được nguồn; bỏ năm sinh 1980 của Nguyễn Mạnh Duy Linh vì hồ sơ dữ liệu nguyen-manh-duy-linh n2 chưa chắc (xem nhận định của từng người).'
  - cu: 'Giá vé thay đổi rất nhiều: các buổi hòa nhạc sinh viên thường rẻ hoặc miễn phí, các chương trình có nghệ sĩ quốc tế ở Nhà hát Lớn hay Nhà hát Hồ Gươm có giá cao hơn.'
    moi: 'Giá vé khác nhau tùy chương trình và nhà hát: xem trên trang chính thức.'
    ly_do: Khái quát về giá vé là thông tin mau cũ, không kiểm được.
