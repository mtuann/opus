ghi_chu: 'Trang tham chiếu có hạn (ra_lai 2027-04: đơn vị, nhà hát, lịch diễn trong nước). Kiểm định lượt 1 ngày 05/11/2026, mọi nguồn truy cập ngày ấy. Phần chính là thông tin mau cũ: mỗi câu có nguồn hiện hành thì giữ và ghi nguồn; không còn thì viết lại cho bền hay bỏ (mỗi chỗ có doi_chu). Phát hiện chính: (1) Nhà hát Lớn Hà Nội đóng cửa trùng tu từ đầu 2026, dự kiến khoảng hai năm (báo Lâm Đồng 24/12/2025): câu cũ "nơi diễn ra nhiều buổi hòa nhạc giao hưởng lớn" lỗi thời; (2) VNSO: bỏ "60 buổi mỗi năm"; Carnegie Hall năm 2011; (3) "World Travel Awards 2023" là danh sách 10Best (không phải hạng mục lễ trao giải), công bố 12/2023; (4) bỏ nhiều chi tiết về nhà soạn nhạc đương đại không tìm được nguồn đã mở (Nguyễn Mạnh Duy Linh, Đặng Hữu Phúc, Lương Huệ Trinh, Đỗ Hồng Quân); (5) bỏ vế "Dàn nhạc Giao hưởng Sài Gòn", Tôn Thất Tiết, Trọng Bằng, Nguyễn Văn Thương. Nguồn phần lớn là báo (bậc 3) vì không có nguồn tốt hơn (chuẩn kiểm định, mục Nguồn và cách mở: hoinhacsi.vn, báo chính thức); nguồn bậc 2 được dùng khi có (VNOB, Viện Fryderyk Chopin, Hội Nhạc sĩ Việt Nam). Giữ mục nguồn báo chí cuối trang (AGENTS.md). Người giao cần quyết/biết: (a) du-lieu/nha-soan-nhac/nguyen-manh-duy-linh n2 (sinh 1980) vẫn "chưa chắc", trong khi trang dùng năm này; nếu không có nguồn thì bỏ dòng Nguyễn Mạnh Duy Linh khỏi trang hoặc bỏ năm sinh. (b) Nhà hát Lớn Hà Nội: kiểm tình trạng khi rà lại tháng 4/2027. (c) Dữ liệu nha-soan-nhac: Đỗ Hồng Quân, Đặng Hữu Phúc, Lương Huệ Trinh, Đặng Thái Sơn, Hoàng Việt, Đỗ Nhuận, Nghiêm Phú Phi: năm sinh–mất trên trang khớp dữ liệu. (d) VNSO "1959" chỉ có nguồn bậc 3 (Wikipedia, khớp VNOB cùng năm).'
