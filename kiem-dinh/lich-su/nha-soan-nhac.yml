doi_chu:
  - cu: Nhà soạn nhạc Anh vĩ đại nhất trước thế kỷ 20, mất năm 36 tuổi. Bậc thầy của bè trầm lặp lại (ground bass) và phổ nhạc cho tiếng Anh.
    moi: Một trong những nhà soạn nhạc Anh vĩ đại nhất, mất năm 36 tuổi. Bậc thầy của bè trầm lặp lại (ground bass) và phổ nhạc cho tiếng Anh.
    ly_do: 'p1 (da-sua): Oxford ghi "among the greatest of Eng. composers" và nói ông "challenges" Byrd, Elgar, Britten cho danh hiệu lớn nhất; không có nguồn nào nói "trước thế kỷ 20". "Died at the age of 36" (Temperley).'
  - cu: Linh mục và nghệ sĩ violin người Venice, dạy nhạc nhiều năm tại một trại trẻ mồ côi nữ có dàn nhạc nổi tiếng. Ông viết hơn 500 concerto và định hình thể loại concerto độc tấu ba chương (nhanh – chậm – nhanh).
    moi: Linh mục và nghệ sĩ violin người Venice, dạy nhạc nhiều năm tại một trại trẻ mồ côi nữ có dàn nhạc nổi tiếng. Ông viết hơn 500 concerto và góp phần chuẩn hóa concerto ba chương (nhanh – chậm – nhanh).
    ly_do: 'v2 (da-sua): Oxford/Gale: "over five hundred concertos"; "helped to standardize the three-movement concerto form" (không nói ông tạo ra); ông còn được ghi công "regularizing ritornello form".'
  - cu: Nhạc sĩ organ và giám đốc âm nhạc nhà thờ ở Leipzig suốt 27 năm cuối đời. Bach là bậc thầy tuyệt đối của phức điệu và fugue; tác phẩm của ông là nền tảng học hòa âm và đối âm đến tận hôm nay. Sinh thời ông được biết đến như một nghệ sĩ organ hơn là nhà soạn nhạc; âm nhạc của ông được "tái khám phá" mạnh mẽ từ năm 1829 khi Mendelssohn dàn dựng lại Thương khó theo Thánh Matthew.
    moi: Nghệ sĩ organ bậc thầy, từ năm 1723 làm cantor (giám đốc âm nhạc) ở Leipzig suốt 27 năm cuối đời. Bach là bậc thầy tuyệt đối của phức điệu và fugue. Sinh thời ông nổi tiếng nhất với tài chơi organ, và rất ít tác phẩm của ông được in khi ông còn sống; làn sóng "tái khám phá" Bach thường được tính từ năm 1829, khi Mendelssohn dàn dựng lại Thương khó theo Thánh Matthew.
    ly_do: 'b1, b2, b3, b4 (da-sua): chữ cũ mơ hồ (ông không là organist ở Leipzig); Baker: "elected to the post of cantor of the city of Leipzig" 22/4/1723, nhậm chức 31/5/1723, giữ đến hết đời (mất 28/7/1750: 27 năm); "master organist" (Baker), "famous as an org. virtuoso" (Oxford). Chữ cũ có thêm: "tác phẩm của ông là nền tảng học hòa âm và đối âm đến tận hôm nay". Đã bỏ vế ấy: không tìm được nguồn bậc 1–2 đọc được (Open Music Theory trang đầu không nhắc Bach). Vế còn lại: Gale "the ultimate expression of polyphony", Oxford "supreme achievement", Kunst der Fuge "an encyclopedia of fugues, canons". Oxford: "famous as an org. virtuoso", "fewer than a dozen of his works were printed before he died"; Baker thêm "it is historically incorrect to maintain that Bach was not appreciated by his contemporaries", nên so sánh "hơn là nhà soạn nhạc" bỏ. Oxford và Britannica coi buổi diễn 11/3/1829 ở Berlin là khởi đầu phong trào phục hưng Bach thế kỷ 19; Baker ghi đó là "conventional" và nhắc Mozart, Beethoven đã tập các prelude và fugue của Bach, nên viết "thường được tính".'
  - cu: Phục vụ gia đình quý tộc Esterházy gần 30 năm, Haydn được gọi là "cha đẻ của giao hưởng" và "cha đẻ của tứ tấu đàn dây" vì đã định hình cả hai thể loại. Ông viết 104 bản giao hưởng, nổi tiếng với sự hóm hỉnh và bất ngờ.
    moi: Phục vụ gia đình quý tộc Esterházy gần 30 năm, Haydn được gọi là "cha đẻ của giao hưởng" và "cha đẻ của tứ tấu đàn dây" vì đã góp phần định hình cả hai thể loại. Ông viết 104 bản giao hưởng, nổi tiếng với sự hóm hỉnh và bất ngờ.
    ly_do: "y2 (da-sua): một mục ghi ông \"is sometimes called the father of both the symphony and the string quartet\"; Oxford ghi 'father' of the sym. \"(which he was not)\"."
  - cu: Thần đồng biểu diễn khắp châu Âu từ năm 6 tuổi, Mozart sống chỉ 35 năm nhưng để lại hơn 600 tác phẩm ở mọi thể loại. Các tác phẩm được đánh số theo danh mục Köchel (K.).
    moi: Thần đồng biểu diễn khắp châu Âu từ năm 6 tuổi, Mozart sống chỉ 35 năm nhưng để lại khoảng 600 tác phẩm ở mọi thể loại. Các tác phẩm được đánh số theo danh mục Köchel (K.).
    ly_do: 'z2 (da-sua): danh mục Köchel đánh số đến K. 626 (gồm cả bản thất lạc, bản dở dang, bản nghi vấn), các nguồn nói "nearly 600" hoặc "over 600" tùy cách đếm, nên "khoảng 600" an toàn. Sinh 27/1/1756, mất 5/12/1791 (35 tuổi). Chỗ yếu: không có con số duy nhất nguồn nào thống nhất.'
  - cu: Học ở Vienna (có thời gian học với Haydn), Beethoven bắt đầu bị mất thính lực từ khoảng tuổi 28 và gần như điếc hoàn toàn khi viết những tác phẩm vĩ đại nhất. Ông là cây cầu từ Cổ điển sang Lãng mạn, đưa giao hưởng và sonata lên quy mô và chiều sâu chưa từng có.
    moi: Học ở Vienna (có thời gian học với Haydn), Beethoven bắt đầu bị mất thính lực từ khoảng năm 1798; bệnh nặng dần, và ông gần như điếc hoàn toàn khi viết những tác phẩm cuối đời. Ông là cây cầu từ Cổ điển sang Lãng mạn, đưa giao hưởng và sonata lên quy mô và chiều sâu chưa từng có.
    ly_do: 'e2 (da-sua): tuổi 28 ứng với 1798 (sinh 1770) nhưng chữ "tuổi" dễ lệch (Beethoven tự kể 1796, Heiligenstadt Testament 1802 nói "sáu năm"); nguồn không thống nhất giữa 1796 và 1798 nên giữ "khoảng 1798" kèm "khoảng". "Những tác phẩm vĩ đại nhất" là đánh giá chủ quan, đổi sang "tác phẩm cuối đời" (giao hưởng 9, các tứ tấu cuối) khớp nguồn.'
  - moi: "Thần đồng âm nhạc: viết Bát tấu đàn dây năm 16 tuổi và khúc mở màn Giấc mộng đêm hè năm 17 tuổi. Là nhạc trưởng dàn nhạc Gewandhaus Leipzig và người dàn dựng lại Thương khó theo Thánh Matthew của Bach năm 1829, khơi dậy phong trào phục hưng âm nhạc Bach. Chị gái ông là Fanny Mendelssohn Hensel."
    ly_do: "n1, n5 (da-sua): so sánh với Mozart là nhận xét thường gặp nhưng không có câu nguồn đọc được để dẫn; bỏ để khỏi sai. Octet Op. 20 (1825, 16 tuổi, sinh 3/2/1809) và Midsummer Night's Dream overture (1826, 17 tuổi) khớp Oxford/Britannica. Trước đây trang xếp Chopin trước Mendelssohn, trái thứ tự năm sinh đã nói ở phần mở đầu. Đã đổi chỗ hai mục; dữ liệu khóa: Mendelssohn 1809, Chopin 1810. Anchor của hai mục không đổi. (mục Mendelssohn đổi chỗ lên trước Chopin, nội dung đổi như n1); n5 (da-sua): Trước đây trang xếp Chopin trước Mendelssohn, trái thứ tự năm sinh đã nói ở phần mở đầu. Đã đổi chỗ hai mục; dữ liệu khóa: Mendelssohn 1809, Chopin 1810. Anchor của hai mục không đổi. (mục Mendelssohn đổi chỗ lên trước Chopin, nội dung đổi như n1)"
  - cu: Sinh ở Ba Lan, sống và biểu diễn tại Paris. Gần như mọi tác phẩm của Chopin đều cho piano, và ông được coi là "nhà thơ của cây đàn piano".
    moi: Sinh ở Ba Lan, từ năm 1831 sống và làm việc ở Paris. Gần như mọi tác phẩm của Chopin đều cho piano, và ông được xếp vào hàng những "nhà thơ âm thanh" (tone poet) lớn nhất.
    ly_do: 'c1, c3 (da-sua): Oxford/Britannica: rời Warsaw 1830, đến Paris cuối 1831 và ở đó đến khi mất; "biểu diễn" thu hẹp (ông ít biểu diễn công chúng, chủ yếu dạy và diễn salon). không tìm được nguồn bậc 1–2 cho nguyên văn câu cũ; Britannica gọi ông "Polish French composer and pianist of the Romantic era, who wrote primarily for solo piano" và nói về chất thơ trong nhạc; chữ mới bám chữ "tone poet" mà Oxford/Britannica dùng cho ông.'
  - cu: "Thần đồng được so với Mozart: viết Bát tấu đàn dây năm 16 tuổi và khúc mở màn Giấc mộng đêm hè năm 17 tuổi. Là nhạc trưởng dàn nhạc Gewandhaus Leipzig và người dàn dựng lại Thương khó theo Thánh Matthew của Bach năm 1829, khơi dậy phong trào phục hưng âm nhạc Bach. Chị gái ông là Fanny Mendelssohn Hensel."
    ly_do: 'n1, n5 (da-sua): Mendelssohn bỏ "được so với Mozart", và chuyển lên trước Chopin theo năm sinh (neo không đổi).'
  - cu: Nhà soạn nhạc, nhà phê bình âm nhạc (ông sáng lập một tạp chí âm nhạc có ảnh hưởng lớn và là người giới thiệu Chopin, Brahms với công chúng), chồng của nghệ sĩ piano Clara Schumann. Âm nhạc piano và ca khúc của ông giàu tưởng tượng, gắn với văn học. Những năm cuối đời ông bị bệnh tâm thần nặng.
    moi: Nhà soạn nhạc, nhà phê bình âm nhạc (ông sáng lập tạp chí âm nhạc Neue Zeitschrift für Musik và viết bài ca ngợi Chopin, Brahms), chồng của nghệ sĩ piano Clara Schumann. Âm nhạc piano và ca khúc của ông giàu tưởng tượng, gắn với văn học. Những năm cuối đời ông bị bệnh tâm thần nặng.
    ly_do: 'r1 (da-sua): nêu đích danh tạp chí (Baker: Neue Zeitschrift für Musik, 1834) và bỏ "giới thiệu với công chúng" (quá chung): Schumann viết bài "Hats off, gentlemen, a genius" về Chopin (1831) và "Neue Bahnen" (1853) về Brahms.'
  - cu: Nghệ sĩ piano điêu luyện nhất thế kỷ 19, người tạo ra buổi độc tấu piano (recital) theo kiểu hiện đại và thể loại thơ giao hưởng.
    moi: Một trong những nghệ sĩ piano điêu luyện nhất thế kỷ 19, người tạo ra buổi độc tấu piano (recital) theo kiểu hiện đại và thể loại thơ giao hưởng.
    ly_do: 'l1 (da-sua): "nhất" là xếp hạng tuyệt đối; Oxford ghi ông là một trong các nghệ sĩ lớn nhất, "inventor of the piano recital" (1840) và "symphonic poem".'
  - cu: "Người cách mạng hóa opera thành nhạc kịch (Musikdrama): âm nhạc liền mạch, không chia aria, các leitmotif gắn với nhân vật và ý tưởng. Ông tự viết lời và xây nhà hát riêng ở Bayreuth. Hòa âm của Tristan und Isolde mở đường cho âm nhạc thế kỷ 20. Quan điểm bài Do Thái trong các bài viết của ông vẫn là vấn đề gây tranh cãi khi biểu diễn và đánh giá ông."
    moi: "Người cách mạng hóa opera thành thứ thường được gọi là nhạc kịch (Musikdrama, thuật ngữ mà chính Wagner không ưa): âm nhạc liền mạch, không chia aria, các leitmotif gắn với nhân vật và ý tưởng. Ông tự viết lời và xây nhà hát riêng ở Bayreuth. Hòa âm của Tristan und Isolde mở đường cho âm nhạc thế kỷ 20. Quan điểm bài Do Thái trong các bài viết của ông vẫn là vấn đề gây tranh cãi khi biểu diễn và đánh giá ông."
    ly_do: 'w1 (da-sua): Oxford ghi Wagner không dùng/không ưa chữ "music drama" cho tác phẩm của mình; thuật ngữ do người khác gán. Leitmotif: Oxford/Baker xác nhận. Thuật ngữ (nhạc kịch, leitmotif) chưa có trong src/data/thuat-ngu.yml: xem ghi chú hồ sơ.'
  - cu: Nhà soạn opera Ý lớn nhất thế kỷ 19, sinh cùng năm với Wagner. Opera của ông kịch tính, giai điệu mạnh mẽ, gắn với phong trào thống nhất nước Ý. Ông còn viết opera đến tận tuổi gần 80 (Falstaff, 1893). Xem Nhập môn opera.
    moi: Nhà soạn opera Ý có ảnh hưởng và được yêu thích nhất nửa sau thế kỷ 19, sinh cùng năm với Wagner. Opera của ông kịch tính, giai điệu mạnh mẽ, thường được gắn với phong trào thống nhất nước Ý. Ông còn viết opera đến tận tuổi gần 80 (Falstaff, 1893). Xem Nhập môn opera.
    ly_do: 'd1, d2 (da-sua): "lớn nhất" là xếp hạng tuyệt đối, Rossini, Donizetti, Bellini, Puccini cũng thuộc thế kỷ này; Britannica: "most influential and widely performed" nhà soạn opera Ý; cùng năm 1813 với Wagner (sinh 10/10/1813). Oxford/Britannica ghi mối liên hệ Risorgimento (Nabucco, "VIVA VERDI") nhưng nói rõ phần lớn là truyền thuyết hậu thế, nên không viết khẳng định.'
  - cu: "Người kế thừa truyền thống Beethoven, kết hợp hình thức chặt chẽ với cảm xúc Lãng mạn sâu lắng. Dấu vân tay của ông: giai điệu dài, ấm, thường bắt đầu lệch phách; một môtip nhỏ được nhào nặn, biến hóa thành cả một chương nhạc."
    moi: "Người kế thừa truyền thống Beethoven, kết hợp hình thức chặt chẽ với cảm xúc Lãng mạn sâu lắng. Dấu vân tay của ông: cấu trúc cổ điển chặt chẽ cùng nhiều phát triển chủ đề mới mẻ, và sở trường về hình thức biến tấu."
    ly_do: 'a2 (da-sua): nguồn đọc được nhấn mạnh phát triển chủ đề (Schoenberg: "Brahms the progressive") và biến tấu (Haydn Variations, chương cuối Giao hưởng 4 là passacaglia); câu về "giai điệu bắt đầu lệch phách" không tìm được nguồn bậc 1–2, nên thay.'
  - cu: Nhà soạn nhạc Pháp, mất năm 36 tuổi chỉ vài tháng sau khi vở opera Carmen ra mắt — vở opera ban đầu bị chê là "thô tục" nhưng sau đó trở thành một trong những opera được diễn nhiều nhất thế giới. Âm nhạc của ông đầy màu sắc Tây Ban Nha và giai điệu bắt tai.
    moi: Nhà soạn nhạc Pháp, mất năm 36 tuổi chỉ vài tháng sau khi vở opera Carmen ra mắt — vở opera ban đầu bị chê là "vô luân và thô tục" nhưng sau đó trở thành một trong những opera được yêu thích nhất thế giới. Âm nhạc của ông đầy màu sắc Tây Ban Nha và giai điệu bắt tai.
    ly_do: 'i2 (da-sua): Britannica ghi giới phê bình chê vở là "immoral and vulgar" ("vô luân và thô tục"), nên đưa đủ cụm trong ngoặc kép; "được diễn nhiều nhất" không có nguồn xếp hạng, đổi "được yêu thích nhất".'
  - cu: "Nhà soạn nhạc Nga có giai điệu dễ nhớ bậc nhất, tác giả của ba vở ballet được dàn dựng nhiều nhất thế giới. Dấu vân tay của ông: giai điệu đẹp đến nao lòng, dàn nhạc rực rỡ nhiều màu sắc, và cảm xúc được đẩy lên đến tận cùng — từ say đắm đến bi kịch."
    moi: "Nhà soạn nhạc Nga nổi tiếng với giai điệu dễ nhớ, tác giả của ba vở ballet nổi tiếng bậc nhất thế giới. Dấu vân tay của ông: giai điệu đẹp đến nao lòng, dàn nhạc phối khí rực rỡ nhiều màu sắc, và cảm xúc nồng nhiệt, hướng thẳng vào trái tim."
    ly_do: 't1, t2 (da-sua): không có nguồn xếp hạng số lần dàn dựng; Oxford: ba ballet Swan Lake, Sleeping Beauty, Nutcracker "among the most popular of all ballets". Giữ "ba vở ballet". Chữ cũ: "...cảm xúc được đẩy lên đến tận cùng — từ say đắm đến bi kịch". Chữ mới nhẹ hơn, mô tả phong cách (Oxford: melody, orchestration, emotional directness). Là nhận xét mô tả, không khẳng định số liệu.'
  - cu: "Nhà soạn nhạc Séc đưa chất dân ca vào nhạc giao hưởng. Ông sống ở Mỹ ba năm và viết Giao hưởng số 9 tại đó. Dấu vân tay của ông: giai điệu tươi sáng, mộc mạc như dân ca; tiết tấu nảy, rộn ràng; âm nhạc luôn toát lên niềm vui sống và nỗi nhớ quê hương."
    moi: "Nhà soạn nhạc Séc đưa chất dân ca vào nhạc giao hưởng. Ông sống ở Mỹ ba năm và viết Giao hưởng số 9 tại đó. Dấu vân tay của ông: giai điệu tươi sáng, mộc mạc như dân ca; tiết tấu nảy, rộn ràng; âm nhạc thường toát lên niềm vui sống và nỗi nhớ quê hương."
    ly_do: 'o3 (da-sua): "luôn" quá tuyệt đối (có tác phẩm bi kịch như Stabat Mater).'
  - cu: "Nhà soạn nhạc Na Uy, đưa dân ca và phong cảnh Bắc Âu vào nhạc cổ điển; bậc thầy của các tiểu phẩm ngắn. Dấu vân tay của ông: những tiểu phẩm trong trẻo như tranh phong cảnh — nghe là thấy núi tuyết, vịnh hẹp và ánh sáng phương Bắc; hòa âm tinh tế, hiếm khi ồn ào."
    moi: "Nhà soạn nhạc Na Uy, đưa dân ca và phong cảnh Bắc Âu vào nhạc cổ điển; nổi tiếng với các tiểu phẩm ngắn (10 tập Lyric Pieces cho piano). Dấu vân tay của ông: những tiểu phẩm giàu chất thơ, gắn với dân ca và phong cảnh Na Uy; ông tránh các hình thức lớn như opera hay giao hưởng."
    ly_do: 'g1, g2 (da-sua): "bậc thầy" là đánh giá; Oxford ghi 10 tập Lyric Pieces (66 bản, 1867–1901), nên dẫn số liệu. cụm hình ảnh chủ quan không có nguồn; Oxford: ông không viết opera hoàn chỉnh hay giao hưởng thành công (Giao hưởng cung Do thứ bị ông rút lại).'
  - cu: Nhà soạn nhạc Anh tự học phần lớn, nổi tiếng muộn ở tuổi ngoài 40 với Enigma Variations. Mở đầu thời kỳ phục hưng của âm nhạc Anh.
    moi: Nhà soạn nhạc Anh tự học phần lớn, nổi tiếng muộn ở tuổi ngoài 40 với Enigma Variations. Tác phẩm của ông mở ra thời kỳ nở rộ hiện đại của âm nhạc Anh.
    ly_do: 'x2 (da-sua): "English musical renaissance" là cách gọi thường gặp (Oxford/Gale gắn với Elgar), nhưng "mở đầu" là khẳng định mạnh; chữ mới diễn đạt đúng mức nguồn nói.'
  - cu: "Nhà soạn opera Ý thuộc trường phái verismo: đời sống thường ngày, cảm xúc mãnh liệt, giai điệu không thể quên. Opera của ông thuộc nhóm được diễn nhiều nhất thế giới. Turandot dang dở khi ông mất."
    moi: "Nhà soạn opera Ý với nhiều vở theo trường phái verismo: đời sống thường ngày, cảm xúc mãnh liệt, giai điệu không thể quên. Opera của ông thuộc nhóm được diễn nhiều nhất thế giới. Turandot dang dở khi ông mất."
    ly_do: 'q1 (da-sua): Oxford/Britannica: Puccini chịu ảnh hưởng verismo (Manon Lescaut, Tosca, La bohème) nhưng không thuộc hẳn trường phái (Madama Butterfly, Turandot khác); nên viết "nhiều vở theo". Thuật ngữ verismo chưa có trong thuat-ngu.yml.'
  - cu: Nhà soạn nhạc Phần Lan, biểu tượng của bản sắc dân tộc Phần Lan. Giao hưởng của ông phát triển từ những mảnh nhỏ thành khối lớn như thiên nhiên Bắc Âu. Ông gần như ngừng sáng tác trong 30 năm cuối đời.
    moi: Nhà soạn nhạc Phần Lan, gắn chặt với bản sắc dân tộc Phần Lan (giai điệu Finlandia trở thành biểu tượng của khát vọng độc lập). Trong giao hưởng, ông bỏ khuôn hình thức quen thuộc và xây nhạc bằng biến tấu và lặp lại một chủ đề cơ bản. Ông gần như ngừng sáng tác trong 30 năm cuối đời.
    ly_do: 'j1, j2 (da-sua): Oxford/Baker: Finlandia (1899–1900) gắn với phong trào đòi tự chủ khỏi Nga; chữ mới nêu cụ thể và hạ "biểu tượng" về đúng đối tượng (Finlandia). so sánh "như thiên nhiên" là ẩn dụ không có nguồn; Oxford mô tả kỹ thuật phát triển chủ đề từ mảnh nhỏ và cấu trúc không theo khuôn sonata, nên viết mô tả kỹ thuật.'
  - cu: Người Pháp, mở ra chủ nghĩa ấn tượng trong âm nhạc với hòa âm mơ hồ và màu sắc âm thanh mới lạ.
    moi: Người Pháp, đại diện tiêu biểu của chủ nghĩa ấn tượng trong âm nhạc, với hệ thống hòa âm rất độc đáo và màu sắc âm thanh mới lạ.
    ly_do: 'de1 (da-sua): Oxford/Britannica: Debussy bị gọi là "impressionist" (và ông không thích nhãn này); "mở ra" là khẳng định mạnh, đổi "đại diện tiêu biểu"; "hòa âm mơ hồ" là mô tả chủ quan, đổi sang "hệ thống hòa âm rất độc đáo" (whole-tone, modal).'
  - cu: Nghệ sĩ piano và nhà soạn nhạc Nga, giữ phong cách Lãng mạn giữa thế kỷ 20. Ông rời Nga sau Cách mạng 1917 và sống phần lớn quãng đời còn lại ở Mỹ.
    moi: Nghệ sĩ piano và nhà soạn nhạc Nga, vẫn giữ phong cách Lãng mạn của cuối thế kỷ 19 sang tận thế kỷ 20. Ông rời Nga sau Cách mạng 1917 và lấy nước Mỹ làm nơi sống chính.
    ly_do: 'rc1, rc2 (da-sua): "giữa thế kỷ 20" không khớp: ông mất 1943 và các nguồn (Oxford/Gale) nói ông giữ phong cách Lãng mạn muộn của thế kỷ 19 đến đầu/giữa thế kỷ 20; chữ mới nói đúng mức. Oxford/Gale: rời Nga cuối 1917, sống ở Thụy Sĩ (Villa Senar, 1930s) và Mỹ (Beverly Hills, mất 1943 ở đó); "phần lớn" quá mức, đổi "lấy nước Mỹ làm nơi sống chính".'
  - cu: Thường được xếp cạnh Debussy, nhưng âm nhạc của Ravel sắc nét và chính xác hơn; ông là bậc thầy phối khí.
    moi: Thường được xếp cạnh Debussy, nhưng hai người khác nhau nhiều; âm nhạc của Ravel nổi tiếng chau chuốt, hoàn hảo về hình thức, và ông được xem là một trong những bậc thầy phối khí của thế kỷ 20.
    ly_do: 'ra2 (da-sua): "sắc nét và chính xác hơn" là so sánh không có nguồn; Britannica/Oxford: "master orchestrator", cầu kỳ về hình thức; hạ "bậc thầy" xuống "một trong những bậc thầy".'
  - cu: "Nhà soạn nhạc và nghệ sĩ piano Hungary, đồng thời là nhà dân tộc nhạc học: ông đi khắp các làng quê Đông Âu ghi âm hàng nghìn bài dân ca bằng máy ghi âm ống sáp. Âm nhạc của ông kết hợp tiết tấu dân gian với ngôn ngữ hiện đại. Ông mất trong cảnh nghèo khó ở New York."
    moi: "Nhà soạn nhạc và nghệ sĩ piano Hungary, đồng thời là nhà dân tộc nhạc học: ông đi khắp các làng quê Đông Âu ghi âm hàng nghìn bài dân ca bằng máy ghi âm ống sáp. Âm nhạc của ông kết hợp tiết tấu dân gian với ngôn ngữ hiện đại. Ông mất vì bệnh bạch cầu ở New York năm 1945, sau những năm cuối đời nhiều khó khăn."
    ly_do: 'ba4 (da-sua): Oxford/Britannica: mất 26/9/1945 vì leukaemia; khó khăn tài chính và bệnh có thật nhưng chữ "nghèo khó" tuyệt đối (ông nhận hỗ trợ từ ASCAP, Koussevitzky đặt hàng Concerto cho dàn nhạc), nên đổi "nhiều khó khăn" kèm nguyên nhân mất.'
  - cu: Nhà soạn nhạc Nga, sống ở phương Tây rồi trở về Liên Xô năm 1936. Âm nhạc vừa trữ tình vừa châm biếm, tiết tấu sắc nét. Ông mất cùng ngày với Stalin.
    moi: Nhà soạn nhạc Nga, sống ở phương Tây rồi chuyển hẳn về Liên Xô năm 1936. Âm nhạc vừa trữ tình vừa châm biếm, ngôn ngữ sắc sảo, dí dỏm. Ông mất cùng ngày với Stalin.
    ly_do: 'pr1, pr2 (da-sua): nguồn không thống nhất mốc: thăm Liên Xô 1927, chuyển dần 1933, định cư hẳn 1936 (Oxford/Kemp); "chuyển hẳn" gom cả diễn biến này vào đúng mốc định cư 1936. Chỗ chưa chắc, người giao quyết nếu muốn bỏ mốc. Oxford mô tả cả chất trữ tình, châm biếm ("grotesque"), dí dỏm; "tiết tấu sắc nét" thu hẹp.'
  - cu: Sáng tác dưới chế độ Xô viết, âm nhạc của ông vừa phải làm vừa lòng chính quyền vừa ẩn chứa sự châm biếm và đau đớn.
    moi: Sáng tác dưới chế độ Xô viết, nhiều tác phẩm của ông chịu chuẩn mực nghệ thuật do nhà nước áp đặt; âm nhạc của ông có cả châm biếm lẫn nỗi đau cá nhân.
    ly_do: 'sh1 (da-sua): chữ cũ khẳng định ý đồ ("vừa phải làm vừa lòng") chung cho mọi tác phẩm; Encyclopedia of World Biography/Kemp: bị phê phán 1936 (Pravda) và 1948, nhiều tác phẩm chịu chuẩn mực "socialist realism"; châm biếm và nỗi đau là nhận xét thường gặp.'
  - cu: Nhà soạn nhạc Anh quan trọng nhất thế kỷ 20, đặc biệt ở opera và nhạc thanh nhạc. Âm nhạc của ông thường nói về những người lạc loài trong cộng đồng.
    moi: Một trong những nhà soạn nhạc Anh lớn nhất thế kỷ 20, đặc biệt ở opera và nhạc thanh nhạc. Âm nhạc của ông thường nói về những người lạc loài trong cộng đồng.
    ly_do: 'br1 (da-sua): xếp hạng tuyệt đối không có nguồn (Elgar, Vaughan Williams, Tippett cũng lớn); Oxford: "among the leading British composers of the 20th century".'
  - moi: Đương đại
    ly_do: 'dd1 (da-sua): Trước đây bốn người này nằm dưới "Thế kỷ 20"; dữ liệu khóa đã xếp họ "Đương đại" (hồ sơ du-lieu/nha-soan-nhac). Đã thêm tiêu đề `## Đương đại { #duong-dai }` trước Pärt; câu mở và mục lục khớp. Chưa dùng chữ "còn sống" trong trang vì Pärt, Reich, Glass, Adams còn sống nhưng chữ sẽ lỗi thời; dữ liệu khóa dùng "sinh năm".; gl1, gl2 (da-sua): Gale/EWB: học với Boulanger 1964–66, còn với Shankar là cộng tác (phiên âm nhạc cho Chappaqua), nên "làm việc với". Chữ cũ có thêm: "là một trong những nhà soạn nhạc đương đại được nghe nhiều nhất". Đã bỏ: xếp hạng không kiểm được. Phần còn lại: Gale/EWB (Einstein on the Beach, Satyagraha, giao hưởng, nhạc phim).'
  - cu: "Một trong những người khai sinh chủ nghĩa tối giản ở Mỹ: các mẫu ngắn lặp lại, lệch pha dần, biến đổi rất chậm. Chịu ảnh hưởng của nhạc trống Tây Phi và gamelan Bali."
    moi: "Một trong những người khai sinh chủ nghĩa tối giản ở Mỹ: các mẫu ngắn lặp lại, lệch pha dần, biến đổi rất chậm. Ông từng học nhạc trống ở Ghana và gamelan Bali."
    ly_do: "re2 (da-sua): Gale ghi ông học trống ở Ghana (1970) và gamelan ở Seattle/Bali (1973–74); chữ mới nói đúng việc học, không khẳng định ảnh hưởng chung."
  - cu: Nhà soạn nhạc tối giản Mỹ, học với Nadia Boulanger ở Paris và với Ravi Shankar. Viết opera, giao hưởng, rất nhiều nhạc phim; là một trong những nhà soạn nhạc đương đại được nghe nhiều nhất.
    moi: Nhà soạn nhạc tối giản Mỹ, học với Nadia Boulanger ở Paris và làm việc với Ravi Shankar. Viết opera, giao hưởng, rất nhiều nhạc phim.
    ly_do: 'gl1 (da-sua): Glass "làm việc với" Ravi Shankar (không phải học), theo Britannica.'
  - cu: "Nhà soạn nhạc Mỹ, người đưa chủ nghĩa tối giản từ phòng thí nghiệm tiền phong ra sân khấu lớn: tiết tấu lặp lại dồn dập, hòa âm rực rỡ, quy mô giao hưởng. Ông nổi tiếng với các opera về đề tài thời sự (Nixon in China, Doctor Atomic) và những tác phẩm dàn nhạc đầy năng lượng."
    moi: "Nhà soạn nhạc Mỹ gắn với chủ nghĩa tối giản, kết hợp kỹ thuật lặp lại với những yếu tố biểu cảm kiểu tân Lãng mạn: tiết tấu lặp lại dồn dập, quy mô giao hưởng. Ông nổi tiếng với các opera về những sự kiện lịch sử gần đây (Nixon in China, Doctor Atomic) và những tác phẩm dàn nhạc đầy năng lượng."
    ly_do: 'ad1, ad2 (da-sua): "đưa ra sân khấu lớn" là khẳng định công lao không có nguồn; Britannica/NAC: kết hợp minimalism với biểu cảm tân Lãng mạn. Nixon in China (1987) và Doctor Atomic (2005) nói về sự kiện đã xảy ra (1972, 1945), nên "những sự kiện lịch sử gần đây".'
  - moi: "id: duong-dai"
    ly_do: 'dd1 (da-sua): Trước đây bốn người này nằm dưới "Thế kỷ 20"; dữ liệu khóa đã xếp họ "Đương đại" (hồ sơ du-lieu/nha-soan-nhac). Đã thêm tiêu đề `## Đương đại { #duong-dai }` trước Pärt; câu mở và mục lục khớp. Chưa dùng chữ "còn sống" trong trang vì Pärt, Reich, Glass, Adams còn sống nhưng chữ sẽ lỗi thời; dữ liệu khóa dùng "sinh năm". (thêm id duong-dai của tiêu đề mới)'
ghi_chu: 'Khuông nhạc: trang không có khối abc. Chưa có hồ sơ thuật ngữ (src/data/thuat-ngu.yml) cho: bè trầm lặp lại (ground bass), phức điệu, leitmotif, nhạc kịch (Musikdrama), verismo, tintinnabuli, tối giản, thơ giao hưởng. Nguồn mâu thuẫn: Beethoven bắt đầu điếc 1796 hay 1798 (giữ "khoảng 1798"); Prokofiev về Liên Xô 1927, 1933 hay 1936 (giữ "chuyển hẳn năm 1936"); Mozart "khoảng 600" tùy cách đếm. Chưa tìm được nguồn bậc 1–2 cho "tác phẩm Bach là nền tảng học hòa âm" (đã bỏ vế ấy) và "Chopin là nhà thơ của cây đàn piano" (đổi sang tone poet). Link "Nghe trước" trỏ 23 trang chưa chuyển (xem s5) và link cuối trang trỏ duong-dai, nu-nha-soan-nhac, viet-nam (xem s6). Mục Đương đại là mục mới; Pärt, Reich, Glass, Adams chuyển từ Thế kỷ 20 sang đó theo dữ liệu khóa (s3). Hồ sơ du-lieu/nha-soan-nhac/{part,reich,glass,adams} dặn sửa việc này.'
