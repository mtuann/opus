nhan_dinh:
  - id: s1
    cau: Chân dung ngắn của khoảng 37 nhà soạn nhạc nên biết, xếp theo thời kỳ và năm sinh. Mỗi người có vài tác phẩm gợi ý để bắt đầu. Bối cảnh của từng thời kỳ nằm ở trang Lịch sử (/opus/lich-su/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Kiểm trên src/content/docs/lich-su/nha-soan-nhac.md: đếm tiêu đề ### = 37 (Baroque 5, Cổ điển 3, Lãng mạn 16, Thế kỷ 20 9, Đương đại 4); mỗi mục có dòng "Nghe trước"; trong từng mục thời kỳ xếp theo năm sinh (đã đổi Mendelssohn 1809 lên trước Chopin 1810, thêm mục Đương đại, xem doi_chu); trang lich-su/index.md đã chuyển và đã khóa (có trong khoa.json) nên link /opus/lich-su/ đúng.'
  - id: s2
    cau: Tiêu đề 37 mục có tên và năm sinh–mất (hay "sinh 1935") khớp dữ liệu đã khóa src/data/nha-soan-nhac.yml.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: Khớp dữ liệu đã khóa, không kiểm lại năm. Kiểm thử npm test (namLechTrongChu, kiểm năm trong chữ trang lich-su/) kiểm các tiêu đề này. Mục nhập từ trang piano/nha-soan-nhac (ve-site đã khóa ở D4) trỏ vào 19 anchor của tiêu đề; xem s4.
  - id: s3
    cau: Các mục xếp theo thời kỳ (Baroque, Cổ điển, Lãng mạn, Thế kỷ 20, Đương đại), khớp trường thoi_ky của dữ liệu.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'So từng người với thoi_ky ở src/data/nha-soan-nhac.yml: Beethoven "Cổ điển/Lãng mạn" đặt ở Cổ điển; Sibelius "Lãng mạn/Thế kỷ 20" ở Lãng mạn; Pärt, Reich, Glass, Adams "Đương đại" nay ở mục Đương đại (trước đây trang cũ xếp họ dưới Thế kỷ 20; các hồ sơ du-lieu/nha-soan-nhac/{part,reich,glass,adams}.yml dặn lô chuyển trang này sửa theo).'
  - id: s4
    cau: 'Dòng "Nhạc cho piano: xem Nhà soạn nhạc cho piano" của 19 người trỏ tới /opus/piano/nha-soan-nhac/#<neo> (bach, handel, haydn, mozart, beethoven, schubert, mendelssohn, chopin, schumann, liszt, brahms, tchaikovsky, grieg, debussy, rachmaninoff, ravel, bartok, prokofiev, shostakovich).'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Điều lô trước yêu cầu giữ (kiem-dinh/piano/nha-soan-nhac.yml, câu về 19 anchor): trang này có đủ 19 tiêu đề ### với tên và năm đúng, id sinh bằng plugin id-cu (bỏ dấu, bỏ đ), nên anchor trên piano/nha-soan-nhac khớp: đã kiểm trong dist/lich-su/nha-soan-nhac/index.html (19/19 id có mặt) và trang piano/nha-soan-nhac đã khóa có link. Khớp, không lệch."
  - id: s5
    cau: Các link "Nghe trước" trỏ tới trang hướng dẫn nghe nghe-nhac/vivaldi-mua-xuan, bach-cello-1, haydn-94, mozart-40, mozart-nu-hoang-bong-dem, beethoven-5, beethoven-op132, schubert-erlkonig, schubert-ca-hoi, mendelssohn-violin, brahms-4, bizet-habanera, tchaikovsky-ho-thien-nga, dvorak-9-largo, rachmaninoff-2, ravel-bolero, stravinsky-sacre, shostakovich-5, part-spiegel và trang tác phẩm piano/tac-pham/bach-prelude-do, chopin-nocturne-op9-2, debussy-clair-de-lune.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Các trang đích chưa chuyển (chỉ nghe-nhac/bach-goldberg và fur-elise có ở site mới; chuẩn bị đợt 6): kiểm trên ../opus-zero/docs/: đủ 23 trang, tiêu đề đúng tác phẩm (ví dụ "Bach: Tổ khúc cello số 1, Prelude", "Haydn: Giao hưởng số 94 Surprise, chương 2"). Điều cần giữ ở đợt 6: mỗi trang nói về đúng tác phẩm tên ở link. Các link này tự thành link khi trang lên, trước đó hiện "sắp có".'
  - id: s6
    cau: 'Cuối trang: "Các nhà soạn nhạc đang sống khác: xem Âm nhạc hôm nay (/opus/lich-su/duong-dai/). Các nhà soạn nhạc nữ: xem trang riêng (/opus/lich-su/nu-nha-soan-nhac/). Nhà soạn nhạc Việt Nam: xem Nhạc cổ điển ở Việt Nam (/opus/lich-su/viet-nam/)."'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Ba trang đích chưa chuyển; kiểm ở ../opus-zero/docs/lich-su/: duong-dai.md ("Âm nhạc hôm nay"), nu-nha-soan-nhac.md ("Các nhà soạn nhạc nữ"), viet-nam.md ("Nhạc cổ điển ở Việt Nam") đều có. Điều cần giữ: duong-dai nói về nhà soạn nhạc đang sống; nu-nha-soan-nhac về nhà soạn nhạc nữ; viet-nam về nhạc cổ điển ở Việt Nam. Link tới lich-su/opera (Verdi: "Nhập môn opera") đã chuyển. Dòng này nay nằm dưới mục Đương đại, hợp với "đang sống".'
  - id: s7
    cau: 'Hình vòng đời nhà soạn nhạc (::hinh{ten="lifespans"}) và chú thích "Vòng đời các nhà soạn nhạc từ năm 1650 (thanh kéo dài đến nay: còn sống), màu theo thời kỳ. Các nhà soạn nhạc trước đó (Hildegard, Machaut, Josquin, Palestrina, Monteverdi…) xem ở bảng dòng thời gian và trang các thời kỳ."'
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Kiểm trong src/scripts/dong-thoi-gian.js (veVongDoi) và dist: hình dựng từ dữ liệu; người trước 1650 (chết ≤ 1660) không có trong hình, đúng danh sách ở chú thích; chữ "còn sống" tính theo năm build, không ghi cứng. Người trên hình gồm cả người không có mục ở trang này (Strozzi, Price, Boulanger, Hoàng Việt, Gubaidulina, Saariaho, Shaw, Clara Schumann, Fanny Mendelssohn): chú thích không hứa điều ngược lại. Link tới trang thời kỳ có ở site mới (lich-su/thoi-ky/*).'
  - id: m1
    cau: "Monteverdi (1567–1643): người đứng ở ranh giới Phục hưng và Baroque."
    loai: lich-su
    nguon:
      - ec-monteverdi
    ket_qua: dung
    ghi_chu: 'Baker/Encyclopedia of Europe: âm nhạc của ông "a primary force in the change in style and aesthetics that marked the transition from the Renaissance to the baroque".'
  - id: m2
    cau: Vở L'Orfeo (1607) của ông là một trong những opera đầu tiên và là vở sớm nhất còn được diễn thường xuyên.
    loai: lich-su
    nguon:
      - br-orfeo
      - ec-monteverdi
      - im-orfeo
    ket_qua: dung
    ghi_chu: "Britannica: La favola d'Orfeo (1607) là \"the first opera to maintain a place in the modern repertory\"; Encyclopedia.com: \"has long been considered the first great opera\"; IMSLP: SV 318, năm soạn 1607."
  - id: m3
    cau: Ông bảo vệ quan niệm âm nhạc phải phục vụ lời và cảm xúc, kể cả khi phải phá quy tắc hòa âm cũ.
    loai: lich-su
    nguon:
      - ec-monteverdi
    ket_qua: dung
    ghi_chu: 'Seconda prattica: "a new style in which the text of a poem dictated the character and form of the music"; Artusi chê ông ("harsh modernisms"); "Rigid rules of counterpoint were discarded in favor of a freer treatment of dissonance".'
  - id: m4
    cau: "Nghe trước: L'Orfeo; Vespro della Beata Vergine (1610); madrigal Lamento della ninfa."
    loai: ten
    nguon:
      - ec-monteverdi
      - im-orfeo
    ket_qua: dung
    ghi_chu: Vespers xuất bản 1610 (Baker); Lamento della ninfa trong tập madrigal thứ tám (1638), "hypnotic soprano's complaint, set over a repeated descending bass pattern".
  - id: p1
    cau: "Henry Purcell: một trong những nhà soạn nhạc Anh vĩ đại nhất, mất năm 36 tuổi."
    loai: lich-su
    nguon:
      - ec-purcell
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhà soạn nhạc Anh vĩ đại nhất trước thế kỷ 20, mất năm 36 tuổi." Chữ mới: "Một trong những nhà soạn nhạc Anh vĩ đại nhất, mất năm 36 tuổi." Lý do: Oxford ghi "among the greatest of Eng. composers" và nói ông "challenges" Byrd, Elgar, Britten cho danh hiệu lớn nhất; không có nguồn nào nói "trước thế kỷ 20". "Died at the age of 36" (Temperley).'
  - id: p2
    cau: Purcell là bậc thầy của bè trầm lặp lại (ground bass) và phổ nhạc cho tiếng Anh.
    loai: lich-su
    nguon:
      - ec-purcell
    ket_qua: dung
    ghi_chu: Ground bass là "one of Purcell's favorite procedures"; "a new standard of sensitivity to words and word-rhythms". "Bậc thầy" là diễn đạt của trang, nội dung đúng.
  - id: p3
    cau: "Nghe trước: Dido and Aeneas, aria When I am laid in earth; Music for the Funeral of Queen Mary; Rondeau trong Abdelazer (chủ đề Britten dùng cho Young Person's Guide)."
    loai: ten
    nguon:
      - ec-purcell
      - br-ypg
    ket_qua: dung
    ghi_chu: "Dido's Lament là aria nổi tiếng của Dido and Aeneas (Oxford); \"Queen Mary's Funeral Music, 1695\". Britannica: Britten lấy chủ đề từ \"stately rondeau from Abdelazer\" của Purcell (1946)."
  - id: v1
    cau: "Antonio Vivaldi (1678–1741): linh mục và nghệ sĩ violin người Venice, dạy nhạc nhiều năm tại một trại trẻ mồ côi nữ có dàn nhạc nổi tiếng."
    loai: lich-su
    nguon:
      - ec-vivaldi
    ket_qua: dung
    ghi_chu: 'Thụ phong linh mục 3/1703; maestro di violino ở Pio Ospedale della Pietà (trại trẻ mồ côi); dàn nhạc "achieved an international reputation". Ghi chú: một mục trong trang ghi năm sinh 1675, mục khác 1678 (dữ liệu khóa 1678).'
  - id: v2
    cau: Ông viết hơn 500 concerto và góp phần chuẩn hóa concerto ba chương (nhanh – chậm – nhanh).
    loai: lich-su
    nguon:
      - ec-vivaldi
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…và định hình thể loại concerto độc tấu ba chương (nhanh – chậm – nhanh)." Chữ mới: "…và góp phần chuẩn hóa concerto ba chương…". Lý do: Oxford/Gale: "over five hundred concertos"; "helped to standardize the three-movement concerto form" (không nói ông tạo ra); ông còn được ghi công "regularizing ritornello form".'
  - id: v3
    cau: "Nghe trước: Bốn Mùa; Concerto cho hai violin cung La thứ RV 522; Gloria RV 589."
    loai: danh-muc
    nguon:
      - ec-vivaldi
      - im-estro
      - im-gloria
    ket_qua: dung
    ghi_chu: "IMSLP: L'estro armonico Op.3 số 8 = Concerto for 2 Violins in A minor, RV 522 (in 1711); Gloria in D major RV 589 (khoảng 1713–17). Encyclopedia.com/Oxford ghi Gloria là \"RV 588\": đó là bản Gloria khác (RV 588); Gloria nổi tiếng là RV 589, IMSLP xác nhận."
  - id: b1
    cau: "J. S. Bach: nghệ sĩ organ bậc thầy, từ năm 1723 làm cantor (giám đốc âm nhạc) ở Leipzig suốt 27 năm cuối đời."
    loai: lich-su
    nguon:
      - ec-bach
      - ec-bach-od
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhạc sĩ organ và giám đốc âm nhạc nhà thờ ở Leipzig suốt 27 năm cuối đời." Chữ mới như trên. Lý do: chữ cũ mơ hồ (ông không là organist ở Leipzig); Baker: "elected to the post of cantor of the city of Leipzig" 22/4/1723, nhậm chức 31/5/1723, giữ đến hết đời (mất 28/7/1750: 27 năm); "master organist" (Baker), "famous as an org. virtuoso" (Oxford).'
  - id: b2
    cau: Bach là bậc thầy tuyệt đối của phức điệu và fugue.
    loai: lich-su
    nguon:
      - ec-bach
      - ec-bach-od
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ có thêm: "tác phẩm của ông là nền tảng học hòa âm và đối âm đến tận hôm nay". Đã bỏ vế ấy: không tìm được nguồn bậc 1–2 đọc được (Open Music Theory trang đầu không nhắc Bach). Vế còn lại: Gale "the ultimate expression of polyphony", Oxford "supreme achievement", Kunst der Fuge "an encyclopedia of fugues, canons".'
  - id: b3
    cau: Sinh thời ông nổi tiếng nhất với tài chơi organ, và rất ít tác phẩm của ông được in khi ông còn sống.
    loai: lich-su
    nguon:
      - ec-bach-od
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sinh thời ông được biết đến như một nghệ sĩ organ hơn là nhà soạn nhạc". Lý do: Oxford: "famous as an org. virtuoso", "fewer than a dozen of his works were printed before he died"; Baker thêm "it is historically incorrect to maintain that Bach was not appreciated by his contemporaries", nên so sánh "hơn là nhà soạn nhạc" bỏ.'
  - id: b4
    cau: Làn sóng "tái khám phá" Bach thường được tính từ năm 1829, khi Mendelssohn dàn dựng lại Thương khó theo Thánh Matthew.
    loai: lich-su
    nguon:
      - ec-bach-od
      - ec-bach
      - br-mendelssohn
      - ec-mendelssohn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "âm nhạc của ông được tái khám phá mạnh mẽ từ năm 1829 khi Mendelssohn dàn dựng…". Lý do: Oxford và Britannica coi buổi diễn 11/3/1829 ở Berlin là khởi đầu phong trào phục hưng Bach thế kỷ 19; Baker ghi đó là "conventional" và nhắc Mozart, Beethoven đã tập các prelude và fugue của Bach, nên viết "thường được tính".'
  - id: b5
    cau: "Nghe trước: Prelude cung Đô trưởng; Tổ khúc cello số 1; Brandenburg Concerto số 3; Thương khó theo Thánh Matthew."
    loai: ten
    nguon:
      - im-wtc1
      - im-cello1
      - im-bb3
      - ec-bach
    ket_qua: dung
    ghi_chu: "IMSLP: WTC quyển 1 BWV 846–869, Prelude và Fugue số 1 cung Đô trưởng BWV 846; Cello Suite số 1 cung Sol trưởng BWV 1007; Brandenburg số 3 cung Sol trưởng BWV 1048; Matthäuspassion trong danh mục Baker."
  - id: h1
    cau: "Handel (1685–1759): sinh ở Đức cùng năm với Bach, nhưng làm nên sự nghiệp ở London với opera Ý và sau đó là oratorio tiếng Anh."
    loai: lich-su
    nguon:
      - ec-handel
    ket_qua: dung
