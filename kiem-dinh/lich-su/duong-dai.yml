nhan_dinh:
- id: n1
  cau: 'Nhạc cổ điển không dừng lại ở Beethoven: các nhà soạn nhạc vẫn đang viết giao hưởng, opera, concerto, và nhiều tác phẩm mới được biểu diễn mỗi mùa diễn.'
  loai: lich-su
  nguon:
  - wiki-pulitzer-music
  ket_qua: dung
  ghi_chu: 'Khái quát; ví dụ: giao hưởng Picaflor (Pulitzer 2026), nhiều nhà soạn nhạc có opera (Adams, Adès). Giữ nguyên chữ trang cũ.'
- id: n2
  cau: 'Arvo Pärt (Estonia), sinh 1935: Spiegel im Spiegel, Fratres; phong cách "tintinnabuli": tĩnh lặng, như tiếng chuông.'
  loai: lich-su
  nguon:
  - wiki-part
  ket_qua: dung
  ghi_chu: 'Wikipedia: người Estonia, sinh 11/9/1935; kỹ thuật tintinnabuli do ông tạo ra; hai tác phẩm nằm trong số được chơi nhiều nhất. "Tĩnh lặng" là mô tả phong cách (nhận xét); tintinnabuli từ tintinnabulum (chuông). Năm sinh khớp dữ liệu.'
- id: n3
  cau: 'Steve Reich (Mỹ), sinh 1936: Music for 18 Musicians; một trong những người khai sinh chủ nghĩa tối giản.'
  loai: lich-su
  nguon:
  - wiki-reich
  ket_qua: dung
  ghi_chu: 'Wikipedia: "a pioneer of minimal music", Music for 18 Musicians (1974–76). Năm sinh khớp dữ liệu.'
- id: n4
  cau: 'Philip Glass (Mỹ), sinh 1937: Glassworks, nhạc phim The Hours; tối giản, mẫu lặp lại.'
  loai: lich-su
  nguon:
  - wiki-glass
  ket_qua: dung
  ghi_chu: 'Wikipedia: Glassworks (1982), The Hours (2002), "music with repetitive structures". Năm sinh khớp dữ liệu.'
- id: n5
  cau: 'John Adams (Mỹ), sinh 1947: Short Ride in a Fast Machine; tối giản và hậu tối giản; opera Nixon in China (1987).'
  loai: lich-su
  nguon:
  - wiki-adams
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Tối giản giàu năng lượng; opera Nixon in China". "Giàu năng lượng" là nhận xét không kiểm được; thay bằng "tối giản và hậu tối giản" (Wikipedia: "minimalist or post-minimalist") và năm 1987 của opera. Short Ride in a Fast Machine (1986) có trong Wikipedia.'
- id: n6
  cau: 'Kaija Saariaho (Phần Lan), 1952–2023: L''Amour de loin; chú trọng âm sắc, thường kết hợp điện tử.'
  loai: lich-su
  nguon:
  - wiki-saariaho
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Âm sắc tinh tế, kết hợp điện tử". "Tinh tế" là nhận xét; Wikipedia: thập niên 1980–90 nhấn mạnh âm sắc; nhạc thường kết hợp biểu diễn trực tiếp với điện tử. Opera 2000. Năm sinh–mất khớp dữ liệu (hồ sơ lich-su/opera cũng dẫn Wise Music).'
- id: n7
  cau: 'Max Richter (Anh/Đức), sinh 1966: On the Nature of Daylight, Vivaldi Recomposed; giao thoa giữa cổ điển, điện tử và nhạc phim.'
  loai: lich-su
  nguon:
  - wiki-richter
  ket_qua: dung
  ghi_chu: 'Wikipedia: nhà soạn nhạc Anh gốc Đức, On the Nature of Daylight (2004), Recomposed: Vivaldi – The Four Seasons (2012); thể loại gồm cổ điển đương đại, ambient, tối giản; dùng điện tử và có nhiều nhạc phim. "Giao thoa" là cách nói chung. Năm sinh khớp dữ liệu.'
- id: n8
  cau: 'Thomas Adès (Anh), sinh 1971: dàn nhạc Asyla (1997); opera The Tempest (2004).'
  loai: lich-su
  nguon:
  - wiki-ades
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Phức tạp, nhiều màu sắc" (nhận xét không kiểm được); thay bằng hai tác phẩm đã nêu ở cột "Nên nghe trước". Asyla là tác phẩm dàn nhạc (1997), The Tempest là opera (2004): đúng theo Wikipedia.'
- id: n9
  cau: 'Jessie Montgomery (Mỹ), sinh 1981: Strum; nhiều tác phẩm cho đàn dây, lấy chất liệu từ nhạc dân gian Mỹ.'
  loai: lich-su
  nguon:
  - wiki-montgomery
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đàn dây, ảnh hưởng từ nhạc dân gian và jazz". Wikipedia xác nhận đàn dây, Strum (2006, sửa 2012), và chất liệu dân gian Mỹ (bài của NYT về Banner); jazz chỉ xuất hiện qua một bài Fanfare 2019 được Wikipedia trích (swing, jam session), nên bỏ "jazz". Năm sinh khớp dữ liệu.'
- id: n10
  cau: 'Caroline Shaw (Mỹ), sinh 1982: Partita for 8 Voices; đoạt giải Pulitzer năm 2013 với tác phẩm này.'
  loai: lich-su
  nguon:
  - wiki-shaw
  ket_qua: dung
  ghi_chu: 'Wikipedia: giải Pulitzer Âm nhạc 2013 cho Partita for 8 Voices. Cùng nguồn đã dùng ở bản ghi dữ liệu shaw (đã khóa).'
- id: n11
  cau: 'Sofia Gubaidulina (Nga), 1931–2025: Offertorium, De profundis; mất tháng 3/2025; link các nhà soạn nhạc nữ.'
  loai: lich-su
  nguon:
  - wiki-gubaidulina
  - bachtrack-gub
  ket_qua: dung
  ghi_chu: 'Wikipedia: Offertorium (1980) là bước đột phá; De profundis (cho bayan); mất 13/3/2025 ở Appen. Bachtrack (đã mở): bản tin đề ngày 13/3/2025. Link /opus/lich-su/nu-nha-soan-nhac/ chưa chuyển: có ở ../opus-zero/docs/lich-su/nu-nha-soan-nhac.md (thuộc D8-L3, giữ đường dẫn).'
- id: n12
  cau: 'Cuộc thi Piano Quốc tế Chopin lần thứ 19 (Warsaw, tháng 10/2025): giải Nhất Eric Lu (Mỹ); giải Nhì Kevin Chen (Canada), giải Ba Zitong Wang (Trung Quốc).'
  loai: lich-su
  nguon:
  - chopin-result
  - wiki-chopin19
  ket_qua: dung
  ghi_chu: 'Viện Fryderyk Chopin (trang chính thức, đã mở): Nhất Eric Lu (USA), Nhì Kevin Chen (Canada), Ba Zitong Wang (China); vòng cuối kết thúc 20/10/2025. Vòng chính 2–23/10/2025 theo Wikipedia.'
- id: n13
  cau: Ban giám khảo cuộc thi Chopin 2025 do Garrick Ohlsson làm chủ tịch, có Đặng Thái Sơn.
  loai: lich-su
  nguon:
  - chopin-jury
  ket_qua: dung
  ghi_chu: 'Viện Fryderyk Chopin: 17 giám khảo, Ohlsson "chair person", Dang Thai Son là một trong số đó.'
- id: n14
  cau: Các vòng thi Chopin 2025 được phát trên kênh YouTube của Viện Fryderyk Chopin; cuộc thi tiếp theo dự kiến vào năm 2030.
  loai: lich-su
  nguon:
  - pianostreet-chopin
  - wiki-chopin19
  - wiki-chopin-comp
  ket_qua: da-sua
  ghi_chu: 'Piano Street: vòng sơ khảo xem trực tiếp trên kênh YouTube của Viện (@chopininstitute); không nói các vòng sau; Wikipedia (bài lần thứ 19): lần thứ 20 dự kiến 2030, bài về cuộc thi: 5 năm một lần từ 1955. Chữ trang cũ "Các vòng thi được phát trên kênh YouTube": chỉ kiểm được vòng sơ khảo; chưa chắc các vòng sau. Đã sửa phần cuối trang ("phát trực tiếp miễn phí trên YouTube" thành "nhiều cuộc thi phát trực tiếp trên mạng").'
- id: n15
  cau: 'Giải Pulitzer Âm nhạc (trao cho tác phẩm của nhà soạn nhạc Mỹ): 2024 Tyshawn Sorey, Adagio (for Wadada Leo Smith); 2025 Susie Ibarra, Sky Islands; 2026 Gabriela Lena Frank, Picaflor: A Future Myth.'
  loai: lich-su
  nguon:
  - wiki-pulitzer-music
  - hppr-sorey
  - wise-sorey
  - composersnow-ibarra
  - npr-frank
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ thiếu tên tác phẩm 2026; đã thêm Picaflor: A Future Myth. pulitzer.org chặn công cụ (Cloudflare); xác nhận qua nhà xuất bản (Wise Music), đài (WRTI/HPPR, NPR), Composers Now. Quy tắc giải: "distinguished musical composition by an American" (Wikipedia). Giải công bố tháng 5 hằng năm: ra_lai 2027-06.'
- id: n16
  cau: Sofia Gubaidulina, một trong những nhà soạn nhạc quan trọng nhất cuối thế kỷ 20, mất ngày 13/3/2025 ở tuổi 93.
  loai: lich-su
  nguon:
  - wiki-gubaidulina
  - bachtrack-gub
  ket_qua: dung
  ghi_chu: 'Wikipedia: mất 13/3/2025, 93 tuổi; Bachtrack cùng ngày. "Một trong những nhà soạn nhạc quan trọng nhất cuối thế kỷ 20" là đánh giá (Boosey & Hawkes gọi bà "the most important Russian composer", theo kết quả tìm kiếm, chưa mở): chưa chắc cho đánh giá, nên review xem có giữ.'
- id: n17
  cau: Đặng Thái Sơn là nghệ sĩ piano Việt Nam giành giải Nhất Cuộc thi Piano Quốc tế Chopin năm 1980, người châu Á đầu tiên đạt giải này.
  loai: lich-su
  nguon:
  - wiki-dts
  - wiki-chopin-comp
  ket_qua: dung
  ghi_chu: 'Wikipedia: giải Nhất lần thứ X (1980), "the first Asian to win a top international competition". Chưa mở nguồn bậc 2 (Viện Chopin: danh sách người thắng). Năm sinh 1958 khớp dữ liệu; hồ sơ bản ghi dang-thai-son (đã khóa) có nguồn bậc 2 cho năm sinh.'
- id: n18
  cau: Đặng Thái Sơn giảng dạy piano nhiều năm ở Canada và Mỹ, và là giám khảo cuộc thi Chopin năm 2025.
  loai: lich-su
  nguon:
  - wiki-dts
  - chopin-jury
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ông hiện là một trong những người thầy piano nổi tiếng thế giới, và là giám khảo cuộc thi Chopin năm 2025". "Nổi tiếng thế giới" không kiểm được; "hiện là" mau cũ (hồ sơ bản ghi: nghỉ hưu 2024 nhưng vẫn dạy). Wikipedia: Montréal khoảng 20 năm, Oberlin từ 2018, New England Conservatory từ 2020.'
- id: n19
  cau: Link nhạc cổ điển ở Việt Nam (/opus/lich-su/viet-nam/).
  loai: ve-site
  ket_qua: dung
  ghi_chu: Trang đích có ở src/content/docs/lich-su/viet-nam.md (cùng lô D8-L1).
- id: n20
  cau: 'Gramophone: tạp chí về nhạc cổ điển và các bản thu mới.'
  loai: lich-su
  nguon:
  - wiki-gramophone
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tạp chí lâu đời về nhạc cổ điển và các bản thu mới". Wikipedia: tạp chí hằng tháng, lập 1923, chuyên phê bình bản thu; gramophone.co.uk chặn công cụ đọc. Bỏ "lâu đời" (đánh giá); không có chữ sai.'
- id: n21
  cau: 'BBC Radio 3: đài phát nhạc cổ điển và hòa nhạc trực tiếp của BBC.'
  loai: lich-su
  nguon:
  - wiki-bbc3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "phát nhạc cổ điển và hòa nhạc trực tiếp mỗi ngày". Wikipedia: đài tập trung nhạc cổ điển và opera, phát BBC Proms; nghe trực tiếp qua BBC Sounds ở Anh. "Mỗi ngày" không kiểm được; bỏ. Chưa chắc: nghe trực tiếp ở nước ngoài có được không (bbc.co.uk chặn công cụ).'
- id: n22
  cau: 'Classic FM: đài phát thanh nhạc cổ điển của Anh, kèm tin tức và bài viết.'
  loai: lich-su
  nguon:
  - classicfm
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tin tức nhẹ nhàng, dễ đọc cho người mới" (nhận xét); trang chủ: đài radio của Global, tin tức, bài viết, video.'
- id: n23
  cau: 'Bachtrack: lịch biểu diễn khắp thế giới.'
  loai: lich-su
  nguon:
  - bachtrack
  ket_qua: dung
  ghi_chu: 'Trang chủ: listings của hòa nhạc, opera, ba lê… khắp thế giới, tìm theo địa điểm; cũng có phê bình và tin tức.'
- id: n24
  cau: 'Digital Concert Hall của Berliner Philharmoniker: xem hòa nhạc trực tuyến (thuê bao trả phí, có dùng thử miễn phí).'
  loai: lich-su
  nguon:
  - dch
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(có phí, có buổi miễn phí)". Trang chính thức: thuê bao 16,90 euro/tháng hoặc 169 euro/12 tháng; không có buổi miễn phí lâu dài; chỉ dùng thử miễn phí. Không ghi giá trên trang (mau cũ).'
- id: n25
  cau: 'Medici.tv: hòa nhạc và opera trực tuyến.'
  loai: lich-su
  nguon:
  - medici-koeln
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hòa nhạc, opera và các cuộc thi quốc tế". Nguồn đã mở (thư viện Köln): nhạc cổ điển, opera, ba lê, hòa nhạc trực tiếp; không nhắc cuộc thi; bỏ "các cuộc thi quốc tế". Trang chính medici.tv không mở được bằng công cụ (chưa chắc các chi tiết khác).'
- id: n26
  cau: Cuộc thi Piano Quốc tế Chopin (Warsaw), 5 năm một lần.
  loai: lich-su
  nguon:
  - wiki-chopin-comp
  ket_qua: dung
  ghi_chu: 'Wikipedia: từ 1927, 5 năm một lần từ 1955; chỉ chơi nhạc của Chopin. Khớp 2015, 2021 (hoãn từ 2020), 2025.'
- id: n27
  cau: 'Cuộc thi Quốc tế Tchaikovsky (Moscow): piano, violin, cello, thanh nhạc…'
  loai: lich-su
  nguon:
  - wiki-tchaik
  ket_qua: null
  ghi_chu: 'chưa chắc: Wikipedia (đã mở) xác nhận lập 1958, 4 năm một lần, ở Moskva và Sankt-Peterburg; danh sách bộ môn "piano, violin, cello, thanh nhạc…" không có trong phần đã đọc và trang chính thức tchaikovskycompetition.com không kết nối được. Chữ cũ giữ nguyên. Lượt 2 nên đọc trang chính thức (hay một nguồn bậc 2) cho bộ môn. Thông tin mau cũ: rà lại 6/2027.'
- id: n28
  cau: 'Cuộc thi Queen Elisabeth (Brussels): luân phiên violin, piano, cello, thanh nhạc.'
  loai: lich-su
  nguon:
  - qe-site
  ket_qua: dung
  ghi_chu: 'Trang chính thức: "the four disciplines alternate in a four-year cycle"; lịch hát 2027, violin 2028, piano 2029, cello 2030.'
- id: n29
  cau: Cuộc thi Piano Quốc tế Van Cliburn (Mỹ).
  loai: lich-su
  nguon:
  - wiki-cliburn
  - cliburn
  ket_qua: dung
  ghi_chu: Fort Worth, Texas; từ 1962; 4 năm một lần; kỳ gần nhất 2025 (Aristo Sham).
- id: n30
  cau: 'Các vòng thi thường được phát trực tiếp: nhiều cuộc thi phát trực tiếp các vòng thi trên mạng (cuộc thi Chopin phát trên kênh YouTube của Viện Fryderyk Chopin); đây là dịp hiếm để nghe cùng một tác phẩm qua nhiều cách diễn giải.'
  loai: lich-su
  nguon:
  - pianostreet-chopin
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Các vòng thi thường được phát trực tiếp miễn phí trên YouTube". Không tìm được nguồn cho "miễn phí" và "thường" ở mọi cuộc thi; Piano Street chỉ xác nhận cuộc thi Chopin có phát trực tiếp trên YouTube của Viện. Đánh giá "dịp hiếm" là lời khuyên.'
