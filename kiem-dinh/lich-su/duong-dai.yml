    moi: Đặng Thái Sơn là nghệ sĩ piano Việt Nam giành giải Nhất Cuộc thi Piano Quốc tế Chopin năm 1980, người châu Á đầu tiên đạt giải này. Ông giảng dạy piano nhiều năm ở Canada và Mỹ, và là giám khảo cuộc thi Chopin năm 2025. Xem thêm nhạc cổ điển ở Việt Nam.
    ly_do: '"Hiện là… nổi tiếng thế giới" không kiểm được và mau cũ; Wikipedia: Montréal, Oberlin, NEC.'
