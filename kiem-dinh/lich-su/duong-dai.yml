nhan_dinh:
  - id: n1
    cau: 'Nhạc cổ điển không dừng lại ở Beethoven: các nhà soạn nhạc vẫn đang viết giao hưởng, opera, concerto, và nhiều tác phẩm mới được biểu diễn mỗi mùa diễn.'
    loai: lich-su
    nguon:
      - wiki-pulitzer-music
    ket_qua: dung
    ghi_chu: 'Khái quát; ví dụ: giao hưởng Picaflor (Pulitzer 2026), nhiều nhà soạn nhạc có opera (Adams, Adès). Giữ nguyên chữ trang cũ.'
    luot_2: dung
    luot_2_nguon: [ "https://theviolinchannel.com/composer-gabriela-lena-frank-wins-2026-pulitzer-prize-for-music/", "https://en.wikipedia.org/wiki/Pulitzer_Prize_for_Music" ]
    luot_2_ghi_chu: "Nhiều nhà soạn nhạc đang sống vẫn viết giao hưởng, opera, concerto: ví dụ Gabriela Lena Frank, Picaflor (Dàn nhạc Philadelphia công diễn 13/3/2025, Pulitzer 2026); các nhà soạn nhạc nêu ở các câu sau. Câu mang tính khái quát, đúng."
  - id: n2
    cau: 'Arvo Pärt (Estonia), sinh 1935: Spiegel im Spiegel, Fratres; phong cách "tintinnabuli": tĩnh lặng, như tiếng chuông.'
    loai: lich-su
    nguon:
      - wiki-part
    ket_qua: dung
    ghi_chu: 'Wikipedia: người Estonia, sinh 11/9/1935; kỹ thuật tintinnabuli do ông tạo ra; hai tác phẩm nằm trong số được chơi nhiều nhất. "Tĩnh lặng" là mô tả phong cách (nhận xét); tintinnabuli từ tintinnabulum (chuông). Năm sinh khớp dữ liệu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.arvopart.ee/en/arvo-part/biography/", "https://en.wikipedia.org/wiki/Arvo_P%C3%A4rt" ]
    luot_2_ghi_chu: Pärt (Estonia), sinh 11/9/1935 ở Paide; tintinnabuli (chuông nhỏ) từ 1976; Fratres (1977) và Spiegel im Spiegel (1978) thuộc các bản đầu của phong cách này (Arvo Pärt Centre). 'Tĩnh lặng' là mô tả, không kiểm.
  - id: n3
    cau: 'Steve Reich (Mỹ), sinh 1936: Music for 18 Musicians; một trong những người khai sinh chủ nghĩa tối giản.'
    loai: lich-su
    nguon:
      - wiki-reich
    ket_qua: dung
    ghi_chu: 'Wikipedia: "a pioneer of minimal music", Music for 18 Musicians (1974–76). Năm sinh khớp dữ liệu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.boosey.com/composer/Steve+Reich", "https://en.wikipedia.org/wiki/Steve_Reich" ]
    luot_2_ghi_chu: "Steve Reich (Mỹ) sinh 1936 (Boosey, Wikipedia: 3/10/1936); Music for 18 Musicians soạn 1974–76; Wikipedia gọi ông là người tiên phong của nhạc tối giản giữa cuối thập niên 1960, cùng Drumming định hình trào lưu."
  - id: n4
    cau: 'Philip Glass (Mỹ), sinh 1937: Glassworks, nhạc phim The Hours; tối giản, mẫu lặp lại.'
    loai: lich-su
    nguon:
      - wiki-glass
    ket_qua: dung
    ghi_chu: 'Wikipedia: Glassworks (1982), The Hours (2002), "music with repetitive structures". Năm sinh khớp dữ liệu.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Philip_Glass", "https://www.philipglass.com/" ]
    luot_2_ghi_chu: Philip Glass (Mỹ) sinh 31/1/1937 (trang philipglass.com xác nhận gián tiếp qua sinh nhật 90 tuổi 31/1/2027); Glassworks (album 1982); nhạc phim The Hours (2002); gắn với tối giản, 'âm nhạc với cấu trúc lặp'. Phần chi tiết lấy từ Wikipedia (chỉ để định hướng).
  - id: n5
    cau: 'John Adams (Mỹ), sinh 1947: Short Ride in a Fast Machine; tối giản và hậu tối giản; opera Nixon in China (1987).'
    loai: lich-su
    nguon:
      - wiki-adams
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tối giản giàu năng lượng; opera Nixon in China". "Giàu năng lượng" là nhận xét không kiểm được; thay bằng "tối giản và hậu tối giản" (Wikipedia: "minimalist or post-minimalist") và năm 1987 của opera. Short Ride in a Fast Machine (1986) có trong Wikipedia. Review D8-gom: giữ. Lượt 2 đọc Boosey & Hawkes (nhà xuất bản của Adams): sinh 1947; hai tác phẩm và năm khớp. "Tối giản và hậu tối giản" là cách xếp loại phổ biến, thay nhận xét "giàu năng lượng".'
    luot_2: dung
    luot_2_nguon: [ "https://www.boosey.com/composer/John+Adams", "https://en.wikipedia.org/wiki/John_Adams_(composer)" ]
    luot_2_ghi_chu: John Adams sinh 1947 (Boosey); Short Ride in a Fast Machine (1986), opera Nixon in China (1987); thường xếp tối giản/hậu tối giản (Wikipedia).
    review: dung
  - id: n6
    cau: 'Kaija Saariaho (Phần Lan), 1952–2023: L''Amour de loin; chú trọng âm sắc, thường kết hợp điện tử.'
    loai: lich-su
    nguon:
      - wiki-saariaho
