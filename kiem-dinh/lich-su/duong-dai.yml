lan:
- so: 1
  ngay: '2026-11-05'
  nhanh: moi/d8-l1
  ma_bam: null
  nguoi:
    luot_1: Claude Sonnet (D8-L1 lượt 1, phần 2/2)
    luot_2: null
    review: null
    kiem_mau: null
ghi_chu: 'Trang tham chiếu có hạn (ra_lai 2027-06: giải Pulitzer Âm nhạc công bố tháng 5; tin và cuộc thi). Kiểm định lượt 1 ngày 05/11/2026, mọi nguồn truy cập ngày ấy. Đã giữ các mục trang khác dựa vào: "Âm nhạc hôm nay" (tiêu đề), "Một số nhà soạn nhạc nên nghe", "Tin đáng chú ý gần đây", "Tên tuổi Việt Nam nên biết", "Các cuộc thi lớn" (lich-su/index, thoi-ky/the-ky-20, piano/nha-soan-nhac). Mau cũ: kết quả Chopin 2025, Pulitzer 2024–2026 và Sofia Gubaidulina xác nhận bằng nguồn đã mở (Viện Chopin chính thức; Pulitzer qua nhà xuất bản và đài vì pulitzer.org chặn công cụ); các mô tả đài, tạp chí, dịch vụ trực tuyến đã sửa cho bền. Người giao cần biết: (1) nguồn của hầu hết tiểu sử nhà soạn nhạc là Wikipedia (bậc 3) vì trang nhà xuất bản/danh mục không mở được; năm sinh–mất khớp dữ liệu đã khóa; cột "Nên nghe trước" là gợi ý nghe (không phải nhận định cần nguồn). (2) "Một trong những nhà soạn nhạc quan trọng nhất cuối thế kỷ 20" (Gubaidulina) là đánh giá, để review quyết. (3) Link nu-nha-soan-nhac
  (D8-L3) chưa chuyển; có ở site cũ. (4) Tchaikovsky: chưa mở trang chính thức, bộ môn viết như trang cũ.'
