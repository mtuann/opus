khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: "Hai lần câu đầu Ah! vous dirai-je, maman ở Đô trưởng, M:4/4, L:1/4, K:C, hai khuông. Tay phải C C G G | A A G2 | F F E E | D D C2, hai lần, mỗi ô 4 phách; tay trái lần đầu [C,E,G,]4 cả bốn ô, lần sau I | IV–I | IV–I | V7–I (C,F,A,; B,,F,G,). Số ngón khớp bản của site (bài 2). Giai điệu khớp bài thật (Wikipedia Ah! vous dirai-je, Maman). Tám ô tổng cộng. Ô 3 lần đầu: Fa (F) trên hợp âm Đô: Fa cọ Mi như câu mô tả."
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: "Ode to Joy ở Sol trưởng, K:G (một thăng Fa♯), M:4/4. RH B B c d | d c B A | G G A B | B3/2 A/ A2: bậc 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3. 2 2 (khớp n về chuỗi bậc); không có dấu hóa lạ. LH [G,,B,,D,]4 | [F,,C,D,]4 | [G,,B,,D,]4 | I2 V7 2; F,, trong K:G là Fa♯ nên V7 = Fa♯–Đô–Rê (không có La). Bốn ô, ô cuối 4 phách (1,5+0,5+2)."
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: "Ode to Joy ở Fa trưởng, K:F (một giáng Si♭), M:4/4. RH A A B c | c B A G | F F G A | A3/2 G/ G2: bậc 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3. 2 2; nốt thứ ba của giai điệu là Si♭ (khớp mục 4). LH [F,,A,,C,]4 | [E,,B,,C,]4 | [F,,A,,C,]4 | I2 V7 2; V7 = Mi–Si♭–Đô (E,, B,, C,, với Si♭ theo khóa). Bốn ô đủ 4 phách."
doi_chu:
  - cu: "Khi đã quen giọng trưởng, thử Greensleeves (bài 7): giọng La thứ, chủ âm là La, và gần cuối câu có Sol♯ (ba dạng gam thứ). Rồi chọn những bài bạn thuộc từ nhỏ. Nhiều bài dân ca Việt Nam chỉ dùng năm nốt của gam ngũ cung; phím đàn cho bạn khung giai điệu, còn những chỗ luyến láy, nhấn nhá của giọng hát thì không chơi trọn được (Nhạc truyền thống Việt Nam)."
    moi: "Khi đã quen giọng trưởng, thử Greensleeves (bài 7): giọng La thứ, chủ âm là La, và gần cuối câu có Sol♯ (ba dạng gam thứ). Rồi chọn những bài bạn thuộc từ nhỏ. Nhiều bài dân ca Việt Nam xây trên thang năm âm, cùng cấu trúc khoảng cách với gam ngũ cung; phím đàn cho bạn khung giai điệu, còn độ cao các âm trong thang năm âm của người Việt không cố định như trên phím đàn, nên giọng hát không chơi trọn được (Nhạc truyền thống Việt Nam)."
    ly_do: "n19 và n20 (da-sua): viết lại theo Trần Thanh Hà và OMT Collections; bản cũ nói 'chỉ dùng năm nốt của gam ngũ cung' (không nguồn; nguồn nói thang năm âm của người Việt có độ cao không cố định) và 'luyến láy, nhấn nhá'."
  - cu: "Trước khi chạm phím, người chơi có kinh nghiệm đã nghe câu đầu trong đầu: đúng tốc độ, đúng sắc thái, đúng nốt đầu. Nhà giáo dục âm nhạc Edwin E. Gordon gọi khả năng nghe được âm nhạc khi nó không vang lên thật là audiation. Đó là nền của chơi theo tai, và cũng là thứ giữ bạn vững khi biểu diễn."
    moi: "Trước khi chạm phím, người chơi có kinh nghiệm đã nghe câu đầu trong đầu: đúng tốc độ, đúng sắc thái, đúng nốt đầu. Nhà giáo dục âm nhạc Edwin E. Gordon gọi khả năng nghe được âm nhạc khi nó không vang lên thật là audiation."
    ly_do: "n41 (da-sua): Wikipedia Gordon music learning theory không nói audiation là nền của chơi theo tai hay giữ bạn vững khi biểu diễn."
  - cu: "Edwin E. Gordon, Learning Sequences in Music: A Contemporary Music Learning Theory (GIA Publications): khái niệm audiation."
    moi: "Edwin E. Gordon, Learning Sequences in Music: A Contemporary Music Learning Theory (GIA Publications, 2007): khái niệm audiation."
    ly_do: "n41 (nguồn): thêm năm xuất bản 2007 theo Wikipedia."
  - cu:
      - "Open Music Theory: bậc trong gam, hợp âm chức năng."
      - 'Giai điệu: dân ca Pháp và Đức; thánh ca "New Britain"; Beethoven, Giao hưởng số 9; Dvořák, Giao hưởng số 9 (xem 10 bài đầu tiên). Ba khuông nhạc trên trang soạn cho trang này.'
    moi:
      - 'Trần Thanh Hà, "Thang năm âm người Việt dưới góc nhìn văn hóa học", Tạp chí Khoa học Xã hội, số 1 (173), 2013 (bản trực tuyến): thang năm âm trong nhạc truyền thống Việt Nam.'
      - "Open Music Theory, Collections: gam ngũ cung."
      - 'Giai điệu: dân ca Pháp, Đức và Anh (Greensleeves); thánh ca "New Britain"; Beethoven, Giao hưởng số 9; Dvořák, Giao hưởng số 9 (xem 10 bài đầu tiên). Ba khuông nhạc trên trang soạn cho trang này.'
    ly_do: "n41 (nguồn): thiếu Greensleeves (dân ca Anh) trong danh mục nguồn giai điệu."
