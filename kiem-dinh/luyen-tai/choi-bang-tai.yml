    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/" ]
    luot_2_ghi_chu: "Fa truong: bac 4 = Si♭; Ode to Joy co bac 4 (Fa trong Do truong) -> Si♭; o the Fa, ngon 4 vao Si♭. Dung."
  - id: n51
