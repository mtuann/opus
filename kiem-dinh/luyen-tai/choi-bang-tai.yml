    ma_bam: sha256:3795534176666118db2065560139a989b1eb7bda4cc19c3ab46327b6722cd401
    nguoi:
      luot_1: "Claude Sonnet 5.5 (D3-L6 lượt 1)"
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, nhóm C, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: "Trang chơi theo tai (tầng lõi). Nguồn: OMT Major Scales, Collections, Intervals, Seventh Chords; COD cadence; Wikipedia (Ah! vous dirai-je Maman, Hänschen klein, Frère Jacques, Amazing Grace, Au clair de la lune, Greensleeves, Dvořák 9, Gordon music learning theory; bậc 3); Trần Thanh Hà (thang năm âm); UCL IOE và nhà sách Canterbury (Lucy Green, Hear, Listen, Play!, OUP 2014). Bản nhạc: ba khuông soạn cho trang, kiểm bằng cách đọc nốt, nhịp, khóa, số ngón và hợp âm với bản của site (10-bai-dau-tien). Câu về site (bảng 'Nốt đầu', bước đệm, Hát lại, Chép giai điệu, Trí nhớ thính giác, vòng kết) kiểm trên các bản cũ ở ../opus-zero/docs/; hầu hết trang đích chưa chuyển (piano/*, luyen-tap/*, lich-su/*, nhan-dien/*). Câu giữ cho lô trước: Ode to Joy bắt đầu ở bậc 3 và 'ba nốt trầm Đô, Fa, Sol ... đủ cho mọi giai điệu trong bảng trên' (lo-trinh-choi trích): cả hai còn đúng theo bè trầm của site. Không kiểm được: nốt đầu của Largo 'Going Home' bản gốc (chỉ khớp bản Đô trưởng của site). Giai điệu thật của Hänschen klein, Frère Jacques, Amazing Grace, Ah vous dirai-je chỉ kiểm bằng Wikipedia (bậc 3), không có bản nhạc mở. Sửa trang: bỏ câu 'Đó là nền của chơi theo tai ...'; viết lại câu về dân ca Việt Nam và thang năm âm; thêm năm 2007 cho sách Gordon; thêm Greensleeves vào danh mục nguồn giai điệu. Thuật ngữ chưa có trong src/data/thuat-ngu.yml: chơi theo tai (playing by ear), audiation, bậc (scale degree), dịch giọng (transposition) nếu chưa có, hợp âm khối, bass Alberti, hình đệm, thế tay năm ngón, nốt lấy đà (pickup), gam ngũ cung."
