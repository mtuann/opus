  - id: n49
    cau: "Quiz: tay trái giữ Đô–Mi–Sol, giai điệu đến Fa nghe chói thì thử Fa (IV) hoặc Sol (V); Fa nằm trong IV (Fa–La–Đô) và V7 (Sol–Si–Rê–Fa)."
    loai: quy-tac
    nguon:
      - omt-seventh
      - omt-inversion
    ket_qua: dung
    ghi_chu: "Fa là nốt của IV và của V7; OMT Seventh Chords."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/", "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: IV = Fa La Do (Fa la goc), V7 = Sol Si Re Fa (Fa la bac 7). Dung. "Nghe choi" la y kien su pham.
  - id: n50
