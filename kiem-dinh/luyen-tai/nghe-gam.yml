    ly_do: 'n28, n30 (da-sua): bỏ các câu màu văn hóa, phong cách không nguồn (Trung Đông, Tây Ban Nha, flamenco, jazzy, dân gian).'
  - cu:
      - Bất ổn nhất, hiếm dùng.
      - "Ví dụ: nghe một gam thứ mà nốt Fa nghe cao bất thường (Fa♯ thay vì Fa) → đó là Dorian. Nghe gam trưởng mà nốt Si thấp bất thường (Si♭) → Mixolydian."
    moi:
      - "Bất ổn nhất: hợp âm ba trên chủ âm của nó là hợp âm giảm."
      - "Ví dụ: nghe một gam thứ từ La mà nốt Fa nghe cao bất thường (Fa♯ thay vì Fa) → đó là Dorian. Nghe một gam trưởng từ Đô mà nốt Si thấp bất thường (Si♭) → Mixolydian."
    ly_do: "n24 (da-sua): nêu lý do kiểm được.; n25 (da-sua): thêm gốc 'từ La', 'từ Đô' để khẳng định đúng."
  - cu: Gam ngũ cung chỉ có 5 nốt, không có nửa cung kề nhau. Nghe thoáng, trống trải, không căng thẳng — màu của nhạc dân gian nhiều nước (kể cả Việt Nam) và nhiều bản nhạc phim. Nếu nghe một gam mà không thấy chỗ nào "xít" (nửa cung), hãy nghĩ đến ngũ cung.
    moi: Gam ngũ cung chỉ có 5 nốt và không có nửa cung. Nghe thoáng, trống trải, không căng thẳng. Gam này có mặt trong nhạc của nhiều nơi trên thế giới, kể cả nhạc truyền thống Việt Nam. Nếu nghe một gam mà không thấy chỗ nào "xít" (nửa cung), hãy nghĩ đến ngũ cung (gam toàn cung, 6 nốt, cũng không có nửa cung).
    ly_do: "n30 và n28 (da-sua): các câu về màu văn hóa, flamenco, jazz, mức độ hiếm dùng và số bản nhạc không có nguồn; thay bằng OMT Collections và Trần Thanh Hà."
  - cu: "Bậc trong gam: nghe nốt lẻ và gọi tên bậc."
    moi: "Bậc trong gam (công cụ này chưa có phần ấy): nghe nốt lẻ trên đàn và gọi tên bậc."
    ly_do: "n37 (ve-site, da-sua): scale-trainer.js không có phần bậc."
