nhan_dinh:
  - id: n1
    cau: "Nghe gam là nghe \"bản đồ\" của một bài nhạc: nốt nào là nhà (chủ âm), đường đi có những bậc thang nào; nghe được gam thì đoán được nốt tiếp theo của giai điệu và biết bản nhạc ở giọng trưởng hay thứ."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Review D3-gom: câu trang cũ "và hiểu vì sao bản nhạc nghe vui hay buồn" (gán trưởng/thứ với vui/buồn) không kiểm được, đổi thành "và biết bản nhạc ở giọng trưởng hay thứ" (khớp mục Dấu hiệu vàng).'
  - id: n2
    cau: "Lý thuyết đầy đủ ở bài 6 (Gam trưởng), bài 7 (Gam thứ), bài 16 (Điệu thức và gam ngũ cung); bài luyện ở #luyen-voi-cong-cu."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Ba trang nhac-ly/06-gam-truong, 07-gam-thu, 16-dieu-thuc-ngu-cung đã chuyển; neo #luyen-voi-cong-cu có trong trang. Review: đã kiểm: ba bài nhac-ly/06-gam-truong, 07-gam-thu, 16-dieu-thuc-ngu-cung có trong src/content/docs/nhac-ly/; \"## Luyện với công cụ\" sinh id luyen-voi-cong-cu (bản xem dist/luyen-tai/nghe-gam/)."
    review: dung
  - id: n3
    cau: "Phân biệt trưởng hay thứ chỉ cần một nốt: bậc 3."
    loai: quy-tac
    nguon:
      - omt-minor
    ket_qua: dung
    ghi_chu: "OMT Minor Scales: gam thứ khác trưởng cùng chủ âm ở bậc 3 (và 6, 7); như n10 của D3-L1 (bậc 3 hạ có ở cả ba dạng gam thứ). 'Chỉ cần một nốt' đúng theo nghĩa bậc 3 đủ phân biệt."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/" ]
    luot_2_ghi_chu: "Bac 3 la not khac nhau chinh giua truong va thu (thu: ha bac 3 so voi truong, OMT minor-scales). Dung."
  - id: n4
    cau: "Bậc 3 cao (Mi trong giọng Đô) thì trưởng; bậc 3 thấp nửa cung (Mi♭) thì thứ."
    loai: quy-tac
    nguon:
      - omt-minor
    ket_qua: dung
    ghi_chu: "OMT Minor Scales."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: "Mi trong Do truong la 3 truong; Mi♭ thap nua cung la 3 thu (OMT: gam thu ha bac 3). Dung."
  - id: n5
    cau: "Nốt chủ là nốt nghe như 'nhà', thường là nốt kết."
    loai: dinh-nghia
    nguon:
      - omt-minor
    ket_qua: dung
    ghi_chu: "chưa chắc: 'chủ âm là nốt nghe như nhà' là cách nói thường gặp; riêng 'thường là nốt kết' không có đoạn nguồn mở được nói trực tiếp. Review D3-gom: đã mở OMT, Minor Scales: \"pieces often start and end on the tonic, so this can help you determine whether a work is major or minor\"; khớp \"thường là nốt kết\". \"Nghe như nhà\" là hình ảnh trong ngoặc, không phải nhận định riêng. Đổi nguồn sang omt-minor; dung."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: Chu am (tonic) la not "nha"/trung tam; thuong la not ket. Dung theo cach dung pho thong; OMT dung "tonic"/do.
  - id: n6
