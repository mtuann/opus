doi_chu:
  - cu: 'Nghe gam là nghe "bản đồ" của một bài nhạc: nốt nào là nhà (chủ âm), đường đi có những bậc thang nào. Nghe được gam thì đoán được nốt tiếp theo của giai điệu và hiểu vì sao bản nhạc nghe vui hay buồn.'
    moi: 'Nghe gam là nghe "bản đồ" của một bài nhạc: nốt nào là nhà (chủ âm), đường đi có những bậc thang nào. Nghe được gam thì đoán được nốt tiếp theo của giai điệu và biết bản nhạc ở giọng trưởng hay thứ.'
    ly_do: 'n1 (da-sua, review D3-gom): "vui hay buồn" không kiểm được.'
  - cu:
      - Nghe thuần "thứ", hơi cổ điển.
      - Thứ hòa thanh
    moi:
      - Nghe thuần "thứ".
      - Thứ hòa âm
    ly_do: 'n9 (da-sua): "Thứ hòa thanh" thành "Thứ hòa âm" theo quyết định thuật ngữ (README, 27/10/2026) và bài 7; bỏ "hơi cổ điển" (không nguồn).'
  - cu: 'Quãng Fa–Sol♯ là 2 tăng (3 nửa cung): nghe "gai", rất đặc trưng — màu Trung Đông / Tây Ban Nha.'
    moi: Quãng Fa–Sol♯ là 2 tăng (3 nửa cung), chỉ dạng này có. Nhiều người nghe quãng này "gai", dễ nhận.
    ly_do: 'n28, n30 (da-sua): bỏ các câu màu văn hóa, phong cách không nguồn (Trung Đông, Tây Ban Nha, flamenco, jazzy, dân gian).; n11 (da-sua, review D3-gom): "nghe gai, rất đặc trưng" là cảm giác; thành điều kiểm được (chỉ thứ hòa âm có 2 tăng) và lời gợi ý nghe (n42).'
  - cu: 'Mẹo: dấu hiệu 2 tăng (nghe như quãng 3 thứ nhưng "gai" hơn) gần như luôn có nghĩa là thứ hòa thanh. Đây là gam của vô số bản nhạc cổ điển viết ở giọng thứ khi cần át bảy (V7).'
    moi: "Mẹo: dấu hiệu 2 tăng (3 nửa cung, rộng bằng quãng 3 thứ nhưng nối hai bậc liền nhau) thường là dấu hiệu của thứ hòa âm. Sol♯ là nốt dẫn, nâng lên nửa cung để giọng thứ có hợp âm át bảy (V7) như giọng trưởng."
    ly_do: "n14 (da-sua): 'gần như luôn' quá mạnh; thêm lý do V7.; n14 (da-sua, review D3-gom): \"nghe như quãng 3 thứ nhưng gai hơn\" thành điều kiểm được."
  - cu: Thứ nhưng sáng hơn, jazzy.
