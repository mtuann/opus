    moi:
      - Tối nhất; hợp âm ba trên chủ âm của nó là hợp âm giảm.
      - "Ví dụ: nghe một gam thứ từ La mà nốt Fa nghe cao bất thường (Fa♯ thay vì Fa) → đó là Dorian. Nghe một gam trưởng từ Đô mà nốt Si thấp bất thường (Si♭) → Mixolydian."
      - Trong công cụ cuối bài, gợi ý dưới nút của mỗi điệu thức (Dorian, Phrygian, Lydian, Mixolydian) nêu đúng "một nốt khác biệt" này — hãy đọc gợi ý trước khi đoán.
    ly_do: "n24 (da-sua): nêu lý do kiểm được.; n25 (da-sua): thêm gốc 'từ La', 'từ Đô' để khẳng định đúng.; n24 (da-sua, review D3-gom): \"bất ổn nhất\" không có nguồn; OMT: \"The darkest mode is the locrian mode\".; n27 (da-sua, review D3-gom): chỉ nút điệu thức có gợi ý một nốt khác (src/scripts/luyen-tai.js, GOI_Y_GAM)."
  - cu: Gam ngũ cung chỉ có 5 nốt, không có nửa cung kề nhau. Nghe thoáng, trống trải, không căng thẳng — màu của nhạc dân gian nhiều nước (kể cả Việt Nam) và nhiều bản nhạc phim. Nếu nghe một gam mà không thấy chỗ nào "xít" (nửa cung), hãy nghĩ đến ngũ cung.
    moi: Gam ngũ cung thường gặp (như Đô – Rê – Mi – Sol – La) chỉ có 5 nốt và không có nửa cung, nên không có chỗ nào "xít"; nhiều người nghe thấy nó thoáng, trống trải. Gam này có mặt trong nhạc của nhiều nơi trên thế giới, kể cả nhạc truyền thống Việt Nam. Nếu nghe một gam mà không thấy chỗ nào "xít" (nửa cung), hãy nghĩ đến ngũ cung (gam toàn cung, 6 nốt, cũng không có nửa cung).
