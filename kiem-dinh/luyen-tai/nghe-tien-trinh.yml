    ghi_chu: "Wikipedia Pachelbel's Canon: bè trầm D A B F♯ G D G A; chuyển sang Đô: C G A E F C F G. Cũ: 'bass xuống bốn, lên hai lặp đi lặp lại (Đô – Sol – La – Mi – Fa – Đô – Fa – Sol), họ hàng gần của mẫu Romanesca'; mới nêu bước nhỏ và nguồn Gjerdingen. Bậc 3, dùng cùng OMT Diatonic Sequences ('Descending thirds, a.k.a. Pachelbel'). Review D3-gom: nguồn bậc 2 thay Wikipedia: Mount, FFF ch. 26, Example 26-6 (Pachelbel, Canon and Gigue in D major, P. 37, mm. 1–2): \"the order of harmonies (I–V–vi–iii–IV–I)\", các hợp âm ở thể gốc, nên bè trầm là nốt gốc D A B F♯ G D (giọng Đô: Đô – Sol – La – Mi – Fa – Đô; xuống quãng 4 rồi lên một bậc); OMT bản 1, Pachelbel's Canon schema: \"I – V – VI – III – IV – I – IV – V\" (hai hợp âm cuối IV – V: Fa – Sol); OMT, Diatonic Sequences: chuỗi quãng ba đi xuống còn gọi \"Pachelbel\". Cùng nguồn với bài 12 (n18, n19, review D3-gom nhóm A). Giữ."
