      - hop-am
    ket_qua: dung
    ghi_chu: "I–IV–V–I, M:4/4, L:1/2, K:C, hai khuông. Mỗi ô một hợp âm (nốt trắng kép = 4 phách): tay phải [EGc] [FAc] [DGB] [EGc], tay trái C, F, G, C,. Khớp bảng: nốt trầm Đô – Fa – Sol – Đô, mỗi hợp âm có gốc ở trầm. Ô nào cũng đủ 4 phách."
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - nhip
      - hop-am
    ket_qua: dung
    ghi_chu: "I–IV–I6/4–V–I. Ô 1: [EGc] trên C, rồi [FAc] trên F (mỗi hợp âm 2 phách); ô 2: [EGc] rồi [DGB], nhưng tay trái giữ G, nguyên ô (nốt trắng kép) nên hợp âm I trên trầm Sol là I6/4 và V chung nốt trầm Sol; ô 3: [EGc] trên C, (4 phách). Khớp lời mô tả ô 2 (E→D, c→B, G giữ)."
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - nhip
      - hop-am
    ket_qua: dung
    ghi_chu: "Vòng bè trầm Pachelbel ở Đô: bè trầm C, G,, A,, E,, F,, C,, F,, G,, (Đô Sol La Mi Fa Đô Fa Sol), mỗi hợp âm 2 phách, hai hợp âm một ô 4/4: C, G, Am, Em, F, C, F, G. Khớp mô tả Pachelbel và Wikipedia (D A B F♯ G D G A chuyển sang Đô). Mọi ô đủ 4 phách."
  - khoi: 4
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - nhip
      - hop-am
    ket_qua: dung
    ghi_chu: "Bốn kết nối tiếp, mỗi ô hai hợp âm: ô 1 [DGB]→[EGc] trên G, C, = V–I (kết trọn); ô 2 [FAc]→[EGc] trên F, C, = IV–I (plagal); ô 3 [DGB]→[CEc] trên G, A, = V–vi (kết lừa; [CEc] trên A là Am); ô 4 [EGc]→[DGB] trên C, G, = I–V (dừng ở V, kết nửa). Khớp thứ tự 'kết trọn, plagal, lừa, nửa' trong lời dẫn."
doi_chu:
  - cu:
      - "Trong đa số bản nhạc, nốt trầm nhất (bass) chính là gốc của hợp âm đang vang. Nghe được đường đi của bè trầm là nghe được tiến trình:"
      - Trầm đi Đô – Fa – Sol – Đô → tiến trình I – IV – V – I ở giọng Đô trưởng.
    moi:
      - "Nốt trầm nhất (bass) quyết định thể của hợp âm; khi hợp âm ở thể gốc, nốt trầm nhất chính là gốc của hợp âm đang vang. Nghe được đường đi của bè trầm là nghe được phần lớn tiến trình:"
      - Trầm đi Đô – Fa – Sol – Đô → thường là tiến trình I – IV – V – I ở giọng Đô trưởng.
    ly_do: "n4 (da-sua): thể đảo thì nốt trầm không phải gốc (OMT Inversion).; n6 (da-sua): thể đảo có thể làm bè trầm khác gốc.; n5 (da-sua): thể đảo làm bè trầm khác gốc."
  - cu: "Kỹ thuật: khi nghe, hạ tai xuống nốt thấp nhất. Hát nốt trầm lên, rồi hỏi nó là bậc mấy của giọng. Chuỗi các bậc trầm chính là tiến trình hòa âm."
    moi: "Kỹ thuật: khi nghe, hạ tai xuống nốt thấp nhất. Hát nốt trầm lên, rồi hỏi nó là bậc mấy của giọng. Chuỗi các bậc trầm cho bạn khung của tiến trình hòa âm (hợp âm ở thể đảo thì nốt trầm không phải gốc)."
