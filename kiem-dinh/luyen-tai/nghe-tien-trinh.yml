    ghi_chu: "OMT 6/4 Chords: cadential 6/4 là cách đệm thường gặp trước V cuối câu (phong cách Cổ điển). Review D3-gom: \"kết của rất nhiều bản Cổ điển\" là mức độ không có nguồn (OMT chỉ nói \"A common embellishment of the cadential V chord\", không nói phong cách hay số lượng). Chữ cũ: \"Kết của rất nhiều bản Cổ điển; tập ở…\". Chữ mới: \"Cách trang trí thường gặp của hợp âm V ở kết; tập ở…\". Cần lượt 2 bổ sung cho chữ mới. Review D3-gom (sau lượt 2 bổ sung): lượt 2 nêu OMT ghi hợp âm này là V6/4 vì nó trang trí V. Trang dùng nhãn I6/4 (cách đánh vần hợp âm), thống nhất với trang Kết ở mọi giọng (#i64-truoc-at-am) và các bài nhạc lý; ý \"trang trí V ở kết\" đúng theo OMT. Giữ nhãn; D3-L5 đợt sau có thể thêm mục Từ điển cadential 6/4 ghi cả hai cách."
