ghi_chu: "Trang nghe tiến trình hòa âm (tầng lõi). Nguồn: OMT Inversion, 6/4 Chords, Galant Schemas và bản tóm tắt, Diatonic Sequences; COD (cadence); Wikipedia Pachelbel's Canon (bậc 3, bè trầm); Gjerdingen (Romanesca và Pachelbel, chương 2 bản UCI). Câu về site: bản cũ piano/10-bai-dau-tien.md (Ode to Joy kết nửa rồi kết trọn), piano/hoa-am/ket.md (neo #i64-truoc-at-am, #ii6-va-v7-ket-ay-u), piano/hop-am-rai.md, piano/hoa-am/mau-galant.md, piano/tac-pham/bach-prelude-do.md, recognition.js (cadence trainer). Neo #luyen-voi-cong-cu viết {#luyen-voi-cong-cu} như lô trước yêu cầu. Chưa chuyển: piano/*, luyen-tap/nhat-ky, nhan-dien/*. Không kiểm được: cấu trúc câu của Mozart K. 2 (đã bỏ). Nguồn 'Gjerdingen' là sách, kiểm bằng chương 2 bản UCI (PDF). Thuật ngữ chưa có trong src/data/thuat-ngu.yml: bè trầm (bass line), thế gốc/thể đảo (inversion đã có), cadential 6/4, I6/4, ii6, V7, kết trọn (perfect cadence), kết plagal, kết lừa (deceptive), kết nửa (half cadence), Romanesca, Prinner, mẫu galant (galant schema), âm nền (pedal point), chuỗi quãng năm (sequence đã có), tiến trình hòa âm (chord progression), hợp âm rải; đã có: cadence, inversion, sequence, phrase."
