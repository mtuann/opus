  - id: n7
    cau: "Nốt trầm đứng yên ở Sol trong khi hợp âm bên trên đổi thường là I6/4 rồi V ngay trước kết."
    loai: quy-tac
    nguon:
      - omt-64
    ket_qua: dung
    ghi_chu: "OMT 6/4 Chords: cadential 6/4 làm hợp âm I thể 6/4 trước V, chung nốt trầm. Câu cũ đã có 'thường'. Review D3-gom: đã mở OMT, 6/4 Chords as Forms of Prolongation: cadential 6/4 là \"A common embellishment of the cadential V chord\", thay quãng 5 và 3 trên bè trầm của V bằng quãng 6 và 4 rồi về 5, 3 (tức bè trầm của V đứng yên); khớp \"thường là I6/4 rồi V ngay trước kết\". OMT ghi V6/4–5/3, site ghi I6/4 – V (cả hai cách ghi đều dùng; \"The cadential 6/4 resembles a I6/4 in its pitch content\"). Giữ dung."
    luot_2: khong-chac
    luot_2_ghi_chu: 'I6/4 -> V voi bass Sol dung yen truoc ket: dung theo ly thuyet cadential six-four, nhung chuong OMT ve "cadential six-four" khong mo duoc (loi). Chua co nguon da mo.'
