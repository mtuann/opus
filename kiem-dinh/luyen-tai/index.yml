doi_chu:
  - cu: Cách nhanh nhất để nhớ một quãng là gắn nó với hai nốt mở đầu của một bài hát bạn đã biết. Cột thứ ba dùng các giai điệu phổ biến; cột cuối lấy ví dụ từ những bài bạn tập trên site, ở 10 bài đầu tiên và các bài học tác phẩm. Hãy thay bằng bài bạn quen hơn.
    moi: Một cách dễ nhớ một quãng là gắn nó với hai nốt liền nhau ở đầu một bài hát bạn đã biết. Cột thứ ba dùng các giai điệu phổ biến; cột cuối lấy ví dụ từ những bài bạn tập trên site, ở 10 bài đầu tiên và các bài học tác phẩm. Hãy thay bằng bài bạn quen hơn.
    ly_do: "n18 (da-sua): 'hai nốt mở đầu' mơ hồ (mở đầu bài hay mở đầu câu)."
  - cu: "Mozart: Minuet Fa trưởng K. 2: Fa–La; Mozart: Sonata K. 545: Đô–Mi"
    moi: "Mozart: Sonata K. 545: Đô–Mi"
    ly_do: "n38 (da-bo): không kiểm được Fa–La của K. 2 trên bản nhạc mở."
