    ghi_chu: "Soundfly/MacEwan: Happy Birthday = 2 trưởng đi lên (hai chữ 'py' → 'birth')."
    luot_2: khong-chac
    luot_2_ghi_chu: "Không mở được bản nhạc Happy Birthday; hiểu biết chung: Hap-py BIRTH-day là Đô-Rê (2 trưởng đi lên)."
