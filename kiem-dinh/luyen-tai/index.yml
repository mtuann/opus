    ket_qua: dung
    ghi_chu: "Soundfly/MacEwan: Twinkle Twinkle = 5 đúng đi lên. Review D3-gom: phần quãng (Đô–Sol, từ \"kle\" sang \"twin\") dựa vào bản nhạc của chính site (bài 2 của 10-bai-dau-tien, khối abc \"C C G G\"; n35, ve-site), vì không mở được bản nhạc K. 265 bậc 1 (Mutopia chỉ có bản guitar, IMSLP PDF bị chặn) và MacEwan không dùng Twinkle. Điều cần nguồn ngoài là Twinkle Twinkle cùng giai điệu với Ah! vous dirai-je, maman: đã mở The Morgan Library & Museum (triển lãm Mozart, K. 265): Mozart dùng \"a melody by an unknown composer that was written around 1765\"; \"Today it is known as the beloved children's song\" (trang dẫn lời Twinkle Twinkle). Viết lại cau theo điều ấy, loai lich-su, nguồn morgan. Cần lượt 2 bổ sung."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/print/article/1941980" ]
    luot_2_ghi_chu: "Britannica: K. 265 dựa trên bài dân ca Pháp có cùng giai điệu Twinkle, Twinkle Little Star."
