    loai: so-lieu
    nguon:
      - soundfly
      - wiki-maria
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly và Wikipedia Maria (West Side Story song): tritone ở chủ đề chính. MacEwan lại xếp Maria vào 7 trưởng; theo hai nguồn kia và theo bản nhạc, tritone đúng. Đề nghị bỏ qua mâu thuẫn của MacEwan."
    luot_2: khong-chac
    luot_2_ghi_chu: Nhạc có bản quyền, chưa mở nguồn; Maria mở bằng tritone (hiểu biết chung).
  - id: n27
    cau: "5 đúng: Twinkle Twinkle Little Star (từ 'kle' đầu tiên sang 'twin' thứ hai)."
    loai: so-lieu
    nguon:
      - soundfly
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly/MacEwan: Twinkle Twinkle = 5 đúng đi lên."
    luot_2: khong-chac
    luot_2_ghi_chu: Chưa mở bản nhạc Twinkle; Đô-Đô-Sol-Sol, từ Đô sang Sol là 5 đúng (hiểu biết chung).
  - id: n28
    cau: "6 trưởng: My Bonnie Lies over the Ocean."
    loai: so-lieu
    nguon:
      - soundfly
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly/MacEwan: My Bonnie = 6 trưởng đi lên."
    luot_2: khong-chac
    luot_2_ghi_chu: "Mutopia không có My Bonnie; hiểu biết chung: Đô lên La = 6 trưởng."
  - id: n29
    cau: "8 đúng: Somewhere over the Rainbow."
    loai: so-lieu
    nguon:
      - soundfly
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly/MacEwan: Somewhere over the Rainbow = 8 đúng đi lên."
    luot_2: khong-chac
    luot_2_ghi_chu: Nhạc có bản quyền, chưa mở nguồn; Somewhere over the Rainbow mở bằng quãng 8 (hiểu biết chung).
  - id: n30
    cau: "Ode to Joy, nốt thứ hai sang nốt thứ ba: Mi–Fa (bài 3) là quãng 2 thứ."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Bản cũ bài 3: E E F G: Mi→Fa (bước thứ hai→thứ ba) = 1 nửa cung. Câu 'nốt thứ hai sang nốt thứ ba' đúng (Mi, Mi, Fa)."
  - id: n31
    cau: "Frère Jacques: Đô–Rê (bài 5) là quãng 2 trưởng."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Bản cũ bài 5: C D."
  - id: n32
    cau: "Greensleeves: La–Đô (bài 7) và Largo 'Going Home': Mi–Sol (bài 8) là quãng 3 thứ."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Bản cũ bài 7: nốt lấy đà A rồi c (La–Đô); bài 8: E rồi G (Mi–Sol). Cả hai bằng 3 nửa cung."
  - id: n33
    cau: "Mozart: Sonata K. 545: Đô–Mi là quãng 3 trưởng."
    loai: so-lieu
    nguon:
      - mutopia-mozart
    ket_qua: dung
    ghi_chu: "Mutopia K545-1 (LilyPond): 'c2 e4 g' = C5–E5, 4 nửa cung. Trang tac-pham/mozart-k545 chưa chuyển."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly" ]
    luot_2_ghi_chu: "Mutopia K545 chương 1: Đô5 (nốt trắng) rồi Mi5 = quãng 3 trưởng."
  - id: n34
    cau: "Amazing Grace, từ nốt lấy đà: Sol–Đô (bài 6) và Tchaikovsky: Bài ca Pháp cổ, từ nốt lấy đà: Rê–Sol, là quãng 4 đúng."
    loai: so-lieu
    nguon:
      - mutopia-tchai
      - wiki-amazing
    ket_qua: dung
    ghi_chu: "Mutopia Tchaikovsky Op. 39/16: nốt lấy đà d8 rồi g8 (Rê–Sol, 5 nửa cung); Amazing Grace: nốt lấy đà bậc 5 rồi bậc 1; bài 6 của site: G rồi c."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/Traditional/amazing-mutopia/amazing-mutopia.ly", "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly" ]
    luot_2_ghi_chu: 'Amazing Grace (Mutopia, Mi giáng trưởng): Si giáng4 lên Mi giáng5 = 4 đúng (5 lên 1). Old French Song (Mutopia, Sol thứ): nốt lấy đà Rê4 lên Sol4 = 4 đúng. "Bài 6" là câu về site, không kiểm.'
  - id: n35
    cau: "Ah! vous dirai-je, maman (bài 2): Đô–Sol là quãng 5 đúng."
    loai: so-lieu
    nguon:
      - wiki-ah-vous
      - omt-intervals
    ket_qua: dung
    ghi_chu: "Giai điệu thật C C G G; Đô–Sol = 7 nửa cung."
    luot_2: khong-chac
    luot_2_ghi_chu: Chưa mở được bản nhạc K265 (Mutopia chỉ có bản guitar nén); Ah! vous dirai-je mở Đô-Đô-Sol-Sol theo hiểu biết chung.
  - id: n36
    cau: "Chopin: Nocturne Op. 9 số 2, từ nốt lấy đà: Si♭–Sol là quãng 6 trưởng."
    loai: so-lieu
    nguon:
      - mutopia-chopin
      - omt-intervals
    ket_qua: dung
    ghi_chu: "Mutopia Chopin Op. 9/2: \\partial 8 bf8 rồi g'4.: Si♭4–Sol5, 9 nửa cung."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O9/chopin_nocturne_op9_n2/chopin_nocturne_op9_n2.ly" ]
    luot_2_ghi_chu: "Mutopia (Mi giáng trưởng, 12/8): nốt lấy đà Si giáng4 rồi Sol5 = 6 trưởng."
  - id: n37
    cau: "Các cột 'bài bạn tập trên site' trỏ tới 10-bai-dau-tien, mozart-k545, tchaikovsky-bai-ca-phap-co, chopin-nocturne-op9-2, fur-elise, minuet-sol."
