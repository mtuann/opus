    cau: "3 thứ: Greensleeves."
    loai: so-lieu
    nguon:
      - soundfly
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly/MacEwan: Greensleeves = 3 thứ đi lên."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/Traditional/GreensleevesAcc/GreensleevesAcc.ly" ]
    luot_2_ghi_chu: "Mutopia (Accordion, La thứ): nốt lấy đà La4 lên Đô5 = quãng 3 thứ."
