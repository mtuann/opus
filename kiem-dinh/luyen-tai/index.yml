    moi: Here Comes the Bride
    ly_do: 'n25 (da-sua, review D3-gom): bỏ "(hành khúc cưới của Wagner)", không có nguồn bậc 1–2 đã mở; n26, n29 (da-bo, review D3-gom): bỏ hai hàng 4 tăng / 5 giảm (Maria: nguồn mâu thuẫn, MacEwan xếp 7 trưởng) và 8 đúng (Somewhere over the Rainbow: chỉ nguồn bậc 3).'
