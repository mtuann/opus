    nguon:
      - soundfly
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly/MacEwan: Saints = 3 trưởng đi lên."
    luot_2: khong-chac
    luot_2_ghi_chu: Mutopia không có bài; nhớ Đô-Mi-Fa-Sol (3 trưởng) nhưng chưa mở nguồn.
  - id: n25
    cau: "4 đúng: Here Comes the Bride (hành khúc cưới của Wagner)."
    loai: so-lieu
    nguon:
      - soundfly
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly/MacEwan: Bridal Chorus = 4 đúng đi lên; Wagner (Lohengrin) là tác giả."
    luot_2: khong-chac
    luot_2_ghi_chu: Mutopia không có Lohengrin; Here Comes the Bride mở bằng quãng 4 đúng đi lên theo hiểu biết chung, chưa mở nguồn.
  - id: n26
