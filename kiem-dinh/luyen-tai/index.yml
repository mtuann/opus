lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-gom
    ma_bam: sha256:63136315997d842ef46fb62379cf007fff81f8ac56db91fc766b01fdcdb10408
    nguoi:
      luot_1: "Claude Sonnet 5.5 (D3-L6 lượt 1)"
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, nhóm C, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: "Trang chỉ mục Luyện tai (tầng khung). Hầu hết là câu về site (lộ trình, link, bảng bài tập): kiểm trên trang trong repo hay bản cũ ../opus-zero/docs/ và JavaScript cũ; giai điệu gợi nhớ kiểm bằng Soundfly và MacEwan (bậc 3), quãng của tác phẩm kiểm bằng Mutopia (K. 545, Tchaikovsky Op. 39/16, Chopin Op. 9/2). Câu giữ cho lô trước: bảng giai điệu gợi nhớ (có), câu 'Luyện tai hiệu quả nhất khi bạn phát ra âm thanh, không chỉ nghe' (bat-dau/bai-0 trích): còn nguyên. Trang trỏ tới nhiều trang chưa chuyển (piano/*, luyen-tap/*, nhan-dien/*, lich-su). Sửa trang: 'hai nốt mở đầu' thành 'hai nốt liền nhau ở đầu một bài hát'; bỏ K. 2 Fa–La; bỏ thông tin giá của ba công cụ khác. Không kiểm được: Largo 'Going Home' Mi–Sol theo bản gốc (chỉ bản của site); xung đột nguồn về Maria (MacEwan nói 7 trưởng, Soundfly và Wikipedia nói tritone). Thuật ngữ chưa có trong src/data/thuat-ngu.yml: ear training (luyện tai), quãng giai điệu, 2 thứ/2 trưởng/3 thứ/3 trưởng/4 đúng/tritone/5 đúng/6 trưởng/8 đúng, nốt lấy đà (pickup), chơi theo tai."
