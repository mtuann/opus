    ket_qua: dung
    ghi_chu: "Wikipedia Ear training (bậc 3): kỹ năng nhận ra cao độ, quãng, hợp âm, tiết tấu bằng tai."
    luot_2: dung
    luot_2_nguon: [ "https://www.tonegym.co/", "https://www.musictheory.net/exercises" ]
    luot_2_ghi_chu: "Luyện tai: nhận quãng, hợp âm, gam, tiết tấu bằng tai (ToneGym; musictheory.net có bài tai cho quãng, hợp âm, gam)."
