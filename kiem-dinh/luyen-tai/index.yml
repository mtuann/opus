nhan_dinh:
  - id: n1
    cau: "Luyện tai (ear training) là tập nhận ra bằng tai những gì ta học bằng mắt trong nhạc lý: quãng, hợp âm, gam, tiết tấu."
    loai: dinh-nghia
    nguon:
      - wiki-ear
    ket_qua: dung
    ghi_chu: "Wikipedia Ear training (bậc 3): kỹ năng nhận ra cao độ, quãng, hợp âm, tiết tấu bằng tai."
    luot_2: dung
    luot_2_nguon: [ "https://www.tonegym.co/", "https://www.musictheory.net/exercises" ]
    luot_2_ghi_chu: "Luyện tai: nhận quãng, hợp âm, gam, tiết tấu bằng tai (ToneGym; musictheory.net có bài tai cho quãng, hợp âm, gam)."
  - id: n2
    cau: "Luyện tai giúp bạn 'nghe ra' cấu trúc của nhạc cổ điển thay vì chỉ nghe thấy một khối âm thanh."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Hợp lý.
  - id: n3
    cau: "Lộ trình 6 bài: Nghe quãng, Nghe hợp âm, Nghe gam và điệu thức, Nghe tiết tấu, Nghe tiến trình hòa âm, Chơi theo tai bên phím đàn, theo thứ tự đó."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Sáu trang luyen-tai/* đã chuyển, đúng tên và thứ tự trong src/data/trang.yml."
  - id: n4
    cau: "Bài 1 nghe quãng là nền tảng của mọi thứ: nghe được quãng thì nghe được giai điệu."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Hợp lý, cách dạy phổ biến.
  - id: n5
    cau: "Nghe hợp âm có màu trưởng/thứ/giảm/tăng, nghe nốt trầm để đoán thể đảo, hợp âm bảy."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "nghe-hop-am: 'Bốn màu của hợp âm ba', 'Nghe nốt trầm để đoán thể đảo', 'Hợp âm bảy: năm sắc thái'."
  - id: n6
    cau: "Nghe gam: dấu hiệu nốt 3, ba dạng gam thứ, tìm 'một nốt khác biệt' của điệu thức, nghe bậc trong gam."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "nghe-gam có đủ bốn mục ấy."
  - id: n7
    cau: "Nghe tiết tấu: đoán nhịp qua phách mạnh, nhịp đơn/kép, gõ lại tiết tấu, syncopation."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "nghe-tiet-tau có đủ bốn mục ấy."
  - id: n8
    cau: "Nghe tiến trình hòa âm: nghe bè trầm, những tiến trình gặp khi tập đàn, bốn loại kết."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "nghe-tien-trinh có đủ ba mục ấy."
  - id: n9
    cau: "Chơi theo tai: tìm lại một giai điệu quen trên phím, đệm bằng I, IV, V, dịch sang Sol trưởng và Fa trưởng, nghe câu đầu trong đầu trước khi chơi."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "choi-bang-tai có đủ các mục 1 đến 5."
  - id: n10
    cau: "Bài 1, 2, 3 và 5 có công cụ luyện ngay trong trang: nhận biết quãng, hợp âm, gam và kết."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "nghe-quang (interval-trainer), nghe-hop-am (chord-trainer), nghe-gam (scale-trainer), nghe-tien-trinh (cadence-trainer) mỗi trang có công cụ; nghe-tiet-tau không có (đúng với 'bài 4')."
  - id: n11
    cau: "Bài 4 luyện với công cụ Tiết tấu và máy đếm nhịp; bài 6 làm ở đàn, kèm Hát lại và Chép giai điệu."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "luyen-tap/tiet-tau, metronome, hat-lai, chep-giai-dieu có ở bản cũ ../opus-zero/docs/luyen-tap/; chưa chuyển ('sắp có')."
  - id: n12
    cau: "Mỗi ngày 10 phút đều đặn hiệu quả hơn một buổi dài mỗi tuần."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập hợp lý (đều đặn tốt hơn dồn).
  - id: n13
    cau: "Luyện tai hiệu quả nhất khi bạn phát ra âm thanh, không chỉ nghe."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Câu giữ nguyên theo yêu cầu của bat-dau/bai-0 (trích)."
  - id: n14
    cau: "Hát lại chấm cao độ giọng hát của bạn qua micro."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "luyen-tap/hat-lai.md và pitch.js (cũ): phát một nốt hay quãng, đo cao độ qua micro, kim, ±50 cent."
  - id: n15
    cau: "Chơi theo luyện khớp cao độ theo thời gian thực."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "luyen-tap/choi-theo.md (cũ): chấm từng nốt qua micro hay MIDI."
  - id: n16
    cau: "Chép giai điệu luyện biến âm thanh thành nốt nhạc."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "luyen-tap/chep-giai-dieu.md (cũ)."
  - id: n17
    cau: "Bước tiếp theo là nghe kết cấu và phong cách: Luyện nghe nhận diện và Nghe mù."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "nhan-dien/luyen-nghe và nhan-dien/nghe-mu: giữ nguyên như lô trước yêu cầu; hai trang chưa chuyển."
  - id: n18
    cau: "Cách nhanh nhất để nhớ một quãng là gắn nó với hai nốt liền nhau ở đầu một bài hát đã biết."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Cũ: 'hai nốt mở đầu'; mới: 'hai nốt liền nhau ở đầu một bài hát' (đúng nghĩa cho quãng giai điệu)."
  - id: n19
    cau: "Cột thứ ba dùng các giai điệu phổ biến; cột cuối lấy ví dụ từ bài tập trên site."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Cột 3 và 4 của bảng; link tới 10-bai-dau-tien và tac-pham/*."
  - id: n20
    cau: "Quãng 2 thứ: 1 nửa cung; 2 trưởng: 2; 3 thứ: 3; 3 trưởng: 4; 4 đúng: 5; 4 tăng/5 giảm: 6; 5 đúng: 7; 6 trưởng: 9; 8 đúng: 12."
    loai: so-lieu
    nguon:
      - omt-intervals
    ket_qua: dung
    ghi_chu: "OMT Intervals, bảng số nửa cung."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: "OMT Intervals: m2=1, M2=2, m3=3, M3=4, P4=5, A4/d5=6, P5=7, M6=9, P8=12."
  - id: n21
    cau: "Giai điệu gợi nhớ 2 thứ: nhạc phim Jaws."
    loai: so-lieu
    nguon:
      - soundfly
      - macewan
    ket_qua: dung
    ghi_chu: "Soundfly và MacEwan xếp Jaws vào 2 thứ đi lên."
    luot_2: khong-chac
    luot_2_ghi_chu: Chưa mở được nguồn bậc 2 nêu mô-típ Jaws (nhạc có bản quyền); biết E-F nửa cung đi lên.
