    moi: 'Kỹ thuật: luôn tìm nốt trầm trước. Hát nốt trầm lên, rồi hỏi: đây có phải nốt "nhà" (gốc) không? Nếu nốt trầm nghe như muốn "rơi" về một nốt khác thấp hơn, thì nhiều khả năng đó là thể đảo.'
