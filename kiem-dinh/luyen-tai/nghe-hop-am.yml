    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Cũ: 'điều làm nên cảm xúc của nhạc cổ điển, nhạc phim và nhạc pop' (không có nguồn); mới bỏ vế 'làm nên cảm xúc'."
