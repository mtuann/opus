      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: "Trang nghe hợp âm (tầng lõi). Nguồn: OMT Triads, Inversion, Seventh Chords, 6/4 Chords; Mount ch. 19 (tritone trong V7); MT21C 23.3 (giảm bảy làm hợp âm bản lề). Câu về công cụ kiểm trên chord-trainer.js cũ: bộ 'Trưởng và thứ', '4 loại hợp âm ba', '5 loại hợp âm bảy'; chế độ 'Cùng lúc', 'Rải từng nốt', 'Rải rồi cùng lúc'; không có chế độ thể đảo. Câu 'chưa chắc' (ket_qua null): màu thể đảo, thứ bảy, giảm bảy. Tên 'arpeggio', 'block chord' không có ở chương OMT đã mở. Thuật ngữ chưa có trong src/data/thuat-ngu.yml: arpeggio (hợp âm rải), block chord (hợp âm chập), major/minor/diminished/augmented triad, seventh chord và năm loại (Maj7, át bảy, thứ bảy, nửa giảm, giảm bảy), thể gốc/thể đảo (inversion đã có), tritone, bậc (scale degree), cadential 6/4."
