doi_chu:
  - cu: 'Nghe hợp âm là nghe "màu" của một khối âm thanh: sáng hay tối, căng hay êm, muốn đứng yên hay muốn đi tiếp. Đây là kỹ năng để nghe ra hòa âm của một bản nhạc — điều làm nên cảm xúc của nhạc cổ điển, nhạc phim và nhạc pop.'
    moi: 'Nghe hợp âm là nghe "màu" của một khối âm thanh: sáng hay tối, căng hay êm, muốn đứng yên hay muốn đi tiếp. Đây là kỹ năng để nghe ra hòa âm của một bản nhạc — từ nhạc cổ điển đến nhạc phim và nhạc pop.'
    ly_do: "n2 (da-sua): 'điều làm nên cảm xúc' không có nguồn."
  - cu: Sáng, vui, vững chãi. Âm thanh "mặc định" của nhạc vui.
    moi: Sáng, vui, vững chãi.
    ly_do: "n6 (da-sua): 'mặc định của nhạc vui' không có nguồn."
  - cu: "Cùng một hợp âm Đô trưởng nhưng nốt trầm khác nhau thì nghe khác nhau:"
    moi: "Cùng một hợp âm Đô trưởng nhưng nốt trầm khác nhau thì nghe khác nhau. Hãy để ý cảm giác của từng thế; nhiều người nghe thấy như sau:"
    ly_do: "n19 (da-sua, review D3-gom): không có nguồn xếp độ vững của ba thế; viết rõ ba gạch đầu dòng là lời gợi ý nghe."
