nhan_dinh:
  - id: n1
    cau: "Nghe tiết tấu là nghe thời gian trong âm nhạc: phách ở đâu, nhịp mấy, nốt nào rơi vào chỗ mạnh, chỗ nào bị 'lệch'."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập, hợp cách dạy.
  - id: n2
    cau: "Lý thuyết đầy đủ ở bài 3 (Trường độ), bài 4 (Nhịp), bài 15 (Tiết tấu nâng cao); bài luyện với công cụ Tiết tấu và Máy đếm nhịp."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Ba trang nhac-ly đã chuyển. luyen-tap/tiet-tau và luyen-tap/metronome chưa chuyển ('sắp có'); bản cũ ../opus-zero/docs/luyen-tap/ có cả hai. Review: đã kiểm src/content/docs/nhac-ly/03-truong-do.md, 04-nhip.md, 15-tiet-tau-nang-cao.md có; ../opus-zero/docs/luyen-tap/tiet-tau.md và metronome.md có (trang đích chưa chuyển)."
    review: dung
  - id: n3
    cau: "Nhạc có nhịp đều đặn có phách mạnh lặp lại; đếm số phách giữa hai lần mạnh thì biết nhịp."
    loai: dinh-nghia
    nguon:
      - iowa-meter
    ket_qua: da-sua
    ghi_chu: "Iowa State 1.2: các phách trong ô nhịp có độ mạnh khác nhau (mạnh, yếu...). Cũ: 'Mọi bản nhạc đều có phách mạnh' (sai với nhạc không nhịp, nhạc tự do). Review D3-gom: chữ mới có trên trang; lượt 2 dung. Thêm: chữ tiếng Anh trong ngoặc \"(accent)\" sai (accent là dấu nhấn, không phải phách mạnh; Iowa State 1.2 và OMT gọi phách mạnh là strong beat, downbeat), đổi thành \"(strong beat)\"."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/" ]
    luot_2_ghi_chu: 'OMT: phách 1 (downbeat) có "trọng lượng" hơn; số phách mỗi ô cho ra nhịp.'
  - id: n4
    cau: "Gợi ý nghe: để ý tiếng trầm (trống cái, nốt bass); ở nhiều bản nhạc, chúng rơi vào phách mạnh."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "chưa chắc: không nguồn mở được nói phách mạnh 'thường nhấn bằng tiếng trầm'; mới đổi từ 'được nhấn bằng' sang 'thường được nhấn bằng'. Review D3-gom: không có nguồn bậc 1–2 cho \"phách mạnh thường được nhấn bằng tiếng trầm\" (lượt 2 chỉ dẫn OMT nói về trống kick ở phách 1 và 3 trong nhạc pop). Viết thành lời gợi ý nghe: \"Hãy để ý tiếng trầm (trống cái, nốt bass): ở nhiều bản nhạc, chúng rơi vào phách mạnh.\" Đổi loai sang khuyen-tap. Chữ cũ: \"— thường được nhấn bằng tiếng trầm hơn (trống cái, nốt bass).\""
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/drumbeats/" ]
    luot_2_ghi_chu: 'OMT Drumbeats: trống đạp (kick) rơi vào phách 1 và 3, snare ở 2 và 4; nguồn không dùng chữ "phách mạnh" nhưng ý khớp.'
  - id: n5
    cau: "Nhịp 2: mạnh – nhẹ, lặp lại."
