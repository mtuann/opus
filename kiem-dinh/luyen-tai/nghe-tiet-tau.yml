    luot_2_ghi_chu: Mẫu mạnh-nhẹ-vừa-nhẹ không được nguồn mở nêu nguyên văn; OMT chỉ có phách 1 nặng và backbeat 2, 4. Là cách dạy phổ biến nên ghi dung.
