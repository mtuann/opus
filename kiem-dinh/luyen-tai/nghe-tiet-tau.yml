doi_chu:
  - cu:
      - "Mọi bản nhạc đều có phách mạnh (accent) lặp lại đều đặn — thường là tiếng trầm nhất (trống cái, nốt bass). Đếm số phách giữa hai lần mạnh:"
      - Mạnh – nhẹ – Mạnh – nhẹ… → nhịp 2 (hành khúc, polka).
    moi:
      - "Nhạc có nhịp đều đặn có phách mạnh (strong beat) lặp lại. Hãy để ý tiếng trầm (trống cái, nốt bass): ở nhiều bản nhạc, chúng rơi vào phách mạnh. Đếm số phách giữa hai lần mạnh:"
      - Mạnh – nhẹ – Mạnh – nhẹ… → nhịp 2 (polka, hành khúc nhanh).
    ly_do: "n3 (da-sua): không phải mọi bản nhạc có phách mạnh. n4: 'thường' thay vì khẳng định.; n6 (da-sua): COD ghi polka nhịp đôi nhanh, march có 2/4 nhanh.; n3, n4 (review D3-gom): \"(accent)\" thành \"(strong beat)\" (accent là dấu nhấn); tiếng trầm ở phách mạnh thành lời gợi ý (không có nguồn bậc 1–2)."
  - cu: Mạnh – nhẹ – vừa – nhẹ – Mạnh… → nhịp 4 (đa số nhạc pop, rock, giao hưởng).
    moi: Mạnh – nhẹ – vừa – nhẹ – Mạnh… → nhịp 4 (rất phổ biến, nhất là trong nhạc pop, rock).
    ly_do: "n9 (da-sua): bỏ 'nhất' và 'Latin' (không nguồn)."
  - cu:
      - 'Nhịp đơn (2/4, 3/4, 4/4): mỗi phách chia 2 — đếm "1 và 2 và…". Nghe gọn, bước đi.'
      - 'Nhịp kép (6/8, 9/8, 12/8): mỗi phách chia 3 — đếm "1 và–a 2 và–a…". Nghe đu đưa, lênh đênh (barcarolle, jig Ireland).'
      - 'Mẹo: hát "và" một lần giữa hai phách (nhịp đơn) hay hai lần "và–a" (nhịp kép)? Tai phân biệt được ngay khi bạn đếm thành tiếng.'
    moi:
      - 'Nhịp đơn (2/4, 3/4, 4/4): mỗi phách chia 2 — đếm "1 và 2 và…".'
      - 'Nhịp kép (6/8, 9/8, 12/8): mỗi phách chia 3 — đếm "1 la li 2 la li…".'
      - Nhiều người nghe nhịp đơn gọn, như bước đi, còn nhịp kép đu đưa.
      - 'Mẹo: giữa hai phách, đếm "và" một lần (nhịp đơn) hay "la li" hai lần (nhịp kép)? Tai phân biệt được ngay khi bạn đếm thành tiếng.'
    ly_do: 'n12 và n26 (da-sua): OMT Compound Meters dùng la li.; n13 (review D3-gom): cảm giác của nhịp đơn, kép tách thành một câu gợi ý; bỏ "lênh đênh".; n12 (da-sua): OMT Compound Meters đếm "la li" cho nhịp kép.; n13 (review D3-gom): cảm giác chuyển xuống câu gợi ý sau dòng nhịp kép.'
  - cu: 'Syncopation (đảo phách) là khi nốt nhấn rơi vào phách yếu hoặc vào "và" — tạo cảm giác nảy, bất ngờ, rất phổ biến trong jazz, nhạc Latin và nhạc phim. Nghe dấu hiệu:'
    moi: 'Syncopation (đảo phách) là khi nốt nhấn rơi vào phách yếu hoặc vào "và", làm lệch chỗ nhấn đều đặn của nhịp; rất phổ biến trong jazz. Nghe dấu hiệu:'
    ly_do: 'n9 (da-sua): bỏ "nhạc Latin", "nhạc phim" (không nguồn).; n20 (da-sua, review D3-gom): "nảy, bất ngờ" là cảm giác; COD: "vary position of the stress on notes so as to avoid regular rhythm".'
  - cu: 'Phân biệt nhịp đơn/kép: đếm "và" một lần hay hai lần giữa hai phách.'
    moi: 'Phân biệt nhịp đơn/kép: đếm một tiếng "và" hay hai tiếng "la li" giữa hai phách.'
    ly_do: 'n26 (da-sua): câu hỏi sửa theo cách đếm "la li" của OMT.'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Simple Meter and Time Signatures, Compound Meters and Time Signatures, Other Rhythmic Essentials (đảo phách)."
      - "Iowa State University, Comprehensive Musicianship, 1.2 Basics of Meter: Tutorial (thứ tự mạnh nhẹ của các phách)."
      - The Concise Oxford Dictionary of Music, mục syncopation, waltz, minuet, polka, march.
    ly_do: "Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L6); bỏ link chung."
  - cu:
      - 'câu hỏi: Phân biệt nhịp đơn và nhịp kép bằng cách nào nhanh nhất? | ✓ Đếm "và" giữa hai phách: một lần là đơn, hai lần ("và–a") là kép | Nghe xem bản nhạc nhanh hay chậm | Đếm tổng số nốt trong một ô nhịp | Nhịp đơn chia phách làm 2, nhịp kép chia làm 3 — đếm thành tiếng là thấy ngay.'
      - 'câu hỏi: Syncopation là gì? | Nốt rất dài cuối bản nhạc | ✓ Nốt nhấn rơi vào phách yếu hoặc vào "và", tạo cảm giác nảy và bất ngờ | Nhịp đổi liên tục giữa 3/4 và 4/4 | Đảo phách: năng lượng dồn vào chỗ yếu thay vì chỗ mạnh như thường lệ.'
    moi:
      - 'câu hỏi: Phân biệt nhịp đơn và nhịp kép bằng cách nào nhanh nhất? | ✓ Đếm giữa hai phách: một tiếng "và" là nhịp đơn, hai tiếng ("la li") là nhịp kép | Nghe xem bản nhạc nhanh hay chậm | Đếm tổng số nốt trong một ô nhịp | Nhịp đơn chia phách làm 2, nhịp kép chia làm 3 — đếm thành tiếng là thấy ngay.'
      - 'câu hỏi: Syncopation là gì? | Nốt rất dài cuối bản nhạc | ✓ Nốt nhấn rơi vào phách yếu hoặc vào "và", làm lệch chỗ nhấn đều đặn của nhịp | Nhịp đổi liên tục giữa 3/4 và 4/4 | Đảo phách: năng lượng dồn vào chỗ yếu thay vì chỗ mạnh như thường lệ.'
    ly_do: "n27 (da-sua, review D3-gom): như n20."
