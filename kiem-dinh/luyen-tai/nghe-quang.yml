  - id: n7
    cau: "Gợi ý nghe: nhiều người nghe các quãng đúng vang, rỗng, vững chãi; quãng 4 đúng hơi lửng lơ, muốn đi tiếp."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "chưa chắc: các tính từ là cảm nhận chủ quan. OMT Species Counterpoint chỉ xác nhận phần cấu trúc (quãng 1, 5, 8 là consonance hoàn hảo; quãng 4 đúng được xếp riêng); không nguồn nào mở được gán 'vang, rỗng' hay 'trống'. Review D3-gom: các tính từ là cảm giác, không nguồn nào gán (OMT chỉ xếp loại thuận/nghịch). Chuyển thành lời gợi ý nghe rõ là gợi ý, đổi loai sang khuyen-tap; bỏ vế \"quãng 5 đúng nghe trống một cách đẹp đẽ\". Chữ cũ: \"Vang, rỗng, vững chãi. Quãng 5 đúng nghe \"trống\" một cách đẹp đẽ; quãng 4 đúng nghe hơi lửng lơ, muốn đi tiếp.\" Chữ mới: \"Nhiều người nghe thấy vang, rỗng, vững chãi; quãng 4 đúng hơi lửng lơ, muốn đi tiếp.\" Vế quãng 4 không trái trang lõi (bài 9: quãng 4 đúng nghịch khi có bè trầm)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Quang dung la quang hoan hao; "vang, rong, vung chai", "lung lo" la cam nhan; khong co nguon dinh luong.
