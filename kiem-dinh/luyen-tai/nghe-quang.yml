doi_chu:
  - cu: Vang, rỗng, vững chãi. Quãng 5 đúng nghe "trống" một cách đẹp đẽ; quãng 4 đúng nghe hơi lửng lơ, muốn đi tiếp.
    moi: Nhiều người nghe thấy vang, rỗng, vững chãi; quãng 4 đúng hơi lửng lơ, muốn đi tiếp.
    ly_do: 'n7 (da-sua, review D3-gom): cảm giác thành lời gợi ý nghe; bỏ "trống một cách đẹp đẽ".'
  - cu: 'Có "màu": trưởng sáng, thứ tối. Đây là nhóm quyết định cảm xúc của giai điệu và hợp âm.'
    moi: 'Có "màu": trưởng sáng, thứ tối.'
    ly_do: "n10 (da-bo): vế 'quyết định cảm xúc' không có nguồn."
  - cu: Căng, xít nhau (quãng 2) hoặc chênh vênh (quãng 7); tai muốn chúng "giải quyết" về quãng gần nhất.
    moi: Căng, xít nhau (quãng 2) hoặc chênh vênh (quãng 7); đây là các quãng nghịch, tai muốn chúng "giải quyết" sang quãng êm hơn.
    ly_do: "n12 (da-sua): theo OMT Species Counterpoint, quãng 2 và 7 là quãng nghịch; 'gần nhất' không có nguồn."
  - cu: Căng nhất, chia đôi quãng tám (6 nửa cung). Nghe gai gai, bất ổn — dấu hiệu của át bảy (V7).
    moi: Căng, chia đôi quãng tám (6 nửa cung). Nghe gai gai, bất ổn — có mặt trong hợp âm át bảy (V7).
    ly_do: "n16 (da-sua): 'căng nhất' là so sánh không nguồn; 'dấu hiệu của át bảy' thành 'có mặt trong V7' (Mount ch. 19)."
  - cu: 4. Gắn với giai điệu quen thuộc. Mỗi quãng có ít nhất một bài hát mở đầu bằng nó — xem bảng ở trang Luyện tai. Khi phân vân giữa 4 đúng và 5 đúng, hát thầm "Here Comes the Bride" (4 đúng) rồi "Twinkle Twinkle" (5 đúng), cái nào khớp thì đó là đáp án.
    moi: 4. Gắn với giai điệu quen thuộc. Nhiều quãng có một bài hát quen gợi nhớ — xem bảng ở trang Luyện tai. Khi phân vân giữa 4 đúng và 5 đúng, hát thầm "Here Comes the Bride" (4 đúng) rồi "Twinkle Twinkle" (5 đúng), cái nào khớp thì đó là đáp án.
    ly_do: "n21 (ve-site, da-sua): chính bảng ở trang Luyện tai không có bài cho 6 thứ, 7 thứ và 7 trưởng."
  - cu: Thêm 3 thứ, 6 trưởng, 4 đúng (bộ Cơ bản).
    moi: Thêm 3 thứ và 4 đúng (bộ Cơ bản).
    ly_do: "n24 (ve-site, da-sua): bộ Cơ bản của công cụ là 3 thứ và 4 đúng; 6 trưởng ở bộ Mở rộng."
  - cu: Cuối cùng mới thêm 2 thứ/trưởng, 7 thứ/trưởng và tritone (bộ Mở rộng).
    moi: "Thêm 2 trưởng và 6 trưởng (bộ Mở rộng), rồi chọn Tất cả 12 quãng để gặp nốt các quãng còn lại: 2 thứ, 6 thứ, 7 thứ, 7 trưởng và tritone."
    ly_do: "n26 (ve-site, da-sua): theo interval-trainer.js, 2 thứ chỉ có ở 'Tất cả 12 quãng'."
  - cu: Open Music Theory; musictheory.net.
    moi: "Open Music Theory: Intervals (tên, số nửa cung, tritone); Species Counterpoint (quãng nghịch)."
    ly_do: "Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L6); bỏ link chung."
