    ket_qua: dung
    ghi_chu: "Soundfly và MacEwan Intro to Ear Training đều xếp 'Here Comes the Bride' vào 4 đúng đi lên và 'Twinkle Twinkle' vào 5 đúng đi lên; trùng bảng ở luyen-tai/index. Review D3-gom: đã mở MacEwan, An Introduction to Ear Training (Devin Hart, MacEwan Open Books, giáo trình mở, Appendix B, 8.1): \"Here Comes the Bride\" ở 4 đúng đi lên; đổi bậc nguồn macewan thành 2 (giáo trình mở của trường đại học). Twinkle Twinkle: MacEwan không dùng; The Morgan Library & Museum (K. 265): giai điệu Mozart dùng \"Today it is known as the beloved children's song\" (Twinkle Twinkle); quãng Đô–Sol theo bản nhạc của site (10-bai-dau-tien cũ, bài 2, \"C C G G\"). Giữ dung."
    luot_2: khong-chac
