ghi_chu: "Trang nghe quãng (tầng lõi). Nguồn: OMT (Intervals, Species Counterpoint, Intro to Diatonic Modes, Triads, Minor Scales), Mount ch. 19 (V7), Soundfly và MacEwan (bài hát gợi nhớ, bậc 3). Câu về công cụ kiểm trên interval-trainer.js cũ (../opus-zero/docs/assets/js/): bộ Khởi động/Cơ bản/Mở rộng/Tất cả 12 quãng; kiểu lần lượt đi lên, đi xuống, cùng lúc. Sửa trang (xem doi_chu): bộ Cơ bản và Mở rộng trong lộ trình; 'quãng 2 và 7'; tritone; đáp án nhiễu quiz; câu bài hát gợi nhớ. Phần 'Nguồn' cuối trang: bỏ link chung musictheory.net, ghi đúng chương OMT đã mở. Lưu ý cho người giao: kiem-dinh/piano/lo-trinh.yml n15 viết 'quãng 2 ở bộ cuối Mở rộng' nhưng bộ Mở rộng chỉ có 2 trưởng; 2 thứ chỉ có ở 'Tất cả 12 quãng'. Neo #luyen-voi-cong-cu và câu 'Mỗi ngày 10 phút đều đặn hiệu quả hơn một buổi 1 tiếng mỗi tuần' (moi-ngay n7 trích) còn nguyên. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có: tritone, quãng đúng (perfect interval), quãng trưởng/thứ, quãng tăng/giảm, bậc (scale degree), quãng nghịch (đã có dissonance), arpeggio không dùng ở trang này."
