    link: https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
  - id: abrsm-1920
    bac: 2
    ten: ABRSM, Piano Syllabus 2019 & 2020 (bản đầy đủ; bản lưu của us.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf)
    link: https://web.archive.org/web/2021/https://us.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf
nhan_dinh:
  - id: n1
    cau: Chặng 7 (Sau Grade 8) ứng với trình độ sau ABRSM Grade 8, từ diploma trở lên (grade_tu 9, grade_den 9).
    loai: cap-do
    truong:
      - nhan_grade
      - tuong_duong
      - grade_tu
      - grade_den
    nguon:
      - abrsm-piano
      - abrsm-2526
      - abrsm-1920
    ket_qua: dung
    ghi_chu: "Nhãn \"Sau Grade 8\" (nhan_grade) và \"diploma trở lên\" (tuong_duong) khớp grade_tu = grade_den = 9: ABRSM đi tiếp từ Grade 8 sang các diploma (ARSM, DipABRSM, LRSM, FRSM). Quy ước của site: grade_tu và grade_den = 0 là trước Grade 1 (gồm Initial Grade), 9 là sau Grade 8 (diploma); mỗi chặng bắt đầu ngay sau chặng trước. ABRSM, trang Piano (bản lưu 13/11/2025): \"Face-to-face Practical Grades and digital Performance Grades are available from Initial Grade to Grade 8\" và \"For advanced pianists we offer ARSM, LRSM and FRSM diplomas in Music Performance\". ABRSM Piano Practical Grades 2025 & 2026 (mục \"Progression route\"): \"ABRSM Practical Music qualifications are available from Grade 1 to Grade 8, and in some subjects from Initial Grade\"; bản này có các trang \"Piano Initial Grade\" và \"Piano Grade 1\" đến \"Piano Grade 8\" (Initial Grade là bậc Entry Level, đứng trước Grade 1); và \"an ideal platform from which to progress to ABRSM's diploma offer, beginning with the performance-only ARSM ... The LRSM and FRSM Diplomas are progressive from the ARSM\". ABRSM Piano Syllabus 2019 & 2020 (mục lục): \"Grades 1–8\" và \"Post-Grade 8: ARSM; DipABRSM, LRSM, FRSM\"."
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf ]
    luot_2_ghi_chu: "Grouping of grades into stages is the site's own editorial choice; ABRSM only defines the grade ladder. ABRSM 2025-26 spec (PDF p.5): after the grades ABRSM offers its diploma route, \"beginning with the performance-only ARSM\", then LRSM and FRSM. So \"after Grade 8, diploma and above\" matches. (grade_tu/grade_den 9 is an internal convention.)"
  - id: n2
    cau: "Mốc thời gian của chặng 7: không giới hạn."
    loai: khuyen-tap
    truong:
      - moc_thoi_gian
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: "Khớp ../opus-zero/docs/piano/lo-trinh.md: `| 7. Sau Grade 8 | diploma trở lên | không giới hạn | 1–3 giờ, chia nhiều buổi | ... |`. Hai trang còn lại không nêu mốc cho chặng này. Không mâu thuẫn."
    luot_2: dung
    luot_2_ghi_chu: "Practice advice (khuyen-tap): plausible for an adult self-learner, consistent with the other stages (time per day and years per grade rise steadily); ABRSM documents give no time-per-grade figures, so nothing contradicts it."
  - id: n3
    cau: "Thời lượng tập mỗi ngày ở chặng 7: 1–3 giờ, chia nhiều buổi."
    loai: khuyen-tap
    truong:
      - thoi_luong
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp ../opus-zero/docs/piano/lo-trinh.md: `| 7. Sau Grade 8 | diploma trở lên | không giới hạn | 1–3 giờ, chia nhiều buổi | ... |`; ../opus-zero/docs/piano/lo-trinh.md, mục "Chặng 7": "tập nhiều giờ cần nghỉ đều và tăng dần thời lượng". Không mâu thuẫn.'
    luot_2: dung
    luot_2_ghi_chu: "Practice advice (khuyen-tap): plausible for an adult self-learner, consistent with the other stages (time per day and years per grade rise steadily); ABRSM documents give no time-per-grade figures, so nothing contradicts it."
