lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d2-0-du-lieu
    ma_bam: sha256:dbe6a8444d1ad26d92fb23a6893dd9e8edf82bc7691d3ca6eb795fe951b53c6e
