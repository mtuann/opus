      kiem_mau: chủ repo, 5/5 nhận định mẫu của D2-0 đúng (d2-0-kiem-mau.yml)
ghi_chu: "Tên chặng (ten) và ranh giới giữa các chặng là lựa chọn biên tập của site, không phải nhận định cần nguồn; chỉ kiểm: (1) nhan_grade, tuong_duong, grade_tu, grade_den khớp nhau và khớp cấu trúc cấp của ABRSM; (2) moc_thoi_gian và thoi_luong (lời khuyên tập) khớp ba trang lõi cũ lo-trinh.md, moi-ngay.md, lo-trinh-choi.md. Trang Piano của ABRSM (abrsm.org/en-gb/instruments/piano) trả HTTP 403 khi mở trực tiếp, nên dùng bản lưu của Wayback Machine (13/11/2025) cùng hai bản đề cương PDF chính thức của ABRSM (2025–2026, 2019–2020), đều liệt kê Initial Grade (từ 2021), Grade 1–8 và các diploma."
nguon:
  - id: abrsm-piano
    bac: 2
    ten: ABRSM, trang Piano chính thức (abrsm.org/en-gb/instruments/piano; bản lưu 13/11/2025, vì trang gốc trả HTTP 403)
    link: https://web.archive.org/web/20251113192510/https://www.abrsm.org/en-gb/instruments/piano
  - id: abrsm-2526
    bac: 2
