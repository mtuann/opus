# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/cap-do/2
ban_ghi: cap-do/2
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d2-0-du-lieu
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D2-0 phần A)
      luot_2: Claude Sonnet 5.5 (D2-0 lượt 2 phần A)
      review: Claude Opus 5.5 (chủ lô D2-0, 24/10/2026)
      kiem_mau: null
ghi_chu: "Tên chặng (ten) và ranh giới giữa các chặng là lựa chọn biên tập của site, không phải nhận định cần nguồn; chỉ kiểm: (1) nhan_grade, tuong_duong, grade_tu, grade_den khớp nhau và khớp cấu trúc cấp của ABRSM; (2) moc_thoi_gian và thoi_luong (lời khuyên tập) khớp ba trang lõi cũ lo-trinh.md, moi-ngay.md, lo-trinh-choi.md. Trang Piano của ABRSM (abrsm.org/en-gb/instruments/piano) trả HTTP 403 khi mở trực tiếp, nên dùng bản lưu của Wayback Machine (13/11/2025) cùng hai bản đề cương PDF chính thức của ABRSM (2025–2026, 2019–2020), đều liệt kê Initial Grade (từ 2021), Grade 1–8 và các diploma."
nguon:
  - id: abrsm-piano
    bac: 2
    ten: ABRSM, trang Piano chính thức (abrsm.org/en-gb/instruments/piano; bản lưu 13/11/2025, vì trang gốc trả HTTP 403)
    link: https://web.archive.org/web/20251113192510/https://www.abrsm.org/en-gb/instruments/piano
  - id: abrsm-2526
    bac: 2
    ten: ABRSM, Practical Music Grades Piano Syllabus 2025 & 2026, Qualification Specification
    link: https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
  - id: abrsm-1920
    bac: 2
    ten: ABRSM, Piano Syllabus 2019 & 2020 (bản đầy đủ; bản lưu của us.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf)
    link: https://web.archive.org/web/2021/https://us.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf
nhan_dinh:
  - id: n1
    cau: Chặng 2 (Sơ cấp) ứng với ABRSM Grade 1–2 (grade_tu 1, grade_den 2).
    loai: cap-do
    truong:
      - nhan_grade
      - tuong_duong
      - grade_tu
      - grade_den
    nguon:
      - abrsm-piano
      - abrsm-2526
      - abrsm-1920
    ket_qua: dung
    ghi_chu: "Nhãn \"Grade 1–2\" (nhan_grade và tuong_duong) khớp grade_tu 1, grade_den 2. Quy ước của site: grade_tu và grade_den = 0 là trước Grade 1 (gồm Initial Grade), 9 là sau Grade 8 (diploma); mỗi chặng bắt đầu ngay sau chặng trước. ABRSM, trang Piano (bản lưu 13/11/2025): \"Face-to-face Practical Grades and digital Performance Grades are available from Initial Grade to Grade 8\" và \"For advanced pianists we offer ARSM, LRSM and FRSM diplomas in Music Performance\". ABRSM Piano Practical Grades 2025 & 2026 (mục \"Progression route\"): \"ABRSM Practical Music qualifications are available from Grade 1 to Grade 8, and in some subjects from Initial Grade\"; bản này có các trang \"Piano Initial Grade\" và \"Piano Grade 1\" đến \"Piano Grade 8\" (Initial Grade là bậc Entry Level, đứng trước Grade 1); và \"an ideal platform from which to progress to ABRSM's diploma offer, beginning with the performance-only ARSM ... The LRSM and FRSM Diplomas are progressive from the ARSM\". ABRSM Piano Syllabus 2019 & 2020 (mục lục): \"Grades 1–8\" và \"Post-Grade 8: ARSM; DipABRSM, LRSM, FRSM\"."
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf ]
    luot_2_ghi_chu: "Grouping of grades into stages is the site's own editorial choice; ABRSM only defines the grade ladder. ABRSM 2025-26 spec (PDF p.4): Grades 1, 2 and 3 form the Level 1 Award; Grades 1-2 are the lower part of it. No contradiction."
  - id: n2
    cau: "Mốc thời gian của chặng 2: 6 tháng – 1,5 năm."
    loai: khuyen-tap
    truong:
      - moc_thoi_gian
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp ../opus-zero/docs/piano/lo-trinh.md: `| 2. Sơ cấp | Grade 1–2 | 6 tháng – 1,5 năm | 30 phút | ... |`; ../opus-zero/docs/bat-dau/lo-trinh-choi.md: "Cuối năm đầu, bạn đã ở khoảng chặng 2 của lộ trình (khoảng ABRSM Grade 1–2)" (cuối tháng 12 nằm trong 6 tháng – 1,5 năm). Không mâu thuẫn.'
    luot_2: dung
    luot_2_ghi_chu: "Practice advice (khuyen-tap): plausible for an adult self-learner, consistent with the other stages (time per day and years per grade rise steadily); ABRSM documents give no time-per-grade figures, so nothing contradicts it."
  - id: n3
    cau: "Thời lượng tập mỗi ngày ở chặng 2: 30 phút."
    loai: khuyen-tap
    truong:
      - thoi_luong
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp ../opus-zero/docs/piano/lo-trinh.md: `| 2. Sơ cấp | Grade 1–2 | 6 tháng – 1,5 năm | 30 phút | ... |`; ../opus-zero/docs/bat-dau/lo-trinh-choi.md: "tập 20–30 phút mỗi ngày trong sáu tháng đầu, rồi khoảng 30 phút"; ../opus-zero/docs/bat-dau/moi-ngay.md: "## Buổi 30 phút (chuẩn)". Không mâu thuẫn.'
    luot_2: dung
    luot_2_ghi_chu: "Practice advice (khuyen-tap): plausible for an adult self-learner, consistent with the other stages (time per day and years per grade rise steadily); ABRSM documents give no time-per-grade figures, so nothing contradicts it."
