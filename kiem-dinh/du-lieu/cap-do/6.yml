nhan_dinh:
  - id: n1
    cau: Chặng 6 (Nâng cao) ứng với ABRSM Grade 7–8 (grade_tu 7, grade_den 8).
    loai: cap-do
    truong:
      - nhan_grade
      - tuong_duong
      - grade_tu
      - grade_den
    nguon:
      - abrsm-piano
      - abrsm-2526
      - abrsm-1920
    ket_qua: dung
    ghi_chu: "Nhãn \"Grade 7–8\" (nhan_grade và tuong_duong) khớp grade_tu 7, grade_den 8. Quy ước của site: grade_tu và grade_den = 0 là trước Grade 1 (gồm Initial Grade), 9 là sau Grade 8 (diploma); mỗi chặng bắt đầu ngay sau chặng trước. ABRSM, trang Piano (bản lưu 13/11/2025): \"Face-to-face Practical Grades and digital Performance Grades are available from Initial Grade to Grade 8\" và \"For advanced pianists we offer ARSM, LRSM and FRSM diplomas in Music Performance\". ABRSM Piano Practical Grades 2025 & 2026 (mục \"Progression route\"): \"ABRSM Practical Music qualifications are available from Grade 1 to Grade 8, and in some subjects from Initial Grade\"; bản này có các trang \"Piano Initial Grade\" và \"Piano Grade 1\" đến \"Piano Grade 8\" (Initial Grade là bậc Entry Level, đứng trước Grade 1); và \"an ideal platform from which to progress to ABRSM's diploma offer, beginning with the performance-only ARSM ... The LRSM and FRSM Diplomas are progressive from the ARSM\". ABRSM Piano Syllabus 2019 & 2020 (mục lục): \"Grades 1–8\" và \"Post-Grade 8: ARSM; DipABRSM, LRSM, FRSM\"."
