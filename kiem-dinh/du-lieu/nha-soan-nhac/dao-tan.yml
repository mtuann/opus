    loai: nam
    truong: [ sinh, mat, khoang ]
    nguon: [ vanhoanghethuat, bnf, vusta ]
    ket_qua: dung
    ghi_chu: "Tạp chí Văn hóa Nghệ thuật (Bộ VHTTDL): “sinh ngày 27-2 năm Ất Tị (6-4-1845)” và “mất vào rằm tháng bảy năm Đinh Mùi, đời Thành Thái 19 (23-8-1907)”; BnF: “1845-1907”; trang VUSTA đề “Danh nhân Đào Tấn (1845-1907)” và viết “Ba năm sau (1907), ông mất”. Chưa mở được trang của Cục Di sản văn hóa hay cổng tỉnh (gialai.gov.vn lỗi chứng chỉ)."
    luot_2: dung
    luot_2_nguon: [ https://vanhoanghethuat.vn/nguoi-anh-hung-trong-tuong-dao-tan-77747841.html, https://nhandan.vn/ky-niem-170-nam-sinh-danh-nhan-van-hoa-dao-tan-post242473.html, https://nhandan.vn/dao-tan-nha-soan-tuong-kiet-xuat-cua-san-khau-dan-toc-post239043.html, https://baovanhoa.vn/thoi-su/cu-tri-kien-nghi-som-trung-tu-ton-tao-di-tich-lich-su-quoc-gia-mo-dao-tan-57853.html ]
    luot_2_ghi_chu: 'vanhoanghethuat.vn (Ministry of Culture, Sports and Tourism magazine): born 27-2 Ất Tị (6-4-1845), died rằm tháng bảy Đinh Mùi, Thành Thái 19 (23-8-1907); Nhân Dân: "sinh ngày 3-4-1845 ... mất tại Bình Định năm 1907" and "(1845-1907)"; Báo Văn hóa citing the monument dossier: "Đào Tấn (1845-1907)". Day-level dates differ slightly, the years agree.'
