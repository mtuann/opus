    luot_2_ghi_chu: Name "Đào Tấn" (full name Đào Tăng Tấn) in the Ministry of Culture magazine Văn hóa Nghệ thuật, Nhân Dân and Báo Văn hóa. Not in IMSLP/LOC; the Bình Định provincial portal was unreachable (expired certificate), so Vietnamese state media/ministry magazine used.
