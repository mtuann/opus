# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/nha-soan-nhac/dao-tan
ban_ghi: nha-soan-nhac/dao-tan
ghi_chu: "Nhận diện: id dao-tan là Đào Tấn (1845–1907), nhà soạn tuồng (hát bội) ở Bình Định, không phải nhà soạn nhạc phương Tây. Trang cũ: lich-su/nhac-truyen-thong-viet-nam.md (“Đào Tấn (1845–1907), người để lại hàng chục vở tuồng mẫu mực”). Nguồn bậc 2 mở được: Tạp chí Văn hóa Nghệ thuật của Bộ Văn hóa, Thể thao và Du lịch, và BnF; trang VUSTA (bậc 3) chỉ để đối chiếu. Không mở được trang gialai.gov.vn (lỗi chứng chỉ khi tải). Không tìm được nguồn của cơ quan âm nhạc (Học viện Âm nhạc Quốc gia, Hội Nhạc sĩ) vì ông là nhà soạn tuồng."
