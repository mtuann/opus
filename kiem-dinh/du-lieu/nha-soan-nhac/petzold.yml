    ghi_chu: "Review (24/10/2026): giữ \"Christian Petzold\", cách viết quen dùng trong tài liệu dạy đàn. IMSLP, LoC và GND lấy \"Christian Pezold\" làm dạng chính, có ghi \"Petzold\" là cách viết khác (lượt 2). Có thể thêm cach_viet_khac ở lô dùng tên này. IMSLP và BnF đặt tên mục là “Christian Pezold”; “Christian Petzold” có trong danh sách tên khác của IMSLP và là cách viết quen thuộc (trang cũ của site dùng Petzold). Gợi ý: thêm cach_viet_khac: [Christian Pezold]."
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Petzold,_Christian", https://id.loc.gov/authorities/names/n82039528.json, https://lobid.org/gnd/123594804.json ]
    luot_2_ghi_chu: 'The authority forms prefer "Pezold": IMSLP (category "Pezold, Christian"; "Petzold, Christian" redirects to it and "Christian Petzold" is listed only as an alternative name), LOC n82039528 (heading "Pezold, Christian, 1677-1733", variant "Petzold, Christian") and GND 123594804 via lobid (preferredName "Pezold, Christian", variantName "Petzold, Christian"). "Petzold" is a recorded variant and the older, still widely used spelling, so the claim is not wrong but is not the authority form. Suggest "Christian Pezold (còn viết Petzold)" or keep "Petzold" with a note; reviewer to choose.'
