  - id: n1
    cau: Tên viết là Sofia Gubaidulina.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp ]
    ket_qua: dung
    ghi_chu: IMSLP đề mục "Sofia Gubaidulina" (khớp dữ liệu); BnF viết "Sofiâ Asgatovna Gubajdulina" (chuyển tự thư viện).
    luot_2: dung
