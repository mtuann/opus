    loai: lich-su
    truong: [thoi_ky]
    nguon: [imslp]
    ket_qua: null
    ghi_chu: 'chưa chắc: Chỗ cần chủ repo quyết: dữ liệu ghi "Đương đại" nhưng không nguồn ngoài nào phân định được: IMSLP chỉ có nhóm "Modern era", chung cho cả Thế kỷ 20 lẫn đương đại. Site tự định nghĩa (lich-su/index.md) Thế kỷ 20 ~1900–2000, Đương đại 2000–nay; người này viết ở cả hai bên mốc 2000. Trang cũ: dong-thoi-gian.md và duong-dai.md xếp bảng "Đương đại", nhưng duong-dai.md gọi bà "một trong những nhà soạn nhạc quan trọng nhất cuối thế kỷ 20". Bà mất 2025, sự nghiệp trải từ thập niên 1960 đến 2020. Đề nghị: giữ "Đương đại" hoặc đổi "Thế kỷ 20/Đương đại" cho cả sáu người (Gubaidulina, Pärt, Reich, Glass, Adams, Saariaho).'
