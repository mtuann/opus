    luot_2_ghi_chu: "Boosey & Hawkes/Sikorski (her publisher) and IMSLP: 'Sofia Gubaidulina'; BnF uses the scientific transliteration 'Gubajdulina, Sofia Asgatovna'."
  - id: n2
    cau: Sofia Gubaidulina sinh năm 1931, mất năm 2025.
    loai: nam
    truong: [ sinh, mat ]
    nguon: [ bnf, dnb, boosey, imslp ]
    ket_qua: dung
    ghi_chu: 'BnF: (1931-2025); GND: 1931 – 2025; Boosey & Hawkes (nhà xuất bản): "1931 - 2025". IMSLP chỉ ghi "(b. 24 October 1931)", chưa cập nhật ngày mất.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Gubaidulina,_Sofia", https://www.boosey.com/cr/news/102623, https://catalogue.bnf.fr/ark:/12148/cb13925523s ]
    luot_2_ghi_chu: "BnF: 1931-10-24 - 2025-03-13; IMSLP: born 24 October 1931 (its page is stale, no death date); Boosey & Hawkes/Sikorski: 'has passed away on 13 March 2025, aged 93, at her home in Appen near Hamburg'."
  - id: n3
    cau: Sofia Gubaidulina thuộc thời kỳ Đương đại.
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp ]
    ket_qua: dung
    ghi_chu: 'Review (24/10/2026): Đương đại, như trang lịch sử Đương đại và Dòng thời gian của site; lượt 2 xác nhận (ví dụ Boosey & Hawkes gọi Gubaidulina là "grande dame of contemporary classical music"). Trang lich-su/nha-soan-nhac cũ xếp vài người ở Thế kỷ 20: lô chuyển trang ấy sửa theo. Lượt 1 để chưa chắc vì hai trang cũ mâu thuẫn. Lượt 1: Chỗ cần chủ repo quyết: dữ liệu ghi "Đương đại" nhưng không nguồn ngoài nào phân định được: IMSLP chỉ có nhóm "Modern era", chung cho cả Thế kỷ 20 lẫn đương đại. Site tự định nghĩa (lich-su/index.md) Thế kỷ 20 ~1900–2000, Đương đại 2000–nay; người này viết ở cả hai bên mốc 2000. Trang cũ: dong-thoi-gian.md và duong-dai.md xếp bảng "Đương đại", nhưng duong-dai.md gọi bà "một trong những nhà soạn nhạc quan trọng nhất cuối thế kỷ 20". Bà mất 2025, sự nghiệp trải từ thập niên 1960 đến 2020. Đề nghị: giữ "Đương đại" hoặc đổi "Thế kỷ 20/Đương đại" cho cả sáu người (Gubaidulina, Pärt, Reich, Glass, Adams, Saariaho).'
    luot_2: dung
    luot_2_nguon: [ https://www.boosey.com/cr/news/102623, "https://imslp.org/wiki/Category:Gubaidulina,_Sofia" ]
    luot_2_ghi_chu: "Sikorski/Boosey & Hawkes call her 'the grande dame of contemporary classical music'; IMSLP tags 'Modern era'. Active c.1960-2025, main international career from the 1980s: 'Đương đại' is a reasonable placement (site's own two-label scheme; she could also be 'Thế kỷ 20/Đương đại')."
