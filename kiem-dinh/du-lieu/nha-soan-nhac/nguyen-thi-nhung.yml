    ghi_chu: 'Review (24/10/2026): chấp nhận: 1936 theo Viện Âm nhạc (tròn 65 tuổi năm 2001) và Dân Trí (13/12/2017: sinh 16/8/1936); chưa có tin mất. Phần 1 của Hội Nhạc sĩ VN có phụ đề "Kỷ niệm tuổi 90 của nhạc sĩ Nguyễn Thị Nhung (1936)" và nói về bà như người đang sống; phần 2 cũng vậy. Phần 2 có hai mốc lệch nhau (đề ngày 14/08/2026, cuối bài ghi 16-8-2025). Báo Thanh Niên Việt 30/09/2026 gọi cha (Huy Du) là "cố" còn mẹ, "PGS.TS. Nhạc sĩ Nguyễn Thị Nhung, nguyên Phó Giám đốc Nhạc viện Hà Nội", thì không. Không thấy tin mất khi tìm đến 24/10/2026. Chưa mở được nguồn nào ghi ngày sinh đầy đủ.'
    luot_2: khong-chac
    luot_2_nguon: [ https://vienamnhac.vn/publication/books/chamber-and-symphony-music-of-vietnam, https://hoinhacsi.vn/profile/nguyen-thi-nhung, https://dantri.com.vn/van-hoa/pgsts-nguyen-thi-nhung-se-ke-chuyen-trong-dem-nhac-huy-du-20171214102132902.htm ]
    luot_2_ghi_chu: "No rank-2 source states the birth year. Viện Âm nhạc page: her 2001 book appeared 'right at the occasion when its author gets 65 years old' (consistent with 1936, but only an age); hoinhacsi.vn profile is empty; Dân Trí (13/12/2017, newspaper): 'sinh ngày 16/8/1936 tại Hà Nội'; vi.wikipedia (lead only) 16/8/1936, living, latest edit 2026-09-21. Likely correct; no obituary found."
