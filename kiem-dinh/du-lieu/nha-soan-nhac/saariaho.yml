    ghi_chu: "chưa chắc: Chỗ cần chủ repo quyết: dữ liệu ghi \"Đương đại\" nhưng không nguồn ngoài nào phân định được: IMSLP chỉ có nhóm \"Modern era\", chung cho cả Thế kỷ 20 lẫn đương đại. Site tự định nghĩa (lich-su/index.md) Thế kỷ 20 ~1900–2000, Đương đại 2000–nay; người này viết ở cả hai bên mốc 2000. Trang cũ: dong-thoi-gian.md và duong-dai.md xếp \"Đương đại\", còn opera.md đặt L'Amour de loin vào mục \"Thế kỷ 20 đến nay\". Wise Music tả bà \"termed a classic of this century already in her lifetime\" (lời gia đình). Đề nghị: giữ \"Đương đại\" hoặc đổi \"Thế kỷ 20/Đương đại\" cho cả sáu người (Gubaidulina, Pärt, Reich, Glass, Adams, Saariaho)."
