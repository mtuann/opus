  - id: n3
    cau: Kaija Saariaho thuộc thời kỳ Đương đại.
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ wise ]
    ket_qua: dung
    ghi_chu: "Review (24/10/2026): Đương đại, như trang lịch sử Đương đại và Dòng thời gian của site; lượt 2 xác nhận (ví dụ Boosey & Hawkes gọi Gubaidulina là \"grande dame of contemporary classical music\"). Trang lich-su/nha-soan-nhac cũ xếp vài người ở Thế kỷ 20: lô chuyển trang ấy sửa theo. Lượt 1 để chưa chắc vì hai trang cũ mâu thuẫn. Lượt 1: Chỗ cần chủ repo quyết: dữ liệu ghi \"Đương đại\" nhưng không nguồn ngoài nào phân định được: IMSLP chỉ có nhóm \"Modern era\", chung cho cả Thế kỷ 20 lẫn đương đại. Site tự định nghĩa (lich-su/index.md) Thế kỷ 20 ~1900–2000, Đương đại 2000–nay; người này viết ở cả hai bên mốc 2000. Trang cũ: dong-thoi-gian.md và duong-dai.md xếp \"Đương đại\", còn opera.md đặt L'Amour de loin vào mục \"Thế kỷ 20 đến nay\". Wise Music tả bà \"termed a classic of this century already in her lifetime\" (lời gia đình). Đề nghị: giữ \"Đương đại\" hoặc đổi \"Thế kỷ 20/Đương đại\" cho cả sáu người (Gubaidulina, Pärt, Reich, Glass, Adams, Saariaho)."
    luot_2: dung
    luot_2_nguon: [ https://www.wisemusicclassical.com/composer/1350/Kaija-Saariaho/, https://catalogue.bnf.fr/ark:/12148/cb139520804 ]
    luot_2_ghi_chu: "Chester/Wise Music: 'a leading voice of her generation of composers', named 'Greatest Living Composer' by BBC Music Magazine peers in 2019; career 1970s-2023: 'Đương đại' is a reasonable placement."
