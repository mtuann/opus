    loai: lich-su
    truong: [thoi_ky]
    nguon: [imslp, warner-debussy, naxos-debussy, dg-debussy]
    ket_qua: dung
    ghi_chu: "Giữ “Thế kỷ 20” (chủ lô chọn khi gom lượt 1, ngày 24/10/2026): phân kỳ là quy ước của site, các trang lịch sử xếp Debussy ở trang Thế kỷ 20 (nhóm Ấn tượng), và Naxos gọi ông là nhà soạn nhạc Pháp quan trọng nhất thế kỷ 20. Ghi chú của lượt 1: IMSLP chỉ xếp Debussy vào “Romantic” (danh sách thể loại của trang chỉ có một era), còn trang ghi “Thế kỷ 20”. Nhãn hãng đĩa không thống nhất: Naxos (booklet 8.509002) dẫn lời nhạc trưởng Jun Märkl gọi ông “the most important French composer of the twentieth century”; Warner Classics viết “influenced more by painting than by late-romantic music” và nhắc Impressionism; Deutsche Grammophon không gán thời kỳ. Phân kỳ là quy ước (site định nghĩa Thế kỷ 20 là khoảng 1900–2000 và xếp Debussy vào nhóm Ấn tượng của trang Thế kỷ 20). Nếu muốn khớp IMSLP thì dùng “Lãng mạn/Thế kỷ 20” như Sibelius. Cần chủ repo chọn."
