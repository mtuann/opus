  - id: n3
    cau: "Claude Debussy thuộc thời kỳ Thế kỷ 20."
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp, warner-debussy, naxos-debussy, dg-debussy ]
    ket_qua: dung
    ghi_chu: "Giữ “Thế kỷ 20” (chủ lô chọn khi gom lượt 1, ngày 24/10/2026): phân kỳ là quy ước của site, các trang lịch sử xếp Debussy ở trang Thế kỷ 20 (nhóm Ấn tượng), và Naxos gọi ông là nhà soạn nhạc Pháp quan trọng nhất thế kỷ 20. Ghi chú của lượt 1: IMSLP chỉ xếp Debussy vào “Romantic” (danh sách thể loại của trang chỉ có một era), còn trang ghi “Thế kỷ 20”. Nhãn hãng đĩa không thống nhất: Naxos (booklet 8.509002) dẫn lời nhạc trưởng Jun Märkl gọi ông “the most important French composer of the twentieth century”; Warner Classics viết “influenced more by painting than by late-romantic music” và nhắc Impressionism; Deutsche Grammophon không gán thời kỳ. Phân kỳ là quy ước (site định nghĩa Thế kỷ 20 là khoảng 1900–2000 và xếp Debussy vào nhóm Ấn tượng của trang Thế kỷ 20). Nếu muốn khớp IMSLP thì dùng “Lãng mạn/Thế kỷ 20” như Sibelius. Cần chủ repo chọn."
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Debussy,_Claude", "https://imslp.org/wiki/Estampes,_CD_108_(Debussy,_Claude)", "https://imslp.org/wiki/Images,_1re_s%C3%A9rie,_CD_105_(Debussy,_Claude)", "https://imslp.org/wiki/La_mer,_CD_111_(Debussy,_Claude)", "https://imslp.org/wiki/Children's_Corner,_CD_119_(Debussy,_Claude)", "https://imslp.org/wiki/Pell%C3%A9as_et_M%C3%A9lisande,_CD_93_(Debussy,_Claude)", "https://imslp.org/wiki/Etudes,_CD_143_(Debussy,_Claude)", "https://imslp.org/wiki/2_Arabesques,_CD_74_(Debussy,_Claude)" ]
    luot_2_ghi_chu: IMSLP tags Debussy only as "People from the Romantic era", and the IMSLP work pages I opened (Estampes, La mer, Children's Corner, Pelléas, Études, 2 Arabesques) are tagged "Romantic"; only Images 1re série is "Early 20th century". "Thế kỷ 20" is the usual textbook placement (Impressionism; most major works 1894-1915) and is defensible, but I found no rank-2 source stating it, and under the site's own A/B rule (cf. Sibelius "Lãng mạn/Thế kỷ 20") a straddle label is also arguable. Reviewer to decide.
