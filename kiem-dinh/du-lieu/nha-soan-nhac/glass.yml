  - id: n3
    cau: Philip Glass thuộc thời kỳ Đương đại.
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp ]
    ket_qua: dung
    ghi_chu: 'Review (24/10/2026): Đương đại, như trang lịch sử Đương đại và Dòng thời gian của site; lượt 2 xác nhận (ví dụ Boosey & Hawkes gọi Gubaidulina là "grande dame of contemporary classical music"). Trang lich-su/nha-soan-nhac cũ xếp vài người ở Thế kỷ 20: lô chuyển trang ấy sửa theo. Lượt 1 để chưa chắc vì hai trang cũ mâu thuẫn. Lượt 1: Chỗ cần chủ repo quyết: dữ liệu ghi "Đương đại" nhưng không nguồn ngoài nào phân định được: IMSLP chỉ có nhóm "Modern era", chung cho cả Thế kỷ 20 lẫn đương đại. Site tự định nghĩa (lich-su/index.md) Thế kỷ 20 ~1900–2000, Đương đại 2000–nay; người này viết ở cả hai bên mốc 2000. Trang cũ: dong-thoi-gian.md và duong-dai.md xếp "Đương đại", còn lich-su/nha-soan-nhac.md xếp ông dưới mục "Thế kỷ 20" và lich-su/index.md liệt kê Glass trong "Tên tuổi" của Thế kỷ 20. Ông có tác phẩm mới 2026 (Giao hưởng số 15 "Lincoln"). Đề nghị: giữ "Đương đại" hoặc đổi "Thế kỷ 20/Đương đại" cho cả sáu người (Gubaidulina, Pärt, Reich, Glass, Adams, Saariaho).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Glass,_Philip", https://www.wisemusicclassical.com/composer/short-bio/540 ]
    luot_2_ghi_chu: "IMSLP tags 'Modern era'; Wise Music: 'one of the most influential living composers': 'Đương đại' is a reasonable placement."
