# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/nha-soan-nhac/sa-huynh
ban_ghi: nha-soan-nhac/sa-huynh
ghi_chu: 'Có hai người nghệ danh Sa Huỳnh: nhạc sĩ (con gái nhạc sĩ Triều Dâng, theo trang cũ lich-su/nu-nha-soan-nhac.md) và ca sĩ bolero sinh 1987 ở Quảng Bình (VietNamNet), khác nhau. Hồ sơ này là nhạc sĩ con gái Triều Dâng. Trang cũ ghi "tên khai sinh Nguyễn Sa Huỳnh"; kết quả tìm kiếm ghi bà tên thật Lương Sa Huỳnh (cha Triều Dâng tên thật Lương Văn Côn): chưa kiểm vì trường này không nằm trong dữ liệu, ghi để lượt trang cũ xử lý.'
