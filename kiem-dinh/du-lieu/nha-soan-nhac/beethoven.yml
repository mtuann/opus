  - id: n4
    cau: "Ludwig van Beethoven thuộc thời kỳ Cổ điển/Lãng mạn (chuyển tiếp giữa hai thời kỳ)."
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp, dg-beethoven ]
    ket_qua: dung
    ghi_chu: "IMSLP chỉ xếp Beethoven vào “Classical”. Deutsche Grammophon viết “the music of the 'Eroica' represents a massive leap from Classicism to Romanticism”: nhãn chuyển tiếp “Cổ điển/Lãng mạn” của site có cơ sở."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Beethoven,_Ludwig_van", "https://imslp.org/wiki/Symphony_No.1,_Op.21_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Piano_Sonata_No.1,_Op.2_No.1_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Piano_Sonata_No.14,_Op.27_No.2_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Piano_Sonata_No.21,_Op.53_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Symphony_No.9,_Op.125_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Missa_solemnis,_Op.123_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Piano_Sonata_No.29,_Op.106_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: IMSLP person category is only "People from the Classical era", but IMSLP work pages tag his early works Classical (Symphony No.1 Op.21, Piano Sonata Op.2 No.1, Op.27 No.2, Op.53) and late works Romantic (Symphony No.9 Op.125, Missa solemnis Op.123, Piano Sonata No.29 Op.106). That supports a "Cổ điển/Lãng mạn" transitional placement.
