    cau: Trần Kim Ngọc sinh năm 1975, còn sống (chưa có tin mất đến tháng 10/2026).
    loai: nam
    truong: [ sinh, mat ]
    nguon: [ hns, donne ]
    ket_qua: dung
    ghi_chu: 'Hội Nhạc sĩ VN (31/07/2025): chào đời "đầu năm 1975", cha là nhạc sĩ Trần Ngọc Xương. Donne (cơ sở dữ liệu nữ nhạc sĩ, nguồn bậc 3): "b. 1975". Bằng chứng còn sống mở được gần nhất là bài của Hội Nhạc sĩ VN 7/2025 viết như về người đang hoạt động; không tìm được buổi diễn 2026. Không thấy tin mất khi tìm đến 24/10/2026.'
    luot_2: khong-chac
    luot_2_nguon: [ https://donne-uk.org/artist/ngoc-tran-kim-2, https://ovietnam.vietnamnews.vn/composer-premieres-legendary-tale-post200865.html, https://asiawa.jpf.go.jp/en/culture/features/tpam-exchange01-20160420/ ]
    luot_2_ghi_chu: "No rank-2 source states the year: DONNE (women-composer database) lists 'b. 1975' and Viet Nam News (24/6/2010) says 'Born in 1975', but neither is an institution/library page. Caution: the Japan Foundation interview (TPAM, 2016) quotes her 'In 2000, when I was 20 years old, I started to compose music-theatre', which would point to c.1980, not 1975. Nha San, Goethe-Institut (403) and Saigoneer give no year; vi/en Wikipedia have no article. No death report found."
