  - id: n2
    cau: "Bartolomeo Cristofori sinh năm 1655."
    loai: nam
    truong: [ sinh ]
    nguon: [ bnf, db-gnd, pollens ]
    ket_qua: dung
    ghi_chu: "Pollens: giấy rửa tội ở Padua (nhà thờ S. Luca) ghi 6/5/1655; BnF và GND ghi 1655."
    luot_2: dung
    luot_2_nguon: [ https://id.loc.gov/authorities/names/nr89005347.json, https://www.treccani.it/enciclopedia/bartolomeo-cristofori_(Dizionario-Biografico)/ ]
    luot_2_ghi_chu: 'Treccani DBI: "Nacque a Padova il 4 maggio 1655" (baptised 6 May 1655); LOC heading 1655-1732.'
  - id: n3
    cau: "Bartolomeo Cristofori mất năm 1732 (ngày 27/1/1732 theo lịch hiện hành; giấy tờ ở Florence ghi 1731 vì năm Florence bắt đầu ngày 25/3)."
    loai: nam
    truong: [ mat, khoang ]
    nguon: [ bnf, pollens, db-gnd ]
    ket_qua: da-sua
    ghi_chu: "Dữ liệu ghi mat: 1731. Ngày mất 27/1/1731 là theo lịch Florence (stile fiorentino, năm bắt đầu ngày 25/3), tức 27/1/1732 theo lịch hiện hành. Pollens (Cambridge University Press) viết “his death in 1732” và giải thích cách tính lịch; BnF ghi “1655-1732”. GND (Deutsche Biographie) ghi 1731 theo cách ghi của giấy tờ gốc. Site ghi năm theo lịch hiện hành, nên sửa thành 1732 (chủ lô chọn khi gom lượt 1, ngày 24/10/2026). Trang lich-su-dan cũ ghi 1731: lô chuyển trang ấy sửa theo."
    luot_2: dung
    luot_2_nguon: [ https://www.treccani.it/enciclopedia/bartolomeo-cristofori_(Dizionario-Biografico)/, https://www.regione.toscana.it/-/il-capodanno-dell-annunciazione, https://id.loc.gov/authorities/names/nr89005347.json ]
    luot_2_ghi_chu: "Treccani DBI: \"Il C. morì a Firenze il 27 genn. 1732 secondo il calendario moderno; nell'atto di morte ... si legge invece 1731 perché ci si riferisce al calendario di stile fiorentino in uso fino al 1750 circa\". Regione Toscana: \"fino al 1750, l'anno civile a Firenze iniziava il 25 marzo\". LOC heading 1655-1732 (its source notes also record \"1-27-1731\"). All parts of the claim confirmed."
