    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Palestrina,_Giovanni_Pierluigi_da", https://id.loc.gov/authorities/names/n50051776.json ]
    luot_2_ghi_chu: IMSLP display name is "Giovanni Pierluigi da Palestrina" and it lists "Palestrina" as an alias; LOC heading "Palestrina, Giovanni Pierluigi da, 1525?-1594". "Palestrina" alone is the usual short form (name taken from the town); the full name is longer.
