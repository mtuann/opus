    ghi_chu: "Dữ liệu ghi sinh 1525, không có khoang. IMSLP ghi “ca.1525”, BnF ghi “1525?”, GND (qua Deutsche Biographie) ghi “um 1514 oder 1529”: thêm khoang: true."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Palestrina,_Giovanni_Pierluigi_da", https://id.loc.gov/authorities/names/n50051776.json, https://lobid.org/gnd/118818686.json ]
    luot_2_ghi_chu: 'IMSLP: ca.1525 — 2 February 1594; LOC "1525?-1594" (birth [1525,1526]); GND 1525 / 1594-02-02. Circa wording matches.'
