nhan_dinh:
  - id: n1
    cau: "Tên bài: Valse La thứ, B. 150 (Waltz in A minor, không số opus)."
    loai: ten
    truong:
      - ten
    nguon:
      - imslp-b150
      - henle-hn131
    ket_qua: dung
    ghi_chu: 'IMSLP: "Waltz in A minor, B.150", tên khác "Valse". Henle HN 131: "Waltz a minor KK IVb,11".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Waltz_in_A_minor,_B.150_(Chopin,_Fr%C3%A9d%C3%A9ric)", https://www.henle.de/en/Waltzes/HN-131 ]
    luot_2_ghi_chu: 'IMSLP: "Waltz in A minor, B.150" (also CT 224), c.1847-49, no opus; Henle "Waltz a minor KK IVb,11".'
  - id: n2
    cau: "Tác giả: Frédéric Chopin."
    loai: lich-su
    truong:
      - tac_gia
    nguon:
      - imslp-b150
      - henle-hn131
      - abrsm-2526
    ket_qua: dung
    ghi_chu: 'IMSLP: Composer "Chopin, Frédéric" (ghi chú: in năm 1860 dưới dạng Valse của Charlotte de Rothschild, số 3 trong 4 Pièces pour piano). Henle HN 131 (Waltzes) có bài này ("KK IVb,11") và ABRSM 2025–2026 liệt kê dưới tên Chopin ("Waltz in A minor, KK. IVb No. 11").'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Waltz_in_A_minor,_B.150_(Chopin,_Fr%C3%A9d%C3%A9ric)" ]
    luot_2_ghi_chu: "IMSLP composer: Chopin, Frédéric."
  - id: n3
    cau: "Số danh mục: B. 150."
    loai: danh-muc
    truong:
      - danh_muc
    nguon:
      - imslp-b150
      - henle-hn131
      - abrsm-2526
    ket_qua: dung
    ghi_chu: 'IMSLP: Op./Cat. No. "B.150 ; CT 224"; tên khác gồm "Waltz no. 19 in A minor, B. 150, KK IVb/11". Henle ghi "KK IVb,11" và ABRSM 2025–2026 ghi "KK. IVb No. 11" cho cùng bài.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Waltz_in_A_minor,_B.150_(Chopin,_Fr%C3%A9d%C3%A9ric)" ]
    luot_2_ghi_chu: 'IMSLP: "B.150 ; CT 224". ABRSM/Henle use KK IVb/11 for the same unnumbered A minor waltz (identity via Wikipedia lead: B. 150 = KK IVb/11 = CT 224); RCM writes "op. posth., B 150".'
  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 5–6.
    loai: cap-do
    truong:
      - grade
    nguon:
      - abrsm-2526
      - abrsm-2728
      - rcm-2022
      - henle-hn131
      - henle-thang
    ket_qua: da-sua
    ghi_chu: 'Dữ liệu ghi "Grade 3–4"; sửa thành "Grade 5–6". Đề cương chính thức: ABRSM Piano 2025 & 2026, Grade 6, danh sách B, mục 7: "Chopin, Waltz in A minor, KK. IVb No. 11, with first repeat"; ABRSM 2027 & 2028 cũng xếp ở Grade 6. RCM 2022: "Waltz in A Minor, op. posth., B 150" ở Level 6. Henle chỉ xếp mức 3 (easy), nhưng đề cương ABRSM (hai kỳ liền) xếp Grade 6, nên Grade 3–4 không còn đứng được; Grade 5–6 phản ánh cả ABRSM (6) lẫn RCM/Henle thấp hơn.'
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf, https://www.henle.de/en/Waltzes/HN-131, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf ]
    luot_2_ghi_chu: 'ABRSM 2025-26 Grade 6: "Waltz in A minor, KK. IVb No. 11"; Henle level 3 with "ABRSM: Piano Grade 6 recommended"; RCM 2022 Level 6 "Waltz in A Minor, op. posth., B 150". Grade 5-6 supported.'
  - id: n5
    cau: Bài thuộc chặng 5 (Grade 6) của lộ trình piano.
    loai: cap-do
    truong:
      - chang
    nguon:
      - abrsm-2526
      - abrsm-2728
    ket_qua: da-sua
    ghi_chu: Dữ liệu ghi chặng 3; sửa thành chặng 5. Chặng 3 (Grade 3) không còn chứa khoảng Grade 5–6; Grade 6 thuộc chặng 5 (cap-do.yml).
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf ]
    luot_2_ghi_chu: Stage 5 = Grade 6; ABRSM Grade 6.
