    luot_2_nguon: [ "https://www.chopin-nationaledition.com/wp-content/uploads/2022/06/walce-B_komentarze_poprawka_2020.pdf", "https://www.henle.de/media/a3/c6/49/1697725591/0131-1697725590-sync.pdf" ]
