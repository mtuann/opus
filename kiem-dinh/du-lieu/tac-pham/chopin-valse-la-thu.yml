ghi_chu: 'Trang bài học cũ ../opus-zero/docs/piano/tac-pham/chopin-valse-la-thu.md có (loai: bai-hoc là cấu trúc, không phải nhận định). Cần cập nhật theo: chip.cap_do, dòng "Độ khó" trong thong_tin, trang chặng, bảng "Tác phẩm theo cấp độ" và gợi ý năm thứ hai trong lộ trình năm đầu (bài đang xếp ở chặng 3). Lần 2 (D6-L2, lượt 1 phần B): nhận định n6–n30 cho các trường chưa khóa (giong, nhip, thoi_ky, ky_nang_chinh, chip, thong_tin, hinh, ban_thu). Bản nhạc: bản LilyPond chép theo bản thảo (rdj/music). Chưa chắc: n17 (Maurice Brown ghi 1843), n18 (học giả cho là 1832–1833): chỉ thấy ở Wikipedia; Henle ghi 1843 không nói theo ai. Bản thu: Commons ghi phạm vi công cộng (PD-author, Musopen), IMSLP ghi cùng bản thu là CC BY 4.0 (n29).'
