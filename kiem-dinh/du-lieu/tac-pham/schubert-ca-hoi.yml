    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/imslp-quintet-in-a-major-d667-schubert-franz" ]
    luot_2_ghi_chu: "Tổng phổ tr. 29–31: Thema chỉ đàn dây (piano nghỉ); Var. I giai điệu ở piano; Var. II giai điệu ở viola; Var. III giai điệu ở bè cello và contrabass ('a 2'), piano chạy nốt nhanh."
  - id: n7
    cau: 'Hình cấu trúc: BT 4 ở Rê thứ; BT 5 cello, Si♭; Allegretto với hình đệm của ca khúc gốc (ô dài 1,2).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-score, peters-forelle, sussex-trout ]
    ket_qua: dung
    ghi_chu: 'Var. IV một giáng (Rê thứ), ff; Var. V hai giáng (Si♭ trưởng), giai điệu ở cello; Allegretto: piano hình rải như đệm Die Forelle (Peters tr. 197; Sussex). Độ dài ô tương đối là lựa chọn vẽ của site. Màu: a chủ đề, b biến tấu, c biến tấu giọng thứ, coda.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/imslp-quintet-in-a-major-d667-schubert-franz", "https://archive.org/details/gml-us1860-65-07-schub-trout" ]
    luot_2_ghi_chu: "Tổng phổ: Var. IV hóa biểu một giáng (Rê thứ, tr. 33); Var. V hai giáng (Si♭), giai điệu ở cello (tr. 34–35); 'Allegretto' (Rê trưởng, tr. 36–38) với piano chơi hình liên sáu nốt, đúng hình đệm của ca khúc Die Forelle (bản in 1863, 'Allegretto', liên 6). Độ dài ô 1,2 là cách vẽ của site; Allegretto dài hơn mỗi biến tấu nên hợp lý."
