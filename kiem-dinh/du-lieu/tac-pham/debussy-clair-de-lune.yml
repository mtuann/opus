    ghi_chu: 'Dữ liệu cũ: "Khoảng ABRSM Grade 8 (ước lượng)". Ước lượng ABRSM không nguồn; lần 1 (n4) đã có Trinity Grade 8 và ABRSM không xếp bài. Henle: "Clair de lune D flat major 5 medium"; RCM 2022: Suite bergamasque, Clair de lune ở Level 10. Viết theo nguồn như D6-L3-gom. Đề xuất ở sua-A.yml. Review D6-L5-gom: lượt 2 sai: danh sách ARSM 6/2024 có "Any one from Suite bergamasque". Sửa thong_tin theo câu đúng của lượt 2 (doi_chu trang); không chạy lại. Chữ câu cũ: "Thông tin, độ khó: Trinity xếp bài ở Grade 8 (danh sách từ 2023); không có trong đề cương ABRSM; RCM xếp Suite bergamasque ở Level 10 (2022); Henle mức 5.".'
