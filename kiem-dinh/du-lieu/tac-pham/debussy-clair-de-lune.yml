  - id: n9
    cau: 'Thời kỳ: Cuối thế kỷ 19.'
    loai: lich-su
    truong: [thoi_ky]
    nguon:
      - imslp-bergamasque
      - henle-hn381-vorwort
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: IMSLP ghi Piece Style "Romantic" cho Suite bergamasque; Mutopia style "Modern"; Henle: tác phẩm thời trẻ (1890), sửa 1905. Xếp Debussy vào "Ấn tượng" là lựa chọn của site (như trang lich-su/thoi-ky/the-ky-20). Người giao quyết. Review D6-L5-gom: lượt 1 chưa chắc, lượt 2 khong-chac ("Ấn tượng" không khớp IMSLP Romantic; Henle: hòa âm còn "conventional"). Chọn "Cuối thế kỷ 19" theo năm sáng tác 1890 (Henle HN 381: Debussy tự ghi 1890 lên bản in thử), như satie-gymnopedie (1888, "Cuối thế kỷ 19", D6-L3); trang bài học cũng viết bài "ở ngưỡng giữa thế kỷ 19 và thế kỷ 20". thoi_ky không hiện trên trang nào, nên không có doi_chu. "Ấn tượng" giữ cho debussy-preludes (1909–1913). Không chạy lại lượt 2: chỉ là nhãn của site dựng từ năm lượt 2 đã kiểm. Chữ câu cũ: "Thời kỳ: Ấn tượng.".'
    luot_2: khong-chac
    luot_2_nguon: ["https://imslp.org/wiki/Suite_bergamasque_(Debussy,_Claude)", "https://www.henle.de/en/Clair-de-lune/HN-391"]
    luot_2_ghi_chu: 'Nguồn lệch nhau: IMSLP xếp Suite bergamasque vào thời kỳ và phong cách Romantic; Henle HN 391 nói hòa âm của bài còn "conventional", chỉ báo trước phong cách sau này. Cách xếp "Ấn tượng" phổ biến nhưng không có trong danh sách thời kỳ của site (Trung cổ … Đương đại, hay "A/B"); có thể cân nhắc "Lãng mạn/Thế kỷ 20".'
    review: dung
