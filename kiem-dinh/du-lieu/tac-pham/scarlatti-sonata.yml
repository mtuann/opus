    cau: Tác giả là Domenico Scarlatti.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp-k380, imslp-k141, imslp-k466, henle-k380, henle-k141, henle-k466 ]
    ket_qua: dung
