    ghi_chu: Tên chung chung, nhưng danh_muc liệt kê đúng ba sonata.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Keyboard_Sonata_in_E_major,_K.380_(Scarlatti,_Domenico)", "https://imslp.org/wiki/Keyboard_Sonata_in_D_minor,_K.141_(Scarlatti,_Domenico)", "https://imslp.org/wiki/Keyboard_Sonata_in_F_minor,_K.466_(Scarlatti,_Domenico)", https://id.loc.gov/authorities/names/n81129311.json, https://id.loc.gov/authorities/names/n79085229.json, https://id.loc.gov/authorities/names/n82126429.json ]
    luot_2_ghi_chu: "IMSLP: K.380 = Keyboard Sonata in E major ('Cortège'); K.141 = D minor; K.466 = F minor. LoC: n81129311 'Sonatas, harpsichord, K. 380, E major'; n79085229 'K. 141, D minor'; n82126429 'K. 466, F minor'."
