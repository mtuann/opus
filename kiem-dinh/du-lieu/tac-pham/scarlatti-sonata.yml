  - id: n3
    cau: K. 380, K. 141 và K. 466 là số danh mục của ba sonata trên (K. 380 = L. 23, K. 141 = L. 422, K. 466 = L. 118).
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp-k380, imslp-k141, imslp-k466, henle-k380, henle-k141, henle-k466 ]
    ket_qua: dung
    ghi_chu: "Số L. ở IMSLP: K.380 = L.23, K.141 = L.422, K.466 = L.118; Henle xác nhận L. 23 và L. 422, trang Henle của K. 466 không ghi số L."
