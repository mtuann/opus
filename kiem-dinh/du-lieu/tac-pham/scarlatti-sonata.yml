    luot_2_ghi_chu: "Commons: tác giả Raymond Smullyan, {{cc-by-sa-2.0}}, chỉ có K. 380. IMSLP (cùng bản thu, Al Goldstein archive): 'Smullyan, Raymond = piano'. Không chơi dấu nhắc lại: tự phân tích bản thu (phổ theo nửa cung, so khớp theo độ trễ): các câu ngắn lặp trong bài khớp tới 0,98, còn không có đoạn 20 giây nào khớp với đoạn trước đó quá 0,76, nên nửa đầu (khoảng 75 giây) không được chơi lại; tổng 180 giây khớp với một lượt không nhắc."
