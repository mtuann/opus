    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Keyboard_Sonata_in_E_major,_K.380_(Scarlatti,_Domenico)", "https://imslp.org/wiki/Keyboard_Sonata_in_D_minor,_K.141_(Scarlatti,_Domenico)", "https://imslp.org/wiki/Keyboard_Sonata_in_F_minor,_K.466_(Scarlatti,_Domenico)", https://id.loc.gov/authorities/names/n81129311.json, https://id.loc.gov/authorities/names/n79085229.json, https://id.loc.gov/authorities/names/n82126429.json ]
    luot_2_ghi_chu: "IMSLP Op./Cat. No.: 'K.380 ; L.23 ; P.483 ; CZ.100', 'K.141 ; L.422 ; P.271 ; CZ.118', 'K.466 ; L.118 ; P.501'. LoC: n81129311 (New Grove) 'K. 380=L. 23; E'; n79085229 K. 141, label 'Sonata, re minor, L. 422'; n82126429 K. 466 (Kirkpatrick), label 'Sonata in F minor, L. 118'."
  - id: n4
    cau: 'Thời kỳ: Baroque.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-k380, imslp-k141, imslp-k466 ]
    ket_qua: dung
    ghi_chu: 'IMSLP cả ba trang: "Piece Style=Baroque".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Keyboard_Sonata_in_E_major,_K.380_(Scarlatti,_Domenico)", "https://www.henle.de/media/67/d4/db/1697725838/0574-1697725838-sync.pdf" ]
    luot_2_ghi_chu: "IMSLP: Piece Style = Baroque; Henle HN 574 lời tựa: Scarlatti (1685–1757), so với 'many other Baroque composers'."
  - id: n5
    cau: 'Luyện nghe: hình thức hai đoạn, bắt chéo tay.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ treccani, commons-ms ]
    ket_qua: dung
    ghi_chu: 'Treccani: "bipartito", "incroci di mano"; K. 141 có bắt chéo tay (Worgan 41).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/", "https://www.henle.de/en/Selected-Piano-Sonatas-Volume-I/HN-395" ]
    luot_2_ghi_chu: "Henle HN 395: trong các sonata một chương của Scarlatti 'the interpreter must cross the hands and master wide leaps'. OMT (đọc qua bản lưu Wayback 2025) có ví dụ Scarlatti K. 322 cho hình thức hai đoạn."
  - id: n6
    cau: 'Hình, chú thích: sonata Scarlatti ở hình thức hai đoạn, mỗi nửa nhắc lại.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ treccani, cod-binary, commons-ms ]
    ket_qua: dung
    ghi_chu: 'Treccani "in un sol movimento, bipartito"; dấu nhắc lại thấy ở các bản chép.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/" ]
    luot_2_ghi_chu: "OMT: binary có hai phần (reprises), 'each is typically repeated'; ví dụ Scarlatti K. 322."
  - id: n7
    cau: 'Hình, ba ô đầu: nửa đầu đi từ giọng chính sang giọng mới; chất liệu kết của nửa đầu ở giọng mới; nửa sau đi xa hơn.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ cod-binary ]
    ket_qua: dung
    ghi_chu: 'COD binary form. Màu, trọng số là cách vẽ của site.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/" ]
    luot_2_ghi_chu: "OMT: phần đầu mở có thể chuyển giọng; chất liệu (x) cuối phần đầu ở giọng khác; đầu phần hai không ổn định ('digression', 'departure'), kết phần hai ở giọng chính."
  - id: n8
    cau: 'Hình, ô cuối và ghi chú: chất liệu kết trở lại ở cuối nửa sau, ở giọng chính; từ điểm crux, phần cuối của hai nửa "gieo vần" với nhau.'
    loai: cau-truc
    truong: [ hinh ]
    nguon:
      - omt-binary
    ket_qua: dung
    ghi_chu: 'chưa chắc: như hồ sơ trang nghe-nhac/scarlatti-sonata n14, n15 (Open Music Theory 403, sách Kirkpatrick 1953 là sách in). Nếu lượt 2 không tìm được nguồn cho tên crux thì đề xuất ở sua-A.yml: ghi_chu bỏ "Từ điểm crux,". Review D6-L7-gom: lượt 1 chưa chắc, lượt 2 dung theo Open Music Theory; review mở lại bản lưu Wayback 2024: "In order to be considered a return, there needs to be a crux point—a particular moment where the restatement begins at the tail end of the second reprise". Ghi chú hình không ghi tên Kirkpatrick, nên giữ chữ crux; mục có điều kiện của d6-l7/sua-A.yml không áp. Trang (n15) bỏ tên Kirkpatrick.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/" ]
    luot_2_ghi_chu: "OMT, 'Balancing a Binary Form': chất liệu cuối phần đầu trở lại cuối phần hai, chuyển về giọng chính; 'there needs to be a crux point … a direct bar-for-bar mapping of measures between the tail ends of both reprises'; ví dụ Scarlatti K. 322. 'Gieo vần' là cách nói ẩn dụ, đặt trong ngoặc kép, hợp với nội dung này. Thuật ngữ crux gốc của Kirkpatrick: chưa mở sách của ông, nhưng câu không ghi tên ai."
    review: dung
