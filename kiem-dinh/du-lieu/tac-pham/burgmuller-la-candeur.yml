  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 2–3.
    loai: cap-do
    truong:
      - grade
    nguon:
      - henle-hn1726
      - abrsm-2122
      - abrsm-2728
      - henle-thang
    ket_qua: dung
    ghi_chu: 'Nói theo kiểu tương đương: La candeur không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023, và không thấy trong RCM 2022. Henle xếp mức 1 (easy), bằng "Innocence" (số 5) ở ABRSM Grade 3 (2021–2022) và "Douce plainte" (số 16) ở Grade 3 (2027–2028). Khoảng Grade 2–3 bao Grade 3; bằng chứng nghiêng về đầu trên (Grade 3).'
    luot_2: dung
    luot_2_nguon: [ https://www.henle.de/en/25-Etudes-op.-100/HN-1726, https://web.archive.org/web/20201112011213/https://gb.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf, https://web.archive.org/web/20211206105029/https://gb.abrsm.org/media/65198/piano-g3-2021-2022-rev-sep-2020.pdf ]
    luot_2_ghi_chu: No syllabus (ABRSM 2013-26, Trinity, RCM) lists no.1 itself. Henle level 1, the lowest tier, same as Op.100 nos. 2, 3, 5 etc.; of those ABRSM lists no.2 at Grade 2 (2019-20) and no.5 at Grade 3 (2021-22). So Grade 2-3 is supported indirectly.
  - id: n5
    cau: Bài thuộc chặng 2 (Grade 1–2) của lộ trình piano.
