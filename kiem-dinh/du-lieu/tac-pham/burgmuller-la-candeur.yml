    ket_qua: dung
    ghi_chu: "Khoảng Grade 2–3 nằm giữa chặng 2 (Grade 1–2) và chặng 3 (Grade 3); dữ liệu chọn chặng 2 (đầu dưới), hợp lệ theo luật kiểm chéo, dù bằng chứng nghiêng về Grade 3 (chặng 3): chủ repo có thể cân nhắc."
    luot_2: dung
    luot_2_nguon: [ https://www.henle.de/en/25-Etudes-op.-100/HN-1726 ]
    luot_2_ghi_chu: Stage 2 = Grade 1-2; consistent with the low end of 2-3.
