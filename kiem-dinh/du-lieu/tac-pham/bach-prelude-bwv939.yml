  - id: n2
    cau: "Tác giả: Johann Sebastian Bach."
    loai: lich-su
    truong:
      - tac_gia
    nguon:
      - imslp-bwv939
      - henle-hn106
      - rcm-2022
    ket_qua: dung
    ghi_chu: IMSLP, Henle HN 106 (ấn bản Urtext "Little Preludes and Fughettas" của Bach) và RCM 2022 ("Little Prelude in C Major, BWV 939 — J.S. Bach") đều ghi Bach, không kèm chú thích nghi vấn. Lời nói đầu của Henle chỉ nêu nghi vấn tác giả cho hai prelude khác (I, 6 và I, 7 theo cách đánh số của ấn bản), và ghi nhóm III (BWV 939–943) chỉ có một bản chép của Kellner "ohne besondere Überschrift" (không đề tựa riêng). Không mở được Bach-Digital để đối chiếu thêm; lượt 2 nên xem lại chỗ này.
  - id: n3
    cau: "Số danh mục: BWV 939."
    loai: danh-muc
    truong:
      - danh_muc
    nguon:
      - imslp-bwv939
      - henle-hn106
    ket_qua: dung
    ghi_chu: 'IMSLP: Op./Cat. No. "BWV 939–943"; mục 1 là BWV 939. Henle: "Little Prelude BWV 939".'
  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 3.
    loai: cap-do
    truong:
      - grade
    nguon:
      - henle-hn106
      - rcm-2022
      - abrsm-2526
      - henle-hn619
      - henle-thang
    ket_qua: dung
    ghi_chu: 'Nói theo kiểu tương đương: BWV 939 không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle xếp mức 2 (easy); RCM 2022: "Little Prelude in C Major, BWV 939" ở Level 5 (các little prelude khác BWV 934, 941 ở Level 6; BWV 942 ở Level 7). Các bài Henle mức 2 và RCM Level 5 thường nằm quanh Grade 3–4 ở ABRSM (ví dụ Waltz Op. 12 số 2 của Grieg: Henle 3, RCM Level 5, ABRSM Grade 4 ở 2025–2026). Kết luận: khoảng Grade 3 (có thể tới 4).'
