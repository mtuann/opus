    ket_qua: dung
    ghi_chu: 'Review (24/10/2026): giữ "khoảng Grade 3" là ước lượng: không đề cương nào xếp riêng BWV 939; Henle mức 2 (dễ) ủng hộ, RCM Level 5 cao hơn; các prelude nhỏ cùng tập ở ABRSM Grade 4–5 (lượt 2). Nói theo kiểu tương đương: BWV 939 không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle xếp mức 2 (easy); RCM 2022: "Little Prelude in C Major, BWV 939" ở Level 5 (các little prelude khác BWV 934, 941 ở Level 6; BWV 942 ở Level 7). Các bài Henle mức 2 và RCM Level 5 thường nằm quanh Grade 3–4 ở ABRSM (ví dụ Waltz Op. 12 số 2 của Grieg: Henle 3, RCM Level 5, ABRSM Grade 4 ở 2025–2026). Kết luận: khoảng Grade 3 (có thể tới 4).'
    luot_2: khong-chac
    luot_2_nguon: [ https://www.henle.de/en/Little-Preludes-and-Fughettas/HN-106, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, https://web.archive.org/web/20160528022840/http://gb.abrsm.org:80/fileadmin/user_upload/syllabuses/piano0515.pdf, https://web.archive.org/web/20191112232528/https://us.abrsm.org/media/12152/piano_2017___2018.pdf ]
    luot_2_ghi_chu: No ABRSM/Trinity listing of BWV 939 itself. Henle level 2 (easy); RCM 2022 Level 5, i.e. two RCM levels above the Notebook minuets/Musette (RCM Level 3 = Trinity/ABRSM Grade 2), so about Grade 4. ABRSM lists sibling Little Preludes at Grade 5 (BWV 934 in 2015-16, BWV 938 in 2017-18; Henle 2-3) and BWV 999 at Grade 4 (2021-22). Plausible range Grade 3-5, most likely 4-5; "khoảng Grade 3" is the low end, unconfirmed.
