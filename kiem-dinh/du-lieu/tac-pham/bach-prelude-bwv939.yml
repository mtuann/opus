    ghi_chu: IMSLP, Henle HN 106 (ấn bản Urtext "Little Preludes and Fughettas" của Bach) và RCM 2022 ("Little Prelude in C Major, BWV 939 — J.S. Bach") đều ghi Bach, không kèm chú thích nghi vấn. Lời nói đầu của Henle chỉ nêu nghi vấn tác giả cho hai prelude khác (I, 6 và I, 7 theo cách đánh số của ấn bản), và ghi nhóm III (BWV 939–943) chỉ có một bản chép của Kellner "ohne besondere Überschrift" (không đề tựa riêng). Không mở được Bach-Digital để đối chiếu thêm; lượt 2 nên xem lại chỗ này.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/5_Kleine_Pr%C3%A4ludien,_BWV_939-943_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "IMSLP composer: Bach, Johann Sebastian (BWV 939 is in the main BWV catalogue; only BWV 942 is doubtful)."
