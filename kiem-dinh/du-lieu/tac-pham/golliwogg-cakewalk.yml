nhan_dinh:
  - id: n1
    cau: 'Golliwogg''s Cakewalk là bài số 6 của Children''s Corner, số danh mục L. 113, của Debussy; trang chính là hướng dẫn nghe.'
    loai: danh-muc
    nguon: [ imslp-cc, durand-1908 ]
    truong: [ ten, tac_gia, danh_muc, loai ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "CD 119 ; L.113", số 6 Golliwog''s Cake-walk. Bản quét tr. 24 "VI. Golliwogg''s cake walk" (cách viết hai chữ g của Debussy). danh_muc "L. 113 số 6" theo kiểu bản ghi debussy-arabesque-1 ("L. 66 số 1").'
  - id: n2
    cau: 'Thời kỳ: Ấn tượng.'
    loai: lich-su
    nguon: [ imslp-cc ]
    truong: [ thoi_ky ]
    ket_qua: dung
    ghi_chu: 'Viết 1906–1908; nhãn như bản ghi debussy-preludes (1909–1910, Ấn tượng) của site; IMSLP ghi Piece Style Romantic, nhãn thời kỳ là cách xếp của site.'
  - id: n3
    cau: 'Luyện nghe: đảo phách kiểu ragtime trên nhịp đệm đều; câu trích Tristan und Isolde giữa điệu nhảy.'
    loai: cau-truc
    nguon: [ henle-hn382, laits-tristan, ptna-630, durand-1908 ]
    truong: [ luyen_nghe ]
    ket_qua: dung
    ghi_chu: 'Henle: "in ragtime style". LAITS: tay trái đệm, giai điệu tay phải đảo phách; câu mở đầu Tristan ở ô 61. Bản quét tr. 24 (nhịp đệm, đảo phách), tr. 26 (Cédez, avec une grande émotion).'
  - id: n4
    cau: 'Đối chiếu: chép tay từ bản quét Durand & Fils (bản khắc 1908, D. & F. 7188), IMSLP #252526.'
    loai: ten
    nguon: [ durand-1908, imslp-cc ]
    truong: [ doi_chieu ]
    ket_qua: dung
    ghi_chu: 'Không có bản số mở (Mutopia không có thư mục L113 trong DebussyC, xem GitHub MutopiaProject 17/11/2026); hai trích đoạn chép tay từ bản quét (hồ sơ trang, khuong_nhac).'
  - id: n5
    cau: 'Sơ đồ: 128 ô nhịp 2/4, ba phần, phần đầu trở lại sau đoạn giữa; Mở đầu ô 1–9 (nhịp đệm), Chủ đề ô 10–25 (Mi♭ trưởng, đảo phách), Ý thứ hai ô 26–46 (hợp âm p, thưa dần), Đoạn giữa ô 47–60 (chậm hơn, pp), Câu của Wagner ô 61–89 (Tristan und Isolde, cắt ngang), Phần đầu trở lại ô 90–125, Kết ô 126–128 (ff); chỉ ba ô cuối khác hẳn, kết bằng hai hợp âm ff thay vì thưa dần.'
    loai: cau-truc
    nguon: [ durand-1908, imslp-cc, henle-382-comments ]
    truong: [ hinh ]
    ket_qua: dung
    ghi_chu: 'Đếm ô trên bản quét (hồ sơ trang, ghi_chu): 25 + 27 + 25 + 24 + 27 = 128; IMSLP 128 bars, E-flat major; 2/4 ở tr. 24 hệ 1. Ô 47 Un peu moins vite pp (tr. 25 hệ 5); ô 61 Cédez (tr. 26 hệ 2); ô 90 Toujours retenu (tr. 27 hệ 3); ô 126–128 f rồi ff (tr. 28 hệ 5); ô 46 più p (tr. 25 hệ 4). Phần đầu trở lại song song ô 10–45, lệch 80 ô (Henle M 28/108, 36/116). Đoạn giữa ô 47–89 chia hai ô ở ô 61 cho dễ nhìn.'
  - id: n6
    cau: 'Độ dài các ô của sơ đồ theo bản thu: 11, 16, 21, 20, 47, 38, 5 giây.'
    loai: so-lieu
    nguon: [ commons-elduende ]
    truong: [ hinh ]
    ket_qua: dung
    ghi_chu: 'Mốc đo (hồ sơ trang n27): ô 10 ≈ 10,6 s, ô 26 ≈ 27, ô 47 48,1, ô 61 ≈ 67,8, ô 90 114,6, ô 126 ≈ 153,2, tiếng đàn tới khoảng 158 s (hợp âm cuối 157,18 s; độ to dưới −50 dB từ giây 158). Làm tròn: 11, 16, 21, 20, 47, 38, 5.'
  - id: n7
    cau: 'Bản thu: eldüendesüarez, CC BY 4.0, Wikimedia Commons, 160,5 s.'
