nhan_dinh:
  - { id: n1, cau: 'Tên Romanian Folk Dances (Rumänische Volkstänze) Sz. 56; tác giả Béla Bartók; danh mục Sz. 56; loại bài học; thời kỳ Thế kỷ 20.', loai: ten, truong: [ ten, tac_gia, danh_muc, loai, thoi_ky ], nguon: [ imslp-sz56, ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)", "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "IMSLP: Romanian Folk Dances, Alternative Title Rumänische Volkstänze, Opus/Catalogue Number 'Sz.56 ; BB 68', Piece Style 'Early 20th century' (Thế kỷ 20 hợp lý). Bản quét ghi Béla Bartók, Rumänische Volkstänze. Loại 'bài học' là chuyện của site, không kiểm ngoài." }
  - { id: n2, cau: 'Chặng 5, Grade 6 (ước lượng cho cả bộ); từng điệu: điệu 3 ABRSM Grade 4 (2015–2016), điệu 4 (ô 1–18) Trinity Grade 5 (từ 2023); Henle 3, 2, 3, 3, 4, 4.', loai: cap-do, truong: [ chang, grade, chip, thong_tin ], nguon: [ abrsm-1516-g4, trinity-2023, henle-hn1402, cap-do ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://web.archive.org/web/2015/http://gb.abrsm.org/fileadmin/user_upload/syllabuses/piano0415.pdf", "https://www.trinitycollege.com/qualifications/music/grade-exams/piano/piano-grade-5", "https://www.henle.de/en/Romanian-Folk-Dances/HN-1402" ], luot_2_ghi_chu: "ABRSM 2015 & 2016 Grade 4 List C số 4 = Der Stampfer (điệu 3); Trinity Grade 5 from 2023 = Dance of Buchum ô 1–18 không nhắc lại (điệu 4); Henle 3, 2, 3, 3, 4, 4. 'Grade 6 cho cả bộ' tự ghi là ước lượng, không có đề cương nào nêu; hợp lý vì cao hơn điệu khó nhất có trong đề cương (G5) và hai điệu cuối Henle 4. Chặng 5 là xếp của site.", ghi_chu: 'Review (Claude Opus, 17/11/2026): Henle HN 1402 (mở lại): Stick 3, Sash 2, In One Spot 3, Buchum 3, Polka 4, Fast Dance 4; chặng 5 khớp piano/tac-pham-theo-cap.', review: dung }
  - { id: n3, cau: 'Kỹ năng: sáu điệu tương phản về nhịp, tốc độ, màu âm; giai điệu trên đệm nhịp nhảy; phát âm tách và nhấn; vùng rất cao (điệu 3); quãng hai tăng (điệu 4); nhịp đổi (điệu 5); nhanh dần ở hai điệu cuối.', loai: cau-truc, truong: [ ky_nang_chinh, thong_tin ], nguon: [ ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét: sáu điệu khác nhịp (2/4, 3/4, đổi nhịp ở điệu 5), tốc độ 80–160, màu âm (điệu 3 vùng rất cao, pp–ppp); giai điệu trên đệm nốt trầm – hợp âm; staccato, tenuto, sf, nhấn; điệu 4 có Si♭ và Đô♯ (quãng hai tăng); điệu 5 đổi 2/4–3/4; điệu 5, 6 ♩=152 rồi Più allegro ♩=160." }
  - { id: n4, cau: 'Đối chiếu: điệu 2 Mutopia (PD, theo UE 1918) đối chiếu bản quét; các điệu khác bản quét UE 1918.', loai: ten, truong: [ doi_chieu ], nguon: [ ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://raw.githubusercontent.com/MutopiaProject/MutopiaProject/master/ftp/BartokB/rom_folk_dance_1_bartok/rom_folk_dance_1_bartok.ly", "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Mutopia: title 'Romanian Folk Dance No.2', mutopiasource 'Vienna: Universal Edition, 1918', mutopialicense 'Public Domain'; nốt ô 1–16 khớp bản quét tr. 4 (đã so ô 1–4 kỹ). Mutopia chỉ có điệu 2 (thư mục ftp/BartokB chỉ có một bản), nên điệu khác chỉ đối chiếu bản quét." }
  - { id: n5, cau: 'Không vào gợi ý tập ở trang chủ (goi_y false).', loai: khuyen-tap, truong: [ goi_y ], nguon: [], ket_qua: khong-can-nguon, luot_2: dung, luot_2_ghi_chu: "khuyen-tap: lựa chọn của site, không có gì sai hay có hại." }
  - { id: n6, cau: 'Chip: Sz. 56, sáu điệu múa; viết năm 1915, in năm 1918; khoảng 5 phút.', loai: so-lieu, truong: [ chip ], nguon: [ henle-hn1402, ue-1918, imslp-sz56 ], ket_qua: dung, ghi_chu: 'Khoảng 5 phút: bản thu Breemer 5:22.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)", "https://imslp.org/wiki/Special:ImagefromIndex/991622" ], luot_2_ghi_chu: "IMSLP: Sz.56, 6 dances, sáng tác 1915, xuất bản lần đầu 1918. Bản thu Breemer: nhạc 2,6–318,3 s, khoảng 5 phút." }
  - { id: n7, cau: 'Dòng Tác phẩm: Rumänische Volkstänze aus Ungarn (điệu múa dân gian Romania ở Hungary), sáu điệu múa ngắn chơi liền, mỗi điệu trên một giai điệu múa dân gian của người Romania sống trong nước Hungary thời ấy; bản in ghi tên làng nơi giai điệu được tìm thấy.', loai: lich-su, truong: [ thong_tin ], nguon: [ ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét tr. 2: 'Rumänische Volkstänze aus Ungarn' (điệu múa dân gian Romania từ Hungary); sáu điệu ngắn (1–3 trang mỗi điệu); chú thích chân trang ghi làng và hạt nơi tìm thấy (Mezőszabad, Egres, Bisztra, Belényes, Nyágra), đều thuộc Vương quốc Hungary thời ấy." }
  - { id: n8, cau: 'Dòng Sáng tác / xuất bản: viết 1915; Universal Edition (Wien, Leipzig) in 1918, U.E. 5802; đề tặng giáo sư Ioan Bușiția; về sau Bartók soạn bản cho dàn nhạc.', loai: nam, truong: [ thong_tin ], nguon: [ henle-hn1402, ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)", "https://imslp.org/wiki/Special:ImagefromIndex/918136", "https://www.henle.de/en/Romanian-Folk-Dances/HN-1402" ], luot_2_ghi_chu: "IMSLP: 1915; Universal Edition, Vienna, 1918, U.E. 5802; bản dàn nhạc Sz.68. Bản quét: 'Universal-Edition A. G. Wien … Leipzig', 'Universal-Edition Nr. 5802', đề tặng 'Domnului Prof. Ioan Bușiția'. Henle: 'a later orchestral version of his own'." }
  - { id: n9, cau: 'Dòng Giọng · nhịp · tốc độ: sáu tốc độ, số máy đếm nhịp và nhịp như bản in 1918.', loai: so-lieu, truong: [ thong_tin ], nguon: [ ue-1918 ], ket_qua: dung, ghi_chu: Như hồ sơ trang n20–n21., luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét có đủ sáu chữ tốc độ, số ♩ (80, 144, 112, 100, 152, 152/160) và nhịp như n20, n21 của trang." }
  - { id: n10, cau: 'Dòng Hình thức: tổ khúc sáu điệu, chậm và nhanh xen nhau, hai điệu cuối nhanh nhất.', loai: cau-truc, truong: [ thong_tin ], nguon: [ ue-1918 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Bản quét: Allegro moderato, Allegro, Andante, Molto moderato, Allegro, Allegro/Più allegro: vừa – nhanh – chậm – chậm – nhanh – nhanh hơn; 'xen nhau' hiểu rộng là đúng (điệu 3, 4 chậm liền nhau), hai điệu cuối nhanh nhất (♩=152, 160)." }
  - { id: n11, cau: 'Dòng Nhà soạn nhạc: Béla Bartók (1881–1945); dòng Bản nhạc: IMSLP có bản quét UE 1918, Urtext Henle HN 1402.', loai: ten, truong: [ thong_tin ], nguon: [ imslp-sz56, henle-hn1402 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://www.henle.de/en/Romanian-Folk-Dances/HN-1402", "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)" ], luot_2_ghi_chu: "Henle (tiểu sử): sinh 1881, mất New York 26/9/1945; sản phẩm 'Urtext Edition … HN 1402' (László Somfai). IMSLP có bản quét UE 1918 (#918136, Public Domain)." }
  - { id: n12, cau: 'Sơ đồ: sáu ô theo sáu điệu, tên, tốc độ, nhịp; độ dài ô theo bản thu (70, 31, 66, 42, 33, 58 giây).', loai: cau-truc, truong: [ hinh ], nguon: [ ue-1918 ], ket_qua: dung, ghi_chu: 'Độ dài từ khoảng lặng của bản thu (hồ sơ trang, nguồn breemer-ban-thu): 2,6–73,0; 76,3–107,8; 111,5–177,3; 181,6–223,5; 227,0–259,6; 260,2–318,3.', luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/991622", "https://imslp.org/wiki/Special:ImagefromIndex/918136" ], luot_2_ghi_chu: "Đo bản thu (ffmpeg silencedetect −45 dB, librosa RMS): điệu 1 2,59–72,97 s = 70,4; điệu 2 76,25–107,78 = 31,5; điệu 3 111,49–177,31 = 65,8; điệu 4 181,56–223,53 = 42,0; điệu 5 227,03–259,6 = 32,6; điệu 6 260,2–318,35 = 58,2. Khớp 70, 31, 66, 42, 33, 58 trong ±1 s. Tên, tốc độ, nhịp lấy từ bản quét như n11, n20, n21." }
  - { id: n13, cau: 'Bản thu: Chris Breemer, CC0 1.0, IMSLP #991622, một file 322,01 s, chỉ dẫn link.', loai: ten, truong: [ ban_thu ], nguon: [ imslp-sz56 ], ket_qua: dung, luot_2: dung, luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/991622", "https://imslp.org/wiki/Romanian_Folk_Dances,_Sz.56_(Bart%C3%B3k,_B%C3%A9la)" ], luot_2_ghi_chu: "IMSLP wikitext: Breemer, Chris (piano), Copyright 'Creative Commons Zero 1.0', Complete Performance, một file. File tải tay tên IMSLP991622-PMLP3387-…-breemer.mp3, ffprobe 322,011 s. 'Chỉ dẫn link' là cách site dùng, không kiểm ngoài.", ghi_chu: 'Review (Claude Opus, 17/11/2026): IMSLP API wikitext: PMLP3387-bartok-romanian-folk-dances-breemer.mp3, Complete Performance, Breemer, Chris (piano), Copyright "Creative Commons Zero 1.0"; lic CC0, licUrl publicdomain/zero/1.0 đúng.', review: dung }
