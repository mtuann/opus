nhan_dinh:
  - id: n1
    cau: "Tên bài: Gymnopédie số 1 (bài đầu trong bộ Trois Gymnopédies cho piano)."
    loai: ten
    truong:
      - ten
    nguon:
      - imslp-gymnopedies
      - henle-hn1072
    ket_qua: dung
    ghi_chu: 'IMSLP: "Trois Gymnopédies", mục 1 "Lent et douloureux (D major, 78 bars)". Henle HN 1072: "Gymnopédie no. 1".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/3_Gymnop%C3%A9dies_(Satie,_Erik)", https://catalogue.bnf.fr/ark:/12148/cb13918639z ]
    luot_2_ghi_chu: 'IMSLP: Trois Gymnopédies (3 pieces), no.1 Lent et douloureux (D major); BnF record lists "Gymnopédies No 1/2/3" as components of "[Trois gymnopédies]" (1888).'
  - id: n2
    cau: "Tác giả: Erik Satie."
    loai: lich-su
    truong:
      - tac_gia
    nguon:
      - imslp-gymnopedies
      - henle-hn1072
    ket_qua: dung
    ghi_chu: 'IMSLP: Composer "Satie, Erik"; in lần đầu năm 1888 (số 1 và 3 tự xuất bản ở Paris). Henle HN 1072 là ấn bản Urtext của Satie.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/3_Gymnop%C3%A9dies_(Satie,_Erik)" ]
    luot_2_ghi_chu: "IMSLP composer: Satie, Erik."
  - id: n3
    cau: Gymnopédie số 1 không có số opus hay số danh mục chuẩn (bản ghi để trống danh_muc).
    loai: danh-muc
    truong:
      - danh_muc
    nguon:
      - imslp-gymnopedies
      - henle-hn1072
    ket_qua: dung
    ghi_chu: IMSLP không có dòng "Opus/Catalogue Number" cho Trois Gymnopédies; trang Henle HN 1072 cũng không ghi số danh mục. Không có danh mục nào được các nguồn đã mở dùng cho bài này.
    luot_2: dung
    luot_2_nguon: [ https://catalogue.bnf.fr/ark:/12148/cb13918639z, "https://imslp.org/wiki/3_Gymnop%C3%A9dies_(Satie,_Erik)" ]
    luot_2_ghi_chu: BnF authority record gives no opus number or catalogue number (numéro d'opus / indice thématique); IMSLP page has no Opus/Catalogue Number field. (Henle HN 1072 is a publisher number.)
  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 4.
    loai: cap-do
    truong:
      - grade
    nguon:
      - henle-hn1072
      - henle-hn1726
      - abrsm-2526
      - trinity-2023
      - henle-hn1073
      - rcm-2022
      - henle-thang
    ket_qua: dung
    ghi_chu: 'Review (24/10/2026): giữ "Grade 4" là ước lượng: không đề cương nào xếp bài; Henle mức 2. Nói theo kiểu tương đương: không có đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016), Trinity (từ 2023) hay RCM 2022 nào liệt kê Gymnopédie số 1 (ABRSM chỉ có Satie "What the Little Princess Tulip Says" ở Initial Grade). Henle xếp cả ba Gymnopédie mức 2 (easy). Bài cùng mức 2 ở đề cương: Burgmüller Op. 100 "Ballade" (số 15) ABRSM Grade 4 và "La tarantelle" (số 20) Grade 5 (2025–2026), "Barcarolle" (số 22) Trinity Grade 4. RCM 2022 xếp Gnossienne số 3 (cùng Henle 2) ở Level 8, cao hơn: lượt 2 nên xem lại. Kết luận: khoảng Grade 4 (có thể 3–5).'
    luot_2: khong-chac
    luot_2_nguon: [ https://www.henle.de/en/Gymnopedies/HN-1072, https://www.henle.de/en/From-Bach-to-Gershwin-All-time-favourites/HN-1750 ]
    luot_2_ghi_chu: No ABRSM/Trinity/RCM listing of Gymnopédie No.1 found (ABRSM lists only Satie's "What the Little Princess Tulip Says" at Initial Grade). Henle level 2 (easy) for all three Gymnopédies (HN 1072, also HN 1750 anthology), no ABRSM cross-reference; roughly Grade 3-5, "khoảng Grade 4" consistent but unconfirmed.
  - id: n5
    cau: Bài thuộc chặng 4 (Grade 4–5) của lộ trình piano.
    loai: cap-do
    truong:
      - chang
    nguon:
      - henle-hn1072
    ket_qua: dung
    ghi_chu: "Review (24/10/2026): giữ chặng 4 theo n4. Chặng 4 = Grade 4–5 (cap-do.yml); khớp với grade ở n4."
    luot_2: khong-chac
    luot_2_nguon: [ https://www.henle.de/en/Gymnopedies/HN-1072 ]
    luot_2_ghi_chu: Follows n4 (no official listing).
