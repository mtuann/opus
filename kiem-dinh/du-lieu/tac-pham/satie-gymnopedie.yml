    link: https://www.henle.de/en/Gnossiennes/HN-1073
  - id: rcm-2022
    bac: 2
    ten: The Royal Conservatory (RCM), Piano Syllabus, 2022 Edition
    link: https://teacherportal.rcmusic.com/getattachment/57f3734d-97e5-4777-b67e-4b1111ee31a3/piano-syllabus-2022-edition.pdf
  - id: henle-thang
    bac: 2
    ten: G. Henle Verlag, Levels of Difficulty (thang độ khó 1–9; trang không có bảng quy đổi sang ABRSM)
    link: https://www.henle.de/Levels-of-Difficulty/
nhan_dinh:
  - id: n1
    cau: "Tên bài: Gymnopédie số 1 (bài đầu trong bộ Trois Gymnopédies cho piano)."
    loai: ten
    truong:
      - ten
    nguon:
      - imslp-gymnopedies
      - henle-hn1072
    ket_qua: dung
    ghi_chu: 'IMSLP: "Trois Gymnopédies", mục 1 "Lent et douloureux (D major, 78 bars)". Henle HN 1072: "Gymnopédie no. 1".'
  - id: n2
    cau: "Tác giả: Erik Satie."
    loai: lich-su
    truong:
      - tac_gia
    nguon:
      - imslp-gymnopedies
      - henle-hn1072
    ket_qua: dung
    ghi_chu: 'IMSLP: Composer "Satie, Erik"; in lần đầu năm 1888 (số 1 và 3 tự xuất bản ở Paris). Henle HN 1072 là ấn bản Urtext của Satie.'
  - id: n3
    cau: Gymnopédie số 1 không có số opus hay số danh mục chuẩn (bản ghi để trống danh_muc).
    loai: danh-muc
    truong:
      - danh_muc
    nguon:
      - imslp-gymnopedies
      - henle-hn1072
    ket_qua: dung
    ghi_chu: IMSLP không có dòng "Opus/Catalogue Number" cho Trois Gymnopédies; trang Henle HN 1072 cũng không ghi số danh mục. Không có danh mục nào được các nguồn đã mở dùng cho bài này.
  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 4.
    loai: cap-do
    truong:
      - grade
    nguon:
      - henle-hn1072
      - henle-hn1726
      - abrsm-2526
      - trinity-2023
      - henle-hn1073
      - rcm-2022
      - henle-thang
    ket_qua: dung
    ghi_chu: 'Nói theo kiểu tương đương: không có đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016), Trinity (từ 2023) hay RCM 2022 nào liệt kê Gymnopédie số 1 (ABRSM chỉ có Satie "What the Little Princess Tulip Says" ở Initial Grade). Henle xếp cả ba Gymnopédie mức 2 (easy). Bài cùng mức 2 ở đề cương: Burgmüller Op. 100 "Ballade" (số 15) ABRSM Grade 4 và "La tarantelle" (số 20) Grade 5 (2025–2026), "Barcarolle" (số 22) Trinity Grade 4. RCM 2022 xếp Gnossienne số 3 (cùng Henle 2) ở Level 8, cao hơn: lượt 2 nên xem lại. Kết luận: khoảng Grade 4 (có thể 3–5).'
  - id: n5
    cau: Bài thuộc chặng 4 (Grade 4–5) của lộ trình piano.
    loai: cap-do
    truong:
      - chang
    nguon:
      - henle-hn1072
    ket_qua: dung
    ghi_chu: Chặng 4 = Grade 4–5 (cap-do.yml); khớp với grade ở n4.
