    ket_qua: dung
    ghi_chu: "Review (24/10/2026): giữ chặng 4 theo n4. Chặng 4 = Grade 4–5 (cap-do.yml); khớp với grade ở n4."
    luot_2: khong-chac
    luot_2_nguon: [ https://www.henle.de/en/Gymnopedies/HN-1072 ]
    luot_2_ghi_chu: Follows n4 (no official listing).
