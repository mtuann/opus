nguon:
  - id: imslp-gymnopedies
    bac: 2
    ten: IMSLP, 3 Gymnopédies (Satie)
    link: https://imslp.org/wiki/3_Gymnop%C3%A9dies_(Satie,_Erik)
  - id: henle-hn1072
    bac: 2
    ten: G. Henle Verlag, HN 1072 Satie, Gymnopédies (mức khó từng bài)
    link: https://www.henle.de/en/Gymnopedies/HN-1072
  - id: henle-hn1726
    bac: 2
    ten: G. Henle Verlag, HN 1726 Burgmüller, 25 Etudes op. 100 (mức khó từng bài)
    link: https://www.henle.de/en/25-Etudes-op.-100/HN-1726
  - id: abrsm-2526
