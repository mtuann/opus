    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Musette_in_D_major,_BWV_Anh.126_(Bach,_Johann_Sebastian)", "https://imslp.org/wiki/Notebooks_for_Anna_Magdalena_Bach_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: 'IMSLP: "Musette in D major, BWV Anh.126", "1725 from the Notebooks for Anna Magdalena Bach (No.22)"; Notebook page: "22. Musette D-dur, BWV Anh.126" in the Klavierbüchlein von 1725.'
  - id: n2
    cau: Tác giả không rõ (khuyết danh); bài từng được gán cho J. S. Bach nhưng số Anh. 126 thuộc phụ lục của danh mục BWV.
    loai: lich-su
    truong:
      - tac_gia
      - khuyet_danh
    nguon:
      - abrsm-1920
      - imslp-anh126
      - rcm-2022
    ket_qua: dung
    ghi_chu: 'ABRSM 2019–2020 ghi tác giả "Anon." (Grade 2). RCM 2022 ghi "attr. J.S. Bach". IMSLP xếp bài dưới Bach nhưng với số phụ lục BWV Anh. 126. Không nguồn nào mở được xác lập tác giả; theo kết quả tìm kiếm Bach-Digital ghi "unknown" nhưng trang không mở được nên không dùng làm nguồn. Hợp với khuyet_danh: true; cách thay thế là tac_gia: bach kèm gan_cho: true (RCM, IMSLP): quyết định biên tập.'
    luot_2: dung
    luot_2_nguon: [ https://web.archive.org/web/20201112011213/https://gb.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, "https://imslp.org/wiki/Musette_in_D_major,_BWV_Anh.126_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: 'ABRSM 2019-20 Grade 2 lists it as "Anon. - Musette in D, BWV Anh. II 126"; RCM 2022 Level 3 lists it as "Bach, Johann Sebastian, attr." ("attr. J.S. Bach"). IMSLP files the page under Bach but with appendix numbering "BWV Anh.126 ; BWV Anh. II 126". So: author unknown, once attributed to Bach, appendix number - matches the claim.'
