nguon:
  - id: arvopart
    bac: 2
    ten: Arvo Pärt Centre (trang chính thức), Spiegel im Spiegel
    link: https://www.arvopart.ee/en/arvo-part/work/544/
  - id: ecm
    bac: 2
    ten: "ECM Records, Arvo Pärt: Alina (ECM 1591)"
    link: https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/
  - id: ap-bio
    bac: 2
    ten: 'Trung tâm Arvo Pärt, Biography (đọc 06/11/2026): "In 1976, Pärt emerged with a new and highly original musical language, which he called tintinnabuli"; "Tintinnabuli music can also be described as a style in which the musical material is extremely concentrated … expressing the composer’s special relationship to silence"; "a large part of the contemporary music has been influenced by his tintinnabuli compositions"'
    link: https://www.arvopart.ee/en/arvo-part/biography/
  - id: ap-544b
    bac: 2
    ten: 'Trung tâm Arvo Pärt, Spiegel im Spiegel (đọc 06/11/2026): 1978; "the piano part includes tintinnabuli notes – like little bells"; "The musical material … is presented with utmost clarity and strictness"'
    link: https://www.arvopart.ee/en/arvo-part/work/544/
  - id: ap-544
    bac: 2
    ten: 'Trung tâm Arvo Pärt (trang chính thức), Spiegel im Spiegel (đọc 06/11/2026): "1978", "Scored for violin and piano", "Duration 10 min", "(Mirror in the Mirror)"; "In 1978, the renowned Russian violinist Vladimir Spivakov commissioned a piece … premiered it at the Moscow Conservatory"; "It only consists of the melody of the solo instrument and the three-note piano accompaniment"; "each ascending melodic line is followed by a descending mirror phrase. Initially, the melody consists of only two notes, with another note being added with each of the following phrases"; "After each distancing, the melody returns to the central pitch of A"; "the piano part includes tintinnabuli notes – like little bells that alternately sound above and below the melodic line"; "numerous versions for various instrument combinations"; "CD Alina. ECM New Series 1591"; "© Universal Edition AG, Wien"'
    link: https://www.arvopart.ee/en/arvo-part/work/544/
  - id: kiral
    bac: 2
    ten: 'Firtina Kiral, luận văn "Arvo Pärt | Holy Minimalism | Silence" (2025), Research Catalogue, mục Spiegel im Spiegel: "The inner voice always acts as a T-voice in F major"; "When the violin plays an F, the piano plays and F major triad"; phần đệm ba nốt của piano "sustains an upwardly motion". Luận văn sinh viên, nguồn yếu: chỉ dùng cho giọng Fa trưởng và hướng đi lên của hình đệm, kèm ap-544'
    link: https://www.researchcatalogue.net/view/3795800/3796304
nhan_dinh:
  - id: n1
    cau: "Tên «Spiegel im Spiegel» đúng: tác phẩm Spiegel im Spiegel (1978) của Arvo Pärt."
    loai: ten
    truong: [ ten ]
    nguon: [ arvopart, ecm ]
    ket_qua: dung
    ghi_chu: Cả hai nguồn ghi năm 1978 (ECM qua bài điểm sách).
    luot_2: dung
    luot_2_nguon: [ https://www.arvopart.ee/en/arvo-part/work/544/, https://id.loc.gov/authorities/names/n00063915.json ]
    luot_2_ghi_chu: "Arvo Pärt Centre work page: 'Spiegel im Spiegel, 1978, scored for violin and piano' (commissioned in 1978 by Vladimir Spivakov, premiered December 1978 at the Moscow Conservatory). LoC n00063915: 'Pärt, Arvo. Spiegel im Spiegel' (MGG: für V. und Kl. (1978); Baker's: for violin and piano (1978))."
  - id: n2
    cau: Tác giả là Arvo Pärt.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ arvopart, ecm ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ https://www.arvopart.ee/en/arvo-part/work/544/, https://id.loc.gov/authorities/names/n00063915.json ]
    luot_2_ghi_chu: Arvo Pärt Centre page calls it 'one of the best known and most performed pieces by Arvo Pärt'. LoC heading 'Pärt, Arvo. Spiegel im Spiegel'. (No IMSLP work page found, so the composer's own centre and the LoC authority record were used.)
  - id: n3
    cau: 'Thời kỳ: Đương đại.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ ap-bio, ap-544b ]
    ket_qua: dung
    ghi_chu: 'Tác phẩm 1978 của một nhà soạn nhạc còn sống; Trung tâm xếp phong cách tintinnabuli vào âm nhạc đương đại. Tên thời kỳ là cách chia của site.'
    luot_2: dung
    luot_2_nguon: [ "https://brahms.ircam.fr/en/works/work/30209" ]
    luot_2_ghi_chu: "IRCAM: viết năm 1978, Arvo Pärt (sinh 1935, không ghi năm mất). Tác giả còn sống, tác phẩm cuối thế kỷ 20 theo lối tintinnabuli: xếp Đương đại là hợp lý."
  - id: n4
    cau: 'Luyện nghe: tintinnabuli, sự tĩnh lặng.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ ap-544b, ap-bio ]
    ket_qua: dung
    ghi_chu: 'Spiegel im Spiegel viết theo phong cách tintinnabuli (Trung tâm: nốt tintinnabuli của piano; tiểu sử liệt kê Spiegel im Spiegel (1978) trong các tác phẩm tintinnabuli đầu). "Tĩnh lặng": tiểu sử nói tintinnabuli thể hiện "the composer’s special relationship to silence". Chọn trọng tâm luyện nghe là lựa chọn của site.'
    luot_2: dung
    luot_2_nguon: [ "https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/" ]
    luot_2_ghi_chu: "Interlude (Frances Wilson): viết theo lối tintinnabuli, có 'a meditative and serene simplicity', bè piano mang 'the tintinnabular voice'. Trang chính thức của UE trả 403."
  - id: n5
    cau: 'Hình nghe (hinh.nghe), chú thích "Spiegel im Spiegel: mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)."; các ô: Piano (hình đệm ba nốt đi lên); Violin vào (câu đầu chỉ hai nốt); Mỗi câu thêm một nốt (câu lên, câu "soi gương" xuống · về nốt trung tâm); Nốt tintinnabuli (chuông nhỏ trên và dưới giai điệu); Những câu cuối (dài nhất · về nốt trung tâm).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - ap-544
      - kiral
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/part-spiegel (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n17, n18, n19, n20, n21 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: ap-544, kiral. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n28 của hồ sơ trang.'
