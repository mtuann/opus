nhan_dinh:
  - id: n1
    cau: Tên «Tứ tấu Op. 132, chương 3» chỉ chương 3 («Heiliger Dankgesang», Molto adagio) của Tứ tấu đàn dây số 15 cung La thứ.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, beethoven-haus ]
    ket_qua: dung
    ghi_chu: Beethoven-Haus ghi chương 3 mang đề «Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart»; IMSLP ghi chương 3 là Molto adagio.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)", "https://www.beethoven.de/en/work/view/5899899358937088/Quartet+for+2+violins,+viola+and+violoncello+(A+minor)+op.+132", https://id.loc.gov/authorities/names/no91026359.json ]
    luot_2_ghi_chu: "IMSLP: String Quartet No.15, Op.132, A minor; 5 movements, no. 3 = 'Molto adagio (A minor)'. Beethoven-Haus op. 132 page lists '3. Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart. Molto adagio - Neue Kraft fühlend. Andante ...'. LoC no91026359: 'Quartets, violins (2), viola, cello, no. 15, op. 132, A minor'."
  - id: n2
    cau: Tác giả là Ludwig van Beethoven.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, beethoven-haus ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)", "https://www.beethoven.de/en/work/view/5899899358937088/Quartet+for+2+violins,+viola+and+violoncello+(A+minor)+op.+132", https://id.loc.gov/authorities/names/no91026359.json ]
    luot_2_ghi_chu: "IMSLP composer field: Beethoven, Ludwig van. Beethoven-Haus work page; LoC heading 'Beethoven, Ludwig van, 1770-1827'."
  - id: n3
    cau: Op. 132 là số opus của Tứ tấu đàn dây số 15 cung La thứ.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, beethoven-haus ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)", "https://www.beethoven.de/en/work/view/5899899358937088/Quartet+for+2+violins,+viola+and+violoncello+(A+minor)+op.+132", https://id.loc.gov/authorities/names/no91026359.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.132 (String Quartet No.15, A minor). Beethoven-Haus 'op. 132'. LoC 'no. 15, op. 132, A minor'.
  - id: n4
    cau: 'Thời kỳ: Beethoven cuối đời.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-late, cooper-cmslc, beethoven-haus ]
    ket_qua: dung
    ghi_chu: 'IMSLP xếp Op. 132 vào "Late Quartets"; Cooper: "Beethoven''s other late quartets"; Beethoven-Haus: sáng tác đầu 1825 – tháng 7/1825 (Beethoven mất 1827).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)", "https://www.latimes.com/entertainment-arts/story/2020-07-02/how-to-listen-beethoven-string-quartet-opus-132-coronavirus" ]
    luot_2_ghi_chu: "IMSLP: soạn 1823-25, in 1827 (Schott). LA Times xếp Op. 132 trong 'his late string quartets'."
  - id: n5
    cau: 'Luyện nghe: điệu thức Lydian, nhạc thính phòng.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ beethoven-haus, cooper-cmslc, imslp ]
    ket_qua: dung
    ghi_chu: 'Tiêu đề chương "in der lydischen Tonart" (Beethoven-Haus); Cooper: Lydian là Fa trưởng có Si tự nhiên; IMSLP: 2 violins, viola, cello (tứ tấu đàn dây, nhạc thính phòng theo thuat-ngu.yml chamber-music).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)", "https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van" ]
    luot_2_ghi_chu: "IMSLP: biên chế 2 violin, viola, cello (tứ tấu đàn dây, nhạc thính phòng). Tổng phổ (Dover/Breitkopf, tr. 15): chương III 'Heiliger Dankgesang ... in der lydischen Tonart'."
  - id: n6
    cau: 'Hình nghe: chú thích "Tứ tấu Op. 132, chương 3"; năm ô theo thứ tự A – B – A'' – B'' – A''''.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ beethoven-haus, cooper-cmslc, tong-pho-ga ]
    ket_qua: dung
    ghi_chu: 'Beethoven-Haus: "Molto adagio - Neue Kraft fühlend. Andante - Molto adagio - Andante - Molto adagio. Mit innigster Empfindung"; Cooper: thánh ca và hai biến tấu luân phiên với hai đoạn Rê trưởng. Độ rộng ô và màu là lựa chọn trình bày, không phải nhận định.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van" ]
    luot_2_ghi_chu: "Tổng phổ, chương III: Molto adagio (Lydian, tr. 15) – Andante 'Neue Kraft fühlend' (Rê trưởng, tr. 15) – Molto adagio (tr. 17) – Andante (tr. 17–19) – Molto adagio 'Mit innigster Empfindung' (tr. 20): năm đoạn A – B – A' – B' – A''."
  - id: n7
    cau: 'Ô A: thánh ca, Lydian.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ cooper-cmslc, omt-modes, tong-pho-ga ]
    ket_qua: dung
    ghi_chu: 'Cooper: "very slow chorale in block chords", tiêu đề "in der lydischen Tonart"; tổng phổ: không dấu hóa ở hóa biểu, kết trên Fa.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van", "https://www.latimes.com/entertainment-arts/story/2020-07-02/how-to-listen-beethoven-string-quartet-opus-132-coronavirus" ]
    luot_2_ghi_chu: "Tổng phổ: 'Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart. Molto adagio', viết theo lối hợp xướng thánh ca. LA Times: 'The opening hymn tune ... Being in the Lydian mode'."
  - id: n8
    cau: 'Ô B: "sức lực mới", Rê trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ beethoven-haus, cooper-cmslc, tong-pho-ga ]
    ket_qua: dung
    ghi_chu: '"Neue Kraft fühlend" (cảm thấy sức lực mới); Cooper: "in the contrasting key of D major"; tổng phổ: hóa biểu hai dấu thăng, 3/8.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van", "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "Tổng phổ tr. 15: 'Neue Kraft fühlend. (Sentendo nuova forza.) Andante', hóa biểu hai dấu thăng (Rê trưởng). Tên track trên IMSLP: '... Molto adagio - Neue Kraft fühlend: Andante - Molto adagio'."
  - id: n9
    cau: 'Ô A'''': "cảm xúc sâu thẳm nhất".'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ beethoven-haus, tong-pho-ga ]
    ket_qua: dung
    ghi_chu: 'Phần cuối ghi "Mit innigster Empfindung" (Beethoven-Haus; tổng phổ tr. PDF 20).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van" ]
    luot_2_ghi_chu: "Tổng phổ tr. 20: đoạn Molto adagio cuối ghi 'Mit innigster Empfindung (Con intimissimo sentimento)' ở cả bốn bè."
