nhan_dinh:
  - id: n1
    cau: Tên «Giao hưởng số 9, Largo» chỉ chương 2 (Largo) của Giao hưởng số 9 cung Mi thứ.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, breitkopf ]
    ket_qua: dung
    ghi_chu: IMSLP liệt kê 4 chương, chương 2 là Largo; Breitkopf ghi Symphonie Nr. 9 e-moll op. 95.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)", https://id.loc.gov/authorities/names/n79095294.json ]
    luot_2_ghi_chu: "IMSLP: Symphony No.9, Op.95 (B.178), E minor; movements: Adagio-Allegro molto; Largo; Molto vivace; Allegro con fuoco (no. 2 = Largo). LoC n79095294: 'Symphonies, no. 9, op. 95, E minor' (New Grove: B. 178, op. 95, 'From the New World', first published as no. 5)."
  - id: n2
    cau: Tác giả là Antonín Dvořák.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, breitkopf ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)", https://id.loc.gov/authorities/names/n79095294.json ]
    luot_2_ghi_chu: "IMSLP composer field: Dvořák, Antonín. LoC heading 'Dvořák, Antonín, 1841-1904'."
  - id: n3
    cau: Op. 95 là số opus của Giao hưởng số 9 cung Mi thứ.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, breitkopf ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)", https://id.loc.gov/authorities/names/n79095294.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.95 ; B.178 (E minor). LoC 'no. 9, op. 95, E minor'.
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong:
      - thoi_ky
    nguon:
      - imslp-wt
    ket_qua: dung
    ghi_chu: IMSLP "Piece Style=Romantic"; nha-soan-nhac.yml (dvorak, đã khóa) cũng ghi Lãng mạn.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)" ]
    luot_2_ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Romantic; viết năm 1893."
  - id: n5
    cau: 'Luyện nghe: gam ngũ cung, cor anglais.'
    loai: cau-truc
    truong:
      - luyen_nghe
    nguon:
      - simrock-dv
      - dv-work
    ket_qua: dung
    ghi_chu: Chủ đề do "Corno inglese Solo" chơi (tổng phổ tr. 28); antonin-dvorak.cz nói về tính ngũ cung của giai điệu; hai câu đầu chỉ dùng nốt của ngũ cung Rê♭ (xem hồ sơ trang n11, n22).
    luot_2: dung
    luot_2_nguon: [ "https://www.antonin-dvorak.cz/en/work/symphony-no-9/" ]
    luot_2_ghi_chu: "antonin-dvorak.cz: chủ đề chính của Largo 'delivered by the cor anglais'; tổng phổ đã sửa so với bản phác thảo, 'intensifying the pentatonic character of the melody'; gam ngũ cung là một nét đặc trưng của tác phẩm."
  - id: n6
    cau: 'Hình, chú thích: Giao hưởng số 9, chương 2 (Largo): hình thức ba đoạn.'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - dv-work
      - simrock-dv
    ket_qua: dung
    ghi_chu: Chủ đề chính (A), đoạn giữa Đô♯ thứ / Đô♯ trưởng (B), chủ đề chính trở lại (A); có phần mở và kết bằng chuỗi hợp âm.
    luot_2: dung
    luot_2_nguon: [ "https://www.antonin-dvorak.cz/en/work/symphony-no-9/" ]
    luot_2_ghi_chu: "antonin-dvorak.cz mô tả: chuỗi hợp âm mở đầu, chủ đề chính (cor anglais), đoạn giữa ở Đô♯ thứ, đoạn gần như scherzo, rồi chủ đề chính trở lại nhẹ nhàng và chuỗi hợp âm mở đầu ở cuối. Đó là hình thức ba đoạn (A–B–A) có mở và kết; trang không dùng chữ 'ternary' nhưng mô tả đúng sơ đồ ấy."
  - id: n7
    cau: 'Hình, các ô: Hợp âm mở đầu; A, cor anglais, Rê♭ trưởng; B, Đô♯ thứ; Đoạn sáng, chủ đề chương 1 vang lại; A, cor anglais; Kết.'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - simrock-dv
      - dv-work
    ket_qua: dung
    ghi_chu: 'Tổng phổ: hợp âm kèn ô 1–6; cor anglais, hóa biểu năm giáng; "Un poco più mosso" bốn thăng (Đô♯ thứ); "Poco più mosso" Đô♯ trưởng tới cao trào ff có chủ đề chương 1 (antonin-dvorak.cz); "Meno mosso, Tempo I" cor anglais; Molto Adagio kết bằng hợp âm. Trọng số và màu là cách vẽ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.antonin-dvorak.cz/en/work/symphony-no-9/", "https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)" ]
    luot_2_ghi_chu: "antonin-dvorak.cz: chuỗi hợp âm của kèn gỗ, kèn đồng ở đầu chương kết ở Rê♭ trưởng; chủ đề do cor anglais thổi; đoạn giữa 'in C sharp minor'; tiếp theo là đoạn gần như scherzo ở Đô♯ trưởng, cao trào gom chủ đề Largo, chủ đề chính và chủ đề kết của chương 1 (ô 'Đoạn sáng, chủ đề chương 1 vang lại'); kết bằng chủ đề chính trở lại và hợp âm mở đầu. Đủ khớp các ô của hình."
  - id: n8
    cau: "Bản thu Dvořák, Giao hưởng số 9 Op. 95, chương 2 (Largo): Musopen (Commons không ghi tên dàn nhạc)."
