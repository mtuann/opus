    luot_2_ghi_chu: IMSLP Op./Cat. No. = K.467 (C major). LoC 'K. 467, C major'.
  - id: n4
    cau: 'Thời kỳ: Cổ điển.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-467-api ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Concerto_No.21_in_C_major,_K.467_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: "IMSLP: Piece Style = Classical; sáng tác 1785."
  - id: n5
    cau: 'Luyện nghe: đối thoại piano và dàn nhạc, cadenza.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ nma-467, ptna-275 ]
    ket_qua: dung
    ghi_chu: 'NMA: dàn nhạc và piano luân phiên trình bày; PTNA: có cadenza ở hai chương ngoài.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bso.org/works/mozart-piano-concerto-no-21", "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=133&l=1" ]
    luot_2_ghi_chu: "BSO: soloist chia chủ đề với dàn nhạc, dẫn nhạc theo hướng mới; NMA ghi 'Kadenz' ở chương 1 và chương 3."
  - id: n6
    cau: 'Hình, chú thích: chương 1 có hai lần trình bày, của dàn nhạc rồi của piano; độ dài các ô gần đúng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-467, ptna-275 ]
    ket_qua: dung
    ghi_chu: 'NMA: dàn nhạc ô 1–72, piano vào ô 73 với phần trình bày riêng; PTNA "Concerto-sonata form".'
    luot_2: dung
    luot_2_nguon: [ "https://www.bso.org/works/mozart-piano-concerto-no-21", "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=93&l=1" ]
    luot_2_ghi_chu: "BSO nói 'orchestral exposition' rồi soloist vào; NMA: dàn nhạc chơi một mình từ ô 1, piano vào sau (khoảng ô 74–80)."
  - id: n7
    cau: 'Hình, chương 1: dàn nhạc trình bày (Đô trưởng, hành khúc); piano trình bày (rẽ sang Sol thứ rồi Sol trưởng); phát triển; tái hiện (Đô trưởng); cadenza (piano một mình); coda.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-467, ptna-275 ]
    ket_qua: dung
    ghi_chu: 'NMA tr. 93–105: ô 1 dây p môtip hành khúc Đô trưởng; ô 109 Sol thứ; ô 128 Sol trưởng. Phát triển, tái hiện, cadenza, coda: theo PTNA ("Concerto-sonata form", cadenza ở chương ngoài); chưa xem ảnh trang từ ô 140 trở đi (lượt 2 nên đối chiếu tr. 106–137).'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=93&l=1", "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=103&l=1", "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=133&l=1" ]
    luot_2_ghi_chu: "Xem bản nhạc NMA V/15/6: phần trình bày của piano, ô 109–121, piano một mình ở Sol thứ (Si giáng, Mi giáng, Fa thăng), rồi ô 122–127 về bậc át của Sol, chủ đề hai Sol trưởng; cuối chương có fermata ghi chú 'Kadenz' (tr. 135, khoảng ô 396), sau đó dàn nhạc kết (coda, ô 397–417). Mở đầu Allegro maestoso, kèn trumpet và timpani, kiểu hành khúc (BSO: 'festive, trumpet-and-drums')."
  - id: n8
    cau: 'Hình, chương 2: Andante, Fa trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-467, ptna-275 ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=138&l=1", "https://imslp.org/wiki/Piano_Concerto_No.21_in_C_major,_K.467_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: "NMA tr. 138: 'Andante', hóa biểu một giáng; IMSLP: Andante (F major, 104 bars)."
  - id: n9
    cau: 'Hình, chương 2: violin và viola gắn sordino; chùm ba.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-467 ]
    ket_qua: da-sua
    ghi_chu: 'Dữ liệu ghi "dây gắn sordino, chùm ba". NMA tr. 138: "sordini" ở violin 1, violin 2, viola; cello và bass "pizzicato", không sordino. Đề xuất "violin, viola gắn sordino; chùm ba" (sua-B.yml), cùng chỗ sửa ở trang (hồ sơ trang n16).'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=138&l=1", "https://www.bso.org/works/mozart-piano-concerto-no-21" ]
    luot_2_ghi_chu: "NMA tr. 138: 'sordini' ghi ở Violino I, Violino II và Viola I, II; violin II và viola chơi chùm ba móc đơn. BSO: 'muted strings … continuous cushion of triplets'."
  - id: n10
    cau: 'Hình, chương 3: Allegro vivace assai, Đô trưởng, rondo, có cadenza ngắn.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-275, koechel-467 ]
    ket_qua: dung
    ghi_chu: 'PTNA: "Third Movement: Allegro vivace assai, C major, 2/4 time. Rondo form"; cadenza ở chương ngoài. "Ngắn" so với cadenza chương 1 là nhận xét chung; chưa đối chiếu bản nhạc chương 3.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Phần lớn câu đúng: NMA tr. 150 ghi 'Allegro vivace assai', 2/4, Đô trưởng; BSO gọi là 'rondo-finale'; NMA tr. 175 có fermata kèm chú thích 'Kadenz; vgl. Vorwort' (khoảng ô 426). Nhưng chữ 'ngắn' không có nguồn: bản nhạc chỉ đánh dấu chỗ cadenza, độ dài do người chơi (Mozart không để lại cadenza), và NMA gọi đây là Kadenz chứ không phải Eingang. Đề nghị bỏ 'ngắn' hay viết 'có chỗ cadenza'. Nguồn đã mở: https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=173&l=1, https://www.bso.org/works/mozart-piano-concerto-no-21."
  - id: n11
    cau: 'Hình: ba chương nhanh – chậm – nhanh (chương 1, Andante, chương 3).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ koechel-467 ]
    ket_qua: dung
    ghi_chu: 'Köchel: 1. Allegro maestoso, 2. Andante, 3. Allegro vivace assai.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Concerto_No.21_in_C_major,_K.467_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: "IMSLP: Allegro maestoso; Andante; Allegro vivace assai."
  - id: n12
    cau: 'Hình, ghi chú: không còn cadenza nào của Mozart cho concerto này; nghệ sĩ chơi cadenza của người khác, tự soạn hoặc ứng tác.'
    loai: lich-su
    truong: [ hinh ]
    nguon: [ ptna-275, koechel-467, cod-cadenza ]
    ket_qua: da-sua
    ghi_chu: 'Dữ liệu ghi "Cadenza của Mozart cho concerto này đã thất lạc; nghệ sĩ chơi cadenza của người khác hoặc tự soạn." "Thất lạc" ngầm nói từng có bản viết; PTNA chỉ nói "have not survived", Köchel: Mozart thường ứng tác. Đề xuất câu trên (sua-B.yml), cùng chỗ sửa ở trang (hồ sơ trang n22).'
    luot_2: dung
    luot_2_nguon: [ "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=-12&l=1" ]
    luot_2_ghi_chu: "Lời tựa NMA V/15/6, tr. XIII–XIV: Eingänge và Kadenzen của Mozart chỉ còn khi concerto được chuẩn bị để in hay cho người khác diễn; 'Beide Anlässe entfielen für die Werke des vorliegenden Bandes, so daß ihre Ergänzung den Interpreten zufiel' (KV 466, 467 trong tập này)."
  - id: n13
    cau: 'Bản thu: Giorgi Latsabidze (piano), Hsinchu Chamber Orchestra, David L. Wen chỉ huy; chỉ có chương 3, thu năm 2011; CC BY-SA 3.0; trang Commons; một phần dài 482,83 giây.'
    loai: ten
    truong: [ ban_thu ]
    nguon: [ commons-467 ]
    ket_qua: dung
    ghi_chu: 'Commons: author và mô tả như ở nguồn; ngày trong mô tả "June 2011" (trường date "2011-09-14" là ngày khác, có lẽ ngày tải lên; năm vẫn 2011). Giấy phép cc-by-sa-3.0, licUrl khớp. Thời lượng khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Mozart_Piano_Concerto_N_21_in_C_major,_K._467_(3rd_movement).oga" ]
