    luot_2: dung
    luot_2_nguon: [ "https://www.loc.gov/item/jukebox-70342/", "https://www.loc.gov/item/jukebox-70335/", "https://www.openculture.com/2016/02/the-original-recording-of-rhapsody-in-blue-1924.html" ]
    luot_2_ghi_chu: "LoC: ngày 1924-06-10, Victor 55225, part 1 (matrix C-30174) và part 2 (C-30173): hai mặt đĩa. Open Culture gọi đây là 'the abridged recordings'; tổng hai phần khoảng 9 phút."
