    ket_qua: dung
    ghi_chu: 'check_audio.py --static --network của người giao: 0 lỗi.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Paul_Whiteman_Concert_Orchestra_-_Rhapsody_in_Blue_Part_01.mp3", "https://commons.wikimedia.org/wiki/File:Paul_Whiteman_Concert_Orchestra_-_Rhapsody_in_Blue_Part_02.mp3" ]
    luot_2_ghi_chu: "API Commons: Part 01 dài 261,094 giây, Part 02 dài 272,875 giây."
  - id: n10
    cau: 'Hình nghe (hinh.nghe), chú thích "Rhapsody in Blue: một dòng chảy liền mạch; mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)."; các ô: Glissando (clarinet vuốt từ trầm lên cao); Chủ đề chính (clarinet, cả ban nhạc · piano độc tấu lần đầu); Ban nhạc và piano; Đoạn chậm (Andantino moderato · Mi trưởng); Piano độc tấu (chạy ngón tốc độ cao); Chủ đề chính trở lại (dồn dập về kết); Kết (cả dàn nhạc và piano).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - cod-rhapsody
      - sfs
      - score-nwm
      - loc-ms
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/gershwin-rhapsody (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n17, n24, n25, n26, n27, n28, n29, n30 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: cod-rhapsody, sfs, score-nwm, loc-ms. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n35 của hồ sơ trang.'
