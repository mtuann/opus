    truong: [ ban_thu ]
    nguon: [ commons-wh, loc-jb1 ]
    ket_qua: dung
    ghi_chu: 'Commons: {{PD-US-expired}}, "Media uploaded for Public Domain Day 2025". LoC: bản thu phát hành 1923–1946 được bảo hộ 100 năm, nên bản 1924 hết bảo hộ ở Mỹ từ 1/1/2025.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Paul_Whiteman_Concert_Orchestra_-_Rhapsody_in_Blue_Part_01.mp3" ]
