nhan_dinh:
  - id: n1
    cau: Tên «Rhapsody in Blue» là tên tác phẩm cho piano và dàn nhạc của George Gershwin.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, gershwin-com ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)", https://id.loc.gov/authorities/names/n81081332.json ]
    luot_2_ghi_chu: "IMSLP: Rhapsody in Blue (1924), instrumentation 'piano solo, jazz band (later orchestra)'. LoC n81081332 editorial note: use [Rhapsody in blue] for both versions (piano and jazz band; piano and full orchestra), which are not arrangements. So 'cho piano và dàn nhạc' is acceptable; the 1924 original was for jazz band (Grofé), later orchestrations for theatre/full orchestra."
  - id: n2
    cau: Tác giả là George Gershwin.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, gershwin-com ]
    ket_qua: dung
    ghi_chu: IMSLP ghi các bản phối cho dàn nhạc là của Grofé; tác giả vẫn là Gershwin.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)", https://id.loc.gov/authorities/names/n81081332.json ]
    luot_2_ghi_chu: "IMSLP composer field: Gershwin, George. LoC heading 'Gershwin, George, 1898-1937. Rhapsody in blue'."
  - id: n4
    cau: 'Thời kỳ: Thế kỷ 20.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-rib ]
    ket_qua: dung
    ghi_chu: 'IMSLP Piece Style: Early 20th century.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Gershwin,_George" ]
    luot_2_ghi_chu: "IMSLP: 'People from the Early 20th century era'; tác phẩm 1924."
  - id: n5
    cau: 'Luyện nghe: jazz và giao hưởng, clarinet glissando.'
    loai: lich-su
    truong: [ luyen_nghe ]
    nguon: [ loc-blog, sfs ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/", "https://www.classical-music.com/features/works/rhapsody-in-blue" ]
    luot_2_ghi_chu: "Blog Library of Congress: Whiteman đặt viết một 'jazz concerto' cho buổi 'Experiment in Modern Music'; Grofé sau phối bản giao hưởng. BBC Music Magazine: 'the clarinet's famous opening glissando' (Ross Gorman)."
  - id: n6
    cau: 'Bản thu: George Gershwin (piano), Paul Whiteman Concert Orchestra, Paul Whiteman chỉ huy.'
    loai: ten
    truong: [ ban_thu ]
    nguon: [ loc-jb1, commons-wh ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.loc.gov/item/jukebox-70342/" ]
    luot_2_ghi_chu: "National Jukebox (LoC): Whiteman, Paul — Leader; Gershwin, George — Instrumentalist, Piano; Paul Whiteman Concert Orchestra."
  - id: n7
    cau: 'Ghi chú bản thu: thu ngày 10/6/1924 cho hãng Victor, bản rút gọn trên hai mặt đĩa.'
    loai: nam
    truong: [ ban_thu ]
