nhan_dinh:
  - id: n1
    cau: Tên «Những bức tranh ở phòng triển lãm» là tên tiếng Việt của Pictures at an Exhibition của Mussorgsky.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    ghi_chu: "Review (24/10/2026): giữ. Tên tiếng Việt là cách dịch của site; tác phẩm gốc chắc ở cả hai lượt (IMSLP, LoC). Các nguồn tiếng Việt dịch khác nhau (lượt 2), nên trang nên ghi kèm tên gốc. Cách dịch tiếng Việt là lựa chọn của site; hai nguồn xác nhận tác phẩm gốc Pictures at an Exhibition."
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)", https://id.loc.gov/authorities/names/n80149485.json ]
    luot_2_ghi_chu: "Referent is certain: IMSLP 'Pictures at an Exhibition' (alt. Картинки с выставки; Tableaux d'une Exposition; 'Pictures from the Exhibition (exact translation)'), Mussorgsky, Modest, piano, 1874; LoC n80149485 'Kartinki s vystavki' (= Pictures at an exhibition = Tableaux d'une exposition). But NO rank-2 source states a Vietnamese title, so 'là tên tiếng Việt' cannot be confirmed. Vietnamese usage (rank 3 only, not usable as sole source) varies: https://nhaccodien.vn/mussorgsky-nhung-buc-tranh-trong-phong-trien-lam/ gives 'Những bức tranh trong phòng triển lãm'; the vi.wikipedia article on Mussorgsky says 'Những bức tranh tại một phòng triển lãm'; the HBSO concert page http://www.hbso.org.vn/chuong-trinh/dem-nhac-tchaikovsky-mussorgsky-bartok-976.html (official institution, program of 20/06/2026) uses only the English title. Suggest rewording to 'bản dịch tiếng Việt' (a translation) or accepting the title as an editorial translation choice at review."
  - id: n2
    cau: Tác giả là Modest Mussorgsky.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle ]
    ket_qua: dung
