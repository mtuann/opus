nhan_dinh:
  - id: n1
    cau: Tên «Những bức tranh ở phòng triển lãm» là tên tiếng Việt của Pictures at an Exhibition của Mussorgsky.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    ghi_chu: "Review (24/10/2026): giữ. Tên tiếng Việt là cách dịch của site; tác phẩm gốc chắc ở cả hai lượt (IMSLP, LoC). Các nguồn tiếng Việt dịch khác nhau (lượt 2), nên trang nên ghi kèm tên gốc. Cách dịch tiếng Việt là lựa chọn của site; hai nguồn xác nhận tác phẩm gốc Pictures at an Exhibition."
    luot_2: khong-chac
    luot_2_nguon: [ "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)", https://id.loc.gov/authorities/names/n80149485.json ]
    luot_2_ghi_chu: "Referent is certain: IMSLP 'Pictures at an Exhibition' (alt. Картинки с выставки; Tableaux d'une Exposition; 'Pictures from the Exhibition (exact translation)'), Mussorgsky, Modest, piano, 1874; LoC n80149485 'Kartinki s vystavki' (= Pictures at an exhibition = Tableaux d'une exposition). But NO rank-2 source states a Vietnamese title, so 'là tên tiếng Việt' cannot be confirmed. Vietnamese usage (rank 3 only, not usable as sole source) varies: https://nhaccodien.vn/mussorgsky-nhung-buc-tranh-trong-phong-trien-lam/ gives 'Những bức tranh trong phòng triển lãm'; the vi.wikipedia article on Mussorgsky says 'Những bức tranh tại một phòng triển lãm'; the HBSO concert page http://www.hbso.org.vn/chuong-trinh/dem-nhac-tchaikovsky-mussorgsky-bartok-976.html (official institution, program of 20/06/2026) uses only the English title. Suggest rewording to 'bản dịch tiếng Việt' (a translation) or accepting the title as an editorial translation choice at review."
  - id: n2
    cau: Tác giả là Modest Mussorgsky.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)", https://id.loc.gov/authorities/names/n80149485.json ]
    luot_2_ghi_chu: "IMSLP composer field: Mussorgsky, Modest. LoC heading 'Mussorgsky, Modest Petrovich, 1839-1881. Kartinki s vystavki'."
  - id: n3
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wikitext, henle ]
    ket_qua: dung
    ghi_chu: 'IMSLP: "Piece Style=Romantic" (năm sáng tác 1874). Trang hướng dẫn nghe ghi thêm "(trường phái dân tộc Nga)" (hồ sơ trang n6).'
  - id: n4
    cau: 'Luyện nghe: Promenade nối các bức tranh; có bản piano và bản phối cho dàn nhạc.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ imslp-wikitext, wss-notes ]
    ket_qua: dung
    ghi_chu: 'IMSLP liệt kê Promenade [I]–[V] xen giữa các bài; IMSLP có trang các bản phối (bảng Nieweg), nổi tiếng nhất là của Ravel (Winston-Salem Symphony: "The popular orchestration … by Maurice Ravel was made in 1922").'
  - id: n5
    cau: 'Hình nghe, chú thích: bản piano gồm mười bức tranh nối với nhau bằng các Promenade; độ dài các ô gần đúng theo thời lượng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wikitext, henle-477-vorwort ]
    ket_qua: dung
    ghi_chu: 'IMSLP: mười bài đánh số 1–10, Promenade [I]–[V] và Cum mortuis xen giữa.'
  - id: n6
    cau: 'Hình nghe: Promenade đầu tiên ở Si♭ trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mut-pictures, bessel-1886 ]
    ket_qua: dung
    ghi_chu: 'Mutopia promenade-1.ly: \key bes \major, nhịp 5/4 xen 6/4. (Incipit trên IMSLP ghi \key g \minor là lỗi của người gõ incipit; nốt G F B♭ C F D là đầu giai điệu Si♭ trưởng.)'
  - id: n7
    cau: 'Hình nghe, thứ tự 16 ô: Promenade, 1. Gnomus, Promenade, 2. Lâu đài cổ, Promenade, 3. Tuileries, 4. Bydło, Promenade, 5. Gà con, 6. Goldenberg và Schmuÿle, Promenade, 7. Limoges, 8. Catacombae, Cum mortuis, 9. Baba Yaga, 10. Cổng lớn Kiev.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wikitext, mut-pictures ]
    ket_qua: dung
    ghi_chu: 'Khớp danh sách "16 movements" của IMSLP và thứ tự các tệp của Mutopia (promenade-1 … promenade-5, catacombae, promenade-6 = Cum mortuis).'
  - id: n8
    cau: 'Hình nghe: Promenade trước Limoges (Promenade thứ năm) là bài Ravel bỏ trong bản phối.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ wss-notes, imslp-wikitext ]
    ket_qua: dung
    ghi_chu: 'Winston-Salem Symphony: Promenade "recurs throughout the work … (Ravel chose to omit one of these)". Tổng phổ Ravel (Boosey & Hawkes 1929, Internet Archive ybimslp01545): sau Goldenberg là Limoges, không có Promenade; bốn Promenade còn lại ở tr. 5, 25, 42, 56 của PDF. Xem hồ sơ trang n31.'
  - id: n9
    cau: 'Hình nghe: Cum mortuis là Promenade ở giọng thứ.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ henle-477-comments, mut-pictures, bessel-1886 ]
    ket_qua: dung
    ghi_chu: 'Henle: Andante non troppo là "another variant of the Promenade"; Mutopia promenade-6.ly: \key b \minor; lời giới thiệu bản Bessel: "Andante H-Moll".'
  - id: n10
    cau: 'Hình nghe: ở bài 10 (Cổng lớn Kiev), Promenade trở lại.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ gresham-fw ]
    ket_qua: dung
    ghi_chu: 'Gresham: "Amongst the bells, we hear the Promenade one last time, now elevated to a grand, rousing hymn."'
  - id: n11
    cau: 'Hình nghe, tên các bài: Gnomus, Lâu đài cổ (Il vecchio castello), Tuileries, Bydło, Gà con (Vũ khúc gà con chưa nở), Goldenberg và Schmuÿle, Limoges, Catacombae, Baba Yaga, Cổng lớn Kiev.'
    loai: ten
    truong: [ hinh ]
    nguon: [ imslp-wikitext ]
    ket_qua: dung
    ghi_chu: 'Tên rút gọn của các bài 1–10 theo IMSLP; tên tiếng Việt khớp bảng "Sơ đồ cấu trúc" của trang.'
  - id: n12
    cau: 'Hình nghe, độ dài các ô (phút, gần đúng): 1,5; 2,5; 0,8; 4; 0,5; 1; 2,5; 0,7; 1,2; 2,2; 1,3; 1,3; 1,7; 1,8; 3,3; 5.'
    loai: so-lieu
    truong: [ hinh ]
    nguon: [ bertoglio-file ]
    ket_qua: dung
    ghi_chu: 'Đối chiếu mốc của bản Bertoglio (trang, ::khoi-nghe): Promenade + Gnomus 4,2 phút (dữ liệu 4,0); Promenade + Lâu đài cổ 5,4 (4,8); Promenade + Tuileries 1,4 (1,5); Bydło 3,1 (2,5); Promenade + gà con 2,1 (1,9); Goldenberg 1,9 (2,2); Promenade + Limoges 3,2 (2,6); Catacombae + Cum mortuis 4,7 (3,5); Baba Yaga 3,1 (3,3); Cổng lớn 4,7 (5,0). Tổng 31,3 phút so với 33,7: đúng mức "gần đúng" của chú thích.'
  - id: n13
    cau: 'Hình nghe, ghi chú: ô màu Promenade là chủ đề "người xem tranh"; Cum mortuis là biến thể của nó.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ gresham-fw, henle-477-comments ]
    ket_qua: dung
    ghi_chu: 'Gresham: Promenade "is Musorgsky''s self-portrait, depicting him strolling through the exhibition"; Henle: Cum mortuis "another variant of the Promenade".'
