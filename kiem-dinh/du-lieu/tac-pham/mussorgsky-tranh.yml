ghi_chu: "loai: nghe là cấu trúc, không phải nhận định; trang hướng dẫn nghe cũ ../opus-zero/docs/nghe-nhac/mussorgsky-tranh.md có tồn tại. Bản ghi không có goi_y, gan_cho, khuyet_danh. Không có danh_muc: IMSLP không ghi số danh mục hay opus. Lần 2 (D6-L8, lượt 1 phần A): nhận định n3–n17 cho các trường chưa khóa thoi_ky, luyen_nghe, hinh (hinh.nghe), ban_thu. Bản nhạc: Mutopia (Knute Snortum, theo ấn bản Pavel Lamm, dựa trên bản thảo) cho giọng, nhịp; bản in đầu Bessel 1886 (bản Rimsky-Korsakov, Sibley qua Internet Archive) và lời tựa, lời bình Henle HN 477 (2 PDF). Độ dài các ô trong hinh.nghe so với mốc của bản thu Bertoglio (trang nghe-nhac/mussorgsky-tranh): gần đúng như chú thích nói. Không có dữ liệu sai; không có mục trong file sửa."
