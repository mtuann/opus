    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)" ]
    luot_2_ghi_chu: "IMSLP WORK INFO: Piece Style Romantic; sáng tác 1874."
  - id: n4
    cau: 'Luyện nghe: Promenade nối các bức tranh; có bản piano và bản phối cho dàn nhạc.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ imslp-wikitext, wss-notes ]
    ket_qua: dung
    ghi_chu: 'IMSLP liệt kê Promenade [I]–[V] xen giữa các bài; IMSLP có trang các bản phối (bảng Nieweg), nổi tiếng nhất là của Ravel (Winston-Salem Symphony: "The popular orchestration … by Maurice Ravel was made in 1922").'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/musorgskyrussian00calvuoft", "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)" ]
    luot_2_ghi_chu: "Calvocoressi (1919): 'Promenade, which re-appears several times between the various pieces for the purpose of an Interlude'. IMSLP có bản piano gốc (Bessel 1886) và bản phối dàn nhạc của Ravel."
  - id: n5
    cau: 'Hình nghe, chú thích: bản piano gồm mười bức tranh nối với nhau bằng các Promenade; độ dài các ô gần đúng theo thời lượng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wikitext, henle-477-vorwort ]
    ket_qua: dung
    ghi_chu: 'IMSLP: mười bài đánh số 1–10, Promenade [I]–[V] và Cum mortuis xen giữa.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Mussorgsky_Pictures_Exhibition_Piano_Score.pdf", "https://archive.org/details/musorgskyrussian00calvuoft" ]
    luot_2_ghi_chu: "Bìa bản Bessel 1886: 'Série de dix pièces pour piano'; Calvocoressi: Promenade làm interlude. Độ dài gần đúng: xem n12."
  - id: n6
    cau: 'Hình nghe: Promenade đầu tiên ở Si♭ trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mut-pictures, bessel-1886 ]
    ket_qua: dung
    ghi_chu: 'Mutopia promenade-1.ly: \key bes \major, nhịp 5/4 xen 6/4. (Incipit trên IMSLP ghi \key g \minor là lỗi của người gõ incipit; nốt G F B♭ C F D là đầu giai điệu Si♭ trưởng.)'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Mussorgsky_Pictures_Exhibition_Piano_Score.pdf" ]
    luot_2_ghi_chu: "Bản Bessel tr. 3: Promenade hóa biểu hai giáng, kết hợp âm Si♭ trưởng."
  - id: n7
    cau: 'Hình nghe, thứ tự 16 ô: Promenade, 1. Gnomus, Promenade, 2. Lâu đài cổ, Promenade, 3. Tuileries, 4. Bydło, Promenade, 5. Gà con, 6. Goldenberg và Schmuÿle, Promenade, 7. Limoges, 8. Catacombae, Cum mortuis, 9. Baba Yaga, 10. Cổng lớn Kiev.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wikitext, mut-pictures ]
    ket_qua: dung
    ghi_chu: 'Khớp danh sách "16 movements" của IMSLP và thứ tự các tệp của Mutopia (promenade-1 … promenade-5, catacombae, promenade-6 = Cum mortuis).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)" ]
    luot_2_ghi_chu: "IMSLP liệt kê 16 phần đúng thứ tự: Promenade, Gnomus, Promenade, Il vecchio castello, Promenade, Tuileries, Bydło, Promenade, Ballet of the Unhatched Chicks, Goldenberg und Schmuÿle, Promenade, Limoges, Catacombae, Cum mortuis in lingua mortua, Baba-Yaga, The Great Gate of Kiev."
  - id: n8
    cau: 'Hình nghe: Promenade trước Limoges (Promenade thứ năm) là bài Ravel bỏ trong bản phối.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ wss-notes, imslp-wikitext ]
    ket_qua: dung
    ghi_chu: 'Winston-Salem Symphony: Promenade "recurs throughout the work … (Ravel chose to omit one of these)". Tổng phổ Ravel (Boosey & Hawkes 1929, Internet Archive ybimslp01545): sau Goldenberg là Limoges, không có Promenade; bốn Promenade còn lại ở tr. 5, 25, 42, 56 của PDF. Xem hồ sơ trang n31.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Orchestrations_and_Arrangements_of_Mussorgsky%27s_%27Pictures_at_an_Exhibition%27", "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)" ]
    luot_2_ghi_chu: "Bảng các bản phối trên IMSLP: Ravel 1922 có 15 phần so với 16 của bản gốc; một bản phối bổ sung ghi 'additional orchestration to Ravel's version, including Promenade V'. Promenade V đứng trước Limoges."
  - id: n9
    cau: 'Hình nghe: Cum mortuis là Promenade ở giọng thứ.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ henle-477-comments, mut-pictures, bessel-1886 ]
    ket_qua: dung
    ghi_chu: 'Henle: Andante non troppo là "another variant of the Promenade"; Mutopia promenade-6.ly: \key b \minor; lời giới thiệu bản Bessel: "Andante H-Moll".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/musorgskyrussian00calvuoft", "https://archive.org/details/moussorgsky00mont" ]
    luot_2_ghi_chu: "Calvocoressi: Con mortuis là 'a rhythmic transformation of the theme of the Promenade'; lời dẫn bản Bessel: Andante, Si thứ."
  - id: n10
    cau: 'Hình nghe: ở bài 10 (Cổng lớn Kiev), Promenade trở lại.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ gresham-fw, mut-great-gate ]
    ket_qua: dung
    ghi_chu: 'Gresham: "Amongst the bells, we hear the Promenade one last time, now elevated to a grand, rousing hymn." Review D6-L8-gom: lượt 2 khong-chac (không đọc chắc bản Bessel). Review đọc tệp Mutopia great-gate-allegro.ily (nguồn Pavel Lamm): đoạn chuông ô 97–99, bè trên ở đầu mỗi nửa ô: Đô – Si♭ | Mi♭ – Fa – Si♭ | Sol – Fa, đúng bảy nốt mở đầu Promenade (Sol – Fa – Si♭ – Đô – Fa – Rê – Đô, tệp promenade-1.ly) dịch sang Mi♭ trưởng. Promenade trở lại trong Cổng lớn Kiev: đúng. Thêm nguồn mut-great-gate.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không nguồn bậc 2 nào đã mở (IMSLP, Calvocoressi, Montagu-Nathan, Riesemann, ghi chú chương trình K-State) nói Promenade trở lại trong Cổng lớn Kiev; chỉ có blog. Bản Bessel tr. 31–33 (đoạn chuông, Meno mosso) đã xem nhưng ở độ phân giải ảnh không đọc chắc được câu Promenade. Cần đọc kỹ bản nhạc hay nguồn phân tích.
    review: dung
  - id: n11
    cau: 'Hình nghe, tên các bài: Gnomus, Lâu đài cổ (Il vecchio castello), Tuileries, Bydło, Gà con (Vũ khúc gà con chưa nở), Goldenberg và Schmuÿle, Limoges, Catacombae, Baba Yaga, Cổng lớn Kiev.'
    loai: ten
    truong: [ hinh ]
    nguon: [ imslp-wikitext ]
    ket_qua: dung
    ghi_chu: 'Tên rút gọn của các bài 1–10 theo IMSLP; tên tiếng Việt khớp bảng "Sơ đồ cấu trúc" của trang.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Mussorgsky_Pictures_Exhibition_Piano_Score.pdf", "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)" ]
    luot_2_ghi_chu: "Lời dẫn bản Bessel: Gnomus, Il vecchio castello, Tuileries, Bydlo, 'Ballet de poussins dans leurs coques', Samuel Goldenberg und Schmuyle, Limoges, Catacombae, Baba-Yaga, La porte des Bohatyrs de Kiew."
  - id: n12
    cau: 'Hình nghe, độ dài các ô (phút, gần đúng): 1,5; 2,5; 0,8; 4; 0,5; 1; 2,5; 0,7; 1,2; 2,2; 1,3; 1,3; 1,7; 1,8; 3,3; 5.'
    loai: so-lieu
    truong: [ hinh ]
    nguon: [ bertoglio-file ]
    ket_qua: dung
    ghi_chu: 'Đối chiếu mốc của bản Bertoglio (trang, ::khoi-nghe): Promenade + Gnomus 4,2 phút (dữ liệu 4,0); Promenade + Lâu đài cổ 5,4 (4,8); Promenade + Tuileries 1,4 (1,5); Bydło 3,1 (2,5); Promenade + gà con 2,1 (1,9); Goldenberg 1,9 (2,2); Promenade + Limoges 3,2 (2,6); Catacombae + Cum mortuis 4,7 (3,5); Baba Yaga 3,1 (3,3); Cổng lớn 4,7 (5,0). Tổng 31,3 phút so với 33,7: đúng mức "gần đúng" của chú thích.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)" ]
    luot_2_ghi_chu: "IMSLP không có mốc từng bài của bản Bertoglio; đối chiếu bản Arkadiev chia file trên cùng trang (phút): 1:20, 3:05, 0:44, 4:47, 0:29, 1:05, 3:03, 0:52, 1:08, 2:40, (không có Promenade V), 1:28, 2:24, 2:21, 3:36, 5:45. Cùng tỷ lệ; tổng các ô 31,3 phút so với 33:43 của Bertoglio. Gần đúng."
  - id: n13
    cau: 'Hình nghe, ghi chú: ô màu Promenade là chủ đề "người xem tranh"; Cum mortuis là biến thể của nó.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ gresham-fw, henle-477-comments ]
    ket_qua: dung
    ghi_chu: 'Gresham: Promenade "is Musorgsky''s self-portrait, depicting him strolling through the exhibition"; Henle: Cum mortuis "another variant of the Promenade".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/musorgskyrussian00calvuoft", "https://archive.org/details/moussorgsky00ries", "https://www.k-state.edu/mtd/events/eventprograms/2022-23/November%2010%202022%20Ensembles%20Program.pdf" ]
    luot_2_ghi_chu: "Calvocoressi trích Stasov: tác giả tự vẽ mình 'pacing here and there'; Riesemann: Promenade 'depicts himself straying from picture to picture'; ghi chú K-State: Promenade là Mussorgsky đi trong phòng tranh, Con mortuis là 'reworking of the Promenade'."
