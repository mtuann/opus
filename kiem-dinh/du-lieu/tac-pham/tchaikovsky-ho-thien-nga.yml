nguon:
  - id: imslp
    bac: 2
    ten: IMSLP, Swan Lake (ballet), Op.20 (Tchaikovsky, Pyotr)
    link: https://imslp.org/wiki/Swan_Lake_(ballet),_Op.20_(Tchaikovsky,_Pyotr)
  - id: tchaikovsky-research
    bac: 2
    ten: Tchaikovsky Research, Swan Lake (Op. 20, TH 12)
    link: https://en.tchaikovsky-research.net/pages/Swan_Lake
  - id: imslp-swan
    bac: 2
    ten: 'IMSLP, Swan Lake (ballet), Op.20 (Tchaikovsky, Pyotr), wikitext qua api.php: First Performance 1877-03-04 Moscow, Bolshoy Theatre; Year/Date of Composition 1875–77; Piece Style Romantic'
    link: https://imslp.org/wiki/Swan_Lake_(ballet),_Op.20_(Tchaikovsky,_Pyotr)
  - id: imslp-tchaikovsky
    bac: 2
    ten: 'IMSLP, Category:Tchaikovsky, Pyotr (wikitext qua api.php): sinh 7/5/1840, mất 6/11/1893; Time Period Romantic'
    link: https://imslp.org/wiki/Category:Tchaikovsky,_Pyotr
  - id: ia-no10
    bac: 1
    ten: Tchaikovsky, Swan Lake, tổng phổ số 10 (Действие II / Acte II, Сцена № 10 Scène, Moderato), bản khắc ký hiệu B.B. 59, tr. 223–234, Internet Archive imslp-lake-ballet-op20-tchaikovsky-pyotr, file Swan_Lake_-_No._10.pdf
    link: https://archive.org/details/imslp-lake-ballet-op20-tchaikovsky-pyotr
  - id: tr-swan
    bac: 2
    ten: "Tchaikovsky Research, Swan Lake (Op. 20, TH 12), mã wiki (action=raw): «composed between August 1875 and April 1876, with additions and revisions in February and April 1877»; Act II No. 10 «Scene (Scène). Moderato (70 bars)»; No. 13 «Dances of the Swans», bảy phần; tóm tắt bản 1877: Odette «the Princess Odette, the unwanted stepdaughter of an evil sorceress», lời nguyền giữ các cô gái «as swans by day and humans by night», von Rothbart xuất hiện ở màn 3 cùng Odile; công diễn Bolshoi, Moskva, 20/2 (4/3) 1877, «The production went well, and it remained in the repertoire until the 1882/83 season, after which it was not performed again in Russia during the composer's lifetime»; bản dựng 15/27/1/1895 ở Nhà hát Mariinsky, St. Petersburg, biên đạo Petipa và Ivanov; «the version of the ballet widely promulgated in the 20th century originated after the composer's death»"
    link: https://en.tchaikovsky-research.net/pages/Swan_Lake
nhan_dinh:
  - id: n1
    cau: Tên «Hồ thiên nga» là tên ballet Swan Lake của Tchaikovsky (tên cả vở, không nêu đoạn trích).
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, tchaikovsky-research ]
    ket_qua: dung
    ghi_chu: "Trang hướng dẫn nghe chỉ dùng đoạn Scène của màn 2 (IMSLP ghi «Scène. Moderato (Act II No.10)», Tchaikovsky Research ghi số 10 «Scene Moderato»); trang cũ đặt tiêu đề «Hồ thiên nga, Cảnh (màn 2)». Tên chỉ nêu cả vở nên không sai; gợi ý biên tập: thêm «, Cảnh (màn 2)»."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Swan_Lake,_Op.20_(Tchaikovsky,_Pyotr_Ilyich)", https://id.loc.gov/authorities/names/n81019548.json, http://www.hbso.org.vn/chuong-trinh.html ]
    luot_2_ghi_chu: "IMSLP: Swan Lake (Op.20, TH 12), the complete ballet in 4 acts (alt. Лебединое озеро; Le Lac des Cygnes; Schwanensee). LoC n81019548: 'op. 20. Lebedinoye ozero (Swan lake), ballet'; title-page note 'Le lac des cygnes = The swan lake: op. 20, grand ballet in four acts'. HBSO program page lists 'VŨ KỊCH HỒ THIÊN NGA - Âm nhạc: P. I. TCHAIKOVSKY' (Vietnamese title in official use)."
  - id: n2
    cau: Tác giả là Pyotr Ilyich Tchaikovsky.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, tchaikovsky-research ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Swan_Lake,_Op.20_(Tchaikovsky,_Pyotr_Ilyich)", https://id.loc.gov/authorities/names/n81019548.json ]
    luot_2_ghi_chu: "IMSLP composer field: Tchaikovsky, Pyotr. LoC heading 'Tchaikovsky, Peter Ilich, 1840-1893. Lebedinoe ozero' (same person)."
  - id: n3
    cau: Op. 20 là số opus của ballet Hồ thiên nga, tác phẩm chứa đoạn Scène màn 2.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, tchaikovsky-research ]
    ket_qua: dung
    ghi_chu: Tchaikovsky Research ghi thêm TH 12.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Swan_Lake,_Op.20_(Tchaikovsky,_Pyotr_Ilyich)", https://id.loc.gov/authorities/names/n81019548.json ]
    luot_2_ghi_chu: "IMSLP Op./Cat. No. = Op.20 ; TH 12 for the whole ballet; Act II numbers are 10 'Scène', 11 'Scène', 12 'Scène', 13 'Danses des cygnes', 14 'Scène' (so an Act II Scène belongs to Op. 20). LoC: 'op. 20 ... ballet'."
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-swan, imslp-tchaikovsky ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Swan Lake «Piece Style Romantic»; Tchaikovsky «Time Period Romantic».'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Swan_Lake_(ballet),_Op.20_(Tchaikovsky,_Pyotr)" ]
    luot_2_ghi_chu: "IMSLP: Composer Time Period và Piece Style đều Romantic."
  - id: n5
    cau: 'Luyện nghe: nhạc ballet, âm sắc.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ tchaikovsky-research, ia-no10 ]
    ket_qua: dung
    ghi_chu: Hồ thiên nga là ballet (Tchaikovsky Research); số 10 đặt chủ đề ở oboe trên đàn hạc và đàn dây tremolo, rồi ở bốn horn (tổng phổ tr. 223–226).
    luot_2: dung
    luot_2_nguon: [ "https://en.tchaikovsky-research.net/pages/Swan_Lake", "https://imslp.org/wiki/Swan_Lake_(ballet),_Op.20_(Tchaikovsky,_Pyotr)" ]
    luot_2_ghi_chu: "Tchaikovsky Research và IMSLP: tác phẩm là ballet (thể loại Ballets), viết cho dàn nhạc lớn (bộ gỗ, đồng, bộ gõ nhiều loại, harp, dây). Nhãn 'âm sắc' là trọng tâm luyện nghe, hợp với một bản nhạc ballet cho dàn nhạc."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích "Hồ thiên nga, cảnh mở đầu màn 2: mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)."; các ô: Mặt hồ ban đêm (đàn hạc rải · dây tremolo); Chủ đề thiên nga (oboe); Nhắc lại (thêm nhạc cụ · to dần); Fortissimo (kèn đồng và cả dàn nhạc); Lắng xuống (huyền bí).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - ia-no10
      - tr-swan
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/tchaikovsky-ho-thien-nga (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n14, n15, n16, n17, n18 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: ia-no10, tr-swan. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n25 của hồ sơ trang. Soát hình 3C (gộp review và kiểm mẫu): hinh.nghe khớp trang trên bản xem (07/11/2026), xem n25 của kiem-dinh/nghe-nhac/tchaikovsky-ho-thien-nga.yml: 5 ô theo 5 dòng bảng Theo dõi: đàn hạc rải và dây tremolo, oboe hát chủ đề, nhắc lại to dần, kèn đồng và cả dàn nhạc fortissimo, lắng xuống huyền bí. Kết quả: dung.'
    luot_2: dung
    luot_2_nguon: [ "kiem-dinh/nghe-nhac/tchaikovsky-ho-thien-nga.yml" ]
    luot_2_ghi_chu: "Các ô khớp thứ tự và số lượng các dòng của bảng cùng tên trên trang (đã đối chiếu từng ô: tên và chữ rút gọn); các nhận định tương ứng của hồ sơ trang đều có kết quả và lượt 2 dung hoặc đã sửa và review dung."
    review: dung
