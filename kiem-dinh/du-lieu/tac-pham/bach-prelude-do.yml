    luot_2_ghi_chu: 'Trinity piano Grade 5 repertoire list (from 2023), no.6: "Prelude in C, BWV 846 (from The Well-Tempered Clavier book 1)". Henle: Prelude level 1 (fugue 6); RCM lists only the Prelude and Fugue pair (Level 10); not in ABRSM 2013-26 grade lists. Grade 5 lies inside 4-5.'
