    ghi_chu: 'Đề cương chính thức: Trinity (danh sách từ 2023, bản tháng 8/2026) xếp "Prelude in C, BWV 846 (from The Well-Tempered Clavier book 1)" ở Grade 5 (sách Piano Exam Pieces Plus Exercises from 2023: Grade 5). ABRSM không có prelude này trong các danh sách chung 2017–2028 (chỉ có bản chuyển cho một tay trái ở 2027–2028). Henle mức 1 (easy, thấp nhất); RCM 2022: cặp prelude và fugue BWV 846 ở Level 10. Trinity Grade 5 nằm trong khoảng Grade 4–5; mức Henle 1 phản ánh nốt dễ, còn độ khó nằm ở sự đều đặn và tiếng đàn.'
