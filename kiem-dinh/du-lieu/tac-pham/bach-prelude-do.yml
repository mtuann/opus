    ghi_chu: "chưa chắc: \"Bach không ghi tốc độ\" đúng (Henle, Schiff: quyển 1 chỉ có chỉ dẫn tốc độ ở prelude Đô thứ, Mi thứ, Si thứ). \"Thường ♩ ≈ 60–72\": tính từ độ dài bốn bản thu (35 ô × 4 phách): Schiff 1:48 ≈ ♩ 78, Richter 1:58 ≈ 71, Gould 2:22 ≈ 59, Ishizaka 2:43 ≈ 52 (bỏ qua chậm dần cuối bài). Hai trong bốn bản nằm trong khoảng ghi. Đề xuất có điều kiện ở sua-A.yml. Review D6-L3-gom: Lượt 2: \"♩ ≈ 60–72\" là thói quen diễn, không có nguồn chuẩn; bốn bản thu lượt 1 đo từ ♩ ≈ 52 đến 78. Bỏ phần trong ngoặc, giữ \"Bach không ghi tốc độ\" (hai lượt cùng xác nhận) (doi_chu ở trang)."
