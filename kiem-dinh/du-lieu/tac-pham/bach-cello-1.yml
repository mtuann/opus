nhan_dinh:
  - id: n1
    cau: Tên «Tổ khúc cello số 1, Prelude» chỉ chương 1 (Prélude) của Tổ khúc cho cello solo số 1 cung Sol trưởng.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    ghi_chu: IMSLP liệt kê 7 chương, chương 1 là Prélude; Henle ghi Suite G major BWV 1007 đứng đầu bộ sáu tổ khúc BWV 1007–1012.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Cello_Suite_No.1_in_G_major,_BWV_1007_(Bach,_Johann_Sebastian)", https://www.bach-digital.de/api/v1/objects/BachDigitalWork_work_00001186, https://id.loc.gov/authorities/names/n80152932.json ]
    luot_2_ghi_chu: "IMSLP (Cello Suite No.1 in G major, BWV 1007): 7 movements, the first is 'Prélude'. Bach Digital BWV 1007: 'Suite 1 in G' for solo violoncello. LoC n80152932: 'Suites, cello, BWV 1007, G major'."
  - id: n2
    cau: Tác giả là Johann Sebastian Bach.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Cello_Suite_No.1_in_G_major,_BWV_1007_(Bach,_Johann_Sebastian)", https://id.loc.gov/authorities/names/n80152932.json ]
    luot_2_ghi_chu: "IMSLP composer field: Bach, Johann Sebastian. LoC heading 'Bach, Johann Sebastian, 1685-1750'."
  - id: n3
    cau: BWV 1007 là số danh mục của Tổ khúc cho cello solo số 1 cung Sol trưởng.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Cello_Suite_No.1_in_G_major,_BWV_1007_(Bach,_Johann_Sebastian)", https://www.bach-digital.de/api/v1/objects/BachDigitalWork_work_00001186, https://id.loc.gov/authorities/names/n80152932.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = BWV 1007 (G major, cello). Bach Digital label 'BWV 1007'. LoC heading 'Suites, cello, BWV 1007, G major'.
  - id: n4
    cau: 'Thời kỳ: Baroque.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Baroque".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Bach,_Johann_Sebastian", "https://imslp.org/wiki/Cello_Suite_No.1_in_G_major,_BWV_1007_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: 'IMSLP: Bach "People from the Baroque era"; trang BWV 1007 ghi Comp. Period và Piece Style: Baroque.'
  - id: n5
    cau: 'Luyện nghe: hòa âm trên một nhạc cụ chủ yếu chơi một bè.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ mutopia-1007 ]
    ket_qua: dung
    ghi_chu: 'Dữ liệu ghi "Hòa âm trên một nhạc cụ một bè". Mutopia Prelude: ô 1–32, 37–41 là chuỗi móc kép một bè rải hợp âm (hòa âm I – IV – V – I ở ô 1–4); chỉ ô 33–36 viết hai bè và ô 42 là hợp âm ba nốt. "Một bè" hiểu là nhạc cụ chủ yếu chơi một nốt mỗi lúc, như trang nghe-nhac/bach-cello-1 (n17) nói: giữ, không đề xuất sửa.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Cello_Suite_No.1_in_G_major,_BWV_1007_(Bach,_Johann_Sebastian)", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=517", "https://www.mutopiaproject.org/ftp/BachJS/BWV1007/bwv1007/bwv1007-lys.zip" ]
    luot_2_ghi_chu: "IMSLP: Instrumentation: cello (đàn một mình). Bản Mutopia (Schirmer 1916): Prélude là một bè móc kép rải hợp âm (g16 d' b' a b d, …) nên nghe ra hòa âm; hợp âm thật (nhiều nốt cùng lúc) chỉ thỉnh thoảng, như vài chỗ ở Sarabande."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích "Tổ khúc cello số 1, Prelude: mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)."; các ô: Mở đầu (hợp âm rải trên dây Sol buông · I – IV – V – I); Đi xa dần (sang vùng Rê trưởng (giọng át)); Fermata (dừng trên Rê, âm át); Bariolage (nốt La lặp lại xen các nốt khác); Dồn lên (Rê lặp lại, các nốt đi lên nửa cung · nốt cao nhất); Kết (những hợp âm cuối · Sol trưởng).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - mutopia-1007
      - cod-bariolage
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/bach-cello-1 (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n22, n23, n24, n25, n26, n27 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: mutopia-1007, cod-bariolage. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n33 của hồ sơ trang. Soát hình 3C (gộp review và kiểm mẫu): hinh.nghe khớp trang trên bản xem (07/11/2026), xem n33 của kiem-dinh/nghe-nhac/bach-cello-1.yml: 6 ô Mở đầu, Đi xa dần, Fermata, Bariolage, Dồn lên, Kết theo đúng thứ tự 6 dòng bảng Theo dõi; chữ trong ô (dây Sol buông, I – IV – V – I, Rê trưởng giọng át, dừng trên Rê, nốt La lặp lại, nửa cung đi lên tới nốt cao nhất, Sol trưởng) đều có trong dòng tương ứng. Kết quả: dung.'
    luot_2: dung
    luot_2_nguon: [ "kiem-dinh/nghe-nhac/bach-cello-1.yml" ]
    luot_2_ghi_chu: "Các ô khớp thứ tự và số lượng các dòng của bảng cùng tên trên trang (đã đối chiếu từng ô: tên và chữ rút gọn); các nhận định tương ứng của hồ sơ trang đều có kết quả và lượt 2 dung hoặc đã sửa và review dung."
    review: dung
