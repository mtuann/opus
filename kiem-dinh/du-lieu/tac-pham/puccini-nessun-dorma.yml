nguon:
  - id: imslp
    bac: 2
    ten: IMSLP, Turandot, SC 91 (Puccini, Giacomo)
    link: https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)
  - id: puccini-catalog
    bac: 2
    ten: Giacomo Puccini, Catalogue of the Works (catalog.puccini.it), Turandot
    link: https://catalog.puccini.it/works
  - id: imslp-wt
    bac: 2
    ten: 'IMSLP, Turandot, SC 91 (wikitext qua api.php, 06/11/2026): "Piece Style=Romantic"; Act III "33. Cosi comanda Turandot", "34. Nessun dorma!"; vai "Calaf (tenor)"'
    link: 'https://imslp.org/wiki/Turandot,_SC_91_(Puccini,_Giacomo)'
  - id: ricordi-fs
    bac: 1
    ten: 'Puccini, Turandot, tổng phổ Ricordi (P.R. 117; bản in lại "Opera Full Score Series"), Internet Archive (giacomopuccinitu0000vari): màn 3 tr. 322–330 (sứ giả tr. 322, hợp xướng vọng lại tr. 323, aria từ tr. 324 "Andante sostenuto"), bè "IL PRINCIPE" (Calaf, tenor)'
    link: 'https://archive.org/details/giacomopuccinitu0000vari'
  - id: libretto
    bac: 1
    ten: 'Giuseppe Adami, Renato Simoni, Turandot: dramma lirico in tre atti e cinque quadri (Milano, G. Ricordi & C., 1926), Internet Archive (turandotdrammali02adam): "A Pekino - al tempo delle favole"; buổi diễn đầu "25 aprile 1926", "Maestro direttore e concertatore Arturo Toscanini"; "Timur - Re tartaro spodestato", "Il Principe Ignoto (Calaf) suo figlio"; luật "spieghi i tre enigmi … Ma chi affronta il cimento e vinto resta porga alla scure la superba testa"; cuối màn 2 "Dimmi il mio nome prima dell’alba, e all’alba io morirò"; đầu màn 3: vườn cung điện, đêm, "voci di Araldi … Altre voci, vicine e lontane, fanno eco", "Questa notte nessun dorma in Pekino", "Pena la morte", Hoàng tử nằm trên bậc thềm; lời aria "Tu pure, o Principessa, nella tua fredda stanza guardi le stelle … il nome mio nessun saprà", "VOCI DI DONNE misteriose e lontane: Il nome suo nessun saprà… E noi dovremo, ahimè, morir!", "Dilegua, o notte!… Tramontate, o stelle!… All’alba vincerò!"'
    link: https://archive.org/details/turandotdrammali02adam
nhan_dinh:
  - id: n1
    cau: Tên «"Nessun dorma" (Turandot)» chỉ aria Nessun dorma ở màn 3 của opera Turandot.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp ]
    ket_qua: dung
    ghi_chu: IMSLP ghi «Nessun dorma (Act III, No.34)».
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Turandot,_SC_91_(Puccini,_Giacomo)", https://id.loc.gov/authorities/names/n81150111.json ]
    luot_2_ghi_chu: "IMSLP Turandot (SC 91, dramma lirico in tre atti): Act III, '34. Nessun dorma!' (IMSLP extra info: the famous aria from Act III). LoC n81150111: 'Puccini, Giacomo, 1858-1924. Turandot. Nessun dorma' (New Grove dict. of opera)."
  - id: n2
    cau: Tác giả là Giacomo Puccini.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, puccini-catalog ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Turandot,_SC_91_(Puccini,_Giacomo)", https://id.loc.gov/authorities/names/n81150111.json ]
    luot_2_ghi_chu: "IMSLP composer field: Puccini, Giacomo. LoC heading 'Puccini, Giacomo, 1858-1924. Turandot. Nessun dorma'. (IMSLP: the aria's orchestration is Puccini's own; Alfano completed only the end of Act III.)"
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong:
      - thoi_ky
    nguon:
      - imslp-wt
    ket_qua: dung
    ghi_chu: IMSLP "Piece Style=Romantic"; nha-soan-nhac.yml (puccini, đã khóa) cũng ghi Lãng mạn.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)" ]
    luot_2_ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Romantic; Turandot năm 1926. Cũng có thể xếp verismo hay đầu thế kỷ 20, nhưng xếp Lãng mạn là hợp lý."
  - id: n5
    cau: 'Luyện nghe: aria opera, giọng tenor.'
    loai: cau-truc
    truong:
      - luyen_nghe
    nguon:
      - imslp-wt
      - ricordi-fs
    ket_qua: dung
    ghi_chu: '"Nessun dorma" là aria của Calaf (tenor) ở màn 3; tổng phổ ghi bè "Il Principe" khóa Sol tám độ thấp.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)" ]
    luot_2_ghi_chu: "IMSLP: \"Aria: 'Nessun dorma' (Act III)\" (bản thu là của Jacques Pottier, giọng tenor); trong danh sách vai, Calaf là tenor."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích ""Nessun dorma": mỗi ô một dòng của bảng "Sơ đồ cấu trúc" ngay dưới (độ rộng các ô chỉ minh họa)."; các ô: Mở đầu (lệnh "không ai được ngủ" · Calaf nhắc lại "Nessun dorma!"); Đoạn giữa (công chúa ngắm sao · bí mật tên chàng); Hợp xướng xen vào (giọng phụ nữ từ xa); Kết ("Vincerò!" · Si cao rất ngắn, La ngân dài).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - libretto
      - ricordi-fs
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Sơ đồ cấu trúc" của trang nghe-nhac/puccini-nessun-dorma (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n23, n24, n25, n26 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: libretto, ricordi-fs. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n39 của hồ sơ trang.'
