    luot_2_nguon: [ "https://imslp.org/wiki/Erlk%C3%B6nig,_D.328_(Schubert,_Franz)", https://id.loc.gov/authorities/names/n97082928.json ]
    luot_2_ghi_chu: "IMSLP Op./Cat. No. = D.328 ; Op.1. LoC (New Grove): 'D. 328, Erlkönig'."
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-erl, imslp-schubert ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Erlkönig «Piece Style Romantic»; Schubert «Time Period Romantic».'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Erlk%C3%B6nig,_D.328_(Schubert,_Franz)" ]
    luot_2_ghi_chu: "IMSLP: Composer Time Period và Piece Style đều Romantic."
  - id: n5
    cau: 'Luyện nghe: ca khúc nghệ thuật, một ca sĩ bốn vai.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ imslp-erl, lumen-erl, peters-erl ]
    ket_qua: dung
    ghi_chu: 'IMSLP: voice, piano, tag lieder; Lumen: bốn nhân vật «usually all sung by a single vocalist»; bản Peters chỉ có một dòng giọng hát cho cả bốn vai.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Erlk%C3%B6nig,_D.328_(Schubert,_Franz)", "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig.ly" ]
    luot_2_ghi_chu: "IMSLP: biên chế voice, piano; lời Goethe. Mutopia (theo C.F. Peters): 'Gesang ... für eine Singstimme mit Klavierbegleitung'; bè hát chia bốn vai NARRATEUR, PERE, ENFANT, ROIDESAULNES (người kể, cha, con, vua Erl)."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích "Erlkönig: mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)."; các ô: Piano mở đầu (vó ngựa liên ba); Người kể (cha và con trong đêm); Cha và con (con thấy Vua tinh · cha: sương mù); Vua tinh 1 (dỗ dành · giọng trưởng); Con kêu 1 (cha: gió xào xạc); Vua tinh 2, con kêu 2 (cao hơn); Vua tinh 3, con kêu 3 (đe dọa · cao nhất); Phi nhanh hơn (piano dồn dập); Về đến nơi (piano ngừng · đứa con đã chết).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - peters-erl
      - hyperion-erl
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/schubert-erlkonig (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n19, n20, n21, n22, n23, n24, n25, n26, n27 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: peters-erl, hyperion-erl. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n33 của hồ sơ trang. Soát hình 3C (gộp review và kiểm mẫu): hinh.nghe khớp trang trên bản xem (07/11/2026), xem n33 của kiem-dinh/nghe-nhac/schubert-erlkonig.yml: 9 ô theo 9 dòng bảng Theo dõi: vó ngựa liên ba, người kể, cha và con (sương mù), Vua tinh 1 giọng trưởng, con kêu 1 (gió xào xạc), lần 2 cao hơn, lần 3 đe dọa cao nhất, phi nhanh hơn, piano ngừng và đứa con đã chết. Kết quả: dung.'
    luot_2: dung
    luot_2_nguon: [ "kiem-dinh/nghe-nhac/schubert-erlkonig.yml" ]
    luot_2_ghi_chu: "Các ô khớp thứ tự và số lượng các dòng của bảng cùng tên trên trang (đã đối chiếu từng ô: tên và chữ rút gọn); các nhận định tương ứng của hồ sơ trang đều có kết quả và lượt 2 dung hoặc đã sửa và review dung."
    review: dung
