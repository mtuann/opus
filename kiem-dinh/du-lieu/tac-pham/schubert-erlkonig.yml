    luot_2_ghi_chu: "IMSLP: Erlkönig, D.328 (Op.1), voice and piano, text by Goethe, 1815. LoC n97082928: 'Schubert, Franz, 1797-1828. Erlkönig' (Grove: Songs: D. 328, Erlkönig; words by Goethe)."
  - id: n2
    cau: Tác giả là Franz Schubert.
    loai: lich-su
