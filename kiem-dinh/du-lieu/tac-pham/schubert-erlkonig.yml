    bac: 2
    ten: 'IMSLP, Erlkönig, D.328 (Schubert, Franz), wikitext qua api.php: D.328 ; Op.1; Key g; Schnell; Year/Date of Composition 1815; in 1821 Vienna: Diabelli & Cappi (bản thứ 4); Average Duration 4 minutes; lời Goethe; Piece Style Romantic; Instrumentation voice, piano; Tags lieder'
    link: https://imslp.org/wiki/Erlk%C3%B6nig,_D.328_(Schubert,_Franz)
  - id: imslp-schubert
    bac: 2
    ten: 'IMSLP, Category:Schubert, Franz (wikitext qua api.php): sinh 31/1/1797, mất 19/11/1828; Time Period Romantic'
    link: https://imslp.org/wiki/Category:Schubert,_Franz
  - id: peters-erl
    bac: 1
    ten: 'Schubert-Album, Sammlung der Lieder für eine Singstimme mit Pianofortebegleitung, Band I (Max Friedlaender biên tập), Leipzig: C. F. Peters, khoảng 1890, Internet Archive schubertalbumsam00schu_0: Erlkönig Op. 1, tr. 170–175, «Schnell (♩ = 152)», C (4/4), hai giáng; chú giải tr. 263: «Komponiert 1815 (in Schuberts 19. Lebensjahre)»'
    link: https://archive.org/details/schubertalbumsam00schu_0
  - id: lumen-erl
    bac: 2
    ten: "Lumen Learning, Music Appreciation (Tidewater Community College, giáo trình mở), chương Art Song: «The four characters … are usually all sung by a single vocalist with each character's part placed in a different vocal range»; Narrator «middle range», Father «low range, calming», Son «high range», mỗi lần «Mein Vater» «one step higher»; Erlking «major mode … softer dynamic»; tay phải liên ba «simulate the horse's galloping … throughout the whole piece, up until the last three bars»; tay trái «low-register leitmotif composed of successive triplets … dark and ominous»; «through-composed»"
    link: https://courses.lumenlearning.com/vccs-tcc-music-rford/chapter/art-song
  - id: hyperion-erl
    bac: 2
    ten: "Hyperion Records, Erlkönig, D328, ghi chú của Graham Johnson (1990): «October (?) 1815; published in 1821 as Op 1»; lời Goethe 1782; «Only at the very end does Schubert make use of recitative»; Vua tinh «an embellished vocal line in the major key»; «in one of these he re-writes the fiendish piano triplets as simple quaver duplets. He found it hard for his own piano technique…»"
    link: https://www.hyperion-records.co.uk/tw.asp?w=W1933
  - id: commons-bt-schubert-erlkonig
    bac: 2
    ten: Wikimedia Commons, trang file của bản thu (Ernestine Schumann-Heink)
    link: https://commons.wikimedia.org/wiki/File:Schubert_-_Schumann-Heink_-_Erlk%C3%B6nig.ogg
