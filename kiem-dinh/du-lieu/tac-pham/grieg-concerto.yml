nhan_dinh:
  - id: n1
    cau: Tên «Concerto piano» chỉ Concerto cho piano và dàn nhạc cung La thứ của Grieg.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    ghi_chu: Tên ngắn không ghi cung La thứ; số Op. 16 xác định tác phẩm.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n81073732.json ]
    luot_2_ghi_chu: "IMSLP: Piano Concerto in A minor, Op.16 (piano, orchestra). LoC n81073732: 'Concertos, piano, orchestra, op. 16, A minor'."
  - id: n2
    cau: Tác giả là Edvard Grieg.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n81073732.json ]
    luot_2_ghi_chu: "IMSLP composer field: Grieg, Edvard. LoC heading 'Grieg, Edvard, 1843-1907'."
  - id: n3
    cau: Op. 16 là số opus của Concerto cho piano cung La thứ.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n81073732.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.16 (A minor). LoC 'op. 16, A minor'.
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-op16-2 ]
    ket_qua: dung
    ghi_chu: 'IMSLP Piece Style: Romantic.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)" ]
    luot_2_ghi_chu: "IMSLP (WORK INFO): Piece Style Romantic; sáng tác 1868, sửa 1872 và 1906."
  - id: n5
    cau: 'Luyện nghe: concerto, chất dân ca Na Uy.'
    loai: lich-su
    truong: [ luyen_nghe ]
    nguon: [ stonybrook, berliner ]
    ket_qua: dung
    ghi_chu: 'Stony Brook: mô-típ mở đầu theo dân ca Na Uy; Berliner: nhịp halling ở chương cuối.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/cu31924022173003", "https://archive.org/details/concertoforpianoo00grie" ]
    luot_2_ghi_chu: "Finck, Grieg and his music (1909), tr. 205–206: chương cuối là 'energetic folk-dance'; tr. 212: 'Here are Hallings and Spring-dances'. Bản Schirmer: concerto cho piano và dàn nhạc."
  - id: n6
    cau: 'Sơ đồ (hinh.nghe), chương 1: Trình bày (La thứ → Đô trưởng), Phát triển, Tái hiện (chủ đề 2 ở La trưởng), Cadenza (piano một mình), Coda.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-tongpho ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ chương 1: chủ đề 2 Più lento ở Đô trưởng (tr. 9), tái hiện chủ đề 2 ở ba dấu thăng (tr. 25), cadenza viết sẵn cho piano, coda kết bằng hình đổ xuống (tr. 33).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/concertoforpianoo00grie" ]
    luot_2_ghi_chu: "Bản Schirmer hai piano: mở đầu La thứ; tr. 9 chủ đề 2 'tranquillo e cantabile' không hóa biểu (Đô trưởng); tr. 23 chủ đề 2 tái hiện với ba thăng (La trưởng); tr. 26 'Cadenza' (Solo); sau đó coda (Tempo I)."
  - id: n7
    cau: 'Sơ đồ, chương 2: II. Adagio, Rê♭ trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-tongpho ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ chương 2 tr. 1: Adagio, năm dấu giáng.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/concertoforpianoo00grie", "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)" ]
    luot_2_ghi_chu: "Bản Schirmer tr. 34: 'Adagio', 3/8, năm giáng (Rê♭ trưởng); IMSLP: chương II Adagio."
  - id: n8
    cau: 'Sơ đồ, chương 3: III. Halling (La thứ, 2/4), Chủ đề sáo (Fa trưởng), Halling trở lại, Quasi presto (3/4), Andante maestoso (chủ đề sáo, La trưởng).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-tongpho ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ chương 3: tr. 1 2/4; tr. 15 Poco più tranquillo, sáo I. Solo, có Si♭; tr. 31 Quasi Presto 3/4; tr. 36 Andante maestoso, ba dấu thăng.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/concertoforpianoo00grie", "https://archive.org/details/cu31924022173003" ]
    luot_2_ghi_chu: "Bản Schirmer: tr. 42 Allegro marcato 2/4, La thứ; tr. 55 'Poco più tranquillo', chủ đề sáo, Fa trưởng; tr. 60/70 Tempo I (halling trở lại); tr. 74 'Quasi presto' 3/4; tr. 78 'Andante maestoso', ba thăng, chủ đề sáo ở La trưởng. Chữ 'halling' không in trong bản nhạc; Finck tả chương cuối là vũ điệu dân gian (Halling)."
  - id: n9
    cau: 'Ghi chú sơ đồ: chương II nối thẳng sang chương III.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-tongpho ]
    ket_qua: dung
    ghi_chu: Cuối chương 2 (tr. 8) có vạch kép đổi sang hóa biểu và nhịp 2/4 của chương 3 ngay trên cùng dòng, không có chỗ dừng.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/concertoforpianoo00grie" ]
    luot_2_ghi_chu: "Bản Schirmer tr. 41, cuối chương II: 'attacca'."
  - id: n10
    cau: 'Chú thích sơ đồ: độ dài các ô gần đúng theo thời lượng.'
    loai: so-lieu
    truong: [ hinh ]
    nguon: [ commons-odoan ]
    ket_qua: dung
    ghi_chu: 'Tổng độ dài ô: chương 1 12,5; chương 2 6,5; chương 3 10. Bản thu O''Doan: 763,6 / 390,6 / 615,5 giây ≈ 12,7 / 6,5 / 10,3 phút: mỗi ô ≈ một phút.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Edvard_Grieg_-_Concerto_in_A_minor,_1st_movement.ogg" ]
    luot_2_ghi_chu: "Câu chú thích của hình; cơ sở thời lượng có thật: ba file Commons dài 763,59 / 390,61 / 615,53 giây. Không xem được chính hình (ngoài phạm vi lượt 2), chỉ xác nhận thời lượng làm căn cứ."
  - id: n11
    cau: 'Bản thu: Neal O''Doan (piano), University of Washington Symphony, Peter Erős chỉ huy; trang Commons của file chương 1.'
    loai: ten
    truong: [ ban_thu ]
    nguon: [ commons-odoan ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Edvard_Grieg_-_Concerto_in_A_minor,_1st_movement.ogg" ]
    luot_2_ghi_chu: "Mô tả Commons: 'Peter Erős conducts the University of Washington Symphony orchestra; Neal O'Doan, piano.'"
