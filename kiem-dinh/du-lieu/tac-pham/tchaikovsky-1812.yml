  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích "Overture Năm 1812: mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)."; các ô: Largo (lời cầu nguyện · viola và cello); Andante (hiệu kèn · trống con rền); Allegro giusto (dây dồn dập · La Marseillaise (phe Pháp)); Hai giai điệu Nga (trữ tình · dân ca Bên cổng); Trận chiến (Marseillaise trở lại, đan với nhạc Nga); Cao trào (đại bác · dàn nhạc đổ xuống); Chiến thắng (cầu nguyện, chuông · "God Save the Tsar!", đại bác).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - ia-muzyka
      - tr-1812
      - oup-blog
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/tchaikovsky-1812 (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n26, n27, n28, n29, n30, n31, n32 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: ia-muzyka, tr-1812, oup-blog. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n41 của hồ sơ trang. Soát hình 3C (gộp review và kiểm mẫu): hinh.nghe khớp trang trên bản xem (07/11/2026), xem n41 của kiem-dinh/nghe-nhac/tchaikovsky-1812.yml: 7 ô theo 7 dòng bảng Theo dõi: Largo lời cầu nguyện viola và cello, Andante hiệu kèn trên trống con, Allegro giusto và La Marseillaise phe Pháp, hai giai điệu Nga và dân ca Bên cổng, trận chiến, cao trào đại bác, chiến thắng với chuông, God Save the Tsar và đại bác. Kết quả: dung.'
    luot_2: dung
    luot_2_nguon: [ "kiem-dinh/nghe-nhac/tchaikovsky-1812.yml" ]
    luot_2_ghi_chu: "Các ô khớp thứ tự và số lượng các dòng của bảng cùng tên trên trang (đã đối chiếu từng ô: tên và chữ rút gọn); các nhận định tương ứng của hồ sơ trang đều có kết quả và lượt 2 dung hoặc đã sửa và review dung."
