    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)", "https://www.esm.rochester.edu/beethoven/symphony-no-5/" ]
    luot_2_ghi_chu: "IMSLP: 'Allegro con brio (C minor, 502 bars)'. ESM: chương I có 'exposition, development, recapitulation, coda' của hình thức sonata."
