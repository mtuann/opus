  - id: n12
    cau: 'Hình cấu trúc: độ rộng các ô (I 1; II 1,3; III 0,9; IV 1,4) theo gần đúng thời lượng các chương: chương 3 ngắn nhất, chương 2 và chương 4 dài hơn chương 1.'
    loai: so-lieu
    truong: [ hinh ]
    nguon: [ mb-kleiber, mb-karajan ]
    ket_qua: dung
    ghi_chu: 'Kleiber: 7:15, 9:54, 4:57, 10:53 (tỉ lệ 1; 1,37; 0,68; 1,50). Karajan: 7:18, 10:04, 4:54, 9:05 (1; 1,38; 0,67; 1,24). Thứ tự ngắn dài đúng; ô III vẽ 0,9 rộng hơn tỉ lệ thật (khoảng 0,7), chu_thich không nói hình theo thời lượng nên không ghi là sai. Người giao có thể đổi 0.9 thành 0.7 nếu muốn hình sát thời lượng. Review D6-L10-gom: giữ độ rộng 0,9 cho ô III. Hai lượt cùng thấy thứ tự ngắn dài đúng (III ngắn nhất; II, IV dài hơn I) và tỉ lệ thật khoảng 0,7–0,8; câu và chú thích hình chỉ nói "gần đúng", hình không ghi thời lượng. Đổi là tùy chọn, không cần cho đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "Thời lượng track của các bản thu Naxos trên trang IMSLP (giây, I/II/III/IV): Walter 376/689/356/523; 1960 483/593/347/683; 416/558/297/662; 458/576/337/683; Furtwängler 457/611/349/488; Skrowaczewski 419/572/295/653; 460/641/336/509. Ở mọi bản: III ngắn nhất, II và IV dài hơn I. Tỉ lệ 1 : 1,3 : 0,9 : 1,4 là gần đúng (III thực tế thường còn ngắn hơn, khoảng 0,7–0,8 của I), hợp với chữ 'gần đúng'."

