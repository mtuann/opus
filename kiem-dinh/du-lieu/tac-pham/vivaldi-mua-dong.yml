nhan_dinh:
  - id: n1
    cau: Tên «Mùa đông, chương 1» chỉ chương 1 (Allegro non molto) của Concerto «L'inverno» (Mùa đông) cung Fa thứ trong Bốn Mùa.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp-rv297, imslp-op8, henle ]
    ket_qua: dung
    ghi_chu: IMSLP liệt kê 3 chương, chương 1 là Allegro non molto.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto_in_F_minor,_RV_297_(Vivaldi,_Antonio)", https://id.loc.gov/authorities/names/n82144279.json ]
    luot_2_ghi_chu: "IMSLP: Violin Concerto in F minor, RV 297, alt. title 'L'inverno (Winter) from Le quattro stagioni'; 3 movements: Allegro non molto; Largo; Allegro. LoC n82144279 (Ryom): 'RV 297, op. 8, no. 4, L'inverno'."
  - id: n2
    cau: Tác giả là Antonio Vivaldi.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp-rv297, imslp-op8, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto_in_F_minor,_RV_297_(Vivaldi,_Antonio)", https://id.loc.gov/authorities/names/n82144279.json ]
    luot_2_ghi_chu: "IMSLP composer field: Vivaldi, Antonio. LoC heading 'Vivaldi, Antonio, 1678-1741'."
  - id: n3
    cau: Op. 8 số 4 là số của Concerto «L'inverno» (RV 297) trong tập Il cimento dell'armonia e dell'inventione, Op. 8.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp-rv297, imslp-op8, henle ]
    ket_qua: dung
    ghi_chu: Henle ghi «L'Inverno f minor op. 8,4 RV 297».
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto_in_F_minor,_RV_297_(Vivaldi,_Antonio)", "https://imslp.org/wiki/Il_cimento_dell'armonia_e_dell'inventione,_Op.8_(Vivaldi,_Antonio)", https://id.loc.gov/authorities/names/n82144279.json ]
    luot_2_ghi_chu: "IMSLP: Op./Cat. No. = RV 297 ; Op.8 No.4. IMSLP Op.8 page ('Il cimento dell'armonia e dell'inventione', 12 concertos; RV 269, 315, 293, 297, ...) lists 'Violin Concerto in F minor L'inverno' fourth. LoC n82144279 (Ryom): 'RV 297, op. 8, no. 4, L'inverno'."
  - id: n4
    cau: 'Thời kỳ: Baroque.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-rv297-2 ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Vivaldi,_Antonio" ]
    luot_2_ghi_chu: "IMSLP: 'People from the Baroque era'."
  - id: n5
    cau: 'Luyện nghe: ritornello, miêu tả cái rét.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ mutopia-351, boston ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ: chất liệu dàn nhạc quay lại xen các đoạn độc tấu; câu thơ về cái rét gắn vào các ô (Mutopia), Boston: run, gió, giậm chân, răng va "are marked in the score".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/VivaldiA/O8/winter/winter-lys.zip" ]
    luot_2_ghi_chu: "Bản Mutopia (Op. 8 số 4, theo bản Le Cène): chương I xen kẽ 'Solo'/'Tutti'; sonnet in kèm 'Aggiacciato tremar trà nevi algenti', chữ trên khuông 'Batter dè piedi per il freddo', 'Orrido Vento': miêu tả cái rét."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích "Mùa đông, chương 1: mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa).", ghi chú "Xanh: cả dàn nhạc; vàng: violin độc tấu."; các ô: Mở đầu (cả dàn nhạc · nốt lặp chồng lên nhau); Gió buốt (violin độc tấu · chạy rất nhanh); Giậm chân (dàn nhạc · nốt lặp dồn dập); Thay phiên (độc tấu và dàn nhạc · mở đầu trở lại); Răng va lập cập (violin độc tấu · nốt kép rung nhanh); Kết (cả dàn nhạc · kết trọn ở Fa thứ).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - mutopia-351
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/vivaldi-mua-dong (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n23, n24, n25, n26, n27, n28 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: mutopia-351. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n34 của hồ sơ trang. Soát hình 3C (gộp review và kiểm mẫu): hinh.nghe khớp trang trên bản xem (07/11/2026), xem n34 của kiem-dinh/nghe-nhac/vivaldi-mua-dong.yml: 6 ô theo 6 dòng bảng Theo dõi; tên ô Gió buốt, Giậm chân, Răng va lập cập lấy từ cột Câu thơ tương ứng; màu theo cột Sự kiện: xanh (cả dàn nhạc) cho dòng 1, 3, 6, vàng (violin độc tấu) cho dòng 2, 5, xám cho dòng 4 (thay phiên), đúng ghi chú màu dưới hình. Kết quả: dung.'
    luot_2: dung
    luot_2_nguon: [ "kiem-dinh/nghe-nhac/vivaldi-mua-dong.yml" ]
    luot_2_ghi_chu: "6 ô khớp thứ tự và số lượng 6 dòng bảng; ghi chú màu (xanh/vàng) là cách vẽ, khớp cột \"cả dàn nhạc/violin độc tấu\" của bảng. n23-n28 đều có kết quả, lượt 2 dung."
    review: dung
