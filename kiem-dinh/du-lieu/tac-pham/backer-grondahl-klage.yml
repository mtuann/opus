    ghi_chu: 'Ký hiệu từng đoạn như hồ sơ trang n27–n38. Ranh giới trên bản thu: 0,9 / 17,2 / 32,9 / 40,7 / 54,6 / 66,0 / 80,9 s (xem ghi_chu hồ sơ trang); độ dài làm tròn tới giây. Chia ô 9–10 và 11–14: ô 11 là chỗ câu thứ hai bắt đầu khác câu đầu (tay phải đi xuống, tay trái vào ở phách 4).'
