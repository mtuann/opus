    ghi_chu: "Dữ liệu cũ: \"Bản viết tay mà nhà nghiên cứu Ludwig Nohl được xem đề ngày 27 tháng 4 năm 1810\". Henle: Nohl chép tiêu đề \"Für Elise on 27 April in remembrance of L. v. Bthvn\", \"the 27th of April (without mention of a year)\"; LvBWV: \"datierte er '27. April', sie entstand wohl ebenfalls 1810\". Năm 1810 là suy ra, không có trên bản viết tay. Đề xuất ở sua-A.yml. Review D6-L3-gom: Hai lượt cùng kết luận, nguồn khớp; đồng ý."
