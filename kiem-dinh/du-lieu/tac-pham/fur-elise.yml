    luot_2_ghi_chu: "Lời tựa Henle: theo Nohl, bản viết tay đề 'Für Elise on 27 April in remembrance of L. v. Bthvn', 'the 27th of April (without mention of a year) had always been … connected with the genesis of the work in the year 1810'. IMSLP: 'for which scholarship has generally agreed that 1810 is the year'."
