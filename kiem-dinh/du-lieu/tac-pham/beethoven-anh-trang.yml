    ghi_chu: "Review (24/10/2026): giữ \"khoảng Grade 6–7\" là ước lượng cho riêng chương 1: đề cương chỉ xếp cả sonata (bằng ARSM, ARCT); Henle xếp riêng chương 1 mức 4. Hai lượt đều không tìm thấy nguồn bác bỏ. Lượt 1: không có đề cương nào liệt kê riêng chương 1 trong các kỳ đã đối chiếu (ABRSM 2017–2028 (cùng Grade 8 của 2015–2016); Trinity từ 2023). Henle xếp cả sonata mức 7 (difficult) và không ghi mức riêng cho chương 1; RCM 2022 chỉ liệt kê nguyên sonata ở bậc diploma ARCT. Không có nguồn mở được cho chương 1 riêng lẻ."
    luot_2: khong-chac
    luot_2_nguon: [ https://www.henle.de/en/At-the-Piano-9-well-known-original-pieces/HN-1820, https://www.henle.de/en/Piano-Sonata-no.-14-c-sharp-minor-op.-27-no.-2-Moonlight/HN-1062, https://web.archive.org/web/20210725061338/https://gb.abrsm.org/media/14967/pianoarsm.pdf, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, https://www.trinitycollege.com/qualifications/music/grade-exams/piano/piano-grade-8 ]
    luot_2_ghi_chu: 'No official grade listing of the FIRST MOVEMENT alone found (ABRSM 2015-26 grade lists, Trinity 2021/23 lists, RCM Levels 1-10: none; ABRSM 2013-14 Gr.4/7 lists were not retrievable). Henle rates the movement alone at level 4 (anthology HN 1820; Henle 4 spans ABRSM Grade 4-8 in other pieces, e.g. Op.119/1 = Grade 5, Prelude Op.28/6 = Grade 6, Waltz Op.69/2 = Grade 8). Whole sonata: Henle 7 with "ABRSM: Piano ARSM"; ABRSM ARSM list has "Moonlight Op.27 no.2: complete"; RCM only in ARCT. Grade 6-7 is plausible but not confirmable.'
