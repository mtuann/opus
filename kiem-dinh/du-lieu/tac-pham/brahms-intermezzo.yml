nhan_dinh:
  - id: n1
    cau: Tên «Intermezzo Op. 118 số 2» chỉ Intermezzo cung La trưởng (Andante teneramente), bản số 2 trong Sáu tiểu phẩm piano Op. 118.
    loai: ten
    truong: [ ten ]
