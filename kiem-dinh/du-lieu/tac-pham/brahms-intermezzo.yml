    luot_2_ghi_chu: "IMSLP: 6 Klavierstücke Op.118; no. 2 = 'Intermezzo. Andante teneramente (A major)'. LoC n87823739: 'Stücke, piano, op. 118. Intermezzo, A major' (New Grove: op. 118, 2, Intermezzo, A)."
  - id: n2
    cau: Tác giả là Johannes Brahms.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/6_Klavierst%C3%BCcke,_Op.118_(Brahms,_Johannes)", https://id.loc.gov/authorities/names/n83056934.json ]
    luot_2_ghi_chu: "IMSLP composer field: Brahms, Johannes. LoC n83056934 heading 'Brahms, Johannes, 1833-1897. Stücke, piano, op. 118'."
  - id: n3
    cau: «Op. 118 số 2» là số hiệu của Intermezzo cung La trưởng, bản thứ hai trong 6 Klavierstücke Op. 118.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/6_Klavierst%C3%BCcke,_Op.118_(Brahms,_Johannes)", https://id.loc.gov/authorities/names/n87823739.json, https://id.loc.gov/authorities/names/n83056934.json ]
    luot_2_ghi_chu: "IMSLP: Op.118 = 6 pieces (1893), no. 2 = Intermezzo in A major. LoC n83056934 (Grove): '(6) Clavierstücke, by 1893'; n87823739: Op. 118 no. 2, Intermezzo in A."
  - id: n4
    cau: 'Thời kỳ: Cuối Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wt, ptna-213 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Piece Style Romantic, sáng tác 1893; PTNA: "One of Brahms''s very late works". Site chia Lãng mạn khoảng 1820–1900 (lich-su/thoi-ky/lang-man), 1893 ở cuối.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Brahms,_Johannes", "https://enc.piano.or.jp/en/musics/213" ]
    luot_2_ghi_chu: "IMSLP xếp Brahms vào 'People from the Romantic era'; PTNA: Op. 118 là tác phẩm rất muộn (1893). 'Cuối Lãng mạn' hợp lý."
  - id: n5
    cau: 'Luyện nghe: ba đoạn, bè giữa, canon.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ ptna-22831, simrock-1893, mut-op118-2 ]
    ket_qua: dung
    ghi_chu: 'Ba đoạn A – B – A (PTNA); bè giữa và canon: ô 49–50 bè giữa nhắc lại bốn nốt mở đầu của bè trên (Đô♯ – Fa♯ – Mi – Rê) chậm một phách, thấp một quãng tám (hồ sơ trang n29). Review D6-L8-gom: ghi chú "chậm một phách" (lượt 1) và luot_2_ghi_chu "chậm một phách" sai: theo Mutopia bè giữa vào sau hai phách (hồ sơ trang n29, đã sửa). Câu dữ liệu không nói khoảng cách, nên vẫn đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213", "https://archive.org/details/imslp-klavierstcke-op118-brahms-johannes" ]
    luot_2_ghi_chu: "PTNA: ba phần A (1–48) – B (49–76) – A' (77–116). Bản Simrock 1893 (archive.org, tr. 5): ở đoạn Fa♯ thứ, bè trên tay trái (bè giữa) nhắc lại giai điệu bè trên (Đô♯–Fa♯–Mi–Rê–Đô♯) chậm một phách, thấp một quãng tám: canon."
    review: dung
  - id: n6
    cau: 'Hình nghe, chú thích: Intermezzo Op. 118 số 2 có ba đoạn A – B – A; độ dài các ô theo số ô nhịp.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-22831, simrock-1893 ]
    ket_qua: dung
    ghi_chu: 'Tổng 48 + 8 + 8 + 12 + 40 = 116 ô, khớp bản in đầu và Mutopia (không tính nốt lấy đà). Ô 49–56 có dấu nhắc lại nên khi nghe dài gấp đôi; hình đếm số ô nhịp như chu_thich nói.'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213" ]
    luot_2_ghi_chu: "PTNA: 'three-part Lied form, A (measures 1-48), B (49-76), A' (77-116)'."
  - id: n7
    cau: 'Hình nghe, A: La trưởng, ô 1–48 (48).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-22831, simrock-1893, mut-op118-2 ]
    ket_qua: dung
    ghi_chu: 'PTNA: A (measures 1-48). Bản in đầu: hóa biểu ba thăng, più lento ô 46, kết ở ô 48 trước vạch nhắc lại ô 49.'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213", "https://archive.org/details/imslp-klavierstcke-op118-brahms-johannes" ]
    luot_2_ghi_chu: "PTNA: A ô 1–48; bản Simrock 1893 tr. 4: hóa biểu ba thăng, Intermezzo La trưởng. Đối chiếu thêm MIDI LilyPond trên Commons (116 ô, đoạn 49–56 có dấu lặp)."
  - id: n8
    cau: 'Hình nghe, B: Fa♯ thứ, canon, ô 49–56 (8).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-22831, simrock-1893, mut-op118-2 ]
    ket_qua: dung
    ghi_chu: 'PTNA: a (measures 49-56) Fa♯ thứ. Bản in đầu: "in tempo" và vạch nhắc lại ở ô 49, vạch nhắc lại đóng cuối ô 56. Canon: xem n5.'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213", "https://archive.org/details/imslp-klavierstcke-op118-brahms-johannes" ]
    luot_2_ghi_chu: "PTNA: 'a (measures 49-56) with a movement in F-sharp minor'. Bản Simrock 1893 tr. 5: đoạn này 8 ô, có dấu lặp, canon quãng tám giữa bè trên và bè giữa tay trái (đọc trên bản nhạc)."
  - id: n9
    cau: 'Hình nghe, hợp xướng: Fa♯ trưởng, ô 57–64 (8).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-22831, simrock-1893 ]
    ket_qua: dung
    ghi_chu: 'PTNA: b (57-64) "modulates to F-sharp major and contains chorale elements". Bản in đầu ô 57: più lento, pp, u.c., legato.'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213", "https://archive.org/details/imslp-klavierstcke-op118-brahms-johannes" ]
    luot_2_ghi_chu: "PTNA: 'b (measures 57-64) which modulates to F-sharp major and contains chorale elements'. Bản Simrock: 'più lento', hóa biểu sáu thăng, hợp âm pp legato."
  - id: n10
    cau: 'Hình nghe, B'': Fa♯ thứ trở lại, ô 65–76 (12).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-22831, simrock-1893 ]
    ket_qua: dung
    ghi_chu: 'PTNA: a (65-76) Fa♯ thứ. Bản in đầu: Tempo primo ô 65.'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213" ]
    luot_2_ghi_chu: "PTNA: \"a' (measures 65-76) which returns to F-sharp minor\"; bản Simrock: 'Tempo primo', trở lại ba thăng."
  - id: n11
    cau: 'Hình nghe, A'': La trưởng, ô 77–116 (40).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-22831, simrock-1893, mut-op118-2 ]
    ket_qua: dung
    ghi_chu: 'PTNA: A (77-116). Mutopia: vạch kết sau ô 116; bản in đầu: hợp âm rải cuối có dấu lặng.'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213" ]
    luot_2_ghi_chu: "PTNA: A' ô 77–116 (40 ô); bản Simrock tr. 6 nhắc lại chất liệu đoạn A, kết La trưởng."
  - id: n12
    cau: 'Hình nghe, ghi chú: đoạn B tự nó cũng là ba đoạn nhỏ: Fa♯ thứ – Fa♯ trưởng – Fa♯ thứ.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ptna-22831 ]
    ket_qua: dung
    ghi_chu: 'PTNA: "the B section can be subdivided into a (49-56) … F-sharp minor, b (57-64) … F-sharp major …, and a'' (65-76) which returns to F-sharp minor".'
    luot_2: dung
    luot_2_nguon: [ "https://enc.piano.or.jp/en/musics/213" ]
    luot_2_ghi_chu: PTNA chia B thành a (Fa♯ thứ) – b (Fa♯ trưởng) – a' (Fa♯ thứ).
