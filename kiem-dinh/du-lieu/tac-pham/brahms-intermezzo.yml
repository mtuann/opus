# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/tac-pham/brahms-intermezzo
ban_ghi: tac-pham/brahms-intermezzo
ghi_chu: "loai: nghe là cấu trúc, không phải nhận định; trang hướng dẫn nghe cũ ../opus-zero/docs/nghe-nhac/brahms-intermezzo.md có tồn tại. Bản ghi không có goi_y, gan_cho, khuyet_danh. Lần 2 (D6-L8, lượt 1 phần A): nhận định n4–n15 cho các trường chưa khóa thoi_ky, luyen_nghe, hinh, ban_thu. Bản nhạc: bản in đầu Simrock 1893 (số bản in 10054, Internet Archive) và Mutopia (nguồn Simrock); 116 ô, không tính nốt lấy đà; ô 49–56 có dấu nhắc lại (hình đếm 8 ô, như chu_thich nói: độ dài theo số ô nhịp). PTNA 22831 chia đoạn đúng như hinh. Không có dữ liệu sai, không có mục trong file sửa; không có câu chưa chắc. Bản ghi không có chang/grade: chặng 6 của trang nghe chỉ ở piano/tac-pham-theo-cap (hồ sơ trang n52)."
