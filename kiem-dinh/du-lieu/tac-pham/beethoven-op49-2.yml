    ghi_chu: 'Nói theo kiểu tương đương: Op. 49 số 2 không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle xếp cả hai sonata Op. 49 mức 3 (easy). Sonata anh em Op. 49 số 1, chương 1 "Andante", ở ABRSM Grade 6 (2017–2018); RCM 2022: các chương 1 và 2 của Op. 49 số 1 và số 2 ở Level 8. Kết luận: khoảng Grade 5–6; Grade 5 nằm trong sai số một cấp, nghiêng về Grade 6.'
    luot_2: dung
    luot_2_nguon: [ https://www.henle.de/en/Two-Easy-Piano-Sonatas-no.-19-and-no.-20-g-minor-and-G-major-op.-49-no.-1-and-no.-2/HN-1327, https://www.henle.de/en/Eleven-Bagatelles-op.-119/HN-1684, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, https://web.archive.org/web/20191112232528/https://us.abrsm.org/media/12152/piano_2017___2018.pdf ]
    luot_2_ghi_chu: No ABRSM/Trinity listing of Op.49/2 found in 2015-26 (not exhaustive). Sibling Op.49/1 mvt 1 is ABRSM Grade 6 (2017-18); RCM 2022 Level 8 (mvts 1 and 2); Henle level 3 (Henle's own reference piece for level 3), cf. Op.119/1 Henle 4 = ABRSM Grade 5. Evidence points to about Grade 5-6, so "khoảng Grade 5" is acceptable.
