    luot_2_nguon: [ "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/05/23-1-Sm_FPn_p05.jp2&WID=1400&CVT=JPG", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/newjp2/4278.jp2&WID=1400&CVT=JPG", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/07/23-1-Sm_FPn_p07.jp2&WID=1400&CVT=JPG", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/newjp2/4282.jp2&WID=1400&CVT=JPG", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/12/23-1-Sm_FPn_p12.jp2&WID=4000&CVT=JPG" ]
