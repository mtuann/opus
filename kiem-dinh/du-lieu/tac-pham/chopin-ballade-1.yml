  ghi_chu: 'Cũ: "Phác thảo ở Vienna năm 1831, hoàn thành ở Paris năm 1835; in năm 1836 đồng thời ở Leipzig, Paris và London. Đề tặng \"Monsieur le Baron de Stockhausen\", một nhà ngoại giao của Hanover ở Paris". Henle: lịch sử sáng tác ít tài liệu, không nói Vienna; ba bản in ra tháng 6, 7, 8/1836 (không đồng thời). Lời đề tặng: bản tay "dedié à Mr le Baron de Stockhausen" (Henle), IMSLP "Hanover''s ambassador to Paris". Mục sua-A.yml.'
