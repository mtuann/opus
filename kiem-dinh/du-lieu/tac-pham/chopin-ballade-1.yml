  - id: n17
    cau: 'Sáng tác / xuất bản: hoàn thành năm 1835 (hợp đồng in ký ngày 9/1/1836; IMSLP ghi bản đầu có thể từ năm 1831); in năm 1836 ở Leipzig (tháng 6), Paris (tháng 7) và London (tháng 8); đề tặng Nam tước Stockhausen, đại sứ của Hanover ở Paris.'
    loai: nam
    truong:
      - thong_tin
    nguon:
      - henle-hn867-vorwort
      - imslp-op23
      - henle-hn867-comments
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Phác thảo ở Vienna năm 1831, hoàn thành ở Paris năm 1835; in năm 1836 đồng thời ở Leipzig, Paris và London. Đề tặng \"Monsieur le Baron de Stockhausen\", một nhà ngoại giao của Hanover ở Paris". Henle: lịch sử sáng tác ít tài liệu, không nói Vienna; ba bản in ra tháng 6, 7, 8/1836 (không đồng thời). Lời đề tặng: bản tay "dedié à Mr le Baron de Stockhausen" (Henle), IMSLP "Hanover''s ambassador to Paris". Mục sua-A.yml.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Ballade_No.1,_Op.23_(Chopin,_Fr%C3%A9d%C3%A9ric)", "https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf" ]
    luot_2_ghi_chu: "Lời tựa Henle HN 867 (Müllemann 2007): hợp đồng với Breitkopf & Härtel ngày 9/1/1836, nên tác phẩm 'entstanden 1835'; Breitkopf in tháng 6/1836, bản Pháp (Schlesinger) tháng 7/1836, bản Anh (Wessel) đăng ký 30/5 nhưng in tháng 8/1836. IMSLP: '1831? (first version), 1834-35? (final version)'; đề tặng 'Mr. le Baron [Nathaniel] de Stockhausen (Hanover's ambassador to Paris)'."
