nhan_dinh:
  - id: n1
    cau: "Tên «Étude Op. 10 số 3 và số 12» chỉ hai bản trong 12 Étude Op. 10: số 3 cung Mi trưởng và số 12 cung Đô thứ."
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, henle-3, henle-12 ]
    ket_qua: dung
    ghi_chu: Số Op. 10 trong tên trùng danh_muc (số của cả bộ).
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/%C3%89tudes,_Op.10_(Chopin,_Fr%C3%A9d%C3%A9ric)", https://www.henle.de/Etude-E-major-op.-10-no.-3/HN-656, https://www.henle.de/en/Etude-c-minor-op.-10-no.-12-Revolution/HN-658, https://id.loc.gov/authorities/names/no97075508.json, https://id.loc.gov/authorities/names/n81089328.json ]
    luot_2_ghi_chu: "IMSLP Études Op.10: 12 studies (1829-32); no. 3 = E major ('Tristesse'), no. 12 = C minor ('Revolutionary'). Henle pages: 'Etude E major op. 10 no. 3' (HN 656) and 'Etude c minor op. 10 no. 12 (Revolution)' (HN 658). LoC no97075508 (New Grove): 'op. 10/3 Etude, E, 1832'; LoC n81089328 (Kobylanska): 'op. 10. Zwölf Etüden für Klavier. Nr. 12 c-Moll'."
  - id: n2
    cau: Tác giả là Frédéric Chopin.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle-3, henle-12 ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/%C3%89tudes,_Op.10_(Chopin,_Fr%C3%A9d%C3%A9ric)", https://www.henle.de/Etude-E-major-op.-10-no.-3/HN-656, https://id.loc.gov/authorities/names/no97075508.json ]
    luot_2_ghi_chu: "IMSLP composer field: Chopin, Frédéric. Henle: Frédéric Chopin. LoC heading 'Chopin, Frédéric, 1810-1849'."
  - id: n3
    cau: Op. 10 là số opus của bộ 12 Étude, bộ chứa số 3 và số 12.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, henle-3, henle-12 ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/%C3%89tudes,_Op.10_(Chopin,_Fr%C3%A9d%C3%A9ric)", https://www.henle.de/Etude-E-major-op.-10-no.-3/HN-656, https://www.henle.de/en/Etude-c-minor-op.-10-no.-12-Revolution/HN-658, https://id.loc.gov/authorities/names/n81089328.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.10 for the set of 12 studies, which contains no. 3 and no. 12. Henle 'op. 10 no. 3' / 'op. 10 no. 12'; LoC n81089328 (Kobylanska) 'op. 10. Zwölf Etüden'.
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-op10-api ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Piece Style=Romantic.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Etudes,_Op.10_(Chopin,_Frédéric)" ]
    luot_2_ghi_chu: "IMSLP: Piece Style = Romantic."
  - id: n5
    cau: 'Luyện nghe: kỹ thuật phục vụ âm nhạc (étude vừa luyện kỹ thuật vừa là tác phẩm hòa nhạc).'
    loai: lich-su
    truong: [ luyen_nghe ]
    nguon: [ henle-hn124-p, cod-etude ]
    ket_qua: dung
    ghi_chu: 'Henle: "a new type of virtuosic etude that also makes aesthetic demands"; COD: "suitable for public perf. as well as private practice".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/chopinetudesforp00unse" ]
    luot_2_ghi_chu: "Ấn bản Schirmer (Friedheim, 1916), bài giới thiệu của Huneker: étude vừa là bài tập kỹ thuật vừa là tác phẩm ('Were ever Beauty and Duty mated so in double-harness?'); ghi chú của Friedheim cho số 3 gọi là 'Studies in Touch'."
  - id: n6
    cau: 'Hình, chú thích: Étude Op. 10 số 3 (Mi trưởng) và số 12 (Đô thứ), gần đúng.'
    loai: ten
    truong: [ hinh ]
    nguon: [ imslp-op10-api ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Etudes,_Op.10_(Chopin,_Frédéric)" ]
    luot_2_ghi_chu: "IMSLP: Op.10 số 3 Mi trưởng, số 12 Đô thứ."
  - id: n7
    cau: 'Hình, số 3: A (Mi trưởng, giai điệu và đệm trong một tay); B (poco più animato, nốt kép); hợp âm bảy giảm; con bravura (quãng sáu kép); bảy át kéo dài, dẫn về chủ đề; A'' rút gọn, tắt dần.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-schirmer, henle-hn124-bem ]
    ket_qua: dung
    ghi_chu: 'Như hồ sơ trang nghe-nhac/chopin-etude n20–n23: poco più animato ô 21 (Henle); con bravura quãng sáu hai tay trên hợp âm bảy giảm Si–Rê–Fa–Sol♯; nền Si trước Tempo I; phần trở lại khoảng 16 ô so với 20 ô đầu, kết pp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/chopinetudesforp00unse" ]
    luot_2_ghi_chu: "Đọc bản nhạc (Schirmer/Friedheim, tr. 12–14): Lento ma non troppo, Mi trưởng, giai điệu và đệm cùng ở tay phải; 'Poco più animato' với nốt kép; đoạn nốt kép chromatic quãng năm giảm và quãng bốn tăng (các hợp âm bảy giảm, ghi chú của Friedheim); 'con forza' rồi 'con bravura' quãng sáu hai tay; ritenuto, bè trầm giữ Si (bảy át) dẫn về chủ đề; chủ đề trở lại ngắn hơn. Ô 'gần đúng' nên chấp nhận."
  - id: n8
    cau: 'Hình, số 12: mở đầu (tay trái đổ xuống); A (Đô thứ, quãng tám tay phải); B (chuyển giọng); A''; coda (lắng xuống, kết Đô trưởng).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mutopia-12 ]
    ket_qua: dung
    ghi_chu: 'Mutopia: ô 1–9 mở đầu; ô 10 trở đi quãng tám tay phải; ô 29–36 chuyển giọng (nhiều thăng); ô 41 trở đi trở lại; ô 75–80 smorz., lặng, sotto voce; ô 84 hợp âm Đô trưởng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O10/op-10-12-wfi/op-10-12-wfi.ly" ]
    luot_2_ghi_chu: "Mutopia (Peters/Scholtz): mở đầu hợp âm tay phải, tay trái chạy xuống; chủ đề Đô thứ quãng tám tay phải; ô 29–35 chuyển giọng; chủ đề trở lại; coda ô 75–79 'smorz.', 'sotto voce', kết ô 84 bằng hợp âm <c e g c> (Đô trưởng). Lưu ý: hai ô cuối bùng lên ff trước khi kết, nên 'lắng xuống' chỉ đúng cho phần đầu coda; hình ghi gần đúng nên chấp nhận."
  - id: n9
    cau: 'Hình, ghi chú: ở số 12, tay trái chạy móc kép gần như không nghỉ từ đầu đến cuối.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mutopia-12 ]
    ket_qua: dung
    ghi_chu: 'Mutopia: tay trái móc kép hầu như mọi ô, kể cả ô 76 khi tay phải lặng; ô cuối (83–84) là hợp âm, nên "gần như".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O10/op-10-12-wfi/op-10-12-wfi.ly" ]
    luot_2_ghi_chu: Bè tay trái (links) gần như toàn móc kép từ ô 1 đến ô 82; chỉ dừng ở vài hợp âm và hai ô cuối.
  - id: n10
    cau: 'Bản thu: Edward Neeman (Musopen), phạm vi công cộng; trang Commons của file số 3.'
    loai: ten
    truong: [ ban_thu ]
    nguon: [ commons-neeman ]
    ket_qua: dung
    ghi_chu: 'Commons: "Performer: Edward Neeman", nguồn Kickstarter Musopen "Set Chopin Free", giấy phép ghi âm PD-author (Musopen), tác phẩm PD-old.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Chopin_-_12_%C3%89tudes,_Op._10_-_No._3_in_E_major_%27Tristesse%27_(Edward_Neeman).flac" ]
    luot_2_ghi_chu: "Trang Commons: người chơi Edward Neeman, nguồn dự án Musopen 'Set Chopin Free'; bản thu {{PD-author|Musopen}}."
