nhan_dinh:
  - id: n1
    cau: Tên «Nữ hoàng bóng đêm» chỉ aria «Der Hölle Rache» của Nữ hoàng bóng đêm (màn 2, số 14) trong opera Die Zauberflöte (Cây sáo thần).
    loai: ten
    truong: [ ten ]
    nguon: [ imslp ]
    ket_qua: dung
    ghi_chu: "Tên chỉ nêu nhân vật, không nêu vở và không nêu tên aria: gợi ý biên tập, không sai. IMSLP ghi «Aria (Königin der Nacht): Der Hölle Rache kocht in meinem Herzen (Act II, No.14)»."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Die_Zauberfl%C3%B6te,_K.620_(Mozart,_Wolfgang_Amadeus)", https://id.loc.gov/authorities/names/n81081248.json, http://www.hbso.org.vn/chuong-trinh/nhac-kich-cay-sao-than-833.html ]
    luot_2_ghi_chu: "IMSLP Die Zauberflöte, K.620: Act II, '14. Der Hölle Rache kocht in meinem Herzen'. LoC n81081248: 'Zauberflöte. Hölle Rache' (label 'Air de la Reine de la nuit'; New Grove dict. of opera). The Vietnamese label 'Cây sáo thần' is used by HBSO for its Mozart/Schikaneder production (HBSO page calls the role 'Nữ hoàng đêm'; the site's 'Nữ hoàng bóng đêm' is a variant label for the same role, not a factual error)."
