nhan_dinh:
  - id: n1
    cau: Tên «Nữ hoàng bóng đêm» chỉ aria «Der Hölle Rache» của Nữ hoàng bóng đêm (màn 2, số 14) trong opera Die Zauberflöte (Cây sáo thần).
    loai: ten
    truong: [ ten ]
    nguon: [ imslp ]
    ket_qua: dung
    ghi_chu: "Tên chỉ nêu nhân vật, không nêu vở và không nêu tên aria: gợi ý biên tập, không sai. IMSLP ghi «Aria (Königin der Nacht): Der Hölle Rache kocht in meinem Herzen (Act II, No.14)»."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Die_Zauberfl%C3%B6te,_K.620_(Mozart,_Wolfgang_Amadeus)", https://id.loc.gov/authorities/names/n81081248.json, http://www.hbso.org.vn/chuong-trinh/nhac-kich-cay-sao-than-833.html ]
    luot_2_ghi_chu: "IMSLP Die Zauberflöte, K.620: Act II, '14. Der Hölle Rache kocht in meinem Herzen'. LoC n81081248: 'Zauberflöte. Hölle Rache' (label 'Air de la Reine de la nuit'; New Grove dict. of opera). The Vietnamese label 'Cây sáo thần' is used by HBSO for its Mozart/Schikaneder production (HBSO page calls the role 'Nữ hoàng đêm'; the site's 'Nữ hoàng bóng đêm' is a variant label for the same role, not a factual error)."
  - id: n2
    cau: Tác giả là Wolfgang Amadeus Mozart.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, koechel ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Die_Zauberfl%C3%B6te,_K.620_(Mozart,_Wolfgang_Amadeus)", https://id.loc.gov/authorities/names/n81081247.json ]
    luot_2_ghi_chu: "IMSLP composer field: Mozart, Wolfgang Amadeus. LoC heading 'Mozart, Wolfgang Amadeus, 1756-1791. Zauberflöte'."
  - id: n3
    cau: K. 620 là số Köchel của opera Die Zauberflöte, tác phẩm chứa aria này.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, koechel ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Die_Zauberfl%C3%B6te,_K.620_(Mozart,_Wolfgang_Amadeus)", https://id.loc.gov/authorities/names/n81081247.json ]
    luot_2_ghi_chu: "IMSLP Op./Cat. No. = K.620 (Die Zauberflöte, 2 acts). LoC n81081247 (Köchel 6): '620. Die Zauberflöte' (Singspiel in two acts, libretto Schikaneder)."
  - id: n4
    cau: 'Thời kỳ: Cổ điển.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Classical".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Mozart,_Wolfgang_Amadeus", "https://imslp.org/wiki/Die_Zauberflöte,_K.620_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: 'IMSLP: Mozart "People from the Classical era"; trang K.620 thuộc thể loại Classical.'
  - id: n5
    cau: 'Luyện nghe: opera, giọng coloratura.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ kv-620, cod-coloratura, nma-620 ]
    ket_qua: dung
    ghi_chu: 'Köchel: Singspiel (một loại opera, COD) hai màn, vai Nữ hoàng là soprano; NMA: aria có hai chuỗi nốt nhanh ô 24–32 và 69–79, lên Fa6 (hồ sơ trang n16, n17); COD: coloratura soprano.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Die_Zauberflöte,_K.620_(Mozart,_Wolfgang_Amadeus)", "https://www.glyndebourne.com/opera-archive/explore-our-operas/explore-die-zauberflote/die-zauberflote-musical-highlights/", "https://www.mutopiaproject.org/ftp/MozartWA/KV620/magicflute-14-aria/magicflute-14-aria-lys.zip" ]
    luot_2_ghi_chu: "IMSLP: K.620 thuộc Operas, Singspiele; aria số 14 \"Der Hölle Rache\" của Nữ hoàng bóng đêm. Glyndebourne: aria là \"virtuoso showpiece\" lên tới Fa trên Đô cao, với \"passages of frenzied coloratura\". Bè hát trong bản Mutopia có các chuỗi móc đơn staccato rải hợp âm lên f'''."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích ""Der Hölle Rache": mỗi ô một dòng của bảng "Theo dõi khi nghe" (độ rộng các ô chỉ minh họa)."; các ô: Mở đầu (dàn nhạc hơn một ô · Rê thứ); Câu kịch tính (giọng mạnh mẽ); Coloratura 1 (staccato · nốt rải vọt lên Fa6); Đe dọa, coloratura 2 (chuỗi thứ hai dài hơn); Kết (lời thề "Hört, Rachegötter…" · Rê thứ).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - nma-620
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Theo dõi khi nghe" của trang nghe-nhac/mozart-nu-hoang-bong-dem (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n14, n15, n16, n17, n18 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: nma-620. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n23 của hồ sơ trang. Soát hình 3C (gộp review và kiểm mẫu): hinh.nghe khớp trang trên bản xem (07/11/2026), xem n23 của kiem-dinh/nghe-nhac/mozart-nu-hoang-bong-dem.yml: 5 ô theo 5 dòng bảng Theo dõi: mở đầu hơn một ô nhịp Rê thứ, câu kịch tính, coloratura 1 staccato vọt lên Fa6, đe dọa và coloratura 2 dài hơn, lời thề Hört, Rachegötter và kết Rê thứ. Kết quả: dung.'
    luot_2: dung
    luot_2_nguon: [ "kiem-dinh/nghe-nhac/mozart-nu-hoang-bong-dem.yml" ]
    luot_2_ghi_chu: "Các ô khớp thứ tự và số lượng các dòng của bảng cùng tên trên trang (đã đối chiếu từng ô: tên và chữ rút gọn); các nhận định tương ứng của hồ sơ trang đều có kết quả và lượt 2 dung hoặc đã sửa và review dung."
    review: dung
  - id: n7
    cau: 'Bản thu Mozart, aria "Der Hölle Rache" (Cây sáo thần): Sandra Partridge (soprano), Siam Philharmonic Orchestra, Trisdee na Patalung chỉ huy (thu trực tiếp năm 2006 ở Bangkok; aria thứ hai, Der Hölle Rache).'
