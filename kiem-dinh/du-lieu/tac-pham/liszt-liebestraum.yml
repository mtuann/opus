ghi_chu: 'Trang bài học cũ ../opus-zero/docs/piano/tac-pham/liszt-liebestraum.md có (loai: bai-hoc là cấu trúc, không phải nhận định). Trang hướng dẫn nghe nghe-nhac/liszt-liebestraum.md (cap) cũng có. Lần 2 (D6-L6, lượt 1 phần B): nhận định n7–n43 cho các trường chưa khóa (giong, nhip, thoi_ky, ky_nang_chinh, luyen_nghe, chip, thong_tin, hinh, ban_thu). Bản nhạc: bản in đầu Kistner [1850] (BSB) và Schirmer 1915, đếm 85 ô (cadenza ô 25 và ô 60, mỗi cái một ô; Più animato ô 26). Dữ liệu sai: Độ khó (bỏ ước lượng ABRSM), hinh.bai-hoc (cadenza 1, A'', ghi chú), hinh.nghe (cadenza 1 "nốt nhỏ", cadenza 2 "quãng ba gãy", độ dài ba đoạn): plans/lam-lai/bao-cao/d6-l6/sua-B.yml. cap (nghe-nhac/liszt-liebestraum) là cấu trúc, không phải nhận định. Không có câu chưa chắc.'
