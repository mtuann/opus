nguon:
  - id: imslp
    bac: 2
    ten: IMSLP, Symphony No.5, Op.47 (Shostakovich, Dmitry)
    link: https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)
  - id: dsch
    bac: 2
    ten: Издательство «Дмитрий Шостакович» (DSCH), Соч. 47. Симфония № 5
    link: https://www.shostakovich.ru/140ru
  - id: imslp-wt
    bac: 2
    ten: 'IMSLP, Symphony No.5, Op.47 (wikitext qua api.php, 06/11/2026): "Key=d"; "4 movements: Moderato; Allegretto; Largo; Allegro non troppo"; "Piece Style=Early 20th century"'
    link: https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)
  - id: mcburney
    bac: 2
    ten: 'Gerard McBurney, ghi chú chương trình cho Boston Philharmonic (Benjamin Zander), PDF: "the scherzo, in A minor and marked ‘Allegretto’"; "the slow movement in F sharp minor"; "histrionic tub-thumping in D major" ở chương cuối; bối cảnh bài Pravda "Muddle Instead of Music"'
    link: https://www.benjaminzander.org/uploads/2021/04/Shostakovich_-Symphony-no.-5.pdf
  - id: laki-kal
    bac: 2
    ten: 'Peter Laki, ghi chú chương trình, Kalamazoo Symphony Orchestra: chương 3 "the brass is silent"; chương 4 kết "on a bright D-major chord"; bối cảnh: Pravda tấn công Lady Macbeth, nỗi sợ bị đày, "A Soviet Artist’s Creative Response to Just Criticism"'
    link: https://kalamazoosymphony.com/?p=5044
  - id: bso-robinson
    bac: 2
    ten: 'Harlow Robinson, ghi chú chương trình, Boston Symphony Orchestra: bối cảnh chính trị (Pravda 1936, Stalin cho bắt bớ năm 1937), tranh luận về đoạn kết'
    link: https://www.bso.org/works/symphony-no-5-shostakovich
nhan_dinh:
  - id: n1
    cau: Tên «Giao hưởng số 5» chỉ Giao hưởng số 5 cung Rê thứ của Shostakovich.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, dsch ]
    ket_qua: dung
    ghi_chu: IMSLP ghi cung Rê thứ; DSCH không ghi cung.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", https://id.loc.gov/authorities/names/no96067059.json ]
    luot_2_ghi_chu: "IMSLP: Symphony No.5, Op.47, D minor (1937). LoC no96067059: 'Symphonies, no. 5, op. 47, D minor'."
  - id: n2
    cau: Tác giả là Dmitri Shostakovich.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, dsch ]
    ket_qua: dung
    ghi_chu: IMSLP viết tên là Dmitry Shostakovich; Dmitri là cách viết thông dụng, cùng một người.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", https://id.loc.gov/authorities/names/no96067059.json ]
    luot_2_ghi_chu: IMSLP composer field spells 'Shostakovich, Dmitry'; LoC 'Shostakovich, Dmitriĭ Dmitrievich, 1906-1975'. 'Dmitri' is the same person in another common transliteration.
  - id: n3
    cau: Op. 47 là số opus của Giao hưởng số 5 cung Rê thứ.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, dsch ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", https://id.loc.gov/authorities/names/no96067059.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.47 (D minor). LoC 'no. 5, op. 47, D minor'.
  - id: n4
    cau: 'Thời kỳ: Thế kỷ 20.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Early 20th century"; sáng tác 1937.'
  - id: n5
    cau: 'Luyện nghe: âm nhạc và chính trị.'
    loai: lich-su
    truong: [ luyen_nghe ]
    nguon: [ bso-robinson, laki-kal ]
    ket_qua: dung
    ghi_chu: 'Tác phẩm viết sau khi Pravda công kích Shostakovich (28/1/1936), được gọi là "câu trả lời sáng tạo … trước lời phê phán đúng đắn"; Robinson, Laki. Chọn trọng tâm là lựa chọn của site.'
  - id: n6
    cau: 'Hình, chú thích: Giao hưởng số 5 có bốn chương.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP: 4 chương.'
  - id: n7
    cau: 'Hình, ô I: Moderato, Rê thứ.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP: chương 1 Moderato; giọng của tác phẩm Rê thứ. Trọng số và màu là cách vẽ.'
  - id: n8
    cau: 'Hình, ô II: Allegretto, La thứ.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mcburney, imslp-wt ]
    ket_qua: dung
    ghi_chu: 'McBurney: "the scherzo, in A minor and marked ‘Allegretto’".'
  - id: n9
    cau: 'Hình, ô III: Largo, Fa♯ thứ, không có kèn đồng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mcburney, laki-kal ]
    ket_qua: dung
    ghi_chu: 'McBurney: "the slow movement in F sharp minor"; Laki: "the brass is silent".'
  - id: n10
    cau: 'Hình, ô IV: Allegro non troppo, Rê thứ chuyển sang Rê trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ laki-kal, mcburney ]
    ket_qua: null
    ghi_chu: 'chưa chắc: vế Rê trưởng ở cuối đúng (Laki "bright D-major chord", McBurney "tub-thumping in D major"). Vế mở đầu ở Rê thứ: chưa mở được nguồn bậc 1–2 nói thẳng (tổng phổ còn bảo hộ ở Mỹ, không đọc; ghi chú Berliner Philharmoniker được dẫn trong kết quả tìm kiếm nhưng trang trả 404). Lượt 2 tìm nguồn; không có thì đổi ô thành "→ Rê trưởng" hay "kết ở Rê trưởng".'
