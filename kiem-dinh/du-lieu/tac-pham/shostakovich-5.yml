    link: https://www.bso.org/works/symphony-no-5-shostakovich
nhan_dinh:
  - id: n1
    cau: Tên «Giao hưởng số 5» chỉ Giao hưởng số 5 cung Rê thứ của Shostakovich.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, dsch ]
    ket_qua: dung
    ghi_chu: IMSLP ghi cung Rê thứ; DSCH không ghi cung.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", https://id.loc.gov/authorities/names/no96067059.json ]
    luot_2_ghi_chu: "IMSLP: Symphony No.5, Op.47, D minor (1937). LoC no96067059: 'Symphonies, no. 5, op. 47, D minor'."
  - id: n2
    cau: Tác giả là Dmitri Shostakovich.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, dsch ]
    ket_qua: dung
    ghi_chu: IMSLP viết tên là Dmitry Shostakovich; Dmitri là cách viết thông dụng, cùng một người.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", https://id.loc.gov/authorities/names/no96067059.json ]
    luot_2_ghi_chu: IMSLP composer field spells 'Shostakovich, Dmitry'; LoC 'Shostakovich, Dmitriĭ Dmitrievich, 1906-1975'. 'Dmitri' is the same person in another common transliteration.
  - id: n3
    cau: Op. 47 là số opus của Giao hưởng số 5 cung Rê thứ.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, dsch ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", https://id.loc.gov/authorities/names/no96067059.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.47 (D minor). LoC 'no. 5, op. 47, D minor'.
  - id: n4
    cau: 'Thời kỳ: Thế kỷ 20.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Early 20th century"; sáng tác 1937.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)" ]
    luot_2_ghi_chu: "IMSLP: viết năm 1937; Piece Style là Early 20th century (Composer Time Period là Modern)."
  - id: n5
    cau: 'Luyện nghe: âm nhạc và chính trị.'
    loai: lich-su
    truong: [ luyen_nghe ]
    nguon: [ bso-robinson, laki-kal ]
    ket_qua: dung
    ghi_chu: 'Tác phẩm viết sau khi Pravda công kích Shostakovich (28/1/1936), được gọi là "câu trả lời sáng tạo … trước lời phê phán đúng đắn"; Robinson, Laki. Chọn trọng tâm là lựa chọn của site.'
    luot_2: dung
    luot_2_nguon: [ "https://res.cloudinary.com/minnesota-orchestral/image/upload/v1695020998/Uploads/PDF/Program-Notes/2023-24/010_Sept-Oct_2023_Valcuha_Conducts_Shostakovich_Symphony_No_5.pdf", "https://eclassical.textalk.se/shop/17115/art95/5052795-96d312-0822231180265_01.pdf" ]
    luot_2_ghi_chu: "Minnesota Orchestra (Eric Bromberger): tác phẩm viết sau bài báo Pravda tháng 1/1936 công kích Lady Macbeth, có lẽ do Stalin ra lệnh. Tập sách đĩa LSO (Andrew Huth): 'a Soviet artist's practical creative reply to just criticism'; cuộc tranh cãi về ý nghĩa của chương cuối."
  - id: n6
    cau: 'Hình, chú thích: Giao hưởng số 5 có bốn chương.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP: 4 chương.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", "https://www.wisemusicclassical.com/work/33040/Symphony-No-5-in-D-Minor--Dmitri-Shostakovich/" ]
    luot_2_ghi_chu: "IMSLP và Wise Music (bản tóm tắt của Sikorski): 4 chương, Moderato, Allegretto, Largo, Allegro non troppo."
  - id: n7
    cau: 'Hình, ô I: Moderato, Rê thứ.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP: chương 1 Moderato; giọng của tác phẩm Rê thứ. Trọng số và màu là cách vẽ.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", "https://vermontsymphonyorchestra.blogspot.com/2008/04/shostakovich-symphony-no-5.html" ]
    luot_2_ghi_chu: "IMSLP: chương I Moderato, giọng của tác phẩm là Rê thứ. Vermont SO: 'its tonal journey from a dark d minor'; Shenandoah: 'The symphony is in D minor', chương 1 mở đầu gợi Giao hưởng số 9 của Beethoven, cũng ở Rê thứ."
  - id: n8
    cau: 'Hình, ô II: Allegretto, La thứ.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mcburney, imslp-wt ]
    ket_qua: dung
    ghi_chu: 'McBurney: "the scherzo, in A minor and marked ‘Allegretto’".'
    luot_2: dung
    luot_2_nguon: [ "https://www.benjaminzander.org/uploads/2021/04/Shostakovich_-Symphony-no.-5.pdf", "https://kennethwoods.net/blog1/2012/03/15/explore-the-score-shostakovich-symphony-no-5-in-d-minor/" ]
    luot_2_ghi_chu: "Ghi chú chương trình trên trang Benjamin Zander: 'the scherzo, in A minor and marked Allegretto'. Kenneth Woods: chương 2 kết 'in A minor'."
  - id: n9
    cau: 'Hình, ô III: Largo, Fa♯ thứ, không có kèn đồng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mcburney, laki-kal ]
    ket_qua: dung
    ghi_chu: 'McBurney: "the slow movement in F sharp minor"; Laki: "the brass is silent".'
    luot_2: dung
    luot_2_nguon: [ "https://www.benjaminzander.org/uploads/2021/04/Shostakovich_-Symphony-no.-5.pdf", "https://kennethwoods.net/blog1/2012/03/15/explore-the-score-shostakovich-symphony-no-5-in-d-minor/", "https://www.filharmonikusok.hu/en/?p=91605" ]
    luot_2_ghi_chu: "Zander: 'the slow movement in F sharp minor'. Woods: Largo, 'The brass remain silent throughout'. Budapest Philharmonic: 'Largo in which the brass is silent'. Tập sách đĩa LSO (Huth): 'The brass instruments are all silent'."
  - id: n10
    cau: 'Hình, ô IV: Allegro non troppo, kết ở Rê trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ laki-kal, mcburney ]
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: vế Rê trưởng ở cuối đúng (Laki "bright D-major chord", McBurney "tub-thumping in D major"). Vế mở đầu ở Rê thứ: chưa mở được nguồn bậc 1–2 nói thẳng (tổng phổ còn bảo hộ ở Mỹ, không đọc; ghi chú Berliner Philharmoniker được dẫn trong kết quả tìm kiếm nhưng trang trả 404). Lượt 2 tìm nguồn; không có thì đổi ô thành "→ Rê trưởng" hay "kết ở Rê trưởng". Review D6-L11-gom: lượt 2 dung, nhưng không nguồn nào nói thẳng chương 4 mở ở Rê thứ: lượt 2 suy từ phân tích tổng phổ trên blog của nhạc trưởng Kenneth Woods (bốn nốt A–D–E–F), lượt 1 không mở được nguồn bậc 1–2 (tổng phổ còn bảo hộ ở Mỹ). Bỏ vế ấy theo sua-B.yml: ô IV thành [IV. Allegro non troppo, kết ở Rê trưởng] (src/data/tac-pham.yml, trường hinh chưa khóa; doi_chu ở hồ sơ trang nghe-nhac/shostakovich-5). Vế kết ở Rê trưởng có nguồn (Laki "bright D-major chord", McBurney "tub-thumping in D major"). Trang không có vế Rê thứ cho chương 4 (chỉ "Giao hưởng số 5 cung Rê thứ" ở bảng, và "kết thúc rất to ở Rê trưởng"). Chỉ bỏ vế, không chạy lại. Chữ câu trước review: "Hình, ô IV: Allegro non troppo, Rê thứ chuyển sang Rê trưởng."'
    luot_2: dung
    luot_2_nguon: [ "https://www.wisemusicclassical.com/work/33040/Symphony-No-5-in-D-Minor--Dmitri-Shostakovich/", "https://kennethwoods.net/blog1/2012/03/15/explore-the-score-shostakovich-symphony-no-5-in-d-minor/", "https://www.filharmonikusok.hu/en/?p=91605" ]
    luot_2_ghi_chu: "Wise Music (Sikorski): '4. Allegro non troppo – Allegro – Più mosso'. Kenneth Woods (nhạc trưởng, đọc từ tổng phổ): chủ đề hành khúc mở đầu chương cuối có bốn nốt đầu A D E F (Rê thứ); ở coda, kèn đồng đưa chủ đề ấy trở lại 'now in triumphant D major'. Budapest Philharmonic: kết bằng hợp âm Rê trưởng giữ hơn một phút. Không có nguồn nào nói thẳng 'chương 4 mở đầu ở Rê thứ', nhưng bốn nốt A–D–E–F với Fa thường và việc chủ đề 'now' ở Rê trưởng xác nhận vế ấy."
    review: dung
