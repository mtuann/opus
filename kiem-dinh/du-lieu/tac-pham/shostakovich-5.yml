  - id: imslp-wt
    bac: 2
    ten: 'IMSLP, Symphony No.5, Op.47 (wikitext qua api.php, 06/11/2026): "Key=d"; "4 movements: Moderato; Allegretto; Largo; Allegro non troppo"; "Piece Style=Early 20th century"'
