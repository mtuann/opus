    luot_2_ghi_chu: "OUP: các đoạn RITORNELLO (Advent of spring, Orchestral conclusion…) xen các đoạn SOLO; Mutopia: ritornello ghi 'Tutti' (cả dàn nhạc)."
  - id: n7
    cau: 'Thứ tự các đoạn trong sơ đồ: R, Chim hót (solo), R, Suối chảy, R, Bão (chuyển sang giọng thứ), R (giọng thứ), Chim trở lại, R, Độc tấu (violin), R.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ mutopia-301, teoria-spring ]
    ket_qua: da-sua
    ghi_chu: 'Mutopia: ô 1 R, ô 13½ "Canto de gl''Uccelli" Solo, R, ô 31 "Scorrono i Fonti", R, ô 44 "Tuoni", R trên Đô♯ (ô 55–59), ô 59 "Canto d''Uccelli", ô 66 Tutti, ô 70½ Solo (Tasto Solo), ô 76 Tutti. Teoria: bão đi qua Mi trưởng, Si trưởng, về Đô♯ thứ; ritornello ô 55–59 Đô♯ thứ. Độ dài các ô là sơ đồ, không theo thời lượng (chú thích không nói theo thời lượng). Review D6-L8-gom: lượt 2 sai: đoạn Bão bắt đầu ở Mi trưởng (bè dây ngân Si, gam Mi trưởng chạy lên) rồi mới về Đô♯ thứ. Sửa ô Bão của hinh.nghe trong tac-pham.yml từ "giọng thứ" thành "chuyển sang giọng thứ", theo câu đúng của lượt 2 (trang đã viết "giọng chuyển sang thứ"). Không chạy lại. Chữ câu cũ: "…Bão (giọng thứ)…".'
    luot_2: sai
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/VivaldiA/O8/spring/spring-lys.zip", "https://learninglink.oup.com/access/content/todd2e-student-resources/todd2e-listening-map-15" ]
    luot_2_ghi_chu: "câu đúng: Thứ tự các đoạn trong sơ đồ: R, Chim hót (solo), R, Suối chảy, R, Bão (chuyển sang giọng thứ), R (giọng thứ), Chim trở lại, R, Độc tấu (violin), R.; Thứ tự đoạn khớp bản Mutopia (spring1a.ly: A ritornello Mi trưởng; B 'Solo' chim; Tutti; C 'Scorrono i Fonti'; ritornello Forte; D 'Tuoni'; ritornello Đô♯ thứ ô 55–58; E 'Solo' chim; Tutti; R1*5 độc tấu; ritornello cuối). Riêng đoạn Bão không ở giọng thứ từ đầu: bè dây ngân Si (át của Mi trưởng) với gam Mi trưởng chạy lên, rồi bè trầm đi La–La♯–Si–Si♯–Đô♯ và kết ở Đô♯ thứ. OUP chỉ gọi ritornello sau bão là 'Minor-key interlude'. Nếu sơ đồ muốn ghi giọng thì nên ghi 'chuyển sang giọng thứ'."
    review: dung
