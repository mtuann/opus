    luot_2_ghi_chu: "Các kỹ năng khớp bản nhạc: hình vòng quanh nốt móc kép, nốt dựa (appoggiatura) ở bản in đầu, rải hợp âm nhanh tay trái ở hành khúc, quãng tám tay phải, nhịp 2/4; bản in không có ký hiệu bàn đạp."
