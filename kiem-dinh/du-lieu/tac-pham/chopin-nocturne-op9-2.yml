    ghi_chu: "Nói theo kiểu tương đương: Op. 9 số 2 không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle xếp mức 6 (medium). Các nocturne khác của Chopin ở ABRSM: Nocturne Đô♯ thứ KK IVa/16 (Henle 5) Grade 7 (2017–2018), Nocturne Sol thứ Op. 37 số 1 (Henle 5) Grade 8 (2019–2020), Nocturne Mi thứ Op. 72 số 1 (Henle 5) Grade 8 (2027–2028). RCM 2022: Op. 9 số 2 ở Level 9. Kết luận: khoảng Grade 7–8; Grade 7 nằm trong sai số một cấp."
