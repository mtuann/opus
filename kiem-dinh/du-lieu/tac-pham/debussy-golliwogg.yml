    luot_2_ghi_chu: "IMSLP: file PMLP02387-Debussy,_Claude-Childrens_Corner_Durand_7188_filter.pdf, Durand & Fils, Paris, 1908, D. & F. 7188; file trên máy mang số IMSLP252526. Trang cuối bản quét ghi 'Février 1952 Imp. Mounot': lần in sau từ bản khắc 1908, khớp cách ghi 'bản khắc 1908'."
    review: dung
  - id: n5
    cau: 'Sơ đồ: 128 ô nhịp 2/4, ba phần, phần đầu trở lại sau đoạn giữa; Mở đầu ô 1–9 (nhịp đệm), Chủ đề ô 10–25 (Mi♭ trưởng, đảo phách), Ý thứ hai ô 26–46 (hợp âm p, thưa dần), Đoạn giữa ô 47–60 (chậm hơn, pp), Câu của Wagner ô 61–89 (Tristan und Isolde, cắt ngang), Phần đầu trở lại ô 90–125, Kết ô 126–128 (ff); phần đầu trở lại gần như nguyên vẹn; ba ô cuối không thưa dần như lần đầu mà kết bằng hai tiếng Mi♭ ff thật ngắn, chồng quãng tám.'
    loai: cau-truc
    nguon: [ durand-1908, imslp-cc, henle-382-comments ]
    truong: [ hinh ]
    ket_qua: da-sua
    ghi_chu: 'Đếm ô trên bản quét (hồ sơ trang, ghi_chu): 25 + 27 + 25 + 24 + 27 = 128; IMSLP 128 bars, E-flat major; 2/4 ở tr. 24 hệ 1. Ô 47 Un peu moins vite pp (tr. 25 hệ 5); ô 61 Cédez (tr. 26 hệ 2); ô 90 Toujours retenu (tr. 27 hệ 3); ô 126–128 f rồi ff (tr. 28 hệ 5); ô 46 più p (tr. 25 hệ 4). Phần đầu trở lại song song ô 10–45, lệch 80 ô (Henle M 28/108, 36/116). Đoạn giữa ô 47–89 chia hai ô ở ô 61 cho dễ nhìn. Review (Claude, 17/11/2026): bản quét tr. 28 hệ 5: ô 127–128 tay phải Mi♭3, tay trái quãng tám Mi♭1–Mi♭2, móc đơn ff, không phải hợp âm; ô 110–111 khác hòa âm ô 30–31, nên bỏ vế "chỉ ba ô cuối khác hẳn" (xem hồ sơ trang n26). Sửa hinh.nghe ghi_chu theo câu mới. Số ô từng hệ đếm lại trên bản quét (tr. 24–28: 25 + 27 + 25 + 24 + 27 = 128), ranh giới các đoạn khớp.'
    luot_2: sai
    luot_2_nguon: [ "https://imslp.org/api.php?action=parse&page=Children%27s_Corner,_CD_119_(Debussy,_Claude)&prop=wikitext&format=json" ]
    luot_2_ghi_chu: "câu đúng: Sơ đồ: 128 ô nhịp 2/4, ba phần, phần đầu trở lại sau đoạn giữa; Mở đầu ô 1–9 (nhịp đệm), Chủ đề ô 10–25 (Mi♭ trưởng, đảo phách), Ý thứ hai ô 26–46 (hợp âm p, thưa dần), Đoạn giữa ô 47–60 (chậm hơn, pp), Câu của Wagner ô 61–89 (Tristan und Isolde, cắt ngang), Phần đầu trở lại ô 90–125, Kết ô 126–128 (ff); phần đầu trở lại gần như nguyên vẹn, ba ô cuối kết bằng hai tiếng Mi♭ ff (quãng tám) thay vì thưa dần.; Số ô, ranh giới các đoạn, 2/4, Mi♭ trưởng (IMSLP: E-flat major, 128 bars) đều đúng theo bản quét. Sai ở 'hai hợp âm ff': ô 127–128 chỉ là Mi♭ chồng quãng tám; và 'chỉ ba ô cuối khác hẳn' bỏ qua ô 110–111 đổi hòa âm (xem n26 của trang)."
    review: sai
