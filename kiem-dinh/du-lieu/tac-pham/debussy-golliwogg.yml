    ghi_chu: 'IMSLP: "CD 119 ; L.113", số 6 Golliwog''s Cake-walk. Bản quét tr. 24 "VI. Golliwogg''s cake walk" (cách viết hai chữ g của Debussy). danh_muc "L. 113 số 6" theo kiểu bản ghi debussy-arabesque-1 ("L. 66 số 1"). Review (Claude, 17/11/2026): bản quét tr. 24 "VI. Golliwogg''s cake walk" thấy lại; khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/api.php?action=parse&page=Children%27s_Corner,_CD_119_(Debussy,_Claude)&prop=wikitext&format=json" ]
