nhan_dinh:
  - id: n1
    cau: Tên «"Buổi sáng" (Peer Gynt)» chỉ Morning Mood (Morgenstemning), số mở đầu Peer Gynt Suite số 1, trích từ nhạc sân khấu Peer Gynt.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp-op23, imslp-op46, henle ]
    ket_qua: dung
    ghi_chu: "IMSLP Op. 23: màn 4 mở đầu bằng «Prelude: Morning Mood / Indledning: Morgenstemning»; IMSLP Op. 46: Suite số 1 do tác giả chọn từ Peer Gynt Op. 23, chương 1 là Morning Mood; Henle ghi Morgenstimmung op. 46,1 và coi Op. 23 là gốc của hai tổ khúc."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)", "https://imslp.org/wiki/Peer_Gynt,_Op.23_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n85373695.json ]
    luot_2_ghi_chu: "IMSLP Peer Gynt Suite No.1, Op.46: movement 1 = 'Morning Mood' (Morgenstimmung / Morgenstemning); related works: 'Selected by the composer from Peer Gynt, Op.23'. IMSLP Peer Gynt Op.23 (incidental music, Ibsen): Act 4, '14. Indledning: Morgenstemning'. LoC n85373695: Suite no. 1, op. 46: 'Morgenstemning; Ases död; Anitras dans; I dovregubbens hal'."
  - id: n2
    cau: Tác giả là Edvard Grieg.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp-op23, imslp-op46, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)", "https://imslp.org/wiki/Peer_Gynt,_Op.23_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n85373695.json ]
    luot_2_ghi_chu: "IMSLP composer field (both pages): Grieg, Edvard. LoC heading 'Grieg, Edvard, 1843-1907. Peer Gynt'."
  - id: n3
    cau: Op. 23 là số opus của nhạc sân khấu Peer Gynt, tác phẩm chứa Buổi sáng.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp-op23, imslp-op46, henle ]
    ket_qua: dung
    ghi_chu: Op. 23 đúng cho tác phẩm lớn; khi tách thành tổ khúc, Buổi sáng là Op. 46 số 1. Giữ Op. 23 vì tên nêu «(Peer Gynt)».
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Peer_Gynt,_Op.23_(Grieg,_Edvard)", "https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n79117290.json ]
    luot_2_ghi_chu: "IMSLP: Peer Gynt (incidental music to Ibsen, voices/chorus/orchestra, 1874-75) = Op.23, and Morgenstemning is its no. 14 (Act 4 prelude). The orchestral Suite No.1 that also contains it is a separate Op.46. So Op. 23 is correct for the parent stage work as worded. LoC n79117290: 'Peer Gynt' = incidental music to Ibsen's play."
