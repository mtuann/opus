nhan_dinh:
  - id: n1
    cau: Tên «"Buổi sáng" (Peer Gynt)» chỉ Morning Mood (Morgenstemning), số mở đầu Peer Gynt Suite số 1, trích từ nhạc sân khấu Peer Gynt.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp-op23, imslp-op46, henle ]
    ket_qua: dung
    ghi_chu: "IMSLP Op. 23: màn 4 mở đầu bằng «Prelude: Morning Mood / Indledning: Morgenstemning»; IMSLP Op. 46: Suite số 1 do tác giả chọn từ Peer Gynt Op. 23, chương 1 là Morning Mood; Henle ghi Morgenstimmung op. 46,1 và coi Op. 23 là gốc của hai tổ khúc."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)", "https://imslp.org/wiki/Peer_Gynt,_Op.23_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n85373695.json ]
    luot_2_ghi_chu: "IMSLP Peer Gynt Suite No.1, Op.46: movement 1 = 'Morning Mood' (Morgenstimmung / Morgenstemning); related works: 'Selected by the composer from Peer Gynt, Op.23'. IMSLP Peer Gynt Op.23 (incidental music, Ibsen): Act 4, '14. Indledning: Morgenstemning'. LoC n85373695: Suite no. 1, op. 46: 'Morgenstemning; Ases död; Anitras dans; I dovregubbens hal'."
  - id: n2
    cau: Tác giả là Edvard Grieg.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp-op23, imslp-op46, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)", "https://imslp.org/wiki/Peer_Gynt,_Op.23_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n85373695.json ]
    luot_2_ghi_chu: "IMSLP composer field (both pages): Grieg, Edvard. LoC heading 'Grieg, Edvard, 1843-1907. Peer Gynt'."
  - id: n3
    cau: Op. 23 là số opus của nhạc sân khấu Peer Gynt, tác phẩm chứa Buổi sáng.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp-op23, imslp-op46, henle ]
    ket_qua: dung
    ghi_chu: Op. 23 đúng cho tác phẩm lớn; khi tách thành tổ khúc, Buổi sáng là Op. 46 số 1. Giữ Op. 23 vì tên nêu «(Peer Gynt)».
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Peer_Gynt,_Op.23_(Grieg,_Edvard)", "https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)", https://id.loc.gov/authorities/names/n79117290.json ]
    luot_2_ghi_chu: "IMSLP: Peer Gynt (incidental music to Ibsen, voices/chorus/orchestra, 1874-75) = Op.23, and Morgenstemning is its no. 14 (Act 4 prelude). The orchestral Suite No.1 that also contains it is a separate Op.46. So Op. 23 is correct for the parent stage work as worded. LoC n79117290: 'Peer Gynt' = incidental music to Ibsen's play."
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong:
      - thoi_ky
    nguon:
      - imslp-wt
    ket_qua: dung
    ghi_chu: IMSLP "Piece Style=Romantic"; nha-soan-nhac.yml (grieg, đã khóa) cũng ghi Lãng mạn.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)" ]
    luot_2_ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Romantic."
  - id: n5
    cau: 'Luyện nghe: gam ngũ cung, sáo và oboe.'
    loai: cau-truc
    truong:
      - luyen_nghe
    nguon:
      - nb-score
    ket_qua: dung
    ghi_chu: 'Tổng phổ tr. 3–5: câu mở đầu của sáo chỉ dùng Mi, Fa♯, Sol♯, Si, Đô♯ (ngũ cung Mi trưởng); sáo và oboe chuyền giai điệu cho nhau (xem hồ sơ trang nghe-nhac/grieg-buoi-sang n22, n25).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nashvillesymphony.org/media/1567/15-16-curriculumpacket-picturethis.pdf", "https://lagaleriesymphonique.osq.org/en/listen/peer-gynt-suite-n0-1-opus-46/", "https://audienceaccess.co/bio/LBS-18272" ]
    luot_2_ghi_chu: "Tài liệu của Nashville Symphony (trích ghi chú Naxos): 'It uses the pentatonic scale'. OSQ: 'The main theme is first played by the flute and the oboe in alternation'. Ghi chú chương trình LBS: sáo độc tấu mở đầu, oboe tiếp theo."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích ""Buổi sáng": mỗi ô một dòng của bảng "Sơ đồ cấu trúc" ngay dưới (độ rộng các ô chỉ minh họa)."; các ô: Mở đầu (sáo độc tấu giai điệu ngũ cung · oboe đáp lại); Dâng lên (giai điệu lan khắp dàn nhạc · to dần); Cao trào (forte, rồi fortissimo · giai điệu ở đàn dây); Đoạn giữa (đàn dây chạy nốt nhanh · cuối đoạn horn độc tấu); Trở lại và kết (giai điệu mở đầu · êm dần).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - nb-score
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Sơ đồ cấu trúc" của trang nghe-nhac/grieg-buoi-sang (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n27, n28, n29, n30, n31 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: nb-score. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n45 của hồ sơ trang.'
