    luot_2_ghi_chu: "Mục Licensing: PD-EU-audio (bản thu công bố ở EU quá 70 năm); thẻ PD-US-record ghi rõ bản thu công bố 1947–1956 được bảo hộ ở Mỹ 110 năm sau khi công bố, tức vẫn còn bảo hộ ở Mỹ."
