ghi_chu: 'Bản ghi mới (tools/them-tac-pham.mjs, 17/11/2026), loai: nghe. Nguồn chung với hồ sơ trang nghe-nhac/bartok-sonatina (ấn bản, cách đo mốc ghi ở đó). Không có doi_chieu (trang không có trích đoạn: không có bản quét bản in đầu 1919), không có cap (chưa có bài học Sonatina). ban_thu: commons.py rec báo nhầm "phạm vi công cộng" (đọc mẫu {{PD-old-auto-1923}} của phần sáng tác); trang mô tả ghi phần bản thu {{self|cc-by-sa-3.0|GFDL}}: sửa JSON thành CC BY-SA 3.0 rồi attach.py --json. Sơ đồ (hinh) chia theo mốc đo trên bản thu (giây, làm tròn): 2,5–29; 29–51; 51–85; 85–96; 96–119; 119–148; 148–191; 191–220. them_ngay là dữ liệu nội bộ, không có nhận định.'
