nhan_dinh:
  - id: n1
    cau: 'Tên: Sonatina; tác giả Béla Bartók; số danh mục Sz. 55, BB 69; loại hướng dẫn nghe.'
    loai: danh-muc
    truong: [ ten, tac_gia, danh_muc, loai ]
    nguon: [ imslp-sz55, henle-bem, quet-3953 ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Sz.55"; Henle "Sonatine BB 69"; bản quét bìa "Sonatine … par Béla Bartók", tr. 3 "Szonatina … Bartók Béla". Loại hướng dẫn nghe là phân loại của site (trang chính nghe-nhac/bartok-sonatina).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Sonatina,_Sz.55_(Bart%C3%B3k,_B%C3%A9la)", "https://www.henle.de/en/Sonatina/HN-1401" ]
    luot_2_ghi_chu: "IMSLP: Sonatina for Piano, Sz.55, Bartók. Henle: Sonatina BB 69 (số BB theo Somfai 1996). Loại 'hướng dẫn nghe' là chuyện của site."
  - id: n2
    cau: 'Thời kỳ: Thế kỷ 20.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-sz55 ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Early 20th century"; sáng tác 1915. Khớp thoi_ky của bartok trong nha-soan-nhac.yml.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Sonatina,_Sz.55_(Bart%C3%B3k,_B%C3%A9la)" ]
    luot_2_ghi_chu: "IMSLP: Year 1915, Piece Style 'Early 20th century'."
  - id: n3
    cau: 'Luyện nghe: giai điệu múa dân gian Romania, nhịp đổi, tay trái lặp hình nốt.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ henle-hn1401, quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Henle: giai điệu từ nhạc khí dân gian Romania. Bản quét: chương 1 Allegro đổi 2/4 và 3/4 (tr. 4); chương 3 tay trái lặp móc kép hai nốt ở Sostenuto và Tempo I (tr. 7–8), tay phải lặp La–Si (tr. 8).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630", "https://www.henle.de/en/Sonatina/HN-1401" ]
    luot_2_ghi_chu: "Henle: giai điệu dân gian Romania. Bản quét: đoạn Allegro chương I đổi 2/4–3/4; tay trái lặp hình nốt (ô 1–4 chương III, Rê–Mi lặp nhanh ở Sostenuto, hợp âm lặp ở Tempo I)."
  - id: n4
    cau: 'Hình, chú thích: ba chương, mỗi chương dựng trên một hay hai giai điệu múa dân gian Romania; độ dài ô theo bản thu La Pianista; cùng màu là cùng giai điệu trở lại trong một chương.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ henle-hn1401, quet-3953, lp-file ]
    ket_qua: dung
    ghi_chu: 'Chú thích nơi sưu tầm: chương 1 hai giai điệu (tr. 3, 4), chương 2 một (tr. 5), chương 3 hai (tr. 6, 7). Độ dài ô là giây trên bản thu (ghi_chu hồ sơ). Màu: chương 1 a–b–a (Tempo I trở lại giai điệu đầu), chương 3 a–b–coda (coda nhắc giai điệu đầu).'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/media/44/c9/ff/1697725864/1401-1697725864-sync.pdf", "https://commons.wikimedia.org/wiki/File:Bartok_-_Sonatina.ogg" ]
    luot_2_ghi_chu: "Lời tựa Henle: I và III hai điệu (ABA, điệu đầu trở lại rút gọn), II một điệu. Độ dài ô (27, 22, 34, 11, 23, 29, 43, 29 s) khớp khoảng cách các mốc đo trên bản thu La Pianista (2→29→51→85→96→119→148→191→220)."
  - id: n5
    cau: 'Hình, chương 1: Dudások, điệu múa 1, ô 1–20; Allegro, điệu múa 2, nhịp 2/4 và 3/4; Tempo I, điệu múa 1 trở lại.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Tr. 3: 20 ô (5+3+4+4+4), ô 20 longa; tr. 4: Allegro, 3/4 và 2/4 xen nhau; tr. 4 hệ 5 Tempo I, hai dấu thăng, giai điệu đầu trở lại.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "Bản quét tr. 3–5: điệu 1 ô 1–20 (longa ở ô 20), Allegro điệu 2 (chú thích riêng) đổi 2/4 và 3/4, Tempo I điệu 1 trở lại."
  - id: n6
    cau: 'Hình, chương 2: Medvetánc, giai điệu ở tay phải; từ ô 9 giai điệu xuống tay trái.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Tr. 5: ô 1–8 giai điệu tay phải; vạch kép, ô 9 p, giai điệu móc kép ở tay trái, tay phải hợp âm.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "Bản quét tr. 5: ô 1–8 giai điệu tay phải; ô 9 (p) giai điệu xuống tay trái."
  - id: n7
    cau: 'Hình, chương 3: Finale, điệu múa 1; Sostenuto, điệu múa 2, chậm và nhanh xen nhau; Coda, tranquillo, điệu múa 1.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: 'Tr. 6 chú thích điệu múa 1; tr. 7 chú thích điệu múa 2 ở nốt đầu Sostenuto; Sostenuto, poco a poco accel., Tempo I, rallentando molto al Sostenuto, accelerando, al Tempo I (tr. 7–8); tr. 9 "tranquillo (coda)", hình nốt của ô 5.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893630" ]
    luot_2_ghi_chu: "Bản quét tr. 6–9: Finale điệu 1 (jocul turcii); Sostenuto điệu 2 (babaleuca) với Sostenuto, accel., Tempo I, rallentando molto al Sostenuto, accelerando xen nhau; 'tranquillo (coda)' nhắc điệu 1."
