ghi_chu: 'Bản ghi mới (tools/them-tac-pham.mjs, 17/11/2026); sẽ khóa cả bản ghi.
  Nguồn chung với hồ sơ trang piano/tac-pham/debussy-arabesque-1. ban_thu ghi
  bằng commons.py rec + attach.py (Commons, phát được; note thêm tay nơi và ngày
  thu theo trang mô tả file). Sơ đồ (hinh) chia theo mốc trên bản thu (2, 15,
  98, 164, 187, 253 s, tiếng đàn tới 290,3 s). Dòng Nhà soạn nhạc sinh từ
  nha-soan-nhac.yml (đã khóa). them_ngay là dữ liệu nội bộ, không có nhận định.'
