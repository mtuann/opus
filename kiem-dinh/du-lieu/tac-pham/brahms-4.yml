nhan_dinh:
  - id: n1
    cau: Tên «Giao hưởng số 4, chương 4» chỉ chương 4 (Allegro energico e passionato) của Giao hưởng số 4 cung Mi thứ.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    ghi_chu: IMSLP liệt kê 4 chương, chương 4 là Allegro energico e passionato; Henle ghi chủ đề chaconne là nòng cốt của chương cuối.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)", https://id.loc.gov/authorities/names/n81016230.json ]
    luot_2_ghi_chu: "IMSLP: Symphony No.4, Op.98, E minor; 4 movements, no. 4 = 'Allegro energico e passionato'. LoC n81016230: 'Symphonies, no. 4, op. 98, E minor'."
  - id: n2
    cau: Tác giả là Johannes Brahms.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)", https://id.loc.gov/authorities/names/n81016230.json ]
    luot_2_ghi_chu: "IMSLP composer field: Brahms, Johannes. LoC heading 'Brahms, Johannes, 1833-1897'."
  - id: n3
    cau: Op. 98 là số opus của Giao hưởng số 4 cung Mi thứ.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)", https://id.loc.gov/authorities/names/n81016230.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.98 (E minor). LoC 'no. 4, op. 98, E minor'.
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong:
    - thoi_ky
    nguon:
    - imslp-wt
    ket_qua: dung
    ghi_chu: IMSLP "Piece Style=Romantic"; nha-soan-nhac.yml (brahms, đã khóa) cũng ghi Lãng mạn.
  - id: n5
    cau: 'Luyện nghe: passacaglia, 30 biến tấu.'
    loai: cau-truc
    truong:
    - luyen_nghe
    nguon:
    - simrock-1886
    - bi-werk
    ket_qua: dung
    ghi_chu: 'Đếm trên bản in (xem hồ sơ trang nghe-nhac/brahms-4 n12): chủ đề ô 1–8, 30 biến tấu 8 ô (ô 9–248), nối ô 249–252, coda Più Allegro từ ô 253. Brahms-Institut gọi chương là Passacaglia, "mehr als 30" lần lặp.'
  - id: n6
    cau: 'Hình, chú thích: Giao hưởng số 4, chương 4: chủ đề 8 ô nhịp và 30 biến tấu (độ dài các ô gần đúng theo số biến tấu).'
    loai: cau-truc
    truong:
    - hinh
    nguon:
    - simrock-1886
    ket_qua: dung
    ghi_chu: Như n5. Vế "độ dài các ô gần đúng" nói về cách vẽ.
  - id: n7
    cau: 'Hình, các ô: Chủ đề; BT 1–11 Mi thứ; BT 12 sáo; BT 13–15 Mi trưởng; BT 16–30 Mi thứ; Coda.'
    loai: cau-truc
    truong:
    - hinh
    nguon:
    - simrock-1886
    ket_qua: da-sua
    ghi_chu: 'Dữ liệu cũ: ô thứ năm ghi [BT 16–30, "Mi thứ, dồn dập"]. Các mốc đúng theo bản in (BT 1–11 hóa biểu một thăng; BT 12 sáo độc tấu, 3/2, vẫn một thăng; BT 13–15 bốn thăng; BT 16 trở lại một thăng, 3/4; coda Più Allegro). Riêng chữ "dồn dập" cho cả BT 16–30 không khớp bản nhạc: có nhiều đoạn pp (tr. 96, 99–100) và dim. trước chữ K; trang đã sửa dòng 17–30 thành "mạnh mẽ xen vài đoạn lắng nhỏ". Sửa ô thành "Mi thứ" (sua-A.yml, chưa áp dụng vào src/data/). Trọng số và màu là cách vẽ.'
