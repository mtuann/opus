nhan_dinh:
  - id: n1
    cau: Tên «Concerto violin» chỉ Concerto cho violin cung Mi thứ của Mendelssohn.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    ghi_chu: Tên ngắn không ghi cung Mi thứ; số Op. 64 xác định tác phẩm.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto,_Op.64_(Mendelssohn,_Felix)", https://id.loc.gov/authorities/names/n91030067.json ]
    luot_2_ghi_chu: "IMSLP: Violin Concerto, Op.64 (MWV O 14), E minor, violin and orchestra. LoC n91030067: 'Concertos, violin, orchestra, op. 64, E minor'."
  - id: n2
    cau: Tác giả là Felix Mendelssohn.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    ghi_chu: Henle ghi tên đầy đủ Felix Mendelssohn Bartholdy.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto,_Op.64_(Mendelssohn,_Felix)", https://id.loc.gov/authorities/names/n91030067.json ]
    luot_2_ghi_chu: "IMSLP composer field: Mendelssohn, Felix. LoC heading 'Mendelssohn-Bartholdy, Felix, 1809-1847' (same person)."
  - id: n3
    cau: Op. 64 là số opus của Concerto cho violin cung Mi thứ.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, henle ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto,_Op.64_(Mendelssohn,_Felix)", https://id.loc.gov/authorities/names/n91030067.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = Op.64 ; MWV O 14 (E minor). LoC 'op. 64, E minor'.
  - id: n4
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-2 ]
    ket_qua: dung
    ghi_chu: IMSLP Piece Style Romantic; khớp thoi_ky của mendelssohn trong nha-soan-nhac.yml (đã khóa).
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto_in_E_minor,_Op.64_(Mendelssohn,_Felix)" ]
    luot_2_ghi_chu: "IMSLP: Composer Time Period và Piece Style đều Romantic."
  - id: n5
    cau: 'Luyện nghe: concerto, cadenza đặt khác thường.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ ia-score, cle, bso ]
    ket_qua: dung
    ghi_chu: 'Cleveland: Mendelssohn dời cadenza "from its traditional place at the end of the movement to the middle"; BSO: "places it in the heart of the movement". Tổng phổ: "Cadenza ad libitum" ngay trước tái hiện.'
    luot_2: dung
    luot_2_nguon: [ "https://www.abc.net.au/listen/classic/features/deep-listen:-mendelssohns-violin-concerto-in-e-minor/9791758", "https://web.archive.org/web/20160309143541/http://nyphil.org/~/media/pdfs/program-notes/1314/Mendelssohn-Violin-Concerto.pdf" ]
    luot_2_ghi_chu: "NY Phil: cadenza đặt 'considerably earlier in the movement than one would expect'. ABC Classic: 'The cadenza was a designated space ... at the end of a movement, not in the middle'."
  - id: n6
    cau: 'Hình nghe, chú thích: Concerto violin cung Mi thứ, ba chương nối liền.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ imslp-2, ia-score, cle ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Key e, 3 chương; Cleveland: "the three movements of the concerto are played without pause"; tổng phổ: bassoon nối chương 1 sang 2, Allegretto non troppo nối sang chương 3.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20160309143541/http://nyphil.org/~/media/pdfs/program-notes/1314/Mendelssohn-Violin-Concerto.pdf", "https://imslp.org/wiki/Violin_Concerto_in_E_minor,_Op.64_(Mendelssohn,_Felix)" ]
    luot_2_ghi_chu: "IMSLP: 3 chương, Mi thứ. NY Phil: 'the three movements connect into a single overarching span'."
  - id: n7
    cau: 'Hình nghe, các ô chương 1: trình bày (violin vào ngay), phát triển, cadenza (trước tái hiện), tái hiện.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-score, cle, bso ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ: violin vào ở nửa sau ô 2; cadenza viết sẵn sau phần phát triển, dàn nhạc vào lại chủ đề chính (tái hiện) khi violin còn rải hợp âm. Cleveland: cadenza "grow organically out of the development section and naturally resolve in the recapitulation".'
    luot_2: dung
    luot_2_nguon: [ "https://www.abc.net.au/listen/classic/features/deep-listen:-mendelssohns-violin-concerto-in-e-minor/9791758", "https://archive.org/details/concertoforvioli00mend" ]
    luot_2_ghi_chu: "Bản Schirmer (Schradieck, 1923): violin 'Solo' vào từ ô 2. ABC: soloist 'enter almost immediately'; phát triển từ ô 210; cadenza ở cuối phần phát triển (ô 299); 'The return of the first theme in the orchestra signals the beginning of the recapitulation' ngay sau cadenza."
  - id: n8
    cau: 'Hình nghe, ô nối: bassoon nối chương 1 sang chương 2.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-score, bso ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ: Fagotti giữ nốt qua chỗ dàn nhạc dừng sang Andante. BSO: "the first bassoon fails to cut off with the rest of the orchestra, but holds its note".'
    luot_2: dung
    luot_2_nguon: [ "https://www.abc.net.au/listen/classic/features/deep-listen:-mendelssohns-violin-concerto-in-e-minor/9791758" ]
    luot_2_ghi_chu: "ABC: 'The last, crashing orchestral chord dies away, revealing a lone bassoon. This bassoon links the first and second movements'. Bản piano (Schirmer tr. 13) có nốt Si ngân có dấu lặng dài ở chỗ này."
  - id: n9
    cau: 'Hình nghe: chương II Andante ở Đô trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-score, indy ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ: Andante 6/8, không hóa biểu. Indianapolis: "an Andante in C major".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/concertoforvioli00mend", "https://imslp.org/wiki/Violin_Concerto_in_E_minor,_Op.64_(Mendelssohn,_Felix)" ]
    luot_2_ghi_chu: "Bản Schirmer tr. 14: 'Andante', nhịp 6/8, không có hóa biểu (Đô trưởng)."
  - id: n10
    cau: 'Hình nghe: một đoạn cầu nối giữa chương II và chương III.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-score, indy, bso ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ: Allegretto non troppo (Mi thứ, violin và dàn dây). Indianapolis: "Fourteen bars of transitional material"; BSO: "a brief transition".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto_in_E_minor,_Op.64_(Mendelssohn,_Felix)", "https://archive.org/details/concertoforvioli00mend" ]
    luot_2_ghi_chu: "IMSLP: chương 2 'Andante - Allegretto non troppo (123 bars)'. Bản Schirmer tr. 19: 'Allegretto, ma non troppo' (Mi thứ, khoảng 14 ô) nối vào 'Allegro molto vivace'."
  - id: n11
    cau: 'Hình nghe: chương III Allegro (Allegro molto vivace) ở Mi trưởng.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ ia-score, imslp-2, bso ]
    ket_qua: dung
    ghi_chu: 'Tổng phổ: Allegro molto vivace, bốn dấu thăng. Nhãn "III. Allegro" là dạng rút gọn của chỉ dẫn tốc độ. BSO: "a return to the key of E (this time in the major mode)". Độ rộng các ô (1.2, 0.8…) và lớp màu là trình bày, không phải nhận định.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Violin_Concerto_in_E_minor,_Op.64_(Mendelssohn,_Felix)", "https://archive.org/details/concertoforvioli00mend" ]
    luot_2_ghi_chu: "IMSLP: chương 3 'Allegro molto vivace (234 bars)'. Bản Schirmer tr. 19: 'Allegro molto vivace', hóa biểu bốn dấu thăng (Mi trưởng)."
