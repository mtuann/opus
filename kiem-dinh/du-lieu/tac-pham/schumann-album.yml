    ghi_chu: 'chưa chắc: Peters (Mutopia 647) ghi "pas vite" (= nicht schnell); hai bản in đọc được trên Internet Archive (Schuberth 1867 bản Klauser; một bản không ghi tên) không ghi chỉ dẫn tốc độ ở Melodie, dù cùng bản ghi "Nicht schnell" ở số 3, số 5. Chưa xem được bản in đầu hay Henle. Nếu bản gốc không có: sửa thành "Số 1 *Melodie* (Giai điệu): Đô trưởng · 4/4 · Schumann không ghi chữ chỉ tốc độ (bản Peters: *pas vite*, không nhanh)" và sửa theo trang (hồ sơ trang n56, n72). Không ghi vào sua-B.yml vì chưa quyết. Review D6-L1-gom: review mở bản quét bản in đầu (Bayerische Staatsbibliothek, bsb11108083, "Album für die Jugend. 40 Clavierstücke ... Op. 68", Schuberth & Co., số bản khắc 1232, Erstausg. theo Deutsche Digitale Bibliothek; một agent con Sonnet đọc ảnh IIIF trang 1 và 3): trang 1 "MELODIE." không có chữ chỉ tốc độ nào; trang 3 (Trällerliedchen) có "Nicht schnell.". Henle HN 45 Bemerkungen không nói tốc độ của số 1; một bản in năm 1900 in "(Nicht schnell.)" trong ngoặc (lượt 2); Peters (Mutopia) ghi "pas vite". Kết luận: Nicht schnell ở Melodie là chỉ dẫn của người biên tập. Dữ liệu: "bản in đầu không ghi tốc độ (nhiều ấn bản thêm *Nicht schnell*, không nhanh)". Gỡ kết quả lượt 2 cũ (khong-chac: bản 1900 in "(Nicht schnell.)" trong ngoặc; Schuberth 1867 không ghi; chưa thấy bản in đầu) để lượt 2 bổ sung.'
