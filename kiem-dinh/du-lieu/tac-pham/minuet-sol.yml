nhan_dinh:
  - id: n1
    cau: "Tên bài: Minuet Sol trưởng, BWV Anh. 114 (trong Notenbüchlein für Anna Magdalena Bach, 1725)."
    loai: ten
    truong:
      - ten
    nguon:
      - imslp-anh114
      - henle-hn349
    ket_qua: dung
    ghi_chu: 'IMSLP: "Minuet in G major, BWV Anh.114", Key "G major". Henle HN 349: "Menuet BWV Anhang 114".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)", "https://imslp.org/wiki/Notebooks_for_Anna_Magdalena_Bach_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: 'IMSLP Notebook page: "Klavierbüchlein von 1725 ... 4. Menuet G-dur, BWV Anh.114".'
  - id: n2
    cau: "Tác giả: Christian Petzold (không phải J. S. Bach, dù bài chép trong sổ tay của Anna Magdalena Bach)."
    loai: lich-su
    truong:
      - tac_gia
    nguon:
      - imslp-anh114
      - rcm-2022
    ket_qua: dung
    ghi_chu: 'IMSLP lưu bài dưới tên "Pezold, Christian" (BWV Anh. 114, cùng một tổ khúc với minuet Sol thứ Anh. 115). RCM 2022: "Minuet in G Major, BWV Anh. 114 — Petzold".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)", https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf ]
    luot_2_ghi_chu: IMSLP work page names the composer as Pezold (= Petzold), Christian; RCM 2022 Level 3 lists "Petzold, Christian - Minuet in G Major, BWV Anh. 114 (in Notenbuch der Anna Magdalena Bach)".
  - id: n3
    cau: "Số danh mục: BWV Anh. 114."
    loai: danh-muc
    truong:
      - danh_muc
    nguon:
      - imslp-anh114
      - henle-hn349
      - rcm-2022
    ket_qua: dung
    ghi_chu: 'IMSLP: Op./Cat. No. "BWV Anh.114 ; BWV Anh. II 114". Henle: "BWV Anhang 114". RCM 2022: "BWV Anh. 114".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)" ]
    luot_2_ghi_chu: BWV Anh.114 (formerly BWV 841).
  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 1–2.
    loai: cap-do
    truong:
      - grade
    nguon:
      - henle-hn349
      - rcm-2022
      - abrsm-2728
      - henle-thang
    ket_qua: dung
    ghi_chu: "Nói theo kiểu tương đương: minuet Sol trưởng Anh. 114 không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle mức 1 (easy), như minuet Sol thứ Anh. 115; RCM 2022: Level 3, cùng danh sách với Anh. 115 và Musette Anh. 126. Minuet Sol thứ Anh. 115 ở ABRSM Grade 2 (2027–2028) và Trinity Grade 2. Kết luận: khoảng Grade 1–2."
    luot_2: dung
    luot_2_nguon: [ https://www.henle.de/en/Notebook-for-Anna-Magdalena-Bach/HN-349, https://www.trinitycollege.com/qualifications/music/grade-exams/piano/piano-grade-2, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf ]
    luot_2_ghi_chu: No ABRSM/Trinity listing of Anh.114 itself; Henle level 1 (lowest tier, same as its G minor companion Anh.115, which Trinity sets at Grade 2); RCM 2022 Level 3 for both minuets (same level as the Musette Anh.126, ABRSM Grade 2). Grade 1-2 plausible.
  - id: n5
    cau: Bài thuộc chặng 2 (Grade 1–2) của lộ trình piano.
    loai: cap-do
    truong:
      - chang
    nguon:
      - henle-hn349
    ket_qua: dung
    ghi_chu: Chặng 2 = Grade 1–2 (cap-do.yml); khớp với grade ở n4.
    luot_2: dung
    luot_2_nguon: [ https://www.henle.de/en/Notebook-for-Anna-Magdalena-Bach/HN-349 ]
    luot_2_ghi_chu: Stage 2 = Grade 1-2; consistent.
  - id: n6
    cau: Bài được gợi ý ở chặng 2 trong hộp luyện tập của trang chủ.
    loai: khuyen-tap
    truong:
      - goi_y
