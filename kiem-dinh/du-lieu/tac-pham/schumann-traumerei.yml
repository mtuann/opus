    ghi_chu: 'Nói theo kiểu tương đương: Träumerei không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle xếp mức 5 (medium), bằng "Kind im Einschlummern" (số 12) mà ABRSM xếp Grade 7 (2021–2028); "Von fremden Ländern und Menschen" (số 1, Henle 4) ở ABRSM Grade 5 (2021–2028). RCM 2022: Kinderszenen số 1 ở Level 6, số 6 ở Level 8. Kết luận: khoảng Grade 6–7; Grade 6 nằm trong sai số một cấp.'
    luot_2: dung
    luot_2_nguon:
      - https://www.henle.de/en/Scenes-from-Childhood-op.-15/HN-44
      - https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
      - https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf
    luot_2_ghi_chu: 'No ABRSM/Trinity grade listing of Träumerei itself (RCM lists the complete Kinderszenen only in ARCT). Henle level 5, between Kinderszenen no.1 (Henle 4, ABRSM Grade 5 since 2021) and no.12 (Henle 5, "ABRSM: Piano Grade 7 recommended"; ABRSM Grade 7 in 2021-26). So about Grade 6-7; "khoảng Grade 6" acceptable.'
