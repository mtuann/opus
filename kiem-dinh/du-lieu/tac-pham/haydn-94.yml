    ket_qua: dung
    ghi_chu: 'Cranz: Var. 2 "Minore", ba dấu giáng (Đô thứ); Var. 3 "Maggiore", oboe I chơi chủ đề bằng móc kép nhắc lại, bassoon đệm (kèn gỗ nổi bật); Var. 4 mọi bè ff (kèn gỗ, kèn đồng, timpani); coda sempre dim., pp. Khớp hồ sơ trang nghe-nhac/haydn-94 n14–n18. Trọng số và màu là cách vẽ.'
