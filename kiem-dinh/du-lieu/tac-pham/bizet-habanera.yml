nhan_dinh:
  - id: n1
    cau: Tên «Habanera» chỉ aria Habanera («L'amour est un oiseau rebelle») ở màn 1 của opera Carmen.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, chandos-naxos ]
    ket_qua: dung
    ghi_chu: "Tên không nêu vở Carmen (các tên cùng loại như «Nessun dorma» (Turandot) có nêu): gợi ý biên tập, không sai. IMSLP gọi aria là «Habanera: L'amour est un oiseau rebelle» (màn 1, số 4 trong tổng phổ, số 5 trong bản thanh nhạc piano); trang Chandos chỉ ghi «Act I: L'amour est un oiseau rebelle»."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Carmen_(Bizet,_Georges)", https://id.loc.gov/authorities/names/n81118710.json, https://id.loc.gov/authorities/names/n81120420.json ]
    luot_2_ghi_chu: "IMSLP Carmen (opéra-comique en quatre actes): Act I, no. 4 'Habanera: L'amour est un oiseau rebelle'. LoC n81118710: 'Carmen. Habanera' (WERM: 'Habañera--L'amour est un oiseau rebelle'). LoC n81120420: Carmen, opéra comique in 4 acts, 1873-4."
  - id: n2
    cau: Tác giả là Georges Bizet.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, chandos-naxos ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Carmen_(Bizet,_Georges)", https://id.loc.gov/authorities/names/n81118710.json ]
    luot_2_ghi_chu: "IMSLP composer field: Bizet, Georges. LoC heading 'Bizet, Georges, 1838-1875. Carmen. Habanera'. (IMSLP notes the Habanera melody is based on Yradier's 'El arreglito'; Bizet is still the composer of the number as it stands in Carmen.)"
  - id: n3
    cau: 'Thời kỳ: Lãng mạn.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-carmen, imslp-bizet ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Carmen «Piece Style Romantic»; Bizet «Time Period Romantic».'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Carmen_(Bizet,_Georges)" ]
    luot_2_ghi_chu: "IMSLP: Composer Time Period và Piece Style đều Romantic."
  - id: n4
    cau: 'Luyện nghe: opera, tiết tấu habanera.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ imslp-carmen, cod-habanera, choudens ]
    ket_qua: dung
    ghi_chu: 'Habanera là aria trong opera Carmen (IMSLP); bè trầm dùng tiết tấu habanera suốt bài (Choudens tr. 45–55; COD: tiết tấu chấm dôi nhịp đôi).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Carmen_(Bizet,_Georges)" ]
    luot_2_ghi_chu: "IMSLP: Carmen là opera bốn màn (voices, chorus, orchestra); màn I có số 'Habanera: L'amour est un oiseau rebelle'."
  - id: n5
    cau: 'Hình cấu trúc (hinh.nghe): Habanera có hai lời, mỗi lời theo sau bằng điệp khúc có hợp xướng: Lời 1 (Carmen), Điệp khúc (+ hợp xướng), Lời 2 (Carmen), Điệp khúc (+ hợp xướng).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ schirmer, choudens ]
    ket_qua: dung
    ghi_chu: "Schirmer tr. 44–54: lời 1 «L'amour est un oiseau rebelle» (Carmen một mình, Rê thứ); điệp khúc Rê trưởng với soprano, tenor, bass («Prends garde à toi!»); lời 2 «L'oiseau que tu croyais surprendre»; điệp khúc 2, kết cùng hợp xướng. Độ dài ô tương đối (1, 1, 1, 1) là lựa chọn vẽ của site."
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/carmenoperainfou1875bize", "https://archive.org/details/carmenopraen4act00bize" ]
    luot_2_ghi_chu: "Libretto 1875 (bản Anh của Hersee): 'La Habanera' gồm hai đoạn lời, sau đoạn 1 là điệp khúc, sau đoạn 2 ghi 'When Love, &c.' (điệp khúc lặp). Bản chant-piano (Choudens, Avanera N° 5, tr. 45–52): điệp khúc có bè Soprani, Tenori, Bassi của hợp xướng ('trema per te') ở cả hai lần."
  - id: n6
    cau: "Số danh mục của Carmen: GB 9; WD 31."
    loai: danh-muc
    truong:
      - danh_muc
    nguon:
      - imslp
    ket_qua: dung
    ghi_chu: 'IMSLP (API, 07/11/2026): "Opus/Catalogue Number=GB 9 ; WD 31". Thêm theo ghi chú của hồ sơ và d6-l10.md.'
    luot_2: dung
    luot_2_nguon:
      - https://imslp.org/wiki/Carmen_(Bizet,_Georges)
    luot_2_ghi_chu: "Mở lại trang IMSLP qua API: khớp."
    review: dung
