      - abrsm-arsm
    ket_qua: da-sua
    ghi_chu: 'Review (24/10/2026): sửa theo lượt 2: dữ liệu ghi "Grade 7–8"; ABRSM chỉ xếp bài trong danh sách ARSM (đã mở PDF, mục 83), không có ở Grade 1–8. Đổi grade thành "Grade 8 trở lên" như Fantaisie-Impromptu, Liebestraum. Nói theo kiểu tương đương: Impromptu Sol♭ không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle xếp mức 6 (medium) cho cả bốn Impromptu Op. 90. Impromptu La♭ Op. 142 số 2 (D. 935; Henle 5) ở ABRSM Grade 8 (2021–2028); Moment musical Fa thứ D. 780 số 3 (Henle 5) ở Grade 6 (2023–2028). RCM 2022: Impromptu Sol♭ ở Level 10. Kết luận: khoảng Grade 7–8.'
    luot_2: sai
    luot_2_nguon:
      - https://web.archive.org/web/20210725061338/https://gb.abrsm.org/media/14967/pianoarsm.pdf
      - https://www.henle.de/en/Impromptus-and-Moments-musicaux/HN-4
      - https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf
      - https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
    luot_2_ghi_chu: 'câu đúng: Bài tương đương khoảng ABRSM Grade 8 trở lên (ABRSM đưa vào danh sách tác phẩm ARSM, tức sau Grade 8).; ABRSM places this exact piece in its ARSM repertoire list (diploma, after Grade 8): "Impromptu in G-flat, Op.90 no.3, D899/3"; it is in none of the ABRSM Grade 1-8 lists I could open (2013-26). Henle level 6 with "ABRSM: Piano ARSM", whereas the A-flat Impromptu Op.142/2 (Henle 5) is "ABRSM: Piano Grade 8 recommended" and is the Schubert impromptu on the Grade 8 lists; RCM 2022 Level 10. All three put it at Grade 8 or above, so "Grade 7-8" understates it.'
