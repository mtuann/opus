    luot_2: sai
    luot_2_nguon: [ https://web.archive.org/web/20210725061338/https://gb.abrsm.org/media/14967/pianoarsm.pdf, https://www.henle.de/en/Impromptus-and-Moments-musicaux/HN-4 ]
    luot_2_ghi_chu: 'câu đúng: Bài thuộc chặng 7 (sau Grade 8) của lộ trình piano.; Follows n4: with the piece on the ARSM list (and Henle one level above the Grade-8 Impromptu Op.142/2), the site convention for "Grade 8 trở lên" pieces (cf. Fantaisie-Impromptu, Liebestraum) is stage 7.'
