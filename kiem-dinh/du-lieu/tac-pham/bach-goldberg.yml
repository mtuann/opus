    luot_2_ghi_chu: "IMSLP: work title 'Goldberg-Variationen' (alt. Goldberg Variations; Aria mit 30 Veränderungen; Clavier-Übung IV), 'aria, 30 variations', the list ends with 'Aria da Capo'. Bach Digital BWV 988: 'Aria mit 30 Veränderungen (Goldberg-Variationen / Goldberg-Variations)'. LoC n81055107: 'Goldberg-Variationen'."
