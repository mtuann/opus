  - id: n6
    cau: 'Hình, chú thích: Giao hưởng số 40, chương 1: hình thức sonata.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-550, cod-sonata-form ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Symphony_No.40_in_G_minor,_K.550_(IA_imslp-no40-in-g-minor-k550-mozart-wolfgang-amadeus).pdf" ]
    luot_2_ghi_chu: "Bản chuyển soạn piano của W. Meves (Litolff), Commons trang 2–7: chương 1 theo hình thức sonata. Không có tổng phổ đọc được (PDF IMSLP chặn; tổng phổ NMA là ảnh)."
  - id: n7
    cau: 'Hình, ô Trình bày: Sol thứ → Si♭ trưởng; tiếp theo là ô (nhắc lại).'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-550 ]
    ket_qua: dung
    ghi_chu: 'NMA tr. 125: hóa biểu hai giáng, chủ đề 1 Sol thứ; tr. 128: chủ đề 2 Si♭ trưởng ô 44; tr. 132: dấu nhắc lại cuối ô 100.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Symphony_No.40_in_G_minor,_K.550_(IA_imslp-no40-in-g-minor-k550-mozart-wolfgang-amadeus).pdf" ]
    luot_2_ghi_chu: "Bản Meves: mở ở Sol thứ, chủ đề 2 (p, đi xuống nửa cung) và đoạn kết ở Si♭ trưởng, cuối trình bày (tr. 21) có dấu nhắc lại."
  - id: n8
    cau: 'Hình, ô Phát triển: chuyển giọng đột ngột.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-550 ]
    ket_qua: dung
    ghi_chu: 'NMA tr. 132: ô 101–105, từ Si♭ trưởng sang Fa♯ thứ chỉ qua hai ô kèn gỗ (hồ sơ trang n16).'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Symphony_No.40_in_G_minor,_K.550_(IA_imslp-no40-in-g-minor-k550-mozart-wolfgang-amadeus).pdf" ]
    luot_2_ghi_chu: "Bản Meves tr. 22: phát triển mở bằng hợp âm chuyển đột ngột từ Si♭ trưởng sang vùng Fa♯ thứ, rồi đi qua nhiều giọng."
  - id: n9
    cau: 'Hình, ô Tái hiện: cả hai chủ đề ở Sol thứ; ô cuối Coda.'
    loai: cau-truc
    truong: [ hinh ]
    nguon: [ nma-550, cod-sonata-form ]
    ket_qua: dung
    ghi_chu: 'NMA tr. 137: chủ đề 1 ô 164–166 Sol thứ; tr. 142: chủ đề 2 ô 227 Sol thứ; tr. 146: kết ô 299 Sol thứ. Bản nhạc không ghi chữ Coda; COD: phần tái hiện có coda. Trọng số ô (2.4, 2.4, 1.8, 2.6, 0.5) và lớp màu là cách vẽ của site, không phải nhận định.'
    luot_2: dung
    luot_2_nguon: [ "https://commons.wikimedia.org/wiki/File:Symphony_No.40_in_G_minor,_K.550_(IA_imslp-no40-in-g-minor-k550-mozart-wolfgang-amadeus).pdf" ]
    luot_2_ghi_chu: "Bản Meves tr. 23–24: tái hiện chủ đề 1 ở Sol thứ; chủ đề 2 trở lại ở Sol thứ (tr. 24, sau dấu lặng); cuối chương có đoạn coda."
