nhan_dinh:
  - id: n1
    cau: Tên «"Hallelujah" (Messiah)» chỉ hợp xướng Hallelujah của oratorio Messiah.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp, carus ]
    ket_qua: dung
    ghi_chu: "IMSLP liệt kê «Chorus: Hallelujah (Part II, No.44)» trong Messiah, HWV 56; Carus liệt kê «39. Halleluja» trong mục lục Messiah."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", https://id.loc.gov/authorities/names/n82159306.json, https://id.loc.gov/authorities/names/n82066674.json ]
    luot_2_ghi_chu: "IMSLP Messiah, HWV 56: lists 'Chorus: Hallelujah (Part II, No.44)' (the movement list also shows 'Hallelujah' at the end of Part II). LoC n82159306: 'Messiah. Hallelujah' (Händel-Handbuch: 56). LoC n82066674: Messiah, genre 'Oratorios'."
  - id: n2
    cau: Tác giả là George Frideric Handel.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, carus ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", https://id.loc.gov/authorities/names/n82066674.json ]
    luot_2_ghi_chu: "IMSLP composer field: Handel, George Frideric. LoC heading 'Handel, George Frideric, 1685-1759. Messiah'."
  - id: n3
    cau: HWV 56 là số danh mục của oratorio Messiah, tác phẩm chứa hợp xướng Hallelujah.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, carus ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", https://id.loc.gov/authorities/names/n82066674.json ]
    luot_2_ghi_chu: "IMSLP Op./Cat. No. = HWV 56 (Messiah). LoC n82066674: '(HWV 56. Messiah; composed in 1741 in London)', genre 'Oratorios'."
  - id: n4
    cau: 'Thời kỳ: Baroque.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Baroque".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Handel,_George_Frideric", "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)" ]
    luot_2_ghi_chu: 'IMSLP: Handel thuộc "People from the Baroque era".'
  - id: n5
    cau: 'Luyện nghe: hợp xướng, fugue.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ mutopia-messiah, cod-messiah ]
    ket_qua: dung
    ghi_chu: 'Mutopia: bốn bè hợp xướng Canto, Alto, Tenore, Basso; ô 41–50 "and He shall reign for ever and ever" các bè vào lần lượt bass (ô 41), tenor (43–44), alto (46), soprano (48–49) với cùng chủ đề: đoạn fugue (theo thuat-ngu fugue "chủ đề lần lượt vào ở các bè"). COD: Messiah là oratorio. Khớp hồ sơ trang nghe-nhac/handel-hallelujah n26.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=459", "https://www.mutopiaproject.org/ftp/HandelGF/hallelujah/hallelujah-lys.zip" ]
    luot_2_ghi_chu: 'Mutopia: Hallelujah Chorus, for Voice (SATB) và dàn nhạc. Đọc bè: chủ đề "And He shall reign" vào lần lượt ở bass ô 41 (Rê), tenor ô 44 (La), alto ô 46 (Rê), soprano ô 48–49 (La): một đoạn fugue (fugato) trong bản hợp xướng. Bản Mutopia ghi nguồn "Unknown"; đối chiếu bản in đầu không làm được (PDF IMSLP chặn).'
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích ""Hallelujah": mỗi ô một dòng của bảng "Sơ đồ cấu trúc" ngay dưới (độ rộng các ô chỉ minh họa)."; các ô: Mở đầu (dàn nhạc dạo ba ô · cả hợp xướng hô "Hallelujah!"); Đoạn 1 ("for the Lord God…" · đồng âm, rồi đuổi nhau); Đoạn 2 ("The kingdom of this world…" · như thánh ca); Đoạn 3 ("and He shall reign…" · fugue); Cao trào ("King of kings…" · soprano lên từng bậc); Kết (im lặng hai phách · "Hallelujah" cuối).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - mutopia-messiah
    ket_qua: dung
    ghi_chu: 'Vẽ lại bảng "Sơ đồ cấu trúc" của trang nghe-nhac/handel-hallelujah (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một dòng bảng, theo thứ tự, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n23, n24, n25, n26, n27, n28 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: mutopia-messiah. Độ rộng bằng nhau (chú thích ghi "chỉ minh họa") và màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n36 của hồ sơ trang. Soát hình 3C (gộp review và kiểm mẫu): hinh.nghe khớp trang trên bản xem (07/11/2026), xem n36 của kiem-dinh/nghe-nhac/handel-hallelujah.yml: 6 ô theo 6 dòng bảng Sơ đồ cấu trúc (Mở đầu, Đoạn 1–3, Cao trào, Kết), lời trích và kỹ thuật (đồng âm rồi đuổi nhau, như thánh ca, fugue, soprano lên từng bậc, im lặng hai phách) lấy từ hai cột của dòng ấy. Kết quả: dung.'
    luot_2: dung
    luot_2_nguon: [ "kiem-dinh/nghe-nhac/handel-hallelujah.yml" ]
    luot_2_ghi_chu: "6 ô khớp thứ tự và số lượng 6 dòng bảng \"Sơ đồ cấu trúc\"/\"Theo dõi khi nghe\". n23-n28 có kết quả; n27 lượt 2 sai đã sửa trang và review dung, chữ ô khớp."
    review: dung
  - id: n7
    cau: "Bản thu Handel, hợp xướng Hallelujah (Messiah): hãng Edison (đĩa Edison Diamond Disc, năm 1916; Commons không ghi tên hợp xướng)."
    loai: ten
