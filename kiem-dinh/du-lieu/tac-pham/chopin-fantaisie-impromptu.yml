      - imslp-op66
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Sáng tác năm 1834; … được Arthur Rubinstein mua năm 1960 và in năm 1962". 1834 là theo Fontana (Henle; IMSLP 1834–35). "Mua năm 1960" chỉ thấy ở nguồn phổ thông: bỏ. Mục sua-A.yml. Review D6-L6-gom: lượt 2 khong-chac ở hai vế: năm in 1962 của bản Schirmer (danh mục thư viện Hope nay chặn máy bằng trang kiểm tra robot, review không vòng; chưa có nguồn khác mở được) và "Chopin không cho in" (Henle chỉ nói "only published after the composer’s death"). Bỏ năm 1962; "Chopin không cho in" thành "chỉ được in sau khi Chopin mất" theo Henle. Chỉ bỏ vế lượt 2 không xác nhận, nên không chạy lại. doi_chu ở hồ sơ trang piano/tac-pham/chopin-fantaisie-impromptu.'
