    cau: 'Sáng tác / xuất bản: theo Fontana sáng tác năm 1834; chỉ được in sau khi Chopin mất: Fontana in năm 1855; một bản tay của Chopin đề năm 1835, ghi "soạn cho Nam tước phu nhân d''Este", sau thuộc bộ sưu tập Arthur Rubinstein.'
