nhan_dinh:
  - id: n1
    cau: "Tên bài: Sonatina Sol trưởng, Anh. 5 số 1 (gán cho Beethoven), gồm chương Moderato và Romanze."
    loai: ten
    truong:
      - ten
    nguon:
      - imslp-anh5
      - henle-hn365
    ket_qua: dung
    ghi_chu: 'IMSLP: "2 Sonatinas for Piano, Anh.5": Sonatina in G major (Moderato; Romanze) và Sonatina in F major. Henle HN 365: "Piano Sonatina G major Anh. 5,1".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/2_Sonatinas_for_Piano,_Anh.5_(Beethoven,_Ludwig_van)", https://www.henle.de/en/2-Piano-Sonatinas-G-major-and-F-major-Anh.-5/HN-365 ]
    luot_2_ghi_chu: 'IMSLP: 2 Sonatinas, Anh.5: Sonatina in G major = Moderato, Romanze; Henle "Piano Sonatina G major Anh. 5,1".'
  - id: n2
    cau: "Tác giả: gán cho Ludwig van Beethoven (không chắc là của ông)."
    loai: lich-su
    truong:
      - tac_gia
      - gan_cho
    nguon:
      - henle-hn365
      - abrsm-2526
      - rcm-2022
      - imslp-anh5
    ket_qua: dung
    ghi_chu: 'Henle HN 365: "it is very unlikely that they were actually written by Beethoven ... listed in his catalogue of works as Anhang/Appendix 5". ABRSM 2025–2026 ghi "attrib. Beethoven"; RCM 2022 ghi "attr. Beethoven". IMSLP xếp dưới Beethoven với số "WoO Anh.5". Khớp tac_gia: beethoven kèm gan_cho: true.'
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, "https://imslp.org/wiki/2_Sonatinas_for_Piano,_Anh.5_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: ABRSM 2025-26 Grade 2 lists it as "attrib. Beethoven"; RCM 2022 "attr. Beethoven"; IMSLP places it under WoO Anh.5 (appendix of doubtful/spurious works). Attribution is doubtful, as claimed.
  - id: n3
    cau: "Số danh mục: Anh. 5 số 1 (Anhang 5, bài đầu)."
    loai: danh-muc
    truong:
      - danh_muc
    nguon:
      - henle-hn365
      - imslp-anh5
    ket_qua: dung
    ghi_chu: 'Henle: "Anh. 5,1". IMSLP: Op./Cat. No. "WoO Anh.5"; Sonatina in G major là bài đầu.'
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf, https://www.henle.de/en/2-Piano-Sonatinas-G-major-and-F-major-Anh.-5/HN-365 ]
    luot_2_ghi_chu: 'ABRSM: "Sonatina in G, WoO Anh. 5"; Henle: "Anh. 5,1"; RCM: "Anh. 5, no. 1".'
  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 2–3.
    loai: cap-do
    truong:
      - grade
    nguon:
      - abrsm-2526
      - henle-hn365
      - rcm-2022
    ket_qua: dung
    ghi_chu: 'Đề cương chính thức: ABRSM Piano 2025 & 2026, Grade 2, danh sách A, mục 2: "attrib. Beethoven, Moderato (1st movt from Sonatina in G, WoO Anh. 5)". Henle mức 3 (easy); RCM 2022: "Sonatina in G Major, Anh. 5, no. 1: I or II" ở Level 3. Khoảng Grade 2–3 bao cả hai chương.'
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, https://www.henle.de/en/2-Piano-Sonatinas-G-major-and-F-major-Anh.-5/HN-365 ]
    luot_2_ghi_chu: 'ABRSM 2025-26 Grade 2 List A: "attrib. Beethoven - Moderato (1st movt from Sonatina in G, WoO Anh. 5)"; RCM 2022 Level 3 (1st mvt and Romanze); Henle level 3 (the F major sibling Anh.5/2 is ABRSM Grade 4). Grade 2-3 supported.'
  - id: n5
    cau: Bài thuộc chặng 3 (Grade 3) của lộ trình piano.
    loai: cap-do
    truong:
      - chang
    nguon:
      - abrsm-2526
      - rcm-2022
    ket_qua: dung
    ghi_chu: Khoảng Grade 2–3 nằm giữa chặng 2 (Grade 1–2) và chặng 3 (Grade 3); dữ liệu chọn chặng 3 (đầu trên của khoảng), hợp lệ theo luật kiểm chéo.
    luot_2: dung
    luot_2_nguon: [ https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf ]
    luot_2_ghi_chu: Stage 3 = Grade 3 is inside the supported 2-3; note ABRSM lists mvt 1 at Grade 2, so it sits on the stage 2/3 border.
