  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 4–5 (ABRSM xếp Invention số 1 ở Grade 4, đề cương 2015–2016).
    loai: cap-do
    truong:
      - grade
    nguon: [ henle-hn591, abrsm-2122, abrsm-2526, abrsm-1718, trinity-2023, rcm-2022, henle-thang, abrsm-1516-g4 ]
    ket_qua: da-sua
    ghi_chu: "Review (24/10/2026): sửa theo lượt 2: dữ liệu ghi \"Grade 6\"; ABRSM 2015–2016 xếp đúng bài này ở Grade 4 (đã mở PDF, Grade 4, List A số 4). Đổi grade thành \"Grade 4–5\", chip và dòng Độ khó theo. Nói theo kiểu tương đương: không có đề cương ABRSM hay Trinity nào liệt kê đúng Invention số 1 (đã đối chiếu ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) và Trinity từ 2023). Henle xếp số 1 mức 3 (easy), bằng số 6 (BWV 777) mà ABRSM xếp Grade 6. Cùng bộ Invention hai bè: ABRSM Grade 5 cho số 8 (BWV 779; 2021–2028), Grade 6 cho số 6 (2021–2028), số 14 (BWV 785; 2025–2026) và số 13 (BWV 784; 2017–2018); Trinity xếp số 4 ở Grade 5, số 6 ở Grade 6, số 12 ở Grade 7. RCM 2022: Invention No. 1 ở Level 7. Henle không có bảng quy đổi sang ABRSM, nên Grade 6 là ước lượng (khoảng Grade 5–6)."
    luot_2: sai
    luot_2_nguon: [ https://web.archive.org/web/20141127015939/http://gb.abrsm.org:80/fileadmin/user_upload/syllabuses/piano0415.pdf, https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf, https://www.henle.de/en/Two-Part-Inventions/HN-591, https://www.henle.de/en/From-Bach-to-Gershwin-All-time-favourites/HN-1750, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, https://www.trinitycollege.com/qualifications/music/grade-exams/piano/piano-grade-5 ]
    luot_2_ghi_chu: "câu đúng: Bài tương đương khoảng ABRSM Grade 4–5 (ABRSM 2015–16 xếp Invention số 1 ở Grade 4; các Invention khó hơn như số 8 ở Grade 5, số 6 và 14 ở Grade 6).; ABRSM Piano 2015-16 Grade 4, List A no.4 is exactly \"Invention No. 1 in C, BWV 772\". Other Inventions: No.8 Grade 5 (2021-26), Nos.6, 13, 14 Grade 6 (2013-26). Henle level 3 for no.1 (same as no.4, which Trinity sets at Grade 5, and no.6 \"ABRSM: Piano Grade 6 recommended\"; no.14 is Henle 4); RCM 2022 Level 7. Grade 6 overstates ABRSM's own listing by 2 grades."
