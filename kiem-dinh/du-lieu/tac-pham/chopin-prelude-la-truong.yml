  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 3–4.
    loai: cap-do
    truong:
      - grade
    nguon:
      - henle-hn882
      - abrsm-1920
      - rcm-2022
      - henle-thang
    ket_qua: dung
    ghi_chu: "Review (24/10/2026): giữ \"khoảng Grade 3–4\" là ước lượng: không đề cương nào xếp bài; Henle mức 4. Bài ngắn (16 ô) nên thường dạy sớm hơn các prelude cùng mức Henle. Lượt 1: Prélude La trưởng không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016), Trinity (từ 2023) hay RCM 2022. Henle xếp mức 4 (medium), cùng mức với Prélude Si thứ Op. 28 số 6 mà ABRSM xếp Grade 6 (2019–2020) và Prélude Mi thứ Op. 28 số 4 mà RCM xếp Level 7 (số 6 ở Level 8). Các prelude cùng mức Henle cao hơn dữ liệu (Grade 3–4) hai cấp trở lên; đề nghị cân nhắc Grade 5–6, nhưng chưa có nguồn riêng cho Prélude La trưởng."
    luot_2: khong-chac
    luot_2_nguon: [ https://www.henle.de/en/Preludes/HN-882, https://www.henle.de/en/Eleven-Bagatelles-op.-119/HN-1684, https://web.archive.org/web/20201112011213/https://gb.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf ]
    luot_2_ghi_chu: No ABRSM/Trinity/RCM listing of Op.28 No.7 found. Henle level 4 (medium), the same as No.4 (RCM Level 7) and No.6 (ABRSM Grade 6 in 2019-20); Henle 4 elsewhere equals ABRSM Grade 5 (Beethoven Op.119/1). So the evidence leans to Grade 4-5; claimed 3-4 may be low but is not refuted.
