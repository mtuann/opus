    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Special:ImagefromIndex/893790" ]
    luot_2_ghi_chu: "Đúng với bản in. Ghi thêm: tay trái số 6 còn có quãng ba Sol–Si (ô 30–34) và quãng bốn Fa–Si giáng (ô 36–40), không chỉ quãng năm, quãng sáu."
