    truong: [ thoi_ky ]
    nguon: [ imslp-op41, bnf-1889 ]
    ket_qua: dung
    ghi_chu: 'IMSLP: Composer Time Period Romantic, Piece Style Romantic; in năm 1889.'
  - id: n4
    cau: 'Chặng 6, Grade 8 (ABRSM Grade 8 danh sách C, đề cương 2025–2026); chip ≈ Grade 8; dòng Độ khó.'
