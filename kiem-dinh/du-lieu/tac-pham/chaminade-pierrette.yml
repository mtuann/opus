    truong: [ ten, tac_gia, danh_muc, loai ]
    nguon: [ imslp-op41, bernard ]
    ket_qua: dung
    ghi_chu: 'Bản in: "PIERRETTE. AIR DE BALLET. C. CHAMINADE. Op. 41". IMSLP: Pierrette, Alternative Title Air de ballet, Op.41.'
  - id: n2
    cau: 'Giọng Mi♭ trưởng, nhịp 2/4.'
    loai: cau-truc
    truong: [ giong, nhip, chip ]
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Hóa biểu ba dấu giáng, số chỉ nhịp 2/4 (tr. 3). Bốn ô mở đầu là nốt trầm Mi♭2, Si♭1 và hợp âm Mi♭–Sol–Si♭; bài kết bằng hai hợp âm fff trên nốt trầm Mi♭ (tr. 7, hai ô cuối).'
