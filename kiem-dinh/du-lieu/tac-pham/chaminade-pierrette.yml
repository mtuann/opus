    loai: so-lieu
    truong: [ chip ]
    nguon: [ kolodin-ban-thu ]
    ket_qua: dung
    ghi_chu: 'Tiếng đàn 147 s trong bản thu gợi ý.'
  - id: n7
    cau: 'Dòng Tác phẩm: Pierrette, Air de ballet (điệu múa ballet) cho piano, Op. 41.'
    loai: ten
    truong: [ thong_tin ]
    nguon: [ bnf-1889 ]
    ket_qua: dung
  - id: n8
    cau: 'Dòng Giọng · nhịp · tốc độ: Mi♭ trưởng · 2/4 · Allegretto, ♩ = 104 (số in trên bản nhạc).'
    loai: so-lieu
    truong: [ thong_tin ]
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Tr. 3: "Allegretto. ♩=104".'
  - id: n9
    cau: 'Dòng Hình thức: bốn ô mở đầu, chủ đề vang ba lần xen với một đoạn giữa nhiều màu, rồi đoạn kết; sơ đồ hinh tám ô: Mở đầu (tay trái, mf), A (chủ đề p), Mở đầu (marcatissimo), A (kết sff), B (đoạn giữa pp, ff, ppp), Chuyển (mp, poco rit.), A (a tempo, mp), Coda (pp, sfff, fff); độ dài theo bản thu (khoảng 2 phút 27 giây tiếng đàn).'
    loai: cau-truc
    truong: [ thong_tin, hinh ]
    nguon: [ bernard, kolodin-ban-thu ]
    ket_qua: dung
    ghi_chu: 'Như n15, n16 của hồ sơ trang. Độ dài ô sơ đồ (giây): 4, 30, 5, 19, 25, 10, 20, 32, theo mốc 9, 13, 43, 48, 68, 93, 104, 124, 156 trên bản thu; tổng 145 s gần 147 s tiếng đàn.'
  - id: n10
    cau: 'Kỹ năng chính (ky_nang_chinh và dòng Kỹ năng chính): móc kép staccato nhẹ và hợp âm nhấn; nốt hoa mỹ ở cả hai tay; tay trái nhảy giữa nốt trầm và hợp âm; tay trái bắt chéo lên trên tay phải; sắc thái từ ppp đến fff.'
    loai: cau-truc
    truong: [ ky_nang_chinh, thong_tin ]
    nguon: [ bernard ]
    ket_qua: dung
    ghi_chu: 'Như n5–n7 của hồ sơ trang. Nốt hoa mỹ tay phải: tr. 3 hệ 2 (ô 8), tr. 5–7 (nốt nhỏ trước hợp âm sff, fff).'
