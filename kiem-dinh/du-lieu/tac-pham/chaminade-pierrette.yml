    cau: 'Chip: "Air de ballet, in năm 1889"; dòng Sáng tác / xuất bản: Enoch & Costallat (Paris) in năm 1889 (Thư viện Quốc gia Pháp); nhiều bản soạn lại: piano bốn tay, dàn nhạc, măng-đô-lin, tam tấu.'
    loai: nam
    truong: [ chip, thong_tin ]
    nguon: [ bnf-1889, bnf-soan-lai, imslp-op41 ]
    ket_qua: dung
