    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-op13 ]
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: IMSLP ghi Piece Style "Classical"; trang hướng dẫn nghe ghi "Cổ điển, giai đoạn đầu của Beethoven". "Cổ điển → Lãng mạn" là cách xếp của site (chưa có nguồn cho chữ "→ Lãng mạn" với Op. 13). Người giao quyết: giữ (lựa chọn của site) hay đổi thành "Cổ điển". Review D6-L5-gom: lượt 1 chưa chắc, lượt 2 dung ("Cổ điển → Lãng mạn" hợp lý theo Henle). Review chọn "Cổ điển" cho nhất quán: IMSLP Piece Style "Classical"; hướng dẫn nghe này ghi "Cổ điển, giai đoạn đầu của Beethoven" (dòng 12); beethoven-anh-trang (Op. 27, viết sau Op. 13) và hướng dẫn nghe Ánh trăng (D6-L4) ghi "Cổ điển"; pathetique-adagio ghi "Cổ điển". thoi_ky không hiện trên trang nào. Không chạy lại lượt 2 (IMSLP lượt 2 đã mở). Chữ câu cũ: "Thời kỳ: Cổ điển → Lãng mạn.".'
    luot_2: dung
    luot_2_nguon: [ "https://www.henle.de/en/Piano-Sonata-no.-8-c-minor-op.-13-Grande-Sonata-Pathetique/HN-1348", "https://imslp.org/wiki/Piano_Sonata_No.8,_Op.13_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: 'Henle: đỉnh của phong cách Cổ điển, có "intensely Romantic characteristics"; IMSLP: Classical. Xếp "Cổ điển → Lãng mạn" hợp lý.'
    review: dung
