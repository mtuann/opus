  - id: n4
    cau: Bài tương đương khoảng ABRSM Grade 3.
    loai: cap-do
    truong:
      - grade
    nguon:
      - henle-hn1726
      - abrsm-2122
      - abrsm-2728
      - rcm-2022
      - henle-thang
    ket_qua: dung
    ghi_chu: 'Nói theo kiểu tương đương: Arabesque không có trong đề cương ABRSM 2017–2028 (cùng Grade 8 của 2015–2016) hay Trinity từ 2023. Henle xếp mức 1 (easy), bằng "Innocence" (số 5) mà ABRSM xếp Grade 3 (2021–2022) và "Douce plainte" (số 16) ở Grade 3 (2027–2028). Các bài khác trong Op. 100: Ballade (số 15, Henle 2) Grade 4, La tarantelle (số 20, Henle 2) Grade 5. RCM 2022: "Arabesque, op. 100, no. 2" ở Level 3. Kết luận: khoảng Grade 3.'
    luot_2: dung
    luot_2_nguon: [ https://web.archive.org/web/20201112011213/https://gb.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf, https://rcmusic-production-strapi-media.s3.ca-central-1.amazonaws.com/piano_syllabus_2022_edition_9c6a49bb96.pdf, https://www.henle.de/en/25-Etudes-op.-100/HN-1726, https://web.archive.org/web/20211206105029/https://gb.abrsm.org/media/65198/piano-g3-2021-2022-rev-sep-2020.pdf ]
    luot_2_ghi_chu: 'ABRSM 2019-20 Grade 2: "Arabesque (No. 2 from 25 études faciles et progressives, Op. 100)"; RCM 2022 Level 3; Henle level 1 (as No.5 "Innocence", which ABRSM sets at Grade 3 in 2021-22). So Grade 2-3; "khoảng Grade 3" is acceptable but the only exact ABRSM listing is Grade 2.'
  - id: n5
    cau: Bài thuộc chặng 3 (Grade 3) của lộ trình piano.
    loai: cap-do
    truong:
      - chang
    nguon:
      - abrsm-2122
      - rcm-2022
    ket_qua: dung
    ghi_chu: Chặng 3 = Grade 3 (cap-do.yml); khớp với grade ở n4.
    luot_2: dung
    luot_2_nguon: [ https://web.archive.org/web/20201112011213/https://gb.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf ]
    luot_2_ghi_chu: Stage 3 = Grade 3 is inside the 2-3 range; note ABRSM 2019-20 lists it at Grade 2 (border of stages 2/3).
