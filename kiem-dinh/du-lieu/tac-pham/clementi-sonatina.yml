    luot_2_ghi_chu: "IMSLP có trang Op.36 (Work Title '6 Sonatinas'), nhiều bản thế kỷ 19 (Schirmer 1904…). Henle HN 848 Urtext theo bản in đầu 1797. Wiener Urtext: không có tập riêng Op. 36, nhưng tập Urtext Primo (Clementi – Czerny – Cramer) in trọn Op. 36 số 1 và 2 (theo bài điểm sách của Pianodao)."
