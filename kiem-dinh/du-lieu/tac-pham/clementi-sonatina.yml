  - id: n14
    cau: 'Thông tin, nhà soạn nhạc: Muzio Clementi (1752–1832), sinh ở Roma, sống và làm việc chủ yếu ở London: nghệ sĩ piano, thầy dạy, nhà soạn nhạc, nhà xuất bản và nhà sản xuất đàn piano.'
    loai: lich-su
    truong: [ thong_tin ]
    nguon: [ treccani, henle-848-vw ]
    ket_qua: dung
    ghi_chu: 'Treccani: sinh ở Roma 23/1/1752, mất 10/3/1832 (Evesham); London là nơi ông lập nghiệp làm thầy và nghệ sĩ piano; xuất bản từ 1798, xưởng làm và bán piano với Collard. Henle: dạy đàn, xuất bản, buôn và làm đàn phím.'
    luot_2: dung
    luot_2_nguon: [ "https://id.loc.gov/authorities/names/n50041431.json", "https://catalogue.bnf.fr/ark:/12148/cb138925689", "https://imslp.org/wiki/Clementi_%26_Co." ]
    luot_2_ghi_chu: "LoC: 'b. Jan. 23, 1752, Rome, d. Mar. 10, 1832, Evesham ... English composer, keyboard player and teacher, music publisher and piano manufacturer of Italian birth'; BnF: 1752 Rome – 1832, 'Compositeur et éditeur de musique'; IMSLP: hãng Clementi & Co. làm đàn, bán và xuất bản nhạc ở London."
