    ghi_chu: 'chưa chắc: IMSLP và Henle HN 848 (Urtext, theo bản in đầu 1797) đúng. Chưa tìm được ấn bản Wiener Urtext của Op. 36 (tìm theo "Wiener Urtext Clementi Sonatinen op. 36" chỉ ra Henle). Đề xuất bỏ "hoặc Wiener Urtext" nếu lượt 2 cũng không thấy; xem sua-A.yml. Review D6-L2-gom: quyết theo lượt 2 (không áp sua-A): Wiener Urtext không có tập riêng Op. 36, nhưng tập Urtext Primo 6 (Clementi – Czerny – Cramer) in trọn Op. 36 số 1 và 2 (Pianodao, review tự mở: "the ubiquitous Sonatinas Op.36 numbers 1 and 2 included in full"). Ví dụ "hoặc Wiener Urtext" vẫn đúng. Giữ.'
