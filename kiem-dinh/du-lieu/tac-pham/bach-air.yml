nhan_dinh:
  - id: n1
    cau: Tên «Air (Tổ khúc số 3)» chỉ chương 2 (Air) của Tổ khúc cho dàn nhạc số 3 cung Rê trưởng.
    loai: ten
    truong: [ ten ]
    nguon: [ imslp ]
    ket_qua: dung
    ghi_chu: IMSLP liệt kê 6 chương, chương 2 là Air. Tên ngắn không ghi «cho dàn nhạc»; số BWV 1068 xác định đúng tổ khúc.
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)", https://www.bach-digital.de/api/v1/objects/BachDigitalWork_work_00001254, https://id.loc.gov/authorities/names/n84028516.json ]
    luot_2_ghi_chu: "IMSLP (Orchestral Suite No.3 in D major, BWV 1068): 6 movements, no. 2 = 'Air'. Bach Digital record BWV 1068: 'Ouvertüre in D' / 'Overture (Orchestral suite) in D'. LoC n84028516: 'Suites, orchestra, BWV 1068, D major' (New Grove: orchestra suite [no. 3])."
  - id: n2
    cau: Tác giả là Johann Sebastian Bach.
    loai: lich-su
    truong: [ tac_gia ]
    nguon: [ imslp, breitkopf ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)", https://id.loc.gov/authorities/names/n84028516.json ]
    luot_2_ghi_chu: "IMSLP composer field: Bach, Johann Sebastian. LoC heading 'Bach, Johann Sebastian, 1685-1750'."
  - id: n3
    cau: BWV 1068 là số danh mục của Tổ khúc cho dàn nhạc số 3 cung Rê trưởng, tác phẩm chứa chương Air.
    loai: danh-muc
    truong: [ danh_muc ]
    nguon: [ imslp, breitkopf ]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)", https://www.bach-digital.de/api/v1/objects/BachDigitalWork_work_00001254, https://id.loc.gov/authorities/names/n84028516.json ]
    luot_2_ghi_chu: IMSLP Op./Cat. No. = BWV 1068 for the whole suite (D major), which contains the Air as no. 2. Bach Digital label 'BWV 1068'. LoC heading 'Suites, orchestra, BWV 1068, D major'.
  - id: n4
    cau: 'Thời kỳ: Baroque.'
    loai: lich-su
    truong: [ thoi_ky ]
    nguon: [ imslp-wt ]
    ket_qua: dung
    ghi_chu: 'IMSLP "Piece Style=Baroque".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Category:Bach,_Johann_Sebastian", "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: 'IMSLP: Bach thuộc thể loại "People from the Baroque era"; trang BWV 1068 ghi Comp. Period và Piece Style: Baroque.'
  - id: n5
    cau: 'Luyện nghe: giai điệu, bè trầm bước đều.'
    loai: cau-truc
    truong: [ luyen_nghe ]
    nguon: [ mutopia-air ]
    ket_qua: dung
    ghi_chu: 'Mutopia: giai điệu ở violin 1; continuo đi đều bằng nốt móc đơn gần như suốt 19 ô (ô 1 "d8 d'' cis cis, b b'' a a,"). Khớp hồ sơ trang nghe-nhac/bach-air n16, n17.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=242", "https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip" ]
    luot_2_ghi_chu: "Đọc bè continuo trong file LilyPond của Mutopia (Air BWV 1068, theo Bach-Gesellschaft): cả 19 ô là chuỗi móc đơn đều đặn, phần lớn nhảy quãng tám (d8 d' cis cis, …), dưới giai điệu violin 1. Câu là gợi ý luyện nghe, khớp bản nhạc."
  - id: n6
    cau: 'Hình nghe (hinh.nghe), chú thích "Air: hai nửa, mỗi nửa nhắc lại (độ dài các ô theo số ô nhịp)."; các ô: Nửa đầu (6 ô · Rê trưởng, kết ở La trưởng (giọng át) · nhắc lại); Nửa sau (12 ô · qua Si thứ, La trưởng, về Rê trưởng · nhắc lại).'
    loai: cau-truc
    truong:
      - hinh
    nguon:
      - cod-air-g
      - mutopia-air
      - imslp-1068
    ket_qua: dung
    ghi_chu: 'Vẽ lại đoạn "Điều cần biết trước khi nghe" và bảng "Theo dõi khi nghe" của trang nghe-nhac/bach-air (trang đã khóa trước đợt hình 3; mở khóa cùng nhánh): mỗi ô ứng với một nửa của chương như trang viết, chữ rút gọn từ dòng ấy; không có điều gì ngoài trang. Căn cứ: nhận định n14, n15, n18, n19, n20, n21, n22 của hồ sơ trang (đã qua lượt 1, lượt 2, review), nguồn: cod-air-g, mutopia-air, imslp-1068. Độ rộng theo số ô nhịp như trang viết (n15 của hồ sơ trang); màu là cách vẽ. Đối chiếu trên trang trong bản xem: nhận định ve-site n27 của hồ sơ trang.'
