ghi_chu: 'Thuật ngữ chromatic, nhóm Nhạc lý (Anh – Việt) (thêm ở mo/thuat-ngu, lô T3: nhạc lý: quãng, hợp âm, giọng, ký hiệu; danh sách gom từ ghi chú "thuat-ngu.yml chưa có" của các hồ sơ trang, kế hoạch mở rộng mục 5.3). Nhóm (nhom) và lời dịch tiếng Việt là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn. Nguồn đọc qua WebFetch ngày 10/11/2026.'
