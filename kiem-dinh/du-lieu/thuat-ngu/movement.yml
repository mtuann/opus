ghi_chu: 'Bản ghi dùng ở bài 4, 7 ("chương cuối", "chương 1") (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Review D3-gom (Claude, thuật ngữ, 28/10/2026): đã kiểm hồ sơ (có nhận định cho thuat_ngu và ghi_chu nếu bản ghi có), không đổi gì; lần 1 đã khóa từng phần nên không ghi nguoi.review vào lần ấy.'
