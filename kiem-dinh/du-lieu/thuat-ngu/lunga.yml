  - id: n3
    cau: "Bản in Sonatina của Bartók ghi longa (tiếng Latin, cùng nghĩa)."
    loai: ten
    truong: [ ghi_chu ]
    nguon: [ quet-3953 ]
    ket_qua: dung
    ghi_chu: "Bản quét #893630 (bản sửa, Rózsavölgyi 3953): \"longa\" ở ô 20 và hợp âm cuối chương 1, đều trên dấu ngân (hồ sơ nghe-nhac/bartok-sonatina: lượt 1, lượt 2, review cùng đọc). \"longa\" là chữ Latinh (Dolmetsch defsl1.htm: \"Longa see 'long'\", tên một trường độ cổ), không có mục riêng cho nghĩa \"ngân lâu\"; site gộp vào lunga. Review (Claude, 17/11/2026): đúng; xem bản quét IMSLP893630 tr. 3 ô 20: \"longa\" trên dấu ngân. Quyết: giữ một mục lunga, longa ở ghi chú (không tách mục: Dolmetsch không có mục longa với nghĩa ngân lâu, chỉ \"Longa (Latin, literally 'long')\" là tên trường độ cổ). Review thêm \"(tiếng Latin, cùng nghĩa)\" vào ghi chú để người đọc hiểu vì sao longa nằm ở mục lunga; nguồn: Dolmetsch defsl1 \"Longa … (Latin, literally 'long')\"."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Sonatina,_Sz.55_(Bart%C3%B3k,_B%C3%A9la)", "https://www.dolmetsch.com/defsl1.htm" ]
    luot_2_ghi_chu: "Bản quét IMSLP893630 (Rózsavölgyi 1919, bản in đầu), tr. 3, ô 20 chương 1 (ô cuối dòng 5, sau 'rit.'): phóng 400 dpi, chữ in rõ 'longa' trên dấu ngân, không phải 'lunga'. Cùng nghĩa: 'longa' là chữ Latin 'dài' (Dolmetsch: 'Longa … Latin, literally long'), 'lunga' là tiếng Ý 'dài'; đặt trên dấu ngân thì cùng ý ngân lâu."
    review: dung
