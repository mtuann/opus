# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/presto
ban_ghi: thuat-ngu/presto
lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-l5
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L5 lượt 1, thuật ngữ)
      luot_2: null
      review: null
      kiem_mau: null
    truong:
      - ghi_chu
      - nghia
      - thuat_ngu
ghi_chu: 'Thuật ngữ Presto, nhóm Tốc độ. Con số BPM khác nhau nhiều giữa các nguồn (Dolmetsch, Table of Tempo Markings: Largo 42-66, Adagio 58-97 hay "66-76 theo một số nguồn", Andante 56-88 hay "76-108 theo một số nguồn", Moderato 66-126, Allegro 84-144, Presto 100-152 hay "168-208 theo một số nguồn"); site dùng chữ "khoảng".  Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
nguon:
  - id: trinity
    bac: 2
    ten: Trinity College London, Musical terms and directions for performance (resource 785)
    link: https://trinitycollege.com/resource?id=785
  - id: dtempo
    bac: 2
    ten: Dolmetsch Online, Music Theory Online, Tempo (Table of Tempo Markings)
    link: http://www.dolmetsch.com/musictheory5.htm
nhan_dinh:
  - id: n1
    cau: "Presto: rất nhanh."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - dtempo
    ket_qua: dung
    ghi_chu: 'Trinity: "Very quick"; Dolmetsch: "very quick".'
  - id: n2
    cau: "Presto: khoảng 168-208 BPM."
    loai: so-lieu
    truong:
      - ghi_chu
    nguon:
      - dtempo
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Khoảng 168–200 BPM". Mới: "Khoảng 168–208 BPM". Lý do: Dolmetsch: "some sources suggest 168-208 bpm" (khoảng riêng của Dolmetsch 100-152; máy điện tử hiện đại 180); không nguồn bậc 1-2 đã mở ghi cận trên 200.'
