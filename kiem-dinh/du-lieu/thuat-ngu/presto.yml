ghi_chu: 'Thuật ngữ Presto, nhóm Tốc độ. Con số BPM khác nhau nhiều giữa các nguồn (Dolmetsch, Table of Tempo Markings: Largo 42-66, Adagio 58-97 hay "66-76 theo một số nguồn", Andante 56-88 hay "76-108 theo một số nguồn", Moderato 66-126, Allegro 84-144, Presto 100-152 hay "168-208 theo một số nguồn"); site dùng chữ "khoảng".  Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
nguon:
  - id: trinity
    bac: 2
    ten: Trinity College London, Musical terms and directions for performance (resource 785)
    link: https://trinitycollege.com/resource?id=785
  - id: dtempo
    bac: 2
    ten: Dolmetsch Online, Music Theory Online, Tempo (Table of Tempo Markings)
    link: http://www.dolmetsch.com/musictheory5.htm
nhan_dinh:
  - id: n1
    cau: "Presto: rất nhanh."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - dtempo
    ket_qua: dung
    ghi_chu: 'Trinity: "Very quick"; Dolmetsch: "very quick".'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsp3.htm", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/presto" ]
    luot_2_ghi_chu: "Dolmetsch: nhanh hơn allegro; Oxford: quick, very quick là prestissimo."
  - id: n2
    cau: "Presto: khoảng 168-208 BPM."
    loai: so-lieu
    truong:
      - ghi_chu
    nguon:
      - dtempo
    ket_qua: da-bo
    ghi_chu: 'Review D3-gom: bỏ con số BPM khỏi ghi_chu (cùng cách với moderato, allegro). Dolmetsch, Tempo (Table of Tempo Markings): "there is a wide variation associated with each mark"; Presto "100-152 bpm (some sources suggest 168-208 bpm)". Khoảng riêng của Dolmetsch chồng lấn nhau (Adagio 58-97 vượt cận trên 88 của Andante 56-88), nên chép khoảng của Dolmetsch dễ làm người mới hiểu sai thứ tự; khoảng cũ của site chỉ khớp một mục "some sources suggest" không nêu tên nguồn, không có nguồn bậc 1-2 riêng. Thứ tự nhanh chậm vẫn đọc từ cột Nghĩa. Lượt 1: Cũ: "Khoảng 168–200 BPM". Mới: "Khoảng 168–208 BPM". Lý do: Dolmetsch: "some sources suggest 168-208 bpm" (khoảng riêng của Dolmetsch 100-152; máy điện tử hiện đại 180); không nguồn bậc 1-2 đã mở ghi cận trên 200.'
    luot_2: khong-chac
    luot_2_ghi_chu: Các nguồn mở (Dolmetsch, Oxford) không nêu số BPM; các bảng thường gặp ghi 168-200 hoặc 168-208, lệch nhau.
