ban_ghi: thuat-ngu/minuet
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: sha256:2cbf4fd87c001c6593f895a95ae290ebb44c79839fd9a8857b7d321600e68a71
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: chủ repo, 5/5 nhận định mẫu của D3-L1 đúng (d3-l1-kiem-mau.yml)
    truong: [ ghi_chu, thuat_ngu ]
ghi_chu: "Bản ghi dùng ở bài 4 (bảng số chỉ nhịp: nhịp 3/4 thường gặp ở valse, minuet) (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: omt-ternary
    bac: 2
    ten: Open Music Theory, Ternary Form
    link: https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/
  - id: lt-minuet
    bac: 2
    ten: LibreTexts, Music Appreciation (Prince George’s Community College), 4.6.1 Minuet and Trio Form (Ternary form)
    link: https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/04%3A_The_Classical_Era_and_Instrumental_Music/4.06%3A_The_Symphony_and_String_Quartet-_Four_Movement_Cycles/4.6.01%3A_Minuet_and_Trio_Form_(Ternary_form)
nhan_dinh:
  - id: n1
    cau: "*minuet* (giữ nguyên tên) là một điệu múa; trong giao hưởng và tứ tấu đàn dây thời Cổ điển, minuet cùng trio thường là chương thứ ba."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - lt-minuet
      - omt-ternary
    ket_qua: dung
    ghi_chu: "LibreTexts, Minuet and Trio Form: \"The third movement of a 4-movement cycle like a Symphony or String Quartet is known as the \"dance\" movement. That's because a minuet and trio are both two different stylized dances\". OMT, Ternary Form: \"In many compound ternary forms (like minuet & trio or scherzo & trio in particular)…\"."
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/minuet, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scherzo, https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/, https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/, "https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music: minuet là 'Dance in triple time'; thế kỷ 18 vào giao hưởng (và các thể loại khác) 'becoming the standard 3rd movt.'; mục scherzo: người kế nhiệm minuet và trio 'generally the 3rd (or 2nd) movt. of a sym. or str. qt.'. OMT: minuet và trio là thể ba đoạn ghép (Ternary Form); Menuetto là chương 3 của Giao hưởng số 25 của Mozart, Trio là chương 3 của tứ tấu K. 80 (Binary Form). IMSLP: Giao hưởng số 40 có Menuetto ở chương 3 trong 4 chương. 'Thường' đúng; vị trí thứ hai cũng gặp."
  - id: n2
    cau: Minuet là điệu múa có ba phách mỗi ô nhịp (nhịp ba, thường viết 3/4).
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - lt-minuet
    ket_qua: dung
    ghi_chu: 'LibreTexts, Minuet and Trio Form: minuet và trio "both have 3 beats per measure (like a waltz)". Bản ghi viết "nhịp 3/4": 3/4 là cách viết thường gặp của nhịp ba phách đen; nguồn nói "3 phách mỗi ô", không nói riêng 3/4.'
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/minuet, https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music: 'Dance in triple time'. OMT, Simple Meter: Mozart 'Minuet in F major', K.2 'is in a simple triple meter' (ba phách mỗi ô nhịp)."
