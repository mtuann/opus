nhan_dinh:
  - id: n1
    cau: "*minuet* (giữ nguyên tên) là một điệu múa; trong giao hưởng và tứ tấu đàn dây thời Cổ điển, minuet cùng trio thường là chương thứ ba."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - lt-minuet
      - omt-ternary
    ket_qua: dung
    ghi_chu: "LibreTexts, Minuet and Trio Form: \"The third movement of a 4-movement cycle like a Symphony or String Quartet is known as the \"dance\" movement. That's because a minuet and trio are both two different stylized dances\". OMT, Ternary Form: \"In many compound ternary forms (like minuet & trio or scherzo & trio in particular)…\"."
  - id: n2
    cau: Minuet là điệu múa có ba phách mỗi ô nhịp (nhịp ba, thường viết 3/4).
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - lt-minuet
    ket_qua: dung
    ghi_chu: 'LibreTexts, Minuet and Trio Form: minuet và trio "both have 3 beats per measure (like a waltz)". Bản ghi viết "nhịp 3/4": 3/4 là cách viết thường gặp của nhịp ba phách đen; nguồn nói "3 phách mỗi ô", không nói riêng 3/4.'
