nhan_dinh:
  - id: n1
    cau: 'tonicization: chủ âm hóa, nhấn tạm thời một hợp âm không phải chủ bằng các hợp âm mượn từ giọng của nó.'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt1-applied
    ket_qua: dung
    ghi_chu: 'OMT 1.0: "the process of momentarily emphasizing a non-tonic chord by using chords borrowed from the key"'
    luot_2: dung
    luot_2_nguon:
      - https://openmusictheory.github.io/appliedChords.html
    luot_2_ghi_chu: 'OMT: "momentarily emphasizing a non-tonic chord ... by using chords borrowed from the key in which that chord is tonic." Lưu ý: "hợp âm mượn" trùng tên với hợp âm mượn của modal mixture; nên viết "hợp âm lấy từ giọng của nó (hợp âm át phụ/applied chords)".'
  - id: n2
    cau: 'tonicization: khác chuyển giọng ở chỗ thường không có kết ở giọng mới.'
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - omt1-applied
      - omt1-mixture
      - l2-n2
    ket_qua: da-sua
    ghi_chu: 'OMT 1.0 (Modal mixture): "Without a cadence in a new key, the non-diatonic chords are simply borrowed"; Applied chords nêu tonicization không có kết ở giọng mới Review (mo/thuat-ngu, 10/11/2026): site gọi modulation là "chuyển giọng" (thuat-ngu modulation); lượt 2: OMT 2e coi hai khái niệm là một dải liên tục, thêm "thường". Chữ câu cũ: "tonicization: khác chuyển điệu ở chỗ không có kết ở giọng mới.".'
    luot_2: dung
    luot_2_nguon:
      - https://openmusictheory.github.io/appliedChords.html
      - https://openmusictheory.github.io/Modulation.html
      - https://viva.pressbooks.pub/openmusictheory/chapter/extended-tonicization-and-modulation-to-closely-related-keys/
    luot_2_ghi_chu: 'OMT 1: "Unlike modulation, there is no cadence in a new key". OMT 2e coi đây là phổ liên tục (độ dài, độ mạnh); có thể thêm "thường".'
    review: dung
