# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/measure
ban_ghi: thuat-ngu/measure
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: "Bản ghi dùng ở bài 3, 4, 5 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: omt-simple
    bac: 2
    ten: Open Music Theory, Simple Meter and Time Signatures (Mark Gotham, Chelsey Hamm, Kris Shaffer)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/
  - id: mmt-bar
    bac: 2
    ten: MyMusicTheory (Victoria Williams), What’s the Difference Between 4/4 and C?
    link: https://mymusictheory.com/more-music-theory-topics/time-signatures-4-4-or-c/
nhan_dinh:
  - id: n1
    cau: "*measure* (ô nhịp) là một nhóm phách (hai, ba hay bốn phách), các ô nhịp ngăn nhau bằng vạch nhịp."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-simple
    ket_qua: dung
    ghi_chu: 'OMT, Simple Meter and Time Signatures: "A measure is equivalent to one group of beats (duple, triple, or quadruple). Measures are separated by bar lines."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: 'A measure is equivalent to one group of beats (duple, triple, or quadruple). Measures are separated by bar lines.' Câu theo đúng phạm vi OMT (nhóm 2, 3, 4 phách)."
  - id: n2
    cau: Ô nhịp còn gọi là *bar*, cách gọi thường dùng trong tiếng Anh–Anh.
    loai: ten
    truong:
      - ghi_chu
    nguon:
      - omt-simple
      - mmt-bar
    ket_qua: dung
    ghi_chu: 'OMT (giáo trình Mỹ): "bar lines, which separate music into measures (also called bars)". MyMusicTheory (tác giả người Anh, theo ABRSM) dùng "bar": "Music which has four beats per bar is sometimes given a 4/4 time signature".'
    luot_2: dung
    luot_2_nguon: [ https://www.oxfordlearnersdictionaries.com/definition/english/bar_1, https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "Oxford Learner's, mục bar (âm nhạc): '(British English) (North American English also measure)'. OMT: 'measures (also called bars)'."
