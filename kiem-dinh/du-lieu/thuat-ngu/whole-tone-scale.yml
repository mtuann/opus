ghi_chu: 'Bản ghi dùng ở bài 24 (hợp âm sáu Pháp: cả bốn nốt cùng thuộc một gam toàn cung), lô D3-L3. Các trường kiểm: thuat_ngu, nghia ("Gam toàn cung"; "cung" là chữ của site cho whole tone/step, như bài 5 đã khóa), ghi_chu ("6 nốt, mỗi nốt cách nhau một cung"). Tên tiếng Việt ở trường nghia và lời giải thích ở ghi_chu của bản ghi là cách viết của site (từ vựng của site cũ), nhom là cách xếp của trang Từ điển: không kiểm cách dịch từng chữ, chỉ kiểm khái niệm khớp nguồn. WebFetch ngày 28/10/2026.'
nguon:
  - id: omt-collections
    bac: 2
    ten: Open Music Theory, Collections
    link: https://viva.pressbooks.pub/openmusictheory/chapter/collections/
  - id: brit-wt
    bac: 2
    ten: Encyclopaedia Britannica, Whole-tone scale
    link: https://www.britannica.com/art/whole-tone-scale
nhan_dinh:
  - id: n1
    cau: 'whole-tone scale: Gam toàn cung (gam gồm toàn các bước cách nhau một cung, tức một bước nguyên).'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-collections
      - brit-wt
    ket_qua: dung
    ghi_chu: 'OMT, Collections (bảng thuật ngữ): "A pitch collection composed entirely of whole steps ... only two possible whole tone scales: C–D–E–F♯–G♯–A♯, or C♯–D♯–F–G–A–B". Britannica: "a scalar arrangement of pitches, each separated from the next by a whole-tone step (or whole step)". "Cung" = whole step là chữ của site (bài 5 đã khóa).'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsw1.htm" ]
    luot_2_ghi_chu: Gam 6 nốt cách nhau một cung.
  - id: n2
    cau: 'whole-tone scale: 6 nốt, mỗi nốt cách nhau một cung.'
    loai: so-lieu
    truong:
      - ghi_chu
    nguon:
      - omt-collections
      - brit-wt
    ket_qua: dung
    ghi_chu: 'OMT, Collections: "a six-note collection that is made up entirely of notes separated by whole steps"; "only two unique whole-tone collections". Britannica: "the whole-tone scale comprises six degrees per octave".'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsw1.htm" ]
    luot_2_ghi_chu: Six note scale, successive notes a whole step.
