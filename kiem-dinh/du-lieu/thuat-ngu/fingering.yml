ghi_chu: "Bản ghi dùng ở bài 6, 7 (ngón bấm gam: tay phải 1-2-3-1-2-3-4-5…) (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: baylor-ky-thuat
    bac: 2
    ten: Michael Clark, Baylor Piano Basics (giáo trình mở của Đại học Baylor, CC BY-NC-SA 4.0), 1. Fundamentals of Piano Technique, mục Finger Numbers
    link: https://openbooks.library.baylor.edu/pianobasics/chapter/fundamentals-of-piano-technique/
  - id: baylor-gam-do
    bac: 2
    ten: Michael Clark, Baylor Piano Basics, C Major Scale Hands Together
    link: https://openbooks.library.baylor.edu/pianobasics/chapter/c-major-scale-hands-together/
nhan_dinh:
  - id: n1
    cau: "*fingering* (số ngón) là các số chỉ ngón tay bấm từng nốt."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - baylor-ky-thuat
      - baylor-gam-do
    ket_qua: dung
    ghi_chu: 'Baylor Piano Basics, Fundamentals of Piano Technique: "Pianists represent each finger with a number."; C Major Scale Hands Together: "Let’s look at the right-hand and left-hand fingerings of the C major scale laid out together"; "Here is the chant laid out visually between the right-hand fingerings (above) and left-hand fingerings (below)".'
    luot_2: dung
    luot_2_nguon: [ https://dictionary.cambridge.org/dictionary/english/fingering, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/english-fingering ]
    luot_2_ghi_chu: "Cambridge: fingering là 'the numbers on a sheet of music that show which fingers should play which notes' (hoặc cách dùng ngón). Concise Oxford Dictionary of Music, mục English fingering: 'marking printed pf. mus. with the composer's or ed.'s suggested fingering'."
  - id: n2
    cau: Ngón cái là số 1 ở cả hai tay (rồi ngón trỏ 2, ngón giữa 3, ngón áp út 4, ngón út 5).
    loai: quy-tac
    truong:
      - ghi_chu
    nguon:
      - baylor-ky-thuat
    ket_qua: dung
    ghi_chu: 'Baylor Piano Basics, mục Finger Numbers: "Thumbs are 1, index fingers are 2, middle fingers are 3, ring fingers are 4, and little fingers are 5." (số nhiều: cả hai tay).'
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/english-fingering ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music, mục English fingering: hệ đại lục 'using 1 for thumb and 2 to 5 for fingers which is in general use today' (hệ Anh cũ dùng dấu × cho ngón cái, đã lỗi thời). 'Cả hai tay' là thực hành chuẩn của piano."
