    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: null
ghi_chu: 'Bản ghi dùng ở bài 8 ("chủ đề 2 trong hình thức sonata thường ở giọng át") (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định.'
nguon:
  - id: omt-sonata
    bac: 2
    ten: Open Music Theory, Sonata Form (Brian Jarvis)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/
nhan_dinh:
  - id: n1
    cau: "*sonata form* (hình thức sonata) gồm ba phần lớn: trình bày (exposition), phát triển (development), tái hiện (recapitulation)."
    loai: cau-truc
    truong:
      - thuat_ngu
      - nghia
      - ghi_chu
    nguon:
      - omt-sonata
    ket_qua: dung
    ghi_chu: 'OMT, Sonata Form: "The first reprise is called the exposition, and the second reprise contains the development and recapitulation." OMT mô tả thêm: phần trình bày có hai chủ đề ở hai giọng; với sonata giọng trưởng, chủ đề hai thường ở giọng át ("In major-key sonatas, this tends to be the dominant (V)").'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/, https://musictheory.pugetsound.edu/mt21c/SonataIntroduction.html ]
    luot_2_ghi_chu: "OMT, Sonata Form: 'The first reprise is called the exposition, and the second reprise contains the development and recapitulation' (có thể thêm introduction, coda). mt21c 25.1: 'three large sections (exposition, development, recapitulation)'."
