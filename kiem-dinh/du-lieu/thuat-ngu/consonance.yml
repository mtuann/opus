ghi_chu: 'Bản ghi dùng ở bài 9 (quãng thuận; lô D3-L2). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Tên "thuận tai" (nghịch tai ở bản ghi dissonance) là lựa chọn của site.'
nguon:
  - id: omt-intervals
    bac: 2
    ten: Open Music Theory, Intervals (cả bảng nửa cung ở Example 16, mục Consonance and Dissonance, tritone, inversion, compound intervals)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  - id: omt-counterpoint
    bac: 2
    ten: Open Music Theory, Introduction to Species Counterpoint (mục Consonances and dissonances)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/species-counterpoint/
  - id: fff-intervals
    bac: 2
    ten: Andre Mount, Fundamentals, Function, and Form (Milne Publishing, SUNY Geneseo, giáo trình mở), 11. Intervals (cả Table 11-2)
    link: https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/11-intervals/
nhan_dinh:
  - id: n1
    cau: "*consonance* (thuận tai) là tính chất của quãng (hay âm) nghe ổn định, như không cần được giải quyết."
    loai: dinh-nghia
    nguon:
      - omt-intervals
      - fff-intervals
    truong:
      - thuat_ngu
      - nghia
    ket_qua: dung
    ghi_chu: 'OMT, Intervals: "Consonant intervals are intervals that are considered more stable, as if they do not need to resolve", và "These categorizations have varied with milieu." Mount 11: "Pitches that sound stable and harmonious together are said to be consonant"; các thuật ngữ này tương đối và chủ quan. OMT, Species Counterpoint xếp quãng thuận hoàn toàn (1, 5, 8 đúng) và không hoàn toàn (3, 6).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "OMT: cảm nhận ổn định của quãng/hợp âm."
