# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/semitone
ban_ghi: thuat-ngu/semitone
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: "Bản ghi dùng ở bài 5 (định nghĩa), 6, 7, 8 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: omt-steps
    bac: 2
    ten: Open Music Theory, Half Steps, Whole Steps, and Accidentals (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  - id: mmt-semitones
    bac: 2
    ten: MyMusicTheory (Victoria Williams), Can I Count Semitones (half steps) to Work out Musical Intervals?
    link: https://mymusictheory.com/interval-numbers/intervals-can-i-count-semitones/
nhan_dinh:
  - id: n1
    cau: "*semitone* (nửa cung) là quãng nhỏ nhất trong âm nhạc phương Tây; trên piano là từ một phím sang phím liền kề (tính cả phím đen)."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-steps
      - mmt-semitones
    ket_qua: dung
    ghi_chu: 'OMT, Half Steps, Whole Steps, and Accidentals: "A half step is considered to be the smallest interval, or distance between two notes, in Western musical notation."; "A half step above a key on the piano is the key to its immediate right". MyMusicTheory: "Semitones (half steps)" (cùng một khái niệm, hai cách gọi).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/semitone ]
    luot_2_ghi_chu: "OMT, Half Steps…: half step 'generally considered to be the smallest interval in Western musical notation'. Concise Oxford Dictionary of Music, mục semitone: 'Smallest interval in European mus. On pf., interval between any note and the next, up or down.' OMT có rào 'thường được coi là', có thể thêm 'thường'."
  - id: n2
    cau: Tiếng Anh–Mỹ gọi nửa cung là *half step*.
    loai: ten
    truong:
      - ghi_chu
    nguon:
      - omt-steps
      - mmt-semitones
    ket_qua: dung
    ghi_chu: OMT (giáo trình Mỹ) gọi là "half step"; MyMusicTheory (tiếng Anh–Anh, theo ABRSM) gọi là "semitone" và ghi kèm "(half steps)".
    luot_2: dung
    luot_2_nguon: [ https://dictionary.cambridge.org/dictionary/english/semitone, https://www.oxfordlearnersdictionaries.com/definition/english/semitone ]
    luot_2_ghi_chu: "Cambridge: semitone '(US usually half step)'. Oxford Learner's: '(British English) (North American English half step, halftone)'. OMT dùng 'half step'."
