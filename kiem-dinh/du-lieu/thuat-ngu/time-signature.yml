    ghi_chu: 'OMT, Simple Meter and Time Signatures: "Time signatures in simple meters express two things: how many beats are contained in each measure (the top number), and the beat unit (the bottom number), which refers to the note value that is the beat." Nhịp kép (6/8…) đọc khác: xem nhận định của bài 4.'
