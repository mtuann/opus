ghi_chu: Thuật ngữ con sordino, nhóm Cách diễn tấu. Phần "Trên piano, xem mục Piano bên dưới" chỉ đường trong bảng, không là nhận định. Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).
nguon:
  - id: trinity
    bac: 2
    ten: Trinity College London, Musical terms and directions for performance (resource 785)
    link: https://trinitycollege.com/resource?id=785
  - id: codsord
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục sordino, qua Encyclopedia.com
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino
  - id: codmute
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục mute, qua Encyclopedia.com
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mute
nhan_dinh:
  - id: n1
    cau: "con sordino: dùng câm tiếng (mute)."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - codsord
    ket_qua: dung
    ghi_chu: 'Trinity: "Con sordini: With mutes"; COD: "con sordini, with mutes, means put the mutes on". Chữ Việt "câm tiếng" là lựa chọn của site.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/con-sordino", "https://trinitycollege.com/resource?id=785" ]
    luot_2_ghi_chu: With mute.
  - id: n2
    cau: "con sordino: với đàn dây và kèn; âm thanh nhỏ hơn."
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - codmute
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Với đàn dây và kèn; âm thanh mờ, nhỏ". Mới: "Với đàn dây và kèn; âm thanh nhỏ hơn". Lý do: COD, mục mute: "A mechanical device used to reduce the tonal vol. of an instr."; dây: kẹp đặt lên ngựa đàn; kèn: nút hình quả lê đặt vào loa kèn; "mờ" không có trong nguồn đã mở.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino" ]
    luot_2_ghi_chu: Nguồn chỉ nói "mute cho nhạc cụ"; không nêu rõ đàn dây và kèn.
