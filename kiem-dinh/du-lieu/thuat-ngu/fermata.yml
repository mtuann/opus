- id: n2
  cau: "fermata: vòng cung có chấm, đặt trên hoặc dưới nốt hay dấu lặng."
  loai: dinh-nghia
  truong:
  - ghi_chu
  nguon:
  - cod-fermata
  - dol-tempo
  - dol-sym
  ket_qua: da-sua
  ghi_chu: 'Cũ: "Hình con mắt". Mới: "Vòng cung có chấm, đặt trên hoặc dưới nốt hay dấu lặng". Lý do: Dolmetsch (Tempo): "a semicircle containing a dot which may lie above or below a note or rest or over a barline"; Dolmetsch, Chart of Musical Symbols: "a musical symbol placed over a note or rest to be extended beyond its normal duration"; "hình con mắt" là cách ví của site, không nguồn nào dùng; trang 14 đã viết "Vòng cung có chấm".'
