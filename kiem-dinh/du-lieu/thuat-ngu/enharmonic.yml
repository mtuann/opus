ghi_chu: 'Thuật ngữ enharmonic, nhóm Nhạc lý (Anh – Việt). Bản ghi mới (D3-L5). OMT Glossary chỉ có mục "enharmonic equivalence" (không có "enharmonic" riêng): dùng định nghĩa ấy. Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
nguon:
  - id: omthalf
    bac: 2
    ten: Open Music Theory, Half Steps, Whole Steps, and Accidentals (mục enharmonic equivalence)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  - id: omtgloss
    bac: 2
    ten: Open Music Theory, Glossary
    link: https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/
nhan_dinh:
  - id: n1
    cau: "enharmonic: đồng âm khác tên, hai nốt viết khác nhau nhưng nghe giống nhau."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omthalf
      - omtgloss
    ket_qua: dung
    ghi_chu: 'OMT: "Notes have enharmonic equivalence when they are spelled differently but sound the same." (ví dụ D, C𝄪, E𝄫); Glossary: "A relationship between notes, intervals, or chords that sound the same but are spelled differently."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: Cùng âm khác tên.
  - id: n2
    cau: C♯ và D♭ là một cặp đồng âm khác tên.
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - omthalf
    ket_qua: dung
    ghi_chu: Theo định nghĩa OMT (cùng cao độ, viết khác); OMT dùng ví dụ D / C𝄪 / E𝄫, cặp C♯ / D♭ cùng loại.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: C♯ và D♭ nghe giống nhau, viết khác nhau (đúng định nghĩa).
