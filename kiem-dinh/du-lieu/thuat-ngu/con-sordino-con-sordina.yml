nhan_dinh:
  - id: n1
    cau: "con sordino, con sordina ở một số nhà soạn nhạc về sau (như Scriabin): dùng bàn đạp trái una corda."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - henleblog
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Ở nhiều nhà soạn nhạc về sau (Debussy, Ravel…): dùng bàn đạp trái *una corda*". Mới: "Ở một số nhà soạn nhạc về sau (như Scriabin): dùng bàn đạp trái *una corda*". Lý do: Henle Blog: ở Sonata số 1 của Scriabin cả "una corda" và "con sord." cùng chỉ bàn đạp trái ("a damped, dry sound", Michael Schäfer); không nguồn bậc 1-2 đã mở nêu Debussy hay Ravel.'
    luot_2: dung
    luot_2_nguon: [ "https://blog.henle.de/en/2013/06/24/una-corda-–-con-sord-–-mit-verschiebung-how-do-i-‘mute’-my-piano" ]
    luot_2_ghi_chu: "Henle: con sord. là một cách ghi bàn đạp trái, Scriabin dùng cả una corda và con sord., nhiều khả năng cùng hiệu quả (tác giả còn cân nhắc nghĩa khác)."
  - id: n2
    cau: "Cùng chữ sordino: ở Beethoven là bộ giảm âm, về sau là una corda."
    loai: lich-su
    truong:
      - ghi_chu
    nguon:
      - henleblog
      - codsord
    ket_qua: dung
    ghi_chu: 'Henle Blog: Beethoven "senza sordino" = bàn đạp phải nhấc giảm âm; Scriabin "con sord." = bàn đạp trái. COD: sordini trên piano là bộ giảm âm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino", "https://blog.henle.de/en/2013/06/24/una-corda-–-con-sord-–-mit-verschiebung-how-do-i-‘mute’-my-piano" ]
    luot_2_ghi_chu: "Oxford: sordini trên piano là bộ giảm âm; Henle: senza sordino của Beethoven là nhấc giảm âm (bàn đạp phải)."
