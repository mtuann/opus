ghi_chu: 'Thuật ngữ con sordino, con sordina, nhóm Piano. Henle Blog không nhắc Debussy hay Ravel: nêu Scriabin (Sonata số 1: "una corda" và "con sord."). Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
