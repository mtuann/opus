      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: "Bản ghi dùng ở bài 2 (định nghĩa khuông nhạc), 8 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: omt-notation
    bac: 2
    ten: Open Music Theory, Notation of Notes, Clefs, and Ledger Lines (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
  - id: mmt-staff
    bac: 2
    ten: MyMusicTheory (Victoria Williams; bài theo các cấp lý thuyết ABRSM, Trinity, tiếng Anh–Anh), Pitch – The Treble Clef
    link: https://mymusictheory.com/pitch/pitch-the-treble-clef/
nhan_dinh:
  - id: n1
    cau: "*staff* (khuông nhạc) gồm năm dòng kẻ ngang cách đều; mỗi nốt đặt trên dòng hay trong khe ứng với cao độ của nó."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT, Notation of Notes, mục Staff Notation: "A staff (plural “staves”) is essential for conveying pitch. A staff consists of five horizontal lines, evenly spaced, and each note is placed on the line or space that corresponds to its pitch." Khớp bài 2 ("5 dòng kẻ song song và 4 khe").'
  - id: n2
    cau: Tiếng Anh–Anh gọi khuông nhạc là *stave*.
    loai: ten
    truong:
      - ghi_chu
    nguon:
      - mmt-staff
      - omt-notation
    ket_qua: dung
    ghi_chu: 'MyMusicTheory (tác giả người Anh, bài theo ABRSM): "The music staff, or stave, is made up of 5 horizontal lines". OMT (giáo trình Mỹ) dùng "staff", số nhiều "staves".'
