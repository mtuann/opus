ghi_chu: "Thuật ngữ non legato, nhóm Piano. Nguồn cho non legato mỏng: Trinity và COD (mục legato) không có mục non legato; chỉ BYU Organ Tutor (giáo trình đại học dạy organ) định nghĩa. Dolmetsch (Phrasing) nói về nhạc thế kỷ 18 chơi tách hơn. Nên tìm thêm một nguồn bậc 2 đợt sau. Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5)."
nguon:
  - id: byunl
    bac: 2
    ten: BYU Organ Tutor (giáo trình đại học), Non-Legato Touch
    link: https://organ.byu.edu/organtutor/general_concepts/touch/non-legato/page1.htm
  - id: dart
    bac: 2
    ten: Dolmetsch Online, Music Theory Online, Phrasing & Articulation
    link: https://www.dolmetsch.com/musictheory21.htm
nhan_dinh:
  - id: n1
    cau: "non legato: không liền, hơi tách."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - byunl
      - dart
    ket_qua: dung
    ghi_chu: 'BYU Organ Tutor: "non-legato means to be played with a perceptible interruption". "Hơi tách" khớp ý. Chưa chắc nhẹ: chỉ một nguồn đọc được.'
    luot_2: dung
    luot_2_nguon: [ "https://organ.byu.edu/organtutor/general_concepts/touch/non-legato/page1.htm" ]
    luot_2_ghi_chu: Chơi có ngắt cảm nhận được.
  - id: n2
    cau: Nhạc thế kỷ 18 thường được chơi tách hơn nhạc Lãng mạn muộn.
    loai: lich-su
    truong:
      - ghi_chu
    nguon:
      - dart
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Cách chơi thường dùng cho nhạc Baroque trên piano". Mới: "Nhạc thế kỷ 18 thường được chơi tách hơn nhạc Lãng mạn muộn". Lý do: Dolmetsch, Phrasing & Articulation: "music then was played in a more detached manner than we associate, say, with the repertoire of the late-Romantic" (nói thế kỷ 18, không nói riêng Baroque hay piano).'
    luot_2: khong-chac
    luot_2_ghi_chu: Không nguồn đã mở so sánh cách chơi thế kỷ 18 với Lãng mạn muộn.
