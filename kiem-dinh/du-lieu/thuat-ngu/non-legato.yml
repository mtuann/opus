ban_ghi: thuat-ngu/non-legato
lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-l5
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L5 lượt 1, thuật ngữ)
      luot_2: null
