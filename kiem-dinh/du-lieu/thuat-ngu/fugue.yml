ghi_chu: 'Bản ghi dùng ở bài 22 (đối âm là ngôn ngữ của nhạc Phục hưng và của fugue, link tới trang Fugue) và bài 23 (quãng 3 Picardy "đã gặp ở Fugue"), lô D3-L3. Các trường kiểm: thuat_ngu, nghia ("Fugue", giữ nguyên chữ Anh), ghi_chu ("Chủ đề lần lượt vào ở các bè"). Tên tiếng Việt ở trường nghia và lời giải thích ở ghi_chu của bản ghi là cách viết của site (từ vựng của site cũ), nhom là cách xếp của trang Từ điển: không kiểm cách dịch từng chữ, chỉ kiểm khái niệm khớp nguồn. WebFetch ngày 28/10/2026.'
nguon:
  - id: omt-fugal
    bac: 2
    ten: Open Music Theory, High Baroque Fugal Exposition
    link: https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/
  - id: cod-fugue
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục fugue, qua Encyclopedia.com
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/fugue
  - id: brit-fugue
    bac: 2
    ten: Encyclopaedia Britannica, Fugue
    link: https://www.britannica.com/art/fugue
nhan_dinh:
  - id: n1
    cau: 'fugue: Fugue (một hình thức nhạc đối âm, nhiều bè độc lập).'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-fugal
      - brit-fugue
      - cod-fugue
    ket_qua: dung
    ghi_chu: 'OMT: fugue là "contrapuntal compositions that are defined by the strict use of a certain number of independent voices". Britannica: "a compositional procedure characterized by the systematic imitation of a principal theme (called the subject)" trong các đường giai điệu cùng vang (đối âm). "Fugue" giữ nguyên chữ Anh: lựa chọn của site.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/fugue" ]
    luot_2_ghi_chu: Đối vị, các bè vào lần lượt.
  - id: n2
    cau: 'fugue: chủ đề lần lượt vào ở các bè.'
    loai: cau-truc
    truong:
      - ghi_chu
    nguon:
      - omt-fugal
      - cod-fugue
    ket_qua: dung
    ghi_chu: 'OMT: mỗi bè vào "one by one", nêu chủ đề; phần trình bày fugue (fugal exposition) là "The first part of a fugue, in which each voice states the subject or answer". COD: "the vv. enter successively in imitation of each other, the 1st v. entering with a short melody or phrase known as the subject" (vv. = voices).'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/fugue" ]
    luot_2_ghi_chu: Chủ đề (subject) vào lần lượt ở các bè.
