    ket_qua: da-sua
    ghi_chu: 'Review D3-gom: đồng ý chỗ sửa (lượt 2 dung). Cũ: "Một giai điệu chính với bè đệm". Mới: "Một giai điệu chính với bè đệm, hay các bè cùng tiết tấu". Lý do: OMT, Texture: homophony "sometimes further divided into two subcategories, homorhythm and melody and accompaniment"; melody and accompaniment: giai điệu rõ rệt cùng các bè nâng đỡ; homorhythm: "all voices move in an extremely similar or completely unison rhythm", "most often seen in chorale-like compositions"; Glossary: homophony = "one melodic part (usually the topmost) and other subordinate accompanying parts"; homorhythm = "Rhythmic unison among multiple parts".'
