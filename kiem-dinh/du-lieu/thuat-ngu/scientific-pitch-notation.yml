nhan_dinh:
  - id: n1
    cau: 'scientific pitch notation: ký hiệu cao độ khoa học: tên nốt kèm số quãng tám (C4).'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-aspn
      - omt-glossary
      - l2-n1
    ket_qua: da-sua
    ghi_chu: 'OMT, Glossary (ASPN): "combining a note name (such as C) with an octave designation (such as 4)". Chữ cũ (gợi ý): "ký hiệu khoa học" Chữ câu cũ: "scientific pitch notation: ký hiệu cao độ bằng tên nốt kèm số quãng tám.".'
    luot_2: dung
    luot_2_nguon:
      - https://viva.pressbooks.pub/openmusictheory/chapter/aspn/
    luot_2_ghi_chu: 'OMT: "a note name (such as C) with a subscript octave designation (such as 4)."'
  - id: n2
    cau: 'scientific pitch notation: open Music Theory gọi là ASPN; số quãng tám đổi ở nốt Đô.'
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - dolmetsch-pitch-notation
      - omt-aspn
      - l2-n2
    ket_qua: da-sua
    ghi_chu: 'Dolmetsch: "Scientific Pitch Notation, Note-Octave Notation or American Standard Pitch Notation"; OMT: "each new octave designation begins on the note C" Review (mo/thuat-ngu, 10/11/2026): lượt 2: không nguồn bậc 1–2 đồng nhất hai tên; OMT dùng ASPN và "each new octave designation begins on the note C". Chữ câu cũ: "scientific pitch notation: còn gọi là ASPN; số quãng tám đổi ở nốt Đô.".'
    luot_2: khong-chac
    luot_2_nguon:
      - https://viva.pressbooks.pub/openmusictheory/chapter/aspn/
      - https://pressbooks.nebraska.edu/openmusictheory/chapter/aspn
    luot_2_ghi_chu: 'OMT: "each new octave designation begins on the note C" (vế này đúng). Không nguồn bậc 1-2 nào đọc được nói SPN "còn gọi" ASPN. Đề xuất: "giáo trình Mỹ (vd. Open Music Theory) gọi hệ này là ASPN; số quãng tám đổi ở nốt Đô."'
    review: dung
