nhan_dinh:
  - id: n1
    cau: "una corda: dùng bàn đạp trái (làm tiếng nhỏ hơn và đổi màu âm)."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - cod-una-corda
      - brit-soft
    ket_qua: da-sua
    ghi_chu: "Cũ: \"Dùng bàn đạp trái (làm tiếng nhỏ và mờ hơn)\". Mới: \"Dùng bàn đạp trái (làm tiếng nhỏ hơn và đổi màu âm)\". Lý do: Trinity: una corda = left pedal; COD: soft pedal; Britannica, Soft pedal: bàn đạp \"shifts the piano's action sideways so that the hammers strike only one of the two strings for each note\", cho \"a softer tone and a different tonal color\". \"Mờ\" không có trong nguồn; \"đổi màu âm\" là điều Britannica nói."
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsu1.htm", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano" ]
    luot_2_ghi_chu: "Dolmetsch: soft pedal; Encyclopedia: soft pedal làm giảm tiếng (bỏ bớt dây)."
  - id: n2
    cau: 'Nghĩa đen: "một dây"'
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - cod-una-corda
    ket_qua: dung
    ghi_chu: una corda = "one string".
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsu1.htm" ]
    luot_2_ghi_chu: Literally one string.
