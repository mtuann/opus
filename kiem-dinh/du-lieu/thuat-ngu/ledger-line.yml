    ma_bam: sha256:96147ae6fcb66b4fef5bc3eb702ab90369983867fd38af87196299259c661458
    nguoi:
      luot_1: "không có nhận định mới: khóa thêm nghia, nhom (lựa chọn của site, ghi ở ghi_chu hồ sơ); nhận định của lần 1 vẫn đúng (review D3-gom)"
      luot_2: không cần (không có nhận định mới)
      review: Claude (review D3-gom, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: "Bản ghi dùng ở bài 2 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Review D3-gom (Claude, thuật ngữ, 28/10/2026): đã kiểm hồ sơ (có nhận định cho thuat_ngu và ghi_chu nếu bản ghi có), không đổi gì; lần 1 đã khóa từng phần nên không ghi nguoi.review vào lần ấy."
nguon:
  - id: omt-notation
    bac: 2
    ten: Open Music Theory, Notation of Notes, Clefs, and Ledger Lines (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
nhan_dinh:
  - id: n1
    cau: "*ledger line* (dòng kẻ phụ) là đoạn dòng ngắn vẽ thêm khi nốt cao hơn hay thấp hơn khuông, để nối dài khuông."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT, Notation of Notes: "When notes are too high or low to be written on a staff, small lines called ledger lines are drawn to extend the staff."; "Extra lines (that are small) called ledger lines extend a staff higher or lower."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "OMT: 'small lines called ledger lines are drawn to extend the staff' khi nốt quá cao hoặc quá thấp."
