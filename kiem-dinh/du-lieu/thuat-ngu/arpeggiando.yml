nguon:
  - id: dsym
    bac: 2
    ten: Dolmetsch Online, Chart of Musical Symbols
    link: https://www.dolmetsch.com/musicalsymbols.htm
  - id: omtgloss
    bac: 2
    ten: Open Music Theory, Glossary
