nhan_dinh:
  - id: n1
    cau: "arpeggiando: rải hợp âm."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - dsym
      - omtgloss
    ket_qua: dung
    ghi_chu: 'Dolmetsch: arpeggio = "a spread chord played from the top down or from the bottom up"; OMT: arpeggio = "each note of a triadic harmony played in succession". Dạng "arpeggiando" không có mục riêng trong nguồn đã mở.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musicalsymbols.htm" ]
    luot_2_ghi_chu: "Arpeggio: hợp âm rải."
  - id: n2
    cau: Ký hiệu rải hợp âm là đường lượn sóng dọc trước hợp âm.
    loai: quy-tac
    truong:
      - ghi_chu
    nguon:
      - dsym
    ket_qua: dung
    ghi_chu: 'Dolmetsch: "indicated by a vertical wavy line".'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musicalsymbols.htm" ]
    luot_2_ghi_chu: "Dolmetsch: ký hiệu là đường lượn sóng dọc."
