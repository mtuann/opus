# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/symphony
ban_ghi: thuat-ngu/symphony
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: null
ghi_chu: "Bản ghi dùng ở bài 4, 7 (giao hưởng của Beethoven, Mozart) (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: lt-symphony
    bac: 2
    ten: "LibreTexts, Music Appreciation: A Topical Approach to Music Genre and Style (Prince George’s Community College), 4.6 The Symphony and String Quartet: Four Movement Cycles (giáo trình mở)"
    link: https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/04%3A_The_Classical_Era_and_Instrumental_Music/4.06%3A_The_Symphony_and_String_Quartet-_Four_Movement_Cycles
nhan_dinh:
  - id: n1
    cau: "*symphony* (giao hưởng) là tác phẩm nhiều chương cho dàn nhạc."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - lt-symphony
    ket_qua: dung
    ghi_chu: 'LibreTexts, The Symphony and String Quartet: "The Symphony is a 4-movement work (also called a 4-movement cycle) for an orchestra".'
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphony ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music: 'a large-scale orch. comp. (usually in 4 movts. but often in 1, 3, or 5, occasionally in 2)'. 'Nhiều chương' đúng với đa số, có ngoại lệ một chương."
  - id: n2
    cau: Giao hưởng (thời Cổ điển) thường có bốn chương.
    loai: so-lieu
    truong:
      - ghi_chu
    nguon:
      - lt-symphony
    ket_qua: dung
    ghi_chu: 'LibreTexts: "The Symphony is a 4-movement work (also called a 4-movement cycle) for an orchestra"; "composers essentially modeled their 4-movement work in similar formats". Nguồn nói về thời Cổ điển; bản ghi viết "thường 4 chương", không nói mọi giao hưởng (có giao hưởng 3 hay 5 chương), nên đúng với chữ "thường".'
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphony, "https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)", "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music: giao hưởng 'usually in 4 movts.'; chương của giao hưởng Cổ điển 'usually an opening allegro, followed by a slow movt., then a minuet or scherzo, finally another allegro or rondo'. IMSLP: Mozart K.550 và Beethoven Op.67 đều 4 chương."
