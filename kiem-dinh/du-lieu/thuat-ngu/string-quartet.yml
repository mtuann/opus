ghi_chu: Thuật ngữ string quartet, nhóm Hình thức và thể loại. Nhóm ("nhom") và lời dịch tiếng Việt ("nghia") là lựa chọn của site; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Dùng ở bài 20 (tứ tấu của Haydn). Ghi chú "2 violin, viola, cello" của site khớp nguồn. OMT Glossary không có mục này (đã tra). Oxford chỉ cho trích dẫn ngắn nên câu định nghĩa dưới đây lấy từ phần mở đầu. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026.
