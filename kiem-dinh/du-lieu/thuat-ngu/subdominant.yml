# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/subdominant
ban_ghi: thuat-ngu/subdominant
lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-gom
    ma_bam: sha256:32b0c46fabc656b64bb6840365e2abf0e51e2eefd95f85582a4eaf113c7b675b
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L2 lượt 1, phần 1/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, thuật ngữ, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
    truong:
      - ghi_chu
      - thuat_ngu
ghi_chu: 'Bản ghi dùng ở bài 6 (bảng tên bậc; lô D3-L1), bài 12 (lô D3-L2: hạ át là tên chức năng, bậc IV là tên bậc). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Chú ý: bài 12 gọi chức năng là "Hạ át (Predominant / tiền át, PD)"; "Hạ át âm" (bậc IV) và "Hạ át" (chức năng của IV và ii) là hai khái niệm khác nhau, D3-L5 cân nhắc thêm bản ghi predominant. D3-L5 (28/10/2026): ghi_chu viết lại để phân biệt hạ át âm (bậc IV) và hạ át (chức năng) theo quyết định thuật ngữ 27/10/2026; thêm nhận định n2.'
nguon:
  - id: omt-minor
    bac: 2
    ten: Open Music Theory, Minor Scales, Scale Degrees, and Key Signatures (gam thứ hòa âm, tên các bậc)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  - id: mt21c-function
    bac: 2
    ten: Robert Hutchinson, Music Theory for the 21st-Century Classroom (giáo trình mở, University of Puget Sound), 9.4 Harmonic Function
    link: https://musictheory.pugetsound.edu/mt21c/HarmonicFunction.html
  - id: omt-gloss
    bac: 2
    ten: Open Music Theory, Glossary (mục subdominant)
    link: https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/
nhan_dinh:
  - id: n1
    cau: "*subdominant* (hạ át âm) là bậc IV của gam."
    loai: dinh-nghia
    nguon:
      - omt-minor
      - mt21c-function
    truong:
      - thuat_ngu
      - nghia
      - ghi_chu
    ket_qua: dung
    ghi_chu: 'OMT, Minor Scales: tên các bậc "Tonic (1̂, do), Supertonic (2̂, re), Mediant (3̂, me), Subdominant (4̂, fa), Dominant (5̂, sol) ..."; "the subdominant is a fifth below" (nốt thấp hơn chủ âm một quãng 5). MT21C 9.4: "subdominant" chỉ là tên bậc IV ("containing the subdominant"), còn chức năng của IV và ii là pre-dominant. Site đánh số bậc bằng số La Mã (IV); OMT dùng số có dấu mũ (4̂): cùng một bậc.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/subdominant" ]
    luot_2_ghi_chu: Bậc IV của gam.
  - id: n2
    cau: '"Hạ át âm" (subdominant) là bậc IV (bậc 4) của gam; "hạ át" (không có chữ "âm") là tên chức năng của IV và ii (predominant).'
    loai: ten
    truong:
      - ghi_chu
    nguon:
      - omt-minor
      - mt21c-function
      - omt-gloss
    ket_qua: da-sua
    ghi_chu: 'Review D3-gom: đồng ý chỗ sửa (lượt 2 dung). Cũ (ghi_chu): "Bậc IV". Mới: "Bậc IV (bậc 4) của gam. "Hạ át" (không có chữ "âm") là tên chức năng của IV và ii: xem predominant". Lý do: quyết định thuật ngữ 27/10/2026 (README): "hạ át âm" chỉ bậc IV, "hạ át" là tên chức năng. OMT, Minor Scales: Subdominant (4̂); MT21C 9.4: subdominant là tên bậc 4, chức năng của IV và ii là pre-dominant; OMT Glossary lại gọi subdominant là "A harmonic function that may either lead toward a dominant-function chord or back to a tonic-function chord". Bản ghi mới predominant (D3-L5) có hồ sơ riêng. n1 vẫn đúng cho thuat_ngu và nghia; ghi_chu của n1 đã được n2 thay.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/subdominant", "https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/" ]
    luot_2_ghi_chu: Subdominant là bậc 4; PD gồm IV, ii.
