# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/subdominant
ban_ghi: thuat-ngu/subdominant
lan:
  - so: 1
    ngay: 2026-10-27
    nhanh: moi/d3-l2
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L2 lượt 1, phần 1/2)
      luot_2: null
      review: null
      kiem_mau: null
    truong:
      - ghi_chu
      - thuat_ngu
ghi_chu: 'Bản ghi dùng ở bài 6 (bảng tên bậc; lô D3-L1), bài 12 (lô D3-L2: hạ át là tên chức năng, bậc IV là tên bậc). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Chú ý: bài 12 gọi chức năng là "Hạ át (Predominant / tiền át, PD)"; "Hạ át âm" (bậc IV) và "Hạ át" (chức năng của IV và ii) là hai khái niệm khác nhau, D3-L5 cân nhắc thêm bản ghi predominant.'
nguon:
  - id: omt-minor
    bac: 2
    ten: Open Music Theory, Minor Scales, Scale Degrees, and Key Signatures (gam thứ hòa âm, tên các bậc)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  - id: mt21c-function
    bac: 2
    ten: Robert Hutchinson, Music Theory for the 21st-Century Classroom (giáo trình mở, University of Puget Sound), 9.4 Harmonic Function
    link: https://musictheory.pugetsound.edu/mt21c/HarmonicFunction.html
nhan_dinh:
  - id: n1
    cau: "*subdominant* (hạ át âm) là bậc IV của gam."
    loai: dinh-nghia
    nguon:
      - omt-minor
      - mt21c-function
    truong:
      - thuat_ngu
      - nghia
      - ghi_chu
    ket_qua: dung
    ghi_chu: 'OMT, Minor Scales: tên các bậc "Tonic (1̂, do), Supertonic (2̂, re), Mediant (3̂, me), Subdominant (4̂, fa), Dominant (5̂, sol) ..."; "the subdominant is a fifth below" (nốt thấp hơn chủ âm một quãng 5). MT21C 9.4: "subdominant" chỉ là tên bậc IV ("containing the subdominant"), còn chức năng của IV và ii là pre-dominant. Site đánh số bậc bằng số La Mã (IV); OMT dùng số có dấu mũ (4̂): cùng một bậc.'
