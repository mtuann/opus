ghi_chu: 'Thuật ngữ simple meter, nhóm Nhạc lý (Anh – Việt). Bản ghi mới (D3-L5), theo quyết định thuật ngữ 27/10/2026 (README, mục Quyết định): nhịp đơn, nhịp kép theo OMT, như bài 4. OMT Glossary tự mâu thuẫn (ghi 4/4 là "compound quadruple", 3/4 là "compound triple"); thân chương Simple Meter nói 4/4 là simple quadruple: theo thân chương. Vì vậy ghi_chu của site chỉ nêu 2/4 và 4/4. Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
