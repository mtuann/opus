# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/clef
ban_ghi: thuat-ngu/clef
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: sha256:abd1a2d27d218bc487b1a055a270a0125aa9105bc0c3811f6a257c737b775f25
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: chủ repo, 5/5 nhận định mẫu của D3-L1 đúng (d3-l1-kiem-mau.yml)
    truong: [ ghi_chu, thuat_ngu ]
ghi_chu: "Bản ghi dùng ở bài 2 (khóa Sol, khóa Fa) (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Review D3-gom (Claude, thuật ngữ, 28/10/2026): đã kiểm hồ sơ (có nhận định cho thuat_ngu và ghi_chu nếu bản ghi có), không đổi gì; lần 1 đã khóa từng phần nên không ghi nguoi.review vào lần ấy."
nguon:
  - id: omt-notation
    bac: 2
    ten: Open Music Theory, Notation of Notes, Clefs, and Ledger Lines (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
  - id: omt-clefs
    bac: 2
    ten: Open Music Theory, Reading Clefs (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
nhan_dinh:
  - id: n1
    cau: "*clef* (khóa nhạc) là ký hiệu ở đầu khuông cho biết các dòng và khe của khuông ứng với cao độ nào."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT, Notation of Notes: "A clef indicates which pitches are assigned to the lines and spaces on a staff."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "OMT: 'A clef indicates which pitches are assigned to the lines and spaces on a staff.'"
  - id: n2
    cau: "*treble clef* là khóa Sol (ôm lấy dòng Sol, dòng thứ hai từ dưới lên); *bass clef* là khóa Fa (chấm của nó bắt đầu ở dòng Fa, dòng thứ hai từ trên xuống)."
    loai: ten
    truong:
      - ghi_chu
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'OMT, Reading Clefs: "the treble clef wraps around the G line (the second line from the bottom). For this reason, it is sometimes called the “G clef.”"; "The bass clef is sometimes called the “F clef”; as seen in Example 6, the dot of the bass clef begins on the F line (the second line from the top)." Khớp bài 2 (khóa Sol ở dòng 2, khóa Fa ở dòng 4).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "OMT, Reading Clefs: khóa Sol 'wraps around the G line (the second line from the bottom)'; khóa Fa 'the dot of the bass clef begins on the F line (the second line from the top)'. Tên khóa Sol, khóa Fa là cách gọi của site."
