nhan_dinh:
  - id: n1
    cau: 'rubato: Co giãn tốc độ tự do để diễn cảm'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - cod-rubato
    ket_qua: dung
    ghi_chu: 'Trinity: rubato "flexible in time"; COD: tempo bent. Mục đích "để diễn cảm" là cách nói thường gặp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rubato" ]
    luot_2_ghi_chu: "Concise Oxford: strict time disregarded for a while."
  - id: n2
    cau: 'rubato: nghĩa đen "thời gian bị lấy"; lấy ở nốt này, trả lại ở nốt khác.'
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - cod-rubato
      - trinity
    ket_qua: da-sua
    ghi_chu: 'Review D3-gom: đồng ý chỗ sửa (lượt 2 dung). Cũ: "Đặc trưng khi chơi Chopin". Mới: "Nghĩa đen: "thời gian bị lấy"; lấy ở nốt này, trả lại ở nốt khác". Lý do: COD: "The question of rubato in Chopin is particularly contentious" (cách dùng ở Chopin còn tranh cãi), không nguồn nào gọi rubato là "đặc trưng" của Chopin; COD: rubato = "Robbed time", thời gian lấy từ một số nốt và "paid back" sau; Trinity: "Robbed (flexible in time)".'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rubato" ]
    luot_2_ghi_chu: '"Robbed time"; thời gian lấy ở chỗ này được trả lại chỗ khác.'
