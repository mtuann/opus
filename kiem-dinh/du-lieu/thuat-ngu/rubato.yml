  - cod-rubato
  - trinity
  ket_qua: da-sua
  ghi_chu: 'Cũ: "Đặc trưng khi chơi Chopin". Mới: "Nghĩa đen: "thời gian bị lấy"; lấy ở nốt này, trả lại ở nốt khác". Lý do: COD: "The question of rubato in Chopin is particularly contentious" (cách dùng ở Chopin còn tranh cãi), không nguồn nào gọi rubato là "đặc trưng" của Chopin; COD: rubato = "Robbed time", thời gian lấy từ một số nốt và "paid back" sau; Trinity: "Robbed (flexible in time)".'
