    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: chủ repo, 5/5 nhận định mẫu của D3-L1 đúng (d3-l1-kiem-mau.yml)
    truong: [ thuat_ngu ]
  - so: 2
    ngay: 2026-10-28
    nhanh: moi/d3-gom
    ma_bam: sha256:0aba8572a25549e09d36a5f343f66ba36e2b74fd52493a212a8d6e9850d82d41
    nguoi:
      luot_1: "không có nhận định mới: khóa thêm nghia, nhom (lựa chọn của site, ghi ở ghi_chu hồ sơ); nhận định của lần 1 vẫn đúng (review D3-gom)"
      luot_2: không cần (không có nhận định mới)
      review: Claude (review D3-gom, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: "Bản ghi dùng ở bài 1 (định nghĩa cao độ), 3, 5 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Review D3-gom (Claude, thuật ngữ, 28/10/2026): đã kiểm hồ sơ (có nhận định cho thuat_ngu và ghi_chu nếu bản ghi có), không đổi gì; lần 1 đã khóa từng phần nên không ghi nguoi.review vào lần ấy."
nguon:
  - id: omt-pitch
    bac: 2
    ten: Open Music Theory, Pitch and Pitch Class (Megan Lavengood)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/
  - id: omt-notation
    bac: 2
    ten: Open Music Theory, Notation of Notes, Clefs, and Ledger Lines (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
nhan_dinh:
  - id: n1
    cau: "*pitch* (cao độ) là độ cao của một âm: mỗi cao độ là một âm có tần số riêng; tần số cao hơn thì âm cao hơn (C4 và C3 là hai cao độ khác nhau)."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-pitch
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT, Pitch and Pitch Class: "Pitches are discrete tones with individual frequencies. The concept of pitch, then, does not imply octave equivalence. C4 is a pitch, and it is not the same pitch as C3." OMT, Notation of Notes: "Notes with a higher frequency (shorter wavelength) are written higher on the staff than notes with a lower frequency (longer wavelength)." Khớp cách bài 1 dùng "cao độ" (âm cao hay thấp, phụ thuộc tần số).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/, https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/ ]
    luot_2_ghi_chu: "OMT, Pitch and Pitch Class: 'Pitches are discrete tones with individual frequencies'; 'C4 is a pitch, and it is not the same pitch as C3'. Notation of Notes…: tần số cao hơn thì nốt đặt cao hơn trên khuông."
