nhan_dinh:
  - id: n1
    cau: "Grave: rất chậm, nặng nề."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - dtempo
    ket_qua: dung
    ghi_chu: 'Trinity: "Extremely slow, solemn"; Dolmetsch: "very slow and solemn".'
    luot_2: dung
    luot_2_nguon: [ "https://radiusmusic.org/reference/musical-terms/", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/grave" ]
    luot_2_ghi_chu: Slow and solemn.
  - id: n2
    cau: Grave chậm hơn Largo.
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - dtempo
    ket_qua: da-bo
    ghi_chu: 'Review D3-gom: cũ "Chậm nhất trong các thuật ngữ thường gặp"; mới "Chậm hơn Largo". "Thường gặp" không kiểm được, và Dolmetsch xếp larghissimo cùng mức với grave ("40 bpm or slower"); một lần chạy lượt 2 (ket-qua-thuat-ngu-1-chua-dat) ghi khong-chac vì các bảng không đồng nhất. Dolmetsch, Table of Tempo Markings: grave "very slow and solemn", "40 bpm or slower"; largo "42-66 bpm". Câu mới cần lượt 2. Lượt 1 (câu cũ): Dolmetsch: Grave "40 bpm or slower", chậm hơn Largo (42-66); Trinity: "Extremely slow". Có nguồn phổ thông xếp Largo là chậm nhất (ViolinOnline), nên giữ chữ "thường gặp". Review D3-gom (sau lượt 2 bổ sung): nguồn mâu thuẫn (Grove qua Wikipedia: grave chậm hơn largo; nguồn khác xếp largo chậm nhất; COD chỉ "chậm, trang trọng"). Bỏ ghi_chu của bản ghi.'
    luot_2: khong-chac
    luot_2_ghi_chu: Grove (Fallows, qua trang Wikipedia, không phải nguồn trực tiếp) nói grave ngày nay được hiểu chậm hơn largo; violinonline xếp largo chậm nhất; Concise Oxford chỉ ghi grave là chậm, trang trọng. Nguồn mâu thuẫn, và thời Baroque dùng không nhất quán.
