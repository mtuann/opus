    ket_qua: dung
    ghi_chu: 'OMT, Other Aspects of Notation: "This articulation is indicated by a curved slur marking." OMT nêu thêm một cách khác: dấu tenuto ("Another way to indicate smooth, connected playing is with tenuto markings"), nên câu nói "được ghi bằng dấu luyến" đúng, không phải cách duy nhất.'
