# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/tone
ban_ghi: thuat-ngu/tone
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: null
ghi_chu: "Bản ghi dùng ở bài 5 (định nghĩa), 6, 7, 8 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: omt-steps
    bac: 2
    ten: Open Music Theory, Half Steps, Whole Steps, and Accidentals (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  - id: mmt-whole-tone
    bac: 2
    ten: MyMusicTheory (Victoria Williams), The Whole Tone Scale
    link: https://mymusictheory.com/scales-and-keys/the-whole-tone-scale/
nhan_dinh:
  - id: n1
    cau: "*tone* (cung) là quãng bằng hai nửa cung."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-steps
      - mmt-whole-tone
    ket_qua: dung
    ghi_chu: 'OMT: "A whole step is two half steps." MyMusicTheory: "each note is a tone (whole step) higher/lower than the next" (tone và whole step là một).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/, https://dictionary.cambridge.org/dictionary/english/tone ]
    luot_2_ghi_chu: "OMT: 'A whole step is the equivalent of two half steps.' Cambridge, mục tone: 'equal to two semitones'."
  - id: n2
    cau: Tiếng Anh–Mỹ gọi cung là *whole step*.
    loai: ten
    truong:
      - ghi_chu
    nguon:
      - omt-steps
      - mmt-whole-tone
    ket_qua: dung
    ghi_chu: OMT (giáo trình Mỹ) gọi là "whole step"; MyMusicTheory (tiếng Anh–Anh) gọi là "tone" và ghi kèm "(whole step)".
    luot_2: dung
    luot_2_nguon: [ https://dictionary.cambridge.org/dictionary/english/tone, https://www.oxfordlearnersdictionaries.com/definition/english/tone_1 ]
    luot_2_ghi_chu: "Cambridge, mục tone: 'mainly UK (US usually whole step)'. Oxford Learner's: 'tone (British English) (US English whole step)'."
