# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/accidental
ban_ghi: thuat-ngu/accidental
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: sha256:34ab4a48b647a8fff9d324d882ff9e595894480dfc92981ea806d33606dd53b2
    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: chủ repo, 5/5 nhận định mẫu của D3-L1 đúng (d3-l1-kiem-mau.yml)
    truong: [ thuat_ngu ]
ghi_chu: "Bản ghi dùng ở bài 5 (định nghĩa), 7 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định."
nguon:
  - id: omt-steps
    bac: 2
    ten: Open Music Theory, Half Steps, Whole Steps, and Accidentals (Chelsey Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  - id: omt-major
    bac: 2
    ten: Open Music Theory, Major Scales, Scale Degrees, and Key Signatures (Chelsey Hamm, Bryn Hughes), cả bảng thuật ngữ cuối chương
    link: https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
nhan_dinh:
  - id: n1
    cau: "*accidental* là dấu viết ngay trước một nốt (bên trái nốt) làm đổi cao độ của nốt ấy: dấu thăng, dấu giáng, dấu bình…; tiếng Việt gọi dấu viết trong bài như vậy (không thuộc hóa biểu) là dấu hóa bất thường."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-steps
      - omt-major
    ket_qua: dung
    ghi_chu: 'OMT, Half Steps, Whole Steps, and Accidentals: "An accidental changes the pitch of a note. A sharp raises a note by a half step, while a flat lowers a note by a half step. A natural cancels a previous accidental."; "Be sure to write accidentals to the left of a note". OMT tách hóa biểu riêng ("A key signature, consisting of either sharps or flats, appears at the beginning of a composition"). Ghi cho D3-L5: tiếng Việt có hai từ, "dấu hóa" (chung cho các ký hiệu ♯ ♭ ♮, bài 5 dùng: "Ba dấu hóa") và "dấu hóa bất thường" (dấu viết trước nốt trong bài); OMT dùng "accidental" cho các ký hiệu ấy nói chung. Bản ghi chỉ có nghĩa thứ hai; Từ điển có thể cần thêm mục "dấu hóa".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/accidental ]
    luot_2_ghi_chu: "OMT: 'An accidental changes the pitch of a note' và viết bên trái nốt. Concise Oxford Dictionary of Music, mục accidental: 'momentary departure from the key signature' (dấu trong hóa biểu không gọi là accidental). Tên 'dấu hóa bất thường' là cách gọi của site."
