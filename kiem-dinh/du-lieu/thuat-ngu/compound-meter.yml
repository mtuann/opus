ghi_chu: 'Thuật ngữ compound meter, nhóm Nhạc lý (Anh – Việt). Bản ghi mới (D3-L5), theo quyết định thuật ngữ 27/10/2026. Câu "Một số giáo trình tiếng Việt gọi 4/4 là nhịp phức" là chữ do chủ repo quyết (README), nhưng chưa có giáo trình tiếng Việt đọc được trên mạng để kiểm: ket_qua null, người giao quyết giữ (kèm nguồn sách in) hay bỏ câu. Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
nguon:
  - id: omtgloss
    bac: 2
    ten: Open Music Theory, Glossary
    link: https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/
  - id: omtcomp
    bac: 2
    ten: Open Music Theory, Compound Meter and Time Signatures
    link: https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/
nhan_dinh:
  - id: n1
    cau: "compound meter: nhịp kép, nhịp có phách chia thành ba phần."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omtgloss
      - omtcomp
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "A meter that divides the beat into three parts."; Compound Meter: "meters in which the beat divides into three and then further subdivides into six".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://www.open.edu/openlearn/history-the-arts/music/an-introduction-music-theory/content-section-3.8" ]
    luot_2_ghi_chu: Beat chia làm ba.
  - id: n2
    cau: Nhịp kép có phách chia ba, như 6/8, 9/8, 12/8.
    loai: dinh-nghia
    truong: &a1
      - ghi_chu
    nguon:
      - omtcomp
    ket_qua: dung
    ghi_chu: "OMT: 6/8 là compound duple, 9/8 compound triple, 12/8 compound quadruple."
    luot_2: dung
    luot_2_nguon: [ "https://www.open.edu/openlearn/history-the-arts/music/an-introduction-music-theory/content-section-3.8" ]
    luot_2_ghi_chu: 6/8, 9/8, 12/8 là nhịp kép.
  - id: n3
    cau: Một số giáo trình tiếng Việt gọi 4/4 là "nhịp phức" (nhịp ghép từ hai nhịp đơn).
    loai: ten
    truong: *a1
    nguon: []
    ket_qua: null
    ghi_chu: "chưa chắc: chủ repo quyết ghi câu này (README, Quyết định thuật ngữ 27/10/2026); không giáo trình nhạc lý tiếng Việt nào đọc được trên mạng (đã tìm 28/10/2026), sách in thì agent không đọc được (chuan-kiem-dinh.md mục 2). Người giao: giữ kèm nguồn sách in, hay bỏ câu."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.open.edu/openlearn/history-the-arts/music/an-introduction-music-theory/content-section-3.8", "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: Các nguồn tiếng Anh xếp 4/4 là nhịp đơn (simple); không tìm được nguồn mở nào nói về thuật ngữ giáo trình Việt "nhịp phức".
