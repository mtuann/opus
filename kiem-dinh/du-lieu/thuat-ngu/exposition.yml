ghi_chu: Thuật ngữ exposition, nhóm Hình thức và thể loại. Nhóm ("nhom") và lời dịch tiếng Việt ("nghia") là lựa chọn của site; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Dùng ở bài 19 (hình thức sonata). OMT Glossary có thêm nghĩa trong fugue (phần đầu, mỗi bè nêu chủ đề); bản ghi của site chỉ nói "Phần trình bày" trong hình thức sonata, đúng với cách các trang dùng. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026.
