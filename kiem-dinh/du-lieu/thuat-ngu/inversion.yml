ghi_chu: 'Bản ghi dùng ở bài 11 (thể đảo của hợp âm ba và hợp âm bảy; lô D3-L2). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Thuật ngữ "inversion" còn nghĩa khác (đảo quãng ở bài 9, đảo môtip ở bài 30; bản ghi riêng inversion-giai-dieu): bản ghi này chỉ nói thể đảo của hợp âm.'
nguon:
  - id: omt-inversion
    bac: 2
    ten: Open Music Theory, Inversion
    link: https://viva.pressbooks.pub/openmusictheory/chapter/inversion/
  - id: fff-triads
    bac: 2
    ten: Andre Mount, Fundamentals, Function, and Form (Milne Publishing, SUNY Geneseo, giáo trình mở), 13. Triads
    link: https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/13-triads/
nhan_dinh:
  - id: n1
    cau: "*inversion* (thể đảo) là cách xếp hợp âm khi nốt ở bè trầm không phải nốt gốc (ví dụ nốt ba ở bè trầm)."
    loai: dinh-nghia
    nguon:
      - omt-inversion
      - fff-triads
    truong:
      - thuat_ngu
      - nghia
    ket_qua: dung
    ghi_chu: 'OMT, Inversion (bảng thuật ngữ): "Changing the bass note of a harmony so that, for example, the third is in the bass instead of the root." Cùng chương: "when the third is in the bass the chord is in first inversion". Mount 13: đảo 1 có nốt ba ở bè trầm, đảo 2 có nốt năm. Phân biệt với bản ghi inversion-giai-dieu (đảo của môtip), không thuộc lô này.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "Harmonic inversion: đổi nốt bè trầm."
