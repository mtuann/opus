# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/dissonance
ban_ghi: thuat-ngu/dissonance
lan:
  - so: 1
    ngay: 2026-10-27
    nhanh: moi/d3-l2
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L2 lượt 1, phần 1/2)
      luot_2: null
      review: null
      kiem_mau: null
    truong:
      - thuat_ngu
ghi_chu: 'Bản ghi dùng ở bài 9 (quãng nghịch; lô D3-L2). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Tên "nghịch tai" là lựa chọn của site.'
nguon:
  - id: omt-intervals
    bac: 2
    ten: Open Music Theory, Intervals (cả bảng nửa cung ở Example 16, mục Consonance and Dissonance, tritone, inversion, compound intervals)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  - id: omt-counterpoint
    bac: 2
    ten: Open Music Theory, Introduction to Species Counterpoint (mục Consonances and dissonances)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/species-counterpoint/
  - id: fff-intervals
    bac: 2
    ten: Andre Mount, Fundamentals, Function, and Form (Milne Publishing, SUNY Geneseo, giáo trình mở), 11. Intervals (cả Table 11-2)
    link: https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/11-intervals/
nhan_dinh:
  - id: n1
    cau: "*dissonance* (nghịch tai) là tính chất của quãng (hay âm) kém ổn định, như cần được giải quyết."
    loai: dinh-nghia
    nguon:
      - omt-intervals
      - fff-intervals
    truong:
      - thuat_ngu
      - nghia
    ket_qua: dung
    ghi_chu: 'OMT, Intervals: "dissonant intervals are considered less stable, as if they do need to resolve", và "These categorizations have varied with milieu." Mount 11: quãng nghịch nghe "unstable and agitated" (không ổn định, xao động); thuật ngữ tương đối. OMT, Species Counterpoint: "Dissonances (all seconds, sevenths, and diminished and augmented intervals)"; quãng 4 đúng nghịch khi có bè trầm.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: 'OMT: độ gắt (roughness); phần "cần giải quyết" là cách nói phổ biến, OMT glossary không nêu.'
