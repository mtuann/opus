nhan_dinh:
  - id: n1
    cau: "m.d. / m.s.: tay phải / tay trái."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - codmd
    ket_qua: dung
    ghi_chu: 'Trinity: "M.D. = R.H.", "M.S. = L.H."; COD: "M.D. = main droite (Fr.) or mano destra (It.), i.e. right hand".'
    luot_2: dung
    luot_2_nguon: [ "https://dev-dictionary.onmusic.org/terms/2053-m.s", "https://www.songtive.com/de/glossary/mano-destra" ]
    luot_2_ghi_chu: m.s. tay trái, m.d. tay phải.
  - id: n2
    cau: m.d. / m.s. là viết tắt tiếng Ý mano destra / mano sinistra; tiếng Pháp main droite / main gauche; tiếng Anh r.h. / l.h.
    loai: ten
    truong:
      - ghi_chu
    nguon:
      - trinity
      - codmd
      - dmain
    ket_qua: da-sua
    ghi_chu: 'Review D3-gom: dung (da-sua giữ). COD, M.D.: "M.D. = main droite (Fr.) or mano destra (It.), i.e. right hand"; Dolmetsch, M: "Main droite (French f.) right hand", "Main gauche (French f.) left hand"; Trinity: "Mano Destra (It.) M.D. = R.H.", "Mano Sinistra (It.) M.S. = L.H.". Lượt 1: Cũ: "Tiếng Ý *mano destra* / *mano sinistra*; tiếng Pháp m.d. / m.g.; tiếng Anh r.h. / l.h.". Mới: "Tiếng Ý *mano destra* / *mano sinistra*; tiếng Pháp *main droite* / *main gauche*; tiếng Anh r.h. / l.h.". Lý do: COD xác nhận m.d. = main droite hoặc mano destra; Dolmetsch: "Main gauche (French f.) left hand"; không nguồn đã mở ghi viết tắt "m.g."; "m.s." (mano sinistra) và r.h./l.h. theo Trinity.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.songtive.com/de/glossary/mano-destra" ]
    luot_2_ghi_chu: Xác nhận được mano destra/sinistra và r.h.; chưa mở nguồn nào cho dạng tiếng Pháp.
