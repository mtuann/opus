ghi_chu: Thuật ngữ m.d. / m.s., nhóm Piano. Chữ mới bỏ "m.g." (viết tắt tiếng Pháp) vì không nguồn đã mở ghi chữ viết tắt ấy. Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).
nguon:
  - id: trinity
    bac: 2
    ten: Trinity College London, Musical terms and directions for performance (resource 785)
    link: https://trinitycollege.com/resource?id=785
  - id: codmd
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục M.D., qua Encyclopedia.com
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/md
  - id: dmain
