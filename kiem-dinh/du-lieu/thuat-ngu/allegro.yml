ghi_chu: 'Thuật ngữ Allegro, nhóm Tốc độ. Con số BPM khác nhau nhiều giữa các nguồn (Dolmetsch, Table of Tempo Markings: Largo 42-66, Adagio 58-97 hay "66-76 theo một số nguồn", Andante 56-88 hay "76-108 theo một số nguồn", Moderato 66-126, Allegro 84-144, Presto 100-152 hay "168-208 theo một số nguồn"); site dùng chữ "khoảng".  Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
