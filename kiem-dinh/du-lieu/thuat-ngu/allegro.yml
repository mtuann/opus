    ket_qua: da-bo
    ghi_chu: 'Đã bỏ ghi_chu "Khoảng 120–156 BPM". Dolmetsch ghi Allegro 84-144 bpm (máy điện tử hiện đại 120-160, Mälzel 120, máy 1950: 116); khoảng 120-156 không có nguồn bậc 1-2 đã mở. Bỏ.'
