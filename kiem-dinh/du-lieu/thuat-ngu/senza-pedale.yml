    ket_qua: dung
    ghi_chu: 'Dolmetsch: pedale = bàn đạp nhấc giảm âm; Trinity: "Senza sordini: without dampers" ("senza" = không, "con" = với). Không nguồn đã mở có mục riêng "senza pedale"; nghĩa suy từ con/senza và pedale.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defss.htm" ]
    luot_2_ghi_chu: "Dolmetsch: sans pédale = without pedal (right pedal)."
