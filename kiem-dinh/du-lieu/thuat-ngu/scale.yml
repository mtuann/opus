ghi_chu: "Bản ghi dùng ở bài 6 (định nghĩa), 1, 5, 7, 8 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Review D3-gom (Claude, thuật ngữ, 28/10/2026): đã kiểm hồ sơ (có nhận định cho thuat_ngu và ghi_chu nếu bản ghi có), không đổi gì; lần 1 đã khóa từng phần nên không ghi nguoi.review vào lần ấy."
nguon:
  - id: omt-major
    bac: 2
    ten: Open Music Theory, Major Scales, Scale Degrees, and Key Signatures (Chelsey Hamm, Bryn Hughes), cả bảng thuật ngữ cuối chương
    link: https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
nhan_dinh:
  - id: n1
    cau: "*scale* (gam) là chuỗi nốt theo một công thức cung, nửa cung cố định; ví dụ gam trưởng đi lên theo cung – cung – nửa cung – cung – cung – cung – nửa cung."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt-major
    ket_qua: dung
    ghi_chu: 'OMT, Major Scales: "A major scale is an ordered collection of half (H) and whole (W) steps with the ascending succession W‑W‑H‑W‑W‑W‑H." Khớp bài 6.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scale ]
    luot_2_ghi_chu: "OMT: gam là 'ordered collection of half and whole steps'; gam trưởng W‑W‑H‑W‑W‑W‑H (Major Scales). Concise Oxford Dictionary of Music, mục scale: 'A series of single notes progressing up or down stepwise.'"
