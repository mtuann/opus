nhan_dinh:
  - id: n1
    cau: 'parallel fifths and octaves: quãng 5, quãng 8 song song, hai quãng 5 (hay 8) đúng liền nhau giữa hai bè.'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt1-first-species
    ket_qua: dung
    ghi_chu: 'OMT 1.0: "Never, ever, ever use two perfect consonances of the same size in a row: P5–P5 or P8–P8."'
    luot_2: dung
    luot_2_nguon:
      - https://musictheory.pugetsound.edu/mt21c/ObjectionableParallels.html
      - https://musictheory.pugetsound.edu/mt21c/TypesOfMotion.html
    luot_2_ghi_chu: 'MT21C: "avoid having any two voices move in parallel fifths or parallel octaves".'
  - id: n2
    cau: 'parallel fifths and octaves: bị cấm trong dẫn bè chặt vì làm mất tính độc lập của các bè.'
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - omt1-first-species
      - omt1-basso-continuo
    ket_qua: dung
    ghi_chu: 'OMT 1.0: "significantly promote tonal fusion over melodic independence"; "No parallel fifths or octaves between any pair of voices"'
    luot_2: dung
    luot_2_nguon:
      - https://musictheory.pugetsound.edu/mt21c/ObjectionableParallels.html
    luot_2_ghi_chu: 'MT21C: "these objectional parallels were thought to destroy the independence of the voices."'
