    nguoi:
      luot_1: Claude Opus 5.5 (D3-L1 lượt 1, thuật ngữ)
      luot_2: Claude Opus 5.5 (D3-L1 lượt 2, phần B)
      review: "Claude Opus 5.5 (review D3-L1, 24/10/2026; câu ve-site: Claude Sonnet 5.5)"
      kiem_mau: chủ repo, 5/5 nhận định mẫu của D3-L1 đúng (d3-l1-kiem-mau.yml)
    truong: [ ghi_chu, thuat_ngu ]
  - so: 2
    ngay: 2026-10-28
    nhanh: moi/d3-gom
    ma_bam: sha256:c7ae1d782536658258c0f913ce5fec65f0a1515892c7735327aa1158e2dd56d4
    nguoi:
      luot_1: "không có nhận định mới: khóa thêm nghia, nhom (lựa chọn của site, ghi ở ghi_chu hồ sơ); nhận định của lần 1 vẫn đúng (review D3-gom)"
      luot_2: không cần (không có nhận định mới)
      review: Claude (review D3-gom, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: "Bản ghi dùng ở bài 6 (bảng tên bậc), 7, 8 (lô D3-L1). Kiểm đối chiếu khái niệm theo Open Music Theory (nguồn chính đã chốt) hay giáo trình mở khác khi OMT không có. Tên tiếng Việt ở trường nghia là lựa chọn của site (từ vựng của site cũ: ../opus-zero/AGENTS.md, mục Quy tắc nội dung), không phải nhận định; chưa có giáo trình nhạc lý tiếng Việt đọc được trên mạng để đối chiếu (sách in), nên lô D3-L5 chốt. Trường nhom là cách xếp của trang Từ điển, không phải nhận định. Review D3-gom (Claude, thuật ngữ, 28/10/2026): đã kiểm hồ sơ (có nhận định cho thuat_ngu và ghi_chu nếu bản ghi có), không đổi gì; lần 1 đã khóa từng phần nên không ghi nguoi.review vào lần ấy."
nguon:
  - id: omt-major
    bac: 2
    ten: Open Music Theory, Major Scales, Scale Degrees, and Key Signatures (Chelsey Hamm, Bryn Hughes), cả bảng thuật ngữ cuối chương
    link: https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
nhan_dinh:
  - id: n1
    cau: "*leading tone* (cảm âm) là bậc VII của gam, thấp hơn chủ âm nửa cung."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
      - ghi_chu
    nguon:
      - omt-major
    ket_qua: dung
    ghi_chu: 'OMT, Major Scales, bảng thuật ngữ: leading tone: "Scale degree 7 that is one half step below the tonic. The leading tone is diatonic in major keys, but requires an accidental in minor keys." Ghi cho D3-L5: tiếng Anh–Anh gọi là "leading note".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/leading-note ]
    luot_2_ghi_chu: "OMT, Major Scales (từ điển thuật ngữ): 'A 7̂ that is one half step below 1̂.' Concise Oxford Dictionary of Music, mục leading note: '7th degree of the scale, semitone below the tonic'."
