nhan_dinh:
  - id: n1
    cau: "senza sordino ở Beethoven: giữ bộ giảm âm nhấc lên, tức giữ bàn đạp vang."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - codsord
      - henlepref
      - henleblog
      - trinity
    ket_qua: dung
    ghi_chu: 'COD: "On the pf., sordini means the dampers; senza sordini is without dampers ... meaning that the sustaining pedal is to be depressed"; Henle (preface sonata Beethoven): "senza sordino (i. e. without damper = with pedal)"; Henle Blog: "Moonlight" directive "senza sordino" refers to the right pedal, which lifts the dampers; Trinity: "Senza sordini: without dampers".'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino" ]
    luot_2_ghi_chu: "Encyclopedia: senza sordini, dampers off, nghĩa là nhấn bàn đạp vang."
  - id: n2
    cau: Đầu chương 1 Sonata Ánh trăng có chỉ dẫn "senza sordino".
    loai: cau-truc
    truong:
      - ghi_chu
    nguon:
      - henleblog
      - psmoon
    ket_qua: dung
    ghi_chu: 'Review D3-gom: dung. Henle Blog (bậc 2, nhà xuất bản): "He opens his ''Moonlight'' sonata with the performance directive senza sordino", tức chỉ dẫn ở đầu sonata, đầu chương 1. Lượt 1: Piano Street (bản PDF, Op 111 Productions): đầu chương 1 Op. 27 No. 2: "Si deve suonare tutto questo pezzo delicatissimamente e senza sordino" (chú thích: "This whole movement must be played with the utmost delicacy and without dampers"); Henle Blog xác nhận chỉ dẫn "senza sordino" của Moonlight. Chưa chắc nhẹ: bản PDF không ghi ấn bản gốc.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chỉ tìm được câu "Si deve suonare tutto questo pezzo delicatissimamente e senza sordino" qua Wikipedia (không dùng làm nguồn); chưa mở được bản nhạc.
