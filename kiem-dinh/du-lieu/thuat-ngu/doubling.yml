nhan_dinh:
  - id: n1
    cau: 'doubling: nhân đôi, một âm của hợp âm xuất hiện ở hai bè.'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - omt1-thoroughbass
    ket_qua: dung
    ghi_chu: 'OMT 1.0, với hợp âm 5/3 và 6/3 bốn bè: "one note of the chord will be doubled"'
    luot_2: dung
    luot_2_nguon:
      - https://viva.pressbooks.pub/openmusictheorycopy/?p=907
      - https://openmusictheory.github.io/thoroughbassFigures.html
    luot_2_ghi_chu: 'OMT, Chord voicing: "use each pitch-class once, and \"double\" one of them".'
  - id: n2
    cau: 'doubling: trong lối basso continuo, hợp âm 5/3 và 6/4 thường nhân đôi âm bass.'
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - omt1-basso-continuo
    ket_qua: dung
    ghi_chu: 'OMT 1.0: nếu hình số là 6/4 hay 5/3 thì "double the bass pitch class"'
    luot_2: dung
    luot_2_nguon:
      - https://viva.pressbooks.pub/openmusictheorycopy/?p=907
      - https://musictheory.pugetsound.edu/mt21c/SummaryOfDoublingRules.html
    luot_2_ghi_chu: 'OMT: "If the figure is 6/4, 5/3, or other chord of the fifth, double the bass pitch class."'
