# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa du-lieu/thuat-ngu/andante
ban_ghi: thuat-ngu/andante
lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-l5
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L5 lượt 1, thuật ngữ)
      luot_2: null
      review: Claude (review D3-gom, thuật ngữ, 28/10/2026)
      kiem_mau: null
    truong:
      - ghi_chu
      - nghia
      - thuat_ngu
ghi_chu: 'Thuật ngữ Andante, nhóm Tốc độ. Con số BPM khác nhau nhiều giữa các nguồn (Dolmetsch, Table of Tempo Markings: Largo 42-66, Adagio 58-97 hay "66-76 theo một số nguồn", Andante 56-88 hay "76-108 theo một số nguồn", Moderato 66-126, Allegro 84-144, Presto 100-152 hay "168-208 theo một số nguồn"); site dùng chữ "khoảng".  Nhóm (nhom) và lời dịch tiếng Việt (nghia) là lựa chọn của site, không phải nhận định; kiểm khái niệm khớp với nguồn, không kiểm cách dịch từng chữ. Chỉ đọc nguồn bậc 2 qua WebFetch ngày 28/10/2026 (lô D3-L5).'
nguon:
  - id: trinity
    bac: 2
    ten: Trinity College London, Musical terms and directions for performance (resource 785)
    link: https://trinitycollege.com/resource?id=785
  - id: dtempo
    bac: 2
    ten: Dolmetsch Online, Music Theory Online, Tempo (Table of Tempo Markings)
    link: http://www.dolmetsch.com/musictheory5.htm
nhan_dinh:
  - id: n1
    cau: "Andante: vừa phải, như bước đi."
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - trinity
      - dtempo
    ket_qua: dung
    ghi_chu: 'Trinity: "Going at an easy pace"; Dolmetsch: "moving along - walking pace".'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/defsa7.htm", "https://www.dolmetsch.com/musictheory5.htm" ]
    luot_2_ghi_chu: Walking pace.
  - id: n2
    cau: "Andante: khoảng 76-108 BPM."
    loai: so-lieu
    truong:
      - ghi_chu
    nguon:
      - dtempo
    ket_qua: da-bo
    ghi_chu: 'Review D3-gom: bỏ con số BPM khỏi ghi_chu (cùng cách với moderato, allegro). Dolmetsch, Tempo (Table of Tempo Markings): "there is a wide variation associated with each mark"; Andante "56-88 bpm (some sources suggest 76-108 bpm)". Khoảng riêng của Dolmetsch chồng lấn nhau (Adagio 58-97 vượt cận trên 88 của Andante 56-88), nên chép khoảng của Dolmetsch dễ làm người mới hiểu sai thứ tự; khoảng cũ của site chỉ khớp một mục "some sources suggest" không nêu tên nguồn, không có nguồn bậc 1-2 riêng. Thứ tự nhanh chậm vẫn đọc từ cột Nghĩa. Lượt 1: Dolmetsch: "some sources suggest 76-108 bpm" (khoảng riêng của Dolmetsch: 56-88). Khoảng của site là một trong các khoảng có nguồn.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory5.htm" ]
    luot_2_ghi_chu: 'Dolmetsch: 56-88 BPM, "một số nguồn 76-108": các nguồn lệch.'
