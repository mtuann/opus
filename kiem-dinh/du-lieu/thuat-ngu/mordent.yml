nguon:
  - id: dol23
    bac: 2
    ten: Dolmetsch Online, Music Theory Online, bài 23 (nốt hoa mỹ)
    link: https://www.dolmetsch.com/musictheory23.htm
  - id: cod-mordent
    bac: 2
    ten: The Concise Oxford Dictionary of Music (Kennedy, Bourne), mục mordent, qua Encyclopedia.com
