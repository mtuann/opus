nhan_dinh:
  - id: n1
    cau: 'mordent: Láy: chính – dưới – chính (có gạch)'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - dol23
      - cod-mordent
    ket_qua: dung
    ghi_chu: 'Dolmetsch bài 23: mordent = chính – dưới – chính (có gạch); COD nói tên gọi mordent dùng không nhất quán.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: 'Dolmetsch: mordent (có gạch) là ba nốt, nốt viết - nốt dưới - nốt viết ("lower").'
  - id: n2
    cau: Không gạch là láy trên
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - dol23
      - cod-mordent
    ket_qua: dung
    ghi_chu: 'Review D3-gom: dung. Dolmetsch, bài 23 (Mordents): mordent "written as a shake sign crossed by a vertical line" = nốt viết, nốt dưới, nốt viết; "upper mordent or Schneller" "written as a shake sign" = nốt viết, nốt trên, nốt viết. Dolmetsch không đồng nhất Schneller với pralltriller như ghi chú lượt 1 viết, và lưu ý "inverted mordent" dùng không thống nhất: câu của site không dùng chữ ấy nên giữ. Lượt 1: Dolmetsch bài 23: không gạch (pralltriller) dùng nốt trên; COD lưu ý tên gọi không nhất quán giữa các thời kỳ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory23.htm" ]
    luot_2_ghi_chu: Không gạch là upper mordent / Schneller. Thuật ngữ "inverted" dùng không thống nhất.
