ghi_chu: 'Bản ghi dùng ở bài 24 (chỉ trong tên tác phẩm "Sonata Ánh trăng, Op. 27 số 2", lô D3-L3: trang gọi tên thể loại ở tên tác phẩm, không định nghĩa). Các trường kiểm: thuat_ngu, nghia ("Sonata", giữ nguyên chữ), ghi_chu ("Tác phẩm cho một hoặc hai nhạc cụ"). Phân biệt với bản ghi sonata-form (hình thức sonata, đã khóa ở D3-L1). Tên tiếng Việt ở trường nghia và lời giải thích ở ghi_chu của bản ghi là cách viết của site (từ vựng của site cũ), nhom là cách xếp của trang Từ điển: không kiểm cách dịch từng chữ, chỉ kiểm khái niệm khớp nguồn. WebFetch ngày 28/10/2026.'
nguon:
  - id: cod-sonata
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục sonata, qua Encyclopedia.com
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sonata
  - id: brit-sonata
    bac: 2
    ten: Encyclopaedia Britannica, Sonata
    link: https://www.britannica.com/art/sonata
nhan_dinh:
  - id: n1
    cau: 'sonata: Sonata (tên thể loại nhạc, giữ nguyên chữ).'
    loai: dinh-nghia
    truong:
      - thuat_ngu
      - nghia
    nguon:
      - cod-sonata
      - brit-sonata
    ket_qua: dung
    ghi_chu: 'COD và Britannica dùng "sonata" làm tên thể loại (nhiều chương). "Sonata" giữ nguyên chữ: lựa chọn của site.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sonata" ]
    luot_2_ghi_chu: Sonata là tên thể loại, giữ nguyên chữ.
  - id: n2
    cau: 'sonata: tác phẩm cho một hoặc hai nhạc cụ.'
    loai: dinh-nghia
    truong:
      - ghi_chu
    nguon:
      - cod-sonata
      - brit-sonata
    ket_qua: dung
    ghi_chu: 'COD: thuật ngữ "usually reserved for works involving not more than 2 performers" (nhiều chương, "in several movts."). Britannica: "usually for a solo instrument or a small instrumental ensemble, that typically consists of two to four movements" (cho phép cả nhóm nhỏ, ví dụ sonata ba trong Baroque): câu của site đúng với nghĩa phổ biến (độc tấu, hay nhạc cụ với piano); với mọi sonata thì "thường" mới đủ: nhắc D3-L5 khi chốt (chỉ là gợi ý, không sai).'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sonata", "https://www.dolmetsch.com/defss3.htm" ]
    luot_2_ghi_chu: "Oxford: cho piano hoặc nhạc cụ khác có piano đệm; Dolmetsch: sonata thế kỷ 17 cho một số nhạc cụ solo."
