    cau: "Hình sau khuông \"Ode to Joy – câu hỏi và câu trả lời\" (::hinh{ten=\"doan-nhac\"}) vẽ 8 ô nhịp: câu hỏi ô 1–4, câu trả lời ô 5–8; hàng \"Chất liệu\" tô cùng màu ô 1–3 và ô 5–7 (ghi \"giống ô 1–3\"), ô 4 ghi \"kết nửa\", ô 8 ghi \"kết trọn\". Chú thích: cùng màu là cùng chất liệu, câu trả lời giống câu hỏi ở ba ô nhịp đầu, rồi kết khác."
