    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "kết thúc bằng kết nửa, tạo cảm giác chưa xong". Chữ mới thêm "thường". OMT: antecedent "ends with a weaker cadence, usually a half cadence" (Glossary: "ends with a weak cadence"). Tài liệu UCI: antecedent dẫn tới "a weak cadence of some kind". Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/phrase-archetypes-unique-forms/", "https://musictheory.pugetsound.edu/mt21c/PeriodForm.html" ]
