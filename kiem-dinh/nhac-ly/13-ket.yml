    ghi_chu: 'Soạn cho trang này. [C,EGc] [G,DGB] | [G,DFB] [A,EAc]: ô 2 có V7 (G B D F; ghi [G,DFB]) rồi vi (A C E) ở hợp âm cuối, bass G rồi A: V – vi thay vì I, đúng kết lừa (n12, n16). Hợp âm [G,DFB] là V7, không phải V thuần như chữ "V đi về vi" của trang; V7 – vi vẫn là kết lừa (Britannica: cadence bắt đầu từ chức năng dominant mà không về chủ). Không cảnh báo abcjs; ô đủ độ dài.'
