nhan_dinh:
  - id: n1
    cau: Kết (cadence) là chuỗi hợp âm ở cuối một câu nhạc, cho người nghe biết câu đã xong hay còn tiếp.
    loai: dinh-nghia
    nguon:
      - omt-intro
      - brit-cadence
      - cod-cadence
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Harmony: cadences là "melodic and harmonic patterns that create goals, kind of like punctuation marks in literary sentences"; Glossary: "A melodic and harmonic goal." Britannica: "the ending of a phrase, perceived as a rhythmic or melodic articulation or a harmonic change or all of these." Concise Oxford Dictionary of Music: "Any melodic or harmonic progression which has come to possess a conventional association with the ending of a comp." Trang chỉ nói phần hợp âm (đủ trong phạm vi bài, vì Britannica và COD cũng gọi cadence hòa âm là loại điển hình); Dòng này cũng là mô tả trang (frontmatter). Vế "xong hay còn tiếp": OMT nói PAC có "sense of finality", HC có "unfinished sound".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://musictheory.pugetsound.edu/mt21c/cadences.html" ]
    luot_2_ghi_chu: "OMT: cadence là điểm đến/điểm tạm ngừng kết một đơn vị nhạc như câu."
  - id: n2
    cau: 'Tên năm loại kết trong bảng: kết trọn (perfect authentic cadence), kết chưa trọn (imperfect authentic cadence), kết nửa (half cadence), kết plagal (plagal cadence), kết lừa (deceptive cadence).'
    loai: ten
    nguon:
      - omt-gloss
      - brit-cadence
      - cod-cadence
    ket_qua: dung
    ghi_chu: 'OMT Glossary có perfect authentic, imperfect authentic, half, plagal cadence; Britannica có "deceptive" (V–VI); COD ghi deceptive là tên khác của interrupted cadence. Tên tiếng Việt là lựa chọn của site, không có giáo trình tiếng Việt đọc được để đối chiếu (ghi cho D3-L5: "kết trọn / kết chưa trọn / kết nửa / kết plagal / kết lừa"). Câu trong ngoặc "authentic cadence hoàn toàn / không hoàn toàn" là cách dịch perfect / imperfect.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://musictheory.pugetsound.edu/mt21c/cadences.html", "https://minnstate.pressbooks.pub/firstyearmusictheory/?p=1695" ]
    luot_2_ghi_chu: "Tên: PAC, IAC, half, plagal, deceptive; OMT glossary dùng 'deceptive motion' cho V-vi."
  - id: n3
    cau: 'Kết trọn: V – I, cả hai ở thể gốc, bè trên kết ở chủ âm.'
    loai: quy-tac
    nguon:
      - omt-intro
      - omt-gloss
      - cod-cadence
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "A V–I cadence that ends with do (1̂) in the melody. Both harmonies must be in root position." COD: perfect cadence "Chord of the dominant followed by that of tonic", đảo hợp âm thì bớt trọn vẹn.'
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/PerfectAuthenticCadence.html", "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "PAC: V-I, cả hai thể gốc, do (1) ở bè cao."
  - id: n4
    cau: Kết trọn giống dấu chấm hết, cảm giác kết thúc trọn vẹn.
    loai: dinh-nghia
    nguon:
      - omt-intro
      - brit-cadence
    ket_qua: dung
    ghi_chu: 'OMT: "PACs are the strongest kind of cadence available to a composer because of the sense of finality they can create"; Britannica gọi perfect cadence là "the strongest type of authentic cadence". Việc ví cụ thể với "dấu chấm hết" là cách ví của site; OMT chỉ ví chung với dấu câu.'
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/PeriodForm.html" ]
    luot_2_ghi_chu: "MT21C: PAC kết luận hơn IAC; so sánh 'dấu chấm hết' là hình ảnh."
  - id: n5
    cau: 'Kết chưa trọn: V – I, nhưng có thể đảo hoặc bè trên không ở chủ âm.'
    loai: quy-tac
    nguon:
      - omt-intro
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "A V–I cadence in which V, I, or both harmonies are inverted, and/or do (1̂) is not in the soprano over the tonic triad."'
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/PerfectAuthenticCadence.html", "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "IAC: V-I có hợp âm đảo hay chủ âm không ở bè cao nhất."
  - id: n6
    cau: 'Kết chưa trọn giống dấu chấm phẩy: kết nhưng còn hơi mở.'
    loai: dinh-nghia
    nguon:
      - omt-intro
    ket_qua: dung
    ghi_chu: 'OMT: "IACs are special because they occupy the space between HCs and PACs in terms of cadential strength", tức mạnh hơn kết nửa, yếu hơn kết trọn. "Dấu chấm phẩy" là cách ví của site.'
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/PeriodForm.html" ]
    luot_2_ghi_chu: Hình ảnh dạy học; IAC kết luận kém PAC.
  - id: n7
    cau: 'Kết nửa: chuỗi "... – V" (dừng ở V).'
    loai: quy-tac
    nguon:
      - omt-intro
      - omt-gloss
      - brit-cadence
    ket_qua: dung
    ghi_chu: 'OMT: "Half cadences involve the progression x–V, where x is any of a variety of harmonies"; Glossary: "A kind of inconclusive cadence that occurs when a phrase ends on V." Britannica: phrase ends on the dominant chord.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "Half cadence: câu dừng ở V."
  - id: n8
    cau: 'Kết nửa giống dấu phẩy hay dấu hỏi: dừng lơ lửng, chờ câu sau.'
    loai: dinh-nghia
    nguon:
      - omt-intro
      - brit-cadence
    ket_qua: dung
    ghi_chu: 'OMT: HCs "are the weakest kind of cadence because of their unfinished sound"; Britannica: half cadence "usually implies that another phrase will follow". Ví với dấu phẩy, dấu hỏi là cách ví của site.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://musictheory.pugetsound.edu/mt21c/PeriodForm.html" ]
    luot_2_ghi_chu: HC kém kết luận, antecedent thường kết ở HC.
  - id: n9
    cau: 'Kết plagal: IV – I.'
    loai: quy-tac
    nguon:
      - omt-gloss
      - omt-plagal
      - brit-cadence
      - cod-cadence
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "A plagal cadence uses the harmonies IV–I." Britannica: subdominant triad leads to tonic; COD: "Chord of the subdominant followed by that of tonic." OMT, Plagal Motion, lưu ý chỉ chuỗi (IV)–I kết câu mới là cadence: "would inaccurately imply that (IV)–I always ends a phrase".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://musictheory.pugetsound.edu/mt21c/cadences.html" ]
    luot_2_ghi_chu: "Plagal: IV-I."
  - id: n10
    cau: Kết plagal giống "Amen" cuối thánh ca.
    loai: dinh-nghia
    nguon:
      - brit-cadence
      - cod-cadence
    ket_qua: dung
    ghi_chu: 'Britannica: cách dùng "most characteristic and formulaic usage in the West is with the final amen at the end of a Christian hymn"; COD: "Plagal (Amen) cadence".'
    luot_2: dung
    luot_2_nguon: [ "https://minnstate.pressbooks.pub/firstyearmusictheory/?p=1695", "https://musictheory.pugetsound.edu/mt21c/cadences.html" ]
    luot_2_ghi_chu: "minnstate gọi 'Amen' cadence; MT21C: 'Amen' cuối 'Amazing Grace'. 'Thánh ca' đúng."
  - id: n11
    cau: 'Kết plagal: về chủ âm thẳng từ IV, không qua V.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - brit-cadence
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Êm, trang nghiêm". Chữ mới: "Về chủ âm thẳng từ IV, không qua V". Lý do: cảm nhận "êm, trang nghiêm" không nguồn nào nói; chữ mới suy trực tiếp từ định nghĩa IV–I (OMT Glossary, Britannica). Review D3-gom: chữ mới có ở bảng; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: Plagal đi IV-I trực tiếp, không qua V.
  - id: n12
    cau: 'Kết lừa: V – vi.'
    loai: quy-tac
    nguon:
      - brit-cadence
      - cod-cadence
    ket_qua: dung
    ghi_chu: 'Britannica: deceptive cadence (V–VI): "starts on V but does not end on the tonic", the submediant often substitutes. COD: interrupted cadence "Chord of the dominant followed by that of submediant", "Deceptive cadence" là tên khác. OMT Glossary chỉ có "deceptive motion: A cadence-like resolution from V to a non-tonic harmony." (V–vi ở giọng trưởng viết vi thường.)'
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/cadences.html", "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "Deceptive: V-vi (V không về I)."
  - id: n13
    cau: 'Kết lừa giống sự bất ngờ: tưởng về nhà nhưng rẽ hướng khác.'
    loai: dinh-nghia
    nguon:
      - brit-cadence
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'Cùng nguồn n12: cadence bắt đầu từ V nhưng không về chủ âm (Britannica); OMT: "cadence-like resolution from V to a non-tonic harmony". Cách nói "tưởng về nhà" là hình ảnh của site.'
    luot_2: dung
    luot_2_nguon: [ "https://minnstate.pressbooks.pub/firstyearmusictheory/?p=1695" ]
    luot_2_ghi_chu: "minnstate: chuẩn bị người nghe chờ kết trọn rồi rẽ hướng."
  - id: n14
    cau: Kết nửa — dừng ở V, nghe như một câu hỏi.
    loai: dinh-nghia
    nguon:
      - omt-intro
      - brit-cadence
    ket_qua: dung
    ghi_chu: 'Cùng nguồn n7, n8: kết nửa dừng ở V và còn chờ câu sau. "Như một câu hỏi" là hình ảnh của site (OMT gọi antecedent là phrase kết bằng kết yếu).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: HC dừng ở V; 'như câu hỏi' là hình ảnh.
  - id: n15
    cau: Kết plagal — "A-men".
    loai: dinh-nghia
    nguon:
      - brit-cadence
    ket_qua: dung
    ghi_chu: 'Xem n10 (Britannica: amen ở cuối thánh ca).'
    luot_2: dung
    luot_2_nguon: [ "https://minnstate.pressbooks.pub/firstyearmusictheory/?p=1695", "https://musictheory.pugetsound.edu/mt21c/cadences.html" ]
    luot_2_ghi_chu: Plagal = Amen.
  - id: n16
    cau: Kết lừa — V đi về vi thay vì I.
    loai: quy-tac
    nguon:
      - brit-cadence
      - cod-cadence
    ket_qua: dung
    ghi_chu: Xem n12.
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/cadences.html" ]
    luot_2_ghi_chu: Deceptive V-vi.
  - id: n17
    cau: Một câu nhạc (phrase) thường dài 4, 8 hoặc 16 ô nhịp.
    loai: so-lieu
    nguon:
      - omt-phrase
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một câu nhạc (phrase) thường dài 4 ô nhịp và kết thúc bằng một kết." Chữ mới: "... thường dài 4, 8 hoặc 16 ô nhịp và thường kết thúc bằng một kết." OMT, The Phrase, Archetypes, and Unique Forms: "A phrase can be any length, but phrases of 4, 8, or 16 measures are particularly common." Review D3-gom: chữ mới có trên trang; hai lượt cùng trích OMT "phrases of 4, 8, or 16 measures are particularly common"; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/phrase-archetypes-unique-forms/", "https://pressbooks.nebraska.edu/openmusictheory/?p=296" ]
    luot_2_ghi_chu: "OMT: 'phrases of 4, 8, or 16 measures are particularly common'."
  - id: n18
    cau: Một câu nhạc thường kết thúc bằng một kết.
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-phrase
    ket_qua: da-sua
    ghi_chu: 'OMT Glossary: phrase là "A relatively complete musical thought that exhibits trajectory toward a goal (often a cadence)"; OMT: "In tonal classical music, that goal is almost always one of the traditional cadence types". Chữ cũ nói câu nhạc "kết thúc bằng một kết" không có "thường"; đã thêm "thường". Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://viva.pressbooks.pub/openmusictheory/chapter/phrase-archetypes-unique-forms/" ]
    luot_2_ghi_chu: "OMT: phrase hướng về đích, thường là cadence."
  - id: n19
