  - id: n21
    cau: 'Câu trả lời (consequent): thường bắt đầu giống câu hỏi, nhưng kết thúc bằng kết mạnh hơn, thường là kết trọn.'
    loai: dinh-nghia
    nguon:
      - omt-phrase
      - omt-gloss
      - uci-theme
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bắt đầu giống câu hỏi, nhưng kết thúc bằng kết trọn". Chữ mới thêm "thường" hai chỗ và "kết mạnh hơn". OMT: consequent "ends with a stronger cadence, usually a perfect authentic cadence (PAC)"; chú thích 3: chỉ period "song song" mới có câu sau bắt đầu giống câu trước, còn "contrasting period" bắt đầu khác nhưng rất hiếm. UCI: "usually a perfect authentic cadence". Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/phrase-archetypes-unique-forms/", "https://pressbooks.nebraska.edu/openmusictheory/?p=296" ]
    luot_2_ghi_chu: Consequent kết mạnh hơn, thường PAC; OMT nói 'parallel period' consequent bắt đầu giống antecedent.
  - id: n22
    cau: 'Ode to Joy của Beethoven là một ví dụ: câu đầu dừng ở Rê (thuộc hợp âm V, kết nửa), câu sau giống câu đầu ở ba ô nhịp đầu nhưng kết ở Đô (chủ âm, kết trọn).'
    loai: dinh-nghia
    nguon:
      - mutopia-ode
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "... là ví dụ hoàn hảo: câu đầu dừng ở Rê (thuộc hợp âm V, kết nửa), câu sau giống hệt nhưng kết ở Đô (chủ âm, kết trọn)." Đối chiếu bản Mutopia ode.ly (Sol trưởng; soprano: B B C D | D C B A | G G A B | B. A A2 || B B C D | D C B A | G G A B | A. G G2): ba ô đầu hai câu giống nhau, ô cuối khác (câu đầu dừng ở bậc 2, la; câu sau về chủ âm, sol), tức Rê và Đô sau khi chuyển về Đô trưởng. "Giống hệt" sai; "ví dụ hoàn hảo" là lời khen không kiểm được. Hợp âm: bản Mutopia có đủ bè SATB; ở cuối câu đầu soprano a, alto fis, tenor d (D – Fa♯ – A, tức hợp âm V của Sol trưởng): kết nửa; ở cuối câu sau soprano g, alto d, tenor b (G – Si – Rê, tức I): kết trọn. Xem thêm khuong_nhac khối 5. Review D3-gom: chữ mới có trên trang; lượt 2 đọc cùng bản Mutopia (mutopiaproject.org) và cho cùng kết luận; khối abc 5 (dòng 73–82) khớp: câu đầu dừng ở Rê, câu sau kết ở Đô; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly" ]
    luot_2_ghi_chu: "Mutopia (Beethoven, Ode to Joy, Sol trưởng): câu 1 B B C D D C B A G G A B B. A A (dừng ở La = bậc 2, bass Rê = V); câu 2 giống ba ô đầu rồi kết A G G (dừng ở Sol = chủ âm, bass D về G). Tên nốt trên trang ứng với Đô trưởng (bậc 2 = Rê, bậc 1 = Đô)."
