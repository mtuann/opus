    ket_qua: dung
    ghi_chu: 'Trích đoạn tác phẩm thật: Beethoven, Giao hưởng số 9, chương 4, giai điệu Ode to Joy (8 ô nhịp đầu), đối chiếu với bản Mutopia ode.ly (L. V. Beethoven, public domain; bản này ở Sol trưởng, giai điệu soprano B B C D | D C B A | G G A B | B. A A2 || B B C D | D C B A | G G A B | A. G G2). Khối abc ở Đô trưởng, M:4/4, L:1/4: E E F G | G F E D | C C D E | E3/2 D/ D2 | E E F G | G F E D | C C D E | D3/2 C/ C2: dịch xuống từ Sol về Đô, đúng từng nốt và độ dài (30 nốt, 8 ô). Hợp âm ghi trên khối (C, G, C, G | C, G, C, G rồi C): ô 4 hợp âm G khi giai điệu dừng ở Rê = bậc V, kết nửa; ô 8 về C ở nốt Đô = chủ âm, kết trọn; khớp các bè alto, tenor của bản Mutopia (cuối câu đầu: soprano a, alto fis, tenor d = hợp âm V của Sol trưởng; cuối câu sau: soprano g, alto d, tenor b = I). Hồ sơ 04-nhip.yml (lượt D3-L1) đã đối chiếu chính giai điệu này với ba bản phổ gốc. Khác bản gốc: chuyển Rê trưởng sang Đô trưởng, viết nhịp 4/4 (bản gốc alla breve); trang này không nói tốc độ. Không cảnh báo abcjs.'
doi_chu:
  - cu: Êm, trang nghiêm
    moi: Về chủ âm thẳng từ IV, không qua V
    ly_do: 'n11 (da-sua): "Êm, trang nghiêm" là cảm nhận chủ quan, không nguồn nào nói; thay bằng điều kiểm được từ định nghĩa kết plagal IV–I (Concise Oxford Dictionary of Music, Britannica, OMT).'
  - cu:
      - "Một câu nhạc (phrase) thường dài 4 ô nhịp và kết thúc bằng một kết. Hai câu ghép lại thành một đoạn nhạc (period):"
      - "Câu hỏi (antecedent): kết thúc bằng kết nửa, tạo cảm giác chưa xong."
      - "Câu trả lời (consequent): bắt đầu giống câu hỏi, nhưng kết thúc bằng kết trọn."
      - "Ode to Joy của Beethoven là ví dụ hoàn hảo: câu đầu dừng ở Rê (thuộc hợp âm V, kết nửa), câu sau giống hệt nhưng kết ở Đô (chủ âm, kết trọn)."
      - Bạn sẽ gặp cấu trúc câu hỏi – câu trả lời ở khắp nơi trong nhạc thời kỳ Cổ điển, đặc biệt ở Mozart và Haydn.
    moi:
      - "Một câu nhạc (phrase) thường dài 4, 8 hoặc 16 ô nhịp và thường kết thúc bằng một kết. Hai câu ghép lại thành một đoạn nhạc (period):"
      - "Câu hỏi (antecedent): thường kết thúc bằng kết nửa, tạo cảm giác chưa xong."
      - "Câu trả lời (consequent): thường bắt đầu giống câu hỏi, nhưng kết thúc bằng kết mạnh hơn, thường là kết trọn."
      - "Ode to Joy của Beethoven là một ví dụ: câu đầu dừng ở Rê (thuộc hợp âm V, kết nửa), câu sau giống câu đầu ở ba ô nhịp đầu nhưng kết ở Đô (chủ âm, kết trọn)."
      - Bạn sẽ gặp cấu trúc câu hỏi – câu trả lời thường xuyên trong nhạc cổ điển phương Tây.
    ly_do: 'n17, n18 (da-sua): OMT, The Phrase, Archetypes, and Unique Forms: "phrases of 4, 8, or 16 measures are particularly common"; Glossary: phrase là ý nhạc có hướng tới một đích, "often a cadence". Không nguồn nào nói câu nhạc luôn 4 ô hay luôn kết bằng kết.; n20 (da-sua): OMT: antecedent kết bằng kết yếu hơn, "usually a half cadence"; không phải lúc nào cũng vậy (có khi là kết chưa trọn).; n21 (da-sua): OMT: consequent kết bằng kết mạnh hơn, "usually a perfect authentic cadence"; chú thích 3: chỉ đoạn nhạc "song song" mới có câu sau bắt đầu giống câu trước, còn "contrasting period" (hiếm) thì khác.; n23 (da-sua): OMT nói các hình thức cấp câu "appear frequently in common-practice music" (khoảng hai trăm năm trước năm 1900); không nguồn nào đọc được nói riêng về Mozart và Haydn, nên bỏ tên hai người.; n22 (da-sua): ô nhịp cuối của hai câu khác nhau (câu đầu Mi – Rê – Rê, câu sau Rê – Đô – Đô; đối chiếu bản Mutopia ode.ly và khối abc), nên "giống hệt" sai: chỉ ba ô đầu giống nhau. "ví dụ hoàn hảo" là lời khen, không kiểm được; đổi thành "một ví dụ".; n23 (da-sua, review D3-gom): mốc "trước năm 1900" không có nguồn bậc 1–2 nói thẳng; OMT, The Phrase, Archetypes, and Unique Forms chỉ nói "appear frequently in common-practice music".'
