ghi_chu: 'Bài nhạc lý 13 (kết và câu nhạc). Nguồn chính: Open Music Theory (OMT), Introduction to Harmony, Cadences, and Phrase Endings (bản Pressbooks, đối chiếu LibreTexts 4.1 vì Pressbooks lúc đầu không mở được), The Phrase, Archetypes, and Unique Forms (đọc từng câu trích), Plagal Motion, Glossary; Encyclopaedia Britannica (Cadence) và Concise Oxford Dictionary of Music (qua Encyclopedia.com) cho plagal, "Amen", deceptive/interrupted; tài liệu Theme Form của Đại học California Irvine cho kết của câu trả lời; bản Mutopia ode.ly và IMSLP K. 467 cho ví dụ. WebFetch ngày 27/10/2026 (bản tóm tắt chữ, không phải HTML thô). Sửa chữ ở lượt 1: (1) ô "Êm, trang nghiêm" của kết plagal thành "Về chủ âm thẳng từ IV, không qua V" (cảm nhận chủ quan); (2) "câu nhạc thường dài 4 ô nhịp và kết thúc bằng một kết" thành "dài 4, 8 hoặc 16 ... thường kết thúc bằng một kết"; (3) câu hỏi, câu trả lời: thêm "thường", câu trả lời "kết mạnh hơn, thường là kết trọn" (sửa cả phần giải thích câu quiz 4); (4) câu về Ode to Joy: bỏ "hoàn hảo" và "giống hệt" (ô cuối của hai câu khác nhau); (5) "ở khắp nơi trong nhạc thời kỳ Cổ điển, đặc biệt ở Mozart và Haydn" thành "thường xuyên trong nhạc cổ điển phương Tây trước năm 1900"; (6) mục Nguồn (thay link chung và musictheory.net bằng các nguồn đã mở). Hai chữ lớn không kiểm được tới tận gốc mà giữ lại vì là cách ví của site, ghi rõ ở n4, n6, n8, n14: ví từng loại kết với dấu chấm hết, chấm phẩy, phẩy hay hỏi, và "như một câu hỏi". Khối abc: bốn khối soạn (I–IV–V–I; I–vi–IV–V; I–V–IV–I; I–V–V7–vi), một trích đoạn Ode to Joy; khối 4 dùng V7 chứ không phải V thuần (không sai kết lừa). Không tính là nhận định: tiêu đề mục, tiêu đề cột bảng "Loại, Hợp âm, Giống dấu câu, Cảm giác" (gộp vào n2-n16), chữ "Kết trọn:", "Kết nửa —" ... đứng trước khối abc đã tính ở n14-n16. Thuật ngữ tiếng Việt chưa có trong src/data/thuat-ngu.yml (cho D3-L5): "kết trọn / kết chưa trọn / kết nửa / kết plagal / kết lừa", "câu hỏi / câu trả lời" (antecedent / consequent), "đoạn nhạc" (period); đã có: cadence ("Kết"), phrase ("Câu nhạc"). Việc trang gọi hai câu ghép là "đoạn nhạc (period)" trùng chữ "đoạn" với section/period dùng ở trang khác (cần D3-L5 xem).'
