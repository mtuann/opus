    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Period: A phrase-level form that consists of two phrases: an antecedent and a consequent."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://viva.pressbooks.pub/openmusictheory/chapter/phrase-archetypes-unique-forms/" ]
    luot_2_ghi_chu: "OMT: period = hai câu, antecedent + consequent."
  - id: n20
    cau: 'Câu hỏi (antecedent): thường kết thúc bằng kết nửa, tạo cảm giác chưa xong.'
    loai: dinh-nghia
    nguon:
