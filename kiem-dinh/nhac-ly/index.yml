    luot_2_ghi_chu: 'Mục lục OMT bản đầu có "Post-tonal music": Set theory (pitch-class sets, normal order...), "Analyzing atonal music", Twelve-tone. Không mở được mục lục bản Pressbooks hiện tại, nên chưa kiểm câu ở bản đó.'
