khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem: &id001
      - cu-phap
      - nhip
      - giong
      - not
    ket_qua: dung
    ghi_chu: 'Đơn âm: C D E C, C D E C, E F G, E F G đúng giai điệu Frère Jacques; 4 ô, mỗi ô 8/8. Giai điệu quen thuộc, không kiểm nguồn (xem n5).'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
      - hop-am
    ket_qua: dung
    ghi_chu: 'Chủ điệu: giai điệu trên, bè đệm là dyad Đô-Sol (ô 1-2, nửa đầu ô 3-4) và Si trầm-Sol (nửa sau ô 3 và 4, như V). Đệm chỉ là dyad, không phải hợp âm ba đầy đủ; đủ cho ý "giai điệu có đệm". Kiểu đệm là hợp âm cùng tiết tấu, không phải hình rải Alberti như trong chữ.'
  - khoi: 3
    loai: vi-du-soan
    kiem: *id001
    ket_qua: dung
    ghi_chu: Canon hai bè ở quãng đồng âm, bè 2 vào sau hai ô, đúng khái niệm canon (COD). Hình texture-rolls vẽ bè 2 thấp hơn một quãng tám, khác ví dụ này (ghi nhận, không phải lỗi).
  - khoi: 4
    loai: vi-du-soan
    kiem: *id001
    ket_qua: dung
    ghi_chu: 'Dị âm: bè 2 là giai điệu cao hơn một quãng tám, thêm nốt láy mỗi nốt, nốt chủ đạo (C,D,E,C / E,F,G) vẫn ở đúng phách. 8 phách mỗi ô.'
doi_chu:
  - cu: "Kết cấu (texture) mô tả có bao nhiêu đường nét âm nhạc vang lên cùng lúc và chúng liên hệ với nhau thế nào. Nó giống như cách dệt của một tấm vải: một sợi, nhiều sợi song song, hay nhiều sợi đan chéo. Đây là một trong những manh mối nhanh nhất để nhận diện thời kỳ: nghe kết cấu, bạn thường đoán được nhạc thuộc Trung cổ, Baroque hay Cổ điển chỉ sau vài giây."
    moi: "Kết cấu (texture) mô tả có bao nhiêu đường nét âm nhạc vang lên cùng lúc và chúng liên hệ với nhau thế nào. Nó giống như cách dệt của một tấm vải: một sợi, nhiều sợi song song, hay nhiều sợi đan chéo. Đây là một trong những manh mối để nhận diện thời kỳ: đơn âm thường gặp ở nhạc Trung cổ, phức điệu ở nhạc Phục hưng và Baroque, chủ điệu ở nhạc Cổ điển và Lãng mạn."
    ly_do: 'n3 (da-sua): bỏ lời hứa "sau vài giây", giữ khuynh hướng có nguồn.'
  - cu: "Gặp ở: phần lớn nhạc Cổ điển và Lãng mạn, thánh ca, gần như mọi bài hát pop."
    moi: "Gặp ở: nhiều nhạc Cổ điển và Lãng mạn, thánh ca, rất nhiều bài hát pop."
