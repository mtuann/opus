    ket_qua: dung
    ghi_chu: 'IMSLP: Syrinx (1913), cho flute solo.'
  - id: n10
    cau: Phần mở đầu một fugue, chủ đề vang lên một mình, là đơn âm
    loai: cau-truc
    nguon:
