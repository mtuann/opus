nhan_dinh:
  - id: n1
    cau: Kết cấu mô tả có bao nhiêu đường nét âm nhạc vang cùng lúc và chúng liên hệ nhau thế nào
    loai: dinh-nghia
    nguon:
      - omt-tex
      - clark-tex
      - ithaca
    ket_qua: dung
  - id: n2
    cau: 'So sánh với cách dệt của tấm vải: một sợi, nhiều sợi song song, hay đan chéo'
    loai: dinh-nghia
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Phép ví von, không phải nhận định.
  - id: n3
    cau: 'Kết cấu là manh mối nhận diện thời kỳ: đơn âm thường gặp ở Trung cổ, phức điệu ở Phục hưng và Baroque, chủ điệu ở Cổ điển và Lãng mạn'
    loai: lich-su
    nguon:
      - omt-tex
      - clark-tex
      - lumen-tex
    ket_qua: da-sua
    ghi_chu: Bản gốc "manh mối nhanh nhất ... đoán được chỉ sau vài giây" (cường điệu); thay bằng gắn kết cấu với thời kỳ, đúng ở mức khuynh hướng.
  - id: n4
    cau: 'Có bốn loại kết cấu: đơn âm, chủ điệu, phức điệu, dị âm'
    loai: danh-muc
    nguon:
      - omt-tex
      - clark-tex
    ket_qua: dung
    ghi_chu: OMT liệt kê đơn âm, dị âm, chủ điệu, phức điệu.
  - id: n5
    cau: Tất cả ví dụ dùng cùng giai điệu Frère Jacques
    loai: dinh-nghia
    nguon: []
    ket_qua: null
    ghi_chu: 'Chưa chắc: không có nguồn bậc 1-2 đọc được cho giai điệu; ví dụ dùng C D E C, C D E C, E F G, E F G đúng như bài hát quen thuộc. Chủ repo cân nhắc nguồn.'
  - id: n6
    cau: 'Đơn âm: một giai điệu duy nhất, không đệm'
    loai: dinh-nghia
    nguon:
      - omt-tex
      - cod-mono
      - clark-tex
    ket_qua: dung
  - id: n7
    cau: Nhiều người cùng hát một giai điệu, kể cả cách nhau quãng 8, vẫn là đơn âm
    loai: dinh-nghia
    nguon:
      - omt-tex
      - wiki-tex
    ket_qua: dung
    ghi_chu: OMT tính cả đơn âm có nhân đôi ở quãng 8; Wikipedia xác nhận.
  - id: n8
    cau: Thánh ca Gregorian là đơn âm
    loai: lich-su
    nguon:
