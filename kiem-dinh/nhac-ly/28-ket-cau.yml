ghi_chu: 'Hình texture-rolls (src/components/hinh/texture-rolls.html) đã đối chiếu: 14 nốt giai điệu đúng (C D E C C D E C E F G(dài) E F G(dài)), cao độ tỉ lệ đúng; chủ điệu có tam hợp C-C-C-C-C-G-C-G dưới giai điệu; canon bè 2 vào sau hai ô ở thấp hơn một quãng tám; dị âm bè 2 cao hơn một quãng tám có láy. Không có lỗi sai kiến thức. Khác ví dụ abc: canon vẽ ở quãng 8, chủ điệu vẽ tam hợp trong khi abc dùng dyad, dị âm bè 2 có láy khác chữ abc; các điểm này chấp nhận được vì hình chỉ minh họa kết cấu. Chưa chắc: Frère Jacques (n5), dị âm hiếm ở phương Tây (n22), Érudit chỉ đọc tóm tắt.'
