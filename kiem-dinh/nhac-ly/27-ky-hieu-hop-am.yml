  - id: n22
    cau: Ba hợp âm đầu của vòng Canon Pachelbel (I-V-vi-iii-IV...) giống I-V-vi-IV
    loai: cau-truc
    nguon:
      - omt-4c
      - mount26
    ket_qua: dung
    ghi_chu: 'Pachelbel: I-V-vi-iii-IV-I-IV-V; ba hợp âm đầu I-V-vi trùng. Cũ ghi "nửa đầu", không đúng (nửa đầu có iii). Review D3-gom: lượt 2 cho sai vì đọc câu trong hồ sơ như thể vòng Canon là I–V–vi–IV; "câu đúng" lượt 2 đưa ra (ba hợp âm đầu I–V–vi trùng, hợp âm thứ tư của Canon là iii) chính là điều trang nói: "Ba hợp âm đầu giống vòng hợp âm Canon của Pachelbel (I – V – vi – iii – IV…)". Review mở lại Mount 26 (https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/26-other-diatonic-sequences/): Canon có "the order of harmonies (I–V–vi–iii–IV–I)". Trang đúng, giữ.'
    luot_2: sai
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Pachelbel%27s_Canon", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.10%3A_Ground_Bass" ]
    luot_2_ghi_chu: "câu đúng: Ba hợp âm đầu của vòng Canon Pachelbel (I-V-vi) trùng với ba hợp âm đầu của I-V-vi-IV; hợp âm thứ tư của Canon là iii, rồi mới tới IV (I-V-vi-iii-IV-I-IV-V).; Canon của Pachelbel: I-V-vi-iii-IV-I-IV-V. Ba hợp âm đầu I-V-vi trùng với I-V-vi-IV, nhưng hợp âm thứ tư là iii, không phải IV. Nguồn chính chỉ Wikipedia (bass D-A-B-F♯-G-D-G-A); chưa mở được bản nhạc."
  - id: n23
    cau: ii-V-I là nền tảng của hòa âm jazz và là kết trọn có hợp âm hạ át (ii) đứng trước V trong nhạc cổ điển
    loai: cau-truc
    nguon:
      - omt-cs
      - omt-fb
    ket_qua: da-sua
    ghi_chu: 'Chưa tìm nguồn nêu chữ "nền tảng"; OMT dùng ii-V-I làm tiến hành jazz chuẩn. Liên kết bài 12. Review D3-gom (thuật ngữ): chữ cũ "Kết trọn có tiền át", chữ mới "Kết trọn có hợp âm hạ át (ii) đứng trước V". Lý do: quyết định thuật ngữ 27/10/2026 (chức năng predominant gọi là "hạ át"; bài 12 đã khóa: ii thuộc nhóm hạ át). Lượt 2 đã xác nhận nội dung (OMT 4.3: predominant ii đứng trước V rồi I).'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/06:_Jazz/6.04:_iiVI", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/33-chromatic-pre-dominants/" ]
    luot_2_ghi_chu: "OMT: ii-V-I là một trong những tiến trình quan trọng nhất của jazz; ii là hạ át trước V trong nhạc cổ điển."
