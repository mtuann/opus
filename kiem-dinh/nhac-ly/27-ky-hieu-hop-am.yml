khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - hop-am
      - not
    ket_qua: dung
    ghi_chu: '10 hợp âm trên Đô, mỗi hợp âm đúng ký hiệu và nốt: C, Cm, C7, Cmaj7, Cm7, Cø [C_E_G_B], C°7 [C_E_G__B] (Si giáng kép = La), Csus4, Cadd9 [CEGd], C/E [EGc]. M:none nên hai ô cuối cho mỗi dòng không cần độ dài. Không có block nào về C9, 6, sus2, aug, dim.'
doi_chu:
  - cu: "Nhiều người đến với nhạc cổ điển từ guitar đệm hát hoặc piano pop, và đã quen những ký hiệu như Am, G7, Cmaj7, F/A. Bài này nối hai thế giới: mỗi ký hiệu pop tương ứng với khái niệm nào đã học, và ngược lại."
    moi: "Guitar đệm hát và piano pop ghi hợp âm bằng những ký hiệu như Am, G7, Cmaj7, F/A. Bài này nối hai thế giới: mỗi ký hiệu pop tương ứng với khái niệm nào đã học, và ngược lại."
    ly_do: "n1 (da-sua): bỏ khẳng định không nguồn về người học."
  - cu:
      - Hàng nghìn bài hát pop từ thập niên 2000
      - Gần giống nửa đầu vòng hợp âm Canon của Pachelbel (I – V – vi – iii – IV…)
    moi:
      - Vòng hợp âm quen thuộc của nhạc pop, thường lặp suốt cả bài
      - Ba hợp âm đầu giống vòng hợp âm Canon của Pachelbel (I – V – vi – iii – IV…)
    ly_do: 'n21 (da-sua): số liệu "hàng nghìn từ 2000" không có nguồn.; n22 (da-sua): chỉ ba hợp âm đầu I-V-vi trùng.'
  - cu: Một dạng biến tấu trên vòng hợp âm cố định, giống tinh thần passacaglia
    moi: Một vòng hợp âm cố định lặp lại cho mỗi khổ thơ, cùng ý tưởng lặp một khuôn cố định như passacaglia
    ly_do: 'n26 (da-sua): nói đúng điều blues làm, bỏ "biến tấu" mơ hồ.'
  - cu: Kết hoành tráng trong nhạc rock, nhạc phim
    moi: Kết hoành tráng trong nhạc phim (cadence Aeolian, còn gọi là Mario cadence)
    ly_do: 'n28 (da-sua): bỏ "nhạc rock" (không nguồn); thêm tên cadence Aeolian.'
  - cu: Jazz coi hợp âm bảy, chín, mười một là bình thường và ổn định; nhạc Cổ điển coi hợp âm bảy là căng thẳng cần giải quyết.
    moi: Jazz dùng hợp âm bảy, chín, mười một một cách thường xuyên, và hợp âm bảy trưởng hay thứ có thể thay cho hợp âm ba; nhạc Cổ điển coi nốt bảy là một nốt nghịch tai cần giải quyết.
    ly_do: 'n32 (da-sua): đổi "bình thường và ổn định" thành mô tả cụ thể; n34 (da-sua): chính nốt bảy là nốt nghịch tai.'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Chord Symbols; Figured Bass and Roman Numerals with Figures; 4-Chord Schemas; Blues Harmony; Modal Mixture; Popular Music, chương về mode trong nhạc pop (bản đặt tại Đại học Nebraska); Altered and Extended Chords."
      - "Andre Mount, Fundamentals, Function, and Form: 26. Other Diatonic Sequences."
      - "Robert Hutchinson, Music Theory for the 21st-Century Classroom: 12.4 The 12-Bar Blues."
      - "Roger Williams University, Western Harmonic Practice I: Harmonic Dissonance II: The Seventh Chord."
      - "Iowa State University, Comprehensive Musicianship: 5.4 Figured Bass Notation: Tutorial."
      - "The Open University, Discovering music: the blues: 12.3 12-bar blues."
      - 'Trevor De Clercq, "The Nashville Number System: A Framework for Teaching Harmony in Popular Music", Journal of Music Theory Pedagogy 33 (2019).'
      - "The Concise Oxford Dictionary of Music (Encyclopedia.com): chaconne."
    ly_do: 'Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net).'
  - cu: "mô tả: Nhiều người đến với nhạc cổ điển từ guitar đệm hát hoặc piano pop, và đã quen những ký hiệu như Am, G7, Cmaj7, F/A. Bài này nối hai thế giới: mỗi ký hiệu pop…"
    moi: "mô tả: Guitar đệm hát và piano pop ghi hợp âm bằng những ký hiệu như Am, G7, Cmaj7, F/A. Bài này nối hai thế giới: mỗi ký hiệu pop tương ứng với khái niệm nào đã…"
    ly_do: 'Mô tả trang lấy từ đoạn mở đầu, đổi theo chỗ sửa ở đoạn ấy (lượt 1 D3-L4, xem nhận định của đoạn mở đầu).'
