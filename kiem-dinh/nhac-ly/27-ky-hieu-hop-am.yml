doi_chu:
  - cu: "Nhiều người đến với nhạc cổ điển từ guitar đệm hát hoặc piano pop, và đã quen những ký hiệu như Am, G7, Cmaj7, F/A. Bài này nối hai thế giới: mỗi ký hiệu pop tương ứng với khái niệm nào đã học, và ngược lại."
    moi: "Guitar đệm hát và piano pop ghi hợp âm bằng những ký hiệu như Am, G7, Cmaj7, F/A. Bài này nối hai thế giới: mỗi ký hiệu pop tương ứng với khái niệm nào đã học, và ngược lại."
    ly_do: "n1 (da-sua): bỏ khẳng định không nguồn về người học."
