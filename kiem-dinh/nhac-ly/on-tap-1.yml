# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa nhac-ly/on-tap-1
trang: src/content/docs/nhac-ly/on-tap-1.md
nguon_cu: ../opus-zero/docs/nhac-ly/on-tap-1.md
tang: loi
lan:
  - so: 1
    ngay: '2026-10-28'
    nhanh: moi/d3-l5
    ma_bam: null
    nguoi:
      luot_1: "Claude Sonnet 5.5 (D3-L5 lượt 1, trang)"
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: "Bài ôn tập 1 (bài 1–5), tầng lõi: một quiz 10 câu (n4 đến n13) và vài câu về trang (n1 đến n3). Nguồn: Open Music Theory (Half Steps, Notating Rhythm, Compound Meter), Mount ch. 5 (Pitch), UNSW (A4 = 440 Hz), ISO 16. Đã sửa một câu hỏi (n8: câu mơ hồ về Fa♯). Lời giải thích trong quiz không dựa vào vị trí lựa chọn. Không có khuông nhạc. Câu ve-site trỏ trang chưa chuyển: n3 (luyen-tap/phieu-bai-tap: giữ hai loại phiếu gọi tên nốt khóa Sol và khóa Fa). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): middle C (Đô giữa), dotted note (nốt chấm dôi), tie (dấu nối), eighth note và sixteenth note (nốt móc đơn, móc kép), half note (nốt trắng). Đã có: ledger-line, clef, accidental, enharmonic, time-signature, compound-meter, measure, beat, pitch."
nguon:
  - id: mount5
    bac: 2
    ten: "Andre Mount, Fundamentals, Function, and Form (SUNY Geneseo), 5. Pitch"
    link: "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/5-pitch/"
  - id: omt-halfwhole
    bac: 2
    ten: "Open Music Theory, Half Steps, Whole Steps, and Accidentals"
    link: "https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/"
  - id: omt-rhythm
    bac: 2
    ten: "Open Music Theory, Notating Rhythm"
    link: "https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"
  - id: omt-simple
    bac: 2
    ten: "Open Music Theory, Simple Meter and Time Signatures"
    link: "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
  - id: omt-compound
    bac: 2
    ten: "Open Music Theory, Compound Meter and Time Signatures"
    link: "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"
  - id: unsw-notes
    bac: 2
    ten: "UNSW Music Acoustics, Note names, MIDI numbers and frequencies"
    link: "https://newt.phys.unsw.edu.au/jw/notes.html"
  - id: iso16
    bac: 1
    ten: "ISO 16:1975, Acoustics — Standard tuning frequency (Standard musical pitch)"
    link: "https://www.iso.org/standard/3601.html"
nhan_dinh:
  - id: n1
    cau: "Bài ôn gồm kiến thức của cả phần bài 1–5 (Phần 1: Đọc nhạc), làm sau khi xong bài 5."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trên src/content/docs/nhac-ly/index.md: Phần 1 gồm bài 1 đến 5, rồi \"Ôn tập 1: Đọc nhạc\"; các câu hỏi dùng nội dung bài 1 đến 5 (khóa, nốt, trường độ, nhịp, dấu hóa, tần số A4)."
  - id: n2
    cau: "Nên làm lại bài ôn sau một tuần; trả lời đúng khi đã quên bớt mới là dấu hiệu bạn thật sự nhớ."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: "Lời khuyên học tập (nhắc lại cách quãng), không thuộc loại sức khỏe; không trái với các trang lõi khác."
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên học (lặp lại ngắt quãng), phổ biến và vô hại.
  - id: n3
    cau: "Trước khi làm quiz nên tự làm phiếu bài tập \"gọi tên nốt khóa Sol và khóa Fa\" ra giấy; phiếu ấy ở trang luyen-tap/phieu-bai-tap."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trên site cũ ../opus-zero/docs/luyen-tap/phieu-bai-tap.md (bộ tạo phiếu) và assets/js/worksheet.js: có hai loại \"Gọi tên nốt khóa Sol\" và \"Gọi tên nốt khóa Fa\". Trang luyen-tap/phieu-bai-tap chưa chuyển: lô chuyển nó giữ hai loại phiếu ấy (và \"Đọc hóa biểu\", \"Gọi tên quãng (hòa âm)\", \"Gọi tên hợp âm ba\" cho on-tap-2 và on-tap-3)."
  - id: n4
    cau: "Nốt nằm trên dòng kẻ phụ ngay dưới khuông khóa Sol là Đô giữa (C4), không phải Si (B3) hay Rê (D4); Đô giữa cũng là dòng kẻ phụ ngay trên khuông khóa Fa."
    loai: dinh-nghia
    nguon: [ mount5 ]
    ket_qua: dung
    ghi_chu: "Mount ch. 5: cạnh khóa Sol \"middle C is on the first ledger line below the staff\"; cạnh khóa Fa \"middle C is on the first ledger line above the staff\"."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/pitches.html" ]
    luot_2_ghi_chu: 'OMT: "middle C (the first ledger line above the bass staff or the first ledger line below the treble staff) is C4".'
  - id: n5
    cau: "Trong khóa Fa, khe thứ 3 tính từ dưới lên là Mi (không phải Rê hay Fa); các khe khóa Fa: La – Đô – Mi – Sol."
    loai: dinh-nghia
    nguon: [ mount5 ]
    ket_qua: dung
    ghi_chu: "Mount ch. 5: các khe của khóa Fa là A, C, E, G (\"All Cows Eat Grass\"); khe thứ ba là E."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/clef" ]
    luot_2_ghi_chu: "Britannica: khóa Fa cố định ở dòng thứ hai từ trên xuống (dòng 4 từ dưới); dòng khuông Fa: Sol Si Rê Fa La, nên các khe từ dưới lên là La, Đô, Mi, Sol: khe thứ 3 = Mi."
  - id: n6
    cau: "Một ô nhịp 3/4 có thể gồm một nốt trắng và một nốt đen (2 + 1 = 3 phách), không phải hai nốt trắng hay một nốt tròn."
    loai: quy-tac
    nguon: [ omt-rhythm, omt-simple ]
    ket_qua: dung
    ghi_chu: "OMT Simple Meter: \"the top number of a time signature represents the number of beats in each measure\"; số 4 dưới: \"the quarter note gets the beat\". OMT Notating Rhythm: nốt trắng gồm hai nốt đen. Tính: 2 + 1 = 3 phách; hai nốt trắng = 4, nốt tròn = 4."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/meter.html", "https://openmusictheory.github.io/rhythmicValues.html" ]
    luot_2_ghi_chu: 3/4 = 3 phách đen; nốt trắng (2) + nốt đen (1) = 3 (OMT rhythmic values, meter).
  - id: n7
    cau: "Nốt trắng chấm dôi nối (dấu nối) với nốt đen dài 4 phách (3 + 1), không phải 3 hay 3 rưỡi."
    loai: quy-tac
    nguon: [ omt-rhythm ]
    ket_qua: dung
    ghi_chu: "OMT Notating Rhythm: \"A dot increases the duration of a note by half\" (nốt trắng 2 phách + 1 = 3 phách); \"ties are used to combine the durations of multiple notes\" (3 + 1 = 4)."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/rhythmicValues.html" ]
    luot_2_ghi_chu: "OMT: dấu chấm tăng nửa giá trị, dấu nối cộng thời gian: nốt trắng chấm (3) + đen (1) = 4 phách."
  - id: n8
    cau: "Trong một ô nhịp, nốt Fa đầu tiên có dấu thăng (Fa♯); nốt Fa thứ hai cùng quãng tám, không có dấu, trong ô nhịp ấy là Fa♯ (không phải Fa tự nhiên); dấu hóa bất thường còn hiệu lực đến hết ô nhịp, với các nốt cùng vị trí trên khuông."
    loai: quy-tac
    nguon: [ mount5 ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Trong một ô nhịp có Fa♯ ở đầu, nốt Fa thứ hai (không có dấu) cùng ô nhịp là gì?\" mơ hồ: \"Fa♯ ở đầu\" có thể hiểu là hóa biểu, và không nói cùng quãng tám. Giải thích cũ \"còn hiệu lực đến hết ô nhịp\" thêm \"với các nốt cùng vị trí trên khuông\". Mount ch. 5: dấu hóa có hiệu lực \"for the remainder of the measure in which it appears unless otherwise indicated\", áp cho nốt ở \"that line or space\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/accidental" ]
    luot_2_ghi_chu: 'Britannica: "an accidental carries through the measure in which it occurs" (thực hành hiện đại). Hiệu lực cho cùng cao độ (cùng quãng tám) như câu viết.'
  - id: n9
    cau: "Mi♯ trên piano là phím trắng Fa (không phải phím đen); không có phím đen giữa Mi và Fa, Mi nâng nửa cung là Fa."
    loai: dinh-nghia
    nguon: [ omt-halfwhole ]
    ket_qua: dung
    ghi_chu: "OMT: \"F is also known as E♯\"; \"Two pairs of white keys—E/F and B/C—do not have black keys in between them.\""
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/pitches.html" ]
    luot_2_ghi_chu: "OMT: lớp cao độ chung một phím là tương đương đồng âm; Mi-Fa không có phím đen giữa nên Mi♯ = Fa (cùng lập luận như C♭ = B trong OMT)."
  - id: n10
    cau: "Nhịp 6/8 có 6 nốt móc đơn mỗi ô nhịp (không phải 3 hay 8), nhóm thành hai phách lớn."
    loai: quy-tac
    nguon: [ omt-compound ]
    ket_qua: dung
    ghi_chu: "OMT Compound Meter: 6/8 là nhịp kép hai phách, mỗi phách chia ba, đơn vị chia là nốt móc đơn; \"the top number (6) means that each measure will contain six divisions\"."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/meter.html" ]
    luot_2_ghi_chu: 'OMT: ở nhịp ghép "the beat is always three times as long as the division note": 6/8 = hai phách, mỗi phách chia ba móc đơn = 6 móc đơn mỗi ô.'
  - id: n11
    cau: "A4 có tần số 440 Hz (chuẩn phổ biến); 261,6 Hz là Đô giữa, 880 Hz là A5."
    loai: so-lieu
    nguon: [ unsw-notes, iso16 ]
    ket_qua: dung
    ghi_chu: "UNSW: \"A4 is often set at 440 Hz\"; công thức f = 440 x 2^((m-69)/12): C4 (MIDI 60) = 261,6 Hz, A5 (MIDI 81) = 880 Hz. ISO 16:1975: tần số của A là 440 Hz."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/notes.html" ]
    luot_2_ghi_chu: "UNSW: A4 = 440 Hz (MIDI 69); công thức 2^(n/12): Đô giữa (C4) = 261,6 Hz; A5 = 880 Hz."
  - id: n12
    cau: "Sol♯ và La♭ là cặp đồng âm khác tên (không phải Sol♯ và La♯, hay Sol và La♭): cùng một phím đen giữa Sol và La."
    loai: dinh-nghia
    nguon: [ omt-halfwhole ]
    ket_qua: dung
    ghi_chu: "OMT: enharmonic equivalence là \"A relationship between notes ... that sound the same but are spelled differently\"; phím đen giữa G và A là G♯/A♭."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/pitches.html" ]
    luot_2_ghi_chu: "OMT: hai lớp cao độ cùng một phím là tương đương đồng âm; Sol♯ và La♭ cùng phím đen giữa Sol và La."
  - id: n13
    cau: "Tám nốt móc kép bằng một nốt trắng (không phải 4 hay 16); nốt trắng = 2 phách, mỗi móc kép = 1/4 phách."
    loai: quy-tac
    nguon: [ omt-rhythm ]
    ket_qua: dung
    ghi_chu: "OMT Notating Rhythm: mỗi giá trị chia đôi giá trị nhỏ hơn: \"a whole note divides into two half notes, four quarter notes, eight eighth notes\", nên nốt trắng = 2 nốt đen = 4 móc đơn = 8 móc kép."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/rhythmicValues.html" ]
    luot_2_ghi_chu: "OMT: mỗi dấu hiệu rút ngắn một nửa: móc kép = 1/4 đen; 8 x 1/4 = 2 phách = nốt trắng."
khuong_nhac: []
doi_chu:
  - cu: "câu hỏi: Trong một ô nhịp có Fa♯ ở đầu, nốt Fa thứ hai (không có dấu) cùng ô nhịp là gì? | ✓ Fa♯ | Fa tự nhiên | Tùy người chơi | Dấu hóa bất thường còn hiệu lực đến hết ô nhịp."
    moi: "câu hỏi: Trong một ô nhịp, nốt Fa đầu tiên có dấu thăng (Fa♯); nốt Fa thứ hai cùng quãng tám, không có dấu, trong ô nhịp ấy là gì? | ✓ Fa♯ | Fa tự nhiên | Tùy người chơi | Dấu hóa bất thường còn hiệu lực đến hết ô nhịp, với các nốt cùng vị trí trên khuông."
    ly_do: 'n8 (da-sua): câu cũ mơ hồ (Fa♯ ở đầu có thể là hóa biểu) và thiếu "cùng quãng tám"; Mount ch. 5.; n8 (da-sua): Mount ch. 5: dấu hóa áp cho nốt "on that line or space".'
