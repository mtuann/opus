khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - truong-do
      - nhip
    ket_qua: dung
    ghi_chu: 'M:4/4, L:1/4, Q:1/4=80, K:C, mọi nốt là C4. abcjs đọc: ô 1 C4 (nốt tròn, 4 phách) | ô 2 C2 C2 (hai nốt trắng) | ô 3 C C C C (bốn nốt đen) | ô 4 tám nốt móc đơn C/ (viết liền thành bốn cặp có gạch ngang): mỗi ô đúng 4 phách, khớp "mỗi ô đều dài 4 phách, chỉ khác cách chia" (n9) và các số phách ở n8. abcjs không cảnh báo.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - truong-do
      - nhip
    ket_qua: dung
    ghi_chu: "M:4/4, L:1/4, K:C. Ô 1: C z C z (đen, lặng đen, đen, lặng đen = 4 phách). Ô 2: C2 z2 (trắng, lặng trắng = 4). Ô 3: C z/ C/ C z (đen, lặng móc đơn, móc đơn, đen, lặng đen = 1 + ½ + ½ + 1 + 1 = 4). Minh họa lặng đen (1 phách), lặng trắng (2) và lặng đơn (½) của n13; abcjs đọc z là lặng. Không có lặng tròn hay lặng kép (trang chỉ nêu chúng ở dòng chữ, không kèm ví dụ). abcjs không cảnh báo."
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - truong-do
      - nhip
    ket_qua: dung
    ghi_chu: "M:4/4, L:1/4, K:C. Ô 1: E3 D = nốt trắng chấm dôi E4 (3 phách) + nốt đen D4 = 4. Ô 2: C3/2 D/ E2 = nốt đen chấm dôi C4 (1½) + móc đơn D4 (½) + nốt trắng E4 (2) = 4. Minh họa đúng nốt trắng chấm dôi = 3 phách và nốt đen chấm dôi = 1½ phách (n15, n16). abcjs không cảnh báo."
  - khoi: 4
    loai: vi-du-soan
    kiem:
      - cu-phap
      - truong-do
      - nhip
    ket_qua: dung
    ghi_chu: 'M:4/4, L:1/4, K:C. Ô 1: C D E G- (bốn nốt đen, G4 có dấu nối "-" sang ô sau) = 4. Ô 2: G4 (nốt tròn G4) = 4. abcjs đọc G4 ở cuối ô 1 có startTie, nối với G4 đầu ô 2: dấu nối giữa hai nốt cùng cao độ, qua vạch nhịp, đúng n17, n18. abcjs không cảnh báo.'
doi_chu:
  - cu: Open Music Theory; musictheory.net.
    moi:
