    ket_qua: dung
    ghi_chu: 'OMT Simple Meter: "We have already encountered ties that can be used to extend a note over a measure line." Nguồn nói "can be used" (dùng được), cùng chương nói thêm dấu nối còn dùng để làm rõ phách trong ô; "thường" ở mức nhẹ, khối abc 4 đúng trường hợp qua vạch nhịp. Giữ.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/, https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: tie dùng để kéo dài nốt qua vạch nhịp ('ties can be used to extend a note over a measure line')."
