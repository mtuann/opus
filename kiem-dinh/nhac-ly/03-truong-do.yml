  - id: n35
    cau: "Hình sau hai gạch đầu dòng của mục \"Dấu chấm dôi\" (::hinh{ten=\"cham-doi\"}) vẽ trên trục 4 phách: nốt trắng chấm dôi là ô 2 phách cộng ô 1 phách (3 phách); nốt đen chấm dôi là ô 1 phách cộng ô ½ phách (1½ phách). Chú thích: phần sau dấu cộng là độ dài chấm dôi thêm vào, một nửa độ dài của chính nốt."
    loai: ve-site
