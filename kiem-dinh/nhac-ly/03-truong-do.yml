ghi_chu: 'Bài nhạc lý 3 (trường độ, hình nốt, dấu lặng, chấm dôi, dấu nối). Nguồn chính: Open Music Theory (OMT), mở từng chương bằng curl ngày 24/10/2026 (WebFetch trả 403); bổ sung MT21C (Puget Sound, 4.2–4.4) và bài giảng Weinreich về âm học piano (Viện Hàn lâm Âm nhạc Hoàng gia Thụy Điển) cho n20. Không sửa chữ của trang (chỉ sửa mục ## Nguồn: thay link chung bằng link từng chương đã dùng, bỏ musictheory.net vì chưa đối chiếu nội dung). Không tính là nhận định: tiêu đề mục; câu hỏi của phần Bài tập (chỉ tính câu trả lời trong khối thu gọn). Câu "trường hợp phổ biến nhất" (n5): suy từ MT21C 4.2 (số chỉ nhịp phổ biến nhất hiện nay là 4/4, phách là nốt đen); OMT chỉ nói số dưới "usually" là 2, 4 hay 8. Thuật ngữ tiếng Việt chưa có trong src/data/thuat-ngu.yml, ghi cho D3-L5: "nốt tròn / trắng / đen / móc đơn / móc kép" (whole, half, quarter, eighth, sixteenth note), "dấu lặng" và "lặng đơn / lặng kép" (cách gọi tắt của lặng móc đơn / móc kép), "chấm dôi" (dot), "dấu nối" (tie), "dấu luyến" (slur), "gạch ngang" (beam), "đuôi" (stem) và "móc" (flag). Đối chiếu "Giáo trình môn Lý thuyết âm nhạc cơ bản" (tệp PDF https://novaspro.vn/upload/files/giao_trinh_mon_ly_thuyet_am_nhac_co_ban.pdf; không ghi tác giả, bậc 3, chỉ để chứng thực cách gọi ở Việt Nam): có "nốt tròn, nốt trắng, nốt đen, nốt móc đơn, nốt móc kép", "dấu lặng" (bảng lặng tròn, trắng, đen, móc đơn, móc kép; bảng thuật ngữ cuối sách: quaver rest = "lặng đơn", semiquaver rest = "lặng kép"), "dấu chấm dôi", "dấu nối", "dấu luyến", "đuôi nốt nhạc" và "nét móc ở đuôi nốt nhạc"; cái tương ứng với beam là "vạch nối đuôi nốt nhạc" (không có "gạch ngang"). Chú ý trùng chữ: thuat-ngu.yml mô tả dấu tenuto là "gạch ngang ngắn trên nốt", nên "gạch ngang" (beam) ở trang này dễ lẫn: D3-L5 chọn tên khác cho beam (như "vạch nối đuôi nốt") hay giữ và thêm "(beam)".'
nguon:
  - id: omt-notation
    bac: 2
    ten: Open Music Theory, Notation of Notes, Clefs, and Ledger Lines
    link: https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
  - id: omt-rhythm
    bac: 2
    ten: Open Music Theory, Notating Rhythm
    link: https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/
  - id: omt-simple
    bac: 2
    ten: Open Music Theory, Simple Meter and Time Signatures
    link: https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/
  - id: mt21c-meter
    bac: 2
    ten: Robert Hutchinson, Music Theory for the 21st-Century Classroom, 4.4 Meter
    link: https://musictheory.pugetsound.edu/mt21c/meter.html
  - id: mt21c-duration
    bac: 2
    ten: Robert Hutchinson, Music Theory for the 21st-Century Classroom, 4.2 Durational Symbols
    link: https://musictheory.pugetsound.edu/mt21c/DurationalSymbols.html
  - id: mt21c-dots
    bac: 2
    ten: Robert Hutchinson, Music Theory for the 21st-Century Classroom, 4.3 Dots and Ties
    link: https://musictheory.pugetsound.edu/mt21c/DotsAndTies.html
  - id: omt-other
    bac: 2
    ten: Open Music Theory, Other Aspects of Notation (legato, dấu luyến)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - id: kth-piano
    bac: 2
    ten: Gabriel Weinreich, Motion of piano strings, trong Five lectures on the acoustics of the piano (Royal Swedish Academy of Music, 1990), bản đăng ở speech.kth.se
    link: https://www.speech.kth.se/music/5_lectures/weinreic/motion.html
nhan_dinh:
  - id: n1
    cau: Cao độ cho biết nốt cao hay thấp.
    loai: dinh-nghia
    nguon:
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "A note indicates both pitch and rhythm." Cao độ: nốt ở trên khuông là "higher", ở dưới là "lower" (OMT Notation of Notes). Như bài 1 (n1).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/ ]
    luot_2_ghi_chu: "OMT: nốt có cao độ (tần số) và trường độ; cao độ cho biết cao hay thấp."
  - id: n2
    cau: Trường độ cho biết nốt dài hay ngắn.
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "Broadly speaking, rhythm refers to the duration of musical sounds and rests in time." Cùng chương: các giá trị nốt cho biết nốt dài bao nhiêu so với nốt khác.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT Notating Rhythm: rhythm là độ dài của âm thanh và dấu lặng trong thời gian."
  - id: n3
    cau: "Trường độ được đo bằng phách: nhịp đều đặn mà bạn hay gõ chân theo khi nghe nhạc."
    loai: dinh-nghia
    nguon:
      - omt-simple
      - mt21c-meter
    ket_qua: dung
    ghi_chu: 'OMT Simple Meter: "What you are tapping along to is called a beat—a pulse in music that regularly recurs." MT21C 4.4 Meter: "Pulse and beat are synonymous." MT21C 4.4 dẫn Grove: phách là "the unit by which musical time is reckoned" (đơn vị đo thời gian trong nhạc), nên "đo bằng phách" đúng.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: beat = nhịp đều lặp lại, có thể gõ hay vỗ theo. Giá trị nốt tính tương đối; số dưới của số chỉ nhịp cho biết nốt nào bằng một phách."
  - id: n4
    cau: Mỗi hình nốt dài gấp đôi hình nốt nhỏ hơn kế tiếp.
    loai: quy-tac
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "Note values are hierarchical; in other words, their lengths are defined relative to one another. Each note value can be divided into two smaller values"; OMT Notating Rhythm: "a whole note divides into two half notes, four quarter notes, eight eighth notes, and so on"'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: mỗi giá trị nốt chia được thành hai giá trị nhỏ hơn kế tiếp."
  - id: n5
    cau: Số phách trong bảng áp dụng khi nốt đen bằng 1 phách, trường hợp phổ biến nhất.
    loai: quy-tac
    nguon:
      - mt21c-duration
      - omt-simple
    ket_qua: dung
    ghi_chu: 'MT21C 4.2 Durational Symbols: "In the present day, the most common time signature is" 4/4 ("common time"); ở 4/4 nốt đen là một phách (OMT Simple Meter: "4, which means the quarter note gets the beat."). "Phổ biến nhất" suy từ câu MT21C; OMT chỉ nói số dưới "usually" là 2, 4 hay 8. Giữ.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/, https://odp.library.tamu.edu/stepstomusictheory/chapter/simple-meters/ ]
    luot_2_ghi_chu: "TAMU (Steps to Music Theory): nốt đen là đơn vị phách phổ biến nhất; OMT: số dưới 4 = nốt đen. Số phách trong bảng đúng khi nốt đen bằng 1 phách."
  - id: n6
    cau: "Tên các hình nốt: nốt tròn (whole note / semibreve), nốt trắng (half note / minim), nốt đen (quarter note / crotchet), nốt móc đơn (eighth note / quaver), nốt móc kép (sixteenth note / semiquaver)."
    loai: ten
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: "OMT Notating Rhythm, bảng tên Mỹ / Anh: Whole note / Semibreve; Half note / Minim; Quarter note / Crotchet; Eighth note / Quaver; Sixteenth note / Semiquaver. Tên tiếng Việt (tròn, trắng, đen, móc đơn, móc kép) là từ vựng của site (quy tắc nội dung của site cũ), chưa có trong thuat-ngu.yml: ghi cho D3-L5."
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/, https://musescore.org/vi/print/book/export/html/36126 ]
    luot_2_ghi_chu: "OMT: bảng tên Mỹ/Anh khớp (whole/semibreve, half/minim, quarter/crotchet, eighth/quaver, sixteenth/semiquaver). Tên Việt: bản dịch MuseScore tiếng Việt ghi Nốt tròn, Nốt trắng, Nốt đen, Móc đơn (nốt 16 ghi 'móc đôi', còn 'móc kép' là cách gọi phổ biến). Thuật ngữ Việt do lô D3-L5 khóa."
  - id: n7
    cau: "Hình dạng: nốt tròn đầu rỗng, không đuôi; nốt trắng đầu rỗng, có đuôi; nốt đen đầu đặc, có đuôi; nốt móc đơn đầu đặc, đuôi có 1 móc; nốt móc kép đầu đặc, đuôi có 2 móc."
    loai: dinh-nghia
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "Noteheads can be filled in (black) or unfilled (white); quarter notes and shorter durations are filled in. Unfilled noteheads may or may not have a stem, but filled noteheads always have stems. Flags are only added to the stems of filled noteheads." Ba cách giảm nửa giá trị: "Adding a stem to a note (i.e., whole to half)", "Filling in a notehead (i.e., half to quarter)", "Adding a flag (i.e., quarter to eighth or eighth to sixteenth)". Suy ra: tròn rỗng, không đuôi; trắng rỗng, có đuôi; đen đặc, có đuôi; móc đơn thêm một móc; móc kép thêm móc nữa (hai móc). "Đuôi" là stem, "móc" là flag.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: đầu nốt trắng rỗng, từ nốt đen trở xuống đầu đặc; nốt tròn không đuôi, nốt trắng có đuôi; thêm một móc giảm giá trị một nửa (móc đơn 1 móc, móc kép 2 móc)."
  - id: n8
    cau: "Khi nốt đen bằng 1 phách: nốt tròn 4 phách, nốt trắng 2, nốt đen 1, nốt móc đơn ½, nốt móc kép ¼."
    loai: so-lieu
    nguon:
      - omt-rhythm
      - mt21c-dots
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "a whole note divides into two half notes, four quarter notes, eight eighth notes, and so on" (tròn = 4 đen, trắng = 2 đen, móc đơn = ½ đen); mỗi móc thêm giảm một nửa (OMT Notating Rhythm: "Adding a flag (i.e., quarter to eighth or eighth to sixteenth)") nên móc kép = ½ móc đơn = ¼ đen. MT21C 4.3 Dots and Ties: "We have a whole note, which lasts for four beats, and a half note, which lasts for two beats"'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: whole = 2 half = 4 quarter = 8 eighth...; khi nốt đen = 1 phách: 4, 2, 1, ½, ¼."
  - id: n9
    cau: 'Khuông ví dụ thứ nhất ("Nghe từng ô nhịp dưới đây") gồm bốn ô nhịp 4/4, mỗi ô dài 4 phách, chỉ khác cách chia: một nốt tròn; hai nốt trắng; bốn nốt đen; tám nốt móc đơn.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: "abcjs đọc khối abc 1 (M:4/4, L:1/4): ô 1 C4 (4 phách), ô 2 C2 C2 (2+2), ô 3 C C C C (1+1+1+1), ô 4 tám nốt móc đơn C/ (8×½): mỗi ô đúng 4 phách. tools/khuong-nhac.mjs không báo ô sai độ dài. Review: đã đọc khối abc 1 của 03-truong-do.md bằng abcjs của site (parseOnly): M:4/4, L:1/4; ô 1 một nốt dài 1 (nốt tròn), ô 2 hai nốt 1/2 (nốt trắng), ô 3 bốn nốt 1/4 (nốt đen), ô 4 tám nốt 1/8 (nốt móc đơn); mỗi ô tổng bằng 1 nốt tròn, tức 4 phách; không cảnh báo. Đã mở bản xem và chụp khuông: đúng bốn ô như câu mô tả. Quan hệ nốt tròn 4 phách, nốt trắng 2… là điều cần nguồn, đã có ở n8."
    review: dung
  - id: n10
    cau: Khi nhiều nốt móc đứng cạnh nhau, đuôi móc thường được nối thành gạch ngang (beam) cho dễ đọc.
    loai: dinh-nghia
    nguon:
      - omt-simple
    ket_qua: dung
    ghi_chu: 'OMT Simple Meter: "Beams connect notes together by beat." OMT Simple Meter: "Beaming makes rhythms easier to read by showing the beat unit." (Khi các nốt móc nối bằng gạch ngang thì không vẽ móc riêng cho từng nốt.)'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: beam nối các nốt theo phách; 'beaming makes rhythms easier to read'."
  - id: n11
    cau: Ô nhịp cuối của khuông ví dụ thứ nhất có các nốt móc đơn nối thành gạch ngang.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "abcjs parseOnly, khối abc 1, ô 4: tám nốt móc đơn (duration 0,125 nốt tròn) mang cờ startBeam / endBeam thành bốn cặp (C/C/ viết liền không cách), nên khi vẽ ra là bốn gạch ngang nối từng cặp. Review nên nhìn khuông đã vẽ ở bản chạy. Review: abcjs (parseOnly) đánh dấu 8 nốt móc đơn của ô 4 thành bốn cặp (startBeam, endBeam); trên bản xem khuông đã vẽ có đúng 4 gạch ngang (.abcjs-beam-elem = 4), ô 1 đến 3 không có. Đã chụp ảnh khuông: bốn cặp móc đơn nối bằng gạch ngang ở ô cuối, khớp câu \"như ô nhịp cuối ở trên\" (03-truong-do.md dòng 31)."
    review: dung
  - id: n12
    cau: Dấu lặng là khoảng im lặng có độ dài xác định.
    loai: dinh-nghia
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "Broadly speaking, rests refer to the duration of silences in music."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: rest là khoảng im lặng đo được ('A measured silence')."
  - id: n13
    cau: "Mỗi hình nốt có một dấu lặng tương ứng: lặng tròn (4 phách), lặng trắng (2), lặng đen (1), lặng đơn (½), lặng kép (¼)."
    loai: quy-tac
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "Each hierarchical note value has a corresponding rest value" (cũng chia đôi từng bậc như nốt); độ dài dấu lặng bằng độ dài nốt cùng tên nên các số phách như n8. "Lặng đơn", "lặng kép" là cách gọi tắt của lặng móc đơn, móc kép (ghi cho D3-L5).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: mỗi giá trị nốt có dấu lặng tương ứng (whole, half, quarter, eighth, sixteenth rest); độ dài bằng nốt tương ứng (4, 2, 1, ½, ¼ phách khi nốt đen = 1)."
  - id: n14
    cau: Một chấm nhỏ bên phải nốt làm nốt dài thêm một nửa độ dài của chính nó.
    loai: dinh-nghia
    nguon:
      - omt-rhythm
      - mt21c-dots
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "A dot is written immediately after a note or rest, and it increases its duration by half". MT21C 4.3 Dots and Ties: "A dot added to a note increases the duration of that note by half."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: dấu chấm tăng độ dài của nốt thêm một nửa."
  - id: n15
    cau: Nốt trắng chấm dôi = 2 + 1 = 3 phách.
    loai: so-lieu
    nguon:
      - omt-rhythm
      - mt21c-dots
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "Another way to write this duration is as a dotted half note." (dài bằng ba nốt đen, ví dụ của chương về dấu nối); chấm dôi thêm một nửa của 2 phách là 1 phách (n14): 2 + 1 = 3. MT21C 4.3: không có giá trị nốt dài ba phách nên dùng chấm hay dấu nối.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "2 + 1 = 3 phách (OMT: dotted whole = ba half; cùng nguyên lý)."
  - id: n16
    cau: Nốt đen chấm dôi = 1 + ½ = 1½ phách.
    loai: so-lieu
    nguon:
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "a quarter note is equivalent in duration to two eighth notes; therefore, a dotted quarter note would be equivalent to three eighth notes" = 3 × ½ = 1½ phách.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: dotted quarter = ba nốt móc đơn = 1½ phách."
  - id: n17
    cau: "Dấu nối là đường cong nối hai nốt cùng cao độ: chơi nốt đầu và giữ luôn sang nốt sau, không đánh lại."
    loai: dinh-nghia
    nguon:
      - omt-rhythm
      - mt21c-dots
    ket_qua: dung
    ghi_chu: 'OMT Notating Rhythm: "A tie is a curved line that connects two or more notes with the same pitch." OMT Notating Rhythm: "Tied-to notes are not rearticulated." OMT Notating Rhythm: "ties are used to combine the durations of multiple notes". MT21C 4.3 Dots and Ties: "A tie links two notes together to create a new duration. Ties occur between notes of the same pitch."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/ ]
    luot_2_ghi_chu: "OMT: tie là đường cong nối các nốt cùng cao độ; nốt được nối không đánh lại."
  - id: n18
    cau: Dấu nối thường dùng khi một nốt kéo dài qua vạch nhịp.
    loai: quy-tac
