doi_chu:
  - cu: Quãng 6 nửa cung (4 tăng hoặc 5 giảm) chia đôi quãng tám, gọi là tritone. Nó nghe rất căng, từng bị gọi đùa là "quỷ dữ trong âm nhạc".
    moi: Quãng 6 nửa cung (4 tăng hoặc 5 giảm) chia đôi quãng tám, gọi là tritone (ba cung nguyên). Tritone được xếp vào quãng nghịch. Thời trung đại, tritone thường bị tránh; về sau quãng này có biệt danh diabolus in musica ("quỷ dữ trong âm nhạc").
    ly_do: 'n29 và n30 (da-sua): "rất căng" là cảm giác không kiểm được; câu về "quỷ dữ" theo Concise Oxford Dictionary of Music (mục tritone): "Mi contra fa diabolus est in musica", và việc dùng tritone bị cấm thời trung đại; không nguồn nào nói đó là lời "gọi đùa".; n30 (da-sua, review D3-gom): "từng bị cấm" là chỗ nguồn mâu thuẫn (Concise Oxford Dictionary of Music: "in medieval times its use was prohibited"; Margo Schulter, Early Music FAQ: "stylistic variation in theory and practice rather than an absolute prohibition"); "thường bị tránh" đúng theo cả hai.'
  - cu: Nếu nốt trên nằm trong gam trưởng của nốt dưới, thì quãng đó là trưởng (với 2, 3, 6, 7) hoặc đúng (với 1, 4, 5, 8). Nếu nốt trên thấp hơn nửa cung so với nốt trong gam, quãng đó là thứ (hoặc giảm với 1, 4, 5, 8).
    moi: Nếu nốt trên nằm trong gam trưởng của nốt dưới, thì quãng đó là trưởng (với 2, 3, 6, 7) hoặc đúng (với 1, 4, 5, 8). Nếu nốt trên thấp hơn nửa cung so với nốt trong gam, quãng đó là thứ (hoặc giảm với 4, 5, 8).
    ly_do: 'n32 (da-sua): quãng 1 giảm không tồn tại (Mount 11: "an interval cannot be smaller than a unison").'
  - cu: "Quãng lớn hơn quãng 8 gọi là quãng ghép. Trừ đi 7 để được quãng đơn tương ứng: quãng 9 là quãng 2 cộng một quãng 8, quãng 10 là quãng 3 cộng một quãng 8, quãng 11 là quãng 4, quãng 12 là quãng 5, quãng 13 là quãng 6. Tính chất giữ nguyên: Đô4 – Rê5 là 9 trưởng (14 nửa cung). Quãng ghép thường gặp trong tên hợp âm (C9, C13, xem bài 27) và giữa bè trầm với bè cao."
    moi: "Quãng lớn hơn quãng 8 gọi là quãng ghép. Trừ đi 7 để được quãng đơn tương ứng: quãng 9 là quãng 2 cộng một quãng 8, quãng 10 là quãng 3 cộng một quãng 8, quãng 11 là quãng 4, quãng 12 là quãng 5, quãng 13 là quãng 6. Tính chất giữ nguyên: Đô4 – Rê5 là 9 trưởng (14 nửa cung). Quãng ghép có mặt trong tên hợp âm (như C9, xem bài 27)."
    ly_do: 'n37 (da-sua): bỏ "thường gặp ... giữa bè trầm với bè cao" (không kiểm được) và C13 (bài 27 cũ không có C13); OMT Altered and Extended Chords: 9, 11, 13 là phần mở rộng của hợp âm.'
