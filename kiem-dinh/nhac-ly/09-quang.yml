    nguon: *a1
    ket_qua: dung
    ghi_chu: 'OMT: "seconds, thirds, sixths, and sevenths form major and minor intervals." Mount 11: "A minor interval is always a semitone smaller than the major interval of the same size."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n27
    cau: "Quãng 2, 3, 6, 7: rộng hơn trưởng là tăng, hẹp hơn thứ là giảm."
    loai: quy-tac
    nguon: *a1
    ket_qua: dung
    ghi_chu: 'OMT: augmented = half step larger than major; diminished = half step smaller than minor. Mount 11: "diminished (a semitone smaller than minor) or augmented (a semitone larger than major)".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
