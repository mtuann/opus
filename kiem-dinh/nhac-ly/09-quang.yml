    luot_2_ghi_chu: Khớp nguồn.
  - id: n25
    cau: "Quãng 1, 4, 5, 8: rộng hơn nửa cung (so với quãng đúng) là tăng, hẹp hơn nửa cung là giảm."
    loai: quy-tac
    nguon: *a1
    ket_qua: dung
    ghi_chu: 'OMT: "Augmented intervals are one half step larger than a perfect or major interval." "Diminished intervals are one half step smaller than a perfect or minor interval." Mount 11: perfect "may also be diminished (a semitone smaller than perfect) or augmented". Riêng quãng 1 giảm không tồn tại (xem câu mẹo nhanh bên dưới); câu này nói về nhóm quãng đúng nói chung, giữ nguyên.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
