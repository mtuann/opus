    luot_2_nguon: [ "https://web.archive.org/web/2024/https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: "Mở bản lưu Wayback của OMT Intervals, mục Intervallic Inversion (Example 10: Đô dưới, Mi trên, đảo bằng cách nâng Đô lên một quãng tám). Nguồn nói số thứ tự của cặp đảo luôn cộng bằng 9 (3 + 6 = 9, 1 + 8 = 9), và tên quãng đảo: đúng ↔ đúng, trưởng ↔ thứ, tăng ↔ giảm; nên 3 trưởng đảo thành 6 thứ, khớp câu. Vế số nửa cung tự tính: Đô4–Mi4 = 4 (Đô, Đô#, Rê, Rê#, Mi), Mi4–Đô5 = 8 (Fa, Fa#, Sol, Sol#, La, La#, Si, Đô), tổng 12 = quãng tám Đô4–Đô5; hai quãng chung nốt Mi4 nên ghép lại đúng bằng quãng tám. Câu chỉ nói tổng nửa cung bằng 12 (không nói tổng thứ tự 9), phần đó không sai. OMT không nêu riêng quy tắc cộng 12 nửa cung trong đoạn này nên vế ấy dựa vào phép đếm trực tiếp (kiểm được trên bàn phím)."
