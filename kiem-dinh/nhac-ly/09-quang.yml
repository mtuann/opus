ghi_chu: 'Trang quãng (tầng lõi). Nguồn chính: Open Music Theory (OMT), Intervals; Mount (FFF) ch. 11 đối chiếu bảng nửa cung, quy tắc đảo, quãng ghép; quãng thuận/nghịch theo OMT Introduction to Species Counterpoint; tritone: Concise Oxford Dictionary of Music (qua encyclopedia.com, như D3-L1). Trang đọc bằng WebFetch của agent ngày 27/10/2026 (máy chủ repo không ra mạng); công cụ này trả bản tóm tắt chữ của trang, không phải HTML thô, nên chữ trích đã đối chiếu bằng nhiều câu hỏi; riêng bảng Example 13 (quãng thuận hòa âm) của OMT Intervals, bản tóm tắt có chỗ không khớp quy tắc (xếp 7 trưởng/thứ vào cột thuận), nên trang theo OMT Species Counterpoint. Chỗ sửa trang: tritone (bỏ "rất căng", "gọi đùa", thêm câu Oxford), mẹo nhanh (bỏ "giảm" ở quãng 1), quãng ghép (bỏ "giữa bè trầm với bè cao" và C13), bảng thuận/nghịch (cột Cảm giác thành Độ ổn định; quãng 4 đúng nói rõ điều kiện), mục Nguồn; mục doi_chu tự viết (không build được), người giao chạy lại so-chu --doi-chu để chuẩn hóa dấu nháy. Chưa chắc: n46 (OMT Intervals và Species Counterpoint xếp quãng 4 đúng khác nhau, xem ghi_chu) và n32 (Mount 11 tự mâu thuẫn về quãng 1 giảm). Câu về site: link sang các trang chưa chuyển (luyen-tai, luyen-tap, piano, tai-lieu-tham-khao, nhac-ly/27) đều kiểm trên ../opus-zero/docs/. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): melodic interval, harmonic interval (quãng giai điệu, quãng hòa âm), compound interval (quãng ghép), perfect, major, minor, augmented, diminished (đúng, trưởng, thứ, tăng, giảm), tritone, interval inversion (đảo quãng), unison, octave; đã có: interval, semitone, consonance, dissonance.'
nguon:
  - id: omt-intervals
    bac: 2
    ten: Open Music Theory, Intervals (cả bảng nửa cung ở Example 16, mục Consonance and Dissonance, tritone, inversion, compound intervals)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  - id: omt-counterpoint
    bac: 2
    ten: Open Music Theory, Introduction to Species Counterpoint (mục Consonances and dissonances)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/species-counterpoint/
  - id: omt-extended
    bac: 2
    ten: Open Music Theory, Altered and Extended Chords
    link: https://viva.pressbooks.pub/openmusictheory/chapter/altered-and-extended-dominant-chords/
  - id: fff-intervals
    bac: 2
    ten: Andre Mount, Fundamentals, Function, and Form (Milne Publishing, SUNY Geneseo, giáo trình mở), 11. Intervals (cả Table 11-2)
    link: https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/11-intervals/
  - id: oxford-tritone
    bac: 2
    ten: The Concise Oxford Dictionary of Music, mục tritone (đọc qua encyclopedia.com)
    link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/tritone
nhan_dinh:
  - id: n1
    cau: Quãng là khoảng cách cao độ giữa hai nốt.
    loai: dinh-nghia
    nguon: &a1
      - omt-intervals
      - fff-intervals
    ket_qua: dung
    ghi_chu: 'OMT, Intervals: "Two pitches form an interval, which is usually defined as the distance between two notes." Câu này lặp ở mô tả (description) của trang.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n2
    cau: "Mỗi quãng có hai phần tên: con số (2, 3, 4…) và tính chất (trưởng, thứ, đúng, tăng, giảm)."
    loai: dinh-nghia
    nguon: *a1
    ket_qua: dung
    ghi_chu: "OMT, Intervals: kích thước (generic size: unison, second, third…) và chất lượng (perfect, major, minor, augmented, diminished). Mount 11: cùng cách chia."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n3
    cau: 'Ví dụ: "quãng 3 trưởng", "quãng 5 đúng".'
    loai: ten
    nguon: *a1
    ket_qua: dung
    ghi_chu: "Hai tên đều có trong bảng nửa cung (OMT Example 16: ma3 ở 4 nửa cung, P5 ở 7; Mount Table 11-2)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n4
    cau: Hai nốt vang lên lần lượt tạo quãng giai điệu; vang lên cùng lúc tạo quãng hòa âm.
    loai: dinh-nghia
    nguon: &a2
      - omt-intervals
    ket_qua: dung
    ghi_chu: 'OMT, Intervals, bảng thuật ngữ: melodic interval "whose notes are sounded separately (one note after another)"; harmonic interval "whose notes sound together (simultaneously)".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: "Quãng giai điệu/hòa âm: định nghĩa chuẩn; OMT dùng cả hai khái niệm khi xét thuận/nghịch."
  - id: n5
    cau: "Con số của quãng: đếm số tên nốt, tính cả nốt đầu và nốt cuối."
    loai: quy-tac
    nguon: *a1
    ket_qua: dung
    ghi_chu: 'OMT, Intervals: "Always begin with "one" when counting size." (đếm bao gồm nốt đầu: F đến chính nó là 1). Mount 11: đếm "starting with one" từ nốt dưới đến nốt trên.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n6
    cau: "Đô → Mi: Đô, Rê, Mi = 3 tên → quãng 3."
    loai: so-lieu
    nguon: *a2
    ket_qua: dung
    ghi_chu: Áp quy tắc đếm bao gồm (C D E = 3).
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n7
    cau: "Đô → Sol: Đô, Rê, Mi, Fa, Sol = 5 tên → quãng 5."
    loai: so-lieu
    nguon: *a2
    ket_qua: dung
    ghi_chu: C D E F G = 5.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n8
    cau: "Hai nốt cùng tên, cùng cao độ: quãng 1 (đồng âm). Cách một quãng tám: quãng 8."
    loai: dinh-nghia
    nguon: *a2
    ket_qua: dung
    ghi_chu: 'OMT, Intervals: "the interval between two notes on the same line or space is called a "unison""; "notes eight lines and spaces apart are said to be an "octave"". Tên tiếng Việt "đồng âm" là lựa chọn của site.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n9
    cau: "Con số không phụ thuộc vào dấu hóa: Đô → Mi, Đô → Mi♭ và Đô♯ → Mi♭ đều là quãng 3."
    loai: quy-tac
    nguon: *a2
    ket_qua: dung
    ghi_chu: "OMT, Intervals: kích thước tính trên tên nốt (generic), chất lượng mới tính dấu hóa. C-E, C-E♭, C♯-E♭ đều đếm C D E = 3."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n10
    cau: Tính chất được xác định bằng số nửa cung chính xác.
    loai: quy-tac
    nguon: *a1
    ket_qua: dung
    ghi_chu: 'OMT, Intervals Example 16 và Mount Table 11-2: mỗi chất lượng ứng với một số nửa cung cho từng kích thước. Cần đọc cùng con số: 6 nửa cung có thể là 4 tăng hay 5 giảm (bảng của trang xử lý bằng một hàng "4 tăng / 5 giảm").'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n11
    cau: "Quãng 1 đúng có 0 nửa cung (ví dụ từ Đô: Đô – Đô)."
    loai: so-lieu
    nguon: *a1
    ket_qua: dung
    ghi_chu: "OMT, Intervals Example 16 (0 nửa cung: P1) và Mount Table 11-2 (cùng số nửa cung). Ví dụ đếm trên phím: Đô – Đô."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/" ]
    luot_2_ghi_chu: Khớp nguồn.
