  - id: n30
    cau: Thời trung đại, tritone thường bị tránh; về sau quãng này có biệt danh diabolus in musica ("quỷ dữ trong âm nhạc").
    loai: lich-su
    nguon:
      - oxford-tritone
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"từng bị gọi đùa là \"quỷ dữ trong âm nhạc\"\". Chữ mới: câu trên. Lý do: Concise Oxford Dictionary of Music, mục tritone: \"Mi contra fa diabolus est in musica ... 'Mi against fa is the devil in music'\" và, theo cùng mục, thời trung đại việc dùng quãng này \"was prohibited\"; không nguồn nào nói câu ấy là lời \"gọi đùa\". Không nguồn đọc được ghi năm của câu nói, nên trang không gán năm. Chưa chắc: mục Oxford không nói rõ câu ấy có từ thời trung đại; trang chỉ gắn thời trung đại với việc cấm. Review D3-gom: lượt 2 khong-chac vì nguồn mâu thuẫn. Đã mở lại hai nguồn (28/10/2026): Concise Oxford Dictionary of Music (encyclopedia.com) \"Difficult to sing, and in medieval times its use was prohibited. There was saying ... Mi contra fa diabolus est in musica\"; Margo Schulter, Early Music FAQ (https://medieval.org/emfaq/harmony/tritone.html, nguồn bậc 3, chỉ để đối chiếu) cho rằng là \"stylistic variation in theory and practice rather than an absolute prohibition\" và câu Latin thấy rõ ở Fux (1725). Chữ cũ: \"Từ thời trung đại, việc dùng tritone từng bị cấm;\". Chữ mới: \"Thời trung đại, tritone thường bị tránh;\" (đúng theo cả hai cách hiểu; Oxford là nguồn bậc 2). Không gán năm hay thời kỳ cho câu Latin. Review D3-gom (sau lượt 2 bổ sung): bỏ câu Latin \"mi contra fa…\" vì câu ấy được dẫn sớm nhất ở Fux 1725 (medieval.org); giữ biệt danh diabolus in musica (Britannica, lượt 2) và \"thường bị tránh\" (COD, Schulter)."
    luot_2: khong-chac
    luot_2_ghi_chu: Britannica nói thời trung đại tritone khó hát và gọi là diabolus in musica; nhưng medieval.org cho biết câu mi contra fa diabolus est in musica sớm nhất được dẫn là Fux 1725, và tritone thời trung đại không bị cấm tuyệt đối. Nên viết dè dặt hơn về xuất xứ trung đại của câu này.
