    ly_do: 'Hàng mới, nhóm Nhạc lý (Anh – Việt), sau hàng time signature (hồ sơ simple-meter).; Hàng mới, sau hàng simple meter. du-lieu/thuat-ngu/compound-meter n3 (review D3-gom): bỏ câu "nhịp phức" khỏi ô Ghi chú: chỉ có nguồn bậc 3 (giáo trình trên novaspro.vn), không có giáo trình tiếng Việt bậc 1-2 đọc được.'
