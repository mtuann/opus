    loai: ve-site
    ket_qua: dung
    ghi_chu: "Câu ở description (frontmatter) và đoạn mở đầu. Đã kiểm trên tu-dien.md và src/data/thuat-ngu.yml: bảng gồm thuật ngữ Ý, Pháp, Đức dùng trên bản nhạc (nhóm Tốc độ, Thay đổi tốc độ, Cường độ, Cách diễn tấu, Tính cách, Chỉ đường trên bản nhạc, Piano) và nhóm Nhạc lý (Anh – Việt) cho tài liệu tiếng Anh. Câu mô tả chung, không có con số. Review: đã kiểm tu-dien.md dòng 3 và 6 và các nhóm chỉ thị ::tu-dien (Tốc độ, Thay đổi tốc độ, Cường độ…, Nhạc lý (Anh – Việt)). Soát nhãn: câu mô tả phạm vi của chính trang, giữ ve-site."
    review: dung
  - id: n2
    cau: Dùng ô tìm kiếm của site để tra nhanh.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "astro.config.mjs (dòng 100: bọc pagefind.js mà Starlight dựng) cho thấy site dùng ô tìm kiếm Pagefind của Starlight. Kiểm trên cấu hình, chưa mở trang dựng. Review: đã kiểm bản xem dist/: có thư mục dist/pagefind và ô tìm kiếm (site-search) ở các trang."
    review: dung
  - id: n3
    cau: Ôn bằng thẻ ghi nhớ ngay dưới đoạn mở đầu (::cong-cu{ten="flashcards"}).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Mục "Ôn bằng thẻ ghi nhớ" nằm ngay dưới đoạn mở đầu của tu-dien.md và chứa chỉ thị ::cong-cu{ten="flashcards"}; thành phần là src/scripts/the-nho.js (thẻ lấy từ các bảng có cột đầu "Thuật ngữ" trên trang). Review: đã kiểm tu-dien.md dòng 8–12 (mục "Ôn bằng thẻ ghi nhớ", ::cong-cu{ten="flashcards"}) và bản xem dist/nhac-ly/tu-dien/index.html: có ô oz-the-nho và các bảng có cột "Thuật ngữ".'
    review: dung
  - id: n4
    cau: Mỗi ngày site đưa ra tối đa 10 thẻ mới và các thẻ đến hạn ôn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "the-nho.js: MOI_NGAY = 10 (số thẻ mới mỗi ngày); thẻ đến hạn (due <= hôm nay) được đưa vào hàng đợi. Cũ: ../opus-zero/docs/assets/js/flashcards.js, NEW_PER_DAY = 10 (dòng 6). Review: đã kiểm src/scripts/the-nho.js dòng 11 (MOI_NGAY = 10) và dòng 43–47."
    review: dung
  - id: n5
    cau: Thẻ nhớ tốt sẽ được hỏi thưa dần sau 1, 3, 7, 16 rồi 35 ngày.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "the-nho.js: KHOANG = [0, 1, 3, 7, 16, 35] và cham(): box + 1 khi nhớ, hẹn lại sau KHOANG[box] ngày (box 1..5 = 1, 3, 7, 16, 35 ngày). Cũ: flashcards.js, INTERVALS cùng dãy (dòng 5). Review: đã kiểm src/scripts/the-nho.js dòng 9 (KHOANG = [0, 1, 3, 7, 16, 35]) và dòng 55–56."
    review: dung
  - id: n6
    cau: Thẻ quên sẽ quay lại từ đầu.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'the-nho.js, cham(): bấm "Chưa nhớ" thì box = 0 và hẹn lại ngay hôm nay; chamThe(): thẻ quên còn bị đưa xuống cuối hàng đợi của buổi. Cũ: flashcards.js, grade() làm giống. Review: đã kiểm src/scripts/the-nho.js dòng 55: chưa nhớ thì box = 0, hẹn lại ngay (KHOANG[0] = 0).'
    review: dung
  - id: n7
    cau: 'Phím tắt: Space để lật thẻ, 1 là "Chưa nhớ", 2 là "Nhớ".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'the-nho.js: Space lật thẻ (khi thẻ chưa lật), 1 và 2 chấm thẻ (2 = nhớ) khi ô công cụ đang được chọn; nút ghi "Chưa nhớ" và "Nhớ" (hàm latThe). Cũ: flashcards.js cùng phím. Review: đã kiểm src/scripts/the-nho.js dòng 152–155 (Space lật thẻ; phím 1, 2 chấm, 2 là nhớ) và dòng 122 (nút "Chưa nhớ").'
    review: dung
