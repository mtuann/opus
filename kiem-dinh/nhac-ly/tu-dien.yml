  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-l5
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L5 lượt 1, thuật ngữ)
      luot_2: null
      review: Claude (review D3-gom, nhóm C, 28/10/2026)
      kiem_mau: null
ghi_chu: "Trang Từ điển (tầng lõi). Các hàng của bảng (150 mục cũ, 154 sau D3-L5) dựng từ src/data/thuat-ngu.yml bằng chỉ thị ::tu-dien (agent khác đang làm); mọi nhận định về nghĩa, ghi chú của hàng nằm ở hồ sơ từng bản ghi kiem-dinh/du-lieu/thuat-ngu/<id>.yml, không lặp ở đây. Tên nhóm (Tốc độ, Piano, Nhạc lý (Anh – Việt)…) và cột Nghĩa là lựa chọn của site. Hồ sơ trang này chỉ có chữ ngoài bảng: mô tả, đoạn mở đầu, đoạn mô tả thẻ ghi nhớ (câu ve-site: kiểm trên src/scripts/the-nho.js, bản chuyển từ ../opus-zero/docs/assets/js/flashcards.js, và trên tu-dien.md). Mục doi_chu liệt kê mọi ô bảng đổi chữ do D3-L5 sửa src/data/thuat-ngu.yml (cu = ô cũ của tu-dien.md, moi = ô mới sinh từ dữ liệu; cu null = hàng mới; moi null = ô bỏ trống). Chữ cần người giao sửa ở tu-dien.md: không có; tu-dien.md chưa đổi bảng sang chỉ thị nên khi gộp phải dựng lại từ dữ liệu, không giữ bảng cũ. Id thẻ ghi nhớ là chữ ô đầu (thuat_ngu): D3-L5 không đổi chữ nào ở cột đó, nên tiến độ ôn thẻ đã lưu vẫn khớp."
