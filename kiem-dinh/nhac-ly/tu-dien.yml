  - cu: Bậc IV
    moi:
      - 'Bậc IV (bậc 4) của gam. "Hạ át" (không có chữ "âm") là tên chức năng của IV và ii: xem predominant'
      - predominant
      - Hạ át (chức năng)
      - 'Chức năng của hợp âm IV và ii, nằm giữa chủ và át (PD); cũng gọi subdominant function. Khác "hạ át âm", tên bậc IV: xem subdominant'
    ly_do: Hàng subdominant, cột Ghi chú. Quyết định thuật ngữ 27/10/2026 (hồ sơ subdominant, n2).; Hàng mới, sau hàng subdominant (hồ sơ predominant).
