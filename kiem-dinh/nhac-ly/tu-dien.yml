  - cu: "Ở nhiều nhà soạn nhạc về sau (Debussy, Ravel…): dùng bàn đạp trái una corda"
    moi: "Ở một số nhà soạn nhạc về sau (như Scriabin): dùng bàn đạp trái una corda"
    ly_do: Hàng con sordino, con sordina, cột Nghĩa. Henle Blog nêu Scriabin, không nhắc Debussy hay Ravel (hồ sơ con-sordino-con-sordina, n1).
  - cu: Tiếng Ý mano destra / mano sinistra; tiếng Pháp m.d. / m.g.; tiếng Anh r.h. / l.h.
    moi: Tiếng Ý mano destra / mano sinistra; tiếng Pháp main droite / main gauche; tiếng Anh r.h. / l.h.
    ly_do: 'Hàng m.d. / m.s., cột Ghi chú: không nguồn đã mở ghi viết tắt "m.g." (hồ sơ m-d-m-s, n2).'
