  - cu: "Hãy nhớ kỹ hai cặp này: chúng là chìa khóa để hiểu gam và hợp âm sau này."
    moi: "Hãy nhớ kỹ hai cặp này: chúng là chìa khóa để hiểu gam sau này."
    ly_do: "n5 (da-sua, review D3-L1 yêu cầu): bài 10 (hợp âm ba) không nhắc hai cặp nửa cung Mi – Fa, Si – Đô; bài 6 dùng chúng để giải thích gam Đô trưởng (Open Music Theory, Major Scales: công thức W-W-H-W-W-W-H)."
  - cu: "Ngoài ra còn có dấu thăng kép (×, nâng nốt lên một cung) và dấu giáng kép (♭♭, hạ nốt xuống một cung), dùng khi cần nâng/hạ một nốt đã mang dấu hóa — bạn sẽ gặp chúng ở các bài nâng cao."
    moi: "Ngoài ra còn có dấu thăng kép (×, nâng nốt lên một cung: Fa× nghe như Sol) và dấu giáng kép (♭♭, hạ nốt xuống một cung). Chúng hay gặp khi một nốt đã mang dấu hóa cần nâng hay hạ thêm nửa cung (như Fa♯ lên Fa×); bạn sẽ gặp chúng ở các bài nâng cao."
    ly_do: "n10, n11 (da-sua, review D3-L1 yêu cầu): thêm ví dụ Fa× nghe như Sol (Open Music Theory, Half Steps: dấu kép đổi nốt hai nửa cung); câu về chỗ dùng dấu kép nói đây là chỗ hay gặp (nốt đã mang dấu hóa cần thêm nửa cung, như Fa♯ lên Fa×), không phải chỗ dùng duy nhất."
  - cu: Ở ô nhịp đầu, cả hai nốt Fa đều là Fa♯ vì dấu thăng còn hiệu lực. Ở ô nhịp sau, Fa trở lại tự nhiên. Dấu bình cuối cùng không bắt buộc nhưng người viết vẫn thêm vào để nhắc người đọc; đây gọi là dấu hóa nhắc.
    moi: Ở ô nhịp đầu, cả hai nốt Fa đều là Fa♯ vì dấu thăng còn hiệu lực. Ở ô nhịp sau, Fa trở lại tự nhiên. Dấu bình ở đầu ô nhịp sau không bắt buộc, nhưng người viết vẫn thêm vào để nhắc người đọc; đây gọi là dấu hóa nhắc.
    ly_do: "n18 (da-sua): dấu hóa nhắc thường đặt ở nốt cùng tên đầu tiên của ô nhịp sau (Andre Mount, Fundamentals, Function, and Form, ch. 5 và 8.3); ví dụ cũ đặt dấu bình ở nốt Fa thứ hai, sau một Fa không dấu cùng ô, dễ nhầm. Câu và ví dụ (khuông 2) sửa cùng nhau."
