    ket_qua: dung
    ghi_chu: 'FFF 5 và MyMusicTheory (xem n16): hiệu lực đến hết ô nhịp, cho mọi nốt cùng dòng hay khe. "Chỉ một nốt" sai (nốt sau trong cùng ô vẫn chịu ảnh hưởng, như ví dụ F♯ ở n17); "đến hết bản nhạc" sai (đó là việc của hóa biểu, không phải dấu hóa bất thường).'
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/accidental ]
    luot_2_ghi_chu: "Đáp án khớp n16 (Oxford: 'holds good throughout the measure'). Lưu ý nhỏ: phương án sai 'chỉ với một nốt ngay sau nó' là quy ước của một số bản nhạc thế kỷ 20 (Oxford) nhưng không phải ký âm thông thường mà bài dạy."
  - id: n34
    cau: 'Câu hỏi 4: "Phím đen giữa Rê và Mi có những tên nào?" Đáp án đúng: Rê♯ và Mi♭. Sai: Rê♭ và Mi♯; Đô♯ và Rê♭. Giải thích: hai tên đồng âm khác tên của cùng một phím.'
    loai: dinh-nghia
    nguon:
      - omt-steps
      - mt21c-enharmonic
    ket_qua: dung
    ghi_chu: 'Phím đen giữa D và E là D♯ = E♭ (MT21C 1.5: D♯=E♭). "Rê♭ và Mi♯": Rê♭ là phím đen giữa Đô và Rê, Mi♯ = Fa (phím trắng) nên sai. "Đô♯ và Rê♭" là tên của phím đen giữa Đô và Rê, không phải giữa Rê và Mi. Giải thích đúng.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT, Example 5: phím đen giữa D và E là D♯/E♭. D♭ là phím giữa C và D, E♯ = F nên hai phương án sai đều sai."
khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - dau-hoa
    ket_qua: dung
    ghi_chu: "Gam nửa cung đi lên, K:C, M:none, L:1/8. abcjs đọc C4 C♯4 D4 D♯4 E4 F4 F♯4 G4 G♯4 A4 A♯4 B4 C5 (MIDI 60 đến 72): mỗi bước đúng một nửa cung, 13 nốt (12 phím và Đô cao); dấu thăng viết bằng ^ trước nốt, không dùng dấu giáng. Đúng điều trang nói (n14). Không có vạch nhịp nên không có phép kiểm độ dài ô. abcjs không cảnh báo (tools/khuong-nhac.mjs)."
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - dau-hoa
      - nhip
    ket_qua: da-sua
    ghi_chu: "Chữ cũ (ABC): ^F G F G | F G =F2 |] ; chữ mới: ^F G F G | =F G F2 |] (dấu bình dời từ nốt Fa thứ hai lên nốt Fa đầu ô 2; xem n18). M:4/4, L:1/4: ô 1 = 4 phách, ô 2 = 4 phách (=F G F2: 1+1+2). abcjs đọc F♯4 G4 F♯4 G4 | F4 G4 F4: nốt Fa thứ hai của ô 1 là Fa♯ nhờ dấu thăng còn hiệu lực (n17), Fa ở ô 2 tự nhiên; hai bản cho cùng âm thanh. Vị trí dấu hóa nhắc theo FFF 5 (mm. 17–18: dấu bình trên nốt đầu của ô sau) và FFF 8.3 (dấu nhắc ở ô sau ô có dấu hóa): ở đây trên lần xuất hiện đầu tiên của Fa trong ô 2. abcjs không cảnh báo."
