ghi_chu: 'Trang cung, nửa cung và dấu hóa (tầng lõi). Nguồn chính: Open Music Theory (OMT), mở từng chương bằng curl ngày 24/10/2026 (công cụ đọc web bị trang chặn, theo lời giao việc của lô); chỗ OMT không nói (hiệu lực của dấu hóa đến hết ô nhịp, dấu hóa nhắc, dấu hóa kép dùng khi nào): Andre Mount (FFF) ch. 5 và 8, MT21C 1.4 và 1.5, MyMusicTheory, UMass Unit 7. Câu về site (n12, n13, n22, n24, n29): kiểm trên bản cũ ../opus-zero/docs/ và JavaScript cũ, vì trang đích chưa chuyển; riêng bàn phím kiểm với thành phần mới của lô (src/scripts/ve.js, ban-phim.js). Sửa trang: n18 (ví dụ và câu về dấu hóa nhắc: dời dấu bình lên nốt Fa đầu ô 2) và mục Nguồn (thay link chung tới OMT và musictheory.net bằng các chương đã đọc; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, agent không đọc được chữ). Thuật ngữ cho D3-L5: "đồng âm khác tên" (enharmonic), "dấu thăng kép, giáng kép", "dấu hóa nhắc" (courtesy accidental) chưa có trong src/data/thuat-ngu.yml; "dấu hóa bất thường" (accidental) đã có. Không tính là nhận định: tên tiêu đề, "Ba dấu hóa" (tiêu đề bảng), lời dẫn "Nghe đi lên…" (đã gộp vào n14).'
