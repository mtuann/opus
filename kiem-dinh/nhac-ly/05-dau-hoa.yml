nhan_dinh:
  - id: n1
    cau: Trên piano, khoảng cách giữa hai phím liền kề (tính cả phím đen) là nửa cung.
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "A half step above a key on the piano is the key to its immediate right, while a half step below a key on the piano is the key to its immediate left." Bảng thuật ngữ cùng chương: nửa cung là "One-twelfth of an octave; generally considered to be the smallest interval in Western musical notation".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT, Key Takeaways: nửa cung trên là phím liền kề bên phải, nửa cung dưới là phím liền kề bên trái; phím đen cũng tính là một phím (E–F và B–C là nửa cung dù không có phím đen xen giữa)."
  - id: n2
    cau: Hai nửa cung là một cung.
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "A whole step is two half steps."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT: 'A whole step is the equivalent of two half steps.'"
  - id: n3
    cau: Giữa hầu hết các cặp phím trắng (liền nhau) có một phím đen, nên chúng cách nhau một cung.
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "Pairs of white keys with a black key in between them (A and B, C and D, D and E, F and G, and G and A) are a whole step apart." Năm trong bảy cặp phím trắng liền nhau có phím đen xen giữa: "hầu hết" đúng.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT, mục Half Steps and Whole Steps: các cặp phím trắng A–B, C–D, D–E, F–G, G–A có phím đen xen giữa và cách nhau một cung; 'hầu hết' đúng (5 trong 7 cặp)."
  - id: n4
    cau: "Có hai chỗ không có phím đen xen giữa hai phím trắng liền nhau, và đó là nửa cung tự nhiên: Mi – Fa (E – F) và Si – Đô (B – C)."
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "Two pairs of white keys—E/F and B/C—do not have black keys in between them (see Example 1). This is because E–F and B–C are both half steps."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT: 'Two pairs of white keys—E/F and B/C—do not have black keys in between them ... E–F and B–C are both half steps.' Tên 'nửa cung tự nhiên' là cách gọi của site, OMT chỉ nói đó là nửa cung."
  - id: n5
    cau: 'Hãy nhớ kỹ hai cặp này (Mi – Fa, Si – Đô): chúng là chìa khóa để hiểu gam sau này.'
    loai: khuyen-tap
    nguon:
      - omt-steps
      - omt-major
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hãy nhớ kỹ hai cặp này: chúng là chìa khóa để hiểu gam và hợp âm sau này." Chữ mới: "Hãy nhớ kỹ hai cặp này: chúng là chìa khóa để hiểu gam sau này." Lý do: bài 10 (hợp âm ba) không nhắc hai cặp nửa cung này; bài 6 dùng chúng để giải thích gam Đô trưởng ("hai nửa cung tự nhiên Mi–Fa và Si–Đô rơi đúng vào vị trí 3–4 và 7–8", n5 của bài 6), bài 7 dùng cho gam La thứ (bảng khoảng cách). Phần còn lại là lời khuyên học, khớp nguồn: OMT Half Steps: "E–F and B–C are both half steps"; OMT Major Scales: gam trưởng là "an ordered collection of half- (abbreviated H) and whole steps (abbreviated W) in the following ascending succession: W-W-H-W-W-W-H", ví dụ 1 là gam Đô trưởng, nên hai nửa cung của gam Đô trưởng chính là Mi–Fa và Si–Đô. (review D3-L1 yêu cầu)'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "Hợp lý, hợp cách dạy phổ biến: E–F và B–C là điểm mốc của nửa cung, từ đó suy ra công thức gam (OMT, Major Scales)."
  - id: n6
    cau: Dấu thăng (♯) nâng nốt lên nửa cung.
    loai: dinh-nghia
    nguon:
      - omt-steps
      - mt21c-accidentals
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "A sharp raises a note by a half step"; "Sharps, flats, and naturals are the three most common accidentals" (khớp tiêu đề "Ba dấu hóa" của trang). MT21C 1.4: "The sharp symbol—♯—raises a pitch a half step."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT: 'A sharp raises a note by a half step.'"
  - id: n7
    cau: Dấu giáng (♭) hạ nốt xuống nửa cung.
    loai: dinh-nghia
    nguon:
      - omt-steps
      - mt21c-accidentals
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "a flat lowers a note by a half step". MT21C 1.4: "The flat symbol—♭—lowers a pitch a half step."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT: 'A flat lowers a note by a half step.'"
  - id: n8
    cau: Dấu bình (♮) hủy dấu thăng hoặc giáng, trả nốt về tự nhiên.
    loai: dinh-nghia
    nguon:
      - omt-steps
      - mt21c-accidentals
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "A natural (♮) ... cancels a previous accidental such as a sharp or flat." MT21C 1.4: "The natural symbol—♮—cancels out any other accidentals that may have occurred earlier in a measure or in Major Key Signatures or Minor Key Signatures."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT: 'A natural ... cancels a previous accidental such as a sharp or flat.'"
  - id: n9
    cau: Fa♯ (F♯) là phím đen ngay bên phải Fa. Si♭ (B♭) là phím đen ngay bên trái Si.
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: nửa cung trên một phím là phím liền bên phải, nửa cung dưới là phím liền bên trái; "the black key to the right of the note C is called “C-sharp” ... the black key to the left of the note D is called “D-flat”". Fa♯ cao hơn Fa nửa cung (phím đen liền bên phải Fa); Si♭ thấp hơn Si nửa cung (phím đen liền bên trái Si).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT, mục The Black Keys: phím đen ngay bên phải một phím trắng là ♯ của phím ấy (C♯), ngay bên trái là ♭ (D♭). Áp dụng: F♯ ở bên phải F, B♭ ở bên trái B."
  - id: n10
    cau: 'Dấu thăng kép (×) nâng nốt lên một cung (Fa× nghe như Sol); dấu giáng kép (♭♭) hạ nốt xuống một cung.'
    loai: dinh-nghia
    nguon:
      - omt-steps
      - fff-pitch
      - mt21c-accidentals
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ngoài ra còn có dấu thăng kép (×, nâng nốt lên một cung) và dấu giáng kép (♭♭, hạ nốt xuống một cung), …". Chữ mới: "Ngoài ra còn có dấu thăng kép (×, nâng nốt lên một cung: Fa× nghe như Sol) và dấu giáng kép (♭♭, hạ nốt xuống một cung)." Lý do: đoạn này viết lại theo review (xem n11); ví dụ Fa× nghe như Sol cho thấy dấu thăng kép nâng chính nốt Fa lên hai nửa cung, nên Fa× chỉ cao hơn Fa♯ nửa cung (lượt 2 lưu ý câu cũ dễ làm hiểu nhầm). OMT Half Steps: "A double sharp (usually notated as 𝄪 or less commonly as ♯♯) raises a note by two half steps (i.e., a whole step). A double flat (𝄫) lowers a note by two half steps (i.e., a whole step)."; "A double sharp is two half steps above a note. For example, D𝄪 is also E"; "playing a D, C𝄪, or E𝄫 will result in the same pitch". Fa và Sol cách nhau một cung (có phím đen Fa♯ xen giữa, n3), nên Fa× nghe như Sol. FFF 5: "A double sharp symbol (x) indicates that the pitch in question is two semitones higher ... a double flat symbol (bb) ... two semitones lower". MT21C 1.4: 𝄪 "raises a pitch two half steps, or a whole step", 𝄫 "lowers". Trang viết × và ♭♭ thay cho 𝄪 và 𝄫: cùng nghĩa. (review D3-L1 yêu cầu)'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-sharp, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-flat ]
    luot_2_ghi_chu: "OMT: dấu thăng kép nâng hai nửa cung (một cung), dấu giáng kép hạ hai nửa cung. Concise Oxford Dictionary of Music, mục double-sharp, double-flat: nâng, hạ 'a whole-step or tone'."
  - id: n11
    cau: 'Dấu thăng kép và dấu giáng kép hay gặp khi một nốt đã mang dấu hóa cần nâng hay hạ thêm nửa cung (như Fa♯ lên Fa×).'
    loai: quy-tac
    nguon:
      - umass-ks
      - omt-seventh
      - omt-steps
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…, dùng khi cần nâng/hạ một nốt đã mang dấu hóa — bạn sẽ gặp chúng ở các bài nâng cao." Chữ mới: "Chúng hay gặp khi một nốt đã mang dấu hóa cần nâng hay hạ thêm nửa cung (như Fa♯ lên Fa×); bạn sẽ gặp chúng ở các bài nâng cao." Lý do (lượt 2: khong-chac): câu cũ hẹp hơn thực tế, vì dấu kép đặt được cả trên nốt tự nhiên (OMT Half Steps: "D𝄪 is also E", "C𝄫 is also B♭ or A♯"), và đứng sau "nâng nốt lên một cung" thì dễ hiểu là Fa× cao hơn Fa♯ một cung; câu mới nói đây là chỗ hay gặp, và từ Fa♯ lên Fa× chỉ thêm nửa cung. UMass Unit 7: "In some rare instances, musicians need to lower or raise a note by two half steps. In such cases, we use a DOUBLE FLAT (bb) ... or a DOUBLE SHARP (##)"; ví dụ trong chính bài ấy: nốt đầu ô là F# (dấu thăng của hóa biểu), hai nốt sau là F## (nâng tiếp một nốt đã mang dấu thăng). OMT Seventh Chords, ví dụ 9: "C and E♭ are lowered by a half step to C♭ and E𝄫" (E♭ đã có trong hóa biểu La♭ trưởng). (review D3-L1 yêu cầu)'
    luot_2: khong-chac
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/, https://viva.pressbooks.pub/openmusictheory/chapter/intervals/ ]
    luot_2_ghi_chu: "OMT chỉ định nghĩa tác dụng của dấu kép (±2 nửa cung), không nêu quy tắc 'dùng khi nào'; ví dụ của OMT dùng cả trên nốt tự nhiên (D× = E, C♭♭ = B♭) lẫn để nâng, hạ thêm một nốt đã có dấu hóa (G♯ → G×, E♭ → E♭♭ khi dựng quãng, chương Intervals). Câu hẹp hơn thực tế và đứng sau câu 'nâng một cung' dễ gây hiểu nhầm (Fa× chỉ cao hơn Fa♯ nửa cung). Gợi ý: 'Dấu thăng kép nâng nốt lên hai nửa cung (Rê× = Mi); thường gặp khi cần một nốt cao hơn nốt vốn đã thăng nửa cung (Fa♯ → Fa×).'"
  - id: n12
    cau: Bạn sẽ gặp dấu thăng kép và dấu giáng kép ở các bài nâng cao.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển, kiểm trên bản cũ (../opus-zero/docs): nhac-ly/17-khoa-do-dich-giong.md (mục 4: "một dấu thăng có thể thành dấu bình hoặc thăng kép"), nhac-ly/27-ky-hieu-hop-am.md ("Si giáng kép"), piano/hoa-am/ket.md ("Fa thăng kép", "Đô thăng kép"), piano/tac-pham/chopin-fantaisie-impromptu.md ("Fa thăng kép"), piano/tac-pham/schubert-impromptu-sol-giang.md ("dấu giáng kép"), piano/ban-do-ban-phim.md (dấu thăng kép 𝄪 và giáng kép 𝄫).'
  - id: n13
    cau: Bấm thử các phím đen trên bàn phím dưới đây để xem tên của chúng (bàn phím từ Đô4 đến Si4).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm với chỉ thị ::cong-cu{ten="piano" range="C4-B4"} và thành phần mới (src/scripts/ve.js veBanPhim, ban-phim.js; đã chạy veBanPhim cho khoảng này): 12 phím, 7 trắng và 5 đen; bấm phím thì phát tiếng và dòng aria-live đọc tên, năm phím đen là "Đô♯/Rê♭ (C♯/D♭4)", "Rê♯/Mi♭ (D♯/E♭4)", "Fa♯/Sol♭ (F♯/G♭4)", "Sol♯/La♭ (G♯/A♭4)", "La♯/Si♭ (A♯/B♭4)". Bản cũ (piano.js, nameOf) ghi cùng dạng tên.'
  - id: n14
    cau: Đi lên từng nửa cung từ Đô đến Đô là đi qua tất cả 12 phím của một quãng tám.
    loai: dinh-nghia
    nguon:
      - omt-steps
