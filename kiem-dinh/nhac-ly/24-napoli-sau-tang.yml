  - so: 1
    ngay: '2026-10-28'
    nhanh: moi/d3-gom
    ma_bam: sha256:0ce475a6ed4797b42600b0cb18313e389d38fff7c3458c7b7bb5a86b9ca2e268
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L3 lượt 1, phần 2/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, nhóm B, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Trang hợp âm Napoli và hợp âm sáu tăng (tầng lõi). Nguồn chính: Open Music Theory (OMT), Neapolitan Sixth Chords (♭II6), Augmented Sixth Chords, Collections, Introduction to Harmony; Mount, Fundamentals, Function, and Form ch. 31 (The Neapolitan Chord) và ch. 32 (Augmented Sixth Sonorities); MT21C, Types of Augmented Sixth Chords; COD (Neapolitan sixth) qua Encyclopedia.com; IMSLP (Sonata Op. 27 số 2). WebFetch ngày 28/10/2026 (bản tóm tắt chữ, đã hỏi lại để lấy nguyên văn chỗ quan trọng). Chữ đã sửa trên trang: bỏ "hơn bao giờ hết" (n4); nguồn gốc tên Napoli (n7, bỏ "nhà soạn opera"); "gần với gam toàn cung" thành "cùng thuộc một gam toàn cung" (n17); câu về hợp âm sáu tăng trong Mozart, Beethoven, Schubert (n24); khối abc 1 soạn lại cho Rê♭ đi xuống Si (n11, khối 1); mục Nguồn (bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm). Chưa chuyển: tai-lieu-tham-khao (n32). Số ô của Sonata Ánh trăng (n23): hai nguồn (Mount 31; Mellers qua Wikipedia, bậc 3) cùng nêu ô 3; chưa đối chiếu với bản nhạc (PDF IMSLP bị chặn): review có thể mở bản nhạc nếu muốn chắc hơn. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): Neapolitan chord (hợp âm Napoli), augmented sixth chord (hợp âm sáu tăng; Italian/French/German sixth), predominant (tiền át), chromatic (nửa cung), enharmonic (đồng âm khác tên; xem n30), cadential 6/4. Đã có bản ghi: whole-tone-scale (lô này), sonata (lô này; trang chỉ dùng "Sonata" ở tên tác phẩm Op. 27 số 2), chord, inversion, leading-tone, dominant, key.'
