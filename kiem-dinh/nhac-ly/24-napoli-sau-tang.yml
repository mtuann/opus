khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - giong
      - hop-am
      - nhip
      - dan-be
    ket_qua: da-sua
    ghi_chu: 'K:Cm (hóa biểu Si♭ Mi♭ La♭), M:3/2, L:1/2: ba hợp âm nốt trắng, đủ 3 phách nốt trắng. Chữ cũ: [F,A_df] [G,=Bdg] [C,ceg] (bè giữa Rê♭5 đi lên Rê5, trái câu "Rê♭ đi xuống"). Chữ mới: [F,FA_d] [G,DG=B] [C,EGc]: N6 = Fa3 Fa4 La♭4 Rê♭5 (Rê♭ trưởng đảo 1, nốt ba Fa ở bè trầm và nhân đôi); V = Sol3 Rê4 Sol4 Si4; i = Đô3 Mi♭4 Sol4 Đô5. Dẫn bè: bass Fa3 → Sol3 (lên) → Đô3 (xuống quãng 5); Rê♭5 → Si4 (xuống quãng 3 giảm, tới cảm âm) → Đô5; La♭4 → Sol4 → Sol4; Fa4 → Rê4 → Mi♭4. Không có quãng 5, 8 song song (đã kiểm các cặp bè qua hai lần chuyển); Si4 (cảm âm) lên Đô5 ở V → i. Khớp tiêu đề "N6 – V – i trong Đô thứ" và hai gạch đầu dòng: đi tới V trực tiếp, Rê♭ xuống Si.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - giong
      - hop-am
      - nhip
      - dan-be
    ket_qua: dung
    ghi_chu: 'K:Cm, M:4/2, L:1/2; bass A,, G,, G,, C, (La♭2 Sol2 Sol2 Đô3) và trên [CE^F] [CEG] [=B,DG] [CEG] (Mi♭ do hóa biểu; ^F là Fa♯). Ger+6 = La♭2 Đô4 Mi♭4 Fa♯4 ✓; i6/4 = Sol2 Đô4 Mi♭4 Sol4 ✓; V = Sol2 Si3 Rê4 Sol4 ✓; i = Đô3 Đô4 Mi♭4 Sol4 ✓. Dẫn bè: La♭2 → Sol2 (xuống), Fa♯4 → Sol4 (lên): ra ngoài về Sol; Đô4, Mi♭4 giữ ở i6/4 (tránh quãng 5 song song La♭–Mi♭ → Sol–Rê); i6/4 → V: Đô4 → Si3, Mi♭4 → Rê4 (6 → 5, 4 → 3 của cadential 6/4). Đủ 4 phách nốt trắng. Khớp tiêu đề và đoạn văn.'
doi_chu:
  - cu: 'Hai loại hợp âm nửa cung (chromatic) này là "gia vị mạnh" của thời Cổ điển và Lãng mạn. Cả hai đều có chức năng tiền át: chúng đứng ngay trước hợp âm V và làm cho V nghe căng thẳng hơn bao giờ hết. Ví dụ dưới đây ở Đô thứ, nơi chúng hay xuất hiện nhất.'
    moi: 'Hai loại hợp âm nửa cung (chromatic) này là "gia vị mạnh" của thời Cổ điển và Lãng mạn. Cả hai đều có chức năng hạ át (predominant): chúng đứng ngay trước hợp âm V và làm cho V nghe căng thẳng hơn. Ví dụ dưới đây ở Đô thứ, nơi chúng hay xuất hiện nhất.'
    ly_do: 'n4 (da-sua): "hơn bao giờ hết" không kiểm được; Mount 32: hợp âm sáu tăng nhấn mạnh sự đến của át.; n3 (da-sua, review D3-gom): thống nhất thuật ngữ theo quyết định 27/10/2026: chức năng predominant gọi là "hạ át" (bản ghi thuật ngữ predominant; bài 12).; n31 (da-sua, review D3-gom): như n3, thống nhất thuật ngữ "hạ át".'
  - cu: Hợp âm Napoli là hợp âm trưởng trên bậc 2 bị hạ nửa cung (♭II), thường ở đảo 1, nên được ký hiệu N6 hoặc ♭II6. Tên gọi gắn với các nhà soạn opera thế kỷ 18 ở Napoli.
    moi: "Hợp âm Napoli là hợp âm trưởng trên bậc 2 bị hạ nửa cung (♭II), thường ở đảo 1, nên được ký hiệu N6 hoặc ♭II6. Tên gọi nhắc tới Napoli (nhóm nhà soạn nhạc thế kỷ 18 quanh thành phố này), nhưng ít có cơ sở lịch sử: hợp âm đã được dùng từ trước đó và ở nhiều nơi khác."
    ly_do: 'n7 (da-sua): OMT: "the historical connection is quite shallow"; Mount 31: "little historical justification"; COD: "Reason for its name is unknown, since it occurs in 17th-cent. mus. before the so-called Neapolitan sch. existed".'
  - cu: Thêm Rê; nghe gần với gam toàn cung
