nhan_dinh:
  - id: n1
    cau: Hợp âm Napoli và hợp âm sáu tăng là hai loại hợp âm nửa cung (chromatic).
    loai: dinh-nghia
    nguon:
      - omt-bii6
      - omt-aug6
    ket_qua: dung
    ghi_chu: 'OMT: "The Neapolitan sixth (♭II6) is a chromatic predominant chord"; hợp âm sáu tăng chứa nốt hóa chromatic (♭6 và ♯4).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/", "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/" ]
    luot_2_ghi_chu: "OMT: Neapolitan sixth và hợp âm sáu tăng đều là chromatic predominant."
  - id: n2
    cau: Hợp âm Napoli và hợp âm sáu tăng là "gia vị mạnh" của thời Cổ điển và Lãng mạn.
    loai: lich-su
    nguon:
      - omt-bii6
      - fff-32
    ket_qua: dung
    ghi_chu: 'OMT, Neapolitan: dùng ở nhiều thành phố châu Âu thế kỷ 18 và 19 (Chopin, Schubert "Erlkönig" 1815); Mount 32: ví dụ hợp âm sáu tăng của Mozart, Beethoven, Mendelssohn, Schubert. Hai hợp âm cũng gặp ở Baroque (Mount 31 có ví dụ Bach BWV 2; COD: có từ thế kỷ 17): "của thời Cổ điển và Lãng mạn" không loại trừ, chấp nhận được. "Gia vị mạnh" là hình ảnh.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/", "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/" ]
    luot_2_ghi_chu: "OMT: Napoli dùng nhiều ở thế kỷ 18-19; sáu tăng phát triển ở Baroque rồi nổi bật ở Cổ điển/Lãng mạn. Câu ẩn dụ, ý đúng."
  - id: n3
    cau: 'Cả hai đều có chức năng hạ át (predominant): chúng đứng ngay trước hợp âm V.'
    loai: quy-tac
    nguon:
      - omt-bii6
      - omt-aug6
      - fff-31
      - fff-32
    ket_qua: da-sua
    ghi_chu: 'OMT, Neapolitan: "a chromatic predominant chord"; OMT, Augmented Sixth: "mostly used as a predominant harmony" và "lead directly to root-position V at a cadence point". Mount 31: N "keeps the pre-dominant function ... leads to some form of dominant", thường đi thẳng tới V hay V7; Mount 32: "chromatic pre-dominants that usually lead to V". Có khi i6/4 chen giữa (n9, n21). Review D3-gom (thuật ngữ): chữ cũ "Cả hai đều có chức năng **tiền át**:", chữ mới "Cả hai đều có chức năng **hạ át** (predominant):" (cả description). Lý do: quyết định thuật ngữ 27/10/2026 (plans/lam-lai/README.md: chức năng "chủ, hạ át, át" (T, PD, D); bản ghi thuật ngữ predominant = "Hạ át (chức năng)"); bài 12 đã khóa gọi "Hạ át (Predominant / tiền át, PD)". Nội dung không đổi: OMT gọi N6 và +6 là predominant (nguồn như trên).'
    luot_2: dung
    luot_2_nguon: [ "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/33-chromatic-pre-dominants/" ]
    luot_2_ghi_chu: "Mount: Napoli giữ chức năng hạ át; sáu tăng là hạ át cromatic làm nổi bật sự đến của V."
  - id: n4
    cau: Hợp âm N6 và +6 làm cho V nghe căng thẳng hơn.
    loai: quy-tac
    nguon:
      - fff-32
      - omt-intro
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "làm cho V nghe căng thẳng hơn bao giờ hết." Chữ mới: "làm cho V nghe căng thẳng hơn." Lý do: "hơn bao giờ hết" là mức không kiểm được. Mount 32: hợp âm sáu tăng "emphasize the arrival of the dominant"; OMT, Introduction to Harmony : "Strong predominants signal that a dominant function chord is imminent". Review D3-gom: chữ mới có trên trang (đoạn mở đầu); lượt 2 đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/", "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/" ]
    luot_2_ghi_chu: "Diễn giải chức năng; OMT: bước nửa cung chromatic dẫn vào V. Không có câu nguyên văn về 'căng thẳng hơn', nhưng không sai."
  - id: n5
    cau: Hợp âm N6 và +6 hay xuất hiện nhất ở giọng thứ (ví dụ của trang ở Đô thứ).
    loai: lich-su
    nguon:
      - omt-bii6
      - omt-aug6
      - fff-31
    ket_qua: dung
    ghi_chu: 'OMT, Neapolitan: "is more common in minor keys"; OMT, Augmented Sixth: "can occur in both major and minor keys, but they''re more common in minor"; Mount 31: Napoli "more common in minor keys".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/", "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/" ]
    luot_2_ghi_chu: "OMT: cả hai phổ biến hơn ở giọng thứ."
  - id: n6
    cau: Hợp âm Napoli là hợp âm trưởng trên bậc 2 bị hạ nửa cung (♭II), thường ở đảo 1, nên ký hiệu N6 hoặc ♭II6.
    loai: dinh-nghia
    nguon:
      - omt-bii6
      - fff-31
      - cod-neap
    ket_qua: dung
    ghi_chu: 'OMT: major triad on lowered 2, usually first inversion, ký hiệu ♭II6. Mount 31: "a major triad built on the lowered second scale degree"; "we label the chord N6", "Other texts use the abbreviation bII6". COD: "a major common chord on the flattened supertonic in its 1st inversion, e.g. in key C it comprises F–A♭–D♭".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/" ]
    luot_2_ghi_chu: "OMT: hợp âm trưởng trên bậc 2 hạ (ra), thường ở đảo 1 (N6 / bII6)."
  - id: n7
    cau: 'Tên gọi Napoli nhắc tới Napoli (nhóm nhà soạn nhạc thế kỷ 18 quanh thành phố này), nhưng ít có cơ sở lịch sử: hợp âm đã được dùng từ trước đó và ở nhiều nơi khác.'
    loai: lich-su
    nguon:
      - omt-bii6
      - fff-31
      - cod-neap
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tên gọi gắn với các nhà soạn opera thế kỷ 18 ở Napoli." Chữ mới như trên. Lý do: OMT: tên nhắc tới Napoli nhưng "the historical connection is quite shallow", hợp âm dùng ở nhiều thành phố; Mount 31: tên liên hệ tới "a group of 18th-century composers around Naples", "little historical justification for this" (hợp âm có trước, và ở cả nước Anh); COD: "Reason for its name is unknown, since it occurs in 17th-cent. mus. before the so-called Neapolitan sch. existed". "Nhà soạn opera" không có trong nguồn nào. Ba nguồn bậc 2 nhất trí: tên không có cơ sở lịch sử chắc chắn. Review D3-gom: chữ mới có trên trang (mục Hợp âm Napoli); lượt 2 xác nhận OMT ("quite shallow").'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/", "https://en.wikipedia.org/wiki/Neapolitan_chord" ]
    luot_2_ghi_chu: "OMT: liên hệ với Napoli 'khá nông', hợp âm dùng ở nhiều thành phố châu Âu. Wikipedia (chỉ để tìm nguồn) nêu nhóm Scarlatti, Pergolesi... và dùng từ cuối thế kỷ 17 (Carissimi, Corelli, Purcell)."
  - id: n8
    cau: 'Trong Đô thứ: ♭II = Rê♭ trưởng (Rê♭ – Fa – La♭); ở đảo 1, nốt Fa ở bè trầm.'
    loai: so-lieu
    nguon:
      - fff-31
      - cod-neap
    ket_qua: dung
    ghi_chu: 'Mount 31 (đáp án bài tập 31-3a): Napoli ở Đô thứ có bậc 4 (Fa) ở bass, với Rê♭, Fa, La♭ ở các bè trên. COD: "in key C it comprises F–A♭–D♭" (Fa – La♭ – Rê♭).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/" ]
    luot_2_ghi_chu: "Đô thứ: bậc 2 hạ là Rê giáng; Rê♭-Fa-La♭, đảo 1 bè trầm là Fa. Tự kiểm bằng tính quãng."
  - id: n9
    cau: Hợp âm Napoli đi tới V, thường qua i6/4 hoặc trực tiếp.
    loai: quy-tac
    nguon:
      - omt-bii6
      - fff-31
    ket_qua: dung
    ghi_chu: 'OMT: "often goes directly to V, with or without a cadential 6/4"; Mount 31: "an applied chord or cadential 6/4 intervenes" (Mendelssohn Op. 102 số 4), thường đi thẳng tới V hay V7. Chuẩn gọi i6/4 ở đây là cadential 6/4 (chức năng át).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/" ]
    luot_2_ghi_chu: "OMT: bII6 thường đi thẳng tới V, có hoặc không có cad.6/4."
  - id: n10
    cau: 'Nốt Rê♭ của hợp âm Napoli thường đi xuống qua Đô hoặc thẳng xuống Si (cảm âm): một bước quãng 3 giảm rất đặc trưng.'
    loai: quy-tac
    nguon:
      - omt-bii6
      - fff-31
    ket_qua: dung
    ghi_chu: 'OMT: ♭2 "resolve down to the closest member of the dominant triad, which is ti"; "do often sits between them (ra–do–ti)", nhất là khi có cadential 6/4. Mount 31: ♭2 "leaps down a diminished third to the leading tone"; "the melodic resolution of b2 occurs with the arrival of the leading tone over V"; đi xuống Đô thì là "false resolution"; bè giữa đôi khi đi lên bậc 2 tự nhiên. Rê♭ → Si là quãng 3 giảm: đúng. Chữ "thường" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/" ]
    luot_2_ghi_chu: "OMT: ra (♭2) đi xuống nốt gần nhất của V là ti; qua do khi có cad.6/4. Rê♭ xuống Si là quãng 3 giảm (tự kiểm)."
  - id: n11
    cau: 'Khuông "N6 – V – i trong Đô thứ": N6 = Fa – Fa – La♭ – Rê♭ (Rê♭ trưởng đảo 1), V = Sol – Rê – Sol – Si, i = Đô – Mi♭ – Sol – Đô; Rê♭ đi xuống Si.'
    loai: so-lieu
    nguon:
      - omt-bii6
      - fff-31
    ket_qua: da-sua
    ghi_chu: 'Khối abc đã soạn lại: xem khuong_nhac khối 1 (chữ cũ [F,A_df] [G,=Bdg] [C,ceg]; chữ mới [F,FA_d] [G,DG=B] [C,EGc]). Lý do: ở bản cũ Rê♭5 đi lên Rê5 (nốt nằm giữa hợp âm), không minh họa câu "Rê♭ đi xuống ... thẳng xuống Si" ngay phía trên (Mount 31 cho phép bè giữa đi lên bậc 2, nhưng trang nói điều ngược lại); bản mới Rê♭5 → Si4 (quãng 3 giảm xuống) và các bè trên đi xuống ngược chiều bass. Review D3-gom: đã đọc khối abc 1 trên trang: K:Cm, [F,FA_d] [G,DG=B] [C,EGc] = Fa3 Fa4 La♭4 Rê♭5 → Sol3 Rê4 Sol4 Si4 → Đô3 Mi♭4 Sol4 Đô5; Rê♭5 xuống Si4 (quãng 3 giảm). Khớp câu.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/" ]
    luot_2_ghi_chu: "Soạn lại: N6 = Fa (bass), Fa, La♭, Rê♭; V = Sol-Rê-Sol-Si; i = Đô-Mi♭-Sol-Đô. Hợp âm, nối bè đúng; Rê♭ xuống Si. Chưa đối chiếu chữ ABC của khuông."
  - id: n12
    cau: 'Hợp âm sáu tăng có hai nốt cách nhau quãng 6 tăng: La♭ (bậc 6 của Đô thứ) ở bè trầm và Fa♯ (bậc 4 được nâng) ở trên.'
    loai: dinh-nghia
    nguon:
      - omt-aug6
      - fff-32
    ket_qua: dung
    ghi_chu: 'OMT: nhận ra hợp âm sáu tăng bởi quãng "between le and fi" (↓6̂–↑4̂), không theo nốt gốc; Mount 32: "a dissonant augmented sixth between b6 and #4". La♭ – Fa♯ = 10 nửa cung = quãng 6 tăng ✓ (La♭ thấp, Fa♯ cao).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/" ]
    luot_2_ghi_chu: "OMT: bè trầm le (♭6), nốt trên fi (♯4); trong Đô thứ La♭ và Fa♯ cách quãng 6 tăng."
  - id: n13
    cau: 'Hai nốt của quãng 6 tăng giải quyết ra ngoài về quãng 8 trên Sol (bậc 5): La♭ đi xuống Sol, Fa♯ đi lên Sol.'
    loai: quy-tac
    nguon:
      - omt-aug6
      - fff-32
    ket_qua: dung
    ghi_chu: 'Mount 32: "Both outer voices move by semitone outward to scale degree 5"; OMT: "both notes of the augmented sixth are active and each moves to sol by a half step". La♭ → Sol (xuống), Fa♯ → Sol (lên): ra ngoài về quãng 8.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/" ]
    luot_2_ghi_chu: "OMT: le và fi cùng giải quyết về sol (hai nốt ra ngoài về quãng 8)."
  - id: n14
    cau: Vì thế hợp âm sáu tăng kéo về V mạnh.
    loai: quy-tac
    nguon:
      - fff-32
      - omt-aug6
    ket_qua: dung
    ghi_chu: 'Mount 32: hợp âm sáu tăng "emphasize the arrival of the dominant"; OMT: "lead directly to root-position V at a cadence point". "Mạnh đến vậy" là diễn đạt.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/" ]
    luot_2_ghi_chu: "OMT: giải quyết hai nốt về sol dẫn thẳng tới V ở thể gốc tại kết."
  - id: n15
    cau: Hợp âm sáu tăng có ba loại (Ý, Pháp, Đức); tên đặt theo quốc gia là tên gọi quy ước, không liên quan đến lịch sử thật.
    loai: ten
    nguon:
      - omt-aug6
      - fff-32
