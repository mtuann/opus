ghi_chu: 'Trang hợp âm mượn (tầng lõi). Nguồn chính: Open Music Theory (OMT), Modal Mixture; OMT, Minor Scales; COD (plagal cadence). WebFetch ngày 28/10/2026 (bản tóm tắt chữ, đã hỏi lại để lấy nguyên văn chỗ quan trọng). Chữ đã sửa trên trang: bỏ vế "rất đặc trưng của Schubert, Brahms, và nhạc phim, nhạc pop" (n3, da-bo); đổi mô tả ♭VI – ♭VII – I (n13); "mượn cảm âm" ở giọng thứ (n17); phần "Nghe trong tác phẩm thật": bỏ hai gạch đầu dòng (Schubert D. 956 chương 2, n20, vì chương ấy là Mi trưởng với đoạn giữa Fa thứ, không phải trưởng–thứ cùng chủ âm; và ♭VI – ♭VII – I trong nhạc phim và rock, n22, không có nguồn), thay bằng hai ví dụ OMT: Saint-Saëns, Samson et Dalila, và Catalani, La Wally (n19, n21); mục Nguồn (bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm). Người giao cân nhắc: hai ví dụ OMT là aria opera; nếu muốn ví dụ cho người nghe nhạc piano, cần nguồn bậc 1–2 mới. Câu ve-site trỏ trang chưa chuyển: n16 (hinh-thuc/fugue: giữ đoạn về quãng 3 Picardy, và kiểm lại câu "rất phổ biến trong nhạc Baroque" so với OMT: phổ biến ở thế kỷ 16–17, ít dần ở thế kỷ 18–19). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): modal mixture (hòa âm hỗn hợp), borrowed chord (hợp âm mượn), parallel key/mode (giọng song song), Picardy third (quãng 3 Picardy), plagal cadence (kết plagal), predominant; đã có bản ghi: chord, triad, key, scale, tonic, subdominant, dominant, leading-tone, cadence, fugue (lô này). Cách viết hợp âm bằng chữ ở đáp án bài tập 2 (D – Gm – A – D) khác chỗ còn lại của trang: nhắc người giao.'
