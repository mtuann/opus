nhan_dinh:
  - id: n1
    cau: Nhà soạn nhạc thường mượn hợp âm từ giọng thứ cùng tên để tạo màu sắc cho bản nhạc ở giọng trưởng (ví dụ mượn từ Đô thứ cho bản ở Đô trưởng).
    loai: dinh-nghia
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture: "the harmonic technique of mixing the notes from the parallel major and natural-minor modes"; "In the majority of cases, this occurs in major-key pieces where notes from the parallel minor are borrowed." "Thường" khớp "majority of cases". "Một thoáng buồn, một bóng mây giữa trời trong" là hình ảnh minh họa.'
  - id: n2
    cau: Kỹ thuật này gọi là hòa âm hỗn hợp (modal mixture).
    loai: ten
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT: chương "Modal Mixture". "Hòa âm hỗn hợp" là cách dịch của site (lựa chọn, không phải nhận định).'
  - id: n3
    cau: Hòa âm hỗn hợp rất đặc trưng của Schubert, Brahms, và cả nhạc phim, nhạc pop ngày nay.
    loai: lich-su
    nguon:
      - omt-mixture
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ vế ", rất đặc trưng của Schubert, Brahms, và cả nhạc phim, nhạc pop ngày nay". OMT, Modal Mixture không nêu Schubert, Brahms, nhạc phim hay pop (ví dụ của OMT: Saint-Saëns, Catalani); không tìm được nguồn bậc 1–2 cho mức độ "đặc trưng".'
  - id: n4
    cau: 'Hợp âm mượn trong Đô trưởng: Fa thứ, ký hiệu iv, mượn từ iv của Đô thứ, nốt mượn La♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'Đô thứ tự nhiên: Đô Rê Mi♭ Fa Sol La♭ Si♭. iv = Fa – La♭ – Đô; so với Đô trưởng (Fa – La – Đô), nốt mượn là La♭ (♭6). OMT: iv là một trong các hợp âm mượn ♭6 ("iio6, ii∅7, and iv").'
  - id: n5
    cau: 'Hợp âm mượn trong Đô trưởng: Rê giảm, ký hiệu ii°, mượn từ ii° của Đô thứ, nốt mượn La♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'ii° của Đô thứ = Rê – Fa – La♭; Rê, Fa đã có ở Đô trưởng, nốt mượn La♭. OMT: iio6 mượn ♭6 từ giọng thứ song song.'
  - id: n6
    cau: 'Hợp âm mượn trong Đô trưởng: La♭ trưởng, ký hiệu ♭VI, mượn từ VI của Đô thứ, nốt mượn La♭ và Mi♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'VI của Đô thứ = La♭ – Đô – Mi♭; Đô đã có ở Đô trưởng, nốt mượn La♭ và Mi♭. OMT: ♭VI là hợp âm "altered roots" mượn từ giọng thứ.'
  - id: n7
    cau: 'Hợp âm mượn trong Đô trưởng: Si♭ trưởng, ký hiệu ♭VII, mượn từ VII của Đô thứ, nốt mượn Si♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'VII của Đô thứ tự nhiên = Si♭ – Rê – Fa; Rê, Fa đã có ở Đô trưởng, nốt mượn Si♭. OMT: ♭VII mượn từ giọng thứ.'
  - id: n8
    cau: 'Hợp âm mượn trong Đô trưởng: Mi♭ trưởng, ký hiệu ♭III, mượn từ III của Đô thứ, nốt mượn Mi♭ và Si♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'III của Đô thứ = Mi♭ – Sol – Si♭; Sol đã có ở Đô trưởng, nốt mượn Mi♭ và Si♭. OMT: ♭III mượn từ giọng thứ.'
  - id: n9
    cau: Dấu ♭ trước số La Mã nghĩa là nốt gốc của hợp âm bị hạ nửa cung so với gam trưởng.
    loai: dinh-nghia
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture: dấu hóa trước số La Mã cho biết nốt gốc của hợp âm hạ nửa cung so với vị trí thường của bậc ("do not literally indicate "flat" or "sharp""). ♭VII = Si♭, ♭VI = La♭, ♭III = Mi♭ ở Đô trưởng: đúng.'
  - id: n10
    cau: 'IV – iv – I là kết plagal: hợp âm hạ át (IV, rồi iv) đứng trước hợp âm chủ.'
    loai: dinh-nghia
    nguon:
      - cod-plagal
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'COD: plagal cadence = "Cadence with subdominant preceding the tonic, normally both in root position." iv (Fa thứ) là hạ át mượn từ giọng thứ (OMT, Modal Mixture). "Buồn – ngọt" là mô tả cảm giác.'
  - id: n11
    cau: Ở I – IV – iv – I, nốt La đi xuống La♭ rồi về Sol.
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'Khuông abc 1: La4 (IV) → La♭4 (iv) → Sol4 (I): một bè đi xuống nửa cung rồi xuống nửa cung nữa. Đúng.'
  - id: n12
    cau: 'Khuông "I – IV – iv – I trong Đô trưởng": [C,EGc] [F,FAc] [F,F_Ac] [C,EGc].'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: Xem khuong_nhac khối 1.
  - id: n13
    cau: '♭VI – ♭VII – I: hai hợp âm mượn liên tiếp, rồi về chủ âm.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "♭VI – ♭VII – I: tiến trình hào hùng, rất phổ biến trong nhạc phim và nhạc pop." Chữ mới như trên. Lý do: "hào hùng", "rất phổ biến trong nhạc phim và nhạc pop" không có nguồn bậc 1–2: OMT, Modal Mixture không nói; OMT (Open Music Theory 1e, Plagal Progressions) có bVII–IV–I và bVI–bIII–bVII–IV–I nhưng không có ♭VI–♭VII–I. Phần đúng giữ lại: ♭VI và ♭VII đều là hợp âm mượn (n6, n7).'
  - id: n14
    cau: 'Khuông "I – ♭VI – ♭VII – I": [C,EGc] [_A,,_E_Ac] [_B,,DF_B] [C,EGc].'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: Xem khuong_nhac khối 2.
  - id: n15
    cau: 'Bản nhạc ở giọng thứ có thể kết thúc bằng hợp âm trưởng của chủ âm: đó là quãng 3 Picardy.'
    loai: dinh-nghia
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture: quãng 3 Picardy là cách dùng hòa âm hỗn hợp phổ biến ở giọng thứ, "a minor-key piece or movement ends with a major tonic chord"; phổ biến ở thế kỷ 16–17, ít dần ở thế kỷ 18–19.'
  - id: n16
    cau: 'Quãng 3 Picardy "đã gặp ở Fugue": có trang Fugue (/opus/hinh-thuc/fugue/) nói về quãng 3 Picardy.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/hinh-thuc/fugue.md, dòng 40: "Hợp âm trưởng ở cuối một bài giọng thứ có tên riêng: quãng 3 Picardy (tierce de Picardie), rất phổ biến trong nhạc Baroque" (cũng ở bảng cấu trúc Prelude và fugue Đô thứ, dòng 38; câu hỏi ở dòng 68). anh-xa.md: `hinh-thuc/fugue`, lõi. Lô chuyển trang Fugue phải giữ đường dẫn và đoạn nêu tên quãng 3 Picardy (nếu bỏ, sửa câu này theo thủ tục mở khóa). Lưu ý cho lô ấy: OMT (Modal Mixture) nói quãng 3 Picardy phổ biến ở thế kỷ 16–17 và ít dần ở thế kỷ 18–19: câu "rất phổ biến trong nhạc Baroque" của trang cũ cần kiểm lại.'
  - id: n17
    cau: Hợp âm V trong giọng thứ vốn đã dùng cảm âm được nâng (nốt này trùng với bậc 7 của giọng trưởng cùng tên).
    loai: quy-tac
    nguon:
      - omt-minor
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hợp âm V trong giọng thứ vốn đã "mượn" cảm âm." Chữ mới như trên. Lý do: OMT, Minor Scales: gam thứ hòa âm "Like natural minor, but with a raised leading tone" ("Having ti creates the sense of closure"); cảm âm nâng chính là ti của gam trưởng. Gọi là "mượn" dễ lẫn với hòa âm hỗn hợp (OMT: bản chất là mượn từ giọng song song, trong khi V có cảm âm là hợp âm chuẩn của giọng thứ).'
  - id: n18
    cau: Bài 10 (/opus/nhac-ly/10-hop-am-ba/) dạy hợp âm V ở giọng thứ dùng cảm âm được nâng.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Site mới: src/content/docs/nhac-ly/10-hop-am-ba.md, mục "Hợp âm trong giọng thứ": "riêng bậc V và vii° dùng cảm âm được nâng (như ở gam thứ hòa âm), để bậc V có cảm âm và trở thành hợp âm trưởng"; bảng La thứ có V = E.'
  - id: n19
    cau: 'Nghe trong tác phẩm thật: Saint-Saëns, opera Samson et Dalila, màn II, aria "Mon cœur s''ouvre à ta voix": hợp âm ii bán giảm mượn nốt ♭6 từ giọng thứ cùng tên.'
    loai: ten
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture, ví dụ 11: Camille Saint-Saëns, Samson et Dalila, Act II, "Mon cœur s''ouvre à ta voix": "ii∅4/3, which replaces the diatonic ii4/3"; nốt mượn là ♭6 ("B𝄫 ... is borrowed from the parallel minor key, creating modal mixture"). Chữ cũ về Schubert (D. 956, chương 2) đã bỏ (n20).'
  - id: n20
    cau: 'Nghe trong tác phẩm thật: Schubert nổi tiếng với những chỗ chuyển đột ngột giữa trưởng và thứ trên cùng một chủ âm; nghe chương 2 Ngũ tấu đàn dây cung Đô trưởng, D. 956.'
    loai: lich-su
    nguon:
      - omt-mixture
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ. Lý do: chương 2 của Ngũ tấu D. 956 là Adagio ở Mi trưởng, đoạn giữa nhảy sang Fa thứ ("breaks suddenly into the distant key of F minor", Wikipedia, bậc 3: tương quan Mi – Fa là bậc hạ nửa cung): không phải trưởng–thứ trên cùng một chủ âm; chỗ đan xen trưởng và thứ trên cùng chủ âm là chương 4 (Allegretto, "interplay of the major and minor modes", chỉ Wikipedia). Không có nguồn bậc 1–2 để dựng lại câu về Schubert; thay bằng hai ví dụ của OMT (n19, n21). Đã kiểm tên: IMSLP, String Quintet, D.956 (Schubert, Franz): Đô trưởng, 2 violin, viola, 2 cello; chương 2 Adagio.'
  - id: n21
    cau: 'Nghe trong tác phẩm thật: Catalani, opera La Wally, màn I, aria "Ebben? Ne andrò lontana": một đoạn nhạc mở đầu ở Mi trưởng rồi chuyển sang Mi thứ trên cùng chủ âm Mi.'
    loai: ten
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture, ví dụ 12: Alfredo Catalani, La Wally, Act I, "Ebben? Ne andrò lontana"; "Modal mixture is introduced at the third system and continues until the conclusion of the phrase"; OMT: phrase-level borrowing, "modulates from E major to its parallel minor, E minor" (bắt đầu ở trưởng, kết ở thứ trên cùng chủ âm).'
  - id: n22
    cau: Chuỗi ♭VI – ♭VII – I xuất hiện ở rất nhiều đoạn kết hùng tráng trong nhạc phim và nhạc rock.
    loai: lich-su
    nguon:
      - omt-mixture
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ: không có nguồn bậc 1–2 (xem n13); mức độ "rất nhiều" không kiểm được.'
  - id: n23
    cau: 'Bài tập 1: viết hợp âm iv, ♭VI và ♭VII trong Sol trưởng; đáp án: iv = Đô thứ (Đô – Mi♭ – Sol); ♭VI = Mi♭ trưởng (Mi♭ – Sol – Si♭); ♭VII = Fa trưởng (Fa – La – Đô).'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'Sol trưởng: iv = hợp âm thứ trên Đô: Đô – Mi♭ – Sol ✓; ♭VI: bậc 6 Mi hạ nửa cung thành Mi♭, hợp âm trưởng Mi♭ – Sol – Si♭ ✓; ♭VII: bậc 7 Fa♯ hạ thành Fa, hợp âm trưởng Fa – La – Đô ✓.'
  - id: n24
    cau: 'Bài tập 2: viết I – iv – V – I trong Rê trưởng (iv của Rê trưởng là Sol thứ); đáp án: D – Gm – A – D.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'Rê trưởng: I = D, iv = Gm (Sol – Si♭ – Rê), V = A, I = D. Đáp án viết bằng tên chữ (D – Gm – A – D), khác cách viết Đô, Rê trong trang: không sai, nhắc người giao.'
  - id: n25
    cau: 'Bài tập 3: nghe một bài hát pop bạn thích và tìm xem có hợp âm nào "lạ" so với giọng của bài không.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Bài tập nghe.
  - id: n26
    cau: 'Câu hỏi 1: iv trong Đô trưởng là Fa thứ; giải thích: "Mượn từ Đô thứ: Fa – La♭ – Đô."'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: Khớp n4. Lời giải thích không dựa vào vị trí lựa chọn.
  - id: n27
    cau: 'Câu hỏi 2: ♭VII trong Đô trưởng là Si♭ trưởng; giải thích: "Nốt gốc Si bị hạ thành Si♭."'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: Khớp n7, n9.
  - id: n28
    cau: 'Câu hỏi 3: hòa âm hỗn hợp nghĩa là mượn hợp âm từ giọng thứ (hoặc trưởng) cùng tên; giải thích: "Ví dụ dùng iv trong giọng trưởng."'
    loai: dinh-nghia
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT: trộn nốt của hai điệu thức song song (trưởng và thứ tự nhiên). Khớp n1.'
khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - giong
      - hop-am
      - nhip
    ket_qua: dung
    ghi_chu: 'K:C, M:4/2, L:1/2: bốn hợp âm nốt trắng đủ 4 phách nốt trắng. I = Đô3 Mi4 Sol4 Đô5; IV = Fa3 Fa4 La4 Đô5; iv = Fa3 Fa4 La♭4 Đô5 (_A); I. Đúng I – IV – iv – I; La4 → La♭4 → Sol4 ở một bè như bullet nói. Khuông không đặt khóa Fa (nốt bass Đô3, Fa3 nằm dưới khuông Sol): chấp nhận được, nhắc người giao nếu muốn đẹp hơn.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - giong
      - hop-am
      - nhip
    ket_qua: dung
    ghi_chu: 'K:C, M:4/2, L:1/2: bốn hợp âm nốt trắng. I = Đô3 Mi4 Sol4 Đô5; ♭VI = La♭2 Mi♭4 La♭4 Đô5 (_A,, _E _A c: La♭ – Đô – Mi♭); ♭VII = Si♭2 Rê4 Fa4 Si♭4 (_B,, D F _B: Si♭ – Rê – Fa); I. Đúng I – ♭VI – ♭VII – I.'
doi_chu:
  - cu: "Một bản nhạc ở Đô trưởng không bắt buộc chỉ dùng hợp âm của Đô trưởng. Nhà soạn nhạc thường mượn hợp âm từ giọng thứ cùng tên (Đô thứ) để tạo màu sắc: một thoáng buồn, một bóng mây giữa trời trong. Kỹ thuật này gọi là hòa âm hỗn hợp (modal mixture), rất đặc trưng của Schubert, Brahms, và cả nhạc phim, nhạc pop ngày nay."
    moi: "Một bản nhạc ở Đô trưởng không bắt buộc chỉ dùng hợp âm của Đô trưởng. Nhà soạn nhạc thường mượn hợp âm từ giọng thứ cùng tên (Đô thứ) để tạo màu sắc: một thoáng buồn, một bóng mây giữa trời trong. Kỹ thuật này gọi là hòa âm hỗn hợp (modal mixture)."
    ly_do: 'n3 (da-bo): OMT, Modal Mixture không nêu Schubert, Brahms, nhạc phim hay pop; mức độ "rất đặc trưng" không kiểm được.'
  - cu: "♭VI – ♭VII – I: tiến trình hào hùng, rất phổ biến trong nhạc phim và nhạc pop."
    moi: "♭VI – ♭VII – I: hai hợp âm mượn liên tiếp, rồi về chủ âm."
    ly_do: 'n13 (da-sua): "hào hùng, rất phổ biến trong nhạc phim và nhạc pop" không có nguồn bậc 1–2.'
  - cu: 'Bản nhạc ở giọng thứ có thể kết thúc bằng hợp âm trưởng của chủ âm: đó là quãng 3 Picardy đã gặp ở Fugue. Và như đã học ở bài 10, hợp âm V trong giọng thứ vốn đã "mượn" cảm âm.'
    moi: "Bản nhạc ở giọng thứ có thể kết thúc bằng hợp âm trưởng của chủ âm: đó là quãng 3 Picardy đã gặp ở Fugue. Và như đã học ở bài 10, hợp âm V trong giọng thứ vốn đã dùng cảm âm được nâng (nốt này trùng với bậc 7 của giọng trưởng cùng tên)."
    ly_do: 'n17 (da-sua): OMT, Minor Scales: gam thứ hòa âm có cảm âm nâng; "mượn" dễ lẫn với hòa âm hỗn hợp.'
  - cu:
      - Schubert nổi tiếng với những chỗ chuyển đột ngột giữa trưởng và thứ trên cùng một chủ âm, như mây che mặt trời. Nghe chương 2 Ngũ tấu đàn dây cung Đô trưởng, D. 956.
      - Chuỗi ♭VI – ♭VII – I xuất hiện ở rất nhiều đoạn kết hùng tráng trong nhạc phim và nhạc rock.
    moi:
      - "Saint-Saëns, opera Samson et Dalila, màn II, aria \"Mon cœur s'ouvre à ta voix\": hợp âm ii bán giảm mượn nốt ♭6 từ giọng thứ cùng tên."
      - 'Catalani, opera La Wally, màn I, aria "Ebben? Ne andrò lontana": một đoạn nhạc mở đầu ở Mi trưởng rồi chuyển sang Mi thứ trên cùng chủ âm Mi.'
    ly_do: "n20 (da-bo): chương 2 Ngũ tấu D. 956 là Adagio ở Mi trưởng, đoạn giữa Fa thứ (không phải trưởng–thứ cùng chủ âm); n22 (da-bo): không có nguồn; n19, n21: thay bằng hai ví dụ của OMT, Modal Mixture (ví dụ 11, 12)."
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Modal Mixture; Minor Scales, Scale Degrees, and Key Signatures."
      - "The Concise Oxford Dictionary of Music (Encyclopedia.com): plagal cadence."
    ly_do: "Mục Nguồn (n1 đến n28): thay link chung tới OMT và musictheory.net bằng các chương đã đọc khi kiểm định; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm."
