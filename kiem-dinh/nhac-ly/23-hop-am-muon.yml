nhan_dinh:
  - id: n1
    cau: Nhà soạn nhạc thường mượn hợp âm từ giọng thứ cùng tên để tạo màu sắc cho bản nhạc ở giọng trưởng (ví dụ mượn từ Đô thứ cho bản ở Đô trưởng).
    loai: dinh-nghia
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture: "the harmonic technique of mixing the notes from the parallel major and natural-minor modes"; "In the majority of cases, this occurs in major-key pieces where notes from the parallel minor are borrowed." "Thường" khớp "majority of cases". "Một thoáng buồn, một bóng mây giữa trời trong" là hình ảnh minh họa.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/" ]
    luot_2_ghi_chu: "OMT: modal mixture (borrowing) là trộn nốt của hai điệu trưởng và thứ tự nhiên song song (ví dụ Đô trưởng và Đô thứ). Mount: mixture trộn yếu tố trưởng và thứ của cùng một giọng."
  - id: n2
    cau: Kỹ thuật này gọi là hòa âm hỗn hợp (modal mixture).
    loai: ten
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT: chương "Modal Mixture". "Hòa âm hỗn hợp" là cách dịch của site (lựa chọn, không phải nhận định).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: OMT dùng 'modal mixture (or borrowing)'. Tên tiếng Việt 'hòa âm hỗn hợp' là của site (thuật ngữ khóa ở thuat-ngu.yml), không kiểm ở đây.
  - id: n3
    cau: Hòa âm hỗn hợp rất đặc trưng của Schubert, Brahms, và cả nhạc phim, nhạc pop ngày nay.
    loai: lich-su
    nguon:
      - omt-mixture
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ vế ", rất đặc trưng của Schubert, Brahms, và cả nhạc phim, nhạc pop ngày nay". OMT, Modal Mixture không nêu Schubert, Brahms, nhạc phim hay pop (ví dụ của OMT: Saint-Saëns, Catalani); không tìm được nguồn bậc 1–2 cho mức độ "đặc trưng".'
    luot_2: dung
    luot_2_nguon: [ "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/", "https://pressbooks.nebraska.edu/openmusictheory/?p=558" ]
    luot_2_ghi_chu: "Mount: ví dụ từ Schubert (Die schöne Müllerin) và Brahms, 'especially prevalent in the Romantic era'. OMT phần Popular Music: ♭VII mượn từ Mixolydian trong nhạc pop, cadence Aeolian dùng trong nhạc phim (Lord of the Rings) và game. 'Đặc trưng của Schubert, Brahms' là khái quát nhưng chấp nhận."
  - id: n4
    cau: 'Hợp âm mượn trong Đô trưởng: Fa thứ, ký hiệu iv, mượn từ iv của Đô thứ, nốt mượn La♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'Đô thứ tự nhiên: Đô Rê Mi♭ Fa Sol La♭ Si♭. iv = Fa – La♭ – Đô; so với Đô trưởng (Fa – La – Đô), nốt mượn là La♭ (♭6). OMT: iv là một trong các hợp âm mượn ♭6 ("iio6, ii∅7, and iv").'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: "OMT: iv chỉ mượn ↓6. Trong Đô: Fa-La♭-Đô, nốt mượn La♭. Đúng."
  - id: n5
    cau: 'Hợp âm mượn trong Đô trưởng: Rê giảm, ký hiệu ii°, mượn từ ii° của Đô thứ, nốt mượn La♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'ii° của Đô thứ = Rê – Fa – La♭; Rê, Fa đã có ở Đô trưởng, nốt mượn La♭. OMT: iio6 mượn ♭6 từ giọng thứ song song.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/" ]
    luot_2_ghi_chu: "OMT: iio6 và ii bán giảm chỉ mượn ↓6; Mount: ♭6 làm ii giảm. Trong Đô: Rê-Fa-La♭, nốt mượn La♭. Đúng."
  - id: n6
    cau: 'Hợp âm mượn trong Đô trưởng: La♭ trưởng, ký hiệu ♭VI, mượn từ VI của Đô thứ, nốt mượn La♭ và Mi♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'VI của Đô thứ = La♭ – Đô – Mi♭; Đô đã có ở Đô trưởng, nốt mượn La♭ và Mi♭. OMT: ♭VI là hợp âm "altered roots" mượn từ giọng thứ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: "OMT: ↓3 và ↓6/↓7 sinh ♭VI, ♭III, ♭VII. ♭VI trong Đô = La♭-Đô-Mi♭, nốt mượn La♭ và Mi♭. Đúng."
  - id: n7
    cau: 'Hợp âm mượn trong Đô trưởng: Si♭ trưởng, ký hiệu ♭VII, mượn từ VII của Đô thứ, nốt mượn Si♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'VII của Đô thứ tự nhiên = Si♭ – Rê – Fa; Rê, Fa đã có ở Đô trưởng, nốt mượn Si♭. OMT: ♭VII mượn từ giọng thứ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: ♭VII trong Đô = Si♭-Rê-Fa, chỉ Si♭ là nốt mượn (↓7). Đúng. (Mount cho rằng ♭7 thường bị tránh trong nhạc cổ điển, nhưng OMT xếp ♭VII là hợp âm mượn.)
  - id: n8
    cau: 'Hợp âm mượn trong Đô trưởng: Mi♭ trưởng, ký hiệu ♭III, mượn từ III của Đô thứ, nốt mượn Mi♭ và Si♭.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'III của Đô thứ = Mi♭ – Sol – Si♭; Sol đã có ở Đô trưởng, nốt mượn Mi♭ và Si♭. OMT: ♭III mượn từ giọng thứ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: ♭III trong Đô = Mi♭-Sol-Si♭, nốt mượn Mi♭ và Si♭ (↓3, ↓7). Đúng.
  - id: n9
    cau: Dấu ♭ trước số La Mã nghĩa là nốt gốc của hợp âm bị hạ nửa cung so với gam trưởng.
    loai: dinh-nghia
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture: dấu hóa trước số La Mã cho biết nốt gốc của hợp âm hạ nửa cung so với vị trí thường của bậc ("do not literally indicate "flat" or "sharp""). ♭VII = Si♭, ♭VI = La♭, ♭III = Mi♭ ở Đô trưởng: đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: "OMT: dấu giáng trước số La Mã nghĩa là nốt gốc bị hạ (so với thang trưởng), không phải nghĩa đen 'giáng'."
  - id: n10
    cau: 'IV – iv – I là kết plagal: hợp âm hạ át (IV, rồi iv) đứng trước hợp âm chủ.'
    loai: dinh-nghia
    nguon:
      - cod-plagal
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'COD: plagal cadence = "Cadence with subdominant preceding the tonic, normally both in root position." iv (Fa thứ) là hạ át mượn từ giọng thứ (OMT, Modal Mixture). "Buồn – ngọt" là mô tả cảm giác.'
    luot_2: khong-chac
    luot_2_ghi_chu: OMT (Plagal motion) định nghĩa chuyển động plagal là IV (IV6) sang I; không nói về iv-I hay IV-iv-I và còn ưa gọi 'plagal motion' hơn 'plagal cadence'. Gọi iv-I là kết plagal (minor plagal) là cách dùng phổ biến, nhưng chưa mở được nguồn xác nhận riêng 'IV-iv-I'.
  - id: n11
    cau: Ở I – IV – iv – I, nốt La đi xuống La♭ rồi về Sol.
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'Khuông abc 1: La4 (IV) → La♭4 (iv) → Sol4 (I): một bè đi xuống nửa cung rồi xuống nửa cung nữa. Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: "Kiểm từ khuông n12: La4 (hợp âm F) xuống La♭4 (Fa thứ) rồi Sol4 (hợp âm C). Đúng."
  - id: n12
    cau: 'Khuông "I – IV – iv – I trong Đô trưởng": [C,EGc] [F,FAc] [F,F_Ac] [C,EGc].'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: Xem khuong_nhac khối 1.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: "ABC: [C,EGc]=C3 E4 G4 C5; [F,FAc]=F3 F4 A4 C5; [F,F_Ac]=F3 F4 A♭4 C5 (Fa thứ); lại [C,EGc]. Là I-IV-iv-I ở Đô trưởng, đúng."
  - id: n13
    cau: '♭VI – ♭VII – I: hai hợp âm mượn liên tiếp, rồi về chủ âm.'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "♭VI – ♭VII – I: tiến trình hào hùng, rất phổ biến trong nhạc phim và nhạc pop." Chữ mới như trên. Lý do: "hào hùng", "rất phổ biến trong nhạc phim và nhạc pop" không có nguồn bậc 1–2: OMT, Modal Mixture không nói; OMT (Open Music Theory 1e, Plagal Progressions) có bVII–IV–I và bVI–bIII–bVII–IV–I nhưng không có ♭VI–♭VII–I. Phần đúng giữ lại: ♭VI và ♭VII đều là hợp âm mượn (n6, n7).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://pressbooks.nebraska.edu/openmusictheory/?p=558" ]
    luot_2_ghi_chu: "♭VI và ♭VII đều là hợp âm mượn từ Đô thứ, rồi về I: cadence Aeolian ♭VI-♭VII-I (OMT Popular Music)."
  - id: n14
    cau: 'Khuông "I – ♭VI – ♭VII – I": [C,EGc] [_A,,_E_Ac] [_B,,DF_B] [C,EGc].'
    loai: so-lieu
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: Xem khuong_nhac khối 2.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/" ]
    luot_2_ghi_chu: "ABC: [_A,,_E_Ac]=La♭2 Mi♭4 La♭4 Đô5 (La♭ trưởng); [_B,,DF_B]=Si♭2 Rê4 Fa4 Si♭4 (Si♭ trưởng). Đúng ♭VI và ♭VII. Lưu ý: nối ♭VII sang I (Si♭2/Si♭4 sang Đô3/Đô5, Si♭2/Fa4 sang Đô3/Sol4) có quãng 8 và quãng 12 song song giữa bass-soprano và bass-alto; không sai nhạc lý vì khuông này là minh họa hợp âm, không phải bài tập dẫn bè bốn bè, nhưng trái quy tắc ở bài 21 nếu bị coi là bốn bè."
  - id: n15
    cau: 'Bản nhạc ở giọng thứ có thể kết thúc bằng hợp âm trưởng của chủ âm: đó là quãng 3 Picardy.'
    loai: dinh-nghia
    nguon:
      - omt-mixture
    ket_qua: dung
    ghi_chu: 'OMT, Modal Mixture: quãng 3 Picardy là cách dùng hòa âm hỗn hợp phổ biến ở giọng thứ, "a minor-key piece or movement ends with a major tonic chord"; phổ biến ở thế kỷ 16–17, ít dần ở thế kỷ 18–19.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/" ]
    luot_2_ghi_chu: "OMT: Picardy third là bài/chương ở giọng thứ kết bằng hợp âm chủ trưởng. Mount: quãng 3 nâng của hợp âm chủ trong giọng thứ."
  - id: n16
    cau: 'Quãng 3 Picardy "đã gặp ở Fugue": có trang Fugue (/opus/hinh-thuc/fugue/) nói về quãng 3 Picardy.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/hinh-thuc/fugue.md, dòng 40: "Hợp âm trưởng ở cuối một bài giọng thứ có tên riêng: quãng 3 Picardy (tierce de Picardie), rất phổ biến trong nhạc Baroque" (cũng ở bảng cấu trúc Prelude và fugue Đô thứ, dòng 38; câu hỏi ở dòng 68). anh-xa.md: `hinh-thuc/fugue`, lõi. Lô chuyển trang Fugue phải giữ đường dẫn và đoạn nêu tên quãng 3 Picardy (nếu bỏ, sửa câu này theo thủ tục mở khóa). Lưu ý cho lô ấy: OMT (Modal Mixture) nói quãng 3 Picardy phổ biến ở thế kỷ 16–17 và ít dần ở thế kỷ 18–19: câu "rất phổ biến trong nhạc Baroque" của trang cũ cần kiểm lại.'
  - id: n17
    cau: Hợp âm V trong giọng thứ vốn đã dùng cảm âm được nâng (nốt này trùng với bậc 7 của giọng trưởng cùng tên).
    loai: quy-tac
    nguon:
      - omt-minor
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hợp âm V trong giọng thứ vốn đã "mượn" cảm âm." Chữ mới như trên. Lý do: OMT, Minor Scales: gam thứ hòa âm "Like natural minor, but with a raised leading tone" ("Having ti creates the sense of closure"); cảm âm nâng chính là ti của gam trưởng. Gọi là "mượn" dễ lẫn với hòa âm hỗn hợp (OMT: bản chất là mượn từ giọng song song, trong khi V có cảm âm là hợp âm chuẩn của giọng thứ).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/" ]
    luot_2_ghi_chu: "OMT: thang thứ hòa thanh có cảm âm nâng, tạo cảm giác kết; Mount: nâng cảm âm là phổ biến trong giọng thứ. Cảm âm nâng chính là bậc 7 của giọng trưởng cùng tên. Đúng."
  - id: n18
    cau: Bài 10 (/opus/nhac-ly/10-hop-am-ba/) dạy hợp âm V ở giọng thứ dùng cảm âm được nâng.
    loai: ve-site
    ket_qua: dung
