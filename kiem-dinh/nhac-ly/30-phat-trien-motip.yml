nhan_dinh:
  - id: n1
    cau: Phát triển môtip là lấy một ý tưởng ngắn rồi biến đổi nó theo những cách có hệ thống; nhờ đó một ý tưởng vài nốt có thể trở thành cả một chương giao hưởng.
    loai: dinh-nghia
    nguon:
      - omt-found
      - roch-b5
      - wiki-sym5
    ket_qua: dung
    ghi_chu: 'OMT: môtip "regularly recurring unit of music" được nhắc lại và biến đổi (enlargement, contraction, inversion, retrograde, intervallic manipulation…). Rochester: ở Giao hưởng số 5 "virtually every measure of the symphony uses the fate motive in some form". Wikipedia (bậc 3): "most of the themes are developed from one single motif".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.02%3A_Melodic_Alteration", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.01%3A_Motive" ]
    luot_2_ghi_chu: "Hutchinson: motive là ý nhạc nhỏ nhất nhận ra được, được lặp và biến đổi (augmentation, inversion, fragment...)."
  - id: n2
    cau: Hiểu các kỹ thuật này, bạn sẽ nghe ra "logic" trong nhạc Beethoven, Brahms, và nhận ra vì sao nhạc của họ nghe chặt chẽ đến vậy.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời hứa về trải nghiệm nghe, không phải sự kiện kiểm được; không trái trang lõi khác. Chỉ phần Beethoven có nguồn (n1, n20); Brahms không có nguồn trong hồ sơ này.
    luot_2: dung
    luot_2_ghi_chu: Nhận xét chung hợp lý.
  - id: n3
    cau: 'Môtip là ý tưởng âm nhạc ngắn nhất còn nhận ra được: vài nốt với một tiết tấu và đường nét đặc trưng.'
    loai: dinh-nghia
    nguon:
      - cod-motif
      - omt-found
    ket_qua: dung
    ghi_chu: 'COD: "The shortest intelligible and self-existent melodic or rhythmic figure". OMT: "a little snippet of a melody", "typically smaller than an idea".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.01%3A_Motive", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/03%3A_Form/3.01%3A_Foundational_Concepts_for_Phrase-Level_Forms" ]
    luot_2_ghi_chu: "Hutchinson: 'the smallest identifiable melodic idea'; OMT: motive là nhóm nhỏ nhất trong hệ phân cấp hình thức."
  - id: n4
    cau: 'Một ví dụ nổi tiếng của môtip: bốn nốt mở đầu Giao hưởng số 5 của Beethoven.'
    loai: lich-su
    nguon:
      - cod-motif
      - omt-found
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ví dụ nổi tiếng nhất". Chữ mới: "Một ví dụ nổi tiếng". Lý do: không có nguồn xếp hạng; COD lấy đúng ví dụ này ("e.g. the first 4 notes of Beethoven''s 5th Sym."); OMT nhắc mở đầu Giao hưởng số 5 khi bàn về phân tích môtip. Review D3-gom: chữ mới có trên trang; COD motif lấy đúng ví dụ này; lượt 2 đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://digfir-published.macmillanusa.com/listen8e/listen8e_ch15_12.html" ]
    luot_2_ghi_chu: "Macmillan: chương 1 Giao hưởng số 5 xây trên một môtip ngắn (bốn nốt G G G E♭ ở mở đầu)."
  - id: n5
    cau: 'Link [Giao hưởng số 5 của Beethoven](/opus/nghe-nhac/beethoven-5/): trang hướng dẫn nghe bản này.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển (src/data/trang.yml có nghe-nhac/beethoven-5). Site cũ ../opus-zero/docs/nghe-nhac/beethoven-5.md: mục "Môtip mở đầu" (dòng 12), dòng 26 "Toàn bộ chương 1 được xây dựng từ môtip bốn nốt này: nó bị lặp lại, chuyển giọng, chia nhỏ, chồng lên nhau". Điều cần giữ: trang nói về môtip bốn nốt và chia nhỏ (khớp bài 30). Review: trang đích chưa chuyển (bản xem: "sắp có"); đã đọc ../opus-zero/docs/nghe-nhac/beethoven-5.md: "## Môtip mở đầu" (dòng 12), dòng 26 "Toàn bộ chương 1 được xây dựng từ môtip bốn nốt này: nó bị lặp lại, chuyển giọng, chia nhỏ, chồng lên nhau". Là trang hướng dẫn nghe bản này.'
    review: dung
  - id: n6
    cau: 'Khối abc 1, "Môtip gốc": nghỉ móc đơn, Sol Sol Sol (móc đơn), Mi♭ (nốt trắng), giọng Đô thứ, nhịp 2/4.'
    loai: cau-truc
    nguon:
      - violin-ch
      - cod-motif
    ket_qua: dung
    ghi_chu: 'Violin Channel (bậc 3): "three short notes on G followed by a longer note on E-flat"; COD: bốn nốt đầu. Giọng Đô thứ (chương 1 Giao hưởng số 5 ở Đô thứ, Op. 67; Wikipedia, bậc 3). Chưa đối chiếu từng nốt với tổng phổ (tệp Mutopia id 941 chỉ có zip và PDF không trích được nốt): cần review nếu muốn khóa cao độ ở bản gốc; khối abc là ví dụ soạn minh họa môtip, không là trích đoạn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/O67/sym5-1-guitar-duo/sym5-1-guitar-duo.ly", "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "Mutopia (bản guitar chuyển giọng): 2/4, nghỉ móc đơn rồi ba móc đơn cùng nốt, nốt trắng có dấu miễn nhịp; IMSLP: giao hưởng ở Đô thứ (nốt gốc Sol Sol Sol Mi♭ theo Macmillan)."
  - id: n7
    cau: 'Bảng "Tám cách biến đổi": bảng có tám kỹ thuật (nhắc lại, chuỗi, đảo, ngược, nới rộng, thu hẹp, chia nhỏ, đổi quãng).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên trang: bảng có đúng 8 hàng kỹ thuật. Tên và cách chọn kỹ thuật là của site (OMT liệt kê enlargement, contraction, inversion, retrograde, displacement, intervallic manipulation, embellishment; chuỗi và chia nhỏ nằm ở các chương khác của OMT). Review: đã đếm trên trang: bảng "Tám cách biến đổi" có đúng 8 hàng (Nhắc lại, Chuỗi, Đảo, Ngược, Nới rộng, Thu hẹp, Chia nhỏ, Đổi quãng). Các ví dụ của bảng đúng với môtip Sol Sol Sol Mi♭: đảo Sol Sol Sol Si (lên quãng 3 trưởng thay vì xuống quãng 3 trưởng), ngược Mi♭ Sol Sol Sol, đổi quãng Sol Sol Sol Đô (xuống quãng 5); khối abc 2 khớp (nới rộng: mỗi trường độ gấp đôi).'
    review: dung
  - id: n8
    cau: 'Nhắc lại: lặp nguyên vẹn.'
    loai: dinh-nghia
    nguon:
      - omt-found
    ket_qua: dung
    ghi_chu: Hiển nhiên; OMT dùng "recurring" cho môtip.
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.02%3A_Melodic_Alteration" ]
    luot_2_ghi_chu: Định nghĩa hiển nhiên của lặp lại nguyên vẹn.
  - id: n9
    cau: 'Chuỗi: lặp ở cao độ khác (xem bài 29); ví dụ Fa Fa Fa Rê.'
    loai: dinh-nghia
    nguon:
      - omt-found
    ket_qua: dung
    ghi_chu: 'Chuỗi là mẫu lặp và dịch cao độ (xem hồ sơ bài 29 n1). Ví dụ Fa Fa Fa Rê: dịch Sol Sol Sol Mi♭ xuống một bậc (Sol→Fa, Mi♭→Rê, chuỗi giọng) trên khối abc 2.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.02%3A_Melodic_Alteration" ]
    luot_2_ghi_chu: Chuỗi là dịch chuyển cao độ; Fa Fa Fa Rê là Sol Sol Sol Mi♭ xuống một bậc theo thang Đô thứ.
  - id: n10
    cau: 'Chuỗi: Beethoven cũng nhắc môtip ở nhiều cao độ khác nhau.'
    loai: lich-su
    nguon:
      - roch-b5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(Beethoven làm đúng như vậy ở ô nhịp 3–5)". Chữ mới: "(Beethoven cũng nhắc môtip ở nhiều cao độ khác nhau)". Lý do: không kiểm được "ô nhịp 3–5" và cao độ Fa Fa Fa Rê ở bản gốc (không mở được tổng phổ: Mutopia id 941 chỉ có zip và PDF không trích được nốt; Wikipedia, Violin Channel, Listen không nêu số ô hay cao độ lần nhắc). Rochester: "an obsessive repetition of the motif at different pitch levels". Điều cần review: xác nhận bằng tổng phổ rằng lần nhắc thứ hai là Fa Fa Fa Rê (chưa chắc, chưa có nguồn). Review D3-gom: chữ mới có trên trang (hàng Chuỗi); lượt 2 (Listen 8e) và Rochester cùng nói môtip trở lại ở các cao độ khác. Ví dụ "Fa Fa Fa Rê" là ví dụ của site cho kỹ thuật chuỗi (khối abc 2), câu không còn nói Beethoven viết đúng các nốt ấy ở ô nào.'
    luot_2: dung
    luot_2_nguon: [ "https://digfir-published.macmillanusa.com/listen8e/listen8e_ch15_12.html" ]
    luot_2_ghi_chu: "Macmillan: môtip trở lại ở các cao độ khác nhau."
  - id: n11
    cau: 'Link [bài 29](/opus/nhac-ly/29-chuoi-hoa-am/): bài về chuỗi.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/nhac-ly/29-chuoi-hoa-am.md có trên site mới, là bài về chuỗi (hồ sơ lô này). Review: link /opus/nhac-ly/29-chuoi-hoa-am/ trỏ tới bài 29 "Chuỗi hòa âm" (cùng nhánh, đã chuyển).'
    review: dung
  - id: n12
    cau: 'Đảo: lật ngược hướng, đi xuống thành đi lên; ví dụ Sol Sol Sol Si (đi lên quãng 3 thay vì đi xuống).'
    loai: dinh-nghia
    nguon:
      - omt-found
    ket_qua: dung
    ghi_chu: 'OMT: "Inversion: changing the direction of the motive (e.g., instead of going up, it goes down)". Sol xuống Mi♭ là quãng 3 trưởng đi xuống; Sol lên Si♮ là quãng 3 trưởng đi lên (khối abc 2, "=B"). Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.02%3A_Melodic_Alteration" ]
    luot_2_ghi_chu: "Hutchinson: inversion là lật hướng; Sol-Sol-Sol-Si đi lên quãng 3 (đối xứng với Mi♭ đi xuống quãng 3)."
  - id: n13
    cau: 'Ngược: chơi từ cuối về đầu; ví dụ Mi♭ Sol Sol Sol.'
    loai: dinh-nghia
    nguon:
      - omt-found
    ket_qua: dung
    ghi_chu: 'OMT: "Retrograde: stating the motive backward in comparison to the initial statement". Sol Sol Sol Mi♭ ngược thành Mi♭ Sol Sol Sol.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.02%3A_Melodic_Alteration" ]
    luot_2_ghi_chu: "Hutchinson: retrograde là đảo thứ tự nốt; Mi♭-Sol-Sol-Sol đúng."
  - id: n14
    cau: 'Nới rộng (augmentation): kéo dài trường độ, thường gấp đôi; mỗi nốt dài gấp đôi.'
    loai: dinh-nghia
    nguon:
      - omt-found
      - wiki-aug
    ket_qua: dung
