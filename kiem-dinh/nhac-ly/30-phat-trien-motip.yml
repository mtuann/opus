  - id: n20
    cau: Trong chương 1 Giao hưởng số 5, Beethoven dùng nhiều kỹ thuật trong số này.
    loai: lich-su
    nguon:
      - roch-b5
      - bhso-b5
    ket_qua: dung
    ghi_chu: "Rochester: môtip lặp ở nhiều cao độ, \"Virtually every measure of the symphony uses the fate motive in some form\", \"it finally develops beyond the initial motive\". Listen: chia nhỏ ở phần phát triển (n21). mo/link-hong (06/11/2026): bảng nghe Listen 8e không còn (tên miền digfir-published.macmillanusa.com không phân giải, Wayback không lưu); bỏ listen-b5, thêm BHSO (chương 1: trình bày, phát triển, tái hiện, coda; horn call là \"an expanded version of the motto\"). Review link-hong (07/11/2026): Rochester (đã mở): \"the main motive is reduced to just two- and then one-note conversations between strings and winds\"; BHSO (đã mở): \"the horn call is played twice\", \"minim chords are passed between the strings and wind\", horn call \"an expanded version of the motto\". Đủ \"nhiều kỹ thuật\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.bhso.org.uk/work/beethoven-symphony-no-5/", "https://www.esm.rochester.edu/beethoven/symphony-no-5/" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): BHSO: horn call \"an expanded version of the motto\" (nới rộng), chủ đề 2 \"an inversion of the horn phrase\" (đảo), motto \"expanded and developed\"; Rochester: motive \"imitated in the strings\", ở cuối phần phát triển \"the main motive is reduced to just two- and then one-note conversations\" (chia nhỏ). \"Nhiều kỹ thuật\": đúng."
    review: dung
  - id: n21
    cau: "Phần phát triển (chương 1 Giao hưởng số 5) cũng dùng chia nhỏ: sau khi lời gọi của kèn horn vang lên hai lần, chất liệu bị cắt còn hai nốt, rồi một nốt, chuyền qua lại giữa bộ dây và bộ hơi."
    loai: cau-truc
    nguon:
      - roch-b5
      - bhso-b5
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Phần phát triển … đặc biệt dùng nhiều chia nhỏ: môtip bị cắt ngắn dần, chuyền qua lại giữa các bè, căng thẳng tăng dần.\" Chữ mới như trên. Lý do: Listen 8e (bảng nghe): 3:39 \"Fragmentation of bridge theme to two notes, alternating between strings and winds\"; 3:49 chủ đề cầu nối còn một nốt, cũng chuyền giữa dây và gỗ, chơi nhẹ (p). Đó là chủ đề cầu nối, không phải bốn nốt mở đầu; \"đặc biệt dùng nhiều\" không có nguồn xếp hạng; \"căng thẳng tăng dần\" không có nguồn (bảng ghi chơi nhẹ). Review D3-gom: chữ mới có trên trang; lượt 2 xác nhận bảng nghe Listen 8e. mo/link-hong (06/11/2026): Listen 8e không còn (xem n20). Thay bằng Rochester: cuối phần phát triển \"the main motive is reduced to just two- and then one-note conversations between strings and winds\"; BHSO: phần phát triển, sau khi \"the horn call is played twice\", \"minim chords are passed between the strings and wind\". Hai nguồn đỡ: hai nốt rồi một nốt, chuyền giữa dây và bộ hơi, ngay sau tiếng kèn horn (chủ đề cầu nối). Người gom xem lại hai chỗ: Rochester gọi mảnh nhạc là \"main motive\", không gọi là chủ đề cầu nối; nguồn ghi \"winds\" (bộ hơi), trang ghi \"bộ gỗ\". Review link-hong (07/11/2026): lượt 2 khong-chac: không nguồn còn đọc được nào gọi mảnh ấy là \"chủ đề cầu nối\", nguồn ghi \"winds\" chứ không phải bộ gỗ. Rochester (đã mở): \"the main motive is reduced to just two- and then one-note conversations between strings and winds\"; BHSO (đã mở): \"the horn call is played twice\", \"minim chords are passed between the strings and wind\". Chữ cũ (trước link-hong): \"một mảnh nhạc rút từ chủ đề cầu nối bị cắt còn hai nốt, rồi một nốt, chuyền qua lại giữa bộ dây và bộ gỗ\"; chữ mới theo đề xuất lượt 2, bỏ \"những hợp âm\" của đề xuất vì \"hợp âm hai nốt\" đọc thành hợp âm có hai nốt, trong khi nguồn nói mảnh hai nốt rồi một nốt (\"two- and then one-note conversations\"). Chỉ bỏ hay thu hẹp theo nguồn, không cần lượt 2 lại."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.esm.rochester.edu/beethoven/symphony-no-5/", "https://www.bhso.org.uk/work/beethoven-symphony-no-5/" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): Rochester: \"at the end of the development (3:18-3:50) … the main motive is reduced to just two- and then one-note conversations between strings and winds\". BHSO: sau khi \"the horn call is played twice … minim chords are passed between the strings and wind, all the time widening in pitch distance and ending with a quiet … repetition of the same chords\". Hai nguồn đỡ: chia nhỏ còn hai rồi một nốt, chuyền giữa dây và \"winds\". Không nguồn nào gọi mảnh ấy là \"chủ đề cầu nối\" (Rochester nói \"main motive\"; BHSO chỉ đặt nó ngay sau lời gọi của kèn horn, tức đoạn dẫn vào chủ đề 2); \"bộ gỗ\" hẹp hơn \"winds\". Đề xuất: \"Phần phát triển (chương 1 Giao hưởng số 5) cũng dùng chia nhỏ: sau khi lời gọi của kèn horn vang lên hai lần, chất liệu bị cắt còn những hợp âm hai nốt, rồi một nốt, chuyền qua lại giữa bộ dây và bộ hơi.\""
    review: dung
