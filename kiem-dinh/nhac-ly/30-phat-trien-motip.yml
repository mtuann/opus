    moi: "câu hỏi: Chỉ giữ lại một mảnh của môtip và lặp lại nó gọi là gì? | Nới rộng | ✓ Chia nhỏ | Đổi quãng | Phần phát triển chương 1 Giao hưởng số 5 cũng dùng cách này."
