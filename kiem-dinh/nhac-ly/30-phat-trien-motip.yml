doi_chu:
  - cu: "Môtip là ý tưởng âm nhạc ngắn nhất còn nhận ra được: vài nốt với một tiết tấu và đường nét đặc trưng. Ví dụ nổi tiếng nhất: bốn nốt mở đầu Giao hưởng số 5 của Beethoven."
    moi: "Môtip là ý tưởng âm nhạc ngắn nhất còn nhận ra được: vài nốt với một tiết tấu và đường nét đặc trưng. Một ví dụ nổi tiếng: bốn nốt mở đầu Giao hưởng số 5 của Beethoven."
    ly_do: 'n4 (da-sua): không có nguồn xếp hạng "nổi tiếng nhất".'
  - cu: Fa Fa Fa Rê (Beethoven làm đúng như vậy ở ô nhịp 3–5)
    moi: Fa Fa Fa Rê (Beethoven cũng nhắc môtip ở nhiều cao độ khác nhau)
    ly_do: "n10 (da-sua): không kiểm được số ô 3–5 và cao độ ở tổng phổ; Rochester chỉ nói môtip lặp ở nhiều cao độ."
  - cu: "Trong chương 1 Giao hưởng số 5, Beethoven dùng nhiều kỹ thuật trong số này. Phần phát triển (xem Hình thức sonata) đặc biệt dùng nhiều chia nhỏ: môtip bị cắt ngắn dần, chuyền qua lại giữa các bè, căng thẳng tăng dần."
    moi: "Trong chương 1 Giao hưởng số 5, Beethoven dùng nhiều kỹ thuật trong số này. Phần phát triển (xem Hình thức sonata) cũng dùng chia nhỏ: sau khi lời gọi của kèn horn vang lên hai lần, chất liệu bị cắt còn hai nốt, rồi một nốt, chuyền qua lại giữa bộ dây và bộ hơi."
    ly_do: 'n21 (da-sua): "đặc biệt dùng nhiều" và "căng thẳng tăng dần" không có nguồn. Review mo/link-hong: Listen 8e không còn; theo Rochester ("two- and then one-note conversations between strings and winds") và BHSO ("the horn call is played twice", hợp âm chuyền giữa dây và "wind"): bỏ "chủ đề cầu nối", "bộ gỗ" thành "bộ hơi".'
  - cu: "Ở bài 13, bạn đã gặp đoạn nhạc (period): câu hỏi kết nửa, câu trả lời kết trọn. Nhạc Cổ điển còn một cấu trúc phổ biến không kém, gọi là câu (sentence), thường dài 8 ô nhịp:"
    moi: "Ở bài 13, bạn đã gặp đoạn nhạc (period): câu hỏi kết nửa, câu trả lời kết trọn. Nhạc Cổ điển còn một cấu trúc phổ biến không kém, gọi là câu (sentence), thường dài 4 hoặc 8 ô nhịp; bảng dưới là một câu 8 ô nhịp:"
    ly_do: "n26 (da-sua): OMT ghi câu mẫu dài 4 hoặc 8 ô nhịp."
  - cu: 'Nhà soạn nhạc hay "kéo dài" một câu để tạo bất ngờ hoặc nhấn mạnh: kéo dài trước kết (lặp lại hợp âm tiền át), kết lừa rồi làm lại (xem bài 13), hoặc thêm một đoạn đuôi (codetta) sau kết. Khi nghe một câu nhạc dài hơn 8 ô nhịp "bình thường", hãy tìm xem đoạn nào được thêm vào.'
    moi: 'Nhà soạn nhạc hay "kéo dài" một câu để tạo bất ngờ hoặc nhấn mạnh: kéo dài một hợp âm trước kết, làm lại phần kết sau khi lần kết đầu bị né tránh (xem bài 13 về kết lừa), hoặc thêm một đoạn đuôi (codetta) sau kết. Khi nghe một câu nhạc dài hơn mức thông thường (4 hoặc 8 ô nhịp), hãy tìm xem đoạn nào được thêm vào.'
    ly_do: "n31 (da-sua): OMT nói kéo dài một hợp âm hay giai điệu (không nói hợp âm tiền át) và kết bị né tránh (evaded cadence), không phải kết lừa; n32 theo n26."
  - cu:
      - "Open Music Theory, chương Foundational Concepts for Phrase-Level Forms (John Peterson): môtip là đơn vị ngắn, thường được nhắc lại và biến đổi, ví dụ ở mở đầu Giao hưởng số 5 của Beethoven; các phép biến đổi môtip: kéo dài trường độ, rút ngắn trường độ, đảo, ngược, đổi quãng."
      - "Open Music Theory, chương The Phrase, Archetypes, and Unique Forms (John Peterson): câu gồm phần trình bày (ý cơ bản và lần nhắc lại, có thể ở hợp âm khác) và phần tiếp nối (chia nhỏ, tiết tấu dày hơn, chuỗi, hợp âm đổi nhanh hơn, dẫn tới kết); đoạn nhạc gồm vế trước kết yếu (thường là kết nửa) và vế sau kết mạnh hơn (thường là kết trọn)."
      - "Open Music Theory, chương Expansion and Contraction at the Phrase Level (John Peterson): mở rộng câu bằng cách kéo dài một hợp âm, làm lại một lần nữa sau một kết bị né tránh, hoặc thêm đoạn đuôi (codetta) sau kết."
      - 'Wikipedia: Motif (music) (đơn vị nhỏ nhất còn mang bản sắc chủ đề; môtip bốn nốt mở đầu Giao hưởng số 5), Sentence (music) (khái niệm "câu" của Schoenberg), Piano Sonata No. 1 (Beethoven) (hợp âm rải đi lên mở đầu là ví dụ đầu tiên Schoenberg dùng để giải thích câu; ý nhạc ngắn dần tới một kết nửa ở ô 8).'
      - "Bản nhạc theo ấn bản Breitkopf & Härtel (1862–1865), bản dàn trang công cộng của Mutopia Project: Giao hưởng số 5, chương 1 (ô 1–5: Sol Sol Sol Mi♭, rồi Fa Fa Fa Rê; ở phần phát triển, các hợp âm chuyền qua lại giữa bộ dây và bộ gỗ, từng hai ô rồi từng ô một) và Sonata Op. 2 số 1, chương 1 (ý cơ bản ở ô 1–2 trên hợp âm chủ, nhắc lại ở ô 3–4 trên hợp âm át)."
    moi:
      - "Open Music Theory, chương Foundational Concepts for Phrase-Level Forms (John Peterson): môtip là một mẩu giai điệu nhỏ, thường nhỏ hơn một ý nhạc, được nhắc lại và biến đổi, ví dụ ở mở đầu Giao hưởng số 5 của Beethoven; các phép biến đổi môtip: kéo dài trường độ (enlargement), rút ngắn trường độ (contraction), đảo, ngược, đổi quãng (intervallic manipulation), dời vị trí nhịp, thêm nốt trang trí."
      - "Open Music Theory, chương The Phrase, Archetypes, and Unique Forms (John Peterson): câu gồm phần trình bày (ý cơ bản, thường dài hai ô nhịp, và lần nhắc lại) và phần tiếp nối (chia nhỏ, tiết tấu dày hơn, chuỗi, hợp âm đổi nhanh hơn, dẫn tới kết); câu điển hình dài 4 hoặc 8 ô nhịp; chia nhỏ (fragmentation) là làm các đơn vị ngắn hơn đơn vị đã lập; đoạn nhạc gồm vế trước kết yếu hơn và vế sau kết mạnh hơn (thường là kết trọn)."
      - "Open Music Theory, chương Expansion and Contraction at the Phrase Level (John Peterson): mở rộng câu bằng cách kéo dài một hợp âm hay giai điệu, làm lại một lần nữa sau một kết bị né tránh, hoặc thêm đoạn đuôi (codetta) sau kết."
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: mục motif (hình nhạc ngắn nhất còn hiểu được, ví dụ bốn nốt đầu Giao hưởng số 5 của Beethoven), mục diminution (rút ngắn trường độ các nốt)."
      - 'Wikipedia: Augmentation (music) (làm trường độ dài hơn; thường gấp đôi), Sentence (music) (khái niệm "câu" của Schoenberg: một môtip cơ bản và lần nhắc lại bổ sung), Piano Sonata No. 1 (Beethoven) (hợp âm rải đi lên mở đầu là ví dụ đầu tiên Schoenberg dùng để giải thích câu; ý nhạc ngắn dần tới một kết nửa ở ô 8).'
      - "Beethoven, Giao hưởng số 5: Đại học Rochester, Beethoven Symphony No. 5 (môtip lặp đi lặp lại ở những cao độ khác nhau; cuối phần phát triển chỉ còn hai nốt rồi một nốt, chuyền qua lại giữa bộ dây và bộ hơi); Burgess Hill Symphony Orchestra, Beethoven, Giao hưởng số 5 (phần phát triển: sau hai lần tiếng kèn horn, các hợp âm chuyền qua lại giữa bộ dây và bộ hơi)."
      - "Bản nhạc theo ấn bản Breitkopf & Härtel (1862–1865), bản dàn trang công cộng của Mutopia Project: Sonata Op. 2 số 1, chương 1 (ý cơ bản ở ô 1–2 trên hợp âm chủ, nhắc lại ở ô 3–4 trên hợp âm át, hai mảnh một ô nhịp ở ô 5–6, kết nửa trên hợp âm Đô ở ô 8)."
    ly_do: 'n6, n10, n21: chỉ ghi nguồn đã mở và có nói điều ấy; chi tiết ô 1–5 và "từng hai ô rồi từng ô một" không kiểm được. mo/link-hong (06/11/2026): link ngoài hỏng (lychee 07/11/2026); bảng nghe Listen 8e không còn và không có bản lưu, thay bằng Rochester và BHSO (n20, n21, n37).'
