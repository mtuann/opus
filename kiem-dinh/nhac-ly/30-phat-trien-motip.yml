  - id: n29
    cau: 'Ví dụ kinh điển: 8 ô nhịp mở đầu Sonata piano số 1 của Beethoven, Op. 2 số 1 (Fa thứ): hợp âm rải đi lên 2 ô nhịp, nhắc lại ở hợp âm át, rồi các mảnh ngắn dần dồn tới kết nửa.'
    loai: cau-truc
    nguon:
      - mutopia-op2
      - wiki-op2
    ket_qua: dung
    ghi_chu: 'Tệp LilyPond Mutopia (Breitkopf & Härtel, 1862–1865; Op. 2 số 1; 1794/95; \key f \minor): có nốt dạo (c), ô 1 hợp âm rải Fa thứ đi lên (f aes c f), ô 2 aes''''. nhóm ba móc kép f'''' r; ô 3–4 lặp trên hợp âm Đô bảy (e g bes c''); ô 5 và ô 6 mỗi ô là một mảnh một ô nhịp (nửa sau của ý cơ bản, ô 6 cao hơn một bậc); ô 7–8 đi xuống rồi dừng trên hợp âm Đô – Sol (dấu ngân): kết nửa ở ô 8. Wikipedia (bậc 3): mở đầu sonata là ví dụ đầu tiên Schoenberg dùng cho câu; "climatic half cadence in measure 8". "Hợp âm át": hợp âm Đô bảy hợp (Đô trưởng) trên Fa thứ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/O2/LVB_Sonate_02no1_1/LVB_Sonate_02no1_1.ly", "https://siemhuijsman.com/a-brief-introduction-to-the-concept-of-sentence/" ]
    luot_2_ghi_chu: "Mutopia Op. 2 số 1 chương 1: Fa thứ, hình đi lên ở ô 1-2, nhắc lại ở ô 3-4 trên hợp âm C7 (át), rồi các mảnh ngắn dần kết ở nốt át có dấu miễn nhịp; Siem Huijsman gọi đây là ví dụ sentence nổi tiếng. Số ô 8 và kết nửa dựa vào mô tả (chưa đếm lại trên bản in)."
