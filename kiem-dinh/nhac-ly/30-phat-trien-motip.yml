ghi_chu: 'Trang phát triển môtip và cấu trúc câu (tầng lõi), 2 khối abc soạn riêng. Nguồn chính: OMT (Foundational Concepts, Phrase Archetypes, Expansion and Contraction), COD (motif, diminution), Listen 8e bảng nghe Giao hưởng số 5, tệp LilyPond Mutopia của Sonata Op. 2 số 1 (đọc qua WebFetch). WebFetch ngày 28/10/2026. Chữ sửa: "nổi tiếng nhất" (n4), ô nhịp 3–5 của Beethoven (n10), phần phát triển (n21), độ dài câu (n26), mở rộng câu (n31), lời giải thích câu hỏi 2 (n37). CHỖ CHƯA CHẮC cần review/lượt 2: n6 và n10 (cao độ Sol Sol Sol Mi♭ rồi Fa Fa Fa Rê ở bản gốc; không mở được tổng phổ: Mutopia Symphony5_1 chỉ có zip và PDF không trích nốt; IMSLP PDF bị chặn). Câu ve-site trỏ tới trang chưa chuyển: nghe-nhac/beethoven-5 (n5), hinh-thuc/sonata (n22), tai-lieu-tham-khao (n40). Thuật ngữ trang dùng: motif, sequence, inversion (giai điệu), augmentation, diminution, fragmentation (đều có hồ sơ riêng ở lô này: motif, sequence, inversion-giai-dieu, augmentation, diminution, fragmentation). Thuật ngữ chưa có ở thuat-ngu.yml (cho D3-L5): retrograde (ngược), sentence (câu), presentation (trình bày), continuation (tiếp nối), basic idea (ý cơ bản), codetta (đoạn đuôi), intervallic change (đổi quãng), period (đoạn nhạc, đã dùng ở bài 13).'
