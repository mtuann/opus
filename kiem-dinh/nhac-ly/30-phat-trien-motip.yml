    ghi_chu: 'Chữ cũ: "kéo dài trước kết (lặp lại hợp âm tiền át), kết lừa rồi làm lại (xem bài 13), hoặc thêm một đoạn đuôi (codetta) sau kết". Chữ mới như trên. Lý do: OMT: "Sometimes composers will lengthen a harmony or melody by increasing its duration" (không nói "hợp âm tiền át"; ví dụ OMT là hợp âm I6 và hợp âm át kết); "1) the music tries to cadence, 2) the attempted cadence is evaded, and 3) the music retries the cadence" (kết bị né tránh, evaded cadence, khác kết lừa nên chữ "kết lừa" đổi thành "kết bị né tránh" kèm link bài 13); codetta: "usually medium length (between 4 and 8 measures)". Review D3-gom: chữ mới có trên trang; lượt 2 đúng (OMT 3.4). Không còn chữ "tiền át" (thống nhất thuật ngữ với bài 24, 27).'
