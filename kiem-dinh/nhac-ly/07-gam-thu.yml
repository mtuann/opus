doi_chu:
  - cu: Gam trưởng nghe sáng và vững vàng. Gam thứ nghe tối hơn, buồn hơn hoặc kịch tính hơn. Mozart Giao hưởng số 40, Beethoven Giao hưởng số 5 và Bach Toccata và Fugue đều viết ở giọng thứ.
    moi: So với gam trưởng, gam thứ nghe tối hơn và thường được dùng để diễn tả nỗi buồn. Mozart Giao hưởng số 40 (Sol thứ), Beethoven Giao hưởng số 5 (Đô thứ) và Bach Toccata và Fugue (Rê thứ, BWV 565) đều viết ở giọng thứ.
    ly_do: 'n1 (da-sua): "sáng và vững vàng", "kịch tính hơn" không có nguồn; câu mới theo OMT Minor Scales ("often (but not always!) ... sadness") và Mount 7.3 ("dark sound"), như lô D2-L1 đã viết ở lộ trình nghe hiểu. n2–n4 (da-sua): thêm giọng của ba tác phẩm (IMSLP); ghi số BWV 565 vì Bach có toccata và fugue ở giọng trưởng (BWV 540, Fa trưởng).'
  - cu: 'So với gam trưởng, điểm khác quyết định là bậc 3: trong La thứ, từ La lên Đô chỉ có 3 nửa cung (quãng 3 thứ), còn trong La trưởng là 4 nửa cung (La lên Đô♯). Chính bậc 3 tạo nên màu "tối" của giọng thứ.'
    moi: "So với gam trưởng, điểm khác quyết định là bậc 3: trong La thứ, từ La lên Đô chỉ có 3 nửa cung (quãng 3 thứ), còn trong La trưởng là 4 nửa cung (La lên Đô♯). Bậc 3 thấp hơn này có mặt ở cả ba dạng gam thứ."
    ly_do: "n10 (da-sua): Mount 7.3 gán màu tối cho cả ba bậc 3, 6, 7 hạ thấp, không riêng bậc 3; câu mới nói điều kiểm được (OMT Minor Scales, ví dụ 10: bậc 3 hạ ở cả ba dạng). Review D3-L1 yêu cầu bỏ cụm \"(xem bảng so sánh bên dưới)\": bảng ấy chỉ có cột Bậc 6, Bậc 7, Dùng khi."
  - cu: Khoảng cách giữa Fa và Sol♯ là 3 nửa cung, nghe hơi "phương Đông". Đây là âm thanh đặc trưng của gam thứ hòa âm.
    moi: Khoảng cách giữa Fa và Sol♯ là 3 nửa cung. Đây là bước nhảy đặc trưng của gam thứ hòa âm.
    ly_do: 'n22 (da-sua): "phương Đông" không có nguồn; phần kiểm được giữ: OMT Minor Scales (công thức W–H–W–W–H–3H–H của gam thứ hòa âm) và Mount 16.4 (quãng 2 tăng giữa bậc 6 và bậc 7).'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Minor Scales, Scale Degrees, and Key Signatures; Major Scales, Scale Degrees, and Key Signatures; Intervals."
      - "Andre Mount, Fundamentals, Function, and Form: chương 7. Minor Scales, 9. Minor Keys and Key Signatures và 16. Minor Scale Variants; Robert Hutchinson, Music Theory for the 21st-Century Classroom: 3.2 Minor Key Signatures."
      - "Giọng của ba tác phẩm: IMSLP, trang Giao hưởng số 40, K. 550 (Mozart), Giao hưởng số 5, Op. 67 (Beethoven) và Toccata và Fugue Rê thứ, BWV 565 (Bach)."
