    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng cách giữa Fa và Sol♯ là 3 nửa cung, nghe hơi "phương Đông". Đây là âm thanh đặc trưng của gam thứ hòa âm." Chữ mới: "Khoảng cách giữa Fa và Sol♯ là 3 nửa cung. Đây là bước nhảy đặc trưng của gam thứ hòa âm." Lý do: "nghe hơi phương Đông" là cảm nhận văn hóa không kiểm được, và nguồn đọc được không nói vậy. Phần kiểm được: OMT Minor Scales: harmonic minor = "W‑H‑W‑W‑H‑3Hs‑H" (bước 3 nửa cung giữa bậc 6 và 7); OMT Intervals, bảng số nửa cung: 3 nửa cung = A2 (quãng 2 tăng); FFF 16.4: "an augmented second appears between the sixth and seventh scale degrees". Bước 3 nửa cung này OMT và FFF gọi là augmented second; trang không đưa tên tiếng Việt vào (bài 9 cũ gọi quãng "4 tăng", "3 thứ", nên sẽ là "quãng 2 tăng"; thuat-ngu.yml chưa có các tính chất quãng: ghi cho D3-L5). Bản cũ ../opus-zero/docs/luyen-tai/nghe-gam.md cũng viết gam thứ hòa âm là "màu Trung Đông / Tây Ban Nha": lô chuyển trang ấy xử lý như ở đây. Review: lượt 2 kiểm chữ đã sửa, đúng; chữ mới có trên trang (soát ngày 24/10/2026).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://www.teoria.com/en/reference/m/minor.php ]
    luot_2_ghi_chu: "OMT, Minor Scales: harmonic minor W‑H‑W‑W‑H‑3Hs‑H (3 nửa cung giữa bậc 6 và 7). teoria.com: 'There is an augmented second between the VI and VII degree'. Fa → Sol♯ = 3 nửa cung (đã tính)."
  - id: n23
    cau: Để tránh bước nhảy 3 nửa cung khi viết giai điệu, người ta nâng cả bậc 6 và bậc 7 khi đi lên (Fa♯, Sol♯).
