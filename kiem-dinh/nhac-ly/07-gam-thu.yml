nhan_dinh:
  - id: n1
    cau: So với gam trưởng, gam thứ nghe tối hơn và thường được dùng để diễn tả nỗi buồn.
    loai: dinh-nghia
    nguon:
      - fff-minor-scales
      - omt-minor
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Gam trưởng nghe sáng và vững vàng. Gam thứ nghe tối hơn, buồn hơn hoặc kịch tính hơn." Chữ mới: "So với gam trưởng, gam thứ nghe tối hơn và thường được dùng để diễn tả nỗi buồn." (mô tả trang sửa theo: cũ "Gam trưởng nghe sáng và vững vàng. Gam thứ nghe tối hơn, buồn hơn hoặc kịch tính hơn. Mozart Giao hưởng số 40, Beethoven Giao hưởng số 5 và Bach Toccata và…", mới "So với gam trưởng, gam thứ nghe tối hơn và thường được dùng để diễn tả nỗi buồn. Mozart Giao hưởng số 40 (Sol thứ), Beethoven Giao hưởng số 5 (Đô thứ) và…"). Lý do: câu cũ nói chung và quá lời. "Sáng và vững vàng" cho gam trưởng và "kịch tính hơn" cho gam thứ không có nguồn; giữ phần nguồn nói được. FFF 7.3: các bậc 3, 6, 7 hạ xuống, "These alterations give the minor scale is unique, dark sound" (nguyên văn, sai chính tả "is" thay cho "its"). OMT Minor Scales: "Minor is often (but not always!) used to depict negative emotions, such as sadness, in Western music." Review: lượt 2 kiểm chữ đã sửa, đúng; chữ mới có trên trang (soát ngày 24/10/2026).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-diatonic-modes-and-the-chromatic-scale/, https://viva.pressbooks.pub/openmusictheory/chapter/triads/ ]
    luot_2_ghi_chu: "OMT, Intro to Diatonic Modes: 'darker modes sound more like a minor scale'; Triads: hợp âm thứ thường được gắn với 'sad'. Đây là liên tưởng thường gặp chứ không phải quy tắc, nên 'thường được dùng' đúng."
  - id: n2
    cau: Mozart Giao hưởng số 40 viết ở giọng thứ (Sol thứ).
    loai: cau-truc
    nguon:
      - imslp-mozart40
      - mt21c-minor-sigs
