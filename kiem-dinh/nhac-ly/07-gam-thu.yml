ghi_chu: 'Trang gam thứ (tầng lõi). Nguồn chính: Open Music Theory (OMT), mở từng chương bằng curl ngày 24/10/2026 (công cụ đọc web bị trang chặn, theo lời giao việc của lô); bổ sung: Andre Mount (FFF) ch. 7, 9, 16, MT21C 3.2; giọng của ba tác phẩm theo IMSLP (trang tác phẩm mở được). Câu về site (n11, n28, n31, n35): kiểm trên bản cũ ../opus-zero/docs/ và JavaScript cũ vì trang đích chưa chuyển; riêng bàn phím kiểm với thành phần mới của lô. Sửa trang: n1 (câu mở đầu và mô tả trang), n2 đến n4 (thêm giọng của ba tác phẩm; Bach thêm số BWV), n10 (bỏ "bậc 3 tạo nên màu tối"), n22 (bỏ "nghe hơi phương Đông", "âm thanh" đổi thành "bước nhảy") và mục Nguồn (thay link chung tới OMT và musictheory.net bằng các chương đã đọc; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, agent không đọc được chữ). Thuật ngữ cho D3-L5: "giọng thứ song song" (relative minor), "giọng thứ cùng tên" (parallel minor), "gam thứ tự nhiên, hòa âm, giai điệu", tính chất quãng ("quãng 2 tăng", "4 tăng", "3 thứ") chưa có trong src/data/thuat-ngu.yml; bài 7 và 8 viết bậc bằng số Ả Rập ("bậc 3, 6, 7") còn bài 6 dùng số La Mã; bản cũ luyen-tai/nghe-gam viết "Thứ hòa thanh" còn bài 7 và công cụ cũ viết "gam thứ hòa âm" (cần một tên). Không tính là nhận định: tên tiêu đề, "Bài tập" mục 1 và 2 (là câu hỏi, đáp án đã tính ở n33, n34).'
