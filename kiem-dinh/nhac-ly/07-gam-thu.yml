    ghi_chu: 'FFF 16.4: nâng bậc 7 "creates a melodic problem: an augmented second appears between the sixth and seventh scale degrees ... By raising scale degree 6̂, one may avoid both of these issues. The interval between 6̂ and 7̂ contracts to become a major second". OMT Minor Scales: "In the ascending form of melodic minor, le–te (6̂–7̂) becomes la-ti (↑6̂–↑7̂)".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://www.teoria.com/en/reference/m/minor.php ]
    luot_2_ghi_chu: "OMT, Minor Scales: melodic minor đi lên nâng cả 6̂ và 7̂ (W‑H‑W‑W‑W‑W‑H). Phần lý do 'tránh bước nhảy': chương Minor Scales của OMT không nêu, teoria.com nêu: 'The main purpose of this accidental is to facilitate the melodic movement from the sixth degree to the seventh degree, avoiding the augmented second'."
