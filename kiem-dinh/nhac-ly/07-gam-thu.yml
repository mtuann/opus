    ghi_chu: 'Tách đôi theo review D3-L1 câu "Gam La thứ hòa âm dùng cùng ngón bấm với Đô trưởng; chỉ cần nhớ Sol♯ ở bậc 7.": vế đầu (ngón bấm) là sự kiện, đổi loại từ khuyen-tap sang quy-tac; vế sau là lời khuyên tập, thành n40. Chữ trang không đổi. Hanon, The Virtuoso Pianist, số 39 (tr. 50; đọc từ ảnh bản scan): "1. A minor, relative to C major" (lời dẫn cùng trang: "We mark by a figure 1 the first (modern) minor scale, also termed the harmonic minor scale") ghi tay phải 1 2 3 1 2 3 4 1, tay trái 5 4 3 2 1 3 2 1, đúng như gam Đô trưởng ngay trên. Baylor Piano Basics 114: "the C major scale fingering applies to G, D, A, and E major, as well as C, G, D, A, and E harmonic minor". (review D3-L1 yêu cầu) Review: soát nhãn tách đôi: vế ngón bấm là quy-tac (lượt 2 bổ sung kiểm với Hanon số 39, đúng), vế lời khuyên là n40.'
    luot_2: dung
    luot_2_nguon: [ https://web.archive.org/web/20160102012523/https://www.uncp.edu/academics/colleges-schools-departments/departments/music/areas-study/keyboard/scale-fingerings, https://archive.org/details/Virtuoso_Pianist_Hanon, https://pianoscales.org/minor-harmonic.html, https://www.cs.miami.edu/home/burt/music/finger-charts.html, https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://robertkelleyphd.com/home/scalfing.htm ]
    luot_2_ghi_chu: "Trang Scale Fingerings của khoa nhạc Univ. of North Carolina at Pembroke (trang gốc nay 404, đọc bản lưu Wayback 20160102012523): gam trưởng nhóm C, G, D, A, E, F có chung một dãy ngón; hòa âm thứ nhóm c, g, d, a, e, f 'Fingering exactly like Major Scales', gồm La thứ. Hanon số 39 (scan archive.org, trang 49 của PDF): 'A minor, relative to C major' dạng 1 (hòa âm, 'harmonic minor') ô nhịp đầu ghi tay phải 1-2-3-1-2-3-4-1, tay trái 5-4-3-2-1-3-2-1 (ngón 2 ở Sol♯), trùng Đô trưởng ngay trên trang. pianoscales.org ghi La thứ hòa âm: tay trái 5,4,3,2,1,3,2,1, tay phải 1,2,3,1,2,3,4,5. Bảng Univ. of Miami: gam bắt đầu C, D, E, G, A (mọi dạng) đều có ngón 4 tay trái ở bậc II, ngón 4 tay phải ở bậc VII. OMT, chương Minor Scales (bản lưu Wayback 20251205150615, vì OMT trả 403): La thứ không có dấu hóa, hòa âm chỉ nâng bậc 7 nên Sol♯ là phím đen duy nhất. Bảng ngón 'tối ưu' của Robert Kelley có dạng khác cho tay trái, nhưng chính trang đó ghi nó có thể không phải cách thường dạy trong sách phương pháp."
