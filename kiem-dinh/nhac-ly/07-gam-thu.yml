    ghi_chu: 'Chữ cũ: "Mozart Giao hưởng số 40"; chữ mới: "Mozart Giao hưởng số 40 (Sol thứ)" (thêm giọng cho rõ). IMSLP, trang Symphony No.40, K.550: Key "G minor"; tên khác "Symphony No. 40 in G Minor, K. 550". MT21C 3.2, chú thích hình 3.2.4: "Mozart, Symphony No. 40 in G Minor, K. 550, 1st movement". Khớp ../opus-zero/docs/nghe-nhac/mozart-40.md ("cung Sol thứ, K. 550"). Review: lượt 2 kiểm chữ đã sửa, đúng; chữ mới có trên trang (soát ngày 24/10/2026).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)", https://musictheory.pugetsound.edu/mt21c/MinorKeySignatures.html ]
    luot_2_ghi_chu: "IMSLP, Symphony No.40, K.550: Key G minor. mt21c mục 3.2 (Figure 3.2.4) cũng ghi 'Symphony No. 40 in G Minor, K. 550, 1st movement'."
  - id: n3
    cau: Beethoven Giao hưởng số 5 viết ở giọng thứ (Đô thứ).
    loai: cau-truc
    nguon:
      - imslp-beethoven5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Beethoven Giao hưởng số 5"; chữ mới: "Beethoven Giao hưởng số 5 (Đô thứ)". IMSLP, trang Symphony No.5, Op.67: Key "C minor"; danh sách chương: "Allegro con brio (C minor, 502 bars)", "Andante con moto (A♭ major, 247 bars)", "Scherzo. Allegro (C minor) - Trio (C major, 374 bars)", "Allegro (C major, 446 bars)". Khớp ../opus-zero/docs/nghe-nhac/beethoven-5.md ("cung Đô thứ, Op. 67"). Review: lượt 2 kiểm chữ đã sửa, đúng; chữ mới có trên trang (soát ngày 24/10/2026).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "IMSLP, Symphony No.5, Op.67 (Beethoven): Key C minor."
  - id: n4
    cau: Bach Toccata và Fugue (BWV 565) viết ở giọng thứ (Rê thứ).
    loai: cau-truc
    nguon:
      - imslp-bwv565
      - imslp-bwv540
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bach *Toccata và Fugue*" (không ghi giọng, không ghi số BWV); chữ mới: "Bach *Toccata và Fugue* (Rê thứ, BWV 565)". Lý do: Bach có nhiều cặp toccata và fugue, trong đó có cặp ở giọng trưởng (IMSLP: Toccata and Fugue in F major, BWV 540, Key "F major"), nên câu cũ không kiểm được nếu không biết là tác phẩm nào. Tác phẩm nổi tiếng nhất là BWV 565 (bản cũ ../opus-zero/docs/nhac-cu/nhac-cu-khac.md: "Toccata và Fugue cung Rê thứ, BWV 565 (nổi tiếng nhất, dù một số học giả nghi ngờ đây có thật là tác phẩm của Bach)"). IMSLP, trang Toccata and Fugue in D minor, BWV 565: Key "D minor", xếp dưới tên Bach. Trang này không bàn về quyền tác giả của BWV 565. Review: lượt 2 kiểm chữ đã sửa, đúng; chữ mới có trên trang (soát ngày 24/10/2026).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Toccata_and_Fugue_in_D_minor,_BWV_565_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "IMSLP, Toccata and Fugue in D minor, BWV 565: Key D minor, 2 sections (Toccata, Fuga). Chỉ kiểm giọng và số BWV, không xét vấn đề tác giả."
  - id: n5
    cau: "Công thức của gam thứ tự nhiên: Cung – Nửa cung – Cung – Cung – Nửa cung – Cung – Cung."
    loai: dinh-nghia
    nguon:
      - omt-minor
    ket_qua: dung
    ghi_chu: 'OMT Minor Scales: "Natural minor: W‑H‑W‑W‑H‑W‑W (ascending)"; "the natural minor form ... ascending succession W‑H‑W‑W‑H‑W‑W".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/ ]
    luot_2_ghi_chu: "OMT, Minor Scales: natural minor W‑H‑W‑W‑H‑W‑W."
  - id: n6
    cau: Gam La thứ dùng toàn phím trắng, giống Đô trưởng nhưng bắt đầu từ La.
    loai: dinh-nghia
    nguon:
      - omt-minor
      - fff-minor-keys
    ket_qua: dung
    ghi_chu: 'A B C D E F G A toàn phím trắng. OMT Minor Scales: "C major does not have any sharps or flats in its key signature, and neither does A minor" (A minor là giọng thứ song song của C major, cùng bảy nốt). FFF 9.2: A minor "uses the pitches of the diatonic A-minor scale (A, B, C, D, E, F, and G)".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature ]
    luot_2_ghi_chu: "A B C D E F G A không dấu hóa (tính theo OMT, Minor Scales); Concise Oxford Dictionary of Music, mục key-signature: 'The keys of C major and A minor require no accidentals.' Đúng cho dạng thứ tự nhiên; dạng hòa âm, giai điệu có Sol♯, Fa♯."
  - id: n7
    cau: "Khoảng cách các cặp nốt liền nhau của gam La thứ tự nhiên: La–Si cung, Si–Đô nửa cung, Đô–Rê cung, Rê–Mi cung, Mi–Fa nửa cung, Fa–Sol cung, Sol–La cung."
    loai: dinh-nghia
    nguon:
      - omt-steps
      - omt-minor
    ket_qua: dung
    ghi_chu: A–B, C–D, D–E, F–G, G–A có phím đen xen giữa (một cung); B–C và E–F là nửa cung tự nhiên (OMT Half Steps). Thành W‑H‑W‑W‑H‑W‑W, khớp công thức gam thứ tự nhiên ở n5.
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/ ]
    luot_2_ghi_chu: "Tính theo công thức tự nhiên (OMT) từ A: A–B W, B–C H, C–D W, D–E W, E–F H, F–G W, G–A W."
  - id: n8
    cau: "Trong La thứ, từ La lên Đô chỉ có 3 nửa cung (quãng 3 thứ), còn trong La trưởng là 4 nửa cung (La lên Đô♯): bậc 3 của gam thứ thấp hơn bậc 3 của gam trưởng cùng tên nửa cung."
    loai: dinh-nghia
    nguon:
      - omt-minor
      - omt-intervals
    ket_qua: dung
    ghi_chu: "OMT Minor Scales: \"A minor scale's third note is always a half step lower than the third note of the major scale with the same name.\" OMT Intervals, bảng số nửa cung: 3 nửa cung = mi3 (3 thứ), 4 nửa cung = ma3 (3 trưởng); A–C = 3, A–C♯ = 4."
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/intervals/ ]
    luot_2_ghi_chu: "OMT, Minor Scales: 'A minor scale's third note is always a half step lower than the third note of the major scale with the same name.' Intervals (bảng số nửa cung): 3 nửa cung = quãng 3 thứ, 4 = quãng 3 trưởng; La → Đô = 3, La → Đô♯ = 4."
  - id: n9
    cau: Điểm khác quyết định giữa gam thứ và gam trưởng là bậc 3.
    loai: dinh-nghia
    nguon:
      - omt-minor
      - fff-minor-scales
    ket_qua: dung
    ghi_chu: "OMT Minor Scales, ví dụ 10 (bảng \"Lowered Scale Degrees (versus major)\"): natural ↓3̂ ↓6̂ ↓7̂; harmonic ↓3̂ ↓6̂; melodic (ascending) ↓3̂. Bậc 3 là bậc duy nhất hạ xuống ở cả ba dạng (bậc 6 và 7 đổi theo dạng); câu đầu của chương: \"A minor scale's third note is always a half step lower than the third note of the major scale with the same name.\" Hiểu \"quyết định\" theo nghĩa này. FFF 7.2: gam thứ khác gam trưởng song song ở \"lowered scale degrees 3̂, 6̂ and 7̂\"."
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/ ]
    luot_2_ghi_chu: "OMT, Minor Scales, Key Takeaways đầu tiên: bậc 3 của gam thứ luôn thấp hơn bậc 3 của gam trưởng cùng tên nửa cung."
  - id: n10
    cau: 'Bậc 3 thấp hơn này có mặt ở cả ba dạng gam thứ.'
    loai: dinh-nghia
    nguon:
      - omt-minor
    ket_qua: da-sua
    ghi_chu: 'Sửa hai lần. (1) Lượt 1: chữ cũ "Chính bậc 3 tạo nên màu "tối" của giọng thứ."; chữ mới "Bậc 3 thấp hơn này có mặt ở cả ba dạng gam thứ (xem bảng so sánh bên dưới)." Lý do: gán màu "tối" riêng cho bậc 3 không kiểm được; FFF 7.3 gán màu tối cho cả ba bậc hạ xuống (3, 6, 7), không riêng bậc 3. (2) Review D3-L1: bỏ cụm "(xem bảng so sánh bên dưới)", vì bảng ấy chỉ có cột Bậc 6, Bậc 7, Dùng khi, không chỉ ra bậc 3; chữ mới "Bậc 3 thấp hơn này có mặt ở cả ba dạng gam thứ." Nguồn của câu: OMT Minor Scales, ví dụ 10 "Lowered scale degrees of minor": tự nhiên ↓3̂, ↓6̂, ↓7̂; hòa âm ↓3̂, ↓6̂; giai điệu (đi lên) ↓3̂. (review D3-L1 yêu cầu) Review: lượt 2 kiểm chữ đã sửa, đúng; review bỏ thêm cụm "(xem bảng so sánh bên dưới)" vì bảng không có cột bậc 3. Chữ mới có trên trang.'
    luot_2: dung
