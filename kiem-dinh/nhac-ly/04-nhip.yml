    cau: Bè cello và contrabass trình bày giai điệu Ode to Joy đầy đủ lần đầu (chương 4 của Giao hưởng số 9).
    loai: lich-su
    nguon:
      - s9-breitkopf
      - s9-schott
      - s9-eulenburg
    ket_qua: da-sua
    ghi_chu: 'Câu cũ ở bài tập 3: "tìm giai điệu Ode to Joy khi nó xuất hiện lần đầu ở bè cello và contrabass". Mới: "…khi bè cello và contrabass trình bày nó đầy đủ lần đầu." Lý do: trước ô thứ 92 đã có một đoạn gợi ngắn ở kèn gỗ: bản Breitkopf tr. 180 (và Schott 1826 tr. 100), bốn ô nhịp đầu ghi "Allegro assai, trắng = 80", kèn gỗ chơi "dolce" hai ô nhịp đầu của giai điệu ở La trưởng (đọc từ ảnh: Đô♯ Đô♯ Rê Mi | Mi Rê Đô♯ Si, cùng bước nhảy với Fa♯ Fa♯ Sol La | La Sol Fa♯ Mi), rồi hai ô nhịp khác, sau đó "Tempo I" (3/4) cắt ngang; giai điệu chỉ được trình bày trọn vẹn từ "Allegro assai" (mm. 92–) ở bè Violoncello và Basso. Kiểm ba bản phổ: ở đó, trên cả trang chỉ hai khuông cuối "Violoncello" và "Basso" (bản in lại: một khuông "Vc. Cb.") mang giai điệu, mọi bè khác nghỉ; bè hát đến sau (Breitkopf tr. 198). Breitkopf tr. 181–182, Schott 1826 tr. 101–102, bản in lại tr. 271. Wikipedia (chỉ để tìm nguồn) cũng viết giai điệu "finally introduced by the cellos and double basses" sau các đoạn nhắc lại ba chương đầu. Lưu ý: ở bè cello và contrabass, hai nốt Fa♯ Fa♯ (và Rê Rê) đầu ô 1, 3, 5, 7 viết thành một nốt trắng; khối abc theo dạng lời hát (khuong_nhac khối 1). Review: lượt 2 kiểm chữ đã sửa, đúng; chữ mới có trên trang (soát ngày 24/10/2026).'
    luot_2: dung
    luot_2_nguon: [ https://www.clevelandorchestra.com/works/symphony-no-9-in-d-minor-op-125-choral, https://www.bhso.org.uk/work/beethoven-symphony-no-9-in-d-minor-2/ ]
    luot_2_ghi_chu: "Cleveland Orchestra: 'The Ode to Joy theme is first played by the cellos and double basses without any accompaniment'; BHSO: 'begins quietly, again in the cellos and basses'. Contrabass = double bass."
