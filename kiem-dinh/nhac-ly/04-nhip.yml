    luot_2_ghi_chu: "Lời khuyên tập, không cần nguồn: hợp lý, hợp cách dạy phổ biến, không trái trang lõi khác. Đối chiếu Open Music Theory, chương Compound Meter and Time Signatures: nhịp 6/8 có hai phách (nốt đen chấm), mỗi phách chia ba, 'the first accented and the second and third non-accented'; đếm 1-2-3-4-5-6 theo nốt móc đơn thì hai chỗ nhấn là 1 và 4. OMT dạy cách đếm '1 la li 2 la li' và ghi rõ giáo viên có thể dùng cách đếm khác; đếm 1 đến 6 là cách đơn giản vẫn thường dạy, không trái nguồn. OMT trả 403 cho công cụ nên đọc bản lưu Wayback: https://web.archive.org/web/20251211145536/https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"
  - id: n27
    cau: Nhịp đơn và nhịp kép là hai họ nhịp.
    loai: dinh-nghia
    nguon:
