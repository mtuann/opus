nhan_dinh:
  - id: n1
    cau: Các phách trong âm nhạc thường được nhóm lại theo chu kỳ, trong đó phách đầu tiên nghe mạnh hơn.
    loai: quy-tac
    nguon:
      - omt-simple
      - fff1
      - dol4
    ket_qua: dung
    ghi_chu: 'Mount, Fundamentals, Function, and Form ch. 1: "When we talk about meter, we refer to how the basic beats are grouped." OMT Simple Meter: "Beat 1 of each of these measures is considered a downbeat." OMT Simple Meter: "you may hear and feel that it has more "weight" or "heaviness" than the other beats." Dolmetsch bài 4: "By convention, the first beat in a bar is usually the strongest."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/, https://www.musiccrashcourses.com/lessons/meter.html ]
    luot_2_ghi_chu: "OMT: meter là mẫu lặp của các nhấn; phách 1 (downbeat) có 'trọng lượng' hơn các phách khác."
  - id: n2
    cau: Mỗi nhóm phách như vậy được ghi trong một ô nhịp, ngăn cách bằng vạch nhịp (đường dọc cắt ngang khuông).
    loai: dinh-nghia
    nguon:
      - omt-simple
      - dol3
    ket_qua: dung
    ghi_chu: 'OMT Simple Meter: "In Western musical notation, beat groupings (duple, triple, quadruple, etc.) are shown using bar lines, which separate music into measures (also called bars)" ... OMT Simple Meter: "Each measure is equivalent to one beat grouping." Dolmetsch bài 3: "The end of each bar (measure) is marked usually with a single vertical line drawn from the top line to the bottom line of the staff or stave. This line is called a bar line (or bar)."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: vạch nhịp chia nhạc thành ô nhịp; mỗi ô tương ứng một nhóm phách."
  - id: n3
    cau: Bản nhạc kết thúc bằng vạch kép.
    loai: quy-tac
    nguon:
      - dol3
      - novas
    ket_qua: dung
    ghi_chu: 'Dolmetsch bài 3: "The final double bar line (final double bar), also known as a period double bar line (period double bar) or terminal double bar line (terminal double bar) (a thin line followed by a thick line), is used to mark the very end of a piece of music or of a particular movement within it." Đúng với "vạch kép kết" (nét mỏng rồi nét dày); vạch kép hai nét mỏng chỉ đánh dấu đoạn giữa bản nhạc. Câu của trang nói "vạch kép" ở nghĩa vạch kết; giữ. Cách gọi ở Việt Nam (chỉ để chứng thực tên gọi): Giáo trình Lý thuyết âm nhạc cơ bản (novaspro.vn): "được gọi là vạch nhịp đôi hay vạch nhịp kép" Giáo trình Lý thuyết âm nhạc cơ bản (novaspro.vn): "Vạch nhịp kép có một nét tô đậm thường dùng để kết thúc tác phẩm" (giáo trình chia "vạch nhịp kép" hai loại: hai nét như nhau, dùng khi đổi nhịp, đổi khóa hay kết một đoạn; và loại có một nét đậm, dùng để kết thúc tác phẩm). "Vạch kép" của trang là cách gọi tắt của "vạch nhịp kép" loại thứ hai: chưa có trong thuat-ngu.yml, ghi cho D3-L5.'
    luot_2: dung
    luot_2_nguon: [ https://www.dolmetsch.com/musictheory3.htm ]
    luot_2_ghi_chu: "Dolmetsch Online: vạch kép kết (một nét mảnh rồi một nét đậm) đánh dấu cuối bản nhạc hay cuối một chương; vạch kép hai nét mảnh chỉ đánh dấu đoạn. Trang nói 'vạch kép' là vạch kết."
  - id: n4
    cau: 'Ở đầu bản nhạc, sau khóa (và sau hóa biểu, nếu có), có hai con số xếp chồng gọi là số chỉ nhịp.'
    loai: dinh-nghia
    nguon:
      - omt-simple
      - omt-major
      - dol4
      - dol9
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ở đầu bản nhạc, ngay sau khóa, có hai con số xếp chồng gọi là số chỉ nhịp:". Chữ mới: "Ở đầu bản nhạc, sau khóa (và sau hóa biểu, nếu có), có hai con số xếp chồng gọi là số chỉ nhịp:" (chữ "hóa biểu" link tới bài 8). Lý do: có hóa biểu thì số chỉ nhịp đứng sau hóa biểu, không ngay sau khóa (lượt 2 cũng ghi). OMT Major Scales: "A key signature, consisting of either sharps or flats, appears at the beginning of a composition, after a clef but before a time signature."; "You can remember this order because it is alphabetical: clef, key, time." Dolmetsch bài 9: "The key signature appear on every line of music immediately after the clef sign."; "The time signature is written only on the first line, placed after the clef sign and key signature." Phần còn lại của câu: OMT Simple Meter: "Time signatures are expressed by two numbers, one above the other, placed after the clef"; Dolmetsch bài 4: "The time signature is written as two numbers, one set above the other, usually placed immediately before the first note". "Số chỉ nhịp" đã có trong thuat-ngu.yml (time signature). (review D3-L1 yêu cầu) Review: đổi "ngay sau khóa" thành "sau khóa (và sau hóa biểu, nếu có)", theo ghi chú của cả hai lượt (OMT: khóa, hóa biểu, số chỉ nhịp).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/, https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT: số chỉ nhịp là hai số xếp chồng đặt sau khóa. Nếu có hóa biểu thì thứ tự là khóa, hóa biểu, số chỉ nhịp (OMT Major Scales); câu đúng với bản không có hóa biểu."
  - id: n5
    cau: "Số trên của số chỉ nhịp: mỗi ô nhịp có bao nhiêu phách."
    loai: dinh-nghia
    nguon:
      - omt-simple
      - dol4
      - mt21c-meter
    ket_qua: dung
    ghi_chu: 'OMT Simple Meter: "In simple meters, the top number of a time signature represents the number of beats in each measure, while the bottom number represents the beat unit." Dolmetsch bài 4: "The upper number tell us the number of beats in a bar." MT21C 4.4 Meter: "Meter describes the number of beats in a measure" Đúng với nhịp đơn; ở nhịp kép (6/8) số trên đếm phần chia, không phải phách: xem câu mới thêm ở n7.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: ở nhịp đơn, số trên là số phách mỗi ô. Nhịp kép khác (số trên đếm phần chia): trang đã nêu riêng ở n7."
  - id: n6
    cau: "Số dưới của số chỉ nhịp: hình nốt nào được tính là 1 phách (4 = nốt đen, 2 = nốt trắng, 8 = nốt móc đơn)."
    loai: dinh-nghia
    nguon:
      - omt-simple
      - dol4
    ket_qua: dung
    ghi_chu: 'OMT Simple Meter: "2, which means the half note gets the beat." OMT Simple Meter: "4, which means the quarter note gets the beat." OMT Simple Meter: "8, which means the eighth note gets the beat." Đúng với nhịp đơn (xem n7 cho 6/8).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: ở nhịp đơn, số dưới là hình nốt được một phách (2 = trắng, 4 = đen, 8 = móc đơn). Nhịp kép khác (n7)."
  - id: n7
    cau: "Riêng 6/8: số trên đếm 6 nốt móc đơn trong ô (8 = nốt móc đơn); cứ ba nốt gộp thành một phách, nên mỗi ô có 2 phách."
    loai: dinh-nghia
    nguon:
      - omt-compound
      - dol15
      - mt21c-meter
    ket_qua: da-sua
    ghi_chu: 'Câu mới thêm ở trang (không có ở trang cũ). Lý do: trang cũ nói chung "số trên: mỗi ô nhịp có bao nhiêu phách; số dưới: hình nốt nào được tính là 1 phách (… 8 = nốt móc đơn)", mâu thuẫn với dòng 6/8 của bảng ("6 nốt móc đơn, nhóm thành 2 phách") và với đoạn dưới ("2 phách lớn"): ở 6/8 phách là nốt đen chấm dôi, không phải móc đơn. OMT Compound Meter: "The top number of a time signature in compound meter expresses the number of divisions in a measure, while the bottom number expresses the division unit". OMT Compound Meter: "If 8 is the bottom number, the beat is a dotted quarter note (equivalent to three eighth notes)." OMT Compound Meter: "each measure has two beats (6÷3=2), indicating duple meter". Dolmetsch bài 15: "The beat is actually a dotted crotchet (dotted quarter note) but the beat is divided into three quavers (eighth notes). Therefore, each bar contains six quavers (eighth notes)." Cách sửa theo hồ sơ bat-dau/tom-tat (n24). Review: lượt 2 kiểm chữ đã sửa, đúng; chữ mới có trên trang (soát ngày 24/10/2026).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT Compound: 6/8 có sáu nốt móc đơn mỗi ô, phách là nốt đen chấm dôi (ba nốt móc đơn), nên hai phách mỗi ô."
  - id: n8
    cau: 2/4 nghĩa là 2 phách, mỗi phách là nốt đen.
    loai: dinh-nghia
    nguon:
      - omt-simple
    ket_qua: dung
