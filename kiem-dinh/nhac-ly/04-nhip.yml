      - dol15
      - novas
    ket_qua: dung
    ghi_chu: 'MT21C 4.4 Meter: "If the beats are normally divided into two parts, the meter is described as simple. If the beats are normally divided into three parts, the meter is described as compound." OMT Compound Meter: "Compound meters are meters in which the beat divides into three and then further subdivides into six." "Nhịp đơn", "nhịp kép" là cách dịch simple / compound meter của site, chưa có trong thuat-ngu.yml: ghi cho D3-L5. Khác biệt cần D3-L5 biết: giáo trình tiếng Việt (novaspro.vn, bậc 3) chia theo số phách và trọng âm, không theo cách chia phách: Giáo trình Lý thuyết âm nhạc cơ bản (novaspro.vn): "Loại nhịp đơn là những loại nhịp có một, hai hoặc ba phách trong một ô nhịp" Giáo trình Lý thuyết âm nhạc cơ bản (novaspro.vn): "Nhịp phức được hình thành nhờ sự kết hợp từ hai hay nhiều nhịp đơn giống nhau." Mục "Loại nhịp phức" của giáo trình đó có cả 4/4 ("Nhịp 4/4 là loại nhịp có 4 phách", phách 3 là "phách mạnh vừa", tức hai nhịp 2/4 ghép lại theo định nghĩa của giáo trình; phân số trong PDF vỡ khi trích chữ nên chỉ đọc được phần mô tả), và bảng thuật ngữ cuối sách ghi "Compound time: nhịp kép, nhịp phức", "Simple time: nhịp đơn". Vậy chữ "nhịp đơn" của trang (gồm 4/4, theo OMT) rộng hơn "nhịp đơn" của giáo trình tiếng Việt (chỉ 1–3 phách), còn "nhịp kép" của trang (6/8, 9/8, 12/8) là một phần của "nhịp phức / nhịp kép" ở giáo trình đó. Theo chuẩn kiểm định mục 2 (sách gọi tên hay định nghĩa khác nhau thì theo OMT) giữ cách xếp của trang, kết quả dung; D3-L5 quyết có thêm chú thích cho người học đã gặp cách gọi ở giáo trình tiếng Việt hay không.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/, https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: nhịp đơn (phách chia hai) và nhịp kép (phách chia ba)."
