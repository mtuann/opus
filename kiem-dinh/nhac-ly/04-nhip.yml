    luot_2_ghi_chu: "3/4: số 3 = ba phách mỗi ô; số dưới 4 = nốt đen một phách; đáp án sai (nốt móc ba, ba câu) đúng là sai."
  - id: n43
    cau: 'Câu hỏi: "Nhịp nào thường dùng cho điệu valse?" Đáp án đúng "3/4"; "2/4", "6/8" sai; giải thích "MẠNH – nhẹ – nhẹ." đúng.'
    loai: quy-tac
    nguon:
      - dol4
      - fff1
    ket_qua: dung
    ghi_chu: '3/4 (n13). 2/4 dùng cho polka, hành khúc (n10). 6/8: Dolmetsch cũng nói 6/8 dùng cho "fast waltzes", nhưng điệu valse thường dùng 3/4 ("used for waltzes, minuets…"); lựa chọn 6/8 sai ở chữ "thường". Giải thích khớp n12.'
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/waltz, https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/02%3A_Simple_Meters/2.04%3A_Triple_Meter ]
    luot_2_ghi_chu: "Valse: 3/4, mạnh–nhẹ–nhẹ; 2/4 và 6/8 không phải nhịp valse thông thường."
  - id: n44
    cau: 'Câu hỏi: "Nhịp 6/8 thường được cảm nhận như thế nào?" Đáp án đúng "2 phách lớn, mỗi phách chia ba"; "6 phách đều nhau" và "3 phách lớn, mỗi phách chia đôi" sai; giải thích "Đếm 1-2-3-4-5-6, nhấn vào 1 và 4." đúng.'
    loai: quy-tac
    nguon:
      - omt-compound
      - lt-compound
      - dol4
    ket_qua: dung
    ghi_chu: 'Đáp án đúng: n25, n30. "6 phách đều nhau" trái n19, n30; "3 phách lớn, mỗi phách chia đôi" là cảm giác của 3/4 (nhịp đơn ba, n11, n28), không phải 6/8. Giải thích: nhấn 1 và 4 (n19, n26).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/ ]
    luot_2_ghi_chu: "6/8 cảm nhận hai phách lớn chia ba; đếm 1–6 nhấn 1 và 4 đúng (OMT: nốt đầu của mỗi phách được nhấn)."
  - id: n45
    cau: 'Câu hỏi: "Ký hiệu C ở vị trí số chỉ nhịp nghĩa là gì?" Đáp án đúng "4/4"; "2/2" và "3/4" sai; giải thích "C là ký hiệu của nhịp 4/4." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-simple
    ket_qua: dung
    ghi_chu: "C (common time) = 4/4 (n17). 2/2 là ký hiệu cut time (chữ C có vạch đứng), không phải chữ C thường: sai. 3/4 không có ký hiệu chữ: sai."
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/ ]
    luot_2_ghi_chu: "OMT: common time (C) = 4/4; 2/2 là cut time (¢ có nét gạch), không phải C."
  - id: n46
    cau: "Hình lưới phách ngay sau bảng \"Số chỉ nhịp\" (::hinh{ten=\"nhip\"}) vẽ bốn nhịp trên cùng một trục tám nốt móc đơn, mỗi nhịp hai hàng: hàng phách ghi cảm giác như cột \"Cảm giác\" (2/4 MẠNH – nhẹ; 3/4 MẠNH – nhẹ – nhẹ; 4/4 MẠNH – nhẹ – vừa – nhẹ; 6/8 hai phách lớn, MẠNH và vừa), ô phách mạnh tô đậm, phách vừa tô vừa; hàng dưới là các nốt móc đơn: mỗi phách của 2/4, 3/4, 4/4 hai ô, mỗi phách của 6/8 ba ô đánh số 1–6 (1 và 4 in đậm). Chú thích: nhịp đơn chia mỗi phách làm hai, 6/8 chia mỗi phách làm ba, nên chỉ có 2 phách lớn."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 06/11/2026: HTML trong dist/<trang>/index.html) và module dựng hình (src/scripts/ve-thoi-gian.js, hàm ghi dưới; vị trí mỗi mục là phần trăm của trục, tests/thoi-gian.test.mjs đọc lại); ảnh chụp 360 và 1280 px. hinhNhip. Khớp bảng (cột \"Ý nghĩa\", \"Cảm giác\"), gạch đầu dòng \"Riêng 6/8\" (6 nốt móc đơn, ba nốt gộp thành một phách, 2 phách), đoạn 6/8 (\"2 phách lớn, mỗi phách chia ba\", đếm \"1-2-3-4-5-6\"), đoạn \"Nhịp đơn và nhịp kép\" (nhịp đơn mỗi phách chia đôi: một nốt đen = hai móc đơn) và lời giải thích câu hỏi 3 (\"nhấn vào 1 và 4\"). Phách lớn thứ hai của 6/8 ghi \"vừa\" vì cột \"Cảm giác\" ghi móc đơn thứ tư là \"vừa\". Hình không ghi chữ đếm cho móc đơn của nhịp đơn (trang không ghi)."
khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem:
      - cu-phap
      - nhip
      - giong
      - not
      - doi-chieu-an-ban
    ket_qua: da-sua
    ghi_chu: 'Trích đoạn tác phẩm thật: Beethoven, Giao hưởng số 9, chương 4, giai điệu Ode to Joy (8 ô nhịp đầu). Hai chỗ đối chiếu: (a) lần đầu trình bày đầy đủ ở bè Violoncello và Basso, mm. 92–99 (trước đó chỉ có một đoạn gợi ngắn ở kèn gỗ, xem n39) (số ô nhịp theo bản in lại tr. 271: số 100 in trên ô thứ chín kể từ "Allegro assai"); (b) bè hát (baritone, "Freude, schöner Götterfunken, Tochter aus Elysium; Wir betreten feuertrunken, Himmlische, dein Heiligthum"). Đối chiếu từng nốt (bằng mắt, trên trang dựng từ PDF bằng PyMuPDF rồi phóng to từng ô nhịp; không có lyrel.py, ozchk trong repo này) với ba bản phổ công cộng: (1) Breitkopf & Härtel, Ludwig van Beethovens Werke, Serie 1 No. 9, khoảng 1864, tấm bản B.9 (tệp "IV. Presto" của IMSLP #61853 ở Wikimedia Commons): bè Violoncello và Basso ở "Allegro assai" tr. 181 (mm. 92–100), bè hát "BARITONO" tr. 198 ("Freude, schöner Götterfunken, Tochter aus Elysium"); (2) Schott, Mainz, 1826, bản in đầu, tấm bản 2322 (Internet Archive, bản scan của Boston Public Library): tr. 101–102, tr. 114; (3) bản phổ in lại tấm bản E.E. 3611 (Wikimedia Commons): tr. 271, tr. 286–287. Bè cello và contrabass: ba bản giống nhau về cao độ, nhịp và giọng; bè hát: kiểm trên Breitkopf (tr. 198) và Schott (tr. 114), bản in lại có cùng chữ lời ở tr. 286–287. Giọng và nhịp bản gốc: Rê trưởng (hóa biểu Fa♯, Đô♯); số chỉ nhịp alla breve (chữ C có vạch đứng), thấy rõ ở bản Schott 1826 và bản Breitkopf (bản in lại cũng ghi dấu tương tự nhưng ảnh scan mờ); ghi "Allegro assai, trắng = 80" ở cả ba bản. Cao độ và nhịp của giai điệu như bè hát hát (mỗi âm tiết một nốt): Fa♯ Fa♯ Sol La | La Sol Fa♯ Mi | Rê Rê Mi Fa♯ | Fa♯. (đen chấm dôi) Mi (móc đơn) Mi (trắng) | Fa♯ Fa♯ Sol La | La Sol Fa♯ Mi | Rê Rê Mi Fa♯ | Mi. Rê Rê (ô 8). Hạ xuống một cung (Rê trưởng sang Đô trưởng) thành Mi Mi Fa Sol | Sol Fa Mi Rê | Đô Đô Rê Mi | Mi. Rê Rê | Mi Mi Fa Sol | Sol Fa Mi Rê | Đô Đô Rê Mi | Rê. Đô Đô, đúng từng nốt của khối abc (30 nốt, 8 ô, mỗi ô 4 phách: abcjs đọc E3/2 D/ D2 = 1½ + ½ + 2). Khác bản gốc, đã nói trên trang (n23): chuyển giọng (Rê trưởng sang Đô trưởng) và viết ở nhịp 4/4 (bản gốc alla breve; mỗi ô vẫn là bốn nốt đen); Q:1/4=100 là tốc độ nghe thử của trang, không phải của Beethoven (trắng = 80, tức khoảng đen = 160), trang không nói tốc độ. Ở bè cello và contrabass (mm. 92–99), hai nốt đầu của ô 1, 3, 5, 7 (Fa♯ Fa♯ và Rê Rê) viết thành một nốt trắng (Fa♯, Sol, La | La Sol Fa♯ Mi | Rê, Mi, Fa♯ | …); khối abc theo dạng lời hát (hai nốt đen lặp lại), trang chỉ nói "giai điệu" nên không sai. Trang cũ piano/10-bai-dau-tien.md (bài 3) cũng viết Ode to Joy ở Đô trưởng ("Beethoven, Giao hưởng số 9, chương 4 (1824). Đô trưởng."). Ấn bản đã ghi ở mục ## Nguồn của trang. Sửa trang: câu mở đầu ví dụ nói rõ 8 ô nhịp đầu, chuyển Đô trưởng, nhịp 4/4, bản gốc Rê trưởng (n23). abcjs (public/vendor/abcjs-basic-min.js, parseOnly) không cảnh báo; mỗi ô đủ độ dài theo tools/khuong-nhac.mjs.'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: 'Soạn cho trang này. M:3/4, L:1/4, Q:1/4=132, K:C. Tám ô: C E G | c2 G | A F D | G3 | C E G | c2 e | d B G | c3: mỗi ô đúng 3 phách (c2 G = 2 + 1; G3 = 3). Hòa âm: ô 1–2 Đô trưởng, ô 3 Rê thứ (D F A), ô 4 Sol, ô 5–6 Đô, ô 7 Sol (G B D), ô 8 Đô: I – I – ii – V – I – I – V – I, đơn giản. Minh họa đúng "đếm 1 – 2 – 3, nhấn vào số 1" ở 3/4 (n11, n12). abcjs (public/vendor/abcjs-basic-min.js, parseOnly) không cảnh báo; mỗi ô đủ độ dài theo tools/khuong-nhac.mjs.'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: 'Soạn cho trang này. M:6/8, L:1/8, Q:3/8=60, K:C. Bốn ô: C E G c G E | D F A d3 | B, D G B G D | C3 C3: mỗi ô sáu nốt móc đơn (d3 = 3, C3 C3 = 3 + 3), chia hai nhóm ba. Q:3/8=60 đặt phách là nốt đen chấm dôi = 60, khớp "2 phách lớn, mỗi phách chia ba" (n18, n25). Hòa âm: Đô trưởng (C E G c G E), Rê thứ (D F A d), Sol (B, D G B G D), Đô: I – ii – V – I. Minh họa đúng "thử đếm 1-2-3-4-5-6" (n26). abcjs (public/vendor/abcjs-basic-min.js, parseOnly) không cảnh báo; mỗi ô đủ độ dài theo tools/khuong-nhac.mjs.'
doi_chu:
  - cu: "Ở đầu bản nhạc, ngay sau khóa, có hai con số xếp chồng gọi là số chỉ nhịp:"
    moi: "Ở đầu bản nhạc, sau khóa (và sau hóa biểu, nếu có), có hai con số xếp chồng gọi là số chỉ nhịp:"
    ly_do: "n4 (da-sua, review D3-L1 yêu cầu): có hóa biểu thì thứ tự ở đầu bản nhạc là khóa, hóa biểu, số chỉ nhịp (Open Music Theory, Major Scales; Dolmetsch bài 9); chữ \"hóa biểu\" link tới bài 8."
  - cu: null
    moi: "Riêng 6/8: số trên đếm 6 nốt móc đơn trong ô (8 = nốt móc đơn); cứ ba nốt gộp thành một phách, nên mỗi ô có 2 phách."
    ly_do: 'n7 (da-sua, thêm một dòng): "số trên là số phách mỗi ô" chỉ đúng với nhịp đơn; ở 6/8 số trên đếm nốt móc đơn và phách là nốt đen chấm dôi (OMT Compound Meter and Time Signatures), như dòng 6/8 của bảng và đoạn "2 phách lớn" bên dưới. Lô D2-L1 đã sửa câu tương tự ở tờ tóm tắt (n24).'
  - cu: "Giai điệu Ode to Joy trong chương cuối Giao hưởng số 9 của Beethoven:"
    moi: "Giai điệu Ode to Joy (8 ô nhịp đầu) trong chương cuối Giao hưởng số 9 của Beethoven, chuyển sang Đô trưởng và viết ở nhịp 4/4 cho dễ đọc (bản gốc ở Rê trưởng):"
    ly_do: "n23 (da-sua), khuông 1: khối là 8 ô nhịp đầu của giai điệu, hạ một cung (bản gốc Rê trưởng, nhịp alla breve), đối chiếu từng nốt với ba bản phổ (Breitkopf khoảng 1864, Schott 1826, bản in lại E.E. 3611); trang cũ không nói đã chuyển giọng."
  - cu: Nghe Beethoven Giao hưởng số 9, chương 4, tìm giai điệu Ode to Joy khi nó xuất hiện lần đầu ở bè cello và contrabass.
    moi: Nghe Beethoven Giao hưởng số 9, chương 4, tìm giai điệu Ode to Joy khi bè cello và contrabass trình bày nó đầy đủ lần đầu.
    ly_do: 'n39 (da-sua): trước ô 92 đã có một đoạn gợi ngắn của giai điệu ở kèn gỗ (Breitkopf tr. 180, Schott 1826 tr. 100); lần trình bày đầy đủ đầu tiên là bè cello và contrabass ở "Allegro assai" (mm. 92–99).'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Simple Meter and Time Signatures; Compound Meter and Time Signatures."
      - "Andre Mount, Fundamentals, Function, and Form: chương 1. Introduction to Rhythm and Meter; Dolmetsch Online, Music Theory Online: bài 3 (ô nhịp, vạch nhịp), bài 4 (số chỉ nhịp) và bài 15 (nhịp đơn và nhịp kép)."
      - "Bản nhạc: Beethoven, Giao hưởng số 9, Op. 125, chương 4 (Breitkopf & Härtel, khoảng 1864, trên IMSLP); Chopin, Valse Op. 64 số 2, trong Forty Piano Compositions (hiệu đính James Huneker, Boston: Oliver Ditson, 1903; bản scan trên Internet Archive)."
    ly_do: "Mục Nguồn: thay link chung tới Open Music Theory bằng link tới đúng các chương đã đọc khi kiểm định (lượt 1), thêm giáo trình mở và bản nhạc đã dùng; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm."
