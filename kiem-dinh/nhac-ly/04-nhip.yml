ghi_chu: 'Bài nhạc lý 4 (phách, ô nhịp, vạch nhịp, số chỉ nhịp 2/4, 3/4, 4/4, 6/8, nhịp đơn và nhịp kép). Nguồn chính: Open Music Theory (OMT), mở từng chương bằng curl ngày 24/10/2026 (WebFetch trả 403); bổ sung Mount (Fundamentals, Function, and Form ch. 1), MT21C (Puget Sound), Equipping the Musical Ear (Sierra College, LibreTexts) cho cảm giác mạnh nhẹ, Dolmetsch Online bài 3, 4, 15, Encyclopædia Britannica 1911 (Polka, Minuet, Barcarole; Wikisource) và Lumen Learning (gigue) cho điệu nhảy. Sửa chữ ở lượt 1: (1) n7: thêm gạch đầu dòng "Riêng 6/8: số trên đếm 6 nốt móc đơn trong ô (8 = nốt móc đơn); cứ ba nốt gộp thành một phách, nên mỗi ô có 2 phách", vì hai gạch đầu dòng cũ nói chung "số trên: mỗi ô nhịp có bao nhiêu phách; số dưới: hình nốt được tính là 1 phách (… 8 = nốt móc đơn)" mâu thuẫn với dòng 6/8 của bảng (ở 6/8 phách là nốt đen chấm dôi, số trên đếm phần chia): cách sửa theo hồ sơ bat-dau/tom-tat (n24); (2) n23: câu giới thiệu khối Ode to Joy nói rõ đây là 8 ô nhịp đầu, chuyển sang Đô trưởng, viết ở nhịp 4/4 (bản gốc ở Rê trưởng); (3) n39 (bài tập 3): "…khi nó xuất hiện lần đầu ở bè cello và contrabass" thành "…khi bè cello và contrabass trình bày nó đầy đủ lần đầu", vì kèn gỗ đã gợi hai ô nhịp đầu của giai điệu trước đó (xem n39); (4) mục ## Nguồn (link từng chương, thêm ấn bản bản nhạc đã đối chiếu, bỏ musictheory.net vì chưa đối chiếu nội dung). Ví dụ Ode to Joy (khuông 1) là trích đoạn tác phẩm thật: đối chiếu từng nốt với ba bản phổ công cộng, xem khuong_nhac khối 1. Hai khuông còn lại (3/4, 6/8) là ví dụ soạn cho trang. Không tính là nhận định: tiêu đề mục, bài tập 1 "Mở máy đếm nhịp…" (tính ở n34), nhãn "Cảm giác" khi chỉ nhắc lại (tính ở n9, n12, n15, n19). Chỗ cần review chú ý: n10, n13, n20 (điệu nhảy thường đi với số chỉ nhịp nào) dựa trên từ điển, không phải mọi bản của điệu đó đều ở nhịp ấy; n20 (gigue ở 6/8): Lumen chỉ nói "compound meter", Dolmetsch nói 6/8 dùng cho jig. Thuật ngữ tiếng Việt chưa có trong src/data/thuat-ngu.yml, ghi cho D3-L5: "nhịp đơn" / "nhịp kép" (simple / compound meter; giáo trình tiếng Việt novaspro.vn gọi "nhịp phức" hay "nhịp kép" là nhịp ghép từ hai nhịp đơn trở lên, gồm cả 4/4, nên khác trang ở 4/4: xem n27, n28), "vạch nhịp" và "vạch kép" (bar line, final double bar; giáo trình đó gọi "vạch nhịp đôi hay vạch nhịp kép", loại một nét đậm để kết tác phẩm: xem n3), "phách mạnh / nhẹ", "ô nhịp" đã có.'
