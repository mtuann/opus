    ghi_chu: 'Chữ cũ: "Xuống 4, lên 2". Chữ mới: "Xuống 4, lên một bậc (lặp lại), rồi kết". Lý do: Canon có bè trầm Rê La Si Fa♯ Sol Rê Sol La (Wikipedia, từ nguồn LilyPond); ở Đô: Đô Sol La Mi Fa Đô Fa Sol. Đô–Sol xuống 4, Sol–La lên bậc; La–Mi xuống 4, Mi–Fa lên bậc; Fa–Đô xuống 4; còn Đô – Fa – Sol cuối không theo mẫu (Đô lên Fa là lên 4), nên chữ cũ "lên 2" không đúng cho cả dãy. Wikipedia: bè trầm "moves down a fourth, and then up stepwise". OMT: chuỗi quãng 3 đi xuống còn gọi là "Pachelbel" theo Canon. Review D3-gom: chữ mới có trên bảng; lượt 2 đúng.'
