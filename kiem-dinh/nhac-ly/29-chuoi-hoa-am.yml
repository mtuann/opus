    ghi_chu: 'Soạn cho trang. K:C, M:4/4, L:1/4, hai khuông (S, B). Hợp âm: [EGc]=C, [FAc]=F, [FBd]=B° (Si Rê Fa, bass Si), [EGB]=Em, [EAc]=Am, [DFA]=Dm, [DGB]=G, [EGc]=C; bass C, F | B, E | A, D | G, C: đúng I – IV – vii° – iii – vi – ii – V – I (n9). Bước bass: Đô lên Fa (4), Fa xuống Si (5 giảm), Si lên Mi (4), Mi xuống La (5), La lên Rê (4), Rê xuống Sol (5), Sol lên Đô (4) (n10). Mỗi ô hai nốt trắng, đủ 4 phách. Không kiểm số ngón (ví dụ nghe, không phải bài tập chơi).'
doi_chu:
  - cu: "Chuỗi (sequence) là một mẫu nhạc ngắn được lặp lại liên tiếp ở các cao độ khác nhau, đi lên hoặc đi xuống đều đặn như những bậc cầu thang. Đây là một trong những khuôn mẫu phổ biến nhất của nhạc tonal, đặc biệt thời Baroque: nghe thấy chuỗi là một manh mối mạnh để nhận diện nhạc Vivaldi, Bach, Handel."
    moi: "Chuỗi (sequence) là một mẫu nhạc ngắn được lặp lại liên tiếp ở các cao độ khác nhau, đi lên hoặc đi xuống đều đặn như những bậc cầu thang. Chuỗi rất hay gặp trong nhạc tonal, nhất là thời Baroque: nghe thấy chuỗi là một manh mối để nhận diện nhạc Baroque, như nhạc Bach và Vivaldi."
    ly_do: 'n2 (da-sua): phần description bị cắt giữa chừng "Đây là một trong…"; bỏ phần cắt theo n2.; n2, n3 (da-sua): không có nguồn xếp hạng "phổ biến nhất"; Handel không có nguồn; Listen 8e (Bach), OMT (Vivaldi).'
  - cu: Chuỗi hòa âm quan trọng nhất là bè trầm đi xuống quãng 5 (hoặc lên quãng 4) liên tục, đi qua mọi hợp âm của giọng. Mỗi hợp âm như một "át âm" của hợp âm tiếp theo, tạo lực kéo không ngừng về phía trước.
    moi: Chuỗi hòa âm tiêu biểu là bè trầm đi xuống quãng 5 (hoặc lên quãng 4) liên tục, đi qua mọi hợp âm của giọng. Gốc của mỗi hợp âm cách gốc hợp âm tiếp theo một quãng 5, như quan hệ át – chủ (riêng cặp Fa – Si là quãng 5 giảm), nên chuỗi tạo lực kéo về phía trước.
    ly_do: 'n7 (da-sua): không có nguồn xếp hạng "quan trọng nhất".; n8 (da-sua): Fa – Si là quãng 5 giảm, không phải át – chủ; chữ cũ nói "mỗi hợp âm".'
  - cu: 'Nghe bè trầm: Đô – Fa – Si – Mi – La – Rê – Sol – Đô, cứ xuống 5 lên 4 xen kẽ. Bạn sẽ nghe thấy cái "đi tới" không cưỡng lại được của chuỗi này.'
    moi: 'Nghe bè trầm: Đô – Fa – Si – Mi – La – Rê – Sol – Đô, cứ lên quãng 4 rồi xuống quãng 5 xen kẽ (riêng Fa xuống Si là quãng 5 giảm). Bạn sẽ nghe thấy cái "đi tới" không cưỡng lại được của chuỗi này.'
    ly_do: "n10 (da-sua): Fa xuống Si là quãng 5 giảm (khối abc 2).; n10 (da-sua, review D3-gom): khối abc 2 đi Đô3 lên Fa3, Fa3 xuống Si2; đổi thứ tự cho khớp bước đầu, để không đọc thành Fa lên Si."
  - cu: Khắp nơi trong Baroque; nhạc jazz (vòng ii – V – I nối nhau)
    moi: Thường gặp trong nhạc tonal; nhạc jazz (vòng ii – V – I nối nhau)
    ly_do: 'n13 (da-sua): "khắp nơi trong Baroque" là cường điệu, không có nguồn riêng cho chuỗi quãng 5.'
  - cu: Xuống 4, lên 2
    moi: Xuống 4, lên một bậc (lặp lại), rồi kết
    ly_do: 'n15 (da-sua): chỉ sáu nốt đầu của bè trầm theo "xuống 4, lên một bậc"; Đô – Fa – Sol cuối là phần kết.'
  - cu: Pachelbel Canon (xem bài 12); bè trầm đi bậc 1–5–6–3, gần với bè trầm 1–7–6–3 của mẫu Romanesca, chỉ khác nốt thứ hai nhảy xuống quãng 4 thay vì đi một bậc, xem các mẫu hòa âm thời Cổ điển
    moi: Pachelbel Canon (xem bài 12); bè trầm đi bậc 1–5–6–3–4–1–4–5; bốn nốt đầu là dạng bè trầm nhảy (xuống 4, lên một bậc) của mẫu Romanesca, còn dạng galant về sau đi 1–7–6–3; xem các mẫu hòa âm thời Cổ điển
    ly_do: 'n17 (da-sua): Gjerdingen gọi ô 5 của Canon là "an obvious Romanesca"; công thức bè trầm Romanesca là 1–5–6–3; dạng 1–7–6–3 chỉ có nguồn bậc 3.; n17 (da-sua, review D3-gom): Gjerdingen ch. 2 phân biệt dạng nhảy (Pachelbel, Handel; thế kỷ 17) và dạng galant (1–7–6–3); thống nhất với luyen-tai/nghe-tien-trinh và trang mau-galant.'
  - cu: Đi lên hoặc xuống từng nửa cung
    moi: Đi xuống từng nửa cung
    ly_do: "n21 (da-sua): OMT chỉ nêu dạng đi xuống từng nửa cung."
  - cu:
      - "Vivaldi Mùa xuân: các đoạn độc tấu violin đầy chuỗi giai điệu."
      - "Handel Messiah, Hallelujah: nhiều chuỗi tạo cảm giác hân hoan dâng lên."
      - "Bach, Prelude cung Đô thứ BWV 847 (cặp với Fugue): những hình nốt lặp lại trên chuỗi hợp âm."
    moi:
      - "Vivaldi Mùa đông (Concerto violin Op. 8 số 4), chương 2, ô 11–13: một chuỗi 5–6 đi lên."
      - "Albéniz, Catalonia (số 34–36 trong tổng phổ): một chuỗi quãng 5 đi xuống."
      - "Amanda Maier, Sáu tiểu phẩm cho violin, số 6, ô 162–169: một chuỗi quãng 3 đi xuống."
    ly_do: "n26, n27, n28 (da-bo) và n22, n24, n25 (da-sua): ba ví dụ cũ không kiểm được; ba ví dụ mới theo chú thích của OMT."
  - cu:
      - "Open Music Theory: chương Diatonic Sequences in Middles (John Peterson): chuỗi là một mẫu được nhắc lại và dịch cao độ; chuỗi quãng 5 đi xuống, chuỗi quãng 3 đi xuống (còn gọi là chuỗi Pachelbel), chuỗi 5–6 đi lên; chương Chromatic Sequences (Bryn Hughes): chuỗi quãng 5 có các hợp âm át nối nhau, chuỗi đi xuống từng nửa cung (ví dụ của Chopin), được dùng suốt thế kỷ 19; chương ii–V–I (Megan Lavengood): nhạc jazz nối các vòng ii–V–I ở nhiều giọng thành chuỗi."
      - "Wikipedia, Sequence (music): định nghĩa; chuỗi thường gắn với nhạc Baroque, nhất là Vivaldi; bè trầm của chuỗi quãng 5 Đô – Fa – Si – Mi – La – Rê…; chuỗi quãng 3 đi xuống và dạng Pachelbel (bè trầm xuống quãng 4 rồi lên một bậc); chuỗi 5–6 đi lên."
      - "Wikipedia, Pachelbel's Canon: vòng tám hợp âm trên bè trầm lặp lại, theo mẫu Romanesca mà Robert Gjerdingen coi là khuôn mẫu phổ biến ở thế kỷ 17–18."
      - 'Wikipedia, Messiah Part II: ở đoạn "King of Kings" của Hallelujah, bè soprano và kèn trumpet được đẩy lên cao dần.'
      - 'Bản nhạc của các ví dụ, bản dàn trang công cộng của Mutopia Project: Prelude Đô thứ BWV 847 theo ấn bản Breitkopf & Härtel 1866 (ô 6–11 là một chuỗi quãng 5 đi xuống trên cùng một hình nốt lặp lại: mẫu hai ô, mỗi lần thấp hơn một bậc), Hallelujah (bè soprano ngân Rê, Mi, Fa♯, Sol trên lời "King of Kings, and Lord of Lords"), La primavera (các đoạn violin độc tấu ở chương 1 và 3 lặp một hình nhạc ở nhiều cao độ).'
    moi:
      - "Open Music Theory: chương Diatonic Sequences in Middles (John Peterson): chuỗi là một mẫu được nhắc lại và dịch cao độ; chuỗi quãng 5 đi xuống (gốc hợp âm đi xuống quãng 5 hay lên quãng 4; ví dụ Albéniz, Catalonia), chuỗi quãng 3 đi xuống (còn gọi là chuỗi Pachelbel; ví dụ Amanda Maier, Sáu tiểu phẩm cho violin số 6), chuỗi 5–6 đi lên (ví dụ Vivaldi, Concerto violin Op. 8 số 4, chương 2, ô 11–13); chương Chromatic Sequences (Bryn Hughes): chuỗi quãng 5 có các hợp âm át nối nhau, chuỗi đi xuống từng nửa cung (ví dụ của Chopin), được dùng suốt thế kỷ 19; chương ii–V–I (Megan Lavengood): nhạc jazz nối các vòng ii–V–I ở nhiều giọng thành chuỗi."
      - "The Concise Oxford Dictionary of Music, mục sequence, qua Encyclopedia.com: chuỗi là sự lặp lại gần như chính xác một đoạn nhạc ở cao độ cao hơn hay thấp hơn."
      - "Listen, bản 8 (Macmillan Learning), chương 9: chuỗi là một đặc điểm dễ nhận ra của giai điệu Baroque, ví dụ ở chủ đề chương 1 của Bach, Brandenburg số 5."
      - 'Robert Gjerdingen, Music in the Galant Style (2007), chương 2 (bản trích): Canon của Pachelbel ở ô 5 "presents an obvious Romanesca"; Romanesca là một công thức bè trầm Ý, được chú ý từ thế kỷ 16 và phổ biến trong thế kỷ 17; dạng bè trầm nhảy (Pachelbel, Handel) đặc trưng cho thế kỷ 17 và đầu thế kỷ 18, dạng đi bậc cho cuối thế kỷ 18.'
      - "Wikipedia, Sequence (music): chuỗi quãng 5 có gốc Đô – Fa – Si – Mi – La – Rê; chuỗi quãng 3 đi xuống; dạng Pachelbel (bè trầm xuống quãng 4 rồi lên một bậc); chuỗi 5–6 đi lên. Pachelbel's Canon: bè trầm Rê – La – Si – Fa♯ – Sol – Rê – Sol – La, tám hợp âm lặp lại."
    ly_do: 'n17, n26, n27, n28: chỉ ghi nguồn đã mở và có nói điều ấy.; n34 (da-sua, review D3-gom): "nhiều nhất" không có nguồn; Listen 8e: "One easily recognized feature of Baroque melodies is their frequent use of sequence".; n34 (da-sua, review D3-gom): giữ điều có nguồn (Listen 8e ch. 9).; Mục Nguồn (review D3-gom, theo n17): Gjerdingen ch. 2, tr. 32–33.'
