  - id: n34
    cau: 'Câu hỏi 3: "Chuỗi là một đặc điểm dễ nhận ra của giai điệu thời kỳ nào?" Đáp án: Baroque (giải thích: giai điệu Baroque dùng chuỗi rất thường xuyên, như chủ đề chương 1 Brandenburg số 5 của Bach).'
    loai: lich-su
    nguon:
      - listen-bq
      - wiki-seq
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chuỗi hòa âm là đặc trưng nổi bật của thời kỳ nào?" ... "Vivaldi, Bach, Handel dùng rất nhiều." Lý do: "đặc trưng nổi bật" và "Handel" như n2, n3; Wikipedia: chuỗi "widespread throughout Western music history", "stereotypically associated with Baroque". Các lựa chọn sai (Trung cổ, tối giản thế kỷ 20) vẫn sai. Review D3-gom: lượt 2 (khong-chac): không có nguồn cho "được nhắc tới nhiều nhất" và "có mặt ở mọi thời". Chữ cũ: câu hỏi "Chuỗi thường được nhắc tới nhiều nhất khi nói về nhạc của thời kỳ nào?", giải thích "Chuỗi có mặt ở mọi thời, nhưng đặc biệt dễ nghe thấy trong nhạc Baroque, như Bach và Vivaldi." Chữ mới: "Chuỗi là một đặc điểm dễ nhận ra của giai điệu thời kỳ nào?", giải thích "Giai điệu Baroque dùng chuỗi rất thường xuyên, như chủ đề chương 1 Brandenburg số 5 của Bach." Nguồn: Listen 8e ch. 9: "One easily recognized feature of Baroque melodies is their frequent use of sequence", ví dụ Brandenburg số 5. Lựa chọn sai (Trung cổ, tối giản thế kỷ 20) giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/25-diatonic-descending-fifth-sequences/" ]
    luot_2_ghi_chu: "Mount: chuỗi xuất hiện nhiều nhất trong nhạc Baroque. Chuỗi cũng có ở thời kỳ khác nên đáp án là mức độ thường gặp."
