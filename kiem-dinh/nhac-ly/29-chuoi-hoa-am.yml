  - id: n13
    cau: 'Bảng: chuỗi quãng 5 đi xuống thường gặp trong nhạc tonal; nhạc jazz nối các vòng ii – V – I.'
    loai: lich-su
    nguon:
      - omt-diat
      - omt-chrom
      - omt-251
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khắp nơi trong Baroque; nhạc jazz (vòng ii – V – I nối nhau)". Chữ mới: "Thường gặp trong nhạc tonal; nhạc jazz (vòng ii – V – I nối nhau)". Lý do: không có nguồn nói riêng chuỗi quãng 5 ở "khắp nơi trong Baroque"; OMT trình bày chuỗi quãng 5 là chuỗi diatonic cơ bản (ví dụ Albéniz), và (Chromatic Sequences) chuỗi quãng 5 có hợp âm át nối nhau dùng suốt thế kỷ 19. Jazz: OMT ii–V–I, "Ceora" của Lee Morgan "is entirely composed of ii–V–Is"; chuỗi ii–V–I ở nhiều giọng (như "Afternoon in Paris": Si♭ rồi La♭). Review D3-gom: chữ mới có trên bảng; lượt 2 đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/31%3A_Introduction_to_Jazz_Theory/31.08%3A_Standard_Chord_Progressions" ]
    luot_2_ghi_chu: "Chuỗi quãng 5 phổ biến trong nhạc tonal; Hutchinson 31.8: jazz dùng ii-V-I và iii-vi-ii-V, mỗi hợp âm cách quãng 5 (câu 'nối các vòng' là cách nói chung)."
