  - id: n17
    cau: Bè trầm của Canon Pachelbel đi bậc 1–5–6–3–4–1–4–5; bốn nốt đầu là dạng bè trầm nhảy (xuống 4, lên một bậc) của mẫu Romanesca, còn dạng galant về sau đi 1–7–6–3.
    loai: cau-truc
    nguon:
      - gjerdingen2
      - wiki-pach
      - wiki-rom
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bè trầm đi bậc 1–5–6–3, gần với bè trầm 1–7–6–3 của mẫu Romanesca, chỉ khác nốt thứ hai nhảy xuống quãng 4 thay vì đi một bậc". Chữ mới: "bè trầm đi bậc 1–5–6–3–4–1–4–5, mở đầu bằng công thức bè trầm Romanesca". Lý do: Gjerdingen (chương 2, bản trích): bè trầm Romanesca được gọi theo "prima di tono, quinta di tono, sesta di tono" (bậc 1, 5, 6) và "Pachelbel Canon (ca. 1680) … first three-voice combination, in measure 5, presents an obvious Romanesca"; Wikipedia Romanesca: bè trầm III–VII–i–V (ở giọng trưởng song song: 1–5–6–3). Dạng 1–7–6–3 là mẫu Romanesca của phong cách galant (chỉ có Wikipedia, bậc 3, bảng Galant Schemata); chưa mở được nguồn bậc 2 cho dạng ấy, nên bỏ phép so sánh khỏi trang. Chữ "1–5–6–3–4–1–4–5": Wikipedia Pachelbel Canon, bảng tám hợp âm D A Bm F♯m G D G A. Review D3-gom: lượt 2 (khong-chac) không mở được nguồn bậc 2. Review mở lại Gjerdingen ch. 2 (gjerdingen2): bè trầm Romanesca được tả là "prima di tono, quinta di tono, sesta di tono" (bậc 1, 5, 6); dạng nhảy: "a bass that alternates descending leaps of a fourth with ascending steps of a second" (tr. 29); Canon của Pachelbel (tr. 27) là ví dụ; "the leaping variant (Pachelbel and Handel) is more characteristic of the seventeenth and very early eighteenth centuries", dạng đi bậc của cuối thế kỷ 18 (tr. 32); bè trầm galant: "The first three tones of the galant bass match the stepwise variant, while its third through fifth tones match the leaping variant" (tr. 33), tức 1–7–6–3. Thống nhất giữa các trang: bài 29 nói dạng nhảy 1–5–6–3; luyen-tai/nghe-tien-trinh ("Romanesca: Đô – Si – La – Mi") và trang mau-galant cũ (1–7–6–3) nói dạng galant. Để người đọc không thấy hai trang trái nhau, chữ cũ "…, mở đầu bằng công thức bè trầm Romanesca;" thành "…; bốn nốt đầu là dạng bè trầm nhảy (xuống 4, lên một bậc) của mẫu Romanesca, còn dạng galant về sau đi 1–7–6–3;". Mục Nguồn (Gjerdingen) thêm câu về hai dạng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas-summary/", "https://essaysonmusic.com/?p=25952" ]
    luot_2_ghi_chu: "OMT: Romanesca galant có bè trầm 1-7-6-3. Leaping Romanesca có các giai đoạn chẵn tiếp cận bằng quãng 4 đi xuống, khớp 1-5-6-3. Nguồn bậc 2 không nêu thẳng Pachelbel dùng dạng này; phần 1-5-6-3-4-1-4-5 là bè trầm quen thuộc của Canon."
