nhan_dinh:
  - id: n1
    cau: Chuỗi (sequence) là một mẫu nhạc ngắn được lặp lại liên tiếp ở các cao độ khác nhau, đi lên hoặc đi xuống đều đặn như những bậc cầu thang.
    loai: dinh-nghia
    nguon:
      - omt-diat
      - cod-seq
    ket_qua: dung
    ghi_chu: 'OMT: "A sequence is a pattern that has been repeated and transposed". COD: "the more or less exact repetition of a passage at a higher or lower level of pitch". "Đều đặn": các ví dụ OMT dịch cả mẫu xuống hay lên một bậc mỗi lần.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/" ]
    luot_2_ghi_chu: "OMT: sequence là mẫu được lặp lại và dịch chuyển (transposed); khớp với câu."
  - id: n2
    cau: Chuỗi rất hay gặp trong nhạc tonal, nhất là thời Baroque.
    loai: lich-su
    nguon:
      - listen-bq
      - wiki-seq
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là một trong những khuôn mẫu phổ biến nhất của nhạc tonal, đặc biệt thời Baroque". Chữ mới: "Chuỗi rất hay gặp trong nhạc tonal, nhất là thời Baroque." Lý do: không tìm được nguồn xếp hạng "một trong những khuôn mẫu phổ biến nhất". Listen 8e: "One easily recognized feature of Baroque melodies is their frequent use of sequence"; "Sequences provide Baroque music with one of its most effective means of forward motion". Wikipedia (bậc 3): "widespread throughout Western music history", "stereotypically associated with Baroque music". Phần description của trang bị cắt giữa chừng ("Đây là một trong…") nên bỏ phần cắt. Review D3-gom: lượt 2 (khong-chac) không mở được nguồn bậc 2 cho vế Baroque. Review mở lại Listen 8e, chương 9 (listen-bq, sách giáo khoa của Macmillan Learning): "One easily recognized feature of Baroque melodies is their frequent use of sequence"; "Sequences provide Baroque music with one of its most effective means of forward motion." OMT Diatonic Sequences có ví dụ chuỗi từ nhiều thời (Vivaldi, Albéniz, Maier). Chữ trang chỉ nói "rất hay gặp …, nhất là thời Baroque": giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Không có nguồn bậc 2 mở được nói chuỗi đặc biệt hay gặp ở Baroque (chỉ Wikipedia: 'stereotypically associated with Baroque'); OMT không nêu."
  - id: n3
    cau: Nghe thấy chuỗi là một manh mối để nhận diện nhạc Baroque, như nhạc Bach và Vivaldi.
    loai: lich-su
    nguon:
      - listen-bq
      - omt-diat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nghe thấy chuỗi là một manh mối mạnh để nhận diện nhạc Vivaldi, Bach, Handel". Chữ mới: "…một manh mối để nhận diện nhạc Baroque, như nhạc Bach và Vivaldi." Lý do: Listen 8e nêu chuỗi ở chủ đề chương 1 Brandenburg số 5 của Bach; OMT nêu một chuỗi 5–6 đi lên ở Vivaldi, Op. 8 số 4, chương 2, ô 11–13. Không tìm được nguồn nào nói Handel; "mạnh" là mức đánh giá không có nguồn. Review D3-gom: như n2: Listen 8e gọi chuỗi là "easily recognized feature of Baroque melodies" (ví dụ Bach, Brandenburg số 5); OMT nêu chuỗi 5–6 ở Vivaldi Op. 8 số 4. Câu chỉ nói "một manh mối", không nói dấu hiệu duy nhất; giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Như n2: chưa có nguồn bậc 2 cho việc dùng chuỗi làm manh mối nhận diện Baroque; chuỗi có ở mọi thời nên quá mạnh nếu là dấu hiệu duy nhất."
  - id: n4
    cau: 'Link [nhận diện](/opus/nhan-dien/so-sanh-thoi-ky/): trang ấy nói về chuỗi như một đặc điểm của nhạc Baroque.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển (có trong src/data/trang.yml, id nhan-dien/so-sanh-thoi-ky). Kiểm trên site cũ ../opus-zero/docs/nhan-dien/so-sanh-thoi-ky.md: bảng so sánh ghi giai điệu Baroque có "chuỗi" (dòng 16), hòa âm Baroque có "chuỗi quãng 5" (dòng 17), và so sánh "Tối giản và Baroque" nói Baroque "đi đâu đó (chuỗi, chuyển giọng, kết)" (dòng 64). Lô chuyển trang đích phải giữ chuỗi trong cột Baroque; tìm bằng grep -rn "29-chuoi-hoa-am" kiem-dinh/. Review: trang đích chưa chuyển (bản xem: "sắp có"); đã đọc ../opus-zero/docs/nhan-dien/so-sanh-thoi-ky.md: dòng 16 (Giai điệu, cột Baroque: "chuỗi"), dòng 17 (Hòa âm Baroque: "chuỗi quãng 5"), dòng 64 (Baroque "đi đâu đó (chuỗi, chuyển giọng, kết)"). Khớp câu.'
    review: dung
  - id: n5
    cau: Môtip Mi – Rê – Mi – Đô được nhắc lại ba lần, mỗi lần thấp hơn một bậc.
    loai: cau-truc
    nguon:
      - omt-diat
    ket_qua: dung
    ghi_chu: 'Khối abc 1: e d e c | d c d B | c B c A. Mi Rê Mi Đô, rồi Rê Đô Rê Si, rồi Đô Si Đô La: ba lần, mỗi lần dịch xuống một bậc trong giọng Đô (chuỗi giọng, quãng thay đổi chút ít để ở trong giọng). B4 cuối là nốt kết.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/" ]
    luot_2_ghi_chu: "Mi-Rê-Mi-Đô, Rê-Đô-Rê-Si, Đô-Si-Đô-La: mỗi lần thấp hơn một bậc, đúng là chuỗi giai điệu. Không kiểm được hình trên site."
  - id: n6
    cau: Một môtip được nhắc lại, mỗi lần thấp hơn (hoặc cao hơn) một bậc, là chuỗi giai điệu.
    loai: dinh-nghia
    nguon:
      - omt-diat
      - cod-seq
    ket_qua: dung
    ghi_chu: COD phân biệt chuỗi thật (giữ nguyên quãng) và chuỗi giọng (quãng thay đổi chút ít để ở trong giọng); khối abc 1 là chuỗi giọng, hợp với chữ "bậc".
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.02%3A_Melodic_Alteration" ]
    luot_2_ghi_chu: Môtip lặp lại ở bậc khác là chuỗi (sequence); Hutchinson coi dịch chuyển cao độ là sequence.
  - id: n7
    cau: Chuỗi hòa âm tiêu biểu là bè trầm đi xuống quãng 5 (hoặc lên quãng 4) liên tục, đi qua mọi hợp âm của giọng.
    loai: dinh-nghia
    nguon:
      - omt-diat
      - wiki-seq
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chuỗi hòa âm quan trọng nhất là…". Chữ mới: "tiêu biểu". Lý do: không có nguồn xếp hạng "quan trọng nhất"; OMT chỉ nêu chuỗi quãng 5 đầu tiên trong các chuỗi diatonic. OMT: "each successive chord root descends by fifth (or ascends by fourth)". "Mọi hợp âm của giọng": trong giọng Đô trưởng, gốc đi Đô Fa Si Mi La Rê Sol Đô, đủ bảy hợp âm (Wikipedia, bậc 3: gốc Đô, Fa, Si, Mi, La, Rê). Review D3-gom: chữ mới có trên trang.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/" ]
    luot_2_ghi_chu: "OMT: chuỗi quãng 5 đi xuống, gốc mỗi hợp âm giảm quãng 5 hoặc tăng quãng 4."
  - id: n8
    cau: Gốc của mỗi hợp âm cách gốc hợp âm tiếp theo một quãng 5, như quan hệ át – chủ (riêng cặp Fa – Si là quãng 5 giảm), nên chuỗi tạo lực kéo về phía trước.
    loai: quy-tac
    nguon:
      - omt-diat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mỗi hợp âm như một "át âm" của hợp âm tiếp theo, tạo lực kéo không ngừng về phía trước." Chữ mới như trên. Lý do: trong gam trưởng, cặp Fa – Si (IV – vii°) là quãng 5 giảm, không phải át – chủ; chữ cũ nói "mỗi hợp âm" nên sai ở chỗ này. "Lực kéo về phía trước" là cách tả cảm giác nghe; Listen 8e nói chuỗi cho nhạc Baroque "one of its most effective means of forward motion". Review D3-gom: chữ mới có trên trang; khớp khối abc 2 (Fa3 → Si2).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/" ]
    luot_2_ghi_chu: "Gốc mỗi hợp âm cách nhau quãng 5; cặp Fa-Si (C-F-B-E-A-D-G-C) là quãng 5 giảm ở thang âm tự nhiên: đúng."
  - id: n9
    cau: 'Chuỗi quãng 5 đi xuống trong Đô trưởng: I – IV – vii° – iii – vi – ii – V – I.'
    loai: cau-truc
    nguon:
      - omt-diat
      - wiki-seq
    ket_qua: dung
    ghi_chu: 'Tính từ định nghĩa OMT: gốc đi xuống quãng 5 trong giọng, bắt đầu ở Đô: Đô, Fa, Si, Mi, La, Rê, Sol, Đô = I, IV, vii°, iii, vi, ii, V, I. Khớp Wikipedia (bậc 3): "Starting on C in C major, the roots go C, F, B, E, A, D". Khớp khối abc 2.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/" ]
    luot_2_ghi_chu: C-F-B°-E-A-D-G-C trong Đô trưởng ứng I-IV-vii°-iii-vi-ii-V-I.
  - id: n10
    cau: Bè trầm Đô – Fa – Si – Mi – La – Rê – Sol – Đô cứ lên quãng 4 rồi xuống quãng 5 xen kẽ (riêng Fa xuống Si là quãng 5 giảm).
    loai: cau-truc
    nguon:
      - omt-diat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cứ xuống 5 lên 4 xen kẽ". Chữ mới thêm chú thích quãng 5 giảm. Lý do: Fa xuống Si (F3 xuống B2 trên khối abc 2) là quãng 5 giảm. Các bước còn lại đúng: Đô lên Fa (4), Si lên Mi (4), Mi xuống La (5), La lên Rê (4), Rê xuống Sol (5), Sol lên Đô (4). Review D3-gom: lượt 2 (khong-chac) đọc thứ tự "xuống 5 rồi lên 4" và suy ra Fa đi lên Si (quãng 4 tăng), vì không xem được khối abc. Review đọc khối abc 2: bè trầm C,2 F,2 | B,,2 E,2 | A,,2 D,2 | G,,2 C,2 = Đô3 Fa3 Si2 Mi3 La2 Rê3 Sol2 Đô3: Đô lên Fa (quãng 4), Fa3 xuống Si2 (quãng 5 giảm), Si lên Mi (4), Mi xuống La (5), La lên Rê (4), Rê xuống Sol (5), Sol lên Đô (4). Vế "Fa xuống Si là quãng 5 giảm" đúng với khối nhạc; chỉ thứ tự trong câu ngược với bước đầu. Chữ cũ (sau lượt 1): "cứ xuống quãng 5 rồi lên quãng 4 xen kẽ"; chữ mới: "cứ lên quãng 4 rồi xuống quãng 5 xen kẽ" (bước đầu Đô lên Fa), để không ai đọc thành Fa lên Si. Bảng và câu hỏi 2 ("Xuống 5, lên 4", "xuống quãng 5 và lên quãng 4 xen kẽ") tả kiểu chuỗi nói chung, giữ (OMT: "descends by fifth (or ascends by fourth)").'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/", "https://musictheory.sites.gettysburg.edu/?p=1792" ]
    luot_2_ghi_chu: "Chuỗi quãng 5 đi xuống: lên 4 rồi xuống 5 để giữ tầm âm; Fa xuống Si là quãng 5 giảm."
