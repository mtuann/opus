nhan_dinh:
  - id: n1
    cau: Chuỗi (sequence) là một mẫu nhạc ngắn được lặp lại liên tiếp ở các cao độ khác nhau, đi lên hoặc đi xuống đều đặn như những bậc cầu thang.
    loai: dinh-nghia
    nguon:
      - omt-diat
      - cod-seq
    ket_qua: dung
    ghi_chu: 'OMT: "A sequence is a pattern that has been repeated and transposed". COD: "the more or less exact repetition of a passage at a higher or lower level of pitch". "Đều đặn": các ví dụ OMT dịch cả mẫu xuống hay lên một bậc mỗi lần.'
  - id: n2
    cau: Chuỗi rất hay gặp trong nhạc tonal, nhất là thời Baroque.
    loai: lich-su
    nguon:
      - listen-bq
      - wiki-seq
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là một trong những khuôn mẫu phổ biến nhất của nhạc tonal, đặc biệt thời Baroque". Chữ mới: "Chuỗi rất hay gặp trong nhạc tonal, nhất là thời Baroque." Lý do: không tìm được nguồn xếp hạng "một trong những khuôn mẫu phổ biến nhất". Listen 8e: "One easily recognized feature of Baroque melodies is their frequent use of sequence"; "Sequences provide Baroque music with one of its most effective means of forward motion". Wikipedia (bậc 3): "widespread throughout Western music history", "stereotypically associated with Baroque music". Phần description của trang bị cắt giữa chừng ("Đây là một trong…") nên bỏ phần cắt.'
  - id: n3
    cau: Nghe thấy chuỗi là một manh mối để nhận diện nhạc Baroque, như nhạc Bach và Vivaldi.
    loai: lich-su
    nguon:
      - listen-bq
      - omt-diat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nghe thấy chuỗi là một manh mối mạnh để nhận diện nhạc Vivaldi, Bach, Handel". Chữ mới: "…một manh mối để nhận diện nhạc Baroque, như nhạc Bach và Vivaldi." Lý do: Listen 8e nêu chuỗi ở chủ đề chương 1 Brandenburg số 5 của Bach; OMT nêu một chuỗi 5–6 đi lên ở Vivaldi, Op. 8 số 4, chương 2, ô 11–13. Không tìm được nguồn nào nói Handel; "mạnh" là mức đánh giá không có nguồn.'
  - id: n4
    cau: 'Link [nhận diện](/opus/nhan-dien/so-sanh-thoi-ky/): trang ấy nói về chuỗi như một đặc điểm của nhạc Baroque.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển (có trong src/data/trang.yml, id nhan-dien/so-sanh-thoi-ky). Kiểm trên site cũ ../opus-zero/docs/nhan-dien/so-sanh-thoi-ky.md: bảng so sánh ghi giai điệu Baroque có "chuỗi" (dòng 16), hòa âm Baroque có "chuỗi quãng 5" (dòng 17), và so sánh "Tối giản và Baroque" nói Baroque "đi đâu đó (chuỗi, chuyển giọng, kết)" (dòng 64). Lô chuyển trang đích phải giữ chuỗi trong cột Baroque; tìm bằng grep -rn "29-chuoi-hoa-am" kiem-dinh/.'
  - id: n5
    cau: Môtip Mi – Rê – Mi – Đô được nhắc lại ba lần, mỗi lần thấp hơn một bậc.
    loai: cau-truc
    nguon:
      - omt-diat
    ket_qua: dung
    ghi_chu: 'Khối abc 1: e d e c | d c d B | c B c A. Mi Rê Mi Đô, rồi Rê Đô Rê Si, rồi Đô Si Đô La: ba lần, mỗi lần dịch xuống một bậc trong giọng Đô (chuỗi giọng, quãng thay đổi chút ít để ở trong giọng). B4 cuối là nốt kết.'
  - id: n6
    cau: Một môtip được nhắc lại, mỗi lần thấp hơn (hoặc cao hơn) một bậc, là chuỗi giai điệu.
    loai: dinh-nghia
    nguon:
      - omt-diat
      - cod-seq
    ket_qua: dung
    ghi_chu: COD phân biệt chuỗi thật (giữ nguyên quãng) và chuỗi giọng (quãng thay đổi chút ít để ở trong giọng); khối abc 1 là chuỗi giọng, hợp với chữ "bậc".
  - id: n7
    cau: Chuỗi hòa âm tiêu biểu là bè trầm đi xuống quãng 5 (hoặc lên quãng 4) liên tục, đi qua mọi hợp âm của giọng.
    loai: dinh-nghia
    nguon:
      - omt-diat
      - wiki-seq
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chuỗi hòa âm quan trọng nhất là…". Chữ mới: "tiêu biểu". Lý do: không có nguồn xếp hạng "quan trọng nhất"; OMT chỉ nêu chuỗi quãng 5 đầu tiên trong các chuỗi diatonic. OMT: "each successive chord root descends by fifth (or ascends by fourth)". "Mọi hợp âm của giọng": trong giọng Đô trưởng, gốc đi Đô Fa Si Mi La Rê Sol Đô, đủ bảy hợp âm (Wikipedia, bậc 3: gốc Đô, Fa, Si, Mi, La, Rê).'
  - id: n8
    cau: Gốc của mỗi hợp âm cách gốc hợp âm tiếp theo một quãng 5, như quan hệ át – chủ (riêng cặp Fa – Si là quãng 5 giảm), nên chuỗi tạo lực kéo về phía trước.
    loai: quy-tac
    nguon:
      - omt-diat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mỗi hợp âm như một "át âm" của hợp âm tiếp theo, tạo lực kéo không ngừng về phía trước." Chữ mới như trên. Lý do: trong gam trưởng, cặp Fa – Si (IV – vii°) là quãng 5 giảm, không phải át – chủ; chữ cũ nói "mỗi hợp âm" nên sai ở chỗ này. "Lực kéo về phía trước" là cách tả cảm giác nghe; Listen 8e nói chuỗi cho nhạc Baroque "one of its most effective means of forward motion".'
  - id: n9
    cau: 'Chuỗi quãng 5 đi xuống trong Đô trưởng: I – IV – vii° – iii – vi – ii – V – I.'
    loai: cau-truc
    nguon:
      - omt-diat
      - wiki-seq
    ket_qua: dung
    ghi_chu: 'Tính từ định nghĩa OMT: gốc đi xuống quãng 5 trong giọng, bắt đầu ở Đô: Đô, Fa, Si, Mi, La, Rê, Sol, Đô = I, IV, vii°, iii, vi, ii, V, I. Khớp Wikipedia (bậc 3): "Starting on C in C major, the roots go C, F, B, E, A, D". Khớp khối abc 2.'
  - id: n10
    cau: Bè trầm Đô – Fa – Si – Mi – La – Rê – Sol – Đô cứ xuống quãng 5 rồi lên quãng 4 xen kẽ (riêng Fa xuống Si là quãng 5 giảm).
    loai: cau-truc
    nguon:
      - omt-diat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cứ xuống 5 lên 4 xen kẽ". Chữ mới thêm chú thích quãng 5 giảm. Lý do: Fa xuống Si (F3 xuống B2 trên khối abc 2) là quãng 5 giảm. Các bước còn lại đúng: Đô lên Fa (4), Si lên Mi (4), Mi xuống La (5), La lên Rê (4), Rê xuống Sol (5), Sol lên Đô (4).'
  - id: n11
    cau: Bạn sẽ nghe thấy cái "đi tới" không cưỡng lại được của chuỗi này.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả cảm giác nghe, không phải sự kiện kiểm được; không trái với trang lõi khác.
  - id: n12
    cau: 'Bảng: chuỗi quãng 5 đi xuống: bè trầm xuống 5, lên 4; C – F – B° – Em – Am – Dm – G – C.'
    loai: cau-truc
    nguon:
      - omt-diat
      - wiki-seq
    ket_qua: dung
    ghi_chu: Khớp n9, n10.
  - id: n13
    cau: 'Bảng: chuỗi quãng 5 đi xuống thường gặp trong nhạc tonal; nhạc jazz nối các vòng ii – V – I.'
    loai: lich-su
    nguon:
      - omt-diat
      - omt-chrom
      - omt-251
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khắp nơi trong Baroque; nhạc jazz (vòng ii – V – I nối nhau)". Chữ mới: "Thường gặp trong nhạc tonal; nhạc jazz (vòng ii – V – I nối nhau)". Lý do: không có nguồn nói riêng chuỗi quãng 5 ở "khắp nơi trong Baroque"; OMT trình bày chuỗi quãng 5 là chuỗi diatonic cơ bản (ví dụ Albéniz), và (Chromatic Sequences) chuỗi quãng 5 có hợp âm át nối nhau dùng suốt thế kỷ 19. Jazz: OMT ii–V–I, "Ceora" của Lee Morgan "is entirely composed of ii–V–Is"; chuỗi ii–V–I ở nhiều giọng (như "Afternoon in Paris": Si♭ rồi La♭).'
  - id: n14
    cau: 'Bảng: chuỗi quãng 3 đi xuống: bè trầm xuống 3; C – Am – F – Dm.'
    loai: cau-truc
    nguon:
      - omt-diat
      - wiki-seq
    ket_qua: dung
    ghi_chu: 'Wikipedia (bậc 3): "Root notes descend by a third each sequential repetition". OMT: mô hình hai hợp âm được dịch xuống một quãng 3, thường dùng các hợp âm thể gốc hoặc xen thể gốc và thể đảo 1. Dãy gốc C – A – F – D ghi trên bảng là dạng thể gốc mỗi bước, khớp.'
  - id: n15
    cau: 'Bảng: kiểu Pachelbel: bè trầm xuống 4, lên một bậc (lặp lại), rồi kết; C – G – Am – Em – F – C – F – G.'
    loai: cau-truc
    nguon:
      - wiki-seq
      - wiki-pach
      - omt-diat
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Xuống 4, lên 2". Chữ mới: "Xuống 4, lên một bậc (lặp lại), rồi kết". Lý do: Canon có bè trầm Rê La Si Fa♯ Sol Rê Sol La (Wikipedia, từ nguồn LilyPond); ở Đô: Đô Sol La Mi Fa Đô Fa Sol. Đô–Sol xuống 4, Sol–La lên bậc; La–Mi xuống 4, Mi–Fa lên bậc; Fa–Đô xuống 4; còn Đô – Fa – Sol cuối không theo mẫu (Đô lên Fa là lên 4), nên chữ cũ "lên 2" không đúng cho cả dãy. Wikipedia: bè trầm "moves down a fourth, and then up stepwise". OMT: chuỗi quãng 3 đi xuống còn gọi là "Pachelbel" theo Canon.'
  - id: n16
    cau: 'Link [bài 12](/opus/nhac-ly/12-hoa-am-chuc-nang/): bài ấy có nhắc Pachelbel Canon.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên src/content/docs/nhac-ly/12-hoa-am-chuc-nang.md: dòng 44 bảng vòng hợp âm "I – V – vi – iii – IV – I – IV – V | C – G – Am – Em – F – C – F – G | Pachelbel Canon", dòng 83 bài tập nghe Pachelbel Canon. Khớp dãy ở bảng của bài 29.'
  - id: n17
    cau: Bè trầm của Canon Pachelbel đi bậc 1–5–6–3–4–1–4–5, mở đầu bằng công thức bè trầm Romanesca.
    loai: cau-truc
    nguon:
      - gjerdingen2
      - wiki-pach
      - wiki-rom
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bè trầm đi bậc 1–5–6–3, gần với bè trầm 1–7–6–3 của mẫu Romanesca, chỉ khác nốt thứ hai nhảy xuống quãng 4 thay vì đi một bậc". Chữ mới: "bè trầm đi bậc 1–5–6–3–4–1–4–5, mở đầu bằng công thức bè trầm Romanesca". Lý do: Gjerdingen (chương 2, bản trích): bè trầm Romanesca được gọi theo "prima di tono, quinta di tono, sesta di tono" (bậc 1, 5, 6) và "Pachelbel Canon (ca. 1680) … first three-voice combination, in measure 5, presents an obvious Romanesca"; Wikipedia Romanesca: bè trầm III–VII–i–V (ở giọng trưởng song song: 1–5–6–3). Dạng 1–7–6–3 là mẫu Romanesca của phong cách galant (chỉ có Wikipedia, bậc 3, bảng Galant Schemata); chưa mở được nguồn bậc 2 cho dạng ấy, nên bỏ phép so sánh khỏi trang. Chữ "1–5–6–3–4–1–4–5": Wikipedia Pachelbel Canon, bảng tám hợp âm D A Bm F♯m G D G A.'
  - id: n18
    cau: 'Link [các mẫu hòa âm thời Cổ điển](/opus/piano/hoa-am/mau-galant/): trang ấy nói về Romanesca và chuỗi.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển (src/data/trang.yml: piano/hoa-am/mau-galant). Kiểm trên site cũ ../opus-zero/docs/piano/hoa-am/mau-galant.md: dòng 9 "Fonte và Monte là những chuỗi hòa âm (sequence)" (link ngược bài 29), bảng và mục ### Romanesca (dòng 17, 28–30). Lô chuyển trang đích cần giữ: mục Romanesca và liên kết ngược bài 29; nên nói rõ hai dạng: trang ấy ghi Romanesca galant với bè trầm 1–7–6–3, còn bài 29 nói bè trầm Canon Pachelbel mở đầu bằng công thức bè trầm Romanesca 1–5–6–3.'
  - id: n19
    cau: 'Bảng: chuỗi 5 – 6 đi lên: bè trầm lên từng bậc, bè trên đổi quãng 5 thành quãng 6 trên mỗi nốt bass; C – Am/C – Dm – B°/D – Em….'
    loai: cau-truc
    nguon:
      - omt-diat
      - wiki-seq
    ket_qua: dung
    ghi_chu: 'OMT: "a voice that is a fifth above the bass moves to a sixth above the bass". Wikipedia (bậc 3): gốc đi xuống một quãng 3 (thường tới hợp âm thể đảo 1 cùng nốt bass) rồi lên một quãng 4: C, Am/C, Dm, B°/D, Em. Bass: Đô Đô Rê Rê Mi (lên bậc). Trên bass Đô: Sol (quãng 5) rồi La (quãng 6); trên bass Rê: La rồi Si.'
  - id: n20
    cau: Chuỗi 5 – 6 đi lên tạo cảm giác dâng lên, tích tụ.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả cảm giác nghe.
  - id: n21
    cau: 'Bảng: chuỗi nửa cung: bè trầm đi xuống từng nửa cung; gặp trong nhạc Lãng mạn, ví dụ Chopin.'
    loai: lich-su
    nguon:
      - omt-chrom
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đi lên hoặc xuống từng nửa cung". Chữ mới: "Đi xuống từng nửa cung". Lý do: OMT (Hughes) chỉ nêu dạng đi xuống: "a chromatic bass line descending in semitones", "a succession of dominant-seventh chords descending by semitone"; Chopin, Impromptu La♭ trưởng: các hợp âm ba được dịch xuống nửa cung. Chuỗi cromatic đi lên (Example 7, "chromatic ascending step sequence") có gốc đi lên cung, không phải nửa cung. OMT: "These techniques were used by composers throughout the nineteenth century". Ví dụ Chopin khác: Mazurka Đô♯ thứ Op. 30 số 4.'
  - id: n22
    cau: 'Vivaldi, Concerto Mùa đông (Op. 8 số 4), chương 2, ô 11–13: một chuỗi 5–6 đi lên.'
    loai: cau-truc
    nguon:
      - omt-diat
    ket_qua: da-sua
