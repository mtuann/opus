# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa nhac-ly/29-chuoi-hoa-am
trang: src/content/docs/nhac-ly/29-chuoi-hoa-am.md
