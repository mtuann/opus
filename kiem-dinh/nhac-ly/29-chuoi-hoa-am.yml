tang: loi
lan:
  - so: 1
    ngay: '2026-10-28'
    nhanh: moi/d3-l4
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L4 lượt 1, phần 2/2)
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: 'Trang chuỗi hòa âm (tầng lõi), 2 khối abc soạn riêng. Nguồn chính: OMT (Diatonic Sequences in Middles, Chromatic Sequences, ii-V-I), COD (sequence), Listen 8e chương 9, Gjerdingen chương 2; Wikipedia chỉ bậc 3 và không là nguồn duy nhất. WebFetch ngày 28/10/2026 (bản tóm tắt chữ, đã hỏi lại để lấy nguyên văn chỗ quan trọng). Chỗ sai đã sửa: câu mở đầu (n2, n3), quan hệ át – chủ (n8), quãng Fa – Si (n10), cột Gặp ở và cột Bè trầm của hàng bảng (n13, n15, n21), câu Pachelbel – Romanesca (n17), câu hỏi 3 (n34). Đã bỏ: ba ví dụ nghe (Vivaldi Mùa xuân, Handel Hallelujah, Bach Prelude BWV 847; n26–n28), thay bằng ba ví dụ của OMT (n22, n24, n25). Câu ve-site trỏ tới trang chưa chuyển: nhan-dien/so-sanh-thoi-ky (n4), piano/hoa-am/mau-galant (n18), nghe-nhac/vivaldi-mua-dong (n23), luyen-tap/ban-phim (n31), tai-lieu-tham-khao (n35). Chỗ người giao cần biết: trang piano/hoa-am/mau-galant (đợt 4) ghi Romanesca galant với bè trầm 1–7–6–3 trong khi bài 29 nói bè trầm Pachelbel mở đầu bằng công thức Romanesca 1–5–6–3: nên ghi rõ hai dạng. Thuật ngữ trang dùng: sequence (có hồ sơ riêng, lô này). Thuật ngữ chưa có ở thuat-ngu.yml (cho D3-L5): Romanesca, descending fifths sequence (chuỗi quãng 5 đi xuống), 5–6 sequence (chuỗi 5–6), Pachelbel sequence.'
