ghi_chu: 'Trang đối âm (tầng lõi), hình ::hinh{ten="counterpoint"} (src/components/hinh/counterpoint.html). Nguồn chính: Open Music Theory (OMT), chương Species Counterpoint và các chương First đến Fifth-Species, Gradus ad Parnassum Exercises, 16th-Century Contrapuntal Style, High Baroque Fugal Exposition; MT21C (First Species, Fifth Species); COD, Encyclopedia of World Biography (Fux), Britannica (Steps to Parnassus), Beethoven-Haus. WebFetch ngày 28/10/2026 (bản tóm tắt chữ, hỏi lại để lấy nguyên văn chỗ quan trọng). Hình counterpoint: kiểm từng nốt, quãng, kiểu chuyển động, chú thích: ĐÚNG, không có lỗi (n27 đến n30). Chữ đã sửa trên trang: quy tắc 2 (n18, không kết bằng quãng 5; bắt đầu theo vị trí bè), quy tắc 4 (n20, "ba quãng cùng loại": chữ cũ trái ví dụ của trang), cantus firmus "ví dụ đầu tiên" (n23), đáp án câu hỏi 4 (n37), mục Nguồn (bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm). Chưa chắc: không còn. Câu ve-site trỏ trang chưa chuyển: n4 (hinh-thuc/fugue: giữ đường dẫn; xem cả hồ sơ bài 23: trang Fugue phải giữ đoạn về quãng 3 Picardy), n6 (luyen-tap/ban-phim, tai-lieu-tham-khao). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): counterpoint (đối âm), cantus firmus, species (loại đối âm), consonance/dissonance đã có; passing tone (nốt lướt), neighbor tone (nốt thêu), suspension (nốt treo), contrary/parallel motion (chuyển động ngược, song song), clausula; đã có bản ghi: fugue (lô này), polyphony, consonance, dissonance, interval, cadence, leading-tone. Ghi chú nhỏ cho người giao: OMT (First-Species) ghi quãng 4 đúng đôi khi tính là thuận; trang theo OMT, Species Counterpoint (nghịch ở hai bè).'
