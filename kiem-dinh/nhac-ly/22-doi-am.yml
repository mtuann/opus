nhan_dinh:
  - id: n1
    cau: Đối âm (counterpoint) là nghệ thuật viết nhiều giai điệu độc lập cùng lúc mà vẫn hòa hợp.
    loai: dinh-nghia
    nguon:
      - cod-counterpoint
      - omt-16c
    ket_qua: dung
    ghi_chu: 'COD, Counterpoint: "The ability, unique to mus., to say two things at once comprehensibly"; các bè cùng lúc "each of significance in itself", tạo "a coherent texture". OMT (glossary, 16th-Century Contrapuntal Style): đối âm là cách học nghĩ về âm nhạc theo chiều ngang (giai điệu) và đồng thời chiều dọc. Từ "độc lập" cũng là chữ của OMT (First-Species: "melodic independence").'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/counterpoint", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.01%3A_Introduction_to_Species_Counterpoint" ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music: đối âm là khả năng nói hai điều cùng lúc một cách dễ hiểu; OMT: phương pháp viết giai điệu và kết hợp chúng."
  - id: n2
    cau: Hòa âm bốn bè nghĩ theo chiều dọc (hợp âm); đối âm nghĩ theo chiều ngang (từng giai điệu).
    loai: dinh-nghia
    nguon:
      - cod-counterpoint
      - omt-16c
    ket_qua: dung
    ghi_chu: 'COD: đối âm tuyến tính chú ý "the individual strands of the texture", "Linear harmony is the opposite of vertical harmony". OMT glossary: "thinking of music horizontally (melodically)".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.08%3A_16th-Century_Contrapuntal_Style" ]
    luot_2_ghi_chu: "OMT 2.8: nhà soạn nhạc thế kỷ 16 không nghĩ theo hợp âm mà theo quan hệ quãng giữa các bè (nghĩ ngang). Đối lập hòa âm (dọc) và đối âm (ngang) là cách nói thông thường."
  - id: n3
    cau: Đối âm là ngôn ngữ của nhạc Phục hưng và của fugue.
    loai: lich-su
    nguon:
      - omt-16c
      - omt-fugal
    ket_qua: dung
    ghi_chu: 'OMT, 16th-Century Contrapuntal Style: "16th-century imitative choral polyphony (especially in the style of Palestrina)"; OMT, High Baroque Fugal Exposition: fugue là "contrapuntal compositions ... defined by the strict use of a certain number of independent voices". Lưu ý OMT: đối âm loại của Fux là "the later, 18th-century notion of species counterpoint", gần nhưng không đồng nhất với phong cách thế kỷ 16; câu của trang nói về đối âm nói chung.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.08%3A_16th-Century_Contrapuntal_Style", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/counterpoint" ]
    luot_2_ghi_chu: Đối âm đạt đỉnh cuối thế kỷ 16 đầu 17 (Oxford); OMT có chương về phong cách đối âm thế kỷ 16 và chương trình bày fugue baroque trong cùng phần Counterpoint. Câu rộng nhưng chấp nhận.
  - id: n4
    cau: 'Có trang Fugue (/opus/hinh-thuc/fugue/): trang về hình thức fugue, nơi trang này dẫn tới.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/hinh-thuc/fugue.md (tiêu đề "Fugue", mở đầu "Fugue là hình thức phức điệu đỉnh cao của thời Baroque: nhiều bè độc lập lần lượt đuổi theo nhau bằng cùng một chủ đề"). anh-xa.md: `hinh-thuc/fugue`, tầng lõi, D5. Lô chuyển giữ đường dẫn /opus/hinh-thuc/fugue/ và nội dung giải thích fugue. Bài 23 cũng dẫn tới trang này vì đoạn về quãng 3 Picardy (xem hồ sơ bài 23). Review: trang đích /opus/hinh-thuc/fugue/ chưa chuyển (bản xem: "sắp có"), đã kiểm bản cũ ../opus-zero/docs/hinh-thuc/fugue.md: tiêu đề "Fugue", giải thích hình thức fugue (các bè lần lượt đuổi theo nhau bằng cùng một chủ đề). Lô chuyển (D5) giữ đường dẫn và nội dung ấy.'
    review: dung
  - id: n5
    cau: Hòa âm bốn bè ở bài 21 (/opus/nhac-ly/21-hoa-am-bon-be/) và nốt treo ở bài 18 (/opus/nhac-ly/18-am-ngoai-hop-am/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Site mới: src/content/docs/nhac-ly/21-hoa-am-bon-be.md (tiêu đề "21. Hòa âm bốn bè", dạy viết hợp âm cho bốn bè); src/content/docs/nhac-ly/18-am-ngoai-hop-am.md (tiêu đề "18. Âm ngoài hợp âm", bảng có "Nốt treo (suspension)" ở dòng 14 và mục nốt treo 4–3). Review: đã kiểm hai link trên trang: /opus/nhac-ly/21-hoa-am-bon-be/ ("21. Hòa âm bốn bè", cùng nhánh) và /opus/nhac-ly/18-am-ngoai-hop-am/ (bảng có "Nốt treo (suspension)", dòng 14; mục nốt treo 4–3, dòng 38).'
    review: dung
  - id: n6
    cau: Có trang Bàn phím piano (/opus/luyen-tap/ban-phim/) và tài liệu tham khảo (/opus/tai-lieu-tham-khao/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/luyen-tap/ban-phim.md (tiêu đề "Bàn phím piano": chọn nốt gốc và loại gam hay hợp âm để tô phím, bấm Nghe); anh-xa.md: `luyen-tap/ban-phim`, tầng khung, D7-L1. ../opus-zero/docs/tai-lieu-tham-khao.md (tiêu đề "Tài liệu tham khảo"; tầng lõi, nhóm Thêm). Lô chuyển giữ hai đường dẫn này. Review: hai trang đích chưa chuyển (bản xem: "sắp có"); đã kiểm bản cũ ../opus-zero/docs/luyen-tap/ban-phim.md ("Bàn phím piano": tô phím theo gam hay hợp âm, bấm phím để nghe, nên dùng được để chơi một bè) và ../opus-zero/docs/tai-lieu-tham-khao.md ("Tài liệu tham khảo"). Lô chuyển giữ hai đường dẫn.'
    review: dung
  - id: n7
    cau: Năm 1725, nhà soạn nhạc Áo Johann Joseph Fux xuất bản Gradus ad Parnassum.
    loai: ten
    nguon:
      - cod-gradus
      - ewb-fux
      - omt-species
    ket_qua: dung
    ghi_chu: 'COD (qua Encyclopedia.com): Gradus ad Parnassum, "a work on counterpoint by Johann Joseph Fux, published in 1725"; Fux là "Austrian composer, organist, and theorist". OMT, Species Counterpoint: "Gradus ad Parnassum (Steps to Parnassus, 1725)".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Johann-Joseph-Fux", "https://imslp.org/wiki/Gradus_ad_Parnassum_(Fux,_Johann_Joseph)" ]
    luot_2_ghi_chu: "Britannica: nhà soạn nhạc Áo, Gradus ad Parnassum (1725). IMSLP: Vienna, Van Ghelen, 1725."
  - id: n8
    cau: Gradus ad Parnassum là giáo trình đối âm viết dưới dạng đối thoại thầy trò.
    loai: lich-su
    nguon:
      - ewb-fux
    ket_qua: dung
    ghi_chu: 'Encyclopedia of World Biography (Fux): "The Gradus is written as a dialogue between Palestrina as master and Fux as pupil." (Wikipedia, bậc 3 chỉ để tìm: phần Musica Pratica là đối thoại giữa Aloysius và Josephus; không dùng làm nguồn.)'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/johann-joseph-fux" ]
    luot_2_ghi_chu: "Encyclopedia of World Biography: sách viết dưới dạng đối thoại (Palestrina là thầy, Fux là trò); các nguồn khác ghi hai nhân vật là Aloysius và Josephus."
  - id: n9
    cau: Haydn, Mozart, Beethoven đều học từ Gradus ad Parnassum.
    loai: lich-su
    nguon:
      - brit-steps
      - ewb-fux
      - beethoven-haus
    ket_qua: dung
    ghi_chu: 'Britannica, Steps to Parnassus: "was studied by Wolfgang A. Mozart, Joseph Haydn, and other 18th-century composers". Encyclopedia of World Biography: "which Haydn and Beethoven, among many others, studied". Beethoven-Haus: "Beethoven had also studied the work and had a copy of his own." Hai nguồn đầu, mỗi nguồn nêu hai trong ba người; ba người được phủ đủ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/biography/Johann-Joseph-Fux", "https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/johann-joseph-fux" ]
    luot_2_ghi_chu: "Britannica: Mozart, Haydn và các nhà soạn nhạc thế kỷ 18 khác đã học cuốn này; Encyclopedia.com: Haydn và Beethoven. Đủ ba người, nhưng mỗi nguồn nêu một phần."
  - id: n10
    cau: Đến nay Gradus ad Parnassum vẫn được dùng.
    loai: lich-su
    nguon:
      - cod-counterpoint
      - omt-species
    ket_qua: dung
    ghi_chu: 'COD, Counterpoint: Gradus của Fux "still shows its influence in modern textbooks of strict counterpoint". OMT, Species Counterpoint: "Many composers from the 18th to the 21st centuries have used this method, or some variation on it" (các chương đối âm của OMT dựa trên Fux).'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/johann-joseph-fux", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.07%3A_Gradus_ad_Parnassum_Exercises" ]
    luot_2_ghi_chu: "New Catholic Encyclopedia (qua Encyclopedia.com): 'still consulted'; OMT vẫn dùng bài tập Fux (chương 2.7). Britannica chỉ nói 'long the standard' nên hơi yếu hơn."
  - id: n11
    cau: 'Phương pháp của Fux: cho sẵn một giai điệu chậm, nốt tròn, gọi là cantus firmus (CF), rồi viết thêm một bè, tăng dần độ phức tạp qua năm loại (species).'
    loai: dinh-nghia
    nguon:
      - omt-species
      - cod-counterpoint
    ket_qua: dung
    ghi_chu: 'OMT: "a step-by-step method for learning to write melodies and to combine them", năm loại cho hai bè; COD: đối âm chặt chẽ được dạy qua năm loại; "A fixed melody, the cantus firmus, serves as the base for the student''s added line". OMT, Third-Species: cantus firmus ở nốt tròn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/counterpoint", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.01%3A_Introduction_to_Species_Counterpoint" ]
    luot_2_ghi_chu: "Cantus firmus (OMT: một đường nhạc đơn), năm loại (species); Oxford: đối âm chặt chẽ dựa trên cantus firmus chia năm loại. 'Nốt tròn' đúng với bài tập của OMT 2.3-2.4."
  - id: n12
    cau: 'Loại 1: một nốt chống một nốt; chỉ dùng quãng thuận; học chuyển động giữa hai bè.'
    loai: dinh-nghia
    nguon:
      - omt-first
      - mt21c-first
    ket_qua: dung
    ghi_chu: 'OMT, First-Species: "Harmonically, the intervals between the two voices are all consonances." MT21C: "Create consonant harmonic intervals in each measure".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint" ]
    luot_2_ghi_chu: "Loại 1: một nốt chống một nốt, chỉ quãng thuận (và quãng 4 xem là nghịch khi liên quan bè thấp nhất)."
  - id: n13
    cau: 'Loại 2: hai nốt chống một; nốt lướt nghịch tai ở phách yếu.'
    loai: dinh-nghia
    nguon:
      - omt-second
    ket_qua: dung
    ghi_chu: 'OMT, Second-Species: "This 2:1 rhythmic ratio"; "Strong beats (downbeats) in second species are always consonant"; "All dissonant weak beats in second species are dissonant passing tones."'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.03%3A_Second-Species_Counterpoint" ]
    luot_2_ghi_chu: "OMT 2.3: nốt trắng chống nốt tròn; phách yếu nghịch chỉ là nốt lướt (passing tone)."
  - id: n14
    cau: 'Loại 3: bốn nốt chống một; giai điệu linh hoạt, nốt thêu, nốt lướt.'
    loai: dinh-nghia
    nguon:
      - omt-third
    ket_qua: dung
    ghi_chu: 'OMT, Third-Species: "the counterpoint line moves in quarter notes against a cantus firmus in whole notes" (4:1); dissonance gồm passing tone, neighbor tone (upper/lower), double neighbor, nota cambiata. "Nốt thêu" là cách gọi neighbor tone của site (bài 18).'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.04%3A_Third-Species_Counterpoint" ]
    luot_2_ghi_chu: "OMT 2.4: bốn nốt đen chống một nốt tròn; nốt lướt, nốt thêu, thêu đôi, nota cambiata."
  - id: n15
    cau: 'Loại 4: nốt lệch phách, nối qua vạch nhịp; học nốt treo.'
