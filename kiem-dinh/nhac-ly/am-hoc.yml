    ket_qua: dung
    ghi_chu: "Khối duy nhất: mười bồi âm đầu của Đô2 (Đô2, Đô3, Sol3, Đô4, Mi4, Sol4, Si♭4, Đô5, Rê5, Mi5), ba nốt đầu khóa Fa (C,, C, G,), bảy nốt sau khóa Sol; số 1 đến 10 ghi dưới nốt; 10 nốt, 10 chữ số. Si♭ ghi _B đúng; trang đã nói bồi âm 7 thực tế thấp hơn Si♭ khá nhiều. M:none, không có ô nhịp. Kiểm bằng tính tần số và node tools/khuong-nhac.mjs."
doi_chu:
  - cu: "Âm thanh là dao động truyền qua không khí. Một nốt nhạc có ba đặc tính:"
    moi: "Âm thanh là dao động truyền đi trong không khí (hay vật chất khác). Một nốt nhạc có ba đặc tính:"
    ly_do: "n3 (da-sua): OpenStax 17.1: sóng âm truyền qua vật chất nói chung."
  - cu: Khi một dây đàn rung, nó không chỉ rung cả dây (âm cơ bản), mà đồng thời rung từng nửa dây, từng một phần ba dây, từng một phần tư dây… Mỗi kiểu rung tạo ra một tần số gấp 2, 3, 4, 5… lần âm cơ bản. Đó là các bồi âm (overtones, harmonics). Ta không nghe chúng như những nốt riêng, nhưng chúng hòa vào nhau thành âm thanh ta nghe.
    moi: "Khi một dây đàn rung, nó không chỉ rung cả dây (âm cơ bản), mà đồng thời rung từng nửa dây, từng một phần ba dây, từng một phần tư dây… Mỗi kiểu rung tạo ra một tần số gấp 2, 3, 4, 5… lần âm cơ bản. Đó là các bồi âm (harmonics). Bài này đánh số từ âm cơ bản, như các giáo trình vật lý: âm cơ bản là bồi âm số 1, gấp đôi tần số là số 2, và cứ thế. (Một số tài liệu dùng overtones cho các bồi âm trên âm cơ bản và đánh số lệch một: overtone thứ nhất là bồi âm số 2.) Ta không nghe chúng như những nốt riêng, nhưng chúng hòa vào nhau thành âm thanh ta nghe."
    ly_do: "n10 (da-sua): cách đánh số của bảng (âm cơ bản là số 1) là cách của harmonics; overtone thứ nhất là bồi âm số 2 (OpenStax 17.5)."
  - cu: "Hãy để ý: các bồi âm 4, 5, 6 chính là hợp âm Đô trưởng (Đô – Mi – Sol). Hợp âm trưởng có sẵn trong tự nhiên, bên trong mỗi nốt nhạc."
    moi: "Hãy để ý: các bồi âm 4, 5, 6 chính là hợp âm Đô trưởng (Đô – Mi – Sol, tỉ lệ tần số 4 : 5 : 6). Hợp âm trưởng nằm sẵn trong chuỗi bồi âm của nốt."
    ly_do: 'n16 (da-sua): bỏ "mỗi nốt nhạc" (nói quá), thêm tỉ lệ 4:5:6.'
  - cu: 'Hai nốt có tỉ lệ tần số đơn giản thì có nhiều bồi âm trùng nhau, nên tai nghe chúng "hòa" vào nhau:'
    moi: 'Theo cách giải thích cổ điển của Helmholtz, hai nốt có tỉ lệ tần số đơn giản thì có nhiều bồi âm trùng nhau, nên tai nghe chúng "hòa" vào nhau:'
    ly_do: "n18 (da-sua): đây là giải thích của Helmholtz (Handbook SFU), không phải điều chắc chắn."
  - cu: Cảm giác
    moi: Phân loại (bài 9)
    ly_do: "n20 đến n23 (da-sua): cột cảm giác không có nguồn; thay bằng phân loại của OMT, khớp bảng ở bài 9."
  - cu: Gần như một nốt
    moi: Thuận hoàn toàn
    ly_do: "n20 đến n23 (da-sua): ô của cột cảm giác thành phân loại thuận/nghịch của OMT, như bài 9."
  - cu: Rất vững, rỗng
    moi: Thuận hoàn toàn
    ly_do: "n20 đến n23 (da-sua): ô của cột cảm giác thành phân loại thuận/nghịch của OMT, như bài 9."
  - cu: Vững
    moi: "Tùy ngữ cảnh: thuận giữa hai bè trên, nghịch khi có bè trầm"
    ly_do: "n20 đến n23 (da-sua): ô của cột cảm giác thành phân loại thuận/nghịch của OMT, như bài 9."
  - cu: Ngọt, sáng
    moi: Thuận không hoàn toàn
    ly_do: "n20 đến n23 (da-sua): ô của cột cảm giác thành phân loại thuận/nghịch của OMT, như bài 9."
  - cu: Ngọt, tối
    moi: Thuận không hoàn toàn
    ly_do: "n20 đến n23 (da-sua): ô của cột cảm giác thành phân loại thuận/nghịch của OMT, như bài 9."
  - cu:
      - Chói, nghịch
      - 'Đây là lời giải thích vật lý cho bảng thuận tai và nghịch tai ở bài 9. Nhưng cảm giác "thuận" và "nghịch" còn phụ thuộc vào văn hóa và thói quen nghe: âm nhạc thế kỷ 20 dùng nghịch tai như màu sắc, và nhiều nền âm nhạc khác có quan niệm hòa hợp riêng.'
    moi:
      - Nghịch
      - Đây là lời giải thích vật lý cho bảng thuận tai và nghịch tai ở bài 9. Nhưng quan niệm quãng nào là "thuận" đã đổi nhiều qua lịch sử và khác nhau giữa các nền văn hóa; một số nhà soạn nhạc thế kỷ 20 còn dùng quãng nghịch tai ngang hàng với thuận tai.
    ly_do: "n24 và n25 (da-sua): theo Handbook SFU, OMT và Schoenberg."
  - cu:
      - 'Bật micro rồi hát hoặc huýt sáo: huýt sáo cho phổ gần như sóng sin; giọng hát nguyên âm "a" có nhiều bồi âm hơn "u". Nếu có đàn cơ, chơi một nốt trầm rồi một nốt cao và so số đỉnh bồi âm.'
      - Sáo gần như chỉ có âm cơ bản và vài bồi âm yếu, nên nghe tròn và trong. Clarinet có các bồi âm lẻ (1, 3, 5, 7) mạnh hơn hẳn các bồi âm chẵn, tạo âm sắc "rỗng" đặc trưng. Violin và oboe có rất nhiều bồi âm mạnh, nên nghe sáng và giàu. Thử chọn chỉ các ô lẻ (1, 3, 5, 7) trong công cụ ở trên rồi nghe cùng lúc.
    moi:
      - 'Bật micro rồi hát hoặc huýt sáo: huýt sáo cho phổ chỉ có một đỉnh trội, các bồi âm yếu; giọng hát có nhiều bồi âm hơn, và mỗi nguyên âm ("a", "u"…) cho các đỉnh mạnh yếu khác nhau. Nếu có đàn cơ, chơi một nốt trầm rồi một nốt cao và so số đỉnh bồi âm.'
      - Sáo, ở âm vực trung, gần như chỉ có âm cơ bản và rất ít bồi âm khác, nên nghe tròn và trong. Clarinet ở âm vực trầm có các bồi âm lẻ (1, 3, 5, 7) mạnh hơn hẳn các bồi âm chẵn, tạo âm sắc "rỗng" đặc trưng. Sáo và oboe chơi cùng một nốt vẫn nghe khác nhau vì tỉ lệ bồi âm khác nhau; âm sắc càng "sáng" thì các bồi âm cao càng mạnh. Thử chọn chỉ các ô lẻ (1, 3, 5, 7) trong công cụ ở trên rồi nghe cùng lúc.
    ly_do: 'n31 (da-sua): không có nguồn cho "a" nhiều bồi âm hơn "u"; viết theo UNSW và báo cáo Illinois.; n33, n34, n35 (da-sua): thêm âm vực theo EIU và UNSW; câu về violin và oboe thay bằng điều có nguồn (Schmidt-Jones, Hamilton).'
  - cu:
      - Kèn đồng không có van (như kèn trumpet tự nhiên thời Bach) chỉ chơi được các nốt trong chuỗi bồi âm. Người chơi đổi nốt bằng cách thay đổi môi; người chơi kèn horn thời Mozart còn bịt bàn tay vào loa kèn để có thêm những nốt nằm giữa.
      - "Đàn bầu của Việt Nam dùng một dây duy nhất, và gần như mọi nốt đều là bồi âm: người chơi chạm nhẹ cạnh bàn tay vào các điểm chia dây trong khi gảy, còn cần đàn uốn cao độ lên xuống."
    moi:
      - Kèn đồng không có van (như kèn trumpet tự nhiên thời Bach) chỉ chơi được các nốt trong chuỗi bồi âm của ống kèn. Người chơi đổi nốt bằng cách thay đổi môi; người chơi kèn horn thời Mozart còn đặt bàn tay vào loa kèn để chỉnh cao độ một số nốt.
      - "Đàn bầu của Việt Nam chỉ có một dây và được chơi bằng bồi âm: người chơi chạm nhẹ bàn tay vào các điểm chia dây trong khi gảy, còn cần đàn (vòi đàn) uốn cao độ lên xuống."
    ly_do: 'n37 và n39 (da-sua): COD nói bàn tay trong loa kèn để chỉnh các nốt không khớp thang bình quân, không nói "thêm nốt nằm giữa".; n40 (da-sua): bỏ "gần như mọi nốt" và "cạnh", không nguồn nào nói thế.'
  - cu: "Nếu lên dây sao cho mọi quãng 5 đều thuần (3 : 2) rồi đi hết vòng 12 quãng 5, ta không quay về đúng nốt ban đầu: dư ra khoảng 23,5 cent, gọi là dấu phẩy Pythagore. Không có cách nào để mọi quãng đều thuần ở mọi giọng. Lịch sử âm nhạc phương Tây là lịch sử của các cách thỏa hiệp:"
    moi: "Nếu lên dây sao cho mọi quãng 5 đều thuần (3 : 2) rồi đi hết vòng 12 quãng 5, ta không quay về đúng nốt ban đầu: dư ra khoảng 23,5 cent, gọi là dấu phẩy Pythagore. Không có cách nào để mọi quãng đều thuần ở mọi giọng. Lịch sử các hệ lên dây ở phương Tây là lịch sử của những cách thỏa hiệp:"
    ly_do: 'n43 (da-sua): "lịch sử âm nhạc" nói quá rộng; câu nói về hệ lên dây.'
