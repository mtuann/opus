nhan_dinh:
  - id: n1
    cau: "Bài trả lời các câu hỏi \"vì sao\": vì sao quãng 8 và quãng 5 nghe hòa hợp, vì sao violin và sáo chơi cùng một nốt mà nghe khác nhau, và vì sao dàn nhạc Baroque lên dây thấp hơn dàn nhạc hiện đại."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trên trang: các mục \"Vì sao có quãng hòa hợp?\", \"Âm sắc\", \"Chuẩn cao độ\" trả lời ba câu ấy (mục chuẩn cao độ nêu 415 Hz của nhạc Baroque)."
  - id: n2
    cau: "Nên đọc bài này sau bài 9: Quãng."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trên trang: nhac-ly/09-quang đã chuyển, có mục \"Thuận tai và nghịch tai\" mà bài này dựa vào; nhac-ly/index viết \"đọc lúc nào cũng được, sau bài 9\"."
  - id: n3
    cau: "Âm thanh là dao động truyền đi trong không khí (hay vật chất khác)."
    loai: dinh-nghia
    nguon: [ os-sound ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Âm thanh là dao động truyền qua không khí\". Chữ mới thêm \"(hay vật chất khác)\". OpenStax 17.1: \"The physical phenomenon of sound is defined to be a disturbance of matter that is transmitted from its source outward.\""
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/university-physics-volume-1/pages/17-1-sound-waves", "https://www.britannica.com/science/sound-physics" ]
    luot_2_ghi_chu: "OpenStax: sound là nhiễu động của vật chất truyền ra từ nguồn; Britannica: nhiễu động cơ học lan truyền trong môi trường đàn hồi."
  - id: n4
    cau: "Cao độ ứng với tần số (số dao động mỗi giây, đơn vị Hz): cao hay thấp."
    loai: dinh-nghia
    nguon: [ os-pitch, sj-acoustics ]
    ket_qua: dung
    ghi_chu: "OpenStax 17.2: \"Perception of frequency is called pitch.\" Schmidt-Jones 5.1: \"The word that musicians use for frequency is pitch.\""
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/university-physics-volume-1/pages/17-3-sound-intensity" ]
    luot_2_ghi_chu: 'OpenStax: "The perception of frequency is called pitch." Hz = số dao động mỗi giây (định nghĩa).'
  - id: n5
    cau: "Độ to nhỏ của âm thanh ứng với biên độ dao động (bảng gọi là \"cường độ\")."
    loai: dinh-nghia
    nguon: [ sj-acoustics ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 5.1: \"For sound waves, the bigger the amplitude, the louder the sound.\" Chú ý: trong vật lý cường độ âm (W/m2) tỉ lệ với bình phương biên độ và khác độ to; ở mức giới thiệu của bài, giữ cách nói này."
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/university-physics-volume-1/pages/17-3-sound-intensity" ]
    luot_2_ghi_chu: 'OpenStax: cường độ tỉ lệ bình phương biên độ áp suất; độ to cảm nhận còn phụ thuộc tần số, nên "ứng với biên độ" là cách nói xấp xỉ chấp nhận được. Chữ "bảng gọi là" có vẻ gõ nhầm (nên là "còn gọi là"); chỉ kiểm phần nhạc lý.'
  - id: n6
    cau: "Âm sắc, \"giọng\" riêng của từng nhạc cụ, phụ thuộc vào tỉ lệ các bồi âm trong âm thanh."
    loai: dinh-nghia
    nguon: [ sj-timbre, os-columns ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 5.3: yếu tố chính của âm sắc là \"the relative loudness of all the different harmonics compared to each other\". OpenStax 17.5: sự pha trộn các bồi âm \"gives various musical instruments (and human voices) their distinctive characteristics\". Cách bắt đầu và tắt dần của âm cũng góp phần; bài nhắc phần tắt dần ở mục Âm sắc."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/sound.spectrum.html" ]
    luot_2_ghi_chu: "UNSW: timbre khác nhau khi biên độ tương đối các thành phần (bồi âm) khác nhau, là một trong các yếu tố quyết định."
  - id: n7
    cau: "Tai người nghe được khoảng 20 Hz đến 20.000 Hz."
    loai: so-lieu
    nguon: [ os-hearing ]
    ket_qua: dung
    ghi_chu: "OpenStax 17.6: \"Normal human hearing encompasses frequencies from 20 to 20,000 Hz\". Schmidt-Jones 5.1 ghi 20 đến khoảng 17.000 Hz; bài dùng số phổ biến."
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/university-physics-volume-1/pages/17-2-speed-of-sound" ]
    luot_2_ghi_chu: 'OpenStax: "the audible range, 20 and 20,000 Hz".'
  - id: n8
    cau: "Phím thấp nhất của piano (La0) khoảng 27,5 Hz, phím cao nhất (Đô8) khoảng 4.186 Hz."
    loai: so-lieu
    nguon: [ hp-piano, unsw-notes ]
    ket_qua: dung
    ghi_chu: "HyperPhysics: \"The piano has 88 keys which span the frequency range 27.5 Hz (A0) to 4186 Hz (C8).\" UNSW: công thức f = 440 x 2^((m-69)/12), C8 là MIDI 108: 4186,0 Hz."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/notes.html" ]
    luot_2_ghi_chu: "UNSW: tần số = 440 x 2^(n/12); tự tính: A0 (MIDI 21) = 27,5 Hz; C8 (MIDI 108) = 4186,0 Hz. Tên La0 và Đô8 là hai phím đầu cuối của piano 88 phím."
  - id: n9
    cau: "Dây đàn rung không chỉ cả dây (âm cơ bản) mà đồng thời rung từng nửa dây, một phần ba, một phần tư dây…; mỗi kiểu rung cho tần số gấp 2, 3, 4, 5… lần âm cơ bản."
    loai: quy-tac
    nguon: [ sj-standing, sfu-harmonic ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 5.2: dây có thể rung \"in halves ... or in thirds, fourths, and so on\". Handbook SFU: các bồi âm \"are integer multiples of the fundamental\"."
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance", "https://newt.phys.unsw.edu.au/jw/harmonics.html" ]
    luot_2_ghi_chu: "OpenStax: dây hai đầu cố định f_n = n f_1; UNSW: các hài âm có tần số f, 2f, 3f... Chạm giữa dây (1/2, 1/3...) chọn các kiểu rung này."
  - id: n10
    cau: "Các kiểu rung ấy là bồi âm (harmonics); đánh số từ âm cơ bản thì âm cơ bản là bồi âm số 1, gấp đôi tần số là số 2; một số tài liệu dùng overtones cho các bồi âm trên âm cơ bản và đánh số lệch một (overtone thứ nhất là bồi âm số 2)."
    loai: dinh-nghia
    nguon: [ os-columns, sj-timbre, sfu-harmonic, cod-harm ]
    ket_qua: da-sua
