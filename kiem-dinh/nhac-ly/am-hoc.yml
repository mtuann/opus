# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa nhac-ly/am-hoc
trang: src/content/docs/nhac-ly/am-hoc.md
nguon_cu: ../opus-zero/docs/nhac-ly/am-hoc.md
tang: loi
lan:
  - so: 1
    ngay: '2026-10-28'
    nhanh: moi/d3-l5
    ma_bam: null
    nguoi:
      luot_1: "Claude Sonnet 5.5 (D3-L5 lượt 1, trang)"
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: "Trang Âm học cơ bản (tầng lõi), ba công cụ (overtones, spectrum, tuning; src/scripts/am-hoc.js) và hình beats (src/components/hinh/beats.html). Nguồn chính: OpenStax College Physics 2e 17.1, 17.2, 17.5, 17.6; Schmidt-Jones (LibreTexts) 5.1 đến 5.3, 6.6, 8.2; Open Music Theory (Intervals, Species Counterpoint); Handbook for Acoustic Ecology của SFU; UNSW Music Acoustics; HyperPhysics; ISO 16; COD qua Encyclopedia.com; Early Music America, Eastman (415 Hz). Đọc qua WebFetch ngày 28/10/2026 (bản tóm tắt chữ, đã hỏi lại để lấy nguyên văn chỗ quan trọng); các số cent, tần số, tỉ lệ đều tính lại bằng Python. CHƯA CHẮC (null): n61 (dàn nhạc 442–444 Hz, chỉ nguồn bậc 3). Nguồn mỏng, nên lượt 2 xem kỹ: n40 (đàn bầu: báo và Wikipedia), n49 (bình quân chuẩn cho piano từ khoảng 1850: một sách chỉnh đàn), n57 (hội nghị 1939: Nature bị chặn, chỉ có Lead Stories dẫn lại), n33 và n34 (sáo và clarinet theo âm vực). Công cụ và hình: chữ và số của ba công cụ và của hình beats đều đúng (n17, n27, n29, n36, n54, n55); chỉ có lỗi nhỏ cho người giao ở n55: chữ trong hình beats dùng dấu chấm thập phân (\"10.4 Hz\", \"0.0 s\", \"0.1 s\"…), chú thích dưới hình dùng dấu phẩy; nên đổi sang dấu phẩy. Câu ve-site trỏ trang chưa chuyển: n60 (luyen-tap/hat-lai: máy lên dây ở La4 = 440 Hz, id #may-len-day), n64 (nghe-nhac/doc-ten-tac-pham: đoạn về bản thu theo phong cách lịch sử và 415 Hz, link ngược về am-hoc), n70 (tai-lieu-tham-khao). Link vào trang này từ trang chưa chuyển: #am-sac (piano/tieng-dan, cap-nhat), #chuan-cao-o-la-440-hz (luyen-tap/hat-lai); id do plugin id-cu.mjs sinh từ tiêu đề, giữ nguyên tiêu đề \"Âm sắc\" và \"Chuẩn cao độ: La = 440 Hz?\" là còn khớp. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): harmonic và harmonic series (bồi âm, chuỗi bồi âm), overtone (cách đánh số lệch một, xem n10), fundamental (âm cơ bản), timbre (âm sắc), frequency (tần số), amplitude (biên độ), cent, just intonation (quãng thuần), Pythagorean comma (dấu phẩy Pythagore), Pythagorean tuning, mean-tone, well temperament (bình quân cải tiến), equal temperament (bình quân), beats (phách: đã có bản ghi beat nghĩa phách của nhịp, nên cần phân biệt phách âm học với phách của nhịp), concert pitch. Đã có bản ghi: consonance (thuận tai), dissonance (nghịch tai), pitch, interval. Quiz: lời giải thích không dựa vào vị trí lựa chọn."
