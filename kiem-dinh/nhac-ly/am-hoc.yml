    ghi_chu: "Chữ cũ không nêu âm vực. UNSW: ở quãng thấp \"the first and third harmonics are strong, and the second is weak. This preponderance of odd harmonics gives the clarinet in its low range the characteristic hollow sound\"; ở âm vực cao các bồi âm chẵn khá mạnh trở lại. Hamilton: \"hollow\" ứng với \"missing the even numbered low partials\"."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/clarinetacoustics.html", "https://newt.phys.unsw.edu.au/jw/sound.spectrum.html" ]
    luot_2_ghi_chu: 'UNSW: clarinet gần như ống trụ đóng một đầu, phát chủ yếu các hài lẻ ở âm vực trầm (hài 1, 3 mạnh, 2, 4 yếu); khác biệt lẻ/chẵn mất dần ở âm vực cao. "rỗng" là mô tả âm sắc.'
  - id: n35
    cau: "Sáo và oboe chơi cùng một nốt vẫn nghe khác nhau vì tỉ lệ bồi âm khác nhau; âm sắc càng \"sáng\" thì các bồi âm cao càng mạnh."
    loai: dinh-nghia
    nguon: [ sj-timbre, hamilton ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Violin và oboe có rất nhiều bồi âm mạnh, nên nghe sáng và giàu.\" Không tìm được nguồn đọc được nêu độ mạnh bồi âm của violin và oboe, nên viết lại điều có nguồn. Schmidt-Jones 5.3: \"an oboe sounds different from a flute\", khác ở độ lớn tương đối của các bồi âm; Hamilton: \"Bright\" là \"possessing a lot of high frequency partials with significant amplitude\"."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/sound.spectrum.html" ]
    luot_2_ghi_chu: "UNSW: âm sắc do biên độ tương đối các thành phần quyết định; kèn đồng crescendo thì hài cao mạnh hơn nên sáng hơn. Sáo và oboe cụ thể không có trên trang đã mở nhưng nguyên lý đúng."
  - id: n36
    cau: "Trong công cụ chuỗi bồi âm có thể chọn chỉ các ô lẻ (1, 3, 5, 7) rồi nghe cùng lúc."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trong src/scripts/am-hoc.js: ô đánh dấu cho từng bồi âm 1–16 và nút \"Nghe các bồi âm đã chọn cùng lúc\"."
  - id: n37
    cau: "Kèn đồng không có van (như kèn trumpet tự nhiên thời Bach) chỉ chơi được các nốt trong chuỗi bồi âm của ống kèn."
    loai: quy-tac
    nguon: [ sj-harm2, cod-trumpet, cod-horn ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 6.6: \"A brass instrument could play only the notes of one harmonic series.\" COD (trumpet): kèn không van chỉ có các \"natural notes of harmonic series\"; COD (horn family): kèn horn tự nhiên bị giới hạn ở một cao độ của chuỗi bồi âm tại mỗi thời điểm. \"Thời Bach\" vì COD nói kèn trumpet Baroque (clarino) chơi trong chuỗi ấy."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/brassacoustics.html" ]
    luot_2_ghi_chu: "UNSW: kèn đồng không van (trumpet tự nhiên, horn) chỉ chơi các nốt của chuỗi hài âm."
  - id: n38
    cau: "Người chơi kèn đồng không van đổi nốt bằng cách thay đổi môi."
    loai: quy-tac
    nguon: [ sj-harm2 ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 6.6: \"By vibrating the lips at different speeds, the player can cause a harmonic of the air column to sound\"."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/brassacoustics.html" ]
    luot_2_ghi_chu: "UNSW: người chơi đổi nốt bằng cách chỉnh embouchure (môi) để chọn đỉnh trở kháng."
  - id: n39
    cau: "Người chơi kèn horn thời Mozart còn đặt bàn tay vào loa kèn để chỉnh cao độ một số nốt."
    loai: quy-tac
    nguon: [ cod-fhorn ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"bịt bàn tay vào loa kèn để có thêm những nốt nằm giữa\". COD (French horn): \"Certain notes not in tune with the modern tempered scale were modified by the insertion of a hand in the bell\"; không nói rõ \"thêm nốt\", nên sửa theo nguồn. COD: kèn tự nhiên là \"the instr. for which the older classical composers wrote\"."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/brassacoustics.html" ]
    luot_2_ghi_chu: "UNSW: tay trong loa kèn horn hạ các cộng hưởng; trước khi có van, người chơi horn dùng các mức bịt tay khác nhau để đổi cao độ. Mốc thời Mozart khớp với kèn không van."
  - id: n40
    cau: "Đàn bầu của Việt Nam chỉ có một dây và được chơi bằng bồi âm: người chơi chạm nhẹ bàn tay vào các điểm chia dây trong khi gảy, còn cần đàn (vòi đàn) uốn cao độ lên xuống."
    loai: quy-tac
    nguon: [ nhandan-bau, wiki-bau ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"dùng một dây duy nhất, và gần như mọi nốt đều là bồi âm: ... chạm nhẹ cạnh bàn tay\". Báo Nhân Dân: đàn một dây \"duy nhất phát ra âm bồi\", người chơi uốn vòi đàn để đổi sức căng dây, bàn tay chạm vào thân dây. Wikipedia (bậc 3, dẫn Raine-Reusch): các nút dây là bồi âm 1 đến 7; một ngón của bàn tay phải đặt nhẹ trên dây; cần đàn đẩy vào hay kéo ra để hạ hay nâng cao độ. Bỏ \"gần như mọi nốt\" và \"cạnh\" vì không nguồn nào nói thế. Nguồn tiếng Việt chỉ là báo chính thức; chưa có nguồn học thuật đọc được."
    luot_2: khong-chac
    luot_2_ghi_chu: Chưa có nguồn bậc 2 đã mở về kỹ thuật đàn bầu (chỉ thấy ở Wikipedia, nguồn tham khảo của nó không mở được).
  - id: n41
    cau: "Nghệ sĩ violin, cello, guitar dùng bồi âm (harmonics) để tạo những nốt cao trong veo như tiếng sáo."
    loai: quy-tac
    nguon: [ cod-harm, sj-harm2 ]
    ket_qua: dung
    ghi_chu: "COD (harmonics): trên đàn dây, tạo bồi âm \"by touching the string lightly at various points (nodes)\", cho âm \"flute-like\". Schmidt-Jones 6.6: \"the string is touched very, very lightly\"."
    luot_2: dung
    luot_2_nguon: [ "https://newt.phys.unsw.edu.au/jw/harmonics.html" ]
    luot_2_ghi_chu: 'UNSW: chạm nhẹ dây ở 1/4 chiều dài cho hài 4 (4f); kỹ thuật hài âm trên dây (violin, cello, guitar). "Trong veo như tiếng sáo" là mô tả.'
  - id: n42
    cau: "Nếu lên dây sao cho mọi quãng 5 đều thuần (3:2) rồi đi hết vòng 12 quãng 5, ta không quay về đúng nốt ban đầu: dư ra khoảng 23,5 cent, gọi là dấu phẩy Pythagore."
    loai: so-lieu
    nguon: [ lynn, pianofund, rush ]
    ket_qua: dung
    ghi_chu: "Tính: (3/2)^12 / 2^7 = 3^12/2^19 = 531441/524288 = 1,01364, tức 23,46 cent (Ben Lynn: \"3^12/2^19\"). Piano Fundamentals: \"the Pythagorean comma, which is about 23 cents\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Pythagorean-tuning", "https://newt.phys.unsw.edu.au/jw/notes.html" ]
    luot_2_ghi_chu: 'Tự tính: 12 quãng 5 thuần = 12 x 701,955 = 8423,46 cent; 7 quãng 8 = 8400 cent; dư 23,46 cent = dấu phẩy Pythagore (531441:524288). Britannica nói chồng quãng 5 thuần không đóng lại về nốt đầu (Britannica dùng "comma" cho 81:80 ở thứ cấp 3, khác dấu phẩy này).'
  - id: n43
    cau: "Không có cách nào để mọi quãng đều thuần ở mọi giọng; các hệ lên dây của phương Tây là những cách thỏa hiệp."
    loai: quy-tac
    nguon: [ sj-tuning, sj-harm2 ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Lịch sử âm nhạc phương Tây là lịch sử của các cách thỏa hiệp\" (quá rộng: không phải cả lịch sử âm nhạc). Schmidt-Jones 6.6: trong hệ bình quân \"all intervals except for octaves are slightly out of tune\"; 8.2: hệ Pythagore để lại quãng 5 \"wolf\", mean-tone có \"wolf intervals\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/tuning-and-temperament" ]
    luot_2_ghi_chu: "Britannica: không thể lên dây bảy nốt để mọi quãng đều thuần tối đa; các hệ tempered là thỏa hiệp."
  - id: n44
    cau: "Hệ Pythagore: mọi quãng 5 thuần, quãng 3 trưởng rất chói; dùng ở thời Trung cổ, còn dùng đến thời Phục hưng."
    loai: lich-su
    nguon: [ sj-tuning ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: chỉ \"Trung cổ\". Schmidt-Jones 8.2: hệ Pythagore \"widely used in medieval and Renaissance times\"; quãng 3 \"simply too far away from the pure major and minor thirds\", thành \"a dissonance\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/Pythagorean-tuning", "https://www.britannica.com/art/just-intonation" ]
    luot_2_ghi_chu: 'Britannica: Pythagorean tuning làm mọi quãng 5 thuần, quãng 3 và 6 rộng ~22 cent (chói); dùng thời Trung cổ. "Còn dùng đến thời Phục hưng" là suy rộng hợp lý (meantone thay vào khoảng 1500) nhưng trang Britannica đã mở không nêu thẳng cho Pythagorean.'
  - id: n45
    cau: "Hệ mean-tone: quãng 3 trưởng thuần; một vài giọng chơi được rất hay, các giọng xa thì không dùng được; dùng ở thời Phục hưng và Baroque."
    loai: lich-su
    nguon: [ sj-tuning ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 8.2: mean-tone \"uses the pure major third\", \"problem with wolf intervals\", rất phổ biến ở châu Âu từ thế kỷ 16 đến 18; một cây đàn lên dây thuần chơi \"badly out of tune in a distant key\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/meantone-temperament" ]
    luot_2_ghi_chu: 'Britannica: meantone có quãng 3 trưởng thuần, có "wolf" ở các giọng xa, thịnh hành từ đầu thế kỷ 16 đến thế kỷ 18.'
  - id: n46
    cau: "Hệ bình quân cải tiến (well temperament): mọi giọng đều chơi được nhưng mỗi giọng có \"màu\" hơi khác; phổ biến ở thế kỷ 18–19, bắt đầu từ cuối Baroque."
    loai: lich-su
    nguon: [ sj-tuning ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Cuối Baroque\". Schmidt-Jones 8.2: \"well temperament tunings that were very popular in the 18th and 19th centuries\"; \"tuning would be noticeably different in each key, but every key would still be pleasant-sounding and usable\"; các giọng \"aligned with specific colors and emotions\"."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/meantone-temperament", "https://www.britannica.com/art/equal-temperament" ]
    luot_2_ghi_chu: 'Nguồn bậc 2 mở được chưa nêu khoảng "thế kỷ 18-19" cho well temperament: Britannica nói bình quân đều được chấp nhận ở Pháp và Đức cuối thế kỷ 18, Anh thế kỷ 19; Wikipedia (không dùng) nêu well temperament dùng suốt Baroque và Cổ điển. Chưa xác nhận.'
  - id: n47
    cau: "Bình quân luật (Das Wohltemperierte Klavier) của Bach thường được cho là viết cho kiểu lên dây well temperament; Bach dùng hệ chính xác nào thì còn tranh cãi."
    loai: lich-su
    nguon: [ sj-tuning, pianofund ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Bình quân luật của Bach dành cho kiểu lên dây này\" (nói chắc hơn nguồn). Schmidt-Jones 8.2: Bach viết nó \"partly to promote switching to a well temperament\"; Piano Fundamentals: chưa ngã ngũ Bach dùng hệ nào (đề xuất của Kellner 1975 bị đa số thợ chỉnh đàn bác; đề xuất của Lehman còn bàn)."
    luot_2: khong-chac
    luot_2_nguon: [ "http://plaza.ufl.edu/wnb/baroque_temperament.htm" ]
    luot_2_ghi_chu: Trang cá nhân (UFL) nói nhiều thế kỷ người ta cho là bình quân đều, Kellner (1975) cho là bất đều; không đủ nguồn bậc 2 để xác nhận câu "thường được cho là well temperament".
  - id: n48
    cau: "Hệ bình quân (equal temperament) chia quãng 8 thành 12 nửa cung bằng hệt nhau: mỗi nửa cung 100 cent, tỉ lệ 2^(1/12) ≈ 1,0595."
    loai: dinh-nghia
    nguon: [ sj-tuning, rush ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 8.2: \"The octave is divided into twelve equally spaced half steps\", tỉ lệ là căn bậc 12 của 2. Toby Rush: một cent là 1/1200 quãng 8; trong hệ bình quân mọi nốt cách nhau đúng 100 cent. Tính: 2^(1/12) = 1,059463."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/equal-temperament", "https://newt.phys.unsw.edu.au/jw/notes.html" ]
    luot_2_ghi_chu: "Britannica: 12 nửa cung bằng nhau, 100 cent, mỗi bước nhân căn bậc 12 của 2 (~1,059); UNSW: tỉ lệ 2^(1/12) ≈ 1,059. Tự tính 1,059463."
  - id: n49
    cau: "Hệ bình quân là chuẩn cho piano từ khoảng giữa thế kỷ 19 đến nay."
    loai: lich-su
    nguon: [ pianofund ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"từ thế kỷ 19\". Piano Fundamentals: \"Since about 1850, ET had been almost universally accepted\". Chỉ có một nguồn bậc 2 (sách kỹ thuật chỉnh đàn); nên nhờ lượt 2 tìm nguồn thứ hai."
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/equal-temperament" ]
    luot_2_ghi_chu: 'Britannica: Pháp và Đức dùng rộng rãi cuối thế kỷ 18, Anh thế kỷ 19; không nêu piano hay "giữa thế kỷ 19". Chưa xác nhận.'
  - id: n50
    cau: "Hệ bình quân cho phép chơi ở mọi giọng và chuyển giọng tự do, đổi lại mọi quãng (trừ quãng 8) đều lệch một chút so với quãng thuần."
    loai: quy-tac
    nguon: [ sj-tuning, sj-harm2 ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 8.2: bình quân \"does not require retuning for key changes\"; 6.6: \"all intervals except for octaves are slightly out of tune\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/equal-temperament" ]
    luot_2_ghi_chu: "Britannica: lỗi được phân bố đều trên 12 âm, chỉ quãng 8 là thuần về âm học; chơi mọi giọng với sai lệch nhỏ."
  - id: n51
    cau: "Quãng 5 bình quân chỉ lệch khoảng 2 cent so với quãng 5 thuần."
    loai: so-lieu
    nguon: [ lynn, rush ]
    ket_qua: dung
    ghi_chu: "Tính: 700 cent (bình quân) so với 1200 log2(3/2) = 701,96 cent: lệch 1,96 cent. Schmidt-Jones 8.2 cũng ghi quãng 5 thuần là 702 cent."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/equal-temperament" ]
    luot_2_ghi_chu: "Britannica: quãng 5 bình quân hẹp hơn quãng 5 tự nhiên khoảng 2 cent; tự tính 700 - 701,955 = -1,955 cent."
  - id: n52
    cau: "Quãng 3 trưởng bình quân rộng hơn quãng 3 trưởng thuần khoảng 14 cent."
    loai: so-lieu
    nguon: [ lynn, rush ]
    ket_qua: dung
    ghi_chu: "Tính: 400 so với 1200 log2(5/4) = 386,31 cent: rộng hơn 13,69 cent."
    luot_2: dung
    luot_2_nguon: [ "https://www.animations.physics.unsw.edu.au/jw/beats.htm", "https://newt.phys.unsw.edu.au/jw/notes.html" ]
    luot_2_ghi_chu: "Tự tính: 3 trưởng bình quân 400 cent; 5:4 = 386,31 cent; hơn 13,69 cent (khoảng 14). UNSW beats dùng 5:4 là 3 trưởng thuần."
  - id: n53
    cau: "Quãng 3 trưởng bình quân có tiếng \"rung\" (phách) mà tai luyện tốt nghe thấy."
    loai: quy-tac
    nguon: [ sj-tuning ]
    ket_qua: dung
    ghi_chu: "Schmidt-Jones 8.2: các hệ lệch quãng thuần cho \"regular beats\". Với bồi âm 5 của Đô4 và bồi âm 4 của Mi4 bình quân, phách khoảng 10,4 lần mỗi giây (n55): dễ nghe."
    luot_2: dung
    luot_2_nguon: [ "https://www.animations.physics.unsw.edu.au/jw/beats.htm" ]
    luot_2_ghi_chu: "UNSW: số phách mỗi giây bằng hiệu tần số hai sóng; với 3 trưởng bình quân hài trùng lệch ~10 Hz (xem n55): nghe thấy, đặc biệt ở âm vực trung."
  - id: n54
    cau: "Công cụ lên dây có bốn nút (5 đúng bình quân 700 cent, 5 đúng thuần 3:2 702,0 cent, 3 trưởng bình quân 400 cent, 3 trưởng thuần 5:4 386,3 cent), mỗi nút phát Đô4 cùng nốt trên trong 3 giây."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trong src/scripts/am-hoc.js (QUANG_LEN_DAY, veLenDay, mountLenDay: dai 3, sóng răng cưa) và acoustics.js cũ. Các số cent kiểm ở n48, n51, n52 (701,96 làm tròn 702,0; 386,31 làm tròn 386,3)."
  - id: n55
    cau: "Hình \"phách\" cho thấy: bồi âm 5 của Đô4 là 1308,1 Hz; bồi âm 4 của Mi4 bình quân là 1318,5 Hz; hai bồi âm lệch nhau khoảng 10,4 Hz nên âm lượng dâng lên hạ xuống khoảng 10 lần mỗi giây; ở quãng 3 thuần (5:4) hai bồi âm trùng nhau nên âm thanh đứng yên."
    loai: so-lieu
    nguon: [ unsw-notes, hp-mussca ]
    ket_qua: dung
    ghi_chu: "Tính với La4 = 440 Hz: Đô4 = 261,626 Hz, x5 = 1308,13; Mi4 bình quân = 329,628 Hz, x4 = 1318,51; hiệu 10,38 Hz. Quãng thuần: Mi4 = 261,626 x 5/4 = 327,03 Hz, x4 = 1308,13 trùng. Kiểm đường bao trong src/components/hinh/beats.html: các chỗ lõm cách nhau khoảng 0,098 giây, đúng 10,4 Hz. LỖI NHỎ CHO NGƯỜI GIAO: chữ trong hình dùng dấu chấm thập phân (\"10.4 Hz\", \"0.1 s\") khi chú thích dưới hình viết dấu phẩy (\"10,4 Hz\"); nên đổi chữ trong hình (và aria-label) sang dấu phẩy cho khớp quy ước số của site (am-hoc.js đã dùng dấu phẩy)."
    luot_2: dung
    luot_2_nguon: [ "https://www.animations.physics.unsw.edu.au/jw/beats.htm", "https://newt.phys.unsw.edu.au/jw/notes.html" ]
    luot_2_ghi_chu: "Tự tính: Đô4 = 261,626 Hz, hài 5 = 1308,13 Hz; Mi4 bình quân = 329,628 Hz, hài 4 = 1318,51 Hz; hiệu 10,38 Hz (~10 phách mỗi giây, UNSW: phách = hiệu tần số). Với 5:4 thuần hai hài trùng: 5 x 261,626 = 4 x 326,53."
  - id: n56
    cau: "Ca sĩ, nhạc công kèn và nhiều nhạc cụ dây không cố định cao độ nên khi hát hoặc chơi hợp âm họ thường điều chỉnh về phía quãng thuần; đó có thể là một lý do dàn hợp xướng không nhạc đệm hay một dàn dây giỏi nghe \"trong\"."
    loai: quy-tac
    nguon: [ sj-tuning, sj-harm2, howard ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Ca sĩ, dàn dây và kèn ... thường tự điều chỉnh về phía quãng thuần ... Đó là một lý do một tứ tấu đàn dây hay dàn hợp xướng giỏi nghe trong\". Schmidt-Jones 8.2: chỉnh cao độ lúc chơi \"comes naturally\" với \"vocalists, most wind instruments, and many string instruments\"; 6.6: \"musicians have a tendency to revert to true harmonics when they can\" (hợp xướng không đệm, dàn kèn đồng); Howard và Overy: ba tứ ca nhóm bán chuyên hát gần với dự đoán của just intonation. Không tìm được nguồn cho tứ tấu dây, và vế \"là một lý do\" là suy đoán nên viết \"có thể\"."
    luot_2: khong-chac
    luot_2_ghi_chu: Chưa có nguồn bậc 2 đã mở về việc ca sĩ và nhạc công điều chỉnh tới quãng thuần.
  - id: n57
