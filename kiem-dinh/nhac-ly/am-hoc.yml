  - cu: Ca sĩ, dàn dây và kèn không cố định cao độ nên thường tự điều chỉnh về phía quãng thuần khi hát hoặc chơi hợp âm. Đó là một lý do một tứ tấu đàn dây hay dàn hợp xướng giỏi nghe "trong" đến vậy.
    moi: Ca sĩ, nhạc công kèn và nhiều nhạc cụ dây không cố định cao độ nên khi hát hoặc chơi hợp âm họ thường điều chỉnh về phía quãng thuần. Đó có thể là một lý do dàn hợp xướng không nhạc đệm hay một dàn dây giỏi nghe "trong" đến vậy.
    ly_do: 'n56 (da-sua): không có nguồn cho tứ tấu dây; "là một lý do" là suy đoán.'
