    ket_qua: dung
    ghi_chu: 'OMT: secondary dominant là "a chromatic chord that temporarily tonicizes another key besides the tonic key"; ký hiệu đọc từ trái sang phải với "of" thay dấu gạch ("V/ii becomes ''five of two''"); "five of five" theo cùng quy tắc (trang OMT không nêu ví dụ V/V).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/" ]
