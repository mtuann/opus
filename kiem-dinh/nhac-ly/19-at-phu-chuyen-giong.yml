    ghi_chu: 'Đô trưởng: C = I, F = IV, Am = vi; Sol trưởng: Am = ii, D = V, G = I (D và G không thuộc Đô trưởng nên ô trống ở hàng Đô trưởng; C và F không thuộc Sol trưởng, vì Sol trưởng có Fa♯, nên ô trống ở hàng Sol trưởng; bản lề duy nhất là Am).'
