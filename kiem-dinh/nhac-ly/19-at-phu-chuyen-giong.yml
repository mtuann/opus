    ket_qua: dung
    ghi_chu: 'K:C, M:4/2, L:1/2. Bốn hợp âm, mỗi hợp âm hai phách của nhịp 4/2 (nửa nốt trắng): C (Đô3 Mi4 Sol4 Đô5), D7 (Rê3 Fa♯4 La4 Đô5), G (Sol3 Rê4 Sol4 Si4), C. I – V/V – V – I (n4, n7); Fa♯ ở hợp âm thứ hai ghi bằng ^F. abcjs không cảnh báo; ô đủ 4 phách (4/2).'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
    ket_qua: dung
    ghi_chu: 'K:C, M:4/2, L:1/2. Ô 1: C (Đô3 Mi4 Sol4 Đô5), F (Fa3 Fa4 La4 Đô5), Am (La3 Mi4 La4 Đô5), D (Rê3 Rê4 Fa♯4 La4); ô 2: G (Sol3 Rê4 Sol4 Si4) bốn nửa phách. Đúng bảng pivot (n23, n24): Am là hợp âm chung, D là V của Sol, G là I. Ô 2 dài 4 phách (4/2). abcjs không cảnh báo.'
doi_chu:
  - cu: 'Ở bài 12, hợp âm V kéo mạnh về I. Bài này mở rộng ý tưởng đó: mọi hợp âm đều có thể có một "hợp âm V của riêng nó", và từ đó âm nhạc có thể chuyển hẳn sang giọng mới.'
    moi: 'Ở bài 12, hợp âm V kéo mạnh về I. Bài này mở rộng ý tưởng đó: mọi hợp âm ba trưởng hay thứ trong giọng đều có thể có một "hợp âm V của riêng nó", và từ đó âm nhạc có thể chuyển hẳn sang giọng mới.'
    ly_do: "n3 (da-sua): OMT, Tonicization: hợp âm giảm, tăng không thể được chủ âm hóa. Mô tả đầu trang (description) cũng sửa theo; người giao dựng lại từ đoạn đầu nếu cần.; n3 (da-sua): như trên."
  - cu: Khi giọng mới được khẳng định đủ lâu, thường bằng một kết trọn ở giọng mới, ta nói bản nhạc đã chuyển giọng (modulation).
    moi: Khi giọng mới được khẳng định đủ lâu, thường bằng một kết ở giọng mới, ta nói bản nhạc đã chuyển giọng (modulation).
    ly_do: 'n17 (da-sua): OMT chỉ nói "cadence".'
  - cu: "Các giọng chỉ khác 0–1 dấu hóa là giọng gần, chuyển qua lại rất tự nhiên. Với Đô trưởng, các giọng gần là: Sol trưởng (giọng át), Fa trưởng (giọng hạ át), La thứ (song song), Mi thứ, Rê thứ. Trên vòng quãng năm, chúng là hàng xóm của nhau."
    moi: "Các giọng chỉ khác 0–1 dấu hóa là giọng gần, chuyển qua lại rất tự nhiên. Với Đô trưởng, các giọng gần là: Sol trưởng (giọng át), Fa trưởng (giọng hạ át), La thứ (song song), Mi thứ, Rê thứ. Trên vòng quãng năm, chúng nằm sát Đô trưởng: Fa trưởng và Sol trưởng ở hai bên Đô trưởng, Rê thứ và Mi thứ ở hai bên La thứ."
    ly_do: 'n20 (da-sua, review D3-gom): "hàng xóm của nhau" sai theo nghĩa đen như aria-label của hình keymap (n30, lượt 2 sai): trên vòng quãng năm Fa trưởng và Sol trưởng không cạnh nhau mà ở hai bên Đô trưởng (OMT, Major Scales, The Circle of Fifths; bài 8).'
  - cu: 'Cách mượt nhất: tìm một hợp âm thuộc cả hai giọng làm "bản lề" (pivot chord).'
    moi: 'Một cách thường dùng, mượt hơn đổi giọng đột ngột: tìm một hợp âm thuộc cả hai giọng làm "bản lề" (pivot chord).'
    ly_do: 'n22 (da-sua): OMT: pivot chord "more subtle", "one of the more common ways"; không nói "nhất".'
  - cu: 'Đôi khi nhạc đổi giọng đột ngột, không cần bản lề, thường ở chỗ bắt đầu câu mới. Ví dụ nổi tiếng: nhiều bài hát pop "nâng tông" lên nửa cung ở điệp khúc cuối. Trong nhạc cổ điển, đầu phần phát triển của Mozart Giao hưởng số 40 chuyển đột ngột sang một giọng rất xa.'
    moi: "Đôi khi nhạc đổi giọng đột ngột, không cần bản lề, thường ở chỗ bắt đầu câu mới. Ví dụ trong nhạc cổ điển: đầu phần phát triển của Mozart Giao hưởng số 40 chuyển đột ngột sang Fa♯ thứ, một giọng xa giọng chính."
    ly_do: 'n26 (da-bo): câu pop không kiểm được. n27 (da-sua): nêu tên giọng (Fa♯ thứ) theo Hollywood Bowl và SFCM; "rất xa" thành "xa".'
  - cu: "Đây là lý do hình thức sonata vận hành được: phần trình bày chuyển sang giọng át (hoặc giọng trưởng song song nếu ở giọng thứ) cho chủ đề 2, tạo xung đột giữa hai giọng; phần tái hiện đưa chủ đề 2 về giọng chính, giải quyết xung đột đó."
    moi: Trong hình thức sonata, phần trình bày chuyển sang giọng át (hoặc giọng trưởng song song nếu ở giọng thứ) cho chủ đề 2, tạo xung đột giữa hai giọng; phần tái hiện đưa chủ đề 2 về giọng chính, giải quyết xung đột đó.
    ly_do: "n33 (da-sua): câu nhân quả không có nguồn."
