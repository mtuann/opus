    ghi_chu: 'OMT: át phụ "temporarily tonicizes"; cảm âm phụ "resolves as it would in its own key"; Fa♯ là cảm âm của Sol và lên nửa cung tới Sol.'
    luot_2: dung
    luot_2_nguon: [ "https://musictech.ithaca.edu/MusicTech/ICTheory/OnlineText/TheoryII/Unit2/SecDom/SecDom.html", "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/" ]
