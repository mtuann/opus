    ghi_chu: 'src/content/docs/nhac-ly/12-hoa-am-chuc-nang.md (cùng lô D3-L2): mục chức năng át và kết trọn V – I ("Bè trầm V → I ... là chuyển động của kết trọn"); trang cũ cùng tên. Review: src/content/docs/nhac-ly/12-hoa-am-chuc-nang.md (nhánh này) có bảng chức năng (Át: V, V7) và câu "Bè trầm V → I ... là chuyển động của kết trọn (V – I)"; link /opus/nhac-ly/12-hoa-am-chuc-nang/ đúng.'
    review: dung
  - id: n3
    cau: Mọi hợp âm ba trưởng hay thứ trong giọng đều có thể có một "hợp âm V của riêng nó".
    loai: quy-tac
    nguon:
      - omt-tonicization
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mọi hợp âm đều có thể có một ''hợp âm V của riêng nó''" (đầu bài, và trong mô tả đầu trang). Chữ mới: câu trên. Lý do: OMT, Tonicization: "Any major or minor triad can be tonicized, not just V"; hợp âm giảm và tăng không thể (không có giọng giảm, giọng tăng): "every Roman numeral can be tonicized except viio and iio". Chữ cũ gồm cả vii°. Review D3-gom: chữ mới có ở đoạn mở đầu và description; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/", "https://musictech.ithaca.edu/MusicTech/ICTheory/OnlineText/TheoryII/Unit2/SecDom/SecDom.html" ]
    luot_2_ghi_chu: "OMT: mọi hợp âm ba trưởng hoặc thứ đều có thể được chủ âm hóa (không phải ba giảm/tăng)."
  - id: n4
    cau: Hợp âm V của Sol trưởng là Rê trưởng (D).
    loai: dinh-nghia
    nguon:
