    ket_qua: dung
    ghi_chu: 'V của Sol trưởng: bậc 5 của gam Sol là Rê; hợp âm trưởng trên Rê (theo OMT "V(7) ... chord after the slash is the one tonicized").'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/" ]
