    cau: 'Bảng: V/IV trong Đô trưởng là C7, dẫn đến F, nốt "lạ" là Si♭.'
    loai: so-lieu
    nguon:
      - omt-tonicization
    ket_qua: dung
    ghi_chu: 'V7 của Fa là Đô – Mi – Sol – Si♭ = C7; Si♭ là nốt lạ. OMT: V7/IV là hợp âm trên chủ âm có thêm quãng 7 thứ.'
