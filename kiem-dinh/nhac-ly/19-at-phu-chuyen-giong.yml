    ghi_chu: 'Am = vi trong Đô trưởng; trong Sol trưởng (Sol La Si Đô Rê Mi Fa♯) La là bậc 2 nên Am là ii. OMT: chuyển giọng thường gặp "I→V and I→vi (e.g., C→G and C→Am)"; ví dụ pivot trong OMT cũng viết "iv7 becomes ii7".'
