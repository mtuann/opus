  - id: n13
    cau: 'Ngoài hợp âm V, hợp âm vii° (hoặc vii°7) cũng có thể làm át phụ: hợp âm cảm âm phụ.'
    loai: dinh-nghia
    nguon:
      - omt-tonicization
    ket_qua: dung
    ghi_chu: 'OMT: secondary leading-tone chord là "a leading-tone chord that makes a non-tonic chord temporarily sound like tonic"; "Most often ... fully diminished" (vii°7), đôi khi nửa giảm. Trang dùng chữ "át phụ" rộng cho cả hợp âm cảm âm phụ (cách gọi của site): ghi cho D3-L5.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/" ]
    luot_2_ghi_chu: "OMT: vii°/V, vii°7/V là hợp âm cảm âm phụ."
  - id: n14
    cau: vii°/V trong Đô trưởng là Fa♯ – La – Đô (hoặc Fa♯ – La – Đô – Mi♭, hợp âm bảy giảm), dẫn về G vì Fa♯ là cảm âm của Sol.
    loai: so-lieu
    nguon:
      - omt-tonicization
    ket_qua: dung
    ghi_chu: 'Cảm âm của Sol là Fa♯; hợp âm ba giảm trên Fa♯ = Fa♯ – La – Đô; thêm Mi♭ (3 thứ trên Đô) được hợp âm bảy giảm. OMT: hợp âm cảm âm phụ "most often fully diminished".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/" ]
    luot_2_ghi_chu: "OMT: Fa♯°7 giải về Sol, ký hiệu vii°7/V."
  - id: n15
    cau: 'Mẹo: một dấu hóa bất thường xuất hiện rồi biến mất ngay, đặc biệt là một nốt thăng đi lên nửa cung, rất có thể là cảm âm của một át phụ.'
    loai: quy-tac
    nguon:
      - omt-tonicization
    ket_qua: dung
    ghi_chu: 'OMT, Tonicization: "Applied chords nearly always involve accidentals, and especially accidentals that raise the pitch." Câu của trang đã dè dặt ("rất có thể"). Ngoại lệ: V/IV có Si♭ (giáng, đi xuống) — trang nói "đặc biệt", không nói luôn luôn.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/", "https://musictech.ithaca.edu/MusicTech/ICTheory/OnlineText/TheoryII/Unit2/SecDom/SecDom.html" ]
  - id: n16
    cau: 'Át phụ làm hợp âm đích được "chủ âm hóa" tạm thời (tonicization): trong một khoảnh khắc G nghe như chủ âm, rồi nhạc vẫn ở Đô trưởng.'
    loai: dinh-nghia
    nguon:
      - omt-tonicization
    ket_qua: dung
    ghi_chu: 'OMT: tonicization là "The process by which a non-tonic triad is made to sound like a temporary tonic."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/" ]
  - id: n17
    cau: Khi giọng mới được khẳng định đủ lâu, thường bằng một kết ở giọng mới, ta nói bản nhạc đã chuyển giọng (modulation).
    loai: dinh-nghia
    nguon:
      - omt-modulation
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thường bằng một kết trọn ở giọng mới". Chữ mới: "thường bằng một kết ở giọng mới". Lý do: OMT: chuyển giọng là "a longer-term change of tonic"; "The clearest modulations are those where the new key is established with a cadence, and then the passage continues in the new key after the cadence"; OMT nói "cadence" nói chung, không riêng kết đúng hoàn toàn; trong site "kết trọn" là PAC (bài 13). Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.nebraska.edu/openmusictheory/?p=408" ]
    luot_2_ghi_chu: "OMT: đổi giọng dài hơi, xác nhận bằng kết (cadence)."
  - id: n18
    cau: Giọng gần là các giọng chỉ khác 0–1 dấu hóa; chuyển qua lại rất tự nhiên.
    loai: dinh-nghia
    nguon:
      - omt-modulation
    ket_qua: dung
    ghi_chu: 'OMT: "Key signatures within one accidental of one another (e.g., C major and G major) are considered closely related keys, sharing many common chords." "Rất tự nhiên": cách nói gọn của ý "chung nhiều hợp âm" (câu "nhạc chuyển giữa các giọng cạnh nhau rất tự nhiên", n43 ở kiem-dinh/nhac-ly/08-hoa-bieu.yml, đã chấp nhận với cùng nguồn kèm Mount 28 "harmonic smoothness").'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.nebraska.edu/openmusictheory/?p=408", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/", "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/" ]
    luot_2_ghi_chu: 'OMT: dấu hóa kề nhau ("within one accidental").'
  - id: n19
    cau: Với Đô trưởng, các giọng gần là Sol trưởng (giọng át), Fa trưởng (giọng hạ át), La thứ (song song), Mi thứ, Rê thứ.
    loai: so-lieu
    nguon:
      - omt-modulation
    ket_qua: dung
    ghi_chu: 'OMT: giọng gần ứng với ii, iii, IV, V, vi của giọng chủ ("in major: I, ii, iii, IV, V, and vi"): Rê thứ, Mi thứ, Fa trưởng, Sol trưởng, La thứ; ví dụ F trưởng: B♭, C, Gm, Dm, Am. "Song song" là cách gọi của site cho giọng thứ cùng hóa biểu (bài 7: "giọng thứ song song", relative minor); OMT dùng "relative".'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.nebraska.edu/openmusictheory/?p=408", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/", "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/" ]
    luot_2_ghi_chu: Sol (1♯), Fa (1♭), La thứ (0), Mi thứ (1♯), Rê thứ (1♭). "Song song" ở đây theo nghĩa giọng thứ cùng hóa biểu (relative).
  - id: n20
    cau: "Trên vòng quãng năm, các giọng gần nằm sát Đô trưởng: Fa trưởng và Sol trưởng ở hai bên Đô trưởng, Rê thứ và Mi thứ ở hai bên La thứ."
    loai: quy-tac
    nguon:
