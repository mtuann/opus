lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-l3
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L3 lượt 1, phần 1/2)
      luot_2: null
      review: Claude (review D3-gom, nhóm A, 28/10/2026)
      kiem_mau: null
ghi_chu: 'Trang át phụ và chuyển giọng (tầng lõi), hình ::hinh{ten="keymap"} (src/components/hinh/keymap.html) và hai khối abc. Nguồn chính: OMT, Tonicization (át phụ, cảm âm phụ, ai được chủ âm hóa), Extended Tonicization and Modulation to Closely Related Keys (chuyển giọng, giọng gần, hợp âm chung, chuyển giọng trực tiếp), Sonata Form (chủ đề 2 ở V hay III), Introduction to Harmony (V về I); bài giảng SFCM, trang tác phẩm của Hollywood Bowl và lời giới thiệu của Indianapolis Symphony cho Mozart 40. WebFetch ngày 28/10/2026 (bản tóm tắt chữ; chỗ quan trọng đã hỏi lại để lấy nguyên văn). Chỗ sửa trang: (1) "mọi hợp âm" thành "mọi hợp âm ba trưởng hay thứ" (OMT: vii° và ii° không được chủ âm hóa; cũng sửa mô tả đầu trang); (2) "kết trọn" thành "kết" ở định nghĩa chuyển giọng; (3) "Cách mượt nhất" thành "Một cách thường dùng, mượt hơn đổi giọng đột ngột"; (4) bỏ câu về nhạc pop nâng tông nửa cung; (5) câu Mozart 40: "chuyển đột ngột sang một giọng rất xa" thành "chuyển đột ngột sang Fa♯ thứ, một giọng xa giọng chính" (Hollywood Bowl, SFCM); (6) bỏ "Đây là lý do hình thức sonata vận hành được"; (7) mục Nguồn. Chưa chắc (ket_qua null): n32, chú thích dưới hình "Giọng xa ... tạo cảm giác bất ngờ" (chữ nằm trong hình keymap.html; không sửa: người giao quyết, xem n32). Ghi chú n27: số ô và ấn bản của chỗ chuyển sang Fa♯ thứ chưa đối chiếu bản nhạc. Trang đích chưa chuyển: /opus/luyen-tap/hoa-bieu/#vong-quang-nam (n21), /opus/nghe-nhac/mozart-40/ (n38; trang cũ nói "chuyển giọng đột ngột sang một giọng rất xa": lô chuyển nên sửa theo), /opus/tai-lieu-tham-khao/. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): secondary dominant (át phụ), secondary leading-tone chord (hợp âm cảm âm phụ), tonicization (chủ âm hóa), pivot chord (hợp âm chung / bản lề), closely related keys (giọng gần), direct modulation / phrase modulation (chuyển giọng trực tiếp), relative key (giọng song song, cách gọi của site; OMT dùng relative), diminished seventh chord (hợp âm bảy giảm, đã dùng ở bài 11). Bản ghi modulation, exposition, development, recapitulation đã có hồ sơ riêng (cùng phần 1/2). Giọng "át", "hạ át" dùng như ở bài 12. Review D3-gom (28/10/2026): sửa hình src/components/hinh/keymap.html, aria-label: "(cạnh nhau trên vòng quãng năm)" thành "(hai bên Đô trưởng trên vòng quãng năm)" (n30, lượt 2 sai); sửa câu n20 trên trang cùng lý do.'
