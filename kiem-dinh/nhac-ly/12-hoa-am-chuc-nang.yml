doi_chu:
  - cu: Hạ át (Subdominant / tiền át, S)
    moi: Hạ át (Predominant / tiền át, PD)
    ly_do: 'n4 (da-sua): OMT, MT21C 9.4 gọi chức năng là predominant (PD); "subdominant" chỉ là tên bậc IV; bỏ viết tắt "S" (không nguồn nào dùng).'
  - cu:
      - "Hợp âm cùng nhóm dùng chung nhiều nốt: vi (La – Đô – Mi) chung hai nốt với I (Đô – Mi – Sol), nên có thể thay thế nhau."
      - "Câu chuyện cơ bản: T → S → D → T"
      - "Phần lớn âm nhạc từ Bach đến Brahms (và cả nhạc pop hôm nay) đi theo vòng ổn định → rời đi → căng thẳng → trở về:"
      - Bè trầm V → I (đi xuống quãng 5, hay lên quãng 4) là chuyển động mạnh nhất trong hòa âm phương Tây.
    moi:
      - 'Hợp âm cùng nhóm dùng chung nhiều nốt: vi (La – Đô – Mi) chung hai nốt với I (Đô – Mi – Sol), nên vi thường được dùng thay cho I (một hợp âm chủ "yếu" hơn).'
      - "Câu chuyện cơ bản: T → PD → D → T"
      - "Nhiều bản nhạc, từ nhạc cổ điển đến nhạc pop, có câu nhạc đi theo vòng ổn định → rời đi → căng thẳng → trở về:"
      - Bè trầm V → I (đi xuống quãng 5, hay lên quãng 4) là chuyển động của kết trọn (V – I), loại kết nghe dứt khoát nhất trong nhạc cổ điển phương Tây.
    ly_do: 'n6 (da-sua): Mount 22: vi là "weak tonic substitute"; chữ cũ "thay thế nhau" hai chiều mạnh hơn nguồn.; n4, n12 (da-sua): tên chức năng PD thay S, theo OMT và MT21C 9.4.; n12 (da-sua): "phần lớn ... từ Bach đến Brahms" không kiểm được; OMT giới hạn ở common-practice, MT21C 9.4 có ví dụ cả nhạc phổ thông.; n14 (da-sua): "mạnh nhất trong hòa âm phương Tây" không có nguồn; Mount 22 nói kết đúng là kết nghe dứt khoát nhất trong nhạc cổ điển.'
  - cu: Thánh ca, dân ca, kết bài
    moi: Một cách đi hết vòng T → PD → D → T
    ly_do: 'n15 (da-sua): "thánh ca, dân ca, kết bài" không có nguồn; MT21C 9.4: I–IV–V–I là một cách thực hiện T–PD–D–T.'
  - cu: Rất nhiều bài hát thập niên 1950 đến nay
    moi: Vòng "doo-wop" của nhạc pop thập niên 1950–60, vẫn được dùng đến nay
    ly_do: 'n16 (da-sua): OMT, Four-Chord Schemas: tên "50s doo-wop", dùng trong rock ballads 1950–đầu 1960, tiếp tục được dùng; bỏ "rất nhiều bài" (không kiểm được).'
  - cu: Kết câu trong nhạc cổ điển, nền tảng của jazz
    moi: Hạ át ii, át V rồi chủ I; một trong những vòng thường gặp nhất của jazz
    ly_do: 'n17 (da-sua): MT21C, Standard Chord Progressions: ii–V–I "one of most common progressions in jazz"; bỏ "nền tảng của jazz" (không kiểm được).'
  - cu: 'Chơi chuỗi I – IV – I – V7 – I bằng hai tay (tay trái nốt gốc, tay phải ba nốt) ở vài giọng quen. Đó là "vốn từ" hòa âm của phần lớn các bài bạn sẽ tập: xem Hợp âm, hợp âm rải và hình đệm, rồi Hòa âm bên phím.'
    moi: 'Chơi chuỗi I – IV – I – V7 – I bằng hai tay (tay trái nốt gốc, tay phải ba nốt) ở vài giọng quen. Đó là "vốn từ" hòa âm cơ bản: xem Hợp âm, hợp âm rải và hình đệm, rồi Hòa âm bên phím.'
