nhan_dinh:
  - id: n1
    cau: Mỗi hợp âm trong giọng có một vai trò (chức năng).
    loai: dinh-nghia
    nguon: &a1
      - omt-intro-harmony
      - mt21c-function
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Harmony: các hợp âm có chức năng hòa âm (tonic, predominant, dominant). MT21C 9.4: "harmonic function". Phần "giống như các nhân vật trong một câu chuyện" là so sánh minh họa.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "OMT, glossary: harmonic function là ba loại hợp âm tonic, predominant, dominant."
  - id: n2
    cau: Hiểu chức năng giúp biết vì sao một chuỗi hợp âm nghe "hợp lý" và tiếp theo nó sẽ đi đâu.
    loai: quy-tac
    nguon: *a1
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Harmony: câu nhạc đi từ trái sang phải theo chức năng (tonic, predominant, dominant); MT21C 9.4: hợp âm hạ át "tend to progress to chords of dominant function". Suy ra: biết chức năng thì biết hợp âm thường đi tới đâu.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://viva.pressbooks.pub/openmusictheory/chapter/performing-harmonic-analysis-using-the-phrase-model/" ]
    luot_2_ghi_chu: "Ý chung của lý thuyết chức năng; OMT: mô hình câu Tb-PD-D-Te cho biết hợp âm nào thường theo sau."
  - id: n3
    cau: "Chức năng Chủ (Tonic, T): hợp âm chính I, hợp âm cùng nhóm vi và (iii); vai trò nhà: ổn định, nghỉ ngơi."
    loai: dinh-nghia
    nguon: &a2
      - omt-intro-harmony
      - mt21c-function
      - fff-phrases
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Harmony: tonic = "Chords that sound stable, providing a sense of home or center"; chỉ I (i), glossary: "vi and iii occasionally have tonic function". MT21C 9.4: tonic I "a state of stability and rest"; vi và iii (tonic prolongation) chung hai nốt với tonic. Mount 22: tonic function "conveys a sense of stability". Lưu ý: OMT phần chính xếp iii là predominant yếu, glossary nói iii thỉnh thoảng có chức năng chủ; trang ghi iii trong ngoặc là hợp.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Open_Music_Theory_1e/03:_Harmony/3.02:_Harmonic_Functions", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/6-1-diatonic-harmony-tutorial/" ]
    luot_2_ghi_chu: "OMT 1e: I, III, VI là nhóm tonic; iastate: vi và iii thay chủ (chung hai nốt với I)."
  - id: n4
    cau: "Chức năng Hạ át (Predominant / tiền át, PD): hợp âm chính IV, hợp âm cùng nhóm ii; vai trò rời nhà, chuẩn bị."
    loai: dinh-nghia
    nguon:
      - omt-intro-harmony
      - mt21c-function
      - fff-predom
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hạ át (Subdominant / tiền át, S)". Chữ mới: "Hạ át (Predominant / tiền át, PD)". Lý do: OMT và MT21C 9.4 gọi chức năng này là predominant, viết tắt PD ("Chords that transition away from tonic function toward dominant function"; IV và ii là strong predominants); "subdominant" ở OMT/MT21C chỉ là tên bậc IV (OMT, Minor Scales: "Subdominant (4̂, fa)"); Mount (workbook ch. 24) dùng "pre-dominant", không dùng "subdominant". Chữ viết tắt "S" không có ở các nguồn nên bỏ. Tên tiếng Việt "Hạ át" giữ (lựa chọn của site, cùng tờ tóm tắt bat-dau/tom-tat.md). Chưa đối chiếu: nguồn bậc 2 ngoài ba giáo trình này có dùng "subdominant" làm tên chức năng (Riemann, nhiều sách Anh); không đọc được. Review D3-gom: chữ mới có ở bảng Ba chức năng; khớp quyết định thuật ngữ (plans/lam-lai/README.md: "Hạ át" là chức năng PD, tiếng Anh predominant); giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/6-1-diatonic-harmony-tutorial/" ]
    luot_2_ghi_chu: "Predominant: IV và ii; OMT glossary: chuyển từ chủ sang át."
  - id: n5
    cau: "Chức năng Át (Dominant, D): hợp âm chính V, V7, hợp âm cùng nhóm vii°; vai trò căng thẳng, đòi trở về nhà."
    loai: dinh-nghia
    nguon: *a2
    ket_qua: dung
    ghi_chu: 'OMT, Introduction to Harmony: dominant = "Chords that provide a sense of urgency to resolve toward the tonic chord"; V và vii° là dominant. Mount 22: dominant function "usually performed by a V or V7 chord", "a sense of urgency"; viio6 là "weak dominant substitute". "Căng thẳng" diễn đạt lại "urgency"; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/6-1-diatonic-harmony-tutorial/" ]
    luot_2_ghi_chu: "Dominant: V và vii° (V7 là V thêm quãng bảy)."
  - id: n6
    cau: 'Hợp âm cùng nhóm dùng chung nhiều nốt: vi (La – Đô – Mi) chung hai nốt với I (Đô – Mi – Sol), nên vi thường được dùng thay cho I (một hợp âm chủ "yếu" hơn).'
    loai: quy-tac
    nguon:
      - mt21c-function
      - fff-phrases
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "... nên có thể thay thế nhau." Chữ mới: "... nên vi thường được dùng thay cho I (một hợp âm chủ "yếu" hơn)." Lý do: Mount 22: "A vi chord may be seen as a weak tonic substitute", "The vi chord shares two out of the three scale degrees that make up a tonic triad"; chữ cũ "thay thế nhau" hai chiều mạnh hơn nguồn. MT21C 9.4: vi, iii "share two common tones with the tonic triad". Kiểm các cặp cùng nhóm: ii (Rê–Fa–La) và IV (Fa–La–Đô) chung Fa, La; vii° (Si–Rê–Fa) và V (Sol–Si–Rê) chung Si, Rê; iii (Mi–Sol–Si) và I chung Mi, Sol: "nhiều nốt" (hai trên ba) đúng cho mọi cặp. Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/6-1-diatonic-harmony-tutorial/" ]
    luot_2_ghi_chu: "vi (A-C-E) chung C, E với I (C-E-G); iastate: vi là chủ thay tạm cho I."
  - id: n7
    cau: 'Hình vòng chức năng: ô CHỦ ghi "I · vi".'
    loai: dinh-nghia
    nguon: *a2
    ket_qua: dung
    ghi_chu: 'Chữ trong hình: src/scripts/ve.js, veChucNang (mảng o: "CHỦ", "I · vi"). Khớp hàng Chủ của bảng (n3). Review D3-gom: lượt 2 khong-chac vì câu tả hình. Phần chữ trong hình đã kiểm ở module src/scripts/ve.js dòng 290 (veChucNang: ''CHỦ'', ''I · vi''); phần nhạc lý (I, vi thuộc chức năng chủ) lượt 2 xác nhận theo OMT; giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu mô tả hình trên site, không kiểm được bằng nguồn ngoài. Phần nhạc lý nhất quán với OMT (phrase model Tb-PD-D-Te; chủ I/vi, hạ át IV/ii, át V/V7/vii°).
  - id: n8
    cau: 'Hình vòng chức năng: ô HẠ ÁT ghi "IV · ii".'
    loai: dinh-nghia
    nguon:
      - omt-intro-harmony
      - mt21c-function
    ket_qua: dung
    ghi_chu: 'Chữ trong hình: src/scripts/ve.js, veChucNang ("HẠ ÁT", "IV · ii"). IV và ii là predominant (OMT, MT21C). Review D3-gom: chữ trong hình kiểm ở src/scripts/ve.js dòng 291 (''HẠ ÁT'', ''IV · ii''); phần nhạc lý lượt 2 xác nhận theo OMT; giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu mô tả hình trên site, không kiểm được bằng nguồn ngoài. Phần nhạc lý nhất quán với OMT (phrase model Tb-PD-D-Te; chủ I/vi, hạ át IV/ii, át V/V7/vii°).
  - id: n9
    cau: 'Hình vòng chức năng: ô ÁT ghi "V · V7 · vii°".'
    loai: dinh-nghia
    nguon: *a2
    ket_qua: dung
    ghi_chu: 'Chữ trong hình: src/scripts/ve.js, veChucNang ("ÁT", "V · V7 · vii°"). V, V7, vii° là dominant (OMT, Mount 22). Review D3-gom: chữ trong hình kiểm ở src/scripts/ve.js dòng 292 (''ÁT'', ''V · V7 · vii°''); phần nhạc lý lượt 2 xác nhận theo OMT; giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu mô tả hình trên site, không kiểm được bằng nguồn ngoài. Phần nhạc lý nhất quán với OMT (phrase model Tb-PD-D-Te; chủ I/vi, hạ át IV/ii, át V/V7/vii°).
  - id: n10
    cau: 'Hình vòng chức năng: mũi tên đi từ Chủ sang Hạ át ("rời nhà"), từ Hạ át sang Át ("chuẩn bị"), từ Át về Chủ ("về nhà").'
    loai: quy-tac
    nguon:
      - omt-intro-harmony
      - mt21c-function
    ket_qua: dung
    ghi_chu: 'Chữ và chiều mũi tên: veChucNang: mui = [chủ→hạ át "rời nhà"], [hạ át→át "chuẩn bị"], [át→chủ "về nhà"]. Khớp mẫu T → PD → D → T (OMT: "tonic–predominant–dominant(–tonic)"; MT21C 9.4: T–PD–D–T). Aria-label của hình mô tả cùng thứ tự. Review D3-gom: mũi tên và nhãn kiểm ở src/scripts/ve.js dòng 296–298 (''rời nhà'', ''chuẩn bị'', ''về nhà'') và aria-label dòng 307; chiều T → PD → D → T lượt 2 xác nhận theo OMT; giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu mô tả hình trên site, không kiểm được bằng nguồn ngoài. Phần nhạc lý nhất quán với OMT (phrase model Tb-PD-D-Te; chủ I/vi, hạ át IV/ii, át V/V7/vii°). Chiều T->PD->D->T khớp OMT.
  - id: n11
    cau: 'Hình dưới bảng ba chức năng (::hinh{ten="functions"}) hiện đúng các chữ của bảng: Chủ I · vi, Hạ át IV · ii, Át V · V7 · vii°.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trong module dựng hình: src/scripts/ve.js, hàm veChucNang (mảng o và mui, aria-label "Vòng chức năng hòa âm: Chủ (I, vi) rời nhà sang Hạ át (IV, ii), chuẩn bị cho Át (V, V7, vii°), rồi về nhà ở Chủ"). Chữ trong hình khớp chữ hình cũ (lô chuyển đã so). Review: đã kiểm module src/scripts/ve.js, veChucNang (dòng 290–307): ba ô CHỦ "I · vi", HẠ ÁT "IV · ii", ÁT "V · V7 · vii°", khớp bảng ba chức năng của trang.'
    review: dung
  - id: n12
    cau: Nhiều bản nhạc, từ nhạc cổ điển đến nhạc pop, có câu nhạc đi theo vòng ổn định → rời đi → căng thẳng → trở về (chủ, hạ át, át, chủ).
    loai: quy-tac
    nguon:
      - omt-intro-harmony
      - mt21c-function
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Phần lớn âm nhạc từ Bach đến Brahms (và cả nhạc pop hôm nay) đi theo vòng ...\". Chữ mới: \"Nhiều bản nhạc, từ nhạc cổ điển đến nhạc pop, có câu nhạc đi theo vòng ...\". Lý do: \"phần lớn ... từ Bach đến Brahms\" là mức độ không kiểm được; OMT, Introduction to Harmony: phạm vi là \"common-practice Western classical music\" (\"we'll focus on how composers of common-practice Western classical music use harmony in a phrase\"); MT21C 9.4: mẫu T–PD–D–T có ví dụ từ Bach, Mozart, Chopin và bài hát phổ thông. Đổi tên \"S\" thành \"PD\" ở tiêu đề mục (xem ha-at). Review D3-gom: chữ mới có trên trang; tiêu đề mục đổi chữ nhưng giữ id cũ { #cau-chuyen-co-ban-t-s-d-t }; giữ."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/performing-harmonic-analysis-using-the-phrase-model/", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/07%3A_Popular_Music/7.09%3A_Four-Chord_Schemas" ]
    luot_2_ghi_chu: "OMT: mỗi câu đi Tb-PD-D-Te; thành ngữ pop (doo-wop...) cũng theo vòng này."
  - id: n13
    cau: 'Khuông nhạc "I – IV – V7 – I trong Đô trưởng": [C,EGc] [F,FAc] [G,DFB] [C,EGc].'
    loai: so-lieu
