  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - hop-am
      - be-tram-so
    ket_qua: da-sua
    ghi_chu: 'Bản gốc có hợp âm đầu [Gc] thiếu quãng 3 (Đô-Sol-Đô). Sửa thành [EG] (Mi-Sol) để nốt 3 và 5 có mặt khi bass là Đô. Các hợp âm sau: Mi bass 6 -> [Gc] (Sol-Đô: Đô trưởng đảo 1), Fa -> [Ac] (La-Đô: Fa trưởng), Sol 7 -> [FB] (Fa-Si: nốt 7 và 3 của G7), Đô -> [Ec]. Ô cuối [Ec]4 đủ 4/2.'
doi_chu:
  - cu: Thời Baroque, nhạc công đàn phím không có bản nhạc đầy đủ. Họ chỉ có bè trầm kèm những con số nhỏ bên dưới, và phải tự chơi hợp âm bên trên ngay khi biểu diễn. Đó là bè trầm số (figured bass), xương sống của bè trầm liên tục (basso continuo, xem Baroque). Biết đọc nó, bạn hiểu cách nhạc sĩ thời Bach nghĩ về hòa âm.
    moi: Thời Baroque, nhạc công đàn phím không có bản nhạc đầy đủ. Họ chỉ có bè trầm kèm những con số nhỏ bên dưới, và phải tự chơi hợp âm bên trên ngay khi biểu diễn. Đó là bè trầm số (figured bass), cách ghi hợp âm của bè trầm liên tục (basso continuo, xem Baroque). Biết đọc nó, bạn đọc được cách nhạc sĩ Baroque ghi hòa âm.
    ly_do: 'n4 (da-sua): COD định nghĩa bè trầm số là hệ ký hiệu ghi hợp âm cho bè trầm liên tục.; n5 (da-sua): không có nguồn cho "cách nghĩ"; bỏ phỏng đoán, giữ điều ký hiệu thực sự cho biết.'
  - cu: Các con số chỉ quãng tính từ nốt bè trầm lên, theo hóa biểu, không phân biệt quãng tám. Người chơi tự chọn cách xếp các nốt đó.
    moi: Các con số chỉ quãng tính từ nốt bè trầm lên, theo hóa biểu. Người chơi tự chọn cách xếp các nốt đó.
    ly_do: "n8 (da-bo): không nguồn nào nêu; câu quiz 1 cũng sửa không dùng cụm này."
  - cu: 'Đọc bè trầm: Đô (không số: Đô trưởng thể gốc) – Mi 6 (Đô trưởng đảo 1) – Fa (Fa trưởng) – Sol 7 (G7) – Đô. Khuông trên là một cách "giải" bằng hai bè: ở hợp âm G7, nốt 7 (Fa) đi xuống Mi và cảm âm Si đi lên Đô, đúng như bài 21. Người chơi có thể chọn cách xếp khác, miễn đúng các quãng.'
    moi: 'Đọc bè trầm: Đô (không số: Đô trưởng thể gốc) – Mi 6 (Đô trưởng đảo 1) – Fa (Fa trưởng) – Sol 7 (G7) – Đô. Khuông trên là một cách "giải" bằng hai bè: ở hợp âm G7, nốt 7 (Fa) đi xuống Mi và cảm âm Si đi lên Đô, đúng như bài 21. Người chơi có thể chọn cách xếp khác. Hai bè trên ở đây chỉ giữ nốt 3 và nốt 7 của G7 (Si, Fa); số 7 ngầm có cả nốt 5 (Rê).'
    ly_do: "n22 (da-sua): câu cũ quá tuyệt đối; thêm mô tả đúng điều khuông ví dụ làm."
  - cu: Các nghệ sĩ harpsichord, organ, lute trong nhóm nhạc Baroque vẫn ứng tác từ bè trầm số mỗi buổi diễn.
    moi: Nhiều nghệ sĩ harpsichord, organ, lute trong nhóm nhạc Baroque vẫn ứng tác hợp âm từ bè trầm số khi biểu diễn.
    ly_do: 'n24 (da-sua): "các … mỗi buổi" nói quá; nguồn chỉ nói thực hành này còn tồn tại.'
  - cu: Open Music Theory; musictheory.net.
    moi:
