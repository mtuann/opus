lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-gom
    ma_bam: sha256:b01d1dfb0f77d38aaedc0a455221ede8cb47745839e8e5c01d65bf8cf3ea4e18
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L2 lượt 1, phần 2/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, nhóm A, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Bài nhạc lý 15 (tiết tấu nâng cao). Nguồn chính: Open Music Theory (Glossary, Other Rhythmic Essentials, Compound Meter, Metrical Dissonance, Twentieth-Century Rhythmic Techniques), Concise Oxford Dictionary of Music (syncopation, hemiola, qua Encyclopedia.com), Dolmetsch Online (bài 4, bài 20, từ điển), IMSLP (Holst, Planets), BSO (Tchaikovsky 6), Woodruff MTO 6.12. Sửa ở lượt 1: (1) bỏ Chopin, Brahms, "nhạc Lãng mạn" ở liên ba nốt đen; (2) đảo phách "từ Bach đến Beethoven" thành "từ thời Ars Nova, jazz phát triển rộng rãi" (COD); (3) hemiola "phanh lại, minuet, courante, aria, Brahms" thành "thường ở các kết quan trọng của nhạc nhịp ba, vd. Water Music Tổ khúc 2 chương II" (OMT); (4) bài tập Happy Birthday thành "giai điệu quen thuộc" (vị trí phách không kiểm được); (5) bỏ "từ thế kỷ 20 xuất hiện thường xuyên hơn" và "Stravinsky đổi nhịp gần như mỗi ô" (Woodruff nói ngược); (6) mục Nguồn. Không sai nhưng cần người giao biết: trong khối abc 3 ô 2 và ô 3 nghe giống hệt nhau. Gạch đầu dòng OMT thứ hai ở Nguồn có thể gộp với gạch đầu. Thuật ngữ tiếng Việt chưa có trong src/data/thuat-ngu.yml (cho D3-L5): "nhịp lấy đà", "đảo phách", "liên ba", "hemiola", "nhịp đơn / nhịp kép".'
