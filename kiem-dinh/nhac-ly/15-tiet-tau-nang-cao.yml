nhan_dinh:
  - id: n1
    cau: Phần Tiết tấu, điệu thức và chuyển giọng (bài 15–20) dành cho bạn đã xong 14 bài nền tảng và 3 bài ôn tập. Bài đầu tiên lấp những lỗ hổng về tiết tấu mà bạn sẽ gặp ngay khi đọc bản nhạc thật.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bản cũ ../opus-zero/mkdocs.yml dòng 248-255: mục "Tiết tấu, điệu thức, chuyển giọng" gồm bài 15-20 (15 là bài đầu tiên); nhac-ly/index.md dòng 38 "Phần 4: Tiết tấu, điệu thức và chuyển giọng"; trước đó là bài 1-14 và "Ôn tập 1, 2, 3" (mkdocs.yml dòng 226-247). Dòng này cũng là mô tả trang (frontmatter). "Lấp lỗ hổng... ngay khi đọc bản nhạc thật" là lời giới thiệu. Review: đã kiểm src/content/docs/nhac-ly/index.md (nhánh này): Phần 1–3 gồm bài 1–14 và Ôn tập 1, 2, 3; "Phần 4: Tiết tấu, điệu thức và chuyển giọng" gồm bài 15–20, bài 15 đứng đầu.'
    review: dung
  - id: n2
    cau: Thông thường một phách chia đôi (hai móc đơn) hoặc chia bốn (bốn móc kép).
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-compound
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "simple meter: A meter that divides the beat into two parts"; OMT: phách nhịp đơn chia hai rồi chia tiếp thành bốn (compound: "the beat divides into three and then further subdivides into six"). Phách nốt đen chia hai móc đơn hay bốn móc kép: suy từ độ dài nốt.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://viva.pressbooks.pub/openmusictheory/chapter/other-rhythmic-essentials/" ]
    luot_2_ghi_chu: "OMT: nhịp đơn chia phách làm hai, rồi chia tiếp thành bốn."
  - id: n3
    cau: Liên ba (triplet) chia một phách thành ba phần bằng nhau; viết bằng ba nốt có số 3 bên trên.
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-rhythm
      - dol20
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "A tuplet that involves dividing a beat in simple meter into three parts."; OMT Other Rhythmic Essentials: "Notate a triplet by writing a ''3'' above the appropriate rhythm." Dolmetsch bài 20: "three notes in the time of two". "Bằng nhau": ba nốt cùng độ dài là cách dùng thông thường.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://viva.pressbooks.pub/openmusictheory/chapter/other-rhythmic-essentials/" ]
    luot_2_ghi_chu: "OMT: triplet chia một phách trong nhịp đơn thành ba phần."
  - id: n4
    cau: Hãy đếm "1 và 2 và" cho móc đơn, "1-trip-let 2-trip-let" cho liên ba, và "1 e và a 2 e và a" cho móc kép.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên tập (cách đếm quen dùng trong tài liệu tiếng Anh, trang đã nói). Không nguồn bậc 1-2 đã mở ghi nguyên văn các âm tiết này (Dolmetsch bài 20 có bảng âm tiết đếm nhưng bản đọc được không liệt kê đủ), nên chỉ coi là khuyên tập; không trái nguồn nào.
  - id: n5
    cau: Liên ba có thể chia hai phách thành ba nốt đen (liên ba nốt đen).
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-rhythm
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Liên ba cũng có thể chia hai phách thành ba nốt đen (liên ba nốt đen), rất hay gặp trong nhạc Lãng mạn. Chopin và Brahms thường chồng liên ba ở một tay lên nhịp chia đôi ở tay kia (''ba chọi hai'')." Chữ mới giữ phần đầu. OMT Other Rhythmic Essentials: triplet là "a beat (or subdivision, or multiple beats) in simple meter is divided into three parts", nên ba nốt trong hai phách đúng. Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/other-rhythmic-essentials/" ]
    luot_2_ghi_chu: "OMT: triplet ba nốt đen chiếm chỗ một nốt trắng (hai phách)."
  - id: n6
    cau: Liên ba rất hay gặp trong nhạc Lãng mạn; Chopin và Brahms thường chồng liên ba ở một tay lên nhịp chia đôi ở tay kia ("ba chọi hai").
    loai: lich-su
    nguon:
      - omt-rhythm
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang. Không nguồn bậc 1-2 đã mở nào nói: OMT không nhắc Chopin, Brahms hay "ba chọi hai"; OMT, Metrical Dissonance, chỉ bàn 3 chọi 4. Wikipedia (bậc 3, chỉ để tìm nguồn) nhắc Chopin Étude op. 10 số 10 (ba nốt rồi hai nốt) và Brahms Sonata violin op. 78 (3+3 và 2+2+2), không khớp nguyên câu. Review D3-gom: đã kiểm trang không còn chữ "Chopin", "Brahms", "ba chọi hai".'
    luot_2: khong-chac
    luot_2_ghi_chu: Liên ba/ba chọi hai trong Chopin và Brahms có thật (blog crosseyedpianist) nhưng chưa có nguồn bậc 2; 'rất hay gặp' mơ hồ.
  - id: n7
    cau: 'Nhiều giai điệu không bắt đầu ở phách mạnh mà bắt đầu bằng một vài nốt trước vạch nhịp đầu tiên: nhịp lấy đà (anacrusis, upbeat).'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - dol4
      - dol-anac
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Anacrusis: Notes on an upbeat that lead into the first downbeat of a phrase."; Dolmetsch bài 4: "An opening that begins on a weak beat is called an anacrusis."; Dolmetsch (từ điển): "a single note, ... up-beat or pickup note, or a group of notes, that occurs before the first strong beat".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/" ]
    luot_2_ghi_chu: "OMT: anacrusis = nốt ở phách lấy đà dẫn vào phách mạnh đầu."
  - id: n8
    cau: Ô nhịp đầu khi đó không đủ phách; ô nhịp cuối thường bù lại phần thiếu.
    loai: dinh-nghia
    nguon:
      - dol4
    ket_qua: dung
    ghi_chu: 'Dolmetsch bài 4: ô đầu thiếu phách khi bài bắt đầu ở phách yếu; "the two bars taken together should have the same number of beats as an inner bar"; "good practice to balance the incomplete bar at the beginning of the piece with a truncated or short bar at the end".'
    luot_2: dung
    luot_2_nguon: [ "https://www.finalemusic.com/?p=18830" ]
    luot_2_ghi_chu: "Finale: 'last measure ... will be truncated to complete the first measure' (quy ước phổ biến)."
  - id: n9
    cau: 'Đảo phách (syncopation) là đặt trọng âm vào chỗ "đáng lẽ yếu": giữa phách, hoặc phách nhẹ, thường bằng một nốt dài bắt đầu lệch khỏi phách mạnh.'
    loai: dinh-nghia
    nguon:
      - cod-sync
      - omt-gloss
      - omt-rhythm
    ket_qua: dung
    ghi_chu: 'COD: syncopation đạt được "by accenting a weak instead of a strong beat, by putting rests on strong beats, by holding on over strong beats..."; OMT Glossary: "A rhythmic phenomenon in which the hierarchy of the underlying meter is contradicted through surface rhythms"; OMT: nảy sinh từ nối, chấm dôi, dấu lặng và/hoặc động lực.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/syncopation" ]
    luot_2_ghi_chu: "OMT: syncopation làm trật phân cấp phách; Oxford: thay đổi vị trí nhấn."
  - id: n10
    cau: Ô nhịp 2 và 3 của ví dụ đảo phách có cùng các nốt như ô 1, nhưng lệch nửa phách; dấu nối làm nốt "đè" lên phách mạnh.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Khối abc 3 (L:1/8, M:4/4): ô 1 C2 E2 G2 c2; ô 2 C E2 G2 c2 z (cùng nốt C E G c, mỗi nốt dịch nửa phách); ô 3 C E- E G- G c2 z (E và G nối qua phách 2 và phách 3). Đúng. Lưu ý cho người giao: ô 2 và ô 3 nghe giống hệt nhau (E2 và E- E cùng độ dài, bắt đầu cùng chỗ); chỉ khác cách viết, nên ô 3 minh họa cách ghi bằng dấu nối chứ không thêm âm thanh mới. Không sai nên chưa sửa. Review: đã đọc khối abc 3 (dòng 44–52): ô 1 C2 E2 G2 c2; ô 2 C E2 G2 c2 z; ô 3 C E- E G- G c2 z: cùng các nốt, lệch nửa phách, ô 3 dùng dấu nối qua phách; câu đúng.'
    review: dung
  - id: n11
    cau: Đảo phách đã có từ thời Ars Nova và được nhạc jazz phát triển rộng rãi.
    loai: lich-su
    nguon:
      - cod-sync
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đảo phách có mặt từ Bach đến Beethoven, và là linh hồn của ragtime, jazz." COD: "First used at time of ars nova, and exploited to fullest capabilities by jazz musicians, often in improvisation." COD không nhắc Bach, Beethoven hay ragtime. Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/syncopation" ]
    luot_2_ghi_chu: "Oxford: 'First used at time of ars nova, and exploited ... by jazz musicians'."
  - id: n12
    cau: Trong nhịp đơn (2/4, 3/4, 4/4), mỗi phách chia đôi. Trong nhịp kép, mỗi phách là nốt đen chấm dôi và chia ba.
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-compound
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "simple meter: divides the beat into two parts", "compound meter: divides the beat into three parts"; OMT Compound Meter: "If 8 is the bottom number, the beat is a dotted quarter note (equivalent to three eighth notes)." Nốt đen chấm dôi là phách khi số dưới là 8 (6/8, 9/8, 12/8); với 6/4 thì khác, nhưng trang chỉ bàn x/8.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/" ]
    luot_2_ghi_chu: "OMT: nhịp đơn chia hai; nhịp kép phách luôn chấm và chia ba."
  - id: n13
    cau: 6/8 có 2 phách lớn, mỗi phách 3 móc đơn.
    loai: dinh-nghia
    nguon:
      - omt-compound
    ket_qua: dung
    ghi_chu: 'OMT: 6/8 là compound duple, 2 phách mỗi ô, phách là nốt đen chấm dôi.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/" ]
    luot_2_ghi_chu: 6/8 hai phách chấm, mỗi phách ba móc đơn.
  - id: n14
    cau: 9/8 có 3 phách lớn, mỗi phách 3 móc đơn.
    loai: dinh-nghia
    nguon:
      - omt-compound
    ket_qua: dung
    ghi_chu: 'OMT: 9/8 là compound triple, 3 phách mỗi ô.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/" ]
    luot_2_ghi_chu: 9/8 ba phách.
  - id: n15
    cau: 12/8 có 4 phách lớn, mỗi phách 3 móc đơn.
    loai: dinh-nghia
    nguon:
      - omt-compound
    ket_qua: dung
    ghi_chu: 'OMT: 12/8 là compound quadruple, 4 phách mỗi ô.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/" ]
    luot_2_ghi_chu: 12/8 bốn phách.
  - id: n16
    cau: 'Hemiola là khi hai ô nhịp 3/4 được nhấn như ba nhóm 2 phách (nghe như một ô 3/2): MẠNH-nhẹ MẠNH-nhẹ MẠNH-nhẹ thay vì MẠNH-nhẹ-nhẹ MẠNH-nhẹ-nhẹ.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-metdis
      - cod-hemiola
      - dol20
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Hemiola: A grouping dissonance between a 2-layer and a 3-layer"; "Hemiolas commonly occur in triple-meter pieces by grouping six beats". COD: "superimposing 2 notes in the time of 3, or 3 in the time of 2." Dolmetsch bài 20: hemiola là hai ô nhịp ba tạo ba phách (nhóm hai). "Nghe như một ô 3/2": cách nói tương đương (OMT dùng 3/2 khi nói ví dụ Stravinsky, không nói cho hemiola; tương đương toán học).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://viva.pressbooks.pub/openmusictheory/chapter/metrical-dissonance/", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/chapter/more-advanced-rhythms" ]
    luot_2_ghi_chu: "OMT: hemiola là grouping dissonance 2 lớp vs 3 lớp, hai ô nhịp ba nghe thành ba nhóm hai phách."
  - id: n17
    cau: Hemiola thường xuất hiện ở các kết quan trọng của nhạc nhịp ba, chẳng hạn trong Water Music, Tổ khúc số 2, chương II của Handel.
    loai: dinh-nghia
    nguon:
      - omt-metdis
