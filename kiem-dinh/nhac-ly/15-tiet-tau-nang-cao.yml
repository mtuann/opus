doi_chu:
  - cu: Liên ba cũng có thể chia hai phách thành ba nốt đen (liên ba nốt đen), rất hay gặp trong nhạc Lãng mạn. Chopin và Brahms thường chồng liên ba ở một tay lên nhịp chia đôi ở tay kia ("ba chọi hai").
    moi: Liên ba cũng có thể chia hai phách thành ba nốt đen (liên ba nốt đen).
    ly_do: 'n5, n6 (da-bo/da-sua): "rất hay gặp trong nhạc Lãng mạn" và "Chopin và Brahms thường chồng liên ba lên nhịp chia đôi (ba chọi hai)" không có nguồn bậc 1-2 đã mở; bỏ cả hai. Giữ câu liên ba nốt đen chia hai phách thành ba phần.'
  - cu: Ô nhịp 2 và 3 có cùng các nốt như ô 1, nhưng lệch nửa phách; dấu nối làm nốt "đè" lên phách mạnh. Đảo phách có mặt từ Bach đến Beethoven, và là linh hồn của ragtime, jazz.
    moi: Ô nhịp 2 và 3 có cùng các nốt như ô 1, nhưng lệch nửa phách; dấu nối làm nốt "đè" lên phách mạnh. Đảo phách đã có từ thời Ars Nova và được nhạc jazz phát triển rộng rãi.
    ly_do: 'n11 (da-sua): Concise Oxford Dictionary of Music, mục syncopation: "First used at time of ars nova, and exploited to fullest capabilities by jazz musicians, often in improvisation." Câu cũ "có mặt từ Bach đến Beethoven, và là linh hồn của ragtime, jazz" không nguồn nào đọc được xác nhận (COD không nhắc Bach, Beethoven hay ragtime). Không ghi năm cho Ars Nova vì COD không ghi.'
  - cu: 'Hemiola là khi hai ô nhịp 3/4 được nhấn như ba nhóm 2 phách (nghe như một ô 3/2): MẠNH-nhẹ MẠNH-nhẹ MẠNH-nhẹ thay vì MẠNH-nhẹ-nhẹ MẠNH-nhẹ-nhẹ. Nó tạo cảm giác "phanh lại" và rất hay xuất hiện ngay trước kết trong nhạc Baroque (các minuet, courante, aria của Handel), rồi được Brahms dùng như dấu ấn riêng.'
    moi: "Hemiola là khi hai ô nhịp 3/4 được nhấn như ba nhóm 2 phách (nghe như một ô 3/2): MẠNH-nhẹ MẠNH-nhẹ MẠNH-nhẹ thay vì MẠNH-nhẹ-nhẹ MẠNH-nhẹ-nhẹ. Nó thường xuất hiện ở các kết quan trọng của nhạc nhịp ba, chẳng hạn trong Water Music, Tổ khúc số 2, chương II của Handel."
    ly_do: "n17, n18 (da-bo/da-sua): OMT, Metrical Dissonance: \"This sort of hemiola is often found at important cadences of pieces in triple meter\", ví dụ \"G.F. Handel's Water Music Suite No. 2, mvt. II\"; Concise Oxford Dictionary of Music, mục hemiola: dùng nhiều trong các mẫu kết cho đến hết Baroque. Bỏ: cảm giác \"phanh lại\", \"minuet, courante\" (không nguồn nào đọc được nhắc), \"dấu ấn riêng của Brahms\" (OMT chỉ nhắc Brahms Lullaby cho một loại bất đồng nhịp khác)."
  - cu: "Từ thế kỷ 20, nhịp 5/4 hay 7/8 xuất hiện thường xuyên hơn. 7/8 thường được nhóm thành 2+2+3 hoặc 3+2+2. Holst The Planets: Mars dùng 5/4, Tchaikovsky viết một chương valse 5/4 trong Giao hưởng số 6. Stravinsky trong Le Sacre du printemps đổi nhịp gần như mỗi ô."
    moi: "Có những bản dùng số chỉ nhịp không đều như 5/4 hay 7/8. 7/8 thường được nhóm thành 2+2+3 hoặc 3+2+2. Holst The Planets: Mars dùng 5/4, Tchaikovsky viết một chương valse 5/4 trong Giao hưởng số 6."
    ly_do: 'n20, n21, n22 (da-bo/da-sua): "Từ thế kỷ 20 ... thường xuyên hơn" bỏ: OMT, Twentieth-Century Rhythmic Techniques, chỉ nói các kỹ thuật tiết tấu "ít truyền thống" được nhạc sĩ phương Tây dùng thường xuyên hơn sau năm 1900, không riêng 5/4 hay 7/8. Câu "Stravinsky đổi nhịp gần như mỗi ô" bỏ: bài Woodruff (Music Theory Online 6.12) nói ngược lại cho điệu Sacrificial Dance. Giữ: nhóm 2+2+3 / 3+2+2 cho 7/8 (OMT, cùng chương), Holst Mars 5/4 (bản phổ IMSLP, khối LilyPond "\time 5/4"), Tchaikovsky chương 2 Giao hưởng số 6 ở 5/4 (Dolmetsch Online, Music Theory Online bài 4: "five over four... two plus three"; Boston Symphony Orchestra: "stuttering waltz in unexpected 5/4 meter").'
  - cu: Viết lại giai điệu Happy Birthday với nhịp lấy đà (bài hát bắt đầu ở phách 3 của nhịp 3/4).
    moi: Chọn một giai điệu quen thuộc bắt đầu bằng nhịp lấy đà và viết lại đoạn đầu cho đúng chỗ vạch nhịp.
    ly_do: 'n29 (da-sua): "Happy Birthday bắt đầu ở phách 3 của nhịp 3/4" không kiểm được bằng bản phổ công cộng đã mở; đổi thành bài tập không nêu sự kiện nhạc cụ thể.'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Simple Meter and Time Signatures; Compound Meter and Time Signatures."
      - "The Concise Oxford Dictionary of Music (Kennedy, Bourne) qua Encyclopedia.com: mục syncopation, hemiola."
      - "Open Music Theory: Metrical Dissonance; Twentieth-Century Rhythmic Techniques."
      - "Bản phổ trên IMSLP: Holst, The Planets; Tchaikovsky, Giao hưởng số 6. Dolmetsch Online, Music Theory Online, bài 4."
    ly_do: "Mục Nguồn: thay link chung bằng các nguồn đã mở khi kiểm định (lượt 1); bỏ musictheory.net."
