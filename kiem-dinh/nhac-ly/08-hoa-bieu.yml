    ghi_chu: 'OMT Minor Scales, mục Minor Keys and the Circle of Fifths: "major keys are in blue uppercase letters around the outside of the circle, while minor keys are in red lowercase letters around the inside of the circle"; mỗi giọng thứ đặt cạnh giọng trưởng cùng hóa biểu. MT21C 3.2 có "circle of fifths diagrams for both major and minor".'
  - id: n39
    cau: "Hình vòng quãng năm: vòng ngoài là 12 giọng trưởng C, G, D, A, E, B, F♯/G♭, D♭, A♭, E♭, B♭, F, kèm số dấu 0, 1♯ … 5♯, 6♯/6♭, 5♭ … 1♭; vòng trong là giọng thứ song song a, e, b, f♯, c♯, g♯, d♯/e♭, b♭, f, c, g, d."
    loai: dinh-nghia
    nguon:
      - omt-major
      - omt-minor
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ của hình (../opus-zero/docs/nhac-ly/08-hoa-bieu.md, vùng fig:circle; tools/figures.py circle_svg): ô dưới cùng của vòng trong ghi "e♭/d♯". Chữ mới (src/scripts/ve.js veVongQuangNam): "d♯/e♭". Lý do (như n36 của kiem-dinh/bat-dau/tom-tat.yml, D2-L1): ô ngoài ghi "F♯/G♭" và "6♯/6♭" nên ô trong phải cùng thứ tự: giọng thứ song song của F♯ trưởng là d♯ thứ, của G♭ trưởng là e♭ thứ (OMT Minor Scales: tonic thứ = tonic trưởng - 3 nửa cung: F♯ - 3 = D♯, G♭ - 3 = E♭); thứ tự cũ "e♭/d♯" dễ ghép F♯ với e♭. Đã đọc từng chữ của hình mới (đã chạy veVongQuangNam): vòng ngoài C, G, D, A, E, B, F♯/G♭, D♭, A♭, E♭, B♭, F, số dấu 0, 1♯, 2♯, 3♯, 4♯, 5♯, 6♯/6♭, 5♭, 4♭, 3♭, 2♭, 1♭; vòng trong a, e, b, f♯, c♯, g♯, d♯/e♭, b♭, f, c, g, d; chữ giữa "ngoài: trưởng", "trong: thứ". Mỗi giọng trưởng đúng số dấu, mỗi giọng thứ là giọng thứ song song của giọng trưởng cùng vị trí (khớp bảng 15 giọng, n20 đến n34). OMT Major Scales, mục The Circle of Fifths: đỉnh C major, thêm dấu thăng theo chiều kim đồng hồ, thêm dấu giáng ngược chiều. Hình chỉ ghi một cặp đồng âm (6♯/6♭); hai cặp 5♯/7♭ và 7♯/5♭ không ghi: giản lược, không sai.'
  - id: n40
    cau: "Chú thích của hình: theo chiều kim đồng hồ thêm một dấu thăng; ngược chiều thêm một dấu giáng."
    loai: quy-tac
    nguon:
      - omt-major
      - fff-circle
    ket_qua: dung
    ghi_chu: 'Như hai câu trên (OMT Major Scales, mục The Circle of Fifths; FFF 10.2). Chữ của chú thích giống hình cũ: "Theo chiều kim đồng hồ: thêm một dấu thăng; ngược chiều: thêm một dấu giáng."'
  - id: n41
    cau: Bấm vào một giọng để xem hóa biểu, các nốt, hợp âm và nghe thử (công cụ vòng quãng năm bấm được).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm bản cũ ../opus-zero/docs/assets/js/circle.js (mountCircle, hàm select) và thành phần mới (src/scripts/vong-quang-nam.js, ve.js thongTinGiong; đã đọc mã): chọn một ô thì hiện tên giọng, hóa biểu (hình khuông và chữ "n dấu thăng: …"), các nốt của gam, hợp âm các bậc (I = C, ii = Dm, … vii° = B°: chỉ ở giọng trưởng), giọng song song, giọng đồng âm khác tên ở cùng vị trí (B, F♯, D♭), nút "Nghe gam" và (giọng trưởng) "Nghe I – IV – V – I". Câu của trang đúng với giọng trưởng; giọng thứ không hiện hợp âm (như bản cũ).'
  - id: n42
    cau: Hai giọng cạnh nhau trên vòng quãng năm chỉ khác một dấu hóa.
    loai: dinh-nghia
    nguon:
      - fff-circle
      - mt21c-keyrel
      - fff-major-keys
    ket_qua: dung
    ghi_chu: "FFF 10.2: \"The circle of fifths is particularly useful in showing the closeness of various keys with regards to their key signatures. C major and G major are closely-related, differing by only one pitch class.\" FFF 8.4: \"Scales like these that share six out of their seven pitch classes are referred to as closely-related. Their key signatures, therefore, will differ by only one accidental.\" MT21C 22.3: \"'Closely related' keys have key signatures one degree 'sharper' or 'flatter' than the starting key.\" Ở đáy vòng, F♯ (6♯) cạnh B (5♯) và G♭ (6♭) cạnh D♭ (5♭): vẫn khác một dấu."
  - id: n43
    cau: Vì thế nhạc chuyển giữa các giọng cạnh nhau rất tự nhiên.
    loai: quy-tac
    nguon:
      - fff-modulation
      - mt21c-keyrel
    ket_qua: dung
    ghi_chu: 'FFF 28: "In tonal music, most modulations move to closely-related keys"; "These keys are considered closely-related because they share so many pitches with the primary key. For example, C major differs from the closely-related key of G major by only one pitch"; "Composers often strive for harmonic smoothness". MT21C 22.3: "In the Baroque and Classical eras, composers typically modulated to the dominant (when starting in a major key) or to the relative major (when starting in a minor key)." "Rất tự nhiên" là cách nói ví von của trang cho "êm, ít xa lạ".'
  - id: n44
    cau: Đó là một lý do chủ đề 2 trong hình thức sonata giọng trưởng thường ở giọng át, ngay bên phải giọng chính.
    loai: cau-truc
    nguon:
      - omt-sonata
      - fff-modulation
      - fff-circle
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đó là một lý do chủ đề 2 trong hình thức sonata thường ở giọng át, ngay bên phải giọng chính." Chữ mới: "... trong hình thức sonata giọng trưởng thường ở giọng át ...". Lý do: OMT Sonata Form: chủ đề 2 "in a non-tonic key (typically V for major-mode pieces and III for minor-mode pieces)"; "In major-key sonatas, this tends to be the dominant (V), and in minor-key sonatas, this is usually the mediant (III) or the minor dominant (v)." Câu cũ không nói "giọng trưởng" nên sai với sonata giọng thứ (bản cũ ../opus-zero/docs/nghe-nhac/mozart-40.md: chủ đề 2 của Giao hưởng số 40 ở Si♭ trưởng, giọng trưởng song song). Phần "một lý do": FFF 28: "By far, the most common modulatory goal for a major key is the key of the dominant. Because of the close relationship between these two keys, modulation to the dominant provides contrast while maintaining unity in a composition." "Ngay bên phải giọng chính": FFF 10.2: Đô trưởng ở đỉnh, mỗi bước theo chiều kim đồng hồ xây trên bậc 5 của giọng trước, nên giọng át là giọng kề bên phải khi giọng chính ở đỉnh.'
  - id: n45
    cau: 'Chữ cố định của công cụ luyện hóa biểu khi trả lời sai một hóa biểu có dấu thăng: "Chưa đúng. Mẹo: dấu thăng cuối cùng, đi lên nửa cung, là chủ âm của giọng trưởng." Khi câu hỏi là giọng thứ, công cụ thêm: "Giọng thứ song song thấp hơn chủ âm giọng trưởng 3 nửa cung."'
    loai: quy-tac
    nguon:
      - omt-major
      - mt21c-major-sigs
      - fff-major-keys
      - umass-ks
      - omt-minor
    ket_qua: da-sua
    ghi_chu: 'Agent làm lô (24/10/2026): đã sửa chữ của công cụ theo đề nghị của lượt 1 (src/scripts/luyen-hoa-bieu.js, hàm meo(n, loai); tests/hoa-bieu.test.mjs giữ chữ này). Chữ cũ (circle.js cũ): "Chưa đúng. Mẹo: dấu thăng cuối cùng nằm ngay dưới chủ âm nửa cung.", hiện cả khi hỏi giọng thứ mà không nói giọng trưởng. Chữ mới nói rõ giọng trưởng, và khi hỏi giọng thứ thì thêm bước sang giọng thứ song song, như mục "Đọc hóa biểu ra tên giọng" của bài 8. Giọng thứ song song: OMT Minor Scales: "Each major key signature has a corresponding relative minor key signature whose tonic is three half steps below the relative major''s tonic." Lượt 1: quy tắc đúng cho giọng trưởng, nhưng chữ của công cụ dễ dẫn sai khi câu hỏi là giọng thứ; cần agent chính quyết. Quy tắc: OMT Major Scales: "In sharp key signatures, the last sharp is a half step below the tonic (the first note of a scale)"; MT21C 2.3: "Go up a half step from the last sharp to find the key"; FFF 8.4: "In every sharp key, the right-most accidental of the key signature is the leading tone of the key"; UMass Unit 7: "The last sharp in each key signature represents 7 in the major scale." Chữ này nằm trong công cụ (src/scripts/luyen-hoa-bieu.js, hàm meo(n), chép từ circle.js cũ) và hiện cho cả ba loại câu hỏi (giọng trưởng, giọng thứ, cả hai) mà không nói "giọng trưởng". Khi câu hỏi là giọng thứ, "chủ âm" dễ bị hiểu là chủ âm giọng thứ, trong khi dấu thăng cuối nằm cao hơn chủ âm giọng thứ một cung (ví dụ Mi thứ, một dấu thăng Fa♯: Fa♯ cao hơn Mi một cung): mẹo dẫn sai. Đề nghị sửa chữ công cụ, ví dụ "Chưa đúng. Mẹo: dấu thăng cuối cùng nằm ngay dưới chủ âm giọng trưởng nửa cung (giọng thứ song song thấp hơn giọng trưởng 3 nửa cung)." Sửa xong thì đổi cau theo chữ mới, ghi da-sua và nói rõ chữ cũ, chữ mới.'
  - id: n46
    cau: 'Chữ cố định của công cụ luyện hóa biểu khi trả lời sai một hóa biểu có dấu giáng: "Chưa đúng. Mẹo: dấu giáng áp chót là tên giọng trưởng (riêng 1 dấu giáng là Fa trưởng)." Khi câu hỏi là giọng thứ, công cụ thêm: "Giọng thứ song song thấp hơn chủ âm giọng trưởng 3 nửa cung."'
