  - id: n35
    cau: "Ba cặp đồng âm khác tên nghe giống hệt nhau trên piano: Si trưởng = Đô♭ trưởng, Fa♯ trưởng = Sol♭ trưởng, Đô♯ trưởng = Rê♭ trưởng."
    loai: dinh-nghia
    nguon:
      - omt-major
      - mt21c-major-sigs
      - fff-circle
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "The bottom three key signatures ... are enharmonically equivalent. For example, the B major and C♭ major scales have different key signatures—five sharps and seven flats, respectively—but they sound the same because the notes B and C♭ are enharmonically equivalent." MT21C 2.3: "B major is enharmonically the same as C♭ major, F♯ major is enharmonically the same as G♭ major, and C♯ major is enharmonically the same as D♭ major." FFF 10.2: "C# major and Db major, for example, both begin on the same pitch class". "Trên piano" = cùng phím (nhiệt độ bình quân).'
  - id: n36
    cau: Mỗi bước theo chiều kim đồng hồ trên vòng quãng năm đi lên một quãng 5 đúng (7 nửa cung) và thêm một dấu thăng.
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-circle
      - omt-intervals
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "each key signature is a fifth away from the ones on either side of it"; "If you continue clockwise, sharp key signatures appear, each subsequent key signature adding one more sharp." FFF 10.2: "as we move clockwise around the circle, each new key is built on the fifth scale degree of the one that came before it ... Each clockwise step also adds one more sharp." OMT Intervals, bảng số nửa cung: 7 nửa cung = P5. "Thêm một dấu thăng" tính từ Đô trưởng (các giọng giáng: đi theo chiều kim đồng hồ thì bớt một dấu giáng), cách nói của OMT.'
  - id: n37
    cau: Theo chiều ngược lại, mỗi bước đi lên một quãng 4 đúng và thêm một dấu giáng.
    loai: dinh-nghia
    nguon:
      - omt-major
