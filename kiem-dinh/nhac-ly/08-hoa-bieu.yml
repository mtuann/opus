tang: loi
lan:
  - so: 1
    ngay: 2026-10-24
    nhanh: moi/d3-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L1 lượt 1, phần 2/2)
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: 'Trang hóa biểu và vòng quãng năm (tầng lõi). Nguồn chính: Open Music Theory (OMT), mở từng chương bằng curl ngày 24/10/2026 (công cụ đọc web bị trang chặn, theo lời giao việc của lô); bổ sung: Andre Mount (FFF) ch. 8, 9, 10, 28; MT21C 2.3, 3.2, 22.3; Christopher White, Fundamentals of Theory, Unit 7 (vị trí dấu trên khuông). Hai hình (keysigs, circle) và ba công cụ (circle, keysig-quiz và bàn phím ở bài 5 đến 7) do thành phần mới của lô dựng; nhận định về nội dung hình đọc từ HTML của hình cũ (../opus-zero/docs/nhac-ly/08-hoa-bieu.md) rồi đối chiếu với thành phần mới: đã chạy src/scripts/ve.js, nhac-ly.js cho 15 hóa biểu (vị trí dấu, tên giọng) và vòng quãng năm tĩnh; kết quả khớp hình cũ, riêng vòng quãng năm đổi "e♭/d♯" thành "d♯/e♭" (n39, như tờ tóm tắt D2-L1). Câu về site (n1, n17, n41, n47, n51): kiểm trên bài 6 (cùng lô), bản cũ ../opus-zero/docs/ và JavaScript cũ vì trang đích chưa chuyển. Sửa trang: n15 (nốt đầu, nốt cuối thay cho hợp âm cuối), n44 (thêm "giọng trưởng" cho sonata), n49 và n50 (bỏ "là cách nhanh nhất để tay nhớ hóa biểu") và mục Nguồn (thay link chung tới OMT và musictheory.net bằng các chương đã đọc; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, agent không đọc được chữ). CHƯA QUYẾT: n45, n46 (chữ mẹo cố định của công cụ luyện hóa biểu dẫn sai khi câu hỏi là giọng thứ). Thuật ngữ cho D3-L5: "giọng thứ song song" (relative) và "giọng cùng tên" (parallel), "đồng âm khác tên" chưa có trong src/data/thuat-ngu.yml; "hóa biểu" đã có. Không tính là nhận định: tên tiêu đề, "Luyện tập" (tiêu đề), phần nhãn của bảng 15 giọng ngoài các hàng.'
