nhan_dinh:
  - id: n1
    cau: Ở bài 6, ta thấy Sol trưởng cần Fa♯ và Fa trưởng cần Si♭.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bài 6 (nhac-ly/06-gam-truong, cùng lô, đã chuyển) có "gam Sol trưởng có một dấu thăng: Fa♯" và "gam Fa trưởng có một dấu giáng: Si♭"; link /opus/nhac-ly/06-gam-truong/ của câu đúng.'
  - id: n2
    cau: Gam Sol trưởng cần Fa♯ và gam Fa trưởng cần Si♭.
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales, ví dụ 12 và 14: hóa biểu một dấu thăng F♯ là G major; "F major, which has one flat: B♭". FFF 8.4: "G major ... has one sharp (F#)", "F major ... has one flat (Bb)".'
  - id: n3
    cau: "Mỗi giọng có một bộ dấu hóa riêng, viết một lần ở đầu mỗi khuông nhạc: đó là hóa biểu."
    loai: dinh-nghia
    nguon:
      - fff-major-keys
      - omt-major
    ket_qua: dung
    ghi_chu: 'FFF 8.3: "Each major scale contains a distinct set of seven pitch classes ... These sharps and flats used in the corresponding major scale are usually written at the beginning of each line in a key signature." OMT Major Scales: "A key signature ... appears at the beginning of a composition, after a clef but before a time signature". Mỗi giọng trưởng có bộ dấu riêng; giọng thứ song song dùng chung bộ dấu của giọng trưởng tương ứng (bảng 15 giọng bên dưới), nên "riêng" hiểu theo từng giọng trưởng; câu đặt giữa lời về Sol trưởng và Fa trưởng nên không gây hiểu nhầm.'
  - id: n4
    cau: Hóa biểu có hiệu lực với mọi nốt cùng tên ở mọi quãng tám, suốt bản nhạc.
    loai: quy-tac
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "every B, E, and A in a composition with this key signature will be flat, regardless of octave." FFF 8.5: "A sharp or flat indicated by the key signature applies to every instance of that pitch-letter name, not just those on the line or space on which it is written. They remain in effect throughout the entire piece unless they are canceled out by an accidental or a new key signature." Ngoại lệ (dấu hóa bất thường trong ô nhịp, đổi hóa biểu) đã có ở bài 5 và bài 17 cũ.'
  - id: n5
    cau: "Dấu thăng xuất hiện theo thứ tự cố định: Fa – Đô – Sol – Rê – La – Mi – Si (F C G D A E B)."
    loai: quy-tac
    nguon:
      - omt-major
      - mt21c-major-sigs
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "The order of sharps is always F, C, G, D, A, E, B." MT21C 2.3: "The order of sharps is F–C–G–D–A–E–B". FFF 8.4: "(F#, C#, G#, D#, A#, E#, B#)".'
  - id: n6
    cau: Dấu giáng xuất hiện theo thứ tự Si – Mi – La – Rê – Sol – Đô – Fa (B E A D G C F), chính là thứ tự dấu thăng viết ngược.
    loai: quy-tac
    nguon:
      - omt-major
      - mt21c-major-sigs
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "The order of the flats is the opposite of the order of the sharps: B, E, A, D, G, C, F." MT21C 2.3: "The order of flats is B–E–A–D–G–C–F. It is the reverse of the order of sharps."'
  - id: n7
    cau: "Mẹo nhớ bằng tiếng Anh. Dấu thăng: Father Charles Goes Down And Ends Battle. Dấu giáng: đọc ngược lại, Battle Ends And Down Goes Charles' Father."
    loai: khuyen-tap
    nguon:
      - mt21c-major-sigs
    ket_qua: khong-can-nguon
    ghi_chu: "Mẹo nhớ. Đã kiểm chữ cái đầu: câu thứ nhất F C G D A E B (thứ tự dấu thăng), câu thứ hai B E A D G C F (thứ tự dấu giáng). MT21C 2.3: \"A mnemonic that works forward and backward is \"Father Charles Goes Down And Ends Battle,\" which reversed is \"Battle Ends And Down Goes Charles' Father.\"\" (OMT và FFF dùng câu khác: \"Fat Cats Go Down Alleys (to) Eat Birds\")."
  - id: n8
    cau: Một giọng có 3 dấu thăng thì đó luôn là Fa♯, Đô♯, Sol♯, không bao giờ là ba dấu thăng khác.
    loai: quy-tac
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "The order of sharps is always F, C, G, D, A, E, B." A major (3 dấu thăng) = F♯, C♯, G♯ (FFF 8.4: "A major, which has three sharps (F#, C#, and G#)").'
  - id: n9
    cau: "Có dấu thăng: lấy dấu thăng cuối cùng, đi lên nửa cung, đó là chủ âm giọng trưởng."
    loai: quy-tac
    nguon:
      - omt-major
      - mt21c-major-sigs
      - fff-major-keys
      - umass-ks
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "In sharp key signatures, the last sharp is a half step below the tonic (the first note of a scale)." MT21C 2.3: "Go up a half step from the last sharp to find the key." FFF 8.4: "the right-most accidental of the key signature is the leading tone of the key". UMass Unit 7: "The last sharp in each key signature represents 7 in the major scale."'
  - id: n10
    cau: "Ví dụ: 3 dấu thăng, dấu cuối là Sol♯, nửa cung trên là La → La trưởng."
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales, ví dụ 12: "The last sharp, G♯, is a half step below the note A. Therefore, this is the key signature of A major." FFF 8.4: A major có ba dấu thăng F♯, C♯, G♯.'
  - id: n11
    cau: "Có dấu giáng: dấu giáng áp chót chính là tên giọng trưởng."
    loai: quy-tac
    nguon:
      - omt-major
      - mt21c-major-sigs
      - fff-major-keys
      - umass-ks
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "In flat key signatures, the second-to-last flat is the tonic." MT21C 2.3: "For key signatures with flats: The second-to-last flat is the key." FFF 8.4: "The second to last accidental in a flat key signature will tell you the key." UMass Unit 7: "In every major key signature with two or more flats, the tonic is the next-to-last flat in the signature."'
  - id: n12
    cau: "Ví dụ: 3 dấu giáng (Si♭, Mi♭, La♭), dấu áp chót là Mi♭ → Mi♭ trưởng."
    loai: dinh-nghia
    nguon:
      - fff-major-keys
      - omt-major
    ket_qua: dung
    ghi_chu: 'FFF 8.4: "Eb major, for example, has three flats: Bb, Eb, and Ab. The second to last (Eb) is the tonic of the key!" OMT Major Scales: thứ tự dấu giáng B, E, A…'
  - id: n13
    cau: "Trường hợp riêng cần thuộc lòng: 1 dấu giáng là Fa trưởng."
    loai: quy-tac
    nguon:
      - omt-major
      - umass-ks
    ket_qua: dung
    ghi_chu: "OMT Major Scales: \"There are two key signatures that have no 'tricks' that you will simply have to memorize. These are C major ... and F major, which has one flat: B♭.\" UMass Unit 7: \"The only flat key for which this shortcut doesn't work is F major, which has only one flat.\""
  - id: n14
    cau: "Giọng thứ: tìm giọng trưởng như trên rồi đi xuống 3 nửa cung (bậc 6)."
    loai: quy-tac
    nguon:
      - omt-minor
      - mt21c-minor-sigs
      - fff-minor-keys
    ket_qua: dung
    ghi_chu: 'OMT Minor Scales: "if you know the major key associated with a given key signature, you can go down three half steps from the tonic to find the minor key for that key signature"; "The tonic of a minor key is always three half steps below the tonic of its relative major". MT21C 3.2: "The relative major is three half steps above the relative minor." Chủ âm thứ ở bậc 6 của gam trưởng: xem hồ sơ bài 7, n14.'
  - id: n15
    cau: Muốn biết bản nhạc ở giọng trưởng hay thứ, hãy nhìn nốt đầu và nốt kết thúc (bản nhạc thường bắt đầu và kết thúc ở chủ âm), và để ý cảm âm bị thăng lên (bài 7).
    loai: quy-tac
    nguon:
      - omt-minor
      - fff-minor-keys
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hãy nhìn nốt kết thúc và hợp âm cuối, và để ý cảm âm bị thăng lên (bài 7)." Chữ mới: "hãy nhìn nốt đầu và nốt kết thúc (bản nhạc thường bắt đầu và kết thúc ở chủ âm), và để ý cảm âm bị thăng lên (bài 7)." Lý do: nguồn chỉ nêu nốt đầu và nốt cuối. OMT Minor Scales, mục Major or Minor?: "One type of such clues are the first and last notes of the work—pieces often start and end on the tonic, so this can help you determine whether a work is major or minor." FFF 9.2: giai điệu thứ "begins and ends on A"; "Look to the beginning and end of the melody for important stable notes that might represent the tonic." "Hợp âm cuối" thì không dùng được để phân biệt trưởng hay thứ: bản nhạc giọng thứ có thể kết bằng hợp âm trưởng (FFF 28 gọi là "Picardy third", "a stylistic convention"). Phần "để ý cảm âm bị thăng lên": FFF 9.2, ví dụ Reichardt (Fa thứ): có E♮ ở ô 6, "it helps make the arrival on F sound more conclusive"; FFF 9.3: bậc 6, 7 "may be raised by an accidental within the music".'
  - id: n16
    cau: Dấu hóa được thêm dần theo đúng thứ tự, từ 1 đến 7.
    loai: quy-tac
    nguon:
      - omt-major
      - mt21c-major-sigs
    ket_qua: dung
    ghi_chu: 'OMT Major Scales, ví dụ 15 và 16: các hóa biểu thăng (G, D, A, E, B, F♯, C♯ major) và giáng (F, B♭, E♭, A♭, D♭, G♭, C♭ major) "in order", mỗi giọng thêm một dấu theo thứ tự ở n5, n6. MT21C 2.3: "between 1 to 7 sharps and 1 to 7 flats".'
  - id: n17
    cau: 'Hình "Mười lăm hóa biểu" (::hinh{ten="keysigs"}): 15 ô theo thứ tự không dấu, 1♯ đến 7♯, 1♭ đến 7♭; mỗi ô có hóa biểu trên khóa Sol, số dấu, giọng trưởng (đậm) và giọng thứ song song; chú thích "Mười lăm hóa biểu. Dưới mỗi hóa biểu: giọng trưởng (đậm) và giọng thứ song song. Dấu hóa luôn được thêm theo đúng thứ tự."'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm với thành phần mới (src/plugins/thanh-phan.mjs hinhHoaBieu, src/scripts/nhac-ly.js GIONG, ve.js veHoaBieu; đã chạy bacCacDau và đọc GIONG): 15 ô đúng thứ tự trên, mỗi ô có số dấu gọn ("không dấu", "1♯"… "7♭"), hóa biểu khóa Sol, giọng trưởng và giọng thứ song song; 15 ô khớp bảng 15 giọng bên dưới (n20 đến n34) và vị trí dấu như n18, n19. Chú thích đúng chữ của hình cũ (tools/keysigs.mjs, HTML ở ../opus-zero/docs/nhac-ly/08-hoa-bieu.md); hình cũ dựng 15 khuông bằng abcjs (K:C, G, D… x4|]), hình mới vẽ SVG: cùng nội dung.'
  - id: n18
    cau: "Trên khóa Sol, bảy dấu thăng của hóa biểu đặt theo thứ tự: Fa♯ ở dòng kẻ trên cùng (dòng 5), Đô♯ ở khe 3, Sol♯ ở khe ngay trên khuông, Rê♯ ở dòng 4, La♯ ở khe 2, Mi♯ ở khe 4, Si♯ ở dòng 3 (dòng giữa)."
    loai: quy-tac
    nguon:
      - fff-major-keys
      - omt-major
      - umass-ks
    ket_qua: dung
    ghi_chu: "Đọc từ HTML của hình cũ (../opus-zero/docs/nhac-ly/08-hoa-bieu.md, khuông abcjs của 7♯): tâm bảy dấu thăng rơi đúng các dòng và khe trên (đã trừ độ lệch của đường viền ký hiệu; dòng kẻ cách nhau 7,75). Thành phần mới (ve.js bacCacDau) cho cùng vị trí. Nguồn: FFF 8.3: \"The first sharp of the key signature in Example 8–6 (centered on the top line of the staff) applies to the note on the same line, making it F#. Likewise, the second sharp of the key signature (centered on the third space on the staff) applies to the note on the same space, making it C#.\"; \"none of the sharps are written on ledger lines\". OMT Major Scales: \"The sharps form a zig-zag pattern, alternating going down and up. In the treble, bass, and alto clefs, this pattern 'breaks' after D♯ and then resumes.\" UMass Unit 7: \"We place the first sharp (F#) on the fifth line of the staff ... the fifth sharp (A#) can't continue this pattern without the use of a ledger line, so musicians instead place it down in the staff ... The next sharp (E#) can be placed higher, but the last sharp (B#) must also be placed lower.\" Từ F♯ ở dòng 5 và C♯ ở khe 3, đi xuống rồi lên theo zig-zag (G♯ lên khe trên khuông, D♯ xuống dòng 4), sau D♯ dãy \"gãy\" nên La♯ xuống khe 2, rồi Mi♯ lên khe 4, Si♯ xuống dòng 3: khớp từng vị trí trên. Không có nguồn đọc được nêu đủ bảy vị trí bằng chữ; vị trí được suy từ các câu trên, và kiểm với hình cũ."
  - id: n19
    cau: "Trên khóa Sol, bảy dấu giáng của hóa biểu đặt theo thứ tự: Si♭ ở dòng 3 (dòng giữa), Mi♭ ở khe 4, La♭ ở khe 2, Rê♭ ở dòng 4, Sol♭ ở dòng 2, Đô♭ ở khe 3, Fa♭ ở khe 1."
    loai: quy-tac
    nguon:
      - omt-major
      - umass-ks
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'Đọc từ HTML của hình cũ (khuông abcjs của 7♭): tâm bảy dấu giáng rơi đúng các dòng và khe trên (đã trừ độ lệch của đường viền ký hiệu). Thành phần mới (ve.js bacCacDau) cho cùng vị trí. Nguồn: OMT Major Scales: "The flats always make a perfect zig-zag pattern, alternating going up and down, regardless of clef." UMass Unit 7: "The flats follow a consistent down-up-down-up-down-up-down pattern in both clefs, without alteration." FFF 8.3: không dấu nào nằm trên dòng kẻ phụ. Si♭ chỉ có thể ở dòng 3 (Si♭4) vì Si♭ ở quãng tám khác phải dùng dòng kẻ phụ; rồi Mi♭ lên (khe 4), La♭ xuống (khe 2), Rê♭ lên (dòng 4), Sol♭ xuống (dòng 2), Đô♭ lên (khe 3), Fa♭ xuống (khe 1). Không có nguồn đọc được nêu đủ bảy vị trí bằng chữ; vị trí được suy từ các câu trên, và kiểm với hình cũ.'
