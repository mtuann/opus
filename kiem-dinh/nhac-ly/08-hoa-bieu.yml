    ghi_chu: 'FFF 8.3: "Each major scale contains a distinct set of seven pitch classes ... Since each major scale is unique in this way". Mười hai giọng trưởng trên đàn có mười hai tập phím trắng, đen khác nhau (các giọng đồng âm khác tên như Si và Đô♭ dùng cùng phím). Khớp ../opus-zero/docs/piano/gam.md ("Mỗi giọng có một hình phím đen – phím trắng riêng").'
  - id: n49
    cau: Chơi thế năm ngón trưởng ở cả 12 giọng, rồi tập gam đi dần quanh vòng quãng năm, là cách nhanh nhất để tay nhớ hóa biểu.
    loai: quy-tac
