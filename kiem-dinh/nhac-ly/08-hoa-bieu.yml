doi_chu:
  - cu: "Giọng thứ: tìm giọng trưởng như trên rồi đi xuống 3 nửa cung (bậc 6). Muốn biết bản nhạc ở giọng trưởng hay thứ, hãy nhìn nốt kết thúc và hợp âm cuối, và để ý cảm âm bị thăng lên (bài 7)."
    moi: "Giọng thứ: tìm giọng trưởng như trên rồi đi xuống 3 nửa cung (bậc 6). Muốn biết bản nhạc ở giọng trưởng hay thứ, hãy nhìn nốt đầu và nốt kết thúc (bản nhạc thường bắt đầu và kết thúc ở chủ âm), và để ý cảm âm bị thăng lên (bài 7)."
    ly_do: 'n15 (da-sua): OMT Minor Scales và Mount 9.2 chỉ dựa vào nốt đầu, nốt cuối; hợp âm cuối của bản giọng thứ có thể là hợp âm trưởng (Mount ch. 28: Picardy third), nên bỏ "hợp âm cuối".'
  - cu: 'Vòng quãng năm còn cho biết giọng nào "gần" nhau: hai giọng cạnh nhau trên vòng chỉ khác một dấu hóa, nên nhạc chuyển giữa chúng rất tự nhiên. Đó là một lý do chủ đề 2 trong hình thức sonata thường ở giọng át, ngay bên phải giọng chính.'
    moi: 'Vòng quãng năm còn cho biết giọng nào "gần" nhau: hai giọng cạnh nhau trên vòng chỉ khác một dấu hóa, nên nhạc chuyển giữa chúng rất tự nhiên. Đó là một lý do chủ đề 2 trong hình thức sonata giọng trưởng thường ở giọng át, ngay bên phải giọng chính.'
    ly_do: "n44 (da-sua): OMT Sonata Form: với sonata giọng trưởng, chủ đề 2 thường ở giọng át (V); giọng thứ thì ở III hay v."
  - cu: Mỗi giọng có một "địa hình" phím đen riêng. Chơi thế năm ngón trưởng ở cả 12 giọng (Vị trí năm ngón), rồi tập gam đi dần quanh vòng quãng năm, là cách nhanh nhất để tay nhớ hóa biểu.
    moi: Mỗi giọng có một "địa hình" phím đen riêng. Chơi thế năm ngón trưởng ở cả 12 giọng (Vị trí năm ngón), rồi tập gam đi dần quanh vòng quãng năm để tay làm quen với hóa biểu của từng giọng.
    ly_do: 'n49 (da-bo), n50: "cách nhanh nhất" là so sánh không kiểm được; câu mới là lời khuyên tập (khuyen-tap).'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Major Scales, Scale Degrees, and Key Signatures; Minor Scales, Scale Degrees, and Key Signatures; Intervals; Sonata Form."
      - "Andre Mount, Fundamentals, Function, and Form: chương 8. Major Keys and Key Signatures, 9. Minor Keys and Key Signatures, 10. The Circle of Fifths và 28. Modulation."
      - "Robert Hutchinson, Music Theory for the 21st-Century Classroom: 2.3 Major Key Signatures, 3.2 Minor Key Signatures, 22.3 Key Relationships; Christopher White, Fundamentals of Theory: Unit 7, Key Signatures."
    ly_do: "Mục Nguồn: thay link chung tới Open Music Theory bằng link tới đúng các chương đã đọc khi kiểm định (lượt 1), thêm giáo trình mở và trang IMSLP đã dùng; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm."
