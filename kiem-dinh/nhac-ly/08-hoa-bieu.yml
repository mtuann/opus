    ghi_chu: 'Bỏ khỏi trang phần "là cách nhanh nhất để tay nhớ hóa biểu": xếp hạng "nhanh nhất" không kiểm được và không có nguồn so các cách học hóa biểu với nhau. Chữ cũ: "..., rồi tập gam đi dần quanh vòng quãng năm, là cách nhanh nhất để tay nhớ hóa biểu." Chữ mới: "..., rồi tập gam đi dần quanh vòng quãng năm để tay làm quen với hóa biểu của từng giọng." (lời khuyên, n50).'
