      - omt-major
    ket_qua: dung
    ghi_chu: "Giọng thứ song song ở ba nửa cung dưới chủ âm trưởng: F - 3 nửa cung = D (OMT Minor Scales); gam F major F G A B♭ C D E: bậc 6 là D. Fa thứ là giọng cùng tên (parallel); Sol thứ là giọng thứ song song của Si♭ trưởng."
  - id: n56
    cau: 'Câu hỏi 5: "Trên vòng quãng năm, đi theo chiều kim đồng hồ một bước thì sao?" Đáp án đúng: lên quãng 5 đúng, thêm một dấu thăng. Sai: lên quãng 4 đúng, thêm một dấu thăng; lên quãng 5 đúng, thêm một dấu giáng. Giải thích: ví dụ Đô → Sol → Rê, mỗi bước thêm một dấu thăng.'
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-circle
    ket_qua: dung
    ghi_chu: 'Theo n36: chiều kim đồng hồ là lên quãng 5 đúng, thêm một dấu thăng; hai lựa chọn sai đổi quãng (4 đúng, là chiều ngược lại) hay đổi dấu (giáng). Ví dụ C (0) → G (1♯) → D (2♯) đúng. Như n36, "thêm một dấu thăng" tính từ Đô trưởng.'
