    ghi_chu: "Agent làm lô (24/10/2026): đã sửa chữ của công cụ theo đề nghị của lượt 1 (src/scripts/luyen-hoa-bieu.js, hàm meo(n, loai); tests/hoa-bieu.test.mjs giữ chữ này). Chữ cũ (circle.js cũ): \"Chưa đúng. Mẹo: dấu giáng áp chót chính là tên giọng (trừ Fa trưởng có 1 dấu giáng).\", hiện cả khi hỏi giọng thứ mà không nói giọng trưởng. Chữ mới nói rõ giọng trưởng, và khi hỏi giọng thứ thì thêm bước sang giọng thứ song song, như mục \"Đọc hóa biểu ra tên giọng\" của bài 8. Giọng thứ song song: OMT Minor Scales: \"Each major key signature has a corresponding relative minor key signature whose tonic is three half steps below the relative major's tonic.\" Lượt 1: cùng vấn đề với câu trước. Quy tắc đúng cho giọng trưởng: OMT Major Scales: \"In flat key signatures, the second-to-last flat is the tonic\"; MT21C 2.3: \"The second-to-last flat is the key\"; UMass Unit 7: \"The only flat key for which this shortcut doesn't work is F major, which has only one flat.\" Chữ trong src/scripts/luyen-hoa-bieu.js (meo) hiện cả khi câu hỏi là giọng thứ, lúc đó \"tên giọng\" dễ bị hiểu là tên giọng thứ (ví dụ 3 dấu giáng, hỏi giọng thứ: dấu áp chót Mi♭ là giọng trưởng Mi♭, không phải giọng thứ cần tìm là Đô thứ). Đề nghị: \"... dấu giáng áp chót chính là tên giọng trưởng (trừ Fa trưởng có 1 dấu giáng); giọng thứ song song thấp hơn 3 nửa cung.\""
