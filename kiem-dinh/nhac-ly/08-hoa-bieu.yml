      - omt-intervals
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "If you continue counter-clockwise from C major, flat key signatures appear, each subsequent key signature adding one more flat." FFF 10.2: "Moving counterclockwise, each subsequent key is built on scale degree 4̂ of the one before it and has one additional flat in its key signature" (đi lên từ chủ âm đến bậc 4 = quãng 4 đúng); OMT Intervals: 5 nửa cung = P4.'
