    cau: 'Quiz: bước đầu là nghe không nhìn nhạc; nhận ra chuyển giọng bằng dấu hóa bất thường lặp lại; Fa♯ ở ô 6 thuộc D7 dẫn về Sol'
    loai: quy-tac
