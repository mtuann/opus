ghi_chu: 'Bảng 11 ô đối chiếu từng ô với Mutopia BWV 846: ô 1-7 và 9-11 đúng, ô 8 ghi chú đã sửa. Mutopia ghi source "Unknown": chưa chắc về số ô theo ấn bản IMSLP cụ thể; ket_qua "dung" ở đây dựa trên thứ tự nốt. Prelude dài 35 ô, âm nền át ô 24-31.'
nguon:
  - id: omt-ton
    bac: 2
    ten: Open Music Theory, Tonicization (Lavengood, Peterson)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/tonicization/
  - id: omt-ext
    bac: 2
    ten: Open Music Theory, Extended Tonicization and Modulation to Closely Related Keys (Peterson)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/extended-tonicization-and-modulation-to-closely-related-keys/
  - id: omt-fb
    bac: 2
    ten: Open Music Theory, Figured Bass and Roman Numerals with Figures (Hamm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/
  - id: mut-846
    bac: 1
    ten: Mutopia Project, Bach BWV 846 Prelude in C (bản gõ lại LilyPond; trường source ghi "Unknown", nên chỉ đối chiếu thứ tự nốt)
    link: https://www.mutopiaproject.org/cgibin/make-table.cgi?searchingfor=BWV+846
  - id: imslp-wtc
    bac: 1
    ten: IMSLP, Das wohltemperierte Klavier I, BWV 846-869
    link: https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)
  - id: imslp-545
    bac: 1
    ten: IMSLP, Piano Sonata No.16, K.545 (Mozart)
    link: https://imslp.org/wiki/Piano_Sonata_No.16,_K.545_(Mozart,_Wolfgang_Amadeus)
  - id: imslp-op28
    bac: 1
    ten: IMSLP, Preludes, Op.28 (Chopin)
    link: https://imslp.org/wiki/Preludes,_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)
  - id: mut-op28
    bac: 1
    ten: Mutopia Project, Chopin Prelude Op. 28 No. 4 (Peters 1879)
    link: https://www.mutopiaproject.org/cgibin/make-table.cgi?searchingfor=Chopin+Prelude+Op+28
  - id: imslp-kind
    bac: 1
    ten: IMSLP, Kinderszenen, Op.15 (Schumann)
    link: https://imslp.org/wiki/Kinderszenen,_Op.15_(Schumann,_Robert)
nhan_dinh:
  - id: n1
    cau: Phân tích là ghép giọng, hợp âm, kết, hình thức vào một bản nhạc thật; mục đích là nghe sâu hơn
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời mở bài, không phải nhận định về sự kiện.
  - id: n2
    cau: 'Bước 1 của quy trình: nghe trước ít nhất hai lần, không nhìn bản nhạc'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên phương pháp của site.
  - id: n3
    cau: 'Bước 2: xác định giọng chính từ hóa biểu và hợp âm cuối, số chỉ nhịp, tốc độ, biên chế'
    loai: khuyen-tap
    nguon:
      - omt-fb
      - omt-ton
    ket_qua: dung
    ghi_chu: OMT dùng hóa biểu và hợp âm kết để xác định giọng.
  - id: n4
    cau: 'Bước 3: chia hình thức lớn bằng cách tìm chỗ kết và chỗ chủ đề quay lại'
    loai: khuyen-tap
    nguon:
      - omt-ton
      - omt-ext
    ket_qua: dung
    ghi_chu: Nguồn gián tiếp (OMT bàn về tonicization và chuyển giọng); phương pháp chung.
  - id: n5
    cau: 'Bước 4: dấu hóa bất thường lặp lại là dấu hiệu chuyển giọng'
    loai: quy-tac
    nguon:
      - omt-ton
      - omt-ext
    ket_qua: dung
  - id: n6
    cau: 'Bước 5: ghi số La Mã dưới bè trầm ở đầu, cuối mỗi phần và các kết'
    loai: khuyen-tap
    nguon:
      - omt-fb
      - omt-ton
    ket_qua: dung
  - id: n7
    cau: 'Liên kết: /opus/hinh-thuc/, bài 19, bài học Prelude Đô trưởng (#theo-doi-khi-nghe), /opus/hinh-thuc/sonata/, /opus/tai-lieu-tham-khao/'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bài 19 đã có. Chưa chuyển: (1) hinh-thuc/index, cần giữ phần giới thiệu các hình thức; (2) piano/tac-pham/bach-prelude-do, cần giữ mục "## Theo dõi khi nghe" (id theo-doi-khi-nghe) với bảng sự kiện ô 1–4, 5–11, 12, 14, 19–20, 22–24, 24–31 (âm nền át), 32, 33–34, 35 (đã đối chiếu khớp bảng ở trang 26); (3) hinh-thuc/sonata, cần giữ mục "Đi qua một tác phẩm: Mozart Sonata K. 545" (bảng hình thức); (4) tai-lieu-tham-khao, cần giữ danh sách nguồn.'
  - id: n8
    cau: Prelude cung Đô trưởng BWV 846 là bản nhạc có thể mở trên IMSLP
    loai: lich-su
    nguon:
      - imslp-wtc
    ket_qua: dung
    ghi_chu: BWV 846 là Prelude and Fugue C major, WTC I.
  - id: n9
    cau: Mỗi ô nhịp của Prelude là một hợp âm rải (một hợp âm cho mỗi ô)
    loai: cau-truc
    nguon:
      - mut-846
      - imslp-wtc
    ket_qua: dung
    ghi_chu: 'Đối chiếu Mutopia: ô 1-35 mỗi ô lặp một khuôn rải 16 nốt móc kép.'
  - id: n10
    cau: 'Ô 1: Đô-Mi-Sol-Đô-Mi, hợp âm I (Đô trưởng)'
    loai: cau-truc
    nguon:
      - mut-846
    ket_qua: dung
    ghi_chu: Cao độ thật C4 E4 G4 C5 E5; tay phải đàn thật cao hơn một quãng tám so với khuông minh họa.
  - id: n11
    cau: 'Ô 2: Đô-Rê-La-Rê-Fa, Dm7/Đô, ii4/2 (bass giữ Đô, Đô là nốt 7)'
    loai: cau-truc
    nguon:
      - mut-846
      - omt-fb
    ket_qua: dung
  - id: n12
    cau: 'Ô 3: Si-Rê-Sol-Rê-Fa, G7/Si, V6/5'
    loai: cau-truc
    nguon:
      - mut-846
      - omt-fb
    ket_qua: dung
  - id: n13
    cau: 'Ô 4: giống ô 1 (I); câu đầu I-ii-V-I'
    loai: cau-truc
    nguon:
      - mut-846
    ket_qua: dung
  - id: n14
    cau: 'Ô 5: Đô-Mi-La-Mi-La, Am/Đô, vi6'
    loai: cau-truc
    nguon:
      - mut-846
      - omt-fb
    ket_qua: dung
  - id: n15
    cau: 'Ô 6: Đô-Rê-Fa♯-La-Rê, D7/Đô, V4/2 của V; Fa♯ xuất hiện, át phụ'
    loai: cau-truc
    nguon:
      - mut-846
      - omt-ton
      - omt-fb
    ket_qua: dung
    ghi_chu: Số 4/2 là đảo 3 của hợp âm bảy (bass là nốt 7).
  - id: n16
    cau: 'Ô 7: Si-Rê-Sol-Rê-Sol, G/Si, V6'
    loai: cau-truc
    nguon:
      - mut-846
      - omt-fb
    ket_qua: dung
  - id: n17
    cau: 'Ô 8: Si-Đô-Mi-Sol-Đô, Cmaj7/Si; bass vẫn là Si (nốt 7 của Cmaj7)'
    loai: cau-truc
    nguon:
      - mut-846
    ket_qua: da-sua
    ghi_chu: 'Câu gốc "Bass tiếp tục đi xuống" sai: bass ô 7 và ô 8 đều là Si.'
  - id: n18
    cau: 'Ô 9: La-Đô-Mi-Sol-Đô, Am7'
    loai: cau-truc
    nguon:
      - mut-846
    ket_qua: dung
  - id: n19
    cau: 'Ô 10: Rê-La-Rê-Fa♯-Đô, D7, V7 của V'
    loai: cau-truc
    nguon:
      - mut-846
      - omt-ton
    ket_qua: dung
  - id: n20
    cau: 'Ô 11: Sol-Si-Rê-Sol-Si, G; chủ âm hóa Sol trưởng'
    loai: cau-truc
    nguon:
      - mut-846
      - omt-ton
      - omt-ext
    ket_qua: dung
    ghi_chu: 'OMT: tonicization là khi một hợp âm trưởng/thứ được nghe tạm thời như chủ âm; ở đây ô 11 là G sau V7/V; trang dùng "chủ âm hóa", chấp nhận.'
  - id: n21
    cau: Chỉ trong 11 ô nhịp Bach đi từ Đô trưởng sang vùng Sol trưởng (giọng át) bằng át phụ D7 có Fa♯
    loai: cau-truc
    nguon:
      - mut-846
      - omt-ton
      - omt-ext
    ket_qua: dung
  - id: n22
    cau: Từ ô 6 đến ô 9, bè trầm đi xuống từng bước Đô-Si-La
    loai: cau-truc
    nguon:
      - mut-846
    ket_qua: da-sua
    ghi_chu: Bản gốc nói bass đi xuống dần liên tục; thực tế ô 6 Đô, ô 7-8 Si, ô 9 La. Cũng bỏ nhận xét "một kỹ thuật làm âm nhạc trôi chảy" (không nguồn).
  - id: n23
    cau: Phần sau của Prelude đưa nhạc về Đô trưởng qua một âm nền át dài
    loai: cau-truc
    nguon:
      - mut-846
      - imslp-wtc
    ket_qua: dung
    ghi_chu: 'Mutopia: Sol trầm giữ ô 24-31 (tám ô), ô 32 về Đô.'
  - id: n24
    cau: Mozart Sonata K. 545 chương 1 là bản đáng phân tích hình thức sonata
    loai: lich-su
    nguon:
      - imslp-545
    ket_qua: dung
    ghi_chu: K. 545 viết cho Đô trưởng, 1788 (IMSLP).
  - id: n25
    cau: 'Thánh ca bốn bè của Bach: gọi tên hợp âm, kết, nốt treo, nốt lướt'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Gợi ý bài tập.
  - id: n26
    cau: 'Schumann Träumerei (Kinderszenen Op. 15 số 7): tìm át phụ và hợp âm mượn'
    loai: khuyen-tap
    nguon:
      - imslp-kind
    ket_qua: dung
    ghi_chu: Träumerei là số 7; bài có chủ âm hóa và hòa âm màu sắc.
  - id: n27
    cau: 'Chopin Prélude Op. 28 số 4 (Mi thứ): bè trầm đi xuống gần như từng nửa cung Sol-Fa♯-Fa-Mi-Rê♯-Rê-Đô-Si'
    loai: cau-truc
    nguon:
      - imslp-op28
      - mut-op28
    ket_qua: da-sua
    ghi_chu: Bản gốc ghi "từng nửa cung"; chuỗi có Rê-Đô (cung nguyên) nên đổi thành "gần như".
  - id: n28
    cau: Op. 28 số 4 cung Mi thứ
    loai: ten
    nguon:
      - imslp-op28
    ket_qua: dung
    ghi_chu: 'IMSLP: No. 4 in E minor, Largo.'
  - id: n29
    cau: 'Quiz: bước đầu là nghe không nhìn nhạc; nhận ra chuyển giọng bằng dấu hóa bất thường lặp lại; Fa♯ ở ô 6 thuộc D7 dẫn về Sol'
    loai: quy-tac
    nguon:
      - mut-846
      - omt-ton
    ket_qua: dung
    ghi_chu: Giải thích không phụ thuộc vị trí đáp án.
khuong_nhac:
  - khoi: 1
    loai: trich-doan
    kiem:
      - cu-phap
      - nhip
      - doi-chieu-an-ban
    ket_qua: dung
    ghi_chu: 'Đối chiếu Mutopia BWV 846, ô 1-4: bản Mutopia ghi source "Unknown" nên chưa gắn được với ấn bản IMSLP cụ thể; thứ tự nốt đúng (ô 1: C E G c e, ô 2: C D A d f, ô 3: B, D G d f, ô 4 như ô 1). Khuông minh họa viết mỗi ô 16 nốt móc kép (nhắc lại hai lần khuôn 8 nốt), khớp bản gốc là hai lần nhắc; cao độ thật của tay phải cao hơn một quãng tám so với khuông này (Mutopia dùng \transpose c c''). Chưa chắc: số ô nhịp theo ấn bản nào.'
doi_chu:
  - cu: Bass tiếp tục đi xuống
    moi: Bass vẫn là Si (nốt 7 của Cmaj7)
    ly_do: "n17 (da-sua): Mutopia ô 7 và ô 8 đều có Si ở bass."
  - cu: "Kết luận: chỉ trong 11 ô nhịp, Bach đi từ Đô trưởng sang vùng Sol trưởng (giọng át), bằng át phụ D7 có nốt Fa♯. Bè trầm đi xuống dần từng bước (Đô – Si – La…), một kỹ thuật làm âm nhạc trôi chảy liên tục. Phần sau của prelude sẽ đưa nhạc trở về Đô trưởng qua một âm nền át dài."
    moi: "Kết luận: chỉ trong 11 ô nhịp, Bach đi từ Đô trưởng sang vùng Sol trưởng (giọng át), bằng át phụ D7 có nốt Fa♯. Từ ô 6 đến ô 9, bè trầm đi xuống từng bước (Đô – Si – La). Phần sau của prelude sẽ đưa nhạc trở về Đô trưởng qua một âm nền át dài."
    ly_do: 'n22 (da-sua): bass chỉ đi Đô (ô 6), Si (ô 7-8), La (ô 9); vế "một kỹ thuật làm âm nhạc trôi chảy" là nhận xét không nguồn nên bỏ (da-bo một phần).'
  - cu: "Bè trầm đi xuống từng nửa cung: hợp âm thay đổi thế nào?"
    moi: "Bè trầm đi xuống gần như từng nửa cung (Sol – Fa♯ – Fa – Mi – Rê♯ – Rê – Đô – Si): hợp âm thay đổi thế nào?"
    ly_do: 'n27 (da-sua): chuỗi nốt này có bước Rê-Đô là cung nguyên, nên "từng nửa cung" không đúng hẳn; ghi "gần như" và liệt kê nốt. Chưa chắc: Mutopia Peters 1879 là bản gõ lại, đối chiếu bar-by-bar chưa làm cho toàn bài.'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Tonicization; Extended Tonicization and Modulation to Closely Related Keys; Figured Bass and Roman Numerals with Figures."
      - "Bản nhạc: Bach, Das wohltemperierte Klavier I (BWV 846): IMSLP, Mutopia Project (bản gõ lại, ô nhịp 1–11 và bè trầm); Mozart, Sonata K. 545; Chopin, Preludes Op. 28 (Mutopia); Schumann, Kinderszenen Op. 15 (Mutopia)."
    ly_do: 'Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net).'
