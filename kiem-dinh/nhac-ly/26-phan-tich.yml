    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Gợi ý bài tập.
  - id: n26
    cau: 'Schumann, Träumerei (Kinderszenen Op. 15 số 7) có át phụ, nên dùng được để tập tìm át phụ.'
    loai: cau-truc
    nguon:
      - mut-traum
      - imslp-kind
    ket_qua: da-sua
    ghi_chu: 'Träumerei là số 7; bài có chủ âm hóa và hòa âm màu sắc. Review D3-gom (soát nhãn): gợi ý "tìm các át phụ và hợp âm mượn" ngầm khẳng định bài có cả hai: cần nguồn, đổi loai khuyen-tap thành cau-truc. Review đọc tệp LilyPond Mutopia (mut-traum): Fa trưởng; ở câu đầu có Đô♯ (bè trầm, trên nền La với Sol: hợp âm La bảy) rồi hợp âm Rê thứ ngay sau (V7/ii → ii), và Fa♯ ở ô 7: có át phụ. Không xác định chắc được hợp âm mượn từ tệp (La♭, Mi♭ ở ô 7 có thể thuộc hợp âm bảy giảm), nên bỏ "và hợp âm mượn". Chữ cũ: "Tìm các át phụ và hợp âm mượn"; chữ mới: "Tìm các át phụ".'
    luot_2: dung
    luot_2_nguon: [ "https://createmusic.wordpress.com/2019/10/18/harmonic-analysis-traumerei-op-15-no-7-r-schumann/", "https://www.musillection.com/2021/06/robert-schumann-traumerei-or-dreaming-scenes-from-childhood.html" ]
    luot_2_ghi_chu: Phân tích hòa âm Träumerei có hợp âm át phụ và các chuyển hướng tạm sang Rê thứ, Sol thứ, Si giáng trưởng. Chưa đối chiếu từng nhịp trong bản nhạc nên chỉ chắc ở mức này.
  - id: n27
    cau: 'Chopin Prélude Op. 28 số 4 (Mi thứ): bè trầm đi xuống gần như từng nửa cung Sol-Fa♯-Fa-Mi-Rê♯-Rê-Đô-Si'
    loai: cau-truc
    nguon:
      - imslp-op28
      - mut-op28
    ket_qua: da-sua
    ghi_chu: 'Bản gốc ghi "từng nửa cung"; chuỗi có Rê-Đô (cung nguyên) nên đổi thành "gần như". Review D3-gom: lượt 2 đối chiếu Mutopia (Peters); chữ mới "gần như từng nửa cung" có trên trang (bảng tác phẩm tiếp theo).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-4/Chop-28-4.ly", "https://imslp.org/wiki/Preludes,_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)" ]
    luot_2_ghi_chu: "Mutopia (Peters): hợp âm tay trái có nốt thấp nhất Sol, Fa♯, Fa, Mi, Rê♯, Rê, Đô, Si qua ô 1-10; từ Rê xuống Đô là cung nguyên nên 'gần như' đúng. Máy đọc tóm tắt, cao độ tuyệt đối chưa chắc, tên nốt đúng."
