  - id: n3
    cau: 'Bước 2: xác định giọng chính (nhìn hóa biểu, nốt đầu và nốt kết thúc), số chỉ nhịp, tốc độ, biên chế'
    loai: quy-tac
    nguon:
      - omt-minor
      - omt-ton
    ket_qua: da-sua
    ghi_chu: 'OMT dùng hóa biểu và hợp âm kết để xác định giọng. Review D3-gom (thống nhất giữa các bài, soát nhãn): bài 8 đã khóa (review D3-L1) bỏ "hợp âm cuối" khỏi cách nhận giọng, vì bản nhạc giọng thứ có thể kết bằng hợp âm trưởng (quãng 3 Picardy, cũng nói ở bài 23), và dùng nốt đầu, nốt cuối theo OMT Minor Scales: "pieces often start and end on the tonic". Chữ cũ: "giọng chính (nhìn hóa biểu và hợp âm cuối)"; chữ mới: "giọng chính (nhìn hóa biểu, nốt đầu và nốt kết thúc)". Câu nêu cách xác định giọng là quy tắc cần nguồn: đổi loai khuyen-tap thành quy-tac. Mục Nguồn thêm OMT Minor Scales.'
    luot_2: dung
    luot_2_nguon: [ "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/10-the-circle-of-fifths-2/" ]
    luot_2_ghi_chu: Cách xác định giọng từ hóa biểu và nốt đầu, cuối là thực hành chuẩn; nguồn chỉ cho phần hóa biểu.
