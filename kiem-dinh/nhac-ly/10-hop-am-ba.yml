nhan_dinh:
  - id: n1
    cau: Hợp âm là ba nốt trở lên vang lên cùng lúc.
    loai: dinh-nghia
    nguon: &a1
      - omt-triads
    ket_qua: dung
    ghi_chu: 'OMT, Triads (bảng thuật ngữ): "A chord is any combination of three or more pitch classes that sound simultaneously."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n2
    cau: Hợp âm ba (triad) là hợp âm có ba nốt xếp chồng quãng 3.
    loai: dinh-nghia
    nguon: &a2
      - omt-triads
      - fff-triads
    ket_qua: dung
    ghi_chu: 'OMT, Triads (bảng thuật ngữ): "A three-note chord whose pitch classes can be arranged as thirds." Mount 13: "a type of chord made up of three unique pitch classes", xếp chồng quãng 3.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n3
    cau: Hợp âm ba là loại hợp âm ít nốt nhất.
    loai: dinh-nghia
    nguon: *a1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hợp âm cơ bản nhất là hợp âm ba (triad)". Chữ mới: "Hợp âm ít nốt nhất là hợp âm ba (triad)". Lý do: "cơ bản nhất" là nhận xét không kiểm được; "ít nốt nhất" suy ra từ định nghĩa: hợp âm có từ ba nốt trở lên (n1) và hợp âm ba có đúng ba nốt. Sửa cả đoạn mở đầu lẫn mô tả (description) của trang. Review D3-gom: chữ mới có ở đoạn mở đầu và description; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n4
    cau: "Nốt gốc (root): nốt dưới cùng khi xếp chồng quãng 3, đặt tên cho hợp âm."
    loai: dinh-nghia
    nguon:
      - omt-triads
      - omt-chord-symbols
    ket_qua: dung
    ghi_chu: 'OMT, Triads (bảng thuật ngữ): root "The lowest note of a triad or seventh chord when the chord is stacked in thirds." OMT, Inversion: "the root of the chord is always A, regardless of its inversion and bass note"; OMT, Chord Symbols: ký hiệu hợp âm mang tên nốt gốc (C, Cm…). Review D3-gom: bỏ id "omt-inversion" khỏi nguon (không có trong danh sách nguồn của hồ sơ); định nghĩa đủ dựa vào OMT Triads (bảng thuật ngữ, root) và Chord Symbols; hai lượt cùng dung.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n5
    cau: "Nốt ba (third): cách nốt gốc quãng 3."
    loai: dinh-nghia
    nguon: *a2
    ket_qua: dung
    ghi_chu: 'OMT, Triads: nốt giữa "called the third (a generic third above the root)". Mount 13: các nốt còn lại đặt tên theo quãng so với nốt gốc.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n6
    cau: "Nốt năm (fifth): cách nốt gốc quãng 5."
    loai: dinh-nghia
    nguon: *a2
    ket_qua: dung
    ghi_chu: "OMT, Triads: nốt trên cùng là quãng 5 trên nốt gốc (generic fifth)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n7
    cau: "Ví dụ hợp âm Đô trưởng: Đô – Mi – Sol."
    loai: so-lieu
    nguon: *a2
    ket_qua: dung
    ghi_chu: "C E G: Đô → Mi quãng 3 trưởng, Mi → Sol quãng 3 thứ, Đô → Sol quãng 5 đúng (OMT, Triads: major triad = third trưởng, fifth đúng)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: Khớp nguồn.
