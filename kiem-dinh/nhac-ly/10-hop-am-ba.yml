      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Trang hợp âm ba (tầng lõi). Nguồn chính: Open Music Theory (OMT), Triads, Roman Numerals, Chord Symbols; đối chiếu Mount (FFF) ch. 13 (xếp chồng quãng 3 cho từng loại), 16 (gam thứ hòa âm), 17 (vii°). WebFetch ngày 27/10/2026 (trả bản tóm tắt chữ, không phải HTML thô; chữ trích đã hỏi lại nhiều chiều). Chỗ sửa trang: mô tả và đoạn mở đầu ("cơ bản nhất" thành "ít nốt nhất"); cột Cảm giác của bảng bốn loại theo OMT Triads; mục giọng thứ (gam tự nhiên, riêng V và vii° nâng bậc 7; ghi chú về III+); câu hỏi kiểm tra cuối trang; mục Nguồn. Mục doi_chu tự viết (không build được); người giao chạy lại so-chu --doi-chu để chuẩn hóa dấu nháy. Chưa chắc: không có. Nguồn không nói thẳng: bảng La thứ suy ra từ định nghĩa chất lượng hợp âm của OMT/Mount và gam La thứ tự nhiên/hòa âm (nguồn không liệt kê đủ bảy hợp âm của giọng thứ). Câu về site: các trang chưa chuyển (luyen-tap/ban-phim, luyen-tai/nghe-hop-am, luyen-tap/xay-hop-am, piano/hop-am-rai) kiểm trên ../opus-zero/docs/ và JavaScript cũ. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): root (nốt gốc), third, fifth (nốt ba, nốt năm), major/minor/diminished/augmented triad (hợp âm trưởng, thứ, giảm, tăng), Roman numeral (số La Mã), harmonic minor (gam thứ hòa âm), natural minor (gam thứ tự nhiên); đã có: chord, triad, leading tone.'
