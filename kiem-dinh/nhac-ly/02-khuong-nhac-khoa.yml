ghi_chu: "Bài nhạc lý 2 (khuông, khóa Sol, khóa Fa, dòng kẻ phụ, khuông kép). Nguồn chính: Open Music Theory (OMT), mở từng chương bằng curl ngày 24/10/2026 (WebFetch trả 403); bổ sung MT21C (Puget Sound) và Dolmetsch Online bài 1 (đánh số dòng và khe từ dưới lên, cách nhớ tên nốt), bài 29 (guitar). Bản phổ Beethoven (Breitkopf & Härtel, khoảng 1864) dùng để xác nhận contrabass viết ở khóa Fa (n14). Sửa chữ ở lượt 1: n26 (bỏ \"giúp đọc nhanh hơn hẳn so với đếm dòng\", không kiểm được; thay bằng cách làm \"đếm từ nốt mốc gần nhất\", khớp trang cũ luyen-tap/doc-not.md); mục ## Nguồn (thay link chung bằng link từng chương đã dùng, bỏ musictheory.net vì chưa đối chiếu nội dung). Lượt 1 đề nghị thu hẹp n8 (\"giọng nữ\" thành \"giọng nữ cao (soprano)\"); agent làm lô giữ \"giọng nữ\", vì OMT Chords in SATB Style viết cả soprano lẫn alto ở khóa Sol (xem n8). Không tính là nhận định: tiêu đề mục; câu hỏi của phần Bài tập (chỉ tính câu trả lời trong khối thu gọn); chữ \"rất dễ nhớ\" sau \"FACE\" (ý kiến). Mẹo nhớ tiếng Anh (n17, n18): chữ cái đầu của từng cụm khớp tên nốt đã kiểm; cụm \"Every Good Boy Does Fine\", \"Good Boys Do Fine Always\", \"All Cows Eat Grass\" có ở Dolmetsch bài 1; OMT dùng \"Every Good Bird Does Fly\", \"Good Bikes Don't Fall Apart\", \"All Cows Eat Grass\". Thuật ngữ tiếng Việt chưa có trong src/data/thuat-ngu.yml, ghi cho D3-L5: \"khuông kép\" (grand staff), \"dòng kẻ phụ\" đã có (ledger line), \"khe\" (space), \"nốt mốc\" (landmark note), \"giọng nam trầm\" (bass; trang giữ \"giọng nữ\", xem n8). Đối chiếu \"Giáo trình môn Lý thuyết âm nhạc cơ bản\" (tệp PDF https://novaspro.vn/upload/files/giao_trinh_mon_ly_thuyet_am_nhac_co_ban.pdf; không ghi tác giả, bậc 3, chỉ để chứng thực cách gọi ở Việt Nam): có \"khe\" (\"Khoảng cách giữa hai dòng kẻ liền nhau được gọi là khe\", 5 dòng kẻ và 4 khe đánh số từ dưới lên) và \"dòng kẻ phụ\"; không thấy \"khuông kép\" hay \"nốt mốc\" (chưa tìm được nguồn tiếng Việt cho hai cách gọi này); thay cho \"khuông kép\", giáo trình đó viết \"dấu gộp (accolade)\": \"Dấu gộp cho hai khuông nhạc thường sử dụng để viết cho tác phẩm piano\"."
