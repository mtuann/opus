    cau: 'Câu hỏi: "Khóa Sol đánh dấu nốt Sol ở dòng nào?" Đáp án đúng "Dòng 2"; "Dòng 1", "Dòng 3" sai; giải thích "Nét xoắn của khóa Sol ôm lấy dòng 2." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-clefs
    ket_qua: dung
    ghi_chu: Dòng 2 (n7). Dòng 1 là E4, dòng 3 là B4 (n10) nên hai lựa chọn kia sai. Giải thích khớp n7.
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "Khóa Sol ôm dòng 2 (G4): đáp án 'Dòng 2' đúng."
  - id: n36
    cau: 'Câu hỏi: "Các nốt trong khe của khóa Sol (từ dưới lên) là gì?" Đáp án đúng "Fa – La – Đô – Mi"; "Mi – Sol – Si – Rê" và "La – Đô – Mi – Sol" sai; giải thích "Trong tiếng Anh ghép thành chữ FACE." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Fa – La – Đô – Mi là khe khóa Sol (n11), ghép thành FACE (n12). "Mi – Sol – Si – Rê" là bốn nốt đầu trên các dòng khóa Sol (n10), không phải khe; "La – Đô – Mi – Sol" là khe khóa Fa (n16): hai lựa chọn sai thật sự sai.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: Khe khóa Sol F-A-C-E (face) đúng; Mi-Sol-Si-Rê là dòng khóa Sol, La-Đô-Mi-Sol là khe khóa Fa nên sai.
  - id: n37
    cau: 'Câu hỏi: "Khóa Fa đánh dấu nốt Fa ở dòng nào?" Đáp án đúng "Dòng 4"; "Dòng 2", "Dòng 3" sai; giải thích "Hai chấm của khóa Fa nằm hai bên dòng 4." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-clefs
    ket_qua: dung
    ghi_chu: Dòng 4 (n13); dòng 2 là B2, dòng 3 là D3 (n15). Giải thích khớp n13.
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: Hai chấm khóa Fa ở hai bên dòng 4 (F3) đúng.
  - id: n38
    cau: 'Câu hỏi: "Đô giữa nằm ở đâu trên khuông khóa Sol?" Đáp án đúng "Dòng kẻ phụ ngay dưới khuông"; "Dòng 1", "Khe 1" sai; giải thích "Đô giữa cũng là dòng kẻ phụ ngay trên khuông khóa Fa." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-keyboard
      - omt-aspn
    ket_qua: dung
    ghi_chu: "Đô giữa ở dòng kẻ phụ ngay dưới khuông khóa Sol (n21). Dòng 1 là E4 và khe 1 là F4 (n10, n11): sai. Giải thích khớp n21."
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/ ]
    luot_2_ghi_chu: Đô giữa ở dòng kẻ phụ ngay dưới khuông khóa Sol (và ngay trên khuông khóa Fa).
  - id: n39
    cau: 'Câu hỏi: "Các nốt trên dòng của khóa Fa (từ dưới lên) là gì?" Đáp án đúng "Sol – Si – Rê – Fa – La"; "Mi – Sol – Si – Rê – Fa" và "La – Đô – Mi – Sol – Si" sai; giải thích "Good Boys Do Fine Always." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Sol – Si – Rê – Fa – La là dòng khóa Fa (n15). "Mi – Sol – Si – Rê – Fa" là dòng khóa Sol (n10); "La – Đô – Mi – Sol – Si" không phải dòng của khóa nào (A C E G là khe khóa Fa, n16, cộng thêm Si): sai. Giải thích: chữ cái đầu G B D F A khớp (n18).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: Dòng khóa Fa G-B-D-F-A đúng; 'Good Boys Do Fine Always' là mẹo phổ biến (Dolmetsch), chữ cái khớp.
  - id: n40
    cau: "Hình khuông kép nối phím (sau tip \"Trên phím đàn\" của mục \"Khuông kép\"): khuông khóa Sol ở trên, khóa Fa ở dưới, nối bằng nét dọc ở đầu; dòng đánh số 1–5 từ dưới lên ở mỗi khuông; Sol4 trên dòng 2 khóa Sol và Fa3 trên dòng 4 khóa Fa (hai dòng này tô màu); Đô4 trên dòng kẻ phụ ngay dưới khuông khóa Sol và trên dòng kẻ phụ ngay trên khuông khóa Fa; mỗi nốt mốc nối bằng nét đứt xuống đúng phím của nó trên bàn phím Mi3–La4 (phím tô, nhãn \"Fa3 / dòng 4 / khóa Fa\", \"Đô4 / Đô giữa\", \"Sol4 / dòng 2 / khóa Sol\")."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 06/11/2026) và module dựng hình veKhuongKepPhim (src/scripts/ve-khuong-phim.js; kiểm thử tests/khuong-phim.test.mjs, tests/trinh-duyet/kiem-khuong-phim.mjs: nốt đúng dòng, tâm nốt thẳng tâm phím dưới 1 px). Khớp chữ trang: dòng đếm từ dưới lên, dòng 1 thấp nhất; khóa Sol ôm dòng 2, nốt trên dòng 2 là Sol (G4); khóa Fa có hai chấm hai bên dòng 4, nốt trên dòng 4 là Fa (F3); Đô giữa (C4) trên một dòng kẻ phụ ngay dưới khuông khóa Sol và cũng là một dòng kẻ phụ ngay trên khuông khóa Fa; khuông kép: khóa Sol trên, khóa Fa dưới, nối bằng dấu ngoặc (hình vẽ nét dọc); nốt mốc Fa3, Sol4 của tip \"Trên phím đàn\". Khóa và đầu nốt dùng ký hiệu chung của ve.js (lấy từ abcjs), đặt như veNotDon. Bàn phím Mi3–La4 dựng bằng veBanPhim. Soát hình 2B (gộp review và kiểm mẫu): đối chiếu SVG trong dist/ (npm run build:xem, 07/11/2026; aria-label của hình và ảnh 360/1280 px) với chữ trang: Sol4 trên dòng 2 khóa Sol, Fa3 trên dòng 4 khóa Fa (hai dòng tô màu nhựa thông), Đô4 trên dòng kẻ phụ ngay dưới khuông khóa Sol và ngay trên khuông khóa Fa, số dòng 1–5 từ dưới lên ở mỗi khuông, nét dọc nối hai khuông, nét đứt từ mỗi nốt xuống đúng phím Fa3, Đô4, Sol4 (tô) trên bàn phím Mi3–La4, nhãn ba dòng như câu; tests/khuong-phim.test.mjs kiểm vị trí dòng và tâm phím. Khớp mục Khuông nhạc (đếm từ dưới lên), Khóa Sol (nét xoắn ôm dòng 2, Sol G4), Khóa Fa (hai chấm hai bên dòng 4, Fa F3), Dòng kẻ phụ (Đô giữa C4) và tip Trên phím đàn (nốt mốc Fa3, Sol4). aria-label của hình chỉ nói lại các ý ấy. Kết quả: dung."
    review: dung
  - id: n41
    cau: "Chú thích hình: \"Ba nốt mốc trên khuông kép và trên phím đàn: Fa3 trên dòng 4 khóa Fa, Đô giữa (Đô4) trên dòng kẻ phụ giữa hai khuông, Sol4 trên dòng 2 khóa Sol. Dòng đánh số từ dưới lên.\""
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Chú thích là chữ thật trong figcaption (data-sinh, hinhKhuongKepPhim của src/scripts/ve-khuong-phim.js), nói lại chữ trang (mục \"Khuông nhạc\", \"Khóa Sol\", \"Khóa Fa\", \"Dòng kẻ phụ\", tip \"Trên phím đàn\"). Tên đọc được của hình (aria-label) nói cùng điều. Soát hình 2B (gộp review và kiểm mẫu): figcaption trong dist/nhac-ly/02-khuong-nhac-khoa/index.html đúng chữ câu; mọi ý có ở trang (mục Dòng kẻ phụ, Khuông kép: Đô giữa nằm giữa hai khuông, tip Trên phím đàn, Khóa Sol, Khóa Fa, dòng đếm từ dưới lên). Kết quả: dung."
    review: dung
