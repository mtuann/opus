      - omt-clefs
      - dol1
      - mt21c-notation
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "As an "F" clef, the bass clef shows which line of the staff is F₃ by surrounding it with two dots." OMT Reading Clefs: "the dot of the bass clef begins on the F line (the second line from the top)" (dòng thứ hai từ trên xuống = dòng 4). Dolmetsch bài 1: "is also called the F clef or F4 because the two dots in the clef symbol lie above and below the horizontal line (4)". MT21C 1.2 Notation: "The F clef, when placed on a five-line staff with the dots surrounding the second line from the top, creates the bass clef."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: "OMT: khóa Fa bao dòng F3 bằng hai chấm, dòng F là dòng thứ hai từ trên (dòng 4); Dolmetsch: hai chấm nằm hai bên dòng 4."
