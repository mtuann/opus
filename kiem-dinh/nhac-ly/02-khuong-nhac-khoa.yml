    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs: "Remembering that these letter names spell the word “face” may make identifying these spaces easier." Dolmetsch bài 1: "The four inner spaces of the treble clef read upwards spell the word FACE"'
