nhan_dinh:
  - id: n1
    cau: Khuông nhạc gồm 5 dòng kẻ song song và 4 khe giữa chúng.
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-clefs
      - dol1
      - mt21c-notation
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "A staff consists of five horizontal lines, evenly spaced, and each note is placed on the line or space that corresponds to its pitch"; OMT Reading Clefs nêu bốn khe của khóa Sol (F, A, C, E). Dolmetsch bài 1: "today the most common staff format has five lines separated by four spaces". MT21C 1.2 Notation: "Notes are written on a five-line staff."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: "OMT: khuông có năm dòng kẻ ngang cách đều; Dolmetsch Online: năm dòng, bốn khe."
  - id: n2
    cau: "Dòng và khe được đếm từ dưới lên: dòng 1 là dòng thấp nhất."
    loai: quy-tac
    nguon:
      - dol1
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Dolmetsch bài 1: "When numbering the lines, it is a widely used convention to number them from the bottom (1) to the top (5) of each staff." Dolmetsch bài 1: "The spaces between the lines are numbered too, again from the bottom (1) to the top (4)." OMT không nêu rõ cách đánh số nhưng nhất quán: nói "the second line from the bottom" cho dòng Sol, "the second line from the top" cho dòng Fa.'
    luot_2: dung
    luot_2_nguon: [ https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: "Dolmetsch Online (lesson 1): quy ước phổ biến đánh số dòng từ dưới (1) lên trên (5), khe từ dưới (1) lên trên (4)."
  - id: n3
    cau: Mỗi nốt được đặt hoặc trên dòng (dòng kẻ chạy qua giữa nốt) hoặc trong khe.
    loai: dinh-nghia
    nguon:
      - omt-notation
      - dol1
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "Noteheads on a line should fill in half of each space above and below. Noteheads in a space should just touch the lines above and below." Dolmetsch bài 1: "may lie on a line (where the line passes through the note-head), in the space between two lines"'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: "OMT: đầu nốt trên dòng nằm giữa dòng, đầu nốt trong khe chạm hai dòng; Dolmetsch: nốt nằm trên dòng (dòng xuyên qua đầu nốt) hoặc trong khe."
  - id: n4
    cau: Nốt càng cao trên khuông thì âm càng cao.
    loai: quy-tac
    nguon:
      - omt-notation
      - dol1
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "Notes with a higher frequency (shorter wavelength) are written higher on the staff than notes with a lower frequency (longer wavelength). That is, higher notes are placed above lower ones." Dolmetsch bài 1: "The higher the pitch of the note, the higher vertically the note will be placed on the staff."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/ ]
    luot_2_ghi_chu: "OMT: nốt ở phía trên khuông là cao hơn nốt ở phía dưới."
  - id: n5
    cau: Đi từ một dòng lên khe ngay trên nó là đi lên một bậc tên nốt (ví dụ từ Mi lên Fa).
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - omt-notation
    ket_qua: dung
    ghi_chu: 'Khóa Sol: dòng từ dưới lên E G B D F, khe F A C E (OMT Reading Clefs): dòng 1 là Mi, khe 1 ngay trên là Fa, tức lên một bậc tên nốt; khóa Fa: dòng 1 Sol, khe 1 La. Tên nốt đi liên tiếp trên khuông: OMT Reading Clefs: "Notice that each space and line above the staff gets a letter name with ledger lines, as if the staff were simply continuing upwards." (cùng quy luật cho cả khuông). Khối abc 1 và 2 minh họa (E4 rồi F4).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "OMT: quãng hai ở dòng và khe liền kề; khóa Sol dòng 1 = E, khe 1 = F."
  - id: n6
    cau: Chỉ nhìn khuông thì chưa biết dòng nào là nốt gì. Khóa nhạc đặt ở đầu khuông cho biết điều đó.
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "A clef indicates which pitches are assigned to the lines and spaces on a staff." OMT Notation of Notes: "A symbol placed on the left side of a staff that indicates which notes are assigned to different lines and spaces." ("ở đầu khuông" = bên trái khuông).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/ ]
    luot_2_ghi_chu: "OMT: muốn biết cao độ cụ thể thì khuông phải có khóa; khóa cho biết nốt nào gán cho dòng và khe."
  - id: n7
    cau: Khóa Sol (treble clef) có nét xoắn ôm lấy dòng 2, đánh dấu rằng nốt trên dòng 2 là Sol (G4); từ đó suy ra mọi nốt khác.
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-clefs
      - dol1
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "As a "G" clef, the treble clef designates the second-lowest line of a staff as G₄ by curling around it." OMT Reading Clefs: "the treble clef wraps around the G line (the second line from the bottom)". Dolmetsch bài 1: "The treble clef is also called the G clef or G2". "Suy ra mọi nốt khác": tên các dòng và khe còn lại đi theo thứ tự A–G (n5, n10, n11).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: "OMT: khóa Sol cuộn quanh dòng thứ hai từ dưới, đánh dấu G4; Dolmetsch: cuộn quanh dòng 2."
  - id: n8
    cau: "Khóa Sol dùng cho âm cao: tay phải piano, violin, sáo, giọng nữ."
    loai: quy-tac
    nguon:
      - omt-clefs
      - omt-notation
      - omt-keyboard
      - omt-satb
    ket_qua: dung
    ghi_chu: 'Agent làm lô (24/10/2026): giữ chữ cũ "giọng nữ", không thu hẹp thành "giọng nữ cao (soprano)" như lượt 1 đề nghị: hai giọng nữ của hợp xướng (soprano, alto) đều viết ở khóa Sol. OMT Chords in SATB Style: "On a grand staff in SATB style, the soprano and alto are written in the treble clef (upper staff), while the tenor and bass are written in the bass clef (lower staff)." Lượt 1: đề nghị thu hẹp vì OMT Reading Clefs: "The treble clef is typically used for higher voices and instruments, such as a flute, violin, trumpet, or soprano voice." OMT Notation of Notes: "Higher notes, such as those played by a flute or sung by a soprano, are usually written in treble clef" OMT chỉ nêu soprano, không nêu mọi giọng nữ (mezzo, alto) nên thu hẹp cho đúng mức nguồn. Tay phải piano: OMT Keyboard and Grand Staff: "Typically, the pianist plays the lower notes (in the bass clef) with their left hand and the higher notes (in the treble clef) with their right hand."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/, https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/, https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/ ]
    luot_2_ghi_chu: "OMT: khóa Sol cho giọng và nhạc cụ cao (flute, violin, trumpet, soprano); tay phải piano ở khóa Sol; SATB: soprano và alto ở khóa Sol."
  - id: n9
    cau: Guitar cũng đọc khóa Sol, nhưng âm thực tế thấp hơn một quãng tám so với nốt viết.
    loai: quy-tac
    nguon:
      - omt-clefs
      - dol29
    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs: "An octave treble clef with an “8” at the bottom of the clef indicates that notes should be sung or played an octave lower than written." OMT Reading Clefs: "Music for tenor vocalists, guitarists, and bassists often uses the octave treble clef." Dolmetsch bài 29: "Guitar | more ... sounds an octave below written pitch." Nhạc guitar ghi bằng khóa Sol (thường kèm số 8 dưới khóa) và nghe thấp hơn một quãng tám so với nốt viết.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/ ]
    luot_2_ghi_chu: "OMT (Reading Clefs): nhạc cho guitar thường dùng khóa Sol quãng tám ('8' dưới khóa), tức nốt chơi thấp hơn một quãng tám so với nốt viết."
  - id: n10
    cau: "Các nốt trên dòng khóa Sol, từ dưới lên: Mi – Sol – Si – Rê – Fa (E G B D F)."
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - mt21c-notation
    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs (hình 1): dòng khóa Sol từ dưới lên là E, G, B, D, F, nhớ bằng OMT Reading Clefs: "Every Good Bird Does Fly". MT21C 1.2: "In treble clef, the notes on the lines are" E–G–B–D–F "from lowest to highest". Khối abc 1: abcjs đọc E4 G4 B4 D5 F5 trên khóa Sol, khớp.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: E G B D F ('Every Good Bird Does Fly' trong OMT, 'Every Good Boy Does Fine' trong Dolmetsch).
  - id: n11
    cau: "Các nốt trong khe khóa Sol: Fa – La – Đô – Mi (F A C E)."
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - mt21c-notation
    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs: khe khóa Sol (từ dưới lên) F, A, C, E. OMT Reading Clefs: "Remembering that these letter names spell the word “face” may make identifying these spaces easier." MT21C 1.2: "The spaces are" F–A–C–E "from lowest to highest". Khối abc 2: abcjs đọc F4 A4 C5 E5, khớp.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/clefs/, https://www.dolmetsch.com/musictheory1.htm ]
    luot_2_ghi_chu: "Khe khóa Sol: F A C E."
