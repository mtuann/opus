doi_chu:
  - cu: "Bản nhạc piano viết trên khuông kép: khóa Sol thường dành cho tay phải, khóa Fa cho tay trái, và Đô giữa nằm trên dòng kẻ phụ ở giữa hai khuông. Thuộc vài nốt mốc (Fa3 trên dòng 4 khóa Fa, Sol4 trên dòng 2 khóa Sol) giúp đọc nhanh hơn hẳn so với đếm dòng: xem Đọc nhạc và thị tấu."
    moi: "Bản nhạc piano viết trên khuông kép: khóa Sol thường dành cho tay phải, khóa Fa cho tay trái, và Đô giữa nằm trên dòng kẻ phụ ở giữa hai khuông. Thuộc vài nốt mốc (Fa3 trên dòng 4 khóa Fa, Sol4 trên dòng 2 khóa Sol), rồi đếm từ nốt mốc gần nhất thay vì đếm từ dòng thấp nhất: xem Đọc nhạc và thị tấu."
    ly_do: 'n26 (da-sua): "nhanh hơn hẳn" không kiểm được; câu mới giữ lời khuyên và nói cách làm, khớp trang lõi cũ luyen-tap/doc-not và piano/thi-tau (đếm từ nốt mốc gần nhất).'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Notation of Notes, Clefs, and Ledger Lines; Reading Clefs; The Keyboard and the Grand Staff; American Standard Pitch Notation (ASPN)."
      - "Robert Hutchinson, Music Theory for the 21st-Century Classroom: 1.2 Notation và 1.3 Octave Registers; Dolmetsch Online, Music Theory Online: bài 1 (đánh số dòng và khe, cách nhớ tên nốt) và bài 29 (âm vực nhạc cụ)."
    ly_do: "Mục Nguồn: thay link chung tới Open Music Theory bằng link tới đúng các chương đã đọc khi kiểm định (lượt 1), thêm giáo trình mở và bản nhạc đã dùng; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm."
