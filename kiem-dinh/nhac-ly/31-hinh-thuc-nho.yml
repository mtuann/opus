    moi:
      - Hai đoạn, thường có tái hiện, có nhắc lại
      - "Tương phản: thường nhẹ nhàng hơn, thường ở giọng khác"
    ly_do: 'n33 (da-sua): COD và Britannica; "ít nhạc cụ hơn" không có nguồn.; n31 (da-sua): ô Trio trong bảng.'
  - cu: Schubert Heidenröslein; hầu hết dân ca, thánh ca
    moi: Schubert Heidenröslein; nhiều dân ca, thánh ca
    ly_do: "n40 (da-sua): không có nguồn đếm."
  - cu: Tìm đoạn giữa tương phản rõ (giọng khác, nhạc cụ ít hơn, tính chất khác) → ba đoạn, hoặc minuet – trio.
    moi: Tìm đoạn giữa tương phản rõ (giọng khác, tính chất khác) → ba đoạn, hoặc minuet – trio.
    ly_do: 'n47 (da-sua): bỏ "nhạc cụ ít hơn".'
  - cu: "Open Music Theory: chương Binary Form (Brian Jarvis): hai đoạn, mỗi đoạn thường nhắc lại, dùng nhiều trong nhạc nhảy; mỗi đoạn thường kết bằng một kết chuẩn, kể cả kết nửa; hai đoạn có tái hiện (đầu đoạn A trở lại ở giọng chính giữa đoạn hai); đoạn hai kết bằng kết trọn ở giọng chính; chương Ternary Form (Brian Jarvis): A B A, đoạn B tương phản, thường ở giọng mới; minuet và trio là ba đoạn kép; ví dụ Mazurka La thứ Op. 17 số 4 của Chopin; chương Sonata Form (Brian Jarvis): hình thức sonata là một dạng phức tạp của hai đoạn có tái hiện."
    moi: "Open Music Theory: chương Binary Form (Brian Jarvis): hai đoạn, mỗi đoạn thường nhắc lại, dùng nhiều trong nhạc nhảy; mỗi đoạn thường kết bằng một kết chuẩn, kể cả kết nửa; hai đoạn có tái hiện (đầu đoạn A trở lại ở giọng chính giữa đoạn hai); chương Ternary Form (Brian Jarvis): A B A, đoạn B thường chứa chất liệu tương phản ở giọng mới; minuet và trio là ba đoạn kép; ví dụ Mazurka La thứ Op. 17 số 4 của Chopin; chương Sonata Form (Brian Jarvis): hình thức sonata là một dạng phức tạp của hai đoạn có tái hiện."
    ly_do: 'Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net).'
  - cu: 'Wikipedia: Binary form (phần A ở giọng trưởng thường sang giọng át, ở giọng thứ thường sang giọng trưởng song song; phần A cũng có thể kết trọn ngay ở giọng chính; khác biệt giữa hai đoạn có tái hiện và ba đoạn), Ternary form (mỗi đoạn tự kết; Prélude "Giọt mưa" của Chopin; minuet chơi lại không nhắc lại), Da capo aria (ca sĩ ứng tác trang trí ở lần A thứ hai), Sarabande (tổ khúc Baroque gồm các điệu nhảy ở hình thức hai đoạn), Strophic form (Heidenröslein của Schubert; hình thức theo khổ có biến đổi), Through-composed music (Erlkönig).'
    moi:
      - "Encyclopaedia Britannica: Binary form (đoạn đầu của bài giọng trưởng thường sang giọng át, của bài giọng thứ sang giọng trưởng song song; đoạn hai bắt đầu ở giọng mới rồi về giọng chính; có dấu nhắc lại; các điệu nhảy của J. S. Bach dùng hình thức này), Ternary form (A B A; minuet và trio, aria da capo; mỗi phần của minuet đứng khá trọn vẹn, kết bằng kết trọn; trio thường sang giọng khác)."
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: mục suite (tổ khúc Baroque gồm allemande, courante, sarabande, gigue; hầu hết các chương ở hình thức hai đoạn đơn giản), minuet (điệu nhảy nhịp ba; chương 3 tiêu chuẩn của giao hưởng thế kỷ 18; thường A B A, đoạn B là trio), trio (đoạn giữa của minuet hay scherzo, thường tương phản nhẹ nhàng hơn), scherzo (kế thừa minuet và trio, Beethoven là người thật sự tạo ra scherzo), aria (aria da capo ở hình thức A B A)."
      - 'Wikipedia: Binary form (phần A ở giọng trưởng thường sang giọng át, ở giọng thứ thường sang giọng trưởng song song, hoặc ở lại giọng chính; khác biệt giữa hai đoạn có tái hiện và ba đoạn), Ternary form (mỗi đoạn tự kết bằng kết trọn; Prélude "Giọt mưa" của Chopin; minuet chơi lại không nhắc lại), Da capo aria (ca sĩ ứng tác trang trí ở lần A thứ hai), Sarabande (tổ khúc Baroque gồm các điệu nhảy ở hình thức hai đoạn), Strophic form (Heidenröslein của Schubert; hình thức theo khổ có biến đổi), Through-composed music (Erlkönig), Notebook for Anna Magdalena Bach (Minuet Sol trưởng thường được cho là của Christian Petzold; sổ tay năm 1725).'
      - "IMSLP, Musette in D major, BWV Anh. 126: số 22 trong sổ tay Anna Magdalena Bach, 1725; quyền tác giả của J. S. Bach không chắc chắn."
    ly_do: 'Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net).'
  - cu: "Bản nhạc của các ví dụ, bản dàn trang công cộng của Mutopia Project: Minuet Sol trưởng BWV Anh. 114 và Sol thứ BWV Anh. 115 theo Bach-Gesellschaft (đoạn A của bài Sol trưởng kết trọn ở Sol trưởng, đoạn B sang Rê trưởng; đoạn A của bài Sol thứ kết ở Si♭ trưởng), Musette BWV Anh. 126 theo Bach-Gesellschaft (đoạn A kết ở Rê trưởng với dấu ngân, đoạn B kết ở La trưởng), La candeur theo ấn bản Litolff (đoạn A dừng trên hợp âm Sol), Tổ khúc cello số 1 theo ấn bản Schirmer 1916 (mọi điệu nhảy đều có hai đoạn nhắc lại)."
    moi: "Bản nhạc của các ví dụ, bản dàn trang công cộng của Mutopia Project: Minuet Sol trưởng BWV Anh. 114 và Sol thứ BWV Anh. 115 theo Bach-Gesellschaft (đoạn A của bài Sol trưởng kết trọn ở Sol trưởng, đoạn B sang Rê trưởng; đoạn A của bài Sol thứ kết ở Si♭ trưởng), Musette BWV Anh. 126 theo Bach-Gesellschaft (đoạn A kết ở Rê trưởng với dấu ngân, đoạn B kết ở La trưởng; cả hai đoạn có dấu nhắc lại), La candeur theo ấn bản Litolff (đoạn A dừng trên hợp âm Sol)."
    ly_do: 'Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net).'
