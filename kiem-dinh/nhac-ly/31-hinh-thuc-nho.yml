doi_chu:
  - cu: "Các hình thức lớn như sonata, fugue, rondo được xây từ những khối nhỏ hơn. Bài này dạy những hình thức nhỏ mà bạn gặp hằng ngày: trong một điệu nhảy Baroque, một minuet của Mozart, một ca khúc của Schubert."
    moi: "Các hình thức lớn như sonata và rondo được xây từ những khối nhỏ hơn. Bài này dạy những hình thức nhỏ mà bạn gặp hằng ngày: trong một điệu nhảy Baroque, một minuet của Mozart, một ca khúc của Schubert."
    ly_do: "n1 (da-sua): fugue không phải hình thức xây từ hình thức nhỏ; áp cho description và câu mở đầu."
  - cu: Phần B bắt đầu ở giọng mới, đi qua vài giọng khác, rồi trở về giọng chính để kết.
    moi: Phần B bắt đầu từ giọng mà phần A vừa kết, đi qua vài giọng khác, rồi trở về giọng chính để kết.
    ly_do: "n12 (da-sua): đúng cả khi A kết ở giọng chính."
  - cu: "A B A', vẫn với hai dấu nhắc lại: ‖: A :‖ ‖: B A' :‖. Phần thứ hai kết thúc bằng việc đưa chủ đề đầu trở lại, giờ ở giọng chính. Đây chính là \"mầm mống\" của hình thức sonata, và là hình thức của hầu hết các minuet thời Cổ điển."
    moi: "A B A', vẫn với hai dấu nhắc lại: ‖: A :‖ ‖: B A' :‖. Phần thứ hai kết thúc bằng việc đưa chủ đề đầu trở lại, giờ ở giọng chính. Đây chính là \"mầm mống\" của hình thức sonata, và là hình thức điển hình của minuet thời Cổ điển."
    ly_do: 'n19 (da-sua): không có nguồn đếm "hầu hết".'
  - cu: "Chương 3 của rất nhiều giao hưởng, tứ tấu, sonata thời Cổ điển là minuet và trio: ba khối ghép thành một A B A lớn, mà mỗi khối lại là một hình thức hai đoạn có tái hiện."
    moi: "Chương 3 tiêu chuẩn của giao hưởng thời Cổ điển, cũng dùng trong nhiều thể loại khác, là minuet và trio: ba khối ghép thành một A B A lớn, mà mỗi khối lại là một hình thức hai đoạn, thường có tái hiện."
    ly_do: "n30 (da-sua): COD chỉ nêu giao hưởng.; n31 (da-sua): OMT 1e nói trio là rounded hoặc simple binary."
  - cu: Điệu nhảy nhịp 3/4, đĩnh đạc
    moi: Điệu nhảy nhịp 3/4
    ly_do: 'n32 (da-sua): "đĩnh đạc" không có nguồn.'
