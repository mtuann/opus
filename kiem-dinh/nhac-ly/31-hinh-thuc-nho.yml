ghi_chu: 'Trang hình thức nhỏ (tầng lõi), không có khối abc (chỉ quiz và hình form-small). Nguồn chính: OMT (Binary, Ternary, Sonata; bản 1 Minuet Form), COD (suite, minuet, trio, scherzo, aria, strophic), Britannica, Listen 8e (Erlkönig), tệp LilyPond Mutopia của Minuet BWV Anh. 114, 115, Musette 126, La candeur (đọc qua WebFetch ngày 28/10/2026). CHƯA CHẮC (null): n14 (Petzold, chỉ Wikipedia), n23 (Giọt mưa ba đoạn), n25 (trang trí ở lần A thứ hai), n28 (Musette da capo), n39 (Heidenröslein theo khổ), n53 và n55 (lỗi nhỏ trong hình). Thuật ngữ trang dùng có hồ sơ ở lô này: suite, scherzo, aria. Chưa có ở thuat-ngu.yml (cho D3-L5): binary (hai đoạn), rounded binary (hai đoạn có tái hiện), ternary (ba đoạn), strophic (theo khổ), through-composed (xuyên suốt).'
