    luot_2_ghi_chu: "OMT: minuet và trio là rounded binary hoặc simple binary, minuet da capo; sơ đồ đúng."
khuong_nhac: []
doi_chu:
  - cu: "Các hình thức lớn như sonata, fugue, rondo được xây từ những khối nhỏ hơn. Bài này dạy những hình thức nhỏ mà bạn gặp hằng ngày: trong một điệu nhảy Baroque, một minuet của Mozart, một ca khúc của Schubert."
    moi: "Các hình thức lớn như sonata và rondo được xây từ những khối nhỏ hơn. Bài này dạy những hình thức nhỏ mà bạn gặp hằng ngày: trong một điệu nhảy Baroque, một minuet của Mozart, một ca khúc của Schubert."
    ly_do: "n1 (da-sua): fugue không phải hình thức xây từ hình thức nhỏ; áp cho description và câu mở đầu."
  - cu: Phần B bắt đầu ở giọng mới, đi qua vài giọng khác, rồi trở về giọng chính để kết.
    moi: Phần B bắt đầu từ giọng mà phần A vừa kết, đi qua vài giọng khác, rồi trở về giọng chính để kết.
    ly_do: "n12 (da-sua): đúng cả khi A kết ở giọng chính."
  - cu: "A B A', vẫn với hai dấu nhắc lại: ‖: A :‖ ‖: B A' :‖. Phần thứ hai kết thúc bằng việc đưa chủ đề đầu trở lại, giờ ở giọng chính. Đây chính là \"mầm mống\" của hình thức sonata, và là hình thức của hầu hết các minuet thời Cổ điển."
    moi: "A B A', vẫn với hai dấu nhắc lại: ‖: A :‖ ‖: B A' :‖. Phần thứ hai kết thúc bằng việc đưa chủ đề đầu trở lại, giờ ở giọng chính. Đây chính là \"mầm mống\" của hình thức sonata, và là hình thức điển hình của minuet thời Cổ điển."
    ly_do: 'n19 (da-sua): không có nguồn đếm "hầu hết".'
  - cu:
      - "A B A, trong đó mỗi đoạn trọn vẹn và tự kết ở giọng của nó, và B tương phản rõ với A (giọng khác, tính chất khác). Khác hai đoạn có tái hiện ở chỗ: B ở đây là một thế giới riêng, không chỉ là đoạn chuyển tiếp."
      - 'Nhiều tiểu phẩm piano Lãng mạn: nocturne, mazurka, Chopin Prélude Op. 28 số 15 "Giọt mưa".'
    moi:
      - "A B A: ba đoạn tách biệt, đoạn A trở lại sau đoạn B, và B tương phản rõ với A (thường ở giọng khác, tính chất khác). Khác hai đoạn có tái hiện ở chỗ: B ở đây là một thế giới riêng, không chỉ là đoạn chuyển tiếp."
      - "Nhiều tiểu phẩm piano Lãng mạn: nocturne, mazurka (như Mazurka La thứ Op. 17 số 4 của Chopin)."
    ly_do: 'n20, n21 (da-sua, review D3-gom): OMT Ternary Form: đoạn có thể đóng hay mở, không bắt buộc tự kết; B thường (không phải luôn) ở giọng mới.; n23 (da-sua, review D3-gom): Prélude "Giọt mưa" chỉ có nguồn bậc 3; OMT Ternary Form dùng Mazurka Op. 17 số 4 làm ví dụ.'
  - cu: "Musette Rê trưởng trong sổ tay Anna Magdalena Bach: đoạn A và đoạn B đều có dấu nhắc lại như hình thức hai đoạn, nhưng đoạn B kết ở giọng át (La trưởng), nên đoạn A được chơi lại từ đầu (da capo): A B A."
    moi: "Musette Rê trưởng trong sổ tay Anna Magdalena Bach: đoạn A và đoạn B đều có dấu nhắc lại như hình thức hai đoạn, nhưng đoạn B kết ở giọng át (La trưởng), còn đoạn A kết ở giọng chính với dấu fermata: dấu ấy là chỗ dừng khi chơi lại từ đầu (da capo), nên bài thành A B A."
    ly_do: "n28 (da-sua, review D3-gom): bản Bach-Gesellschaft (Mutopia) không ghi D.C. nhưng có fermata cuối đoạn A; COD da capo: chơi lại từ đầu tới chữ fine hay dấu dừng."
  - cu: "Chương 3 của rất nhiều giao hưởng, tứ tấu, sonata thời Cổ điển là minuet và trio: ba khối ghép thành một A B A lớn, mà mỗi khối lại là một hình thức hai đoạn có tái hiện."
    moi: "Chương 3 tiêu chuẩn của giao hưởng thời Cổ điển, cũng dùng trong nhiều thể loại khác, là minuet và trio: ba khối ghép thành một A B A lớn, mà mỗi khối lại là một hình thức hai đoạn, thường có tái hiện."
    ly_do: "n30 (da-sua): COD chỉ nêu giao hưởng.; n31 (da-sua): OMT 1e nói trio là rounded hoặc simple binary."
  - cu: Điệu nhảy nhịp 3/4, đĩnh đạc
    moi: Điệu nhảy nhịp 3/4
    ly_do: 'n32 (da-sua): "đĩnh đạc" không có nguồn.'
  - cu:
      - Hai đoạn có tái hiện, có nhắc lại
      - "Tương phản: nhẹ hơn, ít nhạc cụ hơn"
    moi:
      - Hai đoạn, thường có tái hiện, có nhắc lại
      - "Tương phản: thường nhẹ nhàng hơn, thường ở giọng khác"
    ly_do: 'n33 (da-sua): COD và Britannica; "ít nhạc cụ hơn" không có nguồn.; n31 (da-sua): ô Trio trong bảng.'
  - cu: Schubert Heidenröslein; hầu hết dân ca, thánh ca
    moi: Schubert Heidenröslein; nhiều dân ca, thánh ca
    ly_do: "n40 (da-sua): không có nguồn đếm."
  - cu: Tìm đoạn giữa tương phản rõ (giọng khác, nhạc cụ ít hơn, tính chất khác) → ba đoạn, hoặc minuet – trio.
    moi: Tìm đoạn giữa tương phản rõ (giọng khác, tính chất khác) → ba đoạn, hoặc minuet – trio.
    ly_do: 'n47 (da-sua): bỏ "nhạc cụ ít hơn".'
  - cu: "Open Music Theory: chương Binary Form (Brian Jarvis): hai đoạn, mỗi đoạn thường nhắc lại, dùng nhiều trong nhạc nhảy; mỗi đoạn thường kết bằng một kết chuẩn, kể cả kết nửa; hai đoạn có tái hiện (đầu đoạn A trở lại ở giọng chính giữa đoạn hai); đoạn hai kết bằng kết trọn ở giọng chính; chương Ternary Form (Brian Jarvis): A B A, đoạn B tương phản, thường ở giọng mới; minuet và trio là ba đoạn kép; ví dụ Mazurka La thứ Op. 17 số 4 của Chopin; chương Sonata Form (Brian Jarvis): hình thức sonata là một dạng phức tạp của hai đoạn có tái hiện."
    moi: "Open Music Theory: chương Binary Form (Brian Jarvis): hai đoạn, mỗi đoạn thường nhắc lại, dùng nhiều trong nhạc nhảy; mỗi đoạn thường kết bằng một kết chuẩn, kể cả kết nửa; hai đoạn có tái hiện (đầu đoạn A trở lại ở giọng chính giữa đoạn hai); chương Ternary Form (Brian Jarvis): A B A, đoạn B thường chứa chất liệu tương phản ở giọng mới; minuet và trio là ba đoạn kép; ví dụ Mazurka La thứ Op. 17 số 4 của Chopin; chương Sonata Form (Brian Jarvis): hình thức sonata là một dạng phức tạp của hai đoạn có tái hiện."
    ly_do: "Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net)."
  - cu: 'Wikipedia: Binary form (phần A ở giọng trưởng thường sang giọng át, ở giọng thứ thường sang giọng trưởng song song; phần A cũng có thể kết trọn ngay ở giọng chính; khác biệt giữa hai đoạn có tái hiện và ba đoạn), Ternary form (mỗi đoạn tự kết; Prélude "Giọt mưa" của Chopin; minuet chơi lại không nhắc lại), Da capo aria (ca sĩ ứng tác trang trí ở lần A thứ hai), Sarabande (tổ khúc Baroque gồm các điệu nhảy ở hình thức hai đoạn), Strophic form (Heidenröslein của Schubert; hình thức theo khổ có biến đổi), Through-composed music (Erlkönig).'
    moi:
      - "Encyclopaedia Britannica: Binary form (đoạn đầu của bài giọng trưởng thường sang giọng át, của bài giọng thứ sang giọng trưởng song song; đoạn hai bắt đầu ở giọng mới rồi về giọng chính; có dấu nhắc lại; các điệu nhảy của J. S. Bach dùng hình thức này), Ternary form (A B A; minuet và trio, aria da capo; mỗi phần của minuet đứng khá trọn vẹn, kết bằng kết trọn; trio thường sang giọng khác)."
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: mục suite (tổ khúc Baroque gồm allemande, courante, sarabande, gigue; hầu hết các chương ở hình thức hai đoạn đơn giản), minuet (điệu nhảy nhịp ba; chương 3 tiêu chuẩn của giao hưởng thế kỷ 18; thường A B A, đoạn B là trio), trio (đoạn giữa của minuet hay scherzo, thường tương phản nhẹ nhàng hơn), scherzo (kế thừa minuet và trio, Beethoven là người thật sự tạo ra scherzo), aria (aria da capo ở hình thức A B A)."
      - "Wikipedia: Binary form (phần A ở giọng trưởng thường sang giọng át, ở giọng thứ thường sang giọng trưởng song song, hoặc ở lại giọng chính; khác biệt giữa hai đoạn có tái hiện và ba đoạn), Ternary form (minuet chơi lại không nhắc lại), Da capo aria (ca sĩ ứng tác trang trí ở lần A thứ hai), Sarabande (tổ khúc Baroque gồm các điệu nhảy ở hình thức hai đoạn), Strophic form (Heidenröslein của Schubert; hình thức theo khổ có biến đổi), Through-composed music (Erlkönig), Notebook for Anna Magdalena Bach (Minuet Sol trưởng thường được cho là của Christian Petzold; sổ tay năm 1725)."
      - "IMSLP, Musette in D major, BWV Anh. 126: số 22 trong sổ tay Anna Magdalena Bach, 1725; quyền tác giả của J. S. Bach không chắc chắn."
    ly_do: "Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net).; Mục Nguồn (review D3-gom, theo n20, n23): trang không còn dùng hai điều ấy."
  - cu: "Bản nhạc của các ví dụ, bản dàn trang công cộng của Mutopia Project: Minuet Sol trưởng BWV Anh. 114 và Sol thứ BWV Anh. 115 theo Bach-Gesellschaft (đoạn A của bài Sol trưởng kết trọn ở Sol trưởng, đoạn B sang Rê trưởng; đoạn A của bài Sol thứ kết ở Si♭ trưởng), Musette BWV Anh. 126 theo Bach-Gesellschaft (đoạn A kết ở Rê trưởng với dấu ngân, đoạn B kết ở La trưởng), La candeur theo ấn bản Litolff (đoạn A dừng trên hợp âm Sol), Tổ khúc cello số 1 theo ấn bản Schirmer 1916 (mọi điệu nhảy đều có hai đoạn nhắc lại)."
    moi: "Bản nhạc của các ví dụ, bản dàn trang công cộng của Mutopia Project: Minuet Sol trưởng BWV Anh. 114 và Sol thứ BWV Anh. 115 theo Bach-Gesellschaft (đoạn A của bài Sol trưởng kết trọn ở Sol trưởng, đoạn B sang Rê trưởng; đoạn A của bài Sol thứ kết ở Si♭ trưởng), Musette BWV Anh. 126 theo Bach-Gesellschaft (đoạn A kết ở Rê trưởng với dấu ngân, đoạn B kết ở La trưởng; cả hai đoạn có dấu nhắc lại), La candeur theo ấn bản Litolff (đoạn A dừng trên hợp âm Sol)."
    ly_do: "Mục Nguồn: thay bằng các nguồn đã mở khi kiểm định (lượt 1 D3-L4); bỏ nguồn không đọc được chữ (musictheory.net)."
