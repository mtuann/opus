  - id: n28
    cau: 'Đoạn A kết ở giọng chính với dấu fermata; dấu ấy là chỗ dừng khi chơi lại từ đầu (da capo), nên bài thành A B A.'
    loai: cau-truc
    nguon:
      - mut-126
      - cod-dc
    ket_qua: da-sua
    ghi_chu: 'CHƯA CHẮC: trong tệp LilyPond không có chữ D.C. hay "da capo"; IMSLP không mở ra chi tiết này. Chỉ site cũ (musette-re.md) nói da capo, không phải nguồn độc lập. Kết ở La trưởng (át) làm da capo hợp lý, nhưng "được chơi lại" cần bản in gốc. Lượt 2 xem bản gốc hay chọn nói "thường được chơi lại". Review D3-gom: lượt 1 chưa quyết, lượt 2 khong-chac (không thấy chữ D.C.). Review đọc tệp LilyPond Mutopia theo Bach-Gesellschaft (https://www.mutopiaproject.org/ftp/BachJS/BWVAnh126/anna-magdalena-22/anna-magdalena-22.ly): đoạn A (8 ô, nhắc lại) kết ở Rê với dấu fermata (\fermata) ở cả hai bè; đoạn B (12 ô, nhắc lại) kết ở La trưởng, không có fermata. COD da capo: "Repeat from the beginning until you come to the word fine (end), or the pause mark": dấu fermata cuối đoạn A là chỗ dừng của da capo. Chữ cũ: "nhưng đoạn B kết ở giọng át (La trưởng), nên đoạn A được chơi lại từ đầu (*da capo*): A B A." Chữ mới: "nhưng đoạn B kết ở giọng át (La trưởng), còn đoạn A kết ở giọng chính với dấu fermata: dấu ấy là chỗ dừng khi chơi lại từ đầu (*da capo*), nên bài thành A B A." (fermata: tên dùng ở bài 14 đã khóa). Câu dựa trên ký hiệu thật của bản nhạc và quy ước COD, không còn dựa trên trang cũ. Review D3-gom (sau lượt 2 bổ sung): lượt 2 kiểm nhầm sang Mazurka Op. 17 số 4; câu nói về Musette BWV Anh. 126, đã đối chiếu bản Bach-Gesellschaft trên Mutopia (dấu fermata cuối đoạn A) và định nghĩa da capo của COD ở review nhóm B. Giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không nguồn bậc 2 nào mở được nhắc fermata hay da capo ở cuối đoạn A của bản này (OMT chỉ nêu đây là ví dụ ba đoạn mà chỉ đoạn đầu là hình thức hoàn chỉnh). Cần đối chiếu bản nhạc.
