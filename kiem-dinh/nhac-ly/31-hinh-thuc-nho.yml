nhan_dinh:
  - id: n1
    cau: Các hình thức lớn như sonata và rondo được xây từ những khối nhỏ hơn.
    loai: cau-truc
    nguon:
      - omt-son
      - omt-bin
    ket_qua: dung
    ghi_chu: 'OMT: hình thức sonata là dạng phức tạp của hai đoạn có tái hiện. Rondo chưa có nguồn riêng ở trang này; cách nói "xây từ khối nhỏ" là lời dẫn của site. Chữ cũ có "fugue": bỏ vì fugue là kỹ thuật/thể loại đối vị, không xây từ các hình thức nhỏ này.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/sonata-form", "https://www.britannica.com/art/binary-form" ]
    luot_2_ghi_chu: "Britannica: sonata form phát triển từ binary form; rondo là nối các đoạn nhỏ; nhận định chung đúng."
  - id: n2
    cau: 'Link [hình thức lớn](/opus/hinh-thuc/): trang tổng quan các hình thức lớn.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/hinh-thuc/index.md có tồn tại và liệt kê sonata, rondo, minuet-trio, scherzo. Điều cần giữ: trang đích là mục lục hình thức lớn. Review: trang đích chưa chuyển (bản xem: "sắp có"); ../opus-zero/docs/hinh-thuc/index.md ("Hình thức & thể loại") là trang tổng quan, có mục Hình thức sonata, rondo, minuet và trio, scherzo.'
    review: dung
  - id: n3
    cau: 'Hình thức hai đoạn (binary) là A B, thường với dấu nhắc lại cho mỗi phần: ‖: A :‖ ‖: B :‖.'
    loai: dinh-nghia
    nguon:
      - omt-bin
      - brit-bin
    ket_qua: dung
    ghi_chu: 'OMT: hai đoạn, mỗi đoạn thường nhắc lại. Britannica: có dấu nhắc lại.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/", "https://www.britannica.com/art/binary-form" ]
    luot_2_ghi_chu: "OMT, Britannica: binary gồm hai đoạn, thường mỗi đoạn lặp lại (AABB khi biểu diễn)."
  - id: n4
    cau: Phần A bắt đầu ở giọng chính và thường chuyển sang giọng át; ở giọng thứ thì sang giọng trưởng song song.
    loai: quy-tac
    nguon:
      - brit-bin
      - omt-bin
    ket_qua: dung
    ghi_chu: 'Britannica: đoạn đầu của bài giọng trưởng thường sang giọng át, của bài giọng thứ sang giọng trưởng song song. Wikipedia (bậc 3) khớp, nói thêm "hoặc ở lại giọng chính".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/binary-form" ]
    luot_2_ghi_chu: "Britannica: giọng trưởng thì phần đầu sang giọng át, giọng thứ thì sang giọng trưởng tương đối (relative major); nếu 'song song' ở đây hiểu là relative thì đúng, nếu là parallel (cùng tên) thì sai: nên xem lại thuật ngữ trên trang."
  - id: n5
    cau: Phần lớn các điệu nhảy Baroque ở hình thức hai đoạn có phần A chuyển sang giọng át.
    loai: danh-muc
    nguon:
      - brit-bin
      - cod-suite
    ket_qua: dung
    ghi_chu: 'Câu cũ viết "như phần lớn các điệu nhảy Baroque" gắn với A sang giọng át. Britannica: điệu nhảy của Bach dùng hai đoạn, A thường sang giọng át; COD: hầu hết chương của tổ khúc ở hai đoạn đơn giản. Không có nguồn đếm "phần lớn" cho riêng chuyện sang giọng át; chữ "phần lớn" là đánh giá của site, nhẹ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/binary-form", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/03%3A_Form/3.06%3A_Binary_Form" ]
    luot_2_ghi_chu: "Britannica: điệu nhảy của Bach, sonata Scarlatti: đoạn đầu sang át (hoặc relative major); OMT: binary dùng nhiều trong nhạc nhảy. 'Phần lớn' là khái quát chấp nhận được."
  - id: n6
    cau: 'Minuet Sol thứ: phần A kết ở Si♭ trưởng.'
    loai: nam
    nguon:
      - mut-115
    ket_qua: dung
    ghi_chu: 'Kiểm tệp LilyPond Mutopia (BWV Anh. 115): phần A kết ở Si♭ trưởng (giọng trưởng song song của Sol thứ). Khớp n4.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh115/anna-magdalena-05/anna-magdalena-05.ly", "https://imslp.org/wiki/Category:Petzold,_Christian" ]
    luot_2_ghi_chu: "Mutopia: Minuet Sol thứ BWV Anh. 115, đoạn 1 (ô 16) kết ở hợp âm Si♭ trưởng; IMSLP xếp Minuet Sol thứ BWV Anh. 115 của Pezold/Petzold."
  - id: n7
    cau: Link [Minuet Sol thứ](/opus/piano/tac-pham/minuet-sol-thu/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/piano/tac-pham/minuet-sol-thu.md có tồn tại, là bài Minuet Sol thứ BWV Anh. 115. Điều cần giữ: bài này có A kết ở Si♭ trưởng. Review: trang đích chưa chuyển; ../opus-zero/docs/piano/tac-pham/minuet-sol-thu.md ("Petzold: Minuet Sol thứ, BWV Anh. 115"), dòng 17: "Đoạn A kết ở Si♭ trưởng"; dòng 56 kết trọn ở Si♭ trưởng.'
    review: dung
  - id: n8
    cau: Phần A có thể dừng ở kết nửa trên hợp âm át, như La candeur.
    loai: cau-truc
    nguon:
      - omt-bin
      - mut-cand
    ket_qua: dung
    ghi_chu: 'OMT: mỗi đoạn thường kết bằng một kết chuẩn, kể cả kết nửa. Tệp LilyPond La candeur: phần A (8 ô) dừng trên Sol (hợp âm át của Đô trưởng).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BurgmullerJFF/O100/25EF-01/25EF-01.ly" ]
    luot_2_ghi_chu: "Mutopia La Candeur Op. 100: Đô trưởng, đoạn A (8 ô) kết ở hợp âm Sol-Si, nốt giai điệu Sol: kết nửa trên hợp âm át."
  - id: n9
    cau: Link [La candeur](/opus/piano/tac-pham/burgmuller-la-candeur/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/piano/tac-pham/burgmuller-la-candeur.md có tồn tại. Điều cần giữ: bài là La candeur của Burgmüller, phần A kết nửa. Review: trang đích chưa chuyển; ../opus-zero/docs/piano/tac-pham/burgmuller-la-candeur.md ("Burgmüller: La candeur, Op. 100 số 1"), dòng 76: đoạn A "dừng ở át âm (kết nửa)".'
    review: dung
  - id: n10
    cau: Phần A cũng có thể kết trọn ngay ở giọng chính, như Minuet Sol trưởng, nơi chỉ phần B mới sang Rê trưởng.
    loai: cau-truc
    nguon:
      - mut-114
      - wiki-bin
    ket_qua: dung
    ghi_chu: 'Tệp LilyPond BWV Anh. 114: A kết Sol trưởng, B sang Rê trưởng (kết ở ô 24). Wikipedia Binary form (bậc 3): A có thể ở lại giọng chính.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh114/anna-magdalena-04/anna-magdalena-04.ly" ]
    luot_2_ghi_chu: "Mutopia BWV Anh. 114: đoạn 1 (ô 16) kết ở hợp âm Sol trưởng; đoạn 2 mở đầu ô 17-18 đã chuyển sang Rê (La-Rê-Mi-Fa♯-Rê)."
  - id: n11
    cau: Link [Minuet Sol trưởng](/opus/piano/tac-pham/minuet-sol/) (xuất hiện hai lần ở bài).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/piano/tac-pham/minuet-sol.md có tồn tại. Điều cần giữ: bài là Minuet Sol trưởng BWV Anh. 114, A kết trọn Sol trưởng, B sang Rê trưởng. Review: link có hai lần trên trang (mục Hai đoạn, dòng 14 và 17). Trang đích chưa chuyển; ../opus-zero/docs/piano/tac-pham/minuet-sol.md ("Petzold: Minuet Sol trưởng, BWV Anh. 114"): hình form-map dòng 71 (đoạn A) và dòng 64 ("Đoạn B, câu 3 … sang Rê trưởng").'
    review: dung
  - id: n12
    cau: Phần B bắt đầu từ giọng mà phần A vừa kết, đi qua vài giọng khác, rồi trở về giọng chính để kết.
    loai: quy-tac
    nguon:
      - brit-bin
      - omt-bin
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phần B bắt đầu ở giọng mới". Sai với trường hợp A kết ở giọng chính (n10, Minuet Sol trưởng, B vẫn có thể bắt đầu từ Sol rồi sang Rê). Britannica: đoạn hai bắt đầu ở giọng mới rồi về giọng chính, nói về bài A sang giọng khác; câu mới đúng cho cả hai trường hợp. Review D3-gom: chữ mới có trên trang; lượt 2 đúng (OMT, Britannica).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/binary-form", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/03%3A_Form/3.06%3A_Binary_Form" ]
    luot_2_ghi_chu: "Britannica: đoạn hai bắt đầu ở giọng mới rồi về giọng chính; OMT: phần hai thường bất ổn rồi kết ở giọng chính."
  - id: n13
    cau: Gần như mọi điệu nhảy trong tổ khúc Baroque (allemande, courante, sarabande, gigue) đều ở hình thức hai đoạn.
    loai: danh-muc
    nguon:
      - cod-suite
      - brit-bin
    ket_qua: dung
    ghi_chu: 'COD (suite): tổ khúc Baroque gồm allemande, courante, sarabande, gigue; hầu hết các chương ở hai đoạn đơn giản. Câu của trang dùng "gần như mọi", gần COD "nearly all".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/", "https://www.britannica.com/art/binary-form" ]
    luot_2_ghi_chu: "OMT: binary dùng nhiều trong nhạc nhảy; Britannica: các chương mô phỏng điệu nhảy của Bach theo binary. 'Gần như mọi' là khái quát, nguồn nói chung hơn."
  - id: n14
    cau: Minuet cung Sol trưởng trong sổ tay Anna Magdalena Bach (Petzold) là ví dụ dễ nghe.
    loai: lich-su
    nguon:
      - imslp-114
