    ghi_chu: 'OMT: A B A, mỗi đoạn tự kết. Britannica: mỗi phần của minuet đứng khá trọn vẹn, kết bằng kết trọn. Wikipedia khớp. Review D3-gom: lượt 2 (khong-chac): OMT Ternary không đòi mỗi đoạn trọn vẹn và tự kết. Review mở lại OMT Ternary Form (https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/): "three distinct sections with an ABA pattern of large-scale repetition"; đoạn có thể đóng hay mở (closed: kết ở hợp âm chủ; open: kết ở hợp âm khác); Mazurka Op. 17 số 4 là ba đoạn mà chỉ đoạn đầu là hình thức trọn vẹn. Theo nguồn chính (OMT) khi nguồn khác nhau (Britannica, Wikipedia nói mỗi đoạn tự kết). Chữ cũ: "**A B A**, trong đó mỗi đoạn **trọn vẹn và tự kết** ở giọng của nó, và B **tương phản rõ** với A (giọng khác, tính chất khác)." Chữ mới: "**A B A**: ba đoạn tách biệt, đoạn A trở lại sau đoạn B, và B **tương phản rõ** với A (thường ở giọng khác, tính chất khác)." Hình form-small sơ đồ 3 sửa theo (n54).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/" ]
    luot_2_ghi_chu: "OMT: ba đoạn riêng biệt theo mẫu ABA."
