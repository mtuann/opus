ghi_chu: "Bài ôn tập 3 (bài 10–14), tầng lõi: quiz 10 câu (n3 đến n12) và các câu về trang (n1, n2). Nguồn: Open Music Theory (Triads, Seventh Chords, Inversion, Figured Bass, Roman Numerals, Intro to Harmony, Plagal Motion, Other Aspects of Notation), COD (cadence, sforzando, ritardando). Đã sửa một chỗ: đáp án đúng của câu sfz (\"Nhấn mạnh đột ngột\" thành \"Nhấn mạnh rõ\", n11). Lời giải thích trong quiz không dựa vào vị trí lựa chọn. Không có khuông nhạc. Câu ve-site trỏ trang chưa chuyển: n2 (luyen-tap/phieu-bai-tap: giữ phiếu \"Gọi tên hợp âm ba\"; luyen-tap/xay-hop-am: giữ bộ hợp âm bảy). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): seventh chord (hợp âm bảy), dominant seventh (bảy át), fully diminished seventh (bảy giảm), half-diminished seventh (bảy nửa giảm), diminished triad (hợp âm ba giảm), second inversion (đảo 2, 6/4), figured bass (bè trầm số), Roman numeral (số La Mã), plagal cadence (kết plagal; OMT gọi plagal motion), half cadence (kết nửa), deceptive/interrupted cadence (kết lừa), ii–V–I, rit./ritardando đã có (ritardando, sforzando, cadence, triad, inversion, subdominant)."
