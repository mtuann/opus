nhan_dinh:
  - id: n1
    cau: "Bài ôn gồm kiến thức của Phần 3 (bài 10–14: hợp âm ba, hợp âm bảy và thể đảo, hòa âm chức năng, kết và câu nhạc, ký hiệu biểu diễn)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trên src/content/docs/nhac-ly/index.md: Phần 3 gồm bài 10 đến 14 rồi \"Ôn tập 3: Hợp âm, hòa âm và biểu diễn\"; các câu hỏi dùng nội dung năm bài ấy. Review: đã kiểm src/content/docs/nhac-ly/index.md dòng 33–41 (Phần 3, bài 10–14, rồi Ôn tập 3)."
    review: dung
  - id: n2
    cau: "Trước khi làm quiz nên làm phiếu bài tập \"gọi tên hợp âm ba\" (trang luyen-tap/phieu-bai-tap) và dùng công cụ xây hợp âm (trang luyen-tap/xay-hop-am) với các hợp âm bảy."
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Kiểm trên site cũ: assets/js/worksheet.js có loại phiếu \"Gọi tên hợp âm ba\"; assets/js/build.js có bộ \"Hợp âm bảy (5 loại)\" (maj7, dom7, min7, hdim7, dim7) trong công cụ \"Xây gam và hợp âm\". Hai trang đích chưa chuyển: lô chuyển chúng giữ phiếu hợp âm ba và công cụ xây hợp âm bảy. Review: đã kiểm ../opus-zero/docs/assets/js/worksheet.js (có các loại phiếu \"Gọi tên nốt khóa Sol\", \"Gọi tên nốt khóa Fa\", \"Đọc hóa biểu\", \"Gọi tên quãng (hòa âm)\", \"Gọi tên hợp âm ba\"); assets/js/build.js có bộ \"Hợp âm bảy (5 loại)\"; hai trang đích chưa chuyển."
    review: dung
  - id: n3
    cau: "Hợp âm Si – Rê – Fa là hợp âm ba giảm (3 thứ + 3 thứ), không phải thứ hay trưởng."
    loai: dinh-nghia
    nguon: [ omt-triads ]
    ket_qua: dung
    ghi_chu: "OMT Triads: hợp âm ba giảm là \"A triad whose third is minor and fifth is diminished\"; Si – Rê (3 thứ), Rê – Fa (3 thứ), Si – Fa (5 giảm)."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/triads.html" ]
    luot_2_ghi_chu: "OMT: hợp âm ba giảm = m3 và d5 trên nốt gốc; Si-Rê-Fa: 3 thứ + 3 thứ."
  - id: n4
    cau: "Trong Fa trưởng, hợp âm V7 là Đô – Mi – Sol – Si♭ (bậc V là Đô; hợp âm bảy át có quãng 7 thứ), không phải Đô – Mi – Sol – Si hay Sol – Si – Rê – Fa."
    loai: quy-tac
    nguon: [ omt-seventh ]
    ket_qua: dung
    ghi_chu: "OMT Seventh Chords: hợp âm bảy át (dominant seventh) là \"A seventh chord with a major triad and a minor seventh\"; \"V7 in the key of C is spelled G-B-D-F\". Trong Fa trưởng V là Đô: Đô – Mi – Sol, cộng 7 thứ trên Đô là Si♭."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/triads.html" ]
    luot_2_ghi_chu: "OMT: dominant seventh = M3, P5, m7 trên gốc: Đô-Mi-Sol-Si♭ (Fa trưởng, bậc V là Đô)."
  - id: n5
    cau: "Hợp âm G7 giải quyết về hợp âm C trong Đô trưởng (V7 → I), không phải F hay Am."
    loai: quy-tac
    nguon: [ omt-harmony, omt-seventh ]
    ket_qua: dung
    ghi_chu: "OMT Intro to Harmony: \"An authentic cadence occurs when the harmonic progression V–I (or V–i in minor) marks the end of a phrase\"; G7 là V7 của Đô trưởng (OMT Seventh Chords). Chương OMT không viết riêng \"V7 giải quyết về I\": suy từ V–I và định nghĩa V7. Về Am (vi) là kết lừa (COD: interrupted cadence là V rồi vi), F là IV."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/harmonicFunctions.html", "https://openmusictheory.github.io/cadenceTypes.html" ]
    luot_2_ghi_chu: "OMT: chức năng át (V, V7) giải quyết về chủ; G7 -> C trong Đô trưởng."
  - id: n6
    cau: "Hợp âm Sol trưởng với Rê ở bè trầm là thể đảo 2 (6/4), nốt năm ở bè trầm; không phải đảo 1 hay thể gốc."
    loai: dinh-nghia
    nguon: [ omt-inversion, omt-figured ]
    ket_qua: dung
    ghi_chu: "OMT Inversion: thể đảo 2 là \"A triadic harmony with the fifth in the bass\"; OMT Figured Bass: \"a second inversion triad has a fourth and a sixth above the bass\" (6/4). Rê là nốt năm của Sol – Si – Rê."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/thoroughbassFigures.html" ]
    luot_2_ghi_chu: 'OMT: ký hiệu 6/4 = "a sixth and a fourth above the bass" (thể đảo 2); Rê ở bè trầm của hợp âm Sol trưởng: Sol là quãng 4, Si là quãng 6 trên Rê.'
  - id: n7
    cau: "Chuỗi ii – V – I trong Sol trưởng là Am – D – G (bậc ii là La thứ, bậc V là Rê trưởng)."
    loai: quy-tac
    nguon: [ omt-roman ]
    ket_qua: dung
    ghi_chu: "OMT Roman Numerals: số La Mã hoa là hợp âm trưởng, thường là hợp âm thứ (\"Uppercase Roman numerals denote major triads, and lowercase ... minor triads\"); hợp âm ba dựng trên mỗi bậc của gam. Gam Sol trưởng: bậc II là La, ii = La – Đô – Mi (Am); V = Rê – Fa♯ – La (D); I = G."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/harmonicFunctions.html" ]
    luot_2_ghi_chu: "OMT: ii là tiền át (predominant), V át, I chủ; Sol trưởng: ii = La thứ (La-Đô-Mi), V = Rê trưởng, I = Sol: Am-D-G."
  - id: n8
    cau: "Trong giọng La thứ, hợp âm át có nốt đặc biệt Sol♯ (cảm âm từ gam thứ hòa âm), không phải Fa♯ hay Đô♯."
    loai: quy-tac
    nguon: [ omt-roman, omt-harmony, omt-minor ]
    ket_qua: dung
    ghi_chu: "OMT Roman Numerals: \"the minor v chord becomes a major V chord\" nhờ cảm âm nâng; OMT Intro to Harmony: ở giọng thứ hợp âm V dùng \"the leading-tone, ti\"; OMT Minor Scales: gam thứ hòa âm nâng cảm âm. Hợp âm át của La thứ là Mi – Sol♯ – Si."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/scales.html" ]
    luot_2_ghi_chu: "OMT: thứ hòa âm nâng bậc 7; La thứ: Sol♯ là cảm âm của hợp âm át Mi (Mi-Sol♯-Si)."
  - id: n9
    cau: "Câu nhạc kết bằng IV – I là kết plagal (\"Amen\"), không phải kết nửa hay kết lừa."
    loai: dinh-nghia
    nguon: [ cod-cadence, omt-plagal ]
    ket_qua: dung
    ghi_chu: "COD (cadence): \"Plagal cadence (also called Amen cadence): Chord of the subdominant followed by that of tonic\"; kết nửa (imperfect) kết ở V, kết lừa (interrupted) là V rồi vi. OMT dùng \"plagal motion\" thay cho \"plagal cadence\" (glossary: \"Occurs when IV moves to I\") vì nó thường kéo dài chủ âm hơn là kết câu; tên \"kết plagal\" theo COD và bài 13 (đã khóa)."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/plagal-cadence" ]
    luot_2_ghi_chu: 'Britannica: kết plagal là chuyển từ IV về I, còn gọi "Amen cadence".'
  - id: n10
    cau: "\"rit.\" nghĩa là chậm dần (ritardando), không phải nhanh dần hay trở lại tốc độ cũ."
    loai: dinh-nghia
    nguon: [ cod-rit ]
    ket_qua: dung
    ghi_chu: "COD: \"ritardando ... (It.). Holding back ... (gradually, i.e. same as rallentando)\"; viết tắt \"rit.\". Giải thích của quiz \"ritardando\" đúng. Review D3-gom: lượt 2 khong-chac vì không mở được nguồn; COD (bậc 2, lượt 1 trích) định nghĩa ritardando là \"holding back ... gradually\", viết tắt rit.; giữ dung."
    luot_2: khong-chac
    luot_2_ghi_chu: 'Không mở được nguồn bậc 2 (Britannica Tempo không nêu "rit."): định nghĩa chuẩn ritardando = chậm dần.'
  - id: n11
    cau: "\"sfz\" (sforzando) nghĩa là nhấn mạnh rõ (một nốt hay hợp âm nhấn mạnh), không phải rất nhỏ hay ngân dài tùy ý."
    loai: dinh-nghia
    nguon: [ cod-sforz ]
    ket_qua: da-sua
    ghi_chu: "Chữ cũ của đáp án đúng: \"Nhấn mạnh đột ngột\". COD: \"sforzando ... Direction that a note or chord be strongly accented or played in a forced manner. Usually found in abbreviation sf. or sfz.\"; OMT Notation: sfz \"slightly more forceful (i.e., louder) than regular accents\". Không nguồn nào nói \"đột ngột\", nên đổi thành \"Nhấn mạnh rõ\". Review D3-gom: lượt 2 khong-chac vì không mở được nguồn, và gợi ý \"đột ngột\" theo hiểu biết chung; COD và OMT (bậc 2, lượt 1 trích) chỉ nói \"strongly accented\", \"slightly more forceful than regular accents\", không nói \"đột ngột\"; giữ chữ mới \"Nhấn mạnh rõ\" (on-tap-3.md dòng 50)."
    luot_2: khong-chac
    luot_2_ghi_chu: "Không mở được nguồn bậc 2 về sfz (Britannica về dynamics không mở được): sforzando = nhấn mạnh đột ngột theo hiểu biết chung."
  - id: n12
    cau: "Hợp âm bảy có cấu tạo hợp âm giảm + quãng 7 giảm là hợp âm bảy giảm, không phải bảy nửa giảm hay bảy thứ; ví dụ Si – Rê – Fa – La♭."
    loai: dinh-nghia
    nguon: [ omt-seventh ]
    ket_qua: dung
    ghi_chu: "OMT Seventh Chords: hợp âm bảy giảm là \"A seventh chord whose triad is diminished and whose seventh is diminished\"; bảy nửa giảm: \"triad quality is diminished and the seventh quality is minor\". Ví dụ Si – Rê – Fa – La♭: Si – La♭ là quãng 7 giảm (Si lên La♭ 9 nửa cung = 7 giảm), hợp âm ba Si – Rê – Fa giảm; ví dụ này không có nguyên văn ở OMT (kiểm bằng tính)."
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/triads.html" ]
    luot_2_ghi_chu: 'OMT: "diminished seventh (also called fully-diminished)": Si-Rê-Fa-La♭ = ba quãng 3 thứ liên tiếp (Si-La♭ = 7 giảm).'
khuong_nhac: []
doi_chu:
  - cu: 'câu hỏi: "sfz" nghĩa là gì? | ✓ Nhấn mạnh đột ngột | Rất nhỏ | Ngân dài tùy ý | sforzando.'
    moi: 'câu hỏi: "sfz" nghĩa là gì? | ✓ Nhấn mạnh rõ | Rất nhỏ | Ngân dài tùy ý | sforzando.'
    ly_do: 'n11 (da-sua): COD: sforzando là "strongly accented"; không nguồn nào nói "đột ngột".'
