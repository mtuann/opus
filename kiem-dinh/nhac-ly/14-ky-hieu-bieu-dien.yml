nhan_dinh:
  - id: n1
    cau: Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt.
    loai: dinh-nghia
    nguon:
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT, Other Aspects of Notation: có các mục Dynamics (loudness), Articulation (connection or separation between notes), Tempo (how fast or slow). Dòng này cũng là mô tả trang (frontmatter).'
  - id: n2
    cau: Phần lớn các ký hiệu này dùng tiếng Ý, loại thuật ngữ được đưa vào từ thế kỷ 17 và dùng đến nay.
    loai: lich-su
    nguon:
      - brit-expr
      - omt-notation
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "... dùng tiếng Ý, ngôn ngữ chung của âm nhạc từ thời Baroque." Chữ mới như trên. Britannica, Musical expression: "The 17th century saw the introduction of the Italian terms that have been in use ever since" và "Italian remains the dominant language for such indications"; OMT: "many tempo markings are in Italian or another non-English language". Không nguồn nào gọi tiếng Ý là "ngôn ngữ chung".'
  - id: n3
    cau: Hầu hết thuật ngữ trong bài đều có trong từ điển thuật ngữ (/opus/nhac-ly/tu-dien/), kèm thẻ ghi nhớ để ôn.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tất cả thuật ngữ trong bài đều có trong từ điển thuật ngữ". Chữ mới: "Hầu hết". src/data/thuat-ngu.yml (150 mục) không có mục riêng cho pralltriller, 8va / 8vb, decresc., segno, al Coda. Bản cũ ../opus-zero/docs/nhac-ly/tu-dien.md có thẻ ghi nhớ (oz-flashcards); trang tu-dien chưa chuyển ở site mới. Ghi cho D3-L5: thêm các mục còn thiếu.'
  - id: n4
    cau: Thuật ngữ tốc độ chính đã có ở trang máy đếm nhịp (/opus/luyen-tap/metronome/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: Bản cũ ../opus-zero/docs/luyen-tap/metronome.md có bảng thuật ngữ tốc độ (Largo, Adagio, Andante, Allegro, Presto… kèm khoảng BPM, dòng 22-27). Trang đích chưa chuyển ("sắp có").
  - id: n5
    cau: 'accelerando (accel.): nhanh dần.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - trinity
      - dol5
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "A gradual increase in speed (tempo)"; OMT: "accelerando (accel.) for a gradual increase". Trinity: "Accelerando (accel.) Getting gradually faster". Dolmetsch bài 5: "accelerando, accel. | getting steadily faster".'
  - id: n6
    cau: 'ritardando (rit.), rallentando (rall.): chậm dần.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - trinity
      - dol5
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Ritardando: A gradual decrease in speed"; OMT: "ritardando (rit.) for a gradual decrease". Dolmetsch bài 5: "ritardando, rit., ritard. | getting gradually slower", "rallentando, rall. | getting gradually slower". Trinity có Rallentando (rall.) cùng nghĩa.'
  - id: n7
    cau: 'a tempo: trở lại tốc độ ban đầu.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - dol5
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Used after tempo alterations, such as ritardando or accelerando. Indicates a return to the original tempo." Dolmetsch: "a tempo | returning to a previous tempo".'
  - id: n8
    cau: 'rubato: co giãn tốc độ tự do để diễn cảm.'
    loai: dinh-nghia
    nguon:
      - cod-rubato
      - trinity
      - dol5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Co giãn tốc độ tự do để diễn cảm, rất phổ biến khi chơi Chopin". Chữ mới bỏ vế sau (xem câu kế). Concise Oxford Dictionary of Music: "Robbed time. A feature of perf. in which strict time is for a while disregarded"; Trinity: "Rubato Robbed (flexible in time)". Lưu ý: Dolmetsch bài 5 mô tả rubato là chỉ dẫn về hình dáng nhịp điệu chứ không đổi tốc độ tổng thể ("the overall tempo remains unchanged"); "co giãn tốc độ" hiểu là co giãn tạm thời quanh một tốc độ không đổi, không mâu thuẫn.'
  - id: n9
    cau: 'rubato: rất phổ biến khi chơi Chopin.'
    loai: lich-su
    nguon:
      - cod-rubato
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang. Concise Oxford Dictionary of Music: "The question of rubato in Chopin is particularly contentious" và ghi lại rằng Chopin (và Mozart) giữ tay trái đúng nhịp; không nguồn bậc 1-2 nào nói "rất phổ biến khi chơi Chopin". Ghi cho D3-L5: bản ghi rubato ở src/data/thuat-ngu.yml còn ghi_chu "Đặc trưng khi chơi Chopin", cần xem lại.'
  - id: n10
    cau: 'più mosso / meno mosso: nhanh hơn / chậm hơn.'
    loai: dinh-nghia
    nguon:
      - trinity
      - dol5
    ket_qua: dung
    ghi_chu: 'Trinity: "Più mosso Quicker at once", "Meno mosso Slower at once". Dolmetsch bài 5: "take the new section at a faster (slower) steady pace than the preceding section".'
  - id: n11
    cau: 'pp, pianissimo: rất nhỏ.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - brit-expr
    ket_qua: dung
    ghi_chu: 'OMT: mezzo, -issimo và hậu tố chồng tạo thang từ rất nhỏ đến rất to; Britannica: piano (p) và forte (f), thang từ pianissimo (pp) đến fortissimo (ff).'
  - id: n12
    cau: 'p, piano: nhỏ.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'OMT: "The dynamic marking forte means loud, while piano means quiet"; Glossary "piano: Quiet."'
  - id: n13
    cau: 'mp, mezzo piano: hơi nhỏ.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "mezzo: Moderately", nên mezzo piano là "vừa nhỏ", tức hơi nhỏ.'
  - id: n14
    cau: 'mf, mezzo forte: hơi to.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'Như trên: mezzo forte là "vừa to", tức hơi to.'
  - id: n15
    cau: 'f, forte: to.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'OMT: "forte means loud"; Glossary "forte: Loud."'
  - id: n16
    cau: 'ff, fortissimo: rất to.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - brit-expr
    ket_qua: dung
    ghi_chu: OMT và Britannica như câu pp.
  - id: n17
    cau: 'cresc. hoặc dấu < (crescendo): to dần.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'OMT: "Crescendo (cresc.) means to get louder" và có thể viết bằng hairpin; Glossary: "Getting gradually louder; sometimes represented in notated scores with a hairpin symbol."'
  - id: n18
    cau: 'dim., decresc. hoặc dấu > (diminuendo): nhỏ dần.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'OMT: "decrescendo (decresc.) and diminuendo (dim.) both mean to get quieter" và có thể viết bằng hairpin.'
  - id: n19
    cau: 'sfz (sforzando): nhấn mạnh đột ngột một nốt.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - brit-expr
    ket_qua: dung
    ghi_chu: 'OMT: sfz, sf, fz là dấu nhấn mạnh hơn accent, đặt như dấu động lực. Britannica: sforzato (sfz) là "a sudden, sharp accent", sforzando (sf) nhẹ hơn một chút.'
  - id: n20
    cau: 'fp (forte-piano): to rồi nhỏ ngay.'
    loai: dinh-nghia
    nguon:
      - dol-fp
    ket_qua: dung
    ghi_chu: 'Dolmetsch Online, Music Dictionary: "fp., fpp.: fortepiano, ''loud, then immediately p. or pp.''"'
  - id: n21
    cau: Cây đàn piano có tên đầy đủ là pianoforte, nghĩa là "nhỏ – to".
    loai: ten
    nguon:
      - met
    ket_qua: dung
    ghi_chu: 'Metropolitan Museum: Maffei gọi nhạc cụ là "gravicembalo col piano, e forte" (harpsichord with soft and loud); "The pianoforte, more commonly called the piano". "Tên đầy đủ" hiểu là dạng dài của tên đàn.'
  - id: n22
    cau: Khác harpsichord, piano chơi to hay nhỏ theo lực ngón.
    loai: dinh-nghia
    nguon:
      - met
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "... theo lực ngón mà vẫn đủ vang (clavichord cũng làm được, nhưng rất nhỏ tiếng)". Chữ mới bỏ "mà vẫn đủ vang". Met: harpsichord "a louder and more brilliant instrument, but lacked the ability to respond to the strength of the player''s touch".'
  - id: n23
    cau: Clavichord cũng chơi to nhỏ theo lực ngón, nhưng rất nhỏ tiếng.
    loai: dinh-nghia
    nguon:
      - met
    ket_qua: dung
    ghi_chu: 'Met: clavichord "is also capable of detailed gradations of loud and soft controlled by the player''s touch" nhưng "so soft that it can barely be heard a few feet away".'
  - id: n24
    cau: Trang Lịch sử cây đàn piano (/opus/piano/lich-su-dan/) tồn tại.
    loai: ve-site
    ket_qua: dung
    ghi_chu: Bản cũ ../opus-zero/docs/piano/lich-su-dan.md tồn tại (so sánh clavichord, harpsichord, piano, Maffei 1711 "gravicembalo col piano, e forte"). Trang đích chưa chuyển ("sắp có").
  - id: n25
    cau: 'Staccato: chấm trên hoặc dưới nốt, ngắt ngắn.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - dol-sym
      - dol21
    ket_qua: dung
    ghi_chu: 'OMT: "Staccato means to play or sing notes more separated, leaving space between notes." Dolmetsch Musical Symbols: staccato "usually appearing as a stroke, dot or wedge" đặt trên hoặc dưới đầu nốt.'
  - id: n26
    cau: 'Legato (dấu luyến): đường cong nối các nốt, chơi liền mạch.'
    loai: dinh-nghia
    nguon:
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT: "Legato means to play or sing smoothly or connected." Ghi bằng dấu luyến (slur). Tên "dấu luyến" là lựa chọn của site.'
  - id: n27
    cau: 'Accent (>): nhấn.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
    ket_qua: dung
    ghi_chu: 'OMT: "An accent (a sideways V) means to play or sing a note with extra stress or emphasis."'
  - id: n28
    cau: 'Tenuto (gạch ngang ngắn): giữ đủ độ dài, hơi nhấn.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - dol-sym
      - dol21
      - trinity
    ket_qua: dung
    ghi_chu: 'Dolmetsch Musical Symbols: "note held to its written length, i.e. not detached", đặt trên hoặc dưới đầu nốt; Dolmetsch bài 21: "Tenuto can mean either hold the note in question its full length" hoặc chơi hơi to hơn; Trinity: "Tenuto (Ten.) Held or sustained". OMT: "smooth, connected playing marked by a small line above or below the notes". Vế "hơi nhấn" là một trong hai cách hiểu của Dolmetsch.'
  - id: n29
    cau: 'Fermata (vòng cung có chấm): ngân dài tùy ý.'
    loai: dinh-nghia
    nguon:
      - cod-fermata
      - dol-sym
      - omt-notation
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hình con mắt (vòng cung có chấm)". Chữ mới bỏ "hình con mắt". COD: "fermata (It.)... A pause" kèm dấu vòng cung có chấm; Dolmetsch: "a musical symbol placed over a note or rest to be extended beyond its normal duration"; OMT: "A fermata indicates that a note should be held longer than its regular duration". "Tùy ý": nguồn chỉ nói "longer than regular duration" (một từ điển khác ghi "at performer''s discretion"); giữ "tùy ý", ghi để D3-L5 xem.'
