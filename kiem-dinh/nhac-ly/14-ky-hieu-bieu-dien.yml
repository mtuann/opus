nhan_dinh:
  - id: n1
    cau: Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt.
    loai: dinh-nghia
    nguon:
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT, Other Aspects of Notation: có các mục Dynamics (loudness), Articulation (connection or separation between notes), Tempo (how fast or slow). Dòng này cũng là mô tả trang (frontmatter).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/print/article/399165" ]
    luot_2_ghi_chu: "Britannica: tempo, dynamics, expression là các ký hiệu bổ sung ngoài cao độ, trường độ."
  - id: n2
    cau: Phần lớn các ký hiệu này dùng tiếng Ý, loại thuật ngữ được đưa vào từ thế kỷ 17 và dùng đến nay.
    loai: lich-su
    nguon:
      - brit-expr
      - omt-notation
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "... dùng tiếng Ý, ngôn ngữ chung của âm nhạc từ thời Baroque." Chữ mới như trên. Britannica, Musical expression: "The 17th century saw the introduction of the Italian terms that have been in use ever since" và "Italian remains the dominant language for such indications"; OMT: "many tempo markings are in Italian or another non-English language". Không nguồn nào gọi tiếng Ý là "ngôn ngữ chung". Review D3-gom: chữ mới có ở đoạn mở đầu và description; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/print/article/399165" ]
    luot_2_ghi_chu: "Britannica: 'The 17th century saw the introduction of the Italian terms that have been in use ever since' (thuật ngữ tốc độ)."
  - id: n3
    cau: Hầu hết thuật ngữ trong bài đều có trong từ điển thuật ngữ (/opus/nhac-ly/tu-dien/), kèm thẻ ghi nhớ để ôn.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tất cả thuật ngữ trong bài đều có trong từ điển thuật ngữ". Chữ mới: "Hầu hết". src/data/thuat-ngu.yml (150 mục) không có mục riêng cho pralltriller, 8va / 8vb, decresc., segno, al Coda. Bản cũ ../opus-zero/docs/nhac-ly/tu-dien.md có thẻ ghi nhớ (oz-flashcards); trang tu-dien chưa chuyển ở site mới. Ghi cho D3-L5: thêm các mục còn thiếu. Review: trang đích đã có ở nhánh này: src/content/docs/nhac-ly/tu-dien.md có mục "Ôn bằng thẻ ghi nhớ" (::cong-cu{ten="flashcards"}); đối chiếu src/data/thuat-ngu.yml (154 mục) với khoảng 48 thuật ngữ của bài: thiếu mục riêng cho decrescendo, fp, dấu nhắc lại, 8va/8vb và láy trên (upper mordent); "hầu hết" đúng.'
    review: dung
  - id: n4
    cau: Thuật ngữ tốc độ chính đã có ở trang máy đếm nhịp (/opus/luyen-tap/metronome/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bản cũ ../opus-zero/docs/luyen-tap/metronome.md có bảng thuật ngữ tốc độ (Largo, Adagio, Andante, Allegro, Presto… kèm khoảng BPM, dòng 22-27). Trang đích chưa chuyển ("sắp có"). Review: trang đích chưa chuyển; ../opus-zero/docs/luyen-tap/metronome.md dòng 20–27 có bảng thuật ngữ tốc độ (Largo … Presto).'
    review: dung
  - id: n5
    cau: 'accelerando (accel.): nhanh dần.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - trinity
      - dol5
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "A gradual increase in speed (tempo)"; OMT: "accelerando (accel.) for a gradual increase". Trinity: "Accelerando (accel.) Getting gradually faster". Dolmetsch bài 5: "accelerando, accel. | getting steadily faster".'
    luot_2: dung
    luot_2_nguon: [ "https://dictionary.onmusic.org/appendix/topics/tempo-terminology" ]
    luot_2_ghi_chu: "accelerando: nhanh dần."
  - id: n6
    cau: 'ritardando (rit.), rallentando (rall.): chậm dần.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - trinity
      - dol5
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Ritardando: A gradual decrease in speed"; OMT: "ritardando (rit.) for a gradual decrease". Dolmetsch bài 5: "ritardando, rit., ritard. | getting gradually slower", "rallentando, rall. | getting gradually slower". Trinity có Rallentando (rall.) cùng nghĩa.'
    luot_2: dung
    luot_2_nguon: [ "https://dictionary.onmusic.org/appendix/topics/tempo-terminology" ]
    luot_2_ghi_chu: "ritardando = rallentando: chậm dần."
  - id: n7
    cau: 'a tempo: trở lại tốc độ ban đầu.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - dol5
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Used after tempo alterations, such as ritardando or accelerando. Indicates a return to the original tempo." Dolmetsch: "a tempo | returning to a previous tempo".'
    luot_2: dung
    luot_2_nguon: [ "https://dictionary.onmusic.org/appendix/topics/tempo-terminology" ]
    luot_2_ghi_chu: "a tempo: trở về tốc độ gốc sau accel./rit."
  - id: n8
    cau: 'rubato: co giãn tốc độ tự do để diễn cảm.'
    loai: dinh-nghia
    nguon:
      - cod-rubato
      - trinity
      - dol5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Co giãn tốc độ tự do để diễn cảm, rất phổ biến khi chơi Chopin". Chữ mới bỏ vế sau (xem câu kế). Concise Oxford Dictionary of Music: "Robbed time. A feature of perf. in which strict time is for a while disregarded"; Trinity: "Rubato Robbed (flexible in time)". Lưu ý: Dolmetsch bài 5 mô tả rubato là chỉ dẫn về hình dáng nhịp điệu chứ không đổi tốc độ tổng thể ("the overall tempo remains unchanged"); "co giãn tốc độ" hiểu là co giãn tạm thời quanh một tốc độ không đổi, không mâu thuẫn. Review D3-gom: chữ mới có ở bảng tốc độ; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://dictionary.onmusic.org/appendix/topics/tempo-terminology", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rubato" ]
    luot_2_ghi_chu: "rubato: 'stealing time', tự do về thời gian để diễn cảm."
  - id: n9
    cau: 'rubato: rất phổ biến khi chơi Chopin.'
    loai: lich-su
    nguon:
      - cod-rubato
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang. Concise Oxford Dictionary of Music: "The question of rubato in Chopin is particularly contentious" và ghi lại rằng Chopin (và Mozart) giữ tay trái đúng nhịp; không nguồn bậc 1-2 nào nói "rất phổ biến khi chơi Chopin". Ghi cho D3-L5: bản ghi rubato ở src/data/thuat-ngu.yml còn ghi_chu "Đặc trưng khi chơi Chopin", cần xem lại. Review D3-gom: đã kiểm trang không còn chữ "Chopin".'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rubato" ]
    luot_2_ghi_chu: "Oxford: 'The question of rubato in Chopin is particularly contentious' - rubato gắn chặt với Chopin; 'rất phổ biến' hợp lý, không có nguồn số liệu."
