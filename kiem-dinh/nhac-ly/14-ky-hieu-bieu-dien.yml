  - id: n39
    cau: 'Dấu nhắc lại (vạch kép có hai chấm, ở đầu và cuối đoạn): nhắc lại đoạn giữa hai dấu.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - dol-sym
    ket_qua: null
    ghi_chu: 'chưa chắc: nghĩa đúng (OMT: "Repeat signs indicate that a section of music should be repeated"; Dolmetsch: "the ''repetition'' signs indicates that a section of a piece of music is to be played a second time"). Hình "vạch kép có hai chấm" không nằm trong chữ của nguồn nào đã đọc (Dolmetsch: không nhắc hai chấm).'
  - id: n40
    cau: 'Ngoặc 1., 2. (prima/seconda volta): lần 1 chơi ngoặc 1, lần nhắc lại bỏ qua ngoặc 1, chơi ngoặc 2.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - dol-sym
      - trinity
    ket_qua: dung
    ghi_chu: 'OMT: "First and second endings ... handle differing endings"; Dolmetsch: ngoặc 1 là "a section performed only the first time it is reached", ngoặc 2 đánh dấu tương tự với "2."; Trinity: "1ma volta (1st time) and 2da volta (2nd time)".'
  - id: n41
    cau: 'D.C. (Da Capo): quay lại từ đầu.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - trinity
      - dol-sym
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Da capo al fine means to go back to the beginning of the work..."; Trinity: "Da Capo From the beginning."; Dolmetsch: "D.C. (Italian: from the beginning)".'
  - id: n42
    cau: 'D.S. (Dal Segno): quay lại từ dấu Segno.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
      - trinity
      - dol-sym
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Quay lại từ dấu Segno (chữ S có gạch chéo và hai chấm)". Chữ mới bỏ phần mô tả dấu. OMT Glossary: "Dal segno al fine means to go back to the sign and play or sing to the Fine."; Trinity: "Dal Segno From the sign"; Dolmetsch: "D.S. (abbrev.): (Italian) from the sign".'
  - id: n43
    cau: Dấu Segno có hình chữ S có gạch chéo và hai chấm.
    loai: dinh-nghia
    nguon:
      - dol-sym
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: Dolmetsch Musical Symbols chỉ ghi "the sign or segno (Italian: sign)"; COD chỉ ghi "The ''sign''"; không nguồn bậc 1-2 nào đọc được mô tả hình.'
  - id: n44
    cau: 'Fine: kết thúc ở đây (sau khi quay lại).'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
      - trinity
    ket_qua: dung
    ghi_chu: 'OMT: "D.C. al Fine: play from the beginning and stop at the Fine"; Trinity: "Fine The end."'
  - id: n45
    cau: 'al Coda và dấu Coda (vòng tròn có dấu cộng): nhảy tới phần Coda.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - dol-sym
    ket_qua: dung
    ghi_chu: 'OMT: D.C. al Coda: chơi từ đầu đến khi gặp D.C. al Coda, rồi nhảy tới dấu "to Coda" và tiếp tục sang Coda. Dolmetsch: dấu coda là "a circle or oval with a cross inside it".'
  - id: n46
    cau: 'tr: láy rền (trill), đổi nhanh liên tục giữa nốt chính và nốt trên.'
    loai: dinh-nghia
    nguon:
      - cod-trill
    ket_qua: dung
    ghi_chu: 'COD: "trill (shake). Ornament comprising rapid alternation of main note and note above"; ký hiệu là chữ "tr" và đường lượn sóng.'
  - id: n47
    cau: 'Răng cưa ngắn, không gạch: láy trên (pralltriller), nốt chính – nốt trên – nốt chính, rất nhanh.'
    loai: dinh-nghia
    nguon:
      - dol23
      - cod-mordent
    ket_qua: null
    ghi_chu: 'chưa chắc: chữ cũ có thêm "(trong nhạc Baroque thường bắt đầu từ nốt trên)", đã bỏ. Dolmetsch bài 23: mordent trên (upper mordent, Schneller) viết bằng dấu láy không gạch, ba nốt: nốt viết, nốt trên, nốt viết; COD, mục mordent: có "upper and lower mordents". Tên "pralltriller" không có trong COD, và Dolmetsch không nói thẳng pralltriller = upper mordent; chưa có nguồn bậc 1-2 xác nhận cái tên đó cho láy trên.'
  - id: n48
    cau: 'Răng cưa ngắn có gạch dọc: láy dưới (mordent), nốt chính – nốt dưới – nốt chính, rất nhanh.'
    loai: dinh-nghia
    nguon:
      - dol23
      - cod-mordent
    ket_qua: dung
    ghi_chu: 'Dolmetsch bài 23: mordent "written as a shake sign crossed by a vertical line", ba nốt: nốt viết, nốt dưới, nốt viết. COD, mục mordent: có upper và lower mordent; "In Ger. Mordent means only the lower mordent" và khuyên dùng "upper/lower" để khỏi nhầm.'
  - id: n49
    cau: 'Hình chữ S nằm ngang: láy quanh (turn), nốt trên – nốt chính – nốt dưới – nốt chính.'
    loai: dinh-nghia
    nguon:
      - cod-gruppetto
      - omt-gloss
      - dol23
      - ieee1599
    ket_qua: dung
    ghi_chu: 'COD, mục gruppetto: "a 4-note figure, the note above, the note itself, the note below, and the note itself"; OMT Glossary: turn "decorate a note with its upper and lower neighbor, in that order"; Dolmetsch bài 23: "the note above, the note itself, the note below, then the note itself again". Hình dạng: tài liệu IEEE 1599: "a mirrored S-shape lying on its side above the staff".'
  - id: n50
    cau: 'Nốt nhỏ có gạch chéo: acciaccatura, nốt luyến cực nhanh ngay trước nốt chính.'
    loai: dinh-nghia
    nguon:
      - cod-acciac
      - dol-sym
      - dol23
    ket_qua: dung
    ghi_chu: 'COD: "A species of grace note, indicated by a small note with its stem crossed through"; nốt chính "retains its accent and almost all its time-value"; Dolmetsch: "''crushed'' note, grace note (written with a diagonal line through the note stem)", "very short".'
  - id: n51
    cau: 'Nốt nhỏ không gạch: appoggiatura, nốt dựa, chiếm một phần độ dài nốt chính.'
    loai: dinh-nghia
    nguon:
      - cod-appog
      - dol-sym
      - dol23
    ket_qua: dung
    ghi_chu: 'COD: "Leaning note"; thường chiếm khoảng nửa giá trị nốt nó dựa vào (hai phần ba nếu nốt chấm dôi); Dolmetsch: "''leaning'' note, ornamental note (written without a diagonal line through the note stem)".'
  - id: n52
    cau: '8va: chơi cao hơn một quãng tám so với nốt viết; 8vb: thấp hơn một quãng tám.'
    loai: dinh-nghia
    nguon:
      - dol-oct
    ket_qua: dung
    ghi_chu: 'Dolmetsch (vần O): "the notation 8va is sometimes seen in sheet music, meaning ''play this an octave higher than written''", "the similar notation 8vb (ottava bassa)"; ottava alta/bassa: "play notes under this sign one octave higher (lower) than written".'
  - id: n53
    cau: 'Ped. và dấu *: nhấn và nhả bàn đạp vang của piano.'
    loai: dinh-nghia
    nguon:
      - trinity
      - dol-ped
    ket_qua: dung
    ghi_chu: 'Trinity: "In piano music it indicates that the right pedal is to be pressed down with the foot, and kept in that position until the * (or a change of harmony) occurs, when the pedal should be raised." Dolmetsch: "Ped.... indicating the use of the right or damper pedal".'
  - id: n54
    cau: 'pizz. (pizzicato): đàn dây gảy bằng ngón tay; arco: trở lại kéo vĩ.'
    loai: dinh-nghia
    nguon:
      - trinity
      - dol21
    ket_qua: dung
    ghi_chu: 'Trinity: "Pizzicato (pizz.) Plucked. Direction to string player to pluck the strings instead of playing them with the bow"; "Col arco With the bow". Dolmetsch bài 21: pizzicato "plucking the string with the tip of the finger or thumb", arco "bowing as opposed to pizzicato".'
  - id: n55
    cau: 'Luyện tập kèm theo: Thẻ thuật ngữ (/opus/nhac-ly/tu-dien/) mỗi ngày, và máy đếm nhịp để cảm nhận các tốc độ Adagio, Allegro…'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bản cũ ../opus-zero/docs/nhac-ly/tu-dien.md: "Mỗi ngày site đưa ra tối đa 10 thẻ mới" (oz-flashcards); luyen-tap/metronome.md có bảng Adagio, Allegro (dòng 22-26). Trang đích chưa chuyển ("sắp có"). "Mỗi ngày" là lời khuyên tập.'
  - id: n56
    cau: 'Hộp "Trên phím đàn": Ped. và * (nhấn và nhả bàn đạp vang), una corda / tre corde (bàn đạp trái), m.d. / m.s. (tay phải / tay trái): vài ký hiệu hay gặp trên bản nhạc piano.'
    loai: dinh-nghia
    nguon:
      - trinity
      - dol-ped
    ket_qua: da-sua
    ghi_chu: 'Trinity: "In modern music the words Una Corda indicate the use of the left pedal; and the words Tre Corde show where it should be raised"; "Mano Destra (It.) M.D. = R.H.", "Mano Sinistra (It.) M.S. = L.H.". Vế "chỉ gặp trên bản nhạc piano": Dolmetsch (vần P) ghi Ped. còn dùng trong nhạc organ (nốt chơi bằng bàn đạp chân), nên "chỉ" quá chặt. Người giao (agent làm lô) sửa: "chỉ gặp" thành "hay gặp".'
  - id: n57
    cau: Trang Bàn đạp (/opus/piano/ban-dap/) và Nốt hoa mỹ (/opus/piano/not-hoa-my/) tồn tại; Nốt hoa mỹ giải thích kỹ các loại láy.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Bản cũ ../opus-zero/docs/piano/ban-dap.md ("Bàn đạp"; bảng Ký hiệu có una corda (u.c.), tre corde (t.c.)) và piano/not-hoa-my.md ("Nốt hoa mỹ: láy rền, láy, láy quanh, appoggiatura"; có mục Láy rền và bảng ký hiệu có Trillo, Mordant). Trang đích chưa chuyển ("sắp có"). "Hai loại láy": trang cũ nói kỹ láy rền và láy dưới (và cả láy quanh); người giao (agent làm lô) sửa "hai loại láy" thành "các loại láy" cho khớp trang đích.'
  - id: n58
    cau: 'Câu hỏi 1: Ký hiệu mf nghĩa là gì? Đáp án: hơi to (mezzo forte).'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
    ket_qua: dung
    ghi_chu: 'Như câu mf ở bảng Cường độ. Lựa chọn sai: Rất to, Hơi nhỏ.'
  - id: n59
    cau: 'Câu hỏi 2: "a tempo" nghĩa là gì? Đáp án: trở lại tốc độ ban đầu; giải thích: thường xuất hiện sau rit. hoặc rall.'
    loai: dinh-nghia
    nguon:
      - omt-gloss
      - omt-notation
    ket_qua: dung
    ghi_chu: 'OMT Glossary: "Used after tempo alterations, such as ritardando or accelerando." Lựa chọn sai: chậm dần, tự do về tốc độ.'
  - id: n60
    cau: 'Câu hỏi 3: Chấm nhỏ trên nốt nhạc nghĩa là staccato, ngắt ngắn; chấm dôi nằm bên phải nốt, staccato nằm trên hoặc dưới đầu nốt.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-notating
      - dol-sym
    ket_qua: dung
    ghi_chu: 'OMT, Notating Rhythm: dấu chấm dôi tăng độ dài thêm một nửa và đặt "immediately after a note or rest"; staccato: Dolmetsch, Musical Symbols, đặt trên hoặc dưới đầu nốt. Lựa chọn sai: chấm dôi, fermata.'
  - id: n61
    cau: 'Câu hỏi 4: D.C. al Fine nghĩa là quay lại từ đầu và dừng ở chữ Fine; Da Capo: "từ đầu".'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - omt-gloss
      - trinity
    ket_qua: dung
    ghi_chu: 'OMT: "D.C. al Fine: play from the beginning and stop at the Fine." Lựa chọn sai: nhảy tới Coda (đó là D.C. al Coda), nhắc lại giữa hai dấu nhắc lại.'
  - id: n62
    cau: 'Câu hỏi 5: Pizzicato là kỹ thuật của đàn dây như violin, cello (gảy dây bằng ngón tay thay vì kéo vĩ).'
    loai: dinh-nghia
    nguon:
      - trinity
      - dol21
    ket_qua: dung
    ghi_chu: 'Như câu pizzicato ở mục Một số ký hiệu khác. Lựa chọn sai: Piano, Kèn đồng.'
  - id: n63
    cau: 'Mục Nguồn: link tới /opus/tai-lieu-tham-khao/.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: Bản cũ ../opus-zero/docs/tai-lieu-tham-khao.md tồn tại. Trang đích chưa chuyển ("sắp có").
khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
    ket_qua: dung
    ghi_chu: 'Soạn cho trang này. M:4/4, L:1/4, Q:1/4=90, K:C: !p! C D E F | !crescendo(! G A B c !crescendo)! | !f! c B A G | !diminuendo(! F E D C !diminuendo)! |]: bốn ô, mỗi ô bốn nốt đen; p, crescendo, f, diminuendo đúng như tiêu đề "nhỏ, to dần, to, nhỏ dần" và các ký hiệu ở bảng Cường độ. abcjs (public/vendor/abcjs-basic-min.js, parseOnly) không cảnh báo; ô đủ độ dài theo tools/khuong-nhac.mjs (15 khối của bốn trang, 0 lỗi).'
  - khoi: 2
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
    ket_qua: dung
    ghi_chu: 'Soạn cho trang này. M:4/4, L:1/4, K:C: .C .D .E .F | (G A B c) | !>!c !>!G !tenuto!E !tenuto!C | !fermata!C4 |]: ô 1 staccato (chấm), ô 2 legato (dấu luyến), ô 3 hai accent rồi hai tenuto, ô 4 nốt tròn với fermata; khớp tiêu đề "Staccato – legato – accent – tenuto – fermata" và bảng Cách diễn tấu. Mỗi ô đủ 4 phách; không cảnh báo abcjs.'
  - khoi: 3
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
    ket_qua: dung
    ghi_chu: 'Soạn cho trang này. M:4/4, L:1/4, Q:1/4=110, K:C: |: C D E F |[1 G F E D :|[2 G G c2 |]: đoạn nhắc lại với ngoặc 1 (G F E D :|) và ngoặc 2 (G G c2 |]), ô nào cũng đủ 4 phách (c2 = 2 phách). Đúng với dòng "Ngoặc 1., 2." của bảng Dấu nhắc lại. Không cảnh báo abcjs.'
doi_chu:
  - cu:
      - Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt. Phần lớn các ký hiệu này dùng tiếng Ý, ngôn ngữ chung của âm nhạc từ thời Baroque.
      - Tất cả thuật ngữ trong bài đều có trong từ điển thuật ngữ, kèm thẻ ghi nhớ để ôn.
    moi:
      - Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt. Phần lớn các ký hiệu này dùng tiếng Ý, loại thuật ngữ được đưa vào từ thế kỷ 17 và dùng đến nay.
      - Hầu hết thuật ngữ trong bài đều có trong từ điển thuật ngữ, kèm thẻ ghi nhớ để ôn.
    ly_do: 'Mô tả trang (frontmatter) lấy từ đoạn đầu, nên đổi theo n2: đoạn đầu không còn vế "ngôn ngữ chung của âm nhạc từ thời Baroque".; n2 (da-sua): Britannica, Musical expression: "The 17th century saw the introduction of the Italian terms that have been in use ever since" và "Italian remains the dominant language for such indications". Câu cũ "ngôn ngữ chung của âm nhạc từ thời Baroque" nói quá (OMT, Other Aspects of Notation, xếp Baroque c. 1600-1750, khớp thế kỷ 17 nhưng "ngôn ngữ chung" thì không nguồn nào nói); viết lại sát nguồn.; n3 (da-sua): src/data/thuat-ngu.yml không có mục riêng cho pralltriller, 8va / 8vb, decresc., segno, al Coda; nên "tất cả" sai.'
  - cu: Co giãn tốc độ tự do để diễn cảm, rất phổ biến khi chơi Chopin
    moi: Co giãn tốc độ tự do để diễn cảm
    ly_do: 'n8, n9 (da-bo/da-sua): nghĩa rubato có nguồn (Concise Oxford Dictionary of Music); câu "rất phổ biến khi chơi Chopin" không có nguồn bậc 1-2 đã mở, bỏ.'
  - cu: 'Cây đàn piano có tên đầy đủ là pianoforte, nghĩa là "nhỏ – to": khác harpsichord, nó chơi to hay nhỏ theo lực ngón mà vẫn đủ vang (clavichord cũng làm được, nhưng rất nhỏ tiếng). Xem Lịch sử cây đàn piano.'
    moi: 'Cây đàn piano có tên đầy đủ là pianoforte, nghĩa là "nhỏ – to": khác harpsichord, nó chơi to hay nhỏ theo lực ngón (clavichord cũng làm được, nhưng rất nhỏ tiếng). Xem Lịch sử cây đàn piano.'
    ly_do: "n22 (da-sua): Metropolitan Museum of Art, The Pianofortes of Bartolomeo Cristofori: harpsichord \"lacked the ability to respond to the strength of the player's touch\"; clavichord có độ to nhỏ theo lực ngón nhưng \"so soft that it can barely be heard a few feet away\". Vế \"mà vẫn đủ vang\" của piano không có trong phần đã đọc, bỏ."
  - cu: Hình con mắt (vòng cung có chấm)
    moi: Vòng cung có chấm
    ly_do: 'n29 (da-sua): "hình con mắt" là cách ví von, không nguồn nào dùng; Concise Oxford Dictionary of Music vẽ dấu fermata là vòng cung có chấm (A pause, ký hiệu ⩀). Giữ phần mô tả hình dạng có nguồn.'
  - cu: Quay lại từ dấu Segno (chữ S có gạch chéo và hai chấm)
    moi: Quay lại từ dấu Segno
    ly_do: "n42, n43 (da-bo/da-sua): mô tả hình dáng dấu segno không có nguồn đọc được; giữ nghĩa dal segno (Concise Oxford Dictionary of Music)."
  - cu: Nốt chính – nốt trên – nốt chính, rất nhanh (trong nhạc Baroque thường bắt đầu từ nốt trên)
    moi: Nốt chính – nốt trên – nốt chính, rất nhanh
    ly_do: "n47 (da-sua): vế trong ngoặc về nhạc Baroque không có nguồn bậc 1-2 đã mở, bỏ."
  - cu: Open Music Theory; musictheory.net.
    moi:
      - Open Music Theory, Glossary.
      - "The Concise Oxford Dictionary of Music (Kennedy, Bourne) qua Encyclopedia.com: các mục rubato, ritardando, accelerando, fermata, da capo, dal segno, coda, acciaccatura, appoggiatura, mordent, turn…"
      - "Trinity College London, bảng thuật ngữ và ký hiệu (cấp độ 1-2); Dolmetsch Online, Music Theory Online: Musical Terms."
    ly_do: "Mục Nguồn: thay link chung bằng các nguồn đã mở khi kiểm định (lượt 1); bỏ musictheory.net vì không đọc được chữ."
  - cu: "mô tả: Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt. Phần lớn các ký hiệu này dùng tiếng Ý, ngôn ngữ chung của âm…"
    moi: "mô tả: Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt. Phần lớn các ký hiệu này dùng tiếng Ý, loại thuật ngữ được đưa…"
    ly_do: 'Mô tả trang lấy từ đoạn đầu, đổi theo n2.'
  - cu: "Vài ký hiệu chỉ gặp trên bản nhạc piano: Ped. và * (nhấn và nhả bàn đạp vang), una corda / tre corde (bàn đạp trái), m.d. / m.s. (tay phải / tay trái). Xem Bàn đạp và Nốt hoa mỹ, nơi giải thích kỹ hai loại láy."
    moi: "Vài ký hiệu hay gặp trên bản nhạc piano: Ped. và * (nhấn và nhả bàn đạp vang), una corda / tre corde (bàn đạp trái), m.d. / m.s. (tay phải / tay trái). Xem Bàn đạp và Nốt hoa mỹ, nơi giải thích kỹ các loại láy."
    ly_do: "n56, n57 (da-sua): Ped. còn dùng trong nhạc organ (Dolmetsch), nên \"chỉ gặp\" thành \"hay gặp\"; trang Nốt hoa mỹ cũ giải thích láy rền, láy dưới và láy quanh, nên \"hai loại\" thành \"các loại\"."
