ghi_chu: 'Bài nhạc lý 14 (ký hiệu biểu diễn: tốc độ, cường độ, cách diễn tấu, thuật ngữ tính cách, dấu nhắc lại và chỉ đường, nốt hoa mỹ, 8va/Ped./pizz.). Nguồn chính: Open Music Theory, Other Aspects of Notation và Glossary (động lực, tốc độ, articulation, D.C., D.S., fermata, coda); Trinity College London, "Musical terms and directions for performance" (bảng thuật ngữ, dùng cho thuật ngữ tính cách, volta, pizz., una corda, M.D./M.S.); Dolmetsch Online (Music Theory Online bài 5, 21, 23, Musical Symbols, vần O/F/P); Concise Oxford Dictionary of Music qua Encyclopedia.com (rubato, trill, mordent, gruppetto, appoggiatura, acciaccatura, fermata); Britannica (Musical expression); Met Museum (Cristofori). WebFetch ngày 27/10/2026 (bản tóm tắt chữ, không phải HTML thô). Sửa chữ ở lượt 1: (1) câu mở đầu: "ngôn ngữ chung của âm nhạc từ thời Baroque" thành "loại thuật ngữ được đưa vào từ thế kỷ 17" (Britannica); (2) "Tất cả thuật ngữ trong bài đều có trong từ điển" thành "Hầu hết" (thiếu pralltriller, 8va/8vb, decresc., segno, al Coda); (3) rubato: bỏ "rất phổ biến khi chơi Chopin" (COD: "particularly contentious"); (4) piano: bỏ "mà vẫn đủ vang"; (5) fermata: "hình con mắt" thành mô tả "vòng cung có chấm"; (6) D.S.: bỏ mô tả hình dấu segno; (7) láy trên: bỏ vế trong ngoặc về nhạc Baroque; (8) mục Nguồn; (9) mô tả trang (frontmatter) đổi theo (1). Chưa chắc (ket_qua null): hình "vạch kép có hai chấm" của dấu nhắc lại (nghĩa đúng), và tên "pralltriller" cho láy trên (cấu trúc nốt chính-trên-chính đúng theo Dolmetsch). Lưu ý cho người giao: hộp "Trên phím đàn" nói Ped. "chỉ gặp trên bản nhạc piano" (Ped. còn dùng cho organ) và trang Nốt hoa mỹ có ba loại láy chứ không hai; không sai nên chưa sửa. src/data/thuat-ngu.yml còn ghi_chu rubato "Đặc trưng khi chơi Chopin" và tre corde "viết tắt t.c." (xem hồ sơ thuật ngữ). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): pralltriller (láy trên), 8va / 8vb, decresc. (decrescendo), segno, al Coda, dấu nhắc lại (repeat sign), tên "dấu luyến" (slur); đã có: legato, staccato, tenuto, accent, fermata, trill, mordent, turn, appoggiatura, acciaccatura, ped., una corda, tre corde, da capo, dal segno, fine, coda, prima/seconda volta, m.d. / m.s., ottava. Khối abc: ba khối soạn, không có trích đoạn tác phẩm. Không tính là nhận định: tiêu đề mục và cột bảng. Mỗi dòng bảng là một nhận định.'
