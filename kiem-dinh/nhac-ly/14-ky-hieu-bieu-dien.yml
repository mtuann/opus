      - Hầu hết thuật ngữ trong bài đều có trong từ điển thuật ngữ, kèm thẻ ghi nhớ để ôn.
    ly_do: 'Mô tả trang (frontmatter) lấy từ đoạn đầu, nên đổi theo n2: đoạn đầu không còn vế "ngôn ngữ chung của âm nhạc từ thời Baroque".; n2 (da-sua): Britannica, Musical expression: "The 17th century saw the introduction of the Italian terms that have been in use ever since" và "Italian remains the dominant language for such indications". Câu cũ "ngôn ngữ chung của âm nhạc từ thời Baroque" nói quá (OMT, Other Aspects of Notation, xếp Baroque c. 1600-1750, khớp thế kỷ 17 nhưng "ngôn ngữ chung" thì không nguồn nào nói); viết lại sát nguồn.; n3 (da-sua): src/data/thuat-ngu.yml không có mục riêng cho pralltriller, 8va / 8vb, decresc., segno, al Coda; nên "tất cả" sai.'
  - cu: Co giãn tốc độ tự do để diễn cảm, rất phổ biến khi chơi Chopin
    moi: Co giãn tốc độ tự do để diễn cảm
    ly_do: 'n8, n9 (da-bo/da-sua): nghĩa rubato có nguồn (Concise Oxford Dictionary of Music); câu "rất phổ biến khi chơi Chopin" không có nguồn bậc 1-2 đã mở, bỏ.'
  - cu: 'Cây đàn piano có tên đầy đủ là pianoforte, nghĩa là "nhỏ – to": khác harpsichord, nó chơi to hay nhỏ theo lực ngón mà vẫn đủ vang (clavichord cũng làm được, nhưng rất nhỏ tiếng). Xem Lịch sử cây đàn piano.'
    moi: 'Cây đàn piano có tên đầy đủ là pianoforte, nghĩa là "nhỏ – to": khác harpsichord, nó chơi to hay nhỏ theo lực ngón (clavichord cũng làm được, nhưng rất nhỏ tiếng). Xem Lịch sử cây đàn piano.'
    ly_do: "n22 (da-sua): Metropolitan Museum of Art, The Pianofortes of Bartolomeo Cristofori: harpsichord \"lacked the ability to respond to the strength of the player's touch\"; clavichord có độ to nhỏ theo lực ngón nhưng \"so soft that it can barely be heard a few feet away\". Vế \"mà vẫn đủ vang\" của piano không có trong phần đã đọc, bỏ."
  - cu: Hình con mắt (vòng cung có chấm)
    moi: Vòng cung có chấm
    ly_do: 'n29 (da-sua): "hình con mắt" là cách ví von, không nguồn nào dùng; Concise Oxford Dictionary of Music vẽ dấu fermata là vòng cung có chấm (A pause, ký hiệu ⩀). Giữ phần mô tả hình dạng có nguồn.'
  - cu: Quay lại từ dấu Segno (chữ S có gạch chéo và hai chấm)
    moi: Quay lại từ dấu Segno
    ly_do: "n42, n43 (da-bo/da-sua): mô tả hình dáng dấu segno không có nguồn đọc được; giữ nghĩa dal segno (Concise Oxford Dictionary of Music)."
  - cu:
      - Láy trên (pralltriller)
      - Nốt chính – nốt trên – nốt chính, rất nhanh (trong nhạc Baroque thường bắt đầu từ nốt trên)
    moi:
      - Láy trên (upper mordent)
      - Nốt chính – nốt trên – nốt chính, rất nhanh
    ly_do: 'n47 (da-sua): vế trong ngoặc về nhạc Baroque không có nguồn bậc 1-2 đã mở, bỏ.; n47 (da-sua, review D3-gom): Dolmetsch, Music Theory Online bài 23 gọi dấu láy không gạch, ba nốt (nốt viết – nốt trên – nốt viết) là "upper mordent" hay Schneller; Pralltriller ở đó là một nét láy bốn nốt khác, chỉ sau quãng 2 đi xuống, và "the Schneller ... gradually replaced the Pralltriller". Tên "pralltriller" cho dấu này không có nguồn bậc 2 xác nhận.'
  - cu: "Vài ký hiệu chỉ gặp trên bản nhạc piano: Ped. và * (nhấn và nhả bàn đạp vang), una corda / tre corde (bàn đạp trái), m.d. / m.s. (tay phải / tay trái). Xem Bàn đạp và Nốt hoa mỹ, nơi giải thích kỹ hai loại láy."
    moi: "Vài ký hiệu hay gặp trên bản nhạc piano: Ped. và * (nhấn và nhả bàn đạp vang), una corda / tre corde (bàn đạp trái), m.d. / m.s. (tay phải / tay trái). Xem Bàn đạp và Nốt hoa mỹ, nơi giải thích kỹ các loại láy."
    ly_do: 'n56, n57 (da-sua): Ped. còn dùng trong nhạc organ (Dolmetsch), nên "chỉ gặp" thành "hay gặp"; trang Nốt hoa mỹ cũ giải thích láy rền, láy dưới và láy quanh, nên "hai loại" thành "các loại".'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - Open Music Theory, Glossary.
      - "The Concise Oxford Dictionary of Music (Kennedy, Bourne) qua Encyclopedia.com: các mục rubato, ritardando, accelerando, fermata, da capo, dal segno, coda, acciaccatura, appoggiatura, mordent, turn…"
      - "Trinity College London, bảng thuật ngữ và ký hiệu (cấp độ 1-2); Dolmetsch Online, Music Theory Online: Musical Terms."
      - "Catherine Schmidt-Jones, Understanding Basic Music Theory: Repeats and Other Musical Road Map Signs."
    ly_do: "Mục Nguồn: thay link chung bằng các nguồn đã mở khi kiểm định (lượt 1); bỏ musictheory.net vì không đọc được chữ.; Mục Nguồn (review D3-gom): thêm nguồn đã dùng để quyết n39 (dấu nhắc lại có hai chấm)."
  - cu: "mô tả: Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt. Phần lớn các ký hiệu này dùng tiếng Ý, ngôn ngữ chung của âm…"
    moi: "mô tả: Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt. Phần lớn các ký hiệu này dùng tiếng Ý, loại thuật ngữ được đưa…"
