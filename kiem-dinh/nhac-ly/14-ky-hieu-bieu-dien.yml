  - id: n39
    cau: 'Dấu nhắc lại (vạch kép có hai chấm, ở đầu và cuối đoạn): nhắc lại đoạn giữa hai dấu.'
    loai: dinh-nghia
    nguon:
      - omt-notation
      - dol-sym
      - sj-repeats
    ket_qua: dung
    ghi_chu: 'chưa chắc: nghĩa đúng (OMT: "Repeat signs indicate that a section of music should be repeated"; Dolmetsch: "the ''repetition'' signs indicates that a section of a piece of music is to be played a second time"). Hình "vạch kép có hai chấm" không nằm trong chữ của nguồn nào đã đọc (Dolmetsch: không nhắc hai chấm). Review D3-gom: lượt 1 chưa quyết (hình hai chấm không có trong chữ nguồn). Đã mở Schmidt-Jones, Understanding Basic Music Theory 2.9 (giáo trình mở, 28/10/2026): "Dots to the right of a double bar line begin the repeated section; dots to the left of a double bar line end it." Nghĩa theo OMT ("Repeat signs indicate that a section of music should be repeated") và Dolmetsch. Kết luận: dung.'
    luot_2: dung
    luot_2_nguon: [ "https://opencurriculum.org/5553/repeats-and-other-musical-road-map-signs/" ]
