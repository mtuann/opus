    ghi_chu: 'chưa chắc: chữ cũ có thêm "(trong nhạc Baroque thường bắt đầu từ nốt trên)", đã bỏ. Dolmetsch bài 23: mordent trên (upper mordent, Schneller) viết bằng dấu láy không gạch, ba nốt: nốt viết, nốt trên, nốt viết; COD, mục mordent: có "upper and lower mordents". Tên "pralltriller" không có trong COD, và Dolmetsch không nói thẳng pralltriller = upper mordent; chưa có nguồn bậc 1-2 xác nhận cái tên đó cho láy trên. Review D3-gom: lượt 1 chưa quyết (tên pralltriller), lượt 2 khong-chac (tên gọi khác nhau giữa các nguồn). Đã đọc phần cuối Dolmetsch bài 23 (28/10/2026): "the nineteenth-century ornament (written as a shake sign) called the ''upper'' mordent or Schneller", gồm "the note above and back to the written note", dấu láy dưới thì "crossed by a vertical line"; Pralltriller là nét khác: "It contains only four notes, the first of which is tied to the preceding note", "may occur only after a descending second", và "the Schneller, the inverted mordent, gradually replaced the Pralltriller". Chữ cũ: "Láy trên (pralltriller)". Chữ mới: "Láy trên (upper mordent)". Cách chơi giữ nguyên (khớp Dolmetsch).'
    luot_2: dung
    luot_2_nguon: [ "https://music-encoding.org/guidelines/v3/content/cmnornaments.html" ]
    luot_2_ghi_chu: "Theo truyền thống ký hiệu không gạch là mordent đảo (trên): nốt chính, nốt trên, nốt chính; nguồn lưu ý có thời kỳ hai ký hiệu bị đổi nghĩa."
