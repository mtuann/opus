    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L2 lượt 1, phần 2/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, nhóm A, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Bài nhạc lý 16 (điệu thức và ngũ cung). Nguồn chính: OMT Diatonic Modes, COD (Modes), Britannica (Pentatonic scale; Mode chỉ đọc được đề mục), Johnson (Royal Holloway, Pagodes), Trần Thanh Hà 2013, Keefe 1991 (qua bản tóm tắt), Folkways, UNESCO. Sửa ở lượt 1: lời giới thiệu; cột "Màu sắc" thành "Quãng ba trên chủ âm"; Mẹo; đoạn "Nghe điệu thức ở đâu?" (chỉ giữ Gregorian); "Dạng quen thuộc nhất"; "không có quãng 2 thứ hay tritone" thay "hài hòa"; đoạn ngũ cung phân bố (bỏ Dvořák, blues...); mục Việt Nam (bỏ công xích và Sol–La–Đô–Rê–Mi, đàn bầu/đàn kìm, bộ khung/phần hồn; thêm Keefe, Folkways); câu 4 trắc nghiệm; tên bộ luyện tai; mục Nguồn. Chưa chắc: không. Thuật ngữ tiếng Việt chưa có trong src/data/thuat-ngu.yml (cho D3-L5): "điệu thức", "ngũ cung", "Hò Xự Xang Xê Cống".'
