doi_chu:
  - cu: Gam trưởng và gam thứ thống trị âm nhạc phương Tây từ khoảng năm 1600. Nhưng trước đó, và trong rất nhiều nền âm nhạc khác, kể cả âm nhạc Việt Nam, người ta dùng những thang âm khác. Bài này mở ra hai thế giới đó.
    moi: Gam trưởng và gam thứ là hai thang âm bạn đã học. Nhưng trong âm nhạc phương Tây cổ hơn, và trong rất nhiều nền âm nhạc khác, kể cả âm nhạc Việt Nam, người ta dùng những thang âm khác. Bài này mở ra hai thế giới đó.
    ly_do: 'n1 (da-sua): mô tả trang lấy từ đoạn đầu, đổi theo câu mở đầu mới.; n1 (da-sua): "thống trị âm nhạc phương Tây từ khoảng năm 1600" và "trước đó" không nguồn bậc 1-2 đã mở nào chốt được mốc năm (Britannica, mục Mode, chỉ có phần "Gradual emergence of major and minor tonality" trong mục Plainchant); bỏ mốc và bỏ cả mức "quen thuộc nhất", chỉ nhắc lại rằng người học đã học hai gam này.'
  - cu: Màu sắc
    moi: Quãng ba trên chủ âm
    ly_do: 'n11 (da-sua): cột "Màu sắc" (sáng, tối, Tây Ban Nha, kỳ ảo, bất ổn, hiếm dùng) là cảm nhận chủ quan hoặc khẳng định văn hóa không nguồn nào xác nhận; thay bằng cột kiểm được "Quãng ba trên chủ âm" (suy ra từ cấu trúc gam, đối chiếu bằng abcjs/khuông: Đô-Mi trưởng, Rê-Fa thứ, Mi-Sol thứ, Fa-La trưởng, Sol-Si trưởng, La-Đô thứ, Si-Rê thứ).'
  - cu: Sáng
    moi: Trưởng
    ly_do: 'n11 (da-sua): ô của cột "Màu sắc" thành tính chất quãng ba trên chủ âm (OMT Diatonic Modes: major-ish, minor-ish).'
