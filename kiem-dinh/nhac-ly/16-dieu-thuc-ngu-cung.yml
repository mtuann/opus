nhan_dinh:
  - id: n1
    cau: Gam trưởng và gam thứ là hai thang âm bạn đã học. Nhưng trong âm nhạc phương Tây cổ hơn, và trong rất nhiều nền âm nhạc khác, kể cả âm nhạc Việt Nam, người ta dùng những thang âm khác.
    loai: lich-su
    nguon:
      - cod-modes
      - brit-pent
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Gam trưởng và gam thứ thống trị âm nhạc phương Tây từ khoảng năm 1600. Nhưng trước đó, ..." Chữ mới bỏ mốc "khoảng năm 1600" (không nguồn đã mở ghi mốc này) và nói theo thứ đã học. COD, Modes: điệu thức có trước hệ trưởng/thứ; Britannica, Pentatonic scale: thang năm âm có ở nhiều nền âm nhạc. Review D3-gom: chữ mới có ở đoạn mở đầu và description; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://vjol.info.vn/khxh/article/download/15034/13490/", "https://www.britannica.com/art/pentatonic-scale" ]
    luot_2_ghi_chu: Thang ngũ cung dùng ở nhiều nền nhạc, kể cả Việt Nam; điệu thức nhà thờ thuộc nhạc phương Tây cổ.
  - id: n2
    cau: Lấy các phím trắng của piano, nhưng bắt đầu từ những nốt khác nhau, ta được 7 điệu thức (mode).
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT, Diatonic Modes: bảy điệu thức là bảy cách bắt đầu gam diatonic (phím trắng) từ bảy nốt; Ionian trên Đô, Dorian trên Rê...'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: "OMT: Ionian...Aeolian là các thang nốt trắng bắt đầu từ C, D, E...; Locrian là nốt trắng bắt đầu từ Si."
  - id: n3
    cau: Tên các điệu thức mượn từ Hy Lạp cổ (nhưng không giống hệ thống Hy Lạp thật).
    loai: lich-su
    nguon:
      - cod-modes
    ket_qua: dung
    ghi_chu: 'COD, Modes: tên Hy Lạp được dùng cho điệu thức thời Trung đại, "though incorrect, have become accepted"; tức không trùng hệ thống Hy Lạp cổ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/", "https://www.britannica.com/art/church-mode" ]
    luot_2_ghi_chu: 'OMT: điệu thức nhà thờ ra đời thời trung đại; tên Hy Lạp dùng sai/mượn (Britannica liệt kê mục "misapplied Greek names").'
  - id: n4
    cau: 'Đô – Ionian: chính là gam trưởng; quãng ba trên chủ âm trưởng.'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: Ionian giống gam trưởng; "major-ish".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: Ionian trùng gam trưởng.
  - id: n5
    cau: 'Rê – Dorian: gam thứ nhưng bậc 6 nâng; quãng ba trên chủ âm thứ.'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: Dorian là natural minor với bậc 6 nâng ("minor-ish"). Suy kiểm: Rê Dorian có Si tự nhiên, F (thứ ba) thứ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: "Dorian: thứ tự nhiên với bậc 6 nâng."
  - id: n6
    cau: 'Mi – Phrygian: thứ, bậc 2 hạ; quãng ba thứ.'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: Phrygian là natural minor với bậc 2 hạ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: "Phrygian: thứ tự nhiên với bậc 2 hạ."
  - id: n7
    cau: 'Fa – Lydian: trưởng, bậc 4 nâng; quãng ba trưởng.'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: Lydian là major với bậc 4 nâng.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: "Lydian: trưởng với bậc 4 nâng."
  - id: n8
    cau: 'Sol – Mixolydian: trưởng, bậc 7 hạ; quãng ba trưởng.'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: Mixolydian là major với bậc 7 hạ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: "Mixolydian: trưởng với bậc 7 hạ."
  - id: n9
    cau: 'La – Aeolian: chính là gam thứ tự nhiên; quãng ba thứ.'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: Aeolian = natural minor.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: Aeolian trùng thứ tự nhiên.
  - id: n10
    cau: 'Si – Locrian: thứ, bậc 2 và 5 hạ; quãng ba thứ.'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: Locrian là natural minor với bậc 2 và 5 hạ (công thức khoảng cách N-C-C-N-C-C-C, suy kiểm trên phím trắng Si–Si).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/", "https://www.classical-music.com/features/articles/modes-in-music-what-they-are-and-how-they-are-used-in-music" ]
    luot_2_ghi_chu: "OMT chương này không nêu Locrian; suy từ nốt trắng Si: Si-Đô-Rê-Mi-Fa-Sol-La = thứ tự nhiên hạ bậc 2 và 5."
  - id: n11
    cau: 'Bảng điệu thức, cột "Quãng ba trên chủ âm": Ionian, Lydian, Mixolydian có quãng ba trưởng; Dorian, Phrygian, Aeolian, Locrian có quãng ba thứ (thay cho cột "Màu sắc" cũ).'
    loai: dinh-nghia
    nguon:
      - omt-modes
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: cột "Màu sắc" (Sáng, ...). Chữ mới: quãng ba trên chủ âm, đo được theo cấu trúc (OMT chia thành "major-ish" và "minor-ish"); "màu sắc" là cảm nhận chủ quan. Review D3-gom: lượt 2 khong-chac vì câu cũ chỉ nói về cột của bảng. Viết lại câu thành điều kiểm được (nội dung cột). Review tính lại từ các phím trắng: Đô–Mi, Fa–La, Sol–Si là 3 trưởng (4 nửa cung); Rê–Fa, Mi–Sol, La–Đô, Si–Rê là 3 thứ (3 nửa cung); khớp bảng trang (dòng 12–20) và cách chia "major-ish / minor-ish" của OMT, Diatonic Modes. Giữ da-sua (chữ cũ "Màu sắc" đã sửa ở lượt 1).'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu nói về cột trong bảng của trang (site), không kiểm được bằng nguồn ngoài.
  - id: n12
    cau: 'Mẹo: so mỗi điệu thức với gam trưởng hoặc thứ gần nhất để thấy bậc nào khác, rồi tìm bậc đó khi nghe.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "Mẹo: mỗi điệu thức có một nốt đặc trưng ... Khi nghe, hãy tìm nốt đó." Chữ mới dựa vào cột "So với gam trưởng/thứ" của chính bảng; bỏ khái niệm "nốt đặc trưng" (không nguồn đã mở dùng cách gọi này). Review D3-gom: câu khuyen-tap dựa vào cột của chính bảng, không chứa điều cần nguồn; ket_qua đổi da-sua thành khong-can-nguon (công cụ khóa đòi nguồn cho da-sua); lịch sử sửa giữ ở ghi_chu và doi_chu.'
    luot_2: dung
    luot_2_ghi_chu: Khuyên tập hợp lý.
  - id: n13
    cau: 'Muốn có điệu thức trên nốt gốc khác, chỉ cần áp công thức khoảng cách của nó. Ví dụ Dorian từ La: La – Si – Đô – Rê – Mi – Fa♯ – Sol – La.'
    loai: quy-tac
    nguon:
      - omt-modes
    ket_qua: dung
    ghi_chu: 'OMT: điệu thức xây trên mọi nốt bằng công thức khoảng cách. La Dorian: C N C C C N C từ La = A B C D E F♯ G A ✓.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: "La Dorian: La-Si-Đô-Rê-Mi-Fa♯-Sol, đúng công thức W-H-W-W-W-H-W."
  - id: n14
    cau: Thánh ca Gregorian dùng các điệu thức này, nên chúng còn được gọi là điệu thức Gregorian (hay điệu thức nhà thờ).
    loai: lich-su
    nguon:
      - cod-modes
      - brit-mode
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thánh ca Gregorian và nhạc Phục hưng (trước khi có trưởng/thứ). Debussy và Ravel dùng điệu thức để tạo màu sắc cổ xưa hoặc kỳ ảo. Dân ca Celtic, Bartók, Vaughan Williams..." Chữ mới giữ Gregorian: COD, Modes, nêu "Gregorian modes"/"church modes" là cách gọi hệ điệu thức của thánh ca. Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/", "https://www.classical-music.com/features/articles/modes-in-music-what-they-are-and-how-they-are-used-in-music" ]
    luot_2_ghi_chu: "OMT: church modes còn gọi Gregorian modes; thánh ca Gregorian dựa trên tám điệu thức nhà thờ."
  - id: n15
    cau: Nhạc Phục hưng; Debussy và Ravel dùng điệu thức để tạo màu sắc cổ xưa hoặc kỳ ảo; dân ca Celtic, Bartók, Vaughan Williams có điệu thức.
    loai: lich-su
    nguon:
      - cod-modes
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang. Không nguồn bậc 1-2 đã mở nào xác nhận từng câu (Britannica Mode chỉ đọc được đề mục; COD không nêu các nhà soạn nhạc này); "màu sắc cổ xưa hoặc kỳ ảo" là cảm nhận chủ quan. Review D3-gom: đã kiểm trang không còn "nhạc Phục hưng", "Debussy và Ravel dùng điệu thức", "Celtic", "Bartók", "Vaughan Williams" (Debussy còn ở câu Pagodes về ngũ cung, câu khác).'
    luot_2: dung
    luot_2_nguon: [ "https://musictheory.pugetsound.edu/mt21c/Impressionism.html", "https://www.classical-music.com/features/articles/modes-in-music-what-they-are-and-how-they-are-used-in-music", "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/" ]
    luot_2_ghi_chu: Debussy, Ravel (MT21C), Bartók, Vaughan Williams, nhạc dân gian Ireland (Classical Music) đều dùng điệu thức; điệu thức nhà thờ thuộc nhạc trung đại-Phục hưng.
  - id: n16
    cau: Hình "modes" (veDieuThuc) minh họa điệu thức.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Thành phần ::hinh{ten="modes"} có trong bộ hình của site (hàm veDieuThuc), kiểm trên mã thành phần. Review: đã kiểm src/scripts/ve.js veDieuThuc (dòng 314–318) và src/plugins/thanh-phan.mjs dòng 375–377; dist/nhac-ly/16-dieu-thuc-ngu-cung/index.html có hình aria-label "Bảy điệu thức trên phím trắng: Ionian bắt đầu từ Đô, Dorian từ Rê, … Locrian từ Si", khớp bảng.'
    review: dung
  - id: n17
    cau: Gam ngũ cung (pentatonic) chỉ có 5 nốt.
    loai: dinh-nghia
    nguon:
      - brit-pent
    ket_qua: dung
    ghi_chu: 'Britannica, Pentatonic scale: thang năm âm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.classical-music.com/features/musical-terms/what-is-a-pentatonic-scale", "https://www.britannica.com/art/pentatonic-scale" ]
  - id: n18
    cau: Dạng quen thuộc nhất bỏ hai nốt tạo nửa cung (bậc 4 và 7) khỏi gam trưởng.
    loai: dinh-nghia
    nguon:
      - brit-pent
      - omt-modes
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dạng phổ biến nhất ..." Chữ mới "quen thuộc nhất" (không nguồn nào xếp hạng tần suất). Suy kiểm: gam Đô trưởng bỏ Fa và Si còn Đô Rê Mi Sol La; nửa cung ở Mi–Fa và Si–Đô nên bỏ bậc 4, 7 loại hết nửa cung. Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.classical-music.com/features/musical-terms/what-is-a-pentatonic-scale" ]
    luot_2_ghi_chu: Ngũ cung trưởng bỏ bậc 4 và 7.
  - id: n19
    cau: 'Ngũ cung trưởng: Đô – Rê – Mi – Sol – La; toàn bộ là cung và quãng 3 thứ, không có nửa cung nào.'
    loai: dinh-nghia
    nguon:
      - brit-pent
    ket_qua: dung
    ghi_chu: 'Britannica: thang năm âm không nửa cung (anhemitonic) gồm cung và quãng ba thứ. Suy kiểm: C-D, D-E, E-G (3 thứ), G-A, A-C (3 thứ).'
    luot_2: dung
    luot_2_nguon: [ "https://www.classical-music.com/features/musical-terms/what-is-a-pentatonic-scale", "https://www.britannica.com/art/pentatonic-scale" ]
    luot_2_ghi_chu: Đô-Rê-Mi-Sol-La không có nửa cung (dạng anhemitonic).
  - id: n20
    cau: Giữa hai nốt bất kỳ của ngũ cung trưởng không có quãng 2 thứ hay tritone.
    loai: dinh-nghia
    nguon:
