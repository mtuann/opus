  - cu: "câu hỏi: Vì sao mọi tổ hợp nốt trong gam ngũ cung trưởng đều nghe hài hòa? | ✓ Vì không có quãng nửa cung nào | Vì chỉ có quãng 5 đúng | Vì nó là gam thứ | Không có nửa cung nên không có quãng 2 thứ hay tritone."
    moi: "câu hỏi: Giữa hai nốt bất kỳ của gam ngũ cung trưởng không bao giờ có quãng nào? | ✓ Quãng 2 thứ (nửa cung) và tritone | Quãng 3 thứ | Quãng 5 đúng | Đô – Rê – Mi – Sol – La có quãng 3 thứ (Mi – Sol) và quãng 5 đúng (Rê – La), nhưng không có hai nốt nào cách nhau nửa cung hay tritone."
    ly_do: 'n44 (da-sua): câu hỏi cũ "vì sao mọi tổ hợp nốt đều nghe hài hòa" dựa trên khẳng định chủ quan (xem n27); viết lại thành câu hỏi kiểm được từ cấu trúc gam.'
