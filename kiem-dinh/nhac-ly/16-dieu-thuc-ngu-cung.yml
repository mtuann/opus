  - cu:
      - Bất ổn, hiếm dùng
      - "Mẹo: mỗi điệu thức có một nốt đặc trưng làm nó khác gam trưởng hoặc thứ quen thuộc. Khi nghe, hãy tìm nốt đó."
    moi:
      - Thứ
      - 'Mẹo: so mỗi điệu thức với gam trưởng hoặc thứ gần nhất để thấy bậc nào khác (cột "So với gam trưởng/thứ"), rồi tìm bậc đó khi nghe.'
    ly_do: 'n12 (da-sua): "mỗi điệu thức có một nốt đặc trưng" sai với Ionian, Aeolian (trùng gam trưởng, thứ) và Locrian (khác gam thứ ở hai bậc); viết lại thành lời khuyên so sánh, không còn khẳng định chung.'
  - cu: Nghe điệu thức ở đâu? Thánh ca Gregorian và nhạc Phục hưng (trước khi có trưởng/thứ). Debussy và Ravel dùng điệu thức để tạo màu sắc cổ xưa hoặc kỳ ảo. Dân ca Celtic, Anh và Đông Âu dùng nhiều Dorian và Mixolydian; Bartók và Vaughan Williams đưa chúng vào nhạc giao hưởng.
    moi: Nghe điệu thức ở đâu? Thánh ca Gregorian dùng các điệu thức này, nên chúng còn được gọi là điệu thức Gregorian (hay điệu thức nhà thờ).
    ly_do: 'n14, n15 (da-bo/da-sua): Debussy và Ravel "màu sắc cổ xưa hoặc kỳ ảo", dân ca Celtic/Anh/Đông Âu dùng nhiều Dorian và Mixolydian, Bartók và Vaughan Williams đưa điệu thức vào nhạc giao hưởng, và "nhạc Phục hưng": không nguồn bậc 1-2 đã mở nào xác nhận đủ ý (bài của Julian Johnson về Debussy không nhắc điệu thức hay Ravel; OMT Diatonic Modes không nhắc Phục hưng, Debussy, Ravel, dân ca, Bartók, Vaughan Williams; Concise Oxford Dictionary of Music, mục Modes, nhắc Vaughan Williams, Bartók, Kodály nhưng không nhắc Debussy). Giữ phần OMT nói rõ: "This collection of modes is often called church, white-note, or Gregorian modes."'
  - cu:
      - "Gam ngũ cung (pentatonic) chỉ có 5 nốt. Dạng phổ biến nhất bỏ hai nốt tạo nửa cung (bậc 4 và 7) khỏi gam trưởng:"
      - "Ngũ cung trưởng: Đô – Rê – Mi – Sol – La. Toàn bộ là cung và quãng 3 thứ, không có nửa cung nào, nên mọi tổ hợp nốt đều nghe hài hòa. Thử chơi chỉ trên 5 phím đen của piano: đó là một gam ngũ cung."
    moi:
      - "Gam ngũ cung (pentatonic) chỉ có 5 nốt. Dạng quen thuộc nhất bỏ hai nốt tạo nửa cung (bậc 4 và 7) khỏi gam trưởng:"
      - "Ngũ cung trưởng: Đô – Rê – Mi – Sol – La. Toàn bộ là cung và quãng 3 thứ, không có nửa cung nào, nên giữa hai nốt bất kỳ không có quãng 2 thứ hay tritone. Thử chơi chỉ trên 5 phím đen của piano: đó là một gam ngũ cung."
    ly_do: 'n18 (da-sua): Britannica, Pentatonic scale: "The most widely known form is anhemitonic" (quen thuộc nhất), không nói "phổ biến nhất".; n20 (da-sua): "mọi tổ hợp nốt đều nghe hài hòa" là cảm nhận chủ quan; thay bằng hệ quả kiểm được: giữa hai nốt bất kỳ của Đô-Rê-Mi-Sol-La không có quãng 2 thứ hay tritone (các quãng có là 2 trưởng, 3 thứ, 3 trưởng, 4 đúng, 5 đúng, 6 trưởng).'
  - cu: "Ngũ cung có mặt ở khắp thế giới: dân ca Việt Nam, Trung Quốc, Nhật Bản, Scotland, nhạc blues. Debussy dùng gam ngũ cung trong Pagodes (tập Estampes), sau khi nghe dàn nhạc gamelan Java ở Hội chợ Thế giới Paris năm 1889. Dvořák dùng nó trong chủ đề chương 2 Giao hưởng Từ Thế giới mới."
    moi: "Ngũ cung có mặt trong âm nhạc của nhiều nơi: Đông Á và Đông Nam Á (như thang slendro của gamelan Java), nhiều dân ca châu Âu. Debussy dùng gam ngũ cung trong Pagodes (tập Estampes), nơi tiếng gamelan Java được gợi lại; ông từng nghe gamelan ở Triển lãm Paris năm 1889."
    ly_do: 'n24, n26 (da-bo/da-sua): Britannica, Pentatonic scale: ngũ cung có ở Đông Á, Đông Nam Á (slendro Java), nhiều dân ca châu Âu; không nhắc Scotland, Nhật Bản, Trung Quốc, blues. Julian Johnson (Royal Holloway) về Pagodes: gamelan, Triển lãm Paris 1889, tập hợp ngũ cung B C# D# F# G#. Chương 2 Giao hưởng Từ Thế giới mới của Dvořák: nguồn đọc được chỉ nói "có lẽ" gợi từ thang năm âm của spiritual, nên bỏ.'
  - cu: Nhạc truyền thống Việt Nam xây trên các thang năm âm, gọi tên theo hệ thống Hò – Xự – Xang – Xê – Cống (cùng nguồn gốc với ký âm công xích của Trung Quốc). Theo cách đối chiếu phổ biến với ký âm phương Tây, năm âm này tương ứng Sol – La – Đô – Rê – Mi (theo Đô di động). Khoảng cách giữa chúng (cung – quãng 3 thứ – cung – cung) giống hệt gam ngũ cung trưởng ở trên, chỉ bắt đầu từ một bậc khác; vì vậy nhiều sách dạy đàn tranh, đàn bầu viết chúng là Đô – Rê – Fa – Sol – La.
    moi: "Nhạc truyền thống Việt Nam xây trên các thang năm âm, gọi tên theo hệ thống Hò – Xự – Xang – Xê – Cống. Khi ghi lên khuông nhạc phương Tây, năm âm này được đối chiếu với Đô – Rê – Fa – Sol – La. Khoảng cách giữa chúng (cung – quãng 3 thứ – cung – cung) là chuỗi khoảng cách của gam ngũ cung trưởng ở trên, chỉ bắt đầu từ một bậc khác: Đô – Rê – Fa – Sol – La chính là gam ngũ cung trưởng từ Fa, viết bắt đầu từ bậc 5 (Đô)."
    ly_do: 'n28, n29 (da-bo/da-sua): Trần Thanh Hà, "Thang năm âm người Việt dưới góc nhìn văn hóa học" (Tạp chí Khoa học Xã hội, số 1(173), 2013): tên Hò, Xự, Xang, Xê, Cống được dùng rộng rãi hơn; thang năm âm người Việt "tương ứng với các nốt Do, Re, Fa, Sol, La". Bài đó không nhắc công xích và không có ánh xạ Sol-La-Đô-Rê-Mi; trang cũ ghi ánh xạ Sol-La-Đô-Rê-Mi (cùng chuỗi khoảng cách nhưng khác tên nốt) và bỏ câu "cùng nguồn gốc công xích" (không kiểm được). Kiểm bằng khuông: {Đô, Rê, Fa, Sol, La} là tập nốt của ngũ cung trưởng từ Fa.'
  - cu:
      - Cao độ không cố định tuyệt đối. Đặc biệt ở điệu Nam (sắc thái buồn, như hơi Ai, hơi Oán trong nhạc tài tử Nam Bộ), một số âm được nhấn, rung, hoặc nằm giữa hai phím đàn piano.
      - Kỹ thuật luyến láy là một phần của nốt nhạc. Rung, nhấn, vuốt trên đàn tranh, đàn bầu, đàn kìm không phải là "trang trí thêm" như nốt hoa mỹ phương Tây, mà là bản sắc của chính âm đó.
      - Vì thế, khi nghe nhạc truyền thống Việt Nam bằng "tai nhạc lý phương Tây", hãy nhớ rằng gam ngũ cung chỉ là bộ khung; phần hồn nằm ở những cao độ uốn lượn mà khuông nhạc không vẽ ra được. Muốn đi sâu, hãy tìm hiểu nhạc tài tử Nam Bộ và ca trù, cả hai đều là Di sản văn hóa phi vật thể được UNESCO công nhận.
    moi:
      - Cao độ không cố định tuyệt đối. Một nghiên cứu về thang năm âm người Việt nói độ cao các âm trong thang này "không được xác định". Trên đàn tranh, tay trái ấn dây làm đổi độ căng dây, tức đổi cao độ nốt, nên nốt nghe được có thể lệch khỏi phím đàn piano.
      - Luyến láy góp phần tạo nên điệu. Trên đàn tranh, nhấn dây để uốn cao độ là một lối trang trí quan trọng; cùng với thang âm, những kiểu luyến láy đặc trưng làm nên từng điệu và tâm trạng của nó (hơi Bắc diễn tả niềm vui, hơi Ai và hơi Oán diễn tả nỗi buồn).
      - Vì thế, khi nghe nhạc truyền thống Việt Nam bằng "tai nhạc lý phương Tây", hãy nhớ rằng khuông nhạc phương Tây không ghi hết cách nhấn nhá và uốn cao độ. Muốn đi sâu, hãy tìm hiểu nhạc tài tử Nam Bộ và ca trù, cả hai đều là Di sản văn hóa phi vật thể được UNESCO công nhận.
    ly_do: 'n31 (da-sua): "điệu Nam sắc thái buồn", "rung, nhấn, vuốt trên đàn tranh, đàn bầu, đàn kìm không phải trang trí mà là bản sắc của âm" không nguồn nào xác nhận nguyên văn. Nguồn đã mở: Trần Thanh Hà 2013 ("độ cao các âm trong thang năm âm người Việt là không được xác định"); Keefe, Burns, Nguyen, "Vietnamese Modal Scales of the Dan Tranh", Music Perception 1991 ("ornamentation using pitch bends is an important embellishment"; mỗi điệu gồm một cách lên dây và một sắc thái riêng); lời giới thiệu đĩa "Vietnam: Tradition of the South" (UNESCO, Smithsonian Folkways, qua folkways-media.si.edu): hơi Bắc diễn tả niềm vui, hơi Oán diễn tả nỗi buồn và khá giống hơi Ai, hơi Ai diễn tả sầu muộn; ấn dây tay trái đổi cao độ; các kiểu luyến láy đặc trưng định nghĩa điệu. Đàn bầu, đàn kìm không có trong nguồn nào đã mở nên bỏ.; n33 (da-sua): "gam ngũ cung chỉ là bộ khung, phần hồn nằm ở cao độ uốn lượn" là cách nói văn chương, không kiểm được; giữ phần kiểm được (khuông nhạc không ghi hết cách nhấn nhá, uốn cao độ: Keefe và cộng sự 1991, Trần Thanh Hà 2013).'
  - cu: 'Luyện tai gam và điệu thức: bộ "Điệu thức thường gặp" và "Ngũ cung".'
    moi: 'Luyện tai gam và điệu thức: bộ "Điệu thức thường gặp" và "Ngũ cung và gam 7 nốt".'
    ly_do: 'n35 (da-sua): tên bộ trong công cụ bản cũ (assets/js/scale-trainer.js dòng 7-8) là "Điệu thức thường gặp" và "Ngũ cung và gam 7 nốt", không phải "Ngũ cung".'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Encyclopaedia Britannica: Pentatonic scale; Mode."
      - "Julian Johnson (Royal Holloway, Đại học London), Claude Debussy: His Musical Style and Influences – Estampes and Nocturnes, mục Pagodes."
