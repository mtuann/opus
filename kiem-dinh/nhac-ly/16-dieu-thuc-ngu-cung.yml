      - "UNESCO, Danh sách Di sản văn hóa phi vật thể: Ca trù (2009), Đờn ca tài tử Nam Bộ (2013)."
    ly_do: "Mục Nguồn: thay link chung bằng các nguồn đã mở khi kiểm định (lượt 1); bỏ musictheory.net."
  - cu: "mô tả: Gam trưởng và gam thứ thống trị âm nhạc phương Tây từ khoảng năm 1600. Nhưng trước đó, và trong rất nhiều nền âm nhạc khác, kể cả âm nhạc Việt Nam, người ta…"
    moi: "mô tả: Gam trưởng và gam thứ là hai thang âm bạn đã học. Nhưng trong âm nhạc phương Tây cổ hơn, và trong rất nhiều nền âm nhạc khác, kể cả âm nhạc Việt Nam, người ta…"
