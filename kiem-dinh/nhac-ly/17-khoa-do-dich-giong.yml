doi_chu:
  - cu: "Ngoài khóa Sol và khóa Fa, còn một khóa thứ ba: khóa Đô. Hình của nó giống hai chữ C quay lưng vào nhau, và điểm giữa của khóa chỉ vào dòng nào thì dòng đó là Đô giữa (C4). Khóa Đô có thể đặt ở nhiều dòng, nhưng hai vị trí còn dùng ngày nay là:"
    moi: "Ngoài khóa Sol và khóa Fa, còn một khóa thứ ba: khóa Đô. Hình của nó vẽ cách điệu từ chữ C, và điểm giữa của khóa chỉ vào dòng nào thì dòng đó là Đô giữa (C4). Khóa Đô có thể đặt ở nhiều dòng, nhưng hai vị trí còn dùng ngày nay là:"
    ly_do: 'n2 (da-sua): Britannica, Clef: khóa Đô là "stylized form of the letter C"; không nguồn nào mô tả "hai chữ C quay lưng vào nhau".'
  - cu: Viola; đôi khi trombone alto
    moi: Viola
    ly_do: "n6 (da-sua): trombone alto chỉ có nguồn bậc 3 (Wikipedia, Clef); OMT, Britannica chỉ nêu viola."
  - cu: Một số nhạc cụ được viết bản nhạc ở cao độ khác với âm thanh thật vang lên. Lý do chủ yếu là lịch sử (kích thước ống kèn) và để người chơi dùng cùng một thế bấm khi đổi giữa các loại nhạc cụ trong cùng họ.
    moi: Một số nhạc cụ được viết bản nhạc ở cao độ khác với âm thanh thật vang lên. Lý do chủ yếu là lịch sử (kèn horn, kèn trumpet thời chưa có van chỉ chơi được các nốt của một âm gốc, nên phải đổi ống nối để đổi âm gốc) và để người chơi dùng cùng một thế bấm khi đổi giữa các loại nhạc cụ trong cùng họ.
    ly_do: 'n24 (da-sua): "kích thước ống kèn" không có nguồn; Wikipedia, Radius (bậc 3): kèn đồng chưa có van, ống nối đổi âm gốc.'
  - cu: Phổ biến nhất
    ly_do: 'n26 (da-bo): "Phổ biến nhất" không kiểm được.'
  - cu: 'Khi đọc tổng phổ (bài 20), bè clarinet in B♭ có hóa biểu khác với các bè còn lại: đó không phải lỗi in, mà là nhạc cụ dịch giọng. Một số tổng phổ hiện đại in ở "cao độ thật" (concert pitch) để dễ đọc.'
    moi: "Khi đọc tổng phổ (bài 20), bè clarinet in B♭ có hóa biểu khác với các bè còn lại: đó không phải lỗi in, mà là nhạc cụ dịch giọng."
    ly_do: "n35 (da-bo): chỉ có Wikipedia (bậc 3)."
