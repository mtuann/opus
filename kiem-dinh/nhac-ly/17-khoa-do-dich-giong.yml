nhan_dinh:
  - id: n1
    cau: 'Ngoài khóa Sol và khóa Fa, còn một khóa thứ ba: khóa Đô.'
    loai: dinh-nghia
    nguon:
      - brit-clef
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Britannica, Clef: "stylized form of the letter C", cùng với khóa Sol và khóa Fa; OMT, Clefs: khóa alto và khóa tenor là khóa Đô (C clef).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/clef", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
  - id: n2
    cau: Hình của khóa Đô vẽ cách điệu từ chữ C.
    loai: dinh-nghia
    nguon:
      - brit-clef
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hình của nó giống hai chữ C quay lưng vào nhau". Chữ mới: câu trên. Lý do: không nguồn nào mô tả như vậy. Britannica, Clef: khóa Đô là "stylized form" của chữ C (như khóa Sol, khóa Fa); Wikipedia, Clef (bậc 3) nói bản viết tay thành hình chữ K, bản in thế kỷ 16–17 có dạng "ladder-like", không nhắc hai chữ C. Review D3-gom: chữ mới có ở đoạn mở đầu và description; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/clef" ]
    luot_2_ghi_chu: "Britannica: khóa G, F, C là dạng cách điệu của chữ cái."
  - id: n3
    cau: Điểm giữa của khóa Đô chỉ vào dòng nào thì dòng đó là Đô giữa (C4).
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - brit-clef
    ket_qua: dung
    ghi_chu: 'OMT, Clefs: "the center of the alto clef is indented around the C line (the middle line)"; mục từ: khóa "shows that C4 is the middle line of the staff by centering on it". Khóa tenor: "the center of the clef is indented around the second line from the top". Britannica: alto "the middle line carries C"; tenor "middle C occurs on the second line from the top".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/clef", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
  - id: n4
    cau: Khóa Đô có thể đặt ở nhiều dòng, nhưng hai vị trí còn dùng ngày nay là alto và tenor.
    loai: dinh-nghia
    nguon:
      - brit-clef
      - pb-alto-tenor
      - wiki-clef
    ket_qua: dung
    ghi_chu: 'Britannica: hai vị trí chính ngày nay là alto và tenor; soprano và mezzo-soprano "Formerly common". Harmony and Musicianship with Solfège: Đô giữa có thể gán cho "the first, second, third, or fourth lines". Wikipedia (bậc 3, chỉ đối chiếu): chỉ alto và tenor còn dùng thường xuyên.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/clef", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
    luot_2_ghi_chu: Soprano, mezzo, baritone nay ít dùng.
  - id: n5
    cau: Khóa Đô alto đặt Đô giữa ở dòng 3 (dòng giữa của khuông).
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - brit-clef
    ket_qua: dung
    ghi_chu: Xem n3. Ba dòng giữa tính từ dưới lên là dòng 3 (khuông năm dòng).
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.britannica.com/art/clef" ]
  - id: n6
    cau: Khóa Đô alto dùng cho viola.
    loai: ten
    nguon:
      - omt-clefs
      - brit-clef
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (bảng, cột "Dùng cho"): "Viola; đôi khi trombone alto". Chữ mới: "Viola". Lý do: OMT, Clefs: khóa alto "primarily used for the viola"; Britannica: alto clef (viola). Trombone alto chỉ thấy ở Wikipedia, Clef (bậc 3: "alto trombone"); Oxford, alto trombone (đã mở) chỉ ghi "Obsolete type of trombone, written for by Mozart, later replaced by ten. tb." và không nhắc khóa; Britannica không nhắc. Không có nguồn bậc 1–2 nên bỏ. Review D3-gom: chữ mới có ở bảng ("Viola"); giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.britannica.com/art/clef" ]
  - id: n7
    cau: Khóa Đô tenor đặt Đô giữa ở dòng 4 (dòng thứ hai kể từ trên xuống).
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - brit-clef
    ket_qua: dung
    ghi_chu: 'Xem n3: OMT "indented around the second line from the top"; năm dòng, dòng thứ hai từ trên xuống là dòng 4.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.britannica.com/art/clef" ]
    luot_2_ghi_chu: Dòng 4 từ dưới = dòng thứ hai từ trên xuống.
  - id: n8
    cau: Khóa Đô tenor dùng cho âm vực cao của cello, bassoon và trombone.
    loai: ten
    nguon:
      - omt-clefs
      - pb-alto-tenor
      - brit-clef
    ket_qua: dung
    ghi_chu: 'OMT: khóa tenor "sometimes employed in cello, bassoon, and trombone music", khóa chính của các nhạc cụ này là khóa Fa. Harmony and Musicianship: tenor dùng "occasionally" cho cello, bassoon, trombone ở đoạn có nốt quanh và trên Đô giữa. Britannica: tenor "used by the trombone, cello, and bassoon". Wikipedia (bậc 3): "upper ranges of bass-clef instruments".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://mymusictheory.com/instruments-transposition-and-clefs/" ]
    luot_2_ghi_chu: "OMT: đôi khi dùng cho cello, bassoon, trombone."
  - id: n9
    cau: Các nốt Đô3 – Đô4 – Sol4 viết ở khóa Sol, khóa Đô alto và khóa Fa là cùng ba cao độ.
    loai: dinh-nghia
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 1: abcjs (public/vendor/abcjs-basic-min.js, parseOnly) đọc C3 C4 G4 ở cả ba khóa; "C," là Đô3 theo quy ước ABC của site (C = Đô giữa).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
    luot_2_ghi_chu: "Phần nhạc lý đúng: cùng cao độ viết được ở các khóa khác nhau; hình của trang không xem được."
  - id: n10
    cau: Khóa Đô alto giúp nốt của viola nằm gọn trong khuông, ít dòng kẻ phụ.
    loai: quy-tac
    nguon:
      - brit-clef
      - wiki-clef
    ket_qua: dung
    ghi_chu: 'Britannica: "Music for instruments and voices is written in the clef corresponding most closely to the range of their parts." Wikipedia (bậc 3, đối chiếu): các khóa cho phép viết mỗi bè "on a staff with a minimum of ledger lines".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
    luot_2_ghi_chu: Alto clef là khóa chính của viola; âm vực viola gọn trong khuông (hệ quả của Đô giữa ở dòng 3).
  - id: n11
    cau: Âm vực viola nằm giữa violin và cello.
    loai: so-lieu
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'OMT, Clefs: viola "a mid-ranged instrument". Thứ tự âm vực violin cao hơn viola cao hơn cello là hiển nhiên theo kích thước. "Vừa khít vào 5 dòng kẻ" là cách nói hình ảnh.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/clef", "https://mymusictheory.com/instruments-transposition-and-clefs/" ]
    luot_2_ghi_chu: "Viola: giữa violin và cello."
  - id: n12
    cau: 'Các nốt trên dòng của khóa alto, từ dưới lên: Fa – La – Đô – Mi – Sol (F3 A3 C4 E4 G4).'
    loai: dinh-nghia
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'OMT: câu nhớ "Fat Alley Cats Eat Garbage" cho các dòng F A C E G. Đô giữa C4 ở dòng 3 (n3), nên dòng 1 là F3, dòng 2 là A3, dòng 4 là E4, dòng 5 là G4.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
    luot_2_ghi_chu: "Từ F3 A3 C4 E4 G4: Đô giữa dòng 3, các dòng cách nhau quãng 3."
  - id: n13
    cau: 'Các nốt trên dòng của khóa tenor, từ dưới lên: Rê – Fa – La – Đô – Mi (D3 F3 A3 C4 E4).'
    loai: dinh-nghia
    nguon:
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'Đô giữa C4 ở dòng 4 (n7); đi xuống cách một nốt: dòng 3 là A3, dòng 2 là F3, dòng 1 là D3; dòng 5 là E4.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/" ]
    luot_2_ghi_chu: "Đô giữa ở dòng 4: Rê3 Fa3 La3 Đô4 Mi4 đúng."
  - id: n14
    cau: Có công cụ đọc nốt (/opus/luyen-tap/doc-not/) với lựa chọn "Khóa Đô (alto)" và "Khóa Đô (tenor)".
