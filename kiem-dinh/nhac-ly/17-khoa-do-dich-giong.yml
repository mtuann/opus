    ghi_chu: K:C, M:none, L:1/2; ba dòng cùng "C, C G |]" ở K:C clef=treble, clef=alto, clef=bass. abcjs đọc C3 C4 G4 ở cả ba khóa (cùng cao độ; ABC giữ cao độ khi đổi khóa). Đúng điều trang nói (n9, tên khối "Cùng các nốt Đô3 – Đô4 – Sol4"). Không cảnh báo abcjs; không có vạch ô giữa (M:none).
