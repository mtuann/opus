    ghi_chu: 'Trích đoạn tác phẩm thật: Beethoven, Giao hưởng số 9, chương 4, giai điệu Ode to Joy (8 ô đầu của giai điệu, trang chỉ viết 4 ô), viết ở Đô trưởng, khóa Đô alto. Chữ cũ: E E F G | G F E D | E E F G | E D D2 |]. Chữ mới: E E F G | G F E D | C C D E | E3/2 D/ D2 |]. Lý do: ô 3 sai (lặp ô 1; giai điệu là Đô Đô Rê Mi) và ô 4 thiếu nhịp chấm dôi (Mi chấm dôi, Rê móc đơn, Rê trắng). Đối chiếu Mutopia ode.ly (Sol trưởng: b b c d | d c b a | g g a b | b4. a8 a2), dịch xuống một quãng 5 đúng sang Đô trưởng; khớp khối abc của 04-nhip.yml (D3-L1: E E F G | G F E D | C C D E | E3/2 D/ D2) đã đối chiếu với bản phổ Breitkopf & Härtel và Schott (mm. 92–99). abcjs đọc E4 E4 F4 G4 | G4 F4 E4 D4 | C4 C4 D4 E4 | E4(3/8) D4(1/8) D4(1/2): mỗi ô đủ 4 phách (khuong-nhac.mjs không lỗi).'
