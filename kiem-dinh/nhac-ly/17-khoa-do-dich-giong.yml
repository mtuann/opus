lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-gom
    ma_bam: sha256:eedc62fdbf2cac497f795d555b25618e874ccefb6bc7eac8d313c241a98163ab
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L3 lượt 1, phần 1/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, nhóm A, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Trang khóa Đô và dịch giọng (tầng lõi), ba khối abc, không có hình. Nguồn: OMT, Clefs (khóa alto, tenor); Britannica, Clef (bản in; Britannica mở được qua đường /print/article/…); Harmony and Musicianship (Pressbooks) về khóa alto, tenor; bảng khoảng dịch của teoria.com (Alvira), LilyPond Music Glossary, Oxford Dictionary of Music (encyclopedia.com), Met Museum (clarinet in A), Radius Music và Wikipedia (bậc 3, chỉ để đối chiếu); giai điệu Ode to Joy đối chiếu Mutopia ode.ly và hồ sơ 04-nhip.yml. WebFetch ngày 28/10/2026 (bản tóm tắt chữ, không phải HTML thô; chỗ quan trọng đã hỏi lại để lấy nguyên văn). Chỗ sửa trang: (1) hình khóa Đô "hai chữ C quay lưng vào nhau" thành "vẽ cách điệu từ chữ C"; (2) bỏ "đôi khi trombone alto"; (3) khối abc 2: ô 3 sai (E E F G thành C C D E) và ô 4 thêm nhịp chấm dôi; (4) lý do dịch giọng của nhạc cụ ("kích thước ống kèn" thành chuyện kèn đồng chưa có van); (5) bỏ "Phổ biến nhất" ở bảng và câu về tổng phổ concert pitch (chỉ bậc 3); (6) mục Nguồn. Chưa chắc: n22 (người đệm đàn dịch ngay khi chơi; nhãn khuyen-tap, review soát nhãn); n21 chỉ có nguồn bậc 3 (Radius). Trang đích chưa chuyển: /opus/luyen-tap/doc-not/ (n14: công cụ có hai lựa chọn "Khóa Đô (alto)", "Khóa Đô (tenor)"), /opus/tai-lieu-tham-khao/. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): C clef / alto clef / tenor clef (khóa Đô, Đô alto, Đô tenor), transposition (dịch giọng; trang dùng "dịch giọng" còn site gọi modulation là "chuyển giọng", cần phân biệt trong Từ điển), transposing instrument (nhạc cụ dịch giọng), concert pitch (cao độ thật), ledger line (đã có), viola, woodwinds/brass (xem 20). Đã có: clef, key-signature, interval, pitch.'
