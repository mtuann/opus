  - id: n20
    cau: 'Bước 4: kiểm tra lại dấu hóa bất thường: một dấu thăng có thể thành dấu bình hoặc thăng kép tùy giọng mới.'
    loai: quy-tac
    nguon:
      - omt-major
      - omt-intervals
    ket_qua: dung
    ghi_chu: 'Suy ra từ hóa biểu của giọng mới (không cần nguồn riêng). Ví dụ dấu bình: Đô trưởng có Fa♯ bất thường; dịch lên quãng 4 đúng sang Fa trưởng (có Si♭) thì Fa♯ thành Si bình. Ví dụ thăng kép: La thứ có Sol♯ (cảm âm); dịch sang Sol♯ thứ (5♯ gồm Fa♯) thì cảm âm là Fa thăng kép (Fa×). Review D3-gom: lượt 1 không ghi nguồn ("suy ra"), công cụ khóa báo thiếu nguon; lượt 2 chỉ tìm được blog (bậc 3). Câu là hệ quả của hai điều có nguồn bậc 2: dịch giọng giữ nguyên mọi quãng (OMT Intervals: tính chất quãng theo số nửa cung) và hóa biểu của giọng mới (OMT Major Scales). Review tính lại hai ví dụ của lượt 1: Đô trưởng Fa♯ dịch lên 4 đúng thành Si (Fa trưởng có Si♭, nên dấu bình); La thứ có Sol♯, dịch xuống 2 thứ sang Sol♯ thứ thì nốt ấy thành Fa× (Fa♯ trong hóa biểu, cảm âm phải thăng thêm). Giữ dung.'
