    review: dung
  - id: n16
    cau: Dịch giọng (transposition) là chuyển toàn bộ bản nhạc lên hoặc xuống một quãng cố định, giữ nguyên giai điệu.
    loai: dinh-nghia
    nguon:
      - oxford-transposition
      - teoria-transposing
    ket_qua: dung
    ghi_chu: 'Oxford (qua encyclopedia.com), transposition: "Changing of the pitch of a comp. without other change", ví dụ chuyển từ C sang D. teoria.com: mỗi nốt đọc thành nốt cách một quãng cố định (ví dụ "a major second lower"). "Quãng cố định" suy từ "without other change".'
    luot_2: dung
    luot_2_nguon: [ "https://www.nkoda.com/blog/how-to-transpose-music" ]
    luot_2_ghi_chu: "Dịch giọng: dời mọi nốt lên/xuống cùng một quãng."
  - id: n17
    cau: 'Bước 1 của dịch giọng: chọn quãng dịch, ví dụ lên 2 trưởng (Đô → Rê).'
    loai: quy-tac
    nguon:
      - oxford-transposition
    ket_qua: dung
    ghi_chu: 'Đô lên quãng 2 trưởng là Rê (Oxford: ví dụ C sang D).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nkoda.com/blog/how-to-transpose-music", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/" ]
  - id: n18
    cau: 'Bước 2: đổi hóa biểu sang giọng mới (Đô trưởng → Rê trưởng: thêm Fa♯, Đô♯).'
    loai: quy-tac
    nguon:
      - omt-major
    ket_qua: dung
    ghi_chu: 'Rê trưởng có hai dấu thăng Fa♯ và Đô♯: đã kiểm ở kiem-dinh/nhac-ly/08-hoa-bieu.yml (OMT, Major Scales: 2♯ là D major).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nkoda.com/blog/how-to-transpose-music", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/" ]
    luot_2_ghi_chu: Rê trưởng có Fa♯, Đô♯.
  - id: n19
    cau: 'Bước 3: dịch mọi nốt lên cùng số bậc (Đô → Rê, Mi → Fa♯ theo hóa biểu, Sol → La…).'
    loai: quy-tac
    nguon:
