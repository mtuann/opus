      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 3, 28/10/2026; bổ sung sau review)
      review: Claude (review D3-gom, nhóm B, 28/10/2026)
      kiem_mau: "chủ repo, 10 nhận định mẫu của đợt 3 (D3-L2 đến D3-L6): 6 đúng, 4 câu về site và lời khuyên tập không kiểm độc lập được (người gom kiểm lại trên repo, đúng), 0 sai (bao-cao/d3-gom/kiem-mau-ket-qua.yml)"
ghi_chu: 'Trang hòa âm bốn bè (tầng lõi), hai hình dẫn bè (::hinh{ten="voice-leading"}, hai hình SVG) và hình âm vực (::hinh{ten="ranges-satb"}); file src/components/hinh/*.html. Nguồn chính: Open Music Theory (OMT), Chords in SATB style và First-Species Counterpoint; Mount, Fundamentals, Function, and Form (ch. 14 và Guide to SATB part-writing của workbook); Iowa State, Comprehensive Musicianship 10.1; MT21C 26.7; RWU (chỉ để thấy nguồn lệch về âm vực bass); COD qua Encyclopedia.com; IMSLP. WebFetch ngày 28/10/2026 (bản tóm tắt chữ, đã hỏi lại để lấy nguyên văn chỗ quan trọng). NGƯỜI GIAO PHẢI SỬA HÌNH: (1) ranges-satb: bass phải là Fa2–Rê4 theo OMT, số px ở n8; (2) voice-leading hình 1: điểm bass "Fa" ở cột IV phải ở Fa2 (cy=208), nay vẽ ở Fa3, số ở n24. Chưa sửa nên n8, n24, n42 để null. Chữ đã sửa trên trang: âm vực bass (n7), bỏ nửa câu "mọi khóa học sáng tác" (n3), gạch đầu dòng I → IV (n30), mục Nguồn (thay link chung bằng các chương đã đọc; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm). Câu ve-site: n1 (nhac-ly/index chưa chuyển: giữ "Phần 5: Hòa âm mở rộng và phân tích" và phạm vi bài 21–27), n41 (tai-lieu-tham-khao chưa chuyển). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): voice leading (dẫn bè), doubling (nhân đôi), SATB, parallel fifths/octaves (quãng 5/8 song song), chorale (thánh ca), common tone (nốt chung), voice crossing (bắt chéo bè), contrary motion (chuyển động ngược), tendency tone; đã có bản ghi: chord, triad, inversion, leading-tone, interval, tonic, dominant, cadence. Hình dùng chữ cái (C, Dm) ở hình 2 trong khi trang viết Đô, Rê: nhắc người giao.'
