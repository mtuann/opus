    ket_qua: dung
    ghi_chu: 'K:C, M:4/2, L:1/2: bốn hợp âm nốt trắng, đủ 4 phách nốt trắng. Hợp âm: I = Đô3 Sol3 Mi4 Đô5 (gốc nhân đôi), IV = Fa2 La3 Fa4 Đô5, V = Sol2 Sol3 Rê4 Si4, I = Đô3 Sol3 Mi4 Đô5. Âm vực trong khoảng của OMT (soprano Đô4–Sol5, alto Sol3–Rê5, tenor Đô3–Sol4, bass Fa2–Rê4). Khoảng cách S–A và A–T trong một quãng 8. Dẫn bè: không có quãng 5 hay 8 song song ở mọi cặp bè (kiểm đủ 6 cặp, 3 lần chuyển); không bắt chéo; cảm âm Si lên Đô, nốt chung được giữ (soprano I → IV, tenor V → I). Khớp tiêu đề "I – IV – V – I, dẫn bè đúng" và các gạch đầu dòng.'
