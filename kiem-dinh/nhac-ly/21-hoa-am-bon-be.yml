nhan_dinh:
  - id: n1
    cau: Phần Hòa âm mở rộng và phân tích gồm bài 21–27 và dành cho bạn đã vững các bài trước.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên site cũ: ../opus-zero/docs/nhac-ly/index.md, mục "## Phần 5: Hòa âm mở rộng và phân tích" ("Dành cho bạn đã vững các phần trước"), liệt kê bài 21 đến 27 (21 Hòa âm bốn bè, 22 Đối âm, 23 Hợp âm mượn, 24 Hợp âm Napoli và hợp âm sáu tăng, 25 Bè trầm số, 26 Phân tích một tác phẩm, 27 Ký hiệu hợp âm pop và jazz); ../opus-zero/mkdocs.yml dòng 255 cùng tên mục. Trang nhac-ly/index chưa chuyển: lô chuyển nó giữ tên Phần 5 và phạm vi bài 21–27. Review: đã kiểm trang mục lục mới src/content/docs/nhac-ly/index.md (cùng nhánh gom, đã chuyển): "## Phần 5: Hòa âm mở rộng và phân tích", "Dành cho bạn đã vững các phần trước.", liệt kê bài 21 đến 27 (dòng 52–62); khớp câu.'
    review: dung
  - id: n2
    cau: Bach viết hàng trăm bài thánh ca (chorale) bốn bè.
    loai: lich-su
    nguon:
      - imslp-371
    ket_qua: dung
    ghi_chu: 'IMSLP: "371 Vierstimmige Choralgesänge", BWV 253–438, 371 bài hòa âm thánh ca (tên khác: "Choräle für vier Singstimmen"); bản in đầu Breitkopf, Leipzig, 1784–87, do C. P. E. Bach và Kirnberger biên soạn. "Hàng trăm" đúng (371).'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Chorale_Harmonisations,_BWV_250-438_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: "Trang IMSLP: 371 chorale (bản do C.P.E. Bach giám sát cho Breitkopf), các bộ khác 149-210 bài; đều là chorale hòa âm bốn bè. 'Hàng trăm' đúng."
  - id: n3
    cau: Viết bốn bè là bài tập nền tảng của mọi khóa học sáng tác.
    loai: lich-su
    nguon:
      - omt-satb
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ nửa câu ", và là bài tập nền tảng của mọi khóa học sáng tác". OMT chỉ nói đây là SATB style; "mọi khóa học sáng tác" là mức độ không kiểm được. Review D3-gom: lượt 2 (khong-chac) cũng cho "mọi khóa học sáng tác" là không kiểm được; chữ ấy không còn trên trang (đoạn mở đầu và description đã đọc).'
    luot_2: khong-chac
    luot_2_ghi_chu: Không nguồn nào đã mở nói điều này. Viết bốn bè (SATB) là nền tảng của giáo trình hòa âm/nhạc lý, nhưng 'mọi khóa học sáng tác' là khái quát quá mức, không kiểm được. Nên viết 'khóa hòa âm nhạc lý'.
  - id: n4
    cau: Bốn bè của hợp âm là soprano (S, cao nhất), alto (A), tenor (T), bass (B, thấp nhất).
    loai: dinh-nghia
    nguon:
      - omt-satb
    ket_qua: dung
    ghi_chu: 'OMT, Chords in SATB style (glossary): SATB là "A musical texture with soprano (S), alto (A), tenor (T), and bass (B) parts"; soprano "The highest part", alto "The second-highest", tenor "The second lowest", bass "The lowest voice".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/" ]
    luot_2_ghi_chu: Định nghĩa SATB chuẩn; âm vực từ cao đến thấp S, A, T, B theo hai nguồn.
  - id: n5
    cau: 'Giọng hát của bốn bè: soprano nữ cao, alto nữ trầm, tenor nam cao, bass nam trầm.'
    loai: dinh-nghia
    nguon:
      - cod-soprano
      - cod-alto
      - cod-tenor
      - cod-bass
    ket_qua: dung
    ghi_chu: 'COD: soprano "The highest register of female (or artificial male) v."; alto: một nghĩa là giọng nữ trầm (thường gọi contralto), nghĩa khác là giọng nam falsetto cao; tenor "Highest normal male v."; bass "Lowest male voice". OMT chỉ mô tả bằng âm vực, không nói nam hay nữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/" ]
    luot_2_ghi_chu: Soprano và alto là giọng nữ, tenor và bass giọng nam theo cách gọi chuẩn của hợp xướng SATB; âm vực khớp (S, A treble; T, B bass).
  - id: n6
    cau: 'Âm vực thường dùng: soprano Đô4 – Sol5, alto Sol3 – Rê5, tenor Đô3 – Sol4.'
    loai: quy-tac
    nguon:
      - omt-satb
      - fff-guide
      - rwu
    ket_qua: dung
    ghi_chu: 'OMT: "Soprano – C4 to G5", "Alto – G3 to D5", "Tenor – C3 to G4" ("a generally accepted range for each voice"). Mount (Guide, "approximate"): S C4–A5, A F3–D5, T C3–A4; RWU: S C4–G5, A G3–D5, T C3–F4. Ba nguồn lệch nhau vài nửa cung ở đầu cao hay thấp; theo OMT (nguồn chính đã chốt).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/" ]
    luot_2_ghi_chu: "OMT: soprano C4-G5, alto G3-D5, tenor C3-G4. Khớp."
  - id: n7
    cau: 'Âm vực thường dùng của bass: Fa2 – Rê4.'
    loai: quy-tac
    nguon:
      - omt-satb
      - fff-guide
      - rwu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mi2 – Đô4". Chữ mới: "Fa2 – Rê4". Lý do: OMT: "Bass – F2 to D4" (glossary: "generally accepted range is F2–D4"); Mount (Guide to SATB part-writing): bass "F2 to E4". Chỉ RWU ghi E2–C4 (nguồn bậc 2 mâu thuẫn): viết theo OMT, nguồn chính; ghi cả hai ở đây. Ví dụ I–IV–V–I của trang dùng bass thấp nhất Fa2: vẫn trong âm vực. Hình ranges-satb phải sửa theo (n8). Review D3-gom: lượt 2 xác nhận OMT ghi bass F2–D4; trang (bảng âm vực) ghi Fa2 – Rê4.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/" ]
    luot_2_ghi_chu: "OMT: bass F2-D4. Iowa State ghi G2-D4 (bass 'được mở rộng thêm vài nốt'). Các sách khác nhau vài nốt; theo OMT thì đúng."
  - id: n8
    cau: 'Hình ranges-satb: thanh âm vực soprano Đô4–Sol5, alto Sol3–Rê5, tenor Đô3–Sol4, bass Fa2–Rê4; chú thích ghi đúng bốn âm vực ấy.'
    loai: dinh-nghia
    nguon:
      - omt-satb
    ket_qua: da-sua
    ghi_chu: 'Hình sai, người giao sửa (không sửa file hình): chú thích (figcaption) "bass Mi2–Đô4" và thanh bass. Cần sửa: figcaption thành "bass Fa2–Rê4"; thanh bass bắt đầu ở Fa2 (x = 112 + 5 x 11.125 = 167.6; nay Mi2 ở x=156.5), rộng 21 nửa cung = 233.6 px (nay 222.5), nhãn đầu "F2" (nay "E2", x=153.5, sau sửa x=164.6), nhãn cuối "D4" (nay "C4" ở x=382.0; sau sửa x=167.6+233.6+3=404.2). Ba thanh S, A, T đã kiểm theo tỉ lệ 11.125 px mỗi nửa cung (C2 ở x=112, C3 ở 245.5, C4 ở 379): đúng. Nhãn C2, C3, C4 (Đô giữa), C5, C6 đúng. Nguồn số: src/components/hinh/ranges-satb.html. Người giao (agent làm lô) đã sửa src/components/hinh/ranges-satb.html theo đúng số trên: thanh bass x=167.6, rộng 233.6, nhãn F2 và D4; chú thích "bass Fa2–Rê4". Review D3-gom: đã đọc src/components/hinh/ranges-satb.html: tỉ lệ 11,125 px mỗi nửa cung (C2 x=112, C4 x=379); soprano x=379 rộng 211,4 (C4–G5, 19 nửa cung), alto x=323,4 (G3–D5), tenor x=245,5 (C3–G4), bass x=167,6 rộng 233,6 (F2–D4, 21 nửa cung), nhãn F2, D4; chú thích "bass Fa2–Rê4". Khớp OMT.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/" ]
    luot_2_ghi_chu: Bốn âm vực ghi trên hình khớp OMT (S C4-G5, A G3-D5, T C3-G4, B F2-D4). Phần 'chú thích ghi đúng bốn âm vực ấy' không xem được hình, chỉ kiểm nội dung nhạc lý.
  - id: n9
    cau: 'Khuông của bốn bè: soprano và alto khóa Sol; tenor và bass khóa Fa; đuôi nốt soprano và tenor hướng lên, alto và bass hướng xuống.'
    loai: dinh-nghia
    nguon:
      - omt-satb
    ket_qua: dung
    ghi_chu: 'OMT: soprano "treble clef with an up-stem"; alto "treble clef with a down-stem"; tenor "bass clef with an up-stem"; bass "bass clef with a down-stem".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/" ]
    luot_2_ghi_chu: "OMT: soprano và alto khóa Sol (khuông trên), tenor và bass khóa Fa; soprano và tenor đuôi lên, alto và bass đuôi xuống."
  - id: n10
    cau: Hợp âm ba có 3 nốt mà có 4 bè, nên phải nhân đôi một nốt.
    loai: quy-tac
    nguon:
      - omt-satb
    ket_qua: dung
    ghi_chu: 'OMT: với hợp âm ba, nốt ở bass thường được nhân đôi ở một bè trên; hợp âm bảy có bốn nốt nên không nhân đôi ("Seventh chords don''t have any notes doubled because they contain four notes, one for each voice part").'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/" ]
    luot_2_ghi_chu: "OMT: hợp âm bảy không nhân đôi vì có bốn nốt cho bốn bè; suy ra hợp âm ba (3 nốt) phải nhân đôi một nốt."
  - id: n11
    cau: Bè bass chơi nốt quyết định thể (thể gốc, thể đảo) của hợp âm.
    loai: dinh-nghia
    nguon:
      - omt-inversion
    ket_qua: dung
    ghi_chu: 'OMT, Inversion: "The bass voice of triadic harmonies, often simply called the "bass," determines inversion"; ở thể gốc bass là nốt gốc, ở đảo 1 bass là nốt ba.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/triads/" ]
    luot_2_ghi_chu: "OMT Triads: đảo = đổi nốt bass; ký hiệu hợp âm theo nốt thấp nhất (root position nốt gốc ở dưới)."
  - id: n12
    cau: Với hợp âm ba thể gốc, thường nhân đôi nốt gốc.
    loai: quy-tac
    nguon:
      - omt-satb
      - fff-guide
      - mt21c-voice
    ket_qua: dung
    ghi_chu: 'OMT: "the note in the bass is usually doubled in an upper voice" (thể gốc: bass là nốt gốc). Mount (Guide): "Root-position triads double the bass". MT21C 26.7: "Always double the root in root position triads."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/" ]
    luot_2_ghi_chu: "OMT: nốt ở bass thường được nhân đôi; Iowa State: thể gốc trưởng/thứ nhân đôi nốt gốc."
  - id: n13
    cau: Không bao giờ nhân đôi cảm âm (bậc 7).
    loai: quy-tac
    nguon:
      - omt-satb
      - fff-guide
      - iastate
    ket_qua: dung
    ghi_chu: 'OMT: "the leading tone is never doubled". Mount (Guide): "The leading tone should never be doubled, regardless of where it appears in the chord". Iowa State: "Do not double tendency tones (leading tone, altered tones, the chordal seventh ...)".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/" ]
    luot_2_ghi_chu: "OMT: 'the leading tone is never doubled'."
  - id: n14
    cau: 'Lý do không nhân đôi cảm âm: nó phải đi lên chủ âm, nhân đôi sẽ sinh quãng 8 song song.'
    loai: quy-tac
    nguon:
      - fff-14
      - fff-guide
    ket_qua: dung
    ghi_chu: 'Mount 14: nhân đôi cảm âm (Si trong V) "will lead to a parallel unison" khi Si giải quyết lên Đô; Mount (Guide): cảm âm trong hợp âm át "almost always resolves by step up to the tonic". Hai bè cách nhau một quãng 8 (hay trùng âm) cùng đi lên chủ âm tạo quãng 8 (hay đồng âm) song song.'
