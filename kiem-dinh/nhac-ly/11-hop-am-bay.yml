ghi_chu: 'Trang thể đảo và hợp âm bảy (tầng lõi). Nguồn chính: Open Music Theory (OMT), Inversion, Figured Bass and Roman Numerals with Figures, Seventh Chords, Chord Symbols, 6/4 Chords as Forms of Prolongation; đối chiếu Mount (FFF) ch. 13 (thể đảo triad), 18 (hợp âm bảy, Table 18-1/18-2), 19 (V7), 21 (bè trầm số: "a Baroque compositional practice"). WebFetch ngày 27/10/2026 (bản tóm tắt chữ, không phải HTML thô). Chỗ sửa trang: bỏ "màu sắc, vững nhất, nhẹ và linh hoạt hơn" của thể đảo (thay bằng điều OMT nói về 6/4); C/E "phổ biến" thành "thuộc hệ ký hiệu hợp âm của jazz và nhạc pop"; bỏ "quan trọng nhất" ở V7; bỏ "quãng căng nhất" và "rất rõ" ở mục V7; mục Nguồn. Mục doi_chu tự viết (không build được); người giao chạy lại so-chu --doi-chu để chuẩn hóa dấu nháy. Chưa chắc: n10 ("thường gặp": OMT chỉ nói "common embellishment"). Ký hiệu "B°7" và "Bø7" của trang là ký hiệu Bo7 và B∅7 của OMT. Câu về site: các trang chưa chuyển (piano/hop-am-rai, luyen-tap/ban-phim, xay-hop-am, luyen-tai/nghe-hop-am) kiểm trên ../opus-zero/docs/ và JavaScript cũ. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): seventh chord (hợp âm bảy), dominant seventh (bảy át), major/minor/half-diminished/diminished seventh (bảy trưởng, thứ, nửa giảm, giảm), root position (thể gốc), first/second/third inversion (đảo 1, 2, 3), bass (bè trầm), figured bass (bè trầm số), slash chord, chordal seventh (nốt bảy), tritone, cadential 6/4 (6/4 kết); đã có: inversion, chord, triad, leading tone, dominant.'
