    cau: "Bảy thứ: hợp âm thứ + 7 thứ; ví dụ Rê – Fa – La – Đô; ký hiệu Dm7; thường gặp ở ii, iii, vi."
    loai: dinh-nghia
    nguon:
      - omt-seventh
      - fff-seventh
      - omt-chord-symbols
    ket_qua: dung
    ghi_chu: "OMT, Seventh Chords: minor-minor (minor seventh) = minor triad + minor seventh, ký hiệu Fmi7; trên re, mi, la của gam trưởng. OMT, Chord Symbols: Cmi7, Cm7, C-7."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n15
    cau: "Bảy nửa giảm: hợp âm giảm + 7 thứ; ví dụ Si – Rê – Fa – La; ký hiệu Bø7; thường gặp ở vii trong giọng trưởng."
    loai: dinh-nghia
    nguon:
      - omt-seventh
      - fff-seventh
      - omt-chord-symbols
    ket_qua: dung
    ghi_chu: "OMT, Seventh Chords: half-diminished = diminished triad + minor seventh, ký hiệu F∅7 (ø7), trên ti của gam trưởng. B D F A."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n16
    cau: "Bảy giảm: hợp âm giảm + 7 giảm; ví dụ Si – Rê – Fa – La♭; ký hiệu B°7; thường gặp ở vii trong giọng thứ."
    loai: dinh-nghia
    nguon:
      - omt-seventh
      - fff-seventh
      - omt-chord-symbols
    ket_qua: dung
    ghi_chu: 'OMT, Seventh Chords: fully diminished = diminished triad + diminished seventh, ký hiệu Fo7, trên ti nâng của giọng thứ (G minor: raised ti). Mount 18: o7. "B°7" của trang là ký hiệu Bo7 (dấu vòng nhỏ). B D F A♭ = hai quãng 3 thứ chồng lên nhau và quãng 7 giảm (B–A♭ = 9 nửa cung).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n17
    cau: 'Khuông nhạc "5 loại hợp âm bảy" gồm Cmaj7, G7, Dm7, Bø7, B°7: [CEGB], [G,B,DF], [DFAc], [B,DFA], [B,DF_A].'
    loai: so-lieu
