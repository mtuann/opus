nhan_dinh:
  - id: n1
    cau: Nốt nằm ở bè trầm (thấp nhất) quyết định thể của hợp âm.
    loai: dinh-nghia
    nguon:
      - omt-inversion
      - fff-triads
    ket_qua: dung
    ghi_chu: 'OMT, Inversion: inversion = "Changing the bass note of a harmony so that, for example, the third is in the bass instead of the root"; bass = "The lowest part (or "voice") of a composition". Mount 13: thể gốc/đảo 1/đảo 2 xác định theo nốt ở bè trầm.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n2
    cau: "Thể gốc: nốt gốc ở bè trầm (ví dụ Đô – Mi – Sol), không ghi ký hiệu số, ký hiệu hợp âm C."
    loai: dinh-nghia
    nguon:
      - omt-inversion
      - omt-figured-bass
      - fff-triads
    ket_qua: dung
    ghi_chu: 'OMT, Inversion: "The bass note in root position is the root." OMT, Figured Bass: "no figure appears for root position." Ký hiệu C: OMT, Chord Symbols.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n3
    cau: "Đảo 1: nốt ba ở bè trầm (ví dụ Mi – Sol – Đô), ký hiệu số 6, ký hiệu hợp âm C/E."
    loai: dinh-nghia
    nguon:
      - omt-inversion
      - omt-figured-bass
      - omt-chord-symbols
      - fff-triads
    ket_qua: dung
    ghi_chu: 'OMT, Inversion: "when the third is in the bass the chord is in first inversion"; OMT, Figured Bass: "The superscript number "6" will result in a first inversion triad."; OMT, Chord Symbols: slash, bass note. Mount 13: first inversion 6/3, thường rút còn 6.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n4
    cau: "Đảo 2: nốt năm ở bè trầm (ví dụ Sol – Đô – Mi), ký hiệu số 6/4, ký hiệu hợp âm C/G."
    loai: dinh-nghia
    nguon:
      - omt-inversion
      - omt-figured-bass
      - omt-chord-symbols
      - fff-triads
    ket_qua: dung
    ghi_chu: 'OMT, Inversion: "when the fifth is in the bass we say the chord is in second inversion"; OMT, Figured Bass: second inversion triad "keeps its full figures" (6/4); Mount 13: "Second inversion triads are always represented with 6/4."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n5
    cau: 'Khuông nhạc "Đô trưởng: thể gốc, đảo 1, đảo 2" gồm [CEG], [EGc], [Gce].'
    loai: so-lieu
    nguon: &a1
      - omt-inversion
    ket_qua: dung
    ghi_chu: Khối abc 1, khớp bảng thể đảo. Xem khuong_nhac.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n6
    cau: "Các con số 6 và 6/4 đến từ bè trầm số (figured bass) thời Baroque: chúng ghi các quãng tính từ nốt trầm."
    loai: lich-su
    nguon:
      - fff-figured
      - omt-figured-bass
    ket_qua: dung
    ghi_chu: 'Mount 21: figured bass là "a Baroque compositional practice in which composers used a numerical shorthand"; các số "indicated intervals to be played above the bass". OMT, Figured Bass: "Arabic numerals ... which indicate intervals above the bass note".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/basso-continuo" ]
    luot_2_ghi_chu: Figured bass/basso continuo thế kỷ 17–18 (Concise Oxford); OMT nói chữ số ghi tắt từ figured bass.
  - id: n7
    cau: Ký hiệu kiểu C/E (hợp âm C, bè trầm Mi) thuộc hệ ký hiệu hợp âm của jazz và nhạc pop.
    loai: quy-tac
    nguon:
      - omt-chord-symbols
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "... phổ biến trong nhạc nhẹ và jazz." Chữ mới: "... thuộc hệ ký hiệu hợp âm của jazz và nhạc pop." Lý do: OMT, Chord Symbols không nói ký hiệu gạch chéo "phổ biến"; chỉ nói ký hiệu hợp âm có trên "lead sheets, which are jazz scores" và "In much of jazz and pop, the bass note is the root of the chord"; "If the bass note should be something other than the root, this is shown with a slash followed by the letter name of the bass note." (C/E: C trưởng với Mi ở bè trầm). Review D3-gom: chữ mới có trên trang; lượt 2 đọc OMT Inversion and Figured Bass (ký hiệu A/E), lượt 1 OMT Chord Symbols; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/" ]
    luot_2_ghi_chu: OMT dùng ký hiệu "A/E" trong ký hiệu hợp âm.
  - id: n8
    cau: Thể đảo không đổi tên hợp âm (nốt gốc vẫn là nốt gốc), chỉ đổi nốt ở bè trầm.
    loai: quy-tac
    nguon: *a1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thể đảo không đổi tên hợp âm, nhưng đổi màu sắc: thể gốc vững nhất, đảo 1 nhẹ và linh hoạt hơn, đảo 2 kém vững và thường chỉ dùng trong vài tình huống đặc biệt (như ngay trước kết)." Chữ mới: câu này cộng hai câu về đảo 2 (xem hai câu sau). Lý do: OMT, Inversion: "the root of the chord is always A, regardless of its inversion and bass note" (không đổi tên, nốt gốc không đổi); "màu sắc", "vững nhất", "nhẹ và linh hoạt hơn" không có nguồn nào kiểm được, đã bỏ. Review D3-gom: chữ mới có trên trang; OMT có hai địa chỉ cho chương này (/chapter/inversion/ "Inversion" và /chapter/inversion-and-figured-bass/), cùng câu "the root of the chord is always A, regardless of its inversion and bass note" (đã mở cả hai, 28/10/2026); giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n9
    cau: "Thể đảo 2 được xử lý đặc biệt: nốt năm ở bè trầm tạo quãng 4 nghịch với bè trầm."
    loai: quy-tac
    nguon:
      - omt-64
      - omt-counterpoint
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đảo 2 kém vững và thường chỉ dùng trong vài tình huống đặc biệt". Chữ mới: câu trên. Lý do: OMT, 6/4 Chords as Forms of Prolongation: "6/4 chords are treated in special ways because they contain a dissonance with the bass (the fourth)"; OMT, Species Counterpoint: quãng 4 đúng "is dissonant when it involves the lowest voice". (C trên G: quãng 4 đúng so với bè trầm.) Review D3-gom: chữ mới có trên trang; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/cadential-64/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n10
    cau: Dạng thể đảo 2 thường gặp là 6/4 kết, trang trí cho hợp âm V ở chỗ kết.
    loai: quy-tac
    nguon:
      - omt-64
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(như ngay trước kết)". Chữ mới: "6/4 kết, trang trí cho hợp âm V ở chỗ kết". Lý do: OMT, 6/4 Chords as Forms of Prolongation: cadential 6/4 "A common embellishment of the cadential V chord", cùng ba dạng khác (đi qua, láng giềng, rải); chữ "ngay trước kết" mơ hồ. Chưa chắc: "thường gặp" (OMT chỉ nói "common embellishment"); giữ. Review D3-gom: chữ mới có trên trang; "thường gặp" theo "A common embellishment" của OMT; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/cadential-64/" ]
    luot_2_ghi_chu: "Cadential 6/4: dạng tô điểm V; viết ký hiệu V6/4 (OMT)."
  - id: n11
    cau: "Chồng thêm một quãng 3 lên hợp âm ba, ta được hợp âm bảy: bốn nốt, nốt trên cùng cách nốt gốc quãng 7."
    loai: dinh-nghia
    nguon: &a2
      - omt-seventh
      - fff-seventh
    ket_qua: dung
    ghi_chu: 'OMT, Seventh Chords: "A seventh chord is a four-note chord whose notes can be arranged in thirds."; glossary: "A triad with an additional third above the fifth, creating a seventh between that top note and the bass and totaling four notes." Mount 18: "A seventh chord simply adds a diatonic third above the fifth of the triad."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n12
    cau: "Bảy trưởng: hợp âm trưởng + 7 trưởng; ví dụ Đô – Mi – Sol – Si; ký hiệu Cmaj7; thường gặp ở I, IV trong giọng trưởng."
    loai: dinh-nghia
    nguon:
      - omt-seventh
      - fff-seventh
    ket_qua: dung
    ghi_chu: "OMT, Seventh Chords: major-major (major seventh) = major triad + major seventh, ký hiệu Fma7; xuất hiện trên do và fa của gam trưởng. Mount 18, Table 18-1: MM. Ký hiệu Cmaj7: OMT, Chord Symbols (Cma7, Cmaj7)."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/" ]
    luot_2_ghi_chu: Khớp nguồn.
  - id: n13
    cau: "Bảy át: hợp âm trưởng + 7 thứ; ví dụ Sol – Si – Rê – Fa; ký hiệu G7; thường gặp ở V7."
    loai: dinh-nghia
    nguon:
      - omt-seventh
      - fff-seventh
      - fff-dom7
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (ô cuối): "V7, quan trọng nhất". Chữ mới: "V7". Lý do: "quan trọng nhất" là xếp hạng không kiểm được. OMT, Seventh Chords: major-minor (dominant seventh) = major triad + minor seventh, ký hiệu F7, trên sol của gam trưởng; OMT, Seventh Chords (glossary): "A seventh chord with a major triad and a minor seventh."; Mount 19: dominant seventh xây trên bậc 5. Review D3-gom: chữ mới có ở bảng hợp âm bảy (ô "V7"); giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/" ]
    luot_2_ghi_chu: Khớp nguồn.
