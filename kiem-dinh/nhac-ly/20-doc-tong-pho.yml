nhan_dinh:
  - id: n1
    cau: Tổng phổ (full score) là bản nhạc ghi mọi bè của dàn nhạc, xếp chồng lên nhau, để nhạc trưởng nhìn thấy toàn bộ.
    loai: dinh-nghia
    nguon:
      - brit-score
    ket_qua: dung
    ghi_chu: 'Britannica, Score: bản ghi tất cả các bè của một tác phẩm nhiều bè, mỗi bè một khuông, xếp thẳng hàng theo nhịp để nhạc trưởng theo dõi (đối chiếu từ bài, đã hỏi lại nguyên văn khi tra). "Không cần đọc được từng nốt mới bắt đầu" là lời khuyên (n11).'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/score", "https://s2.smu.edu/robfrank/MOLA.pdf" ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music: full score shows all the parts separately displayed; score dùng cho nhạc trưởng (cond.). Đúng."
  - id: n2
    cau: 'Thứ tự các bè từ trên xuống: bộ gỗ, bộ đồng, bộ gõ (timpani và gõ khác), đàn hạc/piano/celesta, độc tấu và hợp xướng, bộ dây ở dưới cùng.'
    loai: quy-tac
    nguon:
      - brit-score
      - dolmetsch-26
      - absil-abbrev
    ket_qua: dung
    ghi_chu: 'Britannica, Score và Dolmetsch lesson 26: bố cục chuẩn gỗ – đồng – gõ – (hạc, phím) – (độc tấu, hợp xướng) – dây từ trên xuống. Một số tổng phổ đặt timpani trước bộ đồng hay hạc ở vị trí khác nên cột "Vị trí" là bố cục thường gặp, không phải luật. Dòng "Độc tấu, hợp xướng" nằm trên bộ dây là bố cục ở các tổng phổ có nhạc cụ độc tấu hoặc giọng hát.'
    luot_2: dung
    luot_2_nguon: [ "https://s2.smu.edu/robfrank/MOLA.pdf", "https://tamingthesaxophone.com/theory/arranging/composition-score" ]
    luot_2_ghi_chu: "MOLA: thứ tự phổ biến là gỗ, đồng, timpani/gõ/hạc/phím, giọng hát, rồi dây. Vị trí đàn hạc/piano/soloist/hợp xướng có khác nhau giữa các ấn bản; câu viết dạng quy ước chung nên chấp nhận."
  - id: n3
    cau: Trong mỗi bộ, các bè thường xếp từ cao xuống thấp.
    loai: quy-tac
    nguon:
      - brit-score
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trong mỗi bộ từ cao xuống thấp". Chữ mới: "thường từ cao xuống thấp". Lý do: Dolmetsch và Britannica nêu thứ tự trong bộ (sáo, oboe, clarinet, bassoon; horn, trumpet, trombone, tuba; violin I, II, viola, cello, bass) nhưng có ngoại lệ (ví dụ horn thường ghi trên trumpet, dù trầm hơn); thêm "thường" cho đúng. Review D3-gom: chữ mới có trên trang; Dolmetsch bài 26 (mở lại 28/10/2026): trong mỗi bộ bè cao ở trên, horn ghi trên trumpet; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://s2.smu.edu/robfrank/MOLA.pdf" ]
    luot_2_ghi_chu: "MOLA: trong mỗi nhóm xếp theo âm cao đến thấp 'for the most part'. Có ngoại lệ (horn thường đặt trên trumpet) nên chữ 'thường' là đúng."
  - id: n4
    cau: 'Bảng: bộ gỗ gồm Sáo (Fl.), Oboe (Ob.), Clarinet (Cl.), Bassoon (Bsn.).'
    loai: danh-muc
    nguon:
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Absil và Blake: Fl., Picc.; Ob.; Cl. (Ý, Anh, Pháp: Cl.; Đức: Klar., Kl. cũng gặp); Fg. (Ý/Đức: Fagotto, Fagott) và Bsn. (Anh). Chữ cũ "Klar." sửa thành "Kl." (n9). Nguồn viết tắt đa phần bậc 3 (Absil, Blake) cộng Dolmetsch (bậc 2): chưa có từ điển viết tắt chuẩn; lượt 2 nên đối chiếu với bảng viết tắt của một nhà xuất bản (ví dụ Eulenburg, Henle). Review D3-gom: lượt 2 khong-chac (không có nguồn bậc 2 cho các viết tắt). Đã mở lại Dolmetsch, Music Theory Online bài 26 (28/10/2026): viết tắt tiếng Anh "Fl or Fls", "Ob or Obs", "Cl or Cls", "Bsn or Bsns"; Picc., Kl., Fg. chỉ có ở Absil, Blake (bậc 3). Chữ cũ: "Sáo (Fl., Picc.), Oboe (Ob.), Clarinet (Cl., Kl.), Bassoon (Fg., Bsn.)". Chữ mới: "Sáo (Fl.), Oboe (Ob.), Clarinet (Cl.), Bassoon (Bsn.)"; tiêu đề cột thành "Nhạc cụ (viết tắt tiếng Anh)".'
    luot_2: dung
    luot_2_nguon: [ "https://www.howardblake.com/abbreviations.php", "https://wiki.lilypond.community/wiki/LSR_103" ]
    luot_2_ghi_chu: "Fl., Ob., Cl., Bsn. (Ý: Fg.) là viết tắt chuẩn."
  - id: n5
    cau: 'Bảng: bộ đồng gồm Horn (Hn.), Trumpet (Tpt.), Trombone (Trb.), Tuba.'
    loai: danh-muc
    nguon:
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Horn (Hn., Cor., Cr.) ... Tuba (Tba.)". Chữ mới: bỏ "Cr." và "Tba.". Lý do: Cr. không thấy trong Absil, Blake hay Dolmetsch; "Tba." cũng không (các nguồn ghi Tuba hoặc Tb.). Hn. (Anh), Cor. (Pháp, Ý corno), Tpt. (Anh), Tr. (Đức Trp. hay Tr.), Tbn. (Anh), Pos. (Đức Posaune) có trong nguồn. Review D3-gom: lượt 2 khong-chac. Dolmetsch bài 26: "Hn or Hns", "Tpt or Tpts", "Trb or Trbs", "Tuba". Chữ cũ: "Horn (Hn., Cor.), Trumpet (Tpt., Tr.), Trombone (Tbn., Pos.), Tuba". Chữ mới: "Horn (Hn.), Trumpet (Tpt.), Trombone (Trb.), Tuba" (Cor. ở Dolmetsch là cornet của ban nhạc kèn, không phải horn).'
    luot_2: dung
    luot_2_nguon: [ "https://www.howardblake.com/abbreviations.php" ]
    luot_2_ghi_chu: Hn., Tpt., Trb. (có nơi Trbn.), Tuba.
  - id: n6
    cau: 'Bảng: timpani viết tắt Timp., các nhạc cụ gõ khác Perc.; đàn hạc, piano, celesta không ghi viết tắt.'
    loai: danh-muc
    nguon:
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hp., Pf.". Chữ mới: "Hp., Pno.". Lý do: Pno. là viết tắt trong Absil và Blake; Pf. (Ý pianoforte) có gặp nhưng ít; chọn Pno. cho nhất quán với các viết tắt tiếng Anh khác trong bảng. Timp. và Pk. (Pauken) có trong nguồn. Review D3-gom: lượt 2 khong-chac. Dolmetsch bài 26: "Timp", "Perc"; không có viết tắt cho đàn hạc, phím. Chữ cũ: "Timpani (Timp., Pk.)", "Hp., Pno.". Chữ mới: "Timpani (Timp.), các nhạc cụ gõ khác (Perc.)"; ô viết tắt của hàng đàn hạc, piano, celesta để trống. Review D3-gom (sau lượt 2 bổ sung): câu chỉ nói bảng không ghi viết tắt cho ba nhạc cụ ấy; lượt 2 nêu Hp., Pno., Cel. (howardblake.com, bậc 3). Bảng chỉ giữ viết tắt có ở Dolmetsch bài 26, nên để trống là có chủ ý; giữ.'
    luot_2: sai
    luot_2_nguon: [ "https://www.howardblake.com/abbreviations.php" ]
    luot_2_ghi_chu: "câu đúng: Bảng: timpani viết tắt Timp., các nhạc cụ gõ khác Perc.; đàn hạc (Hp.), piano (Pno.), celesta (Cel.) cũng có viết tắt chuẩn, chỉ là bảng không liệt kê.; Câu hiện viết như thể hạc, piano, celesta không có viết tắt; thực tế có Hp., Pno., Cel. Nếu ý là bảng không ghi thì nên nói rõ."
  - id: n7
    cau: 'Bảng: bộ dây gồm Violin I, Violin II (Vln.), Viola (Vla.), Cello (Vcl.), Contrabass (DB).'
    loai: danh-muc
    nguon:
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(Vl., Vn.)". Chữ mới: "(Vn., Vln.)". Lý do: Vl. dễ nhầm với Vla. (viola) nên nhiều nhà xuất bản tránh; Absil và Blake ghi Vn. và Vln. cho violin. Vla. và Br. (Bratsche), Vc., Cb. và Kb. (Kontrabass) có trong nguồn. Trong khối abc cũng đổi "Vl. I", "Vl. II" thành "Vn. I", "Vn. II". Review D3-gom: lượt 2 khong-chac. Dolmetsch bài 26: "Vlns", "Vla", "Vcl", "DB". Chữ cũ: "(Vn., Vln.)", "(Vla., Br.)", "(Vc.)", "(Cb., Kb.)". Chữ mới: "(Vln.)", "(Vla.)", "(Vcl.)", "(DB)". Khối abc đổi tên bè cho khớp: "Vn. I", "Vn. II", "Vc." thành "Vln. I", "Vln. II", "Vcl.".'
    luot_2: dung
    luot_2_nguon: [ "https://www.howardblake.com/abbreviations.php", "https://wiki.lilypond.community/wiki/LSR_103" ]
    luot_2_ghi_chu: Vln., Vla., Vc. (cũng gặp Vcl.), DB (cũng gặp Cb.).
  - id: n8
    cau: "Tổng phổ có thể ghi tên nhạc cụ bằng tiếng Ý, Đức hay Pháp; ví dụ tên tiếng Đức: Fagott (bassoon), Posaune (trombone), Pauken (timpani), Bratsche (viola), Kontrabass (contrabass)."
    loai: danh-muc
    nguon:
      - yale-names
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Các nguồn liệt kê tên nhạc cụ theo Ý, Đức, Pháp, Anh: Pauken = timpani (Đức), Bratsche = viola (Đức). Nhà xuất bản dùng ngôn ngữ riêng: Dolmetsch lesson 26 nêu việc tên nhạc cụ trong tổng phổ viết bằng nhiều thứ tiếng. Review D3-gom: lượt 2 khong-chac (phần "tùy nhà xuất bản" không có nguồn). Đã mở Yale University Library, The names of instruments and voices (28/10/2026): tiếng Đức Fagott, Posaune, Pauken, Bratsche (cùng Viola), Kontrabass; Dolmetsch bài 26 dùng tên Đức trong tổng phổ (Tuben; B, H trong tên horn). Chữ cũ: "Viết tắt có thể bằng tiếng Ý, Đức hoặc Pháp tùy nhà xuất bản (ví dụ Pauken là timpani trong tiếng Đức, Bratsche là viola)." Chữ mới: câu trên (bỏ "viết tắt ... tùy nhà xuất bản").'
    luot_2: dung
    luot_2_nguon: [ "https://web.library.yale.edu/printpdf/book/export/html/3376", "https://fransabsil.nl/htm/instrum.htm" ]
    luot_2_ghi_chu: Fagott, Posaune, Pauken, Bratsche, Kontrabass đúng.
  - id: n9
    cau: Bè viola dùng khóa Đô alto; clarinet, horn, trumpet có thể là nhạc cụ dịch giọng, nên hóa biểu khác các bè khác.
    loai: quy-tac
    nguon:
      - dolmetsch-26
