    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 06/11/2026) và file src/components/hinh/tong-pho.html. Thứ tự sáu nhóm và tên viết tắt đúng thứ tự dòng và cột \"Nhạc cụ\" của bảng (n2 thứ tự, n4–n7 tên viết tắt; n3: trong mỗi bộ thường từ cao xuống thấp, hình giữ đúng thứ tự bảng); \"Violin I, Violin II (Vln.)\" vẽ thành hai khuông Vln. I, Vln. II; dòng đàn hạc, piano, celesta (bảng không ghi viết tắt) một khuông có nhãn chữ đầy đủ; dòng độc tấu, hợp xướng ghi \"(nếu có)\" như bảng. Màu thanh ngoặc lấy đúng màu ô trong seating.html: bộ gỗ #8cc49a (ô Sáo, Oboe, Clarinet, Bassoon), bộ đồng #e0b45e, bộ gõ #c9a0dc (ô Timpani · bộ gõ), đàn hạc #9fd0d0 (ô Harp), bộ dây #7aa6d6 (tests/hinh-ve-lai-bang.test.mjs so tự động). Chú thích hình nói lại câu của trang (bộ gỗ trên cùng, bộ dây dưới cùng; n11). Hình không thêm nhạc cụ, khóa nhạc hay quy ước nào ngoài bảng; khuông để trống, không vẽ khóa. Soát hình 2C (gộp review và kiểm mẫu): người soát không phải người vẽ; đọc src/components/hinh/tong-pho.html, seating.html và SVG trong dist/nhac-ly/20-doc-tong-pho/index.html (bản xem, 07/11/2026), ảnh chụp 360 và 1280 px. Từ trên xuống: Bộ gỗ (Fl., Ob., Cl., Bsn.), Bộ đồng (Hn., Tpt., Trb., Tuba), Bộ gõ (Timp., Perc.), Đàn hạc, piano, celesta (một khuông), Độc tấu, hợp xướng (nếu có; khuông nét đứt, không ngoặc màu vì seating không có), Bộ dây (Vln. I, Vln. II, Vla., Vcl., DB): đúng thứ tự dòng và cột \"Nhạc cụ\" của bảng; mỗi ngoặc phủ đúng các khuông của bộ mình. Màu ngoặc: gỗ #8cc49a = ô Sáo/Oboe, Clarinet/Bassoon; đồng #e0b45e = ô Kèn horn, Trumpet, Trombone/Tuba; gõ #c9a0dc = ô Timpani · bộ gõ; đàn hạc… #9fd0d0 = ô Harp (piano, celesta không có trong seating, chỉ dùng chung màu nhóm); dây #7aa6d6 = năm ô bộ dây. Khuông trống, không khóa nhạc, không viết tắt cho đàn hạc, piano, celesta (bảng không ghi). Chú thích nói lại câu của trang. Hình không nói điều trang không viết."
    review: dung
