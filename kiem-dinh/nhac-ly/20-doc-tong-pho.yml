tang: loi
lan:
  - so: 1
    ngay: 2026-10-28
    nhanh: moi/d3-l3
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L3 lượt 1, phần 1/2)
      luot_2: null
      review: null
      kiem_mau: null
ghi_chu: 'Trang đọc tổng phổ (tầng lõi), hình ::hinh{ten="seating"} (src/components/hinh/seating.html) và một khối abc. Nguồn chính: Britannica (Score), Dolmetsch lesson 26, Berlin Phil (xếp chỗ), Absil và Blake (viết tắt, bậc 3), sơ đồ dàn nhạc của một trường và của bsolive (bậc 3; không rõ dàn nhạc), Understanding Music (Haydn 94), Burgess Hill SO và Indianapolis SO (Beethoven 5). WebFetch ngày 28/10/2026 (bản tóm tắt chữ; chỗ quan trọng đã hỏi lại nguyên văn). Chỗ sửa trang: (1) "từ cao xuống thấp" thành "thường từ cao xuống thấp"; (2) viết tắt: Klar. thành Kl., bỏ Cr., Tba. thành Tuba, Pf. thành Pno., Vl. thành Vln. (cũng đổi "Vl. I/II" trong abc thành "Vn. I/II"); (3) câu về chỗ ngồi trên sân khấu viết lại vì chữ cũ tự mâu thuẫn (n11); (4) "YouTube" thành "các trang chia sẻ video"; (5) mục Nguồn (thêm Haydn 94). Hình seating: không sửa; vị trí chi tiết (horn, trumpet, hạc, timpani) thay đổi giữa các dàn nhạc, chú thích dưới hình đã dè dặt; người giao nên đọc lại n12 và quyết có đổi chữ aria-label "bộ đồng phía sau" không (thứ tự các bộ khớp ba nguồn). Chưa chắc: n4 (viết tắt chủ yếu từ nguồn bậc 3; lượt 2 nên đối chiếu một bảng viết tắt của nhà xuất bản), n24 (Bärenreiter chưa mở), n25 (hai hợp âm cuối của vòng Canon chưa đối chiếu bản nhạc, như bài 12). Trang đích chưa chuyển: /opus/nghe-nhac/haydn-94/, /opus/nghe-nhac/mozart-40/, /opus/nghe-nhac/beethoven-5/ (n21; beethoven-5 cũ cần giữ câu "chủ đề 2 được kèn horn giới thiệu" cho bài tập 3), /opus/tai-lieu-tham-khao/. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): score / full score (tổng phổ), study score (tổng phổ khổ nhỏ), woodwind (bộ gỗ), brass (bộ đồng), percussion (bộ gõ), strings (bộ dây), transposing instrument (nhạc cụ dịch giọng), contrabass, conductor (nhạc trưởng); các tên nhạc cụ (violin, viola, cello, timpani, oboe...) chưa kiểm có trong từ điển hay không. Bản ghi string-quartet đã có hồ sơ riêng (cùng phần 1/2).'
