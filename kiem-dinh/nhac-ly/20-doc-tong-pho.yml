nhan_dinh:
  - id: n1
    cau: Tổng phổ (full score) là bản nhạc ghi mọi bè của dàn nhạc, xếp chồng lên nhau, để nhạc trưởng nhìn thấy toàn bộ.
    loai: dinh-nghia
    nguon:
      - brit-score
    ket_qua: dung
    ghi_chu: 'Britannica, Score: bản ghi tất cả các bè của một tác phẩm nhiều bè, mỗi bè một khuông, xếp thẳng hàng theo nhịp để nhạc trưởng theo dõi (đối chiếu từ bài, đã hỏi lại nguyên văn khi tra). "Không cần đọc được từng nốt mới bắt đầu" là lời khuyên (n11).'
  - id: n2
    cau: 'Thứ tự các bè từ trên xuống: bộ gỗ, bộ đồng, bộ gõ (timpani và gõ khác), đàn hạc/piano/celesta, độc tấu và hợp xướng, bộ dây ở dưới cùng.'
    loai: quy-tac
    nguon:
      - brit-score
      - dolmetsch-26
      - absil-abbrev
    ket_qua: dung
    ghi_chu: 'Britannica, Score và Dolmetsch lesson 26: bố cục chuẩn gỗ – đồng – gõ – (hạc, phím) – (độc tấu, hợp xướng) – dây từ trên xuống. Một số tổng phổ đặt timpani trước bộ đồng hay hạc ở vị trí khác nên cột "Vị trí" là bố cục thường gặp, không phải luật. Dòng "Độc tấu, hợp xướng" nằm trên bộ dây là bố cục ở các tổng phổ có nhạc cụ độc tấu hoặc giọng hát.'
  - id: n3
    cau: Trong mỗi bộ, các bè thường xếp từ cao xuống thấp.
    loai: quy-tac
    nguon:
      - brit-score
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trong mỗi bộ từ cao xuống thấp". Chữ mới: "thường từ cao xuống thấp". Lý do: Dolmetsch và Britannica nêu thứ tự trong bộ (sáo, oboe, clarinet, bassoon; horn, trumpet, trombone, tuba; violin I, II, viola, cello, bass) nhưng có ngoại lệ (ví dụ horn thường ghi trên trumpet, dù trầm hơn); thêm "thường" cho đúng.'
  - id: n4
    cau: 'Bảng: bộ gỗ gồm Sáo (Fl., Picc.), Oboe (Ob.), Clarinet (Cl., Kl.), Bassoon (Fg., Bsn.).'
    loai: danh-muc
    nguon:
      - absil-abbrev
      - blake-abbrev
      - dolmetsch-26
    ket_qua: dung
    ghi_chu: 'Absil và Blake: Fl., Picc.; Ob.; Cl. (Ý, Anh, Pháp: Cl.; Đức: Klar., Kl. cũng gặp); Fg. (Ý/Đức: Fagotto, Fagott) và Bsn. (Anh). Chữ cũ "Klar." sửa thành "Kl." (n9). Nguồn viết tắt đa phần bậc 3 (Absil, Blake) cộng Dolmetsch (bậc 2): chưa có từ điển viết tắt chuẩn; lượt 2 nên đối chiếu với bảng viết tắt của một nhà xuất bản (ví dụ Eulenburg, Henle).'
  - id: n5
    cau: 'Bảng: bộ đồng gồm Horn (Hn., Cor.), Trumpet (Tpt., Tr.), Trombone (Tbn., Pos.), Tuba.'
    loai: danh-muc
    nguon:
      - absil-abbrev
      - blake-abbrev
      - dolmetsch-26
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Horn (Hn., Cor., Cr.) ... Tuba (Tba.)". Chữ mới: bỏ "Cr." và "Tba.". Lý do: Cr. không thấy trong Absil, Blake hay Dolmetsch; "Tba." cũng không (các nguồn ghi Tuba hoặc Tb.). Hn. (Anh), Cor. (Pháp, Ý corno), Tpt. (Anh), Tr. (Đức Trp. hay Tr.), Tbn. (Anh), Pos. (Đức Posaune) có trong nguồn.'
  - id: n6
    cau: 'Bảng: timpani viết tắt Timp., Pk. (Pauken trong tiếng Đức); đàn hạc Hp.; piano Pno.'
    loai: danh-muc
    nguon:
      - absil-abbrev
      - blake-abbrev
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hp., Pf.". Chữ mới: "Hp., Pno.". Lý do: Pno. là viết tắt trong Absil và Blake; Pf. (Ý pianoforte) có gặp nhưng ít; chọn Pno. cho nhất quán với các viết tắt tiếng Anh khác trong bảng. Timp. và Pk. (Pauken) có trong nguồn.'
  - id: n7
    cau: 'Bảng: bộ dây gồm Violin I, Violin II (Vn., Vln.), Viola (Vla., Br.), Cello (Vc.), Contrabass (Cb., Kb.).'
    loai: danh-muc
    nguon:
      - absil-abbrev
      - blake-abbrev
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(Vl., Vn.)". Chữ mới: "(Vn., Vln.)". Lý do: Vl. dễ nhầm với Vla. (viola) nên nhiều nhà xuất bản tránh; Absil và Blake ghi Vn. và Vln. cho violin. Vla. và Br. (Bratsche), Vc., Cb. và Kb. (Kontrabass) có trong nguồn. Trong khối abc cũng đổi "Vl. I", "Vl. II" thành "Vn. I", "Vn. II".'
  - id: n8
    cau: Viết tắt có thể bằng tiếng Ý, Đức hoặc Pháp tùy nhà xuất bản; Pauken là timpani trong tiếng Đức, Bratsche là viola.
    loai: danh-muc
    nguon:
      - absil-abbrev
      - blake-abbrev
      - dolmetsch-26
    ket_qua: dung
    ghi_chu: 'Các nguồn liệt kê tên nhạc cụ theo Ý, Đức, Pháp, Anh: Pauken = timpani (Đức), Bratsche = viola (Đức). Nhà xuất bản dùng ngôn ngữ riêng: Dolmetsch lesson 26 nêu việc tên nhạc cụ trong tổng phổ viết bằng nhiều thứ tiếng.'
  - id: n9
    cau: Bè viola dùng khóa Đô alto; clarinet, horn, trumpet có thể là nhạc cụ dịch giọng, nên hóa biểu khác các bè khác.
    loai: quy-tac
    nguon:
      - dolmetsch-26
    ket_qua: dung
    ghi_chu: 'Kiểm ở kiem-dinh/nhac-ly/17-khoa-do-dich-giong.yml (viola khóa Đô alto; clarinet, horn, trumpet dịch giọng). "Hóa biểu khác": bè dịch giọng ghi ở giọng ghi chép, nên hóa biểu có thể khác bè ở âm thật. Dolmetsch lesson 26 nêu bè dịch giọng trong tổng phổ.'
  - id: n10
    cau: Bài 17 của site (/opus/nhac-ly/17-khoa-do-dich-giong/) nói về khóa Đô alto và nhạc cụ dịch giọng.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'src/content/docs/nhac-ly/17-khoa-do-dich-giong.md (cùng lô, phần 1/2): có mục khóa Đô alto và nhạc cụ dịch giọng; trang cũ cùng tên.'
  - id: n11
    cau: 'Thứ tự trên sân khấu, từ trước ra sau: bộ dây, bộ gỗ, bộ đồng, bộ gõ; trong tổng phổ gỗ ở trên cùng, dây ở dưới cùng.'
    loai: quy-tac
    nguon:
      - berlin-seating
      - school-layout
      - bso-layout
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thứ tự từ trên xuống trong tổng phổ (gỗ – đồng – gõ – dây) gần giống thứ tự từ sau ra trước trên sân khấu, chỉ khác là bộ gỗ được ghi lên trên cùng". Chữ mới: câu trên. Lý do: chữ cũ tự mâu thuẫn. Thứ tự gỗ – đồng – gõ – dây từ trên xuống không "gần giống" sau ra trước (sau ra trước trên sân khấu là gõ, đồng, gỗ, dây, tức đảo hẳn): dây trước, gỗ giữa, đồng sau, gõ sau cùng (Berlin Phil, sơ đồ trường học, sơ đồ bsolive). Chữ mới nói đúng sự khác nhau.'
  - id: n12
    cau: 'Hình seating: dây (violin 1, violin 2, viola, cello, contrabass) ở phía trước gần nhạc trưởng, gỗ ở giữa, đồng phía sau, bộ gõ (timpani) sau cùng.'
    loai: so-lieu
    nguon:
      - berlin-seating
      - school-layout
      - bso-layout
    ket_qua: dung
    ghi_chu: 'src/components/hinh/seating.html (::hinh{ten="seating"}), chữ trong hình và aria-label. Thứ tự các bộ khớp ba nguồn: Berlin Phil (dây quanh nhạc trưởng, gỗ giữa, đồng và gõ phía sau), sơ đồ trường học Cirencester Kingshill và sơ đồ bsolive. Trong hình: violin 1 ở bên trái, rồi violin 2, viola, cello, contrabass sang phải; sáo/oboe bên trái, clarinet/bassoon bên phải; horn trái, trumpet giữa, trombone/tuba phải; hạc bên trái; timpani sau cùng ở giữa: khớp bố cục Mỹ phổ biến (violin 1 trái, contrabass phải) trong sơ đồ trường học và bsolive. Vị trí chi tiết của horn, trumpet, hạc, timpani thay đổi theo dàn nhạc (Berlin Phil nói thẳng mỗi nhạc trưởng xếp theo ý): chú thích dưới hình đã dè dặt ("một cách xếp chỗ thường gặp; mỗi dàn nhạc có thể bố trí khác"). Không sửa hình.'
  - id: n13
    cau: 'Chú thích hình: "Một cách xếp chỗ thường gặp; mỗi dàn nhạc có thể bố trí khác (ví dụ violin 2 ngồi bên phải)."'
    loai: quy-tac
    nguon:
      - berlin-seating
    ket_qua: dung
    ghi_chu: 'Berlin Phil: nhạc trưởng chọn cách xếp; xếp violin 1 và violin 2 đối diện nhau (violin 2 bên phải nhạc trưởng) là cách có thật (nhạc cổ điển, "antiphonal"). Câu đã dè dặt.'
  - id: n14
    cau: 'Cách theo dõi: bám vào bè violin I (dòng đầu của bộ dây), phần lớn thời gian giai điệu chính ở đây.'
    loai: khuyen-tap
    nguon:
      - brit-score
      - dolmetsch-26
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên học tập, đã hạ giọng ("phần lớn thời gian"). Nguồn không đo được tỉ lệ; Britannica Score không nói. Ghi: khuyen-tap, người review xem có giữ cụm "phần lớn thời gian" không.'
  - id: n15
    cau: 'Cách theo dõi: lật trang theo nhịp; nhìn hình dạng (nốt đi lên thì âm thanh đi lên; khuông dày nốt là đoạn nhanh; khuông trống là nhạc cụ nghỉ); tìm bè đang chơi giai điệu (khi violin I nghỉ, quét lên bộ gỗ); chú ý số chỉ nhịp, tốc độ, sắc thái.'
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Bốn lời khuyên học tập, phần sự kiện đúng: nốt cao trên khuông ứng với âm cao; khuông có nhiều nốt thường là đoạn nhiều nốt trong một ô (nhanh hoặc dày); dấu lặng dài là bè nghỉ.'
  - id: n16
    cau: 'Bảng cấp độ: 1 sonata piano (Mozart, Beethoven), chỉ 2 khuông.'
    loai: cap-do
    nguon:
      - omt-grand-staff
    ket_qua: dung
    ghi_chu: 'OMT, The Keyboard and the Grand Staff: nhạc piano ghi trên khuông liên (grand staff) hai khuông.'
  - id: n17
    cau: 'Bảng cấp độ: 2 tứ tấu đàn dây của Haydn, 4 khuông.'
    loai: cap-do
    nguon:
      - oxford-string-quartet
    ket_qua: dung
    ghi_chu: 'Oxford Dictionary of Music, string quartet: hai violin, viola, cello (bốn bè, mỗi bè một khuông); Haydn là người đặt nền cho thể loại (cũng kiểm ở hồ sơ thuật ngữ string-quartet).'
  - id: n18
    cau: 'Bảng cấp độ: 3 Haydn Giao hưởng số 94 chương 2, dàn nhạc nhỏ, giai điệu rõ.'
    loai: cap-do
    nguon:
      - vccs-haydn94
    ket_qua: dung
    ghi_chu: 'Understanding Music (VCCS), Performing Forces: 2 sáo, 2 oboe, 2 trumpet, 2 horn, 2 bassoon, timpani, bộ dây; không có clarinet, trombone: nhỏ hơn Beethoven 5. "Giai điệu rõ" là lời khuyên, chương 2 là Andante với chủ đề đơn giản (trang cũ nghe-nhac/haydn-94.md).'
  - id: n19
    cau: 'Bảng cấp độ: 4 Mozart Giao hưởng số 40, hình thức sonata rõ ràng.'
    loai: cap-do
    nguon:
      - indy-mozart40
      - omt-sonata
    ket_qua: dung
