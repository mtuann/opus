  - id: n11
    cau: 'Thứ tự trên sân khấu, từ trước ra sau: bộ dây, bộ gỗ, bộ đồng, bộ gõ; trong tổng phổ gỗ ở trên cùng, dây ở dưới cùng.'
    loai: quy-tac
    nguon:
      - berlin-seating
      - school-layout
      - bso-layout
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thứ tự từ trên xuống trong tổng phổ (gỗ – đồng – gõ – dây) gần giống thứ tự từ sau ra trước trên sân khấu, chỉ khác là bộ gỗ được ghi lên trên cùng". Chữ mới: câu trên. Lý do: chữ cũ tự mâu thuẫn. Thứ tự gỗ – đồng – gõ – dây từ trên xuống không "gần giống" sau ra trước (sau ra trước trên sân khấu là gõ, đồng, gỗ, dây, tức đảo hẳn): dây trước, gỗ giữa, đồng sau, gõ sau cùng (Berlin Phil, sơ đồ trường học, sơ đồ bsolive). Chữ mới nói đúng sự khác nhau. Review D3-gom: lượt 2 khong-chac (không mở được nguồn). Đã mở lại Berliner Philharmoniker (28/10/2026): "the softer strings sit at the front", "followed by the more powerful woodwinds", "then the louder brass", "finally the percussion at the back". Thứ tự tổng phổ theo Dolmetsch bài 26. Giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Cách xếp chỗ phổ biến (dây phía trước, gỗ, đồng, gõ phía sau) đúng theo hiểu biết thông dụng, nhưng các trang đã mở (Wikipedia Symphony orchestra, Second violin) không mô tả bố cục; chưa có nguồn bậc 2 đã mở. Phần 'trong tổng phổ gỗ trên cùng, dây dưới cùng' đúng (MOLA).
