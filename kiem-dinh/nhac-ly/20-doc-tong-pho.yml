khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - nhip
      - giong
      - khoa-nhac
      - hop-am
    ket_qua: dung
    ghi_chu: 'K:D, M:2/2, L:1/2, bốn bè: V1 (khóa Sol): f e | d c | B A | B c (Fa♯5 Mi5 Rê5 Đô♯5 Si4 La4 Si4 Đô♯5); V2 (Sol): d c | B A | G F | G A; V3 (viola, khóa Đô alto): A A | F F | D D | D E; V4 (cello, khóa Fa): D, A,, | B,, F,, | G,, D, | G,, A,,. Hợp âm mỗi ô: D (Rê–Fa♯–La), A (La–Đô♯–Mi), Bm (Si–Rê–Fa♯), F♯m (Fa♯–La–Đô♯), G (Sol–Si–Rê), D, G, A: đủ hợp âm ba (đã dùng abcjs xuất cao độ tuyệt đối; khóa Đô alto giữ cao độ). Chữ "Vn. I", "Vn. II" sửa theo n7. Mỗi ô 2 nửa-nốt trắng (2/2): đủ. Hai hợp âm cuối (G, A thay vì kết) giống khung bài 12: chưa đối chiếu bản Pachelbel (chưa chắc, như hồ sơ bài 12).'
