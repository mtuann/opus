nhan_dinh:
  - id: n1
    cau: Nếu giai điệu chỉ dùng các nốt thuộc hợp âm đang vang, nó sẽ cứng như bài tập rải hợp âm. Các nốt không thuộc hợp âm làm giai điệu mềm mại, tạo căng thẳng rồi giải tỏa.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Nhận xét thẩm mỹ mở bài, không có con số hay sự kiện. OMT, Embellishing Tones: các nốt ấy "embellish notes that belong to the chord" (trang diễn đạt bằng hình ảnh). Review soát nhãn: giữ khuyen-tap hay bỏ.'
    luot_2: dung
    luot_2_ghi_chu: Khuyên nghe hợp lý.
  - id: n2
    cau: Các nốt không thuộc hợp âm đang vang được gọi là âm ngoài hợp âm (non-chord tones).
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'OMT: các nốt này gọi chung là "embellishing tones"; "In almost all cases, however, the embellishing tone is a note that doesn''t belong to the underlying chord"; ở mục nốt đón trước OMT dùng "non-chord tone". Tên chính của OMT là embellishing tones (trang dùng "âm ngoài hợp âm (non-chord tones)", cách gọi của nhiều giáo trình khác): ghi cho D3-L5.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n3
    cau: Nốt lướt (passing tone) đến bằng bước liền và rời bằng bước liền cùng hướng.
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'OMT: "Passing tones are approached by step and left by step in the same direction, either ascending or descending."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n4
    cau: Nốt thêu (neighbor tone) đến bằng bước liền và rời bằng bước liền quay lại.
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'OMT: "Neighbor tones are approached by step and left by step in the opposite direction." (có thêu trên và thêu dưới).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n5
    cau: Nốt treo (suspension) giữ nguyên từ hợp âm trước và rời bằng bước liền xuống.
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'OMT: "Suspensions are approached by a static note and left by step down", luôn ở phách mạnh hơn (chương gọi retardation là nốt rời bằng bước lên).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: "OMT: tiếp cận bằng nốt giữ nguyên, rời bằng bước xuống, ở phách mạnh."
  - id: n6
    cau: Nốt dựa (appoggiatura) đến bằng nhảy, ở phách mạnh, rời bằng bước liền.
    loai: dinh-nghia
    nguon:
      - omt-embellishing
      - oxford-appoggiatura
    ket_qua: dung
    ghi_chu: 'OMT: "Appoggiaturas are approached by leap and left by step in the opposite direction", thường ở phách mạnh hơn các nốt quanh nó.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: "OMT: tiếp cận bằng nhảy, rời bằng bước ngược chiều, thường ở phách mạnh."
  - id: n7
    cau: 'Nốt đón trước (anticipation): nốt của hợp âm sau vang lên sớm và giữ nguyên sang hợp âm sau; cách đến không có quy định.'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (bảng, cột "Đến bằng"): "Bước liền". Chữ mới: "Không có quy định". Lý do: OMT: "anticipations are a two-note (rather than three-note) gesture, in which a chord tone is heard early as a non-chord tone"; bảng tổng hợp của OMT ghi cách đến là "N/A", cách rời là "Static note", thường ở phách yếu hơn. Ví dụ của trang (B → C) vẫn đến bằng bước liền, chỉ là không bắt buộc. Review D3-gom: chữ mới có ở bảng ("Không có quy định"); giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: "OMT: nốt hợp âm vang sớm, thường ở phách yếu; cách đến không ràng buộc."
  - id: n8
    cau: Âm nền (pedal point) là một nốt giữ dài ở bè trầm trong khi hợp âm bên trên thay đổi.
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'OMT: "Pedal tones are often found in the bass"; mục từ: "static notes ... below chord changes that do not include the bass" (bản tóm tắt WebFetch nên chữ ngoài dấu nháy là diễn đạt lại). Quiz của trang nói "thường ở bè trầm", khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: 'OMT dùng thuật ngữ "pedal tone": nốt tĩnh dưới các hợp âm đổi.'
  - id: n9
    cau: 'Ví dụ trên hợp âm Đô: Đô – Rê – Mi (Rê lướt), Mi – Fa – Mi (Fa thêu), Fa giữ từ hợp âm F xuống Mi (nốt treo), Rê nhảy tới rồi xuống Đô (nốt dựa), Sol giữ ở bè trầm qua nhiều hợp âm (âm nền).'
    loai: so-lieu
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'Hợp âm Đô = Đô – Mi – Sol; Rê và Fa không thuộc hợp âm. Từng ví dụ khớp định nghĩa OMT ở n3–n6, n8. Ví dụ nốt treo trong bảng là Fa ở hợp âm Đô (4 trên bè trầm Đô) xuống Mi: xem n12.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: Các ví dụ đều đúng loại.
  - id: n10
    cau: Trong khối nốt lướt, Rê và Fa không thuộc hợp âm Đô (Đô – Mi – Sol), chúng nối các nốt hợp âm theo một hướng đi lên.
    loai: cau-truc
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 1: giai điệu C5 D5 E5 F5 | G5 trên Đô – Sol ở bè trầm; Rê và Fa ở phách yếu giữa Đô – Mi và Mi – Sol, đi lên liền bậc. Review D3-gom: lượt 2 khong-chac vì câu tả khối nhạc. Đã đọc khối abc 1 (dòng 23–34): bè trên c2 d2 e2 f2 | g8 trên [C,G,]: Rê, Fa ngoài hợp âm Đô, nối Đô–Mi, Mi–Sol đi lên; khớp định nghĩa nốt lướt của OMT; giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Mô tả hình của trang (hướng đi lên); phần Rê, Fa không thuộc Đô-Mi-Sol thì đúng.
  - id: n11
    cau: Nốt treo 4–3 rất phổ biến.
    loai: quy-tac
    nguon:
      - sierra-susp
      - mymusictheory-susp
    ket_qua: da-bo
    ghi_chu: 'Sierra College: ví dụ 4–3 ("This is a 4-3 suspension") với nốt Sol giữ trên bè trầm Rê (quãng 4) rồi xuống Fa♯ (quãng 3). mymusictheory.com (bậc 3): 4–3 và 9–8 là "the two most-used suspensions" ở hợp âm vị trí gốc. OMT không đánh số kiểu 4–3 (chỉ nói tới nốt treo nói chung). Review D3-gom: lượt 2 khong-chac (nguồn mở được không nói "phổ biến"). Nguồn duy nhất xếp hạng là mymusictheory.com (bậc 3); không có nguồn bậc 1–2. Bỏ cụm "(rất phổ biến)" khỏi trang; ví dụ 4–3 vẫn giữ (Sierra College 13.06: "This is a 4-3 suspension").'
    luot_2: khong-chac
    luot_2_ghi_chu: Đúng theo thực hành nhưng nguồn mở được không nói "phổ biến".
  - id: n12
    cau: Nốt Fa của hợp âm G7 được giữ lại khi bè trầm đã chuyển sang Đô, tạo nghịch tai, rồi rơi xuống Mi (treo 4–3).
    loai: cau-truc
    nguon:
      - sierra-susp
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'Khối 2: G7 (Sol – Rê – Fa – Si) rồi Đô ở bè trầm trong khi Fa giữ lại (nối bằng dấu luyến qua vạch ô), xuống Mi: Fa cách bè trầm Đô một quãng 4, Mi một quãng 3. Sierra College: ví dụ y như vậy ("the alto voice holds G over a dominant seventh into a D major tonic chord ... steps down to F-sharp"): nốt giữ là một chord tone của hợp âm đầu, thành không thuộc hợp âm ở hợp âm sau. OMT: nốt treo "approached by a static note", không đòi hỏi chuẩn bị bằng quãng hòa.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: "Treo 4-3 chuẩn: Fa giữ qua hợp âm Đô rồi xuống Mi."
  - id: n13
    cau: 'Nốt dựa: giai điệu nhảy tới một nốt ngoài hợp âm ở phách mạnh, rồi bước về nốt hợp âm, giống một tiếng thở dài.'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: Như n6. "Giống một tiếng thở dài" là so sánh minh họa.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/", "https://www.britannica.com/art/appoggiatura" ]
  - id: n14
    cau: Câu "Đây là chữ ký của âm nhạc thời Cổ điển và Lãng mạn" (nói về nốt dựa).
    loai: lich-su
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Bỏ vì không kiểm được: OMT, Embellishing Tones không nhắc thời kỳ nào; Oxford Dictionary of Music, appoggiatura nói về cách diễn giải ở thế kỷ 18 (Handel, Mozart để ca sĩ tự thêm), không nhắc Lãng mạn. Review D3-gom: đã kiểm trang không còn "chữ ký của âm nhạc thời Cổ điển và Lãng mạn".'
    luot_2: khong-chac
    luot_2_ghi_chu: Britannica nêu appoggiatura phổ biến ở thế kỷ 17-18; câu "chữ ký của Cổ điển và Lãng mạn" là nhận xét chung, chưa có nguồn.
  - id: n15
    cau: Ở khối nốt dựa, Rê không thuộc hợp âm Đô trưởng; nó rơi vào phách 1 của ô thứ hai bằng một bước nhảy từ Sol, rồi bước xuống Đô ngay sau đó.
    loai: cau-truc
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'Khối 3: ô 1 Sol (nốt tròn) trên hợp âm Đô; ô 2 Rê (nốt trắng) ở phách 1 rồi Đô (nốt trắng); Sol lên Rê là nhảy quãng 5 đúng, Rê xuống Đô là bước liền. Review D3-gom: đã đọc khối abc 3 (dòng 52–64): bè trên G4 | d2 c2 trên [C,E,G,]: Rê ở phách 1 ô 2, đến từ Sol bằng bước nhảy quãng 5, rời xuống Đô bằng bước liền; khớp định nghĩa nốt dựa của OMT; giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Mô tả chi tiết hình (phách 1 ô hai, nhảy từ Sol) không kiểm được; phần Rê ngoài hợp âm Đô thì đúng.
  - id: n16
    cau: 'Nốt đón trước: một nốt của hợp âm sắp tới vang lên sớm, rồi giữ nguyên khi hợp âm mới đến.'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: OMT, xem n7.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n17
    cau: Ở khối nốt đón trước, nốt Đô xuất hiện từ giữa ô đầu khi hòa âm vẫn là Sol7 (lúc đó nó là âm ngoài hợp âm), rồi ngân dài thành nốt chủ âm khi hợp âm Đô trưởng đến.
    loai: cau-truc
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'Khối 4: bè trên Si (2 phách) rồi Đô (2 phách) | Đô (4 phách); bè dưới ô 1 là Sol7 (Sol – Rê – Fa – Si), ô 2 là Đô – Mi – Sol – Đô. Đô không thuộc Sol7 (Sol – Si – Rê – Fa). Review D3-gom: đã đọc khối abc 4 (dòng 70–82): bè trên B2 c2 | c4; bè dưới [G,,D,F,B,]4 | [C,,E,G,C]4: Đô vang từ phách 3 ô 1 trên Sol7 (Đô không thuộc Sol – Si – Rê – Fa), giữ sang ô 2 trên Đô trưởng; khớp định nghĩa nốt đón trước của OMT; giữ dung.'
    luot_2: khong-chac
    luot_2_ghi_chu: Mô tả vị trí trong hình của trang không kiểm được; phần nhạc lý (đón trước trên Sol7 rồi thành chủ âm) đúng.
  - id: n18
    cau: 'Bạn đã nghe âm nền ở Bach, Prelude cung Đô trưởng: nốt Sol giữ ở bè trầm qua nhiều ô nhịp gần cuối.'
    loai: cau-truc
    nguon:
      - mutopia-bwv846
    ket_qua: dung
    ghi_chu: 'Mutopia (wtk1-prelude1.ly, bản "Harpsichord, Piano", 35 ô; không có số ô trong nguồn, đếm mỗi dòng một ô): bè trầm là Sol (g,) ở các ô 24–31, rồi Đô (c,) ở các ô 32–35; ô 22 là Fa♯, ô 23 là La♭. Khớp trang cũ bach-prelude-do.md ("Âm nền át" ô 24–31, "Âm nền chủ" ô 32–35). Ấn bản của bản Mutopia ghi "Unknown", không đối chiếu được với bản in; số ô theo cách đếm trên.'
    luot_2: dung
    luot_2_nguon: [ "https://researchcatalogue.net/view/231816/357695" ]
    luot_2_ghi_chu: "Prelude Đô trưởng BWV 846: âm nền át Sol ở ô 24-31 (35 ô)."
  - id: n19
    cau: Có trang Bach, Prelude cung Đô trưởng (/opus/piano/tac-pham/bach-prelude-do/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: 'Chưa chuyển: ../opus-zero/docs/piano/tac-pham/bach-prelude-do.md, tiêu đề "Bach: Prelude cung Đô trưởng"; trang ấy có mục về âm nền át (ô 24–31, nốt Sol trầm giữ suốt tám ô) và âm nền chủ (ô 32–35). Lô chuyển giữ đường dẫn và hai mục ấy (câu "bạn đã nghe" dựa vào chúng). Trên site mới src/content/docs/piano/tac-pham chỉ có fur-elise.md. Review: trang đích chưa chuyển (src/content/docs/piano/tac-pham/ chỉ có fur-elise.md); ../opus-zero/docs/piano/tac-pham/bach-prelude-do.md có; bản xem hiện "sắp có".'
    review: dung
  - id: n20
    cau: 'Nốt treo và nốt dựa rơi vào phách mạnh: ở đó chúng nghe nghịch tai với hợp âm, rồi giải quyết bằng một bước liền.'
    loai: quy-tac
    nguon:
      - omt-embellishing
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghịch tai rồi giải quyết là động cơ cảm xúc của nhạc tonal. Nốt treo và nốt dựa tạo cảm giác ''đau rồi dịu'', đó là lý do các chương chậm của Mozart hay Bach chạm vào người nghe đến thế." Chữ mới: câu trên. Lý do: "động cơ cảm xúc" và quan hệ nhân quả với Mozart, Bach không kiểm được. OMT: nốt treo "always on a stronger part of the beat" và rời bằng bước xuống; nốt dựa thường ở phách mạnh hơn, rời bằng bước; nốt không thuộc hợp âm ("almost all cases"). Review D3-gom: chữ mới có ở mục "Vì sao quan trọng khi nghe nhạc?"; giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n21
    cau: Khi bạn nghe một hòa âm "nhói lên" rồi tan ra, rất có thể đó là một nốt treo hay nốt dựa.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên nghe, đã dè dặt ("rất có thể"). Chữ cũ: "một nốt treo"; thêm "hay nốt dựa" cho khớp n20. Không trái trang lõi nào.'
    luot_2: dung
    luot_2_ghi_chu: Khuyên nghe hợp lý.
  - id: n22
    cau: 'Bài tập 1, ví dụ đáp án: Sol – La – Si – Đô – Si (La là nốt lướt, Đô là nốt thêu) trên hợp âm Sol trưởng.'
    loai: cau-truc
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'Sol trưởng = Sol – Si – Rê; La nằm giữa Sol và Si đi lên (lướt); Si – Đô – Si: Đô là thêu trên, quay lại Si. Cả La và Đô đều không thuộc hợp âm.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: "Sol La Si: La lướt (bước lên cùng hướng); Si Đô Si: Đô thêu."
  - id: n23
    cau: 'Bài tập 2 (Mi – Fa – Mi trên hợp âm Đô): Fa là nốt thêu.'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: 'Như n4 (thêu trên: Mi lên Fa rồi quay lại Mi).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n24
    cau: 'Bài tập 3 (Đô – Rê – Mi trên hợp âm Đô): Rê là nốt lướt.'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: Như n3.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n25
    cau: 'Câu hỏi: nốt lướt được rời bằng bước liền, cùng hướng với lúc đến; giải thích "nó lướt giữa hai nốt hợp âm".'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: Theo n3.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n26
    cau: 'Câu hỏi: nốt treo được chuẩn bị bằng cách giữ nguyên từ hợp âm trước; giải thích "sau đó giải quyết bằng bước liền xuống".'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
    ket_qua: dung
    ghi_chu: Theo n5.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
  - id: n27
    cau: 'Câu hỏi: âm nền (pedal point) là một nốt giữ dài trong khi hợp âm thay đổi; giải thích "thường ở bè trầm: âm nền át, âm nền chủ".'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
      - mutopia-bwv846
    ket_qua: dung
    ghi_chu: Theo n8; âm nền át (Sol trong Đô trưởng) và âm nền chủ (Đô) có ở Bach (n18).
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: 'OMT: "pedal tone"; âm nền át/chủ là thuật ngữ thông dụng.'
  - id: n28
    cau: 'Câu hỏi: nốt nhảy tới ở phách mạnh rồi bước về nốt hợp âm là nốt dựa; giải thích "appoggiatura, từ tiếng Ý ''dựa vào''".'
    loai: dinh-nghia
    nguon:
      - omt-embellishing
      - oxford-appoggiatura
    ket_qua: dung
    ghi_chu: 'Theo n6. Oxford: appoggiatura = "Leaning note", đúng nghĩa "dựa vào" (appoggiare, tiếng Ý, dựa/tựa).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/appoggiatura", "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/" ]
    luot_2_ghi_chu: 'Britannica: appoggiare, "to lean".'
  - id: n29
    cau: "Hình ::hinh{ten=\"am-ngoai\"} ngay dưới bảng \"Các loại chính\" vẽ sáu thẻ theo đúng sáu dòng bảng (nốt lướt, nốt thêu, nốt treo, nốt dựa, nốt đón trước, âm nền), chấm đặc là nốt hợp âm, chấm rỗng là âm ngoài hợp âm, mũi tên ngắn là bước liền, mũi tên dài là nhảy, cung nối là giữ nguyên, vạch đứt là đổi hợp âm, thanh dài là âm nền; chữ dưới mỗi thẻ chép cột \"Đến bằng\" và \"Rời bằng\"; tên nốt theo cột ví dụ (Đô–Rê–Mi, Mi–Fa–Mi, Fa giữ rồi xuống Mi, Đô đón trước rồi giữ, Sol ở bè trầm) và khuông \"Nốt dựa\" (Sol nhảy lên Rê ở phách mạnh, bước xuống Đô)."
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Kiểm trên bản xem (npm run build:xem, 06/11/2026) và file src/components/hinh/am-ngoai.html. Từng thẻ: nốt lướt Đô (đặc) bước lên Rê (rỗng) bước tiếp lên Mi (đặc), cùng hướng; nốt thêu Mi lên Fa (rỗng) quay lại Mi; nốt treo Fa (đặc, hợp âm trước), vạch đứt đổi hợp âm, cung nối sang Fa (rỗng), mũi tên ngắn xuống Mi; nốt dựa Sol nhảy lên Rê (rỗng, dòng chữ \"phách mạnh\"), bước xuống Đô, khớp khuông X:3 (G4 | d2 c2); nốt đón trước: \"?\" và mũi tên nét đứt (cột Đến bằng: không có quy định), Đô (rỗng) trước vạch đổi hợp âm, cung nối sang Đô (đặc), khớp khuông X:4 (c2 | c4); âm nền: thanh dài Sol ở dưới, ba hợp âm bên trên có vạch đổi giữa (cột ví dụ: Sol giữ ở bè trầm qua nhiều hợp âm). Chữ dưới thẻ đúng chữ hai cột bảng (tests/hinh-ve-lai-bang.test.mjs so tự động). Hình không thêm loại, quy tắc hay ví dụ nào ngoài bảng và khuông. Không thêm câu dẫn trong trang (chú thích hình có data-sinh). Soát hình 2C (gộp review và kiểm mẫu): người soát không phải người vẽ; đọc src/components/hinh/am-ngoai.html và SVG trong dist/nhac-ly/18-am-ngoai-hop-am/index.html (bản xem, 07/11/2026), ảnh chụp 360 và 1280 px. Lưới bậc cách đều 9 đơn vị: nốt lướt Đô–Rê–Mi lên từng bậc (hai mũi tên ngắn, cùng hướng); nốt thêu Mi–Fa–Mi lên một bậc rồi quay lại; nốt treo Fa đặc, vạch đổi hợp âm, cung nối sang Fa rỗng, mũi tên ngắn xuống một bậc tới Mi; nốt dựa Sol nhảy lên bốn bậc tới Rê rỗng (mũi tên dài, chữ \"phách mạnh\"), bước xuống một bậc tới Đô, đúng khuông X:3 (G4 | d2 c2); nốt đón trước \"?\" (không có quy định), Đô rỗng trước vạch đổi hợp âm, cung nối sang Đô đặc, đúng câu và khuông X:4; âm nền thanh dài Sol dưới cùng, ba cặp chấm khác nhau bên trên, hai vạch đổi hợp âm, không đánh dấu âm nền là nốt hợp âm hay ngoài hợp âm (bảng không nói). Chữ dưới thẻ chép đúng hai cột bảng; aria-label từng thẻ kể đúng đường nét. Hình không nói điều trang không viết."
    review: dung
