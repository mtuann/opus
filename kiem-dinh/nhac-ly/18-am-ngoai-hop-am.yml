      luot_1: "Claude Opus 5.5 (mo/hinh-dot-2c, 06/11/2026: thêm hình tĩnh am-ngoai; đối chiếu chữ trong hình với bảng và khuông của trang; thủ tục hình rút gọn, chuan-kiem-dinh mục 7)"
      luot_2: "không cần (câu ve-site, thủ tục hình)"
      review: "Claude Opus 5.5 (soát hình 2C, review và kiểm mẫu gộp, thủ tục hình, 07/11/2026)"
      kiem_mau: "Claude Opus 5.5 (soát hình 2C, review và kiểm mẫu gộp, thủ tục hình, 07/11/2026)"
ghi_chu: 'Trang âm ngoài hợp âm (tầng lõi), bốn khối abc, không có hình. Nguồn chính: OMT, Embellishing Tones (định nghĩa passing, neighbor, appoggiatura, suspension, anticipation, pedal tone); Sierra College, Equipping the Musical Ear 13.06 (ví dụ 4–3 y như khối 2); Oxford Dictionary of Music, appoggiatura; Mutopia BWV 846 (âm nền át ô 24–31, âm nền chủ ô 32–35). WebFetch ngày 28/10/2026 (bản tóm tắt chữ). Chỗ sửa trang: (1) cột "Đến bằng" của nốt đón trước thành "Không có quy định" (OMT: N/A); (2) bỏ câu nốt dựa là "chữ ký" Cổ điển và Lãng mạn; (3) đoạn "Vì sao quan trọng khi nghe nhạc?": bỏ "động cơ cảm xúc" và quan hệ với Mozart, Bach, viết lại theo OMT; (4) mục Nguồn. Chưa chắc: không có (n1, n21 là khuyen-tap, review soát nhãn). Nguồn gốc của đa số nhận định là OMT nên đã khớp "thứ bậc nguồn". Trang đích chưa chuyển: /opus/piano/tac-pham/bach-prelude-do/ (n19: giữ mục "Âm nền át" ô 24–31 và "Âm nền chủ" ô 32–35), /opus/tai-lieu-tham-khao/. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): non-chord tone / embellishing tone (âm ngoài hợp âm; OMT gọi chính là embellishing tones), passing tone (nốt lướt), neighbor tone (nốt thêu), suspension (nốt treo), anticipation (nốt đón trước), pedal point / pedal tone (âm nền), retardation (nếu dùng); đã có: appoggiatura, nhưng nghĩa trong thuat-ngu.yml ("Nốt dựa, đúng phách, lấy bớt độ dài của nốt chính"; nhom Piano; ghi chú "Nốt nhỏ không gạch") là nghĩa ký hiệu trang trí, còn bài 18 dùng nghĩa hòa âm (nốt ngoài hợp âm, đến bằng nhảy, rời bằng bước): Từ điển cần ghi cả hai nghĩa.'
