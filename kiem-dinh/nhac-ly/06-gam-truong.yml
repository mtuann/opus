  - id: n30
    cau: 'Câu hỏi 1: "Công thức gam trưởng là gì?" Đáp án đúng: Cung – Cung – Nửa – Cung – Cung – Cung – Nửa. Sai: Cung – Nửa – Cung – Cung – Nửa – Cung – Cung; Nửa – Cung – Cung – Cung – Nửa – Cung – Cung. Giải thích: Cung – Nửa – Cung – Cung – Nửa – Cung – Cung là công thức của gam thứ tự nhiên.'
    loai: dinh-nghia
    nguon:
      - omt-major
      - omt-minor
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ của lời giải thích: "Công thức thứ hai là của gam thứ tự nhiên." Chữ mới: "Cung – Nửa – Cung – Cung – Nửa – Cung – Cung là công thức của gam thứ tự nhiên." Lý do: site mới trộn thứ tự lựa chọn mỗi lần, nên "công thức thứ hai" có thể chỉ vào lựa chọn khác (lượt 2 cũng lưu ý); câu mới gọi thẳng công thức. Đã rà mọi khối quiz của bài 1–8: không còn lời giải thích nào dựa vào vị trí lựa chọn. Kiểm: đáp án đúng = W‑W‑H‑W‑W‑W‑H (OMT Major Scales). W‑H‑W‑W‑H‑W‑W là gam thứ tự nhiên (OMT Minor Scales: "Natural minor: W‑H‑W‑W‑H‑W‑W"), nên lời giải thích đúng. Lựa chọn H‑W‑W‑W‑H‑W‑W khác công thức gam trưởng ngay ở bước đầu (nửa cung thay vì cung), nên sai. (review D3-L1 yêu cầu) Review: lời giải thích cũ dựa vào vị trí lựa chọn ("công thức thứ hai") mà câu hỏi trộn thứ tự mỗi lần; đổi thành chính công thức. Nội dung đã qua lượt 2 (thứ tự nhiên: Cung – Nửa – Cung – Cung – Nửa – Cung – Cung).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-diatonic-modes-and-the-chromatic-scale/ ]
    luot_2_ghi_chu: "Đáp án khớp OMT, Major Scales (W‑W‑H‑W‑W‑W‑H). Phương án 2 là W‑H‑W‑W‑H‑W‑W = thứ tự nhiên (Minor Scales); phương án 3 (H‑W‑W‑W‑H‑W‑W) là mode Phrygian (Intro to Diatonic Modes). Lưu ý: 'công thức thứ hai' chỉ đúng theo thứ tự trong dữ liệu, mà quiz trộn thứ tự lựa chọn mỗi lần."
  - id: n31
    cau: 'Câu hỏi 2: "Gam Sol trưởng có dấu hóa nào?" Đáp án đúng: Fa♯. Sai: Si♭, Đô♯. Giải thích: từ Mi phải lên một cung đến Fa♯.'
    loai: dinh-nghia
    nguon:
