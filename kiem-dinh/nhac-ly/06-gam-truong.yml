  - id: n32
    cau: 'Câu hỏi 3: "Bậc V của gam trưởng gọi là gì?" Đáp án đúng: át âm. Sai: chủ âm, cảm âm. Giải thích: bậc I là chủ âm, bậc VII là cảm âm.'
    loai: dinh-nghia
