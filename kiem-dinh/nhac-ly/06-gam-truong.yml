doi_chu:
  - cu: "Ngón bấm gam Đô trưởng một quãng tám: tay phải 1-2-3-1-2-3-4-5, tay trái 5-4-3-2-1-3-2-1; ngón cái luồn dưới để nối liền. Bảng ngón bấm cho cả 12 gam và cách tập: Gam và ngón bấm."
    moi: "Ngón bấm gam Đô trưởng một quãng tám: tay phải 1-2-3-1-2-3-4-5, tay trái 5-4-3-2-1-3-2-1. Đi lên, tay phải luồn ngón cái dưới ngón 3 (Mi sang Fa), tay trái vắt ngón 3 qua ngón cái (Sol sang La); đi xuống thì ngược lại. Bảng ngón bấm cho cả 12 gam và cách tập: Gam và ngón bấm."
    ly_do: "n23 (da-sua, review D3-L1 yêu cầu): luồn ngón cái chỉ đúng với tay phải đi lên, tay trái đi xuống; tay trái đi lên thì ngón 3 vắt qua ngón cái (Hanon, The Virtuoso Pianist, số 39: tay trái Sol ngón 1 rồi La ngón 3)."
