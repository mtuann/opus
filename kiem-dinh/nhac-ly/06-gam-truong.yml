    luot_2_ghi_chu: "Đáp án khớp OMT, Major Scales: 5̂ là dominant (át âm); 1̂ là tonic, 7̂ là leading tone."
  - id: n33
    cau: 'Câu hỏi 4: "Vì sao gam Fa trưởng dùng Si♭ mà không dùng La♯?" Đáp án đúng: mỗi tên nốt chỉ xuất hiện một lần trong gam. Sai: vì La♯ không tồn tại; vì Si♭ dễ đọc hơn. Giải thích: dùng La♯ thì gam có hai nốt La và thiếu nốt Si.'
    loai: quy-tac
    nguon:
      - mt21c-major-scale
      - fff-major-scales
      - omt-steps
    ket_qua: dung
    ghi_chu: 'Đáp án đúng theo n28. "La♯ không tồn tại" sai: La♯ là một nốt thật, cùng phím với Si♭ (OMT Half Steps: phím đen giữa A và B có hai tên). "Si♭ dễ đọc hơn" không phải lý do của quy tắc (lý do là mỗi chữ cái một lần), nên sai. Giải thích đúng.'
    luot_2: dung
    luot_2_nguon: [ https://musictheory.pugetsound.edu/mt21c/TheMajorScale.html, https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "Đáp án khớp mt21c 2.2 (mỗi tên nốt chỉ một lần): A♯ trong F major sẽ lặp tên La và thiếu Si. A♯ vẫn tồn tại (cùng phím với B♭, OMT Half Steps…), nên phương án 'La♯ không tồn tại' đúng là sai."
