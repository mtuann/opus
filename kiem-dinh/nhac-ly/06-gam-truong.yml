    link: https://openbooks.library.baylor.edu/pianobasics/chapter/c-major-scale-hands-together/
nhan_dinh:
  - id: n1
    cau: Gam (scale) là một chuỗi nốt đi lên hoặc đi xuống theo một công thức khoảng cách cố định.
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-scales
    ket_qua: dung
    ghi_chu: 'OMT Major Scales, bảng thuật ngữ: scale = "An ordered collection of half steps and whole steps"; công thức cố định của gam trưởng ở n4. FFF 6.1: "The major scale ... consists of an ordered collection of seven pitch classes"; "The major scale (and other scales) can therefore continue indefinitely in both directions" (đi lên hay đi xuống).'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scale ]
    luot_2_ghi_chu: "OMT, Major Scales: 'A scale is an ordered collection of half and whole steps.' Concise Oxford Dictionary of Music, mục scale: 'A series of single notes progressing up or down stepwise.'"
  - id: n2
    cau: Gam là "nguyên liệu" để xây giai điệu và hợp âm của một bản nhạc.
    loai: dinh-nghia
    nguon:
      - fff-major-scales
      - fff-major-keys
      - fff-minor-variants
    ket_qua: dung
    ghi_chu: '"Nguyên liệu" là cách nói ví von cho chất liệu cao độ. FFF 6.1: "The major scale is a cornerstone of pitch organization and structure in tonal music." FFF 8.3: "a piece in a major key will draw from the same pitches as its corresponding major scale". Hợp âm cũng xây trên bậc của gam: FFF 16.3, "the triads built with the leading-tone adjusted harmonic minor scale" (hợp âm dựng trên các bậc 5̂, 7̂).'
    luot_2: dung
    luot_2_nguon: [ https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scale, https://viva.pressbooks.pub/openmusictheory/chapter/triads/ ]
    luot_2_ghi_chu: "Concise Oxford Dictionary of Music, mục scale: dãy nốt 'used as the basis of comp.'; gam trưởng, thứ 'have provided the chief material of music from about AD 1600 to 1900'. OMT, Triads: mọi nốt của gam trưởng có thể làm gốc một hợp âm. 'Nguyên liệu' là cách nói ẩn dụ, nội dung đúng."
  - id: n3
    cau: Gam trưởng có 7 nốt khác tên, cộng nốt thứ 8 lặp lại nốt đầu.
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-scales
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: bậc 1̂ đến 7̂, nốt cuối "is also 1̂ (although some instructors prefer 8̂)", "it is a repetition of the first note". FFF 6.2: dùng "each of the seven note letter names (A, B, C, D, E, F, and G) until we return to the keynote".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT, Major Scales: bảy tên nốt; nốt cuối 'is a repetition of the first note'; gam 'always starts and ends on notes of the same letter name, one octave apart'."
  - id: n4
    cau: "Công thức gam trưởng: Cung – Cung – Nửa cung – Cung – Cung – Cung – Nửa cung."
    loai: dinh-nghia
    nguon:
      - omt-major
      - mt21c-major-scale
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "A major scale is an ordered collection of half (H) and whole (W) steps with the ascending succession W‑W‑H‑W‑W‑W‑H." MT21C 2.2: W–W–H, một cung nối, W–W–H.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT, Major Scales: W‑W‑H‑W‑W‑W‑H (đi lên)."
  - id: n5
    cau: Gam Đô trưởng dùng toàn phím trắng, vì hai nửa cung tự nhiên Mi–Fa và Si–Đô rơi đúng vào vị trí 3–4 và 7–8.
    loai: dinh-nghia
    nguon:
      - omt-major
      - omt-steps
    ket_qua: dung
    ghi_chu: 'C D E F G A B C: E–F là bậc 3 đến 4, B–C là bậc 7 đến 8; hai cặp này là nửa cung vì không có phím đen xen giữa (OMT Half Steps). OMT Major Scales: C major "has nothing in its key signature (no sharps or flats)".'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "OMT: E–F và B–C là nửa cung (Half Steps…); C D E F G A B C có nửa cung ở vị trí 3–4 và 7–8 nên không cần dấu hóa (hóa biểu C major trống, Major Scales)."
  - id: n6
    cau: "Khoảng cách các cặp nốt liền nhau của gam Đô trưởng: Đô–Rê cung, Rê–Mi cung, Mi–Fa nửa cung, Fa–Sol cung, Sol–La cung, La–Si cung, Si–Đô nửa cung."
    loai: dinh-nghia
    nguon:
      - omt-steps
      - omt-major
    ket_qua: dung
    ghi_chu: 'Đô–Rê, Rê–Mi, Fa–Sol, Sol–La, La–Si có phím đen xen giữa nên là một cung; Mi–Fa và Si–Đô không có (OMT Half Steps: "Pairs of white keys with a black key in between them (A and B, C and D, D and E, F and G, and G and A) are a whole step apart"). Thành W‑W‑H‑W‑W‑W‑H, khớp n4.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ ]
    luot_2_ghi_chu: "Tính theo công thức OMT và E–F, B–C là nửa cung: C–D W, D–E W, E–F H, F–G W, G–A W, A–B W, B–C H."
  - id: n7
    cau: "Áp dụng cùng công thức từ nốt Sol: Sol – La – Si – Đô – Rê – Mi – ?; từ Mi phải đi lên một cung, nhưng Mi–Fa chỉ là nửa cung, nên cần Fa♯; sau đó Fa♯–Sol là nửa cung, khớp với công thức."
    loai: quy-tac
    nguon:
      - omt-major
      - omt-steps
    ket_qua: dung
    ghi_chu: 'G A B C D E F♯ G: G–A cung, A–B cung, B–C nửa cung, C–D cung, D–E cung, E–F♯ cung, F♯–G nửa cung = W‑W‑H‑W‑W‑W‑H (OMT Major Scales: "the pattern of half and whole steps is the same in every major scale"). E–F là nửa cung tự nhiên (OMT Half Steps), nên bậc 7 phải là F♯.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "Tính theo W‑W‑H‑W‑W‑W‑H (OMT) từ G: G A B C D E F♯ G (E–F♯ một cung, F♯–G nửa cung); khớp quy tắc 'dấu thăng cuối thấp hơn chủ âm nửa cung' (Major Scales)."
  - id: n8
    cau: "Gam Sol trưởng có một dấu thăng: Fa♯."
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales, ví dụ 12: "The last sharp (in this case the only sharp), F♯, is a half step below the note G. Therefore, this is the key signature of G major." FFF 8.4: "G major is built on scale degree 5̂ of C major and has one sharp (F#)."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT, Major Scales, Example 10: hóa biểu một dấu thăng (F♯) là của G major."
  - id: n9
    cau: "Gam Sol trưởng trên bàn phím (phím được tô): bàn phím từ Sol3 đến Sol4 tô 8 phím."
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm với chỉ thị ::cong-cu{ten="piano" range="G3-G4" notes="G3 A3 B3 C4 D4 E4 F#4 G4"} và thành phần mới (src/scripts/ve.js veBanPhim; đã chạy): 13 phím (8 trắng, 5 đen), tô Sol3, La3, Si3, Đô4, Rê4, Mi4, Fa♯4/Sol♭4, Sol4; nút "Nghe các nốt được tô" (có notes). Bản cũ (piano.js mountSimple) có cùng thông số. Review: đã bấm thử trên bản xem: ::cong-cu{ten="piano" range="G3-G4" notes="G3 A3 B3 C4 D4 E4 F#4 G4"} vẽ 13 phím (8 trắng, 5 đen) từ Sol (G3) đến Sol (G4); đúng 8 phím được tô: Sol3, La3, Si3, Đô4, Rê4, Mi4, Fa♯4/Sol♭4 (phím đen), Sol4; phím Fa trắng không tô. Bấm từng phím: hiện tên và có tiếng; có nút "Nghe các nốt được tô". Đã chụp ảnh sáng và tối.'
    review: dung
  - id: n10
    cau: Tám phím được tô (G3 A3 B3 C4 D4 E4 F♯4 G4) là các nốt của gam Sol trưởng.
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: "Sol – La – Si – Đô – Rê – Mi – Fa♯ – Sol, theo n7 và n8; khớp khối abc 2 (abcjs: G3 A3 B3 C4 D4 E4 F♯4 G4)."
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/aspn/, https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT, ASPN: mỗi quãng tám bắt đầu ở C (Đô giữa = C4), nên G3 A3 B3 | C4 D4 E4 F♯4 G4; G major = G A B C D E F♯ G."
  - id: n11
    cau: Thay vì viết dấu thăng trước mọi nốt Fa, người ta viết nó một lần ở đầu khuông, ngay sau khóa. Đó là hóa biểu.
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "A key signature ... appears at the beginning of a composition, after a clef but before a time signature"; "Key signatures collect the accidentals in a scale and place them at the beginning of a composition so that it is easier to keep track of which notes have accidentals applied to them." FFF 8.1: bản viết không hóa biểu "much more cluttered". Tên "hóa biểu" = key signature theo src/data/thuat-ngu.yml.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature ]
    luot_2_ghi_chu: "OMT, Major Scales: hóa biểu 'collect the accidentals in a scale and place them at the beginning of a composition', 'after a clef but before a time signature'. Concise Oxford Dictionary of Music, mục key-signature: viết 'at the beginning of each staff', đỡ phải viết dấu hóa ở từng nốt."
  - id: n12
    cau: "Gam Fa trưởng có một dấu giáng: Si♭."
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-keys
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "F major, which has one flat: B♭" (một trong hai hóa biểu phải nhớ). FFF 8.4: "F major, for example, begins on scale degree 4̂ of C major and has one flat (Bb)."'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ ]
    luot_2_ghi_chu: "OMT, Major Scales, Example 12: F major có một dấu giáng, B♭."
  - id: n13
    cau: Toàn bộ 15 giọng và cách đọc hóa biểu nằm ở bài 8.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bài 8 (nhac-ly/08-hoa-bieu, cùng lô, đã chuyển) có mục "Bảng 15 giọng" (15 hàng) và mục "Đọc hóa biểu ra tên giọng". Review: đã mở bài 8 ở bản xem: link "bài 8" của bài 6 (06-gam-truong.md dòng 54) là link sống, mở trang "8. Hóa biểu và vòng quãng năm"; trang có mục "Bảng 15 giọng" (bảng 15 hàng, đã đếm), mục "Đọc hóa biểu ra tên giọng" và hình "Mười lăm hóa biểu" (15 ô).'
    review: dung
  - id: n14
    cau: 'Mỗi nốt trong gam là một bậc, đánh số từ 1 đến 7; nhiều sách viết bằng số La Mã, I đến VII.'
    loai: dinh-nghia
    nguon:
      - omt-major
      - teoria-scale
      - novas
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mỗi nốt trong gam là một bậc, đánh số La Mã từ I đến VII." Chữ mới: "Mỗi nốt trong gam là một bậc, đánh số từ 1 đến 7 (nhiều sách viết bằng số La Mã, I đến VII, như bảng dưới)." Lý do (lượt 2: khong-chac): nguồn chính đánh số bậc bằng số Ả Rập, bài 7 và 8 cũng viết "bậc 3", "bậc 6", "bậc 7"; số La Mã vẫn hay gặp và bảng của trang giữ I, V, VII, nên câu nói cả hai cách. OMT Major Scales: "Scale degrees are solmization syllables notated by Arabic numerals with carets above them."; bảng thuật ngữ: scale degree = "The relative position of a note within a diatonic scale. Indicated with a number, 1–7"; OMT dành số La Mã cho hợp âm. teoría, Reference: scale: "Each of these notes is called a degree. Each degree has its own name, but is often referred to by a Roman numeral"; Reference: major scale: "except for the degrees III-IV and the degrees VII-I, which are separated by 1 half step". Cách viết ở Việt Nam (chỉ để chứng thực cách gọi): Giáo trình Lý thuyết âm nhạc cơ bản (novaspro.vn), bảng thuật ngữ (tr. 50–51 của tệp PDF): "Degree: bậc (trong thang âm)", "Mediant: âm bậc III của điệu thức". src/data/thuat-ngu.yml cũng ghi "Bậc I", "Bậc V", "Bậc IV", "Bậc VII". Thống nhất một cách viết cho cả site: ghi cho D3-L5. (review D3-L1 yêu cầu) Review: viết lại: đánh số 1–7 (OMT), nhiều sách viết số La Mã (teoria.com, giáo trình Trịnh Văn Căn), khớp bài 7 và 8 viết "bậc 3, 6, 7". Lượt 2 bổ sung (sau review) kiểm chữ mới, đúng.'
    luot_2: dung
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/, https://viva.pressbooks.pub/openmusictheory/chapter/roman-numerals/, https://www.teoria.com/en/reference/d/degrees.php, https://www.tonggiaophanhanoi.org/nhac-ly-can-ban-cua-duc-hong-y-giuse-maria-trinh-van-can/, https://books.ed.ac.uk/edinburgh-diamond/catalog/view/ed-9781912669226/5/89 ]
    luot_2_ghi_chu: "Phần 'từ 1 đến 7': OMT, chương Major Scales, Scale Degrees, and Key Signatures, viết bậc bằng số Ả Rập có dấu mũ, ^1 đến ^7 (một số giáo viên dùng ^8 cho nốt cuối). Phần 'số La Mã': teoria.com, mục Reference: names of degrees, viết 'referring to the degrees of the major and minor scales by Roman numerals' (I đến VII); giáo trình tiếng Việt Nhạc lý căn bản của Đức Hồng Y Giuse Maria Trịnh Văn Căn (đăng ở tonggiaophanhanoi.org; trang gốc trả 403, đọc bản lưu Wayback 20251030133525) gọi các nốt của gam là bậc I, II, ... VII, VIII ('Bậc I bao giờ cũng được gọi là chủ âm hoặc nốt chủ'; 'Những âm bậc I – III – V là những âm ổn định'). Lưu ý: OMT (chương Roman Numerals, bảng bậc 1-7 với I-VII) và giáo trình mở của Univ. of Edinburgh dành số La Mã cho hợp âm xây trên bậc, không cho từng nốt; nên 'nhiều sách' đúng nhưng đó không phải quy ước của OMT. Không mâu thuẫn với câu. OMT trả 403 cho công cụ nên đọc bản lưu Wayback: https://web.archive.org/web/20260120053244/https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ và https://web.archive.org/web/20260109133744/https://viva.pressbooks.pub/openmusictheory/chapter/roman-numerals/"
  - id: n15
    cau: Chủ âm (I), át âm (V) và cảm âm (VII) là ba bậc quan trọng nhất của gam trưởng.
    loai: dinh-nghia
    nguon:
      - omt-major
      - fff-major-keys
      - fff-minor-variants
      - omt-harmony
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: câu dẫn cũ "Ba bậc quan trọng nhất:" đổi thành "Ba bậc cần nhớ trước:" (n16). Lý do: xếp hạng "quan trọng nhất" cho ba bậc này không kiểm được. Nguồn nói từng bậc đều quan trọng nhưng không xếp chúng trên các bậc khác: FFF 8.2 (chủ âm "a position of primary importance"), OMT Major Scales ("dominant ... refers to the importance of the fifth above the tonic"), FFF 16.2 ("the leading tone is one of the most important pitches of the major scale"); bậc IV (hạ át âm) cũng là bậc chính (OMT Intro to Harmony: IV thuộc "strong predominants"). Review: lượt 1 đã bỏ câu ("Ba bậc cần nhớ trước:" thay cho "Ba bậc quan trọng nhất:"); lượt 2 cũng không tìm được nguồn cho thứ hạng. Đã xem trang: không còn câu cũ.'
    luot_2: khong-chac
    luot_2_nguon: [ https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/, https://www.musictheory.education/music-theory-level-2/ch-2-14-degrees-i-iv-and-v-tonic-subdominant-and-dominant ]
    luot_2_ghi_chu: "Không nguồn nào xếp I–V–VII là 'ba bậc quan trọng nhất'. OMT (Introduction to Harmony) chia chức năng tonic (I), predominant (IV, ii), dominant (V, vii°) mà không xếp hạng. musictheory.education (Level 2, mục 2.14; đọc qua công cụ tóm tắt trang, trang chặn curl): 'The primary degrees are the first, fourth and fifth degree', còn VII là bậc phụ. Cảm âm quan trọng về sức kéo nhưng 'quan trọng nhất' là xếp hạng chủ quan. Gợi ý: 'ba bậc cần nhớ trước' (như câu khuyên cuối trang), hoặc nêu thêm hạ át âm (IV)."
