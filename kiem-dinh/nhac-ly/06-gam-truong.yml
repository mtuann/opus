  - id: n22
    cau: 'Ngón bấm gam Đô trưởng một quãng tám: tay phải 1-2-3-1-2-3-4-5, tay trái 5-4-3-2-1-3-2-1.'
    loai: quy-tac
    nguon:
      - hanon
      - baylor-c-ht
    ket_qua: dung
    ghi_chu: 'Đổi loại từ khuyen-tap sang quy-tac theo review D3-L1: ngón bấm là sự kiện, cần nguồn. Chữ trang không đổi. Hanon, The Virtuoso Pianist, số 39 (tr. 50; đọc từ ảnh bản scan): gam Đô trưởng, tay phải 1 2 3 1 2 3 4 rồi 1 để đi tiếp quãng tám sau, nốt Đô cao nhất (chỗ quay đầu) ngón 5; tay trái từ Đô thấp nhất 5 4 3 2 1 3 2 1. Một quãng tám thì tay phải 1-2-3-1-2-3-4-5, tay trái 5-4-3-2-1-3-2-1, như trang. Baylor Piano Basics 114, câu đọc cho hai tay khi chơi gam Đô trưởng: "Ascending: 1s, 4 left, 3s, exchange 1s and 2s, 3s, 4 right, 1s"; "C is played by finger 1 in each hand unless it is the lowest note in the left hand or the highest note in the right hand": khớp với ngón trên. Bản cũ ../opus-zero/docs/piano/gam.md, hàng Đô: cùng ngón. (review D3-L1 yêu cầu) Review: soát nhãn đổi khuyen-tap thành quy-tac (ngón bấm là sự kiện kiểm được); lượt 2 bổ sung kiểm với nguồn (Hanon số 39 và các bảng ngón bấm), đúng.'
    luot_2: dung
    luot_2_nguon: [ https://archive.org/details/Virtuoso_Pianist_Hanon, https://en.wikiversity.org/wiki/Piano/How_to_read_piano_music_and_play_scales_using_proper_technique, https://web.archive.org/web/20160102012523/https://www.uncp.edu/academics/colleges-schools-departments/departments/music/areas-study/keyboard/scale-fingerings, https://openbooks.library.baylor.edu/pianobasics/chapter/two-octave-major-scales/ ]
    luot_2_ghi_chu: "Đã xem trang scan Hanon, The Virtuoso Pianist, số 39 (archive.org, mục Virtuoso_Pianist_Hanon, trang 49 của file PDF): ô nhịp đầu của Đô trưởng ghi tay phải 1-2-3-1-2-3-4-1 và tay trái 5-4-3-2-1-3-(2)-1; nốt Si ở tay trái không in số (ngón 2 suy ra), ngón 1 ở Đô cao nhất vì gam của Hanon chạy tiếp lên quãng tám sau. Wikiversity ghi thẳng cho một quãng tám C D E F G A B C: tay phải 1 2 3 1 2 3 4 5, tay trái 5 4 3 2 1 3 2 1. Trang Scale Fingerings của khoa nhạc Univ. of North Carolina at Pembroke (trang gốc nay 404, đọc bản lưu Wayback 20160102012523): nhóm C, G, D, A, E, F tay phải 1,2,3,1,2,3,4, tay trái 1,4,3,2,1,3,2, '5th finger may be used on lowest LH note and highest RH note' (suy ra 5-4-3-2-1-3-2-1 và 1-2-3-1-2-3-4-5). Giáo trình mở Baylor Piano Basics (trang gốc trả 403, đọc bản lưu Wayback 20260510042837): công thức hai quãng tám LH 5+4321+321+4321+321, RH 123+1234+123+1234+5 và 'Use finger 5 only for the highest note of the scale in the right hand and the lowest note ... for the left hand'; cắt còn một quãng tám ra đúng dãy trong câu (suy ra)."
  - id: n23
    cau: 'Đi lên, tay phải luồn ngón cái dưới ngón 3 (Mi sang Fa), tay trái vắt ngón 3 qua ngón cái (Sol sang La); đi xuống thì ngược lại.'
    loai: quy-tac
    nguon:
      - hanon
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…; ngón cái luồn dưới để nối liền." Chữ mới: "Đi lên, tay phải luồn ngón cái dưới ngón 3 (Mi sang Fa), tay trái vắt ngón 3 qua ngón cái (Sol sang La); đi xuống thì ngược lại." Lý do: câu cũ đứng ngay sau ngón bấm đi lên của cả hai tay, nhưng luồn ngón cái chỉ đúng với tay phải đi lên, tay trái đi xuống; tay trái đi lên thì ngón 3 vắt qua ngón cái. Đổi loại từ khuyen-tap sang quy-tac (cách chuyển ngón là sự kiện). Hanon, The Virtuoso Pianist, số 39 (tr. 50): tay phải đi lên, Mi ngón 3 rồi Fa ngón 1, tức ngón cái sang phím bên phải ngón 3 (luồn dưới bàn tay); tay trái đi lên, Sol ngón 1 rồi La ngón 3, tức ngón 3 sang phím bên phải ngón cái (vắt qua ngón cái). Đi xuống thì cùng ngón theo thứ tự ngược lại: tay phải vắt ngón 3 qua ngón cái (Fa sang Mi), tay trái luồn ngón cái (La sang Sol). Hanon số 32–36 (tr. 43–47), các bài chuẩn bị cho gam: "Turning the thumb under the 2nd finger", "… the 3rd finger", "… the 4th finger", "… the 5th finger", "Another example of turning the thumb under". Bản cũ ../opus-zero/docs/piano/gam.md, mục "Luồn ngón cái và vắt ngón" (dòng 15–21): cùng cách chia hai tay, hai chiều. (review D3-L1 yêu cầu) Review: chữ cũ ("Ngón cái luồn dưới để nối liền") sai với tay trái đi lên; viết lại cho cả hai tay, đổi sang quy-tac. Lượt 2 bổ sung kiểm, đúng (chiều đi xuống suy ra từ số ngón của Hanon số 39).'
    luot_2: dung
    luot_2_nguon: [ https://en.wikiversity.org/wiki/Piano/How_to_read_piano_music_and_play_scales_using_proper_technique, https://www.cs.miami.edu/home/burt/music/finger-charts.html, https://archive.org/details/Virtuoso_Pianist_Hanon, https://www.piano-keyboard-guide.com/?p=183 ]
    luot_2_ghi_chu: "Chiều đi lên, nguồn nói thẳng: Wikiversity ('the thumb goes under the middle finger as the scale progresses from E to F' ở tay phải; 'the middle finger is tucked over the thumb as the scale progresses from G to A' ở tay trái) và bảng ngón bấm của Univ. of Miami (trang cs.miami.edu/home/burt, chủ trang ghi lại bảng do Prof. Escadon đưa khi học ở Miami, khoảng 1999): ở Đô trưởng ngón 3 tay trái vắt qua ngón cái để bấm La, ngón cái tay phải luồn dưới ngón 3 để bấm Fa. Hanon số 39 (scan archive.org, trang 49 của PDF) cho cùng dãy số: Mi ngón 3 rồi Fa ngón 1 (tay phải), Sol ngón 1 rồi La ngón 3 (tay trái). Chiều đi xuống là suy ra từ số ngón (mỗi nốt giữ nguyên ngón): tay phải Fa (1) sang Mi (3) là ngón 3 vắt qua ngón cái; tay trái La (3) sang Sol (1) là ngón cái luồn dưới ngón 3, đúng 'ngược lại'. piano-keyboard-guide.com (trang hướng dẫn phổ thông, chỉ để đối chiếu) viết đúng vậy cho Đô trưởng."
