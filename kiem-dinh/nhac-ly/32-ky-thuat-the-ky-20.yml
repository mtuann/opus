    moi: Nửa cung và cung xen kẽ, 8 nốt. Chỉ có ba gam bát cung khác nhau. Âm thanh căng, kỳ ảo; xuất hiện trong nhạc của Rimsky-Korsakov, Stravinsky, Bartók và Messiaen (ông gọi là "điệu thức chuyển vị hạn chế số 2").
