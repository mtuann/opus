lan:
  - so: 1
    ngay: '2026-10-28'
    nhanh: moi/d3-l4
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D3-L4 lượt 1, phần 2/2)
      luot_2: null
      review: Claude (review D3-gom, nhóm B, 28/10/2026)
      kiem_mau: null
ghi_chu: 'Trang kỹ thuật thế kỷ 20 (tầng lõi), 5 khối abc soạn riêng. Nguồn chính: OMT (Collections, Twelve-Tone), Hutchinson (Polychords), Britannica, COD (minimalism), Reich (1968), IRCAM, Berliner Philharmoniker, lizhogg, BBC Music Magazine; WebFetch ngày 28/10/2026. CHƯA CHẮC (null): n7 phần "quyển 1" (bậc 3), n14 (Rimsky-Korsakov, Stravinsky với bát cung), n17 đến n20 (hợp âm quãng 4, Hindemith, jazz: chỉ Wikipedia), n39 (cơ chế lệch pha), n43 (đồng xu, xúc xắc, Kinh Dịch), n46 (Pärt, chỉ bậc 3). Thuật ngữ trang dùng, có hồ sơ riêng ở lô này: octatonic-scale, polytonality, twelve-tone, minimalism. Chưa có ở thuat-ngu.yml (cho D3-L5): ostinato, phasing (lệch pha), additive process (cộng dồn), aleatoric/chance music (nhạc ngẫu nhiên), quartal harmony (hợp âm quãng 4), polychord (hợp âm kép), whole-tone scale (gam toàn cung), row (dãy 12 âm).'
