nhan_dinh:
  - id: n1
    cau: Từ đầu thế kỷ 20, nhiều nhà soạn nhạc rời bỏ hệ thống trưởng, thứ và hòa âm chức năng.
    loai: lich-su
    nguon:
      - brit-12
      - brit-wt
      - omt-col
    ket_qua: dung
    ghi_chu: 'Cả bài là ví dụ: gam toàn cung, nhạc 12 âm, đa điệu tính (n3, n10, n13, n17). Câu mở nhẹ, không số liệu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/atonality", "https://www.britannica.com/art/whole-tone-scale" ]
    luot_2_ghi_chu: "Britannica: tính vô điệu tính nổi lên quanh 1908; gam toàn cung ở Debussy không có dấu dẫn/át."
  - id: n2
    cau: 'Link [Trang lịch sử](/opus/lich-su/thoi-ky/the-ky-20/): kể chuyện gì đã xảy ra.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/lich-su/thoi-ky/the-ky-20.md có tồn tại và có gam toàn cung, nhạc 12 âm, tối giản, ngẫu nhiên. Điều cần giữ: trang lịch sử nhắc các phong trào trên; bài 32 gọi nó là chỗ "chuyện gì đã xảy ra". Review: trang đích chưa chuyển (bản xem: "sắp có"); ../opus-zero/docs/lich-su/thoi-ky/the-ky-20.md có bảng các phong trào (dòng 13 "Vô điệu tính, 12 âm", dòng 18 "Tối giản"). Link có hai lần (đoạn mở đầu, mục Tối giản).'
    review: dung
  - id: n3
    cau: 'Gam toàn cung chỉ gồm các cung, không có nửa cung: 6 nốt chia đều quãng 8.'
    loai: dinh-nghia
    nguon:
      - omt-col
      - brit-wt
    ket_qua: dung
    ghi_chu: 'Britannica: sáu nốt cách nhau một cung. OMT: chỉ một cỡ bước.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/whole-tone-scale", "https://openmusictheory.github.io/scales2.html" ]
    luot_2_ghi_chu: "Britannica: mỗi bậc cách nhau một cung, 6 bậc mỗi quãng 8; OMT {0,2,4,6,8,10}."
  - id: n4
    cau: Chỉ có hai gam toàn cung khác nhau.
    loai: so-lieu
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT Collections: hai gam toàn cung.'
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/scales2.html", "https://www.britannica.com/art/whole-tone-scale" ]
    luot_2_ghi_chu: "OMT: chỉ có hai tập gam toàn cung khác nhau (12/6 = 2)."
  - id: n5
    cau: Gam toàn cung không có chủ âm rõ ràng, không có cảm giác "về nhà".
    loai: quy-tac
    nguon:
      - omt-col
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không có chủ âm". OMT: "rotationally ambiguous, since there is only one size of step", tức không nốt nào nổi bật; không nói "không có chủ âm". Chữ mới: "không có chủ âm rõ ràng". Review D3-gom: chữ mới có trên trang; OMT Collections (mở lại): "the whole-tone scale is rotationally ambiguous, since there is only one size of step".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/whole-tone-scale", "https://openmusictheory.github.io/scales2.html" ]
    luot_2_ghi_chu: "Britannica: không có dấu dẫn, cảm giác điệu tính chỉ dựa vào lặp lại và nhấn mạnh giai điệu; mọi hợp âm ba đều tăng. OMT: tập hợp tự nó không hàm ý chủ âm."
  - id: n6
    cau: Âm thanh gam toàn cung mơ hồ, lơ lửng, như trong mơ; gắn với Debussy.
    loai: lich-su
    nguon:
      - brit-wt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đặc trưng của Debussy". Britannica: Debussy, Dukas và những người khác dùng khoảng năm 1900; không nói "đặc trưng". Chữ mới: "gắn với Debussy". Phần "như trong mơ" là mô tả cảm giác. Review D3-gom: chữ mới có trên trang; OMT Collections: dùng gam toàn cung "to produce an unsettled feeling in the listener" (khớp "lơ lửng").'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/whole-tone-scale" ]
    luot_2_ghi_chu: Britannica gắn kiểu viết gam toàn cung với Debussy (khoảng 1900). Phần "mơ hồ, lơ lửng, như trong mơ" là mô tả cảm nhận, không kiểm được.
  - id: n7
    cau: Voiles, trong tập Préludes quyển 1 của Debussy, dùng gam toàn cung.
    loai: nam
    nguon:
      - brit-wt
    ket_qua: dung
    ghi_chu: 'Britannica (Whole-tone scale): Voiles là ví dụ. CHƯA CHẮC phần "quyển 1": chỉ The Listeners'' Club (bậc 3) nói Voiles là bản thứ hai của quyển 1 (1910); chưa tìm được nguồn bậc 1-2.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/whole-tone-scale" ]
    luot_2_ghi_chu: 'Britannica: "Voiles" (Préludes, quyển 1, số 2) dùng gam toàn cung (nguồn ghi 1909). Không mở được trang IMSLP của tập Préludes để đối chiếu thêm.'
  - id: n8
    cau: Link [Préludes quyển 1](/opus/nghe-nhac/debussy-preludes/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/nghe-nhac/debussy-preludes.md có tồn tại và nói về Préludes quyển 1. Điều cần giữ: trang có Voiles hoặc ít nhất tập quyển 1. Review: trang đích chưa chuyển; ../opus-zero/docs/nghe-nhac/debussy-preludes.md về Préludes quyển 1, dòng 42 "II. Voiles … gần như cả bài trên gam toàn cung".'
    review: dung
  - id: n9
    cau: 'Khối abc 1: gam toàn cung từ Đô trên hợp âm tăng (C D E F♯ G♯ A♯ c).'
    loai: cau-truc
    nguon:
      - brit-wt
    ket_qua: dung
    ghi_chu: Xem khuong_nhac khối 1. Bảy nốt, đều cách nhau một cung, từ Đô đến Đô quãng 8 (Si♯ viết là A♯ rồi c).
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/whole-tone-scale", "https://openmusictheory.github.io/intervals.html" ]
    luot_2_ghi_chu: "Tự kiểm: C D E F# G# A# = cách nhau 2 nửa cung liên tiếp, đúng gam toàn cung; C-E-G# là hợp âm ba tăng (Britannica: mọi hợp âm ba của gam này đều tăng). Chỉ kiểm phần nhạc lý, không kiểm hình."
  - id: n10
    cau: Gam bát cung xen kẽ nửa cung và cung, 8 nốt.
    loai: dinh-nghia
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT Collections: octatonic xen kẽ cung và nửa cung, tám nốt.'
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/scales2.html" ]
    luot_2_ghi_chu: 'OMT: "alternating half steps and whole steps", ví dụ {0,1,3,4,6,7,9,10} = 8 lớp cao độ.'
  - id: n11
    cau: Chỉ có ba gam bát cung khác nhau.
    loai: so-lieu
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT: ba gam bát cung.'
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/scales2.html" ]
    luot_2_ghi_chu: 'OMT: "only three unique octatonic collections".'
  - id: n12
    cau: Messiaen gọi gam bát cung là "điệu thức chuyển vị hạn chế số 2".
    loai: ten
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT: các điệu thức chuyển vị hạn chế của Messiaen, trong đó số 2 tương ứng gam bát cung. Review D3-gom: lượt 2 (khong-chac) mở bản OMT cũ (openmusictheory.github.io) không có bảng đánh số. Review mở lại OMT Collections bản hiện hành (https://viva.pressbooks.pub/openmusictheory/chapter/collections/): bảng các điệu thức chuyển vị hạn chế của Messiaen, Mode 2 có mẫu quãng (1, 2) lặp lại, "Corresponds to the octatonic scale". Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://openmusictheory.github.io/scales2.html" ]
    luot_2_ghi_chu: OMT chỉ nói Messiaen gọi các tập này là "modes of limited transposition", không đánh số; nguồn bậc 2 mở được không xác nhận số 2 (chỉ thấy ở Wikipedia). Theo hiểu biết chung thì điệu thức 2 là bát cung nửa cung-cung, nhưng chưa xác nhận bằng nguồn đã mở.
  - id: n13
    cau: Gam bát cung xuất hiện trong nhạc của Bartók và Messiaen.
    loai: lich-su
    nguon:
      - omt-col
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "được dùng nhiều bởi Rimsky-Korsakov, Stravinsky, Bartók, Messiaen". OMT nối Bartók (mô hình khoảng cách, có 1:2) và Messiaen. Chữ mới: "xuất hiện trong nhạc của…" (bỏ "nhiều"). Review D3-gom: lượt 2 (khong-chac) mở bản OMT cũ. OMT Collections hiện hành: Messiaen và "modes of limited transposition … such as the octatonic collection"; mô hình khoảng cách "strongly associated with Béla Bartók" có "1:2 = alternating semi and whole tones (the octatonic mode again)". Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://openmusictheory.github.io/scales2.html" ]
    luot_2_ghi_chu: OMT chỉ nói "nhiều nhà soạn nhạc"; không nguồn bậc 2 đã mở nêu Bartók và Messiaen. Trang Britannica về Bartók không nhắc bát cung.
  - id: n14
    cau: Gam bát cung xuất hiện trong nhạc của Stravinsky.
    loai: lich-su
    nguon:
      - tymoczko
    ket_qua: da-sua
    ghi_chu: 'CHƯA CHẮC: chỉ Wikipedia Octatonic scale (bậc 3); OMT không nêu hai người này cho octatonic (chỉ Stravinsky ở pandiatonic, Petrushka). Giữ chữ trang, lượt 2 tìm nguồn bậc 1-2. Review D3-gom: lượt 1 chưa quyết (chỉ Wikipedia), lượt 2 khong-chac. Stravinsky: Tymoczko, Music Theory Spectrum 24/1 (2002), tóm tắt (https://collaborate.princeton.edu/en/publications/stravinsky-and-the-octatonic-a-reconsideration/): "While octatonicism is an aspect of Stravinsky''s technique, it is just one of a number of different components" (bài báo cũng nói vai trò của nó hay bị nói quá, nên trang chỉ nói "xuất hiện"). Rimsky-Korsakov: không tìm được nguồn bậc 1–2 (chỉ Wikipedia và một trang cá nhân dẫn McHose): bỏ. Chữ cũ: "xuất hiện trong nhạc của Rimsky-Korsakov, **Stravinsky**, Bartók và Messiaen"; chữ mới: "xuất hiện trong nhạc của **Stravinsky**, Bartók và Messiaen". Mục Nguồn (Wikipedia Octatonic) bỏ tên Rimsky-Korsakov; thêm Tymoczko.'
