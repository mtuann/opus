  - cu:
      - "Open Music Theory: chương Collections (Mark Gotham, Megan Lavengood, Brian Moseley, Kris Shaffer): chỉ có hai gam toàn cung và ba gam bát cung; gam toàn cung gây cảm giác chênh vênh, không rõ chủ âm; điệu thức chuyển vị hạn chế của Messiaen, trong đó số 2 là gam bát cung; chương Basics of Twelve-Tone Theory (Mark Gotham, Brian Moseley): dãy gồm đủ 12 nốt theo một thứ tự; bốn dạng nguyên bản, đảo, ngược, ngược đảo, mỗi dạng dịch lên 12 cao độ thành 48 dạng; chương Graphic Notation and Scores (Zach Gist, Chelsey Hamm): nhạc ngẫu nhiên (tung đồng xu, gieo xúc xắc), John Cage và 4′33″, nơi tiếng động trong phòng hòa nhạc là một phần của buổi diễn."
      - 'Wikipedia: Whole-tone scale (Voiles trong quyển 1 Préludes của Debussy gần như chỉ dùng một gam toàn cung), Octatonic scale (Rimsky-Korsakov, Stravinsky, Bartók, Messiaen), Quartal and quintal harmony (hợp âm quãng 4 không có âm gốc rõ ràng; Hindemith trong Mathis der Maler; jazz), Polytonality, The Rite of Spring (hợp âm dậm đi dậm lại ở "Augurs of Spring": Mi♭7 chồng lên Fa♭ trưởng), Twelve-tone technique (Schoenberg nhớ đã dùng phương pháp này từ 1921 và giới thiệu với học trò hai năm sau), Violin Concerto (Berg) (viết năm 1935; dãy chứa các hợp âm Sol thứ, Rê trưởng, La thứ, Mi trưởng, bốn nốt cuối thuộc gam toàn cung), Minimal music (lệch pha của Reich, quá trình cộng dồn của Glass), Piano Phase, Aleatoric music (để người chơi quyết định thứ tự các đoạn; Cage dùng Kinh Dịch để chọn trường độ, tốc độ, sắc thái), 4′33″.'
      - "Cơ sở dữ liệu BRAHMS của IRCAM: Arnold Schoenberg (dùng kỹ thuật chuỗi từ năm 1923), Violinkonzert của Berg (1935), Piano Phase (1967, cho hai piano hoặc hai marimba)."
    moi:
      - "Open Music Theory: chương Collections (Mark Gotham, Megan Lavengood, Brian Moseley, Kris Shaffer): chỉ có hai gam toàn cung và ba gam bát cung; gam toàn cung chỉ có một cỡ bước nên không nốt nào rõ ràng là chủ âm; gam bát cung xen kẽ cung và nửa cung, tám nốt; điệu thức chuyển vị hạn chế của Messiaen, trong đó số 2 tương ứng gam bát cung; chương Basics of Twelve-Tone Theory (Mark Gotham, Brian Moseley): dãy gồm đủ 12 nốt theo một thứ tự; bốn dạng nguyên bản, đảo, ngược, ngược đảo, mỗi dạng dịch lên 12 cao độ thành 48 dạng; nhạc 12 âm dùng cả 12 cao độ gần như ngang nhau nên các yếu tố như giọng, chủ âm thường không áp dụng; chương Graphic Notation and Scores (Zach Gist, Chelsey Hamm): ngẫu nhiên (chance) gồm tung đồng xu, gieo xúc xắc; John Cage và 4′33″; trong phòng hòa nhạc có thể nghe tiếng điện thoại hay tiếng ho."
      - "Robert Hutchinson, Music Theory for the 21st-Century Classroom, mục Quartal, Quintal, and Secundal Harmony trên LibreTexts: hợp âm quãng 4 chồng toàn (hay gần toàn) quãng 4; ví dụ Schoenberg, Giao hưởng thính phòng số 1, Op. 9; mục Additive Minimalism (quá trình cộng dồn của Glass) và Phase Shifting (người chơi thứ hai tăng tốc dần để hai mẫu lệch pha; Piano Phase, 1967)."
      - 'Berklee Online, "Harmonic Considerations for Modal Harmony": thế bấm quãng 4 không nghe trưởng, thứ, tăng hay giảm, nốt nào cũng có thể là âm gốc; Bill Evans ở So What.'
      - 'Dmitri Tymoczko, "Stravinsky and the Octatonic: A Reconsideration", Music Theory Spectrum 24/1 (2002): gam bát cung là một thành phần trong kỹ thuật của Stravinsky.'
      - "Yale Schwarzman Center, lời giới thiệu Le Sacre du printemps: đoạn Augures printaniers – Danses des adolescentes mở đầu bằng tiết tấu dậm nặng, trọng âm lệch phách; hợp âm là Mi trưởng chồng với hợp âm bảy trên Mi♭."
      - 'Robert Hutchinson, Music Theory for the 21st-Century Classroom, mục Polychords trên LibreTexts: hợp âm Mi♭7 chồng lên hợp âm Fa♭ trưởng trong Le Sacre du printemps, ở "Dance of the Adolescents".'
      - "Encyclopaedia Britannica: Whole-tone scale (sáu nốt cách nhau một cung; Debussy, Dukas và những người khác dùng khoảng năm 1900; Voiles là ví dụ), Polytonality (hai hay nhiều giọng cùng lúc), 12-tone music (Schoenberg được coi là người phát minh), Ostinato (một câu giai điệu ngắn lặp suốt tác phẩm), Aleatory music (gieo xúc xắc, Kinh Dịch, người chơi chọn thứ tự trình bày; John Cage), Arvo Pärt (phong cách dựa trên sự biến đổi chậm của âm thanh)."
      - 'The Concise Oxford Dictionary of Music, mục minimalism, qua Encyclopedia.com: phong cách từ thập niên 1960, lặp lại các môtip ngắn; Glass, Riley, Reich là những nhà tối giản tiêu biểu. Steve Reich, "Music as a Gradual Process" (1968), đoạn trích: quá trình âm nhạc "should happen extremely gradually".'
      - "Berg, Concerto violin: IRCAM, BRAHMS (viết năm 1935); Berliner Philharmoniker, lời giới thiệu (dãy dựng từ các hợp âm ba xen nhau, kết bằng ba bước một cung); bài giảng MUS347W (dãy Sol – Si♭ – Rê – Fa♯ – La – Đô – Mi – Sol♯ – Si – Đô♯ – Mi♭ – Fa)."
      - "IRCAM, BRAHMS: Arnold Schoenberg (áp dụng kỹ thuật chuỗi năm 1923), Piano Phase (Steve Reich, 1967, cho hai piano hoặc hai marimba)."
