nhan_dinh:
  - id: n1
    cau: Từ đầu thế kỷ 20, nhiều nhà soạn nhạc rời bỏ hệ thống trưởng, thứ và hòa âm chức năng.
    loai: lich-su
    nguon:
      - brit-12
      - brit-wt
      - omt-col
    ket_qua: dung
    ghi_chu: 'Cả bài là ví dụ: gam toàn cung, nhạc 12 âm, đa điệu tính (n3, n10, n13, n17). Câu mở nhẹ, không số liệu.'
  - id: n2
    cau: 'Link [Trang lịch sử](/opus/lich-su/thoi-ky/the-ky-20/): kể chuyện gì đã xảy ra.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/lich-su/thoi-ky/the-ky-20.md có tồn tại và có gam toàn cung, nhạc 12 âm, tối giản, ngẫu nhiên. Điều cần giữ: trang lịch sử nhắc các phong trào trên; bài 32 gọi nó là chỗ "chuyện gì đã xảy ra".'
  - id: n3
    cau: 'Gam toàn cung chỉ gồm các cung, không có nửa cung: 6 nốt chia đều quãng 8.'
    loai: dinh-nghia
    nguon:
      - omt-col
      - brit-wt
    ket_qua: dung
    ghi_chu: 'Britannica: sáu nốt cách nhau một cung. OMT: chỉ một cỡ bước.'
  - id: n4
    cau: Chỉ có hai gam toàn cung khác nhau.
    loai: so-lieu
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT Collections: hai gam toàn cung.'
  - id: n5
    cau: Gam toàn cung không có chủ âm rõ ràng, không có cảm giác "về nhà".
    loai: quy-tac
    nguon:
      - omt-col
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không có chủ âm". OMT: "rotationally ambiguous, since there is only one size of step", tức không nốt nào nổi bật; không nói "không có chủ âm". Chữ mới: "không có chủ âm rõ ràng".'
  - id: n6
    cau: Âm thanh gam toàn cung mơ hồ, lơ lửng, như trong mơ; gắn với Debussy.
    loai: lich-su
    nguon:
      - brit-wt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đặc trưng của Debussy". Britannica: Debussy, Dukas và những người khác dùng khoảng năm 1900; không nói "đặc trưng". Chữ mới: "gắn với Debussy". Phần "như trong mơ" là mô tả cảm giác.'
  - id: n7
    cau: Voiles, trong tập Préludes quyển 1 của Debussy, dùng gam toàn cung.
    loai: nam
    nguon:
      - brit-wt
    ket_qua: dung
    ghi_chu: 'Britannica (Whole-tone scale): Voiles là ví dụ. CHƯA CHẮC phần "quyển 1": chỉ The Listeners'' Club (bậc 3) nói Voiles là bản thứ hai của quyển 1 (1910); chưa tìm được nguồn bậc 1-2.'
  - id: n8
    cau: Link [Préludes quyển 1](/opus/nghe-nhac/debussy-preludes/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/nghe-nhac/debussy-preludes.md có tồn tại và nói về Préludes quyển 1. Điều cần giữ: trang có Voiles hoặc ít nhất tập quyển 1.'
  - id: n9
    cau: 'Khối abc 1: gam toàn cung từ Đô trên hợp âm tăng (C D E F♯ G♯ A♯ c).'
    loai: cau-truc
    nguon:
      - brit-wt
    ket_qua: dung
    ghi_chu: Xem khuong_nhac khối 1. Bảy nốt, đều cách nhau một cung, từ Đô đến Đô quãng 8 (Si♯ viết là A♯ rồi c).
  - id: n10
    cau: Gam bát cung xen kẽ nửa cung và cung, 8 nốt.
    loai: dinh-nghia
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT Collections: octatonic xen kẽ cung và nửa cung, tám nốt.'
  - id: n11
    cau: Chỉ có ba gam bát cung khác nhau.
    loai: so-lieu
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT: ba gam bát cung.'
  - id: n12
    cau: Messiaen gọi gam bát cung là "điệu thức chuyển vị hạn chế số 2".
    loai: ten
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'OMT: các điệu thức chuyển vị hạn chế của Messiaen, trong đó số 2 tương ứng gam bát cung.'
  - id: n13
    cau: Gam bát cung xuất hiện trong nhạc của Bartók và Messiaen.
    loai: lich-su
    nguon:
      - omt-col
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "được dùng nhiều bởi Rimsky-Korsakov, Stravinsky, Bartók, Messiaen". OMT nối Bartók (mô hình khoảng cách, có 1:2) và Messiaen. Chữ mới: "xuất hiện trong nhạc của…" (bỏ "nhiều").'
  - id: n14
    cau: Gam bát cung xuất hiện trong nhạc của Rimsky-Korsakov và Stravinsky.
    loai: lich-su
    nguon:
      - wiki-oct
    ket_qua: null
    ghi_chu: 'CHƯA CHẮC: chỉ Wikipedia Octatonic scale (bậc 3); OMT không nêu hai người này cho octatonic (chỉ Stravinsky ở pandiatonic, Petrushka). Giữ chữ trang, lượt 2 tìm nguồn bậc 1-2.'
  - id: n15
    cau: Gam bát cung có âm thanh căng, kỳ ảo.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mô tả cảm giác nghe, dùng ở bài tập nhận diện.
  - id: n16
    cau: 'Khối abc 2: gam bát cung từ Đô (nửa cung, cung): C D♭ E♭ E F♯ G A B♭ c.'
    loai: cau-truc
    nguon:
      - omt-col
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 2. Các bước: nửa, cung, nửa, cung, nửa, cung, nửa, cung.'
  - id: n17
    cau: Hợp âm quãng 4 chồng quãng 4 thay vì quãng 3.
    loai: dinh-nghia
    nguon:
      - wiki-quart
    ket_qua: null
    ghi_chu: 'CHƯA CHẮC về bậc nguồn: chỉ Wikipedia (bậc 3); định nghĩa đơn giản, hiển nhiên đúng. Ghi null nếu theo luật "bậc 3 không là nguồn duy nhất".'
  - id: n18
    cau: Hợp âm quãng 4 mơ hồ, không có âm gốc rõ ràng, không trưởng không thứ.
    loai: dinh-nghia
    nguon:
      - wiki-quart
    ket_qua: da-sua
    ghi_chu: 'CHƯA CHẮC bậc nguồn: chỉ Wikipedia (không có âm gốc rõ ràng). Chữ cũ: "rỗng, hiện đại"; đó là cảm giác không kiểm được nên bỏ. Lượt 2 tìm nguồn bậc 1-2.'
  - id: n19
    cau: Hindemith dùng hợp âm quãng 4 trong Mathis der Maler.
    loai: lich-su
    nguon:
      - wiki-quart
    ket_qua: null
    ghi_chu: 'CHƯA CHẮC: chỉ Wikipedia (bậc 3). Chữ cũ "Hindemith dùng nhiều" đổi thành một tác phẩm cụ thể theo Wikipedia.'
  - id: n20
    cau: Jazz cũng dùng hợp âm quãng 4.
    loai: lich-su
    nguon:
      - wiki-quart
    ket_qua: null
    ghi_chu: 'CHƯA CHẮC bậc nguồn: Wikipedia và vài trang dạy jazz (bậc 3). Hiển nhiên đúng nhưng chưa có nguồn bậc 1-2.'
  - id: n21
    cau: 'Khối abc 3: ba hợp âm quãng 4 [C F B♭ E♭] [D G c f] [E A d g] rồi lặp lại, nhịp 4/2.'
    loai: cau-truc
    nguon:
      - wiki-quart
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 3: mỗi hợp âm gồm các quãng 4 đúng liên tiếp.'
  - id: n22
    cau: 'Đa điệu tính: hai giọng (hoặc hai hợp âm) khác nhau cùng lúc.'
    loai: dinh-nghia
    nguon:
      - brit-poly
      - mt21c-poly
    ket_qua: da-sua
    ghi_chu: 'Britannica: đa điệu tính là hai hay nhiều giọng cùng lúc. Hutchinson tách polychord (hai hợp âm chồng nhau) khỏi đa điệu tính, nên câu cũ "Hợp âm nổi tiếng nhất" đổi thành "Một hợp âm rất nổi tiếng thuộc loại này (hợp âm kép, polychord)". Cách nói "hai giọng (hoặc hai hợp âm)" gộp hai khái niệm; lượt 2 cân nhắc tách.'
  - id: n23
    cau: 'Một hợp âm rất nổi tiếng thuộc loại này nằm ở Les Augures printaniers trong Le Sacre du printemps: Mi♭7 chồng lên Fa♭ trưởng (nghe như Mi trưởng).'
    loai: nam
    nguon:
      - mt21c-poly
      - wiki-rite
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hợp âm nổi tiếng nhất". Hutchinson: Mi♭7 chồng Fa♭ trưởng ở "Dance of the Adolescents" (tên khác của Augurs of Spring). Fa♭ = Mi nên "nghe như Mi trưởng" đúng về cao độ. Không có nguồn xếp "nổi tiếng nhất".'
  - id: n24
    cau: Hợp âm ấy dậm đi dậm lại.
    loai: cau-truc
    nguon:
      - wiki-rite
    ket_qua: dung
    ghi_chu: 'Wikipedia (bậc 3): hợp âm dậm đi dậm lại ở Augurs of Spring; mô tả tiết tấu hiển nhiên khi nghe.'
  - id: n25
    cau: Link [Le Sacre du printemps](/opus/nghe-nhac/stravinsky-sacre/) (hai lần).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Site cũ ../opus-zero/docs/nghe-nhac/stravinsky-sacre.md có tồn tại và có đoạn Augurs. Điều cần giữ: trang có Les Augures printaniers (bài tập 2 gọi đúng đoạn này).'
  - id: n26
    cau: 'Khối abc 4: Mi♭7 [E♭ G B♭ D♭] trên Fa♭ trưởng [F♭ A♭ C♭], nhịp 2/4.'
    loai: cau-truc
    nguon:
      - mt21c-poly
    ket_qua: dung
    ghi_chu: 'Xem khuong_nhac khối 4. Hutchinson: Mi♭7 trên Fa♭ trưởng.'
  - id: n27
    cau: Schoenberg phát triển phương pháp 12 âm (khoảng đầu thập niên 1920) để tổ chức âm nhạc vô điệu tính.
    loai: lich-su
    nguon:
      - ircam-sch
      - brit-12
      - omt-12
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khoảng 1921–1923". IRCAM: áp dụng kỹ thuật chuỗi năm 1923; Wikipedia (bậc 3): đã dùng từ 1921 (nhớ). Không có nguồn bậc 1-2 cho 1921 nên đổi thành "khoảng đầu thập niên 1920". Britannica: Schoenberg được coi là người phát minh.'
  - id: n28
    cau: 'Bước 1: sắp xếp cả 12 nốt của quãng 8 thành một dãy (row), mỗi nốt một lần, theo thứ tự nhà soạn nhạc chọn.'
    loai: dinh-nghia
    nguon:
      - omt-12
    ket_qua: dung
    ghi_chu: 'OMT: dãy gồm đủ 12 nốt theo một thứ tự.'
  - id: n29
    cau: 'Bước 2: mọi giai điệu và hợp âm đều lấy từ dãy đó, theo đúng thứ tự.'
    loai: quy-tac
    nguon:
      - omt-12
    ket_qua: dung
    ghi_chu: 'OMT: nhạc 12 âm lấy chất liệu từ dãy. "Mọi" là định nghĩa cơ bản của phương pháp; thực hành có nới lỏng.'
  - id: n30
    cau: 'Dãy có bốn dạng: nguyên bản (P), đảo (I), ngược (R), ngược đảo (RI), chuyển lên bất kỳ cao độ nào: tổng cộng 48 dạng.'
    loai: so-lieu
    nguon:
      - omt-12
    ket_qua: dung
    ghi_chu: 'OMT: bốn dạng, mỗi dạng dịch lên 12 cao độ thành 48 dạng (4 x 12).'
  - id: n31
    cau: 'Mục đích: không nốt nào được "ưu tiên", nên không có chủ âm.'
    loai: quy-tac
    nguon:
      - omt-12
    ket_qua: dung
    ghi_chu: 'OMT: nhạc 12 âm dùng cả 12 cao độ gần như ngang nhau nên giọng, chủ âm không còn như nhạc tonal.'
  - id: n32
    cau: Dãy 12 âm của Concerto violin của Alban Berg (1935) chứa nhiều hợp âm ba ẩn bên trong.
    loai: lich-su
    nguon:
      - berl
      - ircam-berg
      - lizhogg
    ket_qua: dung
    ghi_chu: 'IRCAM: viết năm 1935. Berliner Phil.: dãy dựng từ các hợp âm ba xen nhau. lizhogg: dãy G B♭ D F♯ A C E G♯ B C♯ E♭ F.'
  - id: n33
    cau: Dãy ấy nghe gần với nhạc tonal hơn.
    loai: khuyen-tap
