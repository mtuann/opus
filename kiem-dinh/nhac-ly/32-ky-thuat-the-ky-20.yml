doi_chu:
  - cu: 'Vì mọi khoảng cách đều bằng nhau, gam này không có chủ âm, không có cảm giác "về nhà". Âm thanh mơ hồ, lơ lửng, như trong mơ: đặc trưng của Debussy (Voiles, trong tập Préludes quyển 1).'
    moi: 'Vì mọi khoảng cách đều bằng nhau, gam này không có chủ âm rõ ràng, không có cảm giác "về nhà". Âm thanh mơ hồ, lơ lửng, như trong mơ: gắn với Debussy (Voiles, trong tập Préludes quyển 1).'
    ly_do: 'n5 (da-sua): OMT nói "rotationally ambiguous".; n6 (da-sua): Britannica không nói "đặc trưng".'
  - cu: Nửa cung và cung xen kẽ, 8 nốt. Chỉ có ba gam bát cung khác nhau. Âm thanh căng, kỳ ảo; được dùng nhiều bởi Rimsky-Korsakov, Stravinsky, Bartók, và Messiaen (ông gọi là "điệu thức chuyển vị hạn chế số 2").
    moi: Nửa cung và cung xen kẽ, 8 nốt. Chỉ có ba gam bát cung khác nhau. Âm thanh căng, kỳ ảo; xuất hiện trong nhạc của Stravinsky, Bartók và Messiaen (ông gọi là "điệu thức chuyển vị hạn chế số 2").
    ly_do: 'n13 (da-sua): không có nguồn đếm "nhiều".; n14 (da-sua, review D3-gom): Rimsky-Korsakov chỉ có nguồn bậc 3; Stravinsky: Tymoczko (2002).'
