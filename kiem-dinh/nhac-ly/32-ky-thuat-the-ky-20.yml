  - id: n38
    cau: 'Quá trình cộng dồn (additive process): mẫu được thêm dần từng nốt (hay từng đơn vị nhỏ) qua mỗi lần lặp.'
    loai: dinh-nghia
    nguon:
      - mt21c-add
      - reich
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thêm từng nốt một". Reich (rhythmic construction): "gradually substituting beats for rests within a constantly repeating rhythmic cycle", tức cộng dồn từng phách; nên thêm "(hay từng đơn vị nhỏ)". Tên "additive process" chỉ có ở Wikipedia (bậc 3, gắn với Glass); đề xuất thuật ngữ cho D3-L5. Review D3-gom: lượt 2 (khong-chac) chưa có nguồn định nghĩa additive process. MT21C 35.1 Additive Minimalism (mt21c-add): Music in Fifths của Glass là ví dụ của "additive process"; Two Pages: "he adds a repetition of a pattern but subtracts the final note in the repetition", "Each addition to the pattern is another repetition…". Khớp "mẫu được thêm dần … qua mỗi lần lặp"; giữ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được nguồn bậc 2 định nghĩa "additive process" (Britannica Glass không nhắc).
