  - cu: "Hai giọng (hoặc hai hợp âm) khác nhau cùng lúc. Hợp âm nổi tiếng nhất là ở đoạn Les Augures printaniers trong Le Sacre du printemps: hợp âm Mi♭7 chồng lên hợp âm Fa♭ trưởng (nghe như Mi trưởng), dậm đi dậm lại."
    moi: "Hai giọng (hoặc hai hợp âm) khác nhau cùng lúc. Một hợp âm rất nổi tiếng thuộc loại này (hợp âm kép, polychord) nằm ở đoạn Les Augures printaniers trong Le Sacre du printemps: hợp âm Mi♭7 chồng lên hợp âm Fa♭ trưởng (nghe như Mi trưởng), dậm đi dậm lại."
    ly_do: "n22, n23 (da-sua): không có nguồn xếp hạng; polychord khác đa điệu tính theo Hutchinson."
  - cu: "Schoenberg phát triển phương pháp 12 âm (khoảng 1921–1923) để tổ chức âm nhạc vô điệu tính:"
    moi: "Schoenberg phát triển phương pháp 12 âm (khoảng đầu thập niên 1920) để tổ chức âm nhạc vô điệu tính:"
