    ghi_chu: 'G B♭ D = Sol thứ; D F♯ A = Rê trưởng; A C E = La thứ; E G♯ B = Mi trưởng; bốn nốt cuối Si, Đô♯, Mi♭, Fa cách nhau từng cung. Berliner Phil.: kết bằng ba bước một cung.'
    luot_2: dung
    luot_2_nguon: [ "https://openmusictheory.github.io/triads.html" ]
    luot_2_ghi_chu: "Tự kiểm: Sol-Si♭-Rê = Sol thứ; Rê-Fa♯-La = Rê trưởng; La-Đô-Mi = La thứ; Mi-Sol♯-Si = Mi trưởng; Si-Đô♯-Mi♭-Fa cách nhau từng cung. Các nốt đầu nối nhau (Rê, La, Mi, Si dùng chung)."
