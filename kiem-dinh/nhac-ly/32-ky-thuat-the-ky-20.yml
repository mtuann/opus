    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/polytonality" ]
    luot_2_ghi_chu: Không mở được nguồn bậc 2 (không phải Wikipedia) nêu hợp âm Mi♭7 trên Fa♭ trưởng trong "Les Augures printaniers". Trang Wikipedia nói như vậy nhưng chỉ dùng để tìm nguồn; Britannica Polytonality không nhắc Le Sacre.
