  - cu: Thay vì chồng quãng 3 (hòa âm truyền thống), chồng quãng 4. Âm thanh "rỗng", hiện đại, không trưởng không thứ. Hindemith dùng nhiều; jazz cũng vậy.
    moi: Thay vì chồng quãng 3 (hòa âm truyền thống), chồng quãng 4. Âm thanh mơ hồ, không có âm gốc rõ ràng, không trưởng không thứ. Hindemith dùng trong Mathis der Maler; jazz cũng vậy.
