nhan_dinh:
  - id: n1
    cau: "Mỗi nốt nhạc có một cao độ: âm cao hay thấp."
    loai: dinh-nghia
    nguon:
      - omt-notation
      - uq-pitch
      - omt-clefs
    ket_qua: da-sua
    ghi_chu: 'Câu cũ (cả đoạn mở đầu và mô tả trang): "Mỗi âm thanh có một cao độ: âm cao hay thấp." Mới: "Mỗi nốt nhạc có một cao độ: …". Lý do: không phải âm thanh nào cũng có cao độ xác định (tiếng gõ, tiếng ồn): OMT Reading Clefs: "because it is often used for percussion instruments with indefinite pitch" (khóa trung tính cho nhạc cụ gõ). Nốt nhạc thì có cao độ: OMT Notation of Notes: "Musicians use spatial metaphors to describe notes placed on a staff: notes appearing toward the top of the staff are said to be “higher” than those toward the bottom, which are said to be “lower.”". UQ, Pitch: "most humans (and human societies) attribute a notion of “height” to pitch, with notes whose fundamental frequency is faster being perceived as “higher.”"'
  - id: n2
    cau: Về mặt vật lý, cao độ phụ thuộc vào tần số dao động.
    loai: quy-tac
    nguon:
      - omt-notation
      - uq-pitch
    ket_qua: dung
    ghi_chu: 'OMT Notation of Notes: "Higher pitches are produced by sound waves with a shorter wavelength (and consequently a higher frequency); sound waves with a longer wavelength (lower frequency) produce lower pitches.". UQ, Pitch: "It is the fundamental frequency that determines our perception of a note’s pitch."'
  - id: n3
    cau: Dây đàn rung càng nhanh, âm càng cao.
    loai: quy-tac
    nguon:
      - omt-notation
      - uq-pitch
    ket_qua: dung
    ghi_chu: 'Rung nhanh hơn là tần số cao hơn: OMT Notation of Notes: "Higher pitches are produced by sound waves with a shorter wavelength (and consequently a higher frequency)". UQ, Pitch: "with notes whose fundamental frequency is faster being perceived as “higher.”"'
  - id: n4
    cau: Nốt La dùng để lên dây cho dàn nhạc thường dao động 440 lần mỗi giây (440 Hz).
    loai: so-lieu
    nguon:
      - uq-pitch
      - iso16
      - unsw-notes
      - physorg-oboe
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "nốt La dùng để lên dây cho dàn nhạc dao động 440 lần mỗi giây (440 Hz)". Câu mới thêm "thường". Lý do: UQ, Pitch: "This note is conventionally called “A” or, more precisely, “A440.”" (nốt oboe chơi cho dàn nhạc lên dây: UQ, Pitch: "it is the note to which the rest of the orchestra “tunes up.”"); UQ, Pitch: "When our oboist plays A440, there are 440 cycles per second of the fundamental frequency."; ISO 16:1975 (qua ASN): "Specifies the frequency for the note A in the treble stave and shall be 440 Hz.". Nhưng không phải dàn nhạc nào cũng lên dây đúng 440 Hz (bài báo phổ thông, bậc 3, chỉ để tìm nguồn): The Conversation (phys.org): "The New York Philharmonic tunes to A=442Hz, and the Vienna Philharmonic to A=443Hz." Nên viết "thường".'
  - id: n5
    cau: Âm nhạc phương Tây chia các cao độ thành một hệ thống có tên gọi cố định.
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - mt21c-octave
    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs: "In Western musical notation, pitches are designated by the first seven letters of the Latin alphabet: A, B, C, D, E, F, and G.". MT21C 1.3 Octave Registers: "The note names used in music" là bảng chữ cái âm nhạc A–G, hết G thì quay lại A (xem n6).'
  - id: n6
    cau: Chỉ có 7 tên nốt, lặp đi lặp lại từ thấp đến cao.
    loai: dinh-nghia
    nguon:
      - omt-clefs
      - mt21c-octave
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Reading Clefs: "After G these letter names repeat in a loop". Đây là bảy tên chữ cái gốc; nốt có dấu hóa mang tên nốt gốc kèm thăng hay giáng (OMT Half Steps: "Black keys that are a half step above a white key take the name of the white key and add the word “sharp.”"), nên câu "chỉ có 7 tên nốt" đúng ở mức tên gốc; phím đen học ở bài 5 (n28).'
  - id: n7
    cau: Đô, Rê, Mi, Fa, Sol, La, Si lần lượt ứng với C, D, E, F, G, A, B.
    loai: dinh-nghia
    nguon:
      - omt-major
      - dol1
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "A system of solfège in which do is always the pitch class C, re the pitch class D, etc., regardless of scale." (mục từ fixed do). OMT dùng "ti" cho nốt thứ bảy, tiếng Việt viết "Si". Dolmetsch bài 1: "In European and other countries whose main language is a Romance language, the pitch names are based on the solfeggio syllables: do (or ut), re, mi, fa, so (or sol), la, si (or ti)." Cách viết tiếng Việt (Đô, Rê, Mi, Fa, Sol, La, Si) theo quy ước của site; đối ứng này đã dùng ở trang đã khóa bat-dau/tom-tat (n6).'
  - id: n8
    cau: Ở Việt Nam, Pháp, Ý… người ta gọi tên nốt là Đô, Rê, Mi.
    loai: ten
    nguon:
      - dol1
      - novas
    ket_qua: dung
    ghi_chu: 'Pháp, Ý: Dolmetsch bài 1: "In European and other countries whose main language is a Romance language, the pitch names are based on the solfeggio syllables" (Pháp, Ý đều dùng tiếng Romance). Việt Nam: chỉ có tài liệu tiếng Việt bậc 3, giáo trình không ghi tác giả: Giáo trình Lý thuyết âm nhạc cơ bản (novaspro.vn): "Tên gọi các bậc cơ bản trong thang âm của hệ thống âm nhạc: Do, Re, Mi, Fa, Sol, La, Si.". Chưa chắc ở phần Việt Nam theo chuẩn bậc 2: cần lượt 2 tìm sách giáo khoa Âm nhạc của NXB Giáo dục Việt Nam hay giáo trình nhạc viện. Đây cũng là quy ước ngôn ngữ mà chính site dùng (bảng đầu trang "Hệ Việt Nam (solfège)").'
  - id: n9
    cau: Trong tài liệu tiếng Anh, tên nốt viết bằng chữ cái, nên bạn sẽ gặp cả hai hệ khi đọc tài liệu.
    loai: ten
    nguon:
      - omt-clefs
      - mt21c-notation
      - uq-pitch
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Trong tài liệu tiếng Anh và trên phần mềm, tên nốt viết bằng chữ cái. Bạn nên thuộc cả hai, vì phần lớn tài liệu tốt bằng tiếng Anh." Mới: "Trong tài liệu tiếng Anh, tên nốt viết bằng chữ cái. Bạn nên thuộc cả hai, vì bạn sẽ gặp cả hai khi đọc tài liệu." Lý do: "trên phần mềm" không có nguồn chung (không thấy nguồn nào nói mọi phần mềm dùng chữ cái); "phần lớn tài liệu tốt bằng tiếng Anh" không kiểm được. Phần còn lại đúng: OMT Reading Clefs: "In Western musical notation, pitches are designated by the first seven letters of the Latin alphabet: A, B, C, D, E, F, and G."; MT21C 1.2 Notation: "In treble clef, the notes on the lines are" E–G–B–D–F (giáo trình tiếng Anh gọi nốt bằng chữ cái); UQ Pitch cũng viết A, A440, A880. Lời khuyên "nên thuộc cả hai" tách ở n10.'
  - id: n10
    cau: Bạn nên thuộc cả hai hệ tên nốt.
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: 'Lời khuyên học. Không trái trang lõi nào: bat-dau/tom-tat (đã khóa) dùng cả hai hệ ("Đô Rê Mi Fa Sol La Si = C D E F G A B"); bài nhạc lý 1 cũ (../opus-zero/docs/nhac-ly/01-cao-do-ten-not.md) viết giống hệt.'
  - id: n11
    cau: "Mẹo nhớ: bắt đầu từ La = A, rồi đi theo bảng chữ cái: La A, Si B, Đô C, Rê D, Mi E, Fa F, Sol G."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Mẹo nhớ. Cặp tương ứng khớp n7 (La=A, Si=B, Đô=C, Rê=D, Mi=E, Fa=F, Sol=G) và thứ tự A B C D E F G của OMT Reading Clefs ("After G these letter names repeat in a loop"); không trái trang lõi nào (bat-dau/tom-tat dùng cùng đối ứng).
  - id: n12
    cau: Khuông nhạc dưới "Nghe gam Đô trưởng đi lên, từ Đô đến Đô" đi lên từ Đô (C4) đến Đô (C5) bằng tám nốt không dấu hóa.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "abcjs (public/vendor/abcjs-basic-min.js, parseOnly) đọc khối abc 1: C4 D4 E4 F4 | G4 A4 B4 C5, nốt đen (L:1/4), M:4/4 nên mỗi ô đủ 4 phách, K:C không dấu hóa. tools/khuong-nhac.mjs không báo lỗi."
  - id: n13
    cau: Dãy Đô Rê Mi Fa Sol La Si Đô không dấu hóa là gam Đô trưởng.
    loai: dinh-nghia
    nguon:
      - omt-major
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: "A major scale always starts and ends on notes of the same letter name, one octave apart, and this starting and ending note determines the name of the scale." (hình 1 của chương là gam C major); OMT Major Scales: "C major, which has nothing in its key signature (no sharps or flats)". Bài 6 dạy kỹ hơn.'
  - id: n14
    cau: Nốt thứ tám nghe "giống" nốt đầu tiên, chỉ cao hơn.
    loai: quy-tac
    nguon:
      - uq-pitch
      - dol1
    ket_qua: dung
    ghi_chu: 'UQ, Pitch: "You will hear when you click on these frequencies that there is a strong relationship between them; we perceive that they are alike.". Dolmetsch bài 1: "The human ear tends to hear notes an octave apart as being essentially "the same"." Trang đặt "giống" trong nháy kép: đúng mức này.'
  - id: n15
    cau: Hai nốt này cùng tên và cách nhau một quãng tám (octave).
    loai: dinh-nghia
    nguon:
      - omt-keyboard
      - mt21c-octave
    ket_qua: dung
    ghi_chu: 'OMT Keyboard and Grand Staff: "An interval of twelve half steps between two notes with the same letter name." (mục từ octave); MT21C 1.3 Octave Registers: "The distance from any note to a note of the same name in the next register above or below is called an octave".'
  - id: n16
    cau: Tần số của nốt trên gấp đôi nốt dưới.
    loai: quy-tac
    nguon:
      - omt-keyboard
      - uq-pitch
      - unsw-notes
    ket_qua: dung
    ghi_chu: 'OMT Keyboard and Grand Staff: "The frequencies of two notes related by octave form a 2:1 ratio.". UQ, Pitch: "an octave is an interval that separates two notes whose fundamental frequencies expresses a ratio of 2:1". UNSW Music Acoustics: "An octave is a ratio of 2:1"'
  - id: n17
    cau: Vì 7 tên nốt lặp lại, ta cần số để biết nốt nằm ở quãng tám nào.
    loai: dinh-nghia
    nguon:
      - omt-aspn
      - mt21c-octave
    ket_qua: dung
    ghi_chu: 'OMT ASPN: "ASPN designates specific musical pitches by combining a note name (such as C) with a subscript octave designation (such as 4), creating a bipartite label (for example, C4)." Cùng ý: MT21C 1.3: số quãng tám ghi rõ "the exact register of a note".'
  - id: n18
    cau: Ký hiệu thông dụng (ký hiệu khoa học) ghi tên chữ cái kèm số.
    loai: ten
    nguon:
      - omt-aspn
      - dol1
    ket_qua: dung
    ghi_chu: "OMT gọi là American Standard Pitch Notation (ASPN): OMT ASPN: \"ASPN labels are very useful, since they can identify every possible musical note within human hearing range, from the lowest pitches to the highest.\". Dolmetsch bài 1: \"an alternative naming convention called 'Scientific Pitch Notation', 'Note-Octave Notation' or American Standard Pitch Notation\". \"Ký hiệu khoa học\" là cách dịch của site (Scientific Pitch Notation); chưa có trong thuat-ngu.yml: ghi cho D3-L5."
  - id: n19
    cau: C4 là Đô giữa (middle C), nằm gần giữa bàn phím piano.
    loai: dinh-nghia
    nguon:
      - omt-aspn
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'OMT ASPN: "Middle C is C4 in ASPN." OMT Keyboard and Grand Staff: "C₄; the C near the middle of the piano keyboard, written on the first ledger line below the treble clef staff or the first ledger line above the bass clef staff."'
  - id: n20
    cau: "Từ C4 đi lên: D4, E4, F4, G4, A4, B4, rồi đến C5. Số tăng lên ở nốt Đô."
    loai: quy-tac
    nguon:
      - omt-aspn
      - mt21c-octave
    ket_qua: dung
    ghi_chu: 'OMT ASPN: "This means that each new octave designation begins on the note C". OMT ASPN: "The notes C4, D4, E4, F4, G4, A4, and B4." (ví dụ 2).'
  - id: n21
    cau: A4 là nốt La 440 Hz.
    loai: so-lieu
    nguon:
      - iso16
      - uq-pitch
      - dol1
      - unsw-notes
    ket_qua: dung
    ghi_chu: 'ISO 16:1975 (qua ASN): "Specifies the frequency for the note A in the treble stave and shall be 440 Hz." (La trong khuông Sol, ngay trên Đô giữa = A4 theo ASPN). Dolmetsch bài 1, bảng tần số: A4 (a′ trong ký hiệu Helmholtz) = 440 Hz; UNSW Music Acoustics: "By convention, A4 is often set at 440 Hz." Đây là chuẩn quy ước; không phải mọi đàn hay dàn nhạc đều lên dây đúng 440 Hz (xem n4).'
  - id: n22
    cau: Piano tiêu chuẩn có 88 phím, gồm phím trắng và phím đen.
    loai: so-lieu
    nguon:
      - mt21c-pitch
      - lt-wilson
      - omt-aspn
    ket_qua: dung
    ghi_chu: 'MT21C 1.1 Pitch: "On the piano there are 88 notes.". LibreTexts Wilson và Royston 4.2: "On the piano keyboard, there are a total of 88 keys.". OMT ASPN: "It also contains a small part of both octaves 0 and 8." (khớp khoảng A0–C8).'
  - id: n23
    cau: Phím đen xếp theo nhóm 2 phím và 3 phím xen kẽ, giúp bạn định vị.
    loai: dinh-nghia
    nguon:
      - omt-keyboard
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Keyboard and Grand Staff: "the sets of three and two black keys alternate throughout the entire length of a piano keyboard, repeating the pattern for each octave". OMT Half Steps: "Having the black keys grouped into sets of either two or three makes it easier for a keyboardist to see and feel them more quickly."'
  - id: n24
    cau: Nốt Đô là phím trắng ngay bên trái nhóm 2 phím đen.
    loai: dinh-nghia
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'OMT Keyboard and Grand Staff: "On the piano keyboard, when the black keys appear as a set of two, the note to their immediate left is C."'
  - id: n25
    cau: Nốt Fa là phím trắng ngay bên trái nhóm 3 phím đen.
    loai: dinh-nghia
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'OMT Keyboard and Grand Staff: "With a set of three black keys, the note to their immediate left is F."'
  - id: n26
    cau: Các phím trắng lần lượt là Đô Rê Mi Fa Sol La Si, rồi lặp lại.
    loai: dinh-nghia
    nguon:
      - omt-keyboard
      - omt-clefs
    ket_qua: dung
    ghi_chu: 'OMT Keyboard and Grand Staff: "Example 4 shows a piano keyboard with the letter names of the white key pitches labeled. The same letter names appear on different keys of the keyboard." Các tên A–G lặp theo vòng (OMT Reading Clefs); bắt đầu đếm từ Đô là cách trình bày của trang, tiện vì Đô nằm sát nhóm 2 phím đen (n24).'
  - id: n27
    cau: Phím đen dùng cho các nốt có dấu thăng hoặc giáng.
    loai: dinh-nghia
    nguon:
      - omt-steps
    ket_qua: dung
    ghi_chu: 'OMT Half Steps: "Black keys that are a half step above a white key take the name of the white key and add the word “sharp.”" OMT Half Steps: "Black keys that are a half step below a white key take the name of the white key and add the word “flat.”"'
  - id: n28
