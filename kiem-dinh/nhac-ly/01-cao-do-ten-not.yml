ghi_chu: 'Bài nhạc lý 1 (cao độ, tên nốt, quãng tám, bàn phím). Nguồn chính: Open Music Theory (OMT), mở từng chương bằng curl ngày 24/10/2026 (WebFetch trả 403); bổ sung MT21C (Puget Sound), giáo trình mở Yet Another Guide to Music Theory (University of Queensland), Dolmetsch Online bài 1, mục lục tiêu chuẩn ISO 16:1975 (qua ASN vì iso.org trả 403), UNSW Music Acoustics, LibreTexts. Sửa chữ ở lượt 1: n1 ("Mỗi âm thanh có một cao độ" thành "Mỗi nốt nhạc có một cao độ", cả đoạn mở đầu lẫn mô tả trang, vì âm không có cao độ xác định như tiếng gõ không phải "nốt"), n4 (thêm "thường": một số dàn nhạc lên dây cao hơn 440 Hz), n9 (bỏ "và trên phần mềm" và lý do "phần lớn tài liệu tốt bằng tiếng Anh", vì không kiểm được); mục ## Nguồn cuối trang (thay link chung bằng link từng chương đã dùng, bỏ musictheory.net vì chưa đối chiếu nội dung). Không tính là nhận định: tiêu đề mục; câu hỏi của phần Bài tập (chỉ tính câu trả lời trong khối thu gọn); tên người học. Thuật ngữ tiếng Việt chưa có trong src/data/thuat-ngu.yml, ghi cho D3-L5: "quãng tám" (octave), "ký hiệu khoa học" (scientific / American standard pitch notation, ASPN), "solfège" cố định (fixed do), "Đô giữa". Giáo trình tiếng Việt novaspro.vn (bậc 3, không ghi tác giả) có "quãng tám" nhưng không có "ký hiệu khoa học" hay "Đô giữa": sách đó đặt tên quãng tám theo cách khác (quãng tám cực trầm, trầm, lớn, nhỏ, quãng tám 1, 2, 3…, nốt Đô ở quãng tám 1 ghi c1, tức Đô giữa; ví dụ "từ Do1 đến Mi2"), còn C4 của trang là cách ghi của OMT. Đề xuất D3-L5: thêm một câu cho người học sẽ gặp "quãng tám 1" trong sách tiếng Việt. Chỗ còn yếu: n8 (Việt Nam gọi tên nốt là Đô, Rê, Mi) mới có nguồn tiếng Việt bậc 3; cần lượt 2 tìm nguồn bậc 2 (sách giáo khoa Âm nhạc, giáo trình nhạc viện).'
