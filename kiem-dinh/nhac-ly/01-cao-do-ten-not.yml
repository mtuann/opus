    ghi_chu: 'Chỉ thị ::cong-cu{ten="piano" range="C3-C5" notes="C3 C4 C5"}. Thành phần banPhim/docThongSoBanPhim (src/plugins/thanh-phan.mjs) tô đúng các nốt trong notes (phải nằm trong range); bản build lúc kiểm (dist/nhac-ly/01-cao-do-ten-not/index.html, 24/10/2026) có đúng ba phím class "oz-phim-trang to": data-m 48 "Đô (C3)", 60 "Đô (C4)", 72 "Đô (C5)", cả bàn phím có 25 phím từ C3 đến C5; dòng "Bấm vào phím để nghe và xem tên nốt." và nút "Nghe các nốt được tô"; phần bấm được do src/scripts/ban-phim.js. C3, C4, C5 cùng là nốt Đô (cùng tên chữ C, cách nhau quãng tám). Review nên bấm thử ở bản chạy.'
  - id: n30
    cau: Đô giữa (C4) là phím trắng ngay bên trái nhóm hai phím đen gần giữa bàn phím.
    loai: dinh-nghia
    nguon:
