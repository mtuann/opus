    ghi_chu: 'Trang đích chưa chuyển, kiểm trên bản cũ: ../opus-zero/docs/luyen-tai/nghe-quang.md có "## Luyện với công cụ" (id luyen-voi-cong-cu theo luật id cũ) và dòng "Khởi động (3 trưởng, 5 đúng, 8 đúng)"; assets/js/interval-trainer.js dòng 22 có tùy chọn "Khởi động: 3 trưởng, 5 đúng, 8 đúng" (SETS.start). Quãng 8 đúng = quãng tám.'
  - id: n40
    cau: 'Câu hỏi: "Nốt Sol trong hệ chữ cái là gì?" Đáp án đúng "G"; "F" và "A" sai; giải thích "Bắt đầu từ La = A: La A, Si B, Đô C, Rê D, Mi E, Fa F, Sol G." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-major
      - dol1
    ket_qua: dung
    ghi_chu: Sol = G (n7). F là Fa, A là La nên hai lựa chọn sai thật sự sai. Giải thích khớp n11.
  - id: n41
    cau: 'Câu hỏi: "Đô giữa trên piano được ký hiệu là gì?" Đáp án đúng "C4"; "C3", "C5" sai; giải thích "Middle C là C4." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-aspn
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'OMT ASPN: "Middle C is C4 in ASPN." C3 và C5 là hai nốt Đô cách C4 một quãng tám dưới và trên: sai.'
  - id: n42
    cau: 'Câu hỏi: "Trên piano, nốt Đô nằm ở đâu?" Đáp án đúng "Ngay bên trái nhóm 2 phím đen"; "Ngay bên trái nhóm 3 phím đen" và "Ngay bên phải nhóm 2 phím đen" sai; giải thích "Bên trái nhóm 3 phím đen là nốt Fa." đúng.'
    loai: dinh-nghia
    nguon:
      - omt-keyboard
    ket_qua: dung
    ghi_chu: 'Đô: n24. Bên trái nhóm 3 phím đen là Fa (n25) nên giải thích đúng. Phím trắng ngay bên phải nhóm 2 phím đen là Mi (thứ tự C, D kẹp giữa hai phím đen, rồi E; xem bảng "Cách tìm" ở ../opus-zero/docs/piano/ban-do-ban-phim.md: "Mi (E): ngay bên phải nhóm 2"): lựa chọn đó sai.'
  - id: n43
    cau: 'Câu hỏi: "Hai nốt cách nhau một quãng tám thì có đặc điểm gì?" Đáp án đúng "Cùng tên, tần số nốt trên gấp đôi nốt dưới"; "Khác tên, tần số bằng nhau" và "Cùng tên, tần số nốt trên gấp ba nốt dưới" sai; giải thích "Ví dụ La4 = 440 Hz, La5 = 880 Hz." đúng.'
    loai: quy-tac
    nguon:
      - omt-keyboard
      - uq-pitch
    ket_qua: dung
    ghi_chu: 'Đáp án đúng: n15, n16. UQ, Pitch: "the fundamental frequency of this new “A” is 880Hz—exactly twice that of the earlier “A.”" Hai lựa chọn sai trái n15/n16 (khác tên; gấp ba).'
khuong_nhac:
  - khoi: 1
    loai: vi-du-soan
    kiem:
      - cu-phap
      - not
      - nhip
      - giong
    ket_qua: dung
    ghi_chu: "Gam Đô trưởng đi lên. abcjs đọc ra C4 D4 E4 F4 | G4 A4 B4 C5, nốt đen (L:1/4), M:4/4 nên hai ô đủ 4 phách, K:C không dấu hóa, Q:1/4=90. Minh họa đúng điều trang nói: gam Đô trưởng đi lên từ Đô đến Đô (n12, n13); nốt thứ tám (C5) cùng tên với nốt đầu (C4), cách một quãng tám (n14, n15). abcjs không cảnh báo."
doi_chu:
  - cu: "Mỗi âm thanh có một cao độ: âm cao hay thấp. Về mặt vật lý, cao độ phụ thuộc vào tần số dao động. Dây đàn rung càng nhanh, âm càng cao. Ví dụ, nốt La dùng để lên dây cho dàn nhạc dao động 440 lần mỗi giây (440 Hz)."
    moi: "Mỗi nốt nhạc có một cao độ: âm cao hay thấp. Về mặt vật lý, cao độ phụ thuộc vào tần số dao động. Dây đàn rung càng nhanh, âm càng cao. Ví dụ, nốt La dùng để lên dây cho dàn nhạc thường dao động 440 lần mỗi giây (440 Hz)."
    ly_do: 'n1 (da-sua): không phải âm thanh nào cũng có cao độ xác định (tiếng gõ, tiếng ồn; OMT Reading Clefs nói tới nhạc cụ gõ "with indefinite pitch"); nốt nhạc thì có. n4 (da-sua): thêm "thường": La4 = 440 Hz là cao độ chuẩn để lên dây (ISO 16:1975; University of Queensland, Yet Another Guide to Music Theory, Pitch), nhưng không phải dàn nhạc nào cũng lên dây đúng 440 Hz.'
  - cu: Ở Việt Nam, Pháp, Ý… người ta gọi tên nốt là Đô, Rê, Mi. Trong tài liệu tiếng Anh và trên phần mềm, tên nốt viết bằng chữ cái. Bạn nên thuộc cả hai, vì phần lớn tài liệu tốt bằng tiếng Anh.
    moi: Ở Việt Nam, Pháp, Ý… người ta gọi tên nốt là Đô, Rê, Mi. Trong tài liệu tiếng Anh, tên nốt viết bằng chữ cái. Bạn nên thuộc cả hai, vì bạn sẽ gặp cả hai khi đọc tài liệu.
    ly_do: 'n9 (da-sua): "trên phần mềm" và "phần lớn tài liệu tốt bằng tiếng Anh" không kiểm được; giữ phần đúng: tài liệu tiếng Anh gọi nốt bằng chữ cái (OMT Reading Clefs; MT21C 1.2).'
  - cu: Open Music Theory; musictheory.net.
    moi:
      - "Open Music Theory: Reading Clefs; The Keyboard and the Grand Staff; Half Steps, Whole Steps, and Accidentals; American Standard Pitch Notation (ASPN); Major Scales, Scale Degrees, and Key Signatures (solfège cố định)."
      - "Robert Hutchinson, Music Theory for the 21st-Century Classroom: 1.1 Pitch và 1.3 Octave Registers; University of Queensland, Yet Another Guide to Music Theory: Pitch; Dolmetsch Online, Music Theory Online, bài 1 (tên nốt ở các nước dùng tiếng Romance, ký hiệu khoa học, La4 = 440 Hz); ISO 16:1975, Acoustics — Standard tuning frequency (Standard musical pitch)."
    ly_do: "Mục Nguồn: thay link chung tới Open Music Theory bằng link tới đúng các chương đã đọc khi kiểm định (lượt 1), thêm giáo trình mở và bản nhạc đã dùng; bỏ musictheory.net vì bài giảng của site ấy chạy bằng JavaScript, không đọc được chữ để kiểm."
  - cu: "mô tả: Mỗi âm thanh có một cao độ: âm cao hay thấp. Về mặt vật lý, cao độ phụ thuộc vào tần số dao động. Dây đàn rung càng nhanh, âm càng cao. Ví dụ, nốt La dùng để…"
    moi: "mô tả: Mỗi nốt nhạc có một cao độ: âm cao hay thấp. Về mặt vật lý, cao độ phụ thuộc vào tần số dao động. Dây đàn rung càng nhanh, âm càng cao. Ví dụ, nốt La dùng để…"
    ly_do: Mô tả trang là đoạn mở đầu cắt ngắn (cách site cũ làm), sửa theo n1.
