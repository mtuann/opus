    ghi_chu: 'Ghép n19 (C4 là Đô giữa, gần giữa bàn phím) và n24 (Đô ở ngay bên trái nhóm 2 phím đen). OMT Keyboard and Grand Staff: "middle C is the note that appears to be around the middle of a piano keyboard"'
  - id: n31
