    ghi_chu: 'Soạn cho trang, chủ đề K. 265 giản lược. 2/4, L:1/4, K:C, Q:1/4=96: C C | G G | A A | G2 | F F | E E | D D | C2, 8 ô, mỗi ô đủ 2 phách; khớp phần giai điệu của chủ đề (Mutopia, ấn bản Porro). Mutopia ở ô 4 và 7 có trang trí khác khối này, nên nhãn trang ghi "giản lược". Không có bè trái, hợp âm, ngón.'
ghi_chu: "Lượt 1 (D5-L2 phần A). Trang bien-tau: 39 nhận định cộng 3 câu quiz, 1 khối abc. Chưa chắc: n5, n19 (chú thích hình nhắc Adagio), n31, n32; Adagio/Allegro của biến tấu 11 và 12 chưa có nguồn mở. Thuật ngữ chưa có trong thuat-ngu.yml: chủ đề, biến tấu, passacaglia, chaconne, canon, giọng thứ cùng tên."
doi_chu:
  - cu: "Ý tưởng đơn giản nhất mà cũng phong phú nhất: lấy một chủ đề (thường ngắn và quen thuộc), rồi nhắc lại nhiều lần, mỗi lần thay đổi một vài yếu tố. Sơ đồ: A – A' – A'' – A''' …"
    moi: "Ý tưởng của hình thức này: lấy một chủ đề (một giai điệu quen thuộc, hay một chủ đề do chính nhà soạn nhạc viết), rồi nhắc lại nhiều lần, mỗi lần thay đổi một vài yếu tố. Sơ đồ: A – A' – A'' – A''' …"
