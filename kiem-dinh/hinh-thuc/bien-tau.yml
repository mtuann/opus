    moi:
      - Đổi cách đệm; viết theo lối đối âm
      - "Một số bộ biến tấu không giữ giai điệu mà giữ vòng hợp âm hoặc bè trầm lặp lại: đó là passacaglia và chaconne. Ví dụ: Bach Chaconne cho violin độc tấu, Bach Passacaglia và Fugue cung Đô thứ cho organ, chương 4 Giao hưởng số 4 của Brahms."
