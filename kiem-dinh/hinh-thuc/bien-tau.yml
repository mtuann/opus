nhan_dinh:
  - id: n1
    cau: "Chủ đề và biến tấu: lấy một chủ đề (giai điệu quen thuộc hay do chính nhà soạn nhạc viết), nhắc lại nhiều lần, mỗi lần thay đổi một vài yếu tố; sơ đồ A – A' – A'' – A'''."
    loai: dinh-nghia
    nguon:
      - libre-tv
      - brit-form
      - ency-variation
    ket_qua: da-sua
    ghi_chu: 'Trang cũ: "Ý tưởng đơn giản nhất mà cũng phong phú nhất" (xếp hạng, không nguồn), "thường ngắn và quen thuộc".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/musical-form/Formal-types" ]
    luot_2_ghi_chu: "Biến tấu: chủ đề nhắc lại với thay đổi; Britannica gọi là \"variation (theme and variation) form\". Ký hiệu A–A'–A''… là quy ước minh họa."
  - id: n2
    cau: "Biến đổi giai điệu: thêm nốt hoa mỹ, nốt lướt, chuỗi nốt nhanh quanh giai điệu gốc."
    loai: dinh-nghia
    nguon:
      - libre-tv
      - ency-variation
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/musical-form/Formal-types", "https://www.britannica.com/print/article/1941980" ]
    luot_2_ghi_chu: Kỹ thuật biến tấu giai điệu/trang trí là chuẩn; không nguồn nào mở nêu từng chữ, là mô tả chung hợp lý.
  - id: n3
    cau: "Biến đổi tiết tấu: chia nhỏ thành móc đơn, liên ba, móc kép; đổi nhịp 2/4 thành 3/4."
    loai: dinh-nghia
    nguon:
      - libre-tv
      - mutopia-265
    ket_qua: dung
    ghi_chu: K. 265 đổi từ 2/4 (chủ đề) sang 3/4 ở biến tấu 12 (Mutopia).
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/musical-form/Formal-types", "https://musicintheround.co.uk/?p=4460" ]
    luot_2_ghi_chu: Chia nhỏ tiết tấu là kỹ thuật chuẩn; K. 265 biến tấu 12 chuyển sang nhịp ba (3/4).
  - id: n4
    cau: "Biến đổi giọng: chuyển sang giọng thứ cùng tên, như biến tấu 8 của K. 265."
    loai: dinh-nghia
    nguon:
      - libre-tv
      - mutopia-265
    ket_qua: da-sua
    ghi_chu: 'Trang cũ: "biến tấu thứ thường là điểm nhấn cảm xúc" (không nguồn). Giọng thứ cùng tên = parallel minor (chưa có trong thuat-ngu.yml).'
    luot_2: dung
    luot_2_nguon: [ "https://musicintheround.co.uk/?p=4460", "https://research.allclassical.org/composer/mozart-wolfgang-amadeus/12-variations-on-ah-vous-dirai-je-maman-k-265/" ]
    luot_2_ghi_chu: Biến tấu 8 của K. 265 chuyển sang giọng thứ (Đô thứ).
  - id: n5
    cau: "Biến đổi tốc độ: một biến tấu chậm (Adagio), như biến tấu 11 của K. 265."
    loai: dinh-nghia
    nguon:
      - libre-tv
    ket_qua: null
    ghi_chu: 'chưa chắc: Adagio ở biến tấu 11 chưa có nguồn tầng 1/2 nêu (xem n31). Trang cũ: "đầy trữ tình, thường đặt gần cuối" (bỏ, không nguồn). Trang ung-tac đã khóa bỏ các nhãn Adagio/Allegro; lô chủ phải quyết.'
    luot_2: dung
    luot_2_nguon: [ "https://musicintheround.co.uk/?p=4460", "https://imslp.org/wiki/12_Variations_on_'Ah,_vous_dirai-je_maman',_K.265/300e_(Mozart,_Wolfgang_Amadeus)" ]
    luot_2_ghi_chu: Biến tấu 11 của K. 265 là Adagio (musicintheround).
