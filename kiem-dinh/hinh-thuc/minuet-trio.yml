    moi: "mô tả: Minuet là điệu múa Pháp (menuet) đi vào nhạc cổ điển: nhịp ba, tốc độ vừa phải, bước nhảy thanh lịch. Trong giao hưởng thời Cổ điển, nó thường là chương 3…"
