doi_chu:
  - cu: "Minuet là vũ khúc quý tộc Pháp (menuet) đi vào nhạc cổ điển: nhịp 3/4, tốc độ vừa phải, bước nhảy thanh lịch. Trong giao hưởng thời Cổ điển, nó hầu như luôn là chương 3 — khoảng nghỉ duyên dáng giữa chương chậm và chương cuối nhanh."
    moi: "Minuet là điệu múa Pháp, vốn là điệu dân gian rồi thành điệu cung đình thế kỷ 17, đi vào nhạc cổ điển: nhịp ba (thường 3/4), tốc độ vừa phải, bước nhảy thanh lịch. Trong giao hưởng thời Cổ điển, nó thường là chương 3, đứng giữa chương chậm và chương cuối."
    ly_do: 'm1, m3 (da-sua): mô tả đầu trang viết lại theo COD và Britannica.; m1, m2, m3, m4 (da-sua): điệu dân gian rồi cung đình (COD, Britannica); nhịp ba; "thường" thay "hầu như luôn"; bỏ "khoảng nghỉ duyên dáng".'
  - cu: 'Tương phản: mỏng hơn (ít nhạc cụ hơn), thường chuyển giọng (giọng át, giọng cùng tên). Tên "trio" (bộ ba) có từ thời Baroque, khi đoạn này thường chỉ do ba nhạc cụ chơi.'
    moi: Tương phản, thường dịu hơn minuet; thường đổi giọng, hoặc đổi trưởng – thứ trên cùng chủ âm. Tên "trio" (bộ ba) có từ thời Baroque, khi đoạn này thường viết cho ba nhạc cụ hay ba bè.
    ly_do: 'm7, m8, m9 (da-sua, da-bo): bỏ "mỏng hơn (ít nhạc cụ hơn)" và "giọng át" (không nguồn bậc 1–2); tên trio: ba nhạc cụ hay ba bè (Britannica, BBC, COD).'
  - cu: "Toàn bộ chương vì vậy có dạng ABA — một trong những hình thức 3 phần rõ ràng nhất để tai nhận ra. Bên trong, mỗi khối minuet và trio lại là một hình thức hai đoạn có tái hiện ‖: a :‖ ‖: b a' :‖, được giải thích ở bài nhạc lý 31."
    moi: "Toàn bộ chương vì vậy có dạng ABA, một hình thức ba đoạn \"kép\". Bên trong, mỗi khối minuet và trio thường lại là một hình thức hai đoạn có tái hiện ‖: a :‖ ‖: b a' :‖, được giải thích ở bài nhạc lý 31."
    ly_do: 'm11, m12 (da-sua): bỏ nhận xét "rõ ràng nhất để tai nhận ra"; thêm "thường" (OMT).'
  - cu: Giai điệu khỏe khoắn, dứt khoát; cả dàn dây
    moi: Giai điệu chính, do dàn dây chơi
    ly_do: "m17 (da-sua): bỏ các tính từ về giai điệu minuet và trio (không nguồn); IMSLP, LPO."
  - cu: Mỏng, nhẹ nhàng, thanh thoát — tương phản rõ rệt
    moi: Đổi giọng; giai điệu trên nền đệm đơn giản, tương phản với minuet
    ly_do: "m17 (da-sua): bỏ tính từ mô tả trio không nguồn; trio đổi giọng, tương phản với minuet (COD)."
  - cu: "Nghe thử và đếm: bạn có nhận ra lúc Trio bắt đầu (nhạc mỏng đi, giọng đổi) và lúc Minuet quay lại không?"
    moi: "Nghe thử và đếm: bạn có nhận ra lúc Trio bắt đầu (giọng đổi, nhạc nhẹ đi) và lúc Minuet quay lại không?"
    ly_do: 'm18 (da-sua): "nhạc mỏng đi" thành "nhạc nhẹ đi".'
  - cu: 'Beethoven thấy minuet quá "lịch sự" và thay nó bằng scherzo ("trò đùa"): vẫn 3 phần ABA, vẫn nhịp 3, nhưng nhanh hơn nhiều và đầy bất ngờ. Từ Giao hưởng số 2 trở đi, scherzo thay thế minuet trong hầu hết giao hưởng của ông — và của cả thế kỷ 19.'
    moi: 'Từ Beethoven, minuet thường được thay bằng scherzo ("trò đùa"): vẫn 3 phần ABA, vẫn nhịp 3, nhưng nhanh hơn nhiều và nhiều bất ngờ. Giao hưởng số 2 của Beethoven (viết 1800–1802) là bản đầu tiên ghi Scherzo ở chương 3; ông viết scherzo cho gần hết chín giao hưởng, và sang thế kỷ 19 scherzo thay minuet trong nhiều giao hưởng.'
    ly_do: 'm19, m20 (da-sua): bỏ động cơ của Beethoven; Giao hưởng số 2 theo IMSLP, "gần hết chín giao hưởng" theo Britannica.'
  - cu: Minuet giọng Sol thứ — hiếm và u ám
    moi: "Minuet trong giao hưởng giọng Sol thứ: nghe giọng thứ đổi tính cách minuet thế nào"
    ly_do: 'm23, m24 (da-sua, da-bo): bỏ "hiếm và u ám" (không nguồn).'
  - cu:
      - "Open Music Theory, bản 1 (Robin Wharton, Kris Shaffer biên tập), mục Minuet Form trên LibreTexts: minuet – trio – minuet da capo, lần chơi lại thường bỏ các dấu nhắc lại; minuet và trio thường đều là hai đoạn có tái hiện; trio tương phản về giọng, nhiều khi chỉ đổi trưởng – thứ trên cùng chủ âm (giọng cùng tên)."
      - "Open Music Theory, chương Ternary Form (Brian Jarvis): minuet và trio là hình thức ba đoạn kép, mỗi khối thường là hai đoạn có tái hiện."
      - 'Wikipedia: Minuet (điệu nhảy gốc Pháp, thường nhịp 3/4; tên "trio" có từ thời Lully, khi đoạn giữa thường viết cho ba nhạc cụ; minuet và trio thành chương 3 chuẩn của giao hưởng Cổ điển), Trio (music), Ternary form (đoạn giữa thường ở giọng át hoặc giọng cùng tên; minuet chơi lại thì không nhắc lại), Scherzo (scherzo giữ nhịp 3 và khung ba đoạn của minuet nhưng nhanh hơn nhiều; Beethoven biến nhịp điệu lịch sự của minuet thành một điệu nhảy dữ dội hơn; scherzo là chương chuẩn của giao hưởng suốt thế kỷ 19).'
      - 'Stephen Johnson, "What is a trio in music?", BBC Music Magazine (2016): trong các buổi giải trí cung đình Baroque ở Pháp, minuet cho dàn dây được nối bằng một điệu nhảy nhẹ hơn cho ba nhạc cụ hơi, gọi là "trio".'
      - "Các tác phẩm, Wikipedia: Eine kleine Nachtmusik (chương 3: minuet Sol trưởng, trio Rê trưởng, rồi minuet chơi lại da capo), Giao hưởng số 94 của Haydn (Menuetto: Allegro molto, tốc độ đánh dấu bước chuyển từ minuet sang scherzo), Giao hưởng số 40 của Mozart (cùng số 25 là hai giao hưởng giọng thứ duy nhất của Mozart; trio Sol trưởng), Giao hưởng số 5 của Beethoven (Beethoven dùng scherzo làm chương 3 từ Giao hưởng số 2, trừ số 8)."
      - "Bản nhạc: Eine kleine Nachtmusik theo ấn bản Breitkopf & Härtel (1883), bản dàn trang công cộng của Mutopia Project (trio đổi hóa biểu sang Rê trưởng); tên chương trên IMSLP: Haydn, Hob. I:94, Mozart, K. 550."
    moi:
      - "Open Music Theory, chương Ternary Form: minuet và trio là hình thức ba đoạn kép, các khối thường là hai đoạn có tái hiện; và bản 1 của sách, mục Minuet Form trên LibreTexts: minuet – trio – minuet da capo, thường chơi không nhắc lại; trio thường tương phản, nhiều khi chỉ đổi trưởng – thứ."
      - Concise Oxford Dictionary of Music, mục Minuet (điệu nhịp ba, gốc điệu dân gian Pháp, thành chương 3 chuẩn của giao hưởng, từ Beethoven bị scherzo thay thế) và Trio (đoạn giữa dịu hơn; tên có vì xưa viết ba bè).
      - 'Encyclopaedia Britannica, mục Minuet: điệu múa cung đình Pháp và Anh khoảng 1650–1750, nhịp ba vừa phải; trio gốc viết cho ba nhạc cụ. BBC Music Magazine, "What is a trio in music?" (Stephen Johnson): ở triều đình Pháp thời Baroque, minuet dây được nối bằng điệu nhẹ hơn cho ba nhạc cụ hơi, gọi là "trio".'
      - "Tên chương trên IMSLP: Mozart, Eine kleine Nachtmusik K. 525 (1787), Haydn, Hob. I:94, Mozart, K. 550, Beethoven, giao hưởng số 1 và số 2. Bản nhạc: Eine kleine Nachtmusik theo ấn bản Breitkopf & Härtel (1883), bản dàn trang của Mutopia Project."
    ly_do: "m27 (da-sua, mục Nguồn): thay bằng nguồn đã mở; bỏ các dòng Wikipedia."
