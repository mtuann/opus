nhan_dinh:
  - id: m1
    cau: Minuet là điệu múa Pháp, vốn là điệu dân gian rồi thành điệu cung đình thế kỷ 17.
    loai: dinh-nghia
    nguon:
      - cod-minuet
      - brit-minuet
    ket_qua: da-sua
    ghi_chu: 'Cũ: "vũ khúc quý tộc Pháp". COD: "orig. Fr. rustic dance", sau được triều đình thế kỷ 17 nhận; Britannica: điệu cặp thanh lịch của phòng khiêu vũ quý tộc Pháp và Anh khoảng 1650–1750, gốc từ branle de Poitou. Mô tả đầu trang sửa theo.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/minuet", "https://www.britannica.com/art/minuet" ]
    luot_2_ghi_chu: "Encyclopedia.com: điệu dân dã Pháp, triều đình nhận thế kỷ 17; Britannica: từ khoảng 1650."
  - id: m2
    cau: Minuet có nhịp ba (thường 3/4), tốc độ vừa phải, bước nhảy thanh lịch.
    loai: dinh-nghia
    nguon:
      - brit-minuet
      - cod-minuet
    ket_qua: da-sua
    ghi_chu: 'Cũ: "nhịp 3/4". Britannica: "moderate triple time", như 3/4 hay 3/8; COD: nhịp ba, bước nhỏ tinh tế.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/minuet" ]
    luot_2_ghi_chu: "Britannica: nhịp ba vừa phải, thường 3/4 hoặc 3/8; duyên dáng."
  - id: m3
    cau: Trong giao hưởng thời Cổ điển, minuet thường là chương 3.
    loai: lich-su
    nguon:
      - cod-minuet
      - brit-minuet
    ket_qua: da-sua
    ghi_chu: 'Cũ: "hầu như luôn là chương 3". COD: "becoming the standard 3rd movt."; Britannica: "typically" chương 3. "Hầu như luôn" quá mạnh (không nguồn nói không có ngoại lệ), sửa "thường".'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/minuet", "https://www.britannica.com/art/symphony-music", "https://www.britannica.com/art/minuet" ]
    luot_2_ghi_chu: Minuet là chương ba chuẩn của giao hưởng cổ điển.
  - id: m4
    cau: Minuet đứng giữa chương chậm và chương cuối (trong các giao hưởng ví dụ).
    loai: cau-truc
    nguon:
      - imslp-ekn
      - imslp-h94
      - imslp-m40
    ket_qua: da-sua
    ghi_chu: 'Cũ: "khoảng nghỉ duyên dáng giữa chương chậm và chương cuối nhanh". IMSLP: Eine kleine Nachtmusik Romanze (Andante) → Menuetto → Rondo (Allegro); Haydn 94: Andante → Minuet → Allegro di molto; Mozart 40: Andante → Menuetto → Allegro assai. "Khoảng nghỉ duyên dáng" bỏ (nhận xét).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/symphony-music" ]
    luot_2_ghi_chu: "Giao hưởng cổ điển: sonata, chậm, minuet và trio, chung cuộc."
  - id: m5
    cau: "Bảng: minuet (A) có giai điệu chính, nhịp 3/4, thường có hai đoạn nhỏ nhắc lại."
    loai: cau-truc
    nguon:
      - lt-minuet
      - omt-ternary
    ket_qua: dung
    ghi_chu: 'LibreTexts (OMT 1e): minuet là hình thức hai đoạn có tái hiện, hai đoạn đều nhắc lại ("two repeated sections"); OMT (Ternary): các khối thường là hai đoạn có tái hiện.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_1e_(Wharton_and_Shaffer_Eds)/05:_Form_(II)_-_Other_Forms_and_Thematic_Structures/5.12:_Other_Formal_Structures_in_the_Classical_Style_-_Minuet_Form", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/04:_Form/4.03:_Ternary_and_Rondo_Forms" ]
    luot_2_ghi_chu: Minuet chính thường là rounded binary, hai đoạn nhắc lại.
  - id: m6
    cau: "Bảng: trio (B) tương phản, thường dịu hơn minuet."
    loai: cau-truc
    nguon:
      - cod-trio
      - lt-minuet
    ket_qua: dung
    ghi_chu: 'COD: trio "usually in gentler contrast to the first section"; LibreTexts: nhiệm vụ chính của trio là tương phản.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Trio tương phản: đúng. "Thường dịu hơn": không nguồn mở nêu chung.'
  - id: m7
    cau: "Bảng: trio thường đổi giọng, hoặc đổi trưởng – thứ trên cùng chủ âm."
    loai: cau-truc
    nguon:
      - omt-ternary
      - lt-minuet
      - brit-ternary
    ket_qua: da-sua
    ghi_chu: 'Cũ: "thường chuyển giọng (giọng át, giọng cùng tên)". Britannica (ternary): trio tương phản, thường ở giọng khác; LibreTexts: nhiều khi tương phản về điệu thức, như minuet trưởng với trio "minore". Không nguồn bậc 1–2 mở được nói riêng "giọng át", bỏ chữ ấy (ví dụ Eine kleine dùng Rê trưởng, m16).'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_1e_(Wharton_and_Shaffer_Eds)/05:_Form_(II)_-_Other_Forms_and_Thematic_Structures/5.12:_Other_Formal_Structures_in_the_Classical_Style_-_Minuet_Form", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/04:_Form/4.03:_Ternary_and_Rondo_Forms" ]
    luot_2_ghi_chu: "OMT 1e: trio thường tương phản giọng, hay cùng chủ âm khác thức (minore/maggiore); Mount: trio ở giọng hạ át hay thứ."
  - id: m8
    cau: Tên "trio" (bộ ba) có từ thời Baroque, khi đoạn này thường viết cho ba nhạc cụ hay ba bè.
    loai: lich-su
    nguon:
      - brit-minuet
      - bbc-trio
      - cod-trio
    ket_qua: da-sua
    ghi_chu: 'Cũ: "…khi đoạn này thường chỉ do ba nhạc cụ chơi". Hai nguồn bậc 2 khác nhau: Britannica và BBC: gốc viết cho ba nhạc cụ (BBC: ba nhạc cụ hơi, triều đình Pháp thời Baroque); COD (trio): "formerly it was written in 3-part harmony, as for a trio" (ba bè). Viết chung "ba nhạc cụ hay ba bè", ghi cả hai (chuẩn mục 2).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/minuet", "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/minuet" ]
    luot_2_ghi_chu: 'Britannica: trio ban đầu viết cho ba nhạc cụ; Encyclopedia.com: nhà soạn Pháp viết ba bè hay giảm còn ba người. "Thời Baroque" suy từ gốc Pháp thế kỷ 17.'
  - id: m9
    cau: 'Cũ: "Trio mỏng hơn (ít nhạc cụ hơn)".'
    loai: cau-truc
    ket_qua: da-bo
    ghi_chu: 'Bỏ: không nguồn bậc 1–2 nói trio thời Cổ điển ít nhạc cụ hơn (COD chỉ nói "gentler"); trong Eine kleine, trio vẫn do cả dàn dây chơi (IMSLP: 2 violin, viola, cello, contrabass). Hồ sơ bài 31 (n35) đã báo chỗ này.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.britannica.com/art/minuet", "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/minuet" ]
    luot_2_ghi_chu: Tên "trio" gốc là ba nhạc cụ/ba bè, nhưng không nguồn nói trio giao hưởng cổ điển "mỏng hơn"; nhiều trio dùng cả dàn. Câu cũ, không xác nhận được như phát biểu chung.
  - id: m10
    cau: "Bảng: minuet da capo là chơi lại minuet từ đầu, thường không nhắc lại các đoạn nhỏ."
    loai: cau-truc
    nguon:
      - lt-minuet
      - brit-ternary
    ket_qua: dung
    ghi_chu: 'LibreTexts: return "marked da capo", "usually performed without taking the repeats"; Britannica: da capo "from the head".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_1e_(Wharton_and_Shaffer_Eds)/05:_Form_(II)_-_Other_Forms_and_Thematic_Structures/5.12:_Other_Formal_Structures_in_the_Classical_Style_-_Minuet_Form", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/04:_Form/4.03:_Ternary_and_Rondo_Forms" ]
    luot_2_ghi_chu: "OMT 1e, Mount: da capo thường không nhắc lại."
  - id: m11
    cau: Toàn bộ chương có dạng ABA, một hình thức ba đoạn "kép".
    loai: cau-truc
    nguon:
      - omt-ternary
      - brit-ternary
    ket_qua: da-sua
    ghi_chu: 'Cũ: "ABA — một trong những hình thức 3 phần rõ ràng nhất để tai nhận ra" (nhận xét, bỏ). OMT: minuet và trio là hình thức ba đoạn kép (compound ternary): "all sections contain complete forms".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/04:_Form/4.03:_Ternary_and_Rondo_Forms", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_1e_(Wharton_and_Shaffer_Eds)/05:_Form_(II)_-_Other_Forms_and_Thematic_Structures/5.12:_Other_Formal_Structures_in_the_Classical_Style_-_Minuet_Form" ]
    luot_2_ghi_chu: "Mount: compound ternary; OMT 1e: minuet-trio-minuet da capo."
  - id: m12
    cau: "Mỗi khối minuet và trio thường lại là một hình thức hai đoạn có tái hiện: ‖: a :‖ ‖: b a' :‖."
    loai: cau-truc
    nguon:
      - omt-ternary
      - lt-minuet
    ket_qua: da-sua
    ghi_chu: 'Cũ: "mỗi khối… lại là một" (không "thường"). OMT: "all sections contain complete forms (often rounded binary form)"; LibreTexts: minuet là rounded binary; trio "typically a simple or rounded binary". Khớp bài 31 (đã khóa): trio "hai đoạn, thường có tái hiện".'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_1e_(Wharton_and_Shaffer_Eds)/05:_Form_(II)_-_Other_Forms_and_Thematic_Structures/5.12:_Other_Formal_Structures_in_the_Classical_Style_-_Minuet_Form", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/04:_Form/4.03:_Ternary_and_Rondo_Forms" ]
    luot_2_ghi_chu: "Mỗi khối là rounded binary: hai reprise, reprise 2 gồm B và A'."
  - id: m13
    cau: Link tới bài nhạc lý 31, mục hai đoạn có tái hiện (#hai-oan-co-tai-hien-rounded-binary), "được giải thích ở bài nhạc lý 31".
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: bài 31 (đã khóa) có "## Hai đoạn có tái hiện (rounded binary)", id hai-oan-co-tai-hien-rounded-binary (dist/nhac-ly/31-hinh-thuc-nho/index.html).'
  - id: m14
    cau: "Mozart, Eine kleine Nachtmusik, chương 3: Menuetto (Allegretto) cung Sol trưởng."
    loai: ten
    nguon:
      - imslp-ekn
      - mut-ekn
      - wiki-ekn
    ket_qua: dung
    ghi_chu: 'IMSLP: chương 3 "Menuetto. Allegretto" (bản còn lại 4 chương, chương minuet đầu đã mất; hồ sơ du-lieu/tac-pham/mozart-eine-kleine cũng ghi); serenade Sol trưởng (K. 525, 1787). Wikipedia (bậc 3): minuet ở Sol trưởng. LPO: "Allegretto, quite fast". Chưa đọc trực tiếp bản nhạc để thấy hóa biểu từng chương.'
    luot_2: dung
    luot_2_nguon: [ "https://www.sin80.com/en/work/mozart-eine-kleine-nachtmusik-k525", "https://lpo.org.uk/wp-content/uploads/2022/10/LPO-GCSE-resource-Mozarts-Eine-Kleine-Nachtmusik-Analysis-Questions.pdf" ]
    luot_2_ghi_chu: "K. 525: Menuetto Allegretto, Sol trưởng, chương ba của bản bốn chương."
  - id: m15
    cau: '"đúng tác phẩm trong hướng dẫn nghe" (link /opus/nghe-nhac/mozart-eine-kleine/, hai lần).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển. Đã kiểm ../opus-zero/docs/nghe-nhac/mozart-eine-kleine.md có tồn tại, cùng tác phẩm; hướng dẫn ấy là chương 1 (tiêu đề "chương 1"), dòng 22 nhắc bản có 5 chương, chương minuet thứ hai thất lạc. Điều cần giữ: hướng dẫn nghe Eine kleine Nachtmusik. Cột "Điều cần tìm" của bảng nói về chương 3 nên lô chuyển nên ghi rõ link là hướng dẫn chương 1.'
  - id: m16
    cau: "Bảng: minuet ở Sol trưởng; trio ở Rê trưởng; da capo trở lại Sol trưởng."
    loai: cau-truc
    nguon:
      - wiki-ekn
      - lpo-ekn
      - mut-ekn
    ket_qua: dung
    ghi_chu: "Wikipedia (bậc 3): minuet Sol trưởng, trio Rê trưởng, minuet trở lại đủ (da capo); LPO: có đoạn ở Rê trưởng (ô 16–24) trong tài liệu phân tích. Hồ sơ lượt 1 bài 31 cũ ghi Mutopia: trio đổi hóa biểu sang Rê trưởng; trang Mutopia hiện chỉ cho zip, chưa đọc từng ô. Review nên mở bản nhạc."
    luot_2: dung
    luot_2_nguon: [ "https://lpo.org.uk/wp-content/uploads/2022/10/LPO-GCSE-resource-Mozarts-Eine-Kleine-Nachtmusik-Analysis-Questions.pdf", "https://www.sin80.com/en/work/mozart-eine-kleine-nachtmusik-k525" ]
    luot_2_ghi_chu: Minuet Sol trưởng, trio Rê trưởng (át), da capo về Sol trưởng.
  - id: m17
    cau: "Bảng: minuet do dàn dây chơi giai điệu chính; trio đổi giọng, giai điệu trên nền đệm đơn giản, tương phản với minuet."
    loai: cau-truc
    nguon:
      - imslp-ekn
      - lpo-ekn
    ket_qua: da-sua
    ghi_chu: 'Cũ: minuet "giai điệu khỏe khoắn, dứt khoát; cả dàn dây"; trio "mỏng, nhẹ nhàng, thanh thoát — tương phản rõ rệt". IMSLP: 2 violin, viola, cello, contrabass (dàn dây); LPO: nửa đầu trio "melody and accompaniment", toàn dàn dây. Các tính từ cũ bỏ (không nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://lpo.org.uk/wp-content/uploads/2022/10/LPO-GCSE-resource-Mozarts-Eine-Kleine-Nachtmusik-Analysis-Questions.pdf" ]
