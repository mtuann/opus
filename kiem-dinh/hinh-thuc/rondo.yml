    ghi_chu: "Trang đích chưa chuyển. Đã kiểm ../opus-zero/docs/nghe-nhac/vivaldi-mua-xuan.md có tồn tại, chương 1 viết theo hình thức ritornello (dòng 16, 34–36). Điều cần giữ: bài nghe về ritornello của Vivaldi."
  - id: n26
    cau: Hình thức ritornello của concerto Baroque cũng dựa trên ý tưởng "một đoạn quay lại nhiều lần" (ritornello xen với các đoạn độc tấu).
    loai: cau-truc
    nguon:
      - brit-ritornello
    ket_qua: da-sua
    ghi_chu: 'Britannica: ritornello là "a recurrent musical section that alternates with different episodes of contrasting material"; concerto grosso: cả dàn nhạc chơi ritornello, nhóm nhỏ chơi các đoạn xen. Cũ: "…nhưng mỗi lần ở giọng khác": Britannica không nói; bỏ vế ấy ở trang này (hinh-thuc/concerto, phần B của lô, kiểm điều ấy).'
    luot_2: dung
    luot_2_nguon: [ "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php", "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/" ]
  - id: n27
    cau: Link Concerto và ritornello (/opus/hinh-thuc/concerto/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: src/content/docs/hinh-thuc/concerto.md tồn tại, tiêu đề "Concerto và ritornello", có mục "Concerto thời Baroque: hình thức ritornello".'
  - id: n28
    cau: "Câu hỏi 1: sơ đồ của rondo năm đoạn là A – B – A – C – A (không phải A – B – A hay A – A' – A'' – A'''); giải thích: A – B – A là ba đoạn, A – A' – A'' là biến tấu."
    loai: cau-truc
    nguon:
      - omt-rondo
      - brit-ternary
      - cod-variation
    ket_qua: dung
    ghi_chu: "Rondo năm đoạn: OMT. A – B – A là ba đoạn: Britannica (ternary form). A – A' – A'' là biến tấu: COD (theme and variations: giai điệu được làm lại nhiều lần). Giải thích của câu hỏi không dựa vào vị trí lựa chọn."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/", "https://www.britannica.com/art/rondo" ]
  - id: n29
    cau: "Câu hỏi 2: rondo thường dùng cho chương cuối (không phải chương đầu hay chương chậm); giải thích: rondo là hình thức quen thuộc cho chương cuối của sonata và concerto thời Cổ điển."
    loai: lich-su
    nguon:
      - brit-rondo
      - cod-rondo
    ket_qua: da-sua
    ghi_chu: 'Cũ giải thích "Vì tính chất vui tươi, dễ nhớ" (không nguồn): thay bằng lời giải thích theo n4. Britannica: rondo cũng xuất hiện ở chương chậm, nhưng chủ yếu ở chương cuối, nên "thường" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rondo", "https://www.britannica.com/art/rondo" ]
  - id: n30
    cau: "Câu hỏi 3: đặc điểm của đoạn C là bè trầm giữ nốt La làm âm nền (không phải chuyển sang nhịp 3/4, không phải chuyển hẳn sang giọng trưởng); giải thích: đoạn C ở La thứ, trên âm nền La; bài vẫn ở nhịp 3/8."
    loai: cau-truc
    nguon:
      - wiki-fe
      - ldn-fe
      - mut-fe
    ket_qua: da-sua
    ghi_chu: 'Bản nhạc: IMSLP (PDF) chặn bot nên chưa đối chiếu từng nốt; Mutopia (.ly) chỉ đọc qua công cụ tóm tắt; hai nguồn bậc 3 cùng khớp. Review nên mở bản nhạc. Cũ: đáp án "Nốt La lặp lại dồn dập ở bè trầm (âm nền)", lựa chọn sai "Chơi chậm hơn hẳn", giải thích "Đó là đoạn căng thẳng nhất bài." Mới: đáp án "Bè trầm giữ nốt La làm âm nền" (Wikipedia: tonic pedal); lựa chọn sai "Chuyển hẳn sang giọng trưởng" (sai vì C không rời La thứ), giải thích theo n15; 3/8: Mutopia, Wikipedia. Bỏ lựa chọn về tốc độ vì không nguồn nào cho biết đoạn C đổi tốc độ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: "Mutopia: bè trầm lặp nốt La, nhịp 3/8 không đổi. Phần 'đoạn C ở La thứ' xem n15."
  - id: n31
    cau: "Mục Nguồn: dẫn chương Rondo của Open Music Theory, COD và Britannica (Rondo), IMSLP và Mutopia (Für Elise), link tới tài liệu tham khảo."
    loai: ve-site
