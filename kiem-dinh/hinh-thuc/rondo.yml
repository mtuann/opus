nhan_dinh:
  - id: n1
    cau: Rondo là hình thức có một đoạn chính (A) quay lại nhiều lần, xen giữa là các đoạn tương phản.
    loai: dinh-nghia
    nguon:
      - omt-rondo
      - cod-rondo
    ket_qua: dung
    ghi_chu: 'OMT: "the form consists of a recurring main section that alternates with contrasting sections." COD: "one section intermittently recurs."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/", "https://www.britannica.com/art/rondo" ]
  - id: n2
    cau: "Sơ đồ rondo năm đoạn: A – B – A – C – A, có khi dài hơn."
    loai: cau-truc
    nguon:
      - omt-rondo
      - brit-rondo
      - cod-rondo
    ket_qua: dung
    ghi_chu: "OMT và Britannica: ABACA (năm đoạn), ABACABA (bảy đoạn, rondo sonata); COD: thường ABACADA."
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/", "https://www.britannica.com/art/rondo" ]
  - id: n3
    cau: Đoạn A quay về giống như điệp khúc của một bài hát, nên tai dễ nhận ra.
    loai: khuyen-tap
    ket_qua: da-sua
    ghi_chu: 'Cũ: "…nên rondo dễ nghe và thường vui tươi." Bỏ "thường vui tươi": tính cách không nguồn nào (OMT, COD, Britannica) nói. Giữ phép so sánh với điệp khúc, là câu giúp nghe, không phải nhận định về nhạc.'
    luot_2: dung
  - id: n4
    cau: Rondo hay dùng cho chương cuối của sonata, concerto và giao hưởng thời Cổ điển.
    loai: lich-su
    nguon:
      - brit-rondo
      - cod-rondo
    ket_qua: dung
    ghi_chu: "Britannica: rondo phổ biến từ cuối thế kỷ 18 đến đầu thế kỷ 19, thường kết sonata, giao hưởng (nhất là của Haydn), concerto (nhất là của Mozart). COD: thời Mozart là hình thức chuẩn của chương cuối concerto hay sonata. OMT không nói chương nào."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rondo", "https://www.britannica.com/art/rondo" ]
  - id: n5
    cau: "Sơ đồ (hình): A, rồi B tương phản, A, C tương phản, A."
    loai: cau-truc
    nguon:
      - omt-rondo
    ket_qua: da-sua
    ghi_chu: 'Cũ: ô A đầu ghi "giọng chính" và có thêm ô "Coda" ở cuối. Đã bỏ: không nguồn bậc 1–2 nói đoạn A đầu nào cũng ở giọng chính hay rondo nào cũng có coda (Für Elise không có coda theo Wikipedia). Phần còn lại đúng theo OMT.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/" ]
  - id: n6
    cau: Für Elise của Beethoven có danh mục WoO 59.
    loai: danh-muc
    nguon:
      - imslp-fe
      - mut-fe
    ket_qua: dung
    ghi_chu: "IMSLP: Für Elise, WoO 59; Mutopia: WoO 59."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/F%C3%BCr_Elise,_WoO_59_(Beethoven,_Ludwig_van)" ]
  - id: n7
    cau: Für Elise là Bagatelle cung La thứ.
    loai: ten
    nguon:
      - imslp-fe
      - mut-fe
    ket_qua: dung
    ghi_chu: 'IMSLP: thể loại Bagatelles, cung La thứ; Mutopia: "Clavierstuck in A Minor".'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/F%C3%BCr_Elise,_WoO_59_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "IMSLP: Bagatelle in A minor."
  - id: n8
    cau: Für Elise viết khoảng 1810.
    loai: nam
    nguon:
      - imslp-fe
      - mut-fe
    ket_qua: dung
    ghi_chu: 'IMSLP và Mutopia: 1810. Wikipedia: dòng đề 27/4/1810 do Nohl chép, bản chép tay gốc đã mất, nên "khoảng" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/F%C3%BCr_Elise,_WoO_59_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "IMSLP: 1810."
  - id: n9
    cau: Für Elise xuất bản sau khi Beethoven mất.
    loai: nam
    nguon:
      - imslp-fe
    ket_qua: dung
    ghi_chu: "IMSLP: ấn bản đầu 1867, Ludwig Nohl, Neue Briefe Beethovens (Stuttgart, Cotta); Beethoven mất 1827 (khớp src/data/nha-soan-nhac.yml)."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/F%C3%BCr_Elise,_WoO_59_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: Xuất bản lần đầu 1867 (Nohl, Cotta).
  - id: n10
    cau: Bản nhạc ngắn nhưng có đủ hình thức rondo năm đoạn.
    loai: so-lieu
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Bản nhạc ngắn (khoảng 3 phút) nhưng có đầy đủ hình thức rondo." Bỏ "(khoảng 3 phút)": không nguồn bậc 1–2 ghi thời lượng. Vế rondo năm đoạn: xem n11.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/" ]
  - id: n11
    cau: Für Elise có đủ hình thức rondo A – B – A – C – A.
    loai: cau-truc
    nguon:
      - mut-fe
      - wiki-fe
      - ldn-fe
    ket_qua: dung
    ghi_chu: 'Bản nhạc: IMSLP (PDF) chặn bot nên chưa đối chiếu từng nốt; Mutopia (.ly) chỉ đọc qua công cụ tóm tắt; hai nguồn bậc 3 cùng khớp. Review nên mở bản nhạc. Wikipedia: "can be heard as a five-part rondo in the form A-B-A-C-A"; trang phân tích: "The full schema is ABACA". Khớp piano/the-loai (đã khóa) và src/data/tac-pham.yml (chu_thich).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/" ]
  - id: n12
    cau: Đoạn A ở La thứ, giai điệu Mi – Rê♯ – Mi – Rê♯…
    loai: cau-truc
    nguon:
      - mut-fe
      - imslp-fe
    ket_qua: dung
    ghi_chu: "Mutopia .ly: tay phải mở đầu e'' dis'' e'' dis'' e'' b' d'' c'' a' (Mi Rê♯ Mi Rê♯ Mi Si Rê Đô La); IMSLP: cung La thứ."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: "Mutopia .ly: 3/8, La thứ, mở đầu e'' dis''."
  - id: n13
    cau: "Đoạn B: giai điệu mới, sáng hơn (giọng trưởng), rồi chuỗi nốt nhanh; giọng Fa trưởng, rồi Đô trưởng."
    loai: cau-truc
    nguon:
      - mut-fe
      - wiki-fe
      - ldn-fe
    ket_qua: da-sua
    ghi_chu: 'Bản nhạc: IMSLP (PDF) chặn bot nên chưa đối chiếu từng nốt; Mutopia (.ly) chỉ đọc qua công cụ tóm tắt; hai nguồn bậc 3 cùng khớp. Review nên mở bản nhạc. Cũ: "Sáng hơn, trữ tình, rồi chuỗi nốt nhanh đi xuống". Bỏ "trữ tình" và "đi xuống" (không nguồn). Wikipedia: B từ ô 23 ở Fa trưởng, rồi nốt nhanh trên Đô trưởng; trang phân tích: B ở Fa trưởng. Mutopia: tay trái Fa–La–Đô, rồi chuỗi nốt nhanh trên Đô.'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: "Phần B: Fa trưởng (f a c'), rồi chuỗi nốt nhanh trên Đô trưởng."
  - id: n14
    cau: "Đoạn A thứ hai: La thứ, giai điệu chính trở lại nguyên vẹn."
    loai: cau-truc
    nguon:
      - wiki-fe
      - ldn-fe
    ket_qua: dung
    ghi_chu: 'Bản nhạc: IMSLP (PDF) chặn bot nên chưa đối chiếu từng nốt; Mutopia (.ly) chỉ đọc qua công cụ tóm tắt; hai nguồn bậc 3 cùng khớp. Review nên mở bản nhạc. Wikipedia: "an exact repeat of the A section".'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
  - id: n15
    cau: Đoạn C ở La thứ, trên âm nền La ở bè trầm; đoạn không rời giọng chính.
    loai: cau-truc
    nguon:
      - wiki-fe
      - ldn-fe
      - mut-fe
    ket_qua: da-sua
    ghi_chu: 'Bản nhạc: IMSLP (PDF) chặn bot nên chưa đối chiếu từng nốt; Mutopia (.ly) chỉ đọc qua công cụ tóm tắt; hai nguồn bậc 3 cùng khớp. Review nên mở bản nhạc. Cũ: "Rê thứ, trên âm nền La ở bè trầm". Wikipedia: C (từ ô 59) "does not leave the tonic", "unfolding over a tonic pedal"; trang phân tích: "Back in A minor but turbulent". Không nguồn nào nói giọng Rê thứ, nên sửa thành La thứ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: Khóa nhạc giữ La thứ không đổi, bè trầm giữ nốt La. Nhưng hòa âm lướt qua Rê thứ, Si♭, Si rồi Mi; 'không rời giọng chính' là cách diễn giải, nguồn tôi mở được không đưa phân tích giọng.
  - id: n16
    cau: Ở đoạn C, nốt La lặp lại dồn dập ở tay trái.
    loai: cau-truc
    nguon:
      - mut-fe
      - wiki-fe
    ket_qua: null
    ghi_chu: "chưa chắc: Wikipedia nói âm nền chủ (tonic pedal) nhưng không nói nốt lặp ở tay trái; Mutopia (.ly, qua công cụ tóm tắt) có mẫu a, 16 a, a, … ở bè trầm nhưng không xác định được ô; trang phân tích nói tay trái là móc kép liên tục với bước nhảy quãng tám. Cần mở bản nhạc."
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
    luot_2_ghi_chu: Bè trầm lặp a, nốt móc kép.
  - id: n17
    cau: 'Cũ: "căng thẳng, kịch tính nhất bài" (đoạn C).'
    loai: cau-truc
    ket_qua: da-bo
    ghi_chu: 'Bỏ: là nhận xét, không nguồn nào (Wikipedia gọi C là "coda-like"). Thay bằng "đoạn không rời giọng chính" (n15).'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu trích từ chữ cũ của trang, mang tính cảm nhận, không có nguồn xác nhận được.
  - id: n18
    cau: "Đoạn A cuối: trở lại lần cuối, rồi bài kết thúc."
    loai: cau-truc
    nguon:
      - wiki-fe
    ket_qua: da-sua
    ghi_chu: 'Cũ: "…kết thúc nhẹ nhàng". Bỏ "nhẹ nhàng": không nguồn bậc 1–2. Wikipedia: bài kết không có đoạn đuôi (postlude).'
    luot_2: dung
    luot_2_nguon: [ "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
  - id: n19
    cau: Giai điệu A xuất hiện ba lần, cách nhau bởi B và C (hai lần quay lại).
    loai: cau-truc
    nguon:
      - mut-fe
      - wiki-fe
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Bạn sẽ đếm được ba lần A." Thêm "hai lần quay lại, tức ba lần A kể cả lần đầu" cho rõ. Hệ quả của A–B–A–C–A (n11).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/", "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly" ]
  - id: n20
