doi_chu:
  - cu:
      - "Rondo là hình thức có một đoạn chính (A) quay lại nhiều lần, xen giữa là các đoạn tương phản: A – B – A – C – A, có khi dài hơn. Đoạn A quay về giống như điệp khúc của một bài hát, nên rondo dễ nghe và thường vui tươi. Nó hay dùng cho chương cuối của sonata, concerto và giao hưởng thời Cổ điển."
      - flowchart LR A1["A<br/>giọng chính"] --> B["B<br/>tương phản"] --> A2["A"] --> C["C<br/>tương phản"] --> A3["A"] --> K["Coda"]
    moi:
      - "Rondo là hình thức có một đoạn chính (A) quay lại nhiều lần, xen giữa là các đoạn tương phản: A – B – A – C – A, có khi dài hơn. Đoạn A quay về giống như điệp khúc của một bài hát, nên tai dễ nhận ra. Nó hay dùng cho chương cuối của sonata, concerto và giao hưởng thời Cổ điển."
      - flowchart LR A1["A"] --> B["B<br/>tương phản"] --> A2["A"] --> C["C<br/>tương phản"] --> A3["A"]
    ly_do: 'n3 (da-sua): bỏ "thường vui tươi" (không nguồn), giữ phép so sánh điệp khúc.; n5 (da-sua): bỏ ô "giọng chính" của A đầu và ô "Coda" (không nguồn).'
