    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đã kiểm: src/content/docs/piano/tac-pham/fur-elise.md tồn tại (đợt 4), cũng nói chủ đề quay lại ba lần xen hai đoạn tương phản, khớp trang này."
  - id: n21
    cau: Mozart, chương 3 Sonata piano K. 331, Rondo alla Turca.
    loai: ten
    nguon:
      - brit-janissary
      - brit-rondo
    ket_qua: dung
    ghi_chu: 'Britannica (Janissary music): "the final movement of Mozart’s Piano Sonata in A Major, K 331"; Britannica (Rondo): "Rondo alla turca" từ K 331.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Piano_Sonata_K.331_(Mozart,_Wolfgang_Amadeus)", "https://www.britannica.com/print/article/1932494" ]
  - id: n22
    cau: Rondo alla Turca mô phỏng âm nhạc quân đội Ottoman (Janissary), một ví dụ nổi tiếng của thể loại alla turca.
    loai: lich-su
    nguon:
      - brit-janissary
    ket_qua: da-sua
    ghi_chu: 'Britannica: thể loại "alla turca" là "compositions in naive imitation of the Turkish military style", gắn với nhạc Janissary; K 331 là ví dụ nổi tiếng. Cũ: "mô phỏng âm nhạc quân đội Ottoman, rất phổ biến ở Vienna thời đó": vế sau bỏ (n23).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/print/article/1932494", "https://ico.org.au/mozart-turkish-march/" ]
  - id: n23
    cau: 'Cũ: "rất phổ biến ở Vienna thời đó" (Rondo alla Turca).'
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: "Bỏ: Britannica (Janissary music, Rondo) không nói mức phổ biến ở Vienna; Wikipedia (bậc 3) cũng không nói."
    luot_2: dung
    luot_2_nguon: [ "https://ico.org.au/mozart-turkish-march/", "https://www.britannica.com/print/article/1932494" ]
    luot_2_ghi_chu: "'anything Ottoman was very much in vogue' ở Vienna."
  - id: n24
    cau: "Chương cuối của nhiều concerto thời Cổ điển, như concerto của Mozart: thường là rondo hoặc sonata – rondo."
    loai: lich-su
    nguon:
      - cod-rondo
      - brit-rondo
    ket_qua: da-sua
    ghi_chu: "COD: thời Mozart rondo là hình thức chuẩn cho chương cuối concerto; Mozart và Beethoven kết hợp rondo với sonata thành sonata-rondo. Britannica: rondo kết concerto (nhất là của Mozart). Cũ nêu cả concerto Beethoven: không nguồn bậc 1–2 nói riêng concerto Beethoven, bỏ vế ấy."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/rondo", "https://www.britannica.com/art/rondo" ]
    luot_2_ghi_chu: "COD: rondo là hình thức thường cho chương cuối concerto/sonata; sonata-rondo cũng nêu."
