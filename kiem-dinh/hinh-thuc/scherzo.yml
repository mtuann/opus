    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/scherzo" ]
  - id: s11
    cau: "Bảng: scherzo hóm hỉnh, nhiều bất ngờ, có khi dữ dội."
    loai: cau-truc
    nguon:
      - brit-scherzo
