    ket_qua: da-sua
    ghi_chu: 'Cũ: "Hóm hỉnh, bất ngờ, đôi khi dữ dội". COD: Beethoven cho scherzo "a rough, almost savage wit"; Britannica: nhiều bất ngờ. Chỉ chỉnh nhẹ chữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/scherzo", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scherzo" ]
