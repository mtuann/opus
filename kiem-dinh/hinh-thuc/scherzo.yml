nhan_dinh:
  - id: s1
    cau: Scherzo trong tiếng Ý nghĩa là "trò đùa".
    loai: dinh-nghia
    nguon:
      - cod-scherzo
    ket_qua: dung
    ghi_chu: 'COD: Italian for "jest" or "joke".'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scherzo" ]
  - id: s2
    cau: Scherzo là chương nhạc nhanh, thường ở nhịp 3, nhiều bất ngờ về cường độ và màu dàn nhạc.
    loai: dinh-nghia
    nguon:
      - brit-scherzo
      - cod-scherzo
    ket_qua: da-sua
    ghi_chu: 'Cũ: "đúng như tên gọi, đây là chương nhạc của sự bất ngờ, hóm hỉnh và năng lượng dồn nén." Britannica: scherzo nhanh hơn minuet, 3/4, "full of surprises in dynamics and orchestration"; COD: thường nhịp ba, năng động. "Năng lượng dồn nén" bỏ (không nguồn). Mô tả đầu trang sửa theo.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/scherzo", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scherzo" ]
  - id: s3
    cau: Beethoven viết scherzo cho gần hết chín giao hưởng của mình.
    loai: lich-su
    nguon:
      - brit-scherzo
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Beethoven là người đưa scherzo vào giao hưởng". Britannica: Beethoven viết scherzo cho gần hết chín giao hưởng; Haydn đã dùng chữ scherzo ở Op. 33; COD: minuet của Haydn đã gần scherzo, Beethoven là người "thực sự tạo ra" scherzo (từ các tam tấu Op. 1). Không nguồn nào nói ông là người đầu tiên đưa scherzo vào giao hưởng, nên viết lại theo điều có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/scherzo", "https://imslp.org/wiki/Symphony_No.2,_Op.36_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Symphony_No.3,_Op.55_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Symphony_No.6,_Op.68_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Symphony_No.9,_Op.125_(Beethoven,_Ludwig_van)" ]
    luot_2_ghi_chu: "Britannica: gần hết chín giao hưởng, chỉ ghi nhãn Scherzo ở số 2, 3 (IMSLP ghi thêm ở số 5, 6, 9). Số 1, 4, 8 là minuet; số 7 Presto."
  - id: s4
    cau: Scherzo thay thế minuet trang nhã của thời Cổ điển.
    loai: lich-su
    nguon:
      - cod-minuet
      - brit-scherzo
      - brit-minuet
    ket_qua: dung
    ghi_chu: 'COD (minuet): minuet là chương 3 chuẩn "until supplanted from Beethoven onwards by the scherzo"; Britannica: minuet là điệu múa quý tộc trang trọng (stately). Chữ "lịch thiệp" đổi "trang nhã" cho sát.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/scherzo", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scherzo" ]
  - id: s5
    cau: Beethoven giữ khung ABA của minuet (Scherzo – Trio – Scherzo da capo) và nhịp 3.
    loai: cau-truc
    nguon:
      - brit-scherzo
      - cod-scherzo
    ket_qua: dung
    ghi_chu: 'Britannica: scherzo nhịp 3/4, có trio tương phản rồi quay lại ABA; COD: khung scherzo – trio – scherzo (COD ghi không phải scherzo nào cũng có trio; câu nói về scherzo của Beethoven nên đúng). Cũ thêm "thay đổi tính cách hoàn toàn": sửa "đổi tính cách".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/scherzo" ]
  - id: s6
    cau: Link minuet (/opus/hinh-thuc/minuet-trio/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đã kiểm: src/content/docs/hinh-thuc/minuet-trio.md (cùng lô) tồn tại. Review: đã kiểm src/content/docs/hinh-thuc/minuet-trio.md có."
