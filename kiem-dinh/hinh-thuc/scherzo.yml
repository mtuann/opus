doi_chu:
  - cu: Scherzo trong tiếng Ý nghĩa là "trò đùa" — và đúng như tên gọi, đây là chương nhạc của sự bất ngờ, hóm hỉnh và năng lượng dồn nén. Beethoven là người đưa scherzo vào giao hưởng, thay thế minuet lịch thiệp của thời Cổ điển.
    moi: Scherzo trong tiếng Ý nghĩa là "trò đùa". Đó là chương nhạc nhanh, thường ở nhịp 3, nhiều bất ngờ về cường độ và màu dàn nhạc. Beethoven viết scherzo cho gần hết chín giao hưởng của mình, thay thế minuet trang nhã của thời Cổ điển.
    ly_do: 's2 (da-sua): mô tả đầu trang viết lại theo Britannica và COD.; s2, s3, s4 (da-sua): bỏ "hóm hỉnh, năng lượng dồn nén" và "Beethoven là người đưa scherzo vào giao hưởng" (không nguồn); Britannica, COD.'
  - cu: "Beethoven giữ khung ABA của minuet (Scherzo – Trio – Scherzo da capo) và nhịp 3, nhưng thay đổi tính cách hoàn toàn:"
    moi: "Beethoven giữ khung ABA của minuet (Scherzo – Trio – Scherzo da capo) và nhịp 3, nhưng đổi tính cách:"
    ly_do: 's5 (da-sua): bỏ "hoàn toàn".'
  - cu:
      - Vừa phải, bước nhảy
      - Rất nhanh — nghe như chỉ có 1 phách mỗi ô
    moi:
      - Vừa phải, như bước nhảy
      - Nhanh hơn nhiều
    ly_do: 's9–s13 (da-sua): Britannica, COD: bỏ "1 phách mỗi ô", "cân đối", "mỏng", "thế giới khác" (không nguồn bậc 1–2).'
  - cu:
      - Thanh lịch, cân đối
      - Hóm hỉnh, bất ngờ, đôi khi dữ dội
    moi:
      - Trang nhã, như điệu nhảy cung đình
      - Hóm hỉnh, nhiều bất ngờ, có khi dữ dội
    ly_do: "s9–s13 (da-sua): bảng so sánh bỏ tính từ không nguồn."
  - cu:
      - Mỏng, dịu
      - Tương phản mạnh, có khi như một thế giới khác
      - Giao hưởng số 1 (1800), chương 3 của Beethoven còn ghi là Menuetto nhưng chơi nhanh như scherzo; từ Giao hưởng số 2 (1802), ông ghi thẳng Scherzo — và cả thế kỷ 19 đi theo.
    moi:
      - Đoạn giữa dịu hơn minuet
      - Đoạn giữa tương phản với scherzo, có thể rất khác về tính cách
      - Giao hưởng số 1 của Beethoven (1799–1800), chương 3 còn ghi là minuet (Allegro molto e vivace), nhanh như scherzo. Giao hưởng số 2 (viết 1800–1802) là bản đầu tiên ghi thẳng Scherzo ở chương 3. Sau đó ông viết scherzo cho gần hết các giao hưởng còn lại (số 8 giữ Tempo di Menuetto), và sang thế kỷ 19 scherzo thay minuet trong nhiều giao hưởng, tứ tấu và sonata.
    ly_do: 's14–s18 (da-sua): IMSLP, Britannica: năm 1799–1800 và 1800–1802; số 1 ghi minuet, số 2 ghi Scherzo; số 8 giữ Tempo di Menuetto; bỏ "cả thế kỷ 19 đi theo".'
  - cu: "Chương scherzo cung Đô thứ này không kết thúc độc lập: nó chảy thẳng vào chương cuối (attacca) — một trong những chuyển đoạn nổi tiếng nhất lịch sử nhạc giao hưởng."
    moi: "Chương scherzo cung Đô thứ này không kết thúc độc lập: nó chảy thẳng vào chương cuối (attacca), và đoạn nối ấy thường được xem là một trong những chuyển đoạn hay nhất trong âm nhạc."
    ly_do: "s20, s21 (da-sua): Lumen: viết lại câu về đoạn nối."
  - cu: Dây trầm (cello, contrabass) mở đầu bằng chủ đề bí ẩn, rón rén; rồi kèn horn vang lên chủ đề chính
    moi: Cello và contrabass mở đầu, nhạc khí gỗ đáp lại; rồi kèn horn vang lên chủ đề chính của chương
    ly_do: 's22–s26 (da-sua): Lumen: bỏ "bí ẩn, rón rén", fugue, timpani, "nhỏ dần, mỏng dần", "chiến thắng" (nhận xét hoặc chỉ nguồn bậc 3).'
  - cu: "Chuyển sang Đô trưởng: fugue của cello và contrabass — trầm mà hùng tráng"
    moi: Chuyển sang Đô trưởng, viết đối âm (contrapuntal)
    ly_do: 's22–s26 (da-sua): Giao hưởng số 5, phần trio: bỏ "fugue", "trầm mà hùng tráng"; giữ chi tiết có trong giáo trình Lumen.'
  - cu: Trở lại, nhưng nhỏ dần, mỏng dần…
    moi: Trở lại lần cuối, do dây chơi pizzicato và rất nhỏ
    ly_do: "s22–s26 (da-sua): scherzo trở lại do dây chơi pizzicato và rất nhỏ (Lumen)."
  - cu: Tiếng trống timpani gõ đều như nhịp tim; nhạc dồn nén, chờ đợi…
    moi: Một đoạn nối dẫn thẳng sang chương cuối, không ngắt
    ly_do: 's22–s26 (da-sua): bỏ timpani "như nhịp tim"; chương nối thẳng sang chương cuối (Lumen).'
  - cu:
      - "Bùng nổ Đô trưởng: chiến thắng"
      - "Nghe chương 3 và 4 liền nhau (hướng dẫn nghe): toàn bộ ý đồ của Beethoven nằm ở cây cầu giữa hai chương."
    moi:
      - Vào ngay (attacca), ở Đô trưởng
      - "Nghe chương 3 và 4 liền nhau (hướng dẫn nghe): hãy chú ý đoạn nối giữa hai chương."
    ly_do: "s27 (da-sua): bỏ suy diễn về ý đồ của Beethoven."
  - cu:
      - Trong Giao hưởng số 9, Beethoven đặt scherzo ở chương 2 (thay vì chương 3) — chương dài và dữ dội; ở cuối chương, trio vừa bắt đầu quay lại thì bị cắt ngang. Mahler sau này cũng hay xáo trộn vị trí các chương.
      - "Ngoài giao hưởng, scherzo còn là thể loại độc lập: Scherzo trong Giấc mộng đêm hè của Mendelssohn (nhẹ như tiên), các scherzo piano của Chopin (4 bản, đầy kịch tính)."
    moi:
      - Trong Giao hưởng số 9, Beethoven đặt scherzo ở chương 2 (thay vì chương 3), trước chương chậm.
      - "Ngoài giao hưởng, scherzo còn đứng riêng: Scherzo trong nhạc sân khấu Giấc mộng đêm hè Op. 61 của Mendelssohn (1842–43), và bốn scherzo cho piano của Chopin, nơi những đoạn dữ dội, hơi u tối xen với trio trữ tình."
    ly_do: 's29, s30 (da-sua, da-bo): IMSLP: scherzo số 9 ở chương 2; bỏ "dài và dữ dội", trio bị cắt ngang, Mahler (chỉ nguồn bậc 3).; s31, s32 (da-sua): IMSLP, Britannica, COD: Mendelssohn Op. 61 (1842–43), Chopin bốn scherzo.'
  - cu: Scherzo ở vị trí chương 2; trio thoáng quay lại ở cuối
    moi: Scherzo ở vị trí chương 2, trước chương chậm
    ly_do: 's31, s34 (da-sua): bỏ "như tiếng tiên đùa" và "trio thoáng quay lại ở cuối".'
  - cu: Nhẹ, nhanh, như tiếng tiên đùa
    moi: Scherzo trong nhạc sân khấu Op. 61
    ly_do: 's31 (da-sua): Mendelssohn, scherzo trong nhạc sân khấu Op. 61; bỏ "như tiên".'
  - cu:
      - 'Wikipedia, Scherzo: scherzo nghĩa là "trò đùa"; scherzo phát triển từ minuet và trio, giữ nhịp 3 và khung ba đoạn nhưng nhanh hơn nhiều, nghe như một phách mỗi ô; Beethoven và Schubert là những người đầu tiên dùng scherzo rộng rãi; scherzo trong nhạc cho Giấc mộng đêm hè của Mendelssohn, các scherzo piano của Chopin.'
      - "Giao hưởng của Beethoven, Wikipedia: số 1 (chương 3 ghi Menuetto nhưng nhanh đến mức thực chất là scherzo), số 2 (lần đầu Beethoven dùng scherzo làm chương 3), số 5 (scherzo Đô thứ mở đầu bằng cello và contrabass, rồi kèn horn vang chủ đề chính; trio Đô trưởng viết đối âm, mở đầu bằng cello và contrabass; scherzo trở lại pizzicato rất nhỏ; đoạn chuyển trên tiếng timpani dẫn thẳng vào chương cuối Đô trưởng), số 9 (scherzo là chương 2, đặt trước chương chậm; cuối chương trio trở lại thoáng qua rồi một coda ngắn khép lại)."
      - "Tên chương, năm sáng tác và buổi diễn đầu tiên trên IMSLP: Giao hưởng số 1 (viết 1799–1800, diễn lần đầu ngày 2/4/1800), số 2 (viết 1800–1802), số 5, số 9."
      - "Wikipedia, Symphony No. 6 (Mahler): Mahler đặt scherzo ở chương 2 trong Giao hưởng số 1, số 4 và bản đầu của số 6, rồi đổi thứ tự hai chương giữa của số 6."
      - "Wikipedia: Scherzos (Chopin) (bốn scherzo cho piano viết từ 1833 đến 1843, đầy kịch tính), Scherzo No. 2 (Chopin), A Midsummer Night's Dream (Mendelssohn) (Scherzo nằm trong phần nhạc cho vở kịch, Op. 61)."
    moi:
      - 'Concise Oxford Dictionary of Music, mục Scherzo và Minuet: scherzo nghĩa là "trò đùa"; thay minuet và trio, năng động hơn; Beethoven là người thật sự tạo ra scherzo, thường ở nhịp ba; bốn scherzo của Chopin.'
      - "Encyclopaedia Britannica, mục Scherzo: scherzo nhanh hơn minuet, nhịp 3/4, nhiều bất ngờ; Beethoven viết scherzo cho gần hết chín giao hưởng; cũng có trio tương phản và quay lại ABA; các scherzo piano của Chopin."
      - "Giao hưởng số 5, chương 3: bài Symphony No. 5 in C minor (Lumen Learning, giáo trình mở): scherzo Đô thứ, trio Đô trưởng viết đối âm, scherzo trở lại pizzicato rất nhỏ, đoạn nối sang chương cuối chơi liền (attacca)."
      - "Tên chương, năm sáng tác trên IMSLP: Giao hưởng số 1, số 2, số 5, số 8, số 9; Mendelssohn, A Midsummer Night's Dream, Op. 61; Chopin, Scherzo số 2, Op. 31."
    ly_do: "s35 (da-sua, mục Nguồn): thay bằng nguồn đã mở (COD, Britannica, Lumen, IMSLP)."
