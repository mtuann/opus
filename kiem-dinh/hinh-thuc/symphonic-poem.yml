nhan_dinh:
  - id: n1
    cau: Tiếng Đức của symphonic poem là sinfonische Dichtung.
    loai: ten
    nguon:
      - cod-sp
    ket_qua: da-sua
    ghi_chu: 'COD: "sinfonische Dichtung". Chữ cũ: "symphonische Dichtung" (chính tả cũ); đổi theo nguồn đã mở.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphonic-poem" ]
  - id: n2
    cau: Richard Strauss ưa gọi thể loại này là Tondichtung, "thơ bằng âm thanh".
    loai: ten
    nguon:
      - cod-sp
    ket_qua: da-sua
    ghi_chu: 'COD: Strauss "preferred the term Tondichtung"; thường dịch "tone-poem", COD gợi "sound-poem" sát ý hơn. Chữ cũ: "gọi là"; đổi thành "ưa gọi là".'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphonic-poem" ]
  - id: n3
    cau: Symphonic poem là nhạc kể chuyện một chương cho dàn nhạc.
    loai: dinh-nghia
    nguon:
      - cod-sp
      - brit-sp
    ket_qua: dung
    ghi_chu: 'COD: "one-movement orchestral works" theo chương trình; Britannica: "single-movement symphonic poem", dựa trên một chương trình ngoài âm nhạc.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphonic-poem", "https://www.britannica.com/art/symphonic-poem" ]
  - id: n4
    cau: Franz Liszt đặt ra tên gọi symphonic poem và viết 13 tác phẩm như vậy.
    loai: lich-su
    nguon:
      - cod-sp
      - brit-sp
    ket_qua: da-sua
    ghi_chu: 'COD: Liszt áp dụng tên cho 13 tác phẩm một chương; Britannica: "Both the term symphonic poem and the form itself were invented by Franz Liszt". Chữ cũ: "vào thập niên 1850"; bỏ mốc vì nguồn đã mở không nêu năm đặt tên (Britannica ghi Les Préludes 1848; BSO ghi diễn lần đầu 1854). Review D5-gom: 12 hay 13: COD ghi 13; 12 bài viết ở Weimar cộng Von der Wiege bis zum Grabe về sau. Giữ 13 theo COD.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphonic-poem", "https://www.britannica.com/art/symphonic-poem" ]
    luot_2_ghi_chu: "COD: Liszt dùng thuật ngữ và viết 13 tác phẩm một chương (MusicWeb nói 12; COD và Runyan nói 13)."
  - id: n5
    cau: Khác với giao hưởng "thuần túy", symphonic poem chỉ có một chương và bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.
    loai: dinh-nghia
    nguon:
      - cod-sp
      - brit-sp
    ket_qua: da-sua
    ghi_chu: 'COD: tác phẩm một chương ở quy mô giao hưởng nhưng không phải giao hưởng "pure" vì có chương trình. Chữ cũ: "giao hưởng (4 chương, cấu trúc trừu tượng)": "4 chương" không áp cho mọi giao hưởng, "trừu tượng" không có nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphonic-poem", "https://www.britannica.com/art/symphonic-poem" ]
  - id: n6
    cau: Người nghe thường được cho một chương trình (program), vài dòng tóm tắt câu chuyện, rồi âm nhạc diễn lại bằng chủ đề và màu sắc dàn nhạc.
    loai: dinh-nghia
    nguon:
      - brit-sp
      - bso-lp
    ket_qua: dung
    ghi_chu: 'Britannica: tác phẩm dựa trên "program" ngoài âm nhạc, tên thường nhắc tới nó; BSO: Liszt in kèm lời tựa (paraphrase từ Lamartine) cho Les Préludes.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/program-music", "https://www.britannica.com/art/symphonic-poem" ]
  - id: n7
    cau: "Một nhân vật có thể có chủ đề riêng: Till Eulenspiegel có hai chủ đề, một cho kèn horn và một cho clarinet."
    loai: cau-truc
    nguon:
      - riphil-till
    ket_qua: da-sua
    ghi_chu: 'Rhode Island Philharmonic: hai chủ đề của Till, "a comic-heroic horn call" và "a jaunty whistling tune" (clarinet Rê). Chữ cũ: "Mỗi nhân vật/sự kiện có chủ đề riêng (gần với idée fixe của Berlioz)": tổng quát hóa và so sánh Berlioz không có nguồn đã mở.'
    luot_2: dung
    luot_2_nguon: [ "https://www.musicprogramnotes.com/strauss-till-eulenspiegels-lustige-streiche-till-eulenspiegels-merry-pranks-op-28/", "https://www.dupagesymphony.org/wp-content/uploads/2024/03/Till-Eulenspiegel-Listening-Guide_English.pdf" ]
  - id: n8
    cau: Chủ đề có thể biến hình qua các đoạn, như trong Les Préludes của Liszt.
    loai: cau-truc
    nguon:
      - brit-sp
      - bso-lp
    ket_qua: da-sua
    ghi_chu: 'Britannica: Liszt dùng "thematic transformation to parallel the poetic emotions", ví dụ Les Préludes; BSO: các dẫn xuất của chủ đề chính. Chữ cũ: "Chủ đề biến hình theo diễn biến truyện (vui → bi tráng, ngây thơ → anh hùng)": bỏ ví dụ không nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.runyanprogramnotes.com/program_note/les-preludes-after-de-lamartine-lw-g3-s-97/", "https://musicweb-international.com/programme_notes/liszt_lespreludes.htm" ]
  - id: n9
    cau: Hình thức của symphonic poem tự do, chỉ gần với hình thức sonata của chương đầu giao hưởng.
    loai: dinh-nghia
    nguon:
      - brit-sp
    ket_qua: da-sua
    ghi_chu: 'Britannica: "The musical form is free, though somewhat akin to the sonata form used in the first movement of symphonies." Chữ cũ: "uốn theo câu chuyện chứ không theo khuôn sonata cứng nhắc".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/symphonic-poem" ]
    luot_2_ghi_chu: "Britannica: hình thức tự do, chỉ lỏng lẻo giống sonata của chương đầu giao hưởng."
  - id: n10
    cau: Moldau (Vltava) là chương thứ hai trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana.
    loai: danh-muc
    nguon:
      - laphil-moldau
      - classic-moldau
    ket_qua: da-sua
    ghi_chu: "LA Phil: một trong sáu symphonic poem của Má vlast; Classic Note: Vltava là chương thứ hai, thứ tự Vyšehrad, Vltava, Šárka, From Bohemia's Woods and Fields, Tábor, Blaník. Chữ cũ: \"chương nổi tiếng nhất\"; bỏ xếp hạng."
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=1221", "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau" ]
  - id: n11
    cau: Moldau là chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague.
    loai: cau-truc
    nguon:
      - laphil-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: chương trình của Smetana: sông bắt nguồn từ hai con suối, "in a broad stream toward Prague", rồi đổ vào Elbe.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=1221", "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau" ]
  - id: n12
    cau: "Bảng Moldau, đoạn 1: hai con suối nhỏ (sáo) hợp thành sông; hai dòng nhạc mỏng hòa vào nhau."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'Classic Note: hai sáo mở đầu, một cho suối lạnh, một cho suối ấm, hòa dần, rồi clarinet vào; LA Phil: hai suối "one warm the other cold".'
    luot_2: dung
    luot_2_nguon: [ "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau", "https://www.bhso.org.uk/?p=1299" ]
    luot_2_ghi_chu: Hai sáo và clarinet; dòng sông hình thành.
  - id: n13
    cau: "Bảng Moldau, đoạn 2: sông lớn dần; giai điệu Moldau nổi tiếng cất lên ở dây."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: "Classic Note: violin chơi giai điệu chính; LA Phil: chủ đề sol trưởng do dây cao và woodwind giới thiệu, dây trầm gợi sóng."
    luot_2: dung
    luot_2_nguon: [ "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau" ]
    luot_2_ghi_chu: Chủ đề Vltava ở violin, oboe, bassoon.
  - id: n14
    cau: "Bảng Moldau, đoạn 3: thợ săn trong rừng; tiếng kèn horn."
    loai: cau-truc
    nguon:
      - classic-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'Lansdowne: "Hunt: Horns suggest a hunt in the forest"; Classic Note: horn, kèn săn. LA Phil (bản tóm tắt) không nhắc cảnh săn trong đoạn trích chương trình.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=1221", "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau" ]
  - id: n15
    cau: "Bảng Moldau, đoạn 4: đám cưới nông dân; điệu nhảy vui (polka)."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: "a meadow where the peasants are celebrating a wedding"; Lansdowne: "played as a polka"; Classic Note: polka kiểu dân gian Czech.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=1221", "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau" ]
    luot_2_ghi_chu: Polka đám cưới.
  - id: n16
    cau: "Bảng Moldau, đoạn 5: tiên nữ dưới trăng; sáo và clarinet đan những hình nốt gợn sóng; violin dùng bộ giảm âm chơi giai điệu cao, có đàn hạc."
    loai: cau-truc
    nguon:
      - lakeview-moldau
      - cuny-moldau
      - laphil-moldau
    ket_qua: da-sua
    ghi_chu: 'LA Phil: "In the silver moonlight the river nymphs frolic"; Lansdowne, Classic Note: flute và oboe (Classic Note thêm dây lung linh). Chữ cũ: "Sáo và kèn êm đềm, lung linh": "kèn" không rõ, đổi thành oboe. Review D5-gom: lượt 2 đúng: đoạn ánh trăng không có oboe dẫn. Lakeview: "flutes and clarinets play leap-frog"; Understanding Music (CUNY): sáo gợn sóng, violin dùng bộ giảm âm chơi giai điệu legato ở âm vực cao, có đàn hạc. Classic Note (bậc 3) ghi oboe: không dùng. Chữ cũ (lượt 1): "Sáo và oboe trao nhau câu nhạc cao, dây lung linh"; chữ mới: "Sáo và clarinet đan những hình nốt gợn sóng; violin dùng bộ giảm âm chơi giai điệu cao, có đàn hạc". Mục Nguồn thêm hai trang này. Người gom (D5-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, VSL, OMT, IMSLP lỗi hay chặn) hay vì câu tả ví dụ soạn mà danh sách không kèm mã, không phải vì nguồn nói khác; giữ theo nguồn review đã mở, ghi ở trên.'
    luot_2: khong-chac
    luot_2_ghi_chu: Nguồn mở được xác nhận sáo và clarinet gợn sóng ở đoạn ánh trăng, nhưng không nhắc violin giảm âm hay đàn hạc ở đoạn này.
  - id: n17
    cau: "Bảng Moldau, đoạn 6: thác ghềnh St. John; dàn nhạc ào ạt, dữ dội nhất."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: "The Moldau foams and surges in the Rapids of St. John"; Classic Note: toàn dàn nhạc fortissimo, đoạn cao trào.'
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=1221", "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau" ]
  - id: n18
    cau: "Bảng Moldau, đoạn 7: qua Prague, đổ ra sông Elbe; giai điệu Moldau trở lại, hùng tráng rồi xa dần."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: sông chảy tới Prague, Vyšehrad hiện bên bờ, rồi "yielding itself up to the Elbe"; Classic Note: chủ đề chính chuyển từ Mi thứ sang Mi trưởng khi tới thành phố.'
    luot_2: dung
    luot_2_nguon: [ "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau", "https://www.bhso.org.uk/?p=1299" ]
    luot_2_ghi_chu: Vyšehrad, sông gặp Elbe; hai hợp âm fortissimo cuối bài.
  - id: n19
    cau: "Nghe một mạch và đánh dấu mỗi lần cảnh đổi, âm nhạc đổi thế nào: bài tập nghe âm nhạc miêu tả."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
  - id: n20
    cau: Les Préludes của Liszt được ưa chuộng nhất trong các symphonic poem của ông.
    loai: lich-su
    nguon:
      - bso-lp
    ket_qua: da-sua
    ghi_chu: "BSO: \"the most popular of Liszt's symphonic poems\". Chữ cũ: \"Nổi tiếng nhất của Liszt\": mơ hồ (cả các tác phẩm của ông); thu hẹp theo nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://www.runyanprogramnotes.com/program_note/les-preludes-after-de-lamartine-lw-g3-s-97/" ]
    luot_2_ghi_chu: "Runyan: Les Préludes là bản duy nhất trong 13 symphonic poem còn trong tiết mục thường xuyên; không ghi nguyên chữ 'ưa chuộng nhất'."
  - id: n21
    cau: 'Les Préludes: câu hỏi "đời là gì?".'
    loai: cau-truc
    nguon:
      - bso-lp
    ket_qua: dung
    ghi_chu: 'BSO: lời tựa Liszt cho: "What is life but a series of preludes to that unknown song whose initial solemn note is tolled by Death?"'
    luot_2: dung
    luot_2_nguon: [ "https://musicweb-international.com/programme_notes/liszt_lespreludes.htm", "https://www.runyanprogramnotes.com/program_note/les-preludes-after-de-lamartine-lw-g3-s-97/" ]
    luot_2_ghi_chu: "Lời tựa: 'What is life but a series of preludes...'."
  - id: n22
    cau: "Smetana, Moldau: dòng sông Vltava."
    loai: ten
    nguon:
      - laphil-moldau
    ket_qua: dung
    ghi_chu: Như n10, n11.
    luot_2: dung
    luot_2_nguon: [ "https://pressbooks.cuny.edu/understandingmusicbmcc/?p=1221", "https://www.lakevieworchestra.org/notes/2018/6/17/smetana-vltava-die-moldau" ]
  - id: n23
    cau: "R. Strauss, Don Juan: gã Don Juan đa tình, kết thúc bi thảm."
    loai: cau-truc
    nguon:
      - brit-dj
    ket_qua: dung
