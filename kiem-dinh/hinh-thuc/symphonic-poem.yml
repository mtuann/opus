nhan_dinh:
  - id: n1
    cau: Tiếng Đức của symphonic poem là sinfonische Dichtung.
    loai: ten
    nguon:
      - cod-sp
    ket_qua: da-sua
    ghi_chu: 'COD: "sinfonische Dichtung". Chữ cũ: "symphonische Dichtung" (chính tả cũ); đổi theo nguồn đã mở.'
  - id: n2
    cau: Richard Strauss ưa gọi thể loại này là Tondichtung, "thơ bằng âm thanh".
    loai: ten
    nguon:
      - cod-sp
    ket_qua: da-sua
    ghi_chu: 'COD: Strauss "preferred the term Tondichtung"; thường dịch "tone-poem", COD gợi "sound-poem" sát ý hơn. Chữ cũ: "gọi là"; đổi thành "ưa gọi là".'
  - id: n3
    cau: Symphonic poem là nhạc kể chuyện một chương cho dàn nhạc.
    loai: dinh-nghia
    nguon:
      - cod-sp
      - brit-sp
    ket_qua: dung
    ghi_chu: 'COD: "one-movement orchestral works" theo chương trình; Britannica: "single-movement symphonic poem", dựa trên một chương trình ngoài âm nhạc.'
  - id: n4
    cau: Franz Liszt đặt ra tên gọi symphonic poem và viết 13 tác phẩm như vậy.
    loai: lich-su
    nguon:
      - cod-sp
      - brit-sp
    ket_qua: da-sua
    ghi_chu: 'COD: Liszt áp dụng tên cho 13 tác phẩm một chương; Britannica: "Both the term symphonic poem and the form itself were invented by Franz Liszt". Chữ cũ: "vào thập niên 1850"; bỏ mốc vì nguồn đã mở không nêu năm đặt tên (Britannica ghi Les Préludes 1848; BSO ghi diễn lần đầu 1854).'
  - id: n5
    cau: Khác với giao hưởng "thuần túy", symphonic poem chỉ có một chương và bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.
    loai: dinh-nghia
    nguon:
      - cod-sp
      - brit-sp
    ket_qua: da-sua
    ghi_chu: 'COD: tác phẩm một chương ở quy mô giao hưởng nhưng không phải giao hưởng "pure" vì có chương trình. Chữ cũ: "giao hưởng (4 chương, cấu trúc trừu tượng)": "4 chương" không áp cho mọi giao hưởng, "trừu tượng" không có nguồn.'
  - id: n6
    cau: Người nghe thường được cho một chương trình (program), vài dòng tóm tắt câu chuyện, rồi âm nhạc diễn lại bằng chủ đề và màu sắc dàn nhạc.
    loai: dinh-nghia
    nguon:
      - brit-sp
      - bso-lp
    ket_qua: dung
    ghi_chu: 'Britannica: tác phẩm dựa trên "program" ngoài âm nhạc, tên thường nhắc tới nó; BSO: Liszt in kèm lời tựa (paraphrase từ Lamartine) cho Les Préludes.'
  - id: n7
    cau: "Một nhân vật có thể có chủ đề riêng: Till Eulenspiegel có hai chủ đề, một cho kèn horn và một cho clarinet."
    loai: cau-truc
    nguon:
      - riphil-till
    ket_qua: da-sua
    ghi_chu: 'Rhode Island Philharmonic: hai chủ đề của Till, "a comic-heroic horn call" và "a jaunty whistling tune" (clarinet Rê). Chữ cũ: "Mỗi nhân vật/sự kiện có chủ đề riêng (gần với idée fixe của Berlioz)": tổng quát hóa và so sánh Berlioz không có nguồn đã mở.'
  - id: n8
    cau: Chủ đề có thể biến hình qua các đoạn, như trong Les Préludes của Liszt.
    loai: cau-truc
    nguon:
      - brit-sp
      - bso-lp
    ket_qua: da-sua
    ghi_chu: 'Britannica: Liszt dùng "thematic transformation to parallel the poetic emotions", ví dụ Les Préludes; BSO: các dẫn xuất của chủ đề chính. Chữ cũ: "Chủ đề biến hình theo diễn biến truyện (vui → bi tráng, ngây thơ → anh hùng)": bỏ ví dụ không nguồn.'
  - id: n9
    cau: Hình thức của symphonic poem tự do, chỉ gần với hình thức sonata của chương đầu giao hưởng.
    loai: dinh-nghia
    nguon:
      - brit-sp
    ket_qua: da-sua
    ghi_chu: 'Britannica: "The musical form is free, though somewhat akin to the sonata form used in the first movement of symphonies." Chữ cũ: "uốn theo câu chuyện chứ không theo khuôn sonata cứng nhắc".'
  - id: n10
    cau: Moldau (Vltava) là chương thứ hai trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana.
    loai: danh-muc
    nguon:
      - laphil-moldau
      - classic-moldau
    ket_qua: da-sua
    ghi_chu: "LA Phil: một trong sáu symphonic poem của Má vlast; Classic Note: Vltava là chương thứ hai, thứ tự Vyšehrad, Vltava, Šárka, From Bohemia's Woods and Fields, Tábor, Blaník. Chữ cũ: \"chương nổi tiếng nhất\"; bỏ xếp hạng."
  - id: n11
    cau: Moldau là chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague.
    loai: cau-truc
    nguon:
      - laphil-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: chương trình của Smetana: sông bắt nguồn từ hai con suối, "in a broad stream toward Prague", rồi đổ vào Elbe.'
  - id: n12
    cau: "Bảng Moldau, đoạn 1: hai con suối nhỏ (sáo) hợp thành sông; hai dòng nhạc mỏng hòa vào nhau."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'Classic Note: hai sáo mở đầu, một cho suối lạnh, một cho suối ấm, hòa dần, rồi clarinet vào; LA Phil: hai suối "one warm the other cold".'
  - id: n13
    cau: "Bảng Moldau, đoạn 2: sông lớn dần; giai điệu Moldau nổi tiếng cất lên ở dây."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: "Classic Note: violin chơi giai điệu chính; LA Phil: chủ đề sol trưởng do dây cao và woodwind giới thiệu, dây trầm gợi sóng."
  - id: n14
    cau: "Bảng Moldau, đoạn 3: thợ săn trong rừng; tiếng kèn horn."
    loai: cau-truc
    nguon:
      - classic-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'Lansdowne: "Hunt: Horns suggest a hunt in the forest"; Classic Note: horn, kèn săn. LA Phil (bản tóm tắt) không nhắc cảnh săn trong đoạn trích chương trình.'
  - id: n15
    cau: "Bảng Moldau, đoạn 4: đám cưới nông dân; điệu nhảy vui (polka)."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: "a meadow where the peasants are celebrating a wedding"; Lansdowne: "played as a polka"; Classic Note: polka kiểu dân gian Czech.'
  - id: n16
    cau: "Bảng Moldau, đoạn 5: tiên nữ dưới trăng; sáo và oboe trao nhau câu nhạc cao, dây lung linh."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: da-sua
    ghi_chu: 'LA Phil: "In the silver moonlight the river nymphs frolic"; Lansdowne, Classic Note: flute và oboe (Classic Note thêm dây lung linh). Chữ cũ: "Sáo và kèn êm đềm, lung linh": "kèn" không rõ, đổi thành oboe.'
  - id: n17
    cau: "Bảng Moldau, đoạn 6: thác ghềnh St. John; dàn nhạc ào ạt, dữ dội nhất."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: "The Moldau foams and surges in the Rapids of St. John"; Classic Note: toàn dàn nhạc fortissimo, đoạn cao trào.'
  - id: n18
    cau: "Bảng Moldau, đoạn 7: qua Prague, đổ ra sông Elbe; giai điệu Moldau trở lại, hùng tráng rồi xa dần."
    loai: cau-truc
    nguon:
      - classic-moldau
      - laphil-moldau
      - lansdowne-moldau
    ket_qua: dung
    ghi_chu: 'LA Phil: sông chảy tới Prague, Vyšehrad hiện bên bờ, rồi "yielding itself up to the Elbe"; Classic Note: chủ đề chính chuyển từ Mi thứ sang Mi trưởng khi tới thành phố.'
  - id: n19
    cau: "Nghe một mạch và đánh dấu mỗi lần cảnh đổi, âm nhạc đổi thế nào: bài tập nghe âm nhạc miêu tả."
    loai: khuyen-tap
    ket_qua: khong-can-nguon
  - id: n20
    cau: Les Préludes của Liszt được ưa chuộng nhất trong các symphonic poem của ông.
    loai: lich-su
    nguon:
      - bso-lp
    ket_qua: da-sua
    ghi_chu: "BSO: \"the most popular of Liszt's symphonic poems\". Chữ cũ: \"Nổi tiếng nhất của Liszt\": mơ hồ (cả các tác phẩm của ông); thu hẹp theo nguồn."
  - id: n21
    cau: 'Les Préludes: câu hỏi "đời là gì?".'
    loai: cau-truc
    nguon:
      - bso-lp
    ket_qua: dung
    ghi_chu: 'BSO: lời tựa Liszt cho: "What is life but a series of preludes to that unknown song whose initial solemn note is tolled by Death?"'
  - id: n22
    cau: "Smetana, Moldau: dòng sông Vltava."
    loai: ten
    nguon:
      - laphil-moldau
    ket_qua: dung
    ghi_chu: Như n10, n11.
  - id: n23
    cau: "R. Strauss, Don Juan: gã Don Juan đa tình, kết thúc bi thảm."
    loai: cau-truc
    nguon:
      - brit-dj
    ket_qua: dung
    ghi_chu: 'Britannica: dựa theo Nikolaus Lenau; nhắc "an evening liaison"; kết thúc nhạt dần, bi thương, theo cuối đời nhân vật. Nguồn không dùng chữ "đa tình" nhưng nội dung khớp.'
  - id: n24
    cau: "R. Strauss, Till Eulenspiegel: chàng láu cá Till và những trò tinh nghịch."
    loai: cau-truc
    nguon:
      - riphil-till
    ket_qua: da-sua
    ghi_chu: 'Rhode Island Philharmonic: Till là nhân vật có thật thế kỷ 14, nổi tiếng với trò đùa và thói coi thường quyền uy, "a real scamp". Chữ cũ: "Chàng hề láu cá"; "hề" không có nguồn.'
  - id: n25
    cau: 'Debussy, La mer (Biển cả): ba "phác thảo giao hưởng" về biển.'
    loai: ten
    nguon:
      - laphil-mer
    ket_qua: dung
    ghi_chu: 'LA Phil: La mer, trois esquisses symphoniques, ba phần: "From Dawn to Noon on the Sea", "Play of the Waves", "Dialogue of the Wind and the Sea".'
  - id: n26
    cau: "Sibelius, Finlandia: lòng yêu nước Phần Lan."
    loai: lich-su
    nguon:
      - bso-fin
    ket_qua: dung
    ghi_chu: 'BSO: tone poem, viết cho "Press Days" 1899 của những người dân tộc chủ nghĩa phản đối sự kiểm soát của Nga, về sau thành một thứ quốc ca thứ hai.'
  - id: n27
    cau: Tchaikovsky gọi 1812 là overture, Smetana gọi Moldau là symphonic poem.
    loai: ten
    nguon:
      - tr-1812
      - laphil-moldau
    ket_qua: dung
    ghi_chu: 'Tchaikovsky Research: "festival overture"; LA Phil: Moldau là một trong sáu "symphonic poems".'
  - id: n28
    cau: Cả overture hòa nhạc và symphonic poem đều là một chương cho dàn nhạc và có nội dung kể chuyện.
    loai: dinh-nghia
    nguon:
      - cod-co
      - brit-sp
    ket_qua: dung
    ghi_chu: "COD: concert overture là tác phẩm một chương; một số gần symphonic poem; Britannica: symphonic poem một chương dựa trên chương trình."
  - id: n29
    cau: Symphonic poem phát triển từ concert overture, và một số concert overture gần với symphonic poem.
    loai: lich-su
    nguon:
      - cod-co
      - brit-sp
    ket_qua: da-sua
    ghi_chu: 'Britannica: symphonic poem "grew out of the concert overture"; COD: một số concert overture "come close to the symphonic poem". Chữ cũ: "ranh giới mờ ... Cách gọi thường do chính nhà soạn nhạc đặt": vế sau không có nguồn.'
  - id: n30
    cau: "Nhạc chương trình (program music) là khái niệm rộng hơn: nhạc dựa trên nội dung ngoài âm nhạc, như symphonic poem."
    loai: dinh-nghia
    nguon:
      - brit-sp
      - cod-sp
    ket_qua: da-sua
    ghi_chu: 'Britannica: dựa trên "non-musical program"; COD: symphonic poem gắn chặt với program music. Chữ cũ: "bao trùm cả hai" (cả overture hòa nhạc); bỏ vì không nguồn nào nói mọi overture hòa nhạc là nhạc chương trình.'
  - id: n31
    cau: Liên kết "Overture hòa nhạc" dẫn tới /opus/hinh-thuc/overture/.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đã kiểm: src/content/docs/hinh-thuc/overture.md có trên nhánh (trang thuộc cùng lô)."
  - id: n32
    cau: "Bảng Nghe để luyện: Smetana, Moldau: 7 cảnh sông nước (bảng trên)."
    loai: ve-site
    ket_qua: dung
    ghi_chu: Bảng đoạn của Moldau trên trang có đúng 7 hàng (đã kiểm).
  - id: n33
    cau: "Bảng Nghe để luyện: Liszt, Les Préludes: một chủ đề biến hình qua các đoạn."
    loai: cau-truc
    nguon:
      - brit-sp
      - bso-lp
    ket_qua: dung
    ghi_chu: "Như n8; BSO: các dẫn xuất của chủ đề chính; thuộc cùng một chất liệu (cantata Les Quatre Élémens)."
  - id: n34
    cau: "Bảng Nghe để luyện: R. Strauss, Till Eulenspiegel: hai chủ đề của Till (láu cá)."
    loai: cau-truc
    nguon:
      - riphil-till
    ket_qua: dung
    ghi_chu: Như n7.
khuong_nhac: []
ghi_chu: 'Trang symphonic poem (tầng lõi), không có khối abc (chỉ bảng và hình mermaid không có; không có quiz). Nguồn chính: COD qua Encyclopedia.com (symphonic poem, concert overture), Britannica (Symphonic poem; Don Juan), BSO (Les Préludes, Finlandia), LA Phil (Moldau, La mer), Rhode Island Philharmonic (Till), Lansdowne Symphony Orchestra và Classic Note (nhạc cụ từng đoạn Moldau; Classic Note là blog, bậc 3, chỉ đi kèm nguồn bậc 2) (WebFetch ngày 29/10/2026, bản tóm tắt chữ; chỗ quan trọng đã hỏi lại). Mục Nguồn cũ dựa vào Wikipedia; đã thay bằng nguồn bậc 2 đã mở. Chữ đã sửa: bỏ "vào thập niên 1850" (n4), "4 chương, cấu trúc trừu tượng" thành "thuần túy, một chương" (n5), chữ Đức theo COD (n1), bỏ so sánh idée fixe và ví dụ biến hình không nguồn (n7, n8), "tự do, không theo khuôn sonata cứng nhắc" thành theo Britannica (n9), "nổi tiếng nhất" của Moldau và Les Préludes (n10, n20), đoạn 5 của bảng (n16), Till là "chàng láu cá" không phải "chàng hề" (n24), mục Phân biệt nhanh (n29, n30). Lô trước yêu cầu giữ (grep hinh-thuc/symphonic-poem trong kiem-dinh/): không có câu nào trỏ tới. Thống nhất với trang đã chuyển: lich-su/thoi-ky/lang-man (nhạc chương trình, thơ giao hưởng của Liszt): khớp. Chữ trang không có năm sinh–mất nhà soạn nhạc. Câu ve-site trỏ trang: n31 (hinh-thuc/overture, đã có ở nhánh), tai-lieu-tham-khao (ở mục Nguồn, link không phải nhận định). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): symphonic poem (thơ giao hưởng), tone poem / Tondichtung, program music (nhạc chương trình), concert overture. Ghi chú cho người giao: La mer của Debussy nằm trong bảng "Các tác phẩm nên biết" nhưng Debussy gọi là "ba phác thảo giao hưởng", không phải symphonic poem; trang chỉ nói "ba phác thảo giao hưởng", không gán nhãn, nên không sai. Chưa chắc: không còn.'
doi_chu:
  - cu: 'Symphonic poem (tiếng Đức: symphonische Dichtung; Richard Strauss gọi là Tondichtung, "thơ bằng âm thanh") là nhạc kể chuyện một chương cho dàn nhạc. Franz Liszt đặt ra tên gọi này vào thập niên 1850 và viết 13 tác phẩm như vậy. Khác với giao hưởng (4 chương, cấu trúc trừu tượng), symphonic poem bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.'
    moi: 'Symphonic poem (tiếng Đức: sinfonische Dichtung; Richard Strauss ưa gọi là Tondichtung, "thơ bằng âm thanh") là nhạc kể chuyện một chương cho dàn nhạc. Franz Liszt đặt ra tên gọi này và viết 13 tác phẩm như vậy. Khác với giao hưởng "thuần túy", symphonic poem chỉ có một chương và bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.'
    ly_do: 'n1, n2 (da-sua): COD.; n4, n5 (da-sua): COD, Britannica; bỏ mốc "thập niên 1850" và "4 chương, cấu trúc trừu tượng".'
  - cu:
      - Mỗi nhân vật/sự kiện có chủ đề riêng (gần với ý tưởng idée fixe của Berlioz).
      - Chủ đề biến hình theo diễn biến truyện (vui → bi tráng, ngây thơ → anh hùng).
      - Hình thức tự do, uốn theo câu chuyện chứ không theo khuôn sonata cứng nhắc.
    moi:
      - "Một nhân vật có thể có chủ đề riêng: Till Eulenspiegel có hai chủ đề, một cho kèn horn và một cho clarinet."
      - Chủ đề có thể biến hình qua các đoạn, như trong Les Préludes của Liszt.
      - Hình thức tự do, chỉ gần với hình thức sonata của chương đầu giao hưởng.
    ly_do: "n7 (da-sua): bỏ so sánh Berlioz không nguồn.; n8 (da-sua): Britannica, BSO; bỏ ví dụ không nguồn.; n9 (da-sua): Britannica."
  - cu: 'Moldau (sông Vltava) là chương nổi tiếng nhất trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana — một chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague:'
    moi: 'Moldau (sông Vltava) là chương thứ hai trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana — một chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague:'
    ly_do: "n10 (da-sua): bỏ xếp hạng."
  - cu: Sáo và kèn êm đềm, lung linh
    moi: Sáo và oboe trao nhau câu nhạc cao, dây lung linh
    ly_do: "n16 (da-sua): Classic Note, LA Phil."
  - cu: Nổi tiếng nhất của Liszt; câu hỏi "đời là gì?"
    moi: Được ưa chuộng nhất trong các symphonic poem của Liszt; câu hỏi "đời là gì?"
    ly_do: "n20 (da-sua): BSO."
  - cu: Chàng hề láu cá và trò tinh nghịch
    moi: Chàng láu cá Till và những trò tinh nghịch
    ly_do: 'n24 (da-sua): "hề" không có nguồn.'
  - cu:
      - "Overture hòa nhạc vs symphonic poem: ranh giới mờ — 1812 của Tchaikovsky gọi là overture, Moldau gọi là symphonic poem; cả hai đều một chương và kể chuyện. Cách gọi thường do chính nhà soạn nhạc đặt."
      - Nhạc chương trình (program music) là khái niệm rộng hơn, bao trùm cả hai.
    moi:
      - "Overture hòa nhạc vs symphonic poem: 1812 của Tchaikovsky gọi là overture, Moldau gọi là symphonic poem; cả hai là một chương cho dàn nhạc và có nội dung kể chuyện. Symphonic poem phát triển từ concert overture, và một số concert overture gần với symphonic poem."
      - "Nhạc chương trình (program music) là khái niệm rộng hơn: nhạc dựa trên nội dung ngoài âm nhạc, như symphonic poem."
    ly_do: "n29, n30 (da-sua): Britannica, COD."
  - cu:
      - 'Wikipedia, Symphonic poem: định nghĩa thơ giao hưởng; chữ Tondichtung có từ Carl Loewe (1828); Liszt dùng tên Symphonische Dichtung cho các tác phẩm loại này của ông; Richard Strauss và Sibelius thích chữ "tone poem"; phép biến hình chủ đề của Liszt; Smetana gắn chủ đề với nhân vật, gần với cách làm của Berlioz; Má vlast là chùm sáu thơ giao hưởng.'
      - 'Wikipedia, Les Préludes: thơ giao hưởng thứ ba của Liszt, diễn lần đầu ngày 23/2/1854, là tác phẩm cho dàn nhạc sớm nhất mang tên "thơ giao hưởng"; mọi chủ đề sinh ra từ cùng một tế bào ba nốt, tiếp nối idée fixe của Berlioz; lời tựa in kèm tổng phổ hỏi phải chăng đời người chỉ là một chuỗi khúc dạo đầu. Ghi chú chương trình của Boston Symphony Orchestra (John N. Burk, Steven Ledbetter): Les Préludes là thơ giao hưởng được ưa chuộng nhất của Liszt.'
      - "Moldau: Wikipedia Má vlast (lời Smetana tả dòng sông: hai con suối đầu nguồn, rừng và đồng cỏ, đám cưới nông dân, vũ điệu tiên nữ dưới trăng, thác St. John, qua Praha rồi khuất xa ở sông Elbe) và Wikipedia tiếng Đức Die Moldau (tiêu đề Smetana ghi trong tổng phổ; sáo rồi clarinet tả hai con suối, giai điệu chính ở violin, kèn horn trong cảnh săn, nhịp polka ở đám cưới, sáo và clarinet trong cảnh dưới trăng, đoạn thác là chỗ to nhất bài)."
      - "Các tác phẩm khác, Wikipedia: Don Juan (Strauss) (theo Lenau, Don Juan đi tìm người phụ nữ lý tưởng và kết thúc bằng cái chết), Till Eulenspiegel's Merry Pranks (Till có hai chủ đề, một cho kèn horn, một cho clarinet Rê), La mer (Debussy) (trois esquisses symphoniques), Finlandia, Program music (nhạc chương trình là khái niệm rộng; những tác phẩm một chương cho dàn nhạc thế kỷ 19 thường gọi là thơ giao hưởng)."
    moi:
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: symphonic poem (một chương, theo chương trình; Liszt đặt tên và viết 13 tác phẩm; Strauss ưa chữ Tondichtung; Smetana viết theo thể loại này), concert overture."
      - "Britannica, Symphonic poem: Liszt đặt ra thể loại; hình thức tự do, gần hình thức sonata; biến hình chủ đề; phát triển từ concert overture."
      - "Les Préludes: Boston Symphony Orchestra, Liszt, Les Préludes (diễn lần đầu ở Weimar ngày 23/2/1854; \"the most popular of Liszt's symphonic poems\"; lời tựa hỏi đời người có phải chỉ là chuỗi khúc dạo đầu)."
      - "Moldau: LA Phil, The Moldau (chương trình của Smetana, một trong sáu symphonic poem Má vlast), Lansdowne Symphony Orchestra, Moldau và Classic Note, Smetana, Vltava (nhạc cụ từng đoạn)."
      - "Các tác phẩm khác: Britannica, Don Juan (theo Lenau, kết thúc nhạt dần theo cuối đời nhân vật); Rhode Island Philharmonic, Till Eulenspiegel (hai chủ đề của Till); LA Phil, La mer (trois esquisses symphoniques); Boston Symphony Orchestra, Sibelius, Finlandia (viết trong bối cảnh phản kháng sự kiểm duyệt của Nga ở Phần Lan)."
    ly_do: "Mục Nguồn: Wikipedia chỉ để tìm nguồn (chuẩn kiểm định mục 2); thay bằng nguồn bậc 2 đã mở."
