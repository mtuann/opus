ghi_chu: 'Trang symphonic poem (tầng lõi), không có khối abc (chỉ bảng và hình mermaid không có; không có quiz). Nguồn chính: COD qua Encyclopedia.com (symphonic poem, concert overture), Britannica (Symphonic poem; Don Juan), BSO (Les Préludes, Finlandia), LA Phil (Moldau, La mer), Rhode Island Philharmonic (Till), Lansdowne Symphony Orchestra và Classic Note (nhạc cụ từng đoạn Moldau; Classic Note là blog, bậc 3, chỉ đi kèm nguồn bậc 2) (WebFetch ngày 29/10/2026, bản tóm tắt chữ; chỗ quan trọng đã hỏi lại). Mục Nguồn cũ dựa vào Wikipedia; đã thay bằng nguồn bậc 2 đã mở. Chữ đã sửa: bỏ "vào thập niên 1850" (n4), "4 chương, cấu trúc trừu tượng" thành "thuần túy, một chương" (n5), chữ Đức theo COD (n1), bỏ so sánh idée fixe và ví dụ biến hình không nguồn (n7, n8), "tự do, không theo khuôn sonata cứng nhắc" thành theo Britannica (n9), "nổi tiếng nhất" của Moldau và Les Préludes (n10, n20), đoạn 5 của bảng (n16), Till là "chàng láu cá" không phải "chàng hề" (n24), mục Phân biệt nhanh (n29, n30). Lô trước yêu cầu giữ (grep hinh-thuc/symphonic-poem trong kiem-dinh/): không có câu nào trỏ tới. Thống nhất với trang đã chuyển: lich-su/thoi-ky/lang-man (nhạc chương trình, thơ giao hưởng của Liszt): khớp. Chữ trang không có năm sinh–mất nhà soạn nhạc. Câu ve-site trỏ trang: n31 (hinh-thuc/overture, đã có ở nhánh), tai-lieu-tham-khao (ở mục Nguồn, link không phải nhận định). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): symphonic poem (thơ giao hưởng), tone poem / Tondichtung, program music (nhạc chương trình), concert overture. Ghi chú cho người giao: La mer của Debussy nằm trong bảng "Các tác phẩm nên biết" nhưng Debussy gọi là "ba phác thảo giao hưởng", không phải symphonic poem; trang chỉ nói "ba phác thảo giao hưởng", không gán nhãn, nên không sai. Chưa chắc: không còn.'
doi_chu:
  - cu: 'Symphonic poem (tiếng Đức: symphonische Dichtung; Richard Strauss gọi là Tondichtung, "thơ bằng âm thanh") là nhạc kể chuyện một chương cho dàn nhạc. Franz Liszt đặt ra tên gọi này vào thập niên 1850 và viết 13 tác phẩm như vậy. Khác với giao hưởng (4 chương, cấu trúc trừu tượng), symphonic poem bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.'
    moi: 'Symphonic poem (tiếng Đức: sinfonische Dichtung; Richard Strauss ưa gọi là Tondichtung, "thơ bằng âm thanh") là nhạc kể chuyện một chương cho dàn nhạc. Franz Liszt đặt ra tên gọi này và viết 13 tác phẩm như vậy. Khác với giao hưởng "thuần túy", symphonic poem chỉ có một chương và bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.'
    ly_do: 'n1, n2 (da-sua): COD.; n4, n5 (da-sua): COD, Britannica; bỏ mốc "thập niên 1850" và "4 chương, cấu trúc trừu tượng".'
  - cu:
      - Mỗi nhân vật/sự kiện có chủ đề riêng (gần với ý tưởng idée fixe của Berlioz).
      - Chủ đề biến hình theo diễn biến truyện (vui → bi tráng, ngây thơ → anh hùng).
      - Hình thức tự do, uốn theo câu chuyện chứ không theo khuôn sonata cứng nhắc.
    moi:
      - "Một nhân vật có thể có chủ đề riêng: Till Eulenspiegel có hai chủ đề, một cho kèn horn và một cho clarinet."
      - Chủ đề có thể biến hình qua các đoạn, như trong Les Préludes của Liszt.
      - Hình thức tự do, chỉ gần với hình thức sonata của chương đầu giao hưởng.
    ly_do: "n7 (da-sua): bỏ so sánh Berlioz không nguồn.; n8 (da-sua): Britannica, BSO; bỏ ví dụ không nguồn.; n9 (da-sua): Britannica."
  - cu: 'Moldau (sông Vltava) là chương nổi tiếng nhất trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana — một chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague:'
    moi: 'Moldau (sông Vltava) là chương thứ hai trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana — một chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague:'
    ly_do: "n10 (da-sua): bỏ xếp hạng."
  - cu: Sáo và kèn êm đềm, lung linh
    moi: Sáo và clarinet đan những hình nốt gợn sóng; violin dùng bộ giảm âm chơi giai điệu cao, có đàn hạc
    ly_do: "n16 (da-sua): Classic Note, LA Phil.; n16 (da-sua, review D5-gom): đoạn ánh trăng là sáo và clarinet, violin dùng bộ giảm âm, không phải oboe (Lakeview Orchestra; Understanding Music, CUNY)."
  - cu: Nổi tiếng nhất của Liszt; câu hỏi "đời là gì?"
    moi: Được ưa chuộng nhất trong các symphonic poem của Liszt; câu hỏi "đời là gì?"
    ly_do: "n20 (da-sua): BSO."
  - cu: Chàng hề láu cá và trò tinh nghịch
    moi: Chàng láu cá Till và những trò tinh nghịch
    ly_do: 'n24 (da-sua): "hề" không có nguồn.'
  - cu:
      - "Overture hòa nhạc vs symphonic poem: ranh giới mờ — 1812 của Tchaikovsky gọi là overture, Moldau gọi là symphonic poem; cả hai đều một chương và kể chuyện. Cách gọi thường do chính nhà soạn nhạc đặt."
      - Nhạc chương trình (program music) là khái niệm rộng hơn, bao trùm cả hai.
    moi:
      - "Overture hòa nhạc vs symphonic poem: 1812 của Tchaikovsky gọi là overture, Moldau gọi là symphonic poem; cả hai là một chương cho dàn nhạc và có nội dung kể chuyện. Symphonic poem phát triển từ concert overture, và một số concert overture gần với symphonic poem."
      - "Nhạc chương trình (program music) là khái niệm rộng hơn: nhạc dựa trên nội dung ngoài âm nhạc, như symphonic poem."
    ly_do: "n29, n30 (da-sua): Britannica, COD."
  - cu:
      - 'Wikipedia, Symphonic poem: định nghĩa thơ giao hưởng; chữ Tondichtung có từ Carl Loewe (1828); Liszt dùng tên Symphonische Dichtung cho các tác phẩm loại này của ông; Richard Strauss và Sibelius thích chữ "tone poem"; phép biến hình chủ đề của Liszt; Smetana gắn chủ đề với nhân vật, gần với cách làm của Berlioz; Má vlast là chùm sáu thơ giao hưởng.'
      - 'Wikipedia, Les Préludes: thơ giao hưởng thứ ba của Liszt, diễn lần đầu ngày 23/2/1854, là tác phẩm cho dàn nhạc sớm nhất mang tên "thơ giao hưởng"; mọi chủ đề sinh ra từ cùng một tế bào ba nốt, tiếp nối idée fixe của Berlioz; lời tựa in kèm tổng phổ hỏi phải chăng đời người chỉ là một chuỗi khúc dạo đầu. Ghi chú chương trình của Boston Symphony Orchestra (John N. Burk, Steven Ledbetter): Les Préludes là thơ giao hưởng được ưa chuộng nhất của Liszt.'
      - "Moldau: Wikipedia Má vlast (lời Smetana tả dòng sông: hai con suối đầu nguồn, rừng và đồng cỏ, đám cưới nông dân, vũ điệu tiên nữ dưới trăng, thác St. John, qua Praha rồi khuất xa ở sông Elbe) và Wikipedia tiếng Đức Die Moldau (tiêu đề Smetana ghi trong tổng phổ; sáo rồi clarinet tả hai con suối, giai điệu chính ở violin, kèn horn trong cảnh săn, nhịp polka ở đám cưới, sáo và clarinet trong cảnh dưới trăng, đoạn thác là chỗ to nhất bài)."
      - "Các tác phẩm khác, Wikipedia: Don Juan (Strauss) (theo Lenau, Don Juan đi tìm người phụ nữ lý tưởng và kết thúc bằng cái chết), Till Eulenspiegel's Merry Pranks (Till có hai chủ đề, một cho kèn horn, một cho clarinet Rê), La mer (Debussy) (trois esquisses symphoniques), Finlandia, Program music (nhạc chương trình là khái niệm rộng; những tác phẩm một chương cho dàn nhạc thế kỷ 19 thường gọi là thơ giao hưởng)."
    moi:
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: symphonic poem (một chương, theo chương trình; Liszt đặt tên và viết 13 tác phẩm; Strauss ưa chữ Tondichtung; Smetana viết theo thể loại này), concert overture."
      - "Britannica, Symphonic poem: Liszt đặt ra thể loại; hình thức tự do, gần hình thức sonata; biến hình chủ đề; phát triển từ concert overture."
      - "Les Préludes: Boston Symphony Orchestra, Liszt, Les Préludes (diễn lần đầu ở Weimar ngày 23/2/1854; \"the most popular of Liszt's symphonic poems\"; lời tựa hỏi đời người có phải chỉ là chuỗi khúc dạo đầu)."
      - "Moldau: LA Phil, The Moldau (chương trình của Smetana, một trong sáu symphonic poem Má vlast), Lansdowne Symphony Orchestra, Moldau và Classic Note, Smetana, Vltava (nhạc cụ từng đoạn); Lakeview Orchestra, Smetana, Vltava và Understanding Music (BMCC, CUNY), hướng dẫn nghe Moldau (đoạn ánh trăng: sáo và clarinet, violin dùng bộ giảm âm, đàn hạc)."
      - "Các tác phẩm khác: Britannica, Don Juan (theo Lenau, kết thúc nhạt dần theo cuối đời nhân vật); Rhode Island Philharmonic, Till Eulenspiegel (hai chủ đề của Till); LA Phil, La mer (trois esquisses symphoniques); Boston Symphony Orchestra, Sibelius, Finlandia (viết trong bối cảnh phản kháng sự kiểm duyệt của Nga ở Phần Lan)."
    ly_do: "Mục Nguồn: Wikipedia chỉ để tìm nguồn (chuẩn kiểm định mục 2); thay bằng nguồn bậc 2 đã mở.; n16 (da-sua, review D5-gom): thêm hai nguồn của đoạn ánh trăng."
