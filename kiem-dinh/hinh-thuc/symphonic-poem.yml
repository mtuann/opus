    moi: 'mô tả: Symphonic poem (tiếng Đức: sinfonische Dichtung; Richard Strauss ưa gọi là Tondichtung, "thơ bằng âm thanh") là nhạc kể chuyện một chương cho dàn nhạc. Franz Liszt đặt ra tên gọi này.'
    ly_do: 'n1, n2 (da-sua): sinfonische Dichtung (COD); Strauss "ưa gọi là" Tondichtung.'
