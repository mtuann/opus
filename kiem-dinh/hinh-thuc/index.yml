  - cu: "Fugue là hình thức phức điệu đỉnh cao của Baroque: một chủ đề ngắn vào lần lượt ở từng bè, các bè đuổi theo và chồng lên nhau, xen giữa là những đoạn chuyển. Chi tiết và bài phân tích Bach Fugue cung Đô thứ BWV 847 ở trang Fugue."
    moi: "Fugue là hình thức phức điệu xây trên sự bắt chước một chủ đề: chủ đề vào lần lượt ở từng bè, các bè đuổi theo và chồng lên nhau, xen giữa là những đoạn chuyển. Các fugue của Bach là đỉnh cao của hình thức này. Chi tiết và bài phân tích Bach Fugue cung Đô thứ BWV 847 ở trang Fugue."
