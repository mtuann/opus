khuong_nhac: []
ghi_chu: "Lượt 1 (D5-L2 phần A). Trang index, 33 nhận định, không có khối abc, không có quiz. Chưa chắc: n4 (hình form-overview, xem lỗi hình). Các dòng n7, n9, n10, n11, n12 mô tả trang thuộc phần B/C, cần xem lại sau khi hai phần ấy xong. Thuật ngữ chưa có trong thuat-ngu.yml: hình thức, thể loại, ritornello, cadenza."
doi_chu:
  - cu: "Hình thức là cách một bản nhạc được sắp xếp theo thời gian: đoạn nào lặp lại, đoạn nào tương phản. Thể loại là loại tác phẩm, xác định bởi lực lượng biểu diễn và mục đích: giao hưởng, concerto, sonata…"
    moi: "Hình thức là cách một bản nhạc được sắp xếp theo thời gian: đoạn nào lặp lại, đoạn nào tương phản. Thể loại là loại tác phẩm quen thuộc: giao hưởng, concerto, sonata…"
    ly_do: "n2 (da-sua): bỏ vế không nguồn."
  - cu: "Khúc mở màn: từ mở đầu opera đến overture hòa nhạc kể chuyện."
    moi: "Khúc mở màn: từ mở đầu opera đến overture hòa nhạc độc lập."
    ly_do: 'n13 (da-sua): "kể chuyện" thuộc symphonic poem.'
  - cu: Chopin Prélude Op. 28 số 15 Giọt mưa
    moi: Chopin Mazurka La thứ Op. 17 số 4
    ly_do: "n17 (da-sua): khớp ví dụ ba đoạn ở trang 31 đã khóa."
  - cu: Điệu múa 3/4, đoạn giữa (trio) nhẹ hơn
    moi: Điệu múa 3/4, đoạn giữa (trio) thường nhẹ nhàng hơn
