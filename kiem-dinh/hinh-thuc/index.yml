  - cu: "Hình thức quan trọng nhất của thời Cổ điển và Lãng mạn, thường dùng cho chương đầu của giao hưởng, sonata, concerto, tứ tấu: trình bày hai chủ đề ở hai giọng, phát triển chúng qua nhiều giọng, rồi tái hiện cả hai ở giọng chính, thường có thêm coda. Chi tiết và bài phân tích Mozart Sonata K. 545 ở trang Hình thức sonata."
