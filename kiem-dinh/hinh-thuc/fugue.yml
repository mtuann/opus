ghi_chu: 'Trang fugue (tầng lõi), không có khối abc (chỉ bảng, một sơ đồ mermaid và quiz). Nguồn chính: Open Music Theory (High Baroque Fugal Exposition, ví dụ chính là chính fugue BWV 847; Modal Mixture), COD qua Encyclopedia.com (fugue, stretto, pedal, tierce de Picardie), Mutopia (Fuga II BWV 847, tệp .ly ấn bản Peters; WebFetch ngày 29/10/2026 trả chữ của tệp .ly, số ô và các lần vào đếm tay từ tệp ấy, không chạy công cụ lyrel), Britannica (năm quyển 1 Bình quân luật). Chữ đã sửa: bỏ "đỉnh cao của thời Baroque" (n3), số bè (n4), chủ đề, đối đề, đoạn chuyển, stretto, âm nền (n6, n9, n11, n12, n13), bỏ "khoảng 1,5 phút" (n20) và "nhịp nhanh và rõ, tốt nhất để bắt đầu" (n21), bỏ "nhảy nhót" (n22), sửa chỗ nói ô 26 và 29 (n27), sửa "rất phổ biến trong nhạc Baroque" của quãng 3 Picardy theo OMT (n31), bỏ chi tiết BWV 578 không nguồn (n34), mục Nguồn. Lô trước yêu cầu giữ (grep hinh-thuc/fugue trong kiem-dinh/): (1) trang đối âm (nhac-ly/22, n4): giữ đường dẫn /opus/hinh-thuc/fugue/ và nội dung giải thích fugue: KHỚP; (2) bài 23 hợp âm mượn (n16): giữ đoạn nêu tên quãng 3 Picardy và kiểm lại vế "rất phổ biến trong nhạc Baroque": KHỚP, đã giữ đoạn, vế ấy đã sửa theo OMT (n30, n31; bài 23 n15 đã khóa nói cùng điều: phổ biến ở thế kỷ 16–17, ít dần ở thế kỷ 18–19); (3) lịch sử Baroque (n45), nhac-ly/index, piano/nha-soan-nhac: giữ đường dẫn: KHỚP. Thống nhất với trang đã khóa: piano/the-loai (fugue là bản phức điệu mà chủ đề được các bè lần lượt bắt chước; Bình quân luật quyển 1 năm 1722): khớp. Chữ trang không có năm sinh–mất nhà soạn nhạc. Câu ve-site trỏ trang chưa chuyển: n33 (piano/tac-pham/bach-prelude-fugue-do-thu: giữ đường dẫn, bài học về BWV 847), n38 (nhac-cu/dan-nhac), n39 (tai-lieu-tham-khao); n14 (bài 18) đã có. Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): subject (chủ đề), answer (đáp đề), countersubject (đối đề), episode (đoạn chuyển), stretto, pedal point (âm nền), Picardy third (quãng 3 Picardy); exposition (phần trình bày), polyphony, fugue đã có.'
doi_chu:
  - cu: 'Fugue là hình thức phức điệu đỉnh cao của thời Baroque: nhiều bè độc lập lần lượt "đuổi theo" nhau bằng cùng một chủ đề. Tên gọi từ tiếng Latin fuga, nghĩa là "chạy trốn".'
    moi: 'Fugue là hình thức phức điệu: nhiều bè độc lập lần lượt "đuổi theo" nhau bằng cùng một chủ đề. Tên gọi có gốc từ tiếng Latin fuga, nghĩa là "chạy trốn".'
    ly_do: 'n3 (da-bo): bỏ vế xếp hạng "đỉnh cao của thời Baroque", không có nguồn.; n3 (da-bo): mô tả bỏ "đỉnh cao của thời Baroque" (câu xếp hạng, nguồn không nói).; n3 (da-bo): mô tả bỏ "đỉnh cao của thời Baroque".; n3 (da-bo): mô tả bỏ "đỉnh cao của thời Baroque".'
