nhan_dinh:
  - id: n1
    cau: "Fugue là hình thức phức điệu: nhiều bè độc lập lần lượt vào bằng cùng một chủ đề, như đuổi theo nhau."
    loai: dinh-nghia
    nguon:
      - cod-fugue
      - omt-fugue
    ket_qua: dung
    ghi_chu: 'COD: "The point of fugue is that the vv. enter successively in imitation of each other"; OMT: exposition là "each of the voices enters with the subject or answer".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/", "https://www.britannica.com/art/fugue" ]
    luot_2_ghi_chu: "OMT: các bè độc lập lần lượt vào với chủ đề; Britannica: mô phỏng hệ thống chủ đề."
  - id: n2
    cau: Tên gọi fugue có gốc từ tiếng Latin fuga, nghĩa là "chạy trốn".
    loai: ten
    nguon:
      - etym-fugue
    ket_qua: dung
    ghi_chu: 'Etymonline: từ tiếng Ý fuga ("flight"), từ Latin fuga, "a running away, act of fleeing", từ fugere "chạy trốn".'
    luot_2: dung
    luot_2_nguon: [ "https://www.merriam-webster.com/dictionary/fugue" ]
    luot_2_ghi_chu: 'Merriam-Webster: Ý fuga "flight" < Latin fuga, fugere "to flee".'
  - id: n3
    cau: Fugue là hình thức phức điệu đỉnh cao của thời Baroque.
    loai: lich-su
    nguon:
      - omt-fugue
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "hình thức phức điệu đỉnh cao của thời Baroque". Bỏ vế "đỉnh cao của thời Baroque": là nhận xét xếp hạng, nguồn đã mở không nói (OMT chỉ nói fugue là "the 18th-century equivalent and successor" của lối bắt chước thế kỷ 16; Britannica gọi cả tập Bình quân luật là "the largest-scale and most-influential undertaking for solo keyboard of the Baroque era", không nói về fugue nói chung). Chữ mới chỉ còn định nghĩa (n1).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/fugue" ]
    luot_2_ghi_chu: 'Britannica: fugue của Bach là đỉnh cao ("pinnacle").'
  - id: n4
    cau: Một bản fugue cho một người chơi đàn phím có thể có 3, 4, 5 hay 6 bè.
    loai: so-lieu
    nguon:
      - omt-fugue
    ket_qua: da-sua
    ghi_chu: 'OMT: "a keyboard fugue for one player may have three, four, five, or six voices". Chữ cũ: "Thường 3 hoặc 4 bè (soprano, alto, tenor, bass), kể cả khi chơi trên một cây đàn phím"; "thường" không có nguồn đếm.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: "OMT: fugue cho một người chơi đàn phím có thể ba đến sáu bè."
  - id: n5
    cau: "Các bè của fugue gọi tên theo giọng hát: soprano, alto, tenor, bass."
    loai: dinh-nghia
    nguon:
      - omt-fugue
    ket_qua: dung
    ghi_chu: OMT lấy kết cấu bốn bè SATB làm chuẩn.
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: "OMT: SATB = soprano, alto, tenor, bass."
  - id: n6
    cau: Chủ đề (subject) là giai điệu ngắn làm nền cho cả bản fugue và quay lại suốt bài.
    loai: dinh-nghia
    nguon:
      - omt-fugue
      - cod-fugue
    ket_qua: da-sua
    ghi_chu: 'OMT: "A short tune that forms the melodic basis of a fugue, recurring throughout." Chữ cũ: "Giai điệu chính, ngắn, dễ nhận ra"; bỏ "dễ nhận ra" (không nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: "OMT: subject là giai điệu ngắn, nền tảng của fugue, quay lại suốt bài."
  - id: n7
    cau: Chủ đề xuất hiện đầu tiên ở một bè đơn độc.
    loai: dinh-nghia
    nguon:
      - omt-fugue
    ket_qua: dung
    ghi_chu: 'OMT: "one voice begins with the subject, then the next voices enters with the answer while the first continues with a countersubject".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/", "https://www.kunstderfuge.com/theory/fugue.htm" ]
    luot_2_ghi_chu: "OMT: exposition khi mỗi bè lần lượt vào; BWV 847 mở đầu ô 1 ở alto một mình."
  - id: n8
    cau: Đáp đề (answer) là chủ đề nhắc lại ở bè thứ hai, cao hơn một quãng 5 hoặc thấp hơn một quãng 4, tức ở giọng át.
    loai: quy-tac
    nguon:
      - omt-fugue
      - cod-fugue
      - mut-847
    ket_qua: dung
    ghi_chu: 'OMT: "A real answer simply transposes the original subject by perfect fifth/fourth"; COD: các lần vào xen giữa chủ âm và át âm. OMT không nói chiều lên 5 hay xuống 4: hai cách cùng ra nốt át nên không đổi nghĩa. BWV 847: chủ đề Đô thứ, đáp đề Sol thứ (tệp .ly ô 3). Đáp đề "tonal" của BWV 847 đổi vài quãng (OMT), trang không nói tới.'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: 'OMT: answer cao quãng 5 hay thấp quãng 4; "tonal answer" chỉnh để tonic/dominant đổi chỗ. Câu "tức ở giọng át" đúng ở mức chung.'
  - id: n9
    cau: Đối đề (countersubject) là giai điệu đi cùng chủ đề hay đáp đề; ở phần trình bày, bè vào trước chơi nó trong lúc bè sau vào chủ đề hay đáp đề.
    loai: dinh-nghia
    nguon:
      - omt-fugue
    ket_qua: da-sua
    ghi_chu: 'OMT: "A melodic line that is sounded with (and complements) the subject/answer"; "while the first continues with a countersubject". Chữ cũ: "thường quay lại nhiều lần"; bỏ (không nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: "OMT: countersubject đi cùng subject/answer."
  - id: n10
    cau: Phần trình bày là đoạn đầu của fugue, khi mọi bè lần lượt vào với chủ đề hoặc đáp đề.
    loai: dinh-nghia
    nguon:
      - omt-fugue
    ket_qua: dung
    ghi_chu: 'OMT: "The first part of a fugue, during which each of the voices enters with the subject or answer."'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: "OMT: exposition là phần đầu, mỗi bè vào với subject hay answer."
  - id: n11
    cau: Đoạn chuyển (episode) là đoạn không có lần vào nào của chủ đề ở bất kỳ bè nào.
    loai: dinh-nghia
    nguon:
      - omt-fugue
    ket_qua: da-sua
    ghi_chu: 'OMT: "A passage of a fugue that does not contain a subject statement in any voice." Chữ cũ: "không có chủ đề trọn vẹn, thường dùng mảnh của chủ đề để chuyển sang giọng khác"; bỏ vế "mảnh chủ đề, chuyển giọng" (OMT và COD không nói; COD chỉ nói đoạn chuyển nối các lần vào).'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: "OMT: episode không có lần vào subject/answer ở bè nào."
  - id: n12
    cau: Stretto là các bè vào chủ đề chồng lấn nhau trước khi bè trước kết thúc, làm âm nhạc căng và dồn dập hơn.
    loai: dinh-nghia
    nguon:
      - cod-stretto
    ket_qua: da-sua
    ghi_chu: 'COD: "the answer enters before the subject has finished", làm tăng căng thẳng (heightens intensity). Chữ cũ: "tạo cao trào" (quiz: "thường tạo cao trào gần cuối"); "gần cuối" không có nguồn. Fugue BWV 847 trên trang không dùng stretto.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/stretto" ]
    luot_2_ghi_chu: "Britannica: stretto là lần vào chồng lấn, nén chủ đề, đẩy tới cao trào."
  - id: n13
    cau: Âm nền (pedal point) là một nốt giữ dài ở bè trầm trong lúc các hợp âm bên trên thay đổi.
    loai: dinh-nghia
    nguon:
      - cod-pedal
    ket_qua: da-sua
    ghi_chu: 'COD (pedal): "a note sustained below changing harmonies"; nghĩa khớp bài 18 đã khóa (âm nền thường ở bè trầm). Chữ cũ: "thường gần cuối"; bỏ (không nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/pedal-point" ]
    luot_2_ghi_chu: "Britannica: pedal point là nốt giữ, thường ở bè trầm, hòa âm bên trên đổi."
  - id: n14
    cau: Liên kết "bài 18" ở dòng Âm nền dẫn tới /opus/nhac-ly/18-am-ngoai-hop-am/.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: src/content/docs/nhac-ly/18-am-ngoai-hop-am.md có trên nhánh (bài 18 "Âm ngoài hợp âm", đã khóa, có đoạn âm nền). Review: đã kiểm src/content/docs/nhac-ly/18-am-ngoai-hop-am.md có.'
    review: dung
  - id: n15
    cau: "Sơ đồ: alto vào chủ đề; soprano vào đáp đề (alto chơi đối đề); đoạn chuyển; bass vào chủ đề; các đoạn chuyển và chủ đề ở nhiều giọng; âm nền và kết."
    loai: cau-truc
    nguon:
      - mut-847
    ket_qua: dung
    ghi_chu: "Khớp tệp .ly: ô 1–2 alto chủ đề, ô 3–4 soprano đáp đề với alto đối đề, ô 5–6 đoạn chuyển, ô 7–8 bass chủ đề, nhiều lần vào ở ô 11, 15, 20, 23, âm nền Đô từ giữa ô 29. mo/d5-hinh: sơ đồ nay là hình tĩnh của site (trước đây khối mermaid hiện nguyên mã); chữ và thứ tự giữ nguyên."
    luot_2: dung
    luot_2_nguon: [ "https://www.kunstderfuge.com/theory/fugue.htm", "https://tonic-chord.com/bach-prelude-and-fugue-no-2-in-c-minor-bwv-847-analysis/", "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: "Trình bày khớp: alto vào chủ đề (ô 1), soprano đáp đề (ô 3, alto đối đề), bass vào chủ đề (ô 7); âm nền Đô ở cuối (kunstderfuge, tonic-chord)."
  - id: n16
    cau: Fugue số 2 trong Bình quân luật quyển 1 là Fugue Đô thứ, BWV 847.
    loai: danh-muc
    nguon:
      - mut-847
    ket_qua: dung
    ghi_chu: 'Mutopia: "Das Wohltemperierte Clavier I, Fuga II", BWV 847, \key c \minor.'
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)", "https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/" ]
    luot_2_ghi_chu: 'IMSLP: Prelude and Fugue No. 2 in C minor, BWV 847; OMT dùng "C minor fugue from Book I (BWV 847)".'
  - id: n17
    cau: Quyển 1 của Bình quân luật ra năm 1722.
    loai: nam
    nguon:
      - brit-wtc
    ket_qua: dung
    ghi_chu: 'Britannica: "Book I: 1722". Khớp piano/the-loai (đã khóa).'
    luot_2: dung
    luot_2_nguon: [ "https://bach-cantatas.com/Pic-NonVocal-BIG/Pinnock-T-K09c[DGG-2CD-booklet].pdf", "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)" ]
    luot_2_ghi_chu: 'Pinnock: Bach hoàn thành quyển 1 ở Köthen năm 1722 (đề tựa ghi 1722). IMSLP ghi "early 1720s".'
  - id: n18
    cau: Fugue BWV 847 có 3 bè.
    loai: cau-truc
    nguon:
      - mut-847
      - omt-fugue
    ket_qua: dung
    ghi_chu: Tệp Mutopia đề "a 3 Voci" và gồm ba bè.
    luot_2: dung
    luot_2_nguon: [ "https://bach-cantatas.com/Pic-NonVocal-BIG/Pinnock-T-K09c[DGG-2CD-booklet].pdf", "https://tonic-chord.com/bach-prelude-and-fugue-no-2-in-c-minor-bwv-847-analysis/" ]
    luot_2_ghi_chu: 'Pinnock: "a 3 voci"; tonic-chord: ba bè.'
  - id: n19
    cau: Fugue BWV 847 dài 31 ô nhịp.
    loai: cau-truc
    nguon:
      - mut-847
    ket_qua: dung
