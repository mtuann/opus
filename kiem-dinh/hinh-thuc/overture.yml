nhan_dinh:
  - id: n1
    cau: Overture ("mở màn") khởi đầu là khúc nhạc dàn nhạc mở đầu một tác phẩm kịch như opera hay oratorio.
    loai: dinh-nghia
    nguon:
      - brit-ov
      - cod-ov
    ket_qua: da-sua
    ghi_chu: 'Britannica: "usually the orchestral introduction to a musical work (often dramatic)"; COD: overture "precedes opera, oratorio, or play". Chữ cũ: "khúc nhạc mở đầu của opera, ballet hay oratorio — chơi khi màn còn đóng, để khán giả ổn định chỗ ngồi và vào không khí": nguồn đã mở không nhắc ballet, màn đóng hay ý đồ "ổn định chỗ ngồi"; bỏ. Tên "Khúc mở màn" là lựa chọn của site (thuat-ngu.yml).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/overture-music", "https://www.classical-music.com/features/musical-terms/what-overture" ]
  - id: n2
    cau: Overture dần tách ra thành thể loại hòa nhạc độc lập.
    loai: lich-su
    nguon:
      - brit-ov
    ket_qua: dung
    ghi_chu: 'Britannica: concert overture "became established in the 19th century as an independent, one-movement work".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/overture-music", "https://www.britannica.com/art/concert-overture" ]
  - id: n3
    cau: "Thời Baroque có hai kiểu overture cho opera: Pháp (Lully) và Ý."
    loai: lich-su
    nguon:
      - brit-ov
      - cod-ov
    ket_qua: dung
    ghi_chu: "Britannica: dạng Pháp do Lully; dạng Ý thành lập sau 1680 trong opera của Alessandro Scarlatti. COD: Lully (chậm – nhanh – chậm), Scarlatti (nhanh – chậm – nhanh)."
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/overture", "https://www.britannica.com/art/overture-music" ]
  - id: n4
    cau: Overture Pháp (Lully) có ba phần chậm – nhanh – chậm.
    loai: cau-truc
    nguon:
      - cod-ov
      - brit-ov
    ket_qua: dung
    ghi_chu: 'COD: "slow–fast (fugal)–slow"; Britannica: thường kết bằng đoạn chậm, có thể mở rộng thành phần thứ ba.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/overture", "https://www.britannica.com/art/overture-music" ]
    luot_2_ghi_chu: "Một số tác giả nói overture Lully gốc chỉ hai phần chậm-nhanh; Britannica: phần cuối có thể phát triển thành phần ba. Cách nói 'ba phần' theo COD."
  - id: n5
    cau: Phần chậm mở đầu của overture Pháp có tiết tấu chấm (dotted); phần nhanh theo lối bắt chước.
    loai: cau-truc
    nguon:
      - brit-ov
      - bach-1067
    ket_qua: da-sua
    ghi_chu: 'Britannica: "opens with a slow section in dotted rhythms, followed by a quick section in fugal, or imitative, style"; Bach Choir: "a slow, dotted rhythm section leading to a faster imitative section". Chữ cũ: "với tiết tấu chấm (dotted) trang trọng": bỏ "trang trọng" (không nguồn), thêm phần nhanh.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/overture-music", "https://bach-cantatas.com/Topics/French-Overture.htm" ]
  - id: n6
    cau: Overture Pháp nghe trong các tổ khúc dàn nhạc của Bach và trong oratorio của Handel, như Messiah.
    loai: lich-su
    nguon:
      - brit-ov
      - imslp-1066
      - bach-1067
    ket_qua: da-sua
    ghi_chu: 'Britannica: "His four orchestral Overtures" của Bach là tổ khúc mở bằng overture Pháp rồi các điệu nhảy; Handel dùng dạng Lully trong oratorio, như Messiah. IMSLP: chương 1 Tổ khúc số 1 BWV 1066 đề "Ouverture". Chữ cũ: "các tổ khúc của Bach và Handel"; Handel chỉ có ở oratorio (và opera) theo nguồn đã mở.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/overture-music", "https://bach-cantatas.com/Topics/French-Overture.htm" ]
  - id: n7
    cau: Overture Ý có ba phần nhanh – chậm – nhanh.
    loai: cau-truc
    nguon:
      - cod-ov
      - brit-ov
    ket_qua: dung
    ghi_chu: 'COD: Scarlatti, "quick–slower–quick"; Britannica: fast-slow-fast.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/overture", "https://www.britannica.com/art/overture-music" ]
  - id: n8
    cau: Overture Ý là mẫu cho những bản giao hưởng đầu tiên, vốn có ba chương; về sau giao hưởng thường có bốn chương.
    loai: lich-su
    nguon:
      - brit-ov
      - cod-sym
    ket_qua: da-sua
    ghi_chu: 'Britannica: overture Ý "provided the model for the earliest symphonies", ba chương; COD (symphony): sinfonia là overture opera nhanh – chậm – nhanh, giao hưởng sau này "usually in four movements". Chữ cũ: "tổ tiên của giao hưởng — tách khỏi opera, thêm chương 4 và thành symphony thời Cổ điển": COD không nói chương thứ tư được "thêm" vào chính hình thức ấy.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/overture-music" ]
  - id: n9
    cau: "Thế kỷ 19, nhà soạn nhạc viết concert overture: một chương độc lập cho dàn nhạc, không mở đầu cho tác phẩm kịch nào."
    loai: dinh-nghia
    nguon:
      - cod-co
      - brit-ov
    ket_qua: dung
    ghi_chu: 'COD: "self-contained, single-movement orchestral piece meant to open a concert", không phải overture opera; Britannica: thành thể loại ở thế kỷ 19.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/concert-overture", "https://www.britannica.com/art/overture-music" ]
  - id: n10
    cau: Nhiều concert overture dùng hình thức sonata.
    loai: cau-truc
    nguon:
      - cod-co
      - mend-scot
    ket_qua: da-sua
    ghi_chu: 'COD: "Many concert overtures are written in sonata form"; Mendelssohn in Scotland: Hebrides theo hình thức sonata một cách lỏng, chủ đề một Si thứ, chủ đề hai Rê trưởng. Chữ cũ: "thường dùng hình thức sonata thu gọn": bỏ "thu gọn" (không nguồn); Roman Carnival không theo sonata (The Orchestra Now).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/concert-overture" ]
  - id: n11
    cau: "Một số concert overture gần với symphonic poem: kể một câu chuyện hoặc vẽ một cảnh."
    loai: cau-truc
    nguon:
      - cod-co
    ket_qua: da-sua
    ghi_chu: 'COD: "some come close to the symphonic poem in character". Chữ cũ: "thường kể một câu chuyện hoặc vẽ một cảnh"; giảm thành "một số".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/symphonic-poem", "https://www.britannica.com/art/program-music" ]
  - id: n12
    cau: Liên kết "hình thức sonata" dẫn tới /opus/hinh-thuc/sonata/.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đã kiểm: src/content/docs/hinh-thuc/sonata.md có trên nhánh (trang thuộc lô D5-L2 phần A). Review: đã kiểm src/content/docs/hinh-thuc/sonata.md có."
    review: dung
  - id: n13
    cau: Liên kết "symphonic poem" dẫn tới /opus/hinh-thuc/symphonic-poem/.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đã kiểm: src/content/docs/hinh-thuc/symphonic-poem.md có trên nhánh (cùng lô). Review: đã kiểm src/content/docs/hinh-thuc/symphonic-poem.md có."
    review: dung
  - id: n14
    cau: "Mendelssohn, Hebrides (Động Fingal): chuyến đi Scotland năm 1829 (đảo Staffa, hang Fingal); âm nhạc gợi sóng biển."
    loai: cau-truc
    nguon:
      - mend-scot
    ket_qua: da-sua
    ghi_chu: 'Mendelssohn in Scotland: viết đoạn mở đầu ở Tobermory ngày 7/8/1829, một ngày trước chuyến thăm Staffa và hang Fingal; bản in 1834 đề Fingals Höhle, cũng gọi Die Hebriden; "rising surges in the cellos and basses suggest a sea swell". Chữ cũ: "Biển cả và hang Fingal ở Scotland": nguồn nói chỉ "sometimes linked" với hang; đổi thành chuyến đi.'
    luot_2: dung
    luot_2_nguon: [ "https://theportobelloorchestra.co.uk/ProgrammeNotes/MendelssohnHebrides.php", "https://www.sfsymphony.org/Data/Event-Data/Program-Notes/M/MENDELSSOHN-Fingals-Cave-Overture-Opus-26-(1)" ]
    luot_2_ghi_chu: 1829, Staffa, hang Fingal; Portobello nêu hình ảnh biển, sóng.
  - id: n15
    cau: "Hebrides là concert overture (COD: một trong những bản đầu tiên của thể loại)."
    loai: lich-su
    nguon:
      - cod-co
      - mend-scot
    ket_qua: dung
    ghi_chu: 'COD: "The Hebrides" là một trong những bản đầu tiên; Mendelssohn in Scotland: tác phẩm độc lập, không mở đầu opera hay nhạc kịch.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/overture-music", "https://www.britannica.com/art/symphonic-poem", "https://www.britannica.com/art/program-music" ]
    luot_2_ghi_chu: "Britannica: Hebrides là ví dụ concert overture và là overture mở rộng thời đầu. Chưa mở được mục Hebrides của COD để xác nhận chữ 'theo COD'."
  - id: n16
    cau: "Berlioz, Roman Carnival: lễ hội carnival ở Rome; chất liệu lấy từ opera Benvenuto Cellini."
    loai: cau-truc
    nguon:
      - ton-berlioz
    ket_qua: da-sua
    ghi_chu: 'The Orchestra Now: Berlioz "revived portions" của opera Benvenuto Cellini; tên "comes from the carnival scene in the opera"; ra mắt ở Paris 1844. Chữ cũ: "Lễ hội Rome"; bổ sung nguồn chất liệu.'
    luot_2: dung
    luot_2_nguon: [ "https://dmsymphony.org/about/news/program-notes-berlioz-s-roman-carnival-overture-op-9/" ]
  - id: n17
    cau: "Tchaikovsky, 1812: cuộc kháng chiến của Nga trước quân Napoleon năm 1812; tổng phổ có phần cho chuông và đại bác."
    loai: lich-su
    nguon:
      - tr-1812
    ket_qua: da-sua
    ghi_chu: "Tchaikovsky Research: \"commemorates Russia's defeat of Napoleon in 1812\"; tổng phổ ở đoạn kết có \"large bells\" và phần \"cannon\". Chữ cũ: \"Cuộc chiến Nga–Pháp năm 1812 (có đại bác thật — ở buổi diễn ngoài trời!)\": Classic Note nói buổi ngoài trời có thể dùng đại bác thật nhưng chỉ là blog; Tchaikovsky Research nói tổng phổ ghi phần đại bác (thực ra là trống lớn treo). Bỏ vế đại bác thật."
    luot_2: dung
    luot_2_nguon: [ "https://www.bhso.org.uk/?p=1345", "https://www.hollywoodbowl.com/musicdb/pieces/152/1812-overture" ]
  - id: n18
    cau: "Tchaikovsky, Romeo và Juliet: bi kịch Shakespeare; chủ đề tình yêu đối lại chủ đề xung đột giữa hai dòng họ."
    loai: cau-truc
    nguon:
      - tr-rj
    ket_qua: da-sua
    ghi_chu: 'Tchaikovsky Research: "overture-fantasia" theo Shakespeare; Allegro Si thứ tả xung đột, chủ đề hai (Rê giáng trưởng) là tình yêu. Chữ cũ: "chủ đề gươm đao"; đổi thành "xung đột giữa hai dòng họ" cho sát nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/10%3A_Program_Music/10.01%3A_Tchaikovsky's_Romeo_and_Juliet" ]
  - id: n19
    cau: "Phần Đi qua một tác phẩm, 1812, mục 1: mở đầu chậm, thánh ca Chính thống giáo của Nga."
    loai: cau-truc
    nguon:
      - tr-1812
      - classic-1812
    ket_qua: da-sua
    ghi_chu: 'Tchaikovsky Research: mở đầu dựa trên lời cầu nguyện Nga cầu chiến thắng "Lord, preserve thy people"; Classic Note: mở đầu chậm, giai điệu thánh ca ở dây. Chữ cũ: "không khí Nga yên bình": bỏ (cảm nhận).'
    luot_2: dung
    luot_2_nguon: [ "https://www.bhso.org.uk/?p=1345" ]
    luot_2_ghi_chu: Chủ đề mở đầu là 'God Preserve Thy People' (nguồn không ghi 'Chính thống giáo').
  - id: n20
    cau: "Mục 2: thân chính và trận chiến: giai điệu dân gian Nga đối đầu với Marseillaise (phe Pháp) cho đến khi Marseillaise tan dần."
    loai: cau-truc
    nguon:
      - tr-1812
      - classic-1812
    ket_qua: da-sua
    ghi_chu: 'Tchaikovsky Research: giai điệu opera Voyevoda, dân ca "By the Gates", và trích Marseillaise; Classic Note: Marseillaise nổi lên rồi giai điệu dân gian Nga đẩy lùi "until it fades away". Chữ cũ: tách "Thân chính" và "Trận chiến", và "Marseillaise sụp đổ"; hai nguồn xếp thứ tự hơi khác nhau nên gộp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bhso.org.uk/?p=1345", "https://www.hollywoodbowl.com/musicdb/pieces/152/1812-overture" ]
  - id: n21
    cau: "Mục 3: kết: quốc ca Nga hoàng God Save the Tsar! cùng chuông và đại bác."
    loai: cau-truc
    nguon:
      - tr-1812
    ket_qua: da-sua
    ghi_chu: 'Tchaikovsky Research: coda trích "God Save the Tsar", tổng phổ ghi chuông và đại bác. Chữ cũ: "khải hoàn với đại bác và chuông"; bỏ "khải hoàn".'
    luot_2: dung
    luot_2_nguon: [ "https://www.bhso.org.uk/?p=1345", "https://www.hollywoodbowl.com/musicdb/pieces/152/1812-overture" ]
    luot_2_ghi_chu: Phần kết có chuông và đại bác.
  - id: n22
    cau: Liên kết "hướng dẫn nghe chi tiết" (đoạn 1812) dẫn tới /opus/nghe-nhac/tchaikovsky-1812/.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển; có ở site cũ ../opus-zero/docs/nghe-nhac/tchaikovsky-1812.md (tiêu đề "Tchaikovsky: 1812 Overture"; đã kiểm). Điều cần giữ: hướng dẫn nghe chi tiết ở đường dẫn ấy. Review: đã kiểm ~/w/opus-zero/docs/nghe-nhac/tchaikovsky-1812.md có ("Tchaikovsky: 1812 Overture"); trang đích chưa chuyển.'
    review: dung
  - id: n23
    cau: 'Liên kết "Tchaikovsky, 1812 Overture" trong bảng Nghe để luyện dẫn tới /opus/nghe-nhac/tchaikovsky-1812/ (cột Hướng dẫn: "Hướng dẫn nghe").'
