ghi_chu: 'Trang overture (tầng lõi), không có khối abc (chỉ bảng, danh sách và không có quiz). Nguồn chính: Britannica (Overture), COD qua Encyclopedia.com (overture, concert overture, symphony), Bach Choir of Bethlehem (BWV 1067), Mendelssohn in Scotland (Hebrides), The Orchestra Now (Berlioz), Tchaikovsky Research (1812, Romeo and Juliet), Classic Note (1812), IMSLP (Bach BWV 1066, Mozart K.527) (WebFetch ngày 29/10/2026, bản tóm tắt chữ; chỗ quan trọng đã hỏi lại). Mục Nguồn cũ dựa vào Wikipedia (kể cả bản tiếng Đức); đã thay bằng nguồn bậc 2 đã mở. Chữ đã sửa: câu mở đầu bỏ "ballet", "chơi khi màn còn đóng, để khán giả ổn định chỗ ngồi" (n1), overture Pháp (n5, n6), overture Ý "thêm chương 4" (n8), concert overture "thường kể chuyện, sonata thu gọn" (n10, n11), ba dòng của bảng (n14, n16, n17, n18), phần đi qua 1812 (n19, n20, n21), Don Giovanni "kinh điển" (n26), mục Nguồn. Lô trước yêu cầu giữ (grep hinh-thuc/overture trong kiem-dinh/): không có câu nào trỏ tới. Thống nhất với trang cùng lô: symphonic-poem (1812 là overture, Moldau là symphonic poem; symphonic poem phát triển từ concert overture): khớp. Chữ trang không có năm sinh–mất nhà soạn nhạc (có năm tác phẩm: 1829 Hebrides, 1812 là năm sự kiện). Câu ve-site trỏ trang chưa chuyển: n22, n23 (nghe-nhac/tchaikovsky-1812), n27 (tai-lieu-tham-khao); n12, n13 trỏ sonata và symphonic-poem (đã có ở nhánh). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): concert overture (overture hòa nhạc), French overture (overture Pháp), Italian overture (overture Ý), sinfonia; overture, symphony, suite, sonata form đã có. Chưa chắc: không còn. Lưu ý cho người giao: Roman Carnival và 1812 được liệt kê là overture hòa nhạc theo cách trang vốn viết; Tchaikovsky Research gọi 1812 là "festival overture" và Romeo và Juliet là "overture-fantasia" (cùng loại một chương độc lập).'
doi_chu:
  - cu: Overture ("mở màn") khởi đầu là khúc nhạc mở đầu của opera, ballet hay oratorio — chơi khi màn còn đóng, để khán giả ổn định chỗ ngồi và "vào" không khí. Dần dần, nó tách ra thành thể loại hòa nhạc độc lập.
    moi: Overture ("mở màn") khởi đầu là khúc nhạc dàn nhạc mở đầu một tác phẩm kịch như opera hay oratorio. Dần dần, nó tách ra thành thể loại hòa nhạc độc lập.
    ly_do: 'n1 (da-sua): Britannica, COD; bỏ ballet, màn đóng, "ổn định chỗ ngồi" (không nguồn).; n1 (da-sua): mô tả bỏ "ballet", "chơi khi màn còn đóng" (nguồn không nói).'
  - cu:
      - "Overture Pháp (Lully): chậm – nhanh – chậm, với tiết tấu chấm (dotted) trang trọng. Nghe trong các tổ khúc của Bach và Handel."
      - "Overture Ý (nhanh – chậm – nhanh): chính là tổ tiên của giao hưởng — tách khỏi opera, thêm chương 4 và thành symphony thời Cổ điển."
    moi:
      - "Overture Pháp (Lully): chậm – nhanh – chậm; phần chậm mở đầu có tiết tấu chấm (dotted), phần nhanh theo lối bắt chước. Nghe trong các tổ khúc dàn nhạc của Bach và trong oratorio của Handel, như Messiah."
      - "Overture Ý (nhanh – chậm – nhanh): là mẫu cho những bản giao hưởng đầu tiên, vốn có ba chương; về sau giao hưởng thường có bốn chương."
    ly_do: "n5, n6 (da-sua): Britannica, Bach Choir.; n8 (da-sua): Britannica, COD (symphony)."
  - cu: "Thế kỷ 19, các nhà soạn nhạc viết concert overture: một chương độc lập cho dàn nhạc, thường kể một câu chuyện hoặc vẽ một cảnh — và thường dùng hình thức sonata thu gọn:"
    moi: "Thế kỷ 19, các nhà soạn nhạc viết concert overture: một chương độc lập cho dàn nhạc, không mở đầu cho tác phẩm kịch nào. Nhiều bản dùng hình thức sonata; một số bản gần với symphonic poem khi kể một câu chuyện hoặc vẽ một cảnh:"
    ly_do: "n10, n11 (da-sua): COD, concert overture."
  - cu: Biển cả và hang Fingal ở Scotland; âm nhạc gợi sóng biển
    moi: Chuyến đi Scotland năm 1829 (đảo Staffa, hang Fingal); âm nhạc gợi sóng biển
    ly_do: "n14 (da-sua): Mendelssohn in Scotland."
  - cu: Lễ hội Rome
    moi: Lễ hội carnival ở Rome; chất liệu lấy từ opera Benvenuto Cellini
    ly_do: "n16 (da-sua): The Orchestra Now."
  - cu: Cuộc chiến Nga–Pháp năm 1812 (có đại bác thật — ở buổi diễn ngoài trời!)
    moi: Cuộc kháng chiến của Nga trước quân Napoleon năm 1812; tổng phổ có phần cho chuông và đại bác
    ly_do: "n17 (da-sua): Tchaikovsky Research; bỏ vế đại bác thật ở buổi diễn ngoài trời."
  - cu: Bi kịch Shakespeare — chủ đề tình yêu đối đầu chủ đề gươm đao
    moi: "Bi kịch Shakespeare: chủ đề tình yêu đối lại chủ đề xung đột giữa hai dòng họ"
    ly_do: "n18 (da-sua): Tchaikovsky Research."
  - cu:
      - "Xem hướng dẫn nghe chi tiết. Khung overture ở đây rất rõ:"
      - "Mở đầu chậm: thánh ca Chính thống giáo — không khí Nga yên bình."
      - "Thân chính: Marseillaise (phe Pháp) đối đầu với nhạc dân gian Nga."
      - "Trận chiến: hai phe giằng co."
      - "Kết: Marseillaise sụp đổ, quốc ca Nga hoàng khải hoàn với đại bác và chuông."
    moi:
      - "Xem hướng dẫn nghe chi tiết. Thứ tự các phần:"
      - "Mở đầu chậm: thánh ca Chính thống giáo của Nga."
      - "Thân chính và trận chiến: giai điệu dân gian Nga đối đầu với Marseillaise (phe Pháp) cho đến khi Marseillaise tan dần."
      - "Kết: quốc ca Nga hoàng God Save the Tsar! cùng chuông và đại bác."
    ly_do: "n19, n20, n21 (da-sua): Tchaikovsky Research, Classic Note; gộp mục 2 và 3, bỏ cảm nhận."
  - cu: Overture opera kinh điển, chơi trước khi màn mở
    moi: "Overture của một opera: chơi trước khi opera bắt đầu"
    ly_do: 'n26 (da-sua): bỏ "kinh điển", "màn mở".'
  - cu:
      - "Wikipedia: Overture (khúc nhạc mở đầu opera, ballet, oratorio; overture Pháp từ Lully; overture Ý nhanh – chậm – nhanh; concert overture từ đầu thời Lãng mạn, như Hebrides của Mendelssohn), French overture (phần chậm với tiết tấu chấm, phần nhanh kiểu fugue, đoạn cuối thường gợi lại phần chậm; mở đầu các tổ khúc dàn nhạc của Bach và nhiều opera, oratorio của Handel), Italian overture và Symphony (overture Ý là tiền thân trực tiếp của giao hưởng; trong thế kỷ 18, giao hưởng bốn chương dần thành lệ)."
      - "Wikipedia tiếng Đức, Ouvertüre: overture opera thường chơi khi màn còn đóng; overture Pháp có ba phần chậm – nhanh – chậm; concert overture viết riêng cho buổi hòa nhạc, thường ở hình thức sonata nhanh có phần mở đầu chậm, nhiều khi có nội dung chương trình."
      - "Các tác phẩm, Wikipedia: The Hebrides (cảm hứng từ hang Fingal trên đảo Staffa, Scotland; chủ đề thứ hai tả sóng biển), Overtures by Hector Berlioz (Le carnaval romain: overture hòa nhạc dựng từ chất liệu opera Benvenuto Cellini, có nhạc của cảnh lễ hội hóa trang), Romeo and Juliet (Tchaikovsky) (chủ đề xung đột hai dòng họ, có tiếng chũm chọe tả cuộc đấu kiếm, đối lại chủ đề tình yêu), Don Giovanni."
      - '1812 Overture: Wikipedia 1812 Overture (kỷ niệm cuộc kháng chiến của Nga trước quân Pháp năm 1812; mở đầu bằng thánh ca Chính thống giáo, La Marseillaise đối đầu nhạc dân gian Nga, kết bằng God Save the Tsar! với đại bác và chuông; buổi diễn ngoài trời có khi dùng đại bác thật) và trang The Year 1812 của Tchaikovsky Research (nguồn gốc các giai điệu được trích: thánh ca Chính thống giáo, bài dân ca "By the Gates", La Marseillaise, quốc ca God Save the Tsar!).'
    moi:
      - "Britannica, Overture: định nghĩa; overture Pháp của Lully (phần chậm có tiết tấu chấm, phần nhanh theo lối bắt chước); overture Ý nhanh – chậm – nhanh làm mẫu cho những bản giao hưởng đầu tiên; Bach và Handel; concert overture thành thể loại độc lập ở thế kỷ 19."
      - "The Concise Oxford Dictionary of Music, qua Encyclopedia.com: overture, concert overture (một chương, nhiều bản ở hình thức sonata; Hebrides là một trong những bản đầu tiên), symphony (sinfonia, overture opera nhanh – chậm – nhanh)."
      - "Tổ khúc của Bach: Bach Choir of Bethlehem, BWV 1067 (overture kiểu Pháp: phần chậm có tiết tấu chấm, rồi phần nhanh bắt chước)."
      - "Các tác phẩm: Mendelssohn in Scotland, Hebrides Overture; The Orchestra Now, Berlioz, Roman Carnival; Tchaikovsky Research, Romeo and Juliet và The Year 1812; Classic Note, Tchaikovsky, 1812 Overture; IMSLP, Mozart, Don Giovanni, K.527."
    ly_do: "Mục Nguồn: Wikipedia chỉ để tìm nguồn (chuẩn kiểm định mục 2); thay bằng nguồn bậc 2 đã mở."
