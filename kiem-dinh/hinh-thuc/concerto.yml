ghi_chu: 'Trang concerto và ritornello (tầng lõi), không có khối abc (chỉ bảng, một sơ đồ mermaid và quiz). Nguồn chính: COD qua Encyclopedia.com (concerto, concerto grosso, cadenza), Listen 8e và LCS Productions (ritornello), OMT (Rondo, điệp khúc ở chủ âm), Humanities LibreTexts và Carnegie Mellon (concerto Cổ điển, double exposition), Teoria (Vivaldi, Mùa xuân), IMSLP (Corelli, Handel Op. 6), chú giải chương trình của Bach Choir of Bethlehem, Cleveland Orchestra, Indianapolis Symphony, LA Phil, Reading Symphony (WebFetch ngày 29/10/2026, bản tóm tắt chữ; chỗ quan trọng đã hỏi lại để lấy câu nguyên văn). Chữ đã sửa: bỏ "Vivaldi và Bach dùng" (Bach không có nguồn) thành "Concerto Baroque, như của Vivaldi" (n3), "điệp khúc nhỏ" thành "lần quay lại nhỏ" (n4), bỏ "khoe kỹ thuật, chuyển giọng" (n7), sơ đồ không còn nói ritornello đầu ở "giọng chính" (n8), so sánh với rondo (n9), "mẫu mực" (n13), "Từ Mozart" (n14), cadenza ứng tác (n17), bỏ "trữ tình, như một aria không lời" (n18), Mendelssohn không còn nói "ô nhịp thứ hai" (n20), "phá dần khuôn mẫu" (n22), Brandenburg số 5 "đoạn độc tấu dài như cadenza" (n25), Rachmaninoff "8 ô nhịp" (n28), mục Nguồn. Lô trước yêu cầu giữ (grep hinh-thuc/concerto trong kiem-dinh/): lịch sử Baroque (n44): giữ đường dẫn /opus/hinh-thuc/concerto/ và tiêu đề "Concerto và ritornello": KHỚP. Thống nhất với trang đã khóa: piano/the-loai (concerto thường ba chương, có cadenza): khớp; piano/hoa-am/ket (cadenza bắt đầu từ hợp âm 6/4 ở kết): trang concerto nói dàn nhạc dừng lại trên một hợp âm rồi độc tấu một mình, COD (cadenza) nói cadenza bắt đầu từ hợp âm chủ thể đảo hai (6/4): không mâu thuẫn; lịch sử Baroque (concerto và concerto grosso, Brandenburg số 5): khớp. Chữ trang không có năm sinh–mất nhà soạn nhạc. Câu ve-site trỏ trang chưa chuyển: n12, n24 (nghe-nhac/vivaldi-mua-xuan), n27 (nghe-nhac/mendelssohn-violin), n29 (nghe-nhac/rachmaninoff-2), n31 (tai-lieu-tham-khao). Thuật ngữ trang dùng mà src/data/thuat-ngu.yml chưa có (cho D3-L5): ritornello, tutti, concerto grosso, concertino, ripieno; concerto, cadenza, rondo, sonata đã có. Chưa chắc: không còn.'
doi_chu:
  - cu: Concerto là tác phẩm cho một (hoặc vài) nhạc cụ độc tấu cùng dàn nhạc. Sức hấp dẫn của nó nằm ở cuộc "đối thoại", có khi là "tranh tài", giữa một người và số đông.
    moi: Concerto là tác phẩm cho một (hoặc vài) nhạc cụ độc tấu cùng dàn nhạc. Khi nghe, hãy để ý cuộc đối đáp, có khi là tranh tài, giữa một người và số đông.
    ly_do: "n2 (khuyen-tap): nhận xét cảm nhận chuyển thành lời gợi ý nghe.; Mô tả (lượt 1 D5-L2): đổi theo câu mở đầu đã sửa. Câu về sức hấp dẫn chuyển thành lời gợi ý nghe.; Mô tả (lượt 1 D5-L2/L1): đổi theo câu mở đầu đã sửa."
  - cu: 'Vivaldi và Bach dùng hình thức ritornello (tiếng Ý: "điệp khúc nhỏ"):'
    moi: 'Concerto Baroque, như của Vivaldi, thường dùng hình thức ritornello (tiếng Ý: "lần quay lại nhỏ"):'
    ly_do: 'n3, n4 (da-sua): LCS và Teoria; nguồn đã mở không nói về Bach; "little return".'
  - cu:
      - "Xen giữa là các đoạn độc tấu (solo): nhạc cụ độc tấu khoe kỹ thuật, chuyển giọng."
      - flowchart LR R1["Ritornello<br/>giọng chính"] --> S1["Độc tấu"] --> R2["Ritornello<br/>giọng khác"] --> S2["Độc tấu"] --> R3["Ritornello<br/>giọng khác"] --> S3["Độc tấu"] --> R4["Ritornello<br/>giọng chính"]
      - Khác với rondo, ritornello quay lại ở giọng khác nhau và thường bị rút ngắn; nó vừa là điệp khúc, vừa là "cột mốc" chuyển giọng.
    moi:
      - "Xen giữa là các đoạn độc tấu (solo): nhạc cụ độc tấu chơi những đoạn khó, điêu luyện hơn."
      - Khác với rondo, nơi điệp khúc luôn trở lại ở chủ âm, ritornello quay lại ở giọng khác nhau và thường chỉ là một phần của đoạn gốc.
    ly_do: 'n7 (da-sua): Listen; bỏ "chuyển giọng" không nguồn. Review mo/link-hong: Listen không còn, bỏ "nhanh" (không nguồn đọc được), "những đoạn khó, điêu luyện" theo LibreTexts.; n8 (da-sua): nguồn không nói giọng của ritornello đầu.; n9 (da-sua): OMT Rondo và Listen; bỏ ẩn dụ "cột mốc".; mo/d5-hinh: sơ đồ mermaid (site mới không vẽ, hiện nguyên mã) thay bằng hình tĩnh ::hinh{ten="form-ritornello"}, giữ chữ của sơ đồ.'
  - cu: "Đi qua một tác phẩm: Vivaldi Mùa xuân, chương 1 là ví dụ mẫu mực, có hướng dẫn nghe chi tiết."
    moi: "Đi qua một tác phẩm: Vivaldi Mùa xuân, chương 1 là một ví dụ rõ về ritornello, có hướng dẫn nghe chi tiết."
    ly_do: 'n13 (da-sua): bỏ xếp hạng "mẫu mực".'
  - cu: "Từ Mozart, concerto thường có 3 chương: nhanh – chậm – nhanh."
    moi: "Concerto thời Cổ điển thường có 3 chương: nhanh – chậm – nhanh."
    ly_do: "n14 (da-sua): nguồn không đặt mốc từ Mozart."
  - cu:
      - "Cadenza: gần cuối chương 1, dàn nhạc dừng lại trên một hợp âm, nghệ sĩ độc tấu chơi một mình một đoạn tự do, khoe kỹ thuật và tưởng tượng, rồi dàn nhạc vào lại để kết. Thời Mozart, cadenza thường được ứng tác; từ Beethoven, nhà soạn nhạc viết sẵn ngày càng nhiều."
      - "Chương 2: chậm, trữ tình, như một aria không lời."
      - "Chương 3: nhanh, thường là rondo."
      - "Thời Lãng mạn, nhà soạn nhạc phá dần khuôn mẫu: Mendelssohn cho violin vào ngay từ ô nhịp thứ hai và nối các chương liền nhau; Rachmaninoff mở đầu Concerto số 2 bằng piano độc tấu."
    moi:
      - "Cadenza: gần cuối chương 1, dàn nhạc dừng lại trên một hợp âm, nghệ sĩ độc tấu chơi một mình một đoạn tự do, khoe kỹ thuật và tưởng tượng, rồi dàn nhạc vào lại để kết. Cadenza vốn được ứng tác; từ thời Mozart và Beethoven, nhà soạn nhạc ngày càng viết sẵn."
      - "Chương 2: chậm."
      - "Chương 3: nhanh, thường ở hình thức rondo."
      - "Thời Lãng mạn, nhà soạn nhạc thay đổi dần khuôn mẫu: Mendelssohn bỏ phần trình bày riêng của dàn nhạc, cho violin vào gần như ngay lập tức, và nối các chương liền nhau; Rachmaninoff mở đầu Concerto số 2 bằng piano độc tấu."
    ly_do: "n17 (da-sua): COD, cadenza (và quiz tương ứng).; n18 (da-sua): LibreTexts; bỏ vế cảm nhận không nguồn.; n20 (da-sua): nguồn đã mở không nói số ô.; n22 (da-sua): giảm sắc thái, theo COD và chú giải của Cleveland Orchestra."
