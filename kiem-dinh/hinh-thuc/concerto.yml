nhan_dinh:
  - id: n1
    cau: Concerto là tác phẩm cho một (hoặc vài) nhạc cụ độc tấu cùng dàn nhạc.
    loai: dinh-nghia
    nguon:
      - cod-concerto
    ket_qua: dung
    ghi_chu: 'COD: "A work in which a solo instr(s). is contrasted and blended with the orch."'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto" ]
  - id: n2
    cau: Khi nghe concerto, hãy để ý cuộc đối đáp, có khi là tranh tài, giữa một người và số đông.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "Sức hấp dẫn của nó nằm ở cuộc đối thoại, có khi là tranh tài, giữa một người và số đông": nhận xét cảm nhận, chuyển thành lời gợi ý nghe. Không trái piano/the-loai ("Piano đối thoại với cả dàn nhạc").'
    luot_2: dung
  - id: n3
    cau: Concerto Baroque, như của Vivaldi, thường dùng hình thức ritornello.
    loai: lich-su
    nguon:
      - lcs-rit
      - teoria-spring
    ket_qua: da-sua
    ghi_chu: 'LCS: ritornello "typical of the first and frequently also the last movement" của concerto Baroque; Teoria: chương 1 Mùa xuân của Vivaldi "uses the ritornello form". Chữ cũ: "Vivaldi và Bach dùng hình thức ritornello": nguồn đã mở không nói về Bach (Brandenburg số 5 chỉ có ghi chú về harpsichord, không nói ritornello).'
    luot_2: dung
    luot_2_nguon: [ "https://gcp-web.sjsu.edu/people/gordon.haramaki/courses/baroque/s1/9.-Vivaldi-and-Ritornello-Form.pdf", "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php" ]
  - id: n4
    cau: Ritornello là tiếng Ý, nghĩa là "lần quay lại nhỏ".
    loai: ten
    nguon:
      - lcs-rit
    ket_qua: da-sua
    ghi_chu: 'LCS: tên nghĩa là "little return". Chữ cũ: "điệp khúc nhỏ"; dịch sát hơn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/ritornello" ]
    luot_2_ghi_chu: "Britannica: 'return'. Sắc thái 'nhỏ' (đuôi -ello) không có trong nguồn đã mở; ngữ pháp Ý đúng."
  - id: n5
    cau: Ritornello do cả dàn nhạc (tutti) chơi, mở đầu và kết thúc chương.
    loai: cau-truc
    nguon:
      - listen-rit
      - lcs-rit
    ket_qua: dung
    ghi_chu: 'Listen: ritornello là "the orchestral music that typically starts the movement off"; chương kết bằng ritornello ở chủ âm. LCS: các đoạn tutti tạo nên ritornello.'
    luot_2: dung
    luot_2_nguon: [ "https://gcp-web.sjsu.edu/people/gordon.haramaki/courses/baroque/s1/9.-Vivaldi-and-Ritornello-Form.pdf", "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php" ]
  - id: n6
    cau: Ritornello quay lại nhiều lần ở giữa chương, thường ở các giọng khác nhau và có khi chỉ một đoạn ngắn.
    loai: cau-truc
    nguon:
      - listen-rit
    ket_qua: dung
    ghi_chu: 'Listen: quay lại nhiều lần, "often in fragments rather than in full", ở các giọng khác nhau.'
    luot_2: dung
    luot_2_nguon: [ "https://gcp-web.sjsu.edu/people/gordon.haramaki/courses/baroque/s1/9.-Vivaldi-and-Ritornello-Form.pdf", "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php" ]
    luot_2_ghi_chu: "Teoria: ritornello 2-3 chỉ còn một câu; giọng khác nhau."
  - id: n7
    cau: "Xen giữa các ritornello là các đoạn độc tấu: nhạc cụ độc tấu chơi nhanh và điêu luyện hơn."
    loai: cau-truc
    nguon:
      - listen-rit
    ket_qua: da-sua
    ghi_chu: 'Listen: soloist chơi "faster and more brilliant" (virtuoso). Chữ cũ: "khoe kỹ thuật, chuyển giọng"; bỏ "chuyển giọng" (không nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://gcp-web.sjsu.edu/people/gordon.haramaki/courses/baroque/s1/9.-Vivaldi-and-Ritornello-Form.pdf", "https://www.britannica.com/art/ritornello" ]
  - id: n8
    cau: "Sơ đồ ritornello: ritornello mở đầu, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng chính."
    loai: cau-truc
    nguon:
      - listen-rit
    ket_qua: da-sua
    ghi_chu: 'Listen: ritornello ở giọng khác khi chương tiến triển, trở lại chủ âm ở cuối. Chữ cũ ghi ritornello đầu ở "giọng chính"; nguồn đã mở không nói giọng của lần đầu nên sơ đồ ghi "mở đầu". Sơ đồ chỉ là mẫu. Kiểm mẫu D5: chủ repo không mở được trang Listen (tên miền phụ không phân giải trên máy kiểm), kết luận đúng theo Grout/Palisca (qua Wikipedia, Ritornello): "The first and last statements are in the tonic". Người gom mở lại trang Listen ngày 29/10/2026: ritornello "usually it is played in different keys as the movement proceeds", cuối chương "the orchestral ritornello returns in the tonic key". mo/d5-hinh: sơ đồ nay là hình tĩnh của site (trước đây khối mermaid hiện nguyên mã); chữ và thứ tự giữ nguyên.'
    luot_2: dung
    luot_2_nguon: [ "https://gcp-web.sjsu.edu/people/gordon.haramaki/courses/baroque/s1/9.-Vivaldi-and-Ritornello-Form.pdf", "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php" ]
    luot_2_ghi_chu: Sơ đồ rút gọn (4 ritornello, 3 độc tấu); SJSU nói Vivaldi thường dùng 5 ritornello xen 4 đoạn độc tấu. Số lần lặp thay đổi nên vẫn chấp nhận được.
  - id: n9
    cau: Khác với rondo, nơi điệp khúc luôn trở lại ở chủ âm, ritornello quay lại ở giọng khác nhau và thường chỉ là một phần của đoạn gốc.
    loai: cau-truc
    nguon:
      - omt-rondo
      - listen-rit
    ket_qua: da-sua
    ghi_chu: 'OMT, Rondo: điệp khúc "always heard in the tonic key"; Listen: ritornello ở các giọng khác, thường từng mảnh. Chữ cũ: "thường bị rút ngắn; vừa là điệp khúc, vừa là cột mốc chuyển giọng"; bỏ ẩn dụ "cột mốc".'
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/", "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php" ]
    luot_2_ghi_chu: "OMT: refrain rondo luôn ở giọng chủ; Teoria: ritornello sau rút ngắn, đổi giọng."
  - id: n10
    cau: "Concerto grosso: một nhóm nhỏ nhạc cụ độc tấu (concertino) đối đáp với cả dàn nhạc (ripieno)."
    loai: dinh-nghia
    nguon:
      - cod-grosso
    ket_qua: dung
    ghi_chu: "COD (concerto grosso): concertino là nhóm nhỏ, ripieno là nhóm lớn, hai nhóm luân phiên, tương phản, có lúc hòa vào nhau. IMSLP Corelli Op. 6: concertino gồm hai violin và cello."
    luot_2: dung
    luot_2_nguon: [ "https://gcp-web.sjsu.edu/people/gordon.haramaki/courses/baroque/s1/9.-Vivaldi-and-Ritornello-Form.pdf", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto" ]
  - id: n11
    cau: Corelli và Handel đều có tập concerto grosso Op. 6.
    loai: danh-muc
    nguon:
      - imslp-corelli
      - imslp-handel
    ket_qua: dung
    ghi_chu: "IMSLP: Corelli, 12 Concerti grossi Op. 6 (in khoảng 1714); Handel, 12 Concerti grossi Op. 6, HWV 319–330 (1739–40). Trang không nêu năm."
    luot_2: dung
    luot_2_nguon: [ "https://imslp.org/wiki/12_Concerti_Grossi,_Op.6_(Corelli,_Arcangelo)", "https://imslp.org/wiki/12_Concerti_Grossi,_Op.6_(Handel,_George_Frideric)" ]
    luot_2_ghi_chu: "IMSLP: Corelli 12 Concerti grossi Op. 6; Handel 12 Concerti grossi Op. 6 (HWV 319-330)."
  - id: n12
    cau: Liên kết "Vivaldi Mùa xuân, chương 1" (đoạn Đi qua một tác phẩm) dẫn tới /opus/nghe-nhac/vivaldi-mua-xuan/.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang đích chưa chuyển; có ở site cũ ../opus-zero/docs/nghe-nhac/vivaldi-mua-xuan.md (tiêu đề "Vivaldi: Bốn Mùa – Mùa xuân, chương 1"; đã kiểm). Điều cần giữ: hướng dẫn nghe chi tiết ở đường dẫn ấy. Review: đã kiểm ~/w/opus-zero/docs/nghe-nhac/vivaldi-mua-xuan.md có ("Vivaldi: Bốn Mùa – Mùa xuân, chương 1"); trang đích chưa chuyển.'
    review: dung
  - id: n13
    cau: Vivaldi, Mùa xuân, chương 1, là một ví dụ rõ về ritornello.
    loai: cau-truc
    nguon:
      - teoria-spring
    ket_qua: da-sua
    ghi_chu: 'Teoria: "The first movement, an Allegro, uses the ritornello form", ritornello do toàn dàn nhạc, xen các đoạn solo (birdsong ở ô 13–27). Chữ cũ: "ví dụ mẫu mực"; bỏ xếp hạng.'
    luot_2: dung
    luot_2_nguon: [ "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php" ]
    luot_2_ghi_chu: "Chương 1 Mùa xuân: 5 ritornello xen các đoạn chim hót, suối, bão."
  - id: n14
    cau: "Concerto thời Cổ điển thường có 3 chương: nhanh – chậm – nhanh."
    loai: cau-truc
    nguon:
      - lt-classical
      - cod-concerto
    ket_qua: da-sua
    ghi_chu: 'LibreTexts: concerto Cổ điển giữ cách sắp "fast-slow-fast"; COD: concerto "usually in 3 movts.", nhiều ngoại lệ. Chữ cũ: "Từ Mozart"; bỏ mốc (COD chỉ nói Mozart định hình concerto hiện đại, không nói ba chương bắt đầu từ ông; Baroque cũng ba chương theo LibreTexts). Khớp piano/the-loai.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto", "https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/08%3A_The_Instrumental_Concerto/8.04%3A_Concertos_in_the_Classical_Era" ]
  - id: n15
    cau: "Chương 1 kết hợp hình thức sonata với ý tưởng ritornello: thường có một phần trình bày của dàn nhạc trước, rồi một phần trình bày của nghệ sĩ độc tấu."
    loai: cau-truc
    nguon:
      - cmu-fm
      - lt-classical
    ket_qua: dung
    ghi_chu: 'CMU: "double-exposition sonata form", lần đầu "for orchestra alone", lần hai chủ yếu của soloist; cũng là "a highly structured version of ritornello form". LibreTexts: dàn nhạc chơi cả phần trình bày trước, soloist chơi lại các chủ đề.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/08%3A_The_Instrumental_Concerto/8.04%3A_Concertos_in_the_Classical_Era", "https://digfir-published.macmillanusa.com/listen8e/listen8e_ch14_13.html" ]
    luot_2_ghi_chu: "Phần trình bày kép: dàn nhạc trước, độc tấu sau."
  - id: n16
    cau: "Cadenza: gần cuối chương 1, dàn nhạc dừng lại trên một hợp âm, nghệ sĩ độc tấu chơi một mình một đoạn tự do, khoe kỹ thuật và tưởng tượng, rồi dàn nhạc vào lại để kết."
    loai: dinh-nghia
    nguon:
      - cod-cadenza
      - lt-classical
      - cmu-fm
    ket_qua: dung
    ghi_chu: 'COD: cadenza bắt đầu từ hợp âm chủ thể đảo hai (6/4), dàn nhạc vào lại ở các hợp âm cuối; LibreTexts: sau tái hiện, dàn nhạc ngừng, soloist chơi một mình, "almost improvisationally". Khớp piano/hoa-am/ket.'
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/08%3A_The_Instrumental_Concerto/8.04%3A_Concertos_in_the_Classical_Era", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cadenza" ]
  - id: n17
    cau: Cadenza vốn được ứng tác; từ thời Mozart và Beethoven, nhà soạn nhạc ngày càng viết sẵn.
    loai: lich-su
    nguon:
      - cod-cadenza
    ket_qua: da-sua
    ghi_chu: 'COD: "properly, improvised"; từ thời Mozart và Beethoven "the tendency grew for the composer to write out the cadenza in full" (riêng concerto violin của Beethoven và Brahms vẫn để người chơi ứng tác). Chữ cũ: "Thời Mozart, cadenza thường được ứng tác; từ Beethoven, nhà soạn nhạc viết sẵn ngày càng nhiều": COD đặt mốc viết sẵn từ thời Mozart và Beethoven, không phải chỉ từ Beethoven. Quiz dùng cùng ý.'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cadenza", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto" ]
  - id: n18
    cau: Chương 2 của concerto Cổ điển là chương chậm.
    loai: cau-truc
    nguon:
      - lt-classical
    ket_qua: da-sua
    ghi_chu: "LibreTexts: chương giữa có thể ở hình thức nào \"as long as it's slow\". Chữ cũ: \"chậm, trữ tình, như một aria không lời\"; bỏ vế cảm nhận không nguồn."
