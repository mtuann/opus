nhan_dinh:
  - id: n1
    cau: Concerto là tác phẩm cho một (hoặc vài) nhạc cụ độc tấu cùng dàn nhạc.
    loai: dinh-nghia
    nguon:
      - cod-concerto
    ket_qua: dung
    ghi_chu: 'COD: "A work in which a solo instr(s). is contrasted and blended with the orch."'
    luot_2: dung
    luot_2_nguon: [ "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto" ]
  - id: n2
    cau: Khi nghe concerto, hãy để ý cuộc đối đáp, có khi là tranh tài, giữa một người và số đông.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Chữ cũ: "Sức hấp dẫn của nó nằm ở cuộc đối thoại, có khi là tranh tài, giữa một người và số đông": nhận xét cảm nhận, chuyển thành lời gợi ý nghe. Không trái piano/the-loai ("Piano đối thoại với cả dàn nhạc").'
    luot_2: dung
  - id: n3
    cau: Concerto Baroque, như của Vivaldi, thường dùng hình thức ritornello.
    loai: lich-su
    nguon:
      - lcs-rit
      - teoria-spring
    ket_qua: da-sua
    ghi_chu: "LCS: ritornello \"typical of the first and frequently also the last movement\" của concerto Baroque; Teoria: chương 1 Mùa xuân của Vivaldi \"uses the ritornello form\". Chữ cũ: \"Vivaldi và Bach dùng hình thức ritornello\": nguồn đã mở không nói về Bach (Brandenburg số 5 chỉ có ghi chú về harpsichord, không nói ritornello). mo/link-hong (06/11/2026): LCS đổi sang bản lưu Wayback 11/02/2020, đã đối chiếu: \"The Ritornello form is a term often used for the typical form of the first and frequently also the last movement of the baroque concerto\". Review link-hong (07/11/2026): bản lưu Wayback LCS 11/02/2020 (tải bản gốc id_) có nguyên văn câu trích của lượt 1; chữ trang không đổi, khớp câu."
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20200211003928/https://lcsproductions.net/MusicHistory/MusHistRev/MusicalForms/Ritornello.html", "https://teoria.com/en/articles/2021/vivaldi-seasons/primavera/01.php" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): Bản lưu LCS: \"The Ritornello form is a term often used for the typical form of the first and frequently also the last movement of the baroque concerto\"; Teoria: chương 1 Mùa xuân của Vivaldi \"uses the ritornello form\". Đủ hai vế."
    review: dung
  - id: n4
    cau: Ritornello là tiếng Ý, nghĩa là "lần quay lại nhỏ".
    loai: ten
    nguon:
      - lcs-rit
    ket_qua: da-sua
    ghi_chu: "LCS: tên nghĩa là \"little return\". Chữ cũ: \"điệp khúc nhỏ\"; dịch sát hơn. mo/link-hong (06/11/2026): LCS đổi sang bản lưu Wayback 11/02/2020, đã đối chiếu: \"The name, 'little return,' …\". Review link-hong (07/11/2026): bản lưu Wayback LCS 11/02/2020 (tải bản gốc id_) có nguyên văn câu trích của lượt 1 (\"The name, 'little return,'\"); chữ trang không đổi."
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20200211003928/https://lcsproductions.net/MusicHistory/MusHistRev/MusicalForms/Ritornello.html" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): Bản lưu LCS: \"The name, 'little return,' …\". Khớp \"lần quay lại nhỏ\"."
    review: dung
  - id: n5
    cau: Ritornello do cả dàn nhạc (tutti) chơi, mở đầu và kết thúc chương.
    loai: cau-truc
    nguon:
      - mit-rit
      - lcs-rit
    ket_qua: dung
    ghi_chu: "Listen: ritornello là \"the orchestral music that typically starts the movement off\"; chương kết bằng ritornello ở chủ âm. LCS: các đoạn tutti tạo nên ritornello. mo/link-hong (06/11/2026): trang Listen 8e (digfir-published.macmillanusa.com) không còn: tên miền không phân giải, Wayback Machine không lưu trang này; bỏ nguồn listen-rit, thay bằng MIT OCW 21M.011: ritornello là \"a repeating orchestral section that returns throughout the form\", \"the full ritornello is typically only heard at the beginning and end\". LCS (bản lưu 11/02/2020): \"an alternation of tutti and solo sections … The tutti sections therefore form the ritornello\". Review link-hong (07/11/2026): MIT OCW 21M.011 (Goetjen) đã mở, có nguyên văn các câu trích (\"a repeating orchestral section…\", \"the full ritornello is typically only heard at the beginning and end\"); LCS bản lưu có \"The tutti sections therefore form the ritornello\". Đủ câu."
    luot_2: dung
    luot_2_nguon: [ "https://ocw.mit.edu/courses/21m-011-introduction-to-western-music-fall-2024/pages/week-6-recitation-6a-listening-reading-goetjen", "https://web.archive.org/web/20200211003928/https://lcsproductions.net/MusicHistory/MusHistRev/MusicalForms/Ritornello.html" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): MIT (Goetjen): ritornello là \"a repeating orchestral section that returns throughout the form\"; \"the full ritornello is typically only heard at the beginning and end\"; Vivaldi Op. 4 số 12: \"Opening ritornello\" … \"Closing ritornello\". Bản lưu LCS: \"The tutti sections therefore form the ritornello\"."
    review: dung
  - id: n6
    cau: Ritornello quay lại nhiều lần ở giữa chương, thường ở các giọng khác nhau và có khi chỉ một đoạn ngắn.
    loai: cau-truc
    nguon:
      - mit-rit
    ket_qua: dung
    ghi_chu: "Listen: quay lại nhiều lần, \"often in fragments rather than in full\", ở các giọng khác nhau. mo/link-hong (06/11/2026): Listen 8e không còn (xem n5); MIT OCW 21M.011: các câu của ritornello \"can be reordered and recombined, presented in different keys or modes\"; \"the middle ritornellos are shorter than the opening one and the closing one\"; Vivaldi Op. 4 số 12: \"Ritornello 2 … (partial ritornello)\". Đỡ đủ câu. Review link-hong (07/11/2026): MIT OCW 21M.011 (Goetjen) đã mở, có nguyên văn các câu trích (\"presented in different keys or modes\", \"the middle ritornellos are shorter\", \"partial ritornello\"). Đủ câu."
    luot_2: dung
    luot_2_nguon: [ "https://ocw.mit.edu/courses/21m-011-introduction-to-western-music-fall-2024/pages/week-6-recitation-6a-listening-reading-goetjen", "https://en.wikipedia.org/wiki/Ritornello" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): MIT: các câu của ritornello \"presented in different keys or modes\"; \"the middle ritornellos are shorter than the opening one and the closing one\"; Op. 4 số 12: \"Ritornello 2 … (partial ritornello)\". Wikipedia (Burkhart): \"Later statements of the ritornello are usually partial\"."
    review: dung
  - id: n7
    cau: "Xen giữa các ritornello là các đoạn độc tấu: nhạc cụ độc tấu chơi những đoạn khó, điêu luyện hơn."
    loai: cau-truc
    nguon:
      - lt-baroque
    ket_qua: da-sua
    ghi_chu: "Listen: soloist chơi \"faster and more brilliant\" (virtuoso). Chữ cũ: \"khoe kỹ thuật, chuyển giọng\"; bỏ \"chuyển giọng\" (không nguồn). mo/link-hong (06/11/2026): Listen 8e không còn (xem n5); LibreTexts 8.2: nghệ sĩ độc tấu \"will perform typically very challenging and demanding music. The soloist is often a virtuoso\". Vế \"điêu luyện hơn\" có nguồn; vế \"nhanh\" chưa có nguồn đọc được thay Listen (\"faster and more brilliant\"): người gom xem lại, giữ hay bỏ chữ \"nhanh\". Review link-hong (07/11/2026): lượt 2 khong-chac vế \"nhanh\": Listen 8e (nguồn duy nhất) không còn; LibreTexts 8.2 (đã mở): \"very challenging and demanding music … The soloist is often a virtuoso\"; MIT, LCS không nói đoạn độc tấu nhanh hơn. Bỏ \"nhanh\" theo đề xuất của lượt 2. Chữ cũ (trước link-hong): \"nhạc cụ độc tấu chơi nhanh và điêu luyện hơn\"; chữ mới: \"nhạc cụ độc tấu chơi những đoạn khó, điêu luyện hơn\" (chỉ bỏ vế không có nguồn, nên không cần lượt 2 lại)."
    luot_2: khong-chac
    luot_2_nguon: [ "https://human.libretexts.org/Courses/Prince_Georges_Community_College/Music_Appreciation%3A_A_Topical_Approach_to_Music_Genre_and_Style/08%3A_The_Instrumental_Concerto/8.02%3A_Concertos_in_the_Baroque_Period", "https://ocw.mit.edu/courses/21m-011-introduction-to-western-music-fall-2024/pages/week-6-recitation-6a-listening-reading-goetjen", "https://toddtarantino.com/hum/ritornelloform.html", "https://en.wikipedia.org/wiki/Ritornello" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): LibreTexts 8.2: độc tấu \"very challenging and demanding music. The soloist is often a virtuoso\": đỡ vế \"điêu luyện\". Vế \"nhanh (hơn)\": MIT, Teoria, Todd Tarantino (Ritornello Form), Wikipedia Ritornello đều không nói đoạn độc tấu nhanh hơn ritornello; không tìm được nguồn đọc được nào thay Listen. Chương nhanh thì ritornello cũng nhanh; đoạn độc tấu thường dày nốt hơn nhưng không có nguồn. Đề xuất bỏ \"nhanh\": \"Xen giữa các ritornello là các đoạn độc tấu: nhạc cụ độc tấu chơi những đoạn khó, điêu luyện hơn.\""
    review: dung
  - id: n8
    cau: "Sơ đồ ritornello: ritornello mở đầu, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng chính."
    loai: cau-truc
    nguon:
      - mit-rit
    ket_qua: da-sua
    ghi_chu: "Listen: ritornello ở giọng khác khi chương tiến triển, trở lại chủ âm ở cuối. Chữ cũ ghi ritornello đầu ở \"giọng chính\"; nguồn đã mở không nói giọng của lần đầu nên sơ đồ ghi \"mở đầu\". Sơ đồ chỉ là mẫu. Kiểm mẫu D5: chủ repo không mở được trang Listen (tên miền phụ không phân giải trên máy kiểm), kết luận đúng theo Grout/Palisca (qua Wikipedia, Ritornello): \"The first and last statements are in the tonic\". Người gom mở lại trang Listen ngày 29/10/2026: ritornello \"usually it is played in different keys as the movement proceeds\", cuối chương \"the orchestral ritornello returns in the tonic key\". mo/d5-hinh: sơ đồ nay là hình tĩnh của site (trước đây khối mermaid hiện nguyên mã); chữ và thứ tự giữ nguyên. mo/link-hong (06/11/2026): Listen 8e không còn (xem n5); MIT OCW 21M.011: sơ đồ ritornello giả định, \"a 'there and back again' trajectory in terms of key, as the form begins and ends in the tonic or home key but journeys to other keys (or modes) in the middle\"; ritornello xen các đoạn solo. Đỡ sơ đồ (ritornello giữa ở giọng khác, ritornello cuối ở giọng chính). Review link-hong (07/11/2026): MIT OCW 21M.011 (Goetjen) đã mở, có nguyên văn các câu trích (\"there and back again\", \"journeys to other keys (or modes) in the middle\"). Sơ đồ khớp."
    luot_2: dung
    luot_2_nguon: [ "https://ocw.mit.edu/courses/21m-011-introduction-to-western-music-fall-2024/pages/week-6-recitation-6a-listening-reading-goetjen", "https://en.wikipedia.org/wiki/Ritornello" ]
    luot_2_ghi_chu: "mo/link-hong (07/11/2026): MIT: sơ đồ ritornello giả định, \"the form begins and ends in the tonic or home key but journeys to other keys (or modes) in the middle\"; ritornello xen đoạn solo. Wikipedia (Burkhart): \"The first and last statements are in the tonic\". Sơ đồ rút gọn, khớp."
    review: dung
  - id: n9
    cau: Khác với rondo, nơi điệp khúc luôn trở lại ở chủ âm, ritornello quay lại ở giọng khác nhau và thường chỉ là một phần của đoạn gốc.
    loai: cau-truc
    nguon:
      - omt-rondo
      - mit-rit
    ket_qua: da-sua
