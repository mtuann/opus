    cau: Chương 1 dài 73 ô nhịp.
    loai: so-lieu
    nguon:
      - gerber
      - ptna-545
      - mutopia-545
    ket_qua: da-sua
    ghi_chu: "chưa chắc: không nguồn nào đã mở nêu tổng số ô. PTNA chỉ ghi thời lượng; Gerber trích đến ô 73; Mutopia/IMSLP cho trình bày 1–28, phát triển 29–41, tái hiện từ ô 42. Suy ra: tái hiện = 28 ô + 4 ô đoạn chuyển mở rộng (chủ đề 2 ở ô 59 thay vì 55) thì cuối ở ô 73, khớp. Lượt 2 nên đếm ô cuối trên bản IMSLP/Mutopia. Review D5-gom: mã LilyPond Mutopia (theo IMSLP) đếm được 73 ô: ô cuối c4-. <e' g c>-. c r; hai \\repeat volta 2 (ô 1–28, ô 29–73); lượt 2: IMSLP ghi chương 1 73 ô. Bỏ \"khoảng\". Chữ cũ: \"Chương 1 chỉ dài khoảng 73 ô nhịp\"; chữ mới: \"Chương 1 chỉ dài 73 ô nhịp\". Người gom (D5-gom): lượt 2 bổ sung khong-chac vì không mở được nguồn (Britannica, VSL, OMT, IMSLP lỗi hay chặn) hay vì câu tả ví dụ soạn mà danh sách không kèm mã, không phải vì nguồn nói khác; giữ theo nguồn review đã mở, ghi ở trên."
    luot_2: khong-chac
    luot_2_ghi_chu: "K.545 chương 1: đếm từ Mutopia thấy phần trình bày 28 ô, phát triển 13 ô (ô 29-41); phần tái hiện chưa đếm chắc, tổng 73 khớp số thường dẫn nhưng chưa xác nhận."
