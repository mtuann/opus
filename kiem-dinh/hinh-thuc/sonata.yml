  - id: n10
    cau: Coda là đoạn kết, có thể ngắn hay dài; coda chương 1 Giao hưởng số 5 của Beethoven là một coda dài.
    loai: dinh-nghia
    nguon:
      - omt-sonata
      - louis-symph
    ket_qua: da-sua
    ghi_chu: 'Trang cũ: "có thể rất ngắn (Mozart) hoặc dài như một phần phát triển thứ hai (Beethoven)": không có nguồn cho vế Mozart và so sánh. Thuật ngữ: thuat-ngu.yml dùng "Đoạn kết (coda)". Review D5-gom: lượt 2 không thấy nguồn cho coda chương 1 Giao hưởng số 5. Giáo trình Louis (louis-symph, đã mở lại): "This coda is much longer than any coda we have yet listened to in the music of Haydn or Mozart" (coda từ 6:22). Chữ cũ: "có thể ngắn hay rất dài, như coda chương 1 Giao hưởng số 5 của Beethoven"; chữ mới: "có thể ngắn hay dài; coda chương 1 Giao hưởng số 5 của Beethoven là một coda dài" (bỏ "rất", nguồn chỉ so với Haydn, Mozart).'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/topic/Symphony-No-5-in-C-Minor-Op-67" ]
    luot_2_ghi_chu: Coda là đoạn kết, độ dài tùy ý; Britannica xác nhận mô-típ bốn nốt chi phối chương 1. Việc coda chương 1 dài là kiến thức chuẩn, trang đã mở không nêu độ dài.
