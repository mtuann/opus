nhan_dinh:
  - id: n1
    cau: Hình thức sonata là "kiến trúc" quan trọng của nhạc thời Cổ điển, và các nhà soạn nhạc thời Lãng mạn vẫn tiếp tục dùng (dòng mô tả và đoạn mở đầu).
    loai: lich-su
    nguon:
      - brit-sonata
      - omt-sonata
    ket_qua: da-sua
    ghi_chu: 'Trang cũ: "quan trọng nhất của nhạc thời Cổ điển và Lãng mạn" (so sánh "nhất", không có nguồn). Nguồn chỉ nói đây là hình thức chủ đạo của chương nhanh thời Cổ điển, còn thời Lãng mạn vẫn dùng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/sonata-form" ]
    luot_2_ghi_chu: "Britannica: hình thức còn được nhiều nhà soạn sau dùng (nêu Brahms 4)."
  - id: n2
    cau: Hình thức sonata thường dùng cho chương đầu của giao hưởng, sonata, concerto, tứ tấu.
    loai: lich-su
    nguon:
      - ency-sonata
      - brit-sonata
    ket_qua: dung
    ghi_chu: "COD: dùng cho chương đầu của sonata, giao hưởng, concerto; Britannica nêu cả tứ tấu."
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/sonata-form", "https://www.britannica.com/art/symphony-music", "https://human.libretexts.org/Bookshelves/Music/Music_Appreciation/Music_Appreciation_II_(Kuznetsova)/13:_The_Classical_Era_Classical_Forms_and_Symphony_J._Haydn/13.03:_The_Sonata_Allegro_Form" ]
    luot_2_ghi_chu: "Britannica: chương đầu sonata, giao hưởng, tứ tấu; Kuznetsova: cả concerto."
  - id: n3
    cau: Hiểu hình thức này thì có chỗ dựa để nghe chương đầu của nhiều bản giao hưởng từ Haydn đến Brahms.
    loai: lich-su
    nguon:
      - brit-sonata
      - louis-symph
    ket_qua: da-sua
    ghi_chu: 'Trang cũ: "theo dõi gần như mọi bản giao hưởng" (nói quá). Đã hạ thành "chỗ dựa để nghe chương đầu của nhiều bản".'
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/symphony-music", "https://www.britannica.com/art/sonata-form" ]
    luot_2_ghi_chu: "Hợp lý: giao hưởng chương đầu từ Haydn đến Brahms thường dùng hình thức sonata."
  - id: n4
    cau: "Cấu trúc ba hồi: trình bày, phát triển, tái hiện, rồi coda (sơ đồ mermaid và danh sách)."
    loai: dinh-nghia
    nguon:
