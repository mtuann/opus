    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/sonata-form", "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/" ]
    luot_2_ghi_chu: Trình bày, phát triển, tái hiện; coda tùy chọn.
  - id: n5
    cau: 'Phần trình bày: chủ đề 1 ở giọng chính, đoạn chuyển để chuyển giọng, rồi chủ đề 2 ở giọng mới; hai giọng tạo nên "xung đột".'
    loai: dinh-nghia
    nguon:
      - omt-sonata
      - brit-sonata
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.britannica.com/art/sonata-form", "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/" ]
    luot_2_ghi_chu: "Chủ đề 1 giọng chính, chuyển tiếp, chủ đề 2 giọng mới; Britannica: xung đột giọng."
  - id: n6
    cau: Nếu giọng chính là trưởng, giọng mới thường là giọng át; nếu giọng chính là thứ, giọng mới thường là giọng trưởng song song.
    loai: quy-tac
    nguon:
      - brit-dev
      - omt-sonata
    ket_qua: dung
    ghi_chu: Giọng "trưởng song song" = relative major (chưa có trong thuat-ngu.yml).
    luot_2: dung
    luot_2_nguon: [ "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/", "https://www.britannica.com/art/sonata-form" ]
    luot_2_ghi_chu: 'OMT: trưởng thì V; thứ thì III hoặc v. Câu viết "trưởng song song" cho giọng thứ là hơi thu hẹp nhưng đúng (III).'
  - id: n7
    cau: Thời Cổ điển, cả phần trình bày thường được nhắc lại.
