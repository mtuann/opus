ghi_chu: 'Lượt 1 (D5-L2 phần A). Trang sonata: 38 nhận định cộng 4 câu quiz, không có khối abc; sơ đồ mermaid kiểm ở n4. Thuật ngữ chưa có trong thuat-ngu.yml (không làm hồ sơ thuật ngữ): chủ đề, đoạn chuyển, đoạn mở đầu (introduction), sonata-rondo, sonatina, giọng trưởng song song, giọng hạ át. Đã dùng "đoạn kết" cho coda, khớp thuat-ngu. Chưa chắc: n17 và n26 (mốc ô 73, không nguồn nào nêu tổng số ô).'
doi_chu:
  - cu: Hình thức sonata là "kiến trúc" quan trọng nhất của nhạc thời Cổ điển và Lãng mạn. Nó thường dùng cho chương đầu của giao hưởng, sonata, concerto, tứ tấu. Hiểu nó rồi, bạn có thể theo dõi gần như mọi bản giao hưởng từ Haydn đến Brahms.
    moi: Hình thức sonata là "kiến trúc" quan trọng của nhạc thời Cổ điển, và các nhà soạn nhạc thời Lãng mạn vẫn tiếp tục dùng. Nó thường dùng cho chương đầu của giao hưởng, sonata, concerto, tứ tấu. Hiểu nó rồi, bạn có chỗ dựa để nghe chương đầu của nhiều bản giao hưởng từ Haydn đến Brahms.
    ly_do: 'n1 (da-sua): bỏ "nhất", nguồn không xếp hạng.; n3 (da-sua): hạ câu nói quá.'
  - cu: flowchart LR A["Trình bày<br/>Chủ đề 1 (giọng chính)<br/>→ chuyển giọng →<br/>Chủ đề 2 (giọng mới)"] --> B["Phát triển<br/>chia nhỏ, biến đổi,<br/>đi qua nhiều giọng"] B --> C["Tái hiện<br/>Chủ đề 1 (giọng chính)<br/>Chủ đề 2 (giọng chính)"] C --> D["Coda<br/>(phần kết)"]
    moi: flowchart LR A["Trình bày<br/>Chủ đề 1 (giọng chính)<br/>→ chuyển giọng →<br/>Chủ đề 2 (giọng mới)"] --> B["Phát triển<br/>chia nhỏ, biến đổi,<br/>đi qua nhiều giọng"] B --> C["Tái hiện<br/>Chủ đề 1 (giọng chính)<br/>Chủ đề 2 (giọng chính)"] C --> D["Coda<br/>(đoạn kết)"]
    ly_do: "n8, q2 (da-sua): sơ đồ: phát triển không nhất thiết qua giọng thứ (OMT)."
  - cu: "Phát triển (development): các chủ đề bị chia nhỏ, biến đổi, chồng lên nhau, đưa qua nhiều giọng, thường là giọng thứ. Đây là phần bất ổn, căng thẳng nhất."
    moi: "Phát triển (development): các chủ đề thường bị chia nhỏ, kết hợp lại và đưa qua nhiều giọng, thường là những giọng xa giọng chính. Đây là phần bất ổn nhất."
    ly_do: "n8 (da-sua): phát triển không nhất thiết đi qua giọng thứ.; q2 (da-sua): khớp n8."
