khuong_nhac: []
ghi_chu: 'Trang khung (D7-L3, phần 1/2), nhật ký phiên bản của Opus Zero (site cũ) nên phần lớn câu là ve-site kiểm trên ../opus-zero (HEAD 5d08189), lịch sử git của nó (git ghi v2–v4 và v10–v11 gộp trong một commit nên số liệu riêng từng phiên bản chỉ kiểm được ở mức cộng dồn: n117, n137, n140, n143, n144 ghi "chưa chắc") và gh run list (thời gian deploy). Một chỗ sửa: n91 (Rellstab 1823–1824). Vế ngoài tách riêng, cần lượt 2 hoặc nguồn bậc 1–2 tốt hơn: tên và năm bản thu, bản quyền Mỹ, Rellstab, Kleiber 1974, ba sonata Chopin, Lieder ohne Worte, 1812, Rhapsody, Mariage d''Amour, clavichord, trio. Link: 125 link /opus/… đều trỏ tới trang có trong src/data/trang.yml; #mục kiểm trên site cũ. Mục mới viết theo site mới (n1–n4, n146–n152) kiểm trên repo mới.'
