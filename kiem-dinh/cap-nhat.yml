    ghi_chu: 'chưa chắc: Yiruma: Wikipedia Yiruma (Kiss the Rain trong From the Yellow Room, 2003); Hisaishi/One Summer''s Day: chú thích ảnh Wikipedia (Spirited Away); Tiersen: Amélie soundtrack (qua kết quả tìm kiếm); Einaudi, Nuvole bianche trong album Una mattina (2004): kết quả tìm kiếm Classic FM, udiscovermusic. Chưa có nguồn bậc 1–2 mở được: nên lượt 2 đối chiếu thêm với trang tác phẩm của nhà xuất bản/hãng đĩa. Review D7-gom: xác nhận bằng nguồn bậc 2 (đài, hãng đĩa): Classic FM (Yiruma, River Flows in You; Hisaishi, One Summer''s Day trong Spirited Away; Einaudi, Nuvole bianche), Brilliant Classics (danh sách bài của Yiruma có River Flows In You, Kiss The Rain), Radio Swiss Classic (Comptine d''un autre été: L''après midi, Yann Tiersen). Không tìm được trang nhà xuất bản bản nhạc dùng được (Sheet Music Direct chỉ có bản soạn tự đăng).'
