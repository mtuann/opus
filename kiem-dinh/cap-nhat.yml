  - id: n1
    cau: Mục "Tác phẩm mới lên site" liệt kê bài học tác phẩm và hướng dẫn nghe, theo ngày lên site, mới trước.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/plugins/thanh-phan.mjs, tacPhamMoi: lấy bản ghi tác phẩm có them_ngay và trang chính có trong bản build, sắp theo ngày giảm dần (rồi theo trang), ghi "(bài học)" hay "(hướng dẫn nghe)" theo loai; trường them_ngay ở src/du-lieu.mjs. Review D7-gom: src/plugins/thanh-phan.mjs tacPhamMoi (dòng 969–991) lọc bản ghi có them_ngay và trang chính trong bản build, sắp ngày giảm dần, ghi (bài học)/(hướng dẫn nghe). Hiện dist/cap-nhat chỉ có câu ''Chưa có tác phẩm nào…'' vì tac-pham.yml chưa bản ghi nào có them_ngay (đúng plans/lam-lai/README.md dòng 245).'
    review: dung
  - id: n2
    cau: 'Site đang được làm lại ở địa chỉ này, dưới tên Opus: mỗi trang chỉ lên site khi đã được kiểm định.'
