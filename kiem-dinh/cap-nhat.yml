  - cu: "Rà soát độ chính xác: cấp độ của từng bài được thống nhất giữa danh mục, menu, lộ trình và trang bài học; hướng dẫn nghe Ánh trăng sửa lại nguồn gốc biệt danh (hình ảnh mặt hồ dưới trăng có từ truyện Theodor của Rellstab năm 1824; chuyện hồ Lucerne năm 1832 không có nguồn gốc chắc chắn); phân tích fugue Đô thứ sửa vị trí âm nền ở cuối bài."
    moi: "Rà soát độ chính xác: cấp độ của từng bài được thống nhất giữa danh mục, menu, lộ trình và trang bài học; hướng dẫn nghe Ánh trăng sửa lại nguồn gốc biệt danh (hình ảnh mặt hồ dưới trăng có từ truyện Theodor của Rellstab khoảng năm 1823–1824; chuyện hồ Lucerne năm 1832 không có nguồn gốc chắc chắn); phân tích fugue Đô thứ sửa vị trí âm nền ở cuối bài."
    ly_do: "n91 (da-sua): Henle HN 1062 ghi Rellstab viết truyện năm 1823 (Wikipedia: 1824); ghi khoảng năm 1823–1824 như trang bài học cũ."
  - cu: "Hướng dẫn nghe mới: Debussy, Préludes quyển 1. Mười hai bức tranh âm thanh, với bản thu trọn quyển của Marcelle Meyer (1956, phạm vi công cộng) và mốc đầu từng bản."
    moi: "Hướng dẫn nghe mới: Debussy, Préludes quyển 1. Mười hai bức tranh âm thanh, với bản thu trọn quyển của Marcelle Meyer (1956, trên Wikimedia Commons) và mốc đầu từng bản."
    ly_do: 'Review D7-gom (n48 da-sua): "phạm vi công cộng" trái với mục phiên bản 15 của chính trang (ở Mỹ bản thu còn được bảo hộ, n27, copyright.gov); ghi nơi có bản thu.'
  - cu:
      - Mục mới Bài phổ biến ngoài nhạc cổ điển, bắt đầu với Mariage d'Amour, bài hay bị gọi nhầm là "Spring Waltz" của Chopin. Bảng Grade nghĩa là gì trên site này; mức độ ở Các thể loại nhạc piano ghi theo bảy chặng. Trang Thu âm buổi tập thêm cách thu sao cho nghe lại được.
      - 'Rà soát độ chính xác: cấp độ ước lượng của nhiều bài được thống nhất giữa các trang; biệt danh "Ánh trăng" (hình ảnh của Rellstab, cái tên chỉ phổ biến sau khi Beethoven mất); năm thu Giao hưởng số 5 của Carlos Kleiber (1974); Chopin viết ba sonata piano; hai tập cuối Lieder ohne Worte của Mendelssohn in sau khi ông mất. Những nội dung từng có ở hai nơi (ba bàn đạp, bảng danh mục tác phẩm, khi bị chững lại, buổi tập mẫu, kế hoạch hôm nay) giờ chỉ còn ở một trang, các trang khác dẫn link tới.'
