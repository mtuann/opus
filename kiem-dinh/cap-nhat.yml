    cau: Biệt danh "Ánh trăng" gắn với hình ảnh mặt hồ dưới trăng mà Rellstab viết về chương 1.
    loai: lich-su
    nguon:
      - henle-hn1062
      - wiki-moonlight
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: Henle ghi Rellstab mô tả mặt hồ dưới trăng năm 1823 và nói biệt danh "đã có từ lúc nhà soạn nhạc còn sống" (trái với "chỉ phổ biến sau khi Beethoven mất"); Wikipedia: tên Mondscheinsonate xuất hiện cuối thập niên 1830 (Beethoven mất 1827), nhưng nói có thể có sớm hơn. Hai nguồn khác nhau; đề nghị viết "Rellstab là người so sánh chương 1 với mặt hồ dưới ánh trăng; tên Mondscheinsonate phổ biến từ khoảng 1840" (trang hướng dẫn nghe cũ viết như vậy). Review D7-gom: Henle HN 1062 (bậc 2, đã mở): biệt danh "was already around during the composer''s lifetime"; Rellstab viết về chương 1 năm 1823. Trái với vế "cái tên chỉ phổ biến sau khi Beethoven mất" (Wikipedia, bậc 3: cuối thập niên 1830). Theo nguồn bậc 2, bỏ vế ấy. Chữ cũ: "(hình ảnh của Rellstab, cái tên chỉ phổ biến sau khi Beethoven mất)". Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): dung, nguồn https://en.wikipedia.org/wiki/Moonlight_Sonata; Wikipedia (tìm nguồn): Rellstab 1824, ''Moonlight Sonata'' xuất hiện cuối thập niên 1830, sau 1827. Nên đối chiếu Sarah Waltz (2007)..'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Piano_Sonata_No._14_(Beethoven)" ]
    luot_2_ghi_chu: "Trang Wikipedia đã mở (dùng vì trích văn bản gốc; Britannica trả 403, PDF của Henle không đọc được chữ): Rellstab so sánh chương 1 (Adagio sostenuto) với mặt hồ dưới ánh trăng, trong truyện Theodor (1824), 'The lake reposes in twilit moon-shimmer'. Lưu ý chi tiết hồ Luzern và chiếc thuyền là do Lenz (1852) thêm, không có trong văn bản Rellstab; câu đang xét chỉ nói 'mặt hồ dưới trăng' nên đúng. Chưa xác nhận bằng henle.de."
