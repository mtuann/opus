  - cu: 'Cả 34 bài học tác phẩm đều có bản thu: mười bài học có thêm bản thu từ IMSLP (mười ba bản thu của Luis Kolodin, Ramón León Egea, Jewgeni Smirnow và nhóm Mississippi College Piano Pedagogy), lưu ngay trên site vì IMSLP không cho nhúng file trực tiếp; Thuyền ca Venice và Musette Rê trưởng có bản thu từ Wikimedia Commons. Các bản thu mới đều có mốc tham khảo. Người chơi, giấy phép và nguồn của từng file: tệp nguồn âm thanh.'
    moi: 'Cả 34 bài học tác phẩm đều có bản thu: mười bài học có thêm bản thu từ IMSLP (mười ba bản thu của Luis Kolodin, Ramón León Egea, Jewgeni Smirnow và nhóm Mississippi College Piano Pedagogy), lưu ngay trên site Opus Zero vì IMSLP không cho nhúng file trực tiếp; Thuyền ca Venice và Musette Rê trưởng có bản thu từ Wikimedia Commons. Các bản thu mới đều có mốc tham khảo. Người chơi, giấy phép và nguồn của từng file: tệp nguồn âm thanh.'
    ly_do: 'Bản thu IMSLP của các bài học chỉ lưu trên site cũ; site mới chưa có file mp3 (public/audio/ chỉ có NGUON.txt), bài học tác phẩm lên ở đợt 6 (README đợt 7: viết lại cho đúng với site lúc đăng).'
  - cu:
      - 'Hằng tuần (tự động): GitHub Actions chạy workflow Kiểm tra link và bản thu (.github/workflows/link-check.yml):'
      - kiểm mọi link ra ngoài trong bài (link nội bộ đã được kiểm ở mỗi lần build);
      - 'đối chiếu mọi bản thu với Wikimedia Commons: file còn đó không, độ dài và giấy phép có đổi không.'
      - Có lỗi thì một issue ("Báo cáo link hỏng" hoặc "Báo cáo bản thu") được mở, hoặc được cập nhật nếu đang mở; tuần sau hết lỗi thì issue tự đóng.
      - 'Mỗi quý (tháng 1, 4, 7, 10), khoảng 30 phút:'
      - 'Âm nhạc hôm nay: cập nhật tin đáng chú ý (cuộc thi lớn, giải Pulitzer Âm nhạc công bố tháng 5, nhà soạn nhạc qua đời).'
      - 'Nhạc cổ điển ở Việt Nam: dàn nhạc, nhà hát, sự kiện mới.'
      - 'Tài nguyên và Học với thầy và thi cấp: kiểm tra giáo trình thi cấp piano của ABRSM, Trinity (giáo trình piano ABRSM 2027–2028 dùng được từ 1/1/2027; giáo trình 2025–2026 hết hiệu lực ngày 31/12/2027).'
      - 'Mở tay các link mà kiểm tra tự động bỏ qua vì trang chặn robot: abrsm.org (ở Tài nguyên, Học với thầy và thi cấp và các trang Piano) và Oxford Music Online (tài liệu tham khảo).'
      - Sửa dòng "Cập nhật lần cuối" ở các trang trên.
      - Ghi thay đổi vào nhật ký ở trang này.
      - 'Khi thêm nội dung mới: ghi nguồn ở cuối trang (xem tài liệu tham khảo); thêm trang vào mục nav trong mkdocs.yml; chạy mkdocs build --strict trên máy trước khi push để bắt link nội bộ hỏng.'
    moi:
      - 'Trước khi lên site: mỗi trang được kiểm định. Các nhận định trong trang (định nghĩa, tên, năm, cấp độ, cấu trúc…) được đối chiếu với nguồn, được kiểm lại và review; trang chỉ lên site khi hồ sơ kiểm định đủ, rồi được khóa. Muốn sửa trang đã khóa thì phải mở khóa, ghi lý do và kiểm định lại phần sửa.'
      - 'Mỗi lần cập nhật (tự động): trước khi đăng, site được kiểm: link tới từng trang và từng mục, mọi khuông nhạc (cú pháp và độ dài ô nhịp), dữ liệu dùng chung (chặng, Grade, năm sinh–mất, số danh mục), cách hiển thị trên ba trình duyệt và ba cỡ màn hình. Có lỗi thì không đăng, site giữ bản trước.'
      - 'Trang có thông tin mau cũ (tin tức, giáo trình thi cấp, ứng dụng, tài nguyên…): mỗi trang ghi sẵn tháng rà lại. Đến tháng ấy, cả trang được kiểm định lại.'
      - 'Khi thêm nội dung mới: ghi nguồn ở cuối trang (xem tài liệu tham khảo).'
    ly_do: 'Viết lại theo site mới (bao-cao/d2-bang-tang.md dòng 114): bỏ danh sách rà theo quý (thay bằng ra_lai của trang.yml cho trang tham chiếu có hạn), bỏ workflow kiểm link hằng tuần (site mới chưa có), bỏ mkdocs; ghi kiểm định, khóa và kiểm tự động trước khi đăng (.github/workflows/deploy.yml, plans/ben-vung/chuan-kiem-dinh.md).'
  - cu: null
    moi: 'id: tac-pham-moi-len-site'
    ly_do: Id của tiêu đề mới "Tác phẩm mới lên site".
  - cu: "Rà soát độ chính xác: cấp độ của từng bài được thống nhất giữa danh mục, menu, lộ trình và trang bài học; hướng dẫn nghe Ánh trăng sửa lại nguồn gốc biệt danh (hình ảnh mặt hồ dưới trăng có từ truyện Theodor của Rellstab năm 1824; chuyện hồ Lucerne năm 1832 không có nguồn gốc chắc chắn); phân tích fugue Đô thứ sửa vị trí âm nền ở cuối bài."
    moi: "Rà soát độ chính xác: cấp độ của từng bài được thống nhất giữa danh mục, menu, lộ trình và trang bài học; hướng dẫn nghe Ánh trăng sửa lại nguồn gốc biệt danh (hình ảnh mặt hồ dưới trăng có từ truyện Theodor của Rellstab khoảng năm 1823–1824; chuyện hồ Lucerne năm 1832 không có nguồn gốc chắc chắn); phân tích fugue Đô thứ sửa vị trí âm nền ở cuối bài."
    ly_do: "n91 (da-sua): Henle HN 1062 ghi Rellstab viết truyện năm 1823 (Wikipedia: 1824); ghi khoảng năm 1823–1824 như trang bài học cũ."
