doi_chu:
  - cu: null
    moi:
      - Tác phẩm mới lên site
      - 'Bài học tác phẩm và hướng dẫn nghe, theo ngày lên site, mới trước:'
    ly_do: 'Thêm (D7-L3, README đợt 7): nhật ký tác phẩm mới sinh từ them_ngay (::tac-pham-moi); trước đợt 6 chưa có tác phẩm nào.'
  - cu: null
    moi: 'Site đang được làm lại ở địa chỉ này, dưới tên Opus: mỗi trang chỉ lên site khi đã được kiểm định. Các phiên bản 1–15 dưới đây là của Opus Zero, bản trước của site, ở https://mtuann.github.io/opus-zero/. Link trong các mục này dẫn tới trang tương ứng ở site mới; trang chưa lên site thì ghi "sắp có".'
    ly_do: 'Thêm: site mới tên Opus, trang chỉ lên khi đã kiểm định; nói rõ các mục phiên bản 1–15 là lịch sử của Opus Zero, nên các câu ở thì hiện tại trong đó đúng với site cũ lúc ấy.'
  - cu:
      - 'Kèm thói quen 10 phút mỗi ngày và kế hoạch 4 tuần. Bảng gắn quãng với giai điệu quen thêm ví dụ lấy từ những bài bạn tập trên site. - Năm bài phổ biến ngoài nhạc cổ điển, trong Tác phẩm theo cấp độ: - River Flows in You và Kiss the Rain (Yiruma); - One Summer''s Day (Joe Hisaishi); - Comptine d''un autre été: l''après-midi (Yann Tiersen); - Nuvole bianche (Ludovico Einaudi).'
      - 'Mỗi bài có xuất xứ, cấp ước lượng, kỹ năng cần, bài cổ điển nên học trước và nơi mua bản nhạc được cấp phép. Site không chép nhạc của những bài còn bản quyền này. - Bản thu cho các hướng dẫn nghe nhạc piano: Scarlatti (Sonata K. 380, Raymond Smullyan), Sonata K. 331 của Mozart (Luis Kolodin, cả ba chương, link tới IMSLP), Concerto số 21 của Mozart (chỉ có chương 3), Concerto của Grieg, Những bức tranh ở phòng triển lãm (bản piano, Chiara Bertoglio, link tới IMSLP), Concerto số 2 của Rachmaninoff và Rhapsody in Blue (bản thu đầu tiên, năm 1924, chính Gershwin chơi piano). Mốc tham khảo có ít nhất ở đầu từng chương hoặc từng bài; Eine kleine Nachtmusik, Mùa xuân của Vivaldi và Valse La thứ của Chopin cũng đã có mốc. - Bản thu chỉ dẫn link: bản thu dài trên IMSLP không lưu trên site, vì file quá nặng; khối nghe dẫn link tới từng file, mốc tham khảo vẫn hiện trong bảng, ghi thời điểm trong từng file. Hai bản thu của Marcelle Meyer (Préludes của Debussy, thu năm 1956, và Invention số 1, thu năm 1948) cũng chỉ còn link tới Wikimedia Commons: ở Mỹ, nơi đặt site, hai bản thu này vẫn còn được bảo hộ. - Sửa theo bản nhạc: - Valse La thứ của Chopin: đoạn C (La trưởng) dài 8 ô chứ không phải 16, và dấu nhắc lại thứ hai gồm cả đoạn A'' lẫn đoạn C. Bảng theo dõi, hình cấu trúc và mốc tham khảo được sửa theo. Trang thêm chuyện bài từng được in năm 1860 dưới tên Charlotte de Rothschild. - Mùa xuân của Vivaldi: phần cuối chương 1 tách thành ba sự kiện (ritornello, một đoạn độc tấu ngắn, ritornello cuối), đủ mốc. - Nguồn: chín trang có mục Nguồn với nguồn thật: Minuet và Trio, Overture, Scherzo, Thơ giao hưởng và các bài nhạc lý từ 28 đến 32. Trong lúc đối chiếu, vài chi tiết được sửa cho đúng nguồn: - trio thường ở giọng át hoặc giọng cùng tên; - Musette Rê trưởng là hình thức ba đoạn; - vài ví dụ không tìm được nguồn đã được bỏ. - Mỗi điều viết một nơi: bài Hình thức nhỏ giữ phần chi tiết về hình thức hai đoạn, ba đoạn; trang Minuet và Trio và trang Scherzo giữ phần của mình. Các trang này link qua lại. Hai trang nhà soạn nhạc (Lịch sử và Piano) link tới nhau cho từng người. - Giấy phép: nội dung site theo giấy phép CC BY-SA 4.0. Bạn được sao chép, chia sẻ và chỉnh sửa, kể cả cho mục đích thương mại, nếu ghi nguồn và chia sẻ lại theo cùng giấy phép. Bản thu, font và nội dung trích từ nguồn khác giữ giấy phép riêng (chi tiết). - Kiểm tra tự động: - mỗi lần cập nhật: các con số (số bài học, số hướng dẫn nghe…), cấp độ của từng bài ở mọi nơi, và link tới từng mục; - mỗi tuần: link ra ngoài, và bản thu trên Wikimedia Commons, để phát hiện link hỏng và file bị xóa.'
