  - id: n34
    cau: 'Quy tắc nhạc: trio thường đổi giọng, hoặc đổi trưởng – thứ trên cùng chủ âm.'
    loai: quy-tac
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: Wikipedia Minuet (bậc 3) ghi trio ở "V hoặc I (hay giọng gần)"; chưa tìm được nguồn bậc 1–2 ghi cả hai ("giọng cùng tên" tức giọng song song); Open Music Theory (Ternary form) chỉ nói chung A và B thường bắt đầu, kết ở cùng giọng, trang bị 403 khi đọc. Nội dung này thuộc hồ sơ trang hinh-thuc/minuet-trio; câu ở trang Cập nhật nên viết chung ("thường ở giọng gần") hay bỏ. Review D7-gom: chữ cũ "trio thường ở giọng át hoặc giọng cùng tên". Trang đã khóa hinh-thuc/minuet-trio (m7, da-sua) đã bỏ "giọng át" vì không có nguồn bậc 1–2, viết "thường đổi giọng, hoặc đổi trưởng – thứ trên cùng chủ âm" (OMT bản 1, Minuet Form). Nhật ký viết lại cho khớp trang ấy. Chữ đổi sau lượt 2: lượt 2 bổ sung. Lượt 2 cũ (trước khi đổi chữ): khong-chac; Trio của minuet thường ở giọng liên quan gần (át, hạ át, cùng tên hay tương đối); câu hơi hẹp, chưa mở nguồn Open Music Theory..'
    nguon: [ omt1e-minuet ]
    luot_2: dung
    luot_2_nguon: [ "https://human.libretexts.org/Bookshelves/Music/Book%3A_Open_Music_Theory/05%3A_Form_(II)_-_Other_Forms_and_Thematic_Structures/5.12%3A_Other_Formal_Structures_in_the_Classical_Style_-_Minuet_Form" ]
    luot_2_ghi_chu: "Open Music Theory 5.12 (Minuet Form, bản LibreTexts) đã mở: tương phản về giọng là đặc điểm trung tâm của trio; khi giữ nguyên chủ âm thì minuet trưởng đi với trio ghi 'minore' và minuet thứ đi với trio 'maggiore'. Khớp với câu (đổi giọng, hoặc đổi trưởng-thứ trên cùng chủ âm). Trang không nêu giọng cụ thể khác."
