    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mọi dữ liệu luyện tập nằm trong bộ nhớ của trình duyệt (`localStorage`) trên máy bạn, không gửi đi đâu." Chữ mới thêm "riêng bản thu âm ở IndexedDB". Lý do: bản thu âm lưu ở IndexedDB "opus-zero-recordings" (data.js cũ dòng 121; sao-luu.js), tiến độ và cài đặt ở localStorage (opus-zero:v1, opus-zero:sound, opus-zero:midi-auto); không có chỗ gửi dữ liệu đi. Review D7-gom: đã kiểm lại module và trang như ghi_chu của lượt 1; khớp.'
