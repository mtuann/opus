    ghi_chu: "localStorage và IndexedDB gắn với từng trình duyệt trên từng thiết bị (không có tài khoản đồng bộ); trang luyen-tap/du-lieu có phần chuyển sang máy khác (sao-luu.js). Review D7-gom: đã kiểm lại module và trang như ghi_chu của lượt 1; khớp."
    review: dung
ghi_chu: 'Trang chỉ mục Luyện tập (tầng khung). Hầu hết là mô tả công cụ: kiểm ở module (src/scripts/) hay ở site cũ cho trang chưa chuyển (nhat-ky, tiet-tau, thi-tau, thi-tau-hai-tay, phieu-bai-tap, thu-am, xay-hop-am, metronome: lô D7-L2 tìm bằng grep -rn "luyen-tap/<trang>" kiem-dinh/). Sửa trang: mô tả Phiếu bài tập (năm loại đề, không có tiết tấu); ghi chú dữ liệu (thêm IndexedDB). Tìm lại trang nhận ra: grep -rn "luyen-tap/phieu-bai-tap" kiem-dinh/. Trang Luyện tập hiện cũng có công cụ plan (ke-hoach.js): link của nó tới trang chưa chuyển hiện "sắp có".'
