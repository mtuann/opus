nhan_dinh:
  - id: n1
    cau: Mọi tiến độ học (bài đã học, kết quả luyện tập, thẻ ghi nhớ, nhật ký, mốc nghe) và bản thu âm được lưu trong trình duyệt trên máy này.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm src/scripts/sao-luu.js: tiến độ ở localStorage opus-zero:v1 (days, lessons, skills, cards, listen, ghi chú ngày), bản thu ở IndexedDB opus-zero-recordings; moTa/tomTat liệt kê đúng các mục này. Không có mục nào khác trong kho. Review D7-gom: src/scripts/sao-luu.js (opus-zero:v1, IndexedDB opus-zero-recordings).'
    review: dung
  - id: n2
    cau: Dữ liệu ấy không gửi lên đâu cả.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Site tĩnh: grep fetch/sendBeacon/gtag/analytics trong src/scripts, src/components, src/*.mjs, astro.config chỉ thấy fetch mẫu âm (am-thanh.js, tải về, không gửi). Không có chỗ nào gửi dữ liệu người học đi. Review D7-gom: grep fetch/sendBeacon/XMLHttpRequest/WebSocket trong src/scripts, src/components: chỉ fetch mẫu âm trong am-thanh.js (tải về).'
    review: dung
  - id: n3
    cau: Trang cho phép xem, sao lưu, chuyển sang máy khác và xóa dữ liệu ấy.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/sao-luu.js (veSaoLuu): khối "Đang lưu trên máy này", "Tải bản sao lưu", "Khôi phục từ bản sao lưu", "Xóa dữ liệu"; dist/luyen-tap/du-lieu/ có đủ. Review D7-gom: sao-luu.js veSaoLuu: tải, khôi phục, "Xóa dữ liệu".'
    review: dung
  - id: n4
    cau: 'Trên máy A: bấm "Tải file sao lưu".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/sao-luu.js: nút data-act="xuat" nhãn "Tải file sao lưu (.json)"; tải về file opus-<ngày>.json. Review D7-gom: sao-luu.js: nút "Tải file sao lưu (.json)".'
    review: dung
  - id: n5
    cau: Chuyển file sang máy B bằng Google Drive, Zalo, email cho chính mình…
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý.
