ghi_chu: 'Trang khung. Đã sửa một câu (n8). Chỗ cần người giao: không có tests/sao-luu.test.mjs trong worktree (AGENTS.md D7-L1 nói có kiểm thử Node cho phần gộp); tôi chỉ chạy thử gop() bằng script riêng.'
doi_chu:
  - cu: "Gộp nghĩa là không có gì bị mất: ngày luyện tập của cả hai máy đều được giữ, bài đã học được cộng lại, kỹ năng lấy kết quả mới hơn, thẻ ghi nhớ giữ tiến độ tốt hơn, ghi chú khác nhau được giữ cả hai. Gộp cùng một file nhiều lần cũng không làm số liệu bị nhân đôi."
    moi: "Gộp nghĩa là không có gì bị ghi đè hay xóa: ngày luyện tập của cả hai máy đều được giữ (ngày có ở cả hai máy thì mỗi số đếm lấy số lớn hơn), bài đã học được cộng lại, kỹ năng lấy kết quả mới hơn, thẻ ghi nhớ giữ tiến độ tốt hơn, ghi chú khác nhau được giữ cả hai. Gộp cùng một file nhiều lần cũng không làm số liệu bị nhân đôi."
    ly_do: 'n8 (da-sua): cùng một ngày ở cả hai máy thì số đếm lấy số lớn hơn (Math.max), không cộng, nên "không có gì bị mất" quá tuyệt đối.'
