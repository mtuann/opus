  - id: n11
    cau: Nên sao lưu trước khi xóa dữ liệu trình duyệt, đổi máy, cài lại trình duyệt, hoặc dùng chế độ ẩn danh.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên hợp lý, khớp MDN về xóa dữ liệu ở chế độ ẩn danh.
  - id: n12
    cau: Dữ liệu ở chế độ ẩn danh mất khi đóng cửa sổ.
    loai: quy-tac
    nguon:
      - mdn-storage
    ket_qua: dung
    ghi_chu: 'MDN: "in private browsing mode ... stored data is usually deleted when the private browsing mode ends." Đúng; MDN nói "thường" (usually) nên câu của trang hơi tuyệt đối, chấp nhận được.'
    luot_2: dung
    luot_2_nguon: [ "https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria" ]
    luot_2_ghi_chu: 'MDN: dữ liệu lưu thường bị xóa khi thoát chế độ riêng tư ("usually", không bảo đảm tuyệt đối).'
