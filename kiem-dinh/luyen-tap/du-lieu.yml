    cau: 'Trên máy B: mở trang này, bấm "Chọn file sao lưu", xem trước rồi bấm "Gộp vào máy này".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/sao-luu.js: nhãn "Chọn file sao lưu"; khi chọn file hiện danh sách thay đổi (thayDoi) rồi nút "Gộp vào máy này" và "Hủy"; file không có gì mới thì báo không cần gộp. Review D7-gom: sao-luu.js: "Chọn file sao lưu", xem trước thay đổi, nút "Gộp vào máy này".'
    review: dung
  - id: n7
    cau: 'Muốn hai máy giống nhau hoàn toàn: làm ngược lại từ B sang A.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/sao-luu.js: gộp A vào B rồi B vào A cho tiến độ giống nhau (đã chạy thử gop() với dữ liệu mẫu: ngày, bài, kỹ năng, ghi chú khớp). Chỉ lựa chọn âm thanh được chép sang khi máy nhận chưa có; lựa chọn đàn MIDI (midiAuto) không được khôi phục. "Hoàn toàn" nói về tiến độ học. Review D7-gom: sao-luu.js gop: hai chiều thì tiến độ giống nhau (như lượt 1).'
    review: dung
  - id: n8
    cau: 'Gộp nghĩa là không có gì bị ghi đè hay xóa: ngày luyện tập của cả hai máy đều được giữ (ngày có ở cả hai máy thì mỗi số đếm lấy số lớn hơn), bài đã học được cộng lại, kỹ năng lấy kết quả mới hơn, thẻ ghi nhớ giữ tiến độ tốt hơn, ghi chú khác nhau được giữ cả hai.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'src/scripts/sao-luu.js: gop/gopNgay: số đếm Math.max (TRUONG_SO); lessons hợp lại, giữ ngày sớm; skills lấy last mới hơn (cùng ngày: n lớn hơn); cards lấy box cao hơn (cùng hộp: due muộn hơn); ghi chú nối bằng "\n---\n" khi khác nhau. Sửa trang: cũ "không có gì bị mất", mới như câu này, vì cùng một ngày ở hai máy chỉ giữ số đếm lớn hơn, không cộng. Review D7-gom: sao-luu.js gopNgay: Math.max cho số đếm; ghi chú nối "\n---\n" khi khác nhau; chữ mới đúng.'
    review: dung
  - id: n9
    cau: Gộp cùng một file nhiều lần không làm số liệu bị nhân đôi.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/sao-luu.js: số đếm lấy max, tập hợp hợp lại, phiếu nghe mù bỏ bản trùng, ghi chú không nối lại khi đã chứa nhau. Đã chạy thử gop(gop(A,B),B) bằng gop(A,B). Review D7-gom: sao-luu.js: max, hợp tập hợp, ghi chú đã chứa nhau thì không nối lại.'
    review: dung
