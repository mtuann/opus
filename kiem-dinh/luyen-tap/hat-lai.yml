tang: khung
lan:
  - so: 1
    ngay: '2026-11-05'
    nhanh: moi/d7-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D7-L1 lượt 1, phần 2/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 7, 05/11/2026)
      review: Claude Opus 5.5 (review D7-gom, 05/11/2026)
      kiem_mau: null
ghi_chu: 'Trang khung (D7-L1, phần 2/2). Hai chỗ sửa: n13 (quãng tám) và n28 (piano điện). Thuật ngữ trang dùng chưa kiểm ở thuat-ngu.yml: cent, quãng tám. Ghi chú: n28 chỉ dựa trang Roland KF-20/25 đã mở; "440 hay 442" theo đó. n26 Wikipedia (bậc 3) là nguồn duy nhất đọc được, trang UEN Tuning Together bị 403.'
doi_chu:
  - cu: "Nếu thường xuyên bị báo thấp (hoặc cao) hơn khoảng 12 nửa cung, có thể bạn đang hát đúng nốt nhưng ở quãng tám khác: chọn lại Giọng."
    moi: "Công cụ bỏ qua quãng tám: hát đúng nốt ở quãng tám nào cũng được tính là đúng (giọng nam hát thấp hơn một quãng tám vẫn đúng). Chọn Giọng để nốt mẫu nằm trong tầm hát của bạn."
    ly_do: "n13 (da-sua): chamHat gấp độ lệch về trong ±600 cent nên không thể báo lệch 12 nửa cung; câu cũ sai với công cụ."
  - cu: "Đàn piano cơ thì không tự lên dây: việc ấy dành cho thợ (Chăm sóc và bảo dưỡng). Nhưng máy cho biết đàn nhà bạn đang lệch chuẩn bao nhiêu: chơi nốt La4, ngay trên Đô giữa, và đọc số cent. Điều này quan trọng khi bạn chơi cùng một nhạc cụ khác, vì nhạc cụ kia phải chỉnh theo piano. Piano điện luôn đúng cao độ."
    moi: "Đàn piano cơ thì không tự lên dây: việc ấy dành cho thợ (Chăm sóc và bảo dưỡng). Nhưng máy cho biết đàn nhà bạn đang lệch chuẩn bao nhiêu: chơi nốt La4, ngay trên Đô giữa, và đọc số cent. Điều này quan trọng khi bạn chơi cùng một nhạc cụ khác, vì nhạc cụ kia phải chỉnh theo piano. Piano điện không phải lên dây vì cao độ do mạch điện tử giữ; nếu đàn có chỉnh chuẩn La thì đối chiếu lại bằng máy."
    ly_do: 'n28 (da-sua): nhiều piano điện cho chỉnh chuẩn La (Roland KF-20/25: 415,3–466,2 Hz, mặc định 442 Hz); "luôn đúng" quá tuyệt đối. Review D7-gom bỏ "(mặc định thường 440 hay 442 Hz)": chỉ một trang đã mở (Roland, 442 Hz), không đủ cho chữ "thường".'
  - cu: "Hát buộc tai và não liên kết với nhau: bạn phải nghe trong đầu một cao độ trước khi phát ra nó. Đây là nền tảng của chép giai điệu, đọc thị tấu và chơi theo tai trên phím đàn."
    moi: "Hát luyện mối liên hệ giữa tai và giọng: muốn hát đúng một cao độ, bạn cần nghe trong đầu cao độ ấy trước khi phát ra nó. Đây là nền tảng của chép giai điệu, đọc thị tấu và chơi theo tai trên phím đàn."
    ly_do: 'n8 (review D7-gom): "buộc", "phải" mạnh hơn nguồn (Pfordresher & Halpern 2013); viết nhẹ hơn.'
