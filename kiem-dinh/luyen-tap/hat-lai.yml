  - id: n8
    cau: 'Hát luyện mối liên hệ giữa tai và giọng: muốn hát đúng một cao độ, bạn cần nghe trong đầu cao độ ấy trước khi phát ra nó.'
    loai: quy-tac
    nguon:
      - pfordresher
    ket_qua: da-sua
    ghi_chu: 'Pfordresher & Halpern 2013: kết quả "support a link between auditory imagery and vocal imitation" (người hát lệch tông có hình ảnh âm thanh trong đầu kém rõ hơn, theo bản tự đánh giá, mẫu sinh viên). Ủng hộ ý chính; chữ "buộc"/"phải" mạnh hơn nguồn nói. Chấp nhận, chưa đề nghị sửa. Review D7-gom: chữ đổi sau lượt 2 (lượt 2 của chữ cũ: khong-chac); Chữ cũ: "Hát buộc tai và não liên kết với nhau: bạn phải nghe trong đầu một cao độ trước khi phát ra nó." Lượt 2 khong-chac; lượt 1 thấy chữ "buộc", "phải" mạnh hơn nguồn (Pfordresher & Halpern 2013: "support a link between auditory imagery and vocal imitation"). Viết lại nhẹ hơn, theo nguồn. Chờ lượt 2 bổ sung (plans/lam-lai/bao-cao/d7-gom/bo-sung.yml). Người gom (D7-gom): lượt 2 bổ sung khong-chac vì không mở được toàn văn; review đã đọc Pfordresher & Halpern 2013 ("support a link between auditory imagery and vocal imitation") và chữ đã viết nhẹ theo nguồn. Giữ chữ; đưa vào mẫu kiểm của chủ repo.'
    luot_2: khong-chac
    luot_2_ghi_chu: Các bài nghiên cứu (Pfordresher và Halpern, 'Auditory imagery and the poor-pitch singer'; PMC11357896) xuất hiện trong kết quả tìm kiếm nói hình dung âm thanh trước khi hát liên quan tới độ chính xác cao độ, nhưng chủ yếu là tương quan, cơ chế còn tranh luận; không mở được toàn văn (Springer chuyển hướng đăng nhập, PMC chặn bot) nên không xác nhận bậc 2. Câu hợp với cách dạy phổ biến (audiation, solfège).
    review: dung
