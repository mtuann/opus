    cau: Piano điện không phải lên dây vì cao độ do mạch điện tử giữ; nếu đàn có chỉnh chuẩn La thì đối chiếu lại bằng máy.
    loai: so-lieu
    nguon:
      - roland-kf20
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Piano điện luôn đúng cao độ." (tuyệt đối). Roland KF-20/25: "adjust the reference pitch ... 415.3–466.2 Hz", mặc định 442,0 Hz; GO-88 mặc định 440 (kết quả tìm kiếm, chưa mở trang). Mới như câu trên. Review D7-gom: bỏ ngoặc "(mặc định thường 440 hay 442 Hz)": chữ "thường" khái quát từ một trang đã mở (Roland KF-20/25, mặc định 442 Hz); mặc định 440 của GO-88 chỉ thấy ở kết quả tìm kiếm. Phần còn lại là một phần của câu lượt 2 đã ghi dung, không thêm điều mới.'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/A440_(pitch_standard)" ]
    luot_2_ghi_chu: Chuẩn 440 và biến thể 442 có thật (A440); piano điện có tùy chỉnh chuẩn La (Master Tune) là chuyện phổ biến.
