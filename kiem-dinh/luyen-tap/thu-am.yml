ghi_chu: 'Trang khung (D7-L2, phần 2/2). Không sửa chữ. Phần lớn là lời khuyên tập (khuyen-tap). Câu về công cụ kiểm trên src/scripts/thu-am.js, kho-thu.js, micro.js (đối chiếu recorder.js cũ). n14 trỏ trang chưa chuyển (piano/thay-va-thi, kiểm trên site cũ). n16 chưa chắc (quy-tac, null): "loa nhỏ làm mất tiếng trầm và bàn đạp". Thuật ngữ trang dùng không có bản ghi cần kiểm.'
