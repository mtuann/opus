nhan_dinh:
- id: n1
  cau: Mỗi ô vuông của bản đồ là một ngày; màu càng đậm là ngày luyện tập càng nhiều.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/nhat-ky.js: cacNgay (16 tuần, mỗi ngày một ô), oBanDo (lớp l1, l2, l3 theo mức); src/scripts/tien-do.js: mucNgay(d) trả 0–3 theo điểm hoạt động trong ngày.'
- id: n2
  cau: Ngày được tính khi bạn bấm "Hôm nay đã tập bài này" ở một bài học tác phẩm.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/tien-do.js: mucNgay cộng 2 điểm khi piano >= 1 (ngày có mức 2). Nút "Hôm nay đã tập bài này" ở site cũ: ../opus-zero/docs/assets/js/practice.js dòng 111 và 132 (record("piano", 1)). Site mới chưa có nút này: thuộc thẻ đầu bài học tác phẩm (.oz-piece, đợt 6; bai-dang-tap.js nói rõ). Điều cần giữ: lô D6 làm nút "Hôm nay đã tập bài này" và nút "Tôi đang tập bài này", ghi days[ngày].piano và store.repertoire.'
- id: n3
  cau: Ngày được tính khi bạn dùng máy đếm nhịp từ 5 phút.
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "dùng máy đếm nhịp". Chữ mới: "dùng máy đếm nhịp từ 5 phút". Lý do: src/scripts/tien-do.js mucNgay chỉ cộng điểm khi minutes >= 5 (một lần dùng dưới 5 phút không làm ngày có màu); minutes ghi bởi may-dem-nhip.js (phút trọn vẹn). Bản cũ cũng như vậy (progress.js dòng 60). Lưu ý: thu-am.js cũng ghi minutes, nên "từ 5 phút" là điều kiện đủ, không phải duy nhất.'
- id: n4
  cau: Ngày được tính khi bạn đọc ít nhất 3 bài thị tấu hai tay.
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đọc một bài thị tấu hai tay". Chữ mới: "đọc ít nhất 3 bài thị tấu hai tay". Lý do: src/scripts/tien-do.js mucNgay cộng điểm khi readings >= 3 (progress.js cũ dòng 65: readings >= 3); thi-tau-hai-tay.js ghi ghiNgay("readings", 1) mỗi bài. Một bài thì ngày chưa có màu.'
- id: n5
  cau: Ngày được tính khi bạn đọc đúng 10 nốt.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/tien-do.js mucNgay: notes >= 10 cộng 1 điểm; src/scripts/doc-not.js ghiNgay("notes", 1) mỗi nốt đúng.'
- id: n6
  cau: Ngày được tính khi bạn nhận đúng 10 quãng hoặc 10 hợp âm.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/tien-do.js mucNgay: intervals >= 10 cộng 1 điểm; chords nằm trong nhóm (chords + keysigs + rhythms + melodies + builds + scales + styles) >= 10 cũng cộng 1 điểm. Công cụ ghi intervals, chords qua src/scripts/luyen-tai.js.'
- id: n7
  cau: Ngày được tính khi bạn làm một quiz bài học hay ôn 10 thẻ thuật ngữ.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/tien-do.js mucNgay: cards >= 10 hoặc quizzes >= 1 cộng 1 điểm; quiz.js ghiNgay("quizzes", 1), the-nho.js ghiNgay("cards", 1).'
- id: n8
  cau: 'Năm việc của hôm nay trong công cụ, ba việc tự đánh dấu: đọc nốt khi đọc đúng 10 nốt; luyện tai khi nhận đúng 10 quãng hoặc hợp âm; nhạc lý khi làm xong một quiz hoặc ôn 10 thẻ thuật ngữ.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/nhat-ky.js: VIEC (năm việc, chữ như TASKS của journal.js cũ) và tuDanhDau: doc-not khi notes >= 10; luyen-tai khi intervals + chords + scales >= 10 (tính cả gam, chữ ở trang không nhắc gam); nhac-ly khi quizzes >= 1 hoặc cards >= 10.'
- id: n9
  cau: Bấm "Tôi đang tập bài này" ở đầu mỗi bài học tác phẩm thì bài hiện ở trang Nhật ký.
  loai: ve-site
