  ngay: '2026-11-05'
  nhanh: moi/d7-l2
  ma_bam: null
  nguoi:
    luot_1: Claude Sonnet (D7-L2 lượt 1, phần 1/2)
    luot_2: null
    review: null
    kiem_mau: null
ghi_chu: 'Trang khung (D7-L2, phần 1/2). Hai chỗ sửa: n3 (máy đếm nhịp từ 5 phút) và n4 (thị tấu hai tay ít nhất 3 bài), cùng một câu của đoạn mở đầu; description của trang không đổi (bị cắt trước chỗ sửa). Điều cần giữ ở lô D6: nút "Hôm nay đã tập bài này" (ghi days[ngày].piano) và "Tôi đang tập bài này" (ghi store.repertoire) ở đầu bài học tác phẩm; link /opus/piano/tac-pham/ (trang piano/tac-pham/index) hiện "sắp có" tới khi trang ấy lên. Câu thuộc về module (nhat-ky.js, nang-luc.js, bai-dang-tap.js, tien-do.js, ke-hoach.js) khớp chữ trên trang; đã so với journal.js, progress.js cũ: cùng logic. Không có thuật ngữ nhạc cần bản ghi.'
doi_chu:
- cu: 'Mỗi ô vuông là một ngày; màu càng đậm là ngày luyện tập càng nhiều. Ngày được tính khi bạn bấm Hôm nay đã tập bài này ở một bài học tác phẩm, dùng máy đếm nhịp, đọc một bài thị tấu hai tay, hoặc đạt mốc trong các công cụ khác: 10 nốt đọc đúng, 10 quãng hoặc hợp âm nhận đúng, một quiz bài học hay 10 thẻ thuật ngữ.'
  moi: 'Mỗi ô vuông là một ngày; màu càng đậm là ngày luyện tập càng nhiều. Ngày được tính khi bạn bấm Hôm nay đã tập bài này ở một bài học tác phẩm, dùng máy đếm nhịp từ 5 phút, đọc ít nhất 3 bài thị tấu hai tay, hoặc đạt mốc trong các công cụ khác: 10 nốt đọc đúng, 10 quãng hoặc hợp âm nhận đúng, một quiz bài học hay 10 thẻ thuật ngữ.'
  ly_do: 'n3, n4 (da-sua): mucNgay chỉ cộng điểm khi minutes >= 5 và readings >= 3 (cả bản cũ progress.js dòng 60, 65), nên "dùng máy đếm nhịp" và "đọc một bài thị tấu hai tay" chưa đủ để ngày có màu.'
