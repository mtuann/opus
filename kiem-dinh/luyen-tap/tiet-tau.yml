    cau: Nếu sai, bấm Nghe mẫu để nghe tiết tấu đúng, rồi thử lại cùng tiết tấu đó.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/tiet-tau.js: nút "Nghe mẫu" hen(true, true) (tiếng đếm và tiếng nốt); tiết tấu chỉ đổi khi bấm "Tiết tấu mới" hay đổi cấp (moi()); lời báo khi sai: "Bấm “Nghe mẫu” rồi thử lại." Review D7-gom: tiet-tau.js: "Nghe mẫu"; tiết tấu chỉ đổi khi "Tiết tấu mới".'
    review: dung
  - id: n6
    cau: Chỉ gõ vào nốt nhạc, không gõ vào dấu lặng; nốt dài (trắng, tròn) chỉ gõ một lần ở đầu nốt.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/tiet-tau.js: lucGo chỉ lấy lúc bắt đầu của nốt (x[1]), bỏ dấu lặng; mỗi nốt dài một lúc cần gõ; gõ thừa bị đếm ("gõ thừa N lần"). Review D7-gom: tiet-tau.js lucGo: chỉ lúc bắt đầu nốt.'
    review: dung
  - id: n7
    cau: Kết quả "hơi sớm" hay "hơi muộn" cho biết thói quen của bạn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/tiet-tau.js: chamGo: xuHuong "rất đều" (lệch TB < 25 ms) / "hơi sớm, trung bình N ms" / "hơi muộn, trung bình N ms". Review D7-gom: tiet-tau.js dòng 120: "rất đều" / "hơi sớm" / "hơi muộn".'
    review: dung
  - id: n8
    cau: Đa số người mới có xu hướng gõ sớm.
    loai: so-lieu
    nguon:
      - repp2005
    ket_qua: da-bo
    ghi_chu: 'Đã bỏ khỏi trang. Repp (2005), review: hiện tượng "negative mean asynchrony" (gõ hơi sớm hơn tiếng nhịp) là một mục của tài liệu gõ nhịp, nhưng bản tóm tắt đã mở không nói "đa số người mới", và chưa đọc được toàn văn để kiểm; với công cụ này, độ trễ chạm và âm thanh của máy lại thường làm lệch muộn. Cũ (cuối mục): "Kết quả “hơi sớm” hay “hơi muộn” cho biết thói quen của bạn. Đa số người mới có xu hướng gõ sớm." Mới: bỏ câu thứ hai. Review D7-gom: giữ bỏ. Lượt 2 chỉ thấy "negative mean asynchrony" qua kết quả tìm kiếm, chưa mở bài; câu "đa số người mới" không có nguồn đã mở. Với công cụ này độ trễ chạm còn kéo kết quả về phía muộn (trang đã có câu về độ trễ trên điện thoại), nên câu bỏ đi dễ gây hiểu sai.'
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.3758/s13423-012-0371-2" ]
    luot_2_ghi_chu: 'Nghiên cứu "negative mean asynchrony": người gõ theo phách thường gõ sớm khoảng vài chục ms, người không nhạc công nhiều hơn nhạc công (thấy trong kết quả tìm kiếm; bài Psychonomic Bulletin & Review chưa mở trực tiếp). Câu "đa số người mới" là diễn giải hợp lý.'
  - id: n9
    cau: Trên điện thoại, có thể có độ trễ nhỏ giữa lúc chạm và lúc ghi nhận.
    loai: so-lieu
    nguon:
      - android-latency
    ket_qua: dung
    ghi_chu: 'Android Developers (Audio latency): "Touch latency is the time between a user touching the screen and that touch event being received by an app"; cùng trang: độ trễ âm thanh khứ hồi "varies greatly depending on device model and Android build". Trang nói "có thể" và "nhỏ", không nêu số; nguồn đủ cho "có thể có độ trễ" ở điện thoại, không kiểm được chữ "nhỏ".'
    luot_2: dung
    luot_2_nguon: [ "https://android-developers.googleblog.com/2016/04/a-new-method-to-measure-touch-and-audio.html" ]
    luot_2_ghi_chu: "Độ trễ chạm trên điện thoại cỡ vài chục ms (Google: điển hình ~20 ms; nghiên cứu CMU ~69 ms). Thấy qua kết quả tìm kiếm, chưa mở trực tiếp trang."
  - id: n10
    cau: Nếu luôn bị báo "muộn", hãy dùng máy tính với bàn phím.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập, hợp lý.
