    cau: Link "Trường độ" (nhac-ly/03-truong-do) và "Nhịp" (nhac-ly/04-nhip) là lý thuyết của công cụ này.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/nhac-ly/03-truong-do.md (title "3. Trường độ và dấu lặng") và 04-nhip.md ("4. Nhịp và số chỉ nhịp") có ở site mới; đúng chủ đề tiết tấu 4/4, nốt và dấu lặng. Review D7-gom: nhac-ly/03-truong-do.md, 04-nhip.md có.'
    review: dung
