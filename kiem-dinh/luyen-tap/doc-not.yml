    loai: ve-site
    ket_qua: dung
    ghi_chu: 'doc-not.js: goc.addEventListener("keydown") nhận CHU (C–B) và /^[1-7]$/; khung .oz-doc-not-khuong có tabindex=0, role="group" và nhãn "Gõ chữ C đến B hay số 1 đến 7"; phím bị bỏ qua khi tiêu điểm ở ô chọn hay khi giữ Alt, Ctrl, Meta. Chữ trên nút cũng ghi phím tắt (title "Phím tắt: C hoặc 1"). Review D7-gom: doc-not.js: keydown nhận C–B và /^[1-7]$/; khung .oz-doc-not-khuong có tabindex="0".'
