  ket_qua: dung
  ghi_chu: 'src/scripts/abc.js congCu(): ô chọn "Gõ nhịp" (data-k="click", st.goNhip) khi khuông có trình phát; src/scripts/thi-tau-hai-tay.js mount() nạp abc.js cho khuông (khối .abc-notation). Ghi chú: bản xem chỉ hiện sau khi abcjs tải xong.'
