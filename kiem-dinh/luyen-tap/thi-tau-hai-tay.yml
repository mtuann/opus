  ghi_chu: 'src/scripts/thi-tau-hai-tay.js: loiSauCham: cung = lịch sử cùng cấp, slice(-5); đủ 5 và ≥ 4 "good" thì thêm "bạn đã sẵn sàng lên cấp N+1". Chỉ khi cap < 4 (cấp 4 không có cấp 5): câu trang nói chung, không sửa.'
