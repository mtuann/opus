  ghi_chu: 'src/content/docs/luyen-tap/thi-tau.md (phần 1/2 của lô) và src/scripts/thi-tau.js: nút "Bằng đàn MIDI" và "Bằng micro (hát hoặc nhạc cụ)" (mục "Chơi và được chấm"); chép giai điệu một bè.'
