# Hồ sơ kiểm định, cấu trúc ở plans/ben-vung/chuan-kiem-dinh.md mục 5. Điền xong thì khóa: node tools/khoa.mjs khoa luyen-tap/ban-phim
trang: src/content/docs/luyen-tap/ban-phim.md
nguon_cu: ../opus-zero/docs/luyen-tap/ban-phim.md
tang: khung
lan:
  - so: 1
    ngay: '2026-11-05'
    nhanh: moi/d7-l1
    ma_bam: null
    nguoi:
      luot_1: Claude Sonnet 5.5 (D7-L1 lượt 1, phần 1/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 7, 05/11/2026)
      review: Claude Opus 5.5 (review D7-gom, 05/11/2026)
      kiem_mau: null
nguon:
  - id: omt-major
    bac: 2
    ten: Open Music Theory, Major Scales (thứ tự dấu thăng; "the last sharp is a half step below the tonic"; vòng quãng năm)
    link: https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  - id: omt-minor
    bac: 2
    ten: 'Open Music Theory, Minor Scales (ba dạng gam thứ; công thức W-H-W-W-H-W-W: "third note is always a half step lower than the third note of the major scale")'
    link: https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  - id: omt-triads
    bac: 2
    ten: Open Music Theory, Triads ("a minor triad's third is minor and its fifth is perfect")
    link: https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  - id: caniuse-midi
    bac: 2
    ten: 'Can I use, Web MIDI API (kiểm 11/2026: Chrome từ 43, Edge từ 79, Opera từ 30, Firefox từ 108; Safari và iOS không hỗ trợ)'
    link: https://caniuse.com/midi
nhan_dinh:
  - id: n1
    cau: 'Chọn nốt gốc và loại gam hoặc hợp âm: các phím thuộc về nó được tô màu, tên nốt hiện bên trên.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm ở src/scripts/tra-phim.js (piano-explorer): luaChon dựng nốt, capNhat bật lớp "to" cho phím của lựa chọn, dongTen hiện tên các nốt ở dòng .oz-tra-phim-ten nằm trên bàn phím (veTraPhim); 14 nốt gốc, 11 gam, 9 hợp âm. Review D7-gom: đã kiểm src/scripts/tra-phim.js (veTraPhim: dòng .oz-tra-phim-ten đứng trước bàn phím; capNhat bật lớp "to").'
    review: dung
  - id: n2
    cau: Bấm Nghe để nghe gam hay hợp âm đã chọn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'tra-phim.js: nút data-act="nghe", gam phát lần lượt, hợp âm rải rồi cùng lúc. Review D7-gom: tra-phim.js, nút data-act="nghe": gam phát lần lượt, hợp âm rải rồi cùng lúc.'
    review: dung
  - id: n3
    cau: Bấm trực tiếp vào phím bất kỳ để nghe và xem tên.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'tra-phim.js gọi ganBanPhim (src/scripts/ban-phim.js): bấm phím phát tiếng và dòng .oz-phim-ten đọc tên nốt; dòng mặc định "Bấm vào phím để nghe và xem tên nốt." Review D7-gom: src/scripts/ban-phim.js ganBanPhim: bấm phím phát tiếng, thongBao hiện tên phím.'
    review: dung
  - id: n4
    cau: 'Gam trưởng đổi nốt gốc lần lượt Đô, Sol, Rê, La: mỗi lần thêm đúng một phím đen (Sol có Fa♯; Rê có Fa♯, Đô♯; La có Fa♯, Đô♯, Sol♯).'
    loai: quy-tac
    nguon:
      - omt-major
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: thứ tự dấu thăng F, C, G, D, A, E, B; dấu thăng cuối nằm nửa cung dưới chủ âm, nên G có 1 thăng (Fa♯), D có 2, A có 3 (cuối là Sol♯). Công cụ có đủ tên gốc Đô, Sol, Rê, La và "Gam trưởng" (tra-phim.js GOC, GAM của nhac-ly.js).'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Key_signature" ]
    luot_2_ghi_chu: Đô 0 dấu; Sol 1 (Fa♯); Rê 2 (Fa♯, Đô♯); La 3 (thêm Sol♯) theo vòng quãng năm (Key signature). Open Music Theory trả 403 và Wayback bị chặn nên dùng Wikipedia (bậc thấp hơn) đã mở.
  - id: n5
    cau: Chuỗi Đô, Sol, Rê, La (mỗi bước lên một quãng năm đúng) chính là vòng quãng năm.
    loai: dinh-nghia
    nguon:
      - omt-major
    ket_qua: dung
    ghi_chu: 'OMT Major Scales: vòng quãng năm xếp các giọng trưởng theo số dấu hóa tăng dần; mỗi giọng cách giọng trước một quãng năm đúng (C-G, G-D, D-A).'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Key_signature" ]
    luot_2_ghi_chu: "Mỗi bước quãng năm đúng lên, thêm một dấu thăng: chiều kim đồng hồ của vòng quãng năm. Open Music Theory trả 403 và Wayback bị chặn nên dùng Wikipedia (bậc thấp hơn) đã mở."
  - id: n6
    cau: Đoạn gợi ý trỏ tới mục "Vòng quãng năm" của trang Hóa biểu và vòng quãng năm.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Link /opus/luyen-tap/hoa-bieu/#vong-quang-nam: trang hoa-bieu có trong bản xem, tiêu đề "Vòng quãng năm" có id vong-quang-nam (dist/luyen-tap/hoa-bieu/index.html). Review D7-gom: dist/luyen-tap/hoa-bieu/index.html có id="vong-quang-nam".'
    review: dung
  - id: n7
    cau: Gam trưởng và gam thứ tự nhiên trên cùng nốt gốc chỉ khác ở bậc 3, 6 và 7.
    loai: quy-tac
    nguon:
      - omt-major
      - omt-minor
    ket_qua: dung
    ghi_chu: 'Công thức OMT: trưởng W-W-H-W-W-W-H, thứ tự nhiên W-H-W-W-H-W-W; bậc 3, 6, 7 của thứ thấp hơn trưởng nửa cung, các bậc còn lại giống nhau (bậc 2, 4, 5 trùng).'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Minor_scale" ]
    luot_2_ghi_chu: Thứ tự nhiên hạ bậc 3, 6, 7 so với trưởng.
  - id: n8
    cau: 'Có ba dạng gam thứ: tự nhiên, hòa âm, giai điệu.'
    loai: dinh-nghia
    nguon:
      - omt-minor
    ket_qua: dung
    ghi_chu: 'OMT Minor Scales: "There are three variations on the minor scale: natural minor, harmonic minor, and melodic minor."'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Minor_scale" ]
    luot_2_ghi_chu: "Ba dạng cổ điển: tự nhiên, hòa âm, giai điệu."
  - id: n9
    cau: Công cụ có đủ ba dạng gam thứ (tự nhiên, hòa âm, giai điệu) và nốt gốc La để so sánh.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'nhac-ly.js GAM: natural, harmonic, melodic (đi lên); tra-phim.js GOC có La. Review D7-gom: src/scripts/nhac-ly.js GAM có natural, harmonic, melodic; tra-phim.js GOC có "A".'
    review: dung
  - id: n10
    cau: Hợp âm trưởng và hợp âm thứ trên cùng nốt gốc chỉ khác nốt giữa, thứ dịch xuống nửa cung.
    loai: quy-tac
    nguon:
      - omt-triads
    ket_qua: dung
    ghi_chu: 'OMT Triads: quãng ba trưởng thì trưởng, ba thứ thì thứ, cả hai đều có quãng năm đúng; HOP_AM của nhac-ly.js: maj [0,4,7], min [0,3,7].'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Key_signature" ]
    luot_2_ghi_chu: Hợp âm thứ có quãng ba thứ (3 nửa cung) thay vì ba trưởng; chỉ nốt giữa hạ nửa cung, quãng năm giữ nguyên (kiến thức chuẩn; nguồn mở xác nhận quãng ba thứ = 3 nửa cung).
  - id: n11
    cau: 'Phần "Dùng đàn MIDI": cắm đàn piano điện vào máy tính để dùng phím thật.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'midi.js + tra-phim.js: ganBanPhim (midi mặc định bật) cho phím đàn MIDI sáng lên trên bàn phím; ô midi-status ở cuối trang có nút "Kết nối đàn MIDI". Review D7-gom: ban-phim.js ganBanPhim (midi mặc định bật, nghe() của midi.js); trang có ::cong-cu{ten="midi-status"}.'
    review: dung
  - id: n12
    cau: Link tới trang Kết nối đàn MIDI.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "luyen-tap/ket-noi-midi có trong bản xem (phần 2 của lô D7-L1) và trong src/data/trang.yml. Review D7-gom: src/content/docs/luyen-tap/ket-noi-midi.md có, trang có trong bản xem."
    review: dung
  - id: n13
    cau: 'Ô midi-status báo khi trình duyệt không có MIDI trên web: Safari và mọi trình duyệt trên iPhone, iPad chưa có; trên máy tính, Chrome, Edge, Firefox có.'
    loai: so-lieu
    nguon:
      - caniuse-midi
    ket_qua: da-sua
    ghi_chu: 'Ô trạng thái MIDI (midi.js, midi-status): khi trình duyệt không có Web MIDI thì khóa nút và báo "Trình duyệt này không có MIDI trên web. Dùng Chrome, Edge hay Opera trên máy tính." Chrome, Edge, Opera hỗ trợ (Can I use, kiểm 11/2026); Firefox từ 108 cũng hỗ trợ nên danh sách chưa đủ nhưng không sai; Safari và iOS không có. Câu dễ cũ: rà lại khi trình duyệt đổi. Review D7-gom: chữ đổi sau lượt 2 (lượt 2 của chữ cũ: dung); Lượt 2 (caniuse, MDN): Firefox từ bản 108 cũng có MIDI trên web, nên danh sách cũ thiếu. Chữ mới nêu trình duyệt chưa có (Safari, iPhone, iPad) và chỉ nêu ví dụ trình duyệt có ("như"), không liệt kê đủ. Chữ cũ của ô: "Dùng Chrome, Edge hay Opera trên máy tính."; chữ mới của ô: "Trình duyệt này không có MIDI trên web. Safari và mọi trình duyệt trên iPhone, iPad đều chưa có; trên máy tính, hãy thử Chrome, Edge hay Firefox." (src/scripts/midi.js, trangThai). Chờ lượt 2 bổ sung (plans/lam-lai/bao-cao/d7-gom/bo-sung.yml).'
  - id: n14
    cau: 'Ô trạng thái MIDI ở cuối trang: nút "Kết nối đàn MIDI", dòng trạng thái, ô chọn phát tiếng khi bấm phím.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trong midi.js (veTrangThaiMidi, mount) và dist/luyen-tap/ban-phim/index.html: nút data-act="noi", dòng "Chưa kết nối đàn MIDI.", ô "Phát âm thanh khi bấm phím". Review D7-gom: src/scripts/midi.js veTrangThaiMidi: nút "Kết nối đàn MIDI", dòng .oz-midi-chu, ô "Phát âm thanh khi bấm phím".'
    review: dung
ghi_chu: Trang Luyện tập (tầng khung). Không có thuật ngữ mới cần bản ghi (gam, hợp âm, nốt gốc đã dùng ở bài nhạc lý khóa).
