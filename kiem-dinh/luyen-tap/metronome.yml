nhan_dinh:
  - id: n1
    cau: BPM (beats per minute) là số phách mỗi phút.
    loai: dinh-nghia
    nguon:
      - wiki-tempo
      - dolmetsch-tempo
    ket_qua: dung
    ghi_chu: 'Wikipedia, Tempo: "tempo ... is typically measured in beats per minute (bpm or BPM). For example, a tempo of 60 beats per minute signifies one beat per second"; Dolmetsch: "Beats per minute (bpm)".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo" ]
    luot_2_ghi_chu: 'Đã mở trang Wikipedia "Tempo": tempo tính bằng số phách mỗi phút (BPM). Wikipedia chỉ dùng để xác nhận định nghĩa thông dụng.'
  - id: n2
    cau: Máy đếm nhịp giữ một nhịp đều tuyệt đối.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/may-dem-nhip.js: henPhach hẹn trước các tiếng gõ theo đồng hồ của AudioContext (tiengGo, am-thanh.js), bộ hẹn giờ 25 ms chỉ đánh thức, không quyết lúc phát. "Tuyệt đối" theo nghĩa không lệch nhịp vì trễ của bộ hẹn giờ; là mô tả của trang cũ, giữ nguyên. Review D7-gom: src/scripts/may-dem-nhip.js: hẹn tiếng gõ theo đồng hồ AudioContext.'
    review: dung
  - id: n3
    cau: 'Bắt đầu chậm hơn mức bạn nghĩ mình làm được: chơi đúng ở 60 BPM có ích hơn chơi sai ở 100 BPM.'
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập, hợp cách dạy phổ biến.
  - id: n4
    cau: Khi đã làm đúng 3 lần liên tiếp thì tăng 2–4 BPM; sai thì lùi lại một nấc.
    loai: khuyen-tap
    ket_qua: khong-can-nguon
    ghi_chu: 'Khớp trang piano/cach-tap, mục 8 "Thang máy đếm nhịp": "Đúng ba lần liên tiếp thì tăng 2–4 nhịp mỗi phút; sai thì lùi một nấc".'
    luot_2: dung
    luot_2_ghi_chu: Lời khuyên tập, hợp cách dạy phổ biến.
  - id: n5
    cau: Link "ví dụ một thang máy đếm nhịp" (/opus/piano/cach-tap/) dẫn tới trang có ví dụ ấy.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/piano/cach-tap.md, mục "### Ví dụ một thang máy đếm nhịp" (bảng bốn ngày, ♩ = 60 đến 76). Review D7-gom: src/content/docs/piano/cach-tap.md có "### Ví dụ một thang máy đếm nhịp".'
    review: dung
  - id: n6
    cau: Nút "Gõ để đo tốc độ" bấm nhiều lần theo một bản nhạc đang nghe thì cho biết tốc độ của bản nhạc.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/may-dem-nhip.js: nút data-act="tap" gọi bpmTuLanGo, trung bình khoảng cách các lần gõ trong 2,5 giây gần nhất rồi đặt BPM (cần ít nhất hai lần gõ). Nút có chữ "Gõ để đo tốc độ" trong veMayDemNhip và trong dist/luyen-tap/metronome/index.html. Review D7-gom: may-dem-nhip.js: nút data-act="tap" "Gõ để đo tốc độ", lọc lần gõ trong 2500 ms.'
    review: dung
  - id: n7
    cau: Thời gian dùng máy đếm nhịp (tính theo phút trọn vẹn) được ghi vào nhật ký luyện tập.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/scripts/may-dem-nhip.js, hàm dung(): phut = Math.floor((Date.now() - batDau) / 60000); nếu phut > 0 thì ghiNgay("minutes", phut) (src/scripts/tien-do.js, days[ngày].minutes); trang Nhật ký hiện "phút máy đếm nhịp" và mucNgay tính minutes từ 5 phút. Review D7-gom: may-dem-nhip.js: Math.floor(…/60000), ghiNgay("minutes", phut) khi phut > 0.'
    review: dung
  - id: n8
    cau: Link "công cụ tiết tấu" (/opus/luyen-tap/tiet-tau/) dẫn tới công cụ luyện đọc tiết tấu có chấm điểm.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'src/content/docs/luyen-tap/tiet-tau.md: "gõ theo từng nốt ... Site so sánh thời điểm bạn gõ với nhịp chuẩn" (src/scripts/tiet-tau.js chấm và gọi kyNang("rhythm")). Review D7-gom: trang đích luyen-tap/tiet-tau có; tiet-tau.js chấm và kyNang("rhythm").'
    review: dung
  - id: n9
    cau: Các nhà soạn nhạc ghi tốc độ bằng tiếng Ý ở đầu bản nhạc.
    loai: quy-tac
    nguon:
      - wiki-tempo
      - dolmetsch-tempo
    ket_qua: dung
    ghi_chu: 'Wikipedia, Tempo: "it is customary to describe the tempo of a piece by one or more words, most commonly in Italian"; "the base tempo indication (such as Allegro) typically appears in large type above the staff". Dolmetsch: "the most common tempo related marks are listed below ... most commonly in Italian".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo" ]
    luot_2_ghi_chu: 'Đã mở Wikipedia "Tempo": tiếng Ý thành chuẩn vì là ngôn ngữ của phần lớn nhà soạn nhạc; cũng có khi dùng ngôn ngữ khác (câu viết "ghi bằng tiếng Ý" là cách nói phổ biến, hơi tuyệt đối).'
  - id: n10
    cau: "Mỗi thuật ngữ tốc độ chỉ một vùng tốc độ, không gắn với một số BPM cố định: các nguồn ghi những khoảng BPM rất khác nhau, và nghệ sĩ có quyền diễn giải."
    loai: quy-tac
    nguon:
      - dolmetsch-tempo
      - wiki-tempo
    ket_qua: da-sua
    ghi_chu: 'Dolmetsch, Tempo: "there is a wide variation associated with each mark ... these markings should be used carefully. Very often, the style of the piece of music or the skill of the musician, dictates the range of tempi within which a performance can be convincing". Wikipedia: nghĩa chính xác của nhiều thuật ngữ đã đổi theo thời gian (Largo, Adagio). Review D7-gom: chữ đổi sau lượt 2 (lượt 2 của chữ cũ: dung); Chữ cũ: "Khoảng BPM dưới đây chỉ là gần đúng; nghệ sĩ có quyền diễn giải." Đổi vì bảng không còn cột BPM (xem n12). Nguồn như cũ: Dolmetsch "there is a wide variation associated with each mark". Chờ lượt 2 bổ sung (plans/lam-lai/bao-cao/d7-gom/bo-sung.yml).'
    luot_2: dung
    luot_2_nguon: [ "https://www.dolmetsch.com/musictheory5.htm" ]
    luot_2_ghi_chu: Dolmetsch ghi khoảng gần đúng khác nhau, vd Andante 56-88 (có nguồn nói 76-108), Presto 100-152 (có nguồn 168-208); nói rõ các mức thay đổi nhiều, thiên về 'tính chất' hơn 'tốc độ', phụ thuộc phong cách và người chơi.
  - id: n11
    cau: 'Largo: rất chậm, rộng rãi.'
    loai: dinh-nghia
    nguon:
      - dolmetsch-tempo
      - wiki-tempo
    ket_qua: dung
    ghi_chu: 'Bản ghi thuat-ngu/largo đã khóa (D3-L5). Dolmetsch: "broad, very slow and dignified"; Wikipedia: "slow and broad".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo" ]
    luot_2_ghi_chu: 'Wikipedia: Largo "slow and broad".'
  - id: n12
    cau: 'Largo: khoảng 40–66 BPM.'
    loai: so-lieu
    nguon:
      - dolmetsch-tempo
      - wiki-tempo
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "40–60". Chữ mới: "40–66". Lý do: Dolmetsch ghi Largo 42-66 bpm, Wikipedia (bản đọc ngày 5/11/2026) ghi 40–66; không nguồn nào đã mở ghi 60 làm cận trên. Cùng cách sửa với D3-L5 (du-lieu/thuat-ngu/largo n2: "40–60" thành "40–66"). Máy đếm nhịp (TOC_DO) tách Larghetto từ 60 nhưng bảng ở trang chỉ nêu sáu thuật ngữ, nên không mâu thuẫn. Review D7-gom: bỏ cột "Khoảng BPM" khỏi bảng (cả sáu hàng, kể cả Presto cho nhất quán). Lý do: lượt 2 thấy các nguồn lệch nhau (Wikipedia, classical-music.com, Orchestra Central); Dolmetsch (bậc 2): "there is a wide variation associated with each mark"; cùng cách review D3-gom đã bỏ con số BPM khỏi Từ điển (kiem-dinh/nhac-ly/tu-dien.yml, doi_chu các hàng Largo… Presto). Không có lý do mạnh để giữ: máy đếm nhịp ở trên vẫn hiện tên thuật ngữ gần nhất cạnh số BPM (TOC_DO, may-dem-nhip.js).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo", "https://www.classical-music.com/features/musical-terms/what-is-tempo-in-music", "https://orchestracentral.com/music-tempos-and-markings/" ]
    luot_2_ghi_chu: 'Các nguồn đã mở lệch nhau: Wikipedia "Tempo" 40–66; classical-music.com 40–60; Orchestra Central 45–50. Khoảng 40–66 khớp Wikipedia nhưng không phải chuẩn duy nhất.'
  - id: n13
    cau: 'Adagio: chậm, thong thả.'
    loai: dinh-nghia
    nguon:
      - dolmetsch-tempo
      - wiki-tempo
    ket_qua: dung
    ghi_chu: 'Bản ghi thuat-ngu/adagio đã khóa. Dolmetsch: "slow, but not as slow as largo"; Wikipedia: "slow with great expression".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo" ]
    luot_2_ghi_chu: 'Wikipedia: Adagio "slow with great expression"; classical-music.com: slow and unhurried.'
  - id: n14
    cau: 'Adagio: khoảng 66–76 BPM.'
    loai: so-lieu
    nguon:
      - dolmetsch-tempo
    ket_qua: da-bo
    ghi_chu: 'Dolmetsch: Adagio "58-97 bpm (some sources suggest 66-76 bpm while others suggest 48-66 bpm)". Khoảng của trang là một trong các cách ghi của nguồn, gần đúng như trang nói; Wikipedia ghi 44–66. Review D7-gom: bỏ cột "Khoảng BPM" khỏi bảng (cả sáu hàng, kể cả Presto cho nhất quán). Lý do: lượt 2 thấy các nguồn lệch nhau (Wikipedia, classical-music.com, Orchestra Central); Dolmetsch (bậc 2): "there is a wide variation associated with each mark"; cùng cách review D3-gom đã bỏ con số BPM khỏi Từ điển (kiem-dinh/nhac-ly/tu-dien.yml, doi_chu các hàng Largo… Presto). Không có lý do mạnh để giữ: máy đếm nhịp ở trên vẫn hiện tên thuật ngữ gần nhất cạnh số BPM (TOC_DO, may-dem-nhip.js).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo", "https://www.classical-music.com/features/musical-terms/what-is-tempo-in-music", "https://orchestracentral.com/music-tempos-and-markings/" ]
    luot_2_ghi_chu: "Nguồn lệch: classical-music.com 66–76; Wikipedia 44–66; Orchestra Central 55–65. Khoảng 66–76 khớp một nguồn."
  - id: n15
    cau: 'Andante: vừa phải, như nhịp bước đi.'
    loai: dinh-nghia
    nguon:
      - dolmetsch-tempo
      - wiki-tempo
    ket_qua: dung
    ghi_chu: 'Bản ghi thuat-ngu/andante đã khóa ("Vừa phải, như bước đi"; trang thêm chữ "nhịp", là lựa chọn dịch). Dolmetsch: "moving along - walking pace"; Wikipedia: "at a walking pace, moderately slow".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo", "https://www.classical-music.com/features/musical-terms/what-is-tempo-in-music" ]
    luot_2_ghi_chu: "Cả hai nguồn: Andante là nhịp bước đi, vừa chậm."
  - id: n16
    cau: 'Andante: khoảng 76–108 BPM.'
    loai: so-lieu
    nguon:
      - dolmetsch-tempo
      - wiki-tempo
    ket_qua: da-bo
    ghi_chu: 'Dolmetsch: Andante "56-88 bpm (some sources suggest 76-108 bpm)"; Wikipedia: 56–108. Khoảng của trang khớp "some sources suggest" của Dolmetsch. Review D7-gom: bỏ cột "Khoảng BPM" khỏi bảng (cả sáu hàng, kể cả Presto cho nhất quán). Lý do: lượt 2 thấy các nguồn lệch nhau (Wikipedia, classical-music.com, Orchestra Central); Dolmetsch (bậc 2): "there is a wide variation associated with each mark"; cùng cách review D3-gom đã bỏ con số BPM khỏi Từ điển (kiem-dinh/nhac-ly/tu-dien.yml, doi_chu các hàng Largo… Presto). Không có lý do mạnh để giữ: máy đếm nhịp ở trên vẫn hiện tên thuật ngữ gần nhất cạnh số BPM (TOC_DO, may-dem-nhip.js).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo", "https://www.classical-music.com/features/musical-terms/what-is-tempo-in-music", "https://orchestracentral.com/music-tempos-and-markings/" ]
    luot_2_ghi_chu: "Nguồn lệch: classical-music.com 76–108; Wikipedia 56–108; Orchestra Central 73–77. Khoảng 76–108 khớp một nguồn, cận trên 108 phổ biến."
  - id: n17
    cau: 'Moderato: vừa.'
    loai: dinh-nghia
    nguon:
      - dolmetsch-tempo
      - wiki-tempo
    ket_qua: dung
    ghi_chu: 'Bản ghi thuat-ngu/moderato đã khóa. Dolmetsch: "moderate speed"; Wikipedia: "at a moderate speed".'
    luot_2: dung
    luot_2_nguon: [ "https://en.wikipedia.org/wiki/Tempo", "https://www.classical-music.com/features/musical-terms/what-is-tempo-in-music" ]
    luot_2_ghi_chu: "Moderato: tốc độ vừa, cả hai nguồn."
  - id: n18
    cau: 'Moderato: khoảng 108–120 BPM.'
    loai: so-lieu
    nguon:
      - wiki-tempo
