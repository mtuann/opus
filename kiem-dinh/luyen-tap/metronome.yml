  - cu: Các nhà soạn nhạc ghi tốc độ bằng tiếng Ý ở đầu bản nhạc. Khoảng BPM dưới đây chỉ là gần đúng; nghệ sĩ có quyền diễn giải.
    moi: "Các nhà soạn nhạc ghi tốc độ bằng tiếng Ý ở đầu bản nhạc. Mỗi thuật ngữ chỉ một vùng tốc độ, không gắn với một số BPM cố định: các nguồn ghi những khoảng BPM rất khác nhau, và nghệ sĩ có quyền diễn giải."
    ly_do: "n10 (review D7-gom): bảng không còn cột BPM, câu nói rõ vì sao. Nguồn: Dolmetsch, Tempo."
