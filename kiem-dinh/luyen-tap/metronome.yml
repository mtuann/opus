    nguoi:
      luot_1: Claude Sonnet (D7-L2 lượt 1, phần 1/2)
      luot_2: Claude Sonnet 5.5 (lượt 2 nhánh gom đợt 7, 05/11/2026)
      review: Claude Opus 5.5 (review D7-gom, 05/11/2026)
      kiem_mau: "Claude Opus 5.5, kiểm thay chủ repo theo lời giao 05/11/2026 (chủ repo không tự kiểm): 19 nhận định mẫu của đợt 7 (11 ở D7-L1, D7-L2; 8 ở D7-L3), 19 đúng (2 có điều kiện: hat-lai n8 bằng chứng tương quan; cap-nhat n80 vị trí cắt file chưa nghe kiểm), 0 sai (bao-cao/d7-gom/kiem-mau-ket-qua.yml, kiem-mau-l3-ket-qua.yml)"
ghi_chu: 'Trang khung (D7-L2, phần 1/2). Một chỗ sửa: n12 (Largo 40–60 thành 40–66). Thuật ngữ Largo, Adagio, Andante, Moderato, Allegro, Presto và tempo, beat đã có bản ghi khóa ở thuat-ngu.yml; "BPM" chưa có bản ghi riêng. Lưu ý cho review: n18, n20 (Moderato 108–120, Allegro 120–156) chỉ khớp chính xác Wikipedia (bậc 3), nguồn bậc 2 (Dolmetsch) ghi khoảng khác; đã ghi dung vì trang nói "gần đúng", review quyết có giữ cột BPM không. Lệch nhỏ giữa trang và máy: thanh kéo của máy (TOC_DO) gọi Allegro từ 120 tới dưới 168, trang ghi 120–156 (156–168 là Vivace theo Wikipedia); trang đã nói "gần đúng". Dolmetsch đọc qua curl ngày 5/11/2026.'
