      kiem_mau: "Claude Opus 5.5, kiểm thay chủ repo theo lời giao 05/11/2026 (chủ repo không tự kiểm): 19 nhận định mẫu của đợt 7 (11 ở D7-L1, D7-L2; 8 ở D7-L3), 19 đúng (2 có điều kiện: hat-lai n8 bằng chứng tương quan; cap-nhat n80 vị trí cắt file chưa nghe kiểm), 0 sai (bao-cao/d7-gom/kiem-mau-ket-qua.yml, kiem-mau-l3-ket-qua.yml)"
ghi_chu: 'Trang khung (D7-L2, phần 1/2). Một chỗ sửa: n7 ("cách học có hiệu quả ghi nhớ cao nhất" thành "một trong những cách học ..."; description của trang không đổi). Lưu ý cho người giao: n3, n16 ("in ra giấy (A4)", "Trang in khổ A4"): site không đặt @page, nên khổ giấy do người in chọn; giữ như site cũ. Nguồn n6, n7: Dunlosky 2013 (American Educator, bản tóm tắt báo; bài gốc ở Psychological Science in the Public Interest chỉ đọc tóm tắt PubMed vì trang tạp chí trả 403). Dòng "Viết ra giấy" so với "practice testing" của nguồn: nguồn nói về kiểm tra tự nhớ nói chung, không riêng viết tay.'
doi_chu:
  - cu: 'Viết ra giấy buộc bạn tự nhớ lại thay vì chỉ nhận ra đáp án trong các lựa chọn. Đây là cách học có hiệu quả ghi nhớ cao nhất. Gợi ý: mỗi tuần in 2–3 phiếu, làm không nhìn bài, rồi chấm bằng đáp án.'
    moi: 'Viết ra giấy buộc bạn tự nhớ lại thay vì chỉ nhận ra đáp án trong các lựa chọn. Đây là một trong những cách học có hiệu quả ghi nhớ cao nhất. Gợi ý: mỗi tuần in 2–3 phiếu, làm không nhìn bài, rồi chấm bằng đáp án.'
    ly_do: 'n7 (da-sua): Dunlosky 2013 xếp practice testing và distributed practice là hai cách hiệu quả nhất trong mười cách được xét; "cách học có hiệu quả ghi nhớ cao nhất" thành "một trong những cách".'
