    ghi_chu: 'src/scripts/phieu.js: LOAI có đúng năm khóa (notesTreble, notesBass, intervals, chords, keysigs) với các tên ấy; dist/luyen-tap/phieu-bai-tap/index.html có năm option. Review D7-gom: src/scripts/phieu.js LOAI: năm loại.'
