  - id: n6
    cau: Tự nhớ lại thay vì chỉ nhận ra đáp án trong các lựa chọn là cách học tốt hơn cho ghi nhớ.
    loai: quy-tac
    nguon:
      - dunlosky-ae
      - dunlosky-2013
    ket_qua: dung
    ghi_chu: 'Dunlosky 2013 (American Educator): "student learning can benefit from almost any kind of practice test ... Research suggests, however, that students will benefit most from tests that require recall from memory, and not from tests that merely ask them to recognize ..." (đọc ngày 5/11/2026).'
    luot_2: dung
    luot_2_nguon: [ "https://www.psychologicalscience.org/news/releases/which-study-strategies-make-the-grade.html" ]
    luot_2_ghi_chu: 'Đã mở thông cáo APS về Dunlosky et al. 2013: practice testing (tự kiểm tra) xếp hiệu quả cao, trên các cách chỉ đọc lại. Câu viết "hơn việc nhận ra đáp án" là diễn giải hợp lý; thông cáo không nói riêng về nhận ra so với nhớ lại.'
  - id: n7
    cau: Tự kiểm tra bằng cách nhớ lại là một trong những cách học có hiệu quả ghi nhớ cao nhất.
    loai: so-lieu
    nguon:
      - dunlosky-ae
      - dunlosky-2013
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là cách học có hiệu quả ghi nhớ cao nhất." Chữ mới: "Đây là một trong những cách học có hiệu quả ghi nhớ cao nhất." Lý do: Dunlosky 2013: "We rated two strategies—practice testing and distributed practice—as the most effective of those we reviewed" (hai cách đứng đầu trong mười cách, không phải một cách duy nhất). Review D7-gom: đồng ý chữ mới: hai lượt cùng thấy Dunlosky và cộng sự (2013) xếp practice testing và distributed practice là hai cách hiệu quả nhất trong mười cách, nên "một trong những" đúng; không cần thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.psychologicalscience.org/news/releases/which-study-strategies-make-the-grade.html" ]
    luot_2_ghi_chu: 'Đã mở thông cáo APS: practice testing và distributed practice là hai kỹ thuật xếp "high utility" trong 10 kỹ thuật. "Một trong những" đúng.'
