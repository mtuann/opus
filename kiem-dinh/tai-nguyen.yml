ghi_chu: 'D8-L1 phần 1/2, lượt 1 (05/11/2026). 21 link ra ngoài; đã gọi từng link (curl) và đọc trang nguồn cho thông tin mau cũ (ABRSM, Coursera, Tenuto, ToneGym, Yale, Idagio, Apple Music Classical). Đã sửa (da-sua): n3 (ABRSM: hiệu lực 2025–2026), n5 (Practising the Piano), n13 (Coursera: bỏ "dự thính miễn phí"), n15 (ToneGym), n16 (Complete Musician không có, đổi thành Complete Ear Trainer), n17 (link Yale hỏng, thay VideoLectures.NET), n26 (IMSLP bỏ "lớn nhất thế giới"). Chưa chắc (null): n7, n18, n20, n21, n22, n25, n29, n31 (nhiều nguồn chỉ mở được bằng trình duyệt, YouTube và Gramophone chặn robot). Người giao cần: đồng bộ doi_chu; quyết n21 (Building a Library: link podcast tên "Record Review Podcast"), n25 (Viện Chopin: câu "toàn bộ các vòng thi"), n31 (kênh YouTube) và n16 (Complete Ear Trainer: chỉ có kết quả tìm kiếm).'
