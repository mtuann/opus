nhan_dinh:
  - id: n1
    cau: Liên kết báo lỗi dẫn tới trang GitHub của dự án (repo cũ opus-zero).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'https://github.com/mtuann/opus-zero/issues: 200 (05/11/2026). AGENTS.md: giữ link repo cũ khi repo mới còn riêng tư; đổi thành https://github.com/mtuann/opus/issues khi repo mới công khai.'
  - id: n2
    cau: Link ra ngoài trên toàn site được kiểm tra tự động mỗi tuần; tin tức và giải thưởng gần đây nằm ở Âm nhạc hôm nay (lich-su/duong-dai); thông tin trong nước ở Nhạc cổ điển ở Việt Nam (lich-su/viet-nam).
    loai: ve-site
    ket_qua: dung
    ghi_chu: '.github/workflows/kiem-link.yml (D8-L1): lychee mỗi thứ Hai 02:00 UTC, quét src/content/docs, src/data, src/scripts/nghe-mu.js; mở/cập nhật issue nhãn link-hong. Trang src/content/docs/lich-su/duong-dai.md và viet-nam.md có. Ngày kiểm và ngày rà lại hiện tự động (PageTitle.astro; doi_chu có sẵn).'
  - id: n3
    cau: 'ABRSM: chương trình piano 2027–2028 dùng được từ 1/1/2027; các bài của chương trình 2025–2026 vẫn được chơi đến hết 31/12/2027; danh sách tác phẩm theo cấp là nguồn gợi ý tốt kể cả khi không thi.'
    loai: cap-do
    nguon:
      - abrsm-prac-2728
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chương trình 2025–2026 còn hiệu lực đến 31/12/2027". PDF ABRSM 2027 & 2028: "valid for exams from 1 January 2027 until 31 December 2028"; "Candidates may play pieces from the 2025 & 2026 Piano syllabus until 31 December 2027. All pieces must be from the same syllabus". Bản đặc tả 2025 & 2026 hết hạn 31/12/2026 (hồ sơ piano/thay-va-thi n16). Phần "nguồn gợi ý tốt" là nhận xét; abrsm.org trả 403 với robot (chuẩn mục 2).'
    luot_2: dung
    luot_2_nguon: [ "https://www.musicmark.org.uk/wp-content/uploads/Piano-syllabus-Press-Release-2026-FINAL.pdf", "https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf" ]
    luot_2_ghi_chu: Như piano/thay-va-thi n16. Phần 'nguồn gợi ý tốt' là nhận xét.
  - id: n4
    cau: 'Trinity College London: thi cấp piano (và nhiều nhạc cụ khác) từ Initial đến Grade 8.'
    loai: cap-do
    nguon:
      - trinity-piano
    ket_qua: dung
    ghi_chu: 'Piano Syllabus: "graded exams from Initial to Grade 8". "Nhiều nhạc cụ khác": trinitycollege.com (trang chủ 200) có chương trình nhiều môn; chưa mở danh sách nhạc cụ.'
    luot_2: dung
    luot_2_nguon: [ "https://trinitycollege.com/resource?id=9079" ]
    luot_2_ghi_chu: Trinity thi từ Initial đến Grade 8; có thi nhiều nhạc cụ (đề cương này chỉ riêng piano; 'nhiều nhạc cụ khác' lấy theo trang Trinity chung, chưa mở danh sách).
  - id: n5
    cau: 'Practising the Piano của Graham Fitch: bài viết và video về cách tập, có bài giới thiệu tác phẩm của chương trình ABRSM.'
    loai: ten
    nguon:
      - ptp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…có loạt bài về chương trình ABRSM 2025–2026". Trang chủ có "Find Your Next Piece: Ideas from the New ABRSM Syllabus" (Jill Morton) và tìm thấy "ABRSM 2025 & 2026 Syllabus – Workshop Series"; "loạt bài" về 2025–2026 mau cũ, viết chung. "Graham Fitch" đúng tên tác giả trang ("Ryan Morison and Graham Fitch look back…"). "Video": chưa kiểm.'
    luot_2: dung
    luot_2_nguon: [ "https://practisingthepiano.com/about/", "https://practisingthepiano.com/" ]
    luot_2_ghi_chu: Practising the Piano do Graham Fitch lập, viết về cách tập; trang chủ có bài giới thiệu tác phẩm của chương trình ABRSM mới (Jill Morton).
  - id: n6
    cau: 'Giáo trình piano cho người lớn: Alfred''s Basic Adult Piano Course (hoặc Adult All-in-One), Faber Adult Piano Adventures.'
    loai: ten
    nguon:
      - ol-alfred
      - ol-faber
    ket_qua: dung
    ghi_chu: 'Open Library: "Alfred''s Basic Adult Piano Course" (Willard A. Palmer, 1983); "Adult Piano Adventures All-in-One Piano Course Book 1" (Nancy và Randall Faber). Tên "Alfred''s Basic Adult All-in-One Course" chưa mở trang nhà xuất bản; tên Faber trên trang có chữ "Faber" thừa so với tên ấn bản "Adult Piano Adventures" (cùng nhà xuất bản Faber Piano Adventures).'
    luot_2: dung
    luot_2_nguon: [ "https://www.alfred.com/alfreds-basic-adult-piano-course-lesson-book-1/p/00-2236/", "https://pianoadventures.com/" ]
    luot_2_ghi_chu: Alfred's Basic Adult Piano Course và Faber Piano Adventures (Adult) có thật; chưa kiểm riêng tên 'Adult All-in-One'.
  - id: n7
    cau: 'Bản nhạc Urtext (in theo nguồn gốc của tác giả): G. Henle Verlag (có ứng dụng Henle Library và thang độ khó 1–9 cho từng bài), Wiener Urtext, Bärenreiter.'
    loai: ten
    nguon:
      - henle
    ket_qua: null
    ghi_chu: 'chưa chắc: thang độ khó 1–9 từng bài đã kiểm ở hồ sơ piano/tac-pham-theo-cap (n10); ứng dụng Henle Library chưa mở trang giới thiệu (henle.de/en/Henle-Library/ báo lỗi khi tải bằng script); Wiener Urtext, Bärenreiter chưa mở.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.henle.de/Getting-to-work/", "https://guides.library.yale.edu/musicdatabases/scores/henle-library" ]
    luot_2_ghi_chu: "Henle: trang có bộ lọc mức khó 1–9 và ứng dụng Henle Library (Yale). Chưa mở được trang Wiener Urtext (hết giờ) và Bärenreiter, nên chưa xác nhận cả danh sách."
  - id: n8
    cau: 'Sách: Heinrich Neuhaus, The Art of Piano Playing; Seymour Bernstein, With Your Own Two Hands; Thomas Mark, What Every Pianist Needs to Know About the Body; Gerald Klickstein, The Musician''s Way.'
    loai: ten
    nguon:
      - ol-neuhaus
      - ol-bernstein
      - ol-mark
      - ol-klickstein
    ket_qua: dung
    ghi_chu: 'Open Library: The Art of Piano Playing (Heinrich Neuhaus, 1973); With Your Own Two Hands (Seymour Bernstein, 1981); What Every Pianist Needs to Know About the Body (Thomas Mark, 2003, GIA); The Musician''s Way (Gerald Klickstein, Oxford University Press, 2009). Nguồn bậc 3 (danh mục thư viện) vì sách in; tên và tác giả khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://openlibrary.org/search.json?q=neuhaus+art+of+piano+playing", "https://openlibrary.org/search.json?q=bernstein+with+your+own+two+hands", "https://openlibrary.org/search.json?q=thomas+mark+what+every+pianist+needs+to+know+about+the+body" ]
    luot_2_ghi_chu: Open Library có cả bốn sách (Neuhaus 1973 bản Anh, Bernstein, Thomas Mark, Klickstein).
  - id: n9
    cau: Danh mục đầy đủ các sách ở cuối từng trang trong mục Piano.
    loai: ve-site
    ket_qua: dung
    ghi_chu: Trang piano/* có mục Nguồn cuối trang (ví dụ piano/thay-va-thi, piano/tac-pham-theo-cap); link /opus/piano/ trang mục lục. Không kiểm từng trang.
  - id: n10
    cau: 'musictheory.net — Lessons: bài học ngắn, có hình động; nên bắt đầu ở đây.'
    loai: ten
    nguon:
      - mtn-lessons
    ket_qua: dung
    ghi_chu: 'Trang Lessons: "Our lessons are provided online for free"; "Enhanced offline versions of our animated lessons". "Nên bắt đầu ở đây" là gợi ý của site (khuyen-tap).'
    luot_2: dung
    luot_2_nguon: [ "https://www.musictheory.net/lessons" ]
    luot_2_ghi_chu: "Trang Lessons: bài học trực tuyến miễn phí, có hình động. 'Nên bắt đầu ở đây' là lời khuyên."
  - id: n11
    cau: 'Open Music Theory: giáo trình đại học mở, miễn phí, đầy đủ từ cơ bản đến nâng cao.'
    loai: ten
    nguon:
      - omt
    ket_qua: dung
    ghi_chu: 'Trang đầu: "Open Music Theory is a natively-online open educational resource intended to serve as the primary text and workbook for undergraduate music theory curricula", có "Download this book Digital PDF". "Miễn phí": tải PDF và đọc trực tuyến không đòi tài khoản.'
    luot_2: dung
    luot_2_nguon: [ "https://open.umn.edu/opentextbooks/textbooks/open-music-theory" ]
    luot_2_ghi_chu: Open Music Theory là giáo trình mở, miễn phí (Open Textbook Library), từ cơ bản tới nâng cao; mô tả lấy theo kết quả tìm kiếm của trang này và trang gốc.
  - id: n12
    cau: teoria.com — bài học và bài luyện tai.
    loai: ten
    nguon:
      - teoria
    ket_qua: dung
    ghi_chu: 'Trang chủ: "Tutorials, Exercises, Reference, Articles… Music Theory & Ear Training Exercises".'
    luot_2: dung
    luot_2_nguon: [ "https://www.teoria.com/" ]
    luot_2_ghi_chu: teoria.com có Tutorials, Exercises (Music Theory & Ear Training Exercises).
  - id: n13
    cau: 'Coursera: Fundamentals of Music Theory (University of Edinburgh) và Developing Your Musicianship (Berklee College of Music); xem điều kiện học và chi phí trên trang khóa học.'
    loai: ten
    nguon: []
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "University of Edinburgh; có thể học dự thính miễn phí." Hai trang Coursera mở được (200) nhưng nội dung nạp bằng JavaScript, tiêu đề chỉ hiện "Coursera Plus"; các nguồn bên thứ ba (tổng hợp khóa học) ghi "audit miễn phí", không phải nguồn bậc 2. Bỏ "dự thính miễn phí" (điều kiện Coursera hay đổi), chữ thay: "xem điều kiện học và chi phí trên trang khóa học" (cũng thêm cho Berklee). Tên khóa và trường đối chiếu qua kết quả tìm kiếm (Edinburgh: Fundamentals of Music Theory; Berklee: Developing Your Musicianship, đặc biệt chuyên ngành 4 khóa): chưa chắc phần "trường nào".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.coursera.org/learn/musictheory" ]
    luot_2_ghi_chu: Mở được trang Fundamentals of Music Theory (Coursera, University of Edinburgh). Chưa mở được trang Developing Your Musicianship (Berklee) nên chưa xác nhận.
  - id: n14
    cau: 'musictheory.net — Exercises: đọc nốt, quãng, hợp âm, hóa biểu.'
    loai: ten
    nguon:
      - mtn-exercises
    ket_qua: dung
    ghi_chu: 'Trang Exercises: "Our exercises are provided online for free"; mục "STAFF IDENTIFICATION…" (và các mục quãng, hợp âm, hóa biểu khác trên trang; đã mở ngày 05/11/2026, chỉ đọc đầu trang).'
    luot_2: dung
    luot_2_nguon: [ "https://www.musictheory.net/exercises" ]
    luot_2_ghi_chu: "Exercises: nhận nốt, quãng, hợp âm, hóa biểu (Staff Identification, Intervals...)."
  - id: n15
    cau: 'ToneGym: luyện tai dạng trò chơi; có thể đăng ký miễn phí.'
    loai: ten
    nguon:
      - tonegym
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bản miễn phí có giới hạn". Trang chủ: "Ear Training Games… Sign up for free"; không đọc được trang giá nên không khẳng định "có giới hạn". Viết lại theo điều trang nói.'
    luot_2: dung
