    luot_2: khong-chac
    luot_2_ghi_chu: So sánh 'lớn hơn bất kỳ nhạc cụ nào khác' không có số liệu nguồn bậc 2 để xác nhận; có thể diễn đạt mềm hơn ('rất lớn').
