  - id: t28
    cau: Link tới trang Nhạc cổ điển ở Việt Nam (/opus/lich-su/viet-nam/) và Nhạc truyền thống Việt Nam và nhạc cổ điển (/opus/lich-su/nhac-truyen-thong-viet-nam/); nguồn báo chí ghi riêng ở cuối hai trang ấy.
