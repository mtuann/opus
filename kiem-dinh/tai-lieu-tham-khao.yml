ghi_chu: "Trang tầng lõi, danh mục nguồn; không có khối abc. Nhận định tách theo mục sách/trang/công cụ (loại ten, nam, cap-do) và câu ve-site (link nội bộ, NGUON.txt, OFL, neo). Nhiều trang chủ chặn công cụ (abrsm.org, oyc.yale.edu, wienerurtext.com, global.oup.com, wwnorton.com, Tonejs/audio); thay bằng bản ghi thư viện, nhà xuất bản và bán sách, ghi ở từng nguồn. Chỗ sửa trang: t3, t4, t7–t14, t16, t20, t21, t23–t27, t29, t34, t36, t37, t41 (lý do ở ghi_chu từng nhận định và doi_chu). Chưa chắc: t31 (Tone.js), t35 (DCML, TROMPA), t42 (văn bản CC BY-SA). Câu ve-site trỏ trang chưa chuyển: cap-nhat, lich-su/viet-nam, lich-su/nhac-truyen-thong-viet-nam, nhan-dien/nghe-mu, piano/tac-pham/, nghe-nhac/. Link GitHub vẫn là repo cũ mtuann/opus-zero (t1, t41): người giao quyết khi repo mới công khai. NGUON.txt có mà chưa có mp3 (D6-0). Ràng buộc lô trước (grep kiem-dinh): trang phải ở đường dẫn này; giữ danh sách nguồn chính (Grove, OMT: còn); mọi link hinh-thuc, lich-su, piano, nhac-ly còn; neo #am-thanh, #phan-mem còn: khớp. Thuật ngữ chưa có: không cần."
doi_chu:
  - cu:
      - "Grove Music Online (oxfordmusiconline.com): bách khoa âm nhạc chuẩn mực nhất bằng tiếng Anh; cần tài khoản, nhiều thư viện đại học có quyền truy cập."
      - "Encyclopaedia Britannica (britannica.com): mục từ về nhà soạn nhạc và thuật ngữ, ngắn gọn và đáng tin."
    moi:
      - "Grove Music Online (oxfordmusiconline.com): bách khoa âm nhạc của Oxford University Press, nằm trong cổng Oxford Music Online."
      - "Encyclopaedia Britannica (britannica.com): mục từ về nhà soạn nhạc, nhạc cụ và thuật ngữ âm nhạc."
      - "The Concise Oxford Dictionary of Music, đọc qua Encyclopedia.com: mục từ ngắn về thuật ngữ, nhạc cụ và thể loại; nhiều trang trên site dẫn nguồn này."
    ly_do: 't3 (da-sua): bỏ đánh giá và điều kiện truy cập không kiểm được.; t4 (da-sua): bỏ "đáng tin".'
  - cu:
      - J. Peter Burkholder, Donald J. Grout, Claude V. Palisca, A History of Western Music. Giáo trình lịch sử âm nhạc chuẩn ở đại học.
      - Richard Taruskin, The Oxford History of Western Music. Bộ lịch sử nhiều tập, sâu và có quan điểm riêng.
      - Craig Wright, Listening to Music, kèm khóa học miễn phí của Yale.
      - "Alex Ross, The Rest Is Noise: âm nhạc thế kỷ 20."
    moi:
      - "J. Peter Burkholder, Donald Jay Grout, Claude V. Palisca, A History of Western Music (W. W. Norton, nhiều lần tái bản): giáo trình lịch sử âm nhạc phương Tây."
      - "Richard Taruskin, The Oxford History of Western Music (Oxford University Press, 2005): bộ lịch sử nhiều tập của một tác giả."
      - Craig Wright, Listening to Music, và khóa học cùng tên của ông trên Open Yale Courses (MUSI 112).
      - "Alex Ross, The Rest Is Noise: Listening to the Twentieth Century (Farrar, Straus and Giroux, 2007): âm nhạc thế kỷ 20."
    ly_do: 't7 (da-sua): bỏ đánh giá; thêm nhà xuất bản.; t8 (da-sua): bỏ đánh giá; thêm nhà xuất bản và năm.; t9 (da-sua): bỏ "miễn phí".; t10 (da-sua): thêm phụ đề, nhà xuất bản, năm.'
  - cu:
      - "Open Music Theory: giáo trình mở, miễn phí, nguồn chính cho các bài trung cấp."
      - "musictheory.net: bài học cơ bản."
      - "Johann Joseph Fux, Gradus ad Parnassum (1725), bản dịch tiếng Anh The Study of Counterpoint: nguồn của bài 22."
      - "Steven G. Laitz, The Complete Musician: giáo trình hòa âm và phân tích bậc đại học."
    moi:
      - "Open Music Theory: giáo trình mở, đọc tự do trên mạng (giấy phép CC BY-SA 4.0), nguồn chính cho các bài nhạc lý của site."
      - "musictheory.net: bài học nhạc lý trực tuyến, từ cơ bản đến trung cấp."
      - "Johann Joseph Fux, Gradus ad Parnassum (1725), bản dịch tiếng Anh của Alfred Mann, The Study of Counterpoint (W. W. Norton, 1965): giáo trình đối âm được kể ở bài 22."
      - "Steven G. Laitz, The Complete Musician: An Integrated Approach to Tonal Theory, Analysis, and Listening (Oxford University Press): giáo trình hòa âm, phân tích và luyện nghe nhạc có giọng."
    ly_do: "t11 (da-sua): thêm giấy phép; nói đúng phạm vi.; t12 (da-sua): theo mục lục Lessons.; t13 (da-sua): bài 22 dùng OMT làm nguồn chính; thêm dịch giả, nhà xuất bản, năm.; t14 (da-sua): thêm phụ đề và nhà xuất bản."
  - cu:
      - Thang độ khó 1–9 của G. Henle Verlag (do Rolf Koenen xếp), in kèm từng ấn bản Urtext.
      - "Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred, 1995); Maurice Hinson, Wesley Roberts, Guide to the Pianist's Repertoire (tái bản lần 4, Indiana University Press, 2014): xếp cấp và mô tả tác phẩm."
      - "Heinrich Neuhaus, The Art of Piano Playing; Thomas Mark, What Every Pianist Needs to Know About the Body (2003); Gerald Klickstein, The Musician's Way (2009); Graham Fitch, Practising the Piano: kỹ thuật, cách tập và giữ tay khỏe."
      - "Giáo trình cho người lớn: Alfred's Basic Adult Piano Course, Faber Adult Piano Adventures."
    moi:
      - Thang độ khó 1–9 trong danh mục của G. Henle Verlag (phần piano do Rolf Koenen biên soạn).
      - "Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred, 1995); Maurice Hinson, Wesley Roberts, Guide to the Pianist's Repertoire (bản thứ tư, Indiana University Press, 2014): xếp cấp và mô tả tác phẩm."
      - "Heinrich Neuhaus, The Art of Piano Playing; Thomas Mark, What Every Pianist Needs to Know About the Body (GIA, 2003); Gerald Klickstein, The Musician's Way (Oxford University Press, 2009); Graham Fitch, Practising the Piano: kỹ thuật, cách tập và giữ tay khỏe."
      - "Giáo trình cho người lớn: Alfred's Basic Adult Piano Course (Willard A. Palmer, Morton Manus, Amanda Vick Lethco), Adult Piano Adventures (Faber Piano Adventures)."
    ly_do: 't16 (da-sua): trang Henle không nói "in kèm từng ấn bản".; t20 (da-sua): thêm nhà xuất bản.; t21 (da-sua): thêm nhà xuất bản.; t23 (da-sua): tên bộ sách chính thức; thêm tác giả bộ Alfred.'
