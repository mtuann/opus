nhan_dinh:
  - id: t1
    cau: Link tới trang GitHub của dự án (https://github.com/mtuann/opus-zero/issues) để báo lỗi.
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: "Repo cũ mtuann/opus-zero công khai, có Issues. Repo mới chưa công khai (astro.config.mjs: link GitHub chỉ thêm lại khi repo công khai). Giữ link cũ cho tới khi repo mới công khai: người giao quyết lúc đó (đổi link sang repo mới)."
    review: dung
  - id: t2
    cau: Link tới trang Cập nhật (/opus/cap-nhat/).
    loai: ve-site
    nguon: []
    ket_qua: dung
    ghi_chu: Trang đích chưa chuyển; kiểm ~/w/opus-zero/docs/cap-nhat.md (có, tiêu đề "Cập nhật"). Lô chuyển cap-nhat giữ đường dẫn.
    review: dung
  - id: t3
    cau: Grove Music Online (oxfordmusiconline.com) là bách khoa âm nhạc của Oxford University Press, nằm trong cổng Oxford Music Online.
    loai: ten
    nguon:
      - grove
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "chuẩn mực nhất; cần tài khoản, nhiều thư viện đại học có quyền truy cập". Lý do: "chuẩn mực nhất" là đánh giá không kiểm được; "cần tài khoản" không kiểm được từ trang chủ. Trang Oxford Music Online: "The gateway to Grove Music Online"; nhà xuất bản không ghi rõ trên trang chủ, Oxford University Press theo tên thương hiệu.'
  - id: t4
    cau: "Encyclopaedia Britannica (britannica.com): mục từ về nhà soạn nhạc, nhạc cụ và thuật ngữ âm nhạc."
    loai: ten
    nguon:
      - br-orchestra
    ket_qua: da-sua
    ghi_chu: Chữ cũ "ngắn gọn và đáng tin". Bỏ "đáng tin" (đánh giá). Đã mở các mục nhạc cụ và thể loại (Orchestra, Tuba, Harpsichord, Opera, Cantata, Recorder); trang chủ Britannica chặn công cụ.
  - id: t5
    cau: "The Concise Oxford Dictionary of Music đọc qua Encyclopedia.com: mục từ ngắn về thuật ngữ, nhạc cụ và thể loại; nhiều trang trên site dẫn nguồn này."
    loai: ten
    nguon:
      - cod
    ket_qua: dung
    ghi_chu: Mục Orchestra và hàng chục mục khác đã mở khi kiểm định (hồ sơ các trang khác). Mới thêm ở lượt này.
  - id: t6
    cau: "Wikipedia tiếng Anh: điểm khởi đầu tốt cho danh mục tác phẩm và năm tháng; nên đối chiếu với nguồn khác khi dùng để viết."
    loai: khuyen-tap
    nguon: []
    ket_qua: khong-can-nguon
    ghi_chu: Lời khuyên; khớp chuẩn kiểm định (Wikipedia chỉ để tìm nguồn bậc 1–2).
  - id: t7
    cau: Burkholder, Grout, Palisca, A History of Western Music (W. W. Norton, nhiều lần tái bản).
    loai: ten
    nguon:
      - norton-bwm
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "Donald J. Grout" và "giáo trình chuẩn ở đại học". Chữ mới đủ tên (Donald Jay Grout), thêm nhà xuất bản, bỏ "chuẩn ở đại học". VitalSource: bản thứ 10.'
  - id: t8
    cau: "Taruskin, The Oxford History of Western Music (Oxford University Press, 2005): bộ lịch sử nhiều tập của một tác giả."
    loai: ten
    nguon:
      - taruskin
    ket_qua: da-sua
    ghi_chu: Chữ cũ "sâu và có quan điểm riêng". Bỏ đánh giá; thêm nhà xuất bản và năm 2005 (bản ghi thư viện).
  - id: t9
    cau: Craig Wright, Listening to Music, và khóa học cùng tên trên Open Yale Courses (MUSI 112).
    loai: ten
    nguon:
      - yale-musi112
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "kèm khóa học miễn phí của Yale". Bỏ "miễn phí" (Open Culture xác nhận khóa mở, nhưng điều kiện truy cập có thể đổi). Trang chủ oyc.yale.edu chặn công cụ; dùng Open Culture. Hai sách khác nhau: "Listening to Music" (sách) với khóa MUSI 112 (Listening to Music).'
  - id: t10
    cau: "Alex Ross, The Rest Is Noise: Listening to the Twentieth Century (Farrar, Straus and Giroux, 2007): âm nhạc thế kỷ 20."
    loai: ten
    nguon:
      - ross
    ket_qua: da-sua
    ghi_chu: "Chữ cũ thiếu phụ đề và nhà xuất bản; Bowker: FSG, tháng 10/2007."
  - id: t11
    cau: "Open Music Theory: giáo trình mở, đọc tự do trên mạng, giấy phép CC BY-SA 4.0, nguồn chính cho các bài nhạc lý của site."
    loai: ten
    nguon:
      - omt
    ket_qua: da-sua
    ghi_chu: Chữ cũ "miễn phí, nguồn chính cho các bài trung cấp". Chữ mới thêm giấy phép (trang OMT v2) và nói "các bài nhạc lý" cho khớp chuan-kiem-dinh (OMT là nguồn chính bậc 2).
  - id: t12
    cau: "musictheory.net: bài học nhạc lý trực tuyến, từ cơ bản đến trung cấp."
    loai: ten
    nguon:
      - musictheory-net
    ket_qua: da-sua
    ghi_chu: Chữ cũ "bài học cơ bản". Lessons của trang gồm cả bài trung cấp.
  - id: t13
    cau: "Fux, Gradus ad Parnassum (1725), bản dịch tiếng Anh của Alfred Mann, The Study of Counterpoint (W. W. Norton, 1965): giáo trình đối âm được kể ở bài 22."
    loai: nam
    nguon:
      - fux-mann
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "nguồn của bài 22" và thiếu tên dịch giả. W. W. Norton: The Study of Counterpoint, dịch Alfred Mann; năm 1725 và 1965 theo trang Norton. Bài 22 dùng OMT làm nguồn chính (hồ sơ nhac-ly/22), nên chữ "nguồn của bài 22" đổi thành "được kể ở bài 22".'
  - id: t14
    cau: "Laitz, The Complete Musician: An Integrated Approach to Tonal Theory, Analysis, and Listening (Oxford University Press): giáo trình hòa âm, phân tích và luyện nghe nhạc có giọng."
    loai: ten
    nguon:
      - laitz-lib
      - laitz-hoepli
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "bậc đại học" và thiếu phụ đề. Thư viện Holy Cross: OUP, bản 4 (2016); Hoepli: phụ đề.'
  - id: t15
    cau: "ABRSM và Trinity College London: chương trình thi cấp, thước đo cấp độ (Grade) dùng trên toàn site."
    loai: ten
    nguon:
      - abrsm
      - trinity
    ket_qua: dung
    ghi_chu: 'Trang chủ ABRSM chặn công cụ; đề cương piano 2025–26 (PDF bản sao, Initial đến Grade 8) mở được. Phần "dùng trên toàn site" là câu về site: src/data/tac-pham.yml có trường grade ở nhiều tác phẩm (34 chỗ).'
  - id: t16
    cau: Thang độ khó 1–9 trong danh mục G. Henle Verlag (phần piano do Rolf Koenen biên soạn).
    loai: cap-do
    nguon:
      - henle-lv
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "do Rolf Koenen xếp, in kèm từng ấn bản". Trang Levels of Difficulty: thang 1–9, phần piano do Koenen (©2010); "in kèm từng ấn bản" bỏ vì không thấy ở trang.'
  - id: t17
    cau: "Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred, 1995): xếp cấp và mô tả tác phẩm."
    loai: ten
    nguon:
      - magrath
    ket_qua: dung
    ghi_chu: "WorldCat: Alfred, 1995."
  - id: t18
    cau: Maurice Hinson, Wesley Roberts, Guide to the Pianist's Repertoire (bản thứ tư, Indiana University Press, 2014).
    loai: ten
    nguon:
      - hinson
    ket_qua: dung
    ghi_chu: "Woodslane: Indiana University Press, ngày phát hành 3/3/2014, bản 4."
  - id: t19
    cau: Heinrich Neuhaus, The Art of Piano Playing.
    loai: ten
    nguon:
      - neuhaus
    ket_qua: dung
    ghi_chu: "Kahn & Averill: dịch K. A. Leibovitch."
  - id: t20
    cau: Thomas Mark, What Every Pianist Needs to Know About the Body (GIA, 2003).
    loai: ten
    nguon:
      - mark-gia
    ket_qua: da-sua
    ghi_chu: "Chữ cũ thiếu nhà xuất bản. GIA: 2003."
  - id: t21
    cau: Gerald Klickstein, The Musician's Way (Oxford University Press, 2009).
    loai: ten
    nguon:
      - klickstein
    ket_qua: da-sua
    ghi_chu: "Chữ cũ thiếu nhà xuất bản. Thư viện Arlington: OUP, 2009."
  - id: t22
    cau: "Graham Fitch, Practising the Piano (practisingthepiano.com): kỹ thuật, cách tập và giữ tay khỏe."
    loai: ten
    nguon:
      - fitch
    ket_qua: dung
    ghi_chu: "Trang About: Graham Fitch."
  - id: t23
    cau: "Giáo trình cho người lớn: Alfred's Basic Adult Piano Course (Willard A. Palmer, Morton Manus, Amanda Vick Lethco), Adult Piano Adventures (Faber Piano Adventures)."
    loai: ten
    nguon:
      - alfred-adult
      - faber-adult
    ket_qua: da-sua
    ghi_chu: Chữ cũ "Faber Adult Piano Adventures" không khớp tên bộ sách chính thức (Adult Piano Adventures, Faber Piano Adventures); thêm tác giả bộ Alfred.
  - id: t24
    cau: "IMSLP (International Music Score Library Project): kho bản nhạc và tổng phổ thuộc phạm vi công cộng; nguồn để đối chiếu các trích đoạn tác phẩm thật trên site."
    loai: dinh-nghia
    nguon:
      - imslp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "nguồn để kiểm tra mọi ví dụ nhạc trên site". Chữ mới: ví dụ nhạc soạn riêng không đối chiếu từ IMSLP; thêm tên đầy đủ.'
  - id: t25
    cau: "Mutopia Project: bản nhạc mở do tình nguyện viên chép bằng LilyPond từ ấn bản thuộc phạm vi công cộng, kèm tệp nguồn; nguồn của nhiều đoạn trích trong các bài học tác phẩm."
    loai: dinh-nghia
    nguon:
      - mutopia
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ "bản nhạc phạm vi công cộng chép bằng LilyPond". Trang Mutopia: giấy phép phần lớn Creative Commons hay phạm vi công cộng, nên không gọi chung "phạm vi công cộng".'
  - id: t26
    cau: Ấn bản Urtext (G. Henle Verlag, Wiener Urtext, Bärenreiter) để đối chiếu nốt, đọc lời tựa và chú giải nguồn.
    loai: ten
    nguon:
      - henle
      - wiener
      - baerenreiter
    ket_qua: da-sua
    ghi_chu: Chữ cũ "để đối chiếu nốt, ngón bấm và năm sáng tác". Bỏ "ngón bấm và năm sáng tác" (không kiểm được ở trang giới thiệu Urtext); thêm link Wiener Urtext (Schott), Bärenreiter. wienerurtext.com chặn công cụ.
  - id: t27
    cau: Gramophone (tạp chí, có cơ sở dữ liệu đánh giá bản thu) và Bachtrack (lịch diễn, đánh giá, tin tức).
