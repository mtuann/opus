- trang: piano/tac-pham/burgmuller-la-candeur
  id: n1
  cau: La candeur là bài mở đầu (số 1) của tập 25 Études faciles et progressives, Op. 100 của Burgmüller.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n2
  cau: La candeur là bài mở đầu tập 25 Études faciles et progressives, Op. 100 của Burgmüller.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n3
  cau: Bài có giai điệu móc đơn hát liền tiếng ở tay phải trên những hợp âm ngân của tay trái, rồi hai tay đổi vai.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n4
  cau: Chữ candeur nghĩa là trong sáng, ngây thơ.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n6
  cau: Burgmüller mở tập Op. 100 bằng một bài hát không lời có câu, có chỗ to dần, một nốt nhấn sf ở đỉnh, một chỗ dolce e poco rit. và một coda nhỏ dần đến pp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n7
  cau: Gần như ô nào cũng là một chuỗi móc đơn có dấu luyến, từng nhóm bốn hoặc tám nốt.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n9
  cau: Suốt đoạn A, tay trái chỉ giữ hợp âm.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n12
  cau: Đoạn B đưa hình móc đơn xuống tay trái trong khi tay phải giữ hai nốt ngân; ô 13 bắt một bàn tay chơi hai bè cùng lúc.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n13
  cau: Bài ở Đô trưởng nhưng có Fa♯ (ô 7), Mi♭ (ô 13) và La♭ (coda).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n15
  cau: Friedrich Burgmüller sinh năm 1806 ở Regensburg.
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n16
  cau: Burgmüller sang Paris năm 1832 và sống ở Pháp đến cuối đời.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n17
  cau: Ở Paris, Burgmüller làm thầy dạy piano và viết nhạc salon (nhạc piano phổ thông) cho người chơi nghiệp dư.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n19
  cau: Arabesque là bài số 2 của cùng tập Op. 100, đứng ngay sau La candeur.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n20
  cau: 25 Études faciles et progressives, Op. 100 in năm 1851.
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n21
  cau: Tựa đề đầy đủ của tập nói các bài được soạn và ghi số ngón riêng cho tầm với của bàn tay nhỏ.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n22
  cau: Mỗi bài của Op. 100 mang một tựa tiếng Pháp gợi một tính cách hay một hình ảnh.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n23
  cau: Độ khó các bài của Op. 100 tăng dần theo thứ tự.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n24
  cau: La candeur đứng đầu tập, ngay trước Arabesque.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n26
  cau: "Chữ candeur trong tiếng Pháp chỉ sự trong sáng, thật thà, không chút tính toán: cái ngây thơ của trẻ nhỏ."
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n27
  cau: Bản dàn trang trên Mutopia (theo ấn bản Litolff) ghi thêm tựa tiếng Đức và tiếng Anh với nghĩa "sự chân thành".
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n30
  cau: Bài này được thu rất nhiều, cả bởi nghệ sĩ lẫn giáo viên.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n32
  cau: Ở đoạn B, tay trái nhận hình móc đơn trong khi tay phải giữ hai nốt ngân; nốt La cao ở ô 14 có dấu sf; coda nhỏ dần, chậm lại, hợp âm cuối pp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n34
  cau: La candeur và Arabesque đứng liền nhau trong tập mà tính cách trái ngược hẳn.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n35
  cau: "Đoạn A (ô 1–8): p, dolce; tay phải hát chuỗi móc đơn bắt đầu từ Sol cao, tay trái giữ hợp âm; to dần ở ô 5–7, dừng trên hợp âm Sol (át âm)."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n36
  cau: Đoạn A được nhắc lại (ô 1–8).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n37
  cau: "Đoạn B, nửa đầu (ô 9–12): p; ô 9 và 11 hai tay đi ngược chiều; ô 10 và 12 tay phải giữ Đô – Mi, tay trái chạy móc đơn và to dần."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n38
  cau: "Đoạn B, nửa sau (ô 13–16): Mi♭ tạo màu tối bất ngờ; nốt La cao sf rơi xuống Sol; dolce e poco rit.; kết ở Đô trưởng, tay trái đáp lại bằng hình nốt nhỏ Đô – Mi – Fa – Sol."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n39
  cau: Đoạn B được nhắc lại (ô 9–15).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n40
  cau: "Kết thứ hai và coda: tay phải chạy lên Đô – Rê – Mi – Fa – Sol rồi rơi xuống Fa – Rê – Đô – Si, mỗi nhóm nhỏ dần; tay trái giữ âm nền Đô, hợp âm Fa thứ (có La♭) xen với Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n41
  cau: "Kết: tay trái nhắc lại hình Đô – Mi – Fa – Sol ở âm vực trầm; hợp âm Đô trưởng dim. e poco rit.; hợp âm cuối pp."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n42
  cau: "Đoạn A (ô 1–8, nhắc lại) ở Đô trưởng; hợp âm Rê có Fa♯ (ô 7) dẫn về hợp âm Sol: dừng ở át âm (kết nửa)."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n43
  cau: "Đoạn A: tay phải có nhóm bốn móc đơn đi xuống (ô 1–2, 5–6), câu tám nốt có Si – Đô (ô 3–4), ô 7 dẫn xuống Sol; tay trái mỗi ô một hợp âm ngân, dolce."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n44
  cau: Ở ô 2 tay phải dời lên Đô6; ở ô 3–4 ngón 2 vắt qua ngón cái xuống Si.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n45
  cau: "Đoạn B, nửa đầu (ô 9–12): hợp âm át bảy (Sol – Si – Rê – Fa) xen với Đô trưởng; ô 9, 11 tay phải Fa – Rê – Đô – Si đi xuống, tay trái Sol – Si – Đô – Rê đi lên; ô 10, 12 tay phải giữ Đô – Mi, tay trái chạy."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n46
  cau: Ở ô 10 và 12, dấu to dần nằm trên nốt ngân của tay phải.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n47
  cau: Trên piano, nốt đã đánh thì tắt dần, không thể to lên, nên chính tay trái làm việc to dần.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n48
  cau: "Đoạn B, nửa sau (ô 13–16): Mi♭ và Fa♯ trên bè trầm La (ô 13); hợp âm Đô thế đảo hai (ô 14), Sol bảy (ô 15); kết trọn ở Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n49
  cau: Ô 13 tay phải chơi hai bè; ô 14 La sf rơi xuống Sol; ô 15 p, dolce e poco rit.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n50
  cau: Kết thứ nhất quay về ô 9; kết thứ hai đi thẳng vào coda.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n51
  cau: Coda dài khoảng 6 ô, trên âm nền Đô, hợp âm Fa thứ (Đô – Fa – La♭) xen với Đô trưởng; hình nốt của đoạn B trở lại, mỗi nhóm nhỏ dần; tay trái Đô – Mi – Fa – Sol; dim. e poco rit., pp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n52
  cau: Trong bản Mutopia, khuông tay trái chuyển sang khóa Sol từ ô 15 đến gần cuối.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n53
  cau: "Đoạn A dừng ở át âm, đoạn B khép lại ở chủ âm: khung của hình thức hai đoạn, cộng thêm một coda."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n55
  cau: Cả hai đoạn đều nhắc lại; lần thứ hai, đoạn B bỏ kết thứ nhất, rẽ sang kết thứ hai và đi thẳng vào coda.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n56
  cau: Nốt nhạc, dấu luyến, sắc thái và số ngón của khuông đoạn A theo bản Mutopia (ấn bản Litolff); số ngón chỉ ghi ở những chỗ bản ấy ghi.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n57
  cau: Hết ô 8, nhắc lại từ đầu rồi mới sang đoạn B.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n58
  cau: "Ô 1: ngón 5 trên Sol5, bốn nốt Sol – Mi – Rê – Đô bằng 5-3-2-1. Ô 2: ngón 5 trên Đô6, rồi lại 5-3-2-1."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n59
  cau: "Ô 3–4: sau Đô (ngón 1), ngón 2 vắt qua ngón cái xuống Si rồi ngón cái trở lại Đô."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n61
  cau: "Ô 7: ngón 3 trên Si và ngón 4 trên Đô đặt tay vào thế năm ngón Sol – Rê, để ngón cái sẵn sàng cho nốt Sol ở ô 8."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n63
  cau: Ở ô 3–4, dấu nối giữ nguyên hợp âm tay trái qua hai ô.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n64
  cau: Thế tay năm ngón của tay phải ở ô 1 đi từ Đô (C5) đến Sol (G5).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n66
  cau: "Ô 13: ngón 5 giữ Sol rồi Fa♯ trong khi các ngón khác chơi Mi♭ – Rê – Đô sau một dấu lặng; Mi♭ là phím đen."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n69
  cau: "Bài tập 1: tay phải mf, tay trái pp; tay trái dùng 5-3-1 cho Đô – Mi – Sol và 5-2-1 cho Si – Fa – Sol."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n71
  cau: "Bài tập 2: ô 1 và 3 hai tay đi ngược chiều, kiểu ô 9 của bài; ô 2 và 4 tay phải giữ Đô – Mi (ngón 1 và 3), tay trái chạy, to dần rồi nhỏ dần."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n72
  cau: "Bài tập 3: ngón 5 giữ nốt trên trong khi ngón 3-2-1 (hay 4-3-2) chơi nhóm ba nốt sau dấu lặng; ở ô 2 bàn tay dời xuống một bậc mỗi nửa ô; đó là kết cấu của ô 13. Ô 3–4 mỗi cặp hai nốt luyến như nốt La sf ở ô 14; ô cuối chậm lại như poco rit. ở ô 15."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n76
  cau: Allegro moderato là nhanh vừa phải.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n81
  cau: "Phần lớn bài ở p; các chỗ sắc thái: nhỏ dần trên nhóm đầu ô 2; cresc. từ ô 5 đến dấu to dần ở ô 7; to dần ở ô 10 và 12; ô 13 nhỏ dần trên hai nốt ngân; sf ở ô 14; p, dolce e poco rit. ở ô 15; trong coda mỗi nhóm Fa – Rê – Đô – Si có dấu nhỏ dần riêng, rồi dim. e poco rit. và pp."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n82
  cau: sf chỉ là nhấn một nốt, không phải chuyển cả đoạn sang f.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n84
  cau: Bản Litolff trên Mutopia không ghi bàn đạp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n87
  cau: Số ngón của tập Op. 100 được tính cho bàn tay nhỏ, đúng như tựa tập nhạc.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n91
  cau: Trong Op. 100, La pastorale là số 3, Consolation số 13, Ave Maria số 19.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n95
  cau: "Câu hỏi 1: đoạn A (ô 1–8) dừng trên hợp âm Sol, tức át âm (kết nửa), ngay sau hợp âm Rê có Fa♯; chỉ đoạn B mới kết trọn ở Đô trưởng; đó là khung của hình thức hai đoạn."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n96
  cau: "Câu hỏi 2: ở ô 10 và 12, chính tay trái với chuỗi móc đơn bên dưới làm việc to dần, vì trên piano một nốt đã đánh không thể to lên."
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n97
  cau: "Câu hỏi 3: khó khăn chính ở ô 13 là tay phải chơi hai bè, ngón 5 giữ nốt trên, các ngón còn lại chơi Mi♭ – Rê – Đô."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n99
  cau: "Mục Nguồn: bản dàn trang công cộng La Candeur tại Mutopia Project (id 202), người dàn trang Bas Wassink, nguồn Collection Litolff."
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n100
  cau: "Mục Nguồn: trang IMSLP của Op. 100 cho lần in đầu (Paris: Benoît aîné, 1851) và tên các bài trong tập."
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n101
  cau: 'Mục Nguồn: Wikipedia, "Friedrich Burgmüller" cho năm sinh, năm mất, năm sang Paris.'
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n62
  cau: "Số ngón tay trái (gợi ý của trang): Đô – Mi – Sol 5-3-1, Đô – Fa – La 5-2-1, Si – Fa – Sol 5-2-1, Rê – Fa♯ – Đô 5-3-1, Sol – Si 2-1; đặt hợp âm cùng lúc với nốt đầu của tay phải và giữ đủ bốn phách."
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n75
  cau: Mẹo "Kiểm tra cân bằng bằng tai" và danh sách tự kiểm (năm ô đánh dấu).
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n98
  cau: "Câu hỏi 4: dấu luyến bốn nốt là cách chia nhóm; cuối nhóm chỉ lấy một hơi rất nhẹ, đường câu vẫn kéo dài hai ô."
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol
  id: n1
  cau: Bản minuet này thường được gọi là "Minuet của Bach".
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n2
  cau: Bài có hai bè độc lập (tay trái không đệm hợp âm mà đi một đường bè trầm riêng, lúc đứng yên, lúc chạy).
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n3
  cau: Bài gồm bốn câu 8 ô, mỗi câu chia đôi thành hai nửa 4 ô; tổng 32 ô.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n4
  cau: Bản gốc gần như không ghi dấu luyến hay sắc thái.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n5
  cau: "Kỹ năng của bài: mở rộng thế tay năm ngón, đổi vị trí tay, nhảy quãng tám ở cả hai tay, đọc Fa♯ và Đô♯."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n6
  cau: Năm 1725, J. S. Bach bắt đầu cuốn sổ tay âm nhạc thứ hai cho vợ, Anna Magdalena Bach; sổ mở đầu bằng hai partita của Bach, sau là những bài nhỏ (minuet, polonaise, aria, bài hát); Anna Magdalena tự tay chép nhiều bài, trong đó có cặp minuet này.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n7
  cau: Bài số 3 là một minuet Fa trưởng khuyết danh; bài số 4 và 5 là cặp minuet Sol trưởng và Sol thứ.
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n8
  cau: Có thể Bach mang hai minuet về sau chuyến đi Dresden tháng 9 năm 1725, khi ông biểu diễn trên cây organ Silbermann mới của nhà thờ Sophienkirche, nơi Petzold là nghệ sĩ organ.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n9
  cau: Nhiều khả năng các bài dễ này dùng để dạy các con nhỏ trong nhà.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n10
  cau: Vì sổ tay không ghi tên tác giả cho phần lớn các bài, các nhà xuất bản thế kỷ 19 in chúng như nhạc của Bach.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n11
  cau: Danh mục tác phẩm Bach (BWV, 1950) xếp cặp minuet vào phụ lục (Anhang, viết tắt Anh.), nơi dành cho tác phẩm còn nghi vấn.
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n12
  cau: Cuối thập niên 1970, Hans-Joachim Schulze chỉ ra rằng cặp minuet nằm trong một tổ khúc cho harpsichord mang tên Petzold.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n13
  cau: Tổ khúc do Johann Benjamin Tzschirich chép vào một tập nhạc khoảng giữa thập niên 1730.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n14
  cau: Bài của Schulze đăng trên Bach-Jahrbuch số năm 1979.
  loai: nam
- trang: piano/tac-pham/minuet-sol
  id: n15
  cau: Từ đó, giới nghiên cứu ghi tên Petzold.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n17
  cau: Từ điển âm nhạc của Johann Gottfried Walther (1732) nhắc đến Petzold như tác giả của những bản nhạc đàn phím hay.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n18
  cau: Telemann đã in một tổ khúc của Petzold trong tuyển tập Der getreue Music-Meister (1728–1729).
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n19
  cau: Petzold mất năm 1733; người kế nhiệm ông ở Sophienkirche là Wilhelm Friedemann Bach, con trai cả của J. S. Bach.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n20
  cau: Minuet là điệu nhảy cung đình Pháp nhịp 3/4, bước nhỏ và thanh lịch, một chương quen thuộc trong tổ khúc thời Baroque.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n21
  cau: Về sau minuet trở thành chương 3 của giao hưởng và sonata Cổ điển.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n23
  cau: Ca khúc A Lover's Concerto (1965) do nhóm The Toys thu âm được dựng trên giai điệu bài này.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n24
  cau: Petzold viết cho harpsichord.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n25
  cau: Harpsichord không to nhỏ theo lực ngón.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n28
  cau: Igor Kipnis đã thu bài này; Mahan Esfahani thu bài này trên clavichord.
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n29
  cau: '"Nốt đen" là nốt có độ dài một phách (trong nhịp 3/4 của bài).'
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n30
  cau: Minuet Sol thứ (BWV Anh. 115) đi cặp với bài này.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n31
  cau: Thời Baroque người ta thường chơi minuet 1, minuet 2, rồi minuet 1 lần nữa.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol
  id: n33
  cau: "Theo dõi khi nghe, câu 1 (ô 1–8): môtip Rê – Sol La Si Đô đi lên; tay trái đi xuống từng bậc bằng nốt trắng chấm dôi; câu dừng lơ lửng trên Rê (kết nửa)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n34
  cau: "Câu 2 (ô 9–16): giai điệu như câu 1, chỉ khác ở hai ô cuối; tay trái chuyển động nhiều hơn; kết trọn ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n35
  cau: "Đoạn B, câu 3 (ô 17–24): mở đầu ở nốt Si cao, sang Rê trưởng với Đô♯ ở cả hai tay; chuỗi móc đơn đi lên ở ô 21 là cao trào nhỏ của bài; kết ở ô 24."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n36
  cau: "Câu 4 (ô 25–32): nốt Rê – Sol của ô 1 trở lại trong dạng mới; chuỗi móc đơn ở ô 29 dẫn về kết ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n37
  cau: Bảng cấu trúc, câu 3 "chuyển sang Rê trưởng (có Đô♯)"; câu 4 "về lại Sol trưởng (tay trái đã có Đô♮ ở ô 24)".
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n38
  cau: "Bảng cấu trúc, câu 1: ô 1–4 như câu hỏi, ô 5–8 đi xuống từng bậc và dừng lơ lửng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n39
  cau: Đoạn A chỉ khép lại bằng kết trọn ở ô 16; đừng làm ô 8 "kết" mạnh như ô 16.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n40
  cau: "Cả bài chỉ dùng vài ý: môtip đi lên của ô 1, chuỗi móc đơn đi xuống của ô 5–6, và chuỗi móc đơn đi lên dẫn tới kết (ô 21, ô 29)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n42
  cau: Nốt nhạc của khuông theo ấn bản Bach-Gesellschaft (1894), bỏ các dấu trang trí; số ngón là gợi ý của trang; ô 1–8 là câu 1, ô 9–16 là câu 2; hết ô 16 thì nhắc lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n44
  cau: "Chỗ khó: nhảy quãng tám tay phải (Sol cao xuống Sol) ở ô 4 và 12."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n45
  cau: "Chỗ khó: đổi thế tay ở ô 3, 7, 15 (Mi rồi Đô ở ô 3; Fa♯ nằm dưới thế tay ở ô 7 và 15)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n47
  cau: Tay phải chạy móc đơn khi tay trái giữ nốt dài; ở ô 8 và 12 thì tay trái chạy móc đơn.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n48
  cau: Hóa biểu chỉ có Fa♯; Đô♯ xuất hiện ở ô 20–23, rồi Đô♮ trở lại ở tay trái ô 24.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n49
  cau: "Bước nhảy tay trái ở ô 8: Rê xuống Rê thấp rồi vọt lên Đô (quãng bảy) trong thời gian của móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n53
  cau: "Bài tập 2: ô 2 chính là kiểu chuyển động của ô 8 trong bài; ô 3–4 đổi vai."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n57
  cau: Minuet là điệu nhảy vừa phải, không phải bài chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n61
  cau: Bản gốc không ghi sắc thái.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n63
  cau: Ấn bản Bach-Gesellschaft in dấu láy (mordent) ở nốt Đô của ô 3 và ô 5 (và ô 11, 13), một appoggiatura Si trước nốt La ở ô 8, và một láy rền ngắn ở ô 30.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n69
  cau: "Cùng cuốn sổ tay 1725: Minuet Fa trưởng (BWV Anh. 113) và Musette Rê trưởng (BWV Anh. 126)."
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n72
  cau: "Câu hỏi 1: ô 8 kết nửa, dừng lơ lửng trên Rê, hợp âm át (không phải kết trọn ở Sol trưởng, không chuyển hẳn sang Rê trưởng)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n73
  cau: "Câu hỏi 1, giải thích: câu 1 dừng lơ lửng ở ô 8; đoạn A chỉ khép lại bằng kết trọn ở ô 16."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n74
  cau: 'Câu hỏi 2: chữ "Anh." trong BWV Anh. 114 là phụ lục (Anhang) của danh mục Bach, nơi xếp các tác phẩm còn nghi vấn (không phải bài do Anna Magdalena sáng tác hay bản soạn lại cho harpsichord).'
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n75
  cau: "Câu hỏi 2, giải thích: danh mục BWV (1950) xếp cặp minuet vào phụ lục; từ cuối thập niên 1970, sau nghiên cứu của Hans-Joachim Schulze, giới nghiên cứu ghi tên Christian Petzold."
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n79
  cau: "Nguồn: bài của Hans-Joachim Schulze trên Bach-Jahrbuch 65 (1979), tr. 45–64, là bằng chứng chính cho việc ghi tên Petzold."
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n80
  cau: "Nguồn: Neue Bach-Ausgabe, tập V/4 (Bärenreiter, 1957, biên tập Georg von Dadelsen): hai cuốn sổ tay của Anna Magdalena Bach."
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n81
  cau: "Nguồn: ấn bản Bach-Gesellschaft (1894), bản dàn trang công cộng của Mutopia Project: nguồn của đoạn nhạc trên trang."
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n27
  cau: Nghe ít nhất hai bản (harpsichord hay clavichord, và piano); mỗi lần nghe chú ý một điều (nhịp nhảy, phát âm, tay trái, nhắc lại).
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol
  id: n26
  cau: Câu nhạc trên harpsichord được "nói" bằng phát âm và nhịp điệu; trên piano, giữ sự rõ ràng đó trước khi nghĩ đến sắc thái.
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol
  id: n43
  cau: Hợp âm đầu bài ở tay trái dùng ngón 5-3-1; ở ô 13–14, ngón 5 trượt từ Fa♯ lên Sol (ổn với cách phát âm hơi tách).
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol-thu
  id: n1
  cau: Đây là bài thứ hai của cặp minuet trong cuốn sổ tay năm 1725 của Anna Magdalena Bach, đi liền sau Minuet Sol trưởng (bài số 5, ngay sau bài số 4).
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol-thu
  id: n2
  cau: Cùng nhịp 3/4, cùng 32 ô nhịp với Minuet Sol trưởng.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n4
  cau: Trong giọng thứ, bè trầm đi xuống từng bậc, nốt Fa♯ kéo về Sol.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n5
  cau: "Bốn ô đầu, tay trái đi xuống Sol – Fa – Mi♭ – Rê, ba nốt đầu là nốt trắng chấm dôi: bốn bậc từ chủ âm xuống át âm."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n6
  cau: Petzold chưa từng biết cây đàn piano (ông viết cho harpsichord).
  loai: lich-su
- trang: piano/tac-pham/minuet-sol-thu
  id: n7
  cau: Giọng thứ có những nốt riêng (Fa♯, Mi♮) và một đường đi hòa âm riêng.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n8
  cau: Hóa biểu chỉ có Si♭ và Mi♭; gần như mỗi lần nhạc dừng trên hợp âm Rê hay kết ở Sol thứ đều có Fa♯, cảm âm nằm dưới chủ âm nửa cung.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n10
  cau: Bản gốc không có một dấu luyến nào.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n11
  cau: Bài cùng nằm trong sổ tay 1725, cùng được xác định là của Christian Petzold chứ không phải của Bach.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol-thu
  id: n13
  cau: Trong tổ khúc cho harpsichord của Petzold, hai minuet hợp thành một chương, bên cạnh các chương prelude, allemande, courante, sarabande, bourrée, gigue và passepied (kèm trio), và được chơi theo thứ tự Sol trưởng, Sol thứ, rồi Sol trưởng lần nữa (da capo).
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n14
  cau: Minuet thứ hai, cùng chủ âm nhưng khác màu, giữ vai trò tương phản mà về sau người ta gọi là trio.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol-thu
  id: n16
  cau: "Harpsichord: dây được gảy, to nhỏ không đổi theo lực ngón; piano hiện đại dễ to nhỏ."
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n19
  cau: Igor Kipnis đã thu cặp minuet; Mahan Esfahani thu cặp minuet trên clavichord.
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n21
  cau: Cuối đoạn A sáng hẳn (đoạn A kết ở Si♭ trưởng).
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n22
  cau: "Theo dõi khi nghe, câu 1 (ô 1–8): giai điệu đi xuống từ Si♭ cao rồi nhảy xuống Rê; tay trái đi xuống Sol – Fa – Mi♭ – Rê; câu dừng lơ lửng trên hợp âm Rê (kết nửa)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n23
  cau: "Câu 2 (ô 9–16): mở đầu như câu 1, rồi rẽ sang Si♭ trưởng; màu sáng lên và kết trọn ở Si♭ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n24
  cau: "Bảng cấu trúc, câu 1: Sol thứ, kết nửa ở ô 8 (dừng trên hợp âm Rê); giai điệu và bè trầm cùng đi xuống; tay trái Sol – Fa – Mi♭ (nốt trắng chấm dôi) – Rê; Fa♯ đầu tiên ở tay trái ô 7; ô 4 và 8 tay phải giữ, tay trái chạy."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n25
  cau: "Bảng cấu trúc, câu 2: sang Si♭ trưởng, giọng trưởng song song của Sol thứ; kết trọn ở ô 16; ô 9–12 như ô 1–4 (tay trái ô 12 có Si♮); ô 13–16 hợp âm Sol – Đô – Fa – Si♭ theo vòng quãng năm."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n26
  cau: "Câu 3 (ô 17–24): giai điệu leo lên Si♭ cao, dừng ở Fa trưởng (ô 20), rồi chuỗi móc đơn đi lên ở ô 21 đưa về Si♭ trưởng (ô 24); Mi♮ cuối ô 17 dẫn sang Fa trưởng; ô 18 hai tay đi ngược chiều; Si♭ cao trở lại ở ô 19."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n27
  cau: "Câu 4 (ô 25–32): màu tối trở lại, qua Đô thứ; nốt nhảy zíc zắc ở ô 27; dừng trên hợp âm Rê (ô 28); ô 29 gam Sol thứ giai điệu đi lên Rê – Mi♮ – Fa♯ – Sol – La – Si♭; láy ngắn ở ô 31; kết trọn ở Sol thứ (ô 32)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n28
  cau: "Dấu hóa bất thường ở câu 4: Si♮ (ô 25), Fa♯ (ô 27, 28, 29, 31), Mi♮ (ô 28, 29)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n29
  cau: Đoạn B nhắc lại (ô 17–32); nếu bản thu chơi trọn cặp, Minuet Sol trưởng trở lại sau đó.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n32
  cau: Nốt nhạc của khuông theo ấn bản Bach-Gesellschaft (1894), qua bản dàn trang công cộng của Mutopia Project; dấu láy trên ở ô 8 theo bản ấy; số ngón là gợi ý của trang.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n33
  cau: Câu 2 (ô 9–16) mở đầu giống hệt câu 1 rồi rẽ sang Si♭ trưởng; hết ô 16 thì nhắc lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n34
  cau: Si♭ cao (Si♭5) nằm ngay trên dòng kẻ phụ thứ nhất.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n36
  cau: "Chỗ khó: La5 và Si♭5 nằm ngoài khuông; ô 2 nhảy La → Rê, ô 3 nhảy Sol cao → Sol thấp (ô 1–3, 9–11)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n37
  cau: "Chỗ khó: một tay giữ, một tay chạy (ô 3–4, 8, 11–12)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n38
  cau: "Chỗ khó: nốt nhảy zíc zắc ở ô 27 (Sol – Rê, Fa♯ – Đô, Sol – Si♭); nghe như hai bè: bè dưới Sol – Fa♯ – Sol, bè trên Rê – Đô – Si♭."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n39
  cau: Gam đi lên ở ô 29 là gam thứ giai điệu (Mi♮ và Fa♯ cùng được nâng); ngón gợi ý Rê 1, Mi 2, Fa♯ 3, luồn ngón cái sang Sol 1, La 2, Si♭ 3.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n40
  cau: Láy trên ở ô 8, 9, 15, 31 và láy dưới ở ô 13, 22.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n42
  cau: Sáu nốt đi lên của ô 29 trên bàn phím có hai phím đen Fa♯ và Si♭, còn Mi♮ là phím trắng.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n44
  cau: "Bài tập 1: ô 1–4 cùng một thế tay năm ngón, chỉ đổi Si thành Si♭ ở cả hai tay là màu đổi từ trưởng sang thứ; ô 5–7 Fa♯ là cảm âm, kéo lên Sol."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n45
  cau: "Bài tập 2: ô 1 tay phải chạy, tay trái giữ; ô 2 đổi vai, giống kiểu ô 4 của bài; ô 3 tay phải chạy xuống tới Fa♯ trên nền Rê của tay trái, rồi về Sol ở ô 4."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n47
  cau: "Bài tập 3: nốt đen tách nhẹ (nhấc ngón sớm, không bật), nhóm móc đơn trong dấu luyến chơi liền và nhẹ dần; ô 3 là cách chơi viết ra của dấu láy trên ở ô 4; ô 4 giống chỗ dừng ở ô 8 của bài."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n48
  cau: Láy trên (theo cách đọc quen thuộc thời Bach) bắt đầu từ nốt trên, đúng vào phách, nhanh và nhẹ, rồi ngân nốt chính; ở ô 8 là Si♭ – La – Si♭ – La rồi ngân La.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n49
  cau: Ở ô 9, nốt Si♭ vừa vang ngay trước nốt La có láy, nên chỉ cần nối sang chứ không đánh lại.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n50
  cau: "Láy dưới là chính – dưới – chính: Fa – Mi♭ – Fa ở ô 13."
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n56
  cau: Bản Bach-Gesellschaft không có dấu luyến hay dấu chấm nào; nhiều ấn bản cho người học thêm vào theo ý người biên tập.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n61
  cau: Các ấn bản khác nhau ở chi tiết nốt hoa mỹ.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n66
  cau: Mozart Minuet Fa trưởng K. 2 ghé qua Sol thứ ở đoạn giữa.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n67
  cau: Schumann Album für die Jugend có Wilder Reiter ở La thứ.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n69
  cau: "Câu hỏi 1: đoạn A (ô 1–16) kết ở Si♭ trưởng, giọng trưởng song song của Sol thứ (không phải Sol thứ hay Rê trưởng)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n70
  cau: "Câu hỏi 1, giải thích: câu 1 chỉ dừng lơ lửng trên hợp âm Rê (ô 8); câu 2 rẽ sang Si♭ trưởng và kết trọn ở ô 16; Sol thứ chỉ trở về hẳn ở cuối đoạn B."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n71
  cau: "Câu hỏi 2: bài có Fa♯ vì Fa♯ là cảm âm, bậc 7 được nâng lên nửa cung để kéo mạnh về chủ âm Sol (không phải lỗi chép tay, không phải chuyển hẳn sang Sol trưởng)."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n72
  cau: "Câu hỏi 2, giải thích: gam thứ hòa âm và gam thứ giai điệu nâng bậc 7; ở ô 29, gam thứ giai điệu đi lên còn nâng cả bậc 6 thành Mi♮."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n73
  cau: "Câu hỏi 3: dấu láy trên ở nốt La ô 8 chơi bắt đầu từ nốt trên Si♭, đúng vào phách, nhanh và nhẹ, rồi ngân La (không bắt đầu từ La trước phách, không láy đều suốt ba phách); giải thích: đó là cách viết ra ở bài tập 3."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n74
  cau: "Câu hỏi 4: theo tổ khúc của Petzold, cặp minuet được chơi Sol trưởng, Sol thứ, rồi Sol trưởng lần nữa; hai bài hợp thành một chương, minuet Sol thứ là phần tương phản ở giữa, như trio về sau."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n75
  cau: "Nguồn: bài của Hans-Joachim Schulze, Bach-Jahrbuch 65 (1979), tr. 45–64, bằng chứng chính cho việc ghi tên Petzold."
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n76
  cau: "Nguồn: Neue Bach-Ausgabe, tập V/4 (Bärenreiter, 1957, biên tập Georg von Dadelsen)."
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n77
  cau: "Nguồn: ấn bản Bach-Gesellschaft (1894), bản dàn trang công cộng của Mutopia Project (người nhập: Allen Garvin)."
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n30
  cau: Mọi Fa♯, Mi♮ và Si♮ là bản đồ chuyển giọng của bài; khoanh chúng bằng bút chì.
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol-thu
  id: n35
  cau: "Ngón và thế tay: ô 1 ngón 5 trên Si♭ cao; ô 3 cả bàn tay rơi xuống một quãng tám để ngón 1 bắt đầu Sol – La – Si♭ – Đô; ô 5 dời tay lên, ô 7 dời lại xuống để láy ở ô 8 dùng ngón 2–3; tay trái ngón 2-3-4 cho ba nốt dài, ô 4 và 8 nhảy Rê3 lên Rê4 bằng ngón 5 rồi 1."
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol-thu
  id: n41
  cau: Cách tập các chỗ khó (khoanh dấu hóa, đọc to tên nốt, thuộc nốt vạch phụ, tập riêng bước nhảy, đếm to, tập từng bè, học không láy trước).
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-minuet-k2
  id: n1
  cau: Minuet K. 2 có 24 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n2
  cau: Mozart nghĩ ra bài khi mới năm, sáu tuổi.
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n3
  cau: Bài được ghi lại trong cuốn sổ nhạc của chị gái Nannerl.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n4
  cau: Bài chỉ có hai bè, không có một hợp âm nào.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n5
  cau: Bài có câu nhạc cân đối, nốt nghịch đặt đúng phách mạnh, và một bất ngờ nhỏ (kết lừa) ngay trước khi kết.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n6
  cau: "Đây không phải bản phối giản lược: đó là toàn bộ những gì Mozart viết."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n9
  cau: Bài chia thành những câu 4 ô.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n10
  cau: "Tay trái chỉ chơi một nốt mỗi lúc nhưng là một giọng thật: đi lên, đứng yên, rơi xuống quãng tám ở chỗ kết."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n12
  cau: Sáu lần trong bài, phách 1 là một nốt nghịch ngân hai phách rồi mới đi tới nốt hợp âm.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n13
  cau: Bài ghé qua Sol thứ, có một kết lừa và một dấu ngân.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n15
  cau: Leopold Mozart là nhạc công violin và nhà soạn nhạc trong dàn nhạc của Tổng giám mục Salzburg.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n16
  cau: Một ghi chú nổi tiếng kể rằng Wolfgang học một minuet và trio trong nửa giờ, lúc chín giờ rưỡi tối ngày 26 tháng 1 năm 1761, một ngày trước sinh nhật năm tuổi.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n17
  cau: Năm 1756, năm Wolfgang ra đời, Leopold xuất bản một cuốn sách dạy violin rất có tiếng.
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n18
  cau: Leopold tự dạy đàn phím cho hai con.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n19
  cau: Năm 1759, Leopold làm cho Nannerl, khi ấy sắp tròn tám tuổi, một cuốn sổ nhạc chép tay gồm những minuet và bài nhỏ, xếp dần từ dễ đến khó; ngày nay gọi là Nannerl Notenbuch.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n20
  cau: Leopold dùng chính cuốn sổ ấy để dạy cậu em Wolfgang, kém chị gần năm tuổi, và ghi bên lề những gì con trai học được.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n21
  cau: Ít lâu sau, Wolfgang tự nghĩ ra những bài nhỏ, chúng được chép vào cùng cuốn sổ; những bài đầu tiên ra đời trong năm 1761.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n22
  cau: Minuet K. 2 được ghi ngày tháng 1 năm 1762, ở Salzburg; Mozart sinh ngày 27 tháng 1 năm 1756, nên khi ấy cậu vừa hoặc sắp tròn sáu tuổi.
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n23
  cau: Có lẽ cậu chưa tự viết nhạc ra giấy được; nhiều khả năng Leopold đã ghi lại những gì con trai chơi.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n24
  cau: "Phong cách galant giữa thế kỷ 18: câu ngắn, giai điệu dễ hát, bè trầm giản dị."
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-minuet-k2
  id: n25
  cau: Về sau nhiều trang bị tách khỏi cuốn sổ.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n26
  cau: Minuet K. 2 được in lần đầu năm 1828, trong cuốn tiểu sử Mozart của Georg Nikolaus Nissen, người chồng sau của Constanze, vợ góa Mozart.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n27
  cau: Chữ K. (hay KV) chỉ danh mục tác phẩm Mozart do Ludwig von Köchel lập năm 1862.
  loai: danh-muc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n29
  cau: Bài viết cho đàn phím của thời ấy, harpsichord hoặc clavichord.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n30
  cau: Bản thu trên piano của Alessandro Deljavan, trong album dành cho sổ nhạc của Nannerl.
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n31
  cau: Cả bài chỉ dài chừng một phút.
  loai: so-lieu
- trang: piano/tac-pham/mozart-minuet-k2
  id: n34
  cau: "Theo dõi khi nghe, đoạn A (ô 1–8): cặp móc đơn đi lên rồi rơi xuống hai nốt đen, ba lần liền, mỗi lần thấp hơn; ô 5–8 đi lên và dừng lơ lửng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n35
  cau: "Đoạn B nửa đầu (ô 9–12): màu tối hẳn đi, nhạc sang Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n36
  cau: "Đoạn B nửa sau (ô 13–16): cùng hình giai điệu, tiếp tục đi xuống từng bậc và về Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n37
  cau: "Chủ đề trở lại (ô 17–20): giai điệu mở đầu, nhưng đến ô 20 nhạc rẽ sang hợp âm Rê thứ và dừng ở dấu ngân; kết (ô 21–24): chủ đề thêm một lần, kết trọn ở Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n38
  cau: "Bảng cấu trúc, câu 1 (ô 1–4): môtip một ô: hai móc đơn đi lên quãng ba, rơi xuống quãng sáu, rồi hai nốt đen cùng cao độ; môtip vang ba lần, mỗi lần thấp hơn; ô 4 nốt treo Mi trên bè trầm Fa."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n39
  cau: "Câu 2 (ô 5–8): Fa trưởng; kết nửa ở ô 8 (dừng trên hợp âm Đô); giai điệu đi lên từ Đô giữa; chùm ba móc đơn ở ô 7; tay trái giữ nốt Đô."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n40
  cau: "B nửa đầu (ô 9–12): sang Sol thứ (Mi♭, Fa♯); hình nốt của ô 1 trong màu thứ, mỗi ô thấp hơn một bậc; nốt treo Fa♯ ở ô 12."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n41
  cau: "B nửa sau (ô 13–16): về Fa trưởng (Mi♮ ở ô 15); chuỗi tiếp tục đi xuống; ô 16 khép lại giống ô 4."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n42
  cau: "A trở lại (ô 17–20): Fa trưởng, kết lừa ở ô 20; giai điệu ô 1–4; bè trầm mở đầu bằng La thay cho Fa; ở ô 20 bè trầm đi tới Rê, có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n43
  cau: "Kết (ô 21–24): Fa trưởng, kết trọn; chủ đề lần cuối, khép lại như ô 4."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n44
  cau: Cả bài dựng từ một môtip duy nhất và một kiểu kết duy nhất (nốt nghịch ở phách 1, nốt giải ở phách 3).
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n46
  cau: Nốt nhạc của khuông theo ấn bản Breitkopf & Härtel (1878), qua bản dàn trang công cộng của Mutopia Project; dấu luyến theo bản ấy; hết ô 8 thì nhắc lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n48
  cau: Tay trái ô 1–3 đi lên Fa – La – Si♭ – Đô bằng ngón 5-3-2-1, rồi rơi xuống một quãng tám.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n49
  cau: "Chỗ khó: cặp móc đơn luyến rồi rơi quãng sáu (ô 1–3)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n50
  cau: "Chỗ khó: nốt treo ở phách 1 (ô 4, 8, 12, 16, 20, 24); ở các ô này tay trái đi xuống (trừ ô 20)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n51
  cau: "Chỗ khó: chùm ba ở ô 7 (hai ô trước là cặp móc đơn, ô 7 có ba nốt trong một phách)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n52
  cau: "Chỗ khó: tay trái rơi quãng tám ở ô 3, 4, 8 (Đô4 xuống Đô3, Fa3 xuống Fa2) trong thời gian một nốt đen."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n53
  cau: "Chỗ khó: đổi thế tay phải giữa ô 4 và ô 5, từ quanh Fa4 xuống Đô giữa."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n54
  cau: "Chỗ khó: hóa biểu chỉ có Si♭; Mi♭ và Fa♯ xuất hiện ở ô 9–12, rồi Mi♮ trở lại."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n58
  cau: "Bài tập 2: ba ô đầu chính là ba chỗ kết của bài (ô 4, ô 8, ô 12); ô cuối là cùng động tác ở Rê thứ."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n60
  cau: "Bài tập 3: ô 1 và 2 là ô 5 và ô 7 của bài; ô 3–4 là cùng hình ấy cao lên một bậc."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n64
  cau: Bản gốc không ghi tốc độ.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n66
  cau: Bản Breitkopf chỉ ghi dấu luyến cho cặp móc đơn và cho nốt treo cùng nốt giải của nó; các nốt đen còn lại không có dấu gì.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n67
  cau: 'Daniel Gottlob Türk, trong sách dạy đàn phím năm 1789, viết rằng nốt không đánh dấu được chơi "theo cách thông thường": nhấc ngón sớm hơn trọn giá trị một chút.'
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n70
  cau: Bản Breitkopf in dấu ngân ở ô 20; nếu bản của bạn không có, vẫn nên thở nhẹ ở đó trước khi chủ đề trở lại.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n71
  cau: "Ở ô 20, tai chờ hợp âm Fa trưởng thì bè trầm lại đi tới Rê: một kết lừa; dấu ngân cho người nghe khoảnh khắc nhận ra bất ngờ ấy."
  loai: quy-tac
- trang: piano/tac-pham/mozart-minuet-k2
  id: n72
  cau: Bản gốc không có nốt hoa mỹ; thêm một láy nhỏ ở lần nhắc lại là tùy chọn; không dùng bàn đạp.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n75
  cau: "Cùng cuốn sổ nhạc: Andante Đô trưởng K. 1a, Allegro Si♭ trưởng K. 3, Minuet Fa trưởng K. 4 và K. 5, đều có trong tập Wiener Urtext ở trên."
  loai: danh-muc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n78
  cau: "Câu hỏi 1: Minuet K. 2 được ghi ngày tháng 1 năm 1762, ở Salzburg, khi Mozart khoảng sáu tuổi (không phải 1756 hay 1764)."
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n79
  cau: "Câu hỏi 1, giải thích: danh mục Köchel ghi tháng 1 năm 1762; nhiều khả năng Leopold chép lại, vì cậu bé chưa tự viết nhạc ra giấy."
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n80
  cau: "Câu hỏi 2: ô 20 là một kết lừa: bè trầm đi tới Rê thay vì Fa, kèm dấu ngân (không chuyển hẳn sang Sol thứ, không có láy rền)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n81
  cau: "Câu hỏi 2, giải thích: tai chờ hợp âm Fa trưởng nhưng nghe Rê thứ, nên chủ đề được chơi thêm một lần (ô 21–24) để kết trọn."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n83
  cau: "Câu hỏi 4: đoạn B (ô 9–16) đi qua Sol thứ rồi về Fa trưởng; Mi♭ và Fa♯ báo hiệu Sol thứ ở ô 9–12; Mi♮ ở ô 15 đưa bài về Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n84
  cau: "Nguồn: Köchel-Verzeichnis trực tuyến, mục KV 2: ngày tháng, các nguồn chép tay, bản in đầu tiên năm 1828; Neue Mozart-Ausgabe IX/27/1 (Bärenreiter, 1982, Wolfgang Plath)."
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n85
  cau: "Nguồn: Mozarts Werke, Serie XXII (Breitkopf & Härtel, 1878), bản dàn trang của Mutopia; Wiener Urtext UT 50262 (Ulrich Leisinger); Türk, Klavierschule (1789); Wikipedia Nannerl Notenbuch; IMSLP; tài liệu tham khảo."
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n86
  cau: 'Nguồn: PTNA Piano Encyclopedia, mục "Menuet F-Dur K2": phân tích hình thức và các nốt treo.'
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n69
  cau: Bản gốc không ghi sắc thái; gợi ý sắc thái (mf đoạn A, nhỏ và tối hơn ô 9–12, sáng lại ô 13–16; nốt treo là chỗ đậm nhất).
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-minuet-k2
  id: n74
  cau: Lỗi thường gặp (dính liền hay tách cả cặp móc đơn, nhấn đều ba phách, nốt treo nhỏ hơn nốt giải, chùm ba thành móc đơn chấm dôi, quên Mi♭ và Fa♯ ở ô 9–12 hay mang Fa♯ sang ô 13–14, bỏ dấu ngân, chơi quá nhanh).
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-minuet-k2
  id: n68
  cau: "Điểm xuất phát: nốt đen hơi tách, cặp móc đơn liền, nốt cuối dưới dấu luyến nhẹ đi; link Tạo tiếng đàn."
  loai: khuyen-tap
- trang: piano/tac-pham/musette-re
  id: n1
  cau: "Bài bắt chước tiếng kèn túi: tay trái đập đều quãng tám Rê như ống kèn giữ một nốt trầm, tay phải hát giai điệu ở phía trên."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n2
  cau: Tay trái giữ một nhịp đập quãng tám gần như suốt bài (không phải hợp âm, cũng không phải một bè hát).
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n4
  cau: "Tay phải liên tục chuyển giữa hai vùng: trên cao quanh La5 và ở giữa, ngay trên Đô giữa."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n5
  cau: Ở ô 3–4 và 7–8, hai tay chơi cùng một giai điệu, cách nhau một quãng tám.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n6
  cau: "Bài đầy ý lặp lại: ô 2 giống hệt ô 1, ô 5–8 lặp lại ô 1–4, ô 15–16 lặp lại ô 13–14."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n7
  cau: Trọn bài, kể cả nhắc lại và da capo, chỉ khoảng một phút.
  loai: so-lieu
- trang: piano/tac-pham/musette-re
  id: n8
  cau: Musette vừa là tên một nhạc cụ, vừa là tên một kiểu bản nhạc.
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n9
  cau: Nhạc cụ ấy, gọi đầy đủ là musette de cour, là một loại kèn túi nhỏ của Pháp; người chơi bơm hơi bằng một ống bễ thay vì thổi bằng miệng.
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n10
  cau: Thế kỷ 17–18, musette thịnh hành trong giới cung đình Pháp.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n11
  cau: Như mọi loại kèn túi, musette có những ống kèn chỉ phát một nốt trầm không đổi, vang suốt dưới giai điệu (drone).
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n12
  cau: "Âm nền (pedal point): bè trầm giữ hoặc lặp lại một nốt trong khi phía trên đổi hòa âm; trên đàn phím, các nhà soạn nhạc bắt chước tiếng musette bằng âm nền."
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n13
  cau: Musette (nhạc cụ) bơm hơi bằng ống bễ, thịnh hành ở cung đình Pháp (chỗ sửa).
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n15
  cau: Những bản nhạc mang tên musette thường có tính chất đồng quê và hay nằm trong tổ khúc.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n16
  cau: Bach viết Gavotte II trong English Suite số 3 Sol thứ, BWV 808, có tên phụ "ou la Musette".
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n17
  cau: Gavotte II của BWV 808 có âm nền Sol ở bè trầm.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n18
  cau: "Bài Rê trưởng này: bè trầm không giữ nốt mà đập quãng tám Rê – Rê bằng móc đơn; khi hòa âm đổi, nốt nền đổi: Rê ở đoạn A, La rồi Mi ở đoạn B."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n20
  cau: Bài là số 22 trong cuốn sổ tay thứ hai mà J. S. Bach bắt đầu cho vợ, ca sĩ Anna Magdalena Bach, năm 1725.
  loai: danh-muc
- trang: piano/tac-pham/musette-re
  id: n22
  cau: Ngay trước Musette là một minuet ghi rõ "Menuet fait par Mons. Böhm", tức của Georg Böhm.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n23
  cau: Vài bài trước nữa là những bản hành khúc và polonaise thường được ghi là của Carl Philipp Emanuel Bach, con trai J. S. Bach.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n24
  cau: Nhiều bài trong sổ do chính Anna Magdalena chép, và nhiều bài không ghi tên tác giả.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n25
  cau: Riêng Musette thì không rõ tác giả.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n26
  cau: Thế kỷ 19 in Musette như nhạc của Bach; danh mục BWV xếp nó vào phụ lục (Anhang, Anh.), cùng nhóm với những bài còn nghi vấn.
  loai: danh-muc
- trang: piano/tac-pham/musette-re
  id: n28
  cau: Bản Bach-Gesellschaft không ghi tốc độ, sắc thái hay dấu luyến.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n29
  cau: Bài có trong nhiều album về sổ tay Anna Magdalena và tuyển tập cho người học, trên harpsichord lẫn piano.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n31
  cau: Cùng cuốn sổ tay còn có Aria Sol trưởng, chính là chủ đề của Goldberg Variations.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n33
  cau: "Theo dõi khi nghe, đoạn A (ô 1–8): tay trái đập quãng tám Rê; giai điệu chạy xuống từ La cao, vang hai lần; ô 3–4 hai tay chung một giai điệu; ô 8 kết ở Rê."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n34
  cau: "Đoạn B mở đầu (ô 9–12): bè trầm chuyển lên La; hình Đô♯ – Rê – Mi lặp lại, rồi những bước nhảy La – Mi."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n35
  cau: "Bè trầm Mi (ô 13–18): nền chuyển sang Mi; tay phải nhảy qua lại giữa hai bè, có Rê♯; ô 17 là chuỗi móc kép quanh nốt Mi."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n36
  cau: "Kết đoạn B (ô 19–20): hình Đô♯ – Rê – Mi vang ở trên rồi vọng lại thấp hơn một quãng tám; kết ở La trưởng."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n37
  cau: Đoạn A trở lại (da capo) thường không nhắc lại; bài dừng ở dấu ngân.
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n38
  cau: "Bảng cấu trúc, đoạn A: ô 1–8 có nhắc lại; Rê trưởng; quãng tám Rê (ô 1–2, 5–6); ô 5–8 lặp lại ô 1–4; ô 8 kết ở Rê với dấu ngân, điểm kết của cả bài."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n39
  cau: "Bảng cấu trúc, B phần 1 (ô 9–12): sang La trưởng, quãng tám La; nhảy La – Mi ô 10–11; ô 12 chạy xuống; tay trái dời lên La."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n40
  cau: "Bảng cấu trúc, B phần 2 (ô 13–18): quãng tám Mi, âm nền át của La trưởng; tay phải hai bè Mi – Rê♯ – Mi thấp – Rê (nối sang ô sau); ô 17 móc kép quanh Mi; Rê♯ rồi Rê♮ trong cùng ô 13 và 15; Sol♯ ở ô 14, 16, 18."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n41
  cau: "Bảng cấu trúc, B kết (ô 19–20): kết ở La trưởng; Đô♯ – Rê – Mi ở trên (ô 19) rồi thấp hơn một quãng tám (ô 20), hai tay cùng giai điệu."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n42
  cau: Đoạn B kết ở La trưởng, giọng át của Rê trưởng, nên chơi lại đoạn A từ đầu và kết ở dấu ngân của ô 8.
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n43
  cau: Bản nhạc có thể ghi "D.C." (Da capo, "từ đầu") hoặc "D.C. al Fine", hoặc chỉ có dấu ngân; cách chơi như nhau.
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n45
  cau: 'Âm nền Mi ở ô 13–18 là âm nền át: nhạc "đứng chờ" trên át âm, và tai mong được về chủ âm La.'
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n46
  cau: Nốt nhạc của khuông theo ấn bản Bach-Gesellschaft (1894), qua bản dàn trang công cộng của Mutopia Project; bản ấy không có dấu luyến hay sắc thái; hết ô 8 thì nhắc lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n48
  cau: "Tay phải nhảy hai lần: từ Rê5 xuống Fa♯4 (ô 2 sang ô 3, quãng sáu) và từ Rê4 vọt lên La5 (ô 4 sang ô 5, quãng mười hai)."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n49
  cau: "Chỗ khó: móc kép trên móc đơn (ô 1–2, 5–6): mỗi nốt móc đơn của tay trái ứng với hai nốt móc kép của tay phải."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n50
  cau: "Chỗ khó: hai tay chung giai điệu ở ô 3–4, 7–8, 20."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n51
  cau: "Chỗ khó: hai bè trong tay phải (ô 13–16): Mi5 – Rê♯5 – Mi4 – Rê5, nhảy quãng bảy, có dấu nối sang ô sau; bè trên đi xuống từng nửa cung Mi – Rê♯ – Rê – Đô♯."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n55
  cau: "Dấu hóa ở đoạn B: Rê♯ rồi Rê♮ trong cùng ô 13, 15; Sol♯ ở ô 14, 16, 18; ô 17 Mi – Rê♯ – Đô♯ – Rê♯ hai lần liền."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n58
  cau: "Bài tập 2: mỗi hình nốt vang ở trên (f) rồi được nhắc lại thấp hơn một quãng tám (p), như tiếng vọng: đúng điều xảy ra ở ô 19–20 của bài."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n67
  cau: "Một ý lặp lại có thể chơi như tiếng vọng: lần sau nhỏ hơn; trên harpsichord hai bàn phím, người chơi có thể đổi sang bàn phím kia; trên piano đổi lực tay và màu tiếng."
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n70
  cau: Lần đầu và lần nhắc lại, đi tiếp qua ô 8 mà không dừng; dấu ngân chỉ có hiệu lực ở lần chơi cuối.
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n72
  cau: Không dùng bàn đạp; bản gốc không có nốt hoa mỹ, chơi đúng như viết là hợp phong cách.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n75
  cau: Bach Prelude Đô trưởng BWV 846 kết bằng âm nền át rồi âm nền chủ.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n77
  cau: 'Để nghe: Gavotte II "ou la Musette" trong English Suite số 3 của Bach; danh sách theo cấp: Tác phẩm theo cấp độ.'
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n78
  cau: '"Musette" ban đầu là tên một loại kèn túi nhỏ của Pháp, bơm hơi bằng ống bễ (không phải điệu nhảy nhanh của Ý hay kiểu harpsichord nhỏ).'
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n79
  cau: "Câu hỏi 1, giải thích: bản nhạc mang tên musette bắt chước nhạc cụ ấy, nhất là nốt trầm vang đều dưới giai điệu; trên đàn phím, đó là âm nền."
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n80
  cau: "Câu hỏi 2: ở đoạn B, bè trầm quãng tám đổi từ La (ô 9–12) sang Mi (ô 13–18)."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n81
  cau: "Câu hỏi 2, giải thích: Mi là át âm của La trưởng; âm nền Mi chuẩn bị cho chỗ kết ở La trưởng (ô 20)."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n82
  cau: "Câu hỏi 3: sau đoạn B phải chơi lại đoạn A vì đoạn B kết ở La trưởng; đoạn A trở lại để bài kết ở Rê trưởng, tại dấu ngân của ô 8."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n83
  cau: "Câu hỏi 3, giải thích: đó là lối da capo; khi chơi đoạn A lần cuối, thường bỏ dấu nhắc lại."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n85
  cau: "Nguồn: Neue Bach-Ausgabe, tập V/4 (Bärenreiter, 1957, biên tập Georg von Dadelsen)."
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n86
  cau: "Nguồn: ấn bản Bach-Gesellschaft (1894), bản dàn trang công cộng của Mutopia Project (người nhập: Allen Garvin)."
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n87
  cau: 'Nguồn: Encyclopaedia Britannica và Concise Oxford Dictionary of Music, mục "musette": nhạc cụ và kiểu bản nhạc mang tên ấy.'
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n64
  cau: "Bè trầm: tay trái nhỏ hơn tay phải ít nhất một bậc sắc thái; nốt thấp hơi rõ hơn; chơi hơi tách, nảy nhẹ; ngón cái rơi từ sát phím."
  loai: khuyen-tap
- trang: piano/tac-pham/musette-re
  id: n52
  cau: "Bè trầm quãng tám: đập quãng tám liên tục dễ làm cứng cổ tay, mỏi, to và nặng, hoặc lệch nhịp; bàn tay mở sẵn quãng tám, xoay nhẹ cẳng tay từ ngón 5 sang ngón 1 thay vì nhấc cả tay; tập riêng tay trái với máy đếm nhịp."
  loai: khuyen-tap
- trang: piano/tac-pham/musette-re
  id: n54
  cau: Cách tập các chỗ khó khác (đếm "một – và – hai – và", nhìn trước nốt đích, khoanh dấu hóa, đọc to tên nốt, ngón 3-2-1-2 cho ô 17).
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-album
  id: n1
  cau: Năm 1848, Schumann viết cho các con mình 43 bản nhạc ngắn (Album für die Jugend).
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n4
  cau: Schumann không viết bài tập mà viết những tiểu phẩm có tên gọi, có nhân vật, có cảm xúc.
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n5
  cau: Melodie dạy hát legato trên lớp đệm nhẹ; Wilder Reiter dạy staccato và chuyển giai điệu từ tay phải sang tay trái; Fröhlicher Landmann dạy để tay trái hát, rồi bắt một tay vừa hát vừa đệm.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n7
  cau: Mỗi bài chỉ dài khoảng một phút.
  loai: so-lieu
- trang: piano/tac-pham/schumann-album
  id: n9
  cau: 'Ngày 31 tháng 8 năm 1848, Schumann ghi trong sổ chi tiêu gia đình: "ý tưởng về album cho trẻ em, những bản nhỏ cho Marie".'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n10
  cau: Ngày 1 tháng 9 (1848) là sinh nhật lần thứ bảy của Marie, con gái lớn của Robert và Clara Schumann; quà của bố là một tập bài nhỏ chép tay.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n11
  cau: Những ngày tiếp theo Schumann ghi "rất nhiều bản nhỏ cho trẻ em", đến 9 tháng 9 thì album "gần xong"; vài bài còn được viết thêm trong tháng 9.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n12
  cau: Schumann định đặt tên Weihnachtsalbum für Kinder (Album Giáng sinh cho trẻ em) để in kịp Giáng sinh.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n13
  cau: Nhà Breitkopf & Härtel từ chối in; Julius Schuberth ở Hamburg nhận lời.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n14
  cau: Schuberth đề nghị bỏ chữ "Giáng sinh" để tập nhạc bán được quanh năm.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n15
  cau: Bản in đầu tiên ra tháng 12/1848.
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n16
  cau: Bản in đầu có tranh bìa trong của họa sĩ Ludwig Richter, bốn góc vẽ bốn mùa.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n17
  cau: Trang bìa ghi nhầm "40 bản nhạc" dù tập có đủ 43 bài.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n18
  cau: Trong vòng một năm, nhà xuất bản quảng cáo đã bán gần 2.000 bản.
  loai: so-lieu
- trang: piano/tac-pham/schumann-album
  id: n19
  cau: "Trong một lá thư năm 1848, Schumann phân biệt: Kinderszenen là hồi tưởng của người lớn, viết cho người lớn; album mới hướng về phía trước, dành cho các em nhỏ."
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n20
  cau: Kinderszenen (Cảnh tuổi thơ) viết năm 1838.
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n21
  cau: Phần hai của album khó hơn và mang nhiều màu sắc người lớn hơn.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n22
  cau: Bài số 28, Erinnerung (Kỷ niệm), ghi ngày 4 tháng 11 năm 1847, ngày Mendelssohn qua đời.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n23
  cau: Cùng thời gian đó, Schumann viết Musikalische Haus- und Lebensregeln, một chuỗi câu ngắn gửi người học nhạc.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n24
  cau: Haus- und Lebensregeln được in trên Neue Zeitschrift für Musik năm 1850, rồi in kèm album từ lần in thứ hai (12/1850).
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n25
  cau: Ấn bản năm 1859 in Haus- und Lebensregeln ba thứ tiếng; bản tiếng Pháp do Franz Liszt dịch.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n26
  cau: '"Spiele im Takte!" Chơi đúng nhịp! Lối chơi của một số virtuoso giống như dáng đi của người say.'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n27
  cau: '"Schleppen und Eilen sind gleich große Fehler." Kéo lê và chạy vội là hai lỗi lớn ngang nhau.'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n28
  cau: Hãy cố chơi những bài dễ thật hay và đẹp; như thế tốt hơn chơi bài khó một cách tầm thường.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n29
  cau: '"Es ist des Lernens kein Ende." Việc học không bao giờ kết thúc.'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n31
  cau: Phần một của album gồm số 1–18.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n34
  cau: "Số 1 Melodie, câu a (vang hai lần): giai điệu legato ở tay phải trên lớp móc đơn đều của tay trái, mỗi hơi hai ô; câu dừng lơ lửng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n35
  cau: "Câu b: giai điệu đổi hướng, những mảnh ngắn ngắt bằng dấu lặng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n36
  cau: "Câu a': nốt đầu có thêm quãng ba; lần này câu kết trọn ở Đô."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n37
  cau: Câu b và câu a' lần nữa, kết bài ở Đô trưởng.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n38
  cau: "Số 8 Wilder Reiter, đoạn A (vang hai lần): La thứ, mở bằng nhịp lấy đà; giai điệu staccato ở tay phải, tay trái đánh hợp âm ngắn."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n39
  cau: "Đoạn B: sang Fa trưởng; giai điệu của đoạn A chuyển xuống tay trái, tay phải đánh hợp âm ngắn."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n40
  cau: "Đoạn A trở lại: giai điệu về lại tay phải, ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n41
  cau: "Số 10 Fröhlicher Landmann, câu a (vang hai lần): giai điệu chắc khỏe ở tay trái, tay phải đệm hợp âm nghịch phách."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n42
  cau: "Đoạn b: giai điệu lên vùng cao, tay phải vừa hát ở trên vừa đệm ở dưới, tay trái đi song song bên dưới; hai ô cuối trả giai điệu về tay trái. Đoạn b nhắc lại, kết bài ở Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n43
  cau: "Số 1 Melodie: Đô trưởng, 4/4; câu 4 ô: a (vang hai lần) – b – a' – b – a'; giai điệu ở tay phải legato, tay trái chạy móc đơn đều."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n44
  cau: "Melodie: mỗi câu hai ô một hơi; a' khác a ở nốt đầu (có thêm quãng ba) và ở cách kết: a dừng lơ lửng, a' kết trọn ở Đô."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n45
  cau: "Số 8 Wilder Reiter: La thứ, 6/8, bắt đầu bằng nhịp lấy đà; ba đoạn A (8 ô, nhắc lại) – B (8 ô) – A (8 ô); A giai điệu tay phải, B tay trái ở Fa trưởng, tay kia đánh hợp âm ngắn; giai điệu đoạn B chính là giai điệu đoạn A dời sang Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n46
  cau: "Số 10 Fröhlicher Landmann: Fa trưởng, 4/4, nhịp lấy đà một móc đơn; câu a (4 ô, vang hai lần) – đoạn b (6 ô, vang hai lần); hai ô cuối của b trả giai điệu về tay trái và kết ở Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n47
  cau: Ba bài đều xây từ những câu ngắn, phần lớn 4 ô, nhắc lại và biến đổi.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n52
  cau: "Bài tập 2: ô 1–2 giai điệu tay phải, tay trái hợp âm ngắn; ô 3–4 đổi vai, giai điệu xuống tay trái ở Fa trưởng, đúng như đoạn B của Wilder Reiter."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n53
  cau: "Bài tập 3 là kết cấu của đoạn b trong Fröhlicher Landmann: ngón 5 giữ nốt giai điệu đủ hai phách, ở mf, trong khi ngón 1–3 đánh hợp âm nhỏ, ngắn ở p."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n56
  cau: Chỉ dẫn Nicht schnell ở đầu Melodie nghĩa là "không nhanh", không phải "chậm".
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n58
  cau: Wilder Reiter là hình ảnh một đứa trẻ phi ngựa (tựa gốc trong bản khắc là "Wilder Schaukelpferdreiter").
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n60
  cau: Fröhlicher Landmann là người nông dân đi làm về; giai điệu tay trái ở f, legato.
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n62
  cau: Số 2 Soldatenmarsch (Hành khúc người lính) ở Sol trưởng, nhịp hành khúc với tiết tấu chấm dôi và hợp âm ngắn ở cả hai tay.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n64
  cau: Nhiều người học Soldatenmarsch trước cả Wilder Reiter.
  loai: cap-do
- trang: piano/tac-pham/schumann-album
  id: n65
  cau: Số 16 Erster Verlust (Mất mát đầu tiên) ở Mi thứ, một khúc buồn rất ngắn.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n68
  cau: "Các bài khác của phần một: Trällerliedchen (số 3), Stückchen (số 5), Jägerliedchen (số 7), Volksliedchen (số 9), Kleiner Morgenwanderer (số 17), Schnitterliedchen (số 18); phần hai bắt đầu từ Kleine Romanze (số 19)."
  loai: danh-muc
- trang: piano/tac-pham/schumann-album
  id: n70
  cau: "Cùng ý tưởng: Album cho tuổi trẻ Op. 39 của Tchaikovsky (1878) và tập For Children của Bartók."
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n71
  cau: "Câu hỏi 1: ở đoạn B của Wilder Reiter, giai điệu ở tay trái, chính là giai điệu đoạn A dời sang Fa trưởng; tay phải chỉ đánh hợp âm ngắn."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n72
  cau: 'Câu hỏi 2: chỉ dẫn Nicht schnell ở đầu Melodie nghĩa là "không nhanh", không có nghĩa là "chậm".'
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n73
  cau: "Câu hỏi 3: ở đoạn b của Fröhlicher Landmann, tay phải giữ nốt giai điệu bằng ngón 4–5 trong khi ngón 1–3 đánh hợp âm nhỏ."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n75
  cau: "Mục Nguồn: Ernst Herttrich, lời tựa ấn bản Album für die Jugend op. 68, G. Henle Verlag, 2007 (sổ chi tiêu, lịch sử xuất bản, Haus- und Lebensregeln)."
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n76
  cau: "Mục Nguồn: Bernhard R. Appel, chuyên khảo về Album für die Jugend (1998)."
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n77
  cau: 'Mục Nguồn: Wikipedia "Album for the Young" (danh sách 43 bài và giọng); Robert Schumann, Musikalische Haus- und Lebensregeln (in kèm album từ năm 1850).'
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n78
  cau: "Mục Nguồn: bản dàn trang theo ấn bản Peters (giấy phép CC BY-SA 2.5) tại Mutopia Project."
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n66
  cau: "Erster Verlust: học hát legato trong giọng thứ, không đánh mạnh nốt cao nhất, kết thật nhỏ."
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-album
  id: n74
  cau: "Câu hỏi 4: tập staccato của Wilder Reiter bằng cổ tay, ngón sát phím, tập chậm và nhỏ trước."
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-album
  id: n54
  cau: Kế hoạch 5 tuần, khoảng 30 phút mỗi ngày, với tốc độ máy đếm nhịp từng tuần (tốc độ cuối chỉ là gợi ý).
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n1
  cau: Bài là một giai điệu Sol thứ hát chậm rãi trên nốt Sol trầm ngân dài.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n2
  cau: Bài nằm trong Album cho thiếu nhi Tchaikovsky viết năm 1878 "theo kiểu Schumann".
  loai: nam
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n3
  cau: Bài dài 32 ô nhịp, một giai điệu vang lên ba lần.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n5
  cau: Giai điệu đi chậm, nhiều nốt dài, có nốt nhắc lại dưới dấu luyến.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n6
  cau: Cantabile nghĩa là "như hát".
  loai: dinh-nghia
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n7
  cau: Trên piano, nốt nào cũng tắt dần ngay sau khi đánh.
  loai: dinh-nghia
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n8
  cau: "Tay trái đoạn A: ngón 5 giữ Sol trầm qua nhiều ô (dấu nối), trong khi các ngón khác chơi một giọng giữa có dấu luyến riêng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n9
  cau: Đây là bước đầu để chơi hai bè trong một bàn tay.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n12
  cau: Ở đầu đoạn B, tay phải hát legato trong khi tay trái rải hợp âm staccato.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n13
  cau: "Giai điệu A vang lên ba lần: p, pp, rồi p sau đoạn giữa."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n14
  cau: Album for the Young Op. 39 (1878) là tập 24 bài đơn giản "à la Schumann".
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n16
  cau: Cầu nguyện buổi sáng là bài số 1 của tập.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n17
  cau: 'Giữa tập có nhóm "bài hát nước ngoài": Bài ca Ý (số 15), Bài ca Pháp cổ (số 16), Bài ca Đức (số 17), Bài ca Napoli (số 18).'
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n18
  cau: Tựa tiếng Nga Старинная французская песенка nghĩa là "bài hát Pháp xưa".
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n19
  cau: Chữ песенка là dạng thân mật của "bài hát" (песня), như "bài hát nhỏ".
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n20
  cau: Tchaikovsky dùng lại chủ đề này trong bài hát của những người hát rong (minstrel) ở hồi II vở opera Орлеанская дева (Trinh nữ xứ Orléans).
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n21
  cau: Vở Trinh nữ xứ Orléans viết không lâu sau Album cho thiếu nhi.
  loai: nam
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n22
  cau: Thứ tự các bài trong bản thảo của Tchaikovsky khác bản in đầu tiên ở vài chỗ.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n23
  cau: Bài số 16 đứng thứ 16 trong cả bản in đầu lẫn bản thảo, nên "Op. 39 số 16" là cách gọi chắc chắn.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n24
  cau: Một số bài mang số khác nhau giữa các ấn bản; trong tuyển tập và sách thi bài có thể mang số riêng của cuốn sách.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n26
  cau: Giọng giữa của tay trái đi Si♭ – Đô – Rê – Đô.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n27
  cau: Ở đoạn B, tay trái đổi sang hợp âm rải nảy; giai điệu leo lên điểm cao nhất rồi lắng xuống.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n28
  cau: "Đoạn A (lấy đà và ô 1–8): p; giai điệu vươn từ Rê lên Sol rồi đứng trên Rê, chạm Mi♭; tay trái giữ Sol trầm, giọng giữa Si♭ – Đô – Rê – Đô; ô 7 hợp âm Rê bảy, ô 8 kết ở Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n29
  cau: "Đoạn A lần hai (ô 9–16): pp; nguyên văn như lần đầu; ô 16 dừng trên hợp âm Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n30
  cau: "Đoạn B, nửa đầu (ô 17–20): p; tay trái hợp âm rải staccato (Đô thứ, rồi Rê bảy); giai điệu Sol – Sol – La – Si♭ đi lên; to dần từ ô 20."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n31
  cau: "Đỉnh (ô 21–22): tay trái liền lại; giai điệu lên Rê, rồi Mi♭ – Fa ở ô 22, mf: nốt cao nhất bài."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n32
  cau: "Kết đoạn B (ô 23–24): nhỏ dần, dừng trên hợp âm Rê trưởng (át âm)."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n33
  cau: "Đoạn A trở lại (ô 25–32): p; ở hai ô cuối, tay phải có thêm một bè dưới, bè trầm đi Đô – Rê – Sol về hợp âm Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n34
  cau: "Bảng Cấu trúc, đoạn A (lấy đà, 1–8): p; Sol thứ trên âm nền Sol; Rê bảy (ô 7), kết trọn ở Sol thứ (ô 8); Sol trầm đánh lại ở phách 2 các ô 2, 4, 6."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n35
  cau: "Đoạn A thứ hai (9–16): pp, nhắc lại nguyên văn; ô 16 dừng trên hợp âm Sol thứ nốt trắng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n36
  cau: "Đoạn B (17–24): p; to dần (ô 20–21), mf (ô 22), nhỏ dần (ô 23–24); Đô thứ (ô 17–19), Rê bảy (ô 20), Sol thứ (ô 21), Đô thứ (ô 22), dừng trên Rê trưởng (kết nửa, ô 24); giai điệu lên Fa5 ở ô 22."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n37
  cau: "Đoạn A cuối (25–32): p; ô 31 Đô – Rê ở bè trầm, ô 32 Sol thứ; ô 31–32 tay phải thêm bè dưới Mi♭ – Rê, rồi Si♭."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n38
  cau: Bản nhạc không ghi chậm lại ở cuối.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n39
  cau: "Hình dạng A A B A, mỗi đoạn 8 ô, là kiểu ba đoạn có tái hiện quen thuộc của ca khúc: một giai điệu, nhắc lại, một đoạn tương phản, rồi giai điệu trở về."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n40
  cau: Fa♯ trong hợp âm Rê là cảm âm của Sol thứ.
  loai: dinh-nghia
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n42
  cau: Nốt nhạc, dấu luyến và sắc thái của khuông đoạn A theo bản Mutopia (ấn bản Schirmer, 1904); số ngón là gợi ý của trang.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n43
  cau: "Tay trái viết thành hai bè như trong bản nhạc: bè trên là giọng giữa, bè dưới là nốt Sol ngân; nốt Rê cuối cùng là nhịp lấy đà vào lần nhắc lại, đã ở pp."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n44
  cau: "Tay phải: ngón 1 trên Rê lấy đà, ngón 2 trên Sol, rồi luồn ngón cái sang La; bàn tay nằm yên trong thế La – Mi♭ (ngón 1 đến 5) đến hết ô 6, Mi♭5 luôn là ngón 5."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n45
  cau: Ô 7, sau nốt La dài, ngón 2 vắt qua ngón cái xuống Sol móc kép; Sol ở ô 8 là cùng phím ấy.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n46
  cau: "Tay trái: ngón 5 giữ Sol trầm, chỉ nhấc lên để đánh lại ở phách 2 các ô 2, 4 và 6; ở ô 4 và 6, nốt Sol cuối của giọng giữa trùng phím với nốt Sol trầm đánh lại."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n47
  cau: Ô 7, bản nhạc ghi một dấu to dần – nhỏ dần nhỏ (espressivo) trên nốt Đô của giọng giữa; nốt ấy biến hợp âm thành Rê bảy.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n48
  cau: Ô 8, bè trầm nhảy xuống Sol thấp, staccato.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n49
  cau: "Bốn phím của tay trái ở ô 1: Sol3 giữ bằng ngón 5, Si♭3 – Đô4 – Rê4 bằng ngón 3-2-1."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n53
  cau: "Bài tập 1: ô 1–4 chỉ tay trái, ngón 5 giữ Sol, chỉ đánh lại ở phách 2 của ô 2 và 4 như trong bài; ô 5–8 lặp lại, thêm tay phải hát to hơn một bậc."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n55
  cau: "Bài tập 2: tay trái ngón 5 đánh nốt trầm rồi cả bàn tay nảy lên ba nốt trên (3-2-1); tay phải hát legato bốn ô, to dần đến Mi♭ rồi nhỏ dần; đây là kết cấu nửa đầu đoạn B; không dùng bàn đạp."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n56
  cau: "Bài tập 3 gom các chi tiết giai điệu của bài: nhịp lấy đà quãng bốn, nốt dài rồi nốt nhắc lại, hai móc kép, nốt chấm dôi kép; ở ô 4 Fa♯ kéo qua bảy móc kép và Sol rơi vào móc kép cuối, như La – Sol ở ô 7 của bài."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n59
  cau: Chỉ dẫn tốc độ là Molto moderato, nhịp 2/4.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n61
  cau: Mỗi câu tám ô đi từ nốt lấy đà Rê lên Sol rồi Rê5, chạm Mi♭5 ở ô 3 và 5, rồi đi xuống ở ô 6–7 về Sol.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n63
  cau: "Sắc thái theo bản Schirmer (qua Mutopia): p ở đầu bài; pp cho lần A thứ hai; p ở đầu đoạn B, to dần qua ô 20–21 đến mf ở ô 22, nhỏ dần từ giữa ô 23, rồi p cho lần A cuối."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n65
  cau: Bản nhạc trên Mutopia không ghi bàn đạp.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n68
  cau: Đoạn trích trên trang theo bản Schirmer 1904, không phải bản in đầu tiên; các ấn bản có thể khác ở chỉ dẫn tốc độ (Molto moderato hay Moderato assai), dấu luyến và dấu sắc thái.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n71
  cau: Trong Op. 39, Búp bê ốm là số 6; Bài ca Ý (số 15) và Bài ca Đức (số 17) đứng cạnh bài này.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n74
  cau: "Câu hỏi 1: bài có hình thức A A B A, mỗi đoạn 8 ô, tổng cộng 32 ô; đoạn A vang lên ba lần (p, pp, rồi p sau đoạn B); đoạn B dừng trên hợp âm Rê để đưa về A."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n75
  cau: "Câu hỏi 2: ở đoạn A, ngón 5 tay trái giữ nốt Sol trầm qua các dấu nối, chỉ đánh lại ở phách 2 của ô 2, 4 và 6; ba ngón còn lại chơi giọng giữa."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n76
  cau: 'Câu hỏi 3: "Op. 39 số 16" đáng tin vì bài đứng thứ 16 cả trong bản in Jurgenson 1878 lẫn trong bản thảo; thứ tự trong bản thảo khác bản in ở vài bài khác.'
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n77
  cau: "Câu hỏi 4: ở ô 17–20 tay phải legato, tay trái hợp âm rải staccato."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n78
  cau: "Mục Nguồn: Tchaikovsky Research \"Children's Album\" cho thời gian sáng tác và chép sạch, lời đề tặng, lần in đầu (Jurgenson, Moskva, tháng 10/1878), danh sách 24 bài theo thứ tự bản in và bản thảo, Molto moderato và 32 ô của số 16, việc dùng lại chủ đề trong Trinh nữ xứ Orléans."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n79
  cau: "Mục Nguồn: bản dàn trang công cộng Old French Song, Op. 39 No. 16 tại Mutopia (David McNamara; nguồn Schirmer, 1904; Mutopia-2015/11/27-2080)."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n4
  cau: Toàn bộ nghệ thuật nằm ở chỗ để tay phải hát, còn tay trái với hai bè của nó chỉ thì thầm bên dưới.
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n69
  cau: Danh sách "Lỗi thường gặp" (bảy dòng).
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n60
  cau: "Molto moderato trong 2/4: chậm vừa, mỗi ô vẫn là hai bước; khoảng ♩ = 54–66 là vùng hợp lý."
  loai: khuyen-tap
