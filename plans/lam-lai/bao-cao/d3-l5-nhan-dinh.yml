- trang: nhac-ly/am-hoc
  id: n3
  cau: Âm thanh là dao động truyền đi trong không khí (hay vật chất khác).
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n4
  cau: "Cao độ ứng với tần số (số dao động mỗi giây, đơn vị Hz): cao hay thấp."
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n5
  cau: Độ to nhỏ của âm thanh ứng với biên độ dao động (bảng gọi là "cường độ").
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n6
  cau: Âm sắc, "giọng" riêng của từng nhạc cụ, phụ thuộc vào tỉ lệ các bồi âm trong âm thanh.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n7
  cau: Tai người nghe được khoảng 20 Hz đến 20.000 Hz.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n8
  cau: Phím thấp nhất của piano (La0) khoảng 27,5 Hz, phím cao nhất (Đô8) khoảng 4.186 Hz.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n9
  cau: Dây đàn rung không chỉ cả dây (âm cơ bản) mà đồng thời rung từng nửa dây, một phần ba, một phần tư dây…; mỗi kiểu rung cho tần số gấp 2, 3, 4, 5… lần âm cơ bản.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n10
  cau: Các kiểu rung ấy là bồi âm (harmonics); đánh số từ âm cơ bản thì âm cơ bản là bồi âm số 1, gấp đôi tần số là số 2; một số tài liệu dùng overtones cho các bồi âm trên âm cơ bản và đánh số lệch một (overtone thứ nhất là bồi âm số 2).
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n11
  cau: Ta không nghe các bồi âm như những nốt riêng; chúng hòa vào nhau thành âm thanh ta nghe.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n12
  cau: "Chuỗi bồi âm trên Đô2: bồi âm 1 là Đô2, 2 là Đô3, 3 là Sol3, 4 là Đô4, 6 là Sol4, 8 là Đô5 (nốt gần nhất; 5 và 7 ở hai câu sau)."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n13
  cau: Bồi âm số 5 của Đô2 gần nhất với Mi4 và thấp hơn Mi4 khoảng 14 cent.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n14
  cau: Bồi âm số 7 của Đô2 gần nhất với Si♭4 và thấp hơn Si♭4 khoảng 31 cent.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n15
  cau: "Giữa các bồi âm liên tiếp: 1-2 là quãng 8, 2-3 quãng 5, 3-4 quãng 4, 4-5 quãng 3 trưởng, 5-6 quãng 3 thứ."
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n16
  cau: "Các bồi âm 4, 5, 6 tạo thành hợp âm Đô trưởng (Đô – Mi – Sol) với tỉ lệ tần số 4 : 5 : 6; hợp âm trưởng nằm sẵn trong chuỗi bồi âm của nốt."
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n18
  cau: Theo cách giải thích cổ điển của Helmholtz, hai nốt có tỉ lệ tần số đơn giản thì có nhiều bồi âm trùng nhau, nên tai nghe chúng "hòa" vào nhau.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n19
  cau: "Tỉ lệ tần số của các quãng thuần: 8 đúng 2:1, 5 đúng 3:2, 4 đúng 4:3, 3 trưởng 5:4, 3 thứ 6:5, 2 thứ 16:15."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n20
  cau: Quãng 8 đúng và quãng 5 đúng là thuận tai hoàn toàn.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n21
  cau: "Quãng 4 đúng tùy ngữ cảnh: thuận giữa hai bè trên, nghịch khi có bè trầm."
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n22
  cau: Quãng 3 trưởng và 3 thứ là thuận tai không hoàn toàn.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n23
  cau: Quãng 2 thứ là nghịch tai.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n24
  cau: Quan niệm quãng nào là thuận tai đã đổi nhiều qua lịch sử và khác nhau giữa các nền văn hóa.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n25
  cau: Một số nhà soạn nhạc thế kỷ 20 dùng quãng nghịch tai ngang hàng với thuận tai.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n28
  cau: Sóng sin chỉ có một đỉnh trong phổ vì không có bồi âm; âm nghe trơn, nhạt.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n30
  cau: Piano mẫu cho rất nhiều đỉnh, mạnh yếu khác nhau, và các bồi âm tắt dần theo thời gian khác nhau.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n31
  cau: Huýt sáo cho phổ chỉ có một đỉnh trội, các bồi âm yếu; giọng hát có nhiều bồi âm hơn, và mỗi nguyên âm ("a", "u"…) cho các đỉnh mạnh yếu khác nhau.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n33
  cau: Sáo, ở âm vực trung, gần như chỉ có âm cơ bản và rất ít bồi âm khác, nên nghe tròn và trong.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n34
  cau: Clarinet ở âm vực trầm có các bồi âm lẻ (1, 3, 5, 7) mạnh hơn hẳn các bồi âm chẵn, tạo âm sắc "rỗng" đặc trưng.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n35
  cau: Sáo và oboe chơi cùng một nốt vẫn nghe khác nhau vì tỉ lệ bồi âm khác nhau; âm sắc càng "sáng" thì các bồi âm cao càng mạnh.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n37
  cau: Kèn đồng không có van (như kèn trumpet tự nhiên thời Bach) chỉ chơi được các nốt trong chuỗi bồi âm của ống kèn.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n38
  cau: Người chơi kèn đồng không van đổi nốt bằng cách thay đổi môi.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n39
  cau: Người chơi kèn horn thời Mozart còn đặt bàn tay vào loa kèn để chỉnh cao độ một số nốt.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n40
  cau: "Đàn bầu của Việt Nam chỉ có một dây và được chơi bằng bồi âm: người chơi chạm nhẹ bàn tay vào các điểm chia dây trong khi gảy, còn cần đàn (vòi đàn) uốn cao độ lên xuống."
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n41
  cau: Nghệ sĩ violin, cello, guitar dùng bồi âm (harmonics) để tạo những nốt cao trong veo như tiếng sáo.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n42
  cau: "Nếu lên dây sao cho mọi quãng 5 đều thuần (3:2) rồi đi hết vòng 12 quãng 5, ta không quay về đúng nốt ban đầu: dư ra khoảng 23,5 cent, gọi là dấu phẩy Pythagore."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n43
  cau: Không có cách nào để mọi quãng đều thuần ở mọi giọng; các hệ lên dây của phương Tây là những cách thỏa hiệp.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n44
  cau: "Hệ Pythagore: mọi quãng 5 thuần, quãng 3 trưởng rất chói; dùng ở thời Trung cổ, còn dùng đến thời Phục hưng."
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n45
  cau: "Hệ mean-tone: quãng 3 trưởng thuần; một vài giọng chơi được rất hay, các giọng xa thì không dùng được; dùng ở thời Phục hưng và Baroque."
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n46
  cau: 'Hệ bình quân cải tiến (well temperament): mọi giọng đều chơi được nhưng mỗi giọng có "màu" hơi khác; phổ biến ở thế kỷ 18–19, bắt đầu từ cuối Baroque.'
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n47
  cau: Bình quân luật (Das Wohltemperierte Klavier) của Bach thường được cho là viết cho kiểu lên dây well temperament; Bach dùng hệ chính xác nào thì còn tranh cãi.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n48
  cau: "Hệ bình quân (equal temperament) chia quãng 8 thành 12 nửa cung bằng hệt nhau: mỗi nửa cung 100 cent, tỉ lệ 2^(1/12) ≈ 1,0595."
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n49
  cau: Hệ bình quân là chuẩn cho piano từ khoảng giữa thế kỷ 19 đến nay.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n50
  cau: Hệ bình quân cho phép chơi ở mọi giọng và chuyển giọng tự do, đổi lại mọi quãng (trừ quãng 8) đều lệch một chút so với quãng thuần.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n51
  cau: Quãng 5 bình quân chỉ lệch khoảng 2 cent so với quãng 5 thuần.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n52
  cau: Quãng 3 trưởng bình quân rộng hơn quãng 3 trưởng thuần khoảng 14 cent.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n53
  cau: Quãng 3 trưởng bình quân có tiếng "rung" (phách) mà tai luyện tốt nghe thấy.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n55
  cau: 'Hình "phách" cho thấy: bồi âm 5 của Đô4 là 1308,1 Hz; bồi âm 4 của Mi4 bình quân là 1318,5 Hz; hai bồi âm lệch nhau khoảng 10,4 Hz nên âm lượng dâng lên hạ xuống khoảng 10 lần mỗi giây; ở quãng 3 thuần (5:4) hai bồi âm trùng nhau nên âm thanh đứng yên.'
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n56
  cau: Ca sĩ, nhạc công kèn và nhiều nhạc cụ dây không cố định cao độ nên khi hát hoặc chơi hợp âm họ thường điều chỉnh về phía quãng thuần; đó có thể là một lý do dàn hợp xướng không nhạc đệm hay một dàn dây giỏi nghe "trong".
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n57
  cau: 440 Hz cho La4 được một hội nghị quốc tế ở London khuyến nghị năm 1939.
  loai: nam
- trang: nhac-ly/am-hoc
  id: n58
  cau: 440 Hz trở thành tiêu chuẩn ISO 16.
  loai: danh-muc
- trang: nhac-ly/am-hoc
  id: n59
  cau: 440 Hz là chuẩn phổ biến nhất hiện nay.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n61
  cau: Nhiều dàn nhạc châu Âu lên dây cao hơn một chút, khoảng 442–444 Hz.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n62
  cau: Các nhóm chơi nhạc Baroque bằng nhạc cụ cổ thường dùng 415 Hz, thấp hơn gần đúng nửa cung.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n63
  cau: Khi nghe một bản thu Bach "theo phong cách lịch sử", bạn có thể thấy nó thấp hơn bản nhạc in nửa cung.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n65
  cau: "Bồi âm số 3 của nốt Đô2 là Sol3 (không phải Mi3 hay Đô3): gấp 3 lần tần số, cao hơn bồi âm số 2 (Đô3) một quãng 5."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n66
  cau: "Tỉ lệ tần số của quãng 5 thuần là 3 : 2 (2 : 1 là quãng 8, 5 : 4 là quãng 3 trưởng)."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n67
  cau: Trong hệ bình quân, một nửa cung bằng 100 cent; quãng 8 = 1200 cent chia đều cho 12 nửa cung.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n68
  cau: Âm sắc của nhạc cụ do tỉ lệ các bồi âm quyết định (không phải tần số âm cơ bản hay âm lượng); cùng cao độ, khác tỉ lệ bồi âm thì khác "giọng".
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n69
  cau: Nhạc Baroque bằng nhạc cụ cổ thường lên dây La4 ở 415 Hz (không phải 440 hay 443), thấp hơn chuẩn hiện đại gần đúng nửa cung.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n32
  cau: Với đàn cơ, chơi một nốt trầm rồi một nốt cao và so số đỉnh bồi âm trong phổ.
  loai: khuyen-tap
- trang: nhac-ly/on-tap-1
  id: n4
  cau: Nốt nằm trên dòng kẻ phụ ngay dưới khuông khóa Sol là Đô giữa (C4), không phải Si (B3) hay Rê (D4); Đô giữa cũng là dòng kẻ phụ ngay trên khuông khóa Fa.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n5
  cau: "Trong khóa Fa, khe thứ 3 tính từ dưới lên là Mi (không phải Rê hay Fa); các khe khóa Fa: La – Đô – Mi – Sol."
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n6
  cau: Một ô nhịp 3/4 có thể gồm một nốt trắng và một nốt đen (2 + 1 = 3 phách), không phải hai nốt trắng hay một nốt tròn.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n7
  cau: Nốt trắng chấm dôi nối (dấu nối) với nốt đen dài 4 phách (3 + 1), không phải 3 hay 3 rưỡi.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n8
  cau: Trong một ô nhịp, nốt Fa đầu tiên có dấu thăng (Fa♯); nốt Fa thứ hai cùng quãng tám, không có dấu, trong ô nhịp ấy là Fa♯ (không phải Fa tự nhiên); dấu hóa bất thường còn hiệu lực đến hết ô nhịp, với các nốt cùng vị trí trên khuông.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n9
  cau: Mi♯ trên piano là phím trắng Fa (không phải phím đen); không có phím đen giữa Mi và Fa, Mi nâng nửa cung là Fa.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n10
  cau: Nhịp 6/8 có 6 nốt móc đơn mỗi ô nhịp (không phải 3 hay 8), nhóm thành hai phách lớn.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n11
  cau: A4 có tần số 440 Hz (chuẩn phổ biến); 261,6 Hz là Đô giữa, 880 Hz là A5.
  loai: so-lieu
- trang: nhac-ly/on-tap-1
  id: n12
  cau: "Sol♯ và La♭ là cặp đồng âm khác tên (không phải Sol♯ và La♯, hay Sol và La♭): cùng một phím đen giữa Sol và La."
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n13
  cau: Tám nốt móc kép bằng một nốt trắng (không phải 4 hay 16); nốt trắng = 2 phách, mỗi móc kép = 1/4 phách.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n2
  cau: Nên làm lại bài ôn sau một tuần; trả lời đúng khi đã quên bớt mới là dấu hiệu bạn thật sự nhớ.
  loai: khuyen-tap
- trang: nhac-ly/on-tap-2
  id: n4
  cau: "Gam Rê trưởng có Fa♯ và Đô♯ (không phải Sol♯): Rê – Mi – Fa♯ – Sol – La – Si – Đô♯ – Rê."
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n5
  cau: Mi thứ dùng chung hóa biểu với Sol trưởng (1 dấu thăng).
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n6
  cau: Trong gam La thứ hòa âm, nốt bị nâng là Sol thành Sol♯ (bậc 7), không phải Fa hay Đô.
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n7
  cau: Hóa biểu 5 dấu thăng là của giọng Si trưởng; dấu thăng thứ năm là La♯, nửa cung trên là Si.
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n8
  cau: Hóa biểu 2 dấu giáng là của giọng thứ Sol thứ (giọng trưởng Si♭ trưởng có Sol thứ là giọng thứ song song).
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n9
  cau: Fa – Si là quãng 4 tăng (tritone), 6 nửa cung và 4 tên nốt; không phải 4 đúng hay 5 giảm.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n10
  cau: Mi – Đô (đi lên) là quãng 6 thứ (không phải 6 trưởng hay 5 tăng); đảo của Đô – Mi (3 trưởng) là 6 thứ.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n11
  cau: Trên vòng quãng năm, giọng nằm ngay bên phải (chiều kim đồng hồ) Rê trưởng là La trưởng; lên quãng 5 đúng thì thêm một dấu thăng.
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n12
  cau: "Bậc VII của gam trưởng cách chủ âm nửa cung (dưới chủ âm): đó là cảm âm."
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n13
  cau: Quãng 3 trưởng là thuận tai không hoàn toàn (không phải 5 đúng, là thuận hoàn toàn; không phải 2 thứ, là nghịch); quãng 3 và 6 là thuận tai không hoàn toàn.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n3
  cau: Nên tự làm bài tập viết ra giấy trước khi làm quiz.
  loai: khuyen-tap
- trang: nhac-ly/on-tap-3
  id: n3
  cau: Hợp âm Si – Rê – Fa là hợp âm ba giảm (3 thứ + 3 thứ), không phải thứ hay trưởng.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n4
  cau: Trong Fa trưởng, hợp âm V7 là Đô – Mi – Sol – Si♭ (bậc V là Đô; hợp âm bảy át có quãng 7 thứ), không phải Đô – Mi – Sol – Si hay Sol – Si – Rê – Fa.
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n5
  cau: Hợp âm G7 giải quyết về hợp âm C trong Đô trưởng (V7 → I), không phải F hay Am.
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n6
  cau: Hợp âm Sol trưởng với Rê ở bè trầm là thể đảo 2 (6/4), nốt năm ở bè trầm; không phải đảo 1 hay thể gốc.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n7
  cau: Chuỗi ii – V – I trong Sol trưởng là Am – D – G (bậc ii là La thứ, bậc V là Rê trưởng).
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n8
  cau: Trong giọng La thứ, hợp âm át có nốt đặc biệt Sol♯ (cảm âm từ gam thứ hòa âm), không phải Fa♯ hay Đô♯.
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n9
  cau: Câu nhạc kết bằng IV – I là kết plagal ("Amen"), không phải kết nửa hay kết lừa.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n10
  cau: '"rit." nghĩa là chậm dần (ritardando), không phải nhanh dần hay trở lại tốc độ cũ.'
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n11
  cau: '"sfz" (sforzando) nghĩa là nhấn mạnh rõ (một nốt hay hợp âm nhấn mạnh), không phải rất nhỏ hay ngân dài tùy ý.'
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n12
  cau: Hợp âm bảy có cấu tạo hợp âm giảm + quãng 7 giảm là hợp âm bảy giảm, không phải bảy nửa giảm hay bảy thứ; ví dụ Si – Rê – Fa – La♭.
  loai: dinh-nghia
- trang: nhac-ly/index
  id: n10
  cau: Open Music Theory có phần phân tích nhạc vô điệu tính và lý thuyết tập hợp.
  loai: cau-truc
