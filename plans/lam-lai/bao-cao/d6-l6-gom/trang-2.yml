- trang: nghe-nhac/liszt-liebestraum
  id: n1
  cau: 'Tiêu đề: Liszt, Liebestraum số 3 ("Giấc mơ tình yêu").'
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n2
  cau: 'Mô tả trang: Liszt là một trong những nghệ sĩ piano lừng lẫy nhất thế kỷ 19 và người
    khai sinh thơ giao hưởng; một trong những bản được yêu thích nhất của ông là một bài hát
    không lời.'
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n3
  cau: 'Nhà soạn nhạc: Franz Liszt (1811–1886).'
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n4
  cau: 'Tên đầy đủ: Liebesträume (Những giấc mơ tình yêu), ba notturno cho piano, S. 541;
    số 3 cung La♭ trưởng, O lieb, so lang du lieben kannst.'
  loai: danh-muc
- trang: nghe-nhac/liszt-liebestraum
  id: n5
  cau: 'Sáng tác: ca khúc gốc viết năm 1843, in năm 1847; bản cho piano in năm 1850.'
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n6
  cau: 'Thời kỳ: Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n7
  cau: 'Thể loại: notturno (nocturne) cho piano, chuyển soạn từ một ca khúc của chính Liszt.'
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n8
  cau: 'Độ dài: khoảng 4–5 phút.'
  loai: so-lieu
- trang: nghe-nhac/liszt-liebestraum
  id: n9
  cau: Liszt là một trong những nghệ sĩ piano lừng lẫy nhất thế kỷ 19.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n10
  cau: Liszt là người khai sinh thơ giao hưởng.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n12
  cau: Một trong những bản được yêu thích nhất của Liszt lại là một bài hát không lời.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n13
  cau: Năm 1843 Liszt phổ bài thơ O lieb, so lang du lieben kannst của nhà thơ Đức Ferdinand
    Freiligrath cho giọng hát và piano.
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n14
  cau: 'Dịch tên bài thơ: "Hãy yêu, khi bạn còn có thể yêu".'
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n15
  cau: 'Năm 1850 Liszt in ba Liebesträume cho piano, mỗi bản là một notturno chuyển soạn từ
    ca khúc của mình: hai bản đầu theo thơ Ludwig Uhland, bản thứ ba theo thơ Freiligrath.'
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n16
  cau: Henle gọi bản số 3 là một trong những bản nhạc piano được chơi nhiều nhất.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n17
  cau: 'Bài thơ không kể một giấc mơ ngọt ngào mà là một lời nhắc: hãy yêu thương khi còn
    có thể, vì sẽ đến lúc ta đứng bên nấm mồ mà than khóc.'
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n18
  cau: 'Bài thơ dặn giữ gìn lời nói: một lời cay nghiệt dù không cố ý vẫn khiến người kia
    bỏ đi trong nước mắt.'
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n19
  cau: Liszt ghi tốc độ Poco allegro, con affetto (hơi nhanh, trìu mến).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n20
  cau: Nhịp 6/4, hai phách lớn mỗi ô.
  loai: dinh-nghia
- trang: nghe-nhac/liszt-liebestraum
  id: n21
  cau: Nhiều bản thu chơi chậm và ủy mị hơn thế nhiều.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n23
  cau: Trong nocturne của Chopin (Op. 9 số 2), giai điệu hát ở trên cùng.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n25
  cau: 'Ở đây phần mở đầu đặt giai điệu ở âm vực giữa, như một giọng nam cao: dưới là nốt
    trầm, trên là hợp âm rải nhẹ.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n26
  cau: Hợp âm rải nhẹ chia cho hai tay.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n28
  cau: Giai điệu chuyền qua lại giữa hai tay và phần lớn do ngón cái của hai tay đảm nhận.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n31
  cau: Giai điệu xuất hiện ba lần, mỗi lần một cách phối khác, ngăn cách bởi hai cadenza (chuỗi
    nốt chạy liền không chia vạch nhịp, cho người chơi tự do co giãn).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n32
  cau: Sau cadenza thứ nhất giai điệu trở lại ở Si trưởng, một giọng khá xa La♭ trưởng, với
    chỉ dẫn più animato con passione (sôi nổi hơn, say mê).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n33
  cau: 'Rồi nhạc dồn dập (sempre stringendo), chuyển giọng liên tục để lên cao trào: giai
    điệu vang bằng quãng tám rồi tan thành hợp âm rải.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n34
  cau: Cadenza thứ hai, những chuỗi nốt nhẹ (leggiero) trôi xuống, đưa nhạc về La♭ trưởng
    cho lần hát cuối, dịu dàng (dolce armonioso).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n36
  cau: 'Theo dõi, mở đầu La♭ trưởng: giai điệu ở âm vực giữa, rất êm; dưới là nốt trầm, trên
    là hợp âm rải nhẹ.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n37
  cau: 'Theo dõi, câu tiếp theo: giai điệu phát triển, dâng lên rồi lắng xuống, chuẩn bị cho
    cadenza.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n38
  cau: 'Theo dõi, cadenza thứ nhất: chuỗi nốt chạy liền, nhẹ, không chia vạch nhịp, như bước
    vào giấc mơ.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n39
  cau: 'Theo dõi, giai điệu ở Si trưởng: sáng hơn, say mê hơn (più animato con passione).'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n40
  cau: 'Theo dõi, dồn lên: nhạc nhanh dần, chuyển giọng liên tục; hai tay nhảy những bước
    xa.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n41
  cau: 'Theo dõi, cao trào: giai điệu vang bằng quãng tám, rồi tan ra thành hợp âm rải.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n42
  cau: 'Theo dõi, lắng xuống; cadenza thứ hai: những chuỗi nốt nhẹ (leggiero) trôi xuống.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n43
  cau: 'Theo dõi, trở về La♭ trưởng: giai điệu lại ở giữa; tay trái vắt qua tay phải để chạm
    những hợp âm cao, mỏng.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n44
  cau: 'Theo dõi, kết: giai điệu tan dần, khép lại thật khẽ.'
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n46
  cau: Jorge Bolet có bản thu Liebestraum số 3 cho Decca, cạnh nhiều bản Liszt khác trong
    bộ đĩa Decca của ông.
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n48
  cau: Cây đàn Bechstein Liszt nhận khoảng năm 1881–1882, đặt tại Nhà Liszt ở Weimar, được
    phục chế và chơi lại từ tháng 10/2024.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n51
  cau: Leslie Howard thu âm toàn bộ nhạc piano độc tấu của Liszt cho Hyperion; tập 19 đặt
    Liebesträume cạnh hai tập ca khúc Liszt tự chuyển soạn cho piano.
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n52
  cau: Ca khúc gốc (S. 298) do giọng nữ cao hoặc nam cao hát.
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n56
  cau: Bài ở mức sau Grade 8.
  loai: cap-do
- trang: nghe-nhac/liszt-liebestraum
  id: n57
  cau: Cái khó nằm ở sự cân bằng (ngón cái hát, các ngón khác rải nhẹ), rồi hai cadenza và
    đoạn cao trào với quãng tám ở cả hai tay.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n60
  cau: 'Mục Nguồn: IMSLP, Henle HN 634 và lời tựa, PTNA, bản in đầu (BSB), lời thơ ở Oxford
    Song.'
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n45
  cau: Câu hỏi để nghe chủ động (năm câu).
  loai: khuyen-tap
- trang: nghe-nhac/liszt-liebestraum
  id: n53
  cau: Biết lời rồi, bạn sẽ nghe bản piano khác đi.
  loai: khuyen-tap
- trang: nghe-nhac/liszt-liebestraum
  id: n49
  cau: Nếu tìm được bản thu trên cây đàn này, nghe xem tiếng đàn thế kỷ 19 khác đàn hiện đại
    ở đâu.
  loai: khuyen-tap
- trang: piano/tac-pham/liszt-liebestraum
  id: n1
  cau: 'Tiêu đề: Liszt, Liebestraum số 3, La♭ trưởng.'
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n2
  cau: Giai điệu chậm, hát trên lớp hợp âm rải; giai điệu nằm giữa lớp đệm và do hai ngón
    cái hát.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n3
  cau: Phần đệm chia cho hai tay.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n4
  cau: Bài có hai cadenza và một cao trào quãng tám đòi kỹ thuật thật sự.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n6
  cau: Trong Nocturne Op. 9 số 2 của Chopin, giai điệu nằm trên cùng (phía ngón 5).
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n8
  cau: Ở đây giai điệu nằm giữa, ngón cái hát trong khi các ngón còn lại của cùng bàn tay
    chơi phần đệm.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n13
  cau: Henle gọi bài này là một trong những bản nhạc piano được chơi nhiều nhất.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n14
  cau: Liszt là nghệ sĩ piano lừng lẫy nhất thời ông.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n15
  cau: Liszt chuyển soạn rất nhiều ca khúc, của Schubert, Schumann và của chính ông, cho piano.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n16
  cau: Liebesträume là ba ca khúc của Liszt được viết lại thành ba notturno (nocturne) cho
    piano, in năm 1850.
  loai: nam
- trang: piano/tac-pham/liszt-liebestraum
  id: n17
  cau: Theo Henle, bản piano in lời thơ ở đầu mỗi bài, cho thấy bài thơ vẫn quan trọng cả
    trong bản không lời.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n18
  cau: Ca khúc gốc của bài số 3 viết khoảng cuối năm 1843.
  loai: nam
- trang: piano/tac-pham/liszt-liebestraum
  id: n19
  cau: Ca khúc phổ thơ Ferdinand Freiligrath.
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n20
  cau: 'Bài thơ mở đầu bằng lời giục giã: hãy yêu, chừng nào bạn còn có thể yêu.'
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n21
  cau: Bài thơ là một lời nhắc khẩn thiết chứ không phải một giấc mơ êm ái.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n23
  cau: Liszt ghi Poco allegro, không phải Adagio.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n24
  cau: Henle xếp hai Liebestraum đầu ở mức 6, bài số 3 ở mức 7; bài số 3 khó hơn hai bài kia.
  loai: cap-do
- trang: piano/tac-pham/liszt-liebestraum
  id: n27
  cau: Jorge Bolet là nghệ sĩ gắn bó với nhạc Liszt, có bản thu Liebestraum số 3.
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n28
  cau: Leslie Howard thu âm toàn bộ nhạc piano độc tấu của Liszt.
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n32
  cau: 'Theo dõi, giai điệu lần một (ô 1–23): La♭ trưởng; giai điệu ở âm vực giữa, dưới là
    nốt trầm, trên là hợp âm rải nhẹ.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n33
  cau: 'Theo dõi, cadenza thứ nhất (ô 24–25): chuỗi nốt chạy liền không chia vạch nhịp, mở
    sang một màu khác.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n34
  cau: 'Theo dõi, Più animato (ô 26): giai điệu trở lại, bắt đầu ở Si trưởng; sáng và sôi
    nổi hơn.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n35
  cau: 'Theo dõi, sempre stringendo (từ ô 37): nhạc dồn dần, chuyển giọng liên tục.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n36
  cau: 'Theo dõi, cao trào: giai điệu vang bằng quãng tám, rồi tan thành hợp âm rải.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n37
  cau: Theo dõi, lắng xuống, cadenza thứ hai chuẩn bị cho lần hát cuối.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n38
  cau: 'Theo dõi, Tempo I (ô 61): giai điệu lần cuối ở La♭ trưởng, trở lại tốc độ ban đầu.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n39
  cau: 'Theo dõi, kết: nhạc lắng dần, khép lại ở La♭ trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n40
  cau: 'Bảng cấu trúc, A: ô 1–23, La♭ trưởng, Poco allegro, con affetto.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n41
  cau: 'Đoạn A: giai điệu ở âm vực giữa, phần lớn do ngón cái hát, có chỗ chuyền từ tay này
    sang tay kia; hợp âm rải chia cho hai tay.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n42
  cau: 'Bảng cấu trúc, cadenza 1: ô 24–25 (ô 24 dẫn vào, ô 25 không chia vạch nhịp), chuỗi
    nốt chạy liền dẫn sang giọng mới.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n43
  cau: 'Bảng cấu trúc, A'': ô 26–36, Più animato, bắt đầu ở Si trưởng; giai điệu lần hai,
    sáng hơn, sôi nổi hơn.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n44
  cau: 'Bảng cấu trúc, dồn lên cao trào: ô 37–60, sempre stringendo; chuyển giọng liên tục,
    nhanh dần; ở đỉnh, giai điệu quãng tám rồi tan thành hợp âm rải; cadenza 2 ở cuối đoạn.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n45
  cau: Đoạn 37–60 là đoạn khó nhất bài.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n46
  cau: 'Bảng cấu trúc, A'''': ô 61–85, Tempo I, La♭ trưởng; giai điệu lần cuối, lắng dần đến
    kết.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n47
  cau: 'Ghi chú cách đếm: số ô theo bản in đầu (Kistner 1850, bản Henle dựa vào); mỗi cadenza
    một ô (25, 60), không tính nốt lấy đà; PTNA đặt Più animato ở ô 27.'
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n48
  cau: Si trưởng cùng âm với Đô♭ trưởng, giọng dựng trên bậc III hạ của La♭ trưởng.
  loai: dinh-nghia
- trang: piano/tac-pham/liszt-liebestraum
  id: n49
  cau: Hai hợp âm trưởng cách nhau quãng ba và chỉ chung một nốt (Mi♭) là quan hệ trung âm
    hóa (chromatic mediant); bước chuyển không đi qua giọng át hay hạ át.
  loai: dinh-nghia
- trang: piano/tac-pham/liszt-liebestraum
