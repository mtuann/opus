- trang: nghe-nhac/liszt-liebestraum
  id: n17
  cau: "Bài thơ không kể một giấc mơ ngọt ngào mà là một lời nhắc: hãy yêu thương khi còn có thể, vì sẽ đến lúc ta đứng bên nấm mồ mà than khóc."
  loai: lich-su
  nguon:
    - ten: "Oxford Song (Oxford International Song Festival), O lieb, so lang du lieben kannst! (Liszt): lời Freiligrath và bản dịch tiếng Anh của Richard Stokes"
      link: https://oxfordsong.org/song/o-lieb-so-lang-du-lieben-kannst
    - ten: PTNA Piano Encyclopedia, Liebesträume – 3 notturnos No. 3 As-Dur S.541/3 (bài giới thiệu Ito Moeko; hướng dẫn biểu diễn Ooi Kazurou, 2018)
      link: https://enc.piano.or.jp/en/musics/23749
    - ten: "Liszt, Liebesträume: 3 Notturnos für das Pianoforte, Kistner, Leipzig [1850], bản của Thư viện Quốc gia Bayern (2 Mus.pr. 4748; số bản in 1751/6847, tức lần in lại từ cùng bản khắc, Henle gọi là E 2), số hóa; Notturno số 3 ở tr. 16 (lời thơ) và 17–22. Ảnh trang đọc qua IIIF (bsb11307527_00016–00022), xem 05–06/11/2026. Bản số hóa thứ hai của cùng bản khắc (số bản in 1751/6847, cùng cách xếp trang): bsb00051595; lượt 2 và review D6-L6-gom đếm ô trên bản này (ảnh IIIF bsb00051595_00017–00022)."
      link: https://www.digitale-sammlungen.de/view/bsb11307527
  ket_qua_luot_1: dung
  ghi_chu: '"Die Stunde kommt … Wo du an Gräbern stehst und klagst!"; PTNA: "sings not of romantic love but of human love".'
- trang: nghe-nhac/liszt-liebestraum
  id: n25
  cau: "Ở đây phần mở đầu đặt giai điệu ở âm vực giữa, như một giọng nam cao: dưới là nốt trầm, trên là hợp âm rải nhẹ."
  loai: cau-truc
  nguon:
    - ten: "Liszt, Liebesträume: 3 Notturnos für das Pianoforte, Kistner, Leipzig [1850], bản của Thư viện Quốc gia Bayern (2 Mus.pr. 4748; số bản in 1751/6847, tức lần in lại từ cùng bản khắc, Henle gọi là E 2), số hóa; Notturno số 3 ở tr. 16 (lời thơ) và 17–22. Ảnh trang đọc qua IIIF (bsb11307527_00016–00022), xem 05–06/11/2026. Bản số hóa thứ hai của cùng bản khắc (số bản in 1751/6847, cùng cách xếp trang): bsb00051595; lượt 2 và review D6-L6-gom đếm ô trên bản này (ảnh IIIF bsb00051595_00017–00022)."
      link: https://www.digitale-sammlungen.de/view/bsb11307527
    - ten: Liszt, Consolations and Liebesträume, biên tập và ghi ngón Rafael Joseffy, Schirmer's Library vol. 341 (G. Schirmer, New York, 1895/1915), Internet Archive lisztconsolation00unse, Notturno III ở tr. 34–39 (ảnh PDF)
      link: https://archive.org/details/lisztconsolation00unse
  ket_qua_luot_1: dung
  ghi_chu: "Ô 1–8: giai điệu quanh Đô4–La♭4 (âm vực giọng nam cao), nốt trầm La♭2, Sol2…, móc đơn Mi♭4–Đô5 ở trên. Ca khúc bản 2 viết cho soprano hoặc tenor (IMSLP)."
