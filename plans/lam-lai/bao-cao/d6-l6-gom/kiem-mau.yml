- trang: nghe-nhac/liszt-liebestraum
  id: n51
  cau: Leslie Howard thu âm toàn bộ nhạc piano độc tấu của Liszt cho Hyperion; tập 19 đặt Liebesträume cạnh hai tập ca khúc Liszt tự chuyển soạn cho piano.
  loai: ten
  nguon:
    - ten: "Hyperion, CDA66593 Liszt: The complete music for solo piano, Vol. 19 – Liebesträume & the Songbooks (Leslie Howard; thu 10/1991)"
      link: https://www.hyperion-records.co.uk/dc.asp?dc=D_CDA66593
    - ten: "Hyperion, CDA67414/7 (Vol. 56): \"Leslie Howard's unique survey of Liszt's complete music for solo piano\""
      link: https://www.hyperion-records.co.uk/details/67414.asp
    - ten: "G. Henle Verlag, HN 634: lời tựa (Ernst-Günter Heinemann, 1998), PDF"
      link: https://www.henle.de/media/5f/df/70/1690886072/0634-1690886072-sync.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "người thu âm toàn bộ nhạc piano của Liszt; tập đĩa có Liebesträume đi kèm nhiều bản chuyển soạn ca khúc khác, cho thấy Liszt "hát" trên piano ra sao." Lý do: Hyperion: "complete music for solo piano", Vol. 19 "Liebesträume & the Songbooks" (Buch der Lieder: ca khúc của chính Liszt chuyển soạn cho piano, lời tựa Henle); vế "cho thấy … ra sao" là đánh giá, bỏ. Review D6-L6-gom: lượt 2 dung; đọc lại chữ trang và dữ liệu, khớp câu.'
- trang: piano/tac-pham/chopin-ballade-1
