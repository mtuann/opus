  id: n50
  luot_2: dung
  nguon: []
  ghi_chu: "Tập từng tay, dừng sau cú nhảy, nhóm theo phách, tăng tốc từng nấc là cách dạy phổ biến, không có hại."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n1
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly", "https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf"]
  ghi_chu: "Mutopia (Scholtz): A ô 5–40 và 83–118 tay phải bốn móc kép mỗi phách trên ba nốt tay trái; đoạn giữa Rê♭ trưởng Moderato cantabile, sotto voce. 'như một nocturne' là so sánh."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n3
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly"]
  ghi_chu: "Mutopia: tay phải móc kép, tay trái \\times 4/6 (sáu móc đơn mỗi nửa ô = ba nốt mỗi phách đen)."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n5
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly"]
  ghi_chu: "Mutopia ô 5: gis a gis fisis gis… (vòng quanh Sol♯, có Fa𝄪, Si♯); ô 33–36 gam nửa cung đi xuống; ô 7 lên Si6 (8va)."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n6
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O66/chopin_fantaisie-impromptu/chopin_fantaisie-impromptu.ly"]
  ghi_chu: "Mutopia tay trái ô 5: cis gis' cis e (relative c) = Đô♯3 – Sol♯3 – Đô♯4 – Mi4."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n7
  luot_2: dung
  nguon: ["https://www.golandskyinstitute.org/resources/"]
  ghi_chu: "Golandsky Institute: chuyển động xoay cẳng tay để ngón, bàn tay, cẳng tay đi cùng nhau, tránh căng ngón ('avoiding stretching, a major cause of tension and injury')."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n10
  luot_2: dung
