  ghi_chu: "Golandsky: xoay cẳng tay, không căng ngón. Ngón 5–3–1 rồi 2 vắt qua ngón cái tới Mi4, quay về 1–3 khớp các nốt Đô♯3–Sol♯3–Đô♯4–Mi4–Đô♯4–Sol♯3; là 'một cách bấm' chơi được."
