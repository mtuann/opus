  id: n34
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia ô 138 trở đi: Mi♭ trưởng, tay trái bè trầm kiểu valse (nốt trầm rồi hợp âm), 'leggiero' tay phải ở ô 158."
- trang: piano/tac-pham/chopin-ballade-1
  id: n35
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia: ff ở ô 166, chủ đề 2 ở Mi♭ trưởng."
- trang: piano/tac-pham/chopin-ballade-1
  id: n36
  luot_2: dung
  nguon: ["https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/12/23-1-Sm_FPn_p12.jp2&cnt=1&WID=3000&QLT=85&CVT=JPG", "https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Bản in Pháp đầu trang 12: ô 194 'pp sempre sotto voce', tay trái nốt Rê trầm lặp; 'il più forte possibile' ngay trước coda (ô 206–207)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n37
  luot_2: dung
  nguon: ["https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/12/23-1-Sm_FPn_p12.jp2&cnt=1&WID=3000&QLT=85&CVT=JPG", "https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Bản in Pháp đầu: 'Presto con fuoco' ở ô 208, hợp âm dày, fz; Mutopia: gam quãng tám hai tay, ô 258–259 quãng tám nửa cung hai tay ngược chiều (phải đi xuống, trái đi lên), ô 260–261 cùng đi xuống. Bản in đầu ghi fz ở đầu coda (sau il più forte possibile), ff là theo Klindworth."
- trang: piano/tac-pham/chopin-ballade-1
  id: n38
  luot_2: dung
  nguon: ["https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/12/23-1-Sm_FPn_p12.jp2&cnt=1&WID=3000&QLT=85&CVT=JPG", "https://www.henle.de/media/0a/08/a8/1756813235/0867en.pdf"]
  ghi_chu: "Bản in Pháp đầu (Schlesinger 1836, bản BnF Vm12 5500, trên CFEO trang 12): đầu coda có vạch kép và dấu nhịp ₵ (alla breve) ở cả hai khuông. Largo đầu bài là C (trang 2); bình chú Henle không ghi nguồn nào khác dấu nhịp ở coda."
- trang: piano/tac-pham/chopin-ballade-1
  id: n39
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/02/23-1-Sm_FPn_p02.jp2&cnt=1&WID=1600&QLT=85&CVT=JPG", "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"]
  ghi_chu: "Ô 1 bè trầm: C – E♭ – A♭ – B♭… (Mutopia 'c2 ~ c8 ees aes bes'), hợp âm La♭ trưởng; La♭ trưởng là ♭II (Napoli) của Sol thứ (Open Music Theory, chương ♭II6: hợp âm trưởng dựng trên bậc 2 hạ)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n41
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia ô 9 trở đi: tay trái đệm hợp âm ngắt (staccato, pp) dưới giai điệu chủ đề 1; tiếp sau là đoạn nốt lướt nhẹ trước agitato."
- trang: piano/tac-pham/chopin-ballade-1
  id: n42
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia đoạn agitato (khoảng ô 36–64): tay trái nốt trầm rồi hợp âm cách xa, tay phải hình nốt móc đơn, liên ba, liên năm dày."
- trang: piano/tac-pham/chopin-ballade-1
  id: n43
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia ô 138: chất liệu mới (không lấy từ hai chủ đề), tay trái nốt trầm và hợp âm như điệu valse."
- trang: piano/tac-pham/chopin-ballade-1
  id: n44
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/", "https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Open Music Theory (Sonata form): chủ đề phụ ở tác phẩm giọng thứ thường ở giọng III (giọng trưởng song song, Si♭ với Sol thứ) hay v; Ballade đặt chủ đề 2 ở Mi♭ trưởng (VI)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n45
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  ghi_chu: "Chủ đề 2 ô 106 ở La trưởng; La – Mi♭ là quãng bốn tăng/năm giảm, sáu nửa cung (Open Music Theory, Intervals), tức ba cung, xa nhất trên vòng quãng năm."
- trang: piano/tac-pham/chopin-ballade-1
  id: n46
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/12/23-1-Sm_FPn_p12.jp2&cnt=1&WID=3000&QLT=85&CVT=JPG"]
  ghi_chu: "Mutopia: chủ đề 2 ff ở ô 166, chủ đề 1 ở ô 194 (bản in đầu: pp sempre sotto voce), lớn dần tới il più forte possibile rồi vào thẳng coda ô 208 không có kết trọn ở Sol thứ."
- trang: piano/tac-pham/chopin-ballade-1
  id: n52
  luot_2: dung
  nguon: ["https://www.golandskyinstitute.org/resources/"]
  ghi_chu: "Golandsky Institute (Taubman): quãng tám và hợp âm chơi với cơ cấu tự do, cổ tay đúng độ cao khi chạm phím, dùng trọng lực giảm sức cơ. Tập mf trước là cách dạy phổ biến."
- trang: piano/tac-pham/chopin-ballade-1
  id: n54
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4086404/", "https://www.golandskyinstitute.org/resources/"]
  ghi_chu: "PMC (Chan & Ackermann 2014): bài khó, cường độ cao nên tập từng quãng ngắn với nghỉ thường xuyên để tránh mỏi cơ; Golandsky: quãng tám dùng cả cơ cấu tay, không chỉ ngón. Con số 10–15 phút là áp dụng thận trọng nguyên tắc ấy."
- trang: piano/tac-pham/chopin-ballade-1
  id: n60
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4086404/"]
  ghi_chu: "Tăng tốc từng nấc, dừng và nghỉ khi căng hay đau hợp khuyến cáo PMC (không chơi qua cơn đau, nghỉ để tránh mỏi cơ)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n64
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4086404/"]
  ghi_chu: "Không ép tốc độ khi tay còn căng hợp nguyên tắc giảm tải ở PMC (bài khó, cường độ cao là yếu tố nguy cơ)."
- trang: piano/tac-pham/chopin-ballade-1
