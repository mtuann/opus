  ghi_chu: "IMSLP có các tác phẩm này: Scherzo số 1 Op. 20 (1835), Fantaisie Fa thứ Op. 49 (1841), Barcarolle Op. 60 (1846). Phần 'hướng dẫn Étude' là liên kết trong site."
