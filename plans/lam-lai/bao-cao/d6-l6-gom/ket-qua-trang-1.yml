  id: n31
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip", "https://www.henle.de/media/0a/08/a8/1756813235/0867en.pdf"]
  ghi_chu: "Mutopia: 'Meno mosso. sotto voce' ở cuối ô 67 (nhịp lấy đà), chủ đề 2 Mi♭ trưởng ở ô 68; Henle bình chú ô 68 trở đi."
- trang: piano/tac-pham/chopin-ballade-1
  id: n32
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia: ô 94 trở đi 'a tempo (meno mosso)', sotto voce, chất liệu chủ đề 1 ở La thứ, dẫn tới chủ đề 2 La trưởng ô 106."
- trang: piano/tac-pham/chopin-ballade-1
  id: n33
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia ô 106: hợp âm E–G♯–B–D (át âm La) giải về La trưởng, ff, hợp âm dày và quãng tám."
