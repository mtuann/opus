- trang: piano/tac-pham/chopin-ballade-1
  id: n1
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Ballade_No.1,_Op.23_(Chopin,_Frédéric)"]
  ghi_chu: "IMSLP: sáu bản thu trọn bài dài 8:54, 9:21, 9:40, 10:14, 8:54 (bản Cortot 1929); khoảng chín, mười phút là đúng."
- trang: piano/tac-pham/chopin-ballade-1
  id: n2
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/12/23-1-Sm_FPn_p12.jp2&cnt=1&WID=3000&QLT=85&CVT=JPG", "https://www.henle.de/media/0a/08/a8/1756813235/0867en.pdf"]
  ghi_chu: "Khung chung khớp bản nhạc (Mutopia, nguồn Klindworth; bản in Pháp đầu trang 12): chủ đề 1 (ô 8), chủ đề 2 (ô 68), các lần trở lại ở giọng khác, đoạn valse, coda Presto con fuoco ô 208."
- trang: piano/tac-pham/chopin-ballade-1
  id: n3
  luot_2: dung
  nguon: ["https://www.henle.de/Ballade-g-minor-op.-23/HN-867"]
  ghi_chu: "Trang Henle HN 867: 'ABRSM: Piano LRSM' (LRSM là bằng diploma của ABRSM); mức khó Henle 8 (difficult)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n6
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip", "https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/12/23-1-Sm_FPn_p12.jp2&cnt=1&WID=3000&QLT=85&CVT=JPG"]
  ghi_chu: "Mutopia (Klindworth): Meno mosso, sotto voce trước ô 68; ff ở ô 106 (La trưởng) và ô 166 (Mi♭ trưởng). Bản in Pháp đầu xác nhận các chỉ dẫn quanh đoạn tái hiện."
- trang: piano/tac-pham/chopin-ballade-1
  id: n7
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Đối chiếu bản nhạc Mutopia: giai điệu hát (chủ đề 2), hợp âm dày và quãng tám (ô 106 trở đi, coda), nhảy xa (agitato), lướt leggiero (ô 158), nhiều dấu bàn đạp."
- trang: piano/tac-pham/chopin-ballade-1
  id: n9
  luot_2: dung
  nguon: ["https://www.henle.de/Ballade-g-minor-op.-23/HN-867", "https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf"]
  ghi_chu: "Lời tựa Henle (Müllemann 2007): 'The g-minor-Ballade is one of Chopin's most popular works'; trang sản phẩm ghi 'ABRSM: Piano LRSM'."
- trang: piano/tac-pham/chopin-ballade-1
  id: n11
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4086404/", "https://www.golandskyinstitute.org/resources/"]
  ghi_chu: "Chan & Ackermann 2014 (PMC): bài khó, thiếu nghỉ, cơ học kém là yếu tố nguy cơ rối loạn cơ xương khi chơi nhạc; bài khó nên tập ngắn, nghỉ thường xuyên. Câu cảnh báo hợp các nguồn này."
- trang: piano/tac-pham/chopin-ballade-1
  id: n12
  luot_2: dung
  nguon: ["https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf"]
  ghi_chu: "Lời tựa Henle dẫn Schumann (NZfM 25/10/1842): 'Chopin was the first to apply the word Ballade to music'; Henle: Op. 23 'for the first time applied the term to a work for solo piano'."
- trang: piano/tac-pham/chopin-ballade-1
  id: n13
  luot_2: dung
  nguon: ["https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf"]
  ghi_chu: "Lời tựa Henle: ballade nửa đầu thế kỷ 19 trước hết là thể loại văn học, bài thơ kể một cảnh kịch tính, thường huyền bí; 'The Romantics ... took it up with particular enthusiasm'."
- trang: piano/tac-pham/chopin-ballade-1
  id: n14
  luot_2: dung
  nguon: ["https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf", "https://imslp.org/wiki/Ballade_No.1,_Op.23_(Chopin,_Frédéric)"]
  ghi_chu: "Henle: lịch sử sáng tác 'sparsely documented', hợp đồng Breitkopf & Härtel ngày 9/1/1836, 'Thus the work was composed in 1835'. IMSLP: '1831? (first version), 1834-35? (final version)'. Chopin ở Paris từ 1831 (tiểu sử trên trang Henle)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n15
  luot_2: dung
  nguon: ["https://www.henle.de/Ballade-g-minor-op.-23/HN-867"]
  ghi_chu: "Tiểu sử Chopin trên trang Henle (Reclam): 1831 'he goes to Paris, where he will remain until the end of his life'."
- trang: piano/tac-pham/chopin-ballade-1
  id: n16
  luot_2: dung
  nguon: ["https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf"]
  ghi_chu: "Lời tựa Henle trích thư Schumann gửi Heinrich Dorn ngày 14/9/1836: 'one of his most brilliant (not most inspired) works; I even told him that it is my favourite ... he told me emphatically: That pleases me, for it is also my favourite'. Câu trang dịch 'xuất sắc nhất' cho 'most brilliant' là chấp nhận được."
- trang: piano/tac-pham/chopin-ballade-1
  id: n17
  luot_2: dung
  nguon: ["https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf"]
  ghi_chu: "Lời tựa Henle: Schumann thuật Chopin 'was inspired to write his Ballades by some poems of Adam Mickiewicz'; Mickiewicz sang Paris và thuộc giới quen biết của Chopin."
- trang: piano/tac-pham/chopin-ballade-1
  id: n18
  luot_2: dung
  nguon: ["https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf"]
  ghi_chu: "Lời tựa Henle: 'no testimony from Chopin survives to support the idea that he was attempting to apply the poetic substance of Mickiewicz's ballades to his own piano compositions'."
- trang: piano/tac-pham/chopin-ballade-1
  id: n20
  luot_2: dung
  nguon: ["https://archive.org/download/pianist_poland/stein2004_djvu.txt", "https://musicbrainz.org/ws/2/release/48fb637f-b846-4c19-9bb4-52c052f1725e?inc=recordings+artist-credits+recording-level-rels&fmt=json"]
  ghi_chu: "Stein 2004 (Int J Psychoanal): trong cảnh với Hosenfeld, Szpilman (Adrien Brody) chơi Ballade số 1 Sol thứ Op. 23; MusicBrainz, nhạc phim Sony Classical 2002: Ballade Op. 23 do Janusz Olejniczak chơi. Ngoài đời Szpilman chơi Nocturne Đô♯ thứ (Stein), nên đây là chi tiết của phim."
- trang: piano/tac-pham/chopin-ballade-1
  id: n22
