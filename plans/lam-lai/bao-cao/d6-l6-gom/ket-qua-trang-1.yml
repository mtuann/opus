  ghi_chu: "PMC: bài khó, thiếu nghỉ, cơ học kém là yếu tố nguy cơ đau do chơi nhạc."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n11
  luot_2: dung
  nguon: ["https://web.archive.org/web/20160324055227/http://www.britannica.com:80/art/impromptu", "https://www.henle.de/Impromptus/HN-235"]
  ghi_chu: "Britannica: impromptu là bản piano thế kỷ 19 'intended to produce the illusion of spontaneous improvisation'; Henle HN 235: 'strongly improvisatory character'."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n12
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Impromptu_No.1,_Op.29_(Chopin,_Frédéric)", "https://imslp.org/wiki/Impromptu_No.2,_Op.36_(Chopin,_Frédéric)", "https://imslp.org/wiki/Impromptu_No.3,_Op.51_(Chopin,_Frédéric)"]
  ghi_chu: "IMSLP: Op. 29 in 1837, Op. 36 in 1840, Op. 51 in 1843, khi Chopin còn sống; Op. 66 in 1855 (sau khi mất)."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n13
  luot_2: dung
  nguon: ["https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf", "https://imslp.org/wiki/Fantaisie-Impromptu,_Op.66_(Chopin,_Frédéric)"]
  ghi_chu: "Bình chú Henle: 'According to Fontana, the Fantasy-Impromptu – only published after the composer's death – was composed in 1834.'"
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n14
  luot_2: dung
  nguon: ["https://www.gutenberg.org/cache/epub/4972/pg4972.txt", "https://www.henle.de/Impromptus/HN-235"]
  ghi_chu: "Niecks: 'the composer unequivocally expressed the wish that his manuscripts should not be published', rồi nhắc Fantaisie-Impromptu trong tuyển của Fontana; Henle: bài chỉ ra đời sau khi Chopin mất nhờ Fontana."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n15
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Fantaisie-Impromptu,_Op.66_(Chopin,_Frédéric)", "https://www.gutenberg.org/cache/epub/4972/pg4972.txt", "https://imslp.org/wiki/Waltzes,_Op.69_(Chopin,_Frédéric)", "https://imslp.org/wiki/3_Waltzes,_Op.70_(Chopin,_Frédéric)"]
  ghi_chu: "IMSLP: Op. 66 in lần đầu 1855 (Fontana; Schlesinger S. 4392, Meissonnier J.M. 3523); Op. 70 in 1855, Op. 69 Meissonnier [1855], số 2 Si thứ. Niecks: Fontana in Op. 66–74 năm 1855. Lưu ý: Op. 69 số 2 và Op. 70 số 2 đã in ở Kraków năm 1852."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n16
  luot_2: dung
  nguon: ["https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf"]
  ghi_chu: "Henle: 'In all probability the term Fantaisie-Impromptu also originated with Fontana, for A only gives the tempo mark and CM the term Impromptu' (CM: bản chép của Franchomme)."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n17
  luot_2: dung
  nguon: ["https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf", "https://imslp.org/wiki/Fantaisie-Impromptu,_Op.66_(Chopin,_Frédéric)"]
  ghi_chu: "Henle: bản tay trong bộ sưu tập Rubinstein đề 'Paris Vendredi 1835', là một phần album của Nam tước phu nhân d'Este. IMSLP: 'Composed for Madame la Baronne Frances Sarah d'Este'."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n18
  luot_2: khong-chac
  nguon: ["https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf"]
  ghi_chu: "Henle: bản tay thuộc 'Artur Rubinstein Collection', từng nằm trong album của Nam tước phu nhân d'Este: vế này đúng. Hinson (chỉ thấy đoạn trích tìm kiếm archive.org): Schirmer có ấn bản bản tay từ bộ sưu tập Rubinstein, kèm lời tựa và bản chụp. Năm 1962 không tìm được nguồn mở được."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n19
  luot_2: khong-chac
  nguon: ["http://web.archive.org/web/2019/https://en.chopin.nifc.pl/chopin/composition/detail/id/71"]
  ghi_chu: "NIFC: Rubinstein, người có một bản tay, cho rằng bài đã được bán cho Nam tước phu nhân d'Este: vế ấy đúng. Câu trích 'nhiều cải thiện về hòa âm và văn phong', ý coi bản d'Este là bản hoàn chỉnh và lập luận dựa vào chữ 'soạn cho' chưa tìm được nguồn mở được (lời tựa Schirmer)."
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n20
  luot_2: dung
  nguon: ["https://www.henle.de/media/c1/24/74/1697725759/1320-1697725758-sync.pdf"]
  ghi_chu: "Henle: bản tay 'may therefore be a later copy of the work composed the previous year'; bản Fontana 'departs not inconsiderably' khỏi bản tay, nhưng nhiều chỗ khác 'agree with readings in Franchomme's copy'."
