  id: n66
  luot_2: dung
  nguon: ["https://www.gutenberg.org/cache/epub/4972/pg4972.txt"]
  ghi_chu: "Niecks (tập 2) dẫn Mikuli: tay hát được tự do về nhịp, 'the accompanying hand, continued to play strictly in time'; lời Chopin 'Que votre main gauche soit votre maître de chapelle et garde toujours la mesure'."
- trang: piano/tac-pham/chopin-ballade-1
  id: n68
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1.rdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia ghi nguồn 'Klindworth; Bote & Bock, n.d. [1880]'; mã nguồn có ffz rồi ff ở ô 208 và fff ở ô 258. Lưu ý: bản in Pháp đầu (CFEO trang 12) chỉ ghi fz ở đầu coda, sau 'il più forte possibile'."
- trang: piano/tac-pham/chopin-ballade-1
  id: n70
  luot_2: dung
  nguon: ["https://www.henle.de/media/0a/08/a8/1756813235/0867en.pdf"]
  ghi_chu: "Bình chú Henle ô 7: 'We give e♭1 in accordance with main source F, AFr' (AFr là bản tay dở dang ô 1–13, 'never completed'); 'The d1 reading in G' (bản Đức Breitkopf 1836) và Scholtz bản in sau có d1. Henle chọn Mi♭."
- trang: piano/tac-pham/chopin-ballade-1
  id: n72
  luot_2: dung
  nguon: ["https://www.chopin-nationaledition.com/en", "https://www.chopin-nationaledition.com/product/ballady/", "http://serwer1374796.home.pl/wp-content/uploads/2013/05/ballady_komentarz.pdf", "https://www.henle.de/media/0a/08/a8/1756813235/0867en.pdf"]
  ghi_chu: "Wydanie Narodowe (Ekier, Kamiński): ấn bản phê bình nguồn dựa trên mọi nguồn (bản tay, bản chép, bản in đầu); tập Ballady (PWM 2000) ghi biến thể (ossia và biến thể giữa các nguồn). Henle: Scholtz bản in sau có d1 ở ô 7, Mi♭ để ở chú thích."
- trang: piano/tac-pham/chopin-ballade-1
  id: n74
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4086404/"]
  ghi_chu: "PMC: thiếu nghỉ, mỏi cơ, bài khó là yếu tố nguy cơ; 'con đường ngắn nhất' là cách nói nhấn mạnh, nội dung đúng."
