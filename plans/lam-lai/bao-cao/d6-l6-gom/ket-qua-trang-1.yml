  ghi_chu: "Discogs: LP Columbia Masterworks 1965, Horowitz ra sân khấu Carnegie Hall Chủ nhật 9/5/1965, có Ballade Sol thứ Op. 23; Sony Classical phát hành lại (2003, 2019)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n25
  luot_2: dung
  nguon: ["https://www.deutschegrammophon.com/en/catalogue/products/chopin-ballades-zimerman-2333", "https://api.discogs.com/releases/7258208"]
  ghi_chu: "DG: Chopin Ballades / Zimerman, bốn ballade, 8/7/1988; Discogs DG 423 090-2: thu ở Bielefeld 7/1987, ℗ 1988."
- trang: piano/tac-pham/chopin-ballade-1
  id: n26
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Nhận xét về lối chơi; Britannica (Wayback) chỉ gọi Rubinstein bậc thầy chơi Chopin. Joachim Kaiser (Great Pianists of Our Time, chỉ thấy đoạn trích tìm kiếm trên archive.org) tả 'a proud Chopin, a virile Chopin, not that kindly, sentimental émigré', gần nghĩa 'ít cường điệu' nhưng chữ 'tự nhiên' không có nguồn mở được. Nên viết theo nguồn hay ghi rõ là nhận xét."
- trang: piano/tac-pham/chopin-ballade-1
  id: n28
  luot_2: dung
  nguon: ["https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/02/23-1-Sm_FPn_p02.jp2&cnt=1&WID=1600&QLT=85&CVT=JPG", "https://www.henle.de/media/0a/08/a8/1756813235/0867en.pdf"]
  ghi_chu: "Bản in Pháp đầu (CFEO, trang 2): Largo, nhịp C, ô 1–7 hai tay chơi cùng giai điệu cách quãng tám; ô 7 dừng trên hợp âm có Mi♭ nghịch tai (Henle bình chú ô 7)."
- trang: piano/tac-pham/chopin-ballade-1
  id: n29
  luot_2: dung
  nguon: ["https://chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/02/23-1-Sm_FPn_p02.jp2&cnt=1&WID=1600&QLT=85&CVT=JPG"]
  ghi_chu: "Bản in Pháp đầu trang 2: 'Moderato' và nhịp 6/4 ở ô 8, giọng Sol thứ."
- trang: piano/tac-pham/chopin-ballade-1
  id: n30
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O23/chopin-op23-ballade-1/chopin-op23-ballade-1-lys.zip"]
  ghi_chu: "Mutopia (Klindworth): agitato, sempre più mosso, lên cao trào rồi 'poco a poco meno f' trước Meno mosso ô 67–68."
