  ghi_chu: "Phần đã xác nhận: bản in đầu ghi '(vers 1834)'; Henle (Bemerkungen HN 1320): 'Nach Fontana ... 1834 komponiert', chỉ in sau khi Chopin mất; bản tay trong bộ sưu tập Artur Rubinstein đề 'Paris Vendredi 1835', thuộc album của Nam tước phu nhân d'Este; IMSLP: First Publication 1855, 'Composed for Madame la Baronne Frances Sarah d'Este'. Chưa mở được nguồn bậc 2 nào nói bản tay ấy được in năm 1962 (bản Rubinstein của G. Schirmer chỉ thấy qua chú thích Wikipedia; danh mục NYPL, Hope, NIFC không đọc được). Vế 'Chopin không cho in' chỉ có ở dạng 'in sau khi mất' trong Henle."
