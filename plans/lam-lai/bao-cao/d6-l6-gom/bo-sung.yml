- trang: piano/tac-pham/chopin-ballade-1
  id: n54
  cau: "Coda: tập khi tay còn tươi, từng đợt khoảng 20 phút, xen 10 phút nghỉ; quãng tám bằng cổ tay và cánh tay."
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n83
  cau: "Câu hỏi 4: tập coda khi tay còn tươi, từng đợt khoảng 20 phút xen nghỉ, chậm; dừng nếu căng hay đau."
  loai: quy-tac
- trang: piano/tac-pham/liszt-liebestraum
  id: n47
  cau: "Ghi chú cách đếm: số ô theo bản in đầu (Kistner 1850, bản Henle dựa vào), không tính nốt lấy đà; mỗi khúc không chia vạch nhịp nằm giữa hai vạch nhịp tính một ô: cadenza 1 là ô 25; trước cadenza 2 (ô 60, leggiero) còn ô 59, chuỗi nốt hai tay dimin. cũng không chia vạch nhịp; PTNA đặt Più animato ở ô 27."
  loai: cau-truc
- trang: du-lieu/tac-pham/liszt-liebestraum
  id: n31
  cau: "Hình bài học, ghi chú: số ô theo bản in đầu (Kistner 1850), mỗi khúc không chia vạch nhịp một ô (cadenza 1 ô 25; ô 59 và cadenza 2 ô 60); PTNA đặt Più animato ở ô 27."
  loai: cau-truc
