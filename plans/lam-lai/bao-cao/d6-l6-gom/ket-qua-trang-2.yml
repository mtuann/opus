  "ghi_chu": "Đếm ô trên bản in đầu Kistner (BSB bsb00051595, tr. 17–22), không tính nhịp lấy đà: A ô 1–23, ô 24 dẫn, cadenza 1 = ô 25, Più animato ô 26, sempre stringendo ô 37, affrettando ô 56–58, cadenza 2 = ô 59, Tempo primo ô 60, hết bài ô 84. Đánh số này khớp lời bình của Henle (ghi chú T13–14 staccato, T28, T44/51/53 dấu nhấn rơi đúng các ô ấy). PTNA đánh số khác (Più animato 27, stringendo 37, Tempo I 61, hết 85), nên 61/85 là số của PTNA, không theo quy ước 'bản in đầu, không tính lấy đà, mỗi cadenza một ô'."
