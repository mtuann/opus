- trang: piano/tac-pham/chopin-ballade-1
  id: n54
  luot_2: dung
  nguon:
    - "https://www.bapam.org.uk/the-healthy-pianist/"
    - "https://www.chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/ocvejp2-proc/23/5/14/23-1-Sm_FPn_p14.jp2&WID=1600&CVT=JPG"
    - "https://www.chopinonline.ac.uk/iipsrv/fcgi-bin/iipsrv.fcgi?FIF=jp2/newjp2/4287.jp2&WID=1600&CVT=JPG"
  ghi_chu: "BAPAM, The Healthy Pianist (Penelope Roskell; trang bapam.org.uk, mục Practising): 'Practise in twenty minute sessions, interspersed with ten minute breaks, to allow the hands time to recover', khớp vế 20 phút / 10 phút nghỉ. Vế cổ tay và cánh tay: cùng trang ghi 'coordinated sideways wrist-arm movements', 'natural release of the weight of the arm to play chords', 'minimising tension between repetitive octaves'. Vế 'tay còn tươi': trang ghi tránh chơi fortissimo khi mệt; lưu ý trang cũng khuyên không mở đầu buổi tập bằng đoạn khó nhất (khởi động trước), không mâu thuẫn với câu. Coda có quãng tám thật: bản in Pháp đầu (Schlesinger, M.S. 1928, BnF, trên CFEO) tr. 14–15 (ô 234–264): quãng tám hai tay ở các ô poco ritenuto – accelerando – rallentando cuối bài."
- trang: piano/tac-pham/chopin-ballade-1
  id: n83
  luot_2: dung
  nguon:
    - "https://www.bapam.org.uk/the-healthy-pianist/"
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "BAPAM The Healthy Pianist: tập từng đợt 20 phút xen 10 phút nghỉ; 'Practise passages quietly and slowly with minimum effort initially'; 'If you do start to experience tension or fatigue, consider these as warning signs'; 'If you experience pain, stop immediately'. Trang Return to Play của BAPAM: 'Pause or stop at any sign of reduced concentration, fatigue, or discomfort' và nghỉ 3–5 phút mỗi 20–25 phút (câu ghi 'xen nghỉ', không ghi độ dài, nên khớp cả hai)."
- trang: piano/tac-pham/liszt-liebestraum
  id: n47
  luot_2: dung
  nguon:
    - "https://api.digitale-sammlungen.de/iiif/presentation/v2/bsb00051595/manifest"
    - "https://henle.de/media/5f/df/70/1690886072/0634-1690886072-sync.pdf"
    - "https://enc.piano.or.jp/musics/23749"
  ghi_chu: "Tự đếm trên bản Kistner ở BSB (bsb00051595, ảnh IIIF trang in 17–22, PN 1751): nốt Mi giáng lấy đà không tính; tr. 17 ô 1–14; tr. 18 ô 15–23 (ô 23 có dấu lặng ngân), ô 24 (Mi bình tay trái, tay phải nghỉ trọn ô, chuỗi rải p), rồi một vạch nhịp, sau đó cadenza 1 chạy hết hệ 4 và hệ 5 không có vạch nhịp nào (kể cả dấu lặng ngân và nốt Si bình lấy đà) tới vạch kép đổi sang Si trưởng: ô 25. Più animato con passione ô 26 (tr. 19); sempre stringendo ô 37; tr. 20 ô 41–55 (về La giáng trưởng ở ô 50); tr. 21: ô 56–58 (ô 58 hợp âm có dấu ngân), hệ 2 chuỗi nốt hai tay dimin. không vạch nhịp, có vạch nhịp ở cuối hệ: ô 59; hệ 3–4 (hợp âm giải quyết, rồi chuỗi leggiero, dấu ngân) không vạch nhịp tới vạch trước Tempo primo: ô 60; Tempo primo ô 61; tr. 22 ô 66–85, tổng 85 ô (khớp PTNA). Henle HN 634, lời tựa: 'Our edition follows the text presented in Kistner's first edition of 1850 (plate no. 1751)' (đối chiếu thêm bản in lại 1886). PTNA (enc.piano.or.jp/musics/23749, bài của 伊藤萌子): '27小節目、H-durで主題が始まります。ここはpiu animato con passione', chia đoạn 1–26, 27–36, 37–60, 61–85: PTNA đếm cadenza 1 thành hai ô (24 là chỗ bắt đầu cadenza, 'カデンツ') nên lệch 1 ô ở đoạn giữa, rồi gộp chuỗi dimin. và cadenza 2 vào ô 60; từ 61 trùng với cách đếm theo Kistner. Lưu ý: bản BSB ghi '[1850]' nhưng chân trang có thêm số 6847 (Henle ghi số này cho bản in lại 1886); cách chia vạch nhịp không đổi giữa hai bản."
- trang: du-lieu/tac-pham/liszt-liebestraum
  id: n31
  luot_2: dung
  nguon:
    - "https://api.digitale-sammlungen.de/iiif/presentation/v2/bsb00051595/manifest"
    - "https://enc.piano.or.jp/musics/23749"
  ghi_chu: "Như n47 của piano/tac-pham/liszt-liebestraum: đếm trên bản Kistner (BSB bsb00051595, trang in 17–22), mỗi khúc không chia vạch nhịp nằm giữa hai vạch nhịp tính một ô: cadenza 1 là ô 25; chuỗi dimin. là ô 59; cadenza 2 (có leggiero) là ô 60; Tempo primo ô 61; tổng 85 ô. PTNA ghi Più animato ở ô 27 ('27小節目… piu animato con passione')."
