- trang: luyen-tap/metronome
  id: n10
  luot_2: dung
  nguon: ["https://www.dolmetsch.com/musictheory5.htm"]
  ghi_chu: "Dolmetsch ghi khoảng gần đúng khác nhau, vd Andante 56-88 (có nguồn nói 76-108), Presto 100-152 (có nguồn 168-208); nói rõ các mức thay đổi nhiều, thiên về 'tính chất' hơn 'tốc độ', phụ thuộc phong cách và người chơi."
