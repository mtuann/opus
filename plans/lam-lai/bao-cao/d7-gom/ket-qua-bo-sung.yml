- trang: luyen-tap/ban-phim
  id: n13
  luot_2: dung
  nguon: ["https://caniuse.com/midi", "https://developer.mozilla.org/en-US/docs/Web/API/Navigator/requestMIDIAccess"]
  ghi_chu: "Caniuse: Chrome từ 43, Edge từ 79, Firefox từ 108, Opera từ 30; Safari macOS không hỗ trợ gốc; iOS Safari không hỗ trợ (tới 27.2). Trình duyệt khác trên iPhone, iPad dùng engine WebKit của Apple nên cùng không có (điều này là quy định của iOS, caniuse không liệt kê riêng). MDN: cần ngữ cảnh bảo mật HTTPS; trang bảng tương thích của MDN không tải được nội dung nên dựa vào caniuse."
