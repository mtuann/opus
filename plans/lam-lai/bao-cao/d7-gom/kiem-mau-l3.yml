- trang: blog/posts/2026-10-21-trong-tam-piano
  id: n3
  cau: Trên piano, một mình bạn nhìn thấy và chơi được cả giai điệu lẫn hòa âm
    cùng lúc.
  loai: quy-tac
  nguon:
    - https://en.wikipedia.org/wiki/Piano
  ket_qua_luot_1: da-sua
  ghi_chu: "Thêm ngoài mẫu ngẫu nhiên: lượt 2 bổ sung khong-chac. Không mở được
    nguồn bậc 2 nào nói thẳng điều này (tìm kiếm chỉ ra danh sách tiết mục,
    không bàn việc một người chơi cả giai điệu lẫn hòa âm). Đây là điều hiển
    nhiên về cấu tạo piano, không có dấu hiệu sai; chỉ là chưa có link đã mở để
    ghi dung."
- trang: blog/posts/2026-10-21-trong-tam-piano
  id: n6
  cau: Kho nhạc chơi được trên piano trải từ Bach đến Rachmaninoff.
  loai: lich-su
  nguon:
    - https://www.henle.de/The-Well-Tempered-Clavier-Part-I-BWV-846-869/HN-14
  ket_qua_luot_1: da-sua
  ghi_chu: "Thêm ngoài mẫu ngẫu nhiên: lượt 2 bổ sung khong-chac. Không mở được
    trang nguồn về kho nhạc piano (Wikipedia Piano repertoire trả 404,
    Britannica 403). Kết quả tìm kiếm cho thấy các tuyển tập và giáo trình trải
    từ Bach đến Rachmaninoff, không thấy mâu thuẫn; chưa có link đã mở nên không
    ghi dung."
- trang: cap-nhat
  id: n80
  cau: File chương I Pathétique (Daniel Veesey) trên Commons dừng ở khoảng 6:24,
    giữa phần phát triển; trang hướng dẫn nghe ghi rõ điều này.
  loai: so-lieu
  nguon:
    - https://commons.wikimedia.org/wiki/File:Daniel_Veesey_-_01_-_Sonata_8_Pathetique_-_I_Grave_-_Allegro_di_molto_e_con_brio.ogg
  ket_qua_luot_1: dung
  ghi_chu: "Thêm ngoài mẫu ngẫu nhiên: lượt 2 bổ sung khong-chac. Commons: file
    'Daniel Veesey - 01 - Sonata 8 Pathetique - I Grave - Allegro di molto e con
    brio.ogg' dài 6 phút 25 giây (khớp 'khoảng 6:24'), trang file mở ra. Tuy
    nhiên trang file không nói file bị cắt hay dừng ở đâu, đề tên là cả chương;
    nên không xác nhận được 'dừng giữa phần phát triển' (cần nghe file). Cũng
    không đọc được trang hướng dẫn nghe của site (ngoài phạm vi). Số 6:24/6:25
    lệch một giây cần chỉnh nếu muốn khớp đúng."
