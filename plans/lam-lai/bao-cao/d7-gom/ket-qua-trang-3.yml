  id: n19
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Trang Apple đã mở (support.apple.com/guide/iphone/...) chỉ hiện mục lục, không có bước in. Theo hiểu biết chung lệnh In nằm trong menu Chia sẻ của Safari, nhưng chưa xác nhận bằng nguồn chính thức; Mozilla Support không tải được."
