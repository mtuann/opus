  nguon: ["https://support.google.com/chrome/answer/1069693"]
  ghi_chu: "Trang Chrome đã mở có bước 'Save as PDF' (Lưu dưới dạng PDF) ở ô đích máy in; trang chỉ nhắc trong phần Drive nên chưa nêu đủ. Khớp cách dùng phổ biến."
