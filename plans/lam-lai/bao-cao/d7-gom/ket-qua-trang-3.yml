  nguon: ["https://support.google.com/chrome/answer/1069693"]
  ghi_chu: "Trang Chrome đã mở không nhắc 'Headers and footers'. Tìm kiếm cho thấy tùy chọn nằm ở More settings, bỏ chọn thì mất tiêu đề, URL, ngày, số trang (nguồn bên thứ ba, chưa xác nhận ở trang chính thức). Lời khuyên hợp lý."
