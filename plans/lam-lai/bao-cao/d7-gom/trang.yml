- trang: luyen-tap/ban-phim
  id: n4
  cau: "Gam trưởng đổi nốt gốc lần lượt Đô, Sol, Rê, La: mỗi lần thêm đúng một phím đen (Sol có Fa♯; Rê có Fa♯, Đô♯; La có Fa♯, Đô♯, Sol♯)."
  loai: quy-tac
- trang: luyen-tap/ban-phim
  id: n5
  cau: Chuỗi Đô, Sol, Rê, La (mỗi bước lên một quãng năm đúng) chính là vòng quãng năm.
  loai: dinh-nghia
- trang: luyen-tap/ban-phim
  id: n7
  cau: Gam trưởng và gam thứ tự nhiên trên cùng nốt gốc chỉ khác ở bậc 3, 6 và 7.
  loai: quy-tac
- trang: luyen-tap/ban-phim
  id: n8
  cau: "Có ba dạng gam thứ: tự nhiên, hòa âm, giai điệu."
  loai: dinh-nghia
- trang: luyen-tap/ban-phim
  id: n10
  cau: Hợp âm trưởng và hợp âm thứ trên cùng nốt gốc chỉ khác nốt giữa, thứ dịch xuống nửa cung.
  loai: quy-tac
- trang: luyen-tap/ban-phim
  id: n13
  cau: "Trình duyệt hỗ trợ MIDI trên web: Chrome, Edge, Opera trên máy tính (chữ do ô midi-status hiện)."
  loai: so-lieu
- trang: luyen-tap/chep-giai-dieu
  id: n12
  cau: "Trình duyệt hỗ trợ MIDI trên web: Chrome, Edge, Opera trên máy tính (chữ do ô MIDI trong công cụ hiện)."
  loai: so-lieu
- trang: luyen-tap/chep-giai-dieu
  id: n2
  cau: "Đây là một bài luyện tai khó: biến âm thanh trong đầu thành nốt nhạc."
  loai: khuyen-tap
- trang: luyen-tap/chep-giai-dieu
  id: n9
  cau: Chuyển cấp khi chép đúng hoàn toàn 4 trên 5 câu.
  loai: khuyen-tap
- trang: luyen-tap/chep-giai-dieu
  id: n6
  cau: Nghe cả câu 2–3 lần trước khi bấm phím, hát thầm theo; tìm nốt cuối trước rồi các nốt giữa; nghĩ theo bậc và quãng.
  loai: khuyen-tap
- trang: luyen-tap/choi-theo
  id: n3
  cau: 100 cent bằng nửa cung.
  loai: dinh-nghia
- trang: luyen-tap/choi-theo
  id: n8
  cau: Âm thanh thật của giọng nam và của guitar thấp hơn nốt viết (một quãng tám).
  loai: quy-tac
- trang: luyen-tap/choi-theo
  id: n12
  cau: 'Tên các bài trong công cụ: "Twinkle, Twinkle (Ah! vous dirai-je, maman)" (cùng giai điệu), "Hänschen klein (Lightly Row)" (cùng giai điệu), "Ode to Joy (Beethoven)".'
  loai: ten
- trang: luyen-tap/choi-theo
  id: n14
  cau: Trình duyệt hỗ trợ MIDI trên web (công cụ báo "Dùng Chrome hay Edge trên máy tính, hoặc chọn Micro").
  loai: so-lieu
- trang: luyen-tap/choi-theo
  id: n13
  cau: Hãy tập các bài đó với cả hai tay ở trang 10 bài đầu tiên, rồi quay lại đây để được chấm phần giai điệu.
  loai: khuyen-tap
- trang: luyen-tap/choi-theo
  id: n4
  cau: "Với micro: chơi ở nơi yên tĩnh, đặt điện thoại hoặc máy tính gần nhạc cụ."
  loai: khuyen-tap
- trang: luyen-tap/doc-not
  id: n6
  cau: Trong khóa Sol, nốt Sol nằm trên dòng 2 (đếm từ dưới lên).
  loai: quy-tac
- trang: luyen-tap/doc-not
  id: n7
  cau: Trong khóa Fa, nốt Fa nằm trên dòng 4 (đếm từ dưới lên).
  loai: quy-tac
- trang: luyen-tap/doc-not
  id: n8
  cau: Đô giữa nằm trên dòng kẻ phụ (dưới khuông khóa Sol, trên khuông khóa Fa).
  loai: quy-tac
- trang: luyen-tap/doc-not
  id: n13
  cau: "Trình duyệt hỗ trợ MIDI trên web: Chrome, Edge, Opera trên máy tính (chữ do ô midi-status hiện)."
  loai: so-lieu
- trang: luyen-tap/doc-not
  id: n3
  cau: 'Bắt đầu nhỏ: chọn khóa Sol, phạm vi "Trong khuông" (công cụ có hai lựa chọn này); chỉ chuyển sang bước tiếp khi đúng ngay lần đầu khoảng 9/10.'
  loai: khuyen-tap
- trang: luyen-tap/doc-not
  id: n10
  cau: "Thứ tự mở rộng gợi ý: khóa Sol trong khuông, khóa Fa trong khuông, khóa Sol thêm dòng kẻ phụ, khóa Fa thêm dòng kẻ phụ, rồi cả hai khóa."
  loai: khuyen-tap
- trang: luyen-tap/doc-not
  id: n9
  cau: Nên thuộc vài nốt mốc, đếm từ mốc gần nhất; đúng trước, nhanh sau; khi đã đúng đều thử trả lời trong vòng 2 giây.
  loai: khuyen-tap
- trang: luyen-tap/du-lieu
  id: n12
  cau: Dữ liệu ở chế độ ẩn danh mất khi đóng cửa sổ.
  loai: quy-tac
- trang: luyen-tap/du-lieu
  id: n5
  cau: Chuyển file sang máy B bằng Google Drive, Zalo, email cho chính mình…
  loai: khuyen-tap
- trang: luyen-tap/du-lieu
  id: n10
  cau: Nên sao lưu mỗi tuần một lần, nếu bạn học đều.
  loai: khuyen-tap
- trang: luyen-tap/du-lieu
  id: n11
  cau: Nên sao lưu trước khi xóa dữ liệu trình duyệt, đổi máy, cài lại trình duyệt, hoặc dùng chế độ ẩn danh.
  loai: khuyen-tap
- trang: luyen-tap/hat-lai
  id: n5
  cau: 50 cent là một phần tư cung.
  loai: so-lieu
- trang: luyen-tap/hat-lai
  id: n6
  cau: 1 cent bằng 1/100 nửa cung.
  loai: dinh-nghia
- trang: luyen-tap/hat-lai
  id: n8
  cau: "Hát buộc tai và não liên kết với nhau: bạn phải nghe trong đầu một cao độ trước khi phát ra nó."
  loai: quy-tac
- trang: luyen-tap/hat-lai
  id: n18
  cau: "Dây chuẩn violin của công cụ: Sol3 (G3), Rê4 (D4), La4 (A4), Mi5 (E5)."
  loai: so-lieu
- trang: luyen-tap/hat-lai
  id: n19
  cau: "Dây chuẩn guitar của công cụ: Mi2, La2, Rê3, Sol3, Si3, Mi4."
  loai: so-lieu
- trang: luyen-tap/hat-lai
  id: n21
  cau: La4 = 440 Hz là chuẩn phổ biến nhất hiện nay.
  loai: so-lieu
- trang: luyen-tap/hat-lai
  id: n25
  cau: Chơi nốt La4, ngay trên Đô giữa, và đọc số cent cho biết đàn đang lệch chuẩn bao nhiêu.
  loai: dinh-nghia
- trang: luyen-tap/hat-lai
  id: n26
  cau: Nhạc cụ kia phải chỉnh theo piano khi chơi cùng.
  loai: quy-tac
- trang: luyen-tap/hat-lai
  id: n28
  cau: Piano điện không phải lên dây vì cao độ do mạch điện tử giữ; nếu đàn có chỉnh chuẩn La (mặc định thường 440 hay 442 Hz) thì đối chiếu lại bằng máy.
  loai: so-lieu
- trang: luyen-tap/hat-lai
  id: n23
  cau: "Đàn piano cơ không tự lên dây: việc ấy dành cho thợ."
  loai: khuyen-tap
- trang: luyen-tap/hat-lai
  id: n9
  cau: Nghe trong đầu một cao độ rồi hát là nền tảng của chép giai điệu, đọc thị tấu và chơi theo tai trên phím đàn.
  loai: khuyen-tap
- trang: luyen-tap/hat-lai
  id: n12
  cau: Hát nguyên âm "a" hoặc "la", giữ hơi đều; đừng trượt lên xuống tìm nốt.
  loai: khuyen-tap
- trang: luyen-tap/hoa-bieu
  id: n3
  cau: "Dấu thăng: dấu thăng cuối cùng cộng nửa cung là chủ âm giọng trưởng."
  loai: quy-tac
- trang: luyen-tap/hoa-bieu
  id: n4
  cau: "Dấu giáng: dấu giáng áp chót là tên giọng trưởng; riêng 1 dấu giáng là Fa trưởng."
  loai: quy-tac
- trang: luyen-tap/hoa-bieu
  id: n5
  cau: "Giọng thứ: từ chủ âm giọng trưởng đi xuống 3 nửa cung."
  loai: quy-tac
- trang: luyen-tap/hoa-bieu
  id: n6
  cau: "Vòng quãng năm: vòng ngoài là các giọng trưởng, vòng trong là giọng thứ song song."
  loai: quy-tac
- trang: luyen-tap/hoa-bieu
  id: n7
  cau: Đi theo chiều kim đồng hồ mỗi bước thêm một dấu thăng; ngược chiều thêm một dấu giáng.
  loai: quy-tac
- trang: luyen-tap/hoa-bieu
  id: n2
  cau: Nên bắt đầu với phạm vi đến 4 dấu hóa và giọng trưởng, rồi mở rộng dần.
  loai: khuyen-tap
- trang: luyen-tap/ket-noi-midi
  id: n2
  cau: Nối đàn với máy tính bằng cáp USB (cổng "USB to Host" trên đàn điện) hoặc bộ chuyển MIDI–USB.
  loai: so-lieu
- trang: luyen-tap/ket-noi-midi
  id: n3
  cau: Mở site bằng Chrome, Edge hoặc Opera trên máy tính để dùng MIDI.
  loai: so-lieu
- trang: luyen-tap/ket-noi-midi
  id: n4
  cau: Safari và mọi trình duyệt trên iPhone, iPad chưa hỗ trợ MIDI trên web.
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n1
  cau: BPM (beats per minute) là số phách mỗi phút.
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n9
  cau: Các nhà soạn nhạc ghi tốc độ bằng tiếng Ý ở đầu bản nhạc.
  loai: quy-tac
- trang: luyen-tap/metronome
  id: n10
  cau: Khoảng BPM của các thuật ngữ tốc độ chỉ là gần đúng; nghệ sĩ có quyền diễn giải.
  loai: quy-tac
- trang: luyen-tap/metronome
  id: n11
  cau: "Largo: rất chậm, rộng rãi."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n12
  cau: "Largo: khoảng 40–66 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n13
  cau: "Adagio: chậm, thong thả."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n14
  cau: "Adagio: khoảng 66–76 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n15
  cau: "Andante: vừa phải, như nhịp bước đi."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n16
  cau: "Andante: khoảng 76–108 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n17
  cau: "Moderato: vừa."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n18
  cau: "Moderato: khoảng 108–120 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n19
  cau: "Allegro: nhanh, vui tươi."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n20
  cau: "Allegro: khoảng 120–156 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n21
  cau: "Presto: rất nhanh."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n22
  cau: "Presto: khoảng 168–200 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n3
  cau: "Bắt đầu chậm hơn mức bạn nghĩ mình làm được: chơi đúng ở 60 BPM có ích hơn chơi sai ở 100 BPM."
  loai: khuyen-tap
- trang: luyen-tap/metronome
  id: n4
  cau: Khi đã làm đúng 3 lần liên tiếp thì tăng 2–4 BPM; sai thì lùi lại một nấc.
  loai: khuyen-tap
- trang: luyen-tap/nhat-ky
  id: n18
  cau: "Mốc thời gian gợi ý của năm việc trong ngày: tập đàn 20–45 phút; đọc nốt 5 phút; luyện tai 5 phút; học hoặc ôn nhạc lý 10 phút; nghe chủ động một tác phẩm."
  loai: khuyen-tap
- trang: luyen-tap/nhat-ky
  id: n17
  cau: 'Ghi chú tốt thì ngắn và cụ thể; ví dụ: "Minuet Sol trưởng ô 9–16, ♩ = 72, ba lần liền không vấp. Ô 13 tay trái còn hụt nhịp. Gam Rê trưởng hai tay đã đều." Một tuần sau đọc lại, bạn sẽ thấy rõ mình tiến bộ đến đâu.'
  loai: khuyen-tap
- trang: luyen-tap/phieu-bai-tap
  id: n6
  cau: Tự nhớ lại thay vì chỉ nhận ra đáp án trong các lựa chọn là cách học tốt hơn cho ghi nhớ.
  loai: quy-tac
- trang: luyen-tap/phieu-bai-tap
  id: n7
  cau: Tự kiểm tra bằng cách nhớ lại là một trong những cách học có hiệu quả ghi nhớ cao nhất.
  loai: so-lieu
- trang: luyen-tap/phieu-bai-tap
  id: n13
  cau: "Bài tập viết 5: chép lại 4 ô nhịp đầu của một bản nhạc bạn yêu thích, nghe và kiểm tra."
  loai: khuyen-tap
- trang: luyen-tap/phieu-bai-tap
  id: n8
  cau: Mỗi tuần in 2–3 phiếu, làm không nhìn bài, rồi chấm bằng đáp án.
  loai: khuyen-tap
- trang: luyen-tap/phieu-bai-tap
  id: n10
  cau: "Bài tập viết 2: viết gam thứ hòa âm của Mi, Rê, Sol."
  loai: khuyen-tap
- trang: luyen-tap/thi-tau
  id: n1
  cau: Thị tấu (sight-reading) là đọc và hát hoặc chơi một bản nhạc lần đầu tiên nhìn thấy.
  loai: dinh-nghia
- trang: luyen-tap/thi-tau
  id: n8
  cau: Bắt đầu với Đô trưởng, cấp độ 1, tốc độ 60. Mỗi ngày đọc 3–5 giai điệu là đủ.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau
  id: n6
  cau: Bấm "Đếm vào" rồi hát (bằng tên nốt Đô Rê Mi) hoặc đàn theo nhịp; đừng dừng lại khi sai, giữ nhịp quan trọng hơn đúng từng nốt.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau
  id: n5
  cau: "Nhìn giai điệu khoảng 30 giây: đọc tên nốt, tìm các bước nhảy lớn, để ý hóa biểu."
  loai: khuyen-tap
- trang: luyen-tap/thi-tau-hai-tay
  id: n17
  cau: Khi tự chơi, hãy chọn tốc độ mà bạn chắc chắn không phải dừng, kể cả khi nó chậm hơn nhiều so với tốc độ ghi trên bài.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau-hai-tay
  id: n19
  cau: "Trôi chảy: giữ nhịp từ đầu đến cuối, sai không quá một hai nốt. Vấp vài chỗ: dừng hoặc chậm lại một hai lần. Phải dừng nhiều: dừng ở hầu hết các ô."
  loai: khuyen-tap
- trang: luyen-tap/thi-tau-hai-tay
  id: n21
  cau: "Mỗi ngày đọc 3–5 bài là đủ: thị tấu tiến bộ nhờ đều đặn chứ không nhờ đọc thật nhiều trong một buổi."
  loai: khuyen-tap
- trang: luyen-tap/thu-am
  id: n16
  cau: Loa nhỏ (của điện thoại) làm mất tiếng trầm và bàn đạp.
  loai: quy-tac
- trang: luyen-tap/thu-am
  id: n4
  cau: Khi đang chơi, tai bạn bận với ngón tay và bản nhạc; khi nghe lại, bạn nghe như một khán giả.
  loai: khuyen-tap
- trang: luyen-tap/thu-am
  id: n12
  cau: "Phòng yên tĩnh, đóng cửa sổ: quạt, máy lạnh và tiếng xe ngoài đường lấn mất những chỗ pp."
  loai: khuyen-tap
- trang: luyen-tap/thu-am
  id: n6
  cau: "Thói quen gợi ý: mỗi tuần thu một lần bài đang tập, cùng một đoạn, đặt tên kèm số ô nhịp."
  loai: khuyen-tap
- trang: luyen-tap/tiet-tau
  id: n8
  cau: Đa số người mới có xu hướng gõ sớm.
  loai: so-lieu
- trang: luyen-tap/tiet-tau
  id: n9
  cau: Trên điện thoại, có thể có độ trễ nhỏ giữa lúc chạm và lúc ghi nhận.
  loai: so-lieu
- trang: luyen-tap/tiet-tau
  id: n4
  cau: 'Đếm to khi đọc: "1 – 2 – 3 – 4", và "1 và 2 và…" khi có nốt móc đơn.'
  loai: khuyen-tap
- trang: luyen-tap/tiet-tau
  id: n10
  cau: Nếu luôn bị báo "muộn", hãy dùng máy tính với bàn phím.
  loai: khuyen-tap
- trang: luyen-tap/xay-hop-am
  id: n4
  cau: Quãng ba thứ có 3 nửa cung, quãng ba trưởng có 4 nửa cung.
  loai: dinh-nghia
- trang: luyen-tap/xay-hop-am
  id: n3
  cau: "Với hợp âm: bắt đầu từ nốt gốc, đếm số nửa cung cho từng quãng 3."
  loai: khuyen-tap
