- trang: bat-dau/sach-in
  id: n16
  luot_2: dung
  nguon: ["https://support.mozilla.org/en-US/kb/how-print-web-pages-firefox", "https://support.google.com/chrome/answer/1069693"]
  ghi_chu: "Đã mở trang Mozilla Support (Firefox): trong hộp thoại in, ô Destination có lựa chọn Save to PDF. Trang Chrome Help (answer/1069693) nói in bằng Ctrl/Cmd+P, chọn đích rồi in; nhắc nút Save as PDF nhưng chỉ ở phần Drive, không mô tả riêng ô đích của Chrome. Apple Support (hướng dẫn Safari) mở không ra nội dung in. Câu viết chung (chọn lưu thành PDF) nên đúng."
- trang: bat-dau/sach-in
  id: n18
  luot_2: dung
  nguon: ["https://support.mozilla.org/en-US/kb/how-print-web-pages-firefox"]
  ghi_chu: "Mozilla Support: mục Print headers and footers nằm trong More settings của hộp thoại in. Tắt mục này bỏ tiêu đề, địa chỉ, ngày, số trang khỏi bản in (nhiều hướng dẫn thứ cấp cho Chrome nói tương tự: Headers and footers trong More settings; trang Chrome Help chính thức không mở được phần này)."
- trang: blog/posts/2026-10-21-trong-tam-piano
  id: n3
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn bậc 2 nào nói thẳng điều này (tìm kiếm chỉ ra danh sách tiết mục, không bàn việc một người chơi cả giai điệu lẫn hòa âm). Đây là điều hiển nhiên về cấu tạo piano, không có dấu hiệu sai; chỉ là chưa có link đã mở để ghi dung."
- trang: blog/posts/2026-10-21-trong-tam-piano
  id: n6
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được trang nguồn về kho nhạc piano (Wikipedia Piano repertoire trả 404, Britannica 403). Kết quả tìm kiếm cho thấy các tuyển tập và giáo trình trải từ Bach đến Rachmaninoff, không thấy mâu thuẫn; chưa có link đã mở nên không ghi dung."
- trang: cap-nhat
  id: n34
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Book%3A_Open_Music_Theory/05%3A_Form_(II)_-_Other_Forms_and_Thematic_Structures/5.12%3A_Other_Formal_Structures_in_the_Classical_Style_-_Minuet_Form"]
  ghi_chu: "Open Music Theory 5.12 (Minuet Form, bản LibreTexts) đã mở: tương phản về giọng là đặc điểm trung tâm của trio; khi giữ nguyên chủ âm thì minuet trưởng đi với trio ghi 'minore' và minuet thứ đi với trio 'maggiore'. Khớp với câu (đổi giọng, hoặc đổi trưởng-thứ trên cùng chủ âm). Trang không nêu giọng cụ thể khác."
- trang: cap-nhat
  id: n58
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Piano_Sonata_No._14_(Beethoven)"]
  ghi_chu: "Trang Wikipedia đã mở (dùng vì trích văn bản gốc; Britannica trả 403, PDF của Henle không đọc được chữ): Rellstab so sánh chương 1 (Adagio sostenuto) với mặt hồ dưới ánh trăng, trong truyện Theodor (1824), 'The lake reposes in twilit moon-shimmer'. Lưu ý chi tiết hồ Luzern và chiếc thuyền là do Lenz (1852) thêm, không có trong văn bản Rellstab; câu đang xét chỉ nói 'mặt hồ dưới trăng' nên đúng. Chưa xác nhận bằng henle.de."
- trang: cap-nhat
  id: n80
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Commons: file 'Daniel Veesey - 01 - Sonata 8 Pathetique - I Grave - Allegro di molto e con brio.ogg' dài 6 phút 25 giây (khớp 'khoảng 6:24'), trang file mở ra. Tuy nhiên trang file không nói file bị cắt hay dừng ở đâu, đề tên là cả chương; nên không xác nhận được 'dừng giữa phần phát triển' (cần nghe file). Cũng không đọc được trang hướng dẫn nghe của site (ngoài phạm vi). Số 6:24/6:25 lệch một giây cần chỉnh nếu muốn khớp đúng."
