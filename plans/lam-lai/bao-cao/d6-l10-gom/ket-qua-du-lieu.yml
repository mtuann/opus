  ghi_chu: "ABC: 'The last, crashing orchestral chord dies away, revealing a lone bassoon. This bassoon links the first and second movements'. Bản piano (Schirmer tr. 13) có nốt Si ngân có dấu lặng dài ở chỗ này."
