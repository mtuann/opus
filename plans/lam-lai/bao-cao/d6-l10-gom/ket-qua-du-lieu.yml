  id: n5
  luot_2: dung
  nguon: ["https://archive.org/details/carmenoperainfou1875bize", "https://archive.org/details/carmenopraen4act00bize"]
  ghi_chu: "Libretto 1875 (bản Anh của Hersee): 'La Habanera' gồm hai đoạn lời, sau đoạn 1 là điệp khúc, sau đoạn 2 ghi 'When Love, &c.' (điệp khúc lặp). Bản chant-piano (Choudens, Avanera N° 5, tr. 45–52): điệp khúc có bè Soprani, Tenori, Bassi của hợp xướng ('trema per te') ở cả hai lần."
