- trang: du-lieu/tac-pham/beethoven-5
  id: n12
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)"]
  ghi_chu: "Thời lượng track của các bản thu Naxos trên trang IMSLP (giây, I/II/III/IV): Walter 376/689/356/523; 1960 483/593/347/683; 416/558/297/662; 458/576/337/683; Furtwängler 457/611/349/488; Skrowaczewski 419/572/295/653; 460/641/336/509. Ở mọi bản: III ngắn nhất, II và IV dài hơn I. Tỉ lệ 1 : 1,3 : 0,9 : 1,4 là gần đúng (III thực tế thường còn ngắn hơn, khoảng 0,7–0,8 của I), hợp với chữ 'gần đúng'."
- trang: du-lieu/tac-pham/beethoven-op132
