  ghi_chu: "Tchaikovsky Research và IMSLP: tác phẩm là ballet (thể loại Ballets), viết cho dàn nhạc lớn (bộ gỗ, đồng, bộ gõ nhiều loại, harp, dây). Nhãn 'âm sắc' là trọng tâm luyện nghe, hợp với một bản nhạc ballet cho dàn nhạc."
