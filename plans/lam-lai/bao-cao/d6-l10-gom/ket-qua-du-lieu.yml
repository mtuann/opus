  nguon: ["https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)", "https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van"]
  ghi_chu: "IMSLP: biên chế 2 violin, viola, cello (tứ tấu đàn dây, nhạc thính phòng). Tổng phổ (Dover/Breitkopf, tr. 15): chương III 'Heiliger Dankgesang ... in der lydischen Tonart'."
- trang: du-lieu/tac-pham/beethoven-op132
  id: n6
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van"]
  ghi_chu: "Tổng phổ, chương III: Molto adagio (Lydian, tr. 15) – Andante 'Neue Kraft fühlend' (Rê trưởng, tr. 15) – Molto adagio (tr. 17) – Andante (tr. 17–19) – Molto adagio 'Mit innigster Empfindung' (tr. 20): năm đoạn A – B – A' – B' – A''."
- trang: du-lieu/tac-pham/beethoven-op132
  id: n7
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van", "https://www.latimes.com/entertainment-arts/story/2020-07-02/how-to-listen-beethoven-string-quartet-opus-132-coronavirus"]
  ghi_chu: "Tổng phổ: 'Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart. Molto adagio', viết theo lối hợp xướng thánh ca. LA Times: 'The opening hymn tune ... Being in the Lydian mode'."
- trang: du-lieu/tac-pham/beethoven-op132
  id: n8
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van", "https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)"]
  ghi_chu: "Tổng phổ tr. 15: 'Neue Kraft fühlend. (Sentendo nuova forza.) Andante', hóa biểu hai dấu thăng (Rê trưởng). Tên track trên IMSLP: '... Molto adagio - Neue Kraft fühlend: Andante - Molto adagio'."
- trang: du-lieu/tac-pham/beethoven-op132
  id: n9
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-quartet-no15-op132-beethoven-ludwig-van"]
  ghi_chu: "Tổng phổ tr. 20: đoạn Molto adagio cuối ghi 'Mit innigster Empfindung (Con intimissimo sentimento)' ở cả bốn bè."
