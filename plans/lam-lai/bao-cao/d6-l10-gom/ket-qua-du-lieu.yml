  ghi_chu: "Bản Schirmer (Schradieck, 1923): violin 'Solo' vào từ ô 2. ABC: soloist 'enter almost immediately'; phát triển từ ô 210; cadenza ở cuối phần phát triển (ô 299); 'The return of the first theme in the orchestra signals the beginning of the recapitulation' ngay sau cadenza."
