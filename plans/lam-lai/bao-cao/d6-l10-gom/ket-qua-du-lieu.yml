  ghi_chu: "IMSLP: chương IV 'Tema con variazione. Andantino (D major, 20 bars) + 6 variations'; biên chế violin, viola, cello, contrabass, piano. Tổng phổ: giai điệu chủ đề đổi nhạc cụ qua từng biến tấu (xem n6, n7)."
- trang: du-lieu/tac-pham/schubert-ca-hoi
  id: n6
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-quintet-in-a-major-d667-schubert-franz"]
  ghi_chu: "Tổng phổ tr. 29–31: Thema chỉ đàn dây (piano nghỉ); Var. I giai điệu ở piano; Var. II giai điệu ở viola; Var. III giai điệu ở bè cello và contrabass ('a 2'), piano chạy nốt nhanh."
- trang: du-lieu/tac-pham/schubert-ca-hoi
  id: n7
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-quintet-in-a-major-d667-schubert-franz", "https://archive.org/details/gml-us1860-65-07-schub-trout"]
  ghi_chu: "Tổng phổ: Var. IV hóa biểu một giáng (Rê thứ, tr. 33); Var. V hai giáng (Si♭), giai điệu ở cello (tr. 34–35); 'Allegretto' (Rê trưởng, tr. 36–38) với piano chơi hình liên sáu nốt, đúng hình đệm của ca khúc Die Forelle (bản in 1863, 'Allegretto', liên 6). Độ dài ô 1,2 là cách vẽ của site; Allegretto dài hơn mỗi biến tấu nên hợp lý."
