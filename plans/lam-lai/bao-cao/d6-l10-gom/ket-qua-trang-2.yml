  ghi_chu: 'Ô 57–71: "Du liebes Kind, komm, geh mit mir!", Si giáng trưởng, pp, đệm hợp âm nhẹ thay cho liên ba dồn dập.'
- trang: nghe-nhac/schubert-erlkonig
  id: n23
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: 'Ô 72–85: "Mein Vater, mein Vater, und hörest du nicht…"; cha: "Sei ruhig… In dürren Blättern säuselt der Wind."'
- trang: nghe-nhac/schubert-erlkonig
  id: n24
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: 'Ô 86–104: Vua tinh lần 2 ("Willst, feiner Knabe…"), rồi đứa con kêu lần 2 cao hơn (ô 97).'
- trang: nghe-nhac/schubert-erlkonig
  id: n25
  luot_2: dung
