- trang: nghe-nhac/bizet-habanera
  id: n10
  luot_2: dung
  nguon:
  - "https://web.archive.org/web/2026/https://www.britannica.com/topic/Carmen-opera-by-Bizet"
  ghi_chu: 'Britannica: Carmen, cô gái gypsy ở Seville, và hạ sĩ Don José; José bỏ ngũ, thành kẻ buôn lậu vì Carmen, cuối cùng đâm chết cô.'
- trang: nghe-nhac/bizet-habanera
  id: n11
  luot_2: dung
  nguon:
  - "https://web.archive.org/web/2026/https://www.britannica.com/topic/Carmen-opera-by-Bizet"
  - "https://web.archive.org/web/2026/https://www.britannica.com/biography/Georges-Bizet"
  ghi_chu: 'Britannica (Carmen): bị giới phê bình lên án vì đưa đời sống người bình dân, dân gypsy, buôn lậu, công nhân lên sân khấu; khán giả coi là "immoral and vulgar"; kết thúc José đâm chết Carmen. Britannica (Bizet): "Carmen was initially shocking to audiences".'
- trang: nghe-nhac/bizet-habanera
  id: n12
  luot_2: dung
  nguon:
  - "https://web.archive.org/web/2026/https://www.britannica.com/biography/Georges-Bizet"
  - "https://web.archive.org/web/2026/https://www.britannica.com/topic/Carmen-opera-by-Bizet"
  ghi_chu: 'Britannica: Bizet mất 3/6/1875, "exactly three months after the work''s premiere" (ra mắt 3/3/1875).'
- trang: nghe-nhac/bizet-habanera
  id: n13
  luot_2: dung
  nguon:
  - "https://www.opera-comique.com/sites/default/files/2021-12/2009_Carmen_Document_ALireAvant.pdf"
  - "https://archiv.wiener-staatsoper.at/performances/24878"
  - "https://web.archive.org/web/2026/https://www.britannica.com/topic/Carmen-opera-by-Bizet"
  ghi_chu: 'Opéra-Comique (tài liệu 2009): bản tiếng Đức với recitative của Guiraud diễn ở Vienna ngày 23/10/1875, rồi "dès 1876" ở Bruxelles, Saint-Pétersbourg, Londres, New York, đem lại sự nổi tiếng cho vở. Lưu trữ Wiener Staatsoper: Carmen ở Hofoper ngày 23, 27, 30/10/1875… Britannica: Bizet không sống để thấy vở thành công.'
- trang: nghe-nhac/bizet-habanera
  id: n14
  luot_2: dung
  nguon:
  - "https://web.archive.org/web/2026/https://www.britannica.com/topic/Carmen-opera-by-Bizet"
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'Britannica (tóm tắt màn 1): Carmen bước ra khỏi xưởng thuốc lá, thu hút mọi người và hát Habanera. Bản Schirmer 1923: lời Carmen đầu tiên ("Quand je vous aimerai?") ngay trước No. 5 Habanera.'
- trang: nghe-nhac/bizet-habanera
  id: n15
  luot_2: dung
  nguon:
  - "https://imslp.org/wiki/El_arreglito_(Yradier,_Sebasti%C3%A1n)"
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'IMSLP, El arreglito (Yradier, khoảng 1850): "Basis of the famous Habanera from Carmen by Georges Bizet". Bản Schirmer 1923 chú thích Habanera "Imitated from a Spanish song".'
- trang: nghe-nhac/bizet-habanera
  id: n16
  luot_2: dung
  nguon:
  - "https://www.pbs.org/buenavista/music/a_habanera.html"
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'PBS (Musical Atlas of Cuba): habanera là contradanza kiểu Havana, nét đặc trưng là hình tiết tấu 2/4 lặp lại ở bè trầm; Carmen của Bizet có aria habanera. Bản piano–thanh nhạc: bè trầm piano giữ hình tiết tấu ấy.'
- trang: nghe-nhac/bizet-habanera
  id: n17
  luot_2: dung
  nguon:
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'Bản Schirmer 1923, No. 5: tay trái piano giữ hình tiết tấu habanera (móc đơn chấm, móc kép, hai móc đơn) trên nốt Rê từ ô đầu, lặp suốt bài.'
- trang: nghe-nhac/bizet-habanera
  id: n18
  luot_2: dung
  nguon:
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'Bản Schirmer 1923: hóa biểu một giáng, giai điệu "L''amour est un oiseau rebelle" đi xuống từng nửa cung từ Rê, giọng Rê thứ.'
- trang: nghe-nhac/bizet-habanera
  id: n19
  luot_2: dung
  nguon:
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'Bản Schirmer 1923 tr. 45–47: điệp khúc đổi sang hai thăng (Rê trưởng); Carmen ngân "L''amour!" khi hợp xướng hát "L''amour est un oiseau rebelle"; rồi Carmen hát "L''amour est enfant de Bohême", hợp xướng chen "Prends garde à toi!".'
- trang: nghe-nhac/bizet-habanera
  id: n20
  luot_2: dung
  nguon:
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'Bản Schirmer 1923 tr. 49: lời thứ hai "L''oiseau que tu croyais surprendre", trở lại một giáng, giai điệu nửa cung đi xuống.'
- trang: nghe-nhac/bizet-habanera
  id: n21
  luot_2: dung
  nguon:
  - "https://archive.org/details/carmenoperainfou00bize_0"
  ghi_chu: 'Bản Schirmer 1923 tr. 52–54: hợp xướng hát "L''amour est enfant de Bohême"; kết bằng "prends garde à toi!" của Carmen và hợp xướng, f, piano ff.'
- trang: nghe-nhac/bizet-habanera
