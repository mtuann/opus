  id: n10
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: 'Lời trong bản nhạc: "Wer reitet so spät durch Nacht und Wind? Es ist der Vater mit seinem Kind"; cha nói đó là "Nebelstreif"; câu cuối "Erreicht den Hof mit Müh'' und Not; In seinen Armen das Kind war tot."'
- trang: nghe-nhac/schubert-erlkonig
  id: n11
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: Bản nhạc viết cho một giọng hát, lời gồm người kể, cha, con, Vua tinh, mỗi vai có giọng, âm vực và cách đệm riêng.
- trang: nghe-nhac/schubert-erlkonig
  id: n12
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: 'Ô 15–32 (người kể): giai điệu quanh Rê4–Rê5, không lên quá cao hay xuống quá thấp.'
- trang: nghe-nhac/schubert-erlkonig
  id: n13
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: Lời cha ("Mein Sohn, was birgst du…", "Mein Sohn, es ist ein Nebelstreif") nằm thấp, bắt đầu từ Rê4 và thấp hơn.
- trang: nghe-nhac/schubert-erlkonig
  id: n14
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: Ba lần "Mein Vater, mein Vater" (ô 72–73, 97–98, 123–124) bắt đầu lần lượt cao dần (Rê–Mi, Mi–Fa, Fa–Sol giáng), có nốt nghịch với bè trầm.
- trang: nghe-nhac/schubert-erlkonig
  id: n15
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: Lời Vua tinh lần 1 (ô 57) ở Si giáng trưởng, pp; lần 2 (ô 86) ở Đô trưởng, ppp; đệm nhẹ đi.
- trang: nghe-nhac/schubert-erlkonig
  id: n16
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: 'Tay phải: hợp âm, quãng tám lặp liên ba suốt bài, f từ ô 1.'
- trang: nghe-nhac/schubert-erlkonig
  id: n17
  luot_2: dung
  nguon:
  - "https://www.mutopiaproject.org/ftp/SchubertF/D328/Erlkoenig/Erlkoenig-a4.pdf"
  ghi_chu: 'Tay trái ô 2–3: nhóm liên ba chạy lên Sol–La–Si giáng–Đô–Rê–Mi giáng rồi đi xuống Rê, Si giáng, Sol ở âm vực trầm; lặp nhiều lần.'
- trang: nghe-nhac/schubert-erlkonig
  id: n18
  luot_2: khong-chac
  nguon: []
  ghi_chu: IMSLP ghi bốn bản soạn (bản 1–3 in trong Schubert's Werke, Breitkopf 1895), nhưng không mô tả cách viết đệm; PDF trên IMSLP không tải được, chưa đọc được bản 3 để xác nhận nhóm hai nốt móc đơn thay liên ba. Chỉ Wikipedia nói điều này.
- trang: nghe-nhac/schubert-erlkonig
