- trang: nghe-nhac/bizet-habanera
  id: n1
  cau: 'Tiêu đề: Bizet, Habanera (trong opera Carmen).'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n2
  cau: 'Mô tả trang: Carmen kể chuyện cô gái Digan tự do, quyến rũ ở Seville và người lính
    Don José, người vì cô mà đánh mất tất cả; ở buổi công diễn đầu, vở opera gây sốc vì đưa…'
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n3
  cau: 'Nhà soạn nhạc: Georges Bizet (1838–1875).'
  loai: nam
- trang: nghe-nhac/bizet-habanera
  id: n4
  cau: 'Tác phẩm: opera Carmen.'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n5
  cau: 'Công diễn: 1875, Opéra-Comique, Paris.'
  loai: nam
- trang: nghe-nhac/bizet-habanera
  id: n6
  cau: 'Aria: L''amour est un oiseau rebelle (Tình yêu là con chim nổi loạn), màn 1.'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n7
  cau: 'Giọng: mezzo-soprano.'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n8
  cau: 'Độ dài: khoảng 4–5 phút.'
  loai: so-lieu
- trang: nghe-nhac/bizet-habanera
  id: n9
  cau: 'Bản thu gợi ý: Elīna Garanča, Metropolitan Opera (2010).'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n10
  cau: Carmen kể chuyện cô gái Digan tự do, quyến rũ ở Seville và người lính Don José, người
    vì cô mà đánh mất tất cả.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n11
  cau: Ở buổi công diễn đầu, vở opera gây sốc vì đưa những nhân vật bình dân, thô ráp lên
    sân khấu và kết thúc bằng một vụ án mạng.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n12
  cau: Bizet mất ba tháng sau buổi công diễn đầu (3/6/1875).
  loai: nam
- trang: nghe-nhac/bizet-habanera
  id: n13
  cau: Bizet không kịp thấy Carmen thành công trọn vẹn ở Vienna vào tháng 10/1875, rồi ở Brussels,
    St. Petersburg, London, New York.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n14
  cau: Habanera là màn ra mắt của Carmen.
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n15
  cau: Bizet dựa trên bài El arreglito của nhà soạn nhạc Tây Ban Nha Sebastián Yradier.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n16
  cau: Habanera là điệu nhảy gốc Cuba; Bizet dùng tiết tấu habanera ở bè trầm.
  loai: dinh-nghia
- trang: nghe-nhac/bizet-habanera
  id: n17
  cau: 'Theo dõi, dòng 1: bè trầm bắt đầu tiết tấu habanera, lặp lại suốt bài như nhịp bước
    uốn lượn.'
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n18
  cau: 'Theo dõi, dòng 2: Carmen hát câu đầu, giai điệu đi xuống từng nửa cung, ở giọng Rê
    thứ.'
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n19
  cau: 'Theo dõi, dòng 3: điệp khúc chuyển sang Rê trưởng, sáng rõ; Carmen ngân "L''amour!"
    trong khi hợp xướng hát lại câu đi xuống; rồi Carmen hát "L''amour est enfant de Bohême",
    hợp xướng xen tiếng "Prends garde à toi!".'
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n20
  cau: 'Theo dõi, dòng 4: lời thứ hai, giai điệu nửa cung trở lại.'
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n21
  cau: 'Theo dõi, dòng 5: điệp khúc lần hai: hợp xướng hát lại "L''amour est enfant de Bohême",
    Carmen và hợp xướng cùng kết bằng "Prends garde à toi!" thật mạnh.'
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n26
  cau: 'Nguồn: bản nhạc và tổng phổ trên IMSLP (tìm theo tên nhà soạn nhạc và số hiệu danh
    mục).'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n27
  cau: 'Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online.'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n28
  cau: 'Nguồn: thứ tự các đoạn, giọng và bè trầm trong khuông nhạc theo bản piano–thanh nhạc
    của Choudens (Paris, khoảng 1900) và G. Schirmer (New York, 1895), bản quét trên Internet
    Archive.'
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n23
  cau: Ba câu hỏi nghe chủ động (giai điệu nửa cung và tính cách Carmen; giọng thứ sang trưởng;
    tiết tấu habanera trong bài hát hiện đại).
  loai: khuyen-tap
- trang: nghe-nhac/schubert-erlkonig
  id: n1
  cau: 'Tiêu đề: Schubert, Erlkönig (Vua tinh).'
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n2
  cau: 'Mô tả trang: một người cha ôm đứa con nhỏ phi ngựa trong đêm lộng gió; đứa trẻ thấy
    Vua tinh hiện ra dụ dỗ mình, người cha không thấy gì; khi về đến nhà, đứa trẻ đã…'
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n3
  cau: 'Nhà soạn nhạc: Franz Schubert (1797–1828).'
  loai: nam
- trang: nghe-nhac/schubert-erlkonig
  id: n4
  cau: 'Lời: bài thơ Erlkönig của Johann Wolfgang von Goethe.'
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n5
  cau: 'Sáng tác: 1815, khi Schubert 18 tuổi (D. 328).'
  loai: nam
- trang: nghe-nhac/schubert-erlkonig
  id: n6
  cau: 'Thời kỳ: Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n7
  cau: 'Thể loại: Lied (ca khúc nghệ thuật) cho giọng hát và piano.'
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n8
  cau: 'Độ dài: khoảng 4 phút.'
  loai: so-lieu
- trang: nghe-nhac/schubert-erlkonig
  id: n9
  cau: 'Bản thu gợi ý: Dietrich Fischer-Dieskau (baritone) và Gerald Moore (piano).'
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n10
  cau: Một người cha ôm đứa con nhỏ phi ngựa trong đêm lộng gió. Đứa trẻ thấy Vua tinh hiện
    ra dụ dỗ mình, nhưng người cha không nhìn thấy gì. Khi về đến nhà, đứa trẻ đã chết.
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n11
  cau: Một ca sĩ hát cả bốn vai, và Schubert cho mỗi vai một "giọng" riêng.
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n12
  cau: 'Người kể chuyện: âm vực giữa, trung tính.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n13
  cau: 'Người cha: âm vực thấp, bình tĩnh, trấn an.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n14
  cau: 'Đứa con: âm vực cao, hoảng loạn; mỗi lần kêu lại cao hơn một chút.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n15
  cau: 'Vua tinh: ngọt ngào, êm ái, ở giọng trưởng, rất nhỏ (pp).'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n16
  cau: 'Piano không chỉ đệm: tiếng nốt liên ba lặp lại không ngừng ở tay phải là tiếng vó
    ngựa phi trong đêm.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n17
  cau: Tay trái là một chuỗi nốt liên ba chạy lên rồi xuống ở âm vực trầm, tối và đầy đe dọa.
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n18
  cau: 'Phần piano này rất khó: trong một bản soạn khác của bài, chính Schubert đã viết lại
    các nhóm liên ba thành nhóm hai nốt móc đơn dễ hơn.'
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n19
  cau: 'Theo dõi, dòng 1: piano mở đầu: vó ngựa liên ba, giai điệu trầm cuộn lên ở tay trái.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n20
  cau: 'Theo dõi, dòng 2: người kể chuyện giới thiệu cảnh: người cha và đứa con trong đêm.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n21
  cau: 'Theo dõi, dòng 3: cha hỏi con sợ gì; con thấy Vua tinh; cha trấn an: chỉ là sương
    mù.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n22
  cau: 'Theo dõi, dòng 4: Vua tinh lần 1: dỗ dành ngọt ngào, nhạc chuyển sang giọng trưởng,
    nhẹ hơn.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n23
  cau: 'Theo dõi, dòng 5: đứa con kêu "Cha ơi!" lần 1; cha trấn an: chỉ là gió xào xạc.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n24
  cau: 'Theo dõi, dòng 6: Vua tinh lần 2, rồi đứa con kêu lần 2, cao hơn.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n25
  cau: 'Theo dõi, dòng 7: Vua tinh lần 3: đe dọa, dùng sức mạnh. Đứa con kêu lần 3, cao nhất.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n26
  cau: 'Theo dõi, dòng 8: người cha phi nhanh hơn, piano dồn dập.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n27
  cau: 'Theo dõi, dòng 9: về đến nơi: piano ngừng, người kể nói rằng đứa con đã chết, gần
    như bằng giọng nói.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n30
  cau: 'Nguồn: bản nhạc và tổng phổ trên IMSLP (tìm theo tên nhà soạn nhạc và số hiệu danh
    mục).'
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n31
  cau: 'Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online.'
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n32
  cau: 'Nguồn: giọng, cách viết cho từng vai và khuông nhạc theo bản Edition Peters (Schubert-Album,
    tập 1, Max Friedlaender biên tập, khoảng 1890), bản quét trên Internet Archive; tốc độ
    Schnell, ♩ = 152 theo bản ấy.'
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n28
  cau: Ba câu hỏi nghe chủ động (phân biệt bốn nhân vật; vì sao Vua tinh ở giọng trưởng và
    rất nhỏ; cảm giác khi piano dừng ở câu cuối).
  loai: khuyen-tap
- trang: nghe-nhac/tchaikovsky-1812
  id: n1
  cau: 'Tiêu đề: Tchaikovsky, 1812 Overture.'
  loai: ten
- trang: nghe-nhac/tchaikovsky-1812
  id: n2
  cau: 'Mô tả trang: Tchaikovsky viết tác phẩm từ tháng 9 đến tháng 11/1880, theo đặt hàng
    của Nikolai Rubinstein, cho Triển lãm Nghệ thuật và Công nghiệp toàn Nga ở Moscow; buổi
    ra mắt chính thức…'
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n3
  cau: 'Nhà soạn nhạc: Pyotr Ilyich Tchaikovsky (1840–1893).'
  loai: nam
- trang: nghe-nhac/tchaikovsky-1812
  id: n4
  cau: 'Tên đầy đủ: overture lễ hội Năm 1812 (1812 год).'
  loai: ten
- trang: nghe-nhac/tchaikovsky-1812
  id: n5
  cau: 'Số danh mục và giọng: Op. 49, Mi♭ trưởng.'
  loai: danh-muc
- trang: nghe-nhac/tchaikovsky-1812
  id: n6
  cau: Sáng tác tháng 9–11/1880.
  loai: nam
- trang: nghe-nhac/tchaikovsky-1812
  id: n7
  cau: Ra mắt chính thức ngày 20/8/1882 ở Moscow.
  loai: nam
- trang: nghe-nhac/tchaikovsky-1812
  id: n8
  cau: 'Thời kỳ: Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n9
  cau: 'Thể loại: overture hòa nhạc cho dàn nhạc giao hưởng lớn, thêm chuông, "đại bác" và
    ban nhạc kèn (tùy chọn).'
  loai: ten
- trang: nghe-nhac/tchaikovsky-1812
  id: n10
  cau: 'Độ dài: khoảng 15 phút.'
  loai: so-lieu
- trang: nghe-nhac/tchaikovsky-1812
  id: n11
  cau: Tchaikovsky viết tác phẩm từ tháng 9 đến tháng 11/1880, theo đặt hàng của Nikolai Rubinstein,
    cho Triển lãm Nghệ thuật và Công nghiệp toàn Nga ở Moscow.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n12
  cau: Trong các dịp được gợi ý lúc đặt hàng có lễ thánh hiến Nhà thờ Chúa Cứu thế.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n13
  cau: Bản in đầu ghi overture "viết cho dịp thánh hiến Nhà thờ Chúa Cứu thế".
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n14
  cau: Nhà thờ Chúa Cứu thế dựng để tưởng niệm chiến thắng của Nga trước Napoleon năm 1812.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n15
  cau: Triển lãm dời sang năm 1882; buổi ra mắt chính thức ngày 20/8/1882 ở hội trường của
    triển lãm, Ippolit Altani chỉ huy.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n16
  cau: Trước buổi ra mắt chính thức đã có hai buổi diễn cùng năm 1882, ở Ozerki và Pavlovsk.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n17
  cau: Tchaikovsky kể lại cuộc chiến bằng âm nhạc, với hai "phe" được đại diện bằng hai bài
    quốc ca của thời ông.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n18
  cau: 'Phe Pháp (quân xâm lược): quốc ca Pháp La Marseillaise.'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n19
  cau: 'Phe Nga: lời cầu nguyện Lạy Chúa, xin cứu dân Ngài (cầu chiến thắng nơi chiến trận),
    hai giai điệu Nga, rồi cuối cùng là quốc ca Nga hoàng God Save the Tsar! (bài này viết
    năm 1833).'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n20
  cau: Marseillaise trở lại nhiều lần, rồi lần cuối ở cao trào, sau đó tiếng đại bác nổ và
    dàn nhạc đổ xuống.
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n21
  cau: Lời cầu nguyện mở đầu trở lại cùng chuông, và tác phẩm khép bằng God Save the Tsar!
    với chuông và đại bác.
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n22
  cau: Tổng phổ ghi "đại bác", nhưng Tchaikovsky muốn dùng chiếc trống lớn treo mà nhà hát
    vẫn dùng để giả tiếng đại bác.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n23
  cau: Ở các buổi diễn ngoài trời, như đêm 4/7 của Boston Pops từ năm 1974, người ta dùng
    đại bác thật.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n24
  cau: Lúc viết, Tchaikovsky cho rằng overture "sẽ rất to và ồn ào", và vì viết không có tình
    cảm nồng nhiệt nên có lẽ thiếu giá trị nghệ thuật.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n25
  cau: Từ buổi ra mắt, overture luôn nằm trong số tác phẩm được biết đến và được diễn nhiều
    nhất của Tchaikovsky; chính ông chỉ huy nó 13 lần, nhiều hơn mọi tác phẩm khác của mình.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n26
  cau: 'Bảng Theo dõi, dòng 1: mở đầu chậm (Largo): lời cầu nguyện Lạy Chúa, xin cứu dân Ngài,
    viola và cello chơi một mình, rồi kèn gỗ đáp.'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n27
  cau: 'Dòng 2: nhịp quân hành (Andante): oboe, clarinet và kèn horn chơi một hiệu kèn trên
    tiếng trống con rền.'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n28
  cau: 'Dòng 3: Allegro giusto: dàn dây đuổi nhau dồn dập; rồi kèn horn chơi một đoạn La Marseillaise
    — phe Pháp.'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n29
  cau: 'Dòng 4: hai giai điệu Nga: giai điệu trữ tình ở violin và viola, rồi bài dân ca Bên
    cổng ở sáo và cor anglais, trên tiếng trống lục lạc.'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n30
  cau: 'Dòng 5: trận chiến: Marseillaise trở lại nhiều lần, đan với nhạc Nga.'
