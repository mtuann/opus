- trang: nghe-nhac/tchaikovsky-1812
  id: n1
  cau: "Tiêu đề: Tchaikovsky, 1812 Overture."
  loai: ten
  nguon:
    - ten: "Tchaikovsky Research, The Year 1812 (Op. 49, TH 49, ČW 46), bản 27/7/2024 (oldid 67985): \"festival overture The Year 1812 (1812 год) in E-flat major … popularly known as the 1812 Overture\"; \"composed and orchestrated between September and November 1880\"; đặt hàng cho Triển lãm Nghệ thuật và Công nghiệp toàn Nga ở Moscow; ba lựa chọn gợi ý, trong đó có cantata cho lễ thánh hiến \"nearly completed Cathedral of Christ the Saviour, which was built to commemorate Napoleon's defeat\"; chú thích 1: bản in đầu có phụ đề \"composed for the occasion of the consecration of the Church of the Saviour\"; biên chế (… 4 horns, 2 cornets, 2 trumpets, 3 trombones, tuba + timpani, triangle, tambourine, side drum, cymbals, bass drum, bells, cannon …, optional military band in the coda); cannon là \"the large suspended drum which is beaten like a gran cassa\"; \"428 bars, lasting around 15 to 20 minutes\"; thư 10/22/10/1880: \"The Overture will be very loud and noisy—but I wrote it without any warm and loving feelings, and consequently it will probably be lacking in artistic merit\"; triển lãm hoãn vì Alexander II bị ám sát; ra mắt chính thức 8/20/8/1882 ở hội trường triển lãm, Ippolit Altani; hai buổi sớm hơn ở Ozerki (20/7/1882) và Pavlovsk (12/8/1882); \"among the best-known and most frequently performed of Tchaikovsky's works\"; \"Tchaikovsky conducted 1812 a total of thirteen times — more than any of his other works\"; chủ đề mở đầu (ô 1–36, 358–379) là lời cầu nguyện \"Lord, preserve thy people\"; chủ đề trữ tình (ô 164, 278) từ opera The Voyevoda; dân ca \"By the Gates\" (ô 207, 299); Marseillaise ô 119, 149, 229, 267, 307; God Save the Tsar (Lvov, 1833) ô 388–398"
      link: https://en.tchaikovsky-research.net/pages/The_Year_1812
    - ten: 'IMSLP, 1812 Overture, Op.49 (Tchaikovsky, Pyotr), wikitext qua api.php: Alternative Title "The Year 1812 / 1812 год"; Op.49 ; TH 49 ; ČW 46; Key Eb; Largo—Allegro giusto (428 bars); Year/Date of Composition 1880; First Performance "1882/8/20 in Moscow, Art & Industry Exhibition: Ippolit Altani"; Average Duration 15 minutes; Piece Style Romantic; trang có tổng phổ và bè'
      link: https://imslp.org/wiki/1812_Overture,_Op.49_(Tchaikovsky,_Pyotr)
  ket_qua_luot_1: dung
  ghi_chu: 'Tchaikovsky Research: "popularly known as the 1812 Overture".'
