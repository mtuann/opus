- trang: nghe-nhac/beethoven-5
  id: n15
  cau: "Chương 1: Allegro con brio, Đô thứ, hình thức sonata."
  loai: cau-truc
  nguon:
    - ten: 'IMSLP, Symphony No.5, Op.67 (Beethoven): 4 chương "Allegro con brio (c, 502 bars)", "Andante con moto (Ab, 247 bars)", "Scherzo. Allegro (c) - Trio (C, 374 bars)", "Allegro (C, 446 bars)"; Average Duration 30 minutes; Year/Date of Composition 1804-08; First Performance "1808-12-22 in Vienna, Theater an der Wien … Ludwig van Beethoven (conductor)"; Piece Style Classical (wikitext qua api.php, 06/11/2026)'
      link: https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)
    - ten: 'Tổng phổ Symphony No. 5 C minor, Op. 67, Edition Eulenburg No. 402 (E.E. 3602), Max Unger hiệu đính, lời tựa Wilhelm Altmann; bản quét Internet Archive symphonyno5cmino0000unse (Alverno College Library). Trang tên: "First performed in Vienna, December 22nd, 1808 under the direction of Beethoven"; trang 1: "Allegro con brio (𝅗𝅥=108)"; lời tựa (tr. VIII): Beethoven ghi máy đếm nhịp về sau, in trong Allgemeine musikalische Zeitung ngày 17/12/1817'
      link: https://archive.org/details/symphonyno5cmino0000unse
    - ten: 'Burgess Hill Symphony Orchestra, chú giải Beethoven: Symphony No. 5: "The motto, played fortissimo in octaves by the strings"; "a horn call – an expanded version of the motto – introduces the second subject"; chương 1 "plaintive oboe cadenza"; chương 2 "a set of orchestral variations based on two separate themes"; chương 3 "a scherzo and trio in the key of C minor", "the horns begin hammering out a simplified version of the motto rhythm"; "The music then stops, apart from the quiet yet insistent tapping of a drum"; "the full orchestra begins the triumphant final allegro"; chương 4 "another sonata principle movement, in the key of C major"; motto "permeate[s] virtually the entire piece"; công diễn "at the Theater an der Wien in Vienna on December 22nd"'
      link: https://www.bhso.org.uk/work/beethoven-symphony-no-5/
  ket_qua_luot_1: dung
  ghi_chu: 'Tổng phổ: trình bày ô 1–124 có dấu nhắc lại, phát triển từ ô 125, tái hiện (oboe Adagio ô 268), coda tới ô 502. BHSO gọi chương 4 là "another sonata principle movement" (chương 1 cũng vậy).'
- trang: nghe-nhac/schubert-ca-hoi
  id: n25
  cau: "Theo dõi, Allegretto cuối: trở về Rê trưởng; piano chơi hình đệm róc rách của ca khúc gốc, như con cá hồi lại tung tăng."
  loai: cau-truc
  nguon:
    - ten: "Schubert, Quintet in A Major, Op. 114 («Trout»), tổng phổ (bản khắc cũ, cello và contrabass chung một khuông «Violoncello e Basso»), Internet Archive imslp-quintet-in-a-major-d667-schubert-franz, file SchubertPianoQuintetD667.pdf: chương 4 tr. 29–38 (Thema, Var. I–V, Allegretto)"
      link: https://archive.org/details/imslp-quintet-in-a-major-d667-schubert-franz
    - ten: "Schubert-Album, Band I (Friedlaender), Leipzig: C. F. Peters, khoảng 1890, Internet Archive schubertalbumsam00schu_0: Die Forelle Op. 32, tr. 197–199 (lời «In einem Bächlein helle … die launische Forelle … Er macht das Bächlein tückisch trübe»; đệm piano có hình móc kép rải sáu nốt); chú giải: «Komponiert 1817»"
      link: https://archive.org/details/schubertalbumsam00schu_0
    - ten: "Chris Darwin (University of Sussex), ghi chú chương trình Piano Quintet D.667: «cellist friend Sylvester Paumgartner commissioned»; lời Stadler: «the particular request of my friend Sylvester Paumgartner, who was quite taken with the delicate little song. The Quintet, according to his wish, was to adopt the structure and instrumentation of Hummel's Quintet»; contrabass thêm vào violin, viola, cello của tứ tấu piano; «liberate the piano from providing the deep bass, and (in the third variation) send it off on brilliant high octave passage work while the cello and bass, also in octaves, growl the theme»; hình rải của phần đệm Die Forelle «leaps into action in the final variation»"
      link: https://users.sussex.ac.uk/~cjd/WebProgNotes/pdfs/SchubertTrout.pdf
  ket_qua_luot_1: dung
  ghi_chu: "Tổng phổ tr. 36: «Allegretto», hai thăng; tay phải piano hình móc kép rải (lặng móc kép rồi liên ba), như đệm của Die Forelle (Peters tr. 197); violin rồi cello hát giai điệu. Sussex: hình rải của phần đệm Die Forelle «leaps into action in the final variation». Ấn bản này đánh số Var. I–V rồi ghi Allegretto (IMSLP đếm là biến tấu 6)."
- trang: nghe-nhac/tchaikovsky-1812
  id: n31
  cau: "Dòng 6: cao trào: tiếng đại bác nổ, rồi dàn nhạc đổ xuống, chậm dần."
  loai: cau-truc
  nguon:
    - ten: "Tổng phổ nghiên cứu Tchaikovsky, Torzhestvennaia uvertiura \"1812 god\" / Festival Overture \"The Year 1812\", Op. 49, Moskva: Muzyka 1983 (pl. 11838), Internet Archive 31761034924530 (đọc ảnh trang bằng PyMuPDF): tr. 3 Largo ♩=60, \"2 sole\" viola và \"4 soli\" cello chơi một mình; tr. 4 kèn gỗ đáp; [3] Andante: oboe, clarinet, bassoon, horn trên Tamburo (trống con) rền và timpani; [4] Allegro giusto ♩=138 (khoảng ô 95), dàn dây đuổi nhau; ô 119: horn \"f marc.\" chơi đoạn Marseillaise; [7] L'istesso tempo: giai điệu trữ tình ở violin và viola; [9]: dân ca ở sáo và cor anglais, Tamburino (trống lục lạc); [15] (khoảng ô 327): Cannone nổ cùng cả dàn nhạc ff; khoảng ô 343–357 dàn nhạc đi xuống, sempre rallentando; [16] Largo (khoảng ô 358): Banda, kèn gỗ, kèn đồng fff, Campane rung; coda Allegro vivace có Cannone. Danh sách dàn nhạc có Campane, Cannone, Banda (ad libitum)"
      link: https://archive.org/details/31761034924530
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Marseillaise gãy vụn, sụp đổ". Lý do: tổng phổ: sau lần trích cuối (ô 307), [15] cả dàn nhạc ff với Cannone; rồi các bè đi xuống, "sempre rallentando" (khoảng ô 343–357) trước Largo. "Marseillaise gãy vụn" không thấy trong bản nhạc ở đoạn này; viết theo bản nhạc. Đại bác đầu tiên ở đây (dòng cũ chỉ đặt đại bác ở dòng cuối). Review D6-L10-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
