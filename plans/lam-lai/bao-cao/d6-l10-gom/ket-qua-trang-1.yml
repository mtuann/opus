  ghi_chu: "Tổng phổ trang 33: Var. IV hóa biểu một dấu giáng (Rê thứ), ff, piano hợp âm liên ba dồn dập. So sánh với nước suối bị khuấy là hình ảnh diễn giải (West Cork, HK Phil dùng hình ảnh tương tự)."
