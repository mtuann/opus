  ghi_chu: "Tổng phổ trang 34–35: Var. V hóa biểu hai dấu giáng (Si♭ trưởng), cello chơi giai điệu biến đổi pp; HK Phil: 'doleful version of theme given out by a high cello'."
- trang: nghe-nhac/schubert-ca-hoi
