  ghi_chu: "Tổng phổ trang 29: Var. I piano chơi giai điệu quãng tám ở vùng cao, violin, viola, cello trang trí (láy, móc ba), contrabass pizz.; HK Phil: 'the theme given out in octaves by the piano'."
