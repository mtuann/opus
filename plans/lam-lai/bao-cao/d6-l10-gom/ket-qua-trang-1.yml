    - https://www.laphil.com/musicdb/pieces/4500/violin-concerto-in-e-minor-op-64
  ghi_chu: "Aspen (Ledbetter): khi Mendelssohn làm giám đốc các buổi hòa nhạc Gewandhaus, ông đặt David làm concertmaster; LA Phil cũng nói vậy."
- trang: nghe-nhac/mendelssohn-violin
  id: n11
  luot_2: dung
  nguon:
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
    - https://www.laphil.com/musicdb/pieces/4500/violin-concerto-in-e-minor-op-64
  ghi_chu: "Aspen: 'David was Mendelssohn's adviser on matters of technical detail regarding the solo part'; thư từ hai người suốt nhiều năm; LA Phil: chia sẻ phác thảo với David, 'soliciting practical advice ... at every stage'."
- trang: nghe-nhac/mendelssohn-violin
  id: n12
  luot_2: dung
  nguon:
    - https://sites.google.com/site/edwardlein/Home/program-notes/felix-mendelssohn/mendelssohn-violin-concerto
  ghi_chu: "Edward Lein (ghi chú chương trình): 'remains among the most-frequently performed and recorded concertos ever written'. Nguồn là ghi chú chương trình, không có số liệu thống kê; câu viết 'một trong những' nên chấp nhận được."
- trang: nghe-nhac/mendelssohn-violin
  id: n13
  luot_2: dung
  nguon:
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
  ghi_chu: "Aspen (Ledbetter) nêu đúng ba điểm: bỏ đoạn ritornello của dàn nhạc (violin vào sau hai ô 'curtain'), cadenza đặt giữa chương nối phát triển và tái hiện, các chương nối liền không ngắt."
- trang: nghe-nhac/mendelssohn-violin
  id: n15
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ Breitkopf (Partitur-Bibliothek, Part. B. 480), trang 1: ô 1 dàn dây chơi móc đơn p, violin độc tấu nghỉ ô 1 và nửa đầu ô 2, vào ở phách 3 ô 2 (sau một ô rưỡi)."
- trang: nghe-nhac/mendelssohn-violin
  id: n16
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
  ghi_chu: "Tổng phổ trang 17–18: 'Cadenza ad libitum' viết sẵn đủ nốt, sau đó dàn nhạc vào lại chủ đề chính (tái hiện) trong khi violin rải hợp âm; Aspen: cadenza đặt 'in the heart of the movement', hoàn tất phát triển và mở đầu tái hiện."
- trang: nghe-nhac/mendelssohn-violin
  id: n17
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
  ghi_chu: "Tổng phổ trang 27: cuối chương 1 cả dàn nhạc ngắt, chỉ Fagotto 1 giữ nốt Si (có fermata) rồi đi lên Đô sang Andante; Aspen: 'the first bassoon fails to cut off ... holds his note'."
- trang: nghe-nhac/mendelssohn-violin
  id: n18
  luot_2: dung
  nguon:
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
  ghi_chu: "Aspen (Ledbetter): 'The obvious intention here is to forestall intrusive applause after the first movement'. Đây là diễn giải của người viết ghi chú (kèm lý do Mendelssohn muốn các chương nối liền), không phải lời Mendelssohn; câu trong trang khẳng định chắc hơn nguồn một chút."
- trang: nghe-nhac/mendelssohn-violin
  id: n19
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ trang 1: Allegro molto appassionato, dàn dây rải móc đơn p (rì rầm), violin vào với chủ đề ở Mi thứ, đi lên vùng cao (Si5 tới Mi6, Sol6). 'Khao khát' là cảm nhận, không cần nguồn."
- trang: nghe-nhac/mendelssohn-violin
  id: n20
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
  ghi_chu: "Tổng phổ trang 9: chủ đề 2 ở Sol trưởng do Flauti và Clarinetti chơi pp ('tranq.'), violin giữ nốt Sol buông (dây Sol) nhiều ô; Aspen tả đúng như vậy."
- trang: nghe-nhac/mendelssohn-violin
  id: n21
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ trang 17: cadenza violin một mình, hợp âm rải nhanh (về cuối thành chùm móc kép ricochet qua các dây)."
- trang: nghe-nhac/mendelssohn-violin
  id: n22
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ trang 17–18: violin tiếp tục rải hợp âm (segue) trong khi sáo, oboe và violin I vào lại chủ đề chính pp."
- trang: nghe-nhac/mendelssohn-violin
  id: n23
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ trang 27: Fagotto giữ nốt Si khi dàn nhạc đã dừng, nối thẳng vào Andante."
- trang: nghe-nhac/mendelssohn-violin
  id: n24
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ trang 27–28: Andante 6/8, không hóa biểu (Đô trưởng), violin hát giai điệu p."
- trang: nghe-nhac/mendelssohn-violin
  id: n25
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ trang 37: Allegretto non troppo, hóa biểu một dấu thăng, violin và dàn dây (đoạn ngắn 14 ô, có fermata) ở Mi thứ, 'espress.', trước Allegro molto vivace."
- trang: nghe-nhac/mendelssohn-violin
  id: n26
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
  ghi_chu: "Tổng phổ trang 37–38: Allegro molto vivace bốn dấu thăng (Mi trưởng), kèn đồng và bassoon gọi ff, violin 'scherzando', 'leggiero'; Aspen: chương cuối là ví dụ của 'fairy music' riêng của Mendelssohn. So sánh với Giấc mộng đêm hè là diễn giải phổ biến; nguồn nói 'fairy music', không nêu tên Giấc mộng đêm hè."
- trang: nghe-nhac/mendelssohn-violin
  id: n27
  luot_2: dung
  nguon:
    - https://www.aspenmusicfestival.com/program_notes/view/mendelssohn-violin-concerto-in-e-minor-op.-64
  ghi_chu: "Aspen: concerto truyền thống mở bằng đoạn ritornello dài của dàn nhạc trước khi nghệ sĩ độc tấu vào; Mendelssohn bỏ hẳn. Nguồn nói 'concerto truyền thống' (và Beethoven), không nêu tên Mozart, nhưng concerto của Mozart theo mẫu ritornello mở đầu ấy."
- trang: nghe-nhac/mendelssohn-violin
  id: n28
  luot_2: dung
  nguon:
    - https://archive.org/details/ldpd_11898794_000
  ghi_chu: "Tổng phổ trang 18: hết cadenza (a tempo, arpeggio) thì sáo, oboe, clarinet, kèn, timpani, dàn dây vào lại pp."
