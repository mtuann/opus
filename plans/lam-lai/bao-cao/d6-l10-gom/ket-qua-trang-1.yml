    - https://www.hkphil.org/watch-and-listen/all-performances/schubert-s-trout-quintet
  ghi_chu: "Tổng phổ trang 36: Allegretto, Rê trưởng, piano chơi hình đệm liên sáu móc kép của ca khúc trong khi violin chơi giai điệu; về sau hình đệm chuyển sang violin rồi cello. HK Phil: 'the song very much in its original guise, the deliciously rippling accompaniment'."
