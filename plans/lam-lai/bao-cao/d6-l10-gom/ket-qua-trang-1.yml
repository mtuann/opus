  ghi_chu: "Tổng phổ trang 31: Var. III cello và contrabass ('a 2') chơi giai điệu ở âm vực trầm, piano chạy móc kép quãng tám ở vùng cao; West Cork: 'the cello and the bass play the theme ... the piano's whirling arpeggios'."
- trang: nghe-nhac/schubert-ca-hoi
