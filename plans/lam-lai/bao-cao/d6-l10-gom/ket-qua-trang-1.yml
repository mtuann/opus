  ghi_chu: "Ba chương nối liền: tổng phổ (fermata nốt bassoon sang Andante; cuối Andante sang Allegretto non troppo rồi Allegro molto vivace không dừng). Độ dài: 74 bản thu Naxos liệt kê trên trang IMSLP có tổng 24,0–30,4 phút, trung vị khoảng 27,1 phút; IMSLP ghi trung bình 30 phút. 'Khoảng 24–27' hơi thấp so với nửa số bản thu (27–30 phút) nhưng vẫn là khoảng thường gặp; review có thể cân nhắc ghi 'khoảng 25–30 phút'."
