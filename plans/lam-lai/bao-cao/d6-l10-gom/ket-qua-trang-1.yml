  ghi_chu: "Năm 1819 là năm được chấp nhận nhưng nguồn đều rào: Henle 'probably during his first trip to Steyr in 1819' (lời tựa), trang sản phẩm Henle 'around 1819'; Bärenreiter: lời kể của Stadler không cho biết thời gian, 'one can assume that Schubert composed it in 1819'; IMSLP '1819?'. Về 'sau mùa hè': trang sản phẩm Henle và HK Phil nói Schubert viết/hoàn thành sau mùa hè (HK Phil: về Vienna tháng 10 mới hoàn thành), còn lời tựa Henle nói 'during' chuyến đi Steyr. Đề nghị viết 'có lẽ năm 1819, trong hay sau mùa hè ở Steyr (Áo)'."
