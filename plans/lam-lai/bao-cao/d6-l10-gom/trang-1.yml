- trang: nghe-nhac/beethoven-5
  id: n1
  cau: 'Tiêu đề: Beethoven, Giao hưởng số 5.'
  loai: ten
- trang: nghe-nhac/beethoven-5
  id: n2
  cau: 'Mô tả trang: Bản giao hưởng mở đầu bằng bốn nốt "ngắn – ngắn – ngắn – dài"; đầu ô
    nhịp, đúng vào phách mạnh, là một dấu lặng ngắn, nên ba nốt ngắn bắt đầu "lệch" khỏi phách
    mạnh.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n3
  cau: 'Nhà soạn nhạc: Ludwig van Beethoven (1770–1827).'
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n4
  cau: 'Tên đầy đủ: Giao hưởng số 5 cung Đô thứ, Op. 67.'
  loai: danh-muc
- trang: nghe-nhac/beethoven-5
  id: n5
  cau: 'Năm sáng tác: 1804–1808.'
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n6
  cau: Công diễn lần đầu tại Vienna ngày 22/12/1808.
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n7
  cau: 'Thời kỳ: Cổ điển, chuyển sang Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n8
  cau: 'Thể loại: giao hưởng, 4 chương.'
  loai: so-lieu
- trang: nghe-nhac/beethoven-5
  id: n9
  cau: 'Độ dài: khoảng 30–35 phút.'
  loai: so-lieu
- trang: nghe-nhac/beethoven-5
  id: n10
  cau: 'Bản thu gợi ý: Carlos Kleiber và Wiener Philharmoniker (Deutsche Grammophon, thu năm
    1974).'
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n11
  cau: Bản giao hưởng mở đầu bằng bốn nốt "ngắn – ngắn – ngắn – dài".
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n12
  cau: Đầu ô nhịp, đúng vào phách mạnh, là một dấu lặng ngắn, nên ba nốt ngắn bắt đầu "lệch"
    khỏi phách mạnh.
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n13
  cau: 'Toàn bộ chương 1 được xây dựng từ môtip bốn nốt: môtip bị lặp lại, chuyển giọng, chia
    nhỏ, chồng lên nhau.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n14
  cau: Chương 1 là ví dụ điển hình về cách một ý tưởng rất nhỏ được phát triển thành cả một
    chương nhạc.
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n15
  cau: 'Chương 1: Allegro con brio, Đô thứ, hình thức sonata.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n16
  cau: 'Chương 2: Andante con moto, La♭ trưởng, biến tấu kép (hai chủ đề luân phiên).'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n17
  cau: 'Chương 3: Allegro, Đô thứ, scherzo và trio.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n18
  cau: 'Chương 4: Allegro, Đô trưởng, hình thức sonata.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n19
  cau: 'Chương 3 chuyển thẳng sang chương 4 không ngắt nghỉ: nhạc lắng xuống, căng thẳng tích
    tụ, rồi bùng nổ thành Đô trưởng.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n20
  cau: Hành trình từ Đô thứ tăm tối đến Đô trưởng chiến thắng là ý tưởng lớn của cả bản giao
    hưởng.
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n22
  cau: Ở chương 1, chủ đề 2 là giai điệu êm hơn ở violin; ngay trước đó, kèn horn dẫn vào
    bằng chính nhịp "ngắn – ngắn – ngắn – dài".
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n23
  cau: Ở chương 3, nhịp "ngắn – ngắn – ngắn – dài" quay lại.
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n26
  cau: 'Bảng, dòng 1 (Môtip mở đầu): đàn dây và clarinet đồng âm "ngắn – ngắn – ngắn – dài",
    hai lần, mỗi lần dừng trên một dấu ngân.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n27
  cau: 'Bảng, dòng 2 (Chủ đề 1): môtip chuyền từ bè dây này sang bè dây khác, chồng lên nhau,
    dồn lên một cao trào.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n28
  cau: 'Bảng, dòng 3 (Kèn horn gọi): một câu ngắn, mạnh, dùng chính nhịp của môtip, mở đường
    sang Mi♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n29
  cau: 'Bảng, dòng 4 (Chủ đề 2, Mi♭ trưởng): giai điệu êm ở violin; bên dưới, bè trầm vẫn
    gõ nhịp "ngắn – ngắn – ngắn – dài".'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n30
  cau: 'Bảng, dòng 5: hết phần trình bày; bản nhạc ghi dấu nhắc lại, nên nhiều bản thu chơi
    lại phần trình bày từ đầu.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n31
  cau: 'Bảng, dòng 6 (Phát triển): môtip bị chia nhỏ dần, đến lúc chỉ còn những hợp âm đơn
    lẻ chuyền qua lại giữa kèn gỗ và đàn dây, rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n32
  cau: 'Bảng, dòng 7 (Tái hiện): môtip trở lại mạnh mẽ; ngay sau đó, oboe chơi một mình một
    câu ngắn và chậm (Adagio).'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n33
  cau: 'Bảng, dòng 8 (Coda): dài bất thường, gần như một phần phát triển thứ hai, khép lại
    bằng môtip dứt khoát.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n34
  cau: 'Bảng, dòng 9: cuối chương 3, nhạc lắng xuống rất nhỏ trên tiếng trống timpani gõ đều,
    rồi dâng lên và bùng nổ thành Đô trưởng ở đầu chương 4, không ngắt nghỉ.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n36
  cau: 'Nguồn: bản nhạc và tổng phổ có trên IMSLP.'
  loai: ten
- trang: nghe-nhac/beethoven-5
  id: n37
  cau: 'Nguồn: bối cảnh lịch sử theo Burkholder, Grout, Palisca, A History of Western Music;
    Grove Music Online.'
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n38
  cau: 'Nguồn: năm sáng tác và buổi công diễn theo Beethoven-Haus Bonn.'
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n21
  cau: 'Gợi ý: ở chương 1, đếm xem môtip bốn nốt xuất hiện ở bao nhiêu nhạc cụ khác nhau.'
  loai: khuyen-tap
- trang: nghe-nhac/beethoven-5
  id: n24
  cau: 'Gợi ý: so sánh tốc độ chương 1 giữa bản Kleiber và một bản thu khác.'
  loai: khuyen-tap
- trang: nghe-nhac/beethoven-op132
  id: n1
  cau: 'Tiêu đề: Beethoven, Tứ tấu đàn dây Op. 132, chương 3.'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n2
  cau: 'Mô tả trang: tháng 4/1825, khi đang viết tứ tấu này, Beethoven lâm bệnh; khi bình
    phục, ông viết chương 3 với tiêu đề tiếng Đức Heiliger…'
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n3
  cau: 'Nhà soạn nhạc: Ludwig van Beethoven (1770–1827).'
  loai: nam
- trang: nghe-nhac/beethoven-op132
  id: n4
  cau: 'Tên đầy đủ: Tứ tấu đàn dây cung La thứ, Op. 132.'
  loai: danh-muc
- trang: nghe-nhac/beethoven-op132
  id: n5
  cau: 'Sáng tác: 1825, hai năm trước khi Beethoven mất.'
  loai: nam
- trang: nghe-nhac/beethoven-op132
  id: n6
  cau: 'Thời kỳ: Beethoven giai đoạn cuối (cầu nối sang Lãng mạn).'
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n7
  cau: 'Biên chế: 2 violin, viola, cello.'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n8
  cau: Chương 3 dài khoảng 15–20 phút.
  loai: so-lieu
- trang: nghe-nhac/beethoven-op132
  id: n9
  cau: Tháng 4/1825, khi đang viết tứ tấu này, Beethoven lâm bệnh.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n10
  cau: Khi bình phục, Beethoven viết chương 3 với tiêu đề tiếng Đức "Heiliger Dankgesang eines
    Genesenen an die Gottheit, in der lydischen Tonart".
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n11
  cau: 'Tiêu đề dịch: "Khúc thánh ca tạ ơn của người vừa khỏi bệnh dâng lên Thượng đế, ở điệu
    thức Lydian".'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n12
  cau: Điệu thức Lydian là một điệu thức nhà thờ cổ, giống gam trưởng nhưng có bậc 4 được
    nâng.
  loai: dinh-nghia
- trang: nghe-nhac/beethoven-op132
  id: n13
  cau: Ở chương này, trên nốt Fa, Beethoven dùng Si tự nhiên thay vì Si♭.
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n14
  cau: Dùng một điệu thức nhà thờ cổ vào năm 1825 là một lựa chọn khác thường, cho âm nhạc
    một màu sắc cổ xưa.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n15
  cau: Đây là một trong năm tứ tấu cuối cùng của Beethoven.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n16
  cau: Như các tứ tấu cuối khác, Op. 132 cần thời gian mới được đón nhận rộng rãi; nay nó
    được coi là một trong những tứ tấu đàn dây hay nhất.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n17
  cau: Chương này là cửa vào tốt nhất của các tứ tấu cuối.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n19
  cau: 'Chương có cấu trúc A – B – A'' – B'' – A'''': phần thánh ca luân phiên với phần "sức
    lực mới".'
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n20
  cau: 'Phần A (Molto adagio): bốn đàn chơi một thánh ca chậm, từng câu ngắn, xen giữa là
    những đoạn bắt chước nhẹ; phần thánh ca đi bằng nốt trắng, cả bốn bè cùng chuyển hợp âm.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n21
  cau: 'Phần B: Andante, "Neue Kraft fühlend" ("cảm thấy sức lực mới").'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n22
  cau: Phần B ở Rê trưởng, nhịp 3/8, nhanh hơn; violin 1 nhảy nhót với những nốt trang trí.
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n23
  cau: 'Phần A'': thánh ca trở lại, các bè xung quanh chuyển động nhiều hơn.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n24
  cau: 'Phần B'': phần "sức lực mới" trở lại, trang trí phong phú hơn.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n25
  cau: 'Phần A'''': "Mit innigster Empfindung" ("với cảm xúc sâu thẳm nhất").'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n26
  cau: 'Phần A'''': thánh ca lần cuối, viết tự do hơn: một hình giai điệu ngắn chuyền qua
    các bè; căng thẳng tăng dần đến cao trào (f, sf) rồi lắng xuống, kết thúc rất nhỏ (pp).'
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n28
  cau: Phần thánh ca có tốc độ rất chậm.
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n29
  cau: Khi viết tác phẩm này Beethoven đã điếc nặng (bác sĩ phải viết vào sổ hội thoại để
    nói chuyện với ông).
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n31
  cau: 'Nguồn: tổng phổ ở IMSLP (tìm "Beethoven Op.132").'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n32
  cau: 'Nguồn: bối cảnh và hình thức theo Barry Cooper, chú giải Op. 132 của Chamber Music
    Society of Lincoln Center.'
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n1
  cau: 'Tiêu đề: Mendelssohn, Concerto violin cung Mi thứ.'
  loai: ten
- trang: nghe-nhac/mendelssohn-violin
  id: n2
  cau: 'Mô tả trang: Mendelssohn viết concerto này cho người bạn, nghệ sĩ violin Ferdinand
    David, concertmaster của dàn nhạc Gewandhaus Leipzig mà Mendelssohn làm nhạc trưởng.'
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n3
  cau: 'Nhà soạn nhạc: Felix Mendelssohn (1809–1847).'
  loai: nam
- trang: nghe-nhac/mendelssohn-violin
  id: n4
  cau: 'Tên đầy đủ: Concerto cho violin cung Mi thứ, Op. 64.'
  loai: danh-muc
- trang: nghe-nhac/mendelssohn-violin
  id: n5
  cau: 'Sáng tác: hoàn thành năm 1844.'
  loai: nam
- trang: nghe-nhac/mendelssohn-violin
  id: n6
  cau: 'Công diễn: 13/3/1845, Leipzig; độc tấu Ferdinand David.'
  loai: nam
- trang: nghe-nhac/mendelssohn-violin
  id: n7
  cau: 'Thời kỳ: Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n8
  cau: 'Độ dài: khoảng 24–27 phút, 3 chương nối liền nhau.'
  loai: so-lieu
- trang: nghe-nhac/mendelssohn-violin
  id: n9
  cau: Mendelssohn viết concerto này cho người bạn, nghệ sĩ violin Ferdinand David.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n10
  cau: Ferdinand David là concertmaster của dàn nhạc Gewandhaus Leipzig mà Mendelssohn làm
    nhạc trưởng.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n11
  cau: Trong thư từ trao đổi suốt những năm sáng tác, hai người bàn cả những chi tiết kỹ thuật
    của phần violin.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n12
  cau: Đây là một trong những concerto violin được biểu diễn nhiều nhất mọi thời đại.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n13
  cau: Mendelssohn phá ba thói quen của concerto Cổ điển (violin vào ngay, cadenza giữa chương,
    các chương nối liền).
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n15
  cau: Violin vào gần như ngay lập tức, chỉ sau một ô nhịp rưỡi, thay vì chờ dàn nhạc trình
    bày.
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n16
  cau: Cadenza được viết sẵn và đặt trước phần tái hiện, thay vì gần cuối chương; nó trở thành
    cây cầu nối phát triển và tái hiện.
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n17
  cau: 'Ba chương nối liền: một nốt giữ dài của bassoon nối chương 1 sang chương 2.'
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n18
  cau: Nốt bassoon giữ dài là để khán giả không vỗ tay chen giữa chương 1 và chương 2.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n19
  cau: 'Theo dõi, chương 1 Allegro molto appassionato: dàn nhạc rì rầm, violin vào ngay với
    chủ đề chính đầy khao khát ở Mi thứ, âm vực cao.'
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n20
  cau: 'Theo dõi, chủ đề 2 chương 1: kèn gỗ (clarinet, sáo) hát chủ đề 2 dịu dàng ở giọng
    trưởng, trên nốt Sol buông giữ dài của violin.'
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n21
  cau: 'Theo dõi, cadenza: violin một mình, hợp âm rải nhanh khắp các dây.'
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n22
  cau: 'Theo dõi, tái hiện: trong lúc violin vẫn rải hợp âm, dàn nhạc lặng lẽ vào lại chủ
    đề chính.'
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n23
  cau: 'Theo dõi, cầu nối: bassoon giữ một nốt dài khi dàn nhạc dừng, dẫn thẳng sang chương
    2.'
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n24
