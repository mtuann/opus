- trang: piano/hoa-am/ket
  id: n4
  cau: Bè bass là nốt trầm nhất; ở các tiến trình đầu trang là nốt gốc của hợp âm (trừ I6/4 và ii6).
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n8
  cau: Nốt chung của hai hợp âm giữ nguyên; các nốt khác đi đến nốt gần nhất của hợp âm mới, thường là một bước liền.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n9
  cau: Cảm âm (Si ở Đô trưởng) đi lên chủ âm; nốt 7 của V7 (Fa) đi xuống.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n10
  cau: 'Không để hai bè đi song song quãng 5 hoặc quãng 8: hai bè nhập làm một và mất tính độc lập.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n11
  cau: Giữ quy tắc 1 và 2 thì hầu như tự tránh được.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n16
  cau: 'Kết trọn: V và I đều ở thể gốc, bè trên về chủ âm.'
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n17
  cau: 'Khi bè trên dừng ở nốt ba hoặc nốt năm của hợp âm I thì đó là kết chưa trọn: đã kết nhưng còn hơi mở.'
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n18
  cau: Kết nửa dừng ở V, như một dấu phẩy hay một câu hỏi.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n19
  cau: 'Kết nửa I–vi–IV–V: Mi và Đô giữ nguyên khi sang vi (La–Đô–Mi), rồi Mi lên Fa ở IV.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n20
  cau: Kết plagal IV–I, tiếng "A-men" cuối thánh ca; nốt Đô trên cùng giữ suốt, chỉ hai nốt dưới đổi.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n21
  cau: 'Kết lừa V–vi: tai chờ I nhưng nhạc rẽ sang La thứ.'
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n22
  cau: Ở kết lừa, Si lên Đô, Rê xuống Đô, Sol xuống Mi nên hợp âm vi có hai nốt Đô; đừng đưa Sol lên La vì sẽ song song quãng 8 với bass Sol–La.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n23
  cau: Sau kết lừa, câu nhạc phải nói tiếp; ở đây nó đi qua ii6–V7 để về kết trọn.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n24
  cau: Kết lừa ở Sol trưởng có vi là Mi thứ (Mi–Sol–Si); ở Fa trưởng vi là Rê thứ (Rê–Fa–La).
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n26
  cau: Hợp âm I6/4 (Đô–Mi–Sol với Sol ở bass, thể đảo 2) nghe như một V còn đang "treo", và chỉ yên khi Mi xuống Rê, Đô xuống Si.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n27
  cau: 'Hợp âm 6/4 ở kết (cadential 6/4): trong concerto thời Cổ điển, cadenza của nghệ sĩ độc tấu thường bắt đầu từ chính hợp âm này.'
  loai: lich-su
- trang: piano/hoa-am/ket
  id: n28
  cau: I6/4 đứng ở phách mạnh hơn V theo sau nó.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n29
  cau: Bass giữ nguyên Sol từ I6/4 sang V.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n30
  cau: Nốt cách bass quãng 6 (Mi) xuống quãng 5 (Rê); nốt cách bass quãng 4 (Đô) xuống quãng 3 (Si); nốt Sol, nhân đôi bass, giữ nguyên ("sáu xuống năm, bốn xuống ba").
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n32
  cau: 'Bè trên cùng của từng vị trí: Đô–Đô–Si–Đô, Mi–Fa–Rê–Mi, Sol–La–Sol–Sol; bè này đi bước liền hoặc đứng yên, trừ một chỗ: Fa xuống Rê ở vị trí quãng 3.'
  loai: cau-truc
- trang: piano/hoa-am/ket
  id: n34
  cau: ii6 là Rê–Fa–La với Fa ở bass.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n35
  cau: ii6 chung hai nốt với IV (Fa, La) nên thay được IV; chỗ khác duy nhất là nốt Rê thay cho nốt Đô.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n36
  cau: 'Nốt Fa của tay phải giữ nguyên sang V7 và trở thành nốt 7, rồi đi xuống Mi: nốt Fa đã có sẵn từ hợp âm trước.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n37
  cau: 'Ở vị trí quãng 5, đi thẳng từ Đô–Mi–Sol lên Rê–Fa–La sẽ tạo quãng 5 song song (Đô–Sol lên Rê–La); vì vậy tay phải đi xuống: bè trên hát Sol–Fa–Fa–Mi và kết ở nốt ba, một kết chưa trọn.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n38
  cau: Ở giọng thứ, ba hợp âm chính là i, iv và V.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n39
  cau: 'Hợp âm V ở giọng thứ phải là hợp âm trưởng, với cảm âm lấy từ gam thứ hòa âm: ở La thứ là Sol♯, nên V là Mi–Sol♯–Si.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n40
  cau: 'ii6 ở giọng thứ thành ii°6: Si–Rê–Fa, hợp âm giảm, Rê ở bass.'
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n41
  cau: Một bè đi từ Fa lên Sol♯ là quãng 2 tăng, khó hát và nghe lạ.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n42
  cau: Trong các hình ở La thứ, Fa luôn đi xuống Mi; Sol♯ đến từ La hoặc Si ở phía trên.
  loai: cau-truc
- trang: piano/hoa-am/ket
  id: n45
  cau: Ở Mi thứ cảm âm là Rê♯ và ở Rê thứ là Đô♯.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n48
  cau: Quên nâng cảm âm thì V thành hợp âm thứ, nhất là ở những giọng có cảm âm "lạ" như Mi♯ (Fa♯ thứ) hay Fa thăng kép (Sol♯ thứ).
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n49
  cau: Thứ tự đi quanh vòng quãng 5, xen kẽ phía thăng và phía giáng, mỗi lần thêm một dấu hóa; mỗi tuần một cặp giọng trưởng và thứ cùng hóa biểu.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n50
  cau: 'Bảng cảm âm giọng thứ: Sol♯, Rê♯, Đô♯, La♯, Fa♯, Mi♯, Si♮, Si♯, Mi♮, Fa thăng kép, La♮, Đô thăng kép (hoặc Rê♮).'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q1
  cau: 'Quiz 1: ở Đô trưởng, tay phải bắt đầu bằng Sol–Đô–Mi là vị trí quãng 3 (gọi theo nốt trên cùng; Mi là nốt ba của hợp âm Đô).'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q2
  cau: 'Quiz 2: trong I–IV–V–I chỉ vị trí quãng 8 cho kết trọn, vì chỉ ở đó bè trên cùng về chủ âm; kết trọn cần V–I ở thể gốc và bè trên về chủ âm, hai vị trí kia dừng ở nốt ba hoặc nốt năm.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q3
  cau: 'Quiz 3: ở I6/4 trong I–IV–I6/4–V–I tay phải chơi đúng hình hợp âm I trong khi tay trái đã sang át âm; sau đó Mi xuống Rê, Đô xuống Si: sáu xuống năm, bốn xuống ba.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q4
  cau: 'Quiz 4: trong kết lừa V–vi ở Đô trưởng, nốt Đô có hai lần trong hợp âm vi; Si lên Đô, Rê xuống Đô; đưa Sol lên La sẽ tạo quãng 8 song song với bass.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q5
  cau: 'Quiz 5: ở La thứ hợp âm V là Mi–Sol♯–Si; cảm âm Sol♯ lấy từ gam thứ hòa âm, kéo lên chủ âm La.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n54
  cau: 'Nguồn: Palmer, Manus, Lethco, The Complete Book of Scales, Chords, Arpeggios & Cadences (Alfred); Kostka, Payne, Tonal Harmony (McGraw-Hill); Aldwell, Schachter, Harmony and Voice Leading, kèm điều từng sách đóng góp.'
  loai: ten
- trang: piano/hoa-am/ket
  id: n13
  cau: Hãy tập cả ba vị trí, vì khi đệm cho một giai điệu, nốt giai điệu nằm trên cùng sẽ chọn vị trí cho bạn.
  loai: khuyen-tap
- trang: piano/hoa-am/ket
  id: n46
  cau: Tay trái luôn là chủ âm (ngón 1), hạ át âm thấp hơn một quãng 5 (ngón 5), át âm (ngón 4); đặt chủ âm trong khoảng Sol2–Fa♯3 để bass không quá đục.
  loai: khuyen-tap
- trang: piano/hoa-am/ket
  id: n47
  cau: Hình và ngón của tay phải giống nhau ở mọi giọng, chỉ phím đen thay đổi; gặp phím đen, đẩy cả bàn tay vào sâu giữa các phím đen; khi chơi hợp âm, ngón cái đặt trên phím đen là bình thường.
  loai: khuyen-tap
- trang: piano/hoa-am/mau-galant
  id: n1
  cau: 'Mẫu (schema) là một khung hai bè: bass đi theo một chuỗi bậc, giai điệu theo một chuỗi bậc khác, khớp nhau từng bước.'
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n2
  cau: Gjerdingen, trong Music in the Galant Style (2007), đã gom và đặt tên cho nhiều khung như thế.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n3
  cau: 'Mô tả cũ: Gjerdingen gom "vài chục khung".'
  loai: so-lieu
- trang: piano/hoa-am/mau-galant
  id: n4
  cau: 'Phong cách galant là lối viết thanh nhã của thế kỷ 18 mà Mozart thời trẻ cũng viết theo (cũ: "Haydn và Mozart lớn lên cùng").'
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n5
  cau: Gjerdingen gọi các mẫu là "câu nhạc có sẵn" (stock musical phrases).
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n6
  cau: 'Fonte (suối), Monte (núi), Ponte (cầu): nghĩa các tên tiếng Ý.'
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n7
  cau: Fonte, Monte, Ponte là cách gọi của nhà lý luận Joseph Riepel.
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n8
  cau: Riepel là "nhà lý luận người Áo" (cũ).
  loai: nam
- trang: piano/hoa-am/mau-galant
  id: n9
  cau: Riepel là tác giả các sách lý luận in từ năm 1752.
  loai: nam
- trang: piano/hoa-am/mau-galant
  id: n10
  cau: Fonte và Monte là những chuỗi hòa âm (sequence) ngắn.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n11
  cau: Meyer là tên đặt theo nhà âm nhạc học Leonard Meyer.
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n12
  cau: Romanesca mượn tên một công thức bass đã được nhắc đến từ thế kỷ 16 và phổ biến trong thế kỷ 17.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n13
  cau: Gjerdingen tìm câu trả lời cho việc cả thế hệ dùng chung khung ở lối dạy partimento tại các nhạc viện Napoli.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n14
  cau: 'Conservatorio là trường ở Napoli, Venezia và vài thành phố Ý, nơi trẻ em được "gìn giữ" (conserved) và học nhạc (cũ: "trẻ mồ côi khắp châu Âu").'
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n15
  cau: Lối dạy partimento nở rộ ở các nhạc viện Ý trong thế kỷ 17–18.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n16
  cau: Partimento là một bè bass viết trên một khuông, có khi kèm số, có khi không.
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n17
  cau: Học trò ngồi vào đàn và biến partimento thành nhạc hoàn chỉnh, tự thêm hòa âm và giai điệu.
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n18
  cau: Học trò học thuộc cách hòa âm cho từng bậc bass (quy tắc quãng tám), các kiểu kết, các chuỗi bass hay gặp.
  loai: quy-tac
- trang: piano/hoa-am/mau-galant
  id: n19
  cau: Francesco Durante và Fedele Fenaroli là những thầy làm partimento.
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n20
  cau: 'Một chuỗi bass quen tự gọi ra một giai điệu quen: đó là các mẫu dưới đây.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n21
  cau: Ví dụ viết ba bè (giai điệu, một bè giữa, bass), mỗi bước một ô 3/4; riêng bốn kết mỗi bước một phách trong 4/4.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n22
  cau: 'Romanesca: giai điệu 1–5–1–1, bass 1–7–6–3, hòa âm I – V6 – vi – I6, mở đầu.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n23
  cau: 'Do–Re–Mi: giai điệu 1–2–3, bass 1–7–1, hòa âm I – V6 – I, mở đầu.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n24
  cau: 'Meyer: giai điệu 1–7 … 4–3, bass 1–2 … 7–1, hòa âm I – V4/3 … V6/5 – I, mở đầu.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n25
  cau: 'Prinner: giai điệu 6–5–4–3, bass 4–3–2–1, hòa âm IV – I6 – vii°6 – I; đứng ở vị trí trả lời.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n26
  cau: 'Fonte: giai điệu 5–4 … 4–3, bass ♯1–2 … 7–1 (hòa âm V6/5 của ii – ii … V6/5 – I).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n27
  cau: 'Monte: giai điệu ♭7–6 … 1–7, bass 3–4 … ♯4–5.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n28
  cau: 'Ponte: giai điệu 5–7–2 trên bass giữ nguyên bậc 5.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n29
  cau: 'Quiescenza: giai điệu ♭7–6–♮7–1 trên bass chủ âm giữ nguyên, đến sau kết.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n30
  cau: Fonte, Monte và Ponte thường đứng ngay sau vạch nhắc lại (Fonte đi xuống, Monte đi lên, Ponte chờ trên át âm).
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n31
  cau: Hòa âm của Monte đọc là V6/5 của IV – IV … V6/5 của V – V.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n32
  cau: Hòa âm của Quiescenza đọc là V7 của IV – IV6/4 – V7 – I, trên âm nền chủ âm.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n33
  cau: Romanesca đứng đầu bài hay đầu câu; bảng OMT xếp nó vào nhóm "nước khai cuộc" (opening gambit).
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n34
  cau: Romanesca thường được một Prinner trả lời.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n35
  cau: 'Romanesca có hai dạng bass cũ: dạng nhảy (xuống quãng 4 xen lên một bậc: 1–5–6–3) và dạng đi liền (bass đi bậc xuống).'
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n36
  cau: Theo Gjerdingen, dạng nhảy đặc trưng cho thế kỷ 17 và đầu thế kỷ 18, dạng đi liền cho cuối thế kỷ 18.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n37
  cau: 'Bass galant 1–7–6–3 là dạng lai: phần đầu giống dạng đi liền, phần sau giống dạng nhảy.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n40
  cau: 'Các dòng "Giọng khác": Romanesca ở Sol và Fa, Do–Re–Mi ở Đô và Rê, Meyer, Prinner, Fonte, Monte, Ponte, Quiescenza ở Sol (Prinner thêm Fa).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n41
  cau: 'Do–Re–Mi: hai ô sau của ví dụ là biến thể soạn riêng cho trang, bass đi 1–5–1 (cũ: "bass cũng có thể đi 1–5–1" như một dạng của mẫu).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n42
  cau: Nốt Mi cuối của Do–Re–Mi có thể làm nốt đầu của một Prinner chuyển giọng; Meyer cũng kết ở Mi trên Đô nên gối vào Prinner được.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n43
  cau: Với bốn bè, ô 2 của Meyer là V4/3; ví dụ ba bè bỏ nốt Sol nên còn Rê – Fa – Si.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n44
  cau: Cùng nhóm với Meyer, OMT kể thêm Pastorella, Jupiter và Aprile; mẫu nào cũng bắt đầu ở chủ âm, rời đi hai bước rồi về chủ âm. Jupiter có giai điệu 1–2–4–3 trên bass 1–7–5–1.
  loai: danh-muc
- trang: piano/hoa-am/mau-galant
  id: n45
  cau: 'Prinner: hai bè song song quãng 10 suốt bốn bước; giai điệu dừng ở bậc 3 nên chưa phải kết trọn.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n46
  cau: Biến thể của Prinner chen một át âm thể gốc trước nốt cuối (bass 4–3–2–5–1).
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n47
  cau: 'Prinner chuyển giọng: giai điệu 3–2–1–7 trên bass 1–7–6–5, nghe như 6–5–4–3 trên 4–3–2–1 của giọng Sol; đưa nhạc từ giọng chủ sang giọng át; Fa♯ ở ô 7 là cánh cửa sang giọng át.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n48
  cau: 'Cũ: Prinner là mẫu "phản đòn" (riposte) của Romanesca, và ô 3 là V4/3.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n49
  cau: 'Fonte đi xuống hai bậc thang: cặp át–chủ nhỏ ở Rê thứ (ii), rồi cùng cặp ấy ở Đô trưởng, thấp hơn một cung; giai điệu 4–3 trên bass 7–1 trong mỗi giọng tạm; Đô♯ là cảm âm tạm của Rê thứ.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n50
  cau: 'Fonte, tập ở đàn: tay phải chơi hai quãng lặp lại (cũ: "quãng 10") — Sol trên Đô♯ là quãng 5 giảm, mở ra Fa trên Rê là quãng 3.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n51
  cau: 'Monte là Fonte đi lên: cặp át–chủ ở Fa trưởng (IV), rồi ở Sol trưởng (V), cao hơn một cung; Si♭ hướng tai về Fa, Fa♯ về Sol.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n52
  cau: 'Cũ: Monte hợp "bất cứ chỗ nào nhạc cần dâng lên".'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n53
  cau: 'Ponte đứng yên trên át âm; trong ví dụ giai điệu thêm 4 (nốt 7 của V7) rồi rơi xuống 3 khi chủ âm trở về (cũ ở bảng: "5–7–2(–4)").'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n54
  cau: Ponte còn gặp "ngay trước khi chủ đề đầu trở lại".
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n55
  cau: Bảng OMT liệt kê ba kết trọn khác nhau ở độ dài của át âm (cadenza semplice, composta, doppia) và một kết nửa, kết hội tụ (converging cadence, còn gọi kết nửa fa–fi–sol).
  loai: danh-muc
- trang: piano/hoa-am/mau-galant
  id: n56
  cau: 'Cadenza semplice: bass 3–4–5–1, giai điệu 1–2–2–1, át âm chỉ một bước.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n57
  cau: 'Cadenza composta: bass 3–4–5–5–1, giai điệu 1–2–3–2–1, bass giữ 5 hai bước (6/4 ở kết rồi V).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n58
  cau: 'Cadenza doppia: bass giữ 5 bốn bước rồi 1, giai điệu 4–3–2–2–1, bè giữa 5–4–4–3.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n59
  cau: 'Kết hội tụ: bass 3–4–♯4–5, giai điệu 3–2–1–7; là kết nửa dừng trên át âm.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n61
  cau: Quiescenza đến sau kết; bass giữ chủ âm; giai điệu ♭7–6–♮7–1.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n62
  cau: 'Quiescenza: bè giữa 3–4–4–3.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n63
  cau: 'Cũ: Quiescenza như "một lời chào".'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n64
  cau: 'Quiescenza (sự lắng yên): nghĩa của tên.'
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n65
  cau: 'Một câu nhạc galant thường đi: mẫu mở đầu, mẫu trả lời, kết.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n66
  cau: Ở Fonte và Monte, hình tay không đổi ở mọi giọng; Prinner luôn là quãng 10; Fonte và Monte là quãng 5 giảm mở ra quãng 3, hai lần.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n67
  cau: 'Romanesca ở giọng thứ: bass La – Sol♯ – Fa – Đô ở La thứ, nhớ nâng cảm âm (cũ: "dùng được ở giọng thứ").'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n68
  cau: 'Các mẫu ở giọng Sol trưởng trong ví dụ ghép (Do–Re–Mi, Prinner chuyển giọng, kết ở Sol): ô 7 là Sol – Si trên bass Rê (6/4 ở kết) rồi Fa♯ – La (V).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n74
  cau: 'Tiêu đề (cũ: "tám khung thông dụng nhất"): trang dạy tám khung quen thuộc.'
  loai: so-lieu
- trang: piano/hoa-am/mau-galant
  id: n79
  cau: 'Câu hỏi 1: bass Romanesca đi theo 1–7–6–3 (giai điệu 1–5–1–1, I – V6 – vi – I6).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n80
  cau: 'Câu hỏi 2: Prinner giai điệu và bass song song quãng 10, nên không bao giờ thành quãng 5 hay quãng 8 song song.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n81
  cau: 'Câu hỏi 3: Fonte đi xuống (qua ii về I), Monte đi lên (qua IV lên V); mỗi cặp át–chủ có giai điệu 4–3 trên bass 7–1 của giọng tạm.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n82
  cau: 'Câu hỏi 4: Quiescenza thường đứng sau kết cuối, trên âm nền chủ âm.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n83
  cau: 'Câu hỏi 5: partimento là một bè bass, có hoặc không có số, để học trò hoàn thiện thành nhạc ngay trên bàn phím; công cụ dạy ở các nhạc viện Napoli thế kỷ 18, nơi các mẫu galant được truyền từ thầy sang trò (cũ: "quan trọng").'
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n84
  cau: Gjerdingen, Music in the Galant Style, Oxford University Press, 2007.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n85
  cau: Gjerdingen, Child Composers in the Old Conservatories (OUP, 2020); Sanguinetti, The Art of Partimento (OUP, 2012); Mortensen, The Pianist's Guide to Historic Improvisation (OUP, 2020).
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n86
  cau: partimenti.org là trang của Gjerdingen, nguồn partimento lịch sử.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n75
  cau: Học xong, bạn có sẵn vốn từ để ứng tác và nhận ra chúng trong minuet, sonatina, sonata bạn đang tập.
  loai: khuyen-tap
- trang: piano/hoa-am/mau-galant
  id: n70
  cau: 'Tập trong mọi giọng: bắt đầu từ bass và nói bậc; đi theo vòng quãng 5; bảng tuần 1–4 giọng trưởng và giọng thứ; sau đó thêm Mi, La♭, Si, Rê♭, Fa♯.'
  loai: khuyen-tap
- trang: piano/hoa-am/mau-galant
  id: n72
  cau: Kế hoạch 4 tuần (bảng việc và mục tiêu) và danh sách "Sẵn sàng đi tiếp khi".
  loai: khuyen-tap
- trang: piano/hoa-am/ung-tac
  id: n2
  cau: 'Cũ: "Mọi ứng tác cổ điển bắt đầu từ một khung"; nay "thường bắt đầu".'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n3
  cau: 'Cũ: nốt khung ở mỗi ô "là một dấu hiệu rất quen của nhạc thế kỷ 18".'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n5
  cau: Nốt lướt đi bậc liền từ một nốt hợp âm sang một nốt hợp âm khác, theo một hướng (Sol – Fa – Mi).
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n6
  cau: Nốt thêu rời một nốt hợp âm một bậc rồi quay về chính nó (Mi – Rê – Mi).
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n8
  cau: Đến kết có thể thêm láy rền trên bậc 2 khi bass ở át âm.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n10
  cau: 'Láy rền bắt đầu từ nốt trên (Mi, trên Rê của ví dụ), theo C. P. E. Bach (Versuch, 1753); cũ: "Theo lệ thời Cổ điển".'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n11
  cau: 'Hai lời khuyên: phách 1 giữ một nốt hợp âm, nốt ngoài hợp âm đặt ở phách yếu (trong bài tập này).'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n12
  cau: 'Đừng để nốt trang trí che quãng 8 hay quãng 5 song song giữa giai điệu và bass: thêm một vài nốt không làm mất lỗi ấy.'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n13
  cau: 'Cũ: hai ô liền nhau không được bắt đầu bằng cùng một quãng 5 hay quãng 8.'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n15
  cau: Mozart viết 12 biến tấu trên giai điệu Pháp Ah! vous dirai-je, maman.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n17
  cau: Tác phẩm mang số K. 265 (300e).
  loai: so-lieu
- trang: piano/hoa-am/ung-tac
  id: n18
  cau: Người ta từng cho rằng nó viết ở Paris năm 1778; phân tích bản thảo của Wolfgang Plath cho thấy khoảng 1781–1782 mới đúng hơn.
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n19
  cau: Bản in đầu tiên ra năm 1785 ở Vienna.
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n20
  cau: 'Cũ: giai điệu "in lần đầu năm 1761".'
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n21
  cau: Chủ đề ở Đô trưởng gồm ba đoạn A–B–A, mỗi đoạn tám ô nhịp 2/4 trong bản của Mozart.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n22
  cau: Viết lại ở 4/4 thì mỗi đoạn bốn ô, cả chủ đề mười hai ô; bốn ô đầu của chủ đề trong khối abc 2 trùng với bài 2 của 10 bài đầu tiên.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n23
  cau: Biến tấu 1 phủ giai điệu bằng chuỗi móc kép tay phải; biến tấu 2 chuyển chuyển động nhanh xuống tay trái.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n24
  cau: Biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ); biến tấu 11 là Adagio; biến tấu 12 (Allegro) đổi sang 3/4 và khép bằng coda (cũng là đáp án và giải thích câu hỏi 2 của phần Kiểm tra nhanh).
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n25
  cau: 'Biến tấu A, B, C soạn cho trang: A móc đơn bằng nốt thêu và nốt hợp âm; B giữ giai điệu, tay trái Alberti; C sang Đô thứ (La♭, Mi♭), tay trái thành bè đối nhỏ.'
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n29
  cau: Ô 2–3 của chủ đề (La – La – Sol, Fa – Fa – Mi – Mi) đi 6–5–4–3, đúng giai điệu của Prinner; đặt dưới nó bass Fa – Mi – Rê – Đô.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n31
  cau: 'Câu nhạc cổ điển hay đi thành cặp: câu hỏi thường dừng ở át âm bằng một kết nửa; câu trả lời thường bắt đầu giống câu hỏi rồi rẽ về chủ âm bằng một kết trọn (cũ: "dừng… bắt đầu giống hệt").'
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n32
  cau: Hai câu tạo thành một đoạn nhạc (period); link đã đổi từ bài 31 sang bài 13, mục câu nhạc và đoạn nhạc.
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n33
  cau: 'Ví dụ câu hỏi và câu trả lời: cả hai câu mở bằng Do–Re–Mi; câu hỏi dừng bằng kết hội tụ; câu trả lời về nhà qua I6/4 – V – I.'
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n34
  cau: 'Bài partimento đầu tiên của bạn: mười sáu ô bè bass, tên mẫu ghi phía trên; nửa đầu có giai điệu mẫu, nửa sau chỉ có khung.'
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n35
  cau: 'Bảng minuet: ô 1–4 Romanesca (bass Đô – Si – La – Mi, giai điệu 1–5–1–1), ô 5–8 Prinner chen át âm (Fa – Mi – Rê, Sol – Đô; 6–5–4–3), ô 9–12 Fonte (Đô♯ – Rê – Si – Đô; 5–4–4–3), ô 13–16 cadenza composta (Mi – Fa – Sol – Đô; 1–2–3–2–1).'
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n36
  cau: C. P. E. Bach in những sonata ghi sẵn các lần nhắc lại đã được biến đổi.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n37
  cau: Thời ấy, đổi khác khi nhắc lại là chuyện bình thường.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n39
  cau: 'Thế kỷ 18 và 19, nghệ sĩ đàn phím thường không vào bài một cách đột ngột mà dạo đầu (preluding): vài hợp âm, một đường rải hay gam, một kết.'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n40
  cau: 'Mục đích dạo đầu: báo giọng, thử đàn và căn phòng, làm ấm tay, nối hai bài khác giọng.'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n41
  cau: 'Carl Czerny in một tập 120 ví dụ gồm đoạn dạo đầu, chuyển giọng, kết và fantasia: Die Kunst des Präludierens (Nghệ thuật dạo đầu), Op. 300 (cũ: "120 đoạn dạo đầu mẫu… nhiều đoạn chưa đến một phút").'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n42
  cau: Nghệ thuật dạo đầu là bản dịch tên Die Kunst des Präludierens.
  loai: ten
- trang: piano/hoa-am/ung-tac
  id: n43
  cau: Sang thế kỷ 20, thói quen dạo đầu thưa dần trên sân khấu hòa nhạc; ở nhà, ở lớp, hay chơi cho bạn bè vẫn dùng được.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n46
  cau: 'Ô 2 của dạo đầu là Quiescenza ở Sol trưởng: giai điệu Fa♮ – Mi – Fa♯ – Sol, bè giữa Si – Đô – Đô – Si.'
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n48
  cau: Với bài ở giọng thứ, nâng cảm âm trong hợp âm V.
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n55
  cau: 'Câu hỏi 1: nốt thêu rời một nốt hợp âm một bậc rồi quay về chính nó; nốt lướt đi bậc liền giữa hai nốt hợp âm.'
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n56
  cau: 'Câu hỏi 3: câu hỏi dừng ở V (kết nửa), câu trả lời về I (kết trọn); câu trả lời thường bắt đầu giống câu hỏi.'
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n57
  cau: 'Câu hỏi 4: nghệ sĩ dạo đầu để báo giọng, thử đàn, làm ấm tay, nối hai bài khác giọng; Czerny in cả một tập 120 ví dụ, Op. 300.'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n58
  cau: 'Câu hỏi 5: phách 1 của mỗi ô nên là một nốt hợp âm, thường là nốt khung; nốt lướt và nốt thêu nằm giữa các phách.'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n59
  cau: 'Nguồn: bản nhạc K. 265 trên IMSLP (tìm "Ah vous dirai-je maman K.265") và bản Urtext của Henle.'
  loai: lich-su
