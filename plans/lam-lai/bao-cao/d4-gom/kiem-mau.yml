- trang: piano/not-hoa-my
  id: n21
  cau: "Bảng Bach, hàng Trillo (răng cưa ngắn): Rê–Đô–Rê–Đô…, bắt đầu từ nốt trên; gọi ngày nay là láy rền."
  loai: quy-tac
  nguon:
    - ten: Bảng "Explication unterschiedlicher Zeichen" trong Clavier-Büchlein vor Wilhelm Friedemann Bach (1720), ảnh chụp bản gốc, Wikimedia Commons (13 mục)
      link: https://commons.wikimedia.org/wiki/File:Tableofornaments750.jpg
    - ten: C. P. E. Bach, Versuch (1753), phần 1 chương 2 mục 3 Triller (§3 bốn kiểu láy rền, §5 bắt đầu từ nốt trên, §13 nốt kết, §30 Prall-Triller)
      link: https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p13.html
  ket_qua_luot_1: dung
  ghi_chu: "Bảng gốc: Trillo bắt đầu từ nốt trên; C. P. E. Bach §5: láy rền luôn bắt đầu từ nốt trên."
- trang: piano/cach-tap
  id: n41
  cau: "Nghỉ một hai ngày: có khi quay lại sau một hai ngày nghỉ, bài thấy chắc hơn."
  loai: khuyen-tap
  nguon: []
  ket_qua_luot_1: khong-can-nguon
  ghi_chu: 'Câu cũ: "Nhiều nghiên cứu về học kỹ năng vận động cho thấy giấc ngủ giúp củng cố những gì đã tập; đôi khi bài "tự nhiên" chắc hơn sau một ngày nghỉ." Không mở được nghiên cứu nào về giấc ngủ và kỹ năng vận động; bỏ vế "nhiều nghiên cứu cho thấy", giữ lời khuyên. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
- trang: piano/ban-do-ban-phim
  id: n11
  cau: "Cách tìm Mi: phím trắng ngay bên phải nhóm 2."
  loai: cau-truc
  nguon:
