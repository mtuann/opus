- trang: piano/hop-am-rai
  id: n57
  cau: Thể đảo của hợp âm ba có một khoảng rộng hơn (quãng 4); nốt nằm ngay trên quãng 4 là nốt gốc.
  loai: quy-tac
  nguon:
    - ten: Mount, Fundamentals, Function, and Form, ch. 13 Triads (xếp chồng quãng 3; thể gốc, đảo 1, đảo 2; 6/4)
      link: https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/13-triads/
    - ten: Baylor University, Piano Basics (sách mở), Triad Inversions (định nghĩa thể gốc, đảo 1, đảo 2 theo quãng trên nốt trầm)
      link: https://openbooks.library.baylor.edu/pianobasics/chapter/triad-inversions/
  ket_qua_luot_1: dung
  ghi_chu: "Mount ch. 13: đảo 2 (6/4) có quãng 4 và quãng 6 trên bass; dựng lại chồng quãng 3: nốt gốc nằm quãng 4 trên nốt trầm. Đếm: đảo 1 Mi–Sol–Đô: quãng 4 là Sol–Đô, nốt ngay trên là Đô = gốc; đảo 2 Sol–Đô–Mi: quãng 4 là Sol–Đô, nốt trên là Đô = gốc. Đúng; cả hai thể đảo cho cùng kết luận. Câu hỏi quiz 2 cùng ý."
- trang: piano/suc-khoe
  id: n13
  cau: 'Hàng "Buổi tập dài không nghỉ": tay cần thời gian hồi phục giữa các lượt tập; tập khoảng 20 phút rồi nghỉ 10 phút, chia thành nhiều lượt ngắn.'
  loai: quy-tac
  nguon:
    - ten: BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano; Penelope Roskell và Hara Trouli, BAPAM 2016), trang trên bapam.org.uk
      link: https://www.bapam.org.uk/the-healthy-pianist/
  ket_qua_luot_1: da-sua
  ghi_chu: 'BAPAM Healthy Pianist (Practising): "Practise in twenty minute sessions, interspersed with ten minute breaks". Câu cũ "Nghỉ 5 phút sau mỗi 25–30 phút" không có nguồn nào; sửa theo BAPAM, khớp tu-the.md và cach-tap.md (lượt này). Review D4-gom: trang BAPAM The Healthy Pianist trên bapam.org.uk (mở ngày 28/10/2026, cùng nội dung tờ PDF Roskell và Trouli 2016) ghi nguyên văn: "Practise in twenty minute sessions, interspersed with ten minute breaks, to allow the hands time to recover between sessions." Giữ mốc 20/10. Trang BAPAM "Returning to Playing" (nghỉ 3–5 phút sau mỗi 20–25 phút) dành cho người quay lại sau thời gian nghỉ hay hồi phục, nên không áp dụng ở đây. Nguồn BAPAM đổi link sang trang chính thức.'
- trang: piano/gam
  id: n6
  cau: "Bài luồn ngón cái tại chỗ (ô 1: ngón 3 ở lại trên Mi, ngón cái đi giữa Đô và Fa; ô 2: ngón 4 trên Si; ô 3–4 ghép thành gam); tay trái làm ảnh gương (ngón 3 ở lại trên La3, ngón cái giữa Đô4 và Sol3; ngón 4 trên Rê3, ngón cái giữa Sol3 và Đô3)."
  loai: khuyen-tap
  nguon: []
  ket_qua_luot_1: khong-can-nguon
  ghi_chu: Bài tập soạn cho trang; khớp khối abc 1 (RH). Phần tay trái là mô tả ảnh gương, không có khối abc; ngón bấm chơi được.
