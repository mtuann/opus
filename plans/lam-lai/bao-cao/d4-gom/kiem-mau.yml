- trang: piano/cach-tap
  id: n20
  cau: 'Bước 10: xen kẽ và giãn cách: luân phiên 2–3 điểm nóng thay vì một chỗ 30 phút liền; ôn lại sau 1 ngày, 3 ngày, 1 tuần; cách này tạo cảm giác khó hơn và có vẻ "kém hơn" ngay trong buổi.'
  loai: khuyen-tap
  nguon: []
  ket_qua_luot_1: khong-can-nguon
  ghi_chu: 'Câu cũ: "…nhưng các nghiên cứu về học kỹ năng vận động cho thấy cách này giúp nhớ lâu hơn." Không mở được nghiên cứu nào về học kỹ năng vận động (Pascual-Leone, Gebrian không mở được; Roediger và Karpicke 2006 là về đoạn văn xuôi, không phải kỹ năng vận động). Bỏ vế kết luận từ nghiên cứu, giữ lời khuyên tập. Review D4-gom: lời khuyên tập còn lại sau khi sửa không cần nguồn; ket_qua đổi thành khong-can-nguon (chữ đã sửa vẫn ghi ở doi_chu của lượt 1).'
