- trang: piano/the-loai
  id: n9
  cau: 'Bảng, cột Chơi thử của Biến tấu: Beethoven, 6 biến tấu trên một bài ca Thụy Sĩ WoO 64 (không ghi chặng).'
  loai: danh-muc
- trang: piano/the-loai
  id: n10
  cau: 'Bảng, cột Chơi thử của Sonata một chương: Scarlatti, K. 32 (không ghi chặng); K. 32 Rê thứ có tên Aria.'
  loai: danh-muc
- trang: piano/the-loai
  id: n11
  cau: 'Bảng, cột Chơi thử (không ghi chặng): Mozart, Fantasia K. 397; Chopin, Nocturne Đô♯ thứ (di cảo); Brahms, Valse Op. 39 số 15, bản rút gọn của Brahms; Kabalevsky, Toccatina Op. 27 số 12.'
  loai: danh-muc
- trang: piano/the-loai
  id: n13
  cau: Nhạc phím Baroque được viết cho harpsichord, clavichord hoặc organ, khi piano còn rất mới; kho bài này dạy hai tay độc lập, phức điệu, nhịp vững.
  loai: lich-su
- trang: piano/the-loai
  id: n15
  cau: 'Bốn điệu lõi của tổ khúc: allemande (nhịp chẵn, vừa phải), courante (nhịp ba; kiểu Ý corrente thì nhanh), sarabande (nhịp ba chậm, trang nghiêm) và gigue (nhanh, nhịp ghép như 6/8).'
  loai: dinh-nghia
- trang: piano/the-loai
  id: n18
  cau: Prelude là phần mở đầu, đi trước một bản khác như fugue; fugue là bản phức điệu mà chủ đề được các bè lần lượt bắt chước.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n19
  cau: 'Bình quân luật của Bach: quyển 1 năm 1722, quyển 2 đầu những năm 1740; 48 cặp prelude và fugue qua đủ 24 giọng trưởng và thứ.'
  loai: lich-su
- trang: piano/the-loai
  id: n23
  cau: 'Domenico Scarlatti để lại hơn 550 sonata cho harpsichord (danh mục Kirkpatrick đánh số tới K. 555); nhiều bản chỉ một chương ở hình thức hai phần, mỗi phần nhắc lại: phần đầu thường chuyển sang giọng khác, phần sau quay về giọng chính; các bản về sau của ông hay mang nét nhạc dân gian bán đảo Iberia (fandango, seguidilla).'
  loai: so-lieu
- trang: piano/the-loai
  id: n25
  cau: Sonata Cổ điển thường có ba chương nhanh – chậm – nhanh; chương đầu thường ở hình thức sonata; chương cuối thường ở hình thức sonata hoặc rondo.
  loai: cau-truc
- trang: piano/the-loai
  id: n27
  cau: 'Sonatina là "sonata nhỏ" (dạng thu nhỏ của chữ sonata trong tiếng Ý); vài tập sonatina: Clementi Op. 36, Kuhlau Op. 20 và Op. 55, Diabelli Op. 151 và Op. 168.'
  loai: danh-muc
- trang: piano/the-loai
  id: n29
  cau: Rondo Mozart La thứ K. 511; Beethoven Rondo a capriccio Op. 129 (biệt danh "Giận dữ vì đồng xu bị mất"); Für Elise là rondo A–B–A–C–A.
  loai: danh-muc
- trang: piano/the-loai
  id: n32
  cau: 'Thế kỷ 19 có rất nhiều tiểu phẩm tính cách (character piece) cho piano: những bản ngắn khắc họa một tâm trạng hay một hình ảnh.'
  loai: lich-su
- trang: piano/the-loai
  id: n36
  cau: John Field, người Ireland, in những nocturne đầu tiên khoảng năm 1812–1814 (các nguồn ghi khác nhau) và thường được coi là người khai sinh thể loại; Chopin đưa nó lên đỉnh cao.
  loai: lich-su
- trang: piano/the-loai
  id: n37
  cau: Ở Nocturne Op. 9 số 2 của Chopin, tay trái rải hợp âm rộng, tay phải hát một giai điệu có nhiều nốt hoa mỹ.
  loai: cau-truc
- trang: piano/the-loai
  id: n38
  cau: Étude nghĩa là bài học; Czerny, Cramer, Clementi viết nhiều tập étude để luyện ngón.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n40
  cau: 24 prélude Op. 28 của Chopin đi qua 24 giọng theo vòng quãng năm (Đô trưởng, La thứ, Sol trưởng, Mi thứ…); sau ông có Scriabin (Op. 11), Rachmaninoff, Debussy viết prelude.
  loai: cau-truc
- trang: piano/the-loai
  id: n41
  cau: Debussy đặt tên gợi hình ở cuối mỗi prelude, trong ngoặc, để người chơi gặp âm nhạc trước khi gặp tên gọi.
  loai: lich-su
- trang: piano/the-loai
  id: n42
  cau: Mazurka là điệu nhảy dân gian Ba Lan, phách nhấn thường rơi vào phách 2; Chopin viết khoảng 60 bản.
  loai: so-lieu
- trang: piano/the-loai
  id: n43
  cau: Polonaise là điệu Ba Lan nhịp ba, tốc độ vừa, trang trọng như một cuộc rước; Chopin viết 13 bản; valse (waltz) cũng ở nhịp ba.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n44
  cau: Chopin là người đầu tiên đặt tên ballade cho một bản nhạc không lời, ông viết bốn ballade; scherzo nghĩa đen là "đùa", vốn là chương nhanh trong sonata và giao hưởng; Chopin viết bốn scherzo độc lập cho piano.
  loai: lich-su
- trang: piano/the-loai
  id: n46
  cau: Ba bản của Mendelssohn có tên Venetianisches Gondellied (Khúc thuyền gondola Venice); bản đầu tiên là Op. 19 số 6 Sol thứ.
  loai: ten
- trang: piano/the-loai
  id: n49
  cau: 'Rhapsody: tự do, thường có màu dân gian: 19 Hungarian Rhapsodies của Liszt; hai Rhapsody Op. 79 của Brahms.'
  loai: danh-muc
- trang: piano/the-loai
  id: n50
  cau: 'Intermezzo ("khúc chen giữa"): Brahms cuối đời viết nhiều intermezzo trong bốn tập Op. 116–119 (1892–1893).'
  loai: lich-su
- trang: piano/the-loai
  id: n51
  cau: 'Barcarolle: nhịp đung đưa của người chèo thuyền gondola, thường 6/8 hoặc 12/8 (Chopin Op. 60; Fauré viết 13 bản; Tchaikovsky, Tháng Sáu trong Các mùa); berceuse: khúc hát ru, như Berceuse Op. 57 của Chopin.'
  loai: danh-muc
- trang: piano/the-loai
  id: n53
  cau: Grieg viết 66 Lyric Pieces trong mười tập, từ năm 1867 đến 1901; bản đầu là Arietta; bản cuối của tập cuối gợi lại giai điệu Arietta dưới dạng valse.
  loai: so-lieu
- trang: piano/the-loai
  id: n57
  cau: 'Gặp gỡ jazz: Gershwin (ba Preludes, Rhapsody in Blue).'
  loai: danh-muc
- trang: piano/the-loai
  id: n58
  cau: 'Tĩnh lặng và lặp lại: Satie, Gymnopédies (1888); xem thêm Spiegel im Spiegel.'
  loai: danh-muc
- trang: piano/the-loai
  id: n59
  cau: Ligeti viết 18 étude cho piano (1985–2001).
  loai: so-lieu
- trang: piano/the-loai
  id: n66
  cau: 'Quiz: Nocturne do Field khai sinh và Chopin đưa lên đỉnh cao; Field in những nocturne đầu tiên khoảng năm 1812–1814.'
  loai: lich-su
- trang: piano/the-loai
  id: n68
  cau: 'Quiz: sonata Scarlatti thường một chương, hai phần, mỗi phần nhắc lại; phần đầu thường chuyển sang giọng khác, phần sau quay về giọng chính.'
  loai: cau-truc
- trang: piano/the-loai
  id: n70
  cau: 'Quiz: Debussy đặt tên gợi hình ở cuối mỗi prelude; tên nằm trong ngoặc ở cuối bản: người chơi gặp âm nhạc trước, rồi mới gặp tên gọi.'
  loai: lich-su
- trang: piano/the-loai
  id: n71
  cau: 'Mục Nguồn: Hinson & Roberts, Guide to the Pianist''s Repertoire (tái bản lần 4, Indiana University Press, 2014); Rosen, The Romantic Generation (Harvard University Press, 1995); Rowland (chủ biên), The Cambridge Companion to the Piano (Cambridge University Press, 1998).'
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n46
  cau: Schubert, Trois marches militaires D. 733, in năm 1826 thành Op. 51; số 1 ở giọng Rê trưởng.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n52
  cau: 'Schubert, Fantasia Fa thứ D. 940 (1828): bốn phần Allegro molto moderato, Largo, Allegro vivace, Tempo I.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n57
  cau: Trong Erlkönig của Schubert, piano là tiếng vó ngựa phi suốt bài, đến câu cuối mới dừng để giọng hát kể như nói (recitative).
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n83
  cau: Nghe chương 4 của Con cá hồi (chủ đề và biến tấu), để ý khi nào piano dẫn, khi nào nó lùi lại.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n98
  cau: 'Moore dẫn lại, với ý không đồng tình, lời "khen" mà giọng tenor Raimund von zur Mühlen viết cho người đệm Coenraad V. Bos: "Tối qua chắc anh chơi hay lắm, vì suốt buổi tôi chẳng để ý thấy tiếng đàn của anh."'
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n104
  cau: Một trong những người góp phần lớn thay đổi cách nhìn về người đệm đàn là Gerald Moore.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n113
  cau: Diabelli Op. 149 có bản của Edition Peters (EP 2442).
  loai: danh-muc
- trang: piano/hoa-am/ung-tac
  id: n18
  cau: Người ta từng cho rằng nó được viết ở Paris năm 1778; nghiên cứu chữ viết và giấy của bản thảo cho thấy khoảng 1781–1782 mới đúng hơn.
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n24
  cau: Biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ); biến tấu 12 đổi sang 3/4 và khép bằng coda (cũng là đáp án và giải thích câu hỏi 2 của phần Kiểm tra nhanh).
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n36
  cau: C. P. E. Bach đã in những sonata ghi sẵn các lần nhắc lại được biến đổi (Sechs Sonaten für Clavier mit veränderten Reprisen, 1760).
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n39
  cau: 'Ở thế kỷ 19, dạo đầu (preluding) trước một bản nhạc là một kỹ năng được dạy hẳn hoi: Czerny in cả một tập 120 ví dụ dạo đầu, chuyển giọng, kết và fantasia (Op. 300).'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n57
  cau: 'Câu hỏi 4: một đoạn dạo đầu ngắn giúp báo giọng, làm quen cây đàn, làm ấm tay hoặc nối hai bài khác giọng; Czerny in cả một tập 120 ví dụ dạo đầu, chuyển giọng, kết và fantasia, Op. 300.'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n59
  cau: 'Nguồn: K. 265 trên IMSLP (trang tác phẩm), bản cho hai guitar theo ấn bản Porro trên Mutopia, lời nói đầu ấn bản Urtext Henle HN 116.'
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n6
  cau: 'Fonte (giếng, nguồn nước), Monte (núi), Ponte (cầu): nghĩa các tên tiếng Ý.'
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n14
  cau: Conservatorio là trường ở Napoli, Venezia và những nơi khác, nơi trẻ em được "gìn giữ" (conserved) và học nhạc.
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n34
  cau: Romanesca đứng đầu bài hay đầu câu; theo sau thường là một mẫu trả lời như Prinner.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n35
  cau: 'Romanesca có hai dạng bass chính: dạng nhảy (xuống quãng 4 xen lên một bậc: 1–5–6–3) và dạng đi liền (bass đi bậc xuống).'
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n58
  cau: 'Cadenza doppia: bass giữ 5 bốn bước rồi 1, giai điệu 4–3–2–2–1, bè giữa cách bass quãng 5–4–4–3 (Rê – Đô – Đô – Si ở Đô trưởng).'
  loai: cau-truc
- trang: piano/thi-tau
  id: n4
  cau: Người đọc giỏi nhìn khoảng cách giữa các nốt và hình dạng cả nhóm nốt, giống như ta đọc cả chữ chứ không đọc từng chữ cái; có ba cách nhận ra một nốt (nốt mốc, quãng tính từ nốt trước, hình mẫu), hãy tập cả ba.
  loai: cau-truc
- trang: piano/thi-tau
  id: n53
  cau: Nốt thấp nhất (bè trầm) cho biết hợp âm đang ở thế gốc hay thể đảo.
  loai: quy-tac
- trang: piano/thi-tau
  id: n29
  cau: 'Bartók, Mikrokosmos quyển 1–2: gồm 153 bài xếp theo độ khó tăng dần; quyển 1–2 là những bài đầu.'
  loai: cau-truc
- trang: piano/thi-tau
  id: n49
  cau: 'Béla Bartók, Mikrokosmos: 153 bài trong sáu quyển, in lần đầu năm 1940 (G. Henle Verlag, quyển 1–2, HN 1408).'
  loai: ten
- trang: piano/10-bai-dau-tien
  id: n55
  cau: Hänschen klein là bài hát thiếu nhi Đức.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n56
  cau: 'Học được ở bài 4: hợp âm ba nốt ở tay trái và đổi giữa hai hình: hợp âm chủ Đô – Mi – Sol (ngón 5-3-1) và hợp âm bảy át Si – Fa – Sol (ngón 5-2-1).'
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n107
  cau: 'Nguồn: giai điệu từ dân ca Pháp, Anh, bài hát thiếu nhi Đức; thánh ca "New Britain"; Beethoven, Giao hưởng số 9 và Bagatelle WoO 59; Dvořák, Giao hưởng số 9; Petzold, Minuet BWV Anh. 114.'
  loai: lich-su
- trang: piano/not-lap-not-kep
  id: n25
  cau: Tai người nghe có xu hướng ưu tiên bè cao nhất.
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n35
  cau: Quãng ba nửa cung cần ngón bấm riêng (Graham Fitch có một mục về quãng ba thứ nửa cung trong bài "Nimble Chromatics").
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n51
  cau: 'Quiz 4: khi không thể nối cả hai bè của chuỗi quãng ba, ưu tiên giữ bè trên legato vì bè trên thường là giai điệu và tai người nghe có xu hướng ưu tiên bè cao nhất.'
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n37
  cau: 'Cột "Thường do tay nào": ba vùng trầm (A0–B3) là tay trái, vùng giữa (C4–B4) cả hai tay quanh Đô giữa, hai vùng cao (C5–C8) tay phải; hình ghi "thường là vùng của tay trái / tay phải".'
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n40
  cau: 'Trên bản nhạc piano, khuông khóa Sol thường dành cho tay phải và khuông khóa Fa cho tay trái; đó là quy ước, không phải luật: khóa có thể đổi giữa chừng, và tay trái có khi chơi trên khuông khóa Sol.'
  loai: quy-tac
- trang: piano/hoa-am/index
  id: i3
  cau: Phần này dành cho người lớn đã xong chặng sơ cấp (chặng 2 của lộ trình, khoảng Grade 1–2), cho đến hết chặng trung cấp.
  loai: cap-do
- trang: piano/hoa-am/index
  id: i6
  cau: 'Hòa âm bên phím gắn với bốn việc: đọc nhạc (một phần lớn của đọc nhanh là nhận ra hình mẫu; I–IV–V–I hay một kết là hình mẫu), học thuộc (khung hòa âm là phần trí nhớ phân tích, cho chỗ bám lại khi lỡ quên), hiểu bản nhạc (luyện cả tai lẫn đầu óc, không chỉ ngón tay), ứng tác.'
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n39
  cau: 'Bài kiểm tra: Đô giữa nằm ngay bên trái nhóm hai phím đen gần giữa đàn và là nốt Đô thứ tư tính từ dưới lên; mọi nốt Đô (trừ Đô8 ở đầu cao của đàn) đều nằm ngay bên trái nhóm hai phím đen; ở thế Đô, ngón 5 tay trái trên Đô3.'
  loai: dinh-nghia
- trang: piano/lo-trinh
  id: n13
  cau: 'Dòng Đọc nhạc của chặng 1–6 (bài 4–8 ô nhịp, thị tấu dễ hơn bài đang tập khoảng hai cấp: Grade 1–2 ở chặng 3, Grade 2–3 ở chặng 4, Grade 3–4 ở chặng 5, Grade 5 ở chặng 6; đọc theo hình dạng quãng; nhìn trước vài nốt, xa dần nhưng hiếm khi tới trọn một ô nhịp; bốn tay, đệm, nhạc thính phòng).'
  loai: khuyen-tap
