  nguon: ["https://www.yamaha.com/en/musical_instrument_guide/piano/mechanism/mechanism003.html", "https://msteinert.com/blog/grand-vs-upright-piano-actions"]
  ghi_chu: "Cơ cấu thường (đàn đứng) cần phím trồi lại gần hết mới đánh lại; Steinert: trên đàn đứng phải nhấc phím gần hết về vị trí nghỉ. Pianist: ở nốt lặp chậm có nốt không kêu vì chưa nhả đủ."
