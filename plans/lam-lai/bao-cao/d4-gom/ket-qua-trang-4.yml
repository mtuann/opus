  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/"]
  ghi_chu: "OMT: đồng âm quãng tám là 'pitches that share a letter name but are separated by one or more octaves'; Đô4–Đô5 là quãng tám."
- trang: piano/quang-tam-buoc-nhay
  id: n3
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/"]
  ghi_chu: "Hai nốt cùng tên (quãng tám) luôn cùng loại phím: Đô–Đô cùng trắng; Rê♭–Rê♭ cùng đen. Suy ra từ OMT (cùng tên, cách nhau quãng tám)."
- trang: piano/quang-tam-buoc-nhay
  id: n6
  luot_2: dung
  nguon: ["https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf"]
  ghi_chu: "BAPAM: 'Look out for resting points and practise minimising tension between repetitive octaves or large chords'. Khép tay giữa hai quãng tám là cách thực hiện hợp lý."
- trang: piano/quang-tam-buoc-nhay
  id: n9
  luot_2: dung
  nguon: ["https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf", "https://www.livingpianos.com/articles/how-to-finger-octaves/"]
  ghi_chu: "BAPAM: người tay nhỏ cẩn thận không căng quá; livingpianos: 1-5 trên phím trắng, 1-4 trên phím đen 'unless very large hands'. Ý 1–5 cả trên phím đen cho tay nhỏ và bỏ bớt nốt nhân đôi: lời khuyên chấp nhận được, không nguy hại, có hỏi thầy."
- trang: piano/quang-tam-buoc-nhay
  id: n13
  luot_2: dung
  nguon: ["https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf", "https://www.livingpianos.com/articles/how-to-finger-octaves/"]
  ghi_chu: "BAPAM: động tác 'tension-free'; livingpianos: 'the wrists accomplish octaves, but the arms have an essential role'. Câu 'không bao giờ khóa cổ tay' là cách nói mạnh nhưng đúng hướng, không gây hại."
- trang: piano/quang-tam-buoc-nhay
