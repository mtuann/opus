  nguon: ["https://www.horniman.ac.uk/object/M99-1983", "https://www.finchcocks.co.uk/Richard-Burnett-Collection/file/erard.php", "https://www.mbam.qc.ca/en/articles/bourgie-halls-erard-piano/"]
  ghi_chu: "Horniman: 'In 1821, Erard patented a new action ... the double escapement'; Finchcocks: cơ cấu thoát kép 'patented by Pierre in London in 1821' (Pierre là cháu Sébastien, cùng nhà Érard). Yamaha: cơ cấu lặp (thoát kép) do Érard phát minh. 'Tiền thân cơ cấu đàn cánh ngày nay': MBAM Montréal gọi 'a direct antecedent of the modern grand piano'."
- trang: piano/not-lap-not-kep
  id: n5
  luot_2: dung
  nguon: ["https://www.yamaha.com/en/musical_instrument_guide/piano/mechanism/mechanism003.html", "https://msteinert.com/blog/grand-vs-upright-piano-actions"]
  ghi_chu: "Yamaha: cơ cấu lặp 'lets a pianist quickly repeat a note without having to fully release the key'; Steinert: búa đánh lại được khi phím chưa về hết. Chi tiết 'búa giữ lưng chừng' (back check) và 'cần lặp đặt lại cơ cấu đẩy' khớp mô tả cơ cấu cánh."
- trang: piano/not-lap-not-kep
  id: n6
  luot_2: dung
  nguon: ["https://msteinert.com/blog/grand-vs-upright-piano-actions", "https://www.yamaha.com/en/musical_instrument_guide/piano/mechanism/mechanism003.html"]
  ghi_chu: "Steinert: đàn đứng 'requires the pianist to lift the key almost entirely back up', nên lặp nốt chậm hơn đàn cánh. Câu 'đàn đứng thông thường không có thoát kép' khớp."
