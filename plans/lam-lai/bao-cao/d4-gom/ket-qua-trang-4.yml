- trang: piano/hop-am-rai
  id: n4
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/inversion/"]
  ghi_chu: "Thể gốc: nốt gốc ở bass; đảo 1: nốt ba; đảo 2: nốt năm (OMT). Các nốt Đô–Mi–Sol, Mi–Sol–Đô, Sol–Đô–Mi đúng."
- trang: piano/hop-am-rai
  id: n5
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/inversion/", "https://www.gmajormusictheory.org/Fundamentals/Ch13.pdf", "https://viva.pressbooks.pub/openmusictheory/chapter/triads/"]
  ghi_chu: "Đô–Mi–Sol = 3 trưởng + 3 thứ (hai quãng ba xếp chồng). Đảo 1 Mi–Sol–Đô: 3 thứ rồi 4 đúng; đảo 2 Sol–Đô–Mi: 4 đúng rồi 3 trưởng. GM13 nói đảo có một quãng 4."
- trang: piano/hop-am-rai
  id: n7
  luot_2: dung
  nguon: ["https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads", "https://openbooks.library.baylor.edu/pianobasics/?p=152"]
  ghi_chu: "Gốc: tay phải 1-3-5, tay trái 5-3-1 (nguồn nói tay trái vẫn 5-3-1 ở đảo 1; Baylor tay phải 1-2-3-5 cho rải)."
- trang: piano/hop-am-rai
  id: n8
  luot_2: dung
  nguon: ["https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads"]
  ghi_chu: "Đảo 1: tay phải 1-2-5, tay trái 5-3-1 (nguồn nói đúng như vậy). Quãng 4 Sol–Đô nằm giữa ngón 2 và 5 nên hợp lý."
- trang: piano/hop-am-rai
  id: n9
  luot_2: dung
  nguon: ["https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads"]
  ghi_chu: "Đảo 2: tay trái 5-2-1; tay phải 'either 1-3-5 or 1-2-4' (nguồn). Pianote ghi 1-2-5 cho tay phải: cách dạy khác nhau, câu vẫn đúng."
- trang: piano/hop-am-rai
  id: n13
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/broken-chord", "https://www.britannica.com/art/Alberti-bass"]
  ghi_chu: "Oxford: hợp âm rải gãy là các nốt chơi lần lượt thay vì cùng lúc. Ý 'bàn tay giữ thế hợp âm' là lời dạy kỹ thuật, không mâu thuẫn."
- trang: piano/hop-am-rai
  id: n16
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=152", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/broken-chord"]
  ghi_chu: "Hợp âm rải hai quãng tám có ngón bấm theo nhóm (Baylor); định nghĩa 'như gam chỉ gồm nốt hợp âm' là cách diễn đạt sư phạm hợp lý."
- trang: piano/hop-am-rai
  id: n18
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=152", "https://faculty.evansville.edu/gu2/Scales.htm"]
  ghi_chu: "Baylor: tay phải 123+123+5, tay trái 5+421+421 (Đô trưởng và mọi giọng thứ phím trắng); Evansville: Đô trưởng và La thứ cùng tay trái 5 4 2 1 4 2 1 (tay phải ghi kết bằng 1, khác Baylor ở nốt cuối: cách dạy chuẩn là 5)."
- trang: piano/hop-am-rai
  id: n19
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=152"]
  ghi_chu: "Baylor: đổi nhóm bằng thay ngón 5 thành 1 rồi lặp mẫu (tay phải 123+123+5; tay trái 5+421+421). Sol→Đô là quãng 4 đúng; tay trái 4 qua ngón cái theo mẫu 421."
- trang: piano/hop-am-rai
  id: n20
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=152"]
  ghi_chu: "Baylor Piano Basics: 'one white key between do and mi, use finger 4'; 'two white keys, use finger 3'. Nhóm 5-4-2-1 cho Đô, Sol, Fa. Đúng như câu."
- trang: piano/hop-am-rai
  id: n22
  luot_2: dung
  nguon: ["https://robertkelleyphd.com/home/arpfing.htm", "https://faculty.evansville.edu/gu2/Scales.htm", "https://www.cs.miami.edu/~burt/music/finger-charts.html"]
  ghi_chu: "Mi♭ trưởng tay phải: Kelley 2-1-2-4, Miami 3-1-2-4-1-2-4, Evansville 4-1-2-4; ngón cái đều trên Sol. Kelley: ngón cái ở phím trắng. Khớp 'ngón 2, 3 hoặc 4 tùy sách'."
- trang: piano/hop-am-rai
  id: n28
  luot_2: dung
  nguon: ["https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/", "https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads"]
  ghi_chu: "I Đô–Mi–Sol, IV (6/4) Đô–Fa–La, V (6/3) Si–Rê–Sol: Đô giữ nguyên ở I→IV; mọi nốt đi gần. Ngón 5-3-1 / 5-2-1 / 5-3-1 khớp nguồn (đảo 2 tay trái 5-2-1; đảo 1 tay trái 5-3-1)."
- trang: piano/hop-am-rai
  id: n32
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/alberti-bass", "https://www.britannica.com/art/Alberti-bass"]
  ghi_chu: "Oxford: thấp – cao – giữa – cao; Đô–Sol–Mi–Sol đúng."
- trang: piano/hop-am-rai
  id: n33
  luot_2: dung
  nguon: ["https://www.britannica.com/biography/Domenico-Alberti", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/alberti-bass"]
  ghi_chu: "Britannica: Domenico Alberti, nhà soạn nhạc Venice, sinh khoảng 1710, mất 1740 (Italy, thế kỷ 18); Oxford: 'Italian composer Domenico Alberti' phổ biến hóa hình đệm."
- trang: piano/hop-am-rai
  id: n36
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/alberti-bass"]
  ghi_chu: "Bản Mutopia K545-1.ly ô 1 tay trái đúng c g e g (thấp-cao-giữa-cao) với ngón 5-1-3-1; các ô sau cùng dạng đệm Alberti. Chương 1 K. 545 mở đầu bằng bass Alberti."
- trang: piano/hop-am-rai
  id: n38
  luot_2: dung
  nguon: ["https://fass.open.ac.uk/sites/fass.open.ac.uk/files/files/music/A%20Level%20Music%20Chopin%20Nocturne%20Em%20Op72%201.pdf", "https://files.schudio.com/great-sankey-high-school/files/documents/Chopin_Nocturne_in_E_minor.pdf"]
  ghi_chu: "Hình đệm rải rộng nocturne: nốt trầm rồi rải lên (OU: tay trái 'spread over two octaves'); Đô–Sol–Mi' = gốc, 5, 10 đúng theo cấu tạo; bản thay bằng Đô–Sol–Đô' hợp lý cho tay nhỏ. Nguồn không nêu quãng 10 cụ thể."
- trang: piano/hop-am-rai
  id: n39
  luot_2: dung
  nguon: ["https://fass.open.ac.uk/sites/fass.open.ac.uk/files/files/music/A%20Level%20Music%20Chopin%20Nocturne%20Em%20Op72%201.pdf", "https://files.schudio.com/great-sankey-high-school/files/documents/Chopin_Nocturne_in_E_minor.pdf"]
  ghi_chu: "OU và bài Chopin Op. 72/1: tay trái trải rộng, dùng bàn đạp giữ hòa âm; giai điệu tay phải. Khớp mô tả."
- trang: piano/hop-am-rai
  id: n42
  luot_2: khong-chac
  nguon: ["https://www.britannica.com/art/Alberti-bass", "https://fass.open.ac.uk/sites/fass.open.ac.uk/files/files/music/A%20Level%20Music%20Chopin%20Nocturne%20Em%20Op72%201.pdf"]
  ghi_chu: "Cột 'Hay gặp ở' ghép kiểu đệm với thể loại. Xác nhận được: Alberti (Britannica: nhạc phím đàn thế kỷ 18; Oxford), nocturne (OU, Schudio), valse nhịp 3/4 (Oxford). Phần thánh ca, minuet, nhạc khiêu vũ, bài hát không lời là liên hệ phổ biến nhưng không có trang đã mở nào nêu rõ. Không chắc cả cột."
- trang: piano/hop-am-rai
  id: n43
  luot_2: dung
  nguon: ["https://symposium.music.org/volume-22/articles-1752877059/a-re-evaluation-of-keyboard-harmony"]
  ghi_chu: "Bài của College Music Society: môn keyboard harmony gồm chơi các ví dụ hòa âm trên đàn và chuyển giọng ('transposing progressions to different keys'). Không có định nghĩa chính thức mở được, nhưng khớp mô tả."
- trang: piano/hop-am-rai
  id: n44
  luot_2: dung
  nguon: ["https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/"]
  ghi_chu: "RWU: giữ nguyên nốt chung ('hold over all common tones') và các bè khác đi tới nốt gần nhất của hợp âm sau."
- trang: piano/hop-am-rai
  id: n45
  luot_2: dung
  nguon: ["https://musictheory.pugetsound.edu/mt21c/cadences.html", "https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/"]
  ghi_chu: "MT21C: IV–I là cadence plagal, V–I là cadence authentic; chuỗi I–IV–I–V7–I gồm cả hai. Palmer/Manus/Lethco dùng đúng chuỗi này trong 'Cadences'."
- trang: piano/hop-am-rai
  id: n47
  luot_2: dung
  nguon: ["https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70"]
  ghi_chu: "Đô trưởng: I Đô–Mi–Sol, IV Đô–Fa–La, V7 thiếu nốt năm Si–Fa–Sol với bass Sol (V7 không nốt 5 gấp đôi gốc). Chuỗi nốt tay phải và tay trái đúng."
- trang: piano/hop-am-rai
  id: n48
  luot_2: dung
  nguon: ["https://pressbooks.nebraska.edu/openmusictheory/?p=361", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70"]
  ghi_chu: "Si cảm âm (nốt ba), Fa nốt bảy, Sol nốt gốc; Rê (nốt 5) lược bỏ. HMS: 'V7 without the 5th (re) and with a doubled root is an incomplete V7'; OMT: nốt năm bỏ để giải về I đủ nốt."
- trang: piano/hop-am-rai
  id: n49
  luot_2: dung
  nguon: ["https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/02%3A_Diatonic_Polyphony_and_Functional_Harmony/2.09%3A_The_Dominant_Seventh_Chord"]
  ghi_chu: "HMS: 'always move ti to do and fa to mi'; Mount: 7̂→1̂, 4̂→3̂. Sol là nốt chung gốc giữ nguyên (trong bản bỏ nốt 5, Sol là bass và nốt gốc)."
- trang: piano/hop-am-rai
  id: n51
  luot_2: dung
  nguon: ["https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/", "https://pressbooks.nebraska.edu/openmusictheory/?p=361"]
  ghi_chu: "Theo mẫu I, IV, V7 ở bảy giọng: nốt thấp nhất tay phải là chủ âm ở I và IV, cảm âm ở V7; tay trái gốc–IV–gốc–V–gốc. Đúng theo cấu tạo hợp âm đã nêu ở n47/n48; bảng bảy giọng là phần về site không kiểm riêng từng giọng."
- trang: piano/hop-am-rai
  id: n52
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/04%3A_Diatonic_Harmony_Tonicization_and_Modulation/4.02%3A_Strengthening_Endings_with_V7"]
  ghi_chu: "La thứ: I La–Đô–Mi, iv La–Rê–Fa (iv đảo 2 của Rê thứ), V7 thiếu nốt 5: Sol♯–Rê–Mi. OMT: ở giọng thứ dùng ti (nốt Sol♯) trong V7 để hợp âm là trưởng-thứ (7)."
- trang: piano/hop-am-rai
  id: n56
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/", "https://viva.pressbooks.pub/openmusictheory/chapter/triads/"]
  ghi_chu: "Hợp âm xếp chồng quãng 3: mỗi quãng 3 đi từ dòng sang dòng hoặc khe sang khe, nên 3 hoặc 4 nốt cùng dòng hoặc cùng khe (suy ra từ định nghĩa xếp chồng quãng 3 'snowperson' của OMT)."
- trang: piano/hop-am-rai
  id: n57
  luot_2: dung
  nguon: ["https://www.gmajormusictheory.org/Fundamentals/Ch13.pdf", "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/"]
  ghi_chu: "GM13 mục 13.5: nếu đảo, gốc là nốt trên của quãng 4. OMT: gốc là nốt cho tên hợp âm. Đảo 1 (Mi–Sol–Đô) quãng 4 ở hai nốt trên, đảo 2 (Sol–Đô–Mi) ở hai nốt dưới; cả hai nốt trên quãng 4 là Đô."
- trang: piano/hop-am-rai
  id: n58
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/", "https://viva.pressbooks.pub/openmusictheory/chapter/inversion/"]
  ghi_chu: "Suy ra từ cấu tạo: bất kỳ thể đảo của hợp âm bảy xếp chồng 3 có một quãng 2 giữa nốt bảy và nốt gốc, nốt gốc ở trên (ví dụ Sol7: Si–Rê–Fa–Sol, Rê–Fa–Sol–Si, Fa–Sol–Si–Rê đều có Fa–Sol). OMT mở được không phát biểu quy tắc này nguyên văn."
- trang: piano/hop-am-rai
  id: n59
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/inversion/"]
  ghi_chu: "OMT: gốc là nốt cho tên hợp âm bất kể thể đảo ('the root of the chord is always A, regardless of its inversion'). Sol–Si–Rê–Fa là V7 của Đô trưởng."
- trang: piano/hop-am-rai
  id: n64
  luot_2: dung
  nguon: ["https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads"]
  ghi_chu: "Đảo 1 tay phải 1-2-5; quãng 4 Sol–Đô nằm trên."
- trang: piano/hop-am-rai
  id: n65
  luot_2: dung
  nguon: ["https://www.gmajormusictheory.org/Fundamentals/Ch13.pdf"]
  ghi_chu: "GM13: gốc là nốt trên quãng 4. Sol–Đô–Mi: quãng 4 Sol–Đô, gốc Đô."
- trang: piano/hop-am-rai
  id: n66
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/alberti-bass", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly"]
  ghi_chu: "Thấp–cao–giữa–cao; Mutopia K. 545 ô 1 tay trái c(5) g(1) e(3) g, đúng ngón 5-1-3-1."
- trang: piano/hop-am-rai
  id: n67
  luot_2: dung
  nguon: ["https://pressbooks.pub/harmonyandmusicianshipwithsolfege/?p=70", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Fundamentals_Function_and_Form_(Mount)/02%3A_Diatonic_Polyphony_and_Functional_Harmony/2.09%3A_The_Dominant_Seventh_Chord"]
  ghi_chu: "V7 (Si–Fa–Sol) về I: Si lên Đô, Fa xuống Mi, Sol giữ."
- trang: piano/hop-am-rai
  id: n68
  luot_2: dung
  nguon: ["https://robertkelleyphd.com/home/arpfing.htm"]
  ghi_chu: "Kelley: ngón cái giữ phím trắng; Mi♭–Sol–Si♭ chỉ Sol trắng."
- trang: piano/hop-am-rai
  id: n69
  luot_2: dung
  nguon: ["https://www.stretta-music.de/en/lethco-manus-palmer-the-complete-book-of-scales-chords-arpeggios-cadences-nr-373409.html", "https://lib.ecu.edu/catalog-preview/catalog/1355113", "https://faculty.evansville.edu/gu2/Scales.htm", "https://book-to-articles.onrender.com/articles/all-about-piano/inverting-major-triads", "https://www.musicroom.com/piano-scales-1-arpeggios-from-2021-grade-1-9781848499515"]
  ghi_chu: "Đã mở: Palmer/Manus/Lethco, The Complete Book of Scales, Chords, Arpeggios & Cadences (Alfred) tồn tại; Kostka & Payne, Tonal Harmony (McGraw-Hill, bản 5, 2004); trang Evansville; bài MuseScore 'inverting major triads' (qua bản chép lại); ABRSM Piano Scales & Arpeggios from 2021 tồn tại. Không kiểm nội dung từng trang sách in."
- trang: piano/hop-am-rai
  id: n17
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên hợp lý; khoảng luồn một quãng 4 khớp với mẫu 123+123+5 của Baylor."
- trang: piano/hop-am-rai
  id: n1
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên chung, hợp lý."
- trang: piano/hop-am-rai
  id: n31
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên tập hợp lý, hợp cách dạy phổ biến."
- trang: piano/nam-ngon
  id: n2
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=82"]
  ghi_chu: "Baylor: mẫu năm ngón gồm năm nốt đầu của gam (do re mi fa sol)."
- trang: piano/nam-ngon
  id: n4
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=59", "https://openbooks.library.baylor.edu/pianobasics/?p=108"]
  ghi_chu: "Baylor: ngón cái là 1, ngón 5 dùng cho nốt cao nhất tay phải / thấp nhất tay trái; hai tay bắt đầu cùng số ngón (hai ngón cái trên Đô giữa)."
- trang: piano/nam-ngon
  id: n5
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=59", "https://openbooks.library.baylor.edu/pianobasics/?p=82"]
  ghi_chu: "Đô4 = Đô giữa. Tay phải Đô4–Sol4 (1–5); tay trái ngón 5 trên Đô3 (Đô–Rê–Mi–Fa–Sol với 5-4-3-2-1 lên Sol3). Suy ra từ tên nốt và Baylor."
- trang: piano/nam-ngon
  id: n6
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=59"]
  ghi_chu: "Baylor: hai ngón cái cùng trên Đô giữa. Tay trái Fa3–Sol3–La3–Si3–Đô4 với 5-4-3-2-1: ngón 5 trên Fa3, ngón 1 trên Đô4, đúng."
- trang: piano/nam-ngon
  id: n7
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=82"]
  ghi_chu: "Sol–La–Si–Đô–Rê: tay phải Sol4–Rê5, tay trái Sol2–Rê3 (5-4-3-2-1); đúng theo tên nốt."
- trang: piano/nam-ngon
  id: n8
  luot_2: dung
  nguon: ["https://openbooks.library.baylor.edu/pianobasics/?p=82"]
  ghi_chu: "Fa–Sol–La–Si♭–Đô: Si♭ là ngón 4 tay phải (1 Fa, 2 Sol, 3 La, 4 Si♭, 5 Đô) và ngón 2 tay trái (5 Fa, 4 Sol, 3 La, 2 Si♭, 1 Đô). Tay phải Fa4–Đô5, tay trái Fa2–Đô3 đúng."
- trang: piano/nam-ngon
  id: n11
