- trang: piano/lich-su-dan
  id: n1
  cau: Cây đàn bạn tập hôm nay là kết quả của hơn ba thế kỷ cải tiến.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n2
  cau: 'Clavichord: một lưỡi đồng nhỏ (tangent) gõ vào dây rồi nằm lại trên dây cho đến khi nhả phím; to nhỏ theo lực ngón nhưng rất nhỏ tiếng; rung nhẹ ngón trên phím tạo tiếng rung (Bebung).'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n3
  cau: Clavichord là nhạc cụ để tập và chơi ở nhà; C. P. E. Bach rất yêu thích nó.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n4
  cau: 'Harpsichord: miếng gảy gắn trên con đẩy (jack) gảy dây; không to nhỏ theo lực ngón; là một trong những nhạc cụ phím quan trọng nhất của thời Baroque.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n5
  cau: Harpsichord đổi màu tiếng bằng các bộ dây (register) và hai tầng phím.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n6
  cau: 'Organ: hơi thổi qua ống; tiếng giữ nguyên chừng nào còn giữ phím; đổi màu bằng các bộ ống.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n7
  cau: Trước năm 1700, người chơi nhạc phím có ba lựa chọn chính (clavichord, harpsichord, organ); không cái nào làm được điều piano làm được; ước mơ của người chơi thế kỷ 17 là nhạc cụ có sức vang của harpsichord mà "nói" theo ngón như clavichord.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n8
  cau: Bản kiểm kê nhạc cụ nhà Medici năm 1700 ghi một chiếc arpicimbalo "mới được Bartolomeo Cristofori phát minh", có búa và bộ giảm âm, âm vực bốn quãng tám; vì vậy năm 1700 thường được coi là năm sinh của piano.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n9
  cau: Bartolomeo Cristofori (1655–1732) phụ trách nhạc cụ cho hoàng tử Ferdinando de' Medici ở Florence.
  loai: nam
- trang: piano/lich-su-dan
  id: n10
  cau: Năm 1711, nhà văn Scipione Maffei viết bài mô tả chiếc đàn, gọi nó là gravicembalo col piano, e forte ("harpsichord có nhỏ và có to"); từ đó sinh ra hai chữ pianoforte và piano.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n11
  cau: 'Điều thiên tài của Cristofori là bộ máy: búa gõ dây thay vì miếng gảy (bấm nhanh thì tiếng to, bấm chậm thì tiếng nhỏ); cơ cấu thoát cho búa rời dây ngay sau khi gõ; bộ giảm âm là miếng chặn rơi xuống dây khi nhả phím.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n12
  cau: 'Ba cây đàn của Cristofori còn tồn tại: cây năm 1720 ở Metropolitan (New York, 54 phím), cây 1722 ở Bảo tàng Nhạc cụ Quốc gia ở Rome, cây 1726 ở Bảo tàng Nhạc cụ của Đại học Leipzig.'
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n13
  cau: Silbermann bắt đầu làm piano theo thiết kế Cristofori từ những năm 1730 sau khi đọc bài của Maffei dịch sang tiếng Đức năm 1725; Bach chê một cây đời đầu vì phím nặng và âm cao yếu, về sau khen và giúp bán đàn; Frederick Đại đế mua nhiều cây.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n14
  cau: Bài viết của Maffei được dịch sang tiếng Đức năm 1725.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n15
  cau: Bach đã chơi đàn Silbermann của vua Frederick ở cung điện Potsdam năm 1747, chuyến thăm sinh ra Musikalisches Opfer.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n16
  cau: Phần lớn nhạc phím của Bach được viết cho harpsichord, clavichord hoặc organ; chơi Bach trên piano là một lựa chọn diễn giải.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n17
  cau: Johann Andreas Stein (1728–1792) ở Augsburg đặt nền móng cho bộ máy Vienna (Prellmechanik) và được cho là người đưa vào cần đầu gối nhấc bộ giảm âm, tiền thân của bàn đạp vang; Anton Walter làm đàn theo mẫu này ở Vienna.
  loai: nam
- trang: piano/lich-su-dan
  id: n18
  cau: Con gái Stein, Nannette Streicher, chuyển xưởng đến Vienna năm 1794.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n19
  cau: 'Đàn Vienna: phím nông và nhẹ, búa nhỏ, tiếng trong và tắt nhanh.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n20
  cau: 'Năm 1777, ở Augsburg, Mozart thử đàn Stein rồi viết thư kể cho cha: chạm phím cách nào tiếng vẫn đều, đàn giảm âm tốt hơn hẳn những cây ông từng chơi, và có cơ cấu thoát.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n21
  cau: Khoảng năm 1783 Mozart mua một cây đàn của Walter; cây đàn này nay ở Bảo tàng Mozart tại Salzburg.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n22
  cau: Ở London, Johannes Zumpe làm piano vuông nhỏ gọn từ những năm 1760, loại đàn gia đình rất được ưa chuộng.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n23
  cau: Các xưởng London, nổi bật là Broadwood, làm đàn cánh với bộ máy Anh (English action), khác hẳn bộ máy Vienna.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n24
  cau: Cả hai loại đàn thời này có âm vực khoảng năm quãng tám; đàn Stein chạy từ FF đến f''' (Fa1–Fa6).
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n25
  cau: Beethoven có một cây đàn Érard từ Paris năm 1803.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n26
  cau: 'Beethoven có một cây Broadwood từ London (Thomas Broadwood tặng năm 1818): sáu quãng tám, từ CC đến c'''''''' (Đô1–Đô7).'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n27
  cau: 'Beethoven có một cây của Conrad Graf ở Vienna năm 1825: sáu quãng tám rưỡi, từ CC đến f'''''''' (Đô1–Fa7).'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n28
  cau: Hình keyboard-ranges so âm vực các cây đàn với bàn phím 88 phím.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n29
  cau: Ở đầu chương 1 Sonata Ánh trăng, Beethoven ghi senza sordino, tức giữ bàn đạp suốt chương; trên đàn thời đó tiếng tắt nhanh nên chỉ thành lớp sương mỏng, trên đàn hiện đại thì hỗn độn.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n31
  cau: 'Cơ cấu thoát kép của Érard (bằng sáng chế ở Anh năm 1821): đánh lại một nốt khi phím mới nhả lên một phần, nền tảng bộ máy đàn cánh hiện đại.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n32
  cau: 'Khung sắt đúc: Jonas Chickering được cấp bằng sáng chế năm 1843 cho đàn cánh.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n33
  cau: 'Khung sắt đúc: Alpheus Babcock (Mỹ) năm 1825 cho đàn vuông; tác dụng: chịu lực căng dây lớn nên dùng dây dày hơn, tiếng to hơn, giữ cao độ lâu hơn.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n34
  cau: 'Búa bọc nỉ: Pape lấy bằng sáng chế năm 1826; thay dần búa bọc da, chỉ phổ biến hẳn sau năm 1855.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n35
  cau: 'Dây bắt chéo (overstringing): Steinway, bằng sáng chế cho đàn cánh năm 1859; dây trầm dài chạy chéo phía trên dây cao, gần giữa bảng cộng hưởng, cho tiếng trầm đầy hơn.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n36
  cau: 'Bàn đạp giữ âm (sostenuto): Claude Montal làm cơ cấu giữ âm năm 1862; Albert Steinway được cấp bằng sáng chế năm 1874; chỉ giữ ngân những nốt đang được giữ phím lúc nhấn bàn đạp.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n37
  cau: 88 phím, từ La0 đến Đô8, là âm vực chuẩn của đàn piano hiện đại.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n38
  cau: Chopin gắn bó với đàn Pleyel ở Paris (tiếng mềm, nhạy với sắc thái nhỏ); Liszt thường chơi đàn Érard (mạnh mẽ, lặp nốt nhanh).
  loai: lich-su
- trang: piano/lich-su-dan
  id: n39
  cau: Bösendorfer (Vienna, 1828).
  loai: nam
- trang: piano/lich-su-dan
  id: n40
  cau: Steinway & Sons (New York, 1853, do Henry Engelhard Steinway lập).
  loai: nam
- trang: piano/lich-su-dan
  id: n41
  cau: Xưởng Steinway ở Hamburg mở năm 1880.
  loai: nam
- trang: piano/lich-su-dan
  id: n42
  cau: C. Bechstein (Berlin, 1853).
  loai: nam
- trang: piano/lich-su-dan
  id: n43
  cau: Blüthner (Leipzig, 1853).
  loai: nam
- trang: piano/lich-su-dan
  id: n44
  cau: Đến giữa thế kỷ 19, đàn đứng nhỏ gọn thành món quen thuộc trong gia đình; khoảng năm 1800 nhiều thợ thử dựng dây theo chiều đứng, như đàn "hươu cao cổ" (giraffe) ở Vienna; vì thế thế kỷ 19 có nhiều nhạc dễ chơi, chuyển soạn và nhạc bốn tay.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n46
  cau: Yamaha làm cây piano đứng đầu tiên năm 1900.
  loai: nam
- trang: piano/lich-su-dan
  id: n47
  cau: Kawai thành lập năm 1927.
  loai: nam
- trang: piano/lich-su-dan
  id: n48
  cau: Fazioli (Sacile, Ý) thành lập năm 1981.
  loai: nam
- trang: piano/lich-su-dan
  id: n49
  cau: Fazioli là một trong những hãng đàn concert mới hiếm hoi của thế kỷ 20.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n50
  cau: Một số đàn concert của Bösendorfer có 97 phím, xuống tới Đô0.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n51
  cau: Chín phím thêm vào của Bösendorfer được sơn đen để người chơi không nhầm vị trí.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n52
  cau: Nhật Bản thành trung tâm sản xuất lớn; đàn Yamaha và Kawai rất phổ biến ở châu Á, kể cả Việt Nam.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n53
  cau: Piano điện phát những mẫu âm thu từ đàn thật, bộ phím có búa mô phỏng cảm giác đàn cơ, không cần lên dây, cắm tai nghe, nối máy tính qua MIDI.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n55
  cau: Các nghệ sĩ Malcolm Bilson, Andreas Staier, Kristian Bezuidenhout chơi Mozart, Beethoven, Schubert trên fortepiano thời đó hoặc bản sao.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n56
  cau: 'Phím là một đòn bẩy: bấm phím xuống thì đầu kia nâng bộ máy lên.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n57
  cau: Con đẩy hất búa lên rồi thoát ra; ngay trước khi chạm dây búa bay tự do, gõ dây rồi rơi xuống; bạn không thể giữ búa trên dây hay nắn nốt sau khi đã gõ.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n58
  cau: Cần lặp (repetition lever) đỡ búa ở lưng chừng nên đánh lại được nốt khi phím mới nhả lên một phần; đó là cơ cấu thoát kép của Érard.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n59
  cau: Bộ giảm âm của mỗi nốt nhấc khỏi dây khi bấm phím và rơi xuống khi nhả phím; bàn đạp vang nhấc tất cả bộ giảm âm cùng lúc.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n60
  cau: Ở vùng trầm nhất, mỗi nốt có một dây quấn đồng; lên cao một chút hai dây; phần lớn bàn phím mỗi nốt có ba dây.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n61
  cau: Một cây piano có thể có tới 230 dây; tổng lực căng 16 tấn năm 1862 và có thể lên tới 30 tấn ở đàn hiện đại, do khung gang gánh chịu.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n62
  cau: Bảng cộng hưởng (soundboard) bằng gỗ vân sam nhận rung động từ dây qua cầu ngựa; bảng gỗ lớn này đẩy không khí và tạo âm lượng.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n64
  cau: Một khi búa đã rời dây, bạn chỉ còn điều khiển được lúc nào tiếng tắt; mọi màu tiếng đến từ tốc độ búa, cân bằng giữa các nốt vang cùng lúc, thời điểm và bàn đạp.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n65
  cau: 'Bảng "Đàn xưa dạy gì": đàn thời Mozart, Beethoven có phím nhẹ và nông, tiếng tắt nhanh mỗi âm vực một màu, bè trầm trong và mỏng, bộ giảm âm yếu hơn; đàn hiện đại ngược lại.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n67
  cau: 'Quiz: Maffei năm 1711 gọi nó là gravicembalo col piano, e forte; người chơi harpsichord tạo tương phản bằng register và hai tầng phím; cần lặp đỡ búa ở lưng chừng, nền tảng bộ máy đàn cánh hiện đại; đàn Mozart tắt tiếng nhanh, bè trầm mỏng.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n68
  cau: 'Nguồn: Metropolitan Museum of Art, hai bài Heilbrunn (The Pianofortes of Bartolomeo Cristofori (1655–1731); Viennese Instruments).'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n69
  cau: 'Nguồn: Edwin M. Good, Giraffes, Black Dragons, and Other Pianos, Stanford University Press, tái bản lần 2, 2001; Cyril Ehrlich, The Piano: A History, Oxford University Press, 1976 (bản sửa 1990); David Rowland (chủ biên), The Cambridge Companion to the Piano, Cambridge University Press, 1998; Stuart Isacoff, A Natural History of the Piano, Knopf, 2011.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n70
  cau: 'Nguồn: Thư của Mozart gửi cha từ Augsburg, tháng 10/1777, trong The Letters of Mozart and His Family (Emily Anderson dịch).'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n71
  cau: 'Nguồn: Bằng sáng chế Hoa Kỳ số 3.238 (J. Chickering, 1843), số 26.532 (Steinway, 1859) và số 156.388 (Steinway, 1874).'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n66
  cau: Đừng "đè" Mozart; ít bàn đạp, tách rõ staccato và luyến hai nốt; chơi hợp âm thấp và bè Alberti nhẹ; chỉ dẫn bàn đạp dài của Beethoven thường cần thay một phần hay nửa bàn đạp; hộp "Bài nghe so sánh".
  loai: khuyen-tap
- trang: piano/the-loai
  id: n1
  cau: 'Mô tả định nghĩa: nocturne trữ tình và chậm rãi; étude đặt một bài toán kỹ thuật; mazurka nhịp ba, phách nhấn lệch.'
  loai: dinh-nghia
- trang: piano/the-loai
  id: n2
  cau: Mức độ ở cột "Chơi thử" theo thang bảy chặng, chặng 1 là khởi đầu, chặng 7 là sau Grade 8.
  loai: cap-do
- trang: piano/the-loai
  id: n3
  cau: 'Bảng tóm tắt: các bản "Chơi thử" có trang bài học đều có thật, và chặng ghi trong bảng khớp tac-pham.yml: Minuet Sol trưởng chặng 2, Prelude Đô trưởng chặng 4, Clementi Op. 36 số 1 chặng 3, Für Elise chặng 4, Burgmüller Arabesque chặng 3, Prélude Mi thứ chặng 4, Ballade số 1 chặng 7, Mendelssohn Op. 19 số 6 chặng 5, Schumann Album chặng 2, Grieg Arietta chặng 4.'
  loai: cap-do
- trang: piano/the-loai
  id: n4
  cau: 'Bảng: Invention số 1 ở chặng 5.'
  loai: cap-do
- trang: piano/the-loai
  id: n5
  cau: 'Bảng: Valse La thứ ở chặng 3.'
  loai: cap-do
- trang: piano/the-loai
  id: n6
  cau: 'Bảng: Debussy, The Little Shepherd ở chặng 5.'
  loai: cap-do
- trang: piano/the-loai
  id: n7
  cau: 'Bảng: Schubert, Moment musical số 3 ở chặng 4.'
  loai: cap-do
- trang: piano/the-loai
  id: n8
  cau: 'Bảng: Diabelli Op. 149 ở chặng 1.'
  loai: cap-do
- trang: piano/the-loai
  id: n9
  cau: 'Bảng: Beethoven, 6 biến tấu trên bài ca Thụy Sĩ WoO 64 ở chặng 2–3.'
  loai: cap-do
- trang: piano/the-loai
  id: n10
  cau: 'Bảng: Scarlatti, K. 32 ở chặng 4.'
  loai: cap-do
- trang: piano/the-loai
  id: n11
  cau: 'Bảng: Mozart, Fantasia K. 397 ở chặng 6; Chopin, Nocturne Đô♯ thứ (di cảo) ở chặng 5; Brahms, Valse Op. 39 số 15 rút gọn ở chặng 5; Kabalevsky, Toccatina Op. 27 số 12 ở chặng 3.'
  loai: cap-do
- trang: piano/the-loai
  id: n12
  cau: 'Bảng: cột Thời kỳ của từng thể loại (Baroque, Cổ điển, Lãng mạn, thế kỷ 20) và cột Nghe thử nêu các bản có thật: French Suite số 5 BWV 816, Bình quân luật, Goldberg, Diabelli, Scarlatti K. 141 và K. 380, Mozart K. 331, Pathétique, Rondo K. 511, Fantasia K. 397, Fantaisie Op. 49, Op. 126, D. 899, Op. 9 số 2, Op. 10 và Op. 25, Op. 28, Estampes, Gaspard de la nuit, Lieder ohne Worte, Kinderszenen, Carnaval, Op. 117 và 118, Lyric Pieces, BWV 911, Prokofiev Op. 11, Fantasia D. 940.'
  loai: danh-muc
- trang: piano/the-loai
  id: n14
  cau: Tổ khúc là chuỗi điệu nhảy cùng giọng; lõi chuẩn là allemande, courante, sarabande, gigue; giữa sarabande và gigue thường chèn minuet, gavotte, bourrée.
  loai: cau-truc
- trang: piano/the-loai
  id: n15
  cau: Allemande nhịp chẵn, vừa phải, dòng móc kép; courante nhịp ba, nhanh hơn; sarabande nhịp ba chậm, thường nhấn phách 2; gigue nhanh, thường 6/8 hoặc 12/8.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n16
  cau: 'Bach: French Suites BWV 812–817, English Suites BWV 806–811, Partita BWV 825–830, Partita số 2 Đô thứ BWV 826; Handel, tổ khúc Mi trưởng HWV 430 có "The Harmonious Blacksmith".'
  loai: danh-muc
- trang: piano/the-loai
  id: n18
  cau: Prelude là phần mở đầu tự do, thường dựa trên một hình nốt lặp; fugue là bản phức điệu mà chủ đề được các bè lần lượt bắt chước.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n19
  cau: 'Bình quân luật của Bach: quyển 1 năm 1722, quyển 2 khoảng 1742; 48 cặp prelude và fugue qua đủ 24 giọng.'
  loai: lich-su
- trang: piano/the-loai
  id: n20
  cau: Bach viết 15 invention hai bè và 15 sinfonia ba bè, bản chép sạch năm 1723.
  loai: so-lieu
- trang: piano/the-loai
  id: n21
  cau: Toccata từ chữ Ý "chạm", là bản phô diễn ngón tay xen đoạn tự do và đoạn fugue.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n22
  cau: 'Goldberg Variations BWV 988 (1741): một aria và 30 biến tấu dựng trên cùng một bè trầm.'
  loai: so-lieu
- trang: piano/the-loai
  id: n23
  cau: Domenico Scarlatti để lại 555 sonata cho harpsichord, phần lớn một chương hai phần, mỗi phần nhắc lại; có vắt tay, nốt lặp, quãng nhảy rộng, âm hưởng guitar Tây Ban Nha.
  loai: so-lieu
- trang: piano/the-loai
  id: n24
  cau: Scarlatti K. 32 Rê thứ có tên Aria.
  loai: ten
- trang: piano/the-loai
  id: n25
  cau: Sonata Cổ điển thường có ba chương nhanh – chậm – nhanh; chương đầu ở hình thức sonata, chương cuối thường là rondo hoặc chương nhanh vui tươi.
  loai: cau-truc
- trang: piano/the-loai
  id: n26
  cau: Haydn để lại khoảng 60 sonata đàn phím, Mozart 18, Beethoven 32.
  loai: so-lieu
- trang: piano/the-loai
  id: n27
  cau: Sonatina là sonata nhỏ, ngắn hơn, đoạn phát triển rất ngắn hoặc không có, viết cho người học; ví dụ Clementi Op. 36, Kuhlau Op. 20 và Op. 55, Diabelli Op. 151 và Op. 168.
  loai: danh-muc
- trang: piano/the-loai
  id: n28
  cau: Mozart viết 12 biến tấu trên Ah! vous dirai-je, maman, K. 265; Beethoven có 32 biến tấu Đô thứ WoO 80 và Diabelli Variations Op. 120.
  loai: danh-muc
- trang: piano/the-loai
  id: n29
  cau: Rondo Mozart La thứ K. 511; Beethoven Rondo a capriccio Op. 129; biệt danh "Giận dữ vì đồng xu bị mất" không do Beethoven đặt; Für Elise là rondo A–B–A–C–A.
  loai: danh-muc
- trang: piano/the-loai
  id: n30
  cau: Mozart có Fantasia Rê thứ K. 397 và Đô thứ K. 475; Beethoven gọi hai sonata Op. 27 là quasi una fantasia, trong đó có Ánh trăng.
  loai: danh-muc
- trang: piano/the-loai
  id: n31
  cau: 'Concerto: piano đối thoại với cả dàn nhạc, thường ba chương, có cadenza cho nghệ sĩ độc tấu phô diễn.'
  loai: dinh-nghia
- trang: piano/the-loai
  id: n32
  cau: Thế kỷ 19 yêu tiểu phẩm tính cách, hợp với cây đàn đứng trong phòng khách gia đình.
  loai: lich-su
- trang: piano/the-loai
  id: n33
  cau: 'Bagatelle: Beethoven có ba tập Op. 33, Op. 119, Op. 126 và Für Elise WoO 59.'
  loai: danh-muc
- trang: piano/the-loai
  id: n34
  cau: Impromptu D. 899 và D. 935 (1827), sáu Moment musical D. 780 của Schubert.
  loai: danh-muc
- trang: piano/the-loai
  id: n35
  cau: Chopin viết ba Impromptu và Fantaisie-Impromptu Op. 66, in sau khi ông mất.
  loai: danh-muc
- trang: piano/the-loai
  id: n36
  cau: John Field, người Ireland, viết những nocturne đầu tiên năm 1812 và thường được coi là người khai sinh thể loại; Chopin đưa nó lên đỉnh cao.
  loai: lich-su
- trang: piano/the-loai
  id: n37
  cau: 'Công thức nocturne: tay trái rải hợp âm rộng, tay phải hát giai điệu kiểu opera Ý với nốt hoa mỹ uốn lượn.'
  loai: dinh-nghia
- trang: piano/the-loai
  id: n38
  cau: Étude nghĩa là bài học; Czerny, Cramer, Clementi viết hàng trăm bài luyện ngón.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n39
  cau: 'Chopin: 24 étude Op. 10 (1833) và Op. 25 (1837); sau ông có Liszt (Études d''exécution transcendante), Debussy (12 étude, 1915), Rachmaninoff (Études-tableaux), Ligeti.'
  loai: danh-muc
- trang: piano/the-loai
  id: n40
  cau: 24 prélude Op. 28 của Chopin đi qua 24 giọng theo vòng quãng năm (Đô trưởng, La thứ, Sol trưởng, Mi thứ…); có bản chỉ dài vài chục giây; Scriabin (Op. 11), Rachmaninoff, Debussy viết prelude sau ông.
  loai: cau-truc
- trang: piano/the-loai
  id: n42
  cau: Mazurka là điệu nhảy dân gian Ba Lan, phách nhấn thường ở phách 2 hoặc 3; Chopin viết gần 60 bản.
  loai: so-lieu
- trang: piano/the-loai
  id: n43
  cau: 'Chopin: Polonaise trang trọng; Valse dành cho phòng khách và phòng hòa nhạc chứ không để nhảy.'
  loai: dinh-nghia
- trang: piano/the-loai
  id: n44
  cau: Chopin là người đầu tiên đặt tên ballade cho một bản nhạc không lời, bốn ballade lớn; scherzo nghĩa đen là "đùa", bốn scherzo độc lập.
  loai: lich-su
- trang: piano/the-loai
  id: n45
  cau: Mendelssohn viết tám tập Lieder ohne Worte, mỗi tập sáu bản; sáu tập đầu in khi ông còn sống, Op. 85 và Op. 102 in sau khi ông mất.
  loai: so-lieu
- trang: piano/the-loai
  id: n46
  cau: Ba bản có tên Venetianisches Gondellied; bản đầu tiên là Op. 19 số 6 Sol thứ.
  loai: ten
- trang: piano/the-loai
  id: n47
  cau: 'Schumann: Kinderszenen (1838), Album für die Jugend (1848) viết cho con mình; Papillons, Carnaval, Kreisleriana.'
  loai: danh-muc
- trang: piano/the-loai
  id: n48
  cau: 'Tchaikovsky: Các mùa (12 bản cho 12 tháng) và Album cho tuổi trẻ Op. 39; Mussorgsky: Những bức tranh ở phòng triển lãm.'
  loai: danh-muc
- trang: piano/the-loai
  id: n49
  cau: 'Rhapsody: 19 Hungarian Rhapsodies của Liszt; hai Rhapsody Op. 79 của Brahms.'
  loai: danh-muc
- trang: piano/the-loai
  id: n50
  cau: 'Brahms cuối đời: intermezzo Op. 116–119, 1892–1893.'
  loai: lich-su
- trang: piano/the-loai
  id: n51
  cau: 'Barcarolle: Chopin Op. 60, Fauré 13 bản, Tchaikovsky Tháng Sáu; Berceuse Op. 57 của Chopin dựng trên hình đệm tay trái gần như không đổi.'
  loai: danh-muc
- trang: piano/the-loai
  id: n52
  cau: 'Fantaisie: Schubert Wanderer-Fantasie, Schumann Fantasie Op. 17, Chopin Fantaisie Op. 49.'
  loai: danh-muc
- trang: piano/the-loai
  id: n53
  cau: Grieg viết 66 Lyric Pieces trong mười tập, từ 1867 đến 1901; bản đầu là Arietta; bản cuối của tập cuối gợi lại giai điệu Arietta dưới dạng valse.
  loai: so-lieu
- trang: piano/the-loai
  id: n54
  cau: 'Debussy (Estampes, Images, hai tập Préludes, Clair de lune) và Ravel (Jeux d''eau, Gaspard de la nuit, Le tombeau de Couperin: tổ khúc kiểu Baroque, mỗi chương tưởng nhớ một người bạn tử trận trong Thế chiến thứ nhất).'
  loai: danh-muc
- trang: piano/the-loai
  id: n55
  cau: 'Bartók: Allegro barbaro, 153 bản Mikrokosmos xếp từ dễ đến khó; Prokofiev: Toccata Op. 11, ba sonata chiến tranh số 6–8.'
  loai: danh-muc
- trang: piano/the-loai
  id: n56
  cau: Shostakovich viết 24 Prelude và Fugue Op. 87, nối tiếp Bình quân luật.
  loai: danh-muc
- trang: piano/the-loai
  id: n57
  cau: 'Gershwin: ba Preludes, Rhapsody in Blue; Kapustin viết étude bằng ngôn ngữ jazz nhưng ghi đầy đủ từng nốt.'
  loai: danh-muc
- trang: piano/the-loai
  id: n58
  cau: 'Satie: Gymnopédies (1888); Pärt: Für Alina (1976); Glass: piano lặp lại từng mẫu nhỏ.'
  loai: danh-muc
- trang: piano/the-loai
  id: n59
  cau: Ligeti viết ba tập étude (1985–2001) chồng các lớp nhịp lên nhau.
  loai: so-lieu
- trang: piano/the-loai
  id: n60
  cau: 'Nhạc thính phòng: Archduke Op. 97 của Beethoven; tứ tấu có piano Op. 25 của Brahms; ngũ tấu có piano: Schubert Con cá hồi, Schumann Op. 44, Brahms Op. 34, Dvořák Op. 81.'
  loai: danh-muc
- trang: piano/the-loai
  id: n61
  cau: 'Sonata violin hoặc cello và piano: Beethoven Mùa xuân Op. 24 và Kreutzer Op. 47; Franck Sonata violin; sonata cello của Beethoven, Brahms, Chopin (Op. 65), Rachmaninoff (Op. 19).'
  loai: danh-muc
- trang: piano/the-loai
  id: n62
  cau: 'Lied: Erlkönig của Schubert, Dichterliebe của Schumann.'
  loai: danh-muc
- trang: piano/the-loai
  id: n63
  cau: 'Bốn tay và hai đàn: Mozart Sonata Đô trưởng K. 521 (bốn tay) và Rê trưởng K. 448 (hai đàn); Schubert Fantasia Fa thứ D. 940; Hungarian Dances của Brahms và Slavonic Dances của Dvořák viết cho bốn tay trước khi thành bản dàn nhạc.'
  loai: danh-muc
- trang: piano/the-loai
  id: n64
  cau: Diabelli Op. 149 ngay từ chặng 1.
  loai: cap-do
- trang: piano/the-loai
  id: n65
  cau: BWV, K., Hob., D., S., Sz. là số hiệu trong danh mục do người đời sau lập cho tác phẩm của từng nhà soạn nhạc.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n66
  cau: 'Quiz: Nocturne do Field khai sinh và Chopin đưa lên đỉnh cao; Field viết nocturne đầu tiên năm 1812.'
  loai: lich-su
- trang: piano/the-loai
  id: n67
  cau: 'Quiz: étude của Chopin là tác phẩm trọn vẹn xoay quanh một bài toán kỹ thuật.'
  loai: dinh-nghia
- trang: piano/the-loai
  id: n68
  cau: 'Quiz: sonata Scarlatti một chương, hai phần, mỗi phần nhắc lại; phần đầu sang giọng khác, phần sau về giọng chính.'
  loai: cau-truc
- trang: piano/the-loai
  id: n69
  cau: 'Quiz: chữ D. là số hiệu trong danh mục Schubert do Otto Erich Deutsch lập.'
  loai: ten
- trang: piano/the-loai
  id: n71
  cau: 'Mục Nguồn: Hinson & Roberts, Guide to the Pianist''s Repertoire (tái bản lần 4, Indiana University Press, 2014); Rosen, The Classical Style (1971) và The Romantic Generation (Harvard University Press, 1995); Rowland (chủ biên), The Cambridge Companion to the Piano (Cambridge University Press, 1998); Grove Music Online.'
  loai: danh-muc
- trang: piano/the-loai
  id: n13
  cau: Phần lớn nhạc phím Baroque viết cho harpsichord, clavichord hoặc organ; kho bài này dạy hai tay độc lập, phức điệu, nhịp vững.
  loai: khuyen-tap
- trang: piano/the-loai
  id: n41
  cau: Debussy đặt tên gợi hình ở cuối mỗi prelude.
  loai: khuyen-tap
- trang: piano/the-loai
  id: n17
  cau: 'Chơi thử: các minuet trong Notebook for Anna Magdalena Bach.'
  loai: khuyen-tap
