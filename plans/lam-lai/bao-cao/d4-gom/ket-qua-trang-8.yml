  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/"]
  ghi_chu: "Mô hình T–PD–D–T; OMT: câu 'hầu như luôn đi từ trái sang phải', V về IV (lùi chức năng) vì thế bị tránh."
- trang: piano/hoa-am/dem-giai-dieu
  id: d7
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/"]
  ghi_chu: "Phân tích hòa âm đúng với giai điệu quen thuộc Đô–Đô–Đô–Rê | Mi–Rê | Đô–Mi–Rê–Rê | Đô; Rê giữa Đô và Mi là nốt lướt (OMT). Không mở được bản nhạc mẫu của bài này; dựa vào giai điệu truyền thống."
- trang: piano/hoa-am/dem-giai-dieu
  id: d9
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/"]
  ghi_chu: "V7 ở C là Sol–Si–Rê–Fa; Si–Fa–Sol cộng Rê của giai điệu đủ bốn nốt. Từ I (Đô–Mi–Sol) sang V7 (Si–Fa–Sol) tay trái đổi Đô sang Si, Mi sang Fa, Sol giữ nguyên: đúng."
- trang: piano/hoa-am/dem-giai-dieu
  id: d11
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/", "https://iastate.pressbooks.pub/comprehensivemusicianship/?p=248"]
  ghi_chu: "OMT glossary: harmonic rhythm là 'tốc độ đổi hợp âm'."
- trang: piano/hoa-am/dem-giai-dieu
  id: d12
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/?p=248", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/chapter/techniques-for-creating-a-melody"]
  ghi_chu: "Iowa State: đổi hợp âm hay rơi vào phách mạnh, nhanh lên khi gần kết; harmonyandmusicianship: nhịp hòa âm 'tăng để đẩy về kết'."
- trang: piano/hoa-am/dem-giai-dieu
  id: d14
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/", "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/"]
  ghi_chu: "Mutopia (ode.ly, Sol trưởng): ô 4 là Mi chấm dôi, Rê móc đơn, Rê trắng; ô 8 là Rê chấm dôi, Đô móc đơn, Đô trắng. Hòa âm I–V ô 4 (kết nửa) và V–I ô 8 (kết trọn) hợp lý, nốt đón trước theo OMT; V7 ở ô 2 và 6 vì Fa chạy qua. Hòa âm là phân tích, không phải nốt nhạc."
- trang: piano/hoa-am/dem-giai-dieu
  id: d15
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/", "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/"]
  ghi_chu: "OMT: anticipation = nốt của hợp âm sau, nghe sớm như nốt ngoài hợp âm."
- trang: piano/hoa-am/dem-giai-dieu
  id: d18
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/"]
  ghi_chu: "Bass gốc nhảy quãng 5 (Đô–Sol–Đô–Sol) kém liền bậc; bass đi liền bậc nhờ hợp âm đảo là nguyên tắc thông dụng (OMT bàn về giữ bè độc lập). Hợp âm thay thế ii6 cho IV: Mount."
- trang: piano/hoa-am/dem-giai-dieu
  id: d19
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/inversion/"]
  ghi_chu: "OMT: thể đảo một có quãng ba ở bè trầm; V ở C là Sol–Si–Rê, nên V6 có Si ở bass."
- trang: piano/hoa-am/dem-giai-dieu
  id: d21
  luot_2: dung
  nguon: ["https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/"]
  ghi_chu: "Mount: vi có thể thay I; La–Đô–Mi chung Đô và Mi với I (Đô–Mi–Sol), có màu thứ."
- trang: piano/hoa-am/dem-giai-dieu
  id: d22
  luot_2: dung
  nguon: ["https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/"]
  ghi_chu: "Mount: ii và IV có thể thay nhau (ii6 Rê–Fa–La, Fa ở bass); IV (Fa–La–Đô) chung Fa và La."
- trang: piano/hoa-am/dem-giai-dieu
  id: d24
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/cadential-64/"]
  ghi_chu: "OMT: cadential 6/4 điểm xuyết V thường ở các điểm kết, cả kết nửa lẫn kết trọn được tăng cường."
- trang: piano/hoa-am/dem-giai-dieu
  id: d25
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/"]
  ghi_chu: "OMT: tránh song song quãng 5 và quãng 8, ưa chuyển động ngược; song song quãng 3, 6 được phép, quãng 10 cho phép có giới hạn."
- trang: piano/hoa-am/dem-giai-dieu
  id: d26
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "Bass Đô–Si–La–Sol nằm trong Sol2–Đô3; ngón 5 Fa2 và ngón 1 Đô3 (Fa–Sol–La–Si–Đô, năm nốt): thế tay đúng. Giai điệu ô 1 và ô 3 đi lên (Mi–Sol, Đô–Mi), bass đi xuống."
- trang: piano/hoa-am/dem-giai-dieu
  id: d32
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/"]
  ghi_chu: "La–Sol ở giai điệu mà tay trái cũng La–Sol thì song song quãng 8 (OMT cấm); Đô–Fa (không có La) tránh được."
- trang: piano/hoa-am/dem-giai-dieu
  id: d35
  luot_2: dung
  nguon: ["https://imslp.org/wiki/12_Variations_on_'Ah,_vous_dirai-je_maman',_K.265/300e_(Mozart,_Wolfgang_Amadeus)"]
  ghi_chu: "Mozart, 12 Variations on 'Ah, vous dirai-je, maman' K. 265; giai điệu này trùng Twinkle, Twinkle, Little Star (cách gọi thông dụng, trang IMSLP không nói rõ)."
- trang: piano/hoa-am/dem-giai-dieu
  id: d36
  luot_2: dung
  nguon: ["https://imslp.org/wiki/12_Variations_on_'Ah,_vous_dirai-je_maman',_K.265/300e_(Mozart,_Wolfgang_Amadeus)"]
  ghi_chu: "Giai điệu Ah! vous dirai-je ở Sol trưởng: G G d d | e e d2 | c c B B | A A G2 | d d c c | B B A2 | d d c c | B B A2 | G G d d | e e d2 | c c B B | A A G2 (ABC, d = Rê5): đúng giai điệu truyền thống. Không mở được bản nhạc từng nốt."
- trang: piano/hoa-am/dem-giai-dieu
  id: d37
  luot_2: dung
  nguon: ["https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/"]
  ghi_chu: "Sol trưởng: I = Sol–Si–Rê, IV = Đô–Mi–Sol, V = Rê–Fa♯–La, V7 thêm Đô; V7 thêm âm bảy (Mount)."
- trang: piano/hoa-am/dem-giai-dieu
  id: d38
  luot_2: dung
  nguon: ["https://imslp.org/wiki/12_Variations_on_'Ah,_vous_dirai-je_maman',_K.265/300e_(Mozart,_Wolfgang_Amadeus)", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/"]
  ghi_chu: "Đáp án hợp lý với giai điệu ở d36 (Mi chỉ ở IV, Đô là nốt 7 của V7, I6–IV ô 7 tránh song song, nhịp hòa âm hai hợp âm mỗi ô). Ô 2–3 IV–I, ô 4 V–I, 5 I–V7, 6 I–V, 7 I6–IV, 8 I–V, 9–12 như 1–4: mọi nốt giai điệu đều thuộc hợp âm đề nghị."
- trang: piano/hoa-am/dem-giai-dieu
  id: d39
  luot_2: dung
  nguon: ["https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/"]
  ghi_chu: "Mi (E) chỉ thuộc IV (Đô–Mi–Sol) trong I (Sol–Si–Rê), IV, V (Rê–Fa♯–La); Đô là nốt bảy của V7 (Rê–Fa♯–La–Đô)."
- trang: piano/hoa-am/dem-giai-dieu
  id: d40
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/"]
  ghi_chu: "Ô 6 kết ở La (V, Rê bass) rồi ô 7 vào Rê giai điệu với bass Sol: La/Rê rồi Rê/Sol là hai quãng 5 đúng song song (OMT cấm); bass Si (I6) rồi Đô tránh được."
- trang: piano/hoa-am/dem-giai-dieu
  id: d43
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly", "https://pressbooks.pub/harmonyandmusicianshipwithsolfege/chapter/techniques-for-creating-a-melody"]
  ghi_chu: "Ode to Joy: 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2 (Mutopia ode.ly: b b c' d' | d' c' b a | g g a b | b. a a, ở Sol trưởng); hòa âm I | V7 | I | I V khớp d14."
