  id: d44
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"]
  ghi_chu: "La thứ: Đô–Đô–Rê–Mi là bậc 3 3 4 5; i = La–Đô–Mi; V trong thứ hòa âm là hợp âm trưởng Mi–Sol♯–Si nhờ bậc 7 nâng (OMT)."
