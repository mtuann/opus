  ghi_chu: "Si là nốt ba của V (Sol–Si–Rê) đặt ở bass thành V6 (OMT: nốt ba ở bass); giai điệu ô 2 Sol–Fa–Mi–Rê khớp V6; bass Đô–Si–La–Sol liền bậc."
