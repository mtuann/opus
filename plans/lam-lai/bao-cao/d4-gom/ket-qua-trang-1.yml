- trang: piano/10-bai-dau-tien
  id: n3
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Für_Elise,_WoO_59_(Beethoven,_Ludwig_van)", "https://www.antonin-dvorak.cz/en/work/symphony-no-9/", "https://imslp.org/wiki/Minuet%20in%20G%20major,%20BWV%20Anh.114%20(Pezold,%20Christian)"]
  ghi_chu: "Beethoven mất 1827, Dvořák 1904, Petzold thế kỷ 18; các dân ca không có tác giả còn bảo hộ. Không kiểm bản quyền từng bản chuyển soạn."
- trang: piano/10-bai-dau-tien
  id: n5
  luot_2: khong-chac
  ghi_chu: "Cần đối chiếu khuông của trang với bản Minuet BWV Anh. 114 và trang Minuet Sol trưởng; không mở được."
- trang: piano/10-bai-dau-tien
  id: n11
  luot_2: khong-chac
  ghi_chu: "Quy ước đánh số ngón (1 = ngón cái) đúng theo thông lệ nhưng chưa mở được nguồn bậc 2 nêu rõ."
- trang: piano/10-bai-dau-tien
  id: n13
  luot_2: khong-chac
  ghi_chu: "Quy ước khóa Sol cho tay phải, khóa Fa cho tay trái đúng theo thông lệ; trang Clefs của OMT chỉ nói vị trí G4/F3, không nói về tay."
- trang: piano/10-bai-dau-tien
  id: n36
  luot_2: khong-chac
  ghi_chu: "Au clair de la lune là bài hát Pháp thế kỷ 18, tác giả vô danh (theo Wikipedia); chưa mở được nguồn bậc 1-2."
- trang: piano/10-bai-dau-tien
  id: n37
  luot_2: khong-chac
  ghi_chu: "Giọng của bài theo khuông của trang (bản chuyển soạn), không kiểm được; giai điệu thường ghi ở Đô trưởng."
- trang: piano/10-bai-dau-tien
  id: n38
  luot_2: khong-chac
  ghi_chu: "Cấu trúc đoạn của bản soạn trên trang, không kiểm được nếu không có khuông."
- trang: piano/10-bai-dau-tien
  id: n39
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  ghi_chu: "Sol2 đến Rê3 là một quãng năm đúng (thế năm ngón 5-1); Đô giữa = C4 theo Dolmetsch. Không đối chiếu khuông của trang."
- trang: piano/10-bai-dau-tien
  id: n40
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  ghi_chu: "Thế Sol tay trái: Sol(5) La(4) Si(3) Đô(2) Rê(1), nên Đô là ngón 2, Sol là ngón 5; đúng. Không đối chiếu khuông."
- trang: piano/10-bai-dau-tien
  id: n43
  luot_2: khong-chac
  ghi_chu: "Giai điệu vô danh Pháp (khoảng 1740, in 1761) và Mozart K. 265/300e, 12 biến tấu (1781-82) đúng theo Wikipedia; chưa mở được IMSLP hay nguồn bậc 1-2 của K. 265."
- trang: piano/10-bai-dau-tien
  id: n44
  luot_2: khong-chac
  ghi_chu: "Mozart K. 265 ở Đô trưởng theo hiểu biết chung; giọng của bản soạn trên trang không kiểm được; chưa mở nguồn."
- trang: piano/10-bai-dau-tien
  id: n45
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/", "https://viva.pressbooks.pub/openmusictheory/chapter/triads/"]
  ghi_chu: "Trong Đô trưởng: Đô = bậc 1 (chủ âm), Fa = bậc 4 (hạ át âm), Sol = bậc 5 (át âm)."
- trang: piano/10-bai-dau-tien
  id: n46
  luot_2: khong-chac
  ghi_chu: "Số ngón và ô nhịp cụ thể theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n47
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  ghi_chu: "Đô3-Fa3-Sol3 nằm trong thế năm ngón Đô (Đô(5) Rê(4) Mi(3) Fa(2) Sol(1)); ngón 5-2-1 đúng. Không đối chiếu khuông."
- trang: piano/10-bai-dau-tien
  id: n48
  luot_2: khong-chac
  ghi_chu: "Tên chức năng (Fa-Đô hạ át→chủ, Sol-Đô át→chủ) đúng, nhưng vị trí ô 2 và ô 4 theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n50
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.9,_Op.125_(Beethoven,_Ludwig_van)"]
  ghi_chu: "IMSLP: Giao hưởng số 9 Op. 125 soạn 1822-1824, chương 4 có 'An die Freude'. Năm 1824 (ra mắt) không đọc được ở trang đã mở."
- trang: piano/10-bai-dau-tien
  id: n51
  luot_2: khong-chac
  ghi_chu: "Chủ đề gốc ở Rê trưởng (theo hiểu biết chung; trang IMSLP có tên tệp lẫn lộn D major/D minor); Rê→Đô là một cung đúng. Chưa mở nguồn xác nhận giọng."
- trang: piano/10-bai-dau-tien
  id: n52
  luot_2: khong-chac
  ghi_chu: "Tiết tấu đen chấm dôi – móc đơn đúng (Mutopia: b4. a8 ở cuối câu); phần 'một nốt giai điệu do tay trái chơi' theo khuông trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n54
  luot_2: khong-chac
  ghi_chu: "Chi tiết ô 12 theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n55
  luot_2: khong-chac
  ghi_chu: "Hänschen klein là bài hát Đức (lời Franz Wiedemann theo Wikipedia), tên Anh Lightly Row; chưa mở nguồn bậc 1-2."
- trang: piano/10-bai-dau-tien
  id: n56
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/triads/", "https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/"]
  ghi_chu: "Đô-Mi-Sol là hợp âm ba chủ; Si-Fa-Sol là át bảy Sol7 rút gọn (thiếu quãng năm Rê): OMT định nghĩa át bảy = ba trưởng + bảy thứ nhưng không bàn hợp âm thiếu quãng năm. Số ngón 5-2-1 hợp lý."
- trang: piano/10-bai-dau-tien
  id: n57
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Chuyển Đô-Mi-Sol (5-3-1) sang Si-Fa-Sol (5-2-1): Sol giữ, ngón 5 từ Đô xuống Si, ngón 2 lên Fa; nhất quán."
- trang: piano/10-bai-dau-tien
  id: n59
  luot_2: khong-chac
  ghi_chu: "Frère Jacques là bài Pháp (bản chép tay khoảng 1780 'Frère Blaise', in 1811 theo Wikipedia); chưa mở nguồn bậc 1-2."
- trang: piano/10-bai-dau-tien
  id: n60
  luot_2: dung
  nguon: ["http://gustavmahler.com/symphonies/mahler-symphony-1.html"]
  ghi_chu: "gustavmahler.com: chương 3 là hành khúc tang dựa trên 'Frère Jacques' (Bruder Martin), giọng Rê thứ."
- trang: piano/10-bai-dau-tien
  id: n61
  luot_2: khong-chac
  ghi_chu: "Canon lệch hai ô nhịp và chỗ đổi thế tay theo bản soạn của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n62
  luot_2: khong-chac
  ghi_chu: "Số ngón và ô nhịp theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n63
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  ghi_chu: "Đô-Sol là quãng năm đúng; ngón 5 và 1 phủ được quãng năm. Không đối chiếu khuông."
- trang: piano/10-bai-dau-tien
  id: n64
  luot_2: khong-chac
  ghi_chu: "Phụ thuộc khuông của trang (tay trái thấp hơn hai quãng tám, vào sau hai ô)."
- trang: piano/10-bai-dau-tien
  id: n68
  luot_2: khong-chac
  nguon: ["https://www.mutopiaproject.org/ftp/Anonymous/new_britain/new_britain.ly"]
  ghi_chu: "Mutopia: 'New Britain', Virginia Harmony, 1831 (xác nhận giai điệu in 1831). Việc ghép lời Amazing Grace năm 1835 (William Walker, Southern Harmony) chỉ thấy ở Wikipedia; chưa mở nguồn bậc 1-2."
- trang: piano/10-bai-dau-tien
  id: n69
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/Anonymous/new_britain/new_britain.ly"]
  ghi_chu: "Mutopia (New Britain): nhịp 3/4, \\partial 4 (một nốt lấy đà ở phách 3), giai điệu bắt đầu ở bậc 5. Đô trưởng là bản chuyển giọng của trang (bản Mutopia ở Sol trưởng); chấp nhận."
- trang: piano/10-bai-dau-tien
  id: n70
  luot_2: khong-chac
  ghi_chu: "Số ngón và ô theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n72
  luot_2: khong-chac
  ghi_chu: "Bass Đô-Fa-Sol mỗi ô theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n73
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/Anonymous/new_britain/new_britain.ly"]
  ghi_chu: "Ô lấy đà dài một phách (\\partial 4 trong 3/4), nên nốt đầu ở phách 3 và ô cuối thiếu một phách để bù; nốt đầu là bậc 5 (Sol trong Đô trưởng)."
- trang: piano/10-bai-dau-tien
  id: n74
  luot_2: khong-chac
  ghi_chu: "Ô 7-8 và dấu nối theo khuông của trang, không kiểm được; nguyên tắc nốt nối không đánh lại đúng (Dolmetsch: nốt nối coi như một nốt liền)."
- trang: piano/10-bai-dau-tien
  id: n75
  luot_2: dung
  nguon: ["https://earlymusicmuse.com/greensleeves2of3history/", "https://www.mutopiaproject.org/ftp/Traditional/greensleeves/greensleeves.ly"]
  ghi_chu: "Early Music Muse: Richard Jones đăng ký 'A New Northern Dittye of ye Lady Greene Sleeves' ngày 3/9/1580; Mutopia ghi 'melody Anh thế kỷ 16'. Nơi đăng ký (Stationers' Company, London) theo Wikipedia."
- trang: piano/10-bai-dau-tien
  id: n76
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/Traditional/greensleeves/greensleeves.ly", "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"]
  ghi_chu: "Mutopia: 6/8. La thứ không có dấu hóa ở hóa biểu nên Fa♯ và Sol♯ (bậc 6, 7 nâng) phải ghi ngay trước nốt. Cảm nhịp 6/8 (hai phách lớn, mỗi phách ba móc đơn) là kiến thức chuẩn nhưng chưa mở chương nhịp của OMT."
- trang: piano/10-bai-dau-tien
  id: n77
  luot_2: khong-chac
  ghi_chu: "Bass La-Sol-Fa-Mi theo khuông của trang, không kiểm được; số ngón 1-2-3-4 khi đi xuống hợp lý."
- trang: piano/10-bai-dau-tien
  id: n79
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"]
  ghi_chu: "OMT: gam thứ giai điệu nâng bậc 6 và 7 khi đi lên; ở La thứ là Fa♯ và Sol♯. Vị trí 'ô 7' theo khuông, không kiểm."
- trang: piano/10-bai-dau-tien
  id: n80
  luot_2: khong-chac
  ghi_chu: "Chỗ đổi thế tay theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n81
  luot_2: dung
  nguon: ["https://www.antonin-dvorak.cz/en/work/symphony-no-9/", "https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)"]
  ghi_chu: "Dvořák Giao hưởng số 9, soạn 10/1-24/5/1893, chương 2 Largo; hợp âm mở đầu hướng về Rê♭ trưởng; Rê♭→Đô là nửa cung. Rê♭ trưởng của chủ đề (cor anglais) đúng theo hiểu biết chung, trang chính thức không nói rõ."
- trang: piano/10-bai-dau-tien
  id: n82
  luot_2: khong-chac
  ghi_chu: "Nội dung bài học và việc đổi bàn đạp mỗi ô theo khuông của trang, không kiểm được."
- trang: piano/10-bai-dau-tien
  id: n83
  luot_2: khong-chac
  ghi_chu: "Kỹ thuật bàn đạp nối (nhả rồi nhấn ngay) là cách dạy phổ biến; chưa mở nguồn bậc 2."
- trang: piano/10-bai-dau-tien
  id: n84
  luot_2: khong-chac
  ghi_chu: "Ký hiệu * nhả bàn đạp là quy ước in ấn phổ biến; chưa mở nguồn bậc 2."
- trang: piano/10-bai-dau-tien
  id: n89
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Minuet%20in%20G%20major,%20BWV%20Anh.114%20(Pezold,%20Christian)"]
  ghi_chu: "IMSLP: Minuet G major BWV Anh. 114 của Christian Pezold (Petzold), 'formerly attributed to J.S. Bach'; Notebook for Anna Magdalena Bach, 1725 (theo ấn bản Bärenreiter)."
- trang: piano/10-bai-dau-tien
  id: n90
  luot_2: khong-chac
  ghi_chu: "Sol trưởng có một dấu thăng (Fa♯) đúng; nhịp 3/4 chưa mở nguồn bậc 1-2 xác nhận; phần còn lại theo khuông của trang."
- trang: piano/10-bai-dau-tien
  id: n91
  luot_2: khong-chac
  ghi_chu: "Nửa đầu 16 ô chỉ thấy ở Wikipedia; chưa mở được bản nhạc (Mutopia không có kết quả cho BWV Anh. 114)."
- trang: piano/10-bai-dau-tien
  id: n92
  luot_2: khong-chac
  ghi_chu: "Giản lược tay trái của trang, không kiểm được."
