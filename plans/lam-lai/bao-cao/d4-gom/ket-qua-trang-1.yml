  id: n33
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "B-A-C-H = Si♭-La-Đô-Si thường theo quy ước B/H của Dolmetsch. Chuyện Bach 'ký tên' bằng mô-típ này không mở nguồn."
- trang: piano/ban-do-ban-phim
  id: n35
  luot_2: khong-chac
  ghi_chu: "Mô tả âm sắc chủ quan, không có nguồn bậc 2."
- trang: piano/ban-do-ban-phim
  id: n37
  luot_2: khong-chac
  ghi_chu: "Cột 'tay nào thường chơi' là khái quát theo thông lệ, không có nguồn bậc 2."
- trang: piano/ban-do-ban-phim
  id: n38
  luot_2: khong-chac
  nguon: ["https://www.britannica.com/art/piano"]
  ghi_chu: "Đúng theo hiểu biết chung (khoảng 18 phím cao nhất không có bộ giảm âm) nhưng không mở được nguồn bậc 1-2; Britannica, Yamaha và Wikipedia (Sustain pedal, Action) đã mở đều không nói."
- trang: piano/ban-do-ban-phim
  id: n39
  luot_2: khong-chac
  ghi_chu: "Lý do 'dây ngắn, tiếng tắt nhanh nên không cần damper' thường được nêu, nhưng không mở được nguồn bậc 1-2."
- trang: piano/ban-do-ban-phim
  id: n40
  luot_2: khong-chac
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: khóa Sol quấn quanh G4, khóa Fa là F3 bằng hai chấm; không nói về tay. Quy ước tay phải khóa Sol, tay trái khóa Fa đúng theo thông lệ nhưng chưa có nguồn mở."
- trang: piano/ban-do-ban-phim
  id: n43
  luot_2: khong-chac
  ghi_chu: "'Nhanh hơn nhiều' là khẳng định sư phạm không có nguồn; nên chuyển thành khuyên tập hoặc bỏ 'nhiều'."
- trang: piano/ban-do-ban-phim
  id: n45
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Khóa Fa: dòng dưới cùng G2; dưới khuông là Fa2 (khe), Mi2 (dòng phụ 1), Rê2 (khe), Đô2 (dòng phụ 2); C2 là Đô thứ hai (C1, C2)."
- trang: piano/ban-do-ban-phim
  id: n46
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Khuông Fa từ dưới: G2 B2 D3 F3 A3; khe thứ hai là C3."
- trang: piano/ban-do-ban-phim
  id: n47
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: dấu hiệu F3 nằm giữa hai chấm của khóa Fa (dòng thứ hai từ trên = thứ tư từ dưới); F3 gần nhất dưới C4."
- trang: piano/ban-do-ban-phim
  id: n48
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Đô giữa C4 nằm trên dòng phụ giữa hai khuông; Dolmetsch: nằm gần giữa bàn phím."
- trang: piano/ban-do-ban-phim
  id: n49
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: khóa Sol quấn quanh dòng thứ hai (từ dưới) là G4; G4 là Sol gần nhất trên C4."
- trang: piano/ban-do-ban-phim
  id: n50
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Khuông Sol: khe là F4 A4 C5 E5; C5 là khe thứ ba; cao hơn Đô giữa một quãng tám."
- trang: piano/ban-do-ban-phim
  id: n51
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Trên khuông Sol: F5 (dòng trên cùng), La5 (dòng phụ 1), Đô6 (dòng phụ 2); C6 là Đô thứ sáu."
- trang: piano/ban-do-ban-phim
  id: n52
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "C2 và C6 đều hai dòng kẻ phụ; khóa Fa đánh dấu F3, khóa Sol G4 (OMT); C4 ở giữa C2 và C6."
- trang: piano/ban-do-ban-phim
  id: n55
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Fa4, La4 kề G4; Si4, Rê5 kề C5; Si5 kề dưới C6: đúng."
- trang: piano/ban-do-ban-phim
  id: n56
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Rê2 kề trên C2; Si2 kề dưới C3; Mi3, Sol3 kề F3; Si3 kề dưới C4: đúng."
- trang: piano/ban-do-ban-phim
  id: n57
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/"]
  ghi_chu: "OMT liệt kê cặp trùng âm: Đô♯/Rê♭, Rê♯/Mi♭, Fa♯/Sol♭, Sol♯/La♭, La♯/Si♭."
- trang: piano/ban-do-ban-phim
  id: n58
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Mi-Fa và Si-Đô là nửa cung (OMT), nên Mi♯=Fa, Si♯=Đô; Dolmetsch: Cb4 là một nửa cung dưới C4, trùng B3, nên Đô♭ = Si; Fa♭ = Mi tương tự."
- trang: piano/ban-do-ban-phim
  id: n59
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/", "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"]
  ghi_chu: "OMT: Fa♯ trưởng có Mi♯. Sol♭ trưởng có Đô♭ (Si♭ Mi♭ La♭ Rê♭ Sol♭ Đô♭ Fa♭); Đô♯ thứ hòa âm nâng bậc 7 là Si♯ (=Đô)."
- trang: piano/ban-do-ban-phim
  id: n60
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/", "http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Sol♯ thứ hòa âm nâng bậc 7 thành Fa× (=Sol); Si♭♭ = La; Dolmetsch cho cùng cơ chế trùng âm."
- trang: piano/ban-do-ban-phim
  id: n61
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/"]
  ghi_chu: "OMT: trong nhạc điệu tính, cách ghi tên trùng âm khác nhau theo chức năng điệu tính."
- trang: piano/ban-do-ban-phim
  id: n75
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://www.britannica.com/art/keyboard-instrument"]
  ghi_chu: "Đô ngay trái nhóm hai phím đen; Rê giữa nhóm hai; Fa ngay trái nhóm ba: đúng."
- trang: piano/ban-do-ban-phim
  id: n76
  luot_2: dung
  nguon: ["https://www.britannica.com/art/piano", "https://www.britannica.com/art/keyboard-instrument"]
