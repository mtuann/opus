  nguon: ["http://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Dolmetsch có mục ký hiệu Helmholtz (chữ hoa, chữ thường, dấu phẩy trên); mức 'nhiều bản nhạc châu Âu' chưa kiểm."
