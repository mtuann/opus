  id: n10
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  ghi_chu: "Đô giữa C4 gần giữa bàn phím (Dolmetsch); là phím trắng trái nhóm hai phím đen."
- trang: piano/hai-tuan-dau
  id: n11
  luot_2: khong-chac
  ghi_chu: "Quy ước đánh số ngón (1 = cái ... 5 = út, hai tay giống nhau) đúng theo thông lệ; chưa mở nguồn bậc 2."
- trang: piano/hai-tuan-dau
  id: n12
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  ghi_chu: "Đô4-Sol4 (tay phải), Đô3-Sol3 (tay trái), Sol2-Rê3 (thế Sol tay trái) đều là quãng năm đúng, phủ bằng ngón 1-5."
- trang: piano/hai-tuan-dau
  id: n15
  luot_2: khong-chac
  ghi_chu: "'Phân biệt người giữ được nhịp với người không' là khẳng định quá mức, không có nguồn; nên viết lại thành khuyên tập."
- trang: piano/hai-tuan-dau
  id: n16
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory2.htm"]
  ghi_chu: "Dolmetsch: nốt tròn = hai nốt trắng = bốn nốt đen; trong 4/4 nốt đen một phách."
- trang: piano/hai-tuan-dau
  id: n17
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory2.htm"]
  ghi_chu: "Dolmetsch: chấm dôi tăng một nửa giá trị; nốt đen chấm dôi = ba móc đơn (một phách rưỡi), móc đơn nửa phách."
- trang: piano/hai-tuan-dau
  id: n18
  luot_2: khong-chac
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Khuông kép khóa Sol trên, Fa dưới đúng theo thông lệ; OMT không nêu về tay."
- trang: piano/hai-tuan-dau
  id: n19
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: khóa Sol quanh G4 (dòng 2), khóa Fa hai chấm quanh F3 (dòng 4); C4 ở dòng phụ giữa hai khuông."
- trang: piano/hai-tuan-dau
  id: n24
  luot_2: khong-chac
  ghi_chu: "Giai điệu Twinkle Twinkle trùng 'Ah! vous dirai-je, maman' đúng theo Wikipedia; chưa mở nguồn bậc 1-2."
- trang: piano/hai-tuan-dau
  id: n25
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.9,_Op.125_(Beethoven,_Ludwig_van)"]
  ghi_chu: "IMSLP: chương 4 Giao hưởng số 9 'An die Freude'."
- trang: piano/hai-tuan-dau
  id: n26
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly"]
  ghi_chu: "Mutopia: b b c' d' d' c' b a g g a b b4. a8 a2: gần như toàn bước liền, cuối câu có đen chấm dôi + móc đơn."
- trang: piano/hai-tuan-dau
  id: n27
  luot_2: dung
  nguon: ["http://www.dolmetsch.com/musictheory2.htm"]
  ghi_chu: "Chấm dôi 1,5 phách bắt đầu ở 'một', ngân qua 'hai', móc đơn rơi vào 'và' sau 'hai'; tính đúng."
- trang: piano/hai-tuan-dau
  id: n35
  luot_2: khong-chac
  nguon: ["https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"]
  ghi_chu: "NHS xếp đau và tê/ngứa ran là triệu chứng RSI, nhưng khuyên không nghỉ quá lâu; 'dừng lại nghỉ, chỉnh ghế, thả cánh tay' không có hại nhưng không có nguồn nêu rõ."
- trang: piano/hai-tuan-dau
  id: n39
  luot_2: sai
  nguon: ["http://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"]
  cau_dung: "Đô giữa nằm ngay bên trái nhóm hai phím đen gần giữa đàn và là nốt Đô thứ tư tính từ dưới lên; mọi nốt Đô (trừ C8 ở cuối đàn) đều nằm ngay bên trái một nhóm hai phím đen; ở thế Đô, ngón 5 tay trái trên Đô3."
  ghi_chu: "Đô giữa C4 là Đô thứ tư ngay trái nhóm hai phím đen gần giữa đàn; thế Đô tay trái ngón 5 trên Đô3: đúng. Lỗi: 'mọi nốt Đô' bao gồm cả C8 ở cuối đàn, C8 không có nhóm phím đen bên phải."
- trang: piano/hai-tuan-dau
