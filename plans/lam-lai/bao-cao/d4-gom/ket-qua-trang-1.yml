  id: n1
  luot_2: khong-chac
  ghi_chu: "Nhận định chủ quan ('tốt nhất'), không kiểm được; nên viết lại hay bỏ."
- trang: piano/index
  id: n2
  luot_2: khong-chac
  ghi_chu: "Đúng theo hiểu biết chung (piano chơi được cùng lúc giai điệu, hòa âm, bè trầm); chưa mở nguồn bậc 2 nêu điều này."
- trang: piano/index
  id: n3
  luot_2: khong-chac
  ghi_chu: "Hình ảnh ẩn dụ, không kiểm được."
- trang: piano/index
