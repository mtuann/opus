- trang: piano/choi-cung-nguoi-khac
  id: n11
  cau: Nếu thầy chơi bè kia, bạn có thể bắt đầu rất sớm với những bài mà bè học trò chỉ dùng năm nốt.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n14
  cau: Piano bốn tay là hai người chung một đàn.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n16
  cau: Primo ngồi bên phải, secondo ngồi bên trái.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n19
  cau: 'Bàn đạp: primo thường không đạp, secondo thường đạp.'
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n21
  cau: Nhiều ấn bản in secondo ở trang trái, primo ở trang phải, cùng một đoạn nhạc.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n30
  cau: 'Bài 1 (soạn cho trang này): secondo dạo một ô để đặt tốc độ, primo vào ở ô 2, trong thế tay năm ngón Đô5–Sol5.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n32
  cau: 'Secondo chơi nhẹ hơn primo (p so với mf): nốt trầm rõ, hợp âm nhẹ.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n33
  cau: 'Bài 2 (soạn cho trang này): primo chơi hai tay cách nhau một quãng tám, tay trái quanh Đô giữa, đúng chỗ tay phải secondo chơi hợp âm.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n34
  cau: 'Ở phách 2 và 4 của ô 1 và ô 3, secondo cần đúng phím tay trái primo đang giữ (Mi4, Rê4, Fa4): secondo bỏ nốt đó, vì giai điệu đã có.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n35
  cau: 'Ở phách 2 ô 2, Rê4 của primo nằm giữa Đô4 và Mi4 của secondo: secondo chơi ở mép phím, primo vào sâu.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n36
  cau: Bảng chỉ gồm tác phẩm viết gốc cho bốn tay.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n38
  cau: Diabelli, Melodische Übungsstücke Op. 149.
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n39
  cau: Diabelli Op. 149 có 28 bài ngắn, khó dần.
  loai: so-lieu
- trang: piano/choi-cung-nguoi-khac
  id: n40
  cau: 'Diabelli Op. 149: bè học trò (primo) giữ mỗi tay trong một thế tay năm ngón; secondo dành cho thầy; từ chặng 3 thử chơi secondo.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n41
  cau: Ravel, Ma mère l'Oye (Mẹ Ngỗng, 1910).
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n42
  cau: Ma mère l'Oye là "năm bài cho trẻ em", viết cho Mimie và Jean Godebski, 6 và 7 tuổi.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n44
  cau: 'Bizet, Jeux d''enfants (Trò chơi trẻ em) Op. 22 (1871): 12 bức tranh nhỏ về trò chơi trẻ con.'
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n45
  cau: 'Fauré, Dolly Op. 56: sáu bài cho cô bé Hélène Bardac, biệt danh Dolly.'
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n46
  cau: Schubert, Trois marches militaires D. 733, in năm 1826 thành Op. 51; số 1 Rê trưởng nổi tiếng nhất.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n47
  cau: Mozart, Sonata Rê trưởng K. 381 (123a) và Sonata Đô trưởng K. 521 (1787), bốn tay.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n49
  cau: 'Brahms, Ungarische Tänze (Vũ khúc Hungary) WoO 1: 21 bài, bốn tập (1869 và 1880); viết cho bốn tay trước khi thành bản dàn nhạc.'
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n50
  cau: Dvořák, Slavonic Dances (Vũ khúc Slav) Op. 46 (1878), Op. 72 (1886); cũng viết cho bốn tay trước.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n52
  cau: 'Schubert, Fantasia Fa thứ D. 940 (1828): bốn phần chơi liền, phần cuối có một fugue.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n54
  cau: Sonata Rê trưởng K. 448 (1781) của Mozart viết để ông chơi cùng học trò Josepha Auernhammer.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n56
  cau: 'Ca khúc nghệ thuật (Lied tiếng Đức, mélodie tiếng Pháp): piano cùng kể chuyện với giọng hát.'
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n57
  cau: Trong Erlkönig của Schubert, piano là tiếng vó ngựa phi suốt bài, rồi im bặt trước câu cuối.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n60
  cau: Colla voce (theo giọng hát) là piano đi theo; a tempo là trở lại tốc độ cũ.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n62
  cau: Ca khúc nghệ thuật thường in nhiều bản cho giọng cao, trung, trầm (hohe, mittlere, tiefe Stimme); hỏi trước ca sĩ dùng bản nào.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n65
  cau: 'Giữ giọng cho ca sĩ: buổi tập ngắn, có nghỉ; ca sĩ được hát nhẹ, chỉ hát hết sức khi chạy bài.'
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n66
  cau: 'Bài 3 (soạn cho trang này): giai điệu trên hình đệm valse; piano dạo đầu hai ô; ô 6 là chỗ thở; ô 9 piano đi theo giai điệu; dấu ngân cuối hai bên nhả cùng lúc.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n67
  cau: 'Tập với một người hát: lượt một đúng nhịp; lượt hai họ nán ở nốt Si ô 9 và bạn chờ; lượt ba họ vội ở ô 7–8, còn bạn giữ nhịp vững.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n68
  cau: 'Trong sonata cho violin, cello hay sáo, piano là bạn diễn ngang hàng: tên nhiều sonata ấy ghi piano trước, như Op. 24 của Beethoven và Op. 38 của Brahms: Sonate für Pianoforte und Violine (hay Violoncello), tức sonata cho piano và violin (hay cello).'
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n75
  cau: Schubert viết ba Sonatina cho violin D. 384, 385, 408.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n77
  cau: Fauré, Sicilienne Op. 78 cho cello và piano.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n78
  cau: Handel viết sonata cho sáo; phần piano viết ra từ bè trầm số.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n79
  cau: 'Khi vững hơn: Mozart, Sonata Mi thứ K. 304; Beethoven, Sonata Fa trưởng Op. 24 cho violin.'
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n80
  cau: Brahms, Sonata Mi thứ Op. 38 cho cello; Fauré, Fantaisie Op. 79 cho sáo.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n81
  cau: Tam tấu piano gồm piano, violin, cello; tứ tấu piano thêm viola; ngũ tấu piano thường là piano với bốn đàn dây.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n82
  cau: Con cá hồi của Schubert là ngoại lệ, có contrabass thay violin thứ hai.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n83
  cau: Nghe chương 4 của Con cá hồi, để ý khi nào piano dẫn, khi nào nó im hẳn.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n85
  cau: Bắt đầu với tam tấu của Haydn, nơi piano nổi bật và cello phần lớn đi cùng bè trầm của piano.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n94
  cau: 'Độ trễ thường làm việc chơi cùng lúc qua mạng rất khó, nhưng có thể song tấu từ xa: một người thu bè mình theo máy đếm nhịp, người kia đeo tai nghe chơi theo, rồi ghép hai bản thu.'
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n95
  cau: Ngày nay người ta hay nói nghệ sĩ piano hợp tác (collaborative pianist) thay cho "người đệm đàn" (accompanist), để nhấn mạnh vai bạn diễn ngang hàng.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n96
  cau: Nghề này gồm đệm cho ca sĩ và nhạc công, làm répétiteur ở nhà hát opera (người tập vở cùng ca sĩ) và chơi nhạc thính phòng.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n97
  cau: Gerald Moore (1899–1987), nghệ sĩ piano người Anh.
  loai: nam
- trang: piano/choi-cung-nguoi-khac
  id: n98
  cau: 'Moore nhắc lại, với ý không đồng tình, lời "khen" của một ca sĩ dành cho người đệm Coenraad V. Bos: "Hôm nay chắc anh chơi hay lắm, vì tôi chẳng để ý thấy anh."'
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n99
  cau: Moore chơi cùng Dietrich Fischer-Dieskau, Elisabeth Schwarzkopf, Victoria de los Ángeles.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n100
  cau: Fischer-Dieskau viết rằng với Moore, bên phím đàn không còn "cái bóng nhợt nhạt" nữa.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n101
  cau: Buổi hòa nhạc chia tay của Moore năm 1967 ở Royal Festival Hall (London) có cả ba ca sĩ ấy.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n102
  cau: Buổi chia tay khép lại khi Moore chơi một mình bản chuyển soạn cho piano của An die Musik của Schubert.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n103
  cau: Tên hồi ký của ông, Am I Too Loud? (Tôi có to quá không?, 1962), cũng là câu người đệm nên tự hỏi.
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n104
  cau: Người góp phần lớn thay đổi cách nhìn về người đệm đàn là Gerald Moore.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n105
  cau: 'Câu hỏi 1: secondo thường giữ bàn đạp vì bè trầm quyết định hòa âm và ngồi bên trái thì chân phải với tới bàn đạp dễ dàng.'
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n109
  cau: 'Câu hỏi 5: khi chơi với violin, người chơi piano đưa nốt La, vì piano không chỉnh được cao độ tại chỗ; người chơi violin chỉnh dây La theo piano, rồi chỉnh các dây khác theo quãng năm.'
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n110
  cau: 'Gerald Moore, The Unashamed Accompanist (London: Ascherberg, Hopwood & Crew, 1943); Singer and Accompanist: The Performance of Fifty Songs (London: Methuen, 1953); Am I Too Loud? Memoirs of an Accompanist (1962); The Schubert Song Cycles: With Thoughts on Performance (London: Hamish Hamilton, 1975).'
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n111
  cau: 'Martin Katz, The Complete Collaborator: The Pianist as Partner (Oxford University Press, 2009).'
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n112
  cau: 'Cameron McGraw, Piano Duet Repertoire: Music Originally Written for One Piano, Four Hands (Indiana University Press).'
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n113
  cau: 'Diabelli Op. 149 có bản của Edition Peters (EP 2442); ấn bản Urtext: G. Henle Verlag, Bärenreiter, Wiener Urtext.'
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n114
  cau: Tìm trên IMSLP "Diabelli Op.149", "Jeux d'enfants", "Dolly Suite, Op.56", "Ma mère l'Oye (suite)", "Fantasie D.940".
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n115
  cau: 'The Concise Oxford Dictionary of Music (Oxford University Press), qua Encyclopedia.com: các mục piano trio, piano quartet, piano quintet, lied, mélodie, colla voce, répétiteur.'
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n58
  cau: Phần dạo đầu đặt tốc độ và không khí; phần kết thường nói nốt điều lời ca để ngỏ.
  loai: khuyen-tap
- trang: piano/choi-cung-nguoi-khac
  id: n53
  cau: 'Hai đàn: mỗi người có trọn bàn phím và bàn đạp riêng, nên nhạc cho hai đàn thường dày và khó hơn; đổi lại hai người ngồi xa nhau, khó nghe và khó thấy nhau; hai đàn cánh hay được xếp lồng vào nhau, hai bàn phím ở hai đầu, và phải được lên dây cùng cao độ.'
  loai: khuyen-tap
- trang: piano/choi-cung-nguoi-khac
  id: n22
  cau: 'Hãy đọc lướt cả bè người kia để biết khi nào mình phải nhường. Và đừng chỉ giành primo: cả bài đứng trên bè trầm, nên secondo là chỗ rất tốt để học hòa âm và giữ nhịp.'
  loai: khuyen-tap
- trang: piano/thi-tau
  id: n1
  cau: Tin tốt là một phần lớn của đọc nhanh là kỹ năng nhận ra hình mẫu, và nó có thể tiến bộ nếu bạn đọc một chút mỗi ngày.
  loai: quy-tac
- trang: piano/thi-tau
  id: n2
  cau: Thị tấu (sight-reading) là chơi một bản nhạc ngay lần đầu nhìn thấy.
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n4
  cau: Người đọc giỏi nhìn khoảng cách giữa các nốt và hình dạng cả nhóm nốt, giống như ta đọc cả chữ chứ không đọc từng chữ cái; có ba cách nhận ra một nốt (nốt mốc, quãng tính từ nốt trước, hình mẫu), và người đọc giỏi dùng cả ba cùng lúc.
  loai: cau-truc
- trang: piano/thi-tau
  id: n5
  cau: 'Nốt mốc: Đô giữa, Sol trên dòng 2 khóa Sol, Fa trên dòng 4 khóa Fa.'
  loai: quy-tac
- trang: piano/thi-tau
  id: n6
  cau: 'Bảng quãng trên khuông: dòng sang khe sát bên (hoặc khe sang dòng sát bên) là quãng 2, phím ngay cạnh; dòng sang dòng kế tiếp (hoặc khe sang khe kế tiếp) là quãng 3, bỏ qua một phím; dòng sang khe cách một là quãng 4, bỏ qua hai phím; dòng sang dòng cách một là quãng 5, ngón 1 và ngón 5 của thế tay năm ngón; nốt trên dòng và nốt trong khe cùng tên là quãng 8, hai phím cùng tên.'
  loai: quy-tac
- trang: piano/thi-tau
  id: n7
  cau: 'Quy tắc dễ nhớ: quãng lẻ (3, 5, 7) nối dòng với dòng hoặc khe với khe; quãng chẵn (2, 4, 6, 8) nối dòng với khe.'
  loai: quy-tac
- trang: piano/thi-tau
  id: n8
  cau: 'Ví dụ "Đọc bằng quãng": nốt đầu là Đô giữa, các nốt sau đọc bằng quãng ghi trên nốt (3, 2, 4 | 4, 4, 3, 3 | 5, 5).'
  loai: cau-truc
- trang: piano/thi-tau
  id: n11
  cau: 'Mô thức tay trái: nốt trầm rồi hai hợp âm (điệu valse), bè Alberti (trầm–cao–giữa–cao), hợp âm rải.'
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n12
  cau: Hợp âm ba ở thế gốc là ba nốt trên ba dòng liên tiếp (hoặc ba khe liên tiếp); một quãng bốn "hở" trong chồng nốt là thể đảo.
  loai: quy-tac
- trang: piano/thi-tau
  id: n13
  cau: 'Dòng kẻ phụ: Đô giữa (C4) trên một dòng kẻ phụ giữa hai khuông, Đô trên hai dòng kẻ phụ phía trên khóa Sol (C6), Đô trên hai dòng kẻ phụ phía dưới khóa Fa (C2).'
  loai: quy-tac
- trang: piano/thi-tau
  id: n14
  cau: 8va phía trên nốt là chơi cao hơn một quãng tám so với nốt viết; 8vb (hoặc 8va phía dưới nốt) là thấp hơn một quãng tám; loco là trở về chơi như viết.
  loai: quy-tac
- trang: piano/thi-tau
  id: n16
  cau: 'Khoảng mắt–tay (eye-hand span): trong các nghiên cứu được tổng hợp, khoảng này chỉ vài nốt, từ chừng 0,5–3,7 nốt ở người mới đến chừng 1,7–6,8 nốt ở người đọc giỏi (tùy cách đo), và hiếm khi tới trọn một ô nhịp. Một vài thí nghiệm cho thấy luyện tập giúp kéo dài nó ở người đọc yếu, nhưng bằng chứng còn ít.'
  loai: so-lieu
- trang: piano/thi-tau
  id: n18
  cau: 'Bàn phím có "chữ nổi": nhóm hai và nhóm ba phím đen.'
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n21
  cau: Sol♯ là dấu hóa bất thường trong La thứ.
  loai: quy-tac
- trang: piano/thi-tau
  id: n23
  cau: Các bài đọc mẫu đều được soạn cho trang này (5 khối nhạc).
  loai: lich-su
- trang: piano/thi-tau
  id: n24
  cau: 'Bài 1: Đô trưởng, tay phải giữ nguyên thế tay Đô–Sol, tay trái chỉ có hai nốt Đô và Sol.'
  loai: cau-truc
- trang: piano/thi-tau
  id: n25
  cau: 'Bài 2: Sol trưởng, nhịp 3/4, hóa biểu một dấu thăng. Hai câu bốn ô nhịp chỉ khác nhau ở ô thứ nhất và thứ ba; ô thứ hai và thứ tư giống hệt.'
  loai: cau-truc
- trang: piano/thi-tau
  id: n26
  cau: 'Bài 3: La thứ, tay trái nốt trầm và hợp âm; Sol♯ có trong bài; tay phải đổi thế tay; tay trái lặp mô thức nốt trầm rồi ba hợp âm (Đô–Mi ở ô 1 và 3; Sol♯–Rê ở ô 2).'
  loai: cau-truc
- trang: piano/thi-tau
  id: n27
  cau: 'Bài 3 giản lược: tay trái chỉ còn nốt trầm (A,,8 | E,,8 | A,,8 | E,,4 A,,4); hòa âm vẫn rõ, nhịp vẫn giữ được.'
  loai: cau-truc
- trang: piano/thi-tau
  id: n29
  cau: 'Bartók, Mikrokosmos quyển 1–2: bắt đầu bằng những bài ngắn và tăng độ khó từng chút.'
  loai: cau-truc
- trang: piano/thi-tau
  id: n30
  cau: Paul Harris, Improve your sight-reading! (Faber Music), mỗi cấp một quyển, có bài tập tiết tấu và giai điệu, bài mẫu kèm câu hỏi, và bài đọc ngắn.
  loai: cau-truc
- trang: piano/thi-tau
  id: n31
  cau: Song tấu bốn tay, ví dụ Diabelli Melodious Exercises Op. 149; bè của học trò chỉ dùng năm nốt; chơi cùng người khác buộc bạn không được dừng.
  loai: cau-truc
- trang: piano/thi-tau
  id: n32
  cau: 'Trung cấp: minuet trong Notebook for Anna Magdalena Bach, sonatina, Album for the Young của Schumann.'
  loai: danh-muc
- trang: piano/thi-tau
  id: n34
  cau: 'Chuẩn bị thi: Đề mẫu thị tấu của ABRSM; đề cương thi piano của Trinity (thị tấu là một trong các bài thi phụ).'
  loai: cau-truc
- trang: piano/thi-tau
  id: n35
  cau: 'Sight Reading Factory: tạo bài đọc mới theo cấp độ.'
  loai: cau-truc
- trang: piano/thi-tau
  id: n43
  cau: 'Câu hỏi 1: hai nốt cùng nằm trên dòng kẻ, giữa chúng có đúng một dòng khác: quãng 5 (dòng sang dòng kế tiếp là quãng 3; dòng sang dòng cách một là quãng 5).'
  loai: quy-tac
- trang: piano/thi-tau
  id: n47
  cau: Andreas C. Lehmann, Victoria McArthur, "Sight-reading", trong Richard Parncutt, Gary E. McPherson (chủ biên), The Science and Psychology of Music Performance (Oxford University Press, 2002).
  loai: ten
- trang: piano/thi-tau
  id: n48
  cau: Paul Harris, Improve your sight-reading! (Faber Music), loạt sách piano theo cấp.
  loai: ten
- trang: piano/thi-tau
  id: n49
  cau: Béla Bartók, Mikrokosmos (Boosey & Hawkes).
  loai: ten
- trang: piano/thi-tau
  id: n50
  cau: Anton Diabelli, Melodious Exercises Op. 149 cho piano bốn tay.
  loai: ten
- trang: piano/thi-tau
  id: n51
  cau: 'ABRSM: đề mẫu thị tấu; Trinity College London: đề cương thi piano.'
  loai: cau-truc
- trang: piano/thi-tau
  id: n52
  cau: Sight Reading Factory (liên kết).
  loai: ten
- trang: piano/thi-tau
  id: n17
  cau: Thẻ che; chơi một nhìn một; tập với máy đếm nhịp chậm.
  loai: khuyen-tap
- trang: piano/thi-tau
  id: n33
  cau: 'Nâng cao: hợp xướng bốn bè (chorale) của Bach; đệm cho ca sĩ hoặc nhạc cụ khác; song tấu bốn tay của Schubert, Dvořák, Brahms; đọc bốn bè trên hai khuông là cách luyện đọc hòa âm rất tốt.'
  loai: khuyen-tap
- trang: piano/thi-tau
  id: n15
  cau: Khi thị tấu, giữ nhịp quan trọng hơn đúng từng nốt; chọn tốc độ đủ chậm để không phải dừng; đếm suốt bài; nhận ra nhanh các hình tiết tấu quen thuộc.
  loai: khuyen-tap
- trang: piano/hoa-am/dem-giai-dieu
  id: d3
  cau: Ở Đô trưởng mỗi nốt của gam nằm trong ít nhất một trong ba hợp âm chính I, IV, V; bảng bậc, nốt, hợp âm chính và hợp âm khác (vi, ii, V7).
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d4
  cau: Câu dừng ở bậc 2, 5 hoặc 7 thường là kết nửa (V); câu về chủ âm sau bậc 2 hoặc 7 là kết trọn (V–I).
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d5
  cau: 'Nốt ngắn ở phách yếu, đi liền bậc, thường là nốt lướt hoặc nốt thêu: bỏ qua, giữ hợp âm cũ.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d6
  cau: 'Khi một nốt thuộc hai hợp âm, chọn theo chức năng: chủ → hạ át → át → chủ; tránh đi từ V sang IV.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d7
  cau: 'Au clair de la lune, câu đầu: ô 1 Đô–Đô–Đô là I, Rê ở phách 4 là nốt lướt lên Mi; ô 2 Mi (I) rồi Rê (V); ô 3 Đô–Mi (I) rồi Rê–Rê (V); ô 4 Đô (I), kết trọn.'
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d9
  cau: 'Si–Fa–Sol cộng với Rê của giai điệu là đủ bốn nốt của V7, và cả câu tay trái chỉ đổi hai nốt: Đô với Si, Mi với Fa.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d11
  cau: Nhịp hòa âm là tốc độ đổi hợp âm.
  loai: dinh-nghia
- trang: piano/hoa-am/dem-giai-dieu
  id: d12
  cau: Trong nhạc cổ điển nhịp hòa âm thường đều (một hợp âm mỗi ô, hoặc mỗi nửa ô) và nhanh lên ở cuối câu, nơi kết cần hai hợp âm liền nhau.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d14
  cau: 'Ode to Joy: ô 1–3 và 5–7 mỗi ô một hợp âm, ô 4 và 8 có hai; ở ô 4 Mi chấm dôi thuộc I, Rê móc đơn vang sớm nửa phách so với V, rồi V giữ hai phách cuối (kết nửa); ô 8 là V rồi I (kết trọn), Đô móc đơn cũng là nốt đón trước; ô 2 và 6 giai điệu đi qua Fa nên V thành V7.'
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d15
  cau: Nốt đón trước là nốt thuộc hợp âm kế tiếp nhưng vang sớm hơn.
  loai: dinh-nghia
- trang: piano/hoa-am/dem-giai-dieu
  id: d18
  cau: 'Bass chỉ gồm nốt gốc thì nhảy liên tục: Đô–Sol–Đô–Sol; một bè bass tốt đi liền bậc khi có thể, nhờ hợp âm đảo và các hợp âm thay thế.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d19
  cau: V6 là Sol–Si–Rê với Si ở bass.
  loai: dinh-nghia
- trang: piano/hoa-am/dem-giai-dieu
  id: d21
  cau: 'vi (La–Đô–Mi) thay I: chung hai nốt Đô, Mi, mang màu thứ.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d22
  cau: 'ii6 (Rê–Fa–La, Fa ở bass) thay IV: chung hai nốt Fa, La.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d24
  cau: Cadential 6/4 có thể đứng trước V ở kết nửa.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d25
  cau: 'Giữa bass và giai điệu: đi ngược hướng, hoặc song song quãng 3, 6, 10; không song song quãng 5 hay quãng 8.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d26
  cau: Bass đi xuống từng bậc Đô–Si–La–Sol, ngược với những đoạn giai điệu đi lên; cả bè nằm gọn trong một thế tay trái, ngón 5 trên Fa2 và ngón 1 trên Đô3.
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d32
  cau: 'Tay trái không nhân đôi nốt giai điệu đang chuyển động: nếu giai điệu hát La–Sol trên IV–I mà tay trái cũng có La–Sol, hai bè chạy song song quãng 8; bỏ nốt trùng khỏi tay trái (Đô–Fa thay cho Đô–Fa–La).'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d35
  cau: Ah! vous dirai-je, maman (Mẹ ơi, con kể mẹ nghe; tiếng Anh là Twinkle, Twinkle, Little Star).
  loai: ten
- trang: piano/hoa-am/dem-giai-dieu
  id: d36
  cau: 'Giai điệu Ah! vous dirai-je ở Sol trưởng: G G d d | e e d2 | c c B B | A A G2 | d d c c | B B A2 | d d c c | B B A2 | G G d d | e e d2 | c c B B | A A G2.'
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d37
  cau: 'Ở Sol trưởng: I = Sol–Si–Rê, IV = Đô–Mi–Sol, V = Rê–Fa♯–La (V7 thêm Đô).'
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d38
  cau: 'Gợi ý đáp án: hợp âm và bass từng ô của 12 ô (ô 1 I; 2–3 IV–I; 4 V–I; 5 I–V7; 6 I–V; 7 I6–IV; 8 I–V; 9–12 như 1–4); nhịp hòa âm đều hai hợp âm mỗi ô, trừ ô 1 và 9.'
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d39
  cau: Mi ở ô 2 chỉ có trong IV (trong ba hợp âm chính), nên ô 2 phải là IV–I; ở ô 5, Đô là nốt 7 của V7.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d40
  cau: 'Ô 7 không lặp ô 5: nếu bass về Sol, giai điệu La–Rê và bass Rê–Sol tạo hai quãng 5 liền nhau; bass Si (I6) rồi Đô (IV) tránh được và cho bè bass đi liền bậc.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d43
  cau: 'Viết giai điệu bằng số (Ode to Joy: 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2) và hợp âm bằng số La Mã (I | V7 | I | I V), rồi đặt vào giọng mới.'
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d44
  cau: Ở La thứ, Ode to Joy bắt đầu bằng Đô–Đô–Rê–Mi; I thành i (La–Đô–Mi); V vẫn là hợp âm trưởng Mi–Sol♯–Si, dù giai điệu không có Sol♯.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q1
  cau: 'Quiz 1: ở Đô trưởng, nốt Rê nằm trong hợp âm chính V (Sol–Si–Rê); Rê cũng có trong ii và V7.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q2
  cau: 'Quiz 2: Au clair de la lune ô 1, Rê ở phách 4 là nốt lướt, giữ hợp âm I; Rê ngắn, ở phách yếu, đi liền bậc từ Đô lên Mi.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q3
  cau: 'Quiz 3: nhịp hòa âm thường nhanh hơn ở cuối câu, thường hai hợp âm trong ô kết, như ô 4 (I–V) và ô 8 (V–I) của Ode to Joy.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q4
  cau: 'Quiz 4: trong bản đệm Ode to Joy với bass Đô–Si–La–Sol, hợp âm ở ô 2 là V6 (Sol–Si–Rê, Si ở bass); Si là nốt ba của V, đặt ở bass để bass đi liền bậc.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q5
  cau: 'Quiz 5: giai điệu hát La–Sol trên IV–I, tay trái đang chơi Đô–Fa–La: nên bỏ La khỏi tay trái, vì nếu tay trái cũng đi La–Sol nó chạy song song quãng 8 với giai điệu.'
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d47
  cau: 'Nguồn: Lancaster, Renfrow, Alfred''s Group Piano for Adults (Alfred); Kostka, Payne, Tonal Harmony (McGraw-Hill); Aldwell, Schachter, Harmony and Voice Leading, kèm điều từng sách đóng góp.'
  loai: ten
- trang: piano/hoa-am/dem-giai-dieu
  id: d27
  cau: 'Chuyển sang Sol trưởng: bass Sol–Fa♯–Mi–Rê, rồi Sol–Fa♯–Mi–Đô–Rê–Sol.'
  loai: khuyen-tap
- trang: piano/hoa-am/dem-giai-dieu
  id: d17
  cau: 'Thí nghiệm: giữ I suốt ô 4, bỏ V; câu hỏi không còn "hỏi" nữa; trả V về phách 3 và nghe lại. Tay trái ngón 1 trên Đô3, ngón 4 trên Sol2; tập riêng rồi ghép ở ♩ = 72, sau đó 88.'
  loai: khuyen-tap
- trang: piano/hoa-am/dem-giai-dieu
  id: d29
  cau: 'Bảng chọn hình đệm theo tính chất giai điệu: hợp âm khối cho nhạc chậm trang nghiêm, nốt trầm và hợp âm cho nhịp 3/4 nhún nhảy, bass Alberti cho giai điệu vừa phải trong trẻo, hợp âm rải rộng với bàn đạp cho nhạc chậm ngân dài.'
  loai: khuyen-tap
- trang: piano/hoa-am/index
  id: i3
  cau: Phần này dành cho người từ khoảng Grade 2 đến trung cấp.
  loai: cap-do
- trang: piano/hoa-am/index
  id: i4
  cau: Gam trưởng Đô, Sol, Rê, Fa và gam thứ hòa âm La, Mi, Rê, hợp âm ba ở các thể đảo, vòng I–IV–I–V7–I ở Đô, Sol, Fa trưởng là hành trang của chặng 2 (khoảng Grade 1–2), xem trang hợp âm và hình đệm.
  loai: cap-do
- trang: piano/hoa-am/index
  id: i5
  cau: Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, kể cả những nốt không ghi sẵn trên bản nhạc, và chuyển chúng sang các giọng khác.
  loai: dinh-nghia
- trang: piano/hoa-am/index
  id: i6
  cau: 'Hòa âm bên phím cho bạn bốn thứ: đọc nhạc nhanh hơn (mắt nhận ra cả khối như I–IV–V–I hay một kết), học thuộc chắc hơn (có điểm bám khi quên), hiểu bản nhạc (chọn sắc thái, chỗ thở và rubato), tự do ứng tác.'
  loai: quy-tac
- trang: piano/hoa-am/index
  id: i8
  cau: Thời Baroque, người chơi đàn phím khi đệm thường chỉ có trước mặt một bè bass, đôi khi kèm các con số, và tự chơi hợp âm bên trên.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i9
  cau: 'Ở các nhạc viện Napoli thế kỷ 18, học trò luyện partimento: những bè bass được hoàn thiện thành nhạc ngay trên bàn phím.'
  loai: lich-su
- trang: piano/hoa-am/index
  id: i10
  cau: 'Carl Philipp Emanuel Bach, Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về cách chơi đàn phím đúng đắn): phần một 1753, phần hai 1762.'
  loai: nam
- trang: piano/hoa-am/index
  id: i11
  cau: C.P.E. Bach dành phần hai của Versuch cho việc đệm, và kết thúc bằng fantasia tự do, tức ứng tác.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i12
  cau: Mozart và Beethoven đều nổi tiếng là những người ứng tác xuất sắc trước công chúng.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i14
  cau: 'Giọng thứ cùng hóa biểu với một giọng trưởng: La thứ với Đô trưởng, Mi thứ với Sol trưởng.'
  loai: quy-tac
- trang: piano/hoa-am/index
  id: i17
  cau: 'Mẫu galant là những công thức hai bè quen thuộc của âm nhạc thế kỷ 18 mà nhà nghiên cứu Robert Gjerdingen hệ thống hóa: Romanesca, Prinner, Monte, Fonte…'
  loai: lich-su
- trang: piano/hoa-am/index
  id: i18
  cau: Vài tên mẫu có từ thế kỷ 18, như Monte và Fonte của Joseph Riepel; vài tên đặt theo nhà lý thuyết, như Meyer.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i26
  cau: 'Nguồn: Gjerdingen, Music in the Galant Style (Oxford University Press, 2007).'
  loai: ten
- trang: piano/hoa-am/index
  id: i27
  cau: 'Nguồn: Sanguinetti, The Art of Partimento (Oxford University Press, 2012); Mortensen, The Pianist''s Guide to Historic Improvisation (Oxford University Press, 2020); Kostka, Payne, Tonal Harmony (McGraw-Hill).'
  loai: ten
- trang: piano/hoa-am/index
  id: i19
  cau: 'Thứ tự này có chủ ý: kết là dấu chấm câu; đệm giai điệu là đặt câu; mẫu galant là thành ngữ; ứng tác là tự nói.'
  loai: khuyen-tap
- trang: piano/hoa-am/index
  id: i22
  cau: Mười phút mỗi ngày là một khối nhỏ, dễ giữ đều.
  loai: khuyen-tap
- trang: piano/hoa-am/index
  id: i21
  cau: 'Lịch chỉ là gợi ý: điều kiện để sang tuần sau là đạt mục tiêu của tuần trước; nếu một giọng còn vấp, giữ nó thêm một tuần.'
  loai: khuyen-tap
