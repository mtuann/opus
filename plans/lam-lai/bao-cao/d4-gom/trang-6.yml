  id: n80
  cau: 'Chopin, Bắt đầu bằng: Nocturne Đô♯ thứ (di cảo), Nocturne Mi thứ Op. 72 số 1 (≈ Grade 6).'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n81
  cau: 'Chopin, Bắt đầu bằng: Nocturne Op. 9 số 2 (≈ Grade 7–8), Valse Op. 64 số 2 (≈ Grade 7–8).'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n82
  cau: 'Chopin, Bắt đầu bằng: Fantaisie-Impromptu, các polonaise → Ballade số 1, scherzo, étude.'
  loai: cap-do
