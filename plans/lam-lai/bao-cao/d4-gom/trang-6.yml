  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n91
  cau: 'Clara Schumann: nghệ sĩ bậc thầy, viết thuận tay mà đòi hỏi; là một trong những nghệ sĩ đầu tiên biểu diễn thuộc lòng, thói quen nay đã thành chuẩn.'
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n92
  cau: 'Clara Schumann, Bắt đầu bằng: Op. 15 và Romance Op. 11 (≈ Grade 7–8) → Romanze Op. 21 (≈ Grade 8) → Biến tấu Op. 20 (sau Grade 8) → Concerto.'
  loai: cap-do
- trang: piano/nha-soan-nhac
