  id: n78
  cau: 'Chopin, Bắt đầu bằng: Prélude số 7 La trưởng, số 4 Mi thứ, số 20 Đô thứ (≈ Grade 3–5).'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n79
  cau: 'Chopin, Bắt đầu bằng: các mazurka dễ, Valse Si thứ Op. 69 số 2 (≈ Grade 5–6).'
  loai: cap-do
