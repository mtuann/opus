  id: n143
  cau: 'Ravel, Bắt đầu bằng: Menuet sur le nom d''Haydn (1909), Prélude La thứ (1913) → Pavane → Sonatine, Menuet và Forlane → Jeux d''eau, Miroirs → Gaspard.'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n147
  cau: 'Bartók, Bắt đầu bằng: For Children (Sorrow: Grade 2; Winter Solstice Song: Grade 5).'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n148
  cau: 'Bartók, Bắt đầu bằng: Mikrokosmos tập 1–2 (ngay từ những tháng đầu) → Mikrokosmos tập 3–4 → Romanian Folk Dances, Sonatina (chương Bagpipers: Grade 7) → Allegro barbaro, Suite Op. 14 → Out of Doors, Sonata.'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n149
  cau: 'Prokofiev: Toccata Op. 11 (1912), Visions fugitives Op. 22, các sonata (như số 3, số 7), Music for Children Op. 65, 10 bản trích ballet Romeo và Juliet Op. 75, 5 concerto.'
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n151
  cau: 'Prokofiev, Bắt đầu bằng: Music for Children: Morning, Promenade, March (Grade 4), Tarantella (Grade 5) → vài bản trong Visions fugitives → Romeo và Juliet Op. 75 → Sonata số 3, Toccata → Sonata số 7.'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n152
  cau: 'Gershwin: Rhapsody in Blue (1924), Concerto Fa trưởng, Three Preludes (1926), Songbook (1932, 18 ca khúc của ông trong bản cho piano); Bắt đầu bằng: Prelude số 2 → Prelude số 1 và 3; Kapustin (1937–2020).'
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n156
  cau: 'Kabalevsky, Bắt đầu bằng: Op. 39 (A Little Scherzo: Initial Grade; Galop: Grade 2) → Op. 27, như Toccatina (Grade 4).'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n157
  cau: 'Kabalevsky, Bắt đầu bằng: Sonatina Op. 13 số 1 → Prelude Op. 38 → Sonata số 3.'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n158
  cau: 'Shostakovich: 24 Prelude Op. 34 (1932–1933), Children''s Notebook Op. 69 (1944–1945, viết cho con gái Galina), Dances of the Dolls, 24 Prelude và Fugue Op. 87 (1950–1951), hai concerto (số 2 viết cho con trai Maxim).'
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n160
  cau: 'Shostakovich, Bắt đầu bằng: Children''s Notebook → Dances of the Dolls → vài prelude Op. 34 → Prelude và Fugue Op. 87, như số 1 Đô trưởng hoặc số 7 La trưởng → Concerto số 2.'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n163
  cau: 'Ligeti, Bắt đầu bằng: Musica ricercata số 1 và 2 → số 7 → Étude số 5 Arc-en-ciel (trình độ hòa nhạc) → Désordre và các étude khác.'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n167
  cau: 'Kurtág: Játékok viết từ năm 1973 cho việc dạy đàn, nhưng không phải giáo trình kỹ thuật đi từ dễ đến khó.'
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n169
  cau: 'Pärt: Für Alina (1976) và Variationen zur Gesundung von Arinuschka rất ít nốt.'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n170
  cau: 'Glass: Opening trong album Glassworks, Metamorphosis, 20 Étude.'
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n182
  cau: 'Nguồn: Mức độ khó: đề cương thi piano của ABRSM, các kỳ 2021–2022, 2023–2024 và 2025–2026.'
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n186
  cau: Promenade đầu tiên trong Tranh triển lãm xen kẽ nhịp 5/4 và 6/4.
  loai: cau-truc
- trang: piano/nha-soan-nhac
  id: n187
  cau: Trong các Gnossienne của Satie, những lời dặn kỳ quặc chen giữa các dòng nhạc.
  loai: cau-truc
- trang: piano/nha-soan-nhac
  id: n188
  cau: C. P. E. Bach viết theo phong cách "nhạy cảm" (Empfindsamkeit).
  loai: lich-su
- trang: piano/not-hoa-my
  id: n40
  cau: 'Thời Lãng mạn (Chopin, Schumann, Liszt), láy rền bắt đầu theo cả hai cách; Hummel (1827–1828) khuyên bắt đầu mọi láy rền từ nốt chính; với Chopin các nguồn chưa thống nhất: có nhà nghiên cứu cho rằng ông nhìn chung vẫn bắt đầu từ nốt trên, còn chú giải ấn bản Quốc gia Ba Lan chỉ ra nhiều chỗ nên bắt đầu từ nốt chính.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n43
  cau: Theo cách đọc Baroque, nốt trên rơi đúng phách là một nốt nghịch tựa vào nốt chính, nên láy rền nghe như một chuỗi appoggiatura nối nhau thật nhanh.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n62
  cau: 'Trong nhạc Baroque, láy trên (răng cưa không gạch) là một láy rền (Trillo của Bach), thường từ nốt trên, đúng phách; trên nốt ngắn chỉ còn bốn nốt: trên–chính–trên–chính.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n67
  cau: Aria mở đầu Biến khúc Goldberg có nốt hoa mỹ ở phần lớn các ô.
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n69
  cau: 'Ví dụ 3: (a) đi xuống tới nốt có láy trên, (b) đi lên, (c) láy dưới; khối 7 chơi theo cách đọc thế kỷ 19, khối 8 "Chơi theo cách đọc Baroque (láy rền ngắn, bốn nốt)"; ở (a) hai khối gần giống nhau, nốt Mi ngân thêm vào phách; ở (b) bốn nốt từ Mi so với ba nốt từ Rê. Với giai điệu đi lên, ký hiệu thường được đọc như Trillo của bảng Bach 1720: láy rền bắt đầu từ nốt trên, đúng phách.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n73
  cau: 'Láy quanh đặt giữa hai nốt: chơi nốt chính trước, rồi láy quanh ở cuối giá trị của nốt đó và nối thẳng vào nốt sau.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n74
  cau: 'Láy quanh ngược bắt đầu từ nốt dưới: dưới – chính – trên – chính.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n82
  cau: 'Không phải nốt nhỏ không gạch nào cũng dài: C. P. E. Bach nêu những nốt dựa luôn ngắn, thường đứng trước một nốt ngắn, có khi trước một nốt được nhắc lại nhiều lần.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n89
  cau: 'Đường lượn sóng liền qua cả hai khuông: rải một lần từ nốt thấp nhất của tay trái lên nốt cao nhất của tay phải; hai đường riêng cho hai tay: không nhất thiết rải cùng lúc (chú giải ấn bản Quốc gia Ba Lan cho các nocturne của Chopin: hai đường riêng không nhất thiết rải đồng thời, có chỗ chỉ cho biết cách chia hợp âm giữa hai tay); có mũi tên chỉ xuống: rải từ trên xuống.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n95
  cau: 'Fioritura (tiếng Ý: "nở hoa"; số nhiều fioriture) là những chùm nốt trang trí dài, viết bằng nốt nhỏ hoặc thành những nhóm không chia đều theo phách của tay trái, bắt chước lối luyến láy của ca sĩ bel canto.'
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n96
  cau: Chopin còn viết thêm biến thể vào bản nhạc của học trò; Nocturne Op. 9 số 2 có cả một bộ biến thể như thế.
  loai: lich-su
- trang: piano/not-lap-not-kep
  id: n25
  cau: Tai người nghe có xu hướng ưu tiên bè cao nhất.
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n35
  cau: Quãng ba nửa cung cần ngón bấm riêng (Graham Fitch có một mục về quãng ba thứ nửa cung trong bài "Nimble Chromatics").
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n51
  cau: 'Quiz 4: khi không thể nối cả hai bè của chuỗi quãng ba, ưu tiên giữ bè trên legato vì bè trên thường là giai điệu và tai người nghe có xu hướng ưu tiên bè cao nhất.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n19
  cau: Tai người nghe có xu hướng ưu tiên bè cao nhất.
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n31
  cau: 'Hình đệm nốt trầm – hợp âm là một dạng bước nhảy hay gặp của tay trái: valse ở nhịp 3/4, nhịp chèo 6/8 của Thuyền ca Venice, và kiểu stride của jazz (lớn lên từ ragtime), khi nốt trầm ở phách mạnh xen với hợp âm.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n41
  cau: Tập quãng tám thành các đợt ngắn xen nghỉ; BAPAM gợi ý các đợt 20 phút tập xen 10 phút nghỉ; tập mf cho tới khi tay thả lỏng hẳn rồi mới thêm f.
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n55
  cau: 'Quiz 3: trong quãng tám legato ở tay phải, bè trên được nối bằng ngón 4 và 5 (đôi khi 3); ngón cái không nối được, trượt từ phím đen xuống phím trắng; tai người nghe có xu hướng ưu tiên bè cao nhất.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n17
  cau: 'Hàng "Lặp một chuyển động quá lâu": một đoạn khó 30 phút liền, bài tập ngón hàng giờ; cùng một nhóm cơ và gân chịu tải liên tục; xen kẽ các việc, dùng bài tập ngón có liều lượng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n22
  cau: 'Khởi động nhẹ vài phút, mục đích là làm ấm chứ không phải kéo giãn: xoay vai, lắc tay, xoay cổ tay, thả rơi cánh tay, năm ngón hoặc gam chậm.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n26
  cau: 'Đa dạng buổi tập: xen phần "nặng" với phần "nhẹ"; chia đoạn nặng thành nhiều lần ngắn; việc không cần đàn như chạy bài trong đầu, phân tích, nghe bản thu vẫn là tập.'
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n32
  cau: Có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 và DS6.0 (quãng tám rộng 5,5 và 6 inch); PASK vận động để chúng phổ biến hơn và giữ danh sách những nơi làm loại bàn phím này.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n34
  cau: 'Vận động: BAPAM khuyên giữ thể lực bằng vận động nhịp điệu đều như bơi, đi bộ hay chạy; các môn dùng tạ và nắm tay chặt không hợp với người chơi piano.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n59
  cau: BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano); Musicians' Focal Dystonia; Returning to Playing.
  loai: ten
- trang: piano/the-loai
  id: n9
  cau: 'Bảng, cột Chơi thử của Biến tấu: Beethoven, 6 biến tấu trên một bài ca Thụy Sĩ WoO 64 (không ghi chặng).'
  loai: danh-muc
- trang: piano/the-loai
  id: n10
  cau: 'Bảng, cột Chơi thử của Sonata một chương: Scarlatti, K. 32 (không ghi chặng); K. 32 Rê thứ có tên Aria.'
  loai: danh-muc
- trang: piano/the-loai
  id: n11
  cau: 'Bảng, cột Chơi thử (không ghi chặng): Mozart, Fantasia K. 397; Chopin, Nocturne Đô♯ thứ (di cảo); Brahms, Valse Op. 39 số 15, bản rút gọn của Brahms; Kabalevsky, Toccatina Op. 27 số 12.'
  loai: danh-muc
- trang: piano/the-loai
  id: n13
  cau: Nhạc phím Baroque được viết cho harpsichord, clavichord hoặc organ, khi piano còn rất mới; kho bài này dạy hai tay độc lập, phức điệu, nhịp vững.
  loai: lich-su
- trang: piano/the-loai
  id: n15
  cau: 'Bốn điệu lõi của tổ khúc: allemande (nhịp chẵn, vừa phải), courante (nhịp ba; kiểu Ý corrente thì nhanh), sarabande (nhịp ba chậm, trang nghiêm) và gigue (nhanh, nhịp ghép như 6/8).'
  loai: dinh-nghia
- trang: piano/the-loai
  id: n18
  cau: Prelude là phần mở đầu, đi trước một bản khác như fugue; fugue là bản phức điệu mà chủ đề được các bè lần lượt bắt chước.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n19
  cau: 'Bình quân luật của Bach: quyển 1 năm 1722, quyển 2 đầu những năm 1740; 48 cặp prelude và fugue qua đủ 24 giọng trưởng và thứ.'
  loai: lich-su
- trang: piano/the-loai
  id: n23
  cau: 'Domenico Scarlatti để lại hơn 550 sonata cho harpsichord (danh mục Kirkpatrick đánh số tới K. 555); nhiều bản chỉ một chương ở hình thức hai phần, mỗi phần nhắc lại: phần đầu thường chuyển sang giọng khác, phần sau quay về giọng chính; các bản về sau của ông hay mang nét nhạc dân gian bán đảo Iberia (fandango, seguidilla).'
  loai: so-lieu
- trang: piano/the-loai
  id: n25
  cau: Sonata Cổ điển thường có ba chương nhanh – chậm – nhanh; chương đầu thường ở hình thức sonata; chương cuối thường ở hình thức sonata hoặc rondo.
  loai: cau-truc
- trang: piano/the-loai
  id: n27
  cau: 'Sonatina là "sonata nhỏ" (dạng thu nhỏ của chữ sonata trong tiếng Ý); vài tập sonatina: Clementi Op. 36, Kuhlau Op. 20 và Op. 55, Diabelli Op. 151 và Op. 168.'
  loai: danh-muc
- trang: piano/the-loai
  id: n29
  cau: Rondo Mozart La thứ K. 511; Beethoven Rondo a capriccio Op. 129 (biệt danh "Giận dữ vì đồng xu bị mất"); Für Elise là rondo A–B–A–C–A.
  loai: danh-muc
- trang: piano/the-loai
  id: n32
  cau: 'Thế kỷ 19 có rất nhiều tiểu phẩm tính cách (character piece) cho piano: những bản ngắn khắc họa một tâm trạng hay một hình ảnh.'
  loai: lich-su
- trang: piano/the-loai
  id: n36
  cau: John Field, người Ireland, in những nocturne đầu tiên khoảng năm 1812–1814 (các nguồn ghi khác nhau) và thường được coi là người khai sinh thể loại; Chopin đưa nó lên đỉnh cao.
  loai: lich-su
- trang: piano/the-loai
  id: n37
  cau: Ở Nocturne Op. 9 số 2 của Chopin, tay trái rải hợp âm rộng, tay phải hát một giai điệu có nhiều nốt hoa mỹ.
  loai: cau-truc
- trang: piano/the-loai
  id: n38
  cau: Étude nghĩa là bài học; Czerny, Cramer, Clementi viết nhiều tập étude để luyện ngón.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n40
  cau: 24 prélude Op. 28 của Chopin đi qua 24 giọng theo vòng quãng năm (Đô trưởng, La thứ, Sol trưởng, Mi thứ…); sau ông có Scriabin (Op. 11), Rachmaninoff, Debussy viết prelude.
  loai: cau-truc
- trang: piano/the-loai
  id: n41
  cau: Debussy đặt tên gợi hình ở cuối mỗi prelude, trong ngoặc, để người chơi gặp âm nhạc trước khi gặp tên gọi.
  loai: lich-su
- trang: piano/the-loai
  id: n42
  cau: Mazurka là điệu nhảy dân gian Ba Lan, phách nhấn thường rơi vào phách 2; Chopin viết khoảng 60 bản.
  loai: so-lieu
- trang: piano/the-loai
  id: n43
  cau: Polonaise là điệu Ba Lan nhịp ba, tốc độ vừa, trang trọng như một cuộc rước; Chopin viết 13 bản; valse (waltz) cũng ở nhịp ba.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n44
  cau: Chopin là người đầu tiên đặt tên ballade cho một bản nhạc không lời, ông viết bốn ballade; scherzo nghĩa đen là "đùa", vốn là chương nhanh trong sonata và giao hưởng; Chopin viết bốn scherzo độc lập cho piano.
  loai: lich-su
- trang: piano/the-loai
  id: n46
  cau: Ba bản của Mendelssohn có tên Venetianisches Gondellied (Khúc thuyền gondola Venice); bản đầu tiên là Op. 19 số 6 Sol thứ.
  loai: ten
- trang: piano/the-loai
  id: n49
  cau: 'Rhapsody: tự do, thường có màu dân gian: 19 Hungarian Rhapsodies của Liszt; hai Rhapsody Op. 79 của Brahms.'
  loai: danh-muc
- trang: piano/the-loai
  id: n50
  cau: 'Intermezzo ("khúc chen giữa"): Brahms cuối đời viết nhiều intermezzo trong bốn tập Op. 116–119 (1892–1893).'
  loai: lich-su
- trang: piano/the-loai
  id: n51
  cau: 'Barcarolle: nhịp đung đưa của người chèo thuyền gondola, thường 6/8 hoặc 12/8 (Chopin Op. 60; Fauré viết 13 bản; Tchaikovsky, Tháng Sáu trong Các mùa); berceuse: khúc hát ru, như Berceuse Op. 57 của Chopin.'
  loai: danh-muc
- trang: piano/the-loai
  id: n53
  cau: Grieg viết 66 Lyric Pieces trong mười tập, từ năm 1867 đến 1901; bản đầu là Arietta; bản cuối của tập cuối gợi lại giai điệu Arietta dưới dạng valse.
  loai: so-lieu
- trang: piano/the-loai
  id: n57
  cau: 'Gặp gỡ jazz: Gershwin (ba Preludes, Rhapsody in Blue).'
