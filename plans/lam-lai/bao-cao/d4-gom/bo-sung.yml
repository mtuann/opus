- trang: piano/10-bai-dau-tien
  id: n55
  cau: Hänschen klein là bài hát thiếu nhi Đức.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n56
  cau: 'Học được ở bài 4: hợp âm ba nốt ở tay trái và đổi giữa hai hình: hợp âm chủ Đô – Mi – Sol (ngón 5-3-1) và hợp âm bảy át Si – Fa – Sol (ngón 5-2-1).'
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n107
  cau: 'Nguồn: giai điệu từ dân ca Pháp, Anh, bài hát thiếu nhi Đức; thánh ca "New Britain"; Beethoven, Giao hưởng số 9 và Bagatelle WoO 59; Dvořák, Giao hưởng số 9; Petzold, Minuet BWV Anh. 114.'
  loai: lich-su
- trang: piano/bai-tap-ngon
  id: n6
  cau: 'Căng cơ: tránh nâng ngón thật cao rồi đập xuống, khóa cổ tay, ấn đáy phím sau khi nốt đã kêu.'
  loai: quy-tac
- trang: piano/bai-tap-ngon
  id: n39
  cau: 'Brahms, 51 Übungen WoO 6: những mẫu ngắn Brahms viết trong khoảng 1850–1893 (theo IMSLP).'
  loai: lich-su
- trang: piano/ban-dap
  id: n2
  cau: 'Bàn đạp trái trên đàn cánh là una corda (soft pedal): dịch cả bàn phím và bộ máy sang bên, để búa gõ ít dây hơn ở mỗi nốt; tiếng nhỏ hơn và đổi màu.'
  loai: dinh-nghia
- trang: piano/ban-dap
  id: n7
  cau: Một số đàn đứng có sostenuto thật; nếu bàn đạp giữa của đàn không phải sostenuto, xem sách hướng dẫn của đàn để biết nó làm gì.
  loai: dinh-nghia
- trang: piano/ban-dap
  id: n9
  cau: Una corda nghĩa là "một dây"; hai cây đàn còn lại của Cristofori (1722 và 1726) có bàn phím trượt được sang bên, để búa chỉ gõ một trong hai dây của mỗi nốt.
  loai: lich-su
- trang: piano/ban-dap
  id: n10
  cau: 'Piano điện: có bàn đạp chỉ là công tắc bật – tắt, và có bàn đạp dùng được nửa bàn đạp (half-damper).'
  loai: dinh-nghia
- trang: piano/ban-dap
  id: n14
  cau: 'Bàn đạp vang nhấc tất cả bộ giảm âm cùng lúc; nốt ngân sau khi nhả phím, và mọi dây khác cũng được tự do rung theo những nốt đang chơi: cộng hưởng giao cảm; vì vậy một nốt có bàn đạp nghe khác cùng nốt ấy giữ bằng ngón.'
  loai: dinh-nghia
- trang: piano/ban-dap
  id: n15
  cau: Các nốt ở âm vực cao nhất (cỡ hai quãng tám trên cùng, tùy đàn) không có bộ giảm âm.
  loai: so-lieu
- trang: piano/ban-dap
  id: n16
  cau: 'Bàn đạp không phải công tắc: có thể đạp nông hay sâu (như nửa bàn đạp, khi bộ giảm âm chỉ chạm nhẹ dây) và nhả nhanh hay chậm.'
  loai: quy-tac
- trang: piano/ban-dap
  id: n18
  cau: 'Ký hiệu Ped.: nhấn bàn đạp vang; dấu sao ✱ là chỗ nhả; trong các bài trên site này, một chữ Ped. mới mà không có dấu sao trước đó nghĩa là đổi bàn đạp: nhả rồi nhấn lại.'
  loai: quy-tac
- trang: piano/ban-dap
  id: n19
  cau: 'Đường kẻ dưới khuông có vạch dọc ở hai đầu: nhấn ở đầu, giữ đến vạch dọc ở cuối thì nhả; chỗ gãy nhọn (∧) trên đường kẻ là nửa bàn đạp: nhả một phần rồi nhấn lại.'
  loai: quy-tac
- trang: piano/ban-dap
  id: n37
  cau: 'Các kiểu đạp khác: đạp cùng lúc (direct, rhythmic pedal), đạp trước, nửa bàn đạp (nhấn nông, bộ giảm âm chạm nhẹ dây; hoặc nhả một nửa rồi nhấn lại), rung bàn đạp (flutter pedal: nhả và nhấn rất nhanh, liên tục).'
  loai: dinh-nghia
- trang: piano/ban-dap
  id: n44
  cau: Đàn fortepiano của Stein, mà Mozart rất khen năm 1777, nhấc bộ giảm âm bằng cần gạt bằng đầu gối; Mozart ít ghi bàn đạp vào bản nhạc (chương 1 Sonata K. 545 không có ký hiệu bàn đạp nào).
  loai: lich-su
- trang: piano/ban-dap
  id: n46
  cau: Theo Concise Oxford Dictionary of Music, Beethoven là người đầu tiên tận dụng trọn vẹn bàn đạp vang.
  loai: lich-su
- trang: piano/ban-dap
  id: n48
  cau: Trên đàn thời Beethoven, tiếng ngân ngắn hơn đàn hiện đại, nên giữ bàn đạp suốt chỉ tạo một lớp sương mỏng; trên đàn hiện đại, giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ thành một khối âm thanh hỗn độn.
  loai: quy-tac
- trang: piano/ban-dap
  id: n58
  cau: 'Quiz 2: trên đàn cánh una corda dịch bộ máy sang bên để búa gõ ít dây hơn; giữ nhấc bộ giảm âm của những phím đang giữ là bàn đạp giữa (sostenuto); đưa búa lại gần dây là bàn đạp trái của đàn đứng.'
  loai: dinh-nghia
- trang: piano/ban-do-ban-phim
  id: n37
  cau: 'Cột "Thường do tay nào": ba vùng trầm (A0–B3) là tay trái, vùng giữa (C4–B4) cả hai tay quanh Đô giữa, hai vùng cao (C5–C8) tay phải; hình ghi "thường là vùng của tay trái / tay phải".'
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n40
  cau: 'Trên bản nhạc piano, khuông khóa Sol thường dành cho tay phải và khuông khóa Fa cho tay trái; đó là quy ước, không phải luật: khóa có thể đổi giữa chừng, và tay trái có khi chơi trên khuông khóa Sol.'
  loai: quy-tac
- trang: piano/cach-tap
  id: n33
  cau: 'Dòng "Nghỉ" của bảng Mẫu buổi tập theo lời khuyên của BAPAM: tập khoảng 20 phút rồi nghỉ 10 phút; buổi 45 phút có một lần nghỉ 10 phút, buổi 90 phút ba lần.'
  loai: quy-tac
- trang: piano/cach-tap
  id: n56
  cau: BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano), trang trên bapam.org.uk.
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n46
  cau: Schubert, Trois marches militaires D. 733, in năm 1826 thành Op. 51; số 1 ở giọng Rê trưởng.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n52
  cau: 'Schubert, Fantasia Fa thứ D. 940 (1828): bốn phần Allegro molto moderato, Largo, Allegro vivace, Tempo I.'
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n57
  cau: Trong Erlkönig của Schubert, piano là tiếng vó ngựa phi suốt bài, đến câu cuối mới dừng để giọng hát kể như nói (recitative).
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n83
  cau: Nghe chương 4 của Con cá hồi (chủ đề và biến tấu), để ý khi nào piano dẫn, khi nào nó lùi lại.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n98
  cau: 'Moore dẫn lại, với ý không đồng tình, lời "khen" mà giọng tenor Raimund von zur Mühlen viết cho người đệm Coenraad V. Bos: "Tối qua chắc anh chơi hay lắm, vì suốt buổi tôi chẳng để ý thấy tiếng đàn của anh."'
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n104
  cau: Một trong những người góp phần lớn thay đổi cách nhìn về người đệm đàn là Gerald Moore.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n113
  cau: Diabelli Op. 149 có bản của Edition Peters (EP 2442).
  loai: danh-muc
- trang: piano/gam
  id: n8
  cau: 'Ba quy tắc: ngón cái không đặt lên phím đen (trong các ngón bấm chuẩn của gam trưởng và gam thứ hòa âm ngón cái chỉ chơi phím trắng); các ngón dài (2, 3, 4) nhận phím đen; ngón 4 chỉ dùng một lần trong mỗi quãng tám, không kể nốt mở đầu (tay trái Si trưởng bắt đầu bằng ngón 4 trên Si rồi dùng ngón 4 ở Fa♯; từ quãng tám thứ hai Si là ngón 1).'
  loai: quy-tac
- trang: piano/gam
  id: n13
  cau: 'Si trưởng: tay phải như Đô trưởng; tay trái bắt đầu bằng ngón 4. Si♭ trưởng: một số bảng ngón bấm (như PianoScales) cho nốt Si♭ đầu tiên của tay phải dùng ngón 2; từ quãng tám thứ hai Si♭ luôn là ngón 4.'
  loai: quy-tac
- trang: piano/gam
  id: n16
  cau: 'Một số bảng ngón bấm (như PianoScales) cho tay phải Fa♯ thứ và Sol♯ thứ bắt đầu bằng 2 3 thay vì 3 4, và Si♭ thứ bắt đầu bằng ngón 2: chỉ khác ở hai nốt đầu (Si♭ thứ: nốt đầu).'
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n39
  cau: 'Bài kiểm tra: Đô giữa nằm ngay bên trái nhóm hai phím đen gần giữa đàn và là nốt Đô thứ tư tính từ dưới lên; mọi nốt Đô (trừ Đô8 ở đầu cao của đàn) đều nằm ngay bên trái nhóm hai phím đen; ở thế Đô, ngón 5 tay trái trên Đô3.'
  loai: dinh-nghia
- trang: piano/hoa-am/index
  id: i3
  cau: Phần này dành cho người lớn đã xong chặng sơ cấp (chặng 2 của lộ trình, khoảng Grade 1–2), cho đến hết chặng trung cấp.
  loai: cap-do
- trang: piano/hoa-am/index
  id: i6
  cau: 'Hòa âm bên phím gắn với bốn việc: đọc nhạc (một phần lớn của đọc nhanh là nhận ra hình mẫu; I–IV–V–I hay một kết là hình mẫu), học thuộc (khung hòa âm là phần trí nhớ phân tích, cho chỗ bám lại khi lỡ quên), hiểu bản nhạc (luyện cả tai lẫn đầu óc, không chỉ ngón tay), ứng tác.'
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n17
  cau: 'Khi bè trên dừng ở nốt ba hoặc nốt năm của hợp âm I thì đó là kết chưa trọn: vẫn là kết V–I, đã kết nhưng còn hơi mở; trang tính kết trọn và kết chưa trọn là hai dạng của cùng một loại kết V–I.'
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n27
  cau: 'Hợp âm 6/4 ở kết (cadential 6/4): trong concerto, cadenza của nghệ sĩ độc tấu chen vào kết và bắt đầu từ chính hợp âm này.'
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n6
  cau: 'Fonte (giếng, nguồn nước), Monte (núi), Ponte (cầu): nghĩa các tên tiếng Ý.'
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n14
  cau: Conservatorio là trường ở Napoli, Venezia và những nơi khác, nơi trẻ em được "gìn giữ" (conserved) và học nhạc.
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n34
  cau: Romanesca đứng đầu bài hay đầu câu; theo sau thường là một mẫu trả lời như Prinner.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n35
  cau: 'Romanesca có hai dạng bass chính: dạng nhảy (xuống quãng 4 xen lên một bậc: 1–5–6–3) và dạng đi liền (bass đi bậc xuống).'
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n58
  cau: 'Cadenza doppia: bass giữ 5 bốn bước rồi 1, giai điệu 4–3–2–2–1, bè giữa cách bass quãng 5–4–4–3 (Rê – Đô – Đô – Si ở Đô trưởng).'
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n18
  cau: Người ta từng cho rằng nó được viết ở Paris năm 1778; nghiên cứu chữ viết và giấy của bản thảo cho thấy khoảng 1781–1782 mới đúng hơn.
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n24
  cau: Biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ); biến tấu 12 đổi sang 3/4 và khép bằng coda (cũng là đáp án và giải thích câu hỏi 2 của phần Kiểm tra nhanh).
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n36
  cau: C. P. E. Bach đã in những sonata ghi sẵn các lần nhắc lại được biến đổi (Sechs Sonaten für Clavier mit veränderten Reprisen, 1760).
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n39
  cau: 'Ở thế kỷ 19, dạo đầu (preluding) trước một bản nhạc là một kỹ năng được dạy hẳn hoi: Czerny in cả một tập 120 ví dụ dạo đầu, chuyển giọng, kết và fantasia (Op. 300).'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n57
  cau: 'Câu hỏi 4: một đoạn dạo đầu ngắn giúp báo giọng, làm quen cây đàn, làm ấm tay hoặc nối hai bài khác giọng; Czerny in cả một tập 120 ví dụ dạo đầu, chuyển giọng, kết và fantasia, Op. 300.'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n59
  cau: 'Nguồn: K. 265 trên IMSLP (trang tác phẩm), bản cho hai guitar theo ấn bản Porro trên Mutopia, lời nói đầu ấn bản Urtext Henle HN 116.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n3
  cau: 'Clavichord: rung nhẹ ngón trên phím tạo tiếng rung (Bebung); tiếng quá nhỏ để chơi hòa nhạc, nên chủ yếu dùng để tập riêng; các sonata và fantasia của C. P. E. Bach rất hợp với tiếng của nó.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n7
  cau: Trước khi có piano, người chơi nhạc phím dùng những nhạc cụ như clavichord, harpsichord, organ; không loại nào vừa to hay nhỏ tùy theo lực ngón tay, vừa đủ vang cho một căn phòng lớn.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n16
  cau: 'Bach viết nhạc phím cho những nhạc cụ của thời ông: harpsichord, clavichord và organ; trang bìa bản in Biến khúc Goldberg (1741) ghi rõ bản nhạc viết cho harpsichord hai tầng phím (Clavicimbal mit 2 Manualen); chơi Bach trên piano là một lựa chọn diễn giải.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n19
  cau: 'Đàn bộ máy Vienna: bộ máy nhẹ và đơn giản, búa bọc da, tiếng nhẹ và thanh hơn đàn hiện đại.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n27
  cau: 'Beethoven có một cây đàn của Conrad Graf ở Vienna, Graf cho ông mượn từ đầu năm 1826: sáu quãng tám rưỡi, từ CC đến f'''''''' (Đô1–Fa7).'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n28
  cau: 'Hình keyboard-ranges so âm vực với bàn phím 88 phím: Đàn Stein (thời Mozart) Fa1–Fa6, 5 quãng tám; Broadwood của Beethoven (1817) Đô1–Đô7, 6 quãng tám; Graf của Beethoven (1826) Đô1–Fa7, 6½ quãng tám; piano hiện đại La0–Đô8.'
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n44
  cau: 'Đàn đứng (upright): dây dựng theo chiều đứng để cây đàn gọn hơn; kiểu "đàn hươu cao cổ" (giraffe piano) xuất hiện ở Vienna khoảng năm 1798; năm 1800, John Isaac Hawkins làm cây piano đứng thực thụ đầu tiên, ở Philadelphia.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n49
  cau: Fazioli (Sacile, Ý), thành lập năm 1981, làm đàn cánh, từ cỡ nhỏ đến đàn concert.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n51
  cau: Một số đàn concert của Bösendorfer có 97 phím (tám quãng tám trọn), xuống tới Đô0.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n52
  cau: 'Nhật Bản: Yamaha làm cây piano đứng đầu tiên năm 1900, Kawai thành lập năm 1927.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n55
  cau: 'Phong trào biểu diễn theo lối lịch sử đưa đàn cổ trở lại sân khấu: những nghệ sĩ như Malcolm Bilson chơi Mozart, Beethoven, Schubert trên fortepiano.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n60
  cau: Ở vùng trầm nhất, mỗi nốt chỉ có một dây; lên cao hơn là hai dây, rồi ba dây ở các nốt cao.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n61
  cau: Một cây piano có hơn 200 dây (đàn concert Steinway D có 243 dây); tổng lực căng là 16 tấn vào năm 1862 và có thể lên tới 30 tấn ở đàn hiện đại, do khung gang gánh chịu.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n65
  cau: 'Bảng "Đàn xưa dạy gì": đàn thời Mozart, Beethoven có bộ máy nhẹ và đơn giản (đàn hiện đại nặng và phức tạp hơn); tiếng ngân ngắn hơn (đàn hiện đại ngân dài); khung nhẹ, thường hai dây mỗi nốt, tiếng nhẹ và thanh (đàn hiện đại khung gang, dây căng mạnh, tiếng to và dày); giữ bàn đạp lâu vẫn ít nhòe vì tiếng tắt nhanh (đàn hiện đại dễ nhòe).'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n67
  cau: 'Quiz: Maffei năm 1711 gọi nó là gravicembalo col piano, e forte; người chơi harpsichord tạo tương phản bằng register và hai tầng phím; cần lặp đỡ búa ở lưng chừng, nền tảng bộ máy đàn cánh hiện đại; đàn thời Mozart nhẹ, tiếng thanh và ngân ngắn, đàn hiện đại ngân dài và tiếng dày hơn.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n69
  cau: 'Nguồn: Edwin M. Good, Giraffes, Black Dragons, and Other Pianos, Stanford University Press, tái bản lần 2, 2001; Cyril Ehrlich, The Piano: A History, Oxford University Press, 1990; David Rowland (chủ biên), The Cambridge Companion to the Piano, Cambridge University Press, 1998; Stuart Isacoff, A Natural History of the Piano, Knopf, 2011.'
  loai: lich-su
- trang: piano/lich-su-dan
  id: n70
  cau: 'Nguồn: Thư của Mozart gửi cha từ Augsburg, ngày 17/10/1777.'
  loai: lich-su
- trang: piano/lo-trinh
  id: n13
  cau: 'Dòng Đọc nhạc của chặng 1–6 (bài 4–8 ô nhịp, thị tấu dễ hơn bài đang tập khoảng hai cấp: Grade 1–2 ở chặng 3, Grade 2–3 ở chặng 4, Grade 3–4 ở chặng 5, Grade 5 ở chặng 6; đọc theo hình dạng quãng; nhìn trước vài nốt, xa dần nhưng hiếm khi tới trọn một ô nhịp; bốn tay, đệm, nhạc thính phòng).'
  loai: khuyen-tap
- trang: piano/nam-ngon
  id: n1
  cau: 'Những tuần đầu chơi piano có thể diễn ra trọn trong thế tay năm ngón: mỗi ngón đặt sẵn trên một phím, nên bạn không phải lo "ngón nào", và dồn được sự chú ý vào đọc nhạc, giữ nhịp, nghe tiếng đàn, và việc khó nhất: cho hai tay chơi cùng lúc.'
  loai: khuyen-tap
- trang: piano/nha-soan-nhac
  id: n2
  cau: 'Hộp "Đọc mức độ thế nào": "Grade 5" nghĩa là bản ấy (hay một chương, một bản trong tập) có trong đề cương thi piano của ABRSM ở Grade 5, các kỳ 2021–2022 đến 2025–2026; "Initial Grade" là cấp trước Grade 1.'
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n7
  cau: Phần lớn nhạc phím thời Baroque viết cho harpsichord, clavichord hay organ, chưa phải cho piano.
