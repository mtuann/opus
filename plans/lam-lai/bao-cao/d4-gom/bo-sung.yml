  cau: 'Hàng "Lặp một chuyển động quá lâu": một đoạn khó 30 phút liền, bài tập ngón hàng giờ; cùng một nhóm cơ và gân chịu tải liên tục; xen kẽ các việc, dùng bài tập ngón có liều lượng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n22
  cau: 'Khởi động nhẹ vài phút, mục đích là làm ấm chứ không phải kéo giãn: xoay vai, lắc tay, xoay cổ tay, thả rơi cánh tay, năm ngón hoặc gam chậm.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n26
  cau: 'Đa dạng buổi tập: xen phần "nặng" với phần "nhẹ"; chia đoạn nặng thành nhiều lần ngắn; việc không cần đàn như chạy bài trong đầu, phân tích, nghe bản thu vẫn là tập.'
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n32
  cau: Có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 và DS6.0 (quãng tám rộng 5,5 và 6 inch); PASK vận động để chúng phổ biến hơn và giữ danh sách những nơi làm loại bàn phím này.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n34
  cau: 'Vận động: BAPAM khuyên giữ thể lực bằng vận động nhịp điệu đều như bơi, đi bộ hay chạy; các môn dùng tạ và nắm tay chặt không hợp với người chơi piano.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n59
  cau: BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano); Musicians' Focal Dystonia; Returning to Playing.
