- trang: piano/lich-su-dan
  id: n3
  luot_2: dung
  nguon: ["https://www.metmuseum.org/art/collection/search/504534", "https://www.metmuseum.org/art/collection/search/501778"]
  ghi_chu: "Met: clavichord có bebung ('a form of vibrato'), 'very quiet compared to the harpsichord or piano', dùng cho luyện tập, giảng dạy, soạn nhạc, hợp tiếng nhỏ riêng tư. Phần 'sonata và fantasia của C. P. E. Bach rất hợp' là nhận định phổ biến (Bach ưa clavichord), nguồn đã mở không nói thẳng; không có gì mâu thuẫn."
- trang: piano/lich-su-dan
  id: n7
  luot_2: dung
  nguon: ["https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731", "https://www.britannica.com/art/harpsichord", "https://www.metmuseum.org/art/collection/search/504534"]
  ghi_chu: "Harpsichord: âm lượng không đổi theo lực phím (Britannica), phân biệt bằng register và hai tầng phím; clavichord đổi được theo lực nhưng 'very quiet' (Met); organ không đổi theo lực ngón. Met (Cristofori): harpsichord 'could not respond to the strength of the player's touch'."
- trang: piano/lich-su-dan
  id: n16
  luot_2: dung
  nguon: ["https://themorgan.org/node/1215376", "https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731"]
  ghi_chu: "Morgan Library ghi trang bìa bản in đầu 1741 (Balthasar Schmid, Nürnberg): 'Clavier Ubung ... vors Clavicimbal mit 2 Manualen'. Cách viết 'Clavicimbal mit 2 Manualen' khớp. Bach viết cho harpsichord, clavichord, organ là kiến thức chuẩn; không có nguồn mâu thuẫn."
- trang: piano/lich-su-dan
  id: n19
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano", "https://earlymusicstudio.com/library/fortepiano-after-johann-andreas-stein-1785/"]
  ghi_chu: "COD Music (encyclopedia.com, mục piano): đàn kiểu Vienna 'lighter, with less sonorous tone' so với đàn Anh; bản sao đàn Stein: búa nhỏ bọc da, tiếng 'sweet', không to."
- trang: piano/lich-su-dan
  id: n27
  luot_2: dung
  nguon: ["https://www.pizzicato.lu/a-replica-of-beethovens-last-grand-piano-to-be-realized/", "https://www.beethoven.de/en/media/view/5758857464774656", "https://greifenberger-institut.de/en/wissensvermittlung/besaitete-tasteninstrumente/tonumfaenge.php"]
  ghi_chu: "Beethoven-Haus: Graf cho mượn ngày 24/1/1826, 6½ quãng tám; Pizzicato: CC đến f4 (ký hiệu Helmholtz, tức Đô1–Fa7 theo cách ghi khoa học); Greifenberger: Graf C'–f4. Khớp."
- trang: piano/lich-su-dan
  id: n28
  luot_2: dung
  nguon: ["https://greifenberger-institut.de/en/wissensvermittlung/besaitete-tasteninstrumente/tonumfaenge.php", "https://www.beethoven.de/en/media/view/5758857464774656", "https://www.pizzicato.lu/a-replica-of-beethovens-last-grand-piano-to-be-realized/"]
  ghi_chu: "Greifenberger: Mozart (Stein/Walter) F'–f3 (Fa1–Fa6, 5 quãng tám); Broadwood của Beethoven 1808–1820 C'–c4 (Đô1–Đô7, 6 quãng tám); Graf C'–f4 (Đô1–Fa7, 6½). Piano hiện đại A0–C8 là chuẩn 88 phím. Lưu ý trang ấy không tách riêng Stein khỏi Walter."
- trang: piano/lich-su-dan
  id: n44
  luot_2: khong-chac
  nguon: ["https://www.britannica.com/art/piano", "https://matthewjamesrichards.co.uk/history_files/piano11.htm", "https://en.wikipedia.org/wiki/Giraffe_piano"]
  ghi_chu: "Hawkins 1800 Philadelphia: nguồn nói 'generally credited with inventing the upright piano proper in 1800' và Britannica gán cho ông kiểu dây dựng từ gần sàn, nhưng không nguồn nào nói 'thực thụ đầu tiên' tuyệt đối (có tiền lệ Del Mela 1739 theo Wikipedia, không nguồn). Mốc giraffe 'khoảng 1798' KHÔNG được xác nhận: Britannica ghi Giraffenflügel 1804 của Martin Seuffert (Vienna), Wikipedia 1805. Cần nguồn Good/Ehrlich hoặc nới thành 'khoảng đầu thập niên 1800'."
- trang: piano/lich-su-dan
  id: n49
  luot_2: dung
  nguon: ["https://www.fazioli.com/en/pianos"]
  ghi_chu: "Trang chính thức Fazioli: thành lập 1981 ở Sacile, đàn cánh từ F156 đến F308."
- trang: piano/lich-su-dan
  id: n51
  luot_2: dung
  nguon: ["https://www.boesendorfer.com/en/pianos/pianos/Concert-Grand-290-Imperial", "https://www.cunninghampiano.com/blogs/blog/bosendorfer-model-290-imperial"]
  ghi_chu: "Bösendorfer chính thức: Imperial 290 có 97 phím, '8 full octaves' thay vì 88. 97 phím = thêm 9 phím dưới A0, tức xuống Đô0 (Wikipedia Imperial: C0–C8, chỉ dùng để tìm nguồn). Câu nói 'một số' là an toàn."
- trang: piano/lich-su-dan
  id: n52
  luot_2: dung
  nguon: ["https://www.yamaha.com/en/about/history/", "https://kawaius.com/company/timeline"]
  ghi_chu: "Yamaha: 'Begins production of upright pianos' năm 1900. Kawai: Koichi Kawai lập công ty năm 1927 ở Hamamatsu."
- trang: piano/lich-su-dan
  id: n55
  luot_2: dung
  nguon: ["https://music.utexas.edu/events/4566-malcolm-bilson-fortepiano"]
  ghi_chu: "UT Austin: Bilson, giáo sư Cornell, 'helped bring the fortepiano back to the concert stage'; thu Mozart (concerto, sonata), Schubert, trọn bộ sonata Beethoven trên đàn cổ."
- trang: piano/lich-su-dan
  id: n60
  luot_2: dung
  nguon: ["https://www.britannica.com/art/piano"]
  ghi_chu: "Britannica: dây trầm đơn ('single-strung'), tenor và treble có 'two or three unison strings'."
- trang: piano/lich-su-dan
  id: n61
  luot_2: khong-chac
  nguon: ["https://www.britannica.com/art/piano", "https://www.hso.org/blog/restoring-the-hso-steinway", "https://www.troy.edu/student-life-resources/arts-culture/davis-theatre/technical-details/steinway-sons-concert-grand-model-d.html"]
  ghi_chu: "Britannica xác nhận 16 tấn (1862) và đến 30 tấn đàn hiện đại, khung gang. Không mở được nguồn nào ghi đúng 243 dây cho Steinway D (HSO chỉ 'more than 200'; Troy/Steinway: lực căng D 45.373 lb ≈ 20 tấn). Cần nguồn cho con số 243 hoặc chỉ ghi 'hơn 200'."
- trang: piano/lich-su-dan
  id: n65
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano", "https://earlymusicstudio.com/library/fortepiano-after-johann-andreas-stein-1785/", "https://www.popularbeethoven.com/?p=3222", "https://www.britannica.com/art/keyboard-instrument/Overstringing"]
  ghi_chu: "Các ý chính khớp: Vienna nhẹ hơn, ít sonorous; khung gỗ vs khung gang chịu lực căng cao; Britannica: bộ máy Anh 'deeper and heavier'. Ý giữ bàn đạp lâu ít nhòe: popularbeethoven nói đàn cổ 'shimmering yet controlled', đàn hiện đại 'louder, longer sustain', không nói rõ do tắt nhanh; phù hợp nhận định chung. 'Thường hai dây mỗi nốt' là chuẩn cho đàn Vienna, nguồn đã mở không nói thẳng."
- trang: piano/lich-su-dan
  id: n67
  luot_2: dung
  nguon: ["https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731", "https://www.ptg.org/teacher-resources/history-of-the-piano", "https://www.britannica.com/art/keyboard-instrument/Overstringing"]
  ghi_chu: "Met: Maffei 1711 gọi 'gravicembalo col piano, e forte'; harpsichord không đáp ứng lực chạm; PTG: bộ máy đàn cánh hiện đại 'derives ultimately from that invented by Erard in 1821' (double escapement, nốt lặp lại khi phím chưa nhả hết); Britannica: Érard repetition action. Phần đàn thời Mozart vs hiện đại khớp các mục trước."
- trang: piano/lich-su-dan
  id: n69
  luot_2: dung
  nguon: ["https://amis.mircat.org/jamis/2002_230.pdf", "https://academic.oup.com/book/49764", "https://www.cambridgebookshop.co.uk/products/the-cambridge-companion-to-the-piano", "https://openlibrary.org/works/OL16360487W"]
  ghi_chu: "Good: 2nd ed., Stanford UP, 2001 (JAMIS); Ehrlich: OUP 1990 (OUP Academic); Rowland (ed.): Cambridge Companion to the Piano, 1998 (nhà xuất bản Cambridge UP là kiến thức chuẩn, trang bán sách không ghi thẳng); Isacoff: Knopf 2011 (Open Library)."
- trang: piano/lich-su-dan
  id: n70
  luot_2: dung
  nguon: ["https://www.havergalbrian.org/zmozartpiano.htm"]
  ghi_chu: "Trang ghi thư viết từ Augsburg, 'dated October 17th, 1777', nói về đàn Stein; nguồn khác (Wikipedia/Stein, Met) xác nhận Mozart khen đàn Stein ở Augsburg 1777."
- trang: piano/ban-dap
  id: n2
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/soft-pedal", "https://www.popularbeethoven.com/?p=3222"]
  ghi_chu: "COD Music (soft pedal): pedal chân trái, giảm âm lượng 'by causing fewer than the normal number of strings to be struck, or by bringing the hammers nearer'. popularbeethoven: đàn cánh dịch bộ máy để mỗi nốt gõ ít dây hơn. 'Đổi màu' là mô tả chuẩn."
- trang: piano/ban-dap
  id: n7
  luot_2: dung
  nguon: ["https://www.popularbeethoven.com/?p=3222", "https://en.wikipedia.org/wiki/Piano_pedals"]
  ghi_chu: "popularbeethoven: sostenuto thường ở đàn cánh; bàn đạp giữa đàn đứng thường là practice pedal. Wikipedia (chỉ để tìm nguồn, trích Good 1982): true sostenuto hiếm trên đàn đứng trừ loại đắt như Steinway, Bechstein. Câu 'một số đàn đứng có sostenuto thật' khớp."
- trang: piano/ban-dap
  id: n9
  luot_2: dung
  nguon: ["https://www.metmuseum.org/essays/the-piano-the-pianofortes-of-bartolomeo-cristofori-1655-1731"]
  ghi_chu: "Met: 'The keyboards of the two other surviving pianos by Cristofori can be shifted slightly so that only one of the two strings of each pitch will be struck, i.e., una corda'; các đàn là 1722 (Rome) và 1726 (Leipzig)."
- trang: piano/ban-dap
  id: n10
  luot_2: dung
  nguon: ["https://faq.yamaha.com/usa/s/article/000025469", "https://en.wikipedia.org/wiki/Piano_pedals"]
  ghi_chu: "Yamaha FAQ: FC5, FC4A là công tắc on/off, FC3A là half-damper. Chung: bàn đạp đàn điện thường là công tắc đơn giản, loại tinh vi hơn phát tín hiệu half-pedaling."
- trang: piano/ban-dap
  id: n14
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano", "https://en.wikipedia.org/wiki/Piano_pedals"]
  ghi_chu: "COD Music: bàn đạp vang kéo dài âm, làm giàu tiếng nhờ 'sympathetic resonance'. Bàn đạp nhấc mọi bộ giảm âm, nên mọi dây cùng rung cộng hưởng giao cảm (Wikipedia trích Siepmann, chỉ để tìm nguồn). Khớp."
- trang: piano/ban-dap
  id: n15
  luot_2: dung
  nguon: ["https://markgoodwinpianos.co.uk/yamaha/top-register-no-dampers", "https://kawaius.com/faq/why-do-the-upper-notes-of-my-kawai-digital-piano-sustain-without-using-the-damper-pedal"]
  ghi_chu: "Kỹ thuật viên: 'top couple of octaves' không có giảm âm (đàn cánh cũng vậy); Kawai: dây các nốt cao nhất không gắn giảm âm. 'Cỡ hai quãng tám, tùy đàn' là hơi thoáng nhưng chấp nhận được (thực tế thường khoảng 1,5–2 quãng tám)."
- trang: piano/ban-dap
  id: n16
  luot_2: dung
  nguon: ["https://melaniespanswick.com/2015/05/19/perfect-pedalling/", "https://www.pianistmagazine.com/blogs/5-top-tips-to-help-with-pedalling/"]
  ghi_chu: "Half-pedalling: chỉ nhấn một phần, 'never pressed all the way down'; flutter/vibrato pedalling dùng chuyển động nhỏ, nhanh; đạp là động tác chia mức nông-sâu, không phải công tắc. Nguồn dạy đàn, không có nguồn bậc 2 nói trái."
- trang: piano/ban-dap
  id: n18
  luot_2: dung
  nguon: ["https://dev-dictionary.onmusic.org/terms/1020-damper_pedal", "https://music-encoding.org/guidelines/v4/attribute-classes/att.pedal.vis.html"]
  ghi_chu: "Từ điển: 'Ped.' là chỉ dẫn nhấn bàn đạp vang, dấu sao là chỗ nhả. MEI: kiểu pedstar, bounce (đổi bàn đạp) viết '* Ped.'; kiểu altpedstar bounce chỉ viết 'Ped.' (đúng quy ước 'một chữ Ped. mới = đổi'). Quy ước 'trên site này' là của site."
- trang: piano/ban-dap
  id: n19
  luot_2: khong-chac
  nguon: ["https://music-encoding.org/guidelines/v4/attribute-classes/att.pedal.vis.html", "https://dev-dictionary.onmusic.org/terms/1020-damper_pedal", "https://musescore.org/en/node/27136"]
  ghi_chu: "Đường kẻ có vạch dọc hai đầu: MEI xác nhận. Còn dấu gãy nhọn: MEI gọi là 'bounce' (nhả hẳn rồi nhấn lại = đổi bàn đạp), từ điển onmusic mô tả half-pedal là nhấn hết, nhả một phần rồi nhấn lại, MuseScore thì nói ^ là 'partial release'. Các nguồn khác nhau về việc ∧ là đổi bàn đạp hay nửa bàn đạp; nên nói 'nhả rồi nhấn lại (đổi bàn đạp)' và để 'nhả một phần' cho ký hiệu half-pedal riêng."
- trang: piano/ban-dap
  id: n37
  luot_2: dung
  nguon: ["https://melaniespanswick.com/2015/05/19/perfect-pedalling/", "https://www.pianistmagazine.com/blogs/5-top-tips-to-help-with-pedalling/"]
  ghi_chu: "Spanswick: direct pedalling (nhấn cùng ngón), anticipatory (nhấn trước khi chơi), half-pedalling/half-damping, flutter ('very quick, light, frequent'). Pianist: flutter 'rapidly oscillates up and down'. Khớp."
- trang: piano/ban-dap
  id: n44
  luot_2: dung
  nguon: ["https://earlymusicstudio.com/library/fortepiano-after-johann-andreas-stein-1785/", "https://www.havergalbrian.org/zmozartpiano.htm", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly"]
  ghi_chu: "Bản sao Stein 1785: cần gạt đầu gối nhấc cả dãy giảm âm, Mozart khen; thư 17/10/1777 nói về Stein. Mutopia (nguồn IMSLP) chương 1 K. 545: không có ký hiệu bàn đạp nào, chỉ dynamics, slur, trill. Khớp."
- trang: piano/ban-dap
  id: n46
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"]
  ghi_chu: "COD Music (mục piano): Beethoven 'was the first fully to profit by the opportunities afforded by the sustaining pedal'. Mục sustaining pedal chỉ nói ông 'said to make telling use'; nhận định theo mục piano là đúng chữ."
- trang: piano/ban-dap
  id: n48
  luot_2: dung
  nguon: ["https://www.popularbeethoven.com/?p=3222", "https://earlymusicstudio.com/library/fortepiano-after-johann-andreas-stein-1785/"]
  ghi_chu: "popularbeethoven: trên đàn cổ hiệu quả 'shimmering yet controlled', trên đàn hiện đại 'louder, longer sustain' dễ nhòe, giải pháp là nửa bàn đạp. Nguồn không nói rõ cơ chế tắt nhanh, nhưng nhất quán với nhận định (cách diễn đạt 'sương mỏng' là của site)."
- trang: piano/ban-dap
  id: n58
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/soft-pedal", "https://www.popularbeethoven.com/?p=3222", "https://faq.yamaha.com/usa/s/article/000025469"]
  ghi_chu: "Una corda đàn cánh dịch bộ máy; sostenuto giữ nhấc giảm âm của các phím đang giữ lúc đạp (popularbeethoven); đàn đứng: bàn đạp trái đưa búa lại gần dây (COD, popularbeethoven). Khớp."
- trang: piano/not-hoa-my
  id: n40
  luot_2: dung
  nguon: ["https://www.earlymusicamerica.org/web-articles/book-review-hummel-provides-invaluable-keyboard-advice/", "https://chopin-nationaledition.com/wp-content/uploads/2019/11/various-works_commentaries.pdf", "https://blog.henle.de/en/2015/04/27/about-the-difficulties-of-notating-ornamentation-%e2%80%93-the-riddle-of-a-neighbouring-trill-tone-in-chopin%e2%80%99s-berceuse/"]
  ghi_chu: "Hummel: 'unequivocal endorsement of commencing all trills on the main note', bản dịch Anh 1828. Ấn bản Quốc gia Chopin (Bolero, Allegro de Concert, Variations Op. 12...): nhiều chỗ 'begin from the main note', vài chỗ từ nốt trên. Henle: có tranh luận main note hay neighbouring note ở Chopin. Chỉ phần 'có nhà nghiên cứu cho rằng ông nhìn chung bắt đầu từ nốt trên' là chưa mở được nguồn cụ thể."
- trang: piano/not-hoa-my
  id: n43
  luot_2: dung
  nguon: ["https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html"]
  ghi_chu: "C. P. E. Bach, Versuch I.2.3 §5: láy rền thường 'always starts from the second above the main tone'; nốt trên rơi đúng phách là nốt nghịch tựa vào nốt chính theo cách đọc Baroque là mô tả chuẩn; chưa mở được chương OMT nói riêng."
- trang: piano/not-hoa-my
  id: n62
  luot_2: dung
  nguon: ["https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html", "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"]
  ghi_chu: "Bảng Bach 1720 (Clavier-Büchlein vor W. F. Bach, bản gõ MuseData): Trillo bắt đầu từ nốt trên (D5 cho C), đan xen nốt trên-chính; Versuch §5 trill bắt đầu từ nốt trên. Chi tiết 'bốn nốt trên nốt ngắn' là cách thực hiện thông dụng, không nguồn đã mở nói thẳng; không mâu thuẫn."
- trang: piano/not-hoa-my
  id: n67
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV988/bwv-988-aria/bwv-988-aria.ly"]
  ghi_chu: "Mutopia (nguồn IMSLP), Aria BWV 988: các ký hiệu láy rền, láy ngắt, láy quanh, nốt nhỏ xuất hiện ở khoảng 24 trên 32 ô tay phải; 'phần lớn các ô' đúng (số đếm do công cụ đọc web tóm tắt, mang tính ước lượng)."
- trang: piano/not-hoa-my
  id: n69
  luot_2: khong-chac
  nguon: ["https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat", "https://blog.henle.de/en/2015/04/27/about-the-difficulties-of-notating-ornamentation-%e2%80%93-the-riddle-of-a-neighbouring-trill-tone-in-chopin%e2%80%99s-berceuse/"]
  ghi_chu: "Trillo của bảng Bach 1720 bắt đầu từ nốt trên đúng phách (đúng). Nhưng phần 'ví dụ 3' (a, b, c, khối 7/8, nốt Mi ngân thêm, bốn nốt so với ba nốt) mô tả một khuông nhạc cụ thể, và 'giai điệu đi lên thì thường đọc như Trillo' là khái quát không có nguồn đã mở nói; cần đối chiếu khuông."
- trang: piano/not-hoa-my
  id: n73
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"]
  ghi_chu: "COD Music (gruppetto/turn): 'perf. after the note itself or instead of it' tùy ký hiệu đặt sau hay trên nốt; láy quanh đặt giữa hai nốt: chơi nốt chính rồi láy ở cuối giá trị nối vào nốt sau là cách đọc chuẩn."
- trang: piano/not-hoa-my
  id: n74
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"]
  ghi_chu: "COD Music: 'the inverted turn, which begins with the lower auxiliary note'; chuỗi dưới–chính–trên–chính là hình chuẩn."
- trang: piano/not-hoa-my
  id: n82
  luot_2: dung
  nguon: ["https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p13.html"]
  ghi_chu: "Versuch I.2.2 §13: 'invariable short appoggiaturas most frequently precede a short main note'; 'sometimes precede long notes when a note is repeated several times'. Khớp."
- trang: piano/not-hoa-my
  id: n89
  luot_2: dung
  nguon: ["https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf"]
  ghi_chu: "Chú giải Nocturnes (Op. 48 số 1): 'Separate wavy lines for chords played with the left and right hands need not denote simultaneous arpeggiation', nguyên tắc áp dụng cho các tác phẩm khác của Chopin. Quy ước đường lượn liền hai khuông và mũi tên xuống là chuẩn."
- trang: piano/not-hoa-my
  id: n95
  luot_2: dung
  nguon: ["https://www.oxfordlearnersdictionaries.com/us/definition/english/fioritura", "https://en.wikipedia.org/wiki/Fioritura"]
  ghi_chu: "Oxford Learner's: nốt trang trí ca sĩ thêm vào giai điệu, từ tiếng Ý 'flowering'; mục từ trích Oxford Companion to Music/Grove: florid embellishment, dài, phức tạp, khác láy rền/láy ngắt chuẩn; số nhiều fioriture. Liên hệ bel canto là hợp lý, nguồn đã mở không nói riêng về Chopin."
- trang: piano/not-hoa-my
  id: n96
  luot_2: dung
  nguon: ["https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf", "https://www.fabermusic.com/shop/the-complete-chopin-nocturne-in-e-flat-major-op-9-no-2-p462289"]
  ghi_chu: "Chú giải Quốc gia: Op. 9 số 2 có ba bộ biến thể Chopin viết vào bản của học trò và hai bản hoàn chỉnh; Faber: bản biến thể 'to have flowed from Chopin's pen after the work was first completed'."
- trang: piano/suc-khoe
  id: n17
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/the-healthy-pianist/", "https://www.bapam.org.uk/?p=59585"]
  ghi_chu: "BAPAM Healthy Pianist: tránh lặp lại kéo dài ('any technique involving repetition at the stretch for more than short periods'), tập 20 phút xen 10 phút nghỉ, thay đổi cách tập. Khớp tinh thần; con số 30 phút là ví dụ của site, không mâu thuẫn."
- trang: piano/suc-khoe
  id: n22
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/the-healthy-pianist/", "https://www.bapam.org.uk/?p=59541"]
  ghi_chu: "BAPAM: 'Warm up the muscles to bring a full supply of blood to the hands before practising'; kéo giãn nhẹ chỉ sau khi đã ấm (trang Musicians' Focal Dystonia). Khớp."
- trang: piano/suc-khoe
  id: n26
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên tập hợp lý và khớp BAPAM ('Vary practice as much as possible')."
- trang: piano/suc-khoe
  id: n32
  luot_2: dung
  nguon: ["https://paskpiano.org/", "https://paskpiano.org/manufacturers/", "https://paskpiano.org/about/"]
  ghi_chu: "PASK vận động DS5.5 và DS6.0 (DS6.5 là chuẩn, octave 6,5 inch); có trang 'Manufacturers' liệt kê nhà làm (Steingraeber, August Foerster ghi 'octave 6.0 và 5.5 inch'). Trang About không nêu thẳng 5,5/6 inch nhưng tên gọi và trang Manufacturers khớp."
- trang: piano/suc-khoe
  id: n34
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/the-healthy-pianist/"]
  ghi_chu: "BAPAM: 'regular aerobic activity such as swimming, walking or running'; 'sports involving weights and tight hand grip are not recommended for pianists'."
- trang: piano/suc-khoe
  id: n59
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/health-resources/", "https://www.bapam.org.uk/?p=59541"]
  ghi_chu: "Trang health resources của BAPAM liệt kê 'The Healthy Pianist', 'Musicians' Focal Dystonia', và 'Returning to Playing and Performance After a Rest or Recovery Period' (tên đầy đủ; 'Returning to Playing' là nhãn rút gọn trên trang)."
- trang: piano/quang-tam-buoc-nhay
  id: n19
  luot_2: dung
  nguon: ["https://trainorlab.mcmaster.ca/publications/pdfs/High%20voice%20superiority%20effect%20Hearing%20Research%202014.pdf"]
  ghi_chu: "Trainor và cộng sự, Hearing Research 2014: 'high voice superiority effect', người nghe xử lý bè cao nhất tốt hơn các bè thấp."
- trang: piano/quang-tam-buoc-nhay
  id: n31
  luot_2: dung
  nguon: ["https://www.britannica.com/art/stride-style", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/barcarolle"]
  ghi_chu: "Britannica: stride, tay trái đánh nốt trầm ở phách mạnh rồi hợp âm, lớn lên từ ragtime. Barcarolle là thuyền ca (gondolier Venice, 6/8 là đặc trưng nhịp chèo); valse 3/4 là chuẩn."
- trang: piano/quang-tam-buoc-nhay
  id: n41
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/the-healthy-pianist/"]
  ghi_chu: "BAPAM: 'Practise in twenty minute sessions, interspersed with ten minute breaks'; 'minimising tension between repetitive octaves or large chords'. Phần mf rồi mới thêm f là lời khuyên tập hợp lý."
- trang: piano/quang-tam-buoc-nhay
  id: n55
  luot_2: dung
  nguon: ["https://www.livingpianos.com/articles/how-to-play-legato-octaves-piano-lessons/", "https://www.pianistmagazine.com/5-top-tips-for-developing-legato-octaves", "https://trainorlab.mcmaster.ca/publications/pdfs/High%20voice%20superiority%20effect%20Hearing%20Research%202014.pdf"]
  ghi_chu: "Legato quãng tám tay phải: nối bè trên bằng ngón 4 và 5 (người tay lớn có khi dùng 3); ngón cái chỉ theo nhẹ. Chi tiết 'ngón cái trượt từ phím đen xuống phím trắng' là kỹ thuật phổ biến, nguồn đã mở không nói. Câu tai ưu tiên bè cao: Trainor 2014."
- trang: piano/tieng-dan
  id: n33
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sforzando"]
  ghi_chu: "COD Music: sforzando 'Direction that a note or chord be strongly accented or played in a forced manner', viết sf hoặc sfz, Beethoven dùng nhiều."
- trang: piano/tieng-dan
  id: n35
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/staccato"]
  ghi_chu: "COD Music: staccato là 'detached', nốt được rút ngắn (dấu chấm); không nói là nhấn mạnh hơn. Nhận định 'không nên to hơn' phù hợp."
- trang: piano/tieng-dan
  id: n38
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sforzando"]
  ghi_chu: "COD Music: nốt hay hợp âm được nhấn mạnh; mức nổi trong câu p là quyết định nghe theo câu nhạc, không mâu thuẫn."
- trang: piano/tieng-dan
  id: n72
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sforzando"]
  ghi_chu: "COD Music: sforzando, viết sf hoặc sfz; khớp quiz."
- trang: piano/gam
  id: n8
  luot_2: dung
  nguon: ["https://www.pianoscales.org/fingerings.html", "https://www.pianoscales.org/major.html", "https://www.pianoscales.org/minor-harmonic.html"]
  ghi_chu: "PianoScales: 'avoid playing on the black keys with your thumb'. B trưởng tay trái 4 3 2 1 4 3 2 1 (bắt đầu 4 ở Si, 4 ở Fa♯, Si quãng sau là 1). Các bảng gam thứ hòa âm đối chiếu: ngón cái luôn rơi phím trắng. Quy tắc 'ngón 4 một lần mỗi quãng tám' là khái quát thông dụng, trang không nói thẳng."
- trang: piano/gam
  id: n13
  luot_2: dung
  nguon: ["https://www.pianoscales.org/major.html"]
  ghi_chu: "PianoScales: B trưởng tay phải 1 2 3 1 2 3 4 (như Đô trưởng), tay trái 4 3 2 1 4 3 2 1; Si♭ trưởng tay phải 2 1 2 3 1 2 3 4, tức bắt đầu bằng ngón 2 và Si♭ quãng tám sau là 4. Khớp."
- trang: piano/gam
  id: n16
  luot_2: dung
  nguon: ["https://www.pianoscales.org/minor-harmonic.html", "https://www.pianoscales.org/minor.html"]
  ghi_chu: "PianoScales gam thứ hòa âm tay phải: Fa♯ thứ 2 3 1 2 3 1 2 3; Sol♯ thứ 2 3 1 2 3 1 2 3; Si♭ thứ 2 1 2 3 1 2 3 4. Khớp (khác kiểu 3 4 ở hai nốt đầu)."
- trang: piano/bai-tap-ngon
  id: n6
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/?p=59585"]
  ghi_chu: "BAPAM Healthy Pianist: 'avoid lifting or curling the fingers excessively'; 'After playing the note, there is nothing to be gained musically or technically from continuing pressure on the keybed'; cổ tay ở vị trí trung tính, không khóa. Khớp."
- trang: piano/bai-tap-ngon
  id: n39
  luot_2: dung
  nguon: ["https://imslp.org/wiki/51_Exercises,_WoO_6_(Brahms,_Johannes)"]
  ghi_chu: "IMSLP: 51 Exercises (51 Übungen), WoO 6, sáng tác 'ca. 1850–93', in lần đầu 12/1893."
- trang: piano/cach-tap
  id: n33
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/the-healthy-pianist/"]
  ghi_chu: "BAPAM: 'twenty minute sessions, interspersed with ten minute breaks'. Phép tính 45 phút một lần nghỉ, 90 phút ba lần là hợp lý."
- trang: piano/cach-tap
  id: n56
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/the-healthy-pianist/"]
  ghi_chu: "Trang bapam.org.uk 'The Healthy Pianist' (tờ thông tin của BAPAM, tác giả Penelope Roskell và Hara Trouli) tồn tại."
- trang: piano/hoa-am/ket
  id: n17
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/"]
  ghi_chu: "OMT: IAC là kết V–I trong đó 'do (1̂) is not in the soprano over the tonic triad', bè trên có thể là mi (3̂) hay sol (5̂); PAC cần 1̂ và cả hai hợp âm ở thế gốc. Khớp."
- trang: piano/hoa-am/ket
  id: n27
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cadenza", "https://viva.pressbooks.pub/openmusictheory/chapter/cadential-64/"]
  ghi_chu: "COD Music (cadenza): cadenza của concerto bắt đầu sau hợp âm 'the 2nd inversion of the tonic chord' (I6/4, nhóm đầu của kết chuẩn); OMT: cadential 6/4 là nốt tô điểm của V."
- trang: piano/nam-ngon
  id: n1
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên tập, hợp cách dạy phổ biến."
