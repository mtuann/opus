- trang: piano/not-hoa-my
  id: n1
  cau: Nốt hoa mỹ là những nốt trang trí được ghi tắt bằng một ký hiệu hoặc bằng nốt nhỏ.
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n2
  cau: Cùng một ký hiệu có thể được chơi khác nhau tùy thời kỳ và tùy nhà soạn nhạc.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n3
  cau: Một láy rền hay một appoggiatura rơi vào phách mạnh tạo ra một nốt nghịch rồi mới giải quyết, như một từ được nhấn giọng.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n4
  cau: Trên đàn harpsichord, vốn gần như không đổi được độ to, đây là một trong những cách nhấn chủ yếu.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n5
  cau: 'Giữ cho nốt dài còn sống: tiếng harpsichord và piano thời đầu tắt nhanh; một láy rền làm nốt dài tiếp tục rung.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n6
  cau: Láy rền ở nốt áp chót của câu là dấu hiệu quen thuộc của kết trong nhạc Baroque và Cổ điển.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n7
  cau: Nhạc piano thế kỷ 19, nhất là của Chopin, bắt chước những đường luyến láy của ca sĩ opera.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n8
  cau: Thời Baroque, người chơi được trông đợi tự thêm nốt hoa mỹ.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n9
  cau: Quy ước nốt hoa mỹ khác nhau theo từng nước, có khi theo từng nhà soạn nhạc.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n10
  cau: Nhiều tập nhạc Pháp in kèm bảng giải thích ký hiệu ngay ở đầu.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n11
  cau: Càng về sau, nhà soạn nhạc càng ghi chính xác hơn, nhiều khi viết đủ từng nốt.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n12
  cau: Vì vậy hãy học nốt hoa mỹ từ một bản Urtext. Ấn bản Urtext tách bạch ký hiệu của tác giả với phần người biên tập thêm vào (thường in trong ngoặc hoặc in nhỏ).
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n13
  cau: Các ấn bản "có hướng dẫn" thêm cách hiểu của người biên tập.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n15
  cau: 'Bảng chặng trong lộ trình: chặng 3 (≈ Grade 3) học láy, appoggiatura đơn giản; chặng 4 (≈ Grade 4–5) láy rền Baroque bắt đầu từ nốt trên; chặng 5 (≈ Grade 6) láy rền có nốt kết (Mozart K. 545); chặng 6 (≈ Grade 7–8) fioritura và trang trí kiểu Chopin.'
  loai: cap-do
- trang: piano/not-hoa-my
  id: n16
  cau: Ngày 22 tháng 1 năm 1720, ở Köthen, Johann Sebastian Bach bắt đầu một cuốn sổ dạy đàn cho con trai cả là Wilhelm Friedemann.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n17
  cau: 'Khi ấy Wilhelm Friedemann chín tuổi (câu hai lần trên trang: "khi ấy chín tuổi" và "một cậu bé chín tuổi").'
  loai: nam
- trang: piano/not-hoa-my
  id: n18
  cau: 'Tên cuốn sổ: Clavier-Büchlein vor Wilhelm Friedemann Bach.'
  loai: ten
- trang: piano/not-hoa-my
  id: n19
  cau: 'Ngay sau trang giải thích khóa nhạc là bảng Explication unterschiedlicher Zeichen… ("giải thích các ký hiệu…"): mười ba kiểu nốt hoa mỹ, mỗi kiểu kèm cách chơi viết đủ nốt.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n20
  cau: Cũng cuốn sổ này chứa bản đầu tiên của các Invention, trong đó có Invention số 1.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n21
  cau: 'Bảng Bach, hàng Trillo (răng cưa ngắn): Rê–Đô–Rê–Đô…, bắt đầu từ nốt trên; gọi ngày nay là láy rền.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n22
  cau: 'Bảng Bach, hàng Mordant (răng cưa có gạch dọc): Đô–Si–Đô; gọi ngày nay là láy dưới (mordent).'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n23
  cau: 'Bảng Bach, hàng Trillo und Mordant: láy rền kết bằng Si–Đô; gọi ngày nay là láy rền có nốt kết.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n24
  cau: 'Bảng Bach, hàng Cadence (∽): Rê–Đô–Si–Đô; gọi ngày nay là láy quanh.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n25
  cau: 'Bảng Bach, hàng Doppelt-Cadence (hai kiểu): láy quanh, từ trên hoặc từ dưới, nối vào láy rền.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n26
  cau: 'Bảng Bach, hàng Doppelt-Cadence und Mordant (hai kiểu): như trên, kết bằng Si–Đô.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n27
  cau: 'Bảng Bach, hàng Accent steigend, Accent fallend: Si rồi Đô; Rê rồi Đô (nốt phụ rơi vào phách); gọi ngày nay là appoggiatura từ dưới, từ trên.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n28
  cau: 'Bảng Bach, hàng Accent und Mordant và Accent und Trillo: appoggiatura nối vào láy dưới hoặc láy rền.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n29
  cau: 'Ba điều rút ra từ bảng: láy rền bắt đầu từ nốt trên; ký hiệu răng cưa không gạch là một láy rền ngắn, có gạch là chính–dưới–chính; láy quanh đặt trên nốt bắt đầu từ nốt trên.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n30
  cau: 'Bảng viết cho một cậu bé nên rất gọn: nó không nói chơi bao nhiêu nốt, nhanh đến đâu, khi nào được phép làm khác.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n31
  cau: Frederick Neumann (1978) đặt câu hỏi về các quy tắc cứng nhắc trong cách chơi nốt hoa mỹ thời Baroque, vì nhạc công thời đó có nhiều tự do hơn.
  loai: lich-su
- trang: piano/not-hoa-my
  id: n32
  cau: 'Láy rền (trill) là hai nốt luân phiên thật nhanh: nốt chính và nốt liền trên theo hóa biểu.'
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n33
  cau: Ký hiệu của láy rền là chữ tr, thường kèm một đường lượn sóng cho biết láy rền kéo đến đâu.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n34
  cau: Một dấu hóa nhỏ cạnh chữ tr áp dụng cho nốt trên.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n35
  cau: Thời Baroque (Bach, Handel), láy rền bắt đầu từ nốt trên, đúng phách; C. P. E. Bach (1753) nói láy rền "luôn bắt đầu từ nốt trên".
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n36
  cau: 'Ngoại lệ ở thời Baroque: nốt trên vừa vang ngay trước đó (giai điệu đi xuống liền bậc) thì được nối sang, không đánh lại.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n37
  cau: Thời Cổ điển (Haydn, Mozart), láy rền phần lớn vẫn bắt đầu từ nốt trên.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n38
  cau: Một nốt nhỏ đứng ngay trước dấu tr cho biết rõ nốt bắt đầu của láy rền (thời Cổ điển).
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n39
  cau: 'Đầu thế kỷ 19 (Beethoven, Schubert) là vùng chuyển tiếp: cần đọc chú giải của bản Urtext, xét từng chỗ.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n40
  cau: Thời Lãng mạn (Chopin, Schumann, Liszt), láy rền ngày càng thường bắt đầu từ nốt chính.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n41
  cau: Hummel khuyên bắt đầu mọi láy rền từ nốt chính.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n42
  cau: Hummel trình bày điều đó trong bộ sách dạy piano in ở Vienna năm 1827–1828.
  loai: nam
- trang: piano/not-hoa-my
  id: n43
  cau: 'Lý do của quy tắc Baroque: nốt trên rơi đúng phách là một nốt nghịch tựa vào nốt chính, giống một appoggiatura được nhắc lại thật nhanh; bắt đầu từ nốt chính, láy rền mất đi sức nặng ấy và chỉ còn là một tiếng rung.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n44
  cau: 'Láy rền thường khép lại bằng nốt kết (tiếng Đức Nachschlag): nốt liền dưới rồi nốt chính, dẫn vào nốt tiếp theo.'
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n45
  cau: Nốt kết có thể được viết bằng hai nốt nhỏ, bằng nốt thường (như láy rền ở ô 4 của sonata K. 545), hoặc không được viết.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n46
  cau: C. P. E. Bach dặn rằng láy rền trên một nốt khá dài thì luôn có nốt kết, láy rền ở cuối bài hay trên dấu ngân cũng vậy; còn với nốt ngắn, nốt kết hợp với giai điệu đi lên một bậc hơn là đi xuống.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n47
  cau: 'Số nốt của láy rền không cố định: tùy tốc độ, độ dài nốt và tính cách đoạn nhạc; trên nốt ngắn ở tốc độ nhanh có khi chỉ còn bốn nốt.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n48
  cau: Toàn móc ba (tám nốt cho một nốt đen) ở ♩ = 60 là một cách chốt số nốt khi mới học.
  loai: so-lieu
- trang: piano/not-hoa-my
  id: n52
  cau: Phím không cần trồi lên hết mới đánh lại được, nhất là trên đàn grand.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n54
  cau: 'Ví dụ 1: nốt trên (Mi) rơi đúng phách cùng nốt trầm Sol; láy rền kéo hết giá trị nốt trắng rồi giải quyết về Đô.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n55
  cau: 'Ví dụ 2: hai nốt kết Sol–La được viết bằng nốt thường, dẫn lên Si; khối "chơi" cho hai cách: từ nốt trên như thời Cổ điển, rồi từ nốt chính như thế kỷ 19.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n57
  cau: 'Láy trên và láy dưới là hai ký hiệu răng cưa: không gạch và có gạch dọc.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n58
  cau: 'Chữ "mordent" đã đổi nghĩa theo thời gian: thời Bach, Mordant là ký hiệu có gạch (chính–dưới–chính); sang thế kỷ 19, nhiều người dùng chữ ấy cho ký hiệu không gạch.'
  loai: lich-su
- trang: piano/not-hoa-my
  id: n59
  cau: Tiếng Anh còn có tên inverted mordent, nhưng sách này dùng nó cho ký hiệu này, sách kia cho ký hiệu kia.
  loai: ten
- trang: piano/not-hoa-my
  id: n60
  cau: Láy trên (răng cưa ngắn, không gạch) còn gọi là Pralltriller, Schneller, upper mordent.
  loai: ten
- trang: piano/not-hoa-my
  id: n61
  cau: Trong nhạc từ thế kỷ 19, láy trên chơi chính–trên–chính, rất nhanh, đúng phách.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n62
  cau: 'Trong nhạc Baroque, láy trên là một láy rền ngắn (Trillo của Bach), thường từ nốt trên: trên–chính–trên–chính.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n63
  cau: 'Láy dưới: chính–dưới–chính trong cả nhạc Baroque và nhạc từ thế kỷ 19, đúng phách.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n64
  cau: 'Giai điệu đi xuống liền bậc tới nốt có láy trên (rất hay gặp): nốt trên vừa vang ngay trước nên được nối sang mà không đánh lại; kết quả nghe gần giống chính–trên–chính; C. P. E. Bach gọi kiểu này là Pralltriller, "láy rền nửa", và nhấn mạnh phải sắc và ngắn.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n65
  cau: 'Giai điệu đi lên tới nốt có ký hiệu láy trên: không có gì để nối, nên láy bắt đầu từ nốt trên, đúng phách.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n66
  cau: Trong bản Bach-Gesellschaft của Invention số 1, nốt Si móc đơn ở ô 1 mang ký hiệu không gạch và đi xuống từ nốt Đô ngay trước nó; bài này cũng có ký hiệu có gạch.
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n67
  cau: Aria mở đầu Biến khúc Goldberg gần như ô nào cũng có nốt hoa mỹ.
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n68
  cau: Một dấu hóa nhỏ đặt trên hoặc dưới ký hiệu láy áp dụng cho nốt phụ.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n69
  cau: 'Ví dụ 3: (a) đi xuống tới nốt có láy trên, (b) đi lên, (c) láy dưới; đọc theo thế kỷ 19 hai khối "chơi" gần giống nhau ở (a), nốt Mi ngân thêm vào phách; (b) bốn nốt từ Mi so với ba nốt từ Rê.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n71
  cau: 'Láy quanh (turn), ký hiệu như chữ S nằm ngang, gồm bốn nốt quanh nốt chính: trên – chính – dưới – chính.'
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n72
  cau: Láy quanh đặt ngay trên nốt bắt đầu ngay, đúng phách; đây là Cadence trong bảng của Bach.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n73
  cau: 'Láy quanh đặt giữa hai nốt: chơi nốt chính trước, rồi láy quanh ở cuối giá trị của nốt đó và nối thẳng vào nốt sau; kiểu này rất hay gặp trong giai điệu Cổ điển và Lãng mạn.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n74
  cau: 'Láy quanh ngược (ký hiệu có gạch dọc, hoặc lộn ngược) bắt đầu từ nốt dưới: dưới – chính – trên – chính.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n75
  cau: Dấu hóa nhỏ phía trên ký hiệu láy quanh áp dụng cho nốt trên, phía dưới cho nốt dưới.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n77
  cau: 'Ví dụ 4: láy quanh trên nốt Fa và giữa hai nốt Mi–Fa; khối "chơi" viết g f e f, g/f/e/f/, và láy quanh ngược e f g f.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n78
  cau: 'Appoggiatura (tiếng Ý appoggiare: tựa vào), còn gọi là nốt dựa.'
  loai: ten
- trang: piano/not-hoa-my
  id: n79
  cau: Appoggiatura thường viết bằng nốt nhỏ không gạch, có dấu luyến tới nốt chính; rơi đúng phách và lấy thời gian của nốt chính.
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n80
  cau: Appoggiatura là nốt nghịch nên được nhấn, rồi nốt chính giải quyết nhẹ hơn, như một tiếng thở dài.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n81
  cau: Trước một nốt chia đôi được (nốt đen, nốt trắng…), appoggiatura lấy một nửa giá trị; trước một nốt có chấm dôi lấy hai phần ba, nốt chính chỉ còn lại giá trị của dấu chấm; quy tắc của C. P. E. Bach (1753) và nhiều sách thế kỷ 18.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n82
  cau: 'Không phải nốt nhỏ không gạch nào cũng dài: trước nốt nhanh, trước nốt lặp lại, hoặc ở tốc độ nhanh, nhiều nốt dựa được chơi ngắn.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n83
  cau: 'Acciaccatura (tiếng Ý: "giập, nghiền") là nốt nhỏ có gạch chéo, ngắn hết mức có thể; trọng âm rơi vào nốt chính.'
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n84
  cau: Trong nhạc đàn phím thế kỷ 18, acciaccatura có khi còn được đánh cùng lúc với nốt chính rồi nhả ngay.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n85
  cau: Đặt acciaccatura đúng phách hay ngay trước phách là chuyện phong cách và vẫn còn được tranh luận.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n86
  cau: 'Bảng so sánh appoggiatura và acciaccatura: hình, thời điểm, độ dài, trọng âm.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n87
  cau: 'Ví dụ 5: ô 1 nốt dựa Mi trước nốt trắng Rê lấy một nốt đen; ô 2 nốt dựa Si trước nốt trắng chấm dôi Đô lấy hai phần ba, Đô còn một phách; ô 3 acciaccatura Fa♯ ngắn hết mức, trọng âm vào Sol.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n88
  cau: 'Một đường lượn sóng thẳng đứng trước hợp âm nghĩa là rải hợp âm: chơi lần lượt từ nốt thấp nhất lên, rất nhanh, và giữ các nốt lại.'
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n89
  cau: 'Đường lượn sóng liền qua cả hai khuông: rải một lần từ nốt thấp nhất của tay trái lên nốt cao nhất của tay phải; hai đường riêng cho hai tay: rải cùng lúc; có mũi tên chỉ xuống: rải từ trên xuống.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n90
  cau: Trong nhạc Baroque và Cổ điển, nốt thấp nhất của hợp âm rải thường rơi đúng phách.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n91
  cau: Với Chopin, chú giải của ấn bản Quốc gia Ba Lan khuyên bắt đầu hợp âm rải cùng lúc với nốt tương ứng của tay trái.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n94
  cau: 'Ví dụ 6: hợp âm được rải chậm (mỗi nốt cách nhau một móc kép); khối "chơi" cho nốt thấp nhất vào đúng phách, các nốt được giữ lại.'
  loai: cau-truc
- trang: piano/not-hoa-my
  id: n95
  cau: 'Fioritura (tiếng Ý: "nở hoa"; số nhiều fioriture) là những chùm nốt trang trí dài, viết bằng nốt nhỏ hoặc thành những nhóm không chia đều (7, 11, 22 nốt… trên một phách của tay trái), bắt chước lối luyến láy của ca sĩ bel canto.'
  loai: dinh-nghia
- trang: piano/not-hoa-my
  id: n96
  cau: Chopin thường đổi chúng mỗi lần chơi; một số biến thể do chính ông viết còn được giữ lại (Nocturne Op. 9 số 2).
  loai: lich-su
- trang: piano/not-hoa-my
  id: n97
  cau: Theo chú giải của ấn bản Quốc gia Ba Lan, hợp âm rải và những nốt nhỏ tạo thành hợp âm rải hay quãng rải, theo lệ chung, bắt đầu đúng phách; một nhóm vài nốt nhỏ có hai cách chơi, đúng phách hoặc trước phách.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n98
  cau: Với láy rền của Chopin, một nốt nhỏ cùng cao độ với nốt chính đứng ngay trước dấu tr cho biết láy bắt đầu từ nốt chính.
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n102
  cau: 'Quiz 1: trong bảng ký hiệu năm 1720 của Bach, láy rền (Trillo) bắt đầu từ nốt trên; Bach viết Rê–Đô–Rê–Đô… cho nốt chính Đô; C. P. E. Bach (1753) cũng nói láy rền luôn bắt đầu từ nốt trên.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n103
  cau: 'Quiz 2: ký hiệu răng cưa ngắn có gạch dọc chơi chính–dưới–chính; đó là láy dưới, Mordant trong bảng của Bach.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n104
  cau: 'Quiz 3: theo quy tắc thế kỷ 18, appoggiatura trước nốt có chấm dôi lấy hai phần ba giá trị, nốt chính chỉ còn lại giá trị của dấu chấm.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n105
  cau: 'Quiz 4: láy quanh đặt giữa hai nốt được chơi bằng cách chơi nốt chính trước, láy quanh ở cuối giá trị của nó rồi nối vào nốt sau; chỉ khi ký hiệu nằm ngay trên nốt thì láy quanh bắt đầu đúng phách.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n106
  cau: 'Quiz 5: trong nhạc Chopin, một nốt nhỏ cùng cao độ với nốt chính đứng ngay trước dấu tr cho biết láy rền bắt đầu từ nốt chính; lời giải thích cũ nói nếu nốt nhỏ ở trên thì láy bắt đầu từ nốt trên.'
  loai: quy-tac
- trang: piano/not-hoa-my
  id: n107
  cau: 'Mục Nguồn: Bach, Clavier-Büchlein (bắt đầu ở Köthen 22/1/1720), bản chụp trên IMSLP.'
  loai: lich-su
- trang: piano/not-hoa-my
  id: n108
  cau: 'Mục Nguồn: C. P. E. Bach, Versuch (phần 1 năm 1753, phần 2 năm 1762), bản điện tử song ngữ tại versuch.cpebach.org.'
  loai: lich-su
- trang: piano/not-hoa-my
  id: n109
  cau: 'Mục Nguồn: Türk, Klavierschule (1789).'
  loai: nam
- trang: piano/not-hoa-my
  id: n110
  cau: 'Mục Nguồn: Hummel, Ausführliche theoretisch-practische Anweisung zum Piano-Forte-Spiel (Vienna: Haslinger, 1827–1828).'
  loai: nam
- trang: piano/not-hoa-my
  id: n111
  cau: 'Mục Nguồn: Neumann, Ornamentation in Baroque and Post-Baroque Music, with Special Emphasis on J. S. Bach (Princeton University Press, 1978).'
  loai: nam
- trang: piano/not-hoa-my
  id: n112
  cau: 'Mục Nguồn: Rosenblum, Performance Practices in Classic Piano Music (Indiana University Press, 1988).'
  loai: nam
- trang: piano/not-hoa-my
  id: n113
  cau: 'Mục Nguồn: Eigeldinger, Chopin: Pianist and Teacher as Seen by His Pupils (Cambridge University Press, 1986).'
  loai: nam
- trang: piano/not-hoa-my
  id: n114
  cau: 'Mục Nguồn: Fryderyk Chopin, Wydanie Narodowe (chủ biên Jan Ekier), các phần chú giải biểu diễn tại chopin-nationaledition.com.'
  loai: ten
- trang: piano/not-hoa-my
  id: n101
  cau: 'Mục "Tập nốt hoa mỹ thế nào": quyết định cách chơi trước rồi viết bằng bút chì; tập chậm với đúng số nốt; nhẹ hơn nốt chính (trừ appoggiatura); giữ nhịp, lỗi phổ biến nhất là "dừng lại để láy"; ít mà sạch; nghe đúng phong cách (Bach trên harpsichord, Mozart trên fortepiano, ca sĩ trước khi chơi Chopin).'
  loai: khuyen-tap
- trang: piano/not-hoa-my
  id: n99
  cau: 'Với chùm nốt dài của Chopin, điều quan trọng hơn cả là những điểm gặp nhau với tay trái; bốn bước: học giai điệu khung, đánh dấu điểm khớp, tập riêng chùm cho đều rồi ghép chậm, tạo dáng và giữ chùm nhỏ hơn giai điệu.'
  loai: khuyen-tap
- trang: piano/not-hoa-my
  id: n49
  cau: Khi mới học, hãy chốt một con số, ghi bằng bút chì, tập đúng như thế; khi đã chắc, láy rền dài có thể tự do hơn, bắt đầu thong thả rồi nhanh dần; điều không được phép là làm trễ phách sau.
  loai: khuyen-tap
- trang: piano/tieng-dan
  id: n2
  cau: 'Tiếng đàn khác nhau giữa hai người chơi đến từ vài thứ người chơi điều khiển được: tốc độ phím đi xuống, thời điểm nhả phím, độ to tương đối giữa các nốt vang cùng lúc, và bàn đạp.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n3
  cau: Khi bấm phím, búa bọc nỉ tách khỏi cơ cấu ngay trước khi chạm dây (cơ chế thoát, escapement), bay tự do, đập dây rồi bật ra; từ đó người chơi không còn tác động lên nốt nữa, chỉ còn giữ (phím hoặc bàn đạp) hoặc dừng (nhả phím, búa chặn rơi xuống dây).
  loai: cau-truc
- trang: piano/tieng-dan
  id: n4
  cau: Độ to phụ thuộc vào tốc độ búa, tức tốc độ phím đi xuống, không phải lực ấn vào đáy phím; ấn thêm sau khi nốt đã kêu không làm nốt to hơn.
  loai: quy-tac
- trang: piano/tieng-dan
  id: n5
  cau: 'Nốt càng to càng sáng: búa đập càng nhanh, nỉ càng cứng lại khi chạm dây và tạo nhiều bồi âm cao.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n8
  cau: Mọi nốt piano đều nhỏ dần ngay sau khi đánh.
  loai: quy-tac
- trang: piano/tieng-dan
  id: n10
  cau: 'Bảng "Bạn điều khiển / Người nghe nhận ra", hàng 1: tốc độ phím đi xuống quyết định to hay nhỏ, phần nào sáng hay tối.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n11
  cau: 'Bảng, hàng 2: thời điểm bấm quyết định tiết tấu, nhấn nhá, rubato.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n12
  cau: 'Bảng, hàng 3: thời điểm nhả quyết định độ dài nốt: legato, staccato, ngắt câu.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n13
  cau: 'Bảng, hàng 4: độ to tương đối giữa các nốt vang cùng lúc tạo cân bằng: giai điệu nổi, phần đệm lùi.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n14
  cau: 'Bảng, hàng 5: bàn đạp quyết định độ vang, độ nối, màu âm thanh.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n16
  cau: Đây là thói quen quan trọng nhất để chơi lâu mà không mỏi (xem Giữ đôi tay khỏe và Tư thế, thế tay).
  loai: quy-tac
- trang: piano/tieng-dan
  id: n18
  cau: Legato (thường ghi bằng dấu luyến) nghĩa là các nốt nối nhau không hở.
  loai: dinh-nghia
- trang: piano/tieng-dan
  id: n20
  cau: Ở giai điệu chậm, nhiều nghệ sĩ cho hai nốt chồng nhau một chút (legatissimo) để câu hát liền hơn.
  loai: quy-tac
- trang: piano/tieng-dan
  id: n23
  cau: Trượt ngón là cách nối mà Chopin dùng nhiều.
  loai: lich-su
- trang: piano/tieng-dan
  id: n25
  cau: 'Khối abc 1: đi hết một quãng tám legato nhờ đổi ngón 4 thành 1 trên nốt Fa đang ngân.'
  loai: cau-truc
- trang: piano/tieng-dan
  id: n26
  cau: Staccato là nốt ngắn, có khoảng lặng phía sau.
  loai: dinh-nghia
- trang: piano/tieng-dan
  id: n29
  cau: 'Bảng: staccatissimo ký hiệu bằng dấu nêm, rất ngắn và sắc.'
  loai: ten
- trang: piano/tieng-dan
  id: n30
  cau: 'Bảng: portato (mezzo-staccato) ghi bằng chấm dưới dấu luyến, hơi tách.'
  loai: ten
- trang: piano/tieng-dan
  id: n31
  cau: 'Bảng: tenuto ghi bằng gạch ngang, giữ đủ giá trị.'
  loai: ten
- trang: piano/tieng-dan
  id: n32
  cau: 'Bảng: accent ký hiệu >, nhấn rõ hơn nốt xung quanh.'
  loai: ten
- trang: piano/tieng-dan
  id: n33
  cau: 'Bảng: sforzando ghi sf hoặc sfz, nhấn đột ngột so với ngữ cảnh; Beethoven dùng rất nhiều.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n34
  cau: 'Khối abc 2: cùng bốn nốt Đô–Rê–Mi–Fa, năm cách phát âm (legato, staccato, portato, tenuto, accent).'
  loai: cau-truc
- trang: piano/tieng-dan
  id: n35
  cau: Staccato thường nhẹ hơn legato cùng ký hiệu sắc thái vì ngắn và không có thời gian vang.
  loai: quy-tac
- trang: piano/tieng-dan
  id: n36
  cau: 'Hộp ghi chú dấu chấm hay dấu nêm: trong nhạc thế kỷ 18 hai dấu không phải lúc nào cũng phân biệt rõ, người soạn, người chép và nhà in dùng không thống nhất.'
  loai: lich-su
- trang: piano/tieng-dan
  id: n38
  cau: 'Hộp cảnh báo sf: sf là nhấn tương đối, trong câu p có khi chỉ to cỡ mf.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n39
  cau: Đánh mọi sf như ff là lỗi rất phổ biến khi chơi Beethoven.
  loai: quy-tac
- trang: piano/tieng-dan
  id: n40
  cau: 'Trong nhạc Cổ điển, dấu luyến trước hết là dấu phát âm: nốt dưới dấu luyến nối liền, nốt đầu hơi nặng hơn, nốt cuối nhẹ và hơi ngắn lại, rồi có một khoảng ngắt nhỏ trước nốt tiếp theo.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n41
  cau: 'Türk mô tả trong sách dạy đàn phím năm 1789: nốt mở đầu dấu luyến được nhấn rất nhẹ'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n43
  cau: 'Khối abc 3: dấu luyến hai nốt trên bốn ô, tay phải e–d, f–e, a–g, d–c, tay trái G, C, C, G–C.'
  loai: cau-truc
- trang: piano/tieng-dan
  id: n47
  cau: Chậm quá thì búa không tới dây và nốt "câm"; tập ranh giới đó, nốt nhỏ nhất mà vẫn kêu.
  loai: quy-tac
- trang: piano/tieng-dan
  id: n48
  cau: 'Khối abc 4: thang năm mức pp–ff trên một nốt Mi (mỗi mức bốn lần), rồi to dần và nhỏ dần trên gam Đô trưởng.'
  loai: cau-truc
- trang: piano/tieng-dan
  id: n50
  cau: Cân bằng (voicing) là khả năng cho các nốt vang cùng lúc những độ to khác nhau.
  loai: dinh-nghia
- trang: piano/tieng-dan
  id: n52
  cau: 'Khối abc 5: giai điệu hát ở tay phải mf, phần đệm tay trái p; hai dòng, mỗi dòng bốn ô.'
  loai: cau-truc
- trang: piano/tieng-dan
  id: n55
  cau: 'Khối abc 6: tay phải ba hợp âm mẫu Đô–Mi–Sol, Đô–Fa–La, Si–Rê–Fa; nốt trên mf, các nốt dưới p.'
  loai: cau-truc
- trang: piano/tieng-dan
  id: n61
  cau: 'Bảng phong cách, hàng Baroque (Bach, Handel, Scarlatti): nhiều nốt hơi tách, phát âm làm rõ môtip; legato có nhưng không phải mặc định; sắc thái theo câu và kết cấu; bàn đạp rất ít.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n62
  cau: 'Bảng, hàng Cổ điển (Haydn, Mozart, Beethoven thời trẻ): rõ, nhẹ; dấu luyến ngắn khép lại bằng nhấc tay; legato đúng dấu ghi; tương phản nhanh (fp, sf); đệm Alberti rất nhẹ; bàn đạp ngắn, nhẹ.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n63
  cau: 'Bảng, hàng Lãng mạn (Chopin, Schumann, Brahms, Liszt): legato hát (cantabile), dài nhiều tầng; dải rộng, rubato, cân bằng nhiều lớp; bàn đạp gần như liên tục, đổi theo hòa âm.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n64
  cau: 'Bảng, hàng Ấn tượng (Debussy, Ravel): mềm, không "gõ"; hòa vào bàn đạp; nhiều sắc độ của p; lớp âm thanh gần, xa; bàn đạp nhiều, đạp nửa, una corda.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n65
  cau: 'Bảng, hàng Thế kỷ 20 (Bartók, Prokofiev): thường sắc, nhịp nhàng như máy; tương phản với staccato khô; nhấn mạnh tiết tấu; bàn đạp theo ký hiệu, thường khô.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n67
  cau: Đó không phải quy tắc lịch sử.
  loai: lich-su
- trang: piano/tieng-dan
  id: n70
  cau: 'Quiz 1: độ to của một nốt piano do tốc độ phím đi xuống, tức tốc độ búa đập dây; sau khi búa rời cơ cấu người chơi không còn tác động được.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n71
  cau: 'Quiz 2: trong dấu luyến hai nốt kiểu Cổ điển, nốt thứ hai nhẹ hơn và hơi ngắn lại.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n72
  cau: 'Quiz 3: sf trong đoạn p nghĩa là nhấn rõ so với xung quanh, không nhất thiết to như f; sforzando là nhấn tương đối.'
  loai: quy-tac
- trang: piano/tieng-dan
  id: n74
  cau: 'Mục Nguồn: Heinrich Neuhaus, The Art of Piano Playing (nguyên bản tiếng Nga 1958, bản tiếng Anh 1973).'
  loai: nam
- trang: piano/tieng-dan
  id: n75
  cau: 'Mục Nguồn: György Sándor, On Piano Playing: Motion, Sound and Expression (1981).'
  loai: nam
- trang: piano/tieng-dan
  id: n76
  cau: 'Mục Nguồn: Seymour Bernstein, With Your Own Two Hands (1981).'
  loai: nam
- trang: piano/tieng-dan
  id: n77
  cau: 'Mục Nguồn: Daniel Gottlob Türk, Klavierschule (1789).'
  loai: nam
