  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n160
  cau: "Shostakovich, Bắt đầu bằng: Children's Notebook (≈ Grade 1–3) → Dances of the Dolls (≈ Grade 3–5) → vài prelude Op. 34 (≈ Grade 5–8) → Prelude và Fugue Op. 87 số 1, số 7 (sau Grade 8) → Concerto số 2."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n161
  cau: "Ligeti: Musica ricercata (1951–1953, 11 bản: bản 1 chỉ dùng nốt La, nốt Rê chỉ đến ở cuối; mỗi bản sau thêm một cao độ, đến bản 11 đủ 12 nốt), 18 Études trong ba tập (1985–2001)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n163
  cau: "Ligeti, Bắt đầu bằng: Musica ricercata số 1 và 2 (≈ Grade 5–6) → số 7, tay trái lặp mẫu bảy nốt dưới giai điệu dân ca (≈ Grade 7–8) → Étude số 5 Arc-en-ciel (trình độ hòa nhạc) → Désordre và các étude khác."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n164
  cau: "Hôm nay: Kurtág (sinh 1926), Pärt (sinh 1935), Glass (sinh 1937) là những nhà soạn nhạc đương thời."
  loai: nam
- trang: piano/nha-soan-nhac
  id: n165
  cau: Kurtág (sinh 1926), tròn 100 tuổi năm 2026.
  loai: nam
- trang: piano/nha-soan-nhac
  id: n166
  cau: "Kurtág: bộ Játékok (Trò chơi), viết từ năm 1973, nay đã mười tập."
  loai: so-lieu
- trang: piano/nha-soan-nhac
  id: n167
  cau: "Kurtág: Játékok viết từ năm 1973; ý tưởng đến từ những đứa trẻ coi cây đàn như món đồ chơi; Kurtág nói đây không phải giáo trình mà là chỗ để thử nghiệm."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n169
  cau: "Pärt: Für Alina (1976) và Variationen zur Gesundung von Arinuschka rất ít nốt (≈ Grade 2–4)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n170
  cau: "Glass: Opening trong album Glassworks (1982), Metamorphosis, 20 Étude (≈ Grade 5–8)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n176
  cau: "Quiz: chọn cách phát âm khi chơi Bach vì bản gốc gần như không ghi sắc thái hay dấu luyến."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n177
  cau: 'Quiz: Sonata nào Mozart tự ghi là sonata nhỏ "cho người mới học"? K. 545.'
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n178
  cau: "Quiz: điều làm tay trái trong nocturne của Chopin khó là hợp âm rải trải rộng hơn một quãng tám, cổ tay lướt ngang mềm."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n179
  cau: "Quiz: bản số 1 trong Musica ricercata của Ligeti chỉ dùng nốt La, và nốt Rê ở cuối; mỗi bản sau thêm một cao độ, đến bản 11 đủ 12 nốt."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n180
  cau: "Nguồn: Maurice Hinson, Wesley Roberts, Guide to the Pianist's Repertoire, tái bản lần 4, Indiana University Press, 2014; Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature, Alfred Publishing, 1995."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n181
  cau: "Nguồn: François Couperin, L'art de toucher le clavecin, Paris, 1716; C. P. E. Bach, Versuch über die wahre Art das Clavier zu spielen, 1753 và 1762."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n182
  cau: "Nguồn: Mức độ khó: chương trình thi piano của ABRSM (https://www.abrsm.org/) và thang 1–9 của G. Henle Verlag (https://www.henle.de/), chỉ dùng để ước lượng."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n183
  cau: "Nguồn: Bản nhạc: IMSLP (tìm theo tên và số danh mục); bản Urtext của G. Henle Verlag, Wiener Urtext, Bärenreiter; với Chopin, Wydanie Narodowe (Jan Ekier biên tập)."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n184
  cau: "Nguồn: Grove Music Online: các mục về từng nhà soạn nhạc."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n29
  cau: "Handel: thoáng và dễ tay hơn Bach: giai điệu trên bè trầm, hợp âm rải rộng, nhiều biến tấu, prelude như ứng tác."
  loai: khuyen-tap
- trang: piano/nha-soan-nhac
  id: n127
  cau: "Satie: ít nốt, chậm, lặp lại; khó giữ tiếng đều, nhịp tĩnh; Gnossienne viết không có vạch nhịp, kèm lời dặn kỳ quặc."
  loai: khuyen-tap
- trang: piano/nha-soan-nhac
  id: n75
  cau: "Chopin: nên dùng bản Wydanie Narodowe (Jan Ekier biên tập) hoặc Henle."
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n1
  cau: "Chơi piano là một hoạt động thể chất: một bài vài phút gồm rất nhiều chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm."
  loai: dinh-nghia
- trang: piano/suc-khoe
  id: n2
  cau: Nhiều cơn đau thường gặp ở người chơi đàn liên quan đến quá tải và căng cơ, tức là những thứ bạn có thể điều chỉnh.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n5
  cau: Giới y khoa gọi chung các vấn đề này là rối loạn cơ xương liên quan đến chơi nhạc (playing-related musculoskeletal disorders).
  loai: ten
- trang: piano/suc-khoe
  id: n6
  cau: Một tổng quan hệ thống về người chơi piano (Bragge và cộng sự, 2006) ghi nhận tỷ lệ mắc trong các nghiên cứu dao động rất rộng, từ 26% đến 93%.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n7
  cau: "Con số chính xác khó biết, nhưng kết luận thì rõ: nhiều người chơi piano từng đau vì chơi đàn."
  loai: so-lieu
- trang: piano/suc-khoe
  id: n8
  cau: Đau là tín hiệu, không phải bằng chứng của sự chăm chỉ; câu "không đau thì không tiến bộ" không áp dụng cho đôi tay của người chơi đàn.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n9
  cau: BAPAM coi mỏi và căng là dấu hiệu để xem lại kỹ thuật, cách tập và chương trình tập; còn đau thì dừng ngay.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n10
  cau: 'Bảng "Mỏi, căng: xem lại cách tập" và "Đau và dấu hiệu bất thường: dừng": mỏi đều ở cẳng tay hoặc vai sau buổi tập dài, giảm khi nghỉ, không gắn với động tác cụ thể, cảm giác bình thường; ngược lại, đau ở một điểm, đau không hết hoặc nặng dần, đau nhói ở một động tác, tê, kim châm, yếu tay, vụng về.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n11
  cau: Các nghiên cứu chưa thống nhất yếu tố nào quan trọng nhất (chính tổng quan của Bragge cũng ghi nhận điều đó), nhưng dưới đây là những yếu tố mà tài liệu về sức khỏe nhạc công (như BAPAM) nhắc tới.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n12
  cau: 'Hàng "Tăng thời lượng tập đột ngột": tay cần thời gian để thích nghi với tải mới; cách giảm: tăng dần qua nhiều tuần, học bài mới đủ sớm trước hạn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n13
  cau: 'Hàng "Buổi tập dài không nghỉ": tay cần thời gian hồi phục giữa các lượt tập; tập khoảng 20 phút rồi nghỉ 10 phút, chia thành nhiều lượt ngắn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n15
  cau: 'Hàng "Căng cơ thừa": ép phím, vai nhô, cổ tay khóa, nín thở làm cơ gồng liên tục nên mỏi nhanh; cách giảm: "nhấn rồi buông".'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n16
  cau: 'Hàng "Ghế, tư thế, cây đàn không phù hợp": tay phải bù cho tư thế sai; chỉnh ghế mỗi buổi, đàn có bộ máy phím tốt; liên kết Chọn đàn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n18
  cau: 'Hàng "Không khởi động": cơ chưa được làm ấm, máu chưa đủ tới tay; làm ấm tay và khởi động nhẹ trước khi tập kỹ thuật.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n19
  cau: 'Hàng "Bài quá khó quá sớm": tay làm những việc chưa có kỹ thuật để làm; chọn bài vừa sức.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n20
  cau: 'Hàng "Căng thẳng, thiếu ngủ": cơ căng hơn, hồi phục chậm hơn; ngủ đủ, để ý lúc gồng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n21
  cau: 'Hàng "Tải từ việc khác": gõ phím, nhắn tin, xách đồ nặng, thể thao hay làm vườn; đôi tay chỉ có một; tính tổng tải trong ngày, bớt tập vào hôm tay đã làm việc nặng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n22
  cau: "Khởi động nhẹ vài phút, mục đích là làm ấm chứ không phải kéo giãn: rửa tay nước ấm, xoay vai, lắc tay, xoay cổ tay, thả rơi cánh tay, năm ngón hoặc gam chậm."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n23
  cau: Đừng kéo giãn mạnh, bẻ ngón tay ra sau hay cố "dang tay cho rộng" trước khi chơi; đoạn khó nhất để sau khi tay đã ấm.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n24
  cau: '"Tập khoảng 20 phút rồi nghỉ 10 phút (theo BAPAM): đứng dậy, đi lại, buông thõng tay"; đặt hẹn giờ; nghỉ thật ngắn giữa các lần lặp, giữa các câu nhạc; muốn tập lâu trong ngày thì chia thành nhiều lượt ngắn xen nghỉ.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n25
  cau: Đôi tay thích nghi với tải tăng dần, không phải với những cú nhảy; BAPAM khuyên tránh tăng đột ngột thời lượng tập; ví dụ từ 30 lên 60 phút mỗi ngày thì đi qua nhiều tuần, chỉ tăng khi tay vẫn thoải mái; trước kỳ thi hay buổi diễn đừng nhân đôi thời gian tập tuần cuối.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n28
  cau: Bàn phím piano phổ biến hiện nay có quãng tám rộng khoảng 6,5 inch (khoảng 16,5 cm) cho mọi người chơi, bất kể cỡ tay.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n29
  cau: Theo PASK, độ dang tay của người lớn có thể chênh nhau tới khoảng 12,7 cm (5 inch), và trung bình tay nam dang hơn tay nữ khoảng 2,5 cm.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n30
  cau: Trong một nghiên cứu lâm sàng trên 200 nghệ sĩ và sinh viên piano ở Nhật Bản bị đau tay do tập quá mức (Sakai, 2002), 70 người cho biết triệu chứng bắt đầu khi họ đang tập một kỹ thuật bàn phím nhất định; quãng tám (30 người) và hợp âm (22 người) là hai kỹ thuật gặp nhiều nhất.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n32
  cau: Có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 (thường gọi là "7/8") và DS6.0 ("15/16"); PASK vận động để chúng phổ biến hơn; theo PASK (tính đến 2026), chúng chỉ có từ một số ít nguồn, giá cao và người mua thường phải chờ lâu.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n33
  cau: "Ghế, tư thế, cây đàn: đàn điện có chân chắc, không rung; độ nặng phím hợp với tay bạn, vì BAPAM nhắc nên cân nhắc phím nhẹ hay nặng hợp hơn cho việc tập thường xuyên."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n34
  cau: "Vận động toàn thân: BAPAM khuyên giữ thể lực bằng vận động nhịp điệu đều như bơi, đi bộ hay chạy; các môn dùng tạ và nắm tay chặt không hợp với người chơi piano. Giữ ấm: những ngày rét, làm ấm tay trước khi tập, như rửa tay nước ấm."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n35
  cau: "Bảng dấu hiệu cảnh báo: đau ở một điểm khi chơi và còn sau khi dừng thì dừng buổi tập và cho tay nghỉ, không đỡ thì đi khám; đau quay lại mỗi lần chơi một đoạn nhất định thì giảm thời lượng, xem lại kỹ thuật với thầy, còn kéo dài thì đi khám."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n36
  cau: "Tê, kim châm ở ngón tay; yếu tay, vụng về khi cầm đồ vật; sưng hay đỏ quanh khớp ngón hoặc cổ tay: đi khám."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n37
  cau: "Đau không hết hoặc nặng dần, kể cả khi đã nghỉ chơi đàn: đi khám."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n38
  cau: 'Một ngón co quắp hay "không nghe lời" ở một động tác nhất định, không đau: gặp bác sĩ thần kinh (xem bên dưới).'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n39
  cau: 'Hộp "Khi vừa thấy đau": 1. Dừng lại, đừng chơi xuyên qua cơn đau, kể cả khi sắp đến ngày thi; 2. Ghi lại đau ở đâu, đoạn nào, sau bao lâu, tuần này có tập nhiều hơn không; 3. Quay lại từ từ khi đã hết đau hoặc theo chỉ dẫn bác sĩ: buổi ngắn, bài chậm, đơn giản, nhỏ tiếng, dừng ngay nếu đau trở lại.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n40
  cau: Loạn trương lực cơ khu trú ở nhạc công (musician's focal dystonia) là một rối loạn thần kinh hiếm gặp, ước tính khoảng 1–2% nhạc công chuyên nghiệp (Altenmüller và Jabusch, 2010; BAPAM).
  loai: so-lieu
- trang: piano/suc-khoe
  id: n41
  cau: "Nó thường không đau lúc đầu: một hay vài ngón tự co vào một tư thế bất thường hoặc không nghe lời khi chơi đàn; những việc khác có thể vẫn bình thường, dù đôi khi vấn đề lan sang các việc tinh khác như viết hay gõ phím."
  loai: dinh-nghia
- trang: piano/suc-khoe
  id: n42
  cau: Cố tập nhiều hơn để "sửa" có thể làm triệu chứng nặng thêm.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n43
  cau: 'Nhưng đừng vội hoảng: phần lớn những ngón tay "vụng" ở người mới học chỉ là chưa được tập đủ, hoặc đang bị căng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n44
  cau: Nếu nghi ngờ loạn trương lực, nhờ bác sĩ gia đình giới thiệu đến bác sĩ thần kinh có quan tâm đặc biệt đến rối loạn vận động; BAPAM cũng khuyên nên được chuyên gia y học nghệ thuật biểu diễn đánh giá khi bạn chơi đàn.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n45
  cau: "Ở Việt Nam: bắt đầu bằng một bác sĩ ở cơ sở y tế bạn tin cậy, nói rõ mình chơi đàn và tập bao lâu mỗi ngày, nhờ giới thiệu đến chuyên khoa phù hợp; tê, yếu hay mất kiểm soát ngón tay thì nhờ giới thiệu đến bác sĩ thần kinh."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n47
  cau: "Khi bác sĩ đã cho phép chơi lại, nhờ thầy xem kỹ thuật ở đoạn gây đau: BAPAM khuyên xem lại cách chơi để đau khỏi tái phát, vì nguyên nhân có thể nằm ở một thói quen nhỏ như cổ tay khóa hay ngón cái ép chặt."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n48
  cau: Ở Anh, BAPAM (British Association for Performing Arts Medicine) là tổ chức từ thiện y tế dành cho người làm nghề nghệ thuật biểu diễn ở Anh, có tư vấn miễn phí (tính đến 2026).
  loai: ten
- trang: piano/suc-khoe
  id: n49
  cau: Ở Mỹ, PAMA (Performing Arts Medicine Association) quy tụ chuyên gia y tế, nghệ sĩ, nhà giáo và nhà quản lý, và có danh bạ giới thiệu người cung cấp dịch vụ cho người biểu diễn.
  loai: ten
- trang: piano/suc-khoe
  id: n50
  cau: Nếu bạn sống ở những nước này, đó là nơi bạn có thể tìm đến.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n51
  cau: "Danh sách kiểm tra hằng tuần: không tăng thời lượng quá nhiều so với tuần trước; nghỉ 10 phút sau mỗi 20 phút tập; chia đoạn nặng thành nhiều lần ngắn; quay video tay mình và đối chiếu với tư thế; không có cơn đau, tê hay yếu kéo dài."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n52
  cau: "Câu hỏi 1: đau ở một điểm ở cổ tay, vẫn còn sau khi đã nghỉ, là tín hiệu cần dừng tập; cẳng tay hơi mỏi đều sau buổi dài, giảm đi khi nghỉ, chưa phải; lời giải thích: mỏi và căng là lúc xem lại cách tập, đau khu trú, kéo dài hoặc lặp lại là tín hiệu cần dừng."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n53
  cau: "Câu hỏi 2: còn một tuần nữa là thi thì giữ thời lượng gần như cũ, nghỉ đều, tập chậm và tập trong đầu; không nhân đôi thời gian tập, không tập liền ba tiếng không nghỉ; tăng tải đột ngột là yếu tố nguy cơ, tuần cuối là lúc giữ sức."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n54
  cau: "Câu hỏi 3: tay nhỏ, bài nhiều quãng tám: khép tay lại giữa các quãng tám, di chuyển bằng cả cánh tay, chọn bài khác nếu vẫn căng; lời giải thích: bàn tay mở căng hết cỡ và lặp lại nhiều lần là một yếu tố nguy cơ gây quá tải."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n55
  cau: "Câu hỏi 4: một ngón tự co lại mỗi khi chơi một đoạn chạy nốt, không đau, mọi việc khác bình thường: gặp bác sĩ thần kinh, tốt nhất là người có kinh nghiệm về rối loạn vận động; lời giải thích: đây có thể là loạn trương lực cơ khu trú, một rối loạn thần kinh hiếm gặp cần chuyên gia đánh giá."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n56
  cau: Bragge, Bialocerkowski, McMeeken, "A systematic review of prevalence and risk factors associated with playing-related musculoskeletal disorders in pianists", Occupational Medicine 56(1), 2006, tr. 28–38.
  loai: ten
- trang: piano/suc-khoe
  id: n57
  cau: 'N. Sakai, "Hand pain attributed to overuse among professional pianists: a study of 200 cases", Medical Problems of Performing Artists 17(4), 2002, tr. 178–180.'
  loai: ten
- trang: piano/suc-khoe
  id: n58
  cau: 'E. Altenmüller, H.-C. Jabusch, "Focal dystonia in musicians: phenomenology, pathophysiology, triggering factors, and treatment", Medical Problems of Performing Artists 25(1), 2010, tr. 3–9.'
  loai: ten
- trang: piano/suc-khoe
  id: n59
  cau: "BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano): bản PDF; Musicians' Focal Dystonia; Returning to Playing."
  loai: ten
- trang: piano/suc-khoe
  id: n60
  cau: PASK, các trang How many sizes?, What is PASK?, Pianists' hand spans vary greatly và Epidemiological and clinical studies.
  loai: ten
- trang: piano/suc-khoe
  id: n61
  cau: "[BAPAM](https://www.bapam.org.uk/) (Anh) và [PAMA](https://artsmed.org/) (Mỹ)."
  loai: ten
- trang: piano/suc-khoe
  id: n62
  cau: NHS (Anh), Repetitive strain injury (RSI).
  loai: ten
- trang: piano/suc-khoe
  id: n63
  cau: 'Boyle, Boyle, Booker, "Pianist hand spans: Gender and ethnic differences and implications for piano playing", Australasian Piano Pedagogy Conference, 2015.'
  loai: ten
- trang: piano/suc-khoe
  id: n64
  cau: Thomas Mark, What Every Pianist Needs to Know About the Body (GIA Publications, 2003).
  loai: ten
- trang: piano/suc-khoe
  id: n65
  cau: "Gerald Klickstein, The Musician's Way: A Guide to Practice, Performance, and Wellness (Oxford University Press, 2009)."
  loai: ten
- trang: piano/suc-khoe
  id: n27
  cau: "Kiểm tra thả lỏng: mỗi khi lật trang hoặc hết câu nhạc, quét nhanh hàm, hơi thở, vai, cổ tay, ngón cái, và việc ép tiếp sau khi phím chạm đáy."
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n14
  cau: 'Hàng "Quãng tám, hợp âm rộng khi tay nhỏ": bàn tay mở căng hết cỡ, lặp lại nhiều lần; xem phần "Bàn tay nhỏ" bên dưới.'
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n31
  cau: "Nếu tay bạn nhỏ: biết vùng thoải mái của mình; đừng giữ bàn tay mở căng, khép lại giữa hai quãng tám, di chuyển bằng cả cánh tay; sắp xếp lại hợp âm rộng (bỏ nốt nhân đôi, chuyển sang tay kia, rải); chọn bài hợp tay, nhạc Baroque và Cổ điển có nhiều bài hay không đòi hỏi bàn tay lớn."
  loai: khuyen-tap
- trang: piano/the-loai
  id: n1
  cau: "Mô tả định nghĩa: nocturne trữ tình và chậm rãi; étude đặt một bài toán kỹ thuật; mazurka nhịp ba, phách nhấn lệch."
  loai: dinh-nghia
- trang: piano/the-loai
  id: n2
  cau: Mức độ ở cột "Chơi thử" theo thang bảy chặng, chặng 1 là khởi đầu, chặng 7 là sau Grade 8.
  loai: cap-do
- trang: piano/the-loai
  id: n3
  cau: 'Bảng tóm tắt: các bản "Chơi thử" có trang bài học đều có thật, và chặng ghi trong bảng khớp tac-pham.yml: Minuet Sol trưởng chặng 2, Prelude Đô trưởng chặng 4, Clementi Op. 36 số 1 chặng 3, Für Elise chặng 4, Burgmüller Arabesque chặng 3, Prélude Mi thứ chặng 4, Ballade số 1 chặng 7, Mendelssohn Op. 19 số 6 chặng 5, Schumann Album chặng 2, Grieg Arietta chặng 4.'
  loai: cap-do
- trang: piano/the-loai
  id: n4
  cau: "Bảng: Invention số 1 ở chặng 5."
  loai: cap-do
- trang: piano/the-loai
  id: n5
  cau: "Bảng: Valse La thứ ở chặng 3."
  loai: cap-do
- trang: piano/the-loai
  id: n6
  cau: "Bảng: Debussy, The Little Shepherd ở chặng 5."
  loai: cap-do
- trang: piano/the-loai
  id: n7
  cau: "Bảng: Schubert, Moment musical số 3 ở chặng 4."
  loai: cap-do
- trang: piano/the-loai
  id: n8
  cau: "Bảng: Diabelli Op. 149 ở chặng 1."
  loai: cap-do
- trang: piano/the-loai
  id: n9
  cau: "Bảng: Beethoven, 6 biến tấu trên bài ca Thụy Sĩ WoO 64 ở chặng 2–3."
  loai: cap-do
- trang: piano/the-loai
  id: n10
  cau: "Bảng: Scarlatti, K. 32 ở chặng 4."
  loai: cap-do
- trang: piano/the-loai
  id: n11
  cau: "Bảng: Mozart, Fantasia K. 397 ở chặng 6; Chopin, Nocturne Đô♯ thứ (di cảo) ở chặng 5; Brahms, Valse Op. 39 số 15 rút gọn ở chặng 5; Kabalevsky, Toccatina Op. 27 số 12 ở chặng 3."
  loai: cap-do
- trang: piano/the-loai
  id: n12
  cau: "Bảng: cột Thời kỳ của từng thể loại (Baroque, Cổ điển, Lãng mạn, thế kỷ 20) và cột Nghe thử nêu các bản có thật: French Suite số 5 BWV 816, Bình quân luật, Goldberg, Diabelli, Scarlatti K. 141 và K. 380, Mozart K. 331, Pathétique, Rondo K. 511, Fantasia K. 397, Fantaisie Op. 49, Op. 126, D. 899, Op. 9 số 2, Op. 10 và Op. 25, Op. 28, Estampes, Gaspard de la nuit, Lieder ohne Worte, Kinderszenen, Carnaval, Op. 117 và 118, Lyric Pieces, BWV 911, Prokofiev Op. 11, Fantasia D. 940."
  loai: danh-muc
- trang: piano/the-loai
  id: n14
  cau: Tổ khúc là chuỗi điệu nhảy cùng giọng; lõi chuẩn là allemande, courante, sarabande, gigue; giữa sarabande và gigue thường chèn minuet, gavotte, bourrée.
  loai: cau-truc
- trang: piano/the-loai
  id: n15
  cau: Allemande nhịp chẵn, vừa phải, dòng móc kép; courante nhịp ba, nhanh hơn; sarabande nhịp ba chậm, thường nhấn phách 2; gigue nhanh, thường 6/8 hoặc 12/8.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n16
  cau: 'Bach: French Suites BWV 812–817, English Suites BWV 806–811, Partita BWV 825–830, Partita số 2 Đô thứ BWV 826; Handel, tổ khúc Mi trưởng HWV 430 có "The Harmonious Blacksmith".'
  loai: danh-muc
- trang: piano/the-loai
  id: n18
  cau: Prelude là phần mở đầu tự do, thường dựa trên một hình nốt lặp; fugue là bản phức điệu mà chủ đề được các bè lần lượt bắt chước.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n19
  cau: "Bình quân luật của Bach: quyển 1 năm 1722, quyển 2 khoảng 1742; 48 cặp prelude và fugue qua đủ 24 giọng."
  loai: lich-su
- trang: piano/the-loai
  id: n20
  cau: Bach viết 15 invention hai bè và 15 sinfonia ba bè, bản chép sạch năm 1723.
  loai: so-lieu
- trang: piano/the-loai
  id: n21
  cau: Toccata từ chữ Ý "chạm", là bản phô diễn ngón tay xen đoạn tự do và đoạn fugue.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n22
  cau: "Goldberg Variations BWV 988 (1741): một aria và 30 biến tấu dựng trên cùng một bè trầm."
  loai: so-lieu
- trang: piano/the-loai
  id: n23
  cau: Domenico Scarlatti để lại 555 sonata cho harpsichord, phần lớn một chương hai phần, mỗi phần nhắc lại; có vắt tay, nốt lặp, quãng nhảy rộng, âm hưởng guitar Tây Ban Nha.
  loai: so-lieu
- trang: piano/the-loai
  id: n24
  cau: Scarlatti K. 32 Rê thứ có tên Aria.
  loai: ten
- trang: piano/the-loai
  id: n25
  cau: Sonata Cổ điển thường có ba chương nhanh – chậm – nhanh; chương đầu ở hình thức sonata, chương cuối thường là rondo hoặc chương nhanh vui tươi.
  loai: cau-truc
- trang: piano/the-loai
  id: n26
  cau: Haydn để lại khoảng 60 sonata đàn phím, Mozart 18, Beethoven 32.
  loai: so-lieu
- trang: piano/the-loai
  id: n27
  cau: Sonatina là sonata nhỏ, ngắn hơn, đoạn phát triển rất ngắn hoặc không có, viết cho người học; ví dụ Clementi Op. 36, Kuhlau Op. 20 và Op. 55, Diabelli Op. 151 và Op. 168.
  loai: danh-muc
- trang: piano/the-loai
  id: n28
  cau: Mozart viết 12 biến tấu trên Ah! vous dirai-je, maman, K. 265; Beethoven có 32 biến tấu Đô thứ WoO 80 và Diabelli Variations Op. 120.
  loai: danh-muc
- trang: piano/the-loai
  id: n29
  cau: Rondo Mozart La thứ K. 511; Beethoven Rondo a capriccio Op. 129; biệt danh "Giận dữ vì đồng xu bị mất" không do Beethoven đặt; Für Elise là rondo A–B–A–C–A.
  loai: danh-muc
- trang: piano/the-loai
  id: n30
  cau: Mozart có Fantasia Rê thứ K. 397 và Đô thứ K. 475; Beethoven gọi hai sonata Op. 27 là quasi una fantasia, trong đó có Ánh trăng.
  loai: danh-muc
- trang: piano/the-loai
  id: n31
  cau: "Concerto: piano đối thoại với cả dàn nhạc, thường ba chương, có cadenza cho nghệ sĩ độc tấu phô diễn."
  loai: dinh-nghia
- trang: piano/the-loai
  id: n32
  cau: Thế kỷ 19 yêu tiểu phẩm tính cách, hợp với cây đàn đứng trong phòng khách gia đình.
  loai: lich-su
- trang: piano/the-loai
  id: n33
  cau: "Bagatelle: Beethoven có ba tập Op. 33, Op. 119, Op. 126 và Für Elise WoO 59."
  loai: danh-muc
- trang: piano/the-loai
  id: n34
  cau: Impromptu D. 899 và D. 935 (1827), sáu Moment musical D. 780 của Schubert.
  loai: danh-muc
- trang: piano/the-loai
  id: n35
  cau: Chopin viết ba Impromptu và Fantaisie-Impromptu Op. 66, in sau khi ông mất.
  loai: danh-muc
- trang: piano/the-loai
  id: n36
  cau: John Field, người Ireland, viết những nocturne đầu tiên năm 1812 và thường được coi là người khai sinh thể loại; Chopin đưa nó lên đỉnh cao.
  loai: lich-su
- trang: piano/the-loai
  id: n37
  cau: "Công thức nocturne: tay trái rải hợp âm rộng, tay phải hát giai điệu kiểu opera Ý với nốt hoa mỹ uốn lượn."
  loai: dinh-nghia
- trang: piano/the-loai
  id: n38
  cau: Étude nghĩa là bài học; Czerny, Cramer, Clementi viết hàng trăm bài luyện ngón.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n39
  cau: "Chopin: 24 étude Op. 10 (1833) và Op. 25 (1837); sau ông có Liszt (Études d'exécution transcendante), Debussy (12 étude, 1915), Rachmaninoff (Études-tableaux), Ligeti."
  loai: danh-muc
- trang: piano/the-loai
  id: n40
  cau: 24 prélude Op. 28 của Chopin đi qua 24 giọng theo vòng quãng năm (Đô trưởng, La thứ, Sol trưởng, Mi thứ…); có bản chỉ dài vài chục giây; Scriabin (Op. 11), Rachmaninoff, Debussy viết prelude sau ông.
  loai: cau-truc
- trang: piano/the-loai
  id: n42
  cau: Mazurka là điệu nhảy dân gian Ba Lan, phách nhấn thường ở phách 2 hoặc 3; Chopin viết gần 60 bản.
  loai: so-lieu
- trang: piano/the-loai
  id: n43
  cau: "Chopin: Polonaise trang trọng; Valse dành cho phòng khách và phòng hòa nhạc chứ không để nhảy."
  loai: dinh-nghia
- trang: piano/the-loai
  id: n44
  cau: Chopin là người đầu tiên đặt tên ballade cho một bản nhạc không lời, bốn ballade lớn; scherzo nghĩa đen là "đùa", bốn scherzo độc lập.
  loai: lich-su
- trang: piano/the-loai
  id: n45
  cau: Mendelssohn viết tám tập Lieder ohne Worte, mỗi tập sáu bản; sáu tập đầu in khi ông còn sống, Op. 85 và Op. 102 in sau khi ông mất.
  loai: so-lieu
- trang: piano/the-loai
  id: n46
  cau: Ba bản có tên Venetianisches Gondellied; bản đầu tiên là Op. 19 số 6 Sol thứ.
  loai: ten
- trang: piano/the-loai
  id: n47
  cau: "Schumann: Kinderszenen (1838), Album für die Jugend (1848) viết cho con mình; Papillons, Carnaval, Kreisleriana."
  loai: danh-muc
- trang: piano/the-loai
  id: n48
  cau: "Tchaikovsky: Các mùa (12 bản cho 12 tháng) và Album cho tuổi trẻ Op. 39; Mussorgsky: Những bức tranh ở phòng triển lãm."
  loai: danh-muc
- trang: piano/the-loai
  id: n49
  cau: "Rhapsody: 19 Hungarian Rhapsodies của Liszt; hai Rhapsody Op. 79 của Brahms."
  loai: danh-muc
- trang: piano/the-loai
  id: n50
  cau: "Brahms cuối đời: intermezzo Op. 116–119, 1892–1893."
  loai: lich-su
- trang: piano/the-loai
  id: n51
  cau: "Barcarolle: Chopin Op. 60, Fauré 13 bản, Tchaikovsky Tháng Sáu; Berceuse Op. 57 của Chopin dựng trên hình đệm tay trái gần như không đổi."
  loai: danh-muc
- trang: piano/the-loai
  id: n52
  cau: "Fantaisie: Schubert Wanderer-Fantasie, Schumann Fantasie Op. 17, Chopin Fantaisie Op. 49."
  loai: danh-muc
- trang: piano/the-loai
  id: n53
  cau: Grieg viết 66 Lyric Pieces trong mười tập, từ 1867 đến 1901; bản đầu là Arietta; bản cuối của tập cuối gợi lại giai điệu Arietta dưới dạng valse.
  loai: so-lieu
- trang: piano/the-loai
  id: n54
  cau: "Debussy (Estampes, Images, hai tập Préludes, Clair de lune) và Ravel (Jeux d'eau, Gaspard de la nuit, Le tombeau de Couperin: tổ khúc kiểu Baroque, mỗi chương tưởng nhớ một người bạn tử trận trong Thế chiến thứ nhất)."
  loai: danh-muc
- trang: piano/the-loai
  id: n55
  cau: "Bartók: Allegro barbaro, 153 bản Mikrokosmos xếp từ dễ đến khó; Prokofiev: Toccata Op. 11, ba sonata chiến tranh số 6–8."
  loai: danh-muc
- trang: piano/the-loai
  id: n56
  cau: Shostakovich viết 24 Prelude và Fugue Op. 87, nối tiếp Bình quân luật.
  loai: danh-muc
- trang: piano/the-loai
  id: n57
  cau: "Gershwin: ba Preludes, Rhapsody in Blue; Kapustin viết étude bằng ngôn ngữ jazz nhưng ghi đầy đủ từng nốt."
  loai: danh-muc
- trang: piano/the-loai
  id: n58
  cau: "Satie: Gymnopédies (1888); Pärt: Für Alina (1976); Glass: piano lặp lại từng mẫu nhỏ."
  loai: danh-muc
- trang: piano/the-loai
  id: n59
  cau: Ligeti viết ba tập étude (1985–2001) chồng các lớp nhịp lên nhau.
  loai: so-lieu
- trang: piano/the-loai
  id: n60
  cau: "Nhạc thính phòng: Archduke Op. 97 của Beethoven; tứ tấu có piano Op. 25 của Brahms; ngũ tấu có piano: Schubert Con cá hồi, Schumann Op. 44, Brahms Op. 34, Dvořák Op. 81."
  loai: danh-muc
- trang: piano/the-loai
  id: n61
  cau: "Sonata violin hoặc cello và piano: Beethoven Mùa xuân Op. 24 và Kreutzer Op. 47; Franck Sonata violin; sonata cello của Beethoven, Brahms, Chopin (Op. 65), Rachmaninoff (Op. 19)."
  loai: danh-muc
- trang: piano/the-loai
  id: n62
  cau: "Lied: Erlkönig của Schubert, Dichterliebe của Schumann."
  loai: danh-muc
- trang: piano/the-loai
  id: n63
  cau: "Bốn tay và hai đàn: Mozart Sonata Đô trưởng K. 521 (bốn tay) và Rê trưởng K. 448 (hai đàn); Schubert Fantasia Fa thứ D. 940; Hungarian Dances của Brahms và Slavonic Dances của Dvořák viết cho bốn tay trước khi thành bản dàn nhạc."
  loai: danh-muc
- trang: piano/the-loai
  id: n64
  cau: Diabelli Op. 149 ngay từ chặng 1.
  loai: cap-do
- trang: piano/the-loai
  id: n65
  cau: BWV, K., Hob., D., S., Sz. là số hiệu trong danh mục do người đời sau lập cho tác phẩm của từng nhà soạn nhạc.
  loai: dinh-nghia
- trang: piano/the-loai
  id: n66
  cau: "Quiz: Nocturne do Field khai sinh và Chopin đưa lên đỉnh cao; Field viết nocturne đầu tiên năm 1812."
  loai: lich-su
- trang: piano/the-loai
  id: n67
  cau: "Quiz: étude của Chopin là tác phẩm trọn vẹn xoay quanh một bài toán kỹ thuật."
  loai: dinh-nghia
- trang: piano/the-loai
  id: n68
  cau: "Quiz: sonata Scarlatti một chương, hai phần, mỗi phần nhắc lại; phần đầu sang giọng khác, phần sau về giọng chính."
  loai: cau-truc
- trang: piano/the-loai
  id: n69
  cau: "Quiz: chữ D. là số hiệu trong danh mục Schubert do Otto Erich Deutsch lập."
  loai: ten
- trang: piano/the-loai
  id: n71
  cau: "Mục Nguồn: Hinson & Roberts, Guide to the Pianist's Repertoire (tái bản lần 4, Indiana University Press, 2014); Rosen, The Classical Style (1971) và The Romantic Generation (Harvard University Press, 1995); Rowland (chủ biên), The Cambridge Companion to the Piano (Cambridge University Press, 1998); Grove Music Online."
  loai: danh-muc
- trang: piano/the-loai
  id: n13
  cau: Phần lớn nhạc phím Baroque viết cho harpsichord, clavichord hoặc organ; kho bài này dạy hai tay độc lập, phức điệu, nhịp vững.
  loai: khuyen-tap
- trang: piano/the-loai
  id: n41
  cau: Debussy đặt tên gợi hình ở cuối mỗi prelude.
  loai: khuyen-tap
- trang: piano/the-loai
  id: n17
  cau: "Chơi thử: các minuet trong Notebook for Anna Magdalena Bach."
  loai: khuyen-tap
- trang: piano/thi-tau
  id: n1
  cau: Tin tốt là một phần lớn của đọc nhanh là kỹ năng nhận ra hình mẫu, và nó có thể tiến bộ nếu bạn đọc một chút mỗi ngày.
  loai: quy-tac
- trang: piano/thi-tau
  id: n2
  cau: Thị tấu (sight-reading) là chơi một bản nhạc ngay lần đầu nhìn thấy.
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n4
  cau: Người đọc giỏi nhìn khoảng cách giữa các nốt và hình dạng cả nhóm nốt, giống như ta đọc cả chữ chứ không đọc từng chữ cái; có ba cách nhận ra một nốt (nốt mốc, quãng tính từ nốt trước, hình mẫu), và người đọc giỏi dùng cả ba cùng lúc.
  loai: cau-truc
- trang: piano/thi-tau
  id: n5
  cau: "Nốt mốc: Đô giữa, Sol trên dòng 2 khóa Sol, Fa trên dòng 4 khóa Fa."
  loai: quy-tac
- trang: piano/thi-tau
  id: n6
  cau: "Bảng quãng trên khuông: dòng sang khe sát bên (hoặc khe sang dòng sát bên) là quãng 2, phím ngay cạnh; dòng sang dòng kế tiếp (hoặc khe sang khe kế tiếp) là quãng 3, bỏ qua một phím; dòng sang khe cách một là quãng 4, bỏ qua hai phím; dòng sang dòng cách một là quãng 5, ngón 1 và ngón 5 của thế tay năm ngón; nốt trên dòng và nốt trong khe cùng tên là quãng 8, hai phím cùng tên."
  loai: quy-tac
- trang: piano/thi-tau
  id: n7
  cau: "Quy tắc dễ nhớ: quãng lẻ (3, 5, 7) nối dòng với dòng hoặc khe với khe; quãng chẵn (2, 4, 6, 8) nối dòng với khe."
  loai: quy-tac
- trang: piano/thi-tau
  id: n8
  cau: 'Ví dụ "Đọc bằng quãng": nốt đầu là Đô giữa, các nốt sau đọc bằng quãng ghi trên nốt (3, 2, 4 | 4, 4, 3, 3 | 5, 5).'
  loai: cau-truc
- trang: piano/thi-tau
  id: n11
  cau: "Mô thức tay trái: nốt trầm rồi hai hợp âm (điệu valse), bè Alberti (trầm–cao–giữa–cao), hợp âm rải."
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n12
  cau: Hợp âm ba ở thế gốc là ba nốt trên ba dòng liên tiếp (hoặc ba khe liên tiếp); một quãng bốn "hở" trong chồng nốt là thể đảo.
  loai: quy-tac
- trang: piano/thi-tau
  id: n13
  cau: "Dòng kẻ phụ: Đô giữa (C4) trên một dòng kẻ phụ giữa hai khuông, Đô trên hai dòng kẻ phụ phía trên khóa Sol (C6), Đô trên hai dòng kẻ phụ phía dưới khóa Fa (C2)."
  loai: quy-tac
- trang: piano/thi-tau
  id: n14
  cau: 8va phía trên nốt là chơi cao hơn một quãng tám so với nốt viết; 8vb (hoặc 8va phía dưới nốt) là thấp hơn một quãng tám; loco là trở về chơi như viết.
  loai: quy-tac
- trang: piano/thi-tau
  id: n16
  cau: "Khoảng mắt–tay (eye-hand span): trong các nghiên cứu được tổng hợp, khoảng này chỉ vài nốt, từ chừng 0,5–3,7 nốt ở người mới đến chừng 1,7–6,8 nốt ở người đọc giỏi (tùy cách đo), và hiếm khi tới trọn một ô nhịp. Một vài thí nghiệm cho thấy luyện tập giúp kéo dài nó ở người đọc yếu, nhưng bằng chứng còn ít."
  loai: so-lieu
- trang: piano/thi-tau
  id: n18
  cau: 'Bàn phím có "chữ nổi": nhóm hai và nhóm ba phím đen.'
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n21
  cau: Sol♯ là dấu hóa bất thường trong La thứ.
  loai: quy-tac
- trang: piano/thi-tau
  id: n23
  cau: Các bài đọc mẫu đều được soạn cho trang này (5 khối nhạc).
  loai: lich-su
- trang: piano/thi-tau
  id: n24
  cau: "Bài 1: Đô trưởng, tay phải giữ nguyên thế tay Đô–Sol, tay trái chỉ có hai nốt Đô và Sol."
  loai: cau-truc
- trang: piano/thi-tau
  id: n25
  cau: "Bài 2: Sol trưởng, nhịp 3/4, hóa biểu một dấu thăng. Hai câu bốn ô nhịp chỉ khác nhau ở ô thứ nhất và thứ ba; ô thứ hai và thứ tư giống hệt."
  loai: cau-truc
- trang: piano/thi-tau
  id: n26
  cau: "Bài 3: La thứ, tay trái nốt trầm và hợp âm; Sol♯ có trong bài; tay phải đổi thế tay; tay trái lặp mô thức nốt trầm rồi ba hợp âm (Đô–Mi ở ô 1 và 3; Sol♯–Rê ở ô 2)."
  loai: cau-truc
- trang: piano/thi-tau
  id: n27
  cau: "Bài 3 giản lược: tay trái chỉ còn nốt trầm (A,,8 | E,,8 | A,,8 | E,,4 A,,4); hòa âm vẫn rõ, nhịp vẫn giữ được."
  loai: cau-truc
- trang: piano/thi-tau
  id: n29
  cau: "Bartók, Mikrokosmos quyển 1–2: bắt đầu bằng những bài ngắn và tăng độ khó từng chút."
  loai: cau-truc
- trang: piano/thi-tau
  id: n30
  cau: Paul Harris, Improve your sight-reading! (Faber Music), mỗi cấp một quyển, có bài tập tiết tấu và giai điệu, bài mẫu kèm câu hỏi, và bài đọc ngắn.
  loai: cau-truc
- trang: piano/thi-tau
  id: n31
  cau: Song tấu bốn tay, ví dụ Diabelli Melodious Exercises Op. 149; bè của học trò chỉ dùng năm nốt; chơi cùng người khác buộc bạn không được dừng.
  loai: cau-truc
- trang: piano/thi-tau
  id: n32
  cau: "Trung cấp: minuet trong Notebook for Anna Magdalena Bach, sonatina, Album for the Young của Schumann."
  loai: danh-muc
- trang: piano/thi-tau
  id: n34
  cau: "Chuẩn bị thi: Đề mẫu thị tấu của ABRSM; đề cương thi piano của Trinity (thị tấu là một trong các bài thi phụ)."
  loai: cau-truc
- trang: piano/thi-tau
  id: n35
  cau: "Sight Reading Factory: tạo bài đọc mới theo cấp độ."
  loai: cau-truc
- trang: piano/thi-tau
  id: n43
  cau: "Câu hỏi 1: hai nốt cùng nằm trên dòng kẻ, giữa chúng có đúng một dòng khác: quãng 5 (dòng sang dòng kế tiếp là quãng 3; dòng sang dòng cách một là quãng 5)."
  loai: quy-tac
- trang: piano/thi-tau
  id: n47
  cau: Andreas C. Lehmann, Victoria McArthur, "Sight-reading", trong Richard Parncutt, Gary E. McPherson (chủ biên), The Science and Psychology of Music Performance (Oxford University Press, 2002).
  loai: ten
- trang: piano/thi-tau
  id: n48
  cau: Paul Harris, Improve your sight-reading! (Faber Music), loạt sách piano theo cấp.
  loai: ten
- trang: piano/thi-tau
  id: n49
  cau: Béla Bartók, Mikrokosmos (Boosey & Hawkes).
  loai: ten
- trang: piano/thi-tau
  id: n50
  cau: Anton Diabelli, Melodious Exercises Op. 149 cho piano bốn tay.
  loai: ten
- trang: piano/thi-tau
  id: n51
  cau: "ABRSM: đề mẫu thị tấu; Trinity College London: đề cương thi piano."
  loai: cau-truc
- trang: piano/thi-tau
  id: n52
  cau: Sight Reading Factory (liên kết).
  loai: ten
- trang: piano/thi-tau
  id: n17
  cau: Thẻ che; chơi một nhìn một; tập với máy đếm nhịp chậm.
  loai: khuyen-tap
- trang: piano/thi-tau
  id: n33
  cau: "Nâng cao: hợp xướng bốn bè (chorale) của Bach; đệm cho ca sĩ hoặc nhạc cụ khác; song tấu bốn tay của Schubert, Dvořák, Brahms; đọc bốn bè trên hai khuông là cách luyện đọc hòa âm rất tốt."
  loai: khuyen-tap
- trang: piano/thi-tau
  id: n15
  cau: Khi thị tấu, giữ nhịp quan trọng hơn đúng từng nốt; chọn tốc độ đủ chậm để không phải dừng; đếm suốt bài; nhận ra nhanh các hình tiết tấu quen thuộc.
  loai: khuyen-tap
- trang: piano/hoa-am/dem-giai-dieu
  id: d3
  cau: Ở Đô trưởng mỗi nốt của gam nằm trong ít nhất một trong ba hợp âm chính I, IV, V; bảng bậc, nốt, hợp âm chính và hợp âm khác (vi, ii, V7).
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d4
  cau: Câu dừng ở bậc 2, 5 hoặc 7 thường là kết nửa (V); câu về chủ âm sau bậc 2 hoặc 7 là kết trọn (V–I).
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d5
  cau: "Nốt ngắn ở phách yếu, đi liền bậc, thường là nốt lướt hoặc nốt thêu: bỏ qua, giữ hợp âm cũ."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d6
  cau: "Khi một nốt thuộc hai hợp âm, chọn theo chức năng: chủ → hạ át → át → chủ; tránh đi từ V sang IV."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d7
  cau: "Au clair de la lune, câu đầu: ô 1 Đô–Đô–Đô là I, Rê ở phách 4 là nốt lướt lên Mi; ô 2 Mi (I) rồi Rê (V); ô 3 Đô–Mi (I) rồi Rê–Rê (V); ô 4 Đô (I), kết trọn."
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d9
  cau: "Si–Fa–Sol cộng với Rê của giai điệu là đủ bốn nốt của V7, và cả câu tay trái chỉ đổi hai nốt: Đô với Si, Mi với Fa."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d11
  cau: Nhịp hòa âm là tốc độ đổi hợp âm.
  loai: dinh-nghia
- trang: piano/hoa-am/dem-giai-dieu
  id: d12
  cau: Trong nhạc cổ điển nhịp hòa âm thường đều (một hợp âm mỗi ô, hoặc mỗi nửa ô) và nhanh lên ở cuối câu, nơi kết cần hai hợp âm liền nhau.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d14
  cau: "Ode to Joy: ô 1–3 và 5–7 mỗi ô một hợp âm, ô 4 và 8 có hai; ở ô 4 Mi chấm dôi thuộc I, Rê móc đơn vang sớm nửa phách so với V, rồi V giữ hai phách cuối (kết nửa); ô 8 là V rồi I (kết trọn), Đô móc đơn cũng là nốt đón trước; ô 2 và 6 giai điệu đi qua Fa nên V thành V7."
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d15
  cau: Nốt đón trước là nốt thuộc hợp âm kế tiếp nhưng vang sớm hơn.
  loai: dinh-nghia
- trang: piano/hoa-am/dem-giai-dieu
  id: d18
  cau: "Bass chỉ gồm nốt gốc thì nhảy liên tục: Đô–Sol–Đô–Sol; một bè bass tốt đi liền bậc khi có thể, nhờ hợp âm đảo và các hợp âm thay thế."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d19
  cau: V6 là Sol–Si–Rê với Si ở bass.
  loai: dinh-nghia
- trang: piano/hoa-am/dem-giai-dieu
  id: d21
  cau: "vi (La–Đô–Mi) thay I: chung hai nốt Đô, Mi, mang màu thứ."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d22
  cau: "ii6 (Rê–Fa–La, Fa ở bass) thay IV: chung hai nốt Fa, La."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d24
  cau: Cadential 6/4 có thể đứng trước V ở kết nửa.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d25
  cau: "Giữa bass và giai điệu: đi ngược hướng, hoặc song song quãng 3, 6, 10; không song song quãng 5 hay quãng 8."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d26
  cau: Bass đi xuống từng bậc Đô–Si–La–Sol, ngược với những đoạn giai điệu đi lên; cả bè nằm gọn trong một thế tay trái, ngón 5 trên Fa2 và ngón 1 trên Đô3.
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d32
  cau: "Tay trái không nhân đôi nốt giai điệu đang chuyển động: nếu giai điệu hát La–Sol trên IV–I mà tay trái cũng có La–Sol, hai bè chạy song song quãng 8; bỏ nốt trùng khỏi tay trái (Đô–Fa thay cho Đô–Fa–La)."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d35
  cau: Ah! vous dirai-je, maman (Mẹ ơi, con kể mẹ nghe; tiếng Anh là Twinkle, Twinkle, Little Star).
  loai: ten
- trang: piano/hoa-am/dem-giai-dieu
  id: d36
  cau: "Giai điệu Ah! vous dirai-je ở Sol trưởng: G G d d | e e d2 | c c B B | A A G2 | d d c c | B B A2 | d d c c | B B A2 | G G d d | e e d2 | c c B B | A A G2."
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d37
  cau: "Ở Sol trưởng: I = Sol–Si–Rê, IV = Đô–Mi–Sol, V = Rê–Fa♯–La (V7 thêm Đô)."
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d38
  cau: "Gợi ý đáp án: hợp âm và bass từng ô của 12 ô (ô 1 I; 2–3 IV–I; 4 V–I; 5 I–V7; 6 I–V; 7 I6–IV; 8 I–V; 9–12 như 1–4); nhịp hòa âm đều hai hợp âm mỗi ô, trừ ô 1 và 9."
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d39
  cau: Mi ở ô 2 chỉ có trong IV (trong ba hợp âm chính), nên ô 2 phải là IV–I; ở ô 5, Đô là nốt 7 của V7.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d40
  cau: "Ô 7 không lặp ô 5: nếu bass về Sol, giai điệu La–Rê và bass Rê–Sol tạo hai quãng 5 liền nhau; bass Si (I6) rồi Đô (IV) tránh được và cho bè bass đi liền bậc."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d43
  cau: "Viết giai điệu bằng số (Ode to Joy: 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2) và hợp âm bằng số La Mã (I | V7 | I | I V), rồi đặt vào giọng mới."
  loai: cau-truc
- trang: piano/hoa-am/dem-giai-dieu
  id: d44
  cau: Ở La thứ, Ode to Joy bắt đầu bằng Đô–Đô–Rê–Mi; I thành i (La–Đô–Mi); V vẫn là hợp âm trưởng Mi–Sol♯–Si, dù giai điệu không có Sol♯.
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q1
  cau: "Quiz 1: ở Đô trưởng, nốt Rê nằm trong hợp âm chính V (Sol–Si–Rê); Rê cũng có trong ii và V7."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q2
  cau: "Quiz 2: Au clair de la lune ô 1, Rê ở phách 4 là nốt lướt, giữ hợp âm I; Rê ngắn, ở phách yếu, đi liền bậc từ Đô lên Mi."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q3
  cau: "Quiz 3: nhịp hòa âm thường nhanh hơn ở cuối câu, thường hai hợp âm trong ô kết, như ô 4 (I–V) và ô 8 (V–I) của Ode to Joy."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q4
  cau: "Quiz 4: trong bản đệm Ode to Joy với bass Đô–Si–La–Sol, hợp âm ở ô 2 là V6 (Sol–Si–Rê, Si ở bass); Si là nốt ba của V, đặt ở bass để bass đi liền bậc."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: q5
  cau: "Quiz 5: giai điệu hát La–Sol trên IV–I, tay trái đang chơi Đô–Fa–La: nên bỏ La khỏi tay trái, vì nếu tay trái cũng đi La–Sol nó chạy song song quãng 8 với giai điệu."
  loai: quy-tac
- trang: piano/hoa-am/dem-giai-dieu
  id: d47
  cau: "Nguồn: Lancaster, Renfrow, Alfred's Group Piano for Adults (Alfred); Kostka, Payne, Tonal Harmony (McGraw-Hill); Aldwell, Schachter, Harmony and Voice Leading, kèm điều từng sách đóng góp."
  loai: ten
- trang: piano/hoa-am/dem-giai-dieu
  id: d27
  cau: "Chuyển sang Sol trưởng: bass Sol–Fa♯–Mi–Rê, rồi Sol–Fa♯–Mi–Đô–Rê–Sol."
  loai: khuyen-tap
- trang: piano/hoa-am/dem-giai-dieu
  id: d17
  cau: 'Thí nghiệm: giữ I suốt ô 4, bỏ V; câu hỏi không còn "hỏi" nữa; trả V về phách 3 và nghe lại. Tay trái ngón 1 trên Đô3, ngón 4 trên Sol2; tập riêng rồi ghép ở ♩ = 72, sau đó 88.'
  loai: khuyen-tap
- trang: piano/hoa-am/dem-giai-dieu
  id: d29
  cau: "Bảng chọn hình đệm theo tính chất giai điệu: hợp âm khối cho nhạc chậm trang nghiêm, nốt trầm và hợp âm cho nhịp 3/4 nhún nhảy, bass Alberti cho giai điệu vừa phải trong trẻo, hợp âm rải rộng với bàn đạp cho nhạc chậm ngân dài."
  loai: khuyen-tap
- trang: piano/hoa-am/ket
  id: n4
  cau: Bè bass là nốt trầm nhất; ở các tiến trình đầu trang là nốt gốc của hợp âm (trừ I6/4 và ii6).
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n8
  cau: Nốt chung của hai hợp âm giữ nguyên; các nốt khác đi đến nốt gần nhất của hợp âm mới, thường là một bước liền.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n9
  cau: Cảm âm (Si ở Đô trưởng) đi lên chủ âm; nốt 7 của V7 (Fa) đi xuống.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n10
  cau: "Không để hai bè đi song song quãng 5 hoặc quãng 8: hai bè nhập làm một và mất tính độc lập."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n11
  cau: Giữ quy tắc 1 và 2 thì hầu như tự tránh được.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n16
  cau: "Kết trọn: V và I đều ở thể gốc, bè trên về chủ âm."
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n17
  cau: "Khi bè trên dừng ở nốt ba hoặc nốt năm của hợp âm I thì đó là kết chưa trọn: đã kết nhưng còn hơi mở."
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n18
  cau: Kết nửa dừng ở V, như một dấu phẩy hay một câu hỏi.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n19
  cau: "Kết nửa I–vi–IV–V: Mi và Đô giữ nguyên khi sang vi (La–Đô–Mi), rồi Mi lên Fa ở IV."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n20
  cau: Kết plagal IV–I, tiếng "A-men" cuối thánh ca; nốt Đô trên cùng giữ suốt, chỉ hai nốt dưới đổi.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n21
  cau: "Kết lừa V–vi: tai chờ I nhưng nhạc rẽ sang La thứ."
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n22
  cau: Ở kết lừa, Si lên Đô, Rê xuống Đô, Sol xuống Mi nên hợp âm vi có hai nốt Đô; đừng đưa Sol lên La vì sẽ song song quãng 8 với bass Sol–La.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n23
  cau: Sau kết lừa, câu nhạc phải nói tiếp; ở đây nó đi qua ii6–V7 để về kết trọn.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n24
  cau: Kết lừa ở Sol trưởng có vi là Mi thứ (Mi–Sol–Si); ở Fa trưởng vi là Rê thứ (Rê–Fa–La).
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n26
  cau: Hợp âm I6/4 (Đô–Mi–Sol với Sol ở bass, thể đảo 2) nghe như một V còn đang "treo", và chỉ yên khi Mi xuống Rê, Đô xuống Si.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n27
  cau: "Hợp âm 6/4 ở kết (cadential 6/4): trong concerto thời Cổ điển, cadenza của nghệ sĩ độc tấu thường bắt đầu từ chính hợp âm này."
  loai: lich-su
- trang: piano/hoa-am/ket
  id: n28
  cau: I6/4 đứng ở phách mạnh hơn V theo sau nó.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n29
  cau: Bass giữ nguyên Sol từ I6/4 sang V.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n30
  cau: Nốt cách bass quãng 6 (Mi) xuống quãng 5 (Rê); nốt cách bass quãng 4 (Đô) xuống quãng 3 (Si); nốt Sol, nhân đôi bass, giữ nguyên ("sáu xuống năm, bốn xuống ba").
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n32
  cau: "Bè trên cùng của từng vị trí: Đô–Đô–Si–Đô, Mi–Fa–Rê–Mi, Sol–La–Sol–Sol; bè này đi bước liền hoặc đứng yên, trừ một chỗ: Fa xuống Rê ở vị trí quãng 3."
  loai: cau-truc
- trang: piano/hoa-am/ket
  id: n34
  cau: ii6 là Rê–Fa–La với Fa ở bass.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n35
  cau: ii6 chung hai nốt với IV (Fa, La) nên thay được IV; chỗ khác duy nhất là nốt Rê thay cho nốt Đô.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n36
  cau: "Nốt Fa của tay phải giữ nguyên sang V7 và trở thành nốt 7, rồi đi xuống Mi: nốt Fa đã có sẵn từ hợp âm trước."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n37
  cau: "Ở vị trí quãng 5, đi thẳng từ Đô–Mi–Sol lên Rê–Fa–La sẽ tạo quãng 5 song song (Đô–Sol lên Rê–La); vì vậy tay phải đi xuống: bè trên hát Sol–Fa–Fa–Mi và kết ở nốt ba, một kết chưa trọn."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n38
  cau: Ở giọng thứ, ba hợp âm chính là i, iv và V.
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n39
  cau: "Hợp âm V ở giọng thứ phải là hợp âm trưởng, với cảm âm lấy từ gam thứ hòa âm: ở La thứ là Sol♯, nên V là Mi–Sol♯–Si."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n40
  cau: "ii6 ở giọng thứ thành ii°6: Si–Rê–Fa, hợp âm giảm, Rê ở bass."
  loai: dinh-nghia
- trang: piano/hoa-am/ket
  id: n41
  cau: Một bè đi từ Fa lên Sol♯ là quãng 2 tăng, khó hát và nghe lạ.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n42
  cau: Trong các hình ở La thứ, Fa luôn đi xuống Mi; Sol♯ đến từ La hoặc Si ở phía trên.
  loai: cau-truc
- trang: piano/hoa-am/ket
  id: n45
  cau: Ở Mi thứ cảm âm là Rê♯ và ở Rê thứ là Đô♯.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n48
  cau: Quên nâng cảm âm thì V thành hợp âm thứ, nhất là ở những giọng có cảm âm "lạ" như Mi♯ (Fa♯ thứ) hay Fa thăng kép (Sol♯ thứ).
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n49
  cau: Thứ tự đi quanh vòng quãng 5, xen kẽ phía thăng và phía giáng, mỗi lần thêm một dấu hóa; mỗi tuần một cặp giọng trưởng và thứ cùng hóa biểu.
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n50
  cau: "Bảng cảm âm giọng thứ: Sol♯, Rê♯, Đô♯, La♯, Fa♯, Mi♯, Si♮, Si♯, Mi♮, Fa thăng kép, La♮, Đô thăng kép (hoặc Rê♮)."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q1
  cau: "Quiz 1: ở Đô trưởng, tay phải bắt đầu bằng Sol–Đô–Mi là vị trí quãng 3 (gọi theo nốt trên cùng; Mi là nốt ba của hợp âm Đô)."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q2
  cau: "Quiz 2: trong I–IV–V–I chỉ vị trí quãng 8 cho kết trọn, vì chỉ ở đó bè trên cùng về chủ âm; kết trọn cần V–I ở thể gốc và bè trên về chủ âm, hai vị trí kia dừng ở nốt ba hoặc nốt năm."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q3
  cau: "Quiz 3: ở I6/4 trong I–IV–I6/4–V–I tay phải chơi đúng hình hợp âm I trong khi tay trái đã sang át âm; sau đó Mi xuống Rê, Đô xuống Si: sáu xuống năm, bốn xuống ba."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q4
  cau: "Quiz 4: trong kết lừa V–vi ở Đô trưởng, nốt Đô có hai lần trong hợp âm vi; Si lên Đô, Rê xuống Đô; đưa Sol lên La sẽ tạo quãng 8 song song với bass."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: q5
  cau: "Quiz 5: ở La thứ hợp âm V là Mi–Sol♯–Si; cảm âm Sol♯ lấy từ gam thứ hòa âm, kéo lên chủ âm La."
  loai: quy-tac
- trang: piano/hoa-am/ket
  id: n54
  cau: "Nguồn: Palmer, Manus, Lethco, The Complete Book of Scales, Chords, Arpeggios & Cadences (Alfred); Kostka, Payne, Tonal Harmony (McGraw-Hill); Aldwell, Schachter, Harmony and Voice Leading, kèm điều từng sách đóng góp."
  loai: ten
- trang: piano/hoa-am/ket
  id: n13
  cau: Hãy tập cả ba vị trí, vì khi đệm cho một giai điệu, nốt giai điệu nằm trên cùng sẽ chọn vị trí cho bạn.
  loai: khuyen-tap
- trang: piano/hoa-am/ket
  id: n46
  cau: Tay trái luôn là chủ âm (ngón 1), hạ át âm thấp hơn một quãng 5 (ngón 5), át âm (ngón 4); đặt chủ âm trong khoảng Sol2–Fa♯3 để bass không quá đục.
  loai: khuyen-tap
- trang: piano/hoa-am/ket
  id: n47
  cau: Hình và ngón của tay phải giống nhau ở mọi giọng, chỉ phím đen thay đổi; gặp phím đen, đẩy cả bàn tay vào sâu giữa các phím đen; khi chơi hợp âm, ngón cái đặt trên phím đen là bình thường.
  loai: khuyen-tap
- trang: piano/hoa-am/mau-galant
  id: n1
  cau: "Mẫu (schema) là một khung hai bè: bass đi theo một chuỗi bậc, giai điệu theo một chuỗi bậc khác, khớp nhau từng bước."
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n2
  cau: Gjerdingen, trong Music in the Galant Style (2007), đã gom và đặt tên cho nhiều khung như thế.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n3
  cau: 'Mô tả cũ: Gjerdingen gom "vài chục khung".'
  loai: so-lieu
- trang: piano/hoa-am/mau-galant
  id: n4
  cau: 'Phong cách galant là lối viết thanh nhã của thế kỷ 18 mà Mozart thời trẻ cũng viết theo (cũ: "Haydn và Mozart lớn lên cùng").'
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n5
  cau: Gjerdingen gọi các mẫu là "câu nhạc có sẵn" (stock musical phrases).
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n6
  cau: "Fonte (suối), Monte (núi), Ponte (cầu): nghĩa các tên tiếng Ý."
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n7
  cau: Fonte, Monte, Ponte là cách gọi của nhà lý luận Joseph Riepel.
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n8
  cau: Riepel là "nhà lý luận người Áo" (cũ).
  loai: nam
- trang: piano/hoa-am/mau-galant
  id: n9
  cau: Riepel là tác giả các sách lý luận in từ năm 1752.
  loai: nam
- trang: piano/hoa-am/mau-galant
  id: n10
  cau: Fonte và Monte là những chuỗi hòa âm (sequence) ngắn.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n11
  cau: Meyer là tên đặt theo nhà âm nhạc học Leonard Meyer.
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n12
  cau: Romanesca mượn tên một công thức bass đã được nhắc đến từ thế kỷ 16 và phổ biến trong thế kỷ 17.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n13
  cau: Gjerdingen tìm câu trả lời cho việc cả thế hệ dùng chung khung ở lối dạy partimento tại các nhạc viện Napoli.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n14
  cau: 'Conservatorio là trường ở Napoli, Venezia và vài thành phố Ý, nơi trẻ em được "gìn giữ" (conserved) và học nhạc (cũ: "trẻ mồ côi khắp châu Âu").'
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n15
  cau: Lối dạy partimento nở rộ ở các nhạc viện Ý trong thế kỷ 17–18.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n16
  cau: Partimento là một bè bass viết trên một khuông, có khi kèm số, có khi không.
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n17
  cau: Học trò ngồi vào đàn và biến partimento thành nhạc hoàn chỉnh, tự thêm hòa âm và giai điệu.
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n18
  cau: Học trò học thuộc cách hòa âm cho từng bậc bass (quy tắc quãng tám), các kiểu kết, các chuỗi bass hay gặp.
  loai: quy-tac
- trang: piano/hoa-am/mau-galant
  id: n19
  cau: Francesco Durante và Fedele Fenaroli là những thầy làm partimento.
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n20
  cau: "Một chuỗi bass quen tự gọi ra một giai điệu quen: đó là các mẫu dưới đây."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n21
  cau: Ví dụ viết ba bè (giai điệu, một bè giữa, bass), mỗi bước một ô 3/4; riêng bốn kết mỗi bước một phách trong 4/4.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n22
  cau: "Romanesca: giai điệu 1–5–1–1, bass 1–7–6–3, hòa âm I – V6 – vi – I6, mở đầu."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n23
  cau: "Do–Re–Mi: giai điệu 1–2–3, bass 1–7–1, hòa âm I – V6 – I, mở đầu."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n24
  cau: "Meyer: giai điệu 1–7 … 4–3, bass 1–2 … 7–1, hòa âm I – V4/3 … V6/5 – I, mở đầu."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n25
  cau: "Prinner: giai điệu 6–5–4–3, bass 4–3–2–1, hòa âm IV – I6 – vii°6 – I; đứng ở vị trí trả lời."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n26
  cau: "Fonte: giai điệu 5–4 … 4–3, bass ♯1–2 … 7–1 (hòa âm V6/5 của ii – ii … V6/5 – I)."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n27
  cau: "Monte: giai điệu ♭7–6 … 1–7, bass 3–4 … ♯4–5."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n28
  cau: "Ponte: giai điệu 5–7–2 trên bass giữ nguyên bậc 5."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n29
  cau: "Quiescenza: giai điệu ♭7–6–♮7–1 trên bass chủ âm giữ nguyên, đến sau kết."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n30
  cau: Fonte, Monte và Ponte thường đứng ngay sau vạch nhắc lại (Fonte đi xuống, Monte đi lên, Ponte chờ trên át âm).
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n31
  cau: Hòa âm của Monte đọc là V6/5 của IV – IV … V6/5 của V – V.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n32
  cau: Hòa âm của Quiescenza đọc là V7 của IV – IV6/4 – V7 – I, trên âm nền chủ âm.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n33
  cau: Romanesca đứng đầu bài hay đầu câu; bảng OMT xếp nó vào nhóm "nước khai cuộc" (opening gambit).
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n34
  cau: Romanesca thường được một Prinner trả lời.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n35
  cau: "Romanesca có hai dạng bass cũ: dạng nhảy (xuống quãng 4 xen lên một bậc: 1–5–6–3) và dạng đi liền (bass đi bậc xuống)."
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n36
  cau: Theo Gjerdingen, dạng nhảy đặc trưng cho thế kỷ 17 và đầu thế kỷ 18, dạng đi liền cho cuối thế kỷ 18.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n37
  cau: "Bass galant 1–7–6–3 là dạng lai: phần đầu giống dạng đi liền, phần sau giống dạng nhảy."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n40
  cau: 'Các dòng "Giọng khác": Romanesca ở Sol và Fa, Do–Re–Mi ở Đô và Rê, Meyer, Prinner, Fonte, Monte, Ponte, Quiescenza ở Sol (Prinner thêm Fa).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n41
  cau: 'Do–Re–Mi: hai ô sau của ví dụ là biến thể soạn riêng cho trang, bass đi 1–5–1 (cũ: "bass cũng có thể đi 1–5–1" như một dạng của mẫu).'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n42
  cau: Nốt Mi cuối của Do–Re–Mi có thể làm nốt đầu của một Prinner chuyển giọng; Meyer cũng kết ở Mi trên Đô nên gối vào Prinner được.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n43
  cau: Với bốn bè, ô 2 của Meyer là V4/3; ví dụ ba bè bỏ nốt Sol nên còn Rê – Fa – Si.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n44
  cau: Cùng nhóm với Meyer, OMT kể thêm Pastorella, Jupiter và Aprile; mẫu nào cũng bắt đầu ở chủ âm, rời đi hai bước rồi về chủ âm. Jupiter có giai điệu 1–2–4–3 trên bass 1–7–5–1.
  loai: danh-muc
- trang: piano/hoa-am/mau-galant
  id: n45
  cau: "Prinner: hai bè song song quãng 10 suốt bốn bước; giai điệu dừng ở bậc 3 nên chưa phải kết trọn."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n46
  cau: Biến thể của Prinner chen một át âm thể gốc trước nốt cuối (bass 4–3–2–5–1).
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n47
  cau: "Prinner chuyển giọng: giai điệu 3–2–1–7 trên bass 1–7–6–5, nghe như 6–5–4–3 trên 4–3–2–1 của giọng Sol; đưa nhạc từ giọng chủ sang giọng át; Fa♯ ở ô 7 là cánh cửa sang giọng át."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n48
  cau: 'Cũ: Prinner là mẫu "phản đòn" (riposte) của Romanesca, và ô 3 là V4/3.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n49
  cau: "Fonte đi xuống hai bậc thang: cặp át–chủ nhỏ ở Rê thứ (ii), rồi cùng cặp ấy ở Đô trưởng, thấp hơn một cung; giai điệu 4–3 trên bass 7–1 trong mỗi giọng tạm; Đô♯ là cảm âm tạm của Rê thứ."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n50
  cau: 'Fonte, tập ở đàn: tay phải chơi hai quãng lặp lại (cũ: "quãng 10") — Sol trên Đô♯ là quãng 5 giảm, mở ra Fa trên Rê là quãng 3.'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n51
  cau: "Monte là Fonte đi lên: cặp át–chủ ở Fa trưởng (IV), rồi ở Sol trưởng (V), cao hơn một cung; Si♭ hướng tai về Fa, Fa♯ về Sol."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n52
  cau: 'Cũ: Monte hợp "bất cứ chỗ nào nhạc cần dâng lên".'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n53
  cau: 'Ponte đứng yên trên át âm; trong ví dụ giai điệu thêm 4 (nốt 7 của V7) rồi rơi xuống 3 khi chủ âm trở về (cũ ở bảng: "5–7–2(–4)").'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n54
  cau: Ponte còn gặp "ngay trước khi chủ đề đầu trở lại".
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n55
  cau: Bảng OMT liệt kê ba kết trọn khác nhau ở độ dài của át âm (cadenza semplice, composta, doppia) và một kết nửa, kết hội tụ (converging cadence, còn gọi kết nửa fa–fi–sol).
  loai: danh-muc
- trang: piano/hoa-am/mau-galant
  id: n56
  cau: "Cadenza semplice: bass 3–4–5–1, giai điệu 1–2–2–1, át âm chỉ một bước."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n57
  cau: "Cadenza composta: bass 3–4–5–5–1, giai điệu 1–2–3–2–1, bass giữ 5 hai bước (6/4 ở kết rồi V)."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n58
  cau: "Cadenza doppia: bass giữ 5 bốn bước rồi 1, giai điệu 4–3–2–2–1, bè giữa 5–4–4–3."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n59
  cau: "Kết hội tụ: bass 3–4–♯4–5, giai điệu 3–2–1–7; là kết nửa dừng trên át âm."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n61
  cau: Quiescenza đến sau kết; bass giữ chủ âm; giai điệu ♭7–6–♮7–1.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n62
  cau: "Quiescenza: bè giữa 3–4–4–3."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n63
  cau: 'Cũ: Quiescenza như "một lời chào".'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n64
  cau: "Quiescenza (sự lắng yên): nghĩa của tên."
  loai: ten
- trang: piano/hoa-am/mau-galant
  id: n65
  cau: "Một câu nhạc galant thường đi: mẫu mở đầu, mẫu trả lời, kết."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n66
  cau: Ở Fonte và Monte, hình tay không đổi ở mọi giọng; Prinner luôn là quãng 10; Fonte và Monte là quãng 5 giảm mở ra quãng 3, hai lần.
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n67
  cau: 'Romanesca ở giọng thứ: bass La – Sol♯ – Fa – Đô ở La thứ, nhớ nâng cảm âm (cũ: "dùng được ở giọng thứ").'
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n68
  cau: "Các mẫu ở giọng Sol trưởng trong ví dụ ghép (Do–Re–Mi, Prinner chuyển giọng, kết ở Sol): ô 7 là Sol – Si trên bass Rê (6/4 ở kết) rồi Fa♯ – La (V)."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n74
  cau: 'Tiêu đề (cũ: "tám khung thông dụng nhất"): trang dạy tám khung quen thuộc.'
  loai: so-lieu
- trang: piano/hoa-am/mau-galant
  id: n79
  cau: "Câu hỏi 1: bass Romanesca đi theo 1–7–6–3 (giai điệu 1–5–1–1, I – V6 – vi – I6)."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n80
  cau: "Câu hỏi 2: Prinner giai điệu và bass song song quãng 10, nên không bao giờ thành quãng 5 hay quãng 8 song song."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n81
  cau: "Câu hỏi 3: Fonte đi xuống (qua ii về I), Monte đi lên (qua IV lên V); mỗi cặp át–chủ có giai điệu 4–3 trên bass 7–1 của giọng tạm."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n82
  cau: "Câu hỏi 4: Quiescenza thường đứng sau kết cuối, trên âm nền chủ âm."
  loai: cau-truc
- trang: piano/hoa-am/mau-galant
  id: n83
  cau: 'Câu hỏi 5: partimento là một bè bass, có hoặc không có số, để học trò hoàn thiện thành nhạc ngay trên bàn phím; công cụ dạy ở các nhạc viện Napoli thế kỷ 18, nơi các mẫu galant được truyền từ thầy sang trò (cũ: "quan trọng").'
  loai: dinh-nghia
- trang: piano/hoa-am/mau-galant
  id: n84
  cau: Gjerdingen, Music in the Galant Style, Oxford University Press, 2007.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n85
  cau: Gjerdingen, Child Composers in the Old Conservatories (OUP, 2020); Sanguinetti, The Art of Partimento (OUP, 2012); Mortensen, The Pianist's Guide to Historic Improvisation (OUP, 2020).
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n86
  cau: partimenti.org là trang của Gjerdingen, nguồn partimento lịch sử.
  loai: lich-su
- trang: piano/hoa-am/mau-galant
  id: n75
  cau: Học xong, bạn có sẵn vốn từ để ứng tác và nhận ra chúng trong minuet, sonatina, sonata bạn đang tập.
  loai: khuyen-tap
- trang: piano/hoa-am/mau-galant
  id: n70
  cau: "Tập trong mọi giọng: bắt đầu từ bass và nói bậc; đi theo vòng quãng 5; bảng tuần 1–4 giọng trưởng và giọng thứ; sau đó thêm Mi, La♭, Si, Rê♭, Fa♯."
  loai: khuyen-tap
- trang: piano/hoa-am/mau-galant
  id: n72
  cau: Kế hoạch 4 tuần (bảng việc và mục tiêu) và danh sách "Sẵn sàng đi tiếp khi".
  loai: khuyen-tap
- trang: piano/hoa-am/ung-tac
  id: n2
  cau: 'Cũ: "Mọi ứng tác cổ điển bắt đầu từ một khung"; nay "thường bắt đầu".'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n3
  cau: 'Cũ: nốt khung ở mỗi ô "là một dấu hiệu rất quen của nhạc thế kỷ 18".'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n5
  cau: Nốt lướt đi bậc liền từ một nốt hợp âm sang một nốt hợp âm khác, theo một hướng (Sol – Fa – Mi).
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n6
  cau: Nốt thêu rời một nốt hợp âm một bậc rồi quay về chính nó (Mi – Rê – Mi).
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n8
  cau: Đến kết có thể thêm láy rền trên bậc 2 khi bass ở át âm.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n10
  cau: 'Láy rền bắt đầu từ nốt trên (Mi, trên Rê của ví dụ), theo C. P. E. Bach (Versuch, 1753); cũ: "Theo lệ thời Cổ điển".'
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n11
  cau: "Hai lời khuyên: phách 1 giữ một nốt hợp âm, nốt ngoài hợp âm đặt ở phách yếu (trong bài tập này)."
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n12
  cau: "Đừng để nốt trang trí che quãng 8 hay quãng 5 song song giữa giai điệu và bass: thêm một vài nốt không làm mất lỗi ấy."
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n13
  cau: "Cũ: hai ô liền nhau không được bắt đầu bằng cùng một quãng 5 hay quãng 8."
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n15
  cau: Mozart viết 12 biến tấu trên giai điệu Pháp Ah! vous dirai-je, maman.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n17
  cau: Tác phẩm mang số K. 265 (300e).
  loai: so-lieu
- trang: piano/hoa-am/ung-tac
  id: n18
  cau: Người ta từng cho rằng nó viết ở Paris năm 1778; phân tích bản thảo của Wolfgang Plath cho thấy khoảng 1781–1782 mới đúng hơn.
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n19
  cau: Bản in đầu tiên ra năm 1785 ở Vienna.
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n20
  cau: 'Cũ: giai điệu "in lần đầu năm 1761".'
  loai: nam
- trang: piano/hoa-am/ung-tac
  id: n21
  cau: Chủ đề ở Đô trưởng gồm ba đoạn A–B–A, mỗi đoạn tám ô nhịp 2/4 trong bản của Mozart.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n22
  cau: Viết lại ở 4/4 thì mỗi đoạn bốn ô, cả chủ đề mười hai ô; bốn ô đầu của chủ đề trong khối abc 2 trùng với bài 2 của 10 bài đầu tiên.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n23
  cau: Biến tấu 1 phủ giai điệu bằng chuỗi móc kép tay phải; biến tấu 2 chuyển chuyển động nhanh xuống tay trái.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n24
  cau: Biến tấu 8 là biến tấu duy nhất ở giọng thứ (Đô thứ); biến tấu 11 là Adagio; biến tấu 12 (Allegro) đổi sang 3/4 và khép bằng coda (cũng là đáp án và giải thích câu hỏi 2 của phần Kiểm tra nhanh).
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n25
  cau: "Biến tấu A, B, C soạn cho trang: A móc đơn bằng nốt thêu và nốt hợp âm; B giữ giai điệu, tay trái Alberti; C sang Đô thứ (La♭, Mi♭), tay trái thành bè đối nhỏ."
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n29
  cau: Ô 2–3 của chủ đề (La – La – Sol, Fa – Fa – Mi – Mi) đi 6–5–4–3, đúng giai điệu của Prinner; đặt dưới nó bass Fa – Mi – Rê – Đô.
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n31
  cau: 'Câu nhạc cổ điển hay đi thành cặp: câu hỏi thường dừng ở át âm bằng một kết nửa; câu trả lời thường bắt đầu giống câu hỏi rồi rẽ về chủ âm bằng một kết trọn (cũ: "dừng… bắt đầu giống hệt").'
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n32
  cau: Hai câu tạo thành một đoạn nhạc (period); link đã đổi từ bài 31 sang bài 13, mục câu nhạc và đoạn nhạc.
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n33
  cau: "Ví dụ câu hỏi và câu trả lời: cả hai câu mở bằng Do–Re–Mi; câu hỏi dừng bằng kết hội tụ; câu trả lời về nhà qua I6/4 – V – I."
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n34
  cau: "Bài partimento đầu tiên của bạn: mười sáu ô bè bass, tên mẫu ghi phía trên; nửa đầu có giai điệu mẫu, nửa sau chỉ có khung."
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n35
  cau: "Bảng minuet: ô 1–4 Romanesca (bass Đô – Si – La – Mi, giai điệu 1–5–1–1), ô 5–8 Prinner chen át âm (Fa – Mi – Rê, Sol – Đô; 6–5–4–3), ô 9–12 Fonte (Đô♯ – Rê – Si – Đô; 5–4–4–3), ô 13–16 cadenza composta (Mi – Fa – Sol – Đô; 1–2–3–2–1)."
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n36
  cau: C. P. E. Bach in những sonata ghi sẵn các lần nhắc lại đã được biến đổi.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n37
  cau: Thời ấy, đổi khác khi nhắc lại là chuyện bình thường.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n39
  cau: "Thế kỷ 18 và 19, nghệ sĩ đàn phím thường không vào bài một cách đột ngột mà dạo đầu (preluding): vài hợp âm, một đường rải hay gam, một kết."
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n40
  cau: "Mục đích dạo đầu: báo giọng, thử đàn và căn phòng, làm ấm tay, nối hai bài khác giọng."
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n41
  cau: 'Carl Czerny in một tập 120 ví dụ gồm đoạn dạo đầu, chuyển giọng, kết và fantasia: Die Kunst des Präludierens (Nghệ thuật dạo đầu), Op. 300 (cũ: "120 đoạn dạo đầu mẫu… nhiều đoạn chưa đến một phút").'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n42
  cau: Nghệ thuật dạo đầu là bản dịch tên Die Kunst des Präludierens.
  loai: ten
- trang: piano/hoa-am/ung-tac
  id: n43
  cau: Sang thế kỷ 20, thói quen dạo đầu thưa dần trên sân khấu hòa nhạc; ở nhà, ở lớp, hay chơi cho bạn bè vẫn dùng được.
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n46
  cau: "Ô 2 của dạo đầu là Quiescenza ở Sol trưởng: giai điệu Fa♮ – Mi – Fa♯ – Sol, bè giữa Si – Đô – Đô – Si."
  loai: cau-truc
- trang: piano/hoa-am/ung-tac
  id: n48
  cau: Với bài ở giọng thứ, nâng cảm âm trong hợp âm V.
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n55
  cau: "Câu hỏi 1: nốt thêu rời một nốt hợp âm một bậc rồi quay về chính nó; nốt lướt đi bậc liền giữa hai nốt hợp âm."
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n56
  cau: "Câu hỏi 3: câu hỏi dừng ở V (kết nửa), câu trả lời về I (kết trọn); câu trả lời thường bắt đầu giống câu hỏi."
  loai: dinh-nghia
- trang: piano/hoa-am/ung-tac
  id: n57
  cau: "Câu hỏi 4: nghệ sĩ dạo đầu để báo giọng, thử đàn, làm ấm tay, nối hai bài khác giọng; Czerny in cả một tập 120 ví dụ, Op. 300."
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n58
  cau: "Câu hỏi 5: phách 1 của mỗi ô nên là một nốt hợp âm, thường là nốt khung; nốt lướt và nốt thêu nằm giữa các phách."
  loai: quy-tac
- trang: piano/hoa-am/ung-tac
  id: n59
  cau: 'Nguồn: bản nhạc K. 265 trên IMSLP (tìm "Ah vous dirai-je maman K.265") và bản Urtext của Henle.'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n60
  cau: 'Nguồn: Wikipedia, Twelve Variations on "Ah vous dirai-je, Maman": niên đại, bản in đầu và cấu trúc các biến tấu.'
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n61
  cau: "Nguồn: C. P. E. Bach, Versuch über die wahre Art das Clavier zu spielen, phần 2 (1762): đệm và fantasia tự do."
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n62
  cau: "Nguồn: Czerny, Systematische Anleitung zum Fantasieren auf dem Pianoforte, Op. 200; Die Kunst des Präludierens, Op. 300."
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n63
  cau: "Nguồn: Hamilton, After the Golden Age (Oxford University Press, 2008): thói quen dạo đầu của nghệ sĩ piano thế kỷ 19."
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n64
  cau: "Nguồn: Mortensen, The Pianist's Guide to Historic Improvisation (OUP, 2020); Gjerdingen, Music in the Galant Style (OUP, 2007)."
  loai: lich-su
- trang: piano/hoa-am/ung-tac
  id: n49
  cau: Nối hai bài khác giọng bằng ii6 – I6/4 – V7 – I ở giọng của bài thứ hai.
  loai: khuyen-tap
- trang: piano/hoa-am/ung-tac
  id: n52
  cau: "Tập trong mọi giọng: đi từng lớp (bass, khung, trang trí); dùng cùng vòng giọng với trang mẫu galant; bảng tuần 1–4."
  loai: khuyen-tap
- trang: piano/hoa-am/ung-tac
  id: n4
  cau: "Khung: mỗi ô một nốt giai điệu thuộc hợp âm của ô ấy, như Mi – Fa – Rê – Đô trên I – IV – V – I."
  loai: khuyen-tap
- trang: piano/hoa-am/index
  id: i3
  cau: Phần này dành cho người từ khoảng Grade 2 đến trung cấp.
  loai: cap-do
- trang: piano/hoa-am/index
  id: i4
  cau: Gam trưởng Đô, Sol, Rê, Fa và gam thứ hòa âm La, Mi, Rê, hợp âm ba ở các thể đảo, vòng I–IV–I–V7–I ở Đô, Sol, Fa trưởng là hành trang của chặng 2 (khoảng Grade 1–2), xem trang hợp âm và hình đệm.
  loai: cap-do
- trang: piano/hoa-am/index
  id: i5
  cau: Hòa âm bên phím (keyboard harmony) là chơi các tiến trình hợp âm bằng tay, kể cả những nốt không ghi sẵn trên bản nhạc, và chuyển chúng sang các giọng khác.
  loai: dinh-nghia
- trang: piano/hoa-am/index
  id: i6
  cau: "Hòa âm bên phím cho bạn bốn thứ: đọc nhạc nhanh hơn (mắt nhận ra cả khối như I–IV–V–I hay một kết), học thuộc chắc hơn (có điểm bám khi quên), hiểu bản nhạc (chọn sắc thái, chỗ thở và rubato), tự do ứng tác."
  loai: quy-tac
- trang: piano/hoa-am/index
  id: i8
  cau: Thời Baroque, người chơi đàn phím khi đệm thường chỉ có trước mặt một bè bass, đôi khi kèm các con số, và tự chơi hợp âm bên trên.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i9
  cau: "Ở các nhạc viện Napoli thế kỷ 18, học trò luyện partimento: những bè bass được hoàn thiện thành nhạc ngay trên bàn phím."
  loai: lich-su
- trang: piano/hoa-am/index
  id: i10
  cau: "Carl Philipp Emanuel Bach, Versuch über die wahre Art das Clavier zu spielen (Tiểu luận về cách chơi đàn phím đúng đắn): phần một 1753, phần hai 1762."
  loai: nam
- trang: piano/hoa-am/index
  id: i11
  cau: C.P.E. Bach dành phần hai của Versuch cho việc đệm, và kết thúc bằng fantasia tự do, tức ứng tác.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i12
  cau: Mozart và Beethoven đều nổi tiếng là những người ứng tác xuất sắc trước công chúng.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i14
  cau: "Giọng thứ cùng hóa biểu với một giọng trưởng: La thứ với Đô trưởng, Mi thứ với Sol trưởng."
  loai: quy-tac
- trang: piano/hoa-am/index
  id: i17
  cau: "Mẫu galant là những công thức hai bè quen thuộc của âm nhạc thế kỷ 18 mà nhà nghiên cứu Robert Gjerdingen hệ thống hóa: Romanesca, Prinner, Monte, Fonte…"
  loai: lich-su
- trang: piano/hoa-am/index
  id: i18
  cau: Vài tên mẫu có từ thế kỷ 18, như Monte và Fonte của Joseph Riepel; vài tên đặt theo nhà lý thuyết, như Meyer.
  loai: lich-su
- trang: piano/hoa-am/index
  id: i26
  cau: "Nguồn: Gjerdingen, Music in the Galant Style (Oxford University Press, 2007)."
  loai: ten
- trang: piano/hoa-am/index
  id: i27
  cau: "Nguồn: Sanguinetti, The Art of Partimento (Oxford University Press, 2012); Mortensen, The Pianist's Guide to Historic Improvisation (Oxford University Press, 2020); Kostka, Payne, Tonal Harmony (McGraw-Hill)."
  loai: ten
- trang: piano/hoa-am/index
  id: i19
  cau: "Thứ tự này có chủ ý: kết là dấu chấm câu; đệm giai điệu là đặt câu; mẫu galant là thành ngữ; ứng tác là tự nói."
  loai: khuyen-tap
- trang: piano/hoa-am/index
  id: i22
  cau: Mười phút mỗi ngày là một khối nhỏ, dễ giữ đều.
  loai: khuyen-tap
- trang: piano/hoa-am/index
  id: i21
  cau: "Lịch chỉ là gợi ý: điều kiện để sang tuần sau là đạt mục tiêu của tuần trước; nếu một giọng còn vấp, giữ nó thêm một tuần."
  loai: khuyen-tap
