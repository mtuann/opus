  luot_2: dung
  nguon: ["https://imslp.org/wiki/Category:Czerny,_Carl", "https://imslp.org/wiki/Category:Burgm%C3%BCller,_Friedrich", "https://imslp.org/wiki/Category:Heller,_Stephen", "https://imslp.org/wiki/Die_Kunst_der_Fingerfertigkeit,_Op.740_(Czerny,_Carl)", "https://imslp.org/wiki/Die_Schule_der_Gel%C3%A4ufigkeit,_Op.299_(Czerny,_Carl)", "https://imslp.org/wiki/25_%C3%89tudes_faciles_et_progressives,_Op.100_(Burgm%C3%BCller,_Friedrich)", "https://imslp.org/wiki/30_Progressive_Studies,_Op.46_(Heller,_Stephen)", "https://imslp.org/wiki/%C3%89tudes_d'ex%C3%A9cution_transcendante,_S.139_(Liszt,_Franz)"]
  ghi_chu: "Năm sinh–mất: Czerny 1791–1857, Burgmüller 1806–1874, Heller 1813–1888 (IMSLP). Op. 299, 740, Burgmüller Op. 100 (25 étude), Heller Op. 46 xác nhận; Czerny Op. 599, Heller Op. 45 và 47, sonatina Kuhlau/Diabelli không mở trang riêng. Liszt đề tặng 12 Études cho Czerny (IMSLP), hợp với 'thầy của Liszt'; 'học trò của Beethoven' không mở nguồn."
- trang: piano/nha-soan-nhac
