- trang: piano/nha-soan-nhac
  id: n5
  luot_2: sai
  nguon: ["https://imslp.org/wiki/Menuet_sur_le_nom_d'Haydn,_M.58_(Ravel,_Maurice)"]
  cau_dung: "Bảng 'Muốn chơi… thì bắt đầu với…', các dòng còn lại: … Ravel Menuet sur le nom d'Haydn và Pavane (Debussy có Hommage à Haydn riêng, không phải Menuet sur le nom d'Haydn), …"
  ghi_chu: "Menuet sur le nom d'Haydn là M.58 của Ravel (1909, IMSLP). Trang xếp nó dưới tên Debussy; chính trang cũng ghi đúng tác phẩm này ở mục Ravel (n143). Phần còn lại của câu (Czerny Op. 299/740, Op. 25, Liszt, Brahms Op. 39/117/118, Rachmaninoff, Pärt, Glass, Gershwin) không thấy sai."
- trang: piano/nha-soan-nhac
