  nguon: []
  ghi_chu: "IMSLP xếp Handel HWV 435, Rameau, Couperin, Scarlatti là nhạc cho harpsichord/clavecin (đã mở), nhưng chưa mở nguồn nào nói thẳng về clavichord và 'chưa có bàn đạp vang'. Ý chung quen thuộc, nên cho review xem."
