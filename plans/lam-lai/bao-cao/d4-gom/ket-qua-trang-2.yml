  ghi_chu: "Bragge 2006 nhắc rối loạn cơ xương ở người chơi piano; mô tả chung hợp lý."
- trang: "piano/suc-khoe"
  id: "n2"
  luot_2: "dung"
  nguon:
    - "https://api.crossref.org/works/10.21091/mppa.2002.4028"
    - "https://academic.oup.com/occmed/article/56/1/28/1380209"
  ghi_chu: "Sakai 2002: đau tay do \"overuse\" ở người chơi piano; Bragge 2006 xem xét các yếu tố nguy cơ."
- trang: "piano/suc-khoe"
  id: "n5"
  luot_2: "dung"
  nguon:
    - "https://academic.oup.com/occmed/article/56/1/28/1380209"
  ghi_chu: "Tựa bài Bragge dùng đúng \"playing-related musculoskeletal disorders in pianists\"."
- trang: "piano/suc-khoe"
  id: "n6"
  luot_2: "dung"
  nguon:
    - "https://academic.oup.com/occmed/article/56/1/28/1380209"
  ghi_chu: "Bragge, Bialocerkowski, McMeeken 2006: tỷ lệ báo cáo 26-93%."
- trang: "piano/suc-khoe"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://academic.oup.com/occmed/article/56/1/28/1380209"
    - "https://paskpiano.org/pain-injury-and-ergonomics/"
  ghi_chu: "Bragge: tỷ lệ rất rộng; PASK: có nghiên cứu cho 70-80% nữ chơi piano bị đau hoặc chấn thương liên quan đến chơi đàn."
- trang: "piano/suc-khoe"
  id: "n8"
  luot_2: "dung"
  nguon:
    - "https://www.bapam.org.uk/return-to-play/"
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "BAPAM return-to-play: \"Do not play with discomfort\"; NHS: đi khám khi triệu chứng không hết."
- trang: "piano/suc-khoe"
  id: "n9"
  luot_2: "khong-chac"
  nguon:
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "Phần \"đau thì dừng\" đúng (BAPAM), nhưng không kiểm được việc BAPAM coi mỏi, căng là dấu hiệu xem lại kỹ thuật và chương trình tập (tờ Healthy Pianist không mở được)."
- trang: "piano/suc-khoe"
  id: "n10"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "NHS RSI: triệu chứng gồm đau (nóng, nhức, giật), cứng, yếu, tê/kim châm, sưng; cần đi khám nếu không hết hoặc nặng dần. Phần mỏi bình thường sau buổi dài là phân biệt hợp lý của site."
- trang: "piano/suc-khoe"
  id: "n11"
  luot_2: "dung"
  nguon:
    - "https://academic.oup.com/occmed/article/56/1/28/1380209"
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "Bragge: các nghiên cứu không thống nhất yếu tố nguy cơ (chỉ 4 nghiên cứu có yếu tố có ý nghĩa thống kê); tài liệu BAPAM có nhắc các yếu tố liên quan."
- trang: "piano/suc-khoe"
  id: "n12"
  luot_2: "khong-chac"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "NHS và BAPAM khuyên tăng dần hoạt động khi quay lại, nhưng \"tăng đột ngột thời lượng tập\" là yếu tố nguy cơ chưa được chứng minh chắc (Bragge: các nghiên cứu không thống nhất)."
- trang: "piano/suc-khoe"
  id: "n13"
  luot_2: "khong-chac"
  nguon:
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "Không mở được tờ The Healthy Pianist của BAPAM (PDF bị chặn robots). Trang BAPAM return-to-play (bối cảnh quay lại chơi sau nghỉ) ghi \"Take a 3-5 minute break from playing every 20-25 minutes\", không phải 20/10."
- trang: "piano/suc-khoe"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.1.html"
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
  ghi_chu: "Chang: không đẩy xuống khi giữ phím, thả lỏng cơ; cơ chế \"mỏi nhanh\" là lẽ thường, không có nguồn y khoa riêng."
- trang: "piano/suc-khoe"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
    - "https://paskpiano.org/pain-injury-and-ergonomics/"
  ghi_chu: "NHS: tư thế kém là yếu tố nguy cơ RSI; PASK: đàn có phím quá rộng gây đau cho tay nhỏ."
- trang: "piano/suc-khoe"
  id: "n18"
  luot_2: "khong-chac"
  nguon:
    - "https://paskpiano.org/stretching-exercises-benefits-limitations-and-dangers/"
  ghi_chu: "PASK: nhiều chuyên gia khuyên khởi động; cơ chế \"máu chưa đủ tới tay\" không có nguồn."
- trang: "piano/suc-khoe"
  id: "n19"
  luot_2: "khong-chac"
  nguon:
    - "https://paskpiano.org/principles-of-ergonomics-and-biomechanics/"
  ghi_chu: "Không có nguồn nói bài quá khó là yếu tố nguy cơ độc lập; PASK nói lệch giữa cỡ tay và bài."
- trang: "piano/suc-khoe"
  id: "n20"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không tìm được nguồn y khoa bậc 1-2 cho tác động của căng thẳng, thiếu ngủ lên chấn thương người chơi đàn."
- trang: "piano/suc-khoe"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "NHS: các hoạt động lặp lại khác (gõ phím, thể thao, dụng cụ cầm tay) là yếu tố nguy cơ RSI."
- trang: "piano/suc-khoe"
  id: "n22"
  luot_2: "dung"
  nguon:
    - "https://paskpiano.org/stretching-exercises-benefits-limitations-and-dangers/"
  ghi_chu: "PASK: nhiều chuyên gia khuyên khởi động xa đàn, gồm thân và tay; kéo giãn ngón nhẹ được."
- trang: "piano/suc-khoe"
  id: "n23"
  luot_2: "dung"
  nguon:
    - "https://paskpiano.org/stretching-exercises-benefits-limitations-and-dangers/"
  ghi_chu: "PASK: \"Fingers should definitely not be forced apart\"; các bài kéo giãn dạng này \"implicated in devastating injuries\"."
- trang: "piano/suc-khoe"
  id: "n24"
  luot_2: "khong-chac"
  nguon:
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "Không mở được tờ The Healthy Pianist của BAPAM (PDF bị chặn robots). Trang BAPAM return-to-play (bối cảnh quay lại chơi sau nghỉ) ghi \"Take a 3-5 minute break from playing every 20-25 minutes\", không phải 20/10."
- trang: "piano/suc-khoe"
  id: "n25"
  luot_2: "khong-chac"
  nguon:
    - "https://www.bapam.org.uk/return-to-play/"
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "Nguyên tắc tăng dần đúng (BAPAM, NHS), nhưng không kiểm được BAPAM có khuyên đúng câu này, và ví dụ 30 lên 60 phút không có nguồn."
- trang: "piano/suc-khoe"
  id: "n28"
  luot_2: "dung"
  nguon:
    - "https://paskpiano.org/how-many-sizes/"
  ghi_chu: "PASK: quãng tám 6,5 inch (16,5 cm) là cỡ \"large\" thông thường."
- trang: "piano/suc-khoe"
  id: "n29"
  luot_2: "dung"
  nguon:
    - "https://paskpiano.org/pianists-hand-spans-vary-greatly/"
  ghi_chu: "PASK: độ dang tay người lớn chênh tới 5 inch (12,7 cm); tay nam dài hơn nữ khoảng 1 inch (2,5 cm)."
- trang: "piano/suc-khoe"
  id: "n30"
  luot_2: "dung"
  nguon:
    - "https://api.crossref.org/works/10.21091/mppa.2002.4028"
    - "https://paskpiano.org/epidemiological-and-clinical-studies/"
  ghi_chu: "Sakai 2002 (MPPA 17(4) 178-180): 200 ca, quãng tám và hợp âm chiếm 74% kỹ thuật ghi nhận lúc khởi phát; 30+22 trên 70 khớp 74%, nhưng các con số 70/30/22 không đọc trực tiếp."
- trang: "piano/suc-khoe"
  id: "n32"
  luot_2: "khong-chac"
  nguon:
    - "https://paskpiano.org/how-many-sizes/"
    - "https://paskpiano.org/manufacturers/"
  ghi_chu: "DS5.5 (5,5 inch), DS6.0 (6,0 inch), tên \"7/8\" và \"15/16\" có trên PASK; PASK ghi quỹ DS không nhận đơn khách tư nhân, nhưng không có giá hay thời gian chờ."
- trang: "piano/suc-khoe"
  id: "n33"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không mở được tờ Healthy Pianist của BAPAM để kiểm vế phím nhẹ hay nặng."
- trang: "piano/suc-khoe"
  id: "n34"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không mở được tờ Healthy Pianist của BAPAM để kiểm vận động nhịp điệu, tạ, giữ ấm."
- trang: "piano/suc-khoe"
  id: "n35"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "NHS: đi khám nếu triệu chứng không hết hoặc nặng dần; BAPAM: không chơi khi khó chịu, giảm tải rồi quay lại dần."
- trang: "piano/suc-khoe"
  id: "n36"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "NHS: tê, kim châm, yếu, sưng là triệu chứng RSI; đi khám nếu không hết. \"Đỏ\" và \"vụng về khi cầm đồ vật\" không có trong trang."
- trang: "piano/suc-khoe"
  id: "n37"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "NHS: đi khám nếu triệu chứng không hết hoặc nặng dần."
- trang: "piano/suc-khoe"
  id: "n38"
  luot_2: "dung"
  nguon:
    - "https://www.bapam.org.uk/musicians-focal-dystonia/"
  ghi_chu: "BAPAM: bất thường vận động khi chơi, thường không đau lúc đầu; cần gặp bác sĩ thần kinh."
- trang: "piano/suc-khoe"
  id: "n39"
  luot_2: "dung"
  nguon:
    - "https://www.bapam.org.uk/return-to-play/"
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "BAPAM: không chơi khi khó chịu, quay lại dần, tìm chuyên gia khi có đau; ghi lại đau là ý thực hành."
