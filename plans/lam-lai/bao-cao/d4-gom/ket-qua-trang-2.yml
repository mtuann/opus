  id: "n40"
  luot_2: "dung"
  nguon:
    - "https://www.bapam.org.uk/musicians-focal-dystonia/"
    - "https://api.crossref.org/works/10.21091/mppa.2010.1002"
  ghi_chu: "BAPAM: ước tính 1-2% nhạc công chuyên nghiệp; Altenmüller & Jabusch 2010: khoảng 1%."
- trang: "piano/suc-khoe"
  id: "n41"
  luot_2: "dung"
  nguon:
    - "https://www.bapam.org.uk/musicians-focal-dystonia/"
  ghi_chu: "BAPAM: thường không đau lúc đầu, mất phối hợp khi chơi, việc ngoài đàn thường bình thường; \"lan sang viết, gõ phím\" không có trong trang."
- trang: "piano/suc-khoe"
  id: "n42"
  luot_2: "dung"
  nguon:
    - "https://www.bapam.org.uk/musicians-focal-dystonia/"
  ghi_chu: "BAPAM khuyên tránh tập quá mức, nhất là khi gây đau; cần chẩn đoán đúng."
- trang: "piano/suc-khoe"
  id: "n43"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không có nguồn cho nhận định \"phần lớn ngón vụng ở người mới chỉ là chưa tập đủ hoặc căng\"."
- trang: "piano/suc-khoe"
