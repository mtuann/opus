- trang: "piano/tu-the"
  id: "n1"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "Chang: thả lỏng là yếu tố quan trọng nhất; NHS: tư thế kém là yếu tố nguy cơ RSI."
- trang: "piano/tu-the"
  id: "n2"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.1.html"
  ghi_chu: "Chang III.1: \"faster downstroke generally means louder sound\"."
- trang: "piano/tu-the"
  id: "n3"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
  ghi_chu: "Chang III.4 \"The most important aspect is relaxation\"; vế so sánh \"tinh tế hơn nhiều\" chỉ được ủng hộ gián tiếp."
- trang: "piano/tu-the"
  id: "n4"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
  ghi_chu: "Chang III.4: thả lỏng, giảm căng ở cánh tay, vai."
- trang: "piano/tu-the"
  id: "n5"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
    - "https://academic.oup.com/occmed/article/56/1/28/1380209"
  ghi_chu: "NHS: dùng lặp lại và tư thế kém là yếu tố nguy cơ RSI (tay, cẳng tay, vai); Bragge 2006 ghi các nghiên cứu chưa thống nhất yếu tố nguy cơ, nên chỉ đúng ở mức \"yếu tố nguy cơ\" chung."
- trang: "piano/tu-the"
  id: "n6"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Chang III.4 nói hạ ghế thấp để chơi ngón phẳng là được, cổ tay, khuỷu có thể thấp hơn mặt phím; không có nguồn bậc 1-2 cho quy tắc \"cẳng tay song song\". Quy tắc phổ biến trong dạy đàn nhưng không tuyệt đối."
- trang: "piano/tu-the"
  id: "n7"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Chang III.4 chỉ ghi nhiều người ngồi quá gần và quá cao; vế \"ngực bị bó/chồm người\" không có nguồn."
- trang: "piano/tu-the"
  id: "n8"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không tìm được nguồn bậc 1-2 mở được cho cách chia trọng lượng và bài kiểm tra nghiêng người."
- trang: "piano/tu-the"
  id: "n10"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không có nguồn mở được; hợp cách dạy phổ biến."
- trang: "piano/tu-the"
  id: "n12"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không có nguồn bậc 1-2 mở được."
- trang: "piano/tu-the"
  id: "n13"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
  ghi_chu: "Chang III.4: thả lỏng cơ, chơi f bằng vai. Gợi ý \"mỗi khi lật trang\" là lời khuyên tập."
- trang: "piano/tu-the"
  id: "n14"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
  ghi_chu: "Chang III.4: thả lỏng cánh tay."
- trang: "piano/tu-the"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
  ghi_chu: "Chang III.4: ngón chơi nên song song cẳng tay; cổ tay bẻ ngang thường xuyên là dấu hiệu sẽ có rắc rối."
- trang: "piano/tu-the"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://paskpiano.org/principles-of-ergonomics-and-biomechanics/"
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.4.html"
  ghi_chu: "PASK: góc cổ tay lệch khỏi trung tính, lặp lại, dùng lực là yếu tố nguy cơ; Chang: không để cổ tay lệch. Cách tìm bằng thả tay buông thõng là mẹo, không có nguồn."
- trang: "piano/tu-the"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://en.wikipedia.org/wiki/Fingering_(music)"
  ghi_chu: "Quy ước chuẩn (ngón cái = 1 cả hai tay); chỉ mở được Wikipedia (dẫn Grove, không mở được)."
- trang: "piano/tu-the"
  id: "n22"
  luot_2: "dung"
  nguon:
    - "https://en.wikipedia.org/wiki/Fingering_(music)"
  ghi_chu: "Hệ quả của quy ước số ngón: tay phải 1-5 đi lên, tay trái 5-1 từ Đô lên Sol. Chỉ mở được Wikipedia."
- trang: "piano/tu-the"
  id: "n24"
  luot_2: "dung"
  nguon:
    - "https://kawaius.com/technology/piano-action/"
  ghi_chu: "Kawai: let-off, jack nhả khỏi knuckle ngay trước khi búa chạm dây. Chang III.1 lưu ý búa không hoàn toàn \"tự do\" ngay sau let-off (shank flex), nên \"bay tự do\" là cách nói đơn giản hóa."
- trang: "piano/tu-the"
  id: "n25"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.1.html"
  ghi_chu: "Chang III.1: xuống phím nhanh hơn thì to hơn; Chang cũng cho rằng âm sắc nốt đơn vẫn điều khiển được, nên \"đã được quyết định hoàn toàn\" là mức giản lược."
- trang: "piano/tu-the"
  id: "n26"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.1.html"
  ghi_chu: "Chang III.1: không đẩy xuống khi giữ phím, trọng lực đủ để giữ."
- trang: "piano/tu-the"
  id: "n27"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "\"Mỏi sau mười lăm phút\" và so sánh người mới không có nguồn; vế dùng trọng lượng, tay đỡ mỏi phù hợp Chang nhưng không đủ."
- trang: "piano/tu-the"
  id: "n30"
  luot_2: "dung"
  nguon:
    - "https://fundamentals-of-piano-practice.readthedocs.io/chapter1/ch1_topics/III.13.html"
  ghi_chu: "Chang III.13: quay video cho thấy khác với hình dung của mình về cách chơi (tư thế, phối hợp thân-tay)."
- trang: "piano/tu-the"
  id: "n32"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không mở được tờ The Healthy Pianist của BAPAM (PDF bị chặn robots). Trang BAPAM return-to-play (bối cảnh quay lại chơi sau nghỉ) ghi \"Take a 3-5 minute break from playing every 20-25 minutes\", không phải 20/10."
- trang: "piano/tu-the"
  id: "n33"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
    - "https://www.bapam.org.uk/return-to-play/"
  ghi_chu: "NHS: đau, tê, ngứa ran là triệu chứng RSI; BAPAM: \"Do not play with discomfort\"."
- trang: "piano/tu-the"
  id: "n34"
  luot_2: "dung"
  nguon:
    - "https://www.nhs.uk/conditions/repetitive-strain-injury-rsi/"
  ghi_chu: "NHS: đi khám khi triệu chứng không hết hoặc nặng dần."
- trang: "piano/tu-the"
  id: "n35"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Phần đau là tín hiệu dừng đúng (NHS, BAPAM return-to-play), nhưng phần chiều cao ghế (cẳng tay song song) không có nguồn bậc 1-2 (xem n6)."
- trang: "piano/tu-the"
  id: "n38"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Mô tả hình ảnh không kiểm được từ nguồn; các ý riêng lẻ (ghế, chân) xem n6, n10, n12."
- trang: "piano/tu-the"
  id: "n39"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Phần hình không kiểm được; Chang III.4 dạy chơi ngón phẳng, không nhắc \"vòm khớp gốc ngón\"; lỗi cổ tay võng/gãy khớp đầu ngón chỉ hợp cách dạy phổ biến."
- trang: "piano/tu-the"
  id: "n36"
  luot_2: "dung"
  nguon: []
  ghi_chu: "Khuyên tập, hợp cách dạy phổ biến (Chang III.4: ngón cái luôn chơi ở tư thế phẳng)."
- trang: "piano/tu-the"
  id: "n17"
  luot_2: "dung"
  nguon: []
  ghi_chu: "Khuyên tập hợp cách dạy phổ biến, không thấy chỗ sai hoặc có hại."
- trang: "piano/tu-the"
  id: "n23"
  luot_2: "dung"
  nguon: []
  ghi_chu: "Khuyên tập hợp lý, không có hại."
