  id: n37
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Các kiểu đạp (nửa bàn đạp, rung bàn đạp, đạp trước): không mở được nguồn bậc 2."
- trang: piano/ban-dap
  id: n38
  luot_2: dung
  nguon:
    - "https://www.britannica.com/art/piano"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/corda"
  ghi_chu: "Britannica: sostenuto giữ giảm âm chỉ cho phím đã nhấn khi bàn đạp xuống (phím nhả sau đó vẫn ngân); Oxford: una corda dùng bàn đạp mềm."
- trang: piano/ban-dap
  id: n40
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không có nguồn bậc 2 mở được về âm vực với bàn đạp."
- trang: piano/ban-dap
  id: n41
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/defsp1.htm"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"
  ghi_chu: "Dolmetsch: 'Ped.' trên organ là phím chân (pedal). Oxford chỉ mô tả bàn đạp vang cho piano. Harpsichord, clavichord không có bàn đạp vang là kiến thức chuẩn."
- trang: piano/ban-dap
  id: n43
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Nhận định về cách chơi Prelude BWV 846 (người đổi bàn đạp mỗi ô, người chỉ giữ ngón): không có nguồn bậc 2 mở được."
- trang: piano/ban-dap
  id: n44
  luot_2: khong-chac
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"
  ghi_chu: "Oxford nói Mozart chơi hợp với action kiểu Vienna. Cần lever đầu gối và đàn Anton Walter của Mozart chỉ thấy ở Wikipedia, không dùng được."
- trang: piano/ban-dap
  id: n46
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"
  ghi_chu: "Oxford: Beethoven là người đầu tiên hưởng trọn lợi ích của bàn đạp vang; số lượng ký hiệu bàn đạp của Beethoven nhiều hơn Mozart: chấp nhận được."
- trang: piano/ban-dap
  id: n47
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino"
  ghi_chu: "Oxford: senza sordini = không bộ giảm âm, tức giữ bàn đạp vang. Dòng chữ senza sordino ở đầu chương 1 Op.27 số 2 là chuẩn; không mở được bản nhạc."
- trang: piano/ban-dap
  id: n48
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Nhận định về đàn Vienna đầu thế kỷ 19: không có nguồn bậc 2 mở được."
- trang: piano/ban-dap
  id: n49
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được bản thảo Chopin, bản in đầu hay nguồn bậc 2 về việc Chopin ghi bàn đạp kỹ."
- trang: piano/ban-dap
  id: n50
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Wydanie Narodowe: không mở được nguồn của ấn bản."
- trang: piano/ban-dap
  id: n51
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Bản Mutopia (Debussy ed.) của Nocturne Op.27 số 2 có nhiều dấu bàn đạp ở bốn ô cuối, nhưng đây là bản biên tập, không phải bản gốc Chopin; không mở được Wydanie Narodowe."
- trang: piano/ban-dap
  id: n53
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn bậc 2 về việc Chopin hiếm khi ghi una corda."
- trang: piano/ban-dap
  id: n54
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn bậc 2 về cách ghi bàn đạp của Debussy."
- trang: piano/ban-dap
  id: n57
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Như n31."
- trang: piano/ban-dap
  id: n58
  luot_2: khong-chac
  nguon:
    - "https://www.britannica.com/art/piano"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"
  ghi_chu: "Phần dịch bộ máy ở đàn cánh: khớp. Oxford nói bàn đạp mềm đàn đứng có thể đưa búa lại gần dây hoặc chèn nỉ; 'bàn đạp tập hạ dải nỉ' (bàn đạp giữa) không có nguồn."
- trang: piano/ban-dap
  id: n59
  luot_2: khong-chac
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino"
  ghi_chu: "Phần senza sordino = giữ bàn đạp vang: khớp (Oxford). Phần 'trên đàn hiện đại vẫn đổi bàn đạp kín đáo theo hòa âm' là lựa chọn diễn tấu, không có nguồn."
- trang: piano/ban-dap
  id: n60
  luot_2: dung
  nguon:
    - "https://www.britannica.com/art/piano"
  ghi_chu: "Britannica: sostenuto chỉ giữ cho các phím đã nhấn khi bàn đạp xuống."
