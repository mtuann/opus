- trang: piano/gam
  id: n3
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "Định nghĩa chuẩn; bảng ngón bấm pianoscales cho thấy mẫu luồn ngón cái (1 sau 3 hoặc 4) và vắt ngón."
- trang: piano/gam
  id: n4
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "Đối chiếu bảng pianoscales: tay phải Đô 1 2 3 1 (cái luồn sau 3), Fa 1 2 3 4 1 (sau 4); tay trái Đô 5 4 3 2 1 3 (vắt 3 qua cái khi đi lên). Đi xuống là chiều ngược lại."
- trang: piano/gam
  id: n7
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "Tay phải Đô: 1 2 3 1 2 3 4 5, tức nhóm 1-2-3 (Đô Rê Mi), 1-2-3-4 (Fa Sol La Si), rồi Đô (5) và luồn cái sang Đô tiếp."
- trang: piano/gam
  id: n8
  luot_2: sai
  nguon:
    - "https://www.pianoscales.org/major.html"
  cau_dung: "Ba quy tắc: ngón cái không đặt lên phím đen (trong các ngón bấm chuẩn của gam trưởng và gam thứ hòa âm ngón cái chỉ chơi phím trắng); các ngón dài (2, 3, 4) nhận phím đen; ngón 4 thường chỉ dùng một lần trong mỗi quãng tám (ngoại lệ chuẩn: tay trái Si trưởng 4-3-2-1-4-3-2-1 dùng ngón 4 hai lần, ở Si và Fa♯)."
  ghi_chu: "Bảng pianoscales: Si trưởng tay trái 4 3 2 1 4 3 2 1 dùng ngón 4 ở cả Si và Fa♯ trong một quãng tám, nên 'chỉ một lần mỗi quãng tám' không đúng cho mọi gam (tay phải và các gam khác đều một lần). Hai quy tắc đầu khớp bảng các gam trưởng. Lỗi nhẹ: chỉ cần thêm 'thường' và nêu ngoại lệ."
- trang: piano/gam
  id: n9
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "Bảng pianoscales tay phải: Fa 1 2 3 4 (4 trên Si♭); Si♭ 4 1 2 3 1 2 3 4; Mi♭ 3 1 2 3 4 1 2 3 (4 trên Si♭); La♭ 3 4 1 2 3 1 2 3 (4 trên Si♭); Rê♭ 2 3 1 2 3 4 1 2 (4 trên Si♭); Sol♭ 2 3 4 1 2 3 1 2 (4 trên Si♭). Đúng cả sáu."
- trang: piano/gam
  id: n10
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "Bảng pianoscales cho Rê♭, Mi♭, Sol♭, La♭, Si♭: không gam nào dùng ngón 5; mẫu ngón lặp lại từng quãng tám (vd. Rê♭ tay phải 2 3 1 2 3 4 1 | 2…, đầu và cuối cùng là 2; tay trái 3 2 1 4 3 2 1 | 3)."
- trang: piano/gam
  id: n11
  luot_2: khong-chac
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "Chỉ có chú thích của bảng; không đọc được nội dung bảng ở trang site. Bảng pianoscales dùng để đối chiếu cho các mục khác."
- trang: piano/gam
  id: n12
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "pianoscales xếp Rê♭ (Đô♯) và Sol♭ (Fa♯) cùng một hàng, cùng ngón bấm."
- trang: piano/gam
  id: n13
  luot_2: khong-chac
  nguon:
    - "https://www.pianoscales.org/major.html"
  ghi_chu: "Khớp: Si trưởng tay phải 1 2 3 1 2 3 4 5 (như Đô), tay trái bắt đầu 4; Si♭ tay phải 4 1 2 3 1 2 3 4 (Si♭ là ngón 4). Không xác nhận được 'nhiều sách cho Si♭ đầu tiên của tay phải dùng ngón 2'."
- trang: piano/gam
  id: n14
  luot_2: khong-chac
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"
  ghi_chu: "OMT xác nhận: gam thứ hòa âm nâng bậc 7 (độ lên nửa cung). Không mở được nguồn ngón bấm gam thứ; tự kiểm theo logic, ngón La, Mi, Rê, Sol, Đô thứ hòa âm trùng ngón Đô trưởng là chuẩn, nhưng không có nguồn."
- trang: piano/gam
  id: n15
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn ngón bấm gam thứ hòa âm (pianoscales chặn trang gam thứ) và không thấy nội dung bảng của site."
- trang: piano/gam
  id: n16
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Như n15."
- trang: piano/gam
  id: n17
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn về ngón bấm gam thứ giai điệu."
- trang: piano/gam
  id: n18
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/chromatic.html"
  ghi_chu: "pianoscales: gam nửa cung, tay phải chủ yếu xen ngón cái và ngón giữa (1-3); tay trái phản chiếu. Ngón 2 thay cái ở Mi-Fa, Si-Đô, cái trên phím trắng, 3 trên phím đen: ngón bấm chuẩn, khớp với dãy ở n19."
- trang: piano/gam
  id: n19
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/chromatic.html"
  ghi_chu: "Tự kiểm 13 nốt từ Đô: tay phải Đô1 Đô♯3 Rê1 Rê♯3 Mi1 Fa2 Fa♯3 Sol1 Sol♯3 La1 La♯3 Si1 Đô2; tay trái Đô1 Đô♯3 Rê1 Rê♯3 Mi2 Fa1 Fa♯3 Sol1 Sol♯3 La1 La♯3 Si2 Đô1: đúng ngón chuẩn."
- trang: piano/gam
  id: n20
  luot_2: dung
  nguon:
    - "https://www.pianoscales.org/chromatic.html"
  ghi_chu: "pianoscales: bài tập có thể phản chiếu cho tay trái. Tự kiểm: tay phải đi lên từ Rê (1 3 1 2 3 1 3 1 3 1 2 3 1) trùng từng số với tay trái đi xuống từ Rê: đúng (đối xứng quanh Rê)."
- trang: piano/gam
  id: n21
  luot_2: khong-chac
  nguon:
    - "https://www.practisingthepiano.com/?s=hanon"
  ghi_chu: "Fitch có nhiều bài về gam nhưng không mở được trang nói về cách bấm 1-2-3-4 cho gam nửa cung tốc độ cao."
- trang: piano/gam
  id: n22
