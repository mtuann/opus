  ghi_chu: "Met: hai đàn Cristofori (Rome 1722, Leipzig 1726) có bàn phím trượt để mỗi nốt chỉ gõ một trong hai dây: khớp với phần 'búa chỉ gõ một dây'. Không xác nhận được cụm 'tên una corda có từ thời Cristofori', và Concerto số 4 của Beethoven ghi una corda/due corde/tre corde (chỉ thấy ở Wikipedia)."
- trang: piano/ban-dap
  id: n10
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn bậc 2 về bàn đạp piano điện (loại công tắc, cảm biến liên tục)."
- trang: piano/ban-dap
  id: n11
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Như n10."
- trang: piano/ban-dap
  id: n13
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"
    - "https://www.britannica.com/art/piano"
  ghi_chu: "Oxford/Britannica: bàn đạp vang nhấc cả dãy bộ giảm âm khỏi dây; ngụ ý mỗi dây có bộ giảm âm hạ xuống khi nhả phím. Chi tiết bọc nỉ là kiến thức chuẩn."
- trang: piano/ban-dap
  id: n14
  luot_2: khong-chac
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"
  ghi_chu: "Phần bàn đạp nhấc mọi giảm âm: khớp. Phần cộng hưởng giao cảm (dây khác rung theo bồi âm) là vật lý chuẩn nhưng tôi không mở được nguồn bậc 2."
- trang: piano/ban-dap
  id: n15
  luot_2: khong-chac
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piano"
  ghi_chu: "Oxford không nói nốt nào không có bộ giảm âm; không mở được nguồn cho 'cỡ quãng tám trên cùng'."
- trang: piano/ban-dap
  id: n16
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Quy tắc kỹ thuật bàn đạp nửa độ: không có nguồn bậc 2 mở được. Không có hại."
- trang: piano/ban-dap
  id: n18
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/defsp1.htm"
    - "https://www.dolmetsch.com/musicalsymbols.htm"
  ghi_chu: "Dolmetsch: 'Ped.' = nhấn bàn đạp phải (damper); '*' = nhả. Quy ước 'Ped. mới không có * trước' nghĩa là nhả và nhấn lại là quy ước ghi bản nhạc chuẩn, nguồn không nói rõ."
- trang: piano/ban-dap
  id: n19
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Ký hiệu đường kẻ có móc: Dolmetsch chỉ nhắc 'đường dọc bên phải' cho sostenuto; không xác nhận được ký hiệu đường gãy nhọn."
- trang: piano/ban-dap
  id: n20
  luot_2: khong-chac
  nguon:
    - "https://www.dolmetsch.com/defsp1.htm"
  ghi_chu: "Dolmetsch: pedale (Ý) = bàn đạp nhấc giảm âm; không thấy mục 'con/senza pedale' trong phần đọc được."
- trang: piano/ban-dap
  id: n21
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/simile"
  ghi_chu: "Oxford: simile = 'như cũ', thực hiện giống đoạn trước; dùng với bàn đạp là quy ước chuẩn."
- trang: piano/ban-dap
  id: n22
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/corda"
    - "https://www.dolmetsch.com/defsu.htm"
  ghi_chu: "Oxford: una corda = dùng bàn đạp mềm; tre corde, tutte le corde hủy una corda. Dolmetsch: u.c. = una corda. 't.c.' không thấy trong nguồn mở được nhưng là quy ước chuẩn."
- trang: piano/ban-dap
  id: n23
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/defsl.htm"
  ghi_chu: "Dolmetsch: l.v. = laissez vibrer, 'để rung' (thường cho chũm chọe; dùng cả cho đàn dây, harp, piano). Lưu ý: chữ 'chặn' trong câu bị lỗi mã hóa (ký tự hỏng) trong file danh sách."
- trang: piano/ban-dap
  id: n24
  luot_2: khong-chac
  nguon:
    - "https://www.dolmetsch.com/musicalsymbols.htm"
  ghi_chu: "Dolmetsch có mục sostenuto pedal; không xác nhận được ký hiệu viết tắt 'Sost. Ped.'."
- trang: piano/ban-dap
  id: n25
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino"
  ghi_chu: "Oxford: sordini trên piano = bộ giảm âm; senza sordini = không có bộ giảm âm, tức bàn đạp vang đạp xuống."
- trang: piano/ban-dap
  id: n26
  luot_2: khong-chac
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino"
  ghi_chu: "Oxford: con sordini = để giảm âm vào (bộ giảm âm hạ xuống, tức nhả bàn đạp vang), nên 'con sordino' thường là hủy senza sordino, không phải 'thường chỉ una corda'. Cách dùng 'con sordino' hay 'mit Verschiebung' của Schumann cho bàn đạp trái không xác nhận được ở nguồn mở được."
- trang: piano/ban-dap
  id: n27
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sordino"
  ghi_chu: "Oxford: sordini trên piano chỉ bộ giảm âm; senza sordini = giữ bàn đạp vang. Đúng."
- trang: piano/ban-dap
  id: n28
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Nhận xét về các bản in phổ thông: không có nguồn bậc 2 mở được."
- trang: piano/ban-dap
