  luot_2: khong-chac
  nguon: []
  ghi_chu: "Kỹ thuật bàn đạp nối (syncopated pedal) là chuẩn, nhưng không mở được nguồn bậc 2."
- trang: piano/ban-dap
  id: n33
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Như n31."
