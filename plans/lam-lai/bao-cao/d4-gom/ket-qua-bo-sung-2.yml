  ghi_chu: 'Đàn 88 phím A0–C8: các nốt Đô là C1…C8, nên Đô giữa C4 là Đô thứ tư; mọi Đô trừ C8 ở sát nhóm hai phím đen bên trái; thế Đô tay trái ngón 5 trên C3 (dưới Đô giữa một quãng tám). Kiểm trực tiếp, không cần nguồn. (Người gom: lượt 2 tự kiểm bằng nhạc lý, không ghi trang đã mở nên chuyển thành khong-chac.)'
