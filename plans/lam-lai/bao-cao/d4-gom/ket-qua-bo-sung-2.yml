  ghi_chu: 'Tính theo nhạc lý: Đô–Mi–Sol ngón 5-3-1; Si–Fa–Sol (G7 thiếu Rê, thế đảo ba) ngón 5-2-1. Không cần nguồn ngoài (nguon rỗng chấp nhận vì là kiểm trực tiếp). (Người gom: lượt 2 tự kiểm bằng nhạc lý, không ghi trang đã mở nên chuyển thành khong-chac.)'
