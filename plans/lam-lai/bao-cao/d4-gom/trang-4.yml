- trang: piano/hop-am-rai
  id: n4
  cau: 'Hợp âm ba có ba thể: thể gốc (nốt gốc ở dưới: Đô–Mi–Sol), thể đảo 1 (nốt ba ở dưới: Mi–Sol–Đô) và thể đảo 2 (nốt năm ở dưới: Sol–Đô–Mi).'
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n5
  cau: 'Ở thể gốc, ba nốt cách nhau hai quãng 3; ở thể đảo, một trong hai khoảng trở thành quãng 4 (đảo 1: quãng 3 rồi quãng 4; đảo 2: quãng 4 rồi quãng 3).'
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n7
  cau: 'Ngón bấm thể gốc: tay phải 1-3-5, tay trái 5-3-1.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n8
  cau: 'Ngón bấm thể đảo 1: tay phải 1-2-5, tay trái 5-3-1; ngón 2 ở nốt giữa tay phải để khoảng 2–5 (quãng 4 nằm trên) đủ rộng.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n9
  cau: 'Ngón bấm thể đảo 2: tay trái 5-2-1 (ngón 2 ở nốt giữa vì quãng 4 nằm dưới); tay phải 1-3-5, có người dùng 1-2-4.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n13
  cau: Hợp âm rải gãy chơi các nốt của hợp âm lần lượt thay vì cùng lúc, nhưng bàn tay vẫn giữ nguyên thế hợp âm.
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n16
  cau: Hợp âm rải (arpeggio) trải các nốt của hợp âm liên tục qua nhiều quãng tám, như một gam chỉ gồm nốt của hợp âm.
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n18
  cau: 'Hợp âm rải hai quãng tám đi lên: Đô trưởng (Đô–Mi–Sol) và La thứ (La–Đô–Mi) đều có tay phải 1 2 3 1 2 3 5 và tay trái 5 4 2 1 4 2 1.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n19
  cau: 'Tay phải đi lên: ngón cái luồn từ ngón 3 sang nốt gốc kế tiếp, cách một quãng 4; tay trái đi lên: ngón 4 vắt qua ngón cái.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n20
  cau: Tay trái đi lên, nhóm đầu ở Đô trưởng là 5-4-2-1; theo Baylor, ngón 4 dùng khi giữa nốt gốc và nốt ba có một phím trắng, ngón 3 khi có hai phím trắng.
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n22
  cau: 'Hợp âm rải có phím đen dùng ngón bấm khác, vì ngón cái vẫn tránh phím đen: Mi♭ trưởng (Mi♭–Sol–Si♭) có ngón cái tay phải đặt trên Sol, phím trắng duy nhất của hợp âm, nên nhóm ngón bắt đầu bằng ngón 2, 3 hoặc 4 trên Mi♭ (tùy tay và tùy sách).'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n28
  cau: 'Hợp âm khối: ba hợp âm tay trái xếp để các nốt đi ít nhất có thể: I ở thể gốc (Đô–Mi–Sol), IV ở thể đảo 2 (Đô–Fa–La, giữ nguyên nốt Đô chung), V ở thể đảo 1 (Si–Rê–Sol); ngón bấm 5-3-1, 5-2-1, 5-3-1.'
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n32
  cau: Bass Alberti là hình đệm thấp – cao – giữa – cao (Đô–Sol–Mi–Sol).
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n33
  cau: Bass Alberti mang tên Domenico Alberti, nhà soạn nhạc Ý thế kỷ 18 hay dùng hình đệm này.
  loai: lich-su
- trang: piano/hop-am-rai
  id: n36
  cau: Ví dụ kinh điển của bass Alberti là chương 1 Sonata Đô trưởng K. 545 của Mozart.
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n38
  cau: 'Hình đệm rải rộng tay trái: nốt gốc, quãng 5, rồi quãng 10 (nốt ba ở quãng tám trên); nếu tay nhỏ, thay nốt quãng 10 bằng quãng 8 (Đô–Sol–Đô).'
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n39
  cau: Đây là kết cấu quen thuộc của nocturne thời Lãng mạn (đệm rải ở tay trái, nhờ bàn đạp mà các nốt hòa thành một nền âm thanh).
  loai: lich-su
- trang: piano/hop-am-rai
  id: n42
  cau: Cột "Hay gặp ở" của bảng bốn kiểu đệm (thánh ca, bài hát, valse, minuet, nhạc khiêu vũ, sonata và sonatina Cổ điển, nocturne, bài hát không lời).
  loai: lich-su
- trang: piano/hop-am-rai
  id: n43
  cau: Hòa âm bàn phím (keyboard harmony) là chơi các tiến trình hợp âm cơ bản và chuyển chúng sang các giọng khác ngay trên bàn phím.
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n44
  cau: 'Dẫn giọng gần nhất: mỗi nốt đi ít nhất có thể, nốt chung giữ nguyên.'
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n45
  cau: 'Vòng kết I–IV–I–V7–I: tay trái chơi nốt gốc, tay phải chơi ba nốt; đây là kết (cadence) bạn gặp ở cuối nhiều câu nhạc.'
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n47
  cau: Ở Đô trưởng, tay phải chơi Đô–Mi–Sol, Đô–Fa–La, Đô–Mi–Sol, Si–Fa–Sol, Đô–Mi–Sol; tay trái chơi Đô, Fa, Đô, Sol, Đô.
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n48
  cau: 'Hợp âm V7 ở tay phải có ba nốt: Si (nốt ba, cũng là cảm âm), Fa (nốt bảy), Sol (nốt gốc); nốt năm Rê được bỏ, điều thường gặp khi chơi hợp âm bảy bằng ba nốt.'
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n49
  cau: Khi về I, Si đi lên Đô, Fa đi xuống Mi, Sol giữ nguyên.
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n51
  cau: 'Cùng hình bàn tay ấy chuyển sang các giọng khác (bảng bảy giọng: Đô, Sol, Fa, Rê, Si♭, La, Mi♭): nốt dưới cùng của tay phải là chủ âm (ở I và IV) và cảm âm (ở V7); tay trái chơi gốc – IV – gốc – V – gốc.'
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n52
  cau: 'Giọng thứ (La thứ): La–Đô–Mi, La–Rê–Fa, La–Đô–Mi, Sol♯–Rê–Mi, La–Đô–Mi; V7 lấy cảm âm từ gam thứ hòa âm.'
  loai: cau-truc
- trang: piano/hop-am-rai
  id: n56
  cau: 'Thể gốc: các nốt xếp chồng quãng 3 nằm cùng loại vị trí trên khuông: dòng – dòng – dòng hoặc khe – khe – khe. Hợp âm bảy thể gốc có bốn nốt cùng dòng hoặc cùng khe.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n57
  cau: Thể đảo của hợp âm ba có một khoảng rộng hơn (quãng 4); nốt nằm ngay trên quãng 4 là nốt gốc.
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n58
  cau: Thể đảo của hợp âm bảy có hai nốt "dính nhau" (quãng 2); nốt trên của quãng 2 là nốt gốc.
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n59
  cau: 'Biết nốt gốc rồi, nhìn hóa biểu và ngữ cảnh để biết chức năng: trong Đô trưởng, Sol–Si–Rê–Fa là V7, dù nó đứng ở thể nào.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n64
  cau: 'Câu hỏi 1: ngón bấm tay phải thường dùng cho Mi–Sol–Đô (Đô trưởng thể đảo 1) là 1-2-5 (quãng 4 Sol–Đô nằm trên, nên ngón 2 chơi nốt giữa để khoảng 2–5 đủ rộng).'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n65
  cau: 'Câu hỏi 2: trong hợp âm ba trên khuông có quãng 4 giữa hai nốt dưới, nốt nằm ngay trên quãng 4 là nốt gốc (ví dụ Sol–Đô–Mi: quãng 4 là Sol–Đô, nốt gốc là Đô).'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n66
  cau: 'Câu hỏi 3: bass Alberti chơi các nốt của hợp âm theo thứ tự thấp – cao – giữa – cao (ví dụ Đô–Sol–Mi–Sol, ngón 5-1-3-1).'
  loai: dinh-nghia
- trang: piano/hop-am-rai
  id: n67
  cau: 'Câu hỏi 4: ở Đô trưởng, khi V7 (Si–Fa–Sol) về I, nốt Si đi lên Đô (Si là cảm âm đi lên chủ âm; Fa đi xuống Mi; Sol giữ nguyên).'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n68
  cau: 'Câu hỏi 5: hợp âm rải Mi♭ trưởng có ngón bấm khác Đô trưởng vì ngón cái tránh phím đen, nên phải đặt trên Sol, phím trắng duy nhất của Mi♭–Sol–Si♭.'
  loai: quy-tac
- trang: piano/hop-am-rai
  id: n69
  cau: 'Nguồn: Palmer, Manus, Lethco, The Complete Book of Scales, Chords, Arpeggios & Cadences (Alfred); ABRSM, Piano Scales & Arpeggios; Evansville, Scale and Arpeggio Fingerings; MuseScore, "Inverting major triads"; Kostka & Payne, Tonal Harmony (McGraw-Hill).'
  loai: ten
- trang: piano/hop-am-rai
  id: n17
  cau: 'Nguyên tắc ngón bấm giống gam: mỗi quãng tám là một nhóm ngón, nối với nhóm sau bằng luồn ngón cái hoặc vắt ngón. Khác biệt là khoảng luồn xa hơn (một quãng 4 thay vì một bậc), nên vai trò của cẳng tay lớn hơn nhiều.'
  loai: khuyen-tap
- trang: piano/hop-am-rai
  id: n1
  cau: Hợp âm là "từ vựng" của tay trái và là khung hòa âm của nhiều bản nhạc bạn sẽ chơi.
  loai: khuyen-tap
- trang: piano/hop-am-rai
  id: n31
  cau: 'Chỗ khó là bước nhảy từ nốt trầm lên hợp âm: mắt nhìn trước vị trí hợp âm, tay rời nốt trầm và di chuyển ngay, đừng đợi.'
  loai: khuyen-tap
- trang: piano/nam-ngon
  id: n2
  cau: 'Thế tay năm ngón: năm ngón đặt trên năm phím liền nhau, ứng với năm bậc đầu của một gam.'
  loai: dinh-nghia
- trang: piano/nam-ngon
  id: n4
  cau: 'Hai tay đánh số ngón giống nhau: ngón cái là 1, ngón út là 5.'
  loai: quy-tac
- trang: piano/nam-ngon
  id: n5
  cau: 'Thế Đô: tay phải Ngón 1 trên Đô4 … ngón 5 trên Sol4; tay trái Ngón 5 trên Đô3 … ngón 1 trên Sol3.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n6
  cau: 'Thế Đô giữa: tay phải Ngón 1 trên Đô4 … ngón 5 trên Sol4; tay trái Ngón 5 trên Fa3 … ngón 1 trên Đô4.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n7
  cau: 'Thế Sol: tay phải Ngón 1 trên Sol4 … ngón 5 trên Rê5; tay trái Ngón 5 trên Sol2 … ngón 1 trên Rê3.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n8
  cau: 'Thế Fa: tay phải Ngón 1 trên Fa4 … ngón 5 trên Đô5; phím đen Si♭ (ngón 4 tay phải, ngón 2 tay trái); tay trái Ngón 5 trên Fa2 … ngón 1 trên Đô3.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n11
  cau: 'Tay trái là ảnh gương của tay phải: khi hai tay cùng đi lên (sang phải), tay phải đi 1 → 5 còn tay trái đi 5 → 1; khi hai tay đi ngược chiều từ hai ngón cái ra ngoài, hai tay dùng cùng số ngón cùng lúc.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n13
  cau: Năm nốt trưởng luôn theo mẫu cung – cung – nửa cung – cung.
  loai: dinh-nghia
- trang: piano/nam-ngon
  id: n14
  cau: Muốn đổi sang thứ, chỉ cần hạ bậc 3 xuống nửa cung, tức ngón 3 của cả hai tay dịch xuống một phím.
  loai: quy-tac
- trang: piano/nam-ngon
  id: n15
  cau: 'Bảng mười hai giọng, nhóm 1. trắng – trắng – trắng, giọng Đô: năm nốt (bậc 1–5) Đô Rê Mi Fa Sol; phím đen (ngón tay phải) –; thế thứ: bậc 3 thành Mi♭.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n16
  cau: 'Bảng mười hai giọng, nhóm 1. trắng – trắng – trắng, giọng Sol: năm nốt (bậc 1–5) Sol La Si Đô Rê; phím đen (ngón tay phải) –; thế thứ: bậc 3 thành Si♭.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n17
  cau: 'Bảng mười hai giọng, nhóm 1. trắng – trắng – trắng, giọng Fa: năm nốt (bậc 1–5) Fa Sol La Si♭ Đô; phím đen (ngón tay phải) Si♭ (4); thế thứ: bậc 3 thành La♭.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n18
  cau: 'Bảng mười hai giọng, nhóm 2. trắng – đen – trắng, giọng Rê: năm nốt (bậc 1–5) Rê Mi Fa♯ Sol La; phím đen (ngón tay phải) Fa♯ (3); thế thứ: bậc 3 thành Fa.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n19
  cau: 'Bảng mười hai giọng, nhóm 2. trắng – đen – trắng, giọng La: năm nốt (bậc 1–5) La Si Đô♯ Rê Mi; phím đen (ngón tay phải) Đô♯ (3); thế thứ: bậc 3 thành Đô.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n20
  cau: 'Bảng mười hai giọng, nhóm 2. trắng – đen – trắng, giọng Mi: năm nốt (bậc 1–5) Mi Fa♯ Sol♯ La Si; phím đen (ngón tay phải) Fa♯ (2), Sol♯ (3); thế thứ: bậc 3 thành Sol.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n21
  cau: 'Bảng mười hai giọng, nhóm 3. đen – trắng – đen, giọng Rê♭: năm nốt (bậc 1–5) Rê♭ Mi♭ Fa Sol♭ La♭; phím đen (ngón tay phải) Rê♭ (1), Mi♭ (2), Sol♭ (4), La♭ (5); thế thứ: bậc 3 thành Fa♭, tức phím Mi.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n22
  cau: 'Bảng mười hai giọng, nhóm 3. đen – trắng – đen, giọng La♭: năm nốt (bậc 1–5) La♭ Si♭ Đô Rê♭ Mi♭; phím đen (ngón tay phải) La♭ (1), Si♭ (2), Rê♭ (4), Mi♭ (5); thế thứ: bậc 3 thành Đô♭, tức phím Si.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n23
  cau: 'Bảng mười hai giọng, nhóm 3. đen – trắng – đen, giọng Mi♭: năm nốt (bậc 1–5) Mi♭ Fa Sol La♭ Si♭; phím đen (ngón tay phải) Mi♭ (1), La♭ (4), Si♭ (5); thế thứ: bậc 3 thành Sol♭.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n24
  cau: 'Bảng mười hai giọng, nhóm 4. riêng lẻ, giọng Fa♯ (= Sol♭): năm nốt (bậc 1–5) Fa♯ Sol♯ La♯ Si Đô♯; phím đen (ngón tay phải) Fa♯ (1), Sol♯ (2), La♯ (3), Đô♯ (5); thế thứ: bậc 3 thành La.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n25
  cau: 'Bảng mười hai giọng, nhóm 4. riêng lẻ, giọng Si♭: năm nốt (bậc 1–5) Si♭ Đô Rê Mi♭ Fa; phím đen (ngón tay phải) Si♭ (1), Mi♭ (4); thế thứ: bậc 3 thành Rê♭.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n26
  cau: 'Bảng mười hai giọng, nhóm 4. riêng lẻ, giọng Si: năm nốt (bậc 1–5) Si Đô♯ Rê♯ Mi Fa♯; phím đen (ngón tay phải) Đô♯ (2), Rê♯ (3), Fa♯ (5); thế thứ: bậc 3 thành Rê.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n27
  cau: Bảng xếp mười hai giọng theo màu phím của bậc 1, 3 và 5 (cũng là ba nốt của hợp âm chủ), để tay nhớ hình dạng.
  loai: cau-truc
- trang: piano/nam-ngon
  id: n28
  cau: Rê♭ thứ cần tám dấu giáng nên không có hóa biểu, còn La♭ thứ cần bảy; Đô♯ thứ có bốn dấu thăng và Sol♯ thứ có năm; cùng phím đàn, ít dấu hóa hơn.
  loai: cau-truc
- trang: piano/nam-ngon
  id: n46
  cau: 'Luồn ngón cái và vắt ngón: ngón cái đi dưới bàn tay (hoặc ngón 3, 4 vắt qua ngón cái) để tay đi tiếp mà không ngắt tiếng.'
  loai: dinh-nghia
- trang: piano/nam-ngon
  id: n47
  cau: 'Thay ngón trên một phím: giữ phím rồi đổi ngón (ví dụ ngón 3 thay ngón 1) để chuẩn bị thế mới mà vẫn liền tiếng.'
  loai: dinh-nghia
- trang: piano/nam-ngon
  id: n52
  cau: 'Câu hỏi 1: ở thế Đô, tay trái đặt ngón 5 trên Đô3 (C3), ngón 1 trên Sol3.'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n53
  cau: 'Câu hỏi 2: khi tay phải bắt đầu ở Đô4, tay trái ở Sol3 và hai tay đi ngược chiều, hai tay dùng cùng số ngón: 1 với 1, 2 với 2…'
  loai: quy-tac
- trang: piano/nam-ngon
  id: n54
  cau: 'Câu hỏi 3: đổi năm ngón trưởng thành thứ bằng cách hạ bậc 3 xuống nửa cung (bậc 3 nằm dưới ngón 3 của cả hai tay).'
  loai: quy-tac
- trang: piano/nam-ngon
  id: n55
  cau: 'Câu hỏi 4: năm ngón Rê trưởng có phím đen Fa♯ (Rê – Mi – Fa♯ – Sol – La).'
  loai: cau-truc
- trang: piano/nam-ngon
  id: n57
  cau: 'Nguồn: Nancy Faber, Randall Faber, Adult Piano Adventures: All-in-One Piano Course, Book 1, Faber Piano Adventures.'
  loai: ten
- trang: piano/nam-ngon
  id: n58
  cau: 'Nguồn: Willard A. Palmer, Morton Manus, Amanda Vick Lethco, Alfred''s Basic Adult Piano Course, Level 1, Alfred Music.'
  loai: ten
- trang: piano/nam-ngon
  id: n59
  cau: 'Nguồn: Béla Bartók, Mikrokosmos, quyển 1: có những bài giai điệu hai tay chơi đồng âm (unison).'
  loai: ten
- trang: piano/nam-ngon
  id: n49
  cau: 'Bảng "Năm phút mỗi ngày": thả rơi cánh tay, kiểm tra tư thế; năm ngón trưởng rồi thứ ở giọng của tuần theo nhóm (Đô, Sol, Fa; rồi Rê, La, Mi…); song song rồi ngược chiều ở ♩ = 60–80; một tay legato một tay staccato rồi đổi vai; "Bài ca buổi sáng" ở giọng của tuần (đọc bản Đô trưởng, chơi ở giọng khác).'
  loai: khuyen-tap
- trang: piano/nam-ngon
  id: n3
  cau: Ngón nào chưa chơi vẫn nằm nhẹ trên phím của nó, sẵn sàng.
  loai: khuyen-tap
- trang: piano/nam-ngon
  id: n9
  cau: Thế Đô là thế đầu tiên của trang này.
  loai: khuyen-tap
- trang: piano/not-lap-not-kep
  id: n2
  cau: Muốn đánh lại một nốt, bộ máy bên trong (phím, cần đẩy, búa) phải về lại vị trí sẵn sàng; nếu ngón đè phím xuống trước khi phím trồi lên đủ, nốt sẽ không kêu, hoặc lúc kêu lúc không.
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n4
  cau: Đàn cánh có cơ cấu thoát kép (double escapement), do nhà Érard đăng ký bằng sáng chế ở Anh năm 1821; nó là tiền thân của cơ cấu đàn cánh ngày nay.
  loai: lich-su
- trang: piano/not-lap-not-kep
  id: n5
  cau: 'Sau khi búa đập dây, búa được giữ ở lưng chừng và một cần lặp (repetition lever) đặt lại cơ cấu đẩy, nên khi phím mới trồi lên một phần, bộ máy đã sẵn sàng: bạn đánh lại được mà không cần nhả phím hết.'
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n6
  cau: 'Đàn đứng thông thường không có cơ cấu thoát kép: phím phải trồi lên gần như hết mới đánh lại được; nốt lặp rất nhanh trên đàn đứng vì thế khó hơn, và bạn phải nhả phím nhiều hơn.'
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n12
  cau: 'Beethoven, Sonata Op. 49 số 2: hình đệm nốt lặp tay trái ở ô 6–8, 21–24, nốt lặp ở ô 59–62 và quãng ba ngân ở ô 44–48.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n13
  cau: 'Bài 1 (đổi ngón trên nốt lặp): ô 1–2 nhóm ba với 3-2-1, ô 3–4 nhóm bốn với 4-3-2-1; tay trái chơi hợp âm lặp.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n20
  cau: 'Bài 2 (hợp âm lặp pp, nốt lặp nhịp chấm dôi): tay trái tám hợp âm đều mỗi ô, tay phải ô 2 ba nốt Fa lặp nhịp chấm dôi đổi ngón 3-2-1 rồi ngón 3 vắt qua ngón cái xuống Mi; giai điệu mp, hợp âm pp.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n21
  cau: Nốt kép là hai nốt chơi cùng lúc bằng một tay, thường là quãng ba hoặc quãng sáu.
  loai: dinh-nghia
- trang: piano/not-lap-not-kep
  id: n25
  cau: Tai người nghe theo bè trên.
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n28
  cau: 'Bài 3 (ba cặp ngón của quãng ba): tay phải ô 1–2, tay trái ô 3–4, hai tay ô 5–6.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n29
  cau: 'Bài 4: ở ô 1, trong lúc ngân quãng ba Rê–Fa♯, thay 3–5 bằng 2–4 để ngón 5 rảnh cho Sol ở ô 2; ở ô 3 ngón cái nhảy từ Đô xuống Si nên bè dưới hở, bè trên Mi–Rê (ngón 3 sang 2) vẫn liền.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n31
  cau: Tay nhỏ tập quãng sáu ngắn và dừng khi thấy căng.
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n32
  cau: 'Bài 5 (quãng sáu, bè trên 4–5, ngón cái trượt): ở Fa♯ ngón 4 vắt qua ngón 5 lên phím đen; ở ô 2 ngón 5 luồn dưới ngón 4 xuống Mi; ngón cái trượt từ Fa♯ xuống Sol.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n34
  cau: 'Bài 6 (nốt kép staccato): ô 1–2 quãng ba, ô 3–4 quãng sáu; chậm, p, đặt sẵn hai ngón trước mỗi nốt; sau đó tăng tốc, rồi thử f bằng cẳng tay.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n36
  cau: Đích đến nổi tiếng là Étude Op. 25 số 6 (Sol♯ thứ) của Chopin, một étude về quãng ba.
  loai: ten
- trang: piano/not-lap-not-kep
  id: n37
  cau: Cùng tập ấy, số 8 (Rê♭ trưởng) là étude về quãng sáu.
  loai: ten
- trang: piano/not-lap-not-kep
  id: n38
  cau: Trong 12 Études, Debussy cũng viết riêng Pour les tierces, Pour les sixtes và Pour les notes répétées.
  loai: ten
- trang: piano/not-lap-not-kep
  id: n39
  cau: 'Bảng "Tập theo chặng": chặng 4 (≈ Grade 4–5), 5 (≈ Grade 6), 6 (≈ Grade 7–8), 7 (sau Grade 8).'
  loai: cap-do
- trang: piano/not-lap-not-kep
  id: n45
  cau: Sonata K. 141 của Scarlatti có nốt lặp nhanh gần như suốt bài.
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n46
  cau: Étude Op. 10 số 3 của Chopin có đoạn quãng sáu kép.
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n49
  cau: 'Quiz 2: nốt lặp nhanh trên đàn cánh dễ hơn đàn đứng vì cơ cấu thoát kép cho phép đánh lại khi phím mới trồi lên một phần; trên đàn đứng thông thường phím phải trồi lên gần như hết.'
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n51
  cau: 'Quiz 4: khi không thể nối cả hai bè của chuỗi quãng ba, ưu tiên giữ bè trên legato vì bè trên thường là giai điệu và tai người nghe theo bè trên.'
  loai: quy-tac
- trang: piano/not-lap-not-kep
  id: n53
  cau: 'Mục Nguồn: Yamaha, The Structure of the Piano: cơ cấu lặp do Érard phát minh.'
  loai: lich-su
- trang: piano/not-lap-not-kep
  id: n54
  cau: 'Mục Nguồn: M. Steinert & Sons, "The Grand vs. Upright piano action – deep dive": so sánh cơ cấu đàn cánh và đàn đứng.'
  loai: ten
- trang: piano/not-lap-not-kep
  id: n55
  cau: 'Mục Nguồn: Arthur A. Reblitz, Piano Servicing, Tuning, and Rebuilding (Vestal Press): cơ cấu đàn và cách điều chỉnh.'
  loai: ten
- trang: piano/not-lap-not-kep
  id: n56
  cau: 'Mục Nguồn: Hanon, Le Pianiste virtuose: phần ba có các bài nốt lặp, quãng ba và quãng tám.'
  loai: cau-truc
- trang: piano/not-lap-not-kep
  id: n57
  cau: 'Mục Nguồn: Carl Czerny, Die Schule der Geläufigkeit Op. 299.'
  loai: ten
- trang: piano/not-lap-not-kep
  id: n58
  cau: 'Mục Nguồn: Heinrich Neuhaus, The Art of Piano Playing (bản tiếng Nga in lần đầu năm 1958).'
  loai: nam
- trang: piano/not-lap-not-kep
  id: n59
  cau: 'Mục Nguồn: Seymour Fink, Mastering Piano Technique (Amadeus Press).'
  loai: nam
- trang: piano/not-lap-not-kep
  id: n60
  cau: 'Mục Nguồn: Graham Fitch, Practising the Piano (practisingthepiano.com).'
  loai: ten
- trang: piano/not-lap-not-kep
  id: n61
  cau: 'Mục Nguồn: bản nhạc các étude trên IMSLP (Chopin Etudes Op. 25, Debussy Etudes).'
  loai: ten
- trang: piano/not-lap-not-kep
  id: n14
  cau: Bắt đầu thật chậm, nghe từng nốt kêu; tăng dần với máy đếm nhịp; nốt nào không kêu là bạn chưa nhả phím đủ.
  loai: khuyen-tap
- trang: piano/not-lap-not-kep
  id: n40
  cau: 'Cột "Nốt lặp" và "Nốt kép" của bảng chặng: nốt lặp chậm có hướng, hợp âm lặp pp, nốt lặp nhịp chấm dôi đổi ngón, hợp âm lặp dưới giai điệu, nốt lặp nhanh liên tục; quãng ba trong thế năm ngón, quãng ba, sáu legato, tô bè trên, quãng ba sáu song song ở pp, nốt kép staccato, gam quãng ba và sáu nếu đi thi, quãng ba nửa cung, quãng sáu nhanh.'
  loai: khuyen-tap
- trang: piano/not-lap-not-kep
  id: n26
  cau: 'Tô bè trên: nghiêng trọng lượng về phía ngón út; ngón bè dưới nhẹ như chỉ chạm phím; bốn bước tập (bè trên riêng, bè dưới riêng, ghép với bè dưới bấm câm, chơi bình thường).'
  loai: khuyen-tap
- trang: piano/quang-tam-buoc-nhay
  id: n2
  cau: Quãng tám là khoảng cách giữa hai nốt cùng tên, ví dụ Đô4 – Đô5.
  loai: dinh-nghia
- trang: piano/quang-tam-buoc-nhay
  id: n3
  cau: 'Hai nốt của một quãng tám luôn cùng màu phím: cả hai phím trắng, hoặc cả hai phím đen.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n6
  cau: Giữ tay mở căng suốt một đoạn dài làm mỏi tay; nên khép tay một chút giữa hai quãng tám.
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n9
  cau: 'Tay nhỏ: nếu chỉ vừa với tới quãng tám, đừng ép; dùng 1–5 cả trên phím đen, chơi bằng cạnh ngón cái, đừng giữ tay mở giữa các quãng tám; với đoạn quãng tám dày đặc, hỏi thầy cách bỏ bớt một nốt nhân đôi hoặc chuyển nốt sang tay kia.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n13
  cau: 'Không bao giờ khóa cổ tay: cổ tay là bộ giảm xóc; hãy giữ nó linh hoạt, không gồng khuỷu, vai và cổ tay.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n14
  cau: 'Bài 1 (rơi và nảy): ô 1–2 tay phải quãng tám Đô, Rê, Mi, Rê; ô 3–4 tay trái; ô 5–6 ghép hai tay; mf, mỗi quãng tám nốt đen xen dấu lặng.'
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n17
  cau: 'Bài 2 (gam quãng tám, cổ tay rồi cánh tay): ô 1–2 (và 5–6 tay trái) cổ tay, p; ô 3–4 (và 7–8) cánh tay, f; khi đã quen, chơi gam Rê trưởng với Fa♯ và Đô♯ bằng 1–4.'
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n19
  cau: Người nghe theo bè trên.
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n21
  cau: 'Bài 3 (quãng tám legato, bè trên nối bằng ngón): ngón cái chơi mọi nốt dưới, trượt từ Fa♯ xuống Sol và từ Si♭ xuống La; tay nhỏ dùng 4 cho Fa♯ và chấp nhận một chỗ hở rất ngắn.'
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n23
  cau: Trên đàn cánh, phím không cần trồi lên hết mới đánh lại được.
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n24
  cau: Phần đệm bài hát Erlkönig của Schubert mở đầu bằng những chùm ba quãng tám lặp dồn dập ở tay phải, là thử thách sức bền quen thuộc của người đệm đàn.
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n25
  cau: Ví dụ nổi tiếng của quãng tám gãy là tiếng rung quãng tám ở tay trái trong chương 1 sonata Pathétique của Beethoven.
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n26
  cau: 'Bài 4 (quãng tám lặp theo nhóm, rồi quãng tám gãy): ô 1–2 tay phải nhấn nhẹ nốt đầu mỗi nhóm ba, ô 3–4 tay trái quãng tám gãy; ghi theo 12/8.'
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n31
  cau: 'Hình đệm nốt trầm – hợp âm là bước nhảy gặp nhiều nhất: valse ở nhịp 3/4, nhịp chèo của barcarolle ở 6/8, và kiểu stride ở 2/4 như trong ragtime.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n35
  cau: 'Bài 5 (tay trái valse, nhảy sớm, đánh đúng lúc): ô 5, 6 và 8 nốt trầm thấp hơn một quãng tám; tay trái riêng trước theo năm bước, rồi thêm tay phải p và bàn đạp ngay sau nốt trầm.'
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n39
  cau: 'Bài 6 (tay phải, hợp âm giữa và quãng tám cao): ô 1–4 dấu lặng là lúc tay đi; Đô♯ – Đô♯ ở ô 3 là phím đen dùng 1–4; ô 5–6 bỏ dấu lặng.'
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n40
  cau: Quãng tám và bước nhảy dễ làm mỏi tay nếu tập lâu hoặc gồng; nên giảm gồng giữa các quãng tám lặp.
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n41
  cau: Tập quãng tám thành các đợt ngắn xen nghỉ; một gợi ý thường gặp là 20 phút tập, 10 phút nghỉ; tập mf cho tới khi tay thả lỏng hẳn rồi mới thêm f.
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n42
  cau: 'Đau, tê hay căng ở cẳng tay, cổ tay, khuỷu: dừng ngay, không chơi xuyên cơn đau; đau trở lại thì đi khám.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n43
  cau: 'Bảng "Tập theo chặng": chặng 4 (≈ Grade 4–5), 5 (≈ Grade 6), 6 (≈ Grade 7–8), 7 (sau Grade 8).'
  loai: cap-do
- trang: piano/quang-tam-buoc-nhay
  id: n48
  cau: Czerny, 6 Octave Studies (Sáu étude quãng tám) Op. 553.
  loai: ten
- trang: piano/quang-tam-buoc-nhay
  id: n49
  cau: Theodor Kullak, Die Schule des Octavenspiels (Giáo trình chơi quãng tám) Op. 48.
  loai: ten
- trang: piano/quang-tam-buoc-nhay
  id: n50
  cau: Étude Op. 25 số 10 của Chopin là étude quãng tám cho cả hai tay.
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n51
  cau: Chủ đề Étude Op. 10 số 12 đi bằng quãng tám ở tay phải.
  loai: cau-truc
- trang: piano/quang-tam-buoc-nhay
  id: n56
  cau: 'Quiz 4: đang tập quãng tám thì thấy đau cẳng tay, nên dừng ngay, nghỉ, rồi quay lại bằng buổi ngắn, nhỏ tiếng; đừng chơi xuyên cơn đau; nếu đau trở lại, đi khám.'
  loai: quy-tac
- trang: piano/quang-tam-buoc-nhay
  id: n57
  cau: 'Mục Nguồn: Theodor Kullak, Die Schule des Octavenspiels Op. 48 (ba phần); bản nhạc trên IMSLP.'
  loai: lich-su
- trang: piano/quang-tam-buoc-nhay
  id: n58
  cau: 'Mục Nguồn: Carl Czerny, 6 Octave Studies Op. 553.'
  loai: ten
- trang: piano/quang-tam-buoc-nhay
  id: n59
  cau: 'Mục Nguồn: Heinrich Neuhaus, The Art of Piano Playing (bản tiếng Nga in lần đầu năm 1958): chương về kỹ thuật.'
  loai: nam
- trang: piano/quang-tam-buoc-nhay
  id: n60
  cau: 'Mục Nguồn: Seymour Fink, Mastering Piano Technique (Amadeus Press, 1992).'
  loai: nam
- trang: piano/quang-tam-buoc-nhay
  id: n61
  cau: 'Mục Nguồn: Thomas Mark, What Every Pianist Needs to Know About the Body (GIA Publications, 2003).'
  loai: nam
- trang: piano/quang-tam-buoc-nhay
  id: n62
  cau: 'Mục Nguồn: Graham Fitch, Practising the Piano (practisingthepiano.com).'
  loai: ten
- trang: piano/quang-tam-buoc-nhay
  id: n63
  cau: 'Mục Nguồn: British Association for Performing Arts Medicine (BAPAM), The Healthy Pianist.'
  loai: ten
- trang: piano/quang-tam-buoc-nhay
  id: n27
  cau: 'Gam quãng tám: một quy tắc cho cả hai tay là 1–5 trên phím trắng, 1–4 trên phím đen (tay nhỏ 1–5 ở mọi nốt); mỗi buổi chừng mười phút là đủ.'
  loai: khuyen-tap
- trang: piano/quang-tam-buoc-nhay
  id: n53
  cau: 'Quiz 1: quãng tám trên hai phím đen thường bấm 1–4 nếu tay đủ rộng; ngón 4 dài hơn ngón 5 nên với tới phím đen, vốn nằm sâu hơn, dễ hơn.'
  loai: khuyen-tap
- trang: piano/quang-tam-buoc-nhay
  id: n16
  cau: 'Staccato cổ tay: cẳng tay gần như yên, bàn tay vẫy từ cổ tay, ngón sát phím; nhỏ, nhanh, nhẹ, hợp với p. Staccato cánh tay: cả cẳng tay rơi và nảy; lớn và nặng, hợp với f và nốt nhấn.'
  loai: khuyen-tap
