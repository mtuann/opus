- trang: piano/tu-the
  id: n1
  cau: Tư thế ảnh hưởng đến cách bạn điều khiển tiếng đàn và đến sức khỏe đôi tay.
  loai: quy-tac
- trang: piano/tu-the
  id: n2
  cau: Một nốt piano to hay nhỏ phụ thuộc vào tốc độ phím đi xuống.
  loai: quy-tac
- trang: piano/tu-the
  id: n3
  cau: Một cánh tay thả lỏng điều khiển tốc độ phím tinh tế hơn nhiều so với những ngón tay gồng cứng.
  loai: quy-tac
- trang: piano/tu-the
  id: n4
  cau: 'Hãy tập sao cho động tác không gồng: khuỷu tay, vai và cổ tay không siết.'
  loai: quy-tac
- trang: piano/tu-the
  id: n5
  cau: Đau cổ tay, cẳng tay, cổ và vai là những vấn đề thường gặp ở người chơi piano; tư thế và việc tập lâu không nghỉ là các yếu tố nguy cơ.
  loai: quy-tac
- trang: piano/tu-the
  id: n6
  cau: Chiều cao ghế đúng khi cẳng tay gần song song với mặt phím; cẳng tay dốc lên là ghế quá thấp, dốc xuống nhiều là quá cao.
  loai: quy-tac
- trang: piano/tu-the
  id: n7
  cau: 'Khoảng cách tới đàn: ngồi đủ xa để ngực mở; thấy ngực bị bó là quá gần, phải chồm người về trước là quá xa.'
  loai: quy-tac
- trang: piano/tu-the
  id: n8
  cau: Trọng lượng cơ thể chia đều cho hai bên mông và hai bàn chân; kiểm tra bằng cách nghiêng người sang hai bên mà không mất thăng bằng.
  loai: quy-tac
- trang: piano/tu-the
  id: n10
  cau: 'Chân: hai bàn chân đặt vững trên sàn hoặc trên một bục chắc; chân phải ở gần bàn đạp vang; không phải nhón chân hay duỗi thẳng chân mới tới bàn đạp.'
  loai: quy-tac
- trang: piano/tu-the
  id: n12
  cau: Lưng thẳng tự nhiên, không gù, không gồng.
  loai: quy-tac
- trang: piano/tu-the
  id: n13
  cau: Vai thả xuống; hãy tự kiểm tra vai mỗi khi lật trang.
  loai: quy-tac
- trang: piano/tu-the
  id: n14
  cau: Cánh tay trên thả lỏng từ vai, khuỷu tay không gồng.
  loai: quy-tac
- trang: piano/tu-the
  id: n15
  cau: Nhìn từ trên xuống, cẳng tay thẳng hàng với ngón 3, 4, 5 chứ không phải với ngón cái; khi chơi xa sang hai bên, để cẳng tay di chuyển theo, đừng bẻ cổ tay sang ngang.
  loai: quy-tac
- trang: piano/tu-the
  id: n16
  cau: Cổ tay ở vị trí trung tính, không quá cao cũng không quá thấp; cách tìm là thả cánh tay buông thõng bên người rồi đưa lên phím; quan trọng hơn vị trí là sự linh hoạt, đừng khóa cứng cổ tay.
  loai: quy-tac
- trang: piano/tu-the
  id: n21
  cau: 'Hai tay đánh số giống nhau: ngón cái = 1, trỏ = 2, giữa = 3, áp út = 4, út = 5.'
  loai: quy-tac
- trang: piano/tu-the
  id: n22
  cau: Cùng năm nốt Đô–Rê–Mi–Fa–Sol, tay phải chơi bằng 1–2–3–4–5 còn tay trái chơi bằng 5–4–3–2–1.
  loai: quy-tac
- trang: piano/tu-the
  id: n24
  cau: Khi phím đi xuống, bộ máy đàn hất búa về phía dây; ngay trước khi chạm dây, búa được thả ra (cơ chế thoát, escapement) và bay tự do vào dây.
  loai: dinh-nghia
- trang: piano/tu-the
  id: n25
  cau: Tiếng đàn đã được quyết định trong khoảnh khắc phím đi xuống; muốn to hơn thì phím phải đi xuống nhanh hơn.
  loai: quy-tac
- trang: piano/tu-the
  id: n26
  cau: 'Ép phím sau khi chạm đáy không đổi được tiếng đàn: tiếng không to hơn, chỉ thêm lực thừa cho tay.'
  loai: quy-tac
- trang: piano/tu-the
  id: n27
  cau: Người mới thường làm ngược lại (ngón tay đẩy cứng, cánh tay gồng treo trên không), kết quả là tiếng đàn chát và tay mỏi sau mười lăm phút; khi quen dùng trọng lượng, chơi to dễ hơn và chơi nhỏ cũng đều hơn.
  loai: quy-tac
- trang: piano/tu-the
  id: n30
  cau: Những gì bạn không cảm thấy khi chơi thường lộ ra rất rõ trên video.
  loai: quy-tac
- trang: piano/tu-the
  id: n32
  cau: 'Kiểm tra trước mỗi buổi: cổ tay ở vị trí trung tính và mềm; hẹn giờ nghỉ 10 phút sau mỗi 20 phút tập.'
  loai: quy-tac
- trang: piano/tu-the
  id: n33
  cau: Đau, tê hoặc ngứa ran khi tập là tín hiệu dừng; hãy dừng lại, nghỉ.
  loai: quy-tac
- trang: piano/tu-the
  id: n34
  cau: Nếu tình trạng (đau, tê) kéo dài, hãy đi khám.
  loai: quy-tac
- trang: piano/tu-the
  id: n35
  cau: 'Bài kiểm tra: ghế đàn cao vừa khi cẳng tay gần song song với mặt phím; khi tay đau trong lúc tập nên dừng lại, nghỉ và tìm nguyên nhân; đau là tín hiệu cảnh báo, không phải dấu hiệu tiến bộ.'
  loai: quy-tac
- trang: piano/tu-the
  id: n38
  cau: 'Hình tu-the-ngoi (::hinh): tư thế ngồi nhìn ngang: lưng thẳng, vai và khuỷu tay thả lỏng, cẳng tay gần song song mặt phím, cổ tay không võng, bàn chân đặt vững, chân phải gần bàn đạp; ghế đàn chỉnh được độ cao.'
  loai: quy-tac
- trang: piano/tu-the
  id: n39
  cau: 'Hình the-tay (::hinh): thế đúng là cổ tay ở vị trí trung tính, khớp gốc ngón thành vòm, chạm phím bằng đầu ngón; hai lỗi là cổ tay võng xuống dưới mặt phím và gãy khớp đầu ngón khi nhấn (hai lỗi có trong bảng lỗi của trang).'
  loai: quy-tac
- trang: piano/tu-the
  id: n36
  cau: 'Bài kiểm tra: ngón cái chạm phím bằng cạnh đầu ngón giúp ngón cái nằm thoải mái và dễ luồn dưới bàn tay khi chơi gam; "nhấn rồi buông" là sau khi phím chạm đáy chỉ giữ lực vừa đủ.'
  loai: khuyen-tap
- trang: piano/tu-the
  id: n17
  cau: 'Thế tay: chạm bằng phần thịt gần đầu ngón (không phải móng); cắt móng ngắn; khớp đầu ngón vững, không gãy; các khớp ngón ở mu bàn tay tạo vòm; ngón cái chạm bằng cạnh đầu ngón; ngón út đứng trên đầu ngón; các ngón không chơi nghỉ nhẹ trên hoặc sát mặt phím.'
  loai: khuyen-tap
- trang: piano/tu-the
  id: n23
  cau: Hãy làm theo số ngón ngay từ đầu để tay quen một cách bấm ổn định; khi tự chọn ngón thì viết lên bản nhạc bằng bút chì và giữ nguyên mỗi lần tập.
  loai: khuyen-tap
- trang: piano/cach-tap
  id: n3
  cau: Ericsson và đồng nghiệp gọi những hoạt động đòi hỏi nỗ lực và được thiết kế để cải thiện thành tích là tập có chủ đích (deliberate practice).
  loai: dinh-nghia
- trang: piano/cach-tap
  id: n27
  cau: Khi bắt đầu căng tay ở một nấc tốc độ, hãy dừng tăng tốc độ và xem lại cách chơi (ví dụ ở ♩ = 76 của bảng).
  loai: quy-tac
- trang: piano/cach-tap
  id: n33
  cau: 'Buổi dài cần nghỉ thường hơn dòng "Nghỉ" của bảng: BAPAM khuyên tập khoảng 20 phút rồi nghỉ 10 phút.'
  loai: quy-tac
- trang: piano/cach-tap
  id: n48
  cau: 'Tập liền một mạch hàng giờ là lỗi thường gặp: BAPAM khuyên tập khoảng 20 phút rồi nghỉ 10 phút; đau là tín hiệu dừng lại.'
  loai: quy-tac
- trang: piano/cach-tap
  id: n54
  cau: K. Anders Ericsson, Ralf Th. Krampe, Clemens Tesch-Römer, "The role of deliberate practice in the acquisition of expert performance", Psychological Review 100(3), 1993.
  loai: ten
- trang: piano/cach-tap
  id: n55
  cau: Chuan C. Chang, Fundamentals of Piano Practice (sách điện tử trên readthedocs).
  loai: ten
- trang: piano/cach-tap
  id: n56
  cau: BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano), bản PDF.
  loai: ten
- trang: piano/cach-tap
  id: n57
  cau: 'Practising the Piano (practisingthepiano.com): bài viết và video về cách tập.'
  loai: ten
- trang: piano/cach-tap
  id: n58
  cau: Alvaro Pascual-Leone và cộng sự, "Modulation of muscle responses evoked by transcranial magnetic stimulation during the acquisition of new fine motor skills", Journal of Neurophysiology 74(3), 1995.
  loai: ten
- trang: piano/cach-tap
  id: n59
  cau: Gerald Klickstein, The Musician's Way (Oxford University Press, 2009); Molly Gebrian, Learn Faster, Perform Better (Oxford University Press, 2024).
  loai: ten
- trang: piano/cach-tap
  id: n38
  cau: Gần như ai cũng có những tuần thấy mình không tiến bộ; thường đó là dấu hiệu bạn đang tập lặp lại theo cùng một cách.
  loai: khuyen-tap
- trang: piano/cach-tap
  id: n19
  cau: 'Bước 9: nối đoạn 1 với 2, rồi 1–2–3…; thử nối ngược (backward chaining): học đoạn cuối trước, rồi nối đoạn áp cuối vào; nhờ vậy phần cuối bài, nơi hay mệt và hồi hộp, là phần chắc nhất; luôn tập riêng các mối nối (hai ô cuối đoạn trước cộng hai ô đầu đoạn sau).'
  loai: khuyen-tap
- trang: piano/cach-tap
  id: n28
  cau: Lặp lại một lỗi mười lần là đang luyện chính lỗi đó.
  loai: khuyen-tap
- trang: piano/hoc-thuoc-bieu-dien
  id: n3
  cau: Trong kỳ thi Practical Grades của ABRSM (theo chương trình hiện hành), chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm riêng; chỉ gam và hợp âm rải là bắt buộc chơi thuộc.
  loai: cap-do
- trang: piano/hoc-thuoc-bieu-dien
  id: n5
  cau: 'Có những nghệ sĩ lớn vẫn chơi với bản nhạc trên giá: những năm cuối sự nghiệp, Sviatoslav Richter biểu diễn trong khán phòng gần như tối, chỉ một ngọn đèn nhỏ chiếu lên bản nhạc trước mặt.'
  loai: lich-su
- trang: piano/hoc-thuoc-bieu-dien
  id: n7
  cau: Muốn thuộc bền thì phải hiểu bài được xây thế nào.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n10
  cau: Khi chơi thuộc, người chơi dùng nhiều loại trí nhớ cùng lúc; người chơi chắc có nhiều đường dẫn đến cùng một nốt nhạc, một đường bị chặn thì còn đường khác.
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n11
  cau: 'Bốn loại trí nhớ: vận động ("thuộc tay": chuỗi chuyển động của ngón và tay, hình thành qua lặp lại), thính giác (nghe trước trong đầu điều sắp vang lên), thị giác (hình ảnh trang nhạc hoặc hình bàn tay trên phím), phân tích (hiểu cấu trúc: đoạn, giọng, hợp âm, chỗ lặp, chỗ khác).'
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n14
  cau: 'Trí nhớ vận động giống một chuỗi mắt xích: mỗi chuyển động gọi chuyển động tiếp theo; nó nhanh và không tốn sự chú ý nên không thể thiếu, nhưng có hai điểm yếu.'
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n15
  cau: 'Đứt một mắt là đứt cả chuỗi: một nốt sai, một tiếng ho, một ý nghĩ "đoạn sau là gì nhỉ?" và tay dừng; chuỗi chỉ chạy từ những chỗ bắt đầu quen thuộc nên phải quay lại đầu câu, có khi đầu bài.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n16
  cau: 'Nó không chịu được sự soi xét: khi hồi hộp, bạn bắt đầu để ý từng ngón tay, đúng điều mà chuỗi tự động không chịu nổi.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n17
  cau: 'Trí nhớ vận động phụ thuộc hoàn cảnh: đàn lạ, ghế lạ, tốc độ khác (thường nhanh hơn vì hồi hộp) đều làm chuỗi dễ trật đường.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n18
  cau: Nhà tâm lý học Roger Chaffin và nghệ sĩ piano Gabriela Imreh đã ghi lại và phân tích quá trình Imreh học chương cuối (Presto) của Italienisches Konzert (Concerto Ý), BWV 971, của Bach.
  loai: lich-su
- trang: piano/hoc-thuoc-bieu-dien
  id: n19
  cau: Imreh ghi lại việc tập, rồi mô tả cấu trúc bản nhạc và các quyết định về ngón bấm, phân câu và những điểm mốc (performance cues) bà chú ý tới lúc biểu diễn; các chỗ bà ngập ngừng khi chơi thuộc, và những chỗ bà còn nhớ hai năm sau, đều gắn với các điểm mốc ấy.
  loai: lich-su
- trang: piano/hoc-thuoc-bieu-dien
  id: n20
  cau: 'Với các điểm mốc, người chơi mang trong đầu một bản đồ của tác phẩm: chẳng hạn ranh giới các đoạn, cảm xúc muốn truyền đến người nghe, cách phân câu, một ngón bấm then chốt; ngón tay chạy tự động, còn đầu óc đi theo bản đồ; khi có sự cố, các điểm mốc là chỗ để bám lại.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n23
  cau: Chỗ rẽ nhánh (hai đoạn mở đầu giống nhau nhưng đi tiếp theo hai hướng khác nhau) rất hay gặp giữa phần trình bày và phần tái hiện của hình thức sonata.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n36
  cau: Trong các thí nghiệm với đoạn văn xuôi, Roediger và Karpicke (2006) thấy rằng tự kiểm tra bằng cách gợi lại từ trí nhớ giúp nhớ lâu hơn đọc lại (sau 2 ngày và sau 1 tuần), gọi là hiệu ứng kiểm tra.
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n47
  cau: 'Hồi hộp trước khi biểu diễn rất phổ biến; nó gắn với adrenaline, chất giúp con người thoát khỏi nguy hiểm: tim có thể đập nhanh và cơ căng lên.'
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n48
  cau: Người ít kinh nghiệm hay chơi nhanh hơn mức bài chịu được vì hồi hộp.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n49
  cau: 'Chuẩn bị kỹ và diễn thử nhiều lần: diễn thử cho bạn thêm kinh nghiệm và sự tự tin, và hai thứ ấy làm bớt nỗi sợ điều chưa biết.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n50
  cau: Trong một thử nghiệm ngẫu nhiên với 46 nhạc công, chỉ một buổi tập thở chậm dài 30 phút đã giúp điều hòa phản ứng sinh lý khi chờ biểu diễn; những người vốn rất lo âu thì giảm lo âu nhiều hơn nhóm không tập (Wells và cộng sự, 2012).
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n52
  cau: Trong các thí nghiệm của Alison Wood Brooks (2014) với hát karaoke, nói trước người khác và làm toán, những người tự nhủ "Tôi đang hào hứng" làm tốt hơn những người cố tự trấn an "Bình tĩnh lại".
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n56
  cau: 'Uống rượu bia "cho bớt run": rượu làm giảm khả năng điều khiển tinh và phán đoán.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n57
  cau: 'Không nên tự dùng thuốc chẹn beta hay xin của người khác: một số nhạc công dùng theo đơn bác sĩ, nhưng đó là thuốc kê đơn, không dùng được cho một số người (chẳng hạn người bị hen suyễn).'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n60
  cau: Nếu hồi hộp khiến bạn khổ sở, né mọi dịp chơi cho người khác nghe, mất ngủ hoặc có những cơn hoảng sợ, hãy nói chuyện với bác sĩ hoặc chuyên gia tâm lý.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n61
  cau: Liệu pháp nhận thức – hành vi (CBT) là một hướng điều trị thường dùng cho lo âu.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n68
  cau: 'Câu hỏi 4: theo nghiên cứu của Brooks (2014), trước giờ lên sân khấu nên tự nhủ "Mình đang hào hứng" (hơn là "Bình tĩnh lại" hay "Đừng sai"); gọi cảm giác ấy là hào hứng giúp làm tốt hơn so với cố tự trấn an.'
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n70
  cau: 'Mục Nguồn: Roger Chaffin, Gabriela Imreh, "Practicing perfection: Piano performance as expert memory", Psychological Science 13(4), 2002, tr. 342–349.'
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n71
  cau: 'Mục Nguồn: thêm Chuan C. Chang, Fundamentals of Piano Practice (mục III.6, III.14, III.15); NHS (CBT, Beta blockers); Open Music Theory (Sonata form).'
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n72
  cau: 'Mục Nguồn: Henry L. Roediger III, Jeffrey D. Karpicke, "Test-enhanced learning: Taking memory tests improves long-term retention", Psychological Science 17(3), 2006; Alison Wood Brooks, "Get excited…", J. Exp. Psychol.: General 143(3), 2014, tr. 1144–1158; Wells và cộng sự, PLoS ONE 7(10), 2012, e46597; Stephen Plaistow, Gramophone, 10/1997.'
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n73
  cau: 'Mục Nguồn: ABRSM, chương trình thi piano Practical Grades hiện hành, phần quy định về chơi thuộc.'
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n74
  cau: 'Mục Nguồn: Dianna T. Kenny, The Psychology of Music Performance Anxiety (OUP, 2011); Gerald Klickstein, The Musician''s Way (OUP, 2009); Molly Gebrian, Learn Faster, Perform Better (OUP, 2024).'
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n54
  cau: 'Đặt sự chú ý vào âm nhạc: trước mỗi đoạn, nghĩ đến tính cách của nó bằng một hai chữ ("dịu dàng", "rộn ràng"), giống các điểm mốc ở phần trên; nghĩ về âm thanh muốn tạo ra, không phải về ngón tay.'
  loai: khuyen-tap
- trang: piano/hoc-thuoc-bieu-dien
  id: n44
  cau: 'Quy tắc số một khi biểu diễn: giữ nhịp, không quay lại; nhạc dừng giữa chừng làm hỏng cả mạch bài nhiều hơn một nốt sai.'
  loai: khuyen-tap
- trang: piano/hoc-thuoc-bieu-dien
  id: n21
  cau: 'Dấu hiệu bạn đang chỉ "thuộc tay": chỉ chơi được từ đầu và ở tốc độ quen thuộc; chơi chậm lại thì quên; không chơi được từng tay riêng; không trả lời được "ô nhịp này đang ở hợp âm nào?".'
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n1
  cau: 'Chơi piano là một hoạt động thể chất: một bài vài phút gồm rất nhiều chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm.'
  loai: dinh-nghia
- trang: piano/suc-khoe
  id: n2
  cau: Nhiều cơn đau thường gặp ở người chơi đàn liên quan đến quá tải và căng cơ, tức là những thứ bạn có thể điều chỉnh.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n5
  cau: Giới y khoa gọi chung các vấn đề này là rối loạn cơ xương liên quan đến chơi nhạc (playing-related musculoskeletal disorders).
  loai: ten
- trang: piano/suc-khoe
  id: n6
  cau: Một tổng quan hệ thống về người chơi piano (Bragge và cộng sự, 2006) ghi nhận tỷ lệ mắc trong các nghiên cứu dao động rất rộng, từ 26% đến 93%.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n7
  cau: 'Con số chính xác khó biết, nhưng kết luận thì rõ: nhiều người chơi piano từng đau vì chơi đàn.'
  loai: so-lieu
- trang: piano/suc-khoe
  id: n8
  cau: Đau là tín hiệu, không phải bằng chứng của sự chăm chỉ; câu "không đau thì không tiến bộ" không áp dụng cho đôi tay của người chơi đàn.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n9
  cau: BAPAM coi mỏi và căng là dấu hiệu để xem lại kỹ thuật, cách tập và chương trình tập; còn đau thì dừng ngay.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n10
  cau: 'Bảng "Mỏi, căng: xem lại cách tập" và "Đau và dấu hiệu bất thường: dừng": mỏi đều ở cẳng tay hoặc vai sau buổi tập dài, giảm khi nghỉ, không gắn với động tác cụ thể, cảm giác bình thường; ngược lại, đau ở một điểm, đau không hết hoặc nặng dần, đau nhói ở một động tác, tê, kim châm, yếu tay, vụng về.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n11
  cau: Các nghiên cứu chưa thống nhất yếu tố nào quan trọng nhất (chính tổng quan của Bragge cũng ghi nhận điều đó), nhưng dưới đây là những yếu tố mà tài liệu về sức khỏe nhạc công (như BAPAM) nhắc tới.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n12
  cau: 'Hàng "Tăng thời lượng tập đột ngột": tay cần thời gian để thích nghi với tải mới; cách giảm: tăng dần qua nhiều tuần, học bài mới đủ sớm trước hạn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n13
  cau: 'Hàng "Buổi tập dài không nghỉ": tay cần thời gian hồi phục giữa các lượt tập; tập khoảng 20 phút rồi nghỉ 10 phút, chia thành nhiều lượt ngắn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n15
  cau: 'Hàng "Căng cơ thừa": ép phím, vai nhô, cổ tay khóa, nín thở làm cơ gồng liên tục nên mỏi nhanh; cách giảm: "nhấn rồi buông".'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n16
  cau: 'Hàng "Ghế, tư thế, cây đàn không phù hợp": tay phải bù cho tư thế sai; chỉnh ghế mỗi buổi, đàn có bộ máy phím tốt; liên kết Chọn đàn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n18
  cau: 'Hàng "Không khởi động": cơ chưa được làm ấm, máu chưa đủ tới tay; làm ấm tay và khởi động nhẹ trước khi tập kỹ thuật.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n19
  cau: 'Hàng "Bài quá khó quá sớm": tay làm những việc chưa có kỹ thuật để làm; chọn bài vừa sức.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n20
  cau: 'Hàng "Căng thẳng, thiếu ngủ": cơ căng hơn, hồi phục chậm hơn; ngủ đủ, để ý lúc gồng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n21
  cau: 'Hàng "Tải từ việc khác": gõ phím, nhắn tin, xách đồ nặng, thể thao hay làm vườn; đôi tay chỉ có một; tính tổng tải trong ngày, bớt tập vào hôm tay đã làm việc nặng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n22
  cau: 'Khởi động nhẹ vài phút, mục đích là làm ấm chứ không phải kéo giãn: rửa tay nước ấm, xoay vai, lắc tay, xoay cổ tay, thả rơi cánh tay, năm ngón hoặc gam chậm.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n23
  cau: Đừng kéo giãn mạnh, bẻ ngón tay ra sau hay cố "dang tay cho rộng" trước khi chơi; đoạn khó nhất để sau khi tay đã ấm.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n24
  cau: '"Tập khoảng 20 phút rồi nghỉ 10 phút (theo BAPAM): đứng dậy, đi lại, buông thõng tay"; đặt hẹn giờ; nghỉ thật ngắn giữa các lần lặp, giữa các câu nhạc; muốn tập lâu trong ngày thì chia thành nhiều lượt ngắn xen nghỉ.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n25
  cau: Đôi tay thích nghi với tải tăng dần, không phải với những cú nhảy; BAPAM khuyên tránh tăng đột ngột thời lượng tập; ví dụ từ 30 lên 60 phút mỗi ngày thì đi qua nhiều tuần, chỉ tăng khi tay vẫn thoải mái; trước kỳ thi hay buổi diễn đừng nhân đôi thời gian tập tuần cuối.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n28
  cau: Bàn phím piano phổ biến hiện nay có quãng tám rộng khoảng 6,5 inch (khoảng 16,5 cm) cho mọi người chơi, bất kể cỡ tay.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n29
  cau: Theo PASK, độ dang tay của người lớn có thể chênh nhau tới khoảng 12,7 cm (5 inch), và trung bình tay nam dang hơn tay nữ khoảng 2,5 cm.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n30
  cau: Trong một nghiên cứu lâm sàng trên 200 nghệ sĩ và sinh viên piano ở Nhật Bản bị đau tay do tập quá mức (Sakai, 2002), 70 người cho biết triệu chứng bắt đầu khi họ đang tập một kỹ thuật bàn phím nhất định; quãng tám (30 người) và hợp âm (22 người) là hai kỹ thuật gặp nhiều nhất.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n32
  cau: Có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 (thường gọi là "7/8") và DS6.0 ("15/16"); PASK vận động để chúng phổ biến hơn; theo PASK (tính đến 2026), chúng chỉ có từ một số ít nguồn, giá cao và người mua thường phải chờ lâu.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n33
  cau: 'Ghế, tư thế, cây đàn: đàn điện có chân chắc, không rung; độ nặng phím hợp với tay bạn, vì BAPAM nhắc nên cân nhắc phím nhẹ hay nặng hợp hơn cho việc tập thường xuyên.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n34
  cau: 'Vận động toàn thân: BAPAM khuyên giữ thể lực bằng vận động nhịp điệu đều như bơi, đi bộ hay chạy; các môn dùng tạ và nắm tay chặt không hợp với người chơi piano. Giữ ấm: những ngày rét, làm ấm tay trước khi tập, như rửa tay nước ấm.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n35
  cau: 'Bảng dấu hiệu cảnh báo: đau ở một điểm khi chơi và còn sau khi dừng thì dừng buổi tập và cho tay nghỉ, không đỡ thì đi khám; đau quay lại mỗi lần chơi một đoạn nhất định thì giảm thời lượng, xem lại kỹ thuật với thầy, còn kéo dài thì đi khám.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n36
  cau: 'Tê, kim châm ở ngón tay; yếu tay, vụng về khi cầm đồ vật; sưng hay đỏ quanh khớp ngón hoặc cổ tay: đi khám.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n37
  cau: 'Đau không hết hoặc nặng dần, kể cả khi đã nghỉ chơi đàn: đi khám.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n38
  cau: 'Một ngón co quắp hay "không nghe lời" ở một động tác nhất định, không đau: gặp bác sĩ thần kinh (xem bên dưới).'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n39
  cau: 'Hộp "Khi vừa thấy đau": 1. Dừng lại, đừng chơi xuyên qua cơn đau, kể cả khi sắp đến ngày thi; 2. Ghi lại đau ở đâu, đoạn nào, sau bao lâu, tuần này có tập nhiều hơn không; 3. Quay lại từ từ khi đã hết đau hoặc theo chỉ dẫn bác sĩ: buổi ngắn, bài chậm, đơn giản, nhỏ tiếng, dừng ngay nếu đau trở lại.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n40
  cau: Loạn trương lực cơ khu trú ở nhạc công (musician's focal dystonia) là một rối loạn thần kinh hiếm gặp, ước tính khoảng 1–2% nhạc công chuyên nghiệp (Altenmüller và Jabusch, 2010; BAPAM).
  loai: so-lieu
- trang: piano/suc-khoe
  id: n41
  cau: 'Nó thường không đau lúc đầu: một hay vài ngón tự co vào một tư thế bất thường hoặc không nghe lời khi chơi đàn; những việc khác có thể vẫn bình thường, dù đôi khi vấn đề lan sang các việc tinh khác như viết hay gõ phím.'
  loai: dinh-nghia
- trang: piano/suc-khoe
  id: n42
  cau: Cố tập nhiều hơn để "sửa" có thể làm triệu chứng nặng thêm.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n43
  cau: 'Nhưng đừng vội hoảng: phần lớn những ngón tay "vụng" ở người mới học chỉ là chưa được tập đủ, hoặc đang bị căng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n44
  cau: Nếu nghi ngờ loạn trương lực, nhờ bác sĩ gia đình giới thiệu đến bác sĩ thần kinh có quan tâm đặc biệt đến rối loạn vận động; BAPAM cũng khuyên nên được chuyên gia y học nghệ thuật biểu diễn đánh giá khi bạn chơi đàn.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n45
  cau: 'Ở Việt Nam: bắt đầu bằng một bác sĩ ở cơ sở y tế bạn tin cậy, nói rõ mình chơi đàn và tập bao lâu mỗi ngày, nhờ giới thiệu đến chuyên khoa phù hợp; tê, yếu hay mất kiểm soát ngón tay thì nhờ giới thiệu đến bác sĩ thần kinh.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n47
  cau: 'Khi bác sĩ đã cho phép chơi lại, nhờ thầy xem kỹ thuật ở đoạn gây đau: BAPAM khuyên xem lại cách chơi để đau khỏi tái phát, vì nguyên nhân có thể nằm ở một thói quen nhỏ như cổ tay khóa hay ngón cái ép chặt.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n48
  cau: Ở Anh, BAPAM (British Association for Performing Arts Medicine) là tổ chức từ thiện y tế dành cho người làm nghề nghệ thuật biểu diễn ở Anh, có tư vấn miễn phí (tính đến 2026).
  loai: ten
- trang: piano/suc-khoe
  id: n49
  cau: Ở Mỹ, PAMA (Performing Arts Medicine Association) quy tụ chuyên gia y tế, nghệ sĩ, nhà giáo và nhà quản lý, và có danh bạ giới thiệu người cung cấp dịch vụ cho người biểu diễn.
  loai: ten
- trang: piano/suc-khoe
  id: n50
  cau: Nếu bạn sống ở những nước này, đó là nơi bạn có thể tìm đến.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n51
  cau: 'Danh sách kiểm tra hằng tuần: không tăng thời lượng quá nhiều so với tuần trước; nghỉ 10 phút sau mỗi 20 phút tập; chia đoạn nặng thành nhiều lần ngắn; quay video tay mình và đối chiếu với tư thế; không có cơn đau, tê hay yếu kéo dài.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n52
  cau: 'Câu hỏi 1: đau ở một điểm ở cổ tay, vẫn còn sau khi đã nghỉ, là tín hiệu cần dừng tập; cẳng tay hơi mỏi đều sau buổi dài, giảm đi khi nghỉ, chưa phải; lời giải thích: mỏi và căng là lúc xem lại cách tập, đau khu trú, kéo dài hoặc lặp lại là tín hiệu cần dừng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n53
  cau: 'Câu hỏi 2: còn một tuần nữa là thi thì giữ thời lượng gần như cũ, nghỉ đều, tập chậm và tập trong đầu; không nhân đôi thời gian tập, không tập liền ba tiếng không nghỉ; tăng tải đột ngột là yếu tố nguy cơ, tuần cuối là lúc giữ sức.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n54
  cau: 'Câu hỏi 3: tay nhỏ, bài nhiều quãng tám: khép tay lại giữa các quãng tám, di chuyển bằng cả cánh tay, chọn bài khác nếu vẫn căng; lời giải thích: bàn tay mở căng hết cỡ và lặp lại nhiều lần là một yếu tố nguy cơ gây quá tải.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n55
  cau: 'Câu hỏi 4: một ngón tự co lại mỗi khi chơi một đoạn chạy nốt, không đau, mọi việc khác bình thường: gặp bác sĩ thần kinh, tốt nhất là người có kinh nghiệm về rối loạn vận động; lời giải thích: đây có thể là loạn trương lực cơ khu trú, một rối loạn thần kinh hiếm gặp cần chuyên gia đánh giá.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n56
  cau: Bragge, Bialocerkowski, McMeeken, "A systematic review of prevalence and risk factors associated with playing-related musculoskeletal disorders in pianists", Occupational Medicine 56(1), 2006, tr. 28–38.
  loai: ten
