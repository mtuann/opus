  id: n11
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/strengthening-endings-with-v7/", "https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/"]
