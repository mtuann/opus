  id: n26
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/cadential-64/"]
  ghi_chu: "OMT: 6/4 kết là dạng tô điểm của V, 6 xuống 5 và 4 xuống 3; khớp."
