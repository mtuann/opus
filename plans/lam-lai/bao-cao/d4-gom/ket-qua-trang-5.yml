  nguon:
    - "https://ncem.co.uk/slurs/"
    - "https://www.dolmetsch.com/musictheory21.htm"
  ghi_chu: "Không mở được văn bản của Türk (1789) về dấu luyến. Leopold Mozart (Violinschule 1756, qua NCEM): nốt đầu mạnh và giữ lâu hơn, các nốt sau nhẹ dần; Dolmetsch dẫn Türk: nhấc ngón sớm hơn giá trị nốt. Hướng khớp nhưng chưa xác nhận chi tiết 'nốt cuối nhẹ, ngắn' và 'khoảng ngắt nhỏ' cho đàn phím Cổ điển."
