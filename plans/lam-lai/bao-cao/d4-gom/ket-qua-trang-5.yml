- trang: piano/not-hoa-my
  id: n1
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/ornaments"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "COM: ornaments là embellishment của giai điệu bằng nốt nhỏ hoặc ký hiệu đặc biệt."
- trang: piano/not-hoa-my
  id: n2
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
  ghi_chu: "Dolmetsch: ornamentation thay đổi theo thời kỳ và từng nước; COM: cách hiểu appoggiatura khác nhau giữa các thời kỳ. Phần 'tùy nhà soạn nhạc' khớp với ví dụ Couperin ghi rõ, Bach/d'Anglebert mỗi người một bảng."
- trang: piano/not-hoa-my
  id: n3
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
    - "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/"
  ghi_chu: "COM: appoggiatura hoạt động như nốt chậm giải (suspension); Fitch: láy rền Bach bắt đầu từ nốt trên, đúng phách, là chuỗi appoggiatura."
- trang: piano/not-hoa-my
  id: n4
  luot_2: dung
  nguon:
    - "https://www.britannica.com/art/ornamentation-music"
  ghi_chu: "Britannica: nhạc harpsichord Pháp dùng nốt hoa mỹ để nhấn và phát âm. Phần 'harpsichord gần như không đổi được độ to' là kiến thức nền, chưa có trang đã mở nói thẳng; không thấy mâu thuẫn."
- trang: piano/not-hoa-my
  id: n5
  luot_2: khong-chac
  nguon: []
  ghi_chu: Không có trang nguồn đã mở xác nhận chức năng 'giữ nốt dài còn sống' của láy rền trên harpsichord/piano thời đầu. Versuch (I.2.3 §1) chỉ nói láy rền 'làm sống động giai điệu'. Không thấy mâu thuẫn.
- trang: piano/not-hoa-my
  id: n6
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/trill"
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p9.html"
  ghi_chu: "COM: láy rền thường gắn với kết (cadence); C. P. E. Bach nói tới láy rền kết (cadential trills) trước nốt cuối."
- trang: piano/not-hoa-my
  id: n7
  luot_2: dung
  nguon:
    - "https://artsandculture.google.com/story/1gVhSXNkNEwf-g"
    - "https://www.musicollege.ntnu.edu.tw/wp-content/uploads/2022/12/37.01-安派‧布拉納普拉普魯克／蕭邦的歌唱旋律：花腔及其他【英文】.pdf"
  ghi_chu: Nocturne của Chopin có trang trí 'rich and refined ornamentation' mang tính hát; ông muốn bắt chước hát opera trên piano; nghiên cứu NTNU nối lối trang trí với coloratura/bel canto.
- trang: piano/not-hoa-my
  id: n8
  luot_2: dung
  nguon:
    - "https://www.britannica.com/art/ornamentation-music"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Britannica: thế kỷ 18 người chơi tự thêm vào những đường giai điệu thưa; Dolmetsch: ngoài ký hiệu còn thêm passaggi, roulades ngay tại chỗ."
- trang: piano/not-hoa-my
  id: n9
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Dolmetsch: ornamentation khác nhau từng thời kỳ và từng nước; Couperin đòi chơi đúng như ghi, d'Anglebert dùng hệ thống riêng."
- trang: piano/not-hoa-my
  id: n10
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Dolmetsch: từ Chambonnières 1670, nhà soạn nhạc Pháp thường in bảng nốt hoa mỹ trong ấn bản; bảng d'Anglebert (1689) đầy đủ nhất."
- trang: piano/not-hoa-my
  id: n11
  luot_2: dung
  nguon:
    - "https://www.britannica.com/art/ornamentation-music"
  ghi_chu: "Britannica: thế kỷ 19 nhiều nốt hoa mỹ được cố định trong bản ghi; Haydn, Mozart đã viết thẳng vào bản nhạc."
- trang: piano/not-hoa-my
  id: n12
  luot_2: dung
  nguon:
    - "https://www.henle.de/What-is-Urtext/"
  ghi_chu: "Henle: Urtext chỉ phản ánh ý định tác giả; can thiệp của biên tập 'được đánh dấu là của biên tập ngay trong bản nhạc' hoặc giải thích ở lời tựa, chú giải. Chi tiết 'ngoặc/in nhỏ' là quy ước thường gặp, Henle không nêu cụ thể trên trang."
- trang: piano/not-hoa-my
  id: n13
  luot_2: dung
  nguon:
    - "https://www.henle.de/What-is-Urtext/"
  ghi_chu: Henle phân biệt phần của tác giả với gợi ý biên tập (ngón, đánh dấu). Hợp với cách hiểu 'ấn bản có hướng dẫn thêm cách hiểu của biên tập'.
- trang: piano/not-hoa-my
  id: n15
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Phần chặng là về site (ve-site, không kiểm được). Phần Grade: không đối chiếu được từng mốc với đề cương ABRSM ở lượt này (không mở PDF đề cương, không mở trang Henle của K. 545 và Nocturne Op. 9/2)."
- trang: piano/not-hoa-my
  id: n16
  luot_2: dung
  nguon:
    - "https://find.library.upenn.edu/catalog/99626953503681"
    - "https://www.britannica.com/print/article/47890"
    - "https://imslp.org/api.php?action=parse&page=Klavierb%C3%BCchlein_f%C3%BCr_Wilhelm_Friedemann_Bach_(Bach,_Johann_Sebastian)&prop=wikitext&format=json"
  ghi_chu: "Bản chụp ghi: 'angefangen in Cöthen den 22. Januar Aō. 1720'. Wilhelm Friedemann (sinh 22/11/1710) là con trai cả. IMSLP: Klavierbüchlein, bắt đầu 1720."
- trang: piano/not-hoa-my
  id: n17
  luot_2: dung
  nguon:
    - "https://www.britannica.com/print/article/47890"
    - "https://find.library.upenn.edu/catalog/99626953503681"
  ghi_chu: Sinh 22/11/1710, nên ngày 22/1/1720 mới 9 tuổi 2 tháng. Britannica và Rasmussen viết 'mười tuổi' (nói tròn); tính theo ngày sinh thì chín tuổi là đúng.
- trang: piano/not-hoa-my
  id: n18
  luot_2: dung
  nguon:
    - "https://find.library.upenn.edu/catalog/99626953503681"
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/preface"
  ghi_chu: "Bản ghi chép trang đề: 'Clavier-Büchlein vor Wilhelm Friedemann Bach' (Rasmussen viết đúng dạng này)."
- trang: piano/not-hoa-my
  id: n19
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
    - "https://imslp.org/api.php?action=parse&page=Klavierb%C3%BCchlein_f%C3%BCr_Wilhelm_Friedemann_Bach_(Bach,_Johann_Sebastian)&prop=wikitext&format=json"
  ghi_chu: "IMSLP: sau 'Claves signatae' (giải thích khóa) là 'Explication unterschiedlicher Zeichen'; Rasmussen chép bảng gồm đúng 13 mục."
- trang: piano/not-hoa-my
  id: n20
  luot_2: dung
  nguon:
    - "https://imslp.org/api.php?action=parse&page=Klavierb%C3%BCchlein_f%C3%BCr_Wilhelm_Friedemann_Bach_(Bach,_Johann_Sebastian)&prop=wikitext&format=json"
    - "https://classical-music.com/miscellaneous/bach-523"
  ghi_chu: IMSLP liệt kê Präambulum 1–15 (BWV 772–786, tức Invention 1–15) trong cuốn sổ, mục Präambulum 1 à 2 là BWV 772 (Invention số 1).
- trang: piano/not-hoa-my
  id: n21
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 1 trong bảng: Trillo (w), thực hiện Rê–Đô–Rê–Đô, kết bằng nốt Đô; bắt đầu từ nốt trên."
- trang: piano/not-hoa-my
  id: n22
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 2: Mordant, Đô–Si–Đô (chính–dưới–chính)."
- trang: piano/not-hoa-my
  id: n23
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 3: Trillo u. Mordant, láy rền kèm mordent ở cuối (Si–Đô)."
- trang: piano/not-hoa-my
  id: n24
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 4: Cadence, Rê–Đô–Si–Đô, tức láy quanh (turn)."
- trang: piano/not-hoa-my
  id: n25
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 5–6: Doppelt-Cadence (từ dưới Si hoặc từ trên Rê) nối vào láy rền."
- trang: piano/not-hoa-my
  id: n26
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 7–8: Doppelt-Cadence u. Mordant, hai kiểu, thêm mordent ở cuối."
- trang: piano/not-hoa-my
  id: n27
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 9–10: Accent steigend (Si rồi Đô), Accent fallend (Rê rồi Đô), là appoggiatura từ dưới và từ trên."
- trang: piano/not-hoa-my
  id: n28
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Mục 11–13: Accent u. Mordant, Accent u. Trillo (hai kiểu): nốt dựa nối vào mordent hoặc láy rền."
- trang: piano/not-hoa-my
  id: n29
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "Khớp ba điều: láy rền từ nốt trên (Rê–Đô); ký hiệu không gạch (Trillo, ngắn) khác ký hiệu có gạch (Mordant Đô–Si–Đô); Cadence bắt đầu từ nốt trên Rê. Rasmussen cũng nhấn mạnh bảng chỉ là khái quát."
- trang: piano/not-hoa-my
  id: n30
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/preface"
  ghi_chu: "Rasmussen: bảng Explication chỉ là bản trích ngắn từ bảng d'Anglebert 1689, 'a generalized table, not an absolute prescription'."
- trang: piano/not-hoa-my
  id: n31
  luot_2: dung
  nguon:
    - "https://press.princeton.edu/isbn/9780691027074"
  ghi_chu: "Mô tả sách của Princeton UP: Neumann 'questions the validity of the rigid principles' về cách chơi nốt hoa mỹ và cho rằng ràng buộc cứng nhắc không hợp với tự do của nhạc công thời ấy."
- trang: piano/not-hoa-my
  id: n32
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/trill"
  ghi_chu: "COM: láy rền là sự luân phiên nhanh giữa nốt chính và nốt liền trên."
- trang: piano/not-hoa-my
  id: n33
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/trill"
  ghi_chu: "COM: ký hiệu 'tr', thường kèm đường lượn sóng cho biết độ dài."
- trang: piano/not-hoa-my
  id: n34
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Dolmetsch: dấu hóa đặt trên ký hiệu láy rền chỉ biến âm của nốt phụ (nốt trên)."
- trang: piano/not-hoa-my
  id: n35
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "C. P. E. Bach, Versuch I.2.3 §5: 'It always starts from the second above the main tone.' Dolmetsch: bắt đầu từ nốt trên là thực hành chủ đạo giữa thế kỷ 18."
- trang: piano/not-hoa-my
  id: n36
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/"
  ghi_chu: "Dolmetsch: Pralltriller chỉ xuất hiện sau quãng hai đi xuống, nốt đầu nối với nốt trước; Fitch: láy rền nối (tremblement lié): nốt đầu trùng nốt trước thì nối chứ không đánh lại."
- trang: piano/not-hoa-my
  id: n37
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/"
  ghi_chu: "Dolmetsch: Hummel (1828) mới đề nghị bắt đầu từ nốt chính, nghĩa là trước đó nốt trên vẫn là chuẩn; Dùng chữ 'phần lớn' là thận trọng."
- trang: piano/not-hoa-my
  id: n38
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html"
  ghi_chu: "Versuch §5: không cần viết nốt nhỏ đứng trước láy rền trừ khi nó là appoggiatura giữ lại; tức nốt nhỏ ấy chỉ nốt bắt đầu. Hợp với cách đọc cổ điển."
- trang: piano/not-hoa-my
  id: n39
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/"
  ghi_chu: "Dolmetsch: Hummel (1828), Spohr đề nghị bắt đầu từ nốt chính, Weber/Chopin/Mendelssohn vẫn nghiêng nốt trên; đầu thế kỷ 19 là vùng chuyển tiếp, cần xét từng chỗ."
- trang: piano/not-hoa-my
  id: n40
  luot_2: khong-chac
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf"
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/sonatas_commentaries.pdf"
  ghi_chu: "Nguồn mâu thuẫn: Dolmetsch (theo Clive Brown) nói Weber, Chopin, Mendelssohn nhìn chung vẫn thiên về nốt trên; còn chú giải Wydanie Narodowe (Nocturne, Sonata) nói láy rền của Chopin thường bắt đầu bằng nốt chính. Chưa nguồn nào đủ để khẳng định riêng Schumann và Liszt."
- trang: piano/not-hoa-my
  id: n41
  luot_2: dung
  nguon:
    - "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Fitch: Hummel (Anweisung, 1828) chỉ dẫn bắt đầu láy rền từ nốt chính; Dolmetsch: Hummel (1828) cho rằng nốt chính nên là chuẩn."
- trang: piano/not-hoa-my
  id: n42
  luot_2: dung
  nguon:
    - "https://imslp.org/wiki/Ausf%C3%BChrliche_theoretisch-practische_Anweisung_zum_Piano-Forte-Spiel_(Hummel,_Johann_Nepomuk)"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "IMSLP: Vienna, Haslinger, 1827 (một số bản quét ghi 1828); Dolmetsch ghi 1828. Cách viết '1827–1828' là phù hợp."
- trang: piano/not-hoa-my
  id: n43
  luot_2: dung
  nguon:
    - "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/"
  ghi_chu: "Fitch: láy rền kiểu Bach 'begins on the upper note and on the beat', 'a chain of two or more appoggiaturas'; nốt trên đúng phách là nốt nghịch tựa vào nốt chính."
- trang: piano/not-hoa-my
  id: n44
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p13.html"
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p14.html"
  ghi_chu: "Versuch I.2.3 §§13–14: láy rền có 'termination' (nốt kết), liền dưới rồi nốt chính, nối vào nốt kế (Nachschlag)."
- trang: piano/not-hoa-my
  id: n45
  luot_2: dung
  nguon:
    - "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly"
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p13.html"
  ghi_chu: "Mutopia (IMSLP) K. 545 I ô 4: nốt Fa có \\trill rồi Mi–Fa–Mi viết đủ bằng nốt thường (nốt kết là Mi–Fa). C. P. E. Bach nói nốt kết có thể có hoặc không nên ghi."
- trang: piano/not-hoa-my
  id: n46
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p13.html"
  ghi_chu: "Versuch I.2.3 §13: trên nốt khá dài luôn có termination; có termination nếu sau trill là một quãng nhảy; nốt ngắn hợp với quãng hai đi lên hơn đi xuống; trill ở cuối bài, trên dấu ngân... 'always has a termination'."
- trang: piano/not-hoa-my
  id: n47
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p16.html"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "C. P. E. Bach §16 (nốt ngắn, nhanh, không termination); Dolmetsch: Pralltriller có bốn nốt. Số nốt không cố định là cách nói chung của các nguồn."
- trang: piano/not-hoa-my
  id: n48
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p8.html"
  ghi_chu: "Phép tính đúng: ♩=60 và tám nốt/đen = 8 nốt mỗi giây (móc ba = 1/32). Là lời khuyên tập, hợp với Versuch §8: tập chậm, đều rồi mới nhanh dần."
- trang: piano/not-hoa-my
  id: n52
  luot_2: dung
  nguon:
    - "https://www.speech.kth.se/music/5_lectures/askenflt/timing.html"
  ghi_chu: "Askenfelt: đàn grand có cơ cấu lặp đôi (double escapement), chỉ cần nhả phím khoảng một phần ba hành trình là đánh lại được; đàn upright không có."
- trang: piano/not-hoa-my
  id: n54
  luot_2: khong-chac
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p5.html"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/trill"
  ghi_chu: "Mô tả khuông ví dụ 1 trên site, không mở trang để đối chiếu nốt. Về nhạc lý: nốt trên đúng phách rồi giải quyết về nốt chính/nốt kế là hợp quy tắc, nhưng câu không nói rõ nốt chính của láy rền (Rê?) nên không xác nhận được chi tiết."
- trang: piano/not-hoa-my
  id: n55
  luot_2: khong-chac
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-3/I-2-3-p13.html"
    - "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly"
  ghi_chu: "Mô tả khuông ví dụ 2 trên site, không mở trang để đối chiếu. Về nhạc lý: nốt kết Sol–La viết thường dẫn lên Si là kiểu termination hợp lệ (như K. 545 ô 4); cách đọc 'từ nốt trên như Cổ điển, từ nốt chính như thế kỷ 19' khớp Dolmetsch."
- trang: piano/not-hoa-my
  id: n57
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent"
  ghi_chu: "Dolmetsch: mordent dưới là ký hiệu răng cưa có gạch dọc; mordent trên (Schneller) là ký hiệu răng cưa không gạch. COM: có hai loại, trên và dưới."
- trang: piano/not-hoa-my
  id: n58
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent"
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "COM: tiếng Đức chỉ dùng Mordent cho mordent dưới; trong tiếng Anh 'mordent' và 'inverted mordent' dùng không nhất quán. Dolmetsch: 'inverted mordent' mơ hồ vì từng chỉ cả hai kiểu. Bảng Bach: Mordant có gạch (chính–dưới–chính)."
- trang: piano/not-hoa-my
  id: n59
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "COM và Dolmetsch: 'inverted mordent' dùng không nhất quán, mỗi tác giả gán cho một ký hiệu."
- trang: piano/not-hoa-my
  id: n60
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-8/I-2-8-p1.html"
  ghi_chu: "Dolmetsch: Pralltriller (half trill), từ giữa thế kỷ 18 Schneller (mordent trên) dần thay thế; C. P. E. Bach, Versuch I.2.8: 'Schneller' của ông có cùng nốt với 'short trill'. Tên gọi hơi khác giữa các tác giả; viết 'còn gọi' là chấp nhận được."
- trang: piano/not-hoa-my
  id: n61
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "COM: mordent trên gồm nốt chính, nốt liền trên, nốt chính; Dolmetsch: Schneller = nốt chính, nốt trên, nốt chính."
- trang: piano/not-hoa-my
  id: n62
  luot_2: dung
  nguon:
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Bảng Bach: Trillo (ký hiệu không gạch) bắt đầu từ nốt trên: Rê–Đô–Rê–Đô; Dolmetsch: Pralltriller chỉ gồm bốn nốt."
- trang: piano/not-hoa-my
  id: n63
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Mordent dưới: nốt chính, nốt dưới, nốt chính ở cả Baroque (Bach: Đô–Si–Đô) lẫn thời sau."
- trang: piano/not-hoa-my
  id: n64
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://practisingthepiano.com/the-trouble-with-ornaments-part-one/"
  ghi_chu: "Dolmetsch: Pralltriller (half trill) gồm bốn nốt, nốt đầu nối với nốt trước, chỉ sau quãng hai đi xuống; C. P. E. Bach: 'joins the preceding note to the decorated one, and therefore never appears over detached notes'. Fitch: láy rền nối."
- trang: piano/not-hoa-my
  id: n65
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Dolmetsch: Pralltriller chỉ xuất hiện sau quãng hai đi xuống; không có nốt trước để nối thì bắt đầu từ nốt trên."
- trang: piano/not-hoa-my
  id: n66
  luot_2: dung
  nguon:
    - "https://sca.uwaterloo.ca/Mutopia/cgibin/piece-info.cgi?id=40"
    - "https://www.mutopiaproject.org/ftp/BachJS/BWV772/bach-invention-01/bach-invention-01.ly"
  ghi_chu: "Mutopia (nguồn: Bach-Gesellschaft), ô 1 tay phải: g'8 c b^\\prall c, tức nốt Si móc đơn có ký hiệu không gạch, đi xuống từ Đô; ô 5 có \\mordent (có gạch), ô 6, 8 lại có \\prall."
- trang: piano/not-hoa-my
  id: n67
  luot_2: dung
  nguon:
    - "https://sca.uwaterloo.ca/Mutopia/cgibin/piece-info.cgi?id=979"
    - "https://www.mutopiaproject.org/ftp/BachJS/BWV988/bwv-988-aria/bwv-988-aria.ly"
  ghi_chu: "Mutopia (nguồn: Bach-Gesellschaft): ô có nốt hoa mỹ là 25 trên 32 (ô 1–26 gần hết; trống ở ô 13, 15, 27–31). Cách nói 'gần như ô nào cũng có' hơi mạnh, 'phần lớn các ô' chính xác hơn."
- trang: piano/not-hoa-my
  id: n68
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"
  ghi_chu: "COM: dấu hóa trên ký hiệu mordent áp dụng cho nốt trên, dưới ký hiệu cho nốt dưới; turn: dấu hóa trên hay dưới chỉ biến âm nốt trên hay dưới."
- trang: piano/not-hoa-my
  id: n69
  luot_2: khong-chac
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/mordent"
  ghi_chu: "Mô tả khuông ví dụ 3 trên site, không mở trang để đối chiếu. Về nhạc lý: cách đọc thế kỷ 19 (chính–trên–chính) và Baroque (trên–chính–trên–chính, bốn nốt) khớp Dolmetsch/COM, nhưng 'Mi ngân thêm vào phách' và số nốt cụ thể phụ thuộc khuông."
- trang: piano/not-hoa-my
  id: n71
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"
  ghi_chu: "COM: turn (gruppetto) gồm bốn nốt: nốt trên, nốt chính, nốt dưới, nốt chính."
- trang: piano/not-hoa-my
  id: n72
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"
    - "https://esf.ccarh.org/MuseData-Ed-202003/baroque/bach/rasmuss/doc/explicat"
  ghi_chu: "COM: ký hiệu đặt trên nốt thì thay cho nốt (bắt đầu ngay); bảng Bach: Cadence Rê–Đô–Si–Đô."
- trang: piano/not-hoa-my
  id: n73
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"
  ghi_chu: "COM: ký hiệu đặt sau nốt thì figure theo sau nốt, người chơi tự chia thời gian, thường khá nhanh. Nhận xét 'rất hay gặp trong giai điệu Cổ điển và Lãng mạn' là quan sát chung."
- trang: piano/not-hoa-my
  id: n74
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "COM, Dolmetsch: láy quanh ngược bắt đầu từ nốt dưới (dưới–chính–trên–chính). Chi tiết 'ký hiệu có gạch dọc hoặc lộn ngược' chưa nguồn đã mở nào nói thẳng; Dolmetsch lưu ý ký hiệu láy quanh có gạch trong nhạc Haydn là một kiểu riêng khó hiểu."
- trang: piano/not-hoa-my
  id: n75
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"
  ghi_chu: "COM: dấu hóa đặt trên hay dưới ký hiệu turn chỉ biến âm nốt trên hay nốt dưới."
- trang: piano/not-hoa-my
  id: n77
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/gruppetto"
  ghi_chu: Về nhạc lý, g f e f là turn thường (trên–chính–dưới–chính) trên Fa; e f g f là turn ngược; đặt giữa Mi–Fa thì chơi sau nốt Mi. Khớp COM. Không mở trang để xem khuông.
- trang: piano/not-hoa-my
  id: n78
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
  ghi_chu: "COM: appoggiatura từ tiếng Ý, 'Leaning note' (nốt dựa)."
- trang: piano/not-hoa-my
  id: n79
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "COM và Dolmetsch (theo C. P. E. Bach): appoggiatura là nốt nhỏ, rơi đúng phách, thời gian lấy từ nốt chính. Dấu luyến chỉ là cách viết thường gặp."
- trang: piano/not-hoa-my
  id: n80
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "COM: về hòa âm giống nốt chậm giải; Dolmetsch/C. P. E. Bach: appoggiatura đúng phách, nốt chính theo sau. Mô tả 'tiếng thở dài' là hình ảnh."
- trang: piano/not-hoa-my
  id: n81
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p11.html"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "C. P. E. Bach §11: nửa độ dài nốt chính khi nốt chính chia đôi, hai phần ba khi nốt chính có số phách lẻ; COM: 'half... or two-thirds if dotted'; Dolmetsch: nốt chấm dôi thì lấy hai phần ba."
- trang: piano/not-hoa-my
  id: n82
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
  ghi_chu: "Dolmetsch: quy tắc có thể đổi theo nhịp điệu và hòa âm; Quantz mô tả nốt dựa ngắn, chạm nhẹ trước nốt nhanh. COM: cách hiểu appoggiatura khác nhau giữa các thời kỳ."
- trang: piano/not-hoa-my
  id: n83
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura"
  ghi_chu: "COM: acciaccatura ('crushed'), nốt nhỏ có gạch chéo, 'crushed in as quickly as possible', trọng âm và gần hết giá trị ở nốt chính."
- trang: piano/not-hoa-my
  id: n84
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura"
  ghi_chu: "COM: có nghệ sĩ đàn phím đánh cả hai nốt cùng lúc rồi nhả acciaccatura ngay. COM không nói rõ 'thế kỷ 18'."
- trang: piano/not-hoa-my
  id: n85
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura"
  ghi_chu: "Dolmetsch: acciaccatura chơi 'on the beat with, or just before' nốt chính; COM: thời gian lấy từ nốt sau, có khi từ nốt trước. Nguồn xác nhận chưa có quy tắc thống nhất."
- trang: piano/not-hoa-my
  id: n86
  luot_2: dung
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura"
  ghi_chu: "Nội dung bảng khớp COM: hình (không gạch/có gạch), thời điểm (đúng phách), độ dài (nửa hay hai phần ba so với 'ngắn hết mức'), trọng âm (nốt dựa nhấn, acciaccatura dồn vào nốt chính)."
- trang: piano/not-hoa-my
  id: n87
  luot_2: dung
  nguon:
    - "https://versuch.cpebach.org/v-html/part-I/chapter-2/section-2/I-2-2-p11.html"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/appoggiatura"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/acciaccatura"
  ghi_chu: "Về nhạc lý khớp quy tắc: trước nốt trắng lấy nửa (nốt đen); trước nốt trắng chấm dôi (ba phách) lấy hai phần ba (hai phách), nốt chính còn một phách; Fa♯ là nửa cung dưới Sol cho acciaccatura. Không mở trang để xem khuông."
- trang: piano/not-hoa-my
  id: n88
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musicalsymbols.htm"
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Dolmetsch: arpeggio là hợp âm rải, ký hiệu đường lượn sóng dọc, thường từ dưới lên, mũi tên chỉ xuống nếu rải từ trên xuống. 'Giữ các nốt lại' là cách chơi chuẩn, không trang đã mở nói thẳng."
- trang: piano/not-hoa-my
  id: n89
  luot_2: khong-chac
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf"
  ghi_chu: "Dolmetsch: một ký hiệu qua cả hai khuông thì hai tay chơi nối tiếp (khớp); nhưng hai ký hiệu riêng thì chỉ chơi cùng lúc khi thiếu nốt giữa hai tay, còn không thì nối tiếp. Chú giải Wydanie Narodowe: các đường riêng cho hai tay 'need not denote simultaneous arpeggiation'. Quy tắc 'hai đường riêng thì rải cùng lúc' không phải luôn đúng."
- trang: piano/not-hoa-my
  id: n90
  luot_2: khong-chac
  nguon: []
  ghi_chu: Không có nguồn bậc 2 đã mở nói thẳng nốt thấp nhất của hợp âm rải Baroque/Cổ điển rơi đúng phách (Dolmetsch không nêu thời điểm). Không thấy mâu thuẫn; đúng với thông lệ giảng dạy.
- trang: piano/not-hoa-my
  id: n91
  luot_2: dung
  nguon:
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf"
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/ballades_commentaries.pdf"
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/sonatas_commentaries.pdf"
  ghi_chu: "Chú giải Wydanie Narodowe nhiều chỗ: hợp âm rải tay phải bắt đầu cùng lúc với nốt tương ứng của tay trái (Ballade Op. 23 ô 32, Sonata Op. 35 ô 41...)."
- trang: piano/not-hoa-my
  id: n94
  luot_2: dung
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf"
  ghi_chu: "Về nhạc lý khớp quy tắc: nốt thấp nhất vào đúng phách, các nốt được giữ. Chi tiết 'cách nhau một móc kép' phụ thuộc khuông. Không mở trang để xem."
- trang: piano/not-hoa-my
  id: n95
  luot_2: dung
  nguon:
    - "https://www.oxfordlearnersdictionaries.com/definition/english/fioritura"
    - "https://artsandculture.google.com/story/1gVhSXNkNEwf-g"
    - "https://www.musicollege.ntnu.edu.tw/wp-content/uploads/2022/12/37.01-安派‧布拉納普拉普魯克／蕭邦的歌唱旋律：花腔及其他【英文】.pdf"
  ghi_chu: "Oxford: fioritura từ tiếng Ý 'flowering', nốt thêm vào giai điệu của ca sĩ opera; Chopin bắt chước trang trí kiểu bel canto (Google Arts & Culture, NTNU). Chi tiết 7, 11, 22 nốt là cách viết nhóm bất quy tắc của Chopin, không trang đã mở nêu số liệu."
- trang: piano/not-hoa-my
  id: n96
  luot_2: dung
  nguon:
    - "https://www.chopin-nationaledition.com/wp-content/uploads/2017/05/nocturnes_commentaries.pdf"
