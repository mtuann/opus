    - "https://www.speech.kth.se/music/5_lectures/askenflt/timing.html"
  ghi_chu: "Askenfelt: 'the mechanical contact between the key and the hammer is broken before the hammer strikes the string'; cơ cấu thoát (escapement) làm búa bay tự do."
- trang: piano/tieng-dan
  id: n4
  luot_2: dung
  nguon:
    - "https://www.speech.kth.se/music/5_lectures/askenflt/pianist.html"
  ghi_chu: "Askenfelt: người chơi chỉ ảnh hưởng đến vận tốc cuối của búa và qua đó độ to; búa đã rời phím trước khi chạm dây nên ấn thêm không làm nốt to hơn. Lưu ý: tiếng 'thump' của phím chạm đáy vẫn có, nhưng không làm nốt to hơn."
- trang: piano/tieng-dan
  id: n5
  luot_2: dung
  nguon:
