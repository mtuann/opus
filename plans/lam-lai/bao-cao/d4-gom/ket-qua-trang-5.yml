  ghi_chu: "Askenfelt: người chơi chỉ điều khiển gián tiếp qua tốc độ búa; độ to tương đối và thời điểm giữa các nốt quyết định cân bằng. Thời điểm nhả phím và bàn đạp là kiến thức nền (Oxford legato nói về giữ phím)."
