- trang: nghe-nhac/mozart-concerto-21
  id: n13
  luot_2: khong-chac
  nguon: ["https://enc.piano.or.jp/en/musics/275", "https://imslp.org/wiki/Piano_Concerto_No.21,_K.467_(Mozart,_Wolfgang_Amadeus)"]
  ghi_chu: "Vế PTNA đúng: trang PTNA (Music ID 275) viết ở chương 1 'a motif in the piano part that later appears in Symphony No. 40 in G minor'. Chương 1 Allegro maestoso, Đô trưởng (IMSLP). Hai vế còn lại (dàn nhạc trình bày trước; piano vào với phần trình bày riêng và một chủ đề mới ở Sol thứ) không thấy ở PTNA, IMSLP chỉ có incipit; tổng phổ NMA (dme.mozarteum.at) không mở được từ trang mục lục, không đọc được ô nhịp. Chỉ có nguồn phụ (Wikipedia, chỉ để tìm nguồn) mô tả piano vào bằng Eingang, rồi đoạn Sol thứ gọi là 'đoạn' chứ không phải 'chủ đề mới'. Cần đối chiếu tổng phổ."
