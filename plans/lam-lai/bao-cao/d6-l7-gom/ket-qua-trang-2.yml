  nguon: ["https://www.gutenberg.org/ebooks/4973"]
  ghi_chu: "Niecks tập 2: Chopin nói với Gutmann 'he had never in his life written another such beautiful melody'; khi Gutmann tập bản này, ông 'lifted up his arms with his hands clasped and exclaimed: \"O, my fatherland!\"'."
- trang: nghe-nhac/chopin-etude
  id: n20
  luot_2: dung
  nguon: ["https://raw.githubusercontent.com/pl-wnifc/humdrum-chopin-first-editions/main/kern/010-1b-Sm-003.krn", "https://archive.org/details/chopinetudesforp00unse"]
  ghi_chu: "Bản in đầu (Humdrum NIFC): khuông trên có giai điệu ở bè trên và bè trong (móc kép ở ô 2–3: g#–e–B–e, d#–a–B–d#) cùng tay phải; bản Schirmer/Friedheim ghi ngón 4–5 cho giai điệu, 1–2 cho nốt bè dưới (ô 3). Lưu ý: dòng móc kép G#–B ở ô 1–2 nằm ở khuông dưới (tay trái)."
- trang: nghe-nhac/chopin-etude
  id: n21
  luot_2: dung
  nguon: ["https://www.henle.de/media/10/02/f2/1697725665/0124-1697725664-sync.pdf", "https://raw.githubusercontent.com/pl-wnifc/humdrum-chopin-first-editions/main/kern/010-1b-Sm-003.krn", "https://archive.org/details/chopinetudesforp00unse"]
  ghi_chu: "Bản in đầu: 'Poco piu animato.' ở ô 21 (ghi chú Henle: '21: poco piu animato lacking in A1 and A2'). Từ ô 21 tay phải chơi nốt kép."
- trang: nghe-nhac/chopin-etude
  id: n22
  luot_2: dung
  nguon: ["https://raw.githubusercontent.com/pl-wnifc/humdrum-chopin-first-editions/main/kern/010-1b-Sm-003.krn", "https://archive.org/details/chopinetudesforp00unse"]
  ghi_chu: "Đếm trên bản in đầu (Humdrum NIFC) và bản Schirmer: ô 38–41 hai tay chơi quãng năm giảm/bốn tăng chạy nửa cung, gộp lại thành chuỗi hợp âm bảy giảm (ô 38 D–F–G#–B, ô 39 C#–E–G–A#, ô 40 C–D#–F#–A …; Friedheim: 'four measures of chromatic passages in diminished fifths and augmented fourths'); ô 33–37 cũng có hợp âm bảy giảm. 'Con bravura' ở ô 46, hai tay chơi quãng sáu (ví dụ B–D, F–G#), kéo tới ô 53."
- trang: nghe-nhac/chopin-etude
  id: n23
  luot_2: dung
  nguon: ["https://raw.githubusercontent.com/pl-wnifc/humdrum-chopin-first-editions/main/kern/010-1b-Sm-003.krn"]
