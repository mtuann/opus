  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly"]
  ghi_chu: "Đọc bè trầm và hợp âm trong bản LilyPond của Mutopia (35 ô nhịp). Ô 1–4 ở Đô trưởng; ô 10 là D–F♯–A–C (V7 của Sol), ô 11 là hợp âm Sol trưởng: đã sang Sol trưởng. Ô 19 về lại hợp âm Đô (bè trầm C, C–G–C–E), ô 20 thêm Si giáng (C7) dẫn sang Fa: đã trở về giọng chính. Bè trầm giữ Sol (G,) từ ô 24 đến ô 31 (8 ô, nốt pedal át). Ô 32–35 bè trầm giữ Đô (C,), kết ở hợp âm Đô có dấu ngân."
