  ghi_chu: "Niecks chép giai thoại như chuyện thật ('It is said that this event inspired him...'; 'composed at Stuttgart'). Không tìm được nguồn bậc 2 mở được để xác nhận vế 'không có tài liệu nào chứng minh' và năm 1832–1833 của bản chép sạch (CFEO chỉ ghi autograph số 11, 12 ở Stockholm, không ghi năm; trang NIFC không đọc được)."
