  ghi_chu: "Bản in đầu số 12: ô 1 hợp âm mạnh (D–F–G–A♭–B, hợp âm nghịch trên Sol), tay trái chạy móc kép đi xuống; chủ đề tay phải bằng quãng tám và hợp âm từ ô 10, tay trái móc kép liên tục."
