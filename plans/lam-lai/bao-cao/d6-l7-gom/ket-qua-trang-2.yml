  nguon: ["https://imslp.org/wiki/Symphony_No.38_in_D_major,_K.504_(Mozart,_Wolfgang_Amadeus)", "https://imslp.org/wiki/Symphony_No.39_in_E-flat_major,_K.543_(Mozart,_Wolfgang_Amadeus)", "https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Symphony_No.7,_Op.92_(Beethoven,_Ludwig_van)", "https://imslp.org/wiki/Symphony_No.1,_Op.68_(Brahms,_Johannes)", "https://imslp.org/wiki/Pavane,_Op.50_(Faur%C3%A9,_Gabriel)", "https://imslp.org/wiki/La_boh%C3%A8me_(Puccini,_Giacomo)", "https://imslp.org/wiki/Swan_Lake_(ballet),_Op.20_(Tchaikovsky,_Pyotr)", "https://imslp.org/wiki/The_Sleeping_Beauty_(ballet),_Op.66_(Tchaikovsky,_Pyotr)", "https://imslp.org/wiki/The_Nutcracker_(ballet),_Op.71_(Tchaikovsky,_Pyotr)"]
  cau_dung: "Theo thời lượng: 5 phút cho một nocturne, một prelude hoặc một aria; 15 phút cho một chương giao hưởng hay concerto; 25–45 phút cho trọn một giao hưởng của Mozart, Beethoven, Brahms; 1–3 tiếng cho một vở opera hay ballet trọn vẹn."
  ghi_chu: "Sai nhẹ ở một vế. 'Average Duration' trên IMSLP: Mozart Giao hưởng số 38 là 25 phút, số 39 là 28 phút, tức dưới 30 phút; Beethoven số 5 là 30, số 7 là 38; Brahms số 1 là 45. Các vế khác hợp: Fauré Pavane 5–7 phút; La bohème 2 tiếng; ballet Swan Lake 140, Sleeping Beauty 160, Nutcracker 85 phút. Vế '15 phút cho một chương' là ước lượng ở mức cao (chương đầu Brahms 1 khoảng chừng ấy; phần lớn các chương ngắn hơn), chấp nhận được như quỹ thời gian."
