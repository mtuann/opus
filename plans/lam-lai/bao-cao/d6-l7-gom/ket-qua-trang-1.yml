  nguon: ["https://imslp.org/wiki/List_of_works_by_Domenico_Scarlatti", "https://www.hyperion-records.co.uk/dc.asp?dc=D_CDA67613"]
  ghi_chu: "Đúng phần chắc: K là danh mục của Ralph Kirkpatrick (Domenico Scarlatti, Princeton 1953; IMSLP); Hyperion gọi ông là harpsichordist/nhà nghiên cứu. Vế \"cố gắng xếp theo thứ tự thời gian, dựa vào thứ tự trong các tập chép tay ở Venice\" không tìm được nguồn đọc được (sách Kirkpatrick trên Internet Archive bị hạn chế; Princeton UP chặn); DG chỉ nói \"we know little of their chronology\"."
