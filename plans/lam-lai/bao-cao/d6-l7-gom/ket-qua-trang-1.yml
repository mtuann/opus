  ghi_chu: "Nốt lặp lại dồn dập trên một phím, tay vắt: đúng (bản chép Worgan, Hyperion so với mandolin; câu viết \"như guitar\", Hyperion nói mandolin). Vế \"nửa sau kết ở Rê thứ\" không đọc được: Commons chỉ có trang đầu; thử phân tích hợp âm cuối bản thu \"Scarlatti K 141.ogg\" không kết luận được."
