- trang: nghe-nhac/bach-goldberg
  id: n1
  luot_2: dung
  nguon: ["https://www.henle.de/Goldberg-Variations-BWV-988/HN-1159"]
  ghi_chu: "Trang Henle HN 1159, mục về nhà soạn nhạc: sinh ở Eisenach 21/3/1685, mất ở Leipzig 28/7/1750."
- trang: nghe-nhac/bach-goldberg
  id: n2
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png"]
  ghi_chu: "IMSLP: BWV 988, tên khác \"Aria mit verschiedenen Veränderungen\"; trang bìa ghi \"ARIA mit verschiedenen Verænderungen\"."
- trang: nghe-nhac/bach-goldberg
  id: n3
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf"]
  ghi_chu: "IMSLP: in lần đầu 1741 (là Clavier-Übung IV); trang bìa: \"Nürnberg in Verlegung Balthasar Schmids\". Lưu ý: lời tựa NBA (Wolff) nói không có tài liệu ghi ngày in, theo các ấn phẩm khác của Schmid thì phải trong 1741/42; trang bìa không ghi \"phần IV\" nhưng NBA và Henle gọi là Klavierübung Teil IV."
- trang: nghe-nhac/bach-goldberg
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)"]
  ghi_chu: "IMSLP: Composer Time Period: Baroque."
- trang: nghe-nhac/bach-goldberg
  id: n5
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png", "https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Trang bìa: Aria mit verschiedenen Verænderungen vors Clavicimbal mit 2 Manualen."
- trang: nghe-nhac/bach-goldberg
  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://musicbrainz.org/release/5c9cc5e5-bc5e-4c0b-a0ec-eaff41711a2d"]
  ghi_chu: "IMSLP: bản Kimiko Ishizaka (Open Goldberg) 6 file 5:00+10:17+12:26+17:46+14:03+22:39 ≈ 82 phút. MusicBrainz (A State of Wonder, Sony Classical): đĩa 1955 tổng 38:24, đĩa 1981 tổng 51:21."
- trang: nghe-nhac/bach-goldberg
  id: n7
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png"]
  ghi_chu: "Ảnh trang bìa bản in đầu: \"Clavier Ubung bestehend in einer ARIA mit verschiedenen Verænderungen vors Clavicimbal mit 2 Manualen. Denen Liebhabern zur Gemüths-Ergetzung verfertiget von Johann Sebastian Bach…\"; năm 1741 lấy từ IMSLP/NBA (trang bìa không ghi năm)."
- trang: nghe-nhac/bach-goldberg
  id: n8
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf", "https://www.bachvereniging.nl/en/bwv/bwv-988"]
  ghi_chu: "NBA (Wolff): \"the significant conclusion of Bach's four-part Clavierübung\"; NBS: \"published as the fourth part of Bach's encyclopaedic Clavier-Übung\". Các phần đều là nhạc cho đàn phím in khi Bach còn sống."
- trang: nghe-nhac/bach-goldberg
  id: n9
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/35041", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf"]
  ghi_chu: "Forkel 1802 (bản dịch Terry): Count Kaiserling, \"formerly Russian Ambassador at the Saxon Electoral Court\", mất ngủ, nhờ Bach viết nhạc cho Goldberg chơi trong những đêm mất ngủ. NBA xác nhận nguồn là tiểu sử Forkel 1802."
- trang: nghe-nhac/bach-goldberg
  id: n10
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf", "https://www.bachvereniging.nl/en/bwv/bwv-988"]
  ghi_chu: "NBA: thiếu lời đề tặng chính thức và tuổi trẻ của Goldberg (sinh 1727) \"clearly speak against such a commission\"; NBS: \"there is much less certainty about Goldberg's involvement\"."
- trang: nghe-nhac/bach-goldberg
  id: n11
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Goldberg-titlepage.png", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf"]
  ghi_chu: "Trang bìa không có lời đề tặng; NBA: \"the lack of a formal dedication to Keyserlingk in the original print\"."
- trang: nghe-nhac/bach-goldberg
  id: n12
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/35041", "https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Forkel in 1802; bản in 1741 (1741/42 theo NBA): cách nhau 60–61 năm."
- trang: nghe-nhac/bach-goldberg
  id: n13
  luot_2: dung
  nguon: ["https://www.deutsche-biographie.de/sfz21564.html", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf"]
  ghi_chu: "NDB: Goldberg rửa tội 1727 ở Danzig; NBA: \"Johann Gottlieb Goldberg (born in 1727)\". Năm 1741 khoảng 14 tuổi. (Ghi chú của Terry năm 1920 trong bản Forkel ghi \"circ. 1720\", đã cũ.)"
- trang: nghe-nhac/bach-goldberg
  id: n14
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV988/bwv-988-aria/bwv-988-aria.ly", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf"]
  ghi_chu: "Mutopia (theo Bach-Gesellschaft): Aria 3/4, hai đoạn \\repeat volta, mỗi đoạn 16 ô (đếm bè trầm), tổng 32 ô; NBA: \"the 32-measure subject\". \"Chậm\": bản nhạc không ghi tốc độ, cách chơi phổ biến."
- trang: nghe-nhac/bach-goldberg
  id: n15
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf"]
  ghi_chu: "IMSLP liệt kê Aria, Variatio 1–30, Aria da Capo; bản nhạc Open Goldberg kết bằng \"Aria da Capo e Fine\"."
- trang: nghe-nhac/bach-goldberg
  id: n16
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf", "https://www.bachvereniging.nl/en/bwv/bwv-988", "https://www.gutenberg.org/ebooks/35041"]
  ghi_chu: "NBA: \"the variations are built upon a ground bass\"; NBS: chủ đề thật là bè trầm, giai điệu Aria chỉ trở lại ở cuối; Forkel: \"recurrence of the same basic harmony throughout\"."
- trang: nghe-nhac/bach-goldberg
  id: n17
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://www.bachvereniging.nl/en/bwv/bwv-988", "https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf"]
  ghi_chu: "IMSLP: Canone all'Unisuono (3), alla Seconda (6), alla Terza (9), alla Quarta (12), alla Quinta (15), alla Sesta (18), alla Settima (21), all'Ottava (24), alla Nona (27); NBS mô tả đúng chuỗi này."
- trang: nghe-nhac/bach-goldberg
  id: n19
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://www.gutenberg.org/ebooks/35041"]
  ghi_chu: "IMSLP: Var. 7 \"al tempo di Giga\", Var. 10 Fughetta, nhiều biến tấu \"a 2 Clav.\"; Forkel: \"several extremely brilliant Variations for two Claviers\"."
- trang: nghe-nhac/bach-goldberg
  id: n20
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf", "https://www.bachvereniging.nl/en/bwv/bwv-988"]
  ghi_chu: "IMSLP: Variatio 16. Ouverture; NBA: \"an overture marks the beginning of the second half of the work\"."
- trang: nghe-nhac/bach-goldberg
  id: n21
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf", "https://www.bachvereniging.nl/en/bwv/bwv-988"]
  ghi_chu: "Bản nhạc Open Goldberg: chỉ Var. 15, 21, 25 có hóa biểu hai dấu giáng (Sol thứ), các biến tấu khác Sol trưởng; NBS: \"the three minor variations, 15, 21 and particularly 25\"."
- trang: nghe-nhac/bach-goldberg
  id: n22
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://www.gutenberg.org/ebooks/35041", "https://www.bachvereniging.nl/en/bwv/bwv-988"]
  ghi_chu: "IMSLP: Variatio 30. Quodlibet; Forkel (chú thích 237 của Terry): dựa trên hai bài dân ca vui \"Kraut und Rüben…\" và \"Ich bin so lang nicht bei dir gewest\"; NBS: \"a sort of light-hearted medley… two folk tunes\"."
- trang: nghe-nhac/bach-goldberg
  id: n23
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://www.henle.de/media/02/a8/fb/1697725919/1159-1697725919-sync.pdf", "https://www.gutenberg.org/ebooks/35041"]
  ghi_chu: "IMSLP và chú thích 236 (Forkel/Terry): 14, 20, 23, 26, 28 đều ghi \"a 2 Clav.\"; Henle (lời tựa Steglich): mười một biến tấu cho hai bàn phím, chơi trên một bàn phím thì hai tay đan vào nhau khó."
- trang: nghe-nhac/bach-goldberg
  id: n24
  luot_2: dung
  nguon: ["https://www.henle.de/media/02/a8/fb/1697725919/1159-1697725919-sync.pdf"]
  ghi_chu: "Lời tựa Henle: \"In playing them on a single manual this results in a difficult crossing of the hands in a number of the variations\"."
- trang: nghe-nhac/bach-goldberg
  id: n26
  luot_2: khong-chac
  nguon: ["https://www.bachvereniging.nl/en/bwv/bwv-988", "https://imslp.org/wiki/14_Canons,_BWV_1087_(Bach,_Johann_Sebastian)", "https://www.henle.de/media/02/a8/fb/1697725919/1159-1697725919-sync.pdf", "https://www.barenreiter.co.uk/prefaces/9790006465842_Innenansicht.pdf"]
  ghi_chu: "Strasbourg, bản in riêng của Bach, 14 canon trên tám nốt trầm đầu (BWV 1087) đều đúng (Henle, IMSLP, Bärenreiter: \"über die ersten acht Fundamentalnoten\"). Năm thì các nguồn lệch: NBS và IMSLP ghi tìm thấy 1974; lời tựa Henle (1978) ghi \"ein 1975 in Straßburg gefundenes Exemplar\"; Bärenreiter BA 5153 ghi chu kỳ canon \"erst 1975 bekannt geworden\". Có thể tìm thấy 1974, công bố 1975; review chọn cách viết."
- trang: nghe-nhac/bach-goldberg
  id: n27
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV988/bwv-988-aria/bwv-988-aria.ly", "https://www.barenreiter.co.uk/prefaces/9790006465842_Innenansicht.pdf"]
  ghi_chu: "Bè trầm Aria trên Mutopia, ô 1–8: G, F♯, E, D, B, C, D (ô 7: E C D), G. Bärenreiter: \"acht Fundamentalnoten\"."
- trang: nghe-nhac/bach-goldberg
  id: n29
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV988/bwv-988-aria/bwv-988-aria.ly"]
  ghi_chu: "Mutopia: Aria nhịp 3/4, nhiều dấu láy, appoggiatura, mordent. \"Chậm\": bản nhạc không ghi tốc độ."
- trang: nghe-nhac/bach-goldberg
  id: n30
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf"]
  ghi_chu: "Var. 1 (Open Goldberg) hai bè chạy nốt móc đơn/móc kép, không giữ giai điệu Aria; NBA: biến tấu dựng trên bè trầm."
- trang: nghe-nhac/bach-goldberg
  id: n31
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf"]
  ghi_chu: "Var. 3 Canone all'Unisuono: hai bè trên cùng cao độ, bè trầm riêng (bản nhạc)."
- trang: nghe-nhac/bach-goldberg
  id: n32
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://www.gutenberg.org/ebooks/35041"]
  ghi_chu: "IMSLP: Variatio 10. Fughetta; Forkel chú thích 235: \"Variation No. 10 is a Fughetta in four parts\"; bản nhạc: chủ đề vào lần lượt từ bè trầm."
- trang: nghe-nhac/bach-goldberg
  id: n33
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf"]
  ghi_chu: "Var. 13 (a 2 Clav.): bè trên giai điệu nhiều nốt trang trí, hai bè dưới đệm (bản nhạc Open Goldberg)."
- trang: nghe-nhac/bach-goldberg
  id: n34
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goldberg-Variationen,_BWV_988_(Bach,_Johann_Sebastian)", "https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf"]
  ghi_chu: "IMSLP: Canone alla Quinta, Andante; bản nhạc: hóa biểu Sol thứ, bè thứ hai vào ở ô 2 theo chiều ngược (canon đảo). Var. 15 là biến tấu Sol thứ đầu tiên."
