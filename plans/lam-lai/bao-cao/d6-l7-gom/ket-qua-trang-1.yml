  ghi_chu: "Henle: NMA (Plath/Rehm) cho là \"most probably composed in the year 1783 (in Vienna or Salzburg)\"; người biên tập Henle cho là sớm hơn 1783 và không ở Salzburg; in tháng 8/1784 ở Artaria, Vienna, cùng K. 330 và K. 332."
