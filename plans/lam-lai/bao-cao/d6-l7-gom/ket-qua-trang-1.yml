  ghi_chu: "IMSLP: số L của Alessandro Longo (Opere complete per clavicembalo, Ricordi, 1906–1910); Hyperion: ấn bản trọn bộ đầu tiên 1906, Ricordi, Longo biên tập."
- trang: nghe-nhac/scarlatti-sonata
  id: n14
  luot_2: khong-chac
  nguon: ["https://www.deutschegrammophon.com/en/composers/domenico-scarlatti/biography", "https://www.hyperion-records.co.uk/dc.asp?dc=D_CDA67613"]
  ghi_chu: "Một chương (DG), hai đoạn mỗi đoạn nhắc lại (Hyperion: \"the great majority are written in binary form—two sections, both repeated\"; Hyperion viết \"phần lớn\", câu viết \"mỗi sonata\"). Vế \"phần cuối nửa đầu xuất hiện lại ở cuối nửa sau ở giọng chính\" không xác nhận được bằng nguồn bậc 2 đọc được: Open Music Theory (chương binary form) trả 403 cả bản gốc lẫn Wayback, sách Kirkpatrick bị hạn chế. Thử bằng bản thu Smullyan K.380: đoạn cuối bài tương đồng (sắc độ dịch quãng 5) với đoạn quanh giây 67–77, gợi ý có \"vần\" nhưng không đủ chắc."
- trang: nghe-nhac/scarlatti-sonata
  id: n15
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn bậc 1–2 định nghĩa \"crux\" của Kirkpatrick (sách 1953 bị hạn chế trên Internet Archive, Princeton UP 403; chỉ thấy trang hãng đĩa và bản chép Wikipedia qua tìm kiếm, không dùng). Theo hiểu biết chung, Kirkpatrick dùng \"crux\" cho điểm trong mỗi nửa mà chất liệu song song ở cuối hai nửa gặp việc xác lập giọng kết; câu của trang gần nghĩa này nhưng cần nguồn."
