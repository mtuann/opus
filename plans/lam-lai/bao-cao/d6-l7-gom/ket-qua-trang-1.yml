  nguon: ["https://commons.wikimedia.org/wiki/File:Goldberg_Variations_complete_score.pdf", "https://www.barenreiter.co.uk/prefaces/9790006466177_Innenansicht.pdf"]
  ghi_chu: "Bản nhạc: Var. 16 Ouverture, phần đầu nhịp ₵ (2/2), sau dấu nhắc lại phần hai nhịp 3/8."
