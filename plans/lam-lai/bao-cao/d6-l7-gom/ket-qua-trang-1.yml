  id: n4
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-18.jpg"]
  ghi_chu: "NMA V/15/6 Vorwort tr. VII xếp các concerto này vào đỉnh cao của 'klassischer Vollendung', 'wahrhaft klassische Kompositionen'; năm 1785 thuộc thời kỳ Cổ điển."
- trang: nghe-nhac/mozart-concerto-21
  id: n5
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "KV liệt kê 3 phần: 467/01 Allegro maestoso, 467/02 Andante, 467/03 Allegro vivace assai."
- trang: nghe-nhac/mozart-concerto-21
  id: n6
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006467501_Innenansicht.pdf", "https://musicbrainz.org/recording/1a76c085-0859-4595-974b-947585467086", "https://musicbrainz.org/recording/66ce3575-03a4-4a1f-b4bd-c44df059f930"]
  ghi_chu: "Bärenreiter BA 5317a: 'Aufführungsdauer ca. 29 min.' Andante: bản Anda 7:15 (435 s), bản Bilson 6:10 (370 s) theo MusicBrainz; 'khoảng 6–7 phút' hợp lý (Anda nhỉnh hơn 7 phút một chút)."
- trang: nghe-nhac/mozart-concerto-21
  id: n7
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-18.jpg", "https://www.henle.de/media/fe/cc/48/1690886045/0766-1690886045-sync.pdf"]
  ghi_chu: "Nguồn bậc 1–2 nói rõ: NMA V/15/6 Vorwort (Engel/Heussner 1961) tr. VII: 'Die Klavierkonzerte des vorliegenden Bandes — wie alle Werke dieser Gattung aus der Wiener Zeit zum Vortrag in eigenen Konzerten bestimmt'. Henle HN 766 (Gertsch 2006): Mozart viết KV 466 và 467 'for his own use at two academies held for his benefit'; có thể ông muốn giữ quyền biểu diễn độc quyền các 'concerto lớn' cho mình. Lưu ý: KV online ghi vài concerto viết cho học trò (Ployer: KV 449, 453) hay nữ nghệ sĩ khác, nên chữ 'trước hết' là đúng mức."
- trang: nghe-nhac/mozart-concerto-21
  id: n8
  luot_2: dung
  nguon: ["https://www.bso.org/works/mozart-piano-concerto-no-21", "https://www.barenreiter.co.uk/prefaces/9790006201259_Innenansicht.pdf", "https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "KV 466 ghi ngày 10/2/1785 (chú giải chương trình BSO), ra mắt 11/2/1785 (lời tựa Bärenreiter KV 466); KV 467 hoàn thành 9/3/1785 (KV online): cách nhau 27 ngày, khoảng bốn tuần."
- trang: nghe-nhac/mozart-concerto-21
  id: n9
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://www.bso.org/works/mozart-piano-concerto-no-21"]
  ghi_chu: "Biên chế KV 467 trên KV online có clno1+clno2 (trumpet) và timp. Chú giải BSO: KV 466 'somber D minor', KV 467 'brightly colored, filled with festive, trumpet-and-drums panoply'. Câu không nói KV 466 thiếu trumpet và timpani (KV 466 cũng có), nên không sai."
- trang: nghe-nhac/mozart-concerto-21
  id: n10
  luot_2: dung
  nguon: ["https://snl.no/Elvira_Madigan", "https://time.com/archive/6631835/recordings-elvira-meet-wolfgang/", "https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "Store norske leksikon: phim Thụy Điển 1967, đạo diễn Bo Widerberg, nhạc nền có concerto piano số 21 của Mozart. TIME (23/2/1968): một đoạn trong bản thu của Géza Anda (DG) là chủ đề lặp lại trong nhạc nền phim Elvira Madigan. Tên gọi theo phim: chính bản thu trên Köchel online cũng ghi 'Piano Concerto 21 In C, K 467, _Elvira Madigan_'. IMDb và Svensk Filmdatabas không mở được bằng curl (IMDb trả về rỗng, SFDb có trang kiểm tra robot), nên không dùng."
- trang: nghe-nhac/mozart-concerto-21
  id: n12
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_93.jpg", "https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=155&p1=93"]
  ghi_chu: "NMA V/15/6 tr. 93, chú thích ở chữ Allegro maestoso: 'Tempobezeichnung, die im Autograph fehlt, nach Mozarts eigenhändigem Werkverzeichnis.'"
- trang: nghe-nhac/mozart-concerto-21
  id: n13
  luot_2: khong-chac
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_103.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_100.jpg"]
  ghi_chu: "Phần cấu trúc đúng, đã đối chiếu tổng phổ NMA: dàn nhạc trình bày trước, piano vào ở khoảng ô 73–83, rồi từ ô 109 piano một mình p ở Sol thứ (tr. 103). Phần 'khiến nhiều người nghĩ tới Giao hưởng số 40' là nhận xét về cách người nghe đón nhận: chỉ thấy ở sin80.com, một bản chép Wikipedia (nguồn bậc 3), không thấy ở nguồn bậc 1–2. Nên ghi nguồn hay viết nhẹ hơn ('có người liên tưởng')."
- trang: nghe-nhac/mozart-concerto-21
  id: n14
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://www.henle.de/media/fe/cc/48/1690886045/0766-1690886045-sync.pdf"]
  ghi_chu: "KV: chương 3 Allegro vivace assai (447 ô). Lời tựa Henle nói tới 'Rondo-Themas' của chương này. 'Tinh nghịch' là nhận xét về tính chất, hợp lý."
- trang: nghe-nhac/mozart-concerto-21
  id: n15
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "KV: 467/02 Andante, F-Dur; chương 1 và 3 Allegro, nên nhanh – chậm – nhanh."
- trang: nghe-nhac/mozart-concerto-21
  id: n16
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_138.jpg"]
  ghi_chu: "NMA tr. 138: Andante mở đầu, phần piano nghỉ (dòng bè trầm chỉ là bè continuo theo col Basso); Violino I, Violino II và Viola I, II ghi 'sordini'."
- trang: nghe-nhac/mozart-concerto-21
  id: n17
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_138.jpg"]
  ghi_chu: "NMA tr. 138: violin 1 giữ giai điệu; violin 2 và viola chơi chùm ba nốt lặp; 'Violoncello e Basso' ghi pizzicato."
- trang: nghe-nhac/mozart-concerto-21
  id: n18
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_140.jpg"]
  ghi_chu: "NMA tr. 140, ô 23: piano vào, tay phải chơi lại giai điệu mở đầu, tay trái chơi chùm ba; dây chuyển sang pizzicato. 'Như một giọng soprano' là hình ảnh so sánh."
- trang: nghe-nhac/mozart-concerto-21
  id: n19
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_138.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_144.jpg", "https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "Tổng phổ NMA: ngay ô 8–11 có hợp âm nghịch sfp (Re giáng, La giáng); tr. 144 (ô 55–62) đi qua các vùng Sol thứ, Re thứ. Chương dài 104 ô (KV), giọng chính Fa trưởng. Chỉ đọc mẫu vài trang, chưa đọc từng ô của đoạn coda."
- trang: nghe-nhac/mozart-concerto-21
  id: n20
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-12.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_175.jpg"]
  ghi_chu: "Lời tựa NMA V/15/6 tr. XIII: cadenza đặt sau hợp âm 'Quartsextakkord' có dấu ngân. Tổng phổ tr. 175: chương 3 dàn nhạc dừng ở dấu ngân, chú thích 'Kadenz'. Láy rền kết cadenza là lệ thường thời ấy."
- trang: nghe-nhac/mozart-concerto-21
  id: n21
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-12.jpg", "https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "Lời tựa NMA tr. XIII: chỗ cần chèn Eingänge là dấu ngân nằm giữa hai phần liền nhau, nối bằng một đoạn độc tấu ngắn. KV online: 'cadenzas and lead-ins' (Eingänge)."
- trang: nghe-nhac/mozart-concerto-21
  id: n22
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-11.jpg"]
  ghi_chu: "KV online: 'While he usually improvised his own cadenzas and lead-ins, Mozart provided a large number of written cadenzas for his sister Maria Anna and his students.' Lời tựa NMA tr. XIV: Mozart chỉ viết cadenza khi concerto được in hay do người khác chơi; 'Beide Anlässe entfielen für die Werke des vorliegenden Bandes' (KV 466, 467, 482), nên việc viết cadenza thuộc về người chơi."
- trang: nghe-nhac/mozart-concerto-21
  id: n23
  luot_2: dung
  nguon: ["https://wosu.org/2024-06-28/landmark-mozart-recordings-revive-the-danger-and-excitement-of-live-improvisation"]
  ghi_chu: "WOSU/NPR (2024) gọi Robert Levin là 'pianist, Mozart scholar', người ứng tác cadenza khi thu cả bộ concerto Mozart. Ba lựa chọn của nghệ sĩ là hệ quả của n22 (Perahia tự viết cadenza chương 1, dùng cadenza của R. Serkin ở chương 3: MusicBrainz)."
- trang: nghe-nhac/mozart-concerto-21
  id: n24
  luot_2: khong-chac
  nguon: ["https://kv.mozarteum.at/en/work/concerto-in-c-5544", "https://tafelmusik.org/explore-baroque/articles/mozarts-piano-fortepiano/"]
  ghi_chu: "KV online xác nhận ở Vienna Mozart biết tới và dùng đàn của Gabriel Anton Walter. Âm vực FF–g''' (hơn năm quãng tám một chút) có ở Tafelmusik, nhưng đó là đàn chép lại theo kiểu Walter (Wolf 1997), không phải đàn của Mozart. Kết quả tìm kiếm có tài liệu của Mozarthaus Vienna ghi đàn Walter của Mozart là năm quãng tám F1–f3 (61 phím), nhưng link ấy giờ chuyển về trang chủ, tôi không mở được. Còn lệch FF–f''' và FF–g''' (đàn có thể đã bị sửa về sau). Nên dựa vào nguồn của Mozarteum về cây đàn, hay viết 'khoảng năm quãng tám'."
- trang: nghe-nhac/mozart-concerto-21
  id: n27
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Mozart_Piano_Concerto_N_21_in_C_major,_K._467_(3rd_movement).oga"]
  ghi_chu: "Commons: chương 3, 'Taipei KHS Concert Hall Taiwan, June 2011'; tác giả ghi Giorgi Latsabidze (piano), David L. Wen (chỉ huy), Hsinchu Chamber Orchestra, Taiwan; CC BY-SA 3.0; dài khoảng 8:03."
- trang: nghe-nhac/mozart-concerto-21
  id: n28
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_93.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_100.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_103.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_-12.jpg"]
  ghi_chu: "NMA: ô 1–6 dây chơi p môtip hành khúc, ô 7 trở đi kèn đáp, ô 12 tutti f (tr. 93). Lời tựa tr. XIII: láy rền viết sẵn của piano ở ô 80–83 kết thúc bốn ô sau khi dây vào chủ đề; tổng phổ tr. 100: láy rền trên Sol, dây chơi hành khúc p. Tr. 103: ô 109 Sol thứ. Chủ đề thứ hai ở Sol trưởng và cadenza theo đúng mẫu. Ở ô 7 có cả kèn đồng và timpani đi cùng kèn gỗ."
- trang: nghe-nhac/mozart-concerto-21
  id: n29
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/ed/ucb16_155_138.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_140.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_144.jpg", "https://dme.mozarteum.at/DME/objs/ed/ucb16_155_175.jpg"]
  ghi_chu: "Chương 2 khớp tổng phổ (sordini, chùm ba, pizzicato, piano chơi lại giai điệu, vùng giọng thứ). Chương 3: cadenza gần cuối (tr. 175, chú thích 'Kadenz'). Đoạn 'trở về qua một giọng xa' chưa đọc từng ô."
- trang: nghe-nhac/mozart-concerto-21
  id: n31
  luot_2: dung
  nguon: ["https://musicbrainz.org/recording/1a76c085-0859-4595-974b-947585467086", "https://musicbrainz.org/release/e0b26cfe-73c3-4726-a129-508e50ab5699", "https://time.com/archive/6631835/recordings-elvira-meet-wolfgang/"]
  ghi_chu: "MusicBrainz: Anda vừa chơi vừa chỉ huy Camerata Academica Salzburg, thu tháng 5/1961 ở Großes Festspielhaus Salzburg; Deutsche Grammophon SLPM 138 783. TIME 1968: đoạn của bản thu Anda/DG là nhạc nền phim."
- trang: nghe-nhac/mozart-concerto-21
  id: n32
  luot_2: dung
  nguon: ["https://musicbrainz.org/recording/39b8df06-b5c7-486b-9219-3a789a0730dd", "https://musicbrainz.org/release-group/4467b01e-c5b6-4714-b291-5377218b648a"]
  ghi_chu: "MusicBrainz: Perahia vừa chơi vừa chỉ huy English Chamber Orchestra; đĩa CBS Masterworks phát hành năm 1978 (M/MK 34562). Thu ngày 20/9/1976: năm 1978 là năm phát hành."
- trang: nghe-nhac/mozart-concerto-21
  id: n33
  luot_2: dung
  nguon: ["https://musicbrainz.org/recording/66ce3575-03a4-4a1f-b4bd-c44df059f930", "https://musicbrainz.org/release/8439efa0-61bd-454e-8b0a-6ea123709d40"]
  ghi_chu: "MusicBrainz: Malcolm Bilson (fortepiano), John Eliot Gardiner, English Baroque Soloists; Archiv Produktion 419 609-2 phát hành 1987. Thu tháng 4/1986."
- trang: nghe-nhac/mozart-concerto-21
  id: n35
  luot_2: dung
  nguon: ["https://www.henle.de/Piano-Concerto-no.-21-C-major-K.-467/HN-766", "https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "Trang HN 766 của henle.de, mục Difficulty: 'Piano Concerto C major K. 467 — 6 medium'; thang Henle 1–9. Henle chỉ chấm mức cho cả tác phẩm. Vế 'chương 1 và 3 nhiều nốt hơn chương 2' khớp tổng phổ (417 và 447 ô nhanh, so với 104 ô Andante: KV)."
- trang: nghe-nhac/mozart-concerto-21
  id: n38
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/concerto-in-c-5544"]
  ghi_chu: "Trang KV 467 trên Köchel online có thật và có đủ: ngày hoàn thành 9/3/1785, buổi ra mắt 10/3/1785 ở Burgtheater, biên chế (fl, ob1+2, fag1+2, cor1+2, clno1+2, timp, clav, dây), câu 'usually improvised his own cadenzas and lead-ins'."
- trang: nghe-nhac/mozart-concerto-21
  id: n39
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=155&p1=93"]
  ghi_chu: "NMA V/15/6 (Engel, Heussner, 1961; KV online ghi 'V/15/6: Klavierkonzerte · Band 6 … (1961)') có trên DME; tổng phổ tr. 93 có chú thích về chỉ dẫn tốc độ chương 1."
- trang: nghe-nhac/mozart-concerto-21
  id: n40
  luot_2: dung
  nguon: ["https://www.henle.de/media/fe/cc/48/1690886045/0766-1690886045-sync.pdf"]
  ghi_chu: "Lời tựa HN 766 của Norbert Gertsch (München, mùa xuân 2006): 'den 9ten März', Burgtheater-Akademie 10/3; bản thảo ở Pierpont Morgan Library, New York (Heineman Collection, MS 266)."
- trang: nghe-nhac/mozart-concerto-21
  id: n41
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Mozart_Piano_Concerto_N_21_in_C_major,_K._467_(3rd_movement).oga"]
  ghi_chu: "File có thật trên Commons (chương 3, Latsabidze, CC BY-SA 3.0)."
- trang: nghe-nhac/mozart-concerto-21
  id: n36
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên tập hợp lý; mức 6 của Henle phù hợp với lộ trình K. 545, K. 331 rồi sonata lớn hơn; bản rút gọn hai piano có thật (Henle HN 766, Bärenreiter BA 5317a)."
- trang: nghe-nhac/mozart-concerto-21
  id: n25
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý và khớp tổng phổ (piano hát giai điệu dài trên nền chùm ba); lời tựa NMA tr. XII cũng nói các nốt dài ở chương chậm vốn được trang trí khi chơi."
- trang: nghe-nhac/mozart-concerto-21
  id: n30
  luot_2: dung
  nguon: []
  ghi_chu: "Câu hỏi nghe chủ động: hợp lý."
