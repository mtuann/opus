- trang: nghe-nhac/bach-goldberg
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Johann Sebastian Bach (1685–1750).'
  loai: nam
- trang: nghe-nhac/bach-goldberg
  id: n2
  cau: 'Bảng: Tên đầy đủ Aria mit verschiedenen Veränderungen (Aria với nhiều biến tấu), BWV
    988.'
  loai: ten
- trang: nghe-nhac/bach-goldberg
  id: n3
  cau: 'Bảng: In năm 1741 ở Nuremberg (nhà xuất bản Balthasar Schmid), là phần thứ tư của
    loạt sách Clavier-Übung của Bach.'
  loai: nam
- trang: nghe-nhac/bach-goldberg
  id: n4
  cau: 'Bảng: Thời kỳ Baroque.'
  loai: lich-su
- trang: nghe-nhac/bach-goldberg
  id: n5
  cau: 'Bảng: Thể loại chủ đề và biến tấu cho harpsichord hai bàn phím.'
  loai: ten
- trang: nghe-nhac/bach-goldberg
  id: n6
  cau: 'Bảng: Độ dài khoảng 40–80 phút, tùy tốc độ và việc có chơi các dấu nhắc lại hay không
    (Gould 1955: khoảng 38 phút; bản Ishizaka trên trang này: khoảng 82 phút).'
  loai: so-lieu
- trang: nghe-nhac/bach-goldberg
  id: n7
  cau: 'Trang bìa bản in năm 1741 ghi: một aria với nhiều biến tấu, cho harpsichord có hai
    bàn phím, soạn để làm vui tâm hồn những người yêu nhạc.'
  loai: ten
- trang: nghe-nhac/bach-goldberg
  id: n8
  cau: Đây là phần thứ tư của Clavier-Übung ("Bài tập cho đàn phím"), loạt tác phẩm cho đàn
    phím mà Bach cho in khi còn sống.
  loai: lich-su
- trang: nghe-nhac/bach-goldberg
  id: n9
  cau: Năm 1802, Forkel kể rằng bá tước Keyserlingk, cựu đại sứ Nga ở triều đình Saxony, hay
    mất ngủ và nhờ Bach viết nhạc để Johann Gottlieb Goldberg chơi cho ông nghe trong những
    đêm dài.
  loai: lich-su
- trang: nghe-nhac/bach-goldberg
  id: n10
  cau: Chuyện này chưa chắc chắn.
  loai: lich-su
- trang: nghe-nhac/bach-goldberg
  id: n11
  cau: Trang bìa không có lời đề tặng.
  loai: lich-su
- trang: nghe-nhac/bach-goldberg
  id: n12
  cau: Forkel viết sau hơn 60 năm.
  loai: nam
- trang: nghe-nhac/bach-goldberg
  id: n13
  cau: Khi bản nhạc ra đời Goldberg mới khoảng 14 tuổi.
  loai: nam
- trang: nghe-nhac/bach-goldberg
  id: n14
  cau: Aria là một giai điệu chậm nhịp 3/4, dài 32 ô nhịp, chia hai nửa, mỗi nửa có dấu nhắc
    lại.
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n15
  cau: Sau Aria là 30 biến tấu, cuối cùng Aria được chơi lại nguyên vẹn (da capo).
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n16
  cau: Các biến tấu không giữ giai điệu của Aria mà giữ bè trầm và đường đi hòa âm của nó.
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n17
  cau: 'Cứ ba biến tấu có một canon: biến tấu 3, 6, 9… đến 27; khoảng cách giữa hai bè tăng
    dần từ đồng âm (biến tấu 3), quãng 2 (biến tấu 6)… đến quãng 9 (biến tấu 27).'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n19
  cau: Xen giữa các canon là các điệu nhảy, một fughetta, những bản kỹ thuật bắt chéo tay.
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n20
  cau: Biến tấu 16, mở đầu nửa sau, là một khúc mở màn kiểu Pháp (ouverture).
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n21
  cau: 'Chỉ ba biến tấu ở giọng Sol thứ: 15, 21 và 25.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n22
  cau: Biến tấu 30 là một quodlibet, ghép những giai điệu dân ca quen thuộc thời đó vào khung
    hòa âm, một kiểu liên khúc vui.
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n23
  cau: Bach viết cho harpsichord hai bàn phím; ở nhiều biến tấu (như 14, 20, 23, 26, 28) mỗi
    tay chạy trên một bàn phím riêng và có thể chồng lên nhau.
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n24
  cau: 'Trên piano chỉ có một bàn phím: hai tay phải đan vào nhau, nhường chỗ cho nhau từng
    nốt.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n26
  cau: Năm 1974, người ta tìm thấy ở Strasbourg bản in riêng của Bach, trong đó ông viết thêm
    14 canon trên tám nốt trầm đầu tiên của Aria (BWV 1087).
  loai: lich-su
- trang: nghe-nhac/bach-goldberg
  id: n27
  cau: 'Tám nốt trầm đầu của Aria: Sol – Fa♯ – Mi – Rê – Si – Đô – Rê – Sol.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n29
  cau: 'Theo dõi: Aria: giai điệu chậm, nhiều nốt hoa mỹ, nhịp 3/4.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n30
  cau: 'Theo dõi: Biến tấu 1: hai bè sôi nổi; giai điệu Aria biến mất nhưng đường hòa âm vẫn
    còn.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n31
  cau: 'Theo dõi: Biến tấu 3: canon đồng âm, hai bè trên đuổi nhau ở cùng cao độ, bè trầm
    đi riêng.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n32
  cau: 'Theo dõi: Biến tấu 10: fughetta, chủ đề vào lần lượt ở từng bè.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n33
  cau: 'Theo dõi: Biến tấu 13: giai điệu nhiều trang trí ở bè trên, hai bè dưới đệm.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n34
  cau: 'Theo dõi: Biến tấu 15: canon ở quãng 5, bè sau đi ngược chiều bè trước; lần đầu nghe
    giọng Sol thứ.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n35
  cau: 'Theo dõi: Biến tấu 16: mở nửa sau bằng khúc mở màn kiểu Pháp: phần chậm nhịp 2/2 trang
    trọng, rồi phần nhanh nhịp 3/8.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n36
  cau: 'Theo dõi: Biến tấu 25: Adagio giọng Sol thứ, nhiều nửa cung.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n37
  cau: 'Theo dõi: Biến tấu 26–29: nốt chạy liên tục, hai tay bắt chéo, hợp âm dồn dập ở biến
    tấu 29.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n38
  cau: 'Theo dõi: Biến tấu 30: quodlibet, các giai điệu dân ca chồng lên khung hòa âm.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n39
  cau: 'Theo dõi: Aria da capo: Aria trở lại nguyên vẹn, khép vòng tròn.'
  loai: cau-truc
- trang: nghe-nhac/bach-goldberg
  id: n41
  cau: 'Glenn Gould, 1955 và 1981 (Sony Classical): hai bản thu của cùng một nghệ sĩ cách
    nhau 26 năm; bản 1955 dài khoảng 38 phút, bản 1981 khoảng 51 phút; riêng Aria chừng 1
    phút 53 giây và 3 phút 5 giây.'
  loai: so-lieu
- trang: nghe-nhac/bach-goldberg
  id: n42
  cau: András Schiff (piano; Decca, rồi ECM năm 2003).
  loai: ten
- trang: nghe-nhac/bach-goldberg
  id: n43
  cau: Một bản harpsichord, ví dụ Pierre Hantaï (Opus 111, Mirare) hoặc Trevor Pinnock (Archiv
    Produktion).
  loai: ten
- trang: nghe-nhac/bach-goldberg
  id: n44
  cau: Henle xếp cả bộ ở mức 9 (khó nhất) trên thang 1–9.
  loai: cap-do
- trang: nghe-nhac/bach-goldberg
  id: n49
  cau: 'Mục Nguồn: IMSLP, Mutopia, trang bìa trên Commons; Henle HN 1159; Forkel 1802 (bản
    dịch Terry trên Project Gutenberg); Netherlands Bach Society.'
  loai: ten
- trang: nghe-nhac/bach-goldberg
  id: n40
  cau: 'Câu hỏi nghe chủ động (năm câu: bè trầm ở đầu mỗi biến tấu, bè vào sau trong canon,
    ba biến tấu Sol thứ, Aria trở lại, bắt chéo tay trên harpsichord và piano).'
  loai: khuyen-tap
- trang: nghe-nhac/bach-goldberg
  id: n28
  cau: Hát thầm chuỗi tám nốt rồi nghe xem nó ẩn dưới mỗi biến tấu ra sao.
  loai: khuyen-tap
- trang: nghe-nhac/bach-goldberg
  id: n45
  cau: 'Aria thì nốt không nhanh: cái khó là giữ nhịp chậm mà vẫn trôi, và chơi gọn các nốt
    hoa mỹ.'
  loai: khuyen-tap
- trang: nghe-nhac/mozart-concerto-21
  id: n1
  cau: 'Tiêu đề và bảng: Concerto cho piano và dàn nhạc số 21 cung Đô trưởng, K. 467, của
    Wolfgang Amadeus Mozart (1756–1791).'
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n2
  cau: 'Bảng: Sáng tác ở Vienna đầu năm 1785; Mozart ghi vào danh mục tác phẩm của mình ngày
    9/3/1785.'
  loai: nam
- trang: nghe-nhac/mozart-concerto-21
  id: n3
  cau: 'Bảng: Mozart tự chơi phần độc tấu buổi ra mắt ở nhà hát Burgtheater ngày hôm sau (10/3/1785).'
  loai: lich-su
- trang: nghe-nhac/mozart-concerto-21
  id: n4
  cau: 'Bảng: Thời kỳ Cổ điển.'
  loai: lich-su
- trang: nghe-nhac/mozart-concerto-21
  id: n5
  cau: 'Bảng: Concerto piano, 3 chương.'
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n6
  cau: 'Bảng: Độ dài khoảng 26–30 phút; riêng chương 2 (Andante) khoảng 6–7 phút.'
  loai: so-lieu
- trang: nghe-nhac/mozart-concerto-21
  id: n7
  cau: Mozart viết concerto trước hết để tự mình biểu diễn trong các buổi hòa nhạc do chính
    ông tổ chức ở Vienna.
  loai: lich-su
- trang: nghe-nhac/mozart-concerto-21
  id: n8
  cau: K. 467 ra đời chỉ bốn tuần sau Concerto Rê thứ K. 466.
  loai: nam
- trang: nghe-nhac/mozart-concerto-21
  id: n9
  cau: K. 466 u tối, giông bão; K. 467 rạng rỡ, với kèn trumpet và trống timpani làm giọng
    Đô trưởng thêm sáng.
  loai: lich-su
- trang: nghe-nhac/mozart-concerto-21
  id: n10
  cau: Năm 1967, đạo diễn Thụy Điển Bo Widerberg dùng chương Andante, qua bản thu của Géza
    Anda, làm nhạc nền phim Elvira Madigan; từ đó cả bản concerto hay bị gọi theo tên phim.
  loai: lich-su
- trang: nghe-nhac/mozart-concerto-21
  id: n12
  cau: 'Chương 1 Allegro maestoso: bản thảo không ghi chỉ dẫn tốc độ; chữ Allegro maestoso
    lấy từ danh mục tác phẩm do Mozart tự ghi.'
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n13
  cau: 'Chương 1: dàn nhạc trình bày trước; sau đó piano mới vào với phần trình bày của riêng
    mình, kể cả một chủ đề mới ở Sol thứ khiến nhiều người nghĩ tới Giao hưởng số 40.'
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n14
  cau: 'Chương 3 Allegro vivace assai: một rondo nhanh, tinh nghịch.'
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n15
  cau: Chương 2 Andante, Fa trưởng; ba chương nhanh – chậm – nhanh.
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n16
  cau: Andante mở đầu chỉ có dàn nhạc; violin và viola gắn sordino (miếng chặn kẹp trên ngựa
    đàn) nên tiếng mờ và mềm.
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n17
  cau: Violin 1 hát một giai điệu dài; violin 2 và viola lặp lại các nốt theo chùm ba đều
    đặn, gần như không dứt; cello và contrabass gảy dây (pizzicato).
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n18
  cau: Rồi piano bước vào, hát lại giai điệu ấy như một giọng soprano.
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n19
  cau: Giai điệu có những bước nhảy quãng rộng và những chỗ nghịch tai thoáng qua; giữa chương
    nhạc nhiều lần tối lại ở các giọng thứ, rồi trở về Fa trưởng và tắt dần trong một coda
    ngắn.
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n20
  cau: 'Cadenza thời Mozart: gần cuối một chương nhanh, dàn nhạc dừng trên một hợp âm có dấu
    ngân (fermata); nghệ sĩ độc tấu chơi một mình rồi kết bằng một láy rền dài, làm hiệu cho
    dàn nhạc vào lại.'
  loai: dinh-nghia
- trang: nghe-nhac/mozart-concerto-21
  id: n21
  cau: Ở vài dấu ngân khác, người chơi ứng tác một đoạn nối ngắn gọi là Eingang ("lối vào").
  loai: dinh-nghia
- trang: nghe-nhac/mozart-concerto-21
  id: n22
  cau: Mozart thường tự ứng tác cadenza khi chơi; ông viết ra giấy nhiều cadenza cho chị gái
    và học trò, nhưng không có cadenza nào của ông cho K. 467 còn lại.
  loai: lich-su
- trang: nghe-nhac/mozart-concerto-21
  id: n23
  cau: 'Nghệ sĩ phải tự chọn: chơi cadenza của người đời sau, tự viết, hoặc ứng tác ngay trên
    sân khấu như nghệ sĩ kiêm học giả Robert Levin.'
  loai: lich-su
- trang: nghe-nhac/mozart-concerto-21
  id: n24
  cau: Ở Vienna, Mozart chơi fortepiano kiểu của Anton Walter, âm vực hơn năm quãng tám một
    chút, từ FF đến g'''.
  loai: so-lieu
- trang: nghe-nhac/mozart-concerto-21
  id: n27
  cau: Bản thu dưới đây chỉ có chương 3, do Giorgi Latsabidze chơi piano cùng Hsinchu Chamber
    Orchestra (Đài Loan), David L. Wen chỉ huy, thu năm 2011.
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n28
  cau: 'Bảng Theo dõi khi nghe, chương 1: mở đầu bộ dây chơi nhỏ môtip hành khúc, kèn gỗ đáp,
    rồi cả dàn nhạc bừng lên; piano vào sau kèn gỗ dẫn đường, dạo một đoạn ngắn rồi láy rền
    dài trên nốt Sol trong khi dàn nhạc chơi lại hành khúc; rẽ sang Sol thứ, chủ đề mới, sau
    đó chủ đề thứ hai ở Sol trưởng; cadenza: dàn nhạc dừng, piano một mình, láy rền cuối gọi
    dàn nhạc vào.'
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n29
  cau: 'Bảng Theo dõi khi nghe, chương 2: dây gắn sordino, violin 1 hát, chùm ba, cello và
    contrabass gảy dây; piano hát lại giai điệu; bóng tối ở các giọng thứ; trở về qua một
    giọng xa rồi về Fa trưởng, coda tắt dần. Chương 3: chủ đề nhảy nhót, piano và dàn nhạc
    hỏi đáp; cadenza ngắn gần cuối, chủ đề trở lại, kết rộn ràng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-concerto-21
  id: n31
  cau: Géza Anda vừa độc tấu vừa chỉ huy dàn nhạc Camerata Academica Salzburg (Deutsche Grammophon,
    thu năm 1961); chương Andante của bản thu này là nhạc nền phim Elvira Madigan.
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n32
  cau: Murray Perahia cũng vừa chơi vừa chỉ huy, với English Chamber Orchestra (CBS, 1978).
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n33
  cau: Malcolm Bilson (fortepiano) với John Eliot Gardiner và English Baroque Soloists, dàn
    nhạc chơi nhạc cụ thời kỳ (Archiv Produktion, 1987).
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n35
  cau: Henle xếp phần piano của concerto này ở mức 6 (trung bình) trên thang 1–9; chương 1
    và 3 nhiều nốt hơn chương 2.
  loai: cap-do
- trang: nghe-nhac/mozart-concerto-21
  id: n38
  cau: 'Mục Nguồn: Köchel online (ngày hoàn thành, buổi ra mắt, biên chế, Mozart thường ứng
    tác cadenza).'
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n39
  cau: 'Mục Nguồn: Neue Mozart-Ausgabe V/15/6 (1961) trên trang trực tuyến của Mozarteum:
    tổng phổ, chú thích về chỉ dẫn tốc độ chương 1.'
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n40
  cau: 'Mục Nguồn: Norbert Gertsch, lời tựa ấn bản Henle HN 766 (2006): ngày 9 và 10/3/1785;
    bản thảo lưu ở Thư viện Morgan, New York.'
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n41
  cau: 'Mục Nguồn: bản thu chương 3 của Giorgi Latsabidze trên Wikimedia Commons.'
  loai: ten
- trang: nghe-nhac/mozart-concerto-21
  id: n36
  cau: Chương 2 không dày nốt, nhưng hát một giai điệu dài với tiếng đều và trang trí tự nhiên
    là điều khó; lộ trình K. 545, K. 331, một sonata Mozart lớn hơn rồi mới đến concerto;
    tập với bản rút gọn hai piano và một người cùng chơi.
  loai: khuyen-tap
- trang: nghe-nhac/mozart-concerto-21
  id: n25
  cau: Trong Andante piano chỉ có một giai điệu dài trên nền chùm ba; cái khó là giữ từng
    nốt dài vẫn hát và trang trí mà không lệch nhịp; trên đàn hiện đại phải tiết chế bàn đạp
    và cách nhấn phím.
  loai: khuyen-tap
- trang: nghe-nhac/mozart-concerto-21
  id: n30
  cau: Câu hỏi để nghe chủ động (bốn câu).
  loai: khuyen-tap
- trang: nghe-nhac/mozart-k331
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791).'
  loai: nam
- trang: nghe-nhac/mozart-k331
  id: n2
  cau: 'Bảng: Tên đầy đủ Sonata piano số 11 cung La trưởng, K. 331 (300i).'
  loai: danh-muc
- trang: nghe-nhac/mozart-k331
  id: n3
  cau: 'Bảng: Chưa rõ năm sáng tác: Neue Mozart-Ausgabe đoán năm 1783 (ở Vienna hay Salzburg),
    Henle (2021) cho là sớm hơn, ở Vienna; in tháng 8 năm 1784 (nhà Artaria, Vienna) cùng
    hai sonata K. 330 và K. 332.'
  loai: nam
- trang: nghe-nhac/mozart-k331
  id: n4
  cau: 'Bảng: Thời kỳ Cổ điển; thể loại sonata piano.'
  loai: lich-su
- trang: nghe-nhac/mozart-k331
  id: n5
  cau: 'Bảng: Độ dài khoảng 20–25 phút.'
  loai: so-lieu
- trang: nghe-nhac/mozart-k331
  id: n6
  cau: 'Cả bản sonata không chương nào ở hình thức sonata: chương 1 là chủ đề và biến tấu,
    chương 2 là minuet, chương 3 là bản "nhạc Thổ Nhĩ Kỳ"; thay cho chương nhanh mở đầu như
    thường lệ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n7
  cau: 'Chương 1, Andante grazioso, nhịp 6/8: chủ đề gồm hai nửa (8 và 10 ô nhịp), mỗi nửa
    nhắc lại.'
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n8
  cau: Sau đó là sáu biến tấu giữ nguyên khung hòa âm và hình dáng câu nhạc.
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n9
  cau: Biến tấu 1 và 2 trang trí giai điệu; biến tấu 2 trên nền chùm ba nốt móc kép.
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n10
  cau: Biến tấu 3 chuyển sang La thứ.
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n11
  cau: Ở biến tấu 4, tay trái vắt qua tay phải, đảm nhận cả bè trầm lẫn giai điệu.
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n12
  cau: Biến tấu 5 là Adagio, chậm và trang trí như một aria.
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n13
  cau: Biến tấu 6 đổi sang Allegro nhịp 4/4.
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n14
  cau: 'Chương 2, Menuetto: minuet và trio ở La trưởng; trio chuyển sang Rê trưởng, với những
    chuỗi quãng 3 và quãng 6 song song.'
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n15
  cau: Vienna những năm 1780 mê "nhạc Thổ", âm thanh của ban nhạc quân đội Janissary.
  loai: lich-su
- trang: nghe-nhac/mozart-k331
  id: n16
  cau: Ban nhạc Janissary với trống, chũm chọe, kẻng tam giác.
  loai: lich-su
- trang: nghe-nhac/mozart-k331
  id: n17
  cau: Mozart vừa viết vở opera Die Entführung aus dem Serail (Vụ bắt cóc khỏi hậu cung, 1782).
  loai: nam
- trang: nghe-nhac/mozart-k331
  id: n18
  cau: Tên "Alla turca" có từ bản in đầu năm 1784; theo Henle, nó được thêm vào lúc in, do
    Mozart hay nhà xuất bản.
  loai: lich-su
- trang: nghe-nhac/mozart-k331
  id: n19
  cau: Trên piano, Mozart bắt chước ban nhạc bằng những đoạn hành khúc La trưởng mạnh mẽ,
    với hợp âm tay trái rải thật nhanh như tiếng trống và chũm chọe.
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n20
  cau: 'Chương 3 là một rondo: đoạn La thứ, hành khúc La trưởng, đoạn Fa♯ thứ, rồi các đoạn
    quay lại, khép bằng một coda.'
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n22
  cau: Chủ đề dịu dàng, nhịp đung đưa (bỏ "kiểu siciliana").
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n23
  cau: Bản in đầu ghi tốc độ chương cuối là Allegrino, nhiều ấn bản về sau (như bản gõ lại
    trên Mutopia) ghi Allegretto (hơi nhanh), đều không phải Presto.
  loai: lich-su
- trang: nghe-nhac/mozart-k331
  id: n24
  cau: Tháng 9 năm 2014, một phần bản thảo của Mozart, từ biến tấu 3 của chương 1 tới ô 10
    của trio chương 2, được tìm thấy ở Thư viện Quốc gia Széchényi, Budapest. Trước đó người
    ta chỉ biết một tờ có các ô cuối của chương 3.
  loai: lich-su
- trang: nghe-nhac/mozart-k331
  id: n25
  cau: Bản thu gợi ý do Luis Kolodin chơi cả ba chương, đăng trên IMSLP.
  loai: ten
- trang: nghe-nhac/mozart-k331
  id: n27
  cau: 'Theo dõi (12 dòng): chủ đề; biến tấu 1–2; biến tấu 3 La thứ, nốt chạy; biến tấu 4
    La trưởng, tay trái vắt; biến tấu 5 Adagio; biến tấu 6 Allegro 4/4; Menuetto La trưởng;
    Trio Rê trưởng, quãng 3 và 6; đoạn La thứ có lúc sáng lên ở Đô trưởng; hành khúc La trưởng,
    quãng tám, tay trái rải; đoạn Fa♯ thứ móc kép liên tục; coda La trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n28
  cau: 'Theo dõi, dòng chủ đề: giai điệu 6/8 đung đưa; hai nửa, mỗi nửa nhắc lại.'
  loai: cau-truc
- trang: nghe-nhac/mozart-k331
  id: n30
  cau: Mitsuko Uchida, Daniel Barenboim, András Schiff đều có bản thu K. 331.
  loai: ten
- trang: nghe-nhac/mozart-k331
  id: n33
  cau: Henle xếp cả bản ở mức 6 trên thang 1–9 và ghi ABRSM Grade 8.
  loai: cap-do
- trang: nghe-nhac/mozart-k331
  id: n36
  cau: 'Mục Nguồn: IMSLP; Mutopia; Henle HN 1300 (lời tựa Seiffert 2021); bản thu Kolodin
    trên IMSLP.'
  loai: ten
- trang: nghe-nhac/mozart-k331
  id: n34
  cau: Chủ đề chương 1 có thể tập sớm hơn; chuẩn bị bằng Sonata K. 545 và Sonatina Clementi,
    luyện gam và hợp âm rải, đọc nốt hoa mỹ; ở chương 3 tập hợp âm rải tay trái nhẹ trước
    rồi mới tăng tốc.
  loai: khuyen-tap
- trang: nghe-nhac/mozart-k331
  id: n21
  cau: 'Nghe bằng tai người chơi piano: nhẹ và rõ, nhịp 6/8 không nặng nề, nốt trang trí phải
    "nói", gần như không cần bàn đạp.'
  loai: khuyen-tap
- trang: nghe-nhac/mozart-k331
  id: n31
  cau: 'Một bản trên fortepiano: tiếng nhẹ, tắt nhanh, hành khúc nghe giòn và gần với ban
    nhạc Janissary hơn; xem lịch sử cây đàn piano.'
  loai: khuyen-tap
- trang: nghe-nhac/scarlatti-sonata
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Domenico Scarlatti (1685–1757).'
  loai: nam
- trang: nghe-nhac/scarlatti-sonata
  id: n2
  cau: 'Bảng: Sonata Mi trưởng K. 380 (L. 23); Sonata Rê thứ K. 141 (L. 422); Sonata Fa thứ
    K. 466 (L. 118).'
  loai: danh-muc
- trang: nghe-nhac/scarlatti-sonata
  id: n3
  cau: 'Bảng: Sáng tác trong những năm Scarlatti phục vụ triều đình Bồ Đào Nha rồi Tây Ban
    Nha; phần lớn được biết qua các tập chép tay thập niên 1740–1750.'
  loai: lich-su
- trang: nghe-nhac/scarlatti-sonata
  id: n4
  cau: 'Bảng: Thời kỳ Baroque muộn.'
  loai: lich-su
- trang: nghe-nhac/scarlatti-sonata
  id: n5
  cau: 'Bảng: Thể loại sonata một chương cho đàn phím (chủ yếu harpsichord).'
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n6
  cau: 'Bảng: Độ dài mỗi bản khoảng 3–6 phút.'
  loai: so-lieu
- trang: nghe-nhac/scarlatti-sonata
  id: n7
  cau: Domenico Scarlatti sinh năm 1685 ở Naples, cùng năm với Bach và Handel.
  loai: nam
- trang: nghe-nhac/scarlatti-sonata
  id: n8
  cau: Năm 1719 ông tới Lisbon và dạy nhạc cho công chúa Bồ Đào Nha Maria Magdalena Barbara.
  loai: lich-su
- trang: nghe-nhac/scarlatti-sonata
  id: n9
  cau: Khi bà về làm dâu hoàng gia Tây Ban Nha (về sau trở thành hoàng hậu), Scarlatti theo
    sang, sống ở Seville rồi Madrid đến cuối đời.
  loai: lich-su
- trang: nghe-nhac/scarlatti-sonata
  id: n10
  cau: Ông để lại 555 bản sonata cho đàn phím.
  loai: so-lieu
- trang: nghe-nhac/scarlatti-sonata
  id: n11
  cau: 30 bản đầu tiên được in năm 1738 với tên Essercizi ("Bài tập").
  loai: nam
- trang: nghe-nhac/scarlatti-sonata
  id: n12
  cau: Chữ K. là của Ralph Kirkpatrick, nghệ sĩ harpsichord đã lập danh mục năm 1953, cố gắng
    xếp các sonata theo thứ tự thời gian (dựa vào thứ tự trong các tập chép tay ở Venice).
  loai: danh-muc
- trang: nghe-nhac/scarlatti-sonata
  id: n13
  cau: Các ấn bản cũ dùng số L. của Alessandro Longo (ấn bản 1906–1910).
  loai: nam
- trang: nghe-nhac/scarlatti-sonata
  id: n14
  cau: 'Mỗi sonata chỉ có một chương, ở hình thức hai đoạn: nửa đầu đi từ giọng chính sang
    một giọng mới; nửa sau đi xa hơn rồi trở về; mỗi nửa có dấu nhắc lại; phần cuối nửa đầu
    xuất hiện lại ở cuối nửa sau, ở giọng chính, như hai câu thơ gieo vần.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n15
  cau: Kirkpatrick gọi điểm mà từ đó hai nửa bắt đầu "vần" với nhau là crux.
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n16
  cau: 'Vũ điệu và tiếng guitar: nhiều bản bắt chước bước nhảy của vũ điệu; những nốt lặp
    lại nhanh và hợp âm gõ mạnh gợi tiếng gảy guitar.'
  loai: lich-su
- trang: nghe-nhac/scarlatti-sonata
  id: n17
  cau: 'Scarlatti cũng là bậc thầy của kỹ thuật bắt chéo tay: một tay vắt qua tay kia để chơi
    nốt ở xa.'
  loai: lich-su
- trang: nghe-nhac/scarlatti-sonata
  id: n20
  cau: Đây là nhạc viết chủ yếu cho harpsichord.
  loai: lich-su
- trang: nghe-nhac/scarlatti-sonata
  id: n21
  cau: 'K. 380, Mi trưởng (Andante commodo, nhịp 3/4): có biệt danh Cortège (đoàn rước); mở
    đầu bằng những hình nốt như lời gọi kèn, đáp qua đáp lại.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n22
  cau: 'K. 141, Rê thứ (Allegro, nhịp 3/8): nốt lặp lại cực nhanh gần như suốt bài, bắt chéo
    tay; Henle xếp mức 7 (khó) trên thang 1–9.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n23
  cau: 'K. 466, Fa thứ (Andante moderato): chậm, buồn, hát như một aria; mặt trữ tình của
    Scarlatti.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n24
  cau: Bản thu dưới đây chỉ có K. 380, do Raymond Smullyan chơi trên piano.
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n25
  cau: Smullyan không chơi các dấu nhắc lại, nên dòng "nửa đầu được nhắc lại" trong bảng không
    có mốc.
  loai: so-lieu
- trang: nghe-nhac/scarlatti-sonata
  id: n28
  cau: 'Theo dõi: K. 380, một môtip mới, trang trọng hơn, có trill; nửa đầu khép lại ở giọng
    mới.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n29
  cau: 'Theo dõi: K. 380, nửa đầu được nhắc lại; nửa sau đi qua các giọng xa, rồi đoạn "vần"
    trở lại ở Mi trưởng.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n30
  cau: 'Theo dõi: K. 141, nốt lặp lại dồn dập trên cùng một phím, như tiếng gảy guitar; hai
    tay bắt chéo, tay trái vắt lên chơi nốt cao; nửa sau kết ở Rê thứ, mạnh mẽ.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n31
  cau: 'Theo dõi: K. 466, giai điệu chậm, buồn ở Fa thứ; nửa sau trở về Fa thứ và khép lại
    lặng lẽ.'
  loai: cau-truc
- trang: nghe-nhac/scarlatti-sonata
  id: n33
  cau: Vladimir Horowitz thu âm K. 380 nhiều lần; bản này mở đầu đĩa Horowitz in Moscow (Deutsche
    Grammophon), ghi buổi hòa nhạc ở Moscow năm 1986.
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n34
  cau: Martha Argerich có bản thu trực tiếp K. 141 (Live from the Concertgebouw 1978 & 1979);
    Angela Hewitt cũng thu K. 141 (Hyperion, 2016).
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n35
  cau: Scott Ross (harpsichord) thu trọn 555 bản sonata cho hãng Erato (1984–1985).
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n38
  cau: 'K. 380: ABRSM Grade 7 theo trang của Henle, mức 5 trên thang 1–9; K. 141 khó hơn (Henle
    mức 7) vì nốt lặp lại nhanh và bắt chéo tay.'
  loai: cap-do
- trang: nghe-nhac/scarlatti-sonata
  id: n39
  cau: Hãy bắt đầu bằng những bản ngắn, chậm như K. 32 (Rê thứ, Aria) hoặc K. 34 (Rê thứ,
    Larghetto).
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n42
  cau: 'Mục Nguồn: IMSLP và ảnh chép tay trên Commons; Henle HN 574, HN 1221; Treccani (Fernandes);
    bản thu Smullyan trên Commons, từ bộ sưu tập Al Goldstein (Pandora Music).'
  loai: ten
- trang: nghe-nhac/scarlatti-sonata
  id: n18
  cau: Trên piano hiện đại, nghệ sĩ chơi nhẹ, gọn, rõ, rất ít dùng bàn đạp, giữ nốt lặp đều
    bằng cách đổi ngón trên cùng một phím; để ý cách mỗi người tạo tiếng kèn hay tiếng guitar.
  loai: khuyen-tap
- trang: nghe-nhac/scarlatti-sonata
  id: n36
  cau: Sonata Scarlatti vừa là bài kỹ thuật vừa là nhạc để nghe, hợp với người chơi piano
    trung cấp trở lên.
  loai: khuyen-tap
- trang: nghe-nhac/scarlatti-sonata
  id: n32
  cau: Câu hỏi nghe chủ động (năm câu).
  loai: khuyen-tap
