- trang: nghe-nhac/chopin-etude
  id: n1
  cau: 'Tiêu đề và bảng: Étude Op. 10 số 3 cung Mi trưởng (Lento ma non troppo) và số 12 cung
    Đô thứ (Allegro con fuoco), trong 12 Étude Op. 10.'
  loai: ten
- trang: nghe-nhac/chopin-etude
  id: n2
  cau: 'Bảng: Nhà soạn nhạc Frédéric Chopin (1810–1849).'
  loai: nam
- trang: nghe-nhac/chopin-etude
  id: n3
  cau: 'Bảng: Op. 10 viết trong các năm 1829–1832; bản thảo nháp của số 3 đề ngày 25/8/1832.'
  loai: nam
- trang: nghe-nhac/chopin-etude
  id: n4
  cau: 'Bảng: Op. 10 in năm 1833 ở Paris, Leipzig và London.'
  loai: nam
- trang: nghe-nhac/chopin-etude
  id: n5
  cau: 'Bảng và đoạn "Liszt, người được đề tặng": Op. 10 đề tặng "người bạn Franz Liszt".'
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n6
  cau: 'Bảng: Thời kỳ Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n7
  cau: 'Bảng: Thể loại étude cho piano.'
  loai: ten
- trang: nghe-nhac/chopin-etude
  id: n8
  cau: 'Bảng: Độ dài số 3 khoảng 4–5 phút; số 12 khoảng 2,5–3 phút; cả Op. 10 khoảng 30–35
    phút.'
  loai: so-lieu
- trang: nghe-nhac/chopin-etude
  id: n9
  cau: Étude nghĩa là "bài luyện".
  loai: dinh-nghia
- trang: nghe-nhac/chopin-etude
  id: n10
  cau: Trước Chopin, étude của Czerny, Cramer hay Clementi chủ yếu là bài luyện ngón cho người
    học.
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n11
  cau: Chopin viết 12 étude Op. 10 khi 19 đến 22 tuổi.
  loai: nam
- trang: nghe-nhac/chopin-etude
  id: n12
  cau: Mỗi bản Op. 10 giải một bài toán kỹ thuật nhưng đồng thời là một tác phẩm trọn vẹn;
    chúng được viết để chơi cả trên sân khấu hòa nhạc, không chỉ trong phòng tập.
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n14
  cau: Năm 1833 Chopin viết cho Ferdinand Hiller rằng ông không biết ngòi bút đang viết gì,
    vì lúc ấy Liszt đang chơi các étude của ông, và ông muốn "đánh cắp" cách Liszt chơi chúng.
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n15
  cau: Op. 25 (12 bản) in năm 1837, đề tặng bá tước phu nhân Marie d'Agoult, người bạn đời
    của Liszt.
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n16
  cau: Năm 1839 Chopin viết thêm ba étude không số hiệu, Trois nouvelles études.
  loai: nam
- trang: nghe-nhac/chopin-etude
  id: n17
  cau: 'Biệt danh không phải của Chopin: "Tristesse" cho số 3, "Cách mạng" cho số 12, "Phím
    đen" cho Op. 10 số 5, "Gió mùa đông" cho Op. 25 số 11 đều do người đời sau đặt.'
  loai: ten
- trang: nghe-nhac/chopin-etude
  id: n18
  cau: 'Số 3: bản thảo đầu tiên ghi Vivace, rồi Vivace ma non troppo; đến bản in mới thành
    Lento ma non troppo (chậm, nhưng không quá), kèm một số máy đếm nhịp.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n19
  cau: Theo Frederick Niecks, Chopin nói với học trò Adolf Gutmann rằng ông chưa từng viết
    được giai điệu nào đẹp như thế; có lần nghe Gutmann tập bản này, ông giơ hai tay lên và
    kêu "Ôi, quê hương tôi!".
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n20
  cau: 'Số 3: giai điệu và phần đệm trong cùng một tay; giai điệu legato ở bè trên do ngón
    4 và 5 hát, bè đệm móc kép bên dưới do ngón 1 và 2.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n21
  cau: 'Số 3: đoạn giữa (poco più animato, từ ô 21) đổi tính chất: giai điệu và đệm hòa thành
    chuỗi nốt kép.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n22
  cau: 'Số 3: đoạn giữa đi qua một loạt hợp âm bảy giảm căng thẳng, lên đỉnh ở đoạn con bravura
    với những quãng sáu kép.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n23
  cau: 'Số 3: một hợp âm bảy át kéo dài dẫn về giai điệu, lần này ngắn hơn; kết rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n24
  cau: Năm 1831 cuộc khởi nghĩa Ba Lan chống Nga thất bại và Warsaw rơi vào tay quân Nga,
    khi Chopin đã rời quê hương.
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n25
  cau: Theo một truyền thuyết, Chopin viết số 12 đúng lúc tin ấy lan tới (tháng 9/1831), nhưng
    không có tài liệu nào chứng minh; bản chép sạch còn lại được viết trong khoảng 1832–1833.
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n26
  cau: 'Số 12: mở đầu là một hợp âm nghịch tai đánh mạnh, rồi tay trái đổ xuống; sau đó tay
    phải hô vang chủ đề bằng quãng tám và hợp âm, trong khi tay trái chạy móc kép không nghỉ
    lên xuống.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n27
  cau: 'Số 12: gần cuối nhạc lắng xuống giây lát, rồi hai tay cùng đổ xuống lần cuối, kết
    bằng hợp âm Đô trưởng.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n30
  cau: Chopin có ghi bàn đạp, nhưng trên đàn ngày nay người chơi phải thay bàn đạp thường
    hơn chỗ ông ghi, theo bè trầm và hòa âm.
  loai: lich-su
- trang: nghe-nhac/chopin-etude
  id: n33
  cau: 'Bảng Theo dõi khi nghe, số 3: mở đầu giai điệu Mi trưởng hát chậm ở bè trên, đệm móc
    kép rất nhẹ bên dưới cùng một tay, câu nhạc dâng lên một đỉnh nhỏ rồi khép lại; Poco più
    animato: nốt kép lắc lư; chuỗi hợp âm bảy giảm; Con bravura: quãng sáu kép dồn dập, đỉnh
    điểm; hợp âm bảy át kéo dài; giai điệu trở lại ngắn hơn, kết rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n34
  cau: 'Bảng Theo dõi khi nghe, số 12: mở đầu hợp âm mạnh, tay trái đổ xuống; chủ đề chính
    quãng tám tay phải trên dòng móc kép tay trái; đoạn giữa chuyển giọng, dồn dập hơn rồi
    chủ đề trở lại; coda lắng xuống, hai tay đổ xuống lần cuối, kết Đô trưởng.'
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n36
  cau: Maurizio Pollini thu trọn hai tập Op. 10 và Op. 25 cho Deutsche Grammophon.
  loai: ten
- trang: nghe-nhac/chopin-etude
  id: n37
  cau: Alfred Cortot thu Op. 10 năm 1933 và soạn một ấn bản "để tập" có lời bình (édition
    de travail, Paris, 1915).
  loai: ten
- trang: nghe-nhac/chopin-etude
  id: n38
  cau: Murray Perahia thu trọn Op. 10 và Op. 25 (phát hành năm 2002).
  loai: ten
- trang: nghe-nhac/chopin-etude
  id: n41
  cau: Henle ghi cả 24 étude Op. 10 và Op. 25 ở mức bằng LRSM của ABRSM, độ khó 6–9 trên thang
    9.
  loai: cap-do
- trang: nghe-nhac/chopin-etude
  id: n42
  cau: Phần đầu số 3 dài khoảng 20 ô, chậm; đoạn giữa khó hơn nhiều.
  loai: cau-truc
- trang: nghe-nhac/chopin-etude
  id: n45
  cau: 'Trois nouvelles études nhẹ hơn một chút (Henle: mức 6–7), là cửa vào hợp lý cho étude
    Chopin.'
  loai: cap-do
- trang: nghe-nhac/chopin-etude
  id: n47
  cau: 'Mục Nguồn: IMSLP; Henle HN 124 (lời tựa, ghi chú); mUltimate Chopin của Viện Fryderyk
    Chopin (bản thảo, bản in đầu Paris, Leipzig, London 1833); Niecks 1888 trên Project Gutenberg
    (Gutmann, thư gửi Hiller).'
  loai: ten
- trang: nghe-nhac/chopin-etude
  id: n43
  cau: Có thể tập phần đầu số 3 sớm hơn để luyện cân bằng trong một tay; số 12 cần một tay
    trái đã rèn kỹ bằng gam và hợp âm rải nhanh; trước đó học Nocturne Op. 9 số 2 và étude
    của Czerny, Cramer.
  loai: khuyen-tap
- trang: nghe-nhac/chopin-etude
  id: n35
  cau: 'Câu hỏi để nghe chủ động (năm câu: bè đệm số 3, tốc độ, chỗ căng nhất, tay nào là
    "cơn bão", hợp âm Đô trưởng cuối).'
  loai: khuyen-tap
- trang: nghe-nhac/chopin-etude
  id: n29
  cau: Ở số 3, legato của giai điệu đến từ cách nối phím và giữ phím, không phải từ cú đánh
    mạnh.
  loai: khuyen-tap
- trang: nghe-nhac/doc-ten-tac-pham
  id: n2
  cau: 'Ví dụ: Beethoven, Giao hưởng số 5 cung Đô thứ, Op. 67 ("Định mệnh").'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n3
  cau: 'Hình và bảng: tên đầy đủ gồm nhà soạn nhạc (Beethoven), thể loại (Giao hưởng), số
    thứ tự (số 5, thứ tự trong các tác phẩm cùng thể loại của nhà soạn nhạc), giọng (cung
    Đô thứ, giọng chính), số hiệu danh mục (Op. 67), biệt danh ("Định mệnh").'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n4
  cau: 'Chú thích hình và đoạn sau bảng: chỉ riêng số hiệu danh mục (Op. 67) đã đủ xác định
    chính xác tác phẩm; tìm theo tên nhà soạn nhạc kèm số hiệu ("Beethoven Op. 67", "Mozart
    K. 550").'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n6
  cau: 'Bảng: biệt danh thường không phải do nhà soạn nhạc đặt.'
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n7
  cau: 'Opus (tiếng Latin: "tác phẩm"), viết tắt Op., là số thứ tự tác phẩm, do nhà soạn nhạc
    hoặc nhà xuất bản gán khi xuất bản.'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n8
  cau: 'Số opus chỉ cho biết gần đúng thứ tự sáng tác, và có khi sai lệch: nhà xuất bản có
    thể gán số opus muộn cho một tác phẩm viết từ sớm.'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n9
  cau: 'Một opus có thể gồm nhiều tác phẩm nhỏ: Chopin Nocturne Op. 9 số 2 là bản thứ hai
    trong tập Op. 9.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n10
  cau: 'Op. posth. (posthumous, di cảo): xuất bản sau khi nhà soạn nhạc mất.'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n11
  cau: WoO (Werk ohne Opuszahl, "tác phẩm không có số opus") dùng cho Beethoven; Für Elise
    là WoO 59.
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n12
  cau: Với nhiều nhà soạn nhạc, số opus không đầy đủ hoặc không đáng tin, nên các nhà nghiên
    cứu lập danh mục riêng, đặt theo tên người lập.
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n13
  cau: 'BWV, J. S. Bach: danh mục của Wolfgang Schmieder (1950); xếp theo thể loại, không
    theo thời gian; Prelude cung Đô trưởng BWV 846.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n14
  cau: 'HWV, Handel: danh mục của Bernd Baselt; Messiah HWV 56.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n15
  cau: 'RV, Vivaldi: danh mục của Peter Ryom; Mùa xuân RV 269.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n16
  cau: 'K. hoặc KV, Mozart: danh mục của Ludwig von Köchel (1862), xếp gần đúng theo thời
    gian sáng tác; Giao hưởng số 40, K. 550.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n17
  cau: 'Hob., Haydn: danh mục của Anthony van Hoboken, chia nhóm theo thể loại (nhóm I là
    giao hưởng); Giao hưởng số 94, Hob. I:94.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n18
  cau: 'D., Schubert: danh mục của Otto Erich Deutsch (1951); Erlkönig D. 328.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n19
  cau: 'S., Liszt: danh mục của Humphrey Searle; Liebestraum số 3, S. 541.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n20
  cau: 'B., Dvořák: danh mục của Jarmil Burghauser.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n21
  cau: 'L. hoặc K., Domenico Scarlatti: Longo, về sau Ralph Kirkpatrick; 555 sonata cho harpsichord.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n22
  cau: 'Sz. hoặc BB, Bartók: András Szőllősy, về sau László Somfai (BB); Vũ khúc dân gian
    Romania Sz. 56.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n23
  cau: 'Mẹo: số K. càng lớn thì tác phẩm Mozart càng muộn; K. 1 là tác phẩm thời thơ ấu; K.
    626 (Requiem) là tác phẩm cuối cùng, dang dở.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n24
  cau: Tên "Ánh trăng" của Sonata piano Op. 27 số 2 có lẽ bắt nguồn từ hình ảnh mặt hồ dưới
    trăng mà nhà phê bình Ludwig Rellstab dùng để tả chương 1, trong một truyện ngắn năm 1824;
    bản in đầu tiên (1802) chỉ ghi Sonata quasi una fantasia.
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n25
  cau: '"Định mệnh" của Giao hưởng số 5 không phải tên Beethoven đặt.'
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n27
  cau: Giao hưởng Từ Thế giới mới của Dvořák ngày nay là số 9, nhưng trong các ấn bản cũ từng
    được đánh số 5.
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n28
  cau: Giao hưởng "Lớn" cung Đô trưởng của Schubert có lúc được gọi là số 7, số 8 hoặc số
    9.
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n30
  cau: Minuet cung Sol trưởng trong sổ tay Anna Magdalena Bach (BWV Anh. 114) thực ra của
    Christian Petzold.
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n31
  cau: Chữ Anh. (Anhang, "phụ lục") trong BWV đánh dấu những tác phẩm còn nghi vấn hoặc không
    phải của Bach.
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n32
  cau: Mozart Giao hưởng số 40 có bản có và không có clarinet.
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n33
  cau: Spiegel im Spiegel của Pärt có bản cho violin, viola, cello (với piano).
  loai: ten
- trang: nghe-nhac/doc-ten-tac-pham
  id: n35
  cau: 'Ví dụ dòng thông tin bản thu: Beethoven Symphony No. 5, Wiener Philharmoniker, Carlos
    Kleiber, Deutsche Grammophon, 1974 (phát hành năm 1975).'
  loai: nam
- trang: nghe-nhac/doc-ten-tac-pham
  id: n36
  cau: 'Bảng: nghệ sĩ độc tấu (ví dụ Martha Argerich, piano) quyết định cách diễn giải ở concerto,
    sonata, độc tấu; mỗi dàn nhạc có âm sắc riêng; nhạc trưởng quyết định tốc độ, cân bằng,
    tính cách của bản giao hưởng.'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n37
  cau: 'Một số hãng đĩa nhạc cổ điển: Deutsche Grammophon, Decca, Sony Classical, Warner Classics,
    Harmonia Mundi, Hyperion, BIS, ECM New Series.'
  loai: ten
- trang: nghe-nhac/doc-ten-tac-pham
  id: n38
  cau: Bản thu trước khoảng 1955 thường là mono.
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n39
  cau: Bản cũ có thể nghe rè nhưng có giá trị lịch sử; bản live có không khí và đôi khi tiếng
    khán giả; remaster là bản thu cũ được xử lý lại âm thanh.
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n40
  cau: 'Từ khoảng những năm 1970, phong trào biểu diễn theo phong cách lịch sử (HIP) chơi
    nhạc Baroque và Cổ điển bằng nhạc cụ thời đó hoặc bản sao: violin dây ruột, kèn không
    có van, harpsichord thay piano.'
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n41
  cau: HIP lên dây thấp hơn, thường A = 415 Hz cho nhạc Baroque.
  loai: so-lieu
- trang: nghe-nhac/doc-ten-tac-pham
  id: n42
  cau: Âm sắc khác hẳn, cách chọn tốc độ cũng khác, và ít rung (vibrato) hơn.
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n45
  cau: 'Gợi ý tên nghệ sĩ và nhóm HIP: Nikolaus Harnoncourt, Christopher Hogwood, Roger Norrington,
    John Eliot Gardiner với English Baroque Soloists.'
  loai: ten
- trang: nghe-nhac/doc-ten-tac-pham
  id: n46
  cau: 'Building a Library trong chương trình Record Review của BBC Radio 3 (có dạng podcast):
    mỗi kỳ một chuyên gia so sánh nhiều bản thu của một tác phẩm và chọn bản nên có.'
  loai: ten
- trang: nghe-nhac/doc-ten-tac-pham
  id: n47
  cau: 'Gramophone: tạp chí và giải thưởng Gramophone Awards hằng năm.'
  loai: ten
- trang: nghe-nhac/doc-ten-tac-pham
  id: n50
  cau: 'Câu hỏi 1: đáp án đúng: K. 550 thuộc về Mozart.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n51
  cau: 'Câu hỏi 1: lựa chọn sai Bach, Beethoven (K. 550 không phải của hai người này).'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n52
  cau: 'Câu hỏi 1, giải thích: danh mục Köchel cho tác phẩm của Mozart.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n53
  cau: 'Câu hỏi 2: đáp án đúng: BWV là danh mục tác phẩm của J. S. Bach; lựa chọn sai Beethoven,
    Brahms; giải thích: Bach-Werke-Verzeichnis, do Wolfgang Schmieder lập.'
  loai: danh-muc
- trang: nghe-nhac/doc-ten-tac-pham
  id: n54
  cau: 'Câu hỏi 3: đáp án đúng: biệt danh "Ánh trăng" của Op. 27 số 2 do một nhà phê bình,
    không phải Beethoven, đặt; lựa chọn sai: Beethoven, nhà xuất bản của Beethoven.'
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n55
  cau: 'Câu hỏi 3, giải thích: hình ảnh ánh trăng là của nhà phê bình Ludwig Rellstab; bản
    in đầu tiên chỉ ghi Sonata quasi una fantasia.'
  loai: lich-su
- trang: nghe-nhac/doc-ten-tac-pham
  id: n56
  cau: 'Câu hỏi 4: "Op. posth." nghĩa là xuất bản sau khi nhà soạn nhạc mất; lựa chọn sai
    "tác phẩm cuối cùng", "tác phẩm không hoàn thành"; giải thích: posthumous, di cảo.'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n57
  cau: 'Câu hỏi 5: cách chính xác nhất khi tìm một tác phẩm là tìm theo tên nhà soạn nhạc
    kèm số hiệu danh mục; lựa chọn sai: tìm theo biệt danh, theo giọng; giải thích: số hiệu
    danh mục xác định duy nhất một tác phẩm.'
  loai: dinh-nghia
- trang: nghe-nhac/doc-ten-tac-pham
  id: n49
  cau: 'Thử nhiều bản: nghe 1–2 phút đầu của 3–4 bản thu, chọn bản làm bạn muốn nghe tiếp;
    đó cũng là bài luyện tai.'
  loai: khuyen-tap
- trang: nghe-nhac/doc-ten-tac-pham
  id: n44
  cau: Không bên nào "đúng" hơn; hãy nghe cùng một tác phẩm Bach hoặc Vivaldi ở cả hai cách
    và tự chọn.
  loai: khuyen-tap
- trang: nghe-nhac/doc-ten-tac-pham
  id: n34
  cau: Ghi chú bản thu thường nói rõ phiên bản.
  loai: khuyen-tap
- trang: nghe-nhac/mau
  id: n8
  cau: 'Ví dụ lần 3 (cấu trúc) của Prelude Đô trưởng BWV 846: Đô trưởng → sang Sol trưởng
    → trở về → nốt Sol trầm ngân rất lâu → kết.'
  loai: cau-truc
- trang: nghe-nhac/mau
  id: n5
  cau: Câu hỏi gợi ý trong khung (vui hay buồn, giai điệu nào nhớ được, bản thu thứ hai khác
    gì, đọc bối cảnh từ nguồn đáng tin…).
  loai: khuyen-tap
- trang: nghe-nhac/mau
  id: n2
  cau: Chép khung vào sổ tay hoặc ứng dụng ghi chú, mỗi tác phẩm một trang; vài dòng cho mỗi
    lần nghe là đủ.
  loai: khuyen-tap
- trang: nghe-nhac/mau
  id: n7
  cau: 'Ví dụ lần 1 (cảm nhận): êm và đều như nước chảy; khoảng phút thứ nhất nhạc căng lên
    rồi lắng xuống.'
  loai: khuyen-tap
- trang: nghe-nhac/nghe-gi-tiep
  id: n2
  cau: Vivaldi Bốn Mùa → Bach Brandenburg Concerto số 3 và 5; Vivaldi Concerto cho hai violin
    RV 522.
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n3
  cau: Bach Prelude cung Đô trưởng → các prelude khác trong Bình quân luật; Bach Goldberg
    Variations (Aria).
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n4
  cau: Mozart Eine kleine Nachtmusik → Mozart Divertimento K. 136; Haydn Tứ tấu "Hoàng đế".
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n5
  cau: Beethoven Giao hưởng số 5 → Beethoven Giao hưởng số 7; Brahms Giao hưởng số 1.
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n6
  cau: Chopin Nocturne Op. 9 số 2 → Chopin Nocturne Op. 27 số 2; Field Nocturne số 5; Schumann
    Träumerei.
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n7
  cau: Debussy Clair de lune → Debussy Rêverie, Arabesque số 1; Ravel Pavane pour une infante
    défunte; Satie Gymnopédie số 1.
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n8
  cau: Tchaikovsky Hồ thiên nga → Tchaikovsky Kẹp hạt dẻ, Người đẹp ngủ trong rừng; Prokofiev
    Romeo và Juliet; đều là nhạc ballet.
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n9
  cau: Dvořák Giao hưởng số 9 → Dvořák Concerto cello; Smetana Vltava.
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n11
  cau: Pärt Spiegel im Spiegel → Pärt Für Alina, Fratres; Górecki Giao hưởng số 3 (chương
    1).
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n12
  cau: Stravinsky Le Sacre du printemps → Stravinsky L'Oiseau de feu; Bartók Concerto cho
    dàn nhạc.
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n14
  cau: 'Theo tâm trạng (cần tập trung): Bach Goldberg Variations, bản Glenn Gould năm 1981.'
  loai: nam
- trang: nghe-nhac/nghe-gi-tiep
  id: n15
  cau: 'Theo tâm trạng: Bach các Partita cho đàn phím; Pärt Für Alina.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n16
  cau: 'Theo tâm trạng (năng lượng buổi sáng): Rossini overture William Tell (phần cuối);
    Mozart Giao hưởng số 41 Jupiter, chương 4; Vivaldi Mùa hè, chương 3.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n17
  cau: 'Theo tâm trạng (buồn, cần an ủi): Barber Adagio cho đàn dây; Elgar Nimrod (trong Enigma
    Variations); Mahler Giao hưởng số 5, Adagietto.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n18
  cau: 'Theo tâm trạng (muốn khóc một chút): Puccini O mio babbino caro; Fauré Pavane; Rachmaninoff
    Concerto piano số 2, chương 2.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n19
  cau: 'Theo tâm trạng (thư giãn trước khi ngủ): Debussy Clair de lune; Satie Gymnopédies;
    Chopin các Nocturne.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n21
  cau: 'Piano: Beethoven Sonata Ánh trăng (link hướng dẫn nghe); Chopin Ballade số 1; Liszt
    Liebestraum số 3; Rachmaninoff Prélude cung Đô♯ thứ.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n22
  cau: 'Violin: Mendelssohn Concerto cung Mi thứ; Bach Chaconne; Massenet Méditation (Thaïs);
    Sarasate Zigeunerweisen.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n23
  cau: 'Cello: Bach Tổ khúc cello số 1, Prelude; Saint-Saëns Thiên nga; Elgar Concerto cello.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n24
  cau: 'Guitar: Rodrigo Concierto de Aranjuez, chương 2; Tárrega Recuerdos de la Alhambra.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n25
  cau: 'Guitar: Albéniz Asturias, nguyên bản cho piano; nghe bản chuyển soạn cho guitar.'
  loai: ten
- trang: nghe-nhac/nghe-gi-tiep
  id: n27
  cau: 'Theo thời lượng: 5 phút cho một nocturne, một prelude hoặc một aria; 15 phút cho một
    chương giao hưởng hay concerto; 30–45 phút cho trọn một giao hưởng của Mozart, Beethoven,
    Brahms; 1–3 tiếng cho một vở opera hay ballet trọn vẹn.'
  loai: so-lieu
- trang: nghe-nhac/nghe-gi-tiep
  id: n10
  cau: 'Vì sao (Dvořák): cùng Dvořák, hoặc một nhà soạn nhạc Séc khác; giai điệu dễ nhớ, dàn
    nhạc rực rỡ.'
  loai: khuyen-tap
- trang: nghe-nhac/nghe-gi-tiep
  id: n13
  cau: Cột "Vì sao" của các dòng còn lại (năng lượng Baroque; hợp âm rải tĩnh lặng; trong
    sáng cân đối thời Cổ điển; kịch tính đến chiến thắng; giai điệu hát trên nền hợp âm rải;
    không khí mơ màng; nhạc ballet giàu giai điệu; chậm rãi, thiền định; tiết tấu mạnh, màu
    sắc dàn nhạc).
  loai: khuyen-tap
- trang: nghe-nhac/nghe-gi-tiep
  id: n20
  cau: Gợi ý theo tâm trạng (chọn tác phẩm nào cho tâm trạng nào).
  loai: khuyen-tap
