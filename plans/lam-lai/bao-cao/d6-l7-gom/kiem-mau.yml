- trang: nghe-nhac/scarlatti-sonata
  id: n38
  cau: "K. 380: ABRSM Grade 7 theo trang của Henle, mức 5 trên thang 1–9; K. 141 khó hơn (Henle mức 7) vì nốt lặp lại nhanh và bắt chéo tay."
  loai: cap-do
  nguon:
    - ten: 'G. Henle Verlag, Piano Sonata in E major K. 380, L. 23 (HN 574): trang sản phẩm "Piano Sonata E major K. 380 · 5 · medium · ABRSM: Piano Grade 7"; lời tựa (Bengt Johnsson 1985, PDF): sonata viết "not solely for the harpsichord but also for the recently invented Forte-Piano", "In 1738, thirty sonatas (K. 1–30) appeared in print in London as Essercizi per Gravicembalo", các tập Venice và Parma "originated in Spain between 1752 and 1757, except for volumes XIV and XV … 1742 and 1749"'
      link: https://www.henle.de/en/Piano-Sonata-in-E-major-K.-380-L.-23/HN-574
    - ten: 'G. Henle Verlag, Piano Sonata d minor (Toccata) K. 141, L. 422 (HN 1221): trang sản phẩm "Piano Sonata d minor K. 141 · 7 · difficult"; lời tựa (PDF): nguồn chính là "Worgan Manuscript" (British Library)'
      link: https://www.henle.de/en/Piano-Sonata-d-minor-Toccata-K.-141-L.-422/HN-1221
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "(≈ Grade 8, …); K. 141 khó hơn nhiều". Henle HN 574: "5 · medium · ABRSM: Piano Grade 7"; HN 1221: "7 · difficult". Grade 8 lệch nguồn; khớp trang piano/nha-soan-nhac (Grade 7). Review D6-L7-gom: đọc lại chữ trang, khớp câu (không còn chữ cũ đã bỏ); lượt 2 xác nhận chữ đã sửa.'
- trang: nghe-nhac/chopin-etude
