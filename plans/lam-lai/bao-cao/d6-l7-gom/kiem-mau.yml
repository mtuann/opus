- trang: nghe-nhac/nghe-gi-tiep
  id: n6
  cau: Chopin Nocturne Op. 9 số 2 → Chopin Nocturne Op. 27 số 2; Field Nocturne số 5; Schumann Träumerei.
  loai: ten
  nguon:
    - ten: "IMSLP, trang tác phẩm (wikitext qua API, đã mở từng trang): Brandenburg Concerto No.3 BWV 1048, No.5 BWV 1050; Concerto for 2 Violins in A minor RV 522 (Op.3 No.8); Das wohltemperierte Klavier I BWV 846–869; Goldberg Variations BWV 988; Divertimento K.136; String Quartet Hob.III:77 \"Emperor\" (Op.76 No.3); Symphony No.7 Op.92 (Beethoven); Symphony No.1 Op.68 (Brahms); Nocturnes Op.27 (Chopin); Nocturne in B-flat major H 37 \"Nocturne No.5\" (Field); Rêverie CD 76, 2 Arabesques CD 74 (Debussy); Pavane pour une infante défunte (Ravel); 3 Gymnopédies (Satie); Swan Lake Op.20, The Nutcracker Op.71, The Sleeping Beauty Op.66 (Tchaikovsky); Cello Concerto Op.104 (Dvořák); Má vlast: số 2 \"Vltava\" (Smetana); The Rite of Spring, The Firebird (Stravinsky); 6 Partitas BWV 825–830; Guillaume Tell (Rossini): \"Overture\"; Symphony No.41 K.551 \"Jupiter Symphony\"; Le quattro stagioni: RV 315 \"L'estate\"; Enigma Variations Op.36: \"Variation IX: Nimrod\"; Symphony No.5 (Mahler): \"4. Adagietto\"; Gianni Schicchi (Puccini): \"Aria: O mio babbino caro\"; Pavane Op.50 (Fauré); Piano Concerto No.2 Op.18 (Rachmaninoff), 3 movements; Ballade No.1 Op.23 (Chopin); Liebesträume S.541; Morceaux de fantaisie Op.3: \"Prélude … Lento (c#)\" là số 2; Violin Concerto Op.64 (Mendelssohn), Key e; Violin Partita No.2 BWV 1004: \"Chaconne (No.5)\"; Thaïs: \"Méditation (Act II)\"; Zigeunerweisen Op.20; Cello Suite No.1 BWV 1007: \"Prélude\"; Le carnaval des animaux: \"13. Le cygne\"; Cello Concerto Op.85 (Elgar); Recuerdos de la Alhambra (Tárrega); Suite española No.1 Op.47 (Albéniz), Instrumentation piano, \"Asturias (No.5)\". Link ghi trang Enigma Variations làm đại diện; các trang khác theo tên ở trên"
      link: https://imslp.org/wiki/Variations_on_an_Original_Theme_%27Enigma%27,_Op.36_(Elgar,_Edward)
  ket_qua_luot_1: dung
  ghi_chu: 'IMSLP: Nocturnes Op.27 (2 nocturnes); Field H 37 "Nocturne No.5". Träumerei: trang piano/tac-pham/schumann-traumerei và bản ghi đã kiểm.'
