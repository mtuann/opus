  ghi_chu: "NMA tr. 138: 'Andante', hóa biểu một giáng; IMSLP: Andante (F major, 104 bars)."
- trang: du-lieu/tac-pham/mozart-concerto-21
  id: n9
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=138&l=1", "https://www.bso.org/works/mozart-piano-concerto-no-21"]
  ghi_chu: "NMA tr. 138: 'sordini' ghi ở Violino I, Violino II và Viola I, II; violin II và viola chơi chùm ba móc đơn. BSO: 'muted strings … continuous cushion of triplets'."
- trang: du-lieu/tac-pham/mozart-concerto-21
  id: n10
  luot_2: khong-chac
  ghi_chu: "Phần lớn câu đúng: NMA tr. 150 ghi 'Allegro vivace assai', 2/4, Đô trưởng; BSO gọi là 'rondo-finale'; NMA tr. 175 có fermata kèm chú thích 'Kadenz; vgl. Vorwort' (khoảng ô 426). Nhưng chữ 'ngắn' không có nguồn: bản nhạc chỉ đánh dấu chỗ cadenza, độ dài do người chơi (Mozart không để lại cadenza), và NMA gọi đây là Kadenz chứ không phải Eingang. Đề nghị bỏ 'ngắn' hay viết 'có chỗ cadenza'. Nguồn đã mở: https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=173&l=1, https://www.bso.org/works/mozart-piano-concerto-no-21."
