- trang: du-lieu/tac-pham/mozart-concerto-21
  id: n12
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=-12&l=1"]
  ghi_chu: "Lời tựa NMA V/15/6, tr. XIII–XIV: Eingänge và Kadenzen của Mozart chỉ còn khi concerto được chuẩn bị để in hay cho người khác diễn; 'Beide Anlässe entfielen für die Werke des vorliegenden Bandes, so daß ihre Ergänzung den Interpreten zufiel' (KV 466, 467 trong tập này)."
