- trang: du-lieu/tac-pham/mozart-concerto-21
  id: n7
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=93&l=1", "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=103&l=1", "https://dme.mozarteum.at/DME/nma/scan.php?vsep=155&p1=133&l=1"]
  ghi_chu: "Xem bản nhạc NMA V/15/6: phần trình bày của piano, ô 109–121, piano một mình ở Sol thứ (Si giáng, Mi giáng, Fa thăng), rồi ô 122–127 về bậc át của Sol, chủ đề hai Sol trưởng; cuối chương có fermata ghi chú 'Kadenz' (tr. 135, khoảng ô 396), sau đó dàn nhạc kết (coda, ô 397–417). Mở đầu Allegro maestoso, kèn trumpet và timpani, kiểu hành khúc (BSO: 'festive, trumpet-and-drums')."
- trang: du-lieu/tac-pham/mozart-concerto-21
