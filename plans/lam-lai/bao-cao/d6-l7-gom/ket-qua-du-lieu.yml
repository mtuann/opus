  nguon: ["https://archive.org/details/chopinetudesforp00unse"]
  ghi_chu: "Ấn bản Schirmer (Friedheim, 1916), bài giới thiệu của Huneker: étude vừa là bài tập kỹ thuật vừa là tác phẩm ('Were ever Beauty and Duty mated so in double-harness?'); ghi chú của Friedheim cho số 3 gọi là 'Studies in Touch'."
- trang: du-lieu/tac-pham/chopin-etude
  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Etudes,_Op.10_(Chopin,_Frédéric)"]
  ghi_chu: "IMSLP: Op.10 số 3 Mi trưởng, số 12 Đô thứ."
- trang: du-lieu/tac-pham/chopin-etude
  id: n7
  luot_2: dung
  nguon: ["https://archive.org/details/chopinetudesforp00unse"]
  ghi_chu: "Đọc bản nhạc (Schirmer/Friedheim, tr. 12–14): Lento ma non troppo, Mi trưởng, giai điệu và đệm cùng ở tay phải; 'Poco più animato' với nốt kép; đoạn nốt kép chromatic quãng năm giảm và quãng bốn tăng (các hợp âm bảy giảm, ghi chú của Friedheim); 'con forza' rồi 'con bravura' quãng sáu hai tay; ritenuto, bè trầm giữ Si (bảy át) dẫn về chủ đề; chủ đề trở lại ngắn hơn. Ô 'gần đúng' nên chấp nhận."
- trang: du-lieu/tac-pham/chopin-etude
  id: n8
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O10/op-10-12-wfi/op-10-12-wfi.ly"]
  ghi_chu: "Mutopia (Peters/Scholtz): mở đầu hợp âm tay phải, tay trái chạy xuống; chủ đề Đô thứ quãng tám tay phải; ô 29–35 chuyển giọng; chủ đề trở lại; coda ô 75–79 'smorz.', 'sotto voce', kết ô 84 bằng hợp âm <c e g c> (Đô trưởng). Lưu ý: hai ô cuối bùng lên ff trước khi kết, nên 'lắng xuống' chỉ đúng cho phần đầu coda; hình ghi gần đúng nên chấp nhận."
