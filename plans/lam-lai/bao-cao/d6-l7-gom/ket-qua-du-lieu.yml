- trang: du-lieu/tac-pham/scarlatti-sonata
  id: n7
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/"]
  ghi_chu: "OMT: phần đầu mở có thể chuyển giọng; chất liệu (x) cuối phần đầu ở giọng khác; đầu phần hai không ổn định ('digression', 'departure'), kết phần hai ở giọng chính."
- trang: du-lieu/tac-pham/scarlatti-sonata
  id: n8
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/"]
  ghi_chu: "OMT, 'Balancing a Binary Form': chất liệu cuối phần đầu trở lại cuối phần hai, chuyển về giọng chính; 'there needs to be a crux point … a direct bar-for-bar mapping of measures between the tail ends of both reprises'; ví dụ Scarlatti K. 322. 'Gieo vần' là cách nói ẩn dụ, đặt trong ngoặc kép, hợp với nội dung này. Thuật ngữ crux gốc của Kirkpatrick: chưa mở sách của ông, nhưng câu không ghi tên ai."
- trang: du-lieu/tac-pham/scarlatti-sonata
  id: n9
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Scarlatti_Sonata_E_Major_K380.ogg", "https://imslp.org/wiki/Keyboard_Sonata_in_E_major,_K.380_(Scarlatti,_Domenico)"]
  ghi_chu: "Commons: tác giả Raymond Smullyan, {{cc-by-sa-2.0}}, chỉ có K. 380. IMSLP (cùng bản thu, Al Goldstein archive): 'Smullyan, Raymond = piano'. Không chơi dấu nhắc lại: tự phân tích bản thu (phổ theo nửa cung, so khớp theo độ trễ): các câu ngắn lặp trong bài khớp tới 0,98, còn không có đoạn 20 giây nào khớp với đoạn trước đó quá 0,76, nên nửa đầu (khoảng 75 giây) không được chơi lại; tổng 180 giây khớp với một lượt không nhắc."
