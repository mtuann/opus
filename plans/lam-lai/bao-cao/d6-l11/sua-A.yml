  ly_do: 'Bản in đầu tiên (Simrock 1886): BT 16–30 có nhiều đoạn f, ff nhưng cũng có đoạn pp (tr. 96, 99–100) và dim. trước chữ K; "dồn dập" không đúng cho cả đoạn. Trang nghe-nhac/brahms-4 đã sửa dòng 17–30 thành "các biến tấu mạnh mẽ xen vài đoạn lắng nhỏ". Ô hình chỉ cần giọng. Nếu người gom muốn giữ một chữ tả tính chất: "Mi thứ, mạnh mẽ".'
