- trang: nghe-nhac/grieg-buoi-sang
  id: n14
  cau: Sau đó Grieg chọn một số đoạn, soạn thành hai tổ khúc hòa nhạc (Op. 46 và Op. 55); Buổi sáng là bản mở đầu tổ khúc thứ nhất.
  loai: lich-su
  nguon:
    - ten: 'IMSLP, Peer Gynt Suite No.1, Op.46 (wikitext): "1. Morning Mood. Allegretto pastorale (E)"; "Selected by the composer from Peer Gynt, Op.23"; xuất bản 1888, Peters'
      link: https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)
    - ten: 'audite, Edvard Grieg: Complete Symphonic Works (WDR Sinfonieorchester Köln, Eivind Aadland), booklet PDF: "Morning Mood 4:04"; phối khí xong "27 July 1875"; "The première on 24 February 1876"; "the “Morning Mood” occurs not at a Norwegian fjord but on the coast of Morocco"; hai tổ khúc trích ra "Between 1888 and 1892"'
      link: https://media.audite.de/media/file/00/35/28/digibooklet-grieg-complete-symphonic-works.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "rút những đoạn hay nhất thành hai tổ khúc". Bỏ "hay nhất" (lời đánh giá). IMSLP: Op. 46 "Selected by the composer from Peer Gynt, Op.23"; audite: hai tổ khúc trích ra trong 1888–1892. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
- trang: nghe-nhac/ravel-bolero
  id: h3
  cau: "Hình bolero: crescendo lên tới ff."
  loai: cau-truc
  nguon:
    - ten: "Ravel, Boléro, tổng phổ, Durand & Cie, Paris, 1929 (Copyright 1929, D. & F. 11 839, đề tặng \"à Ida Rubinstein\"), bản quét IMSLP 104723 (cropped) trên Internet Archive, đọc ảnh 67 trang 06/11/2026. Trang danh mục nhạc cụ: \"2 Hautbois (le 2e prenant le Hautbois d'amour)\", \"Petite Clarinette en Mi♭\", \"3 Saxophones: (Sopranino en Fa, Soprano en Si♭, Ténor en Si♭)\", \"2 Tambours\", \"Célesta\". Tr. 1: \"Tempo di Bolero, moderato assai\", tambour pp, altos và violoncelles pizz. pp, sáo 1 \"Solo\" pp. Số tập 1 clarinet; 2 bassoon (âm vực cao); 3 \"Pte Cl.\"; 4 \"Hautb. d'amour Solo\"; 5 sáo 1 pp + trumpet \"Sord. Solo\" mp; 6 \"Sax. T.\" \"Solo mp espressivo, vibrato\"; 7 \"Sopranino Sax.\" rồi \"Sax. Soprano\"; 8 cor \"Solo\" mf, \"Ptes Fl.\" hai khuông (một khuông bốn dấu thăng, một khuông một dấu thăng) pp, célesta hai khuông p; 9 hautbois, hautbois d'amour, cor anglais, clarinettes; 10 \"1er Tromb. Solo mf sostenuto\"; 11 sáo, piccolo, oboe, cor anglais, clarinet, sax tenor; 12 trở đi violin cùng kèn gỗ; 17 trombone \"ff possibile\"; 18 các dấu thăng của Mi trưởng; trang cuối: tambour đổi hình ở hai ô cuối, ô cuối là một hợp âm rồi dấu lặng"
      link: https://archive.org/details/imslp-104723-pmlp-03667-ravel-bolero-cropped
    - ten: 'Gurminder K. Bhogal, "Orchestral Tissue, Subordinate Arabesques, and Turning Inward in Maurice Ravel’s Boléro", Music Theory Online 26.2 (2020): "Following the success of his ballet Boléro in 1928"; Ravel "described [it] as ‘an experiment in a very special and limited direction’ to Michel-Dimitri Calvocoressi"; "orchestral tissue without music"; "one long, very gradual crescendo. There are no contrasts, and there is practically no invention except the plan and the manner of the execution"; "the only element of variety is provided by the orchestral crescendo"; Rubinstein ban đầu nhờ Ravel phối Iberia "in providing the music for her ballet"; hai giai điệu luân phiên; "a decorative melody, which is given to the flute and played pianissimo"; "the high register of the bassoon"; "doubling the decorative melody between the flute and muted trumpet at Rehearsal 5"; "at Rehearsal 8 … pianissimo piccolos reinforce the third and fifth partials of the mezzo forte French horn, while the piano celesta reinforces partials 2 and 4"; "the effect of ‘an illusory instrument’"; "the shift to E major at Rehearsal 18"; "sopranino saxophone in F but this instrument has never been used in performance"'
      link: https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chủ lô sửa src/components/hinh/bolero.html: chữ cũ "fff", chữ mới "ff" (hình tĩnh có data-sinh, so-chu không so nên không có mục doi_chu; ghi ở đây theo AGENTS.md mục Hình tĩnh). Lượt 1: trong các trang tổng phổ đã đọc (tr. 53–66), dấu mạnh nhất thấy được là ff ("ff possibile" của trombone ở số tập 17, ff bộ gõ tr. 65); không thấy fff. Bhogal và trang (n9) chỉ nói tới fortissimo. Không sửa file hình (lời giao). Đề nghị người giao: chữ cũ "fff" → chữ mới "ff" trong src/components/hinh/bolero.html (và ghi doi_chu), nếu lượt 2 cũng không thấy fff. Review D6-L11-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu. src/components/hinh/bolero.html nay ghi "ff", không còn "fff".'
- trang: nghe-nhac/brahms-4
  id: n12
  cau: Từ chủ đề đó, Brahms viết 30 biến tấu và một coda.
  loai: cau-truc
  nguon:
    - ten: "Brahms, Vierte Symphonie (E moll) Op. 98, Partitur, N. Simrock, Berlin 1886 (bản in đầu tiên, số bản in 8686), bản số hóa của Brahms-Institut Lübeck (ABH 1.7.6.315a, CC0); đọc ảnh IIIF 06/11/2026: chương 4 tr. 77–113"
      link: https://www.brahms-portal.de/objekt/dc00008360/
    - ten: 'Brahms-Institut Lübeck, Brahms-Portal, Werkeinführung "Sinfonie Nr. 4 e-Moll" (đọc qua LIDO): Brahms dùng chuỗi hòa âm của Ciaccona trong hợp xướng kết "Meine Tage in den Leiden" của BWV 150 làm "achttaktiges melodisches Ostinato"; "Dort erklingt es gleich zu Beginn in den Flöten, Oboe 1 und Posaune 1, bevor es als Ostinato der Passacaglia … in mehr als 30 verschiedenen Iterationen den Sinfoniesatz fundiert"; ostinato đặt "als obere, mittlere oder untere Stimme"; chương 1–2 mùa hè 1884, chương 3–4 mùa hè 1885 ở Mürzzuschlag'
      link: https://www.brahms-portal.de/werk/dc00007469/
  ket_qua_luot_1: dung
  ghi_chu: 'Đếm trên bản in: chủ đề ô 1–8; biến tấu 12 (sáo, 3/2) bắt đầu ô 97 (khớp ghi chú của Henle cho ô 101–105 ở bè sáo); biến tấu 16 (3/4, Mi thứ) ô 129; chữ K ô 225 (BT 28), chữ L ô 241 (BT 30); ô 249–252 chậm lại (poco ritard.), Più Allegro (coda) ô 253. Vậy chủ đề + 30 lần × 8 ô = 248 ô, rồi coda. Nguồn chữ khác nhau về con số: Brahms-Institut "mehr als 30 Iterationen"; Burkhardt (1912) "32 Veränderungen" (có lẽ đếm cả phần coda). Giữ cách đếm 30 + coda theo bản nhạc.'
