  ghi_chu: "IMSLP: bản in đầu Berlin: N. Simrock, 1886. Henle HN 9856 có thật. Brahms-Portal (Brahms-Institut Lübeck) có 'Erstdruck der Partitur von der Sinfonie Nr. 4' số hóa và mục Werkeinführungen. Không mở riêng trang tờ chương trình buổi công diễn đầu."
