  ghi_chu: "antonin-dvorak.cz: 16.12.1893 công diễn 'in New York's Carnegie Hall, conducted by Anton Seidl'. BSO: 'Anton Seidl led the New York Philharmonic … December 16, 1893, at Carnegie Hall'."
