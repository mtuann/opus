  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)", "https://archive.org/details/13836-3001"]
  ghi_chu: "Tổng phổ Simrock: 'II. Largo', hóa biểu 5 giáng (Rê♭ trưởng). Các bản thu Naxos trên trang IMSLP: chương 2 dài 583–852 giây, phần lớn 11,5–14 phút; 'khoảng 11–13 phút' hợp lý."
- trang: nghe-nhac/dvorak-9-largo
  id: n7
  luot_2: dung
  nguon: ["https://www.antonin-dvorak.cz/en/life/important-dates-in-the-life-of-antonin-dvorak/", "https://www.clevelandorchestra.com/posts/dvoks-new-world-symphony"]
  ghi_chu: "antonin-dvorak.cz: 1.10.1892 được đón chính thức ở Nhạc viện New York (đã nhận lời làm giám đốc từ 1891). Cleveland Orchestra: 'arrived in New York City as the newly appointed director of the fledgling National Conservatory in September 1892'."
- trang: nghe-nhac/dvorak-9-largo
  id: n8
  luot_2: dung
  nguon: ["https://archive.org/details/harpersnew090various", "https://www.clevelandorchestra.com/posts/dvoks-new-world-symphony"]
  ghi_chu: "Bài 'Music in America' của Dvořák (Harper's New Monthly Magazine, 2/1895, tập 90 trên Internet Archive): 'inspiration for truly national music might be derived from the negro melodies or Indian chants'. Cleveland dẫn New York Herald 5/1893 về 'Negro melodies'."
- trang: nghe-nhac/dvorak-9-largo
  id: n9
  luot_2: dung
  nguon: ["https://www.kennedy-center.org/globalassets/nso/recordings/dvorak-copland-program-notes.pdf", "https://pages.stolaf.edu/americanmusic/2017/09/26/dvorak-and-the-spirit-of-indian-music/"]
  ghi_chu: "Ghi chú NSO (Kennedy Center): 'Harry Burleigh, who exposed Dvořák to a range of African-American spirituals'. Trang St. Olaf (dẫn New York Herald 15/12/1893): Dvořák 'studied Indian melodies that a friend gave to him'. Nguồn thứ hai là trang khóa học đại học dẫn báo gốc; nên thêm nguồn tốt hơn nếu có."
- trang: nghe-nhac/dvorak-9-largo
  id: n10
  luot_2: dung
  nguon: ["https://www.kennedy-center.org/globalassets/nso/recordings/dvorak-copland-program-notes.pdf", "https://www.clevelandorchestra.com/posts/dvoks-new-world-symphony"]
  ghi_chu: "NSO: ảnh hưởng nguồn Mỹ bản địa và Mỹ gốc Phi, 'the composer's characteristic Bohemian flavors also pervade this score'. Cleveland: 'Informed by African American spirituals, Indigenous melodies, and Czech folk songs'."
- trang: nghe-nhac/dvorak-9-largo
  id: n11
  luot_2: dung
  nguon: ["https://archive.org/details/13836-3001"]
  ghi_chu: "Tổng phổ: câu đầu của cor anglais chỉ dùng Rê♭–Mi♭–Fa–La♭ (thang ngũ cung Rê♭), giai điệu đơn giản kiểu bài hát."
- trang: nghe-nhac/dvorak-9-largo
  id: n13
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Goin%27_Home_(Fisher,_William_Arms)", "https://lantern.mediahist.org/catalog/PMR_1_8_0006", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/fisher-william-arms"]
  ghi_chu: "IMSLP: Goin' Home, William Arms Fisher, 1922 (Ditson), soạn từ Largo. Fisher (Phonograph Monthly Review 1927): 'my good fortune to study composition and orchestration with Dvorak for two years' ở Nhạc viện Quốc gia New York. Baker's (encyclopedia.com): 'When Dvořák went to N.Y. in 1892, Fisher became his pupil'."
