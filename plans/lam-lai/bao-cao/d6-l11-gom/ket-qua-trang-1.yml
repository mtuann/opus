  ghi_chu: "IMSLP: Op.95, B.178, E minor. Bản Simrock (Internet Archive): 'Aus der neuen Welt = Z nového světa : Symphonie no.5 [i.e. no.9] (E moll) … op95'."
- trang: nghe-nhac/dvorak-9-largo
  id: n3
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)", "https://www.antonin-dvorak.cz/en/life/important-dates-in-the-life-of-antonin-dvorak/"]
  ghi_chu: "IMSLP: 1893 (10/1 đến 24/5). Lịch antonin-dvorak.cz: Dvořák ở New York từ 9/1892, gia đình đến New York 31/5/1893, rồi mới đi Spillville; vậy bản nhạc viết ở New York."
- trang: nghe-nhac/dvorak-9-largo
