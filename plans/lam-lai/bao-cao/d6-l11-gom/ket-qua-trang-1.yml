  nguon: ["https://web.archive.org/web/20201127030246/https://www.universaledition.com/arvo-part-534/works/spiegel-im-spiegel-4916", "https://brahms.ircam.fr/en/works/work/30209", "https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/"]
  ghi_chu: "UE: 'Duration: 10’'; IRCAM: '10min'; ba bản trên Alina dài 10:36, 9:12, 9:48. Chấp nhận được, nhưng không nguồn nào nói 8 phút; nên viết 'khoảng 10 phút'."
- trang: nghe-nhac/part-spiegel
  id: n7
  luot_2: dung
  nguon: ["https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/"]
  ghi_chu: "ECM 1591, phát hành 15.10.1999. Track 1, 3, 5 là Spiegel im Spiegel: Spivakov và Bezrodny (violin, piano) hai bản, Schwalke và Malter (cello, piano) bản giữa."
- trang: nghe-nhac/part-spiegel
  id: n8
  luot_2: dung
  nguon: ["https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/", "https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/"]
  ghi_chu: "ECM: 'Spiegel im Spiegel [Mirror in the mirror]'. Interlude: 'mirror in the mirror' và 'mirrors in the mirror'."
- trang: nghe-nhac/part-spiegel
  id: n9
  luot_2: dung
  nguon: ["https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/"]
  ghi_chu: "ECM: 'whose title directly reflects its construction, with each ascending melodic line followed by a descending mirror phrase'."
- trang: nghe-nhac/part-spiegel
  id: n10
  luot_2: dung
  nguon: ["https://www.arvopart.ee/en/arvo-parts-tintinnabuli-style-at-50/", "https://www.arvopart.ee/en/arvo-part-the-new-strict-style-of-tintinnabuli/"]
  ghi_chu: "Trung tâm Arvo Pärt: 7/2/1976 Pärt viết Für Alina, ngôn ngữ 'later named tintinnabuli' xuất hiện lần đầu. Bài Tokun: 'In 1976, Pärt invented his unique style and technique – tintinnabuli'."
- trang: nghe-nhac/part-spiegel
  id: n11
  luot_2: dung
  nguon: ["https://anastrophe.uchicago.edu/logeion-api/detail?w=tintinnabulum&type=normal", "https://www.arvopart.ee/en/arvo-part-the-new-strict-style-of-tintinnabuli/"]
  ghi_chu: "Lewis & Short (Logeion): tintinnabulum 'a bell, signal-bell'; Georges: 'Klingel, Schelle'. Trung tâm Arvo Pärt: 'tintinnabuli (Latin for ‘little bells’)'."
- trang: nghe-nhac/part-spiegel
  id: n12
  luot_2: dung
  nguon: ["https://www.arvopart.ee/en/arvo-part/article/formal-algorithms-of-tintinnabuli-in-arvo-parts-music/", "https://arxiv.org/html/2603.26989v1"]
  ghi_chu: "Tokun 2011 (lượt 1 cũng dùng): hai bè nối theo luật đối âm chặt, 'mostly scalar melodic voice', tên M-voice/T-voice. arXiv: 'melodic voice (m-voice) that mostly moves stepwise'."
- trang: nghe-nhac/part-spiegel
  id: n13
  luot_2: dung
  nguon: ["https://arxiv.org/html/2603.26989v1", "https://www.arvopart.ee/en/arvo-part/article/formal-algorithms-of-tintinnabuli-in-arvo-parts-music/", "https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/"]
  ghi_chu: "arXiv: t-voice chỉ dùng nốt của hợp âm ba chủ. Tokun: 'built up on the three pitches of a central triad'. Interlude: 'bell-like (“tintinnabular”)'."
- trang: nghe-nhac/part-spiegel
  id: n14
  luot_2: dung
  nguon: ["https://www.researchcatalogue.net/view/3795800/3796304", "https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/", "https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/"]
  ghi_chu: "Kiral: bè T 'outlines the F major triad'; FAZ trên trang ECM: 'F-Dur-Quartsextakkord'; Interlude: giọng Fa trưởng. Hợp âm ba chủ Fa–La–Đô."
- trang: nghe-nhac/part-spiegel
  id: n15
  luot_2: dung
  nguon: ["https://www.researchcatalogue.net/view/3795800/3796304", "https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/"]
  ghi_chu: "Kiral (luận văn, nguồn phụ): 'It only consists of the melody of the solo instrument and the three-note piano accompaniment'. FAZ trên trang ECM: 'Schlichtheit… die Dreiklangs-Arpeggien, dazu der liegende Klang der Violine'."
- trang: nghe-nhac/part-spiegel
  id: n17
  luot_2: dung
  nguon: ["https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/", "https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/"]
  ghi_chu: "Interlude: 'rising crotchet second-inversion broken chords in the right hand of the piano… endlessly repeated'. FAZ: 'nach oben gebrochene Dreiklänge'. Không nguồn nào nói thẳng piano vào trước một mình."
- trang: nghe-nhac/part-spiegel
  id: n18
  luot_2: dung
  nguon: ["https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/", "https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/"]
  ghi_chu: "Interlude: 'beginning with a G-A two-note scale, which alternately ascends then descends to A'. FAZ: 'Die erste Bewegung geht von einer Sekunde aus', nốt trung tâm A."
- trang: nghe-nhac/part-spiegel
  id: n19
  luot_2: dung
  nguon: ["https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/", "https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/"]
  ghi_chu: "Interlude: 'With each subsequent ascent and descent, a note is added', luôn trở về A. ECM: mỗi câu đi lên nối bằng câu soi gương đi xuống."
- trang: nghe-nhac/part-spiegel
  id: n20
  luot_2: dung
  nguon: ["https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/", "https://www.researchcatalogue.net/view/3795800/3796304"]
  ghi_chu: "Interlude: piano có 'high, bell-like (“tintinnabular”) recurring sounds in the upper registers' và 'low, sustained Fs in the bass'. Chi tiết 'lần lượt' không có nguồn nói thẳng."
- trang: nghe-nhac/part-spiegel
  id: n21
  luot_2: dung
  nguon: ["https://ecmrecords.com/product/arvo-part-alina-vladimir-spivakov-sergej-bezrodny-dietmar-schwalke-alexander-malter/", "https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/"]
  ghi_chu: "FAZ: câu dài dần từ quãng hai tới quãng chín, 'Da ist der Weg zu Ende'. Interlude: giai điệu luôn trở về A."
- trang: nghe-nhac/part-spiegel
  id: n23
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV846/wtk1-prelude1/wtk1-prelude1.ly", "https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/"]
  ghi_chu: "Mutopia BWV 846: mỗi ô một hình hợp âm rải chơi hai lần, suốt bài. Spiegel: hợp âm rải lặp lại (Interlude)."
- trang: nghe-nhac/part-spiegel
  id: n27
  luot_2: dung
  nguon: ["https://www.arvopart.ee/en/biography/pikk-elulugu/", "https://www.arvopart.ee/en/arvo-part/article/formal-algorithms-of-tintinnabuli-in-arvo-parts-music/", "https://web.archive.org/web/20201127030246/https://www.universaledition.com/arvo-part-534/works/spiegel-im-spiegel-4916", "https://brahms.ircam.fr/en/works/work/30209", "https://id.loc.gov/authorities/names/n00063915.json", "https://musicbrainz.org/ws/2/work/?query=work:%22Spiegel%20im%20Spiegel%22%20AND%20artist:P%C3%A4rt&fmt=json&limit=3"]
  ghi_chu: "Các nguồn có thật: tiểu sử Trung tâm Arvo Pärt; bài Tokun 2011; UE bán bản nhạc (UE 13360), IRCAM ghi nhà xuất bản Universal Edition; bản ghi LoC n00063915 dẫn 'MGG online'; MusicBrainz có bản ghi tác phẩm. Riêng trang tác phẩm của Trung tâm Arvo Pärt không tìm lại được URL hiện hành."
