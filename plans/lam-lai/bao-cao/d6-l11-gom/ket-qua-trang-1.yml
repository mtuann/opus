  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)"]
  ghi_chu: "IMSLP: chương 4 'Allegro energico e passionato'. Các bản thu Naxos liệt kê trên trang IMSLP dài 556–654 giây (khoảng 9–11 phút), khớp 'khoảng 10 phút'."
- trang: nghe-nhac/brahms-4
  id: n7
  luot_2: dung
  nguon: ["https://josephjoachim.com/2014/01/05/moritz-hauptmann-j-o-och-im-canon/", "https://bach-cantatas.com/Arran/OT-Brahms.htm", "https://www.bso.org/works/brahms-symphony-no-4"]
  ghi_chu: "Trang Joseph Joachim (dẫn Ellinwood): Brahms và Joachim trao đổi bài tập đối âm từ thư 26/2/1856. Bach-cantatas: Brahms 'has recourse to elements of more ancient music', dùng chủ đề Bach; BSO: Brahms lấy Chaconne của Bach làm mẫu."
- trang: nghe-nhac/brahms-4
  id: n8
  luot_2: dung
  nguon: ["https://americansymphony.org/concert-notes/symphony-no-4-in-e-minor-op-98/", "https://www.bso.org/works/brahms-symphony-no-4"]
  ghi_chu: "Câu đánh giá. ASO: chưa nhà soạn nhạc nào trước Brahms hồi sinh hình thức cổ này trong giao hưởng; BSO: chương cuối là chaconne trên chủ đề Bach. Phù hợp với cách nói 'ví dụ nổi tiếng nhất'."
- trang: nghe-nhac/brahms-4
  id: n9
  luot_2: dung
  nguon: ["https://www.bso.org/works/brahms-symphony-no-4", "https://americansymphony.org/concert-notes/symphony-no-4-in-e-minor-op-98/", "https://bach-cantatas.com/Arran/OT-Brahms.htm"]
  ghi_chu: "BSO: chaconne 'a work consisting of variations over a repeated bass pattern'; ASO: passacaglia, chủ đề luôn hiện diện (ostinato) trong kết cấu. Bach-cantatas: 'An eight-bar theme'. Bản in đầu (Brahms-Portal, tr. 77) đếm được 8 ô chủ đề."
- trang: nghe-nhac/brahms-4
  id: n11
  luot_2: dung
  nguon: ["https://bach-cantatas.com/Arran/OT-Brahms.htm", "https://imslp.org/wiki/Nach_dir,_Herr,_verlanget_mich,_BWV_150_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Bach-cantatas: chủ đề 8 ô Brahms mượn, có sửa nhẹ, từ chương kết cantata BWV 150, 'a ciaccona with the text Meine Tage in dem Leide'. IMSLP BWV 150: chương 7 'Chorale (ciaccona): Meine Tage in dem Leide'."
- trang: nghe-nhac/brahms-4
  id: n12
  luot_2: dung
  nguon: ["https://bach-cantatas.com/Arran/OT-Brahms.htm", "https://www.bso.org/works/brahms-symphony-no-4", "https://americansymphony.org/concert-notes/symphony-no-4-in-e-minor-op-98/"]
  ghi_chu: "Bach-cantatas: '30 many-layered variations and a concluding coda'; BSO, ASO: 30 biến tấu. Điểm lượt 1 nêu chưa chắc: vài ghi chú chương trình phổ thông ghi 32 hay 34, nhưng ba nguồn trên và bản nhạc (8 ô × 30 sau chủ đề, rồi 4 ô chuyển và Più Allegro; bản soạn 4 tay Peters trên Internet Archive) cùng cho 30 biến tấu và coda."
- trang: nghe-nhac/brahms-4
  id: n13
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-no4-op98-brahms-johannes", "https://www.brahms-portal.de/objekt/dc00008360/78/"]
  ghi_chu: "Bản 4 tay Peters: các mốc chữ (K, M, N, O, R) rơi đúng nhịp 8 ô; biến tấu 12–15 (3/2) vẫn mỗi biến tấu 8 ô; sau biến tấu 30 (chữ R) có 4 ô poco ritard. chuyển sang coda, không thuộc biến tấu nào."
- trang: nghe-nhac/brahms-4
  id: n14
  luot_2: dung
  nguon: ["https://www.brahms-portal.de/objekt/dc00008360/78/"]
  ghi_chu: "Bản in đầu Simrock (tr. 77): 8 ô chủ đề do sáo, oboe, clarinet, bassoon, contrabassoon, horn, trumpet, trombone chơi, ghi f; violin, viola, cello, bass nghỉ. Lưu ý: bản soạn 4 tay Peters ghi ff, nhưng tổng phổ gốc ghi f, đúng như câu."
- trang: nghe-nhac/brahms-4
  id: n15
  luot_2: dung
  nguon: ["https://www.brahms-portal.de/objekt/dc00008360/78/", "https://www.bso.org/works/brahms-symphony-no-4"]
  ghi_chu: "BSO: 'the trombones in the fourth movement only'. Bản in đầu: dòng Posaunen vào ngay ô 1 chương 4 (chủ đề)."
- trang: nghe-nhac/brahms-4
  id: n16
  luot_2: dung
  nguon: ["https://www.brahms-portal.de/objekt/dc00008361/13/", "https://www.brahms-portal.de/objekt/dc00008360/79/", "https://archive.org/details/imslp-no4-op98-brahms-johannes"]
  ghi_chu: "Phần Violine I bản in đầu: 8 ô nghỉ rồi 'pizz.' f ở biến tấu 1; tổng phổ tr. 78: biến tấu 2 kèn gỗ hát giai điệu mới mp, biến tấu 3 (chữ A) 'f ben marc.', đàn dây chuyển arco."
- trang: nghe-nhac/brahms-4
  id: n17
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-no4-op98-brahms-johannes", "https://www.brahms-portal.de/objekt/dc00008360/88/"]
  ghi_chu: "Bản 4 tay (có ghi 'Str. Instr.'): từ biến tấu 4 đàn dây dẫn, nhiều đoạn chạy nốt nhanh, f marcato; tổng phổ tr. 87: biến tấu 11 'p molto dolce', 'pp', dim., nhạc lắng xuống."
- trang: nghe-nhac/brahms-4
  id: n18
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-no4-op98-brahms-johannes", "https://www.brahms-portal.de/objekt/dc00008360/90/"]
  ghi_chu: "Bản 4 tay: nhịp 3/2 với ghi chú (nốt trắng = nốt đen cũ), sáo 'p espressivo'; nốt viết dài gấp đôi nên nghe chậm lại."
- trang: nghe-nhac/brahms-4
  id: n19
  luot_2: dung
  nguon: ["https://www.brahms-portal.de/objekt/dc00008360/90/", "https://www.brahms-portal.de/objekt/dc00008360/91/", "https://www.brahms-portal.de/objekt/dc00008360/92/"]
  ghi_chu: "Tổng phổ tr. 89–91: biến tấu 13 chuyển Mi trưởng (4 thăng), kèn gỗ 'espress.', 'dolce'; biến tấu 14–15 (chữ E) trombone, bassoon rồi horn chơi hợp âm pp, ppp."
- trang: nghe-nhac/brahms-4
  id: n20
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-no4-op98-brahms-johannes"]
  ghi_chu: "Bản 4 tay: 'Tempo I', 3/4, hóa biểu trở về một thăng (Mi thứ); phần kèn mở đầu, đàn dây vào 'ff' sau 3 ô."
- trang: nghe-nhac/brahms-4
  id: n21
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-no4-op98-brahms-johannes"]
  ghi_chu: "Bản 4 tay: các biến tấu 17–30 phần lớn f/ff, xen vài đoạn p/dolce; sau biến tấu 30 (chữ R) có 4 ô 'poco ritard.' trước Più Allegro."
- trang: nghe-nhac/brahms-4
  id: n22
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-no4-op98-brahms-johannes", "https://bach-cantatas.com/Arran/OT-Brahms.htm"]
  ghi_chu: "Bản 4 tay: 'Più Allegro'; kết ở Mi thứ. Bach-cantatas: 'a concluding coda'. (Ghi chú của LA Phil nói 'no coda' theo nghĩa khác; phần lớn nguồn gọi đoạn Più Allegro là coda.)"
- trang: nghe-nhac/brahms-4
  id: n24
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-no4-op98-brahms-johannes", "https://www.hollywoodbowl.com/musicdb/pieces/3983/symphony-no-4-in-e-minor-op-98"]
  ghi_chu: "Bản nhạc: biến tấu 12 sáo độc tấu p espressivo, 13–15 Mi trưởng, dolce/pp. LA Phil/Hollywood Bowl: đoạn trữ tình lắng hơn ở giữa, có sáo độc tấu nổi bật."
- trang: nghe-nhac/brahms-4
  id: n25
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)", "https://www.bso.org/works/mendelssohn-violin-concerto", "https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)"]
  ghi_chu: "IMSLP: Beethoven 5 chương 1 Đô thứ, chương 4 Đô trưởng. BSO: Concerto violin Mendelssohn (Mi thứ) chuyển 'back to E, this time in major, for the finale'. Brahms 4 Mi thứ, kết Mi thứ (bản nhạc)."
- trang: nghe-nhac/brahms-4
