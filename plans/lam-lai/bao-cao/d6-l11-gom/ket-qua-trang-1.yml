  luot_2: sai
  nguon: ["https://www.ibsen.uio.no/DRVIT_PG%7CPGht.xhtml", "https://www.hollywoodbowl.com/musicdb/pieces/2684/peer-gynt-suite-no-1-op-46"]
  cau_dung: "Màn 4 không diễn ra ở Na Uy mà ở Bắc Phi: bờ biển Ma-rốc, sa mạc Sahara, rồi Ai Cập."
  ghi_chu: "Văn bản Ibsen: màn 4 ở bờ biển Ma-rốc, trại quân Ma-rốc 'paa Grænsen mod Ørken', sa mạc, ốc đảo; Sahara được nhắc tên; nhưng các cảnh cuối màn 4 ở Ai Cập (Memnon, Sphinx ở Gizeh, nhà thương điên ở Cairo). Câu viết như thể cả màn chỉ ở Ma-rốc và Sahara. Ý chính (không ở Na Uy, mà ở Bắc Phi) đúng."
- trang: nghe-nhac/grieg-buoi-sang
  id: n19
  luot_2: dung
  nguon: ["https://www.ibsen.uio.no/DRVIT_PG%7CPGht.xhtml"]
  ghi_chu: "Văn bản Ibsen: các bạn đồng hành chiếm du thuyền ('Jeg annekterer Yachten!') bỏ Peer lại; cảnh sau: 'Daggry … Peer Gynt i Træet med en afbrukken Gren i Haanden holder sig en Sværm Abekatte fra Livet'."
- trang: nghe-nhac/grieg-buoi-sang
  id: n20
  luot_2: dung
  nguon: ["https://www.nb.no/items/URN:NBN:no-nb_digibok_2012032138022", "https://www.ibsen.uio.no/DRVIT_PG%7CPGht.xhtml"]
  ghi_chu: "Lời bình hiệu đính GGA tập 18 (tr. 312, phần 13 Morning Mood): ở buổi công diễn 1876, bốn cảnh đầu màn 4 bị bỏ nên cảnh 5 'Early Morning' mở màn; Morning Mood được viết làm khúc dạo cho cảnh này. Văn bản Ibsen, cảnh ấy: 'Tidlig Morgen. Stenet Egn med Udsigt ind over Ørken'. Lưu ý: đây là lời bình trong ấn bản tổng phổ phê bình, không phải ghi chú của Grieg trên bản nhạc."
- trang: nghe-nhac/grieg-buoi-sang
  id: n21
  luot_2: khong-chac
  nguon: []
