  ghi_chu: "BSO: 'Brahms conducted the first orchestral performance on October 25, 1885, at Meiningen'. Hollywood Bowl/LA Phil: 'He himself conducted the premiere (in October 1885) with the Meiningen Court Orchestra'. IMSLP: 1885-10-25 Meiningen. Điểm lượt 1 nêu chưa chắc (người chỉ huy) được hai nguồn xác nhận là Brahms."
