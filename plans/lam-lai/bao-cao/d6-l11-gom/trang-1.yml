- trang: nghe-nhac/brahms-4
  id: n1
  cau: 'Bảng: Johannes Brahms (1833–1897).'
  loai: nam
- trang: nghe-nhac/brahms-4
  id: n2
  cau: 'Bảng: Tên đầy đủ: Giao hưởng số 4 cung Mi thứ, Op. 98.'
  loai: danh-muc
- trang: nghe-nhac/brahms-4
  id: n3
  cau: 'Bảng: Sáng tác 1884–1885.'
  loai: nam
- trang: nghe-nhac/brahms-4
  id: n4
  cau: 'Bảng: Công diễn tháng 10/1885 tại Meiningen, Brahms chỉ huy.'
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n5
  cau: 'Bảng: Thời kỳ Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n6
  cau: 'Bảng: Chương 4 là Allegro energico e passionato, dài khoảng 10 phút.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n7
  cau: 'Brahms là nhà soạn nhạc Lãng mạn quan tâm sâu tới âm nhạc quá khứ: ông học đối âm
    và nghiên cứu nhạc Bach.'
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n8
  cau: Chương cuối Giao hưởng số 4 là ví dụ nổi tiếng nhất cho mối quan tâm ấy.
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n9
  cau: Passacaglia (hay chaconne) là hình thức Baroque gồm một chủ đề ngắn lặp lại liên tục,
    với biến tấu mới ở mỗi lần; ở đây chủ đề dài 8 ô nhịp.
  loai: dinh-nghia
- trang: nghe-nhac/brahms-4
  id: n11
  cau: Chủ đề 8 ô nhịp được Brahms phỏng theo chaconne ở hợp xướng kết thúc cantata BWV 150
    của Bach.
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n12
  cau: Từ chủ đề đó, Brahms viết 30 biến tấu và một coda.
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n13
  cau: Mỗi biến tấu dài đúng 8 ô nhịp.
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n14
  cau: 'Theo dõi, Chủ đề: kèn gỗ và kèn đồng chơi 8 hợp âm, to (forte); đàn dây nghỉ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n15
  cau: Trombone lần đầu tiên xuất hiện trong bản giao hưởng ở chủ đề chương 4.
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n16
  cau: 'Theo dõi, biến tấu 1–3: đàn dây vào bằng những nốt gảy (pizzicato); kèn gỗ hát một
    giai điệu mới, nhẹ; biến tấu 3 mạnh, nhấn rõ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n17
  cau: 'Theo dõi, biến tấu 4–11: đàn dây dẫn dắt, nhiều đoạn chạy nốt nhanh, kịch tính; tới
    biến tấu 11 nhạc lắng xuống.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n18
  cau: 'Theo dõi, biến tấu 12: sáo độc tấu (espressivo), nhịp 3/2: trường độ nốt dài gấp đôi
    nên nhạc nghe chậm lại.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n19
  cau: 'Theo dõi, biến tấu 13–15: chuyển sang Mi trưởng; kèn gỗ hát dịu dàng, rồi trombone
    cùng bassoon và horn chơi những hợp âm trang nghiêm, rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n20
  cau: 'Theo dõi, biến tấu 16: chủ đề trở lại ở Mi thứ, nhịp 3/4, kèn chơi to (forte, rồi
    fortissimo khi đàn dây vào), như bắt đầu lại từ đầu.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n21
  cau: 'Theo dõi, biến tấu 17–30: các biến tấu mạnh mẽ xen vài đoạn lắng nhỏ; sau biến tấu
    30 nhạc chậm lại một chút.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n22
  cau: 'Theo dõi, Coda: nhanh hơn (Più Allegro), cao trào cuối cùng, kết thúc ở Mi thứ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n24
  cau: 'Câu hỏi: biến tấu 12 (sáo) và 13–15 (giọng trưởng) tạo một khoảng lặng giữa chương.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n25
  cau: 'Câu hỏi: Beethoven 5 và Concerto violin của Mendelssohn đi "từ tối ra sáng" (giọng
    thứ sang giọng trưởng), còn Brahms 4 kết ở giọng thứ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n27
  cau: 'Mục Nguồn: bản in đầu tiên (Simrock 1886) do Brahms-Institut Lübeck số hóa, IMSLP,
    lời tựa Henle HN 9856, giới thiệu tác phẩm và tờ chương trình buổi công diễn đầu trên
    Brahms-Portal.'
  loai: ten
- trang: nghe-nhac/brahms-4
  id: n23
  cau: 'Câu hỏi: thử đếm số ô nhịp của chủ đề (8) và nhận ra mỗi khi một biến tấu mới bắt
    đầu.'
  loai: khuyen-tap
- trang: nghe-nhac/dvorak-9-largo
  id: n1
  cau: 'Bảng: Antonín Dvořák (1841–1904).'
  loai: nam
- trang: nghe-nhac/dvorak-9-largo
  id: n2
  cau: 'Bảng: Tên đầy đủ: Giao hưởng số 9 cung Mi thứ, Op. 95 "Từ Thế giới mới".'
  loai: danh-muc
- trang: nghe-nhac/dvorak-9-largo
  id: n3
  cau: 'Bảng: Sáng tác năm 1893, tại New York.'
  loai: nam
- trang: nghe-nhac/dvorak-9-largo
  id: n4
  cau: 'Bảng: Công diễn ngày 16/12/1893 tại Carnegie Hall, New York Philharmonic.'
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n5
  cau: 'Bảng: Thời kỳ Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n6
  cau: 'Bảng: Chương 2 là Largo, Rê♭ trưởng, dài khoảng 11–13 phút.'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n7
  cau: Năm 1892, Dvořák sang Mỹ làm giám đốc Nhạc viện Quốc gia ở New York.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n8
  cau: Dvořák tin rằng nước Mỹ nên tìm "giọng nói âm nhạc" của mình từ spiritual của người
    Mỹ gốc Phi và âm nhạc của người bản địa.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n9
  cau: Dvořák nghe spiritual qua ca sĩ Harry T. Burleigh và tìm hiểu một số giai điệu của
    người bản địa.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n10
  cau: Trong Giao hưởng số 9, những nét nhạc gợi chất Mỹ đan xen với nét nhạc Séc quen thuộc
    của Dvořák.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n11
  cau: Giai điệu chính của chương 2 mang đậm nét ngũ cung, giản dị như một bài hát.
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n13
  cau: Năm 1922, William Arms Fisher, một học trò cũ của Dvořák ở Mỹ, đặt lời cho giai điệu
    này thành ca khúc Goin' Home.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n14
  cau: 'Theo dõi, Mở đầu: kèn gỗ và kèn đồng chơi chuỗi hợp âm chậm, bắt đầu rất nhỏ rồi to
    dần, mở bằng hợp âm Mi trưởng (nối với giọng Mi của chương 1) và dừng ở Rê♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n15
  cau: 'Theo dõi, Chủ đề chính: cor anglais hát giai điệu ngũ cung nổi tiếng trên nền đàn
    dây chơi rất nhỏ, có lắp hộp tắt tiếng (con sordino).'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n16
  cau: Cor anglais là kèn oboe trầm.
  loai: dinh-nghia
- trang: nghe-nhac/dvorak-9-largo
  id: n17
  cau: 'Theo dõi, Đoạn giữa: chuyển sang Đô♯ thứ, nhanh hơn một chút; sáo và oboe hát một
    giai điệu mới buồn hơn; sau đó clarinet hát trên những nốt contrabass gảy đều đều như
    bước chân.'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n18
  cau: 'Theo dõi, Đoạn tươi sáng: chuyển sang Đô♯ trưởng, kèn gỗ láy (trill) líu lo như tiếng
    chim; cao trào ngắn, kèn đồng chơi to, chủ đề của chương 2 và các chủ đề của chương 1
    cùng vang lên.'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n19
  cau: 'Theo dõi, Trở lại: cor anglais hát lại chủ đề chính, ngắt quãng; đàn dây chỉ còn vài
    người chơi, có chỗ độc tấu, tiếp lời.'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n20
  cau: 'Theo dõi, Kết: chuỗi hợp âm mở đầu quay lại, contrabass ngân hợp âm cuối thật nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n22
  cau: 'Câu hỏi: câu đầu của chủ đề chính chỉ dùng vài nốt của gam ngũ cung, không có quãng
    nửa cung nào.'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n23
  cau: 'Câu hỏi: một chủ đề của chương 2 xuất hiện lại ở cuối giao hưởng (chương 4).'
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n25
  cau: 'Mục Nguồn: tổng phổ Simrock trên Internet Archive, IMSLP, trang tác phẩm và tiểu sử
    trên antonin-dvorak.cz.'
  loai: ten
- trang: nghe-nhac/grieg-buoi-sang
  id: n1
  cau: 'Bảng: Edvard Grieg (1843–1907).'
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n2
  cau: 'Bảng: Tác phẩm: nhạc sân khấu Peer Gynt, Op. 23 (Morgenstemning).'
  loai: danh-muc
- trang: nghe-nhac/grieg-buoi-sang
  id: n3
  cau: 'Bảng: Sáng tác 1874–1875.'
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n4
  cau: 'Bảng: Công diễn cùng vở kịch ngày 24/2/1876 tại Christiania (nay là Oslo).'
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n5
  cau: 'Bảng: Buổi sáng mở đầu Peer Gynt Suite số 1, Op. 46.'
  loai: danh-muc
- trang: nghe-nhac/grieg-buoi-sang
  id: n6
  cau: 'Bảng: Thời kỳ Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n7
  cau: 'Bảng: Mi trưởng, nhịp 6/8.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n8
  cau: 'Bảng: Độ dài khoảng 4 phút.'
  loai: so-lieu
- trang: nghe-nhac/grieg-buoi-sang
  id: n9
  cau: 'Bảng: Bản thu gợi ý: Neeme Järvi và Gothenburg Symphony Orchestra.'
  loai: ten
- trang: nghe-nhac/grieg-buoi-sang
  id: n10
  cau: Edvard Grieg là nhà soạn nhạc nổi tiếng nhất của Na Uy.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n11
  cau: Grieg cùng thời với Tchaikovsky và Brahms.
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n12
  cau: Grieg viết Peer Gynt theo lời mời của Henrik Ibsen, người cần nhạc cho vở kịch thơ
    cùng tên.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n13
  cau: Grieg sáng tác trong hai năm 1874–1875, và vở diễn ra mắt năm 1876.
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n14
  cau: Sau đó Grieg chọn một số đoạn, soạn thành hai tổ khúc hòa nhạc (Op. 46 và Op. 55);
    Buổi sáng là bản mở đầu tổ khúc thứ nhất.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n16
  cau: Peer Gynt kể chuyện một chàng trai Na Uy phiêu lưu khắp thế giới, từ quê nhà đến tận
    Bắc Phi.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n17
  cau: Buổi sáng là khúc dạo đầu của màn 4.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n18
  cau: Màn 4 không diễn ra ở Na Uy mà ở Ma-rốc và sa mạc Sahara.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n19
  cau: Ở đầu màn 4, Peer bị bạn đồng hành cướp mất du thuyền, bỏ lại một mình trên bờ biển;
    rạng sáng hôm sau anh ngồi trên cây, cầm cành gãy đuổi lũ khỉ.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n20
  cau: 'Ghi chú trong tổng phổ cho biết bản nhạc lúc đầu được viết để mở cảnh "Sáng sớm" của
    màn 4: một vùng núi đá nhìn ra sa mạc.'
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n21
  cau: '(Đã bỏ) Gần như ai nghe cũng tưởng đây là buổi sáng ở một vùng quê Na Uy: mặt hồ phẳng
    lặng, sương tan trên rừng thông.'
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n22
  cau: Câu giai điệu mở đầu chỉ dùng các nốt của gam ngũ cung.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n23
  cau: 'Grieg ghi tốc độ Allegretto pastorale: hơi nhanh, kiểu đồng quê.'
  loai: dinh-nghia
- trang: nghe-nhac/grieg-buoi-sang
  id: n25
  cau: Giai điệu được sáo và oboe chuyền tay nhau lúc mở đầu.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n26
  cau: Lần đầu cả dàn nhạc chơi to (forte) đến khá sớm, ngay ở phần đầu bản nhạc.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n27
  cau: 'Sơ đồ, Mở đầu: sáo độc tấu giai điệu ngũ cung, nhỏ; oboe đáp lại.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n28
  cau: 'Sơ đồ, Dâng lên: giai điệu lan khắp dàn nhạc, to dần từng bậc.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n29
  cau: 'Sơ đồ, Cao trào: cả dàn nhạc chơi to (forte, rồi fortissimo), giai điệu ở đàn dây;
    rồi lắng xuống.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n30
  cau: 'Sơ đồ, Đoạn giữa: tương phản, đàn dây chạy nốt nhanh, nhiều lần to lên rồi lắng; cuối
    đoạn kèn horn độc tấu giai điệu.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n31
  cau: 'Sơ đồ, Trở lại và kết: giai điệu mở đầu quay về, êm dần, kết thúc lặng lẽ.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n32
  cau: 'Theo dõi 1: mở đầu, sáo độc tấu giai điệu, nhỏ (piano), trên nền clarinet và bassoon
    ngân.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n33
  cau: 'Theo dõi 2: oboe đáp lại bằng cùng giai điệu ở cao độ khác — hai nhạc cụ gỗ "trò chuyện"
    với nhau.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n34
  cau: 'Theo dõi 3: thêm nhạc cụ tham gia, giai điệu lan rộng, âm lượng tăng dần từng bậc.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n35
  cau: 'Theo dõi 4: cả dàn nhạc chơi to (forte, rồi fortissimo), giai điệu ở đàn dây; rồi
    lắng xuống khá nhanh.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n36
  cau: 'Theo dõi 5: đoạn giữa, đàn dây chạy nốt nhanh, nhiều lần to lên rồi lắng; cuối đoạn
    kèn horn độc tấu giai điệu.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n37
  cau: 'Theo dõi 6: giai điệu mở đầu trở lại ở cello, êm dần; sáo láy (trill) líu lo.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n38
  cau: 'Theo dõi 7: kết, chậm dần, các hợp âm cuối thật nhỏ, lắng vào im lặng.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n44
  cau: 'Mục Nguồn: tổng phổ màn 4 của Thư viện Quốc gia Na Uy, IMSLP, bản dịch Archer của
    vở kịch, COD (mục Grieg), Store norske leksikon.'
  loai: ten
- trang: nghe-nhac/grieg-buoi-sang
  id: n39
  cau: 'Câu hỏi: giai điệu chỉ dùng 5 nốt (ngũ cung) nghe khác gì so với những giai điệu 7
    nốt quen thuộc?'
  loai: khuyen-tap
- trang: nghe-nhac/grieg-buoi-sang
  id: n40
  cau: 'Câu hỏi: lần đầu cả dàn nhạc chơi to đến khá sớm — cảm giác của bạn thế nào?'
  loai: khuyen-tap
- trang: nghe-nhac/grieg-buoi-sang
  id: n41
  cau: 'Câu hỏi: thử đếm xem sáo và oboe "chuyền" giai điệu cho nhau mấy lần ở đoạn mở đầu.'
  loai: khuyen-tap
- trang: nghe-nhac/part-spiegel
  id: n1
  cau: 'Bảng: Arvo Pärt sinh năm 1935, người Estonia.'
  loai: nam
- trang: nghe-nhac/part-spiegel
  id: n2
  cau: 'Bảng: sáng tác năm 1978, ban đầu cho violin và piano.'
  loai: nam
- trang: nghe-nhac/part-spiegel
  id: n3
  cau: 'Bảng: có nhiều phiên bản cho cello, viola và nhạc cụ khác.'
  loai: lich-su
- trang: nghe-nhac/part-spiegel
  id: n4
  cau: 'Bảng: thời kỳ Đương đại.'
  loai: lich-su
- trang: nghe-nhac/part-spiegel
  id: n5
  cau: 'Bảng: giọng Fa trưởng.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n6
  cau: 'Bảng: độ dài khoảng 8–10 phút.'
  loai: so-lieu
- trang: nghe-nhac/part-spiegel
  id: n7
  cau: 'Bảng, bản thu gợi ý: album Alina (ECM New Series 1591, 1999), có ba bản Spiegel im
    Spiegel: hai bản violin và piano, một bản cello và piano.'
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n8
  cau: Tên tác phẩm nghĩa là "Gương trong gương".
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n9
  cau: Mỗi câu nhạc đi lên được nối bằng một câu "soi gương" đi xuống (ý của tên tác phẩm).
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n10
  cau: Năm 1976, Pärt tạo ra phong cách tintinnabuli.
  loai: nam
- trang: nghe-nhac/part-spiegel
  id: n11
  cau: Tên tintinnabuli lấy từ tintinnabulum, tiếng Latin nghĩa là "chiếc chuông nhỏ".
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n12
  cau: Tintinnabuli gồm hai bè đi liền với nhau; một bè giai điệu (bè M) phần lớn đi theo
    gam, từng bước một.
  loai: dinh-nghia
- trang: nghe-nhac/part-spiegel
  id: n13
  cau: Bè kia (bè T) chỉ dùng ba nốt của hợp âm ba chủ, vang như tiếng chuông.
  loai: dinh-nghia
- trang: nghe-nhac/part-spiegel
  id: n14
  cau: Ở Spiegel im Spiegel, hợp âm ba chủ là Fa – La – Đô.
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n15
  cau: 'Chất liệu của Spiegel im Spiegel rất ít: chỉ có giai điệu của nhạc cụ độc tấu và phần
    đệm ba nốt của piano.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n17
  cau: 'Theo dõi, dòng 1: piano bắt đầu với hình đệm ba nốt đi lên, lặp lại đều đặn.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n18
  cau: 'Theo dõi, dòng 2: violin vào; câu đầu chỉ có hai nốt, kết về một nốt trung tâm.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n19
  cau: 'Theo dõi, dòng 3: mỗi câu sau thêm một nốt, nên giai điệu đi xa dần khỏi nốt trung
    tâm; câu đi lên được nối bằng câu "soi gương" đi xuống, và câu nào cũng trở về nốt trung
    tâm.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n20
  cau: 'Theo dõi, dòng 4: piano thêm những nốt tintinnabuli, như những chiếc chuông nhỏ, lần
    lượt vang phía trên và phía dưới giai điệu.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n21
  cau: 'Theo dõi, dòng 5: những câu cuối dài nhất; giai điệu vẫn trở về nốt trung tâm.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n23
  cau: 'Câu hỏi 3: so sánh với Bach, Prelude cung Đô trưởng: cả hai đều có hình hợp âm rải
    lặp lại.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n27
  cau: 'Mục Nguồn: trang Spiegel im Spiegel và tiểu sử của Trung tâm Arvo Pärt; bài của Jelena
    Tokun (2011); bản nhạc do Universal Edition giữ bản quyền; bản ghi tác phẩm của Thư viện
    Quốc hội Mỹ (theo MGG); MusicBrainz.'
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n22
  cau: 'Câu hỏi nghe chủ động 1 và 2: có nhận ra quy luật "mỗi câu thêm một nốt" không; âm
    nhạc gần như không thay đổi gì lớn trong 10 phút, cảm giác thay đổi ra sao.'
  loai: khuyen-tap
- trang: nghe-nhac/index
  id: n2
  cau: 'Phương pháp 4 lần nghe, mỗi tác phẩm (hay một chương) cho cả tuần: lần 1 cảm nhận;
    lần 2 tìm giai điệu chính (ngân nga, phút thứ mấy, nhạc cụ nào); lần 3 theo dõi cấu trúc,
    vẽ sơ đồ A B A với mốc thời gian; lần 4 nghe một bản thu khác và so sánh.'
  loai: khuyen-tap
- trang: nghe-nhac/index
  id: n1
  cau: Nghe chủ động là ngồi yên nghe một tác phẩm, không làm việc khác, mỗi lần với một câu
    hỏi; nhạc cổ điển bật lên làm nhạc nền thì dễ trôi qua; nghe nhiều lần, mỗi lần một câu
    hỏi khác, tác phẩm dần mở ra.
  loai: khuyen-tap
- trang: nghe-nhac/index
  id: n3
  cau: Tìm trên YouTube tên tác phẩm kèm chữ "score" để xem video có bản nhạc chạy theo tiếng
    đàn; chưa đọc nhạc giỏi vẫn thấy được cấu trúc.
  loai: khuyen-tap
- trang: piano/tac-pham/index
  id: n9
  cau: Các mốc tốc độ trong kế hoạch tuần chỉ là gợi ý; chậm hơn kế hoạch là bình thường,
    nhanh hơn mà căng tay thì không.
  loai: quy-tac
- trang: piano/tac-pham/index
  id: n17
  cau: Fantaisie-Impromptu luyện ba chọi bốn.
  loai: cau-truc
- trang: piano/tac-pham/index
  id: n21
  cau: Ấn bản Urtext của G. Henle Verlag kèm mức độ khó 1–9 cho từng tác phẩm.
  loai: so-lieu
- trang: piano/tac-pham/index
  id: n22
  cau: Ấn bản Urtext khác gồm Wiener Urtext, Bärenreiter; với Chopin là Ấn bản Quốc gia Ba
    Lan (Wydanie Narodowe), biên tập Jan Ekier.
  loai: ten
- trang: piano/tac-pham/index
  id: n23
  cau: Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred,
    1995).
  loai: ten
- trang: piano/tac-pham/index
  id: n8
  cau: 'Cách dùng một bài học, bước 1–4 và 6: nghe hai, ba bản thu trước khi mở bản nhạc;
    đánh dấu các đoạn bằng bút chì, đoạn lặp lại chỉ học một lần; tập chỗ khó từ tuần đầu;
    tập bài tập chuẩn bị trước hay song song; khi nốt đã chắc thì đọc phần diễn tấu, thu âm,
    so với các bản thu đã nghe.'
  loai: khuyen-tap
- trang: piano/tac-pham/index
  id: n14
  cau: Mỗi bài dạy nhiều thứ, nhưng có một hai kỹ năng nó dạy tốt nhất; người học biết mình
    yếu ở đâu thì đi theo các chuỗi bài theo mục tiêu.
  loai: khuyen-tap
- trang: piano/tac-pham/index
  id: n19
  cau: Ghép ba bài như vậy để có một chương trình nhỏ biểu diễn; xem thêm Học thuộc và biểu
    diễn.
  loai: khuyen-tap
