  ghi_chu: "IMSLP: First Performance '1926-04-25 in Milan, Teatro alla Scala'; Britannica: 'performed posthumously at La Scala on April 25, 1926'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n4
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/biography/Giacomo-Puccini", "https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "Britannica: Puccini mất 1924 để dở Turandot, 'Two final scenes were completed by Franco Alfano'; IMSLP ghi bản hoàn thành của Alfano."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n5
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614", "https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "Tổng phổ giảm piano (Muzyka 1980, phần giảm của Zuccoli, chữ Ý kèm): Atto terzo, quadro primo mở bằng lời các Araldi rồi Calaf hát 'Nessun dorma' (tr. 336–345); IMSLP ghi 'Aria: Nessun dorma (Act III)'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "IMSLP, danh sách vai: 'Calaf (tenor)'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n7
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "Bản thu Nessun dorma trên trang IMSLP dài 2:58; trang không ghi độ dài trung bình, nhưng 'khoảng 3 phút' khớp."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n8
  luot_2: dung
  nguon: ["https://musicbrainz.org/release-group/aeb969c5-83e7-4160-9981-33991d54b991", "https://musicbrainz.org/release/1721c799-3945-4feb-876d-cfd609829405"]
  ghi_chu: "MusicBrainz: Turandot 1973, Sutherland, Pavarotti, Caballé…, London Philharmonic Orchestra, Zubin Mehta; bản phát hành GB 1973 hãng Decca, số SET 561-3."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n9
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/biography/Giacomo-Puccini"]
  ghi_chu: "Britannica: nhà soạn opera Ý; 'mature operas included La Bohème (1896), Tosca (1900), Madama Butterfly (1904), and Turandot'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n10
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/biography/Giacomo-Puccini"]
  ghi_chu: "Britannica: 'His last opera … Puccini did not complete Turandot'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n11
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/biography/Giacomo-Puccini", "https://www.uni-wuppertal.de/en/third-mission/science-communication/jahr100wissen-/-100-years-ago/2026/oper-turandot/"]
  ghi_chu: "Britannica: mất 29/11/1924, 'unable to write a final grand duet'; Uni Wuppertal: 'The composed score ends with the death of Liù, so the final scene was missing' (cảnh cuối màn 3)."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n12
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/biography/Giacomo-Puccini", "https://www.uni-wuppertal.de/en/third-mission/science-communication/jahr100wissen-/-100-years-ago/2026/oper-turandot/"]
  ghi_chu: "Britannica: 'Two final scenes were completed by Franco Alfano from Puccini's sketches'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n13
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/biography/Giacomo-Puccini", "https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "Britannica: La Scala 25/4/1926, Toscanini chỉ huy; IMSLP: 'Arturo Toscanini (Puccini fragment only)'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n14
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/biography/Giacomo-Puccini", "https://features.opera.org.au/turandot-cheat-sheet/", "https://www.uni-wuppertal.de/en/third-mission/science-communication/jahr100wissen-/-100-years-ago/2026/oper-turandot/"]
  ghi_chu: "Britannica: Toscanini 'concluded the opera at the point Puccini had reached before dying'; Opera Australia và Uni Wuppertal: sau cảnh Liù chết, Toscanini quay xuống nói đại ý tới đây nhà soạn nhạc buông bút ('This is the end of the master's work')."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n15
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)", "https://www.uni-wuppertal.de/en/third-mission/science-communication/jahr100wissen-/-100-years-ago/2026/oper-turandot/"]
  ghi_chu: "IMSLP: '1926-04-26 (with Alfano's revised completion)'; Uni Wuppertal: bản Alfano rút gọn được diễn 'from the second performance onwards'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n16
  luot_2: dung
  nguon: ["https://www.eno.org/?p=224738"]
  ghi_chu: "ENO: opera đặt ở Peking 'in legendary times'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n17
  luot_2: dung
  nguon: ["https://www.opera-arias.com/puccini/turandot/libretto/", "https://www.eno.org/?p=224738"]
  ghi_chu: "Lời opera màn 1: Turandot lấy người 'di sangue regio' giải được ba câu đố, ai thua 'porga alla scure la superba testa' (đưa đầu cho rìu chém). ENO: 'Anyone who stands trial and fails will be executed'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n18
  luot_2: dung
  nguon: ["https://www.santafeopera.org/whats-on/turandot-2027/", "https://www.opera.org.au/productions/turandot-sydney", "https://www.opera-arias.com/puccini/turandot/libretto/"]
  ghi_chu: "Santa Fe Opera: Timur 'the exiled King of Tartary', cha của Calàf; Opera Australia: 'the banished King of Tartary'. Lời opera: Calaf bảo cha im vì kẻ cướp ngôi đang truy lùng, chàng là 'Il Principe ignoto' giấu tên."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n19
  luot_2: dung
  nguon: ["https://www.opera-arias.com/puccini/turandot/libretto/", "https://www.eno.org/?p=224738"]
  ghi_chu: "Lời opera cuối màn 2: Turandot 'Mi vuoi nelle tue braccia a forza, riluttante' (không chịu); Calaf: 'Dimmi il mio nome prima dell'alba, e all'alba morirò'. ENO cũng tóm tắt như vậy."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n20
  luot_2: dung
  nguon: ["https://www.opera-arias.com/puccini/turandot/libretto/", "https://archive.org/details/31761034853614", "https://www.santafeopera.org/whats-on/turandot-2027/"]
  ghi_chu: "Lời opera đầu màn 3: 'Così comanda Turandot: Questa notte nessun dorma in Pekino! Pena la morte, il nome dell'ignoto sia rivelato prima del mattino'. Chỉ dẫn sân khấu: 'È notte'. Santa Fe: 'no one in Peking shall sleep until the prince's name is found, on pain of death'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n21
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614", "https://www.opera-arias.com/puccini/turandot/libretto/"]
  ghi_chu: "Chỉ dẫn sân khấu tổng phổ: 'Il giardino della Reggia… È notte… Adagiato sui gradini del padiglione è il Principe'; lời: 'Dilegua, o notte!… All'alba vincerò!'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n22
  luot_2: dung
  nguon: ["https://features.opera.org.au/turandot-cheat-sheet/", "https://lareviewofbooks.org/article/turandot-metropolitan-opera-giacomo-puccini-orientalist-china-fascism/", "https://www.cambridge.org/core/journals/journal-of-the-royal-musical-association/article/puccini-and-the-music-boxes/4ED3974A7C448D5B9625CCE512369D53"]
  ghi_chu: "Opera Australia: giai điệu 'jasmine flower' do hợp xướng thiếu nhi hát ở màn 1 và trở lại 'again and again through the opera' như chủ đề của công chúa; LARB: 'Mo Li Hua' là dân ca Trung Hoa thật, Puccini dùng trong Turandot; Sheppard (JRMA) nói về 'Jasmine Flower' trong Turandot."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n23
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614", "https://www.opera-arias.com/puccini/turandot/libretto/"]
  ghi_chu: "Tổng phổ: 'Dalle estreme lontananze giungono voci di Araldi… Altre voci, vicine e lontane, fanno eco'; rồi Il Principe hát 'Nessun dorma! Nessun dorma!'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n24
  luot_2: dung
  nguon: ["https://www.opera-arias.com/puccini/turandot/libretto/"]
  ghi_chu: "Lời: 'Tu pure, o Principessa, nella tua fredda stanza guardi le stelle… Ma il mio mistero è chiuso in me, il nome mio nessun saprà'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n25
  luot_2: dung
  nguon: ["https://www.opera-arias.com/puccini/turandot/libretto/", "https://archive.org/details/31761034853614"]
  ghi_chu: "Lời: Le donne 'Il nome suo nessun saprà… E noi dovrem, ahimè, morir, morir!'; tổng phổ ghi '(interno, un po' lontano)' (từ xa)."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n26
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614", "https://www.opera-arias.com/puccini/turandot/libretto/"]
  ghi_chu: "Tổng phổ tr. 345: 'Vin-ce-' với 'ce' là nốt móc kép ở Si cao (sau nốt móc đơn chấm), rồi 'rò' là nốt tròn La ngân, có 'poco allarg.'; Calaf hát 'Dilegua, o notte!… Vincerò!'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n27
  luot_2: dung
  nguon: ["https://www.opera-arias.com/puccini/turandot/libretto/", "https://archive.org/details/31761034853614"]
  ghi_chu: "Lời đầu màn 3: các Araldi từ xa ra lệnh 'Questa notte nessun dorma in Pekino', ai cũng phải tìm tên người lạ trước sáng."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n28
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614", "https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "Tổng phổ: sau lời Araldi và đám đông, Il Principe (Calaf, tenor theo IMSLP) hát một mình."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n29
  luot_2: dung
  nguon: ["https://www.opera-arias.com/puccini/turandot/libretto/"]
  ghi_chu: "Lời: công chúa 'guardi le stelle'; 'il mio mistero è chiuso in me, il nome mio nessun saprà'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n30
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614", "https://www.opera-arias.com/puccini/turandot/libretto/"]
  ghi_chu: "Tổng phổ: Le donne '(interno, un po' lontano)' hát 'E noi dovrem, ahimè, morir', rồi Il Principe hát tiếp 'Dilegua, o notte!'."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n31
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614"]
  ghi_chu: "Tổng phổ tr. 345: 'Dilegua, o notte! Tramontate, stelle! All'alba vincerò!'; 'Vincerò' cuối: Si cao móc kép rồi La nốt tròn ngân."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n33
  luot_2: dung
  nguon: ["https://archive.org/details/31761034853614", "https://features.opera.org.au/turandot-cheat-sheet/"]
  ghi_chu: "Tổng phổ giảm piano (Muzyka 1980, dựa trên bản Ricordi) tr. 345: âm '-ce-' ghi bằng một nốt móc kép (hai đuôi cờ) ở Si cao, âm '-rò' là nốt tròn La. Opera Australia: nốt Si là 'tiny … meant to be sung quickly'. Lượt 2 không đọc được tổng phổ dàn nhạc Ricordi; bản giảm piano ghi như câu nói."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n35
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Câu khẳng định chung, không đo được; nguồn chỉ nói aria rất nổi tiếng (Opera Australia: 'probably the most famous aria ever written'), không xác nhận 'người chưa nghe opera cũng thuộc lòng'. Câu đã bỏ khỏi trang."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n38
  luot_2: dung
  nguon: ["https://archive.org/details/isbn_9790041913582", "https://archive.org/details/turandotdrammali02adam", "https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)", "https://www.cambridge.org/core/journals/journal-of-the-royal-musical-association/article/puccini-and-the-music-boxes/4ED3974A7C448D5B9625CCE512369D53"]
  ghi_chu: "Có thật: tổng phổ Ricordi 1926 trên Internet Archive (isbn_9790041913582, 'Turandot: Full Score'); lời opera Ricordi 1926 trên Internet Archive; trang IMSLP; số SC 91 theo danh mục Schickling (IMSLP ghi); bài W. Anthony Sheppard 'Puccini and the Music Boxes', JRMA 140/1. COD và Encyclopedia of World Biography là sách tham khảo có thật; lượt 2 không mở mục cụ thể."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n34
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên nghe so sánh hai bản thu: hợp lý."
- trang: nghe-nhac/puccini-nessun-dorma
  id: n32
  luot_2: dung
  nguon: []
  ghi_chu: "Câu hỏi nghe chủ động: hợp lý."
- trang: nghe-nhac/ravel-bolero
  id: n1
  luot_2: dung
  nguon: ["https://www.tucsonsymphony.org/program-notes/ravel/bolero/"]
  ghi_chu: "Ghi chú TSO: Ravel sinh 7/3/1875 ở Ciboure, mất 28/12/1937 ở Paris."
- trang: nghe-nhac/ravel-bolero
  id: n2
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Bol%C3%A9ro,_M.81_(Ravel,_Maurice)", "https://archive.org/details/imslp-104723-pmlp-03667-ravel-bolero-cropped", "https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html"]
  ghi_chu: "IMSLP: sáng tác 1928, in lần đầu 1929 Paris: Durand, đề tặng Ida Rubinstein. Tổng phổ Durand 1929 (IA) ghi 'à IDA RUBINSTEIN'. Bhogal: ballet Boléro 1928, vũ đạo của Rubinstein."
- trang: nghe-nhac/ravel-bolero
  id: n3
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Bol%C3%A9ro,_M.81_(Ravel,_Maurice)"]
  ghi_chu: "IMSLP: First Performance 1928-11-22, Paris: Palais Garnier, Orchestre de l'Opéra, Walther Straram (conductor). Bhogal xác nhận là ballet."
- trang: nghe-nhac/ravel-bolero
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Bol%C3%A9ro,_M.81_(Ravel,_Maurice)"]
  ghi_chu: "IMSLP: Comp. Period / Piece Style: Early 20th century."
- trang: nghe-nhac/ravel-bolero
  id: n5
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Bol%C3%A9ro,_M.81_(Ravel,_Maurice)", "https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html"]
  ghi_chu: "IMSLP: độ dài trung bình 15 phút; các bản thu trên trang dài 13:49, 15:11, 17:50. Bhogal dẫn Ravel: 'seventeen-minute composition'. 'Khoảng 14–17' hợp lý; có bản nhanh dưới 14 phút (TSO ghi 13 phút)."
- trang: nghe-nhac/ravel-bolero
  id: n6
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html", "https://www.tucsonsymphony.org/program-notes/ravel/bolero/"]
  ghi_chu: "Bhogal dẫn Ravel: 'an experiment', 'There are no contrasts, and there is practically no invention'; thiếu phát triển giai điệu. TSO: chỉ ở coda giọng mới rời Đô trưởng."
- trang: nghe-nhac/ravel-bolero
  id: n7
  luot_2: dung
  nguon: ["https://www.tucsonsymphony.org/program-notes/ravel/bolero/", "https://imslp.org/wiki/Bol%C3%A9ro,_M.81_(Ravel,_Maurice)"]
  ghi_chu: "TSO: snare là âm đầu tiên, mẫu 2 ô lặp không đổi tới ô áp chót, 169 lần. IMSLP: 340 ô; 169×2 = 338, nên hai ô cuối khác."
- trang: nghe-nhac/ravel-bolero
  id: n8
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html", "https://www.tucsonsymphony.org/program-notes/ravel/bolero/"]
  ghi_chu: "Bhogal: 'two alternating melodies', mỗi lần một nhạc cụ hay tổ hợp khác. TSO: hai giai điệu không đổi, chỉ đổi nhạc cụ."
- trang: nghe-nhac/ravel-bolero
  id: n9
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html"]
  ghi_chu: "Ravel (Bhogal dẫn): 'one long, very gradual crescendo'; sáo mở đầu pianissimo; đoạn ở số 18 fortissimo."
- trang: nghe-nhac/ravel-bolero
  id: n10
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html"]
  ghi_chu: "Bhogal dẫn Ravel: 'an experiment in a very special and limited direction' (Calvocoressi), 'orchestral tissue without music', 'the only element of variety is provided by the orchestral crescendo'."
- trang: nghe-nhac/ravel-bolero
  id: n12
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html", "https://www.tucsonsymphony.org/program-notes/ravel/bolero/"]
  ghi_chu: "Bhogal: giai điệu mở đầu (A) do sáo chơi pianissimo; viola pizzicato ở ô 1–2 (Ví dụ 7). TSO: snare vào trước."
- trang: nghe-nhac/ravel-bolero
  id: n13
  luot_2: dung
  nguon: ["https://www.tucsonsymphony.org/program-notes/ravel/bolero/", "https://archive.org/details/imslp-104723-pmlp-03667-ravel-bolero-cropped"]
  ghi_chu: "TSO: solo sáo, clarinet, bassoon. OCR tổng phổ Durand có nhãn '1° Clar.' ở trang đầu."
- trang: nghe-nhac/ravel-bolero
  id: n14
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260609084044/https://mtosmt.org/issues/mto.20.26.2/mto.20.26.2.bhogal.html"]
