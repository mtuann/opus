  ghi_chu: "Bản Boulez/Cleveland: Introduction 3:34, Danses des adolescentes (Augures) 3:18, cộng khoảng 6:52. Bản Rattle (Columbia): Augurs bắt đầu 3:23, Ritual of Abduction 6:37."
