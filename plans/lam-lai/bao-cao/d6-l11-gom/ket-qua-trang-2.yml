  id: n20
  luot_2: dung
  nguon: ["https://www.filharmonikusok.hu/en/?p=91605"]
  ghi_chu: "Hungary: 'The oboe, the clarinet, and the flute intone desolate solo melodies'."
- trang: nghe-nhac/shostakovich-5
  id: n21
  luot_2: dung
  nguon: ["https://www.filharmonikusok.hu/en/?p=91605", "https://sin80.com/en/work/shostakovich-symphony-5"]
  ghi_chu: "Như n12: 'many people wept openly during the Largo'."
- trang: nghe-nhac/shostakovich-5
  id: n22
  luot_2: dung
  nguon: ["https://cantonsymphony.org/wp-content/uploads/2023/07/Shostakovich-SYMPHONY-NO.-5-IN-D-MINOR-OP.-47.pdf", "https://www.filharmonikusok.hu/en/?p=91605"]
  ghi_chu: "Canton: finale Allegro non troppo 'begins with a vehement march of almost unrelentless energy and power'."
- trang: nghe-nhac/shostakovich-5
  id: n23
  luot_2: dung
  nguon: ["https://www.filharmonikusok.hu/en/?p=91605", "https://cantonsymphony.org/wp-content/uploads/2023/07/Shostakovich-SYMPHONY-NO.-5-IN-D-MINOR-OP.-47.pdf"]
  ghi_chu: "Hungary: 'a slower, more introspective section begins with a haunting horn solo'; Canton: 'quieter middle section'."
