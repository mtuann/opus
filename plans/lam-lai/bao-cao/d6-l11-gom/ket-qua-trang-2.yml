  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)"]
  ghi_chu: "IMSLP: 'Average Duration 45 minutes', 4 chương Moderato, Allegretto, Largo, Allegro non troppo. (Ghi chú chương trình khác ghi 50–52 phút; 'khoảng 45' vẫn đúng với số trung bình.)"
- trang: nghe-nhac/shostakovich-5
  id: n7
  luot_2: dung
  nguon: ["https://pages.uoregon.edu/kimball/Shostakovich.Copland.htm", "https://www.filharmonikusok.hu/en/?p=91605"]
  ghi_chu: "U. Oregon (trích Volkov): Pravda ngày 28/1/1936, xã luận 'Muddle Instead of Music' về Lady Macbeth of Mtsensk, Pravda là 'the voice of the party'; Dàn nhạc Quốc gia Hungary: 'On January 28, 1936, an unsigned editorial in the Pravda, the daily paper of the Communist Party, brutally attacked his opera Lady Macbeth of the Mtsensk District'."
- trang: nghe-nhac/shostakovich-5
  id: n8
  luot_2: dung
  nguon: ["https://pages.uoregon.edu/kimball/Shostakovich.Copland.htm", "https://web.archive.org/web/2026/https://www.britannica.com/biography/Dmitri-Shostakovich"]
  ghi_chu: "U. Oregon: 'a twenty-nine-year-old composer' lúc bị đả kích 1936; sinh 25/9/1906 nên 28/1/1936 là 29 tuổi."
- trang: nghe-nhac/shostakovich-5
  id: n9
  luot_2: dung
  nguon: ["https://www.filharmonikusok.hu/en/?p=91605", "https://3quarksdaily.com/?p=268462"]
  ghi_chu: "Dàn nhạc Quốc gia Hungary: 'the Great Terror had begun: political show trials resulting in numerous death sentences and mass deportations'; Alex Ross: 'in 1937, at the time of Stalin's Terror'."
- trang: nghe-nhac/shostakovich-5
  id: n10
  luot_2: dung
  nguon: ["https://cantonsymphony.org/wp-content/uploads/2023/07/Shostakovich-SYMPHONY-NO.-5-IN-D-MINOR-OP.-47.pdf", "https://web.archive.org/web/2026/https://www.britannica.com/biography/Dmitri-Shostakovich"]
  ghi_chu: "Canton Symphony: 'He withdrew his Fourth Symphony, which was then in rehearsal for its premiere by the Leningrad Philharmonic'; Britannica: Symphony No. 4 bị rút lại; giao hưởng lớn tiếp theo là số 5."
- trang: nghe-nhac/shostakovich-5
  id: n11
  luot_2: dung
  nguon: ["https://www.hkphil.org/watch-and-listen/symphonies/shostakovich-symphony-no-5", "https://sin80.com/en/work/shostakovich-symphony-5"]
  ghi_chu: "HK Phil: 'the audience at the Leningrad premiere roared their approval for half an hour'."
- trang: nghe-nhac/shostakovich-5
  id: n12
  luot_2: dung
  nguon: ["https://www.filharmonikusok.hu/en/?p=91605", "https://sin80.com/en/work/shostakovich-symphony-5"]
  ghi_chu: "Dàn nhạc Quốc gia Hungary: 'At the first performance, many people wept openly during the Largo'."
- trang: nghe-nhac/shostakovich-5
  id: n13
  luot_2: dung
  nguon: ["https://www.sfsymphony.org/Data/Event-Data/Program-Notes/S/Shostakovich-Symphony-No-5", "https://web.archive.org/web/2026/https://www.britannica.com/biography/Dmitri-Shostakovich"]
  ghi_chu: "San Francisco Symphony: 'An unidentified reviewer called it' 'Soviet artist's reply to just criticism', 'a formulation subsequently accepted by Shostakovich and indeed often attributed to him'. Hungary ghi dạng 'Creative Response'."
- trang: nghe-nhac/shostakovich-5
  id: n14
  luot_2: dung
  nguon: ["https://assets.culturaldistrict.org/culturaldistrict/system/assets/7131/original/Shostavovich.pdf", "https://3quarksdaily.com/?p=268462", "https://www.filharmonikusok.hu/en/?p=91605"]
  ghi_chu: "Pittsburgh (Cultural District): lời Testimony 'The rejoicing is forced, created under threat'; Alex Ross: coda 35 ô fff ở Rê trưởng, 'its meanings are profoundly fraught'; Hungary: 'issues are never black and white'."
- trang: nghe-nhac/shostakovich-5
  id: n15
  luot_2: dung
  nguon: ["https://sin80.com/en/work/shostakovich-symphony-5", "https://www.filharmonikusok.hu/en/?p=91605"]
  ghi_chu: "sin80: 'opens with a strenuous string figure in canon… sharply dotted rhythm… broadly lyric melody played by the first violins'; Hungary: 'second theme, played by the violins in a high register, is warm and lyrical but… eerie and distant'."
- trang: nghe-nhac/shostakovich-5
  id: n16
  luot_2: dung
  nguon: ["https://www.filharmonikusok.hu/en/?p=91605", "https://assets.culturaldistrict.org/culturaldistrict/system/assets/7131/original/Shostavovich.pdf"]
  ghi_chu: "Hungary: 'the horns begin a march theme that leads to motivic development and a speeding up of the tempo'; Pittsburgh: horn đồng âm mở phần phát triển, 'builds quickly to a powerful, almost demonic march'."
- trang: nghe-nhac/shostakovich-5
  id: n17
  luot_2: dung
  nguon: ["https://cantonsymphony.org/wp-content/uploads/2023/07/Shostakovich-SYMPHONY-NO.-5-IN-D-MINOR-OP.-47.pdf", "https://www.filharmonikusok.hu/en/?p=91605", "https://assets.culturaldistrict.org/culturaldistrict/system/assets/7131/original/Shostavovich.pdf"]
  ghi_chu: "Canton: Allegretto 'a grotesque, waltz-like scherzo… a Russian version of a Mahler Ländler'; Hungary: 'Ländler-like melodies again bespeak Mahler's influence'; Pittsburgh: 'sardonic humor'."
- trang: nghe-nhac/shostakovich-5
  id: n18
  luot_2: dung
  nguon: ["https://www.sfsymphony.org/Data/Event-Data/Program-Notes/S/Shostakovich-Symphony-No-5", "https://www.filharmonikusok.hu/en/?p=91605", "https://www.hkphil.org/watch-and-listen/symphonies/shostakovich-symphony-no-5"]
  ghi_chu: "SFS: 'The Largo uses no brass at all'; HK Phil: 'the brass are silent'."
