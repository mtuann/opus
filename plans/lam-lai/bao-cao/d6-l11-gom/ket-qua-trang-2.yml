  ghi_chu: "Bhogal: Mi trưởng đến bất ngờ ở số 18, 'after nine iterations of the themes'. IMSLP: dài trung bình 15 phút, đoạn này gần cuối; 'khoảng 15 phút' hợp lý, tùy tốc độ."
