  nguon: ["https://musicbrainz.org/ws/2/release/824aa08e-fce8-47a6-b726-9151f66c9e68?inc=labels+artist-credits+recordings&fmt=json"]
  ghi_chu: "MusicBrainz: 'Le Sacre du Printemps', The Cleveland Orchestra, Pierre Boulez, CBS 72807, 1969."
- trang: nghe-nhac/stravinsky-sacre
  id: n7
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/events/the-rite-of-spring", "http://web.archive.org/web/20261004084433/https://www.britannica.com/topic/The-Rite-of-Spring"]
  ghi_chu: "Laki dẫn Stravinsky: 'a solemn pagan rite… a young girl dance herself to death… sacrificing her to propitiate the god of spring'; nghi lễ Nga cổ. Britannica: phụ đề 'Pictures from Pagan Russia'. 'Slav cổ' khớp với 'Nga ngoại giáo'."
- trang: nghe-nhac/stravinsky-sacre
  id: n8
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/events/the-rite-of-spring", "https://madisonsymphony.org/?p=12572", "https://www.yellowbarn.org/page/stravinsky-rite-spring"]
  ghi_chu: "Laki: 'hard to know how much of this was due to the music or to Nijinsky's jagged choreography'. Huscher và Allsen: phần lớn do vũ đạo."
- trang: nghe-nhac/stravinsky-sacre
  id: n9
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/events/the-rite-of-spring"]
  ghi_chu: "Laki: 'The Rite of Spring changed the course of 20th-century music like no other work'."
- trang: nghe-nhac/stravinsky-sacre
  id: n10
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/events/the-rite-of-spring", "https://blog.oup.com/2013/05/rite-of-spring-100-anniversary/"]
  ghi_chu: "Laki: ostinato 'in which the emphasis constantly shifts… highly irregular and unpredictable rhythm'. OUP: trọng âm phá chuẩn phách mạnh đầu ô."
- trang: nghe-nhac/stravinsky-sacre
  id: n11
  luot_2: dung
  nguon: ["https://blog.oup.com/2013/05/rite-of-spring-100-anniversary/", "https://archive.org/details/lesacreduprintem00stra_0"]
  ghi_chu: "OUP: hợp âm chồng Fa♭ trưởng và Mi♭ bảy thành một khối âm 'more complex sound'. Tổng phổ (tr. 11, Augures): khối ấy lặp nhiều ô, không giải quyết. Đây là lời diễn giải, nhưng khớp với nguồn."
- trang: nghe-nhac/stravinsky-sacre
  id: n12
  luot_2: dung
  nguon: ["https://madisonsymphony.org/?p=12572", "https://archive.org/details/lesacreduprintem00stra_0"]
  ghi_chu: "Allsen: 'constantly shifting meters'. Tổng phổ ERM 1921, Danse sacrale (tr. 117, số 154–157): số chỉ nhịp đổi gần mỗi ô (3/8, 2/8, 3/8…)."
- trang: nghe-nhac/stravinsky-sacre
  id: n14
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/events/the-rite-of-spring", "https://www.pbs.org/keepingscore/stravinsky-rite-of-spring.html"]
  ghi_chu: "Laki: bassoon solo 'derived from a Lithuanian folk song', 'in the instrument's highest register'. PBS: khán giả không biết đó là nhạc cụ gì."
- trang: nghe-nhac/stravinsky-sacre
  id: n15
  luot_2: dung
  nguon: ["https://dbanach.com/homepage/h-picasso-stravinsky-notes.htm", "https://madisonsymphony.org/?p=12572"]
  ghi_chu: "Ghi chú UCSD: 'Other instruments enter with short melodic fragments leading to a noisy climax'. Allsen: phần mở đầu chủ yếu là kèn gỗ."
- trang: nghe-nhac/stravinsky-sacre
  id: n16
  luot_2: dung
  nguon: ["https://dbanach.com/homepage/h-picasso-stravinsky-notes.htm", "https://archive.org/details/lesacreduprintem00stra_0"]
  ghi_chu: "UCSD: sau cao trào 'the opening bassoon melody returns'. Tổng phổ tr. 11: Fag. 1 solo kết bằng dấu lặng ngân, rồi violin pizzicato và Augures."
- trang: nghe-nhac/stravinsky-sacre
  id: n17
  luot_2: dung
  nguon: ["https://archive.org/details/lesacreduprintem00stra_0", "https://www.clevelandorchestra.com/events/the-rite-of-spring"]
  ghi_chu: "Tổng phổ tr. 11 (số 13, Augures): violin 2, viola, cello, bass lặp hợp âm nốt móc đơn; 'Cor. 1.2.3.4 / 5.6.7.8' đánh 'sf sempre' ở các phách lệch, trùng dấu nhấn của dây. Laki: nhấn liên tục đổi chỗ, không đoán được."
- trang: nghe-nhac/stravinsky-sacre
  id: n18
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/events/the-rite-of-spring", "https://toddtarantino.com/hum/riteofspring.html"]
  ghi_chu: "Laki: trên ostinato, kèn gỗ đưa ra các giai điệu 'folksong-like'. Tarantino: các mảnh dân ca chồng lên: bassoon trước, rồi trombone, oboe."
