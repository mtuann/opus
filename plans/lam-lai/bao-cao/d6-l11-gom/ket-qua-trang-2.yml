  ghi_chu: "Bhogal: piccolo nhấn bồi âm 3 và 5 của horn, celesta bồi âm 2 và 4 (horn là bồi âm 1). Số nhiều 'piccolos'; IMSLP: piccolo cộng sáo 2 (đổi sang piccolo), nên có hai piccolo."
- trang: nghe-nhac/ravel-bolero
  id: n27
