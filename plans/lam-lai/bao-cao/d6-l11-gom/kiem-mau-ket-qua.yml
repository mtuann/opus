  ket_qua: dung
  ghi_chu: 'IMSLP (API): Op. 46 "Selected by the composer from Peer Gynt, Op.23", file "I. Morning"; audite: "Peer Gynt Suite No.1, Op. 46 … I. Morning Mood", "Peer Gynt Suite No.2, Op. 55", "Between 1888 and 1892 he extracted from the incidental music the two orchestral suites".'
- trang: nghe-nhac/ravel-bolero
  id: h3
  ket_qua: dung
  ghi_chu: 'Đúng có điều kiện: Bhogal (MTO 26.2): "the new fortissimo scoring of the first theme at Rehearsal 18", "the only element of variety is provided by the orchestral crescendo"; bài không ghi dấu sắc thái của ô cuối. Không có fff theo lượt 1 đọc tổng phổ Durand 1929 (ff possibile ở số tập 17); không đọc lại tổng phổ.'
- trang: nghe-nhac/brahms-4
  id: n12
  ket_qua: dung
  ghi_chu: 'Đúng có điều kiện: cách đếm khác nhau giữa các nguồn. Lượt 1 đếm trên bản in Simrock 1886: chủ đề 8 ô, 30 lần biến đổi tới ô 248, coda từ ô 253 (Più Allegro). Ghi chú chương trình Dayton Performing Arts nói "32 exceptional variations" (có lẽ đếm cả phần đầu coda), Brahms-Institut "mehr als 30 Iterationen". Hồ sơ đã ghi chỗ khác nhau này; giữ cách đếm theo bản nhạc.'
