- trang: nghe-nhac/puccini-nessun-dorma
  id: n1
  cau: 'Bảng: Giacomo Puccini (1858–1924).'
  loai: nam
- trang: nghe-nhac/puccini-nessun-dorma
  id: n2
  cau: 'Bảng: Opera Turandot (3 màn).'
  loai: danh-muc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n3
  cau: 'Bảng: Công diễn 25/4/1926 tại La Scala, Milan.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n4
  cau: 'Bảng: Puccini mất năm 1924 khi opera còn dang dở; Franco Alfano hoàn thành.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n5
  cau: 'Bảng: Aria "Nessun dorma" (Không ai được ngủ) ở đầu màn 3.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n6
  cau: 'Bảng: Giọng tenor.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n7
  cau: 'Bảng: Độ dài khoảng 3 phút.'
  loai: so-lieu
- trang: nghe-nhac/puccini-nessun-dorma
  id: n8
  cau: 'Bảng: Bản thu gợi ý: Luciano Pavarotti, trong bản thu trọn vở do Zubin Mehta chỉ huy
    (Decca, 1973).'
  loai: ten
- trang: nghe-nhac/puccini-nessun-dorma
  id: n9
  cau: Puccini là nhà soạn nhạc opera Ý, tác giả La bohème, Tosca, Madama Butterfly.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n10
  cau: Turandot là opera cuối cùng của Puccini, và ông không kịp hoàn thành.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n11
  cau: Khi Puccini mất (29/11/1924), vở đã gần xong, chỉ còn thiếu phần cuối màn 3.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n12
  cau: Nhạc sĩ Franco Alfano viết nốt phần kết.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n13
  cau: Vở ra mắt năm 1926 tại La Scala dưới sự chỉ huy của Arturo Toscanini.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n14
  cau: 'Trong đêm công diễn đầu, buổi diễn dừng lại đúng chỗ nhạc của Puccini dừng lại: Toscanini
    quay xuống khán giả và nói rằng tới đây nhà soạn nhạc đã buông bút.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n15
  cau: Phần Alfano viết được diễn từ đêm thứ hai.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n16
  cau: Câu chuyện lấy bối cảnh Bắc Kinh "thời cổ tích".
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n17
  cau: 'Công chúa Turandot ra điều kiện: người muốn cưới nàng phải giải được ba câu đố, không
    giải được thì bị chém đầu.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n18
  cau: Hoàng tử Calaf là con vua Tartar bị truất ngôi, giấu tên thật.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n19
  cau: 'Calaf giải được cả ba câu đố, Turandot vẫn không chịu; chàng ra "câu đố ngược": nếu
    trước bình minh nàng đoán được tên chàng, chàng sẽ chịu chết.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n20
  cau: '"Nessun dorma" ở đầu màn 3, giữa đêm khuya; Turandot ra lệnh không ai trong thành
    được ngủ, ai trái lệnh phải chết, mọi người phải thức tìm tên chàng trai.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n21
  cau: 'Một mình trong vườn cung điện, Calaf hát: khi bình minh lên, chàng sẽ thắng.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n22
  cau: Để tạo màu sắc Trung Hoa, Puccini đưa vào opera giai điệu dân ca Mạt lỵ hoa ("Hoa nhài");
    giai điệu ấy xuất hiện ở những đoạn khác trong vở.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n23
  cau: 'Sơ đồ, Mở đầu: các sứ giả từ xa loan lệnh "không ai được ngủ", những giọng khác vọng
    lại; Calaf một mình nhắc lại "Nessun dorma!" giữa đêm.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n24
  cau: 'Sơ đồ, Đoạn giữa: chàng hát về công chúa trong căn phòng lạnh đang ngắm sao; bí mật
    (tên chàng) chỉ mình chàng giữ.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n25
  cau: 'Sơ đồ, Hợp xướng xen vào: giọng phụ nữ từ xa, đầy lo âu: "Tên chàng không ai biết…
    và chúng ta, than ôi, sẽ phải chết!"'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n26
  cau: 'Sơ đồ, Kết: Calaf xua tan đêm tối, giọng rực rỡ dần, khép lại bằng tiếng "Vincerò!"
    (ta sẽ thắng!): một nốt Si cao rất ngắn, rồi nốt La ngân dài.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n27
  cau: 'Theo dõi 1: đêm ở Bắc Kinh, lệnh "không ai được ngủ" vang lên từ xa, cả thành phải
    thức trắng tìm tên chàng trai.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n28
  cau: 'Theo dõi 2: giọng tenor của Calaf cất lên một mình giữa đêm khuya.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n29
  cau: 'Theo dõi 3: chàng hát về công chúa ngắm những vì sao; tên chàng là bí mật chỉ mình
    chàng biết.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n30
  cau: 'Theo dõi 4: hợp xướng nữ từ xa xen vào, lo âu, rồi nhường lại sân khấu cho Calaf.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n31
  cau: 'Theo dõi 5: chàng xua đêm tối, đón bình minh: "Vincerò!" — nốt Si cao rồi nốt La cuối
    ngân dài, rực rỡ.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n33
  cau: 'Câu hỏi, gợi ý: trong tổng phổ, Puccini viết nốt Si cao trên âm "-ce-" chỉ bằng một
    nốt móc kép, rất ngắn, rồi mới ngân dài nốt La ở âm cuối.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n35
  cau: (Đã bỏ) Aria này khiến cả những người chưa từng nghe opera cũng thuộc lòng.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n38
  cau: 'Mục Nguồn: tổng phổ Ricordi và lời opera 1926 trên Internet Archive, IMSLP, Catalogue
    of the Works của Puccini, COD, Encyclopedia of World Biography, bài của Sheppard.'
  loai: ten
- trang: nghe-nhac/puccini-nessun-dorma
  id: n34
  cau: 'Câu hỏi: so sánh hai bản thu khác nhau: ai hát "tự tin" hơn, ai hát "lãng mạn" hơn?'
  loai: khuyen-tap
- trang: nghe-nhac/puccini-nessun-dorma
  id: n32
  cau: 'Câu hỏi: aria tràn đầy tự tin mà lại mở đầu lặng lẽ giữa đêm khuya — sự tương phản
    này tạo hiệu quả gì?'
  loai: khuyen-tap
- trang: nghe-nhac/ravel-bolero
  id: n1
  cau: 'Bảng: Maurice Ravel (1875–1937).'
  loai: nam
- trang: nghe-nhac/ravel-bolero
  id: n2
  cau: 'Bảng: sáng tác năm 1928, nhạc cho vở ballet của vũ công Ida Rubinstein (bản tổng phổ
    đề tặng bà); Durand in năm 1929.'
  loai: nam
- trang: nghe-nhac/ravel-bolero
  id: n3
  cau: 'Bảng: công diễn 22/11/1928 ở Nhà hát Opéra (Palais Garnier), Paris, dạng ballet; nhạc
    trưởng Walther Straram.'
  loai: nam
- trang: nghe-nhac/ravel-bolero
  id: n4
  cau: 'Bảng: thời kỳ Thế kỷ 20.'
  loai: lich-su
- trang: nghe-nhac/ravel-bolero
  id: n5
  cau: 'Bảng: độ dài khoảng 14–17 phút tùy nhạc trưởng.'
  loai: so-lieu
- trang: nghe-nhac/ravel-bolero
  id: n6
  cau: 'Boléro là một thí nghiệm: gần như không có phát triển, không có chuyển giọng (trừ
    một lần ở cuối), không có tương phản.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n7
  cau: Một tiết tấu trống snare lặp lại không ngừng từ ô đầu tiên, chỉ đổi ở hai ô cuối.
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n8
  cau: Hai giai điệu (gọi là A và B) luân phiên nhau, mỗi lần do một nhạc cụ hoặc một nhóm
    nhạc cụ khác chơi; giai điệu chuyển qua lần lượt các nhạc cụ.
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n9
  cau: Một crescendo duy nhất kéo dài suốt tác phẩm, từ pianissimo đến fortissimo.
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n10
  cau: 'Ravel gọi bản nhạc là "một thí nghiệm theo một hướng rất đặc biệt và hẹp" và nói nó
    chỉ là "mô dệt của dàn nhạc, không có âm nhạc": điều thay đổi duy nhất là phối khí và
    cường độ.'
  loai: lich-su
- trang: nghe-nhac/ravel-bolero
  id: n12
  cau: 'Theo dõi, dòng 1: A, sáo, rất nhỏ, trên nền snare và pizzicato đàn dây.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n13
  cau: 'Theo dõi, dòng 2: A, clarinet.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n14
  cau: 'Theo dõi, dòng 3: B, bassoon ở âm vực cao.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n15
  cau: 'Theo dõi, dòng 4: B, clarinet Mi♭ (theo tổng phổ: petite clarinette, clarinet nhỏ).'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n16
  cau: 'Theo dõi, dòng 5: A, oboe d''amore (một loại oboe, do người chơi oboe thứ hai đổi
    sang).'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n17
  cau: 'Theo dõi, dòng 6: A, trumpet có câm tiếng và sáo.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n18
  cau: 'Theo dõi, dòng 7: B, saxophone tenor.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n19
  cau: 'Theo dõi, dòng 8: B, saxophone sopranino rồi soprano (theo tổng phổ); khi biểu diễn,
    người chơi thường dùng saxophone soprano cho cả hai.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n20
  cau: 'Theo dõi, dòng 9: A, kèn horn, celesta và hai piccolo chơi song song ở các quãng của
    chuỗi bồi âm, nghe như một nhạc cụ mới, không có thật.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n21
  cau: 'Theo dõi, dòng 10: A, B luân phiên; các nhóm nhạc cụ ngày càng đông: kèn gỗ, trombone,
    rồi đàn dây.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n22
  cau: 'Theo dõi, dòng 11: A rồi B, cả dàn nhạc, fortissimo.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n23
  cau: 'Theo dõi, dòng 12: kết; lần chuyển giọng duy nhất sang Mi trưởng, rồi về Đô trưởng;
    toàn bộ âm nhạc đổ sụp trong vài ô nhịp.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n24
  cau: 'Câu hỏi 1: ở đoạn horn, celesta và piccolo, horn chơi giai điệu (bồi âm 1), celesta
    ở bồi âm 2 và 4, hai piccolo ở bồi âm 3 và 5, để "tổng hợp" một âm sắc nhân tạo.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n27
  cau: 'Câu hỏi 3: lần chuyển giọng duy nhất ở cuối đến sau khoảng 15 phút ở cùng một giọng.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n30
  cau: 'Mục Nguồn: tổng phổ Durand 1929 (đề tặng Ida Rubinstein) quét trên Internet Archive;
    IMSLP; bài của Gurminder K. Bhogal, Music Theory Online 26.2 (2020).'
  loai: ten
- trang: nghe-nhac/ravel-bolero
  id: h1
  cau: 'Hình bolero, nhãn dưới trục: Sáo, Clarinet, Bassoon, Clarinet Mi♭, Oboe d''amore,
    Trumpet + sáo, Saxophone, Horn + celesta + piccolo, …, Cả dàn nhạc (thứ tự nhạc cụ chơi
    giai điệu).'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h2
  cau: 'Hình bolero: crescendo bắt đầu từ pp.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h3
  cau: 'Hình bolero: crescendo lên tới ff.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h4
  cau: 'Hình bolero, vạch đỏ gần cuối: "chuyển sang Mi trưởng, rồi đổ sụp".'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h5
  cau: 'Hình bolero, chú thích dưới: "Trống snare giữ cùng một tiết tấu tới hai ô cuối; giai
    điệu A và B chuyền qua các nhạc cụ."'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h6
  cau: 'Hình bolero, nhãn và chú thích: "Boléro: một crescendo kéo dài suốt tác phẩm, giai
    điệu chuyền lần lượt từ sáo, clarinet, bassoon… đến cả dàn nhạc; gần cuối chuyển giọng
    một lần rồi kết"; "Boléro: âm sắc và cường độ thay đổi, mọi thứ khác gần như đứng yên."'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n11
  cau: 'Vì vậy Boléro là một bài luyện nhận biết nhạc cụ rất tốt: cùng một giai điệu, chỉ
    thay đổi âm sắc.'
  loai: khuyen-tap
- trang: nghe-nhac/ravel-bolero
  id: n26
  cau: 'Câu hỏi 2: một tác phẩm gần như không đổi gì ngoài âm sắc và cường độ có làm bạn chán
    không.'
  loai: khuyen-tap
- trang: nghe-nhac/shostakovich-5
  id: n1
  cau: 'Bảng: Dmitri Shostakovich (1906–1975).'
  loai: nam
- trang: nghe-nhac/shostakovich-5
  id: n2
  cau: 'Bảng: tên đầy đủ Giao hưởng số 5 cung Rê thứ, Op. 47.'
  loai: danh-muc
- trang: nghe-nhac/shostakovich-5
  id: n3
  cau: 'Bảng: sáng tác từ tháng 4 đến tháng 7 năm 1937.'
  loai: nam
- trang: nghe-nhac/shostakovich-5
  id: n4
  cau: 'Bảng: công diễn 21/11/1937 ở Leningrad, dàn nhạc Leningrad Philharmonic, nhạc trưởng
    Yevgeny Mravinsky.'
  loai: nam
- trang: nghe-nhac/shostakovich-5
  id: n5
  cau: 'Bảng: thời kỳ Thế kỷ 20.'
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n6
  cau: 'Bảng: độ dài khoảng 45 phút, 4 chương.'
  loai: so-lieu
- trang: nghe-nhac/shostakovich-5
  id: n7
  cau: Ngày 28/1/1936, báo Pravda, cơ quan ngôn luận của Đảng Cộng sản Liên Xô, đăng bài "Hỗn
    loạn thay cho âm nhạc" chỉ trích nặng nề vở opera Phu nhân Macbeth quận Mtsensk của Shostakovich.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n8
  cau: Khi ấy Shostakovich 29 tuổi.
  loai: so-lieu
- trang: nghe-nhac/shostakovich-5
  id: n9
  cau: Đó là thời kỳ Đại Thanh trừng; bị phê phán công khai có thể dẫn đến mất tự do hoặc
    mạng sống.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n10
  cau: Shostakovich rút lại Giao hưởng số 4 sau vài buổi tập và viết Giao hưởng số 5.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n11
  cau: Buổi công diễn thành công vang dội; khán giả vỗ tay rất lâu.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n12
  cau: Nhiều người khóc trong chương 3 (Largo) ở buổi công diễn đầu.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n13
  cau: Bản giao hưởng được gọi, không rõ do ai đặt, là "câu trả lời sáng tạo của một nghệ
    sĩ Xô viết trước lời phê phán đúng đắn"; có tin rằng chính Shostakovich đã đồng ý với
    cách gọi ấy.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n14
  cau: 'Câu hỏi còn đến hôm nay: đoạn kết hân hoan ở Rê trưởng là chiến thắng thật hay một
    niềm vui bị ép buộc, châm biếm kín đáo; âm nhạc của ông thường mang hai lớp nghĩa như
    vậy.'
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n15
  cau: 'Theo dõi, chương 1 (Moderato): đàn dây mở đầu bằng một môtip tiết tấu chấm dôi gay
    gắt; rồi violin hát một giai điệu ở âm vực cao, ấm mà xa xăm.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n16
  cau: 'Theo dõi, chương 1, phát triển: kèn horn đưa vào một hành khúc, nhạc nhanh dần, dữ
    dội.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n17
  cau: 'Theo dõi, chương 2 (Allegretto): scherzo nhịp ba, giai điệu như điệu ländler (gợi
    nhớ Mahler), giọng mỉa mai.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n18
  cau: 'Theo dõi, chương 3 (Largo): không có kèn đồng.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n19
  cau: 'Theo dõi, chương 3: violin chia ba bè thay vì hai.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n20
  cau: 'Theo dõi, chương 3: rồi oboe, clarinet, sáo lần lượt hát những giai điệu buồn.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n21
  cau: 'Theo dõi, chương 3: ở buổi công diễn đầu, nhiều người khóc trong chương này.'
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n22
  cau: 'Theo dõi, chương 4 (Allegro non troppo): mở đầu bằng một hành khúc nhanh, dồn dập.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n23
  cau: 'Theo dõi, chương 4, đoạn giữa: chậm lại, trầm tư, mở đầu bằng tiếng horn độc tấu.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n24
  cau: 'Theo dõi, chương 4, coda: timpani và trống snare đưa hành khúc trở lại, chậm chỉ bằng
    một nửa; kết thúc rất to ở Rê trưởng.'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n26
  cau: 'Câu hỏi 2: vì sao Shostakovich lại bỏ kèn đồng trong chương 3 (tiền đề: chương 3 không
    có kèn đồng).'
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n29
  cau: 'Mục Nguồn: ghi chú chương trình của Harlow Robinson (BSO), Peter Laki (Kalamazoo),
    Gerard McBurney (Boston Philharmonic, Benjamin Zander); IMSLP.'
  loai: ten
- trang: nghe-nhac/shostakovich-5
  id: n30
  cau: 'Đọc thêm: Alex Ross, The Rest Is Noise (2007), chương 7 "The Art of Fear: Music in
    Stalin''s Russia".'
  loai: ten
- trang: nghe-nhac/shostakovich-5
  id: n25
  cau: 'Câu hỏi nghe chủ động 1 và 3: so sánh coda ở hai bản thu của hai nhạc trưởng; âm nhạc
    có thể "nói" điều lời nói không được phép nói không.'
  loai: khuyen-tap
- trang: nghe-nhac/stravinsky-sacre
  id: n1
  cau: 'Bảng: Igor Stravinsky (1882–1971).'
  loai: nam
- trang: nghe-nhac/stravinsky-sacre
  id: n2
  cau: 'Bảng: ballet Le Sacre du printemps (1910–1913), cho dàn nhạc rất lớn (riêng kèn horn
    có 8 chiếc).'
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n3
  cau: 'Bảng: công diễn 29/5/1913, Théâtre des Champs-Élysées, Paris, đoàn Ballets Russes,
    biên đạo Vaslav Nijinsky, nhạc trưởng Pierre Monteux.'
  loai: nam
- trang: nghe-nhac/stravinsky-sacre
  id: n4
  cau: 'Bảng: thời kỳ Thế kỷ 20.'
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n5
  cau: 'Bảng: đoạn nghe là mở đầu và Les Augures printaniers (Những điềm báo mùa xuân), khoảng
    7 phút.'
  loai: so-lieu
- trang: nghe-nhac/stravinsky-sacre
  id: n6
  cau: 'Bảng: bản thu gợi ý Pierre Boulez và Dàn nhạc Cleveland (CBS, 1969).'
  loai: ten
- trang: nghe-nhac/stravinsky-sacre
  id: n7
  cau: 'Ballet mô tả nghi lễ của người Slav cổ: để đón mùa xuân, một thiếu nữ được chọn và
    nhảy múa đến chết làm vật hiến tế.'
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n8
  cau: Buổi công diễn năm 1913 gây náo loạn trong khán phòng, một phần vì âm nhạc, một phần
    vì vũ đạo "thô ráp" của Nijinsky.
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n9
  cau: Ngày nay, đây được coi là một trong những tác phẩm có ảnh hưởng lớn nhất tới âm nhạc
    thế kỷ 20.
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n10
  cau: 'Những gì mới mẻ: tiết tấu trở thành nhân vật chính; trọng âm bất thường không theo
    phách mạnh.'
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n11
  cau: Nghịch tai được dùng như màu sắc chứ không cần giải quyết.
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n12
  cau: Có đoạn số chỉ nhịp đổi gần như mỗi ô, như Vũ điệu hiến tế ở cuối tác phẩm.
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n14
  cau: 'Theo dõi, dòng 1: bassoon solo ở âm vực rất cao, gần như không nhận ra là bassoon;
    giai điệu lấy từ một bài dân ca Litva.'
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n15
  cau: 'Theo dõi, dòng 2: các kèn gỗ khác lần lượt chen vào, đan xen, ngày càng dày đặc.'
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n16
  cau: 'Theo dõi, dòng 3: bassoon trở lại, rồi đột ngột dừng.'
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n17
  cau: 'Theo dõi, dòng 4: Les Augures printaniers: đàn dây dậm một hợp âm nghịch tai lặp đi
    lặp lại, tám kèn horn nhấn trọng âm ở những chỗ không đoán trước được.'
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n18
  cau: 'Theo dõi, dòng 5: các giai điệu ngắn, như dân ca, xuất hiện trên nền nhịp dậm; ngày
    càng nhiều nhạc cụ tham gia.'
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n20
  cau: 'Câu hỏi 2: Hồ thiên nga của Tchaikovsky công diễn lần đầu năm 1877, chỉ 36 năm trước
    Le Sacre.'
  loai: nam
- trang: nghe-nhac/stravinsky-sacre
  id: n24
  cau: 'Mục Nguồn: tổng phổ Édition Russe de Musique 1921 quét trên Internet Archive (Đại
    học Toronto); IMSLP; ghi chú chương trình của Peter Laki (Dàn nhạc Cleveland) và Phillip
    Huscher (Yellow Barn).'
  loai: ten
- trang: nghe-nhac/stravinsky-sacre
  id: n19
  cau: 'Câu hỏi 1 và 3: có đoán được trọng âm tiếp theo không; hợp âm lặp có "khó nghe" không,
    nghe lại lần ba cảm giác có khác.'
  loai: khuyen-tap
