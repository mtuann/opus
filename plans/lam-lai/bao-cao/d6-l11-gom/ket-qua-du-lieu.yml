  id: n4
  luot_2: dung
  nguon: ["https://schwarzman.yale.edu/program-note"]
  ghi_chu: "Ghi chú chương trình của Yale Schwarzman Center: 'Rhythm and dissonance are the most immediately striking features of The Rite of Spring'."
- trang: du-lieu/tac-pham/stravinsky-sacre
  id: n5
  luot_2: dung
  nguon: ["https://imslp.org/wiki/The_Rite_of_Spring,_K015_(Stravinsky,_Igor)"]
  ghi_chu: "IMSLP: '2 parts: I. L'adoration de la terre … II. Le sacrifice'."
- trang: du-lieu/tac-pham/stravinsky-sacre
  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/The_Rite_of_Spring,_K015_(Stravinsky,_Igor)"]
  ghi_chu: "IMSLP: phần I L'adoration de la terre (Tôn thờ đất mẹ), mở bằng 1. Introduction, 2. Les Augures printaniers (Điềm báo mùa xuân), rồi 3–7."
- trang: du-lieu/tac-pham/stravinsky-sacre
  id: n7
  luot_2: dung
  nguon: ["https://imslp.org/wiki/The_Rite_of_Spring,_K015_(Stravinsky,_Igor)"]
  ghi_chu: "IMSLP: phần II Le sacrifice (Lễ hiến tế), số 8–12, kết bằng 13. Danse sacrale (L'élue) (Vũ điệu hiến tế)."
