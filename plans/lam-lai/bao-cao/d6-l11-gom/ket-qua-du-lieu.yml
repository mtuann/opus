- trang: du-lieu/tac-pham/brahms-4
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)"]
  ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Romantic; viết 1884–85."
- trang: du-lieu/tac-pham/brahms-4
  id: n5
  luot_2: dung
  nguon: ["http://www.kellydeanhansen.com/opus98.html", "https://theinstrumentalist.com/october-2010-flute-talk/flute-solo-from-the-brahms-symphony-4-final-movement/"]
  ghi_chu: "Hướng dẫn nghe của Kelly Dean Hansen: chương 4 là chủ đề tám ô nhịp (Chaconne/passacaglia) rồi Variation 1 đến Variation 30, sau đó Coda (Più Allegro, ô 253). The Instrumentalist: 'variations on the opening eight-bar ground'. Có ghi chú chương trình đếm 32 biến tấu (Dayton, Christopher Weeks), nhưng cách đánh số chuẩn theo tổng phổ là 30 biến tấu cộng coda."
- trang: du-lieu/tac-pham/brahms-4
  id: n6
  luot_2: dung
  nguon: ["http://www.kellydeanhansen.com/opus98.html"]
  ghi_chu: "Hansen: chủ đề tám ô, 30 biến tấu, mỗi biến tấu tám ô (riêng 12–15 ở nhịp 3/2 nên ô dài gấp đôi; biến tấu 30 kéo dài thành đoạn chuyển), rồi coda. Phần 'độ dài các ô gần đúng' là chú thích về hình."
- trang: du-lieu/tac-pham/brahms-4
  id: n7
  luot_2: dung
  nguon: ["http://www.kellydeanhansen.com/opus98.html", "https://theinstrumentalist.com/october-2010-flute-talk/flute-solo-from-the-brahms-symphony-4-final-movement/"]
  ghi_chu: "Hansen: phần một gồm biến tấu 1–11, nhịp 3/4, giọng chủ Mi thứ; biến tấu 12 là sáo độc tấu (nhịp 3/2); 13–15 ở Mi trưởng ('first variation in the major key (E major)'); từ biến tấu 16 'back in the minor key'; Coda từ ô 253. The Instrumentalist: biến tấu 12 là sáo, 13–15 ở Mi trưởng. Nhãn giọng ở hình là giọng chung của từng phần: trong đó biến tấu 10–11 bắt đầu ở La thứ, 27–28 ở Đô trưởng (Hansen). Đây là cách giản lược chấp nhận được, không sai."
- trang: du-lieu/tac-pham/dvorak-9-largo
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)"]
  ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Romantic; viết năm 1893."
- trang: du-lieu/tac-pham/dvorak-9-largo
  id: n5
  luot_2: dung
  nguon: ["https://www.antonin-dvorak.cz/en/work/symphony-no-9/"]
  ghi_chu: "antonin-dvorak.cz: chủ đề chính của Largo 'delivered by the cor anglais'; tổng phổ đã sửa so với bản phác thảo, 'intensifying the pentatonic character of the melody'; gam ngũ cung là một nét đặc trưng của tác phẩm."
- trang: du-lieu/tac-pham/dvorak-9-largo
  id: n6
  luot_2: dung
  nguon: ["https://www.antonin-dvorak.cz/en/work/symphony-no-9/"]
  ghi_chu: "antonin-dvorak.cz mô tả: chuỗi hợp âm mở đầu, chủ đề chính (cor anglais), đoạn giữa ở Đô♯ thứ, đoạn gần như scherzo, rồi chủ đề chính trở lại nhẹ nhàng và chuỗi hợp âm mở đầu ở cuối. Đó là hình thức ba đoạn (A–B–A) có mở và kết; trang không dùng chữ 'ternary' nhưng mô tả đúng sơ đồ ấy."
- trang: du-lieu/tac-pham/dvorak-9-largo
  id: n7
  luot_2: dung
  nguon: ["https://www.antonin-dvorak.cz/en/work/symphony-no-9/", "https://imslp.org/wiki/Symphony_No.9,_Op.95_(Dvo%C5%99%C3%A1k,_Anton%C3%ADn)"]
  ghi_chu: "antonin-dvorak.cz: chuỗi hợp âm của kèn gỗ, kèn đồng ở đầu chương kết ở Rê♭ trưởng; chủ đề do cor anglais thổi; đoạn giữa 'in C sharp minor'; tiếp theo là đoạn gần như scherzo ở Đô♯ trưởng, cao trào gom chủ đề Largo, chủ đề chính và chủ đề kết của chương 1 (ô 'Đoạn sáng, chủ đề chương 1 vang lại'); kết bằng chủ đề chính trở lại và hợp âm mở đầu. Đủ khớp các ô của hình."
- trang: du-lieu/tac-pham/grieg-buoi-sang
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Peer_Gynt_Suite_No.1,_Op.46_(Grieg,_Edvard)"]
  ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Romantic."
- trang: du-lieu/tac-pham/grieg-buoi-sang
  id: n5
  luot_2: dung
  nguon: ["https://www.nashvillesymphony.org/media/1567/15-16-curriculumpacket-picturethis.pdf", "https://lagaleriesymphonique.osq.org/en/listen/peer-gynt-suite-n0-1-opus-46/", "https://audienceaccess.co/bio/LBS-18272"]
  ghi_chu: "Tài liệu của Nashville Symphony (trích ghi chú Naxos): 'It uses the pentatonic scale'. OSQ: 'The main theme is first played by the flute and the oboe in alternation'. Ghi chú chương trình LBS: sáo độc tấu mở đầu, oboe tiếp theo."
- trang: du-lieu/tac-pham/part-spiegel
  id: n3
  luot_2: dung
  nguon: ["https://brahms.ircam.fr/en/works/work/30209"]
  ghi_chu: "IRCAM: viết năm 1978, Arvo Pärt (sinh 1935, không ghi năm mất). Tác giả còn sống, tác phẩm cuối thế kỷ 20 theo lối tintinnabuli: xếp Đương đại là hợp lý."
- trang: du-lieu/tac-pham/part-spiegel
  id: n4
  luot_2: dung
  nguon: ["https://interlude.hk/infinite-reflections-arvo-parts-spiegel-im-spiegel/"]
  ghi_chu: "Interlude (Frances Wilson): viết theo lối tintinnabuli, có 'a meditative and serene simplicity', bè piano mang 'the tintinnabular voice'. Trang chính thức của UE trả 403."
- trang: du-lieu/tac-pham/puccini-nessun-dorma
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Romantic; Turandot năm 1926. Cũng có thể xếp verismo hay đầu thế kỷ 20, nhưng xếp Lãng mạn là hợp lý."
- trang: du-lieu/tac-pham/puccini-nessun-dorma
  id: n5
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Turandot_(Puccini,_Giacomo)"]
  ghi_chu: "IMSLP: \"Aria: 'Nessun dorma' (Act III)\" (bản thu là của Jacques Pottier, giọng tenor); trong danh sách vai, Calaf là tenor."
- trang: du-lieu/tac-pham/ravel-bolero
  id: n3
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Bol%C3%A9ro_(Ravel,_Maurice)"]
  ghi_chu: "IMSLP: Composer Time Period và Piece Style đều là Early 20th century; viết năm 1928."
- trang: du-lieu/tac-pham/ravel-bolero
  id: n4
  luot_2: dung
  nguon: ["https://www.tucsonsymphony.org/program-notes/ravel/bolero/", "https://www.clevelandorchestra.com/works/bolro"]
  ghi_chu: "Tucson Symphony: hai chủ đề không đổi, 'only the instruments playing them' đổi (sáo, clarinet, bassoon, saxophone, oboe d'amore…). Cleveland Orchestra: giai điệu đi qua từng nhạc cụ; Ravel gọi tác phẩm là một thí nghiệm về phối khí."
- trang: du-lieu/tac-pham/shostakovich-5
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)"]
  ghi_chu: "IMSLP: viết năm 1937; Piece Style là Early 20th century (Composer Time Period là Modern)."
- trang: du-lieu/tac-pham/shostakovich-5
  id: n5
  luot_2: dung
  nguon: ["https://res.cloudinary.com/minnesota-orchestral/image/upload/v1695020998/Uploads/PDF/Program-Notes/2023-24/010_Sept-Oct_2023_Valcuha_Conducts_Shostakovich_Symphony_No_5.pdf", "https://eclassical.textalk.se/shop/17115/art95/5052795-96d312-0822231180265_01.pdf"]
  ghi_chu: "Minnesota Orchestra (Eric Bromberger): tác phẩm viết sau bài báo Pravda tháng 1/1936 công kích Lady Macbeth, có lẽ do Stalin ra lệnh. Tập sách đĩa LSO (Andrew Huth): 'a Soviet artist's practical creative reply to just criticism'; cuộc tranh cãi về ý nghĩa của chương cuối."
- trang: du-lieu/tac-pham/shostakovich-5
  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", "https://www.wisemusicclassical.com/work/33040/Symphony-No-5-in-D-Minor--Dmitri-Shostakovich/"]
  ghi_chu: "IMSLP và Wise Music (bản tóm tắt của Sikorski): 4 chương, Moderato, Allegretto, Largo, Allegro non troppo."
- trang: du-lieu/tac-pham/shostakovich-5
  id: n7
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)", "https://vermontsymphonyorchestra.blogspot.com/2008/04/shostakovich-symphony-no-5.html"]
  ghi_chu: "IMSLP: chương I Moderato, giọng của tác phẩm là Rê thứ. Vermont SO: 'its tonal journey from a dark d minor'; Shenandoah: 'The symphony is in D minor', chương 1 mở đầu gợi Giao hưởng số 9 của Beethoven, cũng ở Rê thứ."
- trang: du-lieu/tac-pham/shostakovich-5
  id: n8
  luot_2: dung
  nguon: ["https://www.benjaminzander.org/uploads/2021/04/Shostakovich_-Symphony-no.-5.pdf", "https://kennethwoods.net/blog1/2012/03/15/explore-the-score-shostakovich-symphony-no-5-in-d-minor/"]
  ghi_chu: "Ghi chú chương trình trên trang Benjamin Zander: 'the scherzo, in A minor and marked Allegretto'. Kenneth Woods: chương 2 kết 'in A minor'."
- trang: du-lieu/tac-pham/shostakovich-5
  id: n9
  luot_2: dung
  nguon: ["https://www.benjaminzander.org/uploads/2021/04/Shostakovich_-Symphony-no.-5.pdf", "https://kennethwoods.net/blog1/2012/03/15/explore-the-score-shostakovich-symphony-no-5-in-d-minor/", "https://www.filharmonikusok.hu/en/?p=91605"]
  ghi_chu: "Zander: 'the slow movement in F sharp minor'. Woods: Largo, 'The brass remain silent throughout'. Budapest Philharmonic: 'Largo in which the brass is silent'. Tập sách đĩa LSO (Huth): 'The brass instruments are all silent'."
- trang: du-lieu/tac-pham/shostakovich-5
  id: n10
  luot_2: dung
  nguon: ["https://www.wisemusicclassical.com/work/33040/Symphony-No-5-in-D-Minor--Dmitri-Shostakovich/", "https://kennethwoods.net/blog1/2012/03/15/explore-the-score-shostakovich-symphony-no-5-in-d-minor/", "https://www.filharmonikusok.hu/en/?p=91605"]
  ghi_chu: "Wise Music (Sikorski): '4. Allegro non troppo – Allegro – Più mosso'. Kenneth Woods (nhạc trưởng, đọc từ tổng phổ): chủ đề hành khúc mở đầu chương cuối có bốn nốt đầu A D E F (Rê thứ); ở coda, kèn đồng đưa chủ đề ấy trở lại 'now in triumphant D major'. Budapest Philharmonic: kết bằng hợp âm Rê trưởng giữ hơn một phút. Không có nguồn nào nói thẳng 'chương 4 mở đầu ở Rê thứ', nhưng bốn nốt A–D–E–F với Fa thường và việc chủ đề 'now' ở Rê trưởng xác nhận vế ấy."
- trang: du-lieu/tac-pham/stravinsky-sacre
  id: n3
  luot_2: dung
  nguon: ["https://imslp.org/wiki/The_Rite_of_Spring,_K015_(Stravinsky,_Igor)"]
