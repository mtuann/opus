  cu: '[Sáng tác / xuất bản, ''Phác thảo ở Vienna năm 1831, hoàn thành ở Paris năm 1835; in năm 1836 đồng thời ở Leipzig, Paris và London. Đề tặng "Monsieur le Baron de Stockhausen", một nhà ngoại giao của Hanover ở Paris'']'
  moi: '[Sáng tác / xuất bản, ''Hoàn thành năm 1835, ở Paris (hợp đồng in ký ngày 9/1/1836); IMSLP ghi một bản đầu có thể từ năm 1831. In năm 1836 ở Leipzig (tháng 6), Paris (tháng 7) và London (tháng 8). Đề tặng "Mr le Baron de Stockhausen", đại sứ của Hanover ở Paris'']'
  nhan_dinh: n17
  nguon:
    - https://www.henle.de/media/0a/69/3d/1690886076/0867-1690886076-sync.pdf
    - https://www.henle.de/media/0a/08/a8/1756813235/0867en.pdf
    - https://imslp.org/wiki/Ballade_No.1,_Op.23_(Chopin,_Fr%C3%A9d%C3%A9ric)
  ly_do: 'Lời tựa Henle HN 867: lịch sử sáng tác ít tài liệu, hợp đồng Breitkopf 9/1/1836, "Thus the work was composed in 1835"; bản Đức 6/1836, Pháp 7/1836, Anh 8/1836 (không đồng thời). Không nguồn đã mở nói phác thảo ở Vienna; IMSLP "1831? (first version)". Đề tặng theo trang bìa bản tay (Henle) và IMSLP ("Hanover''s ambassador to Paris"). Trang bài học đã viết theo cùng nguồn (hồ sơ trang n14).'
