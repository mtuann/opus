  truong: hinh
  cu: "hinh.bai-hoc[0].doan: [Cadenza 1, từ ô 24, 3, cad] và [A', 'ô 27–36 · Più animato, mở đầu ở Si trưởng', 10, b]"
  moi: "hinh.bai-hoc[0].doan: [Cadenza 1, ô 24–25, 2, cad] và [A', 'ô 26–36 · Più animato, mở đầu ở Si trưởng', 11, b]"
  nhan_dinh: n27, n28
  nguon:
    - https://www.digitale-sammlungen.de/view/bsb11307527
    - https://archive.org/details/lisztconsolation00unse
    - https://www.henle.de/media/bd/96/f0/1690886039/0634-1690886039-sync.pdf
  ly_do: 'Bản in đầu (Kistner 1850, bản Henle dựa vào) và Schirmer 1915: cadenza thứ nhất là một ô không vạch nhịp (ô 25), ô 24 dẫn vào; Più animato con passione ở ô 26; đoạn Si trưởng 26–36 (11 ô). Henle Comments đánh số khớp (ô 44, 51, 53). Tổng vẫn 85 (23 + 2 + 11 + 24 + 25). Trang bài học đã sửa theo (hồ sơ trang n33, n34, n42, n43).'
