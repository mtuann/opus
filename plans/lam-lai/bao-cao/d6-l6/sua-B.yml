# Sửa dữ liệu đề xuất ở lượt 1, phần B của D6-L6 (src/data/ chưa sửa). Mỗi mục: bản ghi, trường, giá trị cũ và mới, nhận định trong hồ sơ, nguồn, lý do.
# thong_tin hiện trên trang qua ::hop-tac-pham, hinh qua ::hinh-cau-truc: áp xong thì thêm doi_chu cho trang tương ứng (bài học: thong_tin, hinh.bai-hoc; hướng dẫn nghe: hinh.nghe).
- ban_ghi: tac-pham/liszt-liebestraum
  truong: thong_tin
  cu: "[Độ khó, 'Khoảng ABRSM Grade 8 trở lên (ước lượng), chặng 7 của [lộ trình](/opus/piano/lo-trinh/). Henle xếp mức 7 trên thang 9 (\"khó\"), trên hai bài kia của tập (mức 6)']"
  moi: "[Độ khó, 'Henle xếp mức 7 trên thang 9 (\"khó\"), trên hai bài kia của tập (mức 6); RCM (đề cương 2022) đặt bài ở danh sách ARCT; ABRSM không xếp bài vào Grade nào']"
  nhan_dinh: n22
  nguon:
    - https://www.henle.de/en/Liebestraeume-3-Notturnos/HN-634
    - https://teacherportal.rcmusic.com/getattachment/57f3734d-97e5-4777-b67e-4b1111ee31a3/piano-syllabus-2022-edition.pdf
  ly_do: 'Bỏ ước lượng ABRSM như D6-L1-gom, D6-L4. Henle: "Hohe Liebe 6, Seliger Tod 6, O lieb … 7 difficult"; RCM 2022 tr. 102, ARCT in Piano, Performer: "Liebestraum No. 3, S 541/3"; ABRSM không có bài trong đề cương 2017–2028 (hồ sơ bản ghi, lần 1, n4). Chip "≈ Grade 8 trở lên" giữ (dựng từ grade đã khóa). Vế chặng bỏ cho gọn; muốn giữ thì thêm "; chặng 7 của [lộ trình](/opus/piano/lo-trinh/)".'
