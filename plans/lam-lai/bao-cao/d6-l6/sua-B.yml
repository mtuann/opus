- ban_ghi: tac-pham/liszt-liebestraum
  truong: hinh
  cu: "hinh.nghe[0].doan: [Cadenza 1, 'nốt nhỏ, không vạch nhịp', 2, cad]; [Dồn lên cao trào, sempre stringendo · quãng tám, 21, dev]; [Cadenza 2, quãng ba gãy đi xuống, 2, cad]; [A'', La♭ trưởng · lắng dần đến kết, 26, a]"
  moi: "hinh.nghe[0].doan: [Cadenza 1, 'nốt chạy liền, không vạch nhịp', 2, cad]; [Dồn lên cao trào, sempre stringendo · quãng tám, 23, dev]; [Cadenza 2, 'leggiero, trôi xuống', 1, cad]; [A'', La♭ trưởng · lắng dần đến kết, 25, a]"
  nhan_dinh: n34, n36, n37, n38
  nguon:
    - https://www.digitale-sammlungen.de/view/bsb11307527
    - https://archive.org/details/lisztconsolation00unse
  ly_do: 'Bản in đầu: cadenza in nốt cỡ thường (không phải nốt nhỏ); cadenza thứ hai (ô 60) ghi leggiero, hình nốt không phải quãng ba gãy (trang nghe đã sửa, hồ sơ trang n34, n42). Độ dài: ô 37–59 là 23 ô, cadenza 2 một ô (60), A'''' 61–85 là 25 ô; tổng 23 + 2 + 11 + 23 + 1 + 25 = 85. Phần độ dài có điều kiện: chu_thich ghi "độ dài các ô gần đúng", nên nếu người gom muốn giữ ô cadenza rộng hơn cho dễ đọc thì chỉ áp phần chữ (cadenza 1, cadenza 2).'
