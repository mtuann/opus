# Lượt 2 bổ sung của lô D3-L1, sau review (loi-giao/luot-2-trang.md), một agent độc lập với lượt 1, lượt 2 trước và review:
# 6 nhận định có chữ mới hay vừa đổi sang loại cần nguồn (05 n10, n11; 06 n14, n22, n23; 07 n29) và 3 lời khuyên tập cho đủ
# mẫu 3 câu mỗi trang (04 n26, 06 n20, 07 n40). Kết quả: 9 dung. OMT trả 403 nên đọc qua Wayback Machine.
- trang: nhac-ly/04-nhip
  id: n26
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "Lời khuyên tập, không cần nguồn: hợp lý, hợp cách dạy phổ biến, không trái trang lõi khác. Đối chiếu Open Music Theory, chương Compound Meter and Time Signatures: nhịp 6/8 có hai phách (nốt đen chấm), mỗi phách chia ba, 'the first accented and the second and third non-accented'; đếm 1-2-3-4-5-6 theo nốt móc đơn thì hai chỗ nhấn là 1 và 4. OMT dạy cách đếm '1 la li 2 la li' và ghi rõ giáo viên có thể dùng cách đếm khác; đếm 1 đến 6 là cách đơn giản vẫn thường dạy, không trái nguồn. OMT trả 403 cho công cụ nên đọc bản lưu Wayback: https://web.archive.org/web/20251211145536/https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"

- trang: nhac-ly/05-dau-hoa
  id: n10
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/", "https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/"]
  ghi_chu: "OMT trả 403 cho công cụ nên đọc bản lưu Wayback của đúng hai chương: https://web.archive.org/web/20260103153222/https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/ và https://web.archive.org/web/20260124212635/https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/. Chương Half Steps, Whole Steps, and Accidentals: thăng kép (thường vẽ như dấu x, ít gặp hơn là hai dấu thăng) nâng nốt 'two half steps (i.e., a whole step)'; giáng kép hạ nốt 'two half steps (i.e., a whole step)'; một cung là hai nửa cung. Chương Pitch and Pitch Class: danh sách ghi lớp cao độ G gồm F thăng kép, tức Fa× nghe như Sol."

- trang: nhac-ly/05-dau-hoa
  id: n11
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/intervals/", "https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/"]
  ghi_chu: "OMT trả 403 cho công cụ nên đọc bản lưu Wayback: https://web.archive.org/web/20251209203725/https://viva.pressbooks.pub/openmusictheory/chapter/intervals/ và https://web.archive.org/web/20260103153222/https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/. Chương Intervals, ví dụ 7 (quãng giảm): nốt Mi đã giáng bị hạ thêm ('lowered again') thành Mi giáng kép; nốt Sol♯ nâng thêm nửa cung thành Sol thăng kép ('further contracting the interval by another half step'). Đúng cơ chế của câu: nốt đã mang dấu hóa bị nâng hay hạ thêm nửa cung thì thành dấu kép, như Fa♯ lên Fa×. Chương Half Steps, Whole Steps, and Accidentals: thăng nâng nửa cung, thăng kép nâng hai nửa cung. Lưu ý nhỏ: OMT gọi thăng, giáng, bình là ba dấu 'most common', nên 'hay gặp khi' chỉ nên hiểu là 'thường nảy sinh trong tình huống này', không phải 'dùng nhiều'."

- trang: nhac-ly/06-gam-truong
  id: n14
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/", "https://viva.pressbooks.pub/openmusictheory/chapter/roman-numerals/", "https://www.teoria.com/en/reference/d/degrees.php", "https://www.tonggiaophanhanoi.org/nhac-ly-can-ban-cua-duc-hong-y-giuse-maria-trinh-van-can/", "https://books.ed.ac.uk/edinburgh-diamond/catalog/view/ed-9781912669226/5/89"]
  ghi_chu: "Phần 'từ 1 đến 7': OMT, chương Major Scales, Scale Degrees, and Key Signatures, viết bậc bằng số Ả Rập có dấu mũ, ^1 đến ^7 (một số giáo viên dùng ^8 cho nốt cuối). Phần 'số La Mã': teoria.com, mục Reference: names of degrees, viết 'referring to the degrees of the major and minor scales by Roman numerals' (I đến VII); giáo trình tiếng Việt Nhạc lý căn bản của Đức Hồng Y Giuse Maria Trịnh Văn Căn (đăng ở tonggiaophanhanoi.org; trang gốc trả 403, đọc bản lưu Wayback 20251030133525) gọi các nốt của gam là bậc I, II, ... VII, VIII ('Bậc I bao giờ cũng được gọi là chủ âm hoặc nốt chủ'; 'Những âm bậc I – III – V là những âm ổn định'). Lưu ý: OMT (chương Roman Numerals, bảng bậc 1-7 với I-VII) và giáo trình mở của Univ. of Edinburgh dành số La Mã cho hợp âm xây trên bậc, không cho từng nốt; nên 'nhiều sách' đúng nhưng đó không phải quy ước của OMT. Không mâu thuẫn với câu. OMT trả 403 cho công cụ nên đọc bản lưu Wayback: https://web.archive.org/web/20260120053244/https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/ và https://web.archive.org/web/20260109133744/https://viva.pressbooks.pub/openmusictheory/chapter/roman-numerals/"

- trang: nhac-ly/06-gam-truong
  id: n20
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"]
  ghi_chu: "Lời khuyên tập, không cần nguồn: hợp lý và là bài tập nghe quen thuộc, hát lên tới Si (âm dẫn) rồi dừng thì thấy gam chưa xong, muốn về Đô. Khớp OMT, chương Minor Scales, Scale Degrees, and Key Signatures: cảm giác trọn vẹn của gam trưởng đến 'in part by the ascending semitone between ti and do' và nhắc người học tự hát để nghe. Không dính sức khỏe, không trái trang lõi khác. OMT trả 403 cho công cụ nên đọc bản lưu Wayback: https://web.archive.org/web/20251205150615/https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"

- trang: nhac-ly/06-gam-truong
  id: n22
  luot_2: dung
  nguon: ["https://archive.org/details/Virtuoso_Pianist_Hanon", "https://en.wikiversity.org/wiki/Piano/How_to_read_piano_music_and_play_scales_using_proper_technique", "https://web.archive.org/web/20160102012523/https://www.uncp.edu/academics/colleges-schools-departments/departments/music/areas-study/keyboard/scale-fingerings", "https://openbooks.library.baylor.edu/pianobasics/chapter/two-octave-major-scales/"]
  ghi_chu: "Đã xem trang scan Hanon, The Virtuoso Pianist, số 39 (archive.org, mục Virtuoso_Pianist_Hanon, trang 49 của file PDF): ô nhịp đầu của Đô trưởng ghi tay phải 1-2-3-1-2-3-4-1 và tay trái 5-4-3-2-1-3-(2)-1; nốt Si ở tay trái không in số (ngón 2 suy ra), ngón 1 ở Đô cao nhất vì gam của Hanon chạy tiếp lên quãng tám sau. Wikiversity ghi thẳng cho một quãng tám C D E F G A B C: tay phải 1 2 3 1 2 3 4 5, tay trái 5 4 3 2 1 3 2 1. Trang Scale Fingerings của khoa nhạc Univ. of North Carolina at Pembroke (trang gốc nay 404, đọc bản lưu Wayback 20160102012523): nhóm C, G, D, A, E, F tay phải 1,2,3,1,2,3,4, tay trái 1,4,3,2,1,3,2, '5th finger may be used on lowest LH note and highest RH note' (suy ra 5-4-3-2-1-3-2-1 và 1-2-3-1-2-3-4-5). Giáo trình mở Baylor Piano Basics (trang gốc trả 403, đọc bản lưu Wayback 20260510042837): công thức hai quãng tám LH 5+4321+321+4321+321, RH 123+1234+123+1234+5 và 'Use finger 5 only for the highest note of the scale in the right hand and the lowest note ... for the left hand'; cắt còn một quãng tám ra đúng dãy trong câu (suy ra)."

- trang: nhac-ly/06-gam-truong
  id: n23
  luot_2: dung
  nguon: ["https://en.wikiversity.org/wiki/Piano/How_to_read_piano_music_and_play_scales_using_proper_technique", "https://www.cs.miami.edu/home/burt/music/finger-charts.html", "https://archive.org/details/Virtuoso_Pianist_Hanon", "https://www.piano-keyboard-guide.com/?p=183"]
  ghi_chu: "Chiều đi lên, nguồn nói thẳng: Wikiversity ('the thumb goes under the middle finger as the scale progresses from E to F' ở tay phải; 'the middle finger is tucked over the thumb as the scale progresses from G to A' ở tay trái) và bảng ngón bấm của Univ. of Miami (trang cs.miami.edu/home/burt, chủ trang ghi lại bảng do Prof. Escadon đưa khi học ở Miami, khoảng 1999): ở Đô trưởng ngón 3 tay trái vắt qua ngón cái để bấm La, ngón cái tay phải luồn dưới ngón 3 để bấm Fa. Hanon số 39 (scan archive.org, trang 49 của PDF) cho cùng dãy số: Mi ngón 3 rồi Fa ngón 1 (tay phải), Sol ngón 1 rồi La ngón 3 (tay trái). Chiều đi xuống là suy ra từ số ngón (mỗi nốt giữ nguyên ngón): tay phải Fa (1) sang Mi (3) là ngón 3 vắt qua ngón cái; tay trái La (3) sang Sol (1) là ngón cái luồn dưới ngón 3, đúng 'ngược lại'. piano-keyboard-guide.com (trang hướng dẫn phổ thông, chỉ để đối chiếu) viết đúng vậy cho Đô trưởng."

- trang: nhac-ly/07-gam-thu
  id: n29
  luot_2: dung
  nguon: ["https://web.archive.org/web/20160102012523/https://www.uncp.edu/academics/colleges-schools-departments/departments/music/areas-study/keyboard/scale-fingerings", "https://archive.org/details/Virtuoso_Pianist_Hanon", "https://pianoscales.org/minor-harmonic.html", "https://www.cs.miami.edu/home/burt/music/finger-charts.html", "https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/", "https://robertkelleyphd.com/home/scalfing.htm"]
  ghi_chu: "Trang Scale Fingerings của khoa nhạc Univ. of North Carolina at Pembroke (trang gốc nay 404, đọc bản lưu Wayback 20160102012523): gam trưởng nhóm C, G, D, A, E, F có chung một dãy ngón; hòa âm thứ nhóm c, g, d, a, e, f 'Fingering exactly like Major Scales', gồm La thứ. Hanon số 39 (scan archive.org, trang 49 của PDF): 'A minor, relative to C major' dạng 1 (hòa âm, 'harmonic minor') ô nhịp đầu ghi tay phải 1-2-3-1-2-3-4-1, tay trái 5-4-3-2-1-3-2-1 (ngón 2 ở Sol♯), trùng Đô trưởng ngay trên trang. pianoscales.org ghi La thứ hòa âm: tay trái 5,4,3,2,1,3,2,1, tay phải 1,2,3,1,2,3,4,5. Bảng Univ. of Miami: gam bắt đầu C, D, E, G, A (mọi dạng) đều có ngón 4 tay trái ở bậc II, ngón 4 tay phải ở bậc VII. OMT, chương Minor Scales (bản lưu Wayback 20251205150615, vì OMT trả 403): La thứ không có dấu hóa, hòa âm chỉ nâng bậc 7 nên Sol♯ là phím đen duy nhất. Bảng ngón 'tối ưu' của Robert Kelley có dạng khác cho tay trái, nhưng chính trang đó ghi nó có thể không phải cách thường dạy trong sách phương pháp."

- trang: nhac-ly/07-gam-thu
  id: n40
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/"]
  ghi_chu: "Lời khuyên tập, không cần nguồn: hợp lý cho La thứ hòa âm. OMT, chương Minor Scales, Scale Degrees, and Key Signatures (OMT trả 403 nên đọc bản lưu Wayback 20251205150615): 'C major does not have any sharps or flats in its key signature, and neither does A minor'; hòa âm là gam thứ tự nhiên 'with a raised leading tone', tức chỉ nâng bậc 7 (Sol thành Sol♯). Chỉ đúng cho dạng hòa âm: La thứ giai điệu đi lên còn nâng cả bậc 6 (Fa♯)."
