  - https://imslp.org/wiki/Rite_of_Spring_(Stravinsky,_Igor)
  - https://id.loc.gov/authorities/names/n81082738.json
  ghi_chu: 'Referent is certain: IMSLP ''Rite of Spring'' (alt. ''Le sacre du printemps''; Russian Весна священная), Stravinsky, Igor, 1910-13; LoC n81082738: ''The Rite of Spring = Le sacre du printemps''. But no rank-2 source fixes a Vietnamese title and the Vietnamese renderings in use differ (rank 3): ''Nghi lễ mùa Xuân'' (Thanh Tra 2013: https://thanhtra.com.vn/van-hoa-the-thao-BE2162E3A/nghi-le-mua-xuan-qua-vu-dieu-ba-le-4552FEB5.html ; also the title of the vi.wikipedia article), ''Mùa xuân thiêng liêng'' (HBSO 2019 production, listed as ''MÙA XUÂN THIÊNG LIÊNG'' on http://www.hbso.org.vn/chuong-trinh.html&p=18 and described as Stravinsky''s The Rite of Spring by https://baovanhoa.vn/san-khau-mua/mua-xuan-thieng-lieng-duoc-danh-gia-bao-liet-dien-ro-da-tro-lai-50845.html), ''Lễ bái xuân'' (https://nhaccodien.vn/le-sacre-du-printemps-le-bai-xuan/ ; Tuổi Trẻ 2024). So ''là tên tiếng Việt'' cannot be confirmed as the Vietnamese name. Suggest rewording to ''bản dịch tiếng Việt'' or accepting
    it as an editorial translation choice at review.'
