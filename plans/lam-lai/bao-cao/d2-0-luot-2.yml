  ghi_chu: 'ABRSM places this exact piece in its ARSM repertoire list (diploma, after Grade 8): "Impromptu in G-flat, Op.90 no.3, D899/3"; it is in none of the ABRSM Grade 1-8 lists I could open (2013-26). Henle level 6 with "ABRSM: Piano ARSM", whereas the A-flat Impromptu Op.142/2 (Henle 5) is "ABRSM: Piano Grade 8 recommended" and is the Schubert impromptu on the Grade 8 lists; RCM 2022 Level 10. All three put it at Grade 8 or above, so "Grade 7-8" understates it.'
