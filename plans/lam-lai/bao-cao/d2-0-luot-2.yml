  - https://id.loc.gov/authorities/names/n80149485.json
  ghi_chu: 'Referent is certain: IMSLP ''Pictures at an Exhibition'' (alt. Картинки с выставки; Tableaux d''une Exposition; ''Pictures from the Exhibition (exact translation)''), Mussorgsky, Modest, piano, 1874; LoC n80149485 ''Kartinki s vystavki'' (= Pictures at an exhibition = Tableaux d''une exposition). But NO rank-2 source states a Vietnamese title, so ''là tên tiếng Việt'' cannot be confirmed. Vietnamese usage (rank 3 only, not usable as sole source) varies: https://nhaccodien.vn/mussorgsky-nhung-buc-tranh-trong-phong-trien-lam/ gives ''Những bức tranh trong phòng triển lãm''; the vi.wikipedia article on Mussorgsky says ''Những bức tranh tại một phòng triển lãm''; the HBSO concert page http://www.hbso.org.vn/chuong-trinh/dem-nhac-tchaikovsky-mussorgsky-bartok-976.html (official institution, program of 20/06/2026) uses only the English title. Suggest rewording to ''bản dịch tiếng Việt'' (a translation) or accepting the title as an editorial translation choice at review.'
