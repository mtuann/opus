- trang: nghe-nhac/brahms-intermezzo
  id: n1
  cau: 'Nhà soạn nhạc: Johannes Brahms (1833–1897).'
  loai: nam
- trang: nghe-nhac/brahms-intermezzo
  id: n2
  cau: 'Tên đầy đủ: Intermezzo cung La trưởng, Op. 118 số 2 (Andante teneramente), trong Sechs
    Klavierstücke (Sáu tiểu phẩm cho piano), Op. 118.'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n3
  cau: Bài được viết vào mùa hè năm 1893 ở Bad Ischl (Áo).
  loai: nam
- trang: nghe-nhac/brahms-intermezzo
  id: n4
  cau: Tập được nhà Simrock (Berlin) in vào cuối năm 1893.
  loai: nam
- trang: nghe-nhac/brahms-intermezzo
  id: n5
  cau: 'Thời kỳ: Cuối Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n6
  cau: 'Thể loại: intermezzo, tiểu phẩm trữ tình cho piano.'
  loai: dinh-nghia
- trang: nghe-nhac/brahms-intermezzo
  id: n7
  cau: Độ dài khoảng 5–6 phút.
  loai: so-lieu
- trang: nghe-nhac/brahms-intermezzo
  id: n8
  cau: Trong hai năm 1892–1893, Brahms viết bốn tập tiểu phẩm piano cuối cùng, từ Op. 116
    đến Op. 119.
  loai: nam
- trang: nghe-nhac/brahms-intermezzo
  id: n9
  cau: Tập Op. 118 hoàn thành vào mùa hè 1893 ở thị trấn nghỉ dưỡng Bad Ischl.
  loai: nam
- trang: nghe-nhac/brahms-intermezzo
  id: n10
  cau: Op. 118 gồm bốn intermezzo, một ballade và một romance.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n11
  cau: Từ nơi nghỉ hè ấy, Brahms gửi bản chép tay cho Clara Schumann.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n12
  cau: Clara Schumann là nghệ sĩ piano lừng danh và người bạn thân thiết của Brahms suốt hơn
    bốn mươi năm.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n13
  cau: Clara là một trong những người đầu tiên được biết các bản mới.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n14
  cau: Clara khen các bản mới chứa cả một kho cảm xúc trong khuôn khổ nhỏ bé.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n15
  cau: Intermezzo nghĩa đen là "khúc chen giữa".
  loai: dinh-nghia
- trang: nghe-nhac/brahms-intermezzo
  id: n16
  cau: Ở Brahms cuối đời, intermezzo là tên ông đặt cho những bản nhạc piano ngắn, đứng riêng,
    mang tính trầm tư.
  loai: dinh-nghia
- trang: nghe-nhac/brahms-intermezzo
  id: n17
  cau: 'Bản số 2 ghi Andante teneramente: vừa phải như bước đi, dịu dàng.'
  loai: dinh-nghia
- trang: nghe-nhac/brahms-intermezzo
  id: n18
  cau: 'Ba nốt đầu tiên như một hạt giống: trong đoạn A, nhóm nốt ấy trở lại nhiều lần, mỗi
    lần trên một hòa âm khác.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n19
  cau: 'Bài có ba đoạn: A – B – A.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n20
  cau: Đoạn A ở La trưởng, gồm những câu nhạc bốn ô nhịp cân đối.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n21
  cau: Đoạn A có một quãng giữa bấp bênh hơn trước khi giai điệu đầu quay về.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n22
  cau: Đoạn B chuyển sang Fa♯ thứ, giọng thứ song song của La trưởng.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n23
  cau: Ở chính giữa đoạn B là một khúc hợp xướng (chorale) ở Fa♯ trưởng, chậm và rất nhỏ.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n24
  cau: Rồi Fa♯ thứ trở lại, và cuối cùng đoạn A trở về.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n25
  cau: Phần đệm là một mạng lưới những giọng nhỏ chuyển động chậm, không phải kiểu đệm "bùm-chát".
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n26
  cau: Nhiều chỗ mỗi tay phải chơi hai bè cùng lúc.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n28
  cau: 'Trong đoạn Fa♯ thứ có ba lớp rõ rệt: bè trên, bè giữa và bè trầm chạy bằng chùm ba
    nốt.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n29
  cau: 'Bè giữa đáp lại bè trên theo lối canon: nhắc lại bốn nốt mở đầu của bè trên (Đô♯ –
    Fa♯ – Mi – Rê), chậm hơn một phách.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n30
  cau: Khi Fa♯ thứ trở lại, hai bè trên đổi vai để bè giữa dẫn dắt.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n31
  cau: Brahms giấu đối âm trong một khúc nhạc êm như bài hát ru.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n32
  cau: Ở khúc hợp xướng, Brahms ghi una corda (viết tắt u.c., bàn đạp trái) và legato, rồi
    ghi tre corde khi Fa♯ thứ trở lại.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n34
  cau: 'Bảng theo dõi, dòng 1: mở đầu La trưởng, giai điệu mọc lên từ ba nốt đầu; bên dưới,
    các bè giữa chuyển động chậm.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n35
  cau: 'Bảng theo dõi, dòng 2: câu trả lời bắt đầu giống câu đầu nhưng rẽ sang Mi trưởng.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n36
  cau: 'Bảng theo dõi, dòng 3: quãng giữa của đoạn A, hòa âm bấp bênh, đổi màu liên tục.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n37
  cau: 'Bảng theo dõi, dòng 4: giai điệu đầu trở lại, khép đoạn A thật nhẹ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n38
  cau: 'Bảng theo dõi, dòng 5: đoạn B Fa♯ thứ, ba lớp âm thanh; bè giữa bắt chước bè trên,
    bè trầm chạy chùm ba nốt.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n39
  cau: 'Bảng theo dõi, dòng 6: khúc hợp xướng Fa♯ trưởng, chậm lại, rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n40
  cau: 'Bảng theo dõi, dòng 7: Fa♯ thứ trở lại, chất liệu đầu đoạn B quay về; nhạc dâng lên
    cao trào rồi lắng xuống, mở đường cho đoạn A.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n41
  cau: 'Bảng theo dõi, dòng 8: đoạn A trở về ở La trưởng.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n42
  cau: 'Bảng theo dõi, dòng 9: nhạc lắng dần vào hợp âm La trưởng cuối cùng.'
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n43
  cau: Khi đoạn A trở về, các nốt gần như không đổi.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n44
  cau: 'Radu Lupu: đĩa Decca các tiểu phẩm cuối đời của Brahms (Op. 79, Op. 117–119; CD 1987).'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n45
  cau: 'Bản Lupu: Op. 118 số 2 dài khoảng 5:56.'
  loai: so-lieu
- trang: nghe-nhac/brahms-intermezzo
  id: n46
  cau: 'Glenn Gould: đĩa 10 Intermezzi for Piano (Columbia Masterworks, 1961), có Op. 118
    số 2, dài khoảng 5:48.'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n47
  cau: 'Emanuel Ax: đĩa Sony Classical năm 1992 (Biến tấu Handel, Op. 118, Op. 79); Op. 118
    số 2 dài khoảng 6:24.'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n49
  cau: Op. 118 số 2 là một trong những bản Brahms dễ tiếp cận nhất.
  loai: cap-do
- trang: nghe-nhac/brahms-intermezzo
  id: n50
  cau: Nhà Henle xếp bài ở mức 6 (trung bình) trên thang 1–9.
  loai: cap-do
- trang: nghe-nhac/brahms-intermezzo
  id: n51
  cau: ABRSM đưa bài vào danh sách bằng ARSM, trên Grade 8.
  loai: cap-do
- trang: nghe-nhac/brahms-intermezzo
  id: n54
  cau: Một số hợp âm trải rộng.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n58
  cau: Intermezzo Op. 117 số 1 ở giọng Mi♭ trưởng.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n59
  cau: 'Nguồn: Jan Swafford, Johannes Brahms: A Biography (1997).'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n60
  cau: 'Nguồn: Styra Avins (biên tập), Johannes Brahms: Life and Letters (Oxford University
    Press, 1997).'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n61
  cau: 'Nguồn: Grove Music Online.'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n62
  cau: 'Nguồn: bản nhạc trên IMSLP gồm bản in đầu tiên của Simrock (Berlin, 1893); Henle có
    bản Urtext in riêng Op. 118 số 2, kèm lời tựa về thư từ giữa Brahms và Clara Schumann
    năm 1893; PTNA phân tích hình thức Op. 118 số 2.'
  loai: ten
- trang: nghe-nhac/brahms-intermezzo
  id: n53
  cau: Nốt không nhanh; cái khó là cân bằng các bè trong cùng một bàn tay, giữ legato bằng
    ngón và bàn đạp, và chơi chùm ba nốt ở bè trầm thật đều.
  loai: khuyen-tap
- trang: nghe-nhac/brahms-intermezzo
  id: n48
  cau: So tốc độ ba bản thu để thấy tốc độ thay đổi tính cách bài nhạc thế nào.
  loai: khuyen-tap
- trang: nghe-nhac/brahms-intermezzo
  id: n27
  cau: Ngón 4–5 hát giai điệu còn các ngón phía trong chơi nhẹ hơn.
  loai: khuyen-tap
- trang: nghe-nhac/debussy-preludes
  id: n1
  cau: 'Nhà soạn nhạc: Claude Debussy (1862–1918).'
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n2
  cau: 'Tên đầy đủ: Préludes, quyển 1 (Premier livre): mười hai prélude cho piano.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n3
  cau: Sáng tác từ tháng 12/1909 đến tháng 2/1910.
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n4
  cau: Nhà Durand (Paris) in quyển 1 năm 1910.
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n5
  cau: Debussy tự chơi ra mắt bốn bản (I, II, X và XI) tháng 5/1910 ở Paris.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n6
  cau: Phần lớn các bản còn lại được Ricardo Viñes, Franz Liebich và chính Debussy chơi lần
    đầu ở Paris trong năm 1911.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n7
  cau: 'Thời kỳ: đầu thế kỷ 20, chủ nghĩa ấn tượng.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n8
  cau: 'Thể loại: prélude, tiểu phẩm cho piano.'
  loai: dinh-nghia
- trang: nghe-nhac/debussy-preludes
  id: n9
  cau: Độ dài khoảng 35–40 phút cả quyển; mỗi bản từ hai đến sáu phút.
  loai: so-lieu
- trang: nghe-nhac/debussy-preludes
  id: n10
  cau: Ở Bach, prelude dẫn vào một fugue.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n12
  cau: Chopin biến prelude thành một bản nhạc đứng riêng, ngắn, chỉ một ý; 24 prélude Op.
    28 của ông đi qua đủ 24 giọng.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n14
  cau: Debussy cũng viết 24 prélude, chia làm hai quyển, mỗi quyển mười hai bản; quyển 2 in
    năm 1913.
  loai: so-lieu
- trang: nghe-nhac/debussy-preludes
  id: n15
  cau: Các prélude của Debussy không theo vòng giọng nào.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n16
  cau: Theo ngày Debussy ghi trên bản thảo, quyển 1 được viết xong trong chưa đầy hai tháng,
    từ tháng 12/1909 đến đầu tháng 2/1910, dù vài bản đã có phác thảo từ những năm 1907–1908.
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n17
  cau: Mỗi bản có một cái tên gợi hình, in ở cuối bản nhạc, trong ngoặc đơn và sau dấu ba
    chấm, như (...Voiles).
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n18
  cau: 'Người chơi và người nghe gặp âm nhạc trước rồi mới biết bức tranh: cái tên là một
    lời gợi ý, không phải câu chuyện bắt buộc phải theo.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n19
  cau: 'Nguồn cảm hứng: ba vũ nữ chạm trên một cột đá cổ ở Delphi, một câu thơ của Baudelaire,
    một truyền thuyết xứ Bretagne, tinh linh Puck của Shakespeare, phong cảnh miền Nam nước
    Ý, những gánh hát giải trí của Mỹ.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n20
  cau: Ở Mozart hay Beethoven, hòa âm như một con đường (rời nhà, căng thẳng, trở về); ở Debussy,
    mỗi hợp âm được nghe như một màu.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n21
  cau: Voiles dùng gam toàn cung, gam không có nốt chủ để 'về nhà'.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n22
  cau: La fille aux cheveux de lin dùng gam ngũ cung.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n23
  cau: Gam ngũ cung rất quen tai với người nghe nhạc Việt.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n24
  cau: La cathédrale engloutie có những chuỗi hợp âm trượt song song như thánh ca thời Trung
    cổ.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n25
  cau: Debussy dùng những nốt trầm ngân dài làm nền cho cả một đoạn.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n26
  cau: Giới phê bình gọi lối viết này là 'ấn tượng', theo tên trường phái hội họa của Monet.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n27
  cau: Chính Debussy không ưa cái nhãn 'ấn tượng'.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n28
  cau: 'Tiếng đàn ở đây phụ thuộc nhiều vào bàn đạp và cách chạm phím: nốt trầm được giữ ngân
    trong khi hòa âm bên trên đổi màu, các tầng âm thanh trải từ đáy đến đỉnh bàn phím, phần
    lớn ở sắc thái rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n30
  cau: Theo hồi ức của nghệ sĩ piano Marguerite Long, một câu Debussy hay nói là phải quên
    rằng cây đàn piano có búa.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n31
  cau: Bản thu gợi ý là của nghệ sĩ piano người Pháp Marcelle Meyer.
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n32
  cau: Bản thu Meyer thực hiện năm 1956.
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n33
  cau: Bản thu gồm đủ mười hai bản theo đúng thứ tự, nằm trên Wikimedia Commons.
  loai: so-lieu
- trang: nghe-nhac/debussy-preludes
  id: n34
  cau: Commons ghi bản thu Meyer thuộc phạm vi công cộng ở châu Âu, nhưng ở Mỹ nó vẫn còn
    được bảo hộ (theo luật Mỹ, bản thu thực hiện trước năm 1972 và phát hành từ năm 1947 trở
    đi vẫn còn được bảo hộ).
  loai: quy-tac
- trang: nghe-nhac/debussy-preludes
  id: n37
  cau: I. Danseuses de Delphes (Vũ nữ Delphi), Lent et grave.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n38
  cau: 'I: hợp âm chậm, nặng và trang nghiêm như một điệu múa nghi lễ.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n39
  cau: 'I: gợi hứng từ ba vũ nữ trên đỉnh một cột đá cổ ở Delphi (Hy Lạp), được bày ở bảo
    tàng Louvre (Paris).'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n40
  cau: 'II. Voiles: chữ Pháp mang cả hai nghĩa Cánh buồm và Tấm voan.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n41
  cau: 'II: gần như cả bài trên gam toàn cung, không có ''nhà'' để về.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n42
  cau: 'II: nốt Si♭ ở bè trầm ngân gần suốt bài.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n43
  cau: 'II: một đoạn ngắn ở giữa chỉ dùng phím đen (ngũ cung), rồi gam toàn cung trở lại.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n44
  cau: III. Le vent dans la plaine (Gió trên đồng), Animé.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n45
  cau: 'III: một hình nốt lăn tăn rất nhanh và rất nhỏ gần như không dứt; vài cơn gió mạnh
    bất chợt bùng lên rồi tắt.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n46
  cau: 'IV: tên là một câu trong bài thơ Harmonie du soir của Baudelaire.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n47
  cau: 'IV: nhịp ba uể oải như một điệu valse chậm, hòa âm dày và mềm.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n48
  cau: 'IV: gần cuối, những tiếng như tù và vọng lại từ xa.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n49
  cau: 'V. Les collines d''Anacapri: Anacapri ở trên đảo Capri.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n50
  cau: 'V: mở đầu bằng những nốt để ngân vang (quittez, en laissant vibrer), rồi một điệu
    nhảy nhanh, nhẹ (Vif) chen với một giai điệu kiểu dân ca (avec la liberté d''une chanson
    populaire), gợi không khí miền Nam nước Ý.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n51
  cau: VI. Des pas sur la neige (Những bước chân trên tuyết), Triste et lent.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n52
  cau: 'VI: một hình hai nốt lặp lại gần như suốt bài, như những bước chân nặng nề.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n53
  cau: 'VI: Debussy ghi ngay ô đầu: Ce rythme doit avoir la valeur sonore d''un fond de paysage
    triste et glacé (nhịp điệu này phải có giá trị âm thanh của nền một phong cảnh buồn và
    giá lạnh).'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n54
  cau: 'VII. Ce qu''a vu le vent d''ouest (Điều gió tây đã thấy), Animé et tumultueux: bản
    dữ dội nhất quyển.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n55
  cau: 'VII: những đợt hợp âm rải và nốt chạy cuộn lên như sóng dữ, những cao trào rất mạnh.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n56
  cau: VIII. La fille aux cheveux de lin (Cô gái tóc lanh), Sol♭ trưởng.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n57
  cau: 'VIII: giai điệu mở đầu vang một mình, không đệm, gần như chỉ dùng các nốt của gam
    ngũ cung.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n58
  cau: 'VIII: tên lấy từ một bài thơ của Leconte de Lisle.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n59
  cau: 'VIII: kết rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n60
  cau: 'IX. La sérénade interrompue (Bản dạ ca bị cắt ngang), Modérément animé: tiếng guitar
    gảy dạo kiểu Tây Ban Nha.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n61
  cau: 'IX: một giai điệu như chàng trai hát dưới cửa sổ, bị cắt ngang mấy lần bởi những âm
    thanh khác hẳn.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n62
  cau: 'X. La cathédrale engloutie (Nhà thờ chìm), Profondément calme: những hợp âm quãng
    năm song song hiện ra như từ sương mù, tiếng chuông.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n63
  cau: 'X: nhà thờ dần nhô khỏi mặt nước và vang lên như đàn organ, rất mạnh, ở Đô trưởng.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n64
  cau: 'X: rồi chìm xuống, giai điệu ấy trở lại rất nhỏ như một tiếng vọng.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n65
  cau: 'XI. La danse de Puck, Capricieux et léger: tinh linh trong Giấc mộng đêm hè của Shakespeare.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n66
  cau: 'XI: nhịp chấm dôi nhảy nhót, nhẹ như không.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n67
  cau: 'XII. Minstrels: nhại không khí của những gánh hát giải trí kiểu Mỹ.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n68
  cau: 'XII: Nerveux et avec humour; những nốt gảy giật cục, tiếng trống (quasi Tambouro),
    những câu đùa bất ngờ, một giai điệu trữ tình nửa đùa nửa thật.'
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n69
  cau: La cathédrale engloutie dựa trên truyền thuyết xứ Bretagne về thành Ys bị biển nhấn
    chìm.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n70
  cau: Trong bản nhạc, nhà thờ của thành nhô lên khỏi mặt nước giữa tiếng chuông và tiếng
    hát của các tu sĩ, rồi lại chìm xuống.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n71
  cau: Minstrel show là loại hình giải trí ra đời ở Mỹ thế kỷ 19, trong đó diễn viên (thường
    là người da trắng) bôi đen mặt để nhại người da đen.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n72
  cau: Ngày nay minstrel show được nhìn nhận là một hình thức phân biệt chủng tộc.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n73
  cau: 'Che tên, nghe rồi tự đặt tên: đó cũng là cách Debussy muốn bạn nghe.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n74
  cau: Clair de lune là bản Debussy bắt đầu viết khoảng hai mươi năm trước Préludes quyển
    1.
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n76
  cau: 'Marcelle Meyer: bản thu gợi ý ở trang này (link tới Wikimedia Commons), của một nghệ
    sĩ Pháp thuộc thế hệ sau Debussy.'
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n77
  cau: 'Walter Gieseking (EMI): quyển 1 thu năm 1953, trong loạt thu nhạc piano solo của Debussy
    những năm 1950.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n78
  cau: 'Arturo Benedetti Michelangeli (Deutsche Grammophon, 1978): quyển 1.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n79
  cau: 'Krystian Zimerman (Deutsche Grammophon, 1994): trọn hai quyển.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n80
  cau: Mùa hè năm 1912 Debussy thu mười bốn tác phẩm piano của mình cho hãng Welte-Mignon;
    các cuộn piano phát hành năm 1913; trong đó có La cathédrale engloutie.
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n81
  cau: Trên cuộn piano ấy, ông chơi nhanh gấp đôi so với cách đọc thông thường bản nhạc in
    ở hai đoạn dài, từ ô 7 đến ô 12 và từ ô 22 đến ô 83; bản nhạc in không ghi những chỗ đổi
    tốc độ này.
  loai: so-lieu
- trang: nghe-nhac/debussy-preludes
  id: n94
  cau: 'Mục Nguồn: bản nhạc trên IMSLP, gồm bản in đầu của Durand (Paris, 1910).'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n95
  cau: 'Mục Nguồn: ngày sáng tác, các buổi biểu diễn đầu và nguồn gốc tên từng bản theo lời
    tựa François Lesure (1986) cho ấn bản Henle HN 383; phân tích từng bản: PTNA.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n96
  cau: 'Mục Nguồn: Roy Howat, ''Between and beyond the perforations in Debussy''s Welte rolls'',
    trong Claude Debussy: die Klavieraufnahmen (Wolke Verlag, 2023); các ô chơi nhanh gấp
    đôi theo ghi chú của ấn bản Henle HN 643, như lời điểm của Music Teacher Magazine mà Henle
    dẫn.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n97
  cau: 'Mục Nguồn: bản thu Marcelle Meyer trên Wikimedia Commons, từ bộ sưu tập Les Discophiles
    Français của Médiathèque musicale Mahler.'
  loai: ten
- trang: nghe-nhac/debussy-preludes
  id: n88
  cau: Voiles và La cathédrale engloutie đòi bàn đạp tinh và tai nghe từng tầng; hợp âm của
    La cathédrale engloutie trải rộng, tay nhỏ cần rải hoặc chia nốt cho tay kia.
  loai: khuyen-tap
- trang: nghe-nhac/debussy-preludes
  id: n87
  cau: 'Des pas sur la neige ít nốt mà khó theo cách khác: giữ hình hai nốt thật đều và thật
    nhỏ trong khi giai điệu bên trên tự do.'
  loai: khuyen-tap
- trang: nghe-nhac/debussy-preludes
  id: n90
  cau: Trước đó, học Clair de lune để quen với sắc thái pp, bàn đạp nửa và nhịp mơ hồ; đọc
    Bàn đạp và Tạo tiếng đàn.
  loai: khuyen-tap
