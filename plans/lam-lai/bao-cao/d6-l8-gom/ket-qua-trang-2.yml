- trang: nghe-nhac/gershwin-rhapsody
  id: n1
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
    - https://www.loc.gov/item/2019563767/
  ghi_chu: "IMSLP: tác phẩm Rhapsody in Blue của George Gershwin; bản thảo ở Thư viện Quốc hội Mỹ đề 'Rhapsody in Blue … George Gershwin'."
- trang: nghe-nhac/gershwin-rhapsody
  id: n2
  luot_2: dung
  nguon:
    - https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
  ghi_chu: "Blog Âm nhạc của Thư viện Quốc hội Mỹ (2024): công diễn trong buổi 'An Experiment in Modern Music' của Paul Whiteman (IMSLP cũng ghi tên buổi này); Whiteman muốn chứng tỏ bước tiến của nhạc đại chúng và đưa nhạc đại chúng Mỹ vào phòng hòa nhạc. 'Đặt câu hỏi liệu jazz…' là cách diễn đạt mục đích ấy, chấp nhận được."
- trang: nghe-nhac/gershwin-rhapsody
  id: n3
  luot_2: dung
  nguon:
    - https://www.barenreiter.co.uk/prefaces/9790006543724.pdf
  ghi_chu: Lời tựa bản Bärenreiter ghi 'George Gershwin (1898–1937)'.
- trang: nghe-nhac/gershwin-rhapsody
  id: n4
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
    - https://www.loc.gov/item/2019563767/
  ghi_chu: "IMSLP: biên chế 'piano solo, jazz band (later orchestra)', thể loại 'For piano, orchestra'. Bản thảo 1924 đề 'for jazz band and piano'. Cách gọi 'cho piano và dàn nhạc' đúng với các bản phối về sau."
- trang: nghe-nhac/gershwin-rhapsody
  id: n5
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
    - https://www.loc.gov/item/2019563767/
  ghi_chu: "IMSLP: sáng tác năm 1924; công diễn 1924-02-12 ở Aeolian Hall, New York. Bản thảo ghi ngày 7/1/1924."
- trang: nghe-nhac/gershwin-rhapsody
  id: n6
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
  ghi_chu: IMSLP xếp thời kỳ và phong cách 'Early 20th century'.
- trang: nghe-nhac/gershwin-rhapsody
  id: n7
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
  ghi_chu: IMSLP xếp vào thể loại 'Rhapsodies' và 'For piano, orchestra'.
- trang: nghe-nhac/gershwin-rhapsody
  id: n8
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
  ghi_chu: "IMSLP ghi độ dài trung bình 'Average Duration: 15 minutes'."
- trang: nghe-nhac/gershwin-rhapsody
  id: n9
  luot_2: dung
  nguon:
    - https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
  ghi_chu: "Như n2: buổi 'An Experiment in Modern Music' của Whiteman (12/2/1924) nhằm đưa nhạc đại chúng Mỹ vào phòng hòa nhạc; Rhapsody được viết cho buổi đó."
- trang: nghe-nhac/gershwin-rhapsody
  id: n10
  luot_2: dung
  nguon:
    - https://blogs.loc.gov/loc/2024/02/gershwins-rhapsody-at-100-still-capturing-the-american-character/
    - https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
  ghi_chu: "Blog Timeless của Thư viện Quốc hội Mỹ: buổi công diễn 'with the 25-year-old Gershwin on piano'. Blog Âm nhạc: Gershwin ra mắt hòa nhạc 'at age 25' vào tháng 11 trước đó."
- trang: nghe-nhac/gershwin-rhapsody
  id: n11
  luot_2: dung
  nguon:
    - https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
  ghi_chu: "Blog Âm nhạc của Thư viện Quốc hội Mỹ: 'George was already well known as a composer of popular songs—most of which derived from Broadway shows'."
- trang: nghe-nhac/gershwin-rhapsody
  id: n12
  luot_2: dung
  nguon:
    - https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
    - https://www.barenreiter.co.uk/prefaces/9790006543724.pdf
  ghi_chu: "Thư viện Quốc hội Mỹ: 'composed by George in only a few weeks'; lời tựa Bärenreiter: 'Gershwin completed the composition in a few weeks'."
- trang: nghe-nhac/gershwin-rhapsody
  id: n13
  luot_2: dung
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=11
    - https://www.barenreiter.co.uk/prefaces/9790006543724.pdf
    - https://phys.unsw.edu.au/jw/Rhapsody-in-Blue.html
  ghi_chu: "Bản thảo 1924 (trang nhạc 1): clarinet ('cl.') mở đầu ở âm vực trầm rồi chạy lên cao. Bärenreiter: đường chạy mở đầu nay chơi thành glissando. Nói chính xác thì âm đầu tiên là một tiếng láy (trill) ở nốt trầm, nửa sau đường chạy mới vuốt (UNSW: trill ở G3 từ giây 0–2, rồi đường chạy); n14 đã nói rõ điều này."
- trang: nghe-nhac/gershwin-rhapsody
  id: n14
  luot_2: dung
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=11
    - https://phys.unsw.edu.au/jw/Rhapsody-in-Blue.html
  ghi_chu: "Bản thảo tay của Gershwin (Thư viện Quốc hội Mỹ, ảnh trang 11, trang nhạc 1, 'Slowly'): clarinet có tiếng láy 'tr' ở nốt trầm, tiếp theo là đường chạy đi lên, trên đó Gershwin ghi số '17'. UNSW: 'opening trill on the note G3', rồi đường chạy dạng gam."
- trang: nghe-nhac/gershwin-rhapsody
  id: n15
  luot_2: dung
  nguon:
    - https://www.barenreiter.co.uk/prefaces/9790006543724.pdf
    - https://phys.unsw.edu.au/jw/Rhapsody-in-Blue.html
    - https://www.indianapolissymphony.org/backstage/program-notes/gershwin-rhapsody-in-blue/
  ghi_chu: "Bärenreiter: trong một buổi tập, Ross Gorman (clarinet của Whiteman) chơi nửa sau đường chạy thành glissando, Gershwin thích và đưa ngay vào bản phối. UNSW dẫn lời kể: Gorman làm vậy 'as a joke on Gershwin'. Indianapolis Symphony: glissando mở đầu thành 'one of the most recognizable sounds in the world'. Cụm 'có lẽ để đùa' phù hợp, vì chuyện chỉ do người kể truyền lại."
- trang: nghe-nhac/gershwin-rhapsody
  id: n17
  luot_2: dung
  nguon:
    - https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/rhapsody
    - https://www.indianapolissymphony.org/backstage/program-notes/gershwin-rhapsody-in-blue/
  ghi_chu: "Mục 'rhapsody' của Oxford Dictionary of Music (Kennedy, Bourne; đăng lại trên Encyclopedia.com): 'a comp. in one continuous movt., often based on popular, nat., or folk melodies'. Indianapolis Symphony: 'rhapsody' trong tên tác phẩm nghĩa là tác phẩm có hình thức tự do."
- trang: nghe-nhac/gershwin-rhapsody
  id: n18
  luot_2: dung
  nguon:
    - https://www.nashvillesymphony.org/classical-program-notes/george-gershwin-rhapsody-in-blue/
    - https://www.indianapolissymphony.org/backstage/program-notes/gershwin-rhapsody-in-blue/
    - https://blogs.loc.gov/loc/2024/02/gershwins-rhapsody-at-100-still-capturing-the-american-character/
  ghi_chu: "Nashville Symphony: 'flattened “blue” notes and syncopated rhythms'. Indianapolis Symphony: 'the addition of jazz and blues to art music'; 'Blue' chỉ yếu tố blues và jazz. Thư viện Quốc hội Mỹ: 'mixing jazz and classical themes'."
- trang: nghe-nhac/gershwin-rhapsody
  id: n19
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
    - https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
  ghi_chu: "IMSLP ghi ba bản phối của Grofé: 'Jazz Band (1924 orchestration)', 'Theatre Orchestra (1926)', 'Symphonic Orchestra (1942)'. Thư viện Quốc hội Mỹ: năm 1926 Grofé phối cho dàn nhạc nhà hát, bản giao hưởng thập niên 1940."
- trang: nghe-nhac/gershwin-rhapsody
  id: n20
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
    - https://blogs.loc.gov/loc/2024/02/gershwins-rhapsody-at-100-still-capturing-the-american-character/
  ghi_chu: "IMSLP: 'Grofé's 1942 orchestration was the one most widely performed and recorded until recently'. Thư viện Quốc hội Mỹ: bản 1942 'almost immediately became the standard rendition'. Lưu ý: IMSLP ghi 'until recently', nên có thể viết thêm 'cho tới gần đây'."
- trang: nghe-nhac/gershwin-rhapsody
  id: n21
  luot_2: dung
  nguon:
    - https://www.loc.gov/item/jukebox-70335/
    - https://www.loc.gov/item/jukebox-70342/
    - https://blogs.loc.gov/music/2024/02/rhapsody-in-blue-at-100/
    - https://commons.wikimedia.org/wiki/File:1st_recording_of_Rhapsody_In_Blue_-_Paul_Whiteman_Orch._and_George_Gershwin_piano_(1924_version).ogg
  ghi_chu: "National Jukebox: 'Rhapsody in blue' phần 1 và 2, Victor 55225, ngày 1924-06-10, Gershwin chơi piano, Paul Whiteman Concert Orchestra. Blog Âm nhạc của Thư viện Quốc hội Mỹ: bản thu Victor 'quickly followed on June 10'. Commons gọi đây là 'First recording'. Không thấy nguồn nào nói có bản thu sớm hơn."
- trang: nghe-nhac/gershwin-rhapsody
  id: n22
  luot_2: dung
  nguon:
    - https://blogs.loc.gov/loc/2024/02/gershwins-rhapsody-at-100-still-capturing-the-american-character/
    - https://commons.wikimedia.org/wiki/File:1st_recording_of_Rhapsody_In_Blue_-_Paul_Whiteman_Orch._and_George_Gershwin_piano_(1924_version).ogg
  ghi_chu: "Thư viện Quốc hội Mỹ: giới hạn kỹ thuật buộc 'the nine-minute piece to be recorded in two sections'; mọi bản thu trước 1935, kể cả bản của Gershwin, đều rút gọn cho vừa hai mặt đĩa. File trọn hai mặt trên Commons dài 545,7 giây (khoảng 9 phút 6 giây)."
- trang: nghe-nhac/gershwin-rhapsody
  id: n24
  luot_2: dung
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=11
    - https://phys.unsw.edu.au/jw/Rhapsody-in-Blue.html
  ghi_chu: "Như n13, n14: clarinet mở đầu, từ âm vực trầm chạy lên cao, nay chơi thành glissando. Ghi chú cho người review: n32 nói file trên trang là mặt thứ hai (Part 2, 272,9 giây, Commons). Đoạn mở đầu bằng clarinet nằm ở mặt thứ nhất, nên cần kiểm mốc của bảng có khớp với file không."
- trang: nghe-nhac/gershwin-rhapsody
  id: n25
  luot_2: sai
  cau_dung: "Dòng 2: ngay sau đường vuốt, clarinet chơi tiếp chủ đề chính; cả ban nhạc nhắc lại chủ đề, rồi một đường chạy clarinet ngắn nữa. Đến lúc ấy piano mới vào, độc tấu lần đầu."
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=11
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=12
    - https://www.loc.gov/item/2019563767/
  ghi_chu: "Bản thảo tay 1924 của Gershwin (bản cho hai piano: khuông trên ghi 'Jazz Band', khuông dưới ghi 'Piano'). Trang nhạc 1: sau tiếng láy và đường chạy 17 nốt, chủ đề nằm ở khuông Jazz Band, khuông Piano bỏ trống. Trang 2: số tập 1 là ban nhạc chơi đầy đủ chủ đề, rồi một đường chạy 10 nốt ở Jazz Band. Khuông Piano chỉ có nốt từ cuối trang 2, ghi 'solo'. Vậy lần đầu chủ đề chính vang lên là ở clarinet và ban nhạc, không phải piano độc tấu."
- trang: nghe-nhac/gershwin-rhapsody
  id: n26
  luot_2: sai
  cau_dung: "Dòng 3: sau phần độc tấu đầu tiên của piano, ban nhạc trở lại cùng piano (số tập 2); ban nhạc đã chơi chủ đề từ trước khi piano vào."
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=12
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=13
  ghi_chu: "Bản thảo: ban nhạc đã chơi chủ đề trọn vẹn (số tập 1) trước khi piano vào, nên 'dàn nhạc vào' sau piano độc tấu là sai thứ tự. Trang nhạc 3, số tập 2 (ghi 'Orch'): ban nhạc và piano cùng chơi sau phần piano solo. Nếu dòng 3 chỉ muốn nói 'ban nhạc trở lại sau piano độc tấu' thì đúng; nhưng đặt sau dòng 2 như hiện nay, câu này hiểu thành lần đầu dàn nhạc vào. Nên sửa cùng n25."
- trang: nghe-nhac/gershwin-rhapsody
  id: n27
  luot_2: dung
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=40
  ghi_chu: "Bản thảo tay của Gershwin, trang nhạc 30, số tập 21: 'Andantino Mod[era]to', hóa biểu 4 dấu thăng (Mi trưởng), ban nhạc chơi (khuông J.B.). Đây là đoạn chậm trữ tình ở giữa tác phẩm."
- trang: nghe-nhac/gershwin-rhapsody
  id: n28
  luot_2: dung
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=47
  ghi_chu: "Bản thảo, khoảng các trang nhạc 37–43 (ảnh 47–53 của bản số hóa): nhiều trang chỉ có khuông Piano, chuỗi nốt nhanh dày đặc, tức đoạn piano độc tấu kỹ thuật cao sau đoạn Andantino. Không kiểm từng nốt."
- trang: nghe-nhac/gershwin-rhapsody
  id: n29
  luot_2: dung
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=54
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=66
  ghi_chu: "Bản thảo: từ trang nhạc 44 ('Marcato Mod[era]to'), ban nhạc trở lại, rồi đến kết. Trang cuối (56) có lại hình chủ đề mở đầu (tiếng láy, nốt nhấn) ở ban nhạc trước các hợp âm kết. Mức tin vừa phải: chỉ xem lướt, không đọc hết các trang 44–56."
- trang: nghe-nhac/gershwin-rhapsody
  id: n30
  luot_2: dung
  nguon:
    - https://www.loc.gov/resource/music.muslcdb-100261/?sp=66
  ghi_chu: "Trang cuối của bản thảo (56): khuông Jazz Band và khuông Piano cùng chơi các hợp âm lớn (piano có 'tremolo'), ô kết có hợp âm cả hai bên."
- trang: nghe-nhac/gershwin-rhapsody
  id: n31
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Rhapsody_in_Blue_(Gershwin,_George)
  ghi_chu: "IMSLP có: tổng phổ bản phối 1942 (Chappell), phân bè; bản hai piano T.B. Harms 1924; bản thảo tay 1924 (từ Thư viện Quốc hội Mỹ); các bản piano 1927. Lưu ý: IMSLP xếp tất cả vào 'Arrangements', và một số file ghi 'Non-PD US' (như bản 1942)."
- trang: nghe-nhac/gershwin-rhapsody
  id: n32
  luot_2: dung
  nguon:
    - https://www.loc.gov/item/jukebox-70335/
    - https://commons.wikimedia.org/wiki/File:Paul_Whiteman_Concert_Orchestra_-_Rhapsody_in_Blue_Part_02.mp3
  ghi_chu: "National Jukebox (Thư viện Quốc hội Mỹ): 'Rhapsody in blue, part 2', Victor 55225, matrix C-30173/2, ngày 1924-06-10. Commons có file 'Paul Whiteman Concert Orchestra - Rhapsody in Blue Part 02.mp3', ghi ngày 1924-06-10, nguồn loc.gov/item/jukebox-70335, dài 272,9 giây."
- trang: nghe-nhac/gershwin-rhapsody
  id: n33
  luot_2: dung
  nguon:
    - https://openlibrary.org/works/OL2932136W
  ghi_chu: "Sách có thật: Burkholder, Grout, Palisca, A History of Western Music (W. W. Norton, nhiều lần in; Open Library liệt kê 28 lần in). Grove Music Online có thật (oxfordmusiconline.com), nhưng chặn công cụ (403). Chưa mở được nội dung để xem đoạn về Rhapsody in Blue: chỉ xác nhận hai nguồn tồn tại."
