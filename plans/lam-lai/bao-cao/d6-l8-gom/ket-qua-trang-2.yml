  ghi_chu: Commons có ba file chương I–III, nguồn musopen.com, ghi 'see Musopen for performance author information'. Trang tác phẩm IMSLP đăng cùng bản thu MusOpen (ba chương 10:54, 11:04, 19:12), ghi Skidmore College Orchestra và Anthony Holland.
