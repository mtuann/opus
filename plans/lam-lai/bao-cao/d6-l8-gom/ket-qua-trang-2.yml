  nguon:
    - https://www.henle.de/media/c5/95/e0/1697725904/1214-1697725904-sync.pdf
  ghi_chu: "Henle: buổi công diễn Giao hưởng số 1 op. 13 ở St Petersburg tháng 3/1897 'was a fiasco', bị giới phê bình chê nặng."
- trang: nghe-nhac/rachmaninoff-2
  id: n10
  luot_2: dung
  nguon:
    - https://www.henle.de/media/c5/95/e0/1697725904/1214-1697725904-sync.pdf
    - https://www.udiscovermusic.com/classical-features/rachmaninov-piano-concerto-no-2/
  ghi_chu: "Henle: 'unable to finish any compositions worthy of the name for around the next three years'; ông vốn hay tự nghi ngờ, gia đình phải tìm bác sĩ. uDiscover: sau thất bại năm 1897, ông tìm đến bác sĩ Dahl. Henle không dùng chữ 'depression', nhưng tả đúng một cuộc khủng hoảng sáng tác phải chữa trị."
- trang: nghe-nhac/rachmaninoff-2
  id: n11
  luot_2: dung
  nguon:
    - https://www.henle.de/media/c5/95/e0/1697725904/1214-1697725904-sync.pdf
  ghi_chu: "Henle: gia đình mời Nikolay V. Dahl, nhà trị liệu tâm lý ở Moskva (thôi miên); Rachmaninoff đến gặp ông hằng ngày từ tháng 1 đến tháng 4/1900. Việc chữa trị sớm có kết quả, rồi ông viết Concerto số 2."
- trang: nghe-nhac/rachmaninoff-2
  id: n12
  luot_2: dung
  nguon:
    - https://www.henle.de/media/c5/95/e0/1697725904/1214-1697725904-sync.pdf
    - https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
  ghi_chu: "Henle: 'he dedicated the 2nd Piano Concerto to his doctor, Nikolay Dahl'. IMSLP: lời đề tặng 'Nikolay Vladimirovich Dahl'; bản Gutheil 1901 đề 'A Monsieur N. Dahl'."
- trang: nghe-nhac/rachmaninoff-2
  id: n13
  luot_2: dung
  nguon:
    - https://www.henle.de/media/c5/95/e0/1697725904/1214-1697725904-sync.pdf
  ghi_chu: "Henle: buổi diễn đầu (chương 2 và 3, tháng 12/1900) 'a resounding success'; tác phẩm nhanh chóng nổi tiếng khắp thế giới, là 'one of today’s most famous and most performed piano concertos'."
- trang: nghe-nhac/rachmaninoff-2
  id: n14
  luot_2: dung
  nguon:
    - https://www.classicfm.com/composers/rachmaninov/guides/rachmaninov-facts/pianist-7/
  ghi_chu: "Classic FM: 'The composer had possibly the largest hands in classical music'; từ đầu ngón út đến đầu ngón cái, ông với được 12 phím đàn."
- trang: nghe-nhac/rachmaninoff-2
  id: n15
  luot_2: dung
  nguon:
    - https://www.udiscovermusic.com/classical-features/rachmaninov-piano-concerto-no-2/
    - https://www.classicfm.com/composers/rachmaninov/guides/rachmaninov-facts/pianist-7/
  ghi_chu: "uDiscover (bài về Concerto số 2): nhạc của Rachmaninoff khó với người tay nhỏ, cần 'a wide span'. Classic FM: vì tay ông rất lớn, một số tác phẩm 'fiendishly difficult' với người chơi khác. Tổng phổ (archive.org): các hợp âm mở đầu trải rộng hơn một quãng tám ở cả hai tay."
- trang: nghe-nhac/rachmaninoff-2
  id: n16
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
    - https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_-_piano_concerto_no._2_in_c_minor,_op._18_-_i._moderato.ogg
  ghi_chu: "IMSLP, mục Recordings: Publisher 'Palo Alto: MusOpen', Performers 'Uncredited Piano soloist, Skidmore College Orchestra / Anthony Holland, conductor'. Trên Commons, các file nguồn musopen.com, ghi 'see Musopen for performance author information'. Không xác nhận được 'buổi hòa nhạc' bằng chữ, nhưng file chương 3 có tiếng vỗ tay (n18), khớp với bản thu trực tiếp."
- trang: nghe-nhac/rachmaninoff-2
  id: n18
  luot_2: dung
  nguon:
    - https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_-_piano_concerto_no._2_in_c_minor,_op._18_-_iii._allegro_scherzando.ogg
    - https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
  ghi_chu: "Mô tả file chương 3 trên Commons: '(13 minutes, then Scriabin Nocturne Op. 9, No. 2)'; file dài 1152 giây (IMSLP: 19:12). Tự đo file: khoảng 12:10–13:10 là tiếng ồn phổ phẳng (vỗ tay), 13:20–19:10 là tiếng piano nhỏ, tức bản Nocturne của Scriabin chơi thêm."
- trang: nghe-nhac/rachmaninoff-2
  id: n19
  luot_2: dung
  nguon:
    - https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
  ghi_chu: "Tổng phổ 1901 (bản scan trên archive.org, trang 1): Moderato, piano độc tấu 8 ô, mỗi ô một hợp âm (pp, poco a poco cresc.), xen với nốt Fa trầm ở tay trái (ô 8 có thêm nốt). Dàn nhạc nghỉ."
- trang: nghe-nhac/rachmaninoff-2
  id: n20
  luot_2: dung
  nguon:
    - https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
  ghi_chu: "Tổng phổ, trang 2: violin I, II và viola chơi chủ đề 'con passione' (Đô thứ, 3 dấu giáng); piano đệm bằng chuỗi hợp âm rải nốt móc kép."
- trang: nghe-nhac/rachmaninoff-2
  id: n21
  luot_2: dung
  nguon:
    - https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
  ghi_chu: "Tổng phổ, trang 10–11 (sau số tập 4, Tempo I): viola mở 'espressivo', rồi piano hát chủ đề trữ tình, hóa biểu 3 dấu giáng, ở Mi♭ trưởng."
- trang: nghe-nhac/rachmaninoff-2
  id: n22
  luot_2: dung
  nguon:
    - https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
  ghi_chu: "Tổng phổ, trang 32: 'Maestoso (Alla marcia)', đàn dây chơi chủ đề 1 ở ff, piano chơi hợp âm nhịp hành khúc ff, kèn đồng và timpani giữ nhịp."
- trang: nghe-nhac/rachmaninoff-2
  id: n23
  luot_2: dung
  nguon:
    - https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
    - https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
  ghi_chu: "Tổng phổ, trang 46–47: chương II 'Adagio sostenuto', 4 dấu thăng (IMSLP: E major). Ở số tập 17, sáo 'I solo' vào trước trên nền piano rải hợp âm, rồi clarinet 'solo, p dolce sempre espress.' hát giai điệu chính, piano vẫn rải hợp âm."
- trang: nghe-nhac/rachmaninoff-2
  id: n24
  luot_2: dung
  nguon:
    - https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
    - https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
  ghi_chu: "IMSLP: chương 3 'Allegro scherzando'. Tổng phổ, trang 75: 'Moderato', oboe 'I Solo, mf espress.' và viola (Archi, khóa Đô, 'f espress.') giới thiệu giai điệu trữ tình lớn (Si♭ trưởng)."
- trang: nghe-nhac/rachmaninoff-2
  id: n25
  luot_2: dung
  nguon:
    - https://archive.org/details/rachmaninoff-1901-piano-concerto-no.-2-op.-18-full-score
    - https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
  ghi_chu: "Tổng phổ, trang 107: 'Maestoso', cả dàn nhạc ff cùng piano, không dấu hóa (Đô trưởng); sau đó Più vivo, Risoluto, kết ở Đô trưởng. IMSLP: chương 3 'C minor - C major'."
- trang: nghe-nhac/rachmaninoff-2
  id: n26
  luot_2: dung
  nguon:
    - https://www.classicfm.com/composers/rachmaninov/second-piano-concerto-frank-sinatra-bob-dylan/
    - https://sheetmusic.santacruzpl.org/items/show/33964
  ghi_chu: "Classic FM: ca khúc pop 'Full Moon and Empty Arms' (1945, Buddy Kaye và Ted Mossman) 'is based on the third movement', lấy giai điệu gần như từng nốt; Sinatra thu năm 1945. Thư viện bản nhạc Santa Cruz: bản in ghi 'Based on Rachmaninoff's Piano Concerto No. 2'."
- trang: nghe-nhac/rachmaninoff-2
  id: n27
  luot_2: dung
  nguon:
    - https://ctpublic.org/arts-and-culture/2015-02-05/rach-2-its-what-they-call-classical-music
    - https://www.udiscovermusic.com/classical-features/rachmaninov-piano-concerto-no-2/
  ghi_chu: "Connecticut Public: concerto xuất hiện trong phim 'The Seven Year Itch' (1955, Billy Wilder) và làm nền cho 'Brief Encounter' (1945, David Lean). uDiscover: 'the 1945 film Brief Encounter'."
- trang: nghe-nhac/rachmaninoff-2
  id: n28
  luot_2: dung
  nguon:
    - https://imslp.org/wiki/Piano_Concerto_No.2,_Op.18_(Rachmaninoff,_Sergei)
  ghi_chu: IMSLP có tổng phổ (Complete Score) bản Gutheil, Moskva 1901, số bản in A. 8102 G., cùng phân bè và bản hai piano.
- trang: nghe-nhac/rachmaninoff-2
  id: n29
  luot_2: dung
  nguon:
    - https://www.henle.de/HN-1214
    - https://www.henle.de/media/c5/95/e0/1697725904/1214-1697725904-sync.pdf
  ghi_chu: Henle HN 1214 có thật (bản Urtext, hai piano, ISMN 979-0-2018-1214-4). Lời tựa (Dominik Rahmer, 2020) kể khủng hoảng 1897, việc chữa trị với Dahl, buổi diễn hai chương ngày 2/12/1900, buổi công diễn trọn vẹn 27/10/1901 do Ziloti chỉ huy, và lời đề tặng.
- trang: nghe-nhac/rachmaninoff-2
  id: n31
  luot_2: dung
  nguon:
    - https://commons.wikimedia.org/wiki/File:Sergei_Rachmaninoff_-_piano_concerto_no._2_in_c_minor,_op._18_-_iii._allegro_scherzando.ogg
