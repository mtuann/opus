- trang: nghe-nhac/grieg-concerto
  id: n1
  cau: 'Tiêu đề: Grieg, Concerto piano cung La thứ.'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n2
  cau: 'Mô tả trang: concerto cho thấy một Grieg trẻ trung, viết cho piano với tất cả sức
    vóc của cây đàn; đây là concerto duy nhất ông hoàn thành.'
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n3
  cau: 'Nhà soạn nhạc: Edvard Grieg (1843–1907).'
  loai: nam
- trang: nghe-nhac/grieg-concerto
  id: n4
  cau: 'Tên đầy đủ: Concerto cho piano và dàn nhạc cung La thứ, Op. 16.'
  loai: danh-muc
- trang: nghe-nhac/grieg-concerto
  id: n5
  cau: Sáng tác năm 1868 ở Søllerød (Đan Mạch).
  loai: nam
- trang: nghe-nhac/grieg-concerto
  id: n6
  cau: Công diễn ngày 3/4/1869 tại Copenhagen, Edmund Neupert độc tấu.
  loai: nam
- trang: nghe-nhac/grieg-concerto
  id: n7
  cau: In năm 1872 ở Leipzig.
  loai: nam
- trang: nghe-nhac/grieg-concerto
  id: n8
  cau: Grieg còn sửa bản nhạc đến cuối đời.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n9
  cau: 'Thời kỳ: Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n10
  cau: 'Thể loại: concerto piano.'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n11
  cau: 'Độ dài: khoảng 28–31 phút.'
  loai: so-lieu
- trang: nghe-nhac/grieg-concerto
  id: n12
  cau: Grieg viết concerto khi còn trẻ (25 tuổi), viết cho piano với tất cả sức vóc của cây
    đàn.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n13
  cau: Đây là concerto duy nhất Grieg hoàn thành.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n15
  cau: Grieg viết tác phẩm năm 1868 ở Søllerød, một làng trên đảo Sjælland (Đan Mạch).
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n16
  cau: Buổi công diễn ngày 3/4/1869 do Edmund Neupert, người được đề tặng tác phẩm, chơi piano,
    Holger Simon Paulli chỉ huy.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n17
  cau: Chính Grieg không có mặt ở buổi công diễn.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n18
  cau: Năm 1870, ở Rome, Liszt chơi thị tấu concerto này từ bản viết tay trước các vị khách
    và khen ngợi nhiệt thành.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n20
  cau: Grieg sửa bản nhạc nhiều lần; những chỗ sửa cuối cùng ông gửi nhà xuất bản vào mùa
    hè năm 1907, chỉ vài tuần trước khi mất (4/9/1907).
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n21
  cau: Concerto của Grieg và concerto của Schumann cùng giọng La thứ.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n22
  cau: Hai concerto cùng mở đầu bằng một cú "đổ" của piano từ trên cao xuống.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n23
  cau: Hai concerto thường được thu chung một đĩa.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n24
  cau: Grieg học ở Nhạc viện Leipzig; thầy dạy piano của ông là Ernst Ferdinand Wenzel, bạn
    của Robert Schumann.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n25
  cau: Trong những năm học ở Leipzig, Grieg được nghe Clara Schumann chơi concerto của chồng
    tại Gewandhaus.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n26
  cau: Cú "đổ" mở đầu được dựng từ mô-típ ba nốt xuống nửa cung rồi xuống một quãng ba trưởng
    (La – Sol♯ – Mi), một nét quen trong dân ca Na Uy.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n27
  cau: 'Bàn phím ::cong-cu{ten="piano" range="C5-C6" notes="A5 G#5 E5"}: ba nốt được tô là
    La5, Sol♯5, Mi5 (mô-típ của cú "đổ").'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n28
  cau: Chương cuối mang nhịp điệu halling, điệu nhảy dân gian Na Uy nhịp hai, xưa thường do
    nam giới nhảy, với những động tác nhào lộn như cú đá văng chiếc mũ treo trên cao.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n30
  cau: 'Grieg viết cho piano rất dày: hợp âm đầy, quãng tám chạy khắp bàn phím, những chuỗi
    nốt đổ xuống.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n33
  cau: 'Cadenza ở cuối chương 1 do Grieg viết sẵn: piano một mình đi từ trầm lắng đến những
    hợp âm vang khắp bàn phím.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n34
  cau: Ở chương 2, piano nhẹ, với những nét trang trí ở âm vực cao.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n37
  cau: Bản thu do Neal O'Doan chơi piano cùng University of Washington Symphony, Peter Erős
    chỉ huy.
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n39
  cau: 'Bảng theo dõi, dòng 1: I. Mở đầu: trống timpani vê to dần, rồi piano đổ ào xuống từ
    trên cao bằng mô-típ La – Sol♯ – Mi.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n40
  cau: 'Dòng 2: chủ đề chính (La thứ): dàn nhạc giới thiệu một giai điệu nhẹ, nhịp nhàng;
    piano tiếp lời.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n41
  cau: 'Dòng 3: chủ đề thứ hai (Đô trưởng): trữ tình, đàn cello hát trước, rồi đến piano.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n42
  cau: 'Dòng 4: phát triển: chủ đề chính chuyền qua lại giữa piano và dàn nhạc, căng thẳng
    hơn.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n43
  cau: 'Dòng 5: tái hiện: chủ đề thứ hai trở lại, lần này ở La trưởng.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n44
  cau: 'Dòng 6: cadenza: piano một mình, từ trầm lắng đến bùng nổ; dàn nhạc vào lại, chương
    khép bằng cú "đổ" như lúc mở đầu.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n45
  cau: 'Dòng 7: II. Adagio (Rê♭ trưởng): đàn dây câm tiếng hát giai điệu; piano bước vào với
    những nét trang trí ở âm vực cao.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n46
  cau: 'Dòng 8: chủ đề chương 2 trở lại trên piano với những hợp âm đầy và mạnh; rồi nhạc
    nối thẳng sang chương 3.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n47
  cau: 'Dòng 9: III. Halling: sau phần dẫn của dàn nhạc và một đoạn piano tự do ngắn, piano
    vào điệu nhảy nhịp 2/4, La thứ.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n48
  cau: 'Dòng 10: chủ đề sáo (Fa trưởng): sáo độc tấu hát một giai điệu đồng quê, piano tiếp
    lời.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n49
  cau: 'Dòng 11: halling trở lại, rồi biến thành nhịp 3/4 rất nhanh (Quasi presto).'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n50
  cau: 'Dòng 12: Andante maestoso: chủ đề sáo trở lại ở La trưởng, cả dàn nhạc và piano, hoành
    tráng đến hợp âm cuối.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n51
  cau: 'Câu hỏi 1 ngầm nói: mô-típ La – Sol♯ – Mi lặp lại trong cú "đổ" mở đầu và xuất hiện
    lại ở cuối chương 1.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n53
  cau: 'Dinu Lipatti (với nhạc trưởng Alceo Galliera và Philharmonia Orchestra): bản thu năm
    1947 cho EMI.'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n54
  cau: 'Krystian Zimerman (với Herbert von Karajan và Berliner Philharmoniker, Deutsche Grammophon):
    đĩa ghép cùng concerto của Schumann.'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n55
  cau: Leif Ove Andsnes là nghệ sĩ Na Uy, đã thu cả concerto lẫn nhiều Lyric Pieces.
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n58
  cau: 'Concerto này thuộc trình độ biểu diễn chuyên nghiệp: RCM đưa nó vào danh sách concerto
    của bằng LRCM dành cho người biểu diễn.'
  loai: cap-do
- trang: nghe-nhac/grieg-concerto
  id: n59
  cau: Concerto đòi hỏi hợp âm và quãng tám nặng, sức bền và khả năng chơi cùng dàn nhạc.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n60
  cau: Lyric Pieces (Tiểu phẩm trữ tình) là các tập tác phẩm piano của chính Grieg.
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n61
  cau: Arietta là Op. 12 số 1.
  loai: danh-muc
- trang: nghe-nhac/grieg-concerto
  id: n63
  cau: 'Notturno Op. 54 số 4: RCM xếp ở Level 9 (đề cương 2022).'
  loai: cap-do
- trang: nghe-nhac/grieg-concerto
  id: n64
  cau: Ngày cưới ở Troldhaugen là Op. 65 số 6, có hợp âm và quãng tám mang dáng dấp concerto.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n65
  cau: Concerto được học cùng một người chơi đàn piano thứ hai, đảm nhận phần dàn nhạc rút
    gọn.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n67
  cau: 'Nguồn: IMSLP có bản nhạc concerto, có cả bản rút gọn cho hai đàn piano.'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n68
  cau: 'Nguồn: Finn Benestad và Dag Schjelderup-Ebbe, Edvard Grieg: The Man and the Artist
    (1988).'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n69
  cau: 'Nguồn: lời tựa ấn bản Urtext của Henle (HN 719) về lịch sử sáng tác, công diễn, xuất
    bản và các lần sửa.'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n70
  cau: 'Nguồn: bản thu Neal O''Doan và University of Washington Symphony trên Wikimedia Commons,
    từ bộ sưu tập Al Goldstein (Pandora Music).'
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n31
  cau: Hãy nghe cách nghệ sĩ giữ tiếng đàn vang mà không gắt khi đối đầu với cả dàn nhạc.
  loai: khuyen-tap
- trang: nghe-nhac/grieg-concerto
  id: n35
  cau: Những nét trang trí ở âm vực cao cần bàn đạp thật tinh.
  loai: khuyen-tap
- trang: nghe-nhac/grieg-concerto
  id: n56
  cau: Nghe cách Andsnes nhấn nhịp điệu halling ở chương cuối.
  loai: khuyen-tap
- trang: nghe-nhac/vivaldi-mua-dong
  id: n1
  cau: 'Tiêu đề: Vivaldi, Bốn Mùa – Mùa đông, chương 1.'
  loai: ten
- trang: nghe-nhac/vivaldi-mua-dong
  id: n2
  cau: 'Mô tả trang: Mùa đông là concerto cuối cùng trong Bốn Mùa, giọng Fa thứ thay vì Mi
    trưởng của Mùa xuân; bài thơ sonnet in kèm bản nhạc tả cả ba chương.'
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n3
  cau: 'Nhà soạn nhạc: Antonio Vivaldi (1678–1741).'
  loai: nam
- trang: nghe-nhac/vivaldi-mua-dong
  id: n4
  cau: 'Tên đầy đủ: Concerto cung Fa thứ, Op. 8 số 4, RV 297 L''inverno.'
  loai: danh-muc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n5
  cau: 'Sáng tác: trước năm 1725 (IMSLP ghi năm 1723).'
  loai: nam
- trang: nghe-nhac/vivaldi-mua-dong
  id: n6
  cau: In năm 1725 ở Amsterdam (Michel-Charles Le Cène) trong tập Il cimento dell'armonia
    e dell'inventione, Op. 8.
  loai: nam
- trang: nghe-nhac/vivaldi-mua-dong
  id: n7
  cau: 'Thời kỳ: Baroque.'
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n8
  cau: 'Thể loại: concerto cho violin độc tấu, dàn dây và bè trầm liên tục.'
  loai: ten
- trang: nghe-nhac/vivaldi-mua-dong
  id: n9
  cau: 'Độ dài chương 1: khoảng 3–4 phút.'
  loai: so-lieu
- trang: nghe-nhac/vivaldi-mua-dong
  id: n10
  cau: Mùa đông là concerto cuối cùng trong Bốn Mùa.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n11
  cau: Mùa đông ở giọng Fa thứ; Mùa xuân ở Mi trưởng.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n12
  cau: Bài thơ sonnet được in kèm bản nhạc.
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n13
  cau: 'Sonnet tả chương 1: run rẩy trong tuyết, gió buốt, giậm chân cho đỡ rét, răng va lập
    cập.'
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n14
  cau: 'Sonnet tả chương 2: ngồi bên lò sưởi khi ngoài trời mưa.'
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n15
  cau: 'Sonnet tả chương 3: bước đi rón rén trên băng, trượt ngã, gió nổi.'
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n16
  cau: Ở chương 1, những nốt lặp lại đều đều của từng bè lần lượt vào, chồng lên nhau thành
    hợp âm chói tai như người run cầm cập.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n17
  cau: Những chuỗi nốt chạy rất nhanh của violin độc tấu như gió buốt.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n18
  cau: Những nốt lặp dồn dập như chân giậm và răng va lập cập.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n19
  cau: Chương 1 cũng viết theo hình thức ritornello như Mùa xuân.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n21
  cau: 'Hai concerto là một cặp đối xứng: xuân–đông, trưởng–thứ.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n23
  cau: 'Bảng theo dõi, dòng 1: mở đầu, cả dàn nhạc: những nốt lặp lại đều đều, các bè lần
    lượt vào và chồng lên nhau thành hợp âm chói tai; violin độc tấu thêm những nốt láy rền.
    Câu thơ: run cầm cập giữa tuyết giá.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n24
  cau: 'Dòng 2: violin độc tấu, những chuỗi nốt chạy rất nhanh, mỗi đợt lên cao hơn đợt trước.
    Câu thơ: gió dữ thổi buốt.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n25
  cau: 'Dòng 3: dàn nhạc, những nốt lặp lại dồn dập, hợp âm đổi liên tục. Câu thơ: chạy, giậm
    chân liên hồi.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n26
  cau: 'Dòng 4: violin độc tấu và dàn nhạc thay phiên nhau, rồi những nốt lặp chồng lên nhau
    của đoạn mở đầu trở lại.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n27
  cau: 'Dòng 5: những nốt lặp dồn dập của violin độc tấu (nốt kép rung nhanh), dàn nhạc đệm
    nhỏ. Câu thơ: rét quá, răng va lập cập.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n28
  cau: 'Dòng 6: kết: cả dàn nhạc trở lại những nốt lặp dồn dập của đoạn "giậm chân", rồi hai
    lần kết trọn dứt khoát ở Fa thứ.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n29
  cau: Cảnh trượt ngã trên băng nằm ở chương 3.
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n30
  cau: 'Nguồn: bản nhạc và tổng phổ trên IMSLP.'
  loai: ten
- trang: nghe-nhac/vivaldi-mua-dong
  id: n31
