  cau: "V. Les collines d'Anacapri: Anacapri ở trên đảo Capri."
  loai: ten
  nguon:
    - ten: "PTNA Piano Encyclopedia, Préludes 1 số 5 (bình giải Shiraishi Yuriko, 2020, bản dịch máy tiếng Anh): Les collines d'Anacapri: Anacapri là thị trấn trên đảo Capri; giai điệu kiểu dân ca; nhịp kiểu habanera ở đoạn giữa; 'dazzling light of Southern Europe'"
      link: https://enc.piano.or.jp/en/musics/22368
