- trang: nghe-nhac/brahms-intermezzo
  id: n5
  cau: "Thời kỳ: Cuối Lãng mạn."
  loai: lich-su
  nguon:
    - ten: 'IMSLP, 6 Klavierstücke, Op.118 (Brahms): tên khác "6 Piano Pieces"; sáu bài (4 intermezzo, ballade, romance); số 2 Andante teneramente (A major); đề tặng Clara Schumann; sáng tác 1893; in tháng 11/1893, Berlin, N. Simrock; Piece Style Romantic (wikitext qua api.php)'
      link: https://imslp.org/wiki/6_Klavierst%C3%BCcke,_Op.118_(Brahms,_Johannes)
    - ten: 'PTNA Piano Encyclopedia, 6 Stücke Op.118: sáng tác và in 1893, Simrock; năm tập tiểu phẩm từ Op. 76 đến Op. 119; số 2: "the same melodic motif appears repeatedly with various harmonic progressions" ở phần đầu'
      link: https://enc.piano.or.jp/en/musics/213
  ket_qua_luot_1: dung
  ghi_chu: "IMSLP: Piece Style Romantic; 1893 nằm ở cuối thời Lãng mạn theo cách chia của site (khoảng 1820–1900, lich-su/thoi-ky/lang-man). PTNA: \"One of Brahms's very late works\". Bản ghi thoi_ky: Cuối Lãng mạn."
- trang: nghe-nhac/debussy-preludes
