- trang: nghe-nhac/grieg-concerto
  id: n40
  cau: "Dòng 2: chủ đề chính (La thứ): dàn nhạc giới thiệu một giai điệu nhẹ, nhịp nhàng; piano tiếp lời."
  loai: cau-truc
  nguon:
    - ten: "Grieg, Piano Concerto Op. 16, tổng phổ ba chương (bản quét đăng lại từ IMSLP), Internet Archive imslp-concerto-op16-grieg-edvard; xem ảnh: chương 1 tr. 2 (chủ đề chính ở bộ gỗ, kèn và đàn dây), tr. 9 (Più lento: cello mf rồi piano tranquillo e cantabile ở Đô trưởng), tr. 25 (tái hiện ở La trưởng, cello), tr. 33 (kết); chương 2 tr. 1 (Adagio, 5 dấu giáng, Con sordini), tr. 5, tr. 8 (kết, vạch kép đổi sang La thứ 2/4); chương 3 tr. 1 (Allegro moderato molto e marcato 2/4), tr. 15 (Poco più tranquillo, sáo I. Solo), tr. 31 (Quasi presto 3/4), tr. 36 (Andante maestoso, 3 dấu thăng)"
      link: https://archive.org/details/imslp-concerto-op16-grieg-edvard
  ket_qua_luot_1: dung
  ghi_chu: "Tổng phổ chương 1 tr. 2: bộ gỗ p dolce, kèn I. Solo, đàn dây arco; piano vào sau."
