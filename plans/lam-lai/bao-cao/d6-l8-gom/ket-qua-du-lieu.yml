  luot_2: dung
  nguon: ["https://imslp.org/wiki/Pictures_at_an_Exhibition_(Mussorgsky,_Modest)"]
  ghi_chu: "IMSLP không có mốc từng bài của bản Bertoglio; đối chiếu bản Arkadiev chia file trên cùng trang (phút): 1:20, 3:05, 0:44, 4:47, 0:29, 1:05, 3:03, 0:52, 1:08, 2:40, (không có Promenade V), 1:28, 2:24, 2:21, 3:36, 5:45. Cùng tỷ lệ; tổng các ô 31,3 phút so với 33:43 của Bertoglio. Gần đúng."
