  ghi_chu: "Bản đồ nghe OUP (Discovering Music): Ritornello 1–5 xen Solo 1–4, mỗi đoạn gắn một hình ảnh (tiếng chim, suối, sấm chớp). Mutopia in sonnet và chữ 'Canto dè gl' Vcelli', 'Scorrono i Fonti', 'Tuoni' trên khuông."
