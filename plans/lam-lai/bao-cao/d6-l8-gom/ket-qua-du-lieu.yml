  ghi_chu: "Calvocoressi trích Stasov: tác giả tự vẽ mình 'pacing here and there'; Riesemann: Promenade 'depicts himself straying from picture to picture'; ghi chú K-State: Promenade là Mussorgsky đi trong phòng tranh, Con mortuis là 'reworking of the Promenade'."
