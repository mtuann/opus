  ghi_chu: "OUP: các đoạn RITORNELLO (Advent of spring, Orchestral conclusion…) xen các đoạn SOLO; Mutopia: ritornello ghi 'Tutti' (cả dàn nhạc)."
- trang: du-lieu/tac-pham/vivaldi-mua-xuan
  id: n7
  luot_2: sai
  nguon: ["https://www.mutopiaproject.org/ftp/VivaldiA/O8/spring/spring-lys.zip", "https://learninglink.oup.com/access/content/todd2e-student-resources/todd2e-listening-map-15"]
  ghi_chu: "Thứ tự đoạn khớp bản Mutopia (spring1a.ly: A ritornello Mi trưởng; B 'Solo' chim; Tutti; C 'Scorrono i Fonti'; ritornello Forte; D 'Tuoni'; ritornello Đô♯ thứ ô 55–58; E 'Solo' chim; Tutti; R1*5 độc tấu; ritornello cuối). Riêng đoạn Bão không ở giọng thứ từ đầu: bè dây ngân Si (át của Mi trưởng) với gam Mi trưởng chạy lên, rồi bè trầm đi La–La♯–Si–Si♯–Đô♯ và kết ở Đô♯ thứ. OUP chỉ gọi ritornello sau bão là 'Minor-key interlude'. Nếu sơ đồ muốn ghi giọng thì nên ghi 'chuyển sang giọng thứ'."
  cau_dung: "Thứ tự các đoạn trong sơ đồ: R, Chim hót (solo), R, Suối chảy, R, Bão (chuyển sang giọng thứ), R (giọng thứ), Chim trở lại, R, Độc tấu (violin), R."
