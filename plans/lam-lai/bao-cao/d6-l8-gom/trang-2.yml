- trang: nghe-nhac/gershwin-rhapsody
  id: n1
  cau: 'Tiêu đề: Gershwin, Rhapsody in Blue.'
  loai: ten
- trang: nghe-nhac/gershwin-rhapsody
  id: n2
  cau: 'Mô tả trang: Rhapsody in Blue ra đời từ buổi hòa nhạc An Experiment in Modern Music
    của Paul Whiteman, đặt câu hỏi liệu jazz có thể bước vào phòng hòa nhạc cổ điển không.'
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n3
  cau: 'Nhà soạn nhạc: George Gershwin (1898–1937).'
  loai: nam
- trang: nghe-nhac/gershwin-rhapsody
  id: n4
  cau: 'Tên đầy đủ: Rhapsody in Blue cho piano và dàn nhạc.'
  loai: ten
- trang: nghe-nhac/gershwin-rhapsody
  id: n5
  cau: Sáng tác năm 1924; công diễn 12/2/1924 tại Aeolian Hall, New York.
  loai: nam
- trang: nghe-nhac/gershwin-rhapsody
  id: n6
  cau: 'Thời kỳ: Thế kỷ 20.'
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n7
  cau: 'Thể loại: rhapsody cho piano độc tấu và dàn nhạc.'
  loai: ten
- trang: nghe-nhac/gershwin-rhapsody
  id: n8
  cau: 'Độ dài: khoảng 15 phút.'
  loai: so-lieu
- trang: nghe-nhac/gershwin-rhapsody
  id: n9
  cau: Rhapsody in Blue ra đời từ buổi hòa nhạc An Experiment in Modern Music của Paul Whiteman,
    buổi đặt câu hỏi liệu jazz có thể bước vào phòng hòa nhạc cổ điển không.
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n10
  cau: Khi đó Gershwin mới 25 tuổi.
  loai: nam
- trang: nghe-nhac/gershwin-rhapsody
  id: n11
  cau: Gershwin đã nổi tiếng với những ca khúc trong các vở diễn Broadway.
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n12
  cau: Gershwin viết tác phẩm trong vài tuần.
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n13
  cau: Tiếng đầu tiên là một nốt clarinet vuốt lên (glissando) dài, từ trầm vút lên cao.
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n14
  cau: Gershwin viết một tiếng láy rền ở âm vực trầm rồi một chuỗi 17 nốt đi lên.
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n15
  cau: Chuyện kể rằng trong buổi tập, nghệ sĩ clarinet Ross Gorman (có lẽ để đùa) vuốt liền
    các nốt ấy thành một đường trượt, và từ đó tác phẩm luôn mở đầu như vậy, thành một âm
    thanh tiêu biểu của nhạc Mỹ.
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n17
  cau: 'Tác phẩm là một dòng chảy liền mạch, đúng nghĩa "rhapsody": một chương liền mạch,
    thường dựa trên những giai điệu đại chúng.'
  loai: dinh-nghia
- trang: nghe-nhac/gershwin-rhapsody
  id: n18
  cau: Tác phẩm hòa trộn giai điệu blues, tiết tấu jazz (syncopation) và hòa âm cổ điển.
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n19
  cau: 'Phần dàn nhạc do Ferde Grofé phối: bản gốc năm 1924 cho ban nhạc jazz của Paul Whiteman,
    bản năm 1926 cho dàn nhạc nhà hát, bản năm 1942 cho dàn nhạc giao hưởng đầy đủ.'
  loai: nam
- trang: nghe-nhac/gershwin-rhapsody
  id: n20
  cau: Bản phối năm 1942 lâu nay được chơi và thu âm nhiều nhất.
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n21
  cau: 'Bản thu trên trang là bản thu đầu tiên của tác phẩm: Gershwin chơi piano cùng dàn
    nhạc của Paul Whiteman, ngày 10/6/1924, cho hãng Victor.'
  loai: lich-su
- trang: nghe-nhac/gershwin-rhapsody
  id: n22
  cau: Để vừa hai mặt một đĩa hát thời đó, tác phẩm được rút gọn còn khoảng 9 phút.
  loai: so-lieu
- trang: nghe-nhac/gershwin-rhapsody
  id: n24
  cau: 'Bảng theo dõi, dòng 1: clarinet glissando mở đầu, vuốt từ trầm lên cao.'
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n25
  cau: 'Dòng 2: chủ đề chính đầu tiên: piano độc tấu, tiết tấu nảy.'
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n26
  cau: 'Dòng 3: dàn nhạc vào, chủ đề được "mặc áo" giao hưởng.'
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n27
  cau: 'Dòng 4: đoạn chậm, trữ tình ở giữa (Andantino moderato, Mi trưởng).'
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n28
  cau: 'Dòng 5: piano độc tấu virtuoso, chạy ngón tốc độ cao.'
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n29
  cau: 'Dòng 6: trở lại chủ đề chính, dồn dập về kết.'
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n30
  cau: 'Dòng 7: kết hoành tráng, cả dàn nhạc và piano.'
  loai: cau-truc
- trang: nghe-nhac/gershwin-rhapsody
  id: n31
  cau: 'Nguồn: bản nhạc và tổng phổ trên IMSLP.'
  loai: ten
- trang: nghe-nhac/gershwin-rhapsody
  id: n32
  cau: 'Nguồn: bản thu năm 1924 ở Library of Congress, National Jukebox (Victor 55225, thu
    ngày 10/6/1924; mặt thứ hai); file trên Wikimedia Commons.'
  loai: ten
- trang: nghe-nhac/gershwin-rhapsody
  id: n33
  cau: 'Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online.'
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n1
  cau: 'Nhà soạn nhạc: Modest Mussorgsky (1839–1881).'
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n2
  cau: 'Tên đầy đủ: Kartinki s vystavki (Картинки с выставки, Những bức tranh ở phòng triển
    lãm), tổ khúc cho piano.'
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n3
  cau: Sáng tác từ 2 đến 22/6/1874.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n4
  cau: Tác phẩm tưởng nhớ Viktor Hartmann và đề tặng Vladimir Stasov.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n5
  cau: Tác phẩm được in năm 1886, sau khi tác giả mất, qua bản biên tập của Rimsky-Korsakov.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n6
  cau: 'Thời kỳ: Lãng mạn (trường phái dân tộc Nga).'
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n7
  cau: 'Thể loại: tổ khúc piano, âm nhạc chương trình.'
  loai: dinh-nghia
- trang: nghe-nhac/mussorgsky-tranh
  id: n8
  cau: Độ dài khoảng 30–35 phút.
  loai: so-lieu
- trang: nghe-nhac/mussorgsky-tranh
  id: n9
  cau: Bản phối khí nổi tiếng nhất là của Maurice Ravel (1922).
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n10
  cau: Viktor Hartmann là kiến trúc sư, họa sĩ và bạn thân của Mussorgsky.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n11
  cau: Hartmann qua đời năm 1873, mới 39 tuổi.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n12
  cau: Đầu năm 1874, nhà phê bình Vladimir Stasov góp phần tổ chức một triển lãm tưởng niệm
    các bản vẽ và tranh màu nước của Hartmann ở Viện Hàn lâm Nghệ thuật, Saint Petersburg.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n13
  cau: Mussorgsky viết tổ khúc chỉ trong ba tuần tháng 6/1874.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n14
  cau: Mussorgsky là thành viên "Nhóm Năm người".
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n15
  cau: Tổ khúc gồm mười "bức tranh" (bài đánh số 1–10).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n16
  cau: Tổ khúc là một ví dụ kinh điển của âm nhạc chương trình.
  loai: dinh-nghia
- trang: nghe-nhac/mussorgsky-tranh
  id: n18
  cau: Không phải bức nào Mussorgsky nhắc tới cũng còn tìm được; trong số những bản còn lại
    có phác thảo trang phục gà con trong vỏ trứng và chiếc đồng hồ hình túp lều của mụ phù
    thủy Baba Yaga.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n19
  cau: Hartmann thiết kế một cổng thành cho Kiev (Kyiv), chưa bao giờ được xây.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n20
  cau: Promenade mở đầu bằng một giọng hát đơn độc, rồi cả khối hợp âm đáp lại.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n21
  cau: Promenade đầu tiên xen kẽ nhịp 5/4 và 6/4.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n22
  cau: Promenade là chính người xem tranh (Mussorgsky dạo qua phòng triển lãm).
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n23
  cau: Promenade trở lại giữa các bức tranh, mỗi lần một tâm trạng.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n24
  cau: Theo Stasov, qua những đoạn Promenade Mussorgsky vẽ chính mình đang dạo qua phòng tranh,
    lúc vui lúc buồn khi nhớ người bạn đã mất.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n25
  cau: Promenade thành lời than ở giọng thứ trong Cum mortuis.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n26
  cau: Promenade vang lên giữa tiếng chuông ở Cổng lớn thành Kiev.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n27
  cau: Bản in năm 1886 của Rimsky-Korsakov sửa nhiều chỗ và có cả lỗi đọc nhầm.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n28
  cau: Bản phối của Ravel do nhạc trưởng Serge Koussevitzky đặt hàng.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n29
  cau: Bản phối của Ravel công diễn lần đầu ở Paris tháng 10/1922.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n30
  cau: Ravel dựa vào bản Rimsky-Korsakov.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n31
  cau: Ravel bỏ Promenade thứ năm (Promenade trước Limoges).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n32
  cau: Nếu chỉ biết tác phẩm qua bản Ravel, bản piano nghe khác hẳn.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n33
  cau: Bydło là tiếng Ba Lan, nghĩa là gia súc; bài tả một cỗ xe bò.
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n34
  cau: Trong bản thảo của Mussorgsky, Bydło bắt đầu rất mạnh (ff).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n35
  cau: Ở Bydło, tay trái chơi những hợp âm nặng đều đặn như bánh xe lăn.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n36
  cau: Ở Bydło, xe bò xa dần đến ppp.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n37
  cau: Bản in năm 1886 của Rimsky-Korsakov bỏ chữ ff ở đầu Bydło và chỉ ghi to dần (cresc.)
    ở giữa bài.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n38
  cau: Bản Ravel của Bydło bắt đầu nhỏ rồi to dần.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n39
  cau: Ravel giao Promenade đầu tiên cho trumpet.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n40
  cau: Ravel giao bài ca trong Lâu đài cổ cho saxophone alto.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n41
  cau: Ravel giao cỗ xe bò (Bydło) cho tuba.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n42
  cau: Ravel giao Schmuÿle cho trumpet câm tiếng (con sordino).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n45
  cau: Trong Catacombae, các hợp âm piano ngân dài rồi tắt dần, xen khoảng lặng; bản Ravel
    giao cho kèn đồng giữ âm thanh đều.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n47
  cau: 'Bảng sơ đồ: Promenade (Dạo bước), Si♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n48
  cau: 'Bảng sơ đồ: 1. Gnomus (Chú lùn), Mi♭ thứ.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n49
  cau: 'Bảng sơ đồ: 2. Il vecchio castello (Lâu đài cổ), Sol♯ thứ.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n50
  cau: 'Bảng sơ đồ: 3. Tuileries (Dispute d''enfants après jeux), Vườn Tuileries (trẻ con
    cãi nhau sau giờ chơi), Si trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n51
  cau: 'Bảng sơ đồ: 4. Bydło, Sol♯ thứ.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n52
  cau: 'Bảng sơ đồ: 5. Балет невылупившихся птенцов (Vũ khúc của những chú gà con chưa nở),
    Fa trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n53
  cau: 'Bảng sơ đồ: 6. "Samuel" Goldenberg und "Schmuÿle", hai người Do Thái, một giàu một
    nghèo, Si♭ thứ.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n54
  cau: Có người đọc bài Goldenberg und Schmuÿle như một bức biếm họa bài Do Thái; cách đọc
    ấy còn tranh cãi.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n55
  cau: 'Bảng sơ đồ: 7. Limoges. Le marché (La grande nouvelle), Chợ Limoges (Tin lớn), Mi♭
    trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n56
  cau: 'Bảng sơ đồ: 8. Catacombae (Sepulcrum romanum) rồi Cum mortuis in lingua mortua: Hầm
    mộ (Mộ La Mã); Cùng người chết, bằng một ngôn ngữ đã chết; Si thứ.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n57
  cau: 'Bảng sơ đồ: 9. Избушка на курьих ножках (Баба-Яга), Túp lều trên chân gà (Baba Yaga):
    không ghi hóa biểu.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n58
  cau: 'Bảng sơ đồ: 10. Богатырские ворота (В стольном городе во Киеве), Cổng các tráng sĩ
    (ở kinh đô Kiev), thường gọi là Cổng lớn thành Kiev, Mi♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n59
  cau: Bản thu gợi ý là bản piano do Chiara Bertoglio chơi trọn tập, một file dài 33:44 đăng
    trên IMSLP.
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n61
  cau: 'Theo dõi, dòng 1: Promenade: giọng hát đơn độc, khối hợp âm đáp lại; nhịp 5/4 và 6/4
    xen kẽ.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n62
  cau: 'Theo dõi, dòng 2: Gnomus giật cục, dừng đột ngột, như một chú lùn bước khập khiễng.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n63
  cau: 'Theo dõi, dòng 3: Promenade êm dịu; Lâu đài cổ: nốt trầm Sol♯ lặp lại gần như suốt
    bài, bên trên là bài ca buồn của người hát rong.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n64
  cau: 'Theo dõi, dòng 4: Promenade ngắn; Tuileries nhanh, nhẹ, trẻ con trêu chọc nhau.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n65
  cau: 'Theo dõi, dòng 5: Bydło: hợp âm tay trái nặng nề như bánh xe; rồi xa dần, tắt hẳn.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n66
  cau: 'Theo dõi, dòng 6: Promenade lặng lẽ; Vũ khúc gà con: âm vực cao, nốt hoa mỹ lích chích.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n67
  cau: 'Theo dõi, dòng 7: Goldenberg và Schmuÿle: giọng trầm, nặng, hai tay đồng âm; giọng
    the thé, nốt lặp nhanh ở âm vực cao; rồi hai giọng chồng lên nhau.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n68
  cau: 'Theo dõi, dòng 8: Promenade (gần giống lần đầu); Limoges: chợ ồn ào, nốt nhanh không
    ngừng, kết bằng một cú lao xuống.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n69
  cau: 'Theo dõi, dòng 9: Catacombae: hợp âm dài, lúc rất mạnh lúc rất nhỏ; rồi Cum mortuis:
    chủ đề Promenade ở giọng thứ, dưới tiếng rung (tremolo) cao vút.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n70
  cau: 'Theo dõi, dòng 10: Baba Yaga: quãng tám dữ dội, bước nhảy xa; đoạn giữa rờn rợn; rồi
    lao thẳng vào bản cuối.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n71
  cau: 'Theo dõi, dòng 11: Cổng lớn thành Kiev: hợp âm trang nghiêm, những đoạn thánh ca lặng
    lẽ xen vào, tiếng chuông, Promenade vang lại lần cuối.'
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n72
  cau: Sviatoslav Richter có bản thu trực tiếp ở Sofia năm 1958, nay hãng Decca phát hành
    (The Sofia Recital 1958); ông chơi đúng bản nhạc của Mussorgsky; tiếng thu cũ, nghe rõ
    cả khán phòng.
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n73
  cau: Vladimir Horowitz chơi bản do chính ông soạn lại (1939), thêm nốt và mở rộng âm vực
    để piano "to" như dàn nhạc; có bản thu trực tiếp ở Carnegie Hall năm 1948 (RCA).
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n76
  cau: Trọn tổ khúc thuộc trình độ biểu diễn.
  loai: cap-do
- trang: nghe-nhac/mussorgsky-tranh
  id: n77
  cau: Trọn tổ khúc cần sức bền, hợp âm và quãng tám nặng (Bydło, Baba Yaga, Cổng lớn thành
    Kiev).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n78
  cau: Promenade đầu tiên khoảng Grade 5–6, chặng 4–5 của site.
  loai: cap-do
- trang: nghe-nhac/mussorgsky-tranh
  id: n79
  cau: 'Il vecchio castello: nhà Henle xếp mức 5 trên thang 1–9.'
  loai: cap-do
- trang: nghe-nhac/mussorgsky-tranh
  id: n80
  cau: 'Vũ khúc gà con chưa nở: Henle mức 7.'
  loai: cap-do
- trang: nghe-nhac/mussorgsky-tranh
  id: n83
  cau: Hãy chơi hợp âm nặng bằng sức nặng của cả cánh tay, không gồng cổ tay.
  loai: quy-tac
- trang: nghe-nhac/mussorgsky-tranh
  id: n86
  cau: 'Nguồn: bản nhạc trên IMSLP ("Pictures at an Exhibition (Mussorgsky, Modest)"); nên
    dùng bản Urtext theo bản thảo gốc (ví dụ của G. Henle Verlag) thay vì bản Rimsky-Korsakov.'
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n87
  cau: 'Nguồn: Michael Russ, Musorgsky: Pictures at an Exhibition (Cambridge University Press,
    1992).'
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n88
  cau: 'Nguồn: Richard Taruskin, Musorgsky: Eight Essays and an Epilogue (Princeton University
    Press, 1993).'
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n89
  cau: 'Nguồn: bản thu Chiara Bertoglio trên trang tác phẩm IMSLP, mục Recordings (file PMLP03722-Quadri.mp3).'
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n74
  cau: Nghe bản phối khí của Ravel ngay sau bản piano, nhất là Bydło, Lâu đài cổ và Cổng lớn
    thành Kiev.
  loai: khuyen-tap
- trang: nghe-nhac/mussorgsky-tranh
  id: n81
  cau: 'Vài bản có thể tập sớm hơn: Promenade đầu tiên để luyện hợp âm dày và đổi nhịp; Il
    vecchio castello để giữ nốt trầm lặp thật đều dưới một giai điệu hát dài; Vũ khúc gà con
    chưa nở để luyện nốt hoa mỹ nhẹ và nhanh ở âm vực cao.'
  loai: khuyen-tap
- trang: nghe-nhac/mussorgsky-tranh
  id: n43
  cau: Trên piano, mọi màu sắc ấy phải đến từ cách nhấn phím và bàn đạp.
  loai: khuyen-tap
- trang: nghe-nhac/rachmaninoff-2
  id: n1
  cau: 'Tiêu đề: Rachmaninoff, Concerto piano số 2.'
  loai: ten
- trang: nghe-nhac/rachmaninoff-2
  id: n2
  cau: 'Mô tả trang: năm 1897 Giao hưởng số 1 công diễn thất bại nặng nề; ông rơi vào trầm
    cảm và gần như không sáng tác được trong ba năm; sau thời gian điều trị…'
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n3
  cau: 'Nhà soạn nhạc: Sergei Rachmaninoff (1873–1943).'
  loai: nam
- trang: nghe-nhac/rachmaninoff-2
  id: n4
  cau: 'Tên đầy đủ: Concerto piano số 2 cung Đô thứ, Op. 18.'
  loai: danh-muc
- trang: nghe-nhac/rachmaninoff-2
  id: n5
  cau: Sáng tác 1900–1901.
  loai: nam
- trang: nghe-nhac/rachmaninoff-2
  id: n6
  cau: 'Công diễn trọn vẹn: 27/10/1901 (lịch Nga cũ; 9/11/1901 theo lịch hiện nay), Moskva,
    tác giả chơi piano, Alexander Siloti chỉ huy.'
  loai: nam
- trang: nghe-nhac/rachmaninoff-2
  id: n7
  cau: 'Thời kỳ: Cuối Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n8
  cau: 'Độ dài: khoảng 33–35 phút.'
  loai: so-lieu
- trang: nghe-nhac/rachmaninoff-2
  id: n9
  cau: Năm 1897, Giao hưởng số 1 của Rachmaninoff công diễn thất bại nặng nề.
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n10
  cau: Ông rơi vào trầm cảm và gần như không sáng tác được trong ba năm.
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n11
  cau: Sau một thời gian điều trị với bác sĩ Nikolai Dahl, ông lấy lại cảm hứng và viết Concerto
    số 2.
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n12
  cau: Concerto số 2 được đề tặng chính bác sĩ Dahl.
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n13
  cau: Concerto thành công vang dội và đến nay vẫn là một trong những concerto piano nổi tiếng
    và được biểu diễn nhiều nhất.
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n14
  cau: Rachmaninoff là nghệ sĩ piano với đôi bàn tay rất lớn.
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n15
  cau: Những hợp âm rộng trong concerto này là thử thách thật sự với nhiều người chơi.
  loai: cap-do
- trang: nghe-nhac/rachmaninoff-2
  id: n16
  cau: Bản thu ghi một buổi hòa nhạc của Skidmore College Orchestra do Anthony Holland chỉ
    huy, được Musopen phát hành; người chơi piano không được ghi tên.
  loai: ten
- trang: nghe-nhac/rachmaninoff-2
  id: n18
  cau: Sau khi chương III kết thúc, file còn tiếng vỗ tay và một bản piano độc tấu chơi thêm.
  loai: so-lieu
- trang: nghe-nhac/rachmaninoff-2
  id: n19
  cau: 'Bảng theo dõi, dòng 1: piano độc tấu mở đầu: 8 hợp âm to dần, ngân như tiếng chuông,
    xen với nốt trầm Fa lặp lại.'
  loai: cau-truc
- trang: nghe-nhac/rachmaninoff-2
  id: n20
  cau: 'Dòng 2: đàn dây hát chủ đề chính rộng lớn ở Đô thứ; piano đệm bằng những hợp âm rải
    cuồn cuộn.'
  loai: cau-truc
- trang: nghe-nhac/rachmaninoff-2
  id: n21
  cau: 'Dòng 3: piano hát chủ đề 2 trữ tình ở Mi♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/rachmaninoff-2
  id: n22
  cau: 'Dòng 4: cao trào: chủ đề 1 trở lại dưới dạng hành khúc mạnh mẽ.'
  loai: cau-truc
- trang: nghe-nhac/rachmaninoff-2
  id: n23
  cau: 'Dòng 5: chương 2 Adagio sostenuto, Mi trưởng; sáo rồi clarinet hát giai điệu chính
    trên nền hợp âm rải của piano.'
  loai: cau-truc
- trang: nghe-nhac/rachmaninoff-2
  id: n24
  cau: 'Dòng 6: chương 3 Allegro scherzando nhanh, nhiều tiết tấu; rồi đàn viola và oboe giới
    thiệu một giai điệu lớn trữ tình.'
  loai: cau-truc
- trang: nghe-nhac/rachmaninoff-2
  id: n25
  cau: 'Dòng 7: giai điệu lớn trở lại ở cả dàn nhạc và piano, hoành tráng, kết ở Đô trưởng.'
  loai: cau-truc
- trang: nghe-nhac/rachmaninoff-2
  id: n26
  cau: Giai điệu lớn của chương 3 từng được chuyển thành ca khúc pop Full Moon and Empty Arms.
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n27
  cau: Nhạc của concerto còn vang lên trong nhiều phim, như Brief Encounter (1945) và The
    Seven Year Itch (1955).
  loai: lich-su
- trang: nghe-nhac/rachmaninoff-2
  id: n28
  cau: 'Nguồn: tổng phổ trên IMSLP.'
  loai: ten
- trang: nghe-nhac/rachmaninoff-2
  id: n29
  cau: 'Nguồn: lời tựa ấn bản Urtext của Henle (HN 1214) cho lịch sử sáng tác và công diễn.'
  loai: ten
- trang: nghe-nhac/rachmaninoff-2
  id: n31
  cau: 'Nguồn: bản thu Musopen trên Wikimedia Commons; tên dàn nhạc và nhạc trưởng theo trang
    tác phẩm trên IMSLP, nơi đăng cùng bản thu này.'
  loai: ten
