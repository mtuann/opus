  nguon: ["https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf"]
  ghi_chu: "Henle: Viñes chơi lần đầu số 5, 8, 9 (14/1/1911) và số 12 (bản Anh ghi 10/2/1912, bản Pháp ghi 'le 10 février suivant' tức 1911); Liebich số 3, 4 (16/1/1911); Debussy chơi số 3, 4, 6, 12 ngày 29/3/1911; mọi buổi ở Paris. Số 7 không được nhắc; 'phần lớn' là đúng. Lưu ý: IMSLP và PTNA ghi Jane Mortier chơi trọn 12 bản ngày 3/5/1911, còn Henle viết không có buổi ra mắt trọn bộ."
