- trang: nghe-nhac/debussy-preludes
  id: n15
  luot_2: dung
  nguon: ["https://archive.org/details/preludespourpian00debu"]
  ghi_chu: "Đối chiếu hóa biểu bản in Durand 1910: V viết 5 thăng (Si trưởng), VI một giáng (Rê thứ), VIII sáu giáng (Sol♭ trưởng), X không dấu (Đô trưởng), XII một thăng; các giọng kề nhau không đi theo vòng quãng năm hay thứ tự nào như Chopin."
- trang: nghe-nhac/debussy-preludes
  id: n16
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf"]
  ghi_chu: "Henle: theo ngày Debussy ghi, cả quyển viết trong chưa đầy hai tháng; nhưng phác thảo của ba prélude trong một sổ tay 1907–1908 cho thấy ông đã làm từ trước. PTNA ghi 7/12/1909–4/2/1910."
- trang: nghe-nhac/debussy-preludes
  id: n17
  luot_2: dung
  nguon: ["https://archive.org/details/preludespourpian00debu", "https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf"]
  ghi_chu: "Bản in Durand 1910: tên in cuối mỗi bản, như '(...Voiles)', '(... Danseuses de Delphes)'; Henle: tên đặt ở cuối, trong ngoặc đơn."
- trang: nghe-nhac/debussy-preludes
  id: n18
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf", "https://enc.piano.or.jp/en/musics/115"]
  ghi_chu: "Henle: đặt tên ở cuối, trong ngoặc, cho người chơi hiểu không cần biết tên trước khi chơi, tên không quyết định cách diễn; PTNA nói tương tự (để không trói buộc trí tưởng tượng)."
- trang: nghe-nhac/debussy-preludes
  id: n19
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf", "https://enc.piano.or.jp/en/musics/22375"]
  ghi_chu: "Henle: Delphi (cột ở Louvre), câu thơ Baudelaire, truyền thuyết thành Ys xứ Bretagne, Puck của Shakespeare, Napoli (Anacapri). PTNA: tên Minstrels lấy từ một buổi minstrel show Debussy xem ở Eastbourne (Anh) mùa hè 1905; minstrel show là loại hình giải trí của Mỹ, nên 'gánh hát giải trí của Mỹ' hiểu là kiểu Mỹ (gánh Debussy xem diễn ở Anh)."
- trang: nghe-nhac/debussy-preludes
  id: n20
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260930011523/https://www.britannica.com/art/Impressionism-music"]
  ghi_chu: "Britannica: lối viết ấn tượng có 'static harmony', nhấn vào âm sắc tạo 'colours', 'disrupting the forward motion of standard harmonic progressions'. Ý câu (hòa âm cổ điển là con đường tiến tới, ở Debussy là màu) hợp với mô tả này; vế Mozart/Beethoven là cách nói giản lược."
- trang: nghe-nhac/debussy-preludes
  id: n21
  luot_2: dung
  nguon: ["https://intmus.github.io/inttheory/21-advanced-scales-and-meters/a2-tx-nondiatonicscales.html", "https://archive.org/details/preludespourpian00debu"]
  ghi_chu: "Integrated Music Theory: gam toàn cung chỉ có cung nguyên, không có nửa cung nên không có nốt nào được nhấn làm trọng tâm, cảm giác mơ hồ. Bản in 1910: Voiles dùng Đô–Rê–Mi–Fa♯–Sol♯–Si♭."
- trang: nghe-nhac/debussy-preludes
  id: n22
  luot_2: dung
  nguon: ["https://archive.org/details/preludespourpian00debu", "https://enc.piano.or.jp/en/musics/115"]
  ghi_chu: "Bản in 1910: giai điệu mở đầu chỉ dùng Rê♭, Si♭, Sol♭, La♭, Mi♭ (năm nốt ngũ cung của Sol♭ trưởng)."
- trang: nghe-nhac/debussy-preludes
  id: n23
  luot_2: dung
  nguon: ["https://cs.nyu.edu/~nhan/JoSSH_vol-3_no-5_ver-12_20171215.pdf"]
  ghi_chu: "Ngô Thanh Nhàn, Phan Gia Anh Thư (VNU Journal of Social Sciences and Humanities, 2017): nhạc cổ truyền và dân gian Việt dùng nhiều gam ngũ cung; bài cũng lưu ý cao độ ngũ cung miền Bắc hơi khác gam phương Tây và Trung Hoa."
- trang: nghe-nhac/debussy-preludes
  id: n24
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/115", "https://archive.org/details/preludespourpian00debu"]
  ghi_chu: "PTNA (La cathédrale engloutie): hợp âm quãng năm và quãng bốn đi lên, rồi tiếng hát của các tu sĩ như một giai điệu điệu thức. Bản in 1910 có các chuỗi hợp âm song song (sans nuances). Ý 'như thánh ca thời Trung cổ' là cách so sánh, PTNA nói tương tự (tiếng hát của tu sĩ)."
- trang: nghe-nhac/debussy-preludes
  id: n25
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/115", "https://archive.org/details/preludespourpian00debu"]
  ghi_chu: "PTNA: Voiles có nốt trầm Si♭ ngân suốt; Danseuses có bè trầm chủ âm ngân; bản in 1910 La cathédrale có nốt trầm ngân dài."
- trang: nghe-nhac/debussy-preludes
  id: n26
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260930011523/https://www.britannica.com/art/Impressionism-music"]
  ghi_chu: "Britannica: thuật ngữ được đưa vào âm nhạc theo phép so sánh với hội họa Pháp cùng thời (trường phái ấn tượng, mà Monet là người tiêu biểu)."
- trang: nghe-nhac/debussy-preludes
  id: n27
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260930011523/https://www.britannica.com/art/Impressionism-music", "https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf"]
  ghi_chu: "Britannica: 'it was disliked by Debussy himself'; Henle: Debussy khó chịu khi thường bị gọi là 'impressionist'."
- trang: nghe-nhac/debussy-preludes
  id: n28
  luot_2: dung
  nguon: ["https://archive.org/details/preludespourpian00debu", "https://web.archive.org/web/20260930011523/https://www.britannica.com/art/Impressionism-music"]
  ghi_chu: "Bản in 1910: nhiều chỉ dẫn pp, 'laissant vibrer', nốt trầm ngân (8a bassa), hợp âm trải nhiều quãng tám; Britannica nói về hòa âm tĩnh và màu sắc. Câu là mô tả chung, hợp với bản nhạc."
- trang: nghe-nhac/debussy-preludes
  id: n30
  luot_2: dung
  nguon: ["https://djupdal.org/karstein/debussy/method/m08.shtml"]
  ghi_chu: "Trang của Karstein Djupdal trích sách của Marguerite Long (At the Piano with Debussy, tr. 13): 'One must forget that the piano has hammers' là một trong những câu Debussy hay nói nhất. (Lesure trong lời tựa Henle khuyên dè chừng các giai thoại của Long, nhưng câu ở đây chỉ nói 'theo hồi ức của Long'.)"
