  nguon: ["https://web.archive.org/web/20260930011523/https://www.britannica.com/art/Impressionism-music", "https://imslp.org/wiki/Pr%C3%A9ludes,_Livre_2,_CD_131_(Debussy,_Claude)"]
  ghi_chu: "Britannica: chủ nghĩa ấn tượng trong âm nhạc là phong cách do Debussy khởi xướng cuối thế kỷ 19; quyển 1 viết 1909–1910 (đầu thế kỷ 20). IMSLP xếp quyển 2 vào 'Early 20th century' (quyển 1 IMSLP lại ghi 'Romantic')."
