- trang: nghe-nhac/debussy-preludes
  id: n39
  luot_2: sai
  nguon: ["https://www.henle.de/media/66/28/72/1690886073/0383-1690886073-sync.pdf", "https://www.louvre.fr/le-louvre-en-france-et-dans-le-monde/la-gypsotheque-du-louvre", "https://api.europeana.eu/record/v2/2064913/https___www_searchculture_gr_aggregator_edm_Delphi_Museum_000051__3A11535_50.json?wskey=api2demo"]
  cau_dung: "I: gợi hứng từ ba vũ nữ trên đỉnh một cột đá cổ tìm thấy ở Delphi (Hy Lạp); Debussy xem bản đúc của cột này ở bảo tàng Louvre (Paris)."
  ghi_chu: "Henle: 'three Bacchantes atop a column displayed in the Louvre'. Nhưng cột đá gốc (cột Acanthus với ba vũ nữ) tìm thấy ở đền Apollo, nay ở bảo tàng Delphi (bản ghi Europeana của Bảo tàng Delphi); Louvre có bản đúc thạch cao 'colonne des Danseuses' (gypsothèque của Louvre, nay ở Versailles). Câu viết như thể cột đá cổ nằm ở Louvre."
- trang: nghe-nhac/debussy-preludes
