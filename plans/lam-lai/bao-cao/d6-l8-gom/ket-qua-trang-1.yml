- trang: nghe-nhac/debussy-preludes
  id: n14
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Pr%C3%A9ludes,_Livre_2,_CD_131_(Debussy,_Claude)", "https://enc.piano.or.jp/en/musics/115"]
