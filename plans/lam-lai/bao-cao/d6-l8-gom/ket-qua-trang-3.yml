  ghi_chu: "Henle: première 3/4/1869 ở Copenhagen, Neupert chơi; IMSLP: 1869-04-03 in København, Edmund Neupert soloist."
- trang: nghe-nhac/grieg-concerto
  id: n7
  luot_2: dung
