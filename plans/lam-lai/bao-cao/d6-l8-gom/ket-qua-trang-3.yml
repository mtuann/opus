  luot_2: dung
  nguon: ["https://www.henle.de/media/90/e1/20/1690886074/0719-1690886074-sync.pdf", "https://www.bso.org/works/grieg-piano-concerto"]
  ghi_chu: "Henle: sửa 1872/1882 và 1906–1907, gửi bản sửa cho Peters tháng 7–8/1907; BSO: 'continued to touch up details ... for the rest of his life'."
- trang: nghe-nhac/grieg-concerto
