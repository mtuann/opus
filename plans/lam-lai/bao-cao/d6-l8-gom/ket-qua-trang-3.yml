- trang: nghe-nhac/grieg-concerto
  id: n11
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)"]
  ghi_chu: "IMSLP: Average Duration 28 minutes; bản thu trên trang: O'Doan 12:43+6:30+10:15 ≈ 29,5 phút, Rubinstein 13:29+6:04+10:21 ≈ 30 phút."
- trang: nghe-nhac/grieg-concerto
  id: n12
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Category:Grieg,_Edvard", "https://www.bso.org/works/grieg-piano-concerto", "https://www.musicprogramnotes.com/grieg-piano-concerto-in-a-minor-op-16/"]
  ghi_chu: "Grieg sinh 15/6/1843 (IMSLP), viết concerto mùa hè 1868 ở Søllerød (BSO) nên 25 tuổi; musicprogramnotes: 'the 25 year old's concerto'. Phần 'sức vóc của cây đàn' là nhận xét, khớp bản nhạc."
- trang: nghe-nhac/grieg-concerto
  id: n13
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Piano_Concerto_in_B_minor,_EG_120_(Grieg,_Edvard)"]
  ghi_chu: "IMSLP EG 120: Piano Concerto in B minor 1882–83, 'Incomplete fragment only', 'Unfinished'; nên Op. 16 là concerto duy nhất hoàn thành."
- trang: nghe-nhac/grieg-concerto
  id: n15
  luot_2: dung
  nguon: ["https://www.henle.de/media/90/e1/20/1690886074/0719-1690886074-sync.pdf", "https://lex.dk/Søllerød"]
  ghi_chu: "Henle: Sölleröd, Đan Mạch. Lex.dk: Søllerød là vùng ngoại ô 16 km phía bắc København, lõi cũ là 'kirkelandsby' (làng có nhà thờ), thuộc vùng quanh København (trên đảo Sjælland; Lex không ghi chữ Sjælland, suy ra từ vị trí)."
- trang: nghe-nhac/grieg-concerto
  id: n16
  luot_2: dung
  nguon: ["https://www.bso.org/works/grieg-piano-concerto", "https://berliner-philharmoniker.de/en/programme-notes/edvard-grieg-concerto-for-piano-and-orchestra-in-a-minor-op-16", "https://www.henle.de/media/90/e1/20/1690886074/0719-1690886074-sync.pdf"]
  ghi_chu: "BSO: 'Copenhagen on April 3, 1869 ... Edmund Newpert as soloist and Holger Simon Paulli conducting'; Berliner Phil cũng ghi Paulli chỉ huy, Neupert độc tấu; Henle: Neupert là người được đề tặng."
- trang: nghe-nhac/grieg-concerto
  id: n17
  luot_2: dung
  nguon: ["https://www.musicprogramnotes.com/grieg-piano-concerto-in-a-minor-op-16/"]
  ghi_chu: "musicprogramnotes.com: Grieg 'could not attend the premiere'. Nguồn bậc thấp (chương trình hòa nhạc), không thấy nguồn nào nói ngược lại."
- trang: nghe-nhac/grieg-concerto
  id: n18
  luot_2: dung
  nguon: ["https://www.bso.org/works/grieg-piano-concerto", "https://etudemagazine.com/etude/1936/11/the-gift-of-liszt-to-grieg.html"]
  ghi_chu: "BSO: tháng 4/1870 ở Rome Liszt 'played at sight from the manuscript score the entire concerto', khen 'Keep on, I tell you'. Etude (1936): Liszt đọc thị tấu trước 'his guests', khen chương cuối và bảo Grieg cứ tiếp tục."
- trang: nghe-nhac/grieg-concerto
  id: n20
  luot_2: dung
  nguon: ["https://www.henle.de/media/90/e1/20/1690886074/0719-1690886074-sync.pdf", "https://www.bso.org/works/grieg-piano-concerto"]
  ghi_chu: "Henle: thư 21/7/1907 gửi Hinrichsen bản sửa, thư 8/8/1907 gửi tổng phổ và phần riêng đã sửa; Grieg mất 4/9. BSO: gửi bản sửa cuối 21/7/1907, sáu tuần trước khi mất."
- trang: nghe-nhac/grieg-concerto
  id: n21
  luot_2: dung
  nguon: ["https://berliner-philharmoniker.de/en/programme-notes/edvard-grieg-concerto-for-piano-and-orchestra-in-a-minor-op-16", "https://archive.org/details/concertfrdaspian00schu", "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)"]
  ghi_chu: "Berliner Phil: Grieg 'chose the same key of A minor'; bản Schumann Op. 54 (Peters, Internet Archive) ghi A minor; IMSLP: Op. 16 Key A minor."
- trang: nghe-nhac/grieg-concerto
  id: n22
  luot_2: dung
  nguon: ["https://archive.org/details/concertfrdaspian00schu", "https://archive.org/details/concertoforpianoo00grie", "https://berliner-philharmoniker.de/en/programme-notes/edvard-grieg-concerto-for-piano-and-orchestra-in-a-minor-op-16"]
  ghi_chu: "Lượt 1 còn mở. Đã đối chiếu tổng phổ Schumann Op. 54 (Peters, bản Dörffel, Internet Archive): ô 1 cả dàn nhạc đánh một hợp âm, piano lập tức đổ xuống một chuỗi hợp âm chấm dôi từ âm vực cao (ô 1–3). Grieg (bản Grainger, Schirmer 1920, Internet Archive): timpani vê to dần rồi piano đổ xuống từ quãng tám cao. Cả hai đều mở bằng cú đổ của piano, chỉ khác cú mở màn rất ngắn của dàn nhạc (Schumann: hợp âm tutti; Grieg: timpani). Berliner Phil: 'The opening in particular seems almost like a stylistic imitation'."
- trang: nghe-nhac/grieg-concerto
  id: n23
  luot_2: dung
  nguon: ["https://www.deutschegrammophon.com/en/catalogue/products/grieg-schumann-piano-concertos-zimermankarajan-6647", "https://musicbrainz.org/release-group/1d3b3404-c726-43e4-be6f-777ef8cd2f25", "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)"]
  ghi_chu: "DG: Zimerman/Karajan ghép Grieg và Schumann; MusicBrainz: Lipatti 'plays the Grieg and Schumann Piano Concertos'; IMSLP: album Rami Bar-Niv 'In A minor: Piano Concertos by Grieg and Schumann'."
- trang: nghe-nhac/grieg-concerto
  id: n24
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Category:Wenzel,_Ernst_Ferdinand", "https://www.grandemusica.iovan.net/musical-biographies-w-1/wenzel-ernst-ferdinand"]
  ghi_chu: "IMSLP: Wenzel 'taught at the Leipzig Conservatory (pupils included Grieg). Friend of Schumann.' Grande Musica: 'intimate friend of Schumann and Mendelssohn', dạy piano ở Nhạc viện Leipzig từ 1843."
- trang: nghe-nhac/grieg-concerto
  id: n25
  luot_2: dung
  nguon: ["https://berliner-philharmoniker.de/en/programme-notes/edvard-grieg-concerto-for-piano-and-orchestra-in-a-minor-op-16"]
  ghi_chu: "Berliner Phil: Grieg (học ở Leipzig từ 10/1858) nghe concerto của Schumann ở Gewandhaus 'with Clara Schumann, the composer's widow, as soloist'."
- trang: nghe-nhac/grieg-concerto
  id: n26
  luot_2: dung
  nguon: ["https://archive.org/details/concertoforpianoo00grie", "https://www.bso.org/works/grieg-piano-concerto"]
  ghi_chu: "Bản Grainger (Schirmer 1920), trang 2: nốt trên của cú đổ là La – Sol♯ – Mi, lặp xuống qua các quãng tám (La→Sol♯ nửa cung, Sol♯→Mi quãng ba trưởng). BSO: 'a very characteristic Norwegian melodic gesture', một quãng hai xuống rồi một quãng ba xuống."
- trang: nghe-nhac/grieg-concerto
  id: n27
  luot_2: dung
  nguon: ["https://archive.org/details/concertoforpianoo00grie"]
  ghi_chu: "Ba nốt La5, Sol♯5, Mi5 có trong cú đổ (hợp âm mở đầu La–Đô–Mi–La ở quãng tám 5–6, ghi 8va); đúng mô-típ. Phần bàn phím của site không kiểm ở đây."
- trang: nghe-nhac/grieg-concerto
  id: n28
  luot_2: dung
  nguon: ["https://snl.no/halling", "https://www.bso.org/works/grieg-piano-concerto"]
  ghi_chu: "Store norske leksikon (halling): điệu nhảy dân gian Na Uy, 'særleg av menn', nhiều biến thể 'akrobatiske innslag', 'hallingkast' đá văng chiếc mũ giơ cao trên cây sào; nhạc 'todelt takt' (2/4 hay 6/8). BSO: chương cuối dùng nhịp điệu halling."
- trang: nghe-nhac/grieg-concerto
  id: n30
  luot_2: dung
  nguon: ["https://archive.org/details/concertoforpianoo00grie", "https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Bản nhạc (Grainger 1920; tổng phổ trên Internet Archive): hợp âm đầy, quãng tám, chuỗi nốt đổ xuống ở cả ba chương (vd. mở đầu, cadenza, coda chương 1)."
- trang: nghe-nhac/grieg-concerto
  id: n33
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard", "https://www.henle.de/media/90/e1/20/1690886074/0719-1690886074-sync.pdf"]
  ghi_chu: "Tổng phổ chương 1 (trang 26–28 bản Internet Archive): cadenza viết sẵn trong bản nhạc, piano một mình, mở Adagio rồi pp legato, lên fff với hợp âm và tremolo khắp bàn phím, rồi Lento, Tempo I. Henle nhắc 'the first-movement cadenza' trong thư của Grieg."
- trang: nghe-nhac/grieg-concerto
  id: n34
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Tổng phổ chương 2: piano vào với những nét trang trí (láy, chuỗi nốt nhỏ) ở âm vực cao, nhẹ (p, dolce)."
- trang: nghe-nhac/grieg-concerto
  id: n37
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Edvard_Grieg_-_Concerto_in_A_minor,_1st_movement.ogg", "https://imslp.org/wiki/Piano_Concerto,_Op.16_(Grieg,_Edvard)"]
  ghi_chu: "Commons: 'Peter Erős conducts the University of Washington Symphony orchestra; Neal O'Doan, piano'. IMSLP: Neal O'Doan (Piano), University of Washington Symphony / Peter Eros."
- trang: nghe-nhac/grieg-concerto
  id: n39
  luot_2: dung
  nguon: ["https://archive.org/details/concertoforpianoo00grie", "https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Bản Grainger trang 2: Timp. pp vê, 'molto' cresc., rồi piano Solo ff đổ xuống bằng La–Sol♯–Mi."
- trang: nghe-nhac/grieg-concerto
  id: n40
  luot_2: dung
  nguon: ["https://archive.org/details/concertoforpianoo00grie", "https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Bản Grainger trang 2–4: Tutti p giới thiệu chủ đề La thứ (dàn nhạc), sau đó 'A Solo' piano chơi lại chủ đề."
- trang: nghe-nhac/grieg-concerto
  id: n41
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard", "https://archive.org/details/concertoforpianoo00grie"]
  ghi_chu: "Tổng phổ trang 9: 'Più lento', Violoncello mf hát nét chủ đề thứ hai trước, rồi ở chữ C piano 'tranquillo e cantabile' chơi chủ đề ở Đô trưởng."
- trang: nghe-nhac/grieg-concerto
  id: n42
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Tổng phổ trang 12–20 (Animato, Tempo I): chủ đề chính và các nét của nó luân phiên giữa piano và dàn nhạc, cường độ tăng. Đối chiếu tổng quát, không đếm từng ô."
- trang: nghe-nhac/grieg-concerto
  id: n43
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Tổng phổ trang 25–27: 'Più lento' lần hai, chủ đề thứ hai ở hóa biểu ba thăng (La trưởng)."
- trang: nghe-nhac/grieg-concerto
  id: n44
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Tổng phổ: cadenza piano một mình (trang 27–29), dàn nhạc vào lại (Poco più Allegro), trang cuối chương 1 piano đổ xuống bằng chuỗi hợp âm La–Sol♯–Mi như mở đầu, kết hợp âm La thứ."
- trang: nghe-nhac/grieg-concerto
  id: n45
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Tổng phổ chương 2 (trang 34): Adagio, năm giáng (Rê♭ trưởng), đàn dây 'Con sordini' pp hát giai điệu; piano vào sau với nét trang trí ở âm vực cao."
- trang: nghe-nhac/grieg-concerto
  id: n46
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard", "https://archive.org/details/concertoforpianoo00grie"]
  ghi_chu: "Tổng phổ chương 2 (chữ B): piano chơi chủ đề bằng hợp âm đầy, ff pesante; cuối chương không có vạch kết, đổi sang hóa biểu và nhịp 2/4 của chương 3; bản Grainger ghi 'attacca'."
- trang: nghe-nhac/grieg-concerto
  id: n47
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Tổng phổ chương 3 (trang 42): Allegro moderato molto e marcato 2/4; vài ô dàn nhạc dẫn (pp staccato, pizz.), rồi piano ff một chuỗi nốt chạy tự do, sau đó vào điệu nhảy ở La thứ."
- trang: nghe-nhac/grieg-concerto
  id: n48
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Tổng phổ chương 3 (trang 56–57): 'Poco più tranquillo', Fl. I Solo hát giai điệu ở Fa trưởng (đàn dây tremolo sul ponticello hợp âm Fa–La–Đô), rồi piano chơi lại giai điệu trên bè trầm Fa của cello."
- trang: nghe-nhac/grieg-concerto
  id: n49
  luot_2: dung
  nguon: ["https://archive.org/details/imslp-concerto-op16-grieg-edvard", "https://archive.org/details/concertoforpianoo00grie"]
  ghi_chu: "Tổng phổ: 'Tempo I animato' (halling trở lại) rồi 'Quasi Presto' (♩.=80) ở nhịp 3/4."
- trang: nghe-nhac/grieg-concerto
  id: n50
  luot_2: dung
  nguon: ["https://archive.org/details/concertoforpianoo00grie", "https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Bản Grainger trang 78 và tổng phổ trang 76: 'Andante maestoso', hóa biểu ba thăng (La trưởng), chủ đề sáo ở dàn nhạc ff, piano fff hợp âm rải, đến hợp âm cuối."
- trang: nghe-nhac/grieg-concerto
  id: n51
  luot_2: dung
  nguon: ["https://archive.org/details/concertoforpianoo00grie", "https://archive.org/details/imslp-concerto-op16-grieg-edvard"]
  ghi_chu: "Mô-típ La–Sol♯–Mi lặp xuống qua các quãng tám trong cú đổ mở đầu, và trở lại trong chuỗi hợp âm của piano ở các ô cuối chương 1 (tổng phổ trang 32)."
- trang: nghe-nhac/grieg-concerto
  id: n53
  luot_2: dung
  nguon: ["https://musicbrainz.org/release/8b2a7ea5-0998-447e-86fb-2e32e6cd50f2"]
  ghi_chu: "MusicBrainz: Lipatti, Philharmonia Orchestra, Alceo Galliera, ghi âm 18/9/1947, hãng EMI (Angel), nhà sản xuất Walter Legge."
- trang: nghe-nhac/grieg-concerto
  id: n54
  luot_2: dung
  nguon: ["https://www.deutschegrammophon.com/en/catalogue/products/grieg-schumann-piano-concertos-zimermankarajan-6647"]
  ghi_chu: "Deutsche Grammophon: Krystian Zimerman, Berliner Philharmoniker, Herbert von Karajan; Grieg Piano Concerto và Schumann Piano Concerto."
- trang: nghe-nhac/grieg-concerto
