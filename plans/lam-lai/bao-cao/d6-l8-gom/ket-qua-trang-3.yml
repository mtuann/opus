  ghi_chu: "Ghép n12 và n13: viết năm 1868 khi Grieg 25 tuổi (sinh 15/6/1843, IMSLP; concerto viết mùa hè 1868, Henle, BSO); concerto số 2 Si thứ EG 120 chỉ là phác thảo dang dở (IMSLP). Phần 'sức vóc của cây đàn' là nhận xét, khớp bản nhạc (xem n30)."
