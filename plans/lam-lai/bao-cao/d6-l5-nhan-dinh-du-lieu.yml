  loai: nam
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n16
  cau: "Tác phẩm: Impromptu số 3, Sol♭ trưởng, Andante, trong Bốn Impromptu Op. 90, D. 899."
  loai: ten
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n17
  cau: Năm 1827. Bài số 1 và 2 in cuối năm 1827 (Tobias Haslinger, Vienna); bài số 3 và 4 đến năm 1857 mới được in, do Carl Haslinger, con trai Tobias, và bài số 3 khi ấy bị dịch sang Sol trưởng.
  loai: lich-su
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n18
  cau: "Giọng · nhịp · tốc độ: Sol♭ trưởng (sáu dấu giáng) · 4/2 (bốn phách nốt trắng mỗi ô) · Andante; 86 ô nhịp, khoảng 5–7 phút."
  loai: cau-truc
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n19
  cau: "Hình thức: ba phần có coda: A (ô 1–24) – B (ô 25–54, gồm đường về ở ô 53–54) – A' (ô 55–74) – coda (ô 75–86); số ô theo ấn bản Breitkopf & Härtel 1888."
  loai: cau-truc
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n20
  cau: "Độ khó: sau Grade 8: ABRSM đưa bài vào danh sách tác phẩm của bằng ARSM; Henle xếp mức 6 (trung bình) trên thang 1–9."
  loai: cap-do
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n21
  cau: "Kỹ năng chính (thong_tin): giai điệu nốt dài (ngón 4–5) trên dòng móc đơn chùm sáu (ngón 1–2–3) trong cùng tay phải; dòng đệm đều và nhẹ; bè trầm có đường nét; láy rền ở âm vực trầm; bàn đạp nối theo hòa âm; câu nhạc rất dài; đọc sáu dấu giáng và dấu giáng kép."
  loai: cau-truc
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n22
  cau: "Bản nhạc: IMSLP; bản Urtext ở giọng gốc: Henle (có ấn bản riêng của bài số 3, HN 488), Wiener Urtext, Bärenreiter; bản miễn phí của Mutopia theo ấn bản Breitkopf & Härtel 1888; tránh các bản in ở Sol trưởng."
  loai: ten
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n23
  cau: "Hình cấu trúc (bài học): 86 ô nhịp 4/2, độ dài theo số ô: A ô 1–24 (Sol♭ trưởng, pp; chủ đề và câu dài nói hai lần), B ô 25–52 (Mi♭ thứ, f → Mi♭ trưởng), đường về ô 53–54 (láy rền Sol♭1, dấu ngân), A' ô 55–74 (rút gọn), coda ô 75–86 (rẽ hòa âm xa, kết ppp)."
  loai: cau-truc
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n24
  cau: "Ghi chú hình bài học: số ô theo ấn bản Breitkopf & Härtel 1888 (Mutopia), giữ nhịp 4/2; dòng chùm sáu gần như không dừng suốt bài."
  loai: cau-truc
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n25
  cau: "Hình cấu trúc (hướng dẫn nghe): ba đoạn A (Sol♭ trưởng, giai điệu hát trên dòng đệm chảy đều), B (bắt đầu ở Mi♭ thứ, bè trầm nhấn, chuyển giọng liên tục), A' (Sol♭ trưởng, khép lại rất nhỏ), độ rộng 2 : 1,6 : 1,8 (\"gần đúng\")."
  loai: cau-truc
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n26
  cau: "Ghi chú hình hướng dẫn nghe: dòng đệm hợp âm rải gần như không dừng suốt bài."
  loai: cau-truc
- trang: du-lieu/tac-pham/schubert-impromptu-sol-giang
  id: n27
  cau: "Bản thu gợi ý: Chiara Bertoglio, giấy phép CC BY 3.0, trang Commons; dài 357,84 giây."
  loai: ten
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n4
  cau: "Thời kỳ: Cổ điển → Lãng mạn."
  loai: lich-su
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n5
  cau: "Luyện nghe: phần mở đầu chậm quay lại, rondo."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n6
  cau: "Hình cấu trúc chương 1: Grave mở đầu chậm Đô thứ; trình bày Allegro, chủ đề 2 ở Mi♭ thứ; Grave vài ô; phát triển; tái hiện Đô thứ; coda có Grave thoáng qua."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n7
  cau: "Hình cấu trúc: II. Adagio cantabile, La♭ trưởng, rondo A B A C A; III. Rondo: Allegro, Đô thứ, các đoạn xen ở Mi♭ và La♭ trưởng."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n8
  cau: "Ghi chú của hình: phần Grave quay lại hai lần trong chương 1, ở đầu phần phát triển và trong coda; độ dài các ô chỉ minh họa."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n9
  cau: "Bản thu gợi ý: Daniel Veesey, CC0, ba phần (I. Grave – Allegro di molto e con brio 384,52 s; II. Adagio cantabile 380,54 s; III. Rondo: Allegro 269,67 s), trang Commons."
  loai: ten
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n10
  cau: "Ghi chú bản thu: tệp chương I trên Commons dừng ở khoảng 6:24, giữa phần phát triển."
