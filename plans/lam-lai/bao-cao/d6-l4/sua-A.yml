- ban_ghi: tac-pham/mozart-k545
  truong: thong_tin
  cu: '[Độ khó, Chương 1 khoảng ABRSM Grade 6 (ước lượng); chương 3 khó hơn chương 1 một chút]'
  moi: '[Độ khó, ''Chương 1: ABRSM xếp ở Grade 6 (đề cương 2027–2028); chương 3 (Rondo) cũng có ở Grade 6 (đề cương 2017–2018) và, theo lời tựa Henle, khó hơn rõ rệt hai chương đầu'']'
  nhan_dinh: n20
  nguon:
  - https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf
  - https://web.archive.org/web/20191112232528/https://us.abrsm.org/media/12152/piano_2017___2018.pdf
  - https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf
  ly_do: 'Bài có trong đề cương: ABRSM 2027–2028 Grade 6 số 2 "Mozart Allegro (1st movt from Sonata in C, K. 545)"; 2017–2018 Grade 6 "Mozart Rondo (3rd movt from Sonata in C, K. 545)". Ghi kỳ đề cương thay "(ước lượng)", như D6-L1-gom, D6-L3. Henle HN 164: "the closing Rondo ... noticeably raises the level of difficulty", nên "khó hơn một chút" lệch nguồn. Grade đã khóa không đổi. Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang piano/tac-pham/mozart-k545 sau khi áp.'
