  moi: '[Độ khó, ''... Henle xếp cả bản sonata, gồm chương 3 *Presto agitato* khó hơn nhiều, ở mức 7 (khó) trên thang 1–9; riêng chương 1, trong tuyển tập HN 1820 (*At the Piano*), Henle xếp mức 4 (trung bình)'']'
  nhan_dinh: n23
  nguon:
  - https://www.henle.de/en/At-the-Piano-9-well-known-original-pieces/HN-1820
  - https://www.henle.de/en/Piano-Sonata-no.-14-c-sharp-minor-op.-27-no.-2-Moonlight/HN-1062
  ly_do: 'Trang HN 1820 ghi "Adagio sostenuto from: Sonata c sharp minor (Moonlight) op. 27,2 · 4 · medium" (lượt 2 của D2-0 cũng nêu). Giữ "(ước lượng; chặng 5 của site)" vì không đề cương nào xếp riêng chương 1. Grade đã khóa không đổi. Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang piano/tac-pham/beethoven-anh-trang.'
