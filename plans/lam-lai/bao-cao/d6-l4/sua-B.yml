  moi: "hinh.bai-hoc[0].ghi_chu: 'Số ô theo ấn bản Peters (Herrmann Scholtz) qua bản Mutopia; ô 33–64 có dấu nhắc lại. Lần hai của trio (ô 81–96) đi bằng nốt kép, chủ yếu quãng ba, rồi về Si thứ.'"
