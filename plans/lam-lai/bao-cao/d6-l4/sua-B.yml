  moi: "[Độ khó, 'Khoảng ABRSM Grade 5–6: ABRSM xếp bài ở Grade 6 (đề cương 2023–2024), RCM Level 8; Henle mức 4 (trung bình) trên thang 1–9']"
  nhan_dinh: n17
