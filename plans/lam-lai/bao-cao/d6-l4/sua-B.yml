- ban_ghi: tac-pham/schumann-traumerei
  truong: thong_tin
  cu: "[Giọng · nhịp · tốc độ, 'Fa trưởng · 4/4 · Schumann không ghi chữ chỉ tốc độ, chỉ ghi số máy đếm nhịp ♩ = 100; Clara Schumann về sau gợi ý ♩ = 80']"
  moi: "[Giọng · nhịp · tốc độ, 'Fa trưởng · 4/4 · không có chữ chỉ tốc độ; số máy đếm nhịp ♩ = 100 in từ lần in sửa của bản in đầu (1839), Schumann để nguyên; Clara Schumann về sau gợi ý ♩ = 80']"
  nhan_dinh: n16
  nguon:
    - https://www.henle.de/media/f1/4e/7c/1740992228/0044x.pdf
    - https://www.henle.de/media/54/e7/73/1687438503/interview_struck.pdf
    - https://archive.org/details/robschumannswerk01schu
  ly_do: 'Henle HN 44 Comments: "What is new in the corrected print [FE2, tháng 3/1839] are the metronome markings"; Otto Böhme ghi các số này "not stem from R. Schumann"; Struck: "they are authorized, for Schumann did not correct them". "Schumann … chỉ ghi số máy đếm nhịp" nói quá: số ấy không do ông ghi. Vế ♩ = 80 của Clara đúng (Struck). Chip "♩ = 100 (Schumann)" giữ (số được Schumann để nguyên, Henle in như chỉ dẫn của tác giả).'
