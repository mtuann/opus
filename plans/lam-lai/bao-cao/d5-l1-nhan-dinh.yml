- trang: lich-su/nha-soan-nhac
  id: m1
  cau: "Monteverdi (1567–1643): người đứng ở ranh giới Phục hưng và Baroque."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: m2
  cau: Vở L'Orfeo (1607) của ông là một trong những opera đầu tiên và là vở sớm nhất còn được diễn thường xuyên.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: m3
  cau: Ông bảo vệ quan niệm âm nhạc phải phục vụ lời và cảm xúc, kể cả khi phải phá quy tắc hòa âm cũ.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: m4
  cau: "Nghe trước: L'Orfeo; Vespro della Beata Vergine (1610); madrigal Lamento della ninfa."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: p1
  cau: "Henry Purcell: một trong những nhà soạn nhạc Anh vĩ đại nhất, mất năm 36 tuổi."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: p2
  cau: Purcell là bậc thầy của bè trầm lặp lại (ground bass) và phổ nhạc cho tiếng Anh.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: p3
  cau: "Nghe trước: Dido and Aeneas, aria When I am laid in earth; Music for the Funeral of Queen Mary; Rondeau trong Abdelazer (chủ đề Britten dùng cho Young Person's Guide)."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: v1
  cau: "Antonio Vivaldi (1678–1741): linh mục và nghệ sĩ violin người Venice, dạy nhạc nhiều năm tại một trại trẻ mồ côi nữ có dàn nhạc nổi tiếng."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: v2
  cau: Ông viết hơn 500 concerto và góp phần chuẩn hóa concerto ba chương (nhanh – chậm – nhanh).
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: v3
  cau: "Nghe trước: Bốn Mùa; Concerto cho hai violin cung La thứ RV 522; Gloria RV 589."
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: b1
  cau: "J. S. Bach: nghệ sĩ organ bậc thầy, từ năm 1723 làm cantor (giám đốc âm nhạc) ở Leipzig suốt 27 năm cuối đời."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b2
  cau: Bach là bậc thầy tuyệt đối của phức điệu và fugue.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b3
  cau: Sinh thời ông nổi tiếng nhất với tài chơi organ, và rất ít tác phẩm của ông được in khi ông còn sống.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b4
  cau: Làn sóng "tái khám phá" Bach thường được tính từ năm 1829, khi Mendelssohn dàn dựng lại Thương khó theo Thánh Matthew.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b5
  cau: "Nghe trước: Prelude cung Đô trưởng; Tổ khúc cello số 1; Brandenburg Concerto số 3; Thương khó theo Thánh Matthew."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: h1
  cau: "Handel (1685–1759): sinh ở Đức cùng năm với Bach, nhưng làm nên sự nghiệp ở London với opera Ý và sau đó là oratorio tiếng Anh."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: h2
  cau: "Nghe trước: Messiah; Water Music; Music for the Royal Fireworks."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: y1
  cau: "Joseph Haydn: phục vụ gia đình quý tộc Esterházy gần 30 năm."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: y2
  cau: Haydn được gọi là "cha đẻ của giao hưởng" và "cha đẻ của tứ tấu đàn dây" vì đã góp phần định hình cả hai thể loại.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: y3
  cau: Ông viết 104 bản giao hưởng, nổi tiếng với sự hóm hỉnh và bất ngờ.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: y4
  cau: "Nghe trước: Giao hưởng số 94 Surprise; Tứ tấu đàn dây Op. 76 số 3 Hoàng đế; oratorio Sự sáng tạo."
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: z1
  cau: "Mozart: thần đồng biểu diễn khắp châu Âu từ năm 6 tuổi."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: z2
  cau: Mozart sống chỉ 35 năm nhưng để lại khoảng 600 tác phẩm ở mọi thể loại.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: z3
  cau: Các tác phẩm của Mozart được đánh số theo danh mục Köchel (K.).
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: z4
  cau: "Nghe trước (Mozart): Giao hưởng số 40; Eine kleine Nachtmusik K. 525; Concerto piano số 21 K. 467; opera Cây sáo thần (aria Nữ hoàng bóng đêm)."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: e1
  cau: Beethoven học ở Vienna, có thời gian học với Haydn.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: e2
  cau: Beethoven bắt đầu bị mất thính lực từ khoảng năm 1798; bệnh nặng dần, và ông gần như điếc hoàn toàn khi viết những tác phẩm cuối đời.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: e3
  cau: Beethoven là cây cầu từ Cổ điển sang Lãng mạn, đưa giao hưởng và sonata lên quy mô và chiều sâu chưa từng có.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: e4
  cau: "Nghe trước (Beethoven): Giao hưởng số 5; Sonata piano Ánh trăng; Giao hưởng số 9; Tứ tấu đàn dây Op. 132."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: u1
  cau: Mất năm 31 tuổi, Schubert viết hơn 600 ca khúc nghệ thuật (Lied), biến thể loại này thành đỉnh cao của nhạc Lãng mạn.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: u2
  cau: "Nghe trước (Schubert): Erlkönig; Ngũ tấu Con cá hồi; Giao hưởng số 8 Dang dở."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: n1
  cau: "Mendelssohn: thần đồng âm nhạc, viết Bát tấu đàn dây năm 16 tuổi và khúc mở màn Giấc mộng đêm hè năm 17 tuổi."
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: n2
  cau: Mendelssohn là nhạc trưởng dàn nhạc Gewandhaus Leipzig và người dàn dựng lại Thương khó theo Thánh Matthew của Bach năm 1829, khơi dậy phong trào phục hưng âm nhạc Bach.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: n3
  cau: Chị gái Mendelssohn là Fanny Mendelssohn Hensel.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: n4
  cau: "Nghe trước (Mendelssohn): Concerto violin cung Mi thứ; khúc mở màn Giấc mộng đêm hè; Giao hưởng số 4 Ý."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: n5
  cau: Mục Mendelssohn (1809) được xếp trước Chopin (1810) và Schumann (1810), theo thứ tự năm sinh.
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: c1
  cau: Chopin sinh ở Ba Lan, từ năm 1831 sống và làm việc ở Paris.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: c2
  cau: Gần như mọi tác phẩm của Chopin đều cho piano.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: c3
  cau: Chopin được xếp vào hàng những "nhà thơ âm thanh" (tone poet) lớn nhất.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: c4
  cau: "Nghe trước (Chopin): Nocturne Op. 9 số 2; Ballade số 1; Étude Op. 10 số 3."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: r1
  cau: Schumann là nhà soạn nhạc, nhà phê bình âm nhạc, sáng lập tạp chí Neue Zeitschrift für Musik và viết bài ca ngợi Chopin, Brahms.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: r2
  cau: Schumann là chồng của nghệ sĩ piano Clara Schumann.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: r3
  cau: Những năm cuối đời Schumann bị bệnh tâm thần nặng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: r4
  cau: "Nghe trước (Schumann): Kinderszenen Op. 15 (có Träumerei); Dichterliebe Op. 48; Concerto piano cung La thứ."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: l1
  cau: Liszt là một trong những nghệ sĩ piano điêu luyện nhất thế kỷ 19, người tạo ra buổi độc tấu piano (recital) theo kiểu hiện đại và thể loại thơ giao hưởng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: l2
  cau: "Nghe trước (Liszt): Liebestraum số 3; Hungarian Rhapsody số 2; Sonata cung Si thứ."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: w1
  cau: "Wagner cách mạng hóa opera thành thứ thường được gọi là nhạc kịch (Musikdrama, thuật ngữ mà chính Wagner không ưa): âm nhạc liền mạch, không chia aria, các leitmotif gắn với nhân vật và ý tưởng."
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: w2
  cau: Wagner tự viết lời và xây nhà hát riêng ở Bayreuth.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: w3
  cau: Hòa âm của Tristan und Isolde mở đường cho âm nhạc thế kỷ 20.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: w4
  cau: Quan điểm bài Do Thái trong các bài viết của Wagner vẫn là vấn đề gây tranh cãi khi biểu diễn và đánh giá ông.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: w5
  cau: "Nghe trước (Wagner): Tristan und Isolde, Khúc dạo đầu; Die Walküre, Cuộc phi ngựa của các Valkyrie; Siegfried Idyll."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: d1
  cau: Verdi là nhà soạn opera Ý có ảnh hưởng và được yêu thích nhất nửa sau thế kỷ 19, sinh cùng năm với Wagner.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: d2
  cau: Opera của Verdi kịch tính, giai điệu mạnh mẽ, thường được gắn với phong trào thống nhất nước Ý.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: d3
  cau: Verdi viết opera đến tận tuổi gần 80 (Falstaff, 1893).
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: d4
  cau: "Nghe trước (Verdi): La traviata; Rigoletto, aria La donna è mobile; Requiem, đoạn Dies irae."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: a1
  cau: Brahms là người kế thừa truyền thống Beethoven, kết hợp hình thức chặt chẽ với cảm xúc Lãng mạn sâu lắng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: a2
  cau: "Dấu vân tay của Brahms: cấu trúc cổ điển chặt chẽ cùng nhiều phát triển chủ đề mới mẻ, và sở trường về hình thức biến tấu."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: a3
  cau: "Nghe trước (Brahms): Giao hưởng số 4; Concerto violin; Hungarian Dances."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: i1
  cau: Bizet là nhà soạn nhạc Pháp, mất năm 36 tuổi chỉ vài tháng sau khi vở opera Carmen ra mắt.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: i2
  cau: Carmen ban đầu bị chê là "vô luân và thô tục" nhưng sau đó trở thành một trong những opera được yêu thích nhất thế giới.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: i3
  cau: Âm nhạc Bizet đầy màu sắc Tây Ban Nha và giai điệu bắt tai.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: i4
  cau: "Nghe trước (Bizet): Carmen (Habanera); L'Arlésienne, tổ khúc; Les Pêcheurs de perles (Người mò ngọc trai)."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: t1
  cau: Tchaikovsky là nhà soạn nhạc Nga nổi tiếng với giai điệu dễ nhớ, tác giả của ba vở ballet nổi tiếng bậc nhất thế giới.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: t2
  cau: "Dấu vân tay của Tchaikovsky: giai điệu đẹp đến nao lòng, dàn nhạc phối khí rực rỡ nhiều màu sắc, và cảm xúc nồng nhiệt, hướng thẳng vào trái tim."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: t3
  cau: "Nghe trước (Tchaikovsky): Hồ thiên nga; Concerto piano số 1; Giao hưởng số 6 Bi tráng."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: o1
  cau: Dvořák là nhà soạn nhạc Séc đưa chất dân ca vào nhạc giao hưởng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: o2
  cau: Dvořák sống ở Mỹ ba năm và viết Giao hưởng số 9 tại đó.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: o3
  cau: "Dấu vân tay của Dvořák: giai điệu tươi sáng, mộc mạc như dân ca; tiết tấu nảy, rộn ràng; âm nhạc thường toát lên niềm vui sống và nỗi nhớ quê hương."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: o4
  cau: "Nghe trước (Dvořák): Giao hưởng số 9 Từ Thế giới mới (chương Largo); Concerto cello; Tứ tấu đàn dây Mỹ."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: g1
  cau: Grieg là nhà soạn nhạc Na Uy, đưa dân ca và phong cảnh Bắc Âu vào nhạc cổ điển; nổi tiếng với các tiểu phẩm ngắn (10 tập Lyric Pieces cho piano).
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: g2
  cau: "Dấu vân tay của Grieg: những tiểu phẩm giàu chất thơ, gắn với dân ca và phong cảnh Na Uy; ông tránh các hình thức lớn như opera hay giao hưởng."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: g3
  cau: "Nghe trước (Grieg): Peer Gynt: Buổi sáng, Trong cung điện vua núi; Concerto piano cung La thứ; Holberg Suite."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: x1
  cau: Elgar là nhà soạn nhạc Anh tự học phần lớn, nổi tiếng muộn ở tuổi ngoài 40 với Enigma Variations.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: x2
  cau: Tác phẩm của Elgar mở ra thời kỳ nở rộ hiện đại của âm nhạc Anh.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: x3
  cau: "Nghe trước (Elgar): Enigma Variations, biến tấu Nimrod; Concerto cello cung Mi thứ; Pomp and Circumstance số 1."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: q1
  cau: "Puccini là nhà soạn opera Ý với nhiều vở theo trường phái verismo: đời sống thường ngày, cảm xúc mãnh liệt, giai điệu không thể quên."
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: q2
  cau: Opera của Puccini thuộc nhóm được diễn nhiều nhất thế giới.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: q3
  cau: Turandot dang dở khi Puccini mất.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: q4
  cau: "Nghe trước (Puccini): La bohème; Tosca; Gianni Schicchi, aria O mio babbino caro."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: k1
  cau: Mahler là nhạc trưởng lừng danh, tác giả những bản giao hưởng khổng lồ, có bản cần hàng trăm người biểu diễn.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: k2
  cau: "Nghe trước (Mahler): Giao hưởng số 1 Titan; Giao hưởng số 5, chương 4 Adagietto; Giao hưởng số 2 Phục sinh."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: j1
  cau: Sibelius là nhà soạn nhạc Phần Lan, gắn chặt với bản sắc dân tộc Phần Lan (giai điệu Finlandia trở thành biểu tượng của khát vọng độc lập).
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: j2
  cau: Trong giao hưởng, Sibelius bỏ khuôn hình thức quen thuộc và xây nhạc bằng biến tấu và lặp lại một chủ đề cơ bản.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: j3
  cau: Sibelius gần như ngừng sáng tác trong 30 năm cuối đời.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: j4
  cau: "Nghe trước (Sibelius): Finlandia; Concerto violin cung Rê thứ; Giao hưởng số 5."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: de1
  cau: Debussy là người Pháp, đại diện tiêu biểu của chủ nghĩa ấn tượng trong âm nhạc, với hệ thống hòa âm rất độc đáo và màu sắc âm thanh mới lạ.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: de2
  cau: "Nghe trước (Debussy): Clair de lune; Prélude à l'après-midi d'un faune; La Mer."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: rc1
  cau: Rachmaninoff là nghệ sĩ piano và nhà soạn nhạc Nga, vẫn giữ phong cách Lãng mạn của cuối thế kỷ 19 sang tận thế kỷ 20.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: rc2
  cau: Rachmaninoff rời Nga sau Cách mạng 1917 và lấy nước Mỹ làm nơi sống chính.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: rc3
  cau: "Nghe trước (Rachmaninoff): Concerto piano số 2; Rhapsody on a Theme of Paganini; Vocalise."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: ra1
  cau: Ravel thường được xếp cạnh Debussy, nhưng hai người khác nhau nhiều.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ra2
  cau: Âm nhạc của Ravel nổi tiếng chau chuốt, hoàn hảo về hình thức, và ông được xem là một trong những bậc thầy phối khí của thế kỷ 20.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ra3
  cau: "Nghe trước (Ravel): Boléro; Pavane pour une infante défunte; Concerto piano cung Sol."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: ba1
  cau: Bartók là nhà soạn nhạc và nghệ sĩ piano Hungary, đồng thời là nhà dân tộc nhạc học.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ba2
  cau: Bartók đi khắp các làng quê Đông Âu ghi âm hàng nghìn bài dân ca bằng máy ghi âm ống sáp.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: ba3
  cau: Âm nhạc của Bartók kết hợp tiết tấu dân gian với ngôn ngữ hiện đại.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ba4
  cau: Bartók mất vì bệnh bạch cầu ở New York năm 1945, sau những năm cuối đời nhiều khó khăn.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: ba5
  cau: "Nghe trước (Bartók): Concerto cho dàn nhạc; Music for Strings, Percussion and Celesta; Mikrokosmos (153 bài piano từ dễ đến khó)."
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: st1
  cau: Stravinsky là người Nga, sống ở Pháp rồi Mỹ.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: st2
  cau: Buổi công diễn Le Sacre du printemps năm 1913 ở Paris gây náo loạn khán phòng và trở thành một trong những sự kiện nổi tiếng nhất lịch sử âm nhạc.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: st3
  cau: "Nghe trước (Stravinsky): L'Oiseau de feu (Chim lửa); Le Sacre du printemps; Pulcinella."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: pr1
  cau: Prokofiev là nhà soạn nhạc Nga, sống ở phương Tây rồi chuyển hẳn về Liên Xô năm 1936.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: pr2
  cau: Âm nhạc của Prokofiev vừa trữ tình vừa châm biếm, ngôn ngữ sắc sảo, dí dỏm.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: pr3
  cau: Prokofiev mất cùng ngày với Stalin.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: pr4
  cau: "Nghe trước (Prokofiev): Peter và chó sói; ballet Romeo và Juliet, Vũ điệu các hiệp sĩ; Giao hưởng số 1 Cổ điển."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: sh1
  cau: Shostakovich sáng tác dưới chế độ Xô viết, nhiều tác phẩm của ông chịu chuẩn mực nghệ thuật do nhà nước áp đặt; âm nhạc của ông có cả châm biếm lẫn nỗi đau cá nhân.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: sh2
  cau: "Nghe trước (Shostakovich): Giao hưởng số 5; Waltz số 2 (trích Suite for Variety Orchestra); Tứ tấu đàn dây số 8."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: me1
  cau: "Messiaen là nhà soạn nhạc Pháp, nghệ sĩ organ, người Công giáo sùng đạo và nhà nghiên cứu tiếng chim: ông ghi chép tiếng hót của hàng trăm loài chim và đưa vào âm nhạc."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: me2
  cau: Messiaen nghe âm thanh như màu sắc.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: me3
  cau: Học trò của Messiaen gồm Boulez và Stockhausen.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: me4
  cau: "Nghe trước (Messiaen): Quatuor pour la fin du temps (viết trong trại tù binh 1940–1941); Turangalîla-Symphonie; Catalogue d'oiseaux."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: br1
  cau: Britten là một trong những nhà soạn nhạc Anh lớn nhất thế kỷ 20, đặc biệt ở opera và nhạc thanh nhạc.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: br2
  cau: Âm nhạc của Britten thường nói về những người lạc loài trong cộng đồng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: br3
  cau: "Nghe trước (Britten): The Young Person's Guide to the Orchestra; opera Peter Grimes, Four Sea Interludes; War Requiem."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: dd1
  cau: Mục "Đương đại" gồm Pärt, Reich, Glass, Adams, những người còn sống hay sinh sau 1935.
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: pa1
  cau: "Pärt là nhà soạn nhạc Estonia, người khai sinh phong cách tintinnabuli (tiếng chuông): âm nhạc tối giản, tĩnh lặng, mang màu sắc tâm linh."
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: pa2
  cau: Sau những năm đầu viết theo lối hiện đại, Pärt gần như im lặng rồi trở lại năm 1976 với phong cách mới; ông rời Liên Xô năm 1980.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: pa3
  cau: "Nghe trước (Pärt): Spiegel im Spiegel; Für Alina; Tabula Rasa."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: re1
  cau: "Reich là một trong những người khai sinh chủ nghĩa tối giản ở Mỹ: các mẫu ngắn lặp lại, lệch pha dần, biến đổi rất chậm."
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: re2
  cau: Reich từng học nhạc trống ở Ghana và gamelan Bali.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: re3
  cau: "Nghe trước (Reich): Music for 18 Musicians; Clapping Music (chỉ có hai người vỗ tay); Different Trains."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: gl1
  cau: Glass là nhà soạn nhạc tối giản Mỹ, học với Nadia Boulanger ở Paris và làm việc với Ravi Shankar.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: gl2
  cau: Glass viết opera, giao hưởng, rất nhiều nhạc phim.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: gl3
  cau: "Nghe trước (Glass): Glassworks, Opening; opera Einstein on the Beach (1976); nhạc phim The Hours."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: ad1
  cau: "Adams là nhà soạn nhạc Mỹ gắn với chủ nghĩa tối giản, kết hợp kỹ thuật lặp lại với những yếu tố biểu cảm kiểu tân Lãng mạn: tiết tấu lặp lại dồn dập, quy mô giao hưởng."
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ad2
  cau: Adams nổi tiếng với các opera về những sự kiện lịch sử gần đây (Nixon in China, Doctor Atomic) và những tác phẩm dàn nhạc đầy năng lượng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ad3
  cau: "Nghe trước (Adams): Short Ride in a Fast Machine; Harmonielehre; opera Nixon in China."
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: cu1
  cau: "Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music; Grove Music Online; Encyclopaedia Britannica."
  loai: ten
- trang: lich-su/opera
  id: n1
  cau: Opera là kịch được hát toàn bộ (hoặc gần như toàn bộ), với dàn nhạc, dàn dựng sân khấu, trang phục và diễn xuất.
  loai: dinh-nghia
- trang: lich-su/opera
  id: n2
  cau: Opera ra đời ở Ý khoảng năm 1600.
  loai: nam
- trang: lich-su/opera
  id: n3
  cau: Nhiều nhà soạn nhạc như Verdi, Wagner, Puccini nổi tiếng chủ yếu nhờ opera.
  loai: lich-su
- trang: lich-su/opera
  id: n4
  cau: "Overture: khúc mở màn của dàn nhạc; giới thiệu không khí, đôi khi cả các giai điệu của vở."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n5
  cau: 'Recitative: hát "nói", nhịp tự do, đệm đơn giản; đẩy câu chuyện đi tiếp (đối thoại, sự kiện).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n6
  cau: "Aria: bài hát đơn, giai điệu đẹp; dừng thời gian để nhân vật bày tỏ cảm xúc."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n7
  cau: "Ensemble: song ca, tam ca, tứ ca… (nhiều nhân vật cùng hát)."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n8
  cau: "Hợp xướng: cả nhóm người hát; vai trò dân làng, binh lính, khách dự tiệc…"
  loai: dinh-nghia
- trang: lich-su/opera
  id: n9
  cau: "Libretto: kịch bản (lời), thường do nhà thơ viết, nhà soạn nhạc phổ nhạc."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n11
  cau: "Soprano: giọng nữ cao; ví dụ vai Mimì (La bohème)."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n12
  cau: "Mezzo-soprano: giọng nữ trung; ví dụ Carmen, cũng hát vai nam thiếu niên (như Octavian)."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n13
  cau: "Contralto: giọng nữ trầm (còn gọi là alto)."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n14
  cau: "Countertenor: giọng nam cao (âm vực tương đương contralto, mezzo-soprano hay soprano); vai trong opera Baroque."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n15
  cau: "Tenor: giọng nam cao (cao nhất trong giọng nam tự nhiên); ví dụ vai Rodolfo (La bohème)."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n16
  cau: "Baritone: giọng nam trung (giữa tenor và bass); ví dụ vai Marcello (La bohème)."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n17
  cau: "Bass: giọng nam trầm (thấp nhất); ví dụ vai Colline (La bohème)."
  loai: dinh-nghia
- trang: lich-su/opera
  id: n18
  cau: "Baroque (thế kỷ 17–18): Monteverdi L'Orfeo (1607), Handel Giulio Cesare (1724)."
  loai: nam
- trang: lich-su/opera
  id: n19
  cau: Ở Baroque, trọng tâm chuyển từ recitative sang aria; ca sĩ được kỳ vọng tự thêm trang trí khi aria quay lại đoạn đầu.
  loai: lich-su
- trang: lich-su/opera
  id: n20
  cau: "Cổ điển: Mozart, với opera tiếng Ý (Le nozze di Figaro, Don Giovanni) và tiếng Đức (Die Zauberflöte). Recitative của ông biểu cảm hơn, làm mờ ranh giới giữa recitative và aria."
  loai: lich-su
- trang: lich-su/opera
  id: n21
  cau: "Bel canto Ý (đầu thế kỷ 19): vẻ đẹp của giọng hát là trên hết. Rossini (Il barbiere di Siviglia, 1816), Bellini (Norma), Donizetti (Lucia di Lammermoor, 1835)."
  loai: nam
- trang: lich-su/opera
  id: n22
  cau: "Verdi (giữa thế kỷ 19): Rigoletto (1851), La traviata (1853), Aida (1871)."
  loai: nam
- trang: lich-su/opera
  id: n23
  cau: 'Wagner (Đức): "nhạc kịch" (music drama); các chủ đề âm nhạc đại diện (leitmotif) được ông nâng lên mức phức tạp nhất. Bộ Der Ring des Nibelungen gồm 4 vở, diễn trong bốn đêm.'
  loai: lich-su
- trang: lich-su/opera
  id: n24
  cau: "Opera Pháp: Bizet (Carmen), Gounod (Faust), Massenet."
  loai: ten
- trang: lich-su/opera
  id: n25
  cau: "Verismo (cuối thế kỷ 19, Ý): chủ nghĩa hiện thực, thường lấy đề tài đương thời và đời thường (như Cavalleria rusticana của Mascagni). Puccini (La bohème, Tosca, Madama Butterfly) được xếp vào những đại diện lớn của chủ nghĩa hiện thực trong opera."
  loai: lich-su
- trang: lich-su/opera
  id: n26
  cau: "Thế kỷ 20 đến nay: Britten (Peter Grimes), Berg (Wozzeck), John Adams (Nixon in China), Saariaho (L'Amour de loin)."
  loai: ten
- trang: lich-su/opera
  id: n27
  cau: "Die Zauberflöte (Cây sáo thần), Mozart: opera tiếng Đức, hai màn; aria Nữ hoàng bóng đêm"
  loai: lich-su
- trang: lich-su/opera
  id: n28
  cau: "Le nozze di Figaro, Mozart: hài kịch (commedia per musica) bốn màn, theo vở kịch của Beaumarchais"
  loai: lich-su
- trang: lich-su/opera
  id: n29
  cau: "Il barbiere di Siviglia, Rossini: opera buffa hai màn; aria Largo al factotum"
  loai: lich-su
- trang: lich-su/opera
  id: n30
  cau: "La traviata, Verdi: ba màn, theo vở kịch La Dame aux camélias của Dumas con"
  loai: lich-su
- trang: lich-su/opera
  id: n31
  cau: "Rigoletto, Verdi: ba màn, theo vở kịch của Victor Hugo; aria La donna è mobile"
  loai: lich-su
- trang: lich-su/opera
  id: n32
  cau: "Carmen, Bizet: có Habanera"
  loai: lich-su
- trang: lich-su/opera
  id: n33
  cau: "La bohème, Puccini: bốn màn, hát tiếng Ý"
  loai: lich-su
- trang: lich-su/opera
  id: n34
  cau: "Madama Butterfly, Puccini: có aria Un bel dì vedremo (màn 2)"
  loai: lich-su
- trang: lich-su/opera
  id: n35
  cau: "Tosca, Puccini: ba màn, theo vở kịch của Sardou; công diễn năm 1900"
  loai: lich-su
- trang: lich-su/opera
  id: n36
  cau: "Hansel und Gretel, Humperdinck: ba màn, theo truyện của anh em nhà Grimm"
  loai: lich-su
- trang: lich-su/opera
  id: n42
  cau: Chương trình kỷ niệm 3 năm của Nhà hát Hồ Gươm (2026) có ba ca sĩ opera quốc tế Diana Damrau, Javier Camarena, Marina Viotti.
  loai: lich-su
- trang: lich-su/opera
  id: n43
  cau: Trong nhà hát, khán giả thường vỗ tay sau mỗi aria nổi tiếng, khác với hòa nhạc giao hưởng nơi người ta đợi đến hết tác phẩm.
  loai: quy-tac
- trang: lich-su/opera
  id: n44
  cau: Opera do người Việt sáng tác có lịch sử hơn nửa thế kỷ.
  loai: nam
- trang: lich-su/opera
  id: n45
  cau: Opera được biểu diễn ở Việt Nam từ thời Pháp thuộc, chủ yếu cho khán giả người Pháp, ở các nhà hát lớn Sài Gòn và Hà Nội.
  loai: lich-su
- trang: lich-su/opera
  id: n46
  cau: Vở thường được coi là opera Việt Nam đầu tiên là Cô Sao của Đỗ Nhuận (1922–1991), do Nhà hát Nhạc Vũ Kịch Việt Nam biểu diễn năm 1965.
  loai: nam
- trang: lich-su/opera
  id: n47
  cau: Vở kể về A Sao, cô gái người Thái mồ côi, chịu bất công dưới sự cai trị thực dân rồi được cách mạng thuyết phục đứng lên chống Pháp; âm nhạc mang âm điệu Tây Bắc.
  loai: lich-su
- trang: lich-su/opera
  id: n48
  cau: Năm 2012, nhân kỷ niệm 90 năm ngày sinh của Đỗ Nhuận, con trai ông là nhạc sĩ Đỗ Hồng Quân tìm lại bản nháp viết tay của vở (gần 1.000 trang nhạc) và dựng lại.
  loai: nam
- trang: lich-su/opera
  id: n49
  cau: "Người tạc tượng, Đỗ Nhuận: công diễn 1971, sáng tác từ 1968."
  loai: nam
- trang: lich-su/opera
  id: n50
  cau: "Lá đỏ, Đỗ Hồng Quân: công diễn 2016."
  loai: nam
- trang: lich-su/opera
  id: n51
  cau: Công nữ Anio, Trần Mạnh Hùng, 2023 (dự án Việt – Nhật).
  loai: nam
- trang: lich-su/opera
  id: n52
  cau: Người tạc tượng lấy bối cảnh Tây Nguyên, công diễn ngày 2/9/1971 tại Nhà hát Lớn Hà Nội; Lá đỏ có kịch bản của nhà thơ Nguyễn Thị Hồng Ngát.
  loai: lich-su
- trang: lich-su/opera
  id: n53
  cau: Nhà hát Nhạc Vũ Kịch Việt Nam (VNOB, Hà Nội, thành lập ngày 6/8/1959) biểu diễn ballet, opera và nhạc giao hưởng.
  loai: nam
- trang: lich-su/opera
  id: n54
  cau: Nhà hát Giao hưởng Nhạc Vũ kịch TP.HCM (HBSO) dàn dựng những opera thế giới như Madama Butterfly.
  loai: lich-su
- trang: lich-su/opera
  id: n55
  cau: "Vài giọng ca opera Việt: tenor Ninh Đức Hoàng Long (giải nhất Simándy József 2016 và 2018), soprano Đào Tố Loan (giải nhất Cuộc thi Opera Đông Nam Á 2018), soprano Hà Phạm Thăng Long (vai A Sao)."
  loai: lich-su
- trang: lich-su/opera
  id: n56
  cau: "Nhạc kịch kiểu Broadway đang manh nha ở Việt Nam: Giấc mơ Chí Phèo (Nhà hát Ca múa nhạc Thăng Long, âm nhạc Dương Cầm), cháy vé, giải Tinh hoa Việt 2025."
  loai: lich-su
- trang: lich-su/opera
  id: n41
  cau: "Xem trực tiếp ở Việt Nam: theo dõi lịch diễn của Nhà hát Nhạc Vũ Kịch Việt Nam (Hà Nội), Nhà hát Giao hưởng Nhạc Vũ kịch TP.HCM và các nhà hát lớn."
  loai: khuyen-tap
- trang: lich-su/opera
  id: n37
  cau: "Khuyên: La bohème cảm động, hợp cho lần đầu xem opera; Hansel und Gretel hợp xem cùng gia đình."
  loai: khuyen-tap
- trang: lich-su/opera
  id: n57
  cau: 'Nghe/xem thử: tìm "Cô Sao opera" trên YouTube để xem trích đoạn; theo dõi lịch diễn của VNOB và HBSO nếu muốn xem opera trực tiếp.'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/baroque
  id: n1
  cau: Thời Baroque (khoảng 1600–1750)
  loai: nam
- trang: lich-su/thoi-ky/baroque
  id: n2
  cau: Thời của các vương triều chuyên chế (Louis XIV ở Pháp) và của cuộc xung đột giữa Cải cách và Phản Cải cách.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n3
  cau: "Nhạc sĩ thường là người làm công: cho nhà thờ (Bach ở Leipzig)."
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n4
  cau: Cho triều đình (Lully, nhà soạn nhạc triều đình Pháp).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n5
  cau: Cho công chúng opera ở London (Handel, người lập đoàn opera riêng).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n6
  cau: Cho Ospedale della Pietà, nhà nuôi trẻ bị bỏ rơi ở Venice (Vivaldi).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n7
  cau: Chủ nghĩa nhân văn đem lại mối quan tâm mới tới Hy Lạp và La Mã cổ.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n8
  cau: "Khoảng năm 1600, ở Florence, nhóm Camerata thử nghiệm kiểu hát lời kịch (recitative): một người hát giai điệu trên phần đệm đơn giản."
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n9
  cau: Từ đó opera ra đời (Monteverdi L'Orfeo, 1607) ...
  loai: nam
- trang: lich-su/thoi-ky/baroque
  id: n10
  cau: L'Orfeo viết khi Monteverdi làm việc cho công tước xứ Mantua.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n11
  cau: Cách viết "một giai điệu trên một bè trầm" trở thành nền tảng của cả thời kỳ.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n12
  cau: "Bè trầm liên tục (basso continuo): một bè trầm (như cello, viola da gamba) cùng một nhạc cụ hòa âm (harpsichord, organ, lute) chơi suốt tác phẩm."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n13
  cau: Bè trầm được ghi bằng bè trầm số, người chơi tự ứng tác hợp âm bên trên.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n14
  cau: Các giọng trưởng – thứ và những chuỗi hợp âm được dùng ngày càng nhiều (xem bài 12).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n15
  cau: Câu "Nhịp đều, mạnh mẽ, chuyển động liên tục như một cỗ máy".
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n16
  cau: "Tương phản: to – nhỏ đột ngột (terraced dynamics), độc tấu – cả dàn nhạc."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n17
  cau: Giai điệu nhiều trang trí; người biểu diễn được kỳ vọng tự thêm nốt hoa mỹ.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n18
  cau: Câu "Mỗi chương thường giữ một tâm trạng (affect) từ đầu đến cuối".
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n19
  cau: "Đoạn do site viết để minh họa: chuyển động móc đơn liên tục, chuỗi giai điệu đi xuống, bè trầm đi đều, láy rền ở kết."
  loai: cau-truc
- trang: lich-su/thoi-ky/baroque
  id: n20
  cau: Họ đàn violin là xương sống của dàn nhạc Baroque.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n21
  cau: Harpsichord thường đệm cho dàn nhạc, và organ cũng là nhạc cụ phím quan trọng.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n22
  cau: Piano mới ra đời ở Florence khoảng 1698–1700.
  loai: nam
- trang: lich-su/thoi-ky/baroque
  id: n23
  cau: Kèn trumpet và horn chưa có van, chỉ chơi được chuỗi bồi âm (xem Âm học).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n24
  cau: Dàn nhạc chủ yếu là đàn dây.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n25
  cau: Bach viết hơn 200 cantata, nhà thờ và thế tục.
  loai: so-lieu
- trang: lich-su/thoi-ky/baroque
  id: n26
  cau: Sonata cho một hay vài nhạc cụ.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n27
  cau: "Thể loại chính: opera, oratorio, cantata, concerto và concerto grosso, tổ khúc các điệu nhảy, sonata, prelude và fugue."
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n28
  cau: Monteverdi, L'Orfeo (1607), Toccata mở đầu và màn 2 (tác phẩm 1).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n29
  cau: Purcell, Dido and Aeneas, aria When I am laid in earth (Dido's Lament, màn 3) (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n30
  cau: Corelli, Concerto grosso Op. 6 số 8, "Giáng sinh" (tác phẩm 3).
  loai: danh-muc
- trang: lich-su/thoi-ky/baroque
  id: n31
  cau: Vivaldi, Mùa xuân (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n32
  cau: Bach, Prelude và fugue cung Đô trưởng, BWV 846, cặp mở đầu Bình quân luật quyển 1 (tác phẩm 5).
  loai: danh-muc
- trang: lich-su/thoi-ky/baroque
  id: n33
  cau: Bach, Tổ khúc cello số 1 (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n34
  cau: Bach, Brandenburg Concerto số 5 (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n35
  cau: Bach, Thương khó theo Thánh Matthew, hợp xướng mở đầu (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n36
  cau: Handel, Messiah, Hallelujah (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n37
  cau: Rameau, Les Indes galantes, Les Sauvages (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n38
  cau: 'Cách nghe: để ý bè trầm. Nó gần như không bao giờ dừng lại. Ở các bản thu "phong cách lịch sử", hãy nghe tiếng harpsichord lách tách phía sau.'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/co-dien
  id: n1
  cau: Thời Cổ điển khoảng 1750–1820 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/co-dien
  id: n2
  cau: "Mô tả (description): thời Khai sáng, âm nhạc chuộng sự cân đối, đối xứng và giản dị; hòa nhạc công cộng ở London, Paris, Vienna; người nghiệp dư mua nhạc in và chơi piano tại nhà."
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n3
  cau: Thời Khai sáng khuyến khích tư duy khoa học.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n4
  cau: Âm nhạc thời này chuộng sự cân đối, đối xứng và giản dị.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n5
  cau: Âm nhạc rời cung đình và nhà thờ để đến với hòa nhạc công cộng (ở London, Paris, Vienna) và gia đình trung lưu.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n6
  cau: Người nghiệp dư mua bản nhạc in và chơi piano tại nhà.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n7
  cau: Nhạc sĩ dần chuyển từ người làm công cho quý tộc sang nghệ sĩ tự do.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n8
  cau: Haydn phục vụ gia đình Esterházy gần 30 năm.
  loai: so-lieu
- trang: lich-su/thoi-ky/co-dien
  id: n9
  cau: Mozart rời Salzburg đến Vienna làm nghề tự do.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n10
  cau: Beethoven sống bằng tiền tài trợ, học trò và xuất bản.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n11
  cau: Vienna là trung tâm; Haydn, Mozart, Beethoven được gọi chung là "trường phái Vienna thứ nhất".
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n12
  cau: "Giai điệu rõ ràng, có đệm: một giai điệu chính, bè dưới đệm hợp âm, khác với phức điệu Baroque."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/co-dien
  id: n13
  cau: Kiểu đệm Alberti (hợp âm rải) là cách đệm điển hình; ví dụ bên dưới dùng nó.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/co-dien
  id: n14
  cau: Câu nhạc cân đối, thường dài 4 hay 8 ô nhịp.
  loai: cau-truc
- trang: lich-su/thoi-ky/co-dien
  id: n15
  cau: Hai câu ghép thành một đoạn nhạc hỏi – đáp.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/co-dien
  id: n17
  cau: "Tương phản trong cùng một chương: như hai chủ đề khác nhau về tính cách trong hình thức sonata."
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n18
  cau: "Sắc thái chuyển dần: crescendo, diminuendo thay cho to – nhỏ đột ngột."
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n19
  cau: Basso continuo dần biến mất.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n20
  cau: "Đoạn ví dụ do site viết: giai điệu đơn giản, đệm Alberti, hai câu 4 ô nhịp hỏi – đáp."
  loai: cau-truc
- trang: lich-su/thoi-ky/co-dien
  id: n22
  cau: Piano (fortepiano) thay thế harpsichord.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n23
  cau: "Dàn nhạc giao hưởng được chuẩn hóa: bộ dây, từng cặp sáo, oboe, bassoon, horn, trumpet, timpani."
  loai: danh-muc
- trang: lich-su/thoi-ky/co-dien
  id: n24
  cau: Clarinet gia nhập dàn nhạc từ cuối thế kỷ 18.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n25
  cau: Tứ tấu đàn dây là một thể loại thính phòng chính.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n26
  cau: "Thể loại chính: giao hưởng, concerto cho piano và các nhạc cụ khác, sonata piano, tứ tấu đàn dây, opera (Mozart)."
  loai: danh-muc
- trang: lich-su/thoi-ky/co-dien
  id: n27
  cau: Hình thức sonata là khung thường dùng cho chương đầu.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n29
  cau: C. P. E. Bach, Sinfonia cung Si thứ, Wq 182 số 5 (cầu nối Baroque – Cổ điển).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n30
  cau: Gluck, Orfeo ed Euridice, Dance of the Blessed Spirits.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n31
  cau: Haydn, Giao hưởng số 94, chương 2 (link [nghe-nhac/haydn-94](/opus/nghe-nhac/haydn-94/)).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n32
  cau: Haydn, Tứ tấu đàn dây Op. 76 số 3 "Hoàng đế", chương 2.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n33
  cau: Mozart, Eine kleine Nachtmusik, K. 525.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n34
  cau: Mozart, Giao hưởng số 40, chương 1 (link [nghe-nhac/mozart-40](/opus/nghe-nhac/mozart-40/)).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n35
  cau: Mozart, Concerto piano số 21, K. 467, chương 2.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n38
  cau: Beethoven, Sonata piano Pathétique, Op. 13.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n39
  cau: Danh sách "10 tác phẩm để nghe" gồm đủ 10 mục.
  loai: danh-muc
- trang: lich-su/thoi-ky/co-dien
  id: n44
  cau: "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Taruskin, The Oxford History of Western Music."
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n40
  cau: "Cách nghe: đếm ô nhịp theo nhóm 4; câu nhạc Cổ điển thường chia đôi khá đều, cảm giác hỏi – đáp ở cuối mỗi cặp câu."
  loai: khuyen-tap
- trang: lich-su/thoi-ky/lang-man
  id: n1
  cau: Thời Lãng mạn khoảng 1820–1900 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/lang-man
  id: n2
  cau: "Mô tả (description): từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên, chủ nghĩa dân tộc; piano mạnh hơn, dàn nhạc phình to, nghệ sĩ bậc thầy."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n3
  cau: Từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên và chủ nghĩa dân tộc.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n4
  cau: Âm nhạc được xem là nghệ thuật thích hợp nhất để biểu đạt cảm xúc; nhạc sĩ muốn bày tỏ thế giới nội tâm của mình.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n5
  cau: Công nghiệp hóa giúp chế tạo piano mạnh hơn và hàng loạt hơn, đưa đàn vào nhiều gia đình trung lưu.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n6
  cau: Nhạc sĩ viết nhiều cho hòa nhạc công cộng và liên hoan.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n7
  cau: Thời của những nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt, được hâm mộ như ngôi sao.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n8
  cau: Beethoven giai đoạn cuối (Giao hưởng số 9, các tứ tấu cuối) là cây cầu dẫn vào thời kỳ này.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n9
  cau: "Cảm xúc đặt lên hàng đầu: biểu cảm quan trọng hơn khuôn khổ hình thức."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n10
  cau: Giai điệu dài, hát, đầy cảm xúc (đặc trưng cũ).
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n11
  cau: "Hòa âm giàu màu sắc: dùng nhiều hợp âm nửa cung (chromatic) để biểu đạt cảm xúc."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n12
  cau: "Ví dụ về hòa âm nửa cung: Tristan und Isolde của Wagner."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n14
  cau: Rubato nghĩa là co giãn tốc độ để diễn cảm.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/lang-man
  id: n15
  cau: Diễn tấu tự do bằng rubato là một đặc trưng của lối chơi Lãng mạn.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n16
  cau: "Quy mô co giãn: từ tiểu phẩm một chương cho piano và ca khúc đến tác phẩm cỡ lớn (Giao hưởng số 8 của Mahler, opera của Wagner)."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n17
  cau: "Âm nhạc chương trình: kể chuyện hoặc vẽ cảnh theo một nội dung ngoài âm nhạc (Berlioz, Giao hưởng kỳ ảo; thơ giao hưởng của Liszt)."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/lang-man
  id: n18
  cau: "Bản sắc dân tộc: dân ca, điệu nhảy dân gian hay nét nhạc dân tộc của Ba Lan (Chopin), Séc (Dvořák, Smetana), Na Uy (Grieg), Nga (Nhóm Năm người)."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n19
  cau: Tchaikovsky thuộc nhóm nhạc sĩ mang bản sắc dân tộc Nga.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n20
  cau: "Đoạn ví dụ do site viết: tay trái rải rộng, hợp âm bảy giảm, hợp âm mượn, chậm dần trước kết."
  loai: cau-truc
- trang: lich-su/thoi-ky/lang-man
  id: n22
  cau: Piano có khung gang, âm thanh lớn và vang hơn.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n23
  cau: "Dàn nhạc phình to: kèn đồng có van chơi được đủ các nốt của gam nửa cung."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n24
  cau: Dàn nhạc thêm tuba, cor anglais, harp, nhiều nhạc cụ gõ.
  loai: danh-muc
- trang: lich-su/thoi-ky/lang-man
  id: n25
  cau: Berlioz mở rộng mạnh các bộ kèn gỗ, kèn đồng và nhạc cụ gõ.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n26
  cau: "Thể loại chính: ca khúc nghệ thuật (Lied), tiểu phẩm piano (nocturne, ballade, étude, mazurka, valse), giao hưởng và thơ giao hưởng, concerto, opera (Verdi, Wagner, Puccini), ballet (Tchaikovsky)."
  loai: danh-muc
- trang: lich-su/thoi-ky/lang-man
  id: n27
  cau: Schubert, Erlkönig.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n28
  cau: Schubert, Ngũ tấu Con cá hồi.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n29
  cau: Berlioz, Giao hưởng kỳ ảo, chương 4 "Hành khúc đến đoạn đầu đài".
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n30
  cau: Chopin, Nocturne Op. 9 số 2.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n31
  cau: Mendelssohn, Concerto violin cung Mi thứ.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n32
  cau: Verdi, La traviata, Brindisi.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n33
  cau: Wagner, Tristan und Isolde, Khúc dạo đầu.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n34
  cau: Brahms, Giao hưởng số 4, chương 4.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n35
  cau: Tchaikovsky, Hồ thiên nga.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n36
  cau: Dvořák, Giao hưởng số 9, chương 2.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n40
  cau: "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Taruskin, The Oxford History of Western Music."
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n38
  cau: "Cách nghe: để ý những khoảnh khắc nhạc chậm lại hoặc dồn lên mà không có chỉ dẫn trên bản nhạc, đó có thể là rubato; so sánh hai bản thu của cùng một nocturne Chopin."
  loai: khuyen-tap
- trang: lich-su/thoi-ky/phuc-hung
  id: n1
  cau: Thời Phục hưng (khoảng 1400–1600)
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n2
  cau: Âm nhạc vẫn gắn với nhà thờ, nhưng nhạc thế tục cũng phát triển (madrigal, chanson, nhạc khiêu vũ).
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n3
  cau: "Máy in nhạc ra đời: năm 1501, Ottaviano Petrucci, người làm việc ở Venice, in tuyển tập nhạc đa âm đầu tiên bằng chữ in rời."
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n4
  cau: Việc xuất bản nhạc in là một nét mới của thời kỳ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n5
  cau: Từ thế kỷ 16 (Luther, từ năm 1517), cuộc Cải cách Tin lành và Phản Cải cách của Công giáo ảnh hưởng mạnh đến âm nhạc nhà thờ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n6
  cau: Luther khuyến khích giáo dân cùng hát thánh ca bằng tiếng mẹ đẻ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n7
  cau: Công đồng Trent (1545–1563) đòi hỏi lời hát phải nghe rõ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n8
  cau: "Phức điệu mô phỏng: các bè lần lượt bắt chước nhau."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n9
  cau: "Hòa âm: quãng ba và hợp âm ba được dùng ngày càng nhiều."
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n10
  cau: "Nhà soạn nhạc vẽ chữ (word painting): giai điệu đi lên ở lời nói về sự thăng thiên, những nốt nhanh ở lời nói về chạy."
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n11
  cau: Câu "Vẫn chủ yếu dùng điệu thức, nhưng đã nghe ra cảm giác trưởng – thứ ngày càng rõ".
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n12
  cau: "Hai bè độc lập, chỉ dùng quãng thuận, bắt đầu và kết bằng quãng đúng: một ví dụ đối âm loại 1 theo kiểu của Fux để thấy các bè đi độc lập mà vẫn hòa hợp."
  loai: quy-tac
- trang: lich-su/thoi-ky/phuc-hung
  id: n13
  cau: "Thánh lễ (mass) và motet: nhạc nhà thờ đa âm."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n14
  cau: "Madrigal: ca khúc thế tục nhiều bè, gốc Ý, có cả madrigal Anh; lời thường tình ái, châm biếm hay ngụ ngôn."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n15
  cau: Chanson (Pháp).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n16
  cau: Nhạc khí cho đàn lute; các điệu nhảy như pavane, galliard.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n17
  cau: Guillaume Du Fay, Nuper rosarum flores, motet, công diễn lần đầu ngày 25/3/1436 tại nhà thờ chính tòa Santa Maria del Fiore, Florence (tác phẩm 1).
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n18
  cau: Josquin des Prez, Ave Maria… virgo serena (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n19
  cau: Josquin, Mille regretz (tác phẩm 3).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n20
  cau: Palestrina, Missa Papae Marcelli (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n21
  cau: Thomas Tallis, Spem in alium, 40 bè (tác phẩm 5).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n22
  cau: William Byrd, Ave verum corpus (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n23
  cau: Orlande de Lassus (Orlando di Lasso), Matona mia cara (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n24
  cau: Thomas Weelkes, As Vesta was from Latmos hill descending, madrigal Anh (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n25
  cau: John Dowland, Flow, my tears (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n26
  cau: Tomás Luis de Victoria, O magnum mysterium (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n27
  cau: 'Cách nghe: chọn một bè (thường là bè cao nhất) và cố bám theo, rồi thử chuyển sang bè khác. Ở Tallis Spem in alium, hãy nghe âm thanh "lan" qua các nhóm hát như sóng.'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/the-ky-20
  id: n1
  cau: Thế kỷ 20 khoảng 1900–2000 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/the-ky-20
  id: n2
  cau: "Mô tả (description): hai cuộc chiến tranh thế giới, những biến động chính trị lớn, công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc, và nhiều hướng sáng tác khác nhau."
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n3
  cau: Hai cuộc chiến tranh thế giới và những biến động chính trị lớn tác động tới âm nhạc thế kỷ 20.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n4
  cau: Công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n5
  cau: Lần đầu tiên một buổi biểu diễn có thể được ghi lại và nghe lại.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n6
  cau: 'Không còn một "ngữ pháp" chung: các nhà soạn nhạc đi nhiều hướng khác nhau.'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n7
  cau: Nhiều nhạc sĩ phải rời bỏ quê hương (Stravinsky, Rachmaninoff, Schoenberg, Bartók).
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n8
  cau: 'Ở Liên Xô, âm nhạc chịu sự kiểm soát chính trị: Shostakovich và Prokofiev đều bị lên án là "chủ nghĩa hình thức".'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n9
  cau: "Ấn tượng: hòa âm mơ hồ về giọng, hợp âm trượt song song, điệu thức, gam toàn cung và gam ngũ cung."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n10
  cau: Ấn tượng gắn với "màu sắc âm thanh".
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n11
  cau: "Ấn tượng: Debussy, Ravel."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n12
  cau: "Nguyên thủy, tiết tấu: tiết tấu dồn dập, trọng âm bất thường, nghịch tai mạnh."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n13
  cau: "Nguyên thủy, tiết tấu: Stravinsky, Le Sacre du printemps."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n14
  cau: "Vô điệu tính, 12 âm: không dựa vào giọng chủ; 12 nốt có vai trò gần như ngang nhau."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n15
  cau: 'Vô điệu tính, 12 âm: Schoenberg, Berg, Webern ("trường phái Vienna thứ hai").'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n16
  cau: "Tân cổ điển: trở lại trật tự, sự cân đối và rõ ràng của nhạc thế kỷ 18, với hòa âm tonal được cập nhật."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n17
  cau: "Tân cổ điển: Stravinsky, Pulcinella; Prokofiev, Giao hưởng số 1."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n18
  cau: "Dân tộc: dựa vào nhạc dân gian của dân tộc mình; có người thu thập và ghi âm dân ca thật."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n19
  cau: "Dân tộc: Bartók, Kodály, Janáček, Villa-Lobos."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n20
  cau: "Nhạc Mỹ: ảnh hưởng jazz, nhạc dân gian Mỹ, nhạc kịch; Gershwin, Copland, Bernstein."
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n21
  cau: "Tiên phong sau 1945: nhạc chuỗi toàn phần, nhạc điện tử, nhạc ngẫu nhiên."
  loai: danh-muc
- trang: lich-su/thoi-ky/the-ky-20
  id: n22
  cau: "Tiên phong sau 1945: Messiaen, Boulez, Stockhausen, Cage, Ligeti."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n23
  cau: "Tối giản: mẫu ngắn lặp lại, biến đổi rất chậm."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n24
  cau: 'Tối giản: Reich, Glass, Riley; "tối giản thần thánh" của Pärt, Górecki.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n25
  cau: "Đoạn ví dụ Ấn tượng do site viết: hợp âm trượt song song trên một nốt trầm giữ suốt."
  loai: cau-truc
- trang: lich-su/thoi-ky/the-ky-20
  id: n27
  cau: "Đoạn ví dụ Tối giản do site viết: một mẫu ngắn lặp lại, thay đổi từng nốt một."
  loai: cau-truc
- trang: lich-su/thoi-ky/the-ky-20
  id: n28
  cau: Debussy, Clair de lune, rồi Prélude à l'après-midi d'un faune (link [piano/tac-pham/debussy-clair-de-lune](/opus/piano/tac-pham/debussy-clair-de-lune/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n29
  cau: Ravel, Boléro (link [nghe-nhac/ravel-bolero](/opus/nghe-nhac/ravel-bolero/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n30
  cau: Stravinsky, Le Sacre du printemps (link [nghe-nhac/stravinsky-sacre](/opus/nghe-nhac/stravinsky-sacre/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n31
  cau: Schoenberg, Verklärte Nacht (trước khi ông bỏ hẳn điệu tính), rồi Pierrot lunaire.
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n32
  cau: Bartók, Concerto cho dàn nhạc.
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n33
  cau: Gershwin, Rhapsody in Blue.
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n34
  cau: Prokofiev, Peter và chó sói (xem [Dàn nhạc giao hưởng](/opus/nhac-cu/dan-nhac/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n35
  cau: Shostakovich, Giao hưởng số 5 (link [nghe-nhac/shostakovich-5](/opus/nghe-nhac/shostakovich-5/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n36
  cau: Messiaen, Quatuor pour la fin du temps, chương 5 (viết trong trại tù binh năm 1940–1941).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n37
  cau: Reich, Music for 18 Musicians; Pärt, Spiegel im Spiegel (link [nghe-nhac/part-spiegel](/opus/nghe-nhac/part-spiegel/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n38
  cau: Danh sách "10 tác phẩm để nghe" gồm đủ 10 mục.
  loai: danh-muc
- trang: lich-su/thoi-ky/the-ky-20
  id: n43
  cau: "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Taruskin, The Oxford History of Western Music."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n39
  cau: 'Cách nghe: đừng chờ "giai điệu đẹp" kiểu thế kỷ 19; hỏi nhà soạn nhạc chú ý điều gì: màu sắc (Debussy), tiết tấu (Stravinsky), cấu trúc (Webern), thời gian và sự lặp lại (Reich).'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/trung-co
  id: n1
  cau: Thời Trung cổ (khoảng 500–1400)
  loai: nam
- trang: lich-su/thoi-ky/trung-co
  id: n2
  cau: Ở châu Âu thời Trung cổ, nhà thờ và các triều đình quý tộc để lại dấu ấn lớn trong âm nhạc.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n3
  cau: Một phần lớn âm nhạc còn lại đến ngày nay là nhạc phụng vụ, hát trong thờ phụng.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n4
  cau: Bên ngoài nhà thờ có âm nhạc thế tục của các nhà thơ – nhạc sĩ hát rong (troubadour ở vùng Provence miền Nam nước Pháp, trouvère ở miền Bắc, Minnesinger ở Đức).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n5
  cau: "Đây cũng là thời ký âm ra đời: từ những dấu hiệu gợi nhớ hướng đi của giai điệu (neume) ..."
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n6
  cau: đến khuông nhạc bốn dòng, thường được ghi công cho Guido d'Arezzo (thế kỷ 11).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n7
  cau: Ông cũng đặt ra các âm tiết ut – re – mi… để dạy hát, tiền thân của Đô Rê Mi.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n8
  cau: "Thánh ca Gregorian: một bè giai điệu (đơn âm), hát không đệm, tiếng Latin, nhịp tự do theo lời."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/trung-co
  id: n9
  cau: Dùng các điệu thức nhà thờ.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n10
  cau: "Từ khoảng thế kỷ 9 trở đi, người ta thêm bè thứ hai (organum), rồi ba, bốn bè: phức điệu ra đời."
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n11
  cau: Trường phái Notre-Dame ở Paris (Léonin, Pérotin), khoảng cuối thế kỷ 12 đến đầu thế kỷ 13, để lại những bộ organum hai bè (Léonin) và bốn bè (Pérotin).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n12
  cau: "Thế kỷ 14 (Ars nova): ký âm tiết tấu tinh vi hơn, nhạc thế tục phát triển; Machaut viết một trong những bản thánh lễ đa âm hoàn chỉnh đầu tiên của một tác giả."
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n13
  cau: "Một giai điệu viết theo kiểu thánh ca: một bè, không nhịp đều, điệu thức Dorian, giai điệu đi chủ yếu từng bước."
  loai: cau-truc
- trang: lich-su/thoi-ky/trung-co
  id: n14
  cau: Giọng hát là chính. Nhạc cụ thời đó có đàn lute, đàn vielle, kèn shawm và đàn organ.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n15
  cau: Đàn vielle là tên gọi thời Trung cổ của nhiều nhạc cụ, như fiddle và hurdy-gurdy.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/trung-co
  id: n16
  cau: Kèn shawm là tiền thân của oboe.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n17
  cau: Đàn organ gắn với nhà thờ từ thế kỷ 10.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n18
  cau: "Thánh ca Gregorian: Kyrie hoặc Alleluia từ một bản thu của dàn hợp xướng tu viện (tác phẩm 1)."
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n19
  cau: Hildegard von Bingen, O vis aeternitatis (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n20
  cau: Hildegard von Bingen, Ordo Virtutum, trích đoạn (tác phẩm 3).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n21
  cau: Pérotin, Viderunt omnes, organum bốn bè (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n22
  cau: Léonin, Magnus liber organi, các bản organum hai bè, để so sánh với Pérotin (tác phẩm 5).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n23
  cau: Sumer is icumen in, canon tiếng Anh, thế kỷ 13 (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n24
  cau: Bernart de Ventadorn, một ca khúc troubadour (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n25
  cau: Guillaume de Machaut, Messe de Nostre Dame (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n26
  cau: Machaut, Ma fin est mon commencement (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n27
  cau: Llibre Vermell de Montserrat, bản chép tay các bài ca sùng đạo, khoảng năm 1399 (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n28
  cau: 'Cách nghe: nhạc Trung cổ không có "giai điệu bắt tai" theo nghĩa hiện đại. Hãy nghe như nghe không gian: tiếng vang của nhà thờ đá, sự hòa quyện của các bè chạy song song.'
  loai: khuyen-tap
- trang: lich-su/index
  id: n1
  cau: '"Nhạc cổ điển" theo nghĩa rộng là truyền thống âm nhạc nghệ thuật phương Tây kéo dài hơn một nghìn năm.'
  loai: lich-su
- trang: lich-su/index
  id: n2
  cau: Theo nghĩa hẹp, thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven thời trẻ.
  loai: nam
- trang: lich-su/index
  id: n3
  cau: Các mốc năm dưới đây là quy ước gần đúng; phong cách thay đổi dần dần chứ không đổi trong một đêm.
  loai: lich-su
- trang: lich-su/index
  id: n6
  cau: Trung cổ | ~500–1400 | Thánh ca nhà thờ, từ một bè đến những bản nhiều bè đầu tiên
  loai: nam
- trang: lich-su/index
  id: n7
  cau: Phục hưng | ~1400–1600 | Nhiều bè đan xen hài hòa, chủ yếu cho giọng hát
  loai: nam
- trang: lich-su/index
  id: n8
  cau: Baroque | ~1600–1750 | Nhiều trang trí, tương phản, bè trầm liên tục, ra đời opera
  loai: nam
- trang: lich-su/index
  id: n9
  cau: Cổ điển | ~1750–1820 | Rõ ràng, cân đối, hình thức sonata, giao hưởng
  loai: nam
- trang: lich-su/index
  id: n10
  cau: Lãng mạn | ~1820–1900 | Cảm xúc cá nhân, dàn nhạc lớn, nghệ sĩ bậc thầy
  loai: nam
- trang: lich-su/index
  id: n11
  cau: "Thế kỷ 20 | ~1900–2000 | Phá vỡ quy tắc: ấn tượng, vô điệu tính, tối giản"
  loai: nam
- trang: lich-su/index
  id: n12
  cau: Đương đại | 2000–nay | Đa dạng phong cách, nhiều nhà soạn nhạc vẫn đang sáng tác
  loai: nam
- trang: lich-su/index
  id: n13
  cau: Một phần lớn âm nhạc còn lại từ thời này là nhạc nhà thờ.
  loai: lich-su
- trang: lich-su/index
  id: n14
  cau: Thánh ca Gregorian chỉ có một bè giai điệu, hát không đệm, nhịp tự do theo lời.
  loai: dinh-nghia
- trang: lich-su/index
  id: n15
  cau: Dần dần người ta thêm bè thứ hai, thứ ba, mở đầu cho phức điệu (polyphony).
  loai: lich-su
- trang: lich-su/index
  id: n16
  cau: Hệ thống ký hiệu khuông nhạc cũng hình thành trong giai đoạn này.
  loai: lich-su
- trang: lich-su/index
  id: n17
  cau: "Tên tuổi Trung cổ: Hildegard von Bingen, Léonin và Pérotin (trường phái Notre-Dame), Guillaume de Machaut."
  loai: ten
- trang: lich-su/index
  id: n18
  cau: "Nghe thử (Trung cổ): một bản thánh ca Gregorian bất kỳ; Hildegard O vis aeternitatis; Machaut Messe de Nostre Dame."
  loai: ten
- trang: lich-su/index
  id: n19
  cau: Các bè giọng hát đan xen và bắt chước nhau; quãng ba và hợp âm ba được dùng ngày càng nhiều.
  loai: lich-su
- trang: lich-su/index
  id: n20
  cau: Bên cạnh nhạc nhà thờ (thánh lễ, motet) còn có nhạc thế tục như madrigal. In ấn giúp bản nhạc lan rộng.
  loai: lich-su
- trang: lich-su/index
  id: n21
  cau: "Tên tuổi Phục hưng: Josquin des Prez, Giovanni Pierluigi da Palestrina, Thomas Tallis, William Byrd."
  loai: ten
- trang: lich-su/index
  id: n22
  cau: "Nghe thử (Phục hưng): Palestrina Missa Papae Marcelli; Tallis Spem in alium (40 bè); Josquin Ave Maria… virgo serena."
  loai: ten
- trang: lich-su/index
  id: n23
  cau: Đặc trưng là bè trầm liên tục (basso continuo), giai điệu nhiều trang trí, sự tương phản giữa nhóm nhỏ và cả dàn nhạc.
  loai: lich-su
- trang: lich-su/index
  id: n24
  cau: Opera ra đời (Monteverdi L'Orfeo, 1607).
  loai: nam
- trang: lich-su/index
  id: n25
  cau: Các thể loại concerto, fugue, tổ khúc (suite) phát triển mạnh.
  loai: lich-su
- trang: lich-su/index
  id: n26
  cau: Giai đoạn này thường được coi là kết thúc năm 1750, năm Bach mất.
  loai: nam
- trang: lich-su/index
  id: n27
  cau: "Tên tuổi Baroque: Monteverdi, Purcell, Vivaldi, Bach, Handel."
  loai: ten
- trang: lich-su/index
  id: n28
  cau: "Nghe thử (Baroque): Vivaldi Bốn Mùa; Bach Brandenburg Concerto số 3; Handel Messiah (Hallelujah); Bach Toccata và Fugue cung Rê thứ."
  loai: ten
- trang: lich-su/index
  id: n29
  cau: Âm nhạc cân đối, có giai điệu chính được đệm bên dưới.
  loai: lich-su
- trang: lich-su/index
  id: n30
  cau: Hình thức sonata trở thành khung xương của giao hưởng, concerto, sonata và tứ tấu đàn dây.
  loai: lich-su
- trang: lich-su/index
  id: n31
  cau: Đàn piano dần thay thế đàn harpsichord.
  loai: lich-su
- trang: lich-su/index
  id: n32
  cau: Trung tâm là Vienna.
  loai: lich-su
- trang: lich-su/index
  id: n33
  cau: "Tên tuổi Cổ điển: Joseph Haydn, Wolfgang Amadeus Mozart, Ludwig van Beethoven (giai đoạn đầu và giữa)."
  loai: ten
- trang: lich-su/index
  id: n34
  cau: "Nghe thử (Cổ điển): Haydn Giao hưởng số 94 Surprise; Mozart Eine kleine Nachtmusik, Giao hưởng số 40, opera Cây sáo thần; Beethoven Sonata piano Pathétique."
  loai: ten
- trang: lich-su/index
  id: n35
  cau: "Lãng mạn: âm nhạc là tiếng nói của cảm xúc cá nhân, thiên nhiên, truyện kể và bản sắc dân tộc; dàn nhạc lớn hơn, hòa âm nhiều màu sắc hơn."
  loai: lich-su
- trang: lich-su/index
  id: n36
  cau: Thời của các nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt.
  loai: lich-su
- trang: lich-su/index
  id: n37
  cau: Beethoven mất năm 1827, nên những năm cuối đời của ông rơi vào thời kỳ này theo mốc năm ở trên.
  loai: nam
- trang: lich-su/index
  id: n38
  cau: "Tên tuổi Lãng mạn: Schubert, Chopin, Robert và Clara Schumann, Liszt, Wagner, Verdi, Brahms, Tchaikovsky, Dvořák, Mahler."
  loai: ten
- trang: lich-su/index
  id: n39
  cau: "Nghe thử (Lãng mạn): Schubert Ständchen; Chopin Ballade số 1; Tchaikovsky Hồ thiên nga; Dvořák Giao hưởng số 9 Từ Thế giới mới; Brahms Giao hưởng số 4."
  loai: ten
- trang: lich-su/index
  id: n40
  cau: "Thế kỷ 20: không còn một phong cách chung."
  loai: lich-su
- trang: lich-su/index
  id: n41
  cau: Chủ nghĩa ấn tượng (Debussy) gợi tâm trạng và cảm xúc mà đề tài khơi lên hơn là miêu tả chi tiết.
  loai: lich-su
- trang: lich-su/index
  id: n42
  cau: Stravinsky gây chấn động với Le Sacre du printemps (1913).
  loai: nam
- trang: lich-su/index
  id: n43
  cau: Schoenberg phát triển nhạc 12 âm, bỏ hẳn cảm giác giọng chủ.
  loai: lich-su
- trang: lich-su/index
  id: n44
  cau: Bartók đưa dân ca Đông Âu vào nhạc nghệ thuật.
  loai: lich-su
- trang: lich-su/index
  id: n45
  cau: Cuối thế kỷ, chủ nghĩa tối giản (minimalism) dùng những mẫu ngắn lặp lại.
  loai: lich-su
- trang: lich-su/index
  id: n46
  cau: "Tên tuổi Thế kỷ 20: Debussy, Ravel, Stravinsky, Schoenberg, Bartók, Prokofiev, Shostakovich, Messiaen, Copland, Steve Reich, Philip Glass."
  loai: ten
- trang: lich-su/index
  id: n47
  cau: "Nghe thử (Thế kỷ 20): Debussy Prélude à l'après-midi d'un faune; Ravel Boléro; Stravinsky Le Sacre du printemps; Shostakovich Giao hưởng số 5; Reich Music for 18 Musicians."
  loai: ten
- trang: lich-su/index
  id: n49
  cau: "Craig Wright, Listening to Music: giáo trình nhập môn, xếp theo thứ tự thời gian, có hướng dẫn nghe."
  loai: lich-su
- trang: lich-su/index
  id: n50
  cau: "Burkholder, Grout, Palisca, A History of Western Music: giáo trình lịch sử âm nhạc phương Tây."
  loai: lich-su
- trang: lich-su/index
  id: n51
  cau: "Alex Ross, The Rest Is Noise: lịch sử âm nhạc thế kỷ 20."
  loai: lich-su
