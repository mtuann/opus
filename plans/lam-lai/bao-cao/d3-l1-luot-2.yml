# Lượt 2 của lô D3-L1 (loi-giao/luot-2-trang.md), hai agent độc lập với lượt 1, gộp theo thứ tự danh sách đã xuất:
# phần A: bài 1–4 (132 nhận định, d3-l1-nhan-dinh.yml); phần B: bài 5–8 (142) và 24 bản ghi thuật ngữ (33, d3-l1-thuat-ngu.yml).
# Kết quả: 301 dung, 0 sai, 6 khong-chac.
# Cách đọc nguồn (cả hai phần): máy chủ Open Music Theory (viva.pressbooks.pub) trả 403 cho yêu cầu không phải trình duyệt.
# Phần A mở bằng User-Agent trình duyệt phổ thông (không có thông tin cá nhân); phần B đọc bản lưu Wayback Machine của đúng
# chương (ảnh chụp 12/2024 đến 01/2025). Mục nguon ghi địa chỉ chính thức của chương.
# Phần B: các khẳng định số học và chính tả nốt (gam, hóa biểu 1–7 dấu, giọng song song, vị trí dấu hóa trên khóa Sol, vòng
# quãng năm, số quãng tám ASPN) kiểm lại bằng một chương trình nhỏ. Nguồn khác của phần B: The Concise Oxford Dictionary of
# Music (qua encyclopedia.com); từ điển Cambridge, Oxford Learner's; giáo trình mở mt21c; IMSLP; teoria.com; hướng dẫn ký âm
# của Đại học Indiana.
- trang: nhac-ly/01-cao-do-ten-not
  id: n1
  luot_2: dung
