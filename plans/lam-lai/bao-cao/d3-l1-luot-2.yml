  ghi_chu: "OMT: nốt vừa có cao độ vừa có trường độ; cao độ là âm cao hay thấp (một âm có tần số riêng)."
- trang: nhac-ly/01-cao-do-ten-not
  id: n2
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/"]
  ghi_chu: "OMT (Notation of Notes): âm cao hơn do sóng âm có tần số cao hơn; thuật ngữ frequency = số lần sóng lặp lại, tức cao độ."
- trang: nhac-ly/01-cao-do-ten-not
  id: n3
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://wikinvsp.hnue.edu.vn/index.php?title=%C4%90%C3%A0n_T%C6%A1_r%C6%B0ng"]
  ghi_chu: "Cùng nguyên lý: tần số cao hơn thì âm cao hơn (OMT). Trang HNUE nói dây ngắn, căng hơn cho nốt cao hơn."
- trang: nhac-ly/01-cao-do-ten-not
  id: n4
  luot_2: dung
  nguon: ["https://www.classicfm.com/discover-music/music-theory/why-orchestras-tune-to-a/", "https://www.rockfordsymphony.com/faqs/why-does-the-orchestra-tune-to-the-oboe", "https://newt.phys.unsw.edu.au/jw/notes.html"]
  ghi_chu: "Classic FM và Rockford Symphony: dàn nhạc lên dây theo A=440 Hz (có dàn nhạc lên cao hơn, 442 trở lên). Câu viết 'thường' nên đúng."
- trang: nhac-ly/01-cao-do-ten-not
  id: n5
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT (Reading Clefs): cao độ được gọi bằng bảy chữ cái A–G rồi lặp lại theo vòng."
- trang: nhac-ly/01-cao-do-ten-not
  id: n6
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: bảy tên chữ cái lặp lại nhờ tương đương quãng tám. (Tính cả dấu hóa thì có 12 lớp cao độ; câu nói về tên nốt cơ bản.)"
- trang: nhac-ly/01-cao-do-ten-not
  id: n7
  luot_2: dung
  nguon: ["https://thecanadianencyclopedia.ca/en/article/solmization-emc", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/"]
  ghi_chu: "Hệ do cố định: do=C, re=D, mi=E... (Encyclopedia of Music in Canada, 'Solmization'; OMT Major Scales: fixed do thì do luôn là C)."
- trang: nhac-ly/01-cao-do-ten-not
  id: n8
  luot_2: dung
  nguon: ["https://thecanadianencyclopedia.ca/en/article/solmization-emc", "https://wikinvsp.hnue.edu.vn/index.php?title=%C4%90%C3%A0n_T%C6%A1_r%C6%B0ng"]
  ghi_chu: "EMC: solfège do cố định dùng chủ yếu ở trường học Pháp, Bỉ, Ý. Việt Nam: trang Đại học Sư phạm Hà Nội ghi 'C4 (Đô), D4 (Rê)...'. Không tìm được nguồn bậc 2 riêng cho Việt Nam ngoài trang này."
- trang: nhac-ly/01-cao-do-ten-not
  id: n9
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "OMT (tài liệu tiếng Anh) dùng tên chữ cái A–G cho cao độ; do-re-mi trong OMT chỉ dùng cho bậc (movable do)."
- trang: nhac-ly/01-cao-do-ten-not
  id: n13
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/"]
  ghi_chu: "OMT Major Scales: gam Đô trưởng bắt đầu và kết thúc ở C; C major không có dấu thăng hay giáng trong hóa biểu."
- trang: nhac-ly/01-cao-do-ten-not
  id: n14
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: tương đương quãng tám, các cao độ cách nhau một quãng tám mang cùng tên chữ. (OMT chú: nguyên lý này tùy bối cảnh văn hóa, đúng với nhạc phương Tây ngày nay.)"
- trang: nhac-ly/01-cao-do-ten-not
  id: n15
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: quãng tám = 12 nửa cung giữa hai nốt cùng tên chữ."
- trang: nhac-ly/01-cao-do-ten-not
  id: n16
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://newt.phys.unsw.edu.au/jw/notes.html"]
  ghi_chu: "OMT: tần số hai nốt cách quãng tám theo tỉ lệ 2:1. UNSW: 'An octave is a ratio of 2:1'."
- trang: nhac-ly/01-cao-do-ten-not
  id: n17
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "OMT ASPN: ký hiệu = tên nốt + số quãng tám để phân biệt các nốt cùng tên."
- trang: nhac-ly/01-cao-do-ten-not
  id: n18
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/aspn/", "https://www.gnu.org/software/emacs/manual/html_node/calc/Musical-Notes.html"]
  ghi_chu: "OMT: ASPN ghép tên chữ cái với số quãng tám (C4). 'Ký hiệu khoa học' = scientific pitch notation: GNU Calc manual mô tả đúng hệ này (chữ A–G kèm số quãng tám)."
- trang: nhac-ly/01-cao-do-ten-not
  id: n19
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/aspn/", "https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: Middle C = C4, nằm gần giữa bàn phím piano."
- trang: nhac-ly/01-cao-do-ten-not
  id: n20
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "OMT ASPN: mỗi số quãng tám bắt đầu ở nốt C, nên C4 D4 E4 F4 G4 A4 B4 rồi C5."
- trang: nhac-ly/01-cao-do-ten-not
  id: n21
  luot_2: dung
  nguon: ["https://newt.phys.unsw.edu.au/jw/notes.html", "https://www.gnu.org/software/emacs/manual/html_node/calc/Musical-Notes.html"]
  ghi_chu: "A4 = 440 Hz theo quy ước chuẩn (UNSW: 'By convention, A4 is often set at 440 Hz'; GNU Calc: 440 Hz = MIDI 69 = A4). Một số dàn nhạc và nhạc cổ dùng chuẩn khác; câu nói theo chuẩn."
- trang: nhac-ly/01-cao-do-ten-not
  id: n22
  luot_2: dung
  nguon: ["https://www.classicfm.com/discover-music/instruments/piano/why-88-keys/", "https://www.kawaius.com/faq/how-many-keys-are-on-a-piano", "https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "Classic FM: piano tiêu chuẩn 88 phím (52 trắng, 36 đen); Kawai: đa số piano hiện đại 88 phím; OMT: bàn phím phủ quãng tám 1–7 cộng một phần quãng tám 0 và 8 (khớp 88 phím)."
- trang: nhac-ly/01-cao-do-ten-not
  id: n23
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/", "https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/"]
  ghi_chu: "OMT: phím đen xếp nhóm ba và nhóm hai xen kẽ, lặp ở mỗi quãng tám."
- trang: nhac-ly/01-cao-do-ten-not
  id: n24
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: nhóm 2 phím đen thì phím trắng ngay bên trái là C."
- trang: nhac-ly/01-cao-do-ten-not
  id: n25
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: nhóm 3 phím đen thì phím trắng ngay bên trái là F."
- trang: nhac-ly/01-cao-do-ten-not
  id: n26
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: phím trắng mang tên A–G lặp lại; kể từ C là C D E F G A B."
- trang: nhac-ly/01-cao-do-ten-not
  id: n27
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/"]
  ghi_chu: "OMT: phím đen là nửa cung trên (sharp) hoặc dưới (flat) một phím trắng."
- trang: nhac-ly/01-cao-do-ten-not
  id: n30
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/", "https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "OMT: C ngay bên trái nhóm 2 phím đen; middle C = C4, gần giữa bàn phím."
- trang: nhac-ly/01-cao-do-ten-not
  id: n31
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/", "https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "OMT: hai nốt cùng tên chữ cách nhau quãng tám; số quãng tám đổi ở mỗi nốt C."
- trang: nhac-ly/01-cao-do-ten-not
  id: n36
  luot_2: dung
  nguon: ["https://thecanadianencyclopedia.ca/en/article/solmization-emc"]
  ghi_chu: "Đối ứng do cố định: Sol=G, Mi=E, Si=B (EMC: 'do' là C, re là D, mi là E...; syllable thứ bảy là si hoặc ti)."
- trang: nhac-ly/01-cao-do-ten-not
  id: n37
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "OMT ASPN: số quãng tám đổi ở nốt C; nốt liền trên B4 là C5."
- trang: nhac-ly/01-cao-do-ten-not
  id: n40
  luot_2: dung
  nguon: ["https://thecanadianencyclopedia.ca/en/article/solmization-emc", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Sol=G đúng; F và A sai; chuỗi La=A, Si=B, Đô=C, Rê=D, Mi=E, Fa=F, Sol=G đúng."
- trang: nhac-ly/01-cao-do-ten-not
  id: n41
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "Middle C = C4 (OMT ASPN); C3 và C5 là các Đô khác."
- trang: nhac-ly/01-cao-do-ten-not
  id: n42
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "Đô ngay bên trái nhóm 2 phím đen đúng; bên trái nhóm 3 là Fa (đúng); ngay bên phải nhóm 2 phím đen là Mi (nên là đáp án sai)."
- trang: nhac-ly/01-cao-do-ten-not
  id: n43
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://newt.phys.unsw.edu.au/jw/notes.html"]
  ghi_chu: "Quãng tám: cùng tên, tần số gấp đôi (OMT 2:1); La4=440, La5=880 Hz đúng."
- trang: nhac-ly/01-cao-do-ten-not
  id: n34
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý, phổ biến: đọc tên nốt hai hệ lên xuống."
- trang: nhac-ly/01-cao-do-ten-not
  id: n10
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên hợp lý: tài liệu quốc tế dùng chữ cái, tài liệu Việt dùng Đô–Rê–Mi."
- trang: nhac-ly/01-cao-do-ten-not
  id: n11
  luot_2: dung
  nguon: []
  ghi_chu: "Mẹo đúng: A B C D E F G ứng với La Si Đô Rê Mi Fa Sol."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n1
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "OMT: khuông có năm dòng kẻ ngang cách đều; Dolmetsch Online: năm dòng, bốn khe."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n2
  luot_2: dung
  nguon: ["https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Dolmetsch Online (lesson 1): quy ước phổ biến đánh số dòng từ dưới (1) lên trên (5), khe từ dưới (1) lên trên (4)."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n3
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "OMT: đầu nốt trên dòng nằm giữa dòng, đầu nốt trong khe chạm hai dòng; Dolmetsch: nốt nằm trên dòng (dòng xuyên qua đầu nốt) hoặc trong khe."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n4
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/"]
  ghi_chu: "OMT: nốt ở phía trên khuông là cao hơn nốt ở phía dưới."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n5
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: quãng hai ở dòng và khe liền kề; khóa Sol dòng 1 = E, khe 1 = F."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n6
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/"]
  ghi_chu: "OMT: muốn biết cao độ cụ thể thì khuông phải có khóa; khóa cho biết nốt nào gán cho dòng và khe."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n7
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "OMT: khóa Sol cuộn quanh dòng thứ hai từ dưới, đánh dấu G4; Dolmetsch: cuộn quanh dòng 2."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n8
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: khóa Sol cho giọng và nhạc cụ cao (flute, violin, trumpet, soprano); tay phải piano ở khóa Sol; SATB: soprano và alto ở khóa Sol."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n9
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT (Reading Clefs): nhạc cho guitar thường dùng khóa Sol quãng tám ('8' dưới khóa), tức nốt chơi thấp hơn một quãng tám so với nốt viết."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n10
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "E G B D F ('Every Good Bird Does Fly' trong OMT, 'Every Good Boy Does Fine' trong Dolmetsch)."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n11
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Khe khóa Sol: F A C E."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n12
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "OMT và Dolmetsch: bốn khe đọc lên thành 'face'."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n13
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "OMT: khóa Fa bao dòng F3 bằng hai chấm, dòng F là dòng thứ hai từ trên (dòng 4); Dolmetsch: hai chấm nằm hai bên dòng 4."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n14
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/", "https://viva.pressbooks.pub/openmusictheory/chapter/core-principles-of-orchestration/", "https://s9.imslp.org/files/imglnks/usimg/b/b8/IMSLP929853-PMLP1607-Beethoven_Symphony_No._9_Op._125.pdf"]
  ghi_chu: "OMT: khóa Fa cho giọng và nhạc cụ trầm (bassoon, cello, trombone, giọng bass), tay trái piano; OMT Orchestration: cello và double bass ghi cùng cao độ (double bass nghe thấp hơn quãng tám); tổng phổ Giao hưởng số 9 (OpenScore trên IMSLP) ghi bè Vc. và Cb. ở khóa Fa."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n15
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "G B D F A ('Good Bikes Don't Fall Apart' trong OMT, 'Good Boys Do Fine Always' trong Dolmetsch)."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n16
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Khe khóa Fa: A C E G ('All Cows Eat Grass')."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n19
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: nốt quá cao hoặc quá thấp so với khuông thì vẽ dòng kẻ phụ (ledger lines) kéo dài khuông."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n20
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: mỗi dòng và khe trên dòng kẻ phụ có tên nốt 'như thể khuông kéo dài tiếp'."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n21
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/", "https://viva.pressbooks.pub/openmusictheory/chapter/aspn/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "OMT: Middle C (C4) ở dòng kẻ phụ đầu tiên dưới khuông khóa Sol hoặc đầu tiên trên khuông khóa Fa; Dolmetsch cùng ý."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n22
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: khuông kép gồm khuông khóa Sol đặt trên khuông khóa Fa, nối bằng đường và dấu ngoặc; tay phải ở khóa Sol, tay trái ở khóa Fa."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n23
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: middle C ở giữa hai khuông (khi nén hai khuông lại)."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n24
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "OMT: như n22, n23; middle C ở dòng kẻ phụ giữa hai khuông."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n25
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT: F3 ở dòng thứ hai từ trên của khóa Fa (dòng 4); G4 ở dòng thứ hai từ dưới của khóa Sol (dòng 2)."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n32
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "Khóa Sol: dòng 1–5 là E4 G4 B4 D5 F5, nên dòng 3 = B4."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n33
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm", "https://viva.pressbooks.pub/openmusictheory/chapter/aspn/"]
  ghi_chu: "Khóa Fa: dòng G2 B2 D3 F3 A3, khe A2 C3 E3 G3; khe 1 = A2. Dolmetsch: dòng dưới cùng của khóa Fa là G2."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n35
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Khóa Sol ôm dòng 2 (G4): đáp án 'Dòng 2' đúng."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n36
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Khe khóa Sol F-A-C-E (face) đúng; Mi-Sol-Si-Rê là dòng khóa Sol, La-Đô-Mi-Sol là khe khóa Fa nên sai."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n37
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/", "https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "Hai chấm khóa Fa ở hai bên dòng 4 (F3) đúng."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n38
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/"]
  ghi_chu: "Đô giữa ở dòng kẻ phụ ngay dưới khuông khóa Sol (và ngay trên khuông khóa Fa)."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n39
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://www.dolmetsch.com/musictheory1.htm"]
  ghi_chu: "Dòng khóa Fa G-B-D-F-A đúng; 'Good Boys Do Fine Always' là mẹo phổ biến (Dolmetsch), chữ cái khớp."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n30
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý (luyện đọc khóa Fa như khóa Sol)."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n17
  luot_2: dung
  nguon: []
  ghi_chu: "Mẹo đúng: 'Every Good Boy Does Fine' = E G B D F; 'FACE' = F A C E."
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n26
  luot_2: dung
  nguon: []
  ghi_chu: "Học nốt mốc (landmark notes) là cách dạy đọc nhạc phổ biến; hai nốt mốc nêu đúng (F3 dòng 4 khóa Fa, G4 dòng 2 khóa Sol)."
- trang: nhac-ly/03-truong-do
  id: n1
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/"]
  ghi_chu: "OMT: nốt có cao độ (tần số) và trường độ; cao độ cho biết cao hay thấp."
- trang: nhac-ly/03-truong-do
  id: n2
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT Notating Rhythm: rhythm là độ dài của âm thanh và dấu lặng trong thời gian."
- trang: nhac-ly/03-truong-do
  id: n3
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: beat = nhịp đều lặp lại, có thể gõ hay vỗ theo. Giá trị nốt tính tương đối; số dưới của số chỉ nhịp cho biết nốt nào bằng một phách."
- trang: nhac-ly/03-truong-do
  id: n4
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: mỗi giá trị nốt chia được thành hai giá trị nhỏ hơn kế tiếp."
- trang: nhac-ly/03-truong-do
  id: n5
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://odp.library.tamu.edu/stepstomusictheory/chapter/simple-meters/"]
  ghi_chu: "TAMU (Steps to Music Theory): nốt đen là đơn vị phách phổ biến nhất; OMT: số dưới 4 = nốt đen. Số phách trong bảng đúng khi nốt đen bằng 1 phách."
- trang: nhac-ly/03-truong-do
  id: n6
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/", "https://musescore.org/vi/print/book/export/html/36126"]
  ghi_chu: "OMT: bảng tên Mỹ/Anh khớp (whole/semibreve, half/minim, quarter/crotchet, eighth/quaver, sixteenth/semiquaver). Tên Việt: bản dịch MuseScore tiếng Việt ghi Nốt tròn, Nốt trắng, Nốt đen, Móc đơn (nốt 16 ghi 'móc đôi', còn 'móc kép' là cách gọi phổ biến). Thuật ngữ Việt do lô D3-L5 khóa."
- trang: nhac-ly/03-truong-do
  id: n7
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: đầu nốt trắng rỗng, từ nốt đen trở xuống đầu đặc; nốt tròn không đuôi, nốt trắng có đuôi; thêm một móc giảm giá trị một nửa (móc đơn 1 móc, móc kép 2 móc)."
- trang: nhac-ly/03-truong-do
  id: n8
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: whole = 2 half = 4 quarter = 8 eighth...; khi nốt đen = 1 phách: 4, 2, 1, ½, ¼."
- trang: nhac-ly/03-truong-do
  id: n10
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: beam nối các nốt theo phách; 'beaming makes rhythms easier to read'."
- trang: nhac-ly/03-truong-do
  id: n12
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: rest là khoảng im lặng đo được ('A measured silence')."
- trang: nhac-ly/03-truong-do
  id: n13
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: mỗi giá trị nốt có dấu lặng tương ứng (whole, half, quarter, eighth, sixteenth rest); độ dài bằng nốt tương ứng (4, 2, 1, ½, ¼ phách khi nốt đen = 1)."
- trang: nhac-ly/03-truong-do
  id: n14
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: dấu chấm tăng độ dài của nốt thêm một nửa."
- trang: nhac-ly/03-truong-do
  id: n15
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "2 + 1 = 3 phách (OMT: dotted whole = ba half; cùng nguyên lý)."
- trang: nhac-ly/03-truong-do
  id: n16
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: dotted quarter = ba nốt móc đơn = 1½ phách."
- trang: nhac-ly/03-truong-do
  id: n17
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: tie là đường cong nối các nốt cùng cao độ; nốt được nối không đánh lại."
- trang: nhac-ly/03-truong-do
  id: n18
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: tie dùng để kéo dài nốt qua vạch nhịp ('ties can be used to extend a note over a measure line')."
- trang: nhac-ly/03-truong-do
  id: n19
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "OMT: slur nối các nốt khác cao độ, chơi liền (legato); tie nối cùng cao độ."
- trang: nhac-ly/03-truong-do
  id: n20
  luot_2: dung
  nguon: ["https://www.speech.kth.se/music/5_lectures/weinreic/motion.html"]
  ghi_chu: "KTH (Weinreich, chuyển động dây piano): âm piano suy giảm sau khi búa chạm dây (đoạn đầu giảm nhanh, 'prompt sound', rồi chậm, 'aftersound')."
- trang: nhac-ly/03-truong-do
  id: n27
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "Nốt trắng chấm dôi = 3 phách, cộng nốt đen = 4 phách = một ô 4/4."
- trang: nhac-ly/03-truong-do
  id: n30
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/", "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "Nốt trắng = 2 nốt đen = 2 phách trong 4/4; '1' và '4' sai."
- trang: nhac-ly/03-truong-do
  id: n31
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "Nốt đen chấm dôi = 1½ phách (khi nốt đen = 1 phách, như trong 4/4)."
- trang: nhac-ly/03-truong-do
  id: n32
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "Dấu nối: hai nốt cùng cao độ; nối nốt khác cao độ là dấu luyến (slur)."
- trang: nhac-ly/03-truong-do
  id: n33
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/"]
  ghi_chu: "Nốt móc kép = ¼ nốt đen; 4 nốt móc kép = 1 nốt đen."
- trang: nhac-ly/03-truong-do
  id: n28
  luot_2: dung
  nguon: []
  ghi_chu: "Bài tập hợp lý (viết các cách lấp đầy ô nhịp 4 phách)."
- trang: nhac-ly/03-truong-do
  id: n23
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "Khuyên hợp lý: OMT cũng nhấn mạnh việc đếm to khi thực hành nhịp."
- trang: nhac-ly/03-truong-do
  id: n22
  luot_2: dung
  nguon: []
  ghi_chu: "Quan sát sư phạm phổ biến, không gây hại, không trái trang lõi khác."
- trang: nhac-ly/04-nhip
  id: n1
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://www.musiccrashcourses.com/lessons/meter.html"]
  ghi_chu: "OMT: meter là mẫu lặp của các nhấn; phách 1 (downbeat) có 'trọng lượng' hơn các phách khác."
- trang: nhac-ly/04-nhip
  id: n2
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: vạch nhịp chia nhạc thành ô nhịp; mỗi ô tương ứng một nhóm phách."
- trang: nhac-ly/04-nhip
  id: n3
  luot_2: dung
  nguon: ["https://www.dolmetsch.com/musictheory3.htm"]
  ghi_chu: "Dolmetsch Online: vạch kép kết (một nét mảnh rồi một nét đậm) đánh dấu cuối bản nhạc hay cuối một chương; vạch kép hai nét mảnh chỉ đánh dấu đoạn. Trang nói 'vạch kép' là vạch kết."
- trang: nhac-ly/04-nhip
  id: n4
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/"]
  ghi_chu: "OMT: số chỉ nhịp là hai số xếp chồng đặt sau khóa. Nếu có hóa biểu thì thứ tự là khóa, hóa biểu, số chỉ nhịp (OMT Major Scales); câu đúng với bản không có hóa biểu."
- trang: nhac-ly/04-nhip
  id: n5
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: ở nhịp đơn, số trên là số phách mỗi ô. Nhịp kép khác (số trên đếm phần chia): trang đã nêu riêng ở n7."
- trang: nhac-ly/04-nhip
  id: n6
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: ở nhịp đơn, số dưới là hình nốt được một phách (2 = trắng, 4 = đen, 8 = móc đơn). Nhịp kép khác (n7)."
- trang: nhac-ly/04-nhip
  id: n7
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "OMT Compound: 6/8 có sáu nốt móc đơn mỗi ô, phách là nốt đen chấm dôi (ba nốt móc đơn), nên hai phách mỗi ô."
- trang: nhac-ly/04-nhip
  id: n8
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: 2/4 = nhịp đơn hai, hai phách mỗi ô, nốt đen một phách."
- trang: nhac-ly/04-nhip
  id: n9
  luot_2: dung
  nguon: ["https://odp.library.tamu.edu/stepstomusictheory/chapter/simple-meters/", "https://www.musiccrashcourses.com/lessons/meter.html", "https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/02%3A_Simple_Meters/2.03%3A_Duple_Meter"]
  ghi_chu: "Phách 1 mạnh, phách 2 nhẹ: TAMU, Music Crash Courses (STRONG, weak), LibreTexts Sierra College."
- trang: nhac-ly/04-nhip
  id: n10
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/social-sciences-and-law/political-science-and-government/military-affairs-nonnaval/march", "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/polka", "https://festival.si.edu/articles/1998/polka-wisconsin-s-state-dance", "https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/02%3A_Simple_Meters/2.03%3A_Duple_Meter"]
  ghi_chu: "Concise Oxford Dictionary of Music (qua Encyclopedia.com): hành khúc nhanh ở 2/4 hoặc 6/8; polka 'quick duple time'. Smithsonian: polka là điệu nhịp 2/4. LibreTexts: nhạc hành khúc thường ở nhịp hai."
- trang: nhac-ly/04-nhip
  id: n11
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: 3/4 = nhịp đơn ba, ba phách mỗi ô, nốt đen một phách."
- trang: nhac-ly/04-nhip
  id: n12
  luot_2: khong-chac
  nguon: ["https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/02%3A_Simple_Meters/2.04%3A_Triple_Meter", "https://www.musiccrashcourses.com/lessons/meter.html", "https://odp.library.tamu.edu/stepstomusictheory/chapter/simple-meters/", "https://www.dolmetsch.com/musictheory4.htm"]
  ghi_chu: "Các nguồn mâu thuẫn về phách 2. Mọi nguồn: phách 1 mạnh nhất. LibreTexts (Sierra College) và Music Crash Courses: mạnh–nhẹ–nhẹ (như valse). Dolmetsch Online (S M W) và TAMU Steps to Music Theory, chương nhịp đơn ('the second beat is less strong, the third beat is weak'): mạnh–vừa–nhẹ. OMT không nêu mẫu nhấn cho 3/4. 'Mạnh – nhẹ – nhẹ' là cách dạy phổ biến và hợp với các mẫu 2/4, 4/4 của trang; đề nghị giữ, hoặc viết nhẹ hơn: 'phách 1 mạnh nhất'."
- trang: nhac-ly/04-nhip
  id: n13
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/waltz", "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/minuet", "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "Concise Oxford Dictionary of Music (Encyclopedia.com): waltz = dance in 3/4 time; minuet = dance in triple time. OMT: Minuet in F, K.2 của Mozart ở nhịp ba đơn."
- trang: nhac-ly/04-nhip
  id: n14
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: 4/4 = nhịp đơn bốn, bốn phách mỗi ô, nốt đen một phách."
- trang: nhac-ly/04-nhip
  id: n15
  luot_2: dung
  nguon: ["https://www.dolmetsch.com/musictheory4.htm", "https://odp.library.tamu.edu/stepstomusictheory/chapter/simple-meters/", "https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/02%3A_Simple_Meters/2.05%3A_Quadruple_Meter"]
  ghi_chu: "Mạnh–nhẹ–vừa–nhẹ: Dolmetsch (Strong Weak Medium Weak), TAMU (phách 3 'less strong'), LibreTexts (phách 3 hơi mạnh hơn phách 2 và 4)."
- trang: nhac-ly/04-nhip
  id: n16
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/drumbeats/", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/A_Practical_Approach_to_Understanding_Music_Theory_(Brooks)/04:_Rhythm/4.01:_Notation", "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT Drumbeats: nhịp bốn đơn 'by far the most common' trong nhạc pop; Brooks (LibreTexts): 4/4 (common time) chiếm ưu thế trong sáng tác. Với nhạc cổ điển, các nguồn đọc được không nêu số liệu; câu viết ở mức phổ thông, đúng."
- trang: nhac-ly/04-nhip
  id: n17
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: common time (𝄴) tương đương 4/4; cut time (𝄵) tương đương 2/2."
- trang: nhac-ly/04-nhip
  id: n18
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "OMT: 6/8 có sáu móc đơn, 6÷3 = 2 phách."
- trang: nhac-ly/04-nhip
  id: n19
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/", "https://odp.library.tamu.edu/stepstomusictheory/chapter/compound-meters/"]
  ghi_chu: "OMT: mỗi phách chia ba, nốt đầu nhấn, hai nốt sau không nhấn; TAMU: hai phách thì phách 1 mạnh, phách 2 nhẹ hơn. Từ đó: đếm 1 mạnh, 4 vừa. (Bảng của Dolmetsch ghi 'bar 6 phách: S M W S M W' theo mô hình sáu phách đơn, không phải nhịp kép hai phách.)"
- trang: nhac-ly/04-nhip
  id: n20
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/literature-and-arts/performing-arts/music-history/barcarolle", "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/gigue"]
  ghi_chu: "Concise Oxford Dictionary of Music (Encyclopedia.com): barcarolle nhịp đều ở 'compound duple or compound quadruple time' (6/8 hoặc 12/8); gigue 'usually in compound duple or triple time'."
- trang: nhac-ly/04-nhip
  id: n21
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/works/symphony-no-9-in-d-minor-op-125-choral", "https://imslp.org/wiki/Symphony_No.9,_Op.125_(Beethoven,_Ludwig_van)"]
  ghi_chu: "IMSLP: Giao hưởng số 9 có 4 chương; chương 4 (Presto, Allegro assai...) là finale. Cleveland Orchestra: chủ đề 'Ode to Joy' xuất hiện ở finale."
- trang: nhac-ly/04-nhip
  id: n22
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/works/symphony-no-9-in-d-minor-op-125-choral", "https://imslp.org/wiki/Symphony_No.9,_Op.125_(Beethoven,_Ludwig_van)", "https://s9.imslp.org/files/imglnks/usimg/b/b8/IMSLP929853-PMLP1607-Beethoven_Symphony_No._9_Op._125.pdf"]
  ghi_chu: "Cleveland Orchestra: khi chủ đề vào, 'the tonality changes to a bright D major'; IMSLP: Allegro assai (D major); tổng phổ OpenScore (IMSLP) bè Vc. và Cb. ghi hai dấu thăng."
- trang: nhac-ly/04-nhip
  id: n23
  luot_2: dung
  nguon: ["https://s9.imslp.org/files/imglnks/usimg/b/b8/IMSLP929853-PMLP1607-Beethoven_Symphony_No._9_Op._125.pdf", "https://www.clevelandorchestra.com/works/symphony-no-9-in-d-minor-op-125-choral"]
  ghi_chu: "Phần kiểm được: bản gốc ở Rê trưởng, ghi nhịp C (4/4) ở đoạn 'Allegro assai'; tám ô đầu (4+4) là câu đầu của chủ đề. Không kiểm khối abc của trang (không được mở trang): review đối chiếu khối nhạc. Bản gốc cũng ở 4/4, nên 'cho dễ đọc' chỉ nói về chuyển giọng."
- trang: nhac-ly/04-nhip
  id: n25
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "OMT: 6/8 hai phách, mỗi phách chia ba."
- trang: nhac-ly/04-nhip
  id: n27
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "OMT: nhịp đơn (phách chia hai) và nhịp kép (phách chia ba)."
- trang: nhac-ly/04-nhip
  id: n28
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: nhịp đơn, phách chia hai rồi chia tiếp thành bốn; 2/4, 3/4, 4/4 là nhịp đơn."
- trang: nhac-ly/04-nhip
  id: n29
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "OMT: 6/8, 9/8, 12/8 là nhịp kép; phách là nốt đen chấm dôi = ba nốt móc đơn."
- trang: nhac-ly/04-nhip
  id: n30
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "OMT: 6/8 là nhịp kép hai (hai phách chia ba), không phải sáu phách đều."
- trang: nhac-ly/04-nhip
  id: n36
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Waltzes,_Op.64_(Chopin,_Fr%C3%A9d%C3%A9ric)", "https://archive.org/download/fortypianocompos00chop/fortypianocompos00chop.pdf", "https://enc.piano.or.jp/en/musics/23219"]
  ghi_chu: "IMSLP: Waltzes (Valses) Op.64, số 2 Tempo giusto (Cô thăng thứ); bản nhạc Oliver Ditson ghi 'Valse in C sharp minor, Op. 64, No. 2 (1847)'."
- trang: nhac-ly/04-nhip
  id: n37
  luot_2: dung
  nguon: ["https://archive.org/download/fortypianocompos00chop/fortypianocompos00chop.pdf", "https://enc.piano.or.jp/en/musics/23219", "https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/waltz"]
  ghi_chu: "Bản nhạc (Oliver Ditson, 'Forty piano compositions', tr. 109): Op. 64 No. 2 ghi dấu nhịp 3/4, Tempo giusto, bốn dấu thăng; waltz là điệu 3/4."
- trang: nhac-ly/04-nhip
  id: n39
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/works/symphony-no-9-in-d-minor-op-125-choral", "https://www.bhso.org.uk/work/beethoven-symphony-no-9-in-d-minor-2/"]
  ghi_chu: "Cleveland Orchestra: 'The Ode to Joy theme is first played by the cellos and double basses without any accompaniment'; BHSO: 'begins quietly, again in the cellos and basses'. Contrabass = double bass."
- trang: nhac-ly/04-nhip
  id: n42
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "3/4: số 3 = ba phách mỗi ô; số dưới 4 = nốt đen một phách; đáp án sai (nốt móc ba, ba câu) đúng là sai."
- trang: nhac-ly/04-nhip
  id: n43
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/literature-and-arts/performing-arts/dance/waltz", "https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/02%3A_Simple_Meters/2.04%3A_Triple_Meter"]
  ghi_chu: "Valse: 3/4, mạnh–nhẹ–nhẹ; 2/4 và 6/8 không phải nhịp valse thông thường."
- trang: nhac-ly/04-nhip
  id: n44
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"]
  ghi_chu: "6/8 cảm nhận hai phách lớn chia ba; đếm 1–6 nhấn 1 và 4 đúng (OMT: nốt đầu của mỗi phách được nhấn)."
- trang: nhac-ly/04-nhip
  id: n45
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"]
  ghi_chu: "OMT: common time (C) = 4/4; 2/2 là cut time (¢ có nét gạch), không phải C."
- trang: nhac-ly/04-nhip
  id: n40
  luot_2: dung
  nguon: ["https://www.clevelandorchestra.com/works/symphony-no-9-in-d-minor-op-125-choral", "https://www.bhso.org.uk/work/beethoven-symphony-no-9-in-d-minor-2/"]
  ghi_chu: "Khuyên nghe hợp lý. Câu chứa sự kiện cần nguồn (cello và contrabass chơi chủ đề đầy đủ lần đầu): đã kiểm, đúng (như n39); nên xếp loại lich-su thay vì khuyen-tap."
- trang: nhac-ly/04-nhip
  id: n24
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý: đếm 1-2-3, nhấn số 1."
- trang: nhac-ly/04-nhip
  id: n35
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý: vỗ tay theo nhịp 3/4."
- trang: nhac-ly/05-dau-hoa
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, Key Takeaways: nửa cung trên là phím liền kề bên phải, nửa cung dưới là phím liền kề bên trái; phím đen cũng tính là một phím (E–F và B–C là nửa cung dù không có phím đen xen giữa)."
- trang: nhac-ly/05-dau-hoa
  id: n2
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT: 'A whole step is the equivalent of two half steps.'"
- trang: nhac-ly/05-dau-hoa
  id: n3
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, mục Half Steps and Whole Steps: các cặp phím trắng A–B, C–D, D–E, F–G, G–A có phím đen xen giữa và cách nhau một cung; 'hầu hết' đúng (5 trong 7 cặp)."
- trang: nhac-ly/05-dau-hoa
  id: n4
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT: 'Two pairs of white keys—E/F and B/C—do not have black keys in between them ... E–F and B–C are both half steps.' Tên 'nửa cung tự nhiên' là cách gọi của site, OMT chỉ nói đó là nửa cung."
- trang: nhac-ly/05-dau-hoa
  id: n6
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT: 'A sharp raises a note by a half step.'"
- trang: nhac-ly/05-dau-hoa
  id: n7
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT: 'A flat lowers a note by a half step.'"
- trang: nhac-ly/05-dau-hoa
  id: n8
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT: 'A natural ... cancels a previous accidental such as a sharp or flat.'"
- trang: nhac-ly/05-dau-hoa
  id: n9
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, mục The Black Keys: phím đen ngay bên phải một phím trắng là ♯ của phím ấy (C♯), ngay bên trái là ♭ (D♭). Áp dụng: F♯ ở bên phải F, B♭ ở bên trái B."
- trang: nhac-ly/05-dau-hoa
  id: n10
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-sharp', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-flat']
  ghi_chu: "OMT: dấu thăng kép nâng hai nửa cung (một cung), dấu giáng kép hạ hai nửa cung. Concise Oxford Dictionary of Music, mục double-sharp, double-flat: nâng, hạ 'a whole-step or tone'."
- trang: nhac-ly/05-dau-hoa
  id: n11
  luot_2: khong-chac
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/', 'https://viva.pressbooks.pub/openmusictheory/chapter/intervals/']
  ghi_chu: "OMT chỉ định nghĩa tác dụng của dấu kép (±2 nửa cung), không nêu quy tắc 'dùng khi nào'; ví dụ của OMT dùng cả trên nốt tự nhiên (D× = E, C♭♭ = B♭) lẫn để nâng, hạ thêm một nốt đã có dấu hóa (G♯ → G×, E♭ → E♭♭ khi dựng quãng, chương Intervals). Câu hẹp hơn thực tế và đứng sau câu 'nâng một cung' dễ gây hiểu nhầm (Fa× chỉ cao hơn Fa♯ nửa cung). Gợi ý: 'Dấu thăng kép nâng nốt lên hai nửa cung (Rê× = Mi); thường gặp khi cần một nốt cao hơn nốt vốn đã thăng nửa cung (Fa♯ → Fa×).'"
- trang: nhac-ly/05-dau-hoa
  id: n14
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/', 'https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/']
  ghi_chu: "OMT (từ điển thuật ngữ, The Keyboard and the Grand Staff): quãng tám = 12 nửa cung; Pitch and Pitch Class: 12 lớp cao độ. Từ Đô đi từng nửa cung qua 12 phím khác nhau (7 trắng, 5 đen) thì tới Đô ở trên."
- trang: nhac-ly/05-dau-hoa
  id: n15
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/accidental']
  ghi_chu: "OMT: 'An accidental changes the pitch of a note ... written to the left of a note.' Concise Oxford Dictionary of Music, mục accidental: dấu chỉ sự lệch tạm thời khỏi hóa biểu. Tên 'dấu hóa bất thường' là cách gọi của site."
- trang: nhac-ly/05-dau-hoa
  id: n16
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/accidental', 'https://blogs.iu.edu/jsomcomposition/music-notation-style-guide/', 'https://lilypond.org/doc/v2.24/Documentation/notation/displaying-pitches']
  ghi_chu: "Concise Oxford Dictionary of Music, mục accidental: 'It holds good throughout the measure (bar) unless contradicted'. Chỉ trong đúng quãng tám của nốt: IU Composition Dept. style guide ('Use accidentals for new octaves of the same pitch class'), LilyPond NR ('only in their own octave'). Ngoại lệ không có trong câu: nốt luyến qua vạch nhịp giữ dấu hóa cho nốt luyến đó (Oxford)."
- trang: nhac-ly/05-dau-hoa
  id: n17
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/accidental']
  ghi_chu: "Hệ quả đúng của quy tắc ở n16: cùng cao độ, cùng ô nhịp thì dấu thăng còn hiệu lực; sang ô nhịp mới Fa trở lại tự nhiên."
- trang: nhac-ly/05-dau-hoa
  id: n18
  luot_2: dung
  nguon: ['https://blogs.iu.edu/jsomcomposition/music-notation-style-guide/', 'https://lilypond.org/doc/v2.24/Documentation/notation/displaying-pitches']
  ghi_chu: "IU Composition Dept., Music Notation Style Guide, mục Accidentals: 'Use a courtesy accidental for a natural pitch in a new bar, following the same pitch name in the previous bar with an accidental.' LilyPond NR (kiểu modern-cautionary): dấu hủy nhắc cũng được in ở ô nhịp sau. Tên 'dấu hóa nhắc' là cách gọi của site."
- trang: nhac-ly/05-dau-hoa
  id: n19
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, Example 5–6: mỗi phím đen có cả tên ♯ lẫn tên ♭; C♯ và D♭ là hai cách viết của cùng một phím."
- trang: nhac-ly/05-dau-hoa
  id: n20
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/', 'https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/', 'https://musictheory.pugetsound.edu/mt21c/EnharmonicNotes.html']
  ghi_chu: "OMT: 'Notes have enharmonic equivalence when they are spelled differently but sound the same.' Chương Pitch and Pitch Class: đồng âm khác tên là hai nốt bấm cùng một phím piano. mt21c mục 1.5: C♯ và D♭ 'are the same note on the piano'."
- trang: nhac-ly/05-dau-hoa
  id: n21
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Pitch and Pitch Class: nhạc có điệu thể (tonal) 'nearly always distinguishes between enharmonic pitches' (A♭ dẫn xuống G, G♯ dẫn lên A). Minor Scales: phải chọn đúng tên để khớp hóa biểu (B♭ thứ, không phải A♯ thứ, là giọng thứ song song của D♭ trưởng)."
- trang: nhac-ly/05-dau-hoa
  id: n23
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, Example 5–6: mỗi phím đen có tên ♯ và ♭; E–F và B–C là hai cặp phím trắng không có phím đen xen giữa và là nửa cung."
- trang: nhac-ly/05-dau-hoa
  id: n25
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, Example 1–2: E–F là nửa cung; F–G có phím đen (F♯/G♭) xen giữa nên cách nhau một cung."
- trang: nhac-ly/05-dau-hoa
  id: n26
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, Example 5: phím đen giữa G và A có cả hai tên G♯ và A♭."
- trang: nhac-ly/05-dau-hoa
  id: n27
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT: 'F is also known as E♯ ... B is also known as C♭' (E♯ = F, C♭ = B)."
- trang: nhac-ly/05-dau-hoa
  id: n30
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/intervals/']
  ghi_chu: "OMT, Intervals, bảng Enharmonic equivalence of intervals: 1 nửa cung = mi2 (2 thứ), 2 nửa cung = ma2 (2 trưởng); 'All of the seconds are major except for two: E–F and B–C.'"
- trang: nhac-ly/05-dau-hoa
  id: n31
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "Đáp án khớp OMT: E–F và B–C là nửa cung; C–D và G–A có phím đen xen giữa nên cách nhau một cung."
- trang: nhac-ly/05-dau-hoa
  id: n32
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "Đáp án khớp OMT: dấu giáng hạ nửa cung; dấu bình mới là dấu hủy."
- trang: nhac-ly/05-dau-hoa
  id: n33
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/accidental']
  ghi_chu: "Đáp án khớp n16 (Oxford: 'holds good throughout the measure'). Lưu ý nhỏ: phương án sai 'chỉ với một nốt ngay sau nó' là quy ước của một số bản nhạc thế kỷ 20 (Oxford) nhưng không phải ký âm thông thường mà bài dạy."
- trang: nhac-ly/05-dau-hoa
  id: n34
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT, Example 5: phím đen giữa D và E là D♯/E♭. D♭ là phím giữa C và D, E♯ = F nên hai phương án sai đều sai."
- trang: nhac-ly/05-dau-hoa
  id: n28
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "Hợp lý: E♯ = F, B♯ = C, F♭ = E, C♭ = B là phím trắng (OMT, Half Steps, Whole Steps, and Accidentals), nên 'thăng' không đồng nghĩa 'phím đen'."
- trang: nhac-ly/05-dau-hoa
  id: n5
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Hợp lý, hợp cách dạy phổ biến: E–F và B–C là điểm mốc của nửa cung, từ đó suy ra công thức gam (OMT, Major Scales)."
- trang: nhac-ly/06-gam-truong
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scale']
  ghi_chu: "OMT, Major Scales: 'A scale is an ordered collection of half and whole steps.' Concise Oxford Dictionary of Music, mục scale: 'A series of single notes progressing up or down stepwise.'"
- trang: nhac-ly/06-gam-truong
  id: n2
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scale', 'https://viva.pressbooks.pub/openmusictheory/chapter/triads/']
  ghi_chu: "Concise Oxford Dictionary of Music, mục scale: dãy nốt 'used as the basis of comp.'; gam trưởng, thứ 'have provided the chief material of music from about AD 1600 to 1900'. OMT, Triads: mọi nốt của gam trưởng có thể làm gốc một hợp âm. 'Nguyên liệu' là cách nói ẩn dụ, nội dung đúng."
- trang: nhac-ly/06-gam-truong
  id: n3
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Major Scales: bảy tên nốt; nốt cuối 'is a repetition of the first note'; gam 'always starts and ends on notes of the same letter name, one octave apart'."
- trang: nhac-ly/06-gam-truong
  id: n4
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Major Scales: W‑W‑H‑W‑W‑W‑H (đi lên)."
- trang: nhac-ly/06-gam-truong
  id: n5
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "OMT: E–F và B–C là nửa cung (Half Steps…); C D E F G A B C có nửa cung ở vị trí 3–4 và 7–8 nên không cần dấu hóa (hóa biểu C major trống, Major Scales)."
- trang: nhac-ly/06-gam-truong
  id: n6
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "Tính theo công thức OMT và E–F, B–C là nửa cung: C–D W, D–E W, E–F H, F–G W, G–A W, A–B W, B–C H."
- trang: nhac-ly/06-gam-truong
  id: n7
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Tính theo W‑W‑H‑W‑W‑W‑H (OMT) từ G: G A B C D E F♯ G (E–F♯ một cung, F♯–G nửa cung); khớp quy tắc 'dấu thăng cuối thấp hơn chủ âm nửa cung' (Major Scales)."
- trang: nhac-ly/06-gam-truong
  id: n8
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Major Scales, Example 10: hóa biểu một dấu thăng (F♯) là của G major."
- trang: nhac-ly/06-gam-truong
  id: n10
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/aspn/', 'https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, ASPN: mỗi quãng tám bắt đầu ở C (Đô giữa = C4), nên G3 A3 B3 | C4 D4 E4 F♯4 G4; G major = G A B C D E F♯ G."
- trang: nhac-ly/06-gam-truong
  id: n11
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales: hóa biểu 'collect the accidentals in a scale and place them at the beginning of a composition', 'after a clef but before a time signature'. Concise Oxford Dictionary of Music, mục key-signature: viết 'at the beginning of each staff', đỡ phải viết dấu hóa ở từng nốt."
- trang: nhac-ly/06-gam-truong
  id: n12
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Major Scales, Example 12: F major có một dấu giáng, B♭."
- trang: nhac-ly/06-gam-truong
  id: n14
  luot_2: khong-chac
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/roman-numerals/', 'https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.teoria.com/en/reference/m/minor.php']
  ghi_chu: "OMT gọi bậc là scale degrees, ký hiệu số Ả Rập có dấu mũ (1̂–7̂); số La Mã (I–VII) dành cho hợp âm theo bậc của nốt gốc (chương Roman Numerals). teoria.com vẫn gọi 'VI and VII degree' bằng số La Mã, nên câu không sai mà lệch quy ước của nguồn chính; trang 07 và 08 lại dùng 'bậc 3, bậc 6, bậc 7' bằng số Ả Rập. Theo luật 'tên gọi khác nhau thì theo OMT' nên chọn số Ả Rập (1–7) và dùng nhất quán, hoặc ghi rõ 'số La Mã là quy ước của sách tiếng Việt' nếu giữ."
- trang: nhac-ly/06-gam-truong
  id: n15
  luot_2: khong-chac
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/', 'https://www.musictheory.education/music-theory-level-2/ch-2-14-degrees-i-iv-and-v-tonic-subdominant-and-dominant']
  ghi_chu: "Không nguồn nào xếp I–V–VII là 'ba bậc quan trọng nhất'. OMT (Introduction to Harmony) chia chức năng tonic (I), predominant (IV, ii), dominant (V, vii°) mà không xếp hạng. musictheory.education (Level 2, mục 2.14; đọc qua công cụ tóm tắt trang, trang chặn curl): 'The primary degrees are the first, fourth and fifth degree', còn VII là bậc phụ. Cảm âm quan trọng về sức kéo nhưng 'quan trọng nhất' là xếp hạng chủ quan. Gợi ý: 'ba bậc cần nhớ trước' (như câu khuyên cuối trang), hoặc nêu thêm hạ át âm (IV)."
- trang: nhac-ly/06-gam-truong
  id: n17
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/tonic']
  ghi_chu: "OMT, Introduction to Harmony: tonic 'sound stable, providing a sense of home or center'. Concise Oxford Dictionary of Music, mục tonic: 'First degree of the major or minor scale ... key-note'."
- trang: nhac-ly/06-gam-truong
  id: n18
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/dominant']
  ghi_chu: "OMT, Introduction to Harmony: dominant 'provide a sense of urgency to resolve toward the tonic'. Concise Oxford Dictionary of Music, mục dominant: '5th degree of major or minor scale'."
- trang: nhac-ly/06-gam-truong
  id: n19
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/leading-note']
  ghi_chu: "OMT, Major Scales (từ điển thuật ngữ): leading tone = '7̂ that is one half step below 1̂', 'often thought of as leading toward the tonic'. Concise Oxford Dictionary of Music, mục leading note: 'semitone below the tonic ... tendency to rise, or lead, to the tonic'."
- trang: nhac-ly/06-gam-truong
  id: n21
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales: sự khép lại của gam trưởng nhờ 'the ascending semitone between ti and do'. Ví dụ Si → Đô (C major) đúng."
- trang: nhac-ly/06-gam-truong
  id: n26
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Tính theo W‑W‑H‑W‑W‑W‑H (OMT) từ D: D E F♯ G A B C♯ D; hóa biểu D major có F♯, C♯ (Major Scales, Example 13)."
- trang: nhac-ly/06-gam-truong
  id: n27
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Tính theo W‑W‑H‑W‑W‑W‑H (OMT) từ F: F G A B♭ C D E F; B♭ là dấu giáng duy nhất (Major Scales, Example 12)."
- trang: nhac-ly/06-gam-truong
  id: n28
  luot_2: dung
  nguon: ['https://musictheory.pugetsound.edu/mt21c/TheMajorScale.html']
  ghi_chu: "mt21c, mục 2.2 The Major Scale: 'All major scales use the notes of the musical alphabet in order; no notes are skipped and no notes occur twice' (ví dụ D–E–F♯–G, không phải D–E–G♭–G). Áp dụng: F major dùng B♭, không dùng A♯ (sẽ lặp tên La và thiếu Si)."
- trang: nhac-ly/06-gam-truong
  id: n30
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-diatonic-modes-and-the-chromatic-scale/']
  ghi_chu: "Đáp án khớp OMT, Major Scales (W‑W‑H‑W‑W‑W‑H). Phương án 2 là W‑H‑W‑W‑H‑W‑W = thứ tự nhiên (Minor Scales); phương án 3 (H‑W‑W‑W‑H‑W‑W) là mode Phrygian (Intro to Diatonic Modes). Lưu ý: 'công thức thứ hai' chỉ đúng theo thứ tự trong dữ liệu, mà quiz trộn thứ tự lựa chọn mỗi lần."
- trang: nhac-ly/06-gam-truong
  id: n31
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Đáp án khớp OMT: G major có F♯ (E → F♯ một cung)."
- trang: nhac-ly/06-gam-truong
  id: n32
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Đáp án khớp OMT, Major Scales: 5̂ là dominant (át âm); 1̂ là tonic, 7̂ là leading tone."
- trang: nhac-ly/06-gam-truong
  id: n33
  luot_2: dung
  nguon: ['https://musictheory.pugetsound.edu/mt21c/TheMajorScale.html', 'https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/']
  ghi_chu: "Đáp án khớp mt21c 2.2 (mỗi tên nốt chỉ một lần): A♯ trong F major sẽ lặp tên La và thiếu Si. A♯ vẫn tồn tại (cùng phím với B♭, OMT Half Steps…), nên phương án 'La♯ không tồn tại' đúng là sai."
- trang: nhac-ly/06-gam-truong
  id: n22
  luot_2: dung
  nguon: []
  ghi_chu: "Ngón bấm chuẩn của gam Đô trưởng một quãng tám (tay phải 1‑2‑3‑1‑2‑3‑4‑5, tay trái 5‑4‑3‑2‑1‑3‑2‑1), hợp cách dạy phổ biến."
- trang: nhac-ly/06-gam-truong
  id: n25
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý, hợp cách dạy phổ biến (hát gam để nối tai với tay)."
- trang: nhac-ly/06-gam-truong
  id: n16
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý như lời khuyên 'cần nhớ trước'; xem n15 về cách nói 'quan trọng nhất'."
- trang: nhac-ly/07-gam-thu
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-diatonic-modes-and-the-chromatic-scale/', 'https://viva.pressbooks.pub/openmusictheory/chapter/triads/']
  ghi_chu: "OMT, Intro to Diatonic Modes: 'darker modes sound more like a minor scale'; Triads: hợp âm thứ thường được gắn với 'sad'. Đây là liên tưởng thường gặp chứ không phải quy tắc, nên 'thường được dùng' đúng."
- trang: nhac-ly/07-gam-thu
  id: n2
  luot_2: dung
  nguon: ['https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)', 'https://musictheory.pugetsound.edu/mt21c/MinorKeySignatures.html']
  ghi_chu: "IMSLP, Symphony No.40, K.550: Key G minor. mt21c mục 3.2 (Figure 3.2.4) cũng ghi 'Symphony No. 40 in G Minor, K. 550, 1st movement'."
- trang: nhac-ly/07-gam-thu
  id: n3
  luot_2: dung
  nguon: ['https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)']
  ghi_chu: "IMSLP, Symphony No.5, Op.67 (Beethoven): Key C minor."
- trang: nhac-ly/07-gam-thu
  id: n4
  luot_2: dung
  nguon: ['https://imslp.org/wiki/Toccata_and_Fugue_in_D_minor,_BWV_565_(Bach,_Johann_Sebastian)']
  ghi_chu: "IMSLP, Toccata and Fugue in D minor, BWV 565: Key D minor, 2 sections (Toccata, Fuga). Chỉ kiểm giọng và số BWV, không xét vấn đề tác giả."
- trang: nhac-ly/07-gam-thu
  id: n5
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales: natural minor W‑H‑W‑W‑H‑W‑W."
- trang: nhac-ly/07-gam-thu
  id: n6
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "A B C D E F G A không dấu hóa (tính theo OMT, Minor Scales); Concise Oxford Dictionary of Music, mục key-signature: 'The keys of C major and A minor require no accidentals.' Đúng cho dạng thứ tự nhiên; dạng hòa âm, giai điệu có Sol♯, Fa♯."
- trang: nhac-ly/07-gam-thu
  id: n7
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "Tính theo công thức tự nhiên (OMT) từ A: A–B W, B–C H, C–D W, D–E W, E–F H, F–G W, G–A W."
- trang: nhac-ly/07-gam-thu
  id: n8
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/intervals/']
  ghi_chu: "OMT, Minor Scales: 'A minor scale's third note is always a half step lower than the third note of the major scale with the same name.' Intervals (bảng số nửa cung): 3 nửa cung = quãng 3 thứ, 4 = quãng 3 trưởng; La → Đô = 3, La → Đô♯ = 4."
- trang: nhac-ly/07-gam-thu
  id: n9
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales, Key Takeaways đầu tiên: bậc 3 của gam thứ luôn thấp hơn bậc 3 của gam trưởng cùng tên nửa cung."
- trang: nhac-ly/07-gam-thu
  id: n10
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales, Example 8 (Lowered scale degrees of minor): cả ba dạng đều có ↓3̂."
- trang: nhac-ly/07-gam-thu
  id: n12
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/aspn/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, ASPN: A3 B3 | C4 D4 E4 F4 G4 A4 (số quãng tám đổi ở C); đúng gam A natural minor."
- trang: nhac-ly/07-gam-thu
  id: n13
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales: relative relationship = 'a major key shares a key signature with a minor key'. 'Giọng thứ song song' là cách gọi của site cho relative minor."
- trang: nhac-ly/07-gam-thu
  id: n14
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Minor Scales: chủ âm thứ 'three half steps below the tonic of its relative major'. Concise Oxford Dictionary of Music, mục key-signature: 'Three notes down any major scale is the keynote of its relative minor' (bậc 6)."
- trang: nhac-ly/07-gam-thu
  id: n15
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT (Major Scales, Minor Scales): C và A không dấu hóa, G và E một ♯, F và D một ♭. Đã tính lại bằng chương trình."
- trang: nhac-ly/07-gam-thu
  id: n16
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales: parallel relationship = chung chủ âm (C major và C minor); C major không dấu hóa, C minor có 3 dấu giáng."
- trang: nhac-ly/07-gam-thu
  id: n17
  luot_2: dung
  nguon: ['https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)']
  ghi_chu: "IMSLP, Symphony No.5, Op.67: chương 1 Allegro con brio (C minor, 502 bars), chương 4 Allegro (C major, 446 bars)."
- trang: nhac-ly/07-gam-thu
  id: n18
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales: subtonic (↓7̂) cách chủ âm một cung; 'the ending lacks the same sense of closure' so với gam trưởng (nửa cung đi lên giữa ti và do)."
- trang: nhac-ly/07-gam-thu
  id: n19
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.teoria.com/en/reference/m/minor.php']
  ghi_chu: "OMT, Minor Scales: harmonic minor = 'Like natural minor, but with a raised 7̂'. teoria.com (minor scale): nâng bậc 7 vì 'harmonically motivated', tạo hợp âm át. La Si Đô Rê Mi Fa Sol♯ La."
- trang: nhac-ly/07-gam-thu
  id: n20
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature', 'https://musictheory.pugetsound.edu/mt21c/MinorKeySignatures.html', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "Concise Oxford Dictionary of Music, mục key-signature: 'The natural form of the minor scale determines key-signature'. mt21c mục 3.2: viết gam hòa âm, giai điệu theo hóa biểu thứ 'requires you to raise scale degrees'. OMT, Minor Scales: cảm âm 'requires an accidental in minor keys'."
- trang: nhac-ly/07-gam-thu
  id: n21
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.teoria.com/en/reference/m/minor.php']
  ghi_chu: "OMT, Minor Scales (từ điển thuật ngữ): leading tone 'diatonic in major keys, but requires an accidental in minor keys'. teoria.com: 'The seventh degree of a minor scale is often raised.'"
- trang: nhac-ly/07-gam-thu
  id: n22
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.teoria.com/en/reference/m/minor.php']
  ghi_chu: "OMT, Minor Scales: harmonic minor W‑H‑W‑W‑H‑3Hs‑H (3 nửa cung giữa bậc 6 và 7). teoria.com: 'There is an augmented second between the VI and VII degree'. Fa → Sol♯ = 3 nửa cung (đã tính)."
- trang: nhac-ly/07-gam-thu
  id: n23
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.teoria.com/en/reference/m/minor.php']
  ghi_chu: "OMT, Minor Scales: melodic minor đi lên nâng cả 6̂ và 7̂ (W‑H‑W‑W‑W‑W‑H). Phần lý do 'tránh bước nhảy': chương Minor Scales của OMT không nêu, teoria.com nêu: 'The main purpose of this accidental is to facilitate the melodic movement from the sixth degree to the seventh degree, avoiding the augmented second'."
- trang: nhac-ly/07-gam-thu
  id: n24
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://musictheory.pugetsound.edu/mt21c/MinorScales.html']
  ghi_chu: "OMT, Minor Scales: giai điệu đi xuống 'is the same as the natural form'; mt21c mục 3.1: 'a descending version that is the same as the natural minor scale'."
- trang: nhac-ly/07-gam-thu
  id: n25
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "A natural minor = A B C D E F G A (bậc 6 Fa, bậc 7 Sol) theo OMT; 'đúng theo hóa biểu' khớp Oxford: hóa biểu thứ theo dạng tự nhiên."
- trang: nhac-ly/07-gam-thu
  id: n26
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/triads/', 'https://www.teoria.com/en/reference/m/minor.php']
  ghi_chu: "OMT, Minor Scales: harmonic minor nâng 7̂. OMT, Triads, Example 7: hợp âm trên bậc 5 với cảm âm nâng là trưởng. teoria.com: nâng bậc 7 'forms the dominant chord or dominant seventh chord on the fifth degree'."
- trang: nhac-ly/07-gam-thu
  id: n27
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales: melodic minor đi lên W‑H‑W‑W‑W‑W‑H: La Si Đô Rê Mi Fa♯ Sol♯ La; dạng đi lên 'has the sense of closure associated with the major scale'."
- trang: nhac-ly/07-gam-thu
  id: n33
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "Tính theo công thức tự nhiên (OMT): E F♯ G A B C D E. E minor là relative minor của G major (1♯): OMT Minor Scales, Example 10; Oxford, key-signature."
- trang: nhac-ly/07-gam-thu
  id: n34
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "Tính theo OMT (harmonic minor = natural minor với 7̂ nâng): D E F G A B♭ C♯ D."
- trang: nhac-ly/07-gam-thu
  id: n36
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Minor Scales: A là chủ âm relative minor của C major (3 nửa cung dưới); Oxford: 'Three notes down any major scale'. Bậc 6 của C major là A."
- trang: nhac-ly/07-gam-thu
  id: n37
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales, Example 8: dạng hòa âm khác dạng tự nhiên chỉ ở 7̂ (nâng)."
- trang: nhac-ly/07-gam-thu
  id: n38
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales: melodic minor 'the descending pattern is the same as the natural form'."
- trang: nhac-ly/07-gam-thu
  id: n39
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Minor Scales (parallel relationship): C major và C minor chung chủ âm Đô, khác hóa biểu. C minor có 3 dấu giáng (B♭ E♭ A♭), là relative minor của E♭ major (đã tính lại; Oxford, key-signature)."
- trang: nhac-ly/07-gam-thu
  id: n32
  luot_2: dung
  nguon: ['https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)']
  ghi_chu: "Hợp lý: chương 1 (Molto allegro) của K.550 ở Sol thứ (IMSLP, mt21c); nghe so sánh màu sắc giọng thứ là cách dạy phổ biến."
- trang: nhac-ly/07-gam-thu
  id: n30
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý, hợp cách dạy phổ biến (so sánh gam thứ với gam trưởng song song của nó bằng tay và tai)."
- trang: nhac-ly/07-gam-thu
  id: n29
  luot_2: dung
  nguon: []
  ghi_chu: "Đúng với ngón bấm chuẩn: gam La thứ hòa âm tay phải 1‑2‑3‑1‑2‑3‑4‑5, tay trái 5‑4‑3‑2‑1‑3‑2‑1, giống Đô trưởng; Sol♯ ở bậc 7 (OMT, Minor Scales)."
- trang: nhac-ly/08-hoa-bieu
  id: n2
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Major Scales: G major cần F♯ (Example 10), F major cần B♭ (Example 12)."
- trang: nhac-ly/08-hoa-bieu
  id: n3
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature', 'https://musictheory.pugetsound.edu/mt21c/MajorKeySignatures.html']
  ghi_chu: "OMT, Major Scales (từ điển thuật ngữ): hóa biểu = 'a collection of sharps or flats written at the beginning of each line (immediately after the clef)'. Concise Oxford Dictionary of Music, mục key-signature: 'written at the beginning of each staff'. Chữ 'riêng' chỉ nên hiểu là 'bộ của giọng ấy': cặp trưởng–thứ song song dùng chung một bộ (xem n20–n34)."
- trang: nhac-ly/08-hoa-bieu
  id: n4
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature', 'https://musictheory.pugetsound.edu/mt21c/MajorKeySignatures.html']
  ghi_chu: "OMT, Major Scales, Example 8: 'every B, E, and A in a composition with this key signature will be flat, regardless of octave'. Oxford: hóa biểu miễn phải viết dấu hóa 'throughout the comp.'; mt21c 2.3: hóa biểu đặt ở đầu bản nhạc 'or the beginning of a section', nên 'suốt bản nhạc' đúng khi hóa biểu không đổi."
- trang: nhac-ly/08-hoa-bieu
  id: n5
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales: 'The order of sharps is always F, C, G, D, A, E, B.' Oxford: 'Sharps—F C G D A E B'."
- trang: nhac-ly/08-hoa-bieu
  id: n6
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales: dấu giáng B, E, A, D, G, C, F, ngược với thứ tự dấu thăng. Oxford: 'one order is the other reversed'."
- trang: nhac-ly/08-hoa-bieu
  id: n8
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Hệ quả của thứ tự cố định (OMT, Major Scales): 3 dấu thăng luôn là F♯ C♯ G♯ (A major)."
- trang: nhac-ly/08-hoa-bieu
  id: n9
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature', 'https://musictheory.pugetsound.edu/mt21c/MajorKeySignatures.html']
  ghi_chu: "OMT, Major Scales: 'In sharp key signatures, the last sharp is a half step below the tonic'. Oxford: 'In the sharp major keys the keynote is immediately above the last sharp'. Đã kiểm bằng chương trình cho cả 7 giọng thăng."
- trang: nhac-ly/08-hoa-bieu
  id: n10
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "A major: 3 dấu thăng F♯ C♯ G♯; Sol♯ + nửa cung = La (OMT, Major Scales, Example 10)."
- trang: nhac-ly/08-hoa-bieu
  id: n11
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature', 'https://musictheory.pugetsound.edu/mt21c/MajorKeySignatures.html']
  ghi_chu: "OMT, Major Scales: 'In flat key signatures, the second-to-last flat is the tonic'. Oxford: keynote 'is at the pitch of the last flat but one'. Đã kiểm bằng chương trình cho các giọng 2♭ đến 7♭; trường hợp 1♭ xem n13."
- trang: nhac-ly/08-hoa-bieu
  id: n12
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "E♭ major: B♭ E♭ A♭, dấu áp chót là E♭ (OMT, Major Scales, Example 14)."
- trang: nhac-ly/08-hoa-bieu
  id: n13
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Major Scales: 'F major, which has one flat: B♭' là trường hợp phải thuộc lòng (một dấu giáng thì không có dấu áp chót)."
- trang: nhac-ly/08-hoa-bieu
  id: n14
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Minor Scales: chủ âm relative minor 'three half steps below the tonic of its relative major'. Oxford: 'Three notes down any major scale is the keynote of its relative minor' (bậc 6)."
- trang: nhac-ly/08-hoa-bieu
  id: n15
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Minor Scales, mục Major or Minor?: 'pieces often start and end on the tonic'. Cảm âm nâng trong giọng thứ: OMT, Major Scales (từ điển thuật ngữ): leading tone 'requires an accidental in minor keys'. Phần '(bài 7)' là câu về site, không xét."
- trang: nhac-ly/08-hoa-bieu
  id: n16
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "OMT, Major Scales, Example 13–14: hóa biểu từ 1 đến 7 dấu thăng hoặc giáng, thêm lần lượt theo thứ tự cố định (C♯ major 7♯, C♭ major 7♭)."
- trang: nhac-ly/08-hoa-bieu
  id: n18
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/clefs/', 'https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Vị trí tính theo khóa Sol của OMT, Reading Clefs (dòng E G B D F, khe F A C E, mở rộng lên trên): F♯5 dòng 5, C♯5 khe 3, G♯5 khe trên khuông, D♯5 dòng 4, A♯4 khe 2, E♯5 khe 4, B♯4 dòng 3. OMT, Major Scales nêu thứ tự và hình zig-zag ('breaks after D♯'); hình ở Example 9 là ảnh nên đã đối chiếu từng vị trí bằng tính toán. Khớp."
- trang: nhac-ly/08-hoa-bieu
  id: n19
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/clefs/', 'https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Tương tự n18 cho B♭4 dòng 3, E♭5 khe 4, A♭4 khe 2, D♭5 dòng 4, G♭4 dòng 2, C♭5 khe 3, F♭4 khe 1. OMT: dấu giáng 'always make a perfect zig-zag pattern, alternating going up and down'. Khớp."
- trang: nhac-ly/08-hoa-bieu
  id: n20
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales (Example 12) và Minor Scales (Example 10–11): C major và A minor không dấu hóa. Oxford: 'The keys of C major and A minor require no accidentals.'"
- trang: nhac-ly/08-hoa-bieu
  id: n21
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 13) và Minor Scales (Example 10): 1♯ là G major và E minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n22
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 13) và Minor Scales (Example 10): 2♯ là D major và B minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n23
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 13) và Minor Scales (Example 10): 3♯ là A major và F♯ minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n24
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 13) và Minor Scales (Example 10): 4♯ là E major và C♯ minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n25
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 13) và Minor Scales (Example 10): 5♯ là B major và G♯ minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n26
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales (Example 13) và Minor Scales (Example 10): 6♯ là F♯ major và D♯ minor. Oxford: 'Keys with 6 sharps (F♯ major and D♯ minor)'. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n27
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales (Example 13) và Minor Scales (Example 10): 7♯ là C♯ major và A♯ minor. Oxford: 'keys with 7 sharps (C♯ major and A♯ minor)'. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n28
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 14) và Minor Scales (Example 11): 1♭ là F major và D minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n29
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 14) và Minor Scales (Example 11): 2♭ là B♭ major và G minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n30
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 14) và Minor Scales (Example 11): 3♭ là E♭ major và C minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n31
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 14) và Minor Scales (Example 11): 4♭ là A♭ major và F minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n32
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales (Example 14) và Minor Scales (Example 11): 5♭ là D♭ major và B♭ minor. Oxford: 'D♭ major and B♭ minor'. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n33
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales (Example 14) và Minor Scales (Example 11): 6♭ là G♭ major và E♭ minor. Oxford: 'G♭ major and E♭ minor'. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n34
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 14) và Minor Scales (Example 11): 7♭ là C♭ major và A♭ minor. Đã kiểm bằng chương trình."
- trang: nhac-ly/08-hoa-bieu
  id: n35
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales, mục The Circle of Fifths: 'The bottom three key signatures ... are enharmonically equivalent' (B và C♭, F♯ và G♭, C♯ và D♭). Oxford: F♯ và G♭, C♯ và D♭ tương đương trên bàn phím."
- trang: nhac-ly/08-hoa-bieu
  id: n36
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature', 'https://viva.pressbooks.pub/openmusictheory/chapter/intervals/']
  ghi_chu: "OMT, Major Scales: đi theo chiều kim đồng hồ 'each subsequent key signature adding one more sharp', mỗi khóa cách nhau một quãng 5. Oxford: 'keynotes of the sharp keys rise 5 notes (a perfect 5th)'. OMT, Intervals: P5 = 7 nửa cung."
- trang: nhac-ly/08-hoa-bieu
  id: n37
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature', 'https://musictheory.pugetsound.edu/mt21c/MajorKeySignatures.html', 'https://viva.pressbooks.pub/openmusictheory/chapter/intervals/']
  ghi_chu: "OMT, Major Scales: ngược chiều kim đồng hồ thêm một dấu giáng. Oxford: 'keynotes of the flat keys fall 5 notes (a perfect 5th)'; mt21c 2.3: 'As you descend in fifths (counterclockwise), key signatures get one degree flatter'. Đi xuống quãng 5 đúng = đi lên quãng 4 đúng (đảo quãng, OMT Intervals: 4 + 5 = 9)."
- trang: nhac-ly/08-hoa-bieu
  id: n38
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Minor Scales, mục Minor Keys and the Circle of Fifths: giọng thứ viết chữ thường 'around the inside of the circle'."
- trang: nhac-ly/08-hoa-bieu
  id: n39
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (Example 16) và Minor Scales (Example 12). Đã kiểm bằng chương trình: 12 vị trí cách nhau quãng 5 đúng (C, G, D, A, E, B, F♯/G♭, D♭, A♭, E♭, B♭, F), số dấu 0, 1♯…5♯, 6♯/6♭, 5♭…1♭, vòng trong a, e, b, f♯, c♯, g♯, d♯/e♭, b♭, f, c, g, d."
- trang: nhac-ly/08-hoa-bieu
  id: n40
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "OMT, Major Scales (mục The Circle of Fifths) và Minor Scales: theo chiều kim đồng hồ thêm dấu thăng, ngược chiều thêm dấu giáng."
- trang: nhac-ly/08-hoa-bieu
  id: n42
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/extended-tonicization-and-modulation-to-closely-related-keys/', 'https://musictheory.pugetsound.edu/mt21c/KeyRelationships.html']
  ghi_chu: "OMT, Extended Tonicization and Modulation: 'Key signatures within one accidental of one another (e.g., C major and G major) are considered closely related keys'. mt21c 22.3: 'key signatures one degree sharper or flatter than the starting key'."
- trang: nhac-ly/08-hoa-bieu
  id: n43
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/extended-tonicization-and-modulation-to-closely-related-keys/']
  ghi_chu: "OMT, Extended Tonicization and Modulation: 'some modulations are more common than others because of the number of chords the two keys share'; 'In major: I→V and I→vi'. 'Rất tự nhiên' là cách nói gọn của ý đó."
- trang: nhac-ly/08-hoa-bieu
  id: n44
  luot_2: khong-chac
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/', 'https://musictheory.pugetsound.edu/mt21c/KeyRelationships.html', 'https://musictheory.pugetsound.edu/mt21c/SonataIntroduction.html']
  ghi_chu: "Phần sự kiện đúng: OMT, Sonata Form: chủ đề 2 'typically V for major-mode pieces'; mt21c 22.3: thời Baroque, Cổ điển thường chuyển sang át âm. Phần 'đó là một lý do' (gần nhau trên vòng quãng năm) không nguồn nào nêu trực tiếp cho sonata; mt21c 25.1.3 dẫn Rosen: nguyên lý sonata là sự phân cực tonic–dominant ('The dominant is conceived as a dissonant tonality'). Gợi ý: bỏ quan hệ nhân quả, hoặc viết 'giọng át là giọng gần nhất của giọng chính (chỉ khác một dấu hóa), và là cực đối lập của giọng chính trong sonata'."
- trang: nhac-ly/08-hoa-bieu
  id: n45
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "Quy tắc trong câu khớp OMT: dấu thăng cuối + nửa cung = chủ âm (Major Scales); thứ song song thấp hơn chủ âm trưởng 3 nửa cung (Minor Scales). Chỉ kiểm nội dung quy tắc, không kiểm chữ hiển thị của công cụ."
- trang: nhac-ly/08-hoa-bieu
  id: n46
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "Quy tắc khớp OMT: dấu giáng áp chót là tên giọng trưởng, riêng 1 dấu giáng là F major (Major Scales); thứ song song thấp hơn 3 nửa cung (Minor Scales). Chỉ kiểm nội dung quy tắc, không kiểm chữ hiển thị của công cụ."
- trang: nhac-ly/08-hoa-bieu
  id: n48
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Có 12 giọng trưởng (đồng âm khác tên tính một) với 12 tập cao độ khác nhau, nên mỗi giọng có mẫu phím đen và phím trắng riêng (đã kiểm bằng chương trình; OMT, Major Scales: cùng công thức W‑W‑H‑W‑W‑W‑H bắt đầu từ mỗi nốt)."
- trang: nhac-ly/08-hoa-bieu
  id: n49
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không nguồn nào kiểm được 'cách nhanh nhất'. Trình tự (thế năm ngón ở 12 giọng, rồi tập gam quanh vòng quãng năm) là cách dạy hợp lý nhưng là lời khuyên, không phải quy tắc. Gợi ý: xếp khuyen-tap hoặc viết 'là một cách hiệu quả' (đã có câu n50 gần giống)."
- trang: nhac-ly/08-hoa-bieu
  id: n52
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Đáp án khớp OMT, Major Scales: thứ tự dấu thăng F, C, G, D, A, E, B."
- trang: nhac-ly/08-hoa-bieu
  id: n53
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Đáp án khớp OMT: 2♯ = D major (F♯, C♯; C♯ + nửa cung = D)."
- trang: nhac-ly/08-hoa-bieu
  id: n54
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Đáp án khớp OMT: 4♭ = B♭ E♭ A♭ D♭, dấu áp chót A♭ nên là A♭ major."
- trang: nhac-ly/08-hoa-bieu
  id: n55
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/']
  ghi_chu: "Đáp án khớp OMT, Minor Scales: relative minor của F major là D minor (3 nửa cung dưới, bậc 6)."
- trang: nhac-ly/08-hoa-bieu
  id: n56
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/']
  ghi_chu: "Đáp án khớp OMT, Major Scales (vòng quãng năm): chiều kim đồng hồ lên quãng 5 đúng và thêm một dấu thăng; C → G → D."
- trang: nhac-ly/08-hoa-bieu
  id: n50
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý, hợp cách dạy phổ biến (thế năm ngón trưởng ở 12 giọng, tập gam quanh vòng quãng năm)."
- trang: nhac-ly/08-hoa-bieu
  id: n7
  luot_2: dung
  nguon: ['https://musictheory.pugetsound.edu/mt21c/MajorKeySignatures.html']
  ghi_chu: "Mẹo phổ biến: mt21c mục 2.3 nêu 'Father Charles Goes Down And Ends Battle' và dạng đọc ngược 'Battle Ends And Down Goes Charles' Father'."
- trang: du-lieu/thuat-ngu/pitch
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/pitch-and-pitch-class/', 'https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/']
  ghi_chu: "OMT, Pitch and Pitch Class: 'Pitches are discrete tones with individual frequencies'; 'C4 is a pitch, and it is not the same pitch as C3'. Notation of Notes…: tần số cao hơn thì nốt đặt cao hơn trên khuông."
- trang: du-lieu/thuat-ngu/staff
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/']
  ghi_chu: "OMT, Notation of Notes, Clefs, and Ledger Lines: 'A staff consists of five horizontal lines, evenly spaced, and each note is placed on the line or space that corresponds to its pitch.'"
- trang: du-lieu/thuat-ngu/staff
  id: n2
  luot_2: dung
  nguon: ['https://dictionary.cambridge.org/dictionary/english/stave', 'https://www.oxfordlearnersdictionaries.com/definition/english/stave_1']
  ghi_chu: "Cambridge Dictionary: 'stave noun [C] UK (US staff)'. Oxford Learner's: 'stave (also staff)'. OMT chỉ nêu số nhiều 'staves'."
- trang: du-lieu/thuat-ngu/clef
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/', 'https://viva.pressbooks.pub/openmusictheory/chapter/clefs/']
  ghi_chu: "OMT: 'A clef indicates which pitches are assigned to the lines and spaces on a staff.'"
- trang: du-lieu/thuat-ngu/clef
  id: n2
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/clefs/']
  ghi_chu: "OMT, Reading Clefs: khóa Sol 'wraps around the G line (the second line from the bottom)'; khóa Fa 'the dot of the bass clef begins on the F line (the second line from the top)'. Tên khóa Sol, khóa Fa là cách gọi của site."
- trang: du-lieu/thuat-ngu/ledger-line
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/', 'https://viva.pressbooks.pub/openmusictheory/chapter/clefs/']
  ghi_chu: "OMT: 'small lines called ledger lines are drawn to extend the staff' khi nốt quá cao hoặc quá thấp."
- trang: du-lieu/thuat-ngu/time-signature
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/']
  ghi_chu: "OMT, Simple Meter and Time Signatures: 'the top number ... represents the number of beats in each measure, while the bottom number represents the beat unit' (ở nhịp đơn)."
- trang: du-lieu/thuat-ngu/measure
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/']
  ghi_chu: "OMT: 'A measure is equivalent to one group of beats (duple, triple, or quadruple). Measures are separated by bar lines.' Câu theo đúng phạm vi OMT (nhóm 2, 3, 4 phách)."
- trang: du-lieu/thuat-ngu/measure
  id: n2
  luot_2: dung
  nguon: ['https://www.oxfordlearnersdictionaries.com/definition/english/bar_1', 'https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/']
  ghi_chu: "Oxford Learner's, mục bar (âm nhạc): '(British English) (North American English also measure)'. OMT: 'measures (also called bars)'."
- trang: du-lieu/thuat-ngu/beat
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/']
  ghi_chu: "OMT: 'a beat—a pulse in music that regularly recurs'."
- trang: du-lieu/thuat-ngu/interval
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/intervals/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/interval']
  ghi_chu: "OMT, Intervals: 'Two pitches form an interval, which is usually defined as the distance between two notes.' Concise Oxford Dictionary of Music: 'The distance between 2 notes ... the difference in pitch'."
- trang: du-lieu/thuat-ngu/semitone
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/semitone']
  ghi_chu: "OMT, Half Steps…: half step 'generally considered to be the smallest interval in Western musical notation'. Concise Oxford Dictionary of Music, mục semitone: 'Smallest interval in European mus. On pf., interval between any note and the next, up or down.' OMT có rào 'thường được coi là', có thể thêm 'thường'."
- trang: du-lieu/thuat-ngu/semitone
  id: n2
  luot_2: dung
  nguon: ['https://dictionary.cambridge.org/dictionary/english/semitone', 'https://www.oxfordlearnersdictionaries.com/definition/english/semitone']
  ghi_chu: "Cambridge: semitone '(US usually half step)'. Oxford Learner's: '(British English) (North American English half step, halftone)'. OMT dùng 'half step'."
- trang: du-lieu/thuat-ngu/tone
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/', 'https://dictionary.cambridge.org/dictionary/english/tone']
  ghi_chu: "OMT: 'A whole step is the equivalent of two half steps.' Cambridge, mục tone: 'equal to two semitones'."
- trang: du-lieu/thuat-ngu/tone
  id: n2
  luot_2: dung
  nguon: ['https://dictionary.cambridge.org/dictionary/english/tone', 'https://www.oxfordlearnersdictionaries.com/definition/english/tone_1']
  ghi_chu: "Cambridge, mục tone: 'mainly UK (US usually whole step)'. Oxford Learner's: 'tone (British English) (US English whole step)'."
- trang: du-lieu/thuat-ngu/scale
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scale']
  ghi_chu: "OMT: gam là 'ordered collection of half and whole steps'; gam trưởng W‑W‑H‑W‑W‑W‑H (Major Scales). Concise Oxford Dictionary of Music, mục scale: 'A series of single notes progressing up or down stepwise.'"
- trang: du-lieu/thuat-ngu/key
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/tonic']
  ghi_chu: "OMT, Minor Scales, mục Major or Minor?: hóa biểu 'will help you to narrow down the key of the work to two options: a major key and its relative minor' (chú thích: với nhạc ngoài 1700–1900 còn phải xét các mode). Concise Oxford Dictionary of Music, mục tonic: 'The key-note from which the key takes its name'."
- trang: du-lieu/thuat-ngu/key-signature
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/key-signature']
  ghi_chu: "OMT, Major Scales: 'appears at the beginning of a composition, after a clef but before a time signature' (nhớ theo thứ tự chữ cái: clef, key, time)."
- trang: du-lieu/thuat-ngu/accidental
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/accidental']
  ghi_chu: "OMT: 'An accidental changes the pitch of a note' và viết bên trái nốt. Concise Oxford Dictionary of Music, mục accidental: 'momentary departure from the key signature' (dấu trong hóa biểu không gọi là accidental). Tên 'dấu hóa bất thường' là cách gọi của site."
- trang: du-lieu/thuat-ngu/tonic
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/tonic']
  ghi_chu: "OMT, Major Scales: tonic = 1̂, nốt đầu của gam. Concise Oxford Dictionary of Music: 'First degree of the major or minor scale'."
- trang: du-lieu/thuat-ngu/dominant
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/dominant']
  ghi_chu: "OMT, Major Scales: dominant = 5̂. Concise Oxford Dictionary of Music: '5th degree of major or minor scale'."
- trang: du-lieu/thuat-ngu/leading-tone
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/leading-note']
  ghi_chu: "OMT, Major Scales (từ điển thuật ngữ): 'A 7̂ that is one half step below 1̂.' Concise Oxford Dictionary of Music, mục leading note: '7th degree of the scale, semitone below the tonic'."
- trang: du-lieu/thuat-ngu/chord
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/triads/']
  ghi_chu: "OMT, Triads: 'A chord is any combination of three or more pitch classes that sound simultaneously.'"
- trang: du-lieu/thuat-ngu/legato
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/legato']
  ghi_chu: "OMT, Other Aspects of Notation: 'Legato means to play or sing smoothly or connected.' Concise Oxford Dictionary of Music: 'no perceptible pause between notes, i.e. in a smooth manner'."
- trang: du-lieu/thuat-ngu/legato
  id: n2
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/legato']
  ghi_chu: "OMT: legato 'is indicated by a curved slur marking'. Concise Oxford Dictionary of Music: 'Indicated by slur or curved line.'"
- trang: du-lieu/thuat-ngu/minuet
  id: n1
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/minuet', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/scherzo', 'https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/', 'https://viva.pressbooks.pub/openmusictheory/chapter/binary-form/', 'https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)']
  ghi_chu: "Concise Oxford Dictionary of Music: minuet là 'Dance in triple time'; thế kỷ 18 vào giao hưởng (và các thể loại khác) 'becoming the standard 3rd movt.'; mục scherzo: người kế nhiệm minuet và trio 'generally the 3rd (or 2nd) movt. of a sym. or str. qt.'. OMT: minuet và trio là thể ba đoạn ghép (Ternary Form); Menuetto là chương 3 của Giao hưởng số 25 của Mozart, Trio là chương 3 của tứ tấu K. 80 (Binary Form). IMSLP: Giao hưởng số 40 có Menuetto ở chương 3 trong 4 chương. 'Thường' đúng; vị trí thứ hai cũng gặp."
- trang: du-lieu/thuat-ngu/minuet
  id: n2
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/minuet', 'https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/']
  ghi_chu: "Concise Oxford Dictionary of Music: 'Dance in triple time'. OMT, Simple Meter: Mozart 'Minuet in F major', K.2 'is in a simple triple meter' (ba phách mỗi ô nhịp)."
- trang: du-lieu/thuat-ngu/sonata-form
  id: n1
  luot_2: dung
  nguon: ['https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/', 'https://musictheory.pugetsound.edu/mt21c/SonataIntroduction.html']
  ghi_chu: "OMT, Sonata Form: 'The first reprise is called the exposition, and the second reprise contains the development and recapitulation' (có thể thêm introduction, coda). mt21c 25.1: 'three large sections (exposition, development, recapitulation)'."
- trang: du-lieu/thuat-ngu/movement
  id: n1
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/movement', 'https://viva.pressbooks.pub/openmusictheory/chapter/formal-sections-in-general/']
  ghi_chu: "Concise Oxford Dictionary of Music: 'The primary, self-contained sections of a large comp. (sym., conc., sonata, suite, etc.)'. OMT, Formal Sections in General: 'the 1st movement of Mozart's ... string quartet'."
- trang: du-lieu/thuat-ngu/symphony
  id: n1
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphony']
  ghi_chu: "Concise Oxford Dictionary of Music: 'a large-scale orch. comp. (usually in 4 movts. but often in 1, 3, or 5, occasionally in 2)'. 'Nhiều chương' đúng với đa số, có ngoại lệ một chương."
- trang: du-lieu/thuat-ngu/symphony
  id: n2
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphony', 'https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)', 'https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)']
  ghi_chu: "Concise Oxford Dictionary of Music: giao hưởng 'usually in 4 movts.'; chương của giao hưởng Cổ điển 'usually an opening allegro, followed by a slow movt., then a minuet or scherzo, finally another allegro or rondo'. IMSLP: Mozart K.550 và Beethoven Op.67 đều 4 chương."
- trang: du-lieu/thuat-ngu/fingering
  id: n1
  luot_2: dung
  nguon: ['https://dictionary.cambridge.org/dictionary/english/fingering', 'https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/english-fingering']
  ghi_chu: "Cambridge: fingering là 'the numbers on a sheet of music that show which fingers should play which notes' (hoặc cách dùng ngón). Concise Oxford Dictionary of Music, mục English fingering: 'marking printed pf. mus. with the composer's or ed.'s suggested fingering'."
- trang: du-lieu/thuat-ngu/fingering
  id: n2
  luot_2: dung
  nguon: ['https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/english-fingering']
  ghi_chu: "Concise Oxford Dictionary of Music, mục English fingering: hệ đại lục 'using 1 for thumb and 2 to 5 for fingers which is in general use today' (hệ Anh cũ dùng dấu × cho ngón cái, đã lỗi thời). 'Cả hai tay' là thực hành chuẩn của piano."
