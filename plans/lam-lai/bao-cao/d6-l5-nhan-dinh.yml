  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n34
  cau: Chương 2 có dạng rondo A–B–A–C–A; đoạn xen thứ nhất ở giọng thứ; đoạn xen thứ hai ở La♭ thứ, phần đệm chuyển sang chùm ba, rồi trượt sang Mi trưởng.
