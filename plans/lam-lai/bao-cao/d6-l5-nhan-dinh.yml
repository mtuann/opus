  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n39
  cau: Các đoạn xen đi qua Mi♭ trưởng và La♭ trưởng; đoạn La♭ trưởng viết kiểu đối âm, các bè đuổi nhau.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n40
  cau: Gần cuối, giọng La♭ trưởng thoáng hiện, rồi bản nhạc đóng sập ở Đô thứ bằng một chuỗi nốt đổ xuống.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n41
