  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n48
  cau: "Theo dõi: Nhắc lại phần trình bày (nếu có), có nghệ sĩ quay về đầu Allegro, có người về tận phần Grave."
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n49
  cau: "Theo dõi: Phát triển, vài ô Grave trở lại, rồi Allegro lao đi qua nhiều giọng."
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n50
  cau: "Theo dõi: Tái hiện và coda, chủ đề trở lại ở Đô thứ; Grave thoáng qua lần cuối, rồi kết nhanh, dứt khoát."
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n51
  cau: Theo dõi các dòng chương 2 và 3 (Adagio; đoạn xen 1; đoạn xen 2 La♭ thứ chùm ba, trượt sang Mi trưởng; lần cuối trên chùm ba, coda; Rondo Đô thứ, đoạn xen Mi♭ và La♭ trưởng; coda La♭ trưởng thoáng hiện, kết Đô thứ bằng chuỗi nốt đổ xuống).
