- trang: nghe-nhac/beethoven-pathetique
  id: n45
  cau: "Theo dõi: Grave, hợp âm Đô thứ nặng, mạnh – nhỏ đột ngột; chuỗi nốt chạy xuống dẫn vào Allegro."
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n46
  cau: "Theo dõi: Allegro chủ đề 1, tay phải vút lên trên tremolo quãng tám của tay trái."
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n47
