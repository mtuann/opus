- trang: nghe-nhac/schubert-impromptu
  id: n12
  cau: Tên gọi nghe tùy hứng, nhưng đây là những bản nhạc được xây rất cẩn thận.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n13
  cau: Haslinger in hai bản đầu (Đô thứ và Mi♭ trưởng) ngay cuối năm 1827; bản số 3 và số 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai ông, Carl Haslinger, in ra.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n14
  cau: Khi ấy bản số 3 bị dịch giọng sang Sol trưởng, và mỗi ô nhịp 4/2 dài bị cắt đôi, để bài dễ chơi hơn.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n15
  cau: Suốt nhiều thập kỷ, bài thường chỉ được in ở Sol trưởng; các ấn bản Urtext ngày nay đã trả lại giọng gốc.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n17
  cau: "Gam Sol♭ trưởng: năm phím đen, cộng hai phím trắng là Đô♭ (chính là phím Si) và Fa (bàn phím và chú thích)."
  loai: dinh-nghia
- trang: nghe-nhac/schubert-impromptu
  id: n18
  cau: Schubert viết khoảng 600 ca khúc.
  loai: so-lieu
- trang: nghe-nhac/schubert-impromptu
  id: n19
  cau: "Bản Impromptu hát như một ca khúc: giai điệu dài, rộng, nhiều nốt ngân; bên dưới là dòng hợp âm rải chảy đều, gần như không dừng; tay trái giữ bè trầm sâu."
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n20
  cau: Giai điệu và dòng đệm nằm trong cùng tay phải; các ngón ngoài (chủ yếu 4 và 5) hát giai điệu, ngón cái và các ngón trong rải hợp âm.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n21
  cau: Nhịp 4/2 nghĩa là mỗi ô có bốn phách nốt trắng; Andante nên hiểu là "đi" chứ không phải "đứng".
  loai: dinh-nghia
- trang: nghe-nhac/schubert-impromptu
  id: n22
  cau: Schubert bất ngờ đổi màu hòa âm, đi sang một giọng xa rồi quay về.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n23
  cau: "Đoạn giữa bắt đầu ở Mi♭ thứ: tối và căng hơn, những nốt trầm nhấn mạnh, giọng thay đổi liên tục."
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n24
  cau: Gần cuối đoạn giữa có một tiếng láy rền ở âm vực rất trầm trước khi giai điệu Sol♭ trưởng trở lại.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n26
  cau: Trong tập D. 899, số 1 (Đô thứ) mở bằng nốt Sol quãng tám đánh mạnh, rồi một giai điệu một bè được các hợp âm đáp lại.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n27
  cau: Số 2 (Mi♭ trưởng) là dòng chùm ba chạy không nghỉ của tay phải.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n28
  cau: Số 4 (La♭ trưởng, mở đầu ở La♭ thứ) chạy những chuỗi hợp âm rải ở tay phải.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n29
  cau: Tập D. 935 đến tháng 4 năm 1839 mới được Diabelli in; bản số 3 của tập là một chủ đề và biến tấu ở Si♭ trưởng.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n30
  cau: "Theo dõi khi nghe: mở đầu dòng hợp âm rải chảy đều, bè trầm sâu, giai điệu cất lên chậm rãi, nốt ngân dài; giai điệu phát triển, vươn cao hơn, hòa âm đổi màu; phần đầu khép lại ở Sol♭ trưởng."
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n31
  cau: "Đoạn giữa: Mi♭ thứ, nốt trầm nhấn mạnh, dòng đệm vẫn không dừng; đi xa: chuyển giọng liên tục, cao trào của đoạn giữa."
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n32
  cau: "Láy rền ở âm vực trầm: nhạc dịu dần, chuẩn bị quay về; phần đầu trở lại; kết: giai điệu tan dần, những hợp âm cuối rất nhỏ."
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n34
  cau: "Ba bản thu trọn hai tập Impromptu D. 899 và D. 935: Radu Lupu (Decca), Alfred Brendel (Decca, phát hành năm 1989), Krystian Zimerman (Deutsche Grammophon, phát hành năm 1991)."
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n36
  cau: "Bản này ở mức sau Grade 8: ABRSM đưa bài vào danh sách tác phẩm của bằng ARSM."
  loai: cap-do
- trang: nghe-nhac/schubert-impromptu
  id: n39
  cau: Muốn một Impromptu Schubert dễ tiếp cận hơn, hãy thử D. 935 số 2 (La♭ trưởng).
  loai: cap-do
- trang: nghe-nhac/schubert-impromptu
  id: n42
  cau: "Mục Nguồn: IMSLP; ấn bản Urtext Henle, Wiener Urtext, Bärenreiter (Neue Schubert-Ausgabe)."
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n43
  cau: 'Mục Nguồn: Otto Erich Deutsch, Franz Schubert: Thematisches Verzeichnis seiner Werke (danh mục "D.").'
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n44
  cau: "Mục Nguồn: PTNA Piano Encyclopedia, mục D 899: niên đại, bản in năm 1857, nhịp 4/2 gốc."
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n45
  cau: "Mục Nguồn: Brian Newbould, Schubert: The Music and the Man (1997)."
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n35
  cau: "Nghe cùng một đoạn trong ba bản: ai chơi nhỏ nhất mà giai điệu vẫn hát, ai để dòng đệm mỏng nhất, ai giữ câu nhạc rộng và liền nhất?"
  loai: khuyen-tap
- trang: nghe-nhac/schubert-impromptu
  id: n33
  cau: Câu hỏi để nghe chủ động (sáu câu).
  loai: khuyen-tap
- trang: nghe-nhac/schubert-impromptu
  id: n37
  cau: Không nhanh, nhưng tay phải phải làm hai việc cùng lúc, bàn tay nhỏ sẽ vất vả với những quãng rộng, và bàn đạp phải rất tinh.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n1
  cau: 'Tiêu đề: "Bach: Prelude và fugue Đô thứ, BWV 847".'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n2
  cau: BWV 847 là cặp thứ hai của Bình quân luật quyển 1 (mô tả và câu mở đầu).
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n3
  cau: Prelude dựng trên móc kép liên tục ở hai tay; fugue có ba bè (giọng) độc lập.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n5
  cau: Fugue có 31 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n6
  cau: Ba bè vào lần lượt rất rõ, chủ đề dễ nhận ra.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n8
  cau: Suốt 24 ô đầu prelude, hai tay chơi cùng một kiểu hình móc kép.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n10
  cau: "Prelude nghĩ theo hợp âm, giống BWV 846: mỗi ô một hợp âm, rải bằng một hình nốt lặp lại; fugue nghĩ theo đường nét."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n13
  cau: "Bình quân luật (Das Wohltemperierte Klavier) gồm 24 cặp prelude và fugue, mỗi cặp ở một giọng, đi lên từng nửa cung, giọng trưởng trước giọng thứ: Đô trưởng, Đô thứ, Đô♯ trưởng, Đô♯ thứ…"
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n14
  cau: Vì thế BWV 847 là cặp số 2.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n15
  cau: Trang bìa bản chép năm 1722 gọi tập nhạc là Praeludia und Fugen durch alle Tone und Semitonia, tức prelude và fugue qua mọi cung và nửa cung.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n16
  cau: Tập nhạc viết cho những người trẻ ham học và cho cả những người đã thạo nghề.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n17
  cau: Chữ wohltemperiert ("được điều hòa tốt") nói đến cách lên dây cho phép chơi ở mọi giọng.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n18
  cau: "Prelude trông như bài tập ngón: một hình nốt lặp lại ô này sang ô khác."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n19
  cau: Gần cuối prelude, Bach ghi liền ba chỉ dẫn tốc độ Presto, Adagio, Allegro.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n20
  cau: Adagio là một ô tự do đầy nốt trang trí, rồi Allegro lao về hợp âm cuối.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n21
  cau: "Fugue ngắn, chủ đề có nhịp điệu riêng: một vòng móc kép quanh nốt Đô rồi những bước nhảy móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n23
  cau: Bach viết cho đàn phím thời ấy (harpsichord, clavichord), không có bàn đạp vang.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n27
  cau: Nốt đầu của mỗi hình nửa ô ở tay phải (thường cũng là nốt cao nhất) nối với nhau thành một đường nét chậm.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n28
  cau: Trong fugue, chủ đề (kể cả đáp đề) vào tám lần.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n30
  cau: Glenn Gould, Sviatoslav Richter, András Schiff, Angela Hewitt đều thu âm Bình quân luật; Gustav Leonhardt thu trên harpsichord.
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n32
  cau: "Theo dõi: Prelude mở đầu ô 1–4, hai tay cùng một kiểu hình móc kép trên nốt Đô trầm đứng yên."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n33
  cau: "Theo dõi: Chuyển giọng ô 5–20, bè trầm đi xuống dần, hòa âm đổi mỗi ô; sáng lên quanh Mi♭ trưởng (ô 11–14) rồi về Đô thứ."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n34
  cau: "Theo dõi: Âm nền át ô 21–27, bè trầm dừng trên Sol; từ ô 25 hình nốt biến đổi."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n35
  cau: "Theo dõi: Presto ô 28–33, tay phải chạy trước, từ ô 29 tay trái đuổi theo cùng hình nốt."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n36
  cau: "Theo dõi: Adagio rồi Allegro ô 34–38, một ô chậm tự do đầy nốt trang trí, rồi về hợp âm Đô trưởng cuối bài."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n37
  cau: "Theo dõi: Fugue ô 1–2, bè alto một mình với chủ đề."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n38
  cau: "Theo dõi: Đáp đề ô 3–4, soprano vào ở Sol thứ; alto chuyển sang chuỗi móc kép đi xuống (đối đề 1)."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n39
  cau: "Theo dõi: Bè bass vào ô 7–8, đủ ba bè; lần đầu chủ đề và hai đối đề vang cùng lúc."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n40
  cau: "Theo dõi: Giữa fugue ô 9–25, chủ đề ở Mi♭ trưởng (ô 11), Sol thứ (ô 15), Đô thứ (ô 20), xen đoạn chuyển có móc kép chạy."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n41
  cau: "Theo dõi: Kết ô 26–31, bè bass vào lần cuối, rồi soprano trên nốt Đô trầm ngân dài; hợp âm cuối là Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n42
  cau: "Bảng prelude, Mở đầu ô 1–4: nốt Đô trầm ở đầu mỗi nửa ô; mỗi ô một hợp âm, mỗi hình nửa ô chơi hai lần."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n43
  cau: "Bảng prelude, Chuyển giọng ô 5–20: bè trầm đi xuống Đô – Si♭ – La♭ – Sol (ô 6–11); hòa âm chạm Sol thứ (ô 7), Fa thứ (ô 9), Mi♭ trưởng (ô 11–14), qua hợp âm bảy giảm (ô 16–17) về Đô thứ (ô 18)."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n44
  cau: "Bảng prelude, Âm nền át ô 21–27: từ ô 25 tay trái chỉ đánh nốt Sol và hai nốt kế tiếp; tay phải nối dòng móc kép ở vùng giữa."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n45
  cau: "Bảng prelude, Presto ô 28–33: trên nốt Sol giữ dài tay phải chạy; từ ô 29 tay trái nhắc lại hình ấy thấp hơn một quãng tám, chậm hơn một ô; ở ô 31–32 tay trái chơi lên tận vùng của tay phải."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n46
  cau: "Bảng prelude, Adagio ô 34: hai hợp âm rải; giai điệu trang trí bằng móc ba, móc bốn."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n47
  cau: "Bảng prelude, Allegro ô 35–38: móc kép trở lại, dồn về hợp âm Đô trưởng có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n48
  cau: "Câu dẫn khối 1: bốn ô đầu đối chiếu từng nốt với bản Breitkopf & Härtel 1866 (Bach-Gesellschaft) qua bản chép LilyPond của Mutopia."
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n49
  cau: "Đọc theo hợp âm: ô 1 Đô thứ, ô 2 Fa thứ trên nốt Đô trầm, ô 3 hợp âm bảy giảm (Si♮ – Rê – Fa – La♭) trên nốt Đô trầm, ô 4 Đô thứ."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n50
  cau: Cả 24 ô đầu đều xây theo cùng cách (mỗi ô một hợp âm rải theo một hình).
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n52
  cau: "Câu dẫn khối 2: fugue theo bản Edition Peters, qua bản chép của Mutopia; cả hai bè đều ở khuông trên."
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n53
  cau: Chủ đề đi Đô – Si – Đô rồi nhảy xuống Sol (quãng 4); đáp đề đi Sol – Fa♯ – Sol rồi nhảy xuống Đô (quãng 5), không xuống Rê.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n54
  cau: Chỉ nốt thứ tư ấy được chỉnh; mọi nốt còn lại đúng là chủ đề dịch lên một quãng 5.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n55
  cau: "Kiểu đáp này gọi là đáp đề điệu tính (tonal answer): nốt át âm của chủ đề được đáp bằng nốt chủ âm."
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n56
  cau: "Trong lúc ấy bè alto chơi đối đề 1: chuỗi móc kép đi xuống rồi những móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n57
  cau: "Ô 7–8: bè bass vào với chủ đề; soprano chơi đối đề 1 (bắt đầu từ Fa); alto chơi đối đề 2, những móc đơn ngắt quãng bởi dấu lặng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n58
  cau: Nốt Fa đầu ô 7 ở soprano được nối từ ô 6.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n59
  cau: Ba đường nét (chủ đề, hai đối đề) còn gặp lại nhau, mỗi lần đổi bè, chẳng hạn ở ô 15–16 và ô 20–21.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n60
  cau: "Bản đồ: ô 1–2 alto, Đô thứ, chủ đề một mình."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n61
  cau: "Bản đồ: ô 3–4 soprano (đáp đề), Sol thứ; alto đối đề 1."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n62
  cau: "Bản đồ: ô 5–6 đoạn chuyển 1, đầu chủ đề nhắc theo chuỗi đi lên ở soprano; alto chạy móc kép."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n63
  cau: "Bản đồ: ô 7–8 bass, Đô thứ; soprano đối đề 1, alto đối đề 2; hết phần trình bày."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n64
  cau: "Bản đồ: ô 9–10 đoạn chuyển 2, bass chạy móc kép đi xuống; hai bè trên nhại đầu chủ đề."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n65
  cau: "Bản đồ: ô 11–12 soprano, Mi♭ trưởng; bass đối đề 1."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n66
  cau: "Bản đồ: ô 13–14 đoạn chuyển 3, soprano chạy móc kép đi lên; alto và bass đi móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n67
  cau: "Bản đồ: ô 15–16 alto (dạng đáp đề), Sol thứ; soprano đối đề 1, bass đối đề 2."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n68
  cau: "Bản đồ: ô 17–19 đoạn chuyển 4, các bè hỏi đáp bằng những mảnh chủ đề ngắn."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n69
  cau: "Bản đồ: ô 20–21 soprano, Đô thứ; alto đối đề 1, bass đối đề 2 hơi biến đổi."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n70
  cau: "Bản đồ: ô 22–26 đoạn chuyển 5, đầu chủ đề đi xuống theo chuỗi ở soprano; bass chạy móc kép."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n71
  cau: "Bản đồ: ô 26–28 bass (từ giữa ô 26), Đô thứ; lần vào cuối của bè trầm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n72
  cau: "Bản đồ: ô 29–31 soprano (từ giữa ô 29), Đô thứ, trên quãng tám Đô ngân dài ở bè trầm; hợp âm cuối Đô trưởng (quãng 3 Picardy)."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n74
  cau: "Chỗ khó, cân bằng hai tay ở prelude: tay phải ở vùng giữa, tay trái ở vùng trầm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n76
  cau: "Chỗ khó, ô 25–33: hình nốt đổi; ở Presto hai tay đuổi nhau sát bên nhau, có chỗ chen vào cùng một vùng phím."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n78
  cau: "Chỗ khó, Adagio ô 34: nhiều nốt nhỏ (móc ba, móc bốn) trong một ô chậm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n80
  cau: "Chỗ khó, ba bè trong fugue: bè alto nằm giữa, dễ bị hai bè ngoài che."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n82
  cau: "Chỗ khó, hai bè trong một tay: một bè giữ nốt dài trong khi bè kia chạy."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n85
  cau: Chỗ khó, đoạn chuyển có móc kép chạy ở ô 9–10, 13–14, 22–24.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n87
  cau: "Chỗ khó, ba ô cuối: tay trái giữ quãng tám Đô hơn hai ô trong khi tay phải chơi chủ đề kèm hợp âm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n96
  cau: Trong bản chép Mutopia (theo Edition Peters), bè alto được ghi xuống khuông dưới ở ô 12–14 và một đoạn ngắn trong ô 20.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n99
  cau: Prelude không ghi tốc độ ở đầu bài; Presto ở ô 28.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n103
  cau: "Đối đề 2: móc đơn, mỗi nhóm bắt đầu sau một dấu lặng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n106
  cau: Bach không ghi sắc thái nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n108
  cau: Ở Presto hai tay nhại nhau cách một ô.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n109
  cau: "Trong bản Bach-Gesellschaft (theo bản chép Mutopia), nốt Fa ở nửa sau ô 34 có dấu láy (mordent): nốt chính – nốt dưới – nốt chính."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n113
  cau: Ở ô 18 của prelude (tay trái, đầu nửa ô sau), bản Bach-Gesellschaft ghi Đô, còn người chép bản Mutopia ghi Si♭ theo một bản Urtext và chú thích lại chỗ này.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n114
  cau: Các đoạn trích trên trang theo bản Bach-Gesellschaft (prelude) và Edition Peters (fugue), qua Mutopia.
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n116
  cau: Các Sinfonia (invention ba bè) có số BWV 787–801.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n118
  cau: Fugue Rê thứ BWV 851 của quyển 1 có ba bè; fugue Đô trưởng BWV 846 có bốn bè.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n120
  cau: "Câu hỏi 1: cuối prelude Bach ghi Presto, Adagio, Allegro theo thứ tự; Presto ô 28, Adagio ô 34, Allegro ô 35."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n121
  cau: "Câu hỏi 2: ba bè vào theo thứ tự alto (ô 1), soprano (ô 3), bass (ô 7); soprano đáp ở Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n122
  cau: 'Câu hỏi 3: đáp đề khác "chủ đề dịch lên quãng 5" ở nốt thứ tư (nhảy xuống Đô thay vì Rê); đó là đáp đề điệu tính.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n124
  cau: "Nguồn: Henle HN 1014 (biên tập Ernst-Günter Heinemann) ghi mức độ khó theo thang Henle."
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n125
  cau: 'Nguồn: blog Henle 2022 "300 years of WTC I" nói về bản chép 1722, trang bìa, các bản in quanh năm 1800.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n126
  cau: "Nguồn: hai sách in (David Ledbetter, Bach's Well-tempered Clavier, Yale 2002; Christoph Wolff, Johann Sebastian Bach: The Learned Musician, Norton 2000)."
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n127
  cau: "Nguồn: lời nói đầu Henle HN 14 (Ernst-Günter Heinemann, 1997) nói về trang bìa bản chép 1722 và cách lên dây bình quân."
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n128
  cau: "Nguồn: bản nhạc IMSLP; đoạn trích đối chiếu với bản chép LilyPond của Mutopia, prelude theo Breitkopf & Härtel 1866, fugue theo Edition Peters (thêm link tệp .ly)."
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n29
  cau: Bè alto là bè khó nghe nhất vì nằm giữa.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n97
  cau: Kế hoạch 8 tuần, mỗi ngày 45–60 phút, prelude và fugue tập song song; tốc độ máy đếm nhịp từng tuần như bảng.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n102
  cau: "Phát âm fugue: móc kép liền, móc đơn tách nhẹ; chủ đề ba nốt Đô – Si – Đô thành một nhóm; nốt dài giữ đủ trường độ."
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n1
  cau: "Mô tả và câu mở đầu: bản nocturne nổi tiếng nhất của Chopin là một bài học về nghệ thuật hát trên phím đàn: giai điệu dài như giọng ca opera trên lớp đệm tay trái."
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n4
  cau: "Tay trái kiểu valse trong nhịp 12/8: mỗi phách lớn là một nốt trầm và hai hợp âm."
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n6
  cau: Fioritura là những chùm nốt nhỏ không chia đều theo phách, bắt chước lối luyến láy của ca sĩ.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n8
  cau: Bài dài 34 ô nhịp, khoảng bốn đến năm phút.
  loai: so-lieu
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n10
  cau: Henle xếp Nocturne Mi thứ Op. 72 số 1 (di cảo) và Nocturne Đô♯ thứ (di cảo, B. 49) ở mức 5.
  loai: cap-do
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n11
  cau: 'Câu cũ: hai nocturne mức 5 "dạy cùng một cách hát nhưng ít trang trí hơn".'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n13
  cau: Nocturne (dạ khúc) không phải do Chopin đặt ra; người khởi xướng thể loại này cho piano là John Field.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n14
  cau: John Field là nhà soạn nhạc người Ireland, sống 1782–1837.
  loai: nam
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n15
  cau: "Câu cũ: bản nocturne đầu tiên của Field in năm 1812."
  loai: nam
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n16
  cau: "Khuôn mẫu nocturne của Field: một giai điệu hát ở tay phải trên lớp hợp âm rải rộng của tay trái, nhờ bàn đạp mà ngân vang."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n17
  cau: Chopin nhận lấy khuôn mẫu đó rồi phát triển nó xa hơn.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n18
  cau: Chopin rất thích nhạc của Bellini, và khi dạy cách chơi láy quanh, nốt dựa, ông khuyên học trò lấy các ca sĩ Ý lớn làm mẫu.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n19
  cau: Bel canto nghĩa là "hát đẹp"; lối hát ấy chuộng những câu hát dài, liền tiếng, và ca sĩ thường tự thêm những đường luyến láy vào giai điệu.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n20
  cau: Mỗi lần chủ đề A trở lại, nó được "hát" với nhiều nốt hoa mỹ hơn.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n21
  cau: Op. 9 là bộ nocturne đầu tiên Chopin xuất bản.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n22
  cau: Op. 9 viết trong những năm Chopin rời Warsaw (cuối năm 1830), sống ở Vienna rồi đến Paris (1831).
  loai: nam
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n23
  cau: Nhà xuất bản Henle gọi bài số 2 là một trong những nocturne được yêu thích nhất, có lẽ cả trong toàn bộ tác phẩm của Chopin.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n24
  cau: Khi chơi và khi dạy bài này, Chopin thêm vào bản in nhiều biến thể trang trí, lớn nhỏ khác nhau; nhiều biến thể ông tự tay ghi vào bản nhạc của học trò.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n25
  cau: Ấn bản Wiener Urtext của Jan Ekier in các biến thể ở chú thích (bài này có nhiều biến thể nhất trong tập), và với riêng Op. 9 số 2 còn in thêm một phiên bản thứ hai chứa trọn các biến thể.
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n26
  cau: Ba câu hỏi khi nghe (hơi thở, tay trái, trang trí); so sánh chủ đề ở ô 1, ô 5, ô 13 và ô 21.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n27
  cau: Arthur Rubinstein, Claudio Arrau và Maria João Pires đều có bản thu các nocturne của Chopin.
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n29
  cau: '"Casta diva" là một aria trong opera Norma của Bellini.'
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n30
  cau: "Cấu trúc: A ô 1–4, A' ô 5–8, B ô 9–12, A'' ô 13–16, B' ô 17–20, A''' ô 21–24, coda ô 25–34 (bảng Theo dõi khi nghe và bảng Cấu trúc)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n31
  cau: "Chủ đề A: một câu dài trên lớp đệm kiểu valse, đỉnh ở nốt cao."
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n32
  cau: Đoạn B (ô 9–12) quanh Si♭ trưởng (giọng át); hòa âm căng hơn, sắc thái rộng hơn.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n33
  cau: A'' (ô 13–16) có trang trí dày hơn, với những chùm nốt nhỏ thật sự khó đầu tiên.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n34
  cau: B' (ô 17–20) là đoạn B trở lại.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n35
  cau: A''' (ô 21–24) là chủ đề lần cuối, trang trí nhiều nhất.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n36
  cau: "Coda từ ô 25: nhạc dâng lên cao trào lớn nhất của bài; cadenza nhỏ senza tempo, chuỗi nốt nhanh trên cao; kết khép lại ở Mi♭ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n37
  cau: Ô 32 ghi senza tempo (không theo nhịp).
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n38
  cau: Mọi câu nhạc đều dài 4 ô nhịp, trừ hai ô cuối; thứ tự A – A – B – A – B – A.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n39
  cau: "Bước nhảy tay trái: khoảng cách thường hơn một quãng tám, chỉ có thời gian một móc đơn để nhảy."
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n47
  cau: "Cao trào và cadenza ở coda: một hình nốt nhắc đi nhắc lại, dồn dập dần, dễ vỡ tiếng và mỏi tay; tập các nhóm nốt đều và chậm trước, dồn tốc độ từng chút, thả lỏng cổ tay sau mỗi nhóm."
  loai: quy-tac
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n52
  cau: Karol Mikuli, học trò của Chopin và về sau là người biên tập các tác phẩm của ông, kể rằng khi Chopin co giãn giai điệu, tay đệm vẫn tiếp tục chơi đúng nhịp.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n53
  cau: 'Học trò của Chopin còn nhớ lời dặn: "Hãy để tay trái làm nhạc trưởng và luôn giữ nhịp".'
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n55
  cau: Nghĩ theo bốn phách lớn mỗi ô; Andante nghĩa là "đi".
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n57
  cau: "Khi đã thuộc bài, thử một biến thể của chính Chopin (trong ấn bản Wiener Urtext) ở lần nhắc lại cuối; đó cũng là cách Chopin làm: mỗi lần một khác."
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n59
  cau: Phần lớn bài ở p và pp; cao trào lớn nhất nằm ở coda.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n61
  cau: "Nocturne khác: Rê♭ trưởng Op. 27 số 2 (Henle mức 6); Đô thứ Op. 48 số 1 và Si trưởng Op. 9 số 3 (Henle mức 7)."
  loai: cap-do
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n65
  cau: "Câu hỏi 1: mỗi lần chủ đề A trở lại, nó được trang trí nhiều hơn; cấu trúc A A B A B A và coda, 34 ô nhịp, giống ca sĩ bel canto thêm luyến láy khi hát lại một giai điệu."
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n66
  cau: "Câu hỏi 2: fioritura là những chùm nốt hoa mỹ nhỏ không chia đều theo phách, bắt chước lối luyến láy của ca sĩ; chúng nhỏ hơn giai điệu chính, cả chùm lọt vừa phách trong khi tay trái giữ nhịp."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n67
  cau: "Câu hỏi 3: theo lời kể của Karol Mikuli, rubato của Chopin là giai điệu co giãn trong khi tay đệm vẫn chơi đúng nhịp."
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n69
  cau: "Mục Nguồn: Niecks (Project Gutenberg) về Mikuli, Field, opera Ý; chú giải Ấn bản Quốc gia Ba Lan về biến thể; Henle HN 233 (Ewald Zimmermann) cho mức khó; Wiener Urtext (Jan Ekier) cho biến thể; IMSLP; tài liệu tham khảo."
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n44
  cau: Láy rền, láy quanh trong giai điệu dễ thành tiếng gõ; khi chậm viết ra số nốt, khi nhanh giữ nhỏ hơn nốt chính.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n3
  cau: Tiếng piano tắt dần ngay sau khi đánh; muốn giai điệu liền như giọng hát, phải nghe đuôi nốt dài và cho nốt sau vào đúng độ to nốt trước còn lại.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n68
  cau: "Câu hỏi 4: tập chùm nốt hoa mỹ bắt đầu từ giai điệu khung, rồi chùm nốt riêng theo nhóm nhỏ."
  loai: khuyen-tap
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n1
  cau: 'Tiêu đề: "Debussy: Clair de lune" (Ánh trăng).'
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n2
  cau: Gần như cả bài nằm trong vùng pp và p, với một nhịp điệu cố tình làm mờ phách.
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n6
  cau: Bài kéo dài khoảng năm phút.
  loai: so-lieu
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n7
  cau: Đây là một trong những bản nhạc piano được yêu thích nhất.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n9
  cau: The Little Shepherd là một bài trong tập Children's Corner của Debussy.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n10
  cau: Tên bài trùng tên bài thơ Clair de lune của Paul Verlaine, bài mở đầu tập Fêtes galantes.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n11
  cau: Tập Fêtes galantes in năm 1869.
  loai: nam
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n12
  cau: Debussy đã phổ bài thơ Clair de lune thành ca khúc.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n13
  cau: Chữ bergamasque có ngay trong bài thơ ấy ("masques et bergamasques"); theo lời tựa Henle, tên tổ khúc thường được coi là gợi nhớ tập thơ này.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n14
  cau: Bài thơ tả những nhân vật đeo mặt nạ dưới ánh trăng, vui mà buồn.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n16
  cau: Debussy viết bộ tổ khúc khi khoảng 28 tuổi, nhưng chỉ in 15 năm sau.
  loai: nam
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n17
  cau: Chính Debussy ghi năm 1890 lên bản in thử để cho biết đây là tác phẩm thời trẻ.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n18
  cau: Bản in năm 1905 là bản đã sửa.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n19
  cau: Bản thảo gốc đến nay chưa tìm thấy, nên không ai biết chắc phần nào thuộc năm 1890, phần nào thuộc năm 1905.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n20
  cau: "Hòa âm còn chức năng: có hợp âm át, có kết rõ."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n24
  cau: Walter Gieseking thu trọn nhạc piano solo của Debussy.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n26
  cau: "Theo dõi: Mở đầu ô 1–14, pp con sordina; quãng ba, quãng sáu đi xuống ở tay phải, bắt đầu sau phách đầu và nối qua phách."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n27
  cau: "Theo dõi: Tempo rubato ô 15–18, giai điệu rõ hơn trên các hợp âm."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n28
  cau: "Theo dõi: lớn dần, nhanh dần ô 19–26 (peu à peu cresc. et animé), dừng trên một hợp âm át rải."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n29
  cau: "Theo dõi: Un poco mosso ô 27–36, tay trái rải hợp âm liên tục như nước chảy, giai điệu ở tay phải."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n30
  cau: "Theo dõi: Cao trào ô 37–42, điểm cao nhất của bài quanh ô 41."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n31
  cau: "Theo dõi: Calmato ô 43–50, lắng lại trên nền trầm."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n32
  cau: "Theo dõi: A' ô 51–65, tốc độ ban đầu trở lại; chủ đề mở đầu trên nền hợp âm rải."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n33
  cau: "Theo dõi: Coda ô 66–72, hợp âm rải, tay bắt chéo, tan dần đến hết (morendo jusqu'à la fin)."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n34
  cau: "Bảng: A ô 1–14, Andante très expressif, pp con sordina; quãng ba, quãng sáu đi xuống ở tay phải; bắt đầu sau phách đầu, nhiều dấu nối qua phách."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n36
  cau: "Bảng: A (tiếp) ô 15–26, Tempo rubato; giai điệu trên hợp âm; từ ô 19 peu à peu cresc. et animé (lớn dần và nhanh dần từng chút); kết thúc trên hợp âm át rải."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n38
  cau: "Bảng: B ô 27–36, Un poco mosso, tay trái rải hợp âm liên tục, giai điệu ở tay phải."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n40
  cau: "Bảng: B (cao trào) ô 37–42, điểm cao nhất quanh ô 41."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n41
  cau: "Bảng: B (lắng) ô 43–50, Calmato."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n42
  cau: "Bảng: A' ô 51–65, tốc độ ban đầu trở lại, chủ đề mở đầu trên nền hợp âm rải."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n43
  cau: "Bảng: Coda ô 66–72, hợp âm rải, tay bắt chéo, tan dần đến hết."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n45
  cau: Bài có 72 ô nhịp, 9/8, Rê♭ trưởng.
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n46
  cau: 'Phím đàn có "điểm thoát" (escapement): ấn quá chậm thì nốt không kêu, quá nhanh thì to.'
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n50
  cau: "Nhịp mơ hồ: nhóm hai nốt trong 9/8 (mắt quen đọc nhóm ba); nốt bắt đầu sau phách và nối qua phách."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n52
  cau: "Đoạn Un poco mosso: tay trái trải rộng hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n66
  cau: Andante là "đi", không phải đứng yên.
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n68
  cau: Rubato chỉ được ghi rõ ở đoạn Tempo rubato.
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n69
  cau: Bài gần như chỉ sống trong vùng từ ppp đến p; chỉ một lần lên f, ở cao trào của đoạn B (ô 41).
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n71
  cau: Con sordina ở đầu bài nghĩa là dùng una corda (bàn đạp trái).
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n72
  cau: Una corda làm tiếng mềm và đổi màu, không chỉ làm nhỏ.
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n74
  cau: Debussy được kể là muốn người chơi làm người nghe quên rằng piano có búa.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n76
  cau: Các bản Urtext dựa vào ấn bản 1905 và bản in thử, có phần chú thích các chỗ khác nhau giữa các nguồn.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n77
  cau: Có thể dùng Henle hoặc ấn bản Œuvres complètes.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n80
  cau: "Debussy tiếp theo: Rêverie, Arabesque số 1, các bài trong Children's Corner, rồi tập Préludes."
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n85
  cau: "Câu hỏi 1: ở đoạn Un poco mosso (ô 27–36), tay trái rải hợp âm liên tục dưới giai điệu tay phải."
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n86
  cau: "Câu hỏi 2: con sordina ở đầu bài nghĩa là dùng una corda."
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n89
  cau: "Nguồn: Henle HN 381, lời tựa của François Lesure: niên đại, các tên gọi ban đầu, lịch sử xuất bản."
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n90
  cau: "Nguồn: ba sách in (Bhogal, Clair de Lune, OUP 2018; Howat, The Art of French Piano Music, Yale 2009; Roberts, Images, Amadeus 1996)."
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n91
  cau: "Nguồn mới: Verlaine, Fêtes galantes (Gutenberg); bản chép Mutopia theo bản in Fromont 1905."
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n55
  cau: "Cao trào: lập bản đồ sắc thái, chỗ to nhất là một chỗ duy nhất; dùng trọng lượng cánh tay, cổ tay mềm."
  loai: khuyen-tap
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n87
  cau: 'Câu hỏi 3: chơi pp đều: ngón sát phím, trọng lượng tay thả lỏng, tìm "đáy" phím.'
  loai: khuyen-tap
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n88
  cau: 'Câu hỏi 4: khi tập chậm đoạn mở đầu, đếm to theo móc đơn; phách có nhóm hai nốt đếm "1-và".'
  loai: khuyen-tap
- trang: piano/tac-pham/pathetique-adagio
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata Pathétique, chương 2 (Adagio cantabile)".'
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n2
  cau: Giai điệu, phần đệm móc kép và bè trầm cùng nằm trong hai bàn tay; một bàn tay (tay phải) thường lo hai việc cùng lúc.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n4
  cau: Ngay từ ô đầu, tay phải vừa hát giai điệu bằng ngón 3–4–5, vừa chơi phần đệm móc kép bằng ngón 1–2.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n6
  cau: "Chủ đề vang lên ba lần (ô 1, 29, 51), kết cấu đổi dần: lần đầu được nhắc lại cao hơn một quãng tám với phần đệm dày hơn; lần cuối phần đệm chuyển sang chùm ba."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n8
  cau: Chương ở nhịp 2/4, Adagio.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n11
  cau: Beethoven viết Pathétique khi khoảng 27 tuổi.
  loai: nam
- trang: piano/tac-pham/pathetique-adagio
  id: n12
  cau: Beethoven đến Vienna năm 1792; Pathétique viết vài năm sau.
  loai: nam
- trang: piano/tac-pham/pathetique-adagio
  id: n13
  cau: Lúc ấy ông đã nổi tiếng như một nghệ sĩ piano, nhất là tài ứng tác.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n14
  cau: Tên Grande Sonate pathétique có ngay trên bản in đầu tiên năm 1799.
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n16
  cau: '"Pathétique" ở đây gần nghĩa "đầy xúc động, bi tráng", không phải "thảm hại".'
  loai: dinh-nghia
- trang: piano/tac-pham/pathetique-adagio
  id: n17
  cau: Chương 1 ở Đô thứ; chương 2 ở La♭ trưởng, thấp hơn một quãng ba trưởng.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n18
  cau: Giai điệu chương 2 rất gần một chủ đề trong chương chậm của Sonata Đô thứ K. 457 của Mozart.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n19
  cau: Hai sonata còn giống nhau ở giọng (Đô thứ) và cách chia chương (ba chương).
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n23
  cau: Đoạn C ở giọng thứ (La♭ thứ).
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n24
  cau: Wilhelm Kempff và Alfred Brendel đều thu trọn 32 sonata của Beethoven.
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n27
  cau: "Theo dõi: Chủ đề ô 1–8, giai điệu ở âm vực giữa, bắt đầu từ Đô giữa; tay phải vừa hát vừa đệm móc kép, tay trái giữ bè trầm."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n28
  cau: "Theo dõi: Chủ đề cao hơn một quãng tám ô 9–16; kết cấu đầy hơn, tay trái cũng tham gia phần móc kép."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n29
  cau: "Theo dõi: Đoạn B ô 17–28, Fa thứ, qua Đô thứ, đến Mi♭ trưởng; tay trái hợp âm lặp lại; đoạn nối có bè trong đi xuống theo nửa cung; pp trước khi chủ đề trở lại."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n30
  cau: "Theo dõi: Chủ đề trở lại ô 29–36, chỉ tám ô, ở âm vực giữa."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n31
  cau: "Theo dõi: Đoạn C ô 37–50, La♭ thứ, phần đệm chuyển sang chùm ba móc kép; tay trái đáp lời ở âm vực trầm."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n32
  cau: "Theo dõi: Mi trưởng bất ngờ trong đoạn C, các nốt sf; rồi đoạn nối trên hợp âm bảy giảm và hợp âm át dẫn về chủ đề."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n33
  cau: "Theo dõi: Chủ đề lần cuối ô 51–66, phần đệm chùm ba; tám ô đầu ở âm vực giữa."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n34
  cau: "Theo dõi: Chủ đề lên cao một quãng tám, tám ô tiếp theo, vẫn trên nền chùm ba."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n35
  cau: "Theo dõi: Coda ô 66–73, chùm ba tiếp tục, chủ – át luân phiên, mảnh giai điệu và nốt hoa mỹ, tắt dần về pp."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n37
  cau: "Đây là một rondo nhỏ: chủ đề A vang lên ba lần, xen giữa là hai đoạn tương phản."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n38
  cau: "Bảng: A ô 1–8 chủ đề ở âm vực giữa (bắt đầu từ Đô giữa); tay phải giai điệu ở trên, móc kép ở dưới; tay trái bè trầm."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n39
  cau: "Bảng: A ô 9–16 chủ đề nhắc lại cao hơn một quãng tám, kết cấu đầy hơn, tay trái cũng tham gia phần móc kép."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n40
  cau: "Bảng: B ô 17–28 Fa thứ, qua Đô thứ, đến Mi♭ trưởng; đoạn nối bè trong đi xuống theo nửa cung; tay trái hợp âm lặp lại; pp trước khi chủ đề trở lại."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n41
  cau: "Bảng: A ô 29–36 chủ đề chỉ tám ô, ở âm vực giữa."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n42
  cau: "Bảng: C ô 37–50 La♭ thứ, đệm chùm ba móc kép; sang Mi trưởng (đổi tên enharmonic) với các nốt sf; đoạn nối trên hợp âm bảy giảm rồi hợp âm át."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n43
  cau: "Bảng: C là đoạn kịch tính nhất bài: tay phải vừa hát vừa đệm chùm ba; tay trái đáp lời ở âm vực trầm."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n44
  cau: "Bảng: A ô 51–66 chủ đề lần cuối đệm chùm ba: tám ô ở giữa, tám ô cao hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n45
  cau: "Bảng: Coda ô 66–73, chùm ba tiếp tục, chủ – át luân phiên, mảnh giai điệu và nốt hoa mỹ, tắt dần về pp."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n46
  cau: Chương có 73 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n48
  cau: "Chỗ khó: ngón 1–2 chơi nhiều nốt hơn nên dễ to hơn; ngón 4–5 phải hát."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n52
  cau: Hòa âm đổi mỗi phách hoặc nửa phách; giai điệu đi bậc.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n55
  cau: "Đoạn C: tay phải vừa hát vừa lặp hợp âm chùm ba: cổ tay mềm, ngón sát phím, tập chùm ba riêng ở pp."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n56
  cau: "Chuyển sang Mi trưởng: đọc nốt thăng sau cả trang dấu giáng."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n58
  cau: "Phần A cuối: nhịp hai (giai điệu) chọi ba (đệm)."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n69
  cau: "Adagio cantabile: chậm, như hát."
  loai: dinh-nghia
- trang: piano/tac-pham/pathetique-adagio
  id: n72
  cau: Bè trầm có hướng đi riêng, nhiều chỗ đi bậc như một giai điệu thứ hai.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n73
  cau: Dấu luyến của Beethoven thường dài hơn ở giai điệu và ngắn ở các mảnh đối đáp; có chấm staccato trong đoạn B và coda.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n75
  cau: Đàn của Beethoven năm 1798 có tiếng tắt nhanh hơn đàn hiện đại.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n77
  cau: Láy quanh của Beethoven thường bắt đầu từ nốt trên.
  loai: quy-tac
- trang: piano/tac-pham/pathetique-adagio
  id: n79
  cau: Các bản thế kỷ 19, như của Hans von Bülow, thêm nhiều sắc thái, bàn đạp và thay đổi dấu luyến.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n80
  cau: Ấn bản ABRSM của Barry Cooper có gợi ý ngón bấm, giải thích và ghi rõ phần nào là của người biên tập.
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n83
  cau: "Chương 3 (Rondo: Allegro) là bước tiếp tự nhiên; chương 1 cần tốc độ và sức bền ở mức Grade 8 trở lên."
  loai: cap-do
- trang: piano/tac-pham/pathetique-adagio
  id: n88
  cau: "Câu hỏi 1: ở lần cuối (ô 51–66), phần đệm chuyển sang chùm ba móc kép, mang theo nhịp điệu của đoạn C."
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n90
  cau: "Câu hỏi 3: Adagio cantabile nghĩa là chậm, như hát."
  loai: dinh-nghia
- trang: piano/tac-pham/pathetique-adagio
  id: n92
  cau: "Nguồn: ấn bản Henle Op. 13 và ấn bản ABRSM The 35 Piano Sonatas (biên tập Barry Cooper)."
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n93
  cau: "Nguồn: hai sách in (Barry Cooper, Beethoven, OUP 2000; Charles Rosen, Beethoven's Piano Sonatas: A Short Companion, Yale 2002)."
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n94
  cau: "Nguồn: Badura-Skoda, lời giới thiệu đĩa K. 457; bản chép LilyPond của Mutopia (Berners 1908, Peters 1910)."
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n66
  cau: Kế hoạch 8 tuần, 45–60 phút mỗi ngày, tốc độ theo móc đơn từ ♪ = 50 lên khoảng 60–72.
  loai: khuyen-tap
- trang: piano/tac-pham/pathetique-adagio
  id: n78
  cau: Nốt hoa mỹ chơi nhẹ hơn nốt chính, không vội; đọc chú thích bản Urtext.
  loai: khuyen-tap
- trang: piano/tac-pham/pathetique-adagio
  id: n49
  cau: "Cách tập giai điệu và móc kép: chơi riêng giai điệu với ngón 3–4–5, thêm móc kép bấm câm, rồi pp; bài tập 1."
  loai: khuyen-tap
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n1
  cau: "Mô tả và mở đầu: giai điệu dài như ca khúc hát chậm rãi trên dòng hợp âm rải chảy không ngừng, cả hai nằm trong cùng tay phải."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n4
  cau: Bài dài 86 ô nhịp 4/2; tay phải vừa hát giai điệu vừa rải hợp âm.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n7
  cau: Một câu tám ô ở nhịp 4/2 kéo dài khoảng nửa phút.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n9
  cau: "Năm 1827, năm trọn vẹn cuối cùng của đời mình, Schubert viết hai tập, mỗi tập bốn bản: D. 899 và D. 935."
  loai: nam
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n10
  cau: "Cái tên Impromptu có lẽ do nhà xuất bản Tobias Haslinger đặt cho tập đầu: chính ông ghi tên này lên bản thảo bài số 1."
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n11
  cau: Haslinger in bài số 1 và 2 ngay cuối năm 1827.
  loai: nam
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n12
  cau: Bài số 3 và 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai Tobias, Carl Haslinger, in ra.
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n13
  cau: Lần in năm 1857 dịch bài lên Sol trưởng cho dễ chơi hơn; Henle nhận xét việc dịch giọng làm phai màu riêng của bài.
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n15
  cau: Ở Sol♭ trưởng, năm trong bảy nốt của gam là phím đen; chỉ Đô♭ (chính là phím Si) và Fa là phím trắng.
  loai: dinh-nghia
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n16
  cau: Nếu bản nhạc ở Sol trưởng, đó là bản theo lần in 1857; nên đổi sang bản Urtext ở giọng gốc (link Hóa biểu, Dịch giọng).
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n17
  cau: "Bàn phím và chú thích: thế tay phải của ô 1 là dòng đệm Si♭3 – Rê♭4 – Sol♭4 dưới nốt giai điệu Si♭4, tất cả là phím đen, gọn trong một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n18
  cau: "Schubert ghi nhịp 4/2: mỗi ô bốn phách nốt trắng; dòng đệm là những nhóm sáu móc đơn trên mỗi phách nốt trắng, chảy gần như không dừng."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n19
  cau: Ở tốc độ Andante, một ô dài khoảng bốn giây.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n23
  cau: Ô 25 bắt đầu f; có láy rền ở ô 19 và ô 53.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n24
  cau: "Câu 1 (ô 1–4): pp; nốt Si♭ ngân dài rồi hai nốt Si♭ nhắc lại nhẹ; dòng chùm sáu chảy ngay từ nốt đầu; câu dừng trên hợp âm Rê♭ trưởng (kết nửa)."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n25
  cau: "Câu 2 (ô 5–8): bắt đầu như câu 1, lần này khép về Sol♭ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n26
  cau: "Câu dài (ô 9–16): giai điệu vươn cao hơn (tới Fa♭5 ở ô 12), hòa âm đổi màu; ô 13 lùi về pp."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n27
  cau: "Câu dài nói lại (ô 17–24): cùng giai điệu trên bè trầm khác; láy rền đầu tiên ở bè trầm (Rê♭2, ô 19); khép về Sol♭ ở ô 24."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n28
  cau: "Đoạn giữa mở ra (ô 25–28): Mi♭ thứ, f; nốt giai điệu có dấu nhấn; bè trầm đi lên bằng những chùm ba nhỏ."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n29
  cau: "Sáng tối xen kẽ (ô 29–40): f, p, pp, cả ppp (ô 35); láy rền ở ô 29; hai cú nhấn fz (ô 36, 38)."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n30
  cau: "Những tiếng thở dài (ô 41–48): nốt nhấn rơi xuống một bậc (Sol♭–Fa, Mi♭–Rê); láy rền ở ô 46."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n31
  cau: "Mi♭ trưởng và đường về (ô 49–54): giai điệu dừng lại trên Mi♭ (ô 51–53); bè trầm đi xuống tới láy rền rất trầm trên Sol♭1 (ô 53), rồi dấu ngân (ô 54)."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n32
  cau: "Chủ đề trở lại (ô 55–74): như lần đầu nhưng rút gọn; câu cuối nói hai lần, lần hai bắt đầu fp (ô 71)."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n33
  cau: "Coda (ô 75–86): hòa âm rẽ rất xa và lên tới ffz (ô 80), rồi về Sol♭; nhịp điệu của ô đầu tiên vang lần cuối (ô 84–85); ppp, dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n34
  cau: Số ô nhịp, sắc thái và vị trí láy rền theo ấn bản Breitkopf & Härtel 1888 (bản Mutopia), giữ nhịp 4/2 như Schubert viết.
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n35
  cau: "Bảng Cấu trúc, A · chủ đề (ô 1–8): câu 1 dừng trên Rê♭ trưởng (kết nửa), câu 2 về Sol♭, pp; ô 4 có một crescendo nhỏ rồi diminuendo."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n36
  cau: "A · câu dài (ô 9–16): Fa♭5 ở ô 12, pp ở ô 13; đỉnh câu ở ô 10–12."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n37
  cau: "A · câu dài nói lại (ô 17–24): bè trầm mới, láy rền đầu tiên (Rê♭2, ô 19), kết Sol♭ ở ô 24; hòa âm tối hơn (Mi♭♭ ở ô 21)."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n38
  cau: "B (ô 25–40): Mi♭ thứ, f, dấu nhấn, chùm ba ở bè trầm, sắc thái từ f tới ppp, có fz; láy rền ở ô 29."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n39
  cau: "B (ô 41–52): hình thở dài (ô 41, 45); láy rền ở ô 46; ô 49–52 sáng lên Mi♭ trưởng, rồi giai điệu đứng yên trên nốt Mi♭ (ô 51–53)."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n40
  cau: "Đường về (ô 53–54): láy rền trên Sol♭1 (ô 53); dấu ngân ở ô 54."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n41
  cau: "A' (ô 55–74): chủ đề nguyên vẹn (ô 55–62), phần tiếp theo rút gọn; câu cuối nói hai lần (ô 67–70 và 71–74), lần hai fp."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n42
  cau: "Coda (ô 75–86): hòa âm rẽ rất xa (ô 78–80; bản Breitkopf tạm đổi hóa biểu và viết bằng dấu thăng), ffz ở ô 80, nhịp điệu ô 1 (ô 84–85), ppp, dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n43
  cau: "Cả bài chỉ có một chất liệu: giai điệu ca khúc trên dòng chùm sáu; đoạn giữa không đổi kết cấu mà đổi giọng, sắc thái và vai trò bè trầm."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n44
  cau: Đoạn trích ô 1–4 chép theo bản Mutopia của Ph. Raynaud (dựa trên ấn bản Breitkopf & Härtel 1888, phạm vi công cộng) và đã được đối chiếu từng nốt.
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n45
  cau: "Giai điệu: một nốt Si♭4 ngân dài, rồi hai nốt Si♭ có chấm dưới dấu luyến (portato)."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n46
  cau: "Dòng chùm sáu: nhóm nào rơi đúng lúc giai điệu đánh xuống thì bắt đầu bằng dấu lặng; ở ô 3, dưới bốn nốt đen của giai điệu, nó đổi thành chùm ba."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n47
  cau: "Bè trầm: những quãng rộng ngân dài, ở ô 4 một hợp âm rải; câu dừng trên hợp âm Rê♭ trưởng; nốt La♮ cuối ô 4 dẫn lên Si♭ ở ô 5."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n50
  cau: Ở tốc độ này, một nốt tròn ngân hơn hai giây.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n52
  cau: "Giai điệu đi xuống vào vùng của dòng đệm ở ô 3 và ô 57: bốn nốt đen Sol♭ – Fa – Mi♭ – Rê♭ đi xuống sát những chùm ba."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n53
  cau: "Bè trầm và tay trái (ô 25–52): quãng tám, hợp âm rộng, chùm ba đi lên dẫn vào nốt trầm mới; đổi bàn đạp ở nốt đích."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n54
  cau: Láy rền ở âm vực trầm có ở ô 19, 29, 46, 53, 65, 75, 79.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n56
  cau: "Bàn đạp: hòa âm đổi mỗi nửa ô, có khi mỗi phách, trong khi nốt giai điệu còn ngân; bàn đạp nối, giữ nốt bằng ngón, nửa bàn đạp."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n57
  cau: "Đọc nhạc (nhất là ô 21, 35–36, 53–54, 75, 79–80): dấu giáng kép (Mi♭♭, La♭♭, Si♭♭) và một đoạn viết bằng dấu thăng."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n58
  cau: Đô♭ là phím Si, Fa♭ là phím Mi.
  loai: dinh-nghia
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n60
  cau: "Bàn tay nhỏ: khoảng cách giữa ngón cái (dòng đệm) và ngón út (giai điệu) thường tới một quãng tám; cổ tay mềm, xoay nhẹ theo hình rải, không gồng để với; có thể mượn tay trái đánh vài nốt thấp nhất của dòng đệm, hỏi giáo viên trước khi đổi."
  loai: quy-tac
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n62
  cau: "Bài tập 1: Rê♭5 – Đô♭5 – Si♭4 ngón 5 – 4 – 3; ba nốt là một kết nhỏ, Đô♭ là nốt bảy của hợp âm Rê♭ bảy, đi xuống Si♭."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n70
  cau: Andante ở đây là bước đi, không phải đứng yên.
  loai: dinh-nghia
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n71
  cau: Tốc độ nốt trắng ≈ 52–60 cho cả bài dài khoảng sáu phút.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n73
  cau: Henle mô tả bài này là một giấc mơ huyền bí ở pianissimo, và bản Breitkopf mở đầu bằng pp.
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n76
  cau: Una corda có thể giúp ở những chỗ ppp (ô 35, ô 84), nhưng đừng dựa vào nó suốt bài.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n77
  cau: f ở ô 25 là chiều sâu, không phải độ cứng; dấu nhấn trên nốt dài là trọng lượng; hai cú fz ở ô 36 và 38 bất ngờ nhưng ngắn.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n78
  cau: Bản Breitkopf viết sẵn nốt kết cho phần lớn các láy rền (hai nốt hoa mỹ nhỏ ngay trước nốt sau).
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n80
  cau: Dòng chùm sáu là chiếc đồng hồ của bài; hai dấu ngân, ở ô 54 và ở ô cuối, là hai chỗ dừng hẳn duy nhất.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n81
  cau: "Ấn bản: Henle có ấn bản riêng cho bài này (HN 488) bên cạnh các tập Impromptu trọn bộ; Wiener Urtext và Bärenreiter cũng in bài ở giọng gốc; bản Breitkopf & Härtel 1888 (Mutopia) miễn phí, hữu ích để đối chiếu nốt."
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n85
  cau: "Schubert tiếp theo: Impromptu La♭ trưởng D. 935 số 2 dễ tiếp cận hơn một chút; Impromptu Mi♭ trưởng D. 899 số 2 có dòng chùm ba nhanh của tay phải."
  loai: cap-do
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n87
  cau: "Câu hỏi 1: lần in đầu của bài (1857) dịch sang Sol trưởng và chia đôi các ô nhịp dài; nhà xuất bản đổi cho dễ chơi hơn, vì sáu dấu giáng và nhịp 4/2 là điều khác thường với một bản nhạc ngắn thời ấy; bản Urtext trả lại Sol♭ trưởng và 4/2."
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n88
  cau: "Câu hỏi 2: nhịp 4/2 nên cảm là bốn phách nốt trắng mỗi ô, mỗi phách một nhóm sáu móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n91
  cau: 'Mục Nguồn: Henle HN 488 (mức độ khó 6, "a mysterious reverie in pianissimo", nhận xét về bản Sol trưởng).'
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n92
  cau: 'Mục Nguồn: dòng Wikipedia tiếng Anh (năm sáng tác, cái tên do Haslinger đặt, lần in 1857, "dễ đọc hơn nhưng không dễ chơi hơn").'
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n93
  cau: "Mục Nguồn: Mutopia Project, Impromptu in Ges-dur, D. 899 số 3 (Ph. Raynaud, phạm vi công cộng, theo Breitkopf & Härtel 1888): nguồn của đoạn trích, số ô, sắc thái, vị trí láy rền."
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n75
  cau: "Bàn đạp: đổi theo hòa âm kiểu bàn đạp nối; nửa bàn đạp cho bè trầm ngân; đổi ở nốt đích của chùm ba; láy rền trầm đạp nông."
  loai: khuyen-tap
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n89
  cau: "Câu hỏi 3: các ngón ngoài, chủ yếu 4 và 5, hát giai điệu; ngón 1–2–3 chơi dòng chùm sáu."
  loai: khuyen-tap
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n66
  cau: Láy rền tập không bàn đạp trước, rồi thêm bàn đạp nông; tăng tốc dần qua nhiều ngày.
  loai: khuyen-tap
