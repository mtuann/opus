  ghi_chu: 'OMT: khóa Sol "designates the second-lowest line of a staff as G₄", khóa Fa "shows which line of the staff is F₃" (hai chấm quanh vạch), Đô giữa là C₄ ở vạch phụ thứ nhất dưới khuông Sol hoặc trên khuông Fa.'
