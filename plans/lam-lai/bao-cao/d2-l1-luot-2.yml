  ghi_chu: 'Chưa có Grade chính thức cho chính bài này. Henle HN 349: Menuet BWV Anh. 114 mức 1 (easy), cùng mức với Anh. 115 và Menuet của Böhm; Levels of Difficulty: mức 1 = ''ideally playable after a year of good piano instruction''. ABRSM 2027–28 xếp Minuet in G minor của Petzold (cùng tập Anna Magdalena) ở Grade 2; Trinity (8/2026) xếp Minuet in G của Böhm (cùng tập) và Minuet in G minor của Petzold ở Grade 2. ABRSM 2021–2028 và Trinity không liệt kê Anh. 114 nên ''cấp 1–2'' chỉ là suy ra gián tiếp (khả dĩ, có thể đúng). Cảnh báo: nếu bản ghi trỏ BWV Anh. II 116 thì ABRSM 2023–24 xếp Grade 3; cần kiểm số danh mục của ''Minuet Sol trưởng'' trong dữ liệu.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n10
  luot_2: dung
  nguon: []
  ghi_chu: Loại khuyen-tap. Tiêu chí hợp sư phạm phổ thông (sonatina trọn bài ổn định nhịp; đệm Alberti nhỏ hơn giai điệu; gam đến 3 dấu hóa hai tay hai quãng tám). Không hại.
- trang: bat-dau/kiem-tra-dau-vao
  id: n11
  luot_2: dung
  nguon:
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202023%20&%202024%20Prac%20syllabus%2020230807.pdf
  - https://www.henle.de/en/Six-Piano-Sonatinas-op.-36/HN-848
  - https://www.trinitycollege.com/resource?id=10125
  ghi_chu: 'ABRSM Piano 2023 & 2024, Grade 3: ''Clementi, Vivace (3rd movt from Sonatina in C, Op. 36 No. 1)''. Henle HN 848: Op. 36 số 1 mức 3 (easy), bộ sáu sonatina ''in ascending order of difficulty'' nên số 1 là bài dễ nhất. Lưu ý: ABRSM chỉ liệt kê một chương, và Op. 36 số 1 không có trong đề cương 2025–26 và 2027–28; Trinity (8/2026) xếp chương của Op. 36 số 2 và số 4 ở Grade 4. Phần ''chặng 3'' là ánh xạ riêng của site.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n12
  luot_2: dung
  nguon: []
  ghi_chu: Loại khuyen-tap. Tiêu chí hợp sư phạm phổ thông (hai bè độc lập, gam trưởng và thứ hai quãng tám, biểu diễn thuộc lòng khoảng 10 phút). Không hại.
- trang: bat-dau/kiem-tra-dau-vao
  id: n13
  luot_2: dung
  nguon: []
  ghi_chu: Loại khuyen-tap. Tiêu chí hợp sư phạm phổ thông (chương sonata Cổ điển gần tốc độ chỉ dẫn; làm nổi giai điệu ở giữa hoặc tay trái; hai bè Bach rõ, cách phát âm nhất quán). Không hại.
- trang: bat-dau/kiem-tra-dau-vao
  id: n14
  luot_2: khong-chac
  nguon:
  - https://www.henle.de/en/Inventions-and-Sinfonias/HN-590
  - https://www.abrsm.org/sites/default/files/2023-09/piano-2021-2022-syllabus-rev-sep-2020-final.pdf
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202023%20&%202024%20Prac%20syllabus%2020230807.pdf
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
  - https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf
  - https://www.trinitycollege.com/resource?id=10125
  ghi_chu: 'Henle HN 590: Invention số 1 (BWV 772) mức 3 (easy), không ghi Grade ABRSM; chỉ ghi ABRSM Piano Grade 5 cho Invention số 8, Grade 6 ''recommended'' cho số 6, Grade 6 cho số 14. Đề cương piano ABRSM 2021–2028 chỉ có Invention số 8 (Grade 5), số 6 (Grade 6) và số 14 (Grade 6, 2025–26); Trinity (8/2026) có số 4 (Grade 5), số 6 (Grade 6), số 12 (Grade 7). Không đề cương nào liệt kê Invention số 1 nên ''≈ Grade 6'' không có xác nhận chính thức; suy ra từ Invention số 6 (cùng mức Henle 3, Grade 6) là hợp lý nhưng vẫn là suy ra.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n15
  luot_2: dung
  nguon: []
  ghi_chu: Loại khuyen-tap. Tiêu chí hợp sư phạm phổ thông (chương trình thuộc lòng 20–30 phút từ ba thời kỳ; prelude và fugue Bach rõ bè; tự quyết ngón bấm, sắc thái, tốc độ và giải thích được). Không hại.
- trang: bat-dau/kiem-tra-dau-vao
  id: n16
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Số câu của khối ''placement'': 28 = 14 bài × 2 khớp số học với n20 (14 dòng @ ứng với bài nhạc lý 1–14), nhưng đếm thật phải làm trên khối câu hỏi của trang; tự tham chiếu, không có nguồn ngoài.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n17
  luot_2: dung
  nguon: []
  ghi_chu: 'Loại khuyen-tap. Ước lượng thời gian làm 28 câu trắc nghiệm có lựa chọn ''Tôi chưa biết'' (khoảng 10–20 giây mỗi câu): hợp lý, không hại. Chỉ kiểm được bằng cách tự làm thử và bấm giờ.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n18
  luot_2: khong-chac
  nguon: []
  ghi_chu: Loại 'so-lieu' nhưng thực chất là lời khuyên về cách dùng công cụ ('Tôi chưa biết' thay vì đoán thì kết quả chính xác hơn). Nguyên tắc chung của bài chẩn đoán xếp lớp là đoán may mắn làm sai lệch kết quả, nên hợp lý; nhưng 'chính xác hơn' phụ thuộc cách công cụ tính điểm ('Tôi chưa biết' có được tính như trả lời sai hay không), không có nguồn ngoài. Kiểm trên công cụ.
- trang: bat-dau/kiem-tra-dau-vao
  id: n19
  luot_2: khong-chac
  nguon: []
  ghi_chu: Hành vi của công cụ (gợi ý bài nên bắt đầu và lưu kết quả); tự tham chiếu, không có nguồn ngoài. Kiểm trên công cụ.
- trang: bat-dau/kiem-tra-dau-vao
  id: n20
  luot_2: khong-chac
  nguon: []
  ghi_chu: Câu kiểm tính nhất quán nội bộ (tên bài và đường dẫn ở 14 dòng @ của khối câu hỏi khớp bài nhạc lý 1–14); không có nguồn ngoài. Kiểm bằng đối chiếu tiêu đề và địa chỉ các trang nhạc lý 1–14 (kiểm thử liên kết của site).
- trang: bat-dau/kiem-tra-dau-vao
  id: n21
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  ghi_chu: 'OMT, Major Scales, mục từ ''fixed do'': do luôn là cao độ C, re là D, ... nên Sol = G; tên chữ A–G lặp theo vòng (OMT, Reading Clefs). F là Fa, A là La.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n22
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/aspn/
  - https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/
  ghi_chu: 'OMT, ASPN: ''Middle C is C4''. OMT, Keyboard and Grand Staff: middle C là nốt gần giữa bàn phím. Bàn phím gồm trọn quãng tám 1–7 và chỉ một phần nhỏ quãng tám 0 và 8 (OMT, ASPN) nên C4 không phải nốt Đô thấp nhất. C4 là tên một cao độ (ASPN), không phải tên hợp âm.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n23
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  ghi_chu: 'OMT, Reading Clefs: dòng của khóa Sol từ dưới lên là E–G–B–D–F; khóa Sol quấn quanh dòng G, dòng thứ hai từ dưới lên. Dòng 2 = Sol; Mi là dòng 1, Si là dòng 3.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n24
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  ghi_chu: 'OMT, Reading Clefs: dòng của khóa Fa từ dưới lên là G–B–D–F–A; dấu chấm của khóa Fa bắt đầu ở dòng F, dòng thứ hai từ trên xuống (dòng 4). Dòng 4 = Fa; Rê là dòng 3, La là dòng 5.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n25
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/
  ghi_chu: 'OMT, Notating Rhythm: nốt trắng (half note) là ''half the duration of a whole note, or the duration of two quarter notes'' (hai nốt đen).'
- trang: bat-dau/kiem-tra-dau-vao
  id: n26
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/
  ghi_chu: 'OMT, Notating Rhythm: dấu chấm tăng thêm một nửa độ dài; nốt đen chấm dôi = ba nốt móc đơn = 1½ phách khi đen = 1.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n27
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/
  ghi_chu: 'OMT, Simple Meter: ở nhịp đơn số trên là số phách mỗi ô, số dưới 4 nghĩa là nốt đen là một phách; ''A time signature is not a fraction'' (nên không phải 3/4 tốc độ). 3/4 = 3 phách, đen = 1 phách.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n28
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/
  ghi_chu: 'OMT, Compound Meter: 6/8 là nhịp ghép: ''each measure has two beats (6÷3=2)'', mỗi phách là nốt đen chấm dôi chia ba nốt móc đơn. Vậy cảm nhận thành 2 phách lớn.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n29
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  ghi_chu: 'OMT, Half Steps, Whole Steps, and Accidentals: E–F và B–C là nửa cung (không có phím đen xen giữa); các cặp có phím đen xen giữa (A–B, C–D, D–E, F–G, G–A) cách một cung. Vậy La–Si và Fa–Sol cách một cung.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n30
  luot_2: dung
  nguon:
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/5-pitch/
  ghi_chu: 'Fundamentals, Function, and Form (Mount), ch. 5 (Pitch): theo quy ước dấu hóa áp dụng cho ''all other noteheads appearing on that line or space for the remainder of the measure'' (hết ô nhịp), trừ khi bị dấu khác hủy. Các chương OMT tôi đọc không nêu quy tắc này.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n31
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: ''the last sharp (in this case the only sharp), F♯, is a half step below G ... the key signature of G major''. Sol trưởng có Fa♯.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n32
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales (bảng tên bậc): 1̂ tonic (chủ âm), 5̂ dominant (át âm), 7̂ leading tone (cảm âm). Bản dịch tiếng Việt theo thuat-ngu.yml (ngoài phạm vi lượt 2).'
- trang: bat-dau/kiem-tra-dau-vao
  id: n33
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  - https://thcsnguyenduq1.hcm.edu.vn/am-nhac/nhac-8-bai-3-tim-hieu-ve-giong-song-song-va-giong-cung-ten/ctmb/31062/80133
  - https://rdsic.edu.vn/blog/blog-3/giong-song-song-vi-cb.html
  ghi_chu: 'Thuật ngữ: OMT gọi A minor là ''relative minor'' của C major (cùng hóa biểu, tonic thấp hơn ba nửa cung) và C minor là ''parallel minor'' (cùng tonic). ''Giọng song song'' trong tiếng Việt chỉ cặp cùng hóa biểu (Đô trưởng – La thứ) còn ''giọng cùng tên'' chỉ cặp cùng chủ âm (hai trang giáo dục tiếng Việt đã mở nêu đúng định nghĩa này; chúng chỉ dùng để chứng thực cách gọi, không phải nguồn bậc 2). Nội dung câu đúng; chú ý ''song song'' tiếng Việt tương ứng ''relative'' của OMT, KHÔNG phải ''parallel'', nên thuat-ngu.yml nên ghi rõ đối ứng tiếng Anh để khỏi lẫn.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n34
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: 'OMT, Minor Scales: harmonic minor là ''like natural minor, but with a raised leading tone'' (ti thay te), tức nâng bậc 7; bậc 3 và 6 vẫn hạ so với trưởng.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n35
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: các giọng giáng theo thứ tự F, B♭, E♭, A♭, D♭, G♭, C♭ (1–7 dấu giáng); ''the second-to-last flat is the tonic'': 3 giáng (Si♭ Mi♭ La♭) là Mi♭ trưởng; La♭ trưởng có 4, Si♭ trưởng có 2.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n36
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: thứ tự dấu thăng là F, C, G, D, A, E, B; thứ tự dấu giáng ngược lại (B, E, A, D, G, C, F).'
- trang: bat-dau/kiem-tra-dau-vao
  id: n37
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals: quãng 1, 4, 5, 8 là ''perfect''; bảng số nửa cung (Ví dụ 16): 7 nửa cung = P5; C–G là P5 vì G thuộc gam C trưởng (phương pháp ''major scale'').'
- trang: bat-dau/kiem-tra-dau-vao
  id: n38
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, mục Intervallic Inversion: kích thước hai quãng đảo nhau cộng thành 9 (3+6) và major ↔ minor. Vậy 3 trưởng đảo thành 6 thứ.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n39
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: 'OMT, Triads: Rê–Fa–La có Rê–Fa là 3 thứ (3 nửa cung) và Rê–La là 5 đúng (7 nửa cung): triad thứ (minor: third thứ, fifth đúng).'
- trang: bat-dau/kiem-tra-dau-vao
  id: n40
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: 'OMT, Triads: trong giọng trưởng triad trên 1̂, 4̂, 5̂ là trưởng; trên 2̂, 3̂, 6̂ là thứ; trên 7̂ là giảm (superscript o). Vậy vii là hợp âm giảm.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n41
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/inversion/
  ghi_chu: 'OMT, Inversion: khi ''the third is in the bass'' là first inversion (thể đảo 1); Đô trưởng (C–E–G) với Mi ở bè trầm là C/E.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n42
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/
  ghi_chu: 'OMT, Seventh Chords: major triad + minor seventh = ''major-minor seventh chord (dominant seventh chord)''; Sol–Si–Rê–Fa là G7, xây trên 5̂ trong giọng trưởng. Không phải major seventh (ma7) hay minor seventh (mi7).'
- trang: bat-dau/kiem-tra-dau-vao
  id: n43
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/
  ghi_chu: 'OMT, Introduction to Harmony: IV (và ii) là ''strong predominants'', chuyển từ chủ sang át. FFF ch. 24: ii, IV là ''pre-dominant chords''; một số sách gọi vùng này là ''subdominant area''. Chức năng ''hạ át'' tương ứng nhóm predominant (trong OMT ''subdominant'' chỉ tên của bậc 4̂). IV không phải chức năng chủ hay át.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n44
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/
  ghi_chu: 'OMT, Introduction to Harmony, mục thuật ngữ ''tonic function'': ''vi and iii occasionally have tonic function''. FFF ch. 22, mục 22.7: vi là ''weak tonic substitute'' (kết lừa V7–vi); ch. 24: các hợp âm chức năng chủ thường gặp là I, iii, vi; V và vii° chức năng át; IV, ii chức năng hạ át/predominant. Lưu ý: ở văn bản chính của OMT, vi được xếp ''weak predominant'' (La in the Bass), nên ''có thể thay I'' chỉ nên giữ ở mức ''đôi khi'' như câu đã viết.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n45
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  ghi_chu: 'OMT, Introduction to Harmony: half cadence xảy ra khi câu kết ở V (''x–V''); authentic cadence là V–I (kết trọn); plagal là IV–I (OMT, Plagal Motion). Vậy kết ở V là kết nửa.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n46
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/la-in-the-bass/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/
  ghi_chu: 'OMT, La in the Bass: ''deceptive motion'': V chuẩn bị cho kết nhưng đi tới hòa âm không phải chủ, phổ biến nhất là V(7)–vi, ''avoids a cadence''. FFF ch. 22, mục 22.7: deceptive cadence là V7–vi. Không phải kết trọn (V–I) hay plagal (IV–I). OMT thích gọi ''deceptive motion'' hơn ''deceptive cadence''.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n47
  luot_2: dung
  nguon:
  - https://www.naxos.com/Glossary/ABC
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  ghi_chu: 'Naxos Glossary: ''Allegro (Italian: cheerful, lively) is generally taken to mean fast''. OMT, Other Aspects of Notation xếp allegro vào ''fast tempi''. Chậm là adagio/largo, thong thả là andante, ''to dần'' là crescendo.'
- trang: bat-dau/kiem-tra-dau-vao
  id: n48
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/Glossary/PQR
  ghi_chu: 'OMT, Other Aspects of Notation: ''The dynamic marking forte means loud, while piano means quiet''; p = piano. Naxos: ''Piano (Italian: soft) is generally represented by the letter p''. ''Ngắt ngắn'' là staccato.'
- trang: bat-dau/tom-tat
  id: n1
  luot_2: dung
  nguon:
  - https://support.google.com/chrome/answer/1069693?hl=en
  ghi_chu: 'Loại khuyen-tap. Phím tắt in của trình duyệt: Ctrl+P (Windows/Linux), Cmd+P (Mac) (Chrome Help, ''Print from Chrome''); chọn khổ A4 hợp với trang hai mặt A4.'
- trang: bat-dau/tom-tat
  id: n2
  luot_2: khong-chac
  nguon: []
  ghi_chu: Hành vi in của site (CSS in); không có nguồn ngoài. Kiểm bằng xem trước khi in ở Chromium, WebKit, Firefox hoặc kiểm thử của site.
- trang: bat-dau/tom-tat
  id: n3
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Nói về bố cục trang (hai mặt A4: mặt 1 đọc nhạc, mặt 2 nhạc lý), tự tham chiếu; không có nguồn ngoài. ''Toàn bộ kiến thức ... cơ bản'' là nói rộng, khó kiểm; đề nghị viết ''tóm tắt kiến thức cơ bản''.'
- trang: bat-dau/tom-tat
  id: n4
  luot_2: dung
  nguon: []
  ghi_chu: 'Loại khuyen-tap. Khớp cách site hoạt động theo AGENTS.md: khuông chỉ vẽ khi tới gần màn hình, in sớm thì chỗ khuông chưa vẽ in dòng nhắc; nên đợi khuông vẽ đủ. Không hại.'
- trang: bat-dau/tom-tat
  id: n5
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/
  - https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  - https://viva.pressbooks.pub/openmusictheory/chapter/aspn/
  ghi_chu: 'Đếm theo OMT: C3–C5 gồm 15 phím trắng (7+7+1) và 10 phím đen (5 mỗi quãng tám) xếp theo nhóm 2 rồi 3 (OMT, Keyboard and Grand Staff); Middle C = C4 (OMT, ASPN); các cặp nửa cung tự nhiên E–F và B–C xuất hiện 4 lần trong C3–C5 (E3–F3, B3–C4, E4–F4, B4–C5) (OMT, Half Steps). Chi tiết thiết kế (tô màu C4, ghi tên hai hệ) là mô tả hình, không kiểm được bằng nguồn.'
- trang: bat-dau/tom-tat
  id: n6
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Reading Clefs: tên cao độ là A B C D E F G lặp theo vòng; OMT, Major Scales, mục từ ''fixed do'': do luôn là C, re là D, ... Vậy Đô Rê Mi Fa Sol La Si = C D E F G A B (Si tương ứng ''ti'' trong OMT).'
- trang: bat-dau/tom-tat
  id: n7
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/
  ghi_chu: 'OMT, Keyboard and Grand Staff: ''when the black keys appear as a set of two, the note to their immediate left is C''.'
- trang: bat-dau/tom-tat
  id: n8
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  ghi_chu: 'OMT, Half Steps, Whole Steps, and Accidentals: ''each key on the piano keyboard has more than one name''; C♯ và D♭ là tương đương enharmonic (cùng một phím đen).'
- trang: bat-dau/tom-tat
  id: n9
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  ghi_chu: 'OMT, Half Steps, Whole Steps, and Accidentals: ''Two pairs of white keys—E/F and B/C—do not have black keys in between them ... both half steps''.'
- trang: bat-dau/tom-tat
  id: n10
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  ghi_chu: 'OMT, Reading Clefs: dòng khóa Sol từ dưới lên E, G, B, D, F (''Every Good Bird Does Fly''); các khe F, A, C, E (''face'').'
- trang: bat-dau/tom-tat
  id: n11
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  - https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
  ghi_chu: 'OMT, Reading Clefs: khóa Sol ''wraps around the G line (the second line from the bottom)''; OMT, Notation of Notes: khóa Sol ''designates the second-lowest line of a staff as G₄''.'
- trang: bat-dau/tom-tat
  id: n12
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  ghi_chu: 'OMT, Reading Clefs: dòng khóa Fa từ dưới lên G, B, D, F, A (''Good Bikes Don''t Fall Apart''); các khe A, C, E, G (''All Cows Eat Grass'').'
- trang: bat-dau/tom-tat
  id: n13
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
  - https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
  ghi_chu: 'OMT, Reading Clefs: dấu chấm của khóa Fa ''begins on the F line (the second line from the top)'', tức dòng 4; OMT, Notation of Notes: khóa Fa ''shows which line of the staff is F₃ by surrounding it with two dots''.'
- trang: bat-dau/tom-tat
  id: n14
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/
  - https://viva.pressbooks.pub/openmusictheory/chapter/aspn/
  ghi_chu: 'OMT, Keyboard and Grand Staff và ASPN (mục từ ''middle C''): ''C₄; ... written on the first ledger line below the treble clef staff or the first ledger line above the bass clef staff''.'
- trang: bat-dau/tom-tat
  id: n15
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/
  ghi_chu: 'OMT, Notating Rhythm: nốt tròn = 2 trắng = 4 đen = 8 móc đơn; thêm một móc thì giá trị giảm nửa (móc đơn = ½ đen, móc kép = ¼ đen); nốt đen chấm dôi bằng ba nốt móc đơn (1½ đen); mỗi giá trị nốt có dấu lặng tương ứng (''Each hierarchical note value has a corresponding rest value'').'
- trang: bat-dau/tom-tat
  id: n16
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/
  ghi_chu: 'OMT, Notating Rhythm: ''A dot ... increases its duration by half''.'
- trang: bat-dau/tom-tat
  id: n17
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/notating-rhythm/
  ghi_chu: 'OMT, Notating Rhythm: ''A tie is a curved line that connects two or more notes with the same pitch ... used to combine the durations''.'
- trang: bat-dau/tom-tat
  id: n18
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/
  ghi_chu: 'OMT, Half Steps, Whole Steps, and Accidentals: dấu thăng nâng nửa cung, dấu giáng hạ nửa cung, dấu bình ''cancels a previous accidental such as a sharp or flat''.'
- trang: bat-dau/tom-tat
  id: n19
  luot_2: dung
  nguon:
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/5-pitch/
  ghi_chu: 'Fundamentals, Function, and Form (Mount), ch. 5 (Pitch): dấu hóa áp dụng cho ''all other noteheads appearing on that line or space for the remainder of the measure'' trừ khi bị dấu khác hủy. Các chương OMT tôi đọc không nêu quy tắc này.'
- trang: bat-dau/tom-tat
  id: n20
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/
  - https://viva.pressbooks.pub/openmusictheory/chapter/hypermeter/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/1-introduction-to-rhythm-and-meter-2/
  ghi_chu: 'OMT, Simple Meter: 2/4 là nhịp đơn hai phách, số dưới 4 = đen là một phách; phách 1 (downbeat) ''has more weight''. OMT, Hypermeter: downbeat là phách mạnh nhất của ô. FFF ch. 1: duple = strong–weak.'
- trang: bat-dau/tom-tat
  id: n21
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/
  - https://viva.pressbooks.pub/openmusictheory/chapter/hypermeter2/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/1-introduction-to-rhythm-and-meter-2/
  - https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/19%3A_Syncopated_Subdivisions/19.02%3A_Natural_Stress_in_Meter
  ghi_chu: 'OMT, Simple Meter: 3/4 là simple triple (3 phách, đen = 1 phách); ví dụ Minuet K.2 của Mozart ở nhịp đơn ba. FFF ch. 1: triple meter = strong–weak–weak, ví dụ minh họa là một điệu waltz (Greenwood, The Waldemere Waltzes). OMT, Hypermeter (new version) dùng Harmony Club Waltz của Joplin ''as notated'' ở nhịp đơn ba. Sierra College: simple triple = strong, weak, weak.'
- trang: bat-dau/tom-tat
  id: n22
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/
  - https://viva.pressbooks.pub/openmusictheory/chapter/hypermeter/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/1-introduction-to-rhythm-and-meter-2/
  - https://human.libretexts.org/Courses/Sierra_College/Equipping_the_Musical_Ear/19%3A_Syncopated_Subdivisions/19.02%3A_Natural_Stress_in_Meter
  - https://odp.library.tamu.edu/stepstomusictheory/chapter/more-rhythm-meter/
  ghi_chu: 'OMT, Simple Meter: common time (C) = 4/4, simple quadruple, 4 phách; phách 1 mạnh nhất (OMT, Hypermeter). FFF ch. 1: ''The first beat of each group is generally the strongest. The third is also strong, but not quite as strong as the first. Beats two and four are relatively weak'' tức MẠNH–nhẹ–vừa–nhẹ. Cùng ý: Sierra College (phách 3 ''secondary strong'') và Steps to Music Theory (''beat 3 is weaker than the downbeat but stronger than beats 2 and 4''). Các chương OMT tôi đọc không nêu riêng phách 3.'
- trang: bat-dau/tom-tat
  id: n23
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/
  ghi_chu: 'OMT, Compound Meter: 6/8 là nhịp ghép hai: ''each measure has two beats (6÷3=2)'', mỗi phách là nốt đen chấm dôi chia thành ba nốt móc đơn.'
- trang: bat-dau/tom-tat
  id: n24
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/
  - https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/
  ghi_chu: 'OMT, Simple Meter: số trên là số phách mỗi ô, số dưới là nốt làm một phách (4 = đen). OMT, Compound Meter: ở nhịp ghép số trên là số phần chia mỗi ô, số dưới là nốt làm một phần chia (8 = móc đơn); 6/8 có 2 phách, mỗi phách là đen chấm dôi gồm ba móc đơn.'
- trang: bat-dau/tom-tat
  id: n25
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: thang trưởng bắt đầu và kết thúc ở nốt cùng tên cách một quãng tám; bậc 1̂–7̂ rồi lại 1̂. C major gồm C D E F G A B C (Đô Rê Mi Fa Sol La Si Đô, fixed do).'
- trang: bat-dau/tom-tat
  id: n26
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: W–W–H–W–W–W–H (W = whole step = cung, H = half step = nửa cung) tức C C N C C C N.'
- trang: bat-dau/tom-tat
  id: n27
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: 'OMT, Minor Scales: natural minor là W–H–W–W–H–W–W tức C N C C N C C.'
- trang: bat-dau/tom-tat
  id: n28
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: 'OMT, Minor Scales: harmonic minor là W–H–W–W–H–3Hs–H, ''like natural minor, but with a raised leading tone'' (ti thay te): nâng bậc 7.'
- trang: bat-dau/tom-tat
  id: n29
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: 'OMT, Minor Scales: melodic minor đi lên W–H–W–W–W–W–H (le–te, tức bậc 6–7, thành la–ti: nâng bậc 6 và 7); đi xuống trở về thứ tự nhiên. Câu chỉ nêu chiều đi lên (đúng, nhưng chưa nói chiều xuống).'
- trang: bat-dau/tom-tat
  id: n30
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales (bảng tên bậc): 1̂ tonic, 4̂ subdominant, 5̂ dominant, 7̂ leading tone. Bản dịch tiếng Việt (chủ âm, hạ át âm, át âm, cảm âm) theo thuat-ngu.yml (ngoài phạm vi lượt 2).'
- trang: bat-dau/tom-tat
  id: n31
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: ''The order of sharps is always F, C, G, D, A, E, B''.'
- trang: bat-dau/tom-tat
  id: n32
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: ''The order of the flats is the opposite of the order of the sharps: B, E, A, D, G, C, F''.'
- trang: bat-dau/tom-tat
  id: n33
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: ''In sharp key signatures, the last sharp is a half step below the tonic'' nên chủ âm = dấu thăng cuối + nửa cung (ví dụ 1♯: Fa♯ + nửa cung = Sol trưởng).'
- trang: bat-dau/tom-tat
  id: n34
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: ''In flat key signatures, the second-to-last flat is the tonic''; Fa trưởng (một dấu giáng B♭) là ngoại lệ phải nhớ riêng.'
- trang: bat-dau/tom-tat
  id: n35
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  - https://thcsnguyenduq1.hcm.edu.vn/am-nhac/nhac-8-bai-3-tim-hieu-ve-giong-song-song-va-giong-cung-ten/ctmb/31062/80133
  - https://rdsic.edu.vn/blog/blog-3/giong-song-song-vi-cb.html
  ghi_chu: 'OMT, Minor Scales: ''The tonic of a minor key is always three half steps below the tonic of its relative major'' (C → A). Thuật ngữ: OMT gọi A minor là ''relative minor'' của C major (cùng hóa biểu, tonic thấp hơn ba nửa cung) và C minor là ''parallel minor'' (cùng tonic). ''Giọng song song'' trong tiếng Việt chỉ cặp cùng hóa biểu (Đô trưởng – La thứ) còn ''giọng cùng tên'' chỉ cặp cùng chủ âm (hai trang giáo dục tiếng Việt đã mở nêu đúng định nghĩa này; chúng chỉ dùng để chứng thực cách gọi, không phải nguồn bậc 2). Nội dung câu đúng; chú ý ''song song'' tiếng Việt tương ứng ''relative'' của OMT, KHÔNG phải ''parallel'', nên thuat-ngu.yml nên ghi rõ đối ứng tiếng Anh để khỏi lẫn.'
- trang: bat-dau/tom-tat
  id: n36
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Minor Scales (vòng quãng năm cho giọng trưởng và thứ): giọng trưởng chữ hoa ở vòng ngoài, giọng thứ chữ thường ở vòng trong, xếp theo số dấu hóa; từ C theo chiều kim đồng hồ thêm thăng, ngược chiều thêm giáng. Tôi tự đối chiếu: các giọng trưởng C, G, D, A, E, B, F♯/G♭, D♭, A♭, E♭, B♭, F với số dấu 0, 1♯ ... 5♯, 6♯/6♭, 5♭ ... 1♭ khớp các hóa biểu OMT liệt kê (Major Scales); giọng thứ song song tính bằng quy tắc ''ba nửa cung dưới'' cho a, e, b, f♯, c♯, g♯, d♯/e♭, b♭, f, c, g, d: khớp. Thuật ngữ ''song song'' = relative của OMT (xem n35).'
- trang: bat-dau/tom-tat
  id: n37
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: 'OMT, Major Scales, mục The Circle of Fifths: ''If you continue clockwise, sharp key signatures appear, each subsequent key signature adding one more sharp''; ngược chiều từ C thì thêm giáng; ''each key signature is a fifth away from the ones on either side''. ''Ngược chiều thêm một ♭'' đúng khi tính số dấu có dấu (từ giọng thăng đi ngược chiều thì bớt một ♯).'
- trang: bat-dau/tom-tat
  id: n38
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: 'OMT, Major Scales: trên vòng quãng năm mỗi bước thêm một dấu thăng hoặc một dấu giáng, nên hai giọng kề nhau hơn kém đúng một dấu hóa.'
- trang: bat-dau/tom-tat
  id: n39
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16 (bảng số nửa cung): 1 nửa cung = mi2 (thứ), 2 = ma2 (trưởng). Từ C: C–D♭ (2 thứ), C–D (2 trưởng).'
- trang: bat-dau/tom-tat
  id: n40
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16: 3 nửa cung = mi3, 4 = ma3. Từ C: C–E♭ (3 thứ), C–E (3 trưởng).'
- trang: bat-dau/tom-tat
  id: n41
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16: 5 nửa cung = P4. Từ C: C–F.'
- trang: bat-dau/tom-tat
  id: n42
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16: 6 nửa cung = A4 = d5 (''an augmented fourth (A4) and diminished fifth (d5) are enharmonically equivalent—both are six half steps''). Từ C: Fa♯ (A4) và Sol♭ (d5), cùng một phím.'
- trang: bat-dau/tom-tat
  id: n43
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16: 7 nửa cung = P5. Từ C: C–G.'
- trang: bat-dau/tom-tat
  id: n44
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16: 8 nửa cung = mi6, 9 = ma6. Từ C: C–A♭ (6 thứ), C–A (6 trưởng).'
- trang: bat-dau/tom-tat
  id: n45
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16: 10 nửa cung = mi7, 11 = ma7. Từ C: C–B♭ (7 thứ), C–B (7 trưởng).'
- trang: bat-dau/tom-tat
  id: n46
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, Ví dụ 16: 12 nửa cung = P8. Từ C: C–C.'
- trang: bat-dau/tom-tat
  id: n47
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Intervals, mục Intervallic Inversion: kích thước hai quãng đảo nhau cộng thành 9; perfect → perfect, major ↔ minor, augmented ↔ diminished.'
- trang: bat-dau/tom-tat
  id: n48
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'OMT, Triads: major = 3 trưởng + 5 đúng; minor = 3 thứ + 5 đúng; diminished = 3 thứ + 5 giảm; augmented = 3 trưởng + 5 tăng. Từ C: C–E–G, C–E♭–G, C–E♭–G♭, C–E–G♯. Cách ghi ''3T+3t'' (tầng ba trưởng rồi ba thứ) tôi tính từ bảng nửa cung của OMT, Intervals (3 trưởng = 4, 3 thứ = 3, 5 đúng = 7, 5 giảm = 6, 5 tăng = 8): trưởng 4+3, thứ 3+4, giảm 3+3, tăng 4+4: đúng.'
- trang: bat-dau/tom-tat
  id: n49
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  - https://viva.pressbooks.pub/openmusictheory/chapter/roman-numerals/
  ghi_chu: 'OMT, Triads: trong giọng trưởng triad trên 1̂, 4̂, 5̂ trưởng; 2̂, 3̂, 6̂ thứ; 7̂ giảm. OMT, Roman Numerals: chữ hoa = trưởng, chữ thường = thứ, chữ thường + o (°) = giảm.'
- trang: bat-dau/tom-tat
  id: n50
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/
  - https://viva.pressbooks.pub/openmusictheory/chapter/roman-numerals/
  ghi_chu: 'OMT, Seventh Chords: ''major-minor seventh chord (dominant seventh chord)'' = major triad + minor seventh; OMT, Roman Numerals: dominant seventh ở V7.'
- trang: bat-dau/tom-tat
  id: n51
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/
  ghi_chu: 'OMT, Introduction to Harmony: chức năng chủ là I (i); mục thuật ngữ ''tonic function'': ''vi and iii occasionally have tonic function''. FFF ch. 24: hợp âm chức năng chủ thường gặp là I, iii, vi; ch. 22 mục 22.7: vi là ''weak tonic substitute''. Chữ ''đôi khi'' trong câu khớp; văn bản chính của OMT xếp vi là ''weak predominant'' (La in the Bass).'
- trang: bat-dau/tom-tat
  id: n52
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/
  ghi_chu: 'OMT, Introduction to Harmony: predominant là chức năng ''transition away from tonic function toward dominant function''; ''strong predominants'' là IV và ii. FFF ch. 24: ii, IV là ''pre-dominant chords''. Thuật ngữ: OMT dùng ''predominant''; ''hạ át'' (subdominant function) là cách gọi truyền thống cho cùng nhóm, còn ''subdominant'' trong OMT chỉ tên bậc 4̂.'
- trang: bat-dau/tom-tat
  id: n53
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/
  - https://viva.pressbooks.pub/openmusictheory/chapter/strengthening-endings-with-v7/
  ghi_chu: 'OMT, Introduction to Harmony: dominant (D): V và vii° (''a sense of urgency to resolve toward the tonic chord''). V7 là V thêm bảy thứ (OMT, Strengthening Endings with V7). FFF ch. 22: vii° là ''weak dominant substitute''.'
- trang: bat-dau/tom-tat
  id: n54
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/
  ghi_chu: 'OMT, Introduction to Harmony: authentic cadence là V–I (perfect khi cả hai thể gốc và 1̂ ở bè trên). FFF ch. 22: dominant → tonic. ''Kết trọn'' = authentic cadence (tên tiếng Việt theo thuat-ngu.yml, ngoài phạm vi lượt 2).'
- trang: bat-dau/tom-tat
  id: n55
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/
  ghi_chu: 'OMT, Introduction to Harmony: half cadence là câu kết ở V (''x–V''). FFF ch. 22 mục 22.6: half cadence = nửa đầu của authentic cadence.'
- trang: bat-dau/tom-tat
  id: n56
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/plagal-motion/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/24-the-pre-dominant-function/
  ghi_chu: 'OMT, Plagal Motion: (IV)–I; OMT dùng ''plagal motion'' thay vì ''plagal cadence'' vì trong nhạc thế kỷ 18 (IV)–I thường kéo dài chủ âm sau PAC hay ở đầu câu, nhưng thừa nhận có trường hợp (IV)–I thật sự kết câu. FFF ch. 24 mục 24.5: ''plagal cadence'' = IV về thẳng I ở cuối câu (cũng gọi amen cadence). Câu ''Kết plagal: IV → I'' đúng theo FFF; muốn bám OMT thì thêm ''thường kéo dài chủ âm''.'
- trang: bat-dau/tom-tat
  id: n57
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/la-in-the-bass/
  - https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/22-phrases-cadences-and-harmonic-function/
  ghi_chu: 'OMT, La in the Bass: ''deceptive motion'' phổ biến nhất khi V(7) đi tới vi thay vì I, ''avoids a cadence'' (tránh kết). FFF ch. 22 mục 22.7: deceptive cadence = V7–vi. OMT thích ''deceptive motion'' hơn ''deceptive cadence''.'
- trang: bat-dau/tom-tat
  id: n58
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/Glossary/JKL
  - https://www.naxos.com/Glossary/ABC
  - https://www.naxos.com/Glossary/MNO
  - https://www.naxos.com/Glossary/PQR
  ghi_chu: 'OMT, Other Aspects of Notation, Ví dụ 8 (chú thích hình): ''Tempi are listed on a line from slowest to fastest: Grave, Lento, Largo, Adagio, Andante, Moderato, Allegretto, Allegro, Vivace, Presto'' nên Largo < Adagio < Andante < Moderato < Allegro < Presto. Naxos Glossary: Largo (broad, slow), Adagio (slow), Andante (walking pace), Moderato (moderate), Allegro (fast, ''not as fast as vivace or presto''), Presto (fast).'
- trang: bat-dau/tom-tat
  id: n59
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/Glossary/PQR
  - https://www.naxos.com/Glossary/ABC
  ghi_chu: 'OMT, Other Aspects of Notation: ritardando (rit.) là giảm dần tốc độ, accelerando (accel.) tăng dần, ''a tempo'' trở về tốc độ gốc. Naxos: Ritardando ''becoming slower'', Accelerando ''becoming faster''.'
- trang: bat-dau/tom-tat
  id: n60
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/Glossary/PQR
  - https://www.naxos.com/Glossary/DEF
  ghi_chu: 'OMT, Other Aspects of Notation: ppp, pp, p, mp, mf, f, ff, fff ''arranged from quietest to loudest'' (ví dụ 1); p = piano, f = forte. Naxos: Piano ''soft'', Forte ''loud'', thêm chữ thì mạnh/nhẹ hơn. Thứ tự pp < p < mp < mf < f < ff đúng.'
- trang: bat-dau/tom-tat
  id: n61
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/Glossary/ABC
  - https://www.naxos.com/Glossary/DEF
  ghi_chu: 'OMT, Other Aspects of Notation: crescendo (cresc.) to dần; decrescendo/diminuendo (dim.) nhỏ dần; sfz, sf, fz (sforzando...) là dấu nhấn ''usually interpreted to be slightly more forceful (i.e., louder) than regular accents''. Naxos: Crescendo ''becoming louder'', Diminuendo ''becoming less''. OMT không nói ''đột ngột'' cho sfz, nhưng sforzando thường được định nghĩa là nhấn mạnh đột ngột (không có nguồn mở được trong lượt này).'
- trang: bat-dau/tom-tat
  id: n62
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/Glossary/JKL
  ghi_chu: 'OMT, Other Aspects of Notation: staccato = ''more separated, leaving space between notes''; legato = ''smoothly or connected''; fermata = ''hold a note longer than its regular duration''. Naxos: Legato (smooth), đối lập với staccato (rút ngắn và tách nốt).'
- trang: bat-dau/tom-tat
  id: n63
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/Glossary/DEF
  ghi_chu: 'OMT, Other Aspects of Notation: ''D.C. al Fine ... play or sing a work from the beginning until one sees D.C. al Fine. You then go back to the beginning, and play or sing until the Fine'' (Fine = chỗ kết thúc). Naxos: Da capo (Italian: from the beginning), da capo al fine.'
- trang: bat-dau/lo-trinh-choi
  id: n1
  luot_2: dung
  nguon: []
  ghi_chu: Khuyến nghị 20–30 phút mỗi ngày cho người lớn mới học, tăng dần lên khoảng 30 phút, 5–6 ngày mỗi tuần, hợp lẽ thường của sư phạm piano; không có nguy cơ gì.
- trang: bat-dau/lo-trinh-choi
  id: n2
  luot_2: dung
  nguon:
  - https://www.abrsm.org/sites/default/files/2023-09/piano-2021-2022-syllabus-rev-sep-2020-final.pdf
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
  - https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf
  - https://www.henle.de/en/Album-for-the-Young-op.-68/HN-45
  - https://www.henle.de/Notebook-for-Anna-Magdalena-Bach/HN-349
  ghi_chu: 'Khoảng Grade 1–2 là hợp lý. Đề cương ABRSM: Schumann Melodie (Op. 68 số 1) Grade 1 (2021–22); L. Mozart Minuet in F (Nannerl-Notenbuch) Grade 1 (2025–28); Petzold Minuet No. 2 in G minor Grade 2 (2027–28); nhưng Wilder Reiter (Op. 68 số 8) và Tchaikovsky Chanson italienne (Op. 39 số 15) ở Grade 3. Henle: Melodie mức 2, Wilder Reiter và Fröhlicher Landmann mức 3, các Menuet BWV Anh. 114/115 và Musette BWV Anh. 126 mức 1. Dải thực tế của các bài nêu tên là Grade 1–3, nên giữ chữ "khoảng".'
- trang: bat-dau/lo-trinh-choi
  id: n3
  luot_2: dung
  nguon: []
  ghi_chu: Lời khuyên hợp lý; điều kiện "đều đặn và tay không đau" đúng nguyên tắc an toàn.
- trang: bat-dau/lo-trinh-choi
  id: n4
  luot_2: dung
  nguon: []
  ghi_chu: Cơ cấu buổi tập 30 phút (khởi động, kỹ thuật, bài đang học làm đoạn khó trước, đọc nốt/thị tấu, ghi nhật ký) phù hợp sư phạm phổ biến; 10 phút ngoài giờ cho lý thuyết, luyện tai và nghe là hợp lý.
- trang: bat-dau/lo-trinh-choi
  id: n5
  luot_2: dung
  nguon: []
  ghi_chu: 'Chuẩn bị đàn, ghế, máy đếm nhịp, thu âm; đọc trước tư thế và cách tập; quyết định học với thầy hay tự học: đều là bước chuẩn bị chuẩn.'
- trang: bat-dau/lo-trinh-choi
  id: n6
  luot_2: dung
  nguon: []
  ghi_chu: Kế hoạch tháng 1 hợp lý cho người mới (tư thế, Đô giữa, thế Đô trước, rồi các bài đầu); ♩ = 72 cho bài 1–3 là tốc độ vừa phải; tiêu chí 9/10 nốt khóa Sol và nhận phím Đô/Fa nhanh là cụ thể, kiểm được.
- trang: bat-dau/lo-trinh-choi
  id: n7
  luot_2: dung
  nguon:
  - https://www.henle.de/en/The-Well-Tempered-Clavier-Part-I-BWV-846-869/HN-14
  - https://www.henle.de/Notebook-for-Anna-Magdalena-Bach/HN-349
  - https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)
  ghi_chu: Prelude Đô trưởng là BWV 846 (Das wohltemperierte Klavier I). Henle xếp mức 1 (dễ nhất) cho Prelude này (cả trong HN 14 lẫn trong Notebook for Anna Magdalena Bach, HN 349), nên "đến chặng 4 sẽ chơi được" là ước lượng thận trọng, không mâu thuẫn; độ khó của bài nằm ở nhạc cảm hơn là kỹ thuật.
- trang: bat-dau/lo-trinh-choi
  id: n8
  luot_2: dung
  nguon: []
  ghi_chu: Kế hoạch tháng 2 hợp lý. Đổi hợp âm Đô–Mi–Sol ↔ Si–Fa–Sol (thế tay trái của I và V7 lược quãng năm) không nhìn tay là thế tay thông dụng cho người mới; 9/10 nốt khóa Fa cùng chuẩn với khóa Sol ở tháng 1.
- trang: bat-dau/lo-trinh-choi
  id: n9
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331%2F300i_(Mozart,_Wolfgang_Amadeus)
  - https://www.henle.de/us/Piano-Sonata-A-major-K.-331-Alla-Turca/HN-1300
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
  ghi_chu: 'IMSLP: Sonata số 11 La trưởng K. 331/300i có 3 chương: Tema con variazione, Menuetto & trio, Alla Turca. Henle ghi "Piano Sonata (Alla Turca) A major K. 331 (300i)"; đề cương ABRSM ghi "Alla Turca (3rd movt from Sonata in A, K. 331)".'
- trang: bat-dau/lo-trinh-choi
  id: n10
  luot_2: dung
  nguon: []
  ghi_chu: Kế hoạch tháng 3 hợp lý (nhịp 3/4, 6/8; gam Đô trưởng một quãng tám, tay riêng rồi hai tay).
- trang: bat-dau/lo-trinh-choi
  id: n11
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'Tiêu chí kiểm tra cụ thể và hợp lý. Tên quãng "3 trưởng, 5 đúng, 8 đúng" hợp lệ: OMT (Intervals) nêu quãng một/bốn/năm/tám là đúng (perfect), quãng hai/ba/sáu/bảy là trưởng hoặc thứ.'
- trang: bat-dau/lo-trinh-choi
  id: n12
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: Quãng ba trưởng, năm đúng, tám đúng là các tên quãng chuẩn (OMT, Intervals); luyện nhận ra ba quãng này ở tháng 3 là mức vừa sức.
- trang: bat-dau/lo-trinh-choi
  id: n13
  luot_2: dung
  nguon: []
  ghi_chu: 'Kế hoạch tháng 4 hợp lý: bàn đạp nối (legato pedaling) giới thiệu ở bài đầu có bàn đạp, thị tấu mỗi ngày ba giai điệu dễ, hóa biểu đến 2 dấu hóa.'
- trang: bat-dau/lo-trinh-choi
  id: n14
  luot_2: dung
  nguon: []
  ghi_chu: 'Kế hoạch tháng 5 hợp lý: chuỗi I–IV–I–V7–I ở Đô, Sol, Fa; chơi theo tai (Ode to Joy) và đệm bằng I, IV, V; chọn ba bài làm "tiết mục" và chơi cho một người nghe là thực hành tốt.'
- trang: bat-dau/lo-trinh-choi
  id: n15
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)
  - https://commons.wikimedia.org/wiki/File:IMSLP532968-PMLP357193-Pezold-BWV114a.pdf
  ghi_chu: 'Minuet in G major BWV Anh. 114 (Christian Petzold; IMSLP ghi "Pezold") trong Notebook for Anna Magdalena Bach. Bản in Bach-Gesellschaft 1894 (IMSLP, bản quét trên Wikimedia Commons): hai khuông, tay phải là giai điệu, tay trái là bè bass; chỉ thêm vài quãng hoặc hợp âm ở một số chỗ, nên nói "bản gốc hai bè" là đúng về cơ bản (bản chuyển soạn dày hơn thì thêm bè đệm).'
- trang: bat-dau/lo-trinh-choi
  id: n16
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Album_f%C3%BCr_die_Jugend,_Op.68_(Schumann,_Robert)
  - https://www.henle.de/en/Album-for-the-Young-op.-68/HN-45
  - https://www.abrsm.org/sites/default/files/2023-09/piano-2021-2022-syllabus-rev-sep-2020-final.pdf
  ghi_chu: Melodie là số 1 của Album für die Jugend Op. 68 (IMSLP). Henle mức 2; ABRSM Grade 1 (2021–22).
- trang: bat-dau/lo-trinh-choi
  id: n17
  luot_2: dung
  nguon: []
  ghi_chu: 'Kế hoạch tháng 6 hợp lý: gam hai quãng tám tay riêng; tiêu chí chơi trọn Minuet Sol trưởng hai tay, đọc nhạc hai khóa, nhật ký đủ 100 ngày tập (khoảng 6 tháng) là đo được.'
- trang: bat-dau/lo-trinh-choi
  id: n18
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Goldberg_Variations,_BWV_988_(Bach,_Johann_Sebastian)
  ghi_chu: 'IMSLP: Goldberg Variations BWV 988 gồm Aria và 30 biến tấu; "Aria và vài biến tấu đầu" đúng cấu trúc tác phẩm (đây là gợi ý để nghe).'
- trang: bat-dau/lo-trinh-choi
  id: n19
  luot_2: dung
  nguon: []
  ghi_chu: 'Nhất quán với "khoảng chặng 2 ở cuối năm đầu" (n35): chặng 1 xong ở tháng 6.'
- trang: bat-dau/lo-trinh-choi
  id: n20
  luot_2: dung
  nguon:
