  luot_2: khong-chac
  nguon: []
  ghi_chu: Nói về nội dung trang Hỏi đáp của site; tự tham chiếu, không có nguồn ngoài để kiểm; cần đối chiếu với trang đích.
- trang: bat-dau/bai-0
  id: n8
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/16839723/
  - https://pubmed.ncbi.nlm.nih.gov/18815249/
  ghi_chu: 'Nhận định chung phù hợp sư phạm âm nhạc. Bằng chứng gián tiếp: người không học nhạc luyện phân biệt cao độ thì ngưỡng giảm mạnh, 4–8 giờ luyện đưa họ tới ngưỡng của nhạc sĩ cổ điển (Micheyl et al. 2006, Hearing Research); người lớn không chuyên học chơi một chuỗi nốt trên piano trong 2 tuần có thay đổi vỏ não tương ứng (Lappe et al. 2008, J Neurosci). Không có nghiên cứu riêng về ''đọc nhạc'' và ''giữ nhịp'' trong các nguồn tôi mở, nhưng không có gì trái với câu.'
- trang: bat-dau/bai-0
  id: n9
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/16412412/
  - https://pubmed.ncbi.nlm.nih.gov/11089410/
  - https://pubmed.ncbi.nlm.nih.gov/10931776/
  ghi_chu: 'Bigand & Poulin-Charronnat 2006 (Cognition, tổng quan): một số năng lực xử lý nhạc phương Tây ''are acquired through exposure to music without the help of explicit training''; người nghe không học nhạc phản ứng như ''musically experienced listeners''. Tillmann, Bharucha & Bigand 2000: kiến thức ngầm về cấu trúc điệu tính hình thành từ ''mere exposure'' (mô hình tính toán). Koelsch et al. 2000: người ''không chuyên'' có phản ứng não với hợp âm vi phạm kỳ vọng hòa âm. ''Hàng nghìn bài hát'' là cách nói ví von.'
- trang: bat-dau/bai-0
  id: n10
  luot_2: dung
  nguon: []
  ghi_chu: 'Lời khuyên tập: phiên ngắn, đều, có mục tiêu thay vì dồn vào cuối tuần; phù hợp quan điểm sư phạm phổ biến (tập phân bố). Không hại.'
- trang: bat-dau/bai-0
  id: n11
  luot_2: khong-chac
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/12123620/
  - https://pubmed.ncbi.nlm.nih.gov/25822130/
  ghi_chu: 'Nguồn không thống nhất. Walker et al. 2002 (Neuron): một đêm ngủ làm tốc độ gõ chuỗi ngón tăng 20%, cùng thời gian thức thì không. Nhưng Pan & Rickard 2015 (Psychological Bulletin, phân tích gộp 34 bài, 1.296 người): khi tính các biến gây nhiễu thì ''không có bằng chứng giấc ngủ làm tăng học vận động'' và vai trò của giấc ngủ ''không thể kết luận''. ''Một phần lớn'' cũng không định lượng được. Đề nghị viết bớt chắc chắn, ví dụ ''kỹ năng vận động vẫn tiếp tục được củng cố sau buổi tập'', hoặc chuyển thành lời khuyên (tập đều, ngủ đủ).'
- trang: bat-dau/bai-0
  id: n12
  luot_2: dung
  nguon: []
  ghi_chu: 'Lời khuyên luyện tai: ngân nga hay hát theo giai điệu là cách phổ biến (solfège, audiation). ''Tốt nhất'' là so sánh tuyệt đối không có nguồn; nên viết bớt chắc chắn (ví dụ ''một công cụ rất hiệu quả''). Không hại.'
- trang: bat-dau/bai-0
  id: n13
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/16597781/
  - https://pubmed.ncbi.nlm.nih.gov/16597772/
  - https://pubmed.ncbi.nlm.nih.gov/28224991/
  - https://pubmed.ncbi.nlm.nih.gov/17348539/
  ghi_chu: 'Gần 17% sinh viên tự nhận ''điếc nhạc'' (Cuddy et al. 2005) trong khi amusia bẩm sinh thật chỉ khoảng 1,5% (Peretz & Vuvan 2017, mẫu 20.000 người; ước tính cũ 4%), nên phần lớn người tự nhận không có khiếm khuyết nhận biết cao độ thật. Sloboda, Wise & Peretz 2005: nhiều người có thần kinh bình thường tự cho là ''không có năng khiếu'' vì tiêu chí hát/biểu diễn; thiếu các điều kiện cá nhân, xã hội, môi trường có thể dẫn đến thiếu thành tựu âm nhạc. Dalla Bella et al. 2007: chỉ thiểu số người hát nghiệp dư sai cao độ nhiều, hát chậm thì hầu hết chính xác như người chuyên. ''Chỉ chưa được luyện'' là cách nói gọn của ''thiếu trải nghiệm/huấn luyện''; một số ít có khó khăn thuần về phát thanh vận động (Dalla Bella 2007).'
- trang: bat-dau/bai-0
  id: n14
  luot_2: khong-chac
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/16839723/
  - https://pubmed.ncbi.nlm.nih.gov/20567521/
  - https://pubmed.ncbi.nlm.nih.gov/28224991/
  ghi_chu: 'Vế ''nghe cao độ'' được ủng hộ: người không học nhạc luyện phân biệt cao độ thì ngưỡng giảm, 4–8 giờ là đạt mức nhạc sĩ cổ điển (Micheyl et al. 2006). Vế ''hát đúng cao độ nhờ luyện tai'' thì không: Zarate et al. 2010 (PLoS ONE) luyện phân biệt vi giai điệu làm nghe tốt hơn nhưng độ chính xác khi hát không đổi; kết luận ''perceptual discrimination training alone is not sufficient to improve vocal accuracy''. Với amusia thật (khoảng 1,5%) huấn luyện âm nhạc không làm giảm khiếm khuyết (Peretz & Vuvan 2017). Đề nghị tách: nghe cao độ cải thiện nhờ luyện tai; hát đúng cần tập hát có phản hồi.'
- trang: bat-dau/bai-0
  id: n15
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/28224991/
  ghi_chu: 'Peretz & Vuvan 2017 (Eur J Hum Genet, mẫu 20.000 người): amusia bẩm sinh (''tone deafness'') chiếm khoảng 1,5% dân số, thấp hơn ước tính cũ 4% từ một bài thử năm 1980. ''Một tỉ lệ rất nhỏ'' đúng.'
- trang: bat-dau/bai-0
  id: n16
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/16412412/
  ghi_chu: 'Lời khuyên nghe nhạc. Phù hợp với nghiên cứu: người nghe không học nhạc vẫn có nhiều năng lực xử lý nhạc phương Tây thu nhận qua tiếp xúc (Bigand & Poulin-Charronnat 2006). Không hại.'
- trang: bat-dau/bai-0
  id: n17
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Đặc điểm của chính site (bản thu và bảng ''Theo dõi khi nghe'' ở mọi bài học tác phẩm); không có nguồn ngoài. Lưu ý: theo AGENTS.md, bản thu gợi ý lấy từ ''ban_thu'' của bản ghi và ''không có bản thu thì người học tự dán link hay chọn file'', nên ''mỗi bài có bản thu'' có thể nói quá; kiểm bằng dữ liệu ''ban_thu'' của các bản ghi bài học.'
- trang: bat-dau/bai-0
  id: n18
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Nói về công cụ của site (bài kiểm tra đầu vào, phần piano ''khoảng 2 phút''): ước lượng thời gian, không có nguồn ngoài. Cùng ước lượng ở kiem-tra-dau-vao n2 (ở đó loại khuyen-tap nên tôi để dung); kiểm bằng cách tự làm thử và bấm giờ.'
- trang: bat-dau/bai-0
  id: n19
  luot_2: khong-chac
  nguon: []
  ghi_chu: Trỏ tới hai mục khác của site ('Trước ngày đầu tiên', 'Hai tuần đầu tiên bên phím đàn') và liệt kê nội dung của chúng (đàn, ghế, máy đếm nhịp, khung giờ cố định); tự tham chiếu, không có nguồn ngoài. Kiểm bằng đối chiếu trang đích.
- trang: bat-dau/bai-0
  id: n20
  luot_2: khong-chac
  nguon: []
  ghi_chu: Số chặng khớp AGENTS.md ('cap-do.yml' có 7 chặng) nhưng đó là tài liệu của chính dự án; 'dẫn bạn tới những tác phẩm lớn' là mô tả chung chung, không kiểm được bằng nguồn ngoài.
- trang: bat-dau/bai-0
