  nguon: []
  ghi_chu: Thứ tự láy (mordent) và appoggiatura trước, láy rền (trill) sau là hợp lý về độ khó; khuyến nghị đọc trước để nhận ký hiệu là tốt.
- trang: bat-dau/lo-trinh-choi
  id: n28
  luot_2: dung
  nguon: []
  ghi_chu: 'Tiêu chí hợp lý: gam trưởng đến 2 dấu hóa (Sol, Rê, Fa, Si giáng trưởng), hai tay, hai quãng tám; chơi trọn bài có nhắc lại, nhịp đều.'
- trang: bat-dau/lo-trinh-choi
  id: n29
