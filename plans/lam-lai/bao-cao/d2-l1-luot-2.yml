  ghi_chu: Câu tự mô tả mục tiêu của site (loại 'ten' ghi chưa đúng); không có nguồn ngoài để kiểm. Khớp với mô tả dự án trong AGENTS.md (sổ tay tiếng Việt học piano cổ điển cho người lớn tự học) nhưng đó không phải nguồn độc lập. Đề nghị coi là không cần nguồn hoặc bỏ khỏi danh sách nhận định.
