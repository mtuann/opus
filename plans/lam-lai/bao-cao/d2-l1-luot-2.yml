  luot_2: dung
  nguon:
  - https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1770
  - https://imslp.org/wiki/Minuet_in_F_major,_K.2_(Mozart,_Wolfgang_Amadeus)
  - https://kv.mozarteum.at/de/work/klavierstuck-in-f-1009
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  ghi_chu: 'Bản gõ lại trên Mutopia (từ Breitkopf, Wolfgang Amadeus Mozarts Werke Serie 22 số 2): 3/4, Fa trưởng, ô 1–8 có dấu nhắc lại, các đoạn đều 4 ô: ô 4 kết về Fa, ô 8 kết trên Đô (V), ô 12 kết Sol thứ, ô 16 kết V7–I về Fa. Theo OMT (Introduction to Harmony), kết nửa là câu dừng ở V, kết trọn là V–I: khớp "kết nửa ở ô 8, kết trọn ở ô 16". Lưu ý tên: IMSLP (Minuet in F major, K.2, 1762, Nannerl-Notenbuch) và Mutopia gọi là Minuet/Menuett; Köchel online của Mozarteum ghi KV 2 là "Klavierstück in F" (NMA IX/27/1 số 58).'
- trang: bat-dau/lo-trinh-choi
  id: n24
  luot_2: dung
  nguon:
  - https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1770
  - https://imslp.org/wiki/Minuet_in_F_major,_K.2_(Mozart,_Wolfgang_Amadeus)
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  ghi_chu: 'Cùng cơ sở với n23: dấu nhắc lại ở ô 1–8; kết nửa nghe rõ ở ô 8 (dừng trên Đô), kết trọn ở ô 16 và cuối bài (V7–I). Bản Mutopia có thêm 8 ô cuối nhắc lại câu mở đầu (ô 17–24).'
- trang: bat-dau/lo-trinh-choi
  id: n25
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/
  ghi_chu: 'OMT (Sonata Form): lượt đầu của hình thức sonata là exposition (trình bày), lượt hai gồm development (phát triển) và recapitulation (tái hiện).'
- trang: bat-dau/lo-trinh-choi
  id: n26
