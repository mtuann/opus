  ghi_chu: 'IMSLP: Album für die Jugend Op. 68 số 8 là Wilder Reiter, số 10 là Fröhlicher Landmann, von der Arbeit zurückkehrend. Henle: cả hai mức 3 (Wilder Reiter có ghi ABRSM Piano Grade 3).'
