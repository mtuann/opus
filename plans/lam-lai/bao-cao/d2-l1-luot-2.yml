  - https://imslp.org/wiki/Album_f%C3%BCr_die_Jugend,_Op.68_(Schumann,_Robert)
  ghi_chu: 'Bản in Klauser (Schuberth, Leipzig; bản quét trên Wikimedia Commons, trong bản này đánh số lại là số 9): tay phải đánh hợp âm staccato lệch phách, tay trái giữ giai điệu legato có chỉ ngón; nên nhạc ghi đúng như câu nói (giai điệu ở tay trái, hợp âm tay phải khẽ hơn).'
- trang: bat-dau/lo-trinh-choi
  id: n31
