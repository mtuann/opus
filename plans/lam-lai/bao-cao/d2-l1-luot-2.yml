  - https://imslp.org/wiki/F%C3%BCr_Elise,_WoO_59_(Beethoven,_Ludwig_van)
  - https://imslp.org/wiki/3_Gymnop%C3%A9dies_(Satie,_Erik)
  ghi_chu: 'Für Elise WoO 59: Henle mức 3 (dễ), nên "bài với" ở chặng 4 là hợp lý. Gymnopédie số 1 (Satie): không có xếp hạng chính thức nào mở được (không có trong đề cương ABRSM 2021–2028, Henle không xuất bản). Không đủ nguồn bậc 2 để khẳng định hai bài thuộc chặng 4 (Grade 4–5).'
- trang: bat-dau/lo-trinh-choi
  id: n40
  luot_2: dung
  nguon: []
  ghi_chu: Kế hoạch năm hai hợp lý; nhắc nhạc lý "từ bài 16" nhất quán với trang lộ trình 7 chặng (năm đầu học hết bài 1–15).
- trang: bat-dau/lo-trinh-choi
  id: n41
  luot_2: dung
  nguon: []
  ghi_chu: 'Nhận định thực tế: hai tay (tháng 2) và bài thật đầu tiên (tháng 6) là hai chỗ người mới hay chậm lại; lời trấn an phù hợp.'
- trang: bat-dau/lo-trinh-choi
  id: n42
  luot_2: dung
  nguon: []
  ghi_chu: 'Lời khuyên đúng: giữ thói quen, giảm mục tiêu, kiểm tra cách tập; "đau là dừng" là nguyên tắc an toàn đúng.'
- trang: bat-dau/lo-trinh-nghe
  id: n1
  luot_2: dung
  nguon: []
  ghi_chu: 'Kế hoạch nghe khoảng 6 tháng, 20 phút mỗi ngày, chỉ học phần nhạc lý cần cho việc nghe: hợp lý.'
- trang: bat-dau/lo-trinh-nghe
  id: n2
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/introduction-to-western-musical-notation/
  ghi_chu: 'OMT (Introduction to Western Musical Notation): "No system of notation could capture every aspect of sound in full detail and still be useful or readable, so only some musical elements can be depicted." Bản nhạc không ghi hết, người chơi quyết định phần còn lại, nên mỗi người diễn giải một khác.'
- trang: bat-dau/lo-trinh-nghe
  id: n3
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)
  ghi_chu: IMSLP liệt kê 48 bản thu tự do cho Giao hưởng số 5 của Beethoven ("Recordings (48)"), nên "một tác phẩm có nhiều bản thu" đúng. "So sánh là một phần niềm vui" là nhận định chủ quan, không có số liệu để kiểm.
- trang: bat-dau/lo-trinh-nghe
  id: n4
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)
  - https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)
  ghi_chu: 'IMSLP: Brahms Giao hưởng số 4 Op. 98 có 4 chương, thời lượng trung bình 40 phút; Shostakovich Giao hưởng số 5 Op. 47 có 4 chương, trung bình 45 phút.'
- trang: bat-dau/lo-trinh-nghe
  id: n5
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/
  - https://viva.pressbooks.pub/openmusictheory/chapter/ternary-form/
  ghi_chu: 'OMT: hình thức sonata có exposition (trình bày chủ đề), development (phát triển, thường không ổn định) và recapitulation (nhắc lại chủ đề của exposition); hình thức ba đoạn ABA có "a return to the material from the opening section". Câu viết đúng ở mức khái quát.'
- trang: bat-dau/lo-trinh-nghe
  id: n6
  luot_2: dung
  nguon: []
  ghi_chu: Nghe từng chương, tìm giai điệu chính và để ý khi nó trở lại là cách nghe chủ động chuẩn.
- trang: bat-dau/lo-trinh-nghe
  id: n7
  luot_2: dung
  nguon:
  - http://hyperphysics.phy-astr.gsu.edu/hbase/Sound/dba2.html
  ghi_chu: 'HyperPhysics (Georgia State University, theo Backus): ppp khoảng 40 dB, p 60 dB, f 80 dB, fff 100 dB (tại C6), tức dải danh nghĩa khoảng 60 dB; đo ở buổi hòa nhạc dàn nhạc: Magic Flute 56–84 dBA, William Tell Overture 76–89 dBA. Dải âm lượng của nhạc dàn nhạc thực sự rộng.'
- trang: bat-dau/lo-trinh-nghe
  id: n8
  luot_2: dung
  nguon:
  - http://hyperphysics.phy-astr.gsu.edu/hbase/Sound/dba2.html
  ghi_chu: 'Lời khuyên đúng với cách nghe nhạc cổ điển, nhưng nên thêm lưu ý an toàn thính giác: HyperPhysics ghi mức fff khoảng 100 dB và ngưỡng đau 120 dB, nên đừng nâng âm lượng quá cao để nghe rõ đoạn nhỏ trong thời gian dài, nhất là khi dùng tai nghe.'
- trang: bat-dau/lo-trinh-nghe
  id: n9
  luot_2: dung
  nguon:
  - https://cdn.eicom.ru/media/PDF/3468456.pdf
  ghi_chu: 'Datasheet Knowles 2403-260-00001 (loa mini 11×15×3,5 mm "dành cho thiết bị di động, điện thoại nghe nhạc và smartphone"; bản lưu trên cdn.eicom.ru): tần số cộng hưởng 800 Hz ± 7,5% (hộp sau 1 cm³; 450 Hz khi không hộp), bảng đáp tuyến chỉ bắt đầu từ 300 Hz, tại đó mức cho phép thấp hơn khoảng 20 dB so với ở 770 Hz và méo hài cho phép tới 25%; thử tuổi thọ dùng bộ lọc cao qua 800 Hz. Nghĩa là loa điện thoại gần như không phát được các nốt dưới khoảng Rê4 (~294 Hz); "mất gần hết âm trầm" đúng.'
- trang: bat-dau/lo-trinh-nghe
  id: n10
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Câu quá chung. Một phần lớn nhạc cổ điển là nhạc không lời (giao hưởng, sonata, tứ tấu), nhưng opera, lieder, hợp xướng, cantata, requiem có lời và chiếm tỷ trọng đáng kể; chưa tìm được nguồn bậc 2 mở được để xác nhận "thường không có lời". Đề nghị viết cụ thể hơn, ví dụ: "Nhiều tác phẩm cổ điển là nhạc không lời, nên âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ."'
- trang: bat-dau/lo-trinh-nghe
  id: n11
  luot_2: khong-chac
  nguon:
  - https://sites.utm.utoronto.ca/sites/sites.utm.utoronto.ca.glenn_website/files/download/SP&V2008.pdf
  - https://collaborate.princeton.edu/en/publications/when-program-notes-dont-help-music-descriptions-and-enjoyment/
  ghi_chu: 'Hai vế có bằng chứng trái chiều. (1) Đọc mô tả trước khi nghe: Margulis (2010, Psychology of Music 38) thấy mô tả bằng chữ trước đoạn nhạc làm giảm mức thích (mẫu nhỏ, người không học nhạc). (2) "Nghe lần ba hay hơn lần đầu": Schellenberg, Peretz & Vieillard (2008) thấy khi nghe tập trung, mức thích tăng sau 2 lần nghe rồi giảm sau 8 hoặc 32 lần (đường chữ U ngược); khi nghe không tập trung thì tăng tuyến tính theo số lần nghe. Không có nguồn nào xác nhận con số "lần thứ ba". Nên viết mềm: "nghe lặp lại thường giúp bạn thích hơn, nhưng đừng nghe quá nhiều lần liền".'
- trang: bat-dau/lo-trinh-nghe
  id: n12
  luot_2: dung
  nguon: []
  ghi_chu: Nhận định hợp lý về sư phạm nghe nhạc (người mới chán thường vì chưa biết nghe gì); "phương pháp 4 lần nghe" là phương pháp của site.
- trang: bat-dau/lo-trinh-nghe
  id: n13
  luot_2: dung
  nguon: []
  ghi_chu: Bản thu miễn phí đủ để bắt đầu là đúng (IMSLP cũng lưu nhiều bản thu tự do); nhắc trang Tài nguyên là tham chiếu nội bộ.
- trang: bat-dau/lo-trinh-nghe
  id: n14
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Violin_Concertos,_Op.8_(Vivaldi,_Antonio)
  - https://imslp.org/wiki/Eine_kleine_Nachtmusik,_K.525_(Mozart,_Wolfgang_Amadeus)
  - https://imslp.org/wiki/Symphony_No.94_in_G_major,_Hob.I%3A94_(Haydn,_Joseph)
  - https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331%2F300i_(Mozart,_Wolfgang_Amadeus)
  ghi_chu: 'IMSLP: Vivaldi Violin Concertos Op. 8 gồm "La primavera" (Violin Concerto in E major, RV 269) tức Mùa xuân; Mozart Eine kleine Nachtmusik K. 525; Haydn Symphony No. 94 in G major Hob. I:94, biệt danh "Surprise"; Mozart Sonata K. 331, chương 3 Alla Turca.'
- trang: bat-dau/lo-trinh-nghe
  id: n15
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Tham chiếu nội bộ (số bài nhạc lý của site), không có nguồn ngoài. Nội dung (cao độ và nhịp là điều cần để bắt đầu nghe) hợp lý và nhất quán với n35 (bài 1–4: tên nốt và đếm nhịp). Cần review đối chiếu tiêu đề bài 1 và bài 4.'
- trang: bat-dau/lo-trinh-nghe
  id: n16
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 5 phút mỗi ngày nhận biết quãng là khuyến nghị luyện tai hợp lý (thực chất là khuyen-tap); "bộ Khởi động" là công cụ nội bộ của site. Tên và chất lượng quãng theo OMT (Intervals).
- trang: bat-dau/lo-trinh-nghe
  id: n17
  luot_2: khong-chac
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: 'OMT (Minor Scales): "Minor is often (but not always!) used to depict negative emotions, such as sadness, in Western music"; OMT (Triads): coi hợp âm thứ là "buồn" chỉ là cách ghép cảm xúc thường gặp. Vì vậy "hiểu vì sao giọng thứ nghe buồn" nên viết mềm: "hiểu vì sao giọng thứ thường gắn với cảm giác buồn, tối (nhưng không phải luôn luôn)". Số bài 6–7 là tham chiếu nội bộ.'
- trang: bat-dau/lo-trinh-nghe
  id: n18
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: Phân biệt hợp âm ba trưởng và thứ bằng tai là kỹ năng nghe cơ bản; OMT (Triads) có mục "Triadic Qualities and Listening to Triads".
- trang: bat-dau/lo-trinh-nghe
  id: n19
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)
  ghi_chu: 'IMSLP: Giao hưởng số 5 Op. 67 ở Đô thứ; chương 1 Allegro con brio (Đô thứ), chương 4 Allegro (Đô trưởng) (chương 3 Scherzo có Trio ở Đô trưởng).'
- trang: bat-dau/lo-trinh-nghe
  id: n20
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Nocturnes,_Op.9_(Chopin,_Fr%C3%A9d%C3%A9ric)
  - https://www.henle.de/Nocturnes/HN-185
  ghi_chu: 'IMSLP: Nocturnes Op. 9 gồm 3 bản (Si giáng thứ, Mi giáng trưởng, Si trưởng); số 2 là Andante, Mi giáng trưởng. Henle HN 185: "Nocturne E flat major op. 9,2".'
- trang: bat-dau/lo-trinh-nghe
  id: n21
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Peter_and_the_Wolf,_Op.67_(Prokofiev,_Sergey)
  - https://www.boosey.com/pages/shop/product_detail.asp?id=602330
  ghi_chu: 'Prokofiev: Peter and the Wolf Op. 67 (1936; IMSLP). Britten: The Young Person''s Guide to the Orchestra, Op. 34 (trang Boosey & Hawkes, Hawkes Pocket Score HPS 606).'
- trang: bat-dau/lo-trinh-nghe
  id: n22
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Claire_de_Lune_(Debussy,_Claude)
  - https://imslp.org/wiki/Bol%C3%A9ro,_M.81_(Ravel,_Maurice)
  - https://imslp.org/wiki/Swan_Lake_(ballet),_Op.20_(Tchaikovsky,_Pyotr)
  ghi_chu: 'IMSLP: Suite bergamasque (CD 82, L. 75) có chương 3 Clair de lune; Ravel Boléro (1928); Tchaikovsky Swan Lake (Hồ thiên nga) Op. 20.'
- trang: bat-dau/lo-trinh-nghe
  id: n23
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Tham chiếu nội bộ (bài 12 và 13), không có nguồn ngoài. Cần review đối chiếu với trang nhạc lý. Ghi chú nhất quán: câu này đặt bài 12–13 ở tháng 4 của lộ trình nghe, còn n37 xếp bài 10–14 vào tháng 5–7 của nhánh nhạc lý song song; hai lộ trình khác nhịp nên không mâu thuẫn.'
- trang: bat-dau/lo-trinh-nghe
  id: n24
  luot_2: dung
  nguon:
  - https://www.laphil.com/works/symphony-no-40-in-g-minor-k-550
  - https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/
  - https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)
  ghi_chu: 'Chương 1 Molto allegro của Giao hưởng số 40 K. 550 là hình thức sonata: LA Phil (program notes) nói về "the development section of the opening movement" và gọi chương cuối là "another long-spanned sonata form". Thuật ngữ exposition, development, recapitulation theo OMT (Sonata Form).'
- trang: bat-dau/lo-trinh-nghe
  id: n25
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)
  - https://www.henle.de/en/The-Well-Tempered-Clavier-Part-I-BWV-846-869/HN-14
  ghi_chu: 'IMSLP: Das wohltemperierte Klavier I, BWV 846–869; Prelude Đô trưởng là BWV 846 (Henle HN 14: "Prelude C major BWV 846").'
- trang: bat-dau/lo-trinh-nghe
  id: n26
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Erlk%C3%B6nig,_D.328_(Schubert,_Franz)
  - https://imslp.org/wiki/Die_Zauberfl%C3%B6te,_K.620_(Mozart,_Wolfgang_Amadeus)
  - https://imslp.org/wiki/Habanera_(from_Carmen)_(Bizet,_Georges)
  ghi_chu: 'IMSLP: Schubert Erlkönig D. 328 (1815); Die Zauberflöte K. 620 có aria "Der Hölle Rache kocht in meinem Herzen" (Act II, số 14), aria thường gọi là của Nữ hoàng bóng đêm; Carmen (Bizet) có Habanera "L''amour est un oiseau rebelle".'
- trang: bat-dau/lo-trinh-nghe
  id: n27
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/Pr%C3%A9ludes,_Livre_1,_CD_125_(Debussy,_Claude)
  - https://www.boosey.com/cr/music/Igor-Stravinsky-The-Rite-of-Spring/2769
  - https://brahms.ircam.fr/en/works/work/30209
  ghi_chu: 'IMSLP: Debussy Préludes Livre 1 (CD 125/L. 117), 1909–10. Boosey & Hawkes: Stravinsky The Rite of Spring (Le Sacre du Printemps), 1911–13. IRCAM (Universal Edition UE 13360): Pärt Spiegel im Spiegel, 1978; Pärt sinh năm 1935. Cả ba thuộc thế kỷ 20, nên "thế kỷ 20 và hôm nay" đúng.'
- trang: bat-dau/lo-trinh-nghe
  id: n28
  luot_2: dung
  nguon: []
  ghi_chu: Đi nghe hòa nhạc trực tiếp là khuyến nghị hợp lý.
- trang: bat-dau/lo-trinh-nghe
  id: n29
  luot_2: khong-chac
  nguon: []
  ghi_chu: Tham chiếu nội bộ (số tác phẩm trên mỗi trang thời kỳ), không có nguồn ngoài. Cần review đếm trực tiếp trên các trang thời kỳ.
- trang: bat-dau/lo-trinh-nghe
  id: n30
  luot_2: dung
  nguon:
  - https://imslp.org/wiki/6_Cello_Suites,_BWV_1007-1012_(Bach,_Johann_Sebastian)
  - https://imslp.org/wiki/Requiem_in_D_minor,_K.626_(Mozart,_Wolfgang_Amadeus)
  - https://imslp.org/wiki/Quintet_for_Piano_and_Strings_%27Trout%27,_D.667_(Schubert,_Franz)
  - https://imslp.org/wiki/Symphony_No.4,_Op.98_(Brahms,_Johannes)
  - https://imslp.org/wiki/Symphony_No.5,_Op.47_(Shostakovich,_Dmitry)
  - https://imslp.org/wiki/String_Quartet_No.15,_Op.132_(Beethoven,_Ludwig_van)
  ghi_chu: 'IMSLP: Bach 6 Cello Suites BWV 1007–1012; Mozart Requiem K. 626; Schubert Piano Quintet "Trout" D. 667; Brahms Symphony No. 4 Op. 98; Shostakovich Symphony No. 5 Op. 47; Beethoven String Quartet No. 15 Op. 132.'
- trang: bat-dau/lo-trinh-nghe
  id: n31
  luot_2: khong-chac
  nguon: []
  ghi_chu: Tham chiếu nội bộ (danh sách hướng dẫn nghe nhạc piano "từ Scarlatti đến Gershwin"), không có nguồn ngoài. Cần review đối chiếu danh sách trang hướng dẫn nghe.
- trang: bat-dau/lo-trinh-nghe
  id: n32
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Mô tả mục "Nhận diện" của site (bảng so sánh các thời kỳ, luyện nghe nhận diện, nghe mù): tham chiếu nội bộ, không có nguồn ngoài. Cần review đối chiếu với trang.'
- trang: bat-dau/lo-trinh-nghe
  id: n33
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Tham chiếu nội bộ (tiêu đề bài 28, 29, 31 và các chuyên đề). Nhất quán với trang lộ trình 7 chặng (bài 27–32: ký hiệu hợp âm, kết cấu, chuỗi hòa âm, phát triển môtip, hình thức, kỹ thuật thế kỷ 20, tức 28 = kết cấu, 29 = chuỗi hòa âm, 31 = hình thức nhỏ). Cần review đối chiếu tiêu đề.'
- trang: bat-dau/lo-trinh-nghe
  id: n34
  luot_2: dung
  nguon: []
  ghi_chu: 'Nhánh nhạc lý song song 20–30 phút mỗi ngày, thời gian chỉ là gợi ý: khuyến nghị hợp lý.'
- trang: bat-dau/lo-trinh-nghe
  id: n35
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/notation-of-notes-clefs-and-ledger-lines/
  - https://viva.pressbooks.pub/openmusictheory/chapter/the-keyboard-and-grand-staff/
  ghi_chu: Mục tiêu "đọc được tên nốt và đếm được nhịp" là nền tảng; OMT (Notation of Notes, Clefs, and Ledger Lines; The Keyboard and the Grand Staff) cho khóa Sol, khóa Fa, Đô giữa. Ngưỡng 90% khớp tiêu chí 9/10 nốt ở lộ trình chơi (lo-trinh-choi n6, n8).
- trang: bat-dau/lo-trinh-nghe
  id: n36
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'Mục tiêu hợp lý; "3 trưởng, 5 đúng, 8 đúng" là tên quãng chuẩn (OMT, Intervals). Hóa biểu đến 4 dấu hóa ở đây là mục tiêu nhạc lý, khác mức 2 dấu hóa của nhánh chơi đàn (lo-trinh-choi n13): hai nhánh khác nhịp.'
- trang: bat-dau/lo-trinh-nghe
  id: n37
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  - https://viva.pressbooks.pub/openmusictheory/chapter/intro-to-harmony/
  ghi_chu: 'Mục tiêu hợp lý: OMT có hợp âm ba và hợp âm bảy (Triads, Seventh Chords), chức năng hòa âm và các kết (Introduction to Harmony, Cadences, and Phrase Endings). Con số "thị tấu giai điệu cấp độ 1" là tiêu chí nội bộ của site.'
- trang: bat-dau/lo-trinh-nghe
  id: n38
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/
  - https://imslp.org/wiki/Symphony_No.94_in_G_major,_Hob.I%3A94_(Haydn,_Joseph)
  - https://imslp.org/wiki/Symphony_No.40_in_G_minor,_K.550_(Mozart,_Wolfgang_Amadeus)
  ghi_chu: Mục tiêu hợp lý (nghe tác phẩm dài mà không bị lạc, dùng sơ đồ). Haydn 94 là Giao hưởng số 94 "Surprise" Hob. I:94 (IMSLP, trung bình 24 phút); Mozart 40 là K. 550. Hình thức sonata theo OMT.
- trang: bat-dau/lo-trinh-nghe
  id: n39
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Tham chiếu nội bộ (bài 15–20). Các chủ đề đều là nhạc lý chuẩn (tiết tấu nâng cao, điệu thức, khóa Đô, âm ngoài hợp âm, át phụ và chuyển giọng, đọc tổng phổ). Đối chiếu nội bộ: trang lộ trình 7 chặng liệt kê bài 15–19 là "tiết tấu nâng cao, điệu thức, dịch giọng, âm ngoài hợp âm, át phụ và chuyển giọng" (không có "khóa Đô" và "đọc tổng phổ", bỏ bài 20): cần review xem tiêu đề bài 17 và bài 20 có khớp không.'
- trang: bat-dau/lo-trinh-nghe
  id: n40
  luot_2: khong-chac
  nguon: []
  ghi_chu: Tham chiếu nội bộ (Âm học, bài 21–32 "từ Hòa âm bốn bè", quy trình phân tích 6 bước), không có nguồn ngoài. Cần review đối chiếu với trang.
- trang: bat-dau/lo-trinh-nghe
  id: n41
  luot_2: dung
  nguon: []
  ghi_chu: 'Luyện tập gần như mỗi ngày, ghi nhật ký, học piano song song nếu có thể: khuyến nghị hợp lý.'
- trang: bat-dau/moi-ngay
  id: n1
  luot_2: dung
  nguon: []
  ghi_chu: Cấu trúc buổi tập (khởi động, kỹ thuật, bài đang học, đọc nhạc, ghi lại) và "đều đặn quan trọng hơn dài" là chuẩn sư phạm.
- trang: bat-dau/moi-ngay
  id: n2
  luot_2: dung
  nguon: []
  ghi_chu: 'Buổi 30 phút hợp lý; thả lỏng vai và cổ tay khi khởi động, đoạn khó trước và chậm, mục tiêu một dòng, nhật ký ngắn: đều là thực hành tốt.'
- trang: bat-dau/moi-ngay
  id: n3
  luot_2: dung
  nguon: []
  ghi_chu: Nghe chủ động hoặc học nhạc lý 10 phút ngoài giờ đàn là khuyến nghị hợp lý.
- trang: bat-dau/moi-ngay
  id: n4
  luot_2: dung
  nguon: []
  ghi_chu: 'Buổi dài 45–90 phút thêm bài thứ hai ở phong cách khác, étude ngắn và nghỉ đứng dậy thả tay giữa buổi: hợp lý, còn có lợi cho phòng ngừa chấn thương.'
- trang: bat-dau/moi-ngay
  id: n5
  luot_2: dung
  nguon: []
  ghi_chu: 'Ngày bận 10 phút (năm ngón hoặc một gam, đoạn khó nhất, đọc nốt) với mục tiêu giữ chuỗi: hợp lý.'
- trang: bat-dau/moi-ngay
  id: n6
  luot_2: dung
  nguon: []
  ghi_chu: 'Lịch tuần gợi ý (bài mới, đoạn khó tay riêng thật chậm, ghép hai tay ở điểm neo, tăng tốc theo nấc máy đếm nhịp, chơi liền và thu âm, cuối tuần chơi cho người khác): đúng quy trình tập chuẩn.'
- trang: bat-dau/moi-ngay
  id: n7
  luot_2: dung
  nguon: []
  ghi_chu: Lịch nhạc lý, tai và nghe hợp lý (nghe tác phẩm của tuần lần 1 chỉ cảm nhận, lần 2 tìm giai điệu chính, lần 3 theo dõi cấu trúc).
- trang: bat-dau/moi-ngay
  id: n8
  luot_2: dung
  nguon: []
  ghi_chu: Tiêu chí chuyển bài (chơi đúng tốc độ mục tiêu ba lần liền không dừng) và danh sách "duy trì" là thực hành tốt.
- trang: bat-dau/moi-ngay
  id: n9
  luot_2: dung
  nguon: []
  ghi_chu: 'Đúng nguyên tắc an toàn: đau tay, cổ tay hay cẳng tay khi tập là tín hiệu dừng lại, kiểm tra tư thế, giảm thời gian.'
- trang: piano/lo-trinh
  id: n1
  luot_2: dung
  nguon: []
  ghi_chu: 'Mốc thời gian chỉ là ước lượng rất thô, quyết định là có tiếp tục hay không: lời dặn hợp lý, không nguy hại.'
- trang: piano/lo-trinh
  id: n2
  luot_2: dung
  nguon: []
  ghi_chu: 'Kế hoạch nội bộ hợp lý: nhạc lý ở mỗi chặng là mức tối thiểu, năm đầu học hết bài 1–15. Nhất quán với lo-trinh-choi n40 (năm hai bắt đầu từ bài 16).'
- trang: piano/lo-trinh
  id: n3
  luot_2: khong-chac
  nguon:
  - https://www.abrsm.org/sites/default/files/2024-09/Impact%20Report%202024%20FINAL.pdf
  - https://www.trinitycollege.com/about-us
  ghi_chu: 'ABRSM tự mô tả là "the world''s largest music education provider, engaging with half a million learners a year from 93 countries" (Impact Report 2024); Trinity tự ghi "over 700,000 candidates a year in more than 80 countries" (mọi môn: nhạc, kịch, tiếng Anh). Không có nguồn độc lập nào xếp ABRSM là hệ thống "phổ biến nhất thế giới". Nên viết: "một trong những hệ thống thi cấp lớn và quen thuộc nhất thế giới".'
- trang: piano/lo-trinh
  id: n4
  luot_2: dung
  nguon:
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
  - https://support.trinitycollege.com/support/solutions/articles/202000096383-entry-requirements-graded-diploma-levels
  - https://register-of-charities.charitycommission.gov.uk/charity-search/-/charity-details/1014792
  ghi_chu: 'ABRSM (đặc tả Piano Practical Grades 2025–26): "available from Grade 1 to Grade 8, and in some subjects from Initial Grade"; piano có "Piano Initial Grade"; văn bằng bắt đầu từ ARSM, rồi LRSM, FRSM. Trinity: "Initial, Grades 1-8" và ATCL, LTCL, FTCL. "Đều của Anh": ABRSM đăng ký tại Anh và xứ Wales (trụ sở London); Trinity College London đăng ký từ thiện số 1014792 tại Charity Commission for England and Wales.'
- trang: piano/lo-trinh
  id: n5
  luot_2: dung
  nguon:
  - https://www.henle.de/Levels-of-Difficulty/
  ghi_chu: 'Trang Henle "Levels of Difficulty": chín mức, 1–3 dễ, 4–6 vừa, 7–9 khó, đánh giá cho từng bài hay từng đơn vị sonata (không phải cả tập). Thang do Rolf Koenen lập (2010).'
- trang: piano/lo-trinh
  id: n6
  luot_2: dung
  nguon: []
  ghi_chu: 'Đúng: có thể theo lộ trình mà không đi thi; cấp chỉ là thước đo chung.'
- trang: piano/lo-trinh
  id: n7
  luot_2: dung
  nguon: []
  ghi_chu: Lời khuyên hợp lý (bắt đầu từ chặng kế tiếp, rà lại danh sách kiểm tra các chặng trước vì người tự học thường lệch giữa bài và kỹ thuật).
- trang: piano/lo-trinh
  id: n8
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Nhận định chỉ trỏ tới nhóm câu "Mục tiêu: …" mà không nêu nội dung, nên không có gì để đối chiếu độc lập. Cần tách thành từng câu cụ thể (hoặc bỏ khỏi danh sách nhận định) rồi review trực tiếp trên trang.'
- trang: piano/lo-trinh
  id: n9
  luot_2: dung
  nguon: []
  ghi_chu: Chuỗi kỹ thuật tay chặng 1–3 (tư thế, năm ngón, legato/staccato, luồn ngón cái, câu nhạc "thở", sắc thái, bàn đạp; Alberti, móc kép đều, staccato bằng cổ tay, đạp trễ, láy và appoggiatura, phát âm theo thời kỳ) đúng thứ tự sư phạm phổ biến.
