  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/classicalmusichistory
  ghi_chu: 'OMT, Other Aspects of Notation, mục Stylistic Periods: ''Western classical music'' được chia thành Medieval (c. 600–1400), Renaissance, Baroque, Classical, Romantic, Post-tonal (c. 1900–present). Naxos, Classical Music History: ''classical'' là một truyền thống trải ''from the monastic intonings of Gregorian chant'' trở đi, các thời kỳ kéo đến ''c.1920–Present''. Khớp với câu: nghĩa rộng gồm cả thánh ca Trung cổ lẫn nhạc đương đại.'
- trang: bat-dau/bai-0
  id: n3
  luot_2: dung
  nguon:
  - https://viva.pressbooks.pub/openmusictheory/chapter/other-aspects-of-notation/
  - https://www.naxos.com/classicalmusichistory
  - https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/
  ghi_chu: 'OMT, Other Aspects of Notation: Classical c. 1750–1820 (Baroque c. 1600–1750, Romantic c. 1800–1910, nên hai thời kỳ gối nhau). Naxos ghi c.1750–c.1830, nên ''khoảng'' là hợp lý. Haydn và Mozart là hai nhà soạn nhạc trung tâm của thời kỳ (Naxos, mục Classical); Beethoven đứng ở lúc Cổ điển đạt đỉnh và chuyển sang Lãng mạn (Naxos, mục Early Romantic); OMT dẫn sách Caplin, Classical Form: ... the Instrumental Music of Haydn, Mozart, and Beethoven (Further Readings của chương Sonata Form). ''Chỉ'' (nghĩa hẹp) đúng với cách dùng phổ biến.'
- trang: bat-dau/bai-0
  id: n4
  luot_2: khong-chac
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/21665201/
  - https://pubmed.ncbi.nlm.nih.gov/23325263/
  - https://pubmed.ncbi.nlm.nih.gov/22524355/
  ghi_chu: 'Không có nguồn trực tiếp cho cả hai vế. (1) ''Người lớn tự sắp xếp việc tập tốt hơn trẻ em'': tôi không mở được nghiên cứu nào xác nhận. (2) ''Chỉ là chuyện thời gian chứ không phải giới hạn'': bị làm yếu bởi các nghiên cứu về giai đoạn nhạy cảm: nhạc công bắt đầu học trước 7 tuổi vẫn giỏi hơn ở đồng bộ vận động-thính giác dù đã ghép cùng số năm kinh nghiệm (Penhune 2011; Steele et al. 2013; Bailey & Penhune 2012), tuy các nghiên cứu này nói về nhạc công chuyên nghiệp chứ không nói về việc người lớn đạt Grade 8. Đề nghị viết thận trọng hơn (bỏ so sánh với trẻ em và bỏ ''không phải giới hạn'') hoặc chuyển thành lời khuyên.'
- trang: bat-dau/bai-0
  id: n5
  luot_2: khong-chac
  nguon:
  - https://www.henle.de/en/Levels-of-Difficulty/
  - https://www.henle.de/en/Notebook-for-Anna-Magdalena-Bach/HN-349
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202023%20&%202024%20Prac%20syllabus%2020230807.pdf
  - https://www.abrsm.org/sites/default/files/2026-06/Piano%20Performance%20Grades%20Syllabus%202027%20&%202028.pdf
  - https://www.trinitycollege.com/resource?id=10125
  ghi_chu: 'Gồm hai phần. (a) Độ khó: Henle HN 349 xếp Menuet BWV Anh. 114 ở mức 1 (easy), và trang Levels of Difficulty định nghĩa mức 1 là bài ''ideally playable after a year of good piano instruction'': khớp phần Minuet nếu đó là Anh. 114. ABRSM piano 2021–2028 và Trinity (8/2026) không liệt kê Anh. 114; ABRSM 2023–24 có Minuet in G BWV Anh. II 116 (bài khác) ở Grade 3. ''Bài ca Pháp cổ'' (Tchaikovsky, Album cho thiếu nhi Op. 39) không có mục riêng ở Henle, ABRSM hay Trinity; các bài khác của tập này được ABRSM xếp Grade 3–5 (Chanson italienne: Grade 3; Douce rêverie: Grade 5), nên chưa có cơ sở xếp bài này vào mức ''sau năm đầu''. (b) Mốc ''sau năm đầu'' là ước lượng theo giờ tập, không nguồn bậc 2 nào gắn bài với thời gian của người tự học. Đề nghị bỏ mốc thời gian hoặc ghi rõ là ước lượng, và kiểm số danh mục của ''Minuet Sol trưởng'' trong dữ liệu.'
- trang: bat-dau/bai-0
  id: n6
  luot_2: khong-chac
  nguon:
  - https://www.henle.de/en/Bagatelle-in-a-minor-WoO-59-Fuer-Elise/HN-1347
  ghi_chu: Henle (HN 1347) xếp Für Elise mức 3 (easy). Bài không có trong đề cương piano ABRSM 2021–2028 và danh mục piano Trinity (8/2026) nên không có Grade chính thức. 'Hai năm rưỡi đến bốn năm' là ước lượng thời gian của người tự học; không nguồn bậc 2 nào nêu và nó phụ thuộc giờ tập, nền tảng. Đề nghị bỏ khoảng thời gian hoặc ghi rõ là ước lượng của site.
