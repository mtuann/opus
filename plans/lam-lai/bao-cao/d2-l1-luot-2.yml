  luot_2: khong-chac
  nguon: []
  ghi_chu: Trỏ tới trang Hỏi đáp và liệt kê chủ đề của nó (đàn điện, tay nhỏ, có cần thầy, có nên thi cấp); tự tham chiếu, không có nguồn ngoài. Kiểm bằng đối chiếu trang đích.
- trang: bat-dau/kiem-tra-dau-vao
  id: n1
  luot_2: khong-chac
  nguon: []
  ghi_chu: Mô tả cấu trúc bài kiểm tra của site (hai phần, thứ tự tùy ý); tự tham chiếu tới công cụ, không có nguồn ngoài. Kiểm bằng cách mở công cụ.
- trang: bat-dau/kiem-tra-dau-vao
  id: n2
  luot_2: dung
  nguon: []
  ghi_chu: Loại khuyen-tap. Ước lượng thời gian làm phần piano (đánh dấu 18 việc trong 6 nhóm, theo n5); hợp lý, không hại. Chỉ kiểm được bằng cách tự làm thử và bấm giờ.
- trang: bat-dau/kiem-tra-dau-vao
  id: n3
  luot_2: khong-chac
  nguon: []
  ghi_chu: Mô tả đầu ra của công cụ (phần piano → chặng; phần nhạc lý → bài nhạc lý nên bắt đầu); tự tham chiếu, không có nguồn ngoài. Kiểm trên công cụ và đối chiếu danh sách chặng/bài nhạc lý của site.
- trang: bat-dau/kiem-tra-dau-vao
  id: n4
  luot_2: khong-chac
  nguon: []
  ghi_chu: Hành vi của công cụ (lưu kết quả trong trình duyệt, gợi ý buổi tập ở trang chủ); không có nguồn ngoài. AGENTS.md có nói tiến độ của người học lưu trong trình duyệt ở khóa 'opus-zero:v1' nhưng chưa nói đến gợi ý buổi tập ở trang chủ. Kiểm trên công cụ.
- trang: bat-dau/kiem-tra-dau-vao
  id: n5
  luot_2: khong-chac
  nguon: []
  ghi_chu: Quy tắc chấm của công cụ (ba việc mỗi nhóm, đạt hai trong ba là xong chặng); tự tham chiếu, không có nguồn ngoài. Kiểm trên khối 'placement' hoặc thử trực tiếp.
- trang: bat-dau/kiem-tra-dau-vao
  id: n6
  luot_2: khong-chac
  nguon: []
  ghi_chu: Ánh xạ chặng–Grade là thiết kế riêng của site, không phải định nghĩa của ABRSM; rank-2 không xác nhận hay bác bỏ được. Nhất quán nội bộ với các câu khác của trang (Minuet = chặng 2 = cấp 1–2; Clementi Op. 36 số 1 = chặng 3 ≈ Grade 3; Invention số 1 = chặng 5 ≈ Grade 6). Kiểm bằng đối chiếu cap-do.yml và trang chặng.
- trang: bat-dau/kiem-tra-dau-vao
  id: n7
  luot_2: dung
  nguon: []
  ghi_chu: 'Loại khuyen-tap. Tiêu chí hợp kỹ thuật piano phổ thông: chơi hai tay bài đơn giản không dừng, đọc nốt cả hai khóa, gam Đô trưởng một quãng tám từng tay với ngón cái luồn mượt. Không hại. (''10 bài đầu tiên'' trỏ tới danh sách của site, không kiểm ở đây.)'
- trang: bat-dau/kiem-tra-dau-vao
  id: n8
  luot_2: dung
  nguon: []
  ghi_chu: 'Loại khuyen-tap. Tiêu chí hợp kỹ thuật phổ thông: gam hai tay hai quãng tám; đổi bàn đạp theo hợp âm để tiếng không nhòe (kỹ thuật đạp lệch/legato pedaling chuẩn). Không hại.'
