- trang: bat-dau/lo-trinh-choi
  id: n22
  luot_2: dung
  nguon: []
  ghi_chu: Nội dung tháng 7 hợp lý (legato, staccato, giai điệu nổi trên phần đệm; đánh dấu các kết bằng bút chì; nghe hợp âm trưởng/thứ); tiêu chí 9/10 lần là đo được.
- trang: bat-dau/lo-trinh-choi
