  ghi_chu: 'IMSLP: Musette in D major (Baroque, 1725), Minuet K. 2 (Classical), Tchaikovsky Children''s Album Op. 39 (Romantic). Ba bài thuộc ba thời kỳ đúng như câu viết.'
- trang: bat-dau/lo-trinh-choi
  id: n33
