  - https://www.henle.de/en/Album-for-the-Young-op.-68/HN-45
  ghi_chu: 'Giống n2: các bài của lộ trình nằm trong dải ABRSM Grade 1–3 (Melodie Grade 1, Petzold Minuet in G minor Grade 2, Wilder Reiter và Chanson italienne Grade 3); "khoảng Grade 1–2" là xấp xỉ hợp lý. "Chặng 2" là khái niệm của site, nhất quán với mục "chặng 2 (Grade 1–2)" ở trang lộ trình 7 chặng.'
- trang: bat-dau/lo-trinh-choi
  id: n36
  luot_2: dung
  nguon: []
  ghi_chu: Danh sách kiểm tra cuối năm hợp lý và nhất quán với các tháng trước (gam trưởng, thứ hòa âm đến 2 dấu hóa; gọi tên I, IV, V, kết).
- trang: bat-dau/lo-trinh-choi
  id: n37
  luot_2: dung
  nguon:
  - https://www.abrsm.org/sites/default/files/2024-06/Piano%202025%20&%202026%20Prac%20syllabus%2020240524_access.pdf
  ghi_chu: 'Bảng thông số thị tấu của ABRSM (2025–26): Initial Grade 4 ô, 4/4, Đô trưởng và Rê thứ, từng tay vị trí năm ngón; Grade 1 khoảng 6 ô, thêm Sol và Fa trưởng, La thứ. Thị tấu "bài cấp Initial đến Grade 1, chậm mà không dừng" đúng mức độ.'
- trang: bat-dau/lo-trinh-choi
  id: n38
  luot_2: khong-chac
  nguon: []
  ghi_chu: Câu này chỉ nói về khái niệm "chặng" của site (chặng 2 sang chặng 3), không có nguồn ngoài để kiểm; hợp lý và nhất quán với n35 và với trang lộ trình 7 chặng (chặng 3 ứng Grade 3). Cần review đối chiếu với trang lộ trình 7 chặng.
