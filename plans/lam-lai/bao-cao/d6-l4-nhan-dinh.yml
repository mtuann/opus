- trang: nghe-nhac/beethoven-moonlight
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata \"Ánh trăng\", chương 1".'
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n2
  cau: "Nhà soạn nhạc: Ludwig van Beethoven (1770–1827)."
  loai: nam
- trang: nghe-nhac/beethoven-moonlight
  id: n3
  cau: "Tên đầy đủ: Sonata piano số 14 cung Đô♯ thứ, Op. 27 số 2, Sonata quasi una fantasia."
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n4
  cau: Sáng tác năm 1801, xuất bản năm 1802.
  loai: nam
- trang: nghe-nhac/beethoven-moonlight
  id: n5
  cau: Đề tặng nữ bá tước Giulietta Guicciardi.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n6
  cau: "Thời kỳ: Cổ điển."
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n7
  cau: "Thể loại: sonata piano."
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n8
  cau: "Độ dài chương 1: khoảng 5–6 phút."
  loai: so-lieu
- trang: nghe-nhac/beethoven-moonlight
  id: n9
  cau: Biệt danh "Ánh trăng" không phải của Beethoven đặt.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n10
  cau: Nhà thơ, nhà phê bình Ludwig Rellstab tả chương 1 như một mặt hồ lặng dưới ánh trăng mờ trong truyện ngắn Theodor, đăng năm 1824 trên một tạp chí âm nhạc ở Berlin, khi Beethoven còn sống.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n11
  cau: Đến khoảng năm 1840, tên Mondscheinsonate đã quen thuộc ở Đức.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n12
  cau: Chuyện năm 1832 Rellstab ví bài với con thuyền trên hồ Lucerne bắt nguồn từ một cuốn sách in năm 1852 của Wilhelm von Lenz; con số 1832 là suy đoán của người đời sau.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n13
  cau: Tên gốc Beethoven đặt là Sonata quasi una fantasia ("sonata gần như một fantasia").
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n14
  cau: Thay vì chương 1 nhanh như thông lệ, ông mở bằng một chương chậm (Adagio sostenuto).
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n15
  cau: Toàn chương là một dòng chùm ba (liên ba móc đơn) chảy đều gần như không ngừng ở tay phải, trên đó giai điệu cất lên từng nốt dài, thưa thớt.
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n16
  cau: Các quãng tám trầm (mở đầu Đô♯ – Si – La – Fa♯ – Sol♯) là bè trầm của tiến trình hòa âm.
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n17
  cau: Chương nhạc ở giọng Đô♯ thứ; giai điệu có lúc đi qua Mi trưởng, Mi thứ, Fa♯ thứ.
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n18
  cau: "Cả chương giữ ở mức nhỏ: bản Winterberger chỉ ghi pp, p và những lần to dần, nhỏ dần, không có chữ f nào."
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n20
  cau: "Theo dõi: mở đầu (ô 1–4), dòng chùm ba tay phải chảy đều, rất nhỏ (pianissimo)."
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n21
  cau: "Theo dõi: giai điệu chính cất lên (tay phải, nốt cao; nhịp lấy đà cuối ô 5), từng nốt dài, thưa."
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n22
  cau: "Theo dõi: giai điệu ở Fa♯ thứ (ô 23–27), cao hơn lần đầu, to dần rồi nhỏ lại."
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n23
  cau: "Theo dõi: trên nốt Sol♯ ngân ở bè trầm (ô 28–41), chùm ba leo lên cao nhất (ô 32–35) rồi đổ xuống."
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n24
  cau: "Theo dõi: tái hiện (ô 42), giai điệu và chùm ba trở lại như ô 5."
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n25
  cau: "Theo dõi: coda (ô 60–69), nhịp chấm dôi xuống bè trầm; hai hợp âm pp khép lại."
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n27
  cau: So sánh với chương 3 (Presto agitato); ba chương nối liền nhau, nên bản sonata là một khối, quasi una fantasia.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n26
  cau: "Câu hỏi nghe chủ động: dòng chùm ba có bao giờ dừng không; giai điệu ở âm vực nào; thử hát theo."
  loai: khuyen-tap
- trang: nghe-nhac/schumann-kinderszenen
  id: n1
  cau: "Bảng: Nhà soạn nhạc Robert Schumann (1810–1856)."
  loai: nam
- trang: nghe-nhac/schumann-kinderszenen
  id: n2
  cau: "Bảng: Tên đầy đủ Kinderszenen (Cảnh tuổi thơ), Op. 15: 13 tiểu phẩm cho piano."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n3
  cau: "Bảng: Sáng tác tháng 2–3 năm 1838 (hai bản, số 6 và số 9, có thể đã xong từ mùa thu 1837); in cuối tháng 2 năm 1839 (Breitkopf & Härtel)."
  loai: nam
- trang: nghe-nhac/schumann-kinderszenen
  id: n4
  cau: "Bảng: Thời kỳ Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n5
  cau: "Bảng: Thể loại chu trình tiểu phẩm cho piano."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n6
  cau: "Bảng: Độ dài khoảng 17–22 phút (bản thu Musopen trên trang này: khoảng 22 phút)."
  loai: so-lieu
- trang: nghe-nhac/schumann-kinderszenen
  id: n7
  cau: Năm 1838 Schumann 27 tuổi, đã đính hôn với nghệ sĩ piano trẻ Clara Wieck, giữa lúc cuộc đính hôn vấp phải tranh cãi ngày càng gay gắt.
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n8
  cau: 'Ngày 17/3/1838 ông viết cho Clara: có lần cô bảo ông "đôi khi giống như một đứa trẻ", và từ ý ấy ông viết khoảng ba mươi bản nhỏ, chọn ra chừng mười hai và đặt tên Kinderscenen.'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n9
  cau: '"Em sẽ thích chúng, nhưng em phải quên mình là một nghệ sĩ bậc thầy."'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n10
  cau: Bản in cuối cùng có 13 bản; một số bản bị loại có lẽ về sau nằm trong Bunte Blätter Op. 99 và Albumblätter Op. 124.
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n11
  cau: 'Không phải nhạc cho trẻ con: Schumann gọi chúng là "hồi tưởng của một người lớn, dành cho người lớn".'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n12
  cau: "Nhạc cho trẻ con tập đàn, ông viết mười năm sau: Album für die Jugend (link bài học)."
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n13
  cau: Năm 1839 nhà phê bình Ludwig Rellstab viết bài phê bình tập nhạc.
  loai: nam
- trang: nghe-nhac/schumann-kinderszenen
  id: n14
  cau: Rellstab là người có lẽ đã khởi nguồn biệt danh của sonata Ánh trăng (link hướng dẫn nghe).
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n15
  cau: "Schumann bực bội: Rellstab hẳn tưởng ông đặt một đứa trẻ đang khóc trước mặt rồi đi tìm nốt nhạc cho nó, trong khi sự thật ngược lại."
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n16
  cau: Các tiêu đề "dĩ nhiên ra đời sau", chỉ là "những gợi ý tinh tế cho cách chơi và cách hiểu".
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n19
  cau: "Bảng, số và tên gốc tiếng Đức của 13 bài: Von fremden Ländern und Menschen, Kuriose Geschichte, Hasche-Mann, Bittendes Kind, Glückes genug, Wichtige Begebenheit, Träumerei, Am Kamin, Ritter vom Steckenpferd, Fast zu ernst, Fürchtenmachen, Kind im Einschlummern, Der Dichter spricht."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n20
  cau: "Bảng, cột Nghĩa: tên tiếng Việt của 13 bài."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n21
  cau: "Giọng: số 1 Sol trưởng, số 2 Rê trưởng, số 3 Si thứ, số 4 và 5 Rê trưởng, số 6 La trưởng, số 7 và 8 Fa trưởng, số 9 Đô trưởng, số 10 Sol♯ thứ, số 11 Mi thứ / Sol trưởng, số 12 Mi thứ, số 13 Sol trưởng."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n22
  cau: "Nghe gì, số 1: giai điệu kể chuyện giản dị; môtip mở đầu sẽ quay lại nhiều lần."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n23
  cau: "Số 2: nhịp 3/4 nảy, nhấn mạnh, xen một câu mềm mại."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n24
  cau: "Số 3: nhanh, nốt nảy, như đuổi bắt."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n25
  cau: "Số 4: một lời xin nhắc đi nhắc lại; kết lửng trên hợp âm bảy át."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n26
  cau: 'Số 5: "câu trả lời" cho số 4; hai tay bắt chước nhau.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n27
  cau: "Số 6: hợp âm dày, trang trọng như một buổi lễ."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n28
  cau: "Số 7: một câu nhạc đi lên rồi buông xuống, trở lại nhiều lần với hòa âm khác."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n29
  cau: "Số 8: ấm cúng; mở đầu bằng bước nhảy Đô–Fa như Träumerei."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n30
  cau: "Số 9: nhịp 3/4 với trọng âm lệch, như ngựa gỗ bập bênh."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n31
  cau: "Số 10: giai điệu đảo phách, ngập ngừng."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n32
  cau: "Số 11: đoạn chậm hiền lành bị cắt ngang bởi những đoạn nhanh đột ngột."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n33
  cau: "Số 12: đoạn giữa sáng lên ở Mi trưởng; kết lửng, không về hợp âm chủ."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n34
  cau: "Số 13: như một bài thánh ca; ở giữa có đoạn tự do như lời kể (recitative)."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n35
  cau: "Giọng: mở và khép ở Sol trưởng; phần lớn các bản ở giọng gần Sol (Rê, La, Si thứ, Mi thứ); giữa chu trình rẽ sang Fa trưởng và Đô trưởng (số 7–9), rồi nhảy tới Sol♯ thứ, giọng xa nhất (số 10)."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n36
  cau: "Môtip chung: năm nốt mở đầu số 1 (bước nhảy lên quãng 6 rồi bốn nốt đi xuống) vang lại ở nhiều bản sau, thường chỉ còn chuỗi đi xuống."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n37
  cau: Câu về Rudolph Réti coi cả tập gần như một bộ biến tấu.
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n38
  cau: "Các bản nối nhau: số 4 hỏi, số 5 đáp; Träumerei và Am Kamin cùng mở bằng Đô–Fa; số 12 dừng lửng, số 13 tiếp lời và khép ở Sol trưởng."
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n39
  cau: "Thứ tự: Träumerei là số 7 trong 13, nằm đúng giữa."
  loai: so-lieu
- trang: nghe-nhac/schumann-kinderszenen
  id: n43
  cau: 'Theo dõi, các dòng mô tả: số 1 Sol trưởng; 2–3 nhịp nảy rồi đuổi bắt rất nhanh; số 4 kết lửng; số 5 Rê trưởng, hai tay đuổi nhau; số 6 hợp âm dày; số 7 thời gian như chậm lại; 8–9; số 10 Sol♯ thứ, đảo phách; số 11 bị "dọa" bởi đoạn nhanh; số 12 đung đưa như ru, Mi trưởng, kết lửng; số 13 hợp âm như thánh ca, đoạn tự do, kết rất nhỏ ở Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n45
  cau: "So sánh bản thu, Horowitz: chơi Träumerei ở cuối buổi hòa nhạc trở lại Carnegie Hall năm 1965 và ở Moskva năm 1986 (có đĩa thu trực tiếp)."
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n46
  cau: "So sánh bản thu, Martha Argerich: thu trọn tập cùng Kreisleriana (Deutsche Grammophon); so tốc độ với số máy đếm nhịp in trong bản in đầu, như ♩ = 100 của Träumerei."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n47
  cau: So sánh bản thu, Alfred Cortot.
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n50
  cau: Phần lớn các bản ở khoảng Grade 5–7; khó ở phân bè, tiếng đàn, rubato hơn là tốc độ.
  loai: cap-do
- trang: nghe-nhac/schumann-kinderszenen
  id: n54
  cau: "Nguồn: bản nhạc IMSLP; Urtext Henle, Wiener Urtext."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n55
  cau: "Nguồn: Henle HN 44, lời tựa Herttrich (2007), các thư (Clara 17/3/1838, Reinecke 1848, Dorn 1839)."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n56
  cau: "Nguồn: Từ điển piano PTNA (thư gửi Clara, niên đại số 6 và 9)."
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n18
  cau: "Nghe bằng tai người chơi piano: rất ít nốt, nhưng phân bè rõ, rubato mềm, bàn đạp trong, tiếng đàn hát ở mức rất nhỏ (link Bàn đạp, Tạo tiếng đàn)."
  loai: khuyen-tap
- trang: nghe-nhac/schumann-kinderszenen
  id: n52
  cau: Nếu chơi cả tập, tập cả chỗ nối giữa các bản; link Tác phẩm theo cấp độ và Thể loại.
  loai: khuyen-tap
- trang: nghe-nhac/schumann-kinderszenen
  id: n40
  cau: "Số 13 là lời kết: người kể chuyện, giờ đã lớn, bước ra nói với ta."
  loai: khuyen-tap
- trang: piano/tac-pham/bach-invention-1
  id: n1
  cau: 'Tiêu đề: "Bach: Invention số 1 Đô trưởng, BWV 772".'
  loai: ten
- trang: piano/tac-pham/bach-invention-1
  id: n2
  cau: Bài có hai mươi hai ô nhịp, hai bè.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n3
  cau: Chủ đề (ý nhạc chính) dài nửa ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n4
  cau: "Invention số 1 là một bài phức điệu: hai tay cùng nói, đối đáp và nhại nhau, không chia vai giai điệu và đệm."
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n5
  cau: Bach để lại gần như hoàn toàn cho người chơi việc quyết định cách phát âm.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n6
  cau: Mỗi tay là một giọng độc lập, quan trọng ngang nhau.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n8
  cau: Bach gần như không ghi dấu luyến hay staccato.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n10
  cau: "Gần như mọi nốt trong bài đến từ chủ đề ở ô 1: nguyên dạng, đảo ngược, chuyển giọng, nối thành chuỗi."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n11
  cau: Một tay chạy móc kép trong khi tay kia đi móc đơn, rồi đổi vai.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n12
  cau: Chủ đề, nhại, chuỗi, kết là những khái niệm gặp lại trong fugue (link hinh-thuc/fugue).
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n13
  cau: Bach dùng các invention và sinfonia để dạy con trai Wilhelm Friedemann, rồi các học trò khác.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n14
  cau: Năm 1723, khi chép sạch cả tập, Bach viết một trang bìa dài.
  loai: nam
- trang: piano/tac-pham/bach-invention-1
  id: n15
  cau: "Diễn ý trang bìa: hướng dẫn cho người yêu đàn phím, nhất là người ham học, học chơi sạch hai bè, rồi ba bè; tìm được ý nhạc hay và phát triển chúng; trên hết là đạt lối chơi như hát (cantabile) và nếm trước nghề sáng tác."
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n16
  cau: "Inventio là một từ của tu từ học: tìm ra một ý tưởng rồi khai triển nó."
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n17
  cau: Mỗi invention là một bài học về cách một ý nhạc nhỏ sinh ra cả một tác phẩm.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n18
  cau: Mục tiêu cao nhất Bach nêu ra trên trang bìa là lối chơi như hát, không phải sự nhanh nhẹn của ngón tay.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n20
  cau: Bach viết cho đàn phím thời ấy (trang bìa gọi chung là Clavier).
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n23
  cau: Chủ đề gồm bảy nốt Đô – Rê – Mi – Fa – Rê – Mi – Đô; dạng lộn ngược đi xuống thay vì đi lên.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n24
  cau: "Ba điểm kết: Sol trưởng, La thứ, rồi Đô."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n27
  cau: Bản thu gợi ý của Marcelle Meyer, thu năm 1948, nằm trên Wikimedia Commons.
  loai: nam
- trang: piano/tac-pham/bach-invention-1
  id: n28
  cau: Ở Mỹ, bản thu này vẫn còn được bảo hộ.
  loai: quy-tac
- trang: piano/tac-pham/bach-invention-1
  id: n30
  cau: "Ô 1: tay phải chơi bảy móc kép Đô – Rê – Mi – Fa – Rê – Mi – Đô; nửa ô sau, tay trái nhại lại thấp hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n31
  cau: "Ô 2: chủ đề ở Sol, cùng hình dáng, bắt đầu từ bậc V."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n32
  cau: "Ô 3–4: chủ đề đảo ở tay phải đi xuống thành chuỗi, tay trái đi móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n33
  cau: Đầu ô 7 kết ở Sol trưởng; hai tay đổi vai, tay trái mở đầu bằng chủ đề, tay phải nhại.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n34
  cau: "Ô 9–10: hai bè cùng chơi dạng lộn ngược của chủ đề."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n35
  cau: "Ô 11–12: tay phải đi móc đơn, tay trái chạy chuỗi chủ đề đảo."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n36
  cau: Đầu ô 15 kết ở La thứ, Sol♯ dẫn tới điểm dừng thứ hai.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n37
  cau: "Ô 15–18: một tay giữ nốt dài trong khi tay kia chạy chủ đề, khi xuôi khi đảo, đi xuống theo chuỗi; nốt trắng nối sang ô sau."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n38
  cau: Ô 19–22 về Đô; Si♭ ở ô 21 hướng về hạ át trước kết; hợp âm Đô ở ô 22.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n39
  cau: "Bảng Cấu trúc: phần 1 ô 1–7 (Đô → Sol), phần 2 ô 7–15 (Sol → La thứ), phần 3 ô 15–22 (La thứ → Đô), với các chi tiết như bảng Theo dõi."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n40
  cau: "Hai ô đầu: sau một dấu lặng móc kép là bảy móc kép, tiếp theo là bốn móc đơn Sol – Đô – Si – Đô; lời đáp của tay trái."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n42
  cau: "Ô 2: nốt móc kép đầu tiên của tay phải (Rê) thay chỗ dấu lặng, và chủ đề bắt đầu lại từ Sol."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n43
  cau: Cả bài giữ hình dáng chủ đề, đổi độ cao, đổi điểm bắt đầu.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n45
  cau: "Chỗ khó, phát âm: không có dấu nào trên bản nhạc."
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n49
  cau: "Chuỗi ở ô 3–4, 11–12, 15–18: các nhóm nốt giống nhau nhưng mỗi lần lệch một bậc."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n51
  cau: Nốt dài ô 15–18 là nốt trắng nối sang ô sau.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n59
  cau: Không có chỉ dẫn tốc độ.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n62
  cau: Bach không ghi sắc thái.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n64
  cau: Trong bản Bach-Gesellschaft có ký hiệu láy trên (không gạch; theo bảng của Bach là một láy rền ngắn) ở vài nốt móc đơn, như nốt Si ở ô 1 và nốt Fa ở ô 2.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n65
  cau: Bản ấy có láy dưới (có gạch) ở hai nốt móc đơn chấm dôi, ô 5 và ô 13.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n66
  cau: Theo thói quen thời Baroque, láy rền thường bắt đầu từ nốt trên và rơi đúng phách; láy dưới đi nốt chính – nốt dưới – nốt chính.
  loai: quy-tac
- trang: piano/tac-pham/bach-invention-1
  id: n67
  cau: Chính Bach viết một bảng giải thích các ký hiệu này trong Clavier-Büchlein của Wilhelm Friedemann; một số ấn bản in lại bảng này.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n71
  cau: Nhiều ấn bản cũ thêm dấu luyến, sắc thái và tốc độ của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n73
  cau: "Invention khác: số 4 (Rê thứ) Henle xếp cùng mức 3 như số 1; số 8 (Fa trưởng) Henle mức 4, ABRSM Grade 5."
  loai: cap-do
- trang: piano/tac-pham/bach-invention-1
  id: n78
  cau: "Câu hỏi 1: ba điểm kết lần lượt ở Sol trưởng (ô 7), La thứ (ô 15), Đô trưởng (ô 22); lời giải thích: mỗi phần khép bằng một kết."
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n79
  cau: "Câu hỏi 2: chủ đề đảo là chủ đề lộn ngược, đi xuống ở chỗ bản gốc đi lên; trong bài tập 1, Đô – Rê – Mi – Fa – Rê – Mi – Đô đảo thành Đô – Si – La – Sol – Si – La – Đô."
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n80
  cau: "Câu hỏi 3: một lựa chọn phát âm hợp lý là móc kép liền tiếng, móc đơn tách nhẹ, nốt dài giữ đủ."
  loai: khuyen-tap
- trang: piano/tac-pham/bach-invention-1
  id: n63
  cau: "Sắc thái theo cấu trúc: chủ đề rõ hơn, chuỗi đi lên căng dần..."
  loai: khuyen-tap
- trang: piano/tac-pham/bach-invention-1
  id: n69
  cau: "Bàn đạp: gần như không cần; nếu dùng chỉ chạm nông."
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-anh-trang
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata Ánh trăng, Op. 27 số 2, chương 1".'
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n2
  cau: "Mô tả và câu mở đầu: chương 1 của bản sonata nổi tiếng này có rất ít nốt khó; cái khó nằm ở âm thanh."
  loai: cap-do
- trang: piano/tac-pham/beethoven-anh-trang
  id: n3
  cau: Tay phải vừa rải chùm ba vừa hát giai điệu bằng ngón 5, trên quãng tám trầm ngân dài, gần như suốt bài trong pp.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n4
  cau: Chỉ dẫn bàn đạp mà người chơi vẫn còn bàn luận.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n6
  cau: Tay phải rải chùm ba (liên ba móc đơn) bằng ngón 1–2–3, hát giai điệu bằng ngón 4–5; tay trái giữ bè trầm quãng tám.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n9
  cau: 69 ô nhịp ở tốc độ chậm, nhịp alla breve.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n10
  cau: Hợp âm Napoli ở ô 3, những lần đổi sang giọng thứ, nốt át ngân suốt hơn chục ô (link Phân tích).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n14
  cau: Năm 1802, Beethoven cho in hai sonata Op. 27 và đặt cho cả hai tên Sonata quasi una fantasia.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n15
  cau: Sonata thời Haydn, Mozart thường mở bằng một chương nhanh; Op. 27 số 2 mở bằng một Adagio.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n16
  cau: Tiếp theo là một Allegretto ngắn ở Rê♭ trưởng, và chương nhanh Presto agitato ở cuối.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n17
  cau: Bản sonata đề tặng nữ bá tước Giulietta Guicciardi, học trò của ông.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n18
  cau: Trên nhiều đàn Vienna khoảng 1800, bộ giảm âm được nhấc bằng cần gạt đầu gối; đàn cũ hơn dùng nút gạt bằng tay; tiếng đàn tắt nhanh hơn đàn hiện đại nhiều.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n19
  cau: Vì vậy chỉ dẫn bàn đạp không thể áp dụng y nguyên lên đàn cánh ngày nay (link Lịch sử cây đàn, thời kỳ Cổ điển).
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n20
  cau: Biệt danh "Ánh trăng" không phải của Beethoven.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n21
  cau: Ludwig Rellstab (1799–1860), nhà thơ, nhà phê bình, người viết lời cho nhiều ca khúc trong Schwanengesang của Schubert.
  loai: nam
- trang: piano/tac-pham/beethoven-anh-trang
  id: n22
  cau: Rellstab tả chương này bằng mặt hồ lặng dưới ánh trăng mờ, sóng khẽ vỗ vào bờ tối, trong truyện ngắn Theodor đăng trên một tạp chí âm nhạc ở Berlin khoảng 1823–1824, khi Beethoven còn sống.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n23
  cau: Chuyện năm 1832 Rellstab ví bài với con thuyền dưới trăng trên hồ Lucerne bắt nguồn từ Beethoven et ses trois styles (1852) của Wilhelm von Lenz.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n24
  cau: Lenz chỉ viết rằng Rellstab so sánh như thế "hai mươi năm trước"; năm 1832 là con số người đời sau suy ra.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n25
  cau: Văn bản của Rellstab tả một mặt hồ, không có con thuyền nào và không nhắc tên hồ.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n26
  cau: Đến khoảng năm 1840, tên Mondscheinsonate đã quen thuộc ở Đức.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n29
  cau: Artur Schnabel và Wilhelm Kempff đều thu trọn 32 sonata.
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n30
  cau: Ronald Brautigam có bản thu trên fortepiano.
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n31
  cau: Trên đàn cũ, tiếng tắt nhanh nên bàn đạp giữ lâu vẫn không nhòe như trên đàn hiện đại (link Nghệ sĩ piano).
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n32
  cau: "Mở đầu (ô 1–4): chỉ có chùm ba và quãng tám trầm Đô♯ – Si – La – Fa♯ – Sol♯; nửa sau ô 3 hợp âm Rê trưởng (Napoli) làm màu nhạc tối đi."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n33
  cau: "Giai điệu lần 1 (nhịp lấy đà cuối ô 5, ô 6–9): Sol♯ lặp với nhịp chấm dôi, rồi La, Sol♯, Fa♯, Si; câu kết ở Mi trưởng (ô 9)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n34
  cau: "Giai điệu ở Mi thứ (ô 10–15): Sol♮ thay Sol♯ trong chùm ba và giai điệu; nhạc dừng ở Si (ô 15)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n35
  cau: "Quanh nốt Si (ô 16–22): bè trầm đi nốt đen; giai điệu Đô♮ – La♯ – Si nói hai lần; nhạc trượt xuống, dừng trên hợp âm Đô♯ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n36
  cau: "Giai điệu ở Fa♯ thứ (nhịp lấy đà cuối ô 23, ô 24–27): cao hơn lần đầu, trên nốt Đô♯; to dần rồi nhỏ lại."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n37
  cau: "Nốt Sol♯ ngân (ô 28–41): giai điệu tan vào chùm ba; chùm ba leo lên cao nhất (ô 32–35) rồi đổ xuống thấp."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n38
  cau: "Tái hiện (ô 42–59): chùm ba, bè trầm và giai điệu trở lại như ô 5; nhạc ở lại quanh Đô♯ thứ."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n39
  cau: "Coda (ô 60–69): nhịp chấm dôi xuống tay trái, âm vực trầm; chùm ba rải lên rồi rơi xuống; hai hợp âm pp cuối."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n40
  cau: "Chương nhạc không có dấu nhắc lại; có thể nghe như ba phần hoặc như một hình thức sonata thu nhỏ: ô 51–55 lặp lại, ở giọng chủ, cảnh lắc qua lắc lại của ô 15–19."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n42
  cau: "Mở đầu 1–4: nửa sau ô 3 là hợp âm Napoli (Rê trưởng, thể đảo một); ô 4 trên nốt trầm Sol♯ (át âm)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n43
  cau: "Giai điệu lần 1, 5–9: vào ở nhịp lấy đà cuối ô 5, trên nốt Sol♯4; Đô♯ thứ → Mi trưởng."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n44
  cau: "Giai điệu lần 2, 10–15: Sol♮ thay Sol♯; hợp âm Đô trưởng ở ô 12; kết ở Si thứ, rồi chuyển sang Si trưởng (ô 15)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n45
  cau: "Quanh nốt Si, 16–22: bè trầm đi nốt đen trên nền nốt Si; hợp âm Sol trưởng (Napoli của Fa♯ thứ) ở ô 21; dừng trên hợp âm Đô♯ trưởng (át của Fa♯ thứ)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n46
  cau: "Giai điệu lần 3, 23–27: trên nốt Đô♯5, cao hơn lần đầu; to dần rồi nhỏ lại; dẫn về Đô♯ thứ và nốt Sol♯."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n47
  cau: "Nốt át ngân 28–41: quãng tám Sol♯ ở bè trầm suốt 12 ô (28–39); chùm ba leo lên tới Rê♯6 (cuối ô 35) rồi đổ xuống; ô 40–41 bè trầm Sol♯ – La – Fa♯ – Sol♯."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n48
  cau: "Tái hiện 42–59: ô 42–45 giống ô 5–8; ô 51–55 ứng với ô 15–19, nay trên nốt Đô♯, với giai điệu Rê♮ – Si♯ – Đô♯."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n49
  cau: "Coda 60–69: nhịp chấm dôi xuống bè trầm (Sol♯2) trên các nốt trầm Đô♯, Si♯, Sol♯; chùm ba rải lên hai quãng tám rồi rơi xuống, hai lần; hai hợp âm Đô♯ thứ pp."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n50
  cau: "Chín ô đầu: nốt nhạc theo bản Mutopia (nguồn ấn bản A. Winterberger biên tập, 1908); số ngón là gợi ý của trang."
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n51
  cau: Mọi chùm ba được viết cho tay phải; bản Winterberger để tay trái đỡ chùm ba đầu tiên của ô 5.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n52
  cau: Ô 1–4 chưa có giai điệu; nửa sau ô 3 hợp âm Rê trưởng với Fa♯ ở bè trầm, tức hợp âm Napoli của Đô♯ thứ (link Napoli); chú ý Rê♮ trong chùm ba.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n53
  cau: Giai điệu vào ở nhịp lấy đà cuối ô 5, trên Sol♯4, đúng một quãng tám trên Sol♯3 mà ngón cái đang chơi trong chùm ba; câu nhạc kết ở Mi trưởng ở ô 9.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n56
  cau: "Nhịp chấm dôi so với chùm ba (ô 5–6, 10–11, 23–24...): nốt móc kép bắt đầu ở 3/4 phách, muộn hơn nốt thứ ba của chùm ba (2/3 phách)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n60
  cau: "Nốt Sol♯ ngân (ô 28–41): mười hai ô (28–39) trên cùng một nốt trầm; chùm ba trải rộng và leo cao (ô 32–35), lên tới Rê♯6 ở cuối ô 35."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n61
  cau: Bản Winterberger chia vài chùm ba ở ô 30–33 cho tay trái.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n63
  cau: "Hai bè ở tay trái trong coda (ô 60–65): ngón cái hát nhịp chấm dôi trên Sol♯2, ngón 5 giữ nốt trầm."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n74
  cau: Adagio sostenuto nghĩa là chậm và ngân giữ.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-anh-trang
  id: n75
  cau: "Beethoven ghi nhịp alla breve (2/2): hai phách trắng mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n78
  cau: "Trong bản Winterberger, toàn chương không có một chữ f nào: chỉ pp, p và những lần to dần, nhỏ dần (chẳng hạn ở ô 25–27)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n79
  cau: "Bàn đạp: Beethoven ghi chỉ dẫn hai lần: Si deve suonare tutto questo pezzo delicatissimamente e senza sordino ở đầu bản nhạc, và sempre pp e senza sordino giữa hai khuông."
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n80
  cau: 'Bản dịch: "cả chương này phải chơi hết sức tinh tế và không có bộ giảm âm".'
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n81
  cau: Tùy ấn bản, chữ này in là sordino hoặc sordini; nghĩa như nhau.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n82
  cau: "Thời Beethoven, sordini là bộ giảm âm, nên senza sordino là bộ giảm âm luôn được nhấc lên: tương đương giữ bàn đạp vang."
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-anh-trang
  id: n83
  cau: Đây không phải chỉ dẫn về bàn đạp trái; khi muốn una corda, Beethoven ghi riêng chữ ấy, chẳng hạn trong các sonata cuối đời.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n84
  cau: Trên đàn của ông, giữ bộ giảm âm nhấc suốt chỉ tạo một làn sương mỏng, vì tiếng tắt nhanh; trên đàn cánh hiện đại, giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ thành một khối âm thanh nhòe.
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n85
  cau: "Cách đọc thứ nhất, theo sát chữ: giữ bàn đạp suốt chương hoặc gần như suốt; Charles Rosen đọc chỉ dẫn theo nghĩa này."
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n88
  cau: "Cách đọc thứ ba: đổi một phần, hoặc giữ bàn đạp ở gần điểm bắt và điều chỉnh rất nhỏ, không bao giờ đạp sâu hết hay nhả hết."
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n91
  cau: Các ấn bản cũ có thể thêm ký hiệu bàn đạp, sắc thái và ngón bấm của người biên tập; bản Winterberger ghi ngón đổi 5–4 và 4–5 trên các nốt giai điệu ngân dài ở ô 7–8.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n92
  cau: "Ngón cho chùm ba đổi theo thế tay: bản Winterberger ghi 1–3–5 ở ô 1, 1–2–4 ở đầu ô 3; chọn theo bàn tay."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n94
  cau: "Chương 2 (Allegretto, Rê♭ trưởng, 60 ô nhịp) ngắn; chương 3 (Presto agitato, 200 ô nhịp) khó hơn nhiều: Henle xếp cả sonata mức 7 và ghi ABRSM ARSM, bằng sau Grade 8."
  loai: cap-do
- trang: piano/tac-pham/beethoven-anh-trang
  id: n99
  cau: "Câu hỏi 1: senza sordino nghĩa là không có bộ giảm âm, bộ giảm âm luôn nhấc lên, tức giữ bàn đạp vang; người chơi trên đàn hiện đại thường đổi bàn đạp theo hòa âm hoặc nhả một phần."
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-anh-trang
  id: n100
  cau: "Câu hỏi 2: nốt móc kép rơi sau nốt thứ ba của chùm ba, sát phách sau; móc kép ở 3/4 phách, nốt thứ ba ở 2/3 phách."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n101
  cau: "Câu hỏi 3: nhà phê bình Ludwig Rellstab gắn hình ảnh ánh trăng với chương này, trong một truyện ngắn đăng khoảng năm 1823–1824; chuyện con thuyền trên hồ Lucerne năm 1832 đến từ một cuốn sách viết năm 1852."
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n102
  cau: "Câu hỏi 4: ở ô 28–41 quãng tám Sol♯ (át âm) ngân suốt nhiều ô trong khi chùm ba leo lên cao rồi đổ xuống; chuẩn bị cho tái hiện ở ô 42."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n103
  cau: "Mục Nguồn: Henle HN 1062 (biên tập Norbert Gertsch, ngón bấm Murray Perahia): trang ấn bản, mức độ khó, đoạn văn của Rellstab."
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n5
  cau: "Mục tiêu của trang: ba lớp tách bạch, bàn đạp không nhòe, tốc độ chậm không đứng lại."
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-anh-trang
  id: n76
  cau: Nghĩ theo phách trắng; thở nhẹ ở cuối các câu lớn (ô 9, 15, 22, 41) và trước hai hợp âm cuối.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-anh-trang
  id: n71
  cau: Kế hoạch 8 tuần, 30–45 phút mỗi ngày; tốc độ tính theo phách đen, mỗi phách là một chùm ba.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n1
  cau: Chopin viết bản valse này năm 19 tuổi (1829) và không tự cho in nó.
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n4
  cau: So với Valse La thứ, tay trái đổi thế nhiều hơn, giai điệu nhiều trang trí hơn, có trio Si trưởng với những câu đi bằng quãng ba, và bài dài hơn gấp đôi (144 ô so với 56 ô).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n5
  cau: Tay trái nốt trầm – hợp âm – hợp âm; nốt trầm đổi liên tục (Si, Đô♯, La♯, Rê, Mi, Fa♯…), hợp âm đổi thế gần như mỗi ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n6
  cau: Trang trí (láy quanh, nốt lân cận nửa cung, chuỗi nửa cung đi xuống) được viết bằng nốt thường trong bản nhạc.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n9
  cau: "Ba màu giọng: Si thứ, Rê trưởng (con anima), Si trưởng (dolce)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n10
  cau: Lần thứ hai của trio đi chủ yếu bằng quãng ba; bước làm quen nốt kép legato, chuẩn bị cho Nocturne Op. 9 số 2.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n11
  cau: Năm 1829 Chopin 19 tuổi và vẫn sống ở Warsaw.
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n12
  cau: Cuối năm 1830 Chopin rời Ba Lan, rồi sống ở Paris cho đến khi mất (1849).
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n13
  cau: Bài được in lần đầu năm 1852, ba năm sau khi Chopin mất, cùng bản Valse Fa thứ (sau này là Op. 70 số 2).
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n14
  cau: Năm 1855 Julian Fontana, bạn của Chopin, in các tập tác phẩm di cảo, trong đó có hai tập valse Op. 69 và Op. 70; bản này thành Op. 69 số 2.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n16
  cau: Valse của Chopin là nhạc để nghe hơn là để nhảy.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n17
  cau: Trong bài này nhịp 3 đều đặn ở tay trái, giai điệu như một lời than thở nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n18
  cau: Bài được truyền lại ở hai phiên bản; Henle in cả hai, một bản ghi là "phiên bản theo Fontana".
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n19
  cau: Đoạn trích trên trang lấy từ ấn bản Peters do Herrmann Scholtz biên tập, qua bản gõ lại của Mutopia Project.
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n23
  cau: "Câu hỏi nghe: nốt Fa♯ ngân đầu câu, đỉnh câu, các nốt trang trí."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n24
  cau: "Câu hỏi nghe: đoạn Rê trưởng và trio Si trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n25
  cau: "Câu hỏi nghe: đoạn B – A' (ô 33–64) có dấu nhắc lại; chủ đề trở lại ở ô 97."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n29
  cau: "Đoạn A (Si thứ, ô 1–16): giai điệu bắt đầu bằng Fa♯ cao ngân qua vạch nhịp rồi rơi xuống La♯; ô 5 có láy quanh Fa♯ – Sol – Mi♯ – Fa♯."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n30
  cau: "Đoạn A lần hai (ô 17–32): cùng giai điệu; cuối đoạn, nốt Si♭ dẫn sang giọng mới."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n31
  cau: "Đoạn B (Rê trưởng, con anima, ô 33–48): nốt Si♭ có dấu nhấn mở đầu; cuối đoạn một chuỗi nửa cung đi xuống."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n32
  cau: "Đoạn A' (ô 49–64): chủ đề trở lại, tô thêm nốt nửa cung (Sol♯ – Sol – Fa♯)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n33
  cau: Nhắc lại B và A' (ô 33–64).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n34
  cau: "Trio (Si trưởng, dolce, ô 65–80): giai điệu xoay quanh Rê♯; nốt lặp nhịp chấm dôi ở ô 69–72."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n35
  cau: "Trio lần hai (ô 81–96): giai điệu đi bằng nốt kép, chủ yếu quãng ba; từ ô 89 tối lại về Si thứ, rồi dẫn về chủ đề."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n36
  cau: "Đoạn A (ô 97–112): chủ đề trở lại, mở đầu bằng nốt Si rất trầm ở tay trái; ấn bản Peters ghi f."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n37
  cau: "Đoạn B và A' (ô 113–144): không nhắc lại; cuối bài calando e dimin."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n38
  cau: "Số ô theo ấn bản Peters (Mutopia): 144 ô và một nhịp lấy đà; ô 33–64 có dấu nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n39
  cau: "Bảng Cấu trúc, A ô 1–16: bốn câu 4 ô; giai điệu đi xuống từ Fa♯ trên tay trái valse; poco rit. ở ô 14–15."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n41
  cau: "A ô 17–32: chủ đề lần hai; ô 32 rẽ sang Rê trưởng qua nốt Si♭."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n43
  cau: "B ô 33–48: con anima; câu 8 ô nói hai lần, lần hai đổi đường đi; kết trên hợp âm át bảy của Si thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n44
  cau: "Si♭ đầu đoạn B là một appoggiatura xuống La: nhấn rồi nhả."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n45
  cau: "A' ô 49–64: chủ đề với nốt lân cận nửa cung; cả ô 33–64 nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n46
  cau: "Trio ô 65–96: Si trưởng rồi Si thứ; dolce; câu 8 ô nói hai lần (65–80); lần hai bằng nốt kép, chủ yếu quãng ba (81–88; ô 85–88 xen quãng sáu); từ ô 89 về Si thứ; ô 94 có hợp âm sáu tăng dẫn về át âm."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n48
  cau: "A – B – A' ô 97–144: Si thứ, Rê trưởng, Si thứ; phần đầu trở lại, không nhắc lại; kết calando e dimin."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n49
  cau: "Ô 97: nốt trầm Si1, thấp hơn nốt Si3 của hợp âm hai quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n50
  cau: Hình thức tổng thể là ba phần, trio ở giữa như minuet hay scherzo (link Minuet và trio).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n51
  cau: Hợp âm ô 94 (Sol – Si – Đô♯ – Mi♯) là một hợp âm sáu tăng (link Napoli và sáu tăng).
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n52
  cau: Sol và Mi♯ tách ra hai phía về Fa♯; át âm ở ô 95.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n53
  cau: Đoạn trích theo ấn bản Peters (Scholtz, Mutopia), đã đối chiếu từng nốt; ngón và bàn đạp là của ấn bản ấy.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n54
  cau: Nốt Fa♯ ở phách 3 nối sang ô sau, không đánh lại; tay trái vào đúng phách 1 bên dưới.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n55
  cau: "Ô 5: Fa♯ – Sol – Mi♯ – Fa♯ là một láy quanh viết bằng móc đơn (link Nốt hoa mỹ); giai điệu bay lên Si và Rê."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n56
  cau: Ấn bản này ghi đạp ở phách 1 và nhả ở phách 3 mỗi ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n58
  cau: "Bảng Chỗ khó, bước nhảy tay trái: từ nốt trầm (Si2, La♯2, có lúc Si1 như ô 97) lên hợp âm quanh Fa♯3 – Rê4 trong một phách; hợp âm đổi thế gần như mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n61
  cau: Láy quanh và nốt nửa cung ở ô 5, ô 49–56 viết bằng nốt thường.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n63
  cau: "Chuỗi nửa cung đi xuống ô 48, ô 56: sáu móc đơn liền nhau qua phím trắng và phím đen."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n66
  cau: "Quãng ba tay phải ô 81–88: hai nốt vang cùng lúc và nối liền; nốt trên là giai điệu."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n68
  cau: "Nốt lặp nhịp chấm dôi (ô 69–72, 77–80): hai hoặc ba lần cùng một nốt."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n81
  cau: Moderato là vừa phải, không chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n83
  cau: Theo Carl Mikuli, một học trò của Chopin, ngay cả khi chơi rubato Chopin vẫn để tay đệm giữ nhịp thật đều.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n84
  cau: "Chỗ đáng nán: Fa♯ ngân đầu câu, bước nhảy Si – Rê ở ô 5, Rê cao có rf ở ô 6."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n85
  cau: Chỉ ở chỗ ghi rit. (như ô 14–15) hay calando cả hai tay mới chậm lại.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n86
  cau: Ấn bản Peters ghi đạp phách 1, nhả phách 3 gần như mọi ô, để trống ở các ô kết câu như ô 15–16 và 31–32.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n88
  cau: Ở trio, nốt trầm đổi từng ô (Si với La♯ hoặc Fa♯).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n90
  cau: Phần lớn bài nằm trong vùng p; dấu rf ở ô 6.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n92
  cau: Lần trở lại ở ô 97 được ấn bản Peters ghi f.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n93
  cau: "Những ô cuối calando e dimin.: chậm và nhỏ dần cùng lúc."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n94
  cau: Chi tiết giai điệu, trang trí, sắc thái có thể khác giữa các bản in vì bài có hai phiên bản.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n95
  cau: Henle (HN 131) in cả hai phiên bản; Ấn bản Quốc gia Ba Lan là một lựa chọn; bản Peters trên Mutopia miễn phí.
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n100
  cau: "Valse khó hơn: Valse Đô♯ thứ Op. 64 số 2 (Henle mức 6, bài này mức 4)."
  loai: cap-do
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n102
  cau: "Mục tiêu xa hơn: Fantaisie-Impromptu Op. 66, cũng được Fontana in năm 1855."
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n103
  cau: "Câu hỏi 1: trio ở Si trưởng (không phải Rê trưởng, Sol trưởng)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n104
  cau: "Câu hỏi 1, giải thích: đoạn B (ô 33–48) ở Rê trưởng; trio (ô 65–96) ở Si trưởng, rồi tối lại về Si thứ trước khi chủ đề trở lại."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n105
  cau: "Câu hỏi 2: trong ấn bản Peters, láy quanh ô 5 viết bằng nốt thường Fa♯ – Sol – Mi♯ – Fa♯, móc đơn (không phải ký hiệu láy hay nốt nhỏ)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n107
  cau: "Câu hỏi 3: rubato kiểu Chopin: giai điệu co giãn, tay trái giữ nhịp valse, thời gian nán được trả lại ngay."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n109
  cau: "Câu hỏi 4: Peters ghi đạp phách 1, nhả phách 3 ở phần lớn các ô."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n110
  cau: "Câu hỏi 4, giải thích: các ô kết câu như ô 15–16 không có bàn đạp."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n111
  cau: "Nguồn: IMSLP Waltzes Op. 69 (in 1852 ở Kraków, cùng Op. 70 số 2; ấn bản Fontana 1855) và bảng số của Ấn bản Quốc gia (WN 19: 1829, in 1852)."
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n112
  cau: "Nguồn: Henle HN 131, biên tập Ewald Zimmermann, mức khó 4, in cả hai phiên bản."
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n113
  cau: "Nguồn: ấn bản Peters (Scholtz), bản gõ lại của Roland Goretzki cho Mutopia: nguồn đoạn trích, số ô, sắc thái, bàn đạp."
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n114
  cau: "Nguồn: lời tựa Carl Mikuli (Kistner, Leipzig, 1879), Internet Archive: rubato, tay đệm giữ nhịp."
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n115
  cau: "Nguồn: Ấn bản Quốc gia Ba Lan (Wydanie Narodowe), biên tập Jan Ekier; bản nhạc IMSLP; link tài liệu tham khảo."
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n65
  cau: "Cân bằng hai tay: nốt trầm mp, hợp âm pp; tay phải hát (link Tạo tiếng đàn)."
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n21
  cau: Nghe trọn bài ít nhất ba lần, mỗi lần một câu hỏi (tay trái, rubato, màu giọng, dấu nhắc lại).
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n73
  cau: "Bài tập 1: nhảy sớm, đặt tay sẵn, đạp trễ, nhả ở phách 3; tập nhắm mắt."
  loai: khuyen-tap
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n1
  cau: Venetianisches Gondellied (Thuyền ca Venice) khép lại tập Lieder ohne Worte đầu tiên của Mendelssohn.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n2
  cau: Giai điệu Sol thứ hát bằng hai nốt cùng lúc trong tay phải, trên nhịp 6/8 đung đưa.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n4
  cau: Suốt phần chủ đề, giai điệu đi thành cặp quãng ba hay quãng sáu trong tay phải.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n7
  cau: "Kiểu đệm: nốt trầm, hợp âm, nốt giữa, hai lần mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n8
  cau: Đây là nhịp đung đưa của barcarolle, bài ca người chèo thuyền (link Thể loại).
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n10
  cau: "Nhịp chậm, hòa âm đổi theo nốt trầm ở đầu các nửa ô: môi trường để luyện bàn đạp nối (link Bàn đạp)."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n11
  cau: 46 ô nhịp có mở đầu, cao trào, chủ đề trở lại và coda.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n13
  cau: Mùa thu 1830, trong chuyến du hành lớn qua châu Âu, Mendelssohn, 21 tuổi, đến Venice.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n14
  cau: Theo lời tựa Henle, bản viết tay còn lại đề Auf einer Gondel và ghi ngày 16/10/1830; đây là bài thuyền ca duy nhất trong bốn bài được viết tại Venice.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n15
  cau: Ông định gửi nó làm quà đáp lễ cho Delphine von Schauroth ở München, người đã viết tặng ông một bài trong album; lá thư gửi ngày 17/10 bị thất lạc.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n16
  cau: Đầu năm 1832 Mendelssohn gom một loạt tiểu phẩm thành tập Lieder ohne Worte và chọn thuyền ca này làm bài cuối; tập in năm 1832 ở London (Novello) với tên Original Melodies for the Pianoforte, năm 1833 ở Paris và Bonn.
  loai: nam
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n17
  cau: Cả bộ gồm tám tập, mỗi tập sáu bài; hai tập cuối chỉ ra mắt sau khi ông mất.
  loai: so-lieu
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n18
  cau: Câu "Cái tên Lieder ohne Worte có lẽ do chính Mendelssohn nghĩ ra" và câu về vai trò của Fanny Mendelssohn.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n19
  cau: Câu "Phần lớn những cái tên gắn với từng bài do các nhà xuất bản thêm vào; Venetianisches Gondellied là một trong số rất ít tên của chính Mendelssohn".
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n20
  cau: "Mendelssohn dùng tên Venetianisches Gondellied thêm hai lần: Op. 30 số 6 (Fa♯ thứ, 1835) và Op. 62 số 5 (La thứ, in năm 1844)."
  loai: danh-muc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n21
  cau: Thuyền ca mô phỏng bài hát của người chèo gondola; ở bài này nhịp 6/8, tay trái đung đưa như mái chèo, giai điệu trải dài phía trên.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n23
  cau: Bài chỉ dài hai, ba phút.
  loai: so-lieu
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n24
  cau: "Câu hỏi nghe 1: nốt trầm sâu đầu mỗi nửa ô, hợp âm nhẹ ở giữa, giai điệu trên; hai nhịp chèo mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n26
  cau: "Câu hỏi nghe 3: ô 3–5 một giọng quanh Đô giữa cất lên Rê – Fa – Mi♭ – Rê, nốt Fa có sfz."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n27
  cau: "Câu hỏi nghe 4: chủ đề quay về cuối ô 34; điều gì mới xen vào."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n28
  cau: "Câu hỏi nghe 5: nốt Sol trầm cuối cùng."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n32
  cau: "Theo dõi, Mở đầu (ô 1–6): tay trái đung đưa trên Sol trầm; ô 3–5 tiếng gọi Rê – Fa – Mi♭ – Rê; bè trầm Sol – Fa – Si♭ – Đô – Rê, dừng trên hợp âm Rê (át)."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n33
  cau: "Theo dõi, Câu 1 (nhịp lấy đà cuối ô 7 – ô 11): vào bằng quãng ba, cantabile, đi xuống rồi dừng ở nốt Rê dài."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n34
  cau: "Theo dõi, Câu 2 (cuối ô 11 – ô 17): mở đầu như câu 1, rồi vươn lên, sfz ở ô 15; kết ở Rê thứ."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n35
  cau: "Theo dõi, Đoạn B (ô 18–25): sang Đô thứ, tay phải vừa hát vừa đệm; ô 22–23 pp trên hợp âm bảy giảm; ô 25 hợp âm Rê trưởng rồi nốt Rê lặp."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n36
  cau: "Theo dõi, Cao trào (ô 26–33): hình staccato nhỏ lặp lại, sfz ở ô 31; ô 32–33 tay trái nhại giai điệu; về Sol thứ ở ô 34."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n37
  cau: "Theo dõi, Chủ đề trở lại (cuối ô 34 – ô 39): mf, xen quãng tám Rê cao; nhỏ dần tới pp."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n38
  cau: "Theo dõi, Coda (ô 40–46): tiếng gọi Fa – Mi♭ – Rê trở lại pp, nhịp chèo thưa dần, nốt Sol rất trầm cuối cùng với dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n39
  cau: Số ô theo ấn bản Breitkopf & Härtel (Mutopia); mỗi câu bắt đầu bằng nhịp lấy đà ở móc đơn cuối của ô trước.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n40
  cau: "Bảng Cấu trúc, Mở đầu 1–6: như dòng Theo dõi (tiếng gọi, bè trầm, dừng trên át)."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n41
  cau: "Mở đầu: đặt tốc độ ngay từ ô đầu; sfz ở ô 3 là nhấn trong p."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n42
  cau: "A câu 1, 7–11: vào bằng quãng ba rồi quãng sáu (cantabile), đi xuống, dừng ở Rê4 dài; Sol ở bè trầm lặp ở mọi nửa ô: âm nền chủ âm; hòa âm bên trên đổi màu."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n43
  cau: "A câu 2, 11–17: mở đầu như câu 1 trong khi Rê4 vẫn giữ; crescendo tới sfz ở ô 15, kết ở Rê thứ (ô 17)."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n45
  cau: "B 18–25: Đô thứ; giai điệu và hợp âm đệm cùng tay phải; ô 22–23 pp trên hợp âm bảy giảm; ô 24 hợp âm sáu tăng dẫn tới Rê trưởng và chuỗi Rê lặp (ô 25)."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n46
  cau: "B: tay phải làm hai việc; nốt Rê lặp to dần rồi nhỏ dần."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n47
  cau: "B tiếp 26–33: hình staccato nhỏ (Rê – Si♭ – Mi♭ rồi một nốt dài) ở ô 26, 27, 30, 31; sfz ở ô 31; ô 32–33 tay trái nhại giai điệu thấp hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n49
  cau: "A' 34–39: chủ đề trở lại, mf; quãng tám Rê cao xen giữa các nốt giai điệu; dim. rồi pp."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n51
  cau: "Coda 40–46: tiếng gọi Fa – Mi♭ – Rê trở lại pp trên bè trầm Fa – Si♭ – Đô – Rê; nhịp chèo thưa dần, kết trên Sol1 có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n53
  cau: Hình thức tổng thể ba phần có mở đầu và coda (link Hình thức nhỏ).
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n54
  cau: "Đoạn B không đưa ra chủ đề mới mà làm giai điệu căng lên bằng hòa âm: hợp âm bảy giảm và hợp âm sáu tăng (link Hợp âm bảy, Napoli và sáu tăng)."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n55
  cau: Đoạn trích ô 7–11 chép theo Mutopia (Breitkopf & Härtel 1874–77), đã đối chiếu từng nốt; không ghi số ngón.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n56
  cau: Giai điệu đi thành quãng ba ở ô 8 và 10, quãng sáu ở ô 9.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n57
  cau: Nốt Sol trầm lặp đầu mỗi nửa ô trong khi hòa âm bên trên đổi; ô 8 là hợp âm át trên nốt Sol.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n58
  cau: "Ô 11: Rê4 kết câu 1 được giữ sang ô 12 trong khi câu 2 bắt đầu từ nhịp lấy đà; ngón cái giữ phím."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n59
  cau: "Bảng Chỗ khó, nhịp chèo tay trái: nốt trầm cách hợp âm hơn một quãng tám; hợp âm phách yếu dễ to; dễ đếm sáu."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n61
  cau: Giai điệu quãng ba, quãng sáu ở ô 7–17 và 34–39; ngón 1–2 khỏe nên nốt dưới dễ to.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n63
  cau: "Nốt Rê4 giữ dưới câu 2 (ô 11–12): ngón cái giữ phím suốt hai ô trong khi ngón 2–5 chơi quãng ba bên trên."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n65
  cau: "Giai điệu và hợp âm đệm cùng tay phải (ô 18–24, 26–31): giai điệu vào phách, hợp âm đệm giữa phách."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n67
  cau: "Staccato và nốt Rê lặp (ô 25–31): staccato dưới dấu luyến (portato); chuỗi Rê ở ô 25 to dần rồi nhỏ dần."
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n69
  cau: Ba chỗ sfz (ô 3, 15, 31) nằm giữa nền p.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n70
  cau: 'sfz ở đây là "nhấn so với xung quanh": thêm trọng lượng rồi diminuendo ngay.'
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n71
  cau: "Tay trái nhại giai điệu (ô 32–33): tay trái lên vùng giữa."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n73
  cau: "Quãng tám Rê xen giữa chủ đề (ô 36–39): tay phải nhảy từ quãng ba, quãng sáu lên quãng tám cao rồi về."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n75
  cau: "Coda (ô 40–46): kết cấu thưa dần."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n77
  cau: Bài tập soạn riêng cho trang, ở Sol thứ để quen hai dấu giáng (Si♭, Mi♭) và cảm âm Fa♯.
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n86
  cau: Andante sostenuto nghĩa là đi thong thả và ngân giữ.
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n87
  cau: Bản Breitkopf & Härtel không ghi số máy đếm nhịp.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n91
  cau: Khi giai điệu đi bậc liền trong cùng nửa ô (như ô 8, 10), nhấc nửa chừng nhanh.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n92
  cau: Bản Breitkopf & Härtel ghi giữ bàn đạp suốt ô 22–23 (hợp âm bảy giảm, pp); từ chỗ chủ đề trở lại ghi sempre Ped.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n93
  cau: "Đoạn staccato (ô 26–31): đạp ngắn để bắt quãng tám ở bè trầm."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n95
  cau: Gần như cả bài trong p và pp; chữ mf duy nhất khi chủ đề trở lại (nhịp lấy đà cuối ô 34); ba sfz là chỗ nhấn trong nền nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n96
  cau: Mỗi câu bắt đầu bằng nhịp lấy đà dẫn vào phách đầu ô sau.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n98
  cau: Bản Breitkopf không ghi ritardando ở cuối; kết cấu tự thưa dần ở ô 44–46.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n99
  cau: Henle in cả trọn bộ Lieder ohne Worte lẫn tập riêng bốn bài thuyền ca (HN 1172).
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n100
  cau: Bản Breitkopf & Härtel 1874–77 (Mutopia, miễn phí) dùng được để đối chiếu nốt.
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n103
  cau: "Hai bài Venetianisches Gondellied còn lại: Op. 30 số 6 (Fa♯ thứ), Op. 62 số 5 (La thứ), Henle mức 5; HN 1172 in cả bốn bài thuyền ca (thêm Gondellied La trưởng, không số opus)."
  loai: cap-do
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n108
  cau: "Câu hỏi 1: viết ở Venice năm 1830, bản viết tay đề Auf einer Gondel (không phải Leipzig 1845, London 1832)."
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n109
  cau: "Câu hỏi 1, giải thích: bản viết tay ghi 16/10/1830; in năm 1832–1833, làm bài cuối tập Lieder ohne Worte đầu tiên."
  loai: nam
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n111
  cau: "Câu hỏi 2, giải thích: nốt trầm rơi vào đầu mỗi nửa ô; hợp âm và nốt giữa trôi theo."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n113
  cau: "Câu hỏi 4: theo Breitkopf & Härtel, chữ mf duy nhất ở nhịp lấy đà khi chủ đề trở lại, cuối ô 34; giải thích: phần còn lại hầu như p, pp; sfz là chỗ nhấn trong nền nhỏ."
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n114
  cau: "Nguồn: Henle HN 1172, mức khó (19,6: 4; 30,6 và 62,5: 5), lời tựa Ullrich Scheideler (2012)."
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n115
  cau: "Nguồn: Britannica, Songs Without Words (Betsy Schwarm): 48 bài, tám tập, hai tập cuối in sau khi ông mất, Original Melodies 1832."
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n116
  cau: "Nguồn: Mutopia 1679 (Ryan Prince, CC BY 3.0, theo Breitkopf & Härtel 1874–77)."
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n117
  cau: "Bản nhạc: IMSLP (Lieder ohne Worte Op.19); link tài liệu tham khảo."
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n102
  cau: "Lỗi thường gặp (tám dòng): hai nốt quãng ba bằng nhau; hợp âm to hơn nốt trầm; nốt trầm hụt; bàn đạp chồng; sfz như f; staccato bị nuốt; quãng tám Rê ô 36–39 to; chậm dần từ đầu coda."
  loai: khuyen-tap
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n3
  cau: "Mục tiêu trang: bè trên hát, bè dưới thì thầm; tay trái chèo đều mà nhẹ; bàn đạp trong."
  loai: khuyen-tap
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n89
  cau: "Các lớp âm thanh: bè trên cantabile; bè dưới nhỏ; nốt trầm sâu và nhẹ; hợp âm đệm nhỏ nhất; mốc mp/p/pp."
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-k545
  id: n1
  cau: 'Tiêu đề: "Mozart: Sonata Đô trưởng, K. 545".'
  loai: ten
- trang: piano/tac-pham/mozart-k545
  id: n2
  cau: Chính Mozart ghi bài này là sonata "cho người mới học".
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n4
  cau: Chương 1 là một hình thức sonata hoàn chỉnh trong 73 ô nhịp, trình bày, phát triển, tái hiện đều ngắn và rõ (link hình thức sonata).
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n5
  cau: Đệm Alberti là hợp âm rải theo thứ tự trầm – cao – giữa – cao.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n6
  cau: Alberti là lối đệm rất hay gặp trong nhạc piano thế kỷ 18; tập cho đều và nhẹ ở bài này thì dùng lại được ở nhiều bài khác.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n7
  cau: Các chuỗi gam ở đoạn chuyển và phần phát triển (link Gam).
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n11
  cau: Mùa hè 1788 là một giai đoạn sáng tác rất sung sức của Mozart.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n12
  cau: Cùng ngày ghi K. 545 vào danh mục (26/6/1788), Mozart ghi cả Giao hưởng số 39.
  loai: nam
- trang: piano/tac-pham/mozart-k545
  id: n13
  cau: Trong vài tuần sau đó ông hoàn thành hai giao hưởng cuối cùng, số 40 và số 41.
  loai: nam
- trang: piano/tac-pham/mozart-k545
  id: n14
  cau: Gần như không biết gì về hoàn cảnh ra đời của bài, kể cả "người mới học" là ai.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n15
  cau: Ngày 2 tháng 8, Mozart gửi cho chị gái "những bài piano mới nhất" của mình, trong đó hẳn có K. 545.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n16
  cau: Bản thảo viết tay đã thất lạc.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n17
  cau: Ấn bản đầu tiên, do Bureau d'Arts et d'Industrie in ở Vienna năm 1805, đặt tên Sonate facile; cái tên "dễ" là của nhà xuất bản, không phải của Mozart.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n18
  cau: Theo lời tựa Henle, các nguồn gốc không có một ký hiệu sắc thái nào, khác hẳn những sonata khác của ông.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n19
  cau: Mọi chữ p, f trong bản nhạc phổ thông đều do người biên tập thêm; bạn phải tự quyết định sắc thái.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n20
  cau: Đàn của Mozart là fortepiano kiểu Vienna; khi qua đời ông có một cây đàn của Anton Walter.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n21
  cau: Âm vực đàn kiểu Walter hơn năm quãng tám một chút, từ Fa1 đến Sol6; bộ giảm âm nhấc bằng cần gạt đầu gối.
  loai: so-lieu
- trang: piano/tac-pham/mozart-k545
  id: n23
  cau: Ba câu hỏi khi nghe; ô 42 chủ đề mở đầu quay lại ở một giọng khác.
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n26
  cau: "Chương 1, chủ đề 1 (ô 1–4): giai điệu đơn giản trên đệm Alberti của tay trái; láy rền ở ô 4."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n27
  cau: "Đoạn chuyển (ô 5–12): chuỗi gam móc kép đi xuống trên hợp âm tay trái; dừng trên hợp âm Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n28
  cau: "Chủ đề 2 (ô 13–25): Sol trưởng; tay trái mở đầu bằng hình móc kép lắc qua lại (ô 13), giai điệu mới có láy rền (ô 14–15); láy rền dài trước kết (ô 25)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n29
  cau: "Kết trình bày (ô 26–28): hợp âm rải móc kép, rồi ba hợp âm kết ở Sol trưởng; cả phần trình bày nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n30
  cau: "Phát triển (ô 29–41): chất liệu kết trình bày đi qua Sol thứ, Rê thứ, La thứ; chuỗi gam lên xuống."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n31
  cau: "Tái hiện (ô 42): chủ đề 1 ở Fa trưởng (giọng hạ át); đoạn chuyển đưa nhạc về Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n32
  cau: "Chủ đề 2 ở Đô trưởng (ô 58–73): láy rền dài, rồi kết chương; bản nhạc có dấu nhắc lại cho phát triển và tái hiện."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n33
  cau: "Chương 2, Andante: Sol trưởng, giai điệu hát trên lớp Alberti; phần giữa tối lại ở Sol thứ, rồi chủ đề trở về và một coda ngắn."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n34
  cau: "Chương 3, Rondo: tay trái bắt chước tay phải như trò đuổi bắt; đoạn xen ở Sol trưởng, đoạn giữa ở La thứ, rồi chủ đề quay lại và kết."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n35
  cau: Chương 1, Allegro, 73 ô nhịp; số ô theo bản Urtext, các sách phân tích có thể lệch nhau một ô ở ranh giới.
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n36
  cau: "Bảng Cấu trúc chương 1 (bảy hàng: 1–4, 5–12, 13–25, 26–28, 29–41, 42–57, 58–73) với nội dung và giọng như bảng Theo dõi."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n37
  cau: "Chương 2, Andante (Sol trưởng, 3/4): tay trái đệm Alberti gần như suốt chương."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n38
  cau: "Chương 2: phần đầu dài mười sáu ô nhịp (chủ đề tám ô rồi tám ô tiếp nối), có nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n39
  cau: "Chương 2: phần thứ hai mở ở giọng át rồi quay về; phần giữa tối lại ở Sol thứ, đi qua Si♭ trưởng và Đô thứ, trước khi chủ đề trở về và một coda ngắn."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n41
  cau: "Chương 3, Rondo (Đô trưởng, 2/4): có chỗ tay trái bắt chước tay phải; đoạn xen thứ nhất ở Sol trưởng (lại có Alberti), đoạn giữa ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n42
  cau: Chương 3 ngắn, khoảng 1,5 phút.
  loai: so-lieu
- trang: piano/tac-pham/mozart-k545
  id: n43
  cau: Chương 3 nhanh và đòi hỏi hai tay ngang tài nhau.
  loai: cap-do
- trang: piano/tac-pham/mozart-k545
  id: n45
  cau: Cổ tay cứng khi chơi Alberti gây mỏi; rải với cổ tay xoay nhẹ, không nhấc ngón cao.
  loai: quy-tac
- trang: piano/tac-pham/mozart-k545
  id: n47
  cau: Láy rền dài có nốt kết ở cuối trình bày và tái hiện; viết ra số nốt, bắt đầu từ nốt trên, nốt kết là hai nốt cuối (link Nốt hoa mỹ).
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n54
  cau: Tăng dần từ ♩ = 72 lên ♩ = 116 qua vài tuần, không bao giờ để cổ tay cứng.
  loai: quy-tac
- trang: piano/tac-pham/mozart-k545
  id: n60
  cau: Allegro nghĩa là vui, nhanh; thời Mozart là nhanh vừa, không phải chạy đua.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n65
  cau: Láy rền thời Cổ điển thường bắt đầu từ nốt trên.
  loai: quy-tac
- trang: piano/tac-pham/mozart-k545
  id: n66
  cau: Các láy rền dài kết thúc bằng hai nốt kết đã viết sẵn.
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n67
  cau: Acciaccatura (nốt nhỏ gạch chéo) chơi ngắn, sát phách.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n68
  cau: "Ấn bản: mọi p, f, sf, cresc. trong một ấn bản (như bản IMSLP mà Mutopia chép lại) là của người biên tập; dùng bản Urtext."
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n75
  cau: "Câu hỏi 1: ở ô 42 chủ đề 1 trở lại ở Fa trưởng, giọng hạ át; đoạn chuyển sau đó đưa nhạc về Đô."
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n76
  cau: "Câu hỏi 2: đệm Alberti là hợp âm rải theo thứ tự trầm – cao – giữa – cao."
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n78
  cau: "Câu hỏi 4: các nguồn gốc không có một ký hiệu sắc thái nào; mọi p, f trong bản phổ thông là của người biên tập."
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n79
  cau: "Mục Nguồn: lời tựa Henle HN 164 (ngày ghi danh mục, ấn bản 1805, không có sắc thái, K. 547a không phải của Mozart)."
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n64
  cau: "Bàn đạp: hầu như không cần; không dùng để nối chuỗi gam (link Bàn đạp)."
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-k545
  id: n50
  cau: "Tốc độ ổn định: chọn tốc độ của đoạn khó nhất, thu âm rồi đo (link thu âm)."
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-k545
  id: n49
  cau: "Hai tay lệch nhau: tập với máy đếm nhịp theo phách đen, rồi phách trắng (link máy đếm nhịp)."
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-traumerei
  id: n1
  cau: Träumerei (Mơ màng) chỉ có 24 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n2
  cau: "Bài là một bài học lớn về nhiều giọng trong hai bàn tay: giai điệu, bè trong, bè trầm đan vào nhau như một bản hợp xướng nhỏ."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n4
  cau: 'Đây là bước tiếp sau những bài "giai điệu tay phải, đệm tay trái": một bàn tay thường phải vừa hát vừa đệm.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n6
  cau: Mỗi câu bốn ô nhịp là một hơi thở; cả bài là một vòng cung lớn.
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n8
  cau: Hai, ba phút nhạc; có thể dành sáu tuần.
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n9
  cau: Schumann viết Kinderszenen năm 1838, khi đang yêu Clara Wieck; câu chuyện ở hướng dẫn nghe (link).
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n10
  cau: Đây là nhạc về tuổi thơ cho người lớn, không phải nhạc cho trẻ em.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n11
  cau: Nhạc cho người trẻ tập đàn là Album für die Jugend Op. 68, Schumann viết mười năm sau (link Album cho tuổi trẻ).
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n12
  cau: Các tên bài, theo lời Schumann, chỉ là những gợi ý tinh tế cho cách chơi và cách hiểu.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n13
  cau: Träumerei đứng đúng giữa chu trình, bài thứ 7 trên 13.
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n14
  cau: Số máy đếm nhịp ♩ = 100 có từ ấn bản đầu tiên (trong một lần in lại), và Schumann đã để nguyên khi duyệt bản in.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n15
  cau: Con số này nhanh hơn nhiều so với thói quen chơi rất chậm sau này.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n16
  cau: Michael Struck, chuyên gia về Schumann và biên tập viên của Henle, cho rằng chuyện "máy đếm nhịp của Schumann bị hỏng" là huyền thoại; Henle in con số này như chỉ dẫn của tác giả.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n17
  cau: Clara Schumann, trong ấn bản của bà, gợi ý chậm hơn (♩ = 80).
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n21
  cau: Horowitz chơi bài này ở cuối buổi hòa nhạc trở lại Carnegie Hall ngày 9/5/1965 và trong buổi diễn ở Moskva năm 1986; cả hai buổi đều có đĩa thu trực tiếp.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n22
  cau: So sánh tốc độ của Horowitz với ♩ = 100 và với bản thu trọn Kinderszenen của nghệ sĩ khác (ví dụ Martha Argerich, Deutsche Grammophon).
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n25
  cau: "Theo dõi, Câu 1 (nhịp lấy đà, ô 1–4): từ Đô giữa, giai điệu đi lên theo hợp âm rải rồi giữ Fa cao; trong lúc Fa ngân, bè tenor tay trái đáp lời."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n26
  cau: "Theo dõi, Câu 2 (ô 5–8): cùng cử chỉ mở đầu, lên cao hơn tới La; ritard. ở cuối ô 8."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n27
  cau: Theo dõi, Đoạn A nhắc lại (ô 1–8).
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n28
  cau: "Theo dõi, Câu 3 (ô 9–12): mở đầu như cũ nhưng hòa âm tối lại, hướng về Sol thứ; đường nét bè trong chuyền giữa hai tay."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n29
  cau: "Theo dõi, Câu 4 (ô 13–16): lên cao hơn, qua Si♭ trưởng rồi Rê thứ; ritard. ở ô 16."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n30
  cau: "Theo dõi, Câu 5 (ô 17–20): chủ đề trở lại nguyên vẹn, mềm hơn, như một kỷ niệm."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n31
  cau: "Theo dõi, Câu 6 và fermata (ô 21–24): giai điệu lên La; hợp âm đỉnh mang dấu ngân (fermata) duy nhất của bài."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n32
  cau: "Theo dõi, Kết: ritardando, khép lại ở Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n33
  cau: "Bảng Cấu trúc, A nhịp lấy đà 1–4: câu 1 từ Đô giữa, đi lên theo hợp âm rải, giữ Fa cao; bè trong tay trái đáp lời."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n34
  cau: "A 1–4: đỉnh câu ở phách 2 của ô 2; trong khi Fa giữ, bè tenor đi xuống."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n35
  cau: "A 5–8: cùng mở đầu, lên tới La; xuất hiện nốt thăng đầu tiên."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n36
  cau: "A 5–8: ritard. ở cuối ô 8 trước khi nhắc lại hay sang B."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n38
  cau: "B 9–12: câu 3, hòa âm tối lại, hướng về Sol thứ; các đường nét bè trong chuyền từ tay trái sang tay phải."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n39
  cau: "B 13–16: câu 4 lên cao hơn qua Si♭ trưởng rồi Rê thứ; ritard. ở ô 16, ngay trước khi chủ đề trở lại."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n40
  cau: "A' 17–20: câu 5, chủ đề trở lại nguyên vẹn."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n42
  cau: "A' 21–24: câu 6 lên La, hợp âm đỉnh có dấu ngân (fermata) duy nhất, rồi ritardando về kết."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n44
  cau: "Mỗi câu đều bắt đầu bằng cùng một cử chỉ: hợp âm rải đi lên từ nhịp lấy đà; nhớ sáu cách cử chỉ ấy đi tiếp."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n46
  cau: "Chỗ khó, nốt dài của giai điệu (ô 2, ô 6…): Fa cao tắt dần trong khi các bè khác tiếp tục."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n48
  cau: "Chỗ khó, bè tenor trong tay trái: tenor và bè trầm cùng một tay; tập riêng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n51
  cau: "Chỗ khó, nốt hoa mỹ rải ở tay trái (ô 2, ô 6): chơi ngay trước phách, nhẹ."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n52
  cau: "Chỗ khó, ritardando và fermata: chỉ chậm ở ba chỗ có ghi."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n62
  cau: Schumann chỉ ghi ritard. ở ba chỗ, nơi các đoạn nối vào nhau, và chỉ một fermata, ngay trước câu kết.
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n65
  cau: Dải sắc thái hẹp (p là chủ yếu, bản nhạc bắt đầu p).
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n67
  cau: "Ấn bản của Clara Schumann đổi các số máy đếm nhịp (Träumerei: ♩ = 80); dùng bản Urtext để thấy ký hiệu của bản in đầu."
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n69
  cau: "Học tiếp, cùng chu trình: Von fremden Ländern und Menschen (bài 1) và Der Dichter spricht (bài 13)."
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n74
  cau: "Câu hỏi 1: đoạn A đầu tiên (ô 1–8) được nhắc lại; giải thích: A (nhắc lại) – B – A', 24 ô, sáu câu bốn ô, câu nào cũng mở bằng hợp âm rải đi lên từ nhịp lấy đà."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n76
  cau: "Câu hỏi 3: số máy đếm nhịp in cho Träumerei là ♩ = 100."
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n77
  cau: "Câu hỏi 3, giải thích: Clara Schumann về sau gợi ý chậm hơn, ♩ = 80."
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n78
  cau: "Câu hỏi 4: Schumann ghi ritard. chỉ ở ba chỗ, nơi các đoạn nối vào nhau; giải thích: phần còn lại chạy liền mạch."
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n79
  cau: "Nguồn: Henle HN 44 (lời tựa Herttrich 2007, Comments); bài viết Seiffert; phỏng vấn Struck và Henle Blog 2021; bản nhạc Mutopia và Peters (Internet Archive); đĩa Horowitz 1965 (Sony) và 1986 (DG)."
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n80
  cau: "Bản nhạc: IMSLP; link tài liệu tham khảo."
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n68
  cau: "Lỗi thường gặp (bảy dòng): hợp âm to bằng nhau; ngón cái gõ; chậm ở cuối mọi câu; quá chậm; bàn đạp muộn; nốt hoa mỹ rơi đúng phách; đỉnh quá to."
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-traumerei
  id: n3
  cau: Trang hướng dẫn cách tập để mỗi bè hát đúng vị trí, câu nhạc dài, nhịp tự do có chừng mực.
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-traumerei
  id: n64
  cau: "Âm thanh và cân bằng: giai điệu cantabile; bè trong và tenor có đường nét; bè trầm sâu nhẹ."
  loai: khuyen-tap
