- trang: nghe-nhac/liszt-liebestraum
  id: n1
  cau: 'Tiêu đề: Liszt, Liebestraum số 3 ("Giấc mơ tình yêu").'
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n2
  cau: "Mô tả trang: Liszt là một trong những nghệ sĩ piano lừng lẫy nhất thế kỷ 19 và người khai sinh thơ giao hưởng; một trong những bản được yêu thích nhất của ông là một bài hát không lời."
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n3
  cau: "Nhà soạn nhạc: Franz Liszt (1811–1886)."
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n4
  cau: "Tên đầy đủ: Liebesträume (Những giấc mơ tình yêu), ba notturno cho piano, S. 541; số 3 cung La♭ trưởng, O lieb, so lang du lieben kannst."
  loai: danh-muc
- trang: nghe-nhac/liszt-liebestraum
  id: n5
  cau: "Sáng tác: ca khúc gốc viết năm 1843, in năm 1847; bản cho piano in năm 1850."
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n6
  cau: "Thời kỳ: Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n7
  cau: "Thể loại: notturno (nocturne) cho piano, chuyển soạn từ một ca khúc của chính Liszt."
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n8
  cau: "Độ dài: khoảng 4–5 phút."
  loai: so-lieu
- trang: nghe-nhac/liszt-liebestraum
  id: n9
  cau: Liszt là một trong những nghệ sĩ piano lừng lẫy nhất thế kỷ 19.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n10
  cau: Liszt là người khai sinh thơ giao hưởng.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n12
  cau: Một trong những bản được yêu thích nhất của Liszt lại là một bài hát không lời.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n13
  cau: Năm 1843 Liszt phổ bài thơ O lieb, so lang du lieben kannst của nhà thơ Đức Ferdinand Freiligrath cho giọng hát và piano.
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n14
  cau: 'Dịch tên bài thơ: "Hãy yêu, khi bạn còn có thể yêu".'
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n15
  cau: "Năm 1850 Liszt in ba Liebesträume cho piano, mỗi bản là một notturno chuyển soạn từ ca khúc của mình: hai bản đầu theo thơ Ludwig Uhland, bản thứ ba theo thơ Freiligrath."
  loai: nam
- trang: nghe-nhac/liszt-liebestraum
  id: n16
  cau: Henle gọi bản số 3 là một trong những bản nhạc piano được chơi nhiều nhất.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n17
  cau: "Bài thơ không kể một giấc mơ ngọt ngào mà là một lời nhắc: hãy yêu thương khi còn có thể, vì sẽ đến lúc ta đứng bên nấm mồ mà than khóc."
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n18
  cau: "Bài thơ dặn giữ gìn lời nói: một lời cay nghiệt dù không cố ý vẫn khiến người kia bỏ đi trong nước mắt."
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n19
  cau: Liszt ghi tốc độ Poco allegro, con affetto (hơi nhanh, trìu mến).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n20
  cau: Nhịp 6/4, hai phách lớn mỗi ô.
  loai: dinh-nghia
- trang: nghe-nhac/liszt-liebestraum
  id: n21
  cau: Nhiều bản thu chơi chậm và ủy mị hơn thế nhiều.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n23
  cau: Trong nocturne của Chopin (Op. 9 số 2), giai điệu hát ở trên cùng.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n25
  cau: "Ở đây phần mở đầu đặt giai điệu ở âm vực giữa, như một giọng nam cao: dưới là nốt trầm, trên là hợp âm rải nhẹ."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n26
  cau: Hợp âm rải nhẹ chia cho hai tay.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n28
  cau: Giai điệu chuyền qua lại giữa hai tay và phần lớn do ngón cái của hai tay đảm nhận.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n31
  cau: Giai điệu xuất hiện ba lần, mỗi lần một cách phối khác, ngăn cách bởi hai cadenza (chuỗi nốt chạy liền không chia vạch nhịp, cho người chơi tự do co giãn).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n32
  cau: Sau cadenza thứ nhất giai điệu trở lại ở Si trưởng, một giọng khá xa La♭ trưởng, với chỉ dẫn più animato con passione (sôi nổi hơn, say mê).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n33
  cau: "Rồi nhạc dồn dập (sempre stringendo), chuyển giọng liên tục để lên cao trào: giai điệu vang bằng quãng tám rồi tan thành hợp âm rải."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n34
  cau: Cadenza thứ hai, những chuỗi nốt nhẹ (leggiero) trôi xuống, đưa nhạc về La♭ trưởng cho lần hát cuối, dịu dàng (dolce armonioso).
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n36
  cau: "Theo dõi, mở đầu La♭ trưởng: giai điệu ở âm vực giữa, rất êm; dưới là nốt trầm, trên là hợp âm rải nhẹ."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n37
  cau: "Theo dõi, câu tiếp theo: giai điệu phát triển, dâng lên rồi lắng xuống, chuẩn bị cho cadenza."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n38
  cau: "Theo dõi, cadenza thứ nhất: chuỗi nốt chạy liền, nhẹ, không chia vạch nhịp, như bước vào giấc mơ."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n39
  cau: "Theo dõi, giai điệu ở Si trưởng: sáng hơn, say mê hơn (più animato con passione)."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n40
  cau: "Theo dõi, dồn lên: nhạc nhanh dần, chuyển giọng liên tục; hai tay nhảy những bước xa."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n41
  cau: "Theo dõi, cao trào: giai điệu vang bằng quãng tám, rồi tan ra thành hợp âm rải."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n42
  cau: "Theo dõi, lắng xuống; cadenza thứ hai: những chuỗi nốt nhẹ (leggiero) trôi xuống."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n43
  cau: "Theo dõi, trở về La♭ trưởng: giai điệu lại ở giữa; tay trái vắt qua tay phải để chạm những hợp âm cao, mỏng."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n44
  cau: "Theo dõi, kết: giai điệu tan dần, khép lại thật khẽ."
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n46
  cau: Jorge Bolet có bản thu Liebestraum số 3 cho Decca, cạnh nhiều bản Liszt khác trong bộ đĩa Decca của ông.
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n48
  cau: Cây đàn Bechstein Liszt nhận khoảng năm 1881–1882, đặt tại Nhà Liszt ở Weimar, được phục chế và chơi lại từ tháng 10/2024.
  loai: lich-su
- trang: nghe-nhac/liszt-liebestraum
  id: n51
  cau: Leslie Howard thu âm toàn bộ nhạc piano độc tấu của Liszt cho Hyperion; tập 19 đặt Liebesträume cạnh hai tập ca khúc Liszt tự chuyển soạn cho piano.
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n52
  cau: Ca khúc gốc (S. 298) do giọng nữ cao hoặc nam cao hát.
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n56
  cau: Bài ở mức sau Grade 8.
  loai: cap-do
- trang: nghe-nhac/liszt-liebestraum
  id: n57
  cau: Cái khó nằm ở sự cân bằng (ngón cái hát, các ngón khác rải nhẹ), rồi hai cadenza và đoạn cao trào với quãng tám ở cả hai tay.
  loai: cau-truc
- trang: nghe-nhac/liszt-liebestraum
  id: n60
  cau: "Mục Nguồn: IMSLP, Henle HN 634 và lời tựa, PTNA, bản in đầu (BSB), lời thơ ở Oxford Song."
  loai: ten
- trang: nghe-nhac/liszt-liebestraum
  id: n45
  cau: Câu hỏi để nghe chủ động (năm câu).
  loai: khuyen-tap
- trang: nghe-nhac/liszt-liebestraum
  id: n53
  cau: Biết lời rồi, bạn sẽ nghe bản piano khác đi.
  loai: khuyen-tap
- trang: nghe-nhac/liszt-liebestraum
  id: n49
  cau: Nếu tìm được bản thu trên cây đàn này, nghe xem tiếng đàn thế kỷ 19 khác đàn hiện đại ở đâu.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-ballade-1
  id: n1
  cau: Ballade số 1 dài khoảng chín, mười phút.
  loai: so-lieu
- trang: piano/tac-pham/chopin-ballade-1
  id: n2
  cau: Bài có hai chủ đề gặp nhau, biến đổi, đổi giọng, rồi kết bằng một coda nhanh, dữ dội.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n3
  cau: Đây là bài ở trình độ diploma.
  loai: cap-do
- trang: piano/tac-pham/chopin-ballade-1
  id: n6
  cau: "Cùng một giai điệu có thể thì thầm rồi bùng nổ fortissimo: chủ đề 2 vào sotto voce ở ô 68 rồi trở lại ff ở La trưởng và Mi♭ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n7
  cau: Bài có tiếng hát, hợp âm dày, quãng tám, nhảy xa, lướt nhẹ, bàn đạp nhiều tầng.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n9
  cau: Henle gọi đây là một trong những tác phẩm được yêu thích nhất của Chopin và ghi bài thuộc danh sách thi bằng LRSM của ABRSM.
  loai: cap-do
- trang: piano/tac-pham/chopin-ballade-1
  id: n11
  cau: Coda có thể gây đau cổ tay, cẳng tay nếu tập sai hay tập quá sớm; đọc trang Giữ đôi tay khỏe.
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n12
  cau: Chopin là người đầu tiên đặt tên ballade cho một tác phẩm khí nhạc không lời.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n13
  cau: Chữ ballade vốn chỉ một thể thơ kể chuyện, nhiều khi là truyền thuyết, được các nhà thơ Lãng mạn ưa chuộng.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-ballade-1
  id: n14
  cau: Lịch sử sáng tác ít tài liệu; hợp đồng in với Breitkopf & Härtel ký ngày 9/1/1836 nên bài xong năm 1835, ở Paris; IMSLP ghi một bản đầu có thể từ năm 1831, kèm dấu hỏi.
  loai: nam
- trang: piano/tac-pham/chopin-ballade-1
  id: n15
  cau: Từ năm 1831 Chopin sống ở Paris cho đến khi mất.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n16
  cau: Schumann, thư gửi Heinrich Dorn ngày 14/9/1836, khen đây là một trong những tác phẩm xuất sắc nhất của Chopin; khi ông nói mình thích nó nhất, Chopin lặng nghĩ rồi đáp ông cũng thích nó nhất.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n17
  cau: Schumann thuật lại rằng Chopin nói các ballade được gợi hứng từ thơ của Adam Mickiewicz, nhà thơ Ba Lan cũng sống ở Paris và quen Chopin.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n18
  cau: Không có lời nào của Chopin còn lại cho thấy ông muốn chuyển nội dung một bài thơ cụ thể của Mickiewicz vào Ballade số 1; liên hệ với một bài thơ cụ thể là suy đoán của người đời sau.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n20
  cau: Trong phim The Pianist (2002) của Roman Polanski, Szpilman chơi bài này cho sĩ quan Đức Wilm Hosenfeld; tiếng piano trong phim là của Janusz Olejniczak.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n22
  cau: Chủ đề 1 ở Sol thứ, chủ đề 2 ở Mi♭ trưởng.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n24
  cau: Vladimir Horowitz chơi bài này trong buổi hòa nhạc trở lại Carnegie Hall ngày 9/5/1965, Sony Classical có bản thu.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n25
  cau: Krystian Zimerman thu bốn ballade cho Deutsche Grammophon (1988).
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n26
  cau: Arthur Rubinstein chơi tự nhiên, ít cường điệu.
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n28
  cau: "Mở đầu Largo ô 1–7: hai tay đồng âm cách quãng tám, dừng trên một hợp âm nghịch tai."
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n29
  cau: Chủ đề 1 từ ô 8, Moderato 6/4, Sol thứ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n30
  cau: Đoạn chuyển agitato nhanh dần, chất liệu chủ đề 1 trải khắp bàn phím, lên cao trào rồi lắng xuống.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n31
  cau: "Chủ đề 2 từ ô 68: Mi♭ trưởng, meno mosso, sotto voce."
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n32
  cau: Chủ đề 1 trở lại ở La thứ, dẫn vào lần biến đổi tiếp.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n33
  cau: Chủ đề 2 ở La trưởng, fortissimo, hợp âm dày, quãng tám.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n34
  cau: Đoạn valse ở Mi♭ trưởng, lướt leggiero tay phải trên bè trầm kiểu valse.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n35
  cau: Chủ đề 2 trở lại ở Mi♭ trưởng, fortissimo.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n36
  cau: Chủ đề 1 trở lại ở Sol thứ, sotto voce, trên âm nền Rê kéo dài, lớn dần tới il più forte possibile rồi ập vào coda.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n37
  cau: "Coda Presto con fuoco từ ô 208: hợp âm ff, gam quãng tám hai tay, kết bằng chuỗi quãng tám nửa cung hai tay chạy ngược chiều."
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n38
  cau: "Coda viết ở nhịp 2/2 (cả ở bảng Kế hoạch tập: tốc độ coda ghi theo nốt trắng)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n39
  cau: Mở đầu bắt đầu trên hợp âm La♭ trưởng, hợp âm Napoli của Sol thứ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n41
  cau: Chủ đề 1 có tay trái đệm hợp âm nhẹ, sau đó một đoạn lướt nhẹ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n42
  cau: Tay trái đoạn agitato nhảy xa, tay phải hình nốt dày.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n43
  cau: Đoạn valse là một đoạn mới, dáng điệu valse.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n44
  cau: Theo thông lệ, một tác phẩm Sol thứ đưa chủ đề 2 sang Si♭ trưởng (giọng trưởng song song); Chopin chọn Mi♭ trưởng (bậc VI).
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n45
  cau: Ở phần giữa chủ đề 2 sang La trưởng, cách Mi♭ một quãng ba cung, xa nhất có thể.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n46
  cau: Trong phần trở lại, chủ đề 2 đến trước (ô 166), chủ đề 1 sau (ô 194), và chủ đề 1 không có kết trọn vẹn trước coda.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n52
  cau: "Hợp âm, quãng tám ff: dùng trọng lượng cánh tay, cổ tay mềm, thả lỏng ngay; tập mf trước."
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n54
  cau: "Coda: tập khi tay còn tươi, không quá 10–15 phút liền; quãng tám bằng cổ tay và cánh tay."
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n60
  cau: "Bài tập 2: tăng tốc mỗi lần 4 vạch máy đếm nhịp (nốt trắng); căng hay đau ở cẳng tay thì dừng, nghỉ, quay về tốc độ trước."
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n64
  cau: Đến tuần 8 coda vẫn căng cứng thì kéo dài kế hoạch, không ép tốc độ.
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n65
  cau: Bài có các chỉ dẫn Largo, Moderato, agitato, meno mosso, Presto con fuoco.
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n66
  cau: Rubato kiểu Chopin là co giãn giai điệu trên nền giữ nhịp; giữ phách lớn hai phách mỗi ô.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-ballade-1
  id: n68
  cau: "Coda: Klindworth ghi ff ngay từ đầu và fff ở những ô cuối."
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n70
  cau: "Ô 7: bản Pháp in đầu và bản tay dở dang của Chopin ghi Mi♭ (nghịch tai); bản Đức in đầu (Breitkopf, 1836) và một số ấn bản sau ghi Rê; Henle chọn Mi♭ và bàn trong bình chú."
  loai: lich-su
- trang: piano/tac-pham/chopin-ballade-1
  id: n72
  cau: Ấn bản Quốc gia Ba Lan (Ekier, Kamiński) và Henle dựa trên các nguồn gốc và ghi các biến thể; bản Scholtz in sau đổi Mi♭ ở ô 7 thành Rê.
  loai: ten
- trang: piano/tac-pham/chopin-ballade-1
  id: n74
  cau: Tập coda nhiều giờ liền khi tay đã mỏi là con đường ngắn nhất đến chấn thương (cả ở lời giải thích câu hỏi 4).
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n75
  cau: Henle xếp Ballade số 2 (Fa trưởng, Op. 38) và số 3 (La♭ trưởng, Op. 47) mức 8 như số 1, số 4 (Fa thứ, Op. 52) mức 9.
  loai: cap-do
- trang: piano/tac-pham/chopin-ballade-1
  id: n76
  cau: Các scherzo, Fantaisie Op. 49, Barcarolle Op. 60 của Chopin; nghe hướng dẫn Étude.
  loai: danh-muc
- trang: piano/tac-pham/chopin-ballade-1
  id: n80
  cau: "Câu hỏi 1: phần trở lại theo thứ tự đảo ngược, chủ đề 2 trước, chủ đề 1 sau; chủ đề 1 không có kết trọn vẹn trước coda."
  loai: cau-truc
- trang: piano/tac-pham/chopin-ballade-1
  id: n81
  cau: "Câu hỏi 2: ballade theo nghĩa gốc là một thể thơ kể chuyện, nhiều khi là truyền thuyết; Chopin đầu tiên đặt tên ballade cho tác phẩm khí nhạc không lời."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-ballade-1
  id: n82
  cau: "Câu hỏi 3: ở hai lần chủ đề 2 vang ff, tiếng to đến từ trọng lượng cánh tay, cổ tay mềm, thả lỏng; tập mf trước."
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n83
  cau: "Câu hỏi 4: tập coda khi tay còn tươi, không quá 10–15 phút liền, chậm; dừng nếu căng hay đau."
  loai: quy-tac
- trang: piano/tac-pham/chopin-ballade-1
  id: n23
  cau: Ba câu hỏi khi nghe (hai chủ đề, tốc độ, đỉnh) và lời dặn nghe ba lần trước khi mở bản nhạc.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-ballade-1
  id: n71
  cau: Đọc chú thích của ấn bản, nghe cả hai cách, chọn một và chơi với niềm tin.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-ballade-1
  id: n50
  cau: 'Đoạn agitato: tập từng tay, "nhảy rồi dừng", nhóm theo phách, tăng tốc từng nấc.'
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n1
  cau: Hai phần nhanh trong đó tay phải chơi bốn nốt trên mỗi ba nốt của tay trái, kẹp giữa một đoạn hát Rê♭ trưởng như một nocturne (cả ở description).
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n3
  cau: Gần như suốt hai phần nhanh, mỗi phách đen có bốn móc kép tay phải trên ba nốt liên ba tay trái.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n5
  cau: Tay phải có những vòng nốt quanh một nốt trục, nhiều nốt nửa cung (Fa thăng kép, Si♯), gam nửa cung đi xuống, những cú vọt lên âm vực cao.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n6
  cau: "Tay trái rải hợp âm trải quá một quãng tám: Đô♯3 – Sol♯3 – Đô♯4 – Mi4."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n7
  cau: Hình rải rộng cần xoay cẳng tay thay vì căng ngón.
  loai: quy-tac
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n10
  cau: Hai phần nhanh có thể gây mỏi, đau cẳng tay nếu tập sai; đọc Giữ đôi tay khỏe.
  loai: quy-tac
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n11
  cau: 'Impromptu nghĩa là "ngẫu hứng": một bản nhạc như bật ra tức thì.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n12
  cau: Chopin tự cho in ba bản impromptu (Op. 29, Op. 36, Op. 51).
  loai: danh-muc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n13
  cau: Theo Fontana, bài viết năm 1834; Chopin không cho in.
  loai: nam
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n14
  cau: Dù Chopin đã dặn không in các bản thảo chưa xuất bản, Fontana vẫn in.
  loai: lich-su
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n15
  cau: Julian Fontana in bài năm 1855, sau khi Chopin mất, cùng các valse Op. 69 và Op. 70 (có Valse Si thứ).
  loai: nam
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n16
  cau: Theo Henle, bản tay của Chopin chỉ ghi chỉ dẫn tốc độ, bản chép của Franchomme ghi "Impromptu"; cái tên Fantaisie-Impromptu nhiều khả năng do Fontana đặt.
  loai: ten
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n17
  cau: Bản tay của Chopin, đề "Paris Vendredi 1835", nằm trong album của Nam tước phu nhân d'Este, ghi bài được "soạn cho" bà.
  loai: lich-su
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n18
  cau: Bản tay sau thuộc bộ sưu tập của Arthur Rubinstein; Rubinstein cho in nó năm 1962 (G. Schirmer).
  loai: nam
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n19
  cau: Rubinstein coi bản d'Este là bản hoàn chỉnh, "nhiều cải thiện về hòa âm và văn phong", và đoán chữ "soạn cho" nghĩa là Chopin đã bán bài cho bà.
  loai: lich-su
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n20
  cau: Theo Henle, bản tay có thể là bản chép lại sau của bài viết năm trước; bản Fontana khác bản tay khá nhiều, và nhiều chỗ khác khớp bản chép của Franchomme.
  loai: lich-su
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n21
  cau: Ngày nay có hai phiên bản, Fontana và d'Este; ấn bản Henle in cả hai cạnh nhau.
  loai: ten
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n22
  cau: Các ấn bản cũ, kể cả bản Scholtz, ra đời trước khi bản d'Este được in, nên theo văn bản Fontana; mọi số ô trên trang theo bản ấy.
  loai: lich-su
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n24
  cau: "Mở đầu ô 1–4: tay trái một mình; quãng tám Sol♯ sf ngân hai ô, rồi hình rải hợp âm Đô♯ thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n25
  cau: Phần A từ ô 5, Allegro agitato, p; tay phải vào sau một dấu lặng nhỏ; bốn chọi ba trong mỗi phách.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n26
  cau: "Đoạn mạnh ô 13–24: f, dấu nhấn ở nốt thấp mỗi nhóm bốn; từ ô 17 nhỏ lại, nhấn nốt cao; chậm lại ở ô 24."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n27
  cau: Chủ đề trở lại ô 25 (a tempo), rồi gam nửa cung đi xuống ô 33–36, lớn dần.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n28
  cau: "Cao trào ô 37–40: ff, tay phải âm vực cao, tay trái quãng tám đi xuống; dừng trên âm Sol♯."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n29
  cau: "Largo ô 41–42: tay trái rải hợp âm Rê♭ trưởng, chậm, pesante."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n30
  cau: "Moderato cantabile từ ô 43, sotto voce: giai điệu có láy rền và nốt hoa mỹ nhỏ; ô 59–62 và 71–74 là câu tương phản."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n31
  cau: "Kết đoạn giữa ô 82: một nốt ngân riten."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n32
  cau: "Presto ô 83–118: phần A trở lại nguyên văn."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n33
  cau: "Coda ô 119–138: tay phải ff rồi lắng dần; từ ô 129 giai điệu đoạn giữa ở tay trái; kết bằng hợp âm Đô♯ trưởng rải, ppp."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n34
  cau: "Số ô theo ấn bản Scholtz (bản Mutopia): 138 ô."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n35
  cau: "Bảng cấu trúc: Mở đầu 1–4, A 5–40 (5–12, 13–24, 25–32, 33–36, 37–40), Largo 41–42, B 43–82 (43–50, 51–58, 59–62, 63–70, 71–74, 75–82), A 83–118, Coda 119–138."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n36
  cau: "Giọng các phần: Đô♯ thứ, Rê♭ trưởng ở Largo và B, Đô♯ thứ, kết Đô♯ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n37
  cau: Coda ô 119–126 tay phải ff trên tay trái móc đơn thường.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n39
  cau: "Rê♭ trưởng là Đô♯ trưởng (giọng trưởng cùng tên của Đô♯ thứ) viết theo lối đồng âm: năm dấu giáng dễ đọc hơn bảy dấu thăng."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n40
  cau: Nốt Sol♯ ở ô 40 chính là La♭, át âm của Rê♭ trưởng.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n41
  cau: Ở coda giai điệu đoạn giữa trở lại ở tay trái với trường độ gần như gấp đôi; Scholtz ghi il canto un poco marcato; tay phải móc kép pp, poco a poco più tranquillo.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n42
  cau: Bài kết trên hợp âm Đô♯ trưởng.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n44
  cau: "Ô 5–12: Fa thăng kép là phím Sol, Si♯ là phím Đô."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n46
  cau: Gam nửa cung ô 33–36 đi hơn hai quãng tám liền, vừa nhanh vừa lớn dần.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n48
  cau: Từ Đô♯3 lên Mi4 là quãng mười.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n49
  cau: "Tay trái rải rộng: xoay cẳng tay như vặn nắm cửa, không với bằng ngón; một cách bấm 5–3–1, ngón 2 vắt qua ngón cái, rồi 1–3; link Hợp âm rải."
  loai: quy-tac
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n50
  cau: Ô 7 tay phải vọt lên Si6; ô 37–40 tay trái quãng tám đi xuống liên tục.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n52
  cau: "Đoạn giữa: láy rền ngắn ô 43, nhóm nốt nhỏ trước nốt chính ô 49, nhóm liên bảy ô 60, 72."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n55
  cau: "Sức bền: hai lần 36 ô móc kép gần như không nghỉ, cộng coda."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n56
  cau: Tập theo khối 4 rồi 8 ô; chơi liền phần A một, hai lần mỗi buổi; tập từng đợt khoảng 20 phút, xen 10 phút nghỉ; dừng ngay nếu đau.
  loai: quy-tac
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n60
  cau: Đoạn trích ô 5–8 theo ấn bản Scholtz (Mutopia), đã đối chiếu từng nốt; dấu bàn đạp theo ấn bản ấy; tay trái nhóm sáu trong bản in viết thành hai nhóm liên ba.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n61
  cau: Ô 5 phách 1 chỉ có tay trái, tay phải vào sau dấu lặng móc kép; từ phách 2 hai tay gặp nhau đầu mỗi phách; ô 7 vọt từ Rê♯6 lên Si6; nốt La cuối ô 8 nối sang ô 9.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n69
  cau: Allegro agitato nhanh và bồn chồn; bài viết ở nhịp 2/2, cảm hai phách nốt trắng mỗi ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n70
  cau: Phần A bắt đầu p; giữ sức cho f ở ô 13 và ff ở ô 37; phần trở lại ghi Presto.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n71
  cau: Đoạn Moderato cantabile là bài hát sotto voce ("nhỏ giọng").
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n73
  cau: Với Chopin, nhiều chuyên gia như Eigeldinger cho rằng nốt hoa mỹ thường bắt đầu đúng phách.
  loai: quy-tac
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n74
  cau: Ở phần nhanh, Scholtz ghi đổi bàn đạp theo hòa âm, mỗi ô hoặc mỗi nửa ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n78
  cau: Tập phần nhanh nhiều giờ liền ở tốc độ cao là con đường ngắn nhất đến chấn thương; căng ngón với quãng mười làm cẳng tay mỏi nhanh.
  loai: quy-tac
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n80
  cau: Impromptu số 1 La♭ trưởng Op. 29 là bản impromptu đầu tiên Chopin cho in.
  loai: danh-muc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n82
  cau: "Câu hỏi 1: mỗi phách đen tay phải bốn móc kép, tay trái ba nốt liên ba; lưới chung 12 phần, hai tay chỉ cùng đánh ở đầu mỗi phách."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n83
  cau: "Câu hỏi 2: đoạn Moderato cantabile ở Rê♭ trưởng, tức Đô♯ trưởng đồng âm; Sol♯ cuối phần A là La♭, át âm Rê♭; Mi trưởng là giọng song song (sai); La trưởng (sai)."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n84
  cau: "Câu hỏi 3: từ ô 129 giai điệu đoạn giữa ở tay trái dưới móc kép pp; Scholtz ghi il canto un poco marcato; kết hợp âm Đô♯ trưởng rải."
  loai: cau-truc
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n85
  cau: "Câu hỏi 4: bản thảo d'Este là bản tay của Chopin đề năm 1835, \"soạn cho Nam tước phu nhân d'Este\", sau thuộc bộ sưu tập của Rubinstein, in năm 1962; Henle in cả hai phiên bản."
  loai: lich-su
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n54
  cau: "Coda ô 129–135: giai điệu tay trái dưới móc kép tay phải; tập tay trái như một bài hát."
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n76
  cau: Chọn một phiên bản, ghi lên trang đầu, đừng trộn; hỏi trước phiên bản được chấp nhận khi thi.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-fantaisie-impromptu
  id: n68
  cau: Đến tuần 8 hai tay vẫn kéo nhau thì kéo dài kế hoạch; nốt trắng = 72 mà trong và nhẹ đã đẹp.
  loai: khuyen-tap
- trang: piano/tac-pham/liszt-liebestraum
  id: n1
  cau: "Tiêu đề: Liszt, Liebestraum số 3, La♭ trưởng."
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n2
  cau: Giai điệu chậm, hát trên lớp hợp âm rải; giai điệu nằm giữa lớp đệm và do hai ngón cái hát.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n3
  cau: Phần đệm chia cho hai tay.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n4
  cau: Bài có hai cadenza và một cao trào quãng tám đòi kỹ thuật thật sự.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n6
  cau: Trong Nocturne Op. 9 số 2 của Chopin, giai điệu nằm trên cùng (phía ngón 5).
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n8
  cau: Ở đây giai điệu nằm giữa, ngón cái hát trong khi các ngón còn lại của cùng bàn tay chơi phần đệm.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n13
  cau: Henle gọi bài này là một trong những bản nhạc piano được chơi nhiều nhất.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n14
  cau: Liszt là nghệ sĩ piano lừng lẫy nhất thời ông.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n15
  cau: Liszt chuyển soạn rất nhiều ca khúc, của Schubert, Schumann và của chính ông, cho piano.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n16
  cau: Liebesträume là ba ca khúc của Liszt được viết lại thành ba notturno (nocturne) cho piano, in năm 1850.
  loai: nam
- trang: piano/tac-pham/liszt-liebestraum
  id: n17
  cau: Theo Henle, bản piano in lời thơ ở đầu mỗi bài, cho thấy bài thơ vẫn quan trọng cả trong bản không lời.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n18
  cau: Ca khúc gốc của bài số 3 viết khoảng cuối năm 1843.
  loai: nam
- trang: piano/tac-pham/liszt-liebestraum
  id: n19
  cau: Ca khúc phổ thơ Ferdinand Freiligrath.
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n20
  cau: "Bài thơ mở đầu bằng lời giục giã: hãy yêu, chừng nào bạn còn có thể yêu."
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n21
  cau: Bài thơ là một lời nhắc khẩn thiết chứ không phải một giấc mơ êm ái.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n23
  cau: Liszt ghi Poco allegro, không phải Adagio.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n24
  cau: Henle xếp hai Liebestraum đầu ở mức 6, bài số 3 ở mức 7; bài số 3 khó hơn hai bài kia.
  loai: cap-do
- trang: piano/tac-pham/liszt-liebestraum
  id: n27
  cau: Jorge Bolet là nghệ sĩ gắn bó với nhạc Liszt, có bản thu Liebestraum số 3.
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n28
  cau: Leslie Howard thu âm toàn bộ nhạc piano độc tấu của Liszt.
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n32
  cau: "Theo dõi, giai điệu lần một (ô 1–23): La♭ trưởng; giai điệu ở âm vực giữa, dưới là nốt trầm, trên là hợp âm rải nhẹ."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n33
  cau: "Theo dõi, cadenza thứ nhất (ô 24–25): chuỗi nốt chạy liền không chia vạch nhịp, mở sang một màu khác."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n34
  cau: "Theo dõi, Più animato (ô 26): giai điệu trở lại, bắt đầu ở Si trưởng; sáng và sôi nổi hơn."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n35
  cau: "Theo dõi, sempre stringendo (từ ô 37): nhạc dồn dần, chuyển giọng liên tục."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n36
  cau: "Theo dõi, cao trào: giai điệu vang bằng quãng tám, rồi tan thành hợp âm rải."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n37
  cau: Theo dõi, lắng xuống, cadenza thứ hai chuẩn bị cho lần hát cuối.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n38
  cau: "Theo dõi, Tempo I (ô 61): giai điệu lần cuối ở La♭ trưởng, trở lại tốc độ ban đầu."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n39
  cau: "Theo dõi, kết: nhạc lắng dần, khép lại ở La♭ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n40
  cau: "Bảng cấu trúc, A: ô 1–23, La♭ trưởng, Poco allegro, con affetto."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n41
  cau: "Đoạn A: giai điệu ở âm vực giữa, phần lớn do ngón cái hát, có chỗ chuyền từ tay này sang tay kia; hợp âm rải chia cho hai tay."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n42
  cau: "Bảng cấu trúc, cadenza 1: ô 24–25 (ô 24 dẫn vào, ô 25 không chia vạch nhịp), chuỗi nốt chạy liền dẫn sang giọng mới."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n43
  cau: "Bảng cấu trúc, A': ô 26–36, Più animato, bắt đầu ở Si trưởng; giai điệu lần hai, sáng hơn, sôi nổi hơn."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n44
  cau: "Bảng cấu trúc, dồn lên cao trào: ô 37–60, sempre stringendo; chuyển giọng liên tục, nhanh dần; ở đỉnh, giai điệu quãng tám rồi tan thành hợp âm rải; cadenza 2 ở cuối đoạn."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n45
  cau: Đoạn 37–60 là đoạn khó nhất bài.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n46
  cau: "Bảng cấu trúc, A'': ô 61–85, Tempo I, La♭ trưởng; giai điệu lần cuối, lắng dần đến kết."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n47
  cau: "Ghi chú cách đếm: số ô theo bản in đầu (Kistner 1850, bản Henle dựa vào); mỗi cadenza một ô (25, 60), không tính nốt lấy đà; PTNA đặt Più animato ở ô 27."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n48
  cau: Si trưởng cùng âm với Đô♭ trưởng, giọng dựng trên bậc III hạ của La♭ trưởng.
  loai: dinh-nghia
- trang: piano/tac-pham/liszt-liebestraum
  id: n49
  cau: Hai hợp âm trưởng cách nhau quãng ba và chỉ chung một nốt (Mi♭) là quan hệ trung âm hóa (chromatic mediant); bước chuyển không đi qua giọng át hay hạ át.
  loai: dinh-nghia
- trang: piano/tac-pham/liszt-liebestraum
  id: n51
  cau: Trên phím, từ bốn dấu giáng sang năm dấu thăng.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n60
  cau: "Chỗ khó, đoạn Si trưởng (ô 26–36): năm dấu thăng, tốc độ nhích lên; tập gam Si trưởng trước."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n61
  cau: "Chỗ khó, đoạn dồn và cao trào (ô 37–60): quãng tám, bước nhảy ở cả hai tay, tốc độ tăng dần."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n74
  cau: Sáu nốt đen mỗi ô (nhịp 6/4).
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n78
  cau: Ở đoạn quãng tám, tập ngắn và nghỉ đều; cổ tay hay cẳng tay mỏi, căng thì dừng lại xem lại cách tập; đau thì dừng ngay.
  loai: quy-tac
- trang: piano/tac-pham/liszt-liebestraum
  id: n80
  cau: "Poco allegro, con affetto: hơi nhanh, trìu mến."
  loai: dinh-nghia
- trang: piano/tac-pham/liszt-liebestraum
  id: n81
  cau: "Nhịp 6/4: hai phách lớn mỗi ô, mỗi phách ba nốt đen."
  loai: dinh-nghia
- trang: piano/tac-pham/liszt-liebestraum
  id: n87
  cau: Đoạn sempre stringendo dài hơn hai mươi ô.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n90
  cau: Theo Henle, bản in năm 1850 đặt lời thơ trước mỗi bài.
  loai: lich-su
- trang: piano/tac-pham/liszt-liebestraum
  id: n91
  cau: Các ấn bản cũ trên IMSLP khác nhau về ngón bấm và bàn đạp; nốt nhạc đối chiếu với bản Urtext.
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n94
  cau: "Cùng tác giả: Consolation số 3 Rê♭ trưởng S. 172, cùng lối hát trên hợp âm rải rộng nhưng ít kỹ thuật hơn."
  loai: cap-do
- trang: piano/tac-pham/liszt-liebestraum
  id: n97
  cau: 'Câu hỏi 1: ca khúc gốc phổ thơ Ferdinand Freiligrath; hai Liebestraum đầu theo thơ Uhland; bài 3 theo "O lieb, so lang du lieben kannst!".'
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n98
  cau: "Câu hỏi 2: sau cadenza thứ nhất giai điệu trở lại ở Si trưởng; Si trưởng cùng âm Đô♭ trưởng, cách La♭ trưởng một quãng ba, kèm chỉ dẫn Più animato."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n99
  cau: "Câu hỏi 3: ở phần mở đầu, giai điệu chủ yếu do ngón cái hát, ở âm vực giữa, giữa lớp hợp âm rải."
  loai: cau-truc
- trang: piano/tac-pham/liszt-liebestraum
  id: n101
  cau: "Mục Nguồn: Henle HN 634 (trang sản phẩm, lời tựa), PTNA, bản in đầu (BSB), IMSLP."
  loai: ten
- trang: piano/tac-pham/liszt-liebestraum
  id: n57
  cau: "Chỗ khó, hợp âm rải chia hai tay: tập riêng phần đệm pp, cặp nốt ở chỗ nối, nhịp chấm dôi."
  loai: khuyen-tap
- trang: piano/tac-pham/liszt-liebestraum
  id: n86
  cau: "Cadenza: như ca sĩ luyến láy; tự do về thời gian, không tự do về nốt."
  loai: khuyen-tap
- trang: piano/tac-pham/liszt-liebestraum
  id: n62
  cau: 'Cách tập đoạn dồn: cổ tay mềm, nghỉ sau mỗi nhóm, "nhảy sớm, đánh đúng lúc", vạch đường sắc thái; bài tập 3.'
  loai: khuyen-tap
