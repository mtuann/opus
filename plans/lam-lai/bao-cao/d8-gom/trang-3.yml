  loai: khuyen-tap
- trang: nhac-cu/nhac-cu-khac
  id: n27
  cau: Organ ống thường được gọi là "vua của các nhạc cụ" vì kích thước lớn.
  loai: dinh-nghia
- trang: nhac-cu/nhac-cu-khac
