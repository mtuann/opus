  id: n26
  cau: Benny Goodman chơi cả nhạc cổ điển lẫn jazz.
  loai: lich-su
- trang: nhac-cu/clarinet
  id: n7
  cau: Người chơi clarinet điều khiển cao độ bằng hệ thống khóa và lỗ bấm.
  loai: dinh-nghia
- trang: nhac-cu/guitar
  id: n9
  cau: "Joaquín Rodrigo: Concierto de Aranjuez (cho guitar và dàn nhạc)."
  loai: ten
- trang: nhac-cu/guitar
  id: n12
  cau: Fernando Sor viết các étude cho guitar.
  loai: lich-su
- trang: nhac-cu/guitar
  id: n10
  cau: "Heitor Villa-Lobos: 5 Préludes."
  loai: ten
- trang: nhac-cu/guitar
  id: n15
  cau: John Williams là nghệ sĩ guitar, không phải nhà soạn nhạc phim cùng tên.
  loai: ten
- trang: nhac-cu/guitar
  id: n14
  cau: Segovia, Bream, John Williams, Ana Vidović, Marcin Dylla là nghệ sĩ guitar
