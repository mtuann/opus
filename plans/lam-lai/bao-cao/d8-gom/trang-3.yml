  id: n12
  cau: Trong dàn nhạc, cello là bè trầm của bộ dây, nhưng cũng được giao giai điệu.
  loai: dinh-nghia
- trang: nhac-cu/cello
  id: n15
  cau: Bach viết 6 tổ khúc cho cello độc tấu (BWV 1007–1012).
  loai: danh-muc
