- trang: piano/thay-va-thi
  id: n5
  cau: Grade là thang độ khó của các hội đồng thi Anh, từ Initial (trước Grade 1)
    đến Grade 8.
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n8
  cau: ABRSM và Trinity College London là hai hội đồng thi của Anh.
  loai: ten
- trang: piano/thay-va-thi
  id: n9
  cau: "ABRSM có Initial Grade và Grade 1 đến Grade 8, với hai hình thức thi:
    Practical Grades và Performance Grades."
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n10
  cau: "Practical Grades: 3 bài (mỗi bài từ một danh sách A, B, C), gam và hợp âm
    rải (chơi thuộc), thị tấu, kiểm tra nghe; thi trực tiếp với giám khảo."
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n11
  cau: "Performance Grades: 4 bài chơi liền một mạch, ít nhất một bài từ mỗi danh
    sách A, B, C, bài thứ tư lấy trong danh sách hoặc tự chọn; không có gam, thị
    tấu, kiểm tra nghe."
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n12
  cau: "Performance Grades: tự quay video một lượt liền, không cắt ghép, rồi nộp
    trực tuyến."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n13
  cau: "Chấm điểm: tổng 150; từ 100 là đỗ (Pass), 120 khá (Merit), 130 xuất sắc
    (Distinction); Performance Grades cùng thang 150, mỗi bài một điểm, cộng một
    điểm cho cả màn trình diễn."
  loai: so-lieu
- trang: piano/thay-va-thi
  id: n15
  cau: Muốn thi ABRSM Grade 6, 7 hoặc 8, ở cả hai hình thức, phải đã đỗ Grade 5
    Music Theory hoặc Grade 5 Practical Musicianship (hay cấp cao hơn), hoặc
    Grade 5 một nhạc cụ jazz độc tấu; các chứng chỉ tương đương được chấp nhận
    có danh sách trên website ABRSM.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n16
  cau: Chương trình piano 2027–2028 dùng được từ 1/1/2027; trong năm 2027, các bài
    của chương trình 2025–2026 vẫn được chơi, đến hết 31/12/2027; chọn một trong
    hai chương trình, các bài phải lấy từ cùng một chương trình.
  loai: cap-do
- trang: piano/thay-va-thi
  id: n17
  cau: Chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm trực tiếp; gam
    và hợp âm rải thì phải chơi thuộc.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n18
  cau: Với Performance Grades, đàn điện được chấp nhận nếu có phím cỡ chuẩn, có
    trọng lượng và cảm ứng lực.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n19
  cau: Trinity có Initial và Grade 1–8; chương trình piano hiện hành là bộ "từ
    2023", không có ngày hết hạn (có hiệu lực đến khi có thông báo mới), và các
    bài trong sách 2021–2023 vẫn được dùng.
  loai: cap-do
- trang: piano/thay-va-thi
  id: n20
  cau: "Trinity thi trực tiếp: 3 bài (66 điểm), phần kỹ thuật gồm gam, hợp âm rải
    và bài tập kỹ thuật (14 điểm), và hai phần kiểm tra bổ trợ (20 điểm)."
  loai: so-lieu
- trang: piano/thay-va-thi
  id: n21
  cau: "Từ Initial đến Grade 5, chọn hai trong bốn phần bổ trợ: thị tấu, nghe, ứng
    tác, kiến thức âm nhạc; ở Grade 6–8 các lựa chọn hẹp hơn."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n22
  cau: "Trinity thi qua video: hoặc 3 bài kèm phần kỹ thuật, hoặc 4 bài."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n23
  cau: "Trinity: tổng 100 điểm; từ 60 là đỗ, 75 khá, 87 xuất sắc."
  loai: so-lieu
- trang: piano/thay-va-thi
  id: n24
  cau: "Trinity không có điều kiện đầu vào: không cần đỗ cấp thấp hơn hay thi nhạc
    lý trước, kể cả với Grade 6–8."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n25
  cau: "ABRSM: ARSM dành cho người đã qua Grade 8, thi trực tiếp (nơi có tổ chức)
    hoặc qua video; LRSM và FRSM theo định dạng mới từ 2024, nộp video buổi biểu
    diễn kèm tài liệu bổ trợ; cả ba yêu cầu đã đỗ Grade 8 ABRSM (Performance
    hoặc Practical) hay bằng tương đương của hội đồng thi khác trong danh sách
    ABRSM chấp nhận."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n26
  cau: Các bằng DipABRSM, LRSM và FRSM kiểu cũ đã được ABRSM ngừng.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n27
  cau: Trinity có các bằng ATCL, LTCL, FTCL (Associate, Licentiate, Fellowship) ở
    các mảng biểu diễn, giảng dạy và lý thuyết.
  loai: ten
- trang: piano/thay-va-thi
  id: n28
  cau: Trang dành cho Việt Nam trên website Trinity liệt kê các kỳ thi (có âm nhạc
    và nhạc lý), cùng thông tin liên hệ của đại diện Trinity tại Việt Nam.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n29
  cau: LCM Exams (London College of Music, thuộc University of West London) là một
    hội đồng thi khác của Anh, có điều phối viên quốc gia và trung tâm thi ở
    nhiều thành phố Việt Nam.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n30
  cau: Với ABRSM, nhiều trung tâm âm nhạc trong nước giới thiệu lớp luyện thi.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n31
  cau: "Ba cơ sở đào tạo âm nhạc chuyên nghiệp lớn có đào tạo piano: Học viện Âm
    nhạc Quốc gia Việt Nam (Hà Nội), Nhạc viện Thành phố Hồ Chí Minh, Học viện
    Âm nhạc Huế."
  loai: lich-su
- trang: piano/thay-va-thi
  id: n32
  cau: Nhạc viện TP. Hồ Chí Minh có bộ phận Năng khiếu âm nhạc.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n35
  cau: "Zoom: Settings → Audio, chọn Original sound for musicians, tắt
    Automatically adjust microphone volume; bật High-fidelity music mode nếu
    dùng mạng dây; chỉ bật Echo cancellation khi dùng loa thay vì tai nghe."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n36
  cau: Ứng dụng nào không có chế độ cho nhạc thì bộ lọc tiếng ồn có thể "nuốt"
    những nốt nhỏ và tiếng ngân.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n37
  cau: "Học trực tuyến: thầy trò không thể chơi cùng lúc hay đếm nhịp cho nhau qua
    mạng; thầy làm mẫu, bạn nghe rồi chơi lại; máy đếm nhịp đặt ở phía bạn."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n43
  cau: Người thầy tốt hỏi han ngay khi bạn kêu đau và điều chỉnh cách tập; "Đau là
    bình thường, cố lên" là dấu hiệu đáng lo; đau là tín hiệu dừng lại.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n48
  cau: "Khối kiểm tra nhanh, câu 1 và 2: Grade 6 cần Grade 5 Music Theory /
    Practical Musicianship / jazz solo (hoặc tương đương); điều kiện áp dụng cho
    Grade 6–8 ở cả Practical Grades lẫn Performance Grades; Performance Grades
    là bốn bài chơi liền, quay video, không có gam, thị tấu và kiểm tra nghe; cả
    hai cùng thang 150 điểm với cùng các mốc."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n50
  cau: "Mục Nguồn: ABRSM, Practical Music Grades: Piano Syllabus 2025 & 2026;
    Music Performance Grades: Piano Syllabus 2027 & 2028; Music Performance
    Grades: Qualification Specification; Trinity College London Piano Syllabus
    (từ 2023, bản trực tuyến 2026); LCM Exams; Nhạc viện TP. HCM; Berklee
    Online; ABRSM Music Performance diplomas."
  loai: ten
- trang: piano/thay-va-thi
  id: n51
  cau: "Gerald Klickstein, The Musician's Way: A Guide to Practice, Performance,
    and Wellness (Oxford University Press, 2009)."
  loai: ten
- trang: piano/thay-va-thi
  id: n40
  cau: Một người thầy tốt làm gì (nghe và chẩn đoán, sửa tư thế và thế tay từ buổi
    đầu, giao mục tiêu cụ thể và kiểm tra lại, giải thích vì sao, dạy cách tập,
    cân bằng các mảng, khuyến khích nghe và biểu diễn, lắng nghe mục tiêu).
  loai: khuyen-tap
- trang: piano/thay-va-thi
  id: n41
  cau: Câu nên hỏi thầy (đã dạy người lớn mới bắt đầu chưa; ba tháng đầu học gì;
    dạy đọc nhạc từ đầu không; có gam, thị tấu, nhạc lý, luyện tai không; buổi
    học bao lâu, học phí, chính sách nghỉ; có buổi biểu diễn, luyện thi không;
    học thử một buổi).
  loai: khuyen-tap
- trang: piano/thay-va-thi
  id: n47
  cau: Bảng "Có nên đi thi không?" (lợi ích, hạn chế); coi mỗi kỳ thi là một trạm
    dừng; tự tổ chức một "kỳ thi" của riêng bạn mỗi năm (bốn bước).
  loai: khuyen-tap
- trang: tai-nguyen
  id: n3
  cau: "ABRSM: chương trình piano 2027–2028 dùng được từ 1/1/2027; các bài của
    chương trình 2025–2026 vẫn được chơi đến hết 31/12/2027; danh sách tác phẩm
    theo cấp là nguồn gợi ý tốt kể cả khi không thi."
  loai: cap-do
- trang: tai-nguyen
  id: n4
  cau: "Trinity College London: thi cấp piano (và nhiều nhạc cụ khác) từ Initial
    đến Grade 8."
  loai: cap-do
- trang: tai-nguyen
  id: n5
  cau: "Practising the Piano của Graham Fitch: bài viết và video về cách tập, có
    bài giới thiệu tác phẩm của chương trình ABRSM."
  loai: ten
- trang: tai-nguyen
  id: n6
  cau: "Giáo trình piano cho người lớn: Alfred's Basic Adult Piano Course (hoặc
    Adult All-in-One), Faber Adult Piano Adventures."
  loai: ten
- trang: tai-nguyen
  id: n7
  cau: "Bản nhạc Urtext (in theo nguồn gốc của tác giả): G. Henle Verlag (có ứng
    dụng Henle Library và thang độ khó 1–9 cho từng bài), Wiener Urtext,
    Bärenreiter."
  loai: ten
- trang: tai-nguyen
  id: n8
  cau: "Sách: Heinrich Neuhaus, The Art of Piano Playing; Seymour Bernstein, With
    Your Own Two Hands; Thomas Mark, What Every Pianist Needs to Know About the
    Body; Gerald Klickstein, The Musician's Way."
  loai: ten
- trang: tai-nguyen
  id: n10
  cau: "musictheory.net — Lessons: bài học ngắn, có hình động; nên bắt đầu ở đây."
  loai: ten
- trang: tai-nguyen
  id: n11
  cau: "Open Music Theory: giáo trình đại học mở, miễn phí, đầy đủ từ cơ bản đến
    nâng cao."
  loai: ten
- trang: tai-nguyen
  id: n12
  cau: teoria.com — bài học và bài luyện tai.
  loai: ten
- trang: tai-nguyen
  id: n13
  cau: "Coursera: Fundamentals of Music Theory (University of Edinburgh) và
    Developing Your Musicianship (Berklee College of Music); xem điều kiện học
    và chi phí trên trang khóa học."
  loai: ten
- trang: tai-nguyen
  id: n14
  cau: "musictheory.net — Exercises: đọc nốt, quãng, hợp âm, hóa biểu."
  loai: ten
- trang: tai-nguyen
  id: n15
  cau: "ToneGym: luyện tai dạng trò chơi; có thể đăng ký miễn phí."
  loai: ten
- trang: tai-nguyen
  id: n16
  cau: Ứng dụng Tenuto (của musictheory.net, có phí); Functional Ear Trainer;
    Complete Ear Trainer.
  loai: ten
- trang: tai-nguyen
  id: n17
  cau: "Yale: Listening to Music (MUSI 112), khóa học của Craig Wright (Yale,
    2008), 23 video bài giảng, xem trực tuyến."
  loai: ten
- trang: tai-nguyen
  id: n18
  cau: Leonard Bernstein, Young People's Concerts — tìm trên YouTube hoặc DVD.
  loai: ten
- trang: tai-nguyen
  id: n19
  cau: Aaron Copland, What to Listen For in Music — sách nhỏ, dễ đọc, kinh điển;
    Burkholder, Grout, Palisca, A History of Western Music — giáo trình lịch sử
    chuẩn; Alex Ross, The Rest Is Noise — lịch sử âm nhạc thế kỷ 20.
  loai: ten
- trang: tai-nguyen
  id: n20
  cau: "Nhận biết nhạc cụ: Prokofiev Peter và chó sói và Britten The Young
    Person's Guide to the Orchestra; link tới Dàn nhạc giao hưởng."
  loai: ten
- trang: tai-nguyen
  id: n21
  cau: "Building a Library của BBC Radio 3: mỗi tuần so sánh các bản thu của một
    tác phẩm, có dạng podcast; link tới trang podcast."
  loai: ten
- trang: tai-nguyen
  id: n22
  cau: Gramophone và giải Gramophone Awards hằng năm.
  loai: ten
- trang: tai-nguyen
  id: n24
  cau: "Dịch vụ chuyên nhạc cổ điển: Apple Music Classical, Idagio; thông tin bản
    thu đầy đủ hơn ứng dụng nghe nhạc thông thường."
  loai: ten
- trang: tai-nguyen
  id: n25
  cau: "Kênh YouTube của Viện Fryderyk Chopin: toàn bộ các vòng thi Chopin, gồm cả
    cuộc thi năm 2025."
  loai: ten
- trang: tai-nguyen
  id: n26
  cau: IMSLP — thư viện bản nhạc cổ điển thuộc phạm vi công cộng, tải miễn phí.
  loai: ten
- trang: tai-nguyen
  id: n27
  cau: Musopen — bản thu âm và bản nhạc miễn phí bản quyền.
  loai: ten
- trang: tai-nguyen
  id: n28
  cau: Mutopia Project — bản nhạc phạm vi công cộng do cộng đồng chép lại bằng
    LilyPond, in rõ, tải miễn phí.
  loai: ten
- trang: tai-nguyen
  id: n29
  cau: MuseScore — phần mềm viết nhạc miễn phí, mã nguồn mở; dùng để chép bài tập
    và nghe lại.
  loai: ten
- trang: tai-nguyen
  id: n30
  cau: Flat.io và Noteflight — viết nhạc ngay trên trình duyệt.
  loai: ten
- trang: tai-nguyen
  id: n31
  cau: "Kênh YouTube: Inside the Score (phân tích tác phẩm dễ hiểu); David Bennett
    Piano (giải thích khái niệm nhạc lý qua ví dụ); Nahre Sol (nghệ sĩ piano,
    nhiều video về cách nghe và chơi theo phong cách); Ben Laude (về piano và
    lịch sử nghệ sĩ piano)."
  loai: ten
