- trang: piano/tac-pham-theo-cap
  id: n47
  cau: "Bảng chặng 2: Schumann Op. 68 — Melodie (số 1), Soldatenmarsch (số 2),
    Wilder Reiter (số 8), Fröhlicher Landmann (số 10); Tchaikovsky Op. 39 — Old
    French Song, The Sick Doll; Kabalevsky Op. 39 — Clowns (số 20)."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: n49
  cau: 'Bảng chặng 1–7: cột "Học được gì" (kỹ năng mỗi bài dạy) và số danh mục,
    năm của các bài không có bản ghi (khoảng 170 hàng).'
  loai: lich-su
- trang: piano/tac-pham-theo-cap
