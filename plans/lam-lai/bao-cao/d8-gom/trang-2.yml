- trang: piano/tac-pham-theo-cap
  id: n62
  cau: Yiruma (tên thật Lee Ru-ma, sinh 1978); River Flows in You trong album
    First Love (2001, Stomp Music); Kiss the Rain trong From the Yellow Room
    (2003).
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n63
  cau: Hai tập SOLO của Faber Music (Original, Easy) in các bài trong album SOLO
    (2021) nhân 20 năm sáng tác của Yiruma; Andrew Eales xếp tập gốc quanh Grade
    5 và tập dễ quanh Grade 3 (Pianodao 2023).
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n64
  cau: "River Flows in You không phải nhạc phim Twilight (2008): bài nằm trong
    album First Love từ 2001, bài hay bị nhầm với Bella's Lullaby của Carter
    Burwell."
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n65
  cau: Joe Hisaishi (sinh 1950); One Summer's Day mở đầu album nhạc phim Spirited
    Away (2001), tên tiếng Nhật Ano natsu e, "Về mùa hè ấy"; dàn nhạc New Japan
    Philharmonic, Hisaishi chỉ huy và chơi piano.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n66
  cau: Itsumo nando demo (Always with Me) trong phim Spirited Away có nhạc của
    Youmi Kimura và lời của Wakako Kaku; ABRSM ghi tên Youmi Kimura (không ghi
    Hisaishi) khi đưa một bản soạn của bài vào danh sách Grade 3 (2025–2026).
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n66b
  cau: ABRSM đưa il porco rosso (từ phim Porco Rosso, 1992) của Joe Hisaishi vào
    danh sách Grade 8 (2025–2026), tức chặng 6; Summer là nhạc phim Kikujiro
    (1999) của Takeshi Kitano, không phải phim Ghibli.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n67
  cau: Paul de Senneville (1933–2023); cùng Olivier Toussaint lập hãng Delphine;
    Mariage d'Amour sáng tác 1978, Clayderman thu lần đầu trong album Lettre à
    ma mère (1979).
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n68
  cau: Bài "Spring Waltz" bị gán nhầm cho Chopin; nhầm lẫn bắt đầu từ một video
    đăng bản thu của George Davidson dưới tên sai, có hàng chục triệu lượt xem
    trước khi bị gỡ.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n69
  cau: "Yann Tiersen (sinh 1970); Comptine d'un autre été: l'après-midi trong
    album nhạc phim Amélie (Virgin, 2001); album Rue des Cascades (1996) có ba
    bài Comptine d'été số 1–3, là những bài khác."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n70
