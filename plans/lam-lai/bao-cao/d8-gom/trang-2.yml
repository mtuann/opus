  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n58
  cau: "River Flows in You: giọng La trưởng, nhịp 4/4, mở đầu tự do (Freely,
    flowing) rồi vừa phải (Moderately, expressively), theo bản in trên
    Musicnotes."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n59
  cau: "Kiss the Rain: La♭ trưởng, 4/4, ♩ = khoảng 76 (Musicnotes)."
