- trang: piano/nghe-si
  id: n3
  cau: "Ngày 9/6/1840, buổi diễn của Liszt ở Hanover Square Rooms (London) được
    gọi là recital: lần đầu tiên chữ này, vốn chỉ việc đọc diễn cảm, được dùng
    cho âm nhạc."
  loai: lich-su
- trang: piano/nghe-si
  id: n4
  cau: Liszt đặt cây đàn nằm ngang sân khấu để khán giả thấy nghiêng mặt ông và
    nghe tiếng đàn rõ hơn.
  loai: lich-su
- trang: piano/nghe-si
  id: n5
  cau: Liszt chơi một mình, không cần bản nhạc.
  loai: lich-su
- trang: piano/nghe-si
  id: n6
  cau: Clara Schumann là một trong những nghệ sĩ đầu tiên biểu diễn thuộc lòng và
    góp phần biến việc đó thành chuẩn mực; hình mẫu quen thuộc hôm nay đã thành
    hình trong thế kỷ 19.
  loai: lich-su
- trang: piano/nghe-si
  id: n7
  cau: "Thời đầu của ghi âm: cuối thập niên 1880, cậu bé Josef Hofmann, khi ấy
    khoảng 12 tuổi, có lẽ là nghệ sĩ piano có tiếng đầu tiên thu âm trên máy hát
    của Edison; các bản thu ấy đã thất lạc."
  loai: nam
- trang: piano/nghe-si
  id: n8
  cau: "1889: một nhân viên của Edison thu Brahms chơi một đoạn Hungarian Dance số
    1 ở Vienna; bản ghi hư hỏng nặng, gần như không nghe rõ."
  loai: nam
- trang: piano/nghe-si
  id: n9
  cau: "Thời đĩa 78 vòng: mỗi mặt đĩa chỉ chứa khoảng bốn phút nhạc, nên tác phẩm
    dài bị cắt thành nhiều mặt và nghệ sĩ phải tính trước chỗ ngắt."
  loai: so-lieu
- trang: piano/nghe-si
  id: n10
  cau: '1932–1935: Artur Schnabel thu trọn 32 sonata Beethoven ở London, lần đầu
    tiên trong lịch sử; hãng HMV bán theo hình thức đặt mua trước qua "Hội
    Sonata Beethoven".'
  loai: lich-su
- trang: piano/nghe-si
  id: n11
  cau: "1933–1936: Edwin Fischer thu trọn Bình quân luật, cũng là lần đầu tiên."
  loai: lich-su
- trang: piano/nghe-si
  id: n12
  cau: Sau Thế chiến II, đĩa LP và băng từ cho phép thu những đoạn dài và biên
    tập; Glenn Gould thôi biểu diễn trước công chúng năm 1964 để chỉ làm việc
    trong phòng thu.
  loai: lich-su
- trang: piano/nghe-si
  id: n13
  cau: "Ignacy Jan Paderewski (1860–1941): thần tượng của các phòng hòa nhạc; năm
    1919 làm Thủ tướng Ba Lan; Chopin; Minuet Sol trưởng Op. 14 số 1 của chính
    ông."
  loai: lich-su
- trang: piano/nghe-si
  id: n14
  cau: "Sergei Rachmaninoff (1873–1943): một trong những nghệ sĩ piano lớn nhất
    thời mình; bốn concerto và Rhapsody on a Theme of Paganini do chính ông thu
    với Dàn nhạc Philadelphia."
  loai: lich-su
- trang: piano/nghe-si
  id: n15
  cau: "Josef Hofmann (1876–1957): bậc thầy kỹ thuật và sự tiết chế; Rachmaninoff
    đề tặng ông Concerto số 3, nhưng ông không bao giờ chơi bản này; bản thu
    buổi hòa nhạc mừng 50 năm biểu diễn ở Metropolitan Opera, New York
    (28/11/1937)."
  loai: lich-su
- trang: piano/nghe-si
  id: n16
  cau: 'Alfred Cortot (1877–1962): Chopin và Schumann giàu chất thơ, không hoàn
    hảo về nốt; soạn các ấn bản "để học" kèm bài tập chuẩn bị; Chopin: 24
    Prélude, các Ballade.'
  loai: lich-su
- trang: piano/nghe-si
  id: n17
  cau: "Artur Schnabel (1882–1951): người đầu tiên thu âm trọn 32 sonata
    Beethoven; nghe trước: Sonata Op. 110, Op. 111."
  loai: lich-su
- trang: piano/nghe-si
  id: n18
  cau: "Edwin Fischer (1886–1960): bản thu trọn Bình quân luật đầu tiên; chỉ huy
    concerto Bach và Mozart ngay từ bàn phím."
  loai: lich-su
- trang: piano/nghe-si
  id: n19
  cau: "Arthur Rubinstein (1887–1982): Chopin tự nhiên, ấm áp, không ủy mị; biểu
    diễn đến gần 90 tuổi."
  loai: lich-su
- trang: piano/nghe-si
  id: n20
  cau: "Wilhelm Kempff (1895–1991): Beethoven và Schubert hát, tự nhiên; thu trọn
    32 sonata Beethoven hai lần (mono 1951–1956, stereo 1964–1965)."
  loai: lich-su
- trang: piano/nghe-si
  id: n21
  cau: "Clara Haskil (1895–1960): Mozart giản dị và sâu; cuộc thi mang tên bà ở
    Vevey (Thụy Sĩ) có từ năm 1963; nghe trước: Concerto số 20 và số 24 của
    Mozart."
  loai: lich-su
- trang: piano/nghe-si
  id: n22
  cau: "Claudio Arrau (1903–1991): nghệ sĩ Chile, tiếng đàn sâu, dày, trang nghiêm."
  loai: lich-su
- trang: piano/nghe-si
  id: n23
  cau: "Vladimir Horowitz (1903–1989): màu sắc, sức bật và tiếng đàn rực lửa; vắng
    bóng từ năm 1953, trở lại Carnegie Hall năm 1965, về biểu diễn ở Moskva năm
    1986."
  loai: lich-su
- trang: piano/nghe-si
  id: n24
  cau: "Rudolf Serkin (1903–1991): Beethoven nghiêm cẩn; cùng Adolf Busch lập
    Marlboro Music (1951), nơi các thế hệ nghệ sĩ cùng chơi nhạc thính phòng."
  loai: lich-su
- trang: piano/nghe-si
  id: n25
  cau: "Sviatoslav Richter (1915–1997): gần như tự học, kho bài khổng lồ; công
    diễn lần đầu Sonata số 7 của Prokofiev (1943), và Sonata số 9 được đề tặng
    ông; Tranh triển lãm thu trực tiếp ở Sofia năm 1958."
  loai: lich-su
- trang: piano/nghe-si
  id: n26
  cau: "Emil Gilels (1916–1985): tiếng đàn vàng, vững chãi; thắng cuộc thi Ysaÿe
    năm 1938, tiền thân của cuộc thi Queen Elisabeth."
  loai: lich-su
- trang: piano/nghe-si
  id: n27
  cau: "Dinu Lipatti (1917–1950): sự trong sáng hiếm có; mất năm 33 tuổi; buổi độc
    tấu cuối ở Besançon ngày 16/9/1950; nghe trước: Valse Chopin, Concerto
    Grieg, Partita số 1 của Bach."
  loai: lich-su
- trang: piano/nghe-si
  id: n28
  cau: "Arturo Benedetti Michelangeli (1920–1995): kiểm soát âm thanh tuyệt đối,
    cầu toàn đến cả tình trạng cây đàn; giải Nhất Geneva 1939; thầy của Argerich
    và Pollini."
  loai: lich-su
- trang: piano/nghe-si
  id: n29
  cau: "Glenn Gould (1932–1982): Bach rõ từng bè, cá tính rất mạnh; từ năm 1964
    chỉ thu âm, không biểu diễn trước công chúng; Goldberg năm 1955 và 1981."
  loai: lich-su
- trang: piano/nghe-si
  id: n30
  cau: "Alfred Brendel (1931–2025): Beethoven, Schubert, Haydn, Liszt; người đầu
    tiên thu âm trọn tác phẩm piano độc tấu của Beethoven; viết tiểu luận và
    thơ."
  loai: lich-su
- trang: piano/nghe-si
  id: n31
  cau: "Vladimir Ashkenazy (sinh 1937): giải Nhì Chopin 1955, giải Nhất Queen
    Elisabeth 1956 và Tchaikovsky 1962 (chung với John Ogdon); kho thu âm khổng
    lồ; về sau chuyên chỉ huy, thôi biểu diễn năm 2020."
  loai: lich-su
- trang: piano/nghe-si
  id: n32
  cau: "Martha Argerich (sinh 1941): lửa và tốc độ; thắng Busoni và Geneva năm
    1957, Chopin năm 1965; từ thập niên 1980 ít độc tấu, chủ yếu concerto và
    thính phòng."
  loai: lich-su
- trang: piano/nghe-si
  id: n33
  cau: "Maurizio Pollini (1942–2024): chính xác, kiến trúc rõ; thắng Chopin năm
    1960 khi 18 tuổi; bền bỉ bênh vực nhạc thế kỷ 20."
  loai: lich-su
- trang: piano/nghe-si
  id: n34
  cau: "Maria João Pires (sinh 1944): Mozart, Schubert, Chopin giản dị và sâu;
    thắng cuộc thi mừng 200 năm ngày sinh Beethoven ở Brussels năm 1970; từ năm
    2025 ngừng biểu diễn, và tháng 11/2025 bà thông báo đã kết thúc sự nghiệp
    biểu diễn."
  loai: lich-su
- trang: piano/nghe-si
  id: n35
  cau: "Radu Lupu (1945–2022): tiếng đàn mềm như hát, rất kín tiếng; thắng Van
    Cliburn 1966 và Leeds 1969; ngồi ghế tựa thay cho ghế đàn."
  loai: lich-su
- trang: piano/nghe-si
  id: n36
  cau: "Murray Perahia (sinh 1947): giải Nhất Leeds 1972; vừa chơi vừa chỉ huy các
    concerto Mozart; Bach trong sáng."
  loai: lich-su
- trang: piano/nghe-si
  id: n37
  cau: "Mitsuko Uchida (sinh 1948): Mozart và Schubert tinh tế; giải Nhì Chopin
    1970 và Leeds 1975."
  loai: lich-su
- trang: piano/nghe-si
  id: n38
  cau: "Grigory Sokolov (sinh 1950): thắng Tchaikovsky năm 1966 lúc 16 tuổi, người
    trẻ nhất từng thắng; chủ yếu chơi độc tấu; phần lớn đĩa gần đây là bản thu
    trực tiếp."
  loai: lich-su
- trang: piano/nghe-si
  id: n39
  cau: "András Schiff (sinh 1953): Bach rõ ràng, ít bàn đạp; Beethoven, Schubert,
    Bartók; nghe trước: Bình quân luật, Goldberg."
  loai: lich-su
- trang: piano/nghe-si
  id: n40
  cau: "Krystian Zimerman (sinh 1956): thắng Chopin năm 1975; cầu toàn; năm 1999
    vừa chơi vừa chỉ huy hai concerto Chopin với dàn nhạc do ông lập; nghe
    trước: bốn Ballade Chopin, Préludes của Debussy, Sonata D. 959 và D. 960 của
    Schubert."
  loai: lich-su
- trang: piano/nghe-si
  id: n41
  cau: "Angela Hewitt (sinh 1958): thắng cuộc thi piano Bach quốc tế ở Toronto năm
    1985, thu các tác phẩm phím lớn của Bach từ 1994 đến 2005; Couperin."
  loai: lich-su
- trang: piano/nghe-si
  id: n42
  cau: "Marc-André Hamelin (sinh 1961): kỹ thuật phi thường cho những tác phẩm
    hiếm (Alkan, Godowsky, Medtner, Kapustin); tự viết 12 étude ở mọi giọng
    thứ."
  loai: lich-su
- trang: piano/nghe-si
  id: n43
  cau: "Evgeny Kissin (sinh 1971): thần đồng; năm 1984, khi 12 tuổi, đã thu hai
    concerto Chopin."
  loai: lich-su
- trang: piano/nghe-si
  id: n44
  cau: "Lang Lang (sinh 1982): nghệ sĩ Trung Quốc; biểu diễn ở lễ khai mạc Olympic
    Bắc Kinh 2008 và với nhiều dàn nhạc lớn ở châu Âu, Mỹ."
  loai: lich-su
- trang: piano/nghe-si
  id: n45
  cau: "Yuja Wang (sinh 1987): nổi tiếng với các concerto Nga; năm 2023 chơi trọn
    bốn concerto của Rachmaninoff trong một buổi ở Carnegie Hall."
  loai: lich-su
- trang: piano/nghe-si
  id: n46
  cau: "Igor Levit (sinh 1987): trọn 32 sonata Beethoven (2019); hơn 50 buổi hòa
    nhạc phát trực tuyến từ nhà mùa xuân 2020; chơi trọn Vexations của Satie
    trong hơn 15 giờ."
  loai: lich-su
- trang: piano/nghe-si
  id: n47
  cau: "Daniil Trifonov (sinh 1991): giải Ba Chopin 2010; giải Nhất Rubinstein và
    Tchaikovsky (kèm Grand Prix) năm 2011; Grammy 2018 cho trọn bộ étude của
    Liszt."
  loai: lich-su
- trang: piano/nghe-si
  id: n48
  cau: "Seong-Jin Cho (sinh 1994): giải Nhất Chopin 2015."
  loai: lich-su
- trang: piano/nghe-si
  id: n49
  cau: "Jan Lisiecki (sinh 1995): nghệ sĩ Canada; thu Chopin (concerto, étude,
    nocturne) và Mendelssohn."
  loai: lich-su
- trang: piano/nghe-si
  id: n50
  cau: "Bruce Liu (sinh 1997): giải Nhất Chopin 2021; học với Đặng Thái Sơn ở
    Montréal."
  loai: lich-su
- trang: piano/nghe-si
  id: n51
  cau: "Eric Lu (sinh 1997): giải Tư Chopin 2015, giải Nhất Leeds 2018, giải Nhất
    Chopin 2025; từng học riêng với Đặng Thái Sơn."
  loai: lich-su
- trang: piano/nghe-si
  id: n52
  cau: "Yunchan Lim (sinh 2004): huy chương vàng Van Cliburn 2022 lúc 18 tuổi,
    người trẻ nhất từng thắng; album Étude Chopin đoạt giải Gramophone 2024;
    nghe trước: Concerto số 3 của Rachmaninoff ở chung kết Cliburn 2022."
  loai: lich-su
- trang: piano/nghe-si
  id: n53
  cau: "Aristo Sham (Hồng Kông): huy chương vàng Van Cliburn 2025."
  loai: lich-su
- trang: piano/nghe-si
  id: n55
  cau: Đặng Thái Sơn (sinh 1958 ở Hà Nội) học những bài đầu tiên với mẹ, nghệ sĩ
    piano Thái Thị Liên, giảng viên Học viện Âm nhạc Quốc gia Việt Nam; năm
    1974, nghệ sĩ Nga Isaac Katz phát hiện tài năng của ông; ông sang học ở Nhạc
    viện Tchaikovsky (Moskva) với Vladimir Natanson và Dmitry Bashkirov.
  loai: lich-su
- trang: piano/nghe-si
  id: n56
  cau: Năm 1980 Đặng Thái Sơn giành giải Nhất Cuộc thi Chopin, người châu Á đầu
    tiên đạt giải này; ông dạy khoảng 20 năm ở Đại học Montréal, rồi ở Nhạc viện
    Oberlin (từ 2018) và New England Conservatory (từ 2020); hai học trò, Bruce
    Liu và Eric Lu, thắng cuộc thi Chopin năm 2021 và 2025; ông ngồi ghế giám
    khảo cuộc thi Chopin các năm 2005, 2010, 2015, 2021 và 2025.
  loai: lich-su
- trang: piano/nghe-si
  id: n57
  cau: "Nghe trước: Chopin của Đặng Thái Sơn, đặc biệt hai concerto thu trên một
    cây đàn Érard năm 1849 cùng nhạc trưởng Frans Brüggen và dàn nhạc Orchestra
    of the Eighteenth Century (Viện Fryderyk Chopin phát hành)."
  loai: lich-su
- trang: piano/nghe-si
  id: n58
  cau: Nghiêm Phú Phi (1930–2008) tốt nghiệp hạng ưu ở Paris về piano và hòa âm,
    từng làm Giám đốc Trường Quốc gia Âm nhạc và Kịch nghệ ở Sài Gòn.
  loai: lich-su
- trang: piano/nghe-si
  id: n59
  cau: "Cuộc thi Piano Quốc tế Chopin (Warsaw, từ 1927, 5 năm một lần từ 1955):
    chỉ chơi nhạc Chopin; Pollini (1960), Argerich (1965), Zimerman (1975), Đặng
    Thái Sơn (1980); gần đây Seong-Jin Cho (2015), Bruce Liu (2021, hoãn từ 2020
    vì đại dịch), Eric Lu (2025)."
  loai: lich-su
- trang: piano/nghe-si
  id: n60
  cau: "Cuộc thi Quốc tế Tchaikovsky (Moskva, từ 1958, 4 năm một lần): Van Cliburn
    thắng phần piano lần đầu tiên (1958); gần đây Alexandre Kantorow (2019),
    Sergei Davydchenko (2023); từ tháng 4/2022, WFIMC loại cuộc thi khỏi danh
    sách thành viên."
  loai: lich-su
- trang: piano/nghe-si
  id: n61
  cau: "Leeds International Piano Competition (Leeds, Anh, từ 1963, 3 năm một
    lần): Lupu (1969), Perahia (1972); gần đây Eric Lu (2018), Alim Beisembayev
    (2021), Jaeden Izik-Dzurko (2024)."
  loai: lich-su
- trang: piano/nghe-si
  id: n62
  cau: "Van Cliburn International Piano Competition (Fort Worth, Texas, Mỹ, từ
    1962, 4 năm một lần): Lupu (1966); gần đây Yekwon Sunwoo (2017), Yunchan Lim
    (2022), Aristo Sham (2025)."
  loai: lich-su
- trang: piano/nghe-si
  id: n63
  cau: "Queen Elisabeth Competition (Brussels, Bỉ): tiền thân là cuộc thi Ysaÿe,
    piano từ 1938 (Gilels thắng); luân phiên các bộ môn; Leon Fleisher (1952),
    Ashkenazy (1956); gần đây Jonathan Fournel (2021), Nikola Meeuwsen (2025)."
  loai: lich-su
- trang: piano/nghe-si
  id: n64
  cau: "Các cuộc thi khác: Geneva (Michelangeli thắng năm 1939, Argerich năm
    1957), Busoni ở Bolzano (Argerich 1957), Clara Haskil ở Vevey (từ 1963, hai
    năm một lần), Arthur Rubinstein ở Tel Aviv (Trifonov 2011)."
  loai: lich-su
- trang: piano/nghe-si
  id: n65
  cau: Nhiều cuộc thi phát trực tiếp các vòng thi trên mạng (link Âm nhạc hôm nay
    /opus/lich-su/duong-dai/).
  loai: lich-su
- trang: piano/nghe-si
  id: n66
  cau: "Giải thưởng không phải là tất cả: Mitsuko Uchida chỉ đoạt giải Nhì ở
    Chopin 1970 và Leeds 1975; Ashkenazy giải Nhì ở Chopin 1955; một cuộc thi đo
    phong độ của vài tuần, còn một sự nghiệp đo sự trưởng thành của nhiều thập
    kỷ."
  loai: lich-su
- trang: piano/nghe-si
  id: n70
  cau: "Mục 30 tác phẩm: Baroque (1–5): Couperin Les Barricades mystérieuses; Bach
    Bình quân luật quyển 1 (24 cặp prelude và fugue qua mọi giọng); Bach Partita
    số 2 Đô thứ BWV 826; Bach Goldberg Variations; Scarlatti Sonata K. 141 và K.
    380."
  loai: danh-muc
- trang: piano/nghe-si
  id: n71
  cau: "Cổ điển (6–11): Haydn Sonata Mi♭ trưởng Hob. XVI:52 (một trong những
    sonata cuối, viết ở London); Mozart Sonata La trưởng K. 331; Concerto số 21
    Đô trưởng K. 467; Beethoven Sonata Pathétique Op. 13; Ánh trăng Op. 27 số 2;
    Sonata số 32 Đô thứ Op. 111 (hai chương, arietta với chuỗi biến tấu)."
  loai: danh-muc
- trang: piano/nghe-si
  id: n72
  cau: "Lãng mạn (12–22): Schubert Impromptu D. 899; Sonata Si♭ trưởng D. 960;
    Schumann Kinderszenen Op. 15; Chopin Nocturne Op. 9 số 2; Étude Op. 10 và
    Op. 25; Ballade số 1 Sol thứ Op. 23; Liszt Liebestraum số 3; Sonata Si thứ
    (một chương dài khoảng nửa giờ); Brahms Intermezzo Op. 117 và Op. 118; Grieg
    Concerto La thứ Op. 16; Mussorgsky Tranh triển lãm."
  loai: danh-muc
- trang: piano/nghe-si
  id: n73
  cau: 'Thế kỷ 20 và hôm nay (23–30): Satie Gymnopédies; Debussy Clair de lune rồi
    Préludes quyển 1; Ravel Gaspard de la nuit (Ondine, Le Gibet, Scarbo, theo
    thơ Aloysius Bertrand); Rachmaninoff Concerto số 2; Gershwin Rhapsody in
    Blue; Bartók Allegro barbaro; Prokofiev Sonata số 7 ("sonata chiến tranh",
    chương cuối nhịp 7/8); Ligeti Études quyển 1.'
  loai: danh-muc
- trang: piano/nghe-si
  id: n77
  cau: "Câu hỏi kiểm tra nhanh (4 câu): chữ recital lần đầu dùng ở buổi diễn của
    Liszt ở London năm 1840 (không phải Mozart ở Vienna 1781 hay Chopin ở Paris
    1832); Schnabel thu trọn 32 sonata Beethoven (1932–1935, London); so sánh
    hai bản thu nên chỉnh to ngang nhau; Bruce Liu (2021) và Eric Lu (2025) là
    hai học trò của Đặng Thái Sơn thắng Chopin."
  loai: lich-su
- trang: piano/nghe-si
  id: n78
  cau: "Mục Nguồn cuối trang: Schonberg The Great Pianists (Simon & Schuster,
    1963; bản sửa đổi 1987); Dubal The Art of the Piano (tái bản lần 3, Amadeus
    Press, 2004); Grove Music Online; hai bài báo (classical-music.com,
    Gramophone International Piano); WFIMC và trang chính thức của các cuộc thi
    (Leeds, Van Cliburn, Queen Elisabeth)."
  loai: ten
- trang: piano/nghe-si
  id: n74
  cau: 'Phần "Nghe" của 30 tác phẩm: các tên nghệ sĩ gợi ý (Hewitt, Fischer,
    Richter, Schiff, Argerich, Gould, Schiff, Levit, Horowitz, Brendel, Hamelin,
    Uchida, Pires, Perahia, Serkin, Kempff, Schnabel, Pollini, Lupu, Zimerman,
    Rubinstein, Lim, Lipatti, Gieseking, Michelangeli, Pogorelich, Kocsis,
    Aimard, Ciccolini, Rogé).'
  loai: khuyen-tap
- trang: piano/nghe-si
  id: n75
  cau: "Mỗi mô tả ngắn của tác phẩm (ví dụ: dòng nốt rải so le không dứt như tấm
    vải đang dệt; hợp âm đầy, tương phản mạnh, nhiều bất ngờ; giai điệu dài như
    bài hát và tiếng láy rền trầm ngay trang đầu; piano như trống, hợp âm dồn
    dập, nhịp trần trụi; những lớp nhịp chồng lên nhau đến chóng mặt)."
  loai: khuyen-tap
- trang: piano/nghe-si
  id: n54
  cau: Cột "Nghe trước" ở các bảng nghệ sĩ là gợi ý nghe (tác phẩm, bản thu),
    không phải khẳng định cần nguồn.
  loai: khuyen-tap
- trang: piano/tac-pham-theo-cap
  id: n6
  cau: Các danh sách tham khảo khác nhau thường xếp cùng một bài lệch nhau một,
