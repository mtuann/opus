- trang: bat-dau/hoi-dap
  id: n2
  cau: "Người lớn bắt đầu học piano không muộn: người lớn vẫn học được piano và có lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp động tác, nên ngón tay người lớn có thể quen chậm hơn."
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n5
  cau: Tăng thời gian tập từ từ và luôn xen giờ nghỉ (xem Giữ đôi tay khỏe).
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n7
  cau: "Bài \"Spring Waltz\" không phải của Chopin: đó là Mariage d'Amour của Paul de Senneville, nổi tiếng qua các bản thu của Richard Clayderman."
  loai: lich-su
- trang: bat-dau/hoi-dap
  id: n33
  cau: "Đô cố định: Đô luôn là nốt C, dù bản nhạc ở giọng nào; đây là cách dùng ở các nước như Pháp, Ý."
  loai: dinh-nghia
- trang: bat-dau/hoi-dap
  id: n34
  cau: 'Đô di động: "Đô" là chủ âm của giọng trưởng đang chơi (ở giọng Sol trưởng nốt Sol được hát là "Đô"); cách này phát triển trong dạy hát hợp xướng ở Anh, và Kodály chủ trương dùng nó để dạy đọc nhạc; phương pháp của ông dùng nó cho thị xướng, nghe chép và luyện tai.'
  loai: dinh-nghia
- trang: bat-dau/hoi-dap
  id: n49
  cau: Ở Việt Nam, tên nốt gọi là Đô, Rê, Mi; trong tài liệu tiếng Anh và trong ký hiệu hợp âm (C, Am, G7), tên nốt viết bằng chữ cái.
  loai: ten
- trang: bat-dau/hoi-dap
  id: n50
  cau: Trên iPhone, chế độ im lặng mặc định tắt cả tiếng do trang web phát.
  loai: quy-tac
- trang: bat-dau/ung-dung
  id: n2
  cau: "Trên iPhone, iPad (Safari): mở site bằng Safari; bấm nút ⋯ (Menu của trang), rồi bấm Chia sẻ; nếu bố cục tab là Dưới cùng hay Trên cùng, bấm thẳng nút Chia sẻ (hình vuông có mũi tên lên); cuộn xuống và chọn Thêm vào Màn hình chính (Add to Home Screen)."
  loai: quy-tac
- trang: lich-su/duong-dai
  id: n16
  cau: Sofia Gubaidulina, cùng Schnittke và Denisov là một trong ba nhà soạn nhạc lớn ở Moskva thời sau Shostakovich (theo nhà xuất bản Boosey & Hawkes), mất ngày 13/3/2025 ở tuổi 93.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n5
  cau: "Nhạc viện TP.HCM: thành lập 1956, tiền thân là Trường Quốc gia Âm nhạc Sài Gòn; 112 Nguyễn Du, TP.HCM; đào tạo cả nhạc phương Tây và nhạc truyền thống."
  loai: ten
- trang: lich-su/viet-nam
  id: n27
  cau: Từ năm 1956, Trường Quốc gia Âm nhạc (nay là Nhạc viện TP.HCM) đào tạo bài bản lứa nghệ sĩ mới.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n30
  cau: Nghiêm Phú Phi cũng hòa âm cho nhiều đĩa nhạc miền Nam trước 1975, trong đó có các trường ca Hòn Vọng Phu, Mẹ Việt Nam, Con đường cái quan.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n35
  cau: Đỗ Hồng Quân viết khí nhạc, nhạc phim và nhạc sân khấu, trong đó có giao hưởng Trổ một và tổ khúc ba lê Hồng hoang.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n36
  cau: "Đặng Hữu Phúc (sinh 1953): học sáng tác và piano ở Hà Nội, tu nghiệp ở Paris, giảng viên sáng tác ở Học viện Âm nhạc Quốc gia Việt Nam; viết nhạc phim (giải Kim Tước cho nhạc phim ở Liên hoan Phim quốc tế Thượng Hải năm 2005) và nhạc giao hưởng, thính phòng; Đặng Thái Sơn đã biểu diễn một số tác phẩm piano của ông, như Suite và Sonate polyphonique."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n38
  cau: "Lương Huệ Trinh (sinh 1985): học tại Học viện Âm nhạc Quốc gia Việt Nam, rồi học thạc sĩ sáng tác đa phương tiện ở Hamburg (2015–2018, tốt nghiệp loại ưu); viết nhạc điện-âm và đa phương tiện; tác phẩm gồm buổi hòa nhạc đa phương tiện Thư Hà Nội (viết cùng Jean-David Caillouet)."
  loai: lich-su
- trang: piano/chon-dan
  id: n5
  cau: "Piano cơ đại: dây nằm ngang, búa rơi về nhờ trọng lượng; đánh lặp một nốt nhanh hơn đàn đứng (theo Yamaha: tới khoảng 15 lần mỗi giây, đàn đứng khoảng 7); rất đắt, cần phòng rộng."
  loai: quy-tac
- trang: piano/chon-dan
  id: n6
  cau: "Đàn lai (hybrid) và đàn cơ có hệ thống tắt tiếng: bộ máy phím cơ (hoặc rất gần đàn cơ) kèm âm thanh số; tập được bằng tai nghe; đàn cơ có hệ thống tắt tiếng vẫn là đàn cơ: vẫn cần lên dây và giữ độ ẩm."
  loai: quy-tac
- trang: piano/chon-dan
  id: n12
  cau: "Số nốt phát đồng thời (polyphony): nên cao, nhất là khi hay dùng bàn đạp vang; con số ghi trong sách hướng dẫn của từng đàn; nốt được bàn đạp vang giữ ngân vẫn tính vào polyphony; đàn có polyphony thấp có thể tắt nốt cũ để nhường chỗ cho nốt mới."
  loai: quy-tac
- trang: piano/chon-dan
  id: n13
  cau: "Bàn đạp vang: loại liên tục (cho phép nửa bàn đạp); nếu được, site khuyên chọn bộ ba bàn đạp gắn vào chân đàn; bàn đạp dạng công tắc chỉ có bật và tắt, không cho nửa bàn đạp."
  loai: quy-tac
- trang: piano/chon-dan
  id: n16
  cau: "Chân đàn và ghế: chân chắc, không rung; ghế chỉnh được độ cao; ghế chỉnh được thì đặt được độ cao hợp với người ngồi; cách ngồi xem Tư thế, thế tay và cách dùng lực."
  loai: quy-tac
- trang: piano/chon-dan
  id: n21
  cau: "Bảng kiểm tra đàn cơ: trục lên dây và thớt giữ trục (pin block): trục lỏng, đàn xuống dây nhanh; cao độ hiện tại so với chuẩn La4 = 440 Hz, đàn để quá lâu không lên dây thì khó đưa về trạng thái tốt; bảng cộng hưởng và các sườn gỗ nứt, bong; búa mòn, rãnh sâu; bộ máy: phím đều, không kẹt, bộ giảm âm tắt gọn; dây và khung gỉ, nứt; phím và bàn đạp; bên trong thùng đàn có côn trùng làm hỏng nỉ (búa, bộ giảm âm và các phần nỉ khác)."
  loai: quy-tac
- trang: piano/chon-dan
  id: n22
  cau: Từ số seri, có thể tra năm sản xuất trong sách tra cứu như Pierce Piano Atlas; không tra được thì thợ đôi khi ước đoán được.
  loai: quy-tac
- trang: piano/chon-dan
  id: n27
  cau: "Góc tập: nơi bạn đi qua hằng ngày, nắp phím mở, bản nhạc đặt sẵn; ghế chỉnh được độ cao, người thấp cần bục kê chân; ánh sáng chiếu đều lên giá nhạc, không để bóng tay đổ lên phím; bút chì, tẩy, sổ tập hoặc nhật ký luyện tập; điện thoại hay máy tính bảng mở sẵn site; giá đỡ quay video; giờ tập yên tĩnh, thỏa thuận với hàng xóm, thảm dưới đàn giảm tiếng truyền qua sàn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n29
  cau: "Lên dây: Yamaha khuyên lên dây ít nhất một lần một năm, đàn mới hay đàn chơi nhiều thì hai lần một năm hoặc hơn; đàn để quá lâu không lên dây thì khó đưa về trạng thái tốt, thợ tốn nhiều công hơn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n34
  cau: "Câu hỏi kiểm tra nhanh (4 câu): 88 phím, búa nặng dần là tiêu chí quan trọng nhất; polyphony quan trọng khi chơi có bàn đạp vang vì nốt được bàn đạp giữ ngân vẫn tính vào polyphony, thiếu thì đàn tắt bớt nốt cũ (polyphony là số nốt tối đa đàn phát được cùng lúc); nhờ thợ đàn độc lập khi mua piano cơ đã qua sử dụng; ở khí hậu nồm ẩm, theo dõi bằng ẩm kế và hút ẩm."
  loai: quy-tac
- trang: piano/nghe-si
  id: n5
  cau: Liszt chơi một mình, chơi nhiều bài thuộc lòng (điều khán giả thời ấy chưa quen thấy), dù không phải bài nào ông cũng chơi thuộc.
  loai: lich-su
- trang: piano/nghe-si
  id: n16
  cau: 'Alfred Cortot (1877–1962): Chopin và Schumann giàu chất thơ (nhận xét của site); soạn các ấn bản "để học" (Édition de travail) của Chopin; Chopin: 24 Prélude, các Ballade.'
  loai: lich-su
- trang: piano/nghe-si
  id: n20
  cau: "Wilhelm Kempff (1895–1991): Beethoven và Schubert hát, tự nhiên; thu trọn 32 sonata Beethoven hai lần (1951–56 và 1964–65)."
  loai: lich-su
- trang: piano/nghe-si
  id: n21
  cau: "Clara Haskil (1895–1960): Mozart giản dị và sâu; cuộc thi mang tên bà (Thụy Sĩ, nay ở Vevey) có từ năm 1963; nghe trước: Concerto số 20 và số 24 của Mozart."
  loai: lich-su
- trang: piano/nghe-si
  id: n28
  cau: "Arturo Benedetti Michelangeli (1920–1995): kiểm soát âm thanh tuyệt đối, cầu toàn đến cả tình trạng cây đàn; giải Nhất Geneva 1939; Pollini học riêng với ông."
  loai: lich-su
- trang: piano/nghe-si
  id: n30
  cau: "Alfred Brendel (1931–2025): Beethoven, Schubert, Haydn, Liszt; người đầu tiên thu âm trọn tác phẩm piano của Beethoven; viết tiểu luận và thơ."
  loai: lich-su
- trang: piano/nghe-si
  id: n32
  cau: "Martha Argerich (sinh 1941): lửa và tốc độ; thắng Busoni và Geneva năm 1957, Chopin năm 1965; ít bản thu độc tấu, chủ yếu concerto và thính phòng."
  loai: lich-su
- trang: piano/nghe-si
  id: n36
  cau: "Murray Perahia (sinh 1947): giải Nhất Leeds 1972; vừa chơi vừa chỉ huy concerto (như của Beethoven) với Academy of St Martin in the Fields; Bach trong sáng."
  loai: lich-su
- trang: piano/nghe-si
  id: n39
  cau: "András Schiff (sinh 1953): Bach rõ ràng, không dùng bàn đạp vang (theo bài viết của chính ông); Beethoven, Schubert, Bartók; nghe trước: Bình quân luật, Goldberg."
  loai: lich-su
- trang: piano/nghe-si
  id: n40
  cau: "Krystian Zimerman (sinh 1956): thắng Chopin năm 1975; cầu toàn; năm 1999 lập Polish Festival Orchestra (dàn nhạc nhạc công trẻ Ba Lan) và thu hai concerto Chopin với dàn nhạc ấy; nghe trước: bốn Ballade Chopin, Préludes của Debussy, Sonata D. 959 và D. 960 của Schubert."
  loai: lich-su
- trang: piano/nghe-si
  id: n41
  cau: "Angela Hewitt (sinh 1958): thắng cuộc thi piano Bach quốc tế ở Toronto năm 1985, thu các tác phẩm phím đàn lớn của Bach cho hãng Hyperion; Couperin."
  loai: lich-su
- trang: piano/nghe-si
  id: n44
  cau: "Lang Lang (sinh 1982): nghệ sĩ Trung Quốc; biểu diễn ở lễ khai mạc Olympic Bắc Kinh 2008 và với nhiều dàn nhạc hàng đầu thế giới."
  loai: lich-su
- trang: piano/nghe-si
  id: n46
  cau: "Igor Levit (sinh 1987): trọn 32 sonata Beethoven; nhiều buổi hòa nhạc phát trực tuyến từ nhà trên Twitter từ tháng 3/2020; chơi trọn Vexations của Satie trong hơn 15 giờ."
  loai: lich-su
- trang: piano/nghe-si
  id: n47
  cau: "Daniil Trifonov (sinh 1991): giải Ba Chopin 2010; giải Nhất Rubinstein và Tchaikovsky (kèm Grand Prix) năm 2011; Grammy 2018 cho album Transcendental (Liszt)."
  loai: lich-su
- trang: piano/nghe-si
  id: n49
  cau: "Jan Lisiecki (sinh 1995): nghệ sĩ Canada; thu Chopin (concerto, nocturne, prelude) và Mozart."
  loai: lich-su
- trang: piano/nghe-si
  id: n50
  cau: "Bruce Liu (sinh 1997): giải Nhất Chopin 2021; học với Đặng Thái Sơn."
  loai: lich-su
- trang: piano/nghe-si
  id: n52
  cau: "Yunchan Lim (sinh 2004): huy chương vàng Van Cliburn 2022 lúc 18 tuổi, người trẻ nhất từng thắng; album Étude Chopin đoạt ba giải của BBC Music Magazine năm 2025; nghe trước: Concerto số 3 của Rachmaninoff ở chung kết Cliburn 2022."
  loai: lich-su
- trang: piano/nghe-si
  id: n64
  cau: "Các cuộc thi khác: Geneva (Michelangeli thắng năm 1939, Argerich năm 1957), Busoni ở Bolzano (Argerich 1957), Clara Haskil ở Thụy Sĩ (từ 1963, hai năm một lần; nay ở Vevey), Arthur Rubinstein ở Tel Aviv (Trifonov 2011)."
  loai: lich-su
- trang: piano/nghe-si
  id: n77
  cau: "Câu hỏi kiểm tra nhanh (4 câu): chữ recital lần đầu dùng ở buổi diễn của Liszt ở London năm 1840 (không phải Mozart ở Vienna 1781 hay Chopin ở Paris 1832); Schnabel thu trọn 32 sonata Beethoven (1932–1935, London); so sánh hai bản thu nên chỉnh to ngang nhau để hai bản chỉ khác nhau ở cách chơi; Bruce Liu (2021) và Eric Lu (2025) là hai học trò của Đặng Thái Sơn thắng Chopin."
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n32
  cau: Mức 7 của Sonata Ánh trăng là cho cả bản, gồm cả chương 3 Presto agitato; riêng chương 1 thì site xếp ở chặng 5.
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n52
  cau: "Bảng chặng 5: Nocturne Mi thứ Op. 72 số 1 có trong danh sách Grade 8 của ABRSM (2027–2028), còn Henle xếp mức 5; Nocturne Đô♯ thứ di cảo là B. 49."
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n59
  cau: "Kiss the Rain: La♭ trưởng, 4/4, ♩ = khoảng 76, theo bản Musicnotes MN0073221 (link ở dòng Bản nhạc); bản soạn khác có thể ở giọng, tốc độ khác."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n60
  cau: "One Summer's Day: Đô trưởng, 4/4, ♩ = 80, theo bản piano solo Musicnotes MN0151256 (link ở dòng Bản nhạc); bản soạn khác có thể ghi tốc độ khác."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n61
  cau: "Mariage d'Amour: Sol thứ, chủ yếu 4/4 có vài ô 3/4, mở đầu Moderato ♩ = 72 (Musicnotes MN0114635); Comptine: Mi thứ, 4/4, ♩ = 100 (Musicnotes MN0091413); Nuvole bianche: Fa thứ, mở đầu 4/4 ♩ = khoảng 40, phần chính 12/8 ♩. = 78 (Musicnotes MN0106486)."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n63
  cau: Hai tập SOLO của Faber Music (Original, Easy) in các bài trong album SOLO (2021) nhân 20 năm sáng tác của Yiruma, là bản được tác giả duyệt; Andrew Eales xếp tập gốc quanh Grade 5 và tập dễ quanh Grade 3 (Pianodao 2023).
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n64
  cau: River Flows in You hay bị nhầm với Bella's Lullaby, đoạn piano Carter Burwell viết cho phim Twilight (2008); River Flows in You nằm trong album First Love của Yiruma từ 2001.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n65
  cau: Joe Hisaishi (sinh 1950), nhà soạn nhạc Nhật Bản, viết nhạc cho nhiều phim của Hayao Miyazaki và Studio Ghibli; One Summer's Day là nhạc phim Spirited Away (2001) của Studio Ghibli.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n66
  cau: Itsumo nando demo (Always with Me) trong phim Spirited Away có nhạc của Youmi Kimura; ABRSM ghi tên Youmi Kimura (không ghi Hisaishi) khi đưa một bản soạn của bài vào danh sách Grade 3 (2025–2026).
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n67
  cau: Paul de Senneville (1933–2023), nhà soạn nhạc và nhà sản xuất người Pháp; Mariage d'Amour gắn với các bản thu của Richard Clayderman; bản in trên Musicnotes đề năm bản quyền 1980.
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n68
  cau: Trên mạng, Mariage d'Amour có khi mang tên "Spring Waltz" và bị gắn cho Chopin; bản nhạc được cấp phép ghi tác giả là Paul de Senneville; Chopin không có bài nào như vậy.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n69
  cau: "Yann Tiersen (sinh 1970), nhạc sĩ người Pháp; Comptine d'un autre été: l'après-midi trong nhạc phim Le Fabuleux Destin d'Amélie Poulain (2001)."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n75
  cau: Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred, 1995); Maurice Hinson và Wesley Roberts, Guide to the Pianist's Repertoire, ấn bản 4 (Indiana University Press, 2013).
  loai: ten
- trang: piano/tac-pham-theo-cap
  id: r1
  cau: "Bảng chặng 1: tên, tác giả, danh mục, năm, thời kỳ của các hàng: 10 bài đầu tiên (Largo của Dvořák: Giao hưởng số 9 Op. 95; Ode to Joy: Giao hưởng số 9 Op. 125), Alfred's Basic Adult Piano Course (Palmer, Manus, Lethco), Faber Adult Piano Adventures (Nancy và Randall Faber), Bartók Mikrokosmos Sz. 107, Diabelli Melodische Übungsstücke Op. 149 bốn tay (thế kỷ 19, phong cách Cổ điển), Czerny Op. 599 (thế kỷ 19), Gurlitt Anfangs-Stunden Op. 117 (Lãng mạn). Türk, Stravinsky, Kurtág: n43–n45."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r2
  cau: "Bảng chặng 2: tên, số trong tập, danh mục, thời kỳ của các bài không có bản ghi: Sổ nhạc Anna Magdalena 1725 (Minuet Anh. 116, Polonaise Anh. 119, Hành khúc Anh. 122 gán C. P. E. Bach), Notenbuch für Wolfgang (Minuet, Bourrée; sổ khuyết danh giữa thế kỷ 18), Mozart K. 1a, K. 3, Schumann Op. 68 số 2, 8, 10, Tchaikovsky Op. 39 The Sick Doll, Kabalevsky Op. 39 Clowns số 20, Bartók For Children Sz. 42 (dân ca Hungary và Slovakia), Gretchaninov Op. 98 và Glass Beads Op. 123, Shostakovich Children's Notebook Op. 69 (March, Waltz, Bear), Burgmüller Op. 100 số 3 La pastorale."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r3
  cau: "Bảng chặng 3: Clementi Op. 36 số 2 (Sol trưởng), số 3 (Đô trưởng); Kuhlau Op. 20 số 1 và Op. 55 số 1 (Đô trưởng); Diabelli Op. 151, Op. 168 (thế kỷ 19, phong cách Cổ điển); Burgmüller Op. 100 số 9 La chasse, số 15 Ballade; Bach BWV 926 (Rê thứ), BWV 999 (Đô thứ, viết cho đàn luýt); Tchaikovsky Op. 39 Sweet Dreams, Italian Song, Waltz; Schumann Op. 68 số 16 Erster Verlust; Kabalevsky Toccatina Op. 27 số 12; Prokofiev Op. 65 số 1 Morning, số 2 Promenade; Heller Op. 47; Pärt Für Alina (1976)."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r4
  cau: "Bảng chặng 4: Bach BWV 933–938 (933 Đô trưởng, 935 Rê thứ), Invention số 8 Fa trưởng BWV 779, Scarlatti K. 32 Rê thứ (Aria), Handel Suite Rê thứ HWV 437 (Sarabande), Beethoven Op. 49 số 1 Sol thứ (số 2 chương 2 Tempo di Menuetto), Clementi Op. 36 số 4–6, Kuhlau Op. 20 số 2, 3, Chopin Prélude Op. 28 số 6 Si thứ, số 20 Đô thứ (ff rồi p, pp), Mazurka Op. 68 số 2 La thứ, Op. 67 số 2 Sol thứ, Satie Gnossienne số 1 (cuối thế kỷ 19), Grieg Op. 12 số 2 Vals, số 4 Alfedans, Schumann Op. 68 số 12 Knecht Ruprecht, Tchaikovsky Op. 39 The Sorcerer, Lark Song."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r5
  cau: "Bảng chặng 5: Bach Invention số 4 Rê thứ BWV 775 (nhịp 3/8), số 13 La thứ BWV 784; Schumann Kinderszenen Op. 15 số 1 Von fremden Ländern und Menschen; Haydn Sonata Đô trưởng Hob. XVI:35; Schubert Moments musicaux D. 780 số 3 Fa thứ; Brahms Valse Op. 39 số 15 La♭ trưởng; Kabalevsky Sonatina Đô trưởng Op. 13 số 1; Debussy The Little Shepherd (Children's Corner số 5); Bartók Romanian Folk Dances Sz. 56 (sáu điệu múa). Nocturne Op. 72 số 1, B. 49: n52."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r6
  cau: "Bảng chặng 6: Mozart K. 330 Đô trưởng, Fantasia K. 397 Rê thứ (khoảng mười ô cuối có lẽ do A. E. Müller viết thêm); Bach Sinfonia BWV 787–801, French Suite số 5 Sol trưởng BWV 816; Schubert Impromptu D. 899 số 2 Mi♭ trưởng; Brahms Op. 118 số 2 La trưởng, Op. 117 số 1 Mi♭ trưởng; Chopin Op. 64 số 1 Rê♭ trưởng, số 2 Đô♯ thứ, Prélude Op. 28 số 15 Rê♭ trưởng (đoạn giữa Đô♯ thứ); Grieg Op. 65 số 6; Debussy Arabesque số 1 Mi trưởng, Préludes quyển 1 số 8; Liszt Consolation số 3 Rê♭ trưởng S. 172; Rachmaninoff Op. 3 số 2 Đô♯ thứ; Ravel Menuet sur le nom d'Haydn (1909, chủ đề từ chữ cái tên Haydn); Gershwin Three Preludes."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r7
  cau: "Bảng chặng 7: Chopin Ballade số 2–4 (Op. 38, 47, 52), bốn Scherzo (Op. 20, 31, 39, 54), Études Op. 10, 25, Sonata Op. 35, 58, Barcarolle Op. 60; Bach Bình quân luật BWV 846–893, Partita BWV 825–830, Goldberg BWV 988; Beethoven Waldstein Op. 53, Appassionata Op. 57, Op. 109, 110, 111 (fugue ở Op. 110); Haydn Hob. XVI:52 Mi♭ trưởng; Mozart K. 310 La thứ, Concerto số 21 K. 467; Schubert D. 958, 959, 960, Wanderer-Fantasie D. 760; Schumann Op. 9, 16, 17; Liszt Sonata S. 178, Études d'exécution transcendante S. 139; Brahms Op. 118, 119, 24; Debussy Préludes, Estampes, Images; Ravel Sonatine, Le Tombeau de Couperin, Jeux d'eau, Gaspard de la nuit; Rachmaninoff Op. 23, 32, 33, 39, Concerto số 2; Prokofiev Sonata số 7 Op. 83, Toccata Op. 11; Bartók Sonata (1926), Out of Doors; Messiaen Vingt regards; Ligeti Musica ricercata, Études."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: s1
  cau: "River Flows in You (bản Musicnotes): đoạn mở đầu tự do có dấu ngân, tay phải có nhóm móc kép và nốt hoa mỹ nhỏ, tay trái rải hợp âm; tay trái đi lại một vòng bốn hợp âm qua nhiều ô."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s2
  cau: "Kiss the Rain (bản Musicnotes): bốn dấu giáng, những đoạn ghi 8va, đầu bài tay trái viết ở khóa Sol rồi chuyển sang khóa Fa; giai điệu ở nốt trên của hợp âm tay phải; nốt hoa mỹ nhỏ và liên ba."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s3
  cau: "One Summer's Day (bản piano solo Musicnotes): portato (chuỗi nốt lặp có chấm dưới dấu luyến); hai lớp trong tay phải; hợp âm có dấu rải ở đoạn mở đầu; tay trái giữ hợp âm ngân, có chỗ rải rộng hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s4
  cau: "Mariage d'Amour (bản Musicnotes): tay trái rải hợp âm liên tục; giai điệu ở tay phải; có ô đổi sang 3/4."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s5
  cau: "Comptine d'un autre été: l'après-midi (bản Musicnotes): tay trái hai bè gần như suốt bài, ngón 5 và 4 đi nốt đen ở dưới, ngón cái lặp móc đơn ở trên; tay phải đi từ nhóm móc kép ngắn sang nốt kép; sắc thái p, mf, to dần, nhỏ dần."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s6
  cau: "Nuvole bianche (bản Musicnotes): allargando ở đoạn mở đầu, poco accelerando khi vào phần chính 12/8; hai bè trong tay phải (nốt lặp ở trên, nốt ngân ở dưới)."
  loai: cau-truc
- trang: piano/thay-va-thi
  id: n25
  cau: "ABRSM: ARSM dành cho người đã qua Grade 8, thi trực tiếp (nơi có tổ chức) hoặc qua video; LRSM và FRSM theo định dạng mới từ 2024, nộp video buổi biểu diễn kèm tài liệu bổ trợ; cả ba yêu cầu đã đỗ Grade 8 ABRSM (Performance hoặc Practical) hay bằng tương đương của hội đồng thi khác trong danh sách ABRSM chấp nhận; với LRSM và FRSM, kinh nghiệm biểu diễn chuyên nghiệp được ABRSM duyệt trước cũng thay được Grade 8."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n31
  cau: Trong các cơ sở đào tạo âm nhạc chuyên nghiệp ở Việt Nam có Học viện Âm nhạc Quốc gia Việt Nam (Hà Nội), Nhạc viện Thành phố Hồ Chí Minh và Học viện Âm nhạc Huế; hai trường đầu có khoa Piano.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n35
  cau: "Zoom: Settings → Audio, chọn Original sound for musicians, tắt Automatically adjust microphone volume; bật High-fidelity music mode nếu dùng mạng dây; nên dùng tai nghe, còn nếu nghe qua loa thì bật Echo cancellation."
  loai: quy-tac
- trang: tai-nguyen
  id: n18
  cau: "Young People's Concerts của Leonard Bernstein: loạt chương trình truyền hình cùng New York Philharmonic (1958–1972); kịch bản từng buổi có trên trang Leonard Bernstein."
  loai: ten
- trang: tai-nguyen
  id: n21
  cau: "Building a Library của BBC Radio 3: mỗi tập, một chuyên gia nghe nhiều bản thu của một tác phẩm và chọn bản nên có; nghe qua podcast Record Review (link Apple Podcasts)."
  loai: ten
- trang: tai-nguyen
  id: n24
  cau: "Dịch vụ chuyên nhạc cổ điển: Apple Music Classical, Idagio; tìm được theo nhà soạn nhạc, tác phẩm và người biểu diễn."
  loai: ten
- trang: tai-nguyen
  id: n31
  cau: "Kênh YouTube: Inside the Score (video phân tích nhạc cổ điển và nhạc phim); David Bennett Music Theory (video giải thích nhạc lý); Nahre Sol (video về sáng tạo âm nhạc, lấy cảm hứng từ nhạc xưa và nay); Ben Laude (nghệ sĩ piano, giáo viên âm nhạc, làm video về piano)."
  loai: ten
- trang: nhac-cu/index
  id: n25
  cau: Lối hai bè quen thuộc của kèn horn tự nhiên ("quãng năm kèn horn") gợi tiếng kèn horn.
  loai: dinh-nghia
- trang: nhac-cu/index
  id: n26
  cau: "Ba hợp âm Le-be-wohl mở đầu sonata Les Adieux Op. 81a của Beethoven dựa trên một hình nét kèn horn tự nhiên: hai bè đi qua quãng 3 trưởng, quãng 5 đúng, quãng 6 thứ."
  loai: dinh-nghia
- trang: nhac-cu/index
  id: n27
  cau: Trong các sonata của Scarlatti có những hợp âm rải bắt chước tiếng gảy dây guitar.
  loai: dinh-nghia
