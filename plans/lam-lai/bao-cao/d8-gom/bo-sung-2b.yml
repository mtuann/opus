- trang: bat-dau/hoi-dap
  id: n2
  cau: "Người lớn bắt đầu học piano không muộn: người lớn vẫn học được piano và có
    lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp
    động tác, nên ngón tay người lớn có thể quen chậm hơn."
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n5
  cau: Tăng thời gian tập từ từ và luôn xen giờ nghỉ (xem Giữ đôi tay khỏe).
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n34
  cau: 'Đô di động: "Đô" là chủ âm của giọng trưởng đang chơi (ở giọng Sol trưởng
    nốt Sol được hát là "Đô"); cách này phát triển trong dạy hát hợp xướng ở
    Anh, và Kodály chủ trương dùng nó để dạy đọc nhạc; phương pháp của ông dùng
    nó cho thị xướng, nghe chép và luyện tai.'
  loai: dinh-nghia
- trang: bat-dau/hoi-dap
  id: n49
  cau: Ở Việt Nam, tên nốt gọi là Đô, Rê, Mi; trong tài liệu tiếng Anh và trong ký
    hiệu hợp âm (C, Am, G7), tên nốt viết bằng chữ cái.
  loai: ten
- trang: bat-dau/ung-dung
  id: n2
  cau: "Trên iPhone, iPad (Safari): mở site bằng Safari; bấm nút ⋯ (Menu của
    trang), rồi bấm Chia sẻ; nếu bố cục tab là Dưới cùng hay Trên cùng, bấm
    thẳng nút Chia sẻ (hình vuông có mũi tên lên); cuộn xuống và chọn Thêm vào
    Màn hình chính (Add to Home Screen)."
  loai: quy-tac
- trang: lich-su/viet-nam
  id: n5
  cau: "Nhạc viện TP.HCM: thành lập 1956, tiền thân là Trường Quốc gia Âm nhạc Sài
    Gòn; 112 Nguyễn Du, TP.HCM; đào tạo cả nhạc phương Tây và nhạc truyền
    thống."
  loai: ten
- trang: lich-su/viet-nam
  id: n27
  cau: Từ năm 1956, Trường Quốc gia Âm nhạc (nay là Nhạc viện TP.HCM) đào tạo bài
    bản lứa nghệ sĩ mới.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n35
  cau: Đỗ Hồng Quân viết khí nhạc, nhạc phim và nhạc sân khấu, trong đó có giao
    hưởng Trổ một và tổ khúc ba lê Hồng hoang.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n36
  cau: "Đặng Hữu Phúc (sinh 1953): học sáng tác và piano ở Hà Nội, tu nghiệp ở
    Paris, giảng viên sáng tác ở Học viện Âm nhạc Quốc gia Việt Nam; viết nhạc
    phim (giải Kim Tước cho nhạc phim ở Liên hoan Phim quốc tế Thượng Hải năm
    2005) và nhạc giao hưởng, thính phòng; Đặng Thái Sơn đã biểu diễn một số tác
    phẩm piano của ông, như Suite và Sonate polyphonique."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n38
  cau: "Lương Huệ Trinh (sinh 1985): học tại Học viện Âm nhạc Quốc gia Việt Nam,
    rồi học thạc sĩ sáng tác đa phương tiện ở Hamburg (2015–2018, tốt nghiệp
    loại ưu); viết nhạc điện-âm và đa phương tiện; tác phẩm gồm buổi hòa nhạc đa
    phương tiện Thư Hà Nội (viết cùng Jean-David Caillouet)."
  loai: lich-su
- trang: piano/chon-dan
  id: n5
  cau: "Piano cơ đại: dây nằm ngang, búa rơi về nhờ trọng lượng; đánh lặp một nốt
    nhanh hơn đàn đứng (theo Yamaha: tới khoảng 15 lần mỗi giây, đàn đứng khoảng
    7); rất đắt, cần phòng rộng."
  loai: quy-tac
- trang: piano/chon-dan
  id: n6
  cau: "Đàn lai (hybrid) và đàn cơ có hệ thống tắt tiếng: bộ máy phím cơ (hoặc rất
    gần đàn cơ) kèm âm thanh số; tập được bằng tai nghe; đàn cơ có hệ thống tắt
    tiếng vẫn là đàn cơ: vẫn cần lên dây và giữ độ ẩm."
  loai: quy-tac
- trang: piano/chon-dan
  id: n12
  cau: "Số nốt phát đồng thời (polyphony): nên cao, nhất là khi hay dùng bàn đạp
    vang; con số ghi trong sách hướng dẫn của từng đàn; nốt được bàn đạp vang
    giữ ngân vẫn tính vào polyphony; đàn có polyphony thấp có thể tắt nốt cũ để
    nhường chỗ cho nốt mới."
  loai: quy-tac
- trang: piano/chon-dan
  id: n13
  cau: "Bàn đạp vang: loại liên tục (cho phép nửa bàn đạp); nếu được, site khuyên
    chọn bộ ba bàn đạp gắn vào chân đàn; bàn đạp dạng công tắc chỉ có bật và
    tắt, không cho nửa bàn đạp."
  loai: quy-tac
- trang: piano/chon-dan
  id: n16
  cau: "Chân đàn và ghế: chân chắc, không rung; ghế chỉnh được độ cao; ghế chỉnh
    được thì đặt được độ cao hợp với người ngồi; cách ngồi xem Tư thế, thế tay
    và cách dùng lực."
  loai: quy-tac
- trang: piano/chon-dan
  id: n21
  cau: "Bảng kiểm tra đàn cơ: trục lên dây và thớt giữ trục (pin block): trục
    lỏng, đàn xuống dây nhanh; cao độ hiện tại so với chuẩn La4 = 440 Hz, đàn để
    quá lâu không lên dây thì khó đưa về trạng thái tốt; bảng cộng hưởng và các
    sườn gỗ nứt, bong; búa mòn, rãnh sâu; bộ máy: phím đều, không kẹt, bộ giảm
    âm tắt gọn; dây và khung gỉ, nứt; phím và bàn đạp; bên trong thùng đàn có
    côn trùng làm hỏng nỉ (búa, bộ giảm âm và các phần nỉ khác)."
  loai: quy-tac
- trang: piano/chon-dan
  id: n22
  cau: Từ số seri, có thể tra năm sản xuất trong sách tra cứu như Pierce Piano
    Atlas; không tra được thì thợ đôi khi ước đoán được.
  loai: quy-tac
- trang: piano/chon-dan
  id: n27
  cau: "Góc tập: nơi bạn đi qua hằng ngày, nắp phím mở, bản nhạc đặt sẵn; ghế
    chỉnh được độ cao, người thấp cần bục kê chân; ánh sáng chiếu đều lên giá
    nhạc, không để bóng tay đổ lên phím; bút chì, tẩy, sổ tập hoặc nhật ký luyện
    tập; điện thoại hay máy tính bảng mở sẵn site; giá đỡ quay video; giờ tập
    yên tĩnh, thỏa thuận với hàng xóm, thảm dưới đàn giảm tiếng truyền qua sàn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n29
  cau: "Lên dây: Yamaha khuyên lên dây ít nhất một lần một năm, đàn mới hay đàn
    chơi nhiều thì hai lần một năm hoặc hơn; đàn để quá lâu không lên dây thì
    khó đưa về trạng thái tốt, thợ tốn nhiều công hơn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n34
  cau: "Câu hỏi kiểm tra nhanh (4 câu): 88 phím, búa nặng dần là tiêu chí quan
    trọng nhất; polyphony quan trọng khi chơi có bàn đạp vang vì nốt được bàn
    đạp giữ ngân vẫn tính vào polyphony, thiếu thì đàn tắt bớt nốt cũ (polyphony
    là số nốt tối đa đàn phát được cùng lúc); nhờ thợ đàn độc lập khi mua piano
    cơ đã qua sử dụng; ở khí hậu nồm ẩm, theo dõi bằng ẩm kế và hút ẩm."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n25
  cau: "ABRSM: ARSM dành cho người đã qua Grade 8, thi trực tiếp (nơi có tổ chức)
    hoặc qua video; LRSM và FRSM theo định dạng mới từ 2024, nộp video buổi biểu
    diễn kèm tài liệu bổ trợ; cả ba yêu cầu đã đỗ Grade 8 ABRSM (Performance
    hoặc Practical) hay bằng tương đương của hội đồng thi khác trong danh sách
    ABRSM chấp nhận; với LRSM và FRSM, kinh nghiệm biểu diễn chuyên nghiệp được
    ABRSM duyệt trước cũng thay được Grade 8."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n31
  cau: Trong các cơ sở đào tạo âm nhạc chuyên nghiệp ở Việt Nam có Học viện Âm
    nhạc Quốc gia Việt Nam (Hà Nội), Nhạc viện Thành phố Hồ Chí Minh và Học viện
    Âm nhạc Huế; hai trường đầu có khoa Piano.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n35
  cau: "Zoom: Settings → Audio, chọn Original sound for musicians, tắt
    Automatically adjust microphone volume; bật High-fidelity music mode nếu
    dùng mạng dây; nên dùng tai nghe, còn nếu nghe qua loa thì bật Echo
    cancellation."
  loai: quy-tac
- trang: tai-nguyen
  id: n18
  cau: "Young People's Concerts của Leonard Bernstein: loạt chương trình truyền
    hình cùng New York Philharmonic (1958–1972); kịch bản từng buổi có trên
    trang Leonard Bernstein."
  loai: ten
- trang: tai-nguyen
  id: n21
  cau: "Building a Library của BBC Radio 3: mỗi tập, một chuyên gia nghe nhiều bản
    thu của một tác phẩm và chọn bản nên có; nghe qua podcast Record Review
    (link Apple Podcasts)."
  loai: ten
- trang: tai-nguyen
  id: n24
  cau: "Dịch vụ chuyên nhạc cổ điển: Apple Music Classical, Idagio; tìm được theo
    nhà soạn nhạc, tác phẩm và người biểu diễn."
  loai: ten
- trang: tai-nguyen
  id: n31
  cau: "Kênh YouTube: Inside the Score (video phân tích nhạc cổ điển và nhạc
    phim); David Bennett Music Theory (video giải thích nhạc lý); Nahre Sol
    (video về sáng tạo âm nhạc, lấy cảm hứng từ nhạc xưa và nay); Ben Laude
    (nghệ sĩ piano, giáo viên âm nhạc, làm video về piano)."
  loai: ten
- trang: nhac-cu/index
  id: n25
  cau: Lối hai bè quen thuộc của kèn horn tự nhiên ("quãng năm kèn horn") gợi
    tiếng kèn horn.
  loai: dinh-nghia
- trang: nhac-cu/index
  id: n26
  cau: "Ba hợp âm Le-be-wohl mở đầu sonata Les Adieux Op. 81a của Beethoven dựa
    trên một hình nét kèn horn tự nhiên: hai bè đi qua quãng 3 trưởng, quãng 5
    đúng, quãng 6 thứ."
  loai: dinh-nghia
- trang: nhac-cu/index
  id: n27
  cau: Trong các sonata của Scarlatti có những hợp âm rải bắt chước tiếng gảy dây
    guitar.
  loai: dinh-nghia
