- trang: bat-dau/hoi-dap
  id: n2
  cau: "Người lớn bắt đầu học piano không muộn: người lớn vẫn học được piano và có
    lợi thế ở cách tự sắp xếp việc học; người học từ nhỏ có lợi thế về phối hợp
    động tác, nên ngón tay người lớn có thể quen chậm hơn; nhiều người bắt đầu ở
    tuổi 40, 50, 60 vẫn chơi được những tác phẩm họ yêu thích."
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n5
  cau: "Mỗi ngày nên tập: năm đầu 20–45 phút mỗi ngày là đủ, nên chia hai buổi
    ngắn nếu được; sau đó tăng dần lên 60–90 phút, tăng từ từ và luôn xen giờ
    nghỉ."
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n7
  cau: "Bài \"Spring Waltz\" không phải của Chopin: đó là Mariage d'Amour của Paul
    de Senneville, viết năm 1978 và nổi tiếng qua bản thu của Richard
    Clayderman."
  loai: lich-su
- trang: bat-dau/hoi-dap
  id: n9
  cau: Mariage d'Amour còn bản quyền, nên hãy dùng bản nhạc được cấp phép.
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n10
  cau: "Các bài nhạc phim, River Flows in You, Kiss the Rain… còn bản quyền: hãy
    dùng bản nhạc được cấp phép (nhà xuất bản hoặc trang bán bản nhạc như
    Musicnotes), không dùng bản chép lậu."
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n17
  cau: IMSLP và Mutopia có bản nhạc cổ điển thuộc phạm vi công cộng hay dùng giấy
    phép mở.
  loai: lich-su
- trang: bat-dau/hoi-dap
  id: n18
  cau: IMSLP gắn nhãn tình trạng bản quyền theo luật Canada, Mỹ và Liên minh châu
    Âu cho từng bản nhạc; ở nước khác, trong đó có Việt Nam, bạn cần đối chiếu
    luật nước mình.
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n19
  cau: Các ấn bản Urtext mới, bản soạn lại và nhạc của tác giả còn sống hoặc mới
    mất vẫn được bảo hộ.
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n20
  cau: Ở Việt Nam, quyền tác giả có thời hạn bảo hộ do Luật Sở hữu trí tuệ quy
    định (Điều 27); hết thời hạn thì tác phẩm thuộc về công chúng.
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n22
  cau: "Tay nhỏ, ngón ngắn vẫn học piano được: phần lớn văn học piano không đòi
    bàn tay lớn; khi gặp quãng tám hay hợp âm rộng có cách chọn ngón, rải hợp
    âm, chia nốt cho tay kia; đừng cố căng tay quá sức."
  loai: quy-tac
- trang: bat-dau/hoi-dap
  id: n33
  cau: "Đô cố định: Đô luôn là nốt C, dù bản nhạc ở giọng nào; đây là cách dùng ở
    Pháp, Ý, Tây Ban Nha, Nga…"
  loai: dinh-nghia
- trang: bat-dau/hoi-dap
  id: n34
  cau: 'Đô di động: "Đô" là chủ âm của giọng đang chơi (ở giọng Sol trưởng nốt Sol
    được hát là "Đô"); phổ biến ở Anh, Mỹ, Hungary (phương pháp Kodály), rất
    mạnh cho luyện tai.'
  loai: dinh-nghia
- trang: bat-dau/hoi-dap
  id: n41
  cau: Ở một buổi độc tấu piano, chọn ghế bên trái khán phòng nếu muốn nhìn thấy
    tay nghệ sĩ.
  loai: khuyen-tap
- trang: bat-dau/hoi-dap
  id: n26
  cau: Thi cấp (ABRSM, Trinity) không bắt buộc; cho một mục tiêu có hạn chót và
    chương trình cân đối (tác phẩm, gam, thị tấu, nghe); có thể khiến chỉ tập
    đúng ba bài thi trong cả năm.
  loai: khuyen-tap
- trang: bat-dau/hoi-dap
  id: n24
  cau: "Hanon và các bài tập ngón: có thể tập với liều lượng nhỏ và có ý thức
    (chậm, thả lỏng, đổi tiết tấu), nhưng không thay được gam, hợp âm rải và các
    étude có nhạc tính."
  loai: khuyen-tap
- trang: bat-dau/ung-dung
  id: n2
  cau: "Trên iPhone, iPad (Safari): mở site bằng Safari; bấm nút Chia sẻ (hình
    vuông có mũi tên lên; ở một số bản iOS nút này nằm trong menu ⋯ cạnh thanh
    địa chỉ); cuộn xuống và chọn Thêm vào Màn hình chính (Add to Home Screen)."
  loai: quy-tac
- trang: bat-dau/ung-dung
  id: n3
  cau: "Trên Android (Chrome): mở site bằng Chrome; bấm menu ⋮ ở góc trên; chọn
    mục cài đặt ứng dụng trong menu (Chrome ghi Install and create shortcut),
    rồi bấm Install."
  loai: quy-tac
- trang: bat-dau/ung-dung
  id: n4
  cau: "Trên máy tính: bấm biểu tượng cài đặt trên thanh địa chỉ: ở Chrome là biểu
    tượng Install, ở Edge là biểu tượng App available rồi nút Install; ở Chrome
    còn có thể vào menu ⋮, chọn Cast, save, and share, rồi Install page as app."
  loai: quy-tac
- trang: bat-dau/ung-dung
  id: n10
  cau: "Dữ liệu luyện tập nằm trong trình duyệt, và bản cài ra màn hình chính có
    thể không dùng chung dữ liệu với trình duyệt đã cài nó: trên iPhone, iPad
    ứng dụng ở Màn hình chính có kho dữ liệu riêng, và bản cài từ hai trình
    duyệt khác nhau cũng không dùng chung dữ liệu."
  loai: so-lieu
- trang: lich-su/duong-dai
  id: n1
  cau: "Nhạc cổ điển không dừng lại ở Beethoven: các nhà soạn nhạc vẫn đang viết
    giao hưởng, opera, concerto, và nhiều tác phẩm mới được biểu diễn mỗi mùa
    diễn."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n2
  cau: 'Arvo Pärt (Estonia), sinh 1935: Spiegel im Spiegel, Fratres; phong cách
    "tintinnabuli": tĩnh lặng, như tiếng chuông.'
  loai: lich-su
- trang: lich-su/duong-dai
  id: n3
  cau: "Steve Reich (Mỹ), sinh 1936: Music for 18 Musicians; một trong những người
    khai sinh chủ nghĩa tối giản."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n4
  cau: "Philip Glass (Mỹ), sinh 1937: Glassworks, nhạc phim The Hours; tối giản,
    mẫu lặp lại."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n5
  cau: "John Adams (Mỹ), sinh 1947: Short Ride in a Fast Machine; tối giản và hậu
    tối giản; opera Nixon in China (1987)."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n6
  cau: "Kaija Saariaho (Phần Lan), 1952–2023: L'Amour de loin; chú trọng âm sắc,
    thường kết hợp điện tử."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n7
  cau: "Max Richter (Anh/Đức), sinh 1966: On the Nature of Daylight, Vivaldi
    Recomposed; giao thoa giữa cổ điển, điện tử và nhạc phim."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n8
  cau: "Thomas Adès (Anh), sinh 1971: dàn nhạc Asyla (1997); opera The Tempest
    (2004)."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n9
  cau: "Jessie Montgomery (Mỹ), sinh 1981: Strum; nhiều tác phẩm cho đàn dây, lấy
    chất liệu từ nhạc dân gian Mỹ."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n10
  cau: "Caroline Shaw (Mỹ), sinh 1982: Partita for 8 Voices; đoạt giải Pulitzer
    năm 2013 với tác phẩm này."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n11
  cau: "Sofia Gubaidulina (Nga), 1931–2025: Offertorium, De profundis; mất tháng
    3/2025; link các nhà soạn nhạc nữ."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n12
  cau: "Cuộc thi Piano Quốc tế Chopin lần thứ 19 (Warsaw, tháng 10/2025): giải
    Nhất Eric Lu (Mỹ); giải Nhì Kevin Chen (Canada), giải Ba Zitong Wang (Trung
    Quốc)."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n13
  cau: Ban giám khảo cuộc thi Chopin 2025 do Garrick Ohlsson làm chủ tịch, có Đặng
    Thái Sơn.
  loai: lich-su
- trang: lich-su/duong-dai
  id: n14
  cau: Các vòng thi Chopin 2025 được phát trên kênh YouTube của Viện Fryderyk
    Chopin; cuộc thi tiếp theo dự kiến vào năm 2030.
  loai: lich-su
- trang: lich-su/duong-dai
  id: n15
  cau: "Giải Pulitzer Âm nhạc (trao cho tác phẩm của nhà soạn nhạc Mỹ): 2024
    Tyshawn Sorey, Adagio (for Wadada Leo Smith); 2025 Susie Ibarra, Sky
    Islands; 2026 Gabriela Lena Frank, Picaflor: A Future Myth."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n16
  cau: Sofia Gubaidulina, một trong những nhà soạn nhạc quan trọng nhất cuối thế
    kỷ 20, mất ngày 13/3/2025 ở tuổi 93.
  loai: lich-su
- trang: lich-su/duong-dai
  id: n17
  cau: Đặng Thái Sơn là nghệ sĩ piano Việt Nam giành giải Nhất Cuộc thi Piano Quốc
    tế Chopin năm 1980, người châu Á đầu tiên đạt giải này.
  loai: lich-su
- trang: lich-su/duong-dai
  id: n18
  cau: Đặng Thái Sơn giảng dạy piano nhiều năm ở Canada và Mỹ, và là giám khảo
    cuộc thi Chopin năm 2025.
  loai: lich-su
- trang: lich-su/duong-dai
  id: n20
  cau: "Gramophone: tạp chí về nhạc cổ điển và các bản thu mới."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n21
  cau: "BBC Radio 3: đài phát nhạc cổ điển và hòa nhạc trực tiếp của BBC."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n22
  cau: "Classic FM: đài phát thanh nhạc cổ điển của Anh, kèm tin tức và bài viết."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n23
  cau: "Bachtrack: lịch biểu diễn khắp thế giới."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n24
  cau: "Digital Concert Hall của Berliner Philharmoniker: xem hòa nhạc trực tuyến
    (thuê bao trả phí, có dùng thử miễn phí)."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n25
  cau: "Medici.tv: hòa nhạc và opera trực tuyến."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n26
  cau: Cuộc thi Piano Quốc tế Chopin (Warsaw), 5 năm một lần.
  loai: lich-su
- trang: lich-su/duong-dai
  id: n27
  cau: "Cuộc thi Quốc tế Tchaikovsky (Moscow): piano, violin, cello, thanh nhạc…"
  loai: lich-su
- trang: lich-su/duong-dai
  id: n28
  cau: "Cuộc thi Queen Elisabeth (Brussels): luân phiên violin, piano, cello,
    thanh nhạc."
  loai: lich-su
- trang: lich-su/duong-dai
  id: n29
  cau: Cuộc thi Piano Quốc tế Van Cliburn (Mỹ).
  loai: lich-su
- trang: lich-su/duong-dai
  id: n30
  cau: "Các vòng thi thường được phát trực tiếp: nhiều cuộc thi phát trực tiếp các
    vòng thi trên mạng (cuộc thi Chopin phát trên kênh YouTube của Viện Fryderyk
    Chopin); đây là dịp hiếm để nghe cùng một tác phẩm qua nhiều cách diễn
    giải."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n1
  cau: Nhạc cổ điển phương Tây đến Việt Nam từ thời Pháp thuộc, rồi được đào tạo
    bài bản từ giữa thế kỷ 20.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n2
  cau: Ngày nay, Hà Nội và TP.HCM có các nhạc viện, dàn nhạc giao hưởng và nhà hát
    đủ sức đón những vở opera và nghệ sĩ quốc tế.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n4
  cau: "Học viện Âm nhạc Quốc gia Việt Nam (Hà Nội): thành lập 1956, tiền thân là
    Trường Âm nhạc Việt Nam; sau đổi tên thành Nhạc viện Hà Nội, và mang tên
    hiện nay từ năm 2008; học viện âm nhạc quốc gia ở Hà Nội."
  loai: ten
- trang: lich-su/viet-nam
  id: n5
  cau: "Nhạc viện TP.HCM: thành lập 12/4/1956, khi ấy là Trường Quốc gia Âm nhạc ở
    Sài Gòn; 112 Nguyễn Du, TP.HCM; đào tạo cả nhạc phương Tây và nhạc truyền
    thống."
  loai: ten
- trang: lich-su/viet-nam
  id: n6
  cau: "Học viện Âm nhạc Huế: thành lập 2007; cơ sở đào tạo âm nhạc ở miền Trung."
  loai: nam
- trang: lich-su/viet-nam
  id: n8
  cau: "Dàn nhạc Giao hưởng Việt Nam (VNSO, Hà Nội): một trong những đơn vị nghệ
    thuật chuyên nghiệp hàng đầu của cả nước."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n9
  cau: "VNSO: tiền thân hình thành từ năm 1959, được tổ chức lại năm 1984 (năm
    2024 kỷ niệm 40 năm thành lập)."
  loai: nam
- trang: lich-su/viet-nam
  id: n10
  cau: VNSO đã lưu diễn nước ngoài, trong đó có Carnegie Hall (New York) năm 2011.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n11
  cau: "Dàn nhạc Giao hưởng Mặt Trời (SSO): thành lập năm 2017, hoạt động dưới sự
    bảo trợ của Tập đoàn Sun Group, có nhạc trưởng người Pháp Olivier Ochanine."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n12
  cau: "Nhà hát Nhạc Vũ Kịch Việt Nam (Hà Nội) và Nhà hát Giao hưởng Nhạc Vũ kịch
    TP.HCM (HBSO): biểu diễn giao hưởng, opera và ballet."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n13
  cau: "Các dàn nhạc khác: Dàn nhạc Giao hưởng Trẻ Việt Nam (VYO), Dàn nhạc Giao
    hưởng Quân đội (MSO)."
  loai: ten
- trang: lich-su/viet-nam
  id: n14
  cau: Hội Nhạc cổ điển Việt Nam được thành lập năm 2025.
  loai: nam
- trang: lich-su/viet-nam
  id: n15
  cau: "Nhà hát Lớn Hà Nội: công trình kiến trúc Pháp xây từ 1901, hoàn thành năm
    1911."
  loai: nam
- trang: lich-su/viet-nam
  id: n16
  cau: Từ đầu năm 2026 Nhà hát Lớn Hà Nội đóng cửa để trùng tu, dự kiến khoảng hai
    năm.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n17
  cau: "Nhà hát Thành phố Hồ Chí Minh: nhà hát thành phố Sài Gòn xây dựng thời
    Pháp, khánh thành năm 1900."
  loai: nam
- trang: lich-su/viet-nam
  id: n18
  cau: "Nhà hát Hồ Gươm (40 Hàng Bài, Hà Nội): khai trương ngày 9/7/2023, kiến
    trúc tân cổ điển, sảnh chính 900 chỗ, dùng cho opera, ballet và giao hưởng."
  loai: nam
- trang: lich-su/viet-nam
  id: n19
  cau: Tháng 12/2023, Nhà hát Hồ Gươm được World Travel Awards đưa vào danh sách
    10 nhà hát opera tuyệt vời nhất thế giới.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n20
  cau: Đặng Thái Sơn là nghệ sĩ piano Việt Nam giành giải Nhất Cuộc thi Piano Quốc
    tế Chopin năm 1980, người châu Á đầu tiên đạt giải này.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n21
  cau: Ở cuộc thi Chopin lần thứ 19 (năm 2025), Đặng Thái Sơn là thành viên ban
    giám khảo.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n22
  cau: "Hoàng Việt (1928–1967) viết giao hưởng Quê hương khi học ở Nhạc viện Sofia
    (Bulgaria) và tốt nghiệp hạng ưu tú cuối năm 1964 với tác phẩm này; được coi
    là bản giao hưởng đầu tiên của Việt Nam: 4 chương, mang tính sử thi về cuộc
    kháng chiến; ông còn để lại giao hưởng Cửu Long dang dở."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n23
  cau: Đỗ Nhuận (1922–1991), học tại Nhạc viện Tchaikovsky (Moskva), viết Cô Sao
    (1965), vở thường được coi là opera đầu tiên của Việt Nam.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n24
  cau: Các thế hệ tiếp theo, như Ca Lê Thuần, tiếp tục viết giao hưởng, thơ giao
    hưởng và nhạc thính phòng, thường mang chất liệu dân gian.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n26
  cau: "Nhạc cổ điển phương Tây có mặt ở Sài Gòn từ thời Pháp thuộc: Nhà hát Lớn
    khánh thành năm 1900."
  loai: nam
- trang: lich-su/viet-nam
  id: n27
  cau: Từ năm 1956, Trường Quốc gia Âm nhạc (nay là Nhạc viện TP.HCM) đào tạo bài
    bản lứa nghệ sĩ mới, và các đài phát thanh ở Sài Gòn có ban nhạc cổ điển
    phương Tây riêng.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n28
  cau: Nghiêm Phú Phi (1930–2008) tốt nghiệp hạng ưu ở Paris về piano và hòa âm;
    làm Phó Giám đốc (từ 1965) rồi Giám đốc (từ 1970) Trường Quốc gia Âm nhạc và
    Kịch nghệ ở Sài Gòn.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n29
  cau: Nghiêm Phú Phi nghiên cứu nhạc cụ cổ truyền và kết hợp chúng với dàn nhạc
    giao hưởng phương Tây; tác phẩm gồm Divertimento (1960, 1965) và Fantasia I
    (1974).
  loai: lich-su
- trang: lich-su/viet-nam
  id: n30
  cau: Nghiêm Phú Phi cũng là một trong những nhạc sĩ hòa âm nổi tiếng nhất cho
    các đĩa nhạc miền Nam trước 1975 (có các trường ca Hòn Vọng Phu, Mẹ Việt
    Nam, Con đường cái quan).
  loai: lich-su
- trang: lich-su/viet-nam
  id: n31
  cau: "Tư liệu ghi nhận: giao hưởng Symphony Viet Nam 1975 của Lê Văn Khoa (viết
    trong khoảng 20 năm, công diễn lần đầu năm 1995); vũ kịch Kim Trọng Thúy
    Kiều (1962–1966) và nhạc kịch Sắc lụa trữ la (1958–1960) của Phạm Thế Mỹ;
    hợp xướng Cửu Long Giang (5 chương, 1972) của Phan Miêng; các hợp xướng tôn
    giáo quy mô lớn của linh mục Nguyễn Tiến Dũng."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n32
  cau: Nghệ sĩ violin Đỗ Thế Phiệt đoạt giải Grand Prix du Violon năm 1954.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n34
  cau: "Đỗ Hồng Quân (sinh 1956), con trai nhạc sĩ Đỗ Nhuận: học sáng tác và chỉ
    huy ở Nhạc viện Tchaikovsky (Moskva), giảng dạy sáng tác ở Nhạc viện Hà Nội
    hơn 25 năm."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n35
  cau: Tác phẩm của Đỗ Hồng Quân gồm Sắc xuân (đàn bầu và dàn nhạc) và opera Vầng
    trăng Him Lam (2024), được biểu diễn ở Nga, Mỹ, Pháp, Đức, Nhật, Singapore.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n36
  cau: "Đặng Hữu Phúc (sinh 1953): học sáng tác và piano ở Hà Nội, học tiếp ở
    Paris, giảng viên sáng tác ở Học viện Âm nhạc Quốc gia Việt Nam; viết nhạc
    phim và cả khí nhạc: ouverture Ngày hội (2003), Pizzicato Việt Nam (2009);
    Đặng Thái Sơn biểu diễn các tác phẩm piano của ông."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n37
  cau: "Nguyễn Mạnh Duy Linh: nhạc sĩ sáng tác; Concerto Grosso của ông được trình
    diễn trong hòa nhạc kỷ niệm 30 năm HBSO (tháng 8/2023)."
  loai: lich-su
- trang: lich-su/viet-nam
  id: n38
  cau: 'Lương Huệ Trinh (sinh 1985): học tại Học viện Âm nhạc Quốc gia Việt Nam,
    rồi học sáng tác đa phương tiện ở Hamburg (2015–2018, tốt nghiệp loại ưu);
    đại diện cho hướng "nhạc mới" của Việt Nam; tác phẩm gồm buổi hòa nhạc đa
    phương tiện Thư Hà Nội (viết cùng nhà soạn nhạc Pháp Jean-David Caillouët).'
  loai: lich-su
- trang: lich-su/viet-nam
  id: n40
  cau: Các dàn nhạc trong nước đưa tác phẩm của nhạc sĩ Việt vào chương trình.
  loai: lich-su
- trang: lich-su/viet-nam
  id: n41
  cau: "Đi xem hòa nhạc: tìm lịch diễn trên trang web và trang mạng xã hội chính
    thức của các nhà hát và dàn nhạc; giá vé khác nhau tùy chương trình và nhà
    hát, xem trên trang chính thức."
  loai: khuyen-tap
- trang: lich-su/viet-nam
  id: n7
  cau: Các cơ sở này có thể có lớp ngắn hạn hay giảng viên nhận dạy riêng; hãy hỏi
    trực tiếp; đây là nơi tốt để tìm thầy.
  loai: khuyen-tap
- trang: lich-su/viet-nam
  id: n39
  cau: 'Hãy để ý mục "tác phẩm Việt Nam" khi xem chương trình hòa nhạc của VNSO,
    HBSO hay SSO: đó là cách trực tiếp nhất để nghe nhạc cổ điển Việt Nam hôm
    nay.'
  loai: khuyen-tap
- trang: nhan-dien/nghe-mu
  id: n4
  cau: Các bản thu dưới đây lấy từ Wikimedia Commons, đều có giấy phép mở
    (Creative Commons, EFF Open Audio License hoặc phạm vi công cộng).
  loai: so-lieu
- trang: nhan-dien/nghe-mu
  id: n10
  cau: "Radio nhạc cổ điển: BBC Radio 3 nghe được trực tuyến."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n15
  cau: Một giao hưởng Lãng mạn có thể mở đầu bằng một đoạn chậm.
  loai: lich-su
- trang: nhan-dien/nghe-mu
  id: n20
  cau: "Bản thu t1 (chữ của công cụ nghe mù): J. S. Bach, Brandenburg Concerto số
    6, BWV 1051, chương 2 (Adagio ma non tanto); Advent Chamber Orchestra."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n21
  cau: "Bản thu t1, đáp án và dấu hiệu: Hai viola song tấu, cello và harpsichord
    đệm: kết cấu phức điệu, bè trầm đi đều. Chương chậm chỉ dùng nhóm nhỏ, dù cả
    tác phẩm là concerto; xếp Baroque, nhóm thính phòng."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n22
  cau: "Bản thu t2 (chữ của công cụ nghe mù): J. S. Bach, Brandenburg Concerto số
    4, BWV 1049, chương 1 (Allegro); Kevin MacLeod (incompetech.com)."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n23
  cau: "Bản thu t2, đáp án và dấu hiệu: Một nhóm độc tấu (violin và hai sáo dọc)
    đối đáp với dàn dây: concerto grosso; nhiều chuỗi, đoạn tutti quay lại như
    ritornello; xếp Baroque, dàn nhạc và nghệ sĩ độc tấu."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n24
  cau: 'Bản thu t3 (chữ của công cụ nghe mù): Vivaldi, Concerto "Mùa xuân" cung Mi
    trưởng, Op. 8 số 1, RV 269, chương 1 (Allegro); John Harrison (violin),
    Robert Turizziani chỉ huy, Wichita State University Chamber Players.'
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n25
  cau: "Bản thu t3, đáp án và dấu hiệu: Dàn dây mở đầu bằng chủ đề, violin độc tấu
    đối đáp xen các đoạn tutti quay lại (ritornello); xếp Baroque, dàn nhạc và
    nghệ sĩ độc tấu."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n26
  cau: "Bản thu t4 (chữ của công cụ nghe mù): J. S. Bach, Concerto violin cung Mi
    trưởng, BWV 1042, chương 2 (Adagio); Advent Chamber Orchestra, Jacques
    Israelievitch (violin)."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n27
  cau: "Bản thu t4, đáp án và dấu hiệu: Violin độc tấu hát trên một bè trầm lặp
    lại của dàn dây (bè trầm liên tục); xếp Baroque, dàn nhạc và nghệ sĩ độc
    tấu."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n28
  cau: "Bản thu t5 (chữ của công cụ nghe mù): Mozart, Eine kleine Nachtmusik, K.
    525, chương 1; Advent Chamber Orchestra."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n29
  cau: "Bản thu t5, đáp án và dấu hiệu: Mở đầu bằng hợp âm rải đi lên đồng loạt;
    câu nhạc ngắn, cân đối, hỏi – đáp; chủ điệu; hình thức sonata; xếp Cổ điển,
    dàn nhạc."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n30
  cau: "Bản thu t6 (chữ của công cụ nghe mù): Mozart, Giao hưởng số 40, K. 550,
    chương 4; Fulda Symphonic Orchestra, Simon Schindler chỉ huy (thu năm
    2001)."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n31
  cau: "Bản thu t6, đáp án và dấu hiệu: Chủ đề hợp âm rải vọt lên rồi trả lời nhẹ:
    câu hỏi – câu trả lời; dàn nhạc Cổ điển cỡ nhỏ; Sol thứ; xếp Cổ điển, dàn
    nhạc."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n32
  cau: "Bản thu t7 (chữ của công cụ nghe mù): Mozart, Ngũ tấu đàn dây cung Sol
    thứ, K. 516, chương 4; Roxana Pavel Goldstein, Elizabeth Choi (violin),
    Elias Goldstein, Sally Chisholm (viola), Jocelyn Butler (cello)."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n33
  cau: "Bản thu t7, đáp án và dấu hiệu: Năm nhạc cụ dây, mỗi bè một người: nhạc
    thính phòng; mở đầu Adagio ở Sol thứ, rồi Allegro Sol trưởng; xếp Cổ điển,
    nhóm thính phòng."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n34
  cau: 'Bản thu t8 (chữ của công cụ nghe mù): Beethoven, Bagatelle "Für Elise"
    cung La thứ, WoO 59; V. Gao (piano).'
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n35
  cau: "Bản thu t8, đáp án và dấu hiệu: Piano độc tấu; hình nốt láy ở La thứ xen
    các đoạn tươi sáng; rondo nhỏ, câu nhạc cân đối; xếp Cổ điển, một nhạc cụ."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n36
  cau: "Bản thu t9 (chữ của công cụ nghe mù): Chopin, Nocturne cung Si trưởng, Op.
    9 số 3; Patrizia Prati (piano)."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n37
  cau: "Bản thu t9, đáp án và dấu hiệu: Piano độc tấu; giai điệu dài như hát trên
    hợp âm rải rộng ở tay trái; rubato; hòa âm nhiều nửa cung; xếp Lãng mạn, một
    nhạc cụ."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n38
  cau: "Bản thu t10 (chữ của công cụ nghe mù): Debussy, Arabesque số 2 (khoảng
    1890); Patrizia Prati (piano)."
  loai: ten
- trang: nhan-dien/nghe-mu
  id: n39
  cau: "Bản thu t10, đáp án và dấu hiệu: Piano độc tấu, tác phẩm thời trẻ của
    Debussy, nằm giữa Lãng mạn muộn và Ấn tượng: cả hai câu trả lời được tính
    đúng."
  loai: cau-truc
- trang: nhan-dien/nghe-mu
  id: n2
  cau: Cách này cho biết bạn thật sự nhận diện được bằng tai hay chỉ nhớ thông tin
    về bài.
  loai: khuyen-tap
- trang: nhan-dien/nghe-mu
  id: n1
  cau: Nghe mù là nghe một bản nhạc mà không biết tên, rồi đoán.
  loai: khuyen-tap
- trang: nhan-dien/nghe-mu
  id: n8
  cau: Số lượng còn ít, nên sau vài vòng bạn sẽ nhớ đáp án; khi đó chuyển sang
    phiếu nghe mù với nguồn nhạc phong phú hơn.
  loai: khuyen-tap
- trang: piano/chon-dan
  id: n1
  cau: Phím quá nhẹ thì ngón tay không học được cách điều khiển sắc thái.
  loai: quy-tac
- trang: piano/chon-dan
  id: n3
  cau: "Piano điện: không cần lên dây; tập bằng tai nghe vào ban đêm; gọn, nhẹ;
    kết nối được với máy tính; cảm giác phím và tiếng đàn là mô phỏng, sắc thái
    rất nhỏ và bàn đạp kém tinh tế hơn đàn cơ tốt; hợp với người mới bắt đầu,
    sống ở chung cư, cần tập muộn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n4
  cau: "Piano cơ đứng: dây, búa và bảng cộng hưởng thật; cần lên dây định kỳ; nhạy
    với độ ẩm; tiếng to, khó tập đêm; nặng, chuyển nhà tốn kém; hợp với người có
    chỗ đặt đàn và muốn học lâu dài."
  loai: quy-tac
- trang: piano/chon-dan
  id: n5
  cau: "Piano cơ đại: bộ máy nằm ngang đánh lặp nhanh hơn; kiểm soát tiếng và bàn
    đạp tốt nhất; rất đắt, cần phòng rộng."
  loai: quy-tac
- trang: piano/chon-dan
  id: n6
  cau: "Đàn lai (hybrid) và đàn cơ có hệ thống tắt tiếng: bộ máy phím cơ (hoặc rất
    gần đàn cơ) kèm âm thanh số; tập được bằng tai nghe; giá cao."
  loai: quy-tac
- trang: piano/chon-dan
  id: n9
  cau: "Piano điện, danh sách kiểm tra: 88 phím, từ La0 (A0) đến Đô8 (C8); đàn 61
    hay 76 phím buộc bạn bỏ bớt nốt hoặc dời quãng tám."
  loai: dinh-nghia
- trang: piano/chon-dan
  id: n10
  cau: "Bộ máy phím: phím búa nặng dần (graded hammer action): phím trầm nặng hơn
    phím cao, giống đàn cơ; phím nhẹ hay bán nặng không dạy được kỹ thuật điều
    khiển tốc độ phím."
  loai: quy-tac
- trang: piano/chon-dan
  id: n12
  cau: "Số nốt phát đồng thời (polyphony): 128 trở lên; bàn đạp vang giữ nhiều nốt
    ngân cùng lúc nên ăn polyphony rất nhanh; thiếu thì nốt cũ bị cắt đột ngột ở
    đoạn nhiều bàn đạp."
  loai: so-lieu
- trang: piano/chon-dan
  id: n13
  cau: "Bàn đạp vang: loại liên tục (cho phép nửa bàn đạp), tốt nhất là bộ ba bàn
    đạp gắn vào chân đàn; bàn đạp dạng công tắc chỉ có bật và tắt; bàn đạp rời
    nhỏ hay trượt trên sàn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n16
  cau: "Chân đàn và ghế: chân chắc, không rung; ghế chỉnh được độ cao; ghế chữ X
    của đàn organ thường lung lay và không đúng độ cao."
  loai: quy-tac
- trang: piano/chon-dan
  id: n21
  cau: "Bảng kiểm tra đàn cơ: trục lên dây và thớt giữ trục (pin block): trục
    lỏng, đàn xuống dây nhanh; cao độ hiện tại so với chuẩn La4 = 440 Hz; bảng
    cộng hưởng và các sườn gỗ nứt, bong; búa mòn, rãnh sâu; bộ máy: phím đều,
    không kẹt, bộ giảm âm tắt gọn; dây và khung gỉ; phím và bàn đạp; bên trong
    thùng đàn có côn trùng làm hỏng nỉ, mối mọt."
  loai: quy-tac
- trang: piano/chon-dan
  id: n22
  cau: Thợ thường tra được năm sản xuất từ số seri của các hãng lớn.
  loai: quy-tac
- trang: piano/chon-dan
  id: n24
  cau: "Bàn đạp giữa: trên đàn đại thường là bàn đạp sostenuto (chỉ giữ ngân những
    nốt đang bấm); trên đàn đứng thường là bàn đạp tập, hạ một dải nỉ xuống để
    giảm tiếng."
  loai: quy-tac
- trang: piano/chon-dan
  id: n26
  cau: "Nếu ngân sách eo hẹp: thuê đàn theo tháng trong vài tháng đầu; mua piano
    điện đã qua sử dụng có 88 phím búa nặng dần, kiểm tra từng phím và bàn đạp;
    tập thêm trên đàn cơ ở trung tâm hay trường âm nhạc; nếu tạm thời chỉ có đàn
    phím nhẹ, coi đó là giải pháp ngắn hạn: thói quen dùng lực hình thành trên
    phím nhẹ khiến việc chuyển sang đàn cơ khó hơn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n28
  cau: Đồng hồ hẹn giờ nhắc nghỉ 10 phút sau mỗi 20 phút tập (theo BAPAM; xem Giữ
    đôi tay khỏe).
  loai: quy-tac
- trang: piano/chon-dan
  id: n29
  cau: "Lên dây: Yamaha khuyên lên dây ít nhất một lần một năm, đàn mới hay đàn
    chơi nhiều thì hai lần một năm hoặc hơn; đàn mới chuyển về cần vài tuần để
    quen với phòng rồi mới lên dây; đàn bỏ lâu ngày có thể phải kéo dây nhiều
    lần."
  loai: quy-tac
- trang: piano/chon-dan
  id: n30
  cau: "Độ ẩm: Yamaha khuyên độ ẩm tương đối trong khoảng 35–55%, lý tưởng là 45%;
    ở Việt Nam giữ độ ẩm trong khoảng ấy quanh năm không dễ, nên tránh ẩm cao
    kéo dài và thay đổi đột ngột; đặt ẩm kế, máy hút ẩm, đóng cửa sổ khi mưa;
    không đặt đàn sát cửa sổ, dưới nắng chiếu trực tiếp, ngay dưới luồng gió
    điều hòa hay cạnh bếp, phòng tắm; điều hòa chạy liên tục cũng có thể làm
    phòng quá khô; hỏi thợ về hệ thống kiểm soát độ ẩm lắp bên trong đàn."
  loai: quy-tac
- trang: piano/chon-dan
  id: n31
  cau: Đóng nắp phím sau khi tập để tránh bụi và ẩm; lau phím bằng khăn mềm, khô;
    theo Yamaha không dùng chất tẩy có cồn vì có thể làm phím đổi màu hay nứt;
    vết bẩn nặng thì dùng khăn mềm thấm nước pha ít nước rửa chén vắt thật kiệt,
    rồi lau lại bằng khăn hơi ẩm khác; không dùng khăn đó lau thân đàn.
  loai: quy-tac
- trang: piano/chon-dan
  id: n34
  cau: "Câu hỏi kiểm tra nhanh (4 câu): 88 phím, búa nặng dần là tiêu chí quan
    trọng nhất; polyphony từ 128 trở lên vì bàn đạp vang làm nhiều nốt ngân cùng
    lúc; nhờ thợ đàn độc lập khi mua piano cơ đã qua sử dụng; ở khí hậu nồm ẩm,
    theo dõi bằng ẩm kế và hút ẩm."
  loai: quy-tac
- trang: piano/chon-dan
  id: n11
  cau: "Âm thanh: lấy mẫu (sampling) hoặc mô hình hóa từ đàn đại; nghe kỹ tiếng
    trầm, cách nốt tắt dần, và khi chơi thật nhỏ."
  loai: khuyen-tap
- trang: piano/chon-dan
  id: n14
  cau: "Tai nghe: hai cổng tai nghe; tai nghe chụp tai kín, chất lượng tốt; để tập
    đêm, và thầy trò cùng nghe."
  loai: khuyen-tap
- trang: piano/chon-dan
  id: n20
  cau: "Piano cơ cũ: luôn nhờ một thợ đàn độc lập (không phải người của bên bán)
    đi cùng; phí kiểm tra rẻ hơn rất nhiều so với một cây đàn hỏng."
  loai: khuyen-tap
