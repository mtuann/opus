- trang: piano/nghe-si
  id: n5
  cau: Liszt chơi một mình, chơi nhiều bài thuộc lòng (điều khán giả thời ấy chưa
    quen thấy), dù không phải bài nào ông cũng chơi thuộc.
  loai: lich-su
- trang: piano/nghe-si
  id: n16
  cau: 'Alfred Cortot (1877–1962): Chopin và Schumann giàu chất thơ (nhận xét của
    site); soạn các ấn bản "để học" (Édition de travail) của Chopin; Chopin: 24
    Prélude, các Ballade.'
  loai: lich-su
- trang: piano/nghe-si
  id: n21
  cau: "Clara Haskil (1895–1960): Mozart giản dị và sâu; cuộc thi mang tên bà
    (Thụy Sĩ, nay ở Vevey) có từ năm 1963; nghe trước: Concerto số 20 và số 24
    của Mozart."
  loai: lich-su
- trang: piano/nghe-si
  id: n28
  cau: "Arturo Benedetti Michelangeli (1920–1995): kiểm soát âm thanh tuyệt đối,
    cầu toàn đến cả tình trạng cây đàn; giải Nhất Geneva 1939; Pollini học riêng
    với ông."
  loai: lich-su
- trang: piano/nghe-si
  id: n30
  cau: "Alfred Brendel (1931–2025): Beethoven, Schubert, Haydn, Liszt; người đầu
    tiên thu âm trọn tác phẩm piano của Beethoven; viết tiểu luận và thơ."
  loai: lich-su
- trang: piano/nghe-si
  id: n32
  cau: "Martha Argerich (sinh 1941): lửa và tốc độ; thắng Busoni và Geneva năm
    1957, Chopin năm 1965; ít bản thu độc tấu, chủ yếu concerto và thính phòng."
  loai: lich-su
- trang: piano/nghe-si
  id: n36
  cau: "Murray Perahia (sinh 1947): giải Nhất Leeds 1972; vừa chơi vừa chỉ huy
    concerto (như của Beethoven) với Academy of St Martin in the Fields; Bach
    trong sáng."
  loai: lich-su
- trang: piano/nghe-si
  id: n39
  cau: "András Schiff (sinh 1953): Bach rõ ràng, không dùng bàn đạp vang (theo bài
    viết của chính ông); Beethoven, Schubert, Bartók; nghe trước: Bình quân
    luật, Goldberg."
  loai: lich-su
- trang: piano/nghe-si
  id: n44
  cau: "Lang Lang (sinh 1982): nghệ sĩ Trung Quốc; biểu diễn ở lễ khai mạc Olympic
    Bắc Kinh 2008 và với nhiều dàn nhạc hàng đầu thế giới."
  loai: lich-su
- trang: piano/nghe-si
  id: n46
  cau: "Igor Levit (sinh 1987): trọn 32 sonata Beethoven; nhiều buổi hòa nhạc phát
    trực tuyến từ nhà trên Twitter từ tháng 3/2020; chơi trọn Vexations của
    Satie trong hơn 15 giờ."
  loai: lich-su
- trang: piano/nghe-si
  id: n49
  cau: "Jan Lisiecki (sinh 1995): nghệ sĩ Canada; thu Chopin (concerto, nocturne,
    prelude) và Mozart."
  loai: lich-su
- trang: piano/nghe-si
  id: n52
  cau: "Yunchan Lim (sinh 2004): huy chương vàng Van Cliburn 2022 lúc 18 tuổi,
    người trẻ nhất từng thắng; album Étude Chopin đoạt ba giải của BBC Music
    Magazine năm 2025; nghe trước: Concerto số 3 của Rachmaninoff ở chung kết
    Cliburn 2022."
  loai: lich-su
- trang: piano/nghe-si
  id: n64
  cau: "Các cuộc thi khác: Geneva (Michelangeli thắng năm 1939, Argerich năm
    1957), Busoni ở Bolzano (Argerich 1957), Clara Haskil ở Thụy Sĩ (từ 1963,
    hai năm một lần; nay ở Vevey), Arthur Rubinstein ở Tel Aviv (Trifonov
    2011)."
  loai: lich-su
- trang: piano/nghe-si
  id: n77
  cau: "Câu hỏi kiểm tra nhanh (4 câu): chữ recital lần đầu dùng ở buổi diễn của
    Liszt ở London năm 1840 (không phải Mozart ở Vienna 1781 hay Chopin ở Paris
    1832); Schnabel thu trọn 32 sonata Beethoven (1932–1935, London); so sánh
    hai bản thu nên chỉnh to ngang nhau để hai bản chỉ khác nhau ở cách chơi;
    Bruce Liu (2021) và Eric Lu (2025) là hai học trò của Đặng Thái Sơn thắng
    Chopin."
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n32
  cau: Mức 7 của Sonata Ánh trăng là cho cả bản, gồm cả chương 3 Presto agitato;
    riêng chương 1 thì site xếp ở chặng 5.
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n52
  cau: "Bảng chặng 5: Nocturne Mi thứ Op. 72 số 1 có trong danh sách Grade 8 của
    ABRSM (2027–2028), còn Henle xếp mức 5; Nocturne Đô♯ thứ di cảo là B. 49."
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n61
  cau: "Mariage d'Amour: Sol thứ, chủ yếu 4/4 có vài ô 3/4, mở đầu Moderato ♩ = 72
    (Musicnotes MN0114635); Comptine: Mi thứ, 4/4, ♩ = 100 (Musicnotes
    MN0091413); Nuvole bianche: Fa thứ, mở đầu 4/4 ♩ = khoảng 40, phần chính
    12/8 ♩. = 78 (Musicnotes MN0106486)."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n64
  cau: River Flows in You hay bị nhầm với Bella's Lullaby, đoạn piano Carter
    Burwell viết cho phim Twilight (2008); River Flows in You nằm trong album
    First Love của Yiruma từ 2001.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n65
  cau: Joe Hisaishi (sinh 1950), nhà soạn nhạc Nhật Bản, viết nhạc cho nhiều phim
    của Hayao Miyazaki và Studio Ghibli; One Summer's Day là nhạc phim Spirited
    Away (2001) của Studio Ghibli.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n66
  cau: Itsumo nando demo (Always with Me) trong phim Spirited Away có nhạc của
    Youmi Kimura; ABRSM ghi tên Youmi Kimura (không ghi Hisaishi) khi đưa một
    bản soạn của bài vào danh sách Grade 3 (2025–2026).
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n69
  cau: "Yann Tiersen (sinh 1970), nhạc sĩ người Pháp; Comptine d'un autre été:
    l'après-midi trong nhạc phim Le Fabuleux Destin d'Amélie Poulain (2001)."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n75
  cau: Jane Magrath, The Pianist's Guide to Standard Teaching and Performance
    Literature (Alfred, 1995); Maurice Hinson và Wesley Roberts, Guide to the
    Pianist's Repertoire, ấn bản 4 (Indiana University Press, 2013).
  loai: ten
- trang: piano/tac-pham-theo-cap
  id: r1
  cau: "Bảng chặng 1: tên, tác giả, danh mục, năm, thời kỳ của các hàng: 10 bài
    đầu tiên (Largo của Dvořák: Giao hưởng số 9 Op. 95; Ode to Joy: Giao hưởng
    số 9 Op. 125), Alfred's Basic Adult Piano Course (Palmer, Manus, Lethco),
    Faber Adult Piano Adventures (Nancy và Randall Faber), Bartók Mikrokosmos
    Sz. 107, Diabelli Melodische Übungsstücke Op. 149 bốn tay (thế kỷ 19, phong
    cách Cổ điển), Czerny Op. 599 (thế kỷ 19), Gurlitt Anfangs-Stunden Op. 117
    (Lãng mạn). Türk, Stravinsky, Kurtág: n43–n45."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r2
  cau: "Bảng chặng 2: tên, số trong tập, danh mục, thời kỳ của các bài không có
    bản ghi: Sổ nhạc Anna Magdalena 1725 (Minuet Anh. 116, Polonaise Anh. 119,
    Hành khúc Anh. 122 gán C. P. E. Bach), Notenbuch für Wolfgang (Minuet,
    Bourrée; sổ khuyết danh giữa thế kỷ 18), Mozart K. 1a, K. 3, Schumann Op. 68
    số 2, 8, 10, Tchaikovsky Op. 39 The Sick Doll, Kabalevsky Op. 39 Clowns số
    20, Bartók For Children Sz. 42 (dân ca Hungary và Slovakia), Gretchaninov
    Op. 98 và Glass Beads Op. 123, Shostakovich Children's Notebook Op. 69
    (March, Waltz, Bear), Burgmüller Op. 100 số 3 La pastorale."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r3
  cau: "Bảng chặng 3: Clementi Op. 36 số 2 (Sol trưởng), số 3 (Đô trưởng); Kuhlau
    Op. 20 số 1 và Op. 55 số 1 (Đô trưởng); Diabelli Op. 151, Op. 168 (thế kỷ
    19, phong cách Cổ điển); Burgmüller Op. 100 số 9 La chasse, số 15 Ballade;
    Bach BWV 926 (Rê thứ), BWV 999 (Đô thứ, viết cho đàn luýt); Tchaikovsky Op.
    39 Sweet Dreams, Italian Song, Waltz; Schumann Op. 68 số 16 Erster Verlust;
    Kabalevsky Toccatina Op. 27 số 12; Prokofiev Op. 65 số 1 Morning, số 2
    Promenade; Heller Op. 47; Pärt Für Alina (1976)."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r4
  cau: "Bảng chặng 4: Bach BWV 933–938 (933 Đô trưởng, 935 Rê thứ), Invention số 8
    Fa trưởng BWV 779, Scarlatti K. 32 Rê thứ (Aria), Handel Suite Rê thứ HWV
    437 (Sarabande), Beethoven Op. 49 số 1 Sol thứ (số 2 chương 2 Tempo di
    Menuetto), Clementi Op. 36 số 4–6, Kuhlau Op. 20 số 2, 3, Chopin Prélude Op.
    28 số 6 Si thứ, số 20 Đô thứ (ff rồi p, pp), Mazurka Op. 68 số 2 La thứ, Op.
    67 số 2 Sol thứ, Satie Gnossienne số 1 (cuối thế kỷ 19), Grieg Op. 12 số 2
    Vals, số 4 Alfedans, Schumann Op. 68 số 12 Knecht Ruprecht, Tchaikovsky Op.
    39 The Sorcerer, Lark Song."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r5
  cau: "Bảng chặng 5: Bach Invention số 4 Rê thứ BWV 775 (nhịp 3/8), số 13 La thứ
    BWV 784; Schumann Kinderszenen Op. 15 số 1 Von fremden Ländern und Menschen;
    Haydn Sonata Đô trưởng Hob. XVI:35; Schubert Moments musicaux D. 780 số 3 Fa
    thứ; Brahms Valse Op. 39 số 15 La♭ trưởng; Kabalevsky Sonatina Đô trưởng Op.
    13 số 1; Debussy The Little Shepherd (Children's Corner số 5); Bartók
    Romanian Folk Dances Sz. 56 (sáu điệu múa). Nocturne Op. 72 số 1, B. 49:
    n52."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r6
  cau: "Bảng chặng 6: Mozart K. 330 Đô trưởng, Fantasia K. 397 Rê thứ (khoảng mười
    ô cuối có lẽ do A. E. Müller viết thêm); Bach Sinfonia BWV 787–801, French
    Suite số 5 Sol trưởng BWV 816; Schubert Impromptu D. 899 số 2 Mi♭ trưởng;
    Brahms Op. 118 số 2 La trưởng, Op. 117 số 1 Mi♭ trưởng; Chopin Op. 64 số 1
    Rê♭ trưởng, số 2 Đô♯ thứ, Prélude Op. 28 số 15 Rê♭ trưởng (đoạn giữa Đô♯
    thứ); Grieg Op. 65 số 6; Debussy Arabesque số 1 Mi trưởng, Préludes quyển 1
    số 8; Liszt Consolation số 3 Rê♭ trưởng S. 172; Rachmaninoff Op. 3 số 2 Đô♯
    thứ; Ravel Menuet sur le nom d'Haydn (1909, chủ đề từ chữ cái tên Haydn);
    Gershwin Three Preludes."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: r7
  cau: "Bảng chặng 7: Chopin Ballade số 2–4 (Op. 38, 47, 52), bốn Scherzo (Op. 20,
    31, 39, 54), Études Op. 10, 25, Sonata Op. 35, 58, Barcarolle Op. 60; Bach
    Bình quân luật BWV 846–893, Partita BWV 825–830, Goldberg BWV 988; Beethoven
    Waldstein Op. 53, Appassionata Op. 57, Op. 109, 110, 111 (fugue ở Op. 110);
    Haydn Hob. XVI:52 Mi♭ trưởng; Mozart K. 310 La thứ, Concerto số 21 K. 467;
    Schubert D. 958, 959, 960, Wanderer-Fantasie D. 760; Schumann Op. 9, 16, 17;
    Liszt Sonata S. 178, Études d'exécution transcendante S. 139; Brahms Op.
    118, 119, 24; Debussy Préludes, Estampes, Images; Ravel Sonatine, Le Tombeau
    de Couperin, Jeux d'eau, Gaspard de la nuit; Rachmaninoff Op. 23, 32, 33,
    39, Concerto số 2; Prokofiev Sonata số 7 Op. 83, Toccata Op. 11; Bartók
    Sonata (1926), Out of Doors; Messiaen Vingt regards; Ligeti Musica
    ricercata, Études."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: s1
  cau: "River Flows in You (bản Musicnotes): đoạn mở đầu tự do có dấu ngân, tay
    phải có nhóm móc kép và nốt hoa mỹ nhỏ, tay trái rải hợp âm; tay trái đi lại
    một vòng bốn hợp âm qua nhiều ô."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s2
  cau: "Kiss the Rain (bản Musicnotes): bốn dấu giáng, những đoạn ghi 8va, đầu bài
    tay trái viết ở khóa Sol rồi chuyển sang khóa Fa; giai điệu ở nốt trên của
    hợp âm tay phải; nốt hoa mỹ nhỏ và liên ba."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s3
  cau: "One Summer's Day (bản piano solo Musicnotes): portato (chuỗi nốt lặp có
    chấm dưới dấu luyến); hai lớp trong tay phải; hợp âm có dấu rải ở đoạn mở
    đầu; tay trái giữ hợp âm ngân, có chỗ rải rộng hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s4
  cau: "Mariage d'Amour (bản Musicnotes): tay trái rải hợp âm liên tục; giai điệu
    ở tay phải; có ô đổi sang 3/4."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s5
  cau: "Comptine d'un autre été: l'après-midi (bản Musicnotes): tay trái hai bè
    gần như suốt bài, ngón 5 và 4 đi nốt đen ở dưới, ngón cái lặp móc đơn ở
    trên; tay phải đi từ nhóm móc kép ngắn sang nốt kép; sắc thái p, mf, to dần,
    nhỏ dần."
  loai: cau-truc
- trang: piano/tac-pham-theo-cap
  id: s6
  cau: "Nuvole bianche (bản Musicnotes): allargando ở đoạn mở đầu, poco
    accelerando khi vào phần chính 12/8; hai bè trong tay phải (nốt lặp ở trên,
    nốt ngân ở dưới)."
  loai: cau-truc
