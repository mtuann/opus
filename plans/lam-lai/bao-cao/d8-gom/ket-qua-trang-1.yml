  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên hợp lý. Hướng dẫn của Carnegie Hall và một số dàn nhạc (qua kết quả tìm kiếm, chưa mở từng trang) cũng gợi ý ngồi bên trái khán phòng để thấy tay nghệ sĩ piano; tuỳ cách đặt đàn và nhà hát."
- trang: bat-dau/hoi-dap
  id: n26
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên hợp lý, đúng cách dạy phổ biến: thi cấp không bắt buộc, có lợi khi có mốc thời hạn, nhưng dễ dồn vào ba bài thi."
- trang: bat-dau/hoi-dap
  id: n24
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên hợp lý, khớp cách dạy phổ biến: tập ngón với liều nhỏ, chậm, thả lỏng, đổi tiết tấu; không thay được gam, hợp âm rải, étude. Hợp với khuyến cáo BAPAM tránh lặp căng tay kéo dài."
