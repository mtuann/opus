- trang: piano/chon-dan
  id: n1
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Hợp lẽ thường sư phạm nhưng không có nguồn đã mở khẳng định 'phím quá nhẹ thì ngón không học được điều khiển sắc thái'. BAPAM chỉ nói khi chọn đàn mới nên cân nhắc phím nhẹ hay nặng hơn cho việc tập đều."
- trang: piano/chon-dan
  id: n3
  luot_2: dung
  nguon: ["https://www.musiciansfriend.com/thehub/digital-piano-buying-guide", "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano"]
  ghi_chu: "Musician's Friend: piano điện tập được bằng tai nghe, có phím búa nặng dần; Yamaha: piano cơ cần lên dây. Phần 'mô phỏng, sắc thái nhỏ và bàn đạp kém hơn đàn cơ tốt' là nhận định chung. Nội dung ý khớp."
- trang: piano/chon-dan
  id: n4
  luot_2: dung
  nguon: ["https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano", "https://www.ptg.org/servicing", "https://en.wikipedia.org/wiki/Piano_pedals"]
  ghi_chu: "Yamaha/PTG: cần lên dây định kỳ, nhạy với độ ẩm; đàn cơ có dây và búa thật. 'Tiếng to, khó tập đêm' (nên có bàn đạp tập) hợp lý."
- trang: piano/chon-dan
  id: n5
  luot_2: khong-chac
  nguon: ["https://en.wikipedia.org/wiki/Piano"]
  ghi_chu: "Wikipedia: đàn đại thường cho âm tốt hơn và kiểm soát phím tốt hơn; cơ chế lặp (double escapement) có ở đàn đại; không nói 'đánh lặp nhanh hơn đàn đứng', và 'kiểm soát bàn đạp tốt nhất' là nhận định. Không đủ để ghi đúng cả câu."
- trang: piano/chon-dan
  id: n6
  luot_2: khong-chac
  nguon: ["https://en.wikipedia.org/wiki/Digital_piano"]
  ghi_chu: "Wikipedia Digital piano: đàn lai (hybrid) có bộ máy cơ thật và mẫu âm số chất lượng cao. Không tìm được nguồn về đàn cơ có hệ thống tắt tiếng (silent) và 'giá cao'."
- trang: piano/chon-dan
  id: n9
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Piano"]
  ghi_chu: "Wikipedia Piano: piano hiện đại có 88 phím từ A0 tới C8. Phần 'đàn 61/76 phím buộc bỏ bớt nốt hay dời quãng tám' là hệ quả hiển nhiên."
- trang: piano/chon-dan
  id: n10
  luot_2: khong-chac
  nguon: ["https://www.musiciansfriend.com/thehub/digital-piano-buying-guide", "https://en.wikipedia.org/wiki/Digital_piano"]
  ghi_chu: "Khớp phần định nghĩa phím búa nặng dần (phím trầm nặng hơn phím cao). Không có nguồn cho 'phím nhẹ hay bán nặng không dạy được kỹ thuật điều khiển tốc độ phím' (BAPAM chỉ nói cân nhắc phím nhẹ/nặng theo người tập)."
- trang: piano/chon-dan
  id: n12
  luot_2: khong-chac
  nguon: ["https://www.musiciansfriend.com/thehub/digital-piano-buying-guide", "https://en.wikipedia.org/wiki/Digital_piano"]
  ghi_chu: "Musician's Friend: tối thiểu 32 nốt, 64 là đủ cho âm phức tạp, đàn cao cấp tới 128, 256; Wikipedia: đàn thập niên 1990 hay giới hạn 32–64. Con số '128 trở lên' không có nguồn chung xác nhận là ngưỡng khuyến nghị; hiện tượng nốt cũ bị cắt khi đa bàn đạp thì hợp lý."
- trang: piano/chon-dan
  id: n13
  luot_2: khong-chac
  nguon: ["https://en.wikipedia.org/wiki/Piano_pedals"]
  ghi_chu: "Wikipedia Piano pedals: bàn đạp vang cho phép nửa bàn đạp ở một số đàn điện; nhiều đàn điện chỉ có công tắc bật tắt; có thể cắm ba bàn đạp như đàn đại. 'Tốt nhất là bộ ba gắn chân đàn' và 'bàn đạp rời trượt trên sàn' là nhận định chưa có nguồn."
- trang: piano/chon-dan
  id: n16
  luot_2: khong-chac
  nguon: ["https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf"]
  ghi_chu: "BAPAM: ghế cao sao cho tay rũ lỏng không căng khuỷu, vai, cổ tay; chân đặt vững. 'Ghế chữ X thường lung lay' không có nguồn."
- trang: piano/chon-dan
  id: n21
  luot_2: khong-chac
  nguon: ["https://www.ptg.org/servicing"]
  ghi_chu: "PTG khuyên nhờ chuyên viên khi mua đàn cũ, nhưng không có danh sách kiểm tra (trục lên dây, bảng cộng hưởng, búa, bộ máy, mối mọt). Chuẩn La4 = 440 Hz là đúng chung. Các mục kiểm đều hợp lý nhưng chưa có nguồn đã mở."
- trang: piano/chon-dan
  id: n22
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Việc tra năm sản xuất từ số seri bằng sách tra cứu (như Pierce Piano Atlas) là thông tin chung đúng, nhưng chưa mở được nguồn nào xác nhận 'thợ thường tra được, hãng lớn'."
- trang: piano/chon-dan
  id: n24
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Piano_pedals"]
  ghi_chu: "Wikipedia Piano pedals: ở đàn đại bàn đạp giữa thường là sostenuto (chỉ giữ ngân nốt đang nhấn khi đạp); ở đàn đứng thường là bàn đạp tập hạ dải nỉ giữa búa và dây để giảm tiếng (không phải đàn nào cũng có)."
- trang: piano/chon-dan
  id: n26
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Các gợi ý thuê đàn, mua piano điện cũ có 88 phím búa nặng dần, tập thêm ở trung tâm hợp lý, nhưng khẳng định 'thói quen dùng lực hình thành trên phím nhẹ khiến chuyển sang đàn cơ khó hơn' không có nguồn đã mở."
- trang: piano/chon-dan
  id: n28
  luot_2: dung
  nguon: ["https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf"]
  ghi_chu: "BAPAM (The Healthy Pianist): tập từng đợt 20 phút xen nghỉ 10 phút để tay hồi phục. Khớp."
- trang: piano/chon-dan
  id: n29
  luot_2: khong-chac
  nguon: ["https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano", "https://www.ptg.org/servicing"]
  ghi_chu: "Yamaha: lên dây ít nhất 1 lần một năm; đàn mới hay đàn chơi nhiều thì 2 lần hay hơn (khớp). Yamaha không nói gì về 'vài tuần ổn định sau chuyển nhà rồi mới lên dây' hay 'đàn bỏ lâu phải kéo dây nhiều lần' (PTG chỉ nói đàn đổi chỗ sẽ cần lên dây sớm hơn); câu quy cho Yamaha cả phần ấy nên chưa ghi đúng."
- trang: piano/chon-dan
  id: n30
  luot_2: dung
  nguon: ["https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano", "https://www.ptg.org/servicing"]
  ghi_chu: "Yamaha: độ ẩm 35–55%, tối ưu 45%; nên dùng ẩm kế, máy hút ẩm; tránh để đàn gần cửa gió, lò sưởi. PTG: tránh cửa sổ, nắng trực tiếp, cửa thông gió. Các nhận xét riêng về Việt Nam (ẩm cao, máy lạnh làm khô) là lời khuyên hợp lý."
- trang: piano/chon-dan
  id: n31
  luot_2: dung
  nguon: ["https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano"]
  ghi_chu: "Yamaha: lau phím bằng khăn mềm thấm nước pha ít nước rửa chén, lau lại bằng khăn hơi ẩm; tránh chất tẩy có cồn vì làm đổi màu hay nứt; đóng nắp phím khi không dùng. Khớp."
- trang: piano/chon-dan
  id: n34
  luot_2: khong-chac
  nguon: ["https://www.musiciansfriend.com/thehub/digital-piano-buying-guide", "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano"]
  ghi_chu: "Bốn ý trong câu hỏi: 88 phím búa nặng dần quan trọng nhất (nhận định); polyphony 128+ (như n12, không có nguồn chung); thợ độc lập khi mua đàn cũ (PTG khuyên nhờ chuyên viên); ẩm kế và hút ẩm (Yamaha). Không ghi đúng cả vì có ý chưa xác nhận."
- trang: piano/chon-dan
  id: n11
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên hợp lý: nghe tiếng trầm, độ tắt dần, nốt nhỏ khi thử đàn."
- trang: piano/chon-dan
  id: n14
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên hợp lý; Musician's Friend: nhiều mẫu có hai cổng tai nghe để thầy trò cùng nghe."
