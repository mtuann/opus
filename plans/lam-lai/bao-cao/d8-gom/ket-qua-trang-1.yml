- trang: bat-dau/hoi-dap
  id: n2
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Chỉ tìm được vài nghiên cứu nhỏ, cũ (một luận án 1996 ở London thấy người trưởng thành đầu 20 tuổi không thua trẻ em về độ trôi chảy trên phím). Chưa có nguồn bậc 2 nào xác nhận ý 'người lớn có lợi thế tự sắp xếp việc học, trẻ em có lợi thế phối hợp động tác'. Phần 'người lớn vẫn học được' hợp lý nhưng không đủ để ghi đúng cả câu. Truy cập 05/11/2026."
- trang: bat-dau/hoi-dap
  id: n5
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không có nguồn nào ấn định '20–45 phút mỗi ngày trong năm đầu rồi tăng lên 60–90 phút'. Chỉ khớp phần 'xen giờ nghỉ' (BAPAM: tập từng đợt 20 phút, nghỉ 10 phút; tăng thời gian tập từ từ). Con số cụ thể là lời khuyên của site, không kiểm bằng nguồn."
- trang: bat-dau/hoi-dap
  id: n7
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Mariage_d%27amour"]
  ghi_chu: "Wikipedia (chỉ để định hướng): Mariage d'amour là tác phẩm piano của Paul de Senneville, sáng tác 1978; Richard Clayderman thu bản đầu năm 1979 (album Lettre à Ma Mère); bản George Davidson bị gán nhầm là 'Spring Waltz' của Chopin vì một video YouTube đặt sai tên. Khớp câu viết."
- trang: bat-dau/hoi-dap
  id: n9
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Mariage_d%27amour", "https://luatvietnam.vn/tin-phap-luat/thoi-han-bao-ho-quyen-so-huu-tri-tue-230-30744-article.html"]
  ghi_chu: "Sáng tác 1978 (Wikipedia) nên còn trong thời hạn bảo hộ: ở Việt Nam quyền tài sản kéo dài suốt đời tác giả cộng 50 năm (luatvietnam.vn, dẫn Điều 27 Luật Sở hữu trí tuệ); theo Berne và luật các nước khác thời hạn cũng chưa hết. Lời khuyên 'dùng bản nhạc được cấp phép' hợp lý."
- trang: bat-dau/hoi-dap
  id: n10
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/River_Flows_in_You", "https://luatvietnam.vn/tin-phap-luat/thoi-han-bao-ho-quyen-so-huu-tri-tue-230-30744-article.html"]
  ghi_chu: "River Flows in You của Yiruma nằm trong album First Love (2001), tức tác phẩm hiện đại còn bản quyền (Điều 27: suốt đời tác giả + 50 năm ở VN). Chưa mở được trang Musicnotes (403) nên không xác nhận được riêng nó là nơi bán bản được cấp phép; chưa kiểm năm của Kiss the Rain (tác phẩm của Yiruma, cũng hiện đại). Ý chính của câu (nhạc phim, nhạc đại chúng còn bản quyền, dùng bản có phép) đúng."
- trang: bat-dau/hoi-dap
  id: n17
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/", "https://imslp.org/wiki/IMSLP%3ACopyright_Made_Simple"]
  ghi_chu: "Mutopia: bản nhạc tải miễn phí, thuộc phạm vi công cộng hoặc giấy phép Creative Commons (trang chủ, đọc 05/11/2026). IMSLP chỉ tải các bản nhạc công cộng ở Canada/Mỹ/EU theo nhãn riêng (trang IMSLP Copyright Made Simple)."
- trang: bat-dau/hoi-dap
  id: n18
  luot_2: dung
  nguon: ["https://imslp.org/wiki/IMSLP%3ACopyright_Made_Simple"]
  ghi_chu: "IMSLP Copyright Made Simple: IMSLP gắn nhãn cho Canada, Hoa Kỳ và Liên minh châu Âu (kèm Đài Loan, Trung Quốc, Nam Phi, New Zealand, và nhóm EU gồm Hàn Quốc, Nhật). Trang chỉ nêu 'quy tắc đơn giản, có ngoại lệ', không nói rõ nước mình, nhưng 'ở nước khác (Việt Nam) cần đối chiếu luật nước mình' là suy luận hợp lý từ việc nhãn chỉ ba vùng."
- trang: bat-dau/hoi-dap
  id: n19
  luot_2: dung
  nguon: ["https://imslp.org/wiki/IMSLP%3ACopyright_Made_Simple"]
  ghi_chu: "IMSLP: ấn bản có đóng góp mới có thể được bảo hộ (EU tới 30 năm, IMSLP áp dụng 25 năm; Mỹ: phần chú giải, lời tựa); người sống hay mới mất nói chung còn bảo hộ (Canada: mất trước 1972; EU: trước 1956). Lưu ý Canada từ 2023 đã kéo dài lên 70 năm cho người mất từ 1972."
- trang: bat-dau/hoi-dap
  id: n20
  luot_2: dung
  nguon: ["https://luatvietnam.vn/tin-phap-luat/thoi-han-bao-ho-quyen-so-huu-tri-tue-230-30744-article.html"]
  ghi_chu: "luatvietnam.vn (bài 2021, dẫn Điều 27 Luật SHTT): quyền công bố và quyền tài sản thường suốt đời tác giả + 50 năm; quyền nhân thân không thời hạn. Phần 'hết thời hạn thì thuộc về công chúng' là hệ quả pháp lý chuẩn nhưng trang này không viết nguyên văn; chưa mở được văn bản luật gốc (thuvienphapluat.vn, wipolex trả 403) nên đối chiếu thêm với bản sửa đổi 2022 khi cần."
- trang: bat-dau/hoi-dap
  id: n22
  luot_2: dung
  nguon: ["https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf"]
  ghi_chu: "BAPAM (The Healthy Pianist, 2016): người tay nhỏ cần cẩn thận không căng quá sức, chọn tác phẩm hợp cỡ tay; tránh căng ngón quá mức, đổi ngón, có thể bỏ bớt nốt nếu tay không với tới. Khớp câu viết."
- trang: bat-dau/hoi-dap
  id: n33
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Solf%C3%A8ge"]
  ghi_chu: "Wikipedia Solfège (chỉ để định hướng): đô cố định (mỗi âm tiết luôn là một cao độ) dùng ở Pháp, Ý, Tây Ban Nha, Nga, Bồ Đào Nha, Romania...; khớp câu. Chưa đối chiếu Open Music Theory (chương này không mở được trong lượt này)."
- trang: bat-dau/hoi-dap
  id: n34
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Solf%C3%A8ge"]
  ghi_chu: "Wikipedia Solfège: đô di động (âm tiết theo bậc của gam) dùng ở các nước Khối thịnh vượng chung, Mỹ, nước Đức, và Hungary chủ yếu qua phương pháp Kodály. Ví dụ Sol trưởng hát chủ âm là 'Đô' đúng định nghĩa. Ý 'rất mạnh cho luyện tai' là nhận xét của site."
- trang: bat-dau/hoi-dap
