# Lượt 2 làm lại (D8, bổ sung 2b), 05/11/2026. Mỗi vế đối chiếu với chữ thật của trang đã mở.
- trang: bat-dau/hoi-dap
  id: n2
  luot_2: khong-chac
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/20508918/", "https://pubmed.ncbi.nlm.nih.gov/23325263/"]
  ghi_chu: "Phần đúng: Bailey & Penhune 2010 (Exp Brain Res) và Steele và cs. 2013 (J Neurosci) so người học trước và sau 7 tuổi, cùng số năm tập: người học sớm đồng bộ cảm giác–vận động tốt hơn (giai đoạn nhạy cảm thời nhỏ); nhóm học muộn vẫn là nhạc công. Phần chưa có nguồn bậc 2: người lớn 'có lợi thế ở cách tự sắp xếp việc học'. Không có công cụ tìm kiếm (hết lượt), chưa tìm được nguồn cho vế này."
- trang: bat-dau/hoi-dap
  id: n5
  luot_2: dung
  nguon: ["https://www.bapam.org.uk/return-to-play/"]
  ghi_chu: "BAPAM: 'a common trigger for injury in musicians is a sudden increase in playing load', tăng dần thời lượng và tần suất; 'Take a 3-5 minute break from playing every 20-25 minutes'."
- trang: bat-dau/hoi-dap
  id: n34
  luot_2: dung
  nguon: ["https://openmusictheory.github.io/scales.html", "https://www.oake.org/the-kodaly-concept/"]
  ghi_chu: "Open Music Theory (bản 1): dùng âm tiết solfège cho bậc của gam thì gọi là movable-do solfège (bậc 1 = do của giọng). OAKE: 'The moveable do system, highly developed in English choral training, was advocated by Kodály as a tool for teaching musical literacy'; solfège dùng cho sight singing, dictation, ear training. OMT bản 2 (viva.pressbooks.pub) trả 403, Wayback trả 429."
- trang: bat-dau/hoi-dap
  id: n49
  luot_2: khong-chac
  nguon: ["https://openmusictheory.github.io/pitches.html"]
  ghi_chu: "Phần đúng: OMT dùng tên chữ cái (pitch-class letter names) cho nốt. Chưa mở được nguồn bậc 2 nói cách gọi Đô, Rê, Mi ở Việt Nam (Wikipedia tiếng Việt 'Nốt nhạc' có ghi Đô (C), Rê (D)… nhưng không dẫn nguồn), chưa mở trang nói về ký hiệu hợp âm C, Am, G7. Hết lượt tìm kiếm."
- trang: bat-dau/ung-dung
  id: n2
  luot_2: dung
  nguon: ["https://support.apple.com/guide/iphone/bookmark-a-website-iph42ab2f3a7/ios"]
  ghi_chu: "Apple (Hướng dẫn sử dụng iPhone): 'Tap [the Page Menu button], then tap Share. If your Tabs layout is Bottom or Top, tap [the Share button]. Scroll down the list of options, then tap Add to Home Screen.' Tên nút lấy từ alt của hình trong trang. Chưa mở bản hướng dẫn iPad."
- trang: lich-su/viet-nam
  id: n5
  luot_2: dung
  nguon: ["https://hcmcons.vn/"]
  ghi_chu: "Trang Nhạc viện: tiền thân là trường Quốc gia Âm nhạc Sài Gòn ra đời năm 1956, hai ngành Quốc nhạc và nhạc Tây Phương; địa chỉ 112 Nguyễn Du, Q.1; các khoa có Âm nhạc truyền thống, Nhạc cụ phương Tây, Piano."
- trang: lich-su/viet-nam
  id: n27
  luot_2: dung
  nguon: ["https://hcmcons.vn/"]
  ghi_chu: "Trường Quốc gia Âm nhạc Sài Gòn ra đời 1956, đổi tên 1960, 1975, từ 1981 là Nhạc viện TP.HCM. 'Đào tạo bài bản lứa nghệ sĩ mới' là nhận xét chung, hợp với việc trường đào tạo gần 20 chuyên ngành."
- trang: lich-su/viet-nam
  id: n35
  luot_2: dung
  nguon: ["https://web.archive.org/web/20150610202737/http://hoinhacsi.org/hns_version2/memberdetail.php?hvid=86"]
  ghi_chu: "Trang hội viên của Hội Nhạc sĩ Việt Nam (bản lưu): 'đã viết các tác phẩm khí nhạc, nhạc phim, nhạc sân khấu... Có thể kể tới: Rhapsodie Việt Nam, ballet Hồng hoang [trang ghi 'Hồng hoa ng'] … Trổ Một cho Dàn nhạc Giao hưởng (2007)'. Nguồn ghi 'ballet' và 'cho Dàn nhạc Giao hưởng', không ghi 'tổ khúc' hay 'giao hưởng'; cách gọi trong câu chấp nhận được."
- trang: lich-su/viet-nam
  id: n36
  luot_2: khong-chac
  nguon: ["https://vienamnhac.vn/articles/modern-music/the-musican-introduces-his-compositions", "https://vietnamnews.vn/life-style/520412/vietnamese-folk-music-finds-its-way-to-beijing-modern-music-festival.html", "https://tuoitre.vn/bao-gio-kim-tuoc-lai-goi-ten-nhac-phim-viet-nam-20231019100600012.htm"]
  ghi_chu: "Phần đúng: năm 1973 ông 20 tuổi (sinh 1953), học cả piano và sáng tác ở trường Âm nhạc Việt Nam (vienamnhac.vn, lời ông); học tiếp ở Nhạc viện Quốc gia Paris, 'also taught piano and composition', tác phẩm piano độc tấu của ông được Đặng Thái Sơn chơi (Việt Nam News); Tuổi Trẻ: nhạc phim Thời xa vắng nhận Kim tước cho âm nhạc hay nhất ở LHP quốc tế Thượng Hải 2005; Đặng Thái Sơn diễn Sonate polyphonique hai lần (1980 Moskva, 1986 Hà Nội). Chưa xác nhận: Đặng Thái Sơn biểu diễn Suite (nguồn chỉ nói Suite đề tặng Sơn); 'giảng viên sáng tác ở Học viện' (Việt Nam News viết mơ hồ 'taught … there', Wikipedia tiếng Việt ghi dạy 2000–2013, không dẫn nguồn). Gợi ý: '… Đặng Thái Sơn đã biểu diễn Sonate polyphonique; Suite cho piano được đề tặng ông.'"
- trang: lich-su/viet-nam
  id: n38
  luot_2: khong-chac
  nguon: ["https://vietnamnews.vn/sunday/features/569873/emerging-musician-goes-her-own-way.html", "https://daidoanket.vn/nha-soan-nhac-luong-hue-trinh-nhac-moi-tiep-can-nguoi-nghe-theo-cach-tu-nhien-nhat-10143255.html", "https://young-euro-classic.de/en/konzerte-detailseite/l-ch-t-ch-59"]
  ghi_chu: "Phần đúng: sinh 1985, học ở Học viện Âm nhạc Quốc gia (khoa Jazz Keyboard), thạc sĩ sáng tác đa phương tiện ở Hamburg 2015–2018, nhạc điện-âm (Việt Nam News); 'Thư Hà Nội' (Lettres de Hanoi) hòa nhạc đa phương tiện soạn cùng Jean-David Caillouët (Đại Đoàn Kết); Young Euro Classic ghi electroacoustics. Chưa tìm được nguồn cho 'tốt nghiệp loại ưu' (trang cá nhân luonghuetrinh.com đã bị chiếm, không dùng)."
- trang: piano/chon-dan
  id: n5
  luot_2: sai
  cau_dung: "Piano cơ đại: dây nằm ngang, búa rơi về nhờ trọng lượng; đánh lặp một nốt nhanh hơn đàn đứng (theo Yamaha: tới khoảng 14 lần mỗi giây, đàn đứng khoảng 7); rất đắt, cần phòng rộng."
  nguon: ["https://www.yamaha.com/en/musical_instrument_guide/piano/selection/", "https://kawaius.com/faq/what-is-the-difference-between-a-grand-piano-and-an-upright-piano"]
  ghi_chu: "Yamaha: 'Because the hammers return to their rest position under their own weight … key repetition as fast as about 14 times per second is possible'; đàn đứng 'about seven times per second'. Câu ghi 15. Bản Yamaha Thái Lan cùng chữ (14). Kawai: đàn đứng gọn hơn; Yamaha: đàn đứng dựng dây đứng 'to be played in a limited space'. 'Rất đắt' không kiểm ở trang hãng."
- trang: piano/chon-dan
  id: n6
  luot_2: dung
  nguon: ["https://kawaius.com/faq/what-is-a-hybrid-piano", "https://usa.yamaha.com/products/musical_instruments/pianos/silent_piano/index.html", "https://kawaius.com/faq/do-kawai-pianos-require-tuning-and-maintenance", "https://kawaius.com/faq/where-should-i-place-my-piano-in-my-home"]
  ghi_chu: "Kawai: hybrid 'combines a real acoustic piano action with digital electronics', hợp nơi cần giới hạn âm lượng. Yamaha: 'Simply switch your Yamaha acoustic piano into SILENT mode' và nghe qua tai nghe, tức vẫn là đàn cơ. Kawai: đàn cơ cần lên dây đều; đàn nhạy với độ ẩm. Không tìm được trang hãng nói thẳng 'đàn silent cần lên dây', suy ra từ việc nó là đàn cơ."
- trang: piano/chon-dan
  id: n12
  luot_2: dung
  nguon: ["https://kawaius.com/faq/what-is-polyphony"]
  ghi_chu: "Kawai: polyphony là 'maximum number of individual notes your piano can produce simultaneously'; quan trọng 'when the damper pedal is held and notes are accumulating — as a piano with low polyphony may drop older notes to accommodate new ones'; 'Check your piano's owner's manual for its specific polyphony rating'."
- trang: piano/chon-dan
  id: n13
  luot_2: dung
  nguon: ["https://kawaius.com/faq/which-damper-pedals-are-compatible-with-my-kawai-digital-piano", "https://www.pianobuyer.com/post/what-can-i-buy-for-1995"]
  ghi_chu: "Kawai: bàn đạp chính hãng cho 'continuous control (half-pedalling)'; bàn đạp chung loại 'may work for basic on/off damper control, but may not support … continuous pedalling'. Piano Buyer: các đàn console đều có ba bàn đạp, half-pedaling ở bàn đạp vang. Vế 'site khuyên' là lời khuyên của site."
- trang: piano/chon-dan
  id: n16
  luot_2: dung
  nguon: ["https://www.pianobuyer.com/post/what-can-i-buy-for-1995"]
  ghi_chu: "Piano Buyer: chân đàn chữ X đôi vững nhất, tránh chữ X đơn vì 'tend to wiggle during playing'. Ghế chỉnh được độ cao là lời khuyên phổ biến, không có trang hãng nói thẳng; câu không có điều có hại."
- trang: piano/chon-dan
  id: n21
  luot_2: dung
  nguon: ["https://www.pianobuyer.com/post/how-to-locate-the-serial-number-of-a-piano-and-checklist-for-inspecting-a-used-piano-before-buying", "https://www.prnewswire.com/news-releases/piano-technicians-guild-offers-tips-for-avoiding-the-expense-of-the-free-piano-227073101.html", "https://kawaius.com/faq/what-is-pitch-raising", "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano"]
  ghi_chu: "Piano Buyer (trích The Piano Book): trục lên dây và thớt (vết keo làm chặt trục, thớt nứt), 'Is the piano up to standard pitch?', bảng cộng hưởng và sườn ('Soundboard and ribs', nứt, sườn bong), búa ('depth of grooves'), bộ giảm âm tắt gọn, phím kẹt, dây gỉ, bàn đạp, 'hammers, dampers, and other felt parts for moth damage'. PTG (thông cáo 2013): thớt hỏng thì trục trượt, đàn không giữ dây; rãnh sâu trên búa. Kawai: đàn lâu không lên dây tụt dưới A440, cần pitch raise. Yamaha: để quá lâu thì khó đưa về trạng thái tốt."
- trang: piano/chon-dan
  id: n22
  luot_2: dung
  nguon: ["https://www.pianobuyer.com/post/how-to-locate-the-serial-number-of-a-piano-and-checklist-for-inspecting-a-used-piano-before-buying"]
  ghi_chu: "Piano Buyer: 'Find the serial number of the piano so you can look up its year of manufacture in the Pierce Piano Atlas … When no serial number can be found or if the year of manufacture isn't listed in Pierce, sometimes a technician can estimate.'"
- trang: piano/chon-dan
  id: n27
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Câu gần như toàn lời khuyên bố trí góc tập (hợp lý, không có hại). Vế cần nguồn ngoài, 'thảm dưới đàn giảm tiếng truyền qua sàn', chỉ thấy ở diễn đàn và trang bán hàng (thảm có đệm giảm rung truyền xuống sàn, hiệu quả hạn chế), không có nguồn bậc 2. Gợi ý: đổi nhãn sang khuyen-tap, hay viết 'thảm dày có thể giảm phần nào tiếng truyền qua sàn'."
- trang: piano/chon-dan
  id: n29
  luot_2: dung
  nguon: ["https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano", "https://www.yamaha.com/en/musical_instrument_guide/piano/maintenance/maintenance002.html"]
  ghi_chu: "Yamaha hub: 'you should have your piano tuned at least once a year, though instruments that are played often or are brand new should be tuned twice a year or more'; 'if you let it go for too long, it can be hard to bring it back to perfect condition … more time spent by the technician and more cost for you'."
- trang: piano/chon-dan
  id: n34
  luot_2: dung
  nguon: ["https://kawaius.com/faq/is-a-kawai-piano-good-for-beginners", "https://kawaius.com/faq/what-is-polyphony", "https://www.prnewswire.com/news-releases/piano-technicians-guild-offers-tips-for-avoiding-the-expense-of-the-free-piano-227073101.html", "https://hub.yamaha.com/pianos/p-how-to/five-simple-steps-for-maintaining-your-piano"]
  ghi_chu: "Kawai: người mới nên chọn 'full 88-key piano with weighted keys'; polyphony như n12. PTG: nhờ thợ (RPT) kiểm trước khi mua đàn cũ. Yamaha: đo độ ẩm bằng nhiệt ẩm kế, dùng máy hút ẩm hay tạo ẩm khi cần. 'Quan trọng nhất' là cách site xếp hạng, hợp với Kawai."
- trang: piano/thay-va-thi
  id: n25
  luot_2: dung
  nguon: ["https://web.archive.org/web/20250908072910/https://www.abrsm.org/en-gb/other-assessments/diplomas/music-performance"]
  ghi_chu: "ABRSM (bản lưu 09/2025; abrsm.org trả lỗi chuyển hướng): ARSM 'A digital exam assessed from a video recording – available worldwide; A face-to-face exam – if these are available in your country'; LRSM, FRSM 'from 2024' là 'digitally-assessed', quay video buổi biểu diễn kèm 'a piece of supporting evidence'; 'To enter for a Performance ARSM, LRSM or FRSM you must have passed ABRSM Grade 8 (Performance or Practical Grade)' hay bằng tương đương của danh sách hội đồng được chấp nhận; 'You can also apply to offer Appropriate Professional Experience (APE) or Recognised Prior Learning (RPL) as a substitute for entry requirements'. Lưu ý: trang đặt câu APE/RPL sau điều kiện chung của cả ba bằng, không riêng LRSM, FRSM; câu của site hẹp hơn nguồn nhưng không sai."
- trang: piano/thay-va-thi
  id: n31
  luot_2: dung
  nguon: ["https://www.vnam.edu.vn/", "https://hcmcons.vn/", "https://hocvienamnhachue.edu.vn/"]
  ghi_chu: "Học viện Âm nhạc Quốc gia Việt Nam có 'Khoa Piano'; Nhạc viện TP.HCM có khoa Piano; Học viện Âm nhạc Huế có trang chính thức (thấy khoa Âm nhạc Phương Tây, không thấy khoa Piano riêng), hợp với 'hai trường đầu có khoa Piano'."
- trang: piano/thay-va-thi
  id: n35
  luot_2: dung
  nguon: ["https://online.berklee.edu/help/en_US/zoom/1793280-how-to-configure-zoom-audio-settings-for-music-performance"]
  ghi_chu: "Berklee Online: Settings > Audio > chọn 'Original sound for musicians'; tắt 'Automatically adjust microphone volume'; High-fidelity music mode chỉ khi dùng mạng dây ('not recommended for wireless connections'); nên dùng tai nghe, nếu dùng loa thì 'make sure the box next to Echo cancellation is checked'. Trang hỗ trợ Zoom (support.zoom.com) dựng bằng JavaScript, công cụ không đọc được chữ."
- trang: tai-nguyen
  id: n18
  luot_2: dung
  nguon: ["https://leonardbernstein.com/lectures/television-scripts/young-peoples-concerts", "https://leonardbernstein.com/lectures/television-scripts/young-peoples-concerts/what-does-music-mean", "https://leonardbernstein.com/lectures/television-scripts/young-peoples-concerts/holst-the-planets", "https://leonardbernstein.com/about/timeline"]
  ghi_chu: "Trang Leonard Bernstein: 'Young People's Concerts with the New York Philharmonic', kịch bản từng buổi; buổi đầu 'What Does Music Mean?' phát trên CBS 18/1/1958, buổi 'Holst: The Planets' phát 26/3/1972 (buổi cuối trong danh mục). Timeline: 53 buổi, phát trên CBS."
- trang: tai-nguyen
  id: n21
  luot_2: dung
  nguon: ["https://podcasts.apple.com/us/podcast/record-review-podcast/id273489899", "https://podcasts.files.bbci.co.uk/p02nrtty.rss"]
  ghi_chu: "Apple Podcasts và RSS của BBC, podcast 'Record Review Podcast' của BBC Radio 3: 'Building a Library … Each week an expert and enthusiast brings along a wide range of recordings of a well-known piece … ending with a recommendation for your library'. bbc.co.uk chặn công cụ đọc web."
- trang: tai-nguyen
  id: n24
  luot_2: dung
  nguon: ["https://www.apple.com/newsroom/2023/03/apple-music-classical-is-here/", "https://www.idagio.com/"]
  ghi_chu: "Apple Newsroom: Apple Music Classical tìm 'from composer and work, to opus number, conductor, artist, or instrument'. IDAGIO: 'The work, its movements, the composer, conductor, orchestra, soloists and interpretation all belong together. IDAGIO was designed to preserve those connections.'"
- trang: tai-nguyen
  id: n31
  luot_2: dung
  nguon: ["https://www.youtube.com/@InsidetheScore", "https://www.youtube.com/@DavidBennettPiano", "https://www.youtube.com/@nahresol", "https://www.benlaude.com/"]
  ghi_chu: "Mô tả kênh: Inside the Score 'Deepen your appreciation of Classical and Film Music … Video Essays'; David Bennett Music Theory 'educational videos about music theory'; Nahre Sol 'In pursuit of musical creativity, inspired by the past and present'; Ben Laude 'concert pianist, music educator, video creator', làm video piano."
- trang: nhac-cu/index
  id: n25
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Chưa mở được nguồn bậc 2 cho 'quãng năm kèn horn' (Open Music Theory bản 2 trả 403, Wayback trả 429; Wikipedia 'Horn fifths' chuyển sang bài khác, không có nguồn dùng được). Hết lượt tìm kiếm."
- trang: nhac-cu/index
  id: n26
  luot_2: khong-chac
  nguon: ["https://imslp.org/wiki/Piano_Sonata_No.26,_Op.81a_(Beethoven,_Ludwig_van)"]
  ghi_chu: "IMSLP chỉ xác nhận chương 1 là 'Das Lebewohl'. Chưa mở được nguồn nói ba hợp âm đầu dựa trên hình nét kèn horn và chuỗi quãng 3 trưởng, 5 đúng, 6 thứ (chưa đối chiếu bản nhạc; lưu ý: ở Beethoven hợp âm thứ ba có bè trầm xuống Đô, nên cần kiểm quãng thật hay ghi rõ là khuôn mẫu kèn horn)."
- trang: nhac-cu/index
  id: n27
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Chưa mở được nguồn bậc 2 (Kirkpatrick, Grove, ghi chú đĩa) về hợp âm rải bắt chước tiếng gảy guitar trong sonata của Scarlatti. Hết lượt tìm kiếm."
