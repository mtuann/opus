- trang: piano/nghe-si
  id: n5
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Bài classical-music.com chỉ nói tranh biếm họa cho thấy ông chơi không nhạc; hai bài về chuyện chơi thuộc lòng (classical-music.com/features/science-of-music/history-of-memorising-music, interlude.hk) nói ông chỉ chơi thuộc một phần kho bài và luôn dùng bản nhạc cho tác phẩm của chính mình. Mệnh đề chơi một mình, không cần bản nhạc nói quá; nên viết lại cho chính xác hơn (hay bỏ)."

- trang: piano/nghe-si
  id: n6
  luot_2: dung
  nguon: ["https://interlude.hk/the-secret-history-of-memorisation-in-classical-music-from-taboo-to-tradition/"]
  ghi_chu: "Clara Schumann được cha dạy thuộc lòng từ nhỏ, 1837 bị Bettina von Arnim chê vì chơi không nhạc; học trò của Liszt và Clara đưa tục lệ đi tiếp trong thế kỷ 19. Chữ mot trong những nghệ sĩ đầu tiên là hợp lý, không nói đầu tiên tuyệt đối."

- trang: piano/nghe-si
  id: n7
  luot_2: dung
  nguon: ["https://www.classical-music.com/features/instruments/first-piano-recording", "https://en.wikipedia.org/wiki/Josef_Hofmann"]
  ghi_chu: "Hofmann 12 tuổi, 1888, ghi trụ sáp cho Edison, nay thất lạc; Wikipedia: có lẽ là nghệ sĩ piano có tiếng đầu tiên thu trên máy Edison. Nguồn chính là bài classical-music.com, Wikipedia chỉ phụ."

