- trang: piano/tac-pham-theo-cap
  id: n32
  cau: Mức 7 của Sonata Ánh trăng là cho cả bản, gồm cả chương 3 Presto agitato; riêng chương 1 thì site xếp ở chặng 5.
  loai: cap-do
  nguon:
    - ten: "Henle HN 32, Beethoven, Piano Sonatas Volume I: Moonlight Sonata op. 27,2 mức 7 (truy cập 05/11/2026)"
      link: https://www.henle.de/Piano-Sonatas-Volume-I/HN-32
    - ten: 'IMSLP, Piano Sonata No.14, Op.27 No.2 (Beethoven): 3 movements; bản thu ghi "3. Presto agitato" (truy cập 05/11/2026)'
      link: https://imslp.org/wiki/Piano_Sonata_No.14,_Op.27_No.2_(Beethoven,_Ludwig_van)
  ket_qua_luot_1: da-sua
  ghi_chu: 'Henle HN 32: "Moonlight Sonata … op. 27,2 | 7 difficult" cho cả sonata. Chương 3 là Presto agitato (tên chương là điều quen thuộc; Henle chỉ ghi cả bản). "Rất khó" là nhận xét theo mức 7 "difficult" của Henle. Chặng 5 của chương 1: dữ liệu beethoven-anh-trang (chang 5, Grade 6–7). Review D8-gom (Claude Opus 5.5): bỏ "rất khó" (nhận xét không nguồn; Henle chỉ ghi mức cho cả bản). Tên chương Presto agitato: IMSLP. Chặng 5 của chương 1 là dữ liệu (beethoven-anh-trang). Kết quả lượt 2 cũ (gỡ để vào lượt 2 bổ sung vì chữ đổi): khong-chac: Henle mức 7 cho cả sonata đã kiểm; việc xếp riêng chương 1 ở chặng 5 là lựa chọn của site, không có nguồn ngoài để kiểm; chương 3 Presto agitato rất khó là kiến thức chung..'
