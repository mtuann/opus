  ghi_chu: "ECM: sinh 1953 ở Budapest; có Das Wohltemperierte Clavier, Goldberg Variations, Beethoven (trọn sonata), Schubert. classical-music.com: nổi tiếng với Bach, Beethoven, Mozart, Schubert; có thu Bartók. Bài 'Senza pedale ma con tanti colori' (Schiff viết, Firenze 5/2012, đăng ở Vancouver Recital Society): ông chơi Bach không dùng bàn đạp vang ('abstinence', George Malcolm 'taught me to play Bach without pedal'), dù viết rằng dùng kín đáo không bị cấm. 'Rõ ràng' là nhận xét phong cách, không kiểm."
