  ghi_chu: "Đã đọc chữ thật hai bài của classical-music.com (BBC Music Magazine). Bài 1: các buổi diễn một mình của Liszt trước gọi là 'musical soliloquies'; tranh biếm họa vẽ ông 'playing without music – something audiences weren't used to seeing'. Bài 2: 'In truth, he performed only a fraction of his repertoire from memory and all of his own pieces from music'. Khớp cả ba vế: chơi một mình, chơi thuộc lòng là điều khán giả chưa quen, không phải bài nào cũng thuộc."
