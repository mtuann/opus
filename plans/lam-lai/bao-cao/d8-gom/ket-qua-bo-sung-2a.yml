  ghi_chu: "Deutsche Biographie: 1920-01-05 đến 1995-06-12. Chương trình Concours de Genève 2012 (lời Sami Kanaan): 'Arturo Benedetti-Michelangeli won a First Prize at the Concours d'Exécution Musicale de Genève … in 1939'. Cáo phó AP (Deseret News 1995) ghi 1940, nhưng nguồn chính thức của cuộc thi ghi 1939, theo nguồn này. Cáo phó: 'Two pianists who revered their work with him were Martha Argerich and Maurizio Pollini' (Pollini học với ông); nói ông nổi tiếng hủy buổi diễn phút chót, có lần vì không khí lùa vào làm lệch dây đàn: hợp với 'cầu toàn đến cả tình trạng cây đàn'. 'Kiểm soát âm thanh tuyệt đối' là nhận xét."
