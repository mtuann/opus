  ghi_chu: "Classic FM (bài báo tin mất, 2025): 'Born in Czechia on 5 January 1931 … having made the first complete recording of the composer's piano works'; ông quảng bá Haydn, đưa sonata Schubert thành tiết mục thường, làm sống lại nhạc piano của Liszt; 'A poet, essayist and lecturer'. Berliner Philharmoniker: ông đọc tiểu luận và thơ của mình. Năm mất 2025 theo bài báo tin mất (mất ở tuổi 94)."
