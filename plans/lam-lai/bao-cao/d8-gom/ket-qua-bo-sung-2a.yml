    - "https://www.musicnotes.com/sheetmusic/ludovico-einaudi/nuvole-bianche/MN0106486"
    - "https://www.musicnotes.com/images/productimages/large/mtd/mn0106486.gif"
  cau_dung: "Mariage d'Amour: Sol thứ, mở đầu Moderato ♩ = 72 ở 4/4 có xen ô 3/4, rồi phần chính (mục A, Faster ♩. = 50) ở 3/4 (Musicnotes MN0114635); Comptine: Mi thứ, 4/4, ♩ = 100 (Musicnotes MN0091413); Nuvole bianche: Fa thứ, mở đầu 4/4 ♩ = khoảng 40, phần chính 12/8 ♩. = 78 (Musicnotes MN0106486)."
  ghi_chu: "Mariage d'Amour (MN0114635): trang sản phẩm ghi Sol thứ, Moderato, q = 72, nhịp 4/4 (chỉ ghi nhịp đầu bài). Ảnh trang 1: ô 1–2 ở 4/4, ô 3 đổi 3/4, ô 4 về 4/4, ô 5 lại 3/4 (rit., dấu ngân), rồi mục A 'Faster ♩. = 50' giữ 3/4 suốt các dòng còn lại của trang 1 (khoảng 15 ô, mỗi ô ba phách: đen + hai cặp móc đơn); ♩. = 50 cũng là cách ghi đập một phách mỗi ô 3/4. Vậy 'chủ yếu 4/4 có vài ô 3/4' sai: 4/4 chỉ ở đoạn dạo đầu, phần chính là 3/4 (trang 2 không xem được). Comptine (MN0091413): trang sản phẩm ghi Mi thứ, 4/4, 100 BPM; ảnh trang 1 có ♩ = 100, khóa một dấu thăng, 4/4. Nuvole bianche (MN0106486): trang sản phẩm ghi Fa thứ, 4/4, 40 BPM; ảnh trang 1: '♩ = ca. 40 allarg.' ở 4/4, rồi 12/8 với '♩. = 78 poco accel.' — khớp."
