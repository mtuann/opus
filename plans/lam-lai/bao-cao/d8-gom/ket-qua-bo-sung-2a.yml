  ghi_chu: "Sách chương trình Concours de Genève 2012: Michelangeli giải Nhất 1939, Argerich 1957. Salzburger Festspiele: Argerich thắng Genève và Busoni năm 1957. Quỹ Busoni (Bolzano, trang Hall of fame): 1957 Martha Argerich FIRST PRIZE. Điều lệ Clara Haskil 2027: '1963 Prix non attribué'; 'Les premières éditions se sont déroulées à Lucerne; dès 1973, le Concours se déroule tous les deux ans à Vevey' (khớp 'nay ở Vevey'); lưu trữ có các năm từ 1963. ARIMS (Tel Aviv): Trifonov giải Nhất cuộc thi Rubinstein lần 13 (2011)."
