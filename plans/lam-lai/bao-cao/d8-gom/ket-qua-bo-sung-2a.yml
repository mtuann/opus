  ghi_chu: "Đã xác nhận: Schnabel thu trọn sonata Beethoven 1932–1935 ở Abbey Road Studio No. 3, London (bài của Thư viện Quốc hội Mỹ; có thu sửa năm 1937). Bruce Liu thắng Chopin 2021, học Đặng Thái Sơn (DG, BSO). Eric Lu giải Nhất Chopin lần 19 (2025), từng học Đặng Thái Sơn (BSO; phỏng vấn Chopin Atlanta: 'I am also studying with Dang Thai Son'). Lời khuyên chỉnh hai bản thu to ngang nhau là lời khuyên tập, hợp lý. Chưa xác nhận: chữ 'recital' lần đầu dùng ở buổi diễn của Liszt ở London năm 1840. NPR chỉ viết 'Even the name recital was his invention', không nêu London hay 1840; Britannica (bản lưu) chỉ viết Liszt là người đầu tiên chơi trọn buổi độc tấu. Chi tiết Hanover Square Rooms 9/6/1840 chỉ thấy ở Wikipedia, dẫn Grove (cần đăng nhập, chưa mở). Hết lượt tìm kiếm nên không tìm thêm được nguồn."
