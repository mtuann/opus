  ghi_chu: "Từng hàng: sổ thứ hai (1725) của Anna Magdalena có 7. Menuet G-dur BWV Anh.116, 10. Polonaise g-moll BWV Anh.119, 16. Marche D-dur (Ph.E. Bach) BWV Anh.122 (IMSLP). Notebook for Wolfgang: khoảng 1762, có Menuet và Bourrée; IMSLP dẫn Plath (NMA): lời đề tặng là giả, đây là 'anonymous piano- and music-book from about 1750', khớp 'sổ khuyết danh giữa thế kỷ 18'. Mozart K.1a (Andante Đô trưởng), K.3 (Allegro Si♭ trưởng) có trang IMSLP. Schumann Op.68: số 2 Soldatenmarsch, số 8 Wilder Reiter, số 10 Fröhlicher Landmann (IMSLP). Tchaikovsky Op.39 có The Sick Doll (IMSLP). Kabalevsky Op.39 số 20 Clowns (Hal Leonard, bản Schirmer). Bartók For Children Sz.42: quyển 1 dân ca Hungary, quyển 2 dân ca Slovakia (IMSLP). Gretchaninov Livre d'enfants Op.98 và Glass Beads Op.123 có trang IMSLP. Shostakovich Children's Notebook Op.69: số 1 March, số 2 Waltz, số 3 The Bear (Hal Leonard). Burgmüller Op.100 số 3 La pastorale (IMSLP)."
