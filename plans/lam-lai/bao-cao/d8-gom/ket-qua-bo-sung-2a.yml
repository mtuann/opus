  ghi_chu: "BnF: bản ghi 'Alfred Cortot (1877-1962)'. Trang sản phẩm Salabert (Durand-Salabert-Eschig): Chopin, 12 Études Op. 25, 'Édition de travail avec commentaires d'Alfred Cortot' (bộ ấn bản để học của Chopin). Bản thu: Naxos Historical 8111245 ghi Cortot thu bốn Ballade (London 1929; có bản thu lại 1933); MusicWeb (bài điểm Naxos 8111023): '24 Preludes, Op.28 … rec. 22-23 March 1926 in HMV Studio A, Hayes'. 'Giàu chất thơ' là nhận xét của site, không kiểm."
