  ghi_chu: "Trang chính thức của Concours Clara Haskil (Vevey): niên biểu ghi năm 1895, và năm 1960 bà mất ngày 7/12 sau khi ngã ở ga Brussels; cũng năm 1960 thu Concerto K. 466 (số 20) và K. 491 (số 24) của Mozart với Markevitch (nên gợi ý nghe trước hợp lý). Trang lưu trữ liệt kê các kỳ 1963, 1965, 1967, 1969, 1973 … 2023 (hai năm một lần, từ 1963); địa chỉ hiệp hội ở Vevey. 'Giản dị và sâu' là nhận xét, không kiểm."
