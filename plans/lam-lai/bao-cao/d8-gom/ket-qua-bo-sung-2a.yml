  ghi_chu: "Kiểm từng hàng trên trang tác phẩm IMSLP (số danh mục, giọng, năm trong khung thông tin): Ballade số 2–4 Op.38, 47, 52; Scherzo số 1–4 Op.20, 31, 39, 54; Études Op.10, Op.25; Sonata số 2 Op.35, số 3 Op.58; Barcarolle Op.60; Bình quân luật I BWV 846–869, II BWV 870–893; Partitas BWV 825–830; Goldberg BWV 988; Beethoven số 21 Op.53 'Waldstein', số 23 Op.57 'Appassionata' (tên ở danh sách bản thu trên trang), Op.109, 110, 111; Op.110 chương III có 'Fuga: Allegro ma non troppo'; Haydn Hob.XVI:52 Mi♭ trưởng (1794); Mozart K.310 La thứ, Concerto số 21 K.467; Schubert D.958, 959, 960 (1828), D.760 'Wandererfantasie'; Schumann Op.9 Carnaval, Op.16 Kreisleriana, Op.17 Fantasie; Liszt Sonata S.178, Études d'exécution transcendante S.139; Brahms Op.118, 119, Op.24 (Handel); Debussy Préludes hai quyển, Estampes, Images; Ravel Sonatine, Le tombeau de Couperin, Jeux d'eau, Gaspard de la nuit; Rachmaninoff Op.23, 32, Études-tableaux Op.33, 39, Concerto số 2 (Op.18); Prokofiev Sonata số 7 Op.83, Toccata Op.11; Bartók Sonata Sz.80 (1926), Out of Doors Sz.81. Hai tác phẩm còn bản quyền không có trên IMSLP: Messiaen Vingt regards sur l'Enfant-Jésus (1944) ở PTNA và tờ chương trình Philharmonie de Paris; Ligeti Musica ricercata ở BnF (1951), Études (Book 1–3, Schott ED 7989, ED 8654…) ở pianolibrary.org (trang Schott trả 403). Không thấy hàng sai."
- trang: "piano/tac-pham-theo-cap"
  id: "s1"
  luot_2: "khong-chac"
  nguon: []
  ghi_chu: "Không rõ site dùng ấn bản Musicnotes nào; đã mở hai ấn bản của Yiruma và ảnh trang 1. MN0073222 (Piano Solo, La trưởng, q = 65, https://www.musicnotes.com/sheetmusic/yiruma/river-flows-in-you/MN0073222): thấy tay phải có nhóm móc kép và nốt hoa mỹ nhỏ, tay trái rải hợp âm, đi lại một vòng bốn hợp âm (Fa♯ thứ – Rê – La – Mi) qua hai ô và lặp; KHÔNG thấy đoạn mở đầu tự do hay dấu ngân (bài vào thẳng ♩ = 65, mp). MN0097979 (Easy Piano, Mi thứ, https://www.musicnotes.com/sheetmusic/yiruma/river-flows-in-you/MN0097979): có 'Freely, flowing' và dấu ngân ở ô 2, rồi 'Moderately, expressively'; có nhóm móc kép; nhưng không thấy nốt hoa mỹ nhỏ trên trang 1 và tay trái không rải hợp âm (nốt ngân, dấu lặng). Không ấn bản nào đã xem khớp đủ mọi vế."
- trang: "piano/tac-pham-theo-cap"
  id: "s2"
  luot_2: "dung"
  nguon:
    - "https://www.musicnotes.com/sheetmusic/yiruma/kiss-the-rain/MN0073221"
    - "https://www.musicnotes.com/images/productimages/large/mtd/mn0073221.gif"
  ghi_chu: "Ấn bản Piano Solo của Yiruma MN0073221: trang sản phẩm ghi La♭ trưởng (bốn dấu giáng), 4/4, q = 76. Ảnh trang 1: đoạn 8va (gva) ở dòng 1–3 và dòng 4; tay trái đầu bài viết khóa Sol, cuối dòng 3 chuyển sang khóa Fa; tay phải chơi hợp âm có giai điệu ở nốt trên; có nốt hoa mỹ nhỏ và liên ba (số 3). Lưu ý ấn bản MN0139840 (Piano Solo, Đô trưởng) khác giọng; câu khớp với MN0073221."
- trang: "piano/tac-pham-theo-cap"
  id: "s3"
  luot_2: "dung"
  nguon:
    - "https://www.musicnotes.com/sheetmusic/spirited-away/one-summers-day/MN0151256"
    - "https://www.musicnotes.com/images/productimages/large/mtd/mn0151256.gif"
  ghi_chu: "Ấn bản Piano Solo MN0151256 (Đô trưởng, 4/4, q = 80). Ảnh trang 1: ô 1 hợp âm có dấu rải (đường lượn sóng mũi tên), ô 3 hợp âm rải dạng nốt nhỏ; mục A, B: chuỗi nốt lặp có chấm dưới dấu luyến (portato); tay phải hai lớp (giai điệu móc đơn ở trên, nốt trắng/tròn ở dưới); tay trái giữ hợp âm nốt tròn, và có chỗ rải móc đơn đi lên rộng hơn một quãng tám (ô 2 mục B, ô 2 dòng cuối). Các ấn bản khác (MN0234680 của pianoMission, MN0242959 bản dễ) không xem chi tiết."
- trang: "piano/tac-pham-theo-cap"
  id: "s4"
  luot_2: "dung"
  nguon:
    - "https://www.musicnotes.com/sheetmusic/richard-clayderman/mariage-damour/MN0114635"
    - "https://www.musicnotes.com/images/productimages/large/mtd/mn0114635.gif"
  ghi_chu: "Ảnh trang 1 MN0114635: tay trái rải hợp âm liên tục (móc đơn ở đoạn dạo, nốt đen rải ở mục A); giai điệu ở tay phải; có ô đổi sang 3/4 (ô 3, ô 5). Câu đúng, nhưng thực ra phần chính (mục A) ở hẳn 3/4, không chỉ vài ô: xem n61."
- trang: "piano/tac-pham-theo-cap"
  id: "s5"
  luot_2: "dung"
  nguon:
    - "https://www.musicnotes.com/sheetmusic/yann-tiersen/comptine-dun-autre-%c3%a9t%c3%a9-lapr%c3%a8s-midi/MN0091413"
    - "https://www.musicnotes.com/images/productimages/large/mtd/mn0091413.gif"
  ghi_chu: "Ảnh trang 1 MN0091413 (16 ô đầu trong 3 trang): tay trái hai bè ở mọi ô, bè dưới nốt đen ghi ngón 5 và 4, bè trên móc đơn lặp; tay phải ô 5–8 nhóm móc kép ngắn, ô 13–16 nốt kép; sắc thái p, mf, cặp dấu to dần – nhỏ dần (ô 6–7, 10–11, 14–15). 'Gần như suốt bài' chỉ thấy trên trang 1 (hai trang sau không xem được)."
- trang: "piano/tac-pham-theo-cap"
  id: "s6"
