  ghi_chu: "Ảnh trang 1 MN0106486: '♩ = ca. 40 allarg.' ở đoạn mở đầu 4/4; '♩. = 78 poco accel.' khi vào phần 12/8; tay phải hai bè: móc đơn lặp đuôi lên ở trên, nốt trắng chấm dôi ngân đuôi xuống ở dưới."
