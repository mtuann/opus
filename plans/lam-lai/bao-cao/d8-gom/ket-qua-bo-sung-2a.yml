  ghi_chu: "Từng hàng: Dvořák Giao hưởng số 9 Op.95, chương 2 Largo (IMSLP). Beethoven Giao hưởng số 9 Op.125, chương 4 'An die Freude' (IMSLP). Alfred's Basic Adult Piano Course: Willard A. Palmer, Morton Manus, Amanda Vick Lethco (trang Alfred). Adult Piano Adventures của Nancy và Randall Faber (trang Faber). Mikrokosmos Sz.107 (IMSLP). Diabelli 28 Melodische Übungsstücke Op.149, cho piano 4 tay, xuất bản 1831 ở Vienna (IMSLP; IMSLP xếp 'Romantic'); nhãn 'thế kỷ 19, phong cách Cổ điển' là cách site xếp: năm thuộc thế kỷ 19, và Henle HN 340 xếp Diabelli trong 'Sonatinas ... Classical' (sonatina thời Cổ điển). Czerny Op.599, xuất bản lần đầu 1839 (IMSLP). Gurlitt Anfangs-Stunden Op.117, xuất bản 1881, Piece Style Romantic (IMSLP). Các hàng Türk, Stravinsky, Kurtág ở n43–n45, không kiểm ở đây."
