  ghi_chu: "Kiểm từng hàng. Bach BWV 933–938: IMSLP ghi 933 Đô trưởng, 935 Rê thứ. Invention số 8 Fa trưởng BWV 779 (IMSLP). Scarlatti K. 32 Rê thứ, chương 'Aria' (IMSLP). Handel HWV 437 Rê thứ, có Sarabande (IMSLP). Beethoven Op. 49 số 1 Sol thứ; số 2 chương 2 'Tempo di minuet' (IMSLP). Clementi Op. 36 số 4–6 có (Fa, Sol, Rê trưởng). Kuhlau Op. 20 số 2, 3 có. Chopin Op. 28: số 6 Si thứ, số 20 Đô thứ (IMSLP); sắc thái số 20: bản Mutopia (theo Peters) ghi ff ở đầu, p ở ô 5, pp ở ô 9. Mazurka Op. 68 số 2 La thứ, Op. 67 số 2 Sol thứ (IMSLP). Satie Gnossienne số 1 viết 1889–90 (IMSLP), tức cuối thế kỷ 19. Grieg Op. 12 số 2 Vals, số 4 Alfedans (IMSLP). Schumann Op. 68 số 12 Knecht Ruprecht. Tchaikovsky Op. 39: Lark Song có; 'The Sorcerer' là tên một số ấn bản đặt cho số 20 Baba-Yaga (IMSLP liệt kê file '20. The Sorcerer'; tiêu đề chính trên IMSLP là 'The Old Witch', tiếng Pháp 'La sorcière')."
