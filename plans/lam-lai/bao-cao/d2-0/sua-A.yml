  ly_do: 'Ba bài của trang: số 1 Melodie ở ABRSM Grade 1 (2021 & 2022), số 8 Wilder Reiter ở Grade 3 (2023–2028), số 10 Fröhlicher Landmann ở Grade 4 (2017 & 2018); RCM 2022: số 8 và số 10 ở Level 4; Henle số 1 mức 2, số 8 và 10 mức 3. Số 10 ở Grade 4 nằm ngoài "Grade 1–3". Chặng 2 giữ nguyên (khoảng Grade 1–4 vẫn chứa Grade 1–2). Sửa kéo theo: chip.cap_do và dòng "Độ khó" của thong_tin trong cùng bản ghi (kiểm chéo của src/du-lieu.mjs bắt chip lệch grade), cùng nội dung trang bài học nếu có nêu cấp. Dòng "Độ khó" hiện ghi số 8 ≈ Grade 2, số 10 ≈ Grade 2–3, cần sửa theo ABRSM (Grade 3 và Grade 4).'
