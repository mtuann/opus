  id: d33
  luot_2: dung
  nguon: ["https://hyperphysics.gsu.edu/hbase/Music/orchins.html", "https://www.vsl.co.at/academy/strings/harp"]
  ghi_chu: "Hyperphysics B0–G♯7; VSL Cb1 đến G♯7 (Cb1 = B0)."
