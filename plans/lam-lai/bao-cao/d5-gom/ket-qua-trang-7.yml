  id: d40
  luot_2: khong-chac
  nguon: ["https://hyperphysics.gsu.edu/hbase/Music/orchins.html", "https://digitalspace.bradfordcollege.ac.uk/10626277/instrumental-characteristics/"]
  ghi_chu: "Hyperphysics: trumpet B♭ E3–B♭5 (âm thực); trang Bradford F#3–C6 (viết). Câu ghi E3 (âm thực) với C6 (âm viết) lẫn hai quy ước: không nguồn nào cho đúng E3–C6."
- trang: nhac-cu/dan-nhac
  id: d41
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/brass/tenor-trombone"]
  ghi_chu: "VSL: tenor trombone E2–F5."
