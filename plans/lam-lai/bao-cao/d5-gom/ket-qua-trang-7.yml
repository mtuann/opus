  id: d26
  luot_2: dung
  nguon: ["https://www.tucsonsymphony.org/program-notes/ravel/bolero/", "https://imslp.org/wiki/Boléro_(Ravel,_Maurice)"]
  ghi_chu: "Tucson Symphony: hai giai điệu, chỉ đổi nhạc cụ; Britannica mô tả một chủ đề hai phần, khác cách đếm nhưng cùng ý. Boléro 1928, IMSLP."
