  id: n2
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Nói về cây quyết định của site (nhánh, nhãn); không kiểm được từ nguồn ngoài, nên do review kiểm trên trang."
- trang: nhan-dien/the-loai
  id: n3
  luot_2: dung
  nguon: ["https://www.britannica.com/art/opera-music"]
  ghi_chu: "Britannica: opera là kịch dựng sân khấu hoàn toàn bằng âm nhạc, có ca sĩ, dàn nhạc, bối cảnh."
- trang: nhan-dien/the-loai
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Requiem,_K.626_(Mozart,_Wolfgang_Amadeus)", "https://imslp.org/wiki/Schweigt_stille,_plaudert_nicht,_BWV_211_(Bach,_Johann_Sebastian)", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto"]
  ghi_chu: "Thánh lễ, Requiem (lời Latin, IMSLP K.626), cantata (có loại thế tục, vd BWV 211) và oratorio là thể loại hợp xướng; 'không dựng sân khấu' đúng với Requiem, oratorio. Chưa mở trang riêng cho oratorio."
- trang: nhan-dien/the-loai
  id: n5
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/lied", "https://www.britannica.com/art/Lied"]
  ghi_chu: "Lied: bài hát nghệ thuật Đức, giọng hát với piano."
- trang: nhan-dien/the-loai
  id: n6
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Schweigt_stille,_plaudert_nicht,_BWV_211_(Bach,_Johann_Sebastian)"]
  ghi_chu: "IMSLP: BWV 211 là cantata thế tục (Cà phê), Leipzig 1734–35."
- trang: nhan-dien/the-loai
  id: n7
  luot_2: dung
  nguon: ["https://www.britannica.com/art/chamber-music"]
  ghi_chu: "Sonata độc tấu, tiểu phẩm (nocturne, étude, prélude) là thể loại cho một người chơi: Britannica chamber music định nghĩa thính phòng là nhóm nhỏ; mục nhạc độc tấu là phân loại phổ thông, không mâu thuẫn."
- trang: nhan-dien/the-loai
  id: n8
  luot_2: dung
  nguon: ["https://www.britannica.com/art/chamber-music", "https://www.britannica.com/art/piano-trio", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/string-quartet"]
  ghi_chu: "Britannica/COD: tam tấu, tứ tấu thuộc nhạc thính phòng; sonata nhạc cụ-piano cũng thuộc thính phòng."
- trang: nhan-dien/the-loai
  id: n9
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/concerto"]
  ghi_chu: "COD: concerto là tác phẩm có nhạc cụ độc tấu tương phản và hòa với dàn nhạc."
- trang: nhan-dien/the-loai
  id: n10
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphony", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/symphonic-poem", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/suite"]
  ghi_chu: "Giao hưởng, thơ giao hưởng, tổ khúc ballet (COD nêu Daphnis et Chloé); overture là tác phẩm dàn nhạc không độc tấu."
- trang: nhan-dien/the-loai
  id: n11
  luot_2: dung
  nguon: ["https://www.britannica.com/art/chamber-music"]
  ghi_chu: "Sonata violin–piano, cello–piano, flute–piano là thính phòng hai nhạc cụ; 'ngang hàng' là cách nói phổ thông."
- trang: nhan-dien/the-loai
