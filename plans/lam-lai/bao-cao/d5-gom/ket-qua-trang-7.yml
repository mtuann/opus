  ghi_chu: "COD: dàn nhạc giao hưởng thường hơn 90 nhạc công; 90–100 là cách nói gọn, không mâu thuẫn."
- trang: nhac-cu/dan-nhac
  id: d2
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/orchestra", "https://www.skagitsymphony.com/instruments-of-the-orchestra"]
  ghi_chu: "Bốn bộ: dây, gỗ, đồng, gõ."
- trang: nhac-cu/dan-nhac
  id: d3
  luot_2: dung
  nguon: ["https://www.skagitsymphony.com/instruments-of-the-orchestra", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-bass"]
  ghi_chu: "Skagit: bộ dây là bộ lớn nhất, gồm cả đàn hạc; bass thường gảy (pizzicato) trong jazz. Chưa mở trang nói riêng về pizzicato; phần 'đàn hạc chỉ gảy' khớp COD (harp: plucked). Philharmonia xếp hạc riêng nhóm, tùy cách phân loại."
- trang: nhac-cu/dan-nhac
  id: d4
  luot_2: dung
  nguon: ["https://www.philharmonia.co.uk/explore/instruments/violin", "https://www.skagitsymphony.com/instruments-of-the-orchestra"]
  ghi_chu: "Philharmonia: violin là nhạc cụ cao nhất, nhanh nhất của họ dây; violin 2 'nâng đỡ và lấp hòa âm'. Lưu ý đàn hạc (xếp trong bộ dây ở trang) có âm vực cao hơn: câu đúng theo nghĩa nhóm nhạc cụ kéo vĩ."
- trang: nhac-cu/dan-nhac
  id: d5
  luot_2: dung
  nguon: ["https://www.philharmonia.co.uk/explore/instruments/viola", "https://www.vsl.co.at/academy/strings/viola"]
  ghi_chu: "Viola lớn hơn violin, âm dày tối hơn; ký âm chủ yếu khóa Đô (VSL)."
- trang: nhac-cu/dan-nhac
  id: d6
  luot_2: dung
  nguon: ["https://www.philharmonia.co.uk/explore/instruments/cello"]
  ghi_chu: "Philharmonia: cello là 'giọng tenor' của bộ dây; ví với giọng nam hợp lý. Tư thế đặt giữa hai chân không có trong trang đã mở, nhưng là kiến thức phổ thông."
- trang: nhac-cu/dan-nhac
  id: d7
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/double-bass"]
  ghi_chu: "COD: lớn nhất và trầm nhất trong nhạc cụ kéo vĩ. Tư thế đứng/ghế cao và vai trò bè trầm: không trang đã mở nói thẳng."
- trang: nhac-cu/dan-nhac
  id: d8
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/harp"]
  ghi_chu: "COD: đàn hạc gảy bằng ngón tay; glissando là kỹ thuật đặc trưng."
- trang: nhac-cu/dan-nhac
  id: d9
  luot_2: dung
  nguon: ["https://www.skagitsymphony.com/instruments-of-the-orchestra"]
  ghi_chu: "Skagit: sáo hiện đại làm bằng bạc, vàng, bạch kim hay gỗ; sáo cổ bằng gỗ, sậy."
- trang: nhac-cu/dan-nhac
  id: d10
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/piccolo", "https://www.vsl.co.at/academy/woodwinds/piccolo"]
  ghi_chu: "COD: piccolo là sáo nhỏ cao hơn sáo thường một quãng tám."
- trang: nhac-cu/dan-nhac
  id: d11
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/oboe", "https://www.vsl.co.at/academy/woodwinds/oboe"]
  ghi_chu: "COD: oboe dăm kép, âm lên dây dàn nhạc là A. (VSL ghi 'lên dây C' theo nghĩa nhạc cụ, nhưng dàn nhạc lấy nốt A của oboe; COD xác nhận A.)"
- trang: nhac-cu/dan-nhac
  id: d12
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/woodwinds/clarinet"]
  ghi_chu: "VSL: clarinet B♭ viết E3–C7, âm vực rộng. Dăm đơn và 'mềm mại' chưa có trang mở nói trực tiếp, là mô tả phổ thông."
- trang: nhac-cu/dan-nhac
  id: d13
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/bassoon"]
  ghi_chu: "COD: bassoon (It. fagotto), thành viên trầm của họ dăm kép; hay dùng cho hiệu ứng hài hước."
- trang: nhac-cu/dan-nhac
  id: d14
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Mô tả âm sắc horn 'tròn, ấm' và vai trò nối gỗ–đồng mang tính chủ quan; trang Philharmonia về horn không mở được, không nguồn nào xác nhận hay bác."
- trang: nhac-cu/dan-nhac
  id: d15
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Mô tả âm sắc trumpet mang tính chủ quan; không trang nào đã mở xác nhận trực tiếp."
- trang: nhac-cu/dan-nhac
  id: d16
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/trombone"]
  ghi_chu: "COD: trombone có ống trượt (slide). Phần 'uy nghi, mạnh mẽ' là mô tả chủ quan, không trái nguồn."
- trang: nhac-cu/dan-nhac
  id: d17
  luot_2: dung
  nguon: ["https://www.skagitsymphony.com/instruments-of-the-orchestra", "https://www.britannica.com/art/tuba"]
  ghi_chu: "Skagit: tuba là nhạc cụ đồng lớn nhất và trầm nhất."
- trang: nhac-cu/dan-nhac
  id: d18
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/timpani"]
  ghi_chu: "COD: timpani lên dây theo cao độ xác định."
- trang: nhac-cu/dan-nhac
  id: d19
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/percussion"]
  ghi_chu: "VSL liệt kê: timpani, trống con, trống lớn, cymbals, triangle(?), glockenspiel, xylophone, chuông ống (tubular bells). Triangle không được liệt kê riêng trong trang đã mở nhưng là nhạc cụ gõ chuẩn."
- trang: nhac-cu/dan-nhac
  id: d20
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/timpani", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/orchestra"]
  ghi_chu: "COD: timpani dùng trong dàn nhạc Cổ điển; Beethoven Sym. 1 (1800) dùng timpani là bộ gõ duy nhất. 'Thường chỉ có' hợp lý (Mozart, Haydn đôi khi thêm triangle, cymbals theo phong cách Thổ)."
- trang: nhac-cu/dan-nhac
  id: d21
  luot_2: dung
  nguon: ["https://slso.org/wp-content/uploads/2023/12/Standup-Symphony.pdf", "https://www.skagitsymphony.com/instruments-of-the-orchestra"]
  ghi_chu: "SLSO: violin 1 bên trái, các bộ phân tách; timpani phía sau (Skagit). Vị trí cello/bass bên phải và bộ gỗ ở giữa là bố trí chuẩn phổ biến, chưa có trang mở nói chi tiết; câu đã nói bố trí thay đổi."
- trang: nhac-cu/dan-nhac
  id: d23
  luot_2: dung
  nguon: ["https://www.hollywoodbowl.com/musicdb/pieces/552/peter-and-the-wolf"]
  ghi_chu: "Hollywood Bowl: 1936; chim–flute, vịt–oboe, mèo–clarinet, ông–bassoon, sói–ba kèn horn, Peter–dây, tiếng súng–timpani và trống lớn. Trang viết 'chim sáo' = flute."
- trang: nhac-cu/dan-nhac
  id: d24
  luot_2: dung
  nguon: ["https://boosey.com/shop/work-info/Young-Person-s-Guide-to-the-Orchestra/6319", "https://www.hollywoodbowl.com/musicdb/pieces/768/the-young-persons-guide-to-the-orchestra"]
  ghi_chu: "Britten 1946, Op. 34, chủ đề Purcell (Abdelazer), kết bằng fugue. Thứ tự từng bộ: piccolo, flutes, oboes, clarinets, bassoons; violins, violas, cellos, basses, harp; horns, trumpets, trombones, tuba: cao xuống thấp. Bộ gõ chỉ là một biến tấu (không xếp theo cao độ), nên 'từ cao xuống thấp' đúng cho gỗ, dây, đồng."
- trang: nhac-cu/dan-nhac
  id: d25
  luot_2: dung
  nguon: ["https://digfir-published.macmillanusa.com/listen8e/listen8e_ch15_13.html"]
  ghi_chu: "Macmillan listening chart: kèn horn chơi bridge theme nối chủ đề 1 sang chủ đề 2 ở chương 1 Sym. 5."
