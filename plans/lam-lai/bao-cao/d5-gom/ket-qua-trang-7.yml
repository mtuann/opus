  id: d35
  luot_2: dung
  nguon: ["https://hyperphysics.gsu.edu/hbase/Music/orchins.html", "https://www.vsl.co.at/academy/woodwinds/concert-flute"]
  ghi_chu: "C4–C7 (hyperphysics); VSL B3–D7 với chân B. Ghi chân C chuẩn: đúng."
