  id: d31
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/strings/cello", "https://www.asahi-net.or.jp/~hb9t-ktd/music/English/Instrument/range_gm.html"]
  ghi_chu: "VSL: C2–A5; asahi cũng C2–A5."
