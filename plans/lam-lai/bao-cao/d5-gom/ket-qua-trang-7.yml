  id: d37
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/woodwinds/clarinet"]
  ghi_chu: "VSL: âm thực D3–B♭6 (viết E3–C7)."
- trang: nhac-cu/dan-nhac
  id: d38
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/woodwinds/bassoon"]
  ghi_chu: "VSL: B♭1–E♭5 (F5 đôi khi); E5 nằm trong khoảng mở rộng, lệch nửa cung so với mức chuẩn E♭5."
