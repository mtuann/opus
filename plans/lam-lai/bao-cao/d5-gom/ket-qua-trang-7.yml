  id: d29
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/strings/violin", "https://hyperphysics.gsu.edu/hbase/Music/orchins.html", "https://www.asahi-net.or.jp/~hb9t-ktd/music/English/Instrument/range_gm.html"]
  ghi_chu: "G3 thấp nhất; cao nhất E7 (hyperphysics, asahi); VSL ghi đến A7. Ghi E7 là âm vực thực hành."
