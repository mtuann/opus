  id: d30
  luot_2: dung
  nguon: ["https://www.vsl.co.at/academy/strings/viola", "https://hyperphysics.gsu.edu/hbase/Music/orchins.html", "https://www.asahi-net.or.jp/~hb9t-ktd/music/English/Instrument/range_gm.html"]
  ghi_chu: "C3 thấp nhất; cao nhất tùy nguồn: C6 (hyperphysics), A6 (VSL, asahi). E6 nằm giữa các nguồn, chấp nhận như âm vực thực hành."
