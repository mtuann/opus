  id: d42
  luot_2: dung
  nguon: ["https://digitalspace.bradfordcollege.ac.uk/10626277/instrumental-characteristics/"]
  ghi_chu: "Bradford: tuba D1–G4 (F4 nằm trong); Finale E1–G4; asahi F1–F4. Chấp nhận D1–F4 như âm vực thực hành của tuba BB♭."
- trang: nhac-cu/dan-nhac
  id: d43
  luot_2: khong-chac
  nguon: ["https://www.vsl.co.at/academy/percussion/timpani", "https://usermanuals.finalemusic.com/FinaleMac/Content/Finale/GIFF_Details.htm"]
  ghi_chu: "VSL: timpani cả bộ khoảng C2–C4 (trống nhỏ nhất đến G3–C4); Finale C2–C4; hyperphysics F2–F4. Đáy D2 phụ thuộc cỡ trống; không nguồn nào ghi đúng D2–C4."
- trang: nhac-cu/dan-nhac
  id: d44
  luot_2: khong-chac
  nguon: ["https://www.asahi-net.or.jp/~hb9t-ktd/music/English/Instrument/range_gm.html"]
  ghi_chu: "Asahi ghi guitar dây ruột E2–E6; trang ghi E2–B5, đúng với đàn cổ điển 19 phím nhưng không nguồn mở nào xác nhận."
