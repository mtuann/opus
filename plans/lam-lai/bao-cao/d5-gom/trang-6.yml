- trang: nhan-dien/dau-van-tay
  id: n3
  cau: Nhóm Baroque gồm Vivaldi, J. S. Bach, Handel.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n4
  cau: Nhóm Cổ điển gồm Haydn, Mozart, Beethoven.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n5
  cau: Nhóm Lãng mạn gồm Schubert, Chopin, Liszt, Wagner, Brahms, Tchaikovsky, Dvořák.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n6
  cau: Nhóm Thế kỷ 20 gồm Debussy, Ravel, Stravinsky, Shostakovich, Reich và Glass, Pärt.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n7
  cau: 'Vivaldi: violin độc tấu điêu luyện; ritornello rõ ràng; nhạc miêu tả (chim, bão).'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n8
  cau: 'J. S. Bach: phức điệu, nhiều bè độc lập cùng chuyển động, nhất là trong fugue; viết nhiều cho organ và harpsichord, những nhạc cụ hợp với đối âm.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n9
  cau: 'Handel: nhiều hợp xướng (oratorio) và dùng cùng phong cách với opera của ông; trong hợp xướng, kết cấu chuyển giữa chủ điệu và phức điệu.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n10
  cau: 'Haydn: hóm hỉnh, bất ngờ (như hợp âm to đột ngột trong "Surprise"), kết giả; xây cấu trúc lớn từ những môtip ngắn, đơn giản; hay dùng chất dân gian.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n11
  cau: 'Mozart: cảm giác về hình thức và sự cân đối; bề ngoài rạng rỡ, vui nhưng có mạch u sầu bên dưới; nhạc opera nới rộng nghệ thuật của ca sĩ; đệm Alberti, như đầu Sonata K. 545.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n12
  cau: 'Beethoven: phát triển một ý nhạc nhỏ qua nhiều biến đổi (như phân mảnh chủ đề trong Giao hưởng số 5); dùng nhiều sforzando; coda mở rộng thành cao trào; các tác phẩm giai đoạn giữa thường được gọi là "anh hùng", thể hiện đấu tranh.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n13
  cau: 'Schubert: giai điệu hát hơi dài; cách chuyển giọng độc đáo, hay dùng quan hệ quãng 3 nửa cung (chromatic mediant) giữa các hợp âm.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n14
  cau: 'Chopin: chủ yếu viết cho piano (mọi tác phẩm đều có piano); rubato là một phần lối chơi của ông; điệu nhảy Ba Lan (mazurka, polonaise) và nocturne.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n15
  cau: 'Liszt: kỹ thuật piano phô diễn; chuyển đổi chủ đề, dùng lại một chủ đề ở nhiều phần với tính cách khác nhau để thống nhất tác phẩm; mở đầu thể loại thơ giao hưởng.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n16
  cau: 'Wagner: âm nhạc liền mạch, "giai điệu bất tận" thay cho sự tách bạch giữa aria và recitative; hòa âm nửa cung dày đặc; dàn nhạc có vai trò và sức mạnh lớn hơn; leitmotif.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n17
  cau: 'Brahms: hình thức cổ điển chặt chẽ ("ý thức cổ điển về hình thức và trật tự"), bậc thầy đối âm; hay dùng hemiola và những xê dịch nhịp (xem bài 15).'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n18
  cau: 'Tchaikovsky: giai điệu cuốn hút ngay, dễ nhớ, đầy cảm xúc; kèn gỗ và dây luân phiên giữ giai điệu (như trong Romeo và Juliet); viết nhạc ballet.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n19
  cau: 'Dvořák: chất dân gian Séc (nhịp điệu của Moravia và Bohemia) và ảnh hưởng nhạc Mỹ (spiritual); giai điệu ngũ cung thời kỳ ở Mỹ.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n20
  cau: 'Debussy: hợp âm trượt song song; gam toàn cung và ngũ cung; chuyển giọng không chuẩn bị; hòa âm nhiều khi mơ hồ về giọng.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n21
  cau: 'Ravel: phối khí chính xác, tinh xảo (Stravinsky gọi ông là "thợ đồng hồ Thụy Sĩ"); hợp âm 9, có khi chạy song song; ảnh hưởng nhạc Tây Ban Nha, điệu nhảy và jazz.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n22
  cau: 'Stravinsky: ostinato dồn dập, có khi nhiều ostinato va vào nhau; nhịp điệu vượt qua vạch nhịp, trọng âm bất ngờ; hợp âm ghép, đa điệu tính (Petrushka).'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n23
  cau: 'Shostakovich: giai điệu dài ở violin, xen các đoạn độc tấu kèn gỗ; chất châm biếm, kỳ quái và hành khúc; cuối Giao hưởng số 5 là sự lặp lại căng thẳng, ám ảnh của Rê trưởng.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n24
  cau: 'Reich và Glass: mẫu ngắn lặp lại, thay đổi rất chậm; Reich: hai mẫu giống nhau lệch pha dần (Piano Phase); Glass: quá trình cộng dồn (thêm một lần lặp, bớt nốt cuối).'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n25
  cau: 'Pärt: tĩnh lặng, giản dị: nốt đơn hoặc hợp âm ba, tempo chậm, âm thanh như tiếng chuông ngân (tintinnabuli).'
  loai: cau-truc
