  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: q1
  cau: Puccini là nhà soạn opera Ý, một trong những đại diện lớn nhất của chủ nghĩa hiện thực trong opera (verismo, lấy đề tài đời thường, đương thời).
  loai: dinh-nghia
- trang: lich-su/opera
  id: n10
  cau: 'Hình ranges-voices (chữ trong hình): bảy giọng và âm vực thường dùng: Soprano Đô4–Đô6, Mezzo-soprano Si3–Si5, Contralto (alto) Sol3–Sol5, Countertenor Sol3–Sol5 (tương đương contralto), Tenor Đô3–Đô5, Baritone La2–Fa♯4, Bass Fa2–Mi4; trục ghi tên nốt Đô2…Đô6, nét đứt là Đô giữa.'
  loai: so-lieu
- trang: lich-su/opera
  id: n49
  cau: 'Người tạc tượng, Đỗ Nhuận: công diễn 1971 (viết xong năm 1970).'
