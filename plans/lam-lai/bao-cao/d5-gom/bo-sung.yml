  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n16
  cau: 'Bảng Moldau, đoạn 5: tiên nữ dưới trăng; sáo và clarinet đan những hình nốt gợn sóng; violin dùng bộ giảm âm chơi giai điệu cao, có đàn hạc.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n28
  cau: 1812 của Tchaikovsky (overture) và Moldau (symphonic poem) đều là một chương cho dàn nhạc và có nội dung kể chuyện.
  loai: dinh-nghia
- trang: lich-su/index
  id: n24
  cau: 'Opera ra đời ở Ý quanh năm 1600: Dafne (1598) của Peri có lẽ là vở opera đầu tiên; L''Orfeo (1607) của Monteverdi là vở opera đầu tiên còn giữ chỗ đứng trong các mùa diễn ngày nay.'
  loai: nam
- trang: lich-su/index
  id: n45
  cau: Từ thập niên 1960, chủ nghĩa tối giản (minimalism) dùng những mẫu ngắn lặp lại trên nền hòa âm đơn giản.
  loai: lich-su
- trang: lich-su/index
  id: n46
  cau: 'Tên tuổi Thế kỷ 20: Debussy, Ravel, Stravinsky, Schoenberg, Bartók, Prokofiev, Shostakovich, Messiaen, Copland. Steve Reich và Philip Glass, hai tên tuổi của chủ nghĩa tối giản, sinh ở thế kỷ 20 nhưng site xếp vào thời Đương đại.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: v2
  cau: Ông viết khoảng 500 concerto và góp phần chuẩn hóa concerto ba chương (nhanh – chậm – nhanh).
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: e2
  cau: Beethoven bắt đầu bị mất thính lực từ khoảng năm 1796; bệnh nặng dần, và từ khoảng năm 1818 ông không còn trò chuyện bằng lời với khách được nữa.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: x2
