- trang: lich-su/opera
  id: n54
  cau: Nhà hát Giao hưởng Nhạc Vũ kịch TP.HCM (HBSO) đã trình diễn những opera thế giới như Madama Butterfly (dạng hòa nhạc).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n15
  cau: 'Nhịp đều đặn: phách và nhịp rõ, phách thường được chia nhỏ liên tục (motor rhythm).'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
