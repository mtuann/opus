  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n16
  cau: Ở đoạn C, nốt La lặp lại dồn dập ở tay trái (móc kép); hòa âm bên trên đi qua Rê thứ, về sau bè trầm rời La (sang Si♭) rồi nhạc dẫn về A.
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n10
  cau: Coda là đoạn kết, có thể ngắn hay dài; coda chương 1 Giao hưởng số 5 của Beethoven là một coda dài.
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n17
