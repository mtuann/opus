- trang: lich-su/thoi-ky/baroque
  id: n1
  cau: Thời Baroque (khoảng 1600–1750)
  loai: nam
- trang: lich-su/thoi-ky/baroque
  id: n2
  cau: Thời của các vương triều chuyên chế (Louis XIV ở Pháp) và của cuộc xung đột giữa Cải cách và Phản Cải cách.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n3
  cau: 'Nhạc sĩ thường là người làm công: cho nhà thờ (Bach ở Leipzig).'
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n4
  cau: Cho triều đình (Lully, nhà soạn nhạc triều đình Pháp).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n5
  cau: Cho công chúng opera ở London (Handel, người lập đoàn opera riêng).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n6
  cau: Cho Ospedale della Pietà, nhà nuôi trẻ bị bỏ rơi ở Venice (Vivaldi).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n7
  cau: Chủ nghĩa nhân văn đem lại mối quan tâm mới tới Hy Lạp và La Mã cổ.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n8
  cau: 'Khoảng năm 1600, ở Florence, nhóm Camerata thử nghiệm kiểu hát lời kịch (recitative): một người hát giai điệu trên phần đệm đơn giản.'
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n9
  cau: Từ đó opera ra đời (Monteverdi L'Orfeo, 1607) ...
  loai: nam
- trang: lich-su/thoi-ky/baroque
  id: n10
  cau: L'Orfeo viết khi Monteverdi làm việc cho công tước xứ Mantua.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n11
  cau: Cách viết "một giai điệu trên một bè trầm" trở thành nền tảng của cả thời kỳ.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n12
  cau: 'Bè trầm liên tục (basso continuo): một bè trầm (như cello, viola da gamba) cùng một nhạc cụ hòa âm (harpsichord, organ, lute) chơi suốt tác phẩm.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n13
  cau: Bè trầm được ghi bằng bè trầm số, người chơi tự ứng tác hợp âm bên trên.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n14
  cau: Các giọng trưởng – thứ và những chuỗi hợp âm được dùng ngày càng nhiều (xem bài 12).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n15
  cau: Câu "Nhịp đều, mạnh mẽ, chuyển động liên tục như một cỗ máy".
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n16
  cau: 'Tương phản: to – nhỏ đột ngột (terraced dynamics), độc tấu – cả dàn nhạc.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n17
  cau: Giai điệu nhiều trang trí; người biểu diễn được kỳ vọng tự thêm nốt hoa mỹ.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n18
  cau: Câu "Mỗi chương thường giữ một tâm trạng (affect) từ đầu đến cuối".
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n19
  cau: 'Đoạn do site viết để minh họa: chuyển động móc đơn liên tục, chuỗi giai điệu đi xuống, bè trầm đi đều, láy rền ở kết.'
  loai: cau-truc
- trang: lich-su/thoi-ky/baroque
  id: n20
  cau: Họ đàn violin là xương sống của dàn nhạc Baroque.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n21
  cau: Harpsichord thường đệm cho dàn nhạc, và organ cũng là nhạc cụ phím quan trọng.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n22
  cau: Piano mới ra đời ở Florence khoảng 1698–1700.
  loai: nam
- trang: lich-su/thoi-ky/baroque
  id: n23
  cau: Kèn trumpet và horn chưa có van, chỉ chơi được chuỗi bồi âm (xem Âm học).
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n24
  cau: Dàn nhạc chủ yếu là đàn dây.
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n25
  cau: Bach viết hơn 200 cantata, nhà thờ và thế tục.
  loai: so-lieu
- trang: lich-su/thoi-ky/baroque
  id: n26
  cau: Sonata cho một hay vài nhạc cụ.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/baroque
  id: n27
  cau: 'Thể loại chính: opera, oratorio, cantata, concerto và concerto grosso, tổ khúc các điệu nhảy, sonata, prelude và fugue.'
  loai: lich-su
- trang: lich-su/thoi-ky/baroque
  id: n28
  cau: Monteverdi, L'Orfeo (1607), Toccata mở đầu và màn 2 (tác phẩm 1).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n29
  cau: Purcell, Dido and Aeneas, aria When I am laid in earth (Dido's Lament, màn 3) (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n30
  cau: Corelli, Concerto grosso Op. 6 số 8, "Giáng sinh" (tác phẩm 3).
  loai: danh-muc
- trang: lich-su/thoi-ky/baroque
  id: n31
  cau: Vivaldi, Mùa xuân (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n32
  cau: Bach, Prelude và fugue cung Đô trưởng, BWV 846, cặp mở đầu Bình quân luật quyển 1 (tác phẩm 5).
  loai: danh-muc
- trang: lich-su/thoi-ky/baroque
  id: n33
  cau: Bach, Tổ khúc cello số 1 (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n34
  cau: Bach, Brandenburg Concerto số 5 (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n35
  cau: Bach, Thương khó theo Thánh Matthew, hợp xướng mở đầu (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n36
  cau: Handel, Messiah, Hallelujah (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n37
  cau: Rameau, Les Indes galantes, Les Sauvages (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/baroque
  id: n38
  cau: 'Cách nghe: để ý bè trầm. Nó gần như không bao giờ dừng lại. Ở các bản thu "phong cách lịch sử", hãy nghe tiếng harpsichord lách tách phía sau.'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/co-dien
  id: n1
  cau: Thời Cổ điển khoảng 1750–1820 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/co-dien
  id: n2
  cau: 'Mô tả (description): thời Khai sáng, âm nhạc chuộng sự cân đối, đối xứng và giản dị; hòa nhạc công cộng ở London, Paris, Vienna; người nghiệp dư mua nhạc in và chơi piano tại nhà.'
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n3
  cau: Thời Khai sáng khuyến khích tư duy khoa học.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n4
  cau: Âm nhạc thời này chuộng sự cân đối, đối xứng và giản dị.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n5
  cau: Âm nhạc rời cung đình và nhà thờ để đến với hòa nhạc công cộng (ở London, Paris, Vienna) và gia đình trung lưu.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n6
  cau: Người nghiệp dư mua bản nhạc in và chơi piano tại nhà.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n7
  cau: Nhạc sĩ dần chuyển từ người làm công cho quý tộc sang nghệ sĩ tự do.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n8
  cau: Haydn phục vụ gia đình Esterházy gần 30 năm.
  loai: so-lieu
- trang: lich-su/thoi-ky/co-dien
  id: n9
  cau: Mozart rời Salzburg đến Vienna làm nghề tự do.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n10
  cau: Beethoven sống bằng tiền tài trợ, học trò và xuất bản.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n11
  cau: Vienna là trung tâm; Haydn, Mozart, Beethoven được gọi chung là "trường phái Vienna thứ nhất".
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n12
  cau: 'Giai điệu rõ ràng, có đệm: một giai điệu chính, bè dưới đệm hợp âm, khác với phức điệu Baroque.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/co-dien
  id: n13
  cau: Kiểu đệm Alberti (hợp âm rải) là cách đệm điển hình; ví dụ bên dưới dùng nó.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/co-dien
  id: n14
  cau: Câu nhạc cân đối, thường dài 4 hay 8 ô nhịp.
  loai: cau-truc
- trang: lich-su/thoi-ky/co-dien
  id: n15
  cau: Hai câu ghép thành một đoạn nhạc hỏi – đáp.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/co-dien
  id: n17
  cau: 'Tương phản trong cùng một chương: như hai chủ đề khác nhau về tính cách trong hình thức sonata.'
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n18
  cau: 'Sắc thái chuyển dần: crescendo, diminuendo thay cho to – nhỏ đột ngột.'
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n19
  cau: Basso continuo dần biến mất.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n20
  cau: 'Đoạn ví dụ do site viết: giai điệu đơn giản, đệm Alberti, hai câu 4 ô nhịp hỏi – đáp.'
  loai: cau-truc
- trang: lich-su/thoi-ky/co-dien
  id: n22
  cau: Piano (fortepiano) thay thế harpsichord.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n23
  cau: 'Dàn nhạc giao hưởng được chuẩn hóa: bộ dây, từng cặp sáo, oboe, bassoon, horn, trumpet, timpani.'
  loai: danh-muc
- trang: lich-su/thoi-ky/co-dien
  id: n24
  cau: Clarinet gia nhập dàn nhạc từ cuối thế kỷ 18.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n25
  cau: Tứ tấu đàn dây là một thể loại thính phòng chính.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n26
  cau: 'Thể loại chính: giao hưởng, concerto cho piano và các nhạc cụ khác, sonata piano, tứ tấu đàn dây, opera (Mozart).'
  loai: danh-muc
- trang: lich-su/thoi-ky/co-dien
  id: n27
  cau: Hình thức sonata là khung thường dùng cho chương đầu.
  loai: lich-su
- trang: lich-su/thoi-ky/co-dien
  id: n29
  cau: C. P. E. Bach, Sinfonia cung Si thứ, Wq 182 số 5 (cầu nối Baroque – Cổ điển).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n30
  cau: Gluck, Orfeo ed Euridice, Dance of the Blessed Spirits.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n31
  cau: Haydn, Giao hưởng số 94, chương 2 (link [nghe-nhac/haydn-94](/opus/nghe-nhac/haydn-94/)).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n32
  cau: Haydn, Tứ tấu đàn dây Op. 76 số 3 "Hoàng đế", chương 2.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n33
  cau: Mozart, Eine kleine Nachtmusik, K. 525.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n34
  cau: Mozart, Giao hưởng số 40, chương 1 (link [nghe-nhac/mozart-40](/opus/nghe-nhac/mozart-40/)).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n35
  cau: Mozart, Concerto piano số 21, K. 467, chương 2.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n38
  cau: Beethoven, Sonata piano Pathétique, Op. 13.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n39
  cau: Danh sách "10 tác phẩm để nghe" gồm đủ 10 mục.
  loai: danh-muc
- trang: lich-su/thoi-ky/co-dien
  id: n44
  cau: 'Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Taruskin, The Oxford History of Western Music.'
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n40
  cau: 'Cách nghe: đếm ô nhịp theo nhóm 4; câu nhạc Cổ điển thường chia đôi khá đều, cảm giác hỏi – đáp ở cuối mỗi cặp câu.'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/lang-man
  id: n1
  cau: Thời Lãng mạn khoảng 1820–1900 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/lang-man
  id: n2
  cau: 'Mô tả (description): từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên, chủ nghĩa dân tộc; piano mạnh hơn, dàn nhạc phình to, nghệ sĩ bậc thầy.'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n3
  cau: Từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên và chủ nghĩa dân tộc.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n4
  cau: Âm nhạc được xem là nghệ thuật thích hợp nhất để biểu đạt cảm xúc; nhạc sĩ muốn bày tỏ thế giới nội tâm của mình.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n5
  cau: Công nghiệp hóa giúp chế tạo piano mạnh hơn và hàng loạt hơn, đưa đàn vào nhiều gia đình trung lưu.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n6
  cau: Nhạc sĩ viết nhiều cho hòa nhạc công cộng và liên hoan.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n7
  cau: Thời của những nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt, được hâm mộ như ngôi sao.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n8
  cau: Beethoven giai đoạn cuối (Giao hưởng số 9, các tứ tấu cuối) là cây cầu dẫn vào thời kỳ này.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n9
  cau: 'Cảm xúc đặt lên hàng đầu: biểu cảm quan trọng hơn khuôn khổ hình thức.'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n10
  cau: Giai điệu dài, hát, đầy cảm xúc (đặc trưng cũ).
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n11
  cau: 'Hòa âm giàu màu sắc: dùng nhiều hợp âm nửa cung (chromatic) để biểu đạt cảm xúc.'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n12
  cau: 'Ví dụ về hòa âm nửa cung: Tristan und Isolde của Wagner.'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n14
  cau: Rubato nghĩa là co giãn tốc độ để diễn cảm.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/lang-man
  id: n15
  cau: Diễn tấu tự do bằng rubato là một đặc trưng của lối chơi Lãng mạn.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n16
  cau: 'Quy mô co giãn: từ tiểu phẩm một chương cho piano và ca khúc đến tác phẩm cỡ lớn (Giao hưởng số 8 của Mahler, opera của Wagner).'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n17
  cau: 'Âm nhạc chương trình: kể chuyện hoặc vẽ cảnh theo một nội dung ngoài âm nhạc (Berlioz, Giao hưởng kỳ ảo; thơ giao hưởng của Liszt).'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/lang-man
  id: n18
  cau: 'Bản sắc dân tộc: dân ca, điệu nhảy dân gian hay nét nhạc dân tộc của Ba Lan (Chopin), Séc (Dvořák, Smetana), Na Uy (Grieg), Nga (Nhóm Năm người).'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n19
  cau: Tchaikovsky thuộc nhóm nhạc sĩ mang bản sắc dân tộc Nga.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n20
  cau: 'Đoạn ví dụ do site viết: tay trái rải rộng, hợp âm bảy giảm, hợp âm mượn, chậm dần trước kết.'
  loai: cau-truc
- trang: lich-su/thoi-ky/lang-man
  id: n22
  cau: Piano có khung gang, âm thanh lớn và vang hơn.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n23
  cau: 'Dàn nhạc phình to: kèn đồng có van chơi được đủ các nốt của gam nửa cung.'
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n24
  cau: Dàn nhạc thêm tuba, cor anglais, harp, nhiều nhạc cụ gõ.
  loai: danh-muc
- trang: lich-su/thoi-ky/lang-man
