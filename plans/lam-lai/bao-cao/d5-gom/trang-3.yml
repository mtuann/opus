- trang: lich-su/thoi-ky/the-ky-20
  id: n1
  cau: Thế kỷ 20 khoảng 1900–2000 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/the-ky-20
  id: n2
  cau: 'Mô tả (description): hai cuộc chiến tranh thế giới, những biến động chính trị lớn, công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc, và nhiều hướng sáng tác khác nhau.'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n3
  cau: Hai cuộc chiến tranh thế giới và những biến động chính trị lớn tác động tới âm nhạc thế kỷ 20.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n4
  cau: Công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n5
  cau: Lần đầu tiên một buổi biểu diễn có thể được ghi lại và nghe lại.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n6
  cau: 'Không còn một "ngữ pháp" chung: các nhà soạn nhạc đi nhiều hướng khác nhau.'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n7
  cau: Nhiều nhạc sĩ phải rời bỏ quê hương (Stravinsky, Rachmaninoff, Schoenberg, Bartók).
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n8
  cau: 'Ở Liên Xô, âm nhạc chịu sự kiểm soát chính trị: Shostakovich và Prokofiev đều bị lên án là "chủ nghĩa hình thức".'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n9
  cau: 'Ấn tượng: hòa âm mơ hồ về giọng, hợp âm trượt song song, điệu thức, gam toàn cung và gam ngũ cung.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n10
  cau: Ấn tượng gắn với "màu sắc âm thanh".
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n11
  cau: 'Ấn tượng: Debussy, Ravel.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n12
  cau: 'Nguyên thủy, tiết tấu: tiết tấu dồn dập, trọng âm bất thường, nghịch tai mạnh.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n13
  cau: 'Nguyên thủy, tiết tấu: Stravinsky, Le Sacre du printemps.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n14
  cau: 'Vô điệu tính, 12 âm: không dựa vào giọng chủ; 12 nốt có vai trò gần như ngang nhau.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n15
  cau: 'Vô điệu tính, 12 âm: Schoenberg, Berg, Webern ("trường phái Vienna thứ hai").'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n16
  cau: 'Tân cổ điển: trở lại trật tự, sự cân đối và rõ ràng của nhạc thế kỷ 18, với hòa âm tonal được cập nhật.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n17
  cau: 'Tân cổ điển: Stravinsky, Pulcinella; Prokofiev, Giao hưởng số 1.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n18
  cau: 'Dân tộc: dựa vào nhạc dân gian của dân tộc mình; có người thu thập và ghi âm dân ca thật.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n19
  cau: 'Dân tộc: Bartók, Kodály, Janáček, Villa-Lobos.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n20
  cau: 'Nhạc Mỹ: ảnh hưởng jazz, nhạc dân gian Mỹ, nhạc kịch; Gershwin, Copland, Bernstein.'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n21
  cau: 'Tiên phong sau 1945: nhạc chuỗi toàn phần, nhạc điện tử, nhạc ngẫu nhiên.'
  loai: danh-muc
- trang: lich-su/thoi-ky/the-ky-20
  id: n22
  cau: 'Tiên phong sau 1945: Messiaen, Boulez, Stockhausen, Cage, Ligeti.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n23
  cau: 'Tối giản: mẫu ngắn lặp lại, biến đổi rất chậm.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n24
  cau: 'Tối giản: Reich, Glass, Riley; "tối giản thần thánh" của Pärt, Górecki.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n25
  cau: 'Đoạn ví dụ Ấn tượng do site viết: hợp âm trượt song song trên một nốt trầm giữ suốt.'
  loai: cau-truc
- trang: lich-su/thoi-ky/the-ky-20
  id: n27
  cau: 'Đoạn ví dụ Tối giản do site viết: một mẫu ngắn lặp lại, thay đổi từng nốt một.'
  loai: cau-truc
