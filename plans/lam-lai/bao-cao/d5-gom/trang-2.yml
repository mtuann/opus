- trang: lich-su/opera
  id: n1
  cau: Opera là kịch được hát toàn bộ (hoặc gần như toàn bộ), với dàn nhạc, dàn dựng sân khấu, trang phục và diễn xuất.
  loai: dinh-nghia
- trang: lich-su/opera
  id: n2
  cau: Opera ra đời ở Ý khoảng năm 1600.
  loai: nam
- trang: lich-su/opera
  id: n3
  cau: Nhiều nhà soạn nhạc như Verdi, Wagner, Puccini nổi tiếng chủ yếu nhờ opera.
  loai: lich-su
- trang: lich-su/opera
  id: n4
  cau: 'Overture: khúc mở màn của dàn nhạc; giới thiệu không khí, đôi khi cả các giai điệu của vở.'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n5
  cau: 'Recitative: hát "nói", nhịp tự do, đệm đơn giản; đẩy câu chuyện đi tiếp (đối thoại, sự kiện).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n6
  cau: 'Aria: bài hát đơn, giai điệu đẹp; dừng thời gian để nhân vật bày tỏ cảm xúc.'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n7
  cau: 'Ensemble: song ca, tam ca, tứ ca… (nhiều nhân vật cùng hát).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n8
  cau: 'Hợp xướng: cả nhóm người hát; vai trò dân làng, binh lính, khách dự tiệc…'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n9
  cau: 'Libretto: kịch bản (lời), thường do nhà thơ viết, nhà soạn nhạc phổ nhạc.'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n11
  cau: 'Soprano: giọng nữ cao; ví dụ vai Mimì (La bohème).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n12
  cau: 'Mezzo-soprano: giọng nữ trung; ví dụ Carmen, cũng hát vai nam thiếu niên (như Octavian).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n13
  cau: 'Contralto: giọng nữ trầm (còn gọi là alto).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n14
  cau: 'Countertenor: giọng nam cao (âm vực tương đương contralto, mezzo-soprano hay soprano); vai trong opera Baroque.'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n15
  cau: 'Tenor: giọng nam cao (cao nhất trong giọng nam tự nhiên); ví dụ vai Rodolfo (La bohème).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n16
  cau: 'Baritone: giọng nam trung (giữa tenor và bass); ví dụ vai Marcello (La bohème).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n17
  cau: 'Bass: giọng nam trầm (thấp nhất); ví dụ vai Colline (La bohème).'
  loai: dinh-nghia
- trang: lich-su/opera
  id: n18
  cau: 'Baroque (thế kỷ 17–18): Monteverdi L''Orfeo (1607), Handel Giulio Cesare (1724).'
  loai: nam
- trang: lich-su/opera
  id: n19
  cau: Ở Baroque, trọng tâm chuyển từ recitative sang aria; ca sĩ được kỳ vọng tự thêm trang trí khi aria quay lại đoạn đầu.
  loai: lich-su
- trang: lich-su/opera
  id: n20
  cau: 'Cổ điển: Mozart, với opera tiếng Ý (Le nozze di Figaro, Don Giovanni) và tiếng Đức (Die Zauberflöte). Recitative của ông biểu cảm hơn, làm mờ ranh giới giữa recitative và aria.'
  loai: lich-su
- trang: lich-su/opera
  id: n21
  cau: 'Bel canto Ý (đầu thế kỷ 19): vẻ đẹp của giọng hát là trên hết. Rossini (Il barbiere di Siviglia, 1816), Bellini (Norma), Donizetti (Lucia di Lammermoor, 1835).'
  loai: nam
- trang: lich-su/opera
  id: n22
  cau: 'Verdi (giữa thế kỷ 19): Rigoletto (1851), La traviata (1853), Aida (1871).'
  loai: nam
- trang: lich-su/opera
  id: n23
  cau: 'Wagner (Đức): "nhạc kịch" (music drama); các chủ đề âm nhạc đại diện (leitmotif) được ông nâng lên mức phức tạp nhất. Bộ Der Ring des Nibelungen gồm 4 vở, diễn trong bốn đêm.'
  loai: lich-su
- trang: lich-su/opera
  id: n24
  cau: 'Opera Pháp: Bizet (Carmen), Gounod (Faust), Massenet.'
  loai: ten
- trang: lich-su/opera
  id: n25
  cau: 'Verismo (cuối thế kỷ 19, Ý): chủ nghĩa hiện thực, thường lấy đề tài đương thời và đời thường (như Cavalleria rusticana của Mascagni). Puccini (La bohème, Tosca, Madama Butterfly) được xếp vào những đại diện lớn của chủ nghĩa hiện thực trong opera.'
  loai: lich-su
- trang: lich-su/opera
  id: n26
  cau: 'Thế kỷ 20 đến nay: Britten (Peter Grimes), Berg (Wozzeck), John Adams (Nixon in China), Saariaho (L''Amour de loin).'
  loai: ten
- trang: lich-su/opera
  id: n27
  cau: 'Die Zauberflöte (Cây sáo thần), Mozart: opera tiếng Đức, hai màn; aria Nữ hoàng bóng đêm'
  loai: lich-su
- trang: lich-su/opera
  id: n28
  cau: 'Le nozze di Figaro, Mozart: hài kịch (commedia per musica) bốn màn, theo vở kịch của Beaumarchais'
  loai: lich-su
- trang: lich-su/opera
  id: n29
  cau: 'Il barbiere di Siviglia, Rossini: opera buffa hai màn; aria Largo al factotum'
  loai: lich-su
- trang: lich-su/opera
  id: n30
  cau: 'La traviata, Verdi: ba màn, theo vở kịch La Dame aux camélias của Dumas con'
  loai: lich-su
- trang: lich-su/opera
  id: n31
  cau: 'Rigoletto, Verdi: ba màn, theo vở kịch của Victor Hugo; aria La donna è mobile'
  loai: lich-su
- trang: lich-su/opera
  id: n32
  cau: 'Carmen, Bizet: có Habanera'
  loai: lich-su
- trang: lich-su/opera
  id: n33
  cau: 'La bohème, Puccini: bốn màn, hát tiếng Ý'
  loai: lich-su
- trang: lich-su/opera
  id: n34
  cau: 'Madama Butterfly, Puccini: có aria Un bel dì vedremo (màn 2)'
  loai: lich-su
- trang: lich-su/opera
  id: n35
  cau: 'Tosca, Puccini: ba màn, theo vở kịch của Sardou; công diễn năm 1900'
  loai: lich-su
- trang: lich-su/opera
  id: n36
  cau: 'Hansel und Gretel, Humperdinck: ba màn, theo truyện của anh em nhà Grimm'
  loai: lich-su
- trang: lich-su/opera
  id: n42
  cau: Chương trình kỷ niệm 3 năm của Nhà hát Hồ Gươm (2026) có ba ca sĩ opera quốc tế Diana Damrau, Javier Camarena, Marina Viotti.
  loai: lich-su
- trang: lich-su/opera
  id: n43
  cau: Trong nhà hát, khán giả thường vỗ tay sau mỗi aria nổi tiếng, khác với hòa nhạc giao hưởng nơi người ta đợi đến hết tác phẩm.
  loai: quy-tac
- trang: lich-su/opera
  id: n44
  cau: Opera do người Việt sáng tác có lịch sử hơn nửa thế kỷ.
  loai: nam
- trang: lich-su/opera
  id: n45
  cau: Opera được biểu diễn ở Việt Nam từ thời Pháp thuộc, chủ yếu cho khán giả người Pháp, ở các nhà hát lớn Sài Gòn và Hà Nội.
  loai: lich-su
- trang: lich-su/opera
  id: n46
  cau: Vở thường được coi là opera Việt Nam đầu tiên là Cô Sao của Đỗ Nhuận (1922–1991), do Nhà hát Nhạc Vũ Kịch Việt Nam biểu diễn năm 1965.
  loai: nam
- trang: lich-su/opera
  id: n47
  cau: Vở kể về A Sao, cô gái người Thái mồ côi, chịu bất công dưới sự cai trị thực dân rồi được cách mạng thuyết phục đứng lên chống Pháp; âm nhạc mang âm điệu Tây Bắc.
  loai: lich-su
- trang: lich-su/opera
  id: n48
  cau: Năm 2012, nhân kỷ niệm 90 năm ngày sinh của Đỗ Nhuận, con trai ông là nhạc sĩ Đỗ Hồng Quân tìm lại bản nháp viết tay của vở (gần 1.000 trang nhạc) và dựng lại.
  loai: nam
- trang: lich-su/opera
  id: n49
  cau: 'Người tạc tượng, Đỗ Nhuận: công diễn 1971, sáng tác từ 1968.'
  loai: nam
- trang: lich-su/opera
  id: n50
  cau: 'Lá đỏ, Đỗ Hồng Quân: công diễn 2016.'
  loai: nam
- trang: lich-su/opera
  id: n51
  cau: Công nữ Anio, Trần Mạnh Hùng, 2023 (dự án Việt – Nhật).
  loai: nam
- trang: lich-su/opera
  id: n52
  cau: Người tạc tượng lấy bối cảnh Tây Nguyên, công diễn ngày 2/9/1971 tại Nhà hát Lớn Hà Nội; Lá đỏ có kịch bản của nhà thơ Nguyễn Thị Hồng Ngát.
  loai: lich-su
- trang: lich-su/opera
  id: n53
  cau: Nhà hát Nhạc Vũ Kịch Việt Nam (VNOB, Hà Nội, thành lập ngày 6/8/1959) biểu diễn ballet, opera và nhạc giao hưởng.
  loai: nam
- trang: lich-su/opera
  id: n54
  cau: Nhà hát Giao hưởng Nhạc Vũ kịch TP.HCM (HBSO) dàn dựng những opera thế giới như Madama Butterfly.
  loai: lich-su
- trang: lich-su/opera
  id: n55
  cau: 'Vài giọng ca opera Việt: tenor Ninh Đức Hoàng Long (giải nhất Simándy József 2016 và 2018), soprano Đào Tố Loan (giải nhất Cuộc thi Opera Đông Nam Á 2018), soprano Hà Phạm Thăng Long (vai A Sao).'
  loai: lich-su
- trang: lich-su/opera
  id: n56
  cau: 'Nhạc kịch kiểu Broadway đang manh nha ở Việt Nam: Giấc mơ Chí Phèo (Nhà hát Ca múa nhạc Thăng Long, âm nhạc Dương Cầm), cháy vé, giải Tinh hoa Việt 2025.'
  loai: lich-su
- trang: lich-su/opera
  id: n40
  cau: Bắt đầu với những aria nổi tiếng, rồi mới xem trọn vở.
  loai: khuyen-tap
- trang: lich-su/opera
  id: n38
  cau: Đọc tóm tắt cốt truyện trước; biết trước giúp bạn tập trung vào âm nhạc.
  loai: khuyen-tap
- trang: lich-su/opera
  id: n39
  cau: Xem có phụ đề. Chọn bản ghi hình có phụ đề, nhất là khi opera hát bằng tiếng Ý, Đức hay Pháp.
  loai: khuyen-tap
- trang: lich-su/thoi-ky/phuc-hung
  id: n1
  cau: Thời Phục hưng (khoảng 1400–1600)
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n2
  cau: Âm nhạc vẫn gắn với nhà thờ, nhưng nhạc thế tục cũng phát triển (madrigal, chanson, nhạc khiêu vũ).
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n3
  cau: 'Máy in nhạc ra đời: năm 1501, Ottaviano Petrucci, người làm việc ở Venice, in tuyển tập nhạc đa âm đầu tiên bằng chữ in rời.'
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n4
  cau: Việc xuất bản nhạc in là một nét mới của thời kỳ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n5
  cau: Từ thế kỷ 16 (Luther, từ năm 1517), cuộc Cải cách Tin lành và Phản Cải cách của Công giáo ảnh hưởng mạnh đến âm nhạc nhà thờ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n6
  cau: Luther khuyến khích giáo dân cùng hát thánh ca bằng tiếng mẹ đẻ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n7
  cau: Công đồng Trent (1545–1563) đòi hỏi lời hát phải nghe rõ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n8
  cau: 'Phức điệu mô phỏng: các bè lần lượt bắt chước nhau.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n9
  cau: 'Hòa âm: quãng ba và hợp âm ba được dùng ngày càng nhiều.'
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n10
  cau: 'Nhà soạn nhạc vẽ chữ (word painting): giai điệu đi lên ở lời nói về sự thăng thiên, những nốt nhanh ở lời nói về chạy.'
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n11
  cau: Câu "Vẫn chủ yếu dùng điệu thức, nhưng đã nghe ra cảm giác trưởng – thứ ngày càng rõ".
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n12
  cau: 'Hai bè độc lập, chỉ dùng quãng thuận, bắt đầu và kết bằng quãng đúng: một ví dụ đối âm loại 1 theo kiểu của Fux để thấy các bè đi độc lập mà vẫn hòa hợp.'
  loai: quy-tac
- trang: lich-su/thoi-ky/phuc-hung
  id: n13
  cau: 'Thánh lễ (mass) và motet: nhạc nhà thờ đa âm.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n14
  cau: 'Madrigal: ca khúc thế tục nhiều bè, gốc Ý, có cả madrigal Anh; lời thường tình ái, châm biếm hay ngụ ngôn.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n15
  cau: Chanson (Pháp).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n16
  cau: Nhạc khí cho đàn lute; các điệu nhảy như pavane, galliard.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n17
  cau: Guillaume Du Fay, Nuper rosarum flores, motet, công diễn lần đầu ngày 25/3/1436 tại nhà thờ chính tòa Santa Maria del Fiore, Florence (tác phẩm 1).
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n18
  cau: Josquin des Prez, Ave Maria… virgo serena (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n19
  cau: Josquin, Mille regretz (tác phẩm 3).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n20
  cau: Palestrina, Missa Papae Marcelli (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n21
  cau: Thomas Tallis, Spem in alium, 40 bè (tác phẩm 5).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n22
  cau: William Byrd, Ave verum corpus (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n23
  cau: Orlande de Lassus (Orlando di Lasso), Matona mia cara (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n24
  cau: Thomas Weelkes, As Vesta was from Latmos hill descending, madrigal Anh (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n25
  cau: John Dowland, Flow, my tears (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n26
  cau: Tomás Luis de Victoria, O magnum mysterium (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n27
  cau: 'Cách nghe: chọn một bè (thường là bè cao nhất) và cố bám theo, rồi thử chuyển sang bè khác. Ở Tallis Spem in alium, hãy nghe âm thanh "lan" qua các nhóm hát như sóng.'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/trung-co
  id: n1
  cau: Thời Trung cổ (khoảng 500–1400)
  loai: nam
- trang: lich-su/thoi-ky/trung-co
  id: n2
  cau: Ở châu Âu thời Trung cổ, nhà thờ và các triều đình quý tộc để lại dấu ấn lớn trong âm nhạc.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n3
  cau: Một phần lớn âm nhạc còn lại đến ngày nay là nhạc phụng vụ, hát trong thờ phụng.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n4
  cau: Bên ngoài nhà thờ có âm nhạc thế tục của các nhà thơ – nhạc sĩ hát rong (troubadour ở vùng Provence miền Nam nước Pháp, trouvère ở miền Bắc, Minnesinger ở Đức).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n5
  cau: 'Đây cũng là thời ký âm ra đời: từ những dấu hiệu gợi nhớ hướng đi của giai điệu (neume) ...'
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n6
  cau: đến khuông nhạc bốn dòng, thường được ghi công cho Guido d'Arezzo (thế kỷ 11).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n7
  cau: Ông cũng đặt ra các âm tiết ut – re – mi… để dạy hát, tiền thân của Đô Rê Mi.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n8
  cau: 'Thánh ca Gregorian: một bè giai điệu (đơn âm), hát không đệm, tiếng Latin, nhịp tự do theo lời.'
  loai: dinh-nghia
- trang: lich-su/thoi-ky/trung-co
  id: n9
  cau: Dùng các điệu thức nhà thờ.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n10
  cau: 'Từ khoảng thế kỷ 9 trở đi, người ta thêm bè thứ hai (organum), rồi ba, bốn bè: phức điệu ra đời.'
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n11
  cau: Trường phái Notre-Dame ở Paris (Léonin, Pérotin), khoảng cuối thế kỷ 12 đến đầu thế kỷ 13, để lại những bộ organum hai bè (Léonin) và bốn bè (Pérotin).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n12
  cau: 'Thế kỷ 14 (Ars nova): ký âm tiết tấu tinh vi hơn, nhạc thế tục phát triển; Machaut viết một trong những bản thánh lễ đa âm hoàn chỉnh đầu tiên của một tác giả.'
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n13
  cau: 'Một giai điệu viết theo kiểu thánh ca: một bè, không nhịp đều, điệu thức Dorian, giai điệu đi chủ yếu từng bước.'
  loai: cau-truc
- trang: lich-su/thoi-ky/trung-co
  id: n14
  cau: Giọng hát là chính. Nhạc cụ thời đó có đàn lute, đàn vielle, kèn shawm và đàn organ.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n15
  cau: Đàn vielle là tên gọi thời Trung cổ của nhiều nhạc cụ, như fiddle và hurdy-gurdy.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/trung-co
  id: n16
  cau: Kèn shawm là tiền thân của oboe.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n17
  cau: Đàn organ gắn với nhà thờ từ thế kỷ 10.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n18
  cau: 'Thánh ca Gregorian: Kyrie hoặc Alleluia từ một bản thu của dàn hợp xướng tu viện (tác phẩm 1).'
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n19
  cau: Hildegard von Bingen, O vis aeternitatis (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n20
  cau: Hildegard von Bingen, Ordo Virtutum, trích đoạn (tác phẩm 3).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n21
  cau: Pérotin, Viderunt omnes, organum bốn bè (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n22
  cau: Léonin, Magnus liber organi, các bản organum hai bè, để so sánh với Pérotin (tác phẩm 5).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n23
  cau: Sumer is icumen in, canon tiếng Anh, thế kỷ 13 (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n24
  cau: Bernart de Ventadorn, một ca khúc troubadour (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n25
  cau: Guillaume de Machaut, Messe de Nostre Dame (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n26
  cau: Machaut, Ma fin est mon commencement (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n27
  cau: Llibre Vermell de Montserrat, bản chép tay các bài ca sùng đạo, khoảng năm 1399 (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n28
  cau: 'Cách nghe: nhạc Trung cổ không có "giai điệu bắt tai" theo nghĩa hiện đại. Hãy nghe như nghe không gian: tiếng vang của nhà thờ đá, sự hòa quyện của các bè chạy song song.'
  loai: khuyen-tap
- trang: lich-su/index
  id: n1
  cau: '"Nhạc cổ điển" theo nghĩa rộng là truyền thống âm nhạc nghệ thuật phương Tây kéo dài hơn một nghìn năm.'
  loai: lich-su
- trang: lich-su/index
  id: n2
  cau: Theo nghĩa hẹp, thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven thời trẻ.
  loai: nam
- trang: lich-su/index
  id: n3
  cau: Các mốc năm dưới đây là quy ước gần đúng; phong cách thay đổi dần dần chứ không đổi trong một đêm.
  loai: lich-su
- trang: lich-su/index
  id: n6
  cau: Trung cổ | ~500–1400 | Thánh ca nhà thờ, từ một bè đến những bản nhiều bè đầu tiên
  loai: nam
- trang: lich-su/index
  id: n7
  cau: Phục hưng | ~1400–1600 | Nhiều bè đan xen hài hòa, chủ yếu cho giọng hát
  loai: nam
- trang: lich-su/index
  id: n8
  cau: Baroque | ~1600–1750 | Nhiều trang trí, tương phản, bè trầm liên tục, ra đời opera
  loai: nam
- trang: lich-su/index
  id: n9
  cau: Cổ điển | ~1750–1820 | Rõ ràng, cân đối, hình thức sonata, giao hưởng
  loai: nam
- trang: lich-su/index
  id: n10
  cau: Lãng mạn | ~1820–1900 | Cảm xúc cá nhân, dàn nhạc lớn, nghệ sĩ bậc thầy
  loai: nam
- trang: lich-su/index
  id: n11
  cau: 'Thế kỷ 20 | ~1900–2000 | Phá vỡ quy tắc: ấn tượng, vô điệu tính, tối giản'
  loai: nam
- trang: lich-su/index
  id: n12
  cau: Đương đại | 2000–nay | Đa dạng phong cách, nhiều nhà soạn nhạc vẫn đang sáng tác
  loai: nam
- trang: lich-su/index
  id: n13
  cau: Một phần lớn âm nhạc còn lại từ thời này là nhạc nhà thờ.
  loai: lich-su
- trang: lich-su/index
  id: n14
  cau: Thánh ca Gregorian chỉ có một bè giai điệu, hát không đệm, nhịp tự do theo lời.
  loai: dinh-nghia
- trang: lich-su/index
  id: n15
  cau: Dần dần người ta thêm bè thứ hai, thứ ba, mở đầu cho phức điệu (polyphony).
  loai: lich-su
- trang: lich-su/index
  id: n16
  cau: Hệ thống ký hiệu khuông nhạc cũng hình thành trong giai đoạn này.
  loai: lich-su
- trang: lich-su/index
  id: n17
  cau: 'Tên tuổi Trung cổ: Hildegard von Bingen, Léonin và Pérotin (trường phái Notre-Dame), Guillaume de Machaut.'
  loai: ten
- trang: lich-su/index
  id: n18
  cau: 'Nghe thử (Trung cổ): một bản thánh ca Gregorian bất kỳ; Hildegard O vis aeternitatis; Machaut Messe de Nostre Dame.'
  loai: ten
- trang: lich-su/index
  id: n19
  cau: Các bè giọng hát đan xen và bắt chước nhau; quãng ba và hợp âm ba được dùng ngày càng nhiều.
  loai: lich-su
- trang: lich-su/index
  id: n20
  cau: Bên cạnh nhạc nhà thờ (thánh lễ, motet) còn có nhạc thế tục như madrigal. In ấn giúp bản nhạc lan rộng.
  loai: lich-su
- trang: lich-su/index
  id: n21
  cau: 'Tên tuổi Phục hưng: Josquin des Prez, Giovanni Pierluigi da Palestrina, Thomas Tallis, William Byrd.'
  loai: ten
- trang: lich-su/index
  id: n22
  cau: 'Nghe thử (Phục hưng): Palestrina Missa Papae Marcelli; Tallis Spem in alium (40 bè); Josquin Ave Maria… virgo serena.'
  loai: ten
- trang: lich-su/index
  id: n23
  cau: Đặc trưng là bè trầm liên tục (basso continuo), giai điệu nhiều trang trí, sự tương phản giữa nhóm nhỏ và cả dàn nhạc.
  loai: lich-su
- trang: lich-su/index
  id: n24
  cau: Opera ra đời (Monteverdi L'Orfeo, 1607).
  loai: nam
- trang: lich-su/index
  id: n25
  cau: Các thể loại concerto, fugue, tổ khúc (suite) phát triển mạnh.
  loai: lich-su
- trang: lich-su/index
  id: n26
  cau: Giai đoạn này thường được coi là kết thúc năm 1750, năm Bach mất.
  loai: nam
- trang: lich-su/index
  id: n27
  cau: 'Tên tuổi Baroque: Monteverdi, Purcell, Vivaldi, Bach, Handel.'
  loai: ten
- trang: lich-su/index
  id: n28
  cau: 'Nghe thử (Baroque): Vivaldi Bốn Mùa; Bach Brandenburg Concerto số 3; Handel Messiah (Hallelujah); Bach Toccata và Fugue cung Rê thứ.'
  loai: ten
- trang: lich-su/index
  id: n29
  cau: Âm nhạc cân đối, có giai điệu chính được đệm bên dưới.
  loai: lich-su
- trang: lich-su/index
  id: n30
  cau: Hình thức sonata trở thành khung xương của giao hưởng, concerto, sonata và tứ tấu đàn dây.
  loai: lich-su
- trang: lich-su/index
  id: n31
  cau: Đàn piano dần thay thế đàn harpsichord.
  loai: lich-su
- trang: lich-su/index
  id: n32
  cau: Trung tâm là Vienna.
  loai: lich-su
- trang: lich-su/index
  id: n33
  cau: 'Tên tuổi Cổ điển: Joseph Haydn, Wolfgang Amadeus Mozart, Ludwig van Beethoven (giai đoạn đầu và giữa).'
  loai: ten
- trang: lich-su/index
  id: n34
  cau: 'Nghe thử (Cổ điển): Haydn Giao hưởng số 94 Surprise; Mozart Eine kleine Nachtmusik, Giao hưởng số 40, opera Cây sáo thần; Beethoven Sonata piano Pathétique.'
  loai: ten
- trang: lich-su/index
  id: n35
  cau: 'Lãng mạn: âm nhạc là tiếng nói của cảm xúc cá nhân, thiên nhiên, truyện kể và bản sắc dân tộc; dàn nhạc lớn hơn, hòa âm nhiều màu sắc hơn.'
  loai: lich-su
- trang: lich-su/index
  id: n36
  cau: Thời của các nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt.
  loai: lich-su
- trang: lich-su/index
  id: n37
  cau: Beethoven mất năm 1827, nên những năm cuối đời của ông rơi vào thời kỳ này theo mốc năm ở trên.
  loai: nam
- trang: lich-su/index
  id: n38
  cau: 'Tên tuổi Lãng mạn: Schubert, Chopin, Robert và Clara Schumann, Liszt, Wagner, Verdi, Brahms, Tchaikovsky, Dvořák, Mahler.'
  loai: ten
- trang: lich-su/index
  id: n39
  cau: 'Nghe thử (Lãng mạn): Schubert Ständchen; Chopin Ballade số 1; Tchaikovsky Hồ thiên nga; Dvořák Giao hưởng số 9 Từ Thế giới mới; Brahms Giao hưởng số 4.'
  loai: ten
- trang: lich-su/index
  id: n40
  cau: 'Thế kỷ 20: không còn một phong cách chung.'
  loai: lich-su
- trang: lich-su/index
  id: n41
  cau: Chủ nghĩa ấn tượng (Debussy) gợi tâm trạng và cảm xúc mà đề tài khơi lên hơn là miêu tả chi tiết.
  loai: lich-su
- trang: lich-su/index
  id: n42
  cau: Stravinsky gây chấn động với Le Sacre du printemps (1913).
  loai: nam
- trang: lich-su/index
  id: n43
  cau: Schoenberg phát triển nhạc 12 âm, bỏ hẳn cảm giác giọng chủ.
  loai: lich-su
- trang: lich-su/index
  id: n44
  cau: Bartók đưa dân ca Đông Âu vào nhạc nghệ thuật.
  loai: lich-su
- trang: lich-su/index
  id: n45
  cau: Cuối thế kỷ, chủ nghĩa tối giản (minimalism) dùng những mẫu ngắn lặp lại.
  loai: lich-su
- trang: lich-su/index
  id: n46
  cau: 'Tên tuổi Thế kỷ 20: Debussy, Ravel, Stravinsky, Schoenberg, Bartók, Prokofiev, Shostakovich, Messiaen, Copland, Steve Reich, Philip Glass.'
  loai: ten
- trang: lich-su/index
  id: n47
  cau: 'Nghe thử (Thế kỷ 20): Debussy Prélude à l''après-midi d''un faune; Ravel Boléro; Stravinsky Le Sacre du printemps; Shostakovich Giao hưởng số 5; Reich Music for 18 Musicians.'
  loai: ten
- trang: lich-su/index
  id: n49
  cau: 'Craig Wright, Listening to Music: giáo trình nhập môn, xếp theo thứ tự thời gian, có hướng dẫn nghe.'
  loai: lich-su
- trang: lich-su/index
  id: n50
  cau: 'Burkholder, Grout, Palisca, A History of Western Music: giáo trình lịch sử âm nhạc phương Tây.'
  loai: lich-su
- trang: lich-su/index
  id: n51
  cau: 'Alex Ross, The Rest Is Noise: lịch sử âm nhạc thế kỷ 20.'
  loai: lich-su
