- trang: lich-su/thoi-ky/co-dien
  id: n31
  cau: Haydn, Giao hưởng số 94, chương 2 (link [nghe-nhac/haydn-94](/opus/nghe-nhac/haydn-94/)).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n32
  cau: Haydn, Tứ tấu đàn dây Op. 76 số 3 "Hoàng đế", chương 2.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n33
  cau: Mozart, Eine kleine Nachtmusik, K. 525.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n34
  cau: Mozart, Giao hưởng số 40, chương 1 (link [nghe-nhac/mozart-40](/opus/nghe-nhac/mozart-40/)).
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n35
  cau: Mozart, Concerto piano số 21, K. 467, chương 2.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n38
  cau: Beethoven, Sonata piano Pathétique, Op. 13.
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n39
  cau: Danh sách "10 tác phẩm để nghe" gồm đủ 10 mục.
  loai: danh-muc
- trang: lich-su/thoi-ky/co-dien
  id: n44
  cau: "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Taruskin, The Oxford History of Western Music."
  loai: ten
- trang: lich-su/thoi-ky/co-dien
  id: n40
  cau: "Cách nghe: đếm ô nhịp theo nhóm 4; câu nhạc Cổ điển thường chia đôi khá đều, cảm giác hỏi – đáp ở cuối mỗi cặp câu."
  loai: khuyen-tap
- trang: lich-su/thoi-ky/lang-man
  id: n1
  cau: Thời Lãng mạn khoảng 1820–1900 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/lang-man
  id: n2
  cau: "Mô tả (description): từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên, chủ nghĩa dân tộc; piano mạnh hơn, dàn nhạc phình to, nghệ sĩ bậc thầy."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n3
  cau: Từ đầu thế kỷ 19, âm nhạc nhấn vào cảm xúc cá nhân, thiên nhiên, cái huyền bí siêu nhiên và chủ nghĩa dân tộc.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n4
  cau: Âm nhạc được xem là nghệ thuật thích hợp nhất để biểu đạt cảm xúc; nhạc sĩ muốn bày tỏ thế giới nội tâm của mình.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n5
  cau: Công nghiệp hóa giúp chế tạo piano mạnh hơn và hàng loạt hơn, đưa đàn vào nhiều gia đình trung lưu.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n6
  cau: Nhạc sĩ viết nhiều cho hòa nhạc công cộng và liên hoan.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n7
  cau: Thời của những nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt, được hâm mộ như ngôi sao.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n8
  cau: Beethoven giai đoạn cuối (Giao hưởng số 9, các tứ tấu cuối) là cây cầu dẫn vào thời kỳ này.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n9
  cau: "Cảm xúc đặt lên hàng đầu: biểu cảm quan trọng hơn khuôn khổ hình thức."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n10
  cau: Giai điệu dài, hát, đầy cảm xúc (đặc trưng cũ).
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n11
  cau: "Hòa âm giàu màu sắc: dùng nhiều hợp âm nửa cung (chromatic) để biểu đạt cảm xúc."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n12
  cau: "Ví dụ về hòa âm nửa cung: Tristan und Isolde của Wagner."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n14
  cau: Rubato nghĩa là co giãn tốc độ để diễn cảm.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/lang-man
  id: n15
  cau: Diễn tấu tự do bằng rubato là một đặc trưng của lối chơi Lãng mạn.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n16
  cau: "Quy mô co giãn: từ tiểu phẩm một chương cho piano và ca khúc đến tác phẩm cỡ lớn (Giao hưởng số 8 của Mahler, opera của Wagner)."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n17
  cau: "Âm nhạc chương trình: kể chuyện hoặc vẽ cảnh theo một nội dung ngoài âm nhạc (Berlioz, Giao hưởng kỳ ảo; thơ giao hưởng của Liszt)."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/lang-man
  id: n18
  cau: "Bản sắc dân tộc: dân ca, điệu nhảy dân gian hay nét nhạc dân tộc của Ba Lan (Chopin), Séc (Dvořák, Smetana), Na Uy (Grieg), Nga (Nhóm Năm người)."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n19
  cau: Tchaikovsky thuộc nhóm nhạc sĩ mang bản sắc dân tộc Nga.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n20
  cau: "Đoạn ví dụ do site viết: tay trái rải rộng, hợp âm bảy giảm, hợp âm mượn, chậm dần trước kết."
  loai: cau-truc
- trang: lich-su/thoi-ky/lang-man
  id: n22
  cau: Piano có khung gang, âm thanh lớn và vang hơn.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n23
  cau: "Dàn nhạc phình to: kèn đồng có van chơi được đủ các nốt của gam nửa cung."
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n24
  cau: Dàn nhạc thêm tuba, cor anglais, harp, nhiều nhạc cụ gõ.
  loai: danh-muc
- trang: lich-su/thoi-ky/lang-man
  id: n25
  cau: Berlioz mở rộng mạnh các bộ kèn gỗ, kèn đồng và nhạc cụ gõ.
  loai: lich-su
- trang: lich-su/thoi-ky/lang-man
  id: n26
  cau: "Thể loại chính: ca khúc nghệ thuật (Lied), tiểu phẩm piano (nocturne, ballade, étude, mazurka, valse), giao hưởng và thơ giao hưởng, concerto, opera (Verdi, Wagner, Puccini), ballet (Tchaikovsky)."
  loai: danh-muc
- trang: lich-su/thoi-ky/lang-man
  id: n27
  cau: Schubert, Erlkönig.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n28
  cau: Schubert, Ngũ tấu Con cá hồi.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n29
  cau: Berlioz, Giao hưởng kỳ ảo, chương 4 "Hành khúc đến đoạn đầu đài".
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n30
  cau: Chopin, Nocturne Op. 9 số 2.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n31
  cau: Mendelssohn, Concerto violin cung Mi thứ.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n32
  cau: Verdi, La traviata, Brindisi.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n33
  cau: Wagner, Tristan und Isolde, Khúc dạo đầu.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n34
  cau: Brahms, Giao hưởng số 4, chương 4.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n35
  cau: Tchaikovsky, Hồ thiên nga.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n36
  cau: Dvořák, Giao hưởng số 9, chương 2.
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n40
  cau: "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Taruskin, The Oxford History of Western Music."
  loai: ten
- trang: lich-su/thoi-ky/lang-man
  id: n38
  cau: "Cách nghe: để ý những khoảnh khắc nhạc chậm lại hoặc dồn lên mà không có chỉ dẫn trên bản nhạc, đó có thể là rubato; so sánh hai bản thu của cùng một nocturne Chopin."
  loai: khuyen-tap
- trang: lich-su/thoi-ky/phuc-hung
  id: n1
  cau: Thời Phục hưng (khoảng 1400–1600)
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n2
  cau: Âm nhạc vẫn gắn với nhà thờ, nhưng nhạc thế tục cũng phát triển (madrigal, chanson, nhạc khiêu vũ).
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n3
  cau: "Máy in nhạc ra đời: năm 1501, Ottaviano Petrucci, người làm việc ở Venice, in tuyển tập nhạc đa âm đầu tiên bằng chữ in rời."
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n4
  cau: Việc xuất bản nhạc in là một nét mới của thời kỳ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n5
  cau: Từ thế kỷ 16 (Luther, từ năm 1517), cuộc Cải cách Tin lành và Phản Cải cách của Công giáo ảnh hưởng mạnh đến âm nhạc nhà thờ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n6
  cau: Luther khuyến khích giáo dân cùng hát thánh ca bằng tiếng mẹ đẻ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n7
  cau: Công đồng Trent (1545–1563) đòi hỏi lời hát phải nghe rõ.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n8
  cau: "Phức điệu mô phỏng: các bè lần lượt bắt chước nhau."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n9
  cau: "Hòa âm: quãng ba và hợp âm ba được dùng ngày càng nhiều."
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n10
  cau: "Nhà soạn nhạc vẽ chữ (word painting): giai điệu đi lên ở lời nói về sự thăng thiên, những nốt nhanh ở lời nói về chạy."
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n11
  cau: Câu "Vẫn chủ yếu dùng điệu thức, nhưng đã nghe ra cảm giác trưởng – thứ ngày càng rõ".
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n12
  cau: "Hai bè độc lập, chỉ dùng quãng thuận, bắt đầu và kết bằng quãng đúng: một ví dụ đối âm loại 1 theo kiểu của Fux để thấy các bè đi độc lập mà vẫn hòa hợp."
  loai: quy-tac
- trang: lich-su/thoi-ky/phuc-hung
  id: n13
  cau: "Thánh lễ (mass) và motet: nhạc nhà thờ đa âm."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n14
  cau: "Madrigal: ca khúc thế tục nhiều bè, gốc Ý, có cả madrigal Anh; lời thường tình ái, châm biếm hay ngụ ngôn."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/phuc-hung
  id: n15
  cau: Chanson (Pháp).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n16
  cau: Nhạc khí cho đàn lute; các điệu nhảy như pavane, galliard.
  loai: lich-su
- trang: lich-su/thoi-ky/phuc-hung
  id: n17
  cau: Guillaume Du Fay, Nuper rosarum flores, motet, công diễn lần đầu ngày 25/3/1436 tại nhà thờ chính tòa Santa Maria del Fiore, Florence (tác phẩm 1).
  loai: nam
- trang: lich-su/thoi-ky/phuc-hung
  id: n18
  cau: Josquin des Prez, Ave Maria… virgo serena (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n19
  cau: Josquin, Mille regretz (tác phẩm 3).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n20
  cau: Palestrina, Missa Papae Marcelli (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n21
  cau: Thomas Tallis, Spem in alium, 40 bè (tác phẩm 5).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n22
  cau: William Byrd, Ave verum corpus (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n23
  cau: Orlande de Lassus (Orlando di Lasso), Matona mia cara (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n24
  cau: Thomas Weelkes, As Vesta was from Latmos hill descending, madrigal Anh (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n25
  cau: John Dowland, Flow, my tears (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n26
  cau: Tomás Luis de Victoria, O magnum mysterium (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/phuc-hung
  id: n27
  cau: 'Cách nghe: chọn một bè (thường là bè cao nhất) và cố bám theo, rồi thử chuyển sang bè khác. Ở Tallis Spem in alium, hãy nghe âm thanh "lan" qua các nhóm hát như sóng.'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/the-ky-20
  id: n1
  cau: Thế kỷ 20 khoảng 1900–2000 (tiêu đề).
  loai: nam
- trang: lich-su/thoi-ky/the-ky-20
  id: n2
  cau: "Mô tả (description): hai cuộc chiến tranh thế giới, những biến động chính trị lớn, công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc, và nhiều hướng sáng tác khác nhau."
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n3
  cau: Hai cuộc chiến tranh thế giới và những biến động chính trị lớn tác động tới âm nhạc thế kỷ 20.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n4
  cau: Công nghệ ghi âm (máy hát, đĩa, radio, phim ảnh) thay đổi cách con người nghe nhạc.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n5
  cau: Lần đầu tiên một buổi biểu diễn có thể được ghi lại và nghe lại.
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n6
  cau: 'Không còn một "ngữ pháp" chung: các nhà soạn nhạc đi nhiều hướng khác nhau.'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n7
  cau: Nhiều nhạc sĩ phải rời bỏ quê hương (Stravinsky, Rachmaninoff, Schoenberg, Bartók).
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n8
  cau: 'Ở Liên Xô, âm nhạc chịu sự kiểm soát chính trị: Shostakovich và Prokofiev đều bị lên án là "chủ nghĩa hình thức".'
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n9
  cau: "Ấn tượng: hòa âm mơ hồ về giọng, hợp âm trượt song song, điệu thức, gam toàn cung và gam ngũ cung."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n10
  cau: Ấn tượng gắn với "màu sắc âm thanh".
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n11
  cau: "Ấn tượng: Debussy, Ravel."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n12
  cau: "Nguyên thủy, tiết tấu: tiết tấu dồn dập, trọng âm bất thường, nghịch tai mạnh."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n13
  cau: "Nguyên thủy, tiết tấu: Stravinsky, Le Sacre du printemps."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n14
  cau: "Vô điệu tính, 12 âm: không dựa vào giọng chủ; 12 nốt có vai trò gần như ngang nhau."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n15
  cau: 'Vô điệu tính, 12 âm: Schoenberg, Berg, Webern ("trường phái Vienna thứ hai").'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n16
  cau: "Tân cổ điển: trở lại trật tự, sự cân đối và rõ ràng của nhạc thế kỷ 18, với hòa âm tonal được cập nhật."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n17
  cau: "Tân cổ điển: Stravinsky, Pulcinella; Prokofiev, Giao hưởng số 1."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n18
  cau: "Dân tộc: dựa vào nhạc dân gian của dân tộc mình; có người thu thập và ghi âm dân ca thật."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n19
  cau: "Dân tộc: Bartók, Kodály, Janáček, Villa-Lobos."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n20
  cau: "Nhạc Mỹ: ảnh hưởng jazz, nhạc dân gian Mỹ, nhạc kịch; Gershwin, Copland, Bernstein."
  loai: lich-su
- trang: lich-su/thoi-ky/the-ky-20
  id: n21
  cau: "Tiên phong sau 1945: nhạc chuỗi toàn phần, nhạc điện tử, nhạc ngẫu nhiên."
  loai: danh-muc
- trang: lich-su/thoi-ky/the-ky-20
  id: n22
  cau: "Tiên phong sau 1945: Messiaen, Boulez, Stockhausen, Cage, Ligeti."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n23
  cau: "Tối giản: mẫu ngắn lặp lại, biến đổi rất chậm."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/the-ky-20
  id: n24
  cau: 'Tối giản: Reich, Glass, Riley; "tối giản thần thánh" của Pärt, Górecki.'
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n25
  cau: "Đoạn ví dụ Ấn tượng do site viết: hợp âm trượt song song trên một nốt trầm giữ suốt."
  loai: cau-truc
- trang: lich-su/thoi-ky/the-ky-20
  id: n27
  cau: "Đoạn ví dụ Tối giản do site viết: một mẫu ngắn lặp lại, thay đổi từng nốt một."
  loai: cau-truc
- trang: lich-su/thoi-ky/the-ky-20
  id: n28
  cau: Debussy, Clair de lune, rồi Prélude à l'après-midi d'un faune (link [piano/tac-pham/debussy-clair-de-lune](/opus/piano/tac-pham/debussy-clair-de-lune/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n29
  cau: Ravel, Boléro (link [nghe-nhac/ravel-bolero](/opus/nghe-nhac/ravel-bolero/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n30
  cau: Stravinsky, Le Sacre du printemps (link [nghe-nhac/stravinsky-sacre](/opus/nghe-nhac/stravinsky-sacre/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n31
  cau: Schoenberg, Verklärte Nacht (trước khi ông bỏ hẳn điệu tính), rồi Pierrot lunaire.
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n32
  cau: Bartók, Concerto cho dàn nhạc.
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n33
  cau: Gershwin, Rhapsody in Blue.
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n34
  cau: Prokofiev, Peter và chó sói (xem [Dàn nhạc giao hưởng](/opus/nhac-cu/dan-nhac/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n35
  cau: Shostakovich, Giao hưởng số 5 (link [nghe-nhac/shostakovich-5](/opus/nghe-nhac/shostakovich-5/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n36
  cau: Messiaen, Quatuor pour la fin du temps, chương 5 (viết trong trại tù binh năm 1940–1941).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n37
  cau: Reich, Music for 18 Musicians; Pärt, Spiegel im Spiegel (link [nghe-nhac/part-spiegel](/opus/nghe-nhac/part-spiegel/)).
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n38
  cau: Danh sách "10 tác phẩm để nghe" gồm đủ 10 mục.
  loai: danh-muc
- trang: lich-su/thoi-ky/the-ky-20
  id: n43
  cau: "Sách đọc thêm: Burkholder, Grout, Palisca, A History of Western Music; Taruskin, The Oxford History of Western Music."
  loai: ten
- trang: lich-su/thoi-ky/the-ky-20
  id: n39
  cau: 'Cách nghe: đừng chờ "giai điệu đẹp" kiểu thế kỷ 19; hỏi nhà soạn nhạc chú ý điều gì: màu sắc (Debussy), tiết tấu (Stravinsky), cấu trúc (Webern), thời gian và sự lặp lại (Reich).'
  loai: khuyen-tap
- trang: lich-su/thoi-ky/trung-co
  id: n1
  cau: Thời Trung cổ (khoảng 500–1400)
  loai: nam
- trang: lich-su/thoi-ky/trung-co
  id: n2
  cau: Ở châu Âu thời Trung cổ, nhà thờ và các triều đình quý tộc để lại dấu ấn lớn trong âm nhạc.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n3
  cau: Một phần lớn âm nhạc còn lại đến ngày nay là nhạc phụng vụ, hát trong thờ phụng.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n4
  cau: Bên ngoài nhà thờ có âm nhạc thế tục của các nhà thơ – nhạc sĩ hát rong (troubadour ở vùng Provence miền Nam nước Pháp, trouvère ở miền Bắc, Minnesinger ở Đức).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n5
  cau: "Đây cũng là thời ký âm ra đời: từ những dấu hiệu gợi nhớ hướng đi của giai điệu (neume) ..."
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n6
  cau: đến khuông nhạc bốn dòng, thường được ghi công cho Guido d'Arezzo (thế kỷ 11).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n7
  cau: Ông cũng đặt ra các âm tiết ut – re – mi… để dạy hát, tiền thân của Đô Rê Mi.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n8
  cau: "Thánh ca Gregorian: một bè giai điệu (đơn âm), hát không đệm, tiếng Latin, nhịp tự do theo lời."
  loai: dinh-nghia
- trang: lich-su/thoi-ky/trung-co
  id: n9
  cau: Dùng các điệu thức nhà thờ.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n10
  cau: "Từ khoảng thế kỷ 9 trở đi, người ta thêm bè thứ hai (organum), rồi ba, bốn bè: phức điệu ra đời."
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n11
  cau: Trường phái Notre-Dame ở Paris (Léonin, Pérotin), khoảng cuối thế kỷ 12 đến đầu thế kỷ 13, để lại những bộ organum hai bè (Léonin) và bốn bè (Pérotin).
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n12
  cau: "Thế kỷ 14 (Ars nova): ký âm tiết tấu tinh vi hơn, nhạc thế tục phát triển; Machaut viết một trong những bản thánh lễ đa âm hoàn chỉnh đầu tiên của một tác giả."
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n13
  cau: "Một giai điệu viết theo kiểu thánh ca: một bè, không nhịp đều, điệu thức Dorian, giai điệu đi chủ yếu từng bước."
  loai: cau-truc
- trang: lich-su/thoi-ky/trung-co
  id: n14
  cau: Giọng hát là chính. Nhạc cụ thời đó có đàn lute, đàn vielle, kèn shawm và đàn organ.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n15
  cau: Đàn vielle là tên gọi thời Trung cổ của nhiều nhạc cụ, như fiddle và hurdy-gurdy.
  loai: dinh-nghia
- trang: lich-su/thoi-ky/trung-co
  id: n16
  cau: Kèn shawm là tiền thân của oboe.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n17
  cau: Đàn organ gắn với nhà thờ từ thế kỷ 10.
  loai: lich-su
- trang: lich-su/thoi-ky/trung-co
  id: n18
  cau: "Thánh ca Gregorian: Kyrie hoặc Alleluia từ một bản thu của dàn hợp xướng tu viện (tác phẩm 1)."
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n19
  cau: Hildegard von Bingen, O vis aeternitatis (tác phẩm 2).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n20
  cau: Hildegard von Bingen, Ordo Virtutum, trích đoạn (tác phẩm 3).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n21
  cau: Pérotin, Viderunt omnes, organum bốn bè (tác phẩm 4).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n22
  cau: Léonin, Magnus liber organi, các bản organum hai bè, để so sánh với Pérotin (tác phẩm 5).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n23
  cau: Sumer is icumen in, canon tiếng Anh, thế kỷ 13 (tác phẩm 6).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n24
  cau: Bernart de Ventadorn, một ca khúc troubadour (tác phẩm 7).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n25
  cau: Guillaume de Machaut, Messe de Nostre Dame (tác phẩm 8).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n26
  cau: Machaut, Ma fin est mon commencement (tác phẩm 9).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n27
  cau: Llibre Vermell de Montserrat, bản chép tay các bài ca sùng đạo, khoảng năm 1399 (tác phẩm 10).
  loai: ten
- trang: lich-su/thoi-ky/trung-co
  id: n28
  cau: 'Cách nghe: nhạc Trung cổ không có "giai điệu bắt tai" theo nghĩa hiện đại. Hãy nghe như nghe không gian: tiếng vang của nhà thờ đá, sự hòa quyện của các bè chạy song song.'
  loai: khuyen-tap
- trang: lich-su/index
  id: n1
  cau: '"Nhạc cổ điển" theo nghĩa rộng là truyền thống âm nhạc nghệ thuật phương Tây kéo dài hơn một nghìn năm.'
  loai: lich-su
- trang: lich-su/index
  id: n2
  cau: Theo nghĩa hẹp, thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven thời trẻ.
  loai: nam
- trang: lich-su/index
  id: n3
  cau: Các mốc năm dưới đây là quy ước gần đúng; phong cách thay đổi dần dần chứ không đổi trong một đêm.
  loai: lich-su
- trang: lich-su/index
  id: n6
  cau: Trung cổ | ~500–1400 | Thánh ca nhà thờ, từ một bè đến những bản nhiều bè đầu tiên
  loai: nam
- trang: lich-su/index
  id: n7
  cau: Phục hưng | ~1400–1600 | Nhiều bè đan xen hài hòa, chủ yếu cho giọng hát
  loai: nam
- trang: lich-su/index
  id: n8
  cau: Baroque | ~1600–1750 | Nhiều trang trí, tương phản, bè trầm liên tục, ra đời opera
  loai: nam
- trang: lich-su/index
  id: n9
  cau: Cổ điển | ~1750–1820 | Rõ ràng, cân đối, hình thức sonata, giao hưởng
  loai: nam
- trang: lich-su/index
  id: n10
  cau: Lãng mạn | ~1820–1900 | Cảm xúc cá nhân, dàn nhạc lớn, nghệ sĩ bậc thầy
  loai: nam
- trang: lich-su/index
  id: n11
  cau: "Thế kỷ 20 | ~1900–2000 | Phá vỡ quy tắc: ấn tượng, vô điệu tính, tối giản"
  loai: nam
- trang: lich-su/index
  id: n12
  cau: Đương đại | 2000–nay | Đa dạng phong cách, nhiều nhà soạn nhạc vẫn đang sáng tác
  loai: nam
- trang: lich-su/index
  id: n13
  cau: Một phần lớn âm nhạc còn lại từ thời này là nhạc nhà thờ.
  loai: lich-su
- trang: lich-su/index
  id: n14
  cau: Thánh ca Gregorian chỉ có một bè giai điệu, hát không đệm, nhịp tự do theo lời.
  loai: dinh-nghia
- trang: lich-su/index
  id: n15
  cau: Dần dần người ta thêm bè thứ hai, thứ ba, mở đầu cho phức điệu (polyphony).
  loai: lich-su
- trang: lich-su/index
  id: n16
  cau: Hệ thống ký hiệu khuông nhạc cũng hình thành trong giai đoạn này.
  loai: lich-su
- trang: lich-su/index
  id: n17
  cau: "Tên tuổi Trung cổ: Hildegard von Bingen, Léonin và Pérotin (trường phái Notre-Dame), Guillaume de Machaut."
  loai: ten
- trang: lich-su/index
  id: n18
  cau: "Nghe thử (Trung cổ): một bản thánh ca Gregorian bất kỳ; Hildegard O vis aeternitatis; Machaut Messe de Nostre Dame."
  loai: ten
- trang: lich-su/index
  id: n19
  cau: Các bè giọng hát đan xen và bắt chước nhau; quãng ba và hợp âm ba được dùng ngày càng nhiều.
  loai: lich-su
- trang: lich-su/index
  id: n20
  cau: Bên cạnh nhạc nhà thờ (thánh lễ, motet) còn có nhạc thế tục như madrigal. In ấn giúp bản nhạc lan rộng.
  loai: lich-su
- trang: lich-su/index
  id: n21
  cau: "Tên tuổi Phục hưng: Josquin des Prez, Giovanni Pierluigi da Palestrina, Thomas Tallis, William Byrd."
  loai: ten
- trang: lich-su/index
  id: n22
  cau: "Nghe thử (Phục hưng): Palestrina Missa Papae Marcelli; Tallis Spem in alium (40 bè); Josquin Ave Maria… virgo serena."
  loai: ten
- trang: lich-su/index
  id: n23
  cau: Đặc trưng là bè trầm liên tục (basso continuo), giai điệu nhiều trang trí, sự tương phản giữa nhóm nhỏ và cả dàn nhạc.
  loai: lich-su
- trang: lich-su/index
  id: n24
  cau: Opera ra đời (Monteverdi L'Orfeo, 1607).
  loai: nam
- trang: lich-su/index
  id: n25
  cau: Các thể loại concerto, fugue, tổ khúc (suite) phát triển mạnh.
  loai: lich-su
- trang: lich-su/index
  id: n26
  cau: Giai đoạn này thường được coi là kết thúc năm 1750, năm Bach mất.
  loai: nam
- trang: lich-su/index
  id: n27
  cau: "Tên tuổi Baroque: Monteverdi, Purcell, Vivaldi, Bach, Handel."
  loai: ten
- trang: lich-su/index
  id: n28
  cau: "Nghe thử (Baroque): Vivaldi Bốn Mùa; Bach Brandenburg Concerto số 3; Handel Messiah (Hallelujah); Bach Toccata và Fugue cung Rê thứ."
  loai: ten
- trang: lich-su/index
  id: n29
  cau: Âm nhạc cân đối, có giai điệu chính được đệm bên dưới.
  loai: lich-su
- trang: lich-su/index
  id: n30
  cau: Hình thức sonata trở thành khung xương của giao hưởng, concerto, sonata và tứ tấu đàn dây.
  loai: lich-su
- trang: lich-su/index
  id: n31
  cau: Đàn piano dần thay thế đàn harpsichord.
  loai: lich-su
- trang: lich-su/index
  id: n32
  cau: Trung tâm là Vienna.
  loai: lich-su
- trang: lich-su/index
  id: n33
  cau: "Tên tuổi Cổ điển: Joseph Haydn, Wolfgang Amadeus Mozart, Ludwig van Beethoven (giai đoạn đầu và giữa)."
  loai: ten
- trang: lich-su/index
  id: n34
  cau: "Nghe thử (Cổ điển): Haydn Giao hưởng số 94 Surprise; Mozart Eine kleine Nachtmusik, Giao hưởng số 40, opera Cây sáo thần; Beethoven Sonata piano Pathétique."
  loai: ten
- trang: lich-su/index
  id: n35
  cau: "Lãng mạn: âm nhạc là tiếng nói của cảm xúc cá nhân, thiên nhiên, truyện kể và bản sắc dân tộc; dàn nhạc lớn hơn, hòa âm nhiều màu sắc hơn."
  loai: lich-su
- trang: lich-su/index
  id: n36
  cau: Thời của các nghệ sĩ bậc thầy (virtuoso) như Paganini và Liszt.
  loai: lich-su
- trang: lich-su/index
  id: n37
  cau: Beethoven mất năm 1827, nên những năm cuối đời của ông rơi vào thời kỳ này theo mốc năm ở trên.
  loai: nam
- trang: lich-su/index
  id: n38
  cau: "Tên tuổi Lãng mạn: Schubert, Chopin, Robert và Clara Schumann, Liszt, Wagner, Verdi, Brahms, Tchaikovsky, Dvořák, Mahler."
  loai: ten
- trang: lich-su/index
  id: n39
  cau: "Nghe thử (Lãng mạn): Schubert Ständchen; Chopin Ballade số 1; Tchaikovsky Hồ thiên nga; Dvořák Giao hưởng số 9 Từ Thế giới mới; Brahms Giao hưởng số 4."
  loai: ten
- trang: lich-su/index
  id: n40
  cau: "Thế kỷ 20: không còn một phong cách chung."
  loai: lich-su
- trang: lich-su/index
  id: n41
  cau: Chủ nghĩa ấn tượng (Debussy) gợi tâm trạng và cảm xúc mà đề tài khơi lên hơn là miêu tả chi tiết.
  loai: lich-su
- trang: lich-su/index
  id: n42
  cau: Stravinsky gây chấn động với Le Sacre du printemps (1913).
  loai: nam
- trang: lich-su/index
  id: n43
  cau: Schoenberg phát triển nhạc 12 âm, bỏ hẳn cảm giác giọng chủ.
  loai: lich-su
- trang: lich-su/index
  id: n44
  cau: Bartók đưa dân ca Đông Âu vào nhạc nghệ thuật.
  loai: lich-su
- trang: lich-su/index
  id: n45
  cau: Cuối thế kỷ, chủ nghĩa tối giản (minimalism) dùng những mẫu ngắn lặp lại.
  loai: lich-su
- trang: lich-su/index
  id: n46
  cau: "Tên tuổi Thế kỷ 20: Debussy, Ravel, Stravinsky, Schoenberg, Bartók, Prokofiev, Shostakovich, Messiaen, Copland, Steve Reich, Philip Glass."
  loai: ten
- trang: lich-su/index
  id: n47
  cau: "Nghe thử (Thế kỷ 20): Debussy Prélude à l'après-midi d'un faune; Ravel Boléro; Stravinsky Le Sacre du printemps; Shostakovich Giao hưởng số 5; Reich Music for 18 Musicians."
  loai: ten
- trang: lich-su/index
  id: n49
  cau: "Craig Wright, Listening to Music: giáo trình nhập môn, xếp theo thứ tự thời gian, có hướng dẫn nghe."
  loai: lich-su
- trang: lich-su/index
  id: n50
  cau: "Burkholder, Grout, Palisca, A History of Western Music: giáo trình lịch sử âm nhạc phương Tây."
  loai: lich-su
- trang: lich-su/index
  id: n51
  cau: "Alex Ross, The Rest Is Noise: lịch sử âm nhạc thế kỷ 20."
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n1
  cau: "Chủ đề và biến tấu: lấy một chủ đề (giai điệu quen thuộc hay do chính nhà soạn nhạc viết), nhắc lại nhiều lần, mỗi lần thay đổi một vài yếu tố; sơ đồ A – A' – A'' – A'''."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n2
  cau: "Biến đổi giai điệu: thêm nốt hoa mỹ, nốt lướt, chuỗi nốt nhanh quanh giai điệu gốc."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n3
  cau: "Biến đổi tiết tấu: chia nhỏ thành móc đơn, liên ba, móc kép; đổi nhịp 2/4 thành 3/4."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n4
  cau: "Biến đổi giọng: chuyển sang giọng thứ cùng tên, như biến tấu 8 của K. 265."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n5
  cau: "Biến đổi tốc độ: một biến tấu chậm (Adagio), như biến tấu 11 của K. 265."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n6
  cau: "Biến đổi hòa âm: giữ giai điệu nhưng thay hợp âm bên dưới."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n7
  cau: "Biến đổi kết cấu: đổi cách đệm; viết theo lối đối âm."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n8
  cau: "Một số bộ biến tấu giữ vòng hợp âm hoặc bè trầm lặp lại: passacaglia và chaconne."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: n9
  cau: Bach, Chaconne cho violin độc tấu là ví dụ chaconne.
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n10
  cau: Bach, Passacaglia và Fugue cung Đô thứ cho organ là ví dụ passacaglia.
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n11
  cau: Chương 4 Giao hưởng số 4 của Brahms là ví dụ (kiểu passacaglia/chaconne).
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n13
  cau: 'Tên tác phẩm: Mozart, 12 biến tấu "Ah, vous dirai-je, maman".'
  loai: ten
- trang: hinh-thuc/bien-tau
  id: n14
  cau: Số danh mục K. 265.
  loai: danh-muc
- trang: hinh-thuc/bien-tau
  id: n15
  cau: Chủ đề là giai điệu dân gian Pháp (nguồn gốc Pháp).
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n16
  cau: Tiếng Anh hát giai điệu này với lời Twinkle, Twinkle, Little Star.
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n18
  cau: Mozart viết bộ biến tấu ở Vienna, khoảng 1781–1782.
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n20
  cau: Tám ô đầu của chủ đề ở Đô trưởng, ghi giản lược (khối abc).
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n21
  cau: "Chủ đề: giai điệu gốc giản dị, tay trái đệm nhẹ."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n22
  cau: "Biến tấu 1: tay phải chơi chuỗi móc kép liên tục quanh giai điệu."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n23
  cau: "Biến tấu 2: chuỗi nốt nhanh chuyển sang tay trái."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n24
  cau: "Biến tấu 3: liên ba ở tay phải."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n25
  cau: "Biến tấu 4: liên ba chuyển sang tay trái."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n26
  cau: 'Biến tấu 5: giai điệu bị "cắt" thành những nốt lệch phách, hai tay hỏi đáp.'
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n27
  cau: "Biến tấu 6: tay trái chạy nốt nhanh dưới những hợp âm của tay phải."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n28
  cau: "Biến tấu 7: chuỗi gam đi lên đi xuống."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n29
  cau: "Biến tấu 8: Đô thứ, giọng thứ duy nhất của cả bộ, nghe tối hơn."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n30
  cau: "Biến tấu 9–10: trở lại Đô trưởng."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n31
  cau: "Biến tấu 11: Adagio, chậm, nhiều trang trí."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n32
  cau: "Biến tấu 12: nhịp 3/4, nhanh, rực rỡ, kết thúc cả bộ."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: n34
  cau: 'Haydn Giao hưởng số 94, chương 2: biến tấu trên một chủ đề có "bất ngờ".'
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n36
  cau: "Schubert Con cá hồi, chương 4: biến tấu trên ca khúc của chính Schubert."
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n38
  cau: "Bach Goldberg Variations: 30 biến tấu trên vòng bè trầm của một aria."
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n39
  cau: "Rachmaninoff Rhapsody on a Theme of Paganini: biến tấu số 18 lật ngược chủ đề của Paganini thành một giai điệu trữ tình nổi tiếng."
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: q1
  cau: "Quiz 1: trong 12 biến tấu K. 265, biến tấu 8 (Đô thứ) ở giọng thứ; chủ đề ở Đô trưởng, chỉ biến tấu 8 đổi sang Đô thứ."
  loai: cau-truc
- trang: hinh-thuc/bien-tau
  id: q2
  cau: "Quiz 2: passacaglia và chaconne giữ lại vòng hợp âm hoặc bè trầm lặp lại; giải thích: giai điệu bên trên thay đổi tự do."
  loai: dinh-nghia
- trang: hinh-thuc/bien-tau
  id: q3
  cau: "Quiz 3: bộ biến tấu K. 265 dựa trên giai điệu Ah, vous dirai-je, maman (Twinkle, Twinkle); giải thích: giai điệu dân gian Pháp."
  loai: lich-su
- trang: hinh-thuc/bien-tau
  id: n33
  cau: "Cách nghe: trước mỗi biến tấu hãy tự hỏi lần này Mozart đổi gì; tìm giai điệu gốc ẩn bên trong; nhận ra ở biến tấu 8 (giọng thứ) và biến tấu 11 (chậm)."
  loai: khuyen-tap
- trang: hinh-thuc/concerto
  id: n1
  cau: Concerto là tác phẩm cho một (hoặc vài) nhạc cụ độc tấu cùng dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n3
  cau: Concerto Baroque, như của Vivaldi, thường dùng hình thức ritornello.
  loai: lich-su
- trang: hinh-thuc/concerto
  id: n4
  cau: Ritornello là tiếng Ý, nghĩa là "lần quay lại nhỏ".
  loai: ten
- trang: hinh-thuc/concerto
  id: n5
  cau: Ritornello do cả dàn nhạc (tutti) chơi, mở đầu và kết thúc chương.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n6
  cau: Ritornello quay lại nhiều lần ở giữa chương, thường ở các giọng khác nhau và có khi chỉ một đoạn ngắn.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n7
  cau: "Xen giữa các ritornello là các đoạn độc tấu: nhạc cụ độc tấu chơi nhanh và điêu luyện hơn."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n8
  cau: "Sơ đồ ritornello: ritornello mở đầu, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng chính."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n9
  cau: Khác với rondo, nơi điệp khúc luôn trở lại ở chủ âm, ritornello quay lại ở giọng khác nhau và thường chỉ là một phần của đoạn gốc.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n10
  cau: "Concerto grosso: một nhóm nhỏ nhạc cụ độc tấu (concertino) đối đáp với cả dàn nhạc (ripieno)."
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n11
  cau: Corelli và Handel đều có tập concerto grosso Op. 6.
  loai: danh-muc
- trang: hinh-thuc/concerto
  id: n13
  cau: Vivaldi, Mùa xuân, chương 1, là một ví dụ rõ về ritornello.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n14
  cau: "Concerto thời Cổ điển thường có 3 chương: nhanh – chậm – nhanh."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n15
  cau: "Chương 1 kết hợp hình thức sonata với ý tưởng ritornello: thường có một phần trình bày của dàn nhạc trước, rồi một phần trình bày của nghệ sĩ độc tấu."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n16
  cau: "Cadenza: gần cuối chương 1, dàn nhạc dừng lại trên một hợp âm, nghệ sĩ độc tấu chơi một mình một đoạn tự do, khoe kỹ thuật và tưởng tượng, rồi dàn nhạc vào lại để kết."
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n17
  cau: Cadenza vốn được ứng tác; từ thời Mozart và Beethoven, nhà soạn nhạc ngày càng viết sẵn.
  loai: lich-su
- trang: hinh-thuc/concerto
  id: n18
  cau: Chương 2 của concerto Cổ điển là chương chậm.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n19
  cau: Chương 3 của concerto Cổ điển nhanh, thường ở hình thức rondo.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n20
  cau: "Mendelssohn, Concerto violin: bỏ phần trình bày riêng của dàn nhạc, cho violin vào gần như ngay lập tức, và nối các chương liền nhau."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n21
  cau: Rachmaninoff mở đầu Concerto số 2 bằng piano độc tấu.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n22
  cau: Thời Lãng mạn, nhà soạn nhạc thay đổi dần khuôn mẫu concerto.
  loai: lich-su
- trang: hinh-thuc/concerto
  id: n23
  cau: "Bảng Nghe thêm: Vivaldi Bốn Mùa: ritornello, âm nhạc miêu tả."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n25
  cau: "Bach, Brandenburg Concerto số 5, chương 1: harpsichord, vốn chỉ đệm, bỗng có một đoạn độc tấu dài như cadenza."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n26
  cau: "Mendelssohn, Concerto violin: cadenza đặt trước tái hiện; các chương nối liền."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n28
  cau: "Rachmaninoff, Concerto piano số 2: mở đầu bằng loạt hợp âm piano ngân như tiếng chuông, dài 8 ô nhịp."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n30
  cau: "Rodrigo, Concierto de Aranjuez, chương 2: guitar và kèn cor anglais đối đáp."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n32
  cau: "Quiz: trong concerto Baroque, ritornello do cả dàn nhạc chơi (tutti); các đoạn xen giữa là độc tấu."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n33
  cau: "Quiz: cadenza là đoạn độc tấu tự do khi dàn nhạc dừng lại; giải thích: vốn được ứng tác, về sau nhà soạn nhạc ngày càng viết sẵn."
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n34
  cau: "Quiz: concerto Cổ điển thường có 3 chương (nhanh – chậm – nhanh)."
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n2
  cau: Khi nghe concerto, hãy để ý cuộc đối đáp, có khi là tranh tài, giữa một người và số đông.
  loai: khuyen-tap
- trang: hinh-thuc/fugue
  id: n1
  cau: "Fugue là hình thức phức điệu: nhiều bè độc lập lần lượt vào bằng cùng một chủ đề, như đuổi theo nhau."
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n2
  cau: Tên gọi fugue có gốc từ tiếng Latin fuga, nghĩa là "chạy trốn".
  loai: ten
- trang: hinh-thuc/fugue
  id: n3
  cau: Fugue là hình thức phức điệu đỉnh cao của thời Baroque.
  loai: lich-su
- trang: hinh-thuc/fugue
  id: n4
  cau: Một bản fugue cho một người chơi đàn phím có thể có 3, 4, 5 hay 6 bè.
  loai: so-lieu
- trang: hinh-thuc/fugue
  id: n5
  cau: "Các bè của fugue gọi tên theo giọng hát: soprano, alto, tenor, bass."
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n6
  cau: Chủ đề (subject) là giai điệu ngắn làm nền cho cả bản fugue và quay lại suốt bài.
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n7
  cau: Chủ đề xuất hiện đầu tiên ở một bè đơn độc.
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n8
  cau: Đáp đề (answer) là chủ đề nhắc lại ở bè thứ hai, cao hơn một quãng 5 hoặc thấp hơn một quãng 4, tức ở giọng át.
  loai: quy-tac
- trang: hinh-thuc/fugue
  id: n9
  cau: Đối đề (countersubject) là giai điệu đi cùng chủ đề hay đáp đề; ở phần trình bày, bè vào trước chơi nó trong lúc bè sau vào chủ đề hay đáp đề.
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n10
  cau: Phần trình bày là đoạn đầu của fugue, khi mọi bè lần lượt vào với chủ đề hoặc đáp đề.
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n11
  cau: Đoạn chuyển (episode) là đoạn không có lần vào nào của chủ đề ở bất kỳ bè nào.
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n12
  cau: Stretto là các bè vào chủ đề chồng lấn nhau trước khi bè trước kết thúc, làm âm nhạc căng và dồn dập hơn.
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n13
  cau: Âm nền (pedal point) là một nốt giữ dài ở bè trầm trong lúc các hợp âm bên trên thay đổi.
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n15
  cau: "Sơ đồ: alto vào chủ đề; soprano vào đáp đề (alto chơi đối đề); đoạn chuyển; bass vào chủ đề; các đoạn chuyển và chủ đề ở nhiều giọng; âm nền và kết."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n16
  cau: Fugue số 2 trong Bình quân luật quyển 1 là Fugue Đô thứ, BWV 847.
  loai: danh-muc
- trang: hinh-thuc/fugue
  id: n17
  cau: Quyển 1 của Bình quân luật ra năm 1722.
  loai: nam
- trang: hinh-thuc/fugue
  id: n18
  cau: Fugue BWV 847 có 3 bè.
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n19
  cau: Fugue BWV 847 dài 31 ô nhịp.
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n20
  cau: Fugue BWV 847 dài khoảng 1,5 phút.
  loai: so-lieu
- trang: hinh-thuc/fugue
  id: n22
  cau: "Ô 1–2: bè alto (giữa) chơi chủ đề một mình, ở Đô thứ."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n23
  cau: "Ô 3–4: bè soprano vào đáp đề ở Sol thứ; bè alto chơi đối đề bên dưới."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n24
  cau: "Ô 5–6: đoạn chuyển ngắn, chưa có bè thứ ba."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n25
  cau: "Ô 7–8: bè bass vào chủ đề ở Đô thứ, kết thúc phần trình bày."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n26
  cau: "Ô 9–25: xen kẽ đoạn chuyển và chủ đề ở các giọng gần: Mi♭ trưởng (ô 11), Sol thứ (ô 15), Đô thứ (ô 20)."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n27
  cau: "Ô 26: bè bass vào chủ đề (từ phách 3 của ô)."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n28
  cau: Từ giữa ô 29, soprano vào chủ đề lần cuối, dưới nó là một âm nền Đô ngân ở bè trầm.
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n29
  cau: Fugue BWV 847 kết ở hợp âm Đô trưởng dù cả bài ở Đô thứ.
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n30
  cau: "Hợp âm trưởng ở cuối một bài giọng thứ có tên riêng: quãng 3 Picardy (tierce de Picardie)."
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n31
  cau: Quãng 3 Picardy phổ biến ở thế kỷ 16 và 17, ít dần ở thế kỷ 18 và 19.
  loai: lich-su
- trang: hinh-thuc/fugue
  id: n34
  cau: Bach, Fugue cung Sol thứ, BWV 578, là bản cho organ.
  loai: danh-muc
- trang: hinh-thuc/fugue
  id: n35
  cau: "Bach, Nghệ thuật Fugue (Die Kunst der Fuge, BWV 1080): cả một tập fugue (và canon) trên cùng một chủ đề, dang dở ở fugue cuối cùng."
  loai: danh-muc
- trang: hinh-thuc/fugue
  id: n36
  cau: "Mozart, chương cuối Giao hưởng số 41 Jupiter: kỹ thuật fugue trong một chương hình thức sonata."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n37
  cau: Britten, The Young Person's Guide to the Orchestra, kết thúc bằng một fugue mà từng nhạc cụ lần lượt vào.
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n40
  cau: "Quiz: bè thứ hai vào trong fugue thường chơi đáp đề (chủ đề ở giọng át); giải thích: cao hơn một quãng 5 hoặc thấp hơn một quãng 4."
  loai: quy-tac
- trang: hinh-thuc/fugue
  id: n41
  cau: "Quiz: stretto là các bè vào chủ đề chồng lấn nhau; giải thích: làm âm nhạc căng và dồn dập hơn."
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n42
  cau: "Quiz: fugue BWV 847 có 3 bè (giải thích: alto, soprano rồi bass lần lượt vào)."
  loai: cau-truc
- trang: hinh-thuc/fugue
  id: n43
  cau: "Quiz: kết một bài giọng thứ bằng hợp âm trưởng gọi là quãng 3 Picardy (tierce de Picardie); kết lừa và kết plagal là hai loại kết khác."
  loai: dinh-nghia
- trang: hinh-thuc/fugue
  id: n21
  cau: "Fugue BWV 847 là một fugue dễ theo để bắt đầu nghe: ít bè, ngắn, chủ đề nghe rõ."
  loai: khuyen-tap
- trang: hinh-thuc/fugue
  id: n32
  cau: 'Cách nghe: lần đầu chỉ đếm số lần chủ đề xuất hiện; lần sau đoán chủ đề đang ở bè cao, giữa hay thấp; nghe kèm video có bản nhạc chạy theo (tìm "BWV 847 score").'
  loai: khuyen-tap
- trang: hinh-thuc/minuet-trio
  id: m1
  cau: Minuet là điệu múa Pháp, vốn là điệu dân gian rồi thành điệu cung đình thế kỷ 17.
  loai: dinh-nghia
- trang: hinh-thuc/minuet-trio
  id: m2
  cau: Minuet có nhịp ba (thường 3/4), tốc độ vừa phải, bước nhảy thanh lịch.
  loai: dinh-nghia
- trang: hinh-thuc/minuet-trio
  id: m3
  cau: Trong giao hưởng thời Cổ điển, minuet thường là chương 3.
  loai: lich-su
- trang: hinh-thuc/minuet-trio
  id: m4
  cau: Minuet đứng giữa chương chậm và chương cuối (trong các giao hưởng ví dụ).
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m5
  cau: "Bảng: minuet (A) có giai điệu chính, nhịp 3/4, thường có hai đoạn nhỏ nhắc lại."
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m6
  cau: "Bảng: trio (B) tương phản, thường dịu hơn minuet."
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m7
  cau: "Bảng: trio thường đổi giọng, hoặc đổi trưởng – thứ trên cùng chủ âm."
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m8
  cau: Tên "trio" (bộ ba) có từ thời Baroque, khi đoạn này thường viết cho ba nhạc cụ hay ba bè.
  loai: lich-su
- trang: hinh-thuc/minuet-trio
  id: m9
  cau: 'Cũ: "Trio mỏng hơn (ít nhạc cụ hơn)".'
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m10
  cau: "Bảng: minuet da capo là chơi lại minuet từ đầu, thường không nhắc lại các đoạn nhỏ."
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m11
  cau: Toàn bộ chương có dạng ABA, một hình thức ba đoạn "kép".
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m12
  cau: "Mỗi khối minuet và trio thường lại là một hình thức hai đoạn có tái hiện: ‖: a :‖ ‖: b a' :‖."
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m14
  cau: "Mozart, Eine kleine Nachtmusik, chương 3: Menuetto (Allegretto) cung Sol trưởng."
  loai: ten
- trang: hinh-thuc/minuet-trio
  id: m16
  cau: "Bảng: minuet ở Sol trưởng; trio ở Rê trưởng; da capo trở lại Sol trưởng."
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m17
  cau: "Bảng: minuet do dàn dây chơi giai điệu chính; trio đổi giọng, giai điệu trên nền đệm đơn giản, tương phản với minuet."
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m19
  cau: "Từ Beethoven, minuet thường được thay bằng scherzo: vẫn ba phần ABA, vẫn nhịp 3, nhưng nhanh hơn nhiều và nhiều bất ngờ."
  loai: lich-su
- trang: hinh-thuc/minuet-trio
  id: m20
  cau: Giao hưởng số 2 của Beethoven (viết 1800–1802) là bản đầu tiên ghi Scherzo ở chương 3; ông viết scherzo cho gần hết chín giao hưởng, và sang thế kỷ 19 scherzo thay minuet trong nhiều giao hưởng.
  loai: lich-su
- trang: hinh-thuc/minuet-trio
  id: m22
  cau: "Haydn, Giao hưởng Surprise số 94, chương 3: minuet, tốc độ Allegro molto, gần như scherzo đội lốt."
  loai: ten
- trang: hinh-thuc/minuet-trio
  id: m23
  cau: "Mozart, Giao hưởng số 40, chương 3: minuet trong giao hưởng giọng Sol thứ."
  loai: ten
- trang: hinh-thuc/minuet-trio
  id: m24
  cau: 'Cũ: "hiếm và u ám" (minuet giọng Sol thứ trong Giao hưởng số 40).'
  loai: cau-truc
- trang: hinh-thuc/minuet-trio
  id: m18
  cau: "Nghe thử và đếm: nhận ra lúc trio bắt đầu (giọng đổi, nhạc nhẹ đi) và lúc minuet quay lại."
  loai: khuyen-tap
- trang: hinh-thuc/minuet-trio
  id: m25
  cau: Nghe giọng thứ đổi tính cách của minuet thế nào.
  loai: khuyen-tap
- trang: hinh-thuc/overture
  id: n1
  cau: Overture ("mở màn") khởi đầu là khúc nhạc dàn nhạc mở đầu một tác phẩm kịch như opera hay oratorio.
  loai: dinh-nghia
- trang: hinh-thuc/overture
  id: n2
  cau: Overture dần tách ra thành thể loại hòa nhạc độc lập.
  loai: lich-su
- trang: hinh-thuc/overture
  id: n3
  cau: "Thời Baroque có hai kiểu overture cho opera: Pháp (Lully) và Ý."
  loai: lich-su
- trang: hinh-thuc/overture
  id: n4
  cau: Overture Pháp (Lully) có ba phần chậm – nhanh – chậm.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n5
  cau: Phần chậm mở đầu của overture Pháp có tiết tấu chấm (dotted); phần nhanh theo lối bắt chước.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n6
  cau: Overture Pháp nghe trong các tổ khúc dàn nhạc của Bach và trong oratorio của Handel, như Messiah.
  loai: lich-su
- trang: hinh-thuc/overture
  id: n7
  cau: Overture Ý có ba phần nhanh – chậm – nhanh.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n8
  cau: Overture Ý là mẫu cho những bản giao hưởng đầu tiên, vốn có ba chương; về sau giao hưởng thường có bốn chương.
  loai: lich-su
- trang: hinh-thuc/overture
  id: n9
  cau: "Thế kỷ 19, nhà soạn nhạc viết concert overture: một chương độc lập cho dàn nhạc, không mở đầu cho tác phẩm kịch nào."
  loai: dinh-nghia
- trang: hinh-thuc/overture
  id: n10
  cau: Nhiều concert overture dùng hình thức sonata.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n11
  cau: "Một số concert overture gần với symphonic poem: kể một câu chuyện hoặc vẽ một cảnh."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n14
  cau: "Mendelssohn, Hebrides (Động Fingal): chuyến đi Scotland năm 1829 (đảo Staffa, hang Fingal); âm nhạc gợi sóng biển."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n15
  cau: "Hebrides là concert overture (COD: một trong những bản đầu tiên của thể loại)."
  loai: lich-su
- trang: hinh-thuc/overture
  id: n16
  cau: "Berlioz, Roman Carnival: lễ hội carnival ở Rome; chất liệu lấy từ opera Benvenuto Cellini."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n17
  cau: "Tchaikovsky, 1812: cuộc kháng chiến của Nga trước quân Napoleon năm 1812; tổng phổ có phần cho chuông và đại bác."
  loai: lich-su
- trang: hinh-thuc/overture
  id: n18
  cau: "Tchaikovsky, Romeo và Juliet: bi kịch Shakespeare; chủ đề tình yêu đối lại chủ đề xung đột giữa hai dòng họ."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n19
  cau: "Phần Đi qua một tác phẩm, 1812, mục 1: mở đầu chậm, thánh ca Chính thống giáo của Nga."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n20
  cau: "Mục 2: thân chính và trận chiến: giai điệu dân gian Nga đối đầu với Marseillaise (phe Pháp) cho đến khi Marseillaise tan dần."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n21
  cau: "Mục 3: kết: quốc ca Nga hoàng God Save the Tsar! cùng chuông và đại bác."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n24
  cau: "Bảng Nghe để luyện: Tchaikovsky, 1812: hai quốc ca đối đầu."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n25
  cau: "Bảng Nghe để luyện: Mendelssohn, Hebrides: hình ảnh sóng biển."
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n26
  cau: "Bảng Nghe để luyện: Mozart, Don Giovanni, Overture của một opera: chơi trước khi opera bắt đầu."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n1
  cau: Rondo là hình thức có một đoạn chính (A) quay lại nhiều lần, xen giữa là các đoạn tương phản.
  loai: dinh-nghia
- trang: hinh-thuc/rondo
  id: n2
  cau: "Sơ đồ rondo năm đoạn: A – B – A – C – A, có khi dài hơn."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n4
  cau: Rondo hay dùng cho chương cuối của sonata, concerto và giao hưởng thời Cổ điển.
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n5
  cau: "Sơ đồ (hình): A, rồi B tương phản, A, C tương phản, A."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n6
  cau: Für Elise của Beethoven có danh mục WoO 59.
  loai: danh-muc
- trang: hinh-thuc/rondo
  id: n7
  cau: Für Elise là Bagatelle cung La thứ.
  loai: ten
- trang: hinh-thuc/rondo
  id: n8
  cau: Für Elise viết khoảng 1810.
  loai: nam
- trang: hinh-thuc/rondo
  id: n9
  cau: Für Elise xuất bản sau khi Beethoven mất.
  loai: nam
- trang: hinh-thuc/rondo
  id: n10
  cau: Bản nhạc ngắn nhưng có đủ hình thức rondo năm đoạn.
  loai: so-lieu
- trang: hinh-thuc/rondo
  id: n11
  cau: Für Elise có đủ hình thức rondo A – B – A – C – A.
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n12
  cau: Đoạn A ở La thứ, giai điệu Mi – Rê♯ – Mi – Rê♯…
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n13
  cau: "Đoạn B: giai điệu mới, sáng hơn (giọng trưởng), rồi chuỗi nốt nhanh; giọng Fa trưởng, rồi Đô trưởng."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n14
  cau: "Đoạn A thứ hai: La thứ, giai điệu chính trở lại nguyên vẹn."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n15
  cau: Đoạn C ở La thứ, trên âm nền La ở bè trầm; đoạn không rời giọng chính.
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n16
  cau: Ở đoạn C, nốt La lặp lại dồn dập ở tay trái.
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n17
  cau: 'Cũ: "căng thẳng, kịch tính nhất bài" (đoạn C).'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n18
  cau: "Đoạn A cuối: trở lại lần cuối, rồi bài kết thúc."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n19
  cau: Giai điệu A xuất hiện ba lần, cách nhau bởi B và C (hai lần quay lại).
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n21
  cau: Mozart, chương 3 Sonata piano K. 331, Rondo alla Turca.
  loai: ten
- trang: hinh-thuc/rondo
  id: n22
  cau: Rondo alla Turca mô phỏng âm nhạc quân đội Ottoman (Janissary), một ví dụ nổi tiếng của thể loại alla turca.
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n23
  cau: 'Cũ: "rất phổ biến ở Vienna thời đó" (Rondo alla Turca).'
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n24
  cau: "Chương cuối của nhiều concerto thời Cổ điển, như concerto của Mozart: thường là rondo hoặc sonata – rondo."
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n26
  cau: Hình thức ritornello của concerto Baroque cũng dựa trên ý tưởng "một đoạn quay lại nhiều lần" (ritornello xen với các đoạn độc tấu).
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n28
  cau: "Câu hỏi 1: sơ đồ của rondo năm đoạn là A – B – A – C – A (không phải A – B – A hay A – A' – A'' – A'''); giải thích: A – B – A là ba đoạn, A – A' – A'' là biến tấu."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n29
  cau: "Câu hỏi 2: rondo thường dùng cho chương cuối (không phải chương đầu hay chương chậm); giải thích: rondo là hình thức quen thuộc cho chương cuối của sonata và concerto thời Cổ điển."
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n30
  cau: "Câu hỏi 3: đặc điểm của đoạn C là bè trầm giữ nốt La làm âm nền (không phải chuyển sang nhịp 3/4, không phải chuyển hẳn sang giọng trưởng); giải thích: đoạn C ở La thứ, trên âm nền La; bài vẫn ở nhịp 3/8."
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n3
  cau: Đoạn A quay về giống như điệp khúc của một bài hát, nên tai dễ nhận ra.
  loai: khuyen-tap
- trang: hinh-thuc/scherzo
  id: s1
  cau: Scherzo trong tiếng Ý nghĩa là "trò đùa".
  loai: dinh-nghia
- trang: hinh-thuc/scherzo
  id: s2
  cau: Scherzo là chương nhạc nhanh, thường ở nhịp 3, nhiều bất ngờ về cường độ và màu dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/scherzo
  id: s3
  cau: Beethoven viết scherzo cho gần hết chín giao hưởng của mình.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s4
  cau: Scherzo thay thế minuet trang nhã của thời Cổ điển.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s5
  cau: Beethoven giữ khung ABA của minuet (Scherzo – Trio – Scherzo da capo) và nhịp 3.
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s8
  cau: "Bảng: minuet có tốc độ vừa phải, như bước nhảy."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s9
  cau: "Bảng: scherzo nhanh hơn nhiều."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s10
  cau: "Bảng: minuet trang nhã, như điệu nhảy cung đình."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s11
  cau: "Bảng: scherzo hóm hỉnh, nhiều bất ngờ, có khi dữ dội."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s12
  cau: "Bảng: trio của minuet là đoạn giữa dịu hơn minuet."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s13
  cau: "Bảng: trio của scherzo là đoạn giữa tương phản với scherzo, có thể rất khác về tính cách."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s14
  cau: Giao hưởng số 1 của Beethoven viết 1799–1800.
  loai: nam
- trang: hinh-thuc/scherzo
  id: s15
  cau: Chương 3 Giao hưởng số 1 còn ghi là minuet (Allegro molto e vivace), nhanh như scherzo.
  loai: ten
- trang: hinh-thuc/scherzo
  id: s16
  cau: Giao hưởng số 2 (viết 1800–1802) là bản đầu tiên ghi thẳng Scherzo ở chương 3.
  loai: ten
- trang: hinh-thuc/scherzo
  id: s17
  cau: Sau đó ông viết scherzo cho gần hết các giao hưởng còn lại (số 8 giữ Tempo di Menuetto).
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s18
  cau: Sang thế kỷ 19 scherzo thay minuet trong nhiều giao hưởng, tứ tấu và sonata.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s19
  cau: Giao hưởng số 5 của Beethoven, chương 3 là scherzo cung Đô thứ.
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s20
  cau: Chương scherzo Giao hưởng số 5 chảy thẳng vào chương cuối (attacca).
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s21
  cau: Đoạn nối giữa scherzo và chương cuối của Giao hưởng số 5 thường được xem là một trong những chuyển đoạn hay nhất trong âm nhạc.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s22
  cau: "Bảng: scherzo mở đầu bằng cello và contrabass, nhạc khí gỗ đáp lại; rồi kèn horn vang lên chủ đề chính của chương."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s23
  cau: "Bảng: trio chuyển sang Đô trưởng, viết đối âm (contrapuntal)."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s24
  cau: "Bảng: scherzo da capo trở lại lần cuối, do dây chơi pizzicato và rất nhỏ."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s25
  cau: "Bảng: đoạn chuyển là một đoạn nối dẫn thẳng sang chương cuối, không ngắt."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s26
  cau: "Bảng: chương 4 vào ngay (attacca), ở Đô trưởng."
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s29
  cau: Trong Giao hưởng số 9, Beethoven đặt scherzo ở chương 2 (thay vì chương 3), trước chương chậm.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s30
  cau: 'Cũ: "chương dài và dữ dội; ở cuối chương, trio vừa bắt đầu quay lại thì bị cắt ngang" (scherzo Giao hưởng số 9); "Mahler sau này cũng hay xáo trộn vị trí các chương."'
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s31
  cau: "Scherzo còn đứng riêng, ngoài giao hưởng: scherzo trong nhạc sân khấu Giấc mộng đêm hè Op. 61 của Mendelssohn (1842–43)."
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s32
  cau: Chopin viết bốn scherzo cho piano, nơi những đoạn dữ dội, hơi u tối xen với trio trữ tình.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s33
  cau: Chopin, Scherzo số 2 cung Si♭ thứ, scherzo cho piano độc tấu.
  loai: ten
- trang: hinh-thuc/scherzo
  id: s34
  cau: "Bảng: Giao hưởng số 9, chương 2: scherzo ở vị trí chương 2, trước chương chậm."
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s27
  cau: Nghe chương 3 và 4 liền nhau, chú ý đoạn nối giữa hai chương.
  loai: khuyen-tap
- trang: hinh-thuc/sonata
  id: n1
  cau: Hình thức sonata là "kiến trúc" quan trọng của nhạc thời Cổ điển, và các nhà soạn nhạc thời Lãng mạn vẫn tiếp tục dùng (dòng mô tả và đoạn mở đầu).
  loai: lich-su
- trang: hinh-thuc/sonata
  id: n2
  cau: Hình thức sonata thường dùng cho chương đầu của giao hưởng, sonata, concerto, tứ tấu.
  loai: lich-su
- trang: hinh-thuc/sonata
  id: n3
  cau: Hiểu hình thức này thì có chỗ dựa để nghe chương đầu của nhiều bản giao hưởng từ Haydn đến Brahms.
  loai: lich-su
- trang: hinh-thuc/sonata
  id: n4
  cau: "Cấu trúc ba hồi: trình bày, phát triển, tái hiện, rồi coda (sơ đồ mermaid và danh sách)."
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n5
  cau: 'Phần trình bày: chủ đề 1 ở giọng chính, đoạn chuyển để chuyển giọng, rồi chủ đề 2 ở giọng mới; hai giọng tạo nên "xung đột".'
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n6
  cau: Nếu giọng chính là trưởng, giọng mới thường là giọng át; nếu giọng chính là thứ, giọng mới thường là giọng trưởng song song.
  loai: quy-tac
- trang: hinh-thuc/sonata
  id: n7
  cau: Thời Cổ điển, cả phần trình bày thường được nhắc lại.
  loai: quy-tac
- trang: hinh-thuc/sonata
  id: n8
  cau: "Phát triển: các chủ đề thường bị chia nhỏ, kết hợp lại và đưa qua nhiều giọng, thường là những giọng xa giọng chính; đây là phần bất ổn nhất."
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n9
  cau: "Tái hiện: chủ đề 1 ở giọng chính, chủ đề 2 cũng ở giọng chính; xung đột được giải quyết."
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n10
  cau: Coda là đoạn kết, có thể ngắn hay rất dài, như coda chương 1 Giao hưởng số 5 của Beethoven.
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n11
  cau: Có khi trước phần trình bày còn có một đoạn mở đầu chậm, như trong Giao hưởng số 99 của Haydn.
  loai: lich-su
- trang: hinh-thuc/sonata
  id: n14
  cau: Mozart, Sonata piano cung Đô trưởng, K. 545.
  loai: danh-muc
- trang: hinh-thuc/sonata
  id: n15
  cau: Sonata K. 545 viết năm 1788.
  loai: nam
- trang: hinh-thuc/sonata
  id: n16
  cau: 'Mozart ghi sonata này là "cho người mới học" (danh mục tự ghi của Mozart: "für Anfänger").'
  loai: lich-su
- trang: hinh-thuc/sonata
  id: n17
  cau: Chương 1 chỉ dài khoảng 73 ô nhịp.
  loai: so-lieu
- trang: hinh-thuc/sonata
  id: n18
  cau: Chương 1 chơi trong 4–5 phút.
  loai: so-lieu
- trang: hinh-thuc/sonata
  id: n19
  cau: Mở bản nhạc trên IMSLP (tìm "K.545").
  loai: danh-muc
- trang: hinh-thuc/sonata
  id: n20
  cau: 'Ô 1–4: chủ đề 1 ở Đô trưởng; giai điệu đơn giản trên hợp âm rải tay trái (kiểu đệm "Alberti").'
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n21
  cau: "Ô 5–12: đoạn chuyển gồm các chuỗi gam móc kép nối tiếp, mỗi chuỗi bắt đầu thấp hơn chuỗi trước, rồi hợp âm Rê trưởng (V/V) dẫn sang giọng mới; Đô → Sol."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n22
  cau: "Ô 13–28: chủ đề 2 ở Sol trưởng (giọng át), rồi các nốt láy rền và chuỗi nốt nhanh khép phần trình bày."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n23
  cau: Phần trình bày (ô 1–28) được nhắc lại.
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n24
  cau: "Ô 29–41: phát triển đi qua các giọng thứ (Sol thứ, Rê thứ, La thứ), dùng chất liệu từ phần kết của trình bày."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n25
  cau: "Ô 42–57: tái hiện chủ đề 1 ở Fa trưởng (không phải Đô trưởng); đoạn chuyển được mở rộng để đưa nhạc về Đô; Fa → Đô trưởng."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n26
  cau: "Ô 58–73: chủ đề 2 trở lại ở Đô trưởng (từ ô 59); xung đột được giải quyết."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n27
  cau: Mozart bắt đầu tái hiện ở giọng hạ át (Fa trưởng), một cách làm khác thường; đoạn chuyển trong tái hiện được mở rộng (từ ô 46) để đưa nhạc về Đô trưởng, nên chủ đề 2 vẫn trở lại ở giọng chính.
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n28
  cau: "Mozart Giao hưởng số 40, chương 1: chủ đề 2 ở Si♭ trưởng (trình bày) rồi ở Sol thứ (tái hiện)."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n29
  cau: "Beethoven Giao hưởng số 5, chương 1: cả chương xây từ một môtip bốn nốt; coda rất dài."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n30
  cau: "Mendelssohn Concerto violin, chương 1: cadenza đặt trước tái hiện, khác thường lệ."
  loai: cau-truc
- trang: hinh-thuc/sonata
  id: n34
  cau: "Sonata-rondo: chủ đề 1 quay lại thêm nhiều lần như rondo."
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n35
  cau: Chương cuối Sonata Pathétique (Op. 13) của Beethoven là sonata-rondo.
  loai: lich-su
- trang: hinh-thuc/sonata
  id: n36
  cau: "Sonatina: sonata ngắn và nhẹ hơn; chương đầu theo hình thức sonata nhưng phần phát triển rất ngắn hoặc không có."
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: n37
  cau: Những bản sonatina piano đầu tiên (Clementi, Kuhlau) thường viết để dạy đàn.
  loai: lich-su
- trang: hinh-thuc/sonata
  id: n38
  cau: Từ giữa thế kỷ 19 về sau, các nhà soạn nhạc vẫn tiếp tục dùng hình thức sonata.
  loai: lich-su
- trang: hinh-thuc/sonata
  id: q1
  cau: "Quiz 1: trong phần trình bày ở giọng trưởng, chủ đề 2 thường ở giọng át (Đô trưởng → Sol trưởng); phương án sai: giọng thứ cùng tên, giọng hạ át."
  loai: quy-tac
- trang: hinh-thuc/sonata
  id: q2
  cau: "Quiz 2: phần phát triển thường bất ổn và đi qua nhiều giọng nhất; giải thích: các chủ đề thường bị chia nhỏ, kết hợp lại và đưa qua nhiều giọng."
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: q3
  cau: "Quiz 3: trong tái hiện, chủ đề 2 ở giọng chính; phương án sai: giọng át, giọng thứ song song."
  loai: dinh-nghia
- trang: hinh-thuc/sonata
  id: q4
  cau: "Quiz 4: điều khác thường ở tái hiện K. 545 chương 1 là chủ đề 1 trở lại ở Fa trưởng thay vì Đô trưởng; Mozart bắt đầu tái hiện ở giọng hạ át rồi đưa nhạc về Đô trưởng cho chủ đề 2."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n1
  cau: Tiếng Đức của symphonic poem là sinfonische Dichtung.
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n2
  cau: Richard Strauss ưa gọi thể loại này là Tondichtung, "thơ bằng âm thanh".
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n3
  cau: Symphonic poem là nhạc kể chuyện một chương cho dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n4
  cau: Franz Liszt đặt ra tên gọi symphonic poem và viết 13 tác phẩm như vậy.
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n5
  cau: Khác với giao hưởng "thuần túy", symphonic poem chỉ có một chương và bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n6
  cau: Người nghe thường được cho một chương trình (program), vài dòng tóm tắt câu chuyện, rồi âm nhạc diễn lại bằng chủ đề và màu sắc dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n7
  cau: "Một nhân vật có thể có chủ đề riêng: Till Eulenspiegel có hai chủ đề, một cho kèn horn và một cho clarinet."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n8
  cau: Chủ đề có thể biến hình qua các đoạn, như trong Les Préludes của Liszt.
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n9
  cau: Hình thức của symphonic poem tự do, chỉ gần với hình thức sonata của chương đầu giao hưởng.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n10
  cau: Moldau (Vltava) là chương thứ hai trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana.
  loai: danh-muc
- trang: hinh-thuc/symphonic-poem
  id: n11
  cau: Moldau là chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague.
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n12
  cau: "Bảng Moldau, đoạn 1: hai con suối nhỏ (sáo) hợp thành sông; hai dòng nhạc mỏng hòa vào nhau."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n13
  cau: "Bảng Moldau, đoạn 2: sông lớn dần; giai điệu Moldau nổi tiếng cất lên ở dây."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n14
  cau: "Bảng Moldau, đoạn 3: thợ săn trong rừng; tiếng kèn horn."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n15
  cau: "Bảng Moldau, đoạn 4: đám cưới nông dân; điệu nhảy vui (polka)."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n16
  cau: "Bảng Moldau, đoạn 5: tiên nữ dưới trăng; sáo và oboe trao nhau câu nhạc cao, dây lung linh."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n17
  cau: "Bảng Moldau, đoạn 6: thác ghềnh St. John; dàn nhạc ào ạt, dữ dội nhất."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n18
  cau: "Bảng Moldau, đoạn 7: qua Prague, đổ ra sông Elbe; giai điệu Moldau trở lại, hùng tráng rồi xa dần."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n20
  cau: Les Préludes của Liszt được ưa chuộng nhất trong các symphonic poem của ông.
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n21
  cau: 'Les Préludes: câu hỏi "đời là gì?".'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n22
  cau: "Smetana, Moldau: dòng sông Vltava."
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n23
  cau: "R. Strauss, Don Juan: gã Don Juan đa tình, kết thúc bi thảm."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n24
  cau: "R. Strauss, Till Eulenspiegel: chàng láu cá Till và những trò tinh nghịch."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n25
  cau: 'Debussy, La mer (Biển cả): ba "phác thảo giao hưởng" về biển.'
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n26
  cau: "Sibelius, Finlandia: lòng yêu nước Phần Lan."
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n27
  cau: Tchaikovsky gọi 1812 là overture, Smetana gọi Moldau là symphonic poem.
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n28
  cau: Cả overture hòa nhạc và symphonic poem đều là một chương cho dàn nhạc và có nội dung kể chuyện.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n29
  cau: Symphonic poem phát triển từ concert overture, và một số concert overture gần với symphonic poem.
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n30
  cau: "Nhạc chương trình (program music) là khái niệm rộng hơn: nhạc dựa trên nội dung ngoài âm nhạc, như symphonic poem."
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n33
  cau: "Bảng Nghe để luyện: Liszt, Les Préludes: một chủ đề biến hình qua các đoạn."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n34
  cau: "Bảng Nghe để luyện: R. Strauss, Till Eulenspiegel: hai chủ đề của Till (láu cá)."
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n19
  cau: "Nghe một mạch và đánh dấu mỗi lần cảnh đổi, âm nhạc đổi thế nào: bài tập nghe âm nhạc miêu tả."
  loai: khuyen-tap
- trang: hinh-thuc/index
  id: n1
  cau: "Hình thức là cách một bản nhạc được sắp xếp theo thời gian: đoạn nào lặp lại, đoạn nào tương phản."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n2
  cau: "Thể loại là loại tác phẩm quen thuộc: giao hưởng, concerto, sonata…"
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n10
  cau: "Concerto và ritornello: một người đối thoại với cả dàn nhạc."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n11
  cau: "Minuet và Trio: vũ khúc 3/4, minuet – trio – minuet, chương 3 giao hưởng thời Cổ điển."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n12
  cau: 'Scherzo: "trò đùa" của Beethoven thay minuet: nhanh, bất ngờ, đầy năng lượng.'
  loai: lich-su
- trang: hinh-thuc/index
  id: n13
  cau: "Overture: khúc mở màn, từ mở đầu opera đến overture hòa nhạc độc lập."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n14
  cau: "Symphonic poem: nhạc kể chuyện một chương của Liszt, Smetana, Strauss."
  loai: lich-su
- trang: hinh-thuc/index
  id: n15
  cau: "Người ta dùng chữ cái để gọi các đoạn nhạc: cùng chữ là cùng chất liệu, khác chữ là chất liệu mới."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n16
  cau: "Hai đoạn: sơ đồ A B; hai phần, thường mỗi phần lặp lại; nghe thử: các điệu múa trong tổ khúc của Bach."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n17
  cau: "Ba đoạn: A B A; đi xa rồi trở về; nghe thử: Chopin Mazurka La thứ Op. 17 số 4."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n18
  cau: "Rondo: A B A C A …; một đoạn chính quay lại nhiều lần; Beethoven Für Elise."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n19
  cau: "Chủ đề và biến tấu: A A' A'' A''' …; một giai điệu được biến đổi nhiều lần; Mozart K. 265."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n20
  cau: "Minuet và trio: A B A; điệu múa 3/4, đoạn giữa (trio) thường nhẹ nhàng hơn; chương 3 nhiều giao hưởng của Haydn, Mozart."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n22
  cau: "Hình thức sonata: quan trọng của thời Cổ điển, vẫn dùng ở thời Lãng mạn; thường cho chương đầu giao hưởng, sonata, concerto, tứ tấu; trình bày hai chủ đề ở hai giọng, phát triển, tái hiện cả hai ở giọng chính, thường có coda."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n23
  cau: "Fugue là hình thức phức điệu xây trên sự bắt chước một chủ đề: chủ đề vào lần lượt ở từng bè, các bè đuổi theo và chồng lên nhau, xen giữa là các đoạn chuyển; các fugue của Bach là đỉnh cao của hình thức này."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n24
  cau: "Giao hưởng: tác phẩm lớn cho dàn nhạc, thường 4 chương: nhanh (hình thức sonata) – chậm – minuet hoặc scherzo – nhanh."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n25
  cau: "Concerto: một nhạc cụ độc tấu cùng dàn nhạc, thường 3 chương nhanh – chậm – nhanh; gần cuối chương 1 thường có cadenza."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n26
  cau: "Sonata: tác phẩm cho một nhạc cụ (thường là piano) hoặc một nhạc cụ cùng piano, gồm vài chương."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n27
  cau: "Tứ tấu đàn dây: hai violin, một viola, một cello; được xem là phương tiện hàng đầu để nhà soạn nhạc thể hiện ý tưởng trong nhạc thính phòng."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n28
  cau: "Tổ khúc: chuỗi các điệu múa; tổ khúc Baroque thường gồm allemande, courante, sarabande, gigue."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n29
  cau: "Opera: kịch hát với dàn nhạc, có dàn dựng sân khấu; oratorio tương tự nhưng không dàn dựng, thường về đề tài tôn giáo."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n30
  cau: "Thánh lễ (mass) và Requiem: nhạc cho nghi lễ Công giáo; Requiem là lễ cầu hồn."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n31
  cau: "Ca khúc nghệ thuật (Lied): bài hát cho giọng hát và piano; Schubert và Schumann là hai nhà soạn nhạc tiêu biểu."
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n32
  cau: "Tiểu phẩm cho piano: nocturne, étude, prélude, ballade, impromptu; Chopin viết nhiều bản thuộc các thể loại này."
  loai: lich-su
- trang: hinh-thuc/index
  id: n3
  cau: Biết hình thức giúp bạn không bị "lạc" khi nghe một tác phẩm dài 40 phút.
  loai: khuyen-tap
- trang: nhac-cu/dan-nhac
  id: d1
  cau: Một dàn nhạc giao hưởng đầy đủ thường có khoảng 90–100 nhạc công.
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d2
  cau: "Dàn nhạc giao hưởng chia thành bốn bộ: dây, gỗ, đồng, gõ."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d3
  cau: Bộ dây là bộ đông nhất; nhạc cụ kéo vĩ, cũng có thể gảy dây (pizzicato); đàn hạc chỉ gảy.
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d4
  cau: "Violin chia hai bè: violin 1 thường chơi bè cao hơn, violin 2 thường bổ trợ ở âm vực trung; violin là nhạc cụ cao nhất bộ dây."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d5
  cau: Viola lớn hơn violin một chút, âm trầm ấm; đọc khóa Đô.
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d6
  cau: Cello đặt giữa hai chân; âm sắc thường được ví với giọng nam.
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d7
  cau: Contrabass trầm nhất bộ dây, đứng hoặc ngồi ghế cao, giữ nền bè trầm.
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d8
  cau: Đàn hạc gảy dây, hay dùng glissando (lướt qua các dây liền nhau).
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d9
  cau: "Bộ gỗ: tên gọi đến từ chất liệu vốn là gỗ; ngày nay không phải nhạc cụ nào cũng bằng gỗ (sáo thường bằng bạc hay hợp kim)."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d10
  cau: "Sáo (flute): thổi qua lỗ; piccolo là sáo nhỏ, cao hơn một quãng tám."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d11
  cau: "Oboe: dăm kép, âm sáng, xuyên, có chất dăm; dàn nhạc thường lên dây theo nốt La của oboe."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d12
  cau: "Clarinet: dăm đơn, mềm mại, âm vực rộng."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d13
  cau: "Bassoon (fagotto): dăm kép, trầm; đôi khi hài hước."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d14
  cau: "Kèn horn (cor): âm tròn, ấm; nối giữa bộ gỗ và bộ đồng."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d15
  cau: "Trumpet: sáng, vang, oai hùng."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d16
  cau: Trombone có ống trượt; uy nghi, mạnh mẽ.
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d17
  cau: Tuba là nhạc cụ trầm nhất bộ đồng.
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d18
  cau: Timpani (trống định âm) là loại trống lên dây theo cao độ xác định.
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d19
  cau: Ngoài timpani còn trống lớn, trống con, cymbal, triangle, glockenspiel, xylophone, chuông ống.
  loai: danh-muc
- trang: nhac-cu/dan-nhac
  id: d20
  cau: Dàn nhạc thời Cổ điển thường chỉ có timpani trong bộ gõ.
  loai: lich-su
- trang: nhac-cu/dan-nhac
  id: d21
  cau: "Chỗ ngồi: bộ dây ở phía trước (violin 1 bên trái, cello và contrabass bên phải, nhìn từ khán giả); bộ gỗ ở giữa; bộ đồng và bộ gõ phía sau; nhạc trưởng đứng giữa, quay lưng về khán giả; bố trí thay đổi tùy dàn nhạc."
  loai: dinh-nghia
- trang: nhac-cu/dan-nhac
  id: d23
  cau: "Peter và chó sói (Prokofiev, 1936): có người kể, mỗi nhân vật một nhạc cụ: Peter bộ dây, chim sáo, vịt oboe, mèo clarinet, ông nội bassoon, chó sói ba kèn horn, tiếng súng timpani và trống lớn."
  loai: lich-su
- trang: nhac-cu/dan-nhac
  id: d24
  cau: Britten, The Young Person's Guide to the Orchestra (1946) dùng chủ đề của Henry Purcell, lần lượt giới thiệu từng nhạc cụ từ cao xuống thấp trong từng bộ, kết bằng một fugue lớn.
  loai: lich-su
- trang: nhac-cu/dan-nhac
  id: d25
  cau: "Bài tập 2: Giao hưởng số 5 của Beethoven, chương 1: kèn horn dẫn vào chủ đề 2."
  loai: lich-su
- trang: nhac-cu/dan-nhac
  id: d26
  cau: "Bài tập 3: Ravel, Boléro, hai giai điệu lặp đi lặp lại, mỗi lần do một nhạc cụ hay nhóm nhạc cụ khác trình bày."
  loai: cau-truc
- trang: nhac-cu/dan-nhac
  id: d28
  cau: "Hình âm vực: Piano từ A0 đến C8."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d29
  cau: "Hình âm vực: Violin từ G3 đến E7."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d30
  cau: "Hình âm vực: Viola từ C3 đến E6."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d31
  cau: "Hình âm vực: Cello từ C2 đến A5."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d32
  cau: "Hình âm vực: Contrabass từ E1 đến G4."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d33
  cau: "Hình âm vực: Đàn hạc từ B0 đến G♯7."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d34
  cau: "Hình âm vực: Piccolo từ D5 đến C8."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d35
  cau: "Hình âm vực: Sáo (flute) từ C4 đến C7."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d36
  cau: "Hình âm vực: Oboe từ B♭3 đến A6."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d37
  cau: "Hình âm vực: Clarinet (B♭) từ D3 đến B♭6."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d38
  cau: "Hình âm vực: Bassoon từ B♭1 đến E5."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d39
  cau: "Hình âm vực: Kèn horn từ B1 đến F5."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d40
  cau: "Hình âm vực: Trumpet (B♭) từ E3 đến C6."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d41
  cau: "Hình âm vực: Trombone từ E2 đến F5."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d42
  cau: "Hình âm vực: Tuba từ D1 đến F4."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d43
  cau: "Hình âm vực: Timpani từ D2 đến C4."
  loai: so-lieu
- trang: nhac-cu/dan-nhac
  id: d44
  cau: "Hình âm vực: Guitar từ E2 đến B5."
  loai: so-lieu
- trang: nhan-dien/dau-van-tay
  id: n3
  cau: Nhóm Baroque gồm Vivaldi, J. S. Bach, Handel.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n4
  cau: Nhóm Cổ điển gồm Haydn, Mozart, Beethoven.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n5
  cau: Nhóm Lãng mạn gồm Schubert, Chopin, Liszt, Wagner, Brahms, Tchaikovsky, Dvořák.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n6
  cau: Nhóm Thế kỷ 20 gồm Debussy, Ravel, Stravinsky, Shostakovich, Reich và Glass, Pärt.
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n7
  cau: "Vivaldi: violin độc tấu điêu luyện; ritornello rõ ràng; nhạc miêu tả (chim, bão)."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n8
  cau: "J. S. Bach: phức điệu, nhiều bè độc lập cùng chuyển động, nhất là trong fugue; viết nhiều cho organ và harpsichord, những nhạc cụ hợp với đối âm."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n9
  cau: "Handel: nhiều hợp xướng (oratorio) và dùng cùng phong cách với opera của ông; trong hợp xướng, kết cấu chuyển giữa chủ điệu và phức điệu."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n10
  cau: 'Haydn: hóm hỉnh, bất ngờ (như hợp âm to đột ngột trong "Surprise"), kết giả; xây cấu trúc lớn từ những môtip ngắn, đơn giản; hay dùng chất dân gian.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n11
  cau: "Mozart: cảm giác về hình thức và sự cân đối; bề ngoài rạng rỡ, vui nhưng có mạch u sầu bên dưới; nhạc opera nới rộng nghệ thuật của ca sĩ; đệm Alberti, như đầu Sonata K. 545."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n12
  cau: 'Beethoven: phát triển một ý nhạc nhỏ qua nhiều biến đổi (như phân mảnh chủ đề trong Giao hưởng số 5); dùng nhiều sforzando; coda mở rộng thành cao trào; các tác phẩm giai đoạn giữa thường được gọi là "anh hùng", thể hiện đấu tranh.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n13
  cau: "Schubert: giai điệu hát hơi dài; cách chuyển giọng độc đáo, hay dùng quan hệ quãng 3 nửa cung (chromatic mediant) giữa các hợp âm."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n14
  cau: "Chopin: chủ yếu viết cho piano (mọi tác phẩm đều có piano); rubato là một phần lối chơi của ông; điệu nhảy Ba Lan (mazurka, polonaise) và nocturne."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n15
  cau: "Liszt: kỹ thuật piano phô diễn; chuyển đổi chủ đề, dùng lại một chủ đề ở nhiều phần với tính cách khác nhau để thống nhất tác phẩm; mở đầu thể loại thơ giao hưởng."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n16
  cau: 'Wagner: âm nhạc liền mạch, "giai điệu bất tận" thay cho sự tách bạch giữa aria và recitative; hòa âm nửa cung dày đặc; dàn nhạc có vai trò và sức mạnh lớn hơn; leitmotif.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n17
  cau: 'Brahms: hình thức cổ điển chặt chẽ ("ý thức cổ điển về hình thức và trật tự"), bậc thầy đối âm; hay dùng hemiola và những xê dịch nhịp (xem bài 15).'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n18
  cau: "Tchaikovsky: giai điệu cuốn hút ngay, dễ nhớ, đầy cảm xúc; kèn gỗ và dây luân phiên giữ giai điệu (như trong Romeo và Juliet); viết nhạc ballet."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n19
  cau: "Dvořák: chất dân gian Séc (nhịp điệu của Moravia và Bohemia) và ảnh hưởng nhạc Mỹ (spiritual); giai điệu ngũ cung thời kỳ ở Mỹ."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n20
  cau: "Debussy: hợp âm trượt song song; gam toàn cung và ngũ cung; chuyển giọng không chuẩn bị; hòa âm nhiều khi mơ hồ về giọng."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n21
  cau: 'Ravel: phối khí chính xác, tinh xảo (Stravinsky gọi ông là "thợ đồng hồ Thụy Sĩ"); hợp âm 9, có khi chạy song song; ảnh hưởng nhạc Tây Ban Nha, điệu nhảy và jazz.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n22
  cau: "Stravinsky: ostinato dồn dập, có khi nhiều ostinato va vào nhau; nhịp điệu vượt qua vạch nhịp, trọng âm bất ngờ; hợp âm ghép, đa điệu tính (Petrushka)."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n23
  cau: "Shostakovich: giai điệu dài ở violin, xen các đoạn độc tấu kèn gỗ; chất châm biếm, kỳ quái và hành khúc; cuối Giao hưởng số 5 là sự lặp lại căng thẳng, ám ảnh của Rê trưởng."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n24
  cau: "Reich và Glass: mẫu ngắn lặp lại, thay đổi rất chậm; Reich: hai mẫu giống nhau lệch pha dần (Piano Phase); Glass: quá trình cộng dồn (thêm một lần lặp, bớt nốt cuối)."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n25
  cau: "Pärt: tĩnh lặng, giản dị: nốt đơn hoặc hợp âm ba, tempo chậm, âm thanh như tiếng chuông ngân (tintinnabuli)."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
