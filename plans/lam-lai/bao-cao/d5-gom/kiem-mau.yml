- trang: lich-su/thoi-ky/trung-co
  id: n11
  cau: Trường phái Notre-Dame ở Paris (Léonin, Pérotin), khoảng cuối thế kỷ 12 đến đầu thế kỷ 13, để lại những bộ organum hai bè (Léonin) và bốn bè (Pérotin).
  loai: lich-su
  nguon:
    - ten: The Concise Oxford Dictionary of Music (Kennedy và Bourne) qua Encyclopedia.com, mục Notre Dame school
      link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/notre-dame-school
    - ten: Encyclopaedia Britannica, Léonin
      link: https://www.britannica.com/biography/Leonin
    - ten: Encyclopaedia Britannica, Pérotin
      link: https://www.britannica.com/biography/Perotin
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "khoảng cuối thế kỷ 12 viết những bản organum lớn đầu tiên". "Lớn đầu tiên" không kiểm được; khoảng thời gian mở rộng theo Britannica (Pérotin hoạt động quanh 1200) và gắn mỗi người với số bè.'
