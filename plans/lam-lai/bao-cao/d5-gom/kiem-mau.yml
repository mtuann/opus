- trang: hinh-thuc/fugue
  id: n25
  cau: "Ô 7–8: bè bass vào chủ đề ở Đô thứ, kết thúc phần trình bày."
  loai: cau-truc
  nguon:
    - ten: Mutopia, Bach, Das Wohltemperierte Clavier I, Fuga II (BWV 847), ấn bản Edition Peters, tệp fuga2.ly
      link: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1941
    - ten: Open Music Theory, High Baroque Fugal Exposition
      link: https://viva.pressbooks.pub/openmusictheory/chapter/high-baroque-fugal-exposition/
  ket_qua_luot_1: dung
  ghi_chu: 'Đọc tệp .ly của Mutopia (Fuga II, "a 3 Voci", 4/4, Đô thứ) và đếm ô tay. Bass ô 7: "r8 c16 h c8 g as c16 h c8 d" (chủ đề Đô thứ); đủ ba bè đã vào chủ đề hoặc đáp đề.'
- trang: hinh-thuc/concerto
  id: n8
  cau: "Sơ đồ ritornello: ritornello mở đầu, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng chính."
  loai: cau-truc
  nguon:
    - ten: Listen, bản 8 (Macmillan Learning), mục ritornello trong concerto Baroque
      link: https://digfir-published.macmillanusa.com/listen8e/listen8e_ch10_13.html
  ket_qua_luot_1: da-sua
  ghi_chu: 'Listen: ritornello ở giọng khác khi chương tiến triển, trở lại chủ âm ở cuối. Chữ cũ ghi ritornello đầu ở "giọng chính"; nguồn đã mở không nói giọng của lần đầu nên sơ đồ ghi "mở đầu". Sơ đồ chỉ là mẫu.'
