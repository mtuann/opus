- trang: hinh-thuc/concerto
  id: n1
  cau: Concerto là tác phẩm cho một (hoặc vài) nhạc cụ độc tấu cùng dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n3
  cau: Concerto Baroque, như của Vivaldi, thường dùng hình thức ritornello.
  loai: lich-su
- trang: hinh-thuc/concerto
  id: n4
  cau: Ritornello là tiếng Ý, nghĩa là "lần quay lại nhỏ".
  loai: ten
- trang: hinh-thuc/concerto
  id: n5
  cau: Ritornello do cả dàn nhạc (tutti) chơi, mở đầu và kết thúc chương.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n6
  cau: Ritornello quay lại nhiều lần ở giữa chương, thường ở các giọng khác nhau và có khi chỉ một đoạn ngắn.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n7
  cau: 'Xen giữa các ritornello là các đoạn độc tấu: nhạc cụ độc tấu chơi nhanh và điêu luyện hơn.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n8
  cau: 'Sơ đồ ritornello: ritornello mở đầu, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng khác, độc tấu, ritornello giọng chính.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n9
  cau: Khác với rondo, nơi điệp khúc luôn trở lại ở chủ âm, ritornello quay lại ở giọng khác nhau và thường chỉ là một phần của đoạn gốc.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n10
  cau: 'Concerto grosso: một nhóm nhỏ nhạc cụ độc tấu (concertino) đối đáp với cả dàn nhạc (ripieno).'
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n11
  cau: Corelli và Handel đều có tập concerto grosso Op. 6.
  loai: danh-muc
- trang: hinh-thuc/concerto
  id: n13
  cau: Vivaldi, Mùa xuân, chương 1, là một ví dụ rõ về ritornello.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n14
  cau: 'Concerto thời Cổ điển thường có 3 chương: nhanh – chậm – nhanh.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n15
  cau: 'Chương 1 kết hợp hình thức sonata với ý tưởng ritornello: thường có một phần trình bày của dàn nhạc trước, rồi một phần trình bày của nghệ sĩ độc tấu.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n16
  cau: 'Cadenza: gần cuối chương 1, dàn nhạc dừng lại trên một hợp âm, nghệ sĩ độc tấu chơi một mình một đoạn tự do, khoe kỹ thuật và tưởng tượng, rồi dàn nhạc vào lại để kết.'
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n17
  cau: Cadenza vốn được ứng tác; từ thời Mozart và Beethoven, nhà soạn nhạc ngày càng viết sẵn.
  loai: lich-su
- trang: hinh-thuc/concerto
  id: n18
  cau: Chương 2 của concerto Cổ điển là chương chậm.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n19
  cau: Chương 3 của concerto Cổ điển nhanh, thường ở hình thức rondo.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n20
  cau: 'Mendelssohn, Concerto violin: bỏ phần trình bày riêng của dàn nhạc, cho violin vào gần như ngay lập tức, và nối các chương liền nhau.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n21
  cau: Rachmaninoff mở đầu Concerto số 2 bằng piano độc tấu.
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n22
  cau: Thời Lãng mạn, nhà soạn nhạc thay đổi dần khuôn mẫu concerto.
  loai: lich-su
- trang: hinh-thuc/concerto
  id: n23
  cau: 'Bảng Nghe thêm: Vivaldi Bốn Mùa: ritornello, âm nhạc miêu tả.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n25
  cau: 'Bach, Brandenburg Concerto số 5, chương 1: harpsichord, vốn chỉ đệm, bỗng có một đoạn độc tấu dài như cadenza.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n26
  cau: 'Mendelssohn, Concerto violin: cadenza đặt trước tái hiện; các chương nối liền.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n28
  cau: 'Rachmaninoff, Concerto piano số 2: mở đầu bằng loạt hợp âm piano ngân như tiếng chuông, dài 8 ô nhịp.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n30
  cau: 'Rodrigo, Concierto de Aranjuez, chương 2: guitar và kèn cor anglais đối đáp.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n32
  cau: 'Quiz: trong concerto Baroque, ritornello do cả dàn nhạc chơi (tutti); các đoạn xen giữa là độc tấu.'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n33
  cau: 'Quiz: cadenza là đoạn độc tấu tự do khi dàn nhạc dừng lại; giải thích: vốn được ứng tác, về sau nhà soạn nhạc ngày càng viết sẵn.'
  loai: dinh-nghia
- trang: hinh-thuc/concerto
  id: n34
  cau: 'Quiz: concerto Cổ điển thường có 3 chương (nhanh – chậm – nhanh).'
  loai: cau-truc
- trang: hinh-thuc/concerto
  id: n2
  cau: Khi nghe concerto, hãy để ý cuộc đối đáp, có khi là tranh tài, giữa một người và số đông.
  loai: khuyen-tap
- trang: hinh-thuc/overture
  id: n1
  cau: Overture ("mở màn") khởi đầu là khúc nhạc dàn nhạc mở đầu một tác phẩm kịch như opera hay oratorio.
  loai: dinh-nghia
- trang: hinh-thuc/overture
  id: n2
  cau: Overture dần tách ra thành thể loại hòa nhạc độc lập.
  loai: lich-su
- trang: hinh-thuc/overture
  id: n3
  cau: 'Thời Baroque có hai kiểu overture cho opera: Pháp (Lully) và Ý.'
  loai: lich-su
- trang: hinh-thuc/overture
  id: n4
  cau: Overture Pháp (Lully) có ba phần chậm – nhanh – chậm.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n5
  cau: Phần chậm mở đầu của overture Pháp có tiết tấu chấm (dotted); phần nhanh theo lối bắt chước.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n6
  cau: Overture Pháp nghe trong các tổ khúc dàn nhạc của Bach và trong oratorio của Handel, như Messiah.
  loai: lich-su
- trang: hinh-thuc/overture
  id: n7
  cau: Overture Ý có ba phần nhanh – chậm – nhanh.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n8
  cau: Overture Ý là mẫu cho những bản giao hưởng đầu tiên, vốn có ba chương; về sau giao hưởng thường có bốn chương.
  loai: lich-su
- trang: hinh-thuc/overture
  id: n9
  cau: 'Thế kỷ 19, nhà soạn nhạc viết concert overture: một chương độc lập cho dàn nhạc, không mở đầu cho tác phẩm kịch nào.'
  loai: dinh-nghia
- trang: hinh-thuc/overture
  id: n10
  cau: Nhiều concert overture dùng hình thức sonata.
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n11
  cau: 'Một số concert overture gần với symphonic poem: kể một câu chuyện hoặc vẽ một cảnh.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n14
  cau: 'Mendelssohn, Hebrides (Động Fingal): chuyến đi Scotland năm 1829 (đảo Staffa, hang Fingal); âm nhạc gợi sóng biển.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n15
  cau: 'Hebrides là concert overture (COD: một trong những bản đầu tiên của thể loại).'
  loai: lich-su
- trang: hinh-thuc/overture
  id: n16
  cau: 'Berlioz, Roman Carnival: lễ hội carnival ở Rome; chất liệu lấy từ opera Benvenuto Cellini.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n17
  cau: 'Tchaikovsky, 1812: cuộc kháng chiến của Nga trước quân Napoleon năm 1812; tổng phổ có phần cho chuông và đại bác.'
  loai: lich-su
- trang: hinh-thuc/overture
  id: n18
  cau: 'Tchaikovsky, Romeo và Juliet: bi kịch Shakespeare; chủ đề tình yêu đối lại chủ đề xung đột giữa hai dòng họ.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n19
  cau: 'Phần Đi qua một tác phẩm, 1812, mục 1: mở đầu chậm, thánh ca Chính thống giáo của Nga.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n20
  cau: 'Mục 2: thân chính và trận chiến: giai điệu dân gian Nga đối đầu với Marseillaise (phe Pháp) cho đến khi Marseillaise tan dần.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n21
  cau: 'Mục 3: kết: quốc ca Nga hoàng God Save the Tsar! cùng chuông và đại bác.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n24
  cau: 'Bảng Nghe để luyện: Tchaikovsky, 1812: hai quốc ca đối đầu.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n25
  cau: 'Bảng Nghe để luyện: Mendelssohn, Hebrides: hình ảnh sóng biển.'
  loai: cau-truc
- trang: hinh-thuc/overture
  id: n26
  cau: 'Bảng Nghe để luyện: Mozart, Don Giovanni, Overture của một opera: chơi trước khi opera bắt đầu.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n1
  cau: Rondo là hình thức có một đoạn chính (A) quay lại nhiều lần, xen giữa là các đoạn tương phản.
  loai: dinh-nghia
- trang: hinh-thuc/rondo
  id: n2
  cau: 'Sơ đồ rondo năm đoạn: A – B – A – C – A, có khi dài hơn.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n4
  cau: Rondo hay dùng cho chương cuối của sonata, concerto và giao hưởng thời Cổ điển.
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n5
  cau: 'Sơ đồ (hình): A, rồi B tương phản, A, C tương phản, A.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n6
  cau: Für Elise của Beethoven có danh mục WoO 59.
  loai: danh-muc
- trang: hinh-thuc/rondo
  id: n7
  cau: Für Elise là Bagatelle cung La thứ.
  loai: ten
- trang: hinh-thuc/rondo
  id: n8
  cau: Für Elise viết khoảng 1810.
  loai: nam
- trang: hinh-thuc/rondo
  id: n9
  cau: Für Elise xuất bản sau khi Beethoven mất.
  loai: nam
- trang: hinh-thuc/rondo
  id: n10
  cau: Bản nhạc ngắn nhưng có đủ hình thức rondo năm đoạn.
  loai: so-lieu
- trang: hinh-thuc/rondo
  id: n11
  cau: Für Elise có đủ hình thức rondo A – B – A – C – A.
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n12
  cau: Đoạn A ở La thứ, giai điệu Mi – Rê♯ – Mi – Rê♯…
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n13
  cau: 'Đoạn B: giai điệu mới, sáng hơn (giọng trưởng), rồi chuỗi nốt nhanh; giọng Fa trưởng, rồi Đô trưởng.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n14
  cau: 'Đoạn A thứ hai: La thứ, giai điệu chính trở lại nguyên vẹn.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n15
  cau: Đoạn C ở La thứ, trên âm nền La ở bè trầm; đoạn không rời giọng chính.
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n16
  cau: Ở đoạn C, nốt La lặp lại dồn dập ở tay trái.
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n17
  cau: 'Cũ: "căng thẳng, kịch tính nhất bài" (đoạn C).'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n18
  cau: 'Đoạn A cuối: trở lại lần cuối, rồi bài kết thúc.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n19
  cau: Giai điệu A xuất hiện ba lần, cách nhau bởi B và C (hai lần quay lại).
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n21
  cau: Mozart, chương 3 Sonata piano K. 331, Rondo alla Turca.
  loai: ten
- trang: hinh-thuc/rondo
  id: n22
  cau: Rondo alla Turca mô phỏng âm nhạc quân đội Ottoman (Janissary), một ví dụ nổi tiếng của thể loại alla turca.
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n23
  cau: 'Cũ: "rất phổ biến ở Vienna thời đó" (Rondo alla Turca).'
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n24
  cau: 'Chương cuối của nhiều concerto thời Cổ điển, như concerto của Mozart: thường là rondo hoặc sonata – rondo.'
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n26
  cau: Hình thức ritornello của concerto Baroque cũng dựa trên ý tưởng "một đoạn quay lại nhiều lần" (ritornello xen với các đoạn độc tấu).
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n28
  cau: 'Câu hỏi 1: sơ đồ của rondo năm đoạn là A – B – A – C – A (không phải A – B – A hay A – A'' – A'''' – A''''''); giải thích: A – B – A là ba đoạn, A – A'' – A'''' là biến tấu.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n29
  cau: 'Câu hỏi 2: rondo thường dùng cho chương cuối (không phải chương đầu hay chương chậm); giải thích: rondo là hình thức quen thuộc cho chương cuối của sonata và concerto thời Cổ điển.'
  loai: lich-su
- trang: hinh-thuc/rondo
  id: n30
  cau: 'Câu hỏi 3: đặc điểm của đoạn C là bè trầm giữ nốt La làm âm nền (không phải chuyển sang nhịp 3/4, không phải chuyển hẳn sang giọng trưởng); giải thích: đoạn C ở La thứ, trên âm nền La; bài vẫn ở nhịp 3/8.'
  loai: cau-truc
- trang: hinh-thuc/rondo
  id: n3
  cau: Đoạn A quay về giống như điệp khúc của một bài hát, nên tai dễ nhận ra.
  loai: khuyen-tap
- trang: hinh-thuc/scherzo
  id: s1
  cau: Scherzo trong tiếng Ý nghĩa là "trò đùa".
  loai: dinh-nghia
- trang: hinh-thuc/scherzo
  id: s2
  cau: Scherzo là chương nhạc nhanh, thường ở nhịp 3, nhiều bất ngờ về cường độ và màu dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/scherzo
  id: s3
  cau: Beethoven viết scherzo cho gần hết chín giao hưởng của mình.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s4
  cau: Scherzo thay thế minuet trang nhã của thời Cổ điển.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s5
  cau: Beethoven giữ khung ABA của minuet (Scherzo – Trio – Scherzo da capo) và nhịp 3.
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s8
  cau: 'Bảng: minuet có tốc độ vừa phải, như bước nhảy.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s9
  cau: 'Bảng: scherzo nhanh hơn nhiều.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s10
  cau: 'Bảng: minuet trang nhã, như điệu nhảy cung đình.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s11
  cau: 'Bảng: scherzo hóm hỉnh, nhiều bất ngờ, có khi dữ dội.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s12
  cau: 'Bảng: trio của minuet là đoạn giữa dịu hơn minuet.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s13
  cau: 'Bảng: trio của scherzo là đoạn giữa tương phản với scherzo, có thể rất khác về tính cách.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s14
  cau: Giao hưởng số 1 của Beethoven viết 1799–1800.
  loai: nam
- trang: hinh-thuc/scherzo
  id: s15
  cau: Chương 3 Giao hưởng số 1 còn ghi là minuet (Allegro molto e vivace), nhanh như scherzo.
  loai: ten
- trang: hinh-thuc/scherzo
  id: s16
  cau: Giao hưởng số 2 (viết 1800–1802) là bản đầu tiên ghi thẳng Scherzo ở chương 3.
  loai: ten
- trang: hinh-thuc/scherzo
  id: s17
  cau: Sau đó ông viết scherzo cho gần hết các giao hưởng còn lại (số 8 giữ Tempo di Menuetto).
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s18
  cau: Sang thế kỷ 19 scherzo thay minuet trong nhiều giao hưởng, tứ tấu và sonata.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s19
  cau: Giao hưởng số 5 của Beethoven, chương 3 là scherzo cung Đô thứ.
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s20
  cau: Chương scherzo Giao hưởng số 5 chảy thẳng vào chương cuối (attacca).
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s21
  cau: Đoạn nối giữa scherzo và chương cuối của Giao hưởng số 5 thường được xem là một trong những chuyển đoạn hay nhất trong âm nhạc.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s22
  cau: 'Bảng: scherzo mở đầu bằng cello và contrabass, nhạc khí gỗ đáp lại; rồi kèn horn vang lên chủ đề chính của chương.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s23
  cau: 'Bảng: trio chuyển sang Đô trưởng, viết đối âm (contrapuntal).'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s24
  cau: 'Bảng: scherzo da capo trở lại lần cuối, do dây chơi pizzicato và rất nhỏ.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s25
  cau: 'Bảng: đoạn chuyển là một đoạn nối dẫn thẳng sang chương cuối, không ngắt.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s26
  cau: 'Bảng: chương 4 vào ngay (attacca), ở Đô trưởng.'
  loai: cau-truc
- trang: hinh-thuc/scherzo
  id: s29
  cau: Trong Giao hưởng số 9, Beethoven đặt scherzo ở chương 2 (thay vì chương 3), trước chương chậm.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s30
  cau: 'Cũ: "chương dài và dữ dội; ở cuối chương, trio vừa bắt đầu quay lại thì bị cắt ngang" (scherzo Giao hưởng số 9); "Mahler sau này cũng hay xáo trộn vị trí các chương."'
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s31
  cau: 'Scherzo còn đứng riêng, ngoài giao hưởng: scherzo trong nhạc sân khấu Giấc mộng đêm hè Op. 61 của Mendelssohn (1842–43).'
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s32
  cau: Chopin viết bốn scherzo cho piano, nơi những đoạn dữ dội, hơi u tối xen với trio trữ tình.
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s33
  cau: Chopin, Scherzo số 2 cung Si♭ thứ, scherzo cho piano độc tấu.
  loai: ten
- trang: hinh-thuc/scherzo
  id: s34
  cau: 'Bảng: Giao hưởng số 9, chương 2: scherzo ở vị trí chương 2, trước chương chậm.'
  loai: lich-su
- trang: hinh-thuc/scherzo
  id: s27
  cau: Nghe chương 3 và 4 liền nhau, chú ý đoạn nối giữa hai chương.
  loai: khuyen-tap
- trang: hinh-thuc/symphonic-poem
  id: n1
  cau: Tiếng Đức của symphonic poem là sinfonische Dichtung.
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n2
  cau: Richard Strauss ưa gọi thể loại này là Tondichtung, "thơ bằng âm thanh".
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n3
  cau: Symphonic poem là nhạc kể chuyện một chương cho dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n4
  cau: Franz Liszt đặt ra tên gọi symphonic poem và viết 13 tác phẩm như vậy.
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n5
  cau: Khác với giao hưởng "thuần túy", symphonic poem chỉ có một chương và bám theo một cốt truyện, bức tranh hay ý niệm có sẵn.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n6
  cau: Người nghe thường được cho một chương trình (program), vài dòng tóm tắt câu chuyện, rồi âm nhạc diễn lại bằng chủ đề và màu sắc dàn nhạc.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n7
  cau: 'Một nhân vật có thể có chủ đề riêng: Till Eulenspiegel có hai chủ đề, một cho kèn horn và một cho clarinet.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n8
  cau: Chủ đề có thể biến hình qua các đoạn, như trong Les Préludes của Liszt.
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n9
  cau: Hình thức của symphonic poem tự do, chỉ gần với hình thức sonata của chương đầu giao hưởng.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n10
  cau: Moldau (Vltava) là chương thứ hai trong chùm 6 symphonic poem Má vlast ("Tổ quốc tôi") của Smetana.
  loai: danh-muc
- trang: hinh-thuc/symphonic-poem
  id: n11
  cau: Moldau là chuyến xuôi dòng sông, từ hai con suối đầu nguồn đến khi sông chảy qua Prague.
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n12
  cau: 'Bảng Moldau, đoạn 1: hai con suối nhỏ (sáo) hợp thành sông; hai dòng nhạc mỏng hòa vào nhau.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n13
  cau: 'Bảng Moldau, đoạn 2: sông lớn dần; giai điệu Moldau nổi tiếng cất lên ở dây.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n14
  cau: 'Bảng Moldau, đoạn 3: thợ săn trong rừng; tiếng kèn horn.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n15
  cau: 'Bảng Moldau, đoạn 4: đám cưới nông dân; điệu nhảy vui (polka).'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n16
  cau: 'Bảng Moldau, đoạn 5: tiên nữ dưới trăng; sáo và oboe trao nhau câu nhạc cao, dây lung linh.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n17
  cau: 'Bảng Moldau, đoạn 6: thác ghềnh St. John; dàn nhạc ào ạt, dữ dội nhất.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n18
  cau: 'Bảng Moldau, đoạn 7: qua Prague, đổ ra sông Elbe; giai điệu Moldau trở lại, hùng tráng rồi xa dần.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n20
  cau: Les Préludes của Liszt được ưa chuộng nhất trong các symphonic poem của ông.
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n21
  cau: 'Les Préludes: câu hỏi "đời là gì?".'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n22
  cau: 'Smetana, Moldau: dòng sông Vltava.'
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n23
  cau: 'R. Strauss, Don Juan: gã Don Juan đa tình, kết thúc bi thảm.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n24
  cau: 'R. Strauss, Till Eulenspiegel: chàng láu cá Till và những trò tinh nghịch.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n25
  cau: 'Debussy, La mer (Biển cả): ba "phác thảo giao hưởng" về biển.'
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n26
  cau: 'Sibelius, Finlandia: lòng yêu nước Phần Lan.'
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n27
  cau: Tchaikovsky gọi 1812 là overture, Smetana gọi Moldau là symphonic poem.
  loai: ten
- trang: hinh-thuc/symphonic-poem
  id: n28
  cau: Cả overture hòa nhạc và symphonic poem đều là một chương cho dàn nhạc và có nội dung kể chuyện.
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n29
  cau: Symphonic poem phát triển từ concert overture, và một số concert overture gần với symphonic poem.
  loai: lich-su
- trang: hinh-thuc/symphonic-poem
  id: n30
  cau: 'Nhạc chương trình (program music) là khái niệm rộng hơn: nhạc dựa trên nội dung ngoài âm nhạc, như symphonic poem.'
  loai: dinh-nghia
- trang: hinh-thuc/symphonic-poem
  id: n33
  cau: 'Bảng Nghe để luyện: Liszt, Les Préludes: một chủ đề biến hình qua các đoạn.'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n34
  cau: 'Bảng Nghe để luyện: R. Strauss, Till Eulenspiegel: hai chủ đề của Till (láu cá).'
  loai: cau-truc
- trang: hinh-thuc/symphonic-poem
  id: n19
  cau: 'Nghe một mạch và đánh dấu mỗi lần cảnh đổi, âm nhạc đổi thế nào: bài tập nghe âm nhạc miêu tả.'
  loai: khuyen-tap
- trang: hinh-thuc/index
  id: n1
  cau: 'Hình thức là cách một bản nhạc được sắp xếp theo thời gian: đoạn nào lặp lại, đoạn nào tương phản.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n2
  cau: 'Thể loại là loại tác phẩm quen thuộc: giao hưởng, concerto, sonata…'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n10
  cau: 'Concerto và ritornello: một người đối thoại với cả dàn nhạc.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n11
  cau: 'Minuet và Trio: vũ khúc 3/4, minuet – trio – minuet, chương 3 giao hưởng thời Cổ điển.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n12
  cau: 'Scherzo: "trò đùa" của Beethoven thay minuet: nhanh, bất ngờ, đầy năng lượng.'
  loai: lich-su
- trang: hinh-thuc/index
  id: n13
  cau: 'Overture: khúc mở màn, từ mở đầu opera đến overture hòa nhạc độc lập.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n14
  cau: 'Symphonic poem: nhạc kể chuyện một chương của Liszt, Smetana, Strauss.'
  loai: lich-su
- trang: hinh-thuc/index
  id: n15
  cau: 'Người ta dùng chữ cái để gọi các đoạn nhạc: cùng chữ là cùng chất liệu, khác chữ là chất liệu mới.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n16
  cau: 'Hai đoạn: sơ đồ A B; hai phần, thường mỗi phần lặp lại; nghe thử: các điệu múa trong tổ khúc của Bach.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n17
  cau: 'Ba đoạn: A B A; đi xa rồi trở về; nghe thử: Chopin Mazurka La thứ Op. 17 số 4.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n18
  cau: 'Rondo: A B A C A …; một đoạn chính quay lại nhiều lần; Beethoven Für Elise.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n19
  cau: 'Chủ đề và biến tấu: A A'' A'''' A'''''' …; một giai điệu được biến đổi nhiều lần; Mozart K. 265.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n20
  cau: 'Minuet và trio: A B A; điệu múa 3/4, đoạn giữa (trio) thường nhẹ nhàng hơn; chương 3 nhiều giao hưởng của Haydn, Mozart.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n22
  cau: 'Hình thức sonata: quan trọng của thời Cổ điển, vẫn dùng ở thời Lãng mạn; thường cho chương đầu giao hưởng, sonata, concerto, tứ tấu; trình bày hai chủ đề ở hai giọng, phát triển, tái hiện cả hai ở giọng chính, thường có coda.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n23
  cau: 'Fugue là hình thức phức điệu xây trên sự bắt chước một chủ đề: chủ đề vào lần lượt ở từng bè, các bè đuổi theo và chồng lên nhau, xen giữa là các đoạn chuyển; các fugue của Bach là đỉnh cao của hình thức này.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n24
  cau: 'Giao hưởng: tác phẩm lớn cho dàn nhạc, thường 4 chương: nhanh (hình thức sonata) – chậm – minuet hoặc scherzo – nhanh.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n25
  cau: 'Concerto: một nhạc cụ độc tấu cùng dàn nhạc, thường 3 chương nhanh – chậm – nhanh; gần cuối chương 1 thường có cadenza.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n26
  cau: 'Sonata: tác phẩm cho một nhạc cụ (thường là piano) hoặc một nhạc cụ cùng piano, gồm vài chương.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n27
  cau: 'Tứ tấu đàn dây: hai violin, một viola, một cello; được xem là phương tiện hàng đầu để nhà soạn nhạc thể hiện ý tưởng trong nhạc thính phòng.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n28
  cau: 'Tổ khúc: chuỗi các điệu múa; tổ khúc Baroque thường gồm allemande, courante, sarabande, gigue.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n29
  cau: 'Opera: kịch hát với dàn nhạc, có dàn dựng sân khấu; oratorio tương tự nhưng không dàn dựng, thường về đề tài tôn giáo.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n30
  cau: 'Thánh lễ (mass) và Requiem: nhạc cho nghi lễ Công giáo; Requiem là lễ cầu hồn.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n31
  cau: 'Ca khúc nghệ thuật (Lied): bài hát cho giọng hát và piano; Schubert và Schumann là hai nhà soạn nhạc tiêu biểu.'
  loai: dinh-nghia
- trang: hinh-thuc/index
  id: n32
  cau: 'Tiểu phẩm cho piano: nocturne, étude, prélude, ballade, impromptu; Chopin viết nhiều bản thuộc các thể loại này.'
  loai: lich-su
- trang: hinh-thuc/index
  id: n3
  cau: Biết hình thức giúp bạn không bị "lạc" khi nghe một tác phẩm dài 40 phút.
  loai: khuyen-tap
