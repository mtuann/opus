  loai: nam
- trang: lich-su/dong-thoi-gian
  id: t25
  cau: '1980: Đặng Thái Sơn đoạt giải Nhất cuộc thi Chopin.'
  loai: nam
- trang: lich-su/dong-thoi-gian
  id: t26
