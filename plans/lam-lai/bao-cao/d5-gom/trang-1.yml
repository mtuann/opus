  loai: nam
- trang: lich-su/dong-thoi-gian
  id: t27
  cau: '2023: Nhà hát Hồ Gươm khánh thành ở Hà Nội.'
  loai: nam
- trang: lich-su/dong-thoi-gian
  id: t28
  cau: '2025: Cuộc thi Chopin lần thứ 19; Eric Lu đoạt giải Nhất.'
  loai: nam
- trang: lich-su/dong-thoi-gian
  id: t30
  cau: 'Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music; Grove Music Online; Encyclopaedia Britannica.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: m1
  cau: 'Monteverdi (1567–1643): người đứng ở ranh giới Phục hưng và Baroque.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: m2
  cau: Vở L'Orfeo (1607) của ông là một trong những opera đầu tiên và là vở sớm nhất còn được diễn thường xuyên.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: m3
  cau: Ông bảo vệ quan niệm âm nhạc phải phục vụ lời và cảm xúc, kể cả khi phải phá quy tắc hòa âm cũ.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: m4
  cau: 'Nghe trước: L''Orfeo; Vespro della Beata Vergine (1610); madrigal Lamento della ninfa.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: p1
  cau: 'Henry Purcell: một trong những nhà soạn nhạc Anh vĩ đại nhất, mất năm 36 tuổi.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: p2
  cau: Purcell là bậc thầy của bè trầm lặp lại (ground bass) và phổ nhạc cho tiếng Anh.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: p3
  cau: 'Nghe trước: Dido and Aeneas, aria When I am laid in earth; Music for the Funeral of Queen Mary; Rondeau trong Abdelazer (chủ đề Britten dùng cho Young Person''s Guide).'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: v1
  cau: 'Antonio Vivaldi (1678–1741): linh mục và nghệ sĩ violin người Venice, dạy nhạc nhiều năm tại một trại trẻ mồ côi nữ có dàn nhạc nổi tiếng.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: v2
  cau: Ông viết hơn 500 concerto và góp phần chuẩn hóa concerto ba chương (nhanh – chậm – nhanh).
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: v3
  cau: 'Nghe trước: Bốn Mùa; Concerto cho hai violin cung La thứ RV 522; Gloria RV 589.'
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: b1
  cau: 'J. S. Bach: nghệ sĩ organ bậc thầy, từ năm 1723 làm cantor (giám đốc âm nhạc) ở Leipzig suốt 27 năm cuối đời.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b2
  cau: Bach là bậc thầy tuyệt đối của phức điệu và fugue.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b3
  cau: Sinh thời ông nổi tiếng nhất với tài chơi organ, và rất ít tác phẩm của ông được in khi ông còn sống.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b4
  cau: Làn sóng "tái khám phá" Bach thường được tính từ năm 1829, khi Mendelssohn dàn dựng lại Thương khó theo Thánh Matthew.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: b5
  cau: 'Nghe trước: Prelude cung Đô trưởng; Tổ khúc cello số 1; Brandenburg Concerto số 3; Thương khó theo Thánh Matthew.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: h1
  cau: 'Handel (1685–1759): sinh ở Đức cùng năm với Bach, nhưng làm nên sự nghiệp ở London với opera Ý và sau đó là oratorio tiếng Anh.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: h2
  cau: 'Nghe trước: Messiah; Water Music; Music for the Royal Fireworks.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: y1
  cau: 'Joseph Haydn: phục vụ gia đình quý tộc Esterházy gần 30 năm.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: y2
  cau: Haydn được gọi là "cha đẻ của giao hưởng" và "cha đẻ của tứ tấu đàn dây" vì đã góp phần định hình cả hai thể loại.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: y3
  cau: Ông viết 104 bản giao hưởng, nổi tiếng với sự hóm hỉnh và bất ngờ.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: y4
  cau: 'Nghe trước: Giao hưởng số 94 Surprise; Tứ tấu đàn dây Op. 76 số 3 Hoàng đế; oratorio Sự sáng tạo.'
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: z1
  cau: 'Mozart: thần đồng biểu diễn khắp châu Âu từ năm 6 tuổi.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: z2
  cau: Mozart sống chỉ 35 năm nhưng để lại khoảng 600 tác phẩm ở mọi thể loại.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: z3
  cau: Các tác phẩm của Mozart được đánh số theo danh mục Köchel (K.).
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: z4
  cau: 'Nghe trước (Mozart): Giao hưởng số 40; Eine kleine Nachtmusik K. 525; Concerto piano số 21 K. 467; opera Cây sáo thần (aria Nữ hoàng bóng đêm).'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: e1
  cau: Beethoven học ở Vienna, có thời gian học với Haydn.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: e2
  cau: Beethoven bắt đầu bị mất thính lực từ khoảng năm 1798; bệnh nặng dần, và ông gần như điếc hoàn toàn khi viết những tác phẩm cuối đời.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: e3
  cau: Beethoven là cây cầu từ Cổ điển sang Lãng mạn, đưa giao hưởng và sonata lên quy mô và chiều sâu chưa từng có.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: e4
  cau: 'Nghe trước (Beethoven): Giao hưởng số 5; Sonata piano Ánh trăng; Giao hưởng số 9; Tứ tấu đàn dây Op. 132.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: u1
  cau: Mất năm 31 tuổi, Schubert viết hơn 600 ca khúc nghệ thuật (Lied), biến thể loại này thành đỉnh cao của nhạc Lãng mạn.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: u2
  cau: 'Nghe trước (Schubert): Erlkönig; Ngũ tấu Con cá hồi; Giao hưởng số 8 Dang dở.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: n1
  cau: 'Mendelssohn: thần đồng âm nhạc, viết Bát tấu đàn dây năm 16 tuổi và khúc mở màn Giấc mộng đêm hè năm 17 tuổi.'
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: n2
  cau: Mendelssohn là nhạc trưởng dàn nhạc Gewandhaus Leipzig và người dàn dựng lại Thương khó theo Thánh Matthew của Bach năm 1829, khơi dậy phong trào phục hưng âm nhạc Bach.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: n3
  cau: Chị gái Mendelssohn là Fanny Mendelssohn Hensel.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: n4
  cau: 'Nghe trước (Mendelssohn): Concerto violin cung Mi thứ; khúc mở màn Giấc mộng đêm hè; Giao hưởng số 4 Ý.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: n5
  cau: Mục Mendelssohn (1809) được xếp trước Chopin (1810) và Schumann (1810), theo thứ tự năm sinh.
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: c1
  cau: Chopin sinh ở Ba Lan, từ năm 1831 sống và làm việc ở Paris.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: c2
  cau: Gần như mọi tác phẩm của Chopin đều cho piano.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: c3
  cau: Chopin được xếp vào hàng những "nhà thơ âm thanh" (tone poet) lớn nhất.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: c4
  cau: 'Nghe trước (Chopin): Nocturne Op. 9 số 2; Ballade số 1; Étude Op. 10 số 3.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: r1
  cau: Schumann là nhà soạn nhạc, nhà phê bình âm nhạc, sáng lập tạp chí Neue Zeitschrift für Musik và viết bài ca ngợi Chopin, Brahms.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: r2
  cau: Schumann là chồng của nghệ sĩ piano Clara Schumann.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: r3
  cau: Những năm cuối đời Schumann bị bệnh tâm thần nặng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: r4
  cau: 'Nghe trước (Schumann): Kinderszenen Op. 15 (có Träumerei); Dichterliebe Op. 48; Concerto piano cung La thứ.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: l1
  cau: Liszt là một trong những nghệ sĩ piano điêu luyện nhất thế kỷ 19, người tạo ra buổi độc tấu piano (recital) theo kiểu hiện đại và thể loại thơ giao hưởng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: l2
  cau: 'Nghe trước (Liszt): Liebestraum số 3; Hungarian Rhapsody số 2; Sonata cung Si thứ.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: w1
  cau: 'Wagner cách mạng hóa opera thành thứ thường được gọi là nhạc kịch (Musikdrama, thuật ngữ mà chính Wagner không ưa): âm nhạc liền mạch, không chia aria, các leitmotif gắn với nhân vật và ý tưởng.'
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: w2
  cau: Wagner tự viết lời và xây nhà hát riêng ở Bayreuth.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: w3
  cau: Hòa âm của Tristan und Isolde mở đường cho âm nhạc thế kỷ 20.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: w4
  cau: Quan điểm bài Do Thái trong các bài viết của Wagner vẫn là vấn đề gây tranh cãi khi biểu diễn và đánh giá ông.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: w5
  cau: 'Nghe trước (Wagner): Tristan und Isolde, Khúc dạo đầu; Die Walküre, Cuộc phi ngựa của các Valkyrie; Siegfried Idyll.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: d1
  cau: Verdi là nhà soạn opera Ý có ảnh hưởng và được yêu thích nhất nửa sau thế kỷ 19, sinh cùng năm với Wagner.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: d2
  cau: Opera của Verdi kịch tính, giai điệu mạnh mẽ, thường được gắn với phong trào thống nhất nước Ý.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: d3
  cau: Verdi viết opera đến tận tuổi gần 80 (Falstaff, 1893).
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: d4
  cau: 'Nghe trước (Verdi): La traviata; Rigoletto, aria La donna è mobile; Requiem, đoạn Dies irae.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: a1
  cau: Brahms là người kế thừa truyền thống Beethoven, kết hợp hình thức chặt chẽ với cảm xúc Lãng mạn sâu lắng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: a2
  cau: 'Dấu vân tay của Brahms: cấu trúc cổ điển chặt chẽ cùng nhiều phát triển chủ đề mới mẻ, và sở trường về hình thức biến tấu.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: a3
  cau: 'Nghe trước (Brahms): Giao hưởng số 4; Concerto violin; Hungarian Dances.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: i1
  cau: Bizet là nhà soạn nhạc Pháp, mất năm 36 tuổi chỉ vài tháng sau khi vở opera Carmen ra mắt.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: i2
  cau: Carmen ban đầu bị chê là "vô luân và thô tục" nhưng sau đó trở thành một trong những opera được yêu thích nhất thế giới.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: i3
  cau: Âm nhạc Bizet đầy màu sắc Tây Ban Nha và giai điệu bắt tai.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: i4
  cau: 'Nghe trước (Bizet): Carmen (Habanera); L''Arlésienne, tổ khúc; Les Pêcheurs de perles (Người mò ngọc trai).'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: t1
  cau: Tchaikovsky là nhà soạn nhạc Nga nổi tiếng với giai điệu dễ nhớ, tác giả của ba vở ballet nổi tiếng bậc nhất thế giới.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: t2
  cau: 'Dấu vân tay của Tchaikovsky: giai điệu đẹp đến nao lòng, dàn nhạc phối khí rực rỡ nhiều màu sắc, và cảm xúc nồng nhiệt, hướng thẳng vào trái tim.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: t3
  cau: 'Nghe trước (Tchaikovsky): Hồ thiên nga; Concerto piano số 1; Giao hưởng số 6 Bi tráng.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: o1
  cau: Dvořák là nhà soạn nhạc Séc đưa chất dân ca vào nhạc giao hưởng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: o2
  cau: Dvořák sống ở Mỹ ba năm và viết Giao hưởng số 9 tại đó.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: o3
  cau: 'Dấu vân tay của Dvořák: giai điệu tươi sáng, mộc mạc như dân ca; tiết tấu nảy, rộn ràng; âm nhạc thường toát lên niềm vui sống và nỗi nhớ quê hương.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: o4
  cau: 'Nghe trước (Dvořák): Giao hưởng số 9 Từ Thế giới mới (chương Largo); Concerto cello; Tứ tấu đàn dây Mỹ.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: g1
  cau: Grieg là nhà soạn nhạc Na Uy, đưa dân ca và phong cảnh Bắc Âu vào nhạc cổ điển; nổi tiếng với các tiểu phẩm ngắn (10 tập Lyric Pieces cho piano).
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: g2
  cau: 'Dấu vân tay của Grieg: những tiểu phẩm giàu chất thơ, gắn với dân ca và phong cảnh Na Uy; ông tránh các hình thức lớn như opera hay giao hưởng.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: g3
  cau: 'Nghe trước (Grieg): Peer Gynt: Buổi sáng, Trong cung điện vua núi; Concerto piano cung La thứ; Holberg Suite.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: x1
  cau: Elgar là nhà soạn nhạc Anh tự học phần lớn, nổi tiếng muộn ở tuổi ngoài 40 với Enigma Variations.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: x2
  cau: Tác phẩm của Elgar mở ra thời kỳ nở rộ hiện đại của âm nhạc Anh.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: x3
  cau: 'Nghe trước (Elgar): Enigma Variations, biến tấu Nimrod; Concerto cello cung Mi thứ; Pomp and Circumstance số 1.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: q1
  cau: 'Puccini là nhà soạn opera Ý với nhiều vở theo trường phái verismo: đời sống thường ngày, cảm xúc mãnh liệt, giai điệu không thể quên.'
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: q2
  cau: Opera của Puccini thuộc nhóm được diễn nhiều nhất thế giới.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: q3
  cau: Turandot dang dở khi Puccini mất.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: q4
  cau: 'Nghe trước (Puccini): La bohème; Tosca; Gianni Schicchi, aria O mio babbino caro.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: k1
  cau: Mahler là nhạc trưởng lừng danh, tác giả những bản giao hưởng khổng lồ, có bản cần hàng trăm người biểu diễn.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: k2
  cau: 'Nghe trước (Mahler): Giao hưởng số 1 Titan; Giao hưởng số 5, chương 4 Adagietto; Giao hưởng số 2 Phục sinh.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: j1
  cau: Sibelius là nhà soạn nhạc Phần Lan, gắn chặt với bản sắc dân tộc Phần Lan (giai điệu Finlandia trở thành biểu tượng của khát vọng độc lập).
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: j2
  cau: Trong giao hưởng, Sibelius bỏ khuôn hình thức quen thuộc và xây nhạc bằng biến tấu và lặp lại một chủ đề cơ bản.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: j3
  cau: Sibelius gần như ngừng sáng tác trong 30 năm cuối đời.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: j4
  cau: 'Nghe trước (Sibelius): Finlandia; Concerto violin cung Rê thứ; Giao hưởng số 5.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: de1
  cau: Debussy là người Pháp, đại diện tiêu biểu của chủ nghĩa ấn tượng trong âm nhạc, với hệ thống hòa âm rất độc đáo và màu sắc âm thanh mới lạ.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: de2
  cau: 'Nghe trước (Debussy): Clair de lune; Prélude à l''après-midi d''un faune; La Mer.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: rc1
  cau: Rachmaninoff là nghệ sĩ piano và nhà soạn nhạc Nga, vẫn giữ phong cách Lãng mạn của cuối thế kỷ 19 sang tận thế kỷ 20.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: rc2
  cau: Rachmaninoff rời Nga sau Cách mạng 1917 và lấy nước Mỹ làm nơi sống chính.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: rc3
  cau: 'Nghe trước (Rachmaninoff): Concerto piano số 2; Rhapsody on a Theme of Paganini; Vocalise.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: ra1
  cau: Ravel thường được xếp cạnh Debussy, nhưng hai người khác nhau nhiều.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ra2
  cau: Âm nhạc của Ravel nổi tiếng chau chuốt, hoàn hảo về hình thức, và ông được xem là một trong những bậc thầy phối khí của thế kỷ 20.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ra3
  cau: 'Nghe trước (Ravel): Boléro; Pavane pour une infante défunte; Concerto piano cung Sol.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: ba1
  cau: Bartók là nhà soạn nhạc và nghệ sĩ piano Hungary, đồng thời là nhà dân tộc nhạc học.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ba2
  cau: Bartók đi khắp các làng quê Đông Âu ghi âm hàng nghìn bài dân ca bằng máy ghi âm ống sáp.
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: ba3
  cau: Âm nhạc của Bartók kết hợp tiết tấu dân gian với ngôn ngữ hiện đại.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ba4
  cau: Bartók mất vì bệnh bạch cầu ở New York năm 1945, sau những năm cuối đời nhiều khó khăn.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: ba5
  cau: 'Nghe trước (Bartók): Concerto cho dàn nhạc; Music for Strings, Percussion and Celesta; Mikrokosmos (153 bài piano từ dễ đến khó).'
  loai: so-lieu
- trang: lich-su/nha-soan-nhac
  id: st1
  cau: Stravinsky là người Nga, sống ở Pháp rồi Mỹ.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: st2
  cau: Buổi công diễn Le Sacre du printemps năm 1913 ở Paris gây náo loạn khán phòng và trở thành một trong những sự kiện nổi tiếng nhất lịch sử âm nhạc.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: st3
  cau: 'Nghe trước (Stravinsky): L''Oiseau de feu (Chim lửa); Le Sacre du printemps; Pulcinella.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: pr1
  cau: Prokofiev là nhà soạn nhạc Nga, sống ở phương Tây rồi chuyển hẳn về Liên Xô năm 1936.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: pr2
  cau: Âm nhạc của Prokofiev vừa trữ tình vừa châm biếm, ngôn ngữ sắc sảo, dí dỏm.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: pr3
  cau: Prokofiev mất cùng ngày với Stalin.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: pr4
  cau: 'Nghe trước (Prokofiev): Peter và chó sói; ballet Romeo và Juliet, Vũ điệu các hiệp sĩ; Giao hưởng số 1 Cổ điển.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: sh1
  cau: Shostakovich sáng tác dưới chế độ Xô viết, nhiều tác phẩm của ông chịu chuẩn mực nghệ thuật do nhà nước áp đặt; âm nhạc của ông có cả châm biếm lẫn nỗi đau cá nhân.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: sh2
  cau: 'Nghe trước (Shostakovich): Giao hưởng số 5; Waltz số 2 (trích Suite for Variety Orchestra); Tứ tấu đàn dây số 8.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: me1
  cau: 'Messiaen là nhà soạn nhạc Pháp, nghệ sĩ organ, người Công giáo sùng đạo và nhà nghiên cứu tiếng chim: ông ghi chép tiếng hót của hàng trăm loài chim và đưa vào âm nhạc.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: me2
  cau: Messiaen nghe âm thanh như màu sắc.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: me3
  cau: Học trò của Messiaen gồm Boulez và Stockhausen.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: me4
  cau: 'Nghe trước (Messiaen): Quatuor pour la fin du temps (viết trong trại tù binh 1940–1941); Turangalîla-Symphonie; Catalogue d''oiseaux.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: br1
  cau: Britten là một trong những nhà soạn nhạc Anh lớn nhất thế kỷ 20, đặc biệt ở opera và nhạc thanh nhạc.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: br2
  cau: Âm nhạc của Britten thường nói về những người lạc loài trong cộng đồng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: br3
  cau: 'Nghe trước (Britten): The Young Person''s Guide to the Orchestra; opera Peter Grimes, Four Sea Interludes; War Requiem.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: dd1
  cau: Mục "Đương đại" gồm Pärt, Reich, Glass, Adams, những người còn sống hay sinh sau 1935.
  loai: danh-muc
- trang: lich-su/nha-soan-nhac
  id: pa1
  cau: 'Pärt là nhà soạn nhạc Estonia, người khai sinh phong cách tintinnabuli (tiếng chuông): âm nhạc tối giản, tĩnh lặng, mang màu sắc tâm linh.'
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: pa2
  cau: Sau những năm đầu viết theo lối hiện đại, Pärt gần như im lặng rồi trở lại năm 1976 với phong cách mới; ông rời Liên Xô năm 1980.
  loai: nam
- trang: lich-su/nha-soan-nhac
  id: pa3
  cau: 'Nghe trước (Pärt): Spiegel im Spiegel; Für Alina; Tabula Rasa.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: re1
  cau: 'Reich là một trong những người khai sinh chủ nghĩa tối giản ở Mỹ: các mẫu ngắn lặp lại, lệch pha dần, biến đổi rất chậm.'
  loai: dinh-nghia
- trang: lich-su/nha-soan-nhac
  id: re2
  cau: Reich từng học nhạc trống ở Ghana và gamelan Bali.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: re3
  cau: 'Nghe trước (Reich): Music for 18 Musicians; Clapping Music (chỉ có hai người vỗ tay); Different Trains.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: gl1
  cau: Glass là nhà soạn nhạc tối giản Mỹ, học với Nadia Boulanger ở Paris và làm việc với Ravi Shankar.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: gl2
  cau: Glass viết opera, giao hưởng, rất nhiều nhạc phim.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: gl3
  cau: 'Nghe trước (Glass): Glassworks, Opening; opera Einstein on the Beach (1976); nhạc phim The Hours.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: ad1
  cau: 'Adams là nhà soạn nhạc Mỹ gắn với chủ nghĩa tối giản, kết hợp kỹ thuật lặp lại với những yếu tố biểu cảm kiểu tân Lãng mạn: tiết tấu lặp lại dồn dập, quy mô giao hưởng.'
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ad2
  cau: Adams nổi tiếng với các opera về những sự kiện lịch sử gần đây (Nixon in China, Doctor Atomic) và những tác phẩm dàn nhạc đầy năng lượng.
  loai: lich-su
- trang: lich-su/nha-soan-nhac
  id: ad3
  cau: 'Nghe trước (Adams): Short Ride in a Fast Machine; Harmonielehre; opera Nixon in China.'
  loai: ten
- trang: lich-su/nha-soan-nhac
  id: cu1
  cau: 'Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Richard Taruskin, The Oxford History of Western Music; Grove Music Online; Encyclopaedia Britannica.'
  loai: ten
