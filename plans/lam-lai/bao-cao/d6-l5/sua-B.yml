  truong: thong_tin
  cu: '[Độ khó, ''Khoảng ABRSM Grade 7 (ước lượng); nhà xuất bản Henle xếp mức 6 trên thang 9 ("trung bình")'']'
  moi: '[Độ khó, ''RCM xếp bài ở Level 9 (đề cương 2022); nhà xuất bản Henle xếp mức 6 trên thang 9 ("trung bình"); bài không có trong đề cương ABRSM 2017–2028'']'
  nhan_dinh: n22
