  ly_do: 'IMSLP: Composition Year 1830–31. Ấn bản Quốc gia Ba Lan: bản in đầu Pháp "M. Schlesinger … Paris 20 XII 1832", Đức "F. Kistner … Leipzig XII 1832". Trang bài học (Bối cảnh) đã viết "những năm ông rời Warsaw (cuối năm 1830) … đến Paris (1831)", khớp. Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang sau khi áp.'
