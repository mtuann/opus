  moi: '[Sáng tác / xuất bản, ''Khoảng 1830–1831, khi Chopin mới ngoài 20 tuổi; in tháng 12 năm 1832 ở Paris (Schlesinger) và Leipzig (Kistner). Bộ Op. 9 đề tặng bà Marie Pleyel, một nghệ sĩ piano nổi tiếng ở Paris'']'
