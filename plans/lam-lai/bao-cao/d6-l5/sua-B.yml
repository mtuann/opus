  - https://www.henle.de/en/Nocturnes/HN-185
  ly_do: 'Bỏ ước lượng ABRSM không nguồn, ghi đề cương có (như D6-L3-gom, mục "Grade và dữ liệu"). RCM 2022, tr. 83: "Nocturne in E flat Major, op. 9, no. 2", Level 9. ABRSM 2017–2028 không có bài: lần 1 (D2-0) n4 đã mở các đề cương. Chip "≈ Grade 7" giữ theo grade đã khóa. Nếu người gom muốn bỏ vế cuối (không có trong ABRSM) cho gọn thì bỏ. Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang.'
- ban_ghi: tac-pham/schubert-impromptu-sol-giang
  truong: hinh
  cu: 'hinh.nghe: chu_thich "Impromptu Sol♭ trưởng, D. 899 số 3: ba đoạn (gần đúng)."; độ rộng A 2, B 1.6, A'' 1.8'
  moi: 'hinh.nghe: chu_thich "Impromptu Sol♭ trưởng, D. 899 số 3: ba đoạn (độ dài theo số ô nhịp)."; độ rộng A 24, B 30, A'' 32 (mô tả ba đoạn giữ nguyên)'
  nhan_dinh: n25
  nguon:
  - https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly
  - https://commons.wikimedia.org/wiki/File:Schubert%27s_Impromptu_no._3_in_G-flat_major,_D.899_-_Chiara_Bertoglio.ogg
  ly_do: 'Hình cũ vẽ B ngắn nhất, nhưng theo bản nhạc A = ô 1–24 (24 ô), B = ô 25–54 (30 ô, gồm đường về), A'' và coda = ô 55–86 (32 ô), khớp hinh.bai-hoc và thong_tin (Hình thức); theo bản thu Bertoglio cũng vậy (≈ 99, 120, 139 giây). Có điều kiện: nếu người gom muốn giữ "gần đúng" theo cảm nhận khi nghe thì ít nhất đổi thứ tự độ dài cho B không ngắn hơn A (ví dụ 2, 2.5, 2.7). Hình hiện ở trang nghe-nhac/schubert-impromptu (::hinh-cau-truc): người giao kiểm doi_chu (chữ chu_thich đổi).'
