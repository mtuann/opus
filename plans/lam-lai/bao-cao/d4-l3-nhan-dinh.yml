- trang: piano/cach-tap
  id: n3
  cau: Ericsson và đồng nghiệp gọi những hoạt động đòi hỏi nỗ lực và được thiết kế để cải thiện thành tích là tập có chủ đích (deliberate practice).
  loai: dinh-nghia
- trang: piano/cach-tap
  id: n27
  cau: Khi bắt đầu căng tay ở một nấc tốc độ, hãy dừng tăng tốc độ và xem lại cách chơi (ví dụ ở ♩ = 76 của bảng).
  loai: quy-tac
- trang: piano/cach-tap
  id: n33
  cau: 'Buổi dài cần nghỉ thường hơn dòng "Nghỉ" của bảng: BAPAM khuyên tập khoảng 20 phút rồi nghỉ 10 phút.'
  loai: quy-tac
- trang: piano/cach-tap
  id: n48
  cau: "Tập liền một mạch hàng giờ là lỗi thường gặp: BAPAM khuyên tập khoảng 20 phút rồi nghỉ 10 phút; đau là tín hiệu dừng lại."
  loai: quy-tac
- trang: piano/cach-tap
  id: n54
  cau: K. Anders Ericsson, Ralf Th. Krampe, Clemens Tesch-Römer, "The role of deliberate practice in the acquisition of expert performance", Psychological Review 100(3), 1993.
  loai: ten
- trang: piano/cach-tap
  id: n55
  cau: Chuan C. Chang, Fundamentals of Piano Practice (sách điện tử trên readthedocs).
  loai: ten
- trang: piano/cach-tap
  id: n56
  cau: BAPAM, The Healthy Pianist (tờ thông tin cho người chơi piano), bản PDF.
  loai: ten
- trang: piano/cach-tap
  id: n57
  cau: "Practising the Piano (practisingthepiano.com): bài viết và video về cách tập."
  loai: ten
- trang: piano/cach-tap
  id: n58
  cau: Alvaro Pascual-Leone và cộng sự, "Modulation of muscle responses evoked by transcranial magnetic stimulation during the acquisition of new fine motor skills", Journal of Neurophysiology 74(3), 1995.
  loai: ten
- trang: piano/cach-tap
  id: n59
  cau: Gerald Klickstein, The Musician's Way (Oxford University Press, 2009); Molly Gebrian, Learn Faster, Perform Better (Oxford University Press, 2024).
  loai: ten
- trang: piano/cach-tap
  id: n16
  cau: "Bước 7: biến thể tiết tấu cho đoạn chạy nốt đều (dài–ngắn, ngắn–dài, đổi trọng âm); mỗi biến thể buộc ngón tay chuẩn bị nốt tiếp theo theo cách khác, nên khi về tiết tấu gốc đoạn chạy đều và chắc hơn."
  loai: khuyen-tap
- trang: piano/cach-tap
  id: n1
  cau: Ba mươi phút tập đúng cách có ích hơn hai giờ "chơi đi chơi lại từ đầu".
  loai: khuyen-tap
- trang: piano/cach-tap
  id: n19
  cau: "Bước 9: nối đoạn 1 với 2, rồi 1–2–3…; thử nối ngược (backward chaining): học đoạn cuối trước, rồi nối đoạn áp cuối vào; nhờ vậy phần cuối bài, nơi hay mệt và hồi hộp, là phần chắc nhất; luôn tập riêng các mối nối (hai ô cuối đoạn trước cộng hai ô đầu đoạn sau)."
  loai: khuyen-tap
- trang: piano/choi-cung-nguoi-khac
  id: n11
  cau: Nếu thầy chơi bè kia, bạn có thể bắt đầu rất sớm với những bài mà bè học trò chỉ dùng năm nốt.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n14
  cau: Piano bốn tay là hai người chung một đàn.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n16
  cau: Primo ngồi bên phải, secondo ngồi bên trái.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n19
  cau: "Bàn đạp: primo thường không đạp, secondo thường đạp."
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n21
  cau: Nhiều ấn bản in secondo ở trang trái, primo ở trang phải, cùng một đoạn nhạc.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n30
  cau: "Bài 1 (soạn cho trang này): secondo dạo một ô để đặt tốc độ, primo vào ở ô 2, trong thế tay năm ngón Đô5–Sol5."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n32
  cau: "Secondo chơi nhẹ hơn primo (p so với mf): nốt trầm rõ, hợp âm nhẹ."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n33
  cau: "Bài 2 (soạn cho trang này): primo chơi hai tay cách nhau một quãng tám, tay trái quanh Đô giữa, đúng chỗ tay phải secondo chơi hợp âm."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n34
  cau: "Ở phách 2 và 4 của ô 1 và ô 3, secondo cần đúng phím tay trái primo đang giữ (Mi4, Rê4, Fa4): secondo bỏ nốt đó, vì giai điệu đã có."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n35
  cau: "Ở phách 2 ô 2, Rê4 của primo nằm giữa Đô4 và Mi4 của secondo: secondo chơi ở mép phím, primo vào sâu."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n36
  cau: Bảng chỉ gồm tác phẩm viết gốc cho bốn tay.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n38
  cau: Diabelli, Melodische Übungsstücke Op. 149.
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n39
  cau: Diabelli Op. 149 có 28 bài ngắn, khó dần.
  loai: so-lieu
- trang: piano/choi-cung-nguoi-khac
  id: n40
  cau: "Diabelli Op. 149: bè học trò (primo) giữ mỗi tay trong một thế tay năm ngón; secondo dành cho thầy; từ chặng 3 thử chơi secondo."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n41
  cau: Ravel, Ma mère l'Oye (Mẹ Ngỗng, 1910).
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n42
  cau: Ma mère l'Oye là "năm bài cho trẻ em", viết cho Mimie và Jean Godebski, 6 và 7 tuổi.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n44
  cau: "Bizet, Jeux d'enfants (Trò chơi trẻ em) Op. 22 (1871): 12 bức tranh nhỏ về trò chơi trẻ con."
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n45
  cau: "Fauré, Dolly Op. 56: sáu bài cho cô bé Hélène Bardac, biệt danh Dolly."
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n46
  cau: Schubert, Trois marches militaires D. 733, in năm 1826 thành Op. 51; số 1 Rê trưởng nổi tiếng nhất.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n47
  cau: Mozart, Sonata Rê trưởng K. 381 (123a) và Sonata Đô trưởng K. 521 (1787), bốn tay.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n49
  cau: "Brahms, Ungarische Tänze (Vũ khúc Hungary) WoO 1: 21 bài, bốn tập (1869 và 1880); viết cho bốn tay trước khi thành bản dàn nhạc."
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n50
  cau: Dvořák, Slavonic Dances (Vũ khúc Slav) Op. 46 (1878), Op. 72 (1886); cũng viết cho bốn tay trước.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n52
  cau: "Schubert, Fantasia Fa thứ D. 940 (1828): bốn phần chơi liền, phần cuối có một fugue."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n54
  cau: Sonata Rê trưởng K. 448 (1781) của Mozart viết để ông chơi cùng học trò Josepha Auernhammer.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n56
  cau: "Ca khúc nghệ thuật (Lied tiếng Đức, mélodie tiếng Pháp): piano cùng kể chuyện với giọng hát."
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n57
  cau: Trong Erlkönig của Schubert, piano là tiếng vó ngựa phi suốt bài, rồi im bặt trước câu cuối.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n60
  cau: Colla voce (theo giọng hát) là piano đi theo; a tempo là trở lại tốc độ cũ.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n62
  cau: Ca khúc nghệ thuật thường in nhiều bản cho giọng cao, trung, trầm (hohe, mittlere, tiefe Stimme); hỏi trước ca sĩ dùng bản nào.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n65
  cau: "Giữ giọng cho ca sĩ: buổi tập ngắn, có nghỉ; ca sĩ được hát nhẹ, chỉ hát hết sức khi chạy bài."
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n66
  cau: "Bài 3 (soạn cho trang này): giai điệu trên hình đệm valse; piano dạo đầu hai ô; ô 6 là chỗ thở; ô 9 piano đi theo giai điệu; dấu ngân cuối hai bên nhả cùng lúc."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n67
  cau: "Tập với một người hát: lượt một đúng nhịp; lượt hai họ nán ở nốt Si ô 9 và bạn chờ; lượt ba họ vội ở ô 7–8, còn bạn giữ nhịp vững."
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n68
  cau: "Trong sonata cho violin, cello hay sáo, piano là bạn diễn ngang hàng: tên nhiều sonata ấy ghi piano trước, như Op. 24 của Beethoven và Op. 38 của Brahms: Sonate für Pianoforte und Violine (hay Violoncello), tức sonata cho piano và violin (hay cello)."
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n75
  cau: Schubert viết ba Sonatina cho violin D. 384, 385, 408.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n77
  cau: Fauré, Sicilienne Op. 78 cho cello và piano.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n78
  cau: Handel viết sonata cho sáo; phần piano viết ra từ bè trầm số.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n79
  cau: "Khi vững hơn: Mozart, Sonata Mi thứ K. 304; Beethoven, Sonata Fa trưởng Op. 24 cho violin."
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n80
  cau: Brahms, Sonata Mi thứ Op. 38 cho cello; Fauré, Fantaisie Op. 79 cho sáo.
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n81
  cau: Tam tấu piano gồm piano, violin, cello; tứ tấu piano thêm viola; ngũ tấu piano thường là piano với bốn đàn dây.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n82
  cau: Con cá hồi của Schubert là ngoại lệ, có contrabass thay violin thứ hai.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n83
  cau: Nghe chương 4 của Con cá hồi, để ý khi nào piano dẫn, khi nào nó im hẳn.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n85
  cau: Bắt đầu với tam tấu của Haydn, nơi piano nổi bật và cello phần lớn đi cùng bè trầm của piano.
  loai: cau-truc
- trang: piano/choi-cung-nguoi-khac
  id: n94
  cau: "Độ trễ thường làm việc chơi cùng lúc qua mạng rất khó, nhưng có thể song tấu từ xa: một người thu bè mình theo máy đếm nhịp, người kia đeo tai nghe chơi theo, rồi ghép hai bản thu."
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n95
  cau: Ngày nay người ta hay nói nghệ sĩ piano hợp tác (collaborative pianist) thay cho "người đệm đàn" (accompanist), để nhấn mạnh vai bạn diễn ngang hàng.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n96
  cau: Nghề này gồm đệm cho ca sĩ và nhạc công, làm répétiteur ở nhà hát opera (người tập vở cùng ca sĩ) và chơi nhạc thính phòng.
  loai: dinh-nghia
- trang: piano/choi-cung-nguoi-khac
  id: n97
  cau: Gerald Moore (1899–1987), nghệ sĩ piano người Anh.
  loai: nam
- trang: piano/choi-cung-nguoi-khac
  id: n98
  cau: 'Moore nhắc lại, với ý không đồng tình, lời "khen" của một ca sĩ dành cho người đệm Coenraad V. Bos: "Hôm nay chắc anh chơi hay lắm, vì tôi chẳng để ý thấy anh."'
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n99
  cau: Moore chơi cùng Dietrich Fischer-Dieskau, Elisabeth Schwarzkopf, Victoria de los Ángeles.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n100
  cau: Fischer-Dieskau viết rằng với Moore, bên phím đàn không còn "cái bóng nhợt nhạt" nữa.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n101
  cau: Buổi hòa nhạc chia tay của Moore năm 1967 ở Royal Festival Hall (London) có cả ba ca sĩ ấy.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n102
  cau: Buổi chia tay khép lại khi Moore chơi một mình bản chuyển soạn cho piano của An die Musik của Schubert.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n103
  cau: Tên hồi ký của ông, Am I Too Loud? (Tôi có to quá không?, 1962), cũng là câu người đệm nên tự hỏi.
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n104
  cau: Người góp phần lớn thay đổi cách nhìn về người đệm đàn là Gerald Moore.
  loai: lich-su
- trang: piano/choi-cung-nguoi-khac
  id: n105
  cau: "Câu hỏi 1: secondo thường giữ bàn đạp vì bè trầm quyết định hòa âm và ngồi bên trái thì chân phải với tới bàn đạp dễ dàng."
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n109
  cau: "Câu hỏi 5: khi chơi với violin, người chơi piano đưa nốt La, vì piano không chỉnh được cao độ tại chỗ; người chơi violin chỉnh dây La theo piano, rồi chỉnh các dây khác theo quãng năm."
  loai: quy-tac
- trang: piano/choi-cung-nguoi-khac
  id: n110
  cau: "Gerald Moore, The Unashamed Accompanist (London: Ascherberg, Hopwood & Crew, 1943); Singer and Accompanist: The Performance of Fifty Songs (London: Methuen, 1953); Am I Too Loud? Memoirs of an Accompanist (1962); The Schubert Song Cycles: With Thoughts on Performance (London: Hamish Hamilton, 1975)."
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n111
  cau: "Martin Katz, The Complete Collaborator: The Pianist as Partner (Oxford University Press, 2009)."
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n112
  cau: "Cameron McGraw, Piano Duet Repertoire: Music Originally Written for One Piano, Four Hands (Indiana University Press)."
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n113
  cau: "Diabelli Op. 149 có bản của Edition Peters (EP 2442); ấn bản Urtext: G. Henle Verlag, Bärenreiter, Wiener Urtext."
  loai: danh-muc
- trang: piano/choi-cung-nguoi-khac
  id: n114
  cau: Tìm trên IMSLP "Diabelli Op.149", "Jeux d'enfants", "Dolly Suite, Op.56", "Ma mère l'Oye (suite)", "Fantasie D.940".
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n115
  cau: "The Concise Oxford Dictionary of Music (Oxford University Press), qua Encyclopedia.com: các mục piano trio, piano quartet, piano quintet, lied, mélodie, colla voce, répétiteur."
  loai: ten
- trang: piano/choi-cung-nguoi-khac
  id: n106
  cau: "Câu hỏi 2: cùng một phím, cùng một lúc thì người có nốt trùng, thường là nốt trong hợp âm đệm, bỏ nốt đó."
  loai: khuyen-tap
- trang: piano/choi-cung-nguoi-khac
  id: n9
  cau: 'Bảng "Vì sao nên chơi cùng người khác": nhịp là của chung nên chậm lại một chút là lệch nhau ngay; chơi cùng thì nghe cả bè kia; đọc trước và đi tiếp, không kịp thì bỏ nốt không bỏ phách; có lịch hẹn và người chờ nên có động lực.'
  loai: khuyen-tap
- trang: piano/choi-cung-nguoi-khac
  id: n84
  cau: Trong bè piano, các bè đàn dây thường in nhỏ phía trên, nên bạn là người duy nhất thấy cả tổng phổ, và hay được trông vào để gọi chỗ bắt đầu lại.
  loai: khuyen-tap
- trang: piano/hoc-thuoc-bieu-dien
  id: n3
  cau: Trong kỳ thi Practical Grades của ABRSM (theo chương trình hiện hành), chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm riêng; chỉ gam và hợp âm rải là bắt buộc chơi thuộc.
  loai: cap-do
- trang: piano/hoc-thuoc-bieu-dien
  id: n5
  cau: "Có những nghệ sĩ lớn vẫn chơi với bản nhạc trên giá: những năm cuối sự nghiệp, Sviatoslav Richter biểu diễn trong khán phòng gần như tối, chỉ một ngọn đèn nhỏ chiếu lên bản nhạc trước mặt."
  loai: lich-su
- trang: piano/hoc-thuoc-bieu-dien
  id: n7
  cau: Muốn thuộc bền thì phải hiểu bài được xây thế nào.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n10
  cau: Khi chơi thuộc, người chơi dùng nhiều loại trí nhớ cùng lúc; người chơi chắc có nhiều đường dẫn đến cùng một nốt nhạc, một đường bị chặn thì còn đường khác.
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n11
  cau: 'Bốn loại trí nhớ: vận động ("thuộc tay": chuỗi chuyển động của ngón và tay, hình thành qua lặp lại), thính giác (nghe trước trong đầu điều sắp vang lên), thị giác (hình ảnh trang nhạc hoặc hình bàn tay trên phím), phân tích (hiểu cấu trúc: đoạn, giọng, hợp âm, chỗ lặp, chỗ khác).'
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n14
  cau: "Trí nhớ vận động giống một chuỗi mắt xích: mỗi chuyển động gọi chuyển động tiếp theo; nó nhanh và không tốn sự chú ý nên không thể thiếu, nhưng có hai điểm yếu."
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n15
  cau: 'Đứt một mắt là đứt cả chuỗi: một nốt sai, một tiếng ho, một ý nghĩ "đoạn sau là gì nhỉ?" và tay dừng; chuỗi chỉ chạy từ những chỗ bắt đầu quen thuộc nên phải quay lại đầu câu, có khi đầu bài.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n16
  cau: "Nó không chịu được sự soi xét: khi hồi hộp, bạn bắt đầu để ý từng ngón tay, đúng điều mà chuỗi tự động không chịu nổi."
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n17
  cau: "Trí nhớ vận động phụ thuộc hoàn cảnh: đàn lạ, ghế lạ, tốc độ khác (thường nhanh hơn vì hồi hộp) đều làm chuỗi dễ trật đường."
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n18
  cau: Nhà tâm lý học Roger Chaffin và nghệ sĩ piano Gabriela Imreh đã ghi lại và phân tích quá trình Imreh học chương cuối (Presto) của Italienisches Konzert (Concerto Ý), BWV 971, của Bach.
  loai: lich-su
- trang: piano/hoc-thuoc-bieu-dien
  id: n19
  cau: Imreh ghi lại việc tập, rồi mô tả cấu trúc bản nhạc và các quyết định về ngón bấm, phân câu và những điểm mốc (performance cues) bà chú ý tới lúc biểu diễn; các chỗ bà ngập ngừng khi chơi thuộc, và những chỗ bà còn nhớ hai năm sau, đều gắn với các điểm mốc ấy.
  loai: lich-su
- trang: piano/hoc-thuoc-bieu-dien
  id: n20
  cau: "Với các điểm mốc, người chơi mang trong đầu một bản đồ của tác phẩm: chẳng hạn ranh giới các đoạn, cảm xúc muốn truyền đến người nghe, cách phân câu, một ngón bấm then chốt; ngón tay chạy tự động, còn đầu óc đi theo bản đồ; khi có sự cố, các điểm mốc là chỗ để bám lại."
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n23
  cau: Chỗ rẽ nhánh (hai đoạn mở đầu giống nhau nhưng đi tiếp theo hai hướng khác nhau) rất hay gặp giữa phần trình bày và phần tái hiện của hình thức sonata.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n36
  cau: Trong các thí nghiệm với đoạn văn xuôi, Roediger và Karpicke (2006) thấy rằng tự kiểm tra bằng cách gợi lại từ trí nhớ giúp nhớ lâu hơn đọc lại (sau 2 ngày và sau 1 tuần), gọi là hiệu ứng kiểm tra.
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n47
  cau: "Hồi hộp trước khi biểu diễn rất phổ biến; nó gắn với adrenaline, chất giúp con người thoát khỏi nguy hiểm: tim có thể đập nhanh và cơ căng lên."
  loai: dinh-nghia
- trang: piano/hoc-thuoc-bieu-dien
  id: n48
  cau: Người ít kinh nghiệm hay chơi nhanh hơn mức bài chịu được vì hồi hộp.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n49
  cau: "Chuẩn bị kỹ và diễn thử nhiều lần: diễn thử cho bạn thêm kinh nghiệm và sự tự tin, và hai thứ ấy làm bớt nỗi sợ điều chưa biết."
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n50
  cau: Trong một thử nghiệm ngẫu nhiên với 46 nhạc công, chỉ một buổi tập thở chậm dài 30 phút đã giúp điều hòa phản ứng sinh lý khi chờ biểu diễn; những người vốn rất lo âu thì giảm lo âu nhiều hơn nhóm không tập (Wells và cộng sự, 2012).
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n52
  cau: Trong các thí nghiệm của Alison Wood Brooks (2014) với hát karaoke, nói trước người khác và làm toán, những người tự nhủ "Tôi đang hào hứng" làm tốt hơn những người cố tự trấn an "Bình tĩnh lại".
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n56
  cau: 'Uống rượu bia "cho bớt run": rượu làm giảm khả năng điều khiển tinh và phán đoán.'
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n57
  cau: "Không nên tự dùng thuốc chẹn beta hay xin của người khác: một số nhạc công dùng theo đơn bác sĩ, nhưng đó là thuốc kê đơn, không dùng được cho một số người (chẳng hạn người bị hen suyễn)."
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n60
  cau: Nếu hồi hộp khiến bạn khổ sở, né mọi dịp chơi cho người khác nghe, mất ngủ hoặc có những cơn hoảng sợ, hãy nói chuyện với bác sĩ hoặc chuyên gia tâm lý.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n61
  cau: Liệu pháp nhận thức – hành vi (CBT) là một hướng điều trị thường dùng cho lo âu.
  loai: quy-tac
- trang: piano/hoc-thuoc-bieu-dien
  id: n68
  cau: 'Câu hỏi 4: theo nghiên cứu của Brooks (2014), trước giờ lên sân khấu nên tự nhủ "Mình đang hào hứng" (hơn là "Bình tĩnh lại" hay "Đừng sai"); gọi cảm giác ấy là hào hứng giúp làm tốt hơn so với cố tự trấn an.'
  loai: so-lieu
- trang: piano/hoc-thuoc-bieu-dien
  id: n70
  cau: 'Mục Nguồn: Roger Chaffin, Gabriela Imreh, "Practicing perfection: Piano performance as expert memory", Psychological Science 13(4), 2002, tr. 342–349.'
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n71
  cau: "Mục Nguồn: thêm Chuan C. Chang, Fundamentals of Piano Practice (mục III.6, III.14, III.15); NHS (CBT, Beta blockers); Open Music Theory (Sonata form)."
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n72
  cau: 'Mục Nguồn: Henry L. Roediger III, Jeffrey D. Karpicke, "Test-enhanced learning: Taking memory tests improves long-term retention", Psychological Science 17(3), 2006; Alison Wood Brooks, "Get excited…", J. Exp. Psychol.: General 143(3), 2014, tr. 1144–1158; Wells và cộng sự, PLoS ONE 7(10), 2012, e46597; Stephen Plaistow, Gramophone, 10/1997.'
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n73
  cau: "Mục Nguồn: ABRSM, chương trình thi piano Practical Grades hiện hành, phần quy định về chơi thuộc."
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n74
  cau: "Mục Nguồn: Dianna T. Kenny, The Psychology of Music Performance Anxiety (OUP, 2011); Gerald Klickstein, The Musician's Way (OUP, 2009); Molly Gebrian, Learn Faster, Perform Better (OUP, 2024)."
  loai: ten
- trang: piano/hoc-thuoc-bieu-dien
  id: n66
  cau: 'Câu hỏi 1: "thuộc tay" mong manh vì đó là một chuỗi, đứt một mắt xích thì rất khó bắt lại giữa chừng; cần thêm trí nhớ thính giác, thị giác và phân tích làm đường dự phòng.'
  loai: khuyen-tap
- trang: piano/hoc-thuoc-bieu-dien
  id: n44
  cau: "Quy tắc số một khi biểu diễn: giữ nhịp, không quay lại; nhạc dừng giữa chừng làm hỏng cả mạch bài nhiều hơn một nốt sai."
  loai: khuyen-tap
- trang: piano/hoc-thuoc-bieu-dien
  id: n30
  cau: "Cách 5: rút gọn phần đệm tay trái thành hợp âm khối, ghi tên hợp âm hoặc số La Mã, rồi chơi trong khi hát giai điệu; khi đã thuộc khung, hình đệm chỉ là cách trang trí lên khung."
  loai: khuyen-tap
- trang: piano/lich-su-dan
  id: n1
  cau: Cây đàn bạn tập hôm nay là kết quả của hơn ba thế kỷ cải tiến.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n2
  cau: "Clavichord: một lưỡi đồng nhỏ (tangent) gõ vào dây rồi nằm lại trên dây cho đến khi nhả phím; to nhỏ theo lực ngón nhưng rất nhỏ tiếng; rung nhẹ ngón trên phím tạo tiếng rung (Bebung)."
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n3
  cau: Clavichord là nhạc cụ để tập và chơi ở nhà; C. P. E. Bach rất yêu thích nó.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n4
  cau: "Harpsichord: miếng gảy gắn trên con đẩy (jack) gảy dây; không to nhỏ theo lực ngón; là một trong những nhạc cụ phím quan trọng nhất của thời Baroque."
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n5
  cau: Harpsichord đổi màu tiếng bằng các bộ dây (register) và hai tầng phím.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n6
  cau: "Organ: hơi thổi qua ống; tiếng giữ nguyên chừng nào còn giữ phím; đổi màu bằng các bộ ống."
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n7
  cau: Trước năm 1700, người chơi nhạc phím có ba lựa chọn chính (clavichord, harpsichord, organ); không cái nào làm được điều piano làm được; ước mơ của người chơi thế kỷ 17 là nhạc cụ có sức vang của harpsichord mà "nói" theo ngón như clavichord.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n8
  cau: Bản kiểm kê nhạc cụ nhà Medici năm 1700 ghi một chiếc arpicimbalo "mới được Bartolomeo Cristofori phát minh", có búa và bộ giảm âm, âm vực bốn quãng tám; vì vậy năm 1700 thường được coi là năm sinh của piano.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n9
  cau: Bartolomeo Cristofori (1655–1732) phụ trách nhạc cụ cho hoàng tử Ferdinando de' Medici ở Florence.
  loai: nam
- trang: piano/lich-su-dan
  id: n10
  cau: Năm 1711, nhà văn Scipione Maffei viết bài mô tả chiếc đàn, gọi nó là gravicembalo col piano, e forte ("harpsichord có nhỏ và có to"); từ đó sinh ra hai chữ pianoforte và piano.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n11
  cau: "Điều thiên tài của Cristofori là bộ máy: búa gõ dây thay vì miếng gảy (bấm nhanh thì tiếng to, bấm chậm thì tiếng nhỏ); cơ cấu thoát cho búa rời dây ngay sau khi gõ; bộ giảm âm là miếng chặn rơi xuống dây khi nhả phím."
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n12
  cau: "Ba cây đàn của Cristofori còn tồn tại: cây năm 1720 ở Metropolitan (New York, 54 phím), cây 1722 ở Bảo tàng Nhạc cụ Quốc gia ở Rome, cây 1726 ở Bảo tàng Nhạc cụ của Đại học Leipzig."
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n13
  cau: Silbermann bắt đầu làm piano theo thiết kế Cristofori từ những năm 1730 sau khi đọc bài của Maffei dịch sang tiếng Đức năm 1725; Bach chê một cây đời đầu vì phím nặng và âm cao yếu, về sau khen và giúp bán đàn; Frederick Đại đế mua nhiều cây.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n14
  cau: Bài viết của Maffei được dịch sang tiếng Đức năm 1725.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n15
  cau: Bach đã chơi đàn Silbermann của vua Frederick ở cung điện Potsdam năm 1747, chuyến thăm sinh ra Musikalisches Opfer.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n16
  cau: Phần lớn nhạc phím của Bach được viết cho harpsichord, clavichord hoặc organ; chơi Bach trên piano là một lựa chọn diễn giải.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n17
  cau: Johann Andreas Stein (1728–1792) ở Augsburg đặt nền móng cho bộ máy Vienna (Prellmechanik) và được cho là người đưa vào cần đầu gối nhấc bộ giảm âm, tiền thân của bàn đạp vang; Anton Walter làm đàn theo mẫu này ở Vienna.
  loai: nam
- trang: piano/lich-su-dan
  id: n18
  cau: Con gái Stein, Nannette Streicher, chuyển xưởng đến Vienna năm 1794.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n19
  cau: "Đàn Vienna: phím nông và nhẹ, búa nhỏ, tiếng trong và tắt nhanh."
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n20
  cau: "Năm 1777, ở Augsburg, Mozart thử đàn Stein rồi viết thư kể cho cha: chạm phím cách nào tiếng vẫn đều, đàn giảm âm tốt hơn hẳn những cây ông từng chơi, và có cơ cấu thoát."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n21
  cau: Khoảng năm 1783 Mozart mua một cây đàn của Walter; cây đàn này nay ở Bảo tàng Mozart tại Salzburg.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n22
  cau: Ở London, Johannes Zumpe làm piano vuông nhỏ gọn từ những năm 1760, loại đàn gia đình rất được ưa chuộng.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n23
  cau: Các xưởng London, nổi bật là Broadwood, làm đàn cánh với bộ máy Anh (English action), khác hẳn bộ máy Vienna.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n24
  cau: Cả hai loại đàn thời này có âm vực khoảng năm quãng tám; đàn Stein chạy từ FF đến f''' (Fa1–Fa6).
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n25
  cau: Beethoven có một cây đàn Érard từ Paris năm 1803.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n26
  cau: "Beethoven có một cây Broadwood từ London (Thomas Broadwood tặng năm 1818): sáu quãng tám, từ CC đến c'''' (Đô1–Đô7)."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n27
  cau: "Beethoven có một cây của Conrad Graf ở Vienna năm 1825: sáu quãng tám rưỡi, từ CC đến f'''' (Đô1–Fa7)."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n28
  cau: Hình keyboard-ranges so âm vực các cây đàn với bàn phím 88 phím.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n29
  cau: Ở đầu chương 1 Sonata Ánh trăng, Beethoven ghi senza sordino, tức giữ bàn đạp suốt chương; trên đàn thời đó tiếng tắt nhanh nên chỉ thành lớp sương mỏng, trên đàn hiện đại thì hỗn độn.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n31
  cau: "Cơ cấu thoát kép của Érard (bằng sáng chế ở Anh năm 1821): đánh lại một nốt khi phím mới nhả lên một phần, nền tảng bộ máy đàn cánh hiện đại."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n32
  cau: "Khung sắt đúc: Jonas Chickering được cấp bằng sáng chế năm 1843 cho đàn cánh."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n33
  cau: "Khung sắt đúc: Alpheus Babcock (Mỹ) năm 1825 cho đàn vuông; tác dụng: chịu lực căng dây lớn nên dùng dây dày hơn, tiếng to hơn, giữ cao độ lâu hơn."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n34
  cau: "Búa bọc nỉ: Pape lấy bằng sáng chế năm 1826; thay dần búa bọc da, chỉ phổ biến hẳn sau năm 1855."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n35
  cau: "Dây bắt chéo (overstringing): Steinway, bằng sáng chế cho đàn cánh năm 1859; dây trầm dài chạy chéo phía trên dây cao, gần giữa bảng cộng hưởng, cho tiếng trầm đầy hơn."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n36
  cau: "Bàn đạp giữ âm (sostenuto): Claude Montal làm cơ cấu giữ âm năm 1862; Albert Steinway được cấp bằng sáng chế năm 1874; chỉ giữ ngân những nốt đang được giữ phím lúc nhấn bàn đạp."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n37
  cau: 88 phím, từ La0 đến Đô8, là âm vực chuẩn của đàn piano hiện đại.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n38
  cau: Chopin gắn bó với đàn Pleyel ở Paris (tiếng mềm, nhạy với sắc thái nhỏ); Liszt thường chơi đàn Érard (mạnh mẽ, lặp nốt nhanh).
  loai: lich-su
- trang: piano/lich-su-dan
  id: n39
  cau: Bösendorfer (Vienna, 1828).
  loai: nam
- trang: piano/lich-su-dan
  id: n40
  cau: Steinway & Sons (New York, 1853, do Henry Engelhard Steinway lập).
  loai: nam
- trang: piano/lich-su-dan
  id: n41
  cau: Xưởng Steinway ở Hamburg mở năm 1880.
  loai: nam
- trang: piano/lich-su-dan
  id: n42
  cau: C. Bechstein (Berlin, 1853).
  loai: nam
- trang: piano/lich-su-dan
  id: n43
  cau: Blüthner (Leipzig, 1853).
  loai: nam
- trang: piano/lich-su-dan
  id: n44
  cau: Đến giữa thế kỷ 19, đàn đứng nhỏ gọn thành món quen thuộc trong gia đình; khoảng năm 1800 nhiều thợ thử dựng dây theo chiều đứng, như đàn "hươu cao cổ" (giraffe) ở Vienna; vì thế thế kỷ 19 có nhiều nhạc dễ chơi, chuyển soạn và nhạc bốn tay.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n46
  cau: Yamaha làm cây piano đứng đầu tiên năm 1900.
  loai: nam
- trang: piano/lich-su-dan
  id: n47
  cau: Kawai thành lập năm 1927.
  loai: nam
- trang: piano/lich-su-dan
  id: n48
  cau: Fazioli (Sacile, Ý) thành lập năm 1981.
  loai: nam
- trang: piano/lich-su-dan
  id: n49
  cau: Fazioli là một trong những hãng đàn concert mới hiếm hoi của thế kỷ 20.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n50
  cau: Một số đàn concert của Bösendorfer có 97 phím, xuống tới Đô0.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n51
  cau: Chín phím thêm vào của Bösendorfer được sơn đen để người chơi không nhầm vị trí.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n52
  cau: Nhật Bản thành trung tâm sản xuất lớn; đàn Yamaha và Kawai rất phổ biến ở châu Á, kể cả Việt Nam.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n53
  cau: Piano điện phát những mẫu âm thu từ đàn thật, bộ phím có búa mô phỏng cảm giác đàn cơ, không cần lên dây, cắm tai nghe, nối máy tính qua MIDI.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n55
  cau: Các nghệ sĩ Malcolm Bilson, Andreas Staier, Kristian Bezuidenhout chơi Mozart, Beethoven, Schubert trên fortepiano thời đó hoặc bản sao.
  loai: lich-su
- trang: piano/lich-su-dan
  id: n56
  cau: "Phím là một đòn bẩy: bấm phím xuống thì đầu kia nâng bộ máy lên."
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n57
  cau: Con đẩy hất búa lên rồi thoát ra; ngay trước khi chạm dây búa bay tự do, gõ dây rồi rơi xuống; bạn không thể giữ búa trên dây hay nắn nốt sau khi đã gõ.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n58
  cau: Cần lặp (repetition lever) đỡ búa ở lưng chừng nên đánh lại được nốt khi phím mới nhả lên một phần; đó là cơ cấu thoát kép của Érard.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n59
  cau: Bộ giảm âm của mỗi nốt nhấc khỏi dây khi bấm phím và rơi xuống khi nhả phím; bàn đạp vang nhấc tất cả bộ giảm âm cùng lúc.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n60
  cau: Ở vùng trầm nhất, mỗi nốt có một dây quấn đồng; lên cao một chút hai dây; phần lớn bàn phím mỗi nốt có ba dây.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n61
  cau: Một cây piano có thể có tới 230 dây; tổng lực căng 16 tấn năm 1862 và có thể lên tới 30 tấn ở đàn hiện đại, do khung gang gánh chịu.
  loai: so-lieu
- trang: piano/lich-su-dan
  id: n62
  cau: Bảng cộng hưởng (soundboard) bằng gỗ vân sam nhận rung động từ dây qua cầu ngựa; bảng gỗ lớn này đẩy không khí và tạo âm lượng.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n64
  cau: Một khi búa đã rời dây, bạn chỉ còn điều khiển được lúc nào tiếng tắt; mọi màu tiếng đến từ tốc độ búa, cân bằng giữa các nốt vang cùng lúc, thời điểm và bàn đạp.
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n65
  cau: 'Bảng "Đàn xưa dạy gì": đàn thời Mozart, Beethoven có phím nhẹ và nông, tiếng tắt nhanh mỗi âm vực một màu, bè trầm trong và mỏng, bộ giảm âm yếu hơn; đàn hiện đại ngược lại.'
  loai: dinh-nghia
- trang: piano/lich-su-dan
  id: n67
  cau: "Quiz: Maffei năm 1711 gọi nó là gravicembalo col piano, e forte; người chơi harpsichord tạo tương phản bằng register và hai tầng phím; cần lặp đỡ búa ở lưng chừng, nền tảng bộ máy đàn cánh hiện đại; đàn Mozart tắt tiếng nhanh, bè trầm mỏng."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n68
  cau: "Nguồn: Metropolitan Museum of Art, hai bài Heilbrunn (The Pianofortes of Bartolomeo Cristofori (1655–1731); Viennese Instruments)."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n69
  cau: "Nguồn: Edwin M. Good, Giraffes, Black Dragons, and Other Pianos, Stanford University Press, tái bản lần 2, 2001; Cyril Ehrlich, The Piano: A History, Oxford University Press, 1976 (bản sửa 1990); David Rowland (chủ biên), The Cambridge Companion to the Piano, Cambridge University Press, 1998; Stuart Isacoff, A Natural History of the Piano, Knopf, 2011."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n70
  cau: "Nguồn: Thư của Mozart gửi cha từ Augsburg, tháng 10/1777, trong The Letters of Mozart and His Family (Emily Anderson dịch)."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n71
  cau: "Nguồn: Bằng sáng chế Hoa Kỳ số 3.238 (J. Chickering, 1843), số 26.532 (Steinway, 1859) và số 156.388 (Steinway, 1874)."
  loai: lich-su
- trang: piano/lich-su-dan
  id: n66
  cau: Đừng "đè" Mozart; ít bàn đạp, tách rõ staccato và luyến hai nốt; chơi hợp âm thấp và bè Alberti nhẹ; chỉ dẫn bàn đạp dài của Beethoven thường cần thay một phần hay nửa bàn đạp; hộp "Bài nghe so sánh".
  loai: khuyen-tap
- trang: piano/nha-soan-nhac
  id: n1
  cau: Trang tóm tắt cảm giác khi chơi nhạc của hơn 30 nhà soạn nhạc piano.
  loai: so-lieu
- trang: piano/nha-soan-nhac
  id: n2
  cau: '"Sau Grade 8" là trình độ diploma trở lên; "≈ Grade 5" là ước lượng theo thang ABRSM.'
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n4
  cau: 'Bảng "Muốn chơi… thì bắt đầu với…", dòng Bach, Mozart, Beethoven, Chopin, Schumann, nhạc thế kỷ 20: các bản và số hiệu đều có thật (Minuet Sol trưởng, Little Preludes, Invention số 1, Sinfonia, French Suites; Clementi Op. 36 số 1, Mozart K. 545 và K. 283; Für Elise, hai sonata Op. 49, Pathétique, Op. 79; Valse La thứ, Prélude Mi thứ, Nocturne Op. 9 số 2, Ballade số 1; Album für die Jugend, Träumerei, Kinderszenen, Waldszenen; Mikrokosmos, Kabalevsky Op. 39, Prokofiev Music for Children, Romanian Folk Dances).'
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n5
  cau: "Bảng \"Muốn chơi… thì bắt đầu với…\", các dòng còn lại: Czerny Op. 299 và Op. 740, Chopin Op. 25 số 1 và số 2 và ba Nouvelles études (étude vừa phải), Liszt Nuages gris, Consolation số 3, Liebestraum số 3, Un sospiro, Brahms Valse Op. 39 số 15, Intermezzo Op. 117 số 1 và Op. 118 số 2, Debussy Menuet sur le nom d'Haydn, Ravel Pavane, Rachmaninoff Prelude Op. 3 số 2 và Op. 23 số 4, Satie, Pärt Für Alina, Glass Opening, Gershwin Prelude số 2, Kapustin."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n6
  cau: 'Ba mục link ngoài dòng "Những người viết riêng cho người học": Carl Czerny (1791–1857, học trò của Beethoven, thầy của Liszt) với Op. 599, 299, 740; Burgmüller (1806–1874) Op. 100 (25 étude dễ); Stephen Heller (1813–1888) Op. 45–47; sonatina của Kuhlau và Diabelli.'
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n7
  cau: Phần lớn nhạc phím Baroque viết cho harpsichord hoặc clavichord, chưa có bàn đạp vang.
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n8
  cau: "Tên và năm sinh–mất ở các tiêu đề mục Baroque: François Couperin (1668–1733), Jean-Philippe Rameau (1683–1764), Domenico Scarlatti (1685–1757), J. S. Bach (1685–1750), G. F. Handel (1685–1759)."
  loai: nam
- trang: piano/nha-soan-nhac
  id: n9
  cau: "Couperin: bốn quyển Pièces de clavecin (1713–1730) gồm 27 ordre; sách L'art de toucher le clavecin (1716)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n10
  cau: L'art de toucher le clavecin là sách về ngón bấm, cách chạm phím và nốt hoa mỹ.
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n12
  cau: "Couperin, Bắt đầu bằng: Les Bergeries (có trong Notebook for Anna Magdalena Bach, 1725; ≈ Grade 5) → Sœur Monique (≈ Grade 6–7) → Les Barricades mystérieuses (≈ Grade 7–8) → Le Tic-Toc-Choc, hai tay đan chồng vì vốn viết cho hai tầng phím (sau Grade 8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n13
  cau: "Rameau: ba tập nhạc cho harpsichord (1706, 1724, khoảng 1726–1727) với Le Rappel des oiseaux, Tambourin, Les Sauvages, La Poule, Gavotte et six doubles; Hình ảnh cụ thể: tiếng chim, con gà mái cục tác (La Poule)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n15
  cau: "Rameau, Bắt đầu bằng: Menuet en rondeau Đô trưởng (≈ Grade 2–3) → Tambourin Mi thứ (≈ Grade 5) → Les Sauvages, Le Rappel des oiseaux (≈ Grade 6–7) → La Poule, Gavotte et six doubles (≈ Grade 8 trở lên)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n16
  cau: "Scarlatti: 555 sonata (K. 1–555)."
  loai: so-lieu
- trang: piano/nha-soan-nhac
  id: n17
  cau: "Scarlatti: phần lớn sonata một chương hai phần; 30 bản đầu in ở London khoảng 1738–1739 với tên Essercizi per gravicembalo."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n19
  cau: "Scarlatti, Bắt đầu bằng: K. 380 Mi trưởng (≈ Grade 7)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n20
  cau: "Scarlatti, Bắt đầu bằng: K. 32 Rê thứ, Aria (≈ Grade 4) → K. 1 Rê thứ, K. 466 Fa thứ (≈ Grade 6–7) → K. 141 Rê thứ, chuỗi nốt lặp rất nhanh (sau Grade 8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n21
  cau: "Bach, Tác phẩm chính: Notebook for Anna Magdalena Bach (1725), Little Preludes, 15 Invention và 15 Sinfonia, hai quyển Bình quân luật, Goldberg Variations (1741)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n22
  cau: "Bach: bản gốc gần như không ghi sắc thái hay dấu luyến, nên người chơi tự chọn cách phát âm."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n24
  cau: "Bach, Bắt đầu bằng: Minuet Sol trưởng của Petzold trong Notebook (≈ Grade 1–2) → Little Preludes như BWV 939, BWV 999 (≈ Grade 3–5) → Prelude Đô trưởng BWV 846 (≈ Grade 4–5)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n25
  cau: "Bach, Bắt đầu bằng: Invention số 1, số 4, số 8 (≈ Grade 4–5)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n26
  cau: "Bach, Bắt đầu bằng: Sinfonia, các chương trong French Suites, Prelude và fugue Đô thứ BWV 847 (≈ Grade 7–8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n27
  cau: "Bach, Bắt đầu bằng: các prelude và fugue khác trong Bình quân luật, Partita (sau Grade 8) → Goldberg."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n28
  cau: "Handel: tám tổ khúc in năm 1720 (Tổ khúc số 5 Mi trưởng HWV 430 kết bằng bộ biến tấu The Harmonious Blacksmith); Sarabande trong Tổ khúc Rê thứ HWV 437; Chaconne Sol trưởng HWV 435."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n30
  cau: "Handel, Bắt đầu bằng: các minuet, gavotte ngắn (≈ Grade 1–3)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n31
  cau: "Handel, Bắt đầu bằng: Sarabande HWV 437 cùng hai biến tấu (≈ Grade 4–5) → các chương trong tổ khúc (≈ Grade 6–7) → trọn The Harmonious Blacksmith, Chaconne HWV 435 (≈ Grade 8 trở lên)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n32
  cau: "Tên và năm sinh–mất ở các tiêu đề mục Cổ điển: C. P. E. Bach (1714–1788), Haydn (1732–1809), Mozart (1756–1791), Clementi (1752–1832), Beethoven (1770–1827)."
  loai: nam
- trang: piano/nha-soan-nhac
  id: n33
  cau: Kết cấu Cổ điển chuyển sang giai điệu và đệm (tay trái thường rải hợp âm kiểu Alberti), và bản nhạc bắt đầu ghi sắc thái.
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n34
  cau: 'C. P. E. Bach: sách Versuch über die wahre Art das Clavier zu spielen (1753 và 1762), các sonata "Phổ" và "Württemberg", sáu tập Für Kenner und Liebhaber, Solfeggietto Đô thứ.'
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n36
  cau: "C. P. E. Bach, Bắt đầu bằng: các hành khúc và polonaise BWV Anh. 122–125 trong Notebook, thường được cho là của ông (≈ Grade 1–3) → Solfeggietto (≈ Grade 5–6) → sonata và rondo trong Für Kenner und Liebhaber (≈ Grade 7–8) → các fantasia tự do (sau Grade 8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n37
  cau: "Haydn: khoảng 60 sonata (Hob. XVI), những bản cuối viết ở London khoảng 1794–1795; Biến tấu Fa thứ Hob. XVII:6 (1793)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n39
  cau: "Haydn, Bắt đầu bằng: minuet, German Dance và sonata sớm (≈ Grade 3–5) → Hob. XVI:35 (≈ Grade 6–7) → Hob. XVI:37, Hob. XVI:34 (≈ Grade 7–8) → Hob. XVI:52, Biến tấu Fa thứ (sau Grade 8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n40
  cau: 'Mozart: 18 sonata, Fantasia Rê thứ K. 397, Rondo La thứ K. 511, các bộ biến tấu (như K. 265 trên giai điệu "Ah, vous dirai-je, maman"), các concerto.'
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n42
  cau: "Mozart, Bắt đầu bằng: các bản nhỏ K. 1–5, viết lúc 5–6 tuổi (≈ Grade 1–3)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n43
  cau: 'Mozart, Bắt đầu bằng: Sonata Đô trưởng K. 545, mà chính ông ghi là sonata nhỏ "cho người mới học" (≈ Grade 6).'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n44
  cau: "Mozart, Bắt đầu bằng: K. 283, K. 330 (≈ Grade 7) → Fantasia K. 397, K. 331 (≈ Grade 7–8) → K. 310, K. 457, Rondo K. 511 (sau Grade 8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n45
  cau: "Clementi: năm 1781 ông từng đấu đàn với Mozart trước Hoàng đế Joseph II."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n46
  cau: "Clementi: sáu Sonatina Op. 36 (1797); tuyển tập Gradus ad Parnassum (1817–1826); hàng chục sonata."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n48
  cau: "Clementi, Bắt đầu bằng: Sonatina Op. 36 số 1 (≈ Grade 3)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n49
  cau: "Clementi, Bắt đầu bằng: Op. 36 số 2 và 3 (≈ Grade 4–5)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n50
  cau: "Clementi, Bắt đầu bằng: số 4 đến 6 (≈ Grade 5–6) → các sonata lớn và Gradus (sau Grade 8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n51
  cau: "Beethoven: 32 sonata, ba tập Bagatelle (Op. 33, 119, 126), 32 biến tấu Đô thứ WoO 80, Diabelli Variations Op. 120, năm concerto."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n53
  cau: "Beethoven, Bắt đầu bằng: Sonatina Sol trưởng (Anh. 5 số 1, chưa chắc của Beethoven) hoặc 6 biến tấu WoO 64 (≈ Grade 2–3)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n54
  cau: "Beethoven, Bắt đầu bằng: Für Elise, Bagatelle Op. 119 (≈ Grade 4–5)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n55
  cau: 'Beethoven, Bắt đầu bằng: hai sonata ngắn Op. 49, thường gọi là "sonata dễ", như Op. 49 số 2 (≈ Grade 5).'
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n56
  cau: "Beethoven, Bắt đầu bằng: chương 1 Ánh trăng (≈ Grade 6–7)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n57
  cau: "Beethoven, Bắt đầu bằng: Op. 79, Pathétique chương 2 (≈ Grade 7–8)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n58
  cau: "Beethoven, Bắt đầu bằng: trọn Pathétique, Op. 10, Op. 14 (sau Grade 8) → Waldstein, Appassionata, các sonata cuối."
