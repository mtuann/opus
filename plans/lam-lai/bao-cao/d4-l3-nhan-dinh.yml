- trang: piano/nha-soan-nhac
  id: n161
  cau: "Ligeti: Musica ricercata (1951–1953, 11 bản: bản 1 chỉ dùng nốt La, nốt Rê chỉ đến ở cuối; mỗi bản sau thêm một cao độ, đến bản 11 đủ 12 nốt), 18 Études trong ba tập (1985–2001)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n163
  cau: "Ligeti, Bắt đầu bằng: Musica ricercata số 1 và 2 (≈ Grade 5–6) → số 7, tay trái lặp mẫu bảy nốt dưới giai điệu dân ca (≈ Grade 7–8) → Étude số 5 Arc-en-ciel (trình độ hòa nhạc) → Désordre và các étude khác."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n164
  cau: "Hôm nay: Kurtág (sinh 1926), Pärt (sinh 1935), Glass (sinh 1937) là những nhà soạn nhạc đương thời."
  loai: nam
- trang: piano/nha-soan-nhac
  id: n165
  cau: Kurtág (sinh 1926), tròn 100 tuổi năm 2026.
  loai: nam
- trang: piano/nha-soan-nhac
  id: n166
  cau: "Kurtág: bộ Játékok (Trò chơi), viết từ năm 1973, nay đã mười tập."
  loai: so-lieu
- trang: piano/nha-soan-nhac
  id: n167
  cau: "Kurtág: Játékok viết từ năm 1973; ý tưởng đến từ những đứa trẻ coi cây đàn như món đồ chơi; Kurtág nói đây không phải giáo trình mà là chỗ để thử nghiệm."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n169
  cau: "Pärt: Für Alina (1976) và Variationen zur Gesundung von Arinuschka rất ít nốt (≈ Grade 2–4)."
  loai: cap-do
- trang: piano/nha-soan-nhac
  id: n170
  cau: "Glass: Opening trong album Glassworks (1982), Metamorphosis, 20 Étude (≈ Grade 5–8)."
  loai: danh-muc
- trang: piano/nha-soan-nhac
  id: n176
  cau: "Quiz: chọn cách phát âm khi chơi Bach vì bản gốc gần như không ghi sắc thái hay dấu luyến."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n177
  cau: 'Quiz: Sonata nào Mozart tự ghi là sonata nhỏ "cho người mới học"? K. 545.'
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n178
  cau: "Quiz: điều làm tay trái trong nocturne của Chopin khó là hợp âm rải trải rộng hơn một quãng tám, cổ tay lướt ngang mềm."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n179
  cau: "Quiz: bản số 1 trong Musica ricercata của Ligeti chỉ dùng nốt La, và nốt Rê ở cuối; mỗi bản sau thêm một cao độ, đến bản 11 đủ 12 nốt."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n180
  cau: "Nguồn: Maurice Hinson, Wesley Roberts, Guide to the Pianist's Repertoire, tái bản lần 4, Indiana University Press, 2014; Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature, Alfred Publishing, 1995."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n181
  cau: "Nguồn: François Couperin, L'art de toucher le clavecin, Paris, 1716; C. P. E. Bach, Versuch über die wahre Art das Clavier zu spielen, 1753 và 1762."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n182
  cau: "Nguồn: Mức độ khó: chương trình thi piano của ABRSM (https://www.abrsm.org/) và thang 1–9 của G. Henle Verlag (https://www.henle.de/), chỉ dùng để ước lượng."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n183
  cau: "Nguồn: Bản nhạc: IMSLP (tìm theo tên và số danh mục); bản Urtext của G. Henle Verlag, Wiener Urtext, Bärenreiter; với Chopin, Wydanie Narodowe (Jan Ekier biên tập)."
  loai: dinh-nghia
- trang: piano/nha-soan-nhac
  id: n184
  cau: "Nguồn: Grove Music Online: các mục về từng nhà soạn nhạc."
  loai: lich-su
- trang: piano/nha-soan-nhac
  id: n52
  cau: "Beethoven: kịch tính: sforzando bất ngờ, subito piano, hợp âm dày ở âm vực thấp; cần trọng lượng cánh tay, sức bền, kỷ luật nhịp; chương chậm đòi tiếng hát dài."
  loai: khuyen-tap
- trang: piano/nha-soan-nhac
  id: n14
  cau: "Rameau: khỏe và phô diễn hơn Couperin: vắt tay, nốt lặp, nhảy quãng rộng, hợp âm rải nhanh, nhịp nhảy múa; cần ngón chắc, tiếng gọn."
  loai: khuyen-tap
- trang: piano/nha-soan-nhac
  id: n11
  cau: "Couperin: gần như nốt dài nào cũng có nốt hoa mỹ; nhiều bản rải nốt so le giữa các bè, bắt chước đàn luth; (Đặc trưng khi chơi)."
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n1
  cau: "Chơi piano là một hoạt động thể chất: một bài vài phút gồm rất nhiều chuyển động nhỏ, lặp lại mỗi ngày trong nhiều năm."
  loai: dinh-nghia
- trang: piano/suc-khoe
  id: n2
  cau: Nhiều cơn đau thường gặp ở người chơi đàn liên quan đến quá tải và căng cơ, tức là những thứ bạn có thể điều chỉnh.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n5
  cau: Giới y khoa gọi chung các vấn đề này là rối loạn cơ xương liên quan đến chơi nhạc (playing-related musculoskeletal disorders).
  loai: ten
- trang: piano/suc-khoe
  id: n6
  cau: Một tổng quan hệ thống về người chơi piano (Bragge và cộng sự, 2006) ghi nhận tỷ lệ mắc trong các nghiên cứu dao động rất rộng, từ 26% đến 93%.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n7
  cau: "Con số chính xác khó biết, nhưng kết luận thì rõ: nhiều người chơi piano từng đau vì chơi đàn."
  loai: so-lieu
- trang: piano/suc-khoe
  id: n8
  cau: Đau là tín hiệu, không phải bằng chứng của sự chăm chỉ; câu "không đau thì không tiến bộ" không áp dụng cho đôi tay của người chơi đàn.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n9
  cau: BAPAM coi mỏi và căng là dấu hiệu để xem lại kỹ thuật, cách tập và chương trình tập; còn đau thì dừng ngay.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n10
  cau: 'Bảng "Mỏi, căng: xem lại cách tập" và "Đau và dấu hiệu bất thường: dừng": mỏi đều ở cẳng tay hoặc vai sau buổi tập dài, giảm khi nghỉ, không gắn với động tác cụ thể, cảm giác bình thường; ngược lại, đau ở một điểm, đau không hết hoặc nặng dần, đau nhói ở một động tác, tê, kim châm, yếu tay, vụng về.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n11
  cau: Các nghiên cứu chưa thống nhất yếu tố nào quan trọng nhất (chính tổng quan của Bragge cũng ghi nhận điều đó), nhưng dưới đây là những yếu tố mà tài liệu về sức khỏe nhạc công (như BAPAM) nhắc tới.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n12
  cau: 'Hàng "Tăng thời lượng tập đột ngột": tay cần thời gian để thích nghi với tải mới; cách giảm: tăng dần qua nhiều tuần, học bài mới đủ sớm trước hạn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n13
  cau: 'Hàng "Buổi tập dài không nghỉ": tay cần thời gian hồi phục giữa các lượt tập; tập khoảng 20 phút rồi nghỉ 10 phút, chia thành nhiều lượt ngắn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n15
  cau: 'Hàng "Căng cơ thừa": ép phím, vai nhô, cổ tay khóa, nín thở làm cơ gồng liên tục nên mỏi nhanh; cách giảm: "nhấn rồi buông".'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n16
  cau: 'Hàng "Ghế, tư thế, cây đàn không phù hợp": tay phải bù cho tư thế sai; chỉnh ghế mỗi buổi, đàn có bộ máy phím tốt; liên kết Chọn đàn.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n18
  cau: 'Hàng "Không khởi động": cơ chưa được làm ấm, máu chưa đủ tới tay; làm ấm tay và khởi động nhẹ trước khi tập kỹ thuật.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n19
  cau: 'Hàng "Bài quá khó quá sớm": tay làm những việc chưa có kỹ thuật để làm; chọn bài vừa sức.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n20
  cau: 'Hàng "Căng thẳng, thiếu ngủ": cơ căng hơn, hồi phục chậm hơn; ngủ đủ, để ý lúc gồng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n21
  cau: 'Hàng "Tải từ việc khác": gõ phím, nhắn tin, xách đồ nặng, thể thao hay làm vườn; đôi tay chỉ có một; tính tổng tải trong ngày, bớt tập vào hôm tay đã làm việc nặng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n22
  cau: "Khởi động nhẹ vài phút, mục đích là làm ấm chứ không phải kéo giãn: rửa tay nước ấm, xoay vai, lắc tay, xoay cổ tay, thả rơi cánh tay, năm ngón hoặc gam chậm."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n23
  cau: Đừng kéo giãn mạnh, bẻ ngón tay ra sau hay cố "dang tay cho rộng" trước khi chơi; đoạn khó nhất để sau khi tay đã ấm.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n24
  cau: '"Tập khoảng 20 phút rồi nghỉ 10 phút (theo BAPAM): đứng dậy, đi lại, buông thõng tay"; đặt hẹn giờ; nghỉ thật ngắn giữa các lần lặp, giữa các câu nhạc; muốn tập lâu trong ngày thì chia thành nhiều lượt ngắn xen nghỉ.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n25
  cau: Đôi tay thích nghi với tải tăng dần, không phải với những cú nhảy; BAPAM khuyên tránh tăng đột ngột thời lượng tập; ví dụ từ 30 lên 60 phút mỗi ngày thì đi qua nhiều tuần, chỉ tăng khi tay vẫn thoải mái; trước kỳ thi hay buổi diễn đừng nhân đôi thời gian tập tuần cuối.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n28
  cau: Bàn phím piano phổ biến hiện nay có quãng tám rộng khoảng 6,5 inch (khoảng 16,5 cm) cho mọi người chơi, bất kể cỡ tay.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n29
  cau: Theo PASK, độ dang tay của người lớn có thể chênh nhau tới khoảng 12,7 cm (5 inch), và trung bình tay nam dang hơn tay nữ khoảng 2,5 cm.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n30
  cau: Trong một nghiên cứu lâm sàng trên 200 nghệ sĩ và sinh viên piano ở Nhật Bản bị đau tay do tập quá mức (Sakai, 2002), 70 người cho biết triệu chứng bắt đầu khi họ đang tập một kỹ thuật bàn phím nhất định; quãng tám (30 người) và hợp âm (22 người) là hai kỹ thuật gặp nhiều nhất.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n32
  cau: Có những bàn phím piano hẹp hơn chuẩn, như loại DS5.5 (thường gọi là "7/8") và DS6.0 ("15/16"); PASK vận động để chúng phổ biến hơn; theo PASK (tính đến 2026), chúng chỉ có từ một số ít nguồn, giá cao và người mua thường phải chờ lâu.
  loai: so-lieu
- trang: piano/suc-khoe
  id: n33
  cau: "Ghế, tư thế, cây đàn: đàn điện có chân chắc, không rung; độ nặng phím hợp với tay bạn, vì BAPAM nhắc nên cân nhắc phím nhẹ hay nặng hợp hơn cho việc tập thường xuyên."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n34
  cau: "Vận động toàn thân: BAPAM khuyên giữ thể lực bằng vận động nhịp điệu đều như bơi, đi bộ hay chạy; các môn dùng tạ và nắm tay chặt không hợp với người chơi piano. Giữ ấm: những ngày rét, làm ấm tay trước khi tập, như rửa tay nước ấm."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n35
  cau: "Bảng dấu hiệu cảnh báo: đau ở một điểm khi chơi và còn sau khi dừng thì dừng buổi tập và cho tay nghỉ, không đỡ thì đi khám; đau quay lại mỗi lần chơi một đoạn nhất định thì giảm thời lượng, xem lại kỹ thuật với thầy, còn kéo dài thì đi khám."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n36
  cau: "Tê, kim châm ở ngón tay; yếu tay, vụng về khi cầm đồ vật; sưng hay đỏ quanh khớp ngón hoặc cổ tay: đi khám."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n37
  cau: "Đau không hết hoặc nặng dần, kể cả khi đã nghỉ chơi đàn: đi khám."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n38
  cau: 'Một ngón co quắp hay "không nghe lời" ở một động tác nhất định, không đau: gặp bác sĩ thần kinh (xem bên dưới).'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n39
  cau: 'Hộp "Khi vừa thấy đau": 1. Dừng lại, đừng chơi xuyên qua cơn đau, kể cả khi sắp đến ngày thi; 2. Ghi lại đau ở đâu, đoạn nào, sau bao lâu, tuần này có tập nhiều hơn không; 3. Quay lại từ từ khi đã hết đau hoặc theo chỉ dẫn bác sĩ: buổi ngắn, bài chậm, đơn giản, nhỏ tiếng, dừng ngay nếu đau trở lại.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n40
  cau: Loạn trương lực cơ khu trú ở nhạc công (musician's focal dystonia) là một rối loạn thần kinh hiếm gặp, ước tính khoảng 1–2% nhạc công chuyên nghiệp (Altenmüller và Jabusch, 2010; BAPAM).
  loai: so-lieu
- trang: piano/suc-khoe
  id: n41
  cau: "Nó thường không đau lúc đầu: một hay vài ngón tự co vào một tư thế bất thường hoặc không nghe lời khi chơi đàn; những việc khác có thể vẫn bình thường, dù đôi khi vấn đề lan sang các việc tinh khác như viết hay gõ phím."
  loai: dinh-nghia
- trang: piano/suc-khoe
  id: n42
  cau: Cố tập nhiều hơn để "sửa" có thể làm triệu chứng nặng thêm.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n43
  cau: 'Nhưng đừng vội hoảng: phần lớn những ngón tay "vụng" ở người mới học chỉ là chưa được tập đủ, hoặc đang bị căng.'
  loai: quy-tac
- trang: piano/suc-khoe
  id: n44
  cau: Nếu nghi ngờ loạn trương lực, nhờ bác sĩ gia đình giới thiệu đến bác sĩ thần kinh có quan tâm đặc biệt đến rối loạn vận động; BAPAM cũng khuyên nên được chuyên gia y học nghệ thuật biểu diễn đánh giá khi bạn chơi đàn.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n45
  cau: "Ở Việt Nam: bắt đầu bằng một bác sĩ ở cơ sở y tế bạn tin cậy, nói rõ mình chơi đàn và tập bao lâu mỗi ngày, nhờ giới thiệu đến chuyên khoa phù hợp; tê, yếu hay mất kiểm soát ngón tay thì nhờ giới thiệu đến bác sĩ thần kinh."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n47
  cau: "Khi bác sĩ đã cho phép chơi lại, nhờ thầy xem kỹ thuật ở đoạn gây đau: BAPAM khuyên xem lại cách chơi để đau khỏi tái phát, vì nguyên nhân có thể nằm ở một thói quen nhỏ như cổ tay khóa hay ngón cái ép chặt."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n48
  cau: Ở Anh, BAPAM (British Association for Performing Arts Medicine) là tổ chức từ thiện y tế dành cho người làm nghề nghệ thuật biểu diễn ở Anh, có tư vấn miễn phí (tính đến 2026).
  loai: ten
- trang: piano/suc-khoe
  id: n49
  cau: Ở Mỹ, PAMA (Performing Arts Medicine Association) quy tụ chuyên gia y tế, nghệ sĩ, nhà giáo và nhà quản lý, và có danh bạ giới thiệu người cung cấp dịch vụ cho người biểu diễn.
  loai: ten
- trang: piano/suc-khoe
  id: n50
  cau: Nếu bạn sống ở những nước này, đó là nơi bạn có thể tìm đến.
  loai: quy-tac
- trang: piano/suc-khoe
  id: n51
  cau: "Danh sách kiểm tra hằng tuần: không tăng thời lượng quá nhiều so với tuần trước; nghỉ 10 phút sau mỗi 20 phút tập; chia đoạn nặng thành nhiều lần ngắn; quay video tay mình và đối chiếu với tư thế; không có cơn đau, tê hay yếu kéo dài."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n52
  cau: "Câu hỏi 1: đau ở một điểm ở cổ tay, vẫn còn sau khi đã nghỉ, là tín hiệu cần dừng tập; cẳng tay hơi mỏi đều sau buổi dài, giảm đi khi nghỉ, chưa phải; lời giải thích: mỏi và căng là lúc xem lại cách tập, đau khu trú, kéo dài hoặc lặp lại là tín hiệu cần dừng."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n53
  cau: "Câu hỏi 2: còn một tuần nữa là thi thì giữ thời lượng gần như cũ, nghỉ đều, tập chậm và tập trong đầu; không nhân đôi thời gian tập, không tập liền ba tiếng không nghỉ; tăng tải đột ngột là yếu tố nguy cơ, tuần cuối là lúc giữ sức."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n54
  cau: "Câu hỏi 3: tay nhỏ, bài nhiều quãng tám: khép tay lại giữa các quãng tám, di chuyển bằng cả cánh tay, chọn bài khác nếu vẫn căng; lời giải thích: bàn tay mở căng hết cỡ và lặp lại nhiều lần là một yếu tố nguy cơ gây quá tải."
  loai: quy-tac
- trang: piano/suc-khoe
  id: n55
  cau: "Câu hỏi 4: một ngón tự co lại mỗi khi chơi một đoạn chạy nốt, không đau, mọi việc khác bình thường: gặp bác sĩ thần kinh, tốt nhất là người có kinh nghiệm về rối loạn vận động; lời giải thích: đây có thể là loạn trương lực cơ khu trú, một rối loạn thần kinh hiếm gặp cần chuyên gia đánh giá."
  loai: quy-tac
- trang: piano/suc-khoe
