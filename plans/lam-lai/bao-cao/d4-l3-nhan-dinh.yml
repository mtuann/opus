  cau: "Mang theo khi đi khám: mô tả việc tập (bao lâu mỗi ngày, tập gì, gần đây có tăng thời lượng hay đổi bài không); một video ngắn quay bạn chơi đoạn gây đau từ bên cạnh và từ trên xuống; câu hỏi (nghỉ bao lâu, tránh động tác nào, quay lại theo lộ trình nào)."
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n27
  cau: "Kiểm tra thả lỏng: mỗi khi lật trang hoặc hết câu nhạc, quét nhanh hàm, hơi thở, vai, cổ tay, ngón cái, và việc ép tiếp sau khi phím chạm đáy."
  loai: khuyen-tap
- trang: piano/suc-khoe
  id: n31
  cau: "Nếu tay bạn nhỏ: biết vùng thoải mái của mình; đừng giữ bàn tay mở căng, khép lại giữa hai quãng tám, di chuyển bằng cả cánh tay; sắp xếp lại hợp âm rộng (bỏ nốt nhân đôi, chuyển sang tay kia, rải); chọn bài hợp tay, nhạc Baroque và Cổ điển có nhiều bài hay không đòi hỏi bàn tay lớn."
  loai: khuyen-tap
- trang: piano/the-loai
