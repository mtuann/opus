  cau: "Mục Nguồn: Hinson & Roberts, Guide to the Pianist's Repertoire (tái bản lần 4, Indiana University Press, 2014); Rosen, The Classical Style (1971) và The Romantic Generation (Harvard University Press, 1995); Rowland (chủ biên), The Cambridge Companion to the Piano (Cambridge University Press, 1998); Grove Music Online."
