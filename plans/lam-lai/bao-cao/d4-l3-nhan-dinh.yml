  id: n70
  cau: "Quiz: Debussy đặt tên gợi hình ở cuối mỗi prelude."
  loai: khuyen-tap
- trang: piano/thi-tau
  id: n1
  cau: Tin tốt là một phần lớn của đọc nhanh là kỹ năng nhận ra hình mẫu, và nó có thể tiến bộ nếu bạn đọc một chút mỗi ngày.
  loai: quy-tac
- trang: piano/thi-tau
  id: n2
  cau: Thị tấu (sight-reading) là chơi một bản nhạc ngay lần đầu nhìn thấy.
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n4
  cau: Người đọc giỏi nhìn khoảng cách giữa các nốt và hình dạng cả nhóm nốt, giống như ta đọc cả chữ chứ không đọc từng chữ cái; có ba cách nhận ra một nốt (nốt mốc, quãng tính từ nốt trước, hình mẫu), và người đọc giỏi dùng cả ba cùng lúc.
  loai: cau-truc
- trang: piano/thi-tau
  id: n5
  cau: "Nốt mốc: Đô giữa, Sol trên dòng 2 khóa Sol, Fa trên dòng 4 khóa Fa."
  loai: quy-tac
- trang: piano/thi-tau
  id: n6
  cau: "Bảng quãng trên khuông: dòng sang khe sát bên (hoặc khe sang dòng sát bên) là quãng 2, phím ngay cạnh; dòng sang dòng kế tiếp (hoặc khe sang khe kế tiếp) là quãng 3, bỏ qua một phím; dòng sang khe cách một là quãng 4, bỏ qua hai phím; dòng sang dòng cách một là quãng 5, ngón 1 và ngón 5 của thế tay năm ngón; nốt trên dòng và nốt trong khe cùng tên là quãng 8, hai phím cùng tên."
  loai: quy-tac
- trang: piano/thi-tau
  id: n7
  cau: "Quy tắc dễ nhớ: quãng lẻ (3, 5, 7) nối dòng với dòng hoặc khe với khe; quãng chẵn (2, 4, 6, 8) nối dòng với khe."
  loai: quy-tac
- trang: piano/thi-tau
  id: n8
  cau: 'Ví dụ "Đọc bằng quãng": nốt đầu là Đô giữa, các nốt sau đọc bằng quãng ghi trên nốt (3, 2, 4 | 4, 4, 3, 3 | 5, 5).'
  loai: cau-truc
- trang: piano/thi-tau
  id: n11
  cau: "Mô thức tay trái: nốt trầm rồi hai hợp âm (điệu valse), bè Alberti (trầm–cao–giữa–cao), hợp âm rải."
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n12
  cau: Hợp âm ba ở thế gốc là ba nốt trên ba dòng liên tiếp (hoặc ba khe liên tiếp); một quãng bốn "hở" trong chồng nốt là thể đảo.
  loai: quy-tac
- trang: piano/thi-tau
  id: n13
  cau: "Dòng kẻ phụ: Đô giữa (C4) trên một dòng kẻ phụ giữa hai khuông, Đô trên hai dòng kẻ phụ phía trên khóa Sol (C6), Đô trên hai dòng kẻ phụ phía dưới khóa Fa (C2)."
  loai: quy-tac
- trang: piano/thi-tau
  id: n14
  cau: 8va phía trên nốt là chơi cao hơn một quãng tám so với nốt viết; 8vb (hoặc 8va phía dưới nốt) là thấp hơn một quãng tám; loco là trở về chơi như viết.
  loai: quy-tac
- trang: piano/thi-tau
  id: n16
  cau: "Khoảng mắt–tay (eye-hand span): trong các nghiên cứu được tổng hợp, khoảng này chỉ vài nốt, từ chừng 0,5–3,7 nốt ở người mới đến chừng 1,7–6,8 nốt ở người đọc giỏi (tùy cách đo), và hiếm khi tới trọn một ô nhịp. Một vài thí nghiệm cho thấy luyện tập giúp kéo dài nó ở người đọc yếu, nhưng bằng chứng còn ít."
  loai: so-lieu
- trang: piano/thi-tau
  id: n18
  cau: 'Bàn phím có "chữ nổi": nhóm hai và nhóm ba phím đen.'
  loai: dinh-nghia
- trang: piano/thi-tau
  id: n21
  cau: Sol♯ là dấu hóa bất thường trong La thứ.
  loai: quy-tac
- trang: piano/thi-tau
  id: n23
  cau: Các bài đọc mẫu đều được soạn cho trang này (5 khối nhạc).
  loai: lich-su
- trang: piano/thi-tau
  id: n24
  cau: "Bài 1: Đô trưởng, tay phải giữ nguyên thế tay Đô–Sol, tay trái chỉ có hai nốt Đô và Sol."
  loai: cau-truc
- trang: piano/thi-tau
  id: n25
  cau: "Bài 2: Sol trưởng, nhịp 3/4, hóa biểu một dấu thăng. Hai câu bốn ô nhịp chỉ khác nhau ở ô thứ nhất và thứ ba; ô thứ hai và thứ tư giống hệt."
  loai: cau-truc
- trang: piano/thi-tau
  id: n26
  cau: "Bài 3: La thứ, tay trái nốt trầm và hợp âm; Sol♯ có trong bài; tay phải đổi thế tay; tay trái lặp mô thức nốt trầm rồi ba hợp âm (Đô–Mi ở ô 1 và 3; Sol♯–Rê ở ô 2)."
  loai: cau-truc
- trang: piano/thi-tau
  id: n27
  cau: "Bài 3 giản lược: tay trái chỉ còn nốt trầm (A,,8 | E,,8 | A,,8 | E,,4 A,,4); hòa âm vẫn rõ, nhịp vẫn giữ được."
  loai: cau-truc
- trang: piano/thi-tau
  id: n29
  cau: "Bartók, Mikrokosmos quyển 1–2: bắt đầu bằng những bài ngắn và tăng độ khó từng chút."
  loai: cau-truc
- trang: piano/thi-tau
  id: n30
  cau: Paul Harris, Improve your sight-reading! (Faber Music), mỗi cấp một quyển, có bài tập tiết tấu và giai điệu, bài mẫu kèm câu hỏi, và bài đọc ngắn.
  loai: cau-truc
- trang: piano/thi-tau
  id: n31
  cau: Song tấu bốn tay, ví dụ Diabelli Melodious Exercises Op. 149; bè của học trò chỉ dùng năm nốt; chơi cùng người khác buộc bạn không được dừng.
  loai: cau-truc
