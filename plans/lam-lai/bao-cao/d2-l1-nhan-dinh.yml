- trang: bat-dau/bai-0
  id: n1
  cau: "Opus dạy nhạc cổ điển qua cây đàn piano: bạn học nhạc lý bằng mắt và tai, rồi biến nó thành thứ sờ được dưới mười ngón tay. Chưa có đàn vẫn bắt đầu được (nghe và đọc nhạc), nhưng piano là con đường chính của site."
  loai: ten
- trang: bat-dau/bai-0
  id: n2
  cau: '"Nhạc cổ điển" ở đây là cả truyền thống âm nhạc nghệ thuật phương Tây, từ thánh ca thời Trung cổ đến các nhà soạn nhạc đang sống.'
  loai: dinh-nghia
- trang: bat-dau/bai-0
  id: n3
  cau: Thời kỳ Cổ điển chỉ là giai đoạn khoảng 1750–1820 của Haydn, Mozart và Beethoven.
  loai: nam
- trang: bat-dau/bai-0
  id: n4
  cau: Người lớn biết tự sắp xếp việc tập tốt hơn trẻ em; ngón tay có thể quen chậm hơn một chút, nhưng đó là chuyện thời gian chứ không phải giới hạn.
  loai: quy-tac
- trang: bat-dau/bai-0
  id: n5
  cau: Sau năm đầu, bạn chơi trọn vẹn được những bài nhỏ như Minuet Sol trưởng hay Bài ca Pháp cổ.
  loai: cap-do
- trang: bat-dau/bai-0
  id: n6
  cau: Für Elise trọn bài thường đến sau hai năm rưỡi đến bốn năm.
  loai: cap-do
- trang: bat-dau/bai-0
  id: n7
  cau: Hỏi đáp có con số cho các bài khác.
  loai: so-lieu
- trang: bat-dau/bai-0
  id: n8
  cau: Đọc nhạc, giữ nhịp, nghe ra hòa âm và điều khiển ngón tay đều là kỹ năng, và kỹ năng thì luyện được.
  loai: quy-tac
- trang: bat-dau/bai-0
  id: n9
  cau: Bạn đã hiểu "ngữ pháp" âm nhạc phương Tây một cách vô thức qua hàng nghìn bài hát.
  loai: quy-tac
- trang: bat-dau/bai-0
  id: n10
  cau: 20–30 phút mỗi ngày, có mục tiêu rõ, đi xa hơn ba tiếng dồn vào cuối tuần.
  loai: khuyen-tap
- trang: bat-dau/bai-0
  id: n11
  cau: Một phần lớn việc học động tác diễn ra sau buổi tập, kể cả trong giấc ngủ.
  loai: quy-tac
- trang: bat-dau/bai-0
  id: n12
  cau: Bạn không cần hát hay. Nhưng ngân nga (dù lệch) là công cụ học tốt nhất, vì nó buộc tai bạn chú ý đến cao độ.
  loai: khuyen-tap
- trang: bat-dau/bai-0
  id: n13
  cau: Phần lớn người tự nhận "lệch tông" thực ra chỉ chưa được luyện.
  loai: quy-tac
- trang: bat-dau/bai-0
  id: n14
  cau: Khả năng nghe và hát đúng cao độ cải thiện khi luyện tai đều đặn.
  loai: quy-tac
- trang: bat-dau/bai-0
  id: n15
  cau: Chỉ một tỉ lệ rất nhỏ dân số gặp khó khăn thật sự về nhận biết cao độ (amusia).
  loai: so-lieu
- trang: bat-dau/bai-0
  id: n16
  cau: Nghe nhạc cổ điển không cần năng khiếu hay biết đọc nốt; điều cần là biết nghe cái gì.
  loai: khuyen-tap
- trang: bat-dau/bai-0
  id: n17
  cau: Mỗi bài học tác phẩm có bản thu và bảng "Theo dõi khi nghe" để bạn bắt đầu.
  loai: so-lieu
- trang: bat-dau/bai-0
  id: n18
  cau: Đã chơi được một chút? Làm bài kiểm tra đầu vào (phần piano khoảng 2 phút) để biết nên vào từ đâu.
  loai: so-lieu
- trang: bat-dau/bai-0
  id: n19
  cau: Chuẩn bị theo danh sách Trước ngày đầu tiên (đàn, ghế, máy đếm nhịp, một khung giờ cố định), rồi theo Hai tuần đầu tiên bên phím đàn.
  loai: so-lieu
- trang: bat-dau/bai-0
  id: n20
  cau: Sau năm đầu, lộ trình 7 chặng dẫn bạn tới những tác phẩm lớn.
  loai: so-lieu
- trang: bat-dau/bai-0
  id: n21
  cau: Những thắc mắc thường gặp (đàn điện, tay nhỏ, có cần thầy, có nên thi cấp) có ở Hỏi đáp.
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n1
  cau: Bài kiểm tra có hai phần, làm phần nào trước cũng được.
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n2
  cau: Phần piano mất khoảng 2 phút.
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n3
  cau: Phần piano cho biết bạn đang ở chặng nào của lộ trình piano; phần nhạc lý cho biết nên bắt đầu từ bài nhạc lý nào.
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n4
  cau: Kết quả được lưu trong trình duyệt và dùng để gợi ý buổi tập hôm nay ở trang chủ.
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n5
  cau: Mỗi nhóm có ba việc; làm được hai trong ba là coi như xong chặng đó.
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n6
  cau: "Sáu nhóm mang tên và Grade của chặng 1–6: Khởi đầu; Sơ cấp, ≈ Grade 1–2; Sơ trung cấp, ≈ Grade 3; Trung cấp, ≈ Grade 4–5; Trung cấp cao, ≈ Grade 6; Nâng cao, ≈ Grade 7–8."
  loai: cap-do
- trang: bat-dau/kiem-tra-dau-vao
  id: n7
  cau: "Xong chặng 1: chơi được bằng hai tay vài bài đơn giản, như 10 bài đầu tiên, không dừng, ở tốc độ chậm vừa; đọc được nốt ở cả khóa Sol lẫn khóa Fa; chơi gam Đô trưởng một quãng tám từng tay, luồn ngón cái không giật."
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n8
  cau: "Xong chặng 2: chơi trọn vẹn vài bài cấp 1–2, có sắc thái, không dừng khi lỡ sai; chơi các gam trưởng và thứ đã học bằng hai tay, hai quãng tám; đổi bàn đạp theo hợp âm mà tiếng không bị nhòe."
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n9
  cau: Minuet Sol trưởng là một bài cấp 1–2 (chặng 2).
  loai: cap-do
- trang: bat-dau/kiem-tra-dau-vao
  id: n10
  cau: "Xong chặng 3: chơi trọn một sonatina, nhịp ổn định từ đầu đến cuối; đệm Alberti đều và nhỏ hơn giai điệu; chơi gam đến 3 dấu hóa, hai tay, hai quãng tám."
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n11
  cau: Sonatina Op. 36 số 1 của Clementi là bài của chặng 3 (≈ Grade 3).
  loai: cap-do
- trang: bat-dau/kiem-tra-dau-vao
  id: n12
  cau: "Xong chặng 4: chơi hai bè độc lập, một bè to, một bè nhỏ, theo ý mình; chơi mọi gam trưởng và thứ, hai tay, hai quãng tám; biểu diễn thuộc lòng một chương trình khoảng 10 phút cho người khác nghe."
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n13
  cau: "Xong chặng 5: chơi trọn một chương sonata Cổ điển ở tốc độ gần với chỉ dẫn; làm nổi được giai điệu nằm ở giữa hoặc ở tay trái; hai bè của Bach rõ ràng."
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n14
  cau: Invention số 1 của Bach là bài của chặng 5 (≈ Grade 6).
  loai: cap-do
- trang: bat-dau/kiem-tra-dau-vao
  id: n15
  cau: "Xong chặng 6: chơi thuộc lòng một chương trình 20–30 phút gồm ít nhất ba thời kỳ; chơi một prelude và fugue của Bach, các bè nghe rõ; tự quyết định ngón bấm, sắc thái và tốc độ cho một bài mới, và giải thích được vì sao."
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n16
  cau: Phần nhạc lý gồm 28 câu, mỗi bài nhạc lý có 2 câu.
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n17
  cau: Phần nhạc lý mất khoảng 5–10 phút.
  loai: khuyen-tap
- trang: bat-dau/kiem-tra-dau-vao
  id: n18
  cau: 'Nếu không biết, hãy chọn "Tôi chưa biết" thay vì đoán: kết quả sẽ chính xác hơn.'
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n19
  cau: Cuối bài, site gợi ý bài nên bắt đầu và lưu kết quả lại.
  loai: so-lieu
- trang: bat-dau/kiem-tra-dau-vao
  id: n20
  cau: Tên bài và đường dẫn ở 14 dòng @ của khối câu hỏi khớp bài nhạc lý 1–14.
  loai: ten
- trang: bat-dau/kiem-tra-dau-vao
  id: n21
  cau: Nốt Sol trong hệ chữ cái là G (không phải F hay A).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n22
  cau: Ký hiệu C4 chỉ Đô giữa trên piano (không phải nốt Đô thấp nhất trên piano, cũng không phải một hợp âm).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n23
  cau: Trong khóa Sol, nốt trên dòng 2 là Sol (không phải Mi hay Si).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n24
  cau: Trong khóa Fa, nốt trên dòng 4 là Fa (không phải Rê hay La).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n25
  cau: Một nốt trắng bằng 2 nốt đen (không phải 4 hay ½).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n26
  cau: Khi nốt đen là 1 phách, nốt đen chấm dôi dài 1 phách rưỡi (không phải 2, hay 1 và ¼).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n27
  cau: Số chỉ nhịp 3/4 nghĩa là mỗi ô nhịp 3 phách, nốt đen là 1 phách (không phải 4 phách với nốt móc ba là 1 phách, cũng không phải chơi với 3/4 tốc độ).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n28
  cau: Nhịp 6/8 thường được cảm nhận thành 2 phách lớn (không phải 3 hay 6).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n29
  cau: Si – Đô cách nhau nửa cung tự nhiên; La – Si và Fa – Sol cách nhau một cung.
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n30
  cau: Dấu hóa bất thường có hiệu lực đến hết ô nhịp (không phải hết bản nhạc, cũng không phải chỉ một nốt).
  loai: quy-tac
- trang: bat-dau/kiem-tra-dau-vao
  id: n31
  cau: Gam Sol trưởng có dấu hóa Fa♯ (không phải Si♭ hay Đô♯).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n32
  cau: Bậc V của gam trưởng gọi là át âm (bậc I là chủ âm, bậc VII là cảm âm).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n33
  cau: Giọng thứ song song của Đô trưởng là La thứ (Đô thứ là giọng thứ cùng tên).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n34
  cau: Gam thứ hòa âm nâng bậc 7 (không phải bậc 3 hay bậc 6).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n35
  cau: Hóa biểu 3 dấu giáng là của Mi♭ trưởng (La♭ trưởng có 4 dấu giáng, Si♭ trưởng có 2).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n36
  cau: Thứ tự dấu thăng bắt đầu bằng Fa – Đô – Sol (Si – Mi – La là thứ tự dấu giáng).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n37
  cau: Đô – Sol là quãng 5 đúng (không phải 5 trưởng hay 4 đúng).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n38
  cau: Đảo quãng 3 trưởng thì được quãng 6 thứ (không phải 6 trưởng hay 5 đúng).
  loai: quy-tac
- trang: bat-dau/kiem-tra-dau-vao
  id: n39
  cau: Hợp âm Rê – Fa – La là hợp âm thứ (không phải trưởng hay giảm).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n40
  cau: Trong giọng trưởng, hợp âm bậc vii là hợp âm giảm (không phải thứ hay tăng).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n41
  cau: Hợp âm Đô trưởng có Mi ở bè trầm là thể đảo 1 (không phải thể gốc hay đảo 2).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n42
  cau: G7 (Sol – Si – Rê – Fa) là hợp âm bảy át (không phải bảy trưởng hay bảy thứ).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n43
  cau: Hợp âm IV thuộc chức năng hạ át (không phải chủ hay át).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n44
  cau: Hợp âm vi có thể thay thế I vì cùng chức năng chủ (V thuộc chức năng át, ii thuộc chức năng hạ át).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n45
  cau: Kết thúc câu nhạc ở hợp âm V gọi là kết nửa (không phải kết trọn hay kết lừa).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n46
  cau: V – vi là kết lừa (không phải kết plagal hay kết trọn).
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n47
  cau: '"Allegro" nghĩa là nhanh, vui tươi (không phải chậm, thong thả, cũng không phải to dần).'
  loai: dinh-nghia
- trang: bat-dau/kiem-tra-dau-vao
  id: n48
  cau: Ký hiệu "p" nghĩa là nhỏ (piano), không phải to (forte) hay ngắt ngắn.
  loai: dinh-nghia
- trang: bat-dau/lo-trinh-choi
  id: n1
  cau: Kế hoạch 12 tháng cho người lớn bắt đầu học piano từ con số 0, tập 20–30 phút mỗi ngày trong sáu tháng đầu, rồi khoảng 30 phút, 5–6 ngày mỗi tuần.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n2
  cau: Cuối năm, bạn có một chương trình nhỏ ba bài để chơi cho người khác nghe, ở khoảng trình độ ABRSM Grade 1–2.
  loai: cap-do
- trang: bat-dau/lo-trinh-choi
  id: n3
  cau: Thời gian chỉ là gợi ý. Đi chậm hơn một nửa vẫn hoàn toàn ổn, miễn là đều đặn và tay không đau.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n4
  cau: 3 phút khởi động · 5 phút năm ngón hoặc gam · 15 phút bài đang học (đoạn khó trước) · 5 phút đọc nốt hoặc thị tấu · 2 phút ghi nhật ký. Nhạc lý, luyện tai và nghe nhạc làm thêm ngoài giờ ngồi đàn, khoảng 10 phút.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n5
  cau: "Trước khi bắt đầu: chuẩn bị đàn, ghế, máy đếm nhịp và điện thoại để thu âm theo danh sách Trước ngày đầu tiên; đọc Tư thế, thế tay và cách dùng lực và Cách tập hiệu quả; quyết định học với thầy, tự học hay kết hợp."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n6
  cau: "Tháng 1, bên đàn: Hai tuần đầu tiên (tư thế, Đô giữa, thế Đô), rồi 10 bài đầu tiên, bài 1–3; đọc nốt khóa Sol mỗi ngày. Danh sách kiểm tra: chơi bài 1–3 hai tay ở ♩ = 72, không dừng; đọc đúng 9/10 nốt khóa Sol trong công cụ đọc nốt; tìm được mọi phím Đô và Fa trên đàn chỉ trong một giây."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n7
  cau: "Bach: Prelude Đô trưởng. Hãy nhớ cảm giác này: đến chặng 4 của lộ trình, chính bạn sẽ chơi nó."
  loai: cap-do
- trang: bat-dau/lo-trinh-choi
  id: n8
  cau: "Tháng 2, bên đàn: 10 bài đầu tiên, bài 4–5 (hợp âm tay trái, Frère Jacques); Vị trí năm ngón: thế Đô, Sol, Fa, song song và ngược chiều; đọc nốt khóa Fa; tiết tấu cấp 1. Danh sách kiểm tra: đổi hợp âm Đô–Mi–Sol ↔ Si–Fa–Sol ở tay trái mà không nhìn tay; đọc đúng 9/10 nốt khóa Fa; gõ đúng tiết tấu cấp 1."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n9
  cau: "Mozart: Sonata K. 331, chương 3 Alla turca."
  loai: ten
- trang: bat-dau/lo-trinh-choi
  id: n10
  cau: "Tháng 3: nhịp 3/4, 6/8 và gam đầu tiên. Bên đàn: 10 bài đầu tiên, bài 6–7 (Amazing Grace, Greensleeves); gam Đô trưởng một quãng tám, tay riêng rồi hai tay."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n11
  cau: "Tháng 3, danh sách kiểm tra: gam Đô trưởng hai tay, một quãng tám, nốt móc đơn ở ♩ = 60; thu âm bài 6 hoặc bài 7, nghe lại và ghi hai điều cần sửa; nhận ra quãng 3 trưởng, 5 đúng, 8 đúng."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n12
  cau: "Tháng 3, tai và nghe: Nghe quãng: quãng 3 trưởng, 5 đúng, 8 đúng."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n13
  cau: "Tháng 4, bên đàn: 10 bài đầu tiên, bài 8 (Largo, bàn đạp lần đầu); Bàn đạp: bàn đạp nối; gam Sol và Fa trưởng; thị tấu cấp 1, ba giai điệu mỗi ngày. Danh sách kiểm tra: đổi bàn đạp đúng lúc trong bài 8, tiếng không nhòe mà cũng không đứt; đọc hóa biểu đến 2 dấu hóa bằng công cụ hóa biểu."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n14
  cau: 'Tháng 5: Minuet và Für Elise. Bên đàn: 10 bài đầu tiên, bài 9–10; Hợp âm và hình đệm: chuỗi I–IV–I–V7–I ở Đô, Sol, Fa, hợp âm rải; Chơi theo tai: tìm lại Ode to Joy không nhìn bản nhạc, đệm bằng I, IV, V. Danh sách kiểm tra: xong cả 10 bài, chọn ba bài thích nhất làm "tiết mục" và chơi lại mỗi tuần; chơi cho một người nghe; tìm lại trên phím một giai điệu quen và đệm tay trái bằng nốt trầm Đô, Fa, Sol.'
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n15
  cau: "Tháng 6, bên đàn: Minuet Sol trưởng, bản gốc hai bè."
  loai: cau-truc
- trang: bat-dau/lo-trinh-choi
  id: n16
  cau: "Tháng 6, bên đàn: Schumann: Melodie."
  loai: ten
- trang: bat-dau/lo-trinh-choi
  id: n17
  cau: "Tháng 6: gam Đô, Sol, Rê, Fa trưởng và La, Mi, Rê thứ hòa âm, hai quãng tám, tay riêng. Danh sách kiểm tra: chơi trọn Minuet Sol trưởng, hai tay, không dừng; đọc được nhạc hai khóa và thị tấu chậm một bài rất dễ bằng hai tay; nhật ký có ít nhất 100 ngày tập."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n18
  cau: "Bach: Biến tấu Goldberg: Aria và vài biến tấu đầu."
  loai: cau-truc
- trang: bat-dau/lo-trinh-choi
  id: n19
  cau: Cuối tháng 6 là cuối chặng đầu của lộ trình piano.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n20
  cau: "Tháng 7, bên đàn: Burgmüller: La candeur (Op. 100 số 1)."
  loai: danh-muc
- trang: bat-dau/lo-trinh-choi
  id: n21
  cau: "Tháng 7, bên đàn: hoặc Tchaikovsky: Bài ca Pháp cổ."
  loai: ten
- trang: bat-dau/lo-trinh-choi
  id: n22
  cau: "Tháng 7: Tạo tiếng đàn: legato, staccato, giai điệu nổi trên phần đệm; bài 13: đánh dấu bằng bút chì các kết trong bài đang tập; Nghe hợp âm: trưởng và thứ. Danh sách kiểm tra: giai điệu legato nổi rõ trên phần đệm nhỏ hơn của tay kia; phân biệt hợp âm trưởng và thứ đúng 9/10 lần."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n23
  cau: "Tháng 8, bên đàn: Mozart: Minuet Fa trưởng K. 2: câu bốn ô, kết nửa và kết trọn."
  loai: cau-truc
- trang: bat-dau/lo-trinh-choi
  id: n24
  cau: "Danh sách kiểm tra tháng 8: chơi trọn Minuet K. 2 có nhắc lại, nghe rõ chỗ kết nửa và kết trọn."
  loai: cau-truc
- trang: bat-dau/lo-trinh-choi
  id: n25
  cau: Khi nghe một chương sonata, chỉ ra được trình bày, phát triển, tái hiện.
  loai: dinh-nghia
- trang: bat-dau/lo-trinh-choi
  id: n26
  cau: "Tháng 9, bên đàn: Minuet Sol thứ (BWV Anh. 115) hoặc Musette Rê trưởng: phát âm kiểu Baroque."
  loai: danh-muc
- trang: bat-dau/lo-trinh-choi
  id: n27
  cau: Đọc trước trang Nốt hoa mỹ để nhận ra các ký hiệu khi gặp; láy và appoggiatura thuộc chặng 3, láy rền thuộc chặng 4.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n28
  cau: "Danh sách kiểm tra tháng 9: gam trưởng đến 2 dấu hóa, hai tay, hai quãng tám; chơi trọn Minuet Sol thứ hoặc Musette, có nhắc lại, nhịp đều từ đầu đến cuối."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n29
  cau: "Tháng 10, bên đàn: Schumann: Album für die Jugend: Wilder Reiter, Fröhlicher Landmann; chậm lại một chút ở cuối câu rồi trở về nhịp."
  loai: ten
- trang: bat-dau/lo-trinh-choi
  id: n30
  cau: Giai điệu ở tay trái (Fröhlicher Landmann) nổi rõ hơn hợp âm của tay phải.
  loai: cau-truc
- trang: bat-dau/lo-trinh-choi
  id: n31
  cau: "Tháng 10: bắt đầu học thuộc một bài; Phân tích một tác phẩm, áp dụng cho chính bài bạn đang tập. Danh sách kiểm tra: viết được sơ đồ cấu trúc (A – B – A…) của bài đang tập."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n32
  cau: "Tháng 11: chọn ba bài, mỗi bài một thời kỳ (Baroque, Cổ điển, Lãng mạn), ví dụ Musette Rê trưởng, Minuet K. 2 và Bài ca Pháp cổ."
  loai: lich-su
- trang: bat-dau/lo-trinh-choi
  id: n33
  cau: 'Tháng 11: mỗi tuần một lần "biểu diễn thử" từ đầu đến cuối, thu âm; Đọc nhạc và thị tấu: mỗi ngày 5 phút thị tấu bài dễ hơn hai cấp. Danh sách kiểm tra: chơi liền ba bài, sai vẫn đi tiếp, không quay lại; có kế hoạch cho những chỗ hay vấp (điểm xuất phát dự phòng).'
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n34
  cau: "Tháng 12: chơi chương trình ba bài cho gia đình, bạn bè hoặc một nhóm học đàn trực tuyến; quay video; ôn ký hiệu biểu diễn và từ điển thuật ngữ; đi nghe một buổi hòa nhạc piano."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n35
  cau: Cuối năm đầu, bạn đã ở khoảng chặng 2 của lộ trình (khoảng ABRSM Grade 1–2).
  loai: cap-do
- trang: bat-dau/lo-trinh-choi
  id: n36
  cau: "Danh sách kiểm tra cuối năm: chương trình ba bài, chơi liền mạch trước người nghe; gam trưởng và thứ hòa âm đến 2 dấu hóa, hai tay; gọi tên được hòa âm cơ bản (I, IV, V, kết) trong các bài mình chơi."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n37
  cau: Thị tấu được bài cấp Initial đến Grade 1, chậm mà không dừng.
  loai: cap-do
- trang: bat-dau/lo-trinh-choi
  id: n38
  cau: "Năm thứ hai, bên đàn: từ chặng 2 sang chặng 3 của lộ trình piano, với các bài học của chặng 3."
  loai: cap-do
- trang: bat-dau/lo-trinh-choi
  id: n39
  cau: Cuối năm, nếu muốn, chọn một "bài với" của chặng 4 như Gymnopédie số 1 hoặc Für Elise trọn bài.
  loai: cap-do
- trang: bat-dau/lo-trinh-choi
  id: n40
  cau: "Năm thứ hai: nhạc lý và nghe theo nhánh nhạc lý từ bài 16, rồi các bài trung cấp; nghe theo lộ trình nghe hiểu; mục tiêu bên ngoài: vài buổi học với thầy để chỉnh tư thế, hoặc một kỳ thi cấp."
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n41
  cau: Gần như ai cũng chậm hơn ở vài tháng, nhất là tháng 2 (hai tay) và tháng 6 (tác phẩm thật đầu tiên).
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-choi
  id: n42
  cau: 'Khi chậm hơn lộ trình: giữ thói quen, giảm mục tiêu (15 phút mỗi ngày tốt hơn bỏ một tuần); một bài thôi; kiểm tra cách tập (phần lớn "chững lại" đến từ tập quá nhanh hoặc luôn chơi từ đầu bài); đau là dừng, tiến độ không bao giờ đáng đổi lấy chấn thương.'
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n1
  cau: Phần chính là lộ trình nghe khoảng 6 tháng, mỗi ngày 20 phút, chỉ dùng phần nhạc lý thật sự cần cho việc nghe.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n2
  cau: Nhạc cổ điển được ghi lại bằng bản nhạc, nhưng mỗi người chơi diễn giải một khác.
  loai: dinh-nghia
- trang: bat-dau/lo-trinh-nghe
  id: n3
  cau: Vì thế một tác phẩm có nhiều bản thu, và so sánh chúng là một phần niềm vui.
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n4
  cau: Một bản giao hưởng có thể dài 40 phút, chia thành các chương.
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n5
  cau: Ý tưởng được giới thiệu, phát triển, biến đổi rồi quay lại.
  loai: dinh-nghia
- trang: bat-dau/lo-trinh-nghe
  id: n6
  cau: Hãy nghe từng chương một, tìm giai điệu chính và để ý khi nó trở lại.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n7
  cau: Dải âm lượng rất rộng, từ tiếng thì thầm của một cây violin đến tiếng gầm của cả dàn nhạc.
  loai: dinh-nghia
- trang: bat-dau/lo-trinh-nghe
  id: n8
  cau: Đừng chỉnh âm lượng theo đoạn to nhất; hãy để đoạn nhỏ đủ nghe được.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n9
  cau: "Tai nghe hoặc loa tử tế giúp nhiều hơn bạn nghĩ: loa điện thoại làm mất gần hết âm trầm."
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n10
  cau: "Nhạc cổ điển thường không có lời: âm nhạc tự kể chuyện bằng giai điệu, hòa âm và màu sắc nhạc cụ."
  loai: dinh-nghia
- trang: bat-dau/lo-trinh-nghe
  id: n11
  cau: Đọc vài dòng về bối cảnh trước khi nghe cho bạn một điểm bám, và lần thứ ba nghe một tác phẩm thường hay hơn lần đầu.
  loai: quy-tac
- trang: bat-dau/lo-trinh-nghe
  id: n12
  cau: Thấy chán thường không phải do "không hợp", mà do chưa biết nghe cái gì; phương pháp 4 lần nghe giải quyết đúng chuyện này.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n13
  cau: Bản thu miễn phí trên mạng là đủ để bắt đầu; các dịch vụ chuyên nhạc cổ điển có ở Tài nguyên.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n14
  cau: "Tháng 1 nghe Vivaldi Mùa xuân, Mozart Eine kleine Nachtmusik, Haydn Surprise, và một tác phẩm piano: Mozart Sonata K. 331, chương 3 Alla turca."
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n15
  cau: "Nhạc lý tháng 1: bài 1 và bài 4, đủ để hiểu cao độ và nhịp."
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n16
  cau: Mỗi ngày 5 phút nhận biết quãng ở bộ Khởi động.
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n17
  cau: "Nhạc lý tháng 2: bài 6, bài 7; hiểu vì sao giọng thứ nghe buồn."
  loai: dinh-nghia
- trang: bat-dau/lo-trinh-nghe
  id: n18
  cau: "Luyện tai hợp âm: phân biệt trưởng và thứ."
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n19
  cau: Beethoven Giao hưởng số 5 đi từ Đô thứ đến Đô trưởng.
  loai: cau-truc
- trang: bat-dau/lo-trinh-nghe
  id: n20
  cau: Nghe Chopin Nocturne Op. 9 số 2.
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n21
  cau: Đọc Dàn nhạc giao hưởng, nghe Peter và chó sói và Britten Young Person's Guide.
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n22
  cau: Nghe Debussy Clair de lune, Ravel Boléro, Tchaikovsky Hồ thiên nga.
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n23
  cau: "Nhạc lý tháng 4: bài 12 và bài 13 (đọc để hiểu, không cần làm hết bài tập)."
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n24
  cau: Nghe Mozart Giao hưởng số 40 (hình thức sonata).
  loai: cau-truc
- trang: bat-dau/lo-trinh-nghe
  id: n25
  cau: Nghe Bach Prelude (Đô trưởng, BWV 846).
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n26
  cau: Tháng 5 nghe Schubert Erlkönig, Mozart Nữ hoàng bóng đêm, Bizet Habanera.
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n27
  cau: Tháng 6 (thế kỷ 20 và hôm nay) nghe Debussy Préludes quyển 1, Stravinsky Le Sacre du printemps, Pärt Spiegel im Spiegel.
  loai: nam
- trang: bat-dau/lo-trinh-nghe
  id: n28
  cau: Đi xem một buổi hòa nhạc trực tiếp.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n29
  cau: Trang riêng của từng thời kỳ có 10 tác phẩm để nghe.
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n30
  cau: "Nghe thêm các hướng dẫn khác: Bach cello, Mozart Requiem, Schubert Con cá hồi, Brahms 4, Shostakovich 5, Beethoven Op. 132."
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n31
  cau: Nghe trọn các hướng dẫn nghe nhạc piano, từ Scarlatti đến Gershwin.
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n32
  cau: "Học mục Nhận diện: bảng so sánh các thời kỳ, luyện nghe nhận diện, rồi nghe mù."
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n33
  cau: "Bài 28: Kết cấu, 29: Chuỗi hòa âm, 31: Hình thức nhỏ; Âm học cơ bản; Nhạc truyền thống Việt Nam và nhạc cổ điển."
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n34
  cau: Nhánh nhạc lý đi song song với lộ trình nghe, mỗi ngày thêm 20–30 phút; thời gian chỉ là gợi ý.
  loai: khuyen-tap
- trang: bat-dau/lo-trinh-nghe
  id: n35
  cau: "Tháng 1–2, bài 1–4: đọc được tên nốt và đếm được nhịp; đúng 90% nốt khóa Sol và khóa Fa ở công cụ đọc nốt."
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n36
  cau: "Tháng 3–4, bài 5–9: dấu hóa, gam, hóa biểu và quãng; đọc hóa biểu đến 4 dấu hóa, nghe ra 3 trưởng, 5 đúng, 8 đúng, gõ đúng tiết tấu cấp độ 2."
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n37
  cau: "Tháng 5–7, bài 10–14: hợp âm, hòa âm chức năng, kết và ký hiệu biểu diễn; phân biệt hợp âm trưởng và thứ, thị tấu giai điệu cấp độ 1, ôn thuật ngữ."
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n38
  cau: "Tháng 8–10, Hình thức & thể loại: nghe một tác phẩm dài mà không bị lạc; nghe Haydn 94 và Mozart 40 với sơ đồ."
  loai: so-lieu
- trang: bat-dau/lo-trinh-nghe
  id: n39
  cau: "Tháng 11–12, bài 15–20: tiết tấu nâng cao, điệu thức, khóa Đô, âm ngoài hợp âm, át phụ và chuyển giọng, đọc tổng phổ."
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n40
  cau: "Năm thứ hai: Âm học, bài 21–32 từ Hòa âm bốn bè; mỗi tháng phân tích một tác phẩm theo quy trình 6 bước."
  loai: ten
- trang: bat-dau/lo-trinh-nghe
  id: n41
  cau: "Suốt năm: luyện tập gần như mỗi ngày và ghi nhật ký luyện tập; nếu có thể, học piano song song theo Lộ trình piano năm đầu."
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n1
  cau: "Một buổi tập piano tốt có cấu trúc: khởi động, kỹ thuật, bài đang học, đọc nhạc, rồi ghi lại. Dưới đây là ba khuôn mẫu theo thời gian bạn có. Chọn một khuôn và giữ nó đều đặn; đều đặn quan trọng hơn dài."
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n2
  cau: "Buổi 30 phút (chuẩn): 3 phút khởi động (thả lỏng vai và cổ tay, năm ngón chậm hai tay); 5 phút kỹ thuật (gam và hợp âm rải của tuần); 15 phút bài đang học (đoạn khó trước, chậm, theo mục tiêu viết sẵn một dòng); 5 phút đọc nốt hoặc thị tấu một bài dễ; 2 phút ghi nhật ký (hôm nay sửa được gì, mai làm gì)."
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n3
  cau: Ngoài giờ ngồi đàn, dành thêm 10 phút cho nghe chủ động hoặc một bài nhạc lý (lúc đi đường, lúc nghỉ trưa). Tai và đầu học được cả khi tay nghỉ.
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n4
  cau: Khi buổi tập dài 45 hoặc 90 phút, thêm một bài thứ hai ở phong cách khác, một étude ngắn (Bài tập ngón và étude) và một quãng nghỉ đứng dậy thả tay giữa buổi. Bảng chia phút cho buổi 20, 45 và 90 phút ở Cách tập hiệu quả.
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n5
  cau: 'Ngày bận (10 phút): Năm ngón hoặc một gam (2 phút), đoạn khó nhất của bài đang tập (6 phút), đọc nốt (2 phút). Mục tiêu của ngày bận là không làm đứt chuỗi, không phải tiến thêm. Ngay cả 10 phút cũng giữ cho tay và đầu không "nguội".'
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n6
  cau: "Lịch tuần gợi ý, cột Bên đàn: thứ Hai bài mới (nghe, đọc, chia đoạn, ghi số ngón); thứ Ba đoạn khó, tay riêng, thật chậm; thứ Tư ghép hai tay chậm ở các điểm neo; thứ Năm tăng tốc theo nấc máy đếm nhịp; thứ Sáu chơi liền cả bài, thu âm; cuối tuần chơi cho người khác nghe, hoặc chơi tự do các bài cũ."
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n7
  cau: "Lịch tuần gợi ý, cột Nhạc lý và tai, cột Nghe: bài nhạc lý mới, bài tập của bài, luyện tai 10 phút, ôn bài tuần trước, thị tấu, nghỉ; nghe tác phẩm của tuần lần 1 (chỉ cảm nhận), lần 2 tìm giai điệu chính, lần 3 theo dõi cấu trúc, một bản thu khác, viết một trang nhật ký nghe, đi xem hòa nhạc hay nghe thứ mình thích."
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n8
  cau: 'Khi nào chuyển sang bài mới? Khi bạn chơi được bài hiện tại ở tốc độ mục tiêu ba lần liền mà không dừng. Bài cũ không bị bỏ: đưa nó vào danh sách "duy trì" và chơi lại một hai lần mỗi tuần, để cuối năm bạn có cả một chương trình chứ không chỉ một bài.'
  loai: khuyen-tap
- trang: bat-dau/moi-ngay
  id: n9
  cau: 'Đau là tín hiệu dừng: tay, cổ tay hay cẳng tay đau khi tập không phải dấu hiệu "đang cố gắng", mà là tín hiệu dừng lại. Nghỉ, kiểm tra tư thế, giảm thời gian và đọc Giữ đôi tay khỏe.'
  loai: khuyen-tap
- trang: bat-dau/tom-tat
  id: n1
  cau: Bấm Ctrl+P (hoặc Cmd+P), chọn khổ A4.
  loai: khuyen-tap
- trang: bat-dau/tom-tat
  id: n2
  cau: Menu và nút bấm tự ẩn khi in.
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n3
  cau: "Toàn bộ kiến thức đọc nhạc và nhạc lý cơ bản trên hai mặt giấy A4: mặt 1 là đọc nhạc, mặt 2 là nhạc lý."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n4
  cau: Nên chờ các khuông nhạc hiện đủ trước khi in.
  loai: khuyen-tap
- trang: bat-dau/tom-tat
  id: n5
  cau: "Hình bàn phím từ Đô3 (C3) đến Đô5 (C5): 15 phím trắng ghi tên hai hệ, 10 phím đen theo nhóm hai và ba, Đô giữa C4 được tô màu, bốn ngoặc ½ đánh dấu Mi–Fa và Si–Đô."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n6
  cau: "Bảy tên nốt lặp lại: Đô Rê Mi Fa Sol La Si = C D E F G A B."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n7
  cau: Đô nằm bên trái nhóm 2 phím đen.
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n8
  cau: Phím đen mang hai tên (Đô♯ = Rê♭).
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n9
  cau: "Nửa cung tự nhiên: Mi–Fa và Si–Đô (không có phím đen xen giữa)."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n10
  cau: "Khóa Sol: các dòng, đếm từ dưới lên, là Mi Sol Si Rê Fa (E G B D F); các khe là Fa La Đô Mi (F A C E)."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n11
  cau: Nét xoắn của khóa Sol ôm dòng 2 = Sol (G4).
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n12
  cau: "Khóa Fa: các dòng, đếm từ dưới lên, là Sol Si Rê Fa La (G B D F A); các khe là La Đô Mi Sol (A C E G)."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n13
  cau: Hai chấm của khóa Fa kẹp dòng 4 = Fa (F3).
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n14
  cau: "Đô4 (Đô giữa, C4) nằm trên một dòng kẻ phụ: ngay dưới khuông khóa Sol, ngay trên khuông khóa Fa."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n15
  cau: "Khi nốt đen = 1 phách: nốt tròn 4 phách, nốt trắng 2, nốt đen 1, nốt móc đơn ½, nốt móc kép ¼, nốt đen chấm dôi 1½; dấu lặng cùng tên dài bằng nốt tương ứng."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n16
  cau: Chấm dôi thêm một nửa độ dài.
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n17
  cau: Dấu nối cộng hai nốt cùng cao độ.
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n18
  cau: Dấu thăng nâng nửa cung, dấu giáng hạ nửa cung, dấu bình hủy dấu hóa trước đó.
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n19
  cau: Dấu hóa bất thường có hiệu lực đến hết ô nhịp.
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n20
  cau: "2/4: 2 phách nốt đen, MẠNH–nhẹ."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n21
  cau: "3/4: 3 phách, MẠNH–nhẹ–nhẹ (valse, minuet)."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n22
  cau: "4/4 (C): 4 phách, MẠNH–nhẹ–vừa–nhẹ."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n23
  cau: "6/8: 2 phách lớn, mỗi phách chia 3."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n24
  cau: "Số trên: số phách mỗi ô. Số dưới: hình nốt làm 1 phách (4 = đen). Riêng 6/8: đếm 6 nốt móc đơn (8 = móc đơn), gộp ba nốt thành một phách lớn."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n25
  cau: "Gam Đô trưởng: Đô Rê Mi Fa Sol La Si Đô, bậc I đến VII rồi I."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n26
  cau: "Gam trưởng: C C N C C C N (C = cung, N = nửa cung)."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n27
  cau: "Gam thứ tự nhiên: C N C C N C C."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n28
  cau: "Gam thứ hòa âm: như thứ tự nhiên, nâng bậc 7."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n29
  cau: "Gam thứ giai điệu: đi lên nâng bậc 6 và 7."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n30
  cau: Bậc I chủ âm · V át âm · IV hạ át âm · VII cảm âm.
  loai: ten
- trang: bat-dau/tom-tat
  id: n31
  cau: Bảy dấu thăng, luôn theo thứ tự Fa Đô Sol Rê La Mi Si.
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n32
  cau: Bảy dấu giáng, theo thứ tự ngược lại Si Mi La Rê Sol Đô Fa.
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n33
  cau: "Thăng: dấu cuối + nửa cung = giọng trưởng."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n34
  cau: "Giáng: dấu áp chót = giọng trưởng (riêng 1♭ = Fa trưởng)."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n35
  cau: "Giọng thứ song song: từ chủ âm trưởng xuống 3 nửa cung."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n36
  cau: "Hình vòng quãng năm: vòng ngoài là 12 giọng trưởng C, G, D, A, E, B, F♯/G♭, D♭, A♭, E♭, B♭, F, kèm số dấu 0, 1♯ … 5♯, 6♯/6♭, 5♭ … 1♭; vòng trong là giọng thứ song song a, e, b, f♯, c♯, g♯, d♯/e♭, b♭, f, c, g, d."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n37
  cau: "Theo chiều kim đồng hồ: lên quãng 5, thêm một ♯. Ngược chiều: thêm một ♭."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n38
  cau: Hai giọng cạnh nhau khác nhau một dấu hóa.
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n39
  cau: "Quãng 2 thứ / 2 trưởng: 1 / 2 nửa cung; từ Đô là Rê♭ / Rê."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n40
  cau: "Quãng 3 thứ / 3 trưởng: 3 / 4 nửa cung; từ Đô là Mi♭ / Mi."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n41
  cau: "Quãng 4 đúng: 5 nửa cung; từ Đô là Fa."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n42
  cau: "Quãng 4 tăng = 5 giảm: 6 nửa cung; từ Đô là Fa♯ = Sol♭."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n43
  cau: "Quãng 5 đúng: 7 nửa cung; từ Đô là Sol."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n44
  cau: "Quãng 6 thứ / 6 trưởng: 8 / 9 nửa cung; từ Đô là La♭ / La."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n45
  cau: "Quãng 7 thứ / 7 trưởng: 10 / 11 nửa cung; từ Đô là Si♭ / Si."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n46
  cau: "Quãng 8 đúng: 12 nửa cung; từ Đô là Đô."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n47
  cau: "Đảo quãng: 9 − số; trưởng ↔ thứ, tăng ↔ giảm, đúng giữ nguyên."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n48
  cau: "Bốn loại hợp âm ba (trên Đô): trưởng Đô–Mi–Sol (3T+3t), thứ Đô–Mi♭–Sol (3t+3T), giảm Đô–Mi♭–Sol♭ (3t+3t), tăng Đô–Mi–Sol♯ (3T+3T)."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n49
  cau: "Trong giọng trưởng: I ii iii IV V vi vii° (chữ hoa: trưởng, chữ thường: thứ, °: giảm)."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n50
  cau: Hợp âm bảy át V7 = hợp âm trưởng + 7 thứ.
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n51
  cau: "Chức năng chủ (ổn định): I (vi đôi khi thay I)."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n52
  cau: "Chức năng hạ át (rời đi): IV, ii."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n53
  cau: "Chức năng át (căng, đòi về): V, V7, vii°."
  loai: quy-tac
- trang: bat-dau/tom-tat
  id: n54
  cau: "Kết trọn: V → I."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n55
  cau: "Kết nửa: … → V."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n56
  cau: "Kết plagal: IV → I."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n57
  cau: "Kết lừa: V → vi."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n58
  cau: "Tốc độ: Largo < Adagio < Andante < Moderato < Allegro < Presto."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n59
  cau: rit. chậm dần, accel. nhanh dần, a tempo trở lại.
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n60
  cau: "Cường độ: pp < p < mp < mf < f < ff."
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n61
  cau: cresc. to dần, dim. nhỏ dần, sfz nhấn đột ngột.
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n62
  cau: staccato ngắt, legato liền, fermata ngân dài.
  loai: dinh-nghia
- trang: bat-dau/tom-tat
  id: n63
  cau: D.C. từ đầu, Fine hết.
  loai: dinh-nghia
- trang: piano/lo-trinh
  id: n1
  cau: Mốc thời gian tính từ ngày bắt đầu, cho người lớn tập đều đặn và có người hướng dẫn; đây là con số rất thô (có người đi nhanh gấp đôi, có người mất gấp đôi thời gian), điều quyết định là có tiếp tục đi hay không.
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n2
  cau: Hàng Nhạc lý ở mỗi chặng là mức tối thiểu; lộ trình năm đầu học hết bài 1–15 ngay trong 12 tháng.
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n3
  cau: Site dùng cấp (grade) của ABRSM làm thước đo độ khó, vì đây là hệ thống phổ biến nhất thế giới.
  loai: so-lieu
- trang: piano/lo-trinh
  id: n4
  cau: ABRSM và Trinity College London (đều của Anh) có cấp Initial, rồi Grade 1 đến Grade 8, sau đó là các bằng diploma.
  loai: cap-do
- trang: piano/lo-trinh
  id: n5
  cau: Nhà xuất bản G. Henle có thang độ khó thứ hai, từ 1 đến 9, cho từng tác phẩm.
  loai: cap-do
- trang: piano/lo-trinh
  id: n6
  cau: Không cần đi thi để theo lộ trình; cấp chỉ là ngôn ngữ chung để nói bài khó cỡ nào.
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n7
  cau: Chặng chơi được các bài một cách thoải mái là chặng vừa hoàn thành; bắt đầu từ chặng kế tiếp và rà lại danh sách kiểm tra các chặng trước, vì người tự học thường mạnh về bài, yếu về gam, thị tấu, bàn đạp.
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n8
  cau: 'Mục tiêu của bảy chặng (câu "Mục tiêu: …" đầu mỗi mục chặng 1–6 và đoạn đầu chặng 7).'
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n9
  cau: Dòng Tay của chặng 1–3 (tư thế, năm ngón, legato và staccato, luồn ngón cái, câu nhạc "thở", sắc thái, bàn đạp; Alberti, móc kép đều, staccato bằng cổ tay, đạp trễ, láy và appoggiatura, phát âm theo thời kỳ).
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n10
  cau: Dòng Gam, hợp âm của chặng 1–5 (năm ngón và gam Đô trưởng một quãng tám ở chặng 1; gam trưởng Đô, Sol, Rê, Fa và thứ hòa âm La, Mi, Rê ở chặng 2; đến 3 dấu hóa, ngược chiều, nửa cung một quãng tám ở chặng 3; mọi gam trưởng và thứ hai tay ở chặng 4; 3–4 quãng tám, hợp âm bảy át và bảy giảm rải ở chặng 5).
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n11
  cau: Ở Đô trưởng, hợp âm Đô là bậc I và hợp âm Sol bảy (Sol–Si–Rê–Fa) là V7.
  loai: dinh-nghia
- trang: piano/lo-trinh
  id: n12
  cau: "Các nốt mốc trên khuông kép: Đô giữa, Sol của khóa Sol, Fa của khóa Fa."
  loai: dinh-nghia
- trang: piano/lo-trinh
  id: n13
  cau: "Dòng Đọc nhạc của chặng 1–6 (bài 4–8 ô nhịp, thị tấu dễ hơn bài đang tập khoảng hai cấp: Grade 1–2 ở chặng 3, Grade 2–3 ở chặng 4, Grade 3–4 ở chặng 5, Grade 5 ở chặng 6; đọc theo hình dạng quãng; đọc trước; bốn tay, đệm, nhạc thính phòng)."
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n14
  cau: "Dòng Nhạc lý của chặng 1–6: bài 1–5 và Ôn tập 1; bài 6–9 (gam, hóa biểu, quãng) và Ôn tập 2; bài 10–14 (hợp âm, hòa âm chức năng, kết, ký hiệu biểu diễn) và Ôn tập 3; bài 15–19 (tiết tấu nâng cao, điệu thức, dịch giọng, âm ngoài hợp âm, át phụ và chuyển giọng) và bài 31 Hình thức nhỏ; bài 21–26; bài 27–32 (ký hiệu hợp âm, kết cấu, chuỗi hòa âm, phát triển môtip, hình thức, kỹ thuật thế kỷ 20)."
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n15
  cau: Dòng Tai của chặng 1–6 (hát lại, nghe quãng, hợp âm trưởng và thứ, gam, chơi theo tai, tiến trình I, IV, V và kết, chép giai điệu, hợp âm bảy, so sánh bản thu).
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n16
  cau: Có giáo trình piano cho người lớn mới học của Alfred và của Faber.
  loai: ten
- trang: piano/lo-trinh
  id: n17
  cau: Các bài đầu trong Türk và trong Mikrokosmos của Bartók hợp chặng 1 (trước Grade 1).
  loai: cap-do
- trang: piano/lo-trinh
  id: n18
  cau: "Bach: Prelude Đô trưởng, Schumann: Kinderszenen, Beethoven: Ánh trăng là những bài sẽ chơi trong vài năm tới (chặng 4–5)."
  loai: cap-do
- trang: piano/lo-trinh
  id: n19
  cau: Dòng Biểu diễn và danh sách "Sẵn sàng lên chặng tiếp khi…" của chặng 1–6 (thu âm, học thuộc, chương trình 10, 15, 20–30 phút, nhịp ♩ = 60–80, 9/10 nốt, gam theo chặng).
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n20
  cau: Kabalevsky và Bartók, For Children hợp chặng 2 (Grade 1–2).
  loai: cap-do
- trang: piano/lo-trinh
  id: n21
  cau: "Mozart: Sonata K. 331; Chopin: Nocturne Op. 9 số 2."
  loai: danh-muc
- trang: piano/lo-trinh
  id: n22
  cau: "Kuhlau: Sonatina Op. 55 số 1 hợp chặng 4 (Grade 4–5), không phải chặng 3 (Grade 3)."
  loai: cap-do
- trang: piano/lo-trinh
  id: n23
  cau: "Schubert: Impromptu Op. 90 số 3; Beethoven: Pathétique (Op. 13)."
  loai: danh-muc
- trang: piano/lo-trinh
  id: n24
  cau: "Dòng Tay của chặng 4–6 (phức điệu hai bè, cân bằng giai điệu và đệm trong một tay, rubato; hình thức sonata thật ở Mozart K. 545, ba lớp âm thanh ở Träumerei, đa tiết tấu hai chọi ba, quãng tám, nốt lặp và nốt kép; tốc độ, sức bền, bàn đạp theo phong cách: tiết kiệm với Mozart, theo hòa âm với Chopin, đạp nửa và una corda với Debussy, fugue ba bè)."
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n25
  cau: "Nốt hoa mỹ thời Baroque: láy rền bắt đầu từ nốt trên."
  loai: quy-tac
- trang: piano/lo-trinh
  id: n26
  cau: Chuyền tay nhanh ở Für Elise; hợp âm chơi thật khẽ và đều ở Prélude Mi thứ của Chopin.
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n27
  cau: Các Lyric Pieces khác trong Op. 12 của Grieg hợp chặng 4 (Grade 4–5).
  loai: cap-do
- trang: piano/lo-trinh
  id: n28
  cau: "Debussy: The Little Shepherd hợp chặng 5 (Grade 6)."
  loai: cap-do
- trang: piano/lo-trinh
  id: n29
  cau: Vài bài trong Romanian Folk Dances của Bartók hợp chặng 5.
  loai: cap-do
- trang: piano/lo-trinh
  id: n30
  cau: "Brahms: Intermezzo Op. 118 số 2."
  loai: danh-muc
- trang: piano/lo-trinh
  id: n31
  cau: Gam cách quãng ba, quãng sáu là yêu cầu khi thi các cấp cao (chặng 6, Grade 7–8).
  loai: cap-do
- trang: piano/lo-trinh
  id: n32
  cau: Các Impromptu khác trong Op. 90 của Schubert hợp chặng 6.
  loai: cap-do
- trang: piano/lo-trinh
  id: n33
  cau: "Brahms: Intermezzo Op. 118 số 2 hợp chặng 6."
  loai: cap-do
- trang: piano/lo-trinh
  id: n34
  cau: "Các Sinfonia của Bach và Mozart: Sonata K. 330 hợp chặng 6."
  loai: cap-do
- trang: piano/lo-trinh
  id: n35
  cau: "Beethoven: Pathétique có ba chương."
  loai: so-lieu
- trang: piano/lo-trinh
  id: n36
  cau: Sau Grade 8 có các bằng diploma của ABRSM (ARSM, LRSM, FRSM) và Trinity (ATCL, LTCL, FTCL).
  loai: ten
- trang: piano/lo-trinh
  id: n37
  cau: "Fantaisie-Impromptu và Liebestraum số 3 là những bài đầu tiên của chặng 7: kỹ thuật lớn (ba chọi bốn, quãng tám, cadenza) trong khuôn khổ khoảng năm phút."
  loai: cap-do
- trang: piano/lo-trinh
  id: n38
  cau: "Tác phẩm lớn cho chặng 7: Chopin: Ballade số 1, một sonata giữa hoặc cuối đời của Beethoven, một Partita của Bach, trọn tập Kinderszenen hay Kreisleriana của Schumann, Préludes của Debussy."
  loai: cap-do
- trang: piano/lo-trinh
  id: n39
  cau: "Lời khuyên chặng 7: chơi cùng người khác (một cách rất tốt để tiến bộ về nhịp và lắng nghe), học concerto Mozart với piano thứ hai, thử fortepiano hay harpsichord, masterclass và so sánh bản thu, nghỉ đều và tăng dần thời lượng; dấu hiệu đang tiến."
  loai: khuyen-tap
- trang: piano/lo-trinh
  id: n40
  cau: Gần như ai cũng có những tháng thấy mình "đứng yên"; nếu kéo dài, rà danh sách ở Cách tập và nghe lại bản thu cũ sau ba tháng.
  loai: khuyen-tap
