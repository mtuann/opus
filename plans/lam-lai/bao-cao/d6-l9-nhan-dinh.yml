- trang: nghe-nhac/bach-air
  id: n1
  cau: "Bảng: Johann Sebastian Bach (1685–1750)."
  loai: nam
- trang: nghe-nhac/bach-air
  id: n2
  cau: "Bảng: Tên đầy đủ: Tổ khúc cho dàn nhạc số 3 cung Rê trưởng, BWV 1068, chương 2: Air."
  loai: danh-muc
- trang: nghe-nhac/bach-air
  id: n3
  cau: "Bảng: Có lẽ sáng tác khoảng 1729–1731 ở Leipzig; nguồn chính còn lại là một bộ phần bè chép khoảng 1730–1731, một phần do chính Bach chép."
  loai: nam
- trang: nghe-nhac/bach-air
  id: n4
  cau: "Bảng: Thời kỳ Baroque."
  loai: lich-su
- trang: nghe-nhac/bach-air
  id: n5
  cau: "Bảng: Thể loại: tổ khúc cho dàn nhạc (ouverture)."
  loai: ten
- trang: nghe-nhac/bach-air
  id: n6
  cau: "Bảng: Chương Air dài khoảng 4–5 phút."
  loai: so-lieu
- trang: nghe-nhac/bach-air
  id: n7
  cau: Air nghĩa là "giai điệu".
  loai: dinh-nghia
- trang: nghe-nhac/bach-air
  id: n8
  cau: Air là chương 2 của Tổ khúc số 3.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n9
  cau: Air là một trong những giai điệu nổi tiếng nhất của Bach, và của cả nhạc cổ điển.
  loai: lich-su
- trang: nghe-nhac/bach-air
  id: n10
  cau: "Tổ khúc gồm 6 chương: Ouverture, Air, hai Gavotte, Bourrée và Gigue."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n11
  cau: Cả tổ khúc có oboe, trumpet và timpani, nhưng Air chỉ có đàn dây (violin 1, violin 2, viola) và bè continuo.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n12
  cau: Cái tên "Air on the G String" đến từ bản chuyển soạn năm 1871 cho violin và piano của nghệ sĩ violin August Wilhelmj.
  loai: lich-su
- trang: nghe-nhac/bach-air
  id: n13
  cau: Wilhelmj dịch giai điệu từ Rê trưởng xuống Đô trưởng để người chơi kéo cả giai điệu trên dây Sol, dây trầm nhất của violin.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n14
  cau: "Có hai phiên bản: bản gốc Rê trưởng cho dàn nhạc, và bản Wilhelmj Đô trưởng cho violin (cả ở câu hỏi nghe chủ động thứ hai)."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n15
  cau: "Chương nhạc chia hai nửa, mỗi nửa nhắc lại: nửa đầu 6 ô nhịp, nửa sau 12 ô."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n16
  cau: Giai điệu violin 1 mở đầu bằng một nốt Fa♯ ngân dài hơn một ô nhịp rồi mới uốn lượn đi xuống.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n17
  cau: Bè bass đi đều bằng nốt móc đơn, phần lớn nhảy quãng tám, suốt cả chương.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n18
  cau: "Theo dõi, dòng 1: dàn dây vào, violin 1 ngân dài nốt Fa♯ trên nền bè trầm đi đều bằng nốt móc đơn."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n19
  cau: "Theo dõi, dòng 2: nửa đầu kết ở La trưởng (giọng át), rồi nhắc lại."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n20
  cau: "Theo dõi, dòng 3: nửa sau, giai điệu đi qua Si thứ (giọng thứ song song), rồi La trưởng."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n21
  cau: "Theo dõi, dòng 4: về lại Rê trưởng."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n22
  cau: "Theo dõi, dòng 5: kết, giai điệu hạ xuống nốt chủ Rê, bè trầm khép lại; nửa sau nhắc lại."
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n26
  cau: "Mục Nguồn: Mutopia (Bach-Gesellschaft), IMSLP, lời tựa Bärenreiter TP 194 (Urtext NBA), Concise Oxford Dictionary of Music (Air on the G String)."
  loai: ten
- trang: nghe-nhac/bach-air
  id: n23
  cau: "Câu hỏi nghe chủ động (ba câu): nhạc cụ chơi giai điệu và bè đệm; so sánh hai phiên bản; đếm theo bè trầm."
  loai: khuyen-tap
- trang: nghe-nhac/bach-cello-1
  id: n1
  cau: "Bảng: Johann Sebastian Bach (1685–1750)."
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n2
  cau: "Bảng: Tên đầy đủ: Tổ khúc cho cello độc tấu số 1 cung Sol trưởng, BWV 1007."
  loai: danh-muc
- trang: nghe-nhac/bach-cello-1
  id: n3
  cau: "Bảng: Theo nhận định chung, sáng tác khoảng 1720, ở Köthen."
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n4
  cau: "Bảng: Thời kỳ Baroque."
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n5
  cau: "Bảng: Thể loại: tổ khúc gồm Prelude và 5 điệu nhảy."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n6
  cau: "Bảng: Prelude dài khoảng 2–3 phút."
  loai: so-lieu
- trang: nghe-nhac/bach-cello-1
  id: n7
  cau: "Bảng: Bản thu gợi ý: Pablo Casals (HMV, thu 1936–1939; Prelude số 1 thu ở Paris năm 1938)."
  loai: ten
- trang: nghe-nhac/bach-cello-1
  id: n8
  cau: "Bảng: Bản thu gợi ý: Yo-Yo Ma (CBS Masterworks, thu 1982; Sony Classical, 1997)."
  loai: ten
- trang: nghe-nhac/bach-cello-1
  id: n9
  cau: Bản viết tay của Bach đã mất; sáu tổ khúc còn lại qua bốn bản chép tay thế kỷ 18, trong đó bản của vợ ông, Anna Magdalena (chép trong khoảng 1727–1731), được coi là gần bản gốc nhất.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n10
  cau: Suốt thế kỷ 19, các tổ khúc bị coi là bài tập kỹ thuật.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n11
  cau: Bản in đầu tiên ra ở Paris năm 1824.
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n12
  cau: Năm 1890, cậu bé 13 tuổi Pablo Casals tìm thấy một ấn bản (do Friedrich Grützmacher biên tập) ở Barcelona.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n13
  cau: Casals tập các tổ khúc hơn chục năm trước khi biểu diễn công khai.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n14
  cau: Về sau Casals chơi trọn các tổ khúc trước công chúng, điều trước đó chưa ai làm.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n15
  cau: Casals thu âm cả sáu tổ khúc trong các năm 1936–1939 ở London và Paris.
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n16
  cau: Từ Casals, các tổ khúc này có chỗ thường trực trong tiết mục của mọi nghệ sĩ cello.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n17
  cau: Bach viết hòa âm cho một nhạc cụ chủ yếu chỉ chơi được một nốt mỗi lúc; lời giải là hợp âm rải.
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n18
  cau: "Hợp âm rải: các nốt của hợp âm vang lên lần lượt."
  loai: dinh-nghia
- trang: nghe-nhac/bach-cello-1
  id: n20
  cau: Prelude này giống Prelude cung Đô trưởng cho đàn phím (cùng dựng trên hợp âm rải), nhưng trên một cây đàn dây.
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n21
  cau: "Tổ khúc theo trật tự: Prelude – Allemande – Courante – Sarabande – Menuet I và II – Gigue."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n22
  cau: "Theo dõi, dòng 1: mở đầu, dây Sol buông ở bè trầm, các nốt rải đi lên rồi quay về; vòng hợp âm I – IV – V – I."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n23
  cau: "Theo dõi, dòng 2: hòa âm đi xa dần, chuyển sang vùng giọng Rê trưởng (giọng át)."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n24
  cau: "Theo dõi, dòng 3: nhạc dừng lại (dấu fermata) trên nốt Rê, âm át của Sol trưởng, như lấy hơi."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n25
  cau: "Theo dõi, dòng 4: đoạn bariolage, nốt La lặp lại (đúng cao độ dây La buông của cello) xen kẽ liên tục với các nốt khác."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n26
  cau: "Theo dõi, dòng 5: nốt Rê lặp lại xen kẽ với các nốt đi lên theo nửa cung, căng thẳng dần đến nốt cao nhất của bài."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n27
  cau: "Theo dõi, dòng 6: những hợp âm cuối cùng, kết về Sol trưởng."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n29
  cau: "Sarabande của cùng tổ khúc: một điệu nhảy chậm, nhịp 3/4."
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n32
  cau: "Mục Nguồn: Mutopia (Schirmer 1916), IMSLP, lời tựa Henle HN 666, niên biểu Fundació Pau Casals, MusicBrainz."
  loai: ten
- trang: nghe-nhac/bach-cello-1
  id: n28
  cau: "Câu hỏi nghe chủ động 1–2: nghe ra bè trầm và hợp âm; so sánh Casals (thu những năm 1930) với một bản thu hiện đại."
  loai: khuyen-tap
- trang: nghe-nhac/handel-hallelujah
  id: n1
  cau: Handel (1685–1759) (bảng và đoạn đầu).
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n2
  cau: 'Bảng: Hợp xướng "Hallelujah" là số 44 theo cách đánh số thường gặp (có ấn bản đánh số 39), kết thúc Phần II của oratorio Messiah, HWV 56.'
  loai: danh-muc
- trang: nghe-nhac/handel-hallelujah
  id: n3
  cau: "Bảng: Phần lớn viết trong khoảng 22/8–14/9/1741 (24 ngày)."
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n4
  cau: Công diễn lần đầu ngày 13/4/1742 tại Dublin (bảng và đoạn văn).
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n5
  cau: "Bảng: Lời của Charles Jennens, trích Kinh Thánh (Khải Huyền 19:6, 19:16; 11:15)."
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n6
  cau: "Bảng: Giọng Rê trưởng, có trumpet và timpani."
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n7
  cau: "Bảng: Lực lượng: hợp xướng bốn bè và dàn nhạc Baroque (trumpet, timpani, đàn dây, continuo)."
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n8
  cau: "Bảng và đoạn văn: dài khoảng 3–4 phút."
  loai: so-lieu
- trang: nghe-nhac/handel-hallelujah
  id: n9
  cau: Handel là nhà soạn nhạc sinh ở Đức, sống và thành danh ở London.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n10
  cau: Ông viết opera tiếng Ý suốt nhiều năm, nhưng khi opera Ý ở London bớt được ưa chuộng, ông chuyển dần sang oratorio.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n11
  cau: "Oratorio: tác phẩm tôn giáo có tính kịch cho ca sĩ, hợp xướng và dàn nhạc, thường diễn không dàn dựng, không phục trang."
  loai: dinh-nghia
- trang: nghe-nhac/handel-hallelujah
  id: n12
  cau: Messiah hát bằng tiếng Anh.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n13
  cau: Messiah là tác phẩm làm tên tuổi Handel được biết khắp thế giới, và là oratorio phổ biến nhất.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n14
  cau: Mùa hè năm 1741, Handel đang nợ nần và tưởng sự nghiệp đã hết.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n15
  cau: Lời do Charles Jennens chọn từ Kinh Thánh, kể về Đấng Cứu Thế.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n16
  cau: "Ba phần: lời tiên tri và giáng sinh (Phần I); chịu nạn, phục sinh, thăng thiên và lời rao giảng lan ra (Phần II); sự sống lại của người chết và chiến thắng cái chết (Phần III)."
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n17
  cau: Theo ngày Handel ghi trên bản viết tay, ông viết phần lớn bản nhạc trong khoảng 24 ngày (22/8–14/9/1741).
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n18
  cau: Buổi công diễn đầu là một buổi hòa nhạc từ thiện.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n19
  cau: '"Hallelujah" là hợp xướng kết thúc Phần II: khúc khải hoàn sau khi câu chuyện đã đi qua đau khổ đến chiến thắng.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n20
  cau: Cả bài chỉ dùng ba câu ngắn trong sách Khải Huyền.
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n21
  cau: Handel viết ở giọng Rê trưởng cùng trumpet và timpani, bộ đôi thời ấy hay dùng cho dịp lễ hội.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n22
  cau: Ở Anh, khán giả đôi khi vẫn đứng dậy khi hợp xướng này vang lên; chuyện thường được kể là ở một buổi diễn tại London năm 1743, cả khán phòng, dẫn đầu là vua George II, đã đứng dậy khi hợp xướng bắt đầu và đứng tới hết.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n23
  cau: 'Sơ đồ, Mở đầu: dàn nhạc dạo ba ô, rồi cả hợp xướng hô "Hallelujah!"; bốn bè cùng nhịp (chủ điệu), môtip ngắn.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n24
  cau: 'Sơ đồ, Đoạn 1: "for the Lord God omnipotent reigneth": các bè hát đồng âm (cùng giai điệu, cách nhau quãng tám) trước, rồi lần lượt vào đuổi nhau, xen kẽ tiếng hô Hallelujah.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n25
  cau: 'Sơ đồ, Đoạn 2: "The kingdom of this world is become…": bốn bè cùng nhịp, nốt dài, như thánh ca.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n26
  cau: 'Sơ đồ, Đoạn 3: "and He shall reign for ever and ever": fugue, chủ đề mở bằng một bước nhảy quãng lớn, các bè vào lần lượt: bass, tenor, alto, soprano.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n27
  cau: 'Sơ đồ, Cao trào: "King of kings, and Lord of Lords": soprano (lúc đầu cùng alto) giữ một nốt dài, rồi mỗi lần lên cao hơn một bậc, trumpet giữ cùng nốt; các bè khác đáp "for ever and ever, Hallelujah".'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n28
  cau: 'Sơ đồ, Kết: cả hợp xướng và dàn nhạc im lặng hai phách, rồi tiếng "Hallelujah" cuối bằng nốt dài.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n29
  cau: 'Theo dõi (6 dòng): sau ba ô dạo, hợp xướng hô "Hallelujah!" cùng lúc; "for the Lord God…" các bè hát cùng một giai điệu rồi đuổi nhau; "The kingdom…" nhạc chùng xuống, bốn bè cùng nhịp bằng nốt dài; "and He shall reign…" bass vào trước, rồi tenor, alto, soprano; "King of kings…" soprano cùng trumpet giữ nốt dài lên từng bậc, các bè khác đáp; im lặng hai phách rồi "Hallelujah" cuối bằng nốt dài.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n35
  cau: "Mục Nguồn: Mutopia (Händel-Gesellschaft, Chrysander 1902), IMSLP, Thư viện Anh R.M.20.f.2, Concise Oxford Dictionary of Music (Messiah, Hallelujah Chorus, oratorio, Handel)."
  loai: ten
- trang: nghe-nhac/handel-hallelujah
  id: n31
  cau: 'Câu hỏi nghe chủ động (ba câu): phân biệt đoạn cùng nhịp và đoạn fugue; đếm số lần "Hallelujah"; điều gì khiến người ta muốn đứng lên.'
  loai: khuyen-tap
- trang: nghe-nhac/haydn-94
  id: n1
  cau: "Bảng: Joseph Haydn (1732–1809)."
  loai: nam
- trang: nghe-nhac/haydn-94
  id: n2
  cau: "Bảng: Tên đầy đủ: Giao hưởng số 94 cung Sol trưởng, Hob. I:94."
  loai: danh-muc
- trang: nghe-nhac/haydn-94
  id: n3
  cau: "Bảng: Sáng tác năm 1791, công diễn lần đầu tại London ngày 23/3/1792."
  loai: nam
- trang: nghe-nhac/haydn-94
  id: n4
  cau: "Bảng: Thời kỳ Cổ điển."
  loai: lich-su
- trang: nghe-nhac/haydn-94
  id: n5
  cau: "Bảng: Chương 2 là Andante, Đô trưởng, dài khoảng 6 phút."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n6
  cau: Haydn viết bản giao hưởng này cho loạt hòa nhạc của Johann Peter Salomon ở London.
  loai: lich-su
- trang: nghe-nhac/haydn-94
  id: n7
  cau: Chương 2 nổi tiếng nhờ một hợp âm rất to bất ngờ của cả dàn nhạc (ô 16) chen vào giữa một giai điệu rất nhỏ nhẹ.
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n8
  cau: Từ hợp âm ấy bản giao hưởng có biệt danh Surprise (Bất ngờ).
  loai: ten
- trang: nghe-nhac/haydn-94
  id: n9
  cau: "Có chuyện kể Haydn muốn đánh thức khán giả ngủ gật, nhưng chính ông đã bác: theo người viết tiểu sử Griesinger, Haydn nói ông chỉ muốn làm công chúng bất ngờ bằng một điều mới."
  loai: lich-su
- trang: nghe-nhac/haydn-94
  id: n10
  cau: "Chương nhạc viết theo hình thức chủ đề và biến tấu: một giai điệu đơn giản được nhắc lại nhiều lần, mỗi lần biến đổi theo một cách khác."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n11
  cau: "Theo dõi, dòng 1: chủ đề, chỉ đàn dây, chơi nhỏ, giai điệu đơn giản bằng nốt móc đơn."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n12
  cau: "Theo dõi, dòng 2: chủ đề nhắc lại nhỏ hơn nữa, rồi hợp âm fortissimo cùng tiếng timpani."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n13
  cau: "Theo dõi, dòng 3: nửa sau của chủ đề."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n14
  cau: "Theo dõi, dòng 4: biến tấu 1, giai điệu giữ nguyên ở violin 2 và viola, violin 1 thêm bè trang trí bên trên."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n15
  cau: "Theo dõi, dòng 5: biến tấu 2 chuyển sang Đô thứ, mở đầu rất to (ff)."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n16
  cau: "Theo dõi, dòng 6: biến tấu 3 về Đô trưởng, oboe chơi chủ đề bằng chuỗi nốt móc kép nhắc lại, kèn gỗ nổi bật."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n17
  cau: "Theo dõi, dòng 7: biến tấu 4, cả dàn nhạc chơi rất to (ff), violin chạy nốt nhanh."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n18
  cau: "Theo dõi, dòng 8: coda nhỏ dần (sempre dim.), kết thúc rất nhỏ."
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n23
  cau: "Mục Nguồn: tổng phổ Cranz trên Internet Archive, IMSLP, lời tựa Henle HN 9062."
  loai: ten
- trang: nghe-nhac/haydn-94
  id: n19
  cau: "Câu hỏi nghe chủ động (ba câu): giật mình ở hợp âm bất ngờ; thành phần nào của chủ đề giữ lại trong mỗi biến tấu; biến tấu ở giọng thứ tạo cảm giác khác thế nào."
  loai: khuyen-tap
- trang: nghe-nhac/mozart-40
  id: n1
  cau: "Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791)."
  loai: nam
- trang: nghe-nhac/mozart-40
  id: n2
  cau: "Bảng: Tên đầy đủ Giao hưởng số 40 cung Sol thứ, K. 550."
  loai: danh-muc
- trang: nghe-nhac/mozart-40
  id: n3
  cau: "Bảng: Sáng tác mùa hè năm 1788 (hoàn thành ngày 25/7/1788), cùng với hai bản giao hưởng cuối cùng (số 39 và 41)."
  loai: nam
- trang: nghe-nhac/mozart-40
  id: n4
  cau: "Bảng: Thời kỳ Cổ điển."
  loai: lich-su
- trang: nghe-nhac/mozart-40
  id: n5
  cau: "Bảng: Chương 1 có chỉ dẫn tốc độ Molto allegro."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n6
  cau: "Bảng: Chương 1 dài khoảng 8 phút nếu nhắc lại phần trình bày."
  loai: so-lieu
- trang: nghe-nhac/mozart-40
  id: n7
  cau: Mozart chỉ viết hai bản giao hưởng ở giọng thứ, cả hai đều ở Sol thứ (số 25 và số 40). (Cũng là câu đầu của mô tả trang.)
  loai: lich-su
- trang: nghe-nhac/mozart-40
  id: n8
  cau: "Bản số 40 có hai phiên bản: bản đầu không có clarinet, bản sửa sau có thêm clarinet."
  loai: lich-su
- trang: nghe-nhac/mozart-40
  id: n9
  cau: Chương 1 viết ở hình thức sonata.
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n12
  cau: 'Theo dõi, dòng 1 (trình bày): viola rì rầm đệm, rồi chủ đề 1 ở violin: những cặp nốt "thở dài" đi xuống, Sol thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n13
  cau: "Theo dõi, dòng 2: đoạn chuyển: cả dàn nhạc chơi mạnh (forte), chuyển giọng."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n14
  cau: "Theo dõi, dòng 3: chủ đề 2 ở Si♭ trưởng (giọng trưởng song song): nhỏ tiếng, đi xuống từng nửa cung, chuyền qua lại giữa đàn dây và kèn gỗ."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n15
  cau: "Theo dõi, dòng 4: phần kết của trình bày; sau đó toàn bộ phần trình bày được nhắc lại."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n16
  cau: "Theo dõi, dòng 5 (phát triển): chuyển giọng đột ngột sang Fa♯ thứ, một giọng xa giọng chính; chủ đề 1 bị chia nhỏ, chuyền qua nhiều giọng."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n17
  cau: "Theo dõi, dòng 6 (tái hiện): chủ đề 1 trở lại ở Sol thứ."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n18
  cau: "Theo dõi, dòng 7: chủ đề 2 trở lại, lần này ở Sol thứ thay vì Si♭ trưởng."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n19
  cau: "Theo dõi, dòng 8 (coda): kết thúc ở Sol thứ."
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n21
  cau: "Câu hỏi 2: chủ đề 2 ở phần tái hiện (giọng thứ) khác gì lúc ở phần trình bày (giọng trưởng); đưa chủ đề 2 về giọng chính là việc của phần tái hiện trong hình thức sonata."
  loai: quy-tac
- trang: nghe-nhac/mozart-40
  id: n23
  cau: "Mục Nguồn: tổng phổ Neue Mozart-Ausgabe IV/11/9 trên Digital Mozart Edition; Köchel online KV 550; ghi chú chương trình của Indianapolis Symphony Orchestra; link tài liệu tham khảo."
  loai: ten
- trang: nghe-nhac/mozart-40
  id: n20
  cau: Câu hỏi nghe chủ động 1 và 3 (có nhận ra phần trình bày nhắc lại không; phần phát triển làm gì với chủ đề 1).
  loai: khuyen-tap
- trang: nghe-nhac/mozart-40
  id: n11
  cau: "Đây là chương để luyện nhận ra ba phần: trình bày, phát triển, tái hiện."
  loai: khuyen-tap
- trang: nghe-nhac/mozart-eine-kleine
  id: n1
  cau: "Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791)."
  loai: nam
- trang: nghe-nhac/mozart-eine-kleine
  id: n2
  cau: 'Bảng: Tên đầy đủ Serenade cung Sol trưởng, K. 525, Eine kleine Nachtmusik ("Một bản nhạc đêm nhỏ").'
  loai: danh-muc
- trang: nghe-nhac/mozart-eine-kleine
  id: n3
  cau: "Bảng: Mozart ghi tác phẩm vào danh mục tác phẩm của mình ngày 10 tháng 8, 1787 (Vienna)."
  loai: nam
- trang: nghe-nhac/mozart-eine-kleine
  id: n4
  cau: "Bảng: Thời kỳ Cổ điển."
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n5
  cau: "Bảng: Thể loại: viết cho 2 violin, viola, cello và contrabass; tên thể loại Serenade có từ bản in đầu, không do Mozart đặt."
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n6
  cau: "Bảng: Độ dài chương 1 khoảng 5–6 phút."
  loai: so-lieu
- trang: nghe-nhac/mozart-eine-kleine
  id: n7
  cau: "Danh mục Köchel online gọi K. 525 là một trong những tác phẩm nổi tiếng nhất của Mozart ngày nay, dù nó chỉ được in lần đầu nhiều năm sau khi ông mất. (Mô tả trang: một chương ở hình thức sonata, viết cho đàn dây năm 1787.)"
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n8
  cau: Tên Mozart đặt, Eine kleine Nachtmusik, chỉ loại nhạc để chơi vào buổi tối và ban đêm; nhạc như vậy thường viết nhân ngày lễ thánh bổn mạng của bạn bè hay theo đặt hàng.
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n9
  cau: Không ai biết Mozart viết K. 525 nhân dịp nào.
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n10
  cau: Mozart ghi K. 525 vào danh mục ngày 10/8/1787, cùng năm với vở opera Don Giovanni.
  loai: nam
- trang: nghe-nhac/mozart-eine-kleine
  id: n11
  cau: Trang này nói về chương 1 (Allegro), viết ở hình thức sonata.
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n13
  cau: "Trình bày: chủ đề 1 mở bằng cả bốn bè chơi đồng âm, đi lên theo các nốt của hợp âm Sol trưởng rồi đáp xuống."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n14
  cau: "Trình bày: chủ đề 2 ở giọng Rê trưởng (giọng át)."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n15
  cau: "Phát triển: ngắn (20 ô nhịp), mở bằng chủ đề 1 ở Rê trưởng, rồi các nốt giáng (Si♭, Mi♭) đưa nhạc sang màu giọng thứ trước khi về Sol trưởng."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n16
  cau: "Tái hiện: cả hai chủ đề trở về Sol trưởng."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n17
  cau: Tác phẩm vốn có 5 chương, nhưng chương 2 (một minuet có trio) đã thất lạc, nên bản ngày nay chỉ còn 4 chương.
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n19
  cau: "Theo dõi, dòng 1: chủ đề 1: cả dàn dây đồng loạt, chùm nốt đi lên như tên lửa."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n20
  cau: "Theo dõi, dòng 2: câu đối đáp: bè cao hát, bè thấp trả lời."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n21
  cau: "Theo dõi, dòng 3: đoạn chuyển: nhạc dồn dập, chuyển sang giọng mới."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n22
  cau: "Theo dõi, dòng 4: chủ đề 2: nhẹ nhàng, thanh thoát ở giọng Rê trưởng."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n23
  cau: "Theo dõi, dòng 5: phần kết của trình bày, khép lại nhỏ tiếng bằng những nốt ngắn; sau đó cả phần trình bày được nhắc lại."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n24
  cau: "Theo dõi, dòng 6: phát triển: ngắn, các nốt giáng đưa nhạc sang màu giọng thứ."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n25
  cau: "Theo dõi, dòng 7: tái hiện: chủ đề 1 trở lại ở Sol trưởng."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n26
  cau: "Theo dõi, dòng 8: chủ đề 2 trở lại, lần này cũng ở Sol trưởng — xung đột được giải quyết."
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n31
  cau: "Mục Nguồn: tổng phổ Neue Mozart-Ausgabe IV/12/6 trên Digital Mozart Edition; Köchel online KV 525; link tài liệu tham khảo."
  loai: ten
- trang: nghe-nhac/mozart-eine-kleine
  id: n28
  cau: Câu hỏi 2, 3 và lời dặn ghi thời điểm (phút:giây) cho từng sự kiện.
  loai: khuyen-tap
- trang: nghe-nhac/mozart-eine-kleine
  id: n27
  cau: "Câu hỏi 1: đếm xem chùm nốt đi lên mở đầu quay lại bao nhiêu lần trong chương."
  loai: khuyen-tap
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n1
  cau: "Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791)."
  loai: nam
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n2
  cau: "Bảng: Tác phẩm: opera Die Zauberflöte (Cây sáo thần), K. 620."
  loai: danh-muc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n3
  cau: "Bảng: Công diễn ở Vienna, ngày 30/9/1791."
  loai: nam
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n4
  cau: "Bảng: buổi công diễn hơn hai tháng trước khi Mozart mất."
  loai: nam
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n5
  cau: "Bảng: aria Der Hölle Rache kocht in meinem Herzen (Lửa thù địa ngục sôi sục trong tim ta), màn 2, số 14."
  loai: ten
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n6
  cau: "Bảng: giọng soprano màu sắc (coloratura)."
  loai: dinh-nghia
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n7
  cau: "Bảng: độ dài khoảng 3–4 phút."
  loai: so-lieu
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n8
  cau: "Bảng: bản thu gợi ý: Diana Damrau trong dàn dựng của David McVicar ở Royal Opera House, London, chỉ huy Colin Davis (thu năm 2003, DVD của Opus Arte)."
  loai: ten
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n9
  cau: "Cây sáo thần là một Singspiel: opera tiếng Đức có xen lời thoại nói, viết cho một nhà hát ở ngoại ô Vienna do Emanuel Schikaneder điều hành; Schikaneder cũng viết lời. (Mô tả trang cũng nói câu này.)"
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n10
  cau: "Câu chuyện cổ tích: theo lệnh của Nữ hoàng bóng đêm, hoàng tử Tamino và Papageno người bắt chim đi giải cứu Pamina, con gái bà."
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n11
  cau: Ngay trước aria, trong lời thoại, Nữ hoàng bóng đêm đưa cho Pamina một con dao và ra lệnh phải giết Sarastro, kẻ thù của bà.
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n12
  cau: Trong aria, bà thề sẽ từ bỏ con mãi mãi nếu Pamina không làm.
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n13
  cau: Cơn giận được thể hiện bằng những chuỗi nốt nhanh vọt lên âm vực cực cao, đến nốt Fa6.
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n14
  cau: "Theo dõi, dòng 1: dàn nhạc mở đầu chỉ hơn một ô nhịp rồi Nữ hoàng vào ngay, giọng Rê thứ."
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n15
  cau: "Theo dõi, dòng 2: Nữ hoàng hát những câu đầy kịch tính, giọng mạnh mẽ."
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n16
  cau: "Theo dõi, dòng 3: chuỗi coloratura thứ nhất: các nốt ngắt ngắn (staccato) nhắc lại, rồi những chùm nốt rải vọt lên Fa6."
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n17
  cau: "Theo dõi, dòng 4: đoạn lời đe dọa, rồi chuỗi coloratura thứ hai, dài hơn."
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n18
  cau: 'Theo dõi, dòng 5: đoạn kết: lời thề "Hört, Rachegötter, hört der Mutter Schwur!" (Hãy nghe, hỡi các thần báo thù, lời thề của người mẹ!), rồi dàn nhạc khép lại ở Rê thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n22
  cau: "Mục Nguồn: tổng phổ và lời thoại Neue Mozart-Ausgabe II/5/19 trên Digital Mozart Edition (aria số 14 trang 224–231); Köchel online KV 620; trang DVD của Royal Opera House; MusicBrainz (Opus Arte OA 0886 D, 2003); link tài liệu tham khảo."
  loai: ten
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n19
  cau: "Câu hỏi nghe chủ động (ba câu: trang trí hay cảm xúc; so sánh hai ca sĩ; xem video dàn dựng)."
  loai: khuyen-tap
- trang: nghe-nhac/mozart-requiem
  id: n1
  cau: "Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791)."
  loai: nam
- trang: nghe-nhac/mozart-requiem
  id: n2
  cau: "Bảng: Tên đầy đủ Requiem cung Rê thứ, K. 626."
  loai: danh-muc
- trang: nghe-nhac/mozart-requiem
  id: n3
  cau: "Bảng: Sáng tác năm 1791, dang dở khi Mozart mất ngày 5/12/1791."
  loai: nam
- trang: nghe-nhac/mozart-requiem
  id: n4
  cau: "Bảng: Hoàn thành chủ yếu bởi học trò Franz Xaver Süssmayr."
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n5
  cau: "Bảng: Thời kỳ Cổ điển."
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n6
  cau: "Bảng: Thể loại lễ cầu hồn cho hợp xướng, 4 giọng độc xướng và dàn nhạc."
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n7
  cau: 'Bảng: Độ dài khoảng 50–55 phút; phần trong bảng "Theo dõi khi nghe" (từ Introitus đến Lacrimosa) khoảng 30 phút.'
  loai: so-lieu
- trang: nghe-nhac/mozart-requiem
  id: n8
  cau: Mùa hè năm 1791, Mozart nhận đơn đặt hàng giấu tên viết một bản Requiem. (Cũng là câu đầu của mô tả trang.)
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n9
  cau: Người đặt về sau được biết là bá tước Franz von Walsegg, muốn tưởng nhớ người vợ vừa mất (và có lẽ định nhận là tác phẩm của mình).
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n10
  cau: Mozart viết Requiem xen với Cây sáo thần và vở opera La clemenza di Tito; ông nằm liệt giường từ ngày 20/11/1791 và mất khi bản nhạc còn dang dở.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n11
  cau: Quanh sự ra đời của Requiem có nhiều giai thoại và truyền thuyết.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n12
  cau: Mozart hoàn thành trọn vẹn Introitus.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n13
  cau: Mozart viết các bè hát, bè trầm và nhiều gợi ý dàn nhạc từ Kyrie đến Hostias.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n14
  cau: Mozart chỉ viết 8 ô nhịp đầu của Lacrimosa.
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n15
  cau: Mozart để lại nhiều nợ; vợ ông, Constanze, nhờ bạn bè của Mozart hoàn thành bản nhạc, và sau hai lần không thành, việc đến tay học trò Süssmayr.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n16
  cau: Ngày nay có nhiều phiên bản hoàn thành khác nhau; phiên bản Süssmayr là phiên bản truyền thống, được biết đến nhiều nhất.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n17
  cau: Requiem (lễ cầu hồn) là thánh lễ Công giáo cho người đã mất, hát bằng tiếng Latin.
  loai: dinh-nghia
- trang: nghe-nhac/mozart-requiem
  id: n18
  cau: Đoạn Dies irae ("Ngày thịnh nộ") mô tả ngày phán xét cuối cùng.
  loai: dinh-nghia
- trang: nghe-nhac/mozart-requiem
  id: n19
  cau: "Theo dõi, Introitus: bassoon và basset horn (họ hàng trầm của clarinet) mở đầu u buồn; hợp xướng vào từng bè một."
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n20
  cau: "Theo dõi, Kyrie: fugue kép, hai chủ đề cùng lúc, một chủ đề nhảy quãng 7 giảm."
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n22
  cau: "Theo dõi, Dies irae: cả dàn nhạc và hợp xướng bùng nổ, nhanh, dữ dội."
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n23
  cau: "Theo dõi, Recordare (dòng thêm): hai basset horn mở đầu nhẹ, nhịp 3/4, giọng Fa trưởng; bốn giọng độc xướng hát, không có hợp xướng."
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n24
  cau: 'Theo dõi, Tuba mirum: trombone độc tấu mở đầu ("tiếng kèn kỳ diệu" gọi người chết dậy), rồi lần lượt bốn giọng độc xướng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n25
  cau: 'Theo dõi, Rex tremendae: hợp xướng hô "Rex!" (Vua!) bằng những hợp âm lớn, tiết tấu chấm dôi uy nghi.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n26
  cau: "Theo dõi, Confutatis: tương phản: bè nam hát dữ dội về kẻ bị đày, bè nữ hát dịu dàng xin được cứu."
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n27
  cau: 'Theo dõi, Lacrimosa: giai điệu "khóc than" đi lên từng bước; sau 8 ô nhịp, phần còn lại không phải của Mozart.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n29
  cau: "Câu hỏi 1: ở thời Baroque, trombone chỉ được dùng trong nhạc nhà thờ."
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n31
  cau: Câu hỏi 3 bỏ vế "(Câu trả lời thật thà của phần lớn người nghe là không. Đó cũng là điều đáng suy nghĩ.)".
  loai: so-lieu
- trang: nghe-nhac/mozart-requiem
  id: n33
  cau: "Mục Nguồn: tổng phổ và lời tựa Neue Mozart-Ausgabe I/1/Abt. 2/1 (Leopold Nowak, 1965) trên Digital Mozart Edition; Köchel online KV 626; bảng so sánh các phiên bản của Carus (Ulrich Leisinger, PDF); link Cổ điển."
  loai: ten
- trang: nghe-nhac/mozart-requiem
  id: n30
  cau: Câu hỏi nghe chủ động (cảm giác của tiếng trombone; đối lập bè nam, bè nữ ở Confutatis; có nghe ra chỗ đổi người viết ở Lacrimosa không).
  loai: khuyen-tap
