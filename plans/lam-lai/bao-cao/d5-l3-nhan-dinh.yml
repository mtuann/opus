  id: n47
  cau: "Quiz 1: môtip 4 nốt ngắn được lặp, chia nhỏ và nhấn sforzando liên tục; đáp án Beethoven."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n48
  cau: "Quiz 2: hợp âm trượt song song, gam toàn cung, hòa âm nhiều khi mơ hồ về giọng; đáp án Debussy. Giải thích: hợp âm trượt song song và gam toàn cung là dấu vân tay của Debussy."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n49
  cau: "Quiz 3: chủ yếu viết cho piano, hay dùng rubato, mazurka, polonaise và nocturne; đáp án Chopin."
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n50
  cau: 'Quiz 4: âm nhạc liền mạch như "giai điệu bất tận", hòa âm nửa cung dày đặc, leitmotif; đáp án Wagner.'
  loai: cau-truc
- trang: nhan-dien/dau-van-tay
  id: n51
  cau: "Mục Nguồn: Clark, Kuznetsova, Jones (giáo trình mở LibreTexts), COD, Britannica, Open Music Theory, Hutchinson, Mutopia."
  loai: danh-muc
- trang: nhan-dien/dau-van-tay
  id: n2
  cau: "Đây là xu hướng, không phải quy luật: mọi nhà soạn nhạc giỏi đều có lúc làm khác thói quen của mình."
  loai: khuyen-tap
- trang: nhan-dien/dau-van-tay
  id: n1
  cau: Mỗi nhà soạn nhạc lớn có những thói quen riêng, như nét chữ; trang liệt kê dấu hiệu dễ nghe nhất, kèm một tác phẩm để kiểm chứng.
  loai: khuyen-tap
- trang: nhan-dien/luyen-nghe
  id: n2
  cau: Tất cả phát bằng âm thanh tổng hợp trong trình duyệt.
  loai: cau-truc
- trang: nhan-dien/luyen-nghe
  id: n3
  cau: Mỗi câu đều có đáp án và giải thích.
  loai: cau-truc
- trang: nhan-dien/luyen-nghe
  id: n5
  cau: Mười đoạn nhạc ngắn, mỗi đoạn viết theo đặc trưng của một thời kỳ (Baroque, Cổ điển, Lãng mạn, Ấn tượng, Thế kỷ 20).
  loai: danh-muc
- trang: nhan-dien/luyen-nghe
  id: n10
  cau: Cùng một giai điệu được phát theo bốn kết cấu khác nhau (xem bài 28).
  loai: cau-truc
- trang: nhan-dien/luyen-nghe
  id: n11
  cau: Giai điệu đó là Frère Jacques.
  loai: ten
- trang: nhan-dien/luyen-nghe
  id: n12
  cau: Tốc độ và giọng thay đổi ngẫu nhiên.
  loai: cau-truc
- trang: nhan-dien/luyen-nghe
  id: n14
  cau: Chỉ một giai điệu → đơn âm.
  loai: dinh-nghia
- trang: nhan-dien/luyen-nghe
  id: n15
  cau: Giai điệu + hợp âm bên dưới → chủ điệu.
  loai: dinh-nghia
- trang: nhan-dien/luyen-nghe
  id: n16
  cau: Giai điệu thứ hai vào sau, bắt chước giai điệu đầu → phức điệu.
  loai: dinh-nghia
- trang: nhan-dien/luyen-nghe
  id: n17
  cau: Hai bản cùng giai điệu, một bản có thêm nốt luyến láy, vang cùng lúc → dị âm.
  loai: dinh-nghia
- trang: nhan-dien/luyen-nghe
  id: n20
  cau: "Tên bốn nút kết cấu: Đơn âm, Chủ điệu, Phức điệu, Dị âm."
  loai: ten
- trang: nhan-dien/luyen-nghe
  id: n21
  cau: 'Mười đoạn nhạc: thời kỳ, mã ABC và dòng "Dấu hiệu" trong VI_DU.'
  loai: cau-truc
- trang: nhan-dien/luyen-nghe
  id: n7
  cau: "Gợi ý: nghe nhạc cụ trước (harpsichord? piano? dàn dây? marimba?)."
  loai: khuyen-tap
- trang: nhan-dien/luyen-nghe
  id: n8
  cau: "Gợi ý: rồi bè trầm (đi liên tục? hình đệm lặp lại? đứng yên?), rồi hòa âm (đơn giản? nhiều nửa cung? mơ hồ?)."
  loai: khuyen-tap
- trang: nhan-dien/so-sanh-thoi-ky
  id: n3
  cau: "Hình thời kỳ: Trung cổ ~500–1400; Phục hưng ~1400–1600; Baroque ~1600–1750; Cổ điển ~1750–1820; Lãng mạn ~1820–1900; Thế kỷ 20 ~1900–2000; Đương đại 2000–nay."
  loai: nam
- trang: nhan-dien/so-sanh-thoi-ky
  id: n4
  cau: "Hình xếp nhà soạn nhạc: Hildegard, Machaut (Trung cổ); Josquin, Palestrina (Phục hưng); Vivaldi, Bach, Handel (Baroque); Haydn, Mozart, Beethoven (Cổ điển); Chopin, Brahms, Tchaikovsky (Lãng mạn); Debussy, Stravinsky (Thế kỷ 20); Pärt, Adams, Shaw (Đương đại)."
  loai: danh-muc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n5
  cau: Baroque (~1600–1750)
  loai: nam
- trang: nhan-dien/so-sanh-thoi-ky
  id: n6
  cau: Cổ điển (~1750–1820)
  loai: nam
- trang: nhan-dien/so-sanh-thoi-ky
  id: n7
  cau: Lãng mạn (~1820–1900)
  loai: nam
- trang: nhan-dien/so-sanh-thoi-ky
  id: n8
  cau: Ấn tượng (~1890–1920)
  loai: nam
- trang: nhan-dien/so-sanh-thoi-ky
  id: n9
  cau: Thế kỷ 20 (~1900–2000)
  loai: nam
- trang: nhan-dien/so-sanh-thoi-ky
  id: n10
  cau: "Biên chế Baroque: dàn dây nhỏ; harpsichord hoặc organ; kèn trumpet."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n11
  cau: "Biên chế Cổ điển: piano; dàn nhạc cỡ vừa, biên chế điển hình; tứ tấu đàn dây."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n12
  cau: "Biên chế Lãng mạn: dàn nhạc rất lớn, kèn đồng mạnh, nhiều bộ gõ; piano hiện đại."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n13
  cau: "Biên chế Ấn tượng: chú trọng âm sắc của từng nhạc cụ."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n14
  cau: "Biên chế thế kỷ 20: rất đa dạng, từ dàn nhạc lớn với nhiều nhạc cụ gõ đến nhạc cụ điện tử."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n15
  cau: "Kết cấu Baroque: nhiều phức điệu; bè trầm liên tục."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n16
  cau: "Kết cấu Cổ điển: chủ điệu, giai điệu rõ trên phần đệm."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n17
  cau: "Kết cấu Lãng mạn: chủ điệu, nhưng dày, nhiều lớp."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n18
  cau: "Kết cấu Ấn tượng: các lớp âm thanh như sương mù."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n19
  cau: "Kết cấu thế kỷ 20: rất đa dạng."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n20
  cau: "Giai điệu Baroque: nhiều trang trí, nhiều chuỗi."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n21
  cau: "Giai điệu Cổ điển: ngắn, cân đối, phân câu rõ, dễ hát."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n22
  cau: "Giai điệu Lãng mạn: dài, hát, bước nhảy rộng, cảm xúc mạnh."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n23
  cau: "Giai điệu Ấn tượng: không hướng tới một đích rõ ràng; hay dùng gam ngũ cung và toàn cung."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n24
  cau: "Giai điệu thế kỷ 20: có khi gãy gọn, góc cạnh; có khi gần như không có."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n25
  cau: "Hòa âm Baroque: giọng trưởng – thứ và các chuỗi hợp âm được dùng ngày càng nhiều."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n26
  cau: "Hòa âm Cổ điển: rõ ràng, cấu trúc giọng dễ nghe, kết rõ."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n27
  cau: "Hòa âm Lãng mạn: nhiều nửa cung, nốt nghịch được giữ rồi mới giải, chuyển giọng qua nhiều giọng."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n28
  cau: "Hòa âm Ấn tượng: hợp âm trượt song song, hợp âm 9, 11, 13; nhiều khi mơ hồ về giọng."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n29
  cau: "Hòa âm thế kỷ 20: nghịch tai tự do; vô điệu tính; đa điệu tính; hoặc tĩnh tại (tối giản)."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n30
  cau: "Tiết tấu Baroque: nhịp rõ và đều, phách được chia nhỏ liên tục."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n31
  cau: "Tiết tấu Cổ điển: rõ ràng, có tương phản giữa các phần."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n32
  cau: "Tiết tấu Lãng mạn: linh hoạt, rubato."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n33
  cau: "Tiết tấu Ấn tượng: trôi nổi, khó cảm thấy phách."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n34
  cau: "Tiết tấu thế kỷ 20: thử nghiệm nhịp và trọng âm (trọng âm bất thường); hoặc lặp lại đều đặn (tối giản)."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n35
  cau: "Sắc thái Baroque: to – nhỏ theo từng khối (đột ngột)."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n36
  cau: "Sắc thái Cổ điển: crescendo, diminuendo, sforzando; tương phản trong tác phẩm."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n37
  cau: "Sắc thái Lãng mạn: dải âm lượng rộng hơn trước, crescendo và decrescendo phổ biến hơn."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n38
  cau: "Sắc thái Ấn tượng: phần lớn rất nhỏ, tinh tế."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n39
  cau: "Sắc thái thế kỷ 20: cực đoan theo cả hai chiều."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n40
  cau: "Hình thức Baroque: fugue, ritornello, tổ khúc; một tâm trạng mỗi chương."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n41
  cau: "Hình thức Cổ điển: sonata, rondo, minuet; hai chủ đề tương phản."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n42
  cau: "Hình thức Lãng mạn: tự do; tiểu phẩm ngắn hoặc tác phẩm rất dài; âm nhạc chương trình."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n43
  cau: "Hình thức Ấn tượng: tránh các hình thức truyền thống; ưa hình thức ngắn (prelude, nocturne, arabesque)."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n44
  cau: "Hình thức thế kỷ 20: nhiều nhà soạn nhạc bỏ cấu trúc truyền thống của các thể loại."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n45
  cau: 'baroque-1: dấu hiệu "Harpsichord".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n46
  cau: 'baroque-1: dấu hiệu "Chuyển động móc đơn liên tục, nhịp đều".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n47
  cau: 'baroque-1: dấu hiệu "Chuỗi đi xuống: cùng một hình nốt lặp lại thấp dần (xem bài 29)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n48
  cau: 'baroque-1: dấu hiệu "Bè trầm nhảy quãng 8, đi đều từng phách".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n49
  cau: 'baroque-1: dấu hiệu "Láy rền (trill) ở kết".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n50
  cau: 'baroque-2: dấu hiệu "Harpsichord".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n51
  cau: 'baroque-2: dấu hiệu "Mở đầu bằng một giai điệu đơn độc, rồi bè thứ hai vào bằng chính giai điệu đó: phức điệu mô phỏng, kiểu fugue".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n52
  cau: 'baroque-2: dấu hiệu "Giọng thứ với cảm âm Đô♯".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n53
  cau: 'baroque-2: dấu hiệu "Hai bè độc lập, quan trọng ngang nhau".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n54
  cau: 'classical-1: dấu hiệu "Piano".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n55
  cau: 'classical-1: dấu hiệu "Tay trái đệm kiểu Alberti (thấp – cao – giữa – cao)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n56
  cau: 'classical-1: dấu hiệu "Câu nhạc 4 + 4 ô nhịp: câu hỏi dừng ở kết nửa, câu trả lời kết trọn".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n57
  cau: 'classical-1: dấu hiệu "Chủ điệu rõ ràng, giai điệu đơn giản, hòa âm chủ yếu I – IV – V".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n58
  cau: 'classical-2: dấu hiệu "Nhịp 3/4 kiểu minuet, đệm \"bùm – chát – chát\"".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n59
  cau: 'classical-2: dấu hiệu "Hai câu 4 ô nhịp cân đối, kết nửa rồi kết trọn".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n60
  cau: 'classical-2: dấu hiệu "Hòa âm đơn giản, trong sáng, gần như chỉ có I và V".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n61
  cau: 'romantic-1: dấu hiệu "Tay trái rải hợp âm trải rộng hơn một quãng 8".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n62
  cau: 'romantic-1: dấu hiệu "Hợp âm bảy giảm ở ô nhịp 2 (nửa cung, căng thẳng)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n63
  cau: 'romantic-1: dấu hiệu "Hợp âm mượn Fa thứ sau Fa trưởng ở ô nhịp 6 (xem bài 23)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n64
  cau: 'romantic-1: dấu hiệu "Giai điệu có bước nhảy rộng, giàu cảm xúc; chậm dần (rit.) trước kết".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n65
  cau: 'romantic-2: dấu hiệu "Dàn dây, âm thanh dày và ấm".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n66
  cau: 'romantic-2: dấu hiệu "Các hợp âm trưởng cách nhau quãng 3 (Đô – La♭ – Mi – Đô): liên hệ quãng 3 nửa cung (hợp âm chung một nốt)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n67
  cau: 'romantic-2: dấu hiệu "Ba bè trên chỉ dịch tối đa nửa cung (bè trầm nhảy quãng 3), nhưng màu sắc đổi hẳn".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n68
  cau: 'romantic-2: dấu hiệu "To dần rồi bùng lên".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n69
  cau: 'impressionist-1: dấu hiệu "Rất nhỏ (pp)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n70
  cau: 'impressionist-1: dấu hiệu "Các hợp âm bảy chuyển động song song, mọi bè cùng đi một hướng (planing), không theo quy tắc dẫn bè".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n71
  cau: 'impressionist-1: dấu hiệu "Một nốt trầm giữ suốt (âm nền)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n72
  cau: 'impressionist-1: dấu hiệu "Không có kết, không có cảm giác \"về nhà\"".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n73
  cau: 'impressionist-2: dấu hiệu "Giai điệu đi xuống theo gam toàn cung (xem bài 32)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n74
  cau: 'impressionist-2: dấu hiệu "Hợp âm tăng ngân suốt bên dưới".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n75
  cau: 'impressionist-2: dấu hiệu "Mơ hồ, không có chủ âm rõ ràng".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n76
  cau: 'modern-1: dấu hiệu "Marimba".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n77
  cau: 'modern-1: dấu hiệu "Một mẫu ngắn lặp đi lặp lại (ostinato)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n78
  cau: 'modern-1: dấu hiệu "Mẫu thay đổi rất chậm, từng nốt một (quá trình cộng dồn)".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n79
  cau: 'modern-1: dấu hiệu "Hòa âm gần như đứng yên: chủ nghĩa tối giản".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n80
  cau: 'modern-2: dấu hiệu "Dàn dây dậm một hợp âm nghịch tai lặp đi lặp lại".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n81
  cau: 'modern-2: dấu hiệu "Hai hợp âm chồng lên nhau (hợp âm ghép): Mi♭7 trên Fa♭ trưởng, như hợp âm trong Le Sacre du printemps".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n82
  cau: 'modern-2: dấu hiệu "Trọng âm thay đổi từ ô này sang ô khác, không theo một mẫu đều".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n83
  cau: "Baroque và Cổ điển: nghe bè trầm (Baroque có bè trầm chơi suốt tác phẩm, Cổ điển thường lặp một hình đệm như đệm Alberti); nhạc cụ phím (harpsichord gợi Baroque, piano gợi Cổ điển); câu nhạc (Cổ điển có chỗ ngắt hơi rõ, thường sau 4 hay 8 ô nhịp)."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n84
  cau: 'Cổ điển muộn (Beethoven) và Lãng mạn sớm: ranh giới thật sự mờ, đừng ngại trả lời "giao thời".'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n85
  cau: Beethoven vẫn giữ hình thức rõ ràng và phát triển môtip chặt chẽ; Schubert, Chopin hát dài hơn, hòa âm nhiều màu hơn.
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n86
  cau: 'Ấn tượng: không có "đường đi" rõ, hợp âm trượt song song, không khí hơn là cảm xúc.'
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n87
  cau: "Lãng mạn muộn: giai điệu dài rõ ràng, cao trào lớn, căng – giải quyết."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n88
  cau: Debussy thời trẻ ở giữa hai bên (Lãng mạn muộn và Ấn tượng).
  loai: lich-su
- trang: nhan-dien/so-sanh-thoi-ky
  id: n89
  cau: Tân cổ điển (Prokofiev Giao hưởng số 1, Stravinsky Pulcinella) gợi lại sự gọn gàng, cân đối của nhạc thế kỷ 18, như Haydn, nhưng hòa âm và nhịp điệu mang màu sắc thế kỷ 20.
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n90
  cau: "Tối giản và Baroque: cả hai đều lặp lại và đều đặn; nhưng Baroque đi đâu đó (chuỗi, chuyển giọng, kết), tối giản đứng yên, thay đổi rất chậm, không có kết theo kiểu truyền thống."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n91
  cau: Nhạc phim Hollywood thời đầu thừa hưởng ngôn ngữ của nhạc Lãng mạn thế kỷ 19, như cách Max Steiner dùng leitmotif theo Wagner.
  loai: lich-su
- trang: nhan-dien/so-sanh-thoi-ky
  id: n93
  cau: "Trung cổ và Phục hưng: chủ yếu là giọng hát, phần lớn không có nhạc cụ đệm, và không có nhịp mạnh rõ ràng."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n94
  cau: "Trung cổ: thánh ca một dòng giai điệu, nhịp tự do như lời nói; về sau thêm các bè song song (organum)."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n95
  cau: "Phục hưng: nhiều bè đan nhau theo lối mô phỏng, nhịp êm, nhiều quãng ba và hợp âm ba."
  loai: cau-truc
- trang: nhan-dien/so-sanh-thoi-ky
  id: n99
  cau: Mục Nguồn cuối trang.
  loai: lich-su
- trang: nhan-dien/so-sanh-thoi-ky
  id: n92
  cau: Nếu bạn nghe "như nhạc phim", rất có thể đó là Lãng mạn muộn.
  loai: khuyen-tap
- trang: nhan-dien/the-loai
  id: n1
  cau: "Nhạc thính phòng: nhóm nhỏ, mỗi bè một người."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n2
  cau: Cây quyết định, nhánh mô tả "Vài người, mỗi bè một người" dẫn tới nhạc thính phòng.
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n3
  cau: "Có giọng hát, có dàn dựng sân khấu, nhân vật, đối thoại: opera."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n4
  cau: "Lời tôn giáo, không dựng sân khấu: Thánh lễ, Requiem, cantata, oratorio."
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n5
  cau: "Một giọng hát với piano: ca khúc nghệ thuật (Lied)."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n6
  cau: Hợp xướng, cantata thế tục (ví dụ Bach, BWV 211).
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n7
  cau: "Một người chơi: sonata độc tấu, tiểu phẩm (nocturne, étude, prélude…)."
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n8
  cau: Nhạc thính phòng gồm sonata cho nhạc cụ và piano, tam tấu, tứ tấu.
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n9
  cau: "Nhánh dàn nhạc: có nhạc cụ nổi bật đối đáp với dàn nhạc là concerto."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n10
  cau: "Dàn nhạc không có nhạc cụ nổi bật: giao hưởng, thơ giao hưởng, overture, tổ khúc ballet."
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n11
  cau: "Một nhạc cụ khác và piano: sonata cho violin (cello, sáo…) và piano, hai nhạc cụ ngang hàng."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n12
  cau: Tổ khúc cello của Bach (BWV 1007–1012) và sonata, partita violin độc tấu (BWV 1001–1006) là nhạc cho một nhạc cụ không đệm.
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n13
  cau: Debussy, Syrinx (flute độc tấu) là tác phẩm thế kỷ 20 cho một nhạc cụ không đệm.
  loai: nam
- trang: nhan-dien/the-loai
  id: n14
  cau: Tứ tấu đàn dây gồm 2 violin, viola, cello; là thể loại thính phòng quan trọng nhất.
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n15
  cau: Tam tấu piano gồm piano, violin, cello.
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n16
  cau: Ngũ tấu piano gồm piano và 4 đàn dây; Schubert, Con cá hồi (D. 667) dùng violin, viola, cello, contrabass và piano.
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n17
  cau: "Concerto Baroque, concerto grosso: dàn dây, harpsichord (continuo), vài nhạc cụ độc tấu."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n18
  cau: "Concerto có cadenza: đoạn độc tấu khi dàn nhạc dừng."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n19
  cau: "Giao hưởng: dàn nhạc, thường 4 chương; chương 1 thường ở hình thức sonata."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n20
  cau: "Thơ giao hưởng: dàn nhạc, một chương, có tiêu đề kể chuyện."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n21
  cau: "Tổ khúc ballet: dàn nhạc, nhiều đoạn nhịp nhảy múa; ví dụ Ravel, Daphnis et Chloé (hai tổ khúc)."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n22
  cau: "Hợp xướng, dàn nhạc, giọng độc xướng, lời Latin: Thánh lễ, Requiem; ví dụ Mozart Requiem K. 626."
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n23
  cau: "Một giọng hát với piano, lời tiếng Đức: Lied; ví dụ Schubert, Erlkönig."
  loai: danh-muc
- trang: nhan-dien/the-loai
  id: n24
  cau: "Giọng hát độc xướng và dàn nhạc, nội dung như một cảnh kịch: aria trong opera."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n25
  cau: Harpsichord và sáo dọc (recorder) thường là Baroque; sáo dọc cũng có trong nhạc Phục hưng; bản thu hiện đại có thể là tái hiện.
  loai: lich-su
- trang: nhan-dien/the-loai
  id: n26
  cau: Clarinet vào dàn nhạc giao hưởng muộn hơn các kèn gỗ khác, trong thế kỷ 18.
  loai: lich-su
- trang: nhan-dien/the-loai
  id: n27
  cau: Tuba (bản đầu được cấp bằng năm 1835) là dấu hiệu của thế kỷ 19 trở đi.
  loai: nam
- trang: nhan-dien/the-loai
  id: n28
  cau: Cor anglais ít dùng trước thế kỷ 19.
  loai: lich-su
- trang: nhan-dien/the-loai
  id: n29
  cau: "Saxophone trong dàn nhạc: từ giữa thế kỷ 19 trở đi; Adolphe Sax chế tạo khoảng 1840–45, cấp bằng 1846; Boléro có saxophone."
  loai: nam
- trang: nhan-dien/the-loai
  id: n30
  cau: "Bộ gõ đa dạng, có marimba hay vibraphone: thường là thế kỷ 20 (Grainger dùng marimba trước 1916; Berg, Britten, Messiaen dùng vibraphone)."
  loai: lich-su
- trang: nhan-dien/the-loai
  id: n31
  cau: "Dàn nhạc rất lớn (bộ đồng đông, bộ gỗ gấp ba hay gấp bốn): cuối thế kỷ 19 hoặc thế kỷ 20."
  loai: lich-su
- trang: nhan-dien/the-loai
  id: n32
  cau: "Quiz: đoạn piano chơi một mình khi dàn nhạc dừng là cadenza."
  loai: dinh-nghia
- trang: nhan-dien/the-loai
  id: n33
  cau: "Quiz: harpsichord là một trong những nhạc cụ phím quan trọng nhất từ thế kỷ 16 đến nửa đầu thế kỷ 18."
  loai: lich-su
- trang: tai-lieu-tham-khao
  id: t3
  cau: Grove Music Online (oxfordmusiconline.com) là bách khoa âm nhạc của Oxford University Press, nằm trong cổng Oxford Music Online.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t4
  cau: "Encyclopaedia Britannica (britannica.com): mục từ về nhà soạn nhạc, nhạc cụ và thuật ngữ âm nhạc."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t5
  cau: "The Concise Oxford Dictionary of Music đọc qua Encyclopedia.com: mục từ ngắn về thuật ngữ, nhạc cụ và thể loại; nhiều trang trên site dẫn nguồn này."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t7
  cau: Burkholder, Grout, Palisca, A History of Western Music (W. W. Norton, nhiều lần tái bản).
  loai: ten
- trang: tai-lieu-tham-khao
  id: t8
  cau: "Taruskin, The Oxford History of Western Music (Oxford University Press, 2005): bộ lịch sử nhiều tập của một tác giả."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t9
  cau: Craig Wright, Listening to Music, và khóa học cùng tên trên Open Yale Courses (MUSI 112).
  loai: ten
- trang: tai-lieu-tham-khao
  id: t10
  cau: "Alex Ross, The Rest Is Noise: Listening to the Twentieth Century (Farrar, Straus and Giroux, 2007): âm nhạc thế kỷ 20."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t11
  cau: "Open Music Theory: giáo trình mở, đọc tự do trên mạng, giấy phép CC BY-SA 4.0, nguồn chính cho các bài nhạc lý của site."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t12
  cau: "musictheory.net: bài học nhạc lý trực tuyến, từ cơ bản đến trung cấp."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t13
  cau: "Fux, Gradus ad Parnassum (1725), bản dịch tiếng Anh của Alfred Mann, The Study of Counterpoint (W. W. Norton, 1965): giáo trình đối âm được kể ở bài 22."
  loai: nam
- trang: tai-lieu-tham-khao
  id: t14
  cau: "Laitz, The Complete Musician: An Integrated Approach to Tonal Theory, Analysis, and Listening (Oxford University Press): giáo trình hòa âm, phân tích và luyện nghe nhạc có giọng."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t15
  cau: "ABRSM và Trinity College London: chương trình thi cấp, thước đo cấp độ (Grade) dùng trên toàn site."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t16
  cau: Thang độ khó 1–9 trong danh mục G. Henle Verlag (phần piano do Rolf Koenen biên soạn).
  loai: cap-do
- trang: tai-lieu-tham-khao
  id: t17
  cau: "Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred, 1995): xếp cấp và mô tả tác phẩm."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t18
  cau: Maurice Hinson, Wesley Roberts, Guide to the Pianist's Repertoire (bản thứ tư, Indiana University Press, 2014).
  loai: ten
- trang: tai-lieu-tham-khao
  id: t19
  cau: Heinrich Neuhaus, The Art of Piano Playing.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t20
  cau: Thomas Mark, What Every Pianist Needs to Know About the Body (GIA, 2003).
  loai: ten
- trang: tai-lieu-tham-khao
  id: t21
  cau: Gerald Klickstein, The Musician's Way (Oxford University Press, 2009).
  loai: ten
- trang: tai-lieu-tham-khao
  id: t22
  cau: "Graham Fitch, Practising the Piano (practisingthepiano.com): kỹ thuật, cách tập và giữ tay khỏe."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t23
  cau: "Giáo trình cho người lớn: Alfred's Basic Adult Piano Course (Willard A. Palmer, Morton Manus, Amanda Vick Lethco), Adult Piano Adventures (Faber Piano Adventures)."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t24
  cau: "IMSLP (International Music Score Library Project): kho bản nhạc và tổng phổ thuộc phạm vi công cộng; nguồn để đối chiếu các trích đoạn tác phẩm thật trên site."
  loai: dinh-nghia
- trang: tai-lieu-tham-khao
  id: t25
  cau: "Mutopia Project: bản nhạc mở do tình nguyện viên chép bằng LilyPond từ ấn bản thuộc phạm vi công cộng, kèm tệp nguồn; nguồn của nhiều đoạn trích trong các bài học tác phẩm."
  loai: dinh-nghia
- trang: tai-lieu-tham-khao
  id: t26
  cau: Ấn bản Urtext (G. Henle Verlag, Wiener Urtext, Bärenreiter) để đối chiếu nốt, đọc lời tựa và chú giải nguồn.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t27
  cau: Gramophone (tạp chí, có cơ sở dữ liệu đánh giá bản thu) và Bachtrack (lịch diễn, đánh giá, tin tức).
  loai: ten
- trang: tai-lieu-tham-khao
  id: t29
  cau: "UNESCO, Di sản văn hóa phi vật thể: các danh sách di sản đã đăng ký."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t30
  cau: Mẫu âm piano Salamander Grand Piano V3 của Alexander Holm (đàn Yamaha C5), giấy phép Creative Commons Attribution 3.0; bản gốc trên archive.org.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t31
  cau: Bản MP3 của mẫu âm lấy từ dự án Tone.js audio.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t34
  cau: 'Mốc tham khảo trong bảng "Theo dõi khi nghe" được căn tự động giữa bản thu và bản nhạc dạng số: dữ liệu của piano-midi.de (Bernd Krüger), bộ ASAP, các bản Humdrum của Craig Sapp và của Viện Fryderyk Chopin.'
  loai: ten
- trang: tai-lieu-tham-khao
  id: t35
  cau: Dữ liệu của DCML và dự án TROMPA cũng dùng cho mốc tham khảo.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t36
  cau: "abcjs (Paul Rosen, giấy phép MIT): vẽ khuông nhạc và phát âm thanh từ ký hiệu ABC."
  loai: ten
- trang: tai-lieu-tham-khao
  id: t37
  cau: Khung và giao diện của site là Astro và Starlight.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t38
  cau: Font Be Vietnam Pro (chữ thường) và Literata (tiêu đề), giấy phép SIL Open Font License 1.1; bản lưu trên site lấy từ Google Fonts.
  loai: ten
- trang: tai-lieu-tham-khao
  id: t42
  cau: CC BY-SA 4.0 cho phép sao chép, chia sẻ, chỉnh sửa, kể cả thương mại, nếu ghi nguồn, nói rõ đã sửa đổi và chia sẻ theo cùng giấy phép.
  loai: quy-tac
- trang: tai-lieu-tham-khao
  id: t43
  cau: Nội dung trích từ nguồn khác thuộc về tác giả của nguồn đó; bản thu, mẫu âm piano, font và abcjs giữ giấy phép riêng.
  loai: khuyen-tap
- trang: tai-lieu-tham-khao
  id: t6
  cau: "Wikipedia tiếng Anh: điểm khởi đầu tốt cho danh mục tác phẩm và năm tháng; nên đối chiếu với nguồn khác khi dùng để viết."
  loai: khuyen-tap
- trang: nhan-dien/index
  id: i4
  cau: "Mẹo: đừng cố nghe cả 7 yếu tố cùng lúc; bắt đầu với biên chế và kết cấu, rồi thêm từng yếu tố khi tai đã quen."
  loai: khuyen-tap
- trang: nhan-dien/index
  id: i7
  cau: "Lộ trình: tuần 1–2 đọc bảng so sánh và luyện nhận biết kết cấu mỗi ngày; tuần 3–4 đoán phong cách đến khi đúng 8/10 và luyện nhận biết kết; tháng 2 nghe mù với bản thu thật; tháng 3 trở đi đọc dấu vân tay nhà soạn nhạc."
  loai: khuyen-tap
