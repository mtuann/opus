- trang: piano/tac-pham/burgmuller-la-candeur
  id: n1
  cau: La candeur là bài mở đầu (số 1) của tập 25 Études faciles et progressives,
    Op. 100 của Burgmüller.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n2
  cau: La candeur là bài mở đầu tập 25 Études faciles et progressives, Op. 100 của
    Burgmüller.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n3
  cau: Bài có giai điệu móc đơn hát liền tiếng ở tay phải trên những hợp âm ngân
    của tay trái, rồi hai tay đổi vai.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n4
  cau: Chữ candeur nghĩa là trong sáng, ngây thơ.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n6
  cau: Burgmüller mở tập Op. 100 bằng một bài hát không lời có câu, có chỗ to dần,
    một nốt nhấn sf ở đỉnh, một chỗ dolce e poco rit. và một coda nhỏ dần đến
    pp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n7
  cau: Gần như ô nào cũng là một chuỗi móc đơn có dấu luyến, từng nhóm bốn hoặc
    tám nốt.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n9
  cau: Suốt đoạn A, tay trái chỉ giữ hợp âm.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n12
  cau: Đoạn B đưa hình móc đơn xuống tay trái trong khi tay phải giữ hai nốt ngân;
    ô 13 bắt một bàn tay chơi hai bè cùng lúc.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n13
  cau: Bài ở Đô trưởng nhưng có Fa♯ (ô 7), Mi♭ (ô 13) và La♭ (coda).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n15
  cau: Friedrich Burgmüller sinh năm 1806 ở Regensburg.
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n16
  cau: Burgmüller sang Paris năm 1832 và sống ở Pháp đến cuối đời.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n17
  cau: Ở Paris, Burgmüller làm thầy dạy piano và viết nhạc salon (nhạc piano phổ
    thông) cho người chơi nghiệp dư.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n19
  cau: Arabesque là bài số 2 của cùng tập Op. 100, đứng ngay sau La candeur.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n20
  cau: 25 Études faciles et progressives, Op. 100 in năm 1851.
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n21
  cau: Tựa đề đầy đủ của tập nói các bài được soạn và ghi số ngón riêng cho tầm
    với của bàn tay nhỏ.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n22
  cau: Mỗi bài của Op. 100 mang một tựa tiếng Pháp gợi một tính cách hay một hình
    ảnh.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n23
  cau: Độ khó các bài của Op. 100 tăng dần theo thứ tự.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n24
  cau: La candeur đứng đầu tập, ngay trước Arabesque.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n26
  cau: "Chữ candeur trong tiếng Pháp chỉ sự trong sáng, thật thà, không chút tính
    toán: cái ngây thơ của trẻ nhỏ."
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n27
  cau: Bản dàn trang trên Mutopia (theo ấn bản Litolff) ghi thêm tựa tiếng Đức và
    tiếng Anh với nghĩa "sự chân thành".
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n30
  cau: Bài này được thu rất nhiều, cả bởi nghệ sĩ lẫn giáo viên.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n32
  cau: Ở đoạn B, tay trái nhận hình móc đơn trong khi tay phải giữ hai nốt ngân;
    nốt La cao ở ô 14 có dấu sf; coda nhỏ dần, chậm lại, hợp âm cuối pp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n34
  cau: La candeur và Arabesque đứng liền nhau trong tập mà tính cách trái ngược hẳn.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n35
  cau: "Đoạn A (ô 1–8): p, dolce; tay phải hát chuỗi móc đơn bắt đầu từ Sol cao,
    tay trái giữ hợp âm; to dần ở ô 5–7, dừng trên hợp âm Sol (át âm)."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n36
  cau: Đoạn A được nhắc lại (ô 1–8).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n37
  cau: "Đoạn B, nửa đầu (ô 9–12): p; ô 9 và 11 hai tay đi ngược chiều; ô 10 và 12
    tay phải giữ Đô – Mi, tay trái chạy móc đơn và to dần."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n38
  cau: "Đoạn B, nửa sau (ô 13–16): Mi♭ tạo màu tối bất ngờ; nốt La cao sf rơi
    xuống Sol; dolce e poco rit.; kết ở Đô trưởng, tay trái đáp lại bằng hình
    nốt nhỏ Đô – Mi – Fa – Sol."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n39
  cau: Đoạn B được nhắc lại (ô 9–15).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n40
  cau: "Kết thứ hai và coda: tay phải chạy lên Đô – Rê – Mi – Fa – Sol rồi rơi
    xuống Fa – Rê – Đô – Si, mỗi nhóm nhỏ dần; tay trái giữ âm nền Đô, hợp âm Fa
    thứ (có La♭) xen với Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n41
  cau: "Kết: tay trái nhắc lại hình Đô – Mi – Fa – Sol ở âm vực trầm; hợp âm Đô
    trưởng dim. e poco rit.; hợp âm cuối pp."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n42
  cau: "Đoạn A (ô 1–8, nhắc lại) ở Đô trưởng; hợp âm Rê có Fa♯ (ô 7) dẫn về hợp âm
    Sol: dừng ở át âm (kết nửa)."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n43
  cau: "Đoạn A: tay phải có nhóm bốn móc đơn đi xuống (ô 1–2, 5–6), câu tám nốt có
    Si – Đô (ô 3–4), ô 7 dẫn xuống Sol; tay trái mỗi ô một hợp âm ngân, dolce."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n44
  cau: Ở ô 2 tay phải dời lên Đô6; ở ô 3–4 ngón 2 vắt qua ngón cái xuống Si.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n45
  cau: "Đoạn B, nửa đầu (ô 9–12): hợp âm át bảy (Sol – Si – Rê – Fa) xen với Đô
    trưởng; ô 9, 11 tay phải Fa – Rê – Đô – Si đi xuống, tay trái Sol – Si – Đô
    – Rê đi lên; ô 10, 12 tay phải giữ Đô – Mi, tay trái chạy."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n46
  cau: Ở ô 10 và 12, dấu to dần nằm trên nốt ngân của tay phải.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n47
  cau: Trên piano, nốt đã đánh thì tắt dần, không thể to lên, nên chính tay trái
    làm việc to dần.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n48
  cau: "Đoạn B, nửa sau (ô 13–16): Mi♭ và Fa♯ trên bè trầm La (ô 13); hợp âm Đô
    thế đảo hai (ô 14), Sol bảy (ô 15); kết trọn ở Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n49
  cau: Ô 13 tay phải chơi hai bè; ô 14 La sf rơi xuống Sol; ô 15 p, dolce e poco
    rit.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n50
  cau: Kết thứ nhất quay về ô 9; kết thứ hai đi thẳng vào coda.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n51
  cau: Coda dài khoảng 6 ô, trên âm nền Đô, hợp âm Fa thứ (Đô – Fa – La♭) xen với
    Đô trưởng; hình nốt của đoạn B trở lại, mỗi nhóm nhỏ dần; tay trái Đô – Mi –
    Fa – Sol; dim. e poco rit., pp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n52
  cau: Trong bản Mutopia, khuông tay trái chuyển sang khóa Sol từ ô 15 đến gần cuối.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n53
  cau: "Đoạn A dừng ở át âm, đoạn B khép lại ở chủ âm: khung của hình thức hai
    đoạn, cộng thêm một coda."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n55
  cau: Cả hai đoạn đều nhắc lại; lần thứ hai, đoạn B bỏ kết thứ nhất, rẽ sang kết
    thứ hai và đi thẳng vào coda.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n56
  cau: Nốt nhạc, dấu luyến, sắc thái và số ngón của khuông đoạn A theo bản Mutopia
    (ấn bản Litolff); số ngón chỉ ghi ở những chỗ bản ấy ghi.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n57
  cau: Hết ô 8, nhắc lại từ đầu rồi mới sang đoạn B.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n58
  cau: "Ô 1: ngón 5 trên Sol5, bốn nốt Sol – Mi – Rê – Đô bằng 5-3-2-1. Ô 2: ngón
    5 trên Đô6, rồi lại 5-3-2-1."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n59
  cau: "Ô 3–4: sau Đô (ngón 1), ngón 2 vắt qua ngón cái xuống Si rồi ngón cái trở
    lại Đô."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n61
  cau: "Ô 7: ngón 3 trên Si và ngón 4 trên Đô đặt tay vào thế năm ngón Sol – Rê,
    để ngón cái sẵn sàng cho nốt Sol ở ô 8."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n63
  cau: Ở ô 3–4, dấu nối giữ nguyên hợp âm tay trái qua hai ô.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n64
  cau: Thế tay năm ngón của tay phải ở ô 1 đi từ Đô (C5) đến Sol (G5).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n66
  cau: "Ô 13: ngón 5 giữ Sol rồi Fa♯ trong khi các ngón khác chơi Mi♭ – Rê – Đô
    sau một dấu lặng; Mi♭ là phím đen."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n69
  cau: "Bài tập 1: tay phải mf, tay trái pp; tay trái dùng 5-3-1 cho Đô – Mi – Sol
    và 5-2-1 cho Si – Fa – Sol."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n71
  cau: "Bài tập 2: ô 1 và 3 hai tay đi ngược chiều, kiểu ô 9 của bài; ô 2 và 4 tay
    phải giữ Đô – Mi (ngón 1 và 3), tay trái chạy, to dần rồi nhỏ dần."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n72
  cau: "Bài tập 3: ngón 5 giữ nốt trên trong khi ngón 3-2-1 (hay 4-3-2) chơi nhóm
    ba nốt sau dấu lặng; ở ô 2 bàn tay dời xuống một bậc mỗi nửa ô; đó là kết
    cấu của ô 13. Ô 3–4 mỗi cặp hai nốt luyến như nốt La sf ở ô 14; ô cuối chậm
    lại như poco rit. ở ô 15."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n76
  cau: Allegro moderato là nhanh vừa phải.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n81
  cau: "Phần lớn bài ở p; các chỗ sắc thái: nhỏ dần trên nhóm đầu ô 2; cresc. từ ô
    5 đến dấu to dần ở ô 7; to dần ở ô 10 và 12; ô 13 nhỏ dần trên hai nốt ngân;
    sf ở ô 14; p, dolce e poco rit. ở ô 15; trong coda mỗi nhóm Fa – Rê – Đô –
    Si có dấu nhỏ dần riêng, rồi dim. e poco rit. và pp."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n82
  cau: sf chỉ là nhấn một nốt, không phải chuyển cả đoạn sang f.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n84
  cau: Bản Litolff trên Mutopia không ghi bàn đạp.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n87
  cau: Số ngón của tập Op. 100 được tính cho bàn tay nhỏ, đúng như tựa tập nhạc.
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n91
  cau: Trong Op. 100, La pastorale là số 3, Consolation số 13, Ave Maria số 19.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n95
  cau: "Câu hỏi 1: đoạn A (ô 1–8) dừng trên hợp âm Sol, tức át âm (kết nửa), ngay
    sau hợp âm Rê có Fa♯; chỉ đoạn B mới kết trọn ở Đô trưởng; đó là khung của
    hình thức hai đoạn."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n96
  cau: "Câu hỏi 2: ở ô 10 và 12, chính tay trái với chuỗi móc đơn bên dưới làm
    việc to dần, vì trên piano một nốt đã đánh không thể to lên."
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n97
  cau: "Câu hỏi 3: khó khăn chính ở ô 13 là tay phải chơi hai bè, ngón 5 giữ nốt
    trên, các ngón còn lại chơi Mi♭ – Rê – Đô."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n99
  cau: "Mục Nguồn: bản dàn trang công cộng La Candeur tại Mutopia Project (id
    202), người dàn trang Bas Wassink, nguồn Collection Litolff."
  loai: ten
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n100
  cau: "Mục Nguồn: trang IMSLP của Op. 100 cho lần in đầu (Paris: Benoît aîné,
    1851) và tên các bài trong tập."
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n101
  cau: 'Mục Nguồn: Wikipedia, "Friedrich Burgmüller" cho năm sinh, năm mất, năm
    sang Paris.'
  loai: nam
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n62
  cau: "Số ngón tay trái (gợi ý của trang): Đô – Mi – Sol 5-3-1, Đô – Fa – La
    5-2-1, Si – Fa – Sol 5-2-1, Rê – Fa♯ – Đô 5-3-1, Sol – Si 2-1; đặt hợp âm
    cùng lúc với nốt đầu của tay phải và giữ đủ bốn phách."
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n75
  cau: Mẹo "Kiểm tra cân bằng bằng tai" và danh sách tự kiểm (năm ô đánh dấu).
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-la-candeur
  id: n98
  cau: "Câu hỏi 4: dấu luyến bốn nốt là cách chia nhóm; cuối nhóm chỉ lấy một hơi
    rất nhẹ, đường câu vẫn kéo dài hai ô."
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol
  id: n1
  cau: Bản minuet này thường được gọi là "Minuet của Bach".
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n2
  cau: Bài có hai bè độc lập (tay trái không đệm hợp âm mà đi một đường bè trầm
    riêng, lúc đứng yên, lúc chạy).
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n3
  cau: Bài gồm bốn câu 8 ô, mỗi câu chia đôi thành hai nửa 4 ô; tổng 32 ô.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n4
  cau: Bản gốc gần như không ghi dấu luyến hay sắc thái.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n5
  cau: "Kỹ năng của bài: mở rộng thế tay năm ngón, đổi vị trí tay, nhảy quãng tám
    ở cả hai tay, đọc Fa♯ và Đô♯."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n6
  cau: Năm 1725, J. S. Bach bắt đầu cuốn sổ tay âm nhạc thứ hai cho vợ, Anna
    Magdalena Bach; sổ mở đầu bằng hai partita của Bach, sau là những bài nhỏ
    (minuet, polonaise, aria, bài hát); Anna Magdalena tự tay chép nhiều bài,
    trong đó có cặp minuet này.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n7
  cau: Bài số 3 là một minuet Fa trưởng khuyết danh; bài số 4 và 5 là cặp minuet
    Sol trưởng và Sol thứ.
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n8
  cau: Có thể Bach mang hai minuet về sau chuyến đi Dresden tháng 9 năm 1725, khi
    ông biểu diễn trên cây organ Silbermann mới của nhà thờ Sophienkirche, nơi
    Petzold là nghệ sĩ organ.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n9
  cau: Nhiều khả năng các bài dễ này dùng để dạy các con nhỏ trong nhà.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n10
  cau: Vì sổ tay không ghi tên tác giả cho phần lớn các bài, các nhà xuất bản thế
    kỷ 19 in chúng như nhạc của Bach.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n11
  cau: Danh mục tác phẩm Bach (BWV, 1950) xếp cặp minuet vào phụ lục (Anhang, viết
    tắt Anh.), nơi dành cho tác phẩm còn nghi vấn.
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n12
  cau: Cuối thập niên 1970, Hans-Joachim Schulze chỉ ra rằng cặp minuet nằm trong
    một tổ khúc cho harpsichord mang tên Petzold.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n13
  cau: Tổ khúc do Johann Benjamin Tzschirich chép vào một tập nhạc khoảng giữa
    thập niên 1730.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n14
  cau: Bài của Schulze đăng trên Bach-Jahrbuch số năm 1979.
  loai: nam
- trang: piano/tac-pham/minuet-sol
  id: n15
  cau: Từ đó, giới nghiên cứu ghi tên Petzold.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n17
  cau: Từ điển âm nhạc của Johann Gottfried Walther (1732) nhắc đến Petzold như
    tác giả của những bản nhạc đàn phím hay.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n18
  cau: Telemann đã in một tổ khúc của Petzold trong tuyển tập Der getreue
    Music-Meister (1728–1729).
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n19
  cau: Petzold mất năm 1733; người kế nhiệm ông ở Sophienkirche là Wilhelm
    Friedemann Bach, con trai cả của J. S. Bach.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n20
  cau: Minuet là điệu nhảy cung đình Pháp nhịp 3/4, bước nhỏ và thanh lịch, một
    chương quen thuộc trong tổ khúc thời Baroque.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n21
  cau: Về sau minuet trở thành chương 3 của giao hưởng và sonata Cổ điển.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n23
  cau: Ca khúc A Lover's Concerto (1965) do nhóm The Toys thu âm được dựng trên
    giai điệu bài này.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n24
  cau: Petzold viết cho harpsichord.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n25
  cau: Harpsichord không to nhỏ theo lực ngón.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n28
  cau: Igor Kipnis đã thu bài này; Mahan Esfahani thu bài này trên clavichord.
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n29
  cau: '"Nốt đen" là nốt có độ dài một phách (trong nhịp 3/4 của bài).'
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n30
  cau: Minuet Sol thứ (BWV Anh. 115) đi cặp với bài này.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n31
  cau: Thời Baroque người ta thường chơi minuet 1, minuet 2, rồi minuet 1 lần nữa.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol
  id: n33
  cau: "Theo dõi khi nghe, câu 1 (ô 1–8): môtip Rê – Sol La Si Đô đi lên; tay trái
    đi xuống từng bậc bằng nốt trắng chấm dôi; câu dừng lơ lửng trên Rê (kết
    nửa)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n34
  cau: "Câu 2 (ô 9–16): giai điệu như câu 1, chỉ khác ở hai ô cuối; tay trái
    chuyển động nhiều hơn; kết trọn ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n35
  cau: "Đoạn B, câu 3 (ô 17–24): mở đầu ở nốt Si cao, sang Rê trưởng với Đô♯ ở cả
    hai tay; chuỗi móc đơn đi lên ở ô 21 là cao trào nhỏ của bài; kết ở ô 24."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n36
  cau: "Câu 4 (ô 25–32): nốt Rê – Sol của ô 1 trở lại trong dạng mới; chuỗi móc
    đơn ở ô 29 dẫn về kết ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n37
  cau: Bảng cấu trúc, câu 3 "chuyển sang Rê trưởng (có Đô♯)"; câu 4 "về lại Sol
    trưởng (tay trái đã có Đô♮ ở ô 24)".
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n38
  cau: "Bảng cấu trúc, câu 1: ô 1–4 như câu hỏi, ô 5–8 đi xuống từng bậc và dừng
    lơ lửng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n39
  cau: Đoạn A chỉ khép lại bằng kết trọn ở ô 16; đừng làm ô 8 "kết" mạnh như ô 16.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n40
  cau: "Cả bài chỉ dùng vài ý: môtip đi lên của ô 1, chuỗi móc đơn đi xuống của ô
    5–6, và chuỗi móc đơn đi lên dẫn tới kết (ô 21, ô 29)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n42
  cau: Nốt nhạc của khuông theo ấn bản Bach-Gesellschaft (1894), bỏ các dấu trang
    trí; số ngón là gợi ý của trang; ô 1–8 là câu 1, ô 9–16 là câu 2; hết ô 16
    thì nhắc lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n44
  cau: "Chỗ khó: nhảy quãng tám tay phải (Sol cao xuống Sol) ở ô 4 và 12."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n45
  cau: "Chỗ khó: đổi thế tay ở ô 3, 7, 15 (Mi rồi Đô ở ô 3; Fa♯ nằm dưới thế tay ở
    ô 7 và 15)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n47
  cau: Tay phải chạy móc đơn khi tay trái giữ nốt dài; ở ô 8 và 12 thì tay trái
    chạy móc đơn.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n48
  cau: Hóa biểu chỉ có Fa♯; Đô♯ xuất hiện ở ô 20–23, rồi Đô♮ trở lại ở tay trái ô
    24.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n49
  cau: "Bước nhảy tay trái ở ô 8: Rê xuống Rê thấp rồi vọt lên Đô (quãng bảy)
    trong thời gian của móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n53
  cau: "Bài tập 2: ô 2 chính là kiểu chuyển động của ô 8 trong bài; ô 3–4 đổi vai."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n57
  cau: Minuet là điệu nhảy vừa phải, không phải bài chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol
  id: n61
  cau: Bản gốc không ghi sắc thái.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n63
  cau: Ấn bản Bach-Gesellschaft in dấu láy (mordent) ở nốt Đô của ô 3 và ô 5 (và ô
    11, 13), một appoggiatura Si trước nốt La ở ô 8, và một láy rền ngắn ở ô 30.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n69
  cau: "Cùng cuốn sổ tay 1725: Minuet Fa trưởng (BWV Anh. 113) và Musette Rê
    trưởng (BWV Anh. 126)."
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n72
  cau: "Câu hỏi 1: ô 8 kết nửa, dừng lơ lửng trên Rê, hợp âm át (không phải kết
    trọn ở Sol trưởng, không chuyển hẳn sang Rê trưởng)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n73
  cau: "Câu hỏi 1, giải thích: câu 1 dừng lơ lửng ở ô 8; đoạn A chỉ khép lại bằng
    kết trọn ở ô 16."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol
  id: n74
  cau: 'Câu hỏi 2: chữ "Anh." trong BWV Anh. 114 là phụ lục (Anhang) của danh mục
    Bach, nơi xếp các tác phẩm còn nghi vấn (không phải bài do Anna Magdalena
    sáng tác hay bản soạn lại cho harpsichord).'
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol
  id: n75
  cau: "Câu hỏi 2, giải thích: danh mục BWV (1950) xếp cặp minuet vào phụ lục; từ
    cuối thập niên 1970, sau nghiên cứu của Hans-Joachim Schulze, giới nghiên
    cứu ghi tên Christian Petzold."
  loai: lich-su
- trang: piano/tac-pham/minuet-sol
  id: n79
  cau: "Nguồn: bài của Hans-Joachim Schulze trên Bach-Jahrbuch 65 (1979), tr.
    45–64, là bằng chứng chính cho việc ghi tên Petzold."
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n80
  cau: "Nguồn: Neue Bach-Ausgabe, tập V/4 (Bärenreiter, 1957, biên tập Georg von
    Dadelsen): hai cuốn sổ tay của Anna Magdalena Bach."
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n81
  cau: "Nguồn: ấn bản Bach-Gesellschaft (1894), bản dàn trang công cộng của
    Mutopia Project: nguồn của đoạn nhạc trên trang."
  loai: ten
- trang: piano/tac-pham/minuet-sol
  id: n27
  cau: Nghe ít nhất hai bản (harpsichord hay clavichord, và piano); mỗi lần nghe
    chú ý một điều (nhịp nhảy, phát âm, tay trái, nhắc lại).
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol
  id: n26
  cau: Câu nhạc trên harpsichord được "nói" bằng phát âm và nhịp điệu; trên piano,
    giữ sự rõ ràng đó trước khi nghĩ đến sắc thái.
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol
  id: n43
  cau: Hợp âm đầu bài ở tay trái dùng ngón 5-3-1; ở ô 13–14, ngón 5 trượt từ Fa♯
    lên Sol (ổn với cách phát âm hơi tách).
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol-thu
  id: n1
  cau: Đây là bài thứ hai của cặp minuet trong cuốn sổ tay năm 1725 của Anna
    Magdalena Bach, đi liền sau Minuet Sol trưởng (bài số 5, ngay sau bài số 4).
  loai: danh-muc
- trang: piano/tac-pham/minuet-sol-thu
  id: n2
  cau: Cùng nhịp 3/4, cùng 32 ô nhịp với Minuet Sol trưởng.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n4
  cau: Trong giọng thứ, bè trầm đi xuống từng bậc, nốt Fa♯ kéo về Sol.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n5
  cau: "Bốn ô đầu, tay trái đi xuống Sol – Fa – Mi♭ – Rê, ba nốt đầu là nốt trắng
    chấm dôi: bốn bậc từ chủ âm xuống át âm."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n6
  cau: Petzold chưa từng biết cây đàn piano (ông viết cho harpsichord).
  loai: lich-su
- trang: piano/tac-pham/minuet-sol-thu
  id: n7
  cau: Giọng thứ có những nốt riêng (Fa♯, Mi♮) và một đường đi hòa âm riêng.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n8
  cau: Hóa biểu chỉ có Si♭ và Mi♭; gần như mỗi lần nhạc dừng trên hợp âm Rê hay
    kết ở Sol thứ đều có Fa♯, cảm âm nằm dưới chủ âm nửa cung.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n10
  cau: Bản gốc không có một dấu luyến nào.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n11
  cau: Bài cùng nằm trong sổ tay 1725, cùng được xác định là của Christian Petzold
    chứ không phải của Bach.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol-thu
  id: n13
  cau: Trong tổ khúc cho harpsichord của Petzold, hai minuet hợp thành một chương,
    bên cạnh các chương prelude, allemande, courante, sarabande, bourrée, gigue
    và passepied (kèm trio), và được chơi theo thứ tự Sol trưởng, Sol thứ, rồi
    Sol trưởng lần nữa (da capo).
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n14
  cau: Minuet thứ hai, cùng chủ âm nhưng khác màu, giữ vai trò tương phản mà về
    sau người ta gọi là trio.
  loai: lich-su
- trang: piano/tac-pham/minuet-sol-thu
  id: n16
  cau: "Harpsichord: dây được gảy, to nhỏ không đổi theo lực ngón; piano hiện đại
    dễ to nhỏ."
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n19
  cau: Igor Kipnis đã thu cặp minuet; Mahan Esfahani thu cặp minuet trên clavichord.
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n21
  cau: Cuối đoạn A sáng hẳn (đoạn A kết ở Si♭ trưởng).
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n22
  cau: "Theo dõi khi nghe, câu 1 (ô 1–8): giai điệu đi xuống từ Si♭ cao rồi nhảy
    xuống Rê; tay trái đi xuống Sol – Fa – Mi♭ – Rê; câu dừng lơ lửng trên hợp
    âm Rê (kết nửa)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n23
  cau: "Câu 2 (ô 9–16): mở đầu như câu 1, rồi rẽ sang Si♭ trưởng; màu sáng lên và
    kết trọn ở Si♭ trưởng."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n24
  cau: "Bảng cấu trúc, câu 1: Sol thứ, kết nửa ở ô 8 (dừng trên hợp âm Rê); giai
    điệu và bè trầm cùng đi xuống; tay trái Sol – Fa – Mi♭ (nốt trắng chấm dôi)
    – Rê; Fa♯ đầu tiên ở tay trái ô 7; ô 4 và 8 tay phải giữ, tay trái chạy."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n25
  cau: "Bảng cấu trúc, câu 2: sang Si♭ trưởng, giọng trưởng song song của Sol thứ;
    kết trọn ở ô 16; ô 9–12 như ô 1–4 (tay trái ô 12 có Si♮); ô 13–16 hợp âm Sol
    – Đô – Fa – Si♭ theo vòng quãng năm."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n26
  cau: "Câu 3 (ô 17–24): giai điệu leo lên Si♭ cao, dừng ở Fa trưởng (ô 20), rồi
    chuỗi móc đơn đi lên ở ô 21 đưa về Si♭ trưởng (ô 24); Mi♮ cuối ô 17 dẫn sang
    Fa trưởng; ô 18 hai tay đi ngược chiều; Si♭ cao trở lại ở ô 19."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n27
  cau: "Câu 4 (ô 25–32): màu tối trở lại, qua Đô thứ; nốt nhảy zíc zắc ở ô 27;
    dừng trên hợp âm Rê (ô 28); ô 29 gam Sol thứ giai điệu đi lên Rê – Mi♮ – Fa♯
    – Sol – La – Si♭; láy ngắn ở ô 31; kết trọn ở Sol thứ (ô 32)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n28
  cau: "Dấu hóa bất thường ở câu 4: Si♮ (ô 25), Fa♯ (ô 27, 28, 29, 31), Mi♮ (ô 28,
    29)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n29
  cau: Đoạn B nhắc lại (ô 17–32); nếu bản thu chơi trọn cặp, Minuet Sol trưởng trở
    lại sau đó.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n32
  cau: Nốt nhạc của khuông theo ấn bản Bach-Gesellschaft (1894), qua bản dàn trang
    công cộng của Mutopia Project; dấu láy trên ở ô 8 theo bản ấy; số ngón là
    gợi ý của trang.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n33
  cau: Câu 2 (ô 9–16) mở đầu giống hệt câu 1 rồi rẽ sang Si♭ trưởng; hết ô 16 thì
    nhắc lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n34
  cau: Si♭ cao (Si♭5) nằm ngay trên dòng kẻ phụ thứ nhất.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n36
  cau: "Chỗ khó: La5 và Si♭5 nằm ngoài khuông; ô 2 nhảy La → Rê, ô 3 nhảy Sol cao
    → Sol thấp (ô 1–3, 9–11)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n37
  cau: "Chỗ khó: một tay giữ, một tay chạy (ô 3–4, 8, 11–12)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n38
  cau: "Chỗ khó: nốt nhảy zíc zắc ở ô 27 (Sol – Rê, Fa♯ – Đô, Sol – Si♭); nghe như
    hai bè: bè dưới Sol – Fa♯ – Sol, bè trên Rê – Đô – Si♭."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n39
  cau: Gam đi lên ở ô 29 là gam thứ giai điệu (Mi♮ và Fa♯ cùng được nâng); ngón
    gợi ý Rê 1, Mi 2, Fa♯ 3, luồn ngón cái sang Sol 1, La 2, Si♭ 3.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n40
  cau: Láy trên ở ô 8, 9, 15, 31 và láy dưới ở ô 13, 22.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n42
  cau: Sáu nốt đi lên của ô 29 trên bàn phím có hai phím đen Fa♯ và Si♭, còn Mi♮
    là phím trắng.
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n44
  cau: "Bài tập 1: ô 1–4 cùng một thế tay năm ngón, chỉ đổi Si thành Si♭ ở cả hai
    tay là màu đổi từ trưởng sang thứ; ô 5–7 Fa♯ là cảm âm, kéo lên Sol."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n45
  cau: "Bài tập 2: ô 1 tay phải chạy, tay trái giữ; ô 2 đổi vai, giống kiểu ô 4
    của bài; ô 3 tay phải chạy xuống tới Fa♯ trên nền Rê của tay trái, rồi về
    Sol ở ô 4."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n47
  cau: "Bài tập 3: nốt đen tách nhẹ (nhấc ngón sớm, không bật), nhóm móc đơn trong
    dấu luyến chơi liền và nhẹ dần; ô 3 là cách chơi viết ra của dấu láy trên ở
    ô 4; ô 4 giống chỗ dừng ở ô 8 của bài."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n48
  cau: Láy trên (theo cách đọc quen thuộc thời Bach) bắt đầu từ nốt trên, đúng vào
    phách, nhanh và nhẹ, rồi ngân nốt chính; ở ô 8 là Si♭ – La – Si♭ – La rồi
    ngân La.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n49
  cau: Ở ô 9, nốt Si♭ vừa vang ngay trước nốt La có láy, nên chỉ cần nối sang chứ
    không đánh lại.
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n50
  cau: "Láy dưới là chính – dưới – chính: Fa – Mi♭ – Fa ở ô 13."
  loai: dinh-nghia
- trang: piano/tac-pham/minuet-sol-thu
  id: n56
  cau: Bản Bach-Gesellschaft không có dấu luyến hay dấu chấm nào; nhiều ấn bản cho
    người học thêm vào theo ý người biên tập.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n61
  cau: Các ấn bản khác nhau ở chi tiết nốt hoa mỹ.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n66
  cau: Mozart Minuet Fa trưởng K. 2 ghé qua Sol thứ ở đoạn giữa.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n67
  cau: Schumann Album für die Jugend có Wilder Reiter ở La thứ.
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n69
  cau: "Câu hỏi 1: đoạn A (ô 1–16) kết ở Si♭ trưởng, giọng trưởng song song của
    Sol thứ (không phải Sol thứ hay Rê trưởng)."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n70
  cau: "Câu hỏi 1, giải thích: câu 1 chỉ dừng lơ lửng trên hợp âm Rê (ô 8); câu 2
    rẽ sang Si♭ trưởng và kết trọn ở ô 16; Sol thứ chỉ trở về hẳn ở cuối đoạn
    B."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n71
  cau: "Câu hỏi 2: bài có Fa♯ vì Fa♯ là cảm âm, bậc 7 được nâng lên nửa cung để
    kéo mạnh về chủ âm Sol (không phải lỗi chép tay, không phải chuyển hẳn sang
    Sol trưởng)."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n72
  cau: "Câu hỏi 2, giải thích: gam thứ hòa âm và gam thứ giai điệu nâng bậc 7; ở ô
    29, gam thứ giai điệu đi lên còn nâng cả bậc 6 thành Mi♮."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n73
  cau: "Câu hỏi 3: dấu láy trên ở nốt La ô 8 chơi bắt đầu từ nốt trên Si♭, đúng
    vào phách, nhanh và nhẹ, rồi ngân La (không bắt đầu từ La trước phách, không
    láy đều suốt ba phách); giải thích: đó là cách viết ra ở bài tập 3."
  loai: quy-tac
- trang: piano/tac-pham/minuet-sol-thu
  id: n74
  cau: "Câu hỏi 4: theo tổ khúc của Petzold, cặp minuet được chơi Sol trưởng, Sol
    thứ, rồi Sol trưởng lần nữa; hai bài hợp thành một chương, minuet Sol thứ là
    phần tương phản ở giữa, như trio về sau."
  loai: cau-truc
- trang: piano/tac-pham/minuet-sol-thu
  id: n75
  cau: "Nguồn: bài của Hans-Joachim Schulze, Bach-Jahrbuch 65 (1979), tr. 45–64,
    bằng chứng chính cho việc ghi tên Petzold."
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n76
  cau: "Nguồn: Neue Bach-Ausgabe, tập V/4 (Bärenreiter, 1957, biên tập Georg von
    Dadelsen)."
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n77
  cau: "Nguồn: ấn bản Bach-Gesellschaft (1894), bản dàn trang công cộng của
    Mutopia Project (người nhập: Allen Garvin)."
  loai: ten
- trang: piano/tac-pham/minuet-sol-thu
  id: n30
  cau: Mọi Fa♯, Mi♮ và Si♮ là bản đồ chuyển giọng của bài; khoanh chúng bằng bút
    chì.
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol-thu
  id: n35
  cau: "Ngón và thế tay: ô 1 ngón 5 trên Si♭ cao; ô 3 cả bàn tay rơi xuống một
    quãng tám để ngón 1 bắt đầu Sol – La – Si♭ – Đô; ô 5 dời tay lên, ô 7 dời
    lại xuống để láy ở ô 8 dùng ngón 2–3; tay trái ngón 2-3-4 cho ba nốt dài, ô
    4 và 8 nhảy Rê3 lên Rê4 bằng ngón 5 rồi 1."
  loai: khuyen-tap
- trang: piano/tac-pham/minuet-sol-thu
  id: n41
  cau: Cách tập các chỗ khó (khoanh dấu hóa, đọc to tên nốt, thuộc nốt vạch phụ,
    tập riêng bước nhảy, đếm to, tập từng bè, học không láy trước).
  loai: khuyen-tap
