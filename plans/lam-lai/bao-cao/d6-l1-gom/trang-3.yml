- trang: piano/tac-pham/schumann-album
  id: n1
  cau: Năm 1848, Schumann viết cho các con mình 43 bản nhạc ngắn (Album für die
    Jugend).
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n4
  cau: Schumann không viết bài tập mà viết những tiểu phẩm có tên gọi, có nhân
    vật, có cảm xúc.
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n5
  cau: Melodie dạy hát legato trên lớp đệm nhẹ; Wilder Reiter dạy staccato và
    chuyển giai điệu từ tay phải sang tay trái; Fröhlicher Landmann dạy để tay
    trái hát, rồi bắt một tay vừa hát vừa đệm.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n7
  cau: Mỗi bài chỉ dài khoảng một phút.
  loai: so-lieu
- trang: piano/tac-pham/schumann-album
  id: n9
  cau: 'Ngày 31 tháng 8 năm 1848, Schumann ghi trong sổ chi tiêu gia đình: "ý
    tưởng về album cho trẻ em, những bản nhỏ cho Marie".'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n10
  cau: Ngày 1 tháng 9 (1848) là sinh nhật lần thứ bảy của Marie, con gái lớn của
    Robert và Clara Schumann; quà của bố là một tập bài nhỏ chép tay.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n11
  cau: Những ngày tiếp theo Schumann ghi "rất nhiều bản nhỏ cho trẻ em", đến 9
    tháng 9 thì album "gần xong"; vài bài còn được viết thêm trong tháng 9.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n12
  cau: Schumann định đặt tên Weihnachtsalbum für Kinder (Album Giáng sinh cho trẻ
    em) để in kịp Giáng sinh.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n13
  cau: Nhà Breitkopf & Härtel từ chối in; Julius Schuberth ở Hamburg nhận lời.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n14
  cau: Schuberth đề nghị bỏ chữ "Giáng sinh" để tập nhạc bán được quanh năm.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n15
  cau: Bản in đầu tiên ra tháng 12/1848.
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n16
  cau: Bản in đầu có tranh bìa trong của họa sĩ Ludwig Richter, bốn góc vẽ bốn mùa.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n17
  cau: Trang bìa ghi nhầm "40 bản nhạc" dù tập có đủ 43 bài.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n18
  cau: Trong vòng một năm, nhà xuất bản quảng cáo đã bán gần 2.000 bản.
  loai: so-lieu
- trang: piano/tac-pham/schumann-album
  id: n19
  cau: "Trong một lá thư năm 1848, Schumann phân biệt: Kinderszenen là hồi tưởng
    của người lớn, viết cho người lớn; album mới hướng về phía trước, dành cho
    các em nhỏ."
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n20
  cau: Kinderszenen (Cảnh tuổi thơ) viết năm 1838.
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n21
  cau: Phần hai của album khó hơn và mang nhiều màu sắc người lớn hơn.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n22
  cau: Bài số 28, Erinnerung (Kỷ niệm), ghi ngày 4 tháng 11 năm 1847, ngày
    Mendelssohn qua đời.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n23
  cau: Cùng thời gian đó, Schumann viết Musikalische Haus- und Lebensregeln, một
    chuỗi câu ngắn gửi người học nhạc.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n24
  cau: Haus- und Lebensregeln được in trên Neue Zeitschrift für Musik năm 1850,
    rồi in kèm album từ lần in thứ hai (12/1850).
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n25
  cau: Ấn bản năm 1859 in Haus- und Lebensregeln ba thứ tiếng; bản tiếng Pháp do
    Franz Liszt dịch.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n26
  cau: '"Spiele im Takte!" Chơi đúng nhịp! Lối chơi của một số virtuoso giống như
    dáng đi của người say.'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n27
  cau: '"Schleppen und Eilen sind gleich große Fehler." Kéo lê và chạy vội là hai
    lỗi lớn ngang nhau.'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n28
  cau: Hãy cố chơi những bài dễ thật hay và đẹp; như thế tốt hơn chơi bài khó một
    cách tầm thường.
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n29
  cau: '"Es ist des Lernens kein Ende." Việc học không bao giờ kết thúc.'
  loai: lich-su
- trang: piano/tac-pham/schumann-album
  id: n31
  cau: Phần một của album gồm số 1–18.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n34
  cau: "Số 1 Melodie, câu a (vang hai lần): giai điệu legato ở tay phải trên lớp
    móc đơn đều của tay trái, mỗi hơi hai ô; câu dừng lơ lửng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n35
  cau: "Câu b: giai điệu đổi hướng, những mảnh ngắn ngắt bằng dấu lặng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n36
  cau: "Câu a': nốt đầu có thêm quãng ba; lần này câu kết trọn ở Đô."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n37
  cau: Câu b và câu a' lần nữa, kết bài ở Đô trưởng.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n38
  cau: "Số 8 Wilder Reiter, đoạn A (vang hai lần): La thứ, mở bằng nhịp lấy đà;
    giai điệu staccato ở tay phải, tay trái đánh hợp âm ngắn."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n39
  cau: "Đoạn B: sang Fa trưởng; giai điệu của đoạn A chuyển xuống tay trái, tay
    phải đánh hợp âm ngắn."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n40
  cau: "Đoạn A trở lại: giai điệu về lại tay phải, ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n41
  cau: "Số 10 Fröhlicher Landmann, câu a (vang hai lần): giai điệu chắc khỏe ở tay
    trái, tay phải đệm hợp âm nghịch phách."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n42
  cau: "Đoạn b: giai điệu lên vùng cao, tay phải vừa hát ở trên vừa đệm ở dưới,
    tay trái đi song song bên dưới; hai ô cuối trả giai điệu về tay trái. Đoạn b
    nhắc lại, kết bài ở Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n43
  cau: "Số 1 Melodie: Đô trưởng, 4/4; câu 4 ô: a (vang hai lần) – b – a' – b – a';
    giai điệu ở tay phải legato, tay trái chạy móc đơn đều."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n44
  cau: "Melodie: mỗi câu hai ô một hơi; a' khác a ở nốt đầu (có thêm quãng ba) và
    ở cách kết: a dừng lơ lửng, a' kết trọn ở Đô."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n45
  cau: "Số 8 Wilder Reiter: La thứ, 6/8, bắt đầu bằng nhịp lấy đà; ba đoạn A (8 ô,
    nhắc lại) – B (8 ô) – A (8 ô); A giai điệu tay phải, B tay trái ở Fa trưởng,
    tay kia đánh hợp âm ngắn; giai điệu đoạn B chính là giai điệu đoạn A dời
    sang Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n46
  cau: "Số 10 Fröhlicher Landmann: Fa trưởng, 4/4, nhịp lấy đà một móc đơn; câu a
    (4 ô, vang hai lần) – đoạn b (6 ô, vang hai lần); hai ô cuối của b trả giai
    điệu về tay trái và kết ở Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n47
  cau: Ba bài đều xây từ những câu ngắn, phần lớn 4 ô, nhắc lại và biến đổi.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n52
  cau: "Bài tập 2: ô 1–2 giai điệu tay phải, tay trái hợp âm ngắn; ô 3–4 đổi vai,
    giai điệu xuống tay trái ở Fa trưởng, đúng như đoạn B của Wilder Reiter."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n53
  cau: "Bài tập 3 là kết cấu của đoạn b trong Fröhlicher Landmann: ngón 5 giữ nốt
    giai điệu đủ hai phách, ở mf, trong khi ngón 1–3 đánh hợp âm nhỏ, ngắn ở p."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n56
  cau: Chỉ dẫn Nicht schnell ở đầu Melodie nghĩa là "không nhanh", không phải
    "chậm".
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n58
  cau: Wilder Reiter là hình ảnh một đứa trẻ phi ngựa (tựa gốc trong bản khắc là
    "Wilder Schaukelpferdreiter").
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n60
  cau: Fröhlicher Landmann là người nông dân đi làm về; giai điệu tay trái ở f,
    legato.
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n62
  cau: Số 2 Soldatenmarsch (Hành khúc người lính) ở Sol trưởng, nhịp hành khúc với
    tiết tấu chấm dôi và hợp âm ngắn ở cả hai tay.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n64
  cau: Nhiều người học Soldatenmarsch trước cả Wilder Reiter.
  loai: cap-do
- trang: piano/tac-pham/schumann-album
  id: n65
  cau: Số 16 Erster Verlust (Mất mát đầu tiên) ở Mi thứ, một khúc buồn rất ngắn.
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n68
  cau: "Các bài khác của phần một: Trällerliedchen (số 3), Stückchen (số 5),
    Jägerliedchen (số 7), Volksliedchen (số 9), Kleiner Morgenwanderer (số 17),
    Schnitterliedchen (số 18); phần hai bắt đầu từ Kleine Romanze (số 19)."
  loai: danh-muc
- trang: piano/tac-pham/schumann-album
  id: n70
  cau: "Cùng ý tưởng: Album cho tuổi trẻ Op. 39 của Tchaikovsky (1878) và tập For
    Children của Bartók."
  loai: nam
- trang: piano/tac-pham/schumann-album
  id: n71
  cau: "Câu hỏi 1: ở đoạn B của Wilder Reiter, giai điệu ở tay trái, chính là giai
    điệu đoạn A dời sang Fa trưởng; tay phải chỉ đánh hợp âm ngắn."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n72
  cau: 'Câu hỏi 2: chỉ dẫn Nicht schnell ở đầu Melodie nghĩa là "không nhanh",
    không có nghĩa là "chậm".'
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n73
  cau: "Câu hỏi 3: ở đoạn b của Fröhlicher Landmann, tay phải giữ nốt giai điệu
    bằng ngón 4–5 trong khi ngón 1–3 đánh hợp âm nhỏ."
  loai: cau-truc
- trang: piano/tac-pham/schumann-album
  id: n75
  cau: "Mục Nguồn: Ernst Herttrich, lời tựa ấn bản Album für die Jugend op. 68, G.
    Henle Verlag, 2007 (sổ chi tiêu, lịch sử xuất bản, Haus- und Lebensregeln)."
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n76
  cau: "Mục Nguồn: Bernhard R. Appel, chuyên khảo về Album für die Jugend (1998)."
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n77
  cau: 'Mục Nguồn: Wikipedia "Album for the Young" (danh sách 43 bài và giọng);
    Robert Schumann, Musikalische Haus- und Lebensregeln (in kèm album từ năm
    1850).'
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n78
  cau: "Mục Nguồn: bản dàn trang theo ấn bản Peters (giấy phép CC BY-SA 2.5) tại
    Mutopia Project."
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n66
  cau: "Erster Verlust: học hát legato trong giọng thứ, không đánh mạnh nốt cao
    nhất, kết thật nhỏ."
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-album
  id: n74
  cau: "Câu hỏi 4: tập staccato của Wilder Reiter bằng cổ tay, ngón sát phím, tập
    chậm và nhỏ trước."
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-album
  id: n54
  cau: Kế hoạch 5 tuần, khoảng 30 phút mỗi ngày, với tốc độ máy đếm nhịp từng tuần
    (tốc độ cuối chỉ là gợi ý).
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n1
  cau: Bài là một giai điệu Sol thứ hát chậm rãi trên nốt Sol trầm ngân dài.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n2
  cau: Bài nằm trong Album cho thiếu nhi Tchaikovsky viết năm 1878 "theo kiểu
    Schumann".
  loai: nam
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n3
  cau: Bài dài 32 ô nhịp, một giai điệu vang lên ba lần.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n5
  cau: Giai điệu đi chậm, nhiều nốt dài, có nốt nhắc lại dưới dấu luyến.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n6
  cau: Cantabile nghĩa là "như hát".
  loai: dinh-nghia
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n7
  cau: Trên piano, nốt nào cũng tắt dần ngay sau khi đánh.
  loai: dinh-nghia
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n8
  cau: "Tay trái đoạn A: ngón 5 giữ Sol trầm qua nhiều ô (dấu nối), trong khi các
    ngón khác chơi một giọng giữa có dấu luyến riêng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n9
  cau: Đây là bước đầu để chơi hai bè trong một bàn tay.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n12
  cau: Ở đầu đoạn B, tay phải hát legato trong khi tay trái rải hợp âm staccato.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n13
  cau: "Giai điệu A vang lên ba lần: p, pp, rồi p sau đoạn giữa."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n14
  cau: Album for the Young Op. 39 (1878) là tập 24 bài đơn giản "à la Schumann".
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n16
  cau: Cầu nguyện buổi sáng là bài số 1 của tập.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n17
  cau: 'Giữa tập có nhóm "bài hát nước ngoài": Bài ca Ý (số 15), Bài ca Pháp cổ
    (số 16), Bài ca Đức (số 17), Bài ca Napoli (số 18).'
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n18
  cau: Tựa tiếng Nga Старинная французская песенка nghĩa là "bài hát Pháp xưa".
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n19
  cau: Chữ песенка là dạng thân mật của "bài hát" (песня), như "bài hát nhỏ".
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n20
  cau: Tchaikovsky dùng lại chủ đề này trong bài hát của những người hát rong
    (minstrel) ở hồi II vở opera Орлеанская дева (Trinh nữ xứ Orléans).
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n21
  cau: Vở Trinh nữ xứ Orléans viết không lâu sau Album cho thiếu nhi.
  loai: nam
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n22
  cau: Thứ tự các bài trong bản thảo của Tchaikovsky khác bản in đầu tiên ở vài chỗ.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n23
  cau: Bài số 16 đứng thứ 16 trong cả bản in đầu lẫn bản thảo, nên "Op. 39 số 16"
    là cách gọi chắc chắn.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n24
  cau: Một số bài mang số khác nhau giữa các ấn bản; trong tuyển tập và sách thi
    bài có thể mang số riêng của cuốn sách.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n26
  cau: Giọng giữa của tay trái đi Si♭ – Đô – Rê – Đô.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n27
  cau: Ở đoạn B, tay trái đổi sang hợp âm rải nảy; giai điệu leo lên điểm cao nhất
    rồi lắng xuống.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n28
  cau: "Đoạn A (lấy đà và ô 1–8): p; giai điệu vươn từ Rê lên Sol rồi đứng trên
    Rê, chạm Mi♭; tay trái giữ Sol trầm, giọng giữa Si♭ – Đô – Rê – Đô; ô 7 hợp
    âm Rê bảy, ô 8 kết ở Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n29
  cau: "Đoạn A lần hai (ô 9–16): pp; nguyên văn như lần đầu; ô 16 dừng trên hợp âm
    Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n30
  cau: "Đoạn B, nửa đầu (ô 17–20): p; tay trái hợp âm rải staccato (Đô thứ, rồi Rê
    bảy); giai điệu Sol – Sol – La – Si♭ đi lên; to dần từ ô 20."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n31
  cau: "Đỉnh (ô 21–22): tay trái liền lại; giai điệu lên Rê, rồi Mi♭ – Fa ở ô 22,
    mf: nốt cao nhất bài."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n32
  cau: "Kết đoạn B (ô 23–24): nhỏ dần, dừng trên hợp âm Rê trưởng (át âm)."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n33
  cau: "Đoạn A trở lại (ô 25–32): p; ở hai ô cuối, tay phải có thêm một bè dưới,
    bè trầm đi Đô – Rê – Sol về hợp âm Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n34
  cau: "Bảng Cấu trúc, đoạn A (lấy đà, 1–8): p; Sol thứ trên âm nền Sol; Rê bảy (ô
    7), kết trọn ở Sol thứ (ô 8); Sol trầm đánh lại ở phách 2 các ô 2, 4, 6."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n35
  cau: "Đoạn A thứ hai (9–16): pp, nhắc lại nguyên văn; ô 16 dừng trên hợp âm Sol
    thứ nốt trắng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n36
  cau: "Đoạn B (17–24): p; to dần (ô 20–21), mf (ô 22), nhỏ dần (ô 23–24); Đô thứ
    (ô 17–19), Rê bảy (ô 20), Sol thứ (ô 21), Đô thứ (ô 22), dừng trên Rê trưởng
    (kết nửa, ô 24); giai điệu lên Fa5 ở ô 22."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n37
  cau: "Đoạn A cuối (25–32): p; ô 31 Đô – Rê ở bè trầm, ô 32 Sol thứ; ô 31–32 tay
    phải thêm bè dưới Mi♭ – Rê, rồi Si♭."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n38
  cau: Bản nhạc không ghi chậm lại ở cuối.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n39
  cau: "Hình dạng A A B A, mỗi đoạn 8 ô, là kiểu ba đoạn có tái hiện quen thuộc
    của ca khúc: một giai điệu, nhắc lại, một đoạn tương phản, rồi giai điệu trở
    về."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n40
  cau: Fa♯ trong hợp âm Rê là cảm âm của Sol thứ.
  loai: dinh-nghia
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n42
  cau: Nốt nhạc, dấu luyến và sắc thái của khuông đoạn A theo bản Mutopia (ấn bản
    Schirmer, 1904); số ngón là gợi ý của trang.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n43
  cau: "Tay trái viết thành hai bè như trong bản nhạc: bè trên là giọng giữa, bè
    dưới là nốt Sol ngân; nốt Rê cuối cùng là nhịp lấy đà vào lần nhắc lại, đã ở
    pp."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n44
  cau: "Tay phải: ngón 1 trên Rê lấy đà, ngón 2 trên Sol, rồi luồn ngón cái sang
    La; bàn tay nằm yên trong thế La – Mi♭ (ngón 1 đến 5) đến hết ô 6, Mi♭5 luôn
    là ngón 5."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n45
  cau: Ô 7, sau nốt La dài, ngón 2 vắt qua ngón cái xuống Sol móc kép; Sol ở ô 8
    là cùng phím ấy.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n46
  cau: "Tay trái: ngón 5 giữ Sol trầm, chỉ nhấc lên để đánh lại ở phách 2 các ô 2,
    4 và 6; ở ô 4 và 6, nốt Sol cuối của giọng giữa trùng phím với nốt Sol trầm
    đánh lại."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n47
  cau: Ô 7, bản nhạc ghi một dấu to dần – nhỏ dần nhỏ (espressivo) trên nốt Đô của
    giọng giữa; nốt ấy biến hợp âm thành Rê bảy.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n48
  cau: Ô 8, bè trầm nhảy xuống Sol thấp, staccato.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n49
  cau: "Bốn phím của tay trái ở ô 1: Sol3 giữ bằng ngón 5, Si♭3 – Đô4 – Rê4 bằng
    ngón 3-2-1."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n53
  cau: "Bài tập 1: ô 1–4 chỉ tay trái, ngón 5 giữ Sol, chỉ đánh lại ở phách 2 của
    ô 2 và 4 như trong bài; ô 5–8 lặp lại, thêm tay phải hát to hơn một bậc."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n55
  cau: "Bài tập 2: tay trái ngón 5 đánh nốt trầm rồi cả bàn tay nảy lên ba nốt
    trên (3-2-1); tay phải hát legato bốn ô, to dần đến Mi♭ rồi nhỏ dần; đây là
    kết cấu nửa đầu đoạn B; không dùng bàn đạp."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n56
  cau: "Bài tập 3 gom các chi tiết giai điệu của bài: nhịp lấy đà quãng bốn, nốt
    dài rồi nốt nhắc lại, hai móc kép, nốt chấm dôi kép; ở ô 4 Fa♯ kéo qua bảy
    móc kép và Sol rơi vào móc kép cuối, như La – Sol ở ô 7 của bài."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n59
  cau: Chỉ dẫn tốc độ là Molto moderato, nhịp 2/4.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n61
  cau: Mỗi câu tám ô đi từ nốt lấy đà Rê lên Sol rồi Rê5, chạm Mi♭5 ở ô 3 và 5,
    rồi đi xuống ở ô 6–7 về Sol.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n63
  cau: "Sắc thái theo bản Schirmer (qua Mutopia): p ở đầu bài; pp cho lần A thứ
    hai; p ở đầu đoạn B, to dần qua ô 20–21 đến mf ở ô 22, nhỏ dần từ giữa ô 23,
    rồi p cho lần A cuối."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n65
  cau: Bản nhạc trên Mutopia không ghi bàn đạp.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n68
  cau: Đoạn trích trên trang theo bản Schirmer 1904, không phải bản in đầu tiên;
    các ấn bản có thể khác ở chỉ dẫn tốc độ (Molto moderato hay Moderato assai),
    dấu luyến và dấu sắc thái.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n71
  cau: Trong Op. 39, Búp bê ốm là số 6; Bài ca Ý (số 15) và Bài ca Đức (số 17)
    đứng cạnh bài này.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n74
  cau: "Câu hỏi 1: bài có hình thức A A B A, mỗi đoạn 8 ô, tổng cộng 32 ô; đoạn A
    vang lên ba lần (p, pp, rồi p sau đoạn B); đoạn B dừng trên hợp âm Rê để đưa
    về A."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n75
  cau: "Câu hỏi 2: ở đoạn A, ngón 5 tay trái giữ nốt Sol trầm qua các dấu nối, chỉ
    đánh lại ở phách 2 của ô 2, 4 và 6; ba ngón còn lại chơi giọng giữa."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n76
  cau: 'Câu hỏi 3: "Op. 39 số 16" đáng tin vì bài đứng thứ 16 cả trong bản in
    Jurgenson 1878 lẫn trong bản thảo; thứ tự trong bản thảo khác bản in ở vài
    bài khác.'
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n77
  cau: "Câu hỏi 4: ở ô 17–20 tay phải legato, tay trái hợp âm rải staccato."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n78
  cau: "Mục Nguồn: Tchaikovsky Research \"Children's Album\" cho thời gian sáng
    tác và chép sạch, lời đề tặng, lần in đầu (Jurgenson, Moskva, tháng
    10/1878), danh sách 24 bài theo thứ tự bản in và bản thảo, Molto moderato và
    32 ô của số 16, việc dùng lại chủ đề trong Trinh nữ xứ Orléans."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n79
  cau: "Mục Nguồn: bản dàn trang công cộng Old French Song, Op. 39 No. 16 tại
    Mutopia (David McNamara; nguồn Schirmer, 1904; Mutopia-2015/11/27-2080)."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n4
  cau: Toàn bộ nghệ thuật nằm ở chỗ để tay phải hát, còn tay trái với hai bè của
    nó chỉ thì thầm bên dưới.
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n69
  cau: Danh sách "Lỗi thường gặp" (bảy dòng).
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n60
  cau: "Molto moderato trong 2/4: chậm vừa, mỗi ô vẫn là hai bước; khoảng ♩ =
    54–66 là vùng hợp lý."
  loai: khuyen-tap
