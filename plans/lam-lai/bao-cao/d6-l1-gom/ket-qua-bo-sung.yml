- trang: piano/tac-pham/mozart-minuet-k2
  id: n24
  luot_2: dung
  nguon:
    - "https://www.cnrtl.fr/definition/galant/adjectif"
    - "https://web.archive.org/web/2024/https://www.merriam-webster.com/dictionary/galant%20style"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/galant-schemas/"
    - "https://www.henle.de/Piano-Pieces-from-the-Nannerl-Music-Book/HN-1236"
  ghi_chu: "TLFi (CNRTL), tính từ galant: 'qui sait plaire en société par l'élégance de son allure et la politesse raffinée de ses manières'; mục MUS.: 'qui a un caractère mondain, léger et brillant', style galant nằm giữa lối viết nghiêm của đầu thế kỷ 18 và phong cách các nhà cổ điển lớn. Merriam-Webster: 'a light and elegant free homophonic style of musical composition in the 18th century'. OMT (Galant Schemas): khuôn mẫu của nhà soạn nhạc thế kỷ 18 'in the Galant style'. Trang Henle HN 1236, phần tiểu sử Mozart: từ 1782 ông đưa 'learned style' vào tác phẩm 'beside the galant style', tức lối galant là nền từ trước. 'Kiểu cung đình' hơi hẹp hơn 'mondain' (giới thượng lưu) của TLFi, nhưng không sai về ý."
- trang: piano/tac-pham/musette-re
  id: n52
  luot_2: dung
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16713851/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC8939780/"
    - "https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf"
    - "https://www.mutopiaproject.org/ftp/BachJS/BWVAnh126/anna-magdalena-22/anna-magdalena-22.ly"
  ghi_chu: "Sakai và cộng sự 2006 (J Hand Surg Am, PubMed 16713851): quãng tám và hợp âm chiếm 74% kỹ thuật người bệnh đang tập khi bắt đầu bị chấn thương do dùng quá mức. PLoS One 2022 (PMC8939780): chơi quãng tám dồn tải lên vùng mu cẳng tay; chấn thương nghề của nghệ sĩ piano chủ yếu ở cổ tay và cẳng tay, thường do dùng quá mức. Factsheet BAPAM 'The Healthy Pianist': 'practise minimising tension between repetitive octaves', mở bàn tay tự nhiên từ cổ tay mềm, phối hợp cổ tay và cánh tay thay vì gồng duỗi ngón. Xoay cẳng tay giữa ngón 5 và ngón 1 là cách dạy phổ biến; các nguồn y khoa không nói riêng về nó nhưng hợp các nguyên tắc trên. Bè trầm quãng tám Rê2–Rê3 liên tục: xác nhận trên bản Mutopia (ô 1–2, 5–6)."
- trang: piano/tac-pham/musette-re
  id: n84
  luot_2: dung
  nguon:
    - "https://crosseyedpianist.com/wp-content/uploads/2016/08/thehealthypianist_bapamfactsheet.pdf"
    - "https://pubmed.ncbi.nlm.nih.gov/16713851/"
  ghi_chu: "Như n52: BAPAM khuyên giảm căng giữa các quãng tám lặp lại, dùng chuyển động cánh tay và cổ tay phối hợp, dùng lực vừa đủ. Tay trái nhỏ hơn giai điệu là cân bằng tiếng thông thường. Không có ý nào có hại."
- trang: piano/tac-pham/musette-re
  id: n47
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý. Bản Mutopia: tay trái quãng tám d8 d' từ Rê2 (relative c,); ô 3–4 hai tay chơi cùng nét Fa♯–Sol–La–Sol–Fa♯ cách quãng tám, nên ngón 3-4-5-4-3 và 3-2-1-2-3 là ngón đối xứng (soi gương)."
- trang: piano/tac-pham/schumann-album
  id: n18
  luot_2: dung
  nguon:
    - "https://www.henle.de/media/56/17/85/1690886059/0045-1690886059-sync.pdf"
  ghi_chu: "Lời tựa Henle HN 45 (bản tiếng Đức): 'Schuberth ließ 1850 in der ersten August-Nummer der Zeitschrift Signale für die musikalische Welt folgende Anzeige abdrucken: … dass binnen Jahresfrist von diesem Album, ungeachtet des starken Preises von 3 Thlr., eine Auflage von nahe an 2000 Exempl. Absatz gefunden hat'. Bản tiếng Anh cùng file dịch 'almost 2,000 copies'. Khớp: số đầu tháng 8 năm 1850, nhà xuất bản (Schuberth) quảng cáo, trong vòng một năm, gần 2.000 bản."
- trang: piano/tac-pham/schumann-album
  id: n56
  luot_2: dung
  nguon:
    - "https://api.digitale-sammlungen.de/iiif/image/v2/bsb11108083_00009/full/1000,/0/default.jpg"
    - "https://api.digitale-sammlungen.de/iiif/presentation/v2/bsb11108083/manifest"
    - "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Album_f%C3%BCr_die_Jugend_%3B_Kinderscenen_-_op._68_-_op._15_-_%28f%C3%BCr_Pianoforte%281900%29_--_BY-NLB-br0000200545_--_6338822.pdf/page8-960px-Album_f%C3%BCr_die_Jugend_%3B_Kinderscenen_-_op._68_-_op._15_-_%28f%C3%BCr_Pianoforte%281900%29_--_BY-NLB-br0000200545_--_6338822.pdf.jpg"
    - "https://www.mutopiaproject.org/ftp/SchumannR/O68/schumann-op68-01-melodie/schumann-op68-01-melodie.ly"
    - "https://www.henle.de/media/90/21/08/1697725681/0045-1697725681-sync.pdf"
  ghi_chu: "Bản quét BSB bsb11108083 (Schuberth, Hamburg, [1848], ghi 'Erstausg.', bìa '40 Clavierstücke für die Jugend'): trang Melodie (ảnh 9) chỉ có tiêu đề 'MELODIE.' rồi khuông, không có chỉ dẫn tốc độ; trang sau Soldatenmarsch có 'Munter und straff.', nên bản in có in chỉ dẫn khi có. Edition Peters 7000 (Dörffel; bản Commons, trang 8): '(Nicht schnell.)' trong ngoặc ở đầu Melodie. Mutopia, nguồn 'Peters' (bản tiếng Pháp): 'pas vite'. Phần Bemerkungen của Henle HN 45 không ghi chỉ dẫn tốc độ nào của nguồn cho số 1. 'Nicht schnell' = không nhanh (schnell: nhanh). Thêm: bản Schuberth/Klauser 1867 (archive.org b26976821) cũng không ghi tốc độ."
- trang: piano/tac-pham/schumann-album
  id: n72
