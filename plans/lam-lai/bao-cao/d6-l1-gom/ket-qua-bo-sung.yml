  ghi_chu: "Cách nghe hợp lý, hợp cách dạy phổ biến."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n69
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý, không có hại. Đối chiếu nhanh bản Mutopia (Schirmer 1904): nhịp 2/4, nốt lấy đà Rê, Rê nhắc lại cuối ô 2 và 4, ô 6 'd ees16 d c8 bes' (hai móc kép), ô 7 'a4.. g16' (La đen chấm dôi kép), pp ở lần nhắc; khớp các chi tiết câu nêu."
