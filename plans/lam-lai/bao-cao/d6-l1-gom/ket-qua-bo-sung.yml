    - "https://www.mutopiaproject.org/ftp/SchumannR/O68/schumann-op68-01-melodie/schumann-op68-01-melodie.ly"
  ghi_chu: "Như n56: bản in đầu (BSB) không ghi tốc độ ở Melodie; Peters in '(Nicht schnell.)' trong ngoặc, bản Peters tiếng Pháp (Mutopia) 'pas vite'. Nghĩa 'không nhanh', không phải 'chậm'."
