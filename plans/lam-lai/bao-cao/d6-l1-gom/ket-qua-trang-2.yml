  ghi_chu: 'Henle: Wolfgang nhận cuốn sổ của chị khi lên bốn; Nannerl hơn em "viereinhalb Jahre". Jahn: "Wolfgang learned from this book. The following note is appended by his father…" (Leopold ghi lại bài con học được).'
