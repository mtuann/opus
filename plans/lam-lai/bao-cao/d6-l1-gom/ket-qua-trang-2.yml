  ghi_chu: 'NDB: Leopold bỏ dạy violin và sáng tác "um alle von seinem Dienste freye Zeit auf die musikalische Erziehung dieser zwey Kinder zu wenden"; Henle HN 1236: Leopold làm sổ cho Nannerl học đàn phím, Wolfgang học từ cùng cuốn sổ.'
- trang: piano/tac-pham/mozart-minuet-k2
