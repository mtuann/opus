  ghi_chu: 'Đếm trên bản Mutopia (Breitkopf & Härtel, Mozarts Werke Serie XXII, plate W.A.M. 2.4). Phách 1 các ô 4 (Mi trên Fa), 8 (La trên Đô), 12 (Fa♯ trên Sol), 16, 20 (Mi trên Rê), 24 là nốt trắng (hai phách) không thuộc hợp âm, giải ở phách 3. PTNA (大井和郎): "非和声音...6箇所...いずれも稽留音" ở các ô 4, 8, 12, 16, 20, 24.'
