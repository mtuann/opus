  ghi_chu: 'NDB (Leopold Mozart): từ 1747 là Violinist chính thức của Salzburger Hofkapelle, 1757 "Hof- und Cammer-Componist", 1763 Vizekapellmeister; phần ADB ghi "Kapelle des Erzbischofs".'
- trang: piano/tac-pham/mozart-minuet-k2
  id: n16
  luot_2: dung
  nguon:
  - "https://www.gutenberg.org/ebooks/43411"
  ghi_chu: 'Otto Jahn, Life of Mozart, quyển 1 (Gutenberg #43411) dẫn ghi chú của Leopold: "This minuet and trio were learned by Wolfgangerl in half-an-hour, at half-past nine at night, on January 26, 1761, one day before his fifth year." Chưa tìm được bản gốc trong NMA trên mạng.'
