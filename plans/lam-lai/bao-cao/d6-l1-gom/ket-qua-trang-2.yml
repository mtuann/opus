  cau_dung: 'Chỗ khó: tay trái rơi quãng tám ở ô 3 (Đô4 xuống Đô3, trong thời gian một nốt đen); ở ô 4 và ô 8 tay trái đi xuống một quãng tám qua nốt giữa (Fa3 – Đô3 – Fa2; Đô4 – Sol3 – Đô3).'
