  ghi_chu: 'Henle HN 1236: Nannerl học đàn "im Alter von etwa acht Jahren", Leopold đóng sổ, ghi "…Maria Anna Mozart 1759"; các bài "bald schwerer und länger". Köchel online: "Music book for Maria Anna (Nannerl) Mozart. 1759". Lưu ý: Henle nói những bài đầu do Joseph Richard Estlinger chép, sau đó mới tới Leopold.'
- trang: piano/tac-pham/mozart-minuet-k2
  id: n20
  luot_2: dung
