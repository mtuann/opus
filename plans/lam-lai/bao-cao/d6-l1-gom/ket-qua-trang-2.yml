  ghi_chu: 'NDB: "1756 war M.s pädagogisch-theoretisches Hauptwerk, der ''Versuch einer gründlichen Violinschule'', erschienen, der seinen bleibenden Ruhm begründete."'
- trang: piano/tac-pham/mozart-minuet-k2
