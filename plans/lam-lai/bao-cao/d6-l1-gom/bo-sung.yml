- trang: piano/tac-pham/mozart-minuet-k2
  id: n24
  cau: 'Phong cách galant: chữ galant nghĩa là "lịch lãm, kiểu cung đình"; đó là lối viết thế kỷ 18 mà Mozart thời đầu ưa dùng.'
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n52
  cau: "Bè trầm quãng tám: đập quãng tám liên tục dễ làm cứng cổ tay, mỏi, to và nặng, hoặc lệch nhịp; bàn tay mở sẵn quãng tám, xoay nhẹ cẳng tay từ ngón 5 sang ngón 1 thay vì nhấc cả tay; tập riêng tay trái với máy đếm nhịp."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n84
  cau: "Câu hỏi 4: cách tập bè trầm quãng tám: bàn tay mở sẵn quãng tám, xoay nhẹ cẳng tay giữa ngón 5 và ngón 1, tay trái nhỏ hơn giai điệu; xoay cẳng tay giữ sức và giữ đều."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n47
  cau: "Tay trái: ngón 5 trên Rê2, ngón 1 trên Rê3, bàn tay giữ độ mở quãng tám; ô 3–4 hai tay soi gương: tay phải 3-4-5-4-3, tay trái 3-2-1-2-3."
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-album
  id: n18
  cau: Tháng 8 năm 1850, nhà xuất bản quảng cáo rằng chỉ trong vòng một năm album đã bán được gần 2.000 bản.
  loai: so-lieu
- trang: piano/tac-pham/schumann-album
  id: n56
  cau: 'Bản in đầu (Schuberth, 1848) không ghi chỉ dẫn tốc độ cho Melodie; nhiều ấn bản về sau thêm Nicht schnell (bản Peters: pas vite), có bản in trong ngoặc, là chỉ dẫn của người biên tập; chữ ấy nghĩa là "không nhanh", không phải "chậm".'
  loai: ten
- trang: piano/tac-pham/schumann-album
  id: n72
  cau: 'Câu hỏi 2: nhiều ấn bản ghi Nicht schnell ở đầu Melodie (người biên tập thêm; bản in đầu không ghi); chữ ấy nghĩa là "không nhanh", không có nghĩa là "chậm".'
  loai: ten
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n25
  cau: "Cách nghe: hai, ba bản thu, nghe trọn nhóm số 15–18; năm câu hỏi (mấy lần A, nốt Sol trầm, giọng giữa, đoạn B, tốc độ)."
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n69
  cau: "Lỗi thường gặp: đếm bốn móc đơn nặng như nhau thay vì hai phách; giọng giữa to bằng giai điệu, hay nốt Sol trầm bị nhấc sớm; nhấn nốt lấy đà Rê và nốt Rê nhắc lại ở ô 2, 4; hai móc kép ở ô 6 thành móc đơn, La chấm dôi kép ở ô 7 bị cắt ngắn; lần pp nhỏ đến mức có nốt không kêu; ô 17–20 tay trái nặng, dính bàn đạp hay kéo tay phải mất legato; chậm lại ở cuối mỗi đoạn A."
  loai: khuyen-tap
