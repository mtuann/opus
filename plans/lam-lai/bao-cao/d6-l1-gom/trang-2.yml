- trang: piano/tac-pham/mozart-minuet-k2
  id: n1
  cau: Minuet K. 2 có 24 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n2
  cau: Mozart nghĩ ra bài khi mới năm, sáu tuổi.
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n3
  cau: Bài được ghi lại trong cuốn sổ nhạc của chị gái Nannerl.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n4
  cau: Bài chỉ có hai bè, không có một hợp âm nào.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n5
  cau: Bài có câu nhạc cân đối, nốt nghịch đặt đúng phách mạnh, và một bất ngờ nhỏ
    (kết lừa) ngay trước khi kết.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n6
  cau: "Đây không phải bản phối giản lược: đó là toàn bộ những gì Mozart viết."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n9
  cau: Bài chia thành những câu 4 ô.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n10
  cau: "Tay trái chỉ chơi một nốt mỗi lúc nhưng là một giọng thật: đi lên, đứng
    yên, rơi xuống quãng tám ở chỗ kết."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n12
  cau: Sáu lần trong bài, phách 1 là một nốt nghịch ngân hai phách rồi mới đi tới
    nốt hợp âm.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n13
  cau: Bài ghé qua Sol thứ, có một kết lừa và một dấu ngân.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n15
  cau: Leopold Mozart là nhạc công violin và nhà soạn nhạc trong dàn nhạc của Tổng
    giám mục Salzburg.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n16
  cau: Một ghi chú nổi tiếng kể rằng Wolfgang học một minuet và trio trong nửa
    giờ, lúc chín giờ rưỡi tối ngày 26 tháng 1 năm 1761, một ngày trước sinh
    nhật năm tuổi.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n17
  cau: Năm 1756, năm Wolfgang ra đời, Leopold xuất bản một cuốn sách dạy violin
    rất có tiếng.
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n18
  cau: Leopold tự dạy đàn phím cho hai con.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n19
  cau: Năm 1759, Leopold làm cho Nannerl, khi ấy sắp tròn tám tuổi, một cuốn sổ
    nhạc chép tay gồm những minuet và bài nhỏ, xếp dần từ dễ đến khó; ngày nay
    gọi là Nannerl Notenbuch.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n20
  cau: Leopold dùng chính cuốn sổ ấy để dạy cậu em Wolfgang, kém chị gần năm tuổi,
    và ghi bên lề những gì con trai học được.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n21
  cau: Ít lâu sau, Wolfgang tự nghĩ ra những bài nhỏ, chúng được chép vào cùng
    cuốn sổ; những bài đầu tiên ra đời trong năm 1761.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n22
  cau: Minuet K. 2 được ghi ngày tháng 1 năm 1762, ở Salzburg; Mozart sinh ngày 27
    tháng 1 năm 1756, nên khi ấy cậu vừa hoặc sắp tròn sáu tuổi.
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n23
  cau: Có lẽ cậu chưa tự viết nhạc ra giấy được; nhiều khả năng Leopold đã ghi lại
    những gì con trai chơi.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n24
  cau: "Phong cách galant giữa thế kỷ 18: câu ngắn, giai điệu dễ hát, bè trầm giản
    dị."
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-minuet-k2
  id: n25
  cau: Về sau nhiều trang bị tách khỏi cuốn sổ.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n26
  cau: Minuet K. 2 được in lần đầu năm 1828, trong cuốn tiểu sử Mozart của Georg
    Nikolaus Nissen, người chồng sau của Constanze, vợ góa Mozart.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n27
  cau: Chữ K. (hay KV) chỉ danh mục tác phẩm Mozart do Ludwig von Köchel lập năm
    1862.
  loai: danh-muc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n29
  cau: Bài viết cho đàn phím của thời ấy, harpsichord hoặc clavichord.
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n30
  cau: Bản thu trên piano của Alessandro Deljavan, trong album dành cho sổ nhạc
    của Nannerl.
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n31
  cau: Cả bài chỉ dài chừng một phút.
  loai: so-lieu
- trang: piano/tac-pham/mozart-minuet-k2
  id: n34
  cau: "Theo dõi khi nghe, đoạn A (ô 1–8): cặp móc đơn đi lên rồi rơi xuống hai
    nốt đen, ba lần liền, mỗi lần thấp hơn; ô 5–8 đi lên và dừng lơ lửng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n35
  cau: "Đoạn B nửa đầu (ô 9–12): màu tối hẳn đi, nhạc sang Sol thứ."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n36
  cau: "Đoạn B nửa sau (ô 13–16): cùng hình giai điệu, tiếp tục đi xuống từng bậc
    và về Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n37
  cau: "Chủ đề trở lại (ô 17–20): giai điệu mở đầu, nhưng đến ô 20 nhạc rẽ sang
    hợp âm Rê thứ và dừng ở dấu ngân; kết (ô 21–24): chủ đề thêm một lần, kết
    trọn ở Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n38
  cau: "Bảng cấu trúc, câu 1 (ô 1–4): môtip một ô: hai móc đơn đi lên quãng ba,
    rơi xuống quãng sáu, rồi hai nốt đen cùng cao độ; môtip vang ba lần, mỗi lần
    thấp hơn; ô 4 nốt treo Mi trên bè trầm Fa."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n39
  cau: "Câu 2 (ô 5–8): Fa trưởng; kết nửa ở ô 8 (dừng trên hợp âm Đô); giai điệu
    đi lên từ Đô giữa; chùm ba móc đơn ở ô 7; tay trái giữ nốt Đô."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n40
  cau: "B nửa đầu (ô 9–12): sang Sol thứ (Mi♭, Fa♯); hình nốt của ô 1 trong màu
    thứ, mỗi ô thấp hơn một bậc; nốt treo Fa♯ ở ô 12."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n41
  cau: "B nửa sau (ô 13–16): về Fa trưởng (Mi♮ ở ô 15); chuỗi tiếp tục đi xuống; ô
    16 khép lại giống ô 4."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n42
  cau: "A trở lại (ô 17–20): Fa trưởng, kết lừa ở ô 20; giai điệu ô 1–4; bè trầm
    mở đầu bằng La thay cho Fa; ở ô 20 bè trầm đi tới Rê, có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n43
  cau: "Kết (ô 21–24): Fa trưởng, kết trọn; chủ đề lần cuối, khép lại như ô 4."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n44
  cau: Cả bài dựng từ một môtip duy nhất và một kiểu kết duy nhất (nốt nghịch ở
    phách 1, nốt giải ở phách 3).
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n46
  cau: Nốt nhạc của khuông theo ấn bản Breitkopf & Härtel (1878), qua bản dàn
    trang công cộng của Mutopia Project; dấu luyến theo bản ấy; hết ô 8 thì nhắc
    lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n48
  cau: Tay trái ô 1–3 đi lên Fa – La – Si♭ – Đô bằng ngón 5-3-2-1, rồi rơi xuống
    một quãng tám.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n49
  cau: "Chỗ khó: cặp móc đơn luyến rồi rơi quãng sáu (ô 1–3)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n50
  cau: "Chỗ khó: nốt treo ở phách 1 (ô 4, 8, 12, 16, 20, 24); ở các ô này tay trái
    đi xuống (trừ ô 20)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n51
  cau: "Chỗ khó: chùm ba ở ô 7 (hai ô trước là cặp móc đơn, ô 7 có ba nốt trong
    một phách)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n52
  cau: "Chỗ khó: tay trái rơi quãng tám ở ô 3, 4, 8 (Đô4 xuống Đô3, Fa3 xuống Fa2)
    trong thời gian một nốt đen."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n53
  cau: "Chỗ khó: đổi thế tay phải giữa ô 4 và ô 5, từ quanh Fa4 xuống Đô giữa."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n54
  cau: "Chỗ khó: hóa biểu chỉ có Si♭; Mi♭ và Fa♯ xuất hiện ở ô 9–12, rồi Mi♮ trở
    lại."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n58
  cau: "Bài tập 2: ba ô đầu chính là ba chỗ kết của bài (ô 4, ô 8, ô 12); ô cuối
    là cùng động tác ở Rê thứ."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n60
  cau: "Bài tập 3: ô 1 và 2 là ô 5 và ô 7 của bài; ô 3–4 là cùng hình ấy cao lên
    một bậc."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n64
  cau: Bản gốc không ghi tốc độ.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n66
  cau: Bản Breitkopf chỉ ghi dấu luyến cho cặp móc đơn và cho nốt treo cùng nốt
    giải của nó; các nốt đen còn lại không có dấu gì.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n67
  cau: 'Daniel Gottlob Türk, trong sách dạy đàn phím năm 1789, viết rằng nốt không
    đánh dấu được chơi "theo cách thông thường": nhấc ngón sớm hơn trọn giá trị
    một chút.'
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n70
  cau: Bản Breitkopf in dấu ngân ở ô 20; nếu bản của bạn không có, vẫn nên thở nhẹ
    ở đó trước khi chủ đề trở lại.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n71
  cau: "Ở ô 20, tai chờ hợp âm Fa trưởng thì bè trầm lại đi tới Rê: một kết lừa;
    dấu ngân cho người nghe khoảnh khắc nhận ra bất ngờ ấy."
  loai: quy-tac
- trang: piano/tac-pham/mozart-minuet-k2
  id: n72
  cau: Bản gốc không có nốt hoa mỹ; thêm một láy nhỏ ở lần nhắc lại là tùy chọn;
    không dùng bàn đạp.
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n75
  cau: "Cùng cuốn sổ nhạc: Andante Đô trưởng K. 1a, Allegro Si♭ trưởng K. 3,
    Minuet Fa trưởng K. 4 và K. 5, đều có trong tập Wiener Urtext ở trên."
  loai: danh-muc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n78
  cau: "Câu hỏi 1: Minuet K. 2 được ghi ngày tháng 1 năm 1762, ở Salzburg, khi
    Mozart khoảng sáu tuổi (không phải 1756 hay 1764)."
  loai: nam
- trang: piano/tac-pham/mozart-minuet-k2
  id: n79
  cau: "Câu hỏi 1, giải thích: danh mục Köchel ghi tháng 1 năm 1762; nhiều khả
    năng Leopold chép lại, vì cậu bé chưa tự viết nhạc ra giấy."
  loai: lich-su
- trang: piano/tac-pham/mozart-minuet-k2
  id: n80
  cau: "Câu hỏi 2: ô 20 là một kết lừa: bè trầm đi tới Rê thay vì Fa, kèm dấu ngân
    (không chuyển hẳn sang Sol thứ, không có láy rền)."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n81
  cau: "Câu hỏi 2, giải thích: tai chờ hợp âm Fa trưởng nhưng nghe Rê thứ, nên chủ
    đề được chơi thêm một lần (ô 21–24) để kết trọn."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n83
  cau: "Câu hỏi 4: đoạn B (ô 9–16) đi qua Sol thứ rồi về Fa trưởng; Mi♭ và Fa♯ báo
    hiệu Sol thứ ở ô 9–12; Mi♮ ở ô 15 đưa bài về Fa trưởng."
  loai: cau-truc
- trang: piano/tac-pham/mozart-minuet-k2
  id: n84
  cau: "Nguồn: Köchel-Verzeichnis trực tuyến, mục KV 2: ngày tháng, các nguồn chép
    tay, bản in đầu tiên năm 1828; Neue Mozart-Ausgabe IX/27/1 (Bärenreiter,
    1982, Wolfgang Plath)."
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n85
  cau: "Nguồn: Mozarts Werke, Serie XXII (Breitkopf & Härtel, 1878), bản dàn trang
    của Mutopia; Wiener Urtext UT 50262 (Ulrich Leisinger); Türk, Klavierschule
    (1789); Wikipedia Nannerl Notenbuch; IMSLP; tài liệu tham khảo."
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n86
  cau: 'Nguồn: PTNA Piano Encyclopedia, mục "Menuet F-Dur K2": phân tích hình thức
    và các nốt treo.'
  loai: ten
- trang: piano/tac-pham/mozart-minuet-k2
  id: n69
  cau: Bản gốc không ghi sắc thái; gợi ý sắc thái (mf đoạn A, nhỏ và tối hơn ô
    9–12, sáng lại ô 13–16; nốt treo là chỗ đậm nhất).
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-minuet-k2
  id: n74
  cau: Lỗi thường gặp (dính liền hay tách cả cặp móc đơn, nhấn đều ba phách, nốt
    treo nhỏ hơn nốt giải, chùm ba thành móc đơn chấm dôi, quên Mi♭ và Fa♯ ở ô
    9–12 hay mang Fa♯ sang ô 13–14, bỏ dấu ngân, chơi quá nhanh).
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-minuet-k2
  id: n68
  cau: "Điểm xuất phát: nốt đen hơi tách, cặp móc đơn liền, nốt cuối dưới dấu
    luyến nhẹ đi; link Tạo tiếng đàn."
  loai: khuyen-tap
- trang: piano/tac-pham/musette-re
  id: n1
  cau: "Bài bắt chước tiếng kèn túi: tay trái đập đều quãng tám Rê như ống kèn giữ
    một nốt trầm, tay phải hát giai điệu ở phía trên."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n2
  cau: Tay trái giữ một nhịp đập quãng tám gần như suốt bài (không phải hợp âm,
    cũng không phải một bè hát).
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n4
  cau: "Tay phải liên tục chuyển giữa hai vùng: trên cao quanh La5 và ở giữa, ngay
    trên Đô giữa."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n5
  cau: Ở ô 3–4 và 7–8, hai tay chơi cùng một giai điệu, cách nhau một quãng tám.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n6
  cau: "Bài đầy ý lặp lại: ô 2 giống hệt ô 1, ô 5–8 lặp lại ô 1–4, ô 15–16 lặp lại
    ô 13–14."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n7
  cau: Trọn bài, kể cả nhắc lại và da capo, chỉ khoảng một phút.
  loai: so-lieu
- trang: piano/tac-pham/musette-re
  id: n8
  cau: Musette vừa là tên một nhạc cụ, vừa là tên một kiểu bản nhạc.
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n9
  cau: Nhạc cụ ấy, gọi đầy đủ là musette de cour, là một loại kèn túi nhỏ của
    Pháp; người chơi bơm hơi bằng một ống bễ thay vì thổi bằng miệng.
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n10
  cau: Thế kỷ 17–18, musette thịnh hành trong giới cung đình Pháp.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n11
  cau: Như mọi loại kèn túi, musette có những ống kèn chỉ phát một nốt trầm không
    đổi, vang suốt dưới giai điệu (drone).
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n12
  cau: "Âm nền (pedal point): bè trầm giữ hoặc lặp lại một nốt trong khi phía trên
    đổi hòa âm; trên đàn phím, các nhà soạn nhạc bắt chước tiếng musette bằng âm
    nền."
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n13
  cau: Musette (nhạc cụ) bơm hơi bằng ống bễ, thịnh hành ở cung đình Pháp (chỗ sửa).
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n15
  cau: Những bản nhạc mang tên musette thường có tính chất đồng quê và hay nằm
    trong tổ khúc.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n16
  cau: Bach viết Gavotte II trong English Suite số 3 Sol thứ, BWV 808, có tên phụ
    "ou la Musette".
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n17
  cau: Gavotte II của BWV 808 có âm nền Sol ở bè trầm.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n18
  cau: "Bài Rê trưởng này: bè trầm không giữ nốt mà đập quãng tám Rê – Rê bằng móc
    đơn; khi hòa âm đổi, nốt nền đổi: Rê ở đoạn A, La rồi Mi ở đoạn B."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n20
  cau: Bài là số 22 trong cuốn sổ tay thứ hai mà J. S. Bach bắt đầu cho vợ, ca sĩ
    Anna Magdalena Bach, năm 1725.
  loai: danh-muc
- trang: piano/tac-pham/musette-re
  id: n22
  cau: Ngay trước Musette là một minuet ghi rõ "Menuet fait par Mons. Böhm", tức
    của Georg Böhm.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n23
  cau: Vài bài trước nữa là những bản hành khúc và polonaise thường được ghi là
    của Carl Philipp Emanuel Bach, con trai J. S. Bach.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n24
  cau: Nhiều bài trong sổ do chính Anna Magdalena chép, và nhiều bài không ghi tên
    tác giả.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n25
  cau: Riêng Musette thì không rõ tác giả.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n26
  cau: Thế kỷ 19 in Musette như nhạc của Bach; danh mục BWV xếp nó vào phụ lục
    (Anhang, Anh.), cùng nhóm với những bài còn nghi vấn.
  loai: danh-muc
- trang: piano/tac-pham/musette-re
  id: n28
  cau: Bản Bach-Gesellschaft không ghi tốc độ, sắc thái hay dấu luyến.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n29
  cau: Bài có trong nhiều album về sổ tay Anna Magdalena và tuyển tập cho người
    học, trên harpsichord lẫn piano.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n31
  cau: Cùng cuốn sổ tay còn có Aria Sol trưởng, chính là chủ đề của Goldberg
    Variations.
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n33
  cau: "Theo dõi khi nghe, đoạn A (ô 1–8): tay trái đập quãng tám Rê; giai điệu
    chạy xuống từ La cao, vang hai lần; ô 3–4 hai tay chung một giai điệu; ô 8
    kết ở Rê."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n34
  cau: "Đoạn B mở đầu (ô 9–12): bè trầm chuyển lên La; hình Đô♯ – Rê – Mi lặp lại,
    rồi những bước nhảy La – Mi."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n35
  cau: "Bè trầm Mi (ô 13–18): nền chuyển sang Mi; tay phải nhảy qua lại giữa hai
    bè, có Rê♯; ô 17 là chuỗi móc kép quanh nốt Mi."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n36
  cau: "Kết đoạn B (ô 19–20): hình Đô♯ – Rê – Mi vang ở trên rồi vọng lại thấp hơn
    một quãng tám; kết ở La trưởng."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n37
  cau: Đoạn A trở lại (da capo) thường không nhắc lại; bài dừng ở dấu ngân.
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n38
  cau: "Bảng cấu trúc, đoạn A: ô 1–8 có nhắc lại; Rê trưởng; quãng tám Rê (ô 1–2,
    5–6); ô 5–8 lặp lại ô 1–4; ô 8 kết ở Rê với dấu ngân, điểm kết của cả bài."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n39
  cau: "Bảng cấu trúc, B phần 1 (ô 9–12): sang La trưởng, quãng tám La; nhảy La –
    Mi ô 10–11; ô 12 chạy xuống; tay trái dời lên La."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n40
  cau: "Bảng cấu trúc, B phần 2 (ô 13–18): quãng tám Mi, âm nền át của La trưởng;
    tay phải hai bè Mi – Rê♯ – Mi thấp – Rê (nối sang ô sau); ô 17 móc kép quanh
    Mi; Rê♯ rồi Rê♮ trong cùng ô 13 và 15; Sol♯ ở ô 14, 16, 18."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n41
  cau: "Bảng cấu trúc, B kết (ô 19–20): kết ở La trưởng; Đô♯ – Rê – Mi ở trên (ô
    19) rồi thấp hơn một quãng tám (ô 20), hai tay cùng giai điệu."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n42
  cau: Đoạn B kết ở La trưởng, giọng át của Rê trưởng, nên chơi lại đoạn A từ đầu
    và kết ở dấu ngân của ô 8.
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n43
  cau: Bản nhạc có thể ghi "D.C." (Da capo, "từ đầu") hoặc "D.C. al Fine", hoặc
    chỉ có dấu ngân; cách chơi như nhau.
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n45
  cau: 'Âm nền Mi ở ô 13–18 là âm nền át: nhạc "đứng chờ" trên át âm, và tai mong
    được về chủ âm La.'
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n46
  cau: Nốt nhạc của khuông theo ấn bản Bach-Gesellschaft (1894), qua bản dàn trang
    công cộng của Mutopia Project; bản ấy không có dấu luyến hay sắc thái; hết ô
    8 thì nhắc lại từ đầu.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n48
  cau: "Tay phải nhảy hai lần: từ Rê5 xuống Fa♯4 (ô 2 sang ô 3, quãng sáu) và từ
    Rê4 vọt lên La5 (ô 4 sang ô 5, quãng mười hai)."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n49
  cau: "Chỗ khó: móc kép trên móc đơn (ô 1–2, 5–6): mỗi nốt móc đơn của tay trái
    ứng với hai nốt móc kép của tay phải."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n50
  cau: "Chỗ khó: hai tay chung giai điệu ở ô 3–4, 7–8, 20."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n51
  cau: "Chỗ khó: hai bè trong tay phải (ô 13–16): Mi5 – Rê♯5 – Mi4 – Rê5, nhảy
    quãng bảy, có dấu nối sang ô sau; bè trên đi xuống từng nửa cung Mi – Rê♯ –
    Rê – Đô♯."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n55
  cau: "Dấu hóa ở đoạn B: Rê♯ rồi Rê♮ trong cùng ô 13, 15; Sol♯ ở ô 14, 16, 18; ô
    17 Mi – Rê♯ – Đô♯ – Rê♯ hai lần liền."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n58
  cau: "Bài tập 2: mỗi hình nốt vang ở trên (f) rồi được nhắc lại thấp hơn một
    quãng tám (p), như tiếng vọng: đúng điều xảy ra ở ô 19–20 của bài."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n67
  cau: "Một ý lặp lại có thể chơi như tiếng vọng: lần sau nhỏ hơn; trên
    harpsichord hai bàn phím, người chơi có thể đổi sang bàn phím kia; trên
    piano đổi lực tay và màu tiếng."
  loai: lich-su
- trang: piano/tac-pham/musette-re
  id: n70
  cau: Lần đầu và lần nhắc lại, đi tiếp qua ô 8 mà không dừng; dấu ngân chỉ có
    hiệu lực ở lần chơi cuối.
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n72
  cau: Không dùng bàn đạp; bản gốc không có nốt hoa mỹ, chơi đúng như viết là hợp
    phong cách.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n75
  cau: Bach Prelude Đô trưởng BWV 846 kết bằng âm nền át rồi âm nền chủ.
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n77
  cau: 'Để nghe: Gavotte II "ou la Musette" trong English Suite số 3 của Bach;
    danh sách theo cấp: Tác phẩm theo cấp độ.'
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n78
  cau: '"Musette" ban đầu là tên một loại kèn túi nhỏ của Pháp, bơm hơi bằng ống
    bễ (không phải điệu nhảy nhanh của Ý hay kiểu harpsichord nhỏ).'
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n79
  cau: "Câu hỏi 1, giải thích: bản nhạc mang tên musette bắt chước nhạc cụ ấy,
    nhất là nốt trầm vang đều dưới giai điệu; trên đàn phím, đó là âm nền."
  loai: dinh-nghia
- trang: piano/tac-pham/musette-re
  id: n80
  cau: "Câu hỏi 2: ở đoạn B, bè trầm quãng tám đổi từ La (ô 9–12) sang Mi (ô
    13–18)."
  loai: cau-truc
- trang: piano/tac-pham/musette-re
  id: n81
  cau: "Câu hỏi 2, giải thích: Mi là át âm của La trưởng; âm nền Mi chuẩn bị cho
    chỗ kết ở La trưởng (ô 20)."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n82
  cau: "Câu hỏi 3: sau đoạn B phải chơi lại đoạn A vì đoạn B kết ở La trưởng; đoạn
    A trở lại để bài kết ở Rê trưởng, tại dấu ngân của ô 8."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n83
  cau: "Câu hỏi 3, giải thích: đó là lối da capo; khi chơi đoạn A lần cuối, thường
    bỏ dấu nhắc lại."
  loai: quy-tac
- trang: piano/tac-pham/musette-re
  id: n85
  cau: "Nguồn: Neue Bach-Ausgabe, tập V/4 (Bärenreiter, 1957, biên tập Georg von
    Dadelsen)."
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n86
  cau: "Nguồn: ấn bản Bach-Gesellschaft (1894), bản dàn trang công cộng của
    Mutopia Project (người nhập: Allen Garvin)."
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n87
  cau: 'Nguồn: Encyclopaedia Britannica và Concise Oxford Dictionary of Music, mục
    "musette": nhạc cụ và kiểu bản nhạc mang tên ấy.'
  loai: ten
- trang: piano/tac-pham/musette-re
  id: n64
  cau: "Bè trầm: tay trái nhỏ hơn tay phải ít nhất một bậc sắc thái; nốt thấp hơi
    rõ hơn; chơi hơi tách, nảy nhẹ; ngón cái rơi từ sát phím."
  loai: khuyen-tap
- trang: piano/tac-pham/musette-re
  id: n52
  cau: "Bè trầm quãng tám: đập quãng tám liên tục dễ làm cứng cổ tay, mỏi, to và
    nặng, hoặc lệch nhịp; bàn tay mở sẵn quãng tám, xoay nhẹ cẳng tay từ ngón 5
    sang ngón 1 thay vì nhấc cả tay; tập riêng tay trái với máy đếm nhịp."
  loai: khuyen-tap
- trang: piano/tac-pham/musette-re
  id: n54
  cau: Cách tập các chỗ khó khác (đếm "một – và – hai – và", nhìn trước nốt đích,
    khoanh dấu hóa, đọc to tên nốt, ngón 3-2-1-2 cho ô 17).
  loai: khuyen-tap
