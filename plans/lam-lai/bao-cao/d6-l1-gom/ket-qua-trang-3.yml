- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n61
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Rê4 lấy đà → Sol4 La Si♭ Đô → Rê5 (ô 2); Mi♭5 ở ô 3 và 5 (cả móc kép Mi♭5 ở ô 6, trong hình đi xuống); ô 6–7 đi xuống về Sol4."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n63
