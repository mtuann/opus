- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n42
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=2080", "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Mutopia ghi nguồn Schirmer, 1904; file .ly không có số ngón. Việc khuông trên trang khớp từng nốt thuộc phần kiểm khuông nhạc, lượt 2 không mở trang."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n43
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Tay trái hai bè (giọng giữa voiceThree, Sol ngân voiceFour); nốt Rê cuối ô 8 là nhịp lấy đà vào lần nhắc lại, pp đặt ở móc đơn ấy."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n44
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Đối chiếu nốt: ô 1–6 (sau Sol4) chỉ dùng La4–Si♭4–Đô5–Rê5–Mi♭5, vừa năm ngón; bản Mutopia không ghi ngón, cách bấm là gợi ý hợp lý."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n45
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Ô 7 La4 móc đen chấm dôi kép rồi Sol4 móc kép; ô 8 Sol4 cùng phím."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n46
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "bassA: g2~ | g4 g4~: Sol3 đánh lại phách 2 ô 2, 4, 6; giọng giữa ô 4 và 6 là 'bes4 g' (Sol3) trùng phím Sol3 của bè trầm."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n47
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "c'2\\espressivo: Đô4 có dấu espressivo (to dần–nhỏ dần nhỏ) ở ô 7, cùng Fa♯3–Rê3 và La4 thành Rê bảy."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n48
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Ô 8 bè trầm: g4 g,4-. (Sol3 rồi Sol2 staccato)."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n49
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Nốt ô 1: Sol3 (bè trầm), Si♭3–Đô4–Rê4 (giọng giữa). Ngón 5 và 3-2-1 là gợi ý hợp lý, Mutopia không ghi ngón."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n53
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Vế đối chiếu bản nhạc đúng: Sol trầm đánh lại phách 2 ô 2 và 4. Phần còn lại là thiết kế bài tập của trang."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n55
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Kết cấu ô 17–20: tay trái nốt trầm rồi ba nốt trên staccato, tay phải legato; file .ly không ghi bàn đạp."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
  id: n56
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Giai điệu có: lấy đà Rê4→Sol4 (quãng bốn), Rê 4. rồi Rê 8, hai móc kép (ô 6), La 4.. + Sol 16 ở ô 7 (bảy móc kép + một). Phần bài tập là của trang."
- trang: piano/tac-pham/tchaikovsky-bai-ca-phap-co
