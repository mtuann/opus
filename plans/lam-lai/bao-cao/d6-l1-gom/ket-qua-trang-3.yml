  ghi_chu: "Henle và IMSLP: phần hai mang tựa 'Zweite Abtheilung für Erwachsenere' (cho các em lớn hơn); bản thu trên IMSLP cho thấy các bài phần hai dài hơn. 'Khó hơn' là cách hiểu phổ biến của tựa này, không có câu nguồn nói thẳng."
