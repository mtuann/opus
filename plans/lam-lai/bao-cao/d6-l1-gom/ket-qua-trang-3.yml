  ghi_chu: "Lời Clara trong lời tựa Henle (bài tập thường dùng 'quá dở' nên Robert soạn tập bài cho trẻ); danh sách tựa trên IMSLP là các tiểu phẩm có tên, nhân vật (Wilder Reiter, Knecht Ruprecht, Erster Verlust...). Câu mang tính diễn giải, phù hợp nguồn."
