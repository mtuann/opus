  ghi_chu: "Bản thu nhúng trên IMSLP: Melodie 50–84 giây, Wilder Reiter 29–47 giây, Fröhlicher Landmann 38–52 giây. Đúng nếu câu nói về ba bài này; nếu hiểu là mọi bài của album thì không đúng (nhiều bài phần hai 2–3 phút, ví dụ số 30, 32, 35, 39)."
