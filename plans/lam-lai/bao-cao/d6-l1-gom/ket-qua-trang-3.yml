  nguon: ["https://www.henle.de/media/56/17/85/1690886059/0045-1690886059-sync.pdf"]
  cau_dung: "Tháng 8 năm 1850, nhà xuất bản quảng cáo rằng trước cuối năm ấy album sẽ bán được gần 2.000 bản."
  ghi_chu: "Henle: quảng cáo của Schuberth in tháng 8/1850 trên Signale für die musikalische Welt, nói rằng trước cuối năm (1850) sẽ bán gần 2.000 bản. Tức là khoảng hai năm sau bản in đầu (12/1848), và là lời quảng cáo dự kiến, không phải 'trong vòng một năm'."
- trang: piano/tac-pham/schumann-album
