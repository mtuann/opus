  ghi_chu: "IMSLP ghi tựa số 28 'Erinnerung (4 November 1847)'; Henle Bemerkungen: tựa trong bản khắc 'Zur Erinnerung an Felix Mendelssohn Bartholdy / gest. d. 4ten November 1847'. Lưu ý: bài soạn ngày 2/9/1848 (Henle), ngày 1847 là ngày Mendelssohn mất ghi trong tựa."
