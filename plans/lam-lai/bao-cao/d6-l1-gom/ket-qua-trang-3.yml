  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/16OldFrenchSong/16OldFrenchSong.ly"]
  ghi_chu: "Đúng từng vị trí: p đầu bài; pp cho lần A thứ hai; p ô 17; to dần ô 20–21; mf ô 22; nhỏ dần từ phách 2 ô 23; p cho lần A cuối."
