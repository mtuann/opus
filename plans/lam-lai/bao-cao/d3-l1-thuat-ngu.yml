- trang: du-lieu/thuat-ngu/pitch
  id: n1
  cau: "*pitch* (cao độ) là độ cao của một âm: mỗi cao độ là một âm có tần số riêng; tần số cao hơn thì âm cao hơn (C4 và C3 là hai cao độ khác nhau)."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/staff
  id: n1
  cau: "*staff* (khuông nhạc) gồm năm dòng kẻ ngang cách đều; mỗi nốt đặt trên dòng hay trong khe ứng với cao độ của nó."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/staff
  id: n2
  cau: Tiếng Anh–Anh gọi khuông nhạc là *stave*.
  loai: ten
- trang: du-lieu/thuat-ngu/clef
  id: n1
  cau: "*clef* (khóa nhạc) là ký hiệu ở đầu khuông cho biết các dòng và khe của khuông ứng với cao độ nào."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/clef
  id: n2
  cau: "*treble clef* là khóa Sol (ôm lấy dòng Sol, dòng thứ hai từ dưới lên); *bass clef* là khóa Fa (chấm của nó bắt đầu ở dòng Fa, dòng thứ hai từ trên xuống)."
  loai: ten
- trang: du-lieu/thuat-ngu/ledger-line
  id: n1
  cau: "*ledger line* (dòng kẻ phụ) là đoạn dòng ngắn vẽ thêm khi nốt cao hơn hay thấp hơn khuông, để nối dài khuông."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/time-signature
  id: n1
  cau: "*time signature* (số chỉ nhịp): ở nhịp đơn, số trên là số phách trong mỗi ô nhịp, số dưới là hình nốt được tính là một phách."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/measure
  id: n1
  cau: "*measure* (ô nhịp) là một nhóm phách (hai, ba hay bốn phách), các ô nhịp ngăn nhau bằng vạch nhịp."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/measure
  id: n2
  cau: Ô nhịp còn gọi là *bar*, cách gọi thường dùng trong tiếng Anh–Anh.
  loai: ten
- trang: du-lieu/thuat-ngu/beat
  id: n1
  cau: "*beat* (phách) là nhịp đập đều đặn, lặp lại trong âm nhạc."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/interval
  id: n1
  cau: "*interval* (quãng) là khoảng cách giữa hai nốt."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/semitone
  id: n1
  cau: "*semitone* (nửa cung) là quãng nhỏ nhất trong âm nhạc phương Tây; trên piano là từ một phím sang phím liền kề (tính cả phím đen)."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/semitone
  id: n2
  cau: Tiếng Anh–Mỹ gọi nửa cung là *half step*.
  loai: ten
- trang: du-lieu/thuat-ngu/tone
  id: n1
  cau: "*tone* (cung) là quãng bằng hai nửa cung."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/tone
  id: n2
  cau: Tiếng Anh–Mỹ gọi cung là *whole step*.
  loai: ten
- trang: du-lieu/thuat-ngu/scale
  id: n1
  cau: "*scale* (gam) là chuỗi nốt theo một công thức cung, nửa cung cố định; ví dụ gam trưởng đi lên theo cung – cung – nửa cung – cung – cung – cung – nửa cung."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/key
  id: n1
  cau: "*key* (giọng) là giọng trưởng hay giọng thứ của một bản nhạc, gọi theo chủ âm; hóa biểu thu hẹp giọng của bản nhạc còn hai khả năng: một giọng trưởng và giọng thứ song song của nó."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/key-signature
  id: n1
  cau: "*key signature* (hóa biểu) là các dấu thăng hay dấu giáng viết ở đầu bản nhạc, sau khóa và trước số chỉ nhịp."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/accidental
  id: n1
  cau: "*accidental* là dấu viết ngay trước một nốt (bên trái nốt) làm đổi cao độ của nốt ấy: dấu thăng, dấu giáng, dấu bình…; tiếng Việt gọi dấu viết trong bài như vậy (không thuộc hóa biểu) là dấu hóa bất thường."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/tonic
  id: n1
  cau: "*tonic* (chủ âm) là bậc I, nốt đầu tiên của gam."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/dominant
  id: n1
  cau: "*dominant* (át âm) là bậc V của gam."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/leading-tone
  id: n1
  cau: "*leading tone* (cảm âm) là bậc VII của gam, thấp hơn chủ âm nửa cung."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/chord
  id: n1
  cau: "*chord* (hợp âm) là ba nốt (ba lớp cao độ) trở lên vang lên cùng lúc."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/legato
  id: n1
  cau: "*legato* nghĩa là chơi hay hát liền mạch, nối các nốt với nhau."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/legato
  id: n2
  cau: Legato được ghi bằng dấu luyến (đường cong nối các nốt).
  loai: quy-tac
- trang: du-lieu/thuat-ngu/minuet
  id: n1
  cau: "*minuet* (giữ nguyên tên) là một điệu múa; trong giao hưởng và tứ tấu đàn dây thời Cổ điển, minuet cùng trio thường là chương thứ ba."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/minuet
  id: n2
  cau: Minuet là điệu múa có ba phách mỗi ô nhịp (nhịp ba, thường viết 3/4).
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/sonata-form
  id: n1
  cau: "*sonata form* (hình thức sonata) gồm ba phần lớn: trình bày (exposition), phát triển (development), tái hiện (recapitulation)."
  loai: cau-truc
- trang: du-lieu/thuat-ngu/movement
  id: n1
  cau: "*movement* (chương) là mỗi phần, một bản nhạc riêng, của một tác phẩm lớn như giao hưởng hay tứ tấu đàn dây."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/symphony
  id: n1
  cau: "*symphony* (giao hưởng) là tác phẩm nhiều chương cho dàn nhạc."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/symphony
  id: n2
  cau: Giao hưởng (thời Cổ điển) thường có bốn chương.
  loai: so-lieu
- trang: du-lieu/thuat-ngu/fingering
  id: n1
  cau: "*fingering* (số ngón) là các số chỉ ngón tay bấm từng nốt."
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/fingering
  id: n2
  cau: Ngón cái là số 1 ở cả hai tay (rồi ngón trỏ 2, ngón giữa 3, ngón áp út 4, ngón út 5).
  loai: quy-tac
