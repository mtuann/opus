  id: n7
  luot_2: dung
  nguon: ["https://musicbrainz.org/release/179c925e-f6aa-4664-a188-d3245337bc4e", "https://musicbrainz.org/release/d647bdb8-a641-40d2-8da2-a8b414516602", "https://musicbrainz.org/release/0947fb51-95d4-47ac-9bc3-64c117d5a331", "https://enc.piano.or.jp/en/musics/21487"]
