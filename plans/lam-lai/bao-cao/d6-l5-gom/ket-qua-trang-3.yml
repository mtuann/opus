  ghi_chu: "PTNA: theo hình in chìm của giấy, bản thảo được cho là viết mùa hè 1827. Bärenreiter (BA 9648) lại ghi 'In autumn 1827'. Câu đã có 'có lẽ' nên vẫn đúng; review có thể thêm 'hay mùa thu'."
