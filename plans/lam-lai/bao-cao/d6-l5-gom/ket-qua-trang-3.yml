- trang: nghe-nhac/schubert-impromptu
  id: n9
  luot_2: dung
  nguon: ["https://imslp.org/wiki/4_Impromptus,_D.899_(Schubert,_Franz)", "https://imslp.org/wiki/4_Impromptus,_D.935_(Schubert,_Franz)", "https://www.henle.de/en/Impromptus-and-Moments-musicaux/HN-4"]
  ghi_chu: "IMSLP: D.899 và D.935 đều sáng tác 1827, mỗi tập 4 impromptu."
- trang: nghe-nhac/schubert-impromptu
  id: n10
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/1580", "https://www.barenreiter.co.uk/impromptus-op-90-d-899-op-post-142-d-935-piano.html"]
  ghi_chu: "PTNA: tên trên bản thảo bài số 1 do Tobias Haslinger, người lo in, ghi chứ không phải Schubert. Bärenreiter: 'The name of the works probably originated from the publisher Haslinger'."
- trang: nghe-nhac/schubert-impromptu
  id: n11
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/1580", "https://enc.piano.or.jp/en/musics/1586"]
  ghi_chu: "PTNA: Schubert 'numbered the subsequent four pieces as Nos. 5-8', vì muốn Haslinger in cả tám bài."
- trang: nghe-nhac/schubert-impromptu
  id: n12
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/1580", "https://www.henle.de/en/Impromptu-G-flat-major-op.-90-no.-3-D-899/HN-488"]
  ghi_chu: "Câu nhận định. PTNA phân tích các bài như những chương của một sonata, xây rất chặt; Henle: 'consummate works of art'."
- trang: nghe-nhac/schubert-impromptu
  id: n13
  luot_2: dung
  nguon: ["https://imslp.org/wiki/4_Impromptus,_D.899_(Schubert,_Franz)", "https://enc.piano.or.jp/en/musics/1580", "https://www.deutsche-biographie.de/sfz28044.html"]
  ghi_chu: "IMSLP: số 3 và số 4 in năm 1857; PTNA: hai bài còn lại 'had to wait 30 years'. NDB: Carl (1816–68) là con của Tobias Haslinger, điều hành nhà xuất bản một mình từ 1848, nên năm 1857 ông là người in."
- trang: nghe-nhac/schubert-impromptu
  id: n14
  luot_2: dung
  nguon: ["https://www.henle.de/media/34/6e/32/1690886051/0004-1690886051-sync.pdf", "https://enc.piano.or.jp/en/musics/1580", "https://enc.piano.or.jp/en/musics/21487"]
  ghi_chu: "Lời tựa Henle HN 4 (1974): người in đầu tiên tự ý chuyển bài sang Sol trưởng, mỗi ô chỉ còn bốn nốt đen. PTNA ghi 2/2 và Sol trưởng 'for ease of playability'. Hai cách ghi đều là ô 4/2 cắt đôi."
- trang: nghe-nhac/schubert-impromptu
  id: n15
  luot_2: dung
  nguon: ["https://www.henle.de/media/34/6e/32/1690886051/0004-1690886051-sync.pdf", "https://www.henle.de/en/Impromptu-G-flat-major-op.-90-no.-3-D-899/HN-488"]
  ghi_chu: "Henle HN 4: 'in which un-Schubert-like form it has generally been published ever since'. HN 488 in ở giọng gốc và ghi các ấn bản khác hay dịch sang Sol trưởng."
- trang: nghe-nhac/schubert-impromptu
  id: n17
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/half-and-whole-steps/", "https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly"]
  ghi_chu: "Gam Sol♭ trưởng: Sol♭ La♭ Si♭ Đô♭ Rê♭ Mi♭ Fa, năm phím đen. OMT: 'B is also known as C♭'. Hóa biểu solb major trong file Mutopia. OMT trả 403 cho công cụ; đọc bản lưu Wayback của đúng chương này."
- trang: nghe-nhac/schubert-impromptu
  id: n18
  luot_2: dung
  nguon: ["https://www.deutsche-biographie.de/pnd118610961.html"]
  ghi_chu: "Bài ADB trên trang Deutsche Biographie: 'Ueber 600 Lieder hat er…'."
- trang: nghe-nhac/schubert-impromptu
  id: n19
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly", "https://enc.piano.or.jp/en/musics/21487"]
  ghi_chu: "Bản nhạc: giai điệu nốt tròn, nốt trắng ở bè trên; dòng chùm sáu móc đơn liên tục ở bè 2; tay trái quãng rộng ngân dài. PTNA: 'very long-breathed melody… atop the rich texture woven by sextuplets'."
- trang: nghe-nhac/schubert-impromptu
  id: n20
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly"]
  ghi_chu: "Giai điệu (bè 1) và dòng đệm (bè 2) cùng nằm ở khuông trên. Ví dụ ô 1: đệm Si♭3–Rê♭4–Sol♭4 dưới giai điệu Si♭4, giai điệu do ngón ngoài hát. Câu về số ngón là cách bấm thông thường."
- trang: nghe-nhac/schubert-impromptu
  id: n21
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/", "https://www.dictionary.com/browse/andante"]
  ghi_chu: "OMT: số dưới của nhịp là nốt được tính một phách, nên 4/2 là bốn phách nốt trắng. Andante (tiếng Ý) nghĩa đen là 'walking'. OMT trả 403 cho công cụ; đọc bản lưu Wayback của đúng chương này."
- trang: nghe-nhac/schubert-impromptu
  id: n22
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly", "https://enc.piano.or.jp/en/musics/1580"]
  ghi_chu: "Bản nhạc: ô 78–80 đổi hóa biểu sang không dấu, viết bằng dấu thăng (Fa♯), rồi về Sol♭; đoạn giữa đổi giọng nhiều lần."
- trang: nghe-nhac/schubert-impromptu
  id: n23
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/21487", "https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly"]
  ghi_chu: "PTNA: đoạn giữa chuyển sang Mi♭ thứ, mở đầu mạnh, tay trái chùm ba gấp. Bản nhạc: ô 25 f, nốt giai điệu có dấu nhấn, sắc thái đổi liên tục."
- trang: nghe-nhac/schubert-impromptu
  id: n24
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/21487", "https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly"]
  ghi_chu: "PTNA: 'at the end of the middle section, a trill is placed in the low left hand (m. 53)'. Bản nhạc: láy rền trên Sol♭1 ở ô 53, chủ đề trở lại ở ô 55."
- trang: nghe-nhac/schubert-impromptu
  id: n26
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/1580"]
  ghi_chu: "PTNA: 'opens with a forceful striking of G notes, layered in octaves. Following this, a monophonic \"question\" and a harmonized \"answer\"'."
- trang: nghe-nhac/schubert-impromptu
  id: n27
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/1580"]
  ghi_chu: "PTNA: số 2 Mi♭ trưởng, 'scales in triplets run freely throughout'. Câu nói gọn phần A; phần B (Si thứ) không còn chùm ba ở giai điệu."
- trang: nghe-nhac/schubert-impromptu
  id: n28
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/1580"]
  ghi_chu: "PTNA: số 4 'begins in A-flat minor and is composed of arpeggiated chords in the right hand'."
- trang: nghe-nhac/schubert-impromptu
  id: n29
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/en/musics/1586", "https://imslp.org/wiki/4_Impromptus,_D.935_(Schubert,_Franz)", "https://www.henle.de/en/Impromptus-and-Moments-musicaux/HN-4"]
  ghi_chu: "PTNA: tập D 935 'published by Diabelli & Co. in Vienna in April 1839'. IMSLP: số 3 là Theme and 5 variations, Si♭ trưởng."
- trang: nghe-nhac/schubert-impromptu
  id: n30
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly"]
  ghi_chu: "Bản nhạc ô 1–24: pp, dòng chùm sáu, bè trầm ngân; ô 9–12 giai điệu lên tới Fa♭5, hòa âm đổi màu; ô 24 kết ở Sol♭."
- trang: nghe-nhac/schubert-impromptu
  id: n31
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly", "https://enc.piano.or.jp/en/musics/21487"]
  ghi_chu: "Ô 25: Mi♭ thứ, f, bè trầm nhấn (fz); dòng chùm sáu vẫn chạy ở bè giữa (PTNA: 'persistent accompaniment of sextuplets'). Ô 35–53: đổi giọng liên tục (Đô♭, Mi♭ trưởng…)."
- trang: nghe-nhac/schubert-impromptu
  id: n32
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchubertF/D899/SchubertF-D899-3-Impromptu/SchubertF-D899-3-Impromptu.ly"]
  ghi_chu: "Ô 53: láy rền trầm, có cresc. rồi pp; ô 54 dấu ngân; ô 55 chủ đề trở lại; ô 84 ppp; ô 85–86 hợp âm cuối, dấu ngân."
- trang: nghe-nhac/schubert-impromptu
  id: n34
  luot_2: sai
  nguon: ["https://musicbrainz.org/release/0947fb51-95d4-47ac-9bc3-64c117d5a331", "https://musicbrainz.org/release/179c925e-f6aa-4664-a188-d3245337bc4e", "https://musicbrainz.org/release/d647bdb8-a641-40d2-8da2-a8b414516602"]
  ghi_chu: "MusicBrainz: Lupu, Decca Classics 411 711-2; Zimerman, Deutsche Grammophon 423 612-2, ngày 1991-04-05. Bản Brendel năm 1989 (Impromptus Op. 90 & Op. 142) ra ở hãng Philips (422 237-2), không phải Decca. Decca có in lại Brendel (442 543-2, năm 1995), nhưng độ dài track khác, có lẽ là một bản thu khác."
  cau_dung: "Ba bản thu trọn hai tập Impromptu D. 899 và D. 935: Radu Lupu (Decca), Alfred Brendel (Philips, phát hành năm 1989), Krystian Zimerman (Deutsche Grammophon, phát hành năm 1991)."
