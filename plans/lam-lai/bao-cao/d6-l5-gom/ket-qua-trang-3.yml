- trang: nghe-nhac/schubert-impromptu
  id: n5
  luot_2: dung
  nguon: ["https://www.deutsche-biographie.de/pnd118610961.html", "https://imslp.org/wiki/Category:Schubert,_Franz"]
  ghi_chu: "ADB (trang Deutsche Biographie) đặt Schubert ở 'Wendepunkt zweier musikalischer Epochen, der Classik und der Romantik'; IMSLP xếp ông vào cả Classical era lẫn Romantic era. 'Đầu Lãng mạn' hợp với cả hai nguồn."
- trang: nghe-nhac/schubert-impromptu
  id: n6
  luot_2: dung
