  id: n35
  luot_2: dung
  nguon: []
  ghi_chu: "Câu hỏi nghe so sánh, hợp lý."
- trang: nghe-nhac/schubert-impromptu
  id: n33
  luot_2: dung
  nguon: []
  ghi_chu: "Mục câu hỏi nghe; không có điều gì cần nguồn."
- trang: nghe-nhac/schubert-impromptu
  id: n37
  luot_2: dung
  nguon: []
  ghi_chu: "Hợp lý: bài chậm nhưng tay phải phải vừa hát giai điệu vừa rải hợp âm, có quãng tới một quãng tám, và bàn đạp phải tinh."
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n1
  luot_2: dung
  nguon: ["https://www.henle.de/en/Nocturne-E-flat-major-op.-9-no.-2/HN-664", "https://cambridge.org/core/services/aop-cambridge-core/content/view/E860AA113B9A437B92D24048D799BEAE/S1479409822000209a.pdf/john_fields_russian_landscape_and_the_early_nineteenthcentury_piano_nocturne.pdf"]
  ghi_chu: "Henle HN 664: 'among the most beloved works of this genre… Echoing the operatic style, the sensual bel canto melody'. Clark mô tả đệm tay trái lặp lại dưới giai điệu như giọng hát. 'Nổi tiếng nhất' là nhận định chung."
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n4
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O9/chopin_nocturne_op9_n2/chopin_nocturne_op9_n2.ly", "https://www.8notes.com/school/theory/simple_and_compound_meter.asp?show=all"]
  ghi_chu: "Bản nhạc ô 1: mỗi phách nốt đen chấm là một nốt trầm (Mi♭2) rồi hai hợp âm. 12/8 là nhịp kép bốn phách."
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n6
  luot_2: khong-chac
  nguon: ["https://www.dictionary.com/browse/fioritura", "https://www.henle.de/media/f9/f4/b9/1697725710/0233-1697725709-sync.pdf"]
  ghi_chu: "Nghĩa gốc: fioritura là nét trang trí hoa mỹ cho giai điệu, thường do người hát ứng tác như trong opera Ý. 'Không chia đều theo phách' chỉ là cách Chopin ghi những nét ấy (Henle, ô 24: tỉ lệ 4:6 với các nốt móc đơn của bè trầm), không phải định nghĩa. Đề nghị viết: 'Fioritura: nét trang trí hoa mỹ cho giai điệu, bắt chước lối luyến láy của ca sĩ; ở Chopin thường viết bằng nốt nhỏ, xếp thành nhóm không chia đều theo phách.'"
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n8
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O9/chopin_nocturne_op9_n2/chopin_nocturne_op9_n2.ly", "https://musicbrainz.org/release/2fafdcf0-b356-4985-8fa2-e934115bfca5"]
