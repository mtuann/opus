  nguon: ["https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-2/pathetique-2-a4.pdf", "https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-3/pathetique-3-a4.pdf"]
  ghi_chu: "Chương 2 như hồ sơ pathetique-adagio; chương 3: Đô thứ, đoạn xen ô 25–43 ở Mi♭, đoạn giữa từ ô 79 ở La♭ trưởng."
- trang: du-lieu/tac-pham/beethoven-pathetique
  id: n8
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-1/pathetique-1-a4.pdf", "https://www.henle.de/media/fc/b2/b2/1697725861/1348-1697725860-sync.pdf"]
  ghi_chu: "Bản nhạc: Grave (Tempo I) ở đầu phát triển và ở coda; lời tựa Henle dẫn bài phê bình năm 1807: \"The Grave returns within it … twice\". Độ dài trong hình là quy ước minh họa."
