  nguon: ["https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-1/pathetique-1-a4.pdf"]
  ghi_chu: "Bản nhạc: Grave Đô thứ; chủ đề 2 từ ô 51 có Sol♭, Rê♭ (Mi♭ thứ); Grave trở lại (Tempo I) ngay trước phần phát triển; tái hiện Đô thứ; Grave thoáng qua trong coda."
