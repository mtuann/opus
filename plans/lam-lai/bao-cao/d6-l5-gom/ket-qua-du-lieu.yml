  cau_dung: "Hình cấu trúc (hướng dẫn nghe): ba đoạn A (Sol♭ trưởng, giai điệu hát trên dòng đệm chảy đều), B (bắt đầu ở Mi♭ thứ, bè trầm nhấn, chuyển giọng liên tục), A' (Sol♭ trưởng, khép lại rất nhỏ), độ rộng theo số ô gần đúng 24 : 30 : 32 (A' tính cả coda)."
  ghi_chu: "Mô tả ba đoạn đúng, nhưng tỉ lệ độ rộng 2 : 1,6 : 1,8 làm B ngắn hơn A, trái với bản nhạc: A 24 ô (1–24), B 30 ô (25–54), A' 20 ô (55–74) và coda 12 ô; cùng một tốc độ. Theo số ô, B dài nhất."
