  ghi_chu: "Tệp dài 384,52 s (6:24). Lượt 2 phân tích âm thanh: trình bày lặp lại, Grave trở lại khoảng 5:05–5:55, phần phát triển (Mi thứ) bắt đầu khoảng 5:57; tệp dừng đột ngột lúc đang chơi to, khoảng 30 giây vào phần phát triển."
