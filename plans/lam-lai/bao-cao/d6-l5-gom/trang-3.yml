- trang: nghe-nhac/schubert-impromptu
  id: n2
  cau: 'Tên đầy đủ: Impromptu cung Sol♭ trưởng, D. 899 số 3 (Op. 90 số 3), Andante.'
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n3
  cau: Sáng tác năm 1827, có lẽ vào mùa hè.
  loai: nam
- trang: nghe-nhac/schubert-impromptu
  id: n4
  cau: Hai bản đầu của tập được in tháng 12/1827; bản số 3 và số 4 đến năm 1857 mới được in.
  loai: nam
- trang: nghe-nhac/schubert-impromptu
  id: n5
  cau: 'Thời kỳ: Đầu Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n6
  cau: 'Thể loại: tiểu phẩm piano (impromptu).'
  loai: dinh-nghia
- trang: nghe-nhac/schubert-impromptu
  id: n7
  cau: Độ dài khoảng 5–7 phút.
  loai: so-lieu
- trang: nghe-nhac/schubert-impromptu
  id: n8
  cau: Năm 1827 là năm trọn vẹn cuối cùng trong đời Schubert; ông mất tháng 11 năm sau, mới
    31 tuổi.
  loai: nam
- trang: nghe-nhac/schubert-impromptu
  id: n9
  cau: 'Trong năm ấy ông viết hai tập, mỗi tập bốn bản ngắn cho piano: D. 899 và D. 935.'
  loai: nam
- trang: nghe-nhac/schubert-impromptu
  id: n10
  cau: Cái tên Impromptu ("ngẫu hứng") có lẽ do nhà xuất bản Tobias Haslinger đặt cho tập
    đầu (chính ông ghi tên này lên bản thảo bài số 1).
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n11
  cau: Schubert đánh số các bản của tập thứ hai từ 5 đến 8, như thể nối tiếp.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n12
  cau: Tên gọi nghe tùy hứng, nhưng đây là những bản nhạc được xây rất cẩn thận.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n13
  cau: Haslinger in hai bản đầu (Đô thứ và Mi♭ trưởng) ngay cuối năm 1827; bản số 3 và số
    4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được con trai ông,
    Carl Haslinger, in ra.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n14
  cau: Khi ấy bản số 3 bị dịch giọng sang Sol trưởng, và mỗi ô nhịp 4/2 dài bị cắt đôi, để
    bài dễ chơi hơn.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n15
  cau: Suốt nhiều thập kỷ, bài thường chỉ được in ở Sol trưởng; các ấn bản Urtext ngày nay
    đã trả lại giọng gốc.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n17
  cau: 'Gam Sol♭ trưởng: năm phím đen, cộng hai phím trắng là Đô♭ (chính là phím Si) và Fa
    (bàn phím và chú thích).'
  loai: dinh-nghia
- trang: nghe-nhac/schubert-impromptu
  id: n18
  cau: Schubert viết khoảng 600 ca khúc.
  loai: so-lieu
- trang: nghe-nhac/schubert-impromptu
  id: n19
  cau: 'Bản Impromptu hát như một ca khúc: giai điệu dài, rộng, nhiều nốt ngân; bên dưới là
    dòng hợp âm rải chảy đều, gần như không dừng; tay trái giữ bè trầm sâu.'
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n20
  cau: Giai điệu và dòng đệm nằm trong cùng tay phải; các ngón ngoài (chủ yếu 4 và 5) hát
    giai điệu, ngón cái và các ngón trong rải hợp âm.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n21
  cau: Nhịp 4/2 nghĩa là mỗi ô có bốn phách nốt trắng; Andante nên hiểu là "đi" chứ không
    phải "đứng".
  loai: dinh-nghia
- trang: nghe-nhac/schubert-impromptu
  id: n22
  cau: Schubert bất ngờ đổi màu hòa âm, đi sang một giọng xa rồi quay về.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n23
  cau: 'Đoạn giữa bắt đầu ở Mi♭ thứ: tối và căng hơn, những nốt trầm nhấn mạnh, giọng thay
    đổi liên tục.'
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n24
  cau: Gần cuối đoạn giữa có một tiếng láy rền ở âm vực rất trầm trước khi giai điệu Sol♭
    trưởng trở lại.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n26
  cau: Trong tập D. 899, số 1 (Đô thứ) mở bằng nốt Sol quãng tám đánh mạnh, rồi một giai điệu
    một bè được các hợp âm đáp lại.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n27
  cau: Số 2 (Mi♭ trưởng) là dòng chùm ba chạy không nghỉ của tay phải.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n28
  cau: Số 4 (La♭ trưởng, mở đầu ở La♭ thứ) chạy những chuỗi hợp âm rải ở tay phải.
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n29
  cau: Tập D. 935 đến tháng 4 năm 1839 mới được Diabelli in; bản số 3 của tập là một chủ đề
    và biến tấu ở Si♭ trưởng.
  loai: lich-su
- trang: nghe-nhac/schubert-impromptu
  id: n30
  cau: 'Theo dõi khi nghe: mở đầu dòng hợp âm rải chảy đều, bè trầm sâu, giai điệu cất lên
    chậm rãi, nốt ngân dài; giai điệu phát triển, vươn cao hơn, hòa âm đổi màu; phần đầu khép
    lại ở Sol♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n31
  cau: 'Đoạn giữa: Mi♭ thứ, nốt trầm nhấn mạnh, dòng đệm vẫn không dừng; đi xa: chuyển giọng
    liên tục, cao trào của đoạn giữa.'
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n32
  cau: 'Láy rền ở âm vực trầm: nhạc dịu dần, chuẩn bị quay về; phần đầu trở lại; kết: giai
    điệu tan dần, những hợp âm cuối rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/schubert-impromptu
  id: n34
  cau: 'Ba bản thu trọn hai tập Impromptu D. 899 và D. 935: Radu Lupu (Decca), Alfred Brendel
    (Decca, phát hành năm 1989), Krystian Zimerman (Deutsche Grammophon, phát hành năm 1991).'
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n36
  cau: 'Bản này ở mức sau Grade 8: ABRSM đưa bài vào danh sách tác phẩm của bằng ARSM.'
  loai: cap-do
- trang: nghe-nhac/schubert-impromptu
  id: n39
  cau: Muốn một Impromptu Schubert dễ tiếp cận hơn, hãy thử D. 935 số 2 (La♭ trưởng).
  loai: cap-do
- trang: nghe-nhac/schubert-impromptu
  id: n42
  cau: 'Mục Nguồn: IMSLP; ấn bản Urtext Henle, Wiener Urtext, Bärenreiter (Neue Schubert-Ausgabe).'
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n43
  cau: 'Mục Nguồn: Otto Erich Deutsch, Franz Schubert: Thematisches Verzeichnis seiner Werke
    (danh mục "D.").'
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n44
  cau: 'Mục Nguồn: PTNA Piano Encyclopedia, mục D 899: niên đại, bản in năm 1857, nhịp 4/2
    gốc.'
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n45
  cau: 'Mục Nguồn: Brian Newbould, Schubert: The Music and the Man (1997).'
  loai: ten
- trang: nghe-nhac/schubert-impromptu
  id: n35
  cau: 'Nghe cùng một đoạn trong ba bản: ai chơi nhỏ nhất mà giai điệu vẫn hát, ai để dòng
    đệm mỏng nhất, ai giữ câu nhạc rộng và liền nhất?'
  loai: khuyen-tap
- trang: nghe-nhac/schubert-impromptu
  id: n33
  cau: Câu hỏi để nghe chủ động (sáu câu).
  loai: khuyen-tap
- trang: nghe-nhac/schubert-impromptu
  id: n37
  cau: Không nhanh, nhưng tay phải phải làm hai việc cùng lúc, bàn tay nhỏ sẽ vất vả với những
    quãng rộng, và bàn đạp phải rất tinh.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n1
  cau: 'Mô tả và câu mở đầu: bản nocturne nổi tiếng nhất của Chopin là một bài học về nghệ
    thuật hát trên phím đàn: giai điệu dài như giọng ca opera trên lớp đệm tay trái.'
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n4
  cau: 'Tay trái kiểu valse trong nhịp 12/8: mỗi phách lớn là một nốt trầm và hai hợp âm.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n6
  cau: Fioritura là những chùm nốt nhỏ không chia đều theo phách, bắt chước lối luyến láy
    của ca sĩ.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n8
  cau: Bài dài 34 ô nhịp, khoảng bốn đến năm phút.
  loai: so-lieu
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n10
  cau: Henle xếp Nocturne Mi thứ Op. 72 số 1 (di cảo) và Nocturne Đô♯ thứ (di cảo, B. 49)
    ở mức 5.
  loai: cap-do
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n11
  cau: 'Câu cũ: hai nocturne mức 5 "dạy cùng một cách hát nhưng ít trang trí hơn".'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n13
  cau: Nocturne (dạ khúc) không phải do Chopin đặt ra; người khởi xướng thể loại này cho piano
    là John Field.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n14
  cau: John Field là nhà soạn nhạc người Ireland, sống 1782–1837.
  loai: nam
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n15
  cau: 'Câu cũ: bản nocturne đầu tiên của Field in năm 1812.'
  loai: nam
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n16
  cau: 'Khuôn mẫu nocturne của Field: một giai điệu hát ở tay phải trên lớp hợp âm rải rộng
    của tay trái, nhờ bàn đạp mà ngân vang.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n17
  cau: Chopin nhận lấy khuôn mẫu đó rồi phát triển nó xa hơn.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n18
  cau: Chopin rất thích nhạc của Bellini, và khi dạy cách chơi láy quanh, nốt dựa, ông khuyên
    học trò lấy các ca sĩ Ý lớn làm mẫu.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n19
  cau: Bel canto nghĩa là "hát đẹp"; lối hát ấy chuộng những câu hát dài, liền tiếng, và ca
    sĩ thường tự thêm những đường luyến láy vào giai điệu.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n20
  cau: Mỗi lần chủ đề A trở lại, nó được "hát" với nhiều nốt hoa mỹ hơn.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n21
  cau: Op. 9 là bộ nocturne đầu tiên Chopin xuất bản.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n22
  cau: Op. 9 viết trong những năm Chopin rời Warsaw (cuối năm 1830), sống ở Vienna rồi đến
    Paris (1831).
  loai: nam
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n23
  cau: Nhà xuất bản Henle gọi bài số 2 là một trong những nocturne được yêu thích nhất, có
    lẽ cả trong toàn bộ tác phẩm của Chopin.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n24
  cau: Khi chơi và khi dạy bài này, Chopin thêm vào bản in nhiều biến thể trang trí, lớn nhỏ
    khác nhau; nhiều biến thể ông tự tay ghi vào bản nhạc của học trò.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n25
  cau: Ấn bản Wiener Urtext của Jan Ekier in các biến thể ở chú thích (bài này có nhiều biến
    thể nhất trong tập), và với riêng Op. 9 số 2 còn in thêm một phiên bản thứ hai chứa trọn
    các biến thể.
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n26
  cau: Ba câu hỏi khi nghe (hơi thở, tay trái, trang trí); so sánh chủ đề ở ô 1, ô 5, ô 13
    và ô 21.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n27
  cau: Arthur Rubinstein, Claudio Arrau và Maria João Pires đều có bản thu các nocturne của
    Chopin.
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n29
  cau: '"Casta diva" là một aria trong opera Norma của Bellini.'
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n30
  cau: 'Cấu trúc: A ô 1–4, A'' ô 5–8, B ô 9–12, A'''' ô 13–16, B'' ô 17–20, A'''''' ô 21–24,
    coda ô 25–34 (bảng Theo dõi khi nghe và bảng Cấu trúc).'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n31
  cau: 'Chủ đề A: một câu dài trên lớp đệm kiểu valse, đỉnh ở nốt cao.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n32
  cau: Đoạn B (ô 9–12) quanh Si♭ trưởng (giọng át); hòa âm căng hơn, sắc thái rộng hơn.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n33
  cau: A'' (ô 13–16) có trang trí dày hơn, với những chùm nốt nhỏ thật sự khó đầu tiên.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n34
  cau: B' (ô 17–20) là đoạn B trở lại.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n35
  cau: A''' (ô 21–24) là chủ đề lần cuối, trang trí nhiều nhất.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n36
  cau: 'Coda từ ô 25: nhạc dâng lên cao trào lớn nhất của bài; cadenza nhỏ senza tempo, chuỗi
    nốt nhanh trên cao; kết khép lại ở Mi♭ trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n37
  cau: Ô 32 ghi senza tempo (không theo nhịp).
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n38
  cau: Mọi câu nhạc đều dài 4 ô nhịp, trừ hai ô cuối; thứ tự A – A – B – A – B – A.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n39
  cau: 'Bước nhảy tay trái: khoảng cách thường hơn một quãng tám, chỉ có thời gian một móc
    đơn để nhảy.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n47
  cau: 'Cao trào và cadenza ở coda: một hình nốt nhắc đi nhắc lại, dồn dập dần, dễ vỡ tiếng
    và mỏi tay; tập các nhóm nốt đều và chậm trước, dồn tốc độ từng chút, thả lỏng cổ tay
    sau mỗi nhóm.'
  loai: quy-tac
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n52
  cau: Karol Mikuli, học trò của Chopin và về sau là người biên tập các tác phẩm của ông,
    kể rằng khi Chopin co giãn giai điệu, tay đệm vẫn tiếp tục chơi đúng nhịp.
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n53
  cau: 'Học trò của Chopin còn nhớ lời dặn: "Hãy để tay trái làm nhạc trưởng và luôn giữ nhịp".'
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n55
  cau: Nghĩ theo bốn phách lớn mỗi ô; Andante nghĩa là "đi".
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n57
  cau: 'Khi đã thuộc bài, thử một biến thể của chính Chopin (trong ấn bản Wiener Urtext) ở
    lần nhắc lại cuối; đó cũng là cách Chopin làm: mỗi lần một khác.'
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n59
  cau: Phần lớn bài ở p và pp; cao trào lớn nhất nằm ở coda.
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n61
  cau: 'Nocturne khác: Rê♭ trưởng Op. 27 số 2 (Henle mức 6); Đô thứ Op. 48 số 1 và Si trưởng
    Op. 9 số 3 (Henle mức 7).'
  loai: cap-do
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n65
  cau: 'Câu hỏi 1: mỗi lần chủ đề A trở lại, nó được trang trí nhiều hơn; cấu trúc A A B A
    B A và coda, 34 ô nhịp, giống ca sĩ bel canto thêm luyến láy khi hát lại một giai điệu.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n66
  cau: 'Câu hỏi 2: fioritura là những chùm nốt hoa mỹ nhỏ không chia đều theo phách, bắt chước
    lối luyến láy của ca sĩ; chúng nhỏ hơn giai điệu chính, cả chùm lọt vừa phách trong khi
    tay trái giữ nhịp.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n67
  cau: 'Câu hỏi 3: theo lời kể của Karol Mikuli, rubato của Chopin là giai điệu co giãn trong
    khi tay đệm vẫn chơi đúng nhịp.'
  loai: lich-su
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n69
  cau: 'Mục Nguồn: Niecks (Project Gutenberg) về Mikuli, Field, opera Ý; chú giải Ấn bản Quốc
    gia Ba Lan về biến thể; Henle HN 233 (Ewald Zimmermann) cho mức khó; Wiener Urtext (Jan
    Ekier) cho biến thể; IMSLP; tài liệu tham khảo.'
  loai: ten
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n44
  cau: Láy rền, láy quanh trong giai điệu dễ thành tiếng gõ; khi chậm viết ra số nốt, khi
    nhanh giữ nhỏ hơn nốt chính.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n3
  cau: Tiếng piano tắt dần ngay sau khi đánh; muốn giai điệu liền như giọng hát, phải nghe
    đuôi nốt dài và cho nốt sau vào đúng độ to nốt trước còn lại.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-nocturne-op9-2
  id: n68
  cau: 'Câu hỏi 4: tập chùm nốt hoa mỹ bắt đầu từ giai điệu khung, rồi chùm nốt riêng theo
    nhóm nhỏ.'
  loai: khuyen-tap
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n1
  cau: 'Mô tả và mở đầu: giai điệu dài như ca khúc hát chậm rãi trên dòng hợp âm rải chảy
    không ngừng, cả hai nằm trong cùng tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n4
  cau: Bài dài 86 ô nhịp 4/2; tay phải vừa hát giai điệu vừa rải hợp âm.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n7
  cau: Một câu tám ô ở nhịp 4/2 kéo dài khoảng nửa phút.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n9
  cau: 'Năm 1827, năm trọn vẹn cuối cùng của đời mình, Schubert viết hai tập, mỗi tập bốn
    bản: D. 899 và D. 935.'
  loai: nam
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n10
  cau: 'Cái tên Impromptu có lẽ do nhà xuất bản Tobias Haslinger đặt cho tập đầu: chính ông
    ghi tên này lên bản thảo bài số 1.'
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n11
  cau: Haslinger in bài số 1 và 2 ngay cuối năm 1827.
  loai: nam
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n12
  cau: Bài số 3 và 4 phải chờ đến năm 1857, gần ba mươi năm sau khi Schubert mất, mới được
    con trai Tobias, Carl Haslinger, in ra.
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n13
  cau: Lần in năm 1857 dịch bài lên Sol trưởng cho dễ chơi hơn; Henle nhận xét việc dịch giọng
    làm phai màu riêng của bài.
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n15
  cau: Ở Sol♭ trưởng, năm trong bảy nốt của gam là phím đen; chỉ Đô♭ (chính là phím Si) và
    Fa là phím trắng.
  loai: dinh-nghia
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n16
  cau: Nếu bản nhạc ở Sol trưởng, đó là bản theo lần in 1857; nên đổi sang bản Urtext ở giọng
    gốc (link Hóa biểu, Dịch giọng).
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n17
  cau: 'Bàn phím và chú thích: thế tay phải của ô 1 là dòng đệm Si♭3 – Rê♭4 – Sol♭4 dưới nốt
    giai điệu Si♭4, tất cả là phím đen, gọn trong một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n18
  cau: 'Schubert ghi nhịp 4/2: mỗi ô bốn phách nốt trắng; dòng đệm là những nhóm sáu móc đơn
    trên mỗi phách nốt trắng, chảy gần như không dừng.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n19
  cau: Ở tốc độ Andante, một ô dài khoảng bốn giây.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n23
  cau: Ô 25 bắt đầu f; có láy rền ở ô 19 và ô 53.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n24
  cau: 'Câu 1 (ô 1–4): pp; nốt Si♭ ngân dài rồi hai nốt Si♭ nhắc lại nhẹ; dòng chùm sáu chảy
    ngay từ nốt đầu; câu dừng trên hợp âm Rê♭ trưởng (kết nửa).'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n25
  cau: 'Câu 2 (ô 5–8): bắt đầu như câu 1, lần này khép về Sol♭ trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n26
  cau: 'Câu dài (ô 9–16): giai điệu vươn cao hơn (tới Fa♭5 ở ô 12), hòa âm đổi màu; ô 13 lùi
    về pp.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n27
  cau: 'Câu dài nói lại (ô 17–24): cùng giai điệu trên bè trầm khác; láy rền đầu tiên ở bè
    trầm (Rê♭2, ô 19); khép về Sol♭ ở ô 24.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n28
  cau: 'Đoạn giữa mở ra (ô 25–28): Mi♭ thứ, f; nốt giai điệu có dấu nhấn; bè trầm đi lên bằng
    những chùm ba nhỏ.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n29
  cau: 'Sáng tối xen kẽ (ô 29–40): f, p, pp, cả ppp (ô 35); láy rền ở ô 29; hai cú nhấn fz
    (ô 36, 38).'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n30
  cau: 'Những tiếng thở dài (ô 41–48): nốt nhấn rơi xuống một bậc (Sol♭–Fa, Mi♭–Rê); láy rền
    ở ô 46.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n31
  cau: 'Mi♭ trưởng và đường về (ô 49–54): giai điệu dừng lại trên Mi♭ (ô 51–53); bè trầm đi
    xuống tới láy rền rất trầm trên Sol♭1 (ô 53), rồi dấu ngân (ô 54).'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n32
  cau: 'Chủ đề trở lại (ô 55–74): như lần đầu nhưng rút gọn; câu cuối nói hai lần, lần hai
    bắt đầu fp (ô 71).'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n33
  cau: 'Coda (ô 75–86): hòa âm rẽ rất xa và lên tới ffz (ô 80), rồi về Sol♭; nhịp điệu của
    ô đầu tiên vang lần cuối (ô 84–85); ppp, dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n34
  cau: Số ô nhịp, sắc thái và vị trí láy rền theo ấn bản Breitkopf & Härtel 1888 (bản Mutopia),
    giữ nhịp 4/2 như Schubert viết.
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n35
  cau: 'Bảng Cấu trúc, A · chủ đề (ô 1–8): câu 1 dừng trên Rê♭ trưởng (kết nửa), câu 2 về
    Sol♭, pp; ô 4 có một crescendo nhỏ rồi diminuendo.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n36
  cau: 'A · câu dài (ô 9–16): Fa♭5 ở ô 12, pp ở ô 13; đỉnh câu ở ô 10–12.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n37
  cau: 'A · câu dài nói lại (ô 17–24): bè trầm mới, láy rền đầu tiên (Rê♭2, ô 19), kết Sol♭
    ở ô 24; hòa âm tối hơn (Mi♭♭ ở ô 21).'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n38
  cau: 'B (ô 25–40): Mi♭ thứ, f, dấu nhấn, chùm ba ở bè trầm, sắc thái từ f tới ppp, có fz;
    láy rền ở ô 29.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n39
  cau: 'B (ô 41–52): hình thở dài (ô 41, 45); láy rền ở ô 46; ô 49–52 sáng lên Mi♭ trưởng,
    rồi giai điệu đứng yên trên nốt Mi♭ (ô 51–53).'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n40
  cau: 'Đường về (ô 53–54): láy rền trên Sol♭1 (ô 53); dấu ngân ở ô 54.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n41
  cau: 'A'' (ô 55–74): chủ đề nguyên vẹn (ô 55–62), phần tiếp theo rút gọn; câu cuối nói hai
    lần (ô 67–70 và 71–74), lần hai fp.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n42
  cau: 'Coda (ô 75–86): hòa âm rẽ rất xa (ô 78–80; bản Breitkopf tạm đổi hóa biểu và viết
    bằng dấu thăng), ffz ở ô 80, nhịp điệu ô 1 (ô 84–85), ppp, dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n43
  cau: 'Cả bài chỉ có một chất liệu: giai điệu ca khúc trên dòng chùm sáu; đoạn giữa không
    đổi kết cấu mà đổi giọng, sắc thái và vai trò bè trầm.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n44
  cau: Đoạn trích ô 1–4 chép theo bản Mutopia của Ph. Raynaud (dựa trên ấn bản Breitkopf &
    Härtel 1888, phạm vi công cộng) và đã được đối chiếu từng nốt.
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n45
  cau: 'Giai điệu: một nốt Si♭4 ngân dài, rồi hai nốt Si♭ có chấm dưới dấu luyến (portato).'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n46
  cau: 'Dòng chùm sáu: nhóm nào rơi đúng lúc giai điệu đánh xuống thì bắt đầu bằng dấu lặng;
    ở ô 3, dưới bốn nốt đen của giai điệu, nó đổi thành chùm ba.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n47
  cau: 'Bè trầm: những quãng rộng ngân dài, ở ô 4 một hợp âm rải; câu dừng trên hợp âm Rê♭
    trưởng; nốt La♮ cuối ô 4 dẫn lên Si♭ ở ô 5.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n50
  cau: Ở tốc độ này, một nốt tròn ngân hơn hai giây.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n52
  cau: 'Giai điệu đi xuống vào vùng của dòng đệm ở ô 3 và ô 57: bốn nốt đen Sol♭ – Fa – Mi♭
    – Rê♭ đi xuống sát những chùm ba.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n53
  cau: 'Bè trầm và tay trái (ô 25–52): quãng tám, hợp âm rộng, chùm ba đi lên dẫn vào nốt
    trầm mới; đổi bàn đạp ở nốt đích.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n54
  cau: Láy rền ở âm vực trầm có ở ô 19, 29, 46, 53, 65, 75, 79.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n56
  cau: 'Bàn đạp: hòa âm đổi mỗi nửa ô, có khi mỗi phách, trong khi nốt giai điệu còn ngân;
    bàn đạp nối, giữ nốt bằng ngón, nửa bàn đạp.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n57
  cau: 'Đọc nhạc (nhất là ô 21, 35–36, 53–54, 75, 79–80): dấu giáng kép (Mi♭♭, La♭♭, Si♭♭)
    và một đoạn viết bằng dấu thăng.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n58
  cau: Đô♭ là phím Si, Fa♭ là phím Mi.
  loai: dinh-nghia
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n60
  cau: 'Bàn tay nhỏ: khoảng cách giữa ngón cái (dòng đệm) và ngón út (giai điệu) thường tới
    một quãng tám; cổ tay mềm, xoay nhẹ theo hình rải, không gồng để với; có thể mượn tay
    trái đánh vài nốt thấp nhất của dòng đệm, hỏi giáo viên trước khi đổi.'
  loai: quy-tac
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n62
  cau: 'Bài tập 1: Rê♭5 – Đô♭5 – Si♭4 ngón 5 – 4 – 3; ba nốt là một kết nhỏ, Đô♭ là nốt bảy
    của hợp âm Rê♭ bảy, đi xuống Si♭.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n70
  cau: Andante ở đây là bước đi, không phải đứng yên.
  loai: dinh-nghia
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n71
  cau: Tốc độ nốt trắng ≈ 52–60 cho cả bài dài khoảng sáu phút.
  loai: so-lieu
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n73
  cau: Henle mô tả bài này là một giấc mơ huyền bí ở pianissimo, và bản Breitkopf mở đầu bằng
    pp.
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n76
  cau: Una corda có thể giúp ở những chỗ ppp (ô 35, ô 84), nhưng đừng dựa vào nó suốt bài.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n77
  cau: f ở ô 25 là chiều sâu, không phải độ cứng; dấu nhấn trên nốt dài là trọng lượng; hai
    cú fz ở ô 36 và 38 bất ngờ nhưng ngắn.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n78
  cau: Bản Breitkopf viết sẵn nốt kết cho phần lớn các láy rền (hai nốt hoa mỹ nhỏ ngay trước
    nốt sau).
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n80
  cau: Dòng chùm sáu là chiếc đồng hồ của bài; hai dấu ngân, ở ô 54 và ở ô cuối, là hai chỗ
    dừng hẳn duy nhất.
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n81
  cau: 'Ấn bản: Henle có ấn bản riêng cho bài này (HN 488) bên cạnh các tập Impromptu trọn
    bộ; Wiener Urtext và Bärenreiter cũng in bài ở giọng gốc; bản Breitkopf & Härtel 1888
    (Mutopia) miễn phí, hữu ích để đối chiếu nốt.'
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n85
  cau: 'Schubert tiếp theo: Impromptu La♭ trưởng D. 935 số 2 dễ tiếp cận hơn một chút; Impromptu
    Mi♭ trưởng D. 899 số 2 có dòng chùm ba nhanh của tay phải.'
  loai: cap-do
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n87
  cau: 'Câu hỏi 1: lần in đầu của bài (1857) dịch sang Sol trưởng và chia đôi các ô nhịp dài;
    nhà xuất bản đổi cho dễ chơi hơn, vì sáu dấu giáng và nhịp 4/2 là điều khác thường với
    một bản nhạc ngắn thời ấy; bản Urtext trả lại Sol♭ trưởng và 4/2.'
  loai: lich-su
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n88
  cau: 'Câu hỏi 2: nhịp 4/2 nên cảm là bốn phách nốt trắng mỗi ô, mỗi phách một nhóm sáu móc
    đơn.'
  loai: cau-truc
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n91
  cau: 'Mục Nguồn: Henle HN 488 (mức độ khó 6, "a mysterious reverie in pianissimo", nhận
    xét về bản Sol trưởng).'
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n92
  cau: 'Mục Nguồn: dòng Wikipedia tiếng Anh (năm sáng tác, cái tên do Haslinger đặt, lần in
    1857, "dễ đọc hơn nhưng không dễ chơi hơn").'
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n93
  cau: 'Mục Nguồn: Mutopia Project, Impromptu in Ges-dur, D. 899 số 3 (Ph. Raynaud, phạm vi
    công cộng, theo Breitkopf & Härtel 1888): nguồn của đoạn trích, số ô, sắc thái, vị trí
    láy rền.'
  loai: ten
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n75
  cau: 'Bàn đạp: đổi theo hòa âm kiểu bàn đạp nối; nửa bàn đạp cho bè trầm ngân; đổi ở nốt
    đích của chùm ba; láy rền trầm đạp nông.'
  loai: khuyen-tap
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n89
  cau: 'Câu hỏi 3: các ngón ngoài, chủ yếu 4 và 5, hát giai điệu; ngón 1–2–3 chơi dòng chùm
    sáu.'
  loai: khuyen-tap
- trang: piano/tac-pham/schubert-impromptu-sol-giang
  id: n66
  cau: Láy rền tập không bàn đạp trước, rồi thêm bàn đạp nông; tăng tốc dần qua nhiều ngày.
  loai: khuyen-tap
