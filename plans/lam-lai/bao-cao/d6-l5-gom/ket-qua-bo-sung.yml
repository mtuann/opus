- trang: piano/tac-pham/debussy-clair-de-lune
  id: n46
  luot_2: dung
  nguon: ["https://web.archive.org/web/2015/http://www.speech.kth.se/music/5_lectures/askenflt/pianist.html", "https://web.archive.org/web/2015/http://www.speech.kth.se/music/5_lectures/askenflt/timing.html", "https://web.archive.org/web/2015/http://www.speech.kth.se/music/5_lectures/askenflt/motions.html"]
  ghi_chu: "Askenfelt & Jansson, 'From touch to string vibration' (Five lectures on the acoustics of the piano, Royal Swedish Academy of Music 1990; trang KTH gốc đã gỡ, đọc bản lưu Wayback). Vế 1: pianist.html: búa rời phím trước khi chạm dây nên người chơi chỉ điều khiển được vận tốc cuối của búa, tức độ to. Vế 2: timing.html: khoảng let-off được chỉnh bằng cách 'quan sát khoảng cách giữa dây và đỉnh búa ở điểm cao nhất, khi phím được ấn chậm' (1–3 mm), tức ấn đủ chậm thì búa thoát rồi dừng dưới dây, không đánh. Vế 3 là cách nói gần đúng: motions.html ghi vận tốc phím ở mezzo forte chỉ khoảng 0,3–0,5 m/s, forte hiếm khi quá 1 m/s, nên khoảng tốc độ phím từ nhẹ tới to rất hẹp."
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n74
  luot_2: dung
  nguon: ["https://www.cambridge.org/core/journals/nineteenth-century-music-review/article/claude-debussy-claude-debussy-album-debussy-le-compositeur-et-ses-interpretes-claude-debussy-and-ricardo-vines-pf-ninon-vallin-jane-bathori-claire-croiza-mary-garden-hector-dufranne-and-gerard-souzay-voice-camille-chevillard-and-arturo-toscanini-cond-aeon-1215-2012-3-cds-227-minutes-claude-debussy-clair-de-lune-natalie-dessay-sop-karine-deshayes-mezzosop-catherine-michel-harp-philippe-cassard-pf-le-jeune-choeur-de-paris-virgin-classics-7307692-2012-1-cd-73-minutes-claude-debussy-the-claude-debussy-collection-sony-193179-2012-18-cds-1148-minutes-claude-debussy-the-debussy-edition-deutsche-grammophon-47900566-18-cds-1032-minutes-claude-debussy-hommage-a-debussy-works-for-piano-julia-dahlkvist-chenyin-li-juliana-steinbach-and-amir-tebenikhin-pf-genuin-classics-12230-2012-4-cds-302-minutes-claude-debussy-piano-music-4-volumes-roy-howat-pf-tall-poppies-vol-1-94-1997-1-cd-79-minutes-vol-2-123-2000-1-cd-71-minutes-vol-3-164-2002-1-cd-75-minutes-vol-4-165-2003-1-cd-73-minutes/E1F1D03E3D57CC5B9671937E0A620D8D"]
  ghi_chu: "Bài điểm đĩa trên Nineteenth-Century Music Review (Cambridge) dẫn Marguerite Long, At the Piano with Debussy (bản dịch Olive Senior-Ellis, Dent 1972), tr. 13: một trong những câu Debussy 'hay nói nhất' là 'one must forget that the piano has hammers'. Trang djupdal.org/karstein/debussy/method/m08.shtml (nguồn phổ thông, chỉ để đối chiếu) dẫn cùng câu, cùng trang."
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n93
  luot_2: khong-chac
  nguon: ["https://www.abrsm.org/sites/default/files/2023-11/Piano%20LRSM%20Repertoire%20%5B7%20Nov%202023%5D%20FINAL.pdf", "https://www.abrsm.org/sites/default/files/2023-09/ARSM%20Repertoire%20Piano.pdf", "https://www.henle.de/Liebestraeume-3-Notturnos/HN-634", "https://www.henle.de/us/Ballades/HN-862"]
  ghi_chu: "Vế Ballade số 1 đúng: danh sách LRSM Piano của ABRSM (7/11/2023) có 'Chopin Any one of the 4 Ballades: G minor, Op. 23 …' (LRSM trên Grade 8); Henle HN 862 ghi Ballade Sol thứ Op. 23 mức 8 (difficult). Vế Liebestraum số 3 không xác nhận được bằng nguồn ABRSM: danh sách ARSM chỉ có Liebestraum số 2 ('Seliger Tod'); trang Henle HN 634 gắn dòng 'ABRSM: Piano ARSM recommended' (bản lưu 2021: 'DipABRSM (recommended)') vào số 2 Seliger Tod theo cấu trúc HTML, không phải số 3; số 3 'O lieb, so lang du lieben kannst!' chỉ có mức Henle 7 (difficult), không ghi ABRSM. Không tìm được đề cương DipABRSM hiện hành trên abrsm.org để kiểm số 3. Gợi ý viết lại: 'Ballade số 1 nằm trong danh sách LRSM của ABRSM (sau Grade 8); Liebestraum số 3 ở mức Henle 7 (khó).'"
- trang: piano/tac-pham/pathetique-adagio
  id: n73
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=295", "https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-2/pathetique-2-a4.pdf", "https://www.mutopiaproject.org/ftp/BeethovenLv/O13/pathetique-2/pathetique-2.ly"]
  ghi_chu: "Mutopia 295 (nguồn Berners 1908, Winterberger; Peters 1910), đọc nguồn LilyPond sinh ra PDF. Chủ đề ô 1–8: luyến c–bes | es–des nối ô 1–2, ô 4–5 (es–e | f), ô 5–7 (bes–…–des) qua ô; ô 3 gọn trong ô. Đoạn B (ô 17–28, Fa thứ): mọi dấu luyến tay phải gọn trong một ô (như 'c16( as' g f)' ô 17–19, ô 20–23, 26). Chấm staccato có ở đoạn C (ô 37–50: hợp âm ba ô 42–43 có '-.', bè giữa 47–50) và coda (ô 66–73). Lưu ý: chủ đề ô 7 và 15 cũng có chấm dưới luyến (c16 bes as g), và nhạc đệm chùm ba ở A' (ô 51–66) có chấm: câu không nói 'chỉ', nên vẫn đúng. Đây là ấn bản có hiệu đính (phrasing của Winterberger chỉ chép một phần), không phải Urtext; bản Breitkopf Gesamtausgabe trên IMSLP không tải được bằng công cụ."
