  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n8
  cau: 'Thể loại: sonata piano, 3 chương.'
  loai: so-lieu
- trang: nghe-nhac/beethoven-pathetique
  id: n9
  cau: Độ dài khoảng 17–20 phút.
  loai: so-lieu
- trang: nghe-nhac/beethoven-pathetique
  id: n10
  cau: Năm 1798, Beethoven 27 tuổi.
  loai: nam
- trang: nghe-nhac/beethoven-pathetique
  id: n11
  cau: Lúc ấy ông đã nổi tiếng ở Vienna như một nghệ sĩ piano, nhất là tài ứng tác.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n12
  cau: Sonata này nhanh chóng được yêu thích.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n13
  cau: Ignaz Moscheles kể rằng năm 1804, lúc mới 10 tuổi, ông phải chép tay bản nhạc ở thư
    viện vì không đủ tiền mua.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n14
  cau: Trang bìa bản in đầu tiên ghi Grande Sonate pathétique.
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n15
  cau: Theo Beethoven-Haus Bonn và ấn bản Urtext của Henle, chính Beethoven chọn tên này.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n16
  cau: Cùng với Les Adieux Op. 81a, đây là một trong hai sonata piano có tên gọi từ tác giả.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n17
  cau: Vài tài liệu khác cho rằng nhà xuất bản đặt tên và Beethoven đồng ý.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n18
  cau: Pathétique không có nghĩa "thảm hại" mà là "đầy bi cảm", gốc từ chữ Hy Lạp pathos.
  loai: dinh-nghia
- trang: nghe-nhac/beethoven-pathetique
  id: n19
  cau: 'Khác hẳn Ánh trăng: biệt danh ấy do người khác gợi ra, có lẽ từ một truyện của Ludwig
    Rellstab viết năm 1823.'
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n21
  cau: Chương 1 có tên Grave – Allegro di molto e con brio.
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n22
  cau: 'Mở đầu là phần chậm Grave: hợp âm Đô thứ nặng, tương phản đột ngột mạnh – nhỏ (fp),
    nhịp chấm dôi và những tiếng thở dài.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n23
  cau: Một chuỗi nốt chạy xuống rất nhanh lao vào phần Allegro.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n24
  cau: 'Chủ đề Allegro: tay phải vút lên qua hai quãng tám, trên tremolo quãng tám rải không
    ngừng của tay trái.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n25
  cau: Chủ đề thứ hai ở Mi♭ thứ chứ không phải Mi♭ trưởng như thường lệ.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n26
  cau: Ở chủ đề 2, giai điệu nhảy qua lại giữa âm vực trầm và những nốt láy ở âm vực cao,
    vượt qua phần đệm ở giữa, nên hai tay liên tục vắt chéo.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n27
  cau: Phần trình bày khép lại ở Mi♭ trưởng.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n28
  cau: Phần Grave quay lại hai lần, ở đầu phần phát triển và trong coda.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n30
  cau: Chương 2 Adagio cantabile ở La♭ trưởng, nhịp 2/4.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n31
  cau: Chương 2 "là một trong những giai điệu đẹp nhất Beethoven viết".
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n32
  cau: 'Lần đầu, giai điệu hát ở âm vực trầm ấm quanh Đô giữa (C4), trên một dòng móc kép
    ở bè giữa và bè trầm bên dưới: ba lớp trong hai bàn tay.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n33
  cau: Rồi giai điệu được nhắc lại cao hơn một quãng tám.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n34
  cau: Chương 2 có dạng rondo A–B–A–C–A; đoạn xen thứ nhất ở giọng thứ; đoạn xen thứ hai ở
    La♭ thứ, phần đệm chuyển sang chùm ba, rồi trượt sang Mi trưởng.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n36
  cau: Lần trở lại cuối cùng, phần đệm giữ nhịp chùm ba ấy.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n37
  cau: 'Chương 3 Rondo: Allegro ở Đô thứ.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n38
  cau: Bốn nốt đầu của chủ đề rondo đi y như chủ đề thứ hai của chương 1, chỉ khác giọng.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n39
  cau: Các đoạn xen đi qua Mi♭ trưởng và La♭ trưởng; đoạn La♭ trưởng viết kiểu đối âm, các
    bè đuổi nhau.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n40
  cau: Gần cuối, giọng La♭ trưởng thoáng hiện, rồi bản nhạc đóng sập ở Đô thứ bằng một chuỗi
    nốt đổ xuống.
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n41
  cau: Đàn kiểu Vienna thời ấy chỉ có âm vực khoảng năm quãng tám.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n45
  cau: 'Theo dõi: Grave, hợp âm Đô thứ nặng, mạnh – nhỏ đột ngột; chuỗi nốt chạy xuống dẫn
    vào Allegro.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n46
  cau: 'Theo dõi: Allegro chủ đề 1, tay phải vút lên trên tremolo quãng tám của tay trái.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n47
  cau: 'Theo dõi: Chủ đề 2 ở Mi♭ thứ, hai tay vắt chéo, giai điệu có những nốt láy; rồi phần
    trình bày khép lại ở Mi♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n48
  cau: 'Theo dõi: Nhắc lại phần trình bày (nếu có), có nghệ sĩ quay về đầu Allegro, có người
    về tận phần Grave.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n49
  cau: 'Theo dõi: Phát triển, vài ô Grave trở lại, rồi Allegro lao đi qua nhiều giọng.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n50
  cau: 'Theo dõi: Tái hiện và coda, chủ đề trở lại ở Đô thứ; Grave thoáng qua lần cuối, rồi
    kết nhanh, dứt khoát.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n51
  cau: Theo dõi các dòng chương 2 và 3 (Adagio; đoạn xen 1; đoạn xen 2 La♭ thứ chùm ba, trượt
    sang Mi trưởng; lần cuối trên chùm ba, coda; Rondo Đô thứ, đoạn xen Mi♭ và La♭ trưởng;
    coda La♭ trưởng thoáng hiện, kết Đô thứ bằng chuỗi nốt đổ xuống).
  loai: cau-truc
- trang: nghe-nhac/beethoven-pathetique
  id: n53
  cau: Bản thu chương I của Daniel Veesey trên Commons dừng ở khoảng 6:24, giữa phần phát
    triển, nên dòng Tái hiện và coda không có mốc.
  loai: so-lieu
- trang: nghe-nhac/beethoven-pathetique
  id: n55
  cau: Emil Gilels có bản thu Pathétique.
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n56
  cau: Angela Hewitt, khi nhắc lại phần trình bày, quay về tận phần Grave, vì Beethoven không
    hề ghi rằng chỉ nhắc lại phần Allegro (theo bà, chỗ ấy do nhà xuất bản thêm về sau); Rudolf
    Serkin cũng làm vậy.
  loai: lich-su
- trang: nghe-nhac/beethoven-pathetique
  id: n57
  cau: Ronald Brautigam thu Pathétique trên fortepiano, loại đàn thời Beethoven.
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n59
  cau: 'Adagio cantabile khoảng Grade 7–8: ABRSM xếp chương này ở Grade 8.'
  loai: cap-do
- trang: nghe-nhac/beethoven-pathetique
  id: n62
  cau: Rondo cũng được ABRSM xếp ở Grade 8.
  loai: cap-do
- trang: nghe-nhac/beethoven-pathetique
  id: n63
  cau: Chương 1 đòi tremolo quãng tám bền bỉ, vắt tay và tốc độ; hãy để sau cùng.
  loai: cap-do
- trang: nghe-nhac/beethoven-pathetique
  id: n66
  cau: 'Nguồn: ấn bản Urtext Henle (biên tập Norbert Gertsch và Murray Perahia, 2018), có
    lời tựa về niên đại, bản in đầu tiên và tên gọi.'
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n67
  cau: 'Nguồn: Beethoven-Haus Bonn, thư mục tác phẩm Op. 13 (link trang tác phẩm).'
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n68
  cau: 'Nguồn: Charles Rosen, Beethoven''s Piano Sonatas: A Short Companion (Yale 2002).'
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n69
  cau: 'Nguồn mới: Hewitt (Hyperion 2007), Moscheles trong Life of Beethoven của Schindler
    (Gutenberg), đề cương ABRSM 2027 & 2028 (chương 2, 3 ở Grade 8).'
  loai: ten
- trang: nghe-nhac/beethoven-pathetique
  id: n64
  cau: 'Một chương chậm khác để tập: chương 1 Ánh trăng.'
  loai: khuyen-tap
- trang: nghe-nhac/beethoven-pathetique
  id: n60
  cau: 'Adagio là cửa ngõ vào Beethoven: ít nốt nhanh, nhưng đòi legato, cân bằng các bè và
    bàn đạp sạch.'
  loai: khuyen-tap
- trang: nghe-nhac/beethoven-pathetique
  id: n43
  cau: Trên đàn hiện đại, cái khó là giữ tremolo tay trái nhẹ và đều suốt nhiều trang mà không
    cứng cổ tay; trong Adagio cân bằng ba lớp để giai điệu nổi.
  loai: khuyen-tap
- trang: piano/tac-pham/pathetique-adagio
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata Pathétique, chương 2 (Adagio cantabile)".'
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n2
  cau: Giai điệu, phần đệm móc kép và bè trầm cùng nằm trong hai bàn tay; một bàn tay (tay
    phải) thường lo hai việc cùng lúc.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n4
  cau: Ngay từ ô đầu, tay phải vừa hát giai điệu bằng ngón 3–4–5, vừa chơi phần đệm móc kép
    bằng ngón 1–2.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n6
  cau: 'Chủ đề vang lên ba lần (ô 1, 29, 51), kết cấu đổi dần: lần đầu được nhắc lại cao hơn
    một quãng tám với phần đệm dày hơn; lần cuối phần đệm chuyển sang chùm ba.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n8
  cau: Chương ở nhịp 2/4, Adagio.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n11
  cau: Beethoven viết Pathétique khi khoảng 27 tuổi.
  loai: nam
- trang: piano/tac-pham/pathetique-adagio
  id: n12
  cau: Beethoven đến Vienna năm 1792; Pathétique viết vài năm sau.
  loai: nam
- trang: piano/tac-pham/pathetique-adagio
  id: n13
  cau: Lúc ấy ông đã nổi tiếng như một nghệ sĩ piano, nhất là tài ứng tác.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n14
  cau: Tên Grande Sonate pathétique có ngay trên bản in đầu tiên năm 1799.
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n16
  cau: '"Pathétique" ở đây gần nghĩa "đầy xúc động, bi tráng", không phải "thảm hại".'
  loai: dinh-nghia
- trang: piano/tac-pham/pathetique-adagio
  id: n17
  cau: Chương 1 ở Đô thứ; chương 2 ở La♭ trưởng, thấp hơn một quãng ba trưởng.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n18
  cau: Giai điệu chương 2 rất gần một chủ đề trong chương chậm của Sonata Đô thứ K. 457 của
    Mozart.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n19
  cau: Hai sonata còn giống nhau ở giọng (Đô thứ) và cách chia chương (ba chương).
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n23
  cau: Đoạn C ở giọng thứ (La♭ thứ).
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n24
  cau: Wilhelm Kempff và Alfred Brendel đều thu trọn 32 sonata của Beethoven.
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n27
  cau: 'Theo dõi: Chủ đề ô 1–8, giai điệu ở âm vực giữa, bắt đầu từ Đô giữa; tay phải vừa
    hát vừa đệm móc kép, tay trái giữ bè trầm.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n28
  cau: 'Theo dõi: Chủ đề cao hơn một quãng tám ô 9–16; kết cấu đầy hơn, tay trái cũng tham
    gia phần móc kép.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n29
  cau: 'Theo dõi: Đoạn B ô 17–28, Fa thứ, qua Đô thứ, đến Mi♭ trưởng; tay trái hợp âm lặp
    lại; đoạn nối có bè trong đi xuống theo nửa cung; pp trước khi chủ đề trở lại.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n30
  cau: 'Theo dõi: Chủ đề trở lại ô 29–36, chỉ tám ô, ở âm vực giữa.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n31
  cau: 'Theo dõi: Đoạn C ô 37–50, La♭ thứ, phần đệm chuyển sang chùm ba móc kép; tay trái
    đáp lời ở âm vực trầm.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n32
  cau: 'Theo dõi: Mi trưởng bất ngờ trong đoạn C, các nốt sf; rồi đoạn nối trên hợp âm bảy
    giảm và hợp âm át dẫn về chủ đề.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n33
  cau: 'Theo dõi: Chủ đề lần cuối ô 51–66, phần đệm chùm ba; tám ô đầu ở âm vực giữa.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n34
  cau: 'Theo dõi: Chủ đề lên cao một quãng tám, tám ô tiếp theo, vẫn trên nền chùm ba.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n35
  cau: 'Theo dõi: Coda ô 66–73, chùm ba tiếp tục, chủ – át luân phiên, mảnh giai điệu và nốt
    hoa mỹ, tắt dần về pp.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n37
  cau: 'Đây là một rondo nhỏ: chủ đề A vang lên ba lần, xen giữa là hai đoạn tương phản.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n38
  cau: 'Bảng: A ô 1–8 chủ đề ở âm vực giữa (bắt đầu từ Đô giữa); tay phải giai điệu ở trên,
    móc kép ở dưới; tay trái bè trầm.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n39
  cau: 'Bảng: A ô 9–16 chủ đề nhắc lại cao hơn một quãng tám, kết cấu đầy hơn, tay trái cũng
    tham gia phần móc kép.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n40
  cau: 'Bảng: B ô 17–28 Fa thứ, qua Đô thứ, đến Mi♭ trưởng; đoạn nối bè trong đi xuống theo
    nửa cung; tay trái hợp âm lặp lại; pp trước khi chủ đề trở lại.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n41
  cau: 'Bảng: A ô 29–36 chủ đề chỉ tám ô, ở âm vực giữa.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n42
  cau: 'Bảng: C ô 37–50 La♭ thứ, đệm chùm ba móc kép; sang Mi trưởng (đổi tên enharmonic)
    với các nốt sf; đoạn nối trên hợp âm bảy giảm rồi hợp âm át.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n43
  cau: 'Bảng: C là đoạn kịch tính nhất bài: tay phải vừa hát vừa đệm chùm ba; tay trái đáp
    lời ở âm vực trầm.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n44
  cau: 'Bảng: A ô 51–66 chủ đề lần cuối đệm chùm ba: tám ô ở giữa, tám ô cao hơn một quãng
    tám.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n45
  cau: 'Bảng: Coda ô 66–73, chùm ba tiếp tục, chủ – át luân phiên, mảnh giai điệu và nốt hoa
    mỹ, tắt dần về pp.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n46
  cau: Chương có 73 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n48
  cau: 'Chỗ khó: ngón 1–2 chơi nhiều nốt hơn nên dễ to hơn; ngón 4–5 phải hát.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n52
  cau: Hòa âm đổi mỗi phách hoặc nửa phách; giai điệu đi bậc.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n55
  cau: 'Đoạn C: tay phải vừa hát vừa lặp hợp âm chùm ba: cổ tay mềm, ngón sát phím, tập chùm
    ba riêng ở pp.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n56
  cau: 'Chuyển sang Mi trưởng: đọc nốt thăng sau cả trang dấu giáng.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n58
  cau: 'Phần A cuối: nhịp hai (giai điệu) chọi ba (đệm).'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n69
  cau: 'Adagio cantabile: chậm, như hát.'
  loai: dinh-nghia
- trang: piano/tac-pham/pathetique-adagio
  id: n72
  cau: Bè trầm có hướng đi riêng, nhiều chỗ đi bậc như một giai điệu thứ hai.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n73
  cau: Dấu luyến của Beethoven thường dài hơn ở giai điệu và ngắn ở các mảnh đối đáp; có chấm
    staccato trong đoạn B và coda.
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n75
  cau: Đàn của Beethoven năm 1798 có tiếng tắt nhanh hơn đàn hiện đại.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n77
  cau: Láy quanh của Beethoven thường bắt đầu từ nốt trên.
  loai: quy-tac
- trang: piano/tac-pham/pathetique-adagio
  id: n79
  cau: Các bản thế kỷ 19, như của Hans von Bülow, thêm nhiều sắc thái, bàn đạp và thay đổi
    dấu luyến.
  loai: lich-su
- trang: piano/tac-pham/pathetique-adagio
  id: n80
  cau: Ấn bản ABRSM của Barry Cooper có gợi ý ngón bấm, giải thích và ghi rõ phần nào là của
    người biên tập.
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n83
  cau: 'Chương 3 (Rondo: Allegro) là bước tiếp tự nhiên; chương 1 cần tốc độ và sức bền ở
    mức Grade 8 trở lên.'
  loai: cap-do
- trang: piano/tac-pham/pathetique-adagio
  id: n88
  cau: 'Câu hỏi 1: ở lần cuối (ô 51–66), phần đệm chuyển sang chùm ba móc kép, mang theo nhịp
    điệu của đoạn C.'
  loai: cau-truc
- trang: piano/tac-pham/pathetique-adagio
  id: n90
  cau: 'Câu hỏi 3: Adagio cantabile nghĩa là chậm, như hát.'
  loai: dinh-nghia
- trang: piano/tac-pham/pathetique-adagio
  id: n92
  cau: 'Nguồn: ấn bản Henle Op. 13 và ấn bản ABRSM The 35 Piano Sonatas (biên tập Barry Cooper).'
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n93
  cau: 'Nguồn: hai sách in (Barry Cooper, Beethoven, OUP 2000; Charles Rosen, Beethoven''s
    Piano Sonatas: A Short Companion, Yale 2002).'
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n94
  cau: 'Nguồn: Badura-Skoda, lời giới thiệu đĩa K. 457; bản chép LilyPond của Mutopia (Berners
    1908, Peters 1910).'
  loai: ten
- trang: piano/tac-pham/pathetique-adagio
  id: n66
  cau: Kế hoạch 8 tuần, 45–60 phút mỗi ngày, tốc độ theo móc đơn từ ♪ = 50 lên khoảng 60–72.
  loai: khuyen-tap
- trang: piano/tac-pham/pathetique-adagio
  id: n78
  cau: Nốt hoa mỹ chơi nhẹ hơn nốt chính, không vội; đọc chú thích bản Urtext.
  loai: khuyen-tap
- trang: piano/tac-pham/pathetique-adagio
  id: n49
  cau: 'Cách tập giai điệu và móc kép: chơi riêng giai điệu với ngón 3–4–5, thêm móc kép bấm
    câm, rồi pp; bài tập 1.'
  loai: khuyen-tap
