- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n1
  cau: 'Tiêu đề: "Bach: Prelude và fugue Đô thứ, BWV 847".'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n2
  cau: BWV 847 là cặp thứ hai của Bình quân luật quyển 1 (mô tả và câu mở đầu).
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n3
  cau: Prelude dựng trên móc kép liên tục ở hai tay; fugue có ba bè (giọng) độc lập.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n5
  cau: Fugue có 31 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n6
  cau: Ba bè vào lần lượt rất rõ, chủ đề dễ nhận ra.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n8
  cau: Suốt 24 ô đầu prelude, hai tay chơi cùng một kiểu hình móc kép.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n10
  cau: 'Prelude nghĩ theo hợp âm, giống BWV 846: mỗi ô một hợp âm, rải bằng một hình nốt lặp
    lại; fugue nghĩ theo đường nét.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n13
  cau: 'Bình quân luật (Das Wohltemperierte Klavier) gồm 24 cặp prelude và fugue, mỗi cặp
    ở một giọng, đi lên từng nửa cung, giọng trưởng trước giọng thứ: Đô trưởng, Đô thứ, Đô♯
    trưởng, Đô♯ thứ…'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n14
  cau: Vì thế BWV 847 là cặp số 2.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n15
  cau: Trang bìa bản chép năm 1722 gọi tập nhạc là Praeludia und Fugen durch alle Tone und
    Semitonia, tức prelude và fugue qua mọi cung và nửa cung.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n16
  cau: Tập nhạc viết cho những người trẻ ham học và cho cả những người đã thạo nghề.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n17
  cau: Chữ wohltemperiert ("được điều hòa tốt") nói đến cách lên dây cho phép chơi ở mọi giọng.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n18
  cau: 'Prelude trông như bài tập ngón: một hình nốt lặp lại ô này sang ô khác.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n19
  cau: Gần cuối prelude, Bach ghi liền ba chỉ dẫn tốc độ Presto, Adagio, Allegro.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n20
  cau: Adagio là một ô tự do đầy nốt trang trí, rồi Allegro lao về hợp âm cuối.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n21
  cau: 'Fugue ngắn, chủ đề có nhịp điệu riêng: một vòng móc kép quanh nốt Đô rồi những bước
    nhảy móc đơn.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n23
  cau: Bach viết cho đàn phím thời ấy (harpsichord, clavichord), không có bàn đạp vang.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n27
  cau: Nốt đầu của mỗi hình nửa ô ở tay phải (thường cũng là nốt cao nhất) nối với nhau thành
    một đường nét chậm.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n28
  cau: Trong fugue, chủ đề (kể cả đáp đề) vào tám lần.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n30
  cau: Glenn Gould, Sviatoslav Richter, András Schiff, Angela Hewitt đều thu âm Bình quân
    luật; Gustav Leonhardt thu trên harpsichord.
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n32
  cau: 'Theo dõi: Prelude mở đầu ô 1–4, hai tay cùng một kiểu hình móc kép trên nốt Đô trầm
    đứng yên.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n33
  cau: 'Theo dõi: Chuyển giọng ô 5–20, bè trầm đi xuống dần, hòa âm đổi mỗi ô; sáng lên quanh
    Mi♭ trưởng (ô 11–14) rồi về Đô thứ.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n34
  cau: 'Theo dõi: Âm nền át ô 21–27, bè trầm dừng trên Sol; từ ô 25 hình nốt biến đổi.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n35
  cau: 'Theo dõi: Presto ô 28–33, tay phải chạy trước, từ ô 29 tay trái đuổi theo cùng hình
    nốt.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n36
  cau: 'Theo dõi: Adagio rồi Allegro ô 34–38, một ô chậm tự do đầy nốt trang trí, rồi về hợp
    âm Đô trưởng cuối bài.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n37
  cau: 'Theo dõi: Fugue ô 1–2, bè alto một mình với chủ đề.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n38
  cau: 'Theo dõi: Đáp đề ô 3–4, soprano vào ở Sol thứ; alto chuyển sang chuỗi móc kép đi xuống
    (đối đề 1).'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n39
  cau: 'Theo dõi: Bè bass vào ô 7–8, đủ ba bè; lần đầu chủ đề và hai đối đề vang cùng lúc.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n40
  cau: 'Theo dõi: Giữa fugue ô 9–25, chủ đề ở Mi♭ trưởng (ô 11), Sol thứ (ô 15), Đô thứ (ô
    20), xen đoạn chuyển có móc kép chạy.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n41
  cau: 'Theo dõi: Kết ô 26–31, bè bass vào lần cuối, rồi soprano trên nốt Đô trầm ngân dài;
    hợp âm cuối là Đô trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n42
  cau: 'Bảng prelude, Mở đầu ô 1–4: nốt Đô trầm ở đầu mỗi nửa ô; mỗi ô một hợp âm, mỗi hình
    nửa ô chơi hai lần.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n43
  cau: 'Bảng prelude, Chuyển giọng ô 5–20: bè trầm đi xuống Đô – Si♭ – La♭ – Sol (ô 6–11);
    hòa âm chạm Sol thứ (ô 7), Fa thứ (ô 9), Mi♭ trưởng (ô 11–14), qua hợp âm bảy giảm (ô
    16–17) về Đô thứ (ô 18).'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n44
  cau: 'Bảng prelude, Âm nền át ô 21–27: từ ô 25 tay trái chỉ đánh nốt Sol và hai nốt kế tiếp;
    tay phải nối dòng móc kép ở vùng giữa.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n45
  cau: 'Bảng prelude, Presto ô 28–33: trên nốt Sol giữ dài tay phải chạy; từ ô 29 tay trái
    nhắc lại hình ấy thấp hơn một quãng tám, chậm hơn một ô; ở ô 31–32 tay trái chơi lên tận
    vùng của tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n46
  cau: 'Bảng prelude, Adagio ô 34: hai hợp âm rải; giai điệu trang trí bằng móc ba, móc bốn.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n47
  cau: 'Bảng prelude, Allegro ô 35–38: móc kép trở lại, dồn về hợp âm Đô trưởng có dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n48
  cau: 'Câu dẫn khối 1: bốn ô đầu đối chiếu từng nốt với bản Breitkopf & Härtel 1866 (Bach-Gesellschaft)
    qua bản chép LilyPond của Mutopia.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n49
  cau: 'Đọc theo hợp âm: ô 1 Đô thứ, ô 2 Fa thứ trên nốt Đô trầm, ô 3 hợp âm bảy giảm (Si♮
    – Rê – Fa – La♭) trên nốt Đô trầm, ô 4 Đô thứ.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n50
  cau: Cả 24 ô đầu đều xây theo cùng cách (mỗi ô một hợp âm rải theo một hình).
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n52
  cau: 'Câu dẫn khối 2: fugue theo bản Edition Peters, qua bản chép của Mutopia; cả hai bè
    đều ở khuông trên.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n53
  cau: Chủ đề đi Đô – Si – Đô rồi nhảy xuống Sol (quãng 4); đáp đề đi Sol – Fa♯ – Sol rồi
    nhảy xuống Đô (quãng 5), không xuống Rê.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n54
  cau: Chỉ nốt thứ tư ấy được chỉnh; mọi nốt còn lại đúng là chủ đề dịch lên một quãng 5.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n55
  cau: 'Kiểu đáp này gọi là đáp đề điệu tính (tonal answer): nốt át âm của chủ đề được đáp
    bằng nốt chủ âm.'
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n56
  cau: 'Trong lúc ấy bè alto chơi đối đề 1: chuỗi móc kép đi xuống rồi những móc đơn.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n57
  cau: 'Ô 7–8: bè bass vào với chủ đề; soprano chơi đối đề 1 (bắt đầu từ Fa); alto chơi đối
    đề 2, những móc đơn ngắt quãng bởi dấu lặng.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n58
  cau: Nốt Fa đầu ô 7 ở soprano được nối từ ô 6.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n59
  cau: Ba đường nét (chủ đề, hai đối đề) còn gặp lại nhau, mỗi lần đổi bè, chẳng hạn ở ô 15–16
    và ô 20–21.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n60
  cau: 'Bản đồ: ô 1–2 alto, Đô thứ, chủ đề một mình.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n61
  cau: 'Bản đồ: ô 3–4 soprano (đáp đề), Sol thứ; alto đối đề 1.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n62
  cau: 'Bản đồ: ô 5–6 đoạn chuyển 1, đầu chủ đề nhắc theo chuỗi đi lên ở soprano; alto chạy
    móc kép.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n63
  cau: 'Bản đồ: ô 7–8 bass, Đô thứ; soprano đối đề 1, alto đối đề 2; hết phần trình bày.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n64
  cau: 'Bản đồ: ô 9–10 đoạn chuyển 2, bass chạy móc kép đi xuống; hai bè trên nhại đầu chủ
    đề.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n65
  cau: 'Bản đồ: ô 11–12 soprano, Mi♭ trưởng; bass đối đề 1.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n66
  cau: 'Bản đồ: ô 13–14 đoạn chuyển 3, soprano chạy móc kép đi lên; alto và bass đi móc đơn.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n67
  cau: 'Bản đồ: ô 15–16 alto (dạng đáp đề), Sol thứ; soprano đối đề 1, bass đối đề 2.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n68
  cau: 'Bản đồ: ô 17–19 đoạn chuyển 4, các bè hỏi đáp bằng những mảnh chủ đề ngắn.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n69
  cau: 'Bản đồ: ô 20–21 soprano, Đô thứ; alto đối đề 1, bass đối đề 2 hơi biến đổi.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n70
  cau: 'Bản đồ: ô 22–26 đoạn chuyển 5, đầu chủ đề đi xuống theo chuỗi ở soprano; bass chạy
    móc kép.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n71
  cau: 'Bản đồ: ô 26–28 bass (từ giữa ô 26), Đô thứ; lần vào cuối của bè trầm.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n72
  cau: 'Bản đồ: ô 29–31 soprano (từ giữa ô 29), Đô thứ, trên quãng tám Đô ngân dài ở bè trầm;
    hợp âm cuối Đô trưởng (quãng 3 Picardy).'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n74
  cau: 'Chỗ khó, cân bằng hai tay ở prelude: tay phải ở vùng giữa, tay trái ở vùng trầm.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n76
  cau: 'Chỗ khó, ô 25–33: hình nốt đổi; ở Presto hai tay đuổi nhau sát bên nhau, có chỗ chen
    vào cùng một vùng phím.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n78
  cau: 'Chỗ khó, Adagio ô 34: nhiều nốt nhỏ (móc ba, móc bốn) trong một ô chậm.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n80
  cau: 'Chỗ khó, ba bè trong fugue: bè alto nằm giữa, dễ bị hai bè ngoài che.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n82
  cau: 'Chỗ khó, hai bè trong một tay: một bè giữ nốt dài trong khi bè kia chạy.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n85
  cau: Chỗ khó, đoạn chuyển có móc kép chạy ở ô 9–10, 13–14, 22–24.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n87
  cau: 'Chỗ khó, ba ô cuối: tay trái giữ quãng tám Đô hơn hai ô trong khi tay phải chơi chủ
    đề kèm hợp âm.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n96
  cau: Trong bản chép Mutopia (theo Edition Peters), bè alto được ghi xuống khuông dưới ở
    ô 12–14 và một đoạn ngắn trong ô 20.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n99
  cau: Prelude không ghi tốc độ ở đầu bài; Presto ở ô 28.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n103
  cau: 'Đối đề 2: móc đơn, mỗi nhóm bắt đầu sau một dấu lặng.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n106
  cau: Bach không ghi sắc thái nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n108
  cau: Ở Presto hai tay nhại nhau cách một ô.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n109
  cau: 'Trong bản Bach-Gesellschaft (theo bản chép Mutopia), nốt Fa ở nửa sau ô 34 có dấu
    láy (mordent): nốt chính – nốt dưới – nốt chính.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n113
  cau: Ở ô 18 của prelude (tay trái, đầu nửa ô sau), bản Bach-Gesellschaft ghi Đô, còn người
    chép bản Mutopia ghi Si♭ theo một bản Urtext và chú thích lại chỗ này.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n114
  cau: Các đoạn trích trên trang theo bản Bach-Gesellschaft (prelude) và Edition Peters (fugue),
    qua Mutopia.
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n116
  cau: Các Sinfonia (invention ba bè) có số BWV 787–801.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n118
  cau: Fugue Rê thứ BWV 851 của quyển 1 có ba bè; fugue Đô trưởng BWV 846 có bốn bè.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n120
  cau: 'Câu hỏi 1: cuối prelude Bach ghi Presto, Adagio, Allegro theo thứ tự; Presto ô 28,
    Adagio ô 34, Allegro ô 35.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n121
  cau: 'Câu hỏi 2: ba bè vào theo thứ tự alto (ô 1), soprano (ô 3), bass (ô 7); soprano đáp
    ở Sol thứ.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n122
  cau: 'Câu hỏi 3: đáp đề khác "chủ đề dịch lên quãng 5" ở nốt thứ tư (nhảy xuống Đô thay
    vì Rê); đó là đáp đề điệu tính.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n124
  cau: 'Nguồn: Henle HN 1014 (biên tập Ernst-Günter Heinemann) ghi mức độ khó theo thang Henle.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n125
  cau: 'Nguồn: blog Henle 2022 "300 years of WTC I" nói về bản chép 1722, trang bìa, các bản
    in quanh năm 1800.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n126
  cau: 'Nguồn: hai sách in (David Ledbetter, Bach''s Well-tempered Clavier, Yale 2002; Christoph
    Wolff, Johann Sebastian Bach: The Learned Musician, Norton 2000).'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n127
  cau: 'Nguồn: lời nói đầu Henle HN 14 (Ernst-Günter Heinemann, 1997) nói về trang bìa bản
    chép 1722 và cách lên dây bình quân.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n128
  cau: 'Nguồn: bản nhạc IMSLP; đoạn trích đối chiếu với bản chép LilyPond của Mutopia, prelude
    theo Breitkopf & Härtel 1866, fugue theo Edition Peters (thêm link tệp .ly).'
  loai: ten
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n29
  cau: Bè alto là bè khó nghe nhất vì nằm giữa.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n97
  cau: Kế hoạch 8 tuần, mỗi ngày 45–60 phút, prelude và fugue tập song song; tốc độ máy đếm
    nhịp từng tuần như bảng.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-fugue-do-thu
  id: n102
  cau: 'Phát âm fugue: móc kép liền, móc đơn tách nhẹ; chủ đề ba nốt Đô – Si – Đô thành một
    nhóm; nốt dài giữ đủ trường độ.'
  loai: khuyen-tap
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n1
  cau: 'Tiêu đề: "Debussy: Clair de lune" (Ánh trăng).'
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n2
  cau: Gần như cả bài nằm trong vùng pp và p, với một nhịp điệu cố tình làm mờ phách.
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n6
  cau: Bài kéo dài khoảng năm phút.
  loai: so-lieu
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n7
  cau: Đây là một trong những bản nhạc piano được yêu thích nhất.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n9
  cau: The Little Shepherd là một bài trong tập Children's Corner của Debussy.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n10
  cau: Tên bài trùng tên bài thơ Clair de lune của Paul Verlaine, bài mở đầu tập Fêtes galantes.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n11
  cau: Tập Fêtes galantes in năm 1869.
  loai: nam
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n12
  cau: Debussy đã phổ bài thơ Clair de lune thành ca khúc.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n13
  cau: Chữ bergamasque có ngay trong bài thơ ấy ("masques et bergamasques"); theo lời tựa
    Henle, tên tổ khúc thường được coi là gợi nhớ tập thơ này.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n14
  cau: Bài thơ tả những nhân vật đeo mặt nạ dưới ánh trăng, vui mà buồn.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n16
  cau: Debussy viết bộ tổ khúc khi khoảng 28 tuổi, nhưng chỉ in 15 năm sau.
  loai: nam
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n17
  cau: Chính Debussy ghi năm 1890 lên bản in thử để cho biết đây là tác phẩm thời trẻ.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n18
  cau: Bản in năm 1905 là bản đã sửa.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n19
  cau: Bản thảo gốc đến nay chưa tìm thấy, nên không ai biết chắc phần nào thuộc năm 1890,
    phần nào thuộc năm 1905.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n20
  cau: 'Hòa âm còn chức năng: có hợp âm át, có kết rõ.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n24
  cau: Walter Gieseking thu trọn nhạc piano solo của Debussy.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n26
  cau: 'Theo dõi: Mở đầu ô 1–14, pp con sordina; quãng ba, quãng sáu đi xuống ở tay phải,
    bắt đầu sau phách đầu và nối qua phách.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n27
  cau: 'Theo dõi: Tempo rubato ô 15–18, giai điệu rõ hơn trên các hợp âm.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n28
  cau: 'Theo dõi: lớn dần, nhanh dần ô 19–26 (peu à peu cresc. et animé), dừng trên một hợp
    âm át rải.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n29
  cau: 'Theo dõi: Un poco mosso ô 27–36, tay trái rải hợp âm liên tục như nước chảy, giai
    điệu ở tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n30
  cau: 'Theo dõi: Cao trào ô 37–42, điểm cao nhất của bài quanh ô 41.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n31
  cau: 'Theo dõi: Calmato ô 43–50, lắng lại trên nền trầm.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n32
  cau: 'Theo dõi: A'' ô 51–65, tốc độ ban đầu trở lại; chủ đề mở đầu trên nền hợp âm rải.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n33
  cau: 'Theo dõi: Coda ô 66–72, hợp âm rải, tay bắt chéo, tan dần đến hết (morendo jusqu''à
    la fin).'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n34
  cau: 'Bảng: A ô 1–14, Andante très expressif, pp con sordina; quãng ba, quãng sáu đi xuống
    ở tay phải; bắt đầu sau phách đầu, nhiều dấu nối qua phách.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n36
  cau: 'Bảng: A (tiếp) ô 15–26, Tempo rubato; giai điệu trên hợp âm; từ ô 19 peu à peu cresc.
    et animé (lớn dần và nhanh dần từng chút); kết thúc trên hợp âm át rải.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n38
  cau: 'Bảng: B ô 27–36, Un poco mosso, tay trái rải hợp âm liên tục, giai điệu ở tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n40
  cau: 'Bảng: B (cao trào) ô 37–42, điểm cao nhất quanh ô 41.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n41
  cau: 'Bảng: B (lắng) ô 43–50, Calmato.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n42
  cau: 'Bảng: A'' ô 51–65, tốc độ ban đầu trở lại, chủ đề mở đầu trên nền hợp âm rải.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n43
  cau: 'Bảng: Coda ô 66–72, hợp âm rải, tay bắt chéo, tan dần đến hết.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n45
  cau: Bài có 72 ô nhịp, 9/8, Rê♭ trưởng.
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n46
  cau: 'Phím đàn có "điểm thoát" (escapement): ấn quá chậm thì nốt không kêu, quá nhanh thì
    to.'
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n50
  cau: 'Nhịp mơ hồ: nhóm hai nốt trong 9/8 (mắt quen đọc nhóm ba); nốt bắt đầu sau phách và
    nối qua phách.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n52
  cau: 'Đoạn Un poco mosso: tay trái trải rộng hơn một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n66
  cau: Andante là "đi", không phải đứng yên.
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n68
  cau: Rubato chỉ được ghi rõ ở đoạn Tempo rubato.
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n69
  cau: Bài gần như chỉ sống trong vùng từ ppp đến p; chỉ một lần lên f, ở cao trào của đoạn
    B (ô 41).
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n71
  cau: Con sordina ở đầu bài nghĩa là dùng una corda (bàn đạp trái).
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n72
  cau: Una corda làm tiếng mềm và đổi màu, không chỉ làm nhỏ.
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n74
  cau: Debussy được kể là muốn người chơi làm người nghe quên rằng piano có búa.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n76
  cau: Các bản Urtext dựa vào ấn bản 1905 và bản in thử, có phần chú thích các chỗ khác nhau
    giữa các nguồn.
  loai: lich-su
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n77
  cau: Có thể dùng Henle hoặc ấn bản Œuvres complètes.
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n80
  cau: 'Debussy tiếp theo: Rêverie, Arabesque số 1, các bài trong Children''s Corner, rồi
    tập Préludes.'
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n85
  cau: 'Câu hỏi 1: ở đoạn Un poco mosso (ô 27–36), tay trái rải hợp âm liên tục dưới giai
    điệu tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n86
  cau: 'Câu hỏi 2: con sordina ở đầu bài nghĩa là dùng una corda.'
  loai: dinh-nghia
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n89
  cau: 'Nguồn: Henle HN 381, lời tựa của François Lesure: niên đại, các tên gọi ban đầu, lịch
    sử xuất bản.'
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n90
  cau: 'Nguồn: ba sách in (Bhogal, Clair de Lune, OUP 2018; Howat, The Art of French Piano
    Music, Yale 2009; Roberts, Images, Amadeus 1996).'
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n91
  cau: 'Nguồn mới: Verlaine, Fêtes galantes (Gutenberg); bản chép Mutopia theo bản in Fromont
    1905.'
  loai: ten
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n55
  cau: 'Cao trào: lập bản đồ sắc thái, chỗ to nhất là một chỗ duy nhất; dùng trọng lượng cánh
    tay, cổ tay mềm.'
  loai: khuyen-tap
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n87
  cau: 'Câu hỏi 3: chơi pp đều: ngón sát phím, trọng lượng tay thả lỏng, tìm "đáy" phím.'
  loai: khuyen-tap
- trang: piano/tac-pham/debussy-clair-de-lune
  id: n88
  cau: 'Câu hỏi 4: khi tập chậm đoạn mở đầu, đếm to theo móc đơn; phách có nhóm hai nốt đếm
    "1-và".'
  loai: khuyen-tap
