  ghi_chu: "Henle xác nhận biệt danh \"Mondschein\" có sau. Nhưng truyện \"Theodor\" của Rellstab được đăng nhiều kỳ mùa hè 1824 (Berliner allgemeine musikalische Zeitung) theo Crumey; không tìm được nguồn nói viết năm 1823. Nên ghi \"đăng năm 1824\"."
