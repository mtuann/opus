  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn bậc 2 nói nhà xuất bản đặt tên rồi Beethoven đồng ý; ý này thấy ở Wikipedia (dẫn Burkhart, Anthology for Musical Analysis, Schirmer 2004, không mở được) và vài trang phổ thông. BH, Henle, Hewitt đều nói Beethoven tự đặt."
