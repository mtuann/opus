- trang: nghe-nhac/beethoven-pathetique
  id: n12
  luot_2: dung
  nguon: ["https://www.beethoven.de/en/work/view/6166636289589248", "https://www.gutenberg.org/ebooks/39093", "https://www.hyperion-records.co.uk/dc.asp?dc=D_CDA67605"]
  ghi_chu: "BH liệt kê nhiều bản in sớm (André, Simrock, Cranz, Nägeli…); Moscheles tìm thấy bản nhạc ở thư viện Praha năm 1804; Hewitt: \"remains his most popular to this day\"."
- trang: nghe-nhac/beethoven-pathetique
  id: n13
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/39093"]
  ghi_chu: "Lời tựa của Moscheles: \"a boy nine or ten years old, at Prague\"; năm 1804 tìm thấy Sonate pathétique ở thư viện, \"My pocket-money would not suffice for the purchase of it, so I secretly copied it\". Câu ghi \"10 tuổi\"; nguồn nói \"chín hay mười tuổi\" (Moscheles sinh 1794)."
- trang: nghe-nhac/beethoven-pathetique
  id: n14
