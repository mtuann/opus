- trang: nghe-nhac/brahms-intermezzo
  id: n53
  cau: Nốt không nhanh; cái khó là cân bằng các bè trong cùng một bàn tay, giữ legato bằng ngón và bàn đạp, và chơi chùm ba nốt ở bè trầm thật đều.
