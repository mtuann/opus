  loai: nam
- trang: nghe-nhac/brahms-intermezzo
  id: n9
  cau: Tập Op. 118 hoàn thành vào mùa hè 1893 ở thị trấn nghỉ dưỡng Bad Ischl.
  loai: nam
- trang: nghe-nhac/brahms-intermezzo
  id: n10
  cau: Op. 118 gồm bốn intermezzo, một ballade và một romance.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n11
  cau: Từ nơi nghỉ hè ấy, Brahms gửi bản chép tay cho Clara Schumann.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n12
  cau: Clara Schumann là nghệ sĩ piano lừng danh và người bạn thân thiết của Brahms suốt hơn bốn mươi năm.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n13
  cau: Clara là một trong những người đầu tiên được biết các bản mới.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n14
  cau: Clara khen các bản mới chứa cả một kho cảm xúc trong khuôn khổ nhỏ bé.
  loai: lich-su
- trang: nghe-nhac/brahms-intermezzo
  id: n15
  cau: Intermezzo nghĩa đen là "khúc chen giữa".
  loai: dinh-nghia
- trang: nghe-nhac/brahms-intermezzo
  id: n16
  cau: Ở Brahms cuối đời, intermezzo là tên ông đặt cho những bản nhạc piano ngắn, đứng riêng, mang tính trầm tư.
  loai: dinh-nghia
- trang: nghe-nhac/brahms-intermezzo
  id: n17
  cau: "Bản số 2 ghi Andante teneramente: vừa phải như bước đi, dịu dàng."
  loai: dinh-nghia
- trang: nghe-nhac/brahms-intermezzo
  id: n18
  cau: "Ba nốt đầu tiên như một hạt giống: trong đoạn A, nhóm nốt ấy trở lại nhiều lần, mỗi lần trên một hòa âm khác."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n19
  cau: "Bài có ba đoạn: A – B – A."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n20
  cau: Đoạn A ở La trưởng, gồm những câu nhạc bốn ô nhịp cân đối.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n21
  cau: Đoạn A có một quãng giữa bấp bênh hơn trước khi giai điệu đầu quay về.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n22
  cau: Đoạn B chuyển sang Fa♯ thứ, giọng thứ song song của La trưởng.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n23
  cau: Ở chính giữa đoạn B là một khúc hợp xướng (chorale) ở Fa♯ trưởng, chậm và rất nhỏ.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n24
  cau: Rồi Fa♯ thứ trở lại, và cuối cùng đoạn A trở về.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n25
  cau: Phần đệm là một mạng lưới những giọng nhỏ chuyển động chậm, không phải kiểu đệm "bùm-chát".
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n26
  cau: Nhiều chỗ mỗi tay phải chơi hai bè cùng lúc.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n28
  cau: "Trong đoạn Fa♯ thứ có ba lớp rõ rệt: bè trên, bè giữa và bè trầm chạy bằng chùm ba nốt."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n29
  cau: "Bè giữa đáp lại bè trên theo lối canon: nhắc lại bốn nốt mở đầu của bè trên (Đô♯ – Fa♯ – Mi – Rê), chậm hơn một phách."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n30
  cau: Khi Fa♯ thứ trở lại, hai bè trên đổi vai để bè giữa dẫn dắt.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n31
  cau: Brahms giấu đối âm trong một khúc nhạc êm như bài hát ru.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n32
  cau: Ở khúc hợp xướng, Brahms ghi una corda (viết tắt u.c., bàn đạp trái) và legato, rồi ghi tre corde khi Fa♯ thứ trở lại.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n34
  cau: "Bảng theo dõi, dòng 1: mở đầu La trưởng, giai điệu mọc lên từ ba nốt đầu; bên dưới, các bè giữa chuyển động chậm."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n35
  cau: "Bảng theo dõi, dòng 2: câu trả lời bắt đầu giống câu đầu nhưng rẽ sang Mi trưởng."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n36
  cau: "Bảng theo dõi, dòng 3: quãng giữa của đoạn A, hòa âm bấp bênh, đổi màu liên tục."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n37
  cau: "Bảng theo dõi, dòng 4: giai điệu đầu trở lại, khép đoạn A thật nhẹ."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n38
  cau: "Bảng theo dõi, dòng 5: đoạn B Fa♯ thứ, ba lớp âm thanh; bè giữa bắt chước bè trên, bè trầm chạy chùm ba nốt."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n39
  cau: "Bảng theo dõi, dòng 6: khúc hợp xướng Fa♯ trưởng, chậm lại, rất nhỏ."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n40
  cau: "Bảng theo dõi, dòng 7: Fa♯ thứ trở lại, chất liệu đầu đoạn B quay về; nhạc dâng lên cao trào rồi lắng xuống, mở đường cho đoạn A."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n41
  cau: "Bảng theo dõi, dòng 8: đoạn A trở về ở La trưởng."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n42
  cau: "Bảng theo dõi, dòng 9: nhạc lắng dần vào hợp âm La trưởng cuối cùng."
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
  id: n43
  cau: Khi đoạn A trở về, các nốt gần như không đổi.
  loai: cau-truc
- trang: nghe-nhac/brahms-intermezzo
