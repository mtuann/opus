  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n41
  cau: Ravel giao cỗ xe bò (Bydło) cho tuba.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n42
  cau: Ravel giao Schmuÿle cho trumpet câm tiếng (con sordino).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
