  cau: Grieg viết concerto khi còn trẻ (25 tuổi), viết cho piano với tất cả sức vóc của cây đàn.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n13
  cau: Đây là concerto duy nhất Grieg hoàn thành.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n15
  cau: Grieg viết tác phẩm năm 1868 ở Søllerød, một làng trên đảo Sjælland (Đan Mạch).
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n16
  cau: Buổi công diễn ngày 3/4/1869 do Edmund Neupert, người được đề tặng tác phẩm, chơi piano, Holger Simon Paulli chỉ huy.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n17
  cau: Chính Grieg không có mặt ở buổi công diễn.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n18
  cau: Năm 1870, ở Rome, Liszt chơi thị tấu concerto này từ bản viết tay trước các vị khách và khen ngợi nhiệt thành.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n20
  cau: Grieg sửa bản nhạc nhiều lần; những chỗ sửa cuối cùng ông gửi nhà xuất bản vào mùa hè năm 1907, chỉ vài tuần trước khi mất (4/9/1907).
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n21
  cau: Concerto của Grieg và concerto của Schumann cùng giọng La thứ.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n22
  cau: Hai concerto cùng mở đầu bằng một cú "đổ" của piano từ trên cao xuống.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n23
  cau: Hai concerto thường được thu chung một đĩa.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n24
  cau: Grieg học ở Nhạc viện Leipzig; thầy dạy piano của ông là Ernst Ferdinand Wenzel, bạn của Robert Schumann.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n25
  cau: Trong những năm học ở Leipzig, Grieg được nghe Clara Schumann chơi concerto của chồng tại Gewandhaus.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n26
  cau: Cú "đổ" mở đầu được dựng từ mô-típ ba nốt xuống nửa cung rồi xuống một quãng ba trưởng (La – Sol♯ – Mi), một nét quen trong dân ca Na Uy.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n27
  cau: 'Bàn phím ::cong-cu{ten="piano" range="C5-C6" notes="A5 G#5 E5"}: ba nốt được tô là La5, Sol♯5, Mi5 (mô-típ của cú "đổ").'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n28
  cau: Chương cuối mang nhịp điệu halling, điệu nhảy dân gian Na Uy nhịp hai, xưa thường do nam giới nhảy, với những động tác nhào lộn như cú đá văng chiếc mũ treo trên cao.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n30
  cau: "Grieg viết cho piano rất dày: hợp âm đầy, quãng tám chạy khắp bàn phím, những chuỗi nốt đổ xuống."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n33
  cau: "Cadenza ở cuối chương 1 do Grieg viết sẵn: piano một mình đi từ trầm lắng đến những hợp âm vang khắp bàn phím."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n34
  cau: Ở chương 2, piano nhẹ, với những nét trang trí ở âm vực cao.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n37
  cau: Bản thu do Neal O'Doan chơi piano cùng University of Washington Symphony, Peter Erős chỉ huy.
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n39
  cau: "Bảng theo dõi, dòng 1: I. Mở đầu: trống timpani vê to dần, rồi piano đổ ào xuống từ trên cao bằng mô-típ La – Sol♯ – Mi."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n40
  cau: "Dòng 2: chủ đề chính (La thứ): dàn nhạc giới thiệu một giai điệu nhẹ, nhịp nhàng; piano tiếp lời."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n41
  cau: "Dòng 3: chủ đề thứ hai (Đô trưởng): trữ tình, đàn cello hát trước, rồi đến piano."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n42
  cau: "Dòng 4: phát triển: chủ đề chính chuyền qua lại giữa piano và dàn nhạc, căng thẳng hơn."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n43
  cau: "Dòng 5: tái hiện: chủ đề thứ hai trở lại, lần này ở La trưởng."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n44
  cau: 'Dòng 6: cadenza: piano một mình, từ trầm lắng đến bùng nổ; dàn nhạc vào lại, chương khép bằng cú "đổ" như lúc mở đầu.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n45
  cau: "Dòng 7: II. Adagio (Rê♭ trưởng): đàn dây câm tiếng hát giai điệu; piano bước vào với những nét trang trí ở âm vực cao."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n46
  cau: "Dòng 8: chủ đề chương 2 trở lại trên piano với những hợp âm đầy và mạnh; rồi nhạc nối thẳng sang chương 3."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n47
  cau: "Dòng 9: III. Halling: sau phần dẫn của dàn nhạc và một đoạn piano tự do ngắn, piano vào điệu nhảy nhịp 2/4, La thứ."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n48
  cau: "Dòng 10: chủ đề sáo (Fa trưởng): sáo độc tấu hát một giai điệu đồng quê, piano tiếp lời."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n49
  cau: "Dòng 11: halling trở lại, rồi biến thành nhịp 3/4 rất nhanh (Quasi presto)."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n50
  cau: "Dòng 12: Andante maestoso: chủ đề sáo trở lại ở La trưởng, cả dàn nhạc và piano, hoành tráng đến hợp âm cuối."
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n51
  cau: 'Câu hỏi 1 ngầm nói: mô-típ La – Sol♯ – Mi lặp lại trong cú "đổ" mở đầu và xuất hiện lại ở cuối chương 1.'
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n53
  cau: "Dinu Lipatti (với nhạc trưởng Alceo Galliera và Philharmonia Orchestra): bản thu năm 1947 cho EMI."
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n54
  cau: "Krystian Zimerman (với Herbert von Karajan và Berliner Philharmoniker, Deutsche Grammophon): đĩa ghép cùng concerto của Schumann."
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n55
  cau: Leif Ove Andsnes là nghệ sĩ Na Uy, đã thu cả concerto lẫn nhiều Lyric Pieces.
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n58
  cau: "Concerto này thuộc trình độ biểu diễn chuyên nghiệp: RCM đưa nó vào danh sách concerto của bằng LRCM dành cho người biểu diễn."
  loai: cap-do
- trang: nghe-nhac/grieg-concerto
  id: n59
  cau: Concerto đòi hỏi hợp âm và quãng tám nặng, sức bền và khả năng chơi cùng dàn nhạc.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n60
  cau: Lyric Pieces (Tiểu phẩm trữ tình) là các tập tác phẩm piano của chính Grieg.
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n61
  cau: Arietta là Op. 12 số 1.
  loai: danh-muc
- trang: nghe-nhac/grieg-concerto
  id: n63
  cau: "Notturno Op. 54 số 4: RCM xếp ở Level 9 (đề cương 2022)."
  loai: cap-do
- trang: nghe-nhac/grieg-concerto
  id: n64
  cau: Ngày cưới ở Troldhaugen là Op. 65 số 6, có hợp âm và quãng tám mang dáng dấp concerto.
  loai: cau-truc
- trang: nghe-nhac/grieg-concerto
  id: n65
  cau: Concerto được học cùng một người chơi đàn piano thứ hai, đảm nhận phần dàn nhạc rút gọn.
  loai: lich-su
- trang: nghe-nhac/grieg-concerto
  id: n67
  cau: "Nguồn: IMSLP có bản nhạc concerto, có cả bản rút gọn cho hai đàn piano."
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n68
  cau: "Nguồn: Finn Benestad và Dag Schjelderup-Ebbe, Edvard Grieg: The Man and the Artist (1988)."
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n69
  cau: "Nguồn: lời tựa ấn bản Urtext của Henle (HN 719) về lịch sử sáng tác, công diễn, xuất bản và các lần sửa."
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n70
  cau: "Nguồn: bản thu Neal O'Doan và University of Washington Symphony trên Wikimedia Commons, từ bộ sưu tập Al Goldstein (Pandora Music)."
  loai: ten
- trang: nghe-nhac/grieg-concerto
  id: n31
  cau: Hãy nghe cách nghệ sĩ giữ tiếng đàn vang mà không gắt khi đối đầu với cả dàn nhạc.
  loai: khuyen-tap
- trang: nghe-nhac/grieg-concerto
  id: n35
  cau: Những nét trang trí ở âm vực cao cần bàn đạp thật tinh.
  loai: khuyen-tap
- trang: nghe-nhac/grieg-concerto
  id: n56
  cau: Nghe cách Andsnes nhấn nhịp điệu halling ở chương cuối.
  loai: khuyen-tap
- trang: nghe-nhac/mussorgsky-tranh
  id: n1
  cau: "Nhà soạn nhạc: Modest Mussorgsky (1839–1881)."
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n2
  cau: "Tên đầy đủ: Kartinki s vystavki (Картинки с выставки, Những bức tranh ở phòng triển lãm), tổ khúc cho piano."
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n3
  cau: Sáng tác từ 2 đến 22/6/1874.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n4
  cau: Tác phẩm tưởng nhớ Viktor Hartmann và đề tặng Vladimir Stasov.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n5
  cau: Tác phẩm được in năm 1886, sau khi tác giả mất, qua bản biên tập của Rimsky-Korsakov.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n6
  cau: "Thời kỳ: Lãng mạn (trường phái dân tộc Nga)."
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n7
  cau: "Thể loại: tổ khúc piano, âm nhạc chương trình."
  loai: dinh-nghia
- trang: nghe-nhac/mussorgsky-tranh
  id: n8
  cau: Độ dài khoảng 30–35 phút.
  loai: so-lieu
- trang: nghe-nhac/mussorgsky-tranh
  id: n9
  cau: Bản phối khí nổi tiếng nhất là của Maurice Ravel (1922).
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n10
  cau: Viktor Hartmann là kiến trúc sư, họa sĩ và bạn thân của Mussorgsky.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n11
  cau: Hartmann qua đời năm 1873, mới 39 tuổi.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n12
  cau: Đầu năm 1874, nhà phê bình Vladimir Stasov góp phần tổ chức một triển lãm tưởng niệm các bản vẽ và tranh màu nước của Hartmann ở Viện Hàn lâm Nghệ thuật, Saint Petersburg.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n13
  cau: Mussorgsky viết tổ khúc chỉ trong ba tuần tháng 6/1874.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n14
  cau: Mussorgsky là thành viên "Nhóm Năm người".
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n15
  cau: Tổ khúc gồm mười "bức tranh" (bài đánh số 1–10).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n16
  cau: Tổ khúc là một ví dụ kinh điển của âm nhạc chương trình.
  loai: dinh-nghia
- trang: nghe-nhac/mussorgsky-tranh
  id: n18
  cau: Không phải bức nào Mussorgsky nhắc tới cũng còn tìm được; trong số những bản còn lại có phác thảo trang phục gà con trong vỏ trứng và chiếc đồng hồ hình túp lều của mụ phù thủy Baba Yaga.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n19
  cau: Hartmann thiết kế một cổng thành cho Kiev (Kyiv), chưa bao giờ được xây.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n20
  cau: Promenade mở đầu bằng một giọng hát đơn độc, rồi cả khối hợp âm đáp lại.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n21
  cau: Promenade đầu tiên xen kẽ nhịp 5/4 và 6/4.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n22
  cau: Promenade là chính người xem tranh (Mussorgsky dạo qua phòng triển lãm).
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n23
  cau: Promenade trở lại giữa các bức tranh, mỗi lần một tâm trạng.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n24
  cau: Theo Stasov, qua những đoạn Promenade Mussorgsky vẽ chính mình đang dạo qua phòng tranh, lúc vui lúc buồn khi nhớ người bạn đã mất.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n25
  cau: Promenade thành lời than ở giọng thứ trong Cum mortuis.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n26
  cau: Promenade vang lên giữa tiếng chuông ở Cổng lớn thành Kiev.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n27
  cau: Bản in năm 1886 của Rimsky-Korsakov sửa nhiều chỗ và có cả lỗi đọc nhầm.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n28
  cau: Bản phối của Ravel do nhạc trưởng Serge Koussevitzky đặt hàng.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n29
  cau: Bản phối của Ravel công diễn lần đầu ở Paris tháng 10/1922.
  loai: nam
- trang: nghe-nhac/mussorgsky-tranh
  id: n30
  cau: Ravel dựa vào bản Rimsky-Korsakov.
  loai: lich-su
- trang: nghe-nhac/mussorgsky-tranh
  id: n31
  cau: Ravel bỏ Promenade thứ năm (Promenade trước Limoges).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n32
  cau: Nếu chỉ biết tác phẩm qua bản Ravel, bản piano nghe khác hẳn.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n33
  cau: Bydło là tiếng Ba Lan, nghĩa là gia súc; bài tả một cỗ xe bò.
  loai: ten
- trang: nghe-nhac/mussorgsky-tranh
  id: n34
  cau: Trong bản thảo của Mussorgsky, Bydło bắt đầu rất mạnh (ff).
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n35
  cau: Ở Bydło, tay trái chơi những hợp âm nặng đều đặn như bánh xe lăn.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
  id: n36
  cau: Ở Bydło, xe bò xa dần đến ppp.
  loai: cau-truc
