  cau: Commons ghi bản thu Meyer thuộc phạm vi công cộng ở châu Âu, nhưng ở Mỹ nó vẫn còn được bảo hộ (theo luật Mỹ, bản thu thực hiện trước năm 1972 và phát hành từ năm 1947 trở đi vẫn còn được bảo hộ).
