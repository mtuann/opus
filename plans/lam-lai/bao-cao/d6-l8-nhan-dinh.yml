  cau: Chopin biến prelude thành một bản nhạc đứng riêng, ngắn, chỉ một ý; 24 prélude Op. 28 của ông đi qua đủ 24 giọng.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
