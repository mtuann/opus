  cau: Các prélude của Debussy không theo vòng giọng nào.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n16
  cau: Theo ngày Debussy ghi trên bản thảo, quyển 1 được viết xong trong chưa đầy hai tháng, từ tháng 12/1909 đến đầu tháng 2/1910, dù vài bản đã có phác thảo từ những năm 1907–1908.
  loai: nam
- trang: nghe-nhac/debussy-preludes
  id: n17
  cau: Mỗi bản có một cái tên gợi hình, in ở cuối bản nhạc, trong ngoặc đơn và sau dấu ba chấm, như (...Voiles).
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n18
  cau: "Người chơi và người nghe gặp âm nhạc trước rồi mới biết bức tranh: cái tên là một lời gợi ý, không phải câu chuyện bắt buộc phải theo."
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n19
  cau: "Nguồn cảm hứng: ba vũ nữ chạm trên một cột đá cổ ở Delphi, một câu thơ của Baudelaire, một truyền thuyết xứ Bretagne, tinh linh Puck của Shakespeare, phong cảnh miền Nam nước Ý, những gánh hát giải trí của Mỹ."
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n20
  cau: Ở Mozart hay Beethoven, hòa âm như một con đường (rời nhà, căng thẳng, trở về); ở Debussy, mỗi hợp âm được nghe như một màu.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n21
  cau: Voiles dùng gam toàn cung, gam không có nốt chủ để 'về nhà'.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n22
  cau: La fille aux cheveux de lin dùng gam ngũ cung.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n23
  cau: Gam ngũ cung rất quen tai với người nghe nhạc Việt.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n24
  cau: La cathédrale engloutie có những chuỗi hợp âm trượt song song như thánh ca thời Trung cổ.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n25
  cau: Debussy dùng những nốt trầm ngân dài làm nền cho cả một đoạn.
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n26
  cau: Giới phê bình gọi lối viết này là 'ấn tượng', theo tên trường phái hội họa của Monet.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n27
  cau: Chính Debussy không ưa cái nhãn 'ấn tượng'.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n28
  cau: "Tiếng đàn ở đây phụ thuộc nhiều vào bàn đạp và cách chạm phím: nốt trầm được giữ ngân trong khi hòa âm bên trên đổi màu, các tầng âm thanh trải từ đáy đến đỉnh bàn phím, phần lớn ở sắc thái rất nhỏ."
  loai: cau-truc
- trang: nghe-nhac/debussy-preludes
  id: n30
  cau: Theo hồi ức của nghệ sĩ piano Marguerite Long, một câu Debussy hay nói là phải quên rằng cây đàn piano có búa.
  loai: lich-su
- trang: nghe-nhac/debussy-preludes
  id: n31
  cau: Bản thu gợi ý là của nghệ sĩ piano người Pháp Marcelle Meyer.
  loai: ten
