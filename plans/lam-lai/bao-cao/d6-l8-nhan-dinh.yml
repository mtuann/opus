  cau: Những nốt lặp dồn dập như chân giậm và răng va lập cập.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n19
  cau: Chương 1 cũng viết theo hình thức ritornello như Mùa xuân.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n21
  cau: "Hai concerto là một cặp đối xứng: xuân–đông, trưởng–thứ."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n23
  cau: "Bảng theo dõi, dòng 1: mở đầu, cả dàn nhạc: những nốt lặp lại đều đều, các bè lần lượt vào và chồng lên nhau thành hợp âm chói tai; violin độc tấu thêm những nốt láy rền. Câu thơ: run cầm cập giữa tuyết giá."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n24
  cau: "Dòng 2: violin độc tấu, những chuỗi nốt chạy rất nhanh, mỗi đợt lên cao hơn đợt trước. Câu thơ: gió dữ thổi buốt."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n25
  cau: "Dòng 3: dàn nhạc, những nốt lặp lại dồn dập, hợp âm đổi liên tục. Câu thơ: chạy, giậm chân liên hồi."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n26
  cau: "Dòng 4: violin độc tấu và dàn nhạc thay phiên nhau, rồi những nốt lặp chồng lên nhau của đoạn mở đầu trở lại."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n27
  cau: "Dòng 5: những nốt lặp dồn dập của violin độc tấu (nốt kép rung nhanh), dàn nhạc đệm nhỏ. Câu thơ: rét quá, răng va lập cập."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n28
  cau: 'Dòng 6: kết: cả dàn nhạc trở lại những nốt lặp dồn dập của đoạn "giậm chân", rồi hai lần kết trọn dứt khoát ở Fa thứ.'
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-dong
  id: n29
  cau: Cảnh trượt ngã trên băng nằm ở chương 3.
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-dong
  id: n30
  cau: "Nguồn: bản nhạc và tổng phổ trên IMSLP."
  loai: ten
- trang: nghe-nhac/vivaldi-mua-dong
  id: n31
  cau: "Nguồn: thứ tự các đoạn và câu thơ in trong bản nhạc theo tổng phổ Mutopia (Mutopia-2010/02/08-351, theo bản in chụp lại của Performers' Facsimiles, CC BY-SA 3.0)."
  loai: ten
- trang: nghe-nhac/vivaldi-mua-dong
  id: n32
  cau: "Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online."
  loai: ten
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n1
  cau: "Tiêu đề: Vivaldi, Bốn Mùa – Mùa xuân, chương 1."
  loai: ten
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n2
  cau: 'Mô tả trang: mỗi concerto trong Bốn Mùa đi kèm một bài thơ sonnet mô tả cảnh vật, có lẽ do chính Vivaldi viết; âm nhạc "vẽ" lại từng câu thơ.'
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n3
  cau: "Nhà soạn nhạc: Antonio Vivaldi (1678–1741)."
  loai: nam
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n4
  cau: "Tên đầy đủ: Concerto cung Mi trưởng, Op. 8 số 1, RV 269 La primavera."
  loai: danh-muc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n5
  cau: Xuất bản năm 1725, trong tập Il cimento dell'armonia e dell'inventione.
  loai: nam
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n6
  cau: "Thời kỳ: Baroque."
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n7
  cau: "Thể loại: concerto cho violin độc tấu, dàn dây và bè trầm liên tục."
  loai: ten
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n8
  cau: "Độ dài chương 1: khoảng 3–4 phút."
  loai: so-lieu
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n9
  cau: Mỗi concerto trong Bốn Mùa đi kèm một bài thơ sonnet mô tả cảnh vật.
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n10
  cau: Các sonnet có lẽ do chính Vivaldi viết.
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n11
  cau: Âm nhạc "vẽ" lại từng câu thơ.
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n12
  cau: Đây là một ví dụ nổi tiếng của âm nhạc miêu tả.
  loai: lich-su
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n13
  cau: Chương 1 viết theo hình thức ritornello, hình thức đặc trưng của concerto Baroque.
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n14
  cau: Ritornello là tiếng Ý, nghĩa là "lần quay lại nhỏ".
  loai: dinh-nghia
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n15
  cau: Ritornello là một đoạn nhạc chính do cả dàn nhạc chơi, quay lại nhiều lần, xen giữa là các đoạn độc tấu của violin.
  loai: dinh-nghia
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n16
  cau: "Bảng theo dõi, dòng 1: ritornello, cả dàn nhạc, giai điệu vui tươi, mỗi câu nhắc lại nhỏ như tiếng vọng. Câu thơ: Mùa xuân đã đến."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n17
  cau: "Dòng 2: violin độc tấu và hai violin khác láy rền, hót líu lo. Câu thơ: chim chóc chào xuân bằng tiếng hót."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n18
  cau: "Dòng 3: ritornello trở lại."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n19
  cau: "Dòng 4: dàn dây chơi nhỏ, chuyển động đều đặn, lăn tăn. Câu thơ: suối chảy rì rào trong gió nhẹ."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n20
  cau: "Dòng 5: ritornello trở lại."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n21
  cau: "Dòng 6: tremolo nhanh và các chuỗi nốt đi lên vụt qua, giọng chuyển sang thứ. Câu thơ: sấm sét kéo đến, mây đen phủ trời."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n22
  cau: "Dòng 7: ritornello trở lại, giọng thứ."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n23
  cau: "Dòng 8: tiếng chim hót trở lại. Câu thơ: bão tan, chim lại cất tiếng hót."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n24
  cau: "Dòng 9: ritornello trở lại, cả dàn nhạc nhắc nhịp điệu của câu mở đầu."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n25
  cau: "Dòng 10: violin độc tấu thêm một đoạn ngắn, chuỗi nốt nhanh, chỉ có bè trầm liên tục đệm."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n26
  cau: "Dòng 11: ritornello cuối cùng; câu cuối nhắc lại nhỏ như tiếng vọng."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n27
  cau: Il Giardino Armonico và Europa Galante là các nhóm chuyên nhạc Baroque, có thu Bốn Mùa.
  loai: ten
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n28
  cau: "Nguồn: bản nhạc và tổng phổ trên IMSLP."
  loai: ten
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n29
  cau: "Nguồn: thứ tự các đoạn trong bảng theo dõi, nhất là phần cuối (Tutti ở ô 66, Solo từ giữa ô 70, Tutti ở ô 76), theo tổng phổ LilyPond của Mutopia (Mutopia-2010/02/08-301, theo Performers' Facsimiles, CC BY-SA 3.0)."
  loai: cau-truc
- trang: nghe-nhac/vivaldi-mua-xuan
  id: n30
  cau: "Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online."
