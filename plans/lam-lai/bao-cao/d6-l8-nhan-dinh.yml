  cau: Bản in năm 1886 của Rimsky-Korsakov bỏ chữ ff ở đầu Bydło và chỉ ghi to dần (cresc.) ở giữa bài.
  loai: cau-truc
- trang: nghe-nhac/mussorgsky-tranh
