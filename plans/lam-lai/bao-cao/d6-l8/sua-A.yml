# Sửa dữ liệu đề xuất ở lượt 1, phần A của D6-L8 (src/data/ chưa sửa). Brahms Intermezzo và Mussorgsky: không có mục (mọi trường lần 2 đúng).
- ban_ghi: tac-pham/debussy-preludes
  truong: ban_thu
  cu: "ban_thu[0].lic: phạm vi công cộng"
  moi: "ban_thu[0].lic: phạm vi công cộng ở châu Âu (theo Commons); ở Mỹ còn bảo hộ"
  nhan_dinh: n12
  nguon:
    - https://commons.wikimedia.org/wiki/File:Claude_Debussy_-_Pr%C3%A9ludes_(Livre_I)_-_X._La_Cath%C3%A9drale_engloutie_(Marcelle_Meyer,_1956).flac
    - https://commons.wikimedia.org/wiki/Template:PD-US-record
    - https://commons.wikimedia.org/wiki/Template:PD-EU-audio
  ly_do: 'Commons gắn PD-EU-audio và PD-US-record; chữ của PD-US-record (Music Modernization Act): bản thu cố định trước 1972, phát hành 1947–1956 còn bảo hộ 110 năm, sau 1956 tới 15/2/2067. Chữ "phạm vi công cộng" không kèm nơi mâu thuẫn với trang hướng dẫn nghe (hồ sơ trang n34) và với cap-nhat n48 (đã sửa vì cùng lý do). lic hiện ra cạnh tên người chơi trong khối nghe (src/scripts/nghe.js). Không đổi hành vi phát: khối vẫn chỉ dẫn link vì parts không có mp3. Nếu người giao muốn ngắn hơn: "phạm vi công cộng ở EU, còn bảo hộ ở Mỹ". check_audio.py có kiểm lic với Commons hay không: người giao xem trước khi áp.'
# Chủ lô D6-L8 đã áp (06/11/2026), nhưng vào ban_thu[0].note thay cho lic: lic phải là tên giấy phép trong tools/audio/licenses.py
