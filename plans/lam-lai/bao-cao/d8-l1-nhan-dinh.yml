  id: n37
  cau: "Học trực tuyến: thầy trò không thể chơi cùng lúc hay đếm nhịp cho nhau qua mạng; thầy làm mẫu, bạn nghe rồi chơi lại; máy đếm nhịp đặt ở phía bạn."
