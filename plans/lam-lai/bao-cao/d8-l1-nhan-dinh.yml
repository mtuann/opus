  loai: lich-su
- trang: piano/thay-va-thi
  id: n35
  cau: "Zoom: Settings → Audio, chọn Original sound for musicians, tắt Automatically adjust microphone volume; bật High-fidelity music mode nếu dùng mạng dây; chỉ bật Echo cancellation khi dùng loa thay vì tai nghe."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n36
  cau: Ứng dụng nào không có chế độ cho nhạc thì bộ lọc tiếng ồn có thể "nuốt" những nốt nhỏ và tiếng ngân.
