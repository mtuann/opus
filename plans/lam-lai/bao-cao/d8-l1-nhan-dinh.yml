- trang: piano/thay-va-thi
  id: n23
  cau: "Trinity: tổng 100 điểm; từ 60 là đỗ, 75 khá, 87 xuất sắc."
  loai: so-lieu
- trang: piano/thay-va-thi
  id: n24
  cau: "Trinity không có điều kiện đầu vào: không cần đỗ cấp thấp hơn hay thi nhạc lý trước, kể cả với Grade 6–8."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n25
  cau: "ABRSM: ARSM dành cho người đã qua Grade 8, thi trực tiếp (nơi có tổ chức) hoặc qua video; LRSM và FRSM theo định dạng mới từ 2024, nộp video buổi biểu diễn kèm tài liệu bổ trợ; cả ba yêu cầu đã đỗ Grade 8 ABRSM (Performance hoặc Practical) hay bằng tương đương của hội đồng thi khác trong danh sách ABRSM chấp nhận."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n26
  cau: Các bằng DipABRSM, LRSM và FRSM kiểu cũ đã được ABRSM ngừng.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n27
  cau: Trinity có các bằng ATCL, LTCL, FTCL (Associate, Licentiate, Fellowship) ở các mảng biểu diễn, giảng dạy và lý thuyết.
