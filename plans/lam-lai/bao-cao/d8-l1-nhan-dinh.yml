  id: n30
  cau: Henle xếp Für Elise và Invention số 1 cùng mức 3, còn Clair de lune và K. 545 cùng mức 5.
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n32
  cau: Mức 7 của Sonata Ánh trăng là cho cả bản, gồm chương 3 Presto agitato rất khó; riêng chương 1 thì site xếp ở chặng 5.
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n41
  cau: Bản Urtext (G. Henle Verlag, Wiener Urtext, Bärenreiter) cho đúng những gì nhà soạn nhạc viết; IMSLP có bản quét miễn phí của hầu hết các tác phẩm cũ; với Chopin có Ấn bản Quốc gia Ba Lan (Wydanie Narodowe) do Jan Ekier biên tập.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n43
  cau: "Bảng chặng 1: Türk, Handstücke für angehende Klavierspieler (Bài cho người mới học đàn, 1792 và 1795)."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n44
  cau: "Bảng chặng 1: Stravinsky, Les cinq doigts (Năm ngón tay, 1921)."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n45
  cau: "Bảng chặng 1: Kurtág, Játékok, bộ sưu tập bắt đầu từ năm 1973."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n46
  cau: "Bảng chặng 2: Sổ nhạc cho Anna Magdalena Bach (1725); Hành khúc Rê trưởng Anh. 122 thường được cho là của C. P. E. Bach; Musette Rê trưởng Anh. 126; Mozart K. 1a, K. 2, K. 3 là những bài viết lúc 5–6 tuổi, ghi trong sổ nhạc của chị gái Nannerl; Petzold: Minuet Sol trưởng BWV Anh. 114 và Sol thứ BWV Anh. 115."
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n47
  cau: "Bảng chặng 2: Schumann Op. 68 — Melodie (số 1), Soldatenmarsch (số 2), Wilder Reiter (số 8), Fröhlicher Landmann (số 10); Tchaikovsky Op. 39 — Old French Song, The Sick Doll; Kabalevsky Op. 39 — Clowns (số 20)."
  loai: danh-muc
- trang: piano/tac-pham-theo-cap
  id: n49
  cau: 'Bảng chặng 1–7: cột "Học được gì" (kỹ năng mỗi bài dạy) và số danh mục, năm của các bài không có bản ghi (khoảng 170 hàng).'
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n50
  cau: "Bảng chặng 6: Ravel, Menuet sur le nom d'Haydn (1909)."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n51
  cau: "Bảng chặng 4: Bach Invention số 1 (BWV 772) và Invention số 8 (BWV 779) ở chặng 4 (Grade 4–5); Invention số 4 (BWV 775) và số 13 (BWV 784) ở chặng 5."
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n52
  cau: "Bảng chặng 5: Chopin Nocturne Mi thứ Op. 72 số 1 và Nocturne Đô♯ thứ (di cảo, B. 49) ở chặng 5 (Grade 6)."
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n53
  cau: "Chặng 6: Impromptu Op. 90 (D. 899) số 2 (Mi♭ trưởng) ở chặng 6; số 3 (Sol♭ trưởng) ở chặng 7."
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n54
  cau: "Chặng 7 (sau Grade 8): các bằng diploma của ABRSM (ARSM, LRSM, FRSM) và Trinity (ATCL, LTCL, FTCL) có danh sách tác phẩm riêng."
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n58
  cau: "River Flows in You: giọng La trưởng, nhịp 4/4, mở đầu tự do (Freely, flowing) rồi vừa phải (Moderately, expressively), theo bản in trên Musicnotes."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n59
  cau: "Kiss the Rain: La♭ trưởng, 4/4, ♩ = khoảng 76 (Musicnotes)."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n60
  cau: "One Summer's Day: Đô trưởng, 4/4, ♩ = 80 theo bản piano solo trên Musicnotes."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n61
  cau: "Mariage d'Amour: Sol thứ, chủ yếu 4/4 (có vài chỗ đổi nhịp), ♩ khoảng 72; Comptine d'un autre été: Mi thứ, 4/4, ♩ = 100; Nuvole bianche: Fa thứ, mở đầu 4/4 ♩ khoảng 40, phần chính 12/8 (♩. = 78)."
  loai: so-lieu
- trang: piano/tac-pham-theo-cap
  id: n62
  cau: Yiruma (tên thật Lee Ru-ma, sinh 1978); River Flows in You trong album First Love (2001, Stomp Music); Kiss the Rain trong From the Yellow Room (2003).
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n63
  cau: Hai tập SOLO của Faber Music (Original, Easy) in các bài trong album SOLO (2021) nhân 20 năm sáng tác của Yiruma; Andrew Eales xếp tập gốc quanh Grade 5 và tập dễ quanh Grade 3 (Pianodao 2023).
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n64
  cau: "River Flows in You không phải nhạc phim Twilight (2008): bài nằm trong album First Love từ 2001, bài hay bị nhầm với Bella's Lullaby của Carter Burwell."
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n65
  cau: Joe Hisaishi (sinh 1950); One Summer's Day mở đầu album nhạc phim Spirited Away (2001), tên tiếng Nhật Ano natsu e, "Về mùa hè ấy"; dàn nhạc New Japan Philharmonic, Hisaishi chỉ huy và chơi piano.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n66
  cau: Itsumo nando demo (Always with Me) trong phim Spirited Away có nhạc của Youmi Kimura và lời của Wakako Kaku; ABRSM ghi tên Youmi Kimura (không ghi Hisaishi) khi đưa một bản soạn của bài vào danh sách Grade 3 (2025–2026).
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n66b
  cau: ABRSM đưa il porco rosso (từ phim Porco Rosso, 1992) của Joe Hisaishi vào danh sách Grade 8 (2025–2026), tức chặng 6; Summer là nhạc phim Kikujiro (1999) của Takeshi Kitano, không phải phim Ghibli.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n67
  cau: Paul de Senneville (1933–2023); cùng Olivier Toussaint lập hãng Delphine; Mariage d'Amour sáng tác 1978, Clayderman thu lần đầu trong album Lettre à ma mère (1979).
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n68
  cau: Bài "Spring Waltz" bị gán nhầm cho Chopin; nhầm lẫn bắt đầu từ một video đăng bản thu của George Davidson dưới tên sai, có hàng chục triệu lượt xem trước khi bị gỡ.
  loai: lich-su
- trang: piano/tac-pham-theo-cap
  id: n69
  cau: "Yann Tiersen (sinh 1970); Comptine d'un autre été: l'après-midi trong album nhạc phim Amélie (Virgin, 2001); album Rue des Cascades (1996) có ba bài Comptine d'été số 1–3, là những bài khác."
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n70
  cau: AMEB đưa Comptine d'un autre été và Nuvole bianche vào tập Piano for Leisure Series 4, Grade 6.
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n71
  cau: Ludovico Einaudi (sinh 1955); Nuvole bianche trong album Una mattina (2004); tên nghĩa là "Mây trắng"; Decca phát hành lại album nhân 20 năm; Chester Music có hai tập Graded Pieces for Piano (Preparatory–Grade 2 và Grade 3–5) đều có bài này.
  loai: nam
- trang: piano/tac-pham-theo-cap
  id: n73
  cau: Chương trình piano 2027–2028 của ABRSM dùng được từ 1/1/2027.
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n74
  cau: "Danh sách bài thi của ABRSM và Trinity College London: chia sẵn theo cấp, trộn nhiều thời kỳ; ABRSM, Trinity có trang web ở abrsm.org, trinitycollege.com."
  loai: cap-do
- trang: piano/tac-pham-theo-cap
  id: n75
  cau: "Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred, 1995); Maurice Hinson và Wesley Roberts, Guide to the Pianist's Repertoire, ấn bản 4 (Indiana University Press, 2014): sách tra cứu xếp tác phẩm theo mức khó."
  loai: ten
- trang: piano/tac-pham-theo-cap
  id: n33
  cau: Hãy dùng các thang để so sánh tương đối, đừng coi chúng là phép đo chính xác.
  loai: khuyen-tap
- trang: piano/tac-pham-theo-cap
  id: n37
  cau: "Người lớn thường muốn đi thẳng tới bài mình yêu: Clair de lune, Ballade số 1, chương cuối Ánh trăng."
  loai: khuyen-tap
- trang: piano/tac-pham-theo-cap
  id: n35
  cau: Số bài đã học là thứ làm bạn tiến nhanh nhất; mười bài vừa sức trong một năm dạy bạn nhiều hơn một bài quá sức trong cùng khoảng thời gian.
  loai: khuyen-tap
- trang: piano/thay-va-thi
  id: n5
  cau: Grade là thang độ khó của các hội đồng thi Anh, từ Initial (trước Grade 1) đến Grade 8.
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n8
  cau: ABRSM và Trinity College London là hai hội đồng thi của Anh.
  loai: ten
- trang: piano/thay-va-thi
  id: n9
  cau: "ABRSM có Initial Grade và Grade 1 đến Grade 8, với hai hình thức thi: Practical Grades và Performance Grades."
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n10
  cau: "Practical Grades: 3 bài (mỗi bài từ một danh sách A, B, C), gam và hợp âm rải (chơi thuộc), thị tấu, kiểm tra nghe; thi trực tiếp với giám khảo."
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n11
  cau: "Performance Grades: 4 bài chơi liền một mạch, ít nhất một bài từ mỗi danh sách A, B, C, bài thứ tư lấy trong danh sách hoặc tự chọn; không có gam, thị tấu, kiểm tra nghe."
  loai: dinh-nghia
- trang: piano/thay-va-thi
  id: n12
  cau: "Performance Grades: tự quay video một lượt liền, không cắt ghép, rồi nộp trực tuyến."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n13
  cau: "Chấm điểm: tổng 150; từ 100 là đỗ (Pass), 120 khá (Merit), 130 xuất sắc (Distinction); Performance Grades cùng thang 150, mỗi bài một điểm, cộng một điểm cho cả màn trình diễn."
  loai: so-lieu
- trang: piano/thay-va-thi
  id: n15
  cau: Muốn thi ABRSM Grade 6, 7 hoặc 8, ở cả hai hình thức, phải đã đỗ Grade 5 Music Theory hoặc Grade 5 Practical Musicianship (hay cấp cao hơn), hoặc Grade 5 một nhạc cụ jazz độc tấu; các chứng chỉ tương đương được chấp nhận có danh sách trên website ABRSM.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n16
  cau: Chương trình piano 2027–2028 dùng được từ 1/1/2027; trong năm 2027, các bài của chương trình 2025–2026 vẫn được chơi, đến hết 31/12/2027; chọn một trong hai chương trình, các bài phải lấy từ cùng một chương trình.
  loai: cap-do
- trang: piano/thay-va-thi
  id: n17
  cau: Chơi thuộc các tác phẩm là tùy chọn và không được cộng điểm trực tiếp; gam và hợp âm rải thì phải chơi thuộc.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n18
  cau: Với Performance Grades, đàn điện được chấp nhận nếu có phím cỡ chuẩn, có trọng lượng và cảm ứng lực.
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n19
  cau: Trinity có Initial và Grade 1–8; chương trình piano hiện hành là bộ "từ 2023", không có ngày hết hạn (có hiệu lực đến khi có thông báo mới), và các bài trong sách 2021–2023 vẫn được dùng.
  loai: cap-do
- trang: piano/thay-va-thi
  id: n20
  cau: "Trinity thi trực tiếp: 3 bài (66 điểm), phần kỹ thuật gồm gam, hợp âm rải và bài tập kỹ thuật (14 điểm), và hai phần kiểm tra bổ trợ (20 điểm)."
  loai: so-lieu
- trang: piano/thay-va-thi
  id: n21
  cau: "Từ Initial đến Grade 5, chọn hai trong bốn phần bổ trợ: thị tấu, nghe, ứng tác, kiến thức âm nhạc; ở Grade 6–8 các lựa chọn hẹp hơn."
  loai: quy-tac
- trang: piano/thay-va-thi
  id: n22
  cau: "Trinity thi qua video: hoặc 3 bài kèm phần kỹ thuật, hoặc 4 bài."
