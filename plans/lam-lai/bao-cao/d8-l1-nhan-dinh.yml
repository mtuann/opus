- trang: piano/thay-va-thi
  id: n31
  cau: "Ba cơ sở đào tạo âm nhạc chuyên nghiệp lớn có đào tạo piano: Học viện Âm nhạc Quốc gia Việt Nam (Hà Nội), Nhạc viện Thành phố Hồ Chí Minh, Học viện Âm nhạc Huế."
