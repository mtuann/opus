  cau: "Khối kiểm tra nhanh, câu 1 và 2: Grade 6 cần Grade 5 Music Theory / Practical Musicianship / jazz solo (hoặc tương đương); điều kiện áp dụng cho Grade 6–8 ở cả Practical Grades lẫn Performance Grades; Performance Grades là bốn bài chơi liền, quay video, không có gam, thị tấu và kiểm tra nghe; cả hai cùng thang 150 điểm với cùng các mốc."
