- trang: piano/thay-va-thi
  id: n28
  cau: Trang dành cho Việt Nam trên website Trinity liệt kê các kỳ thi (có âm nhạc và nhạc lý), cùng thông tin liên hệ của đại diện Trinity tại Việt Nam.
  loai: lich-su
- trang: piano/thay-va-thi
  id: n29
  cau: LCM Exams (London College of Music, thuộc University of West London) là một hội đồng thi khác của Anh, có điều phối viên quốc gia và trung tâm thi ở nhiều thành phố Việt Nam.
