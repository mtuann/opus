- trang: piano/10-bai-dau-tien
  id: n3
  cau: Giai điệu là dân ca hoặc tác phẩm đã thuộc phạm vi công cộng.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n5
  cau: Bài 9 giữ nguyên giai điệu của Petzold nhưng giản lược tay trái; bản gốc đầy đủ hai tay có ở bài học Minuet Sol trưởng.
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n11
  cau: Con số nhỏ trên nốt là số ngón (1 = ngón cái).
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n13
  cau: Khuông trên (khóa Sol) là tay phải, khuông dưới (khóa Fa) là tay trái.
  loai: quy-tac
- trang: piano/10-bai-dau-tien
  id: n36
  cau: Au clair de la lune là dân ca Pháp.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n37
  cau: Au clair de la lune ở giọng Đô trưởng.
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n38
  cau: 'Học được ở bài 1: chơi hai tay mà mỗi lúc chỉ một tay "hát": tay phải hát đoạn đầu và đoạn cuối, tay trái hát đoạn giữa.'
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n39
  cau: "Tay phải ở thế Đô (ngón 1 trên Đô giữa); tay trái ở thế Sol: ngón 5 trên Sol2, ngón 1 trên Rê3."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n40
  cau: Ở các đoạn tay phải hát, tay trái chỉ giữ nốt trầm Đô (ngón 2) và Sol (ngón 5).
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n43
  cau: Ah! vous dirai-je, maman là dân ca Pháp; Mozart viết 12 biến tấu trên giai điệu này (K. 265).
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n44
  cau: Ah! vous dirai-je ở giọng Đô trưởng.
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n45
  cau: "Học được ở bài 2: tay trái đổi nốt trầm theo hòa âm, với ba nốt Đô – Fa – Sol (chủ âm, hạ át âm, át âm)."
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n46
  cau: "Ở ô 1–2, tay phải mở rộng: ngón 4 trên Sol, ngón 5 trên La; sang ô 3, thu tay về thế Đô (ngón 4 trên Fa)."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n47
  cau: "Tay trái ở thế Đô: Đô3 ngón 5, Fa3 ngón 2, Sol3 ngón 1."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n48
  cau: 'Nghe hai nốt trầm Fa → Đô ở ô 2: hạ át âm → chủ âm; ở ô 4, Sol → Đô là át âm → chủ âm, cảm giác "về nhà".'
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n50
  cau: "Ode to Joy: Beethoven, Giao hưởng số 9, chương 4 (1824)."
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n51
  cau: Ode to Joy ở giọng Đô trưởng, hạ một cung từ Rê trưởng của bản gốc.
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n52
  cau: "Học được ở bài 3: nhịp đen chấm dôi – móc đơn, và một nốt giai điệu do tay trái chơi."
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n54
  cau: Ở phách 3–4 của ô 12, nốt Sol trầm của giai điệu nằm ở tay trái (ngón 1), trong lúc tay phải nghỉ; nghe cho nốt ấy nối liền câu hát.
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n55
  cau: "Hänschen klein là dân ca Đức (tiếng Anh: Lightly Row)."
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n56
  cau: "Học được ở bài 4: hợp âm ba nốt ở tay trái và đổi giữa hai hình: hợp âm chủ Đô – Mi – Sol (ngón 5-3-1) và hợp âm át bảy Si – Fa – Sol (ngón 5-2-1)."
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n57
  cau: Ngón cái giữ nguyên trên Sol; ngón 5 dời xuống Si, ngón 2 đặt lên Fa.
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n59
  cau: Frère Jacques là dân ca Pháp.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n60
  cau: Mahler dùng giai điệu Frère Jacques ở giọng thứ trong Giao hưởng số 1.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n61
  cau: "Học được ở bài 5: đổi thế tay giữa câu, và (thử thách) chơi canon: hai tay hát cùng một giai điệu, lệch nhau hai ô nhịp."
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n62
  cau: "Tay phải chơi ở quãng tám trên Đô giữa (ngón 1 trên Đô5); ô 5–6 mở tay: ngón 5 vươn lên La; ô 7–8 dời tay xuống để ngón 1 bắt Sol4."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n63
  cau: Tay trái giữ quãng 5 Đô–Sol (ngón 5 và 1) như một âm nền ngân dài.
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n64
  cau: "Thử thách canon: tay trái chơi chính giai điệu ấy, thấp hơn hai quãng tám, vào sau hai ô nhịp."
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n68
  cau: Giai điệu Amazing Grace là thánh ca "New Britain", được ghép với lời Amazing Grace từ năm 1835.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n69
  cau: Amazing Grace ở giọng Đô trưởng, nhịp 3/4; học được nhịp lấy đà (bài bắt đầu ở phách 3) và đổi thế tay theo từng câu.
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n70
  cau: "Tay phải đổi thế ba lần: câu 1 và câu 4 mở đầu bằng ngón 1 trên Sol4, rồi dời tay lên một nấc để ngón 3 rơi vào Đô5 và ngón 5 vào Mi5; câu 2 ở thế Đô (ngón 1 trên Đô5); đầu câu 3 dời tay để ngón 5 ở Sol5, ngón 2 ở Đô5."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n72
  cau: "Tay trái: một nốt trầm mỗi ô (Đô, Fa, Sol)."
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n73
  cau: 'Đếm "ba | một – hai – ba": nốt Sol đầu tiên là phách 3 của một ô "thiếu" (nhịp lấy đà); ô cuối cũng thiếu đúng một phách để bù lại.'
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n74
  cau: "Nốt dài ở ô 7 kéo sang ô 8 bằng dấu nối: giữ phím, đừng đánh lại."
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n75
  cau: Greensleeves là dân ca Anh; bài ca được đăng ký ở London năm 1580.
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n76
  cau: "Greensleeves ở La thứ, nhịp 6/8; học được cảm nhịp 6/8 (hai phách lớn, mỗi phách ba móc đơn) và dấu hóa bất thường: Sol♯ và Fa♯ không có trong hóa biểu mà ghi ngay trước nốt."
  loai: dinh-nghia
- trang: piano/10-bai-dau-tien
  id: n77
  cau: Tay trái đi xuống từng bậc La – Sol – Fa – Mi (ngón 1-2-3-4), mỗi nốt giữ trọn ô nhịp.
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n79
  cau: "Ô 7: Fa♯ và Sol♯ là bậc 6 và bậc 7 được nâng lên của gam La thứ (gam thứ giai điệu)."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n80
  cau: "Các chỗ đổi thế tay: cuối ô 1 sang ô 2 và cuối ô 5 sang ô 6 (ngón 4 trên Mi, rồi ngón 5 xuống Rê); ô 4 (ngón cái nhảy từ Mi lên La); cuối ô 6 sang ô 7 (ngón 5 trên Đô)."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n81
  cau: 'Largo ("Going Home"): Dvořák, Giao hưởng số 9 "Từ Thế giới mới", chương 2 (1893), chủ đề chính, bản rút gọn và hạ nửa cung từ Rê♭ trưởng, ở Đô trưởng.'
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n82
  cau: "Học được ở bài 8: chơi legato chậm như hát, và dùng bàn đạp vang lần đầu: mỗi ô nhịp đổi bàn đạp một lần."
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n83
  cau: "Chữ Ped. dưới khuông là chỗ đổi bàn đạp: nhả đúng lúc hợp âm mới vang, rồi nhấn lại ngay sau đó (bàn đạp nối; có hình minh họa ở trang Bàn đạp)."
  loai: quy-tac
- trang: piano/10-bai-dau-tien
  id: n84
  cau: Dấu * ở cuối là nhả hẳn bàn đạp.
  loai: quy-tac
- trang: piano/10-bai-dau-tien
  id: n89
  cau: "Minuet Sol trưởng: Christian Petzold, trong Notebook for Anna Magdalena Bach (1725); lâu nay thường được gán cho Bach."
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n90
  cau: Minuet ở Sol trưởng, nhịp 3/4; học được chuỗi móc đơn đều, đổi thế tay, hóa biểu một dấu thăng (Fa♯).
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n91
  cau: Đây là nửa đầu (16 ô nhịp) với giai điệu gốc.
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n92
  cau: "Tay trái được giản lược: mỗi ô một nốt trầm, cả bài nằm gọn trong thế Sol của tay trái (ngón 5 trên Sol2, ngón 1 trên Rê3); khi đã chơi thuộc, chuyển sang bản gốc hai bè ở bài học Minuet Sol trưởng."
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n94
  cau: 'Ô 3, ô 5 và ô 7 là các chỗ đổi thế tay: tập riêng "ô 2 → ô 3", "ô 4 → ô 5" và "ô 6 → ô 7" cho đến khi tay tự tìm đường.'
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n95
  cau: "Für Elise: Beethoven, Bagatelle La thứ WoO 59 (1810)."
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n96
  cau: "Für Elise ở La thứ, nhịp 3/8; học được hai tay thay phiên nhau thành một dòng chảy liền: tay trái rải La – Mi – La, tay phải đón tiếp Đô – Mi – La."
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n97
  cau: Đây là nguyên văn hai tay của Beethoven ở đoạn mở đầu (trong bản gốc câu này được nhắc lại; ở đây khép tạm bằng nốt La để thành bài tập).
  loai: cau-truc
- trang: piano/10-bai-dau-tien
  id: n98
  cau: "Tay trái: ngón 5-2-1."
  loai: nam
- trang: piano/10-bai-dau-tien
  id: n107
  cau: 'Nguồn: giai điệu từ dân ca Pháp, Đức, Anh; thánh ca "New Britain"; Beethoven, Giao hưởng số 9 và Bagatelle WoO 59; Dvořák, Giao hưởng số 9; Petzold, Minuet BWV Anh. 114.'
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n108
  cau: "Nguồn: bản nhạc đã đối chiếu: Mutopia Project (Ode to Joy, Minuet BWV Anh. 114, Für Elise, Greensleeves, New Britain) và IMSLP (Minuet BWV Anh. 114, Für Elise)."
  loai: lich-su
- trang: piano/10-bai-dau-tien
  id: n78
  cau: Đếm "một hai ba bốn năm sáu", nhấn nhẹ ở 1 và 4; đừng đếm thành ba phách.
  loai: khuyen-tap
- trang: piano/10-bai-dau-tien
  id: n42
  cau: "Thử thách: ở đoạn cuối, chơi tay trái nhỏ hơn hẳn tay phải; đó là bước đầu của cân bằng hai tay (liên kết Tạo tiếng đàn)."
  loai: khuyen-tap
- trang: piano/10-bai-dau-tien
  id: n87
  cau: 'Rồi tập riêng tay trái với chân: đánh quãng 5 ở "một", nhấn chân ở "và"; khi chân đã tự động, mới thêm tay phải.'
  loai: khuyen-tap
- trang: piano/ban-do-ban-phim
  id: n2
  cau: "Đàn piano tiêu chuẩn có 88 phím: 52 phím trắng và 36 phím đen."
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n3
  cau: Đàn có phím từ La0 (A0) ở đầu trầm đến Đô8 (C8) ở đầu cao.
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n4
  cau: Từ La0 đến Đô8 là hơn bảy quãng tám.
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n5
  cau: Phím đen xếp thành nhóm 2 và nhóm 3 xen kẽ nhau.
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n7
  cau: "Giữa Mi–Fa và Si–Đô không có phím đen: đó là hai nửa cung tự nhiên."
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n9
  cau: "Cách tìm Đô: phím trắng ngay bên trái nhóm 2 phím đen."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n10
  cau: "Cách tìm Rê: phím trắng kẹp giữa hai phím đen của nhóm 2."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n11
  cau: "Cách tìm Mi: phím trắng ngay bên phải nhóm 2."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n12
  cau: "Cách tìm Fa: phím trắng ngay bên trái nhóm 3 phím đen."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n13
  cau: "Cách tìm Sol: giữa phím đen thứ nhất và thứ hai của nhóm 3."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n14
  cau: "Cách tìm La: giữa phím đen thứ hai và thứ ba của nhóm 3."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n15
  cau: "Cách tìm Si: phím trắng ngay bên phải nhóm 3."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n16
  cau: "Phím đen mang tên của phím trắng bên cạnh cộng dấu thăng hoặc dấu giáng: phím đen giữa Đô và Rê vừa là Đô♯ vừa là Rê♭."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n17
  cau: "Ký hiệu khoa học: mỗi quãng tám bắt đầu từ một nốt Đô và được đánh số; Đô giữa là C4, Rê ngay trên nó là D4, Si ngay dưới nó là B3."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n18
  cau: Nốt La ngay trên Đô giữa, A4, là nốt chuẩn để lên dây, ở tần số 440 Hz.
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n19
  cau: Trên đàn 88 phím, hai phím trắng thấp nhất là A0 và B0; tiếp theo là C1, C2… cho tới C8, phím cuối cùng.
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n20
  cau: Đàn có tám nốt Đô; Đô giữa là nốt Đô thứ tư tính từ dưới lên, nằm gần chính giữa đàn.
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n21
  cau: "Sách cũ, sách về lịch sử đàn và nhiều bản nhạc châu Âu dùng ký hiệu Helmholtz: chữ hoa, chữ thường và dấu phẩy trên."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n22
  cau: Cây đàn Broadwood của Beethoven có âm vực "CC–c''''" (tức C1–C7, sáu quãng tám).
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n23
  cau: "Bảng Helmholtz: A0, B0 là AAA, BBB (subcontra)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n24
  cau: "Bảng Helmholtz: C1–B1 là CC–BB (contra)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n25
  cau: "Bảng Helmholtz: C2–B2 là C–B (great)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n26
  cau: "Bảng Helmholtz: C3–B3 là c–b (small)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n27
  cau: "Bảng Helmholtz: C4–B4 là c'–b' (Đô giữa = c'; one-line)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n28
  cau: "Bảng Helmholtz: C5–B5 là c''–b'' (two-line)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n29
  cau: "Bảng Helmholtz: C6–B6 là c'''–b''' (three-line)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n30
  cau: "Bảng Helmholtz: C7–B7 là c''''–b'''' (four-line)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n31
  cau: "Bảng Helmholtz: C8 là c''''' (five-line)."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n32
  cau: Trong tiếng Đức, B là Si♭ còn H là Si thường.
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n33
  cau: Vì thế Bach có thể "ký tên" bằng bốn nốt B–A–C–H, tức Si♭–La–Đô–Si.
  loai: lich-su
- trang: piano/ban-do-ban-phim
  id: n35
  cau: Mô tả âm thanh của từng vùng (rền, đục khi giữ bàn đạp; nền móng của hòa âm; ấm, gần giọng nam hay cello; rõ, "hát" tốt; sáng, trong; lấp lánh, tắt rất nhanh).
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n37
  cau: 'Cột "Thường do tay nào": trầm là tay trái (nốt trầm, quãng tám, đệm), giữa cả hai tay, cao tay phải (giai điệu), rất cao tay phải (trang trí, hiệu ứng); hình ghi "thường là vùng của tay trái / tay phải".'
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n38
  cau: Ở vùng rất cao, những phím cao nhất của đàn không có bộ giảm âm (damper), nên các nốt ở đó tự ngân cho đến khi tắt dù bạn không giữ bàn đạp.
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n39
  cau: Ở vùng rất cao, dây ngắn và tiếng tắt nhanh đến mức đàn không cần bộ giảm âm.
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n40
  cau: "Trên bản nhạc piano, khuông khóa Sol thường dành cho tay phải và khuông khóa Fa cho tay trái; đó là quy ước, không phải luật: tay trái có thể chơi trên khuông khóa Sol và ngược lại, và khóa có thể đổi giữa chừng."
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n43
  cau: Cách đọc theo mốc và theo quãng này nhanh hơn nhiều so với đọc từng nốt.
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n45
  cau: "C2: hai dòng kẻ phụ dưới khuông khóa Fa; trên phím là nốt Đô thứ hai tính từ dưới lên."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n46
  cau: "C3: khe thứ hai (đếm từ dưới) của khuông khóa Fa; trên phím là Đô thứ ba."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n47
  cau: "F3: dòng thứ tư khuông khóa Fa, dòng nằm giữa hai chấm của khóa; trên phím là nốt Fa gần nhất phía dưới Đô giữa."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n48
  cau: "C4 (Đô giữa): dòng kẻ phụ nằm giữa hai khuông; trên phím là Đô thứ tư, gần giữa đàn."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n49
  cau: "G4: dòng thứ hai khuông khóa Sol, dòng mà khóa Sol quấn quanh; trên phím là nốt Sol gần nhất phía trên Đô giữa."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n50
  cau: "C5: khe thứ ba khuông khóa Sol; trên phím là Đô cao hơn Đô giữa một quãng tám."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n51
  cau: "C6: hai dòng kẻ phụ trên khuông khóa Sol; trên phím là Đô thứ sáu."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n52
  cau: "Tính đối xứng: C2 và C6 cùng có hai dòng kẻ phụ; khóa Fa đánh dấu F3, khóa Sol đánh dấu G4; Đô giữa nằm ở chính giữa."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n55
  cau: "Đáp án tay phải: Fa4 (dưới G4), La4 (trên G4), Si4 (dưới C5), Rê5 (trên C5), Si5 (dưới C6)."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n56
  cau: "Đáp án tay trái: Rê2 (trên C2), Si2 (dưới C3), Mi3 (dưới F3), Sol3 (trên F3), Si3 (dưới Đô giữa)."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n57
  cau: "Mỗi phím đen có hai tên trùng âm: Đô♯ = Rê♭, Rê♯ = Mi♭, Fa♯ = Sol♭, Sol♯ = La♭, La♯ = Si♭."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n58
  cau: "Phím trắng cũng có tên khác: Mi♯ = Fa, Si♯ = Đô, Fa♭ = Mi, Đô♭ = Si."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n59
  cau: "Chúng xuất hiện ở các giọng nhiều dấu hóa: gam Fa♯ trưởng có Mi♯ (bạn chơi phím Fa), gam Sol♭ trưởng có Đô♭ (phím Si), gam Đô♯ thứ hòa âm có Si♯ (phím Đô)."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n60
  cau: "Dấu thăng kép (×) và giáng kép (♭♭): Fa× là phím Sol (gặp trong gam Sol♯ thứ hòa âm), Si♭♭ là phím La."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n61
  cau: Tên một nốt phụ thuộc vào giọng và hòa âm, không phụ thuộc vào phím.
  loai: quy-tac
- trang: piano/ban-do-ban-phim
  id: n75
  cau: "Câu hỏi 1: Nốt Đô (C) nằm ngay bên trái nhóm hai phím đen; giải thích: giữa hai phím đen của nhóm hai là Rê, bên trái nhóm ba là Fa."
  loai: cau-truc
- trang: piano/ban-do-ban-phim
  id: n76
  cau: "Câu hỏi 2: Đàn piano 88 phím có 36 phím đen; giải thích: 52 phím trắng và 36 phím đen."
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n77
  cau: "Câu hỏi 3: Trong ký hiệu Helmholtz, Đô giữa (C4) viết là c'; giải thích: C (chữ hoa, không dấu) là C2; c'' là C5."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n78
  cau: "Câu hỏi 4: Dòng thứ tư của khuông khóa Fa là Fa3 (F3); giải thích: hai chấm của khóa Fa kẹp dòng F3; G4 là dòng thứ hai khuông khóa Sol."
  loai: nam
- trang: piano/ban-do-ban-phim
  id: n79
  cau: "Câu hỏi 5: Mi♯ là phím trắng Fa; giải thích: giữa Mi và Fa không có phím đen, nâng Mi lên nửa cung là tới phím Fa."
  loai: ten
- trang: piano/ban-do-ban-phim
  id: n80
  cau: "Nguồn: ISO 16:1975, Acoustics — Standard tuning frequency: chuẩn A4 = 440 Hz."
  loai: so-lieu
- trang: piano/ban-do-ban-phim
  id: n81
  cau: "Nguồn: Hermann von Helmholtz, Die Lehre von den Tonempfindungen (1863), cuốn sách làm phổ biến cách ghi quãng tám mang tên ông."
  loai: lich-su
- trang: piano/ban-do-ban-phim
  id: n82
  cau: 'Nguồn: Grove Music Online, mục "Pitch nomenclature".'
  loai: lich-su
- trang: piano/ban-do-ban-phim
  id: n6
  cau: "Nhóm 2 và nhóm 3 phím đen là chìa khóa của mọi định hướng: mắt và ngón tay nhận ra chúng ngay lập tức."
  loai: khuyen-tap
- trang: piano/ban-do-ban-phim
  id: n42
  cau: Thay vì đếm dòng kẻ từ đầu mỗi lần, hãy thuộc lòng vài nốt mốc, vừa trên khuông vừa trên phím, rồi đọc các nốt khác theo khoảng cách tới mốc gần nhất; ví dụ "trên G4 một bậc là La4", "dưới C5 một quãng ba là La4".
  loai: khuyen-tap
- trang: piano/ban-do-ban-phim
  id: n62
  cau: 'Ngón tay "đọc" phím đen: phím đen cao hơn và hẹp hơn; chạm nhẹ mép phím là biết mình đang ở nhóm 2 hay nhóm 3.'
  loai: khuyen-tap
- trang: piano/hai-tuan-dau
  id: n1
  cau: Piano điện 88 phím có phím nặng mô phỏng cơ chế búa của đàn cơ.
  loai: dinh-nghia
- trang: piano/hai-tuan-dau
  id: n2
  cau: Đàn phím nhẹ dùng tạm được, nhưng cảm giác phím khác đàn cơ.
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n4
  cau: Việc học động tác còn tiếp tục tiến bộ sau buổi tập, trong lúc nghỉ.
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n8
  cau: Khi chỉnh ghế, cẳng tay gần song song với mặt phím và hai bàn chân đặt phẳng.
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n10
  cau: Đô giữa (C4) là phím trắng ngay bên trái nhóm hai phím đen nằm gần giữa đàn.
  loai: dinh-nghia
- trang: piano/hai-tuan-dau
  id: n11
  cau: "Hai tay được đánh số giống nhau: ngón cái là 1, trỏ 2, giữa 3, áp út 4, út 5."
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n12
  cau: "Thế Đô: tay phải ngón 1 trên Đô giữa đến ngón 5 trên Sol4; tay trái ngón 5 trên Đô3 đến ngón 1 trên Sol3. Thế Sol của tay trái: ngón 5 trên Sol2, ngón 1 trên Rê3."
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n15
  cau: Thói quen đếm to này phân biệt người giữ được nhịp với người không.
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n16
  cau: Nốt tròn ngân 4 phách, nốt trắng 2 phách, nốt đen 1 phách (nhịp 4/4).
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n17
  cau: Nốt đen chấm dôi dài một phách rưỡi; nốt móc đơn dài nửa phách; dấu chấm dôi thêm một nửa độ dài của nốt.
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n18
  cau: Khuông kép gồm khuông khóa Sol ở trên (thường cho tay phải) và khuông khóa Fa ở dưới (thường cho tay trái).
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n19
  cau: "Ba nốt mốc: Đô giữa nằm trên dòng kẻ phụ giữa hai khuông; Sol4 nằm trên dòng thứ hai của khóa Sol; Fa3 nằm trên dòng thứ tư của khóa Fa, giữa hai dấu chấm của khóa."
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n24
  cau: "*Ah! vous dirai-je, maman* là giai điệu *Twinkle, Twinkle, Little Star*."
  loai: ten
- trang: piano/hai-tuan-dau
  id: n25
  cau: "*Ode to Joy* là giai điệu của Beethoven, từ chương cuối Giao hưởng số 9."
  loai: lich-su
- trang: piano/hai-tuan-dau
  id: n26
  cau: "Giai điệu Ode to Joy đi gần như toàn bước liền, nhưng có tiết tấu mới ở cuối câu: nốt đen chấm dôi theo sau là nốt móc đơn."
  loai: cau-truc
- trang: piano/hai-tuan-dau
  id: n27
  cau: Khi đếm "một – hai – và – ba – bốn", nốt đen chấm dôi bắt đầu ở "một" và ngân qua "hai", nốt móc đơn rơi đúng vào chữ "và".
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n35
  cau: "Khi mỏi vai hay đau cổ tay: dừng lại và nghỉ, kiểm tra độ cao ghế, thả rơi cánh tay."
  loai: quy-tac
- trang: piano/hai-tuan-dau
  id: n39
  cau: "Bài kiểm tra: Đô giữa nằm ngay bên trái nhóm hai phím đen gần giữa đàn và là nốt Đô thứ tư tính từ dưới lên; mọi nốt Đô đều nằm ngay bên trái nhóm hai phím đen; ở thế Đô, ngón 5 tay trái trên Đô3."
  loai: dinh-nghia
- trang: piano/hai-tuan-dau
  id: n32
  cau: "Lỡ sai thì đi tiếp: đó là kỹ năng biểu diễn đầu tiên cần tập; chọn bài chắc nhất trước, một tốc độ thoải mái, đặt tay, đếm thầm một ô nhịp rồi mới bắt đầu."
  loai: khuyen-tap
- trang: piano/hai-tuan-dau
  id: n9
  cau: Thả rơi cánh tay xuống đùi vài lần để cảm nhận sức nặng của nó.
  loai: khuyen-tap
- trang: piano/hai-tuan-dau
  id: n40
  cau: "Bài kiểm tra: lần đầu ghép hai tay nên chơi chậm bằng khoảng nửa tốc độ từng tay, mỗi lần một câu ngắn, đếm to; thu âm ngày 7 và ngày 14 để nghe lại chính mình và so sánh hai bản thu."
  loai: khuyen-tap
- trang: piano/tu-the
  id: n1
  cau: Tư thế ảnh hưởng đến cách bạn điều khiển tiếng đàn và đến sức khỏe đôi tay.
  loai: quy-tac
- trang: piano/tu-the
  id: n2
  cau: Một nốt piano to hay nhỏ phụ thuộc vào tốc độ phím đi xuống.
  loai: quy-tac
- trang: piano/tu-the
  id: n3
  cau: Một cánh tay thả lỏng điều khiển tốc độ phím tinh tế hơn nhiều so với những ngón tay gồng cứng.
  loai: quy-tac
- trang: piano/tu-the
  id: n4
  cau: "Hãy tập sao cho động tác không gồng: khuỷu tay, vai và cổ tay không siết."
  loai: quy-tac
- trang: piano/tu-the
  id: n5
  cau: Đau cổ tay, cẳng tay, cổ và vai là những vấn đề thường gặp ở người chơi piano; tư thế và việc tập lâu không nghỉ là các yếu tố nguy cơ.
  loai: quy-tac
- trang: piano/tu-the
  id: n6
  cau: Chiều cao ghế đúng khi cẳng tay gần song song với mặt phím; cẳng tay dốc lên là ghế quá thấp, dốc xuống nhiều là quá cao.
  loai: quy-tac
- trang: piano/tu-the
  id: n7
  cau: "Khoảng cách tới đàn: ngồi đủ xa để ngực mở; thấy ngực bị bó là quá gần, phải chồm người về trước là quá xa."
  loai: quy-tac
- trang: piano/tu-the
  id: n8
  cau: Trọng lượng cơ thể chia đều cho hai bên mông và hai bàn chân; kiểm tra bằng cách nghiêng người sang hai bên mà không mất thăng bằng.
  loai: quy-tac
- trang: piano/tu-the
  id: n10
  cau: "Chân: hai bàn chân đặt vững trên sàn hoặc trên một bục chắc; chân phải ở gần bàn đạp vang; không phải nhón chân hay duỗi thẳng chân mới tới bàn đạp."
  loai: quy-tac
- trang: piano/tu-the
  id: n12
  cau: Lưng thẳng tự nhiên, không gù, không gồng.
  loai: quy-tac
- trang: piano/tu-the
  id: n13
  cau: Vai thả xuống; hãy tự kiểm tra vai mỗi khi lật trang.
  loai: quy-tac
- trang: piano/tu-the
  id: n14
  cau: Cánh tay trên thả lỏng từ vai, khuỷu tay không gồng.
  loai: quy-tac
- trang: piano/tu-the
  id: n15
  cau: Nhìn từ trên xuống, cẳng tay thẳng hàng với ngón 3, 4, 5 chứ không phải với ngón cái; khi chơi xa sang hai bên, để cẳng tay di chuyển theo, đừng bẻ cổ tay sang ngang.
  loai: quy-tac
- trang: piano/tu-the
  id: n16
  cau: Cổ tay ở vị trí trung tính, không quá cao cũng không quá thấp; cách tìm là thả cánh tay buông thõng bên người rồi đưa lên phím; quan trọng hơn vị trí là sự linh hoạt, đừng khóa cứng cổ tay.
  loai: quy-tac
- trang: piano/tu-the
  id: n21
  cau: "Hai tay đánh số giống nhau: ngón cái = 1, trỏ = 2, giữa = 3, áp út = 4, út = 5."
  loai: quy-tac
- trang: piano/tu-the
  id: n22
  cau: Cùng năm nốt Đô–Rê–Mi–Fa–Sol, tay phải chơi bằng 1–2–3–4–5 còn tay trái chơi bằng 5–4–3–2–1.
  loai: quy-tac
- trang: piano/tu-the
  id: n24
  cau: Khi phím đi xuống, bộ máy đàn hất búa về phía dây; ngay trước khi chạm dây, búa được thả ra (cơ chế thoát, escapement) và bay tự do vào dây.
  loai: dinh-nghia
- trang: piano/tu-the
  id: n25
  cau: Tiếng đàn đã được quyết định trong khoảnh khắc phím đi xuống; muốn to hơn thì phím phải đi xuống nhanh hơn.
  loai: quy-tac
- trang: piano/tu-the
  id: n26
  cau: "Ép phím sau khi chạm đáy không đổi được tiếng đàn: tiếng không to hơn, chỉ thêm lực thừa cho tay."
  loai: quy-tac
- trang: piano/tu-the
  id: n27
  cau: Người mới thường làm ngược lại (ngón tay đẩy cứng, cánh tay gồng treo trên không), kết quả là tiếng đàn chát và tay mỏi sau mười lăm phút; khi quen dùng trọng lượng, chơi to dễ hơn và chơi nhỏ cũng đều hơn.
  loai: quy-tac
- trang: piano/tu-the
  id: n30
  cau: Những gì bạn không cảm thấy khi chơi thường lộ ra rất rõ trên video.
  loai: quy-tac
- trang: piano/tu-the
  id: n32
  cau: "Kiểm tra trước mỗi buổi: cổ tay ở vị trí trung tính và mềm; hẹn giờ nghỉ 10 phút sau mỗi 20 phút tập."
  loai: quy-tac
- trang: piano/tu-the
  id: n33
  cau: Đau, tê hoặc ngứa ran khi tập là tín hiệu dừng; hãy dừng lại, nghỉ.
  loai: quy-tac
- trang: piano/tu-the
  id: n34
  cau: Nếu tình trạng (đau, tê) kéo dài, hãy đi khám.
  loai: quy-tac
- trang: piano/tu-the
  id: n35
  cau: "Bài kiểm tra: ghế đàn cao vừa khi cẳng tay gần song song với mặt phím; khi tay đau trong lúc tập nên dừng lại, nghỉ và tìm nguyên nhân; đau là tín hiệu cảnh báo, không phải dấu hiệu tiến bộ."
  loai: quy-tac
- trang: piano/tu-the
  id: n38
  cau: "Hình tu-the-ngoi (::hinh): tư thế ngồi nhìn ngang: lưng thẳng, vai và khuỷu tay thả lỏng, cẳng tay gần song song mặt phím, cổ tay không võng, bàn chân đặt vững, chân phải gần bàn đạp; ghế đàn chỉnh được độ cao."
  loai: quy-tac
- trang: piano/tu-the
  id: n39
  cau: "Hình the-tay (::hinh): thế đúng là cổ tay ở vị trí trung tính, khớp gốc ngón thành vòm, chạm phím bằng đầu ngón; hai lỗi là cổ tay võng xuống dưới mặt phím và gãy khớp đầu ngón khi nhấn (hai lỗi có trong bảng lỗi của trang)."
  loai: quy-tac
- trang: piano/tu-the
  id: n20
  cau: Hãy nghĩ bàn tay đang khum quanh một quả bóng nhỏ, nhưng mềm; thế tay đúng là thế tay tự nhiên nhất.
  loai: khuyen-tap
- trang: piano/tu-the
  id: n9
  cau: "Vị trí ngang: thân người đối diện khoảng giữa bàn phím, quanh Đô giữa; hai tay với tới hai đầu đàn dễ như nhau."
  loai: khuyen-tap
- trang: piano/tu-the
  id: n28
  cau: 'Nguyên tắc "nhấn rồi buông": sau khi nhấn chỉ giữ lực vừa đủ để phím không bật lên; nguồn năng lượng là cả cánh tay, ngón tay vững truyền trọng lượng xuống phím, cổ tay và cẳng tay điều chỉnh.'
  loai: khuyen-tap
- trang: piano/index
  id: n1
  cau: Piano là nhạc cụ tốt nhất để hiểu nhạc cổ điển.
  loai: quy-tac
- trang: piano/index
  id: n2
  cau: Một người với mười ngón tay chơi được cùng lúc giai điệu, hòa âm và bè trầm.
  loai: quy-tac
- trang: piano/index
  id: n3
  cau: Bàn phím là tấm bản đồ nhìn thấy được của các khái niệm nhạc lý.
  loai: quy-tac
- trang: piano/index
  id: n22
  cau: "Nguyên tắc 3: tập với động tác không gồng cứng; đau, tê hoặc ngứa ran là tín hiệu dừng lại, không phải để cố thêm."
  loai: quy-tac
- trang: piano/index
  id: n23
  cau: "Nguyên tắc 4: mỗi bài là dịp ôn nhạc lý (đang ở giọng nào, hợp âm gì, câu nhạc kết ở đâu)."
  loai: khuyen-tap
- trang: piano/index
  id: n21
  cau: 'Nguyên tắc 2: hãy biết mình đang hướng tới âm thanh nào; mỗi bài học tác phẩm đều có phần "Nghe trước khi tập".'
  loai: khuyen-tap
- trang: piano/index
  id: n20
  cau: "Nguyên tắc 1: chậm và đều thắng nhanh và thất thường; tập ngắn mỗi ngày tốt hơn dồn 3 tiếng vào cuối tuần."
  loai: khuyen-tap
