- trang: luyen-tap/metronome
  id: n1
  cau: BPM (beats per minute) là số phách mỗi phút.
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n9
  cau: Các nhà soạn nhạc ghi tốc độ bằng tiếng Ý ở đầu bản nhạc.
  loai: quy-tac
- trang: luyen-tap/metronome
  id: n10
  cau: Khoảng BPM của các thuật ngữ tốc độ chỉ là gần đúng; nghệ sĩ có quyền diễn giải.
  loai: quy-tac
- trang: luyen-tap/metronome
  id: n11
  cau: "Largo: rất chậm, rộng rãi."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n12
  cau: "Largo: khoảng 40–66 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n13
  cau: "Adagio: chậm, thong thả."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n14
  cau: "Adagio: khoảng 66–76 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n15
  cau: "Andante: vừa phải, như nhịp bước đi."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n16
  cau: "Andante: khoảng 76–108 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n17
  cau: "Moderato: vừa."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n18
  cau: "Moderato: khoảng 108–120 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n19
  cau: "Allegro: nhanh, vui tươi."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n20
  cau: "Allegro: khoảng 120–156 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n21
  cau: "Presto: rất nhanh."
  loai: dinh-nghia
- trang: luyen-tap/metronome
  id: n22
  cau: "Presto: khoảng 168–200 BPM."
  loai: so-lieu
- trang: luyen-tap/metronome
  id: n4
  cau: Khi đã làm đúng 3 lần liên tiếp thì tăng 2–4 BPM; sai thì lùi lại một nấc.
  loai: khuyen-tap
- trang: luyen-tap/metronome
  id: n3
  cau: "Bắt đầu chậm hơn mức bạn nghĩ mình làm được: chơi đúng ở 60 BPM có ích hơn chơi sai ở 100 BPM."
  loai: khuyen-tap
- trang: luyen-tap/nhat-ky
  id: n18
  cau: "Mốc thời gian gợi ý của năm việc trong ngày: tập đàn 20–45 phút; đọc nốt 5 phút; luyện tai 5 phút; học hoặc ôn nhạc lý 10 phút; nghe chủ động một tác phẩm."
  loai: khuyen-tap
- trang: luyen-tap/nhat-ky
  id: n17
  cau: 'Ghi chú tốt thì ngắn và cụ thể; ví dụ: "Minuet Sol trưởng ô 9–16, ♩ = 72, ba lần liền không vấp. Ô 13 tay trái còn hụt nhịp. Gam Rê trưởng hai tay đã đều." Một tuần sau đọc lại, bạn sẽ thấy rõ mình tiến bộ đến đâu.'
  loai: khuyen-tap
- trang: luyen-tap/phieu-bai-tap
  id: n6
  cau: Tự nhớ lại thay vì chỉ nhận ra đáp án trong các lựa chọn là cách học tốt hơn cho ghi nhớ.
  loai: quy-tac
- trang: luyen-tap/phieu-bai-tap
  id: n7
  cau: Tự kiểm tra bằng cách nhớ lại là một trong những cách học có hiệu quả ghi nhớ cao nhất.
  loai: so-lieu
- trang: luyen-tap/phieu-bai-tap
  id: n11
  cau: "Bài tập viết 3: viết hợp âm ba trên mọi bậc của Rê trưởng, ghi số La Mã dưới mỗi hợp âm."
  loai: khuyen-tap
- trang: luyen-tap/phieu-bai-tap
  id: n13
  cau: "Bài tập viết 5: chép lại 4 ô nhịp đầu của một bản nhạc bạn yêu thích, nghe và kiểm tra."
  loai: khuyen-tap
- trang: luyen-tap/phieu-bai-tap
  id: n12
  cau: "Bài tập viết 4: viết hợp âm V7 của 5 giọng bất kỳ và giải quyết về I."
  loai: khuyen-tap
- trang: luyen-tap/thi-tau
  id: n1
  cau: Thị tấu (sight-reading) là đọc và hát hoặc chơi một bản nhạc lần đầu tiên nhìn thấy.
  loai: dinh-nghia
- trang: luyen-tap/thi-tau
  id: n8
  cau: Bắt đầu với Đô trưởng, cấp độ 1, tốc độ 60. Mỗi ngày đọc 3–5 giai điệu là đủ.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau
  id: n6
  cau: Bấm "Đếm vào" rồi hát (bằng tên nốt Đô Rê Mi) hoặc đàn theo nhịp; đừng dừng lại khi sai, giữ nhịp quan trọng hơn đúng từng nốt.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau
  id: n4
  cau: Nghe chủ âm để "định giọng" trong đầu.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau-hai-tay
  id: n17
  cau: Khi tự chơi, hãy chọn tốc độ mà bạn chắc chắn không phải dừng, kể cả khi nó chậm hơn nhiều so với tốc độ ghi trên bài.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau-hai-tay
  id: n13
  cau: Đếm vào một ô rồi chơi một lượt không dừng; sai thì bỏ qua, giữ nhịp, vì trong thị tấu giữ nhịp quan trọng hơn đúng từng nốt.
  loai: khuyen-tap
- trang: luyen-tap/thi-tau-hai-tay
  id: n2
  cau: Đặt điện thoại hoặc máy tính lên giá nhạc, đọc khoảng nửa phút, rồi chơi ngay trên đàn của bạn, một lượt, không dừng lại.
  loai: khuyen-tap
- trang: luyen-tap/thu-am
  id: n16
  cau: Loa nhỏ (của điện thoại) làm mất tiếng trầm và bàn đạp.
  loai: quy-tac
- trang: luyen-tap/thu-am
  id: n13
  cau: "Quay video khi cần xem tay: đặt máy ở bên cạnh hoặc chếch từ trên cao để thấy cổ tay và ngón."
  loai: khuyen-tap
- trang: luyen-tap/thu-am
  id: n15
  cau: Nghe lại bằng tai nghe, không bằng loa điện thoại.
  loai: khuyen-tap
- trang: luyen-tap/thu-am
  id: n4
  cau: Khi đang chơi, tai bạn bận với ngón tay và bản nhạc; khi nghe lại, bạn nghe như một khán giả.
  loai: khuyen-tap
- trang: luyen-tap/tiet-tau
  id: n8
  cau: Đa số người mới có xu hướng gõ sớm.
  loai: so-lieu
- trang: luyen-tap/tiet-tau
  id: n9
  cau: Trên điện thoại, có thể có độ trễ nhỏ giữa lúc chạm và lúc ghi nhận.
  loai: so-lieu
- trang: luyen-tap/tiet-tau
  id: n4
  cau: 'Đếm to khi đọc: "1 – 2 – 3 – 4", và "1 và 2 và…" khi có nốt móc đơn.'
  loai: khuyen-tap
- trang: luyen-tap/tiet-tau
  id: n10
  cau: Nếu luôn bị báo "muộn", hãy dùng máy tính với bàn phím.
  loai: khuyen-tap
- trang: luyen-tap/xay-hop-am
  id: n4
  cau: Quãng ba thứ có 3 nửa cung, quãng ba trưởng có 4 nửa cung.
  loai: dinh-nghia
- trang: luyen-tap/xay-hop-am
  id: n3
  cau: "Với hợp âm: bắt đầu từ nốt gốc, đếm số nửa cung cho từng quãng 3."
  loai: khuyen-tap
