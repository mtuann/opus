  loai: nam
- trang: nghe-nhac/mendelssohn-violin
  id: n4
  cau: "Tên đầy đủ: Concerto cho violin cung Mi thứ, Op. 64."
  loai: danh-muc
- trang: nghe-nhac/mendelssohn-violin
  id: n5
  cau: "Sáng tác: hoàn thành năm 1844."
  loai: nam
- trang: nghe-nhac/mendelssohn-violin
  id: n6
  cau: "Công diễn: 13/3/1845, Leipzig; độc tấu Ferdinand David."
  loai: nam
- trang: nghe-nhac/mendelssohn-violin
  id: n7
  cau: "Thời kỳ: Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n8
  cau: "Độ dài: khoảng 24–27 phút, 3 chương nối liền nhau."
  loai: so-lieu
- trang: nghe-nhac/mendelssohn-violin
  id: n9
  cau: Mendelssohn viết concerto này cho người bạn, nghệ sĩ violin Ferdinand David.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n10
  cau: Ferdinand David là concertmaster của dàn nhạc Gewandhaus Leipzig mà Mendelssohn làm nhạc trưởng.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n11
  cau: Trong thư từ trao đổi suốt những năm sáng tác, hai người bàn cả những chi tiết kỹ thuật của phần violin.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n12
  cau: Đây là một trong những concerto violin được biểu diễn nhiều nhất mọi thời đại.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n13
  cau: Mendelssohn phá ba thói quen của concerto Cổ điển (violin vào ngay, cadenza giữa chương, các chương nối liền).
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n15
  cau: Violin vào gần như ngay lập tức, chỉ sau một ô nhịp rưỡi, thay vì chờ dàn nhạc trình bày.
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n16
  cau: Cadenza được viết sẵn và đặt trước phần tái hiện, thay vì gần cuối chương; nó trở thành cây cầu nối phát triển và tái hiện.
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n17
  cau: "Ba chương nối liền: một nốt giữ dài của bassoon nối chương 1 sang chương 2."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n18
  cau: Nốt bassoon giữ dài là để khán giả không vỗ tay chen giữa chương 1 và chương 2.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n19
  cau: "Theo dõi, chương 1 Allegro molto appassionato: dàn nhạc rì rầm, violin vào ngay với chủ đề chính đầy khao khát ở Mi thứ, âm vực cao."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n20
  cau: "Theo dõi, chủ đề 2 chương 1: kèn gỗ (clarinet, sáo) hát chủ đề 2 dịu dàng ở giọng trưởng, trên nốt Sol buông giữ dài của violin."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n21
  cau: "Theo dõi, cadenza: violin một mình, hợp âm rải nhanh khắp các dây."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n22
  cau: "Theo dõi, tái hiện: trong lúc violin vẫn rải hợp âm, dàn nhạc lặng lẽ vào lại chủ đề chính."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n23
  cau: "Theo dõi, cầu nối: bassoon giữ một nốt dài khi dàn nhạc dừng, dẫn thẳng sang chương 2."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n24
  cau: "Theo dõi, chương 2 Andante: Đô trưởng, violin hát một giai điệu êm, dịu."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n25
  cau: "Theo dõi, cầu nối chương 2 sang 3: đoạn ngắn ở Mi thứ, trầm tư, chuẩn bị cho chương cuối."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n26
  cau: "Theo dõi, chương 3 Allegro molto vivace: kèn gọi, rồi violin chạy nhẹ như nhạc tiên của Giấc mộng đêm hè: nhanh, sáng, Mi trưởng."
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n27
  cau: Khác với (concerto của) Mozart, violin vào gần như ngay từ đầu.
  loai: lich-su
- trang: nghe-nhac/mendelssohn-violin
  id: n28
  cau: Khi cadenza kết thúc thì dàn nhạc vào lại.
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n29
  cau: Chương 1 ở Mi thứ, chương 3 ở Mi trưởng.
  loai: cau-truc
- trang: nghe-nhac/mendelssohn-violin
  id: n32
  cau: "Nguồn: tổng phổ trên IMSLP (trang Violin Concerto, Op.64) và bản Breitkopf & Härtel (Partitur-Bibliothek) trên Internet Archive."
  loai: ten
- trang: nghe-nhac/mendelssohn-violin
  id: n33
  cau: "Nguồn: chú giải chương trình của Boston Symphony Orchestra (Steven Ledbetter) và Cleveland Orchestra."
  loai: ten
- trang: nghe-nhac/schubert-ca-hoi
  id: n1
  cau: 'Tiêu đề: Schubert, Ngũ tấu "Con cá hồi", chương 4.'
  loai: ten
- trang: nghe-nhac/schubert-ca-hoi
  id: n2
  cau: "Mô tả trang: ngũ tấu được viết theo đề nghị của Sylvester Paumgartner, người bảo trợ âm nhạc ở Steyr, cũng chơi cello và rất thích ca khúc Die Forelle (Con cá hồi, D.…"
  loai: lich-su
- trang: nghe-nhac/schubert-ca-hoi
  id: n3
  cau: "Nhà soạn nhạc: Franz Schubert (1797–1828)."
  loai: nam
- trang: nghe-nhac/schubert-ca-hoi
  id: n4
  cau: 'Tên đầy đủ: Ngũ tấu piano cung La trưởng, D. 667 "Die Forelle".'
  loai: danh-muc
- trang: nghe-nhac/schubert-ca-hoi
  id: n5
  cau: "Sáng tác: 1819, sau một mùa hè ở Steyr (Áo)."
  loai: nam
- trang: nghe-nhac/schubert-ca-hoi
  id: n6
  cau: "Thời kỳ: đầu Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/schubert-ca-hoi
  id: n7
  cau: "Biên chế: piano, violin, viola, cello, contrabass."
  loai: ten
- trang: nghe-nhac/schubert-ca-hoi
  id: n8
  cau: "Chương 4: Andantino, chủ đề và biến tấu."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n9
  cau: Chương 4 dài khoảng 7–8 phút.
  loai: so-lieu
- trang: nghe-nhac/schubert-ca-hoi
  id: n10
  cau: Ngũ tấu được viết theo đề nghị của Sylvester Paumgartner, người bảo trợ âm nhạc ở Steyr.
  loai: lich-su
- trang: nghe-nhac/schubert-ca-hoi
  id: n11
  cau: Paumgartner chơi cello và rất thích ca khúc Die Forelle của Schubert.
  loai: lich-su
- trang: nghe-nhac/schubert-ca-hoi
  id: n12
  cau: Die Forelle (Con cá hồi) là ca khúc D. 550 của Schubert.
  loai: danh-muc
- trang: nghe-nhac/schubert-ca-hoi
  id: n13
  cau: "Biên chế khác thường, theo mẫu một ngũ tấu của Hummel mà Paumgartner muốn: không có violin thứ hai mà có một contrabass."
  loai: lich-su
- trang: nghe-nhac/schubert-ca-hoi
  id: n14
  cau: Contrabass giữ bè trầm, để piano được rảnh tay chơi ở âm vực cao.
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n15
  cau: Tác phẩm có 5 chương.
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n16
  cau: Chương 4 là một bộ biến tấu trên giai điệu ca khúc Con cá hồi.
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n18
  cau: Trong ca khúc gốc, người kể chuyện vui vẻ ngắm con cá hồi tung tăng dưới suối, cho đến khi một người câu cá làm đục nước để bắt nó.
  loai: lich-su
- trang: nghe-nhac/schubert-ca-hoi
  id: n19
  cau: "Theo dõi, Chủ đề: đàn dây chơi giai điệu ca khúc ở Rê trưởng, nhẹ nhàng; piano im lặng."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n20
  cau: "Theo dõi, Biến tấu 1: piano chơi giai điệu ở âm vực cao, đàn dây trang trí xung quanh."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n21
  cau: "Theo dõi, Biến tấu 2: viola (và cello) hát giai điệu; violin trang trí bên trên."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n22
  cau: "Theo dõi, Biến tấu 3: cello và contrabass chơi giai điệu ở âm vực trầm; piano chạy nốt nhanh lấp lánh bên trên."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n23
  cau: "Theo dõi, Biến tấu 4: chuyển sang Rê thứ: mạnh mẽ, dồn dập, kịch tính, như lúc nước suối bị khuấy đục."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n24
  cau: "Theo dõi, Biến tấu 5: cello hát giai điệu biến đổi, trầm tư, ở giọng xa (Si♭ trưởng)."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n25
  cau: "Theo dõi, Allegretto cuối: trở về Rê trưởng; piano chơi hình đệm róc rách của ca khúc gốc, như con cá hồi lại tung tăng."
  loai: cau-truc
- trang: nghe-nhac/schubert-ca-hoi
  id: n28
  cau: 'Nguồn: tổng phổ trên IMSLP (tìm "D.667").'
  loai: ten
- trang: nghe-nhac/schubert-ca-hoi
  id: n30
  cau: "Nguồn: ai chơi giai điệu ở từng biến tấu, giọng theo tổng phổ chương 4 (bản quét trên Internet Archive) và Die Forelle bản Peters; hoàn cảnh sáng tác theo lời tựa Henle (HN 463) và lời kể của Albert Stadler trích trong ghi chú chương trình của Chris Darwin (Đại học Sussex)."
  loai: ten
- trang: nghe-nhac/schubert-ca-hoi
  id: n26
  cau: 'Câu hỏi nghe chủ động: giai điệu ở nhạc cụ nào trong mỗi biến tấu, "đây là bài tập nhận biết âm sắc rất tốt"; nghe Die Forelle D. 550 trước rồi nghe lại chương 4; biến tấu giọng thứ tạo cảm giác gì.'
  loai: khuyen-tap
- trang: nghe-nhac/schubert-erlkonig
  id: n1
  cau: "Tiêu đề: Schubert, Erlkönig (Vua tinh)."
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n2
  cau: "Mô tả trang: một người cha ôm đứa con nhỏ phi ngựa trong đêm lộng gió; đứa trẻ thấy Vua tinh hiện ra dụ dỗ mình, người cha không thấy gì; khi về đến nhà, đứa trẻ đã…"
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n3
  cau: "Nhà soạn nhạc: Franz Schubert (1797–1828)."
  loai: nam
- trang: nghe-nhac/schubert-erlkonig
  id: n4
  cau: "Lời: bài thơ Erlkönig của Johann Wolfgang von Goethe."
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n5
  cau: "Sáng tác: 1815, khi Schubert 18 tuổi (D. 328)."
  loai: nam
- trang: nghe-nhac/schubert-erlkonig
  id: n6
  cau: "Thời kỳ: Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n7
  cau: "Thể loại: Lied (ca khúc nghệ thuật) cho giọng hát và piano."
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n8
  cau: "Độ dài: khoảng 4 phút."
  loai: so-lieu
- trang: nghe-nhac/schubert-erlkonig
  id: n9
  cau: "Bản thu gợi ý: Dietrich Fischer-Dieskau (baritone) và Gerald Moore (piano)."
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n10
  cau: Một người cha ôm đứa con nhỏ phi ngựa trong đêm lộng gió. Đứa trẻ thấy Vua tinh hiện ra dụ dỗ mình, nhưng người cha không nhìn thấy gì. Khi về đến nhà, đứa trẻ đã chết.
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n11
  cau: Một ca sĩ hát cả bốn vai, và Schubert cho mỗi vai một "giọng" riêng.
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n12
  cau: "Người kể chuyện: âm vực giữa, trung tính."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n13
  cau: "Người cha: âm vực thấp, bình tĩnh, trấn an."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n14
  cau: "Đứa con: âm vực cao, hoảng loạn; mỗi lần kêu lại cao hơn một chút."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n15
  cau: "Vua tinh: ngọt ngào, êm ái, ở giọng trưởng, rất nhỏ (pp)."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n16
  cau: "Piano không chỉ đệm: tiếng nốt liên ba lặp lại không ngừng ở tay phải là tiếng vó ngựa phi trong đêm."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n17
  cau: Tay trái là một chuỗi nốt liên ba chạy lên rồi xuống ở âm vực trầm, tối và đầy đe dọa.
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n18
  cau: "Phần piano này rất khó: trong một bản soạn khác của bài, chính Schubert đã viết lại các nhóm liên ba thành nhóm hai nốt móc đơn dễ hơn."
  loai: lich-su
- trang: nghe-nhac/schubert-erlkonig
  id: n19
  cau: "Theo dõi, dòng 1: piano mở đầu: vó ngựa liên ba, giai điệu trầm cuộn lên ở tay trái."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n20
  cau: "Theo dõi, dòng 2: người kể chuyện giới thiệu cảnh: người cha và đứa con trong đêm."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n21
  cau: "Theo dõi, dòng 3: cha hỏi con sợ gì; con thấy Vua tinh; cha trấn an: chỉ là sương mù."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n22
  cau: "Theo dõi, dòng 4: Vua tinh lần 1: dỗ dành ngọt ngào, nhạc chuyển sang giọng trưởng, nhẹ hơn."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n23
  cau: 'Theo dõi, dòng 5: đứa con kêu "Cha ơi!" lần 1; cha trấn an: chỉ là gió xào xạc.'
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n24
  cau: "Theo dõi, dòng 6: Vua tinh lần 2, rồi đứa con kêu lần 2, cao hơn."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n25
  cau: "Theo dõi, dòng 7: Vua tinh lần 3: đe dọa, dùng sức mạnh. Đứa con kêu lần 3, cao nhất."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n26
  cau: "Theo dõi, dòng 8: người cha phi nhanh hơn, piano dồn dập."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n27
  cau: "Theo dõi, dòng 9: về đến nơi: piano ngừng, người kể nói rằng đứa con đã chết, gần như bằng giọng nói."
  loai: cau-truc
- trang: nghe-nhac/schubert-erlkonig
  id: n30
  cau: "Nguồn: bản nhạc và tổng phổ trên IMSLP (tìm theo tên nhà soạn nhạc và số hiệu danh mục)."
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n31
  cau: "Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online."
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n32
  cau: "Nguồn: giọng, cách viết cho từng vai và khuông nhạc theo bản Edition Peters (Schubert-Album, tập 1, Max Friedlaender biên tập, khoảng 1890), bản quét trên Internet Archive; tốc độ Schnell, ♩ = 152 theo bản ấy."
  loai: ten
- trang: nghe-nhac/schubert-erlkonig
  id: n28
  cau: Ba câu hỏi nghe chủ động (phân biệt bốn nhân vật; vì sao Vua tinh ở giọng trưởng và rất nhỏ; cảm giác khi piano dừng ở câu cuối).
  loai: khuyen-tap
- trang: nghe-nhac/tchaikovsky-1812
  id: n1
  cau: "Tiêu đề: Tchaikovsky, 1812 Overture."
  loai: ten
- trang: nghe-nhac/tchaikovsky-1812
  id: n2
  cau: "Mô tả trang: Tchaikovsky viết tác phẩm từ tháng 9 đến tháng 11/1880, theo đặt hàng của Nikolai Rubinstein, cho Triển lãm Nghệ thuật và Công nghiệp toàn Nga ở Moscow; buổi ra mắt chính thức…"
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n3
  cau: "Nhà soạn nhạc: Pyotr Ilyich Tchaikovsky (1840–1893)."
  loai: nam
- trang: nghe-nhac/tchaikovsky-1812
  id: n4
  cau: "Tên đầy đủ: overture lễ hội Năm 1812 (1812 год)."
  loai: ten
- trang: nghe-nhac/tchaikovsky-1812
  id: n5
  cau: "Số danh mục và giọng: Op. 49, Mi♭ trưởng."
  loai: danh-muc
- trang: nghe-nhac/tchaikovsky-1812
  id: n6
  cau: Sáng tác tháng 9–11/1880.
  loai: nam
- trang: nghe-nhac/tchaikovsky-1812
  id: n7
  cau: Ra mắt chính thức ngày 20/8/1882 ở Moscow.
  loai: nam
- trang: nghe-nhac/tchaikovsky-1812
  id: n8
  cau: "Thời kỳ: Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n9
  cau: 'Thể loại: overture hòa nhạc cho dàn nhạc giao hưởng lớn, thêm chuông, "đại bác" và ban nhạc kèn (tùy chọn).'
  loai: ten
- trang: nghe-nhac/tchaikovsky-1812
  id: n10
  cau: "Độ dài: khoảng 15 phút."
  loai: so-lieu
- trang: nghe-nhac/tchaikovsky-1812
  id: n11
  cau: Tchaikovsky viết tác phẩm từ tháng 9 đến tháng 11/1880, theo đặt hàng của Nikolai Rubinstein, cho Triển lãm Nghệ thuật và Công nghiệp toàn Nga ở Moscow.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n12
  cau: Trong các dịp được gợi ý lúc đặt hàng có lễ thánh hiến Nhà thờ Chúa Cứu thế.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n13
  cau: Bản in đầu ghi overture "viết cho dịp thánh hiến Nhà thờ Chúa Cứu thế".
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n14
  cau: Nhà thờ Chúa Cứu thế dựng để tưởng niệm chiến thắng của Nga trước Napoleon năm 1812.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n15
  cau: Triển lãm dời sang năm 1882; buổi ra mắt chính thức ngày 20/8/1882 ở hội trường của triển lãm, Ippolit Altani chỉ huy.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n16
  cau: Trước buổi ra mắt chính thức đã có hai buổi diễn cùng năm 1882, ở Ozerki và Pavlovsk.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n17
  cau: Tchaikovsky kể lại cuộc chiến bằng âm nhạc, với hai "phe" được đại diện bằng hai bài quốc ca của thời ông.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n18
  cau: "Phe Pháp (quân xâm lược): quốc ca Pháp La Marseillaise."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n19
  cau: "Phe Nga: lời cầu nguyện Lạy Chúa, xin cứu dân Ngài (cầu chiến thắng nơi chiến trận), hai giai điệu Nga, rồi cuối cùng là quốc ca Nga hoàng God Save the Tsar! (bài này viết năm 1833)."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n20
  cau: Marseillaise trở lại nhiều lần, rồi lần cuối ở cao trào, sau đó tiếng đại bác nổ và dàn nhạc đổ xuống.
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n21
  cau: Lời cầu nguyện mở đầu trở lại cùng chuông, và tác phẩm khép bằng God Save the Tsar! với chuông và đại bác.
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n22
  cau: Tổng phổ ghi "đại bác", nhưng Tchaikovsky muốn dùng chiếc trống lớn treo mà nhà hát vẫn dùng để giả tiếng đại bác.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n23
  cau: Ở các buổi diễn ngoài trời, như đêm 4/7 của Boston Pops từ năm 1974, người ta dùng đại bác thật.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n24
  cau: Lúc viết, Tchaikovsky cho rằng overture "sẽ rất to và ồn ào", và vì viết không có tình cảm nồng nhiệt nên có lẽ thiếu giá trị nghệ thuật.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n25
  cau: Từ buổi ra mắt, overture luôn nằm trong số tác phẩm được biết đến và được diễn nhiều nhất của Tchaikovsky; chính ông chỉ huy nó 13 lần, nhiều hơn mọi tác phẩm khác của mình.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n26
  cau: "Bảng Theo dõi, dòng 1: mở đầu chậm (Largo): lời cầu nguyện Lạy Chúa, xin cứu dân Ngài, viola và cello chơi một mình, rồi kèn gỗ đáp."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n27
  cau: "Dòng 2: nhịp quân hành (Andante): oboe, clarinet và kèn horn chơi một hiệu kèn trên tiếng trống con rền."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n28
  cau: "Dòng 3: Allegro giusto: dàn dây đuổi nhau dồn dập; rồi kèn horn chơi một đoạn La Marseillaise — phe Pháp."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n29
  cau: "Dòng 4: hai giai điệu Nga: giai điệu trữ tình ở violin và viola, rồi bài dân ca Bên cổng ở sáo và cor anglais, trên tiếng trống lục lạc."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n30
  cau: "Dòng 5: trận chiến: Marseillaise trở lại nhiều lần, đan với nhạc Nga."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n31
  cau: "Dòng 6: cao trào: tiếng đại bác nổ, rồi dàn nhạc đổ xuống, chậm dần."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n32
  cau: "Dòng 7: đại bác và chuông: lời cầu nguyện mở đầu trở lại, cả dàn nhạc và chuông; rồi phần kết nhanh với God Save the Tsar! và đại bác — chiến thắng."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n33
  cau: "Câu hỏi: đếm xem đoạn La Marseillaise vang lên bao nhiêu lần, và nhạc cụ nào chơi nó; Tchaikovsky Research ghi năm lần trích."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n34
  cau: "Câu hỏi: đoạn nào nghe ra tiếng đại bác (hoặc trống thay thế trong bản thu trong nhà)."
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n35
  cau: 'Câu hỏi: nhạc cụ tạo cảm giác "trận chiến"; gợi ý: trống con ở đoạn quân hành, kèn horn chơi Marseillaise, và đại bác ở cao trào.'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-1812
  id: n37
  cau: 'Nguồn: bản nhạc và tổng phổ trên IMSLP (tìm "Op.49").'
  loai: ten
- trang: nghe-nhac/tchaikovsky-1812
  id: n38
  cau: "Nguồn: bối cảnh lịch sử theo Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online."
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-1812
  id: n39
  cau: "Nguồn: bối cảnh, ngày tháng, biên chế và vị trí các giai điệu theo Tchaikovsky Research, The Year 1812."
  loai: ten
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n1
  cau: "Tiêu đề: Tchaikovsky, Hồ thiên nga, Cảnh (Scène) màn 2."
  loai: ten
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n2
  cau: "Mô tả trang: Hồ thiên nga kể chuyện hoàng tử Siegfried yêu Odette, nàng công chúa bị phép thuật giữ làm thiên nga ban ngày, chỉ hóa lại thành người vào ban đêm. Bản dựng…"
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n3
  cau: "Nhà soạn nhạc: Pyotr Ilyich Tchaikovsky (1840–1893)."
  loai: nam
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n4
  cau: "Tác phẩm: ballet Hồ thiên nga, Op. 20."
  loai: danh-muc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n5
  cau: "Sáng tác: 1875–1876."
  loai: nam
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n6
  cau: Công diễn lần đầu ở Nhà hát Bolshoi, Moskva, năm 1877.
  loai: nam
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n7
  cau: "Thời kỳ: Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n8
  cau: 'Đoạn nghe: "Cảnh" (Scène) mở đầu màn 2, chủ đề thiên nga.'
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n9
  cau: "Độ dài: khoảng 3 phút."
  loai: so-lieu
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n10
  cau: Hồ thiên nga kể chuyện hoàng tử Siegfried yêu Odette, nàng công chúa bị phép thuật giữ làm thiên nga ban ngày, chỉ hóa lại thành người vào ban đêm.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n11
  cau: Bản dựng đầu tiên ở Moskva diễn đến mùa 1882/83 rồi thôi, và không được dựng lại ở Nga khi Tchaikovsky còn sống.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n12
  cau: Phiên bản được dựng khắp nơi trong thế kỷ 20 bắt nguồn từ bản dựng mới ở St. Petersburg năm 1895 (biên đạo Marius Petipa và Lev Ivanov), sau khi Tchaikovsky mất.
  loai: lich-su
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n13
  cau: Chủ đề thiên nga buồn, đầy khao khát, ở giọng Si thứ.
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n14
  cau: "Theo dõi, dòng 1: đàn hạc rải hợp âm, đàn dây rung tremolo khẽ: mặt hồ ban đêm."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n15
  cau: "Theo dõi, dòng 2: oboe hát chủ đề thiên nga: u buồn, bay bổng."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n16
  cau: "Theo dõi, dòng 3: chủ đề được nhắc lại, các nhạc cụ khác tham gia, cường độ tăng dần."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n17
  cau: "Theo dõi, dòng 4: kèn đồng và cả dàn nhạc chơi chủ đề fortissimo: kịch tính, bi tráng."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n18
  cau: "Theo dõi, dòng 5: lắng xuống, trở lại không khí huyền bí."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n20
  cau: "Nghe thêm từ vở này: các Điệu múa của thiên nga (số 13, màn 2), một chuỗi bảy điệu múa ngắn."
  loai: cau-truc
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n22
  cau: "Nguồn: bản nhạc và tổng phổ trên IMSLP (tìm theo tên nhà soạn nhạc và số hiệu danh mục)."
  loai: ten
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n23
  cau: "Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online."
  loai: ten
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n24
  cau: "Nguồn: nhạc cụ và giọng ở số 10 theo tổng phổ (bản quét trên Internet Archive); năm sáng tác, công diễn và cốt truyện bản 1877 theo Tchaikovsky Research."
  loai: ten
- trang: nghe-nhac/tchaikovsky-ho-thien-nga
  id: n19
  cau: "Câu hỏi nghe chủ động: vì sao Tchaikovsky chọn oboe cho chủ đề này; đếm số lần chủ đề xuất hiện và nhạc cụ chơi; xem video vở ballet."
  loai: khuyen-tap
