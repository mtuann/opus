- trang: nghe-nhac/beethoven-5
  id: n1
  cau: "Tiêu đề: Beethoven, Giao hưởng số 5."
  loai: ten
- trang: nghe-nhac/beethoven-5
  id: n2
  cau: 'Mô tả trang: Bản giao hưởng mở đầu bằng bốn nốt "ngắn – ngắn – ngắn – dài"; đầu ô nhịp, đúng vào phách mạnh, là một dấu lặng ngắn, nên ba nốt ngắn bắt đầu "lệch" khỏi phách mạnh.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n3
  cau: "Nhà soạn nhạc: Ludwig van Beethoven (1770–1827)."
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n4
  cau: "Tên đầy đủ: Giao hưởng số 5 cung Đô thứ, Op. 67."
  loai: danh-muc
- trang: nghe-nhac/beethoven-5
  id: n5
  cau: "Năm sáng tác: 1804–1808."
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n6
  cau: Công diễn lần đầu tại Vienna ngày 22/12/1808.
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n7
  cau: "Thời kỳ: Cổ điển, chuyển sang Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n8
  cau: "Thể loại: giao hưởng, 4 chương."
  loai: so-lieu
- trang: nghe-nhac/beethoven-5
  id: n9
  cau: "Độ dài: khoảng 30–35 phút."
  loai: so-lieu
- trang: nghe-nhac/beethoven-5
  id: n10
  cau: "Bản thu gợi ý: Carlos Kleiber và Wiener Philharmoniker (Deutsche Grammophon, thu năm 1974)."
  loai: nam
- trang: nghe-nhac/beethoven-5
  id: n11
  cau: Bản giao hưởng mở đầu bằng bốn nốt "ngắn – ngắn – ngắn – dài".
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n12
  cau: Đầu ô nhịp, đúng vào phách mạnh, là một dấu lặng ngắn, nên ba nốt ngắn bắt đầu "lệch" khỏi phách mạnh.
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n13
  cau: "Toàn bộ chương 1 được xây dựng từ môtip bốn nốt: môtip bị lặp lại, chuyển giọng, chia nhỏ, chồng lên nhau."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n14
  cau: Chương 1 là ví dụ điển hình về cách một ý tưởng rất nhỏ được phát triển thành cả một chương nhạc.
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n15
  cau: "Chương 1: Allegro con brio, Đô thứ, hình thức sonata."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n16
  cau: "Chương 2: Andante con moto, La♭ trưởng, biến tấu kép (hai chủ đề luân phiên)."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n17
  cau: "Chương 3: Allegro, Đô thứ, scherzo và trio."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n18
  cau: "Chương 4: Allegro, Đô trưởng, hình thức sonata."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n19
  cau: "Chương 3 chuyển thẳng sang chương 4 không ngắt nghỉ: nhạc lắng xuống, căng thẳng tích tụ, rồi bùng nổ thành Đô trưởng."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n20
  cau: Hành trình từ Đô thứ tăm tối đến Đô trưởng chiến thắng là ý tưởng lớn của cả bản giao hưởng.
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n22
  cau: Ở chương 1, chủ đề 2 là giai điệu êm hơn ở violin; ngay trước đó, kèn horn dẫn vào bằng chính nhịp "ngắn – ngắn – ngắn – dài".
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n23
  cau: Ở chương 3, nhịp "ngắn – ngắn – ngắn – dài" quay lại.
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n26
  cau: 'Bảng, dòng 1 (Môtip mở đầu): đàn dây và clarinet đồng âm "ngắn – ngắn – ngắn – dài", hai lần, mỗi lần dừng trên một dấu ngân.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n27
  cau: "Bảng, dòng 2 (Chủ đề 1): môtip chuyền từ bè dây này sang bè dây khác, chồng lên nhau, dồn lên một cao trào."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n28
  cau: "Bảng, dòng 3 (Kèn horn gọi): một câu ngắn, mạnh, dùng chính nhịp của môtip, mở đường sang Mi♭ trưởng."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n29
  cau: 'Bảng, dòng 4 (Chủ đề 2, Mi♭ trưởng): giai điệu êm ở violin; bên dưới, bè trầm vẫn gõ nhịp "ngắn – ngắn – ngắn – dài".'
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n30
  cau: "Bảng, dòng 5: hết phần trình bày; bản nhạc ghi dấu nhắc lại, nên nhiều bản thu chơi lại phần trình bày từ đầu."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n31
  cau: "Bảng, dòng 6 (Phát triển): môtip bị chia nhỏ dần, đến lúc chỉ còn những hợp âm đơn lẻ chuyền qua lại giữa kèn gỗ và đàn dây, rất nhỏ."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n32
  cau: "Bảng, dòng 7 (Tái hiện): môtip trở lại mạnh mẽ; ngay sau đó, oboe chơi một mình một câu ngắn và chậm (Adagio)."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n33
  cau: "Bảng, dòng 8 (Coda): dài bất thường, gần như một phần phát triển thứ hai, khép lại bằng môtip dứt khoát."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n34
  cau: "Bảng, dòng 9: cuối chương 3, nhạc lắng xuống rất nhỏ trên tiếng trống timpani gõ đều, rồi dâng lên và bùng nổ thành Đô trưởng ở đầu chương 4, không ngắt nghỉ."
  loai: cau-truc
- trang: nghe-nhac/beethoven-5
  id: n36
  cau: "Nguồn: bản nhạc và tổng phổ có trên IMSLP."
  loai: ten
- trang: nghe-nhac/beethoven-5
  id: n37
  cau: "Nguồn: bối cảnh lịch sử theo Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online."
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n38
  cau: "Nguồn: năm sáng tác và buổi công diễn theo Beethoven-Haus Bonn."
  loai: lich-su
- trang: nghe-nhac/beethoven-5
  id: n21
  cau: "Gợi ý: ở chương 1, đếm xem môtip bốn nốt xuất hiện ở bao nhiêu nhạc cụ khác nhau."
  loai: khuyen-tap
- trang: nghe-nhac/beethoven-5
  id: n24
  cau: "Gợi ý: so sánh tốc độ chương 1 giữa bản Kleiber và một bản thu khác."
  loai: khuyen-tap
- trang: nghe-nhac/beethoven-op132
  id: n1
  cau: "Tiêu đề: Beethoven, Tứ tấu đàn dây Op. 132, chương 3."
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n2
  cau: "Mô tả trang: tháng 4/1825, khi đang viết tứ tấu này, Beethoven lâm bệnh; khi bình phục, ông viết chương 3 với tiêu đề tiếng Đức Heiliger…"
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n3
  cau: "Nhà soạn nhạc: Ludwig van Beethoven (1770–1827)."
  loai: nam
- trang: nghe-nhac/beethoven-op132
  id: n4
  cau: "Tên đầy đủ: Tứ tấu đàn dây cung La thứ, Op. 132."
  loai: danh-muc
- trang: nghe-nhac/beethoven-op132
  id: n5
  cau: "Sáng tác: 1825, hai năm trước khi Beethoven mất."
  loai: nam
- trang: nghe-nhac/beethoven-op132
  id: n6
  cau: "Thời kỳ: Beethoven giai đoạn cuối (cầu nối sang Lãng mạn)."
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n7
  cau: "Biên chế: 2 violin, viola, cello."
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n8
  cau: Chương 3 dài khoảng 15–20 phút.
  loai: so-lieu
- trang: nghe-nhac/beethoven-op132
  id: n9
  cau: Tháng 4/1825, khi đang viết tứ tấu này, Beethoven lâm bệnh.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n10
  cau: Khi bình phục, Beethoven viết chương 3 với tiêu đề tiếng Đức "Heiliger Dankgesang eines Genesenen an die Gottheit, in der lydischen Tonart".
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n11
  cau: 'Tiêu đề dịch: "Khúc thánh ca tạ ơn của người vừa khỏi bệnh dâng lên Thượng đế, ở điệu thức Lydian".'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n12
  cau: Điệu thức Lydian là một điệu thức nhà thờ cổ, giống gam trưởng nhưng có bậc 4 được nâng.
  loai: dinh-nghia
- trang: nghe-nhac/beethoven-op132
  id: n13
  cau: Ở chương này, trên nốt Fa, Beethoven dùng Si tự nhiên thay vì Si♭.
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n14
  cau: Dùng một điệu thức nhà thờ cổ vào năm 1825 là một lựa chọn khác thường, cho âm nhạc một màu sắc cổ xưa.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n15
  cau: Đây là một trong năm tứ tấu cuối cùng của Beethoven.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n16
  cau: Như các tứ tấu cuối khác, Op. 132 cần thời gian mới được đón nhận rộng rãi; nay nó được coi là một trong những tứ tấu đàn dây hay nhất.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n17
  cau: Chương này là cửa vào tốt nhất của các tứ tấu cuối.
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n19
  cau: "Chương có cấu trúc A – B – A' – B' – A'': phần thánh ca luân phiên với phần \"sức lực mới\"."
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n20
  cau: "Phần A (Molto adagio): bốn đàn chơi một thánh ca chậm, từng câu ngắn, xen giữa là những đoạn bắt chước nhẹ; phần thánh ca đi bằng nốt trắng, cả bốn bè cùng chuyển hợp âm."
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n21
  cau: 'Phần B: Andante, "Neue Kraft fühlend" ("cảm thấy sức lực mới").'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n22
  cau: Phần B ở Rê trưởng, nhịp 3/8, nhanh hơn; violin 1 nhảy nhót với những nốt trang trí.
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n23
  cau: "Phần A': thánh ca trở lại, các bè xung quanh chuyển động nhiều hơn."
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n24
  cau: "Phần B': phần \"sức lực mới\" trở lại, trang trí phong phú hơn."
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n25
  cau: "Phần A'': \"Mit innigster Empfindung\" (\"với cảm xúc sâu thẳm nhất\")."
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n26
  cau: "Phần A'': thánh ca lần cuối, viết tự do hơn: một hình giai điệu ngắn chuyền qua các bè; căng thẳng tăng dần đến cao trào (f, sf) rồi lắng xuống, kết thúc rất nhỏ (pp)."
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n28
  cau: Phần thánh ca có tốc độ rất chậm.
  loai: cau-truc
- trang: nghe-nhac/beethoven-op132
  id: n29
  cau: Khi viết tác phẩm này Beethoven đã điếc nặng (bác sĩ phải viết vào sổ hội thoại để nói chuyện với ông).
  loai: lich-su
- trang: nghe-nhac/beethoven-op132
  id: n31
  cau: 'Nguồn: tổng phổ ở IMSLP (tìm "Beethoven Op.132").'
  loai: ten
- trang: nghe-nhac/beethoven-op132
  id: n32
  cau: "Nguồn: bối cảnh và hình thức theo Barry Cooper, chú giải Op. 132 của Chamber Music Society of Lincoln Center."
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n1
  cau: "Tiêu đề: Bizet, Habanera (trong opera Carmen)."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n2
  cau: "Mô tả trang: Carmen kể chuyện cô gái Digan tự do, quyến rũ ở Seville và người lính Don José, người vì cô mà đánh mất tất cả; ở buổi công diễn đầu, vở opera gây sốc vì đưa…"
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n3
  cau: "Nhà soạn nhạc: Georges Bizet (1838–1875)."
  loai: nam
- trang: nghe-nhac/bizet-habanera
  id: n4
  cau: "Tác phẩm: opera Carmen."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n5
  cau: "Công diễn: 1875, Opéra-Comique, Paris."
  loai: nam
- trang: nghe-nhac/bizet-habanera
  id: n6
  cau: "Aria: L'amour est un oiseau rebelle (Tình yêu là con chim nổi loạn), màn 1."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n7
  cau: "Giọng: mezzo-soprano."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n8
  cau: "Độ dài: khoảng 4–5 phút."
  loai: so-lieu
- trang: nghe-nhac/bizet-habanera
  id: n9
  cau: "Bản thu gợi ý: Elīna Garanča, Metropolitan Opera (2010)."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n10
  cau: Carmen kể chuyện cô gái Digan tự do, quyến rũ ở Seville và người lính Don José, người vì cô mà đánh mất tất cả.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n11
  cau: Ở buổi công diễn đầu, vở opera gây sốc vì đưa những nhân vật bình dân, thô ráp lên sân khấu và kết thúc bằng một vụ án mạng.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n12
  cau: Bizet mất ba tháng sau buổi công diễn đầu (3/6/1875).
  loai: nam
- trang: nghe-nhac/bizet-habanera
  id: n13
  cau: Bizet không kịp thấy Carmen thành công trọn vẹn ở Vienna vào tháng 10/1875, rồi ở Brussels, St. Petersburg, London, New York.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n14
  cau: Habanera là màn ra mắt của Carmen.
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n15
  cau: Bizet dựa trên bài El arreglito của nhà soạn nhạc Tây Ban Nha Sebastián Yradier.
  loai: lich-su
- trang: nghe-nhac/bizet-habanera
  id: n16
  cau: Habanera là điệu nhảy gốc Cuba; Bizet dùng tiết tấu habanera ở bè trầm.
  loai: dinh-nghia
- trang: nghe-nhac/bizet-habanera
  id: n17
  cau: "Theo dõi, dòng 1: bè trầm bắt đầu tiết tấu habanera, lặp lại suốt bài như nhịp bước uốn lượn."
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n18
  cau: "Theo dõi, dòng 2: Carmen hát câu đầu, giai điệu đi xuống từng nửa cung, ở giọng Rê thứ."
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n19
  cau: "Theo dõi, dòng 3: điệp khúc chuyển sang Rê trưởng, sáng rõ; Carmen ngân \"L'amour!\" trong khi hợp xướng hát lại câu đi xuống; rồi Carmen hát \"L'amour est enfant de Bohême\", hợp xướng xen tiếng \"Prends garde à toi!\"."
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n20
  cau: "Theo dõi, dòng 4: lời thứ hai, giai điệu nửa cung trở lại."
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n21
  cau: "Theo dõi, dòng 5: điệp khúc lần hai: hợp xướng hát lại \"L'amour est enfant de Bohême\", Carmen và hợp xướng cùng kết bằng \"Prends garde à toi!\" thật mạnh."
  loai: cau-truc
- trang: nghe-nhac/bizet-habanera
  id: n26
  cau: "Nguồn: bản nhạc và tổng phổ trên IMSLP (tìm theo tên nhà soạn nhạc và số hiệu danh mục)."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n27
  cau: "Nguồn: Burkholder, Grout, Palisca, A History of Western Music; Grove Music Online."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n28
  cau: "Nguồn: thứ tự các đoạn, giọng và bè trầm trong khuông nhạc theo bản piano–thanh nhạc của Choudens (Paris, khoảng 1900) và G. Schirmer (New York, 1895), bản quét trên Internet Archive."
  loai: ten
- trang: nghe-nhac/bizet-habanera
  id: n23
  cau: Ba câu hỏi nghe chủ động (giai điệu nửa cung và tính cách Carmen; giọng thứ sang trưởng; tiết tấu habanera trong bài hát hiện đại).
  loai: khuyen-tap
- trang: nghe-nhac/mendelssohn-violin
