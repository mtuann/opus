- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n74
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên tập hợp lý, không có điều gì về sức khỏe. La♯4–Đô♯6 đúng là quãng mười (quãng ba cộng một quãng tám), khớp cách đọc bản Peters của review (ô 12 không ghi dấu rải, ngoặc là số ngón); hai cách chơi (cùng lúc hay rải nhanh) và việc làm nốt trên cùng hát rõ là lựa chọn diễn tấu, không nói như bản nhạc ghi."
