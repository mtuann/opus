  ghi_chu: "Bản quét bản in 1895 (E1, BnF Vm12.15616(1), Commons, 4 trang nhạc: 15+20+21+22 = 78 ô) và file LilyPond của Mutopia (31 ô phần nhắc + 8 ô kết 1 + 8 ô kết 2 = 78 ô khi viết ra; IMSLP ghi 78 bars). Nốt trầm ghi nốt trắng chấm dôi cả ô, tay trái phải rời để đánh hợp âm ở phách 2 (Henle: hợp âm 'vollständig von der linken Hand zu spielen'): đúng. Lưu ý: bản in 1895 không ghi ký hiệu bàn đạp nào; 'đổi bàn đạp mỗi ô ở nốt trầm' là cách chơi suy từ cách ghi, nên trang đừng viết như thể bản nhạc ghi."
