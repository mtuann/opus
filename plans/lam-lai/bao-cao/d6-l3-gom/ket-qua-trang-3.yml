  ghi_chu: "Bản quét bản in 1895 (E1, BnF Vm12.15616(1), Commons, 4 trang nhạc: 15+20+21+22 = 78 ô) và file LilyPond của Mutopia (31 ô phần nhắc + 8 ô kết 1 + 8 ô kết 2 = 78 ô khi viết ra; IMSLP ghi 78 bars). Bản in: pp ở ô 1 (giữa hai khuông), ô 5 (giai điệu), ô 13; p ở ô 22; f duy nhất ở ô 9 dưới Fa♯ ngân của câu 1; lượt 2: pp ô 40, 44, 52, p ô 61, f ô 48. Henle (Bemerkungen T. 40, 52, 61) xác nhận vị trí ở E1."
