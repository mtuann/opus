  id: "n47"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "\\tuplet 3/2 móc kép (chùm ba), La thứ, \\pp ở nốt đầu, rồi chuỗi nửa cung đi xuống."
