  ghi_chu: "Bản quét bản in 1895 (E1, BnF Vm12.15616(1), Commons, 4 trang nhạc: 15+20+21+22 = 78 ô) và file LilyPond của Mutopia (31 ô phần nhắc + 8 ô kết 1 + 8 ô kết 2 = 78 ô khi viết ra; IMSLP ghi 78 bars). Đoạn giữa ô 22–31: Đô♮, Fa♮ đúng; bè trầm La (ô 22) rồi Rê ô 23–31: đúng. Nhưng giai điệu không cao hơn: câu 1 và câu 2 mở ở Fa♯5–La5, còn đoạn giữa bắt đầu ở La4 (La4–Si4–Đô5), phần lớn nằm Si4–Mi5 và đỉnh La5 (ô 28) chỉ bằng đỉnh câu 1. Nó đi lên dần (Rê–Mi–Fa–Sol–La ô 26–28), cao hơn đoạn cuối câu 2 (Mi4), nhưng không cao hơn hai câu trước."
  cau_dung: "Theo dõi, đoạn giữa: giai điệu đi lên từng bậc (từ La4 tới La5), Đô♮ và Fa♮ đổi màu; bè trầm chủ yếu giữ nốt Rê."
