- trang: "piano/tac-pham/satie-gymnopedie"
  id: "n12"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf"
  ghi_chu: "Henle lời tựa: Gymnopédies viết tháng 2 đến đầu tháng 4/1888 'shortly after Satie had left his parents' home and moved to the artistic quarter of Montmartre'; từ 12/1887 ông làm pianist ở cabaret Le Chat noir. Satie sinh 17/5/1866 nên lúc ấy 21 tuổi ('hơn hai mươi' đúng). Bản in còn ghi 'ERIK SATIE, 6 rue Cortot' (Montmartre)."
- trang: "piano/tac-pham/satie-gymnopedie"
  id: "n13"
  luot_2: "dung"
  nguon:
    - "https://web.archive.org/web/20261026105107/https://www.britannica.com/biography/Claude-Debussy"
    - "https://web.archive.org/web/2026/https://www.britannica.com/biography/Richard-Wagner-German-composer"
  ghi_chu: "Britannica (Debussy): ảnh hưởng chính là Wagner, 'Wagner fulfilled the sensuous ambitions not only of composers but also of the Symbolist poets and the Impressionist painters', có 'Wagner's French disciples'; Britannica (Wagner): ảnh hưởng 'revolutionary' lên nhạc phương Tây. Phần 'dàn nhạc khổng lồ, hòa âm đặc, cảm xúc dâng trào' là mô tả khái quát phổ biến, nguồn không nói từng chữ."
- trang: "piano/tac-pham/satie-gymnopedie"
  id: "n14"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf"
    - "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(09_of_14).jpg"
    - "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(10_of_14).jpg"
    - "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(11_of_14).jpg"
    - "https://commons.wikimedia.org/wiki/File:1%C3%A8re_gymnop%C3%A9die_-_Erik_Satie_;_%C3%A0_Mademoiselle_Jeanne_de_Bret_-_btv1b520000770_(12_of_14).jpg"
  ghi_chu: "Henle lời tựa: 'statically conceived throughout, avoiding any sort of development'. Bản in: hai lớp mỏng (giai điệu, tay trái nốt trầm và hợp âm), sắc thái pp–p."
- trang: "piano/tac-pham/satie-gymnopedie"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://web.archive.org/web/20260906162513/https://www.britannica.com/topic/Trois-gymnopedies"
    - "https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf"
  ghi_chu: "Britannica: 'derived from a festival of ancient Sparta at which young men danced and competed ... unencumbered by clothing'. Henle: lễ hội hằng năm, trai trẻ không vũ khí thi đấu và múa."
- trang: "piano/tac-pham/satie-gymnopedie"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf"
  ghi_chu: "Henle lời tựa: 'By his own admission he had been inspired ... on reading Flaubert's novel Salammbô, but – as frequently with Satie – such admissions are full of irony and therefore consciously misleading.'"
- trang: "piano/tac-pham/satie-gymnopedie"
  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf"
    - "https://web.archive.org/web/20260906162513/https://www.britannica.com/topic/Trois-gymnopedies"
    - "https://imslp.org/wiki/3_Gymnop%C3%A9dies_(Satie,_Erik)"
  ghi_chu: "Henle: Debussy thân với Satie từ 1891, phối khí số 1 và số 3 (công diễn 20/2/1897), 'laid the foundation for the pieces' success'. Britannica: Debussy 'a friend, later orchestrated Gymnopédies No. 3 and No. 1'. IMSLP có bản Baudoux 1897."
- trang: "piano/tac-pham/satie-gymnopedie"
  id: "n19"
  luot_2: "dung"
  nguon:
    - "https://web.archive.org/web/20260906162513/https://www.britannica.com/topic/Trois-gymnopedies"
    - "https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf"
  ghi_chu: "Britannica: 'The Trois gymnopédies are the best-known of Satie's piano pieces.' Henle: 'among the most popular works'."
