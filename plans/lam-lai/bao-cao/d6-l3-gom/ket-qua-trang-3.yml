    - "https://www.henle.de/us/Bagatelle-in-a-minor-WoO-59-Fuer-Elise/HN-1347"
  ghi_chu: "IMSLP và Henle HN 1347 ghi tên Für Elise, số WoO 59; tác giả Beethoven."
- trang: "piano/tac-pham/fur-elise"
  id: "n2"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Lời nói đầu Henle: \"one of Ludwig van Beethoven's best-known works\". Bản B&H 1888 (Mutopia) dài hơn 100 ô, tám ô đầu chỉ là câu a của đoạn A."
- trang: "piano/tac-pham/fur-elise"
  id: "n3"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Đối chiếu bản B&H 1888 (file .ly của Mutopia): A La thứ, chuỗi móc kép; B Fa trưởng có nốt láy và đường chạy móc ba (32nd); C với La trầm (a,16) lặp liên tục ở tay trái."
- trang: "piano/tac-pham/fur-elise"
  id: "n4"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Ô 2: tay trái a,16 e a (La2–Mi3–La3), rồi tay phải c' e' a' (Đô4–Mi4–La4): dòng móc kép đi từ tay trái sang tay phải."
- trang: "piano/tac-pham/fur-elise"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://enc.piano.or.jp/en/musics/446"
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "PTNA ghi thời lượng 3 phút 30 giây; MIDI của Mutopia (♩ = 72) dài khoảng 2 phút 10 giây; các bản thu thường 2½–3½ phút. \"Ba phút\" là con số tròn chấp nhận được."
- trang: "piano/tac-pham/fur-elise"
  id: "n8"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/rondo/"
    - "https://enc.piano.or.jp/en/musics/446"
  ghi_chu: "Bản B&H 1888: A – B (Fa trưởng) – A – C (La trầm lặp) – A, chủ đề ba lần. Open Music Theory, chương Rondo: dạng ABACA (rondo năm phần). PTNA ghi \"ロンド形式\" (hình thức rondo)."
- trang: "piano/tac-pham/fur-elise"
  id: "n10"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Bản B&H 1888 dài hơn 100 ô (Henle nhắc tới ô 102); tám ô đầu là phần nhỏ."
- trang: "piano/tac-pham/fur-elise"
  id: "n11"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/us/Bagatelle-in-a-minor-WoO-59-Fuer-Elise/HN-1347"
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
  ghi_chu: "Henle (tiểu sử): Beethoven chịu lễ rửa tội ngày 17/12/1770, có lẽ sinh 16/12/1770. Bài hoàn thành mùa xuân 1810 (lời nói đầu Henle), lúc ấy ông 39 tuổi."
- trang: "piano/tac-pham/fur-elise"
  id: "n12"
  luot_2: "dung"
  nguon:
    - "https://www.beethoven.de/en/media/view/5010945952710656"
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
  ghi_chu: "Beethoven-Haus (BH 116): tờ phác thảo có cả nhạc Egmont op. 84, \"Beethoven was working on up to the summer of 1810\". Henle: giấy và phác thảo Egmont cho phép đặt bản nháp vào mùa xuân 1810."
- trang: "piano/tac-pham/fur-elise"
  id: "n13"
  luot_2: "dung"
  nguon:
    - "https://www.beethoven.de/en/media/view/5075813951078400/scan/0"
  ghi_chu: "Thư gửi Wegeler, Wien 2/5/1810 (Beethoven-Haus, W 19): ông viết lẽ ra mình có thể là một trong những người hạnh phúc nhất nếu không có \"con quỷ trong tai\", tức bệnh điếc."
- trang: "piano/tac-pham/fur-elise"
  id: "n14"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/us/Bagatelle-in-a-minor-WoO-59-Fuer-Elise/HN-1347"
  ghi_chu: "Tiểu sử Beethoven trên trang Henle: \"1803–10/12 Frenzy of creativity; these years are dubbed Beethoven's 'heroic period'\". Năm 1810 nằm trong giai đoạn này."
- trang: "piano/tac-pham/fur-elise"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
    - "https://imslp.org/wiki/7_Bagatelles,_Op.33_(Beethoven,_Ludwig_van)"
    - "https://imslp.org/wiki/11_Bagatelles,_Op.119_(Beethoven,_Ludwig_van)"
  ghi_chu: "Henle: Beethoven tặng bản viết tay và không giữ bản sao; mùa thu 1822 ông định đưa WoO 59 vào một tập \"Bagatellen\" (số 12), tập về sau in thành Op. 119; Henle gọi bài là Bagatelle. Op. 33, Op. 119 là các tập bagatelle của chính ông. Câu hơi khái quát (không phải mọi bagatelle đều để tặng), nhưng không sai."
- trang: "piano/tac-pham/fur-elise"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://en.wiktionary.org/wiki/bagatelle"
  ghi_chu: "Wiktionary: bagatelle \"A trifle; an insubstantial thing\" (từ tiếng Ý bagattella). \"Chuyện vặt\" đúng nghĩa. Chưa mở được Merriam-Webster, Collins (403)."
- trang: "piano/tac-pham/fur-elise"
  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
  ghi_chu: "Henle: \"was not printed during his lifetime\"."
- trang: "piano/tac-pham/fur-elise"
  id: "n19"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
  ghi_chu: "Henle: năm 1865 Nohl tìm thấy bản viết tay trọn vẹn ở nhà Babette Bredl (München), được xem, chép và in; in năm 1867 trong Neue Briefe Beethovens; bản viết tay thất lạc từ cuối thế kỷ 19."
- trang: "piano/tac-pham/fur-elise"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
    - "https://www.henle.de/media/61/79/23/1697725639/1347-1697725639-sync.pdf"
  ghi_chu: "Henle: bản in của Nohl (B1) là nguồn chính; phần bình chú dùng thêm bản nháp BH 116 (A2) và phác thảo 1808 (A1) để sửa chỗ sai (ví dụ ô 7, ô 74)."
- trang: "piano/tac-pham/fur-elise"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
  ghi_chu: "Henle: danh tính Elise đã có \"a wealth of attempts\"; giả thuyết của Unger bị coi là không đứng vững, giả thuyết của May chỉ là phỏng đoán. Chưa giả thuyết nào được chứng minh."
- trang: "piano/tac-pham/fur-elise"
  id: "n22"
  luot_2: "dung"
  nguon:
    - "https://www.beethoven.de/en/media/view/5010945952710656"
    - "https://www.beethoven.de/de/media/view/5525208693735424/scan/0"
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
  ghi_chu: "Beethoven-Haus: Beethoven dạy piano cho Therese Malfatti và bị cô cuốn hút; mùa xuân 1810 ông yêu Therese và có ý định cưới (nhờ Wegeler gửi giấy rửa tội), Therese từ chối. \"Được cho là muốn cầu hôn\" là cách nói thận trọng, đúng."
- trang: "piano/tac-pham/fur-elise"
  id: "n23"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
  ghi_chu: "Henle: Max Unger (1922/23) cho rằng Nohl đã đọc nhầm \"Therese\" thành \"Elise\". (Henle nói thêm: so nét chữ \"Th\" và \"El\" cho thấy giả thuyết này khó đứng.)"
- trang: "piano/tac-pham/fur-elise"
  id: "n24"
  luot_2: "dung"
  nguon:
    - "http://www.michaelorenz.at/beethovens_elise"
  ghi_chu: "Bài của Michael Lorenz, \"Die 'Enttarnte Elise'. Elisabeth Röckels kurze Karriere als Beethovens 'Elise'\", Bonner Beethoven-Studien 9 (2011): phản bác Klaus Martin Kopitz; Röckel lấy Johann Nepomuk Hummel năm 1813."
- trang: "piano/tac-pham/fur-elise"
  id: "n25"
  luot_2: "khong-chac"
  nguon:
    - "https://charlespetzold.com/beethoven250/day239.html"
  ghi_chu: "Xác nhận được: Rita Steblin (The Musical Times, 2014, \"Who was Beethoven's 'Elise'? A new solution to the mystery\") đề xuất Elise Barensfeld, ca sĩ thần đồng 13 tuổi sống cạnh nhà Malfatti (bài của Charles Petzold). Không mở được bài gốc (JSTOR); chi tiết \"có thể là học trò piano của Therese Malfatti\" chỉ thấy ở Wikipedia, chưa có nguồn bậc 2."
- trang: "piano/tac-pham/fur-elise"
  id: "n26"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/53/13/68/1697725822/1347-1697725821-sync.pdf"
    - "https://www.beethoven.de/en/media/view/5010945952710656"
  ghi_chu: "Henle: Beethoven tặng bản viết tay; Nohl gọi bài là \"bản piano nhỏ, không quan trọng lắm nhưng rất duyên dáng\"; lời đề tặng \"zur Erinnerung\"."
- trang: "piano/tac-pham/fur-elise"
  id: "n29"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Bản B&H 1888: sau đoạn C là chùm ba móc kép rải La thứ đi lên (a c' e' … tới e''''), rồi chuỗi nửa cung đi xuống (bes''' a''' gis''' … f''), vào lại e'' dis''."
- trang: "piano/tac-pham/fur-elise"
  id: "n30"
  luot_2: "dung"
  nguon:
    - "https://dictionary.onmusic.org/terms/2652-poco"
    - "https://www.musicca.com/dictionary/italian/moto"
  ghi_chu: "OnMusic Dictionary: poco = \"a little\"; Musicca: moto = \"movement, motion\". Vế sau là cách hiểu khi chơi, hợp với nghĩa chữ."
- trang: "piano/tac-pham/fur-elise"
  id: "n31"
  luot_2: "dung"
  nguon:
    - "https://www.sjsu.edu/beethoven/collection/keyboards/"
  ghi_chu: "Ira F. Brilliant Center for Beethoven Studies (SJSU), bộ sưu tập đàn phím: fortepiano là cây đàn búa thời ấy, búa bọc da, khung như harpsichord, cách làm bàn đạp mỗi nhà làm đàn một khác; trưng bày để so với piano hiện đại."
- trang: "piano/tac-pham/fur-elise"
  id: "n33"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Bản B&H 1888: e''16 dis'' … ở pp (ghi pp ở nhịp lấy đà), hợp âm rải tay trái chuyền sang tay phải, câu kết ở a' (La)."
- trang: "piano/tac-pham/fur-elise"
  id: "n34"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "\\repeat volta 2 bao câu a đầu bài."
- trang: "piano/tac-pham/fur-elise"
  id: "n35"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Câu b: e''8. g'16 f'' e'' | d''8. f'16 … trên c g c' / g, g b (Đô trưởng, Sol), ngắn (khoảng 4 ô), rồi chuỗi e'' dis'' lặp kéo về câu a."
- trang: "piano/tac-pham/fur-elise"
  id: "n36"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Phần b + a nằm trong \\repeat volta 2 thứ hai, kết a' trên La (La thứ)."
- trang: "piano/tac-pham/fur-elise"
  id: "n37"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Đoạn B: hóa biểu Si♭ hiện qua nốt, tay trái f a c' a c' a (Fa trưởng, móc kép rải); giai điệu c''4 f''16. e''32 (chấm dôi) có nốt láy \\grace {f' a'} và appoggiatura bes'32."
- trang: "piano/tac-pham/fur-elise"
  id: "n38"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Hai ô móc ba c''32 g'' g' g'' … lặp hai lần, tay trái <c' e'> <f' g'> <e' g'> <d' f' g'> (hòa âm Đô, át của Fa), rồi e'' f'' e'' dis'' … dẫn về chủ đề."
- trang: "piano/tac-pham/fur-elise"
  id: "n39"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Sau B, A viết ra một lượt (a, b, a), không có dấu nhắc lại."
- trang: "piano/tac-pham/fur-elise"
  id: "n40"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Đoạn C: tay trái a, móc kép lặp liên tục; tay phải hợp âm (<e' g' bes' cis''>, <f' a' d''>…); về sau bè trầm a, → bes, → b, → c (La – Si♭ – Si – Đô)."
- trang: "piano/tac-pham/fur-elise"
  id: "n41"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Chùm ba móc kép rải La thứ từ a (La3) lên tới a''' và e'''' (hơn ba quãng tám), ghi pp, rồi chuỗi nửa cung đi xuống."
- trang: "piano/tac-pham/fur-elise"
  id: "n42"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Đoạn A cuối kết a'8 trên <a,, a,> (La). Không có thêm sắc thái sau pp của đoạn chuyển, nên \"kết thật nhẹ\" hợp với bản nhạc."
- trang: "piano/tac-pham/fur-elise"
  id: "n43"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Khớp bản B&H 1888: La thứ, câu b sang Đô trưởng; a nhắc lại; b + a nhắc lại; pp ở đầu; các câu kết ở a'."
- trang: "piano/tac-pham/fur-elise"
  id: "n44"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Khớp: Fa trưởng, nốt láy, nhịp chấm dôi trên hợp âm rải tay trái, hai ô móc ba trên hòa âm Đô (C, G7/C), chuỗi Mi–Rê♯ về A."
- trang: "piano/tac-pham/fur-elise"
  id: "n45"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "A trở lại viết ra một lượt, không dấu nhắc lại."
- trang: "piano/tac-pham/fur-elise"
  id: "n46"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly"
  ghi_chu: "Hợp âm tay phải quanh Rê thứ (<f' a' d''>, <gis' d'' f''>) và La thứ (<a' c'' e''>); tay trái a,16 lặp; bè trầm La – Si♭ – Si – Đô."
