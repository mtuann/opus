- trang: "piano/tac-pham/bach-prelude-do"
  id: "n13"
  luot_2: "khong-chac"
  nguon:
    - "https://www.henle.de/The-Well-Tempered-Clavier-Part-I-BWV-846-869/HN-14"
    - "https://www.henle.de/Notebook-for-Anna-Magdalena-Bach/HN-349"
  ghi_chu: "Henle xếp cả Prelude C BWV 846 (trang HN 14) lẫn Menuet BWV Anh. 114 (Minuet Sol trưởng, trang HN 349) ở mức 1 (easy), nên không xác nhận được Minuet 'nhẹ nhàng hơn'; không tìm được đề cương ABRSM có cả hai bài để so. Câu có lẽ đúng theo cảm nhận chung nhưng nguồn bậc 2 không phân biệt."
- trang: "piano/tac-pham/bach-prelude-do"
  id: "n14"
  luot_2: "dung"
  nguon:
    - "https://imslp.org/wiki/Das_wohltemperierte_Klavier_I,_BWV_846-869_(Bach,_Johann_Sebastian)"
    - "https://www.henle.de/media/f4/14/7f/1690886046/0014-1690886046-sync.pdf"
  ghi_chu: "IMSLP liệt kê BWV 846 (C major), 847 (C minor), 848 (C♯ major)… 869 (B minor): 24 prelude và fugue, trưởng rồi thứ cùng chủ âm, đi lên nửa cung. Lời tựa Henle: 'preludes and fugues in every key'."
- trang: "piano/tac-pham/bach-prelude-do"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/f4/14/7f/1690886046/0014-1690886046-sync.pdf"
  ghi_chu: "Lời tựa Heinemann (HN 14): Bach viết khi người ta tìm cách lên dây 'tempered' cho phép chơi ở mọi giọng, trong khi đàn lên dây theo hệ cũ chỉ chơi được một số giọng."
- trang: "piano/tac-pham/bach-prelude-do"
  id: "n16"
