    - "https://www.henle.de/media/f4/14/7f/1690886046/0014-1690886046-sync.pdf"
  ghi_chu: "Lời Schiff trong HN 14: 'The entire WTC can be played perfectly well without touching the pedal (with the exception of the end of the a-minor fugue in Book I…)'. Câu trên trang bỏ ngoại lệ cuối fugue La thứ; nếu sửa thì thêm 'trừ đoạn cuối fugue La thứ quyển 1'."
