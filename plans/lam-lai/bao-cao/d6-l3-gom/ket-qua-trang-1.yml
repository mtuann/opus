  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Như n39: ô 1 hợp âm + tam liên, ô 3 chấm dôi, ô 4 c''\\trill; ô 5–8 cao hơn một quãng tám."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n51"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Cặp luyến nửa cung + dấu lặng ô 9, 10, 13, 14; láy quanh ô 12; ô 14 tay trái <cis e a>, tay phải e'' cis'' a' g': La trưởng (La bảy) trước ô 15."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n52"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 15 \\f; nốt đen và tam liên tay phải; tay trái tam liên trên d; ô 20 tay phải d'4, tay trái <d fis>4: dừng trên hợp âm Rê."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n53"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 20 r8 a' a' a'; ô 21–28 lần một (ô 28 câu nối d'' cis'' b' a' gis'…), ô 29 = ô 21, lần hai tới ô 35; Rê trưởng; tay trái nốt La lặp."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n54"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 36–43 gam tam liên xen ô nốt đen lặp (37, 39, 41); ô 44, 47 quãng ba ngân trên gam tam liên tay trái, ô 45, 48 quãng ba staccato; ô 49–52 hợp âm kết; ':|' ô 52."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n55"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 53 <f' a' d''>2 (Rê thứ), ô 56 a''2 với tay trái a c' e' (La thứ), ô 57–58 Mi thứ, ô 59–62 tay trái Si lặp, ô 63–66 đi xuống, ô 66 tay trái d1 (Rê trầm)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n56"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Tay phải ô 67–72 trùng ô 1–6, ô 73 gần ô 7 (đổi nhịp); tay trái ô 72 hơi khác ô 6. Ô 75–78 Đô trưởng (Fa♮, tay trái Sol7–Đô), ô 79–81 tới La thứ qua Mi7 (gis ô 80)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n57"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 82–86 trùng nốt ô 15–19 cả hai tay; ô 87 khác ô 20 ở ba nốt làm đà. Đoạn này trên nốt Rê trầm, thuộc Sol trưởng."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n58"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 87 r8 d' d' d'; ô 88–102 chủ đề 2 ở Sol trưởng (giọng chủ)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n59"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 103–122 chuyển từ ô 36–52 sang Sol trưởng (dài hơn vì ô 116–120 thêm hợp âm kết); ô 122 hợp âm rồi r4 r2\\fermata."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n60"
  luot_2: "sai"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/"
  ghi_chu: "Bản nhạc: đoạn chuyển ở trình bày (ô 15–19) đã là Rê bảy có Đô♮ (c''! ô 15, 17) xen hợp âm Sol trên nốt Rê trầm, tức một nốt át ngân trong Sol trưởng; ô 82–86 trùng nốt. Vậy hợp âm Rê ô 20 cũng là át âm của Sol (nửa kết ở giọng chủ), giống hệt ô 87. Open Music Theory, Sonata Form: 'If the exposition's transition ended with a half cadence in the original key…, then the recapitulation can actually be restated in full without changes, and the secondary theme can simply start in the tonic key'. Giọng mới Rê trưởng chỉ đến khi chủ đề 2 vào ở ô 21. Ý 'tái hiện giải quyết trình bày' (chủ đề 2 về giọng chủ) vẫn đúng."
  cau_dung: "Hai lần đoạn chuyển giống hệt nhau và đều dừng trên hợp âm Rê, át âm của Sol (nửa kết ở giọng chủ). Ở phần trình bày, chủ đề 2 vào thẳng Rê trưởng ngay sau đó (ô 21), nên hợp âm Rê được nghe lại thành chủ âm của giọng mới; ở phần tái hiện, chủ đề 2 ở lại Sol trưởng (ô 88). Vì vậy phần tái hiện \"giải quyết\" phần trình bày."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n62"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
    - "https://web.archive.org/web/20260107081347/https://imslp.org/wiki/Piano_Sonata_No.20,_Op.49_No.2_(Beethoven,_Ludwig_van)"
  ghi_chu: "File .ly: source 'Breitkopf & Hartel (1862-1865)'; ô 1–5 không có ký hiệu sắc thái, \\p đầu tiên ở tay trái ô 6, cùng chỗ \\clef treble của tay trái; luyến g'( fis' g') ô 2, 6, láy rền ô 4, 8. IMSLP: bộ 'Ludwig van Beethovens Werke, Serie 16, No.143' (Breitkopf & Härtel; IMSLP ghi cả bộ [1862–68])."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n63"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Tay trái ô 2 r4 b4( a g), ô 3 fis4 d g f (f = Fa♮ trong Sol trưởng), ô 4 e4 fis g8…: Si La Sol Fa♯ Rê Sol Fa♮ Mi Fa♯ Sol; Fa♮ (ô 3) xuống Mi (ô 4)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n64"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Tay trái ô 6 b'8 d'' a' d'' g' d'' (ba, bốn, năm), ô 7 fis' d'' d' d'' (sáu, tám Rê–Rê) g' d'' f' d''. Ở ô 8 nốt trên đổi (e' g' fis' a' g'4), nên 'lặp Rê' đúng chủ yếu ở ô 6–7; chi tiết nhỏ, không đổi ý."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n65"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 4 c''\\trill \\grace { b'16 c'' }; ô 8 c'''\\trill \\grace { b''16 c''' }: hai nốt nhỏ Si–Đô in sẵn."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n66"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 1 <b d' g'>2 (phách 1) rồi tam liên d' g' b' d'' | c'' a' (phách 2); cùng kiểu ở ô 5, 53, 67, 71. Riêng ô 56 tay phải là nốt a''2 có hai nốt hoa mỹ c'' e'' (không phải hợp âm), tay trái rải La thứ; chi tiết nhỏ."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n67"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 3, 7, 69: a'4. a'8 b'4. b'8 (chấm dôi), sau các ô có tam liên (1, 5, 67)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n68"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 4, 8, 70: d''4 c''4\\trill + nốt kết: láy trên một nốt đen, ngay trước là Rê (nốt trên của Đô)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n69"
  luot_2: "dung"
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
  ghi_chu: "Dolmetsch, mục Trills: 'If, in the normal 4 3 harmony of the cadence, the 4 is already written out, the trill on the 3 starts on the beat' (tức từ nốt chính); 'For Beethoven, too, the evidence is largely circumstantial… In 1828… Hummel published his unambiguous opinion that a main-note start should be the norm'. Câu viết 'có thể', hợp các nguồn này."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n70"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 9–14 cặp luyến hai móc đơn rồi r8; ô 12 dấu turn đặt lệch phải (\\hspace #3.0) trên g'4., tức sau nốt Sol chấm dôi."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n71"
  luot_2: "dung"
  nguon:
    - "https://www.dolmetsch.com/musictheory23.htm"
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Dolmetsch: 'the turn is a sequence of four notes, the note above, the note itself, the note below, then the note itself again'; nốt phụ lấy theo hóa biểu (Sol trưởng: Fa♯). Trên Sol: La–Sol–Fa♯–Sol. Dấu đặt sau g'4. (ô 12) nên nằm trong phần chấm dôi."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n72"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 15 fis'4 (Fa♯4) rồi tam liên bắt đầu a'' (La5): Fa♯4–La5 là quãng mười (quãng tám + quãng ba thứ)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n73"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Gam trong file viết thành nhóm tam liên (ba nốt) ở các ô nêu. Ngón gam thông thường đi theo nhóm 1-2-3 và 1-2-3-4, nên ngón cái không luôn rơi đầu nhóm ba nốt; suy luận hợp lý về ngón."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n74"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Tay trái ô 6–7 Rê lặp ở trên (d''), ô 21–24 và 29–32 La lặp (a'), bè dưới fis' g' fis' cis' d'… mang hòa âm."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n75"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Tay trái ô 59–62 mỗi ô tám móc đơn, toàn nốt Si (ô 59, 61 bắt đầu b rồi bảy b'; ô 60, 62 tám b'). Phần 'dễ to dần, mỏi cổ tay' là nhận xét tập luyện hợp lý."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n76"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Fa♮ (f không dấu, hóa biểu có Fa♯): ô 74 f'', ô 75 f'' f', ô 76 tay trái d f g, ô 77 f' f'', ô 78 bốn f'' (cả ô 79 f')."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n83"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Ô 36–43 gam có cis, Rê trưởng; ô 75–78 có Fa♮, trên Sol7–Đô: Đô trưởng."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n85"
  luot_2: "dung"
  nguon:
    - "https://www.dolmetsch.com/defsa5.htm"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
  ghi_chu: "Dolmetsch: 'alla breve also called cut time, used for quick duple time in which the minim (half note)… is given one beat'. OMT: cut time = 2/2. Bản nhạc ghi \\time 2/2. Việc trang ghi tốc độ theo phách đen là chuyện của trang, không mâu thuẫn."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n87"
  luot_2: "dung"
  nguon:
    - "https://www.dolmetsch.com/defsa5.htm"
    - "https://www.dolmetsch.com/defsn1.htm"
  ghi_chu: "Dolmetsch: Allegro 'quick, not as fast as presto but faster than allegretto'; 'non troppo (Italian) not too much, moderately'."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n88"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
  ghi_chu: "OMT: số dưới '2, which means the half note gets the beat'; 2/2 là 'simple duple—two beats per measure'."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n90"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
    - "https://www.henle.de/media/df/c7/fd/1697725885/1327-1697725884-sync.pdf"
  ghi_chu: "Cả file .ly chỉ có bốn ký hiệu sắc thái: \\p ô 6 (tay trái), \\f ô 15, \\f ô 53, \\f ô 114 (tay trái). Henle thêm: bản in đầu 1805 của sonata số 2 không có sắc thái nào ngoài hai pp ở chương 2."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n92"
  luot_2: "sai"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "File .ly ô 2: g'4 g'( fis' g'): ba nốt đen Sol–Fa♯–Sol có dấu luyến (cũng ở ô 6, 68, 72); nốt đen không luyến chỉ ở ô 3–4 và đoạn chuyển (fis'4, c''4, b'4, g'4). Các vế còn lại đúng: cặp luyến ô 9–14, chủ đề 2 luyến d''4( cis'' d'' e''); ô 20 a' a' a' dẫn vào Rê đầu dấu luyến ô 21; staccato e'' e'' d'' ô 25–26; quãng ba đi xuống staccato ô 45, 48."
  cau_dung: "Phát âm: nốt đen không có dấu luyến (giai điệu ô 3–4, đoạn chuyển); ở ô 2 ba nốt Sol–Fa♯–Sol có dấu luyến; cặp nốt luyến (ô 9–14, chủ đề 2); ba nốt La làm đà ở ô 20 dẫn vào nốt Rê đầu dấu luyến; staccato trên các nốt Mi lặp (ô 25–26) và các quãng ba đi xuống (ô 45, 48)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n95"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "\\trill có ở đúng bốn chỗ: c'' ô 4, c''' ô 8, c'' ô 70 (đều kèm \\grace hai nốt), a'4\\trill ô 109 (không nốt kết)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n96"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "Dấu scripts.turn duy nhất ở ô 12, trên g'4., lệch phải (sau nốt)."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n97"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BeethovenLv/O49/LVB_Sonate_49no2_1/LVB_Sonate_49no2_1.ly"
  ghi_chu: "\\appoggiatura trước gam tam liên: d'' ô 36, fis'' ô 40, c'' ô 75, g'' ô 103, b'' ô 107. Ngoài ra còn nốt nhỏ không đứng trước gam: fis' ô 42 (trước e'4), c'' e'' ô 56 (trước a''2)."
