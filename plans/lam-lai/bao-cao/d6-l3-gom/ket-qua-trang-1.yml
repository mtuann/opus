  ghi_chu: "File .ly K. 545 chương 1: hai nửa có \\repeat volta 2; nửa đầu gồm chủ đề chính (ptrh) và chủ đề phụ (strh), nửa sau có phần tái hiện chủ đề chính ở Fa (\\transpose c f) rồi chủ đề phụ ở giọng chủ: hình thức sonata. Tay trái mở đầu đệm Alberti c8 g' e g; gam móc kép (a,8 b16 c d e f g a…)."
