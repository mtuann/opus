  ghi_chu: "Thayer, The Life of Ludwig van Beethoven, tập 1 (bản Krehbiel 1921), trích báo năm 1783: cậu bé Beethoven 'plays chiefly \"The Well-Tempered Clavichord\" of Sebastian Bach, which Herr Neefe put into his hands'."
- trang: "piano/tac-pham/bach-prelude-do"
  id: "n24"
  luot_2: "dung"
  nguon:
    - "https://imslp.org/wiki/Ave_Maria_(Gounod,_Charles)"
    - "https://blog.henle.de/en/2012/04/16/on-the-lookout-for-the-lost-measure-bach%e2%80%99s-c-major-prelude-from-the-well-tempered-clavier-i/"
  ghi_chu: "IMSLP Ave Maria (Gounod): 'Composition Year 1852-53, rev. 1859', bản Heugel [1853], in đầu tiên với tên Méditation, lời Latin về sau (1859). Blog Henle: Méditation 'Ave Maria' của Gounod dựa trên prelude này. Năm 1853 là năm in, viết 1852–53: chấp nhận được."
- trang: "piano/tac-pham/bach-prelude-do"
  id: "n25"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/f4/14/7f/1690886046/0014-1690886046-sync.pdf"
  ghi_chu: "Lời Schiff trong HN 14: 'The word \"Clavier\" suggests only keyboard, with some pieces intended for the harpsichord, others for the organ or the clavichord.'"
- trang: "piano/tac-pham/bach-prelude-do"
  id: "n27"
  luot_2: "dung"
  nguon:
