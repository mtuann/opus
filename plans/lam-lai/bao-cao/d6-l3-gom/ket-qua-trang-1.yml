  ghi_chu: "Henle: 'both these two-movement works'; lời giới thiệu trích thư Carl: '2 small, easy sonatas, each of which has only two movements'. IMSLP: số 19 và số 20 đều '2 movements'."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n18"
  luot_2: "dung"
  nguon:
