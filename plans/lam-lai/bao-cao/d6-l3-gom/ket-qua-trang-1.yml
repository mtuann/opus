    - "https://web.archive.org/web/20260102121230/https://imslp.org/wiki/Piano_Sonata_No.14,_Op.27_No.2_(Beethoven,_Ludwig_van)"
  ghi_chu: "Henle: 'their relatively high opus number means that they have been erroneously classified as nos. 19 and 20'; tiểu sử trên trang Henle: 'Piano sonatas, Op. 27… including the Moonlight Sonata' ghi 1800–01. IMSLP ghi Op. 27 số 2 in năm 1802 (ô năm sáng tác cũng ghi 1802, Henle ghi 1800–01). Dù 1801 hay 1802, Op. 27 viết sau Op. 49 (1796–98) và in trước 1805, nên ý của câu đúng."
- trang: "piano/tac-pham/beethoven-op49-2"
