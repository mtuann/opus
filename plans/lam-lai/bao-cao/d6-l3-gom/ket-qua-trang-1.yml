  ghi_chu: "Henle xếp 'Piano Sonata G major op. 49,2' mức 'easy'; lời giới thiệu nói 'their simplicity and modest technical demands'. File .ly: nhịp 2/2, hình nhanh nhất là móc đơn chùm ba, chỉ một f ở ô 15, 53."
