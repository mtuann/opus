  ghi_chu: "Trang Henle: 'composed at roughly the same time as the piano sonatas op. 10, between 1796 and 1798'. Lời giới thiệu (Gertsch, Perahia 2018): 'the 2nd Sonata was probably written in 1796, and the 1st Sonata in 1797/98… close proximity to… the three Sonatas op. 10 (1795 – 98)'."
- trang: "piano/tac-pham/beethoven-op49-2"
