  ghi_chu: "So từng ô: tay phải ô 82–86 trùng ô 15–19 (fis'4, tam liên a''-fis''-d'', c''4…), tay trái ô 82–86 trùng ô 15–19 (tam liên d-fis-a / d-g-b); ô 87 khác ô 20 chỉ ở ba nốt làm đà (d' thay a'). Chủ đề 2: ô 21 Rê trưởng, ô 88 Sol trưởng."
