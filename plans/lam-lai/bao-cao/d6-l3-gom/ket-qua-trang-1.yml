  ghi_chu: "Beethoven (1770–1827), rửa tội 17/12/1770 (tiểu sử trên trang Henle); viết 1796–1798, tức khoảng 25–27 tuổi."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://www.henle.de/media/df/c7/fd/1697725885/1327-1697725884-sync.pdf"
  ghi_chu: "Lời giới thiệu Henle: Kaspar Karl 'while sifting through Beethoven's manuscripts between 1802 and around 1806… Starting in November 1802 he offered… to different publishers, first of all to André in Offenbach, then in 1803 to Breitkopf & Härtel… probably in 1804, to the Wiener Kunst- und Industrie-Comptoir'; 'published in January 1805 by the Wiener Kunst- und Industrie-Comptoir'; 'We instead probably owe their publication…' (khớp 'có lẽ')."
- trang: "piano/tac-pham/beethoven-op49-2"
  id: "n21"
  luot_2: "dung"
  nguon:
