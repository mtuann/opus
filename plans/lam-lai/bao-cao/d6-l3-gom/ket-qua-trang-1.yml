  ghi_chu: "Các bản thu prelude trên IMSLP dài 1:55 (Goldstein), 2:13 (Kolodin), 2:43 (Ishizaka, Commons 162,9 giây): khoảng hai đến ba phút; 'khoảng hai phút' chấp nhận được."
- trang: "piano/tac-pham/bach-prelude-do"
