  ghi_chu: "Lời tựa HN 14 dịch trang bìa: 'for the use and benefit of inquisitive young musicians and for the special diversion of those already well-versed in this study'; 'both a manual of instruction and a challenge to accomplished performers'."
- trang: "piano/tac-pham/bach-prelude-do"
