  loai: cau-truc
  nguon:
    - ten: "Mutopia Project 468, Prelude: Op. 28, No. 4 ('Suffocation') (Chopin), Source: Peters, 1879, người nhập Magnus Lewis-Smith, Public Domain; Chop-28-4.ly (\\time 2/2, Largo, \\partial 4, 25 ô, \"espressivo\", stretto ô 16, \\f ô 17, dim. ô 18, smorz. ô 21, fermata ô 23, 25), tải ngày 05/11/2026"
      link: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=468
    - ten: 'The Concise Oxford Dictionary of Music, mục German sixth, qua Encyclopedia.com: "Type of augmented 6th chord"'
