  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "tac-pham.yml (đã khóa): bach-prelude-do, satie-gymnopedie, fur-elise đều chặng 4, như chopin-prelude-mi-thu. Ba trang có ở src/content/docs/piano/tac-pham/. Review D6-L3-gom: Dòng 193: tac-pham.yml bach-prelude-do, satie-gymnopedie, fur-elise chang 4 như chopin-prelude-mi-thu; ba trang có."
- trang: piano/tac-pham/beethoven-op49-2
  id: n18
  cau: Theo lời giới thiệu của ấn bản Henle, Beethoven viết chúng khoảng 1796–1798 (số 2 có lẽ năm 1796), gần cùng thời với ba sonata Op. 10.
  loai: nam
  nguon:
    - ten: "G. Henle Verlag, HN 1327: lời nói đầu (Norbert Gertsch, Murray Perahia, 2018), PDF"
      link: https://www.henle.de/media/df/c7/fd/1697725885/1327-1697725884-sync.pdf
    - ten: "IMSLP, Piano Sonata No.20, Op.49 No.2 (Beethoven): Allegro ma non troppo (G major, 122 bars), Tempo di minuet (G major, 120 bars); 1795–96; in 1805"
      link: https://imslp.org/wiki/Piano_Sonata_No.20,_Op.49_No.2_(Beethoven,_Ludwig_van)
  ket_qua_luot_1: da-sua
  ghi_chu: 'Câu cũ: "viết chúng khoảng 1796–1798, cùng thời với ba sonata Op. 10". Henle: "the 2nd Sonata was probably written in 1796, and the 1st Sonata in 1797/98 ... in close proximity to the three Sonatas op. 2 (1794/95), the Grande Sonate op. 7 (1796/97) and the three Sonatas op. 10 (1795 – 98)". IMSLP ghi số 2: 1795–96. Thêm năm của số 2 vì trang nói về số 2. Review D6-L3-gom: Hai lượt cùng kết luận, nguồn khớp; đồng ý chữ trang.'
- trang: piano/tac-pham/fur-elise
  id: n83
  cau: "Câu hỏi 1: Für Elise là rondo nhỏ A–B–A–C–A; chủ đề Mi–Rê♯ vang lên ba lần, xen giữa là đoạn Fa trưởng (B) và đoạn kịch tính trên nốt La trầm (C)."
  loai: cau-truc
  nguon:
    - ten: Mutopia Project, Für Elise, WoO 59 (Stelios Samelis, nguồn Breitkopf & Härtel 1888; tệp LilyPond và MIDI)
      link: https://www.mutopiaproject.org/ftp/BeethovenLv/WoO59/fur_Elise_WoO59/fur_Elise_WoO59.ly
    - ten: Open Music Theory, Rondo
      link: https://viva.pressbooks.pub/openmusictheory/chapter/rondo/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Như n8: "quay lại ba lần" thành "vang lên ba lần". Review D6-L3-gom: Hai lượt cùng kết luận, nguồn khớp; đồng ý chữ trang.'
