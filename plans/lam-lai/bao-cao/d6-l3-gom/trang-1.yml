- trang: piano/tac-pham/beethoven-op49-2
  id: n101
  cau: 'Học tiếp: chương 2 (Tempo di Menuetto) cùng giọng Sol trưởng, với chủ đề gặp lại trong
    Septet Op. 20.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n102
  cau: 'Sonata Op. 49 số 1 (Sol thứ): hai chương, Andante rồi Rondo: Allegro.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n104
  cau: K. 545 cũng hình thức sonata, với đệm Alberti và chuỗi gam móc kép.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n106
  cau: 'Câu hỏi 1: phần phát triển bắt đầu ở ô 53 bằng hợp âm và chùm ba của mở đầu, ở Rê
    thứ; ô 36 là nhóm kết, ô 67 là tái hiện; phần phát triển (ô 53–66) đi qua Rê thứ, La thứ,
    Mi thứ rồi dừng trên nốt Rê trầm.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n107
  cau: 'Câu hỏi 2: đoạn chuyển ở tái hiện gần như giống hệt đoạn ở trình bày, nhưng dẫn sang
    chủ đề 2 ở Sol trưởng thay vì Rê trưởng; hợp âm Rê cuối đoạn nghe như giọng mới ở trình
    bày và như át âm của Sol ở tái hiện.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n109
  cau: 'Câu hỏi 4: sonata viết khoảng năm 1796 mang số Op. 49 vì chỉ được in năm 1805; theo
    Henle, Carl đã đem chào vài nhà xuất bản không thành; năm 1805 hai sonata mới được in,
    với tên Sonates faciles.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n110
  cau: 'Nguồn: Henle HN 1327 (biên tập Norbert Gertsch, ngón bấm Murray Perahia), lời giới
    thiệu và mức độ khó trên trang ấn bản.'
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n111
  cau: 'Nguồn: Ludwig van Beethovens Werke (Breitkopf & Härtel, 1862–1865), bản dàn trang
    công cộng của Mutopia (người nhập: Stelios Samelis).'
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n112
  cau: 'Mục Nguồn bỏ hai sách in chưa đọc (Beethoven, The 35 Piano Sonatas, ABRSM, biên tập
    Barry Cooper; Charles Rosen, Beethoven''s Piano Sonatas: A Short Companion, 2002).'
  loai: ten
