- trang: piano/tac-pham/bach-prelude-do
  id: n1
  cau: 'Tiêu đề: "Bach: Prelude Đô trưởng, BWV 846".'
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n2
  cau: 'Mô tả và câu mở đầu: bản prelude mở đầu Bình quân luật quyển 1 trông như một bài tập
    hợp âm rải: 35 ô nhịp, mỗi ô một hợp âm, cùng một hình nốt lặp lại gần như từ đầu đến
    cuối.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n5
  cau: Tay trái đánh hai nốt rồi giữ chúng suốt nửa ô trong khi tay phải rải tiếp.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n6
  cau: Giữ nốt bằng ngón là cách tạo độ vang trên những cây đàn phím thời Bach, vốn chưa có
    bàn đạp vang.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n7
  cau: Gần như cả bài là móc kép liên tục trên cùng một hình nốt; một nốt to hơn hay vội hơn
    là lộ ngay.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n8
  cau: 'Hai tay chia một dòng nhạc: tay trái bắt đầu, tay phải nối tiếp.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n9
  cau: Mỗi ô là một hợp âm, không có giai điệu nào che; bài có hợp âm bảy, bảy giảm và âm
    nền.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n11
  cau: Nhớ 35 hợp âm dễ hơn nhớ năm trăm nốt.
  loai: so-lieu
- trang: piano/tac-pham/bach-prelude-do
  id: n13
  cau: Minuet Sol trưởng là bước đệm nhẹ nhàng hơn bài này.
  loai: cap-do
- trang: piano/tac-pham/bach-prelude-do
  id: n14
  cau: Das Wohltemperierte Klavier gồm 24 cặp prelude và fugue, đi lần lượt qua 12 giọng trưởng
    và 12 giọng thứ, từ Đô trưởng lên đến Si thứ.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n15
  cau: '"Wohltemperiert" (lên dây tốt) chỉ một cách lên dây cho phép chơi hay ở mọi giọng,
    điều chưa hiển nhiên vào thời đó.'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n16
  cau: 'Trên trang bìa, Bach ghi rằng tập nhạc dành cho những người trẻ ham học nhạc, và để
    giải trí cho những người đã thạo nghề: vừa là giáo trình, vừa là âm nhạc thật sự.'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n18
  cau: Trong Clavier-Büchlein viết cho Wilhelm Friedemann, khi đó chừng chín, mười tuổi, có
    một phiên bản sớm hơn của bản prelude (BWV 846a).
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n19
  cau: Ở bản chép sạch năm 1722, bài dài 35 ô nhịp như ta biết.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n20
  cau: Prelude (khúc dạo đầu) là bản nhạc đi trước một bản khác, ở đây là fugue.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-do
  id: n21
  cau: Bài dựng trên một chuỗi hợp âm rải theo khuôn cố định, không có giai điệu để dựa vào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n22
  cau: Suốt nhiều thập kỷ, tập nhạc chỉ truyền tay qua bản chép.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n23
  cau: Beethoven thời niên thiếu ở Bonn được thầy Christian Gottlob Neefe cho học tập này.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n24
  cau: Năm 1853, Charles Gounod viết thêm một giai điệu lên trên prelude, về sau thành bài
    Ave Maria nổi tiếng.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n25
  cau: 'Bach viết cho đàn phím nói chung (Klavier): harpsichord, clavichord, organ.'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n27
  cau: Bản nhạc dài khoảng hai phút.
  loai: so-lieu
- trang: piano/tac-pham/bach-prelude-do
  id: n29
  cau: Bè trầm đi xuống từng bậc và dừng trên nốt Sol một lúc lâu ở gần cuối.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n30
  cau: Năm 1853, Gounod viết thêm một giai điệu lên trên prelude này, về sau thành bài Ave
    Maria (câu hỏi 4 khi nghe).
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n31
  cau: Glenn Gould, Sviatoslav Richter và András Schiff đã thu trọn Bình quân luật.
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n32
  cau: Schiff viết rằng có thể chơi trọn Bình quân luật mà không chạm tới bàn đạp vang.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n33
  cau: Harpsichord là âm thanh mà Bach quen thuộc.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n36
  cau: 'Theo dõi khi nghe, ô 1–4: bốn hợp âm Đô – Rê thứ bảy – Sol bảy – Đô, khẳng định Đô
    trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n37
  cau: 'Ô 5–11: đi sang Sol trưởng; bè trầm đi xuống dần; Rê bảy ở ô 6 và ô 10 kéo về Sol;
    kết ở Sol trưởng ô 11.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n38
  cau: 'Ô 12: hợp âm bảy giảm đầu tiên, màu nhạc tối và căng, đoạn quay về bắt đầu; thêm một
    hợp âm bảy giảm ở ô 14.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n39
  cau: 'Ô 19–20: hợp âm Đô trở lại ở ô 19, rồi Đô bảy ở ô 20 kéo sang Fa.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n40
  cau: 'Ô 22–23: hai hợp âm bảy giảm liền nhau; nốt Đô của tay phải treo lại ở ô 23 rồi đi
    xuống Si ở ô 24.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n41
  cau: 'Ô 24–31: âm nền át, nốt Sol trầm giữ suốt tám ô; hợp âm bên trên căng ở ô 27, 28,
    31, giãn ở ô 25, 29.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n42
  cau: 'Ô 32: âm nền chủ, nốt Đô trầm vang lên, bên trên là Đô bảy.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n43
  cau: 'Ô 33–34: hình nốt đổi khác, rải dài lên rồi xuống trên nốt Đô trầm.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n44
  cau: 'Ô 35: hợp âm cuối Đô trưởng, đặt xuống sâu và để vang.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n45
  cau: 'Bảng Cấu trúc, ô 1–4: I – ii7 – V7 – I (Đô, Rê thứ bảy, Sol bảy, Đô).'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n46
  cau: 'Bảng Cấu trúc, ô 5–11: Rê bảy (ô 6, ô 10) là át của Sol; kết ở Sol trưởng ô 11; bè
    trầm đi xuống dần Đô – Si – La – Rê – Sol.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n47
  cau: 'Bảng Cấu trúc, ô 12–23: nhiều hợp âm bảy giảm (ô 12, 14, 22, 23); về lại Đô ở ô 19;
    Đô bảy ở ô 20 kéo sang Fa; đoạn dài nhất.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n48
  cau: 'Bảng Cấu trúc, ô 24–31: nốt Sol trầm giữ suốt tám ô, hợp âm thay đổi bên trên.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n49
  cau: 'Bảng Cấu trúc, ô 32–35: nốt Đô trầm; Đô bảy, Fa, Sol bảy trên nền Đô, rồi hợp âm Đô;
    ở ô 33–34 hình nốt đổi khác.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n50
  cau: 'Năm nốt của ô 1 theo thứ tự Bach rải: hai nốt đầu thuộc tay trái, ba nốt sau thuộc
    tay phải và được nhắc lại (bàn phím tô Đô4 Mi4 Sol4 Đô5 Mi5).'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n51
  cau: Khung hòa âm gom năm nốt mỗi ô thành hợp âm khối (hai nốt dưới tay trái, ba nốt trên
    tay phải); ô 33–34 chỉ ghi hợp âm chính; °7 là hợp âm bảy giảm, "/" chỉ nốt ở bè trầm;
    khung đã đối chiếu từng ô với bản nhạc.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n53
  cau: Ở ô 23, nốt Đô của tay phải được giữ lại từ hợp âm ô 22 rồi đi xuống Si ở ô 24, theo
    kiểu một nốt treo.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n55
  cau: 'Chỗ khó, chuyền tay: một nửa ô là một dòng tám nốt (hai nốt tay trái, sáu nốt tay
    phải).'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n56
  cau: 'Chỗ khó, giữ nốt tay trái: nốt trầm là nốt trắng, nốt thứ hai ngân đến hết nửa ô.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n57
  cau: 'Chỗ khó, móc kép đều: hình ba nốt lặp lại dễ bị "nhóm" theo ba, nốt đầu nhóm to hơn;
    ngón 4 và 5 yếu hơn.'
  loai: quy-tac
- trang: piano/tac-pham/bach-prelude-do
  id: n58
  cau: 'Chỗ khó, đổi thế tay: các hợp âm bảy giảm ở ô 12, 14, 22, 23.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n59
  cau: 'Chỗ khó, âm nền át (ô 24–31): tám ô trên nốt Sol trầm; Sol bảy ở ô 27 và 31, bảy giảm
    ở ô 28; Đô trên nền Sol ở ô 25 và 29.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n60
  cau: 'Chỗ khó, ô 33–34: hình nốt khác hẳn phần còn lại.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n64
  cau: 'Bài tập 1: cùng cách ghi như Bach: tay trái hai bè, nốt trầm nốt trắng, nốt thứ hai
    vào sau một móc kép, ngân đến hết nửa ô; tiến trình I – IV – V7 – I ở Sol trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n67
  cau: Các hình bàn tay khó trong bài, nhất là ô 12, 14, 22 và 23.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n70
  cau: Bach không ghi tốc độ.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n72
  cau: Không bàn đạp, chỉ dùng ngón giữ nốt, đúng như Bach ghi; tiếng đàn gần nhất với harpsichord
    và clavichord.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n73
  cau: Bàn đạp nhẹ, đổi mỗi ô; nhấn nông vì ba nốt tay phải được chơi hai lượt trong mỗi nửa
    ô và tiếng vang tích tụ nhanh.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n76
  cau: Bản nhạc không có dấu sắc thái nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n78
  cau: Ở ô 33–34, trên nốt Đô trầm, nét rải đi lên rồi đi xuống.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n79
  cau: Một số ấn bản thế kỷ 19 chèn thêm một ô nhịp giữa ô 22 và ô 23 ("ô nhịp Schwencke"),
    khiến bài dài 36 ô.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n80
  cau: Ô ấy không có trong bản viết tay của Bach; nên dùng bản Urtext 35 ô.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n81
  cau: Các ấn bản cũ (ví dụ của Czerny) còn thêm sắc thái, dấu luyến và tốc độ của người biên
    tập.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n82
  cau: Bài không có nốt hoa mỹ nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n85
  cau: Invention số 1 có hai bè độc lập thay cho hợp âm rải.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n86
  cau: Prelude và fugue Đô thứ BWV 847 đứng ngay sau bài này trong quyển 1.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-do
  id: n87
  cau: Prelude Đô thứ BWV 847 cũng dựng trên một hình nốt lặp lại, và là một trong số ít bài
    của quyển 1 có chỉ dẫn tốc độ của chính Bach.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n89
  cau: 24 prelude Op. 28 của Chopin cũng đi qua đủ 24 giọng.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n92
  cau: 'Câu hỏi 1: âm nền át ở ô 24–31 là nốt Sol trầm giữ suốt tám ô trong khi hợp âm bên
    trên thay đổi.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n93
  cau: 'Câu hỏi 2: Bach ghi hai nốt tay trái là nốt ngân đến hết nửa ô; giữ bằng ngón tạo
    độ vang; dù dùng bàn đạp hay không vẫn giữ nốt bằng ngón.'
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n94
  cau: 'Câu hỏi 3: "ô nhịp Schwencke" là một ô mà một số ấn bản thế kỷ 19 chèn thêm giữa ô
    22 và ô 23, không có trong bản viết tay của Bach; bản đúng có 35 ô.'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n96
  cau: 'Nguồn: Henle HN 14 (biên tập Ernst-Günter Heinemann, ngón bấm András Schiff), lời
    nói đầu và ghi chú diễn tấu.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n97
  cau: 'Nguồn: bài blog của Norbert Müllemann trên blog Henle, 2012 (ô nhịp Schwencke).'
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n98
  cau: 'Nguồn: Thayer, The Life of Ludwig van Beethoven, tập 1, bản tiếng Anh của Krehbiel,
    1921.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n99
  cau: 'Nguồn: bản nhạc IMSLP; khung hòa âm đối chiếu với bản LilyPond của Mutopia và bản
    Novello do Harold Brooke biên tập.'
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n71
  cau: Cách chọn và giữ tốc độ, nới nhẹ hai ô cuối, móc kép liền tiếng.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-do
  id: n75
  cau: Dù chọn cách nào, vẫn giữ nốt bằng ngón; không giữ bàn đạp qua hai hợp âm.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-do
  id: n26
  cau: Trên piano hiện đại, câu hỏi lớn nhất của bài này là dùng bàn đạp đến đâu; phần Diễn
    tấu bàn kỹ.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-op49-2
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata Sol trưởng Op. 49 số 2, chương 1".'
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n2
  cau: 'Mô tả và câu mở đầu: đây là một chương sonata trọn vẹn mà bản in đầu tiên gọi là "sonata
    dễ".'
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n3
  cau: Chương có 122 ô nhịp, đủ trình bày, phát triển và tái hiện.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n4
  cau: Không chỗ nào đòi sức mạnh hay tốc độ ghê gớm.
  loai: cap-do
- trang: piano/tac-pham/beethoven-op49-2
  id: n5
  cau: Trang hướng dẫn tập chương 1 (Allegro, ma non troppo) để nghe hình thức sonata từ bên
    trong.
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n6
  cau: Ba phần của hình thức sonata (link /opus/hinh-thuc/sonata/) đều ngắn và rõ.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n7
  cau: Đoạn chuyển ở phần tái hiện (ô 82–87) gần như nguyên văn đoạn chuyển ở phần trình bày
    (ô 15–20); lần đầu nó dẫn sang chủ đề 2 ở Rê trưởng, lần sau ở Sol trưởng.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n8
  cau: Ô 1 có chùm ba (ba nốt móc đơn trong một phách đen), ô 3 có nhịp chấm dôi (nốt đen
    chấm dôi rồi nốt móc đơn).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n10
  cau: Các chuỗi gam chùm ba ở nhóm kết (ô 36–43, ô 103–110); tay trái cũng có gam chùm ba
    (ô 44, 47, 111, 114).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n12
  cau: 'Tay trái nhiều vai: một bè trầm có giai điệu riêng (ô 2–4), hình đệm nốt lặp (ô 6–8,
    21–24), hợp âm rải chùm ba (ô 15–19), nốt lặp đều (ô 59–62).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n16
  cau: So với Op. 49 số 2, K. 545 có nhiều đệm Alberti hơn và ít chùm ba hơn.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n17
  cau: Hai sonata Op. 49 đều chỉ có hai chương.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n18
  cau: Theo lời giới thiệu của ấn bản Henle, Beethoven viết chúng khoảng 1796–1798 (số 2 có
    lẽ năm 1796), gần cùng thời với ba sonata Op. 10.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n19
  cau: Khi viết chúng, Beethoven chưa đến ba mươi tuổi.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n20
  cau: 'Việc chúng được in có lẽ là nhờ người em trai Carl, người lục tìm trong các bản thảo
    của anh những bài có thể đem bán: từ cuối năm 1802 Carl đem chào vài nơi không thành,
    đến tháng 1 năm 1805 một nhà xuất bản ở Vienna mới in chúng.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n21
  cau: Bản in đầu tiên gọi chúng là Sonates faciles, "những sonata dễ".
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n22
  cau: Vì in muộn, hai sonata mang số Op. 49, lớn hơn Sonata Ánh trăng Op. 27 (1801), bài
    được viết sau chúng; số Op. ở đây cho biết lúc in, không phải lúc viết.
  loai: danh-muc
- trang: piano/tac-pham/beethoven-op49-2
  id: n23
  cau: Op. 49 số 2 thuộc về Beethoven của những năm 1790.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n24
  cau: Chương 2 (Tempo di Menuetto) có chủ đề mà Beethoven dùng lại trong chương minuet của
    bản Septet Op. 20 (1799), một tác phẩm rất được ưa chuộng thời ông.
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n25
  cau: 'Đàn piano Vienna cuối thế kỷ 18 có âm vực khoảng năm quãng tám (kiểu đàn của Anton
    Walter: Fa1–Sol6).'
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n26
  cau: Cả chương này nằm gọn trong khoảng Sol1–Mi6.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n30
  cau: Cử chỉ mở đầu (hợp âm Sol trưởng, rồi chùm ba đi lên và đi xuống) còn xuất hiện ở ô
    5, đầu phần phát triển ở giọng thứ, đầu phần tái hiện.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n31
  cau: Ba nốt lặp báo hiệu chủ đề 2.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n33
  cau: Mọi bản thu trọn 32 sonata của Beethoven đều có bài này.
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n35
  cau: Ronald Brautigam thu trọn các sonata của Beethoven trên fortepiano.
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n37
  cau: Pathétique là một sonata lớn hơn của Beethoven cùng thời kỳ.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n39
  cau: 'Theo dõi khi nghe, chủ đề 1 (ô 1–8): hợp âm Sol trưởng, chùm ba đi lên rồi xuống,
    giai điệu nhịp chấm dôi kết bằng láy rền; từ ô 5 cả câu nhắc lại cao hơn một quãng tám,
    tay trái chuyển sang hình đệm nốt lặp.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n40
  cau: 'Tiếp nối (ô 9–14): những cặp nốt luyến đi lên nửa cung (Rê♯–Mi, Đô♯–Rê) ngăn bởi dấu
    lặng ngắn; láy quanh ở ô 12; tay trái rất thưa.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n41
  cau: 'Đoạn chuyển (ô 15–20), f: tay phải nhảy giữa nốt đen ở âm vực giữa và chùm ba từ trên
    cao đổ xuống; tay trái rải hợp âm chùm ba trên nốt Rê trầm.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n42
  cau: 'Chủ đề 2 (nhịp lấy đà ở ô 20, ô 21–35): Rê trưởng; ba nốt La lặp làm đà, giai điệu
    luyến mềm trên hình đệm nốt lặp; staccato nhẹ trên những nốt Mi lặp (ô 25–26).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n43
  cau: 'Nhóm kết (ô 36–52): gam chùm ba mười hai nốt đi xuống rồi đi lên, xen những ô nốt
    đen lặp; quãng ba ngân dài trong lúc tay trái chạy gam; các hợp âm kết ở Rê trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n44
  cau: Trình bày nhắc lại (ô 1–52).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n45
  cau: 'Phát triển (ô 53–66): cử chỉ mở đầu trở lại ở Rê thứ, f; rồi La thứ, Mi thứ trên nốt
    Si lặp của tay trái; hai tay cùng đi xuống, dẫn về.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n46
  cau: 'Tái hiện (ô 67–81): chủ đề 1 ở Sol trưởng; từ ô 74 rẽ sang đường mới, gam chùm ba
    đi qua Đô trưởng và La thứ.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n47
  cau: 'Đoạn chuyển và chủ đề 2 (ô 82–102): đoạn chuyển gần như nguyên văn lần đầu, nhưng
    chủ đề 2 giờ ở Sol trưởng, với ba nốt Rê làm đà (ô 87).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n48
  cau: 'Nhóm kết (ô 103–122): gam chùm ba ở Sol trưởng, quãng ba ngân, các hợp âm kết; ô cuối:
    hợp âm, rồi dấu lặng có dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n49
  cau: Số ô nhịp trên trang theo bản Breitkopf & Härtel (qua Mutopia).
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n50
  cau: 'Bảng Cấu trúc, chủ đề 1 (ô 1–8, Sol trưởng): hợp âm và chùm ba, giai điệu nhịp chấm
    dôi, láy rền ở ô 4; ô 5–8 nhắc lại cao hơn một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n51
  cau: 'Bảng Cấu trúc, tiếp nối (ô 9–14, Sol trưởng): cặp nốt luyến nửa cung và dấu lặng;
    láy quanh ở ô 12; dừng trên hợp âm La trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n52
  cau: 'Bảng Cấu trúc, đoạn chuyển (ô 15–20, Sol → Rê): f; tay phải nốt đen và chùm ba, tay
    trái hợp âm rải chùm ba trên nốt Rê; dừng trên hợp âm Rê.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n53
  cau: 'Bảng Cấu trúc, chủ đề 2 (ô 20 nhịp lấy đà – 35, Rê trưởng): ba nốt La làm đà; giai
    điệu luyến trên hình đệm nốt lặp; nói hai lần (ô 21–28, 29–35).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n54
  cau: 'Bảng Cấu trúc, nhóm kết (ô 36–52, Rê trưởng): gam chùm ba xen nốt đen lặp (36–43);
    quãng ba ngân trên gam chùm ba của tay trái (44–48); hợp âm kết (49–52); cả phần trình
    bày nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n55
  cau: 'Bảng Cấu trúc, phát triển (ô 53–66): cử chỉ mở đầu ở Rê thứ (ô 53) và La thứ (ô 56);
    Mi thứ, rồi nốt Si lặp ở tay trái (ô 59–62); hai tay đi xuống, dừng trên nốt Rê trầm (ô
    63–66).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n56
  cau: 'Bảng Cấu trúc, tái hiện chủ đề 1 (ô 67–81, Sol trưởng): ô 67–73 gần như ô 1–7; từ
    ô 74 đi đường mới: gam chùm ba qua Đô trưởng (75–78) và La thứ (79–81).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n57
  cau: 'Bảng Cấu trúc, đoạn chuyển (ô 82–87, Sol trưởng): gần như nguyên văn ô 15–20.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n58
  cau: 'Bảng Cấu trúc, chủ đề 2 (ô 87 nhịp lấy đà – 102): ba nốt Rê làm đà; chủ đề 2 ở giọng
    chủ.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n59
  cau: 'Bảng Cấu trúc, nhóm kết (ô 103–122): như ô 36–52, ở Sol trưởng; hợp âm cuối ở ô 122,
    tiếp theo là dấu lặng có dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n60
  cau: 'Hợp âm Rê cuối đoạn chuyển: ở ô 20 tai nghe nó như một giọng mới (Rê trưởng); ở ô
    87, cũng hợp âm ấy, lại nghe như át âm kéo về Sol; vì vậy phần tái hiện "giải quyết" phần
    trình bày.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n62
  cau: 'Tám ô đầu: nốt nhạc, dấu luyến, láy rền và chữ p theo bản Breitkopf & Härtel (Ludwig
    van Beethovens Werke, 1862–1865) qua Mutopia; số ngón là gợi ý của trang; bản ấy không
    ghi sắc thái ở ô 1; từ ô 6 tay trái đọc ở khóa Sol.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n63
  cau: 'Ở ô 2–4, tay trái là một bè trầm có giai điệu riêng: Si – La – Sol – Fa♯ – Rê – Sol
    – Fa♮ – Mi – Fa♯ – Sol; nốt Fa♮ ở ô 3 đi xuống nửa cung tới Mi ở ô 4.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n64
  cau: Ở ô 6–8, ngón cái tay trái lặp nốt Rê ở trên trong khi bè dưới đi xuống; quãng giữa
    hai nốt mở dần từ quãng ba đến quãng tám (Rê–Rê ở ô 7).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n65
  cau: Láy rền ở ô 4 và ô 8 kết bằng hai nốt nhỏ Si–Đô đã in sẵn.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n66
  cau: 'Chỗ khó, hợp âm rồi chùm ba (ô 1, 5, 53, 56, 67, 71): tay rời hợp âm để rải hơn một
    quãng tám (ô 1: Rê–Sol–Si–Rê rồi Đô–La); hai phách trắng: hợp âm là phách 1, hai chùm
    ba là phách 2.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n67
  cau: Chỗ khó, nhịp chấm dôi cạnh chùm ba (ô 3, 7, 69).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n68
  cau: 'Chỗ khó, láy rền có nốt kết (ô 4, 8, 70): chỉ có một nốt đen ở tốc độ nhanh; nốt trên
    của láy (Rê) vừa vang ngay trước.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n69
  cau: Có thể bắt đầu láy từ chính nốt Đô, vì nốt Rê vừa vang đã làm nốt trên; nếu bắt đầu
    từ nốt trên, đừng nhấn nốt Rê ấy lần nữa.
  loai: quy-tac
- trang: piano/tac-pham/beethoven-op49-2
  id: n70
  cau: 'Chỗ khó, cặp nốt luyến và láy quanh (ô 9–14): mỗi cặp nặng – nhẹ rồi nhấc tay đúng
    dấu lặng; láy quanh sau nốt Sol chấm dôi (ô 12).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n71
  cau: 'Láy quanh sau nốt Sol: bốn nốt La–Sol–Fa♯–Sol trong phần chấm dôi.'
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n72
  cau: 'Chỗ khó, đoạn chuyển (ô 15–19): tay phải nhảy giữa nốt đen ở âm vực giữa và chùm ba
    từ trên cao (Fa♯4 lên La5, một quãng mười).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n73
  cau: 'Chỗ khó, gam chùm ba (ô 36–43, 103–110; tay trái ô 44, 47, 111, 114): nhóm ngón (3
    và 4 ngón) không trùng nhóm nốt (3 nốt), ngón cái rơi giữa nhóm.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n74
  cau: 'Chỗ khó, hình đệm nốt lặp ở tay trái (ô 6–8, 21–24, 29–32): ngón cái lặp một nốt suốt
    nhiều phách; bè dưới mới là đường đi của hòa âm.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n75
  cau: 'Chỗ khó, nốt lặp ở tay trái (ô 59–62): tám móc đơn trên nốt Si mỗi ô, dễ to dần và
    mỏi cổ tay.'
  loai: quy-tac
- trang: piano/tac-pham/beethoven-op49-2
  id: n76
  cau: 'Chỗ khó, tái hiện rẽ hướng (ô 73–81): các nốt Fa♮ ở ô 74–78 dễ thành Fa♯.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n83
  cau: 'Tập thêm ở Rê trưởng và Đô trưởng: các chuỗi gam chùm ba ở ô 36–43 đi ở Rê trưởng,
    ở ô 75–78 đi qua Đô trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n85
  cau: Tốc độ tính theo phách đen; khi đã nhanh, cảm hai phách trắng mỗi ô (alla breve).
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n87
  cau: 'Allegro, ma non troppo: nhanh, nhưng không quá.'
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n88
  cau: Nhịp 2/2 nghĩa là hai phách trắng mỗi ô.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n90
  cau: Bản Breitkopf mà trang dùng ghi rất ít sắc thái (chẳng hạn p ở ô 6, f ở ô 15 và ô 53).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n92
  cau: 'Phát âm: nốt đen không có dấu luyến (giai điệu ô 2–4, đoạn chuyển); cặp nốt luyến
    (ô 9–14, chủ đề 2); ba nốt La làm đà ở ô 20 dẫn vào nốt Rê đầu dấu luyến; staccato trên
    các nốt Mi lặp (ô 25–26) và các quãng ba đi xuống (ô 45, 48).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n95
  cau: Láy rền ở ô 4, 8, 70 (trên nốt Đô, có hai nốt kết in nhỏ) và ô 109 (trên nốt La).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n96
  cau: Láy quanh ở ô 12, sau nốt Sol, trong phần chấm dôi.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n97
  cau: Nốt nhỏ trước các gam chùm ba ở ô 36, 40, 75, 103, 107.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n98
