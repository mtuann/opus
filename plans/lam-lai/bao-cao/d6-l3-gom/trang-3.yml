- trang: piano/tac-pham/fur-elise
  id: n1
  cau: 'Tiêu đề: "Beethoven: Für Elise, WoO 59".'
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n2
  cau: 'Mô tả và câu mở đầu: Für Elise là một trong những tác phẩm nổi tiếng nhất của Beethoven,
    nhưng bài không dừng ở tám ô nhịp đầu.'
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n3
  cau: 'Học trọn bài, bạn gặp ba nhân vật rất khác nhau: chủ đề La thứ trôi như nước, đoạn
    Fa trưởng duyên dáng với những đường chạy nhanh, đoạn kịch tính trên nốt La trầm gõ liên
    tục.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n4
  cau: Ở chủ đề, dòng móc kép đi từ tay trái sang tay phải.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n7
  cau: Ba tính cách trong ba phút.
  loai: so-lieu
- trang: piano/tac-pham/fur-elise
  id: n8
  cau: 'Rondo thu nhỏ: chủ đề vang lên ba lần, xen giữa là hai đoạn tương phản.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n10
  cau: 'Đi hết bài: tám ô đầu chỉ là một phần nhỏ của bài.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n11
  cau: Năm 1810 Beethoven 39 tuổi.
  loai: nam
- trang: piano/tac-pham/fur-elise
  id: n12
  cau: Năm 1810 cùng thời với nhạc cho vở kịch Egmont.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n13
  cau: Năm 1810 thính giác của Beethoven đã suy giảm nhiều.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n14
  cau: Câu "ở giữa những năm sáng tác dồi dào nhất".
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n15
  cau: Bên cạnh sonata và giao hưởng, Beethoven viết nhiều tiểu phẩm ngắn để tặng, mà ông
    gọi là bagatelle; Für Elise là một bài như thế.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n16
  cau: 'Nghĩa của chữ bagatelle: "chuyện vặt".'
  loai: dinh-nghia
- trang: piano/tac-pham/fur-elise
  id: n18
  cau: Beethoven không xuất bản Für Elise lúc sinh thời.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n19
  cau: Bài chỉ đến với công chúng năm 1867, khi Ludwig Nohl in lại từ một bản viết tay mà
    ông được xem; bản ấy về sau thất lạc.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n20
  cau: Các ấn bản ngày nay chủ yếu dựa vào bản in của Nohl, cùng những trang phác thảo còn
    lại của Beethoven.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n21
  cau: Elise là ai? Không ai biết chắc; chưa giả thuyết nào được chứng minh.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n22
  cau: 'Giả thuyết Therese Malfatti: học trò mà Beethoven được cho là muốn cầu hôn khoảng
    năm 1810.'
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n23
  cau: Theo giả thuyết này, Nohl đã đọc nhầm chữ "Therese" trong nét chữ khó đọc của Beethoven
    thành "Elise".
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n24
  cau: 'Giả thuyết Elisabeth Röckel, về sau là vợ nhà soạn nhạc Johann Nepomuk Hummel: giả
    thuyết của Klaus Martin Kopitz, đã bị Michael Lorenz phản bác.'
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n25
  cau: 'Giả thuyết Elise (Lisette) Barensfeld, có thể là học trò piano của Therese Malfatti
    năm 1810: giả thuyết của Rita Steblin.'
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n26
  cau: Bản nhạc là một món quà nhỏ, thân mật, không phải một tác phẩm hòa nhạc đồ sộ.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n29
  cau: Đoạn chuyển về chủ đề lần cuối là hợp âm rải đi lên, rồi chuỗi nửa cung đi xuống.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n30
  cau: Poco moto nghĩa là "hơi chuyển động"; chủ đề không cần chậm và mơ màng.
  loai: dinh-nghia
- trang: piano/tac-pham/fur-elise
  id: n31
  cau: Fortepiano là loại đàn piano thời Beethoven; nghe để biết tiếng đàn và bàn đạp khác
    piano hiện đại thế nào.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n33
  cau: 'Theo dõi khi nghe, đoạn A câu a: chủ đề Mi–Rê♯ ở pp; hợp âm rải chuyền giữa hai tay
    như một dòng nhạc; câu kết ở nốt La.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n34
  cau: Câu a nhắc lại.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n35
  cau: 'Câu b và câu a: câu b ngắn ở Đô trưởng, rồi một chuỗi Mi–Rê♯ kéo về câu a.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n36
  cau: 'Câu b và câu a nhắc lại: đoạn A khép lại ở La thứ.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n37
  cau: 'Đoạn B (Fa trưởng): giai điệu có nốt láy, nhịp chấm dôi trên hợp âm rải tay trái;
    sáng và ấm hơn.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n38
  cau: 'Đường chạy móc ba: hai đường chạy trên hòa âm Đô, rồi chuỗi Mi–Rê♯ dẫn về chủ đề.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n39
  cau: 'Đoạn A trở lại: chủ đề, lần này không nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n40
  cau: 'Đoạn C: tay trái gõ nốt La trầm liên tục, tay phải đánh hợp âm; bè trầm bò lên từng
    nửa cung La – Si♭ – Si – Đô.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n41
  cau: 'Đoạn chuyển: hợp âm rải La thứ đi lên qua ba quãng tám (pp), rồi một chuỗi nửa cung
    đi xuống.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n42
  cau: 'Đoạn A lần cuối: chủ đề, kết thật nhẹ ở La.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n43
  cau: 'Bảng Cấu trúc, A: La thứ (câu giữa sang Đô trưởng); chủ đề Mi–Rê♯ trên hợp âm rải
    chuyền giữa hai tay; câu a nhắc lại; câu b ngắn ở Đô trưởng, chuỗi Mi–Rê♯ kéo về câu a;
    cặp b + a cũng nhắc lại; bắt đầu pp, mỗi câu kết ở nốt La.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n44
  cau: 'Bảng Cấu trúc, B: Fa trưởng; giai điệu có nốt láy, nhịp chấm dôi trên hợp âm rải tay
    trái; hai đường chạy móc ba trên hòa âm Đô (át của Fa); chuỗi Mi–Rê♯ dẫn về A.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n45
  cau: 'Bảng Cấu trúc, A trở lại: La thứ, không nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n46
  cau: 'Bảng Cấu trúc, C: quanh Rê thứ và La thứ; tay trái gõ La trầm liên tục bằng móc kép,
    tay phải hợp âm; bè trầm bò lên La – Si♭ – Si – Đô.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n47
  cau: 'Bảng Cấu trúc, chuyển: La thứ; hợp âm rải La thứ đi lên qua ba quãng tám thành chùm
    ba móc kép, rồi chuỗi nửa cung đi xuống; bắt đầu pp.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n48
  cau: 'Bảng Cấu trúc, A lần cuối: La thứ, kết ở La.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n50
  cau: 'Khối 1: nhịp lấy đà và tám ô đầu, ô 8 theo lần chơi thứ nhất; đối chiếu với bản Breitkopf
    & Härtel năm 1888.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n51
  cau: 'Ô 2: tay phải đánh La cùng lúc với La trầm của tay trái, tay trái rải La–Mi–La, rồi
    tay phải đi tiếp Đô–Mi–La; sáu móc kép ấy là một dòng nhạc chia cho hai tay.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n52
  cau: 'Chỗ khó, cặp Mi–Rê♯: hai ngón kề nhau lặp lại nhanh, ở sắc thái nhỏ.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n53
  cau: 'Chỗ khó, hợp âm rải tay trái: khoảng cách một quãng tám (La2–Mi3–La3).'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n54
  cau: 'Chỗ khó, đường chạy móc ba ở đoạn B: một dòng nốt đi lên xen kẽ với nốt Sol cao lặp
    lại.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n55
  cau: 'Chỗ khó, nốt La lặp lại ở đoạn C: nhiều ô móc kép trên cùng một phím, dễ mỏi, căng,
    to dần ngoài ý muốn; động tác nhỏ từ cổ tay, đổi ngón 3–2–1 hay giữ một ngón.'
  loai: quy-tac
- trang: piano/tac-pham/fur-elise
  id: n56
  cau: 'Chỗ khó, hợp âm tay phải ở đoạn C: ba, bốn nốt phải vào cùng lúc.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n57
  cau: 'Chỗ khó, hợp âm rải đi lên và chuỗi nửa cung: đổi thế tay mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n58
  cau: Chuỗi nửa cung dùng ngón 3 cho phím đen, ngón 1 cho phím trắng (1–2 ở chỗ hai phím
    trắng liền nhau).
  loai: quy-tac
- trang: piano/tac-pham/fur-elise
  id: n59
  cau: 'Chỗ khó, bàn đạp: giữ qua ô Mi–Rê♯ thì hai hòa âm nhòe vào nhau.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n64
  cau: 'Bài tập 2 luyện kiểu bàn tay của đường chạy ở đoạn B: ngón 5 nhắc lại một nốt cao,
    các ngón còn lại đi lên đi xuống bên dưới.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n68
  cau: 'Bản nhạc ghi rất ít chỉ dẫn sắc thái: bản Breitkopf & Härtel 1888 chỉ có pp ở đầu
    bài và ở hợp âm rải đi lên.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n70
  cau: Bản Breitkopf & Härtel 1888 ghi bàn đạp cho từng ô có hợp âm rải tay trái ở chủ đề,
    nhả trước ô Mi–Rê♯.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n72
  cau: Ở đoạn B có hai nốt láy nhỏ trước nốt Đô đầu tiên, một nốt appoggiatura và những chùm
    móc ba nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n74
  cau: Vì bản viết tay đã mất, các ấn bản có thể khác nhau ở vài chi tiết như dấu luyến.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n77
  cau: 'Lỗi thường gặp, đoạn C: tay trái cứng và to dần, mỏi trước khi hết đoạn.'
  loai: quy-tac
- trang: piano/tac-pham/fur-elise
  id: n80
  cau: Op. 33 và Op. 119 là các tập bagatelle của Beethoven.
  loai: danh-muc
- trang: piano/tac-pham/fur-elise
  id: n83
  cau: 'Câu hỏi 1: Für Elise là rondo nhỏ A–B–A–C–A; chủ đề Mi–Rê♯ vang lên ba lần, xen giữa
    là đoạn Fa trưởng (B) và đoạn kịch tính trên nốt La trầm (C).'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n84
  cau: 'Câu hỏi 2: Poco moto nghĩa là hơi chuyển động.'
  loai: dinh-nghia
- trang: piano/tac-pham/fur-elise
  id: n85
  cau: 'Câu hỏi 3: ở chủ đề, nhấn bàn đạp sau nốt trầm của mỗi ô hợp âm rải, nhả hẳn trước
    ô Mi–Rê♯.'
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n87
  cau: 'Nguồn: Henle HN 1347 (biên tập Joanna Cobb Biermann), lời nói đầu và bình chú.'
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n88
  cau: 'Nguồn: Ludwig van Beethoven. Thematisch-bibliographisches Werkverzeichnis, Henle 2014
    (danh mục, nơi đặt ký hiệu WoO), mục WoO 59.'
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n89
  cau: 'Nguồn: Beethoven-Haus Bonn, trang tác phẩm WoO 59 và tờ phác thảo BH 116.'
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n90
  cau: 'Nguồn: bản nhạc IMSLP; đoạn trích đối chiếu với bản Breitkopf & Härtel 1888 qua bản
    chép LilyPond của Mutopia; link tài liệu tham khảo.'
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n76
  cau: Lỗi thường gặp (tám dòng).
  loai: khuyen-tap
- trang: piano/tac-pham/fur-elise
  id: n65
  cau: Kế hoạch 6 tuần, tốc độ ghi theo nốt móc đơn.
  loai: khuyen-tap
- trang: piano/tac-pham/fur-elise
  id: n69
  cau: Gợi ý sắc thái cho A, B, C và đoạn chuyển.
  loai: khuyen-tap
- trang: piano/tac-pham/grieg-arietta
  id: n1
  cau: Arietta (Aria nhỏ) mở đầu cho cả 66 Lyric Pieces của Grieg (câu mở đầu và mô tả trang).
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n2
  cau: Arietta dài 23 ô nhịp, khoảng một phút rưỡi.
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n4
  cau: Giai điệu nằm ở bè trên; ngay bên dưới, cũng trong tay phải, là dòng móc kép của bè
    trong.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n7
  cau: Hòa âm đổi trên những nốt trầm ngân dài.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n9
  cau: Chỉ một chủ đề, nói hai lần, khép lại bằng một ô.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n11
  cau: Đây là bài đầu tiên trong 66 bài, và giai điệu của nó còn trở lại ở bài cuối cùng,
    34 năm sau.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n13
  cau: Edvard Grieg sinh ở Bergen, Na Uy.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n14
  cau: Grieg học ở Nhạc viện Leipzig (1858–1862), ngôi trường do Mendelssohn sáng lập.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n15
  cau: 'Ở Leipzig, truyền thống tiểu phẩm piano Đức đang rất sống: Lieder ohne Worte của Mendelssohn,
    các tập nhạc nhỏ của Schumann.'
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n16
  cau: Grieg mang truyền thống ấy về phương Bắc và pha vào đó giai điệu, nhịp điệu của âm
    nhạc dân gian Na Uy.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n18
  cau: Tập Op. 12 được viết khoảng 1866–1867 và in năm 1867.
  loai: nam
- trang: piano/tac-pham/grieg-arietta
  id: n19
  cau: 'Tám bài trong tập: Arietta, Vals, Vægtersang (Bài ca người gác đêm, gợi hứng từ Macbeth),
    Alfedans (Điệu múa yêu tinh), Folkevise (Dân ca), Norsk (Điệu Na Uy), Albumblad (Trang
    album), Fædrelandssang (Bài ca quê hương).'
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n20
  cau: Chỉ một năm sau, năm 1868, Grieg viết Concerto cho piano La thứ.
  loai: nam
- trang: piano/tac-pham/grieg-arietta
  id: n22
  cau: Trong 34 năm tiếp theo, ông viết thêm chín tập; cả bộ gồm 66 bài trong mười tập, gọi
    chung là Lyriske stykker.
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n23
  cau: Giai điệu của Arietta là một trong những giai điệu Grieg yêu thích nhất.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n24
  cau: Ở bài cuối cùng của tập cuối, Op. 71 số 7 Efterklang (Dư âm; tên tiếng Anh Remembrances),
    viết và in năm 1901, ông cho giai điệu Arietta trở lại, lần này thành một điệu valse.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n25
  cau: 'Arietta là tiếng Ý, nghĩa là "aria nhỏ": một bài hát ngắn.'
  loai: dinh-nghia
- trang: piano/tac-pham/grieg-arietta
  id: n28
  cau: Trong chủ đề có bốn nốt giai điệu lặp lại cùng một cao độ.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n29
  cau: 'Ở ô 9–12, cùng một hình kết vang hai lần: lần đầu ở Sol thứ và rẽ hướng (kết lừa),
    lần sau về Mi♭ trưởng trọn vẹn (kết trọn).'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n30
  cau: 'So sánh ít nhất hai bản thu: Emil Gilels, người mở đầu tuyển tập Lyric Pieces của
    mình (Deutsche Grammophon) bằng Arietta, và Einar Steen-Nøkleberg, nghệ sĩ Na Uy đã thu
    trọn các tác phẩm piano của Grieg.'
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n33
  cau: 'Theo dõi, chủ đề a (ô 1–4): giai điệu hát trên dòng móc kép; bốn nốt lặp cùng cao
    độ; nốt trầm ngân dài.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n34
  cau: 'Theo dõi, phát triển b (ô 5–8): chủ đề đi tiếp, câu nhạc chưa dừng.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n35
  cau: 'Theo dõi, hình kết lần 1 (ô 9–10): Sol thứ, kết lừa.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n36
  cau: 'Theo dõi, hình kết lần 2 (ô 11–12): cùng hình ấy, về Mi♭ trưởng, kết trọn; đoạn A
    khép lại.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n37
  cau: 'Theo dõi, chủ đề trở lại a (ô 13–16): giai điệu có thêm nốt hoa mỹ nhỏ; nốt chủ ở
    bè trầm xuống thấp hơn một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n38
  cau: 'Theo dõi, b'' (ô 17–18): lần này chỉ hai ô.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n39
  cau: 'Theo dõi, nhóm kết c'' (ô 19–22): hình kết quen thuộc trở lại lần cuối.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n40
  cau: 'Theo dõi, coda (ô 23): một mảnh của chủ đề; bài tắt như chìm vào giấc ngủ.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n41
  cau: 'Theo phân tích của PTNA, Arietta là một hình thức một phần mở rộng, xây trên đúng
    một chủ đề: A (12 ô), A'' có biến đổi (10 ô), một ô coda; mỗi lần nói gồm chủ đề (a),
    phát triển (b), nhóm kết (c).'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n42
  cau: 'Bảng, A · a (ô 1–4): chủ đề ở Mi♭ trưởng, bốn nốt lặp cùng cao độ, nốt trầm ngân dài;
    hai nốt dựa cùng lúc rơi vào một hợp âm át chín thiếu nốt gốc.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n43
  cau: 'Bảng, A · b (ô 5–8): phát triển chủ đề.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n44
  cau: 'Bảng, A · c (ô 9–12): ô 9–10 Sol thứ, kết lừa; ô 11–12 Mi♭ trưởng, kết trọn.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n45
  cau: 'Bảng, A'' · a (ô 13–16): chủ đề trở lại, thêm nốt hoa mỹ; nốt chủ ở bè trầm thấp hơn
    một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n46
  cau: 'Bảng, A'' · b'' (ô 17–18): phát triển rút gọn còn hai ô.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n47
  cau: 'Bảng, A'' · c'' (ô 19–22): nhóm kết trở lại.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n48
  cau: 'Bảng, coda (ô 23): một mảnh của chủ đề; bài khép lại đột ngột, như chìm vào giấc ngủ.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n50
  cau: Chủ đề nói hai lần; hình kết của ô 9–10 xuất hiện tất cả bốn lần.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n53
  cau: 'Bàn đạp nối: đánh hòa âm mới, rồi mới nhả và nhấn lại ngay.'
  loai: quy-tac
- trang: piano/tac-pham/grieg-arietta
  id: n60
  cau: 'Bài tập 3: ô 1–2 sau hợp âm Rê bảy (át của Sol thứ), tai chờ Sol thứ nhưng nhận được
    Mi♭ trưởng: kết lừa; ô 3–4 La♭ trưởng, Si♭ bảy, rồi Mi♭ trưởng: kết trọn.'
  loai: dinh-nghia
- trang: piano/tac-pham/grieg-arietta
  id: n64
  cau: PTNA ước tính cả bài dài khoảng một phút rưỡi.
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n66
  cau: 'Poco andante e sostenuto: "hơi andante", và "ngân giữ".'
  loai: dinh-nghia
- trang: piano/tac-pham/grieg-arietta
  id: n67
  cau: 'Theo gợi ý của PTNA: chọn tốc độ sao cho nốt trầm nối qua hai ô vẫn còn nghe được,
    và bốn nốt lặp vẫn có chỗ để tạo hình.'
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n70
  cau: 'Nếu ngón tay trái còn giữ phím, nốt ấy vẫn ngân dù bàn đạp đổi; nửa bàn đạp: nhả nông
    và nhanh, dây trầm rung mạnh hơn nên một phần tiếng trầm còn lại.'
  loai: quy-tac
- trang: piano/tac-pham/grieg-arietta
  id: n73
  cau: PTNA mô tả kết của bài là đột ngột, như chìm vào giấc ngủ, và khuyên chơi ô cuối như
    thể âm thanh thật sự biến mất.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n75
  cau: 'Ấn bản: dùng một bản in đáng tin, ví dụ bản Urtext của Henle; các bản in cũ trên IMSLP
    hữu ích để đối chiếu.'
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n78
  cau: 'Học tiếp, cùng tập Op. 12: Vals (số 2) và Alfedans (Điệu múa yêu tinh, số 4); về sau
    Efterklang Op. 71 số 7.'
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n80
  cau: 'Học tiếp: Schumann Träumerei (khoảng Grade 6): giai điệu, bè trong và bè trầm đan
    vào nhau trong cả hai tay.'
  loai: cap-do
- trang: piano/tac-pham/grieg-arietta
  id: n82
  cau: 'Câu hỏi 1: giai điệu Arietta trở lại ở bài cuối cùng, Op. 71 số 7 Efterklang, dưới
    dạng một điệu valse; Grieg dùng lại giai điệu này để khép lại cả bộ năm 1901, 34 năm sau
    tập đầu tiên.'
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n83
  cau: 'Câu hỏi 2: từ ô 13 chủ đề trở lại (đoạn A''), thêm nốt hoa mỹ, nốt chủ ở bè trầm thấp
    hơn một quãng tám; A (ô 1–12), A'' (ô 13–22), một ô coda.'
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n85
  cau: 'Câu hỏi 4: giữ phím nốt trầm bằng ngón tay trái khi đổi bàn đạp, hoặc dùng nửa bàn
    đạp; khi ngón còn giữ phím, dây của nốt ấy vẫn rung.'
  loai: quy-tac
- trang: piano/tac-pham/grieg-arietta
  id: n86
  cau: 'Nguồn: PTNA Piano Music Encyclopedia, mục Arietta Op. 12-1: hình thức, hòa âm ô 9–12,
    tốc độ, đoạn trở lại, ô cuối.'
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n87
  cau: 'Nguồn: IMSLP (Op. 12, Op. 71) và Britannica (Edvard Grieg).'
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n88
  cau: 'Nguồn: Joseph Banowetz, The Pianist''s Guide to Pedaling, Indiana University Press,
    1985: bàn đạp nối và nửa bàn đạp.'
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n84
  cau: 'Câu hỏi 3: chơi riêng giai điệu, thêm móc kép bấm câm, rồi cho móc kép kêu khẽ; dồn
    trọng lượng về ngón út.'
  loai: khuyen-tap
- trang: piano/tac-pham/grieg-arietta
  id: n71
  cau: Một lần không bàn đạp; làm theo dấu bàn đạp trong bản nhạc và để tai quyết định.
  loai: khuyen-tap
- trang: piano/tac-pham/grieg-arietta
  id: n68
  cau: Chậm quá thì nốt trầm tắt và câu nhạc đứt; nhanh quá thì dòng móc kép thành bài tập
    ngón.
  loai: khuyen-tap
- trang: piano/tac-pham/satie-gymnopedie
  id: n1
  cau: 'Ít nốt, chậm, lặp lại: Gymnopédie số 1 trông như một bài dễ, đọc hết nốt được trong
    một buổi (câu mở đầu và mô tả trang).'
  loai: cap-do
- trang: piano/tac-pham/satie-gymnopedie
  id: n2
  cau: Bài kéo dài mấy phút liền.
  loai: so-lieu
- trang: piano/tac-pham/satie-gymnopedie
  id: n5
  cau: Tay trái đánh một nốt trầm rồi nhảy lên một hợp âm, gần như ô nào cũng vậy.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n7
  cau: Cả bài gần như ở p và pp.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n9
  cau: 'Hợp âm bảy trưởng, màu điệu thức, sự lặp lại không phát triển: những hợp âm còn mới
    lạ năm 1888 cho thấy Satie là người đi tiên phong về hòa âm.'
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n11
  cau: 'Dễ học thuộc, dễ biểu diễn: lượt hai gần như lặp lại lượt một.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n12
  cau: Năm 1888, Satie hơn hai mươi tuổi, vừa rời nhà cha mẹ và sống ở khu Montmartre của
    Paris, giữa giới nghệ sĩ và các quán cabaret.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n13
  cau: 'Âm nhạc châu Âu lúc ấy đang say mê sự đồ sộ của Wagner: dàn nhạc khổng lồ, hòa âm
    đặc, cảm xúc dâng trào.'
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n14
  cau: 'Gymnopédies được viết thật giản dị: vài lớp nhạc mỏng, một giai điệu đơn giản, không
    cao trào, không phát triển.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n15
  cau: Tên gọi gợi đến gymnopaedia, một lễ hội ở Sparta thời cổ Hy Lạp có những điệu múa của
    các chàng trai trẻ.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n16
  cau: Những lời Satie tự giải thích về bài (ông nói mình có cảm hứng khi đọc tiểu thuyết
    Salammbô của Flaubert) thường đầy mỉa mai.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n18
  cau: Bộ ba bài trở nên nổi tiếng một phần nhờ Debussy, bạn của Satie, người về sau phối
    khí cho dàn nhạc hai bài số 1 và số 3.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n19
  cau: Ngày nay ba bài Gymnopédie là những bản piano nổi tiếng nhất của Satie.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n21
  cau: Bốn ô đầu chỉ có tay trái; giai điệu vào ở phách thứ hai của ô 5; đoạn giữa có các
    nốt Đô♮ và Fa♮.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n23
  cau: Aldo Ciccolini và Pascal Rogé, cả hai thu nhiều nhạc piano của Satie.
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n24
  cau: Reinbert de Leeuw nổi tiếng với tốc độ cực chậm.
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n25
  cau: Cùng một bài mà độ dài các bản thu chênh nhau rất nhiều.
  loai: so-lieu
- trang: piano/tac-pham/satie-gymnopedie
  id: n27
  cau: 'Theo dõi, dạo đầu (4 ô): chỉ tay trái, nốt trầm rồi hợp âm; Sol bảy trưởng và Rê bảy
    trưởng đung đưa.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n28
  cau: 'Theo dõi, câu 1: giai điệu vào ở phách 2 của ô 5; nốt Fa♯ ngân suốt bốn ô cuối câu.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n29
  cau: 'Theo dõi, câu 2: mở đầu như câu 1 rồi rẽ hướng; lần đầu tiên hòa âm rời khỏi cặp Sol
    – Rê.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n30
  cau: 'Theo dõi, đoạn giữa: giai điệu lên cao hơn, Đô♮ và Fa♮ đổi màu; bè trầm chủ yếu giữ
    nốt Rê.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n31
  cau: 'Theo dõi, kết lượt 1: dừng ở hợp âm Rê trưởng, nhưng bài còn tiếp.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n32
  cau: 'Theo dõi, lượt 2: dạo đầu trở lại, mọi thứ nhắc lại gần như nguyên văn.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n33
  cau: 'Theo dõi, đoạn giữa lượt 2: Đô♮ và Fa♮ trở lại.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n34
  cau: 'Theo dõi, kết lượt 2: Fa♮ thay cho Fa♯, kết ở hợp âm Rê thứ; hợp âm cuối tự tắt.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n35
  cau: 'Bảng Cấu trúc, dạo đầu, 4 ô: nốt trầm Sol rồi hợp âm Si – Rê – Fa♯ (cả ô là Sol bảy
    trưởng); nốt trầm Rê rồi hợp âm La – Đô♯ – Fa♯ (Rê bảy trưởng); lặp lại.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n36
  cau: 'Bảng, câu 1, 8 ô: Fa♯ – La, Sol – Fa♯ – Đô♯, Si – Đô♯ – Rê, La, rồi Fa♯ ngân suốt
    bốn ô.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n37
  cau: 'Bảng, câu 2, 9 ô: mở đầu như câu 1 rồi rẽ hướng.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n38
  cau: 'Bảng, đoạn giữa, 10 ô: giai điệu lên cao hơn, có Đô♮ và Fa♮; bè trầm chủ yếu giữ Rê.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n39
  cau: 'Bảng, kết lượt 1, 8 ô: câu kết, dừng ở Rê trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n40
  cau: 'Bảng, lượt 2, 31 ô: nhắc lại từ đầu gần như nguyên văn; bản in gốc viết ra đầy đủ,
    không dùng dấu nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n41
  cau: 'Bảng, kết lượt 2, 8 ô: Fa♮ thay cho Fa♯; kết ở Rê thứ.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n42
  cau: 'Hai hợp âm tay trái của bốn ô đầu, đúng quãng tám: Si3 Rê4 Fa♯4 và La3 Đô♯4 Fa♯4 (thông
    số notes của ::cong-cu piano); nốt trầm Sol và Rê nằm thấp hơn.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n43
  cau: Hai hợp âm chỉ khác nhau hai nốt (Si → La, Rê → Đô♯); Fa♯ giữ nguyên.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n44
  cau: 'Bước nhảy tay trái: từ nốt trầm lên hợp âm có khi xa hơn một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n47
  cau: Hóa biểu có Fa♯, Đô♯ nên Fa♮, Đô♮ ở đoạn giữa và kết lượt 2 rất dễ bị bỏ qua.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n55
  cau: Lent là chậm, nhưng vẫn là nhịp ba.
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n57
  cau: Douloureux là "đau đớn"; ở đây là một nỗi buồn xa xăm, kiềm chế.
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n58
  cau: 'Sắc thái hẹp: bản in gốc ghi pp ở đầu bài và ở hai câu giai điệu, p ở đoạn giữa, và
    chỉ một chữ f mỗi lượt, dưới nốt Fa♯ ngân dài của câu 1 (ô 9 và ô 48).'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n59
  cau: Bàn đạp vang đổi mỗi ô, ở nốt trầm; nốt trầm ghi là nốt trắng chấm dôi ngân cả ô, tay
    trái phải rời nó để đánh hợp âm nên chỉ bàn đạp giữ được nó.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n60
  cau: Una corda là bàn đạp trái, làm tiếng đàn mềm và mờ đi.
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n62
  cau: 'Hợp âm ở phách 2 là nốt trắng: giữ nó đến hết ô.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n65
  cau: 'Học tiếp, cùng tác giả: Gymnopédie số 2 và số 3, Gnossienne số 1.'
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n69
  cau: 'Câu hỏi 1: hai lượt chỉ khác ở phần kết: lượt 1 dừng ở Rê trưởng, lượt 2 có Fa♮ và
    kết ở Rê thứ; bản in gốc viết ra đầy đủ, không dùng dấu nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n70
  cau: 'Câu hỏi 2: Lent et douloureux nghĩa là chậm và đau đớn.'
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n71
  cau: 'Câu hỏi 2, lời giải thích: đau đớn ở đây là nỗi buồn xa xăm, kiềm chế; sắc thái hẹp,
    gần như chỉ pp và p.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n72
  cau: 'Câu hỏi 3: nốt trầm ghi là nốt trắng chấm dôi ngân cả ô, nhưng tay trái phải rời nó
    để đánh hợp âm ở phách 2.'
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n74
  cau: 'Nguồn: Robert Orledge, Satie the Composer, Cambridge University Press, 1990.'
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n75
  cau: 'Nguồn: Steven Moore Whiting, Satie the Bohemian: From Cabaret to Concert Hall, Oxford
    University Press, 1999.'
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n76
  cau: 'Nguồn: G. Henle Verlag, Satie: Gymnopédies (HN 1072), lời tựa của Ulrich Krämer (2011).'
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n77
  cau: 'Nguồn: bản nhạc IMSLP; nốt nhạc, số ô và chỉ dẫn được đối chiếu với bản in gốc (bản
    quét trên Wikimedia Commons).'
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n53
  cau: Kế hoạch 4 tuần (30 phút mỗi ngày, ♩ = 60–72).
  loai: khuyen-tap
- trang: piano/tac-pham/satie-gymnopedie
  id: n73
  cau: 'Câu hỏi 4: tập bước nhảy tay trái: nhảy sớm, đánh đúng lúc.'
  loai: khuyen-tap
- trang: piano/tac-pham/satie-gymnopedie
  id: n26
  cau: Ghi lại tốc độ nào giữ được mạch; nghe bản phối khí của Debussy.
  loai: khuyen-tap
