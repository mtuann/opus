  id: n33
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Ô 9–10 lặp lại ô 1–2."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n34
  luot_2: sai
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf", "https://www.henle.de/download/KB_ausfuehrlich/0882en.pdf"]
  cau_dung: "Câu 6 và đỉnh (ô 11–12): giai điệu lên Đô♯6, nốt cao nhất bài; hợp âm lớn nhất bài ở ô 12 (bản Peters không ghi dấu rải; người chơi tay nhỏ có thể rải)."
  ghi_chu: "Đúng: Đô♯6 ở ô 11–12 là nốt cao nhất bài. Nhưng bản Peters (Mutopia, đọc ảnh PDF) không có dấu rải ở ô 12: dấu ngoặc bên trái hợp âm tay phải là ngoặc số ngón \"1\" cho quãng ba La♯4–Đô♯5 (Henle: \"[ 1 for the third interval a♯1/c♯2 follows A\"). Gọi là \"hợp âm rải\" không theo bản nhạc."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n35
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Ô 13: Si1, Fa♯3 Rê4 / Si3, tay phải Si–Rê–Fa♯: Si thứ; ô 14: Mi3 Si3 Rê4 + Sol♯4 Fa♯5: át. Bản Peters không ghi sắc thái ở đây; \"dịu xuống\" là cảm nhận."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n36
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Ô 15: Si4 → La4 → La5 (quãng tám); hợp âm La trưởng trắng ở ô 16."
