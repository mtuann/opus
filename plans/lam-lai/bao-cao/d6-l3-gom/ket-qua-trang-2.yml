  ghi_chu: "Ô 12: chín nốt Fa♯–La♯–Đô♯–Mi, hợp âm nhiều nốt nhất; V7/ii dẫn sang Si thứ ô 13."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n73
  luot_2: sai
  nguon: ["https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/sonatas_commentaries.pdf", "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/ballades_commentaries.pdf"]
  cau_dung: "Theo bình chú của Ấn bản Quốc gia Ba Lan, hợp âm rải ở tay phải bắt đầu đúng phách (nốt thấp nhất cùng tay trái); hợp âm rải ở tay trái thì rải trước, để nốt cuối vang cùng tay phải."
  ghi_chu: "Bình chú Ấn bản Quốc gia (Sonate, Op. 35, ô 41 và 53): hợp âm rải ở tay phải bắt đầu nốt đầu cùng tay trái (đúng phách); hợp âm rải ở tay trái thì rải sao cho nốt cuối vang cùng tay phải (rải trước phách); \"the rules... apply to the whole of Chopin's oeuvre\". Câu chỉ nói một nửa quy tắc. Ngoài ra bản Peters không ghi dấu rải ở ô 12."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n75
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được nguồn bậc 2 nói về nghĩa của dấu rải liền qua hai khuông và dấu rải riêng từng tay. Quy tắc của Ấn bản Quốc gia (tay trái rải trước, tay phải đúng phách) khớp với vế \"không nhất thiết cùng lúc\", nhưng không nói về cách ghi."
