- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n1
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf", "https://musicbrainz.org/release/b8a53e43-a383-46c0-87ce-0e567c10e795"]
  ghi_chu: "Bản Peters (Mutopia): nhịp lấy đà + 16 ô (MIDI kết thúc đúng phách 3 ô 16). Bản thu Pollini (DG 2012, MusicBrainz): số 7 dài 0:35."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n2
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/"]
  ghi_chu: "Đếm ô từ các file Mutopia của Op. 28: số 9 có 12 ô, số 20 có 13 ô, số 7 có 16 ô; số 7 nằm trong nhóm ngắn nhất (thứ ba)."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n3
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf", "https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Mazurka", "https://web.archive.org/web/20210923144314/https://www.britannica.com/print/article/2087780"]
  ghi_chu: "Peters: 3/4, hình móc đơn chấm dôi + móc kép ở phách 1. Grove: mazurka nhịp 3/4; Bülow gọi bài là \"The Polish dancer\" (Britannica), Mutopia đặt phụ đề \"The Polish Dance\". Chữ \"mazurka\" là cách hiểu chung, bản nhạc không ghi."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n5
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Đối chiếu MIDI/PDF Mutopia: từ ô 1 phách 2 trở đi nốt giai điệu nằm trên hợp âm 2–3 nốt; ngoại lệ là nhịp lấy đà Mi4 và nốt chấm dôi đơn ở ô 1, 9."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n7
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Ô 12 (Peters): tay trái Fa♯3 Đô♯4 Mi4 Fa♯4, tay phải La♯4 Đô♯5 Mi5 La♯5 Đô♯6."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n9
  luot_2: sai
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  cau_dung: "Bản nhạc ghi bàn đạp mỗi câu hai ô một lần đạp, nhả ở chỗ tay trái nghỉ; riêng ô 11–14 bàn đạp đổi mỗi ô."
  ghi_chu: "Peters: ô 1–10 và 15–16 đúng một lần đạp mỗi câu, nhả ở phách 3 ô chẵn (tay trái nghỉ). Nhưng ô 11–14 (câu 6–7) đạp lại mỗi ô; ô 11 và 13 nhả ở hợp âm phách 3, không phải chỗ tay trái nghỉ. Câu viết không có ngoại lệ ấy."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n11
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Mọi câu: lấy đà phách 3, móc đơn chấm dôi + móc kép, hai phách đen, rồi trắng (ô 5, 9, 11, 15 chia hai bè nhưng nhịp điệu ghép lại như nhau)."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n13
  luot_2: dung
  nguon: ["https://www.henle.de/en/Preludes/HN-882", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-4/Chop-28-4.ly"]
  ghi_chu: "Henle HN 882: số 4 và số 7 cùng mức 4 (medium); mức 4 là thấp nhất của Op. 28 (cùng số 6 và 20). Mutopia: số 7 có 16 ô, số 4 có 25 ô."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n16
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Preludes,_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)", "https://www.halleonard.com/product/132308/preludes"]
  ghi_chu: "IMSLP liệt kê giọng: Đô trưởng, La thứ, Sol trưởng, Mi thứ, Rê trưởng, Si thứ, La trưởng (số 7)…; Hal Leonard (Ấn bản Quốc gia): \"arranged in a circle of fifths, with each major key being followed by its relative minor\"."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n17
  luot_2: dung
  nguon: ["https://web.archive.org/web/20210923144314/https://www.britannica.com/print/article/2087780", "https://musicbrainz.org/release/b8a53e43-a383-46c0-87ce-0e567c10e795"]
  ghi_chu: "Britannica: các prelude là những bài độc lập, không kèm fugue. Bản thu Pollini 2012 (MusicBrainz): số 1 0:38, số 5 0:34, số 7 0:35."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n18
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Preludes,_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)"]
  ghi_chu: "IMSLP: số 6 Lento assai (Si thứ), số 8 Molto agitato (Fa♯ thứ). Bản Peters ở Mutopia ghi số 6 là \"Assai Lento\"."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n19
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Đối chiếu Peters."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n20
  luot_2: dung
  nguon: ["https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Mazurka"]
  ghi_chu: "Grove (1900): \"a national Polish dance\", bắt nguồn từ bài hát dân gian kèm múa."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n21
  luot_2: dung
  nguon: ["https://imslp.org/wiki/List_of_works_by_Fr%C3%A9d%C3%A9ric_Chopin"]
  ghi_chu: "IMSLP liệt kê 11 tập có số opus (41 bài), Op. 67 và 68 (8 bài), cùng khoảng 10 bài không số opus: khoảng 59–60 bài."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n23
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf", "https://en.wikisource.org/wiki/A_Dictionary_of_Music_and_Musicians/Mazurka"]
  ghi_chu: "Bản Peters không có dấu nhấn nào; Grove: mazurka thường có nhấn mạnh ở phách 2. Phần \"như nhớ lại\" là cảm nhận, không phải dữ kiện."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n24
  luot_2: dung
  nguon: ["https://tedmuller.us/Piano/VarChopin.htm", "https://musicweb-international.com/classrev/2010/Oct10/Chopin_Plowright_CDA67803.htm"]
  ghi_chu: "Mompou lấy Prelude La trưởng Op. 28 số 7 làm chủ đề (tedmuller.us; review đĩa Hyperion CDA67803 ở MusicWeb: \"Variations sur un thème de Chopin (1957)\"). Nguồn đã mở không ghi Mompou là người Catalunya."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n27
  luot_2: dung
  nguon: ["https://www.musicweb-international.com/classrev/2006/mar06/Chopin_Cortot_8111023.htm", "https://www.deutschegrammophon.com/en/catalogue/products/chopin-24-preludes-op-28-pollini-13521", "https://deutschegrammophon.com/en/catalogue/products/chopin-24-preludes-sonata-no-2-argerich-9748"]
  ghi_chu: "Cortot: 24 Preludes Op. 28 thu năm 1926 (Naxos 8.111023); Pollini, Argerich: đĩa DG 24 Préludes Op. 28."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n29
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Mi4, rồi Đô♯5 (quãng sáu lớn) chấm dôi; ô 1–2: Mi2, Mi3–Mi4, Si4–Sol♯4–Rê4 = Mi bảy."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n30
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Ô 3: Rê♯5 → Mi5 → La5 trên La2, La3–Mi4, Đô♯5: La trưởng."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n31
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Ô 5: bè trầm Mi2, Mi3–Si3, Rê4, Fa♯4 (át); tay phải La♯4 → Si4."
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n32
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf"]
  ghi_chu: "Ô 7: bè trầm La1, nốt thấp nhất bài (ô 15 cũng xuống La1)."
