  id: n39
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-lys.zip", "https://www.mutopiaproject.org/ftp/ChopinFF/O28/Chop-28-7/Chop-28-7-a4.pdf", "https://viva.pressbooks.pub/openmusictheory/chapter/applied-chords/"]
  ghi_chu: "Ô 11 La trưởng, ô 12 Fa♯–La♯–Đô♯–Mi (Fa♯ bảy = V7/ii), ô 13 Si thứ, ô 14 Mi bảy, ô 15 La. OMT: hợp âm át mượn (applied chord) là át của một hợp âm khác trong giọng."
