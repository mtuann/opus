- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n1
  cau: Bài dài mười sáu ô nhịp, chưa đến một phút (câu mở đầu và mô tả trang).
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n2
  cau: Đây là một trong những prélude ngắn nhất của Chopin.
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n3
  cau: Bài ở nhịp ba, với hình chấm dôi gợi điệu mazurka.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n5
  cau: Gần như mọi nốt giai điệu nằm ở đỉnh một hợp âm hai, ba nốt.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n7
  cau: Hợp âm ở ô 12 trải từ Fa♯3 lên Đô♯6.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n9
  cau: Bản nhạc ghi bàn đạp cho mỗi câu hai ô một lần đạp, nhả ở chỗ tay trái nghỉ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n11
  cau: Tám câu có cùng một nhịp điệu.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n13
  cau: 'Có thể học bài này trước Prélude Mi thứ: Henle xếp cả hai ở mức 4, mức thấp nhất trong
    bộ Op. 28, nhưng bài này chỉ có 16 ô nhịp, bài Mi thứ 25 ô.'
  loai: cap-do
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n16
  cau: 'Hai mươi bốn prélude đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song
    song, tiến theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ, Rê trưởng, Si thứ,
    rồi La trưởng ở số 7.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n17
  cau: Mỗi bài là một bức tranh độc lập; có bài chỉ kéo dài vài chục giây.
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n18
  cau: Bài số 7 đứng giữa Prélude Si thứ rất chậm (Lento assai, số 6) và Prélude Fa♯ thứ dồn
    dập (Molto agitato, số 8).
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n19
  cau: Nhịp ba với hình chấm dôi ở phách 1 và hai hợp âm lặp ở phách 2–3.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n20
  cau: Mazurka là điệu nhảy dân gian Ba Lan.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n21
  cau: Chopin viết gần 60 bản mazurka.
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n23
  cau: 'Bài không phải một điệu nhảy thật: không có nhấn lệch, không có tiếng dậm chân, chỉ
    là một giai điệu nhẹ nhàng như nhớ lại một điệu nhảy.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n24
  cau: Nhà soạn nhạc Catalunya Federico Mompou về sau lấy chính prélude này làm chủ đề cho
    một bộ biến tấu cho piano, Variations sur un thème de Chopin.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n27
  cau: Alfred Cortot, Maurizio Pollini và Martha Argerich đã thu trọn bộ prelude.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n29
  cau: 'Nhịp lấy đà và câu 1 (ô 1–2): một nốt Mi đơn, rồi giai điệu nhảy lên một quãng sáu
    với hình chấm dôi; hợp âm át (Mi bảy) ngân.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n30
  cau: 'Câu 2 (ô 3–4): cùng nhịp điệu, giai điệu vươn lên La; hợp âm chủ La trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n31
  cau: 'Câu 3 (ô 5–6): lại trên hợp âm át; La♯ chạm vào Si.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n32
  cau: 'Câu 4 (ô 7–8): về La trưởng, bè trầm xuống thấp nhất bài; khép nửa đầu.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n33
  cau: 'Câu 5 (ô 9–10): nửa sau bắt đầu lại như câu 1.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n34
  cau: 'Câu 6 và đỉnh (ô 11–12): giai điệu lên Đô♯6, nốt cao nhất bài; hợp âm rải lớn ở ô
    12.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n35
  cau: 'Câu 7 (ô 13–14): Si thứ, rồi hợp âm át; nhạc dịu xuống.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n36
  cau: 'Câu 8 (ô 15–16): về La trưởng; giai điệu nhảy lên một quãng tám, hợp âm cuối ngân.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n37
  cau: 'Mỗi câu hai ô có cùng nhịp điệu: nhịp lấy đà ở phách 3, hình chấm dôi ở phách 1, hai
    hợp âm ở phách 2–3, rồi một hợp âm dài.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n38
  cau: 'Nửa đầu là hỏi và đáp: câu lẻ đứng trên hợp âm át, câu chẵn về hợp âm chủ.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n39
  cau: 'Nửa sau phá khuôn ở câu 6–7: hòa âm đổi mỗi ô, lên Fa♯ bảy (át của Si thứ, một át
    phụ) rồi sang Si thứ, trước khi câu 8 về nhà.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n40
  cau: 'Bảng Cấu trúc, câu 1: lấy đà, ô 1–2; Mi bảy (át); giai điệu Mi4 → Đô♯5 . Rê5 → Si4;
    bước nhảy quãng sáu.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n41
  cau: 'Bảng, câu 2: ô 3–4; La trưởng; Fa♯5 → Rê♯5 . Mi5 → La5; quãng sáu Đô♯–La ở tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n42
  cau: 'Bảng, câu 3: ô 5–6; át (bè trầm Mi); Đô♯5 → La♯4 . Si4 → Rê5; bè trong giữ Rê.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n43
  cau: 'Bảng, câu 4: ô 7–8; La trưởng; Sol♯4 → Sol♯4 . La4 → Đô♯5; bè trầm xuống La1.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n44
  cau: 'Bảng, câu 5: ô 9–10; Mi bảy; như câu 1.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n45
  cau: 'Bảng, câu 6: ô 11–12; La trưởng → Fa♯ bảy; Fa♯5 → Rê♯5 . Mi5 → Đô♯6.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n46
  cau: 'Bảng, câu 7: ô 13–14; Si thứ → Mi (át); Đô♯5 → Đô♯5 . Rê5 → Fa♯5; hòa âm đổi mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n47
  cau: 'Bảng, câu 8: ô 15–16; La trưởng; Sol♯4 → Si4 . La4 → La5; nhảy lên một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n48
  cau: Ở câu 2, 3, 6 và 7, nốt dài trong hình chấm dôi thường là một nốt lạ, nằm dưới nốt
    hợp âm nửa cung (Rê♯ trước Mi, La♯ trước Si), và nốt móc kép giải quyết nó.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n50
  cau: 'Nốt nhạc theo ấn bản Peters, qua bản dàn trang LilyPond công cộng của Mutopia Project
    (người nhập: Magnus Lewis-Smith); dấu bàn đạp theo bản ấy, số ngón là gợi ý của trang.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n51
  cau: 'Nhịp lấy đà Mi4 vang một mình: tay trái nghỉ, bàn đạp chưa xuống; bàn đạp xuống cùng
    nốt Mi trầm ở phách 1, giữ suốt câu, nhả ở phách 3 ô 2; câu 2 nhả ở phách 3 ô 4.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n52
  cau: 'Tay trái ở phách 2–3: nốt Mi4 của nó nằm cao hơn nốt Rê4 của tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n54
  cau: 'Hai tay đan vào nhau ở ô 1–2, 7–10: nốt cao của tay trái (Mi4) nằm trên nốt thấp của
    tay phải (Rê4 ở ô 1–2 và 9–10, Đô♯4 ở ô 7–8).'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n55
  cau: Ở ô 12, tay phải trải một quãng mười (La♯4–Đô♯6), cả hợp âm từ Fa♯3.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n56
  cau: 'Bàn đạp: theo dấu trong bản nhạc, đạp cùng nốt trầm phách 1, nhả ở phách 3 của ô sau;
    từ ô 11 đến ô 14 đổi mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n66
  cau: Andantino là đi thong thả, nhẹ nhàng; đừng kéo nó thành một bài chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n68
  cau: Bản Peters ghi dolce e semplice (ngọt ngào và giản dị) ở đầu bài.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n70
  cau: 'Trong bản Peters, mỗi câu có một lần đạp: xuống ở phách 1 cùng nốt trầm của ô lẻ,
    nhả ở phách 3 của ô chẵn; từ ô 11 đến ô 14 bàn đạp đổi mỗi ô, ở ô 11 và 13 nhả ngay ở
    hợp âm phách 3.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n71
  cau: Chopin thường tự ghi bàn đạp trong bản viết tay; các bản Urtext như Ấn bản Quốc gia
    Ba Lan cho biết dấu nào là của ông, dấu nào của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n72
  cau: 'Hợp âm ô 12 là đỉnh và là hợp âm lớn nhất: Fa♯ bảy, át của Si thứ, trải từ Fa♯3 lên
    Đô♯6.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n73
  cau: Theo lệ chung khi chơi Chopin (link Nốt hoa mỹ), hợp âm rải bắt đầu đúng phách, từ
    nốt thấp nhất.
  loai: quy-tac
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n75
  cau: Dấu rải có thể là một đường liền qua hai khuông (rải liền một hơi từ tay trái lên tay
    phải) hay hai đường riêng cho hai tay (không nhất thiết là hai tay rải cùng lúc).
  loai: quy-tac
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n76
  cau: 'Chín nốt của hợp âm ô 12 theo bản Peters, từ dưới lên: Fa♯3 Đô♯4 Mi4 Fa♯4 La♯4 Đô♯5
    Mi5 La♯5 Đô♯6 (thông số notes của ::cong-cu piano).'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n77
  cau: Học trò của Chopin kể rằng ông muốn phần đệm giữ nhịp vững trong khi giai điệu được
    tự do co giãn (sách của Eigeldinger).
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n79
  cau: Bản Peters là một ấn bản thế kỷ 19 với một số chỉ dẫn của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n80
  cau: Các ấn bản khác nhau ở những chi tiết như dấu luyến, chỉ dẫn sắc thái và cách ghi dấu
    rải ở ô 12.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n81
  cau: Nên dùng bản Urtext, lý tưởng nhất là Ấn bản Quốc gia Ba Lan của Jan Ekier, có kèm
    chú giải biểu diễn.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n88
  cau: 'Câu hỏi 1: mỗi câu dài hai ô và mở đầu bằng một nhịp lấy đà; tám câu hai ô cùng nhịp
    điệu.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n89
  cau: 'Câu hỏi 2: bàn đạp nhả ở phách 3 của ô thứ hai, chỗ tay trái nghỉ; từ ô 11 đến ô 14
    hòa âm và bàn đạp đổi mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n90
  cau: 'Câu hỏi 3: rải ô 12 từ nốt thấp nhất lên, bắt đầu đúng phách, nốt Đô♯6 hát rõ nhất;
    bàn đạp xuống từ nốt đầu tiên.'
  loai: quy-tac
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n91
  cau: 'Câu hỏi 4: Fa♯ bảy ở ô 12 là át của Si thứ (một át phụ), dẫn sang Si thứ ở ô 13; Si
    thứ là hợp âm bậc II của La trưởng, rồi nhạc qua át (Mi) về La trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n92
  cau: 'Nguồn: Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by His Pupils,
    Cambridge University Press, 1986.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n93
  cau: 'Nguồn: Ấn bản Quốc gia Ba Lan, tập Preludia op. 28, biên tập Jan Ekier: văn bản Urtext
    và chú giải biểu diễn.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n94
  cau: 'Nguồn: Ấn bản Peters, bản dàn trang LilyPond công cộng của Mutopia Project (Magnus
    Lewis-Smith).'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n64
  cau: Kế hoạch 4 tuần (20–30 phút mỗi ngày, máy đếm nhịp ♩ = 48–72) và danh sách tự kiểm.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n74
  cau: Rải nhanh vừa phải, như một hơi thở sâu; nốt Đô♯6 là giai điệu và phải hát rõ nhất.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n63
  cau: Cách tập bài tập 3 (đặt sẵn hai khối, rải chậm rồi nhanh dần).
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n1
  cau: Bài dài hai mươi lăm ô nhịp (câu mở đầu và mô tả trang).
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n2
  cau: Giai điệu gần như chỉ đi lại giữa hai nốt cạnh nhau.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n3
  cau: Tay trái lặp đi lặp lại những hợp âm móc đơn.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n4
  cau: Ít nốt đến thế mà bài được chơi trong lễ tang của chính Chopin (câu mở đầu và mô tả
    trang).
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n6
  cau: 'Hợp âm tay trái đổi từng chút một: gần như mỗi lần chỉ một bè đi xuống nửa cung.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n9
  cau: Giai điệu ngân dài trên nốt Si rồi thở dài sang Đô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n11
  cau: 'Một cao trào trong 25 ô: dồn lên, bùng nổ, lắng xuống, im lặng, kết.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n12
  cau: 'Một bài Chopin đầu tiên vừa sức: khoảng hai phút; Henle xếp bài ở mức 4, mức thấp
    nhất trong bộ Op. 28.'
  loai: cap-do
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n13
  cau: 'Bộ 24 Prélude Op. 28 đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song
    song, theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ…'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n14
  cau: Chopin mang theo bản Bình quân luật của Bach tới Mallorca, và ý tưởng một bộ prelude
    đủ mọi giọng gợi nhớ tác phẩm ấy.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n15
  cau: 'Prelude của Chopin không còn là khúc dạo đầu cho một fugue: mỗi bài là một bức tranh
    độc lập, có bài chỉ dài vài chục giây.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n16
  cau: Chopin hoàn tất bộ này ở đảo Mallorca, nơi ông trú đông 1838–1839 cùng nhà văn George
    Sand, trong một tu viện cũ ở Valldemossa, khi bệnh phổi đã hành hạ ông.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n17
  cau: Trong thư gửi Camille Pleyel, Chopin viết rằng mình đã viết xong các prelude "trên
    cây đàn nhỏ của ông".
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n18
  cau: Bài số 4 có khi được gọi bằng biệt danh "Ngạt thở" (Suffocation); biệt danh ấy không
    phải của Chopin, ông chỉ ghi tốc độ Largo.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n19
  cau: Ngày 30 tháng 10 năm 1849, tại lễ tang Chopin ở nhà thờ Madeleine (Paris), nghệ sĩ
    organ Louis Lefébure-Wély chơi trên đàn organ hai prelude của Chopin, trong đó có bài
    Mi thứ này, và Requiem của Mozart được trình diễn.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n22
  cau: Alfred Cortot, Maurizio Pollini và Martha Argerich đã thu trọn bộ prelude.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n24
  cau: 'Theo dõi, nhịp lấy đà và câu 1 (ô 1–12): hai nốt Si cách nhau một quãng tám mở lời;
    giai điệu ngân Si rồi thở dài sang Đô, hợp âm tay trái trượt xuống từng nửa cung.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n25
  cau: 'Theo dõi, ô 9: giai điệu bừng lên một chút, trong khi hợp âm bên dưới vẫn trượt xuống.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n26
  cau: 'Theo dõi, ô 12: tay trái dừng trên Si bảy; tay phải một mình chạy một nét nhỏ dẫn
    về đầu.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n27
  cau: 'Theo dõi, câu 2 (ô 13–15): mở đầu như ô 1, nhưng hòa âm trượt nhanh hơn.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n28
  cau: 'Theo dõi, stretto và cao trào (ô 16–18): dồn lên; đỉnh f duy nhất của bài ở ô 17,
    rồi nhỏ dần.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n29
  cau: 'Theo dõi, lắng xuống (ô 19–22): trở lại p; smorzando ở ô 21, giai điệu chìm về nốt
    Mi, hợp âm thưa dần.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n30
  cau: 'Theo dõi, im lặng (ô 23): một hợp âm sáu tăng, rồi dấu lặng có dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n31
  cau: 'Theo dõi, kết (ô 24–25): ba hợp âm cuối pp: át, rồi chủ Mi thứ.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n32
  cau: 'Bảng Cấu trúc, nhịp lấy đà: hai nốt Si cách quãng tám, p, espressivo.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n33
  cau: 'Bảng, câu 1 (ô 1–12): tay phải ngân Si, thở dài Si–Đô; ô 9 giai điệu bừng lên; ô 12
    tay trái dừng ở Si bảy, tay phải nét chạy nhỏ.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n34
  cau: 'Bảng, câu 2 mở đầu (ô 13–15): như ô 1, hòa âm trượt nhanh hơn.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n35
  cau: 'Bảng, cao trào (ô 16–18): chữ stretto ở ô 16, đỉnh f ở ô 17, nhỏ dần ở ô 18; cao trào
    duy nhất.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n36
  cau: 'Bảng, lắng xuống (ô 19–22): trở lại p; smorzando ở ô 21.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n37
  cau: 'Bảng, im lặng (ô 23): hợp âm sáu tăng kiểu Đức rồi dấu lặng có dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n38
  cau: 'Bảng, kết (ô 24–25): ba hợp âm cuối pp, át rồi chủ Mi thứ.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n40
  cau: 'Bảng hòa âm tay trái ô 1–5: Sol–Si–Mi; Fa♯–La–Mi → Fa♯–La–Rê♯; Fa–La–Rê♯ → Fa–La–Rê
    → Fa–Sol♯–Rê; Mi–Sol♯–Rê → Mi–Sol–Rê → Mi–Sol–Đô♯; Mi–Sol–Đô → Mi–Fa♯–Đô.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n41
  cau: Hợp âm ô 1 (Sol–Si–Mi) là Mi thứ thể đảo một.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n42
  cau: Từ hợp âm thứ hai trở đi, mỗi lần đổi chỉ một bè đi xuống nửa cung, khi ở bè trên,
    khi ở bè dưới, khi ở bè giữa.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n43
  cau: Nhiều hợp âm trên đường đi không thuộc giọng nào rõ ràng; chúng tồn tại vì đường đi
    của từng bè, nên bài nghe như trượt dần xuống.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n46
  cau: 'Nét chạy ở ô 12: tay trái nghỉ, tay phải một mình.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n47
  cau: 'Cao trào ô 16–18: stretto, nốt láy quanh, nhảy lên Đô cao, f.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n57
  cau: Largo là rộng và chậm; bài viết ở nhịp 2/2.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n60
  cau: Gần như cả bài ở p và pp; chỉ có một chữ f, ở ô 17; từ ô 21 (smorzando) mọi thứ tắt
    dần; ba hợp âm cuối pp.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n61
  cau: Smorzando là tắt dần.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n62
  cau: Stretto là dồn lên.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n63
  cau: Các ấn bản ghi bàn đạp không giống nhau ở mọi ô.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n65
  cau: Ô 23 dừng trên một hợp âm căng rồi lặng hẳn, có dấu ngân.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n67
  cau: Ấn bản Quốc gia Ba Lan của Jan Ekier được soạn từ bản viết tay và các bản in đầu tiên;
    các bản thế kỷ 19 có thể khác ở dấu luyến, bàn đạp và chỉ dẫn sắc thái.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n70
  cau: 'Học tiếp, cùng tác giả: Prélude Si thứ Op. 28 số 6, giai điệu nằm ở tay trái.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n75
  cau: 'Câu hỏi 1: cao trào duy nhất ở ô 16–18, đỉnh f ở ô 17; chữ stretto ở ô 16; chỉ có
    một chữ f.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n76
  cau: 'Câu hỏi 2: hợp âm tay trái mỗi lần thường chỉ một bè đi xuống nửa cung; nhiều hợp
    âm không thuộc giọng nào rõ ràng.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n77
  cau: 'Câu hỏi 3: Largo trong nhịp 2/2: rộng và chậm, nghĩ hai phách lớn mỗi ô.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n79
  cau: 'Nguồn: Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by His Pupils,
    Cambridge University Press, 1986.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n80
  cau: 'Nguồn: Jim Samson, The Music of Chopin, Routledge & Kegan Paul, 1985.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n81
  cau: 'Nguồn: Thomas Higgins (biên tập), Chopin: Preludes, Op. 28 (Norton Critical Scores),
    W. W. Norton, 1973.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n82
  cau: 'Nguồn: Henle HN 882 (lời tựa, trang sản phẩm) và niên biểu năm 1849 của Viện Fryderyk
    Chopin.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n83
  cau: 'Nguồn: bản nhạc IMSLP; bảng hòa âm đối chiếu với bản Peters 1879 qua bản chép LilyPond
    của Mutopia Project.'
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n66
  cau: Khoảng lặng là một phần của âm nhạc; đừng nhấc tay khỏi đàn trong lúc lặng.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n5
  cau: Bài học về hòa âm trượt từng nửa cung, chơi hợp âm khẽ và đều, và sức nặng của im lặng.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n54
  cau: Cách tập bài tập 2 (đỉnh f bằng sức nặng cánh tay, giữ dấu lặng đủ dài).
  loai: khuyen-tap
