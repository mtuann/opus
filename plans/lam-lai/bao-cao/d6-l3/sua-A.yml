# Sửa dữ liệu đề xuất ở lượt 1, phần A của D6-L3 (src/data/ chưa sửa). Mỗi mục: bản ghi, trường, giá trị cũ và mới, nhận định trong hồ sơ, nguồn, lý do.
- ban_ghi: tac-pham/bach-prelude-do
  truong: thong_tin
  cu: '[Sáng tác / xuất bản, ''... Một phiên bản sớm hơn và ngắn hơn nằm trong *Clavier-Büchlein* ...'']'
  moi: '[Sáng tác / xuất bản, ''... Một phiên bản sớm hơn nằm trong *Clavier-Büchlein* ...'']'
  nhan_dinh: n19
  nguon: ['https://imslp.org/wiki/Prelude_in_C_major,_BWV_846a_(Bach,_Johann_Sebastian)']
  ly_do: 'Có điều kiện: nếu lượt 2 không tìm được nguồn bậc 1–2 cho "ngắn hơn" (số ô của BWV 846a) thì bỏ hai chữ ấy, như trang đã bỏ. Chữ hiện qua ::hop-tac-pham: người giao thêm doi_chu cho trang sau khi áp.'
- ban_ghi: tac-pham/bach-prelude-do
  truong: thong_tin
  cu: '[Giọng · nhịp · tốc độ, Đô trưởng · 4/4 · Bach không ghi tốc độ (thường ♩ ≈ 60–72)]'
  moi: '[Giọng · nhịp · tốc độ, Đô trưởng · 4/4 · Bach không ghi tốc độ (các bản thu thường trong khoảng ♩ ≈ 52–78)]'
  nhan_dinh: n21
  nguon:
  - https://ecmrecords.com/product/johann-sebastian-bach-das-wohltemperierte-clavier-andras-schiff/
  - https://classical.music.apple.com/us/album/716335058
  - https://www.qobuz.com/au-en/album/bach-well-tempered-clavier-book-i-sviatoslav-richter/ln7jrrw5fqh8b
  - https://commons.wikimedia.org/wiki/File:Kimiko_Ishizaka_-_Bach_-_Well-Tempered_Clavier,_Book_1_-_01_Prelude_No._1_in_C_major,_BWV_846.ogg
  ly_do: 'Có điều kiện: "thường ♩ ≈ 60–72" chỉ khớp hai trong bốn bản thu đã đo (Schiff ≈ 78, Richter ≈ 71, Gould ≈ 59, Ishizaka ≈ 52). Hoặc bỏ phần trong ngoặc. Người giao quyết.'
- ban_ghi: tac-pham/bach-prelude-do
