# Sửa dữ liệu đề xuất ở lượt 1, phần B của D6-L3 (src/data/ chưa sửa). Mỗi mục: bản ghi, trường, giá trị cũ và mới, nhận định trong hồ sơ, nguồn, lý do.
# Mọi mục dưới đây là dòng của thong_tin, hiện trên trang qua ::hop-tac-pham: áp xong thì thêm doi_chu cho trang tương ứng.
- ban_ghi: tac-pham/chopin-prelude-la-truong
  truong: thong_tin
  cu: "[Sáng tác / xuất bản, 'Bộ Op. 28 viết trong khoảng 1835–1839, hoàn tất ở Mallorca mùa đông 1838–1839; in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)']"
  moi: "[Sáng tác / xuất bản, 'Bộ Op. 28 hoàn tất ở Mallorca mùa đông 1838–1839 (vài bài có thể có từ đầu thập niên 1830); in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)']"
  nhan_dinh: n14
  nguon:
    - https://www.henle.de/media/cb/de/28/1690886065/0882-1690886065-sync.pdf
    - https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/numbering_en.pdf
    - https://imslp.org/wiki/Preludes,_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)
  ly_do: 'Không nguồn nào ghi mốc 1835. Ấn bản Quốc gia: "24 Preludes 1831(?)-1839"; Henle HN 882 Preface: "it remains unclear when Chopin began to conceive his Préludes, which may date back to the early 1830s"; IMSLP: "1838-39". Phần còn lại của dòng đúng (n15).'
- ban_ghi: tac-pham/chopin-prelude-mi-thu
  truong: thong_tin
  cu: "[Sáng tác / xuất bản, 'Bộ Op. 28 viết trong khoảng 1835–1839, hoàn tất ở Mallorca mùa đông 1838–1839; in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)']"
  moi: "[Sáng tác / xuất bản, 'Bộ Op. 28 hoàn tất ở Mallorca mùa đông 1838–1839 (vài bài có thể có từ đầu thập niên 1830; bài này viết ở Mallorca); in năm 1839 (bản Pháp đề tặng Camille Pleyel, bản Đức đề tặng Joseph Christoph Kessler)']"
  nhan_dinh: n14
  nguon:
    - https://www.henle.de/media/cb/de/28/1690886065/0882-1690886065-sync.pdf
    - https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/numbering_en.pdf
  ly_do: 'Như chopin-prelude-la-truong. Henle: bản nháp số 2 và số 4 ghi "Palma, 28 9bra" (28/11/1838), nên số 4 "most probably" viết ở Mallorca. Vế "bài này viết ở Mallorca" là tùy chọn; bỏ nếu muốn hai bản ghi cùng chữ.'
- ban_ghi: tac-pham/chopin-prelude-mi-thu
  truong: thong_tin
  cu: "[Độ khó, 'Khoảng ABRSM Grade 5 (ước lượng): ít nốt, nhưng đòi hỏi kiểm soát tiếng đàn rất tinh']"
  moi: "[Độ khó, 'Khoảng ABRSM Grade 5: RCM xếp bài ở Level 7 (đề cương 2022); Henle mức 4. Ít nốt, nhưng đòi hỏi kiểm soát tiếng đàn rất tinh']"
  nhan_dinh: n18
  nguon:
    - https://teacherportal.rcmusic.com/getattachment/57f3734d-97e5-4777-b67e-4b1111ee31a3/piano-syllabus-2022-edition.pdf
    - https://www.henle.de/en/Preludes/HN-882
  ly_do: 'Bài có trong đề cương RCM 2022 (trang 65, Level 7: "Prelude in E Minor, op. 28, no. 4"), nên "(ước lượng)" không còn đúng; ghi kỳ đề cương như D6-L1-gom (minuet-sol-thu, musette-re). ABRSM, Trinity không xếp bài (hồ sơ lần 1 n4). Grade đã khóa (Grade 5) giữ nguyên; RCM Level 7 cao hơn: người giao cân nhắc khi mở khóa.'
- ban_ghi: tac-pham/grieg-arietta
  truong: thong_tin
  cu: "[Độ khó, 'Khoảng ABRSM Grade 4 (ước lượng): ít nốt, không có nét chạy nhanh, nhưng giữ hai lớp cân bằng trong một bàn tay và đổi bàn đạp sạch đòi hỏi tai tốt']"
  moi: "[Độ khó, 'Khoảng ABRSM Grade 4: ABRSM xếp bài ở Grade 4 (đề cương 2019–2020), RCM Level 6; Henle mức 4. Ít nốt, không có nét chạy nhanh, nhưng giữ hai lớp cân bằng trong một bàn tay và đổi bàn đạp sạch đòi hỏi tai tốt']"
  nhan_dinh: n17
  nguon:
    - https://web.archive.org/web/2021/https://us.abrsm.org/media/62972/piano_syllabus_2019___2020_complete.pdf
    - https://teacherportal.rcmusic.com/getattachment/57f3734d-97e5-4777-b67e-4b1111ee31a3/piano-syllabus-2022-edition.pdf
    - https://www.henle.de/en/Lyric-Pieces-Volume-I-op.-12/HN-619
  ly_do: 'ABRSM 2019 & 2020, Grade 4, danh sách B, mục 2: "Grieg Arietta (No. 1 from Lyriske småstykker, Op. 12)"; RCM 2022 trang 57, Level 6; Henle HN 619: "Arietta op. 12,1 4 medium". Bài có trong đề cương chính thức, nên bỏ "(ước lượng)"; khớp grade đã khóa (Grade 4) và chip "≈ Grade 4".'
- ban_ghi: tac-pham/satie-gymnopedie
