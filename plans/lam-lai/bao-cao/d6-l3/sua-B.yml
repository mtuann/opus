  cu: "[Sáng tác, '1888, khi Satie 22 tuổi; bài số 1 đề tặng cô Jeanne de Bret']"
  moi: "[Sáng tác, '1888 (tháng 2 đến đầu tháng 4), khi Satie chưa đầy 22 tuổi; bài số 1 đề tặng cô Jeanne de Bret']"
  nhan_dinh: n13
  nguon:
    - https://www.henle.de/media/d4/79/64/1697725847/1072-1697725846-sync.pdf
    - https://imslp.org/wiki/3_Gymnop%C3%A9dies_(Satie,_Erik)
    - https://imslp.org/wiki/Category:Satie,_Erik
  ly_do: 'Satie sinh 17/5/1866 (IMSLP); bài viết "between February and early April 1888" (Henle), IMSLP "1888 (March-April)": lúc ấy ông 21 tuổi. Henle Preface viết "composed at the age of 22" (lệch với hai mốc trên); "chưa đầy 22 tuổi" đúng với cả hai. Trang bài học viết "hơn hai mươi tuổi", đã đúng.'
