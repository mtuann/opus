- trang: nhac-ly/01-cao-do-ten-not
  id: n1
  cau: "Mỗi nốt nhạc có một cao độ: âm cao hay thấp."
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n2
  cau: Về mặt vật lý, cao độ phụ thuộc vào tần số dao động.
  loai: quy-tac
- trang: nhac-ly/01-cao-do-ten-not
  id: n3
  cau: Dây đàn rung càng nhanh, âm càng cao.
  loai: quy-tac
- trang: nhac-ly/01-cao-do-ten-not
  id: n4
  cau: Nốt La dùng để lên dây cho dàn nhạc thường dao động 440 lần mỗi giây (440 Hz).
  loai: so-lieu
- trang: nhac-ly/01-cao-do-ten-not
  id: n5
  cau: Âm nhạc phương Tây chia các cao độ thành một hệ thống có tên gọi cố định.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n6
  cau: Chỉ có 7 tên nốt, lặp đi lặp lại từ thấp đến cao.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n7
  cau: Đô, Rê, Mi, Fa, Sol, La, Si lần lượt ứng với C, D, E, F, G, A, B.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n8
  cau: Ở Việt Nam, Pháp, Ý… người ta gọi tên nốt là Đô, Rê, Mi.
  loai: ten
- trang: nhac-ly/01-cao-do-ten-not
  id: n9
  cau: Trong tài liệu tiếng Anh, tên nốt viết bằng chữ cái, nên bạn sẽ gặp cả hai hệ khi đọc tài liệu.
  loai: ten
- trang: nhac-ly/01-cao-do-ten-not
  id: n13
  cau: Dãy Đô Rê Mi Fa Sol La Si Đô không dấu hóa là gam Đô trưởng.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n14
  cau: Nốt thứ tám nghe "giống" nốt đầu tiên, chỉ cao hơn.
  loai: quy-tac
- trang: nhac-ly/01-cao-do-ten-not
  id: n15
  cau: Hai nốt này cùng tên và cách nhau một quãng tám (octave).
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n16
  cau: Tần số của nốt trên gấp đôi nốt dưới.
  loai: quy-tac
- trang: nhac-ly/01-cao-do-ten-not
  id: n17
  cau: Vì 7 tên nốt lặp lại, ta cần số để biết nốt nằm ở quãng tám nào.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n18
  cau: Ký hiệu thông dụng (ký hiệu khoa học) ghi tên chữ cái kèm số.
  loai: ten
- trang: nhac-ly/01-cao-do-ten-not
  id: n19
  cau: C4 là Đô giữa (middle C), nằm gần giữa bàn phím piano.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n20
  cau: "Từ C4 đi lên: D4, E4, F4, G4, A4, B4, rồi đến C5. Số tăng lên ở nốt Đô."
  loai: quy-tac
- trang: nhac-ly/01-cao-do-ten-not
  id: n21
  cau: A4 là nốt La 440 Hz.
  loai: so-lieu
- trang: nhac-ly/01-cao-do-ten-not
  id: n22
  cau: Piano tiêu chuẩn có 88 phím, gồm phím trắng và phím đen.
  loai: so-lieu
- trang: nhac-ly/01-cao-do-ten-not
  id: n23
  cau: Phím đen xếp theo nhóm 2 phím và 3 phím xen kẽ, giúp bạn định vị.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n24
  cau: Nốt Đô là phím trắng ngay bên trái nhóm 2 phím đen.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n25
  cau: Nốt Fa là phím trắng ngay bên trái nhóm 3 phím đen.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n26
  cau: Các phím trắng lần lượt là Đô Rê Mi Fa Sol La Si, rồi lặp lại.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n27
  cau: Phím đen dùng cho các nốt có dấu thăng hoặc giáng.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n30
  cau: Đô giữa (C4) là phím trắng ngay bên trái nhóm hai phím đen gần giữa bàn phím.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n31
  cau: Các phím Đô cách nhau một quãng tám.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n36
  cau: Sol = G, E = Mi, Si = B.
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n37
  cau: "Nốt ngay trên B4 là C5: tên quay lại Đô và số tăng lên 5."
  loai: quy-tac
- trang: nhac-ly/01-cao-do-ten-not
  id: n40
  cau: 'Câu hỏi: "Nốt Sol trong hệ chữ cái là gì?" Đáp án đúng "G"; "F" và "A" sai; giải thích "Bắt đầu từ La = A: La A, Si B, Đô C, Rê D, Mi E, Fa F, Sol G." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n41
  cau: 'Câu hỏi: "Đô giữa trên piano được ký hiệu là gì?" Đáp án đúng "C4"; "C3", "C5" sai; giải thích "Middle C là C4." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n42
  cau: 'Câu hỏi: "Trên piano, nốt Đô nằm ở đâu?" Đáp án đúng "Ngay bên trái nhóm 2 phím đen"; "Ngay bên trái nhóm 3 phím đen" và "Ngay bên phải nhóm 2 phím đen" sai; giải thích "Bên trái nhóm 3 phím đen là nốt Fa." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/01-cao-do-ten-not
  id: n43
  cau: 'Câu hỏi: "Hai nốt cách nhau một quãng tám thì có đặc điểm gì?" Đáp án đúng "Cùng tên, tần số nốt trên gấp đôi nốt dưới"; "Khác tên, tần số bằng nhau" và "Cùng tên, tần số nốt trên gấp ba nốt dưới" sai; giải thích "Ví dụ La4 = 440 Hz, La5 = 880 Hz." đúng.'
  loai: quy-tac
- trang: nhac-ly/01-cao-do-ten-not
  id: n34
  cau: Đọc to bảy tên nốt đi lên, rồi đi xuống, theo cả hai hệ (Đô Rê Mi… và C D E…).
  loai: khuyen-tap
- trang: nhac-ly/01-cao-do-ten-not
  id: n10
  cau: Bạn nên thuộc cả hai hệ tên nốt.
  loai: khuyen-tap
- trang: nhac-ly/01-cao-do-ten-not
  id: n11
  cau: "Mẹo nhớ: bắt đầu từ La = A, rồi đi theo bảng chữ cái: La A, Si B, Đô C, Rê D, Mi E, Fa F, Sol G."
  loai: khuyen-tap
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n1
  cau: Khuông nhạc gồm 5 dòng kẻ song song và 4 khe giữa chúng.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n2
  cau: "Dòng và khe được đếm từ dưới lên: dòng 1 là dòng thấp nhất."
  loai: quy-tac
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n3
  cau: Mỗi nốt được đặt hoặc trên dòng (dòng kẻ chạy qua giữa nốt) hoặc trong khe.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n4
  cau: Nốt càng cao trên khuông thì âm càng cao.
  loai: quy-tac
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n5
  cau: Đi từ một dòng lên khe ngay trên nó là đi lên một bậc tên nốt (ví dụ từ Mi lên Fa).
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n6
  cau: Chỉ nhìn khuông thì chưa biết dòng nào là nốt gì. Khóa nhạc đặt ở đầu khuông cho biết điều đó.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n7
  cau: Khóa Sol (treble clef) có nét xoắn ôm lấy dòng 2, đánh dấu rằng nốt trên dòng 2 là Sol (G4); từ đó suy ra mọi nốt khác.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n8
  cau: "Khóa Sol dùng cho âm cao: tay phải piano, violin, sáo, giọng nữ."
  loai: quy-tac
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n9
  cau: Guitar cũng đọc khóa Sol, nhưng âm thực tế thấp hơn một quãng tám so với nốt viết.
  loai: quy-tac
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n10
  cau: "Các nốt trên dòng khóa Sol, từ dưới lên: Mi – Sol – Si – Rê – Fa (E G B D F)."
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n11
  cau: "Các nốt trong khe khóa Sol: Fa – La – Đô – Mi (F A C E)."
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n12
  cau: Trong tiếng Anh, các khe khóa Sol ghép lại thành chữ FACE.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n13
  cau: Khóa Fa (bass clef) có hai chấm nằm hai bên dòng 4, đánh dấu nốt trên dòng 4 là Fa (F3).
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n14
  cau: "Khóa Fa dùng cho âm trầm: tay trái piano, cello, contrabass, giọng nam trầm."
  loai: quy-tac
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n15
  cau: "Các nốt trên dòng khóa Fa: Sol – Si – Rê – Fa – La (G B D F A)."
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n16
  cau: "Các nốt trong khe khóa Fa: La – Đô – Mi – Sol (A C E G)."
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n19
  cau: Khi nốt cao hoặc thấp hơn khuông, ta vẽ thêm những đoạn dòng ngắn gọi là dòng kẻ phụ.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n20
  cau: Đọc dòng kẻ phụ giống như đọc tiếp dòng và khe bình thường.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n21
  cau: Đô giữa (C4) nằm trên một dòng kẻ phụ ngay dưới khuông khóa Sol, và cũng là một dòng kẻ phụ ngay trên khuông khóa Fa.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n22
  cau: "Piano dùng hai khuông nối bằng dấu ngoặc: khóa Sol ở trên cho tay phải, khóa Fa ở dưới cho tay trái."
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n23
  cau: Đô giữa nằm đúng ở giữa hai khuông.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n24
  cau: "Bản nhạc piano viết trên khuông kép: khóa Sol thường dành cho tay phải, khóa Fa cho tay trái, và Đô giữa nằm trên dòng kẻ phụ ở giữa hai khuông."
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n25
  cau: Fa3 nằm trên dòng 4 khóa Fa; Sol4 nằm trên dòng 2 khóa Sol.
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n32
  cau: Trong khóa Sol, nốt trên dòng 3 là Si (B4).
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n33
  cau: Trong khóa Fa, nốt trong khe 1 là La (A2).
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n35
  cau: 'Câu hỏi: "Khóa Sol đánh dấu nốt Sol ở dòng nào?" Đáp án đúng "Dòng 2"; "Dòng 1", "Dòng 3" sai; giải thích "Nét xoắn của khóa Sol ôm lấy dòng 2." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n36
  cau: 'Câu hỏi: "Các nốt trong khe của khóa Sol (từ dưới lên) là gì?" Đáp án đúng "Fa – La – Đô – Mi"; "Mi – Sol – Si – Rê" và "La – Đô – Mi – Sol" sai; giải thích "Trong tiếng Anh ghép thành chữ FACE." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n37
  cau: 'Câu hỏi: "Khóa Fa đánh dấu nốt Fa ở dòng nào?" Đáp án đúng "Dòng 4"; "Dòng 2", "Dòng 3" sai; giải thích "Hai chấm của khóa Fa nằm hai bên dòng 4." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n38
  cau: 'Câu hỏi: "Đô giữa nằm ở đâu trên khuông khóa Sol?" Đáp án đúng "Dòng kẻ phụ ngay dưới khuông"; "Dòng 1", "Khe 1" sai; giải thích "Đô giữa cũng là dòng kẻ phụ ngay trên khuông khóa Fa." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n39
  cau: 'Câu hỏi: "Các nốt trên dòng của khóa Fa (từ dưới lên) là gì?" Đáp án đúng "Sol – Si – Rê – Fa – La"; "Mi – Sol – Si – Rê – Fa" và "La – Đô – Mi – Sol – Si" sai; giải thích "Good Boys Do Fine Always." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n30
  cau: Làm tương tự với khóa Fa.
  loai: khuyen-tap
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n17
  cau: 'Mẹo nhớ: dòng khóa Sol "Every Good Boy Does Fine", khe khóa Sol "FACE".'
  loai: khuyen-tap
- trang: nhac-ly/02-khuong-nhac-khoa
  id: n26
  cau: Thuộc vài nốt mốc (Fa3 trên dòng 4 khóa Fa, Sol4 trên dòng 2 khóa Sol), rồi đếm từ nốt mốc gần nhất thay vì đếm từ dòng thấp nhất.
  loai: khuyen-tap
- trang: nhac-ly/03-truong-do
  id: n1
  cau: Cao độ cho biết nốt cao hay thấp.
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n2
  cau: Trường độ cho biết nốt dài hay ngắn.
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n3
  cau: "Trường độ được đo bằng phách: nhịp đều đặn mà bạn hay gõ chân theo khi nghe nhạc."
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n4
  cau: Mỗi hình nốt dài gấp đôi hình nốt nhỏ hơn kế tiếp.
  loai: quy-tac
- trang: nhac-ly/03-truong-do
  id: n5
  cau: Số phách trong bảng áp dụng khi nốt đen bằng 1 phách, trường hợp phổ biến nhất.
  loai: quy-tac
- trang: nhac-ly/03-truong-do
  id: n6
  cau: "Tên các hình nốt: nốt tròn (whole note / semibreve), nốt trắng (half note / minim), nốt đen (quarter note / crotchet), nốt móc đơn (eighth note / quaver), nốt móc kép (sixteenth note / semiquaver)."
  loai: ten
- trang: nhac-ly/03-truong-do
  id: n7
  cau: "Hình dạng: nốt tròn đầu rỗng, không đuôi; nốt trắng đầu rỗng, có đuôi; nốt đen đầu đặc, có đuôi; nốt móc đơn đầu đặc, đuôi có 1 móc; nốt móc kép đầu đặc, đuôi có 2 móc."
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n8
  cau: "Khi nốt đen bằng 1 phách: nốt tròn 4 phách, nốt trắng 2, nốt đen 1, nốt móc đơn ½, nốt móc kép ¼."
  loai: so-lieu
- trang: nhac-ly/03-truong-do
  id: n10
  cau: Khi nhiều nốt móc đứng cạnh nhau, đuôi móc thường được nối thành gạch ngang (beam) cho dễ đọc.
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n12
  cau: Dấu lặng là khoảng im lặng có độ dài xác định.
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n13
  cau: "Mỗi hình nốt có một dấu lặng tương ứng: lặng tròn (4 phách), lặng trắng (2), lặng đen (1), lặng đơn (½), lặng kép (¼)."
  loai: quy-tac
- trang: nhac-ly/03-truong-do
  id: n14
  cau: Một chấm nhỏ bên phải nốt làm nốt dài thêm một nửa độ dài của chính nó.
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n15
  cau: Nốt trắng chấm dôi = 2 + 1 = 3 phách.
  loai: so-lieu
- trang: nhac-ly/03-truong-do
  id: n16
  cau: Nốt đen chấm dôi = 1 + ½ = 1½ phách.
  loai: so-lieu
- trang: nhac-ly/03-truong-do
  id: n17
  cau: "Dấu nối là đường cong nối hai nốt cùng cao độ: chơi nốt đầu và giữ luôn sang nốt sau, không đánh lại."
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n18
  cau: Dấu nối thường dùng khi một nốt kéo dài qua vạch nhịp.
  loai: quy-tac
- trang: nhac-ly/03-truong-do
  id: n19
  cau: Dấu luyến (slur) là đường cong nối các nốt khác cao độ, nghĩa là chơi liền mạch.
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n20
  cau: Tiếng piano tắt dần sau khi đánh.
  loai: quy-tac
- trang: nhac-ly/03-truong-do
  id: n27
  cau: Một nốt trắng chấm dôi cộng một nốt đen bằng 4 phách (3 + 1), vừa đủ một ô nhịp 4/4.
  loai: so-lieu
- trang: nhac-ly/03-truong-do
  id: n30
  cau: 'Câu hỏi: "Trong nhịp 4/4, nốt trắng dài bao nhiêu phách?" Đáp án đúng "2"; "1", "4" sai; giải thích "Nốt trắng bằng hai nốt đen." đúng.'
  loai: so-lieu
- trang: nhac-ly/03-truong-do
  id: n31
  cau: 'Câu hỏi: "Một nốt đen chấm dôi dài bao nhiêu phách?" Đáp án đúng "1 rưỡi"; "1", "2" sai; giải thích "Chấm dôi thêm một nửa độ dài: 1 + ½." đúng.'
  loai: so-lieu
- trang: nhac-ly/03-truong-do
  id: n32
  cau: 'Câu hỏi: "Dấu nối dùng để làm gì?" Đáp án đúng "Nối hai nốt cùng cao độ thành một nốt dài"; "Chơi các nốt khác cao độ liền mạch" và "Ngắt ngắn nốt nhạc" sai; giải thích "Nối các nốt khác cao độ là dấu luyến." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/03-truong-do
  id: n33
  cau: 'Câu hỏi: "Bao nhiêu nốt móc kép bằng một nốt đen?" Đáp án đúng "4"; "2", "8" sai; giải thích "Mỗi nốt móc kép dài ¼ phách." đúng.'
  loai: so-lieu
- trang: nhac-ly/03-truong-do
  id: n28
  cau: Viết ra ba cách khác nhau để lấp đầy một ô nhịp 4 phách.
  loai: khuyen-tap
- trang: nhac-ly/03-truong-do
  id: n23
  cau: Hãy đếm to khi tập 10 bài đầu tiên.
  loai: khuyen-tap
- trang: nhac-ly/03-truong-do
  id: n22
  cau: Người mới hay nhấc tay sớm ở nốt dài.
  loai: khuyen-tap
- trang: nhac-ly/04-nhip
  id: n1
  cau: Các phách trong âm nhạc thường được nhóm lại theo chu kỳ, trong đó phách đầu tiên nghe mạnh hơn.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n2
  cau: Mỗi nhóm phách như vậy được ghi trong một ô nhịp, ngăn cách bằng vạch nhịp (đường dọc cắt ngang khuông).
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n3
  cau: Bản nhạc kết thúc bằng vạch kép.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n4
  cau: Ở đầu bản nhạc, ngay sau khóa, có hai con số xếp chồng gọi là số chỉ nhịp.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n5
  cau: "Số trên của số chỉ nhịp: mỗi ô nhịp có bao nhiêu phách."
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n6
  cau: "Số dưới của số chỉ nhịp: hình nốt nào được tính là 1 phách (4 = nốt đen, 2 = nốt trắng, 8 = nốt móc đơn)."
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n7
  cau: "Riêng 6/8: số trên đếm 6 nốt móc đơn trong ô (8 = nốt móc đơn); cứ ba nốt gộp thành một phách, nên mỗi ô có 2 phách."
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n8
  cau: 2/4 nghĩa là 2 phách, mỗi phách là nốt đen.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n9
  cau: 2/4 có cảm giác MẠNH – nhẹ.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n10
  cau: 2/4 thường gặp ở hành khúc, polka.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n11
  cau: 3/4 nghĩa là 3 phách, mỗi phách là nốt đen.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n12
  cau: 3/4 có cảm giác MẠNH – nhẹ – nhẹ.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n13
  cau: 3/4 thường gặp ở valse (waltz), minuet.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n14
  cau: 4/4 nghĩa là 4 phách, mỗi phách là nốt đen.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n15
  cau: 4/4 có cảm giác MẠNH – nhẹ – vừa – nhẹ.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n16
  cau: 4/4 là số chỉ nhịp phổ biến nhất.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n17
  cau: 4/4 còn được ký hiệu là C.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n18
  cau: "6/8: 6 nốt móc đơn, nhóm thành 2 phách."
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n19
  cau: 6/8 có cảm giác MẠNH – nhẹ – nhẹ – vừa – nhẹ – nhẹ.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n20
  cau: 6/8 thường gặp ở barcarolle, gigue.
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n21
  cau: Giai điệu Ode to Joy nằm trong chương cuối (chương 4) của Giao hưởng số 9 của Beethoven.
  loai: lich-su
- trang: nhac-ly/04-nhip
  id: n22
  cau: Giai điệu Ode to Joy ở bản gốc viết ở Rê trưởng.
  loai: cau-truc
- trang: nhac-ly/04-nhip
  id: n23
  cau: Khối nhạc là 8 ô nhịp đầu của giai điệu, chuyển sang Đô trưởng và viết ở nhịp 4/4 cho dễ đọc (bản gốc ở Rê trưởng).
  loai: cau-truc
- trang: nhac-ly/04-nhip
  id: n25
  cau: Nhịp 6/8 có 6 nốt móc đơn nhưng nghe như 2 phách lớn, mỗi phách chia ba.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n27
  cau: Nhịp đơn và nhịp kép là hai họ nhịp.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n28
  cau: Ở nhịp đơn (2/4, 3/4, 4/4), mỗi phách chia đôi (một nốt đen = hai móc đơn).
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n29
  cau: Ở nhịp kép (6/8, 9/8, 12/8), mỗi phách chia ba (một nốt đen chấm dôi = ba móc đơn).
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n30
  cau: Vì thế 6/8 nghe như "2 phách lớn" chứ không phải 6 phách đều nhau.
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n36
  cau: Chopin có bản Valse Op. 64 số 2.
  loai: danh-muc
- trang: nhac-ly/04-nhip
  id: n37
  cau: Valse Op. 64 số 2 của Chopin viết ở nhịp 3/4, nên đếm "1 – 2 – 3".
  loai: cau-truc
- trang: nhac-ly/04-nhip
  id: n39
  cau: Bè cello và contrabass trình bày giai điệu Ode to Joy đầy đủ lần đầu (chương 4 của Giao hưởng số 9).
  loai: lich-su
- trang: nhac-ly/04-nhip
  id: n42
  cau: 'Câu hỏi: "Trong số chỉ nhịp 3/4, số 3 nghĩa là gì?" Đáp án đúng "Mỗi ô nhịp có 3 phách"; "Nốt móc ba được tính là 1 phách" và "Bản nhạc có 3 câu" sai; giải thích "Số dưới (4) cho biết nốt đen là 1 phách." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n43
  cau: 'Câu hỏi: "Nhịp nào thường dùng cho điệu valse?" Đáp án đúng "3/4"; "2/4", "6/8" sai; giải thích "MẠNH – nhẹ – nhẹ." đúng.'
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n44
  cau: 'Câu hỏi: "Nhịp 6/8 thường được cảm nhận như thế nào?" Đáp án đúng "2 phách lớn, mỗi phách chia ba"; "6 phách đều nhau" và "3 phách lớn, mỗi phách chia đôi" sai; giải thích "Đếm 1-2-3-4-5-6, nhấn vào 1 và 4." đúng.'
  loai: quy-tac
- trang: nhac-ly/04-nhip
  id: n45
  cau: 'Câu hỏi: "Ký hiệu C ở vị trí số chỉ nhịp nghĩa là gì?" Đáp án đúng "4/4"; "2/2" và "3/4" sai; giải thích "C là ký hiệu của nhịp 4/4." đúng.'
  loai: dinh-nghia
- trang: nhac-ly/04-nhip
  id: n40
  cau: Nghe Beethoven Giao hưởng số 9, chương 4, tìm giai điệu Ode to Joy khi bè cello và contrabass trình bày nó đầy đủ lần đầu.
  loai: khuyen-tap
- trang: nhac-ly/04-nhip
  id: n24
  cau: Hãy đếm "1 – 2 – 3", nhấn vào số 1 (ví dụ 3/4).
  loai: khuyen-tap
- trang: nhac-ly/04-nhip
  id: n35
  cau: Vỗ tay theo ví dụ 3/4.
  loai: khuyen-tap
- trang: nhac-ly/05-dau-hoa
  id: n1
  cau: Trên piano, khoảng cách giữa hai phím liền kề (tính cả phím đen) là nửa cung.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n2
  cau: Hai nửa cung là một cung.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n3
  cau: Giữa hầu hết các cặp phím trắng (liền nhau) có một phím đen, nên chúng cách nhau một cung.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n4
  cau: "Có hai chỗ không có phím đen xen giữa hai phím trắng liền nhau, và đó là nửa cung tự nhiên: Mi – Fa (E – F) và Si – Đô (B – C)."
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n6
  cau: Dấu thăng (♯) nâng nốt lên nửa cung.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n7
  cau: Dấu giáng (♭) hạ nốt xuống nửa cung.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n8
  cau: Dấu bình (♮) hủy dấu thăng hoặc giáng, trả nốt về tự nhiên.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n9
  cau: Fa♯ (F♯) là phím đen ngay bên phải Fa. Si♭ (B♭) là phím đen ngay bên trái Si.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n10
  cau: Dấu thăng kép (×) nâng nốt lên một cung; dấu giáng kép (♭♭) hạ nốt xuống một cung.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n11
  cau: Dấu thăng kép và dấu giáng kép dùng khi cần nâng hay hạ một nốt đã mang dấu hóa.
  loai: quy-tac
- trang: nhac-ly/05-dau-hoa
  id: n14
  cau: Đi lên từng nửa cung từ Đô đến Đô là đi qua tất cả 12 phím của một quãng tám.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n15
  cau: Dấu hóa viết ngay trước một nốt trong bài gọi là dấu hóa bất thường (accidental).
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n16
  cau: Dấu hóa bất thường có hiệu lực với mọi nốt cùng cao độ từ đó đến hết ô nhịp. Sang ô nhịp mới thì hết tác dụng.
  loai: quy-tac
- trang: nhac-ly/05-dau-hoa
  id: n17
  cau: Ở ví dụ ^F G F G | …, ô nhịp đầu có hai nốt Fa đều là Fa♯ vì dấu thăng còn hiệu lực; ở ô nhịp sau, Fa trở lại tự nhiên.
  loai: quy-tac
- trang: nhac-ly/05-dau-hoa
  id: n18
  cau: Dấu bình ở đầu ô nhịp sau không bắt buộc (dấu thăng đã hết hiệu lực ở vạch nhịp), nhưng người viết vẫn thêm vào để nhắc người đọc; đây gọi là dấu hóa nhắc (courtesy accidental).
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n19
  cau: "Một phím đen có thể có hai tên: phím giữa Đô và Rê vừa là Đô♯ vừa là Rê♭."
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n20
  cau: Hai tên này chỉ cùng một âm thanh trên piano, gọi là đồng âm khác tên (enharmonic).
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n21
  cau: Dùng tên nào phụ thuộc vào giọng của bản nhạc.
  loai: quy-tac
- trang: nhac-ly/05-dau-hoa
  id: n23
  cau: "Trên bàn phím, mỗi phím đen có hai tên (Đô♯ cũng là Rê♭), và có hai cặp phím trắng không có phím đen ở giữa: Mi–Fa và Si–Đô, chính là hai nửa cung tự nhiên."
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n25
  cau: Giữa Mi và Fa là nửa cung; giữa Fa và Sol là một cung.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n26
  cau: Phím đen giữa Sol và La có hai tên là Sol♯ và La♭.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n27
  cau: Mi♯ nâng Mi lên nửa cung, rơi đúng vào phím Fa. Đô♭ hạ Đô xuống nửa cung, rơi vào phím Si.
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n30
  cau: Quãng 2 thứ là một nửa cung; quãng 2 trưởng là một cung (hai nửa cung).
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n31
  cau: 'Câu hỏi 1: "Giữa hai nốt nào trong các cặp sau là nửa cung tự nhiên?" Đáp án đúng: Mi – Fa. Sai: Đô – Rê, Sol – La. Giải thích: hai nửa cung tự nhiên là Mi–Fa và Si–Đô.'
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n32
  cau: 'Câu hỏi 2: "Dấu giáng có tác dụng gì?" Đáp án đúng: hạ nốt xuống nửa cung. Sai: nâng nốt lên nửa cung, hủy dấu hóa trước đó. Giải thích: dấu bình mới là dấu hủy.'
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n33
  cau: 'Câu hỏi 3: "Dấu hóa bất thường có hiệu lực đến khi nào?" Đáp án đúng: đến hết ô nhịp. Sai: chỉ với một nốt ngay sau nó, đến hết bản nhạc. Giải thích: sang ô nhịp mới thì hết tác dụng.'
  loai: quy-tac
- trang: nhac-ly/05-dau-hoa
  id: n34
  cau: 'Câu hỏi 4: "Phím đen giữa Rê và Mi có những tên nào?" Đáp án đúng: Rê♯ và Mi♭. Sai: Rê♭ và Mi♯; Đô♯ và Rê♭. Giải thích: hai tên đồng âm khác tên của cùng một phím.'
  loai: dinh-nghia
- trang: nhac-ly/05-dau-hoa
  id: n28
  cau: Đây là lý do không nên nghĩ "thăng = phím đen".
  loai: khuyen-tap
- trang: nhac-ly/05-dau-hoa
  id: n5
  cau: "Hãy nhớ kỹ hai cặp này (Mi – Fa, Si – Đô): chúng là chìa khóa để hiểu gam và hợp âm sau này."
  loai: khuyen-tap
- trang: nhac-ly/06-gam-truong
  id: n1
  cau: Gam (scale) là một chuỗi nốt đi lên hoặc đi xuống theo một công thức khoảng cách cố định.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n2
  cau: Gam là "nguyên liệu" để xây giai điệu và hợp âm của một bản nhạc.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n3
  cau: Gam trưởng có 7 nốt khác tên, cộng nốt thứ 8 lặp lại nốt đầu.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n4
  cau: "Công thức gam trưởng: Cung – Cung – Nửa cung – Cung – Cung – Cung – Nửa cung."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n5
  cau: Gam Đô trưởng dùng toàn phím trắng, vì hai nửa cung tự nhiên Mi–Fa và Si–Đô rơi đúng vào vị trí 3–4 và 7–8.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n6
  cau: "Khoảng cách các cặp nốt liền nhau của gam Đô trưởng: Đô–Rê cung, Rê–Mi cung, Mi–Fa nửa cung, Fa–Sol cung, Sol–La cung, La–Si cung, Si–Đô nửa cung."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n7
  cau: "Áp dụng cùng công thức từ nốt Sol: Sol – La – Si – Đô – Rê – Mi – ?; từ Mi phải đi lên một cung, nhưng Mi–Fa chỉ là nửa cung, nên cần Fa♯; sau đó Fa♯–Sol là nửa cung, khớp với công thức."
  loai: quy-tac
- trang: nhac-ly/06-gam-truong
  id: n8
  cau: "Gam Sol trưởng có một dấu thăng: Fa♯."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n10
  cau: Tám phím được tô (G3 A3 B3 C4 D4 E4 F♯4 G4) là các nốt của gam Sol trưởng.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n11
  cau: Thay vì viết dấu thăng trước mọi nốt Fa, người ta viết nó một lần ở đầu khuông, ngay sau khóa. Đó là hóa biểu.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n12
  cau: "Gam Fa trưởng có một dấu giáng: Si♭."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n14
  cau: Mỗi nốt trong gam là một bậc, đánh số La Mã từ I đến VII.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n15
  cau: Chủ âm (I), át âm (V) và cảm âm (VII) là ba bậc quan trọng nhất của gam trưởng.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n17
  cau: 'Bậc I là chủ âm (tonic): "nhà", nơi giai điệu muốn trở về.'
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n18
  cau: "Bậc V là át âm (dominant): tạo căng thẳng, kéo về chủ âm."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n19
  cau: "Bậc VII là cảm âm (leading tone): cách chủ âm nửa cung, rất muốn đi lên chủ âm."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n21
  cau: Khi hát đến Si rồi dừng, bạn cảm thấy rất muốn hát tiếp lên Đô; đó là sức kéo của cảm âm.
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n26
  cau: "Gam Rê trưởng: Rê – Mi – Fa♯ – Sol – La – Si – Đô♯ – Rê, hai dấu thăng (Fa♯ và Đô♯)."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n27
  cau: "Gam Fa trưởng: Fa – Sol – La – Si♭ – Đô – Rê – Mi – Fa."
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n28
  cau: Mỗi tên nốt chỉ xuất hiện một lần trong gam; nếu dùng La♯ thì gam có hai nốt "La" và thiếu nốt "Si".
  loai: quy-tac
- trang: nhac-ly/06-gam-truong
  id: n30
  cau: 'Câu hỏi 1: "Công thức gam trưởng là gì?" Đáp án đúng: Cung – Cung – Nửa – Cung – Cung – Cung – Nửa. Sai: Cung – Nửa – Cung – Cung – Nửa – Cung – Cung; Nửa – Cung – Cung – Cung – Nửa – Cung – Cung. Giải thích: công thức thứ hai là của gam thứ tự nhiên.'
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n31
  cau: 'Câu hỏi 2: "Gam Sol trưởng có dấu hóa nào?" Đáp án đúng: Fa♯. Sai: Si♭, Đô♯. Giải thích: từ Mi phải lên một cung đến Fa♯.'
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n32
  cau: 'Câu hỏi 3: "Bậc V của gam trưởng gọi là gì?" Đáp án đúng: át âm. Sai: chủ âm, cảm âm. Giải thích: bậc I là chủ âm, bậc VII là cảm âm.'
  loai: dinh-nghia
- trang: nhac-ly/06-gam-truong
  id: n33
  cau: 'Câu hỏi 4: "Vì sao gam Fa trưởng dùng Si♭ mà không dùng La♯?" Đáp án đúng: mỗi tên nốt chỉ xuất hiện một lần trong gam. Sai: vì La♯ không tồn tại; vì Si♭ dễ đọc hơn. Giải thích: dùng La♯ thì gam có hai nốt La và thiếu nốt Si.'
  loai: quy-tac
- trang: nhac-ly/06-gam-truong
  id: n22
  cau: "Ngón bấm gam Đô trưởng một quãng tám: tay phải 1-2-3-1-2-3-4-5, tay trái 5-4-3-2-1-3-2-1."
  loai: khuyen-tap
- trang: nhac-ly/06-gam-truong
  id: n25
  cau: Hát (hoặc ngân nga) gam Đô trưởng đi lên, rồi đi xuống, cùng ví dụ ở trên.
  loai: khuyen-tap
- trang: nhac-ly/06-gam-truong
  id: n16
  cau: "Ba bậc cần nhớ trước: chủ âm (I), át âm (V), cảm âm (VII)."
  loai: khuyen-tap
- trang: nhac-ly/07-gam-thu
  id: n1
  cau: So với gam trưởng, gam thứ nghe tối hơn và thường được dùng để diễn tả nỗi buồn.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n2
  cau: Mozart Giao hưởng số 40 viết ở giọng thứ (Sol thứ).
  loai: cau-truc
- trang: nhac-ly/07-gam-thu
  id: n3
  cau: Beethoven Giao hưởng số 5 viết ở giọng thứ (Đô thứ).
  loai: cau-truc
- trang: nhac-ly/07-gam-thu
  id: n4
  cau: Bach Toccata và Fugue (BWV 565) viết ở giọng thứ (Rê thứ).
  loai: cau-truc
- trang: nhac-ly/07-gam-thu
  id: n5
  cau: "Công thức của gam thứ tự nhiên: Cung – Nửa cung – Cung – Cung – Nửa cung – Cung – Cung."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n6
  cau: Gam La thứ dùng toàn phím trắng, giống Đô trưởng nhưng bắt đầu từ La.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n7
  cau: "Khoảng cách các cặp nốt liền nhau của gam La thứ tự nhiên: La–Si cung, Si–Đô nửa cung, Đô–Rê cung, Rê–Mi cung, Mi–Fa nửa cung, Fa–Sol cung, Sol–La cung."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n8
  cau: "Trong La thứ, từ La lên Đô chỉ có 3 nửa cung (quãng 3 thứ), còn trong La trưởng là 4 nửa cung (La lên Đô♯): bậc 3 của gam thứ thấp hơn bậc 3 của gam trưởng cùng tên nửa cung."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n9
  cau: Điểm khác quyết định giữa gam thứ và gam trưởng là bậc 3.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n10
  cau: Bậc 3 thấp hơn nửa cung này có mặt ở cả ba dạng gam thứ.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n12
  cau: Tám phím được tô (A3 B3 C4 D4 E4 F4 G4 A4) là các nốt của gam La thứ tự nhiên.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n13
  cau: Giọng thứ song song (relative minor) dùng chung hóa biểu với một giọng trưởng.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n14
  cau: Chủ âm của giọng thứ song song là bậc 6 của gam trưởng, hay thấp hơn chủ âm trưởng 3 nửa cung.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n15
  cau: Đô trưởng ↔ La thứ (không dấu hóa); Sol trưởng ↔ Mi thứ (1 dấu thăng); Fa trưởng ↔ Rê thứ (1 dấu giáng).
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n16
  cau: "Giọng thứ cùng tên (parallel minor) có cùng chủ âm nhưng khác hóa biểu: Đô trưởng và Đô thứ."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n17
  cau: Beethoven Giao hưởng số 5 đi từ Đô thứ ở chương đầu đến Đô trưởng ở chương cuối.
  loai: cau-truc
- trang: nhac-ly/07-gam-thu
  id: n18
  cau: Trong gam thứ tự nhiên, bậc 7 cách chủ âm một cung (Sol – La), nên không có lực kéo mạnh về chủ âm như cảm âm của gam trưởng.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n19
  cau: "Để tạo lực kéo đó, người ta nâng bậc 7 lên nửa cung: Sol thành Sol♯. Đó là gam thứ hòa âm."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n20
  cau: Dấu thăng này không nằm trong hóa biểu, mà được viết như dấu hóa bất thường mỗi lần xuất hiện.
  loai: quy-tac
- trang: nhac-ly/07-gam-thu
  id: n21
  cau: Thấy một nốt hay bị thăng lên trong bản nhạc giọng thứ thì đó thường là cảm âm.
  loai: quy-tac
- trang: nhac-ly/07-gam-thu
  id: n22
  cau: Khoảng cách giữa Fa và Sol♯ là 3 nửa cung; đây là bước nhảy đặc trưng của gam thứ hòa âm.
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n23
  cau: Để tránh bước nhảy 3 nửa cung khi viết giai điệu, người ta nâng cả bậc 6 và bậc 7 khi đi lên (Fa♯, Sol♯).
  loai: quy-tac
- trang: nhac-ly/07-gam-thu
  id: n24
  cau: Gam thứ giai điệu trở về gam tự nhiên khi đi xuống.
  loai: quy-tac
- trang: nhac-ly/07-gam-thu
  id: n25
  cau: "Dạng tự nhiên (từ La): bậc 6 Fa, bậc 7 Sol; gam gốc, đúng theo hóa biểu."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n26
  cau: "Dạng hòa âm (từ La): bậc 6 Fa, bậc 7 Sol♯; dùng để xây hợp âm, đặc biệt hợp âm bậc V."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n27
  cau: "Dạng giai điệu, đi lên (từ La): bậc 6 Fa♯, bậc 7 Sol♯; dùng cho giai điệu đi lên về chủ âm."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n33
  cau: "Gam Mi thứ tự nhiên: Mi – Fa♯ – Sol – La – Si – Đô – Rê – Mi; hóa biểu giống Sol trưởng (1 dấu thăng Fa♯)."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n34
  cau: "Gam Rê thứ hòa âm: Rê – Mi – Fa – Sol – La – Si♭ – Đô♯ – Rê; bậc 7 Đô được nâng thành Đô♯."
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n36
  cau: 'Câu hỏi 1: "Giọng thứ song song của Đô trưởng là gì?" Đáp án đúng: La thứ. Sai: Đô thứ, Mi thứ. Giải thích: chủ âm của giọng thứ song song là bậc 6 của gam trưởng: La.'
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n37
  cau: 'Câu hỏi 2: "Gam thứ hòa âm khác gam thứ tự nhiên ở bậc nào?" Đáp án đúng: bậc 7. Sai: bậc 3, bậc 6. Giải thích: bậc 7 được nâng lên nửa cung để tạo cảm âm.'
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n38
  cau: 'Câu hỏi 3: "Gam thứ giai điệu khi đi xuống giống dạng nào?" Đáp án đúng: gam thứ tự nhiên. Sai: gam thứ hòa âm, gam trưởng. Giải thích: khi đi xuống, gam thứ giai điệu trở về dạng tự nhiên.'
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n39
  cau: 'Câu hỏi 4: "Đô trưởng và Đô thứ có quan hệ gì?" Đáp án đúng: cùng tên chủ âm, khác hóa biểu. Sai: giọng song song, chung hóa biểu; không có quan hệ gì. Giải thích: chúng có cùng chủ âm Đô nhưng Đô thứ có 3 dấu giáng.'
  loai: dinh-nghia
- trang: nhac-ly/07-gam-thu
  id: n32
  cau: Nghe chương 1 Mozart Giao hưởng số 40 (Sol thứ). Bạn có nghe thấy màu "tối" của giọng thứ không?
  loai: khuyen-tap
- trang: nhac-ly/07-gam-thu
  id: n30
  cau: Tập gam thứ ngay sau gam trưởng song song của nó (Đô trưởng rồi La thứ) để tay và tai so sánh.
  loai: khuyen-tap
- trang: nhac-ly/07-gam-thu
  id: n29
  cau: Gam La thứ hòa âm dùng cùng ngón bấm với Đô trưởng; chỉ cần nhớ Sol♯ ở bậc 7.
  loai: khuyen-tap
- trang: nhac-ly/08-hoa-bieu
  id: n2
  cau: Gam Sol trưởng cần Fa♯ và gam Fa trưởng cần Si♭.
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n3
  cau: "Mỗi giọng có một bộ dấu hóa riêng, viết một lần ở đầu mỗi khuông nhạc: đó là hóa biểu."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n4
  cau: Hóa biểu có hiệu lực với mọi nốt cùng tên ở mọi quãng tám, suốt bản nhạc.
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n5
  cau: "Dấu thăng xuất hiện theo thứ tự cố định: Fa – Đô – Sol – Rê – La – Mi – Si (F C G D A E B)."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n6
  cau: Dấu giáng xuất hiện theo thứ tự Si – Mi – La – Rê – Sol – Đô – Fa (B E A D G C F), chính là thứ tự dấu thăng viết ngược.
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n8
  cau: Một giọng có 3 dấu thăng thì đó luôn là Fa♯, Đô♯, Sol♯, không bao giờ là ba dấu thăng khác.
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n9
  cau: "Có dấu thăng: lấy dấu thăng cuối cùng, đi lên nửa cung, đó là chủ âm giọng trưởng."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n10
  cau: "Ví dụ: 3 dấu thăng, dấu cuối là Sol♯, nửa cung trên là La → La trưởng."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n11
  cau: "Có dấu giáng: dấu giáng áp chót chính là tên giọng trưởng."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n12
  cau: "Ví dụ: 3 dấu giáng (Si♭, Mi♭, La♭), dấu áp chót là Mi♭ → Mi♭ trưởng."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n13
  cau: "Trường hợp riêng cần thuộc lòng: 1 dấu giáng là Fa trưởng."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n14
  cau: "Giọng thứ: tìm giọng trưởng như trên rồi đi xuống 3 nửa cung (bậc 6)."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n15
  cau: Muốn biết bản nhạc ở giọng trưởng hay thứ, hãy nhìn nốt đầu và nốt kết thúc (bản nhạc thường bắt đầu và kết thúc ở chủ âm), và để ý cảm âm bị thăng lên (bài 7).
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n16
  cau: Dấu hóa được thêm dần theo đúng thứ tự, từ 1 đến 7.
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n18
  cau: "Trên khóa Sol, bảy dấu thăng của hóa biểu đặt theo thứ tự: Fa♯ ở dòng kẻ trên cùng (dòng 5), Đô♯ ở khe 3, Sol♯ ở khe ngay trên khuông, Rê♯ ở dòng 4, La♯ ở khe 2, Mi♯ ở khe 4, Si♯ ở dòng 3 (dòng giữa)."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n19
  cau: "Trên khóa Sol, bảy dấu giáng của hóa biểu đặt theo thứ tự: Si♭ ở dòng 3 (dòng giữa), Mi♭ ở khe 4, La♭ ở khe 2, Rê♭ ở dòng 4, Sol♭ ở dòng 2, Đô♭ ở khe 3, Fa♭ ở khe 1."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n20
  cau: "Không có dấu hóa: giọng trưởng là Đô trưởng (C), giọng thứ song song là La thứ (a)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n21
  cau: "Hóa biểu 1♯: giọng trưởng là Sol trưởng (G), giọng thứ song song là Mi thứ (e)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n22
  cau: "Hóa biểu 2♯: giọng trưởng là Rê trưởng (D), giọng thứ song song là Si thứ (b)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n23
  cau: "Hóa biểu 3♯: giọng trưởng là La trưởng (A), giọng thứ song song là Fa♯ thứ (f♯)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n24
  cau: "Hóa biểu 4♯: giọng trưởng là Mi trưởng (E), giọng thứ song song là Đô♯ thứ (c♯)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n25
  cau: "Hóa biểu 5♯: giọng trưởng là Si trưởng (B), giọng thứ song song là Sol♯ thứ (g♯)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n26
  cau: "Hóa biểu 6♯: giọng trưởng là Fa♯ trưởng (F♯), giọng thứ song song là Rê♯ thứ (d♯)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n27
  cau: "Hóa biểu 7♯: giọng trưởng là Đô♯ trưởng (C♯), giọng thứ song song là La♯ thứ (a♯)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n28
  cau: "Hóa biểu 1♭: giọng trưởng là Fa trưởng (F), giọng thứ song song là Rê thứ (d)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n29
  cau: "Hóa biểu 2♭: giọng trưởng là Si♭ trưởng (B♭), giọng thứ song song là Sol thứ (g)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n30
  cau: "Hóa biểu 3♭: giọng trưởng là Mi♭ trưởng (E♭), giọng thứ song song là Đô thứ (c)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n31
  cau: "Hóa biểu 4♭: giọng trưởng là La♭ trưởng (A♭), giọng thứ song song là Fa thứ (f)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n32
  cau: "Hóa biểu 5♭: giọng trưởng là Rê♭ trưởng (D♭), giọng thứ song song là Si♭ thứ (b♭)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n33
  cau: "Hóa biểu 6♭: giọng trưởng là Sol♭ trưởng (G♭), giọng thứ song song là Mi♭ thứ (e♭)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n34
  cau: "Hóa biểu 7♭: giọng trưởng là Đô♭ trưởng (C♭), giọng thứ song song là La♭ thứ (a♭)."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n35
  cau: "Ba cặp đồng âm khác tên nghe giống hệt nhau trên piano: Si trưởng = Đô♭ trưởng, Fa♯ trưởng = Sol♭ trưởng, Đô♯ trưởng = Rê♭ trưởng."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n36
  cau: Mỗi bước theo chiều kim đồng hồ trên vòng quãng năm đi lên một quãng 5 đúng (7 nửa cung) và thêm một dấu thăng.
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n37
  cau: Theo chiều ngược lại, mỗi bước đi lên một quãng 4 đúng và thêm một dấu giáng.
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n38
  cau: Vòng trong của vòng quãng năm là các giọng thứ song song.
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n39
  cau: "Hình vòng quãng năm: vòng ngoài là 12 giọng trưởng C, G, D, A, E, B, F♯/G♭, D♭, A♭, E♭, B♭, F, kèm số dấu 0, 1♯ … 5♯, 6♯/6♭, 5♭ … 1♭; vòng trong là giọng thứ song song a, e, b, f♯, c♯, g♯, d♯/e♭, b♭, f, c, g, d."
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n40
  cau: "Chú thích của hình: theo chiều kim đồng hồ thêm một dấu thăng; ngược chiều thêm một dấu giáng."
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n42
  cau: Hai giọng cạnh nhau trên vòng quãng năm chỉ khác một dấu hóa.
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n43
  cau: Vì thế nhạc chuyển giữa các giọng cạnh nhau rất tự nhiên.
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n44
  cau: Đó là một lý do chủ đề 2 trong hình thức sonata giọng trưởng thường ở giọng át, ngay bên phải giọng chính.
  loai: cau-truc
- trang: nhac-ly/08-hoa-bieu
  id: n45
  cau: 'Chữ cố định của công cụ luyện hóa biểu khi trả lời sai một hóa biểu có dấu thăng: "Chưa đúng. Mẹo: dấu thăng cuối cùng, đi lên nửa cung, là chủ âm của giọng trưởng." Khi câu hỏi là giọng thứ, công cụ thêm: "Giọng thứ song song thấp hơn chủ âm giọng trưởng 3 nửa cung."'
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n46
  cau: 'Chữ cố định của công cụ luyện hóa biểu khi trả lời sai một hóa biểu có dấu giáng: "Chưa đúng. Mẹo: dấu giáng áp chót là tên giọng trưởng (riêng 1 dấu giáng là Fa trưởng)." Khi câu hỏi là giọng thứ, công cụ thêm: "Giọng thứ song song thấp hơn chủ âm giọng trưởng 3 nửa cung."'
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n48
  cau: Mỗi giọng có một "địa hình" phím đen riêng.
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n49
  cau: Chơi thế năm ngón trưởng ở cả 12 giọng, rồi tập gam đi dần quanh vòng quãng năm, là cách nhanh nhất để tay nhớ hóa biểu.
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n52
  cau: 'Câu hỏi 1: "Thứ tự dấu thăng bắt đầu bằng nốt nào?" Đáp án đúng: Fa. Sai: Đô, Si. Giải thích: Fa – Đô – Sol – Rê – La – Mi – Si.'
  loai: quy-tac
- trang: nhac-ly/08-hoa-bieu
  id: n53
  cau: 'Câu hỏi 2: "Hóa biểu có 2 dấu thăng là của giọng trưởng nào?" Đáp án đúng: Rê trưởng. Sai: Sol trưởng, La trưởng. Giải thích: dấu thăng cuối là Đô♯, nửa cung trên là Rê.'
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n54
  cau: 'Câu hỏi 3: "Hóa biểu có 4 dấu giáng là của giọng trưởng nào?" Đáp án đúng: La♭ trưởng. Sai: Mi♭ trưởng, Rê♭ trưởng. Giải thích: bốn dấu giáng Si♭, Mi♭, La♭, Rê♭; dấu áp chót là La♭.'
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n55
  cau: 'Câu hỏi 4: "Giọng thứ song song của Fa trưởng là gì?" Đáp án đúng: Rê thứ. Sai: Fa thứ, Sol thứ. Giải thích: bậc 6 của Fa trưởng là Rê.'
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n56
  cau: 'Câu hỏi 5: "Trên vòng quãng năm, đi theo chiều kim đồng hồ một bước thì sao?" Đáp án đúng: lên quãng 5 đúng, thêm một dấu thăng. Sai: lên quãng 4 đúng, thêm một dấu thăng; lên quãng 5 đúng, thêm một dấu giáng. Giải thích: ví dụ Đô → Sol → Rê, mỗi bước thêm một dấu thăng.'
  loai: dinh-nghia
- trang: nhac-ly/08-hoa-bieu
  id: n50
  cau: Chơi thế năm ngón trưởng ở cả 12 giọng, rồi tập gam đi dần quanh vòng quãng năm để tay làm quen với hóa biểu của từng giọng.
  loai: khuyen-tap
- trang: nhac-ly/08-hoa-bieu
  id: n7
  cau: "Mẹo nhớ bằng tiếng Anh. Dấu thăng: Father Charles Goes Down And Ends Battle. Dấu giáng: đọc ngược lại, Battle Ends And Down Goes Charles' Father."
  loai: khuyen-tap
