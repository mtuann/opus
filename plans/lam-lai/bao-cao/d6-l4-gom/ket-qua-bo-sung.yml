- trang: piano/tac-pham/beethoven-anh-trang
  id: n84
  luot_2: dung
  nguon: ["https://www.henle.de/media/ca/21/5b/1697725842/1062-1697725842-sync.pdf", "https://www.henle.de/en/Piano-Sonata-no.-14-c-sharp-minor-op.-27-no.-2-Moonlight/HN-1062"]
  ghi_chu: "PDF phần đầu của HN 1062 (Vorwort, Preface, rồi 'Vorbemerkung / Introductory remarks' do Murray Perahia ký, tr. IX–X). Perahia viết: chỉ dẫn 'delicatissimo' như gió và 'without dampers (i. e. with pedal)', 'Neither can be taken literally'; 'Though chords can blend into each other to create a mystical sound, I don't think they should obliterate the harmonic sense. If two chords contradict each other (as for example the clash between major and minor at mm. 9 and 10) this should be clear and not be sacrificed for a tone colour. I think Beethoven's indication means that there should always be a pedalled sound.' Mọi vế khớp. Hai lưu ý nhỏ: (1) ý này nằm ở mục 'Lời dẫn' (Introductory remarks) của Perahia, in cùng lời tựa (Preface do Gertsch và Perahia cùng ký) trong phần đầu ấn bản, nên gọi chung là 'lời tựa' chấp nhận được; (2) câu cuối ('Giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ làm nhòe những chỗ ấy') là hệ quả suy ra, Perahia không viết nguyên văn, nhưng đúng với ý 'không được che mất nghĩa hòa âm'."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n19
  luot_2: dung
  nguon: ["https://www.henle.de/media/b5/b6/c6/1697725916/1172-1697725915-sync.pdf", "https://www.henle.de/en/Venetian-Gondola-Songs-for-Piano/HN-1172"]
  ghi_chu: "Lời tựa Henle HN 1172 (Venetianische Gondellieder), mục 'Venetianisches Gondellied fis-moll op. 30 Nr. 6 (U 110)': 'geht aus einem Brief an Carl Klingemann, den Freund aus Jugendtagen, hervor: „Aber ich mag das Venetianische Gondolierlied auch leiden. Du mußt aber sehr viel Pedal dazu nehmen, und es muß nicht allzu langsam schwimmen“ (Brief vom 17. April 1835, Bd. 4, S. 226).' Năm 1835, người nhận Klingemann, bài Fa♯ thứ Op. 30 số 6 và chữ 'das Venetianische Gondolierlied' đều khớp."
