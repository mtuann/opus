- trang: piano/tac-pham/beethoven-anh-trang
  id: n84
  cau: "Perahia (lời tựa Henle HN 1062): chỉ dẫn senza sordino không thể hiểu theo nghĩa đen; các hợp âm có thể hòa vào nhau nhưng không được xóa mất nghĩa hòa âm, chỗ trưởng và thứ va nhau ở ô 9–10 phải nghe rõ; chỉ dẫn nghĩa là lúc nào cũng có tiếng bàn đạp. Giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ làm nhòe những chỗ ấy."
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n19
  cau: Trong một lá thư năm 1835 (gửi Klingemann), chính Mendelssohn gọi bài Fa♯ thứ Op. 30 số 6 là "das Venetianische Gondolierlied".
  loai: lich-su
