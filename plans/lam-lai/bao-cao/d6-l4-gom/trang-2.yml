- trang: nghe-nhac/schumann-kinderszenen
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Robert Schumann (1810–1856).'
  loai: nam
- trang: nghe-nhac/schumann-kinderszenen
  id: n2
  cau: 'Bảng: Tên đầy đủ Kinderszenen (Cảnh tuổi thơ), Op. 15: 13 tiểu phẩm cho piano.'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n3
  cau: 'Bảng: Sáng tác tháng 2–3 năm 1838 (hai bản, số 6 và số 9, có thể đã xong từ mùa thu
    1837); in cuối tháng 2 năm 1839 (Breitkopf & Härtel).'
  loai: nam
- trang: nghe-nhac/schumann-kinderszenen
  id: n4
  cau: 'Bảng: Thời kỳ Lãng mạn.'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n5
  cau: 'Bảng: Thể loại chu trình tiểu phẩm cho piano.'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n6
  cau: 'Bảng: Độ dài khoảng 17–22 phút (bản thu Musopen trên trang này: khoảng 22 phút).'
  loai: so-lieu
- trang: nghe-nhac/schumann-kinderszenen
  id: n7
  cau: Năm 1838 Schumann 27 tuổi, đã đính hôn với nghệ sĩ piano trẻ Clara Wieck, giữa lúc
    cuộc đính hôn vấp phải tranh cãi ngày càng gay gắt.
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n8
  cau: 'Ngày 17/3/1838 ông viết cho Clara: có lần cô bảo ông "đôi khi giống như một đứa trẻ",
    và từ ý ấy ông viết khoảng ba mươi bản nhỏ, chọn ra chừng mười hai và đặt tên Kinderscenen.'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n9
  cau: '"Em sẽ thích chúng, nhưng em phải quên mình là một nghệ sĩ bậc thầy."'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n10
  cau: Bản in cuối cùng có 13 bản; một số bản bị loại có lẽ về sau nằm trong Bunte Blätter
    Op. 99 và Albumblätter Op. 124.
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n11
  cau: 'Không phải nhạc cho trẻ con: Schumann gọi chúng là "hồi tưởng của một người lớn, dành
    cho người lớn".'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n12
  cau: 'Nhạc cho trẻ con tập đàn, ông viết mười năm sau: Album für die Jugend (link bài học).'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n13
  cau: Năm 1839 nhà phê bình Ludwig Rellstab viết bài phê bình tập nhạc.
  loai: nam
- trang: nghe-nhac/schumann-kinderszenen
  id: n14
  cau: Rellstab là người có lẽ đã khởi nguồn biệt danh của sonata Ánh trăng (link hướng dẫn
    nghe).
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n15
  cau: 'Schumann bực bội: Rellstab hẳn tưởng ông đặt một đứa trẻ đang khóc trước mặt rồi đi
    tìm nốt nhạc cho nó, trong khi sự thật ngược lại.'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n16
  cau: Các tiêu đề "dĩ nhiên ra đời sau", chỉ là "những gợi ý tinh tế cho cách chơi và cách
    hiểu".
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n19
  cau: 'Bảng, số và tên gốc tiếng Đức của 13 bài: Von fremden Ländern und Menschen, Kuriose
    Geschichte, Hasche-Mann, Bittendes Kind, Glückes genug, Wichtige Begebenheit, Träumerei,
    Am Kamin, Ritter vom Steckenpferd, Fast zu ernst, Fürchtenmachen, Kind im Einschlummern,
    Der Dichter spricht.'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n20
  cau: 'Bảng, cột Nghĩa: tên tiếng Việt của 13 bài.'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n21
  cau: 'Giọng: số 1 Sol trưởng, số 2 Rê trưởng, số 3 Si thứ, số 4 và 5 Rê trưởng, số 6 La
    trưởng, số 7 và 8 Fa trưởng, số 9 Đô trưởng, số 10 Sol♯ thứ, số 11 Mi thứ / Sol trưởng,
    số 12 Mi thứ, số 13 Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n22
  cau: 'Nghe gì, số 1: giai điệu kể chuyện giản dị; môtip mở đầu sẽ quay lại nhiều lần.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n23
  cau: 'Số 2: nhịp 3/4 nảy, nhấn mạnh, xen một câu mềm mại.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n24
  cau: 'Số 3: nhanh, nốt nảy, như đuổi bắt.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n25
  cau: 'Số 4: một lời xin nhắc đi nhắc lại; kết lửng trên hợp âm bảy át.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n26
  cau: 'Số 5: "câu trả lời" cho số 4; hai tay bắt chước nhau.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n27
  cau: 'Số 6: hợp âm dày, trang trọng như một buổi lễ.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n28
  cau: 'Số 7: một câu nhạc đi lên rồi buông xuống, trở lại nhiều lần với hòa âm khác.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n29
  cau: 'Số 8: ấm cúng; mở đầu bằng bước nhảy Đô–Fa như Träumerei.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n30
  cau: 'Số 9: nhịp 3/4 với trọng âm lệch, như ngựa gỗ bập bênh.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n31
  cau: 'Số 10: giai điệu đảo phách, ngập ngừng.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n32
  cau: 'Số 11: đoạn chậm hiền lành bị cắt ngang bởi những đoạn nhanh đột ngột.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n33
  cau: 'Số 12: đoạn giữa sáng lên ở Mi trưởng; kết lửng, không về hợp âm chủ.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n34
  cau: 'Số 13: như một bài thánh ca; ở giữa có đoạn tự do như lời kể (recitative).'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n35
  cau: 'Giọng: mở và khép ở Sol trưởng; phần lớn các bản ở giọng gần Sol (Rê, La, Si thứ,
    Mi thứ); giữa chu trình rẽ sang Fa trưởng và Đô trưởng (số 7–9), rồi nhảy tới Sol♯ thứ,
    giọng xa nhất (số 10).'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n36
  cau: 'Môtip chung: năm nốt mở đầu số 1 (bước nhảy lên quãng 6 rồi bốn nốt đi xuống) vang
    lại ở nhiều bản sau, thường chỉ còn chuỗi đi xuống.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n37
  cau: Câu về Rudolph Réti coi cả tập gần như một bộ biến tấu.
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n38
  cau: 'Các bản nối nhau: số 4 hỏi, số 5 đáp; Träumerei và Am Kamin cùng mở bằng Đô–Fa; số
    12 dừng lửng, số 13 tiếp lời và khép ở Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n39
  cau: 'Thứ tự: Träumerei là số 7 trong 13, nằm đúng giữa.'
  loai: so-lieu
- trang: nghe-nhac/schumann-kinderszenen
  id: n43
  cau: 'Theo dõi, các dòng mô tả: số 1 Sol trưởng; 2–3 nhịp nảy rồi đuổi bắt rất nhanh; số
    4 kết lửng; số 5 Rê trưởng, hai tay đuổi nhau; số 6 hợp âm dày; số 7 thời gian như chậm
    lại; 8–9; số 10 Sol♯ thứ, đảo phách; số 11 bị "dọa" bởi đoạn nhanh; số 12 đung đưa như
    ru, Mi trưởng, kết lửng; số 13 hợp âm như thánh ca, đoạn tự do, kết rất nhỏ ở Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/schumann-kinderszenen
  id: n45
  cau: 'So sánh bản thu, Horowitz: chơi Träumerei ở cuối buổi hòa nhạc trở lại Carnegie Hall
    năm 1965 và ở Moskva năm 1986 (có đĩa thu trực tiếp).'
  loai: lich-su
- trang: nghe-nhac/schumann-kinderszenen
  id: n46
  cau: 'So sánh bản thu, Martha Argerich: thu trọn tập cùng Kreisleriana (Deutsche Grammophon);
    so tốc độ với số máy đếm nhịp in trong bản in đầu, như ♩ = 100 của Träumerei.'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n47
  cau: So sánh bản thu, Alfred Cortot.
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n50
  cau: Phần lớn các bản ở khoảng Grade 5–7; khó ở phân bè, tiếng đàn, rubato hơn là tốc độ.
  loai: cap-do
- trang: nghe-nhac/schumann-kinderszenen
  id: n54
  cau: 'Nguồn: bản nhạc IMSLP; Urtext Henle, Wiener Urtext.'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n55
  cau: 'Nguồn: Henle HN 44, lời tựa Herttrich (2007), các thư (Clara 17/3/1838, Reinecke 1848,
    Dorn 1839).'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n56
  cau: 'Nguồn: Từ điển piano PTNA (thư gửi Clara, niên đại số 6 và 9).'
  loai: ten
- trang: nghe-nhac/schumann-kinderszenen
  id: n18
  cau: 'Nghe bằng tai người chơi piano: rất ít nốt, nhưng phân bè rõ, rubato mềm, bàn đạp
    trong, tiếng đàn hát ở mức rất nhỏ (link Bàn đạp, Tạo tiếng đàn).'
  loai: khuyen-tap
- trang: nghe-nhac/schumann-kinderszenen
  id: n52
  cau: Nếu chơi cả tập, tập cả chỗ nối giữa các bản; link Tác phẩm theo cấp độ và Thể loại.
  loai: khuyen-tap
- trang: nghe-nhac/schumann-kinderszenen
  id: n40
  cau: 'Số 13 là lời kết: người kể chuyện, giờ đã lớn, bước ra nói với ta.'
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-k545
  id: n1
  cau: 'Tiêu đề: "Mozart: Sonata Đô trưởng, K. 545".'
  loai: ten
- trang: piano/tac-pham/mozart-k545
  id: n2
  cau: Chính Mozart ghi bài này là sonata "cho người mới học".
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n4
  cau: Chương 1 là một hình thức sonata hoàn chỉnh trong 73 ô nhịp, trình bày, phát triển,
    tái hiện đều ngắn và rõ (link hình thức sonata).
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n5
  cau: Đệm Alberti là hợp âm rải theo thứ tự trầm – cao – giữa – cao.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n6
  cau: Alberti là lối đệm rất hay gặp trong nhạc piano thế kỷ 18; tập cho đều và nhẹ ở bài
    này thì dùng lại được ở nhiều bài khác.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n7
  cau: Các chuỗi gam ở đoạn chuyển và phần phát triển (link Gam).
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n11
  cau: Mùa hè 1788 là một giai đoạn sáng tác rất sung sức của Mozart.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n12
  cau: Cùng ngày ghi K. 545 vào danh mục (26/6/1788), Mozart ghi cả Giao hưởng số 39.
  loai: nam
- trang: piano/tac-pham/mozart-k545
  id: n13
  cau: Trong vài tuần sau đó ông hoàn thành hai giao hưởng cuối cùng, số 40 và số 41.
  loai: nam
- trang: piano/tac-pham/mozart-k545
  id: n14
  cau: Gần như không biết gì về hoàn cảnh ra đời của bài, kể cả "người mới học" là ai.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n15
  cau: Ngày 2 tháng 8, Mozart gửi cho chị gái "những bài piano mới nhất" của mình, trong đó
    hẳn có K. 545.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n16
  cau: Bản thảo viết tay đã thất lạc.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n17
  cau: Ấn bản đầu tiên, do Bureau d'Arts et d'Industrie in ở Vienna năm 1805, đặt tên Sonate
    facile; cái tên "dễ" là của nhà xuất bản, không phải của Mozart.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n18
  cau: Theo lời tựa Henle, các nguồn gốc không có một ký hiệu sắc thái nào, khác hẳn những
    sonata khác của ông.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n19
  cau: Mọi chữ p, f trong bản nhạc phổ thông đều do người biên tập thêm; bạn phải tự quyết
    định sắc thái.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n20
  cau: Đàn của Mozart là fortepiano kiểu Vienna; khi qua đời ông có một cây đàn của Anton
    Walter.
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n21
  cau: Âm vực đàn kiểu Walter hơn năm quãng tám một chút, từ Fa1 đến Sol6; bộ giảm âm nhấc
    bằng cần gạt đầu gối.
  loai: so-lieu
- trang: piano/tac-pham/mozart-k545
  id: n23
  cau: Ba câu hỏi khi nghe; ô 42 chủ đề mở đầu quay lại ở một giọng khác.
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n26
  cau: 'Chương 1, chủ đề 1 (ô 1–4): giai điệu đơn giản trên đệm Alberti của tay trái; láy
    rền ở ô 4.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n27
  cau: 'Đoạn chuyển (ô 5–12): chuỗi gam móc kép đi xuống trên hợp âm tay trái; dừng trên hợp
    âm Sol trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n28
  cau: 'Chủ đề 2 (ô 13–25): Sol trưởng; tay trái mở đầu bằng hình móc kép lắc qua lại (ô 13),
    giai điệu mới có láy rền (ô 14–15); láy rền dài trước kết (ô 25).'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n29
  cau: 'Kết trình bày (ô 26–28): hợp âm rải móc kép, rồi ba hợp âm kết ở Sol trưởng; cả phần
    trình bày nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n30
  cau: 'Phát triển (ô 29–41): chất liệu kết trình bày đi qua Sol thứ, Rê thứ, La thứ; chuỗi
    gam lên xuống.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n31
  cau: 'Tái hiện (ô 42): chủ đề 1 ở Fa trưởng (giọng hạ át); đoạn chuyển đưa nhạc về Đô trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n32
  cau: 'Chủ đề 2 ở Đô trưởng (ô 58–73): láy rền dài, rồi kết chương; bản nhạc có dấu nhắc
    lại cho phát triển và tái hiện.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n33
  cau: 'Chương 2, Andante: Sol trưởng, giai điệu hát trên lớp Alberti; phần giữa tối lại ở
    Sol thứ, rồi chủ đề trở về và một coda ngắn.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n34
  cau: 'Chương 3, Rondo: tay trái bắt chước tay phải như trò đuổi bắt; đoạn xen ở Sol trưởng,
    đoạn giữa ở La thứ, rồi chủ đề quay lại và kết.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n35
  cau: Chương 1, Allegro, 73 ô nhịp; số ô theo bản Urtext, các sách phân tích có thể lệch
    nhau một ô ở ranh giới.
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n36
  cau: 'Bảng Cấu trúc chương 1 (bảy hàng: 1–4, 5–12, 13–25, 26–28, 29–41, 42–57, 58–73) với
    nội dung và giọng như bảng Theo dõi.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n37
  cau: 'Chương 2, Andante (Sol trưởng, 3/4): tay trái đệm Alberti gần như suốt chương.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n38
  cau: 'Chương 2: phần đầu dài mười sáu ô nhịp (chủ đề tám ô rồi tám ô tiếp nối), có nhắc
    lại.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n39
  cau: 'Chương 2: phần thứ hai mở ở giọng át rồi quay về; phần giữa tối lại ở Sol thứ, đi
    qua Si♭ trưởng và Đô thứ, trước khi chủ đề trở về và một coda ngắn.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n41
  cau: 'Chương 3, Rondo (Đô trưởng, 2/4): có chỗ tay trái bắt chước tay phải; đoạn xen thứ
    nhất ở Sol trưởng (lại có Alberti), đoạn giữa ở La thứ.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n42
  cau: Chương 3 ngắn, khoảng 1,5 phút.
  loai: so-lieu
- trang: piano/tac-pham/mozart-k545
  id: n43
  cau: Chương 3 nhanh và đòi hỏi hai tay ngang tài nhau.
  loai: cap-do
- trang: piano/tac-pham/mozart-k545
  id: n45
  cau: Cổ tay cứng khi chơi Alberti gây mỏi; rải với cổ tay xoay nhẹ, không nhấc ngón cao.
  loai: quy-tac
- trang: piano/tac-pham/mozart-k545
  id: n47
  cau: Láy rền dài có nốt kết ở cuối trình bày và tái hiện; viết ra số nốt, bắt đầu từ nốt
    trên, nốt kết là hai nốt cuối (link Nốt hoa mỹ).
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n54
  cau: Tăng dần từ ♩ = 72 lên ♩ = 116 qua vài tuần, không bao giờ để cổ tay cứng.
  loai: quy-tac
- trang: piano/tac-pham/mozart-k545
  id: n60
  cau: Allegro nghĩa là vui, nhanh; thời Mozart là nhanh vừa, không phải chạy đua.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n65
  cau: Láy rền thời Cổ điển thường bắt đầu từ nốt trên.
  loai: quy-tac
- trang: piano/tac-pham/mozart-k545
  id: n66
  cau: Các láy rền dài kết thúc bằng hai nốt kết đã viết sẵn.
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n67
  cau: Acciaccatura (nốt nhỏ gạch chéo) chơi ngắn, sát phách.
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n68
  cau: 'Ấn bản: mọi p, f, sf, cresc. trong một ấn bản (như bản IMSLP mà Mutopia chép lại)
    là của người biên tập; dùng bản Urtext.'
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n75
  cau: 'Câu hỏi 1: ở ô 42 chủ đề 1 trở lại ở Fa trưởng, giọng hạ át; đoạn chuyển sau đó đưa
    nhạc về Đô.'
  loai: cau-truc
- trang: piano/tac-pham/mozart-k545
  id: n76
  cau: 'Câu hỏi 2: đệm Alberti là hợp âm rải theo thứ tự trầm – cao – giữa – cao.'
  loai: dinh-nghia
- trang: piano/tac-pham/mozart-k545
  id: n78
  cau: 'Câu hỏi 4: các nguồn gốc không có một ký hiệu sắc thái nào; mọi p, f trong bản phổ
    thông là của người biên tập.'
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n79
  cau: 'Mục Nguồn: lời tựa Henle HN 164 (ngày ghi danh mục, ấn bản 1805, không có sắc thái,
    K. 547a không phải của Mozart).'
  loai: lich-su
- trang: piano/tac-pham/mozart-k545
  id: n64
  cau: 'Bàn đạp: hầu như không cần; không dùng để nối chuỗi gam (link Bàn đạp).'
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-k545
  id: n50
  cau: 'Tốc độ ổn định: chọn tốc độ của đoạn khó nhất, thu âm rồi đo (link thu âm).'
  loai: khuyen-tap
- trang: piano/tac-pham/mozart-k545
  id: n49
  cau: 'Hai tay lệch nhau: tập với máy đếm nhịp theo phách đen, rồi phách trắng (link máy
    đếm nhịp).'
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-traumerei
  id: n1
  cau: Träumerei (Mơ màng) chỉ có 24 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n2
  cau: 'Bài là một bài học lớn về nhiều giọng trong hai bàn tay: giai điệu, bè trong, bè trầm
    đan vào nhau như một bản hợp xướng nhỏ.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n4
  cau: 'Đây là bước tiếp sau những bài "giai điệu tay phải, đệm tay trái": một bàn tay thường
    phải vừa hát vừa đệm.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n6
  cau: Mỗi câu bốn ô nhịp là một hơi thở; cả bài là một vòng cung lớn.
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n8
  cau: Hai, ba phút nhạc; có thể dành sáu tuần.
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n9
  cau: Schumann viết Kinderszenen năm 1838, khi đang yêu Clara Wieck; câu chuyện ở hướng dẫn
    nghe (link).
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n10
  cau: Đây là nhạc về tuổi thơ cho người lớn, không phải nhạc cho trẻ em.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n11
  cau: Nhạc cho người trẻ tập đàn là Album für die Jugend Op. 68, Schumann viết mười năm sau
    (link Album cho tuổi trẻ).
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n12
  cau: Các tên bài, theo lời Schumann, chỉ là những gợi ý tinh tế cho cách chơi và cách hiểu.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n13
  cau: Träumerei đứng đúng giữa chu trình, bài thứ 7 trên 13.
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n14
  cau: Số máy đếm nhịp ♩ = 100 có từ ấn bản đầu tiên (trong một lần in lại), và Schumann đã
    để nguyên khi duyệt bản in.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n15
  cau: Con số này nhanh hơn nhiều so với thói quen chơi rất chậm sau này.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n16
  cau: Michael Struck, chuyên gia về Schumann và biên tập viên của Henle, cho rằng chuyện
    "máy đếm nhịp của Schumann bị hỏng" là huyền thoại; Henle in con số này như chỉ dẫn của
    tác giả.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n17
  cau: Clara Schumann, trong ấn bản của bà, gợi ý chậm hơn (♩ = 80).
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n21
  cau: Horowitz chơi bài này ở cuối buổi hòa nhạc trở lại Carnegie Hall ngày 9/5/1965 và trong
    buổi diễn ở Moskva năm 1986; cả hai buổi đều có đĩa thu trực tiếp.
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n22
  cau: So sánh tốc độ của Horowitz với ♩ = 100 và với bản thu trọn Kinderszenen của nghệ sĩ
    khác (ví dụ Martha Argerich, Deutsche Grammophon).
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n25
  cau: 'Theo dõi, Câu 1 (nhịp lấy đà, ô 1–4): từ Đô giữa, giai điệu đi lên theo hợp âm rải
    rồi giữ Fa cao; trong lúc Fa ngân, bè tenor tay trái đáp lời.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n26
  cau: 'Theo dõi, Câu 2 (ô 5–8): cùng cử chỉ mở đầu, lên cao hơn tới La; ritard. ở cuối ô
    8.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n27
  cau: Theo dõi, Đoạn A nhắc lại (ô 1–8).
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n28
  cau: 'Theo dõi, Câu 3 (ô 9–12): mở đầu như cũ nhưng hòa âm tối lại, hướng về Sol thứ; đường
    nét bè trong chuyền giữa hai tay.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n29
  cau: 'Theo dõi, Câu 4 (ô 13–16): lên cao hơn, qua Si♭ trưởng rồi Rê thứ; ritard. ở ô 16.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n30
  cau: 'Theo dõi, Câu 5 (ô 17–20): chủ đề trở lại nguyên vẹn, mềm hơn, như một kỷ niệm.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n31
  cau: 'Theo dõi, Câu 6 và fermata (ô 21–24): giai điệu lên La; hợp âm đỉnh mang dấu ngân
    (fermata) duy nhất của bài.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n32
  cau: 'Theo dõi, Kết: ritardando, khép lại ở Fa trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n33
  cau: 'Bảng Cấu trúc, A nhịp lấy đà 1–4: câu 1 từ Đô giữa, đi lên theo hợp âm rải, giữ Fa
    cao; bè trong tay trái đáp lời.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n34
  cau: 'A 1–4: đỉnh câu ở phách 2 của ô 2; trong khi Fa giữ, bè tenor đi xuống.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n35
  cau: 'A 5–8: cùng mở đầu, lên tới La; xuất hiện nốt thăng đầu tiên.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n36
  cau: 'A 5–8: ritard. ở cuối ô 8 trước khi nhắc lại hay sang B.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n38
  cau: 'B 9–12: câu 3, hòa âm tối lại, hướng về Sol thứ; các đường nét bè trong chuyền từ
    tay trái sang tay phải.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n39
  cau: 'B 13–16: câu 4 lên cao hơn qua Si♭ trưởng rồi Rê thứ; ritard. ở ô 16, ngay trước khi
    chủ đề trở lại.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n40
  cau: 'A'' 17–20: câu 5, chủ đề trở lại nguyên vẹn.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n42
  cau: 'A'' 21–24: câu 6 lên La, hợp âm đỉnh có dấu ngân (fermata) duy nhất, rồi ritardando
    về kết.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n44
  cau: 'Mỗi câu đều bắt đầu bằng cùng một cử chỉ: hợp âm rải đi lên từ nhịp lấy đà; nhớ sáu
    cách cử chỉ ấy đi tiếp.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n46
  cau: 'Chỗ khó, nốt dài của giai điệu (ô 2, ô 6…): Fa cao tắt dần trong khi các bè khác tiếp
    tục.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n48
  cau: 'Chỗ khó, bè tenor trong tay trái: tenor và bè trầm cùng một tay; tập riêng.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n51
  cau: 'Chỗ khó, nốt hoa mỹ rải ở tay trái (ô 2, ô 6): chơi ngay trước phách, nhẹ.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n52
  cau: 'Chỗ khó, ritardando và fermata: chỉ chậm ở ba chỗ có ghi.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n62
  cau: Schumann chỉ ghi ritard. ở ba chỗ, nơi các đoạn nối vào nhau, và chỉ một fermata, ngay
    trước câu kết.
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n65
  cau: Dải sắc thái hẹp (p là chủ yếu, bản nhạc bắt đầu p).
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n67
  cau: 'Ấn bản của Clara Schumann đổi các số máy đếm nhịp (Träumerei: ♩ = 80); dùng bản Urtext
    để thấy ký hiệu của bản in đầu.'
  loai: lich-su
- trang: piano/tac-pham/schumann-traumerei
  id: n69
  cau: 'Học tiếp, cùng chu trình: Von fremden Ländern und Menschen (bài 1) và Der Dichter
    spricht (bài 13).'
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n74
  cau: 'Câu hỏi 1: đoạn A đầu tiên (ô 1–8) được nhắc lại; giải thích: A (nhắc lại) – B – A'',
    24 ô, sáu câu bốn ô, câu nào cũng mở bằng hợp âm rải đi lên từ nhịp lấy đà.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n76
  cau: 'Câu hỏi 3: số máy đếm nhịp in cho Träumerei là ♩ = 100.'
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n77
  cau: 'Câu hỏi 3, giải thích: Clara Schumann về sau gợi ý chậm hơn, ♩ = 80.'
  loai: so-lieu
- trang: piano/tac-pham/schumann-traumerei
  id: n78
  cau: 'Câu hỏi 4: Schumann ghi ritard. chỉ ở ba chỗ, nơi các đoạn nối vào nhau; giải thích:
    phần còn lại chạy liền mạch.'
  loai: cau-truc
- trang: piano/tac-pham/schumann-traumerei
  id: n79
  cau: 'Nguồn: Henle HN 44 (lời tựa Herttrich 2007, Comments); bài viết Seiffert; phỏng vấn
    Struck và Henle Blog 2021; bản nhạc Mutopia và Peters (Internet Archive); đĩa Horowitz
    1965 (Sony) và 1986 (DG).'
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n80
  cau: 'Bản nhạc: IMSLP; link tài liệu tham khảo.'
  loai: ten
- trang: piano/tac-pham/schumann-traumerei
  id: n68
  cau: 'Lỗi thường gặp (bảy dòng): hợp âm to bằng nhau; ngón cái gõ; chậm ở cuối mọi câu;
    quá chậm; bàn đạp muộn; nốt hoa mỹ rơi đúng phách; đỉnh quá to.'
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-traumerei
  id: n3
  cau: Trang hướng dẫn cách tập để mỗi bè hát đúng vị trí, câu nhạc dài, nhịp tự do có chừng
    mực.
  loai: khuyen-tap
- trang: piano/tac-pham/schumann-traumerei
  id: n64
  cau: 'Âm thanh và cân bằng: giai điệu cantabile; bè trong và tenor có đường nét; bè trầm
    sâu nhẹ.'
  loai: khuyen-tap
