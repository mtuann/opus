- trang: piano/tac-pham/schumann-traumerei
  id: n1
  cau: Träumerei (Mơ màng) chỉ có 24 ô nhịp.
  loai: cau-truc
  nguon:
    - ten: Mutopia Project, Kinderscenen – Träumerei (SchumannOp15No07.ly, .mid; source "Leichte Stucke, 1900", Ying-Chun Liu, phạm vi công cộng; tải 05/11/2026)
