  ghi_chu: "Mutopia: \\partial 4, \\repeat volta { 8 ô }, 16 ô tiếp: 24 ô và nhịp lấy đà."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n32
  cau: "Theo dõi, Mở đầu (ô 1–6): tay trái đung đưa trên Sol trầm; ô 3–5 tiếng gọi Rê – Fa – Mi♭ – Rê; bè trầm Sol – Fa – Si♭ – Đô – Rê, dừng trên hợp âm Rê (át)."
  loai: cau-truc
  nguon:
    - ten: 'Mutopia Project 1679, Lieder ohne Worte: Venetianisches Gondellied, Op.19 No.6 (Ryan Prince, CC BY 3.0; source "Breitkopf & Härtel, 1874-77"; .ly từ kho GitHub, .mid từ mutopiaproject.org, tải 05/11/2026)'
      link: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1679
  ket_qua_luot_1: dung
  ghi_chu: "Tay trái ô 1–2 G2; ô 3 G1/G2 rồi F1/F2; ô 4 B♭1/B♭2 rồi C2/C3; ô 5–6 D2. Ô 6: <a c> d, <fis a> d (D7)."
- trang: piano/tac-pham/schumann-traumerei
  id: n74
  cau: "Câu hỏi 1: đoạn A đầu tiên (ô 1–8) được nhắc lại; giải thích: A (nhắc lại) – B – A', 24 ô, sáu câu bốn ô, câu nào cũng mở bằng hợp âm rải đi lên từ nhịp lấy đà."
  loai: cau-truc
  nguon:
    - ten: Mutopia Project, Kinderscenen – Träumerei (SchumannOp15No07.ly, .mid; source "Leichte Stucke, 1900", Ying-Chun Liu, phạm vi công cộng; tải 05/11/2026)
      link: https://github.com/MutopiaProject/MutopiaProject/blob/master/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly
    - ten: "Rob. Schumann's Werke für Pianoforte solo, Bd. 1 (C. F. Peters, Leipzig, [188-?]), Kinderscenen tr. 60–72 (Internet Archive robschumannswerk01schu, ảnh trang n65–n77): Träumerei \"M.M. ♩ = 100\", không chữ chỉ tốc độ"
      link: https://archive.org/details/robschumannswerk01schu
  ket_qua_luot_1: dung
  ghi_chu: \repeat volta quanh ô 1–8. Không dựa vào vị trí lựa chọn.
