- trang: piano/tac-pham/beethoven-anh-trang
  id: n103
  cau: "Mục Nguồn: Henle HN 1062 (biên tập Norbert Gertsch, ngón bấm Murray Perahia): trang ấn bản, mức độ khó; lời tựa: đoạn văn của Rellstab, ý kiến của Perahia về chỉ dẫn bàn đạp."
  loai: ten
  nguon:
    - ten: 'G. Henle Verlag, HN 1062 Piano Sonata no. 14 op. 27 no. 2 (Moonlight): trang sản phẩm (mức 7 "difficult"; "ABRSM: Piano ARSM")'
      link: https://www.henle.de/en/Piano-Sonata-no.-14-c-sharp-minor-op.-27-no.-2-Moonlight/HN-1062
    - ten: "G. Henle Verlag, HN 1062: lời tựa (Norbert Gertsch, Murray Perahia, 2012), PDF (Cappi 1802; Rellstab, Theodor 1823, in 1824; Schindler 1840; Lenz; người được đề tặng; vị trí nốt móc kép so với nốt thứ ba của chùm ba)"
      link: https://www.henle.de/media/ca/21/5b/1697725842/1062-1697725842-sync.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Lời tựa ký "Norbert Gertsch · Murray Perahia"; đoạn Theodor có trong lời tựa. Review D6-L4-gom: thêm link lời tựa và "ý kiến của Perahia" (n19, n84). Lời tựa có cả hai (review đọc PDF). doi_chu.'
- trang: piano/tac-pham/bach-invention-1
  id: n32
  cau: "Ô 3–4: chủ đề đảo ở tay phải đi xuống thành chuỗi, tay trái đi móc đơn."
  loai: cau-truc
  nguon:
    - ten: Mutopia Project, Invention 1, BWV 772 (Jeff Covey; nguồn Bach-Gesellschaft; tệp LilyPond và MIDI, tải 05/11/2026)
      link: https://www.mutopiaproject.org/ftp/BachJS/BWV772/bach-invention-01/bach-invention-01.ly
    - ten: The Concise Oxford Dictionary of Music, mục sequence, qua Encyclopedia.com ("the more or less exact repetition of a passage at a higher or lower level of pitch")
      link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sequence
  ket_qua_luot_1: dung
  ghi_chu: Tay phải a g f e g f a, f e d c e d f, d c b a c b d, b a g fis a g b; tay trái móc đơn.
