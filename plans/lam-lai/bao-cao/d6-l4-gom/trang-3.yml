- trang: piano/tac-pham/chopin-valse-si-thu
  id: n1
  cau: Chopin viết bản valse này năm 19 tuổi (1829) và không tự cho in nó.
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n4
  cau: So với Valse La thứ, tay trái đổi thế nhiều hơn, giai điệu nhiều trang trí hơn, có
    trio Si trưởng với những câu đi bằng quãng ba, và bài dài hơn gấp đôi (144 ô so với 56
    ô).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n5
  cau: Tay trái nốt trầm – hợp âm – hợp âm; nốt trầm đổi liên tục (Si, Đô♯, La♯, Rê, Mi, Fa♯…),
    hợp âm đổi thế gần như mỗi ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n6
  cau: Trang trí (láy quanh, nốt lân cận nửa cung, chuỗi nửa cung đi xuống) được viết bằng
    nốt thường trong bản nhạc.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n9
  cau: 'Ba màu giọng: Si thứ, Rê trưởng (con anima), Si trưởng (dolce).'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n10
  cau: Lần thứ hai của trio đi chủ yếu bằng quãng ba; bước làm quen nốt kép legato, chuẩn
    bị cho Nocturne Op. 9 số 2.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n11
  cau: Năm 1829 Chopin 19 tuổi và vẫn sống ở Warsaw.
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n12
  cau: Cuối năm 1830 Chopin rời Ba Lan, rồi sống ở Paris cho đến khi mất (1849).
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n13
  cau: Bài được in lần đầu năm 1852, ba năm sau khi Chopin mất, cùng bản Valse Fa thứ (sau
    này là Op. 70 số 2).
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n14
  cau: Năm 1855 Julian Fontana, bạn của Chopin, in các tập tác phẩm di cảo, trong đó có hai
    tập valse Op. 69 và Op. 70; bản này thành Op. 69 số 2.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n16
  cau: Valse của Chopin là nhạc để nghe hơn là để nhảy.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n17
  cau: Trong bài này nhịp 3 đều đặn ở tay trái, giai điệu như một lời than thở nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n18
  cau: Bài được truyền lại ở hai phiên bản; Henle in cả hai, một bản ghi là "phiên bản theo
    Fontana".
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n19
  cau: Đoạn trích trên trang lấy từ ấn bản Peters do Herrmann Scholtz biên tập, qua bản gõ
    lại của Mutopia Project.
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n23
  cau: 'Câu hỏi nghe: nốt Fa♯ ngân đầu câu, đỉnh câu, các nốt trang trí.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n24
  cau: 'Câu hỏi nghe: đoạn Rê trưởng và trio Si trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n25
  cau: 'Câu hỏi nghe: đoạn B – A'' (ô 33–64) có dấu nhắc lại; chủ đề trở lại ở ô 97.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n29
  cau: 'Đoạn A (Si thứ, ô 1–16): giai điệu bắt đầu bằng Fa♯ cao ngân qua vạch nhịp rồi rơi
    xuống La♯; ô 5 có láy quanh Fa♯ – Sol – Mi♯ – Fa♯.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n30
  cau: 'Đoạn A lần hai (ô 17–32): cùng giai điệu; cuối đoạn, nốt Si♭ dẫn sang giọng mới.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n31
  cau: 'Đoạn B (Rê trưởng, con anima, ô 33–48): nốt Si♭ có dấu nhấn mở đầu; cuối đoạn một
    chuỗi nửa cung đi xuống.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n32
  cau: 'Đoạn A'' (ô 49–64): chủ đề trở lại, tô thêm nốt nửa cung (Sol♯ – Sol – Fa♯).'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n33
  cau: Nhắc lại B và A' (ô 33–64).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n34
  cau: 'Trio (Si trưởng, dolce, ô 65–80): giai điệu xoay quanh Rê♯; nốt lặp nhịp chấm dôi
    ở ô 69–72.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n35
  cau: 'Trio lần hai (ô 81–96): giai điệu đi bằng nốt kép, chủ yếu quãng ba; từ ô 89 tối lại
    về Si thứ, rồi dẫn về chủ đề.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n36
  cau: 'Đoạn A (ô 97–112): chủ đề trở lại, mở đầu bằng nốt Si rất trầm ở tay trái; ấn bản
    Peters ghi f.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n37
  cau: 'Đoạn B và A'' (ô 113–144): không nhắc lại; cuối bài calando e dimin.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n38
  cau: 'Số ô theo ấn bản Peters (Mutopia): 144 ô và một nhịp lấy đà; ô 33–64 có dấu nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n39
  cau: 'Bảng Cấu trúc, A ô 1–16: bốn câu 4 ô; giai điệu đi xuống từ Fa♯ trên tay trái valse;
    poco rit. ở ô 14–15.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n41
  cau: 'A ô 17–32: chủ đề lần hai; ô 32 rẽ sang Rê trưởng qua nốt Si♭.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n43
  cau: 'B ô 33–48: con anima; câu 8 ô nói hai lần, lần hai đổi đường đi; kết trên hợp âm át
    bảy của Si thứ.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n44
  cau: 'Si♭ đầu đoạn B là một appoggiatura xuống La: nhấn rồi nhả.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n45
  cau: 'A'' ô 49–64: chủ đề với nốt lân cận nửa cung; cả ô 33–64 nhắc lại.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n46
  cau: 'Trio ô 65–96: Si trưởng rồi Si thứ; dolce; câu 8 ô nói hai lần (65–80); lần hai bằng
    nốt kép, chủ yếu quãng ba (81–88; ô 85–88 xen quãng sáu); từ ô 89 về Si thứ; ô 94 có hợp
    âm sáu tăng dẫn về át âm.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n48
  cau: 'A – B – A'' ô 97–144: Si thứ, Rê trưởng, Si thứ; phần đầu trở lại, không nhắc lại;
    kết calando e dimin.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n49
  cau: 'Ô 97: nốt trầm Si1, thấp hơn nốt Si3 của hợp âm hai quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n50
  cau: Hình thức tổng thể là ba phần, trio ở giữa như minuet hay scherzo (link Minuet và trio).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n51
  cau: Hợp âm ô 94 (Sol – Si – Đô♯ – Mi♯) là một hợp âm sáu tăng (link Napoli và sáu tăng).
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n52
  cau: Sol và Mi♯ tách ra hai phía về Fa♯; át âm ở ô 95.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n53
  cau: Đoạn trích theo ấn bản Peters (Scholtz, Mutopia), đã đối chiếu từng nốt; ngón và bàn
    đạp là của ấn bản ấy.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n54
  cau: Nốt Fa♯ ở phách 3 nối sang ô sau, không đánh lại; tay trái vào đúng phách 1 bên dưới.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n55
  cau: 'Ô 5: Fa♯ – Sol – Mi♯ – Fa♯ là một láy quanh viết bằng móc đơn (link Nốt hoa mỹ); giai
    điệu bay lên Si và Rê.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n56
  cau: Ấn bản này ghi đạp ở phách 1 và nhả ở phách 3 mỗi ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n58
  cau: 'Bảng Chỗ khó, bước nhảy tay trái: từ nốt trầm (Si2, La♯2, có lúc Si1 như ô 97) lên
    hợp âm quanh Fa♯3 – Rê4 trong một phách; hợp âm đổi thế gần như mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n61
  cau: Láy quanh và nốt nửa cung ở ô 5, ô 49–56 viết bằng nốt thường.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n63
  cau: 'Chuỗi nửa cung đi xuống ô 48, ô 56: sáu móc đơn liền nhau qua phím trắng và phím đen.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n66
  cau: 'Quãng ba tay phải ô 81–88: hai nốt vang cùng lúc và nối liền; nốt trên là giai điệu.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n68
  cau: 'Nốt lặp nhịp chấm dôi (ô 69–72, 77–80): hai hoặc ba lần cùng một nốt.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n81
  cau: Moderato là vừa phải, không chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n83
  cau: Theo Carl Mikuli, một học trò của Chopin, ngay cả khi chơi rubato Chopin vẫn để tay
    đệm giữ nhịp thật đều.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n84
  cau: 'Chỗ đáng nán: Fa♯ ngân đầu câu, bước nhảy Si – Rê ở ô 5, Rê cao có rf ở ô 6.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n85
  cau: Chỉ ở chỗ ghi rit. (như ô 14–15) hay calando cả hai tay mới chậm lại.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n86
  cau: Ấn bản Peters ghi đạp phách 1, nhả phách 3 gần như mọi ô, để trống ở các ô kết câu
    như ô 15–16 và 31–32.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n88
  cau: Ở trio, nốt trầm đổi từng ô (Si với La♯ hoặc Fa♯).
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n90
  cau: Phần lớn bài nằm trong vùng p; dấu rf ở ô 6.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n92
  cau: Lần trở lại ở ô 97 được ấn bản Peters ghi f.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n93
  cau: 'Những ô cuối calando e dimin.: chậm và nhỏ dần cùng lúc.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n94
  cau: Chi tiết giai điệu, trang trí, sắc thái có thể khác giữa các bản in vì bài có hai phiên
    bản.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n95
  cau: Henle (HN 131) in cả hai phiên bản; Ấn bản Quốc gia Ba Lan là một lựa chọn; bản Peters
    trên Mutopia miễn phí.
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n100
  cau: 'Valse khó hơn: Valse Đô♯ thứ Op. 64 số 2 (Henle mức 6, bài này mức 4).'
  loai: cap-do
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n102
  cau: 'Mục tiêu xa hơn: Fantaisie-Impromptu Op. 66, cũng được Fontana in năm 1855.'
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n103
  cau: 'Câu hỏi 1: trio ở Si trưởng (không phải Rê trưởng, Sol trưởng).'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n104
  cau: 'Câu hỏi 1, giải thích: đoạn B (ô 33–48) ở Rê trưởng; trio (ô 65–96) ở Si trưởng, rồi
    tối lại về Si thứ trước khi chủ đề trở lại.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n105
  cau: 'Câu hỏi 2: trong ấn bản Peters, láy quanh ô 5 viết bằng nốt thường Fa♯ – Sol – Mi♯
    – Fa♯, móc đơn (không phải ký hiệu láy hay nốt nhỏ).'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n107
  cau: 'Câu hỏi 3: rubato kiểu Chopin: giai điệu co giãn, tay trái giữ nhịp valse, thời gian
    nán được trả lại ngay.'
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n109
  cau: 'Câu hỏi 4: Peters ghi đạp phách 1, nhả phách 3 ở phần lớn các ô.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n110
  cau: 'Câu hỏi 4, giải thích: các ô kết câu như ô 15–16 không có bàn đạp.'
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n111
  cau: 'Nguồn: IMSLP Waltzes Op. 69 (in 1852 ở Kraków, cùng Op. 70 số 2; ấn bản Fontana 1855)
    và bảng số của Ấn bản Quốc gia (WN 19: 1829, in 1852).'
  loai: nam
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n112
  cau: 'Nguồn: Henle HN 131, biên tập Ewald Zimmermann, mức khó 4, in cả hai phiên bản.'
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n113
  cau: 'Nguồn: ấn bản Peters (Scholtz), bản gõ lại của Roland Goretzki cho Mutopia: nguồn
    đoạn trích, số ô, sắc thái, bàn đạp.'
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n114
  cau: 'Nguồn: lời tựa Carl Mikuli (Kistner, Leipzig, 1879), Internet Archive: rubato, tay
    đệm giữ nhịp.'
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n115
  cau: 'Nguồn: Ấn bản Quốc gia Ba Lan (Wydanie Narodowe), biên tập Jan Ekier; bản nhạc IMSLP;
    link tài liệu tham khảo.'
  loai: ten
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n65
  cau: 'Cân bằng hai tay: nốt trầm mp, hợp âm pp; tay phải hát (link Tạo tiếng đàn).'
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n21
  cau: Nghe trọn bài ít nhất ba lần, mỗi lần một câu hỏi (tay trái, rubato, màu giọng, dấu
    nhắc lại).
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n73
  cau: 'Bài tập 1: nhảy sớm, đặt tay sẵn, đạp trễ, nhả ở phách 3; tập nhắm mắt.'
  loai: khuyen-tap
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n1
  cau: Venetianisches Gondellied (Thuyền ca Venice) khép lại tập Lieder ohne Worte đầu tiên
    của Mendelssohn.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n2
  cau: Giai điệu Sol thứ hát bằng hai nốt cùng lúc trong tay phải, trên nhịp 6/8 đung đưa.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n4
  cau: Suốt phần chủ đề, giai điệu đi thành cặp quãng ba hay quãng sáu trong tay phải.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n7
  cau: 'Kiểu đệm: nốt trầm, hợp âm, nốt giữa, hai lần mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n8
  cau: Đây là nhịp đung đưa của barcarolle, bài ca người chèo thuyền (link Thể loại).
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n10
  cau: 'Nhịp chậm, hòa âm đổi theo nốt trầm ở đầu các nửa ô: môi trường để luyện bàn đạp nối
    (link Bàn đạp).'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n11
  cau: 46 ô nhịp có mở đầu, cao trào, chủ đề trở lại và coda.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n13
  cau: Mùa thu 1830, trong chuyến du hành lớn qua châu Âu, Mendelssohn, 21 tuổi, đến Venice.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n14
  cau: Theo lời tựa Henle, bản viết tay còn lại đề Auf einer Gondel và ghi ngày 16/10/1830;
    đây là bài thuyền ca duy nhất trong bốn bài được viết tại Venice.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n15
  cau: Ông định gửi nó làm quà đáp lễ cho Delphine von Schauroth ở München, người đã viết
    tặng ông một bài trong album; lá thư gửi ngày 17/10 bị thất lạc.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n16
  cau: Đầu năm 1832 Mendelssohn gom một loạt tiểu phẩm thành tập Lieder ohne Worte và chọn
    thuyền ca này làm bài cuối; tập in năm 1832 ở London (Novello) với tên Original Melodies
    for the Pianoforte, năm 1833 ở Paris và Bonn.
  loai: nam
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n17
  cau: Cả bộ gồm tám tập, mỗi tập sáu bài; hai tập cuối chỉ ra mắt sau khi ông mất.
  loai: so-lieu
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n18
  cau: Câu "Cái tên Lieder ohne Worte có lẽ do chính Mendelssohn nghĩ ra" và câu về vai trò
    của Fanny Mendelssohn.
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n19
  cau: Câu "Phần lớn những cái tên gắn với từng bài do các nhà xuất bản thêm vào; Venetianisches
    Gondellied là một trong số rất ít tên của chính Mendelssohn".
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n20
  cau: 'Mendelssohn dùng tên Venetianisches Gondellied thêm hai lần: Op. 30 số 6 (Fa♯ thứ,
    1835) và Op. 62 số 5 (La thứ, in năm 1844).'
  loai: danh-muc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n21
  cau: Thuyền ca mô phỏng bài hát của người chèo gondola; ở bài này nhịp 6/8, tay trái đung
    đưa như mái chèo, giai điệu trải dài phía trên.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n23
  cau: Bài chỉ dài hai, ba phút.
  loai: so-lieu
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n24
  cau: 'Câu hỏi nghe 1: nốt trầm sâu đầu mỗi nửa ô, hợp âm nhẹ ở giữa, giai điệu trên; hai
    nhịp chèo mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n26
  cau: 'Câu hỏi nghe 3: ô 3–5 một giọng quanh Đô giữa cất lên Rê – Fa – Mi♭ – Rê, nốt Fa có
    sfz.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n27
  cau: 'Câu hỏi nghe 4: chủ đề quay về cuối ô 34; điều gì mới xen vào.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n28
  cau: 'Câu hỏi nghe 5: nốt Sol trầm cuối cùng.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n32
  cau: 'Theo dõi, Mở đầu (ô 1–6): tay trái đung đưa trên Sol trầm; ô 3–5 tiếng gọi Rê – Fa
    – Mi♭ – Rê; bè trầm Sol – Fa – Si♭ – Đô – Rê, dừng trên hợp âm Rê (át).'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n33
  cau: 'Theo dõi, Câu 1 (nhịp lấy đà cuối ô 7 – ô 11): vào bằng quãng ba, cantabile, đi xuống
    rồi dừng ở nốt Rê dài.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n34
  cau: 'Theo dõi, Câu 2 (cuối ô 11 – ô 17): mở đầu như câu 1, rồi vươn lên, sfz ở ô 15; kết
    ở Rê thứ.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n35
  cau: 'Theo dõi, Đoạn B (ô 18–25): sang Đô thứ, tay phải vừa hát vừa đệm; ô 22–23 pp trên
    hợp âm bảy giảm; ô 25 hợp âm Rê trưởng rồi nốt Rê lặp.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n36
  cau: 'Theo dõi, Cao trào (ô 26–33): hình staccato nhỏ lặp lại, sfz ở ô 31; ô 32–33 tay trái
    nhại giai điệu; về Sol thứ ở ô 34.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n37
  cau: 'Theo dõi, Chủ đề trở lại (cuối ô 34 – ô 39): mf, xen quãng tám Rê cao; nhỏ dần tới
    pp.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n38
  cau: 'Theo dõi, Coda (ô 40–46): tiếng gọi Fa – Mi♭ – Rê trở lại pp, nhịp chèo thưa dần,
    nốt Sol rất trầm cuối cùng với dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n39
  cau: Số ô theo ấn bản Breitkopf & Härtel (Mutopia); mỗi câu bắt đầu bằng nhịp lấy đà ở móc
    đơn cuối của ô trước.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n40
  cau: 'Bảng Cấu trúc, Mở đầu 1–6: như dòng Theo dõi (tiếng gọi, bè trầm, dừng trên át).'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n41
  cau: 'Mở đầu: đặt tốc độ ngay từ ô đầu; sfz ở ô 3 là nhấn trong p.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n42
  cau: 'A câu 1, 7–11: vào bằng quãng ba rồi quãng sáu (cantabile), đi xuống, dừng ở Rê4 dài;
    Sol ở bè trầm lặp ở mọi nửa ô: âm nền chủ âm; hòa âm bên trên đổi màu.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n43
  cau: 'A câu 2, 11–17: mở đầu như câu 1 trong khi Rê4 vẫn giữ; crescendo tới sfz ở ô 15,
    kết ở Rê thứ (ô 17).'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n45
  cau: 'B 18–25: Đô thứ; giai điệu và hợp âm đệm cùng tay phải; ô 22–23 pp trên hợp âm bảy
    giảm; ô 24 hợp âm sáu tăng dẫn tới Rê trưởng và chuỗi Rê lặp (ô 25).'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n46
  cau: 'B: tay phải làm hai việc; nốt Rê lặp to dần rồi nhỏ dần.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n47
  cau: 'B tiếp 26–33: hình staccato nhỏ (Rê – Si♭ – Mi♭ rồi một nốt dài) ở ô 26, 27, 30, 31;
    sfz ở ô 31; ô 32–33 tay trái nhại giai điệu thấp hơn một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n49
  cau: 'A'' 34–39: chủ đề trở lại, mf; quãng tám Rê cao xen giữa các nốt giai điệu; dim. rồi
    pp.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n51
  cau: 'Coda 40–46: tiếng gọi Fa – Mi♭ – Rê trở lại pp trên bè trầm Fa – Si♭ – Đô – Rê; nhịp
    chèo thưa dần, kết trên Sol1 có dấu ngân.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n53
  cau: Hình thức tổng thể ba phần có mở đầu và coda (link Hình thức nhỏ).
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n54
  cau: 'Đoạn B không đưa ra chủ đề mới mà làm giai điệu căng lên bằng hòa âm: hợp âm bảy giảm
    và hợp âm sáu tăng (link Hợp âm bảy, Napoli và sáu tăng).'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n55
  cau: Đoạn trích ô 7–11 chép theo Mutopia (Breitkopf & Härtel 1874–77), đã đối chiếu từng
    nốt; không ghi số ngón.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n56
  cau: Giai điệu đi thành quãng ba ở ô 8 và 10, quãng sáu ở ô 9.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n57
  cau: Nốt Sol trầm lặp đầu mỗi nửa ô trong khi hòa âm bên trên đổi; ô 8 là hợp âm át trên
    nốt Sol.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n58
  cau: 'Ô 11: Rê4 kết câu 1 được giữ sang ô 12 trong khi câu 2 bắt đầu từ nhịp lấy đà; ngón
    cái giữ phím.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n59
  cau: 'Bảng Chỗ khó, nhịp chèo tay trái: nốt trầm cách hợp âm hơn một quãng tám; hợp âm phách
    yếu dễ to; dễ đếm sáu.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n61
  cau: Giai điệu quãng ba, quãng sáu ở ô 7–17 và 34–39; ngón 1–2 khỏe nên nốt dưới dễ to.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n63
  cau: 'Nốt Rê4 giữ dưới câu 2 (ô 11–12): ngón cái giữ phím suốt hai ô trong khi ngón 2–5
    chơi quãng ba bên trên.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n65
  cau: 'Giai điệu và hợp âm đệm cùng tay phải (ô 18–24, 26–31): giai điệu vào phách, hợp âm
    đệm giữa phách.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n67
  cau: 'Staccato và nốt Rê lặp (ô 25–31): staccato dưới dấu luyến (portato); chuỗi Rê ở ô
    25 to dần rồi nhỏ dần.'
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n69
  cau: Ba chỗ sfz (ô 3, 15, 31) nằm giữa nền p.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n70
  cau: 'sfz ở đây là "nhấn so với xung quanh": thêm trọng lượng rồi diminuendo ngay.'
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n71
  cau: 'Tay trái nhại giai điệu (ô 32–33): tay trái lên vùng giữa.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n73
  cau: 'Quãng tám Rê xen giữa chủ đề (ô 36–39): tay phải nhảy từ quãng ba, quãng sáu lên quãng
    tám cao rồi về.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n75
  cau: 'Coda (ô 40–46): kết cấu thưa dần.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n77
  cau: Bài tập soạn riêng cho trang, ở Sol thứ để quen hai dấu giáng (Si♭, Mi♭) và cảm âm
    Fa♯.
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n86
  cau: Andante sostenuto nghĩa là đi thong thả và ngân giữ.
  loai: dinh-nghia
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n87
  cau: Bản Breitkopf & Härtel không ghi số máy đếm nhịp.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n91
  cau: Khi giai điệu đi bậc liền trong cùng nửa ô (như ô 8, 10), nhấc nửa chừng nhanh.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n92
  cau: Bản Breitkopf & Härtel ghi giữ bàn đạp suốt ô 22–23 (hợp âm bảy giảm, pp); từ chỗ chủ
    đề trở lại ghi sempre Ped.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n93
  cau: 'Đoạn staccato (ô 26–31): đạp ngắn để bắt quãng tám ở bè trầm.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n95
  cau: Gần như cả bài trong p và pp; chữ mf duy nhất khi chủ đề trở lại (nhịp lấy đà cuối
    ô 34); ba sfz là chỗ nhấn trong nền nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n96
  cau: Mỗi câu bắt đầu bằng nhịp lấy đà dẫn vào phách đầu ô sau.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n98
  cau: Bản Breitkopf không ghi ritardando ở cuối; kết cấu tự thưa dần ở ô 44–46.
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n99
  cau: Henle in cả trọn bộ Lieder ohne Worte lẫn tập riêng bốn bài thuyền ca (HN 1172).
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n100
  cau: Bản Breitkopf & Härtel 1874–77 (Mutopia, miễn phí) dùng được để đối chiếu nốt.
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n103
  cau: 'Hai bài Venetianisches Gondellied còn lại: Op. 30 số 6 (Fa♯ thứ), Op. 62 số 5 (La
    thứ), Henle mức 5; HN 1172 in cả bốn bài thuyền ca (thêm Gondellied La trưởng, không số
    opus).'
  loai: cap-do
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n108
  cau: 'Câu hỏi 1: viết ở Venice năm 1830, bản viết tay đề Auf einer Gondel (không phải Leipzig
    1845, London 1832).'
  loai: lich-su
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n109
  cau: 'Câu hỏi 1, giải thích: bản viết tay ghi 16/10/1830; in năm 1832–1833, làm bài cuối
    tập Lieder ohne Worte đầu tiên.'
  loai: nam
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n111
  cau: 'Câu hỏi 2, giải thích: nốt trầm rơi vào đầu mỗi nửa ô; hợp âm và nốt giữa trôi theo.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n113
  cau: 'Câu hỏi 4: theo Breitkopf & Härtel, chữ mf duy nhất ở nhịp lấy đà khi chủ đề trở lại,
    cuối ô 34; giải thích: phần còn lại hầu như p, pp; sfz là chỗ nhấn trong nền nhỏ.'
  loai: cau-truc
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n114
  cau: 'Nguồn: Henle HN 1172, mức khó (19,6: 4; 30,6 và 62,5: 5), lời tựa Ullrich Scheideler
    (2012).'
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n115
  cau: 'Nguồn: Britannica, Songs Without Words (Betsy Schwarm): 48 bài, tám tập, hai tập cuối
    in sau khi ông mất, Original Melodies 1832.'
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n116
  cau: 'Nguồn: Mutopia 1679 (Ryan Prince, CC BY 3.0, theo Breitkopf & Härtel 1874–77).'
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n117
  cau: 'Bản nhạc: IMSLP (Lieder ohne Worte Op.19); link tài liệu tham khảo.'
  loai: ten
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n102
  cau: 'Lỗi thường gặp (tám dòng): hai nốt quãng ba bằng nhau; hợp âm to hơn nốt trầm; nốt
    trầm hụt; bàn đạp chồng; sfz như f; staccato bị nuốt; quãng tám Rê ô 36–39 to; chậm dần
    từ đầu coda.'
  loai: khuyen-tap
