  ghi_chu: "Andante sostenuto; nốt trầm mỗi nửa ô mang hòa âm (vd. ô 22–23 Fa♯ dưới hợp âm bảy giảm)."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
