- trang: piano/tac-pham/chopin-valse-si-thu
  id: n1
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Waltzes,_Op.69_(Chopin,_Frédéric)", "https://www.henle.de/media/a3/c6/49/1697725591/0131-1697725590-sync.pdf", "https://www.henle.de/media/d3/d6/59/1690886042/0131-1690886042-sync.pdf"]
  ghi_chu: "IMSLP: sáng tác 1829, in lần đầu 1852 (Wildt, Kraków), sau khi Chopin mất; bảng của Henle HN 131: Op. 69 số 2 viết 1829. Chopin sinh 1/3/1810 (trang Henle HN 131, mục About the Composer) nên năm 1829 ông 19 tuổi."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n4
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Bản Peters/Mutopia của bài này có 144 ô, trio Si trưởng có những câu đi bằng quãng ba (ô 81–92). Chưa đếm được số ô của Valse La thứ (KK IVb/11): trang IMSLP mở được, nhưng PDF IMSLP chặn bot và bản viết tay trên Gallica trả 403. Ý \"tay trái đổi thế nhiều hơn, nhiều trang trí hơn\" là so sánh diễn giải."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n5
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.mid"]
  ghi_chu: "Tay trái mỗi ô gồm nốt trầm ở phách 1 rồi hai hợp âm. Nốt trầm: Si (ô 1), Đô♯ (2), La♯ (3), Rê (13), Mi (14), Fa♯ (15). Hợp âm đổi gần như mỗi ô. Ghi chú: ô 4–9 nốt trầm giữ Si, chỉ hợp âm đổi, nên chữ \"liên tục\" hơi quá."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n6
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Bản .ly của Mutopia không có ký hiệu láy, láy rền hay nốt nhỏ nào. Láy quanh ở ô 5 và các chuỗi nửa cung ở ô 48, 56 đều viết bằng móc đơn."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n9
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Bài ở Si thứ, đoạn ô 33–48 ở Rê trưởng (con anima), trio từ ô 65 đổi hóa biểu sang Si trưởng (mf dolce)."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n10
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Trio lần hai (ô 81–92) là nốt kép tay phải, phần lớn quãng ba, xen quãng sáu và bảy. Vế \"chuẩn bị cho Nocturne Op. 9 số 2\" là gợi ý sư phạm, không có nguồn để kiểm."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n11
  luot_2: dung
  nguon: ["https://www.henle.de/en/Waltzes/HN-131", "https://web.archive.org/web/20261017234225/https://www.britannica.com/biography/Frederic-Chopin"]
  ghi_chu: "Henle: sinh 1/3/1810, học ở Viện âm nhạc Warsaw 1826–29. Britannica: tháng 3 và tháng 10/1830 ông còn biểu diễn ở Warsaw rồi mới rời Ba Lan."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n12
  luot_2: dung
  nguon: ["https://web.archive.org/web/20261017234225/https://www.britannica.com/biography/Frederic-Chopin", "https://www.henle.de/en/Waltzes/HN-131"]
  ghi_chu: "Britannica: sau buổi hòa nhạc tháng 10/1830 ông rời Ba Lan. Henle: năm 1831 ông sang Paris, ở đó đến cuối đời, mất ở Paris ngày 17/10/1849."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n13
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Waltzes,_Op.69_(Chopin,_Frédéric)", "https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/numeracja_pl.pdf"]
  ghi_chu: "IMSLP: in lần đầu năm 1852 ở Kraków (Wildt), trong Deux valses mélancoliques cùng Op. 70 số 2. Bảng số WN: WN 19 Walc h (Op. 69 số 2) in 1852; WN 55 Walc f (Op. 70 số 2) in 1852."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n14
  luot_2: dung
  nguon: ["https://www.henle.de/media/d3/d6/59/1690886042/0131-1690886042-sync.pdf", "https://imslp.org/wiki/Waltzes,_Op.69_(Chopin,_Frédéric)"]
  ghi_chu: "Lời tựa Henle: Julian Fontana, bạn và cộng sự của Chopin, in một loạt tác phẩm di cảo; Henle in cả bản Fontana của Op. 69 và Op. 70. Bảng của Henle ghi năm in Op. 69 là 1855. IMSLP: bản Meissonnier 1855 là lần đầu hai bài Op. 69 in chung."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n16
  luot_2: dung
  nguon: ["https://www.henle.de/en/Waltzes/HN-131"]
  ghi_chu: "Trang Henle HN 131 viết về các valse của Chopin: \"one cannot and should not dance to them!\""
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n17
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Tay trái giữ hình nốt trầm – hợp âm – hợp âm ở phần lớn các ô. Vế \"như lời than thở\" là chữ mô tả."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n18
  luot_2: dung
  nguon: ["https://www.henle.de/en/Waltzes/HN-131", "https://www.henle.de/media/d3/d6/59/1690886042/0131-1690886042-sync.pdf"]
  ghi_chu: "Trang Henle HN 131 liệt kê hai mục \"Waltz b minor op. post. 69,2\" và \"Waltz (Version according to Fontana) b minor op. post. 69,2\". Lời tựa: hai bản được in, bản theo autograph trước, bản Fontana sau."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n19
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511"]
  ghi_chu: "Mutopia 511: Source \"Peters, Herrmann Scholtz, 1900a\", người gõ là Roland Goretzki."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n23
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Câu 1 mở bằng Fa♯ ngân (nhịp lấy đà nối sang ô 1); đỉnh câu là Rê6 ở ô 5–6; các nốt trang trí viết bằng nốt thường."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n24
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Đoạn ô 33–48 ở Rê trưởng, trio từ ô 65 ở Si trưởng."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n25
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Dấu nhắc lại mở ở ô 33 (con anima), đóng ở ô 64 với hai kết (volta 1 và 2 cùng đánh số 64). Chủ đề trở lại ở ô 97, f."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n29
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.mid"]
  ghi_chu: "Nhịp lấy đà Fa♯5 nối sang ô 1, giai điệu rơi xuống La♯4 ở ô 2. Ô 5: Fa♯ – Sol – Mi♯ – Fa♯ rồi Si, Rê. Bài ở Si thứ."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n30
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Ô 17–32 nhắc lại giai điệu ô 1–16. Ô 32: Si4. Fa♯ Si Si♭, nốt Si♭ dẫn vào ô 33 (Rê trưởng)."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n31
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.mid"]
  ghi_chu: "Ô 33: Si♭4. có dấu nhấn ^, con anima, trên hợp âm La bảy (át của Rê). Ô 48: Rê6 – Đô♯ – Đô – Si – La♯ – La, sáu móc đơn nửa cung đi xuống."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n32
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Ô 49: Sol♯ – Sol – Fa♯ – Đô♯ – Rê – Si; các ô 51, 53 tương tự."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n33
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Dấu nhắc lại ô 33–64."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n34
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Trio từ ô 65 (mf dolce, Si trưởng): Rê♯ – Mi – Rê♯ – Đô♯ – Rê♯ – Mi. Nốt lặp nhịp chấm dôi ở ô 69–72 (vd. Rê♯8. Rê♯16 Rê♯4)."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n35
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Ô 81–92 là nốt kép, phần lớn quãng ba. Từ ô 89 có Rê thường (<Si Rê>) nên màu Si thứ. Ô 93–96 dẫn về Fa♯ ngân, vào chủ đề ở ô 97."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n36
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.mid"]
  ghi_chu: "Ô 97: nốt trầm Si1 (MIDI của Mutopia: B1), ghi f."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n37
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Bản .ly: từ ô 97 đến hết là 48 ô liền, không có dấu nhắc lại. Ô 142 ghi \"calando e dimin.\"."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n38
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf"]
  ghi_chu: "Bản .ly: nhịp lấy đà (\\partial 4), 32 ô, phần nhắc lại 31 ô cộng hai kết (cùng số 64), rồi 32 + 48 ô, tổng 144 ô. Bàn đạp chú thích \"Takt 113 - 142\"."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n39
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Bốn câu 4 ô (1–4, 5–8, 9–12, 13–16). Chữ \"poco rit.\" bắt đầu ở ô 14, \"a tempo\" ở cuối, sang ô 16."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n41
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Ô 32 kết bằng Si – Si♭, ô 33 vào Rê trưởng."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n43
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.mid"]
  ghi_chu: "Câu 33–40 (ô 40 có rit.) và câu 41–48 (đổi đường, f ở ô 47, chuỗi nửa cung ô 48). Ô 48: tay trái Fa♯2 – Mi4 – Fa♯3 – La♯2, tức Fa♯ bảy, át bảy của Si thứ."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n44
  luot_2: khong-chac
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/embellishing-tones/", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Si♭4 ở ô 33 có dấu nhấn, nghịch trên hợp âm La bảy, đi bậc xuống La: đúng nghĩa rộng \"nốt nghịch nhấn rồi giải\". Nhưng nốt này không được vào bằng bước nhảy: ô 32 kết bằng chính nốt Si♭4 (Si – Si♭), rồi đánh lại. Open Music Theory định nghĩa appoggiatura là \"approached by leap and left by step\", còn nốt vào bằng nốt đứng yên thì xếp vào suspension. Theo tên gọi của OMT, chữ \"appoggiatura\" ở đây chưa chắc đúng."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n45
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=511", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi-a4.pdf", "https://www.mutopiaproject.org/ftp/ChopinFF/O69/w10-h-moll-cfi/w10-h-moll-cfi.ly"]
  ghi_chu: "Ô 49–64: chủ đề có Sol♯ – Sol (ô 49, 51, 53), chuỗi nửa cung ở ô 55–57; cả ô 33–64 nằm trong dấu nhắc lại."
- trang: piano/tac-pham/chopin-valse-si-thu
  id: n46
