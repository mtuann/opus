  ghi_chu: "IMSLP: Venetianisches Gondellied, MWV U 78, Sol thứ, 46 ô. Mutopia: 46 ô, có mở đầu ô 1–6, cao trào 26–33, chủ đề trở lại 34–39, coda 40–46."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n13
  luot_2: dung
  nguon: ["https://www.henle.de/media/b5/b6/c6/1697725916/1172-1697725915-sync.pdf", "https://www.henle.de/en/Venetian-Gondola-Songs-for-Piano/HN-1172"]
  ghi_chu: "Lời tựa Henle: thư 11/10/1830 gửi từ Venice; tháng 5/1830 ông bắt đầu \"grand tour\". Trang Henle HN 1172: \"In autumn 1830 Mendelssohn Bartholdy visited Venice whilst on a great European tour\". Sinh 3/2/1809 (cùng trang) nên lúc ấy 21 tuổi."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n14
  luot_2: dung
  nguon: ["https://www.henle.de/media/b5/b6/c6/1697725916/1172-1697725915-sync.pdf"]
  ghi_chu: "Lời tựa Henle: Op. 19 số 6 \"is the only one to have been actually written in Venice\"; bản viết tay còn lại đề \"Auf einer Gondel\", ghi ngày 16/10/1830. Ghi chú: phần Comments của chính HN 1172 ghi autograph A1 (Leeds, Kopftitel \"Auf einer Gondel\") đề ngày 1/6/1831; câu nói theo lời tựa nên vẫn đúng."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n15
  luot_2: dung
  nguon: ["https://www.henle.de/media/b5/b6/c6/1697725916/1172-1697725915-sync.pdf"]
  ghi_chu: "Lời tựa Henle: món quà đáp lễ cho Delphine von Schauroth (đã viết một Lied ohne Worte vào album tặng ông), gửi đi München ngày 17/10, thất lạc trên đường bưu điện."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n16
  luot_2: dung
  nguon: ["https://www.henle.de/media/b5/b6/c6/1697725916/1172-1697725915-sync.pdf", "https://www.henle.de/media/7c/d8/ec/1697725749/1172-1697725749-sync.pdf"]
  ghi_chu: "Lời tựa Henle: đầu năm 1832 ông quyết định in một tập \"Lieder ohne Worte\" và đặt bài này làm số cuối; Novello in ở London cùng năm, năm 1833 Schlesinger (Paris) và Simrock (Bonn). Phần Comments: tên bản Novello là \"Original MELODIES for the Piano Forte\"."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n17
  luot_2: dung
  nguon: ["https://web.archive.org/web/20260930052119/https://www.britannica.com/topic/Songs-Without-Words", "https://www.henle.de/media/7d/7b/e0/1690886047/0327-1690886047-sync.pdf"]
  ghi_chu: "Britannica: 48 bài; 36 bài in thành sáu tập lúc sinh thời, hai tập thêm 12 bài in sau khi ông mất (Op. 85 năm 1851, Op. 102 năm 1868, Henle HN 327)."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n18
  luot_2: khong-chac
  nguon: ["https://www.henle.de/media/7d/7b/e0/1690886047/0327-1690886047-sync.pdf"]
  ghi_chu: "Lời tựa Henle HN 327: tập đầu in ở London với tên \"Original Melodies\"; tháng 1/1832 ông gọi là \"Romanzen\", trong thư 15/6/1832 mới dùng \"Lieder ohne Worte\". Nguồn không nói cái tên \"có lẽ do chính Mendelssohn nghĩ ra\". Danh sách không ghi nội dung câu về Fanny Mendelssohn nên không kiểm được."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n19
  luot_2: khong-chac
  nguon: ["https://www.henle.de/media/7d/7b/e0/1690886047/0327-1690886047-sync.pdf", "https://www.henle.de/media/7c/d8/ec/1697725749/1172-1697725749-sync.pdf"]
  ghi_chu: "Henle HN 327: phần lớn các tên phụ \"were not appended by Mendelssohn\", tên không để trong ngoặc thì của ông. Henle HN 1172: Op. 30 số 6 và Op. 62 số 5 có tiêu đề \"Venetianisches Gondellied\" do chính Mendelssohn viết, nên vế sau đúng. Nhưng nguồn không nói các tên ấy \"do nhà xuất bản thêm vào\". Riêng Op. 19 số 6, autograph đề \"Auf einer Gondel\"/\"On a Gondola\", bản Pháp đề \"Barcarolle\"."
- trang: piano/tac-pham/mendelssohn-thuyen-ca
  id: n20
  luot_2: dung
  nguon: ["https://www.henle.de/media/b5/b6/c6/1697725916/1172-1697725915-sync.pdf"]
  ghi_chu: "Lời tựa Henle: Op. 30 số 6 Fa♯ thứ (album leaf tháng 3/1835, in mùa xuân 1835); Op. 62 số 5 La thứ, in tháng 4/1844."
