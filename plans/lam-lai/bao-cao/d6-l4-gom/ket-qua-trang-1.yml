  ghi_chu: "Lenz, Beethoven et ses trois styles (1852): Rellstab ví với con thuyền dưới trăng ở hồ Quatre Cantons (Lucerne); Kurzführer: Lenz 1852, chỗ được trích không tìm thấy ở Rellstab."
- trang: piano/tac-pham/beethoven-anh-trang
  id: n24
  luot_2: sai
  nguon: ["https://archive.org/details/beethovenetsestr00lenz", "https://crumey.co.uk/beethoven_5_why_moonlight_sonata.html"]
  ghi_chu: "Lenz không gắn 'hai mươi năm trước' với lời so sánh của Rellstab: ông viết biệt danh Mondscheins-Sonate 'qui, il y a vingt ans, faisait crier au connaisseur en Allemagne, n'a pas d'autre origine'. Vế 1832 là năm người đời sau suy ra thì đúng."
  cau_dung: "Lenz không ghi năm: ông viết rằng biệt danh Mondscheinsonate, thứ \"hai mươi năm trước\" từng làm giới sành nhạc ở Đức phản đối, bắt nguồn từ lời so sánh của Rellstab; năm 1832 là con số người đời sau suy ra."
- trang: piano/tac-pham/beethoven-anh-trang
