  ghi_chu: "Văn bản trong Berliner allgemeine musikalische Zeitung 1824 (Nr. 32, S. 274 theo Henle); Henle và Beethoven-Haus ghi truyện viết năm 1823. Câu 'khoảng 1823–1824' đúng (in năm 1824)."
