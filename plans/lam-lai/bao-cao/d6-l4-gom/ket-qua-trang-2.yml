  ghi_chu: "Seiffert (Henle): 'Michael Struck verified … that the legend of Schumann's malfunctioning metronome is a musicological myth', và Urtext Henle 'rightly instructs … 100'. Henle Blog 2021: Struck là chuyên gia Schumann, biên tập Neue Brahms-Gesamtausgabe của Henle."
