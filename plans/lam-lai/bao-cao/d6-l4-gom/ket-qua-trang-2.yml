- trang: nghe-nhac/schumann-kinderszenen
  id: n3
  luot_2: dung
  nguon: ["https://www.schumann-portal.de/op-15.html", "https://enc.piano.or.jp/musics/65", "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.henle.de/media/f1/4e/7c/1740992228/0044x.pdf"]
  ghi_chu: "Schumann-Portal: soạn 'wahrscheinlich im Februar und März 1838', 'Zwei der Stücke (Nrn. 6 und 9) entstanden vermutlich bereits im Herbst 1837'; PTNA cũng ghi vậy. Henle (lời tựa, Comments FE1): bản in đầu Breitkopf & Härtel, số bản 6016, 'published in late February 1839'."
- trang: nghe-nhac/schumann-kinderszenen
