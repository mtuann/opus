  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  ghi_chu: "Mutopia ô 2: đôi móc đơn Đô5–Fa5 ở phách 1, rồi Fa5 nốt trắng từ phách 2; tenor Rê4–Đô4–Si♭3 đi xuống trong lúc ấy."
- trang: piano/tac-pham/schumann-traumerei
  id: n35
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Ô 6 tay trái có nốt hoa mỹ Đô♯–La (Mutopia \\grace{ cis16 a' }; Peters ô 6 có dấu ♯): nốt thăng đầu tiên. Đỉnh La5 ở ô 6."
- trang: piano/tac-pham/schumann-traumerei
  id: n36
  luot_2: dung
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  ghi_chu: "Ritard. ở ô 8 (Peters); sau đó là dấu nhắc lại hoặc sang ô 9 '(a tempo)'."
- trang: piano/tac-pham/schumann-traumerei
  id: n38
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Như n28: Mutopia viết bè trong ô 10–12 bắt đầu ở khuông dưới rồi chuyển lên khuông trên."
- trang: piano/tac-pham/schumann-traumerei
  id: n39
