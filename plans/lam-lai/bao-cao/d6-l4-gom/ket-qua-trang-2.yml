- trang: nghe-nhac/schumann-kinderszenen
  id: n5
  luot_2: dung
  nguon: ["https://www.schumann-portal.de/op-15.html", "https://enc.piano.or.jp/musics/65"]
  ghi_chu: "Schumann-Portal: các bài nối với nhau 'im zyklischen Sinne'; PTNA: 13 tiểu phẩm có tiêu đề (曲集・小品集) cho piano độc tấu."
- trang: nghe-nhac/schumann-kinderszenen
  id: n6
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://commons.wikimedia.org/wiki/File:Robert_Schumann_-_scenes_from_childhood,_op._15_-_i._of_foreign_lands_and_peoples.ogg"]
  ghi_chu: "PTNA: tổng thời lượng 17 phút 20 giây. Bản Musopen (13 file trên Wikimedia Commons, ghi ở ban_thu của bản ghi): cộng độ dài qua API Commons được 22,1 phút."
- trang: nghe-nhac/schumann-kinderszenen
  id: n7
  luot_2: dung
  nguon: ["https://www.deutsche-biographie.de/pnd118611666.html", "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf"]
  ghi_chu: "Sinh 8.6.1810 nên tháng 2–3/1838 ông 27 tuổi (Deutsche Biographie). Henle (Herttrich): 'the escalating controversy over his engagement to Clara Wieck'."
- trang: nghe-nhac/schumann-kinderszenen
  id: n8
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html"]
  ghi_chu: "PTNA dịch thư 17/3/1838: Clara từng viết ông 'đôi khi giống như một đứa trẻ', ông viết khoảng 30 bản nhỏ, chọn 12, đặt tên Kinderscenen. Henle: thư ngày 17 tháng 3. Lưu ý: Schumann-Portal ghi thư ngày 19/3/1838."
- trang: nghe-nhac/schumann-kinderszenen
  id: n9
  luot_2: dung
  nguon: ["https://www.schumann-portal.de/op-15.html", "https://enc.piano.or.jp/musics/65"]
  ghi_chu: "Schumann-Portal trích: 'Du wirst Dich daran erfreuen, mußt Dich aber freilich als Virtuosin vergeßen.' PTNA cũng dịch như vậy. 'Virtuosin' dịch 'nghệ sĩ bậc thầy' chấp nhận được."
- trang: nghe-nhac/schumann-kinderszenen
  id: n10
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://enc.piano.or.jp/musics/65"]
  ghi_chu: "Henle: 'Some of the other pieces were possibly later included in the Bunte Blätter op. 99 and the Albumblätter op. 124.' PTNA tương tự; Henle Comments: 'the 13 published numbers'."
- trang: nghe-nhac/schumann-kinderszenen
  id: n11
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html"]
  ghi_chu: "Thư gửi Carl Reinecke 6/10/1848: 'Rückspiegelungen eines Älteren für Ältere' / 'reminiscences by a grown-up for grown-ups' (Henle, Schumann-Portal)."
- trang: nghe-nhac/schumann-kinderszenen
  id: n12
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Album_f%C3%BCr_die_Jugend,_Op.68_(Schumann,_Robert)", "https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf"]
  ghi_chu: "IMSLP Album für die Jugend Op. 68: soạn 1848 (in 1849), tức mười năm sau 1838; Henle nêu op. 68 là album cho người trẻ."
- trang: nghe-nhac/schumann-kinderszenen
  id: n13
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html"]
  ghi_chu: "Henle: bài phê bình của Ludwig Rellstab in trong Iris im Gebiete der Tonkunst ngày 9/8/1839."
- trang: nghe-nhac/schumann-kinderszenen
  id: n14
  luot_2: dung
  nguon: ["https://internet.beethoven.de/pdf-sonderausstellung/Beethovens-Mondschein-Sonate-Kurzfuehrer.pdf", "https://www.beethoven.de/en/media/view/5513209427525632"]
  ghi_chu: "Beethoven-Haus (Kurzführer triển lãm Mondschein-Sonate): biệt danh lần đầu được Wilhelm von Lenz (1852) gán cho Rellstab, người được cho là đã so Adagio với con thuyền dưới trăng trên hồ Vierwaldstätter từ 1832; chỗ trích chưa tìm thấy trong văn Rellstab. 'Có lẽ' là đúng mức."
- trang: nghe-nhac/schumann-kinderszenen
  id: n15
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html"]
  ghi_chu: "Thư gửi Heinrich Dorn 5/9/1839: 'Der meint wohl, ich stelle mir ein schreiendes Kind hin und suche die Töne dann danach. Umgekehrt ist es.'"
- trang: nghe-nhac/schumann-kinderszenen
  id: n16
  luot_2: dung
  nguon: ["https://www.henle.de/media/66/7d/8a/1690886059/0044-1690886059-sync.pdf", "https://www.schumann-portal.de/op-15.html"]
  ghi_chu: "Cùng thư gửi Dorn: 'die Überschriften entstanden aber natürlich später und sind eigentlich nichts als feinere Fingerzeige für Vortrag und Auffassung.'"
- trang: nghe-nhac/schumann-kinderszenen
  id: n19
  luot_2: dung
  nguon: ["https://www.schumann-portal.de/op-15.html", "https://imslp.org/wiki/Kinderszenen,_Op.15_(Schumann,_Robert)"]
  ghi_chu: "Schumann-Portal và IMSLP liệt kê đúng 13 tên theo thứ tự (chính tả hiện đại: Kuriose Geschichte, Am Kamin; bản in đầu viết Curiose, Am Camin)."
- trang: nghe-nhac/schumann-kinderszenen
  id: n20
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Danh sách chỉ ghi 'tên tiếng Việt của 13 bài', không có chữ của các tên dịch, nên lượt 2 không đối chiếu được. Tên gốc và nghĩa phổ biến (Từ những miền đất và con người xa lạ, Chuyện lạ, Bịt mắt bắt dê/đuổi bắt, Em bé nài nỉ, Hạnh phúc trọn vẹn, Sự kiện quan trọng, Mơ màng, Bên lò sưởi, Kỵ sĩ ngựa gỗ, Gần như quá nghiêm trang, Dọa ma, Em bé thiu thiu ngủ, Nhà thơ nói) cần review so trên trang."
- trang: nghe-nhac/schumann-kinderszenen
  id: n21
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No02/SchumannOp15No02.ly", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No05/SchumannOp15No05.ly"]
  ghi_chu: "PTNA từng bài: 1 Sol trưởng, 2 Rê trưởng, 3 Si thứ, 4 Rê trưởng, 6 La trưởng, 7 và 8 Fa trưởng, 9 Đô trưởng, 10 Sol♯ thứ, 11 Sol trưởng, 12 Mi thứ, 13 Sol trưởng. Số 5: hóa biểu 2 thăng, kết ở Rê (Peters; Mutopia \\key d \\major); PTNA ghi 'イ長調' cho số 5 vì mở đầu ở giọng át, nhưng giọng của bài là Rê trưởng. Số 11: hóa biểu 1 thăng, mở trên hòa âm Mi thứ, kết Sol trưởng (Peters), nên 'Mi thứ / Sol trưởng' chấp nhận được."
- trang: nghe-nhac/schumann-kinderszenen
  id: n22
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No01/SchumannOp15No01.ly"]
  ghi_chu: "PTNA: chủ đề ở bè trên tay phải xuất hiện lặp lại, phần giữa chuyển xuống tay trái. Mutopia số 1: môtip B–G–F♯–E–D lặp ở ô 1, 3, 5, 15…"
- trang: nghe-nhac/schumann-kinderszenen
  id: n23
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No02/SchumannOp15No02.ly"]
  ghi_chu: "PTNA: Rê trưởng 3/4, nhịp điệu nảy (nốt hoa mỹ, dấu lặng, chấm dôi), bất chợt xen một giai điệu legato mềm mại. Mutopia: \\time 3/4."
- trang: nghe-nhac/schumann-kinderszenen
  id: n24
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: trẻ con chạy đuổi; Peters: M.M. ♩ = 138, nốt móc kép staccato, sfp."
- trang: nghe-nhac/schumann-kinderszenen
  id: n25
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: liên hệ với chủ đề số 1, nài nỉ nhiều lần, kết bằng hợp âm bảy át của Rê trưởng. Peters: hợp âm cuối có La ở bè trầm, Sol ở bè trên, dấu ngân."
- trang: nghe-nhac/schumann-kinderszenen
  id: n26
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65"]
  ghi_chu: "PTNA: số 4 dừng ở át, số 5 giải quyết; 'chủ đề tay phải được tay trái mô phỏng'. 'Câu trả lời' là cách hiểu theo nghĩa ấy."
- trang: nghe-nhac/schumann-kinderszenen
  id: n27
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: toàn bài đi bằng hợp âm, âm lượng đầy, mạnh mẽ (La trưởng 3/4). 'Như một buổi lễ' là hình ảnh của trang."
- trang: nghe-nhac/schumann-kinderszenen
  id: n28
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  ghi_chu: "PTNA: giai điệu bốn ô bốn bè lặp tám lần với hòa âm đổi. Mutopia: mỗi câu đi lên từ Đô rồi đi xuống."
- trang: nghe-nhac/schumann-kinderszenen
  id: n29
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: số 8 cùng giọng Fa trưởng, mở bằng quãng bốn đi lên Đô–Fa như số 7. Peters: nhịp lấy đà Đô rồi Fa."
- trang: nghe-nhac/schumann-kinderszenen
  id: n30
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: Đô trưởng 3/4, phách 1 lặng, đảo phách, trọng âm ở phách 3. Peters: dấu > ở phách 3."
- trang: nghe-nhac/schumann-kinderszenen
  id: n31
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: Sol♯ thứ 2/8, đảo phách. Peters: giai điệu vào sau phách; nhiều dấu ngân và ritard. tạo vẻ ngập ngừng."
- trang: nghe-nhac/schumann-kinderszenen
  id: n32
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: chủ đề chậm hiền hòa xen với đoạn nhanh, như đùa nghịch. Peters: 'Schneller', pp, staccato, sf."
- trang: nghe-nhac/schumann-kinderszenen
  id: n33
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: phần B sang Mi trưởng (cùng chủ âm), kết mà không giải quyết về hợp âm chủ. Peters: hợp âm cuối La–Đô–Mi."
- trang: nghe-nhac/schumann-kinderszenen
  id: n34
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: Sol trưởng; phần B có đoạn recitativo. Peters: hợp âm bốn bè, ở giữa có nốt nhanh tự do, nhiều dấu ngân."
- trang: nghe-nhac/schumann-kinderszenen
  id: n35
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Theo giọng ở n21: mở và khép ở Sol; các bản 2–6, 12 ở Rê, Si thứ, La, Mi thứ; số 7–9 Fa, Fa, Đô; số 10 Sol♯ thứ (5 thăng), cách Sol trưởng 4 bậc trên vòng quãng năm, xa nhất trong tập (Fa trưởng cách 2 bậc)."
- trang: nghe-nhac/schumann-kinderszenen
  id: n36
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No01/SchumannOp15No01.ly", "https://enc.piano.or.jp/musics/65"]
  ghi_chu: "Mutopia số 1, ô 1: B4–G5 (quãng sáu thứ đi lên), rồi F♯5, E5, D5: năm nốt, bốn nốt đi xuống tính từ G. PTNA: số 4 có liên hệ rõ với chủ đề số 1. Vế 'vang lại ở nhiều bản sau' khớp n37 nhưng chưa có nguồn mở được nêu đủ các bản."
- trang: nghe-nhac/schumann-kinderszenen
  id: n37
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Sách Réti, The Thematic Process in Music (1951) có trên Internet Archive (thematicprocessi0000reti) nhưng chỉ mượn được, không đọc được chữ. Không có nguồn bậc 2 nào khác mở được xác nhận Réti coi cả tập gần như một bộ biến tấu."
- trang: nghe-nhac/schumann-kinderszenen
  id: n38
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "PTNA: số 5 giải quyết chỗ số 4 dừng ở át; số 8 mở Đô–Fa như số 7; số 12 không về chủ. Peters: số 13 Sol trưởng, kết ở Sol."
- trang: nghe-nhac/schumann-kinderszenen
  id: n39
  luot_2: dung
  nguon: ["https://www.schumann-portal.de/op-15.html", "https://imslp.org/wiki/Kinderszenen,_Op.15_(Schumann,_Robert)"]
  ghi_chu: "Bảy số trước, sáu số sau trong 13 bài (Schumann-Portal, IMSLP)."
- trang: nghe-nhac/schumann-kinderszenen
  id: n43
  luot_2: dung
  nguon: ["https://enc.piano.or.jp/musics/65", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Các ý khớp n21–n34. Số 12: PTNA mô tả cùng một nhịp điệu luân phiên hai tay như nôi đưa, phần B Mi trưởng, không về chủ. Số 13: Peters ghi pp, ritardando ở cuối, kết Sol trưởng. 'Thời gian như chậm lại' ở số 7 là cảm nhận của trang."
- trang: nghe-nhac/schumann-kinderszenen
  id: n45
  luot_2: dung
  nguon: ["https://agreenmanreview.com/music-2/various-composers-horowitz-live-and-unedited-the-historic-1965-carnegie-hall-return-concert-vladimir-horowitz-piano/", "https://www.deutschegrammophon.com/en/catalogue/products/horowitz-in-moscow-10493"]
  ghi_chu: "Green Man Review (CD Sony 'Live and Unedited: The Historic 1965 Carnegie Hall Return Concert'): buổi diễn 9/5/1965, có Träumerei, 'one of Horowitz's most common encores'. DG 'Horowitz in Moscow': 'Live at Great Hall, Moscow Conservatory, 1986', có Träumerei. Lưu ý: trên đĩa DG, Träumerei đứng trước bài Moszkowski cuối cùng, nên 'cuối buổi' chỉ chắc cho buổi 1965."
- trang: nghe-nhac/schumann-kinderszenen
  id: n46
  luot_2: dung
  nguon: ["https://www.deutschegrammophon.com/en/catalogue/products/schumann-kinderszenen-kreisleriana-argerich-12311", "https://www.henle.de/media/f1/4e/7c/1740992228/0044x.pdf"]
  ghi_chu: "Trang DG 'SCHUMANN Kinderszenen · Kreisleriana / Argerich', có 'VII. Träumerei'. Henle Comments: số máy đếm nhịp có từ bản in lại đã sửa của ấn bản đầu (FE2, tháng 3/1839); Peters in ♩ = 100 cho Träumerei."
- trang: nghe-nhac/schumann-kinderszenen
  id: n47
  luot_2: dung
  nguon: ["https://archive.org/details/schumann-kinderszenen-1935-cortot"]
  ghi_chu: "Internet Archive: 'Robert Schumann KINDERSZENEN - Alfred Cortot (1935)'; cũng có các đĩa 78 vòng Cortot thu Kinderscenen."
- trang: nghe-nhac/schumann-kinderszenen
  id: n50
  luot_2: dung
  nguon: ["https://www.henle.de/Scenes-from-Childhood-op.-15/HN-44"]
  ghi_chu: "Trang Henle HN 44: mức khó Henle 4–5 (trung bình) cho cả 13 bài; ABRSM Piano Grade 5 cho số 1, Grade 7 cho số 12. Vế 'khó ở phân bè, tiếng đàn, rubato' là nhận xét; PTNA cũng nói không có hình nốt phức tạp mà đòi khả năng biểu cảm rất cao."
- trang: nghe-nhac/schumann-kinderszenen
