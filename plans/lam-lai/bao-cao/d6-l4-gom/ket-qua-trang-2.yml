  ghi_chu: "Mutopia ghi source = IMSLP và có \\mp, \\p, \\f, \\sf, dấu crescendo; Henle: nguồn không có ký hiệu sắc thái nào, nên các chữ ấy là của người biên tập; Henle Urtext không thêm sắc thái."
