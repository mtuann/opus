  ghi_chu: "Mutopia: nhịp lấy đà Đô4 (Đô giữa), rồi Fa4–Mi–Fa–La–Đô5–Fa5 (rải hợp âm Fa trưởng); Fa5 giữ từ phách 2 ô 2; trong lúc ấy bè tenor (bè trầm của tay trái) đi Rê4–Đô4–Si♭3–La3."
- trang: piano/tac-pham/schumann-traumerei
  id: n26
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Ô 4 nhịp lấy đà Đô; ô 5–6 cùng cử chỉ lên tới La5 (ô 6); ritard. ghi ở ô 8, cuối câu (Peters: chữ ritard. đặt trên ô 8; Mutopia: ở phách 1 ô 8)."
- trang: piano/tac-pham/schumann-traumerei
  id: n27
  luot_2: dung
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Peters: dấu nhắc lại bao ô 1–8."
- trang: piano/tac-pham/schumann-traumerei
  id: n28
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Ô 10 có Mi♭, ô 10–11 có Fa♯ ở tay trái, câu kết ở Sol (ô 12): hướng về Sol thứ. Mutopia: bè trong (voice 'oboe') chuyển khuông dưới–trên ở ô 10–12."
- trang: piano/tac-pham/schumann-traumerei
  id: n29
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Ô 13–14 đỉnh Si♭5 trên bè trầm Si♭ (Si♭ trưởng), ô 14–16 có Đô♯, về Rê (Rê thứ); ritard. ở ô 16 (Peters)."
- trang: piano/tac-pham/schumann-traumerei
  id: n30
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Ô 17–20 giống hệt ô 1–4 (Mutopia, Peters). 'Mềm hơn, như một kỷ niệm' là gợi ý diễn tấu, bản nhạc không ghi sắc thái mới."
- trang: piano/tac-pham/schumann-traumerei
  id: n31
  luot_2: sai
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  cau_dung: "Câu 6 và fermata (ô 21–24): giai điệu lên La; hợp âm đỉnh ở ô 22 mang dấu ngân (fermata), dấu ngân duy nhất trong bài trước hợp âm cuối (hợp âm cuối cũng có dấu ngân)."
  ghi_chu: "Peters và Mutopia: ô 22, giai điệu lên La5, hợp âm đỉnh có dấu ngân. Nhưng hợp âm Fa trưởng cuối bài (ô 24) cũng có dấu ngân, ở cả hai khuông (Peters, Mutopia). Chưa xem bản nhạc Henle (Comments không nhắc dấu ngân cuối)."
- trang: piano/tac-pham/schumann-traumerei
  id: n32
  luot_2: dung
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  ghi_chu: "Peters: 'ritardando - - -' từ ô 22 tới cuối; hợp âm cuối Fa trưởng."
