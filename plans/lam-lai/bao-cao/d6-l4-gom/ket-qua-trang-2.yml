  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Như n29; Peters: 'ritard.' ở ô 16, '(a tempo)' ở ô 17."
- trang: piano/tac-pham/schumann-traumerei
  id: n40
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Ô 17–20 giống ô 1–4."
- trang: piano/tac-pham/schumann-traumerei
  id: n42
  luot_2: sai
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  cau_dung: "A' 21–24: câu 6 lên La, hợp âm đỉnh có dấu ngân (fermata), rồi ritardando về kết; hợp âm cuối cũng có dấu ngân."
  ghi_chu: "Đúng: câu 6 lên La, dấu ngân ở hợp âm đỉnh ô 22, rồi ritardando về kết. Sai ở 'duy nhất': hợp âm cuối ô 24 cũng có dấu ngân (Peters, Mutopia)."
- trang: piano/tac-pham/schumann-traumerei
  id: n44
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://enc.piano.or.jp/musics/65"]
  ghi_chu: "Các nhịp lấy đà ô 4, 8, 12, 16, 20 (và đầu bài) đều mở bằng bước lên quãng bốn rồi rải hợp âm đi lên (Mutopia; ô 12: Fa→Si♭). PTNA: giai điệu bốn ô lặp với hòa âm đổi. Sáu câu khác nhau, tính cả nhắc lại thì tám lần."
- trang: piano/tac-pham/schumann-traumerei
  id: n46
  luot_2: sai
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  cau_dung: "Chỗ khó, nốt dài của giai điệu (Fa cao ở ô 2, La cao ở ô 6…): nốt dài tắt dần trong khi các bè khác tiếp tục."
  ghi_chu: "Ô 2: Fa5 nốt trắng ngân trong khi bè trong và tenor đi tiếp. Nhưng nốt dài của giai điệu ở ô 6 là La5 (nốt đen chấm dôi), không phải Fa."
- trang: piano/tac-pham/schumann-traumerei
  id: n48
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Mutopia: bè tenor và bè trầm đều ở khuông dưới, cùng tay trái (ô 2–4: bè trầm Fa giữ, tenor Rê–Đô–Si♭–La…). Vế 'tập riêng' là lời khuyên."
- trang: piano/tac-pham/schumann-traumerei
  id: n51
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly", "https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf"]
  ghi_chu: "Mutopia: tay trái có nốt hoa mỹ ở ô 2 (Si♭–Fa) và ô 6 (Đô♯–La), lặp ở ô 18, 22; Peters cũng có. Chơi trước phách là cách diễn tấu thường dùng; bản nhạc ghi nốt nhỏ không gạch."
- trang: piano/tac-pham/schumann-traumerei
  id: n52
  luot_2: dung
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.henle.de/media/54/e7/73/1687438503/interview_struck.pdf"]
  ghi_chu: "Peters: ritard. ở ô 8, ô 16 và ritardando từ ô 22; Struck cũng nhắc các ritardando Schumann ghi."
- trang: piano/tac-pham/schumann-traumerei
  id: n62
  luot_2: sai
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  cau_dung: "Schumann chỉ ghi ritard. ở ba chỗ, nơi các đoạn nối vào nhau; trong bài chỉ có một fermata ở ô 22, ngay trước câu kết, ngoài dấu ngân ở hợp âm cuối."
  ghi_chu: "Ritard. đúng ba chỗ (ô 8, 16, 22–24). Nhưng không phải chỉ một fermata: ngoài dấu ngân ở ô 22 (trước câu kết), hợp âm cuối cũng có dấu ngân (Peters, Mutopia)."
- trang: piano/tac-pham/schumann-traumerei
  id: n65
  luot_2: dung
  nguon: ["https://archive.org/download/robschumannswerk01schu/robschumannswerk01schu.pdf", "https://www.mutopiaproject.org/ftp/SchumannR/O15/SchumannOp15No07/SchumannOp15No07.ly"]
  ghi_chu: "Peters: p ở đầu, p ở hợp âm cuối, không có f; Mutopia: \\p ở đầu, vài dấu crescendo nhỏ."
- trang: piano/tac-pham/schumann-traumerei
  id: n67
  luot_2: dung
