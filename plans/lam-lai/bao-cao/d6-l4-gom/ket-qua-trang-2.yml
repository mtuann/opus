  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-3/K545-3.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-3/K545-3-a4.pdf"]
  ghi_chu: "Mutopia: Rondo 2/4, Đô trưởng; tay trái trả nhịp điệu của tay phải trễ một phách ở chủ đề; đoạn xen thứ nhất có fa thăng, tay trái Alberti c g e g, b g d g (Sol trưởng); đoạn giữa La thứ (sol thăng, tay trái e e' gis e', a c e c)."
- trang: piano/tac-pham/mozart-k545
  id: n42
  luot_2: sai
  nguon: ["https://musicbrainz.org/ws/2/recording/40dbe244-e167-44fb-a8e6-ca0bc649b50c?fmt=json&inc=artists", "https://musicbrainz.org/ws/2/recording/bf2e6b88-f221-43f1-b727-f67605eb5f39?fmt=json&inc=artists", "https://musicbrainz.org/ws/2/recording/f524aab7-9d81-457f-9efb-3dfdf3e7e383?fmt=json&inc=artists", "https://musicbrainz.org/ws/2/recording/f7d1c3cf-40f8-41ca-9601-6629a08c505e?fmt=json&inc=artists"]
  cau_dung: "Chương 3 ngắn, chưa tới 2 phút (các bản thu thường 1 phút 35 giây đến 2 phút)."
  ghi_chu: "MusicBrainz: Uchida 2:00, Barenboim 1:36, Schiff 1:47, Pires 1:39 (thêm Eschenbach 1:57 trong kết quả tìm). Không bản nào khoảng 1:30; thường 1:40–2:00. Sai nhẹ: nói \"khoảng 1,5 phút\" thấp hơn thực tế."
- trang: piano/tac-pham/mozart-k545
  id: n43
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-3/K545-3.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-3/K545-3-a4.pdf"]
  ghi_chu: "Henle: Rondo \"introduces new figures and noticeably raises the level of difficulty\". Mutopia: tay trái có nhiều đoạn móc kép ngang tay phải (đoạn giữa, đoạn kết). Tốc độ ghi Allegretto (grazioso trong bản Mutopia), nhanh vừa; chữ \"nhanh\" hơi mạnh nhưng chấp nhận được."
- trang: piano/tac-pham/mozart-k545
  id: n45
  luot_2: dung
  nguon: ["https://www.pianistmagazine.com/how-to-improve-your-alberti-bass-playing", "https://melaniespanswick.com/2023/10/15/the-beauty-of-the-rotation-technique-rami-bar-niv/"]
  ghi_chu: "Pianist Magazine: lỗi hay gặp khi chơi Alberti là ngón cái cứng và cổ tay không linh hoạt; giữ cổ tay lỏng, có thể xoay cổ tay một chút khi chơi nhanh. Rami Bar-Niv: xoay cẳng tay đặc biệt có ích cho hình kiểu Alberti. \"Không nhấc ngón cao\" hợp với lời khuyên giữ ngón gần phím."
- trang: piano/tac-pham/mozart-k545
  id: n47
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf", "https://theinstrumentalist.com/january-2010-flute-talk/mozart-trills/"]
  ghi_chu: "Mutopia: ô 25 láy rền dài trên La, ô 70 trên Rê, cả hai có hai nốt kết viết sẵn (Sol La; Đô Rê). The Instrumentalist: láy rền ở kết câu thời Mozart bắt đầu từ nốt trên và kết bằng nachschlag. Lời khuyên viết ra số nốt là cách tập."
- trang: piano/tac-pham/mozart-k545
  id: n54
  luot_2: dung
  nguon: ["https://www.pianistmagazine.com/how-to-improve-your-alberti-bass-playing"]
  ghi_chu: "Pianist Magazine: tập rất chậm trước, tăng tốc từng chút, giữ cổ tay lỏng. Hai con số ♩ = 72 và 116 là đề xuất của trang, hợp lý cho Allegro (classical-music.com ghi Allegro thường 120–168), không có nguồn riêng."
- trang: piano/tac-pham/mozart-k545
  id: n60
  luot_2: khong-chac
  nguon: ["https://www.dolmetsch.com/defsa5.htm", "https://www.classical-music.com/features/musical-terms/what-does-allegro-mean-in-music"]
  ghi_chu: "Vế đầu đúng: Dolmetsch: allegro (từ alacer, \"lively\"), nhanh, chậm hơn presto, ban đầu chỉ tính chất \"bright, cheerful\"; classical-music.com: \"lively, cheerful\", tương đối nhanh. Vế \"thời Mozart là nhanh vừa, không phải chạy đua\" chưa tìm được nguồn mở được xác nhận (sách Breidenstein Mozart's Tempo-System ở OAPEN lỗi 500, Britannica bị chặn). Nên dẫn nguồn hay viết mềm hơn."
- trang: piano/tac-pham/mozart-k545
  id: n65
  luot_2: dung
  nguon: ["https://theinstrumentalist.com/january-2010-flute-talk/mozart-trills/"]
  ghi_chu: "The Instrumentalist (2010, về láy rền Mozart): \"All cadential trills should start on the upper note … This was appropriate … in Mozart's day\". Chữ \"thường\" giữ được điều này (có ngoại lệ, như láy rền sau nốt dựa)."
- trang: piano/tac-pham/mozart-k545
  id: n66
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: láy rền dài ô 25 (La, kết Sol La) và ô 70 (Rê, kết Đô Rê) có hai nốt kết viết bằng nốt nhỏ (afterGrace)."
- trang: piano/tac-pham/mozart-k545
  id: n67
  luot_2: dung
  nguon: ["https://www.dolmetsch.com/defsa1.htm"]
  ghi_chu: "Dolmetsch: acciaccatura ('crushed'), nốt hoa mỹ viết có gạch chéo qua đuôi nốt; Geminiani: đánh cùng lúc rồi nhả ngay. Tức ngắn, sát phách."
- trang: piano/tac-pham/mozart-k545
  id: n68
  luot_2: dung
