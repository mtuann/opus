  ghi_chu: "Lời tựa Henle (Herttrich 2012): Mozart ghi vào Verzeichnüss ngày 26/6/1788 \"Eine kleine klavier Sonate für anfänger\" (a little piano sonata for beginners)."
- trang: piano/tac-pham/mozart-k545
  id: n4
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Đếm ô trên file .ly của Mutopia (bản Alejandro Sierra 2013, chép từ một ấn bản trên IMSLP), đếm theo từng biến tay trái và tay phải, đối chiếu số ô in đầu dòng trong PDF (15, 31, 43, 59): trình bày 1–28 (có dấu nhắc lại), phát triển 29–41, tái hiện 42–73. Ba phần rõ: trình bày (chủ đề 1 Đô trưởng, chủ đề 2 Sol trưởng), phát triển ngắn 13 ô, tái hiện từ ô 42. Không mở được Open Music Theory (403) nên không đối chiếu định nghĩa ở link của trang."
- trang: piano/tac-pham/mozart-k545
  id: n5
  luot_2: dung
  nguon: ["https://blog.oup.com/2016/05/affekt-modern-piano-alberti-bass/"]
  ghi_chu: "OUPblog (Donna Gunn, 2016) dẫn Harvard Dictionary of Music: Alberti bass là hình đệm, các nốt của hợp âm ba nốt chơi lần lượt theo thứ tự \"lowest, highest, middle, highest\", ví dụ chính là Mozart K. 545."
- trang: piano/tac-pham/mozart-k545
  id: n6
  luot_2: dung
  nguon: ["https://blog.oup.com/2016/05/affekt-modern-piano-alberti-bass/", "https://www.pianistmagazine.com/how-to-improve-your-alberti-bass-playing"]
  ghi_chu: "Harvard Dictionary (qua OUPblog): \"found frequently in the left hand of the 18th-century keyboard\"; Pianist Magazine: Alberti bass \"crop up so frequently in much of the music we play\", tập tốt là kỹ năng rất có ích. Vế dùng lại được ở bài khác là hệ quả hợp lý."
- trang: piano/tac-pham/mozart-k545
  id: n7
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Bản Mutopia: chuỗi gam móc kép ô 5–10 (đoạn chuyển) và ô 35–41 (phát triển: r16 d e f g a b cis d…, ô 41 gam đi xuống rồi lên)."
- trang: piano/tac-pham/mozart-k545
  id: n11
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf"]
  ghi_chu: "Henle: \"The summer of 1788 was a highly productive period for Mozart\"; từ tháng 6 đến tháng 8 viết hai sonata, hai trio KV 542, 548 và ba giao hưởng cuối."
- trang: piano/tac-pham/mozart-k545
  id: n12
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006200368_Innenansicht.pdf"]
  ghi_chu: "Lời tựa NMA (Robbins Landon, Bärenreiter TP 39): KV 543 ghi trong Verzeichnüß \"den 26: detto [= Juny]\" 1788; ba tác phẩm kế tiếp KV 544–546 cũng ghi cùng ngày 26/6 (\"detto\"); Henle cho K. 545 ngày 26/6/1788."
- trang: piano/tac-pham/mozart-k545
  id: n13
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006200368_Innenansicht.pdf"]
  ghi_chu: "Cùng lời tựa: KV 550 ghi \"den 25:t [Julius]\", KV 551 \"den 10:t August\" 1788, tức khoảng 4 và 6 tuần sau 26/6."
- trang: piano/tac-pham/mozart-k545
  id: n14
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf"]
  ghi_chu: "Henle: \"practically nothing is known about the origins of the piece\". Vế \"kể cả người mới học là ai\" là hệ quả: lời tựa không nêu người nhận, chỉ đoán Mozart muốn có tác phẩm mẫu dễ cho nhạc tại gia."
- trang: piano/tac-pham/mozart-k545
  id: n15
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf"]
  ghi_chu: "Henle: ngày 2/8 Mozart gửi chị \"my latest piano pieces with this post coach\", \"which certainly also contained K. 545\"; là thư cuối Mozart gửi chị."
- trang: piano/tac-pham/mozart-k545
  id: n16
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf"]
  ghi_chu: "Henle: \"the autograph of the Sonata is lost\"; ấn bản dựa vào ấn bản đầu Vienna và bản in lại của André."
- trang: piano/tac-pham/mozart-k545
  id: n17
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf"]
  ghi_chu: "Henle: ấn bản đầu 1805, Bureau d'Arts et d'Industrie (Vienna), tên Sonate facile; Mozart ghi \"kleine klavier Sonate für anfänger\", nên chữ \"facile\" là của ấn bản."
- trang: piano/tac-pham/mozart-k545
  id: n18
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf"]
  ghi_chu: "Henle: trái với các sonata piano khác (thường ghi sắc thái phong phú), \"he made not one single dynamic indication in the C-major Sonata K. 545\"; nguồn là ấn bản đầu và bản André."
- trang: piano/tac-pham/mozart-k545
  id: n19
  luot_2: dung
  nguon: ["https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly"]
  ghi_chu: "Henle: không có sắc thái nào, Mozart chờ thầy dạy chỉ cho người học; Henle không thêm sắc thái. Bản phổ thông như Mutopia (chép từ IMSLP) có mp, p, f, sf: của người biên tập."
- trang: piano/tac-pham/mozart-k545
  id: n20
  luot_2: dung
  nguon: ["https://mozarteum.at/en/museums/mozarts-birthplace"]
  ghi_chu: "Mozarteum: cây fortepiano không ký tên, quy cho Anton Walter (1752–1826), làm khoảng 1782, Mozart mua trước 1785; sau khi Mozart mất đàn ở lại gia đình, Carl Thomas tặng Mozarteum năm 1856."
- trang: piano/tac-pham/mozart-k545
  id: n21
  luot_2: dung
  nguon: ["https://tafelmusik.org/explore-baroque/articles/mozarts-piano-fortepiano/"]
  ghi_chu: "Tafelmusik: đàn theo mẫu Anton Walter (Wolf 1997) \"keyboard range of just over five octaves (from FF to g''')\", \"Knee levers are used to raise the dampers\". FF = Fa1, g''' = Sol6 theo ký hiệu khoa học. (Có tranh luận cần gạt đầu gối trên chính đàn của Mozart có từ thời ông hay thêm sau; câu nói về đàn kiểu Walter nên vẫn đúng.)"
- trang: piano/tac-pham/mozart-k545
  id: n23
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 42 chủ đề mở đầu trở lại ở Fa trưởng (chuyển giọng của 4 ô đầu sang Fa, có si giáng)."
- trang: piano/tac-pham/mozart-k545
  id: n26
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 1–4 tay phải c2 e4 g | b4. c16 d c4 | a2 g4 c | g f8(trill) e16 f e4; tay trái Alberti c g e g. Láy rền ở ô 4."
- trang: piano/tac-pham/mozart-k545
  id: n27
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 5–10 tay phải gam móc kép (mỗi ô lên rồi xuống, chuỗi hạ dần từ La, Sol, Fa, Mi; ô 9–10 trên Rê trưởng), tay trái đánh hợp âm; ô 11–12 kết trên hợp âm Sol trưởng (d4 <b d g> g). Chữ \"đi xuống\" đúng theo nghĩa chuỗi hạ dần; từng gam đi lên rồi xuống."
- trang: piano/tac-pham/mozart-k545
  id: n28
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 13 tay phải nghỉ, tay trái móc kép cis d cis d / c d c d (lắc qua lại); ô 14 giai điệu mới, láy rền ở ô 15 (và ô 17); ô 25 láy rền dài trên La (afterGrace, hai nốt kết Sol La) trước ô 26. Giọng Sol trưởng (fa thăng)."
- trang: piano/tac-pham/mozart-k545
  id: n29
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 26–27 hợp âm rải móc kép (g d g b d b g b c a fis a), ô 28 ba hợp âm g4 <d b> <b g> trên Sol trưởng; cả trình bày trong dấu nhắc lại (repeat volta 2)."
- trang: piano/tac-pham/mozart-k545
  id: n30
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 29–30 hình rải của kết trình bày ở Sol thứ (si giáng); ô 31–34 Rê thứ; ô 35–40 chuỗi gam lên (Rê, rồi La thứ, sol thăng), xuống; ô 41 gam về hợp âm Đô bảy chuẩn bị Fa."
- trang: piano/tac-pham/mozart-k545
  id: n31
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 42–45 chủ đề 1 ở Fa trưởng (hạ át của Đô); đoạn chuyển ô 46–57 chuyển sang Đô, kết trên hợp âm Sol (át của Đô) ở ô 57."
- trang: piano/tac-pham/mozart-k545
  id: n32
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Mutopia: ô 58 chủ đề 2 ở Đô trưởng (tay trái lắc qua lại như ô 13), ô 70 láy rền dài trên Rê có hai nốt kết, ô 71–73 kết chương; nửa sau (phát triển và tái hiện) nằm trong dấu nhắc lại thứ hai."
- trang: piano/tac-pham/mozart-k545
  id: n33
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2-a4.pdf"]
  ghi_chu: "Mutopia chương 2 (Andante, Sol trưởng, 3/4): giai điệu trên Alberti g d b d; ô 33–48 Sol thứ (si giáng, mi giáng); ô 49–63 chủ đề trở lại; ô 64–74 coda."
- trang: piano/tac-pham/mozart-k545
  id: n34
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-3/K545-3.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-3/K545-3-a4.pdf"]
  ghi_chu: "Mutopia chương 3 (Rondo, Đô trưởng, 2/4): ở chủ đề, tay trái chơi lại nhịp điệu hai nốt kép lặp của tay phải trễ một phách (tay phải <e g> <e g> | <c e> r <d f> <d f>…, tay trái r4 | <a c> <a c> <f a> r…); đoạn xen có fa thăng (Sol trưởng), đoạn giữa có sol thăng (La thứ), chủ đề trở lại sau dấu lặng có fermata, rồi coda. \"Như trò đuổi bắt\" là hình ảnh, hợp với chỗ tay trái theo sau tay phải."
- trang: piano/tac-pham/mozart-k545
  id: n35
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Đếm ô trên file .ly của Mutopia (bản Alejandro Sierra 2013, chép từ một ấn bản trên IMSLP), đếm theo từng biến tay trái và tay phải, đối chiếu số ô in đầu dòng trong PDF (15, 31, 43, 59): trình bày 1–28 (có dấu nhắc lại), phát triển 29–41, tái hiện 42–73. Số 73 khớp. Không đếm trực tiếp trên bản Urtext (mẫu Henle là ảnh, không đọc được); bản Mutopia chép từ IMSLP cho cùng số ô. Vế \"các sách có thể lệch một ô ở ranh giới\" là lời rào, không cần nguồn."
- trang: piano/tac-pham/mozart-k545
  id: n36
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-1/K545-1-a4.pdf"]
  ghi_chu: "Đếm ô trên file .ly của Mutopia (bản Alejandro Sierra 2013, chép từ một ấn bản trên IMSLP), đếm theo từng biến tay trái và tay phải, đối chiếu số ô in đầu dòng trong PDF (15, 31, 43, 59): trình bày 1–28 (có dấu nhắc lại), phát triển 29–41, tái hiện 42–73. Bảy hàng 1–4, 5–12, 13–25, 26–28, 29–41, 42–57, 58–73 khớp cách đếm này (tái hiện: 42–45 chủ đề, 46–57 đoạn chuyển, 58 chủ đề 2)."
- trang: piano/tac-pham/mozart-k545
  id: n37
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2-a4.pdf", "https://www.henle.de/media/76/b6/93/1697725878/0164-1697725878-sync.pdf"]
  ghi_chu: "Mutopia: tay trái gần như toàn chương là hình Alberti móc kép (g d b d…), trừ vài nhịp kết và coda. Henle: tay trái nhất là ở hai chương đầu \"unfolds broadly in Alberti figures\"."
- trang: piano/tac-pham/mozart-k545
  id: n38
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2-a4.pdf"]
  ghi_chu: "Đếm trên Mutopia: phần đầu ô 1–16, trong dấu nhắc lại; ô 8 dừng ở nửa cung trên Rê (tay trái <d g> fis), ô 9 bắt đầu lại chủ đề, ô 16 kết ở Sol."
- trang: piano/tac-pham/mozart-k545
  id: n39
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2.ly", "https://www.mutopiaproject.org/ftp/MozartWA/KV545/K545-2/K545-2-a4.pdf"]
  ghi_chu: "Mutopia: phần thứ hai (ô 17–32, có nhắc lại) mở trên Rê trưởng (tay trái d a fis a), quay về Sol; ô 33–48 Sol thứ, ô 37–38 Si giáng trưởng (tay trái bes f d f), ô 41–42 Đô thứ (la giáng, si bình); ô 49 chủ đề trở về, ô 64–74 coda."
