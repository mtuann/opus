- trang: nghe-nhac/beethoven-moonlight
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata \"Ánh trăng\", chương 1".'
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n2
  cau: 'Nhà soạn nhạc: Ludwig van Beethoven (1770–1827).'
  loai: nam
- trang: nghe-nhac/beethoven-moonlight
  id: n3
  cau: 'Tên đầy đủ: Sonata piano số 14 cung Đô♯ thứ, Op. 27 số 2, Sonata quasi una fantasia.'
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n4
  cau: Sáng tác năm 1801, xuất bản năm 1802.
  loai: nam
- trang: nghe-nhac/beethoven-moonlight
  id: n5
  cau: Đề tặng nữ bá tước Giulietta Guicciardi.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n6
  cau: 'Thời kỳ: Cổ điển.'
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n7
  cau: 'Thể loại: sonata piano.'
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n8
  cau: 'Độ dài chương 1: khoảng 5–6 phút.'
  loai: so-lieu
- trang: nghe-nhac/beethoven-moonlight
  id: n9
  cau: Biệt danh "Ánh trăng" không phải của Beethoven đặt.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n10
  cau: Nhà thơ, nhà phê bình Ludwig Rellstab tả chương 1 như một mặt hồ lặng dưới ánh trăng
    mờ trong truyện ngắn Theodor, đăng năm 1824 trên một tạp chí âm nhạc ở Berlin, khi Beethoven
    còn sống.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n11
  cau: Đến khoảng năm 1840, tên Mondscheinsonate đã quen thuộc ở Đức.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n12
  cau: Chuyện năm 1832 Rellstab ví bài với con thuyền trên hồ Lucerne bắt nguồn từ một cuốn
    sách in năm 1852 của Wilhelm von Lenz; con số 1832 là suy đoán của người đời sau.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n13
  cau: Tên gốc Beethoven đặt là Sonata quasi una fantasia ("sonata gần như một fantasia").
  loai: ten
- trang: nghe-nhac/beethoven-moonlight
  id: n14
  cau: Thay vì chương 1 nhanh như thông lệ, ông mở bằng một chương chậm (Adagio sostenuto).
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n15
  cau: Toàn chương là một dòng chùm ba (liên ba móc đơn) chảy đều gần như không ngừng ở tay
    phải, trên đó giai điệu cất lên từng nốt dài, thưa thớt.
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n16
  cau: Các quãng tám trầm (mở đầu Đô♯ – Si – La – Fa♯ – Sol♯) là bè trầm của tiến trình hòa
    âm.
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n17
  cau: Chương nhạc ở giọng Đô♯ thứ; giai điệu có lúc đi qua Mi trưởng, Mi thứ, Fa♯ thứ.
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n18
  cau: 'Cả chương giữ ở mức nhỏ: bản Winterberger chỉ ghi pp, p và những lần to dần, nhỏ dần,
    không có chữ f nào.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n20
  cau: 'Theo dõi: mở đầu (ô 1–4), dòng chùm ba tay phải chảy đều, rất nhỏ (pianissimo).'
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n21
  cau: 'Theo dõi: giai điệu chính cất lên (tay phải, nốt cao; nhịp lấy đà cuối ô 5), từng
    nốt dài, thưa.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n22
  cau: 'Theo dõi: giai điệu ở Fa♯ thứ (ô 23–27), cao hơn lần đầu, to dần rồi nhỏ lại.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n23
  cau: 'Theo dõi: trên nốt Sol♯ ngân ở bè trầm (ô 28–41), chùm ba leo lên cao nhất (ô 32–35)
    rồi đổ xuống.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n24
  cau: 'Theo dõi: tái hiện (ô 42), giai điệu và chùm ba trở lại như ô 5.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n25
  cau: 'Theo dõi: coda (ô 60–69), nhịp chấm dôi xuống bè trầm; hai hợp âm pp khép lại.'
  loai: cau-truc
- trang: nghe-nhac/beethoven-moonlight
  id: n27
  cau: So sánh với chương 3 (Presto agitato); ba chương nối liền nhau, nên bản sonata là một
    khối, quasi una fantasia.
  loai: lich-su
- trang: nghe-nhac/beethoven-moonlight
  id: n26
  cau: 'Câu hỏi nghe chủ động: dòng chùm ba có bao giờ dừng không; giai điệu ở âm vực nào;
    thử hát theo.'
  loai: khuyen-tap
- trang: piano/tac-pham/bach-invention-1
  id: n1
  cau: 'Tiêu đề: "Bach: Invention số 1 Đô trưởng, BWV 772".'
  loai: ten
- trang: piano/tac-pham/bach-invention-1
  id: n2
  cau: Bài có hai mươi hai ô nhịp, hai bè.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n3
  cau: Chủ đề (ý nhạc chính) dài nửa ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n4
  cau: 'Invention số 1 là một bài phức điệu: hai tay cùng nói, đối đáp và nhại nhau, không
    chia vai giai điệu và đệm.'
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n5
  cau: Bach để lại gần như hoàn toàn cho người chơi việc quyết định cách phát âm.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n6
  cau: Mỗi tay là một giọng độc lập, quan trọng ngang nhau.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n8
  cau: Bach gần như không ghi dấu luyến hay staccato.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n10
  cau: 'Gần như mọi nốt trong bài đến từ chủ đề ở ô 1: nguyên dạng, đảo ngược, chuyển giọng,
    nối thành chuỗi.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n11
  cau: Một tay chạy móc kép trong khi tay kia đi móc đơn, rồi đổi vai.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n12
  cau: Chủ đề, nhại, chuỗi, kết là những khái niệm gặp lại trong fugue (link hinh-thuc/fugue).
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n13
  cau: Bach dùng các invention và sinfonia để dạy con trai Wilhelm Friedemann, rồi các học
    trò khác.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n14
  cau: Năm 1723, khi chép sạch cả tập, Bach viết một trang bìa dài.
  loai: nam
- trang: piano/tac-pham/bach-invention-1
  id: n15
  cau: 'Diễn ý trang bìa: hướng dẫn cho người yêu đàn phím, nhất là người ham học, học chơi
    sạch hai bè, rồi ba bè; tìm được ý nhạc hay và phát triển chúng; trên hết là đạt lối chơi
    như hát (cantabile) và nếm trước nghề sáng tác.'
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n16
  cau: 'Inventio là một từ của tu từ học: tìm ra một ý tưởng rồi khai triển nó.'
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n17
  cau: Mỗi invention là một bài học về cách một ý nhạc nhỏ sinh ra cả một tác phẩm.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n18
  cau: Mục tiêu cao nhất Bach nêu ra trên trang bìa là lối chơi như hát, không phải sự nhanh
    nhẹn của ngón tay.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n20
  cau: Bach viết cho đàn phím thời ấy (trang bìa gọi chung là Clavier).
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n23
  cau: Chủ đề gồm bảy nốt Đô – Rê – Mi – Fa – Rê – Mi – Đô; dạng lộn ngược đi xuống thay vì
    đi lên.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n24
  cau: 'Ba điểm kết: Sol trưởng, La thứ, rồi Đô.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n27
  cau: Bản thu gợi ý của Marcelle Meyer, thu năm 1948, nằm trên Wikimedia Commons.
  loai: nam
- trang: piano/tac-pham/bach-invention-1
  id: n28
  cau: Ở Mỹ, bản thu này vẫn còn được bảo hộ.
  loai: quy-tac
- trang: piano/tac-pham/bach-invention-1
  id: n30
  cau: 'Ô 1: tay phải chơi bảy móc kép Đô – Rê – Mi – Fa – Rê – Mi – Đô; nửa ô sau, tay trái
    nhại lại thấp hơn một quãng tám.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n31
  cau: 'Ô 2: chủ đề ở Sol, cùng hình dáng, bắt đầu từ bậc V.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n32
  cau: 'Ô 3–4: chủ đề đảo ở tay phải đi xuống thành chuỗi, tay trái đi móc đơn.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n33
  cau: Đầu ô 7 kết ở Sol trưởng; hai tay đổi vai, tay trái mở đầu bằng chủ đề, tay phải nhại.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n34
  cau: 'Ô 9–10: hai bè cùng chơi dạng lộn ngược của chủ đề.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n35
  cau: 'Ô 11–12: tay phải đi móc đơn, tay trái chạy chuỗi chủ đề đảo.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n36
  cau: Đầu ô 15 kết ở La thứ, Sol♯ dẫn tới điểm dừng thứ hai.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n37
  cau: 'Ô 15–18: một tay giữ nốt dài trong khi tay kia chạy chủ đề, khi xuôi khi đảo, đi xuống
    theo chuỗi; nốt trắng nối sang ô sau.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n38
  cau: Ô 19–22 về Đô; Si♭ ở ô 21 hướng về hạ át trước kết; hợp âm Đô ở ô 22.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n39
  cau: 'Bảng Cấu trúc: phần 1 ô 1–7 (Đô → Sol), phần 2 ô 7–15 (Sol → La thứ), phần 3 ô 15–22
    (La thứ → Đô), với các chi tiết như bảng Theo dõi.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n40
  cau: 'Hai ô đầu: sau một dấu lặng móc kép là bảy móc kép, tiếp theo là bốn móc đơn Sol –
    Đô – Si – Đô; lời đáp của tay trái.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n42
  cau: 'Ô 2: nốt móc kép đầu tiên của tay phải (Rê) thay chỗ dấu lặng, và chủ đề bắt đầu lại
    từ Sol.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n43
  cau: Cả bài giữ hình dáng chủ đề, đổi độ cao, đổi điểm bắt đầu.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n45
  cau: 'Chỗ khó, phát âm: không có dấu nào trên bản nhạc.'
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n49
  cau: 'Chuỗi ở ô 3–4, 11–12, 15–18: các nhóm nốt giống nhau nhưng mỗi lần lệch một bậc.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n51
  cau: Nốt dài ô 15–18 là nốt trắng nối sang ô sau.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n59
  cau: Không có chỉ dẫn tốc độ.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n62
  cau: Bach không ghi sắc thái.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n64
  cau: Trong bản Bach-Gesellschaft có ký hiệu láy trên (không gạch; theo bảng của Bach là
    một láy rền ngắn) ở vài nốt móc đơn, như nốt Si ở ô 1 và nốt Fa ở ô 2.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n65
  cau: Bản ấy có láy dưới (có gạch) ở hai nốt móc đơn chấm dôi, ô 5 và ô 13.
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n66
  cau: Theo thói quen thời Baroque, láy rền thường bắt đầu từ nốt trên và rơi đúng phách;
    láy dưới đi nốt chính – nốt dưới – nốt chính.
  loai: quy-tac
- trang: piano/tac-pham/bach-invention-1
  id: n67
  cau: Chính Bach viết một bảng giải thích các ký hiệu này trong Clavier-Büchlein của Wilhelm
    Friedemann; một số ấn bản in lại bảng này.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n71
  cau: Nhiều ấn bản cũ thêm dấu luyến, sắc thái và tốc độ của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/bach-invention-1
  id: n73
  cau: 'Invention khác: số 4 (Rê thứ) Henle xếp cùng mức 3 như số 1; số 8 (Fa trưởng) Henle
    mức 4, ABRSM Grade 5.'
  loai: cap-do
- trang: piano/tac-pham/bach-invention-1
  id: n78
  cau: 'Câu hỏi 1: ba điểm kết lần lượt ở Sol trưởng (ô 7), La thứ (ô 15), Đô trưởng (ô 22);
    lời giải thích: mỗi phần khép bằng một kết.'
  loai: cau-truc
- trang: piano/tac-pham/bach-invention-1
  id: n79
  cau: 'Câu hỏi 2: chủ đề đảo là chủ đề lộn ngược, đi xuống ở chỗ bản gốc đi lên; trong bài
    tập 1, Đô – Rê – Mi – Fa – Rê – Mi – Đô đảo thành Đô – Si – La – Sol – Si – La – Đô.'
  loai: dinh-nghia
- trang: piano/tac-pham/bach-invention-1
  id: n80
  cau: 'Câu hỏi 3: một lựa chọn phát âm hợp lý là móc kép liền tiếng, móc đơn tách nhẹ, nốt
    dài giữ đủ.'
  loai: khuyen-tap
- trang: piano/tac-pham/bach-invention-1
  id: n63
  cau: 'Sắc thái theo cấu trúc: chủ đề rõ hơn, chuỗi đi lên căng dần...'
  loai: khuyen-tap
- trang: piano/tac-pham/bach-invention-1
  id: n69
  cau: 'Bàn đạp: gần như không cần; nếu dùng chỉ chạm nông.'
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-anh-trang
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata Ánh trăng, Op. 27 số 2, chương 1".'
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n2
  cau: 'Mô tả và câu mở đầu: chương 1 của bản sonata nổi tiếng này có rất ít nốt khó; cái
    khó nằm ở âm thanh.'
  loai: cap-do
- trang: piano/tac-pham/beethoven-anh-trang
  id: n3
  cau: Tay phải vừa rải chùm ba vừa hát giai điệu bằng ngón 5, trên quãng tám trầm ngân dài,
    gần như suốt bài trong pp.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n4
  cau: Chỉ dẫn bàn đạp mà người chơi vẫn còn bàn luận.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n6
  cau: Tay phải rải chùm ba (liên ba móc đơn) bằng ngón 1–2–3, hát giai điệu bằng ngón 4–5;
    tay trái giữ bè trầm quãng tám.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n9
  cau: 69 ô nhịp ở tốc độ chậm, nhịp alla breve.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n10
  cau: Hợp âm Napoli ở ô 3, những lần đổi sang giọng thứ, nốt át ngân suốt hơn chục ô (link
    Phân tích).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n14
  cau: Năm 1802, Beethoven cho in hai sonata Op. 27 và đặt cho cả hai tên Sonata quasi una
    fantasia.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n15
  cau: Sonata thời Haydn, Mozart thường mở bằng một chương nhanh; Op. 27 số 2 mở bằng một
    Adagio.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n16
  cau: Tiếp theo là một Allegretto ngắn ở Rê♭ trưởng, và chương nhanh Presto agitato ở cuối.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n17
  cau: Bản sonata đề tặng nữ bá tước Giulietta Guicciardi, học trò của ông.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n18
  cau: Trên nhiều đàn Vienna khoảng 1800, bộ giảm âm được nhấc bằng cần gạt đầu gối; đàn cũ
    hơn dùng nút gạt bằng tay; tiếng đàn tắt nhanh hơn đàn hiện đại nhiều.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n19
  cau: Vì vậy chỉ dẫn bàn đạp không thể áp dụng y nguyên lên đàn cánh ngày nay (link Lịch
    sử cây đàn, thời kỳ Cổ điển).
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n20
  cau: Biệt danh "Ánh trăng" không phải của Beethoven.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n21
  cau: Ludwig Rellstab (1799–1860), nhà thơ, nhà phê bình, người viết lời cho nhiều ca khúc
    trong Schwanengesang của Schubert.
  loai: nam
- trang: piano/tac-pham/beethoven-anh-trang
  id: n22
  cau: Rellstab tả chương này bằng mặt hồ lặng dưới ánh trăng mờ, sóng khẽ vỗ vào bờ tối,
    trong truyện ngắn Theodor đăng trên một tạp chí âm nhạc ở Berlin khoảng 1823–1824, khi
    Beethoven còn sống.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n23
  cau: Chuyện năm 1832 Rellstab ví bài với con thuyền dưới trăng trên hồ Lucerne bắt nguồn
    từ Beethoven et ses trois styles (1852) của Wilhelm von Lenz.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n24
  cau: Lenz chỉ viết rằng Rellstab so sánh như thế "hai mươi năm trước"; năm 1832 là con số
    người đời sau suy ra.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n25
  cau: Văn bản của Rellstab tả một mặt hồ, không có con thuyền nào và không nhắc tên hồ.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n26
  cau: Đến khoảng năm 1840, tên Mondscheinsonate đã quen thuộc ở Đức.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n29
  cau: Artur Schnabel và Wilhelm Kempff đều thu trọn 32 sonata.
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n30
  cau: Ronald Brautigam có bản thu trên fortepiano.
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n31
  cau: Trên đàn cũ, tiếng tắt nhanh nên bàn đạp giữ lâu vẫn không nhòe như trên đàn hiện đại
    (link Nghệ sĩ piano).
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n32
  cau: 'Mở đầu (ô 1–4): chỉ có chùm ba và quãng tám trầm Đô♯ – Si – La – Fa♯ – Sol♯; nửa sau
    ô 3 hợp âm Rê trưởng (Napoli) làm màu nhạc tối đi.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n33
  cau: 'Giai điệu lần 1 (nhịp lấy đà cuối ô 5, ô 6–9): Sol♯ lặp với nhịp chấm dôi, rồi La,
    Sol♯, Fa♯, Si; câu kết ở Mi trưởng (ô 9).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n34
  cau: 'Giai điệu ở Mi thứ (ô 10–15): Sol♮ thay Sol♯ trong chùm ba và giai điệu; nhạc dừng
    ở Si (ô 15).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n35
  cau: 'Quanh nốt Si (ô 16–22): bè trầm đi nốt đen; giai điệu Đô♮ – La♯ – Si nói hai lần;
    nhạc trượt xuống, dừng trên hợp âm Đô♯ trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n36
  cau: 'Giai điệu ở Fa♯ thứ (nhịp lấy đà cuối ô 23, ô 24–27): cao hơn lần đầu, trên nốt Đô♯;
    to dần rồi nhỏ lại.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n37
  cau: 'Nốt Sol♯ ngân (ô 28–41): giai điệu tan vào chùm ba; chùm ba leo lên cao nhất (ô 32–35)
    rồi đổ xuống thấp.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n38
  cau: 'Tái hiện (ô 42–59): chùm ba, bè trầm và giai điệu trở lại như ô 5; nhạc ở lại quanh
    Đô♯ thứ.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n39
  cau: 'Coda (ô 60–69): nhịp chấm dôi xuống tay trái, âm vực trầm; chùm ba rải lên rồi rơi
    xuống; hai hợp âm pp cuối.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n40
  cau: 'Chương nhạc không có dấu nhắc lại; có thể nghe như ba phần hoặc như một hình thức
    sonata thu nhỏ: ô 51–55 lặp lại, ở giọng chủ, cảnh lắc qua lắc lại của ô 15–19.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n42
  cau: 'Mở đầu 1–4: nửa sau ô 3 là hợp âm Napoli (Rê trưởng, thể đảo một); ô 4 trên nốt trầm
    Sol♯ (át âm).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n43
  cau: 'Giai điệu lần 1, 5–9: vào ở nhịp lấy đà cuối ô 5, trên nốt Sol♯4; Đô♯ thứ → Mi trưởng.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n44
  cau: 'Giai điệu lần 2, 10–15: Sol♮ thay Sol♯; hợp âm Đô trưởng ở ô 12; kết ở Si thứ, rồi
    chuyển sang Si trưởng (ô 15).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n45
  cau: 'Quanh nốt Si, 16–22: bè trầm đi nốt đen trên nền nốt Si; hợp âm Sol trưởng (Napoli
    của Fa♯ thứ) ở ô 21; dừng trên hợp âm Đô♯ trưởng (át của Fa♯ thứ).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n46
  cau: 'Giai điệu lần 3, 23–27: trên nốt Đô♯5, cao hơn lần đầu; to dần rồi nhỏ lại; dẫn về
    Đô♯ thứ và nốt Sol♯.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n47
  cau: 'Nốt át ngân 28–41: quãng tám Sol♯ ở bè trầm suốt 12 ô (28–39); chùm ba leo lên tới
    Rê♯6 (cuối ô 35) rồi đổ xuống; ô 40–41 bè trầm Sol♯ – La – Fa♯ – Sol♯.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n48
  cau: 'Tái hiện 42–59: ô 42–45 giống ô 5–8; ô 51–55 ứng với ô 15–19, nay trên nốt Đô♯, với
    giai điệu Rê♮ – Si♯ – Đô♯.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n49
  cau: 'Coda 60–69: nhịp chấm dôi xuống bè trầm (Sol♯2) trên các nốt trầm Đô♯, Si♯, Sol♯;
    chùm ba rải lên hai quãng tám rồi rơi xuống, hai lần; hai hợp âm Đô♯ thứ pp.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n50
  cau: 'Chín ô đầu: nốt nhạc theo bản Mutopia (nguồn ấn bản A. Winterberger biên tập, 1908);
    số ngón là gợi ý của trang.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n51
  cau: Mọi chùm ba được viết cho tay phải; bản Winterberger để tay trái đỡ chùm ba đầu tiên
    của ô 5.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n52
  cau: Ô 1–4 chưa có giai điệu; nửa sau ô 3 hợp âm Rê trưởng với Fa♯ ở bè trầm, tức hợp âm
    Napoli của Đô♯ thứ (link Napoli); chú ý Rê♮ trong chùm ba.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n53
  cau: Giai điệu vào ở nhịp lấy đà cuối ô 5, trên Sol♯4, đúng một quãng tám trên Sol♯3 mà
    ngón cái đang chơi trong chùm ba; câu nhạc kết ở Mi trưởng ở ô 9.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n56
  cau: 'Nhịp chấm dôi so với chùm ba (ô 5–6, 10–11, 23–24...): nốt móc kép bắt đầu ở 3/4 phách,
    muộn hơn nốt thứ ba của chùm ba (2/3 phách).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n60
  cau: 'Nốt Sol♯ ngân (ô 28–41): mười hai ô (28–39) trên cùng một nốt trầm; chùm ba trải rộng
    và leo cao (ô 32–35), lên tới Rê♯6 ở cuối ô 35.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n61
  cau: Bản Winterberger chia vài chùm ba ở ô 30–33 cho tay trái.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n63
  cau: 'Hai bè ở tay trái trong coda (ô 60–65): ngón cái hát nhịp chấm dôi trên Sol♯2, ngón
    5 giữ nốt trầm.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n74
  cau: Adagio sostenuto nghĩa là chậm và ngân giữ.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-anh-trang
  id: n75
  cau: 'Beethoven ghi nhịp alla breve (2/2): hai phách trắng mỗi ô.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n78
  cau: 'Trong bản Winterberger, toàn chương không có một chữ f nào: chỉ pp, p và những lần
    to dần, nhỏ dần (chẳng hạn ở ô 25–27).'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n79
  cau: 'Bàn đạp: Beethoven ghi chỉ dẫn hai lần: Si deve suonare tutto questo pezzo delicatissimamente
    e senza sordino ở đầu bản nhạc, và sempre pp e senza sordino giữa hai khuông.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n80
  cau: 'Bản dịch: "cả chương này phải chơi hết sức tinh tế và không có bộ giảm âm".'
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n81
  cau: Tùy ấn bản, chữ này in là sordino hoặc sordini; nghĩa như nhau.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n82
  cau: 'Thời Beethoven, sordini là bộ giảm âm, nên senza sordino là bộ giảm âm luôn được nhấc
    lên: tương đương giữ bàn đạp vang.'
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-anh-trang
  id: n83
  cau: Đây không phải chỉ dẫn về bàn đạp trái; khi muốn una corda, Beethoven ghi riêng chữ
    ấy, chẳng hạn trong các sonata cuối đời.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n84
  cau: Trên đàn của ông, giữ bộ giảm âm nhấc suốt chỉ tạo một làn sương mỏng, vì tiếng tắt
    nhanh; trên đàn cánh hiện đại, giữ nguyên bàn đạp qua các lần đổi hòa âm sẽ thành một
    khối âm thanh nhòe.
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n85
  cau: 'Cách đọc thứ nhất, theo sát chữ: giữ bàn đạp suốt chương hoặc gần như suốt; Charles
    Rosen đọc chỉ dẫn theo nghĩa này.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n88
  cau: 'Cách đọc thứ ba: đổi một phần, hoặc giữ bàn đạp ở gần điểm bắt và điều chỉnh rất nhỏ,
    không bao giờ đạp sâu hết hay nhả hết.'
  loai: quy-tac
- trang: piano/tac-pham/beethoven-anh-trang
  id: n91
  cau: Các ấn bản cũ có thể thêm ký hiệu bàn đạp, sắc thái và ngón bấm của người biên tập;
    bản Winterberger ghi ngón đổi 5–4 và 4–5 trên các nốt giai điệu ngân dài ở ô 7–8.
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n92
  cau: 'Ngón cho chùm ba đổi theo thế tay: bản Winterberger ghi 1–3–5 ở ô 1, 1–2–4 ở đầu ô
    3; chọn theo bàn tay.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n94
  cau: 'Chương 2 (Allegretto, Rê♭ trưởng, 60 ô nhịp) ngắn; chương 3 (Presto agitato, 200 ô
    nhịp) khó hơn nhiều: Henle xếp cả sonata mức 7 và ghi ABRSM ARSM, bằng sau Grade 8.'
  loai: cap-do
- trang: piano/tac-pham/beethoven-anh-trang
  id: n99
  cau: 'Câu hỏi 1: senza sordino nghĩa là không có bộ giảm âm, bộ giảm âm luôn nhấc lên, tức
    giữ bàn đạp vang; người chơi trên đàn hiện đại thường đổi bàn đạp theo hòa âm hoặc nhả
    một phần.'
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-anh-trang
  id: n100
  cau: 'Câu hỏi 2: nốt móc kép rơi sau nốt thứ ba của chùm ba, sát phách sau; móc kép ở 3/4
    phách, nốt thứ ba ở 2/3 phách.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n101
  cau: 'Câu hỏi 3: nhà phê bình Ludwig Rellstab gắn hình ảnh ánh trăng với chương này, trong
    một truyện ngắn đăng khoảng năm 1823–1824; chuyện con thuyền trên hồ Lucerne năm 1832
    đến từ một cuốn sách viết năm 1852.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-anh-trang
  id: n102
  cau: 'Câu hỏi 4: ở ô 28–41 quãng tám Sol♯ (át âm) ngân suốt nhiều ô trong khi chùm ba leo
    lên cao rồi đổ xuống; chuẩn bị cho tái hiện ở ô 42.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-anh-trang
  id: n103
  cau: 'Mục Nguồn: Henle HN 1062 (biên tập Norbert Gertsch, ngón bấm Murray Perahia): trang
    ấn bản, mức độ khó, đoạn văn của Rellstab.'
  loai: ten
- trang: piano/tac-pham/beethoven-anh-trang
  id: n5
  cau: 'Mục tiêu của trang: ba lớp tách bạch, bàn đạp không nhòe, tốc độ chậm không đứng lại.'
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-anh-trang
  id: n76
  cau: Nghĩ theo phách trắng; thở nhẹ ở cuối các câu lớn (ô 9, 15, 22, 41) và trước hai hợp
    âm cuối.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-anh-trang
  id: n71
  cau: Kế hoạch 8 tuần, 30–45 phút mỗi ngày; tốc độ tính theo phách đen, mỗi phách là một
    chùm ba.
  loai: khuyen-tap
