- trang: piano/tac-pham/bach-prelude-bwv939
  id: n1
  cau: Bài có mười sáu ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n2
  cau: Bài chơi chưa đầy một phút; một lần chơi thường dài chừng 40 giây, tức quanh ♩ ≈ 90–100.
  loai: so-lieu
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n3
  cau: Bài có hợp âm rải chuyền qua lại giữa hai tay, nốt nền ở bè trầm, một chuỗi láy, một gam móc kép và một cái kết gọn gàng.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n5
  cau: Mười sáu ô, không có bè phức điệu nào phải giữ riêng.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n7
  cau: Ô 1–3, tay phải rải trên nốt trầm ngân dài; ô 4, hình rải chuyển xuống tay trái còn tay phải đánh hợp âm; sau đó hai tay thay phiên nhau; ô 13, cả hai cùng rải.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n8
  cau: Prelude BWV 846 dài 35 ô và đòi hình rải chia hai tay suốt bài.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n9
  cau: Nhịp điệu hòa âm là tốc độ đổi hợp âm.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n10
  cau: Gần như cả bài mỗi ô một hợp âm; riêng ô 15, hợp âm đổi gần như từng phách.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n12
  cau: Quãng tám Đô trầm giữ suốt ba ô đầu, rồi nốt Sol trầm nhảy quãng tám có láy ở ô 9–11.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n13
  cau: Không có bản viết tay nào của Bach cho bài này; nguồn duy nhất từ thế kỷ 18 là một bản chép trong tập P 804 ở Thư viện Quốc gia Berlin, một tập lớn đóng chung nhiều bản chép riêng lẻ.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n14
  cau: "Tập P 804 phần lớn đến từ di sản của Johann Peter Kellner (1705–1772), cantor ở Gräfenroda, vùng Thüringen: 57 bản chép riêng lẻ, chủ yếu là nhạc đàn phím của Bach."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n15
  cau: Phần chứa BWV 939–942 do một người chép chưa rõ tên, và không ghi tên tác giả; vì vậy không có bằng chứng trực tiếp rằng bài là của Bach, dù danh mục BWV và các ấn bản Urtext vẫn xếp bài dưới tên ông.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n16
  cau: "Năm sáng tác chưa chắc chắn: có tài liệu xếp bài vào thời Bach ở Köthen (1717–1723), có tài liệu đặt nó vào khoảng 1726–1727."
  loai: nam
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n17
  cau: "Điều rõ ràng hơn là công dụng của bài: một bài ngắn để học đàn."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n18
  cau: Năm 1843, nhà Peters ở Leipzig in một tập mười hai prelude ngắn, gom từ Clavier-Büchlein của Wilhelm Friedemann và tập P 804; tên tập là Douze petits Préludes ou Exercices pour les commençans.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n19
  cau: Clavier-Büchlein là cuốn sổ tay đàn phím Bach soạn cho con trai Wilhelm Friedemann.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n20
  cau: BWV 939 là số 2 của tập Peters.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n21
  cau: Năm 1890, ấn bản toàn tập của Hội Bach (Bach-Gesellschaft, tập 36) in lại bài; danh mục BWV về sau xếp nó đứng đầu nhóm Fünf kleine Präludien (Năm prelude nhỏ, BWV 939–943).
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n22
  cau: Bach viết cho Clavier, tức đàn phím nói chung, như harpsichord hay clavichord.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n23
  cau: Trên harpsichord, lực ngón gần như không làm tiếng to hay nhỏ đi; trên piano, tiếng to hay nhỏ theo lực ngón.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n25
  cau: "Câu hỏi nghe 1–4: quãng tám Đô vang tới đâu ở ô 3; đánh dấu ô có hình rải ở tay trái; láy ở ô 9–11 trên nốt Sol tay trái; nghệ sĩ có chậm ở hai ô cuối không."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n26
  cau: Bài có mặt trong rất nhiều bản thu trọn các prelude nhỏ, cả trên harpsichord lẫn piano.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n27
  cau: Kenneth Gilbert đã thu bài trên harpsichord.
  loai: ten
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n28
  cau: Angela Hewitt đã thu bài trên piano.
  loai: ten
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n29
  cau: Tatiana Nikolayeva đã thu bài trên piano.
  loai: ten
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n31
  cau: "Bảng Theo dõi khi nghe, dòng 1: ô 1–3, quãng tám Đô trầm ngân suốt ba ô; tay phải rải Đô bảy, Fa trưởng, rồi Sol bảy."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n32
  cau: "Dòng 2: ô 4–5, tay phải đánh hợp âm, hình rải chuyển xuống tay trái; Fa♯ xuất hiện ở ô 5."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n33
  cau: "Dòng 3: ô 6–8, sang Sol trưởng, hình rải chuyền qua lại giữa hai tay, đến hợp âm Rê bảy ở ô 8."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n34
  cau: "Dòng 4: ô 9–11, tay trái nhảy quãng tám trên nốt Sol, nốt Sol cao có láy; tay phải leo dần lên."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n35
  cau: "Dòng 5: ô 12, tay phải giữ hợp âm Sol trưởng, tay trái rải Sol bảy để quay về Đô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n36
  cau: "Dòng 6: ô 13, hai tay cùng rải; hợp âm Đô bảy của ô 1 trở lại, cao hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n37
  cau: "Dòng 7: ô 14, gam móc kép: tay phải chạy xuống rồi chạy lên trên nốt Fa trầm ngân dài."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n38
  cau: "Dòng 8: ô 15–16, hợp âm đổi theo từng phách, nốt Sol trầm nhảy quãng tám xuống, rồi hợp âm Đô cuối cùng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n39
  cau: "Bảng Cấu trúc, chặng Nốt nền chủ, ô 1–3: Đô bảy – Fa – Sol bảy, cả ba trên quãng tám Đô trầm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n40
  cau: "Chặng Chuyền tay, sang Sol trưởng, ô 4–8: Đô – Rê bảy – Sol (sang Mi thứ ở phách 4) – La thứ – Rê bảy; Fa♯ kéo nhạc về phía Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n41
  cau: "Chặng Nốt nền át, ô 9–12: Sol bảy – Đô – Fa♯ giảm, trên nốt Sol trầm có láy; ô 12 dừng ở Sol; nốt đầu mỗi ô của tay phải đi lên Si – Mi – Fa♯ – Sol."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n42
  cau: "Chặng Về Đô và kết, ô 13–16: Đô bảy – Fa – (ô 15 đổi hợp âm theo phách) – Đô; ô 14 là ô móc kép duy nhất; ô 15 hòa âm dày nhất; ô 16 dừng hẳn."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n44
  cau: Khối 1 theo ấn bản Bach-Gesellschaft (1890), đối chiếu qua bản LilyPond của Mutopia; số ngón là gợi ý của trang; bản gốc không có dấu sắc thái hay dấu luyến nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n45
  cau: Ba ô đầu, tay trái đặt quãng tám Đô (C2–C3) rồi để yên, đúng như bản nhạc ghi.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n47
  cau: "Bảng Chỗ khó: giữ quãng tám Đô ô 1–3 (mười hai phách liền); hình rải đổi tay ô 4–8, 12–13; hợp âm tay phải ô 4–5; láy tay trái ô 9–11 rơi đúng phách mạnh rồi nhảy quãng tám xuống; gam móc kép ô 14 quay đầu giữa ô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n49
  cau: "Ô 15: tay phải đi từ Sol cao xuống quãng bốn Sol–Đô rồi quãng sáu Rê–Si; tay trái đi Fa–Rê–Mi–Đô rồi nhảy quãng tám trên Sol."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n50
  cau: Móc đơn, nốt trắng, nốt đen, móc kép nối nhau trong bài; tập ở tốc độ của ô khó nhất, thường là ô 14.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n52
  cau: Bài tập 1, 2, 3 soạn riêng cho trang, không trích từ bản gốc; bài tập 3 cùng hình nốt với ô 14 nhưng thấp hơn một bậc.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n55
  cau: Bach không ghi tốc độ.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n59
  cau: Bản nhạc không có dấu sắc thái nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n61
  cau: "Kí hiệu láy ở ô 9–11 là láy dưới: nốt chính – nốt kề dưới – nốt chính, bắt đầu đúng phách."
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n62
  cau: Ở ô 9, tay phải có Fa♮ (hợp âm Sol bảy); ở ô 11, tay phải có Fa♯.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n64
  cau: Bản Bach-Gesellschaft chỉ có nốt và các dấu láy.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n67
  cau: "Học tiếp: BWV 846 cùng giọng, cùng lối rải hợp âm chia hai tay, dài 35 ô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n69
  cau: "Cùng nhóm prelude nhỏ: BWV 924 (Đô trưởng) và BWV 999 (Đô thứ), hai bài gần cùng độ khó, cũng dựng trên hợp âm rải."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n71
  cau: "Câu hỏi 1: ở ba ô đầu tay trái giữ một quãng tám Đô trầm suốt ba ô; giải thích: tay phải rải Đô bảy, Fa và Sol bảy."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n72
  cau: "Câu hỏi 2: ở ô 15 nhịp điệu hòa âm nhanh lên, hợp âm đổi gần như từng phách, báo hiệu kết; giải thích: phần lớn bài mỗi ô một hợp âm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n74
  cau: "Câu hỏi 4: ô 9–11 là nốt nền át, nốt Sol trầm có láy, tay phải rải đi lên dần, không phải đoạn gam móc kép hay đoạn chuyển sang La thứ; giải thích: Sol là át âm của Đô trưởng, ô 12 dừng ở Sol, ô 13 về Đô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n75
  cau: "Mục Nguồn: Bach Digital (trang BWV 939, P 804 tập nhỏ 53 và cả tập P 804)."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n76
  cau: "Mục Nguồn: Henle HN 106 (Steglich), lời nói đầu về bản chép của Kellner."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n77
  cau: "Mục Nguồn: Bach Printed Music Database, tập 12 prelude nhỏ của Peters."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n78
  cau: 'Mục Nguồn: ADB, "Kellner, Johann Peter" (Eitner, 1882).'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n79
  cau: "Mục Nguồn: danh sách bản thu ở Bach Cantatas Website."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n80
  cau: "Mục Nguồn: bản nhạc IMSLP (Bach-Gesellschaft, tập 36, Ernst Naumann biên tập, 1890); đoạn trích đối chiếu với bản LilyPond của Mutopia Project; link tài liệu tham khảo."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n54
  cau: Kế hoạch 4 tuần, 20–30 phút mỗi ngày, tốc độ máy đếm nhịp từ ♩ = 60 đến 84–96.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n51
  cau: Các cách tập trong bảng Chỗ khó (đánh quãng tám đủ sâu, không dùng bàn đạp giữ hộ, so tay trái ô 4 với tay phải ô 1, thu âm, đặt sẵn ngón, tập bản viết ra trước, tạm chơi nốt trơn, tập nhịp chấm dôi, tập riêng ô 14–16, gọi tên hợp âm, máy đếm nhịp).
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n63
  cau: Chọn Fa hay Fa♯ cho nốt láy theo hòa âm, hỏi thầy, giữ một cách cố định; láy làm gãy nhịp thì chơi nốt trơn.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n1
  cau: Với rất nhiều người học đàn, đây là bài "Beethoven" đầu tiên, dù rất có thể ông không hề viết nó.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n2
  cau: Bài có hai chương ngắn, Moderato và Romanze.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n3
  cau: Bài dạy câu nhạc rõ ràng, dấu luyến ngắn, nốt láy gọn, tay trái nhẹ nhàng bên dưới; câu nhạc bốn ô hỏi rồi đáp, dấu luyến hai nốt, nốt láy, kết rõ ràng.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n5
  cau: Moderato duyên dáng và nhanh nhẹn; Romanze hát, mềm, có một khoảnh khắc dừng lại đầy chờ đợi.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n6
  cau: Tay trái dùng hợp âm hai nốt, hình Alberti (nốt trầm – nốt cao – nốt giữa – nốt cao), hình đệm 6/8.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n7
  cau: Bài ngắn và dễ hơn Clementi Sonatina Op. 36 số 1 (link), cùng một thế giới âm thanh.
  loai: cap-do
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n8
  cau: Danh mục chuẩn về tác phẩm Beethoven do Georg Kinsky soạn và Hans Halm hoàn tất (1955).
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n9
  cau: "Danh mục chia tác phẩm thành ba nhóm: có số opus; không có số opus (WoO, Werke ohne Opuszahl); và Anhang, phụ lục cho tác phẩm mà quyền tác giả đáng ngờ; hai sonatina nằm ở mục thứ năm của phụ lục, nên mang số Anh. 5."
  loai: danh-muc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n10
  cau: Không còn bản viết tay, và không có thư từ hay ghi chép nào của Beethoven nhắc đến hai bài.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n11
  cau: Henle ghi rằng hai bài được in khi Beethoven còn sống, khoảng năm 1807; bản in ấy (nhà Rudolphus ở Altona) ghi tên ông là tác giả.
  loai: nam
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n12
  cau: Phần giới thiệu ấn bản Wiener Urtext (2021) nói bản in đầu tiên ra đời sau khi Beethoven mất.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n13
  cau: Toàn tập Breitkopf & Härtel ở thế kỷ 19 ghi nhà xuất bản gốc là August Cranz ở Hamburg.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n14
  cau: Hamburg rất xa Vienna, nơi Beethoven sống từ năm 1792.
  loai: nam
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n15
  cau: Alexander Wheelock Thayer, người viết tiểu sử Beethoven, chỉ dám đoán rằng nếu là của Beethoven thì hai bài thuộc thời ông còn trẻ ở Bonn, kèm một dấu hỏi.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n16
  cau: Năm 1868, Gustav Nottebohm, nhà nghiên cứu các sổ phác thảo của Beethoven, cũng nghi ngờ.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n17
  cau: Ngày nay Henle cho rằng rất khó có chuyện Beethoven là tác giả.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n18
  cau: Wiener Urtext viết rằng không thể chắc chắn, và cũng chưa ai tìm ra một tác giả khác.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n19
  cau: "Âm nhạc thuộc phong cách Cổ điển: giai điệu chia thành câu bốn ô, hòa âm chủ yếu là chủ âm và át âm, tay trái đệm bằng hợp âm hai nốt và hình Alberti."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n20
  cau: "Tuy mang tên sonatina, không chương nào có hình thức sonata: cả hai đều là hình thức hai đoạn có tái hiện (A – B – A, trong đó B và A nhắc lại cùng nhau) thêm một coda."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n21
  cau: Romanze (romance) là cái tên không gắn với một hình thức cố định, thường gợi tính chất dịu dàng, riêng tư; Mozart đặt tên này cho chương chậm của Concerto piano Rê thứ K. 466.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n22
  cau: Chương hai của Eine kleine Nachtmusik của Mozart cũng mang tên Romanze.
  loai: ten
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n24
  cau: "Câu hỏi nghe: chương I, câu đầu (ô 1–4) dừng lửng, câu sau (ô 5–8) khép lại; ô 5 tay trái đổi từ hợp âm hai nốt sang Alberti; nốt láy; Romanze cảm hai hay sáu phách, chỗ dừng trên dấu ngân (fermata); có chơi dấu nhắc lại không."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n25
  cau: "Thuật ngữ: dấu ngân (fermata) ở ô 19 Romanze và ở hợp âm cuối chương I đặt trên nốt và hợp âm."
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n26
  cau: Bài có mặt trong rất nhiều tuyển tập sonatina cho người học; bạn sẽ gặp đủ loại bản thu.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n28
  cau: "Bảng Theo dõi khi nghe, I. Moderato, A (ô 1–8): p; giai điệu Sol trưởng có nốt láy; câu đầu dừng lửng ở ô 4, câu sau khép lại ở Sol."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n29
  cau: "I. B (ô 9–16): mf; tay trái lắc qua lại trên nốt Rê trầm, tay phải chạy móc đơn; ở ô 16, tay phải đi một mình dẫn về."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n30
  cau: "I. A trở lại (ô 17–24): dolce; nguyên văn đoạn đầu."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n31
  cau: "I. B và A nhắc lại (ô 9–24); I. Coda (ô 25–34): mf; nốt Rê nhắc lại rồi đi lên theo hợp âm Sol; kết bằng các hợp âm Sol, hợp âm cuối ngân dài."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n32
  cau: "II. Romanze, A (nhịp lấy đà và ô 1–8): 6/8; giai điệu hát trên hình đệm nốt trầm – hai hợp âm; A nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n33
  cau: "II. B (ô 9–21): chuỗi nốt đi lên, lớn dần, sang Rê trưởng; ba hợp âm rải và dấu ngân ở ô 19; tay phải một mình dẫn về."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n34
  cau: "II. A trở lại (ô 22–29), rồi B và A nhắc lại; II. Coda (ô 29–40): p; nốt láy hai nốt, bè trầm đi lên nửa cung Đô – Đô♯ – Rê; kết nhẹ."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n35
  cau: Số ô nhịp theo bản Breitkopf & Härtel; ấn bản khác có thể lệch, nhất là ở chương II vì chương bắt đầu bằng nhịp lấy đà.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n36
  cau: "Bảng Cấu trúc, I. A ô 1–8 Sol trưởng: hai câu bốn ô, câu 1 dừng trên hợp âm Rê (át âm) ở ô 4, câu 2 kết về Sol; tay trái hợp âm hai nốt, rồi Alberti ở ô 5–6; nốt láy ngắn; dấu luyến hai nốt ở ô 2 và 7."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n37
  cau: "I. B ô 9–16 (nhắc lại cùng A), quanh hợp âm át Rê bảy: tay trái lắc trên nốt Rê trầm; tay phải chạy móc đơn theo chuỗi, ô 12 lặp hình của ô 10 cao hơn một bậc; ô 16 chỉ có tay phải; mf."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n38
  cau: "I. A ô 17–24 Sol trưởng: nguyên văn ô 1–8, ghi dolce; hết ô 24 quay lại ô 9."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n39
  cau: "I. Coda ô 25–34, Sol trưởng trên nốt Rê trầm: nốt Rê nhắc lại, giai điệu đi lên theo hợp âm Sol; tay trái rải hợp âm; các hợp âm kết; hợp âm cuối có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n40
  cau: "II. A nhịp lấy đà và ô 1–8 (nhắc lại), Sol trưởng: giai điệu hát trên hình đệm nốt trầm – hai hợp âm; ô 3–4 dừng trên hợp âm Rê."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n41
  cau: "II. B ô 9–21, Rê trưởng → Rê bảy: chuỗi nốt chấm dưới dấu luyến, lớn dần (ô 9); ba hợp âm rải Rê bảy và dấu ngân (ô 17–19); tay phải một mình ở ô 20–21, có La♯."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n42
  cau: "II. A ô 22–29 Sol trưởng: nguyên văn đoạn A; B và A nhắc lại cùng nhau."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n43
  cau: "II. Coda ô 29–40 Sol trưởng: p; nốt láy hai nốt (ô 30, 34); bè trầm Đô – Đô♯ – Rê (ô 32–33); hai câu kết ngắn."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n44
  cau: Khối 1 theo bản Breitkopf & Härtel (Toàn tập Beethoven, loạt 16, số 160), đối chiếu qua bản mã hóa MEI của dự án TROMPA; số ngón là gợi ý của trang.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n45
  cau: Ô 1–4 là câu hỏi, dừng trên hợp âm Rê ở ô 4; ô 5–8 là câu trả lời, kết về Sol; ở ô 2 và ô 7 mỗi cặp nốt luyến là một tiếng thở; từ ô 5 tay trái chuyển sang Alberti; Fa♮ ở ô 5 kéo nhạc sang hợp âm Đô ở ô 6.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n46
  cau: "Khối 2: Romanze cùng nguồn; bản này không ghi sắc thái ở đầu chương."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n47
  cau: "Tay trái Romanze: nốt trầm rồi hai hợp âm nhỏ, lặp mỗi nửa ô; ở ô 3–4 tay trái có hai bè: nốt Mi trầm rồi Rê trầm ngân dài dưới các hợp âm; Đô♯ đưa nhạc dừng trên hợp âm Rê."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n49
  cau: "Bảng Chỗ khó: nốt láy ngắn ở I ô 1, 3, 5, 6 và II ô 1, 3; luyến hai nốt I ô 2, 7; Alberti I ô 5–6, 21–22; chuỗi móc đơn I ô 10, 12–15; coda I ô 25–31 với cú nhảy lên Rê cao (D6); hợp âm rải và dấu ngân II ô 17–19; tay phải một mình I ô 16, II ô 20–21, La♯ ở ô 21 Romanze."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n53
  cau: Moderato nghĩa là vừa phải.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n56
  cau: "Sắc thái của bản Breitkopf: p ở đầu chương I, nhỏ dần trên các cặp nốt đi xuống ở ô 2, mf ở đoạn B (ô 9) và ở coda (ô 25), dolce ở ô 17; Romanze: lớn dần ở ô 9, nhỏ dần trước dấu ngân ở ô 19, p ở coda."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n59
  cau: Nhiều tuyển tập cho người học in bài dưới tên Beethoven mà không ghi chú gì, kèm sắc thái và số ngón của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n60
  cau: Bản Urtext ghi rõ số Anh. 5 và cho biết đâu là chỉ dẫn của nguồn.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n63
  cau: "Học tiếp: Clementi Sonatina Op. 36 số 1 dài hơn, chương I có hình thức sonata thật."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n64
  cau: "Bài chị em: Sonatina Fa trưởng, Anh. 5 số 2, cùng nguồn gốc đáng ngờ, gồm Allegro assai và Rondo."
  loai: ten
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n66
  cau: Für Elise là "Beethoven thật".
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n67
  cau: 'Câu hỏi 1: "Anh." là Anhang, phụ lục các tác phẩm đáng ngờ trong danh mục Beethoven; giải thích: danh mục Kinsky–Halm (1955) xếp hai sonatina vào phụ lục vì không chắc chúng là của Beethoven.'
  loai: danh-muc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n68
  cau: "Câu hỏi 2: chương I là A – B – A và coda, ô 9–24 được nhắc lại; giải thích: A ô 1–8, B quanh hợp âm át ô 9–16, A ô 17–24, coda ô 25–34; lựa chọn sai: hình thức sonata, chủ đề và bốn biến tấu."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n69
  cau: "Câu hỏi 3: Romanze 6/8 cảm hai phách mỗi ô, mỗi phách ba móc đơn; giải thích: nốt trầm đầu mỗi nửa ô là phách."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n71
  cau: "Mục Nguồn: Henle HN 365 (Otto von Irmer biên tập, ngón Walther Lampe): lời giới thiệu và mức độ khó trên henle.de."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n72
  cau: "Mục Nguồn: Wiener Urtext UT 50290 Drei Sonatinen für Klavier (Anh. 5 số 1 và 2, WoO 50; Jochen Reutter biên tập, 2021): phần giới thiệu của nhà xuất bản về quyền tác giả."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n73
  cau: "Mục Nguồn: Kinsky, Halm, Das Werk Beethovens. Thematisch-bibliographisches Verzeichnis seiner sämtlichen vollendeten Kompositionen, G. Henle, München, 1955."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n74
  cau: "Mục Nguồn: Thayer, Chronologisches Verzeichniss (1865), số 24; Nottebohm, Thematisches Verzeichniss, ấn bản 2, Breitkopf & Härtel, Leipzig, 1868, tr. 148."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n75
  cau: 'Mục Nguồn: lvbeethoven.it, "Anhang 05": các lần in và ý kiến nghi ngờ.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n76
  cau: "Mục Nguồn: Ludwig van Beethovens Werke, loạt 16, số 160, Breitkopf & Härtel (bản quét trên IMSLP); đoạn trích đối chiếu với bản MEI của TROMPA (Werner Goebl, CC BY 4.0) trên GitHub; link tài liệu tham khảo."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n4
  cau: Những viên gạch ấy bạn sẽ gặp lại ở Clementi, Haydn, Mozart.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n54
  cau: Khoảng ♩ = 100–112 là hợp lý cho Moderato; Romanze không ghi tốc độ, cảm hai phách mỗi ô (♩. ≈ 48–56).
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n27
  cau: Gợi ý nghe hai bản khác nhau, nghe thêm bản trên fortepiano (đàn piano của thời ấy) để hình dung tiếng đàn mỏng và rõ.
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-arabesque
  id: n1
  cau: Arabesque là bài số 2 trong tập étude Op. 100 của Burgmüller.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n3
  cau: Bài dài khoảng một phút.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-arabesque
  id: n4
  cau: Bài có những chùm nốt chạy nhanh, hợp âm ngắn gọn và sắc thái đổi liên tục.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n5
  cau: Hình nốt chính là năm nốt liền bậc trong một thế tay, ở tốc độ Allegro.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n7
  cau: Ở đoạn giữa, tay trái chạy đúng hình nốt ấy.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n8
  cau: Bài có hợp âm ngắn, nốt kết câu ngắn, p đổi sang f nhanh và sf bất ngờ; tính cách scherzando nằm ở đó.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n9
  cau: Mỗi bài của Burgmüller trong Op. 100 có một cái tên gợi hình.
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n10
  cau: Bài khoảng một phút, dễ học thuộc, hợp để chơi cho người khác nghe.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-arabesque
  id: n11
  cau: Friedrich Burgmüller sinh năm 1806 ở Regensburg.
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n12
  cau: Burgmüller sinh trong một gia đình nhạc sĩ.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n13
  cau: Năm 1832 Burgmüller sang Paris.
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n14
  cau: Burgmüller sống ở Pháp đến cuối đời; ông dạy piano.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n15
  cau: Burgmüller viết nhiều nhạc salon cho người chơi nghiệp dư.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n16
  cau: Burgmüller viết nhạc cho vở ballet La Péri (1843).
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n17
  cau: Ngày nay tên Burgmüller gắn với ba tập étude cho người học, Op. 100, Op. 105 và Op. 109.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n18
  cau: 25 Études faciles et progressives, Op. 100 in năm 1851.
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n19
  cau: Op. 105 là 12 Études, Op. 109 là 18 Études.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n20
  cau: Tựa đề đầy đủ của Op. 100 nói các bài được soạn và ghi số ngón cho bàn tay nhỏ.
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n21
  cau: "Mỗi bài trong tập có một tựa tiếng Pháp gợi hình ảnh: sự ngây thơ, khúc đồng quê, dòng suối trong, cuộc săn."
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n22
  cau: Op. 100 đặc biệt phổ biến trong giáo trình piano ở Nhật Bản và ở nhiều nước khác.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n23
  cau: Arabesque vốn là tên một kiểu hoa văn trang trí gồm những đường cong uốn lượn đan vào nhau.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n24
  cau: Trong âm nhạc, chữ arabesque chỉ những bản nhạc có nét trang trí bay bổng.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n25
  cau: Schumann và Debussy cũng có bản Arabesque, không liên quan đến bài này.
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n26
  cau: Ở bài này, "hoa văn" là chùm năm nốt chạy lên xuống, cứ xuất hiện rồi biến mất.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n27
  cau: Scherzando nghĩa là "đùa vui".
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n29
  cau: Bài này được thu rất nhiều, cả bởi nghệ sĩ lẫn giáo viên.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-arabesque
  id: n31
  cau: "Dẫn nhập (2 ô): tay trái đánh hợp âm La thứ staccato, p; tay phải nghỉ."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n32
  cau: "Đoạn A: chùm năm nốt móc kép ở tay phải, p, leggiermente; mỗi chùm kết bằng một nốt móc đơn ngắn; to dần, sf ở cuối."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n33
  cau: Đoạn A (khoảng 8 ô) có dấu nhắc lại và hai kết khác nhau; tay phải chùm năm nốt kiểu La – Si – Đô – Si – La, La – Si – Đô – Rê – Mi; tay trái đệm hợp âm.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n34
  cau: "Đoạn B (khoảng 8 ô): f; hình nốt chạy chuyển xuống tay trái, có lúc lên khóa Sol; tay phải chơi nốt dài hơn (nốt đen chấm dôi, móc đơn); cuối đoạn dim. e poco rall."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n35
  cau: Risoluto nghĩa là quả quyết.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n36
  cau: "Đoạn A' (khoảng 8 ô): a tempo, p; hình nốt trở lại tay phải; có chỗ dolce (ngọt ngào)."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n37
  cau: "Đoạn B nhắc lại: tay trái lại chạy ở f; A' nhắc lại là lần cuối trước coda."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n38
  cau: "Coda (khoảng 5 ô): risoluto, f; chùm nốt dồn dập, chủ yếu ở tay phải, một lần ở tay trái; to dần; kết bằng hợp âm sf có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n39
  cau: B và A' được nhắc lại cùng nhau, nên hình dạng của bài là một hai đoạn có tái hiện thu nhỏ, mở đầu bằng hai ô dẫn nhập và khép lại bằng một coda ngắn.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n41
  cau: Thế tay của hình nốt chính ở tay phải là năm nốt từ La đến Mi (bàn phím vẽ G4–F5, tô A4 B4 C5 D5 E5).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n42
  cau: "Bảng Chỗ khó: chùm năm nốt đều (nốt yếu ngón 4); nốt kết chùm; hình nốt ở tay trái đoạn B, có đoạn đọc ở khóa Sol; hợp âm đệm nhẹ; đổi sắc thái nhanh; chậm lại rồi về tốc độ (cuối B, đầu A'); coda."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n49
  cau: "Bài tập 3 là kiểu kết cấu của đoạn B: tay trái chạy ở f, tay phải giữ những nốt dài hơn."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n52
  cau: Kế hoạch tuần 2 và lỗi thường gặp nói chỗ tay trái đổi khóa ở đoạn B.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n56
  cau: "Các chỉ dẫn trong bài: p, to dần, sf, f, dim. e poco rall., a tempo, dolce, risoluto."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n57
  cau: sf là nhấn đột ngột một nốt, không phải đổi cả đoạn sang f.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n59
  cau: Burgmüller tự ghi số ngón cho tập Op. 100.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n61
  cau: La candeur là số 1 của Op. 100, ở Đô trưởng, để luyện hát legato.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n62
  cau: "Cùng tập Op. 100: La pastorale (số 3), Le courant limpide (số 7), Ballade (số 15), Inquiétude (số 18), La tarentelle (số 20), La chevaleresque (số 25, bài kết tập)."
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n63
  cau: Le courant limpide có dòng nước chảy ở tay phải.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n64
  cau: Ballade (số 15) ở Đô thứ, có giai điệu ở tay trái.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n68
  cau: "Câu hỏi 1: ở đoạn B, hình nốt chạy chính chuyển xuống tay trái, có lúc lên tận khóa Sol; tay phải giữ những nốt dài hơn."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n69
  cau: "Câu hỏi 2: scherzando nghĩa là đùa vui; bài ở La thứ nhưng không buồn."
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n70
  cau: "Câu hỏi 3: sf yêu cầu nhấn đột ngột một nốt, không đổi cả đoạn sang f."
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n72
  cau: "Nguồn: IMSLP ghi lần in đầu (Paris: Benoît aîné, 1851) và tên các bài."
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n73
  cau: "Nguồn: bản dàn trang công cộng của L'Arabesque tại Mutopia; cấu trúc và chỉ dẫn sắc thái trên trang theo bản đó."
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n58
  cau: "Bàn đạp: không dùng, trừ có thể ở hợp âm cuối có dấu ngân; mọi sự liền tiếng đến từ ngón tay."
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-arabesque
  id: n30
  cau: "Cách nghe: bốn câu hỏi (độ nhẹ, ai đang chạy, đếm chỗ đổi sắc thái, tốc độ); nghe thêm vài bài khác trong Op. 100."
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-arabesque
  id: n71
  cau: "Câu hỏi 4: tập chùm năm nốt chậm với máy đếm nhịp, theo nhịp chấm dôi, dời trọng âm; nhấn nốt đầu chùm quá mạnh nghe giật cục."
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n1
  cau: Đây là valse dễ nhất của Chopin theo thang độ khó của Henle.
  loai: cap-do
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n2
  cau: Bài là một bản valse ngắn, không có số opus, chỉ được in sau khi Chopin mất.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n5
  cau: Bài có giai điệu hát, tay trái nhảy kiểu valse.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n6
  cau: "Tay trái valse: nốt trầm ở phách 1, hai hợp âm ở phách 2 và 3."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n7
  cau: Giai điệu đơn giản, có vài nốt hoa mỹ nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n9
  cau: Đoạn giữa chuyển sang La trưởng, cùng nốt chủ âm với La thứ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n10
  cau: Valse (waltz) là điệu nhảy nhịp 3 đến từ vùng nói tiếng Đức, điệu khiêu vũ thịnh hành nhất thế kỷ 19.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n11
  cau: Chopin sống ở Paris từ năm 1831.
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n12
  cau: "Valse của Chopin là nhạc để nghe hơn là để nhảy: ông giữ nhịp 3 và tay trái kiểu valse, nhưng thêm vào đó nỗi buồn, sự tinh tế và những chỗ co giãn nhịp."
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n13
  cau: "Lúc còn sống, Chopin chỉ cho in tám bản valse: Op. 18, ba bản Op. 34, Op. 42 và ba bản Op. 64."
  loai: so-lieu
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n14
  cau: Sau khi Chopin mất, người bạn Julian Fontana in thêm các bản Op. 69 và Op. 70 (1855).
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n15
  cau: Bài được in năm 1860 nhưng mang tên người khác, là số 3 của tập 4 Pièces pour piano đề tên Charlotte de Rothschild.
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n16
  cau: Năm 1955, bài được in trong tạp chí La Revue musicale và được công nhận là của Chopin.
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n17
  cau: Các ký hiệu B., KK, WN là số trong các danh mục tác phẩm Chopin do Maurice Brown, Krystyna Kobylańska và Ấn bản Quốc gia Ba Lan lập ra.
  loai: danh-muc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n18
  cau: Vì không có số opus, bài được gọi bằng một trong các số danh mục, hoặc "Valse La thứ (di cảo)".
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n20
  cau: Chopin còn có Valse La thứ Op. 34 số 2, một bản Lento khó hơn nhiều (Henle xếp mức 5, bài này mức 3).
  loai: cap-do
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n21
  cau: Năm 2024 có một bản valse La thứ rất ngắn được công bố từ một bản thảo tìm thấy ở Thư viện và Bảo tàng Morgan (New York).
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n22
  cau: Các album valse kinh điển thường gồm 14 bản quen thuộc, và bản này không nằm trong số đó.
  loai: so-lieu
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n26
  cau: "Đoạn A (La thứ, ô 1–16): giai điệu đơn giản, có nốt hoa mỹ nhỏ, trên tay trái valse; bốn câu 4 ô, mỗi câu hơi khác câu trước."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n27
  cau: "Đoạn B (ô 17–24, có nhắc lại): sôi nổi hơn, nổi bật với một hợp âm rải đi lên nhanh."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n28
  cau: "Đoạn A' (ô 25–32): câu đầu của chủ đề, rồi một câu đi lên (Rê♯, Fa♯, Sol♯) và dừng ở hợp âm át, mở đường sang La trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n29
  cau: "Đoạn C (La trưởng, ô 33–40): Đô♯ và Fa♯ thay cho Đô và Fa; A' và C nhắc lại cùng nhau."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n30
  cau: Đoạn C đứng ở vị trí của phần trio trong một bản valse thường.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n31
  cau: "Đoạn A'' (ô 41–52): chủ đề lần cuối, chỉ ba câu đầu; câu thứ ba khép bằng một kết."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n32
  cau: "Bài có 56 ô nhịp và một nhịp lấy đà; hai chỗ nhắc lại: đoạn B (ô 17–24) và ô 25–40 (A' và C); thứ tự nghe A – B – B – A' – C – A' – C – A'' – coda."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n33
  cau: "Coda (ô 53–56): ngắn, có một láy rền ở ô áp chót, khép lại ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n34
  cau: "Bảng Cấu trúc, hàng A'' và coda: chủ đề lần cuối, câu thứ ba khép bằng một kết; coda ngắn khép lại ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n35
  cau: Link "rondo" (/opus/hinh-thuc/rondo/); hình thức chủ đề quay lại xen kẽ với các đoạn khác là rondo.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n36
  cau: "Bảng Chỗ khó: bước nhảy tay trái chỉ có một phách; hai hợp âm (sáu nốt) dễ át một nốt giai điệu; nốt hoa mỹ; hợp âm rải đi lên ở đoạn B; bàn đạp mỗi ô; đoạn La trưởng có Đô♯, Fa♯; rubato."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n46
  cau: Allegretto là "hơi nhanh", không phải chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n56
  cau: Các học trò của Chopin kể rằng khi ông co giãn giai điệu, tay đệm vẫn giữ nhịp.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n59
  cau: Có ô mà hòa âm đổi giữa ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n62
  cau: Nhiều chuyên gia về Chopin, trong đó có Jean-Jacques Eigeldinger, cho rằng các nốt hoa mỹ nhỏ trong nhạc Chopin thường vào đúng phách, cùng lúc với nốt trầm.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n65
  cau: Valse Si thứ Op. 69 số 2 cũng in sau khi Chopin mất, dài hơn và giàu cảm xúc hơn; bước tiếp tự nhiên.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n71
  cau: "Câu hỏi 1: Valse La thứ B. 150 có hình thức rondo nhỏ A – B – A' – C – A'' và coda; đoạn C ở La trưởng đứng ở vị trí phần trio."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n73
  cau: "Câu hỏi 3: B. 150 là số trong danh mục tác phẩm Chopin của Maurice Brown; bài không có số opus nên được gọi bằng số danh mục B., KK hay WN."
  loai: danh-muc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n75
  cau: 'Nguồn: trang IMSLP ghi bản in đầu tiên "1860 in 4 Pièces pour piano by Charlotte de Rothschild (No.3)".'
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n77
  cau: "Nguồn: bản LilyPond chép theo bản thảo của Chopin ở Thư viện Quốc gia Pháp, kho rdj/music trên GitHub; cho 56 ô nhịp, dấu nhắc lại ở ô 17–24 và ô 25–40."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n78
  cau: "Nguồn: bản khắc của André Van Ryckeghem cho Werner Icking Music Archive (1999), nay có trên IMSLP, cũng cho 56 ô nhịp với cùng hai dấu nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n79
  cau: "Nguồn: Maurice J. E. Brown, Chopin: An Index of His Works in Chronological Order, Macmillan, 1960 (số B.)."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n80
  cau: "Nguồn: Krystyna Kobylańska, Frédéric Chopin: Thematisch-bibliographisches Werkverzeichnis, G. Henle Verlag, 1979 (số KK)."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n81
  cau: "Nguồn: Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by His Pupils, Cambridge University Press, 1986."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n82
  cau: "Nguồn: Chopin, Ấn bản Quốc gia Ba Lan (Wydanie Narodowe), biên tập Jan Ekier."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n44
  cau: Kế hoạch 5 tuần, 30–45 phút mỗi ngày, mốc máy đếm nhịp ♩ = 80–92 đến ♩ ≈ 120–138.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n40
  cau: "Bài tập 1: mỗi chữ Ped. là một lần đổi bàn đạp ngay sau nốt trầm; hợp âm dùng ngón 4-2-1 hoặc 5-3-1; nốt trầm sâu, hợp âm nhẹ; tập cả khi nhắm mắt."
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n57
  cau: "Rubato ở bài này: nán ở nốt cao nhất của câu hay ở một bước nhảy đẹp rồi trả lại thời gian; chậm lại nhẹ ở cuối đoạn A (câu thứ tư) trước đoạn B; không co giãn ở mọi ô."
  loai: khuyen-tap
- trang: piano/tac-pham/clementi-sonatina
  id: n1
  cau: Đây là một trong những bản sonatina được học nhiều nhất.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n2
  cau: Bài có ba chương ngắn, sáng sủa; chứa gam, hợp âm rải, hình đệm Alberti và một hình thức sonata thu nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n4
  cau: Chương I có đủ trình bày, phát triển và tái hiện trong 38 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n6
  cau: Gam lên xuống, hợp âm Đô trưởng rải, quãng tám gãy xuất hiện trong bài (link Gam, Hợp âm rải).
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n7
  cau: "Phát âm Cổ điển: dấu luyến ngắn, nốt staccato, nốt nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n9
  cau: Muzio Clementi sinh ở Roma năm 1752.
  loai: nam
- trang: piano/tac-pham/clementi-sonatina
  id: n10
  cau: Năm 1766, khi mới khoảng 14 tuổi, ông được một người Anh, Peter Beckford, đưa về Anh, và sống phần lớn đời mình ở London.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n11
  cau: Năm 1781 ở Vienna, Clementi và Mozart thi tài trước Hoàng đế Joseph II.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n12
  cau: Người đương thời khen ngón đàn điêu luyện của Clementi.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n13
  cau: Về sau Clementi chuyển sang dạy đàn, xuất bản nhạc và sản xuất đàn piano.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n14
  cau: Học trò của Clementi có John Field, người khởi xướng thể loại nocturne.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n15
  cau: Clementi viết sách Introduction to the Art of Playing on the Piano Forte (1801) và tuyển tập étude Gradus ad Parnassum.
  loai: nam
- trang: piano/tac-pham/clementi-sonatina
  id: n16
  cau: Sáu sonatina Op. 36 (1797) được sắp xếp tăng dần độ khó, từ số 1 Đô trưởng đến số 6 Rê trưởng.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n17
  cau: Số 1 là cửa vào của tập.
  loai: cap-do
- trang: piano/tac-pham/clementi-sonatina
  id: n18
  cau: "Sonatina là sonata nhỏ: ngắn hơn, ít chương hơn, kỹ thuật vừa phải, phần phát triển rất ngắn hoặc không có."
  loai: dinh-nghia
- trang: piano/tac-pham/clementi-sonatina
  id: n19
  cau: "Chương I theo đúng khuôn hình thức sonata nhưng thu gọn: phần trình bày đi từ Đô trưởng sang Sol trưởng (giọng át), phần phát triển chỉ 8 ô, phần tái hiện đưa mọi ý về lại Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n21
  cau: "Câu hỏi nghe: chương I dời sang Sol trưởng rồi ở tái hiện vang ở Đô trưởng; ở ô 16–23 nhạc tối lại (Đô thứ thoáng qua); lớp đệm chùm ba chương II; tốc độ chương III."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n23
  cau: "Bảng Theo dõi khi nghe, chương I, trình bày (ô 1–15): chủ đề rải hợp âm Đô trưởng rồi dừng ở Sol; dời sang Sol trưởng, có gam đi lên và nốt nhắc lại nhảy quãng tám trên nền Alberti; trình bày nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n24
  cau: "Phát triển (ô 16–23): chủ đề vang ở Sol rồi ở Đô thứ, Mi♭ làm nhạc tối lại; quãng tám gãy ở tay phải; dừng trên hợp âm át Sol."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n25
  cau: "Tái hiện (ô 24–38): chủ đề trở lại ở Đô trưởng, một câu nối mới, rồi chất liệu của ô 9–15 ở Đô trưởng; nếu giữ dấu nhắc lại thứ hai, phát triển và tái hiện vang thêm một lần."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n26
  cau: "Chương II (Andante), đoạn A (ô 1–8): Fa trưởng, giai điệu hát trên lớp chùm ba của tay trái; láy rền ở ô 3."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n27
  cau: "Đoạn B (ô 9–18): sang Đô trưởng, chùm ba chuyển lên tay phải; Mi♭ và Fa♯ làm nhạc tối lại rồi dẫn về Fa."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n28
  cau: "Đoạn A' (ô 19–26): giai điệu đầu trở lại, biến đổi nhẹ, kết bằng láy rền."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n29
  cau: "Chương III (Vivace), đoạn A: chủ đề 8 ô nhảy nhót ở Đô trưởng, vang hai lần; luyến hai nốt và staccato."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n30
  cau: "Đoạn B: Sol trưởng, chuỗi móc kép kiểu gam; hợp âm át bảy dẫn về."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n31
  cau: "Đoạn A và coda: chủ đề trở lại; câu kết 8 ô vang hai lần, rồi các hợp âm kết."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n32
  cau: "Bảng Cấu trúc, I. Trình bày ô 1–15 (nhắc lại), Đô trưởng → Sol trưởng: ô 1–4 chủ đề rải hợp âm Đô trưởng, dừng ở Sol; ô 5–8 sang Sol trưởng, kết bằng một gam đi lên; ô 9–15 nốt nhắc lại có nhảy quãng tám, gam, tay trái kiểu Alberti; kết ở Sol trưởng; chuyển từ nốt đen sang móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n33
  cau: "I. Phát triển ô 16–23, Sol, thoáng Đô thứ: chủ đề vang ở Sol rồi ở Đô thứ (Mi♭); quãng tám gãy ở tay phải (ô 20–21); dừng trên hợp âm át Sol."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n34
  cau: "I. Tái hiện ô 24–38 (nhắc lại cùng phát triển), Đô trưởng: chủ đề (ô 24–27), một câu nối mới (ô 28–31), rồi chất liệu của ô 9–15 ở Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n35
  cau: II. A ô 1–8 Fa trưởng; II. B ô 9–18 Đô trưởng rồi thoáng giọng thứ, chùm ba ở tay phải, Mi♭ và Fa♯; II. A' ô 19–26 Fa trưởng, kết bằng láy rền.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n36
  cau: III. A Đô trưởng, chủ đề 8 ô vang hai lần; III. B Sol trưởng, chuỗi móc kép kiểu gam, hợp âm át bảy dẫn về, Fa♯ rồi Fa♮; III. A và coda Đô trưởng, câu kết 8 ô vang hai lần, các hợp âm kết.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n38
  cau: "Bảng Chỗ khó: gam trong bài ở chương I ô 8, 10, 12, 31, 33 và chương III đoạn B."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n39
  cau: Nốt nhắc lại có nhảy quãng tám ở chương I ô 9, 11, 32, 34; tay trái kiểu Alberti ở cùng các ô đó.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n41
  cau: Chùm ba tay trái chương II; có chỗ tay phải chơi nhịp chấm dôi trên chùm ba.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n42
  cau: Láy rền chương II ở ô 3, 21, 25.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n43
  cau: Luyến hai nốt và staccato ở chương III; ở Vivace hai nốt luyến dễ thành đều nhau.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n47
  cau: "Chương I: tuyển tập Sonatina Album của nhà G. Schirmer (1893) ghi Spiritoso và nhịp 2/2."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n48
  cau: Nhiều ấn bản khác ghi tốc độ chương I là Allegro.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n50
  cau: "Trong sách dạy đàn năm 1801, Clementi khuyên: khi tác giả không ghi rõ, hãy chơi chủ yếu legato, và dành staccato để làm một số đoạn thêm sinh khí."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n52
  cau: Các ấn bản khác nhau về sắc thái.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n55
  cau: "Học tiếp: cùng tập Op. 36, số 2 Sol trưởng và số 3 Đô trưởng là bước tiếp tự nhiên; các số 4–6 khó dần."
  loai: cap-do
- trang: piano/tac-pham/clementi-sonatina
  id: n56
  cau: "Các tác giả sonatina khác: Friedrich Kuhlau (Sonatina Đô trưởng Op. 55 số 1), Anton Diabelli (các sonatina Op. 151 và Op. 168)."
  loai: danh-muc
- trang: piano/tac-pham/clementi-sonatina
  id: n58
  cau: "Câu hỏi 1: ở phần phát triển chương I (ô 16–23), nhạc tối lại vì chủ đề vang ở Đô thứ với Mi♭; giải thích: phát triển 8 ô, chủ đề ở Sol rồi Đô thứ, quãng tám gãy ở ô 20–21, dừng trên hợp âm át Sol trước tái hiện; lựa chọn sai: tay trái chuyển sang chùm ba, nhịp đổi sang 3/8."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n59
  cau: "Câu hỏi 2: sonatina khác sonata ở chỗ ngắn hơn, ít chương hơn, kỹ thuật vừa phải, phần phát triển rất ngắn hoặc không có; giải thích: chương I vẫn theo khuôn hình thức sonata, chỉ thu gọn."
  loai: dinh-nghia
- trang: piano/tac-pham/clementi-sonatina
  id: n62
  cau: "Mục Nguồn: IMSLP, trang 6 Piano Sonatinas, Op.36: thông tin lần in đầu (London: Longman & Broderip, 1797)."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n63
  cau: "Mục Nguồn: Dizionario Biografico degli Italiani (Treccani); Henle HN 848, lời nói đầu; Clementi, Introduction to the Art of Playing on the Piano Forte, London, 1801, câu về legato đọc ở một lần in khoảng thập niên 1810."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n64
  cau: "Mục Nguồn: Sonatina Album, G. Schirmer, 1893, bản dàn trang công cộng tại Mutopia Project (số ô nhịp trên trang này theo bản đó); bản nhạc IMSLP; link tài liệu tham khảo."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n22
  cau: "Nghe thêm bản trên fortepiano (đàn piano thời Clementi): tiếng mỏng và rõ hơn."
  loai: khuyen-tap
- trang: piano/tac-pham/clementi-sonatina
  id: n40
  cau: "Quãng tám gãy ở chương I ô 20–21: cổ tay dễ cứng, mỏi; xoay cổ tay, nhỏ và đều, dừng nghỉ nếu thấy căng."
  loai: khuyen-tap
- trang: piano/tac-pham/clementi-sonatina
  id: n51
  cau: Nhạc Cổ điển không phải chuỗi nốt tách rời; gam chơi liền và đều; dấu luyến ngắn kết bằng cái nhấc tay nhẹ; staccato ngắn nhưng không khô.
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n1
  cau: Cầu nguyện buổi sáng là bài mở đầu Album for the Young của Tchaikovsky và chỉ có 24 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n2
  cau: "Bài viết như một bài hát nhà thờ cho bốn giọng: chậm, khẽ, các nốt nối liền nhau."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n4
  cau: Tay phải giữ bè trên (soprano) và bè alto, tay trái giữ bè tenor và bè trầm.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n7
  cau: Hòa âm đổi gần như mỗi phách.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n9
  cau: Ở coda, tay trái vừa lặp một nốt Sol trầm, vừa giữ một bè giữa đang di chuyển; link "Âm ngoài hợp âm" (/opus/nhac-ly/18-am-ngoai-hop-am/).
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n10
  cau: Bài chưa đến hai phút.
  loai: so-lieu
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n11
  cau: Bài có một cao trào, một vòng quãng năm và những hợp âm mượn màu thứ.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n12
  cau: Tháng 2 năm 1878, khi đang ở Florence, Tchaikovsky viết cho nhà xuất bản Pyotr Jurgenson rằng ông muốn soạn một loạt bài dễ.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n13
  cau: Kamenka là điền trang của gia đình em gái Tchaikovsky, Aleksandra Davydova, ở Ukraina; ông trở về Kamenka (tháng 4/1878).
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n14
  cau: Ở Kamenka, Tchaikovsky phác thảo xong cả 24 bài vào đầu tháng 5, rồi sửa và chép sạch vào mùa hè.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n15
  cau: Trong thư gửi Nadezhda von Meck, người bảo trợ của mình, Tchaikovsky nói muốn có những bản nhạc nhỏ với tên gọi hấp dẫn, như của Schumann.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n16
  cau: Bản in mang phụ đề 24 bài dễ (theo kiểu Schumann).
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n17
  cau: Hình mẫu là tập Album für die Jugend mà Schumann viết cho các con năm 1848.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n19
  cau: Tập nhạc được đề tặng Vladimir ("Volodya") Davydov, con trai cô em gái, đứa cháu Tchaikovsky yêu quý nhất.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n20
  cau: Mười lăm năm sau, Tchaikovsky đề tặng chính người cháu này Giao hưởng số 6 Pathétique.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n21
  cau: Trong bản in, tập mở đầu bằng Cầu nguyện buổi sáng và khép lại bằng Trong nhà thờ (В церкви, số 24); ở giữa có búp bê, ngựa gỗ, lính gỗ, bài hát của nhiều xứ, chuyện cổ tích, mụ phù thủy Baba Yaga.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n22
  cau: Thứ tự trong bản viết tay hơi khác (Trong nhà thờ đứng áp chót), nhưng Cầu nguyện buổi sáng vẫn đứng đầu, nên con số 1 không đổi; Bài ca Pháp cổ mang số 16.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n23
  cau: Cũng trong tháng 5 và tháng 6 năm 1878, Tchaikovsky viết Phụng vụ thánh Gioan Kim Khẩu (Op. 41), nhạc lễ Chính thống giáo Nga cho hợp xướng bốn bè không nhạc đệm.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n27
  cau: Ở ô 5–8, bè trầm leo lên từng bậc, có chỗ từng nửa cung.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n28
  cau: Từ ô 16, bè trầm lặp một nốt Sol bằng móc đơn; trên nền ấy có hợp âm nghe "tối" hẳn đi.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n29
  cau: "Câu 1, nửa đầu (ô 1–4): bốn bè đi chậm bằng nốt đen; nửa câu dừng trên hợp âm Si trưởng (ô 4), hợp âm át của Mi thứ; bè alto lặp nốt Sol; Rê♯ ở bè alto ô 4."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n30
  cau: "Câu 1, nửa sau (ô 5–8): bè trầm đi Sol♯ – La – Sol, rồi leo từng bậc Fa♯ – Sol – La – Si – Đô – Đô♯ – Rê; nhạc nghiêng sang Rê trưởng và kết ở đó."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n31
  cau: "Ô 5–8: chuỗi hợp âm bảy (Mi bảy, La bảy, Rê bảy), rồi La bảy ở thể đảo dẫn về Rê: kết chưa trọn ở Rê trưởng (ô 8)."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n32
  cau: Ở ô 8, Sol của bè alto là nốt treo, rồi xuống Fa♯.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n33
  cau: "Câu 2 (ô 9–11): bắt đầu giống hệt ô 1; Fa♮ ở ô 10 tạo hợp âm Sol bảy, dẫn sang Đô trưởng (ô 11); tay phải đi lên trong khi bè tenor tách ra, đi xuống Fa♮ – Mi – Rê – Đô – Si – La♯."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n34
  cau: "Cao trào (ô 12–14): Fa♯ trưởng ở ô 12, rồi vòng quãng năm Si – Mi – La – Rê – Sol – Đô, nhạc dịu dần; đỉnh f ở ô 12."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n35
  cau: Ở ô 12, hợp âm Fa♯ trưởng có f và dấu nhấn, đỉnh của câu 2.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n36
  cau: "Kết câu 2 (ô 15–16): ii6/5 – V7 – I, kết trọn ở Sol trưởng; bè trên Si – La – La – Fa♯ – Sol."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n37
  cau: "Coda lần một (ô 16–18): bè trầm bắt đầu lặp Sol bằng móc đơn; một hợp âm bảy giảm Fa♯ – La – Đô – Mi♭ trên nền Sol (ô 17) rồi sáng lại ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n38
  cau: "Coda lần hai (ô 18–20): câu nhỏ ấy nhắc lại thấp hơn một quãng tám, khẽ hơn (mf)."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n39
  cau: "Kết (ô 21–24): thêm một hợp âm bảy giảm (Đô♯), hợp âm át (Rê bảy), rồi Sol trưởng pp ngân dài."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n40
  cau: "Bài không có dấu nhắc lại; hai câu tám ô bắt đầu giống nhau rồi rẽ hai ngả: câu 1 dừng ở Rê trưởng (giọng át), câu 2 lên cao trào rồi về Sol trưởng; coda đứng trên một nốt Sol trầm lặp lại suốt tám ô."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n41
  cau: "Bảng Cấu trúc, cột Điều cần chú ý: mỗi tay có hai bè khác nhịp (ô 5–8); để dành tiếng to nhất cho ô 12; lấy hơi trước coda; Sol trầm nhẹ, đều; Mi♭ là màu mượn từ Sol thứ; hợp âm cuối pp."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n44
  cau: Đoạn nhạc trên khuông theo ấn bản Schirmer (New York, 1904), qua bản dàn trang LilyPond công cộng của Mutopia Project; dấu p theo bản ấy; số ngón phần lớn lấy từ bản Schirmer.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n45
  cau: Ở ô 1–4 mỗi tay đánh hai nốt một lúc; bè alto lặp Sol; từ ô 1 sang ô 2, ngón cái có thể trượt từ phím đen Fa♯ sang phím trắng Sol.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n46
  cau: "Ở ô 5–8: tay phải giữ Đô♯ (ô 5) và Sol (phách 3 ô 7) bên dưới bè trên; tay trái đánh lại Mi, Rê ở phách 2 (ô 5, 6) và giữ chúng trong khi bè trầm leo lên; ở ô 8, bè trên giữ La suốt ô, còn bè dưới đi Sol – Fa♯ – Mi – Fa♯."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n47
  cau: "Bảng Chỗ khó: bè alto dễ to hơn giai điệu vì ngón 4–5 yếu hơn ngón cái; nốt lặp ở bè alto (Sol ở ô 1–2 và 9–11); ngón cái bận ở bè alto nên bè trên chỉ còn ngón 2–5; hai bè trong một tay (ô 5–8, coda); lên cao trào (ô 10–12); âm nền và bè giữa ở coda (ô 16–24); hòa âm đổi gần như mỗi phách."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n49
  cau: "Bản Schirmer ghi đổi ngón ở ô 17: đánh Đô bằng ngón cái rồi đổi sang ngón út, để Si (ngón 4) và La đi xuống tiếp mà vẫn liền."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n57
  cau: Trong bài thật, bè giữa ở coda đi Rê – Mi♭ – Rê; thay Mi bằng Mi♭ ở ô 2 của bài tập thì hợp âm Đô trưởng thành Đô thứ và tối hẳn đi; đó là màu mượn từ Sol thứ; link "Hợp âm mượn".
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n60
  cau: Tchaikovsky ghi Andante; một số bản in cũ, như bản Schirmer 1904, in Lento.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n64
  cau: Bản Schirmer ghi p ở đầu, lớn dần tới f ở ô 12; khi coda bắt đầu lại có f, rồi mf ở lần nhắc thấp hơn, dim. và pp ở hợp âm cuối.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n66
  cau: Bản Schirmer chỉ ghi bàn đạp ở ba ô cuối, để giữ Sol trầm và hợp âm cuối ngân.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n69
  cau: Bản nhạc phổ biến trên mạng thường là các bản in cũ, với tốc độ, sắc thái và số ngón của người biên tập; bản Schirmer đổi Andante thành Lento là một ví dụ.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n74
  cau: "Câu hỏi 1: bài gồm hai câu tám ô, rồi một coda tám ô trên âm nền Sol; 24 ô, không dấu nhắc lại; câu 1 kết ở Rê trưởng, câu 2 lên cao trào ở ô 12 rồi kết ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n76
  cau: "Câu hỏi 3: câu 1 (ô 1–8) kết ở Rê trưởng, giọng át của Sol trưởng; ở ô 8, hợp âm La bảy dẫn về Rê trưởng, với nốt treo Sol xuống Fa♯ ở bè alto; Sol trưởng chỉ trở về hẳn ở ô 16."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n77
  cau: "Câu hỏi 4: âm nền ở coda là nốt Sol trầm lặp đều bằng móc đơn trong khi hòa âm phía trên thay đổi; tay trái vừa lặp Sol bằng ngón 5, vừa giữ bè giữa Rê – Mi♭ – Rê."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n78
  cau: "Nguồn: Tchaikovsky Research, \"Children's Album\": thời gian và nơi sáng tác, lời đề tặng, thứ tự trong bản viết tay, chỉ dẫn Andante, số ô nhịp, các ấn bản toàn tập."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n79
  cau: "Nguồn: ấn bản Schirmer (1904), bản dàn trang LilyPond công cộng của Mutopia Project (người nhập: Rem Zolotykh): nguồn của đoạn nhạc, sắc thái, bàn đạp và phần lớn số ngón."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n55
  cau: "Bài tập 2, các bước: chơi riêng từng bè và hát; ghép hai bè ngoài, rồi từng tay, rồi bốn bè; thêm bàn đạp nối ở mỗi chữ Ped., đổi đúng lúc Fa♯ vào."
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n65
  cau: f ở đây là tiếng cả dàn hợp xướng hát to, không phải tiếng dàn nhạc; sắc thái ở các ấn bản có thể khác nhau; một đỉnh ở ô 12, và coda tắt dần.
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n48
  cau: "Cách tập ở bảng Chỗ khó: chơi bè trên một mình rồi thêm bè dưới khẽ; ngón cái sát mặt phím; đổi ngón trên phím; tập riêng từng bè; lớn dần từ ô 10, f bằng sức nặng cánh tay; ngón 5 lặp Sol nhẹ; tập không bàn đạp trước, nếu dùng thì bàn đạp nối, nông, đổi mỗi hợp âm."
  loai: khuyen-tap
