# Sửa dữ liệu đề xuất ở lượt 1, phần A của D6-L1 (src/data/ chưa sửa). Mỗi mục: bản ghi, trường, giá trị cũ và mới, nhận định trong hồ sơ, nguồn, lý do.
# Phần A không thấy chỗ sai; hai mục dưới là chỗ chưa kiểm được (ket_qua: null), đề xuất bỏ nếu lượt 2 cũng không tìm được nguồn bậc 1–2 cho ấn bản Peters 1880.
- ban_ghi: tac-pham/minuet-sol
  truong: thong_tin
  cu: "[Sáng tác / xuất bản, 'Hai minuet hợp thành một chương (một cặp minuet, chơi Sol trưởng, Sol thứ rồi Sol trưởng lần nữa) trong một tổ khúc cho harpsichord của Petzold. Anna Magdalena Bach chép chúng vào cuốn sổ tay năm 1725 của bà (bài số 4 và 5). Được in từ cuối thế kỷ 19: C. F. Peters (1880), ấn bản toàn tập Bach-Gesellschaft (1894)']"
  moi: "[Sáng tác / xuất bản, 'Hai minuet hợp thành một chương (một cặp minuet, chơi Sol trưởng, Sol thứ rồi Sol trưởng lần nữa) trong một tổ khúc cho harpsichord của Petzold. Anna Magdalena Bach chép chúng vào cuốn sổ tay năm 1725 của bà (bài số 4 và 5). Được in từ cuối thế kỷ 19, như trong ấn bản toàn tập Bach-Gesellschaft (1894)']"
  nhan_dinh: n20
  nguon:
    - https://imslp.org/wiki/Minuet_in_G_major,_BWV_Anh.114_(Pezold,_Christian)
  ly_do: 'Chưa chắc, không phải sai: ấn bản C. F. Peters 1880 chỉ thấy ở Wikipedia (dẫn Czerny, Griepenkerl, Roitzsch 1880); IMSLP Anh. 114 và Anh. 115 không liệt kê; BG Bd. 43.2 (1894) có trên IMSLP. Áp dụng chỉ khi lượt 2 không tìm được nguồn. Chữ hiện trên trang qua ::hop-tac-pham (bảng Thông tin, dòng "Sáng tác / xuất bản"): chữ mới đầy đủ như moi.'
