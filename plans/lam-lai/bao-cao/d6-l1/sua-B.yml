  ly_do: 'Đoạn b của số 10 (Fröhlicher Landmann) dài 6 ô (Mutopia 659 ô 9–14; hinh.bai-hoc của chính bản ghi ghi "6 ô"), nên "các câu 4 ô" không đúng cho cả ba bài. Chữ hiện trên trang qua ::hop-tac-pham (bảng Thông tin, dòng Hình thức): chữ mới đầy đủ là "Mỗi bài là một hình thức nhỏ dựng từ các câu ngắn, phần lớn 4 ô (xem Cấu trúc)". Trang đã sửa câu tương tự ở mục Cấu trúc (hồ sơ trang n47).'
