  ly_do: 'Bản Schirmer 1904 (Mutopia 2032): coda mở bằng \f (b''\f, phách 3 ô 16), \mf ô 18, \dim ô 20, \pp chỉ ở hợp âm cuối ô 24. Nhãn "pp" cho cả coda sai với bản nhạc và với chính trang bài học (bảng Cấu trúc, mục Sắc thái nói f, mf, dim., pp). Chữ hiện trên trang qua ::hinh-cau-truc: người giao thêm doi_chu cho trang sau khi áp (nếu so-chu.mjs so chữ của hình).'
