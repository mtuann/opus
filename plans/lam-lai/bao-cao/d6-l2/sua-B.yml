  ly_do: 'Bài có trong đề cương chính thức (ABRSM 2019–2020 Grade 2, trang 16; RCM 2022 Level 3, trang 31), nên "(ước lượng)" không đúng; Henle HN 1726 xếp "2. Arabesque" mức 1. Giữ "khoảng Grade 3" cho khớp grade đã khóa (Grade 3) và chip "≈ Grade 3"; cùng kiểu dòng Độ khó của chopin-valse-la-thu và tchaikovsky-cau-nguyen-buoi-sang (D2-0). Chữ hiện trên trang qua ::hop-tac-pham (bảng Thông tin, dòng Độ khó): người giao thêm doi_chu cho trang piano/tac-pham/burgmuller-arabesque sau khi áp.'
