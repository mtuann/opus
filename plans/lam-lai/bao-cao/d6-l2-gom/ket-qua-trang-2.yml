  nguon: ["https://archive.org/details/waltzes00chop"]
  ghi_chu: "Vế 'bản này không nằm trong số đó' đúng: bản này đến năm 1955 mới được in dưới tên Chopin (Henle). Nhưng con số 14 chưa xác nhận được: tập Waltzes của Schirmer (Joseffy, 1915) mà tôi mở có 15 bản (thêm Mi thứ và Mi trưởng di cảo), Henle HN 131 có 19 bản. Chưa thấy nguồn nói album 'thường' gồm 14 bản."
