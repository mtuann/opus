- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n4
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: khuông trên viết hai bè (soprano, alto), khuông dưới hai bè (tenor, bass), ví dụ ô 5–8 dùng << \\\\ >> ở cả hai tay."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n7
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "Tự phân tích từ nốt: ô 3 D–Em–Am/C, ô 5 E7–A–A7/G, ô 6 D7–G–D7/A, ô 7 G/B–C–A7/C#, ô 13 B7/A–E–A7/G… hầu hết mỗi phách một hợp âm."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n9
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: tay trái ô 16–21 móc đơn Sol (G2) lặp, cùng lúc bè giữa Rê – Mi♭ – Rê – Đô – Si – Si♭ – La. Phần link là về site, không kiểm."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n10
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Children's_Album,_Op.39_(Tchaikovsky,_Pyotr)"]
  ghi_chu: "Danh sách bản thu (Naxos) trên trang IMSLP: No. 1 Morning Prayer dài 68–107 giây (10 bản thu), đều dưới 2 phút; 24 ô 3/4 ở ♩≈60 cũng khoảng 75 giây."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n11
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: cao trào ô 12 (Fa♯ trưởng, f, dấu nhấn); ô 13–14 B7–E–A7–D–G–C (vòng quãng năm); coda có Mi♭ (Đô thứ, bảy giảm Fa♯) mượn từ Sol thứ."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n12
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album"]
  ghi_chu: "TR: 'while staying in Florence on 14/26 February, Tchaikovsky told Pyotr Jurgenson that he wanted \"to write a number of easy pieces\"' (thư 761)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n13
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Kamenka", "https://en.tchaikovsky-research.net/pages/Children's_Album"]
  ghi_chu: "TR Kamenka: ở Ukraina, là nhà của em gái Aleksandra và chồng Lev Davydov, người quản lý điền trang của gia đình ở đó; chuyến 11/23 tháng 4 1878. Trang Children's Album: 'after his return to Kamenka in April'."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n14
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album", "https://en.tchaikovsky-research.net/pages/Kamenka"]
  ghi_chu: "TR: phác thảo xong cả 24 bài ngày 4/16 tháng 5 (ở Kamenka); sửa từ cuối tháng 6, chép sạch từ 13/25 đến 20 tháng 7/1 tháng 8. Lưu ý: TR ghi việc sửa và chép sạch ở Verbovka (điền trang gần Kamenka), nên 'ở Kamenka' chỉ đúng cho phần phác thảo."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n15
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album"]
  ghi_chu: "TR, thư 820 gửi von Meck 30/4–12/5/1878: 'a series of little individual pieces just for children, and with an attractive title, like Schumann's'."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n16
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album"]
  ghi_chu: "TR: 'subtitled \"24 simple pieces à la Schumann\"'."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n17
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Album_f%C3%BCr_die_Jugend,_Op.68_(Schumann,_Robert)", "https://www.schumann-portal.de/album-fuer-die-jugend-op-68.html"]
  ghi_chu: "IMSLP: Op. 68 sáng tác 1848, in 1849. Schumann-Portal: ban đầu là quà sinh nhật cho con gái lớn Marie, rồi mở rộng thành tập bài cho trẻ học đàn. TR nói Tchaikovsky muốn làm 'like Schumann's'."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n19
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album", "https://en.tchaikovsky-research.net/pages/Vladimir_Davydov"]
  ghi_chu: "TR: đề tặng 'favourite nephew, Vladimir Davydov'; thư ghi 'Dedicated to Volodya Davydov'; trang Vladimir Davydov: con trai thứ hai của em gái Aleksandra."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n20
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Symphony_No._6"]
  ghi_chu: "TR: Giao hưởng số 6 (Pathétique) viết 1893, 'dedicated to the composer's nephew, Vladimir Davydov'; 1878 + 15 = 1893."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n21
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album"]
  ghi_chu: "TR, danh sách 24 bài: số 1 Morning Prayer, số 24 In Church (В церкви); giữa có các bài búp bê, Playing Hobby-Horses, March of the Wooden Soldiers, bài hát Nga, Ý, Pháp, Đức, Napoli, Nanny's Story, The Sorcerer (Баба-Яга)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n22
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album"]
  ghi_chu: "TR: thứ tự bản viết tay 1, 2, 4, 3, 5, 9, 6, 7, 8, 14, 10, 11, 12, 13, 15, 16, …, 22, 24, 23: số 1 đứng đầu, số 24 đứng áp chót, vị trí 16 là số 16 (Old French Song)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n23
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Liturgy_of_Saint_John_Chrysostom"]
  ghi_chu: "TR: Op. 41, phụng vụ Chính thống giáo Nga cho 'unaccompanied mixed chorus (SATB)', sáng tác 4/16 tháng 5 – 27 tháng 5/8 tháng 6 năm 1878."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n27
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY bè trầm: ô 5 G♯2–A2–G2, ô 6 F♯2–G2–A2, ô 7 B2–C3–C♯3, ô 8 D3: leo từng bậc, nửa cung ở Si–Đô–Đô♯–Rê."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n28
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: từ ô 16 (sau g,8) bè trầm g8 lặp tới hết ô 21, rồi g2. ngân; ô 17 và 19 có Mi♭ (Đô thứ, bảy giảm Fa♯) trên nền Sol."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n29
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: ô 1–4 chủ yếu nốt đen; alto Sol–Sol–Fa♯ | Sol–Sol; ô 4 tay phải Rê♯4–Si4, tay trái Si2–Fa♯3 = Si trưởng, đứng sau D–Em–Am/C (ô 3), tức hợp âm át của Mi thứ."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n30
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY bè trầm ô 5–8: G♯ A G | F♯ G A | B C C♯ | D; ô 7 phách 3 La bảy (Đô♯ ở bè trầm) về Rê trưởng ô 8."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n31
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "Tự phân tích: ô 5 E7/G♯ – A – A7/G; ô 6 D7/F♯ – G – D7/A; ô 7 G/B – C – A7/C♯; ô 8 Rê trưởng, bè trên La (không phải chủ âm) nên là kết chưa trọn."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n32
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY ô 8 bè alto: g4( fis8 e8 fis4); Sol đã có ở phách 3 ô 7, đánh lại trên hợp âm Rê rồi xuống Fa♯ (nốt treo đánh lại)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n33
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: ô 9 giống ô 1 (cả p); ô 10 phách 3 tay trái f' (Fa♮4) dưới Sol–Si = Sol bảy; ô 11 Đô trưởng (phách 1 và 3); bè trên Đô–Si–Si | Đô–Rê–Mi đi lên, bè tenor Fa–Mi–Rê–Đô–Si–La♯ (ô 10–12)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n34
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: ô 12 La♯3–Fa♯4–Đô♯5–Fa♯5, f và dấu nhấn; ô 13 B7/A – E – A7/G (có dấu nhỏ dần), ô 14 D/F♯ – G – C/E: vòng quãng năm Si–Mi–La–Rê–Sol–Đô."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n35
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY ô 12: <fis'>2->_\\f trên <fis, cis'>2. và La♯ ở tay trái = Fa♯ trưởng; Fa♯5 là nốt cao nhất của câu 2."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n36
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY ô 15: trầm Đô3, Sol3, Mi4, bè trên Si(8.)–La(16)–La = ii6/5; phách 3 trầm Rê, alto Rê–Đô, bè trên Fa♯ = V7; ô 16 Sol trưởng gốc, bè trên Sol: kết trọn."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n37
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: ô 16 bè trầm bắt đầu móc đơn Sol; ô 17 tay phải Fa♯5, Đô5, La4, tay trái Mi♭3 trên Sol2 (Fa♯–La–Đô–Mi♭); ô 18 về Sol trưởng."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n38
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: lần một bắt đầu phách 3 ô 16 (Sol5/Si4, f); lần hai phách 3 ô 18 (Sol4/Si3, mf), ô 19 lặp ô 17 thấp một quãng tám; ô 20 đã khác (G – C/G – G)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n39
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY ô 21: Đô♯4–Mi4 trên Si♭2 và Sol2 (bảy giảm Đô♯), phách 3 Đô4–Fa♯4 trên La2 (Rê bảy thiếu nốt gốc); ô 22–24 Sol trưởng, pp ở hợp âm cuối."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n40
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: không có \\repeat hay vạch nhắc lại; ô 1 và 9 giống nhau; ô 8 Rê trưởng, ô 16 Sol trưởng; Sol trầm từ ô 16 đến 24 (móc đơn ô 16–21, ngân ô 22–24), coda tính ô 17–24 là tám ô."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n41
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: ô 5–8 mỗi tay hai bè với nhịp khác nhau; đỉnh f ở ô 12; Mi♭ ở bè giữa coda (giọng Sol thứ có Mi♭); hợp âm cuối pp. Phần còn lại là lời khuyên hợp lý."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n44
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=2032", "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly", "https://imslp.org/wiki/Children's_Album,_Op.39_(Tchaikovsky,_Pyotr)"]
  ghi_chu: "Mutopia: Source 'Schirmer, 1904', license Public Domain, có số ngón ('with finger notation'), dấu p ô 1. IMSLP: ấn bản Ruthardt, 'New York: G. Schirmer, 1904. Plate 17224'. Việc số ngón trên trang lấy từ đâu là chuyện của site, không kiểm."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n45
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: ô 1–4 mỗi tay hai nốt (<g b>, <g d'>…); alto Sol lặp ô 1–2; ô 1 cuối <fis-1 a-2>8, ô 2 <g-1 c-4>: ngón cái Fa♯ sang Sol."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n46
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: ô 5 alto d4 cis2 (Đô♯ ngân), ô 7 alto g ở phách 3 dưới e'8. a16; tay trái {e4 e2}, {d'4 d2} đánh lại phách 2 và ngân; ô 8 bè trên a2., alto g4 fis8 e8 fis4."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n47
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: alto Sol lặp ô 1–2 và 9–11; hai bè một tay ô 5–8 và coda; cresc. từ ô 10 tới f ô 12; Sol trầm và bè giữa ô 16–24; hòa âm đổi gần mỗi phách. Phần ngón tay là nhận xét kỹ thuật hợp lý."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n49
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY ô 17 bè trên: fis'8.-4 c16-2 c4\\finger \"1~5\" b8-4 a: Đô đổi ngón 1 sang 5, rồi Si ngón 4, La."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n57
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: bè giữa coda d4 … ees2. d4 (Rê–Mi♭–Rê). Đô–Mi♭–Sol là Đô thứ, hợp âm iv của Sol thứ, nên là màu mượn. Phần bài tập và link là về site."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n60
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album", "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "TR: 'Morning Prayer — Andante (G major, 24 bars)'. LY (Schirmer 1904): \\tempo \"Lento.\"."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n64
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: p ô 1, f ô 12, f phách 3 ô 16 (đầu coda), mf phách 3 ô 18, \\dim ô 20, pp ô 24. Câu tóm tắt bỏ qua mf ở ô 8 và p lại ở ô 9 (cùng các dấu < > ngắn), nhưng không nói sai."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n66
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: \\sustainOn và \\sustainOff chỉ có một lần, trên g2. ô 22 đến ô 24 (Sol trầm ngân, hợp âm cuối)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n69
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album", "https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly", "https://imslp.org/wiki/Children's_Album,_Op.39_(Tchaikovsky,_Pyotr)"]
  ghi_chu: "TR ghi Andante, bản Schirmer 1904 (người biên tập Adolf Ruthardt theo IMSLP) ghi Lento, có số ngón; IMSLP chủ yếu có bản in cũ (Jurgenson, Schirmer, Ricordi…)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n74
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: 24 ô, không có dấu nhắc lại; câu 1 (ô 1–8) kết Rê trưởng, câu 2 (ô 9–16) cao trào ô 12, kết Sol trưởng ô 16; Sol trầm ở coda."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n76
  luot_2: sai
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: La bảy (thể đảo, Đô♯ ở bè trầm: <cis a'>, alto Sol, bè trên Mi–La) nằm ở phách 3 ô 7; ô 8 toàn là Rê trưởng (bè trầm Rê, nốt treo Sol–Fa♯ ở alto), không có Đô♯. Phần còn lại đúng (n31 viết đúng chỗ này)."
  cau_dung: "Câu hỏi 3: câu 1 (ô 1–8) kết ở Rê trưởng, giọng át của Sol trưởng; hợp âm La bảy ở phách 3 ô 7 dẫn về Rê trưởng ở ô 8, với nốt treo Sol xuống Fa♯ ở bè alto; Sol trưởng chỉ trở về hẳn ở ô 16."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n77
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/TchaikovskyPI/O39/01MorningPrayer/01MorningPrayer.ly"]
  ghi_chu: "LY: Sol trầm móc đơn ô 16–21 dưới hòa âm đổi; bè giữa Rê – Mi♭ – Rê ở tay trái. Ngón 5 cho Sol là cách bấm tự nhiên; riêng ô 21 bản Schirmer ghi g8-4 (ngón 4, dưới Si♭ ngón 2)."
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n78
  luot_2: dung
  nguon: ["https://en.tchaikovsky-research.net/pages/Children's_Album"]
  ghi_chu: "Trang TR có đủ: sáng tác tháng 5–7/1878 (Florence, Kamenka, Verbovka), lời đề tặng Vladimir Davydov, thứ tự bản viết tay, Andante và 24 ô, toàn tập tập 52 (1948) và 69b (2001)."
