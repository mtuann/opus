  ghi_chu: "Schott: ở Paris dạy rất nhiều học trò; từ 1855 lui về Beaulieu gần Fontainebleau và mất ở đó năm 1874. Deutsche Biographie: nơi mất Beaulieu, nghề có 'Musiklehrer'. Staatsoper: 'piano teacher', nhập quốc tịch Pháp 1842."
