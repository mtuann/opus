  ghi_chu: "ADB (mục August Friedrich Burgmüller): cha là nhạc trưởng thành phố Düsseldorf, nhà soạn nhạc, 'ist der Vater von Friedrich und Norbert B.'; em Norbert là nhà soạn nhạc. Staatsoper: học nghề nhạc từ cha."
