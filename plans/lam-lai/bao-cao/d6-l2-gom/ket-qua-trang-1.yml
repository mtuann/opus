  ghi_chu: "BnF: 'Installé à Paris en 1832'; Naxos GP816: 'In 1832 … settled in Paris'; Staatsoper: 'Around 1832'. Riêng lời tựa Schott ghi 1834 ('1834 wandte er sich nach Paris'); đa số nguồn, gồm BnF, ghi 1832."
- trang: piano/tac-pham/burgmuller-arabesque
