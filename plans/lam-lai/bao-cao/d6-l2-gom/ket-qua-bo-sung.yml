- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n59
  luot_2: dung
  nguon: ["https://imslp.org/wiki/2_Sonatinas_for_Piano,_Anh.5_(Beethoven,_Ludwig_van)", "https://www.deutsche-digitale-bibliothek.de/item/JV7MFKMQMIV4RQ3NPSVI3FM33CDLJ4CE?lang=en", "https://api.digitale-sammlungen.de/iiif/image/v2/bsb00042398_00001/full/1200,/0/default.jpg"]
  ghi_chu: "Bản scan BSB (bsb00042398) của toàn tập Breitkopf & Härtel, Serie 16 No. 160 (B.160, [1862–65]), tr. 183: 'Zwei leichte Sonaten für das Pianoforte von L. van Beethoven', đánh số 'Sonate No. 37', chỉ ghi 'Original-Verleger: Aug. Cranz in Hamburg', không có chú thích nào về tác giả. IMSLP liệt kê thêm nhiều bản in khác dưới tên Beethoven (Gressler, Musicord 1946…) và ghi 'Beethoven's authorship of this work is now considered unlikely'."
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n22
  luot_2: dung
  nguon: ["https://www.qobuz.com/co-es/album/chopin-waltzes-dinu-lipatti/5099996593059"]
  ghi_chu: "Album Chopin: Waltzes của Lipatti (thu tháng 7/1950, EMI/Warner) gồm 14 valse: Op. 18, 34 số 1–3, 42, 64 số 1–3, 69 số 1–2, 70 số 1–3, Mi thứ di cảo. Bản La thứ duy nhất là Op. 34 số 2; không có valse La thứ B. 150."
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n62
  luot_2: dung
  nguon: ["https://www.chopin-nationaledition.com/wp-content/uploads/2022/06/waltzes-B_commentaries_poprawka2020.pdf"]
  ghi_chu: "Performance Commentary, mục '9. Waltz in A minor, WN 63', ký Jan Ekier, Paweł Kamiński: 'The execution of the double grace notes in such a way that their first note falls simultaneously with the L.H. should be seen as more stylish. However, more important than the moment of striking is the quality of their sound: they should be light and quick, and so their execution in an anticipated manner is also admissible.' Câu tiếng Việt khớp."
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n78
  luot_2: dung
  nguon: ["https://www.henle.de/media/2a/f6/a2/1686734195/hn_1822_a_chopin_s_6-7_sj.pdf", "https://raw.githubusercontent.com/rdj/music/main/chopin-b150-waltz-in-a-minor.ly"]
  ghi_chu: "Trang mẫu Henle HN 1822 (tr. 6–7, '© 2017 by G. Henle Verlag', 'KK IVb no. 11', mức khó 3): ô 49–56 là dòng cuối, ô 56 vạch kết; dấu nhắc lại đóng ở cuối ô 24 và cuối ô 40, mở ở ô 17 và ô 25. File LilyPond rdj/music: \\barNumberCheck 17, 25, 41, 48; \\repeat volta 2 cho ô 17–24 và 25–40; đoạn cuối 49–56. Hai nguồn cùng 56 ô. Lưu ý nhỏ: Henle còn in dấu mở nhắc lại ở đầu ô 41 (không có dấu đóng tương ứng); câu không nói khác điều này nên vẫn đúng."
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n81
  luot_2: dung
  nguon: ["https://archive.org/details/gb-lam-0156896", "https://archive.org/download/gb-lam-0156896/GB-Lam_0156896_djvu.txt"]
  ghi_chu: "Bản scan Royal Academy of Music: 'Pianoforte-Werke … revidirt und mit Fingersatz versehen von Carl Mikuli', Band 3, Leipzig, Fr. Kistner, 1879. Lời tựa 'Vorwort' ký 'Lemberg, September 1879' có đoạn về tempo rubato: 'Selbst bei seinem so viel verleumdeten Tempo rubato spielte immer eine, die begleitende Hand streng gemessen fort, während die andere, singende … frei machte.'"
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n82
  luot_2: dung
  nguon: ["https://www.chopin-nationaledition.com/en/", "https://www.chopin-nationaledition.com/en/product/waltzes-b/?lang=en", "https://www.chopin-nationaledition.com/wp-content/uploads/2022/06/waltzes-B_commentaries_poprawka2020.pdf"]
  ghi_chu: "Trang Wydanie Narodowe ghi người sáng lập, tổng biên tập là GS Jan Ekier; tập 'Waltzes (B)' (Series B, Works published posthumously, Vol. III, 2007) có Performance and Source Commentaries; phần lời bình ký Jan Ekier, Paweł Kamiński và có mục về cách chơi nốt hoa mỹ (grace notes) cho WN 63."
- trang: piano/tac-pham/clementi-sonatina
  id: n40
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/ClementiM/O36/sonatina-1/sonatina-1-a4.pdf", "https://www.bapam.org.uk/?p=59585", "https://www.livingpianos.com/articles/how-to-play-broken-octaves-effortlessly/"]
  ghi_chu: "Mutopia (Op. 36 số 1, chương I): ô 20–21 tay phải là quãng tám gãy Sol (G4–G5 luân phiên móc đơn). BAPAM 'The Healthy Pianist' (Roskell, Trouli; duyệt 3/2016): 'practise minimising tension between repetitive octaves', căng hay mỏi là dấu hiệu cảnh báo, 'If you experience pain, stop immediately', nên nghỉ xen giữa các buổi tập. LivingPianos: quãng tám gãy chơi nhờ xoay cổ tay (đúng ra là xoay cẳng tay), không phải nhấc ngón, cho đều và ít sức. Câu 'dừng nghỉ nếu thấy căng' thận trọng hơn mức BAPAM (dừng ngay khi đau), không mâu thuẫn."
- trang: piano/tac-pham/clementi-sonatina
  id: n44
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên tập phổ biến (tập tách, nhịp chấm dôi, máy đếm nhịp, tay riêng, khối hợp âm, quyết định số nốt láy, ghi nhật ký tốc độ); không có gì có hại."
