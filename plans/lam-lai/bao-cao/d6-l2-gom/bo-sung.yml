  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n22
  cau: Một số album valse nổi tiếng chỉ gồm 14 bản, như album 14 Waltzes của Dinu Lipatti, và bản này không nằm trong số đó.
  loai: so-lieu
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n62
  cau: "Lời bình của Ấn bản Quốc gia Ba Lan (Jan Ekier, Paweł Kamiński) cho bài này: chơi nốt đầu của các cặp nốt hoa mỹ cùng lúc với tay trái thì hợp phong cách hơn; nhưng quan trọng hơn là chúng nhẹ và nhanh, nên chơi trước phách cũng được."
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n78
  cau: "Nguồn: ấn bản Urtext của Henle (HN 1822, 2017; trang mẫu) và bản LilyPond kho rdj/music cùng cho 56 ô nhịp, với dấu nhắc lại ở ô 17–24 và ô 25–40."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n81
  cau: "Nguồn: Carl Mikuli, lời tựa ấn bản Pianoforte-Werke của Chopin (Kistner, Leipzig, 1879): cách Chopin chơi rubato."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n82
  cau: "Nguồn: Chopin, Ấn bản Quốc gia Ba Lan (Wydanie Narodowe), biên tập Jan Ekier; lời bình tập Valse loạt B của Jan Ekier và Paweł Kamiński (cách chơi nốt hoa mỹ)."
  loai: ten
- trang: piano/tac-pham/clementi-sonatina
  id: n40
  cau: "Quãng tám gãy ở chương I ô 20–21: cổ tay dễ cứng, mỏi; xoay cổ tay, nhỏ và đều, dừng nghỉ nếu thấy căng."
  loai: quy-tac
- trang: piano/tac-pham/clementi-sonatina
  id: n44
  cau: Cách tập trong bảng Chỗ khó (tách gam tập riêng, nhịp chấm dôi, máy đếm nhịp, nhảy sớm, đổi ngón trên nốt nhắc lại nếu thầy khuyên, tay trái riêng ở pp, khối hợp âm trước, quyết định số nốt láy rền như 4 nốt láy rồi hai nốt kết, ghi tốc độ vào nhật ký tập).
  loai: khuyen-tap
