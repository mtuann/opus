- trang: piano/tac-pham/chopin-valse-la-thu
  id: n1
  cau: Đây là valse dễ nhất của Chopin theo thang độ khó của Henle.
  loai: cap-do
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n2
  cau: Bài là một bản valse ngắn, không có số opus, chỉ được in sau khi Chopin mất.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n5
  cau: Bài có giai điệu hát, tay trái nhảy kiểu valse.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n6
  cau: "Tay trái valse: nốt trầm ở phách 1, hai hợp âm ở phách 2 và 3."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n7
  cau: Giai điệu đơn giản, có vài nốt hoa mỹ nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n9
  cau: Đoạn giữa chuyển sang La trưởng, cùng nốt chủ âm với La thứ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n10
  cau: Valse (waltz) là điệu nhảy nhịp 3 đến từ vùng nói tiếng Đức, điệu khiêu vũ
    thịnh hành nhất thế kỷ 19.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n11
  cau: Chopin sống ở Paris từ năm 1831.
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n12
  cau: "Valse của Chopin là nhạc để nghe hơn là để nhảy: ông giữ nhịp 3 và tay
    trái kiểu valse, nhưng thêm vào đó nỗi buồn, sự tinh tế và những chỗ co giãn
    nhịp."
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n13
  cau: "Lúc còn sống, Chopin chỉ cho in tám bản valse: Op. 18, ba bản Op. 34, Op.
    42 và ba bản Op. 64."
  loai: so-lieu
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n14
  cau: Sau khi Chopin mất, người bạn Julian Fontana in thêm các bản Op. 69 và Op.
    70 (1855).
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n15
  cau: Bài được in năm 1860 nhưng mang tên người khác, là số 3 của tập 4 Pièces
    pour piano đề tên Charlotte de Rothschild.
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n16
  cau: Năm 1955, bài được in trong tạp chí La Revue musicale và được công nhận là
    của Chopin.
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n17
  cau: Các ký hiệu B., KK, WN là số trong các danh mục tác phẩm Chopin do Maurice
    Brown, Krystyna Kobylańska và Ấn bản Quốc gia Ba Lan lập ra.
  loai: danh-muc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n18
  cau: Vì không có số opus, bài được gọi bằng một trong các số danh mục, hoặc
    "Valse La thứ (di cảo)".
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n20
  cau: Chopin còn có Valse La thứ Op. 34 số 2, một bản Lento khó hơn nhiều (Henle
    xếp mức 5, bài này mức 3).
  loai: cap-do
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n21
  cau: Năm 2024 có một bản valse La thứ rất ngắn được công bố từ một bản thảo tìm
    thấy ở Thư viện và Bảo tàng Morgan (New York).
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n22
  cau: Các album valse kinh điển thường gồm 14 bản quen thuộc, và bản này không
    nằm trong số đó.
  loai: so-lieu
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n26
  cau: "Đoạn A (La thứ, ô 1–16): giai điệu đơn giản, có nốt hoa mỹ nhỏ, trên tay
    trái valse; bốn câu 4 ô, mỗi câu hơi khác câu trước."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n27
  cau: "Đoạn B (ô 17–24, có nhắc lại): sôi nổi hơn, nổi bật với một hợp âm rải đi
    lên nhanh."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n28
  cau: "Đoạn A' (ô 25–32): câu đầu của chủ đề, rồi một câu đi lên (Rê♯, Fa♯, Sol♯)
    và dừng ở hợp âm át, mở đường sang La trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n29
  cau: "Đoạn C (La trưởng, ô 33–40): Đô♯ và Fa♯ thay cho Đô và Fa; A' và C nhắc
    lại cùng nhau."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n30
  cau: Đoạn C đứng ở vị trí của phần trio trong một bản valse thường.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n31
  cau: "Đoạn A'' (ô 41–52): chủ đề lần cuối, chỉ ba câu đầu; câu thứ ba khép bằng
    một kết."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n32
  cau: "Bài có 56 ô nhịp và một nhịp lấy đà; hai chỗ nhắc lại: đoạn B (ô 17–24) và
    ô 25–40 (A' và C); thứ tự nghe A – B – B – A' – C – A' – C – A'' – coda."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n33
  cau: "Coda (ô 53–56): ngắn, có một láy rền ở ô áp chót, khép lại ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n34
  cau: "Bảng Cấu trúc, hàng A'' và coda: chủ đề lần cuối, câu thứ ba khép bằng một
    kết; coda ngắn khép lại ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n35
  cau: Link "rondo" (/opus/hinh-thuc/rondo/); hình thức chủ đề quay lại xen kẽ với
    các đoạn khác là rondo.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n36
  cau: "Bảng Chỗ khó: bước nhảy tay trái chỉ có một phách; hai hợp âm (sáu nốt) dễ
    át một nốt giai điệu; nốt hoa mỹ; hợp âm rải đi lên ở đoạn B; bàn đạp mỗi ô;
    đoạn La trưởng có Đô♯, Fa♯; rubato."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n46
  cau: Allegretto là "hơi nhanh", không phải chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n56
  cau: Các học trò của Chopin kể rằng khi ông co giãn giai điệu, tay đệm vẫn giữ
    nhịp.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n59
  cau: Có ô mà hòa âm đổi giữa ô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n62
  cau: Nhiều chuyên gia về Chopin, trong đó có Jean-Jacques Eigeldinger, cho rằng
    các nốt hoa mỹ nhỏ trong nhạc Chopin thường vào đúng phách, cùng lúc với nốt
    trầm.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n65
  cau: Valse Si thứ Op. 69 số 2 cũng in sau khi Chopin mất, dài hơn và giàu cảm
    xúc hơn; bước tiếp tự nhiên.
  loai: lich-su
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n71
  cau: "Câu hỏi 1: Valse La thứ B. 150 có hình thức rondo nhỏ A – B – A' – C – A''
    và coda; đoạn C ở La trưởng đứng ở vị trí phần trio."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n73
  cau: "Câu hỏi 3: B. 150 là số trong danh mục tác phẩm Chopin của Maurice Brown;
    bài không có số opus nên được gọi bằng số danh mục B., KK hay WN."
  loai: danh-muc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n75
  cau: 'Nguồn: trang IMSLP ghi bản in đầu tiên "1860 in 4 Pièces pour piano by
    Charlotte de Rothschild (No.3)".'
  loai: nam
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n77
  cau: "Nguồn: bản LilyPond chép theo bản thảo của Chopin ở Thư viện Quốc gia
    Pháp, kho rdj/music trên GitHub; cho 56 ô nhịp, dấu nhắc lại ở ô 17–24 và ô
    25–40."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n78
  cau: "Nguồn: bản khắc của André Van Ryckeghem cho Werner Icking Music Archive
    (1999), nay có trên IMSLP, cũng cho 56 ô nhịp với cùng hai dấu nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n79
  cau: "Nguồn: Maurice J. E. Brown, Chopin: An Index of His Works in Chronological
    Order, Macmillan, 1960 (số B.)."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n80
  cau: "Nguồn: Krystyna Kobylańska, Frédéric Chopin: Thematisch-bibliographisches
    Werkverzeichnis, G. Henle Verlag, 1979 (số KK)."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n81
  cau: "Nguồn: Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by
    His Pupils, Cambridge University Press, 1986."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n82
  cau: "Nguồn: Chopin, Ấn bản Quốc gia Ba Lan (Wydanie Narodowe), biên tập Jan
    Ekier."
  loai: ten
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n44
  cau: Kế hoạch 5 tuần, 30–45 phút mỗi ngày, mốc máy đếm nhịp ♩ = 80–92 đến ♩ ≈
    120–138.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n40
  cau: "Bài tập 1: mỗi chữ Ped. là một lần đổi bàn đạp ngay sau nốt trầm; hợp âm
    dùng ngón 4-2-1 hoặc 5-3-1; nốt trầm sâu, hợp âm nhẹ; tập cả khi nhắm mắt."
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-valse-la-thu
  id: n57
  cau: "Rubato ở bài này: nán ở nốt cao nhất của câu hay ở một bước nhảy đẹp rồi
    trả lại thời gian; chậm lại nhẹ ở cuối đoạn A (câu thứ tư) trước đoạn B;
    không co giãn ở mọi ô."
  loai: khuyen-tap
- trang: piano/tac-pham/clementi-sonatina
  id: n1
  cau: Đây là một trong những bản sonatina được học nhiều nhất.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n2
  cau: Bài có ba chương ngắn, sáng sủa; chứa gam, hợp âm rải, hình đệm Alberti và
    một hình thức sonata thu nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n4
  cau: Chương I có đủ trình bày, phát triển và tái hiện trong 38 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n6
  cau: Gam lên xuống, hợp âm Đô trưởng rải, quãng tám gãy xuất hiện trong bài
    (link Gam, Hợp âm rải).
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n7
  cau: "Phát âm Cổ điển: dấu luyến ngắn, nốt staccato, nốt nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n9
  cau: Muzio Clementi sinh ở Roma năm 1752.
  loai: nam
- trang: piano/tac-pham/clementi-sonatina
  id: n10
  cau: Năm 1766, khi mới khoảng 14 tuổi, ông được một người Anh, Peter Beckford,
    đưa về Anh, và sống phần lớn đời mình ở London.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n11
  cau: Năm 1781 ở Vienna, Clementi và Mozart thi tài trước Hoàng đế Joseph II.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n12
  cau: Người đương thời khen ngón đàn điêu luyện của Clementi.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n13
  cau: Về sau Clementi chuyển sang dạy đàn, xuất bản nhạc và sản xuất đàn piano.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n14
  cau: Học trò của Clementi có John Field, người khởi xướng thể loại nocturne.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n15
  cau: Clementi viết sách Introduction to the Art of Playing on the Piano Forte
    (1801) và tuyển tập étude Gradus ad Parnassum.
  loai: nam
- trang: piano/tac-pham/clementi-sonatina
  id: n16
  cau: Sáu sonatina Op. 36 (1797) được sắp xếp tăng dần độ khó, từ số 1 Đô trưởng
    đến số 6 Rê trưởng.
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n17
  cau: Số 1 là cửa vào của tập.
  loai: cap-do
- trang: piano/tac-pham/clementi-sonatina
  id: n18
  cau: "Sonatina là sonata nhỏ: ngắn hơn, ít chương hơn, kỹ thuật vừa phải, phần
    phát triển rất ngắn hoặc không có."
  loai: dinh-nghia
- trang: piano/tac-pham/clementi-sonatina
  id: n19
  cau: "Chương I theo đúng khuôn hình thức sonata nhưng thu gọn: phần trình bày đi
    từ Đô trưởng sang Sol trưởng (giọng át), phần phát triển chỉ 8 ô, phần tái
    hiện đưa mọi ý về lại Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n21
  cau: "Câu hỏi nghe: chương I dời sang Sol trưởng rồi ở tái hiện vang ở Đô
    trưởng; ở ô 16–23 nhạc tối lại (Đô thứ thoáng qua); lớp đệm chùm ba chương
    II; tốc độ chương III."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n23
  cau: "Bảng Theo dõi khi nghe, chương I, trình bày (ô 1–15): chủ đề rải hợp âm Đô
    trưởng rồi dừng ở Sol; dời sang Sol trưởng, có gam đi lên và nốt nhắc lại
    nhảy quãng tám trên nền Alberti; trình bày nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n24
  cau: "Phát triển (ô 16–23): chủ đề vang ở Sol rồi ở Đô thứ, Mi♭ làm nhạc tối
    lại; quãng tám gãy ở tay phải; dừng trên hợp âm át Sol."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n25
  cau: "Tái hiện (ô 24–38): chủ đề trở lại ở Đô trưởng, một câu nối mới, rồi chất
    liệu của ô 9–15 ở Đô trưởng; nếu giữ dấu nhắc lại thứ hai, phát triển và tái
    hiện vang thêm một lần."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n26
  cau: "Chương II (Andante), đoạn A (ô 1–8): Fa trưởng, giai điệu hát trên lớp
    chùm ba của tay trái; láy rền ở ô 3."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n27
  cau: "Đoạn B (ô 9–18): sang Đô trưởng, chùm ba chuyển lên tay phải; Mi♭ và Fa♯
    làm nhạc tối lại rồi dẫn về Fa."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n28
  cau: "Đoạn A' (ô 19–26): giai điệu đầu trở lại, biến đổi nhẹ, kết bằng láy rền."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n29
  cau: "Chương III (Vivace), đoạn A: chủ đề 8 ô nhảy nhót ở Đô trưởng, vang hai
    lần; luyến hai nốt và staccato."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n30
  cau: "Đoạn B: Sol trưởng, chuỗi móc kép kiểu gam; hợp âm át bảy dẫn về."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n31
  cau: "Đoạn A và coda: chủ đề trở lại; câu kết 8 ô vang hai lần, rồi các hợp âm
    kết."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n32
  cau: "Bảng Cấu trúc, I. Trình bày ô 1–15 (nhắc lại), Đô trưởng → Sol trưởng: ô
    1–4 chủ đề rải hợp âm Đô trưởng, dừng ở Sol; ô 5–8 sang Sol trưởng, kết bằng
    một gam đi lên; ô 9–15 nốt nhắc lại có nhảy quãng tám, gam, tay trái kiểu
    Alberti; kết ở Sol trưởng; chuyển từ nốt đen sang móc đơn."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n33
  cau: "I. Phát triển ô 16–23, Sol, thoáng Đô thứ: chủ đề vang ở Sol rồi ở Đô thứ
    (Mi♭); quãng tám gãy ở tay phải (ô 20–21); dừng trên hợp âm át Sol."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n34
  cau: "I. Tái hiện ô 24–38 (nhắc lại cùng phát triển), Đô trưởng: chủ đề (ô
    24–27), một câu nối mới (ô 28–31), rồi chất liệu của ô 9–15 ở Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n35
  cau: II. A ô 1–8 Fa trưởng; II. B ô 9–18 Đô trưởng rồi thoáng giọng thứ, chùm ba
    ở tay phải, Mi♭ và Fa♯; II. A' ô 19–26 Fa trưởng, kết bằng láy rền.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n36
  cau: III. A Đô trưởng, chủ đề 8 ô vang hai lần; III. B Sol trưởng, chuỗi móc kép
    kiểu gam, hợp âm át bảy dẫn về, Fa♯ rồi Fa♮; III. A và coda Đô trưởng, câu
    kết 8 ô vang hai lần, các hợp âm kết.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n38
  cau: "Bảng Chỗ khó: gam trong bài ở chương I ô 8, 10, 12, 31, 33 và chương III
    đoạn B."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n39
  cau: Nốt nhắc lại có nhảy quãng tám ở chương I ô 9, 11, 32, 34; tay trái kiểu
    Alberti ở cùng các ô đó.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n41
  cau: Chùm ba tay trái chương II; có chỗ tay phải chơi nhịp chấm dôi trên chùm ba.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n42
  cau: Láy rền chương II ở ô 3, 21, 25.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n43
  cau: Luyến hai nốt và staccato ở chương III; ở Vivace hai nốt luyến dễ thành đều
    nhau.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n47
  cau: "Chương I: tuyển tập Sonatina Album của nhà G. Schirmer (1893) ghi
    Spiritoso và nhịp 2/2."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n48
  cau: Nhiều ấn bản khác ghi tốc độ chương I là Allegro.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n50
  cau: "Trong sách dạy đàn năm 1801, Clementi khuyên: khi tác giả không ghi rõ,
    hãy chơi chủ yếu legato, và dành staccato để làm một số đoạn thêm sinh khí."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n52
  cau: Các ấn bản khác nhau về sắc thái.
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n55
  cau: "Học tiếp: cùng tập Op. 36, số 2 Sol trưởng và số 3 Đô trưởng là bước tiếp
    tự nhiên; các số 4–6 khó dần."
  loai: cap-do
- trang: piano/tac-pham/clementi-sonatina
  id: n56
  cau: "Các tác giả sonatina khác: Friedrich Kuhlau (Sonatina Đô trưởng Op. 55 số
    1), Anton Diabelli (các sonatina Op. 151 và Op. 168)."
  loai: danh-muc
- trang: piano/tac-pham/clementi-sonatina
  id: n58
  cau: "Câu hỏi 1: ở phần phát triển chương I (ô 16–23), nhạc tối lại vì chủ đề
    vang ở Đô thứ với Mi♭; giải thích: phát triển 8 ô, chủ đề ở Sol rồi Đô thứ,
    quãng tám gãy ở ô 20–21, dừng trên hợp âm át Sol trước tái hiện; lựa chọn
    sai: tay trái chuyển sang chùm ba, nhịp đổi sang 3/8."
  loai: cau-truc
- trang: piano/tac-pham/clementi-sonatina
  id: n59
  cau: "Câu hỏi 2: sonatina khác sonata ở chỗ ngắn hơn, ít chương hơn, kỹ thuật
    vừa phải, phần phát triển rất ngắn hoặc không có; giải thích: chương I vẫn
    theo khuôn hình thức sonata, chỉ thu gọn."
  loai: dinh-nghia
- trang: piano/tac-pham/clementi-sonatina
  id: n62
  cau: "Mục Nguồn: IMSLP, trang 6 Piano Sonatinas, Op.36: thông tin lần in đầu
    (London: Longman & Broderip, 1797)."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n63
  cau: "Mục Nguồn: Dizionario Biografico degli Italiani (Treccani); Henle HN 848,
    lời nói đầu; Clementi, Introduction to the Art of Playing on the Piano
    Forte, London, 1801, câu về legato đọc ở một lần in khoảng thập niên 1810."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n64
  cau: "Mục Nguồn: Sonatina Album, G. Schirmer, 1893, bản dàn trang công cộng tại
    Mutopia Project (số ô nhịp trên trang này theo bản đó); bản nhạc IMSLP; link
    tài liệu tham khảo."
  loai: lich-su
- trang: piano/tac-pham/clementi-sonatina
  id: n22
  cau: "Nghe thêm bản trên fortepiano (đàn piano thời Clementi): tiếng mỏng và rõ
    hơn."
  loai: khuyen-tap
- trang: piano/tac-pham/clementi-sonatina
  id: n40
  cau: "Quãng tám gãy ở chương I ô 20–21: cổ tay dễ cứng, mỏi; xoay cổ tay, nhỏ và
    đều, dừng nghỉ nếu thấy căng."
  loai: khuyen-tap
- trang: piano/tac-pham/clementi-sonatina
  id: n51
  cau: Nhạc Cổ điển không phải chuỗi nốt tách rời; gam chơi liền và đều; dấu luyến
    ngắn kết bằng cái nhấc tay nhẹ; staccato ngắn nhưng không khô.
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n1
  cau: Cầu nguyện buổi sáng là bài mở đầu Album for the Young của Tchaikovsky và
    chỉ có 24 ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n2
  cau: "Bài viết như một bài hát nhà thờ cho bốn giọng: chậm, khẽ, các nốt nối
    liền nhau."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n4
  cau: Tay phải giữ bè trên (soprano) và bè alto, tay trái giữ bè tenor và bè trầm.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n7
  cau: Hòa âm đổi gần như mỗi phách.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n9
  cau: Ở coda, tay trái vừa lặp một nốt Sol trầm, vừa giữ một bè giữa đang di
    chuyển; link "Âm ngoài hợp âm" (/opus/nhac-ly/18-am-ngoai-hop-am/).
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n10
  cau: Bài chưa đến hai phút.
  loai: so-lieu
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n11
  cau: Bài có một cao trào, một vòng quãng năm và những hợp âm mượn màu thứ.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n12
  cau: Tháng 2 năm 1878, khi đang ở Florence, Tchaikovsky viết cho nhà xuất bản
    Pyotr Jurgenson rằng ông muốn soạn một loạt bài dễ.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n13
  cau: Kamenka là điền trang của gia đình em gái Tchaikovsky, Aleksandra Davydova,
    ở Ukraina; ông trở về Kamenka (tháng 4/1878).
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n14
  cau: Ở Kamenka, Tchaikovsky phác thảo xong cả 24 bài vào đầu tháng 5, rồi sửa và
    chép sạch vào mùa hè.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n15
  cau: Trong thư gửi Nadezhda von Meck, người bảo trợ của mình, Tchaikovsky nói
    muốn có những bản nhạc nhỏ với tên gọi hấp dẫn, như của Schumann.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n16
  cau: Bản in mang phụ đề 24 bài dễ (theo kiểu Schumann).
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n17
  cau: Hình mẫu là tập Album für die Jugend mà Schumann viết cho các con năm 1848.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n19
  cau: Tập nhạc được đề tặng Vladimir ("Volodya") Davydov, con trai cô em gái, đứa
    cháu Tchaikovsky yêu quý nhất.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n20
  cau: Mười lăm năm sau, Tchaikovsky đề tặng chính người cháu này Giao hưởng số 6
    Pathétique.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n21
  cau: Trong bản in, tập mở đầu bằng Cầu nguyện buổi sáng và khép lại bằng Trong
    nhà thờ (В церкви, số 24); ở giữa có búp bê, ngựa gỗ, lính gỗ, bài hát của
    nhiều xứ, chuyện cổ tích, mụ phù thủy Baba Yaga.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n22
  cau: Thứ tự trong bản viết tay hơi khác (Trong nhà thờ đứng áp chót), nhưng Cầu
    nguyện buổi sáng vẫn đứng đầu, nên con số 1 không đổi; Bài ca Pháp cổ mang
    số 16.
  loai: danh-muc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n23
  cau: Cũng trong tháng 5 và tháng 6 năm 1878, Tchaikovsky viết Phụng vụ thánh
    Gioan Kim Khẩu (Op. 41), nhạc lễ Chính thống giáo Nga cho hợp xướng bốn bè
    không nhạc đệm.
  loai: lich-su
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n27
  cau: Ở ô 5–8, bè trầm leo lên từng bậc, có chỗ từng nửa cung.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n28
  cau: Từ ô 16, bè trầm lặp một nốt Sol bằng móc đơn; trên nền ấy có hợp âm nghe
    "tối" hẳn đi.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n29
  cau: "Câu 1, nửa đầu (ô 1–4): bốn bè đi chậm bằng nốt đen; nửa câu dừng trên hợp
    âm Si trưởng (ô 4), hợp âm át của Mi thứ; bè alto lặp nốt Sol; Rê♯ ở bè alto
    ô 4."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n30
  cau: "Câu 1, nửa sau (ô 5–8): bè trầm đi Sol♯ – La – Sol, rồi leo từng bậc Fa♯ –
    Sol – La – Si – Đô – Đô♯ – Rê; nhạc nghiêng sang Rê trưởng và kết ở đó."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n31
  cau: "Ô 5–8: chuỗi hợp âm bảy (Mi bảy, La bảy, Rê bảy), rồi La bảy ở thể đảo dẫn
    về Rê: kết chưa trọn ở Rê trưởng (ô 8)."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n32
  cau: Ở ô 8, Sol của bè alto là nốt treo, rồi xuống Fa♯.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n33
  cau: "Câu 2 (ô 9–11): bắt đầu giống hệt ô 1; Fa♮ ở ô 10 tạo hợp âm Sol bảy, dẫn
    sang Đô trưởng (ô 11); tay phải đi lên trong khi bè tenor tách ra, đi xuống
    Fa♮ – Mi – Rê – Đô – Si – La♯."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n34
  cau: "Cao trào (ô 12–14): Fa♯ trưởng ở ô 12, rồi vòng quãng năm Si – Mi – La –
    Rê – Sol – Đô, nhạc dịu dần; đỉnh f ở ô 12."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n35
  cau: Ở ô 12, hợp âm Fa♯ trưởng có f và dấu nhấn, đỉnh của câu 2.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n36
  cau: "Kết câu 2 (ô 15–16): ii6/5 – V7 – I, kết trọn ở Sol trưởng; bè trên Si –
    La – La – Fa♯ – Sol."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n37
  cau: "Coda lần một (ô 16–18): bè trầm bắt đầu lặp Sol bằng móc đơn; một hợp âm
    bảy giảm Fa♯ – La – Đô – Mi♭ trên nền Sol (ô 17) rồi sáng lại ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n38
  cau: "Coda lần hai (ô 18–20): câu nhỏ ấy nhắc lại thấp hơn một quãng tám, khẽ
    hơn (mf)."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n39
  cau: "Kết (ô 21–24): thêm một hợp âm bảy giảm (Đô♯), hợp âm át (Rê bảy), rồi Sol
    trưởng pp ngân dài."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n40
  cau: "Bài không có dấu nhắc lại; hai câu tám ô bắt đầu giống nhau rồi rẽ hai
    ngả: câu 1 dừng ở Rê trưởng (giọng át), câu 2 lên cao trào rồi về Sol
    trưởng; coda đứng trên một nốt Sol trầm lặp lại suốt tám ô."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n41
  cau: "Bảng Cấu trúc, cột Điều cần chú ý: mỗi tay có hai bè khác nhịp (ô 5–8); để
    dành tiếng to nhất cho ô 12; lấy hơi trước coda; Sol trầm nhẹ, đều; Mi♭ là
    màu mượn từ Sol thứ; hợp âm cuối pp."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n44
  cau: Đoạn nhạc trên khuông theo ấn bản Schirmer (New York, 1904), qua bản dàn
    trang LilyPond công cộng của Mutopia Project; dấu p theo bản ấy; số ngón
    phần lớn lấy từ bản Schirmer.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n45
  cau: Ở ô 1–4 mỗi tay đánh hai nốt một lúc; bè alto lặp Sol; từ ô 1 sang ô 2,
    ngón cái có thể trượt từ phím đen Fa♯ sang phím trắng Sol.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n46
  cau: "Ở ô 5–8: tay phải giữ Đô♯ (ô 5) và Sol (phách 3 ô 7) bên dưới bè trên; tay
    trái đánh lại Mi, Rê ở phách 2 (ô 5, 6) và giữ chúng trong khi bè trầm leo
    lên; ở ô 8, bè trên giữ La suốt ô, còn bè dưới đi Sol – Fa♯ – Mi – Fa♯."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n47
  cau: "Bảng Chỗ khó: bè alto dễ to hơn giai điệu vì ngón 4–5 yếu hơn ngón cái;
    nốt lặp ở bè alto (Sol ở ô 1–2 và 9–11); ngón cái bận ở bè alto nên bè trên
    chỉ còn ngón 2–5; hai bè trong một tay (ô 5–8, coda); lên cao trào (ô
    10–12); âm nền và bè giữa ở coda (ô 16–24); hòa âm đổi gần như mỗi phách."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n49
  cau: "Bản Schirmer ghi đổi ngón ở ô 17: đánh Đô bằng ngón cái rồi đổi sang ngón
    út, để Si (ngón 4) và La đi xuống tiếp mà vẫn liền."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n57
  cau: Trong bài thật, bè giữa ở coda đi Rê – Mi♭ – Rê; thay Mi bằng Mi♭ ở ô 2 của
    bài tập thì hợp âm Đô trưởng thành Đô thứ và tối hẳn đi; đó là màu mượn từ
    Sol thứ; link "Hợp âm mượn".
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n60
  cau: Tchaikovsky ghi Andante; một số bản in cũ, như bản Schirmer 1904, in Lento.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n64
  cau: Bản Schirmer ghi p ở đầu, lớn dần tới f ở ô 12; khi coda bắt đầu lại có f,
    rồi mf ở lần nhắc thấp hơn, dim. và pp ở hợp âm cuối.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n66
  cau: Bản Schirmer chỉ ghi bàn đạp ở ba ô cuối, để giữ Sol trầm và hợp âm cuối
    ngân.
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n69
  cau: Bản nhạc phổ biến trên mạng thường là các bản in cũ, với tốc độ, sắc thái
    và số ngón của người biên tập; bản Schirmer đổi Andante thành Lento là một
    ví dụ.
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n74
  cau: "Câu hỏi 1: bài gồm hai câu tám ô, rồi một coda tám ô trên âm nền Sol; 24
    ô, không dấu nhắc lại; câu 1 kết ở Rê trưởng, câu 2 lên cao trào ở ô 12 rồi
    kết ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n76
  cau: "Câu hỏi 3: câu 1 (ô 1–8) kết ở Rê trưởng, giọng át của Sol trưởng; ở ô 8,
    hợp âm La bảy dẫn về Rê trưởng, với nốt treo Sol xuống Fa♯ ở bè alto; Sol
    trưởng chỉ trở về hẳn ở ô 16."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n77
  cau: "Câu hỏi 4: âm nền ở coda là nốt Sol trầm lặp đều bằng móc đơn trong khi
    hòa âm phía trên thay đổi; tay trái vừa lặp Sol bằng ngón 5, vừa giữ bè giữa
    Rê – Mi♭ – Rê."
  loai: cau-truc
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n78
  cau: "Nguồn: Tchaikovsky Research, \"Children's Album\": thời gian và nơi sáng
    tác, lời đề tặng, thứ tự trong bản viết tay, chỉ dẫn Andante, số ô nhịp, các
    ấn bản toàn tập."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n79
  cau: "Nguồn: ấn bản Schirmer (1904), bản dàn trang LilyPond công cộng của
    Mutopia Project (người nhập: Rem Zolotykh): nguồn của đoạn nhạc, sắc thái,
    bàn đạp và phần lớn số ngón."
  loai: ten
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n55
  cau: "Bài tập 2, các bước: chơi riêng từng bè và hát; ghép hai bè ngoài, rồi
    từng tay, rồi bốn bè; thêm bàn đạp nối ở mỗi chữ Ped., đổi đúng lúc Fa♯
    vào."
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n65
  cau: f ở đây là tiếng cả dàn hợp xướng hát to, không phải tiếng dàn nhạc; sắc
    thái ở các ấn bản có thể khác nhau; một đỉnh ở ô 12, và coda tắt dần.
  loai: khuyen-tap
- trang: piano/tac-pham/tchaikovsky-cau-nguyen-buoi-sang
  id: n48
  cau: "Cách tập ở bảng Chỗ khó: chơi bè trên một mình rồi thêm bè dưới khẽ; ngón
    cái sát mặt phím; đổi ngón trên phím; tập riêng từng bè; lớn dần từ ô 10, f
    bằng sức nặng cánh tay; ngón 5 lặp Sol nhẹ; tập không bàn đạp trước, nếu
    dùng thì bàn đạp nối, nông, đổi mỗi hợp âm."
  loai: khuyen-tap
