- trang: piano/tac-pham/chopin-valse-la-thu
  id: n17
  cau: Các ký hiệu B., KK, WN là số trong các danh mục tác phẩm Chopin do Maurice Brown, Krystyna Kobylańska và Ấn bản Quốc gia Ba Lan lập ra.
  loai: danh-muc
  nguon:
    - ten: 'IMSLP, Waltz in A minor, B.150 (Chopin): B.150 ; CT 224, Allegretto không ghi, "1860 in 4 Pièces pour piano by Charlotte de Rothschild (No.3)", "Published as Valse by Charlotte de Rothschild", bản thu (wikitext đọc qua api.php)'
      link: https://imslp.org/wiki/Waltz_in_A_minor,_B.150_(Chopin,_Fr%C3%A9d%C3%A9ric)
    - ten: 'G. Henle Verlag, HN 131 Chopin, Walzer: Comments (bảng niên đại và năm in: KK IVb no. 11, 1843, in 1955; op. 69, 70 in 1855; "KK IVb no. 11 a minor … This piece first appeared in print in the French periodical La Revue Musicale (1955)")'
      link: https://www.henle.de/media/a3/c6/49/1697725591/0131-1697725590-sync.pdf
    - ten: "Chopin National Edition (Wydanie Narodowe), Numbering and Chronology of the Works: WN 63 Waltz A minor, 1847–49, in 1955; series A: op. 18, 34, 42, 64"
      link: https://www.chopin-nationaledition.com/wp-content/uploads/2013/05/numbering_en.pdf
  ket_qua_luot_1: dung
  ghi_chu: 'Henle Comments: "KK = Krystyna Kobylanska: Frédéric Chopin, Thematisch-bibliographisches Werkverzeichnis"; Ấn bản Quốc gia: WN 63 Waltz A minor; IMSLP: B.150. B. = Brown: tựa sách của Brown (Chopin: An Index of His Works in Chronological Order) chỉ thấy ở Wikipedia, nhưng số "B." trên IMSLP là danh mục Brown (IMSLP dùng ký hiệu này cho mọi tác phẩm Chopin).'
