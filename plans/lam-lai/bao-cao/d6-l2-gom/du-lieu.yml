- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n14
  cau: "Thông tin, tác phẩm: Sonatina Sol trưởng, Anh. 5 số 1 (cũng ghi WoO Anh. 5 số 1), bài đầu trong hai sonatina Anh. 5, bài kia ở Fa trưởng; Anh. là viết tắt của Anhang (phụ lục), phần dành cho các tác phẩm đáng ngờ trong danh mục tác phẩm Beethoven."
  loai: danh-muc
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n15
  cau: "Thông tin, sáng tác / xuất bản: không rõ năm sáng tác, không còn bản viết tay; theo Henle, hai bài được in khi Beethoven còn sống, khoảng năm 1807; một số nguồn khác cho rằng lần in đầu có sau khi ông mất; toàn tập Beethoven của Breitkopf & Härtel (thế kỷ 19) in bài ở loạt 16, số 160."
  loai: lich-su
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n16
  cau: "Thông tin, giọng · nhịp · tốc độ: I. Moderato, Sol trưởng, 4/4 · II. Romanze, Sol trưởng, 6/8, không ghi tốc độ."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n17
  cau: "Thông tin, hình thức: cả hai chương A – B – A và coda; I: 34 ô, ô 9–24 nhắc lại · II: nhịp lấy đà và 40 ô; đoạn A nhắc lại, rồi B và A nhắc lại cùng nhau."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n18
  cau: "Thông tin, độ khó: khoảng ABRSM Grade 2–3 (ước lượng); Henle xếp mức 3 (dễ) trên thang 1–9."
  loai: cap-do
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n19
  cau: "Thông tin, kỹ năng chính: dấu luyến hai nốt, nốt láy ngắn, giai điệu trên hình đệm Alberti, nhịp 6/8 với hình đệm nốt trầm – hai hợp âm, tương phản sắc thái, giữ tay trái nhẹ."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n20
  cau: "Thông tin, bản nhạc: IMSLP (2 Sonatinas for Piano, Anh.5); Urtext: Henle HN 365 (Otto von Irmer biên tập), Wiener Urtext UT 50290 (Drei Sonatinen), Bärenreiter (Leichte Klavierstücke und Tänze, Michael Töpel biên tập)."
  loai: ten
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n21
  cau: "Hình cấu trúc: I. A Moderato ô 1–8; I. B quanh Rê bảy ô 9–16; I. A dolce ô 17–24; I. Coda ô 25–34; II. A Romanze ô 1–8; II. B Rê trưởng → Rê bảy ô 9–21; II. A ô 22–29; II. Coda ô 29–40; ghi chú: chương I ô 9–24 nhắc lại, chương II đoạn A nhắc lại, B và A nhắc lại cùng nhau."
  loai: cau-truc
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n22
  cau: "Bản thu gợi ý: Ramón León Egea, piano, hai chương (I. Moderato, II. Romanze); chương II không chơi các dấu nhắc lại; giấy phép CC BY-SA 4.0."
  loai: ten
- trang: du-lieu/tac-pham/beethoven-sonatina-sol
  id: n23
  cau: Bản thu dài 152,5 giây (chương I) và 150,38 giây (chương II).
