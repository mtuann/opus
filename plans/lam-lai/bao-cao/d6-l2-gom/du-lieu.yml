  loai: lich-su
- trang: du-lieu/tac-pham/bach-prelude-bwv939
  id: n16
  cau: "Thông tin, tác phẩm: Prelude (Praeludium) Đô trưởng, BWV 939, bài đầu trong Fünf kleine Präludien (Năm prelude nhỏ, BWV 939–943); số 2 trong tuyển tập 12 prelude nhỏ."
  loai: danh-muc
- trang: du-lieu/tac-pham/bach-prelude-bwv939
  id: n17
  cau: "Thông tin, sáng tác / xuất bản: không còn bản viết tay của Bach; nguồn thế kỷ 18 duy nhất là một bản chép trong tập P 804 ở Thư viện Quốc gia Berlin, bộ sưu tập gắn với Johann Peter Kellner; năm sáng tác chưa xác định, các tài liệu ước đoán từ thời Köthen (1717–1723) đến khoảng 1726–1727; in lần đầu năm 1843 (nhà Peters, Leipzig)."
  loai: lich-su
- trang: du-lieu/tac-pham/bach-prelude-bwv939
  id: n18
  cau: "Thông tin, giọng · nhịp · tốc độ: Đô trưởng · 4/4 · không ghi tốc độ (thường ♩ ≈ 80–100)."
  loai: cau-truc
- trang: du-lieu/tac-pham/bach-prelude-bwv939
  id: n19
  cau: "Thông tin, hình thức: một mạch liền 16 ô, bốn chặng: nốt nền chủ (ô 1–3) → chuyền tay, sang Sol trưởng (ô 4–8) → nốt nền át có láy (ô 9–12) → về Đô, gam móc kép và kết (ô 13–16)."
  loai: cau-truc
- trang: du-lieu/tac-pham/bach-prelude-bwv939
  id: n20
  cau: "Thông tin, độ khó: khoảng ABRSM Grade 3 (ước lượng)."
