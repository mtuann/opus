  id: n23
  cau: "Hình cấu trúc: nốt nền chủ ô 1–3; chuyền tay, sang Sol trưởng ô 4–8; nốt nền át ô 9–12; về Đô ô 13–16 và kết; độ dài theo số ô (3, 5, 4, 4)."
