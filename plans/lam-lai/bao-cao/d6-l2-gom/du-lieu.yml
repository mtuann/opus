  loai: cau-truc
- trang: du-lieu/tac-pham/bach-prelude-bwv939
  id: n22
  cau: "Thông tin, bản nhạc: IMSLP (5 Kleine Präludien, BWV 939–943, có bản Bach-Gesellschaft năm 1890); Urtext: G. Henle Verlag HN 106, Kleine Präludien und Fughetten."
