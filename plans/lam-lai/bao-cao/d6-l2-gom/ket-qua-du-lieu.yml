  ghi_chu: "Bản nhạc: ô 1–3 bè trầm giữ quãng tám Đô (nốt nền chủ); ô 4–8 tay trái rải, tay phải hợp âm, ô 8 Rê–Fa#–La–Đô dẫn sang Sol; ô 9–11 bè trầm Sol có láy (mordent) mỗi phách, ô 12 rải Sol bảy; ô 13 về Đô (Đô bảy), ô 14 gam móc kép đi xuống rồi quay lên, ô 15–16 kết. Một mạch, không dấu nhắc lại."
