  ghi_chu: "Xác nhận: Henle 'published during Beethoven's lifetime in ca. 1807'; mô tả của Wiener Urtext UT 50290 (trang Forsyths): 'In the first edition, which was published only after Beethoven's death'; IMSLP: Breitkopf toàn tập Serie 16 số 160, năm sáng tác để trống. Chưa xác nhận: 'không còn bản viết tay' (không nguồn bậc 2 nào đã mở nói về bản viết tay)."
