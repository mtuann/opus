- trang: piano/tac-pham/bach-prelude-bwv939
  id: n1
  cau: Bài có mười sáu ô nhịp.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n2
  cau: Bài chơi chưa đầy một phút; một lần chơi thường dài chừng 40 giây, tức
    quanh ♩ ≈ 90–100.
  loai: so-lieu
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n3
  cau: Bài có hợp âm rải chuyền qua lại giữa hai tay, nốt nền ở bè trầm, một chuỗi
    láy, một gam móc kép và một cái kết gọn gàng.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n5
  cau: Mười sáu ô, không có bè phức điệu nào phải giữ riêng.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n7
  cau: Ô 1–3, tay phải rải trên nốt trầm ngân dài; ô 4, hình rải chuyển xuống tay
    trái còn tay phải đánh hợp âm; sau đó hai tay thay phiên nhau; ô 13, cả hai
    cùng rải.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n8
  cau: Prelude BWV 846 dài 35 ô và đòi hình rải chia hai tay suốt bài.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n9
  cau: Nhịp điệu hòa âm là tốc độ đổi hợp âm.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n10
  cau: Gần như cả bài mỗi ô một hợp âm; riêng ô 15, hợp âm đổi gần như từng phách.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n12
  cau: Quãng tám Đô trầm giữ suốt ba ô đầu, rồi nốt Sol trầm nhảy quãng tám có láy
    ở ô 9–11.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n13
  cau: Không có bản viết tay nào của Bach cho bài này; nguồn duy nhất từ thế kỷ 18
    là một bản chép trong tập P 804 ở Thư viện Quốc gia Berlin, một tập lớn đóng
    chung nhiều bản chép riêng lẻ.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n14
  cau: "Tập P 804 phần lớn đến từ di sản của Johann Peter Kellner (1705–1772),
    cantor ở Gräfenroda, vùng Thüringen: 57 bản chép riêng lẻ, chủ yếu là nhạc
    đàn phím của Bach."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n15
  cau: Phần chứa BWV 939–942 do một người chép chưa rõ tên, và không ghi tên tác
    giả; vì vậy không có bằng chứng trực tiếp rằng bài là của Bach, dù danh mục
    BWV và các ấn bản Urtext vẫn xếp bài dưới tên ông.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n16
  cau: "Năm sáng tác chưa chắc chắn: có tài liệu xếp bài vào thời Bach ở Köthen
    (1717–1723), có tài liệu đặt nó vào khoảng 1726–1727."
  loai: nam
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n17
  cau: "Điều rõ ràng hơn là công dụng của bài: một bài ngắn để học đàn."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n18
  cau: Năm 1843, nhà Peters ở Leipzig in một tập mười hai prelude ngắn, gom từ
    Clavier-Büchlein của Wilhelm Friedemann và tập P 804; tên tập là Douze
    petits Préludes ou Exercices pour les commençans.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n19
  cau: Clavier-Büchlein là cuốn sổ tay đàn phím Bach soạn cho con trai Wilhelm
    Friedemann.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n20
  cau: BWV 939 là số 2 của tập Peters.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n21
  cau: Năm 1890, ấn bản toàn tập của Hội Bach (Bach-Gesellschaft, tập 36) in lại
    bài; danh mục BWV về sau xếp nó đứng đầu nhóm Fünf kleine Präludien (Năm
    prelude nhỏ, BWV 939–943).
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n22
  cau: Bach viết cho Clavier, tức đàn phím nói chung, như harpsichord hay
    clavichord.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n23
  cau: Trên harpsichord, lực ngón gần như không làm tiếng to hay nhỏ đi; trên
    piano, tiếng to hay nhỏ theo lực ngón.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n25
  cau: "Câu hỏi nghe 1–4: quãng tám Đô vang tới đâu ở ô 3; đánh dấu ô có hình rải
    ở tay trái; láy ở ô 9–11 trên nốt Sol tay trái; nghệ sĩ có chậm ở hai ô cuối
    không."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n26
  cau: Bài có mặt trong rất nhiều bản thu trọn các prelude nhỏ, cả trên
    harpsichord lẫn piano.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n27
  cau: Kenneth Gilbert đã thu bài trên harpsichord.
  loai: ten
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n28
  cau: Angela Hewitt đã thu bài trên piano.
  loai: ten
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n29
  cau: Tatiana Nikolayeva đã thu bài trên piano.
  loai: ten
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n31
  cau: "Bảng Theo dõi khi nghe, dòng 1: ô 1–3, quãng tám Đô trầm ngân suốt ba ô;
    tay phải rải Đô bảy, Fa trưởng, rồi Sol bảy."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n32
  cau: "Dòng 2: ô 4–5, tay phải đánh hợp âm, hình rải chuyển xuống tay trái; Fa♯
    xuất hiện ở ô 5."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n33
  cau: "Dòng 3: ô 6–8, sang Sol trưởng, hình rải chuyền qua lại giữa hai tay, đến
    hợp âm Rê bảy ở ô 8."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n34
  cau: "Dòng 4: ô 9–11, tay trái nhảy quãng tám trên nốt Sol, nốt Sol cao có láy;
    tay phải leo dần lên."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n35
  cau: "Dòng 5: ô 12, tay phải giữ hợp âm Sol trưởng, tay trái rải Sol bảy để quay
    về Đô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n36
  cau: "Dòng 6: ô 13, hai tay cùng rải; hợp âm Đô bảy của ô 1 trở lại, cao hơn một
    quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n37
  cau: "Dòng 7: ô 14, gam móc kép: tay phải chạy xuống rồi chạy lên trên nốt Fa
    trầm ngân dài."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n38
  cau: "Dòng 8: ô 15–16, hợp âm đổi theo từng phách, nốt Sol trầm nhảy quãng tám
    xuống, rồi hợp âm Đô cuối cùng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n39
  cau: "Bảng Cấu trúc, chặng Nốt nền chủ, ô 1–3: Đô bảy – Fa – Sol bảy, cả ba trên
    quãng tám Đô trầm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n40
  cau: "Chặng Chuyền tay, sang Sol trưởng, ô 4–8: Đô – Rê bảy – Sol (sang Mi thứ ở
    phách 4) – La thứ – Rê bảy; Fa♯ kéo nhạc về phía Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n41
  cau: "Chặng Nốt nền át, ô 9–12: Sol bảy – Đô – Fa♯ giảm, trên nốt Sol trầm có
    láy; ô 12 dừng ở Sol; nốt đầu mỗi ô của tay phải đi lên Si – Mi – Fa♯ –
    Sol."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n42
  cau: "Chặng Về Đô và kết, ô 13–16: Đô bảy – Fa – (ô 15 đổi hợp âm theo phách) –
    Đô; ô 14 là ô móc kép duy nhất; ô 15 hòa âm dày nhất; ô 16 dừng hẳn."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n44
  cau: Khối 1 theo ấn bản Bach-Gesellschaft (1890), đối chiếu qua bản LilyPond của
    Mutopia; số ngón là gợi ý của trang; bản gốc không có dấu sắc thái hay dấu
    luyến nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n45
  cau: Ba ô đầu, tay trái đặt quãng tám Đô (C2–C3) rồi để yên, đúng như bản nhạc
    ghi.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n47
  cau: "Bảng Chỗ khó: giữ quãng tám Đô ô 1–3 (mười hai phách liền); hình rải đổi
    tay ô 4–8, 12–13; hợp âm tay phải ô 4–5; láy tay trái ô 9–11 rơi đúng phách
    mạnh rồi nhảy quãng tám xuống; gam móc kép ô 14 quay đầu giữa ô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n49
  cau: "Ô 15: tay phải đi từ Sol cao xuống quãng bốn Sol–Đô rồi quãng sáu Rê–Si;
    tay trái đi Fa–Rê–Mi–Đô rồi nhảy quãng tám trên Sol."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n50
  cau: Móc đơn, nốt trắng, nốt đen, móc kép nối nhau trong bài; tập ở tốc độ của ô
    khó nhất, thường là ô 14.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n52
  cau: Bài tập 1, 2, 3 soạn riêng cho trang, không trích từ bản gốc; bài tập 3
    cùng hình nốt với ô 14 nhưng thấp hơn một bậc.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n55
  cau: Bach không ghi tốc độ.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n59
  cau: Bản nhạc không có dấu sắc thái nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n61
  cau: "Kí hiệu láy ở ô 9–11 là láy dưới: nốt chính – nốt kề dưới – nốt chính, bắt
    đầu đúng phách."
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n62
  cau: Ở ô 9, tay phải có Fa♮ (hợp âm Sol bảy); ở ô 11, tay phải có Fa♯.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n64
  cau: Bản Bach-Gesellschaft chỉ có nốt và các dấu láy.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n67
  cau: "Học tiếp: BWV 846 cùng giọng, cùng lối rải hợp âm chia hai tay, dài 35 ô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n69
  cau: "Cùng nhóm prelude nhỏ: BWV 924 (Đô trưởng) và BWV 999 (Đô thứ), hai bài
    gần cùng độ khó, cũng dựng trên hợp âm rải."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n71
  cau: "Câu hỏi 1: ở ba ô đầu tay trái giữ một quãng tám Đô trầm suốt ba ô; giải
    thích: tay phải rải Đô bảy, Fa và Sol bảy."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n72
  cau: "Câu hỏi 2: ở ô 15 nhịp điệu hòa âm nhanh lên, hợp âm đổi gần như từng
    phách, báo hiệu kết; giải thích: phần lớn bài mỗi ô một hợp âm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n74
  cau: "Câu hỏi 4: ô 9–11 là nốt nền át, nốt Sol trầm có láy, tay phải rải đi lên
    dần, không phải đoạn gam móc kép hay đoạn chuyển sang La thứ; giải thích:
    Sol là át âm của Đô trưởng, ô 12 dừng ở Sol, ô 13 về Đô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n75
  cau: "Mục Nguồn: Bach Digital (trang BWV 939, P 804 tập nhỏ 53 và cả tập P 804)."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n76
  cau: "Mục Nguồn: Henle HN 106 (Steglich), lời nói đầu về bản chép của Kellner."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n77
  cau: "Mục Nguồn: Bach Printed Music Database, tập 12 prelude nhỏ của Peters."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n78
  cau: 'Mục Nguồn: ADB, "Kellner, Johann Peter" (Eitner, 1882).'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n79
  cau: "Mục Nguồn: danh sách bản thu ở Bach Cantatas Website."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n80
  cau: "Mục Nguồn: bản nhạc IMSLP (Bach-Gesellschaft, tập 36, Ernst Naumann biên
    tập, 1890); đoạn trích đối chiếu với bản LilyPond của Mutopia Project; link
    tài liệu tham khảo."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n54
  cau: Kế hoạch 4 tuần, 20–30 phút mỗi ngày, tốc độ máy đếm nhịp từ ♩ = 60 đến
    84–96.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n51
  cau: Các cách tập trong bảng Chỗ khó (đánh quãng tám đủ sâu, không dùng bàn đạp
    giữ hộ, so tay trái ô 4 với tay phải ô 1, thu âm, đặt sẵn ngón, tập bản viết
    ra trước, tạm chơi nốt trơn, tập nhịp chấm dôi, tập riêng ô 14–16, gọi tên
    hợp âm, máy đếm nhịp).
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-bwv939
  id: n63
  cau: Chọn Fa hay Fa♯ cho nốt láy theo hòa âm, hỏi thầy, giữ một cách cố định;
    láy làm gãy nhịp thì chơi nốt trơn.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n1
  cau: Với rất nhiều người học đàn, đây là bài "Beethoven" đầu tiên, dù rất có thể
    ông không hề viết nó.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n2
  cau: Bài có hai chương ngắn, Moderato và Romanze.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n3
  cau: Bài dạy câu nhạc rõ ràng, dấu luyến ngắn, nốt láy gọn, tay trái nhẹ nhàng
    bên dưới; câu nhạc bốn ô hỏi rồi đáp, dấu luyến hai nốt, nốt láy, kết rõ
    ràng.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n5
  cau: Moderato duyên dáng và nhanh nhẹn; Romanze hát, mềm, có một khoảnh khắc
    dừng lại đầy chờ đợi.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n6
  cau: Tay trái dùng hợp âm hai nốt, hình Alberti (nốt trầm – nốt cao – nốt giữa –
    nốt cao), hình đệm 6/8.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n7
  cau: Bài ngắn và dễ hơn Clementi Sonatina Op. 36 số 1 (link), cùng một thế giới
    âm thanh.
  loai: cap-do
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n8
  cau: Danh mục chuẩn về tác phẩm Beethoven do Georg Kinsky soạn và Hans Halm hoàn
    tất (1955).
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n9
  cau: "Danh mục chia tác phẩm thành ba nhóm: có số opus; không có số opus (WoO,
    Werke ohne Opuszahl); và Anhang, phụ lục cho tác phẩm mà quyền tác giả đáng
    ngờ; hai sonatina nằm ở mục thứ năm của phụ lục, nên mang số Anh. 5."
  loai: danh-muc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n10
  cau: Không còn bản viết tay, và không có thư từ hay ghi chép nào của Beethoven
    nhắc đến hai bài.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n11
  cau: Henle ghi rằng hai bài được in khi Beethoven còn sống, khoảng năm 1807; bản
    in ấy (nhà Rudolphus ở Altona) ghi tên ông là tác giả.
  loai: nam
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n12
  cau: Phần giới thiệu ấn bản Wiener Urtext (2021) nói bản in đầu tiên ra đời sau
    khi Beethoven mất.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n13
  cau: Toàn tập Breitkopf & Härtel ở thế kỷ 19 ghi nhà xuất bản gốc là August
    Cranz ở Hamburg.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n14
  cau: Hamburg rất xa Vienna, nơi Beethoven sống từ năm 1792.
  loai: nam
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n15
  cau: Alexander Wheelock Thayer, người viết tiểu sử Beethoven, chỉ dám đoán rằng
    nếu là của Beethoven thì hai bài thuộc thời ông còn trẻ ở Bonn, kèm một dấu
    hỏi.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n16
  cau: Năm 1868, Gustav Nottebohm, nhà nghiên cứu các sổ phác thảo của Beethoven,
    cũng nghi ngờ.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n17
  cau: Ngày nay Henle cho rằng rất khó có chuyện Beethoven là tác giả.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n18
  cau: Wiener Urtext viết rằng không thể chắc chắn, và cũng chưa ai tìm ra một tác
    giả khác.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n19
  cau: "Âm nhạc thuộc phong cách Cổ điển: giai điệu chia thành câu bốn ô, hòa âm
    chủ yếu là chủ âm và át âm, tay trái đệm bằng hợp âm hai nốt và hình
    Alberti."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n20
  cau: "Tuy mang tên sonatina, không chương nào có hình thức sonata: cả hai đều là
    hình thức hai đoạn có tái hiện (A – B – A, trong đó B và A nhắc lại cùng
    nhau) thêm một coda."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n21
  cau: Romanze (romance) là cái tên không gắn với một hình thức cố định, thường
    gợi tính chất dịu dàng, riêng tư; Mozart đặt tên này cho chương chậm của
    Concerto piano Rê thứ K. 466.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n22
  cau: Chương hai của Eine kleine Nachtmusik của Mozart cũng mang tên Romanze.
  loai: ten
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n24
  cau: "Câu hỏi nghe: chương I, câu đầu (ô 1–4) dừng lửng, câu sau (ô 5–8) khép
    lại; ô 5 tay trái đổi từ hợp âm hai nốt sang Alberti; nốt láy; Romanze cảm
    hai hay sáu phách, chỗ dừng trên dấu ngân (fermata); có chơi dấu nhắc lại
    không."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n25
  cau: "Thuật ngữ: dấu ngân (fermata) ở ô 19 Romanze và ở hợp âm cuối chương I đặt
    trên nốt và hợp âm."
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n26
  cau: Bài có mặt trong rất nhiều tuyển tập sonatina cho người học; bạn sẽ gặp đủ
    loại bản thu.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n28
  cau: "Bảng Theo dõi khi nghe, I. Moderato, A (ô 1–8): p; giai điệu Sol trưởng có
    nốt láy; câu đầu dừng lửng ở ô 4, câu sau khép lại ở Sol."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n29
  cau: "I. B (ô 9–16): mf; tay trái lắc qua lại trên nốt Rê trầm, tay phải chạy
    móc đơn; ở ô 16, tay phải đi một mình dẫn về."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n30
  cau: "I. A trở lại (ô 17–24): dolce; nguyên văn đoạn đầu."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n31
  cau: "I. B và A nhắc lại (ô 9–24); I. Coda (ô 25–34): mf; nốt Rê nhắc lại rồi đi
    lên theo hợp âm Sol; kết bằng các hợp âm Sol, hợp âm cuối ngân dài."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n32
  cau: "II. Romanze, A (nhịp lấy đà và ô 1–8): 6/8; giai điệu hát trên hình đệm
    nốt trầm – hai hợp âm; A nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n33
  cau: "II. B (ô 9–21): chuỗi nốt đi lên, lớn dần, sang Rê trưởng; ba hợp âm rải
    và dấu ngân ở ô 19; tay phải một mình dẫn về."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n34
  cau: "II. A trở lại (ô 22–29), rồi B và A nhắc lại; II. Coda (ô 29–40): p; nốt
    láy hai nốt, bè trầm đi lên nửa cung Đô – Đô♯ – Rê; kết nhẹ."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n35
  cau: Số ô nhịp theo bản Breitkopf & Härtel; ấn bản khác có thể lệch, nhất là ở
    chương II vì chương bắt đầu bằng nhịp lấy đà.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n36
  cau: "Bảng Cấu trúc, I. A ô 1–8 Sol trưởng: hai câu bốn ô, câu 1 dừng trên hợp
    âm Rê (át âm) ở ô 4, câu 2 kết về Sol; tay trái hợp âm hai nốt, rồi Alberti
    ở ô 5–6; nốt láy ngắn; dấu luyến hai nốt ở ô 2 và 7."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n37
  cau: "I. B ô 9–16 (nhắc lại cùng A), quanh hợp âm át Rê bảy: tay trái lắc trên
    nốt Rê trầm; tay phải chạy móc đơn theo chuỗi, ô 12 lặp hình của ô 10 cao
    hơn một bậc; ô 16 chỉ có tay phải; mf."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n38
  cau: "I. A ô 17–24 Sol trưởng: nguyên văn ô 1–8, ghi dolce; hết ô 24 quay lại ô
    9."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n39
  cau: "I. Coda ô 25–34, Sol trưởng trên nốt Rê trầm: nốt Rê nhắc lại, giai điệu
    đi lên theo hợp âm Sol; tay trái rải hợp âm; các hợp âm kết; hợp âm cuối có
    dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n40
  cau: "II. A nhịp lấy đà và ô 1–8 (nhắc lại), Sol trưởng: giai điệu hát trên hình
    đệm nốt trầm – hai hợp âm; ô 3–4 dừng trên hợp âm Rê."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n41
  cau: "II. B ô 9–21, Rê trưởng → Rê bảy: chuỗi nốt chấm dưới dấu luyến, lớn dần
    (ô 9); ba hợp âm rải Rê bảy và dấu ngân (ô 17–19); tay phải một mình ở ô
    20–21, có La♯."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n42
  cau: "II. A ô 22–29 Sol trưởng: nguyên văn đoạn A; B và A nhắc lại cùng nhau."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n43
  cau: "II. Coda ô 29–40 Sol trưởng: p; nốt láy hai nốt (ô 30, 34); bè trầm Đô –
    Đô♯ – Rê (ô 32–33); hai câu kết ngắn."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n44
  cau: Khối 1 theo bản Breitkopf & Härtel (Toàn tập Beethoven, loạt 16, số 160),
    đối chiếu qua bản mã hóa MEI của dự án TROMPA; số ngón là gợi ý của trang.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n45
  cau: Ô 1–4 là câu hỏi, dừng trên hợp âm Rê ở ô 4; ô 5–8 là câu trả lời, kết về
    Sol; ở ô 2 và ô 7 mỗi cặp nốt luyến là một tiếng thở; từ ô 5 tay trái chuyển
    sang Alberti; Fa♮ ở ô 5 kéo nhạc sang hợp âm Đô ở ô 6.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n46
  cau: "Khối 2: Romanze cùng nguồn; bản này không ghi sắc thái ở đầu chương."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n47
  cau: "Tay trái Romanze: nốt trầm rồi hai hợp âm nhỏ, lặp mỗi nửa ô; ở ô 3–4 tay
    trái có hai bè: nốt Mi trầm rồi Rê trầm ngân dài dưới các hợp âm; Đô♯ đưa
    nhạc dừng trên hợp âm Rê."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n49
  cau: "Bảng Chỗ khó: nốt láy ngắn ở I ô 1, 3, 5, 6 và II ô 1, 3; luyến hai nốt I
    ô 2, 7; Alberti I ô 5–6, 21–22; chuỗi móc đơn I ô 10, 12–15; coda I ô 25–31
    với cú nhảy lên Rê cao (D6); hợp âm rải và dấu ngân II ô 17–19; tay phải một
    mình I ô 16, II ô 20–21, La♯ ở ô 21 Romanze."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n53
  cau: Moderato nghĩa là vừa phải.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n56
  cau: "Sắc thái của bản Breitkopf: p ở đầu chương I, nhỏ dần trên các cặp nốt đi
    xuống ở ô 2, mf ở đoạn B (ô 9) và ở coda (ô 25), dolce ở ô 17; Romanze: lớn
    dần ở ô 9, nhỏ dần trước dấu ngân ở ô 19, p ở coda."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n59
  cau: Nhiều tuyển tập cho người học in bài dưới tên Beethoven mà không ghi chú
    gì, kèm sắc thái và số ngón của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n60
  cau: Bản Urtext ghi rõ số Anh. 5 và cho biết đâu là chỉ dẫn của nguồn.
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n63
  cau: "Học tiếp: Clementi Sonatina Op. 36 số 1 dài hơn, chương I có hình thức
    sonata thật."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n64
  cau: "Bài chị em: Sonatina Fa trưởng, Anh. 5 số 2, cùng nguồn gốc đáng ngờ, gồm
    Allegro assai và Rondo."
  loai: ten
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n66
  cau: Für Elise là "Beethoven thật".
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n67
  cau: 'Câu hỏi 1: "Anh." là Anhang, phụ lục các tác phẩm đáng ngờ trong danh mục
    Beethoven; giải thích: danh mục Kinsky–Halm (1955) xếp hai sonatina vào phụ
    lục vì không chắc chúng là của Beethoven.'
  loai: danh-muc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n68
  cau: "Câu hỏi 2: chương I là A – B – A và coda, ô 9–24 được nhắc lại; giải
    thích: A ô 1–8, B quanh hợp âm át ô 9–16, A ô 17–24, coda ô 25–34; lựa chọn
    sai: hình thức sonata, chủ đề và bốn biến tấu."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n69
  cau: "Câu hỏi 3: Romanze 6/8 cảm hai phách mỗi ô, mỗi phách ba móc đơn; giải
    thích: nốt trầm đầu mỗi nửa ô là phách."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n71
  cau: "Mục Nguồn: Henle HN 365 (Otto von Irmer biên tập, ngón Walther Lampe): lời
    giới thiệu và mức độ khó trên henle.de."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n72
  cau: "Mục Nguồn: Wiener Urtext UT 50290 Drei Sonatinen für Klavier (Anh. 5 số 1
    và 2, WoO 50; Jochen Reutter biên tập, 2021): phần giới thiệu của nhà xuất
    bản về quyền tác giả."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n73
  cau: "Mục Nguồn: Kinsky, Halm, Das Werk Beethovens. Thematisch-bibliographisches
    Verzeichnis seiner sämtlichen vollendeten Kompositionen, G. Henle, München,
    1955."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n74
  cau: "Mục Nguồn: Thayer, Chronologisches Verzeichniss (1865), số 24; Nottebohm,
    Thematisches Verzeichniss, ấn bản 2, Breitkopf & Härtel, Leipzig, 1868, tr.
    148."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n75
  cau: 'Mục Nguồn: lvbeethoven.it, "Anhang 05": các lần in và ý kiến nghi ngờ.'
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n76
  cau: "Mục Nguồn: Ludwig van Beethovens Werke, loạt 16, số 160, Breitkopf &
    Härtel (bản quét trên IMSLP); đoạn trích đối chiếu với bản MEI của TROMPA
    (Werner Goebl, CC BY 4.0) trên GitHub; link tài liệu tham khảo."
  loai: lich-su
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n4
  cau: Những viên gạch ấy bạn sẽ gặp lại ở Clementi, Haydn, Mozart.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n54
  cau: Khoảng ♩ = 100–112 là hợp lý cho Moderato; Romanze không ghi tốc độ, cảm
    hai phách mỗi ô (♩. ≈ 48–56).
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-sonatina-sol
  id: n27
  cau: Gợi ý nghe hai bản khác nhau, nghe thêm bản trên fortepiano (đàn piano của
    thời ấy) để hình dung tiếng đàn mỏng và rõ.
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-arabesque
  id: n1
  cau: Arabesque là bài số 2 trong tập étude Op. 100 của Burgmüller.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n3
  cau: Bài dài khoảng một phút.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-arabesque
  id: n4
  cau: Bài có những chùm nốt chạy nhanh, hợp âm ngắn gọn và sắc thái đổi liên tục.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n5
  cau: Hình nốt chính là năm nốt liền bậc trong một thế tay, ở tốc độ Allegro.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n7
  cau: Ở đoạn giữa, tay trái chạy đúng hình nốt ấy.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n8
  cau: Bài có hợp âm ngắn, nốt kết câu ngắn, p đổi sang f nhanh và sf bất ngờ;
    tính cách scherzando nằm ở đó.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n9
  cau: Mỗi bài của Burgmüller trong Op. 100 có một cái tên gợi hình.
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n10
  cau: Bài khoảng một phút, dễ học thuộc, hợp để chơi cho người khác nghe.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-arabesque
  id: n11
  cau: Friedrich Burgmüller sinh năm 1806 ở Regensburg.
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n12
  cau: Burgmüller sinh trong một gia đình nhạc sĩ.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n13
  cau: Năm 1832 Burgmüller sang Paris.
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n14
  cau: Burgmüller sống ở Pháp đến cuối đời; ông dạy piano.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n15
  cau: Burgmüller viết nhiều nhạc salon cho người chơi nghiệp dư.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n16
  cau: Burgmüller viết nhạc cho vở ballet La Péri (1843).
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n17
  cau: Ngày nay tên Burgmüller gắn với ba tập étude cho người học, Op. 100, Op.
    105 và Op. 109.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n18
  cau: 25 Études faciles et progressives, Op. 100 in năm 1851.
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n19
  cau: Op. 105 là 12 Études, Op. 109 là 18 Études.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n20
  cau: Tựa đề đầy đủ của Op. 100 nói các bài được soạn và ghi số ngón cho bàn tay
    nhỏ.
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n21
  cau: "Mỗi bài trong tập có một tựa tiếng Pháp gợi hình ảnh: sự ngây thơ, khúc
    đồng quê, dòng suối trong, cuộc săn."
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n22
  cau: Op. 100 đặc biệt phổ biến trong giáo trình piano ở Nhật Bản và ở nhiều nước
    khác.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n23
  cau: Arabesque vốn là tên một kiểu hoa văn trang trí gồm những đường cong uốn
    lượn đan vào nhau.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n24
  cau: Trong âm nhạc, chữ arabesque chỉ những bản nhạc có nét trang trí bay bổng.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n25
  cau: Schumann và Debussy cũng có bản Arabesque, không liên quan đến bài này.
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n26
  cau: Ở bài này, "hoa văn" là chùm năm nốt chạy lên xuống, cứ xuất hiện rồi biến
    mất.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n27
  cau: Scherzando nghĩa là "đùa vui".
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n29
  cau: Bài này được thu rất nhiều, cả bởi nghệ sĩ lẫn giáo viên.
  loai: so-lieu
- trang: piano/tac-pham/burgmuller-arabesque
  id: n31
  cau: "Dẫn nhập (2 ô): tay trái đánh hợp âm La thứ staccato, p; tay phải nghỉ."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n32
  cau: "Đoạn A: chùm năm nốt móc kép ở tay phải, p, leggiermente; mỗi chùm kết
    bằng một nốt móc đơn ngắn; to dần, sf ở cuối."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n33
  cau: Đoạn A (khoảng 8 ô) có dấu nhắc lại và hai kết khác nhau; tay phải chùm năm
    nốt kiểu La – Si – Đô – Si – La, La – Si – Đô – Rê – Mi; tay trái đệm hợp
    âm.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n34
  cau: "Đoạn B (khoảng 8 ô): f; hình nốt chạy chuyển xuống tay trái, có lúc lên
    khóa Sol; tay phải chơi nốt dài hơn (nốt đen chấm dôi, móc đơn); cuối đoạn
    dim. e poco rall."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n35
  cau: Risoluto nghĩa là quả quyết.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n36
  cau: "Đoạn A' (khoảng 8 ô): a tempo, p; hình nốt trở lại tay phải; có chỗ dolce
    (ngọt ngào)."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n37
  cau: "Đoạn B nhắc lại: tay trái lại chạy ở f; A' nhắc lại là lần cuối trước coda."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n38
  cau: "Coda (khoảng 5 ô): risoluto, f; chùm nốt dồn dập, chủ yếu ở tay phải, một
    lần ở tay trái; to dần; kết bằng hợp âm sf có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n39
  cau: B và A' được nhắc lại cùng nhau, nên hình dạng của bài là một hai đoạn có
    tái hiện thu nhỏ, mở đầu bằng hai ô dẫn nhập và khép lại bằng một coda ngắn.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n41
  cau: Thế tay của hình nốt chính ở tay phải là năm nốt từ La đến Mi (bàn phím vẽ
    G4–F5, tô A4 B4 C5 D5 E5).
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n42
  cau: "Bảng Chỗ khó: chùm năm nốt đều (nốt yếu ngón 4); nốt kết chùm; hình nốt ở
    tay trái đoạn B, có đoạn đọc ở khóa Sol; hợp âm đệm nhẹ; đổi sắc thái nhanh;
    chậm lại rồi về tốc độ (cuối B, đầu A'); coda."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n49
  cau: "Bài tập 3 là kiểu kết cấu của đoạn B: tay trái chạy ở f, tay phải giữ
    những nốt dài hơn."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n52
  cau: Kế hoạch tuần 2 và lỗi thường gặp nói chỗ tay trái đổi khóa ở đoạn B.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n56
  cau: "Các chỉ dẫn trong bài: p, to dần, sf, f, dim. e poco rall., a tempo,
    dolce, risoluto."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n57
  cau: sf là nhấn đột ngột một nốt, không phải đổi cả đoạn sang f.
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n59
  cau: Burgmüller tự ghi số ngón cho tập Op. 100.
  loai: lich-su
- trang: piano/tac-pham/burgmuller-arabesque
  id: n61
  cau: La candeur là số 1 của Op. 100, ở Đô trưởng, để luyện hát legato.
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n62
  cau: "Cùng tập Op. 100: La pastorale (số 3), Le courant limpide (số 7), Ballade
    (số 15), Inquiétude (số 18), La tarentelle (số 20), La chevaleresque (số 25,
    bài kết tập)."
  loai: danh-muc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n63
  cau: Le courant limpide có dòng nước chảy ở tay phải.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n64
  cau: Ballade (số 15) ở Đô thứ, có giai điệu ở tay trái.
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n68
  cau: "Câu hỏi 1: ở đoạn B, hình nốt chạy chính chuyển xuống tay trái, có lúc lên
    tận khóa Sol; tay phải giữ những nốt dài hơn."
  loai: cau-truc
- trang: piano/tac-pham/burgmuller-arabesque
  id: n69
  cau: "Câu hỏi 2: scherzando nghĩa là đùa vui; bài ở La thứ nhưng không buồn."
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n70
  cau: "Câu hỏi 3: sf yêu cầu nhấn đột ngột một nốt, không đổi cả đoạn sang f."
  loai: dinh-nghia
- trang: piano/tac-pham/burgmuller-arabesque
  id: n72
  cau: "Nguồn: IMSLP ghi lần in đầu (Paris: Benoît aîné, 1851) và tên các bài."
  loai: nam
- trang: piano/tac-pham/burgmuller-arabesque
  id: n73
  cau: "Nguồn: bản dàn trang công cộng của L'Arabesque tại Mutopia; cấu trúc và
    chỉ dẫn sắc thái trên trang theo bản đó."
  loai: ten
- trang: piano/tac-pham/burgmuller-arabesque
  id: n58
  cau: "Bàn đạp: không dùng, trừ có thể ở hợp âm cuối có dấu ngân; mọi sự liền
    tiếng đến từ ngón tay."
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-arabesque
  id: n30
  cau: "Cách nghe: bốn câu hỏi (độ nhẹ, ai đang chạy, đếm chỗ đổi sắc thái, tốc
    độ); nghe thêm vài bài khác trong Op. 100."
  loai: khuyen-tap
- trang: piano/tac-pham/burgmuller-arabesque
  id: n71
  cau: "Câu hỏi 4: tập chùm năm nốt chậm với máy đếm nhịp, theo nhịp chấm dôi, dời
    trọng âm; nhấn nốt đầu chùm quá mạnh nghe giật cục."
  loai: khuyen-tap
