  ghi_chu: "Nhạc cổ điển chép từng nốt từng bè (khác ký hiệu hợp âm). Câu hiển nhiên."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n32"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/06%3A_Jazz/6.03%3A_Jazz_Voicings"
  ghi_chu: "OMT 6.3: hòa âm jazz thường mở rộng (extensions) với nhiều nốt; thường dùng bảy, chín, mười một."
- trang: "nhac-ly/27-ky-hieu-hop-am"
