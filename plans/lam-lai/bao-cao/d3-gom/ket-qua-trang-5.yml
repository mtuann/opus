- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n1"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: Neapolitan sixth và hợp âm sáu tăng đều là chromatic predominant."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n2"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: Napoli dùng nhiều ở thế kỷ 18-19; sáu tăng phát triển ở Baroque rồi nổi bật ở Cổ điển/Lãng mạn. Câu ẩn dụ, ý đúng."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n3"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: cả hai là predominant, dẫn tới V (N6 đôi khi qua cad.6/4 rồi V)."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n4"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "Diễn giải chức năng; OMT: bước nửa cung chromatic dẫn vào V. Không có câu nguyên văn về 'căng thẳng hơn', nhưng không sai."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n5"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: cả hai phổ biến hơn ở giọng thứ."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n6"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "OMT: hợp âm trưởng trên bậc 2 hạ (ra), thường ở đảo 1 (N6 / bII6)."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
    - "https://en.wikipedia.org/wiki/Neapolitan_chord"
  ghi_chu: "OMT: liên hệ với Napoli 'khá nông', hợp âm dùng ở nhiều thành phố châu Âu. Wikipedia (chỉ để tìm nguồn) nêu nhóm Scarlatti, Pergolesi... và dùng từ cuối thế kỷ 17 (Carissimi, Corelli, Purcell)."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n8"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "Đô thứ: bậc 2 hạ là Rê giáng; Rê♭-Fa-La♭, đảo 1 bè trầm là Fa. Tự kiểm bằng tính quãng."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n9"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "OMT: bII6 thường đi thẳng tới V, có hoặc không có cad.6/4."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n10"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "OMT: ra (♭2) đi xuống nốt gần nhất của V là ti; qua do khi có cad.6/4. Rê♭ xuống Si là quãng 3 giảm (tự kiểm)."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n11"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "Soạn lại: N6 = Fa (bass), Fa, La♭, Rê♭; V = Sol-Rê-Sol-Si; i = Đô-Mi♭-Sol-Đô. Hợp âm, nối bè đúng; Rê♭ xuống Si. Chưa đối chiếu chữ ABC của khuông."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n12"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: bè trầm le (♭6), nốt trên fi (♯4); trong Đô thứ La♭ và Fa♯ cách quãng 6 tăng."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n13"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: le và fi cùng giải quyết về sol (hai nốt ra ngoài về quãng 8)."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n14"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: giải quyết hai nốt về sol dẫn thẳng tới V ở thể gốc tại kết."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: tên 'sặc sỡ hơn là lịch sử'; UMN: nguồn gốc tên không chắc chắn."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
  ghi_chu: "It+6 trong Đô thứ: La♭, Đô, Fa♯ (♭6, 1, ♯4)."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n17"
  luot_2: "dung"
  nguon:
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
    - "https://en.wikipedia.org/wiki/Augmented_sixth_chord"
  ghi_chu: "Fr+6: La♭-Đô-Rê-Fa♯. Thuộc gam toàn cung (Đô-Rê-Mi-Fa♯-Sol♯-La♯: La♭=Sol♯, Đô, Rê, Fa♯); đã tự kiểm bằng tính. Wikipedia (Blatter) có nói; UMN nói có hai tritone."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "Ger+6: La♭-Đô-Mi♭-Fa♯."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n19"
  luot_2: "dung"
  nguon:
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
  ghi_chu: "UMN: Ger+6 nghe đồng âm với hợp âm bảy át (La♭-Đô-Mi♭-Sol♭ = La♭7)."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
  ghi_chu: "Soạn lại: Ger+6, i6/4, V, i; các nốt đúng. Chưa đối chiếu chữ ABC; phần nhạc lý trong câu đúng."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
  ghi_chu: "OMT: Ger+6 thường theo sau là cad.6/4 để tránh 5 song song; La♭-Mi♭ xuống Sol-Rê là 5 đúng song song nếu đi thẳng vào V."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n22"
  luot_2: "dung"
  nguon:
    - "https://imslp.org/wiki/Piano_Sonata_No.14,_Op.27_No.2_(Beethoven,_Ludwig_van)"
  ghi_chu: "IMSLP: Piano Sonata No.14, Op.27 No.2, Đô thăng thứ; biệt danh 'Moonlight' dùng ở tên bản thu."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n23"
  luot_2: "dung"
  nguon:
    - "https://symposium.music.org/volume-20/articles/an-evolutionary-view-of-neapolitan-formations-in-beethovens-pianoforte-sonatas"
    - "https://en.wikipedia.org/wiki/Neapolitan_chord"
  ghi_chu: "College Music Symposium: Napoli truyền thống ở ô 3 của chương 1; Wikipedia dẫn Mellers: ô 3, Fa♯ ở bè trầm hòa với Rê tự nhiên. Chưa mở bản nhạc để đếm ô."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n24"
  luot_2: "dung"
  nguon:
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
    - "https://en.wikipedia.org/wiki/Augmented_sixth_chord"
  ghi_chu: "UMN: Mozart (5 song song); Wikipedia chỉ ra Beethoven Op.78, Schubert D.959 và chức năng predominant. Ý chung đúng."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n26"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "La thứ: bậc 2 hạ là Si♭; Si♭-Rê-Fa; đảo 1 Rê ở bè trầm. Tự kiểm."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n27"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "La thứ: ♭6 = Fa, ♯4 = Rê♯; It+6 Fa-La-Rê♯; Fr+6 +Si; Ger+6 +Đô (♭3 của La thứ = Đô). Tự kiểm."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n28"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
  ghi_chu: "Đô thứ: Rê♭ trưởng."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n29"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "Như n13."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n30"
  luot_2: "dung"
  nguon:
    - "https://open.lib.umn.edu/musiccomposition/chapter/augmented-sixth-chords/"
  ghi_chu: "Ger+6 trong Đô thứ đồng âm với La♭7."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n31"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/bii6/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/augmented-sixth-chords/"
  ghi_chu: "Như n3, n4."
- trang: "nhac-ly/24-napoli-sau-tang"
  id: "n25"
  luot_2: "dung"
  nguon: []
  ghi_chu: "Lời khuyên nghe hợp lý, hợp cách dạy."
- trang: "nhac-ly/25-be-tram-so"
  id: "n2"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/"
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.18%3A_Inversion_and_Figured_Bass"
  ghi_chu: "OMT: figured bass dùng số Ả Rập và ký hiệu chỉ quãng trên nốt bass, ngụ ý hòa âm; Oxford: continuo là bè trầm có số."
- trang: "nhac-ly/25-be-tram-so"
  id: "n3"
  luot_2: "dung"
  nguon:
    - "https://www.britannica.com/art/basso-continuo"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/basso-continuo"
  ghi_chu: "Britannica: continuo do người chơi phím (organ/harpsichord) ứng tác từ bè trầm có số; thế kỷ 17-18."
- trang: "nhac-ly/25-be-tram-so"
  id: "n4"
  luot_2: "dung"
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/basso-continuo"
    - "https://www.britannica.com/art/basso-continuo"
  ghi_chu: "Phần nhạc lý đúng: bè trầm số là cách ghi cho continuo. Phần 'cách viết gốc gây hiểu sai' là nhận xét về bản cũ, không kiểm được."
- trang: "nhac-ly/25-be-tram-so"
  id: "n5"
  luot_2: "khong-chac"
  ghi_chu: "Câu nói về chữ của bản cũ ('không có nguồn'). OMT và Britannica không có câu 'cách nhạc sĩ thời Bach nghĩ về hòa âm', nên bỏ là hợp lý, nhưng không xác nhận được nhận xét về bản cũ."
- trang: "nhac-ly/25-be-tram-so"
  id: "n6"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.18%3A_Inversion_and_Figured_Bass"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/"
    - "https://robertkelleyphd.com/home/FiguredBass1.pdf"
  ghi_chu: "Số chỉ quãng trên nốt bass (không phải trên gốc); quãng tính theo hóa biểu trừ khi có dấu hóa."
- trang: "nhac-ly/25-be-tram-so"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://www.britannica.com/art/basso-continuo"
    - "https://robertkelleyphd.com/home/FiguredBass1.pdf"
  ghi_chu: "Britannica: biến hóa từ đơn giản đến phức tạp; Kelley: người biểu diễn quyết định cách thực hiện theo phong cách."
- trang: "nhac-ly/25-be-tram-so"
  id: "n8"
  luot_2: "dung"
  nguon:
    - "https://robertkelleyphd.com/home/FiguredBass1.pdf"
  ghi_chu: "Kelley: quãng ghép thường được rút về quãng đơn trong ký hiệu bè trầm số."
- trang: "nhac-ly/25-be-tram-so"
  id: "n9"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.18%3A_Inversion_and_Figured_Bass"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/"
  ghi_chu: "OMT: không có số = hợp âm ba thể gốc; Đô trưởng: Đô-Mi-Sol."
