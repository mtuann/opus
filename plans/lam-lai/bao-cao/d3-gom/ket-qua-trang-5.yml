  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.18%3A_Inversion_and_Figured_Bass"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/"
  ghi_chu: "OMT: dấu hóa đứng một mình áp dụng cho quãng 3 trên bass."
- trang: "nhac-ly/25-be-tram-so"
  id: "n17"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.18%3A_Inversion_and_Figured_Bass"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/"
  ghi_chu: "OMT: dấu hóa đặt trước con số bị đổi; gạch chéo qua số hay dấu cộng trước số = nâng nửa cung."
- trang: "nhac-ly/25-be-tram-so"
  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.18%3A_Inversion_and_Figured_Bass"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/"
  ghi_chu: "Đô; Mi 6 = Đô trưởng đảo 1; Fa = Fa trưởng; Sol 7 = G7; Đô."
- trang: "nhac-ly/25-be-tram-so"
  id: "n19"
  luot_2: "dung"
  nguon:
