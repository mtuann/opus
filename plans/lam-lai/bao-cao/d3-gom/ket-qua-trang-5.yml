    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.17%3A_Seventh_Chords"
  ghi_chu: "Gm7 Sol-Si♭-Rê-Fa; D7 Rê-Fa♯-La-Đô; Fmaj7 Fa-La-Đô-Mi; Bø Si-Rê-Fa-La; E/G♯ = Mi trưởng, Sol♯ bass, đảo 1."
