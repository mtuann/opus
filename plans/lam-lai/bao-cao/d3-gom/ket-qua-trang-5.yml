  id: "n13"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_(Gotham_et_al.)/01%3A_Fundamentals/1.18%3A_Inversion_and_Figured_Bass"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/figured-bass/"
  ghi_chu: "6/5: bảy đảo 1; Si-Rê-Fa-Sol."
