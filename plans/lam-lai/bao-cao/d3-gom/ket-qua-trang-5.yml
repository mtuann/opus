  ghi_chu: "OMT 6.3: voicing gồm quãng 3 và 7; hợp âm bảy là chuẩn trong jazz. Câu 'có thể thay cho hợp âm ba' đúng thực hành, OMT không nói nguyên văn."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n34"
  luot_2: "dung"
  nguon:
