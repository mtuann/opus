- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://www.midside.com/publications/declercq_2019_jmtp.pdf"
  ghi_chu: "Ví dụ: Đô trưởng 1-5-6m-4 = C-G-Am-F; Sol trưởng = G-D-Em-C (tự kiểm). Hai hệ đều không gắn giọng."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/07%3A_Popular_Music/7.09%3A_Four-Chord_Schemas"
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/07%3A_Popular_Music/7.07%3A_Introduction_to_Harmonic_Schemas_in_Pop_Music"
  ghi_chu: "OMT: I-V-vi-IV rất phổ biến, dạng vòng tuần hoàn; OMT nói đặc biệt phổ biến ở điệp khúc, 'lặp suốt bài' hơi mạnh nhưng 'thường' chấp nhận được."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n22"
  luot_2: "sai"
  nguon:
    - "https://en.wikipedia.org/wiki/Pachelbel%27s_Canon"
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.10%3A_Ground_Bass"
  cau_dung: "Ba hợp âm đầu của vòng Canon Pachelbel (I-V-vi) trùng với ba hợp âm đầu của I-V-vi-IV; hợp âm thứ tư của Canon là iii, rồi mới tới IV (I-V-vi-iii-IV-I-IV-V)."
  ghi_chu: "Canon của Pachelbel: I-V-vi-iii-IV-I-IV-V. Ba hợp âm đầu I-V-vi trùng với I-V-vi-IV, nhưng hợp âm thứ tư là iii, không phải IV. Nguồn chính chỉ Wikipedia (bass D-A-B-F♯-G-D-G-A); chưa mở được bản nhạc."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n23"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/06%3A_Jazz/6.04%3A_iiVI"
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/04%3A_Diatonic_Harmony_Tonicization_and_Modulation/4.03%3A_Strengthening_Endings_with_Strong_Predominants"
  ghi_chu: "OMT: ii-V-I quan trọng bậc nhất trong jazz, xuất hiện ở kết; trong nhạc cổ điển predominant (ii) đứng trước V rồi I."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n24"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/06%3A_Jazz/6.08%3A_Blues_Harmony"
  ghi_chu: "OMT: I I I I - IV IV I I - V IV I I."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n25"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/06%3A_Jazz/6.08%3A_Blues_Harmony"
  ghi_chu: "OMT: blues là schema 12 ô, lặp lại (mỗi lần lặp có thể biến đổi nhẹ). 'Cố định' hơi mạnh nhưng đúng ở nghĩa chung."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n26"
  luot_2: "khong-chac"
  ghi_chu: "So sánh tinh thần. Passacaglia/chaconne (OMT 2.10) là bè trầm lặp ba nhịp; OMT 6.8 không nói blues giống ground bass. Ý tương tự được nhiều tài liệu nêu nhưng chưa tìm được nguồn bậc 2 xác nhận."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n27"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/07%3A_Popular_Music/7.12%3A_Modal_Schemas"
  ghi_chu: "OMT: aeolian cadence ♭VI-♭VII-i/I; ♭VII mượn từ mixolydian, ♭VI từ aeolian (vay mượn, tức mixture). Nhãn 'hòa âm hỗn hợp' ngụ ý, OMT không dùng từ này."
- trang: "nhac-ly/27-ky-hieu-hop-am"
  id: "n28"
  luot_2: "dung"
  nguon:
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/07%3A_Popular_Music/7.12%3A_Modal_Schemas"
  ghi_chu: "OMT: gắn với thành công, anh hùng; dùng ở Fellowship Theme (Lord of the Rings), fanfare game, phim."
- trang: "nhac-ly/27-ky-hieu-hop-am"
