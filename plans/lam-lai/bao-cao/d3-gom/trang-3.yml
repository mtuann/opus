- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n1
  cau: Gam trưởng và gam thứ là hai thang âm bạn đã học. Nhưng trong âm nhạc phương Tây cổ hơn, và trong rất nhiều nền âm nhạc khác, kể cả âm nhạc Việt Nam, người ta dùng những thang âm khác.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n2
  cau: Lấy các phím trắng của piano, nhưng bắt đầu từ những nốt khác nhau, ta được 7 điệu thức (mode).
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n3
  cau: Tên các điệu thức mượn từ Hy Lạp cổ (nhưng không giống hệ thống Hy Lạp thật).
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n4
  cau: 'Đô – Ionian: chính là gam trưởng; quãng ba trên chủ âm trưởng.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n5
  cau: 'Rê – Dorian: gam thứ nhưng bậc 6 nâng; quãng ba trên chủ âm thứ.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n6
  cau: 'Mi – Phrygian: thứ, bậc 2 hạ; quãng ba thứ.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n7
  cau: 'Fa – Lydian: trưởng, bậc 4 nâng; quãng ba trưởng.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n8
  cau: 'Sol – Mixolydian: trưởng, bậc 7 hạ; quãng ba trưởng.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n9
  cau: 'La – Aeolian: chính là gam thứ tự nhiên; quãng ba thứ.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n10
  cau: 'Si – Locrian: thứ, bậc 2 và 5 hạ; quãng ba thứ.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n11
  cau: Cột "Quãng ba trên chủ âm" (Trưởng/Thứ) thay cho cột "Màu sắc" (Sáng, ...).
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n13
  cau: 'Muốn có điệu thức trên nốt gốc khác, chỉ cần áp công thức khoảng cách của nó. Ví dụ Dorian từ La: La – Si – Đô – Rê – Mi – Fa♯ – Sol – La.'
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n14
  cau: Thánh ca Gregorian dùng các điệu thức này, nên chúng còn được gọi là điệu thức Gregorian (hay điệu thức nhà thờ).
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n15
  cau: Nhạc Phục hưng; Debussy và Ravel dùng điệu thức để tạo màu sắc cổ xưa hoặc kỳ ảo; dân ca Celtic, Bartók, Vaughan Williams có điệu thức.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n17
  cau: Gam ngũ cung (pentatonic) chỉ có 5 nốt.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n18
  cau: Dạng quen thuộc nhất bỏ hai nốt tạo nửa cung (bậc 4 và 7) khỏi gam trưởng.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n19
  cau: 'Ngũ cung trưởng: Đô – Rê – Mi – Sol – La; toàn bộ là cung và quãng 3 thứ, không có nửa cung nào.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n20
  cau: Giữa hai nốt bất kỳ của ngũ cung trưởng không có quãng 2 thứ hay tritone.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n21
  cau: 'Thử chơi chỉ trên 5 phím đen của piano: đó là một gam ngũ cung.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n22
  cau: 'Ngũ cung thứ: La – Đô – Rê – Mi – Sol. Cùng 5 nốt, bắt đầu từ La.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n24
  cau: 'Ngũ cung có mặt trong âm nhạc của nhiều nơi: Đông Á và Đông Nam Á (như thang slendro của gamelan Java), nhiều dân ca châu Âu.'
  loai: danh-muc
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n25
  cau: Debussy dùng gam ngũ cung trong Pagodes (tập Estampes), nơi tiếng gamelan Java được gợi lại; ông từng nghe gamelan ở Triển lãm Paris năm 1889.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n26
  cau: Dvořák dùng gam ngũ cung.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n27
  cau: Nhạc truyền thống Việt Nam xây trên các thang năm âm, gọi tên theo hệ thống Hò – Xự – Xang – Xê – Cống.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n28
  cau: Khi ghi lên khuông nhạc phương Tây, năm âm này được đối chiếu với Đô – Rê – Fa – Sol – La.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n29
  cau: Cùng nguồn gốc với ký âm công xích của Trung Quốc; đối chiếu với Sol – La – Đô – Rê – Mi.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n30
  cau: Đô – Rê – Fa – Sol – La chính là gam ngũ cung trưởng từ Fa, viết bắt đầu từ bậc 5 (Đô); khoảng cách cung – quãng 3 thứ – cung – cung.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n31
  cau: 'Cao độ không cố định tuyệt đối: một nghiên cứu nói độ cao các âm trong thang này "không được xác định"; trên đàn tranh tay trái ấn dây làm đổi cao độ.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n32
  cau: 'Luyến láy góp phần tạo nên điệu: trên đàn tranh nhấn dây để uốn cao độ là lối trang trí quan trọng; hơi Bắc diễn tả niềm vui, hơi Ai và hơi Oán diễn tả nỗi buồn.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n33
  cau: Khuông nhạc phương Tây không ghi hết cách nhấn nhá và uốn cao độ.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n34
  cau: Nhạc tài tử Nam Bộ và ca trù đều là Di sản văn hóa phi vật thể được UNESCO công nhận (Ca trù 2009; Đờn ca tài tử Nam Bộ 2013).
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n38
  cau: 'Bài tập 1: viết điệu Dorian bắt đầu từ Mi (gợi ý công thức C N C C C N C). Đáp án: Mi – Fa♯ – Sol – La – Si – Đô♯ – Rê – Mi.'
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n39
  cau: 'Bài tập 2: viết điệu Mixolydian từ Rê; khác Rê trưởng ở bậc 7: Đô thay vì Đô♯. Đáp án: Rê – Mi – Fa♯ – Sol – La – Si – Đô – Rê.'
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n40
  cau: 'Bài tập 3: ngũ cung trưởng từ Sol: Sol – La – Si – Rê – Mi; từ Fa: Fa – Sol – La – Đô – Rê.'
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n41
  cau: 'Quiz 1: Dorian khác gam thứ tự nhiên ở bậc 6 được nâng (ví dụ Rê Dorian có Si tự nhiên thay vì Si♭).'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n42
  cau: 'Quiz 2: điệu thức chính là gam trưởng là Ionian (bắt đầu từ Đô trên phím trắng).'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n43
  cau: 'Quiz 3: ngũ cung trưởng từ Đô gồm Đô – Rê – Mi – Sol – La (bỏ bậc 4 và 7 của gam trưởng).'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n44
  cau: 'Quiz 4: giữa hai nốt bất kỳ của ngũ cung trưởng không bao giờ có quãng 2 thứ (nửa cung) và tritone; có quãng 3 thứ (Mi – Sol) và quãng 5 đúng (Rê – La).'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n45
  cau: 'Quiz 5: năm âm Hò – Xự – Xang – Xê – Cống có cấu trúc khoảng cách giống ngũ cung trưởng (cung – quãng 3 thứ – cung – cung, bắt đầu từ một bậc khác).'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n12
  cau: 'Mẹo: so mỗi điệu thức với gam trưởng hoặc thứ gần nhất để thấy bậc nào khác, rồi tìm bậc đó khi nghe.'
  loai: khuyen-tap
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n1
  cau: 'Ngoài khóa Sol và khóa Fa, còn một khóa thứ ba: khóa Đô.'
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n2
  cau: Hình của khóa Đô vẽ cách điệu từ chữ C.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n3
  cau: Điểm giữa của khóa Đô chỉ vào dòng nào thì dòng đó là Đô giữa (C4).
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n4
  cau: Khóa Đô có thể đặt ở nhiều dòng, nhưng hai vị trí còn dùng ngày nay là alto và tenor.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n5
  cau: Khóa Đô alto đặt Đô giữa ở dòng 3 (dòng giữa của khuông).
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n6
  cau: Khóa Đô alto dùng cho viola.
  loai: ten
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n7
  cau: Khóa Đô tenor đặt Đô giữa ở dòng 4 (dòng thứ hai kể từ trên xuống).
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n8
  cau: Khóa Đô tenor dùng cho âm vực cao của cello, bassoon và trombone.
  loai: ten
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n9
  cau: Các nốt Đô3 – Đô4 – Sol4 viết ở khóa Sol, khóa Đô alto và khóa Fa là cùng ba cao độ.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n10
  cau: Khóa Đô alto giúp nốt của viola nằm gọn trong khuông, ít dòng kẻ phụ.
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n11
  cau: Âm vực viola nằm giữa violin và cello.
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n12
  cau: 'Các nốt trên dòng của khóa alto, từ dưới lên: Fa – La – Đô – Mi – Sol (F3 A3 C4 E4 G4).'
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n13
  cau: 'Các nốt trên dòng của khóa tenor, từ dưới lên: Rê – Fa – La – Đô – Mi (D3 F3 A3 C4 E4).'
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n16
  cau: Dịch giọng (transposition) là chuyển toàn bộ bản nhạc lên hoặc xuống một quãng cố định, giữ nguyên giai điệu.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n17
  cau: 'Bước 1 của dịch giọng: chọn quãng dịch, ví dụ lên 2 trưởng (Đô → Rê).'
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n18
  cau: 'Bước 2: đổi hóa biểu sang giọng mới (Đô trưởng → Rê trưởng: thêm Fa♯, Đô♯).'
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n19
  cau: 'Bước 3: dịch mọi nốt lên cùng số bậc (Đô → Rê, Mi → Fa♯ theo hóa biểu, Sol → La…).'
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n20
  cau: 'Bước 4: kiểm tra lại dấu hóa bất thường: một dấu thăng có thể thành dấu bình hoặc thăng kép tùy giọng mới.'
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n21
  cau: Ca sĩ thường dịch giọng để vừa âm vực.
  loai: lich-su
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n23
  cau: Một số nhạc cụ được viết bản nhạc ở cao độ khác với âm thanh thật vang lên.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n24
  cau: Lý do chủ yếu là lịch sử (kèn horn, kèn trumpet thời chưa có van chỉ chơi được các nốt của một âm gốc, nên phải đổi ống nối để đổi âm gốc) và để người chơi dùng cùng một thế bấm khi đổi giữa các loại nhạc cụ trong cùng họ.
  loai: lich-su
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n25
  cau: 'Clarinet in B♭ và trumpet in B♭: viết nốt Đô thì vang lên Si♭, thấp hơn quãng 2 trưởng.'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n26
  cau: Cột "Ghi chú" của hàng clarinet và trumpet in B♭ (chữ cũ "Phổ biến nhất") để trống.
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n27
  cau: 'Clarinet in A: viết Đô thì vang lên La, thấp hơn quãng 3 thứ.'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n28
  cau: Clarinet in A hay dùng ở giọng có nhiều dấu thăng.
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n29
  cau: 'Kèn horn in F: viết Đô thì vang lên Fa, thấp hơn quãng 5 đúng.'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n30
  cau: 'Saxophone alto in E♭: viết Đô thì vang lên Mi♭, thấp hơn quãng 6 trưởng.'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n31
  cau: 'Guitar và contrabass: vang lên thấp hơn nốt viết một quãng tám, để tránh quá nhiều dòng kẻ phụ dưới khuông.'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n32
  cau: Piccolo vang lên cao hơn nốt viết một quãng tám.
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n33
  cau: Khi đọc tổng phổ, bè clarinet in B♭ có hóa biểu khác các bè còn lại; đó không phải lỗi in mà là nhạc cụ dịch giọng.
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n35
  cau: Câu "Một số tổng phổ hiện đại in ở cao độ thật (concert pitch) để dễ đọc."
  loai: lich-su
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n36
  cau: Giai điệu Ode to Joy bắt đầu Mi Mi Fa Sol ở Đô trưởng.
  loai: cau-truc
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n37
  cau: 'Đáp án bài tập 1: Fa trưởng La La Si♭ Đô; Si♭ trưởng Rê Rê Mi♭ Fa.'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n38
  cau: 'Đáp án bài tập 2: clarinet in B♭ đọc nốt Rê, âm thanh thật là Đô (thấp hơn Rê một quãng 2 trưởng).'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n39
  cau: 'Đáp án bài tập 3: muốn clarinet in B♭ phát ra Đô thật, phải viết nốt Rê (cao hơn 2 trưởng).'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n40
  cau: 'Câu hỏi: khóa Đô alto đặt Đô giữa ở dòng 3; lời giải thích "dòng giữa của khuông".'
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n41
  cau: 'Câu hỏi: nhạc cụ đọc khóa Đô alto là viola; giải thích "có âm vực giữa violin và cello".'
  loai: ten
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n42
  cau: 'Câu hỏi: clarinet in B♭ viết Đô thì âm thanh thật là Si♭ thấp hơn, thấp hơn một quãng 2 trưởng.'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n43
  cau: 'Câu hỏi: dịch giọng từ Đô trưởng lên Rê trưởng cần thêm Fa♯ và Đô♯; giải thích "Rê trưởng có 2 dấu thăng".'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n44
  cau: 'Câu hỏi: guitar được viết cao hơn âm thanh thật một quãng tám; giải thích "âm thanh thật thấp hơn nốt viết một quãng tám".'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n22
  cau: Người đệm đàn phải đọc và dịch ngay khi chơi.
  loai: khuyen-tap
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n2
  cau: Các nốt không thuộc hợp âm đang vang được gọi là âm ngoài hợp âm (non-chord tones).
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n3
  cau: Nốt lướt (passing tone) đến bằng bước liền và rời bằng bước liền cùng hướng.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n4
  cau: Nốt thêu (neighbor tone) đến bằng bước liền và rời bằng bước liền quay lại.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n5
  cau: Nốt treo (suspension) giữ nguyên từ hợp âm trước và rời bằng bước liền xuống.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n6
  cau: Nốt dựa (appoggiatura) đến bằng nhảy, ở phách mạnh, rời bằng bước liền.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n7
  cau: 'Nốt đón trước (anticipation): nốt của hợp âm sau vang lên sớm và giữ nguyên sang hợp âm sau; cách đến không có quy định.'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n8
  cau: Âm nền (pedal point) là một nốt giữ dài ở bè trầm trong khi hợp âm bên trên thay đổi.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n9
  cau: 'Ví dụ trên hợp âm Đô: Đô – Rê – Mi (Rê lướt), Mi – Fa – Mi (Fa thêu), Fa giữ từ hợp âm F xuống Mi (nốt treo), Rê nhảy tới rồi xuống Đô (nốt dựa), Sol giữ ở bè trầm qua nhiều hợp âm (âm nền).'
  loai: so-lieu
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n10
  cau: Trong khối nốt lướt, Rê và Fa không thuộc hợp âm Đô (Đô – Mi – Sol), chúng nối các nốt hợp âm theo một hướng đi lên.
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n11
  cau: Nốt treo 4–3 rất phổ biến.
  loai: quy-tac
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n12
  cau: Nốt Fa của hợp âm G7 được giữ lại khi bè trầm đã chuyển sang Đô, tạo nghịch tai, rồi rơi xuống Mi (treo 4–3).
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n13
  cau: 'Nốt dựa: giai điệu nhảy tới một nốt ngoài hợp âm ở phách mạnh, rồi bước về nốt hợp âm, giống một tiếng thở dài.'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n14
  cau: Câu "Đây là chữ ký của âm nhạc thời Cổ điển và Lãng mạn" (nói về nốt dựa).
  loai: lich-su
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n15
  cau: Ở khối nốt dựa, Rê không thuộc hợp âm Đô trưởng; nó rơi vào phách 1 của ô thứ hai bằng một bước nhảy từ Sol, rồi bước xuống Đô ngay sau đó.
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n16
  cau: 'Nốt đón trước: một nốt của hợp âm sắp tới vang lên sớm, rồi giữ nguyên khi hợp âm mới đến.'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n17
  cau: Ở khối nốt đón trước, nốt Đô xuất hiện từ giữa ô đầu khi hòa âm vẫn là Sol7 (lúc đó nó là âm ngoài hợp âm), rồi ngân dài thành nốt chủ âm khi hợp âm Đô trưởng đến.
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n18
  cau: 'Bạn đã nghe âm nền ở Bach, Prelude cung Đô trưởng: nốt Sol giữ ở bè trầm qua nhiều ô nhịp gần cuối.'
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n20
  cau: 'Nốt treo và nốt dựa rơi vào phách mạnh: ở đó chúng nghe nghịch tai với hợp âm, rồi giải quyết bằng một bước liền.'
  loai: quy-tac
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n22
  cau: 'Bài tập 1, ví dụ đáp án: Sol – La – Si – Đô – Si (La là nốt lướt, Đô là nốt thêu) trên hợp âm Sol trưởng.'
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n23
  cau: 'Bài tập 2 (Mi – Fa – Mi trên hợp âm Đô): Fa là nốt thêu.'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n24
  cau: 'Bài tập 3 (Đô – Rê – Mi trên hợp âm Đô): Rê là nốt lướt.'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n25
  cau: 'Câu hỏi: nốt lướt được rời bằng bước liền, cùng hướng với lúc đến; giải thích "nó lướt giữa hai nốt hợp âm".'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n26
  cau: 'Câu hỏi: nốt treo được chuẩn bị bằng cách giữ nguyên từ hợp âm trước; giải thích "sau đó giải quyết bằng bước liền xuống".'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n27
  cau: 'Câu hỏi: âm nền (pedal point) là một nốt giữ dài trong khi hợp âm thay đổi; giải thích "thường ở bè trầm: âm nền át, âm nền chủ".'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n28
  cau: 'Câu hỏi: nốt nhảy tới ở phách mạnh rồi bước về nốt hợp âm là nốt dựa; giải thích "appoggiatura, từ tiếng Ý ''dựa vào''".'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n21
  cau: Khi bạn nghe một hòa âm "nhói lên" rồi tan ra, rất có thể đó là một nốt treo hay nốt dựa.
  loai: khuyen-tap
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n1
  cau: Nếu giai điệu chỉ dùng các nốt thuộc hợp âm đang vang, nó sẽ cứng như bài tập rải hợp âm. Các nốt không thuộc hợp âm làm giai điệu mềm mại, tạo căng thẳng rồi giải tỏa.
  loai: khuyen-tap
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n1
  cau: Hợp âm V kéo mạnh về I.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n3
  cau: Mọi hợp âm ba trưởng hay thứ trong giọng đều có thể có một "hợp âm V của riêng nó".
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n4
  cau: Hợp âm V của Sol trưởng là Rê trưởng (D).
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n5
  cau: Hợp âm D chứa Fa♯, nốt không có trong Đô trưởng.
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n6
  cau: Fa♯ đóng vai cảm âm tạm thời kéo lên Sol.
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n7
  cau: Hợp âm D (hay D7) là át phụ của V; ký hiệu V/V, đọc "năm của năm".
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n8
  cau: 'Có thể có V/ii, V/iii, V/IV, V/vi: hợp âm át của bất kỳ hợp âm trưởng hoặc thứ nào trong giọng.'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n9
  cau: 'Bảng: V/V trong Đô trưởng là D hoặc D7, dẫn đến G, nốt "lạ" là Fa♯.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n10
  cau: 'Bảng: V/vi trong Đô trưởng là E hoặc E7, dẫn đến Am, nốt "lạ" là Sol♯.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n11
  cau: 'Bảng: V/ii trong Đô trưởng là A hoặc A7, dẫn đến Dm, nốt "lạ" là Đô♯.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n12
  cau: 'Bảng: V/IV trong Đô trưởng là C7, dẫn đến F, nốt "lạ" là Si♭.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n13
  cau: 'Ngoài hợp âm V, hợp âm vii° (hoặc vii°7) cũng có thể làm át phụ: hợp âm cảm âm phụ.'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n14
  cau: vii°/V trong Đô trưởng là Fa♯ – La – Đô (hoặc Fa♯ – La – Đô – Mi♭, hợp âm bảy giảm), dẫn về G vì Fa♯ là cảm âm của Sol.
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n15
  cau: 'Mẹo: một dấu hóa bất thường xuất hiện rồi biến mất ngay, đặc biệt là một nốt thăng đi lên nửa cung, rất có thể là cảm âm của một át phụ.'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n16
  cau: 'Át phụ làm hợp âm đích được "chủ âm hóa" tạm thời (tonicization): trong một khoảnh khắc G nghe như chủ âm, rồi nhạc vẫn ở Đô trưởng.'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n17
  cau: Khi giọng mới được khẳng định đủ lâu, thường bằng một kết ở giọng mới, ta nói bản nhạc đã chuyển giọng (modulation).
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n18
  cau: Giọng gần là các giọng chỉ khác 0–1 dấu hóa; chuyển qua lại rất tự nhiên.
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n19
  cau: Với Đô trưởng, các giọng gần là Sol trưởng (giọng át), Fa trưởng (giọng hạ át), La thứ (song song), Mi thứ, Rê thứ.
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n20
  cau: Trên vòng quãng năm, các giọng gần là hàng xóm của nhau.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n22
  cau: 'Một cách thường dùng, mượt hơn đổi giọng đột ngột: tìm một hợp âm thuộc cả hai giọng làm "bản lề" (pivot chord).'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n23
  cau: 'Ví dụ Đô trưởng → Sol trưởng: hợp âm Am là vi của Đô trưởng và cũng là ii của Sol trưởng.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n24
  cau: 'Bảng: C, F, Am, D, G là I, IV, vi trong Đô trưởng, rồi Am, D, G là ii, V, I trong Sol trưởng.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n25
  cau: Đôi khi nhạc đổi giọng đột ngột, không cần bản lề, thường ở chỗ bắt đầu câu mới.
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n26
  cau: 'Ví dụ nổi tiếng: nhiều bài hát pop "nâng tông" lên nửa cung ở điệp khúc cuối.'
  loai: lich-su
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n27
  cau: Đầu phần phát triển của Mozart Giao hưởng số 40 (chương 1) chuyển đột ngột sang Fa♯ thứ, một giọng xa giọng chính (Sol thứ).
  loai: cau-truc
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n28
  cau: 'Hình "Bản đồ giọng gần": Fa trưởng 1♭, Đô trưởng (giọng chính), Sol trưởng 1♯ ở hàng trên; Rê thứ 1♭, La thứ (không dấu), Mi thứ 1♯ ở hàng dưới.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n29
  cau: 'Chữ dưới hình: "Hàng trên: trưởng · hàng dưới: thứ song song · mỗi giọng khác giọng chính nhiều nhất 1 dấu hóa".'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n30
  cau: 'Mô tả hình (aria-label): "Năm giọng gần của Đô trưởng: Sol trưởng và Fa trưởng (cạnh nhau trên vòng quãng năm) cùng ba giọng thứ song song La thứ, Mi thứ, Rê thứ".'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n31
  cau: 'Chú thích hình: "Chuyển giữa các giọng gần nghe tự nhiên vì chỉ đổi một dấu hóa."'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n32
  cau: 'Chú thích hình: giọng xa (ví dụ Fa♯ trưởng, 6 thăng) khác Đô trưởng tới 6 dấu hóa.'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n33
  cau: Trong hình thức sonata, phần trình bày chuyển sang giọng át (hoặc giọng trưởng song song nếu ở giọng thứ) cho chủ đề 2, tạo xung đột giữa hai giọng.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n34
  cau: Phần tái hiện đưa chủ đề 2 về giọng chính, giải quyết xung đột đó.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n35
  cau: 'Bài tập 1, đáp án: trong Sol trưởng, V/V là A (La – Đô♯ – Mi), nốt lạ là Đô♯, cảm âm tạm thời của Rê.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n36
  cau: 'Bài tập 2, đáp án: hợp âm chung của Đô trưởng và Fa trưởng, ví dụ Dm (ii của Đô, vi của Fa), C (I của Đô, V của Fa), F (IV của Đô, I của Fa).'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n37
  cau: 'Bài tập 3 và đáp án: chủ đề 2 ở phần trình bày chương 1 Mozart Giao hưởng số 40 ở Si♭ trưởng, giọng trưởng song song của Sol thứ.'
  loai: cau-truc
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n39
  cau: 'Câu hỏi: V/V trong Đô trưởng là D (Rê trưởng); giải thích "hợp âm át của G là D".'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n40
  cau: 'Câu hỏi: dấu hiệu thường gặp của át phụ trên bản nhạc là một dấu hóa bất thường xuất hiện rồi biến mất ngay; giải thích "thường là cảm âm tạm thời".'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n41
  cau: 'Câu hỏi: hợp âm Am thuộc cả Đô trưởng (vi) và Sol trưởng (ii); giải thích "đó là hợp âm chung để chuyển giọng".'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n42
  cau: 'Câu hỏi: Sol trưởng là giọng gần của Đô trưởng; giải thích "chỉ khác một dấu hóa".'
  loai: so-lieu
