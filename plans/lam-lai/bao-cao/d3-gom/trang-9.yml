- trang: luyen-tai/index
  id: n42
  cau: 'Công cụ khác: musictheory.net Exercises (quãng, hợp âm, gam), teoria.com (bài giảng, bài luyện tai), ToneGym (bài luyện tai dạng trò chơi).'
