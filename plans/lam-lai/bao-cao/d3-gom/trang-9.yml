  cau: Luyện tai giúp bạn 'nghe ra' cấu trúc của nhạc cổ điển thay vì chỉ nghe thấy một khối âm thanh.
  loai: khuyen-tap
- trang: luyen-tai/index
  id: n4
  cau: 'Bài 1 nghe quãng là nền tảng của mọi thứ: nghe được quãng thì nghe được giai điệu.'
