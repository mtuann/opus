- trang: nhac-ly/28-ket-cau
  id: n11
  cau: "Chủ điệu: một giai điệu chính cùng phần đệm hợp âm"
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n12
  cau: Phần đệm chủ điệu có thể là hợp âm cùng tiết tấu (như thánh ca bốn bè) hoặc hình đệm riêng
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n13
  cau: Bè Alberti của Mozart và hợp âm rải của Chopin là hình đệm riêng
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n14
  cau: Chủ điệu gặp ở nhiều nhạc Cổ điển và Lãng mạn, thánh ca, rất nhiều bài hát pop
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n15
  cau: "Phức điệu: nhiều giai điệu độc lập cùng lúc, bè nào cũng quan trọng"
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n16
  cau: "Một loại quen thuộc của phức điệu là phức điệu mô phỏng: các bè lần lượt bắt chước (canon, fugue)"
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n17
  cau: Phức điệu gặp ở nhạc Phục hưng, fugue và invention của Bach, đoạn phát triển trong giao hưởng
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n18
  cau: "Dị âm: cùng một giai điệu, mỗi người chơi một phiên bản hơi khác (thường là trang trí thêm), vang cùng lúc"
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n19
  cau: Đờn ca tài tử được phân tích như một lối dị âm trang trí
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n20
  cau: Gamelan là kết cấu dị âm
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n21
  cau: Nhạc cổ điển Ả Rập có dị âm
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n22
  cau: Trong nhạc cổ điển phương Tây dị âm hiếm
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n23
  cau: "Hình texture-rolls: cùng giai điệu (xanh) trong bốn kết cấu dạng piano roll; màu vàng là phần thêm vào"
  loai: cau-truc
- trang: nhac-ly/28-ket-cau
  id: n26
  cau: Một fugue bắt đầu đơn âm rồi thành phức điệu
  loai: cau-truc
- trang: nhac-ly/28-ket-cau
  id: n27
  cau: Một chương giao hưởng có thể chuyển từ chủ điệu sang phức điệu ở phần phát triển
  loai: cau-truc
- trang: nhac-ly/28-ket-cau
  id: n28
  cau: "Dày hay mỏng: bao nhiêu nhạc cụ, bao nhiêu nốt vang cùng lúc"
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n29
  cau: "Âm vực: các bè dồn sát hay trải rộng từ rất trầm đến rất cao"
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n30
  cau: Dàn nhạc Lãng mạn cuối thế kỷ 19 thường trải âm vực rất rộng
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n31
  cau: "Quiz: hợp xướng nam nữ cách nhau quãng 8 là đơn âm; bè Alberti là chủ điệu; fugue là phức điệu; đờn ca tài tử là dị âm"
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n32
  cau: Tác giả chương OMT Texture là Mark Gotham, Samuel Brady
  loai: ten
- trang: nhac-ly/28-ket-cau
  id: n33
  cau: "Bài báo Intersections 41, số 1: tên và tác giả Nguyễn Thanh Thủy, Stefan Östersjö"
  loai: ten
- trang: nhac-ly/28-ket-cau
  id: n25
  cau: "Mẹo nghe: thử hát theo; chỉ có một giai điệu để hát là đơn âm hay chủ điệu, phải chọn giữa nhiều giai điệu là phức điệu"
  loai: khuyen-tap
- trang: nhac-ly/28-ket-cau
  id: n24
  cau: "Mẹo nghe: đếm số đường nét độc lập (một: đơn âm; một rõ ràng, còn lại đứng sau: chủ điệu; hai trở lên ngang hàng: phức điệu)"
  loai: khuyen-tap
- trang: nhac-ly/29-chuoi-hoa-am
  id: n1
  cau: Chuỗi (sequence) là một mẫu nhạc ngắn được lặp lại liên tiếp ở các cao độ khác nhau, đi lên hoặc đi xuống đều đặn như những bậc cầu thang.
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n2
  cau: Chuỗi rất hay gặp trong nhạc tonal, nhất là thời Baroque.
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n3
  cau: Nghe thấy chuỗi là một manh mối để nhận diện nhạc Baroque, như nhạc Bach và Vivaldi.
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n5
  cau: Môtip Mi – Rê – Mi – Đô được nhắc lại ba lần, mỗi lần thấp hơn một bậc.
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n6
  cau: Một môtip được nhắc lại, mỗi lần thấp hơn (hoặc cao hơn) một bậc, là chuỗi giai điệu.
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n7
  cau: Chuỗi hòa âm tiêu biểu là bè trầm đi xuống quãng 5 (hoặc lên quãng 4) liên tục, đi qua mọi hợp âm của giọng.
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n8
  cau: Gốc của mỗi hợp âm cách gốc hợp âm tiếp theo một quãng 5, như quan hệ át – chủ (riêng cặp Fa – Si là quãng 5 giảm), nên chuỗi tạo lực kéo về phía trước.
  loai: quy-tac
- trang: nhac-ly/29-chuoi-hoa-am
  id: n9
  cau: "Chuỗi quãng 5 đi xuống trong Đô trưởng: I – IV – vii° – iii – vi – ii – V – I."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n10
  cau: Bè trầm Đô – Fa – Si – Mi – La – Rê – Sol – Đô cứ xuống quãng 5 rồi lên quãng 4 xen kẽ (riêng Fa xuống Si là quãng 5 giảm).
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n12
  cau: "Bảng: chuỗi quãng 5 đi xuống: bè trầm xuống 5, lên 4; C – F – B° – Em – Am – Dm – G – C."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n13
  cau: "Bảng: chuỗi quãng 5 đi xuống thường gặp trong nhạc tonal; nhạc jazz nối các vòng ii – V – I."
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n14
  cau: "Bảng: chuỗi quãng 3 đi xuống: bè trầm xuống 3; C – Am – F – Dm."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n15
  cau: "Bảng: kiểu Pachelbel: bè trầm xuống 4, lên một bậc (lặp lại), rồi kết; C – G – Am – Em – F – C – F – G."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n17
  cau: Bè trầm của Canon Pachelbel đi bậc 1–5–6–3–4–1–4–5, mở đầu bằng công thức bè trầm Romanesca.
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n19
  cau: "Bảng: chuỗi 5 – 6 đi lên: bè trầm lên từng bậc, bè trên đổi quãng 5 thành quãng 6 trên mỗi nốt bass; C – Am/C – Dm – B°/D – Em…."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n21
  cau: "Bảng: chuỗi nửa cung: bè trầm đi xuống từng nửa cung; gặp trong nhạc Lãng mạn, ví dụ Chopin."
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n22
  cau: "Vivaldi, Concerto Mùa đông (Op. 8 số 4), chương 2, ô 11–13: một chuỗi 5–6 đi lên."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n24
  cau: "Albéniz, Catalonia (số 34–36 trong tổng phổ): một chuỗi quãng 5 đi xuống."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n25
  cau: "Amanda Maier, Sáu tiểu phẩm cho violin, số 6, ô 162–169: một chuỗi quãng 3 đi xuống."
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n26
  cau: "Vivaldi Mùa xuân: các đoạn độc tấu violin đầy chuỗi giai điệu."
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n27
  cau: "Handel Messiah, Hallelujah: nhiều chuỗi tạo cảm giác hân hoan dâng lên."
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n28
  cau: "Bach, Prelude cung Đô thứ BWV 847: những hình nốt lặp lại trên chuỗi hợp âm."
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n29
  cau: "Bài tập 1: viết chuỗi quãng 5 đi xuống trong Sol trưởng (bè trầm: Sol – Đô – Fa♯ – Si – Mi – La – Rê – Sol)."
  loai: so-lieu
- trang: nhac-ly/29-chuoi-hoa-am
  id: n32
  cau: 'Câu hỏi 1: "Chuỗi hòa âm là gì?" Đáp án: một mẫu nhạc lặp lại liên tiếp ở các cao độ khác nhau (giải thích: giống như các bậc cầu thang).'
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n33
  cau: "Câu hỏi 2: trong chuỗi quãng 5 đi xuống, bè trầm xuống quãng 5 và lên quãng 4 xen kẽ (giải thích: Đô – Fa – Si – Mi…)."
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n34
  cau: 'Câu hỏi 3: "Chuỗi thường được nhắc tới nhiều nhất khi nói về nhạc của thời kỳ nào?" Đáp án: Baroque (giải thích: chuỗi có mặt ở mọi thời, nhưng đặc biệt dễ nghe thấy trong nhạc Baroque, như Bach và Vivaldi).'
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n30
  cau: "Bài tập 2: hát (hoặc chơi trên bàn phím) chuỗi giai điệu ở trên, rồi tự sáng tác một môtip 4 nốt và nhắc lại ba lần, mỗi lần thấp hơn một bậc."
  loai: khuyen-tap
- trang: nhac-ly/29-chuoi-hoa-am
  id: n20
  cau: Chuỗi 5 – 6 đi lên tạo cảm giác dâng lên, tích tụ.
  loai: khuyen-tap
- trang: nhac-ly/29-chuoi-hoa-am
  id: n11
  cau: Bạn sẽ nghe thấy cái "đi tới" không cưỡng lại được của chuỗi này.
  loai: khuyen-tap
- trang: nhac-ly/30-phat-trien-motip
  id: n1
  cau: Phát triển môtip là lấy một ý tưởng ngắn rồi biến đổi nó theo những cách có hệ thống; nhờ đó một ý tưởng vài nốt có thể trở thành cả một chương giao hưởng.
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n3
  cau: "Môtip là ý tưởng âm nhạc ngắn nhất còn nhận ra được: vài nốt với một tiết tấu và đường nét đặc trưng."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n4
  cau: "Một ví dụ nổi tiếng của môtip: bốn nốt mở đầu Giao hưởng số 5 của Beethoven."
  loai: lich-su
- trang: nhac-ly/30-phat-trien-motip
  id: n6
  cau: 'Khối abc 1, "Môtip gốc": nghỉ móc đơn, Sol Sol Sol (móc đơn), Mi♭ (nốt trắng), giọng Đô thứ, nhịp 2/4.'
  loai: cau-truc
- trang: nhac-ly/30-phat-trien-motip
  id: n8
  cau: "Nhắc lại: lặp nguyên vẹn."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n9
  cau: "Chuỗi: lặp ở cao độ khác (xem bài 29); ví dụ Fa Fa Fa Rê."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n10
  cau: "Chuỗi: Beethoven cũng nhắc môtip ở nhiều cao độ khác nhau."
  loai: lich-su
- trang: nhac-ly/30-phat-trien-motip
  id: n12
  cau: "Đảo: lật ngược hướng, đi xuống thành đi lên; ví dụ Sol Sol Sol Si (đi lên quãng 3 thay vì đi xuống)."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n13
  cau: "Ngược: chơi từ cuối về đầu; ví dụ Mi♭ Sol Sol Sol."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n14
  cau: "Nới rộng (augmentation): kéo dài trường độ, thường gấp đôi; mỗi nốt dài gấp đôi."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n16
  cau: "Thu hẹp (diminution): rút ngắn trường độ; nhanh gấp đôi."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n18
  cau: 'Chia nhỏ (fragmentation): chỉ giữ một mảnh; ví dụ chỉ còn "Sol Sol Sol" lặp lại.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n19
  cau: "Đổi quãng: giữ tiết tấu, đổi khoảng cách; ví dụ Sol Sol Sol Đô (nhảy xuống quãng 5)."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n20
  cau: Trong chương 1 Giao hưởng số 5, Beethoven dùng nhiều kỹ thuật trong số này.
  loai: lich-su
- trang: nhac-ly/30-phat-trien-motip
  id: n21
  cau: "Phần phát triển (chương 1 Giao hưởng số 5) cũng dùng chia nhỏ: một mảnh nhạc rút từ chủ đề cầu nối bị cắt còn hai nốt, rồi một nốt, chuyền qua lại giữa bộ dây và bộ gỗ."
  loai: cau-truc
- trang: nhac-ly/30-phat-trien-motip
  id: n24
  cau: "Đoạn nhạc (period): câu hỏi kết nửa, câu trả lời kết trọn."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n25
  cau: Nhạc Cổ điển còn một cấu trúc phổ biến không kém đoạn nhạc, gọi là câu (sentence).
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n26
  cau: Câu thường dài 4 hoặc 8 ô nhịp; bảng dưới là một câu 8 ô nhịp.
  loai: quy-tac
- trang: nhac-ly/30-phat-trien-motip
  id: n27
  cau: "Trình bày (presentation), ô nhịp 1–4: một ý cơ bản 2 ô nhịp, rồi nhắc lại ngay (có thể ở hợp âm khác)."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n28
  cau: "Tiếp nối (continuation), ô nhịp 5–8: chia nhỏ ý cơ bản thành mảnh ngắn hơn, nhịp điệu dồn dập hơn, rồi kết bằng một kết."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n29
  cau: "Ví dụ kinh điển: 8 ô nhịp mở đầu Sonata piano số 1 của Beethoven, Op. 2 số 1 (Fa thứ): hợp âm rải đi lên 2 ô nhịp, nhắc lại ở hợp âm át, rồi các mảnh ngắn dần dồn tới kết nửa."
  loai: cau-truc
- trang: nhac-ly/30-phat-trien-motip
  id: n31
  cau: "Mở rộng câu nhạc: kéo dài một hợp âm trước kết, làm lại phần kết sau khi lần kết đầu bị né tránh (xem bài 13 về kết lừa), hoặc thêm một đoạn đuôi (codetta) sau kết."
  loai: quy-tac
- trang: nhac-ly/30-phat-trien-motip
  id: n34
  cau: "Đáp án câu 1: Đảo (bắt đầu từ Mi): Mi Mi Rê Đô. Ngược: Sol Fa Mi Mi. Nới rộng: Mi Mi Fa Sol với mỗi nốt dài gấp đôi."
  loai: so-lieu
- trang: nhac-ly/30-phat-trien-motip
  id: n36
  cau: "Câu hỏi 1: lật ngược hướng của các quãng trong môtip gọi là đảo (không phải ngược, chuỗi)."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n37
  cau: "Câu hỏi 2: chỉ giữ lại một mảnh của môtip và lặp lại nó gọi là chia nhỏ; giải thích: phần phát triển chương 1 Giao hưởng số 5 cũng dùng cách này."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n38
  cau: "Câu hỏi 3: trong cấu trúc câu, phần trình bày gồm một ý cơ bản và lần nhắc lại của nó (giải thích: phần tiếp nối mới chia nhỏ và dẫn tới kết)."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n39
  cau: "Câu hỏi 4: kéo dài trường độ của môtip gọi là nới rộng (giải thích: Augmentation)."
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n32
  cau: Khi nghe một câu nhạc dài hơn mức thông thường (4 hoặc 8 ô nhịp), hãy tìm xem đoạn nào được thêm vào.
  loai: khuyen-tap
- trang: nhac-ly/30-phat-trien-motip
  id: n2
  cau: Hiểu các kỹ thuật này, bạn sẽ nghe ra "logic" trong nhạc Beethoven, Brahms, và nhận ra vì sao nhạc của họ nghe chặt chẽ đến vậy.
  loai: khuyen-tap
- trang: nhac-ly/30-phat-trien-motip
  id: n33
  cau: "Bài tập 1: lấy môtip đầu Ode to Joy (Mi Mi Fa Sol), viết bản đảo, bản ngược, bản nới rộng."
  loai: khuyen-tap
- trang: nhac-ly/31-hinh-thuc-nho
  id: n1
  cau: Các hình thức lớn như sonata và rondo được xây từ những khối nhỏ hơn.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n3
  cau: "Hình thức hai đoạn (binary) là A B, thường với dấu nhắc lại cho mỗi phần: ‖: A :‖ ‖: B :‖."
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n4
  cau: Phần A bắt đầu ở giọng chính và thường chuyển sang giọng át; ở giọng thứ thì sang giọng trưởng song song.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n5
  cau: Phần lớn các điệu nhảy Baroque ở hình thức hai đoạn có phần A chuyển sang giọng át.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n6
  cau: "Minuet Sol thứ: phần A kết ở Si♭ trưởng."
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n8
  cau: Phần A có thể dừng ở kết nửa trên hợp âm át, như La candeur.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n10
  cau: Phần A cũng có thể kết trọn ngay ở giọng chính, như Minuet Sol trưởng, nơi chỉ phần B mới sang Rê trưởng.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n12
  cau: Phần B bắt đầu từ giọng mà phần A vừa kết, đi qua vài giọng khác, rồi trở về giọng chính để kết.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n13
  cau: Gần như mọi điệu nhảy trong tổ khúc Baroque (allemande, courante, sarabande, gigue) đều ở hình thức hai đoạn.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n14
  cau: Minuet cung Sol trưởng trong sổ tay Anna Magdalena Bach (Petzold) là ví dụ dễ nghe.
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n16
  cau: "Hai đoạn có tái hiện (rounded binary) là A B A, với hai dấu nhắc lại ‖: A :‖ ‖: B A' :‖; phần hai kết bằng việc đưa chủ đề đầu trở lại, giờ ở giọng chính."
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n17
  cau: Hai đoạn có tái hiện là "mầm mống" của hình thức sonata.
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n19
  cau: Hai đoạn có tái hiện là hình thức điển hình của minuet thời Cổ điển.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n20
  cau: Hình thức ba đoạn (ternary) là A B A, trong đó mỗi đoạn trọn vẹn và tự kết ở giọng của nó.
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n21
  cau: Trong ba đoạn, B tương phản rõ với A (giọng khác, tính chất khác); B là một thế giới riêng, không chỉ là đoạn chuyển tiếp.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n22
  cau: Nhiều tiểu phẩm piano Lãng mạn như nocturne, mazurka ở hình thức ba đoạn.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n23
  cau: Chopin Prélude Op. 28 số 15 "Giọt mưa" ở hình thức ba đoạn.
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n24
  cau: 'Aria da capo trong opera Baroque: A, B, rồi "da capo" quay lại A.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n25
  cau: Ở lần A thứ hai của aria da capo, ca sĩ thêm trang trí.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n26
  cau: "Musette Rê trưởng: đoạn A và B đều có dấu nhắc lại như hình thức hai đoạn."
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n27
  cau: "Musette Rê trưởng: đoạn B kết ở giọng át (La trưởng)."
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n28
  cau: "Do đó đoạn A được chơi lại từ đầu (da capo): A B A."
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n30
  cau: Chương 3 tiêu chuẩn của giao hưởng thời Cổ điển, cũng dùng trong nhiều thể loại khác, là minuet và trio.
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n31
  cau: Minuet và trio ghép thành một A B A lớn; mỗi khối là một hình thức hai đoạn, thường có tái hiện.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n32
  cau: "Bảng: minuet là điệu nhảy nhịp 3/4."
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n33
  cau: "Bảng: trio tương phản, thường nhẹ nhàng hơn, thường ở giọng khác."
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n34
  cau: "Bảng: sau trio, minuet được chơi lại (da capo), thường bỏ các dấu nhắc lại."
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n36
  cau: "Từ Beethoven, minuet thường được thay bằng scherzo: nhanh hơn nhiều, nhưng giữ khung scherzo, trio, scherzo."
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n38
  cau: "Bảng ca khúc: theo khổ (strophic): mọi khổ lời hát cùng một giai điệu."
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n39
  cau: "Ví dụ theo khổ: Schubert Heidenröslein."
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n40
  cau: "Ví dụ theo khổ: nhiều dân ca, thánh ca."
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n41
  cau: "Theo khổ có biến đổi: cùng giai điệu nhưng có khổ được thay đổi; ví dụ nhiều ca khúc của Brahms."
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n42
  cau: "Xuyên suốt (through-composed): nhạc mới cho mỗi đoạn lời, đi theo câu chuyện."
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n43
  cau: Schubert Erlkönig là ví dụ xuyên suốt.
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n48
  cau: "Quiz 1: trong hai đoạn ở giọng trưởng, phần A thường kết ở giọng át; giải thích: phần B mới đưa nhạc về giọng chính."
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n49
  cau: "Quiz 2: minuet và trio tạo thành A B A; giải thích: minuet, trio, minuet da capo."
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n50
  cau: "Quiz 3: ca khúc mà mọi khổ cùng một giai điệu là theo khổ; giải thích: ví dụ nhiều dân ca và thánh ca."
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n51
  cau: "Quiz 4: từ Beethoven, chương minuet thường được thay bằng scherzo; giải thích: nhanh hơn, nhiều năng lượng hơn."
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n52
  cau: "Hình form-small, sơ đồ 1 (hai đoạn): ‖: A :‖ ‖: B :‖."
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n53
  cau: "Hình form-small, sơ đồ 2 (hai đoạn có tái hiện): ‖: A (thường → giọng át) :‖ ‖: B A' :‖."
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n54
  cau: "Hình form-small, sơ đồ 3 (ba đoạn): A B A, mỗi đoạn trọn vẹn."
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n55
  cau: "Hình form-small, sơ đồ 4 (minuet-trio): minuet ‖:a:‖ ‖:b a':‖, trio ‖:c:‖ ‖:d (c'):‖, minuet da capo; chú thích: mỗi khối là hai đoạn, thường có tái hiện."
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n47
  cau: "Mẹo nghe 3: tìm đoạn giữa tương phản rõ (giọng khác, tính chất khác) thì là ba đoạn, hoặc minuet, trio."
  loai: khuyen-tap
- trang: nhac-ly/31-hinh-thuc-nho
  id: n46
  cau: "Mẹo nghe 2: chủ đề đầu quay lại ở cuối phần hai thì là hai đoạn có tái hiện hoặc ba đoạn."
  loai: khuyen-tap
- trang: nhac-ly/31-hinh-thuc-nho
  id: n45
  cau: "Mẹo nghe 1: nghe cùng một đoạn vang hai lần liên tiếp là dấu hiệu của hình thức hai đoạn."
  loai: khuyen-tap
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n1
  cau: Từ đầu thế kỷ 20, nhiều nhà soạn nhạc rời bỏ hệ thống trưởng, thứ và hòa âm chức năng.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n3
  cau: "Gam toàn cung chỉ gồm các cung, không có nửa cung: 6 nốt chia đều quãng 8."
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n4
  cau: Chỉ có hai gam toàn cung khác nhau.
  loai: so-lieu
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n5
  cau: Gam toàn cung không có chủ âm rõ ràng, không có cảm giác "về nhà".
  loai: quy-tac
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n6
  cau: Âm thanh gam toàn cung mơ hồ, lơ lửng, như trong mơ; gắn với Debussy.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n7
  cau: Voiles, trong tập Préludes quyển 1 của Debussy, dùng gam toàn cung.
  loai: nam
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n9
  cau: "Khối abc 1: gam toàn cung từ Đô trên hợp âm tăng (C D E F♯ G♯ A♯ c)."
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n10
  cau: Gam bát cung xen kẽ nửa cung và cung, 8 nốt.
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n11
  cau: Chỉ có ba gam bát cung khác nhau.
  loai: so-lieu
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n12
  cau: Messiaen gọi gam bát cung là "điệu thức chuyển vị hạn chế số 2".
  loai: ten
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n13
  cau: Gam bát cung xuất hiện trong nhạc của Bartók và Messiaen.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n14
  cau: Gam bát cung xuất hiện trong nhạc của Rimsky-Korsakov và Stravinsky.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n16
  cau: "Khối abc 2: gam bát cung từ Đô (nửa cung, cung): C D♭ E♭ E F♯ G A B♭ c."
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n17
  cau: Hợp âm quãng 4 chồng quãng 4 thay vì quãng 3.
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n18
  cau: Hợp âm quãng 4 mơ hồ, không có âm gốc rõ ràng, không trưởng không thứ.
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n19
  cau: Hindemith dùng hợp âm quãng 4 trong Mathis der Maler.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n20
  cau: Jazz cũng dùng hợp âm quãng 4.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n21
  cau: "Khối abc 3: ba hợp âm quãng 4 [C F B♭ E♭] [D G c f] [E A d g] rồi lặp lại, nhịp 4/2."
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n22
  cau: "Đa điệu tính: hai giọng (hoặc hai hợp âm) khác nhau cùng lúc."
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n23
  cau: "Một hợp âm rất nổi tiếng thuộc loại này nằm ở Les Augures printaniers trong Le Sacre du printemps: Mi♭7 chồng lên Fa♭ trưởng (nghe như Mi trưởng)."
  loai: nam
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n24
  cau: Hợp âm ấy dậm đi dậm lại.
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n26
  cau: "Khối abc 4: Mi♭7 [E♭ G B♭ D♭] trên Fa♭ trưởng [F♭ A♭ C♭], nhịp 2/4."
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n27
  cau: Schoenberg phát triển phương pháp 12 âm (khoảng đầu thập niên 1920) để tổ chức âm nhạc vô điệu tính.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n28
  cau: "Bước 1: sắp xếp cả 12 nốt của quãng 8 thành một dãy (row), mỗi nốt một lần, theo thứ tự nhà soạn nhạc chọn."
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n29
  cau: "Bước 2: mọi giai điệu và hợp âm đều lấy từ dãy đó, theo đúng thứ tự."
  loai: quy-tac
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n30
  cau: "Dãy có bốn dạng: nguyên bản (P), đảo (I), ngược (R), ngược đảo (RI), chuyển lên bất kỳ cao độ nào: tổng cộng 48 dạng."
  loai: so-lieu
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n31
  cau: 'Mục đích: không nốt nào được "ưu tiên", nên không có chủ âm.'
  loai: quy-tac
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n32
  cau: Dãy 12 âm của Concerto violin của Alban Berg (1935) chứa nhiều hợp âm ba ẩn bên trong.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n34
  cau: "Khối abc 5: dãy 12 âm Sol, Si♭, Rê, Fa♯, La, Đô, Mi, Sol♯, Si, Đô♯, Mi♭, Fa."
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n35
  cau: Sol, Si♭, Rê (Sol thứ); Rê, Fa♯, La (Rê trưởng); La, Đô, Mi (La thứ); Mi, Sol♯, Si (Mi trưởng); rồi bốn nốt cuối đi lên từng cung.
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n36
  cau: Các nhà soạn nhạc tối giản là Reich, Glass, Riley.
  loai: danh-muc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n37
  cau: Ostinato là một mẫu ngắn lặp đi lặp lại rất nhiều lần.
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n38
  cau: "Quá trình cộng dồn (additive process): mẫu được thêm dần từng nốt (hay từng đơn vị nhỏ) qua mỗi lần lặp."
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n39
  cau: "Lệch pha (phasing): hai người chơi cùng một mẫu, một người nhanh hơn rất ít, nên hai mẫu dần lệch nhau và tạo ra tiết tấu mới."
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n40
  cau: Reich, Piano Phase, 1967.
  loai: nam
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n41
  cau: Âm nhạc tối giản biến đổi rất chậm; người nghe tập trung vào những thay đổi nhỏ trong một bề mặt gần như đứng yên.
  loai: quy-tac
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n42
  cau: Cage và những người cùng thời để một phần âm nhạc cho sự ngẫu nhiên quyết định.
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n43
  cau: "Các cách dùng ngẫu nhiên: tung đồng xu, gieo xúc xắc hay tra Kinh Dịch để chọn các yếu tố; hay để người chơi tự chọn thứ tự các đoạn."
  loai: danh-muc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n44
  cau: Một tác phẩm nổi tiếng của Cage, 4′33″ (1952).
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n45
  cau: '4′33″ là 4 phút 33 giây người biểu diễn không chơi gì: "âm nhạc" là mọi âm thanh trong khán phòng.'
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n46
  cau: "Spiegel im Spiegel của Pärt: điểm chung với tối giản là lặp lại và biến đổi rất chậm."
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n50
  cau: "Quiz 1: có 2 gam toàn cung khác nhau (gam từ Đô và từ Đô♯)."
  loai: so-lieu
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n51
  cau: "Quiz 2: gam bát cung xây từ nửa cung và cung xen kẽ; 8 nốt; chỉ 3 gam khác nhau."
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n52
  cau: "Quiz 3: dãy có 4 dạng cơ bản; nhân 12 cao độ thành 48 dạng."
  loai: so-lieu
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n53
  cau: "Quiz 4: lệch pha là kỹ thuật của Steve Reich; ví dụ Piano Phase (1967)."
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n49
  cau: "Bài tập 2 và 3: nghe Sacre và Spiegel im Spiegel."
  loai: khuyen-tap
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n33
  cau: Dãy ấy nghe gần với nhạc tonal hơn.
  loai: khuyen-tap
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n15
  cau: Gam bát cung có âm thanh căng, kỳ ảo.
  loai: khuyen-tap
- trang: nhac-ly/am-hoc
  id: n3
  cau: Âm thanh là dao động truyền đi trong không khí (hay vật chất khác).
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n4
  cau: "Cao độ ứng với tần số (số dao động mỗi giây, đơn vị Hz): cao hay thấp."
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n5
  cau: Độ to nhỏ của âm thanh ứng với biên độ dao động (bảng gọi là "cường độ").
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n6
  cau: Âm sắc, "giọng" riêng của từng nhạc cụ, phụ thuộc vào tỉ lệ các bồi âm trong âm thanh.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n7
  cau: Tai người nghe được khoảng 20 Hz đến 20.000 Hz.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n8
  cau: Phím thấp nhất của piano (La0) khoảng 27,5 Hz, phím cao nhất (Đô8) khoảng 4.186 Hz.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n9
  cau: Dây đàn rung không chỉ cả dây (âm cơ bản) mà đồng thời rung từng nửa dây, một phần ba, một phần tư dây…; mỗi kiểu rung cho tần số gấp 2, 3, 4, 5… lần âm cơ bản.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n10
  cau: Các kiểu rung ấy là bồi âm (harmonics); đánh số từ âm cơ bản thì âm cơ bản là bồi âm số 1, gấp đôi tần số là số 2; một số tài liệu dùng overtones cho các bồi âm trên âm cơ bản và đánh số lệch một (overtone thứ nhất là bồi âm số 2).
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n11
  cau: Ta không nghe các bồi âm như những nốt riêng; chúng hòa vào nhau thành âm thanh ta nghe.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n12
  cau: "Chuỗi bồi âm trên Đô2: bồi âm 1 là Đô2, 2 là Đô3, 3 là Sol3, 4 là Đô4, 6 là Sol4, 8 là Đô5 (nốt gần nhất; 5 và 7 ở hai câu sau)."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n13
  cau: Bồi âm số 5 của Đô2 gần nhất với Mi4 và thấp hơn Mi4 khoảng 14 cent.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n14
  cau: Bồi âm số 7 của Đô2 gần nhất với Si♭4 và thấp hơn Si♭4 khoảng 31 cent.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n15
  cau: "Giữa các bồi âm liên tiếp: 1-2 là quãng 8, 2-3 quãng 5, 3-4 quãng 4, 4-5 quãng 3 trưởng, 5-6 quãng 3 thứ."
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n16
  cau: "Các bồi âm 4, 5, 6 tạo thành hợp âm Đô trưởng (Đô – Mi – Sol) với tỉ lệ tần số 4 : 5 : 6; hợp âm trưởng nằm sẵn trong chuỗi bồi âm của nốt."
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n18
  cau: Theo cách giải thích cổ điển của Helmholtz, hai nốt có tỉ lệ tần số đơn giản thì có nhiều bồi âm trùng nhau, nên tai nghe chúng "hòa" vào nhau.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n19
  cau: "Tỉ lệ tần số của các quãng thuần: 8 đúng 2:1, 5 đúng 3:2, 4 đúng 4:3, 3 trưởng 5:4, 3 thứ 6:5, 2 thứ 16:15."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n20
  cau: Quãng 8 đúng và quãng 5 đúng là thuận tai hoàn toàn.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n21
  cau: "Quãng 4 đúng tùy ngữ cảnh: thuận giữa hai bè trên, nghịch khi có bè trầm."
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n22
  cau: Quãng 3 trưởng và 3 thứ là thuận tai không hoàn toàn.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n23
  cau: Quãng 2 thứ là nghịch tai.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n24
  cau: Quan niệm quãng nào là thuận tai đã đổi nhiều qua lịch sử và khác nhau giữa các nền văn hóa.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n25
  cau: Một số nhà soạn nhạc thế kỷ 20 dùng quãng nghịch tai ngang hàng với thuận tai.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n28
  cau: Sóng sin chỉ có một đỉnh trong phổ vì không có bồi âm; âm nghe trơn, nhạt.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n30
  cau: Piano mẫu cho rất nhiều đỉnh, mạnh yếu khác nhau, và các bồi âm tắt dần theo thời gian khác nhau.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n31
  cau: Huýt sáo cho phổ chỉ có một đỉnh trội, các bồi âm yếu; giọng hát có nhiều bồi âm hơn, và mỗi nguyên âm ("a", "u"…) cho các đỉnh mạnh yếu khác nhau.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n33
  cau: Sáo, ở âm vực trung, gần như chỉ có âm cơ bản và rất ít bồi âm khác, nên nghe tròn và trong.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n34
  cau: Clarinet ở âm vực trầm có các bồi âm lẻ (1, 3, 5, 7) mạnh hơn hẳn các bồi âm chẵn, tạo âm sắc "rỗng" đặc trưng.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n35
  cau: Sáo và oboe chơi cùng một nốt vẫn nghe khác nhau vì tỉ lệ bồi âm khác nhau; âm sắc càng "sáng" thì các bồi âm cao càng mạnh.
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n37
  cau: Kèn đồng không có van (như kèn trumpet tự nhiên thời Bach) chỉ chơi được các nốt trong chuỗi bồi âm của ống kèn.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n38
  cau: Người chơi kèn đồng không van đổi nốt bằng cách thay đổi môi.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n39
  cau: Người chơi kèn horn thời Mozart còn đặt bàn tay vào loa kèn để chỉnh cao độ một số nốt.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n40
  cau: "Đàn bầu của Việt Nam chỉ có một dây và được chơi bằng bồi âm: người chơi chạm nhẹ bàn tay vào các điểm chia dây trong khi gảy, còn cần đàn (vòi đàn) uốn cao độ lên xuống."
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n41
  cau: Nghệ sĩ violin, cello, guitar dùng bồi âm (harmonics) để tạo những nốt cao trong veo như tiếng sáo.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n42
  cau: "Nếu lên dây sao cho mọi quãng 5 đều thuần (3:2) rồi đi hết vòng 12 quãng 5, ta không quay về đúng nốt ban đầu: dư ra khoảng 23,5 cent, gọi là dấu phẩy Pythagore."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n43
  cau: Không có cách nào để mọi quãng đều thuần ở mọi giọng; các hệ lên dây của phương Tây là những cách thỏa hiệp.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n44
  cau: "Hệ Pythagore: mọi quãng 5 thuần, quãng 3 trưởng rất chói; dùng ở thời Trung cổ, còn dùng đến thời Phục hưng."
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n45
  cau: "Hệ mean-tone: quãng 3 trưởng thuần; một vài giọng chơi được rất hay, các giọng xa thì không dùng được; dùng ở thời Phục hưng và Baroque."
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n46
  cau: 'Hệ bình quân cải tiến (well temperament): mọi giọng đều chơi được nhưng mỗi giọng có "màu" hơi khác; phổ biến ở thế kỷ 18–19, bắt đầu từ cuối Baroque.'
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n47
  cau: Bình quân luật (Das Wohltemperierte Klavier) của Bach thường được cho là viết cho kiểu lên dây well temperament; Bach dùng hệ chính xác nào thì còn tranh cãi.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n48
  cau: "Hệ bình quân (equal temperament) chia quãng 8 thành 12 nửa cung bằng hệt nhau: mỗi nửa cung 100 cent, tỉ lệ 2^(1/12) ≈ 1,0595."
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n49
  cau: Hệ bình quân là chuẩn cho piano từ khoảng giữa thế kỷ 19 đến nay.
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n50
  cau: Hệ bình quân cho phép chơi ở mọi giọng và chuyển giọng tự do, đổi lại mọi quãng (trừ quãng 8) đều lệch một chút so với quãng thuần.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n51
  cau: Quãng 5 bình quân chỉ lệch khoảng 2 cent so với quãng 5 thuần.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n52
  cau: Quãng 3 trưởng bình quân rộng hơn quãng 3 trưởng thuần khoảng 14 cent.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n53
  cau: Quãng 3 trưởng bình quân có tiếng "rung" (phách) mà tai luyện tốt nghe thấy.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n55
  cau: 'Hình "phách" cho thấy: bồi âm 5 của Đô4 là 1308,1 Hz; bồi âm 4 của Mi4 bình quân là 1318,5 Hz; hai bồi âm lệch nhau khoảng 10,4 Hz nên âm lượng dâng lên hạ xuống khoảng 10 lần mỗi giây; ở quãng 3 thuần (5:4) hai bồi âm trùng nhau nên âm thanh đứng yên.'
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n56
  cau: Ca sĩ, nhạc công kèn và nhiều nhạc cụ dây không cố định cao độ nên khi hát hoặc chơi hợp âm họ thường điều chỉnh về phía quãng thuần; đó có thể là một lý do dàn hợp xướng không nhạc đệm hay một dàn dây giỏi nghe "trong".
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n57
  cau: 440 Hz cho La4 được một hội nghị quốc tế ở London khuyến nghị năm 1939.
  loai: nam
- trang: nhac-ly/am-hoc
  id: n58
  cau: 440 Hz trở thành tiêu chuẩn ISO 16.
  loai: danh-muc
- trang: nhac-ly/am-hoc
  id: n59
  cau: 440 Hz là chuẩn phổ biến nhất hiện nay.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n61
  cau: Nhiều dàn nhạc châu Âu lên dây cao hơn một chút, khoảng 442–444 Hz.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n62
  cau: Các nhóm chơi nhạc Baroque bằng nhạc cụ cổ thường dùng 415 Hz, thấp hơn gần đúng nửa cung.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n63
  cau: Khi nghe một bản thu Bach "theo phong cách lịch sử", bạn có thể thấy nó thấp hơn bản nhạc in nửa cung.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n65
  cau: "Bồi âm số 3 của nốt Đô2 là Sol3 (không phải Mi3 hay Đô3): gấp 3 lần tần số, cao hơn bồi âm số 2 (Đô3) một quãng 5."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n66
  cau: "Tỉ lệ tần số của quãng 5 thuần là 3 : 2 (2 : 1 là quãng 8, 5 : 4 là quãng 3 trưởng)."
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n67
  cau: Trong hệ bình quân, một nửa cung bằng 100 cent; quãng 8 = 1200 cent chia đều cho 12 nửa cung.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n68
  cau: Âm sắc của nhạc cụ do tỉ lệ các bồi âm quyết định (không phải tần số âm cơ bản hay âm lượng); cùng cao độ, khác tỉ lệ bồi âm thì khác "giọng".
  loai: dinh-nghia
- trang: nhac-ly/am-hoc
  id: n69
  cau: Nhạc Baroque bằng nhạc cụ cổ thường lên dây La4 ở 415 Hz (không phải 440 hay 443), thấp hơn chuẩn hiện đại gần đúng nửa cung.
  loai: so-lieu
- trang: nhac-ly/am-hoc
  id: n32
  cau: Với đàn cơ, chơi một nốt trầm rồi một nốt cao và so số đỉnh bồi âm trong phổ.
  loai: khuyen-tap
- trang: nhac-ly/on-tap-1
  id: n4
  cau: Nốt nằm trên dòng kẻ phụ ngay dưới khuông khóa Sol là Đô giữa (C4), không phải Si (B3) hay Rê (D4); Đô giữa cũng là dòng kẻ phụ ngay trên khuông khóa Fa.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n5
  cau: "Trong khóa Fa, khe thứ 3 tính từ dưới lên là Mi (không phải Rê hay Fa); các khe khóa Fa: La – Đô – Mi – Sol."
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n6
  cau: Một ô nhịp 3/4 có thể gồm một nốt trắng và một nốt đen (2 + 1 = 3 phách), không phải hai nốt trắng hay một nốt tròn.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n7
  cau: Nốt trắng chấm dôi nối (dấu nối) với nốt đen dài 4 phách (3 + 1), không phải 3 hay 3 rưỡi.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n8
  cau: Trong một ô nhịp, nốt Fa đầu tiên có dấu thăng (Fa♯); nốt Fa thứ hai cùng quãng tám, không có dấu, trong ô nhịp ấy là Fa♯ (không phải Fa tự nhiên); dấu hóa bất thường còn hiệu lực đến hết ô nhịp, với các nốt cùng vị trí trên khuông.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n9
  cau: Mi♯ trên piano là phím trắng Fa (không phải phím đen); không có phím đen giữa Mi và Fa, Mi nâng nửa cung là Fa.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n10
  cau: Nhịp 6/8 có 6 nốt móc đơn mỗi ô nhịp (không phải 3 hay 8), nhóm thành hai phách lớn.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n11
  cau: A4 có tần số 440 Hz (chuẩn phổ biến); 261,6 Hz là Đô giữa, 880 Hz là A5.
  loai: so-lieu
- trang: nhac-ly/on-tap-1
  id: n12
  cau: "Sol♯ và La♭ là cặp đồng âm khác tên (không phải Sol♯ và La♯, hay Sol và La♭): cùng một phím đen giữa Sol và La."
  loai: dinh-nghia
- trang: nhac-ly/on-tap-1
  id: n13
  cau: Tám nốt móc kép bằng một nốt trắng (không phải 4 hay 16); nốt trắng = 2 phách, mỗi móc kép = 1/4 phách.
  loai: quy-tac
- trang: nhac-ly/on-tap-1
  id: n2
  cau: Nên làm lại bài ôn sau một tuần; trả lời đúng khi đã quên bớt mới là dấu hiệu bạn thật sự nhớ.
  loai: khuyen-tap
- trang: nhac-ly/on-tap-2
  id: n4
  cau: "Gam Rê trưởng có Fa♯ và Đô♯ (không phải Sol♯): Rê – Mi – Fa♯ – Sol – La – Si – Đô♯ – Rê."
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n5
  cau: Mi thứ dùng chung hóa biểu với Sol trưởng (1 dấu thăng).
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n6
  cau: Trong gam La thứ hòa âm, nốt bị nâng là Sol thành Sol♯ (bậc 7), không phải Fa hay Đô.
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n7
  cau: Hóa biểu 5 dấu thăng là của giọng Si trưởng; dấu thăng thứ năm là La♯, nửa cung trên là Si.
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n8
  cau: Hóa biểu 2 dấu giáng là của giọng thứ Sol thứ (giọng trưởng Si♭ trưởng có Sol thứ là giọng thứ song song).
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n9
  cau: Fa – Si là quãng 4 tăng (tritone), 6 nửa cung và 4 tên nốt; không phải 4 đúng hay 5 giảm.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n10
  cau: Mi – Đô (đi lên) là quãng 6 thứ (không phải 6 trưởng hay 5 tăng); đảo của Đô – Mi (3 trưởng) là 6 thứ.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n11
  cau: Trên vòng quãng năm, giọng nằm ngay bên phải (chiều kim đồng hồ) Rê trưởng là La trưởng; lên quãng 5 đúng thì thêm một dấu thăng.
  loai: quy-tac
- trang: nhac-ly/on-tap-2
  id: n12
  cau: "Bậc VII của gam trưởng cách chủ âm nửa cung (dưới chủ âm): đó là cảm âm."
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n13
  cau: Quãng 3 trưởng là thuận tai không hoàn toàn (không phải 5 đúng, là thuận hoàn toàn; không phải 2 thứ, là nghịch); quãng 3 và 6 là thuận tai không hoàn toàn.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-2
  id: n3
  cau: Nên tự làm bài tập viết ra giấy trước khi làm quiz.
  loai: khuyen-tap
- trang: nhac-ly/on-tap-3
  id: n3
  cau: Hợp âm Si – Rê – Fa là hợp âm ba giảm (3 thứ + 3 thứ), không phải thứ hay trưởng.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n4
  cau: Trong Fa trưởng, hợp âm V7 là Đô – Mi – Sol – Si♭ (bậc V là Đô; hợp âm bảy át có quãng 7 thứ), không phải Đô – Mi – Sol – Si hay Sol – Si – Rê – Fa.
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n5
  cau: Hợp âm G7 giải quyết về hợp âm C trong Đô trưởng (V7 → I), không phải F hay Am.
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n6
  cau: Hợp âm Sol trưởng với Rê ở bè trầm là thể đảo 2 (6/4), nốt năm ở bè trầm; không phải đảo 1 hay thể gốc.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n7
  cau: Chuỗi ii – V – I trong Sol trưởng là Am – D – G (bậc ii là La thứ, bậc V là Rê trưởng).
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n8
  cau: Trong giọng La thứ, hợp âm át có nốt đặc biệt Sol♯ (cảm âm từ gam thứ hòa âm), không phải Fa♯ hay Đô♯.
  loai: quy-tac
- trang: nhac-ly/on-tap-3
  id: n9
  cau: Câu nhạc kết bằng IV – I là kết plagal ("Amen"), không phải kết nửa hay kết lừa.
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n10
  cau: '"rit." nghĩa là chậm dần (ritardando), không phải nhanh dần hay trở lại tốc độ cũ.'
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n11
  cau: '"sfz" (sforzando) nghĩa là nhấn mạnh rõ (một nốt hay hợp âm nhấn mạnh), không phải rất nhỏ hay ngân dài tùy ý.'
  loai: dinh-nghia
- trang: nhac-ly/on-tap-3
  id: n12
  cau: Hợp âm bảy có cấu tạo hợp âm giảm + quãng 7 giảm là hợp âm bảy giảm, không phải bảy nửa giảm hay bảy thứ; ví dụ Si – Rê – Fa – La♭.
  loai: dinh-nghia
- trang: nhac-ly/index
  id: n10
  cau: Open Music Theory có phần phân tích nhạc vô điệu tính và lý thuyết tập hợp.
  loai: cau-truc
- trang: luyen-tai/choi-bang-tai
  id: n7
  cau: Chủ âm là nốt 'nhà' của giọng; Ode to Joy bắt đầu ở Mi, đếm ngược 3 – 2 – 1 từ Mi xuống Đô nên Mi là bậc 3.
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n10
  cau: "Au clair de la lune (bài 1) bắt đầu ở Đô: ba nốt đứng yên, rồi đi lên liền bậc."
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n11
  cau: "Frère Jacques (bài 5) bắt đầu ở Đô: Đô – Rê – Mi – Đô; câu cuối nhảy xuống Sol rồi lên lại."
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n12
  cau: Ah! vous dirai-je, maman (bài 2) bắt đầu ở Đô; có bước nhảy quãng 5 lên Sol ngay trong ô đầu.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n13
  cau: Hänschen klein (bài 4) bắt đầu ở Sol; nhảy quãng 3 xuống Mi.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n14
  cau: Amazing Grace (bài 6) bắt đầu ở Sol, thấp hơn Đô, nhịp lấy đà; nhảy quãng 4 lên Đô.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n15
  cau: Largo 'Going Home' (bài 8) bắt đầu ở Mi, nhảy quãng 3 lên Sol; nốt dài, nhịp chậm.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n18
  cau: Greensleeves là dân ca Anh, đã có một ballad cùng tên đăng ký ở London năm 1580.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n19
  cau: Nhiều bài dân ca Việt Nam xây trên thang năm âm, cùng cấu trúc khoảng cách với gam ngũ cung.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n20
  cau: Độ cao các âm trong thang năm âm của người Việt không cố định như trên phím đàn, nên giọng hát không chơi trọn được trên phím.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n24
  cau: Câu dừng lửng thường kết ở V; câu về nhà thường đi V rồi I.
  loai: quy-tac
- trang: luyen-tai/choi-bang-tai
  id: n26
  cau: "Ví dụ 1 (soạn cho trang): ở ô 3 của lần đầu, Fa của giai điệu cọ vào Mi của hợp âm Đô, tai nghe ra ngay."
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n30
  cau: Nhiều nhạc công nhạc phổ thông học nghề bằng cách chơi lại theo bản thu; Lucy Green đã đưa cách học ấy vào giờ học nhạc cụ, kể cả giờ học riêng một thầy một trò.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n31
  cau: "Giai điệu là chuỗi bậc: câu đầu Ode to Joy là 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2 ở bất kỳ giọng nào."
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n32
  cau: Dịch giọng là chơi cùng giai điệu từ một chủ âm khác; chuỗi bậc đặt lên chỗ khác của bàn phím.
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n35
  cau: Ở Fa trưởng bậc 4 là Si♭; ở Sol trưởng bậc 7 là Fa♯.
  loai: cau-truc
- trang: luyen-tai/choi-bang-tai
  id: n37
  cau: Ở thế Fa tay phải, ngón 4 rơi vào phím đen Si♭.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n38
  cau: "Ode to Joy ở Sol trưởng: giai điệu không có phím đen; hợp âm V7 của tay trái có Fa♯."
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n39
  cau: "Ode to Joy ở Fa trưởng: nốt thứ ba của giai điệu là Si♭."
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n41
  cau: Audiation là khả năng nghe được âm nhạc khi nó không vang lên thật; thuật ngữ do Edwin E. Gordon đặt.
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n48
  cau: "Quiz: ở Đô trưởng Ode to Joy bắt đầu bằng Mi, là bậc 3."
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n49
  cau: "Quiz: tay trái giữ Đô–Mi–Sol, giai điệu đến Fa nghe chói thì thử Fa (IV) hoặc Sol (V); Fa nằm trong IV (Fa–La–Đô) và V7 (Sol–Si–Rê–Fa)."
  loai: quy-tac
- trang: luyen-tai/choi-bang-tai
  id: n50
  cau: "Quiz: Ode to Joy sang Fa trưởng, bậc 4 (Fa) trở thành Si♭, phím đen dưới ngón 4 ở thế Fa."
  loai: quy-tac
- trang: luyen-tai/choi-bang-tai
  id: n5
  cau: "Mục 1 (các bước): hát trước; định giọng; xác định nốt đầu so với chủ âm; tìm từng bước; nốt sai cho biết hướng sửa."
  loai: khuyen-tap
- trang: luyen-tai/choi-bang-tai
  id: n27
  cau: "Đến lượt bạn: đệm Amazing Grace bằng ba nốt trầm Đô, Fa, Sol mỗi ô một nốt, rồi so với tay trái bài 6."
  loai: khuyen-tap
- trang: luyen-tai/choi-bang-tai
  id: n1
  cau: Chơi theo tai là tìm lại trên phím đàn một giai điệu bạn hát được, không cần bản nhạc, rồi đệm cho nó bằng vài hợp âm.
  loai: khuyen-tap
- trang: luyen-tai/nghe-gam
  id: n3
  cau: "Phân biệt trưởng hay thứ chỉ cần một nốt: bậc 3."
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n4
  cau: Bậc 3 cao (Mi trong giọng Đô) thì trưởng; bậc 3 thấp nửa cung (Mi♭) thì thứ.
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n5
  cau: Nốt chủ là nốt nghe như 'nhà', thường là nốt kết.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n7
  cau: "Gam thứ có ba dạng: tự nhiên, hòa âm, giai điệu, khác nhau ở bậc 6 và 7 khi đi lên."
  loai: danh-muc
- trang: luyen-tai/nghe-gam
  id: n8
  cau: "Thứ tự nhiên (từ La): bậc 6 và 7 là Fa – Sol."
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n9
  cau: "Thứ hòa âm (từ La): bậc 6 và 7 là Fa – Sol♯."
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n10
  cau: Quãng Fa–Sol♯ là quãng 2 tăng, gồm 3 nửa cung.
  loai: so-lieu
- trang: luyen-tai/nghe-gam
  id: n11
  cau: Quãng 2 tăng Fa–Sol♯ nghe 'gai', rất đặc trưng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n12
  cau: "Thứ giai điệu: Fa♯ – Sol♯ khi đi lên, Fa – Sol khi đi xuống."
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n13
  cau: Thứ giai điệu đi lên nghe gần như gam trưởng, chỉ khác nốt 3; đi xuống trở về thứ tự nhiên.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n14
  cau: Thứ hòa âm đặc trưng bởi quãng 2 tăng; Sol♯ là nốt dẫn, nâng nửa cung để giọng thứ có hợp âm át bảy (V7) như giọng trưởng.
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n15
  cau: Điệu thức Dorian là gam thứ tự nhiên với bậc 6 trưởng.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n16
  cau: Dorian nghe thứ nhưng sáng hơn thứ tự nhiên.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n17
  cau: Điệu thức Phrygian là gam thứ tự nhiên với bậc 2 thứ; bước đầu tiên của gam chỉ nửa cung.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n18
  cau: Phrygian nghe tối.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n19
  cau: Điệu thức Lydian là gam trưởng với bậc 4 tăng.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n20
  cau: Lydian nghe trưởng nhưng mơ màng, lơ lửng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n21
  cau: Điệu thức Mixolydian là gam trưởng với bậc 7 thứ.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n22
  cau: Mixolydian nghe trưởng nhưng bớt chói.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n23
  cau: Điệu thức Locrian là gam thứ tự nhiên với bậc 2 thứ và bậc 5 giảm.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n24
  cau: Locrian bất ổn nhất, vì hợp âm ba trên chủ âm của nó là hợp âm giảm.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n25
  cau: Gam thứ từ La mà có Fa♯ thay cho Fa là Dorian; gam trưởng từ Đô mà có Si♭ thay cho Si là Mixolydian.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n28
  cau: Gam ngũ cung chỉ có 5 nốt và không có nửa cung.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n29
  cau: Gam ngũ cung nghe thoáng, trống trải, không căng thẳng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n30
  cau: Gam ngũ cung có mặt trong nhạc của nhiều nơi trên thế giới, kể cả nhạc truyền thống Việt Nam.
  loai: lich-su
- trang: luyen-tai/nghe-gam
  id: n31
  cau: Gam toàn cung có 6 nốt và cũng không có nửa cung.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n38
  cau: "Quiz: muốn phân biệt nhanh trưởng hay thứ thì nghe bậc 3."
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n39
  cau: "Quiz: quãng 2 tăng Fa–Sol♯ ở cuối gam thứ đi lên là dấu hiệu của thứ hòa âm; Sol♯ là nốt dẫn tạo át bảy (V7)."
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n40
  cau: "Quiz: gam thứ có bậc 6 trưởng thay vì thứ là Dorian."
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n41
  cau: "Quiz: ngũ cung chỉ có 5 nốt với toàn cung và quãng 3 thứ, không chỗ nào xít."
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n6
  cau: Nhận ra sáng hay tối ở bậc 3 là đủ để đoán trưởng/thứ trong đa số trường hợp.
  loai: khuyen-tap
- trang: luyen-tai/nghe-gam
  id: n26
  cau: "Đừng học thuộc lòng 7 điệu thức: so với gam trưởng/thứ gần nhất và tìm đúng một nốt khác."
  loai: khuyen-tap
- trang: luyen-tai/nghe-gam
  id: n34
  cau: "Các bước tập bậc trong gam: nghe gam Đô trưởng, nghe một nốt, hát từ chủ âm đếm 1–2–3, rồi bỏ bước hát."
  loai: khuyen-tap
- trang: luyen-tai/nghe-hop-am
  id: n4
  cau: "Có bốn loại hợp âm ba: trưởng, thứ, giảm, tăng."
  loai: danh-muc
- trang: luyen-tai/nghe-hop-am
  id: n5
  cau: "Hợp âm trưởng: Đô – Mi – Sol."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n6
  cau: Hợp âm trưởng nghe sáng, vui, vững chãi.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n7
  cau: "Hợp âm thứ: Đô – Mi♭ – Sol."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n8
  cau: Hợp âm thứ nghe tối, buồn, dịu; khác hợp âm trưởng đúng một nốt, nốt giữa (bậc 3).
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n9
  cau: "Hợp âm giảm: Đô – Mi♭ – Sol♭."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n10
  cau: Hợp âm giảm nghe căng, co lại, bất ổn, như đang 'nhíu mày'.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n11
  cau: "Hợp âm tăng: Đô – Mi – Sol♯."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n12
  cau: Hợp âm tăng nghe lơ lửng, mơ màng và là loại hiếm gặp nhất.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n13
  cau: "Chìa khóa phân biệt trưởng và thứ là bậc 3 của hợp âm: Mi hay Mi♭ trong hợp âm Đô."
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n15
  cau: Hợp âm rải (arpeggio) là các nốt vang lần lượt; hợp âm chập (block) là các nốt vang cùng lúc.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n16
  cau: Hợp âm rải Đô–Mi–Sol gồm hai quãng 3 liên tiếp, nên dễ nghe từng quãng.
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n18
  cau: Nốt trầm là gốc thì hợp âm ở thế gốc; trầm là bậc 3 thì thể đảo 1; trầm là bậc 5 thì thể đảo 2.
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n19
  cau: Thế gốc nghe vững nhất, thể đảo 1 bồng bềnh hơn, thể đảo 2 lửng lơ nhất.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n21
  cau: Thêm nốt thứ tư, cách gốc một quãng 7, tạo ra năm loại hợp âm bảy.
  loai: danh-muc
- trang: luyen-tai/nghe-hop-am
  id: n22
  cau: "Trưởng bảy: Đô–Mi–Sol–Si."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n23
  cau: Trưởng bảy nghe sang, mơ màng, 'nhạc jazz êm'.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n24
  cau: "Át bảy: Đô–Mi–Sol–Si♭."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n25
  cau: Hợp âm át bảy chứa tritone Mi–Si♭ (bậc 3 và bậc 7), nên nghe thúc về hợp âm chủ.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n26
  cau: "Thứ bảy: Đô–Mi♭–Sol–Si♭."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n27
  cau: Thứ bảy nghe êm, buồn nhẹ, thư giãn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n28
  cau: "Nửa giảm: Đô–Mi♭–Sol♭–Si♭."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n29
  cau: Hợp âm nửa giảm gặp ở bậc 7 của giọng trưởng và bậc 2 của giọng thứ.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n30
  cau: Hợp âm nửa giảm nghe căng, u ám.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n31
  cau: "Giảm bảy: Đô–Mi♭–Sol♭–Si𝄫."
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n32
  cau: Hợp âm giảm bảy nghe căng tột độ, chênh vênh.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n33
  cau: Hợp âm giảm bảy hay dùng trước khi chuyển giọng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n42
  cau: "Quiz: nghe hợp âm tối, buồn thì khả năng cao là hợp âm thứ."
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n43
  cau: "Quiz: hợp âm trưởng và thứ khác nhau ở nốt giữa (bậc 3)."
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n44
  cau: "Quiz: để đoán thể đảo, nghe nốt trầm nhất; nốt trầm cho biết thế gốc, đảo 1 (bậc 3) hay đảo 2 (bậc 5)."
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n45
  cau: "Quiz: hợp âm bảy thường dùng làm hợp âm át, nghe muốn đi tiếp về chủ, là át bảy; ví dụ Sol7 = Sol–Si–Rê–Fa chứa tritone và thúc về Đô."
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n34
  cau: Hợp âm bảy khó hơn hợp âm ba nhiều; chỉ tập khi đã phân biệt trưởng/thứ thành thạo.
  loai: khuyen-tap
- trang: luyen-tai/nghe-hop-am
  id: n37
  cau: "Chế độ rải từng nốt dễ hơn chập cùng lúc: tập rải trước."
  loai: khuyen-tap
- trang: luyen-tai/nghe-hop-am
  id: n1
  cau: "Nghe hợp âm là nghe 'màu' của một khối âm thanh: sáng hay tối, căng hay êm, muốn đứng yên hay muốn đi tiếp."
  loai: khuyen-tap
- trang: luyen-tai/nghe-quang
  id: n1
  cau: Nghe quãng là nghe khoảng cách giữa hai nốt.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n2
  cau: Giai điệu là chuỗi các quãng nối nhau.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n6
  cau: Quãng đúng gồm quãng 1, 4, 5 và 8.
  loai: danh-muc
- trang: luyen-tai/nghe-quang
  id: n7
  cau: Quãng đúng nghe vang, rỗng, vững chãi; quãng 5 đúng nghe trống một cách đẹp đẽ; quãng 4 đúng nghe hơi lửng lơ, muốn đi tiếp.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n8
  cau: "Quãng 3 và quãng 6 đều có hai loại: trưởng và thứ."
  loai: danh-muc
- trang: luyen-tai/nghe-quang
  id: n9
  cau: Quãng trưởng nghe sáng, quãng thứ nghe tối.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n10
  cau: Quãng 3 và 6 là nhóm quyết định cảm xúc của giai điệu và hợp âm.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n11
  cau: "Quãng 2 và quãng 7 đều có hai loại: trưởng và thứ."
  loai: danh-muc
- trang: luyen-tai/nghe-quang
  id: n12
  cau: Quãng 2 và 7 là các quãng nghịch; tai muốn chúng 'giải quyết' sang quãng êm hơn.
  loai: quy-tac
- trang: luyen-tai/nghe-quang
  id: n13
  cau: Tritone là quãng 4 tăng hoặc 5 giảm.
  loai: ten
- trang: luyen-tai/nghe-quang
  id: n14
  cau: Tritone gồm 6 nửa cung, chia đôi quãng tám.
  loai: so-lieu
- trang: luyen-tai/nghe-quang
  id: n15
  cau: Tritone nghe căng, bất ổn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n16
  cau: Tritone có mặt trong hợp âm át bảy (V7).
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n20
  cau: Quãng 3 trưởng là bậc 3 của gam trưởng; quãng 3 thứ là bậc 3 của gam thứ (tính từ chủ âm).
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n22
  cau: Quãng 4 đúng gợi nhớ bằng 'Here Comes the Bride', quãng 5 đúng bằng 'Twinkle Twinkle'.
  loai: so-lieu
- trang: luyen-tai/nghe-quang
  id: n30
  cau: "Quiz: nghe quãng 'sáng' thì nghĩ đến quãng 3 hoặc 6 trưởng, không phải quãng đúng hay quãng 2."
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n31
  cau: "Quiz: lý do nên phân biệt trưởng/thứ trước là cảm giác sáng/tối dễ nghe hơn, giúp loại bớt ứng viên; không phải vì trưởng và thứ có cùng số nửa cung."
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n32
  cau: "Quiz: quãng gồm 6 nửa cung và có mặt trong hợp âm át bảy (V7) là tritone; ví dụ Si–Fa trong Sol7 (Sol–Si–Rê–Fa) ở giọng Đô trưởng."
  loai: so-lieu
- trang: luyen-tai/nghe-quang
  id: n3
  cau: "Nghe quãng là kỹ năng nền của mọi luyện tai: nghe được quãng thì hát đúng cao độ và chép lại được nhạc mình nghe."
  loai: khuyen-tap
- trang: luyen-tai/nghe-quang
  id: n33
  cau: "Quiz: khi nghe quãng hòa âm mà bí, tách hai nốt: nghe nốt trầm trước, hát nó lên, rồi tìm nốt cao."
  loai: khuyen-tap
- trang: luyen-tai/nghe-quang
  id: n19
  cau: "Kỹ thuật 2: với quãng hòa âm, nghe nốt trầm trước, hát nó lên rồi tìm nốt cao."
  loai: khuyen-tap
- trang: luyen-tai/nghe-tien-trinh
  id: n1
  cau: Tiến trình hòa âm (chord progression) là chuỗi hợp âm nâng đỡ cả bản nhạc.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n4
  cau: Nốt trầm nhất quyết định thể của hợp âm; khi hợp âm ở thể gốc, nốt trầm chính là gốc của hợp âm.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n5
  cau: Nghe được đường đi của bè trầm là nghe được phần lớn tiến trình.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n6
  cau: Bè trầm đi Đô – Fa – Sol – Đô thường là tiến trình I – IV – V – I ở giọng Đô trưởng.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n7
  cau: Nốt trầm đứng yên ở Sol trong khi hợp âm bên trên đổi thường là I6/4 rồi V ngay trước kết.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n9
  cau: Chuỗi các bậc trầm cho khung của tiến trình hòa âm; hợp âm ở thể đảo thì nốt trầm không phải gốc.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n10
  cau: "Khối nhạc 1: I – IV – V – I (hợp âm Đô, Fa, Sol, Đô), tay trái chơi nốt gốc Đô, Fa, Sol, Đô."
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n11
  cau: Cảm giác 'đi xa rồi về nhà' chính là V – I cuối cùng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n13
  cau: Tiến trình I – IV – I6/4 – V – I có bè trầm Sol đứng yên qua hai hợp âm rồi về Đô.
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n14
  cau: I – IV – I6/4 – V – I là kết của rất nhiều bản Cổ điển.
  loai: lich-su
- trang: luyen-tai/nghe-tien-trinh
  id: n15
  cau: Tiến trình I – ii6 – V7 – I có bè trầm Đô – Fa – Sol – Đô, hợp âm trên Fa là Rê – Fa – La.
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n16
  cau: "Chuỗi quãng năm đi xuống: mỗi bước xuống một quãng năm (hoặc lên một quãng bốn)."
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n17
  cau: Prinner có bè trầm Fa – Mi – Rê – Đô (xuống từng bậc, bậc 4–3–2–1).
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n18
  cau: Romanesca có bè trầm Đô – Si – La – Mi (bậc 1–7–6–3).
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n20
  cau: Ở ô 2 của ví dụ I – IV – I6/4 – V – I, tay phải chơi lại hợp âm Đô trưởng nhưng bè trầm đã sang Sol; hai nốt trên trượt xuống 'sáu xuống năm, bốn xuống ba' rồi mới về nhà.
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n21
  cau: Bè trầm trong Canon của Pachelbel xuống quãng bốn rồi lên một bậc (Đô – Sol – La – Mi – Fa – Đô), rồi Fa – Sol.
  loai: so-lieu
- trang: luyen-tai/nghe-tien-trinh
  id: n22
  cau: Gjerdingen nhận ra ở bè trầm Pachelbel một mẫu Romanesca.
  loai: lich-su
- trang: luyen-tai/nghe-tien-trinh
  id: n23
  cau: Kết (cadence) là chuỗi hợp âm ở cuối một câu nhạc, như dấu chấm, dấu phẩy trong văn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n24
  cau: "Có bốn loại kết trong ví dụ: kết trọn (V – I), kết plagal (IV – I), kết lừa (V – vi) và kết nửa (dừng ở V)."
  loai: danh-muc
- trang: luyen-tai/nghe-tien-trinh
  id: n28
  cau: Kết trọn nghe dừng hẳn, trọn vẹn, như dấu chấm.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n29
  cau: Kết nửa nghe lơ lửng, chờ câu tiếp, như dấu phẩy.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n30
  cau: Kết plagal nghe êm, trang nghiêm, 'A-men'.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n31
  cau: Kết lừa nghe tưởng về nhà nhưng rẽ sang hợp âm buồn hơn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n37
  cau: "Quiz: để nghe ra tiến trình hòa âm, tập trung vào bè trầm nhất, thường là gốc hợp âm."
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n38
  cau: "Quiz: trong I – IV – I6/4 – V – I, bè trầm đứng yên ở Sol khi đi từ I6/4 sang V."
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n39
  cau: "Quiz: hai hợp âm cuối Sol – La thứ (V – vi) là kết lừa."
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n40
  cau: "Quiz: kết nửa nghe như dấu phẩy, dừng ở V mà chưa về I."
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n33
  cau: "Mozart: Minuet Fa trưởng K. 2: nghe từng câu nhạc và thử gọi tên chỗ kết ở cuối mỗi câu."
  loai: khuyen-tap
- trang: luyen-tai/nghe-tien-trinh
  id: n35
  cau: "Bài bạn đang tập: chơi chậm riêng bè trầm, hát theo, đánh dấu mỗi chỗ kết và gọi tên."
  loai: khuyen-tap
- trang: luyen-tai/nghe-tien-trinh
  id: n25
  cau: "Mẹo: chỉ nghe hai hợp âm cuối câu và hỏi có về nhà (I) không."
  loai: khuyen-tap
- trang: luyen-tai/nghe-tiet-tau
  id: n3
  cau: Nhạc có nhịp đều đặn có phách mạnh lặp lại; đếm số phách giữa hai lần mạnh thì biết nhịp.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n4
  cau: Phách mạnh thường được nhấn bằng tiếng trầm hơn, như trống cái hay nốt bass.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n5
  cau: "Nhịp 2: mạnh – nhẹ, lặp lại."
  loai: cau-truc
- trang: luyen-tai/nghe-tiet-tau
  id: n6
  cau: Nhịp 2 gặp ở polka và hành khúc nhanh.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n7
  cau: "Nhịp 3: mạnh – nhẹ – nhẹ, lặp lại; gặp ở valse và minuet."
  loai: cau-truc
- trang: luyen-tai/nghe-tiet-tau
  id: n8
  cau: "Nhịp 4: mạnh – nhẹ – vừa – nhẹ, lặp lại."
  loai: cau-truc
- trang: luyen-tai/nghe-tiet-tau
  id: n9
  cau: Nhịp 4 rất phổ biến, nhất là trong nhạc pop, rock.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n11
  cau: "Nhịp đơn (2/4, 3/4, 4/4): mỗi phách chia 2, đếm 1 và 2 và."
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n12
  cau: "Nhịp kép (6/8, 9/8, 12/8): mỗi phách chia 3, đếm 1 la li 2 la li."
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n13
  cau: Nhịp đơn nghe gọn, bước đi; nhịp kép nghe đu đưa, lênh đênh.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n16
  cau: Câu 'đen – móc đơn móc đơn – đen' trong 4/4 đếm '1 và 2–và 3 và 4 và', nốt rơi vào 1, 2, 'và' của 2, 3.
  loai: so-lieu
- trang: luyen-tai/nghe-tiet-tau
  id: n18
  cau: Syncopation (đảo phách) là khi nốt nhấn rơi vào phách yếu hoặc vào 'và'.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
