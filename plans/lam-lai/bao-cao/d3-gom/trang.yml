- trang: nhac-ly/09-quang
  id: n1
  cau: Quãng là khoảng cách cao độ giữa hai nốt.
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n2
  cau: "Mỗi quãng có hai phần tên: con số (2, 3, 4…) và tính chất (trưởng, thứ, đúng, tăng, giảm)."
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n3
  cau: 'Ví dụ: "quãng 3 trưởng", "quãng 5 đúng".'
  loai: ten
- trang: nhac-ly/09-quang
  id: n4
  cau: Hai nốt vang lên lần lượt tạo quãng giai điệu; vang lên cùng lúc tạo quãng hòa âm.
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n5
  cau: "Con số của quãng: đếm số tên nốt, tính cả nốt đầu và nốt cuối."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n6
  cau: "Đô → Mi: Đô, Rê, Mi = 3 tên → quãng 3."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n7
  cau: "Đô → Sol: Đô, Rê, Mi, Fa, Sol = 5 tên → quãng 5."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n8
  cau: "Hai nốt cùng tên, cùng cao độ: quãng 1 (đồng âm). Cách một quãng tám: quãng 8."
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n9
  cau: "Con số không phụ thuộc vào dấu hóa: Đô → Mi, Đô → Mi♭ và Đô♯ → Mi♭ đều là quãng 3."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n10
  cau: Tính chất được xác định bằng số nửa cung chính xác.
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n11
  cau: "Quãng 1 đúng có 0 nửa cung (ví dụ từ Đô: Đô – Đô)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n12
  cau: "Quãng 2 thứ có 1 nửa cung (ví dụ từ Đô: Đô – Rê♭)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n13
  cau: "Quãng 2 trưởng có 2 nửa cung (ví dụ từ Đô: Đô – Rê)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n14
  cau: "Quãng 3 thứ có 3 nửa cung (ví dụ từ Đô: Đô – Mi♭)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n15
  cau: "Quãng 3 trưởng có 4 nửa cung (ví dụ từ Đô: Đô – Mi)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n16
  cau: "Quãng 4 đúng có 5 nửa cung (ví dụ từ Đô: Đô – Fa)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n17
  cau: "Quãng 4 tăng / 5 giảm có 6 nửa cung (ví dụ từ Đô: Đô – Fa♯ / Đô – Sol♭)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n18
  cau: "Quãng 5 đúng có 7 nửa cung (ví dụ từ Đô: Đô – Sol)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n19
  cau: "Quãng 6 thứ có 8 nửa cung (ví dụ từ Đô: Đô – La♭)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n20
  cau: "Quãng 6 trưởng có 9 nửa cung (ví dụ từ Đô: Đô – La)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n21
  cau: "Quãng 7 thứ có 10 nửa cung (ví dụ từ Đô: Đô – Si♭)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n22
  cau: "Quãng 7 trưởng có 11 nửa cung (ví dụ từ Đô: Đô – Si)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n23
  cau: "Quãng 8 đúng có 12 nửa cung (ví dụ từ Đô: Đô – Đô)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n24
  cau: Quãng 1, 4, 5, 8 có dạng đúng (perfect).
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n25
  cau: "Quãng 1, 4, 5, 8: rộng hơn nửa cung (so với quãng đúng) là tăng, hẹp hơn nửa cung là giảm."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n26
  cau: Quãng 2, 3, 6, 7 có dạng trưởng và thứ (thứ hẹp hơn trưởng nửa cung).
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n27
  cau: "Quãng 2, 3, 6, 7: rộng hơn trưởng là tăng, hẹp hơn thứ là giảm."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n28
  cau: Quãng 6 nửa cung (4 tăng hoặc 5 giảm) chia đôi quãng tám, gọi là tritone (ba cung nguyên).
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n29
  cau: Tritone được xếp vào quãng nghịch.
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n30
  cau: Từ thời trung đại, việc dùng tritone từng bị cấm; có câu mi contra fa diabolus est in musica ("mi đối với fa là quỷ dữ trong âm nhạc") nói về quãng này.
  loai: lich-su
- trang: nhac-ly/09-quang
  id: n31
  cau: Nếu nốt trên nằm trong gam trưởng của nốt dưới, thì quãng đó là trưởng (với 2, 3, 6, 7) hoặc đúng (với 1, 4, 5, 8).
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n32
  cau: Nếu nốt trên thấp hơn nửa cung so với nốt trong gam, quãng đó là thứ (hoặc giảm với 4, 5, 8).
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n33
  cau: Rê → Fa. Gam Rê trưởng có Fa♯. Fa thấp hơn Fa♯ nửa cung, nên Rê → Fa là quãng 3 thứ.
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n34
  cau: Quãng lớn hơn quãng 8 gọi là quãng ghép.
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n35
  cau: "Trừ đi 7 để được quãng đơn tương ứng: quãng 9 là quãng 2 cộng một quãng 8, quãng 10 là quãng 3 cộng một quãng 8, quãng 11 là quãng 4, quãng 12 là quãng 5, quãng 13 là quãng 6."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n36
  cau: "Tính chất của quãng ghép giữ nguyên quãng đơn: Đô4 – Rê5 là 9 trưởng (14 nửa cung)."
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n37
  cau: Quãng ghép có mặt trong tên hợp âm (như C9).
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n39
  cau: Đưa nốt dưới lên một quãng tám (hoặc nốt trên xuống một quãng tám) là đảo quãng.
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n40
  cau: "Đảo quãng: con số mới = 9 − con số cũ (quãng 3 đảo thành quãng 6, quãng 2 thành quãng 7)."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n41
  cau: "Đảo quãng: tính chất đổi trưởng ↔ thứ, tăng ↔ giảm, đúng vẫn là đúng."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n42
  cau: Đô – Mi (3 trưởng) đảo thành Mi – Đô (6 thứ).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n43
  cau: Quãng 1, 5, 8 đúng là thuận hoàn toàn; ổn định, không cần giải quyết.
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n44
  cau: Quãng 3 và 6 (trưởng, thứ) là thuận không hoàn toàn; ổn định, không cần giải quyết.
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n45
  cau: Quãng 2, 7 và tritone là nghịch; kém ổn định, như cần được giải quyết.
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n46
  cau: "Quãng 4 đúng tùy ngữ cảnh: thuận giữa hai bè trên, nghịch khi có bè trầm."
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n47
  cau: 'Khuông nhạc "Các quãng từ Đô (lần lượt rồi cùng lúc)": các quãng 3 trưởng, 5 đúng, 6 trưởng, 8 đúng từ Đô, mỗi quãng phát lần lượt rồi cùng lúc.'
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n56
  cau: Mi – Sol là quãng 3 thứ (3 nửa cung).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n57
  cau: Fa – Si là quãng 4 tăng (6 nửa cung).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n58
  cau: La – Fa (đi lên) là quãng 6 thứ (8 nửa cung).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n59
  cau: Rê – Rê♯ là quãng 1 tăng (1 nửa cung).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n60
  cau: Đảo quãng 6 thứ được quãng 3 trưởng (9 − 6 = 3, thứ đổi thành trưởng).
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n61
  cau: Đô – Mi♭ là quãng 3 thứ (ba tên nốt Đô, Rê, Mi và 3 nửa cung).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n62
  cau: Quãng 5 đúng có 7 nửa cung (Đô – Sol).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n63
  cau: Đảo quãng 2 trưởng được quãng 7 thứ (9 − 2 = 7, trưởng đổi thành thứ).
  loai: quy-tac
- trang: nhac-ly/09-quang
  id: n64
  cau: Tritone (4 tăng hay 5 giảm) gồm 6 nửa cung, chia đôi quãng tám.
  loai: dinh-nghia
- trang: nhac-ly/09-quang
  id: n65
  cau: Rê – Fa♯ là quãng 3 trưởng (Fa♯ nằm trong gam Rê trưởng, 4 nửa cung).
  loai: so-lieu
- trang: nhac-ly/09-quang
  id: n54
  cau: "Trên đàn, quãng thành độ mở của bàn tay: quãng 2 là hai ngón liền nhau, quãng 5 là ngón 1 và 5 ở thế năm ngón, quãng 8 là gần cả bàn tay."
  loai: khuyen-tap
- trang: nhac-ly/09-quang
  id: n55
  cau: Đọc theo quãng (nhìn khoảng cách) thay vì gọi tên từng nốt giúp thị tấu nhanh hơn.
  loai: khuyen-tap
- trang: nhac-ly/10-hop-am-ba
  id: n1
  cau: Hợp âm là ba nốt trở lên vang lên cùng lúc.
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n2
  cau: Hợp âm ba (triad) là hợp âm có ba nốt xếp chồng quãng 3.
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n3
  cau: Hợp âm ba là loại hợp âm ít nốt nhất.
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n4
  cau: "Nốt gốc (root): nốt dưới cùng khi xếp chồng quãng 3, đặt tên cho hợp âm."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n5
  cau: "Nốt ba (third): cách nốt gốc quãng 3."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n6
  cau: "Nốt năm (fifth): cách nốt gốc quãng 5."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n7
  cau: "Ví dụ hợp âm Đô trưởng: Đô – Mi – Sol."
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n9
  cau: "Hợp âm trưởng: 3 trưởng + 3 thứ (từ dưới lên); ví dụ từ Đô: Đô – Mi – Sol; ký hiệu C."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n10
  cau: "Hợp âm thứ: 3 thứ + 3 trưởng (từ dưới lên); ví dụ từ Đô: Đô – Mi♭ – Sol; ký hiệu Cm."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n11
  cau: "Hợp âm giảm: 3 thứ + 3 thứ (từ dưới lên); ví dụ từ Đô: Đô – Mi♭ – Sol♭; ký hiệu C° hoặc Cdim."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n12
  cau: "Hợp âm tăng: 3 trưởng + 3 trưởng (từ dưới lên); ví dụ từ Đô: Đô – Mi – Sol♯; ký hiệu C+ hoặc Caug."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n13
  cau: "Bốn loại hợp âm ba thường được mô tả: trưởng vui, thứ buồn, giảm đáng sợ, tăng huyền ảo."
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n14
  cau: Khuông nhạc "Trưởng – thứ – giảm – tăng (từ Đô)" gồm bốn hợp âm Đô – Mi – Sol, Đô – Mi♭ – Sol, Đô – Mi♭ – Sol♭, Đô – Mi – Sol♯.
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n15
  cau: Hợp âm trưởng và thứ đều có quãng 5 đúng giữa nốt gốc và nốt năm; chúng chỉ khác nhau ở nốt ba. Hợp âm giảm có quãng 5 giảm, hợp âm tăng có quãng 5 tăng.
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n16
  cau: Xây hợp âm ba trên từng nốt của gam trưởng, chỉ dùng nốt trong gam, ta được 7 hợp âm.
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n17
  cau: "Hợp âm trên các bậc được đánh số La Mã: chữ hoa cho hợp âm trưởng, chữ thường cho hợp âm thứ, thêm ° cho hợp âm giảm."
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n18
  cau: "Trong giọng trưởng: I, IV, V là hợp âm trưởng; ii, iii, vi là hợp âm thứ; vii° là hợp âm giảm."
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n19
  cau: Trong Đô trưởng bảy hợp âm là C, Dm, Em, F, G, Am, B°.
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n20
  cau: "Quy luật này giống nhau ở mọi giọng trưởng: I, IV, V luôn trưởng; ii, iii, vi luôn thứ; vii° luôn giảm."
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n21
  cau: Khuông nhạc "7 hợp âm của Đô trưởng" gồm [CEG] [DFA] [EGB] [FAc] [GBd] [Ace] [Bdf] (C, Dm, Em, F, G, Am, B°).
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n22
  cau: Giọng thứ xây hợp âm từ gam thứ tự nhiên, riêng bậc V và vii° dùng cảm âm được nâng (như ở gam thứ hòa âm), để bậc V có cảm âm và trở thành hợp âm trưởng.
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n23
  cau: "Trong La thứ: i Am, ii° B°, III C, iv Dm, V E, VI F, vii° G♯°."
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n24
  cau: Nếu xếp chồng quãng 3 hoàn toàn trên gam thứ hòa âm, bậc III là hợp âm tăng C+. Người ta không dùng nó mà dùng C trưởng, vì cảm âm chỉ được nâng ở bậc V và vii°.
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n29
  cau: "Các hợp âm: Sol trưởng là Sol – Si – Rê; Rê thứ là Rê – Fa – La; Si giảm là Si – Rê – Fa; Fa tăng là Fa – La – Đô♯."
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n30
  cau: "Trong Sol trưởng, bậc V là Rê trưởng (D): Rê – Fa♯ – La; bậc vi là Mi thứ (Em): Mi – Sol – Si."
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n32
  cau: "Hợp âm thứ gồm (từ dưới lên) 3 thứ + 3 trưởng; ví dụ La thứ: La – Đô (3 thứ), Đô – Mi (3 trưởng)."
  loai: so-lieu
- trang: nhac-ly/10-hop-am-ba
  id: n33
  cau: "Trong giọng trưởng, hợp âm bậc vii° là hợp âm giảm; ví dụ trong Đô trưởng: Si – Rê – Fa."
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n34
  cau: Hợp âm Đô – Mi – Sol♯ là hợp âm tăng (hai quãng 3 trưởng chồng lên nhau).
  loai: dinh-nghia
- trang: nhac-ly/10-hop-am-ba
  id: n35
  cau: Giọng thứ nâng bậc 7 khi xây hợp âm bậc V để bậc V có cảm âm và trở thành hợp âm trưởng; bậc 7 được nâng thành cảm âm nên bậc V thành hợp âm trưởng và có đà đi về chủ âm.
  loai: quy-tac
- trang: nhac-ly/10-hop-am-ba
  id: n27
  cau: "Hợp âm ba ở thế gốc: tay phải ngón 1-3-5, tay trái 5-3-1. Chơi khối, rồi rải từng nốt, rồi thử các hình đệm (Alberti, valse)."
  loai: khuyen-tap
- trang: nhac-ly/11-hop-am-bay
  id: n1
  cau: Nốt nằm ở bè trầm (thấp nhất) quyết định thể của hợp âm.
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n2
  cau: "Thể gốc: nốt gốc ở bè trầm (ví dụ Đô – Mi – Sol), không ghi ký hiệu số, ký hiệu hợp âm C."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n3
  cau: "Đảo 1: nốt ba ở bè trầm (ví dụ Mi – Sol – Đô), ký hiệu số 6, ký hiệu hợp âm C/E."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n4
  cau: "Đảo 2: nốt năm ở bè trầm (ví dụ Sol – Đô – Mi), ký hiệu số 6/4, ký hiệu hợp âm C/G."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n5
  cau: 'Khuông nhạc "Đô trưởng: thể gốc, đảo 1, đảo 2" gồm [CEG], [EGc], [Gce].'
  loai: so-lieu
- trang: nhac-ly/11-hop-am-bay
  id: n6
  cau: "Các con số 6 và 6/4 đến từ bè trầm số (figured bass) thời Baroque: chúng ghi các quãng tính từ nốt trầm."
  loai: lich-su
- trang: nhac-ly/11-hop-am-bay
  id: n7
  cau: Ký hiệu kiểu C/E (hợp âm C, bè trầm Mi) thuộc hệ ký hiệu hợp âm của jazz và nhạc pop.
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n8
  cau: Thể đảo không đổi tên hợp âm (nốt gốc vẫn là nốt gốc), chỉ đổi nốt ở bè trầm.
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n9
  cau: "Thể đảo 2 được xử lý đặc biệt: nốt năm ở bè trầm tạo quãng 4 nghịch với bè trầm."
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n10
  cau: Dạng thể đảo 2 thường gặp là 6/4 kết, trang trí cho hợp âm V ở chỗ kết.
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n11
  cau: "Chồng thêm một quãng 3 lên hợp âm ba, ta được hợp âm bảy: bốn nốt, nốt trên cùng cách nốt gốc quãng 7."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n12
  cau: "Bảy trưởng: hợp âm trưởng + 7 trưởng; ví dụ Đô – Mi – Sol – Si; ký hiệu Cmaj7; thường gặp ở I, IV trong giọng trưởng."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n13
  cau: "Bảy át: hợp âm trưởng + 7 thứ; ví dụ Sol – Si – Rê – Fa; ký hiệu G7; thường gặp ở V7."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n14
  cau: "Bảy thứ: hợp âm thứ + 7 thứ; ví dụ Rê – Fa – La – Đô; ký hiệu Dm7; thường gặp ở ii, iii, vi."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n15
  cau: "Bảy nửa giảm: hợp âm giảm + 7 thứ; ví dụ Si – Rê – Fa – La; ký hiệu Bø7; thường gặp ở vii trong giọng trưởng."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n16
  cau: "Bảy giảm: hợp âm giảm + 7 giảm; ví dụ Si – Rê – Fa – La♭; ký hiệu B°7; thường gặp ở vii trong giọng thứ."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n17
  cau: 'Khuông nhạc "5 loại hợp âm bảy" gồm Cmaj7, G7, Dm7, Bø7, B°7: [CEGB], [G,B,DF], [DFAc], [B,DFA], [B,DF_A].'
  loai: so-lieu
- trang: nhac-ly/11-hop-am-bay
  id: n18
  cau: Hợp âm bảy át được xây trên bậc V.
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n19
  cau: Trong V7, cảm âm (Si trong Đô trưởng) muốn đi lên nửa cung về chủ âm Đô.
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n20
  cau: Trong V7, nốt bảy (Fa) muốn đi xuống về Mi.
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n21
  cau: Si và Fa trong V7 cách nhau một tritone, một quãng nghịch cần được giải quyết.
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n22
  cau: Khi Si và Fa giải quyết về Đô và Mi, ta nghe cảm giác "về nhà".
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n23
  cau: 'Khuông nhạc "V7 giải quyết về I trong Đô trưởng": [G,B,DF] rồi [C,CEG].'
  loai: so-lieu
- trang: nhac-ly/11-hop-am-bay
  id: n24
  cau: Hợp âm bảy có 4 nốt nên có ba thể đảo.
  loai: quy-tac
- trang: nhac-ly/11-hop-am-bay
  id: n25
  cau: "Hợp âm bảy: thể gốc (bè trầm nốt gốc) ký hiệu số 7; đảo 1 (nốt ba) 6/5; đảo 2 (nốt năm) 4/3; đảo 3 (nốt bảy) 4/2 (hoặc 2)."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n28
  cau: Hợp âm Fa trưởng ở đảo 1 là La – Đô – Fa; nốt La (nốt ba) ở bè trầm.
  loai: so-lieu
- trang: nhac-ly/11-hop-am-bay
  id: n29
  cau: Trong Rê trưởng, hợp âm V7 là La – Đô♯ – Mi – Sol (A7).
  loai: so-lieu
- trang: nhac-ly/11-hop-am-bay
  id: n32
  cau: Hợp âm Đô trưởng có Mi ở bè trầm là đảo 1; nốt ba ở bè trầm, ký hiệu C/E hoặc số 6.
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n33
  cau: Hợp âm bảy át được xây trên bậc V (ví dụ G7 trong Đô trưởng).
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n34
  cau: Si và Fa trong G7 tạo thành tritone; Si – Fa cách nhau 6 nửa cung.
  loai: so-lieu
- trang: nhac-ly/11-hop-am-bay
  id: n35
  cau: "Ký hiệu 6/4 là hợp âm ba đảo 2: nốt năm ở bè trầm, các quãng tính từ bè trầm là 6 và 4."
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n26
  cau: "Thể đảo giúp tay di chuyển ít: từ Đô–Mi–Sol sang Đô–Fa–La hay Si–Fa–Sol chỉ cần dời một hai ngón."
  loai: khuyen-tap
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n1
  cau: Mỗi hợp âm trong giọng có một vai trò (chức năng).
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n2
  cau: Hiểu chức năng giúp biết vì sao một chuỗi hợp âm nghe "hợp lý" và tiếp theo nó sẽ đi đâu.
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n3
  cau: "Chức năng Chủ (Tonic, T): hợp âm chính I, hợp âm cùng nhóm vi và (iii); vai trò nhà: ổn định, nghỉ ngơi."
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n4
  cau: "Chức năng Hạ át (Predominant / tiền át, PD): hợp âm chính IV, hợp âm cùng nhóm ii; vai trò rời nhà, chuẩn bị."
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n5
  cau: "Chức năng Át (Dominant, D): hợp âm chính V, V7, hợp âm cùng nhóm vii°; vai trò căng thẳng, đòi trở về nhà."
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n6
  cau: 'Hợp âm cùng nhóm dùng chung nhiều nốt: vi (La – Đô – Mi) chung hai nốt với I (Đô – Mi – Sol), nên vi thường được dùng thay cho I (một hợp âm chủ "yếu" hơn).'
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n7
  cau: 'Hình vòng chức năng: ô CHỦ ghi "I · vi".'
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n8
  cau: 'Hình vòng chức năng: ô HẠ ÁT ghi "IV · ii".'
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n9
  cau: 'Hình vòng chức năng: ô ÁT ghi "V · V7 · vii°".'
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n10
  cau: 'Hình vòng chức năng: mũi tên đi từ Chủ sang Hạ át ("rời nhà"), từ Hạ át sang Át ("chuẩn bị"), từ Át về Chủ ("về nhà").'
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n12
  cau: Nhiều bản nhạc, từ nhạc cổ điển đến nhạc pop, có câu nhạc đi theo vòng ổn định → rời đi → căng thẳng → trở về (chủ, hạ át, át, chủ).
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n13
  cau: 'Khuông nhạc "I – IV – V7 – I trong Đô trưởng": [C,EGc] [F,FAc] [G,DFB] [C,EGc].'
  loai: so-lieu
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n14
  cau: Bè trầm V → I (đi xuống quãng 5, hay lên quãng 4) là chuyển động của kết trọn (V – I), loại kết nghe dứt khoát nhất trong nhạc cổ điển phương Tây.
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n15
  cau: Vòng I – IV – V – I (C – F – G – C) là một cách đi hết vòng T → PD → D → T.
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n16
  cau: 'Vòng I – vi – IV – V (C – Am – F – G): vòng "doo-wop" của nhạc pop thập niên 1950–60, vẫn được dùng đến nay.'
  loai: lich-su
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n17
  cau: "Vòng ii – V – I (Dm – G – C): hạ át ii, át V rồi chủ I; một trong những vòng thường gặp nhất của jazz."
  loai: lich-su
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n18
  cau: Vòng hợp âm của Pachelbel Canon là I – V – vi – iii – IV – I – IV – V (C – G – Am – Em – F – C – F – G trong Đô trưởng).
  loai: cau-truc
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n19
  cau: "Vòng hợp âm của Canon, giọng Rê trưởng: D – A – Bm – F♯m – G – D – G – A."
  loai: cau-truc
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n20
  cau: Khuông nhạc "Pachelbel – vòng hợp âm của Canon" gồm D, A, Bm, F♯m, G, D, G, A (K:D) như câu trên.
  loai: so-lieu
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n22
  cau: "Giọng thứ có cùng ba chức năng: i (chủ), iv và ii° (hạ át), V và vii° (át)."
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n23
  cau: Hợp âm át của giọng thứ phải dùng cảm âm từ gam thứ hòa âm (Sol♯ trong La thứ) để có lực kéo về chủ âm.
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n24
  cau: 'Khuông nhạc "i – iv – V7 – i trong La thứ": [A,,EAc] [D,DFA] [E,D^GB] [A,,EAc].'
  loai: so-lieu
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n25
  cau: "Khi chuyển hợp âm, mỗi bè nên đi gần nhất có thể: giữ nguyên nốt chung, các nốt khác đi bước liền; đây là nguyên tắc dẫn bè (voice leading), giúp hòa âm nghe mượt mà."
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n26
  cau: Trong các ví dụ I – IV – V7 – I (Đô trưởng), vòng Canon (Rê trưởng) và i – iv – V7 – i (La thứ), bè trên cùng hầu như chỉ đi bước nhỏ.
  loai: so-lieu
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n29
  cau: "Trong Sol trưởng: Chủ là G (I) và Em (vi); Hạ át là C (IV) và Am (ii); Át là D7 (V7)."
  loai: so-lieu
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n31
  cau: Trong Đô trưởng, hợp âm có chức năng át là G (bậc V).
  loai: dinh-nghia
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n32
  cau: Hợp âm vi có thể thay cho I vì cùng chức năng chủ (vi chung hai nốt với I).
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n33
  cau: Thứ tự chức năng điển hình là Chủ → Hạ át → Át → Chủ (ổn định → rời đi → căng thẳng → trở về).
  loai: quy-tac
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n34
  cau: Trong La thứ, hợp âm át (V) gồm Mi – Sol♯ – Si, dùng cảm âm Sol♯ từ gam thứ hòa âm.
  loai: so-lieu
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n21
  cau: Nghe Pachelbel Canon và thử nhận ra lúc vòng hợp âm quay lại từ đầu.
  loai: khuyen-tap
- trang: nhac-ly/12-hoa-am-chuc-nang
  id: n27
  cau: Chơi chuỗi I – IV – I – V7 – I bằng hai tay (tay trái nốt gốc, tay phải ba nốt) ở vài giọng quen; đó là "vốn từ" hòa âm cơ bản.
  loai: khuyen-tap
- trang: nhac-ly/13-ket
  id: n1
  cau: Kết (cadence) là chuỗi hợp âm ở cuối một câu nhạc, cho người nghe biết câu đã xong hay còn tiếp.
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n2
  cau: "Tên năm loại kết trong bảng: kết trọn (perfect authentic cadence), kết chưa trọn (imperfect authentic cadence), kết nửa (half cadence), kết plagal (plagal cadence), kết lừa (deceptive cadence)."
  loai: ten
- trang: nhac-ly/13-ket
  id: n3
  cau: "Kết trọn: V – I, cả hai ở thể gốc, bè trên kết ở chủ âm."
  loai: quy-tac
- trang: nhac-ly/13-ket
  id: n4
  cau: Kết trọn giống dấu chấm hết, cảm giác kết thúc trọn vẹn.
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n5
  cau: "Kết chưa trọn: V – I, nhưng có thể đảo hoặc bè trên không ở chủ âm."
  loai: quy-tac
- trang: nhac-ly/13-ket
  id: n6
  cau: "Kết chưa trọn giống dấu chấm phẩy: kết nhưng còn hơi mở."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n7
  cau: 'Kết nửa: chuỗi "... – V" (dừng ở V).'
  loai: quy-tac
- trang: nhac-ly/13-ket
  id: n8
  cau: "Kết nửa giống dấu phẩy hay dấu hỏi: dừng lơ lửng, chờ câu sau."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n9
  cau: "Kết plagal: IV – I."
  loai: quy-tac
- trang: nhac-ly/13-ket
  id: n10
  cau: Kết plagal giống "Amen" cuối thánh ca.
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n11
  cau: "Kết plagal: về chủ âm thẳng từ IV, không qua V."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n12
  cau: "Kết lừa: V – vi."
  loai: quy-tac
- trang: nhac-ly/13-ket
  id: n13
  cau: "Kết lừa giống sự bất ngờ: tưởng về nhà nhưng rẽ hướng khác."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n14
  cau: Kết nửa — dừng ở V, nghe như một câu hỏi.
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n15
  cau: Kết plagal — "A-men".
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n16
  cau: Kết lừa — V đi về vi thay vì I.
  loai: quy-tac
- trang: nhac-ly/13-ket
  id: n17
  cau: Một câu nhạc (phrase) thường dài 4, 8 hoặc 16 ô nhịp.
  loai: so-lieu
- trang: nhac-ly/13-ket
  id: n18
  cau: Một câu nhạc thường kết thúc bằng một kết.
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n19
  cau: Hai câu ghép lại thành một đoạn nhạc (period).
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n20
  cau: "Câu hỏi (antecedent): thường kết thúc bằng kết nửa, tạo cảm giác chưa xong."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n21
  cau: "Câu trả lời (consequent): thường bắt đầu giống câu hỏi, nhưng kết thúc bằng kết mạnh hơn, thường là kết trọn."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n22
  cau: "Ode to Joy của Beethoven là một ví dụ: câu đầu dừng ở Rê (thuộc hợp âm V, kết nửa), câu sau giống câu đầu ở ba ô nhịp đầu nhưng kết ở Đô (chủ âm, kết trọn)."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n23
  cau: Bạn sẽ gặp cấu trúc câu hỏi – câu trả lời thường xuyên trong nhạc cổ điển phương Tây trước năm 1900.
  loai: so-lieu
- trang: nhac-ly/13-ket
  id: n30
  cau: "Câu hỏi 1: Kết nửa kết thúc ở hợp âm nào? Đáp án V (câu giải thích: kết nửa dừng ở hợp âm át, nghe lơ lửng)."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n31
  cau: 'Câu hỏi 2: Chuỗi IV – I là kết plagal (còn gọi là kết "Amen").'
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n32
  cau: "Câu hỏi 3: Kết lừa thường đi từ V đến vi (thay vì về chủ, nhạc rẽ sang vi)."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n33
  cau: "Câu hỏi 4: Trong một đoạn nhạc, câu hỏi thường kết thúc bằng kết nửa (đáp án); câu trả lời thường kết thúc bằng kết mạnh hơn, thường là kết trọn."
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n24
  cau: Khi tập một bản nhạc, đánh dấu các kết bằng bút chì; chúng là ranh giới tự nhiên để chia đoạn khi tập và là điểm bám khi học thuộc.
  loai: khuyen-tap
- trang: nhac-ly/13-ket
  id: n26
  cau: 'Bài tập 1: nghe một chương nhạc chậm của Mozart (gợi ý: Concerto piano số 21, chương 2); mỗi khi nhạc "dừng lại", đoán kết trọn hay kết nửa.'
  loai: khuyen-tap
- trang: nhac-ly/13-ket
  id: n27
  cau: "Bài tập 2: hát giai điệu Ode to Joy và dừng lại ở cuối câu đầu; cảm giác có khác dừng ở cuối câu thứ hai không?"
  loai: khuyen-tap
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n1
  cau: Ngoài cao độ và trường độ, bản nhạc còn cho biết chơi nhanh hay chậm, to hay nhỏ, liền hay ngắt.
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n2
  cau: Phần lớn các ký hiệu này dùng tiếng Ý, loại thuật ngữ được đưa vào từ thế kỷ 17 và dùng đến nay.
  loai: lich-su
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n5
  cau: "accelerando (accel.): nhanh dần."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n6
  cau: "ritardando (rit.), rallentando (rall.): chậm dần."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n7
  cau: "a tempo: trở lại tốc độ ban đầu."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n8
  cau: "rubato: co giãn tốc độ tự do để diễn cảm."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n9
  cau: "rubato: rất phổ biến khi chơi Chopin."
  loai: lich-su
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n10
  cau: "più mosso / meno mosso: nhanh hơn / chậm hơn."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n11
  cau: "pp, pianissimo: rất nhỏ."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n12
  cau: "p, piano: nhỏ."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n13
  cau: "mp, mezzo piano: hơi nhỏ."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n14
  cau: "mf, mezzo forte: hơi to."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n15
  cau: "f, forte: to."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n16
  cau: "ff, fortissimo: rất to."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n17
  cau: "cresc. hoặc dấu < (crescendo): to dần."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n18
  cau: "dim., decresc. hoặc dấu > (diminuendo): nhỏ dần."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n19
  cau: "sfz (sforzando): nhấn mạnh đột ngột một nốt."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n20
  cau: "fp (forte-piano): to rồi nhỏ ngay."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n21
  cau: Cây đàn piano có tên đầy đủ là pianoforte, nghĩa là "nhỏ – to".
  loai: ten
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n22
  cau: Khác harpsichord, piano chơi to hay nhỏ theo lực ngón.
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n23
  cau: Clavichord cũng chơi to nhỏ theo lực ngón, nhưng rất nhỏ tiếng.
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n25
  cau: "Staccato: chấm trên hoặc dưới nốt, ngắt ngắn."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n26
  cau: "Legato (dấu luyến): đường cong nối các nốt, chơi liền mạch."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n27
  cau: "Accent (>): nhấn."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n28
  cau: "Tenuto (gạch ngang ngắn): giữ đủ độ dài, hơi nhấn."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n29
  cau: "Fermata (vòng cung có chấm): ngân dài tùy ý."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n30
  cau: "dolce: ngọt ngào."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n31
  cau: "cantabile: như hát."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n32
  cau: "espressivo: diễn cảm."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n33
  cau: "con brio: sôi nổi."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n34
  cau: "maestoso: trang trọng."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n35
  cau: "agitato: kích động."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n36
  cau: "grazioso: duyên dáng."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n37
  cau: "sostenuto: ngân giữ."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n38
  cau: "sotto voce: khẽ khàng."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n39
  cau: "Dấu nhắc lại (vạch kép có hai chấm, ở đầu và cuối đoạn): nhắc lại đoạn giữa hai dấu."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n40
  cau: "Ngoặc 1., 2. (prima/seconda volta): lần 1 chơi ngoặc 1, lần nhắc lại bỏ qua ngoặc 1, chơi ngoặc 2."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n41
  cau: "D.C. (Da Capo): quay lại từ đầu."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n42
  cau: "D.S. (Dal Segno): quay lại từ dấu Segno."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n43
  cau: Dấu Segno có hình chữ S có gạch chéo và hai chấm.
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n44
  cau: "Fine: kết thúc ở đây (sau khi quay lại)."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n45
  cau: "al Coda và dấu Coda (vòng tròn có dấu cộng): nhảy tới phần Coda."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n46
  cau: "tr: láy rền (trill), đổi nhanh liên tục giữa nốt chính và nốt trên."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n47
  cau: "Răng cưa ngắn, không gạch: láy trên (pralltriller), nốt chính – nốt trên – nốt chính, rất nhanh."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n48
  cau: "Răng cưa ngắn có gạch dọc: láy dưới (mordent), nốt chính – nốt dưới – nốt chính, rất nhanh."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n49
  cau: "Hình chữ S nằm ngang: láy quanh (turn), nốt trên – nốt chính – nốt dưới – nốt chính."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n50
  cau: "Nốt nhỏ có gạch chéo: acciaccatura, nốt luyến cực nhanh ngay trước nốt chính."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n51
  cau: "Nốt nhỏ không gạch: appoggiatura, nốt dựa, chiếm một phần độ dài nốt chính."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n52
  cau: "8va: chơi cao hơn một quãng tám so với nốt viết; 8vb: thấp hơn một quãng tám."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n53
  cau: "Ped. và dấu *: nhấn và nhả bàn đạp vang của piano."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n54
  cau: "pizz. (pizzicato): đàn dây gảy bằng ngón tay; arco: trở lại kéo vĩ."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n56
  cau: 'Hộp "Trên phím đàn": Ped. và * (nhấn và nhả bàn đạp vang), una corda / tre corde (bàn đạp trái), m.d. / m.s. (tay phải / tay trái): vài ký hiệu hay gặp trên bản nhạc piano.'
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n58
  cau: "Câu hỏi 1: Ký hiệu mf nghĩa là gì? Đáp án: hơi to (mezzo forte)."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n59
  cau: 'Câu hỏi 2: "a tempo" nghĩa là gì? Đáp án: trở lại tốc độ ban đầu; giải thích: thường xuất hiện sau rit. hoặc rall.'
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n60
  cau: "Câu hỏi 3: Chấm nhỏ trên nốt nhạc nghĩa là staccato, ngắt ngắn; chấm dôi nằm bên phải nốt, staccato nằm trên hoặc dưới đầu nốt."
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n61
  cau: 'Câu hỏi 4: D.C. al Fine nghĩa là quay lại từ đầu và dừng ở chữ Fine; Da Capo: "từ đầu".'
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n62
  cau: "Câu hỏi 5: Pizzicato là kỹ thuật của đàn dây như violin, cello (gảy dây bằng ngón tay thay vì kéo vĩ)."
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n2
  cau: Thông thường một phách chia đôi (hai móc đơn) hoặc chia bốn (bốn móc kép).
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n3
  cau: Liên ba (triplet) chia một phách thành ba phần bằng nhau; viết bằng ba nốt có số 3 bên trên.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n5
  cau: Liên ba có thể chia hai phách thành ba nốt đen (liên ba nốt đen).
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n6
  cau: Liên ba rất hay gặp trong nhạc Lãng mạn; Chopin và Brahms thường chồng liên ba ở một tay lên nhịp chia đôi ở tay kia ("ba chọi hai").
  loai: lich-su
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n7
  cau: "Nhiều giai điệu không bắt đầu ở phách mạnh mà bắt đầu bằng một vài nốt trước vạch nhịp đầu tiên: nhịp lấy đà (anacrusis, upbeat)."
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n8
  cau: Ô nhịp đầu khi đó không đủ phách; ô nhịp cuối thường bù lại phần thiếu.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n9
  cau: 'Đảo phách (syncopation) là đặt trọng âm vào chỗ "đáng lẽ yếu": giữa phách, hoặc phách nhẹ, thường bằng một nốt dài bắt đầu lệch khỏi phách mạnh.'
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n11
  cau: Đảo phách đã có từ thời Ars Nova và được nhạc jazz phát triển rộng rãi.
  loai: lich-su
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n12
  cau: Trong nhịp đơn (2/4, 3/4, 4/4), mỗi phách chia đôi. Trong nhịp kép, mỗi phách là nốt đen chấm dôi và chia ba.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n13
  cau: 6/8 có 2 phách lớn, mỗi phách 3 móc đơn.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n14
  cau: 9/8 có 3 phách lớn, mỗi phách 3 móc đơn.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n15
  cau: 12/8 có 4 phách lớn, mỗi phách 3 móc đơn.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n16
  cau: "Hemiola là khi hai ô nhịp 3/4 được nhấn như ba nhóm 2 phách (nghe như một ô 3/2): MẠNH-nhẹ MẠNH-nhẹ MẠNH-nhẹ thay vì MẠNH-nhẹ-nhẹ MẠNH-nhẹ-nhẹ."
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n17
  cau: Hemiola thường xuất hiện ở các kết quan trọng của nhạc nhịp ba, chẳng hạn trong Water Music, Tổ khúc số 2, chương II của Handel.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n18
  cau: Hemiola tạo cảm giác "phanh lại"; được dùng trong các minuet, courante, aria của Handel; rồi được Brahms dùng như dấu ấn riêng.
  loai: lich-su
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n20
  cau: Có những bản dùng số chỉ nhịp không đều như 5/4 hay 7/8.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n21
  cau: Từ thế kỷ 20, nhịp 5/4 hay 7/8 xuất hiện thường xuyên hơn.
  loai: lich-su
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n22
  cau: Stravinsky trong Le Sacre du printemps đổi nhịp gần như mỗi ô.
  loai: lich-su
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n23
  cau: 7/8 thường được nhóm thành 2+2+3 hoặc 3+2+2.
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n24
  cau: "Holst The Planets: Mars dùng 5/4."
  loai: lich-su
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n25
  cau: Tchaikovsky viết một chương valse 5/4 trong Giao hưởng số 6.
  loai: lich-su
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n30
  cau: Một ô nhịp 9/8 có 18 móc kép (9 móc đơn = 18 móc kép).
  loai: so-lieu
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n31
  cau: "Quiz 1: liên ba móc đơn chia một phách nốt đen thành 3 phần (giải thích: ba nốt bằng nhau trong thời gian của hai móc đơn)."
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n32
  cau: "Quiz 2: nhịp lấy đà là những nốt đứng trước vạch nhịp đầu tiên (giải thích: giai điệu bắt đầu ở phách yếu)."
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n33
  cau: "Quiz 3: nhịp 12/8 có 4 phách lớn (giải thích: mỗi phách là nốt đen chấm dôi)."
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n34
  cau: "Quiz 4: đảo phách là đặt trọng âm vào chỗ đáng lẽ yếu (giải thích: thường dùng nốt dài bắt đầu lệch khỏi phách mạnh)."
  loai: dinh-nghia
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n28
  cau: "Bài tập 1: viết một ô 4/4 gồm một liên ba móc đơn, hai móc kép + một móc đơn, một nốt đen, một dấu lặng đen."
  loai: khuyen-tap
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n29
  cau: "Bài tập 2: chọn một giai điệu quen thuộc bắt đầu bằng nhịp lấy đà và viết lại đoạn đầu cho đúng chỗ vạch nhịp."
  loai: khuyen-tap
- trang: nhac-ly/15-tiet-tau-nang-cao
  id: n27
  cau: Vỗ tay ba ví dụ đầu bài này với máy đếm nhịp ở 60 BPM, rồi tăng dần.
  loai: khuyen-tap
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n1
  cau: Gam trưởng và gam thứ là hai thang âm bạn đã học. Nhưng trong âm nhạc phương Tây cổ hơn, và trong rất nhiều nền âm nhạc khác, kể cả âm nhạc Việt Nam, người ta dùng những thang âm khác.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n2
  cau: Lấy các phím trắng của piano, nhưng bắt đầu từ những nốt khác nhau, ta được 7 điệu thức (mode).
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n3
  cau: Tên các điệu thức mượn từ Hy Lạp cổ (nhưng không giống hệ thống Hy Lạp thật).
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n4
  cau: "Đô – Ionian: chính là gam trưởng; quãng ba trên chủ âm trưởng."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n5
  cau: "Rê – Dorian: gam thứ nhưng bậc 6 nâng; quãng ba trên chủ âm thứ."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n6
  cau: "Mi – Phrygian: thứ, bậc 2 hạ; quãng ba thứ."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n7
  cau: "Fa – Lydian: trưởng, bậc 4 nâng; quãng ba trưởng."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n8
  cau: "Sol – Mixolydian: trưởng, bậc 7 hạ; quãng ba trưởng."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n9
  cau: "La – Aeolian: chính là gam thứ tự nhiên; quãng ba thứ."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n10
  cau: "Si – Locrian: thứ, bậc 2 và 5 hạ; quãng ba thứ."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n11
  cau: Cột "Quãng ba trên chủ âm" (Trưởng/Thứ) thay cho cột "Màu sắc" (Sáng, ...).
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n13
  cau: "Muốn có điệu thức trên nốt gốc khác, chỉ cần áp công thức khoảng cách của nó. Ví dụ Dorian từ La: La – Si – Đô – Rê – Mi – Fa♯ – Sol – La."
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n14
  cau: Thánh ca Gregorian dùng các điệu thức này, nên chúng còn được gọi là điệu thức Gregorian (hay điệu thức nhà thờ).
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n15
  cau: Nhạc Phục hưng; Debussy và Ravel dùng điệu thức để tạo màu sắc cổ xưa hoặc kỳ ảo; dân ca Celtic, Bartók, Vaughan Williams có điệu thức.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n17
  cau: Gam ngũ cung (pentatonic) chỉ có 5 nốt.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n18
  cau: Dạng quen thuộc nhất bỏ hai nốt tạo nửa cung (bậc 4 và 7) khỏi gam trưởng.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n19
  cau: "Ngũ cung trưởng: Đô – Rê – Mi – Sol – La; toàn bộ là cung và quãng 3 thứ, không có nửa cung nào."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n20
  cau: Giữa hai nốt bất kỳ của ngũ cung trưởng không có quãng 2 thứ hay tritone.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n21
  cau: "Thử chơi chỉ trên 5 phím đen của piano: đó là một gam ngũ cung."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n22
  cau: "Ngũ cung thứ: La – Đô – Rê – Mi – Sol. Cùng 5 nốt, bắt đầu từ La."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n24
  cau: "Ngũ cung có mặt trong âm nhạc của nhiều nơi: Đông Á và Đông Nam Á (như thang slendro của gamelan Java), nhiều dân ca châu Âu."
  loai: danh-muc
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n25
  cau: Debussy dùng gam ngũ cung trong Pagodes (tập Estampes), nơi tiếng gamelan Java được gợi lại; ông từng nghe gamelan ở Triển lãm Paris năm 1889.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n26
  cau: Dvořák dùng gam ngũ cung.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n27
  cau: Nhạc truyền thống Việt Nam xây trên các thang năm âm, gọi tên theo hệ thống Hò – Xự – Xang – Xê – Cống.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n28
  cau: Khi ghi lên khuông nhạc phương Tây, năm âm này được đối chiếu với Đô – Rê – Fa – Sol – La.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n29
  cau: Cùng nguồn gốc với ký âm công xích của Trung Quốc; đối chiếu với Sol – La – Đô – Rê – Mi.
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n30
  cau: Đô – Rê – Fa – Sol – La chính là gam ngũ cung trưởng từ Fa, viết bắt đầu từ bậc 5 (Đô); khoảng cách cung – quãng 3 thứ – cung – cung.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n31
  cau: 'Cao độ không cố định tuyệt đối: một nghiên cứu nói độ cao các âm trong thang này "không được xác định"; trên đàn tranh tay trái ấn dây làm đổi cao độ.'
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n32
  cau: "Luyến láy góp phần tạo nên điệu: trên đàn tranh nhấn dây để uốn cao độ là lối trang trí quan trọng; hơi Bắc diễn tả niềm vui, hơi Ai và hơi Oán diễn tả nỗi buồn."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n33
  cau: Khuông nhạc phương Tây không ghi hết cách nhấn nhá và uốn cao độ.
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n34
  cau: Nhạc tài tử Nam Bộ và ca trù đều là Di sản văn hóa phi vật thể được UNESCO công nhận (Ca trù 2009; Đờn ca tài tử Nam Bộ 2013).
  loai: lich-su
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n38
  cau: "Bài tập 1: viết điệu Dorian bắt đầu từ Mi (gợi ý công thức C N C C C N C). Đáp án: Mi – Fa♯ – Sol – La – Si – Đô♯ – Rê – Mi."
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n39
  cau: "Bài tập 2: viết điệu Mixolydian từ Rê; khác Rê trưởng ở bậc 7: Đô thay vì Đô♯. Đáp án: Rê – Mi – Fa♯ – Sol – La – Si – Đô – Rê."
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n40
  cau: "Bài tập 3: ngũ cung trưởng từ Sol: Sol – La – Si – Rê – Mi; từ Fa: Fa – Sol – La – Đô – Rê."
  loai: quy-tac
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n41
  cau: "Quiz 1: Dorian khác gam thứ tự nhiên ở bậc 6 được nâng (ví dụ Rê Dorian có Si tự nhiên thay vì Si♭)."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n42
  cau: "Quiz 2: điệu thức chính là gam trưởng là Ionian (bắt đầu từ Đô trên phím trắng)."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n43
  cau: "Quiz 3: ngũ cung trưởng từ Đô gồm Đô – Rê – Mi – Sol – La (bỏ bậc 4 và 7 của gam trưởng)."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n44
  cau: "Quiz 4: giữa hai nốt bất kỳ của ngũ cung trưởng không bao giờ có quãng 2 thứ (nửa cung) và tritone; có quãng 3 thứ (Mi – Sol) và quãng 5 đúng (Rê – La)."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n45
  cau: "Quiz 5: năm âm Hò – Xự – Xang – Xê – Cống có cấu trúc khoảng cách giống ngũ cung trưởng (cung – quãng 3 thứ – cung – cung, bắt đầu từ một bậc khác)."
  loai: dinh-nghia
- trang: nhac-ly/16-dieu-thuc-ngu-cung
  id: n12
  cau: "Mẹo: so mỗi điệu thức với gam trưởng hoặc thứ gần nhất để thấy bậc nào khác, rồi tìm bậc đó khi nghe."
  loai: khuyen-tap
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n1
  cau: "Ngoài khóa Sol và khóa Fa, còn một khóa thứ ba: khóa Đô."
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n2
  cau: Hình của khóa Đô vẽ cách điệu từ chữ C.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n3
  cau: Điểm giữa của khóa Đô chỉ vào dòng nào thì dòng đó là Đô giữa (C4).
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n4
  cau: Khóa Đô có thể đặt ở nhiều dòng, nhưng hai vị trí còn dùng ngày nay là alto và tenor.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n5
  cau: Khóa Đô alto đặt Đô giữa ở dòng 3 (dòng giữa của khuông).
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n6
  cau: Khóa Đô alto dùng cho viola.
  loai: ten
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n7
  cau: Khóa Đô tenor đặt Đô giữa ở dòng 4 (dòng thứ hai kể từ trên xuống).
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n8
  cau: Khóa Đô tenor dùng cho âm vực cao của cello, bassoon và trombone.
  loai: ten
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n9
  cau: Các nốt Đô3 – Đô4 – Sol4 viết ở khóa Sol, khóa Đô alto và khóa Fa là cùng ba cao độ.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n10
  cau: Khóa Đô alto giúp nốt của viola nằm gọn trong khuông, ít dòng kẻ phụ.
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n11
  cau: Âm vực viola nằm giữa violin và cello.
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n12
  cau: "Các nốt trên dòng của khóa alto, từ dưới lên: Fa – La – Đô – Mi – Sol (F3 A3 C4 E4 G4)."
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n13
  cau: "Các nốt trên dòng của khóa tenor, từ dưới lên: Rê – Fa – La – Đô – Mi (D3 F3 A3 C4 E4)."
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n16
  cau: Dịch giọng (transposition) là chuyển toàn bộ bản nhạc lên hoặc xuống một quãng cố định, giữ nguyên giai điệu.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n17
  cau: "Bước 1 của dịch giọng: chọn quãng dịch, ví dụ lên 2 trưởng (Đô → Rê)."
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n18
  cau: "Bước 2: đổi hóa biểu sang giọng mới (Đô trưởng → Rê trưởng: thêm Fa♯, Đô♯)."
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n19
  cau: "Bước 3: dịch mọi nốt lên cùng số bậc (Đô → Rê, Mi → Fa♯ theo hóa biểu, Sol → La…)."
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n20
  cau: "Bước 4: kiểm tra lại dấu hóa bất thường: một dấu thăng có thể thành dấu bình hoặc thăng kép tùy giọng mới."
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n21
  cau: Ca sĩ thường dịch giọng để vừa âm vực.
  loai: lich-su
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n23
  cau: Một số nhạc cụ được viết bản nhạc ở cao độ khác với âm thanh thật vang lên.
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n24
  cau: Lý do chủ yếu là lịch sử (kèn horn, kèn trumpet thời chưa có van chỉ chơi được các nốt của một âm gốc, nên phải đổi ống nối để đổi âm gốc) và để người chơi dùng cùng một thế bấm khi đổi giữa các loại nhạc cụ trong cùng họ.
  loai: lich-su
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n25
  cau: "Clarinet in B♭ và trumpet in B♭: viết nốt Đô thì vang lên Si♭, thấp hơn quãng 2 trưởng."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n26
  cau: Cột "Ghi chú" của hàng clarinet và trumpet in B♭ (chữ cũ "Phổ biến nhất") để trống.
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n27
  cau: "Clarinet in A: viết Đô thì vang lên La, thấp hơn quãng 3 thứ."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n28
  cau: Clarinet in A hay dùng ở giọng có nhiều dấu thăng.
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n29
  cau: "Kèn horn in F: viết Đô thì vang lên Fa, thấp hơn quãng 5 đúng."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n30
  cau: "Saxophone alto in E♭: viết Đô thì vang lên Mi♭, thấp hơn quãng 6 trưởng."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n31
  cau: "Guitar và contrabass: vang lên thấp hơn nốt viết một quãng tám, để tránh quá nhiều dòng kẻ phụ dưới khuông."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n32
  cau: Piccolo vang lên cao hơn nốt viết một quãng tám.
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n33
  cau: Khi đọc tổng phổ, bè clarinet in B♭ có hóa biểu khác các bè còn lại; đó không phải lỗi in mà là nhạc cụ dịch giọng.
  loai: quy-tac
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n35
  cau: Câu "Một số tổng phổ hiện đại in ở cao độ thật (concert pitch) để dễ đọc."
  loai: lich-su
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n36
  cau: Giai điệu Ode to Joy bắt đầu Mi Mi Fa Sol ở Đô trưởng.
  loai: cau-truc
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n37
  cau: "Đáp án bài tập 1: Fa trưởng La La Si♭ Đô; Si♭ trưởng Rê Rê Mi♭ Fa."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n38
  cau: "Đáp án bài tập 2: clarinet in B♭ đọc nốt Rê, âm thanh thật là Đô (thấp hơn Rê một quãng 2 trưởng)."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n39
  cau: "Đáp án bài tập 3: muốn clarinet in B♭ phát ra Đô thật, phải viết nốt Rê (cao hơn 2 trưởng)."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n40
  cau: 'Câu hỏi: khóa Đô alto đặt Đô giữa ở dòng 3; lời giải thích "dòng giữa của khuông".'
  loai: dinh-nghia
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n41
  cau: 'Câu hỏi: nhạc cụ đọc khóa Đô alto là viola; giải thích "có âm vực giữa violin và cello".'
  loai: ten
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n42
  cau: "Câu hỏi: clarinet in B♭ viết Đô thì âm thanh thật là Si♭ thấp hơn, thấp hơn một quãng 2 trưởng."
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n43
  cau: 'Câu hỏi: dịch giọng từ Đô trưởng lên Rê trưởng cần thêm Fa♯ và Đô♯; giải thích "Rê trưởng có 2 dấu thăng".'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n44
  cau: 'Câu hỏi: guitar được viết cao hơn âm thanh thật một quãng tám; giải thích "âm thanh thật thấp hơn nốt viết một quãng tám".'
  loai: so-lieu
- trang: nhac-ly/17-khoa-do-dich-giong
  id: n22
  cau: Người đệm đàn phải đọc và dịch ngay khi chơi.
  loai: khuyen-tap
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n2
  cau: Các nốt không thuộc hợp âm đang vang được gọi là âm ngoài hợp âm (non-chord tones).
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n3
  cau: Nốt lướt (passing tone) đến bằng bước liền và rời bằng bước liền cùng hướng.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n4
  cau: Nốt thêu (neighbor tone) đến bằng bước liền và rời bằng bước liền quay lại.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n5
  cau: Nốt treo (suspension) giữ nguyên từ hợp âm trước và rời bằng bước liền xuống.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n6
  cau: Nốt dựa (appoggiatura) đến bằng nhảy, ở phách mạnh, rời bằng bước liền.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n7
  cau: "Nốt đón trước (anticipation): nốt của hợp âm sau vang lên sớm và giữ nguyên sang hợp âm sau; cách đến không có quy định."
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n8
  cau: Âm nền (pedal point) là một nốt giữ dài ở bè trầm trong khi hợp âm bên trên thay đổi.
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n9
  cau: "Ví dụ trên hợp âm Đô: Đô – Rê – Mi (Rê lướt), Mi – Fa – Mi (Fa thêu), Fa giữ từ hợp âm F xuống Mi (nốt treo), Rê nhảy tới rồi xuống Đô (nốt dựa), Sol giữ ở bè trầm qua nhiều hợp âm (âm nền)."
  loai: so-lieu
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n10
  cau: Trong khối nốt lướt, Rê và Fa không thuộc hợp âm Đô (Đô – Mi – Sol), chúng nối các nốt hợp âm theo một hướng đi lên.
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n11
  cau: Nốt treo 4–3 rất phổ biến.
  loai: quy-tac
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n12
  cau: Nốt Fa của hợp âm G7 được giữ lại khi bè trầm đã chuyển sang Đô, tạo nghịch tai, rồi rơi xuống Mi (treo 4–3).
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n13
  cau: "Nốt dựa: giai điệu nhảy tới một nốt ngoài hợp âm ở phách mạnh, rồi bước về nốt hợp âm, giống một tiếng thở dài."
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n14
  cau: Câu "Đây là chữ ký của âm nhạc thời Cổ điển và Lãng mạn" (nói về nốt dựa).
  loai: lich-su
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n15
  cau: Ở khối nốt dựa, Rê không thuộc hợp âm Đô trưởng; nó rơi vào phách 1 của ô thứ hai bằng một bước nhảy từ Sol, rồi bước xuống Đô ngay sau đó.
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n16
  cau: "Nốt đón trước: một nốt của hợp âm sắp tới vang lên sớm, rồi giữ nguyên khi hợp âm mới đến."
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n17
  cau: Ở khối nốt đón trước, nốt Đô xuất hiện từ giữa ô đầu khi hòa âm vẫn là Sol7 (lúc đó nó là âm ngoài hợp âm), rồi ngân dài thành nốt chủ âm khi hợp âm Đô trưởng đến.
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n18
  cau: "Bạn đã nghe âm nền ở Bach, Prelude cung Đô trưởng: nốt Sol giữ ở bè trầm qua nhiều ô nhịp gần cuối."
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n20
  cau: "Nốt treo và nốt dựa rơi vào phách mạnh: ở đó chúng nghe nghịch tai với hợp âm, rồi giải quyết bằng một bước liền."
  loai: quy-tac
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n22
  cau: "Bài tập 1, ví dụ đáp án: Sol – La – Si – Đô – Si (La là nốt lướt, Đô là nốt thêu) trên hợp âm Sol trưởng."
  loai: cau-truc
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n23
  cau: "Bài tập 2 (Mi – Fa – Mi trên hợp âm Đô): Fa là nốt thêu."
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n24
  cau: "Bài tập 3 (Đô – Rê – Mi trên hợp âm Đô): Rê là nốt lướt."
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n25
  cau: 'Câu hỏi: nốt lướt được rời bằng bước liền, cùng hướng với lúc đến; giải thích "nó lướt giữa hai nốt hợp âm".'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n26
  cau: 'Câu hỏi: nốt treo được chuẩn bị bằng cách giữ nguyên từ hợp âm trước; giải thích "sau đó giải quyết bằng bước liền xuống".'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n27
  cau: 'Câu hỏi: âm nền (pedal point) là một nốt giữ dài trong khi hợp âm thay đổi; giải thích "thường ở bè trầm: âm nền át, âm nền chủ".'
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n28
  cau: "Câu hỏi: nốt nhảy tới ở phách mạnh rồi bước về nốt hợp âm là nốt dựa; giải thích \"appoggiatura, từ tiếng Ý 'dựa vào'\"."
  loai: dinh-nghia
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n21
  cau: Khi bạn nghe một hòa âm "nhói lên" rồi tan ra, rất có thể đó là một nốt treo hay nốt dựa.
  loai: khuyen-tap
- trang: nhac-ly/18-am-ngoai-hop-am
  id: n1
  cau: Nếu giai điệu chỉ dùng các nốt thuộc hợp âm đang vang, nó sẽ cứng như bài tập rải hợp âm. Các nốt không thuộc hợp âm làm giai điệu mềm mại, tạo căng thẳng rồi giải tỏa.
  loai: khuyen-tap
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n1
  cau: Hợp âm V kéo mạnh về I.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n3
  cau: Mọi hợp âm ba trưởng hay thứ trong giọng đều có thể có một "hợp âm V của riêng nó".
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n4
  cau: Hợp âm V của Sol trưởng là Rê trưởng (D).
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n5
  cau: Hợp âm D chứa Fa♯, nốt không có trong Đô trưởng.
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n6
  cau: Fa♯ đóng vai cảm âm tạm thời kéo lên Sol.
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n7
  cau: Hợp âm D (hay D7) là át phụ của V; ký hiệu V/V, đọc "năm của năm".
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n8
  cau: "Có thể có V/ii, V/iii, V/IV, V/vi: hợp âm át của bất kỳ hợp âm trưởng hoặc thứ nào trong giọng."
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n9
  cau: 'Bảng: V/V trong Đô trưởng là D hoặc D7, dẫn đến G, nốt "lạ" là Fa♯.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n10
  cau: 'Bảng: V/vi trong Đô trưởng là E hoặc E7, dẫn đến Am, nốt "lạ" là Sol♯.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n11
  cau: 'Bảng: V/ii trong Đô trưởng là A hoặc A7, dẫn đến Dm, nốt "lạ" là Đô♯.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n12
  cau: 'Bảng: V/IV trong Đô trưởng là C7, dẫn đến F, nốt "lạ" là Si♭.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n13
  cau: "Ngoài hợp âm V, hợp âm vii° (hoặc vii°7) cũng có thể làm át phụ: hợp âm cảm âm phụ."
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n14
  cau: vii°/V trong Đô trưởng là Fa♯ – La – Đô (hoặc Fa♯ – La – Đô – Mi♭, hợp âm bảy giảm), dẫn về G vì Fa♯ là cảm âm của Sol.
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n15
  cau: "Mẹo: một dấu hóa bất thường xuất hiện rồi biến mất ngay, đặc biệt là một nốt thăng đi lên nửa cung, rất có thể là cảm âm của một át phụ."
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n16
  cau: 'Át phụ làm hợp âm đích được "chủ âm hóa" tạm thời (tonicization): trong một khoảnh khắc G nghe như chủ âm, rồi nhạc vẫn ở Đô trưởng.'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n17
  cau: Khi giọng mới được khẳng định đủ lâu, thường bằng một kết ở giọng mới, ta nói bản nhạc đã chuyển giọng (modulation).
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n18
  cau: Giọng gần là các giọng chỉ khác 0–1 dấu hóa; chuyển qua lại rất tự nhiên.
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n19
  cau: Với Đô trưởng, các giọng gần là Sol trưởng (giọng át), Fa trưởng (giọng hạ át), La thứ (song song), Mi thứ, Rê thứ.
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n20
  cau: Trên vòng quãng năm, các giọng gần là hàng xóm của nhau.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n22
  cau: 'Một cách thường dùng, mượt hơn đổi giọng đột ngột: tìm một hợp âm thuộc cả hai giọng làm "bản lề" (pivot chord).'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n23
  cau: "Ví dụ Đô trưởng → Sol trưởng: hợp âm Am là vi của Đô trưởng và cũng là ii của Sol trưởng."
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n24
  cau: "Bảng: C, F, Am, D, G là I, IV, vi trong Đô trưởng, rồi Am, D, G là ii, V, I trong Sol trưởng."
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n25
  cau: Đôi khi nhạc đổi giọng đột ngột, không cần bản lề, thường ở chỗ bắt đầu câu mới.
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n26
  cau: 'Ví dụ nổi tiếng: nhiều bài hát pop "nâng tông" lên nửa cung ở điệp khúc cuối.'
  loai: lich-su
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n27
  cau: Đầu phần phát triển của Mozart Giao hưởng số 40 (chương 1) chuyển đột ngột sang Fa♯ thứ, một giọng xa giọng chính (Sol thứ).
  loai: cau-truc
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n28
  cau: 'Hình "Bản đồ giọng gần": Fa trưởng 1♭, Đô trưởng (giọng chính), Sol trưởng 1♯ ở hàng trên; Rê thứ 1♭, La thứ (không dấu), Mi thứ 1♯ ở hàng dưới.'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n29
  cau: 'Chữ dưới hình: "Hàng trên: trưởng · hàng dưới: thứ song song · mỗi giọng khác giọng chính nhiều nhất 1 dấu hóa".'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n30
  cau: 'Mô tả hình (aria-label): "Năm giọng gần của Đô trưởng: Sol trưởng và Fa trưởng (cạnh nhau trên vòng quãng năm) cùng ba giọng thứ song song La thứ, Mi thứ, Rê thứ".'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n31
  cau: 'Chú thích hình: "Chuyển giữa các giọng gần nghe tự nhiên vì chỉ đổi một dấu hóa."'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n32
  cau: "Chú thích hình: giọng xa (ví dụ Fa♯ trưởng, 6 thăng) khác Đô trưởng tới 6 dấu hóa."
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n33
  cau: Trong hình thức sonata, phần trình bày chuyển sang giọng át (hoặc giọng trưởng song song nếu ở giọng thứ) cho chủ đề 2, tạo xung đột giữa hai giọng.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n34
  cau: Phần tái hiện đưa chủ đề 2 về giọng chính, giải quyết xung đột đó.
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n35
  cau: "Bài tập 1, đáp án: trong Sol trưởng, V/V là A (La – Đô♯ – Mi), nốt lạ là Đô♯, cảm âm tạm thời của Rê."
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n36
  cau: "Bài tập 2, đáp án: hợp âm chung của Đô trưởng và Fa trưởng, ví dụ Dm (ii của Đô, vi của Fa), C (I của Đô, V của Fa), F (IV của Đô, I của Fa)."
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n37
  cau: "Bài tập 3 và đáp án: chủ đề 2 ở phần trình bày chương 1 Mozart Giao hưởng số 40 ở Si♭ trưởng, giọng trưởng song song của Sol thứ."
  loai: cau-truc
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n39
  cau: 'Câu hỏi: V/V trong Đô trưởng là D (Rê trưởng); giải thích "hợp âm át của G là D".'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n40
  cau: 'Câu hỏi: dấu hiệu thường gặp của át phụ trên bản nhạc là một dấu hóa bất thường xuất hiện rồi biến mất ngay; giải thích "thường là cảm âm tạm thời".'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n41
  cau: 'Câu hỏi: hợp âm Am thuộc cả Đô trưởng (vi) và Sol trưởng (ii); giải thích "đó là hợp âm chung để chuyển giọng".'
  loai: so-lieu
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n42
  cau: 'Câu hỏi: Sol trưởng là giọng gần của Đô trưởng; giải thích "chỉ khác một dấu hóa".'
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n1
  cau: Tổng phổ (full score) là bản nhạc ghi mọi bè của dàn nhạc, xếp chồng lên nhau, để nhạc trưởng nhìn thấy toàn bộ.
  loai: dinh-nghia
- trang: nhac-ly/20-doc-tong-pho
  id: n2
  cau: "Thứ tự các bè từ trên xuống: bộ gỗ, bộ đồng, bộ gõ (timpani và gõ khác), đàn hạc/piano/celesta, độc tấu và hợp xướng, bộ dây ở dưới cùng."
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n3
  cau: Trong mỗi bộ, các bè thường xếp từ cao xuống thấp.
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n4
  cau: "Bảng: bộ gỗ gồm Sáo (Fl., Picc.), Oboe (Ob.), Clarinet (Cl., Kl.), Bassoon (Fg., Bsn.)."
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n5
  cau: "Bảng: bộ đồng gồm Horn (Hn., Cor.), Trumpet (Tpt., Tr.), Trombone (Tbn., Pos.), Tuba."
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n6
  cau: "Bảng: timpani viết tắt Timp., Pk. (Pauken trong tiếng Đức); đàn hạc Hp.; piano Pno."
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n7
  cau: "Bảng: bộ dây gồm Violin I, Violin II (Vn., Vln.), Viola (Vla., Br.), Cello (Vc.), Contrabass (Cb., Kb.)."
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n8
  cau: Viết tắt có thể bằng tiếng Ý, Đức hoặc Pháp tùy nhà xuất bản; Pauken là timpani trong tiếng Đức, Bratsche là viola.
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n9
  cau: Bè viola dùng khóa Đô alto; clarinet, horn, trumpet có thể là nhạc cụ dịch giọng, nên hóa biểu khác các bè khác.
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n11
  cau: "Thứ tự trên sân khấu, từ trước ra sau: bộ dây, bộ gỗ, bộ đồng, bộ gõ; trong tổng phổ gỗ ở trên cùng, dây ở dưới cùng."
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n12
  cau: "Hình seating: dây (violin 1, violin 2, viola, cello, contrabass) ở phía trước gần nhạc trưởng, gỗ ở giữa, đồng phía sau, bộ gõ (timpani) sau cùng."
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n13
  cau: 'Chú thích hình: "Một cách xếp chỗ thường gặp; mỗi dàn nhạc có thể bố trí khác (ví dụ violin 2 ngồi bên phải)."'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n16
  cau: "Bảng cấp độ: 1 sonata piano (Mozart, Beethoven), chỉ 2 khuông."
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n17
  cau: "Bảng cấp độ: 2 tứ tấu đàn dây của Haydn, 4 khuông."
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n18
  cau: "Bảng cấp độ: 3 Haydn Giao hưởng số 94 chương 2, dàn nhạc nhỏ, giai điệu rõ."
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n19
  cau: "Bảng cấp độ: 4 Mozart Giao hưởng số 40, hình thức sonata rõ ràng."
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n20
  cau: "Bảng cấp độ: 5 Beethoven Giao hưởng số 5, dàn nhạc đầy đủ hơn, nhiều bè hoạt động."
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n22
  cau: IMSLP có tổng phổ miễn phí của các tác phẩm thuộc phạm vi công cộng; tìm tên tác phẩm, chọn mục "Full Scores".
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n24
  cau: Tổng phổ khổ nhỏ (study score) của các nhà xuất bản như Bärenreiter, Henle, Eulenburg.
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n25
  cau: Khung 4 bè rút gọn (2 violin, viola, cello) của vòng hợp âm Canon (bài 12); bè viola khóa Đô alto.
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n28
  cau: "Bài tập 3: tìm chỗ kèn horn giới thiệu chủ đề 2 trong chương 1 Giao hưởng số 5 của Beethoven."
  loai: cau-truc
- trang: nhac-ly/20-doc-tong-pho
  id: n29
  cau: "Câu hỏi: bộ gỗ nằm trên cùng của tổng phổ."
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n31
  cau: 'Câu hỏi: hóa biểu của clarinet khác vì là nhạc cụ dịch giọng; giải thích "Âm thanh thật vẫn cùng giọng với cả dàn nhạc".'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n32
  cau: 'Câu hỏi: bè viola thường dùng khóa Đô alto; giải thích "Đô giữa ở dòng 3".'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n14
  cau: "Cách theo dõi: bám vào bè violin I (dòng đầu của bộ dây), phần lớn thời gian giai điệu chính ở đây."
  loai: khuyen-tap
- trang: nhac-ly/20-doc-tong-pho
  id: n23
  cau: 'Video "score" trên các trang chia sẻ video: tìm tên tác phẩm kèm chữ score; tổng phổ chạy theo âm thanh.'
  loai: khuyen-tap
- trang: nhac-ly/20-doc-tong-pho
  id: n27
  cau: "Bài tập 1: mở tổng phổ Giao hưởng số 5 của Beethoven trên IMSLP; trang đầu có những nhạc cụ nào?"
  loai: khuyen-tap
- trang: nhac-ly/21-hoa-am-bon-be
  id: n2
  cau: Bach viết hàng trăm bài thánh ca (chorale) bốn bè.
  loai: lich-su
- trang: nhac-ly/21-hoa-am-bon-be
  id: n3
  cau: Viết bốn bè là bài tập nền tảng của mọi khóa học sáng tác.
  loai: lich-su
- trang: nhac-ly/21-hoa-am-bon-be
  id: n4
  cau: Bốn bè của hợp âm là soprano (S, cao nhất), alto (A), tenor (T), bass (B, thấp nhất).
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n5
  cau: "Giọng hát của bốn bè: soprano nữ cao, alto nữ trầm, tenor nam cao, bass nam trầm."
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n6
  cau: "Âm vực thường dùng: soprano Đô4 – Sol5, alto Sol3 – Rê5, tenor Đô3 – Sol4."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n7
  cau: "Âm vực thường dùng của bass: Fa2 – Rê4."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n8
  cau: "Hình ranges-satb: thanh âm vực soprano Đô4–Sol5, alto Sol3–Rê5, tenor Đô3–Sol4, bass Fa2–Rê4; chú thích ghi đúng bốn âm vực ấy."
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n9
  cau: "Khuông của bốn bè: soprano và alto khóa Sol; tenor và bass khóa Fa; đuôi nốt soprano và tenor hướng lên, alto và bass hướng xuống."
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n10
  cau: Hợp âm ba có 3 nốt mà có 4 bè, nên phải nhân đôi một nốt.
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n11
  cau: Bè bass chơi nốt quyết định thể (thể gốc, thể đảo) của hợp âm.
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n12
  cau: Với hợp âm ba thể gốc, thường nhân đôi nốt gốc.
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n13
  cau: Không bao giờ nhân đôi cảm âm (bậc 7).
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n14
  cau: "Lý do không nhân đôi cảm âm: nó phải đi lên chủ âm, nhân đôi sẽ sinh quãng 8 song song."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n15
  cau: "Khoảng cách: soprano–alto và alto–tenor không quá một quãng 8; tenor–bass có thể xa hơn."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n16
  cau: Các bè không bắt chéo nhau (alto không cao hơn soprano, ...).
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n17
  cau: "Dẫn bè, quy tắc 1: giữ nốt chung giữa hai hợp âm ở cùng một bè, nếu có."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n18
  cau: "Dẫn bè, quy tắc 2: các bè trên đi bước liền hoặc bước nhảy nhỏ; bè bass được nhảy."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n19
  cau: "Dẫn bè, quy tắc 3: cấm quãng 5 và quãng 8 song song: hai bè đang cách nhau quãng 5 (hoặc 8) không được cùng chuyển sang một quãng 5 (hoặc 8) khác."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n20
  cau: Quãng 5 và 8 song song làm hai bè "dính" vào nhau, mất tính độc lập.
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n21
  cau: "Dẫn bè, quy tắc 4: cảm âm đi lên chủ âm; nốt 7 của hợp âm bảy đi xuống bước liền."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n22
  cau: Ưu tiên chuyển động ngược (một bè lên, bè kia xuống) giữa bè ngoài cùng (soprano và bass).
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n23
  cau: "Hình voice-leading (hình 1): bốn bè I – IV – V – I ở Đô trưởng: soprano Đô – Đô – Si – Đô, alto Mi – Fa – Rê – Mi, tenor Sol – La – Sol – Sol, bass Đô – Fa – Sol – Đô."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n24
  cau: "Hình voice-leading (hình 1): đường bass đi từ Đô xuống Fa (quãng 5), lên Sol (bước liền), rồi lên Đô."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n25
  cau: 'Chú thích hình 1: "Mỗi đường là một bè (S soprano, A alto, T tenor, B bass). Dẫn bè tốt: các đường đi gần, ít nhảy; nốt chung được giữ nguyên."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n26
  cau: "Hình voice-leading (hình 2): Đô – Sol – Mi – Đô (bass, tenor, alto, soprano) của hợp âm C chuyển song song sang Rê – La – Fa – Rê của hợp âm Dm; bass–tenor cách quãng 5 trước và sau, bass–soprano cách quãng 8 trước và sau."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n27
  cau: 'Chú thích hình 2: "Lỗi cần tránh (vạch đỏ): bass–tenor đi quãng 5 song song, bass–soprano đi quãng 8 song song. Cả bốn bè cùng đi lên cũng làm mất tính độc lập."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n28
  cau: "Khuông I – IV – V – I ở Đô trưởng: [Ec] [Fc] [DB] [Ec] (soprano, alto) và [C,G,] [F,,A,] [G,,G,] [C,G,] (tenor, bass), đúng dẫn bè."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n29
  cau: "Đọc từ dưới lên ở mỗi hợp âm: bass – tenor (khuông dưới), alto – soprano (khuông trên)."
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n30
  cau: "I → IV: soprano giữ Đô (nốt chung); alto và tenor đi lên bước liền, bass nhảy xuống quãng 5 tới Fa."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n31
  cau: "IV → V: bass đi lên bước liền (Fa → Sol), ba bè trên đi xuống ngược chiều; không có quãng song song cấm."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n32
  cau: "V → I: cảm âm Si đi lên Đô ở soprano; tenor giữ Sol (nốt chung)."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n33
  cau: 'Khuông "Sai: quãng 5 song song (Đô–Sol rồi Rê–La)": [C,G,] [D,A,] ở khuông khóa Fa.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n34
  cau: "Bài tập 1: viết I – V – I ở Sol trưởng cho bốn bè (bass: Sol – Rê – Sol)."
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n36
  cau: 'Bài tập 3: lấy một bài thánh ca của Bach trong IMSLP (tìm "371 Chorales"), chọn 4 ô nhịp và gọi tên từng hợp âm.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n37
  cau: 'Câu hỏi 1: với hợp âm ba thể gốc, nên nhân đôi nốt gốc; giải thích: "Nhân đôi nốt gốc cho âm thanh vững nhất."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n38
  cau: 'Câu hỏi 2: không nhân đôi cảm âm vì nó phải đi lên chủ âm, nhân đôi sẽ gây quãng 8 song song; giải thích: "Cả hai bè sẽ cùng đi lên chủ âm."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n39
  cau: 'Câu hỏi 3: khoảng cách giữa tenor và bass được phép lớn hơn một quãng 8; giải thích: "Các bè trên giữ gần nhau."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n40
  cau: "Câu hỏi 4: trong V7 → I, nốt 7 của hợp âm bảy đi xuống bước liền (Fa xuống Mi trong G7 → C)."
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n35
  cau: "Bài tập 2: viết I – vi – IV – V – I ở Đô trưởng; kiểm tra từng cặp bè xem có quãng 5 hoặc 8 song song không."
  loai: khuyen-tap
- trang: nhac-ly/22-doi-am
  id: n1
  cau: Đối âm (counterpoint) là nghệ thuật viết nhiều giai điệu độc lập cùng lúc mà vẫn hòa hợp.
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n2
  cau: Hòa âm bốn bè nghĩ theo chiều dọc (hợp âm); đối âm nghĩ theo chiều ngang (từng giai điệu).
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n3
  cau: Đối âm là ngôn ngữ của nhạc Phục hưng và của fugue.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n7
  cau: Năm 1725, nhà soạn nhạc Áo Johann Joseph Fux xuất bản Gradus ad Parnassum.
  loai: ten
- trang: nhac-ly/22-doi-am
  id: n8
  cau: Gradus ad Parnassum là giáo trình đối âm viết dưới dạng đối thoại thầy trò.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n9
  cau: Haydn, Mozart, Beethoven đều học từ Gradus ad Parnassum.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n10
  cau: Đến nay Gradus ad Parnassum vẫn được dùng.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n11
  cau: "Phương pháp của Fux: cho sẵn một giai điệu chậm, nốt tròn, gọi là cantus firmus (CF), rồi viết thêm một bè, tăng dần độ phức tạp qua năm loại (species)."
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n12
  cau: "Loại 1: một nốt chống một nốt; chỉ dùng quãng thuận; học chuyển động giữa hai bè."
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n13
  cau: "Loại 2: hai nốt chống một; nốt lướt nghịch tai ở phách yếu."
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n14
  cau: "Loại 3: bốn nốt chống một; giai điệu linh hoạt, nốt thêu, nốt lướt."
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n15
  cau: "Loại 4: nốt lệch phách, nối qua vạch nhịp; học nốt treo."
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n16
  cau: "Loại 5: tự do (florid), kết hợp tất cả; giai điệu như một bè thật."
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n17
  cau: "Quy tắc loại 1, điều 1: chỉ dùng quãng thuận 1, 3, 5, 6, 8 (trưởng, thứ hoặc đúng); quãng 4 tính là nghịch khi đứng trên bè dưới."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n18
  cau: "Quy tắc loại 1, điều 2: bắt đầu bằng quãng đúng (1, 5 hoặc 8; nếu bè đối âm nằm dưới thì chỉ 1 hoặc 8) và kết thúc bằng quãng 8 hoặc đồng âm."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n19
  cau: "Quy tắc loại 1, điều 3: cấm quãng 5 và 8 song song; tránh đi tới quãng đúng bằng chuyển động cùng chiều."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n20
  cau: "Quy tắc loại 1, điều 4: ưu tiên chuyển động ngược và quãng 3, quãng 6, nhưng không quá ba quãng 3 liên tiếp, hay ba quãng 6 liên tiếp."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n21
  cau: "Quy tắc loại 1, điều 5: giai điệu chủ yếu đi bước liền; bước nhảy lớn nên đổi hướng ngay sau đó."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n22
  cau: "Quy tắc loại 1, điều 6: gần cuối nâng cảm âm để tạo kết; ở điệu Dorian trên Rê, Đô thành Đô♯."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n23
  cau: "Cantus firmus của ví dụ là giai điệu ở điệu Dorian trên Rê mà Fux dùng trong sách: Rê Fa Mi Rê Sol Fa La Sol Fa Mi Rê."
  loai: ten
- trang: nhac-ly/22-doi-am
  id: n25
  cau: "Quãng giữa hai bè của ví dụ, từ trái sang phải: 5 – 6 – 6 – 8 – 3 – 6 – 3 – 6 – 6 – 6 – 8."
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n26
  cau: "Ví dụ: quãng đúng ở đầu và cuối, giữa bài chủ yếu là quãng 3 và 6, và các quãng 8 đều được đến bằng chuyển động ngược."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n27
  cau: "Hình counterpoint: bè đối âm (đỏ) La – Rê – Đô – Rê – Si – Rê – Đô – Mi – Rê – Đô♯ – Rê trên CF (xanh) Rê – Fa – Mi – Rê – Sol – Fa – La – Sol – Fa – Mi – Rê."
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n28
  cau: "Hình counterpoint: số quãng giữa hai bè: 5, 6, 6, 8, 3, 6, 3, 6, 6, 6, 8; quãng đúng (5, 8, 8) tô vàng."
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n29
  cau: "Hình counterpoint, hàng dưới: kiểu chuyển động giữa hai nốt liền: cùng chiều, cùng chiều, ngược, ngược, ngược, ngược, ngược, cùng chiều, cùng chiều, ngược."
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n30
  cau: 'Chú thích hình counterpoint: "Số giữa hai bè: quãng (vàng = quãng đúng, chỉ ở đầu, cuối và khi đến bằng chuyển động ngược). Hàng dưới: kiểu chuyển động; chuyển động ngược (xanh lá) chiếm phần lớn."'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n31
  cau: "Bài tập 1: viết một bè đối âm loại 1 dưới cantus firmus trên (bè dưới bắt đầu bằng Rê, quãng 8 hoặc đồng âm)."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n32
  cau: "Bài tập 2: đối âm loại 2 (hai nốt trắng chống một nốt tròn); nốt ở phách yếu có thể nghịch nếu là nốt lướt."
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n34
  cau: 'Câu hỏi 1: trong đối âm loại 1, quãng 4 được tính là nghịch so với bè dưới; giải thích: "Quãng 4 nghịch khi bè dưới là nền."'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n35
  cau: 'Câu hỏi 2: đối âm loại 4 dạy về nốt treo; giải thích: "Nốt lệch phách, nối qua vạch nhịp, rồi giải quyết xuống."'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n36
  cau: 'Câu hỏi 3: Johann Joseph Fux viết Gradus ad Parnassum (1725); giải thích: "Giáo trình đối âm kinh điển."'
  loai: ten
- trang: nhac-ly/22-doi-am
  id: n37
  cau: 'Câu hỏi 4: đối âm loại 1 bắt đầu bằng quãng 1, 5 hoặc 8 và kết thúc bằng quãng 8 hoặc đồng âm (đáp án "Quãng đúng").'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n33
  cau: "Bài tập 3: hát một bè trong khi chơi bè kia trên bàn phím piano (/opus/luyen-tap/ban-phim/)."
  loai: khuyen-tap
- trang: nhac-ly/23-hop-am-muon
  id: n1
  cau: Nhà soạn nhạc thường mượn hợp âm từ giọng thứ cùng tên để tạo màu sắc cho bản nhạc ở giọng trưởng (ví dụ mượn từ Đô thứ cho bản ở Đô trưởng).
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n2
  cau: Kỹ thuật này gọi là hòa âm hỗn hợp (modal mixture).
  loai: ten
- trang: nhac-ly/23-hop-am-muon
  id: n3
  cau: Hòa âm hỗn hợp rất đặc trưng của Schubert, Brahms, và cả nhạc phim, nhạc pop ngày nay.
  loai: lich-su
- trang: nhac-ly/23-hop-am-muon
  id: n4
  cau: "Hợp âm mượn trong Đô trưởng: Fa thứ, ký hiệu iv, mượn từ iv của Đô thứ, nốt mượn La♭."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n5
  cau: "Hợp âm mượn trong Đô trưởng: Rê giảm, ký hiệu ii°, mượn từ ii° của Đô thứ, nốt mượn La♭."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n6
  cau: "Hợp âm mượn trong Đô trưởng: La♭ trưởng, ký hiệu ♭VI, mượn từ VI của Đô thứ, nốt mượn La♭ và Mi♭."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n7
  cau: "Hợp âm mượn trong Đô trưởng: Si♭ trưởng, ký hiệu ♭VII, mượn từ VII của Đô thứ, nốt mượn Si♭."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n8
  cau: "Hợp âm mượn trong Đô trưởng: Mi♭ trưởng, ký hiệu ♭III, mượn từ III của Đô thứ, nốt mượn Mi♭ và Si♭."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n9
  cau: Dấu ♭ trước số La Mã nghĩa là nốt gốc của hợp âm bị hạ nửa cung so với gam trưởng.
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n10
  cau: "IV – iv – I là kết plagal: hợp âm hạ át (IV, rồi iv) đứng trước hợp âm chủ."
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n11
  cau: Ở I – IV – iv – I, nốt La đi xuống La♭ rồi về Sol.
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n12
  cau: 'Khuông "I – IV – iv – I trong Đô trưởng": [C,EGc] [F,FAc] [F,F_Ac] [C,EGc].'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n13
  cau: "♭VI – ♭VII – I: hai hợp âm mượn liên tiếp, rồi về chủ âm."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n14
  cau: 'Khuông "I – ♭VI – ♭VII – I": [C,EGc] [_A,,_E_Ac] [_B,,DF_B] [C,EGc].'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n15
  cau: "Bản nhạc ở giọng thứ có thể kết thúc bằng hợp âm trưởng của chủ âm: đó là quãng 3 Picardy."
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n17
  cau: Hợp âm V trong giọng thứ vốn đã dùng cảm âm được nâng (nốt này trùng với bậc 7 của giọng trưởng cùng tên).
  loai: quy-tac
- trang: nhac-ly/23-hop-am-muon
  id: n19
  cau: "Nghe trong tác phẩm thật: Saint-Saëns, opera Samson et Dalila, màn II, aria \"Mon cœur s'ouvre à ta voix\": hợp âm ii bán giảm mượn nốt ♭6 từ giọng thứ cùng tên."
  loai: ten
- trang: nhac-ly/23-hop-am-muon
  id: n20
  cau: "Nghe trong tác phẩm thật: Schubert nổi tiếng với những chỗ chuyển đột ngột giữa trưởng và thứ trên cùng một chủ âm; nghe chương 2 Ngũ tấu đàn dây cung Đô trưởng, D. 956."
  loai: lich-su
- trang: nhac-ly/23-hop-am-muon
  id: n21
  cau: 'Nghe trong tác phẩm thật: Catalani, opera La Wally, màn I, aria "Ebben? Ne andrò lontana": một đoạn nhạc mở đầu ở Mi trưởng rồi chuyển sang Mi thứ trên cùng chủ âm Mi.'
  loai: ten
- trang: nhac-ly/23-hop-am-muon
  id: n22
  cau: Chuỗi ♭VI – ♭VII – I xuất hiện ở rất nhiều đoạn kết hùng tráng trong nhạc phim và nhạc rock.
  loai: lich-su
- trang: nhac-ly/23-hop-am-muon
  id: n23
  cau: "Bài tập 1: viết hợp âm iv, ♭VI và ♭VII trong Sol trưởng; đáp án: iv = Đô thứ (Đô – Mi♭ – Sol); ♭VI = Mi♭ trưởng (Mi♭ – Sol – Si♭); ♭VII = Fa trưởng (Fa – La – Đô)."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n24
  cau: "Bài tập 2: viết I – iv – V – I trong Rê trưởng (iv của Rê trưởng là Sol thứ); đáp án: D – Gm – A – D."
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n26
  cau: 'Câu hỏi 1: iv trong Đô trưởng là Fa thứ; giải thích: "Mượn từ Đô thứ: Fa – La♭ – Đô."'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n27
  cau: 'Câu hỏi 2: ♭VII trong Đô trưởng là Si♭ trưởng; giải thích: "Nốt gốc Si bị hạ thành Si♭."'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n28
  cau: 'Câu hỏi 3: hòa âm hỗn hợp nghĩa là mượn hợp âm từ giọng thứ (hoặc trưởng) cùng tên; giải thích: "Ví dụ dùng iv trong giọng trưởng."'
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n25
  cau: 'Bài tập 3: nghe một bài hát pop bạn thích và tìm xem có hợp âm nào "lạ" so với giọng của bài không.'
  loai: khuyen-tap
- trang: nhac-ly/24-napoli-sau-tang
  id: n1
  cau: Hợp âm Napoli và hợp âm sáu tăng là hai loại hợp âm nửa cung (chromatic).
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n2
  cau: Hợp âm Napoli và hợp âm sáu tăng là "gia vị mạnh" của thời Cổ điển và Lãng mạn.
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n3
  cau: "Cả hai đều có chức năng tiền át: chúng đứng ngay trước hợp âm V."
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n4
  cau: Hợp âm N6 và +6 làm cho V nghe căng thẳng hơn.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n5
  cau: Hợp âm N6 và +6 hay xuất hiện nhất ở giọng thứ (ví dụ của trang ở Đô thứ).
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n6
  cau: Hợp âm Napoli là hợp âm trưởng trên bậc 2 bị hạ nửa cung (♭II), thường ở đảo 1, nên ký hiệu N6 hoặc ♭II6.
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n7
  cau: "Tên gọi Napoli nhắc tới Napoli (nhóm nhà soạn nhạc thế kỷ 18 quanh thành phố này), nhưng ít có cơ sở lịch sử: hợp âm đã được dùng từ trước đó và ở nhiều nơi khác."
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n8
  cau: "Trong Đô thứ: ♭II = Rê♭ trưởng (Rê♭ – Fa – La♭); ở đảo 1, nốt Fa ở bè trầm."
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n9
  cau: Hợp âm Napoli đi tới V, thường qua i6/4 hoặc trực tiếp.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n10
  cau: "Nốt Rê♭ của hợp âm Napoli thường đi xuống qua Đô hoặc thẳng xuống Si (cảm âm): một bước quãng 3 giảm rất đặc trưng."
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n11
  cau: 'Khuông "N6 – V – i trong Đô thứ": N6 = Fa – Fa – La♭ – Rê♭ (Rê♭ trưởng đảo 1), V = Sol – Rê – Sol – Si, i = Đô – Mi♭ – Sol – Đô; Rê♭ đi xuống Si.'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n12
  cau: "Hợp âm sáu tăng có hai nốt cách nhau quãng 6 tăng: La♭ (bậc 6 của Đô thứ) ở bè trầm và Fa♯ (bậc 4 được nâng) ở trên."
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n13
  cau: "Hai nốt của quãng 6 tăng giải quyết ra ngoài về quãng 8 trên Sol (bậc 5): La♭ đi xuống Sol, Fa♯ đi lên Sol."
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n14
  cau: Vì thế hợp âm sáu tăng kéo về V mạnh.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n15
  cau: Hợp âm sáu tăng có ba loại (Ý, Pháp, Đức); tên đặt theo quốc gia là tên gọi quy ước, không liên quan đến lịch sử thật.
  loai: ten
- trang: nhac-ly/24-napoli-sau-tang
  id: n16
  cau: "Hợp âm sáu Ý (It+6) trong Đô thứ: La♭ – Đô – Fa♯; ba nốt, gọn nhất."
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n17
  cau: "Hợp âm sáu Pháp (Fr+6) trong Đô thứ: La♭ – Đô – Rê – Fa♯ (thêm Rê); cả bốn nốt cùng thuộc một gam toàn cung."
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n18
  cau: "Hợp âm sáu Đức (Ger+6) trong Đô thứ: La♭ – Đô – Mi♭ – Fa♯ (thêm Mi♭)."
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n19
  cau: Hợp âm sáu Đức nghe giống hệt hợp âm La♭7, nhưng giải quyết khác.
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n20
  cau: 'Khuông "Ger+6 – i6/4 – V – i trong Đô thứ": bass La♭2 Sol2 Sol2 Đô3; trên: [Đô Mi♭ Fa♯] [Đô Mi♭ Sol] [Si Rê Sol] [Đô Mi♭ Sol].'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n21
  cau: Hợp âm sáu Đức thường đi qua i6/4 trước khi đến V, để tránh quãng 5 song song giữa La♭–Mi♭ và Sol–Rê.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n22
  cau: 'Beethoven, chương 1 Sonata "Ánh trăng" Op. 27 số 2: tên và số hiệu.'
  loai: ten
- trang: nhac-ly/24-napoli-sau-tang
  id: n23
  cau: Hợp âm Napoli xuất hiện ngay ở ô nhịp thứ 3 của chương 1 Sonata "Ánh trăng".
  loai: cau-truc
- trang: nhac-ly/24-napoli-sau-tang
  id: n24
  cau: Hợp âm sáu tăng có mặt trong nhạc của Mozart, Beethoven, Schubert, thường ngay trước hợp âm át.
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n26
  cau: "Bài tập 1: hợp âm N6 trong La thứ; ♭II của La thứ là Si♭ trưởng (Si♭ – Rê – Fa); đảo 1 nên Rê ở bè trầm."
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n27
  cau: "Bài tập 2: ở La thứ, bậc 6 là Fa, bậc 4 nâng là Rê♯; It+6: Fa – La – Rê♯; Fr+6: Fa – La – Si – Rê♯; Ger+6: Fa – La – Đô – Rê♯."
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n28
  cau: 'Câu hỏi 1: hợp âm Napoli trong Đô thứ là Rê♭ trưởng; giải thích: "Hợp âm trưởng trên bậc 2 bị hạ."'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n29
  cau: 'Câu hỏi 2: hai nốt của quãng 6 tăng giải quyết ra ngoài, về quãng 8 trên bậc 5; giải thích: "La♭ xuống Sol, Fa♯ lên Sol."'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n30
  cau: 'Câu hỏi 3: hợp âm sáu Đức nghe giống hệt một hợp âm bảy át; giải thích: "Ger+6 đồng âm với La♭7 trong Đô thứ."'
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n31
  cau: 'Câu hỏi 4: chức năng của N6 và +6 là tiền át, đứng trước V; giải thích: "Chúng làm hợp âm V thêm căng thẳng."'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n25
  cau: Khi nghe một hợp âm "nhói" ngay trước một hợp âm át lớn, rất có thể đó là +6.
  loai: khuyen-tap
- trang: nhac-ly/25-be-tram-so
  id: n2
  cau: Bè trầm số (figured bass) là cách ghi hợp âm của bè trầm liên tục bằng các con số dưới nốt bass
  loai: dinh-nghia
- trang: nhac-ly/25-be-tram-so
  id: n3
  cau: Nhạc công đàn phím thời Baroque chơi từ bè trầm kèm số và tự thêm hợp âm khi biểu diễn
  loai: dinh-nghia
- trang: nhac-ly/25-be-tram-so
  id: n4
  cau: Cách viết gốc "xương sống của bè trầm liên tục" gây hiểu sai; bè trầm số là cách ghi hợp âm của bè trầm liên tục
  loai: dinh-nghia
