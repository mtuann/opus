- trang: nhac-ly/20-doc-tong-pho
  id: n1
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/score", "https://s2.smu.edu/robfrank/MOLA.pdf"]
  ghi_chu: "Concise Oxford Dictionary of Music: full score shows all the parts separately displayed; score dùng cho nhạc trưởng (cond.). Đúng."
- trang: nhac-ly/20-doc-tong-pho
  id: n2
  luot_2: dung
  nguon: ["https://s2.smu.edu/robfrank/MOLA.pdf", "https://tamingthesaxophone.com/theory/arranging/composition-score"]
  ghi_chu: "MOLA: thứ tự phổ biến là gỗ, đồng, timpani/gõ/hạc/phím, giọng hát, rồi dây. Vị trí đàn hạc/piano/soloist/hợp xướng có khác nhau giữa các ấn bản; câu viết dạng quy ước chung nên chấp nhận."
- trang: nhac-ly/20-doc-tong-pho
  id: n3
  luot_2: dung
  nguon: ["https://s2.smu.edu/robfrank/MOLA.pdf"]
  ghi_chu: "MOLA: trong mỗi nhóm xếp theo âm cao đến thấp 'for the most part'. Có ngoại lệ (horn thường đặt trên trumpet) nên chữ 'thường' là đúng."
- trang: nhac-ly/20-doc-tong-pho
  id: n4
  luot_2: khong-chac
  ghi_chu: "Không mở được nguồn bậc 2 liệt kê viết tắt (Fl., Picc., Ob., Cl., Kl., Fg., Bsn.); các trang thử đều không có hoặc không mở được. Theo hiểu biết thông dụng thì đúng (Kl. = Klarinette, Fg. = Fagott) nhưng chưa có link đã mở để dẫn. Bộ gỗ còn có cor anglais, clarinet bass, contrabassoon (câu chỉ liệt kê một phần)."
- trang: nhac-ly/20-doc-tong-pho
  id: n5
  luot_2: khong-chac
  ghi_chu: "Như n4: chưa mở được nguồn bậc 2 cho viết tắt Hn., Cor., Tpt., Tr., Tbn., Pos. Theo hiểu biết thông dụng thì đúng (Cor. Pháp/Ý cho horn, Tr. = Tromba/Trompete, Pos. = Posaune)."
- trang: nhac-ly/20-doc-tong-pho
  id: n6
  luot_2: khong-chac
  ghi_chu: "Chưa mở được nguồn bậc 2 liệt kê Timp., Pk., Hp., Pno. Wikipedia (Timpani) xác nhận tiếng Đức là Pauken nhưng không ghi viết tắt Timp.; chỉ là nguồn phổ thông nên không dùng làm nguồn."
- trang: nhac-ly/20-doc-tong-pho
  id: n7
  luot_2: khong-chac
  ghi_chu: "Chưa mở được nguồn bậc 2 cho Vn./Vln., Vla./Br., Vc., Cb./Kb. Theo hiểu biết thông dụng thì đúng."
- trang: nhac-ly/20-doc-tong-pho
  id: n8
  luot_2: khong-chac
  ghi_chu: "Phần Pauken = timpani, Bratsche = viola đúng (Wikipedia Timpani, Viola xác nhận, nhưng chỉ là nguồn phổ thông); phần 'tùy nhà xuất bản dùng Ý/Đức/Pháp' chưa có nguồn bậc 2 đã mở."
- trang: nhac-ly/20-doc-tong-pho
  id: n9
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/", "https://s2.smu.edu/robfrank/MOLA.pdf"]
  ghi_chu: "OMT: khóa Đô alto (Đô4 ở dòng giữa) chủ yếu cho viola. MOLA: phần của nhạc cụ dịch giọng viết ở giọng đã dịch. Với tổng phổ ghi giọng dịch (không phải tổng phổ âm thật) thì hóa biểu khác nhau; câu có chữ 'có thể' nên đúng."
- trang: nhac-ly/20-doc-tong-pho
  id: n11
  luot_2: khong-chac
  ghi_chu: "Cách xếp chỗ phổ biến (dây phía trước, gỗ, đồng, gõ phía sau) đúng theo hiểu biết thông dụng, nhưng các trang đã mở (Wikipedia Symphony orchestra, Second violin) không mô tả bố cục; chưa có nguồn bậc 2 đã mở. Phần 'trong tổng phổ gỗ trên cùng, dây dưới cùng' đúng (MOLA)."
- trang: nhac-ly/20-doc-tong-pho
  id: n12
  luot_2: khong-chac
  ghi_chu: "Chỉ phần nhạc lý của câu (bố cục dây-gỗ-đồng-gõ từ trước ra sau) đúng theo thông lệ, nhưng chưa mở được nguồn xác nhận; hình cụ thể trên site không kiểm được từ đây."
- trang: nhac-ly/20-doc-tong-pho
  id: n13
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Second_violin"]
  ghi_chu: "Câu rào đón (mỗi dàn nhạc bố trí khác). Wikipedia Second violin: bố cục thế kỷ 19 đặt violin 1 và 2 hai bên đối diện nhau (violin 2 bên phải nhạc trưởng); chỉ là nguồn phổ thông nhưng câu rất nhẹ."
- trang: nhac-ly/20-doc-tong-pho
  id: n16
  luot_2: khong-chac
  ghi_chu: "Phần nhạc lý hiển nhiên đúng (sonata piano viết trên 2 khuông). 'Cấp độ 1' là thang riêng của site, không nguồn ngoài nào kiểm được."
- trang: nhac-ly/20-doc-tong-pho
  id: n17
  luot_2: khong-chac
  ghi_chu: "Tứ tấu đàn dây có 4 bè nên 4 khuông là hiển nhiên, nhưng 'cấp độ 2' là thang riêng của site, không có nguồn ngoài."
- trang: nhac-ly/20-doc-tong-pho
  id: n18
  luot_2: dung
  nguon: ["https://digfir-published.macmillanusa.com/listen8e/listen8e_ch13_20.html"]
  ghi_chu: "Chương 2 giao hưởng 94 là Andante, chủ đề và biến tấu, chủ đề đơn giản; dàn nhạc cổ điển (dây, flute, oboe, bassoon, horn, trumpet, timpani) nhỏ hơn Beethoven 5. Thang 'cấp độ 3' là của site."
- trang: nhac-ly/20-doc-tong-pho
  id: n19
  luot_2: khong-chac
  ghi_chu: "IMSLP xác nhận Giao hưởng số 40 K.550 sol thứ, 4 chương; OMT không dùng K.550 làm ví dụ sonata. Chưa mở được nguồn nói riêng về sonata form của chương 1 (thực tế đúng theo hiểu biết). 'Cấp độ 4' là thang của site."
- trang: nhac-ly/20-doc-tong-pho
  id: n20
  luot_2: dung
  nguon: ["https://digfir-published.macmillanusa.com/listen8e/listen8e_ch15_12.html"]
  ghi_chu: "Hướng dẫn nghe (Macmillan): chương cuối lần đầu thêm ba trombone, ngoài ra có horn, trumpet, timpani, oboe, dây; dàn nhạc đầy đủ hơn Haydn 94. Thang 'cấp độ 5' là của site."
- trang: nhac-ly/20-doc-tong-pho
  id: n22
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Symphony_No.5,_Op.67_(Beethoven,_Ludwig_van)"]
  ghi_chu: "Trang tác phẩm IMSLP (Beethoven 5) có mục 'Full Scores' dưới Sheet Music; IMSLP chỉ đăng bản thuộc phạm vi công cộng."
- trang: nhac-ly/20-doc-tong-pho
  id: n24
  luot_2: khong-chac
  ghi_chu: "Henle có study score (khổ bỏ túi 17x24 cm, Urtext; henle.de/en/Study-Scores/). Chưa mở được trang xác nhận cho Bärenreiter và Eulenburg (trang trả rỗng hoặc bị chặn robot); theo hiểu biết thông dụng cả hai đều có."
- trang: nhac-ly/20-doc-tong-pho
  id: n25
  luot_2: khong-chac
  ghi_chu: "Câu về hình trên site (khung 4 bè rút gọn của vòng Canon, 'bài 12'): không xem được hình; 'bài 12' là về site. Phần nhạc lý duy nhất kiểm được (viola khóa Đô alto) đúng theo OMT Clefs."
- trang: nhac-ly/20-doc-tong-pho
  id: n28
  luot_2: khong-chac
  ghi_chu: "Chương 1 Beethoven 5: tiếng horn (ô 59-62) là đoạn cầu nối (bridge) dẫn vào chủ đề 2 do dây trình bày ngay sau đó (Macmillan: 'horn-call bridge'; chủ đề 2 vào sau). 'Horn giới thiệu chủ đề 2' hiểu rộng thì đúng, hiểu chặt thì không; nên viết 'horn dẫn vào chủ đề 2'."
- trang: nhac-ly/20-doc-tong-pho
  id: n29
  luot_2: dung
  nguon: ["https://s2.smu.edu/robfrank/MOLA.pdf"]
  ghi_chu: "MOLA: thứ tự phổ biến bắt đầu bằng woodwind ở trên cùng."
- trang: nhac-ly/20-doc-tong-pho
  id: n31
  luot_2: dung
  nguon: ["https://en.wikipedia.org/wiki/Transposing_instrument", "https://s2.smu.edu/robfrank/MOLA.pdf"]
  ghi_chu: "Nhạc cụ dịch giọng viết ở giọng đã dịch để âm thật vẫn hòa với dàn nhạc (hóa biểu khác). Ý giải thích đúng; Wikipedia chỉ là nguồn phổ thông, MOLA xác nhận phần viết giọng dịch."
- trang: nhac-ly/20-doc-tong-pho
  id: n32
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/clefs/"]
  ghi_chu: "OMT Clefs: khóa alto có Đô4 ở dòng giữa (dòng 3); chủ yếu cho viola."
- trang: nhac-ly/20-doc-tong-pho
  id: n14
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý: violin I thường mang giai điệu chính, hợp cách dạy phổ biến."
- trang: nhac-ly/20-doc-tong-pho
  id: n23
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý."
- trang: nhac-ly/20-doc-tong-pho
  id: n27
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý; IMSLP có tổng phổ Giao hưởng số 5 (mục Full Scores)."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n2
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Chorale_Harmonisations,_BWV_250-438_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Trang IMSLP: 371 chorale (bản do C.P.E. Bach giám sát cho Breitkopf), các bộ khác 149-210 bài; đều là chorale hòa âm bốn bè. 'Hàng trăm' đúng."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n3
  luot_2: khong-chac
  ghi_chu: "Không nguồn nào đã mở nói điều này. Viết bốn bè (SATB) là nền tảng của giáo trình hòa âm/nhạc lý, nhưng 'mọi khóa học sáng tác' là khái quát quá mức, không kiểm được. Nên viết 'khóa hòa âm nhạc lý'."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n4
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Định nghĩa SATB chuẩn; âm vực từ cao đến thấp S, A, T, B theo hai nguồn."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n5
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Soprano và alto là giọng nữ, tenor và bass giọng nam theo cách gọi chuẩn của hợp xướng SATB; âm vực khớp (S, A treble; T, B bass)."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n6
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "OMT: soprano C4-G5, alto G3-D5, tenor C3-G4. Khớp."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n7
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "OMT: bass F2-D4. Iowa State ghi G2-D4 (bass 'được mở rộng thêm vài nốt'). Các sách khác nhau vài nốt; theo OMT thì đúng."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n8
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "Bốn âm vực ghi trên hình khớp OMT (S C4-G5, A G3-D5, T C3-G4, B F2-D4). Phần 'chú thích ghi đúng bốn âm vực ấy' không xem được hình, chỉ kiểm nội dung nhạc lý."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n9
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "OMT: soprano và alto khóa Sol (khuông trên), tenor và bass khóa Fa; soprano và tenor đuôi lên, alto và bass đuôi xuống."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n10
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "OMT: hợp âm bảy không nhân đôi vì có bốn nốt cho bốn bè; suy ra hợp âm ba (3 nốt) phải nhân đôi một nốt."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n11
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/triads/"]
  ghi_chu: "OMT Triads: đảo = đổi nốt bass; ký hiệu hợp âm theo nốt thấp nhất (root position nốt gốc ở dưới)."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n12
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "OMT: nốt ở bass thường được nhân đôi; Iowa State: thể gốc trưởng/thứ nhân đôi nốt gốc."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n13
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "OMT: 'the leading tone is never doubled'."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n14
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Các nguồn nêu quy tắc (không nhân đôi âm có xu hướng) và cảm âm đi lên chủ âm; lý do (hai bè cùng lên chủ âm sinh quãng 8 song song) là suy luận trực tiếp, không nguồn nào đã mở nêu rõ lý do này."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n15
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "OMT: các bè trên kề nhau không quá một quãng 8; tenor và bass tối đa một quãng 12."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n16
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "OMT: soprano luôn cao hơn alto, v.v. (không bắt chéo)."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n17
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/", "https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/"]
  ghi_chu: "Cả hai: giữ nốt chung ở cùng một bè khi nối hai hợp âm."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n18
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/", "https://rwu.pressbooks.pub/musictheory/chapter/root-position-connection-of-chords-in-the-major-mode/"]
  ghi_chu: "Các bè đi bước liền, nhảy dè dặt; bè bass cần tự do nhảy (Iowa State: 'the bass needs freedom to move'; RWU: bass luôn đi nhảy khi nối hợp âm thể gốc)."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n19
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "Cấm quãng 5 và 8 song song: hai bè đi cùng chiều từ quãng 5 (8) sang cùng loại quãng. OMT 2.02: 'never use two perfect consonances of the same size in a row'."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n20
  luot_2: dung
  nguon: ["https://minnstate.pressbooks.pub/firstyearmusictheory/chapter/voice-leading/3"]
  ghi_chu: "Minnesota State: các quãng song song này 'were thought to destroy the independence of the voices'."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n21
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Iowa State: cảm âm giải quyết lên chủ âm (bè trong có thể nhảy xuống bậc 5); nốt 7 của hợp âm bảy giải quyết xuống bước liền. Câu là quy tắc chung đã giản lược, chấp nhận."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n22
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "OMT 2.02: chuyển động ngược tốt nhất cho sự độc lập của các đường; Iowa State: ưu tiên ngược/xiên thay vì song song."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n23
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "Từ chính các nốt của khuông ở n28 (S: Đô5 Đô5 Si4 Đô5; A: Mi4 Fa4 Rê4 Mi4; T: Sol3 La3 Sol3 Sol3; B: Đô3 Fa2 Sol2 Đô3), kiểm tay: đúng I-IV-V-I Đô trưởng, trong âm vực, không bắt chéo, không song song 5/8, đúng giãn cách."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n24
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "Bass Đô3 xuống Fa2 (quãng 5 xuống), lên Sol2 (bước liền), rồi lên Đô3: đúng theo các nốt ở n28."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n25
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Chú thích nói điều khớp quy tắc: bước gần, nốt chung giữ nguyên; kiểm trên ví dụ I-IV-V-I thấy đúng (Đô giữ ở soprano khi I-IV, Sol giữ ở tenor khi V-I)."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n26
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "Kiểm tay: C(Đô-Sol-Mi-Đô) sang Dm (Rê-La-Fa-Rê), mọi bè lên một bậc; bass-tenor Đô-Sol (5) sang Rê-La (5), bass-soprano Đô-Đô (8) sang Rê-Rê (8): song song 5 và 8, đúng mô tả."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n27
  luot_2: dung
  nguon: ["https://minnstate.pressbooks.pub/firstyearmusictheory/chapter/voice-leading/3"]
  ghi_chu: "Khớp n26 và quy tắc cấm song song 5/8 (mất độc lập các bè); cả bốn bè cùng đi lên là chuyển động song song hoàn toàn, nên mất độc lập."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n28
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "Kiểm bằng cú pháp ABC: [Ec]=Mi4+Đô5, [Fc]=Fa4+Đô5, [DB]=Rê4+Si4, [C,G,]=Đô3+Sol3, [F,,A,]=Fa2+La3, [G,,G,]=Sol2+Sol3. Các hợp âm là C, F, G, C đủ ba nốt (gốc nhân đôi), trong âm vực, giãn cách trong một quãng 8, không bắt chéo, không 5/8 song song. Đúng."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n29
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "Khuông trên là soprano và alto, khuông dưới là tenor và bass; thứ tự từ dưới lên bass, tenor, alto, soprano đúng."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n30
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "Từ các nốt: soprano Đô giữ; alto Mi lên Fa, tenor Sol lên La (bước liền); bass Đô3 xuống Fa2 (quãng 5)."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n31
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "Bass Fa2 lên Sol2; soprano Đô-Si, alto Fa-Rê, tenor La-Sol đều đi xuống; không có 5/8 song song giữa các cặp bè."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n32
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Soprano Si lên Đô (cảm âm giải quyết lên chủ âm), tenor giữ Sol (nốt chung của V và I). Đúng."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n33
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "[C,G,] = Đô3+Sol3 (quãng 5), [D,A,] = Rê3+La3 (quãng 5), cùng chiều: quãng 5 song song, là lỗi đúng như nhãn 'Sai'."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n34
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "I-V-I ở Sol trưởng: bass Sol-Rê-Sol (gốc của G, D, G) đúng."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n36
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Chorale_Harmonisations,_BWV_250-438_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Trang IMSLP có mục 'Selections (371 Chorale-Settings)' và tên file '371'; tìm '371 Chorales' ra được. Là lời hướng dẫn tìm, hợp lý."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n37
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Thể gốc trưởng/thứ nhân đôi nốt gốc. Lời giải thích 'âm thanh vững nhất' là nhận xét thẩm mỹ, chấp nhận."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n38
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/", "https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Không nhân đôi cảm âm vì nó phải giải quyết lên chủ âm; nếu nhân đôi, hai bè cùng lên tạo quãng 8 (hoặc đồng âm) song song: đúng. Lời giải thích trong câu hỏi đủ ý."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n39
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/chords-in-satb-style/"]
  ghi_chu: "OMT: tenor và bass được cách đến quãng 12; các bè trên kề nhau trong một quãng 8."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n40
  luot_2: dung
  nguon: ["https://iastate.pressbooks.pub/comprehensivemusicianship/chapter/10-1-chord-voicing-and-voice-leading-general-principles-tutorial/"]
  ghi_chu: "Nốt 7 của hợp âm bảy giải quyết xuống bước liền: Fa xuống Mi trong G7 sang C. Đúng."
- trang: nhac-ly/21-hoa-am-bon-be
  id: n35
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý."
- trang: nhac-ly/22-doi-am
  id: n1
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/counterpoint", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.01%3A_Introduction_to_Species_Counterpoint"]
  ghi_chu: "Concise Oxford Dictionary of Music: đối âm là khả năng nói hai điều cùng lúc một cách dễ hiểu; OMT: phương pháp viết giai điệu và kết hợp chúng."
- trang: nhac-ly/22-doi-am
  id: n2
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.08%3A_16th-Century_Contrapuntal_Style"]
  ghi_chu: "OMT 2.8: nhà soạn nhạc thế kỷ 16 không nghĩ theo hợp âm mà theo quan hệ quãng giữa các bè (nghĩ ngang). Đối lập hòa âm (dọc) và đối âm (ngang) là cách nói thông thường."
- trang: nhac-ly/22-doi-am
  id: n3
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.08%3A_16th-Century_Contrapuntal_Style", "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/counterpoint"]
  ghi_chu: "Đối âm đạt đỉnh cuối thế kỷ 16 đầu 17 (Oxford); OMT có chương về phong cách đối âm thế kỷ 16 và chương trình bày fugue baroque trong cùng phần Counterpoint. Câu rộng nhưng chấp nhận."
- trang: nhac-ly/22-doi-am
  id: n7
  luot_2: dung
  nguon: ["https://www.britannica.com/biography/Johann-Joseph-Fux", "https://imslp.org/wiki/Gradus_ad_Parnassum_(Fux,_Johann_Joseph)"]
  ghi_chu: "Britannica: nhà soạn nhạc Áo, Gradus ad Parnassum (1725). IMSLP: Vienna, Van Ghelen, 1725."
- trang: nhac-ly/22-doi-am
  id: n8
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/johann-joseph-fux"]
  ghi_chu: "Encyclopedia of World Biography: sách viết dưới dạng đối thoại (Palestrina là thầy, Fux là trò); các nguồn khác ghi hai nhân vật là Aloysius và Josephus."
- trang: nhac-ly/22-doi-am
  id: n9
  luot_2: dung
  nguon: ["https://www.britannica.com/biography/Johann-Joseph-Fux", "https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/johann-joseph-fux"]
  ghi_chu: "Britannica: Mozart, Haydn và các nhà soạn nhạc thế kỷ 18 khác đã học cuốn này; Encyclopedia.com: Haydn và Beethoven. Đủ ba người, nhưng mỗi nguồn nêu một phần."
- trang: nhac-ly/22-doi-am
  id: n10
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/people/literature-and-arts/music-history-composers-and-performers-biographies/johann-joseph-fux", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.07%3A_Gradus_ad_Parnassum_Exercises"]
  ghi_chu: "New Catholic Encyclopedia (qua Encyclopedia.com): 'still consulted'; OMT vẫn dùng bài tập Fux (chương 2.7). Britannica chỉ nói 'long the standard' nên hơi yếu hơn."
- trang: nhac-ly/22-doi-am
  id: n11
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/counterpoint", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.01%3A_Introduction_to_Species_Counterpoint"]
  ghi_chu: "Cantus firmus (OMT: một đường nhạc đơn), năm loại (species); Oxford: đối âm chặt chẽ dựa trên cantus firmus chia năm loại. 'Nốt tròn' đúng với bài tập của OMT 2.3-2.4."
- trang: nhac-ly/22-doi-am
  id: n12
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "Loại 1: một nốt chống một nốt, chỉ quãng thuận (và quãng 4 xem là nghịch khi liên quan bè thấp nhất)."
- trang: nhac-ly/22-doi-am
  id: n13
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.03%3A_Second-Species_Counterpoint"]
  ghi_chu: "OMT 2.3: nốt trắng chống nốt tròn; phách yếu nghịch chỉ là nốt lướt (passing tone)."
- trang: nhac-ly/22-doi-am
  id: n14
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.04%3A_Third-Species_Counterpoint"]
  ghi_chu: "OMT 2.4: bốn nốt đen chống một nốt tròn; nốt lướt, nốt thêu, thêu đôi, nota cambiata."
- trang: nhac-ly/22-doi-am
  id: n15
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.05%3A_Fourth-Species_Counterpoint"]
  ghi_chu: "OMT 2.5: nốt phách yếu nối qua vạch nhịp sang phách mạnh tạo nốt treo (suspension)."
- trang: nhac-ly/22-doi-am
  id: n16
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/counterpoint", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.06%3A_Fifth-Species_Counterpoint"]
  ghi_chu: "Oxford: loại 5 thường gọi là florid counterpoint, trộn các loại trước; OMT 2.6: kết hợp các thủ pháp đã học."
- trang: nhac-ly/22-doi-am
  id: n17
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.01%3A_Introduction_to_Species_Counterpoint", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "OMT 2.1: quãng thuận gồm 1, 5, 8 (đúng) và 3, 6 (trưởng/thứ); quãng 4 đúng nghịch khi liên quan bè thấp nhất."
- trang: nhac-ly/22-doi-am
  id: n18
  luot_2: khong-chac
  ghi_chu: "Phần kết (quãng 8 hoặc đồng âm) và mở đầu bằng 1, 5, 8 đúng (OMT 2.2). Phần 'bè đối âm ở dưới thì chỉ 1 hoặc 8' OMT không phân biệt trên/dưới; chỉ có Wikipedia Counterpoint (nguồn phổ thông, theo truyền thống Fux/Jeppesen) nói vậy. Chưa có nguồn bậc 2 đã mở xác nhận."
- trang: nhac-ly/22-doi-am
  id: n19
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "OMT 2.2: cấm song song hoàn hảo; không đi vào quãng thuận hoàn toàn bằng chuyển động tương tự (similar motion)."
- trang: nhac-ly/22-doi-am
  id: n20
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "OMT 2.2: chuyển động ngược tốt nhất; không quá ba quãng không hoàn hảo cùng loại liên tiếp."
- trang: nhac-ly/22-doi-am
  id: n21
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.08%3A_16th-Century_Contrapuntal_Style"]
  ghi_chu: "OMT 2.2: ưu tiên bước liền, nhảy thỉnh thoảng; OMT 2.8: bước nhảy lớn nên theo sau bằng chuyển động ngược chiều."
- trang: nhac-ly/22-doi-am
  id: n22
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.08%3A_16th-Century_Contrapuntal_Style", "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.07%3A_Gradus_ad_Parnassum_Exercises"]
  ghi_chu: "OMT 2.8: nâng cảm âm khi tiến vào nốt cuối từ dưới (trừ Phrygian). Dorian trên Rê: cảm âm là Đô thành Đô thăng."
