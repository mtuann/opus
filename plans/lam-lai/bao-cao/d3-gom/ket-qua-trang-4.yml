  id: n30
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "Quãng đúng chỉ ở đầu, cuối (và đến bằng chuyển động ngược); chuyển động ngược 6/10 cặp nên 'phần lớn' ổn."
- trang: nhac-ly/22-doi-am
  id: n31
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "Bè dưới bắt đầu bằng Rê (đồng âm hoặc quãng 8) hợp lệ theo OMT (bắt đầu 1, 5 hoặc 8) và cả quy tắc chặt hơn cho bè dưới."
- trang: nhac-ly/22-doi-am
