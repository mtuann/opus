  id: n23
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.07%3A_Gradus_ad_Parnassum_Exercises"]
  ghi_chu: "OMT 2.7: cantus firmus Dorian của Fux là D4 F4 E4 D4 G4 F4 A4 G4 F4 E4 D4; trùng dãy trong câu."
- trang: nhac-ly/22-doi-am
  id: n25
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.07%3A_Gradus_ad_Parnassum_Exercises"]
  ghi_chu: "Tự tính từ CF Rê Fa Mi Rê Sol Fa La Sol Fa Mi Rê và bè đối âm ở n27 (La Rê Đô Rê Si Rê Đô Mi Rê Đô♯ Rê, ở trên): 5 6 6 8 3 6 3 6 6 6 8. Khớp."
