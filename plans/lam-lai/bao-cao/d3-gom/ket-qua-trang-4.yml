  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.07%3A_Gradus_ad_Parnassum_Exercises"]
  ghi_chu: "CF khớp OMT 2.7; bè đối âm La Rê Đô Rê Si Rê Đô Mi Rê Đô♯ Rê hợp lệ theo luật loại 1 (kiểm tay, xem n25, n26). Không kiểm được hình, chỉ nội dung nốt."
