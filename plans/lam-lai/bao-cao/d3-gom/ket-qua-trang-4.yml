  id: n35
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.05%3A_Fourth-Species_Counterpoint"]
  ghi_chu: "OMT 2.5: nốt treo giải quyết xuống một bước liền ở phách yếu kế tiếp."
