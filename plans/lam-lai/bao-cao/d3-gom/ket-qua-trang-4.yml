  id: n36
  luot_2: dung
  nguon: ["https://www.britannica.com/biography/Johann-Joseph-Fux", "https://imslp.org/wiki/Gradus_ad_Parnassum_(Fux,_Johann_Joseph)"]
  ghi_chu: "Gradus ad Parnassum (1725) của Fux; Britannica: giáo trình đối âm tiêu chuẩn."
- trang: nhac-ly/22-doi-am
  id: n37
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.02%3A_First-Species_Counterpoint"]
  ghi_chu: "OMT 2.2: mở đầu bằng quãng 1, 5 hoặc 8 (quãng đúng) và kết bằng quãng 8 hoặc đồng âm."
- trang: nhac-ly/22-doi-am
  id: n33
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý (đường dẫn nội bộ của site không kiểm ở đây)."
- trang: nhac-ly/23-hop-am-muon
  id: n1
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/"]
  ghi_chu: "OMT: modal mixture (borrowing) là trộn nốt của hai điệu trưởng và thứ tự nhiên song song (ví dụ Đô trưởng và Đô thứ). Mount: mixture trộn yếu tố trưởng và thứ của cùng một giọng."
- trang: nhac-ly/23-hop-am-muon
  id: n2
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "OMT dùng 'modal mixture (or borrowing)'. Tên tiếng Việt 'hòa âm hỗn hợp' là của site (thuật ngữ khóa ở thuat-ngu.yml), không kiểm ở đây."
- trang: nhac-ly/23-hop-am-muon
  id: n3
  luot_2: dung
  nguon: ["https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/", "https://pressbooks.nebraska.edu/openmusictheory/?p=558"]
  ghi_chu: "Mount: ví dụ từ Schubert (Die schöne Müllerin) và Brahms, 'especially prevalent in the Romantic era'. OMT phần Popular Music: ♭VII mượn từ Mixolydian trong nhạc pop, cadence Aeolian dùng trong nhạc phim (Lord of the Rings) và game. 'Đặc trưng của Schubert, Brahms' là khái quát nhưng chấp nhận."
- trang: nhac-ly/23-hop-am-muon
  id: n4
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "OMT: iv chỉ mượn ↓6. Trong Đô: Fa-La♭-Đô, nốt mượn La♭. Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n5
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/"]
  ghi_chu: "OMT: iio6 và ii bán giảm chỉ mượn ↓6; Mount: ♭6 làm ii giảm. Trong Đô: Rê-Fa-La♭, nốt mượn La♭. Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n6
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "OMT: ↓3 và ↓6/↓7 sinh ♭VI, ♭III, ♭VII. ♭VI trong Đô = La♭-Đô-Mi♭, nốt mượn La♭ và Mi♭. Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n7
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "♭VII trong Đô = Si♭-Rê-Fa, chỉ Si♭ là nốt mượn (↓7). Đúng. (Mount cho rằng ♭7 thường bị tránh trong nhạc cổ điển, nhưng OMT xếp ♭VII là hợp âm mượn.)"
- trang: nhac-ly/23-hop-am-muon
  id: n8
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "♭III trong Đô = Mi♭-Sol-Si♭, nốt mượn Mi♭ và Si♭ (↓3, ↓7). Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n9
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "OMT: dấu giáng trước số La Mã nghĩa là nốt gốc bị hạ (so với thang trưởng), không phải nghĩa đen 'giáng'."
- trang: nhac-ly/23-hop-am-muon
  id: n10
  luot_2: khong-chac
  ghi_chu: "OMT (Plagal motion) định nghĩa chuyển động plagal là IV (IV6) sang I; không nói về iv-I hay IV-iv-I và còn ưa gọi 'plagal motion' hơn 'plagal cadence'. Gọi iv-I là kết plagal (minor plagal) là cách dùng phổ biến, nhưng chưa mở được nguồn xác nhận riêng 'IV-iv-I'."
- trang: nhac-ly/23-hop-am-muon
  id: n11
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "Kiểm từ khuông n12: La4 (hợp âm F) xuống La♭4 (Fa thứ) rồi Sol4 (hợp âm C). Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n12
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "ABC: [C,EGc]=C3 E4 G4 C5; [F,FAc]=F3 F4 A4 C5; [F,F_Ac]=F3 F4 A♭4 C5 (Fa thứ); lại [C,EGc]. Là I-IV-iv-I ở Đô trưởng, đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n13
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://pressbooks.nebraska.edu/openmusictheory/?p=558"]
  ghi_chu: "♭VI và ♭VII đều là hợp âm mượn từ Đô thứ, rồi về I: cadence Aeolian ♭VI-♭VII-I (OMT Popular Music)."
- trang: nhac-ly/23-hop-am-muon
  id: n14
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "ABC: [_A,,_E_Ac]=La♭2 Mi♭4 La♭4 Đô5 (La♭ trưởng); [_B,,DF_B]=Si♭2 Rê4 Fa4 Si♭4 (Si♭ trưởng). Đúng ♭VI và ♭VII. Lưu ý: nối ♭VII sang I (Si♭2/Si♭4 sang Đô3/Đô5, Si♭2/Fa4 sang Đô3/Sol4) có quãng 8 và quãng 12 song song giữa bass-soprano và bass-alto; không sai nhạc lý vì khuông này là minh họa hợp âm, không phải bài tập dẫn bè bốn bè, nhưng trái quy tắc ở bài 21 nếu bị coi là bốn bè."
- trang: nhac-ly/23-hop-am-muon
  id: n15
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/"]
  ghi_chu: "OMT: Picardy third là bài/chương ở giọng thứ kết bằng hợp âm chủ trưởng. Mount: quãng 3 nâng của hợp âm chủ trong giọng thứ."
- trang: nhac-ly/23-hop-am-muon
  id: n17
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/", "https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/29-mixture/"]
  ghi_chu: "OMT: thang thứ hòa thanh có cảm âm nâng, tạo cảm giác kết; Mount: nâng cảm âm là phổ biến trong giọng thứ. Cảm âm nâng chính là bậc 7 của giọng trưởng cùng tên. Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n19
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "OMT Ví dụ 11: Saint-Saëns, Samson et Dalila, màn II, 'Mon cœur s''ouvre à ta voix': chuyển từ ii (thể 4/3) sang ii bán giảm, mượn ↓6 từ giọng thứ song song. Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n20
  luot_2: sai
  nguon: ["https://imslp.org/wiki/String_Quintet,_D.956_(Schubert,_Franz)", "https://thelistenersclub.com/2014/05/16/schuberts-string-quintet-in-c-major/", "https://en.wikipedia.org/wiki/String_Quintet_(Schubert)"]
  cau_dung: "Schubert nổi tiếng với những chỗ chuyển đột ngột giữa trưởng và thứ; chương 2 (Adagio) của Ngũ tấu đàn dây cung Đô trưởng, D. 956 đối lập Mi trưởng với Pha thứ (giọng xa, khác chủ âm), còn sự đan xen trưởng-thứ trên cùng chủ âm là nét của chương 4 (Allegretto); nên đổi ví dụ nghe sang chương 4 hoặc bỏ chỉ dẫn chương."
  ghi_chu: "IMSLP: D.956 Đô trưởng, chương 2 Adagio. The Listeners Club và Wikipedia: Adagio có phần đầu và cuối ở Mi trưởng, phần giữa 'đột ngột sang Pha thứ' (khác chủ âm, không phải mượn hợp âm cùng chủ âm); Wikipedia nói chương 4 'built upon the interplay of the major and minor modes'. Chưa tìm được nguồn bậc 2 (chương trình hòa nhạc, ấn bản) để xác nhận chương 4; nguồn dẫn chỉ phổ thông."
- trang: nhac-ly/23-hop-am-muon
  id: n21
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "OMT Ví dụ 12: Catalani, La Wally, màn I, 'Ebben? Ne andrò lontana': chuyển điệu từ Mi trưởng sang Mi thứ song song (cùng chủ âm Mi)."
- trang: nhac-ly/23-hop-am-muon
  id: n22
  luot_2: khong-chac
  ghi_chu: "OMT Popular Music: cadence Aeolian (♭VI-♭VII-I, 'Mario cadence') kết cụm của Fellowship Theme (Lord of the Rings, nhạc phim) và nhạc game, gắn với thành công, anh hùng. Chữ 'rất nhiều' và 'nhạc rock' không có trong các nguồn đã mở (OMT nói rock ở phần khác, với ♭VII-I)."
- trang: nhac-ly/23-hop-am-muon
  id: n23
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "Sol trưởng: iv = Đô thứ (Đô-Mi♭-Sol); ♭VI = Mi♭ trưởng (Mi♭-Sol-Si♭); ♭VII = Fa trưởng (Fa-La-Đô). Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n24
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "Rê trưởng: iv mượn từ Rê thứ = Sol thứ (Sol-Si♭-Rê); D-Gm-A-D đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n26
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "iv trong Đô trưởng = Fa thứ = Fa-La♭-Đô, mượn từ Đô thứ. Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n27
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "♭VII trong Đô = Si♭ trưởng; nốt gốc Si hạ thành Si♭ (OMT: dấu ♭ nghĩa là gốc bị hạ). Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n28
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/modal-mixture/"]
  ghi_chu: "OMT: modal mixture là mượn từ chế độ song song (trưởng-thứ, hai chiều); iv trong giọng trưởng là ví dụ. Đúng."
- trang: nhac-ly/23-hop-am-muon
  id: n25
  luot_2: dung
  nguon: []
  ghi_chu: "Khuyên tập hợp lý."
