  ghi_chu: "OMT 2.3: phách yếu nghịch chỉ khi là nốt lướt."
- trang: nhac-ly/22-doi-am
  id: n34
  luot_2: dung
  nguon: ["https://human.libretexts.org/Bookshelves/Music/Music_Theory/Open_Music_Theory_2e_%28Gotham_et_al.%29/02%3A_Counterpoint_and_Galant_Schemas/2.01%3A_Introduction_to_Species_Counterpoint"]
  ghi_chu: "OMT 2.1: quãng 4 đúng nghịch khi liên quan bè thấp nhất."
