- trang: nhac-ly/20-doc-tong-pho
  id: n1
  cau: Tổng phổ (full score) là bản nhạc ghi mọi bè của dàn nhạc, xếp chồng lên nhau, để nhạc trưởng nhìn thấy toàn bộ.
  loai: dinh-nghia
- trang: nhac-ly/20-doc-tong-pho
  id: n2
  cau: 'Thứ tự các bè từ trên xuống: bộ gỗ, bộ đồng, bộ gõ (timpani và gõ khác), đàn hạc/piano/celesta, độc tấu và hợp xướng, bộ dây ở dưới cùng.'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n3
  cau: Trong mỗi bộ, các bè thường xếp từ cao xuống thấp.
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n4
  cau: 'Bảng: bộ gỗ gồm Sáo (Fl., Picc.), Oboe (Ob.), Clarinet (Cl., Kl.), Bassoon (Fg., Bsn.).'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n5
  cau: 'Bảng: bộ đồng gồm Horn (Hn., Cor.), Trumpet (Tpt., Tr.), Trombone (Tbn., Pos.), Tuba.'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n6
  cau: 'Bảng: timpani viết tắt Timp., Pk. (Pauken trong tiếng Đức); đàn hạc Hp.; piano Pno.'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n7
  cau: 'Bảng: bộ dây gồm Violin I, Violin II (Vn., Vln.), Viola (Vla., Br.), Cello (Vc.), Contrabass (Cb., Kb.).'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n8
  cau: Viết tắt có thể bằng tiếng Ý, Đức hoặc Pháp tùy nhà xuất bản; Pauken là timpani trong tiếng Đức, Bratsche là viola.
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n9
  cau: Bè viola dùng khóa Đô alto; clarinet, horn, trumpet có thể là nhạc cụ dịch giọng, nên hóa biểu khác các bè khác.
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n11
  cau: 'Thứ tự trên sân khấu, từ trước ra sau: bộ dây, bộ gỗ, bộ đồng, bộ gõ; trong tổng phổ gỗ ở trên cùng, dây ở dưới cùng.'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n12
  cau: 'Hình seating: dây (violin 1, violin 2, viola, cello, contrabass) ở phía trước gần nhạc trưởng, gỗ ở giữa, đồng phía sau, bộ gõ (timpani) sau cùng.'
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n13
  cau: 'Chú thích hình: "Một cách xếp chỗ thường gặp; mỗi dàn nhạc có thể bố trí khác (ví dụ violin 2 ngồi bên phải)."'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n16
  cau: 'Bảng cấp độ: 1 sonata piano (Mozart, Beethoven), chỉ 2 khuông.'
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n17
  cau: 'Bảng cấp độ: 2 tứ tấu đàn dây của Haydn, 4 khuông.'
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n18
  cau: 'Bảng cấp độ: 3 Haydn Giao hưởng số 94 chương 2, dàn nhạc nhỏ, giai điệu rõ.'
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n19
  cau: 'Bảng cấp độ: 4 Mozart Giao hưởng số 40, hình thức sonata rõ ràng.'
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n20
  cau: 'Bảng cấp độ: 5 Beethoven Giao hưởng số 5, dàn nhạc đầy đủ hơn, nhiều bè hoạt động.'
  loai: cap-do
- trang: nhac-ly/20-doc-tong-pho
  id: n22
  cau: IMSLP có tổng phổ miễn phí của các tác phẩm thuộc phạm vi công cộng; tìm tên tác phẩm, chọn mục "Full Scores".
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n24
  cau: Tổng phổ khổ nhỏ (study score) của các nhà xuất bản như Bärenreiter, Henle, Eulenburg.
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n25
  cau: Khung 4 bè rút gọn (2 violin, viola, cello) của vòng hợp âm Canon (bài 12); bè viola khóa Đô alto.
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n28
  cau: 'Bài tập 3: tìm chỗ kèn horn giới thiệu chủ đề 2 trong chương 1 Giao hưởng số 5 của Beethoven.'
  loai: cau-truc
- trang: nhac-ly/20-doc-tong-pho
  id: n29
  cau: 'Câu hỏi: bộ gỗ nằm trên cùng của tổng phổ.'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n31
  cau: 'Câu hỏi: hóa biểu của clarinet khác vì là nhạc cụ dịch giọng; giải thích "Âm thanh thật vẫn cùng giọng với cả dàn nhạc".'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n32
  cau: 'Câu hỏi: bè viola thường dùng khóa Đô alto; giải thích "Đô giữa ở dòng 3".'
  loai: quy-tac
- trang: nhac-ly/20-doc-tong-pho
  id: n14
  cau: 'Cách theo dõi: bám vào bè violin I (dòng đầu của bộ dây), phần lớn thời gian giai điệu chính ở đây.'
  loai: khuyen-tap
- trang: nhac-ly/20-doc-tong-pho
  id: n23
  cau: 'Video "score" trên các trang chia sẻ video: tìm tên tác phẩm kèm chữ score; tổng phổ chạy theo âm thanh.'
  loai: khuyen-tap
- trang: nhac-ly/20-doc-tong-pho
  id: n27
  cau: 'Bài tập 1: mở tổng phổ Giao hưởng số 5 của Beethoven trên IMSLP; trang đầu có những nhạc cụ nào?'
  loai: khuyen-tap
- trang: nhac-ly/21-hoa-am-bon-be
  id: n2
  cau: Bach viết hàng trăm bài thánh ca (chorale) bốn bè.
  loai: lich-su
- trang: nhac-ly/21-hoa-am-bon-be
  id: n3
  cau: Viết bốn bè là bài tập nền tảng của mọi khóa học sáng tác.
  loai: lich-su
- trang: nhac-ly/21-hoa-am-bon-be
  id: n4
  cau: Bốn bè của hợp âm là soprano (S, cao nhất), alto (A), tenor (T), bass (B, thấp nhất).
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n5
  cau: 'Giọng hát của bốn bè: soprano nữ cao, alto nữ trầm, tenor nam cao, bass nam trầm.'
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n6
  cau: 'Âm vực thường dùng: soprano Đô4 – Sol5, alto Sol3 – Rê5, tenor Đô3 – Sol4.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n7
  cau: 'Âm vực thường dùng của bass: Fa2 – Rê4.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n8
  cau: 'Hình ranges-satb: thanh âm vực soprano Đô4–Sol5, alto Sol3–Rê5, tenor Đô3–Sol4, bass Fa2–Rê4; chú thích ghi đúng bốn âm vực ấy.'
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n9
  cau: 'Khuông của bốn bè: soprano và alto khóa Sol; tenor và bass khóa Fa; đuôi nốt soprano và tenor hướng lên, alto và bass hướng xuống.'
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n10
  cau: Hợp âm ba có 3 nốt mà có 4 bè, nên phải nhân đôi một nốt.
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n11
  cau: Bè bass chơi nốt quyết định thể (thể gốc, thể đảo) của hợp âm.
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n12
  cau: Với hợp âm ba thể gốc, thường nhân đôi nốt gốc.
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n13
  cau: Không bao giờ nhân đôi cảm âm (bậc 7).
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n14
  cau: 'Lý do không nhân đôi cảm âm: nó phải đi lên chủ âm, nhân đôi sẽ sinh quãng 8 song song.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n15
  cau: 'Khoảng cách: soprano–alto và alto–tenor không quá một quãng 8; tenor–bass có thể xa hơn.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n16
  cau: Các bè không bắt chéo nhau (alto không cao hơn soprano, ...).
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n17
  cau: 'Dẫn bè, quy tắc 1: giữ nốt chung giữa hai hợp âm ở cùng một bè, nếu có.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n18
  cau: 'Dẫn bè, quy tắc 2: các bè trên đi bước liền hoặc bước nhảy nhỏ; bè bass được nhảy.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n19
  cau: 'Dẫn bè, quy tắc 3: cấm quãng 5 và quãng 8 song song: hai bè đang cách nhau quãng 5 (hoặc 8) không được cùng chuyển sang một quãng 5 (hoặc 8) khác.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n20
  cau: Quãng 5 và 8 song song làm hai bè "dính" vào nhau, mất tính độc lập.
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n21
  cau: 'Dẫn bè, quy tắc 4: cảm âm đi lên chủ âm; nốt 7 của hợp âm bảy đi xuống bước liền.'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n22
  cau: Ưu tiên chuyển động ngược (một bè lên, bè kia xuống) giữa bè ngoài cùng (soprano và bass).
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n23
  cau: 'Hình voice-leading (hình 1): bốn bè I – IV – V – I ở Đô trưởng: soprano Đô – Đô – Si – Đô, alto Mi – Fa – Rê – Mi, tenor Sol – La – Sol – Sol, bass Đô – Fa – Sol – Đô.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n24
  cau: 'Hình voice-leading (hình 1): đường bass đi từ Đô xuống Fa (quãng 5), lên Sol (bước liền), rồi lên Đô.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n25
  cau: 'Chú thích hình 1: "Mỗi đường là một bè (S soprano, A alto, T tenor, B bass). Dẫn bè tốt: các đường đi gần, ít nhảy; nốt chung được giữ nguyên."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n26
  cau: 'Hình voice-leading (hình 2): Đô – Sol – Mi – Đô (bass, tenor, alto, soprano) của hợp âm C chuyển song song sang Rê – La – Fa – Rê của hợp âm Dm; bass–tenor cách quãng 5 trước và sau, bass–soprano cách quãng 8 trước và sau.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n27
  cau: 'Chú thích hình 2: "Lỗi cần tránh (vạch đỏ): bass–tenor đi quãng 5 song song, bass–soprano đi quãng 8 song song. Cả bốn bè cùng đi lên cũng làm mất tính độc lập."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n28
  cau: 'Khuông I – IV – V – I ở Đô trưởng: [Ec] [Fc] [DB] [Ec] (soprano, alto) và [C,G,] [F,,A,] [G,,G,] [C,G,] (tenor, bass), đúng dẫn bè.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n29
  cau: 'Đọc từ dưới lên ở mỗi hợp âm: bass – tenor (khuông dưới), alto – soprano (khuông trên).'
  loai: dinh-nghia
- trang: nhac-ly/21-hoa-am-bon-be
  id: n30
  cau: 'I → IV: soprano giữ Đô (nốt chung); alto và tenor đi lên bước liền, bass nhảy xuống quãng 5 tới Fa.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n31
  cau: 'IV → V: bass đi lên bước liền (Fa → Sol), ba bè trên đi xuống ngược chiều; không có quãng song song cấm.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n32
  cau: 'V → I: cảm âm Si đi lên Đô ở soprano; tenor giữ Sol (nốt chung).'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n33
  cau: 'Khuông "Sai: quãng 5 song song (Đô–Sol rồi Rê–La)": [C,G,] [D,A,] ở khuông khóa Fa.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n34
  cau: 'Bài tập 1: viết I – V – I ở Sol trưởng cho bốn bè (bass: Sol – Rê – Sol).'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n36
  cau: 'Bài tập 3: lấy một bài thánh ca của Bach trong IMSLP (tìm "371 Chorales"), chọn 4 ô nhịp và gọi tên từng hợp âm.'
  loai: so-lieu
- trang: nhac-ly/21-hoa-am-bon-be
  id: n37
  cau: 'Câu hỏi 1: với hợp âm ba thể gốc, nên nhân đôi nốt gốc; giải thích: "Nhân đôi nốt gốc cho âm thanh vững nhất."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n38
  cau: 'Câu hỏi 2: không nhân đôi cảm âm vì nó phải đi lên chủ âm, nhân đôi sẽ gây quãng 8 song song; giải thích: "Cả hai bè sẽ cùng đi lên chủ âm."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n39
  cau: 'Câu hỏi 3: khoảng cách giữa tenor và bass được phép lớn hơn một quãng 8; giải thích: "Các bè trên giữ gần nhau."'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n40
  cau: 'Câu hỏi 4: trong V7 → I, nốt 7 của hợp âm bảy đi xuống bước liền (Fa xuống Mi trong G7 → C).'
  loai: quy-tac
- trang: nhac-ly/21-hoa-am-bon-be
  id: n35
  cau: 'Bài tập 2: viết I – vi – IV – V – I ở Đô trưởng; kiểm tra từng cặp bè xem có quãng 5 hoặc 8 song song không.'
  loai: khuyen-tap
- trang: nhac-ly/22-doi-am
  id: n1
  cau: Đối âm (counterpoint) là nghệ thuật viết nhiều giai điệu độc lập cùng lúc mà vẫn hòa hợp.
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n2
  cau: Hòa âm bốn bè nghĩ theo chiều dọc (hợp âm); đối âm nghĩ theo chiều ngang (từng giai điệu).
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n3
  cau: Đối âm là ngôn ngữ của nhạc Phục hưng và của fugue.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n7
  cau: Năm 1725, nhà soạn nhạc Áo Johann Joseph Fux xuất bản Gradus ad Parnassum.
  loai: ten
- trang: nhac-ly/22-doi-am
  id: n8
  cau: Gradus ad Parnassum là giáo trình đối âm viết dưới dạng đối thoại thầy trò.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n9
  cau: Haydn, Mozart, Beethoven đều học từ Gradus ad Parnassum.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n10
  cau: Đến nay Gradus ad Parnassum vẫn được dùng.
  loai: lich-su
- trang: nhac-ly/22-doi-am
  id: n11
  cau: 'Phương pháp của Fux: cho sẵn một giai điệu chậm, nốt tròn, gọi là cantus firmus (CF), rồi viết thêm một bè, tăng dần độ phức tạp qua năm loại (species).'
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n12
  cau: 'Loại 1: một nốt chống một nốt; chỉ dùng quãng thuận; học chuyển động giữa hai bè.'
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n13
  cau: 'Loại 2: hai nốt chống một; nốt lướt nghịch tai ở phách yếu.'
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n14
  cau: 'Loại 3: bốn nốt chống một; giai điệu linh hoạt, nốt thêu, nốt lướt.'
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n15
  cau: 'Loại 4: nốt lệch phách, nối qua vạch nhịp; học nốt treo.'
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n16
  cau: 'Loại 5: tự do (florid), kết hợp tất cả; giai điệu như một bè thật.'
  loai: dinh-nghia
- trang: nhac-ly/22-doi-am
  id: n17
  cau: 'Quy tắc loại 1, điều 1: chỉ dùng quãng thuận 1, 3, 5, 6, 8 (trưởng, thứ hoặc đúng); quãng 4 tính là nghịch khi đứng trên bè dưới.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n18
  cau: 'Quy tắc loại 1, điều 2: bắt đầu bằng quãng đúng (1, 5 hoặc 8; nếu bè đối âm nằm dưới thì chỉ 1 hoặc 8) và kết thúc bằng quãng 8 hoặc đồng âm.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n19
  cau: 'Quy tắc loại 1, điều 3: cấm quãng 5 và 8 song song; tránh đi tới quãng đúng bằng chuyển động cùng chiều.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n20
  cau: 'Quy tắc loại 1, điều 4: ưu tiên chuyển động ngược và quãng 3, quãng 6, nhưng không quá ba quãng 3 liên tiếp, hay ba quãng 6 liên tiếp.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n21
  cau: 'Quy tắc loại 1, điều 5: giai điệu chủ yếu đi bước liền; bước nhảy lớn nên đổi hướng ngay sau đó.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n22
  cau: 'Quy tắc loại 1, điều 6: gần cuối nâng cảm âm để tạo kết; ở điệu Dorian trên Rê, Đô thành Đô♯.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n23
  cau: 'Cantus firmus của ví dụ là giai điệu ở điệu Dorian trên Rê mà Fux dùng trong sách: Rê Fa Mi Rê Sol Fa La Sol Fa Mi Rê.'
  loai: ten
- trang: nhac-ly/22-doi-am
  id: n25
  cau: 'Quãng giữa hai bè của ví dụ, từ trái sang phải: 5 – 6 – 6 – 8 – 3 – 6 – 3 – 6 – 6 – 6 – 8.'
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n26
  cau: 'Ví dụ: quãng đúng ở đầu và cuối, giữa bài chủ yếu là quãng 3 và 6, và các quãng 8 đều được đến bằng chuyển động ngược.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n27
  cau: 'Hình counterpoint: bè đối âm (đỏ) La – Rê – Đô – Rê – Si – Rê – Đô – Mi – Rê – Đô♯ – Rê trên CF (xanh) Rê – Fa – Mi – Rê – Sol – Fa – La – Sol – Fa – Mi – Rê.'
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n28
  cau: 'Hình counterpoint: số quãng giữa hai bè: 5, 6, 6, 8, 3, 6, 3, 6, 6, 6, 8; quãng đúng (5, 8, 8) tô vàng.'
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n29
  cau: 'Hình counterpoint, hàng dưới: kiểu chuyển động giữa hai nốt liền: cùng chiều, cùng chiều, ngược, ngược, ngược, ngược, ngược, cùng chiều, cùng chiều, ngược.'
  loai: so-lieu
- trang: nhac-ly/22-doi-am
  id: n30
  cau: 'Chú thích hình counterpoint: "Số giữa hai bè: quãng (vàng = quãng đúng, chỉ ở đầu, cuối và khi đến bằng chuyển động ngược). Hàng dưới: kiểu chuyển động; chuyển động ngược (xanh lá) chiếm phần lớn."'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n31
  cau: 'Bài tập 1: viết một bè đối âm loại 1 dưới cantus firmus trên (bè dưới bắt đầu bằng Rê, quãng 8 hoặc đồng âm).'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n32
  cau: 'Bài tập 2: đối âm loại 2 (hai nốt trắng chống một nốt tròn); nốt ở phách yếu có thể nghịch nếu là nốt lướt.'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n34
  cau: 'Câu hỏi 1: trong đối âm loại 1, quãng 4 được tính là nghịch so với bè dưới; giải thích: "Quãng 4 nghịch khi bè dưới là nền."'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n35
  cau: 'Câu hỏi 2: đối âm loại 4 dạy về nốt treo; giải thích: "Nốt lệch phách, nối qua vạch nhịp, rồi giải quyết xuống."'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n36
  cau: 'Câu hỏi 3: Johann Joseph Fux viết Gradus ad Parnassum (1725); giải thích: "Giáo trình đối âm kinh điển."'
  loai: ten
- trang: nhac-ly/22-doi-am
  id: n37
  cau: 'Câu hỏi 4: đối âm loại 1 bắt đầu bằng quãng 1, 5 hoặc 8 và kết thúc bằng quãng 8 hoặc đồng âm (đáp án "Quãng đúng").'
  loai: quy-tac
- trang: nhac-ly/22-doi-am
  id: n33
  cau: 'Bài tập 3: hát một bè trong khi chơi bè kia trên bàn phím piano (/opus/luyen-tap/ban-phim/).'
  loai: khuyen-tap
- trang: nhac-ly/23-hop-am-muon
  id: n1
  cau: Nhà soạn nhạc thường mượn hợp âm từ giọng thứ cùng tên để tạo màu sắc cho bản nhạc ở giọng trưởng (ví dụ mượn từ Đô thứ cho bản ở Đô trưởng).
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n2
  cau: Kỹ thuật này gọi là hòa âm hỗn hợp (modal mixture).
  loai: ten
- trang: nhac-ly/23-hop-am-muon
  id: n3
  cau: Hòa âm hỗn hợp rất đặc trưng của Schubert, Brahms, và cả nhạc phim, nhạc pop ngày nay.
  loai: lich-su
- trang: nhac-ly/23-hop-am-muon
  id: n4
  cau: 'Hợp âm mượn trong Đô trưởng: Fa thứ, ký hiệu iv, mượn từ iv của Đô thứ, nốt mượn La♭.'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n5
  cau: 'Hợp âm mượn trong Đô trưởng: Rê giảm, ký hiệu ii°, mượn từ ii° của Đô thứ, nốt mượn La♭.'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n6
  cau: 'Hợp âm mượn trong Đô trưởng: La♭ trưởng, ký hiệu ♭VI, mượn từ VI của Đô thứ, nốt mượn La♭ và Mi♭.'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n7
  cau: 'Hợp âm mượn trong Đô trưởng: Si♭ trưởng, ký hiệu ♭VII, mượn từ VII của Đô thứ, nốt mượn Si♭.'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n8
  cau: 'Hợp âm mượn trong Đô trưởng: Mi♭ trưởng, ký hiệu ♭III, mượn từ III của Đô thứ, nốt mượn Mi♭ và Si♭.'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n9
  cau: Dấu ♭ trước số La Mã nghĩa là nốt gốc của hợp âm bị hạ nửa cung so với gam trưởng.
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n10
  cau: 'IV – iv – I là kết plagal: hợp âm hạ át (IV, rồi iv) đứng trước hợp âm chủ.'
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n11
  cau: Ở I – IV – iv – I, nốt La đi xuống La♭ rồi về Sol.
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n12
  cau: 'Khuông "I – IV – iv – I trong Đô trưởng": [C,EGc] [F,FAc] [F,F_Ac] [C,EGc].'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n13
  cau: '♭VI – ♭VII – I: hai hợp âm mượn liên tiếp, rồi về chủ âm.'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n14
  cau: 'Khuông "I – ♭VI – ♭VII – I": [C,EGc] [_A,,_E_Ac] [_B,,DF_B] [C,EGc].'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n15
  cau: 'Bản nhạc ở giọng thứ có thể kết thúc bằng hợp âm trưởng của chủ âm: đó là quãng 3 Picardy.'
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n17
  cau: Hợp âm V trong giọng thứ vốn đã dùng cảm âm được nâng (nốt này trùng với bậc 7 của giọng trưởng cùng tên).
  loai: quy-tac
- trang: nhac-ly/23-hop-am-muon
  id: n19
  cau: 'Nghe trong tác phẩm thật: Saint-Saëns, opera Samson et Dalila, màn II, aria "Mon cœur s''ouvre à ta voix": hợp âm ii bán giảm mượn nốt ♭6 từ giọng thứ cùng tên.'
  loai: ten
- trang: nhac-ly/23-hop-am-muon
  id: n20
  cau: 'Nghe trong tác phẩm thật: Schubert nổi tiếng với những chỗ chuyển đột ngột giữa trưởng và thứ trên cùng một chủ âm; nghe chương 2 Ngũ tấu đàn dây cung Đô trưởng, D. 956.'
  loai: lich-su
- trang: nhac-ly/23-hop-am-muon
  id: n21
  cau: 'Nghe trong tác phẩm thật: Catalani, opera La Wally, màn I, aria "Ebben? Ne andrò lontana": một đoạn nhạc mở đầu ở Mi trưởng rồi chuyển sang Mi thứ trên cùng chủ âm Mi.'
  loai: ten
- trang: nhac-ly/23-hop-am-muon
  id: n22
  cau: Chuỗi ♭VI – ♭VII – I xuất hiện ở rất nhiều đoạn kết hùng tráng trong nhạc phim và nhạc rock.
  loai: lich-su
- trang: nhac-ly/23-hop-am-muon
  id: n23
  cau: 'Bài tập 1: viết hợp âm iv, ♭VI và ♭VII trong Sol trưởng; đáp án: iv = Đô thứ (Đô – Mi♭ – Sol); ♭VI = Mi♭ trưởng (Mi♭ – Sol – Si♭); ♭VII = Fa trưởng (Fa – La – Đô).'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n24
  cau: 'Bài tập 2: viết I – iv – V – I trong Rê trưởng (iv của Rê trưởng là Sol thứ); đáp án: D – Gm – A – D.'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n26
  cau: 'Câu hỏi 1: iv trong Đô trưởng là Fa thứ; giải thích: "Mượn từ Đô thứ: Fa – La♭ – Đô."'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n27
  cau: 'Câu hỏi 2: ♭VII trong Đô trưởng là Si♭ trưởng; giải thích: "Nốt gốc Si bị hạ thành Si♭."'
  loai: so-lieu
- trang: nhac-ly/23-hop-am-muon
  id: n28
  cau: 'Câu hỏi 3: hòa âm hỗn hợp nghĩa là mượn hợp âm từ giọng thứ (hoặc trưởng) cùng tên; giải thích: "Ví dụ dùng iv trong giọng trưởng."'
  loai: dinh-nghia
- trang: nhac-ly/23-hop-am-muon
  id: n25
  cau: 'Bài tập 3: nghe một bài hát pop bạn thích và tìm xem có hợp âm nào "lạ" so với giọng của bài không.'
  loai: khuyen-tap
