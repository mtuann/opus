- trang: nhac-ly/09-quang
  id: n30
  cau: Thời trung đại, tritone thường bị tránh; có câu mi contra fa diabolus est in musica ("mi đối với fa là quỷ dữ trong âm nhạc") nói về quãng này.
  loai: lich-su
- trang: nhac-ly/11-hop-am-bay
  id: n18
  cau: Hợp âm bảy át được xây trên bậc 5.
  loai: dinh-nghia
- trang: nhac-ly/11-hop-am-bay
  id: n33
  cau: Hợp âm bảy át được xây trên bậc 5 (ví dụ G7 trong Đô trưởng).
  loai: dinh-nghia
- trang: nhac-ly/13-ket
  id: n23
  cau: Bạn sẽ gặp cấu trúc câu hỏi – câu trả lời thường xuyên trong nhạc cổ điển phương Tây.
  loai: so-lieu
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n47
  cau: 'Răng cưa ngắn, không gạch: láy trên (upper mordent), nốt chính – nốt trên – nốt chính, rất nhanh.'
  loai: dinh-nghia
- trang: nhac-ly/14-ky-hieu-bieu-dien
  id: n39
  cau: 'Dấu nhắc lại (vạch kép có hai chấm, ở đầu và cuối đoạn): nhắc lại đoạn giữa hai dấu.'
  loai: dinh-nghia
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n20
  cau: 'Trên vòng quãng năm, các giọng gần nằm sát Đô trưởng: Fa trưởng và Sol trưởng ở hai bên Đô trưởng, Rê thứ và Mi thứ ở hai bên La thứ.'
  loai: quy-tac
- trang: nhac-ly/19-at-phu-chuyen-giong
  id: n30
  cau: 'Mô tả hình (aria-label): "Năm giọng gần của Đô trưởng: Sol trưởng và Fa trưởng (hai bên Đô trưởng trên vòng quãng năm) cùng ba giọng thứ song song La thứ, Mi thứ, Rê thứ".'
  loai: so-lieu
- trang: nhac-ly/20-doc-tong-pho
  id: n4
  cau: 'Bảng: bộ gỗ gồm Sáo (Fl.), Oboe (Ob.), Clarinet (Cl.), Bassoon (Bsn.).'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n5
  cau: 'Bảng: bộ đồng gồm Horn (Hn.), Trumpet (Tpt.), Trombone (Trb.), Tuba.'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n6
  cau: 'Bảng: timpani viết tắt Timp., các nhạc cụ gõ khác Perc.; đàn hạc, piano, celesta không ghi viết tắt.'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n7
  cau: 'Bảng: bộ dây gồm Violin I, Violin II (Vln.), Viola (Vla.), Cello (Vcl.), Contrabass (DB).'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n8
  cau: 'Tổng phổ có thể ghi tên nhạc cụ bằng tiếng Ý, Đức hay Pháp; ví dụ tên tiếng Đức: Fagott (bassoon), Posaune (trombone), Pauken (timpani), Bratsche (viola), Kontrabass (contrabass).'
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n24
  cau: Tổng phổ khổ nhỏ (study score) của các nhà xuất bản như Henle, Eulenburg.
  loai: danh-muc
- trang: nhac-ly/20-doc-tong-pho
  id: n28
  cau: 'Bài tập 3: tìm chỗ kèn horn dẫn vào chủ đề 2 trong chương 1 Giao hưởng số 5 của Beethoven.'
  loai: cau-truc
- trang: nhac-ly/24-napoli-sau-tang
  id: n3
  cau: 'Cả hai đều có chức năng hạ át (predominant): chúng đứng ngay trước hợp âm V.'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n31
  cau: 'Câu hỏi 4: chức năng của N6 và +6 là hạ át, đứng trước V; giải thích: "Chúng làm hợp âm V thêm căng thẳng."'
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n24
  cau: Nhiều nghệ sĩ harpsichord, organ, lute trong nhóm nhạc Baroque vẫn ứng tác hợp âm từ bè trầm số khi biểu diễn.
  loai: lich-su
- trang: nhac-ly/26-phan-tich
  id: n3
  cau: 'Bước 2: xác định giọng chính (nhìn hóa biểu, nốt đầu và nốt kết thúc), số chỉ nhịp, tốc độ, biên chế'
  loai: quy-tac
- trang: nhac-ly/26-phan-tich
  id: n26
  cau: Schumann, Träumerei (Kinderszenen Op. 15 số 7) có át phụ, nên dùng được để tập tìm át phụ.
  loai: cau-truc
- trang: nhac-ly/27-ky-hieu-hop-am
  id: n23
  cau: ii-V-I là nền tảng của hòa âm jazz và là kết trọn có hợp âm hạ át (ii) đứng trước V trong nhạc cổ điển
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n10
  cau: Bè trầm Đô – Fa – Si – Mi – La – Rê – Sol – Đô cứ lên quãng 4 rồi xuống quãng 5 xen kẽ (riêng Fa xuống Si là quãng 5 giảm).
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n17
  cau: Bè trầm của Canon Pachelbel đi bậc 1–5–6–3–4–1–4–5; bốn nốt đầu là dạng bè trầm nhảy (xuống 4, lên một bậc) của mẫu Romanesca, còn dạng galant về sau đi 1–7–6–3.
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n34
  cau: 'Câu hỏi 3: "Chuỗi là một đặc điểm dễ nhận ra của giai điệu thời kỳ nào?" Đáp án: Baroque (giải thích: giai điệu Baroque dùng chuỗi rất thường xuyên, như chủ đề chương 1 Brandenburg số 5 của Bach).'
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n20
  cau: 'Hình thức ba đoạn (ternary) là A B A: ba đoạn tách biệt, đoạn A trở lại sau đoạn B.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n21
  cau: Trong ba đoạn, B tương phản rõ với A (thường ở giọng khác, tính chất khác); B là một thế giới riêng, không chỉ là đoạn chuyển tiếp.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n23
  cau: Mazurka La thứ Op. 17 số 4 của Chopin ở hình thức ba đoạn.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n28
  cau: Đoạn A kết ở giọng chính với dấu fermata; dấu ấy là chỗ dừng khi chơi lại từ đầu (da capo), nên bài thành A B A.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n54
  cau: 'Hình form-small, sơ đồ 3 (ba đoạn): A (đoạn đầu), B (tương phản rõ), A (trở lại); chú thích "Ba đoạn: A trở lại sau một đoạn B tương phản."'
  loai: cau-truc
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n14
  cau: Gam bát cung xuất hiện trong nhạc của Stravinsky.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n19
  cau: 'Ví dụ hợp âm quãng 4: Schoenberg, Giao hưởng thính phòng số 1, Op. 9.'
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n20
  cau: Trong jazz, Bill Evans dùng nhiều thế bấm quãng 4 ở So What.
  loai: lich-su
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n23
  cau: 'Một hợp âm rất nổi tiếng thuộc loại này nằm ở đoạn Les Augures printaniers – Danses des adolescentes trong Le Sacre du printemps: Mi♭7 chồng lên Fa♭ trưởng (nghe như Mi trưởng).'
  loai: nam
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n39
  cau: 'Lệch pha (phasing): hai người chơi cùng một mẫu, một người tăng tốc rất từ từ, nên hai mẫu dần lệch nhau.'
  loai: dinh-nghia
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n46
  cau: 'Bài tập 3: Spiegel im Spiegel của Pärt và nhạc tối giản có điểm chung: âm nhạc biến đổi rất chậm.'
  loai: lich-su
- trang: luyen-tai/nghe-gam
  id: n11
  cau: Trong ba dạng gam thứ (đi lên), chỉ thứ hòa âm có quãng 2 tăng (Fa–Sol♯, 3 nửa cung) giữa bậc 6 và 7.
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n20
  cau: 'Lydian nghe trưởng, còn sáng hơn gam trưởng: theo Open Music Theory, đó là điệu thức sáng nhất.'
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n24
  cau: Locrian tối nhất; hợp âm ba trên chủ âm của nó là hợp âm giảm.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n28
  cau: Gam ngũ cung thường gặp (như Đô – Rê – Mi – Sol – La) chỉ có 5 nốt và không có nửa cung.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n41
  cau: 'Quiz: gam ngũ cung thường gặp (Đô – Rê – Mi – Sol – La) khác gam trưởng ở chỗ không có nửa cung; giữa các nốt liền nhau chỉ có quãng 2 trưởng và quãng 3 thứ.'
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n27
  cau: Thứ bảy nghe buồn, màu jazz.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n32
  cau: 'Hợp âm giảm bảy nghe rất căng, "đáng sợ" (Open Music Theory: "very scary").'
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n33
  cau: Hợp âm giảm bảy có thể làm hợp âm bản lề khi chuyển giọng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n20
  cau: Syncopation làm lệch chỗ nhấn đều đặn của nhịp.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tiet-tau
  id: n27
  cau: 'Quiz: syncopation là nốt nhấn rơi vào phách yếu hoặc vào "và", làm lệch chỗ nhấn đều đặn của nhịp.'
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n14
  cau: I6/4 – V trong I – IV – I6/4 – V – I là cách trang trí thường gặp của hợp âm V ở kết.
  loai: dinh-nghia
- trang: luyen-tai/index
  id: n25
  cau: '4 đúng: Here Comes the Bride.'
  loai: so-lieu
- trang: luyen-tai/index
  id: n27
  cau: Twinkle Twinkle Little Star dùng chung giai điệu với Ah! vous dirai-je, maman (giai điệu Mozart dùng trong K. 265).
  loai: lich-su
- trang: nhac-ly/am-hoc
  id: n40
  cau: Đàn bầu của Việt Nam chỉ có một dây, không có phím bấm, và được chơi bằng bồi âm; người chơi uốn vòi đàn để dây căng hay chùng, đổi cao độ lên xuống.
  loai: quy-tac
- trang: nhac-ly/am-hoc
  id: n47
  cau: Bình quân luật (Das Wohltemperierte Klavier) của Bach thường được cho là viết cho kiểu lên dây well temperament; hệ chính xác Bach dùng thì đã có nhiều đề xuất khác nhau.
  loai: lich-su
- trang: du-lieu/thuat-ngu/grave
  id: n2
  cau: Grave chậm hơn Largo.
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/con-sordino
  id: n2
  cau: 'con sordino: với đàn dây và kèn đồng; âm thanh nhỏ hơn.'
  loai: dinh-nghia
- trang: du-lieu/thuat-ngu/string-quartet
  id: n2
  cau: string quartet gồm 2 violin, viola, cello.
  loai: dinh-nghia
- trang: nhac-ly/26-phan-tich
  id: n6
  cau: 'Bước 5: ghi số La Mã dưới bè trầm ở đầu, cuối mỗi phần và các kết'
  loai: khuyen-tap
