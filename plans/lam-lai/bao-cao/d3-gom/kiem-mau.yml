- trang: nhac-ly/29-chuoi-hoa-am
  id: n17
  cau: Bè trầm của Canon Pachelbel đi bậc 1–5–6–3–4–1–4–5; bốn nốt đầu là dạng bè trầm nhảy (xuống 4, lên một bậc) của mẫu Romanesca, còn dạng galant về sau đi 1–7–6–3.
  loai: cau-truc
  nguon:
    - ten: Robert Gjerdingen, Music in the Galant Style (2007), chương 2 (bản trích của UC Irvine)
      link: https://music.arts.uci.edu/abauer/5.2/readings/Gjerdingen%20_Music_in_the_Galant_Style_Ch_2.pdf
    - ten: Wikipedia, Pachelbel Canon (bậc 3, chỉ để tìm nguồn)
      link: https://en.wikipedia.org/wiki/Pachelbel%27s_Canon
    - ten: Wikipedia, Romanesca (bậc 3, chỉ để tìm nguồn)
      link: https://en.wikipedia.org/wiki/Romanesca
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "bè trầm đi bậc 1–5–6–3, gần với bè trầm 1–7–6–3 của mẫu Romanesca, chỉ khác nốt thứ hai nhảy xuống quãng 4 thay vì đi một bậc". Chữ mới: "bè trầm đi bậc 1–5–6–3–4–1–4–5, mở đầu bằng công thức bè trầm Romanesca". Lý do: Gjerdingen (chương 2, bản trích): bè trầm Romanesca được gọi theo "prima di tono, quinta di tono, sesta di tono" (bậc 1, 5, 6) và "Pachelbel Canon (ca. 1680) … first three-voice combination, in measure 5, presents an obvious Romanesca"; Wikipedia Romanesca: bè trầm III–VII–i–V (ở giọng trưởng song song: 1–5–6–3). Dạng 1–7–6–3 là mẫu Romanesca của phong cách galant (chỉ có Wikipedia, bậc 3, bảng Galant Schemata); chưa mở được nguồn bậc 2 cho dạng ấy, nên bỏ phép so sánh khỏi trang. Chữ "1–5–6–3–4–1–4–5": Wikipedia Pachelbel Canon, bảng tám hợp âm D A Bm F♯m G D G A. Review D3-gom: lượt 2 (khong-chac) không mở được nguồn bậc 2. Review mở lại Gjerdingen ch. 2 (gjerdingen2): bè trầm Romanesca được tả là "prima di tono, quinta di tono, sesta di tono" (bậc 1, 5, 6); dạng nhảy: "a bass that alternates descending leaps of a fourth with ascending steps of a second" (tr. 29); Canon của Pachelbel (tr. 27) là ví dụ; "the leaping variant (Pachelbel and Handel) is more characteristic of the seventeenth and very early eighteenth centuries", dạng đi bậc của cuối thế kỷ 18 (tr. 32); bè trầm galant: "The first three tones of the galant bass match the stepwise variant, while its third through fifth tones match the leaping variant" (tr. 33), tức 1–7–6–3. Thống nhất giữa các trang: bài 29 nói dạng nhảy 1–5–6–3; luyen-tai/nghe-tien-trinh ("Romanesca: Đô – Si – La – Mi") và trang mau-galant cũ (1–7–6–3) nói dạng galant. Để người đọc không thấy hai trang trái nhau, chữ cũ "…, mở đầu bằng công thức bè trầm Romanesca;" thành "…; bốn nốt đầu là dạng bè trầm nhảy (xuống 4, lên một bậc) của mẫu Romanesca, còn dạng galant về sau đi 1–7–6–3;". Mục Nguồn (Gjerdingen) thêm câu về hai dạng.'
- trang: luyen-tai/index
  id: n18
  cau: Cách nhanh nhất để nhớ một quãng là gắn nó với hai nốt liền nhau ở đầu một bài hát đã biết.
  loai: khuyen-tap
  nguon: []
  ket_qua_luot_1: khong-can-nguon
  ghi_chu: "Cũ: 'hai nốt mở đầu'; mới: 'hai nốt liền nhau ở đầu một bài hát' (đúng nghĩa cho quãng giai điệu)."
- trang: nhac-ly/30-phat-trien-motip
  id: n10
  cau: "Chuỗi: Beethoven cũng nhắc môtip ở nhiều cao độ khác nhau."
  loai: lich-su
  nguon:
    - ten: Eastman School of Music (University of Rochester), Beethoven Symphony No. 5
      link: https://www.esm.rochester.edu/beethoven/symphony-no-5/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "(Beethoven làm đúng như vậy ở ô nhịp 3–5)". Chữ mới: "(Beethoven cũng nhắc môtip ở nhiều cao độ khác nhau)". Lý do: không kiểm được "ô nhịp 3–5" và cao độ Fa Fa Fa Rê ở bản gốc (không mở được tổng phổ: Mutopia id 941 chỉ có zip và PDF không trích được nốt; Wikipedia, Violin Channel, Listen không nêu số ô hay cao độ lần nhắc). Rochester: "an obsessive repetition of the motif at different pitch levels". Điều cần review: xác nhận bằng tổng phổ rằng lần nhắc thứ hai là Fa Fa Fa Rê (chưa chắc, chưa có nguồn). Review D3-gom: chữ mới có trên trang (hàng Chuỗi); lượt 2 (Listen 8e) và Rochester cùng nói môtip trở lại ở các cao độ khác. Ví dụ "Fa Fa Fa Rê" là ví dụ của site cho kỹ thuật chuỗi (khối abc 2), câu không còn nói Beethoven viết đúng các nốt ấy ở ô nào.'
- trang: nhac-ly/29-chuoi-hoa-am
  id: n13
  cau: "Bảng: chuỗi quãng 5 đi xuống thường gặp trong nhạc tonal; nhạc jazz nối các vòng ii – V – I."
  loai: lich-su
  nguon:
    - ten: Open Music Theory, Diatonic Sequences in Middles (John Peterson)
      link: https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/
    - ten: Open Music Theory, Chromatic Sequences (Bryn Hughes)
      link: https://viva.pressbooks.pub/openmusictheory/chapter/chromatic-sequences/
    - ten: Open Music Theory, ii-V-I (Megan Lavengood)
      link: https://viva.pressbooks.pub/openmusictheory/chapter/ii-v-i/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Khắp nơi trong Baroque; nhạc jazz (vòng ii – V – I nối nhau)". Chữ mới: "Thường gặp trong nhạc tonal; nhạc jazz (vòng ii – V – I nối nhau)". Lý do: không có nguồn nói riêng chuỗi quãng 5 ở "khắp nơi trong Baroque"; OMT trình bày chuỗi quãng 5 là chuỗi diatonic cơ bản (ví dụ Albéniz), và (Chromatic Sequences) chuỗi quãng 5 có hợp âm át nối nhau dùng suốt thế kỷ 19. Jazz: OMT ii–V–I, "Ceora" của Lee Morgan "is entirely composed of ii–V–Is"; chuỗi ii–V–I ở nhiều giọng (như "Afternoon in Paris": Si♭ rồi La♭). Review D3-gom: chữ mới có trên bảng; lượt 2 đúng.'
- trang: luyen-tai/choi-bang-tai
  id: n34
  cau: "Thế Sol: ngón 1 tay phải trên Sol4; thế Fa: ngón 1 trên Fa4; bậc 1 ngón 1, bậc 3 ngón 3."
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: 'Bản cũ piano/nam-ngon.md: thế Đô, Sol, Fa; các thế dùng ngón 1 cho chủ âm. Review: đã kiểm ../opus-zero/docs/piano/nam-ngon.md mục 6 ("Chuyển giọng: cùng bài ở thế Sol và thế Fa"): ngón 1 trên chủ âm; khối abc 2, 3 của trang ghi !1! trên bậc 1, !3! trên bậc 3.'
- trang: nhac-ly/22-doi-am
  id: n29
  cau: "Hình counterpoint, hàng dưới: kiểu chuyển động giữa hai nốt liền: cùng chiều, cùng chiều, ngược, ngược, ngược, ngược, ngược, cùng chiều, cùng chiều, ngược."
  loai: so-lieu
  nguon:
    - ten: Open Music Theory, First-Species Counterpoint (Mark Gotham, Kris Shaffer)
      link: https://viva.pressbooks.pub/openmusictheory/chapter/first-species-counterpoint/
  ket_qua_luot_1: dung
  ghi_chu: "Kiểm từng cặp nốt liền: 1→2 CP lên, CF lên (cùng chiều); 2→3 xuống, xuống (cùng chiều); 3→4 lên, xuống (ngược); 4→5 xuống, lên (ngược); 5→6 lên, xuống (ngược); 6→7 xuống, lên (ngược); 7→8 lên, xuống (ngược); 8→9 xuống, xuống (cùng chiều); 9→10 xuống, xuống (cùng chiều); 10→11 lên, xuống (ngược). Khớp 10 nhãn của hình (7 ngược, 3 cùng chiều; không có chuyển động nghịch hay song song)."
