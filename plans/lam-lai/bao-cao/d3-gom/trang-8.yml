- trang: luyen-tai/choi-bang-tai
  id: n7
  cau: Chủ âm là nốt 'nhà' của giọng; Ode to Joy bắt đầu ở Mi, đếm ngược 3 – 2 – 1 từ Mi xuống Đô nên Mi là bậc 3.
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n10
  cau: 'Au clair de la lune (bài 1) bắt đầu ở Đô: ba nốt đứng yên, rồi đi lên liền bậc.'
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n11
  cau: 'Frère Jacques (bài 5) bắt đầu ở Đô: Đô – Rê – Mi – Đô; câu cuối nhảy xuống Sol rồi lên lại.'
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n12
  cau: Ah! vous dirai-je, maman (bài 2) bắt đầu ở Đô; có bước nhảy quãng 5 lên Sol ngay trong ô đầu.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n13
  cau: Hänschen klein (bài 4) bắt đầu ở Sol; nhảy quãng 3 xuống Mi.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n14
  cau: Amazing Grace (bài 6) bắt đầu ở Sol, thấp hơn Đô, nhịp lấy đà; nhảy quãng 4 lên Đô.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n15
  cau: Largo 'Going Home' (bài 8) bắt đầu ở Mi, nhảy quãng 3 lên Sol; nốt dài, nhịp chậm.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n18
  cau: Greensleeves là dân ca Anh, đã có một ballad cùng tên đăng ký ở London năm 1580.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n19
  cau: Nhiều bài dân ca Việt Nam xây trên thang năm âm, cùng cấu trúc khoảng cách với gam ngũ cung.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n20
  cau: Độ cao các âm trong thang năm âm của người Việt không cố định như trên phím đàn, nên giọng hát không chơi trọn được trên phím.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n24
  cau: Câu dừng lửng thường kết ở V; câu về nhà thường đi V rồi I.
  loai: quy-tac
- trang: luyen-tai/choi-bang-tai
  id: n26
  cau: 'Ví dụ 1 (soạn cho trang): ở ô 3 của lần đầu, Fa của giai điệu cọ vào Mi của hợp âm Đô, tai nghe ra ngay.'
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n30
  cau: Nhiều nhạc công nhạc phổ thông học nghề bằng cách chơi lại theo bản thu; Lucy Green đã đưa cách học ấy vào giờ học nhạc cụ, kể cả giờ học riêng một thầy một trò.
  loai: lich-su
- trang: luyen-tai/choi-bang-tai
  id: n31
  cau: 'Giai điệu là chuỗi bậc: câu đầu Ode to Joy là 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2 ở bất kỳ giọng nào.'
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n32
  cau: Dịch giọng là chơi cùng giai điệu từ một chủ âm khác; chuỗi bậc đặt lên chỗ khác của bàn phím.
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n35
  cau: Ở Fa trưởng bậc 4 là Si♭; ở Sol trưởng bậc 7 là Fa♯.
  loai: cau-truc
- trang: luyen-tai/choi-bang-tai
  id: n37
  cau: Ở thế Fa tay phải, ngón 4 rơi vào phím đen Si♭.
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n38
  cau: 'Ode to Joy ở Sol trưởng: giai điệu không có phím đen; hợp âm V7 của tay trái có Fa♯.'
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n39
  cau: 'Ode to Joy ở Fa trưởng: nốt thứ ba của giai điệu là Si♭.'
  loai: so-lieu
- trang: luyen-tai/choi-bang-tai
  id: n41
  cau: Audiation là khả năng nghe được âm nhạc khi nó không vang lên thật; thuật ngữ do Edwin E. Gordon đặt.
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n48
  cau: 'Quiz: ở Đô trưởng Ode to Joy bắt đầu bằng Mi, là bậc 3.'
  loai: dinh-nghia
- trang: luyen-tai/choi-bang-tai
  id: n49
  cau: 'Quiz: tay trái giữ Đô–Mi–Sol, giai điệu đến Fa nghe chói thì thử Fa (IV) hoặc Sol (V); Fa nằm trong IV (Fa–La–Đô) và V7 (Sol–Si–Rê–Fa).'
  loai: quy-tac
- trang: luyen-tai/choi-bang-tai
  id: n50
  cau: 'Quiz: Ode to Joy sang Fa trưởng, bậc 4 (Fa) trở thành Si♭, phím đen dưới ngón 4 ở thế Fa.'
  loai: quy-tac
- trang: luyen-tai/choi-bang-tai
  id: n5
  cau: 'Mục 1 (các bước): hát trước; định giọng; xác định nốt đầu so với chủ âm; tìm từng bước; nốt sai cho biết hướng sửa.'
  loai: khuyen-tap
- trang: luyen-tai/choi-bang-tai
  id: n27
  cau: 'Đến lượt bạn: đệm Amazing Grace bằng ba nốt trầm Đô, Fa, Sol mỗi ô một nốt, rồi so với tay trái bài 6.'
  loai: khuyen-tap
- trang: luyen-tai/choi-bang-tai
  id: n1
  cau: Chơi theo tai là tìm lại trên phím đàn một giai điệu bạn hát được, không cần bản nhạc, rồi đệm cho nó bằng vài hợp âm.
  loai: khuyen-tap
- trang: luyen-tai/nghe-gam
  id: n3
  cau: 'Phân biệt trưởng hay thứ chỉ cần một nốt: bậc 3.'
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n4
  cau: Bậc 3 cao (Mi trong giọng Đô) thì trưởng; bậc 3 thấp nửa cung (Mi♭) thì thứ.
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n5
  cau: Nốt chủ là nốt nghe như 'nhà', thường là nốt kết.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n7
  cau: 'Gam thứ có ba dạng: tự nhiên, hòa âm, giai điệu, khác nhau ở bậc 6 và 7 khi đi lên.'
  loai: danh-muc
- trang: luyen-tai/nghe-gam
  id: n8
  cau: 'Thứ tự nhiên (từ La): bậc 6 và 7 là Fa – Sol.'
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n9
  cau: 'Thứ hòa âm (từ La): bậc 6 và 7 là Fa – Sol♯.'
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n10
  cau: Quãng Fa–Sol♯ là quãng 2 tăng, gồm 3 nửa cung.
  loai: so-lieu
- trang: luyen-tai/nghe-gam
  id: n11
  cau: Quãng 2 tăng Fa–Sol♯ nghe 'gai', rất đặc trưng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n12
  cau: 'Thứ giai điệu: Fa♯ – Sol♯ khi đi lên, Fa – Sol khi đi xuống.'
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n13
  cau: Thứ giai điệu đi lên nghe gần như gam trưởng, chỉ khác nốt 3; đi xuống trở về thứ tự nhiên.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n14
  cau: Thứ hòa âm đặc trưng bởi quãng 2 tăng; Sol♯ là nốt dẫn, nâng nửa cung để giọng thứ có hợp âm át bảy (V7) như giọng trưởng.
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n15
  cau: Điệu thức Dorian là gam thứ tự nhiên với bậc 6 trưởng.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n16
  cau: Dorian nghe thứ nhưng sáng hơn thứ tự nhiên.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n17
  cau: Điệu thức Phrygian là gam thứ tự nhiên với bậc 2 thứ; bước đầu tiên của gam chỉ nửa cung.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n18
  cau: Phrygian nghe tối.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n19
  cau: Điệu thức Lydian là gam trưởng với bậc 4 tăng.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n20
  cau: Lydian nghe trưởng nhưng mơ màng, lơ lửng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n21
  cau: Điệu thức Mixolydian là gam trưởng với bậc 7 thứ.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n22
  cau: Mixolydian nghe trưởng nhưng bớt chói.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n23
  cau: Điệu thức Locrian là gam thứ tự nhiên với bậc 2 thứ và bậc 5 giảm.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n24
  cau: Locrian bất ổn nhất, vì hợp âm ba trên chủ âm của nó là hợp âm giảm.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n25
  cau: Gam thứ từ La mà có Fa♯ thay cho Fa là Dorian; gam trưởng từ Đô mà có Si♭ thay cho Si là Mixolydian.
  loai: cau-truc
- trang: luyen-tai/nghe-gam
  id: n28
  cau: Gam ngũ cung chỉ có 5 nốt và không có nửa cung.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n29
  cau: Gam ngũ cung nghe thoáng, trống trải, không căng thẳng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n30
  cau: Gam ngũ cung có mặt trong nhạc của nhiều nơi trên thế giới, kể cả nhạc truyền thống Việt Nam.
  loai: lich-su
- trang: luyen-tai/nghe-gam
  id: n31
  cau: Gam toàn cung có 6 nốt và cũng không có nửa cung.
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n38
  cau: 'Quiz: muốn phân biệt nhanh trưởng hay thứ thì nghe bậc 3.'
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n39
  cau: 'Quiz: quãng 2 tăng Fa–Sol♯ ở cuối gam thứ đi lên là dấu hiệu của thứ hòa âm; Sol♯ là nốt dẫn tạo át bảy (V7).'
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n40
  cau: 'Quiz: gam thứ có bậc 6 trưởng thay vì thứ là Dorian.'
  loai: quy-tac
- trang: luyen-tai/nghe-gam
  id: n41
  cau: 'Quiz: ngũ cung chỉ có 5 nốt với toàn cung và quãng 3 thứ, không chỗ nào xít.'
  loai: dinh-nghia
- trang: luyen-tai/nghe-gam
  id: n6
  cau: Nhận ra sáng hay tối ở bậc 3 là đủ để đoán trưởng/thứ trong đa số trường hợp.
  loai: khuyen-tap
- trang: luyen-tai/nghe-gam
  id: n26
  cau: 'Đừng học thuộc lòng 7 điệu thức: so với gam trưởng/thứ gần nhất và tìm đúng một nốt khác.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-gam
  id: n34
  cau: 'Các bước tập bậc trong gam: nghe gam Đô trưởng, nghe một nốt, hát từ chủ âm đếm 1–2–3, rồi bỏ bước hát.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-hop-am
  id: n4
  cau: 'Có bốn loại hợp âm ba: trưởng, thứ, giảm, tăng.'
  loai: danh-muc
- trang: luyen-tai/nghe-hop-am
  id: n5
  cau: 'Hợp âm trưởng: Đô – Mi – Sol.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n6
  cau: Hợp âm trưởng nghe sáng, vui, vững chãi.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n7
  cau: 'Hợp âm thứ: Đô – Mi♭ – Sol.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n8
  cau: Hợp âm thứ nghe tối, buồn, dịu; khác hợp âm trưởng đúng một nốt, nốt giữa (bậc 3).
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n9
  cau: 'Hợp âm giảm: Đô – Mi♭ – Sol♭.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n10
  cau: Hợp âm giảm nghe căng, co lại, bất ổn, như đang 'nhíu mày'.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n11
  cau: 'Hợp âm tăng: Đô – Mi – Sol♯.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n12
  cau: Hợp âm tăng nghe lơ lửng, mơ màng và là loại hiếm gặp nhất.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n13
  cau: 'Chìa khóa phân biệt trưởng và thứ là bậc 3 của hợp âm: Mi hay Mi♭ trong hợp âm Đô.'
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n15
  cau: Hợp âm rải (arpeggio) là các nốt vang lần lượt; hợp âm chập (block) là các nốt vang cùng lúc.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n16
  cau: Hợp âm rải Đô–Mi–Sol gồm hai quãng 3 liên tiếp, nên dễ nghe từng quãng.
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n18
  cau: Nốt trầm là gốc thì hợp âm ở thế gốc; trầm là bậc 3 thì thể đảo 1; trầm là bậc 5 thì thể đảo 2.
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n19
  cau: Thế gốc nghe vững nhất, thể đảo 1 bồng bềnh hơn, thể đảo 2 lửng lơ nhất.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n21
  cau: Thêm nốt thứ tư, cách gốc một quãng 7, tạo ra năm loại hợp âm bảy.
  loai: danh-muc
- trang: luyen-tai/nghe-hop-am
  id: n22
  cau: 'Trưởng bảy: Đô–Mi–Sol–Si.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n23
  cau: Trưởng bảy nghe sang, mơ màng, 'nhạc jazz êm'.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n24
  cau: 'Át bảy: Đô–Mi–Sol–Si♭.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n25
  cau: Hợp âm át bảy chứa tritone Mi–Si♭ (bậc 3 và bậc 7), nên nghe thúc về hợp âm chủ.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n26
  cau: 'Thứ bảy: Đô–Mi♭–Sol–Si♭.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n27
  cau: Thứ bảy nghe êm, buồn nhẹ, thư giãn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n28
  cau: 'Nửa giảm: Đô–Mi♭–Sol♭–Si♭.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n29
  cau: Hợp âm nửa giảm gặp ở bậc 7 của giọng trưởng và bậc 2 của giọng thứ.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n30
  cau: Hợp âm nửa giảm nghe căng, u ám.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n31
  cau: 'Giảm bảy: Đô–Mi♭–Sol♭–Si𝄫.'
  loai: cau-truc
- trang: luyen-tai/nghe-hop-am
  id: n32
  cau: Hợp âm giảm bảy nghe căng tột độ, chênh vênh.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n33
  cau: Hợp âm giảm bảy hay dùng trước khi chuyển giọng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n42
  cau: 'Quiz: nghe hợp âm tối, buồn thì khả năng cao là hợp âm thứ.'
  loai: dinh-nghia
- trang: luyen-tai/nghe-hop-am
  id: n43
  cau: 'Quiz: hợp âm trưởng và thứ khác nhau ở nốt giữa (bậc 3).'
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n44
  cau: 'Quiz: để đoán thể đảo, nghe nốt trầm nhất; nốt trầm cho biết thế gốc, đảo 1 (bậc 3) hay đảo 2 (bậc 5).'
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n45
  cau: 'Quiz: hợp âm bảy thường dùng làm hợp âm át, nghe muốn đi tiếp về chủ, là át bảy; ví dụ Sol7 = Sol–Si–Rê–Fa chứa tritone và thúc về Đô.'
  loai: quy-tac
- trang: luyen-tai/nghe-hop-am
  id: n34
  cau: Hợp âm bảy khó hơn hợp âm ba nhiều; chỉ tập khi đã phân biệt trưởng/thứ thành thạo.
  loai: khuyen-tap
- trang: luyen-tai/nghe-hop-am
  id: n37
  cau: 'Chế độ rải từng nốt dễ hơn chập cùng lúc: tập rải trước.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-hop-am
  id: n1
  cau: 'Nghe hợp âm là nghe ''màu'' của một khối âm thanh: sáng hay tối, căng hay êm, muốn đứng yên hay muốn đi tiếp.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-quang
  id: n1
  cau: Nghe quãng là nghe khoảng cách giữa hai nốt.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n2
  cau: Giai điệu là chuỗi các quãng nối nhau.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n6
  cau: Quãng đúng gồm quãng 1, 4, 5 và 8.
  loai: danh-muc
- trang: luyen-tai/nghe-quang
  id: n7
  cau: Quãng đúng nghe vang, rỗng, vững chãi; quãng 5 đúng nghe trống một cách đẹp đẽ; quãng 4 đúng nghe hơi lửng lơ, muốn đi tiếp.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n8
  cau: 'Quãng 3 và quãng 6 đều có hai loại: trưởng và thứ.'
  loai: danh-muc
- trang: luyen-tai/nghe-quang
  id: n9
  cau: Quãng trưởng nghe sáng, quãng thứ nghe tối.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n10
  cau: Quãng 3 và 6 là nhóm quyết định cảm xúc của giai điệu và hợp âm.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n11
  cau: 'Quãng 2 và quãng 7 đều có hai loại: trưởng và thứ.'
  loai: danh-muc
- trang: luyen-tai/nghe-quang
  id: n12
  cau: Quãng 2 và 7 là các quãng nghịch; tai muốn chúng 'giải quyết' sang quãng êm hơn.
  loai: quy-tac
- trang: luyen-tai/nghe-quang
  id: n13
  cau: Tritone là quãng 4 tăng hoặc 5 giảm.
  loai: ten
- trang: luyen-tai/nghe-quang
  id: n14
  cau: Tritone gồm 6 nửa cung, chia đôi quãng tám.
  loai: so-lieu
- trang: luyen-tai/nghe-quang
  id: n15
  cau: Tritone nghe căng, bất ổn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n16
  cau: Tritone có mặt trong hợp âm át bảy (V7).
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n20
  cau: Quãng 3 trưởng là bậc 3 của gam trưởng; quãng 3 thứ là bậc 3 của gam thứ (tính từ chủ âm).
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n22
  cau: Quãng 4 đúng gợi nhớ bằng 'Here Comes the Bride', quãng 5 đúng bằng 'Twinkle Twinkle'.
  loai: so-lieu
- trang: luyen-tai/nghe-quang
  id: n30
  cau: 'Quiz: nghe quãng ''sáng'' thì nghĩ đến quãng 3 hoặc 6 trưởng, không phải quãng đúng hay quãng 2.'
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n31
  cau: 'Quiz: lý do nên phân biệt trưởng/thứ trước là cảm giác sáng/tối dễ nghe hơn, giúp loại bớt ứng viên; không phải vì trưởng và thứ có cùng số nửa cung.'
  loai: dinh-nghia
- trang: luyen-tai/nghe-quang
  id: n32
  cau: 'Quiz: quãng gồm 6 nửa cung và có mặt trong hợp âm át bảy (V7) là tritone; ví dụ Si–Fa trong Sol7 (Sol–Si–Rê–Fa) ở giọng Đô trưởng.'
  loai: so-lieu
- trang: luyen-tai/nghe-quang
  id: n3
  cau: 'Nghe quãng là kỹ năng nền của mọi luyện tai: nghe được quãng thì hát đúng cao độ và chép lại được nhạc mình nghe.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-quang
  id: n33
  cau: 'Quiz: khi nghe quãng hòa âm mà bí, tách hai nốt: nghe nốt trầm trước, hát nó lên, rồi tìm nốt cao.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-quang
  id: n19
  cau: 'Kỹ thuật 2: với quãng hòa âm, nghe nốt trầm trước, hát nó lên rồi tìm nốt cao.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-tien-trinh
  id: n1
  cau: Tiến trình hòa âm (chord progression) là chuỗi hợp âm nâng đỡ cả bản nhạc.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n4
  cau: Nốt trầm nhất quyết định thể của hợp âm; khi hợp âm ở thể gốc, nốt trầm chính là gốc của hợp âm.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n5
  cau: Nghe được đường đi của bè trầm là nghe được phần lớn tiến trình.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n6
  cau: Bè trầm đi Đô – Fa – Sol – Đô thường là tiến trình I – IV – V – I ở giọng Đô trưởng.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n7
  cau: Nốt trầm đứng yên ở Sol trong khi hợp âm bên trên đổi thường là I6/4 rồi V ngay trước kết.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n9
  cau: Chuỗi các bậc trầm cho khung của tiến trình hòa âm; hợp âm ở thể đảo thì nốt trầm không phải gốc.
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n10
  cau: 'Khối nhạc 1: I – IV – V – I (hợp âm Đô, Fa, Sol, Đô), tay trái chơi nốt gốc Đô, Fa, Sol, Đô.'
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n11
  cau: Cảm giác 'đi xa rồi về nhà' chính là V – I cuối cùng.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n13
  cau: Tiến trình I – IV – I6/4 – V – I có bè trầm Sol đứng yên qua hai hợp âm rồi về Đô.
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n14
  cau: I – IV – I6/4 – V – I là kết của rất nhiều bản Cổ điển.
  loai: lich-su
- trang: luyen-tai/nghe-tien-trinh
  id: n15
  cau: Tiến trình I – ii6 – V7 – I có bè trầm Đô – Fa – Sol – Đô, hợp âm trên Fa là Rê – Fa – La.
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n16
  cau: 'Chuỗi quãng năm đi xuống: mỗi bước xuống một quãng năm (hoặc lên một quãng bốn).'
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n17
  cau: Prinner có bè trầm Fa – Mi – Rê – Đô (xuống từng bậc, bậc 4–3–2–1).
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n18
  cau: Romanesca có bè trầm Đô – Si – La – Mi (bậc 1–7–6–3).
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n20
  cau: Ở ô 2 của ví dụ I – IV – I6/4 – V – I, tay phải chơi lại hợp âm Đô trưởng nhưng bè trầm đã sang Sol; hai nốt trên trượt xuống 'sáu xuống năm, bốn xuống ba' rồi mới về nhà.
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n21
  cau: Bè trầm trong Canon của Pachelbel xuống quãng bốn rồi lên một bậc (Đô – Sol – La – Mi – Fa – Đô), rồi Fa – Sol.
  loai: so-lieu
- trang: luyen-tai/nghe-tien-trinh
  id: n22
  cau: Gjerdingen nhận ra ở bè trầm Pachelbel một mẫu Romanesca.
  loai: lich-su
- trang: luyen-tai/nghe-tien-trinh
  id: n23
  cau: Kết (cadence) là chuỗi hợp âm ở cuối một câu nhạc, như dấu chấm, dấu phẩy trong văn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n24
  cau: 'Có bốn loại kết trong ví dụ: kết trọn (V – I), kết plagal (IV – I), kết lừa (V – vi) và kết nửa (dừng ở V).'
  loai: danh-muc
- trang: luyen-tai/nghe-tien-trinh
  id: n28
  cau: Kết trọn nghe dừng hẳn, trọn vẹn, như dấu chấm.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n29
  cau: Kết nửa nghe lơ lửng, chờ câu tiếp, như dấu phẩy.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n30
  cau: Kết plagal nghe êm, trang nghiêm, 'A-men'.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n31
  cau: Kết lừa nghe tưởng về nhà nhưng rẽ sang hợp âm buồn hơn.
  loai: dinh-nghia
- trang: luyen-tai/nghe-tien-trinh
  id: n37
  cau: 'Quiz: để nghe ra tiến trình hòa âm, tập trung vào bè trầm nhất, thường là gốc hợp âm.'
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n38
  cau: 'Quiz: trong I – IV – I6/4 – V – I, bè trầm đứng yên ở Sol khi đi từ I6/4 sang V.'
  loai: cau-truc
- trang: luyen-tai/nghe-tien-trinh
  id: n39
  cau: 'Quiz: hai hợp âm cuối Sol – La thứ (V – vi) là kết lừa.'
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n40
  cau: 'Quiz: kết nửa nghe như dấu phẩy, dừng ở V mà chưa về I.'
  loai: quy-tac
- trang: luyen-tai/nghe-tien-trinh
  id: n33
  cau: 'Mozart: Minuet Fa trưởng K. 2: nghe từng câu nhạc và thử gọi tên chỗ kết ở cuối mỗi câu.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-tien-trinh
  id: n35
  cau: 'Bài bạn đang tập: chơi chậm riêng bè trầm, hát theo, đánh dấu mỗi chỗ kết và gọi tên.'
  loai: khuyen-tap
- trang: luyen-tai/nghe-tien-trinh
  id: n25
  cau: 'Mẹo: chỉ nghe hai hợp âm cuối câu và hỏi có về nhà (I) không.'
  loai: khuyen-tap
