  ghi_chu: "Amazing Grace (Mutopia, Mi giáng trưởng): Si giáng4 lên Mi giáng5 = 4 đúng (5 lên 1). Old French Song (Mutopia, Sol thứ): nốt lấy đà Rê4 lên Sol4 = 4 đúng. \"Bài 6\" là câu về site, không kiểm."
