  ghi_chu: "Luyện tai: nhận quãng, hợp âm, gam, tiết tấu bằng tai (ToneGym; musictheory.net có bài tai cho quãng, hợp âm, gam)."
- trang: "luyen-tai/index"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/intervals/"
  ghi_chu: "OMT Intervals: m2=1, M2=2, m3=3, M3=4, P4=5, A4/d5=6, P5=7, M6=9, P8=12."
- trang: "luyen-tai/index"
  id: "n21"
  luot_2: "khong-chac"
  ghi_chu: "Chưa mở được nguồn bậc 2 nêu mô-típ Jaws (nhạc có bản quyền); biết E-F nửa cung đi lên."
- trang: "luyen-tai/index"
  id: "n22"
  luot_2: "khong-chac"
  ghi_chu: "Không mở được bản nhạc Happy Birthday; hiểu biết chung: Hap-py BIRTH-day là Đô-Rê (2 trưởng đi lên)."
