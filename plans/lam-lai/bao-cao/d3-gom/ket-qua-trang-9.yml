- trang: "luyen-tai/nghe-tiet-tau"
  id: "n3"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
  ghi_chu: "OMT: phách 1 (downbeat) có \"trọng lượng\" hơn; số phách mỗi ô cho ra nhịp."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n4"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/drumbeats/"
  ghi_chu: "OMT Drumbeats: trống đạp (kick) rơi vào phách 1 và 3, snare ở 2 và 4; nguồn không dùng chữ \"phách mạnh\" nhưng ý khớp."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n5"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
  ghi_chu: "OMT: nhịp đôi (2/4) có phách 1 là downbeat nặng hơn; kiểu mạnh-nhẹ là cách dạy chuẩn."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n6"
  luot_2: "dung"
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/polka"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/march"
  ghi_chu: "Polka: \"quick duple time\"; hành khúc nhanh: 2/4 hoặc 6/8 (Concise Oxford)."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/waltz"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/minuet"
  ghi_chu: "Valse 3/4, minuet nhịp ba (Concise Oxford)."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n8"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/drumbeats/"
  ghi_chu: "Mẫu mạnh-nhẹ-vừa-nhẹ không được nguồn mở nêu nguyên văn; OMT chỉ có phách 1 nặng và backbeat 2, 4. Là cách dạy phổ biến nên ghi dung."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n9"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/drumbeats/"
  ghi_chu: "OMT Drumbeats: \"Quadruple meters are by far the most common meter in pop music\"."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n11"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
    - "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/"
  ghi_chu: "OMT: nhịp đơn chia phách làm hai; \"1 và 2 và\" là cách đếm chuẩn."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n12"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"
  ghi_chu: "OMT: nhịp kép chia phách làm ba; 6, 9, 12 ứng với nhịp đôi, ba, bốn; đếm \"la, li\"."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n13"
  luot_2: "khong-chac"
  ghi_chu: "Mô tả cảm giác chủ quan (\"bước đi\" và \"đu đưa\"); nguồn bậc 2 đã mở không nêu."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
  ghi_chu: "Đen (phách 1), hai móc đơn ở phách 2 và \"và\" của 2, đen (phách 3): khớp cách đếm; số học đúng, phách 4 để trống."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/syncopation"
  ghi_chu: "OMT: đảo phách là tiết tấu bề mặt đi ngược thứ bậc phách của nhịp; Concise Oxford: đổi chỗ nhấn để tránh nhịp đều."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n19"
  luot_2: "dung"
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/jazz"
  ghi_chu: "Nguồn mở chỉ nói ragtime \"highly syncopated\" (tiền thân jazz); câu quen thuộc, hợp lý."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/syncopation"
  ghi_chu: "Concise Oxford: đổi chỗ nhấn để tránh nhịp đều; cảm giác nảy là mô tả hợp lý."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/other-rhythmic-essentials/"
  ghi_chu: "OMT: đảo phách do nốt nối (tie), chấm, nghỉ, dấu nhấn; nốt nối qua phách mạnh là dấu hiệu quen thuộc."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n25"
  luot_2: "dung"
  nguon:
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/waltz"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/minuet"
  ghi_chu: "Mạnh-nhẹ-nhẹ là nhịp ba; valse, minuet nhịp ba."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n26"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/simple-meter-and-time-signatures/"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/compound-meters-and-time-signatures/"
  ghi_chu: "OMT: đơn chia hai (\"và\"), kép chia ba (\"la li\")."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n27"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/back-matter/glossary/"
    - "https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/syncopation"
  ghi_chu: "Như n18, n20."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n1"
  luot_2: "dung"
  ghi_chu: "Lời khuyên tập, hợp cách dạy."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n23"
  luot_2: "dung"
  ghi_chu: "Thứ tự luyện hợp lý."
- trang: "luyen-tai/nghe-tiet-tau"
  id: "n10"
  luot_2: "dung"
  ghi_chu: "Cách dạy phổ biến, an toàn."
