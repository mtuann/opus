- trang: nhac-ly/24-napoli-sau-tang
  id: n1
  cau: Hợp âm Napoli và hợp âm sáu tăng là hai loại hợp âm nửa cung (chromatic).
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n2
  cau: Hợp âm Napoli và hợp âm sáu tăng là "gia vị mạnh" của thời Cổ điển và Lãng mạn.
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n3
  cau: 'Cả hai đều có chức năng tiền át: chúng đứng ngay trước hợp âm V.'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n4
  cau: Hợp âm N6 và +6 làm cho V nghe căng thẳng hơn.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n5
  cau: Hợp âm N6 và +6 hay xuất hiện nhất ở giọng thứ (ví dụ của trang ở Đô thứ).
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n6
  cau: Hợp âm Napoli là hợp âm trưởng trên bậc 2 bị hạ nửa cung (♭II), thường ở đảo 1, nên ký hiệu N6 hoặc ♭II6.
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n7
  cau: 'Tên gọi Napoli nhắc tới Napoli (nhóm nhà soạn nhạc thế kỷ 18 quanh thành phố này), nhưng ít có cơ sở lịch sử: hợp âm đã được dùng từ trước đó và ở nhiều nơi khác.'
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n8
  cau: 'Trong Đô thứ: ♭II = Rê♭ trưởng (Rê♭ – Fa – La♭); ở đảo 1, nốt Fa ở bè trầm.'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n9
  cau: Hợp âm Napoli đi tới V, thường qua i6/4 hoặc trực tiếp.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n10
  cau: 'Nốt Rê♭ của hợp âm Napoli thường đi xuống qua Đô hoặc thẳng xuống Si (cảm âm): một bước quãng 3 giảm rất đặc trưng.'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n11
  cau: 'Khuông "N6 – V – i trong Đô thứ": N6 = Fa – Fa – La♭ – Rê♭ (Rê♭ trưởng đảo 1), V = Sol – Rê – Sol – Si, i = Đô – Mi♭ – Sol – Đô; Rê♭ đi xuống Si.'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n12
  cau: 'Hợp âm sáu tăng có hai nốt cách nhau quãng 6 tăng: La♭ (bậc 6 của Đô thứ) ở bè trầm và Fa♯ (bậc 4 được nâng) ở trên.'
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n13
  cau: 'Hai nốt của quãng 6 tăng giải quyết ra ngoài về quãng 8 trên Sol (bậc 5): La♭ đi xuống Sol, Fa♯ đi lên Sol.'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n14
  cau: Vì thế hợp âm sáu tăng kéo về V mạnh.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n15
  cau: Hợp âm sáu tăng có ba loại (Ý, Pháp, Đức); tên đặt theo quốc gia là tên gọi quy ước, không liên quan đến lịch sử thật.
  loai: ten
- trang: nhac-ly/24-napoli-sau-tang
  id: n16
  cau: 'Hợp âm sáu Ý (It+6) trong Đô thứ: La♭ – Đô – Fa♯; ba nốt, gọn nhất.'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n17
  cau: 'Hợp âm sáu Pháp (Fr+6) trong Đô thứ: La♭ – Đô – Rê – Fa♯ (thêm Rê); cả bốn nốt cùng thuộc một gam toàn cung.'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n18
  cau: 'Hợp âm sáu Đức (Ger+6) trong Đô thứ: La♭ – Đô – Mi♭ – Fa♯ (thêm Mi♭).'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n19
  cau: Hợp âm sáu Đức nghe giống hệt hợp âm La♭7, nhưng giải quyết khác.
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n20
  cau: 'Khuông "Ger+6 – i6/4 – V – i trong Đô thứ": bass La♭2 Sol2 Sol2 Đô3; trên: [Đô Mi♭ Fa♯] [Đô Mi♭ Sol] [Si Rê Sol] [Đô Mi♭ Sol].'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n21
  cau: Hợp âm sáu Đức thường đi qua i6/4 trước khi đến V, để tránh quãng 5 song song giữa La♭–Mi♭ và Sol–Rê.
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n22
  cau: 'Beethoven, chương 1 Sonata "Ánh trăng" Op. 27 số 2: tên và số hiệu.'
  loai: ten
- trang: nhac-ly/24-napoli-sau-tang
  id: n23
  cau: Hợp âm Napoli xuất hiện ngay ở ô nhịp thứ 3 của chương 1 Sonata "Ánh trăng".
  loai: cau-truc
- trang: nhac-ly/24-napoli-sau-tang
  id: n24
  cau: Hợp âm sáu tăng có mặt trong nhạc của Mozart, Beethoven, Schubert, thường ngay trước hợp âm át.
  loai: lich-su
- trang: nhac-ly/24-napoli-sau-tang
  id: n26
  cau: 'Bài tập 1: hợp âm N6 trong La thứ; ♭II của La thứ là Si♭ trưởng (Si♭ – Rê – Fa); đảo 1 nên Rê ở bè trầm.'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n27
  cau: 'Bài tập 2: ở La thứ, bậc 6 là Fa, bậc 4 nâng là Rê♯; It+6: Fa – La – Rê♯; Fr+6: Fa – La – Si – Rê♯; Ger+6: Fa – La – Đô – Rê♯.'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n28
  cau: 'Câu hỏi 1: hợp âm Napoli trong Đô thứ là Rê♭ trưởng; giải thích: "Hợp âm trưởng trên bậc 2 bị hạ."'
  loai: so-lieu
- trang: nhac-ly/24-napoli-sau-tang
  id: n29
  cau: 'Câu hỏi 2: hai nốt của quãng 6 tăng giải quyết ra ngoài, về quãng 8 trên bậc 5; giải thích: "La♭ xuống Sol, Fa♯ lên Sol."'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n30
  cau: 'Câu hỏi 3: hợp âm sáu Đức nghe giống hệt một hợp âm bảy át; giải thích: "Ger+6 đồng âm với La♭7 trong Đô thứ."'
  loai: dinh-nghia
- trang: nhac-ly/24-napoli-sau-tang
  id: n31
  cau: 'Câu hỏi 4: chức năng của N6 và +6 là tiền át, đứng trước V; giải thích: "Chúng làm hợp âm V thêm căng thẳng."'
  loai: quy-tac
- trang: nhac-ly/24-napoli-sau-tang
  id: n25
  cau: Khi nghe một hợp âm "nhói" ngay trước một hợp âm át lớn, rất có thể đó là +6.
  loai: khuyen-tap
- trang: nhac-ly/25-be-tram-so
  id: n2
  cau: Bè trầm số (figured bass) là cách ghi hợp âm của bè trầm liên tục bằng các con số dưới nốt bass
  loai: dinh-nghia
- trang: nhac-ly/25-be-tram-so
  id: n3
  cau: Nhạc công đàn phím thời Baroque chơi từ bè trầm kèm số và tự thêm hợp âm khi biểu diễn
  loai: dinh-nghia
- trang: nhac-ly/25-be-tram-so
  id: n4
  cau: Cách viết gốc "xương sống của bè trầm liên tục" gây hiểu sai; bè trầm số là cách ghi hợp âm của bè trầm liên tục
  loai: dinh-nghia
- trang: nhac-ly/25-be-tram-so
  id: n5
  cau: Cách viết gốc "cách nhạc sĩ thời Bach nghĩ về hòa âm" không có nguồn
  loai: dinh-nghia
- trang: nhac-ly/25-be-tram-so
  id: n6
  cau: Các con số chỉ quãng tính từ nốt bè trầm lên, theo hóa biểu
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n7
  cau: Người chơi tự chọn cách xếp các nốt hợp âm
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n8
  cau: Cụm "không phân biệt quãng tám" trong nguyên tắc
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n9
  cau: 'Không có số: hợp âm ba thể gốc (5/3); Đô trưởng: Đô-Mi-Sol'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n10
  cau: 'Số 6 (6/3): hợp âm ba đảo 1; bass Đô: Đô-Mi-La là La thứ đảo 1'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n11
  cau: 'Số 6/4: hợp âm ba đảo 2; bass Đô: Đô-Fa-La là Fa trưởng đảo 2'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n12
  cau: 'Số 7 (7/5/3): hợp âm bảy thể gốc; bass Sol: Sol-Si-Rê-Fa'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n13
  cau: 'Số 6/5: hợp âm bảy đảo 1; bass Si: Si-Rê-Fa-Sol'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n14
  cau: 'Số 4/3: hợp âm bảy đảo 2; bass Rê: Rê-Fa-Sol-Si'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n15
  cau: 'Số 4/2 hoặc 2: hợp âm bảy đảo 3; bass Fa: Fa-Sol-Si-Rê'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n16
  cau: Dấu hóa đứng một mình áp dụng cho quãng 3 trên bè trầm
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n17
  cau: Dấu hóa cạnh một con số (hoặc con số có gạch chéo) áp dụng cho quãng đó
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n18
  cau: 'Ví dụ: Đô, Mi 6, Fa, Sol 7, Đô đọc thành Đô trưởng, đảo 1, Fa trưởng, G7, Đô'
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n19
  cau: Ở G7, nốt 7 (Fa) đi xuống Mi và cảm âm Si đi lên Đô
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n20
  cau: Số 7 ngầm có cả nốt 5 (Rê); hai bè trên ví dụ chỉ giữ nốt 3 và nốt 7
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n22
  cau: Câu gốc "miễn đúng các quãng" quá tuyệt đối
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n25
  cau: Harpsichord, organ, lute trong nhóm Baroque dùng bè trầm liên tục
  loai: lich-su
- trang: nhac-ly/25-be-tram-so
  id: n26
  cau: Các số 6, 6/4, 6/5 dùng trong phân tích hòa âm hiện đại
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n27
  cau: Ký hiệu hợp âm kiểu C/E trong nhạc pop liên quan đến bè trầm số
  loai: dinh-nghia
- trang: nhac-ly/25-be-tram-so
  id: n28
  cau: 'Đáp án bài tập 1: bass Fa số 6 ở Đô trưởng: Fa-La-Rê, Rê thứ đảo 1'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n29
  cau: 'Đáp án 2: bass Si 6/5: Si-Rê-Fa-Sol, G7 đảo 1'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n30
  cau: 'Đáp án 3: bass Mi, ♯ một mình, La thứ: Mi-Sol♯-Si, Mi trưởng, V của La thứ'
  loai: ten
- trang: nhac-ly/25-be-tram-so
  id: n31
  cau: 'Quiz: con số chỉ quãng tính từ nốt bass lên; số 6 là ba đảo 1; ♯ đơn là quãng 3'
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n32
  cau: 'Khuông ví dụ giải bè trầm số thành hợp âm bằng hai bè trên: [EG] [Gc] [Ac] [FB] [Ec] trên bè trầm Đô, Mi 6, Fa, Sol 7, Đô'
  loai: quy-tac
- trang: nhac-ly/25-be-tram-so
  id: n24
  cau: Câu gốc "ứng tác từ bè trầm số mỗi buổi diễn" của "các nghệ sĩ" nói quá
  loai: khuyen-tap
- trang: nhac-ly/26-phan-tich
  id: n5
  cau: 'Bước 4: dấu hóa bất thường lặp lại là dấu hiệu chuyển giọng'
  loai: quy-tac
- trang: nhac-ly/26-phan-tich
  id: n8
  cau: Prelude cung Đô trưởng BWV 846 là bản nhạc có thể mở trên IMSLP
  loai: lich-su
- trang: nhac-ly/26-phan-tich
  id: n9
  cau: Mỗi ô nhịp của Prelude là một hợp âm rải (một hợp âm cho mỗi ô)
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n10
  cau: 'Ô 1: Đô-Mi-Sol-Đô-Mi, hợp âm I (Đô trưởng)'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n11
  cau: 'Ô 2: Đô-Rê-La-Rê-Fa, Dm7/Đô, ii4/2 (bass giữ Đô, Đô là nốt 7)'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n12
  cau: 'Ô 3: Si-Rê-Sol-Rê-Fa, G7/Si, V6/5'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n13
  cau: 'Ô 4: giống ô 1 (I); câu đầu I-ii-V-I'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n14
  cau: 'Ô 5: Đô-Mi-La-Mi-La, Am/Đô, vi6'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n15
  cau: 'Ô 6: Đô-Rê-Fa♯-La-Rê, D7/Đô, V4/2 của V; Fa♯ xuất hiện, át phụ'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n16
  cau: 'Ô 7: Si-Rê-Sol-Rê-Sol, G/Si, V6'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n17
  cau: 'Ô 8: Si-Đô-Mi-Sol-Đô, Cmaj7/Si; bass vẫn là Si (nốt 7 của Cmaj7)'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n18
  cau: 'Ô 9: La-Đô-Mi-Sol-Đô, Am7'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n19
  cau: 'Ô 10: Rê-La-Rê-Fa♯-Đô, D7, V7 của V'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n20
  cau: 'Ô 11: Sol-Si-Rê-Sol-Si, G; chủ âm hóa Sol trưởng'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n21
  cau: Chỉ trong 11 ô nhịp Bach đi từ Đô trưởng sang vùng Sol trưởng (giọng át) bằng át phụ D7 có Fa♯
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n22
  cau: Từ ô 6 đến ô 9, bè trầm đi xuống từng bước Đô-Si-La
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n23
  cau: Phần sau của Prelude đưa nhạc về Đô trưởng qua một âm nền át dài
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n24
  cau: Mozart Sonata K. 545 chương 1 là bản đáng phân tích hình thức sonata
  loai: lich-su
- trang: nhac-ly/26-phan-tich
  id: n27
  cau: 'Chopin Prélude Op. 28 số 4 (Mi thứ): bè trầm đi xuống gần như từng nửa cung Sol-Fa♯-Fa-Mi-Rê♯-Rê-Đô-Si'
  loai: cau-truc
- trang: nhac-ly/26-phan-tich
  id: n28
  cau: Op. 28 số 4 cung Mi thứ
  loai: ten
- trang: nhac-ly/26-phan-tich
  id: n29
  cau: 'Quiz: bước đầu là nghe không nhìn nhạc; nhận ra chuyển giọng bằng dấu hóa bất thường lặp lại; Fa♯ ở ô 6 thuộc D7 dẫn về Sol'
  loai: quy-tac
- trang: nhac-ly/26-phan-tich
  id: n1
  cau: Phân tích là ghép giọng, hợp âm, kết, hình thức vào một bản nhạc thật; mục đích là nghe sâu hơn
  loai: khuyen-tap
- trang: nhac-ly/26-phan-tich
  id: n2
  cau: 'Bước 1 của quy trình: nghe trước ít nhất hai lần, không nhìn bản nhạc'
  loai: khuyen-tap
- trang: nhac-ly/26-phan-tich
  id: n3
  cau: 'Bước 2: xác định giọng chính từ hóa biểu và hợp âm cuối, số chỉ nhịp, tốc độ, biên chế'
  loai: khuyen-tap
- trang: nhac-ly/27-ky-hieu-hop-am
  id: n1
  cau: Guitar đệm hát và piano pop ghi hợp âm bằng ký hiệu như Am, G7, Cmaj7, F/A
  loai: dinh-nghia
- trang: nhac-ly/27-ky-hieu-hop-am
  id: n2
  cau: 'Ký hiệu C: hợp âm trưởng Đô-Mi-Sol'
  loai: ten
- trang: nhac-ly/27-ky-hieu-hop-am
  id: n3
  cau: 'Cm hay C–: hợp âm thứ Đô-Mi♭-Sol'
  loai: ten
- trang: nhac-ly/27-ky-hieu-hop-am
  id: n4
  cau: 'Cdim hay C°: hợp âm giảm Đô-Mi♭-Sol♭'
  loai: ten
- trang: nhac-ly/27-ky-hieu-hop-am
  id: n5
  cau: 'Caug hay C+: hợp âm tăng Đô-Mi-Sol♯'
  loai: ten
