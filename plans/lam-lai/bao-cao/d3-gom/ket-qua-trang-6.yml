  ghi_chu: "OMT Ternary: simple ternary không đòi hỏi mỗi đoạn trọn vẹn; mỗi đoạn có thể mở hoặc đóng (open/closed). Câu đúng với dạng đóng điển hình (minuet, trio) nhưng quá chặt như định nghĩa chung."
