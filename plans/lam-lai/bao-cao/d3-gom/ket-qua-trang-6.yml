- trang: "nhac-ly/28-ket-cau"
  id: "n1"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "OMT Texture: texture là mật độ và sự tương tác giữa các bè của tác phẩm."
- trang: "nhac-ly/28-ket-cau"
  id: "n2"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "Phép so sánh dệt vải chỉ là hình ảnh minh họa, không sai; OMT không bàn nguồn gốc từ."
- trang: "nhac-ly/28-ket-cau"
  id: "n3"
  luot_2: "khong-chac"
  ghi_chu: "Từng vế có nguồn (Gregorian đơn âm, đa âm thế kỷ 16, Bach đa âm) nhưng không mở được nguồn bậc 2 nói chủ điệu là kết cấu nổi bật của Cổ điển và Lãng mạn; Baroque cũng có nhiều chủ điệu (monody, bè trầm liên tục), nên chỉ là khái quát thô."
- trang: "nhac-ly/28-ket-cau"
  id: "n4"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "OMT liệt kê đúng bốn loại: monophony, heterophony, homophony, polyphony."
- trang: "nhac-ly/28-ket-cau"
  id: "n5"
  luot_2: "khong-chac"
  ghi_chu: "Câu chỉ nói về chữ của hình trên site (cùng giai điệu Frère Jacques); không kiểm được bằng nguồn ngoài, cần review xem hình."
- trang: "nhac-ly/28-ket-cau"
  id: "n6"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "OMT: monophony là một tuyến giai điệu duy nhất, không đệm."
- trang: "nhac-ly/28-ket-cau"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
    - "https://www.britannica.com/art/monophony"
  ghi_chu: "OMT: mọi người cùng chơi một tuyến là đơn âm; OMT và Britannica không nêu riêng trường hợp gấp tám, nhưng cùng một tuyến giai điệu nên vẫn là đơn âm theo định nghĩa."
- trang: "nhac-ly/28-ket-cau"
  id: "n8"
  luot_2: "dung"
  nguon:
    - "https://www.britannica.com/art/Gregorian-chant"
    - "https://www.britannica.com/art/monophony"
  ghi_chu: "Britannica: thánh ca Gregorian là monophonic (unison)."
- trang: "nhac-ly/28-ket-cau"
  id: "n9"
  luot_2: "dung"
  nguon:
    - "https://imslp.org/wiki/Syrinx_(Debussy,_Claude)"
  ghi_chu: "IMSLP: Syrinx (1913) cho sáo độc tấu, một tuyến giai điệu duy nhất."
- trang: "nhac-ly/28-ket-cau"
  id: "n10"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BachJS/BWV847/fuga2/fuga2.ly"
  ghi_chu: "Fuga C thứ BWV 847 (Mutopia): bè alto nêu chủ đề một mình ở ô 1, bè soprano vào ô 2; mở đầu fugue theo lối này là chuẩn."
- trang: "nhac-ly/28-ket-cau"
  id: "n11"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "OMT: homophony gồm homorhythm và giai điệu cùng đệm (melody and accompaniment)."
- trang: "nhac-ly/28-ket-cau"
  id: "n12"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "Khớp với hai nhánh của homophony ở OMT: homorhythm và melody-and-accompaniment."
- trang: "nhac-ly/28-ket-cau"
  id: "n13"
  luot_2: "dung"
  nguon:
    - "https://www.britannica.com/art/Alberti-bass"
  ghi_chu: "Britannica: Mozart dùng bè Alberti (hình hợp âm rải đệm); hợp âm rải đệm của Chopin cũng là hình đệm riêng, nhận định chung đúng."
- trang: "nhac-ly/28-ket-cau"
  id: "n14"
  luot_2: "dung"
  nguon:
    - "https://courses.lumenlearning.com/suny-musicapp-medieval-modern/chapter/texture/"
  ghi_chu: "Lumen (SUNY): homophony là một giai điệu rõ có đệm hợp âm, gồm thánh ca Tin Lành và nhạc pop/đời sau; Cổ điển, Lãng mạn là khái quát chuẩn."
- trang: "nhac-ly/28-ket-cau"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "OMT: polyphony là nhiều bè giai điệu độc lập."
- trang: "nhac-ly/28-ket-cau"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://www.britannica.com/art/fugue"
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "Britannica: fugue là mô phỏng có hệ thống chủ đề trong các tuyến đồng thời; OMT xếp canon và fugue vào polyphony."
- trang: "nhac-ly/28-ket-cau"
  id: "n17"
  luot_2: "khong-chac"
  ghi_chu: "Phục hưng (Britannica Baroque: phong cách đa âm thế kỷ 16) và Bach (fugue) có nguồn; vế phần phát triển trong giao hưởng không có nguồn bậc 2 mở được."
- trang: "nhac-ly/28-ket-cau"
  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "OMT: heterophony là nhiều biến thể đồng thời của một giai điệu."
- trang: "nhac-ly/28-ket-cau"
  id: "n19"
  luot_2: "dung"
  nguon:
    - "https://researchcatalogue.net/view/1301475/2015608?c=3"
  ghi_chu: "Nguyễn Thanh Thủy và Östersjö phân tích đờn ca tài tử như ornamental heterophony (dị âm trang trí)."
- trang: "nhac-ly/28-ket-cau"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://www.britannica.com/art/heterophony"
  ghi_chu: "Britannica: heterophony có ở gamelan Indonesia."
- trang: "nhac-ly/28-ket-cau"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://www.britannica.com/art/heterophony"
  ghi_chu: "Britannica nêu heterophony trong thực hành Trung Đông và nhạc nghệ thuật Ba Tư; Ả Rập không nêu riêng nhưng thuộc phạm vi Trung Đông (nguồn yếu hơn)."
- trang: "nhac-ly/28-ket-cau"
  id: "n22"
  luot_2: "khong-chac"
  ghi_chu: "Britannica (Heterophony) không có câu nào về nhạc cổ điển phương Tây; đúng như khái quát nhưng chưa có nguồn bậc 2 xác nhận."
- trang: "nhac-ly/28-ket-cau"
  id: "n23"
  luot_2: "khong-chac"
  ghi_chu: "Câu chỉ nói về chữ của hình (màu xanh, vàng, piano roll), không có phần nhạc lý để kiểm."
- trang: "nhac-ly/28-ket-cau"
  id: "n26"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BachJS/BWV847/fuga2/fuga2.ly"
    - "https://www.britannica.com/art/fugue"
  ghi_chu: "Fuga BWV 847 (Mutopia): ô 1 một bè, ô 2 vào bè thứ hai, ô 7 bè thứ ba: từ đơn âm thành phức điệu."
- trang: "nhac-ly/28-ket-cau"
  id: "n27"
  luot_2: "khong-chac"
  ghi_chu: "Không mở được nguồn bậc 2 nói phần phát triển giao hưởng chuyển sang phức điệu; có thể đúng ở một số tác phẩm."
- trang: "nhac-ly/28-ket-cau"
  id: "n28"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "OMT: texture là mật độ (density) của các bè."
- trang: "nhac-ly/28-ket-cau"
  id: "n29"
  luot_2: "khong-chac"
  ghi_chu: "OMT không coi âm vực/khoảng cách bè là yếu tố của texture; cách dùng này có trong giáo trình khác nhưng chưa mở được nguồn."
- trang: "nhac-ly/28-ket-cau"
  id: "n30"
  luot_2: "khong-chac"
  ghi_chu: "Khái quát về dàn nhạc Lãng mạn cuối thế kỷ 19; không mở được nguồn bậc 2 xác nhận."
- trang: "nhac-ly/28-ket-cau"
  id: "n31"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
    - "https://www.britannica.com/art/Alberti-bass"
    - "https://www.britannica.com/art/fugue"
    - "https://researchcatalogue.net/view/1301475/2015608?c=3"
  ghi_chu: "Bốn đáp án khớp với định nghĩa: gấp tám là đơn âm, Alberti là chủ điệu, fugue là phức điệu, đờn ca tài tử là dị âm."
- trang: "nhac-ly/28-ket-cau"
  id: "n32"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/texture/"
  ghi_chu: "Trang OMT Texture ghi tác giả Mark Gotham và Samuel Brady."
- trang: "nhac-ly/28-ket-cau"
  id: "n33"
  luot_2: "dung"
  nguon:
    - "https://researchcatalogue.net/view/1301475/2015608?c=3"
  ghi_chu: "Bài Claiming Space: Structural aspects of heterophony in the Vietnamese tradition of Vọng Cổ Performance, của Nguyễn Thanh Thủy và Stefan Östersjö, Intersections 41(1); trang Érudit bị chặn nên dùng trang researchcatalogue."
- trang: "nhac-ly/28-ket-cau"
  id: "n25"
  luot_2: "dung"
  nguon: []
  ghi_chu: "Lời khuyên nghe hợp lý, nhất quán với định nghĩa."
- trang: "nhac-ly/28-ket-cau"
  id: "n24"
  luot_2: "dung"
  nguon: []
  ghi_chu: "Lời khuyên nghe hợp lý, nhất quán với định nghĩa."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n1"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "OMT: sequence là mẫu được lặp lại và dịch chuyển (transposed); khớp với câu."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n2"
  luot_2: "khong-chac"
  ghi_chu: "Không có nguồn bậc 2 mở được nói chuỗi đặc biệt hay gặp ở Baroque (chỉ Wikipedia: 'stereotypically associated with Baroque'); OMT không nêu."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n3"
  luot_2: "khong-chac"
  ghi_chu: "Như n2: chưa có nguồn bậc 2 cho việc dùng chuỗi làm manh mối nhận diện Baroque; chuỗi có ở mọi thời nên quá mạnh nếu là dấu hiệu duy nhất."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n5"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "Mi-Rê-Mi-Đô, Rê-Đô-Rê-Si, Đô-Si-Đô-La: mỗi lần thấp hơn một bậc, đúng là chuỗi giai điệu. Không kiểm được hình trên site."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n6"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/11%3A_Melodic_Analysis/11.02%3A_Melodic_Alteration"
  ghi_chu: "Môtip lặp lại ở bậc khác là chuỗi (sequence); Hutchinson coi dịch chuyển cao độ là sequence."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "OMT: chuỗi quãng 5 đi xuống, gốc mỗi hợp âm giảm quãng 5 hoặc tăng quãng 4."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n8"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "Gốc mỗi hợp âm cách nhau quãng 5; cặp Fa-Si (C-F-B-E-A-D-G-C) là quãng 5 giảm ở thang âm tự nhiên: đúng."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n9"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "C-F-B°-E-A-D-G-C trong Đô trưởng ứng I-IV-vii°-iii-vi-ii-V-I."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n10"
  luot_2: "khong-chac"
  ghi_chu: "Câu tự mâu thuẫn nhẹ: xen kẽ xuống 5 rồi lên 4 thì bước Fa đến Si là lên quãng 4 tăng (tương ứng quãng 5 giảm), không phải 'xuống'; không xem được hình để biết bè trầm thực tế. Đề nghị viết 'Fa lên Si là quãng 4 tăng'."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n12"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "C-F-B°-Em-Am-Dm-G-C là chuỗi quãng 5 đi xuống đúng."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n13"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
    - "https://human.libretexts.org/Bookshelves/Music/Music_Theory/Music_Theory_for_the_21st-Century_Classroom_(Hutchinson)/31%3A_Introduction_to_Jazz_Theory/31.08%3A_Standard_Chord_Progressions"
  ghi_chu: "Chuỗi quãng 5 phổ biến trong nhạc tonal; Hutchinson 31.8: jazz dùng ii-V-I và iii-vi-ii-V, mỗi hợp âm cách quãng 5 (câu 'nối các vòng' là cách nói chung)."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n14"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "OMT: chuỗi quãng 3 đi xuống (mô hình dịch xuống một quãng 3); C-Am-F-Dm gốc xuống quãng 3 liên tiếp đúng."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "OMT: Pachelbel là chuỗi quãng 3 đi xuống, mô hình hai hợp âm; C-G-Am-Em-F-C-F-G là tiến trình chuẩn của Canon (bè trầm xuống 4, lên một bậc). Chưa mở bản nhạc."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n17"
  luot_2: "khong-chac"
  ghi_chu: "Bè trầm 1-5-6-3-4-1-4-5 đúng chuẩn, nhưng không mở được nguồn bậc 2 nói đó là công thức Romanesca (Romanesca cổ là III-VII-i-V; bản 'galant' của Gjerdingen mới là 1-5-6-3)."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n19"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "OMT: chuỗi 5-6 đi lên, một hợp âm được kéo dài trong khi bè trên đi từ quãng 5 lên quãng 6 so với bè trầm; C-Am/C-Dm-B°/D-Em đúng."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/chromatic-sequences/"
  ghi_chu: "OMT Chromatic Sequences: có chuỗi bè trầm đi xuống từng nửa cung; ví dụ Chopin (Mazurka Op. 30 số 4 ô 124-139, Impromptu As trưởng)."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n22"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
    - "https://imslp.org/wiki/Violin_Concerto_in_F_minor,_RV_297_(Vivaldi,_Antonio)"
  ghi_chu: "OMT: Vivaldi Op. 8 số 4, II, ô 11-13 là chuỗi 5-6 đi lên; IMSLP: Op. 8 số 4 là Mùa đông (RV 297), chương 2 Largo."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n24"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "OMT: Albéniz, Catalonia, Rehearsal 34-36 là chuỗi quãng 5 đi xuống."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n25"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
    - "https://imslp.org/wiki/Category:Maier,_Amanda"
  ghi_chu: "OMT: Maier, Six Pieces for Violin, số 6, ô 162-169 là chuỗi quãng 3 đi xuống; IMSLP có 6 Pieces for Violin and Piano."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n26"
  luot_2: "khong-chac"
  ghi_chu: "Không mở được bản nhạc hay phân tích bậc 2 cho các đoạn độc tấu Mùa xuân; có thể đúng nhưng chưa kiểm."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n27"
  luot_2: "khong-chac"
  ghi_chu: "Không mở được bản nhạc hay phân tích bậc 2 về chuỗi trong Hallelujah của Handel."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n28"
  luot_2: "dung"
  nguon:
    - "https://www.mutopiaproject.org/ftp/BachJS/BWV847/bwv847a/bwv847a.ly"
  ghi_chu: "Mutopia: Prelude C thứ BWV 847, 4/4, mỗi phách lặp một hình 16 (Đô-Mi♭-Rê-Mi♭) trên chuỗi hợp âm."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n29"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "Sol-Đô-Fa♯-Si-Mi-La-Rê-Sol: chuỗi quãng 5 đi xuống trong Sol trưởng (Fa♯ là bậc VII)."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n32"
  luot_2: "dung"
  nguon:
    - "https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-sequences/"
  ghi_chu: "Khớp định nghĩa sequence của OMT."
- trang: "nhac-ly/29-chuoi-hoa-am"
  id: "n33"
  luot_2: "dung"
