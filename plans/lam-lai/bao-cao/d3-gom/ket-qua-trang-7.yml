- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n1
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/atonality
    - https://www.britannica.com/art/whole-tone-scale
  ghi_chu: "Britannica: tính vô điệu tính nổi lên quanh 1908; gam toàn cung ở Debussy không có dấu dẫn/át."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n3
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/whole-tone-scale
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: "Britannica: mỗi bậc cách nhau một cung, 6 bậc mỗi quãng 8; OMT {0,2,4,6,8,10}."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n4
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales2.html
    - https://www.britannica.com/art/whole-tone-scale
  ghi_chu: "OMT: chỉ có hai tập gam toàn cung khác nhau (12/6 = 2)."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n5
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/whole-tone-scale
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: "Britannica: không có dấu dẫn, cảm giác điệu tính chỉ dựa vào lặp lại và nhấn mạnh giai điệu; mọi hợp âm ba đều tăng. OMT: tập hợp tự nó không hàm ý chủ âm."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n6
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/whole-tone-scale
  ghi_chu: Britannica gắn kiểu viết gam toàn cung với Debussy (khoảng 1900). Phần "mơ hồ, lơ lửng, như trong mơ" là mô tả cảm nhận, không kiểm được.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n7
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/whole-tone-scale
  ghi_chu: 'Britannica: "Voiles" (Préludes, quyển 1, số 2) dùng gam toàn cung (nguồn ghi 1909). Không mở được trang IMSLP của tập Préludes để đối chiếu thêm.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n9
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/whole-tone-scale
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: "Tự kiểm: C D E F# G# A# = cách nhau 2 nửa cung liên tiếp, đúng gam toàn cung; C-E-G# là hợp âm ba tăng (Britannica: mọi hợp âm ba của gam này đều tăng). Chỉ kiểm phần nhạc lý, không kiểm hình."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n10
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: 'OMT: "alternating half steps and whole steps", ví dụ {0,1,3,4,6,7,9,10} = 8 lớp cao độ.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n11
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: 'OMT: "only three unique octatonic collections".'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n12
  luot_2: khong-chac
  nguon:
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: OMT chỉ nói Messiaen gọi các tập này là "modes of limited transposition", không đánh số; nguồn bậc 2 mở được không xác nhận số 2 (chỉ thấy ở Wikipedia). Theo hiểu biết chung thì điệu thức 2 là bát cung nửa cung-cung, nhưng chưa xác nhận bằng nguồn đã mở.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n13
  luot_2: khong-chac
  nguon:
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: OMT chỉ nói "nhiều nhà soạn nhạc"; không nguồn bậc 2 đã mở nêu Bartók và Messiaen. Trang Britannica về Bartók không nhắc bát cung.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n14
  luot_2: khong-chac
  nguon:
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: Không nguồn bậc 2 đã mở nêu Rimsky-Korsakov và Stravinsky dùng bát cung (Britannica Stravinsky không nhắc). Chưa xác nhận.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n16
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales2.html
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: "Tự kiểm: C-Db 1, Db-Eb 2, Eb-E 1, E-F# 2, F#-G 1, G-A 2, A-Bb 1, Bb-C 2 nửa cung: đúng bát cung nửa cung-cung (nhóm OCT(0,1)), 8 nốt. Chỉ kiểm phần nhạc lý."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n17
  luot_2: khong-chac
  ghi_chu: Không mở được nguồn bậc 2 về hòa âm quãng 4 (OMT bản mở được không có mục này). Định nghĩa hiển nhiên về mặt cấu tạo nhưng chưa có nguồn.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n18
  luot_2: khong-chac
  ghi_chu: 'Như n17: tính "mơ hồ, không gốc rõ, không trưởng không thứ" chưa xác nhận được bằng nguồn bậc 2 đã mở.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n19
  luot_2: khong-chac
  ghi_chu: Không mở được nguồn bậc 2 nêu Hindemith dùng hòa âm quãng 4 trong Mathis der Maler (Britannica chỉ nói về lý thuyết mở rộng điệu tính của ông).
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n20
  luot_2: khong-chac
  ghi_chu: Không mở được nguồn bậc 2 về hợp âm quãng 4 trong jazz.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n21
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: "Tự kiểm: C-F-Bb-Eb, D-G-c-f, E-A-d-g đều chồng ba quãng 4 đúng (5 nửa cung mỗi bước). Nhịp 4/2 là phần hình/khuông của site, không kiểm."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n22
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/polytonality
  ghi_chu: 'Britannica: polytonality là sự xuất hiện đồng thời của hai hay nhiều giọng khác nhau (hai giọng thì gọi là bitonality). "hoặc hai hợp âm" là diễn đạt rộng, chấp nhận được.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n23
  luot_2: khong-chac
  nguon:
    - https://www.britannica.com/art/polytonality
  ghi_chu: Không mở được nguồn bậc 2 (không phải Wikipedia) nêu hợp âm Mi♭7 trên Fa♭ trưởng trong "Les Augures printaniers". Trang Wikipedia nói như vậy nhưng chỉ dùng để tìm nguồn; Britannica Polytonality không nhắc Le Sacre.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n24
  luot_2: khong-chac
  ghi_chu: "Như n23: chưa có nguồn bậc 2 đã mở cho tính chất lặp (dậm) của hợp âm này."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n26
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/triads.html
  ghi_chu: "Tự kiểm: Mi♭ Sol Si♭ Rê♭ = Mi♭7 (3 trưởng, 5 đúng, 7 thứ); Fa♭ La♭ Đô♭ = Fa♭ trưởng. Chỉ kiểm cách viết nốt, không kiểm việc khớp với bản nhạc Stravinsky (xem n23) và nhịp 2/4."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n27
  luot_2: khong-chac
  nguon:
    - https://www.britannica.com/art/atonality
  ghi_chu: 'Britannica: phương pháp 12 âm là cách tổ chức không giọng; không trang bậc 2 đã mở nêu mốc "đầu thập niên 1920" (Britannica serialism chỉ nói "từ khoảng Thế chiến I").'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n28
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/twelveToneBasics.html
  ghi_chu: 'OMT: "a series (row) that contains all twelve pitch classes in a particular order"; mỗi lớp cao độ không lặp lại trước khi hết dãy.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n29
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/twelveToneBasics.html
  ghi_chu: "OMT: các lớp cao độ được chơi theo thứ tự; cách nói của trang đã giản lược (hòa âm vẫn có thể lấy nốt liền nhau của dãy)."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n30
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/twelveToneBasics.html
    - https://openmusictheory.github.io/twelveToneOperations.html
  ghi_chu: 'OMT: "a single row breeds a total of 48 rows" (P, I, R, RI, mỗi dạng 12 cao độ).'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n31
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/atonality
  ghi_chu: 'Britannica: dãy 12 âm là cách tổ chức không dùng giọng trưởng-thứ; ý "không nốt nào được ưu tiên nên không chủ âm" là lập luận phổ biến, phù hợp nguồn nhưng nguồn không diễn đạt thành câu ấy.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n32
  luot_2: khong-chac
  nguon:
    - https://imslp.org/wiki/Violin%20Concerto%20(Berg,%20Alban)
  ghi_chu: IMSLP xác nhận năm 1935. Nhưng dãy chứa nhiều hợp âm ba (Sol thứ, Rê trưởng, La thứ, Mi trưởng) chỉ thấy ở Wikipedia; trang LA Phil và các trang khác đã mở không nêu.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n34
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/twelveToneBasics.html
  ghi_chu: "Tự kiểm: 12 nốt Sol Si♭ Rê Fa♯ La Đô Mi Sol♯ Si Đô♯ Mi♭ Fa đủ 12 lớp cao độ, mỗi lớp một lần (OMT: định nghĩa dãy). Không kiểm việc đây đúng là dãy của Berg (xem n32)."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n35
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/triads.html
  ghi_chu: "Tự kiểm: Sol-Si♭-Rê = Sol thứ; Rê-Fa♯-La = Rê trưởng; La-Đô-Mi = La thứ; Mi-Sol♯-Si = Mi trưởng; Si-Đô♯-Mi♭-Fa cách nhau từng cung. Các nốt đầu nối nhau (Rê, La, Mi, Si dùng chung)."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n36
  luot_2: dung
  nguon:
    - https://www.britannica.com/biography/Steve-Reich
    - https://www.britannica.com/biography/Philip-Glass
    - https://www.britannica.com/biography/Terry-Riley
  ghi_chu: 'Britannica: Reich là nhân vật hàng đầu của Minimalism, Glass thuộc phong trào Minimalism; Riley: In C (hợp âm ba Đô kéo dài) không được gọi tên "minimalism" trên trang Britannica nhưng ông thường được xếp cùng nhóm.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n37
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/ostinato
  ghi_chu: "Britannica: ostinato là mẫu giai điệu ngắn lặp lại suốt tác phẩm (đôi khi biến đổi nhẹ hay chuyển cao độ)."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n38
  luot_2: khong-chac
  ghi_chu: Không mở được nguồn bậc 2 định nghĩa "additive process" (Britannica Glass không nhắc).
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n39
  luot_2: dung
  nguon:
    - https://stevereich.com/composition/piano-phase/
  ghi_chu: 'Trang của Reich: hai người bắt đầu đồng âm cùng mẫu lặp, một người dần nhanh hơn rồi hai mẫu lệch nhau; "tiết tấu mới" là sản phẩm phụ (không nêu rõ trên trang đã mở).'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n40
  luot_2: khong-chac
  nguon:
    - https://stevereich.com/composition/piano-phase/
  ghi_chu: Trang của Reich nói đã ghi mẫu và làm vòng băng "cuối 1966" dẫn tới tác phẩm nhưng không ghi năm; năm 1967 chỉ thấy ở Wikipedia.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n41
  luot_2: dung
  nguon:
    - https://www.britannica.com/biography/Steve-Reich
    - https://stevereich.com/composition/piano-phase/
  ghi_chu: 'Britannica: tối giản dựa trên "lặp lại và kết hợp các mô-típ đơn giản"; Reich mô tả quá trình dần dần (trang Piano Phase). Phần "người nghe tập trung vào thay đổi nhỏ" là diễn giải.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n42
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/aleatory-music
  ghi_chu: "Britannica: aleatory/chance music là nhạc có yếu tố ngẫu nhiên hay bất định để người biểu diễn thực hiện; nêu Cage (Music of Changes 1951)."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n43
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/aleatory-music
    - https://johncage.org/pp/John-Cage-Work-Detail.cfm?work_ID=17
  ghi_chu: 'Britannica: xúc xắc, Kinh Dịch, người chơi chọn thứ tự trình bày; Cage dùng thao tác ngẫu nhiên (trang johncage.org). "Tung đồng xu" không có trên trang đã mở nhưng là cách tra Kinh Dịch thông thường.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n44
  luot_2: dung
  nguon:
    - https://johncage.org/pp/John-Cage-Work-Detail.cfm?work_ID=17
  ghi_chu: "johncage.org: 4′33″ sáng tác 1952, công diễn 29/8/1952 ở Woodstock."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n45
  luot_2: dung
  nguon:
    - https://johncage.org/pp/John-Cage-Work-Detail.cfm?work_ID=17
  ghi_chu: 'johncage.org: tacet, "no intentional sounds are made", ba chương dài 33″, 2′40″, 1′20″ (tổng 4′33″). Ý "âm nhạc là mọi âm thanh trong phòng" là diễn giải phổ biến.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n46
  luot_2: dung
  nguon:
    - https://www.classicfm.com/composers/part/music/arvo-part-spiegel-im-spiegel/
    - https://www.britannica.com/biography/Arvo-Part
  ghi_chu: 'Classic FM: Spiegel im Spiegel (1978), phong cách "minimalist, meditative"; Britannica: phong cách Pärt dựa trên sự biến điệu chậm. Phần "lặp lại" không nêu rõ trên trang đã mở.'
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n50
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: "OMT: hai gam toàn cung; gam từ Đô và từ Đô♯ là hai gam đó (C D E F# G# A# và C# D# F G A B)."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n51
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales2.html
  ghi_chu: "OMT: bát cung xen nửa cung và cung (8 nốt), ba tập khác nhau."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n52
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/twelveToneBasics.html
  ghi_chu: "OMT: 4 dạng x 12 cao độ = 48."
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n53
  luot_2: khong-chac
  nguon:
    - https://stevereich.com/composition/piano-phase/
  ghi_chu: Phần "lệch pha là kỹ thuật của Reich" đúng (trang Reich mô tả phasing); phần Piano Phase 1967 chưa xác nhận bằng nguồn bậc 2 đã mở (xem n40).
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n49
  luot_2: dung
  nguon: []
  ghi_chu: Lời khuyên nghe nhạc, vô hại.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n33
  luot_2: dung
  nguon: []
  ghi_chu: Nhận xét nghe, hợp lý với cấu tạo dãy (nhiều hợp âm ba); khuyen-tap.
- trang: nhac-ly/32-ky-thuat-the-ky-20
  id: n15
  luot_2: dung
  nguon: []
  ghi_chu: Nhận xét cảm nhận chủ quan, không trái điều gì trong nguồn.
- trang: nhac-ly/am-hoc
  id: n3
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/17-1-sound-waves
    - https://www.britannica.com/science/sound-physics
  ghi_chu: "OpenStax: sound là nhiễu động của vật chất truyền ra từ nguồn; Britannica: nhiễu động cơ học lan truyền trong môi trường đàn hồi."
- trang: nhac-ly/am-hoc
  id: n4
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/17-3-sound-intensity
  ghi_chu: 'OpenStax: "The perception of frequency is called pitch." Hz = số dao động mỗi giây (định nghĩa).'
- trang: nhac-ly/am-hoc
  id: n5
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/17-3-sound-intensity
  ghi_chu: 'OpenStax: cường độ tỉ lệ bình phương biên độ áp suất; độ to cảm nhận còn phụ thuộc tần số, nên "ứng với biên độ" là cách nói xấp xỉ chấp nhận được. Chữ "bảng gọi là" có vẻ gõ nhầm (nên là "còn gọi là"); chỉ kiểm phần nhạc lý.'
- trang: nhac-ly/am-hoc
  id: n6
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/sound.spectrum.html
  ghi_chu: "UNSW: timbre khác nhau khi biên độ tương đối các thành phần (bồi âm) khác nhau, là một trong các yếu tố quyết định."
- trang: nhac-ly/am-hoc
  id: n7
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/17-2-speed-of-sound
  ghi_chu: 'OpenStax: "the audible range, 20 and 20,000 Hz".'
- trang: nhac-ly/am-hoc
  id: n8
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "UNSW: tần số = 440 x 2^(n/12); tự tính: A0 (MIDI 21) = 27,5 Hz; C8 (MIDI 108) = 4186,0 Hz. Tên La0 và Đô8 là hai phím đầu cuối của piano 88 phím."
- trang: nhac-ly/am-hoc
  id: n9
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
    - https://newt.phys.unsw.edu.au/jw/harmonics.html
  ghi_chu: "OpenStax: dây hai đầu cố định f_n = n f_1; UNSW: các hài âm có tần số f, 2f, 3f... Chạm giữa dây (1/2, 1/3...) chọn các kiểu rung này."
- trang: nhac-ly/am-hoc
  id: n10
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/17-4-normal-modes-of-a-standing-sound-wave
    - https://newt.phys.unsw.edu.au/jw/harmonics.html
  ghi_chu: 'OpenStax: cơ bản là hài âm thứ nhất, hài thứ hai gấp đôi; "first overtone" của dây là hài thứ hai (n=2) nhưng của ống đóng là hài thứ ba: cách đánh số overtone tùy tài liệu. UNSW cũng nói overtones là tên khác của các hài trên cơ bản.'
- trang: nhac-ly/am-hoc
  id: n11
  luot_2: khong-chac
  ghi_chu: Chưa có nguồn bậc 2 đã mở cho "không nghe như nốt riêng" (tai luyện tập có thể tách một số bồi âm).
- trang: nhac-ly/am-hoc
  id: n12
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Tự tính: Đô2 = 65,406 Hz; hài 2 = 130,8 (Đô3); hài 3 = 196,2 (Sol3 196,0); hài 4 = 261,6 (Đô4); hài 6 = 392,4 (Sol4); hài 8 = 523,3 (Đô5). Công thức f_n = n f_1 từ OpenStax."
- trang: nhac-ly/am-hoc
  id: n13
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Tự tính: hài 5 của Đô2 = 327,03 Hz; Mi4 bình quân = 329,63 Hz; lệch 1200 log2(327,03/329,63) = -13,7 cent (thấp hơn Mi4 khoảng 14 cent)."
- trang: nhac-ly/am-hoc
  id: n14
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Tự tính: hài 7 = 457,84 Hz; Si♭4 = 466,16 Hz; lệch -31,2 cent (khoảng 31 cent thấp hơn). UNSW brass: hài 7 và 11 rơi giữa các nốt piano."
- trang: nhac-ly/am-hoc
  id: n15
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
    - https://www.animations.physics.unsw.edu.au/jw/beats.htm
  ghi_chu: "Tự tính theo tỉ lệ hài n:(n+1): 2:1 quãng 8, 3:2 quãng 5, 4:3 quãng 4, 5:4 quãng 3 trưởng, 6:5 quãng 3 thứ (UNSW beats dùng 5:4 và 6:5). Đây là quãng thuần, xấp xỉ với bình quân."
- trang: nhac-ly/am-hoc
  id: n16
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
    - https://www.animations.physics.unsw.edu.au/jw/beats.htm
  ghi_chu: "Hài 4:5:6 = Đô4, Mi4(thuần), Sol4 theo f_n = n f_1; UNSW beats: 5:4 và 6:5 là 3 trưởng và 3 thứ. Mi4 thuần thấp hơn Mi bình quân khoảng 14 cent (xem n13)."
- trang: nhac-ly/am-hoc
  id: n18
  luot_2: khong-chac
  nguon:
    - https://www.britannica.com/art/consonance-music
  ghi_chu: Britannica Consonance chỉ nói sự hòa nghe gắn với tỉ lệ tần số đơn giản; không nguồn đã mở nêu cách giải thích Helmholtz (bồi âm trùng nhau).
- trang: nhac-ly/am-hoc
  id: n19
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/Pythagorean-tuning
    - https://www.animations.physics.unsw.edu.au/jw/beats.htm
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
  ghi_chu: "Tự kiểm: 2:1, 3:2 (Britannica Pythagorean tuning), 5:4 và 6:5 (UNSW beats), 4:3 = hài 4/hài 3, 16:15 = hài 16/hài 15 (nửa cung thuần ~111,7 cent). Số liệu chuẩn của tuning thuần."
- trang: nhac-ly/am-hoc
  id: n20
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: "OMT: perfect consonances gồm P1, P5, P8; thuận hoàn toàn."
- trang: nhac-ly/am-hoc
  id: n21
  luot_2: khong-chac
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: OMT liệt kê "Perfect fourths" là hòa âm nghịch (harmonic dissonance). Tinh tế "thuận giữa hai bè trên" không có trên trang OMT đã mở; theo thông lệ đối âm thì đúng nhưng chưa xác nhận.
- trang: nhac-ly/am-hoc
  id: n22
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: "OMT: imperfect consonances gồm quãng 3 và 6 trưởng, thứ."
- trang: nhac-ly/am-hoc
  id: n23
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: 'OMT: hòa âm nghịch gồm "All diatonic steps (M2, m2)", mọi quãng bảy, tăng và giảm.'
- trang: nhac-ly/am-hoc
  id: n24
  luot_2: khong-chac
  nguon:
    - https://www.britannica.com/art/consonance-music
  ghi_chu: 'Britannica: trước khoảng 1300 quãng 3 bị nghe là nghịch, sau đó là thuận không hoàn toàn: đúng phần lịch sử. Phần "khác nhau giữa các nền văn hóa" không có trên trang đã mở.'
- trang: nhac-ly/am-hoc
  id: n25
  luot_2: khong-chac
  ghi_chu: Không nguồn bậc 2 đã mở cho "đối xử nghịch ngang thuận" (giải phóng nghịch âm) ở thế kỷ 20.
- trang: nhac-ly/am-hoc
  id: n28
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/sound.spectrum.html
  ghi_chu: 'UNSW: âm thoa gần sin thuần có phổ một đỉnh đáng kể. "Nghe trơn, nhạt" là mô tả cảm nhận.'
- trang: nhac-ly/am-hoc
  id: n30
  luot_2: khong-chac
  ghi_chu: Không mở được nguồn bậc 2 về phổ piano và độ tắt khác nhau của bồi âm (trang piano UNSW không mở được).
- trang: nhac-ly/am-hoc
  id: n31
  luot_2: khong-chac
  nguon:
    - https://newt.phys.unsw.edu.au/jw/voice.html
  ghi_chu: 'UNSW Voice: giọng hát có hài âm bội số tần số cơ bản và các nguyên âm cho đỉnh formant khác nhau (đúng). Phần huýt sáo "chỉ một đỉnh trội" chưa có nguồn đã mở.'
- trang: nhac-ly/am-hoc
  id: n33
  luot_2: khong-chac
  nguon:
    - https://newt.phys.unsw.edu.au/jw/sound.spectrum.html
  ghi_chu: Không mở được trang UNSW về sáo; UNSW Spectrum chỉ cho ví dụ sáo G4 có đỉnh ở 400, 800, 1200 Hz (không nói bồi âm yếu). Chưa xác nhận.
- trang: nhac-ly/am-hoc
  id: n34
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/clarinetacoustics.html
    - https://newt.phys.unsw.edu.au/jw/sound.spectrum.html
  ghi_chu: 'UNSW: clarinet gần như ống trụ đóng một đầu, phát chủ yếu các hài lẻ ở âm vực trầm (hài 1, 3 mạnh, 2, 4 yếu); khác biệt lẻ/chẵn mất dần ở âm vực cao. "rỗng" là mô tả âm sắc.'
- trang: nhac-ly/am-hoc
  id: n35
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/sound.spectrum.html
  ghi_chu: "UNSW: âm sắc do biên độ tương đối các thành phần quyết định; kèn đồng crescendo thì hài cao mạnh hơn nên sáng hơn. Sáo và oboe cụ thể không có trên trang đã mở nhưng nguyên lý đúng."
- trang: nhac-ly/am-hoc
  id: n37
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/brassacoustics.html
  ghi_chu: "UNSW: kèn đồng không van (trumpet tự nhiên, horn) chỉ chơi các nốt của chuỗi hài âm."
- trang: nhac-ly/am-hoc
  id: n38
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/brassacoustics.html
  ghi_chu: "UNSW: người chơi đổi nốt bằng cách chỉnh embouchure (môi) để chọn đỉnh trở kháng."
- trang: nhac-ly/am-hoc
  id: n39
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/brassacoustics.html
  ghi_chu: "UNSW: tay trong loa kèn horn hạ các cộng hưởng; trước khi có van, người chơi horn dùng các mức bịt tay khác nhau để đổi cao độ. Mốc thời Mozart khớp với kèn không van."
- trang: nhac-ly/am-hoc
  id: n40
  luot_2: khong-chac
  ghi_chu: Chưa có nguồn bậc 2 đã mở về kỹ thuật đàn bầu (chỉ thấy ở Wikipedia, nguồn tham khảo của nó không mở được).
- trang: nhac-ly/am-hoc
  id: n41
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/harmonics.html
  ghi_chu: 'UNSW: chạm nhẹ dây ở 1/4 chiều dài cho hài 4 (4f); kỹ thuật hài âm trên dây (violin, cello, guitar). "Trong veo như tiếng sáo" là mô tả.'
- trang: nhac-ly/am-hoc
  id: n42
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/Pythagorean-tuning
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: 'Tự tính: 12 quãng 5 thuần = 12 x 701,955 = 8423,46 cent; 7 quãng 8 = 8400 cent; dư 23,46 cent = dấu phẩy Pythagore (531441:524288). Britannica nói chồng quãng 5 thuần không đóng lại về nốt đầu (Britannica dùng "comma" cho 81:80 ở thứ cấp 3, khác dấu phẩy này).'
- trang: nhac-ly/am-hoc
  id: n43
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/tuning-and-temperament
  ghi_chu: "Britannica: không thể lên dây bảy nốt để mọi quãng đều thuần tối đa; các hệ tempered là thỏa hiệp."
- trang: nhac-ly/am-hoc
  id: n44
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/Pythagorean-tuning
    - https://www.britannica.com/art/just-intonation
  ghi_chu: 'Britannica: Pythagorean tuning làm mọi quãng 5 thuần, quãng 3 và 6 rộng ~22 cent (chói); dùng thời Trung cổ. "Còn dùng đến thời Phục hưng" là suy rộng hợp lý (meantone thay vào khoảng 1500) nhưng trang Britannica đã mở không nêu thẳng cho Pythagorean.'
- trang: nhac-ly/am-hoc
  id: n45
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/meantone-temperament
  ghi_chu: 'Britannica: meantone có quãng 3 trưởng thuần, có "wolf" ở các giọng xa, thịnh hành từ đầu thế kỷ 16 đến thế kỷ 18.'
- trang: nhac-ly/am-hoc
  id: n46
  luot_2: khong-chac
  nguon:
    - https://www.britannica.com/art/meantone-temperament
    - https://www.britannica.com/art/equal-temperament
  ghi_chu: 'Nguồn bậc 2 mở được chưa nêu khoảng "thế kỷ 18-19" cho well temperament: Britannica nói bình quân đều được chấp nhận ở Pháp và Đức cuối thế kỷ 18, Anh thế kỷ 19; Wikipedia (không dùng) nêu well temperament dùng suốt Baroque và Cổ điển. Chưa xác nhận.'
- trang: nhac-ly/am-hoc
  id: n47
  luot_2: khong-chac
  nguon:
    - http://plaza.ufl.edu/wnb/baroque_temperament.htm
  ghi_chu: Trang cá nhân (UFL) nói nhiều thế kỷ người ta cho là bình quân đều, Kellner (1975) cho là bất đều; không đủ nguồn bậc 2 để xác nhận câu "thường được cho là well temperament".
- trang: nhac-ly/am-hoc
  id: n48
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/equal-temperament
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Britannica: 12 nửa cung bằng nhau, 100 cent, mỗi bước nhân căn bậc 12 của 2 (~1,059); UNSW: tỉ lệ 2^(1/12) ≈ 1,059. Tự tính 1,059463."
- trang: nhac-ly/am-hoc
  id: n49
  luot_2: khong-chac
  nguon:
    - https://www.britannica.com/art/equal-temperament
  ghi_chu: 'Britannica: Pháp và Đức dùng rộng rãi cuối thế kỷ 18, Anh thế kỷ 19; không nêu piano hay "giữa thế kỷ 19". Chưa xác nhận.'
- trang: nhac-ly/am-hoc
  id: n50
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/equal-temperament
  ghi_chu: "Britannica: lỗi được phân bố đều trên 12 âm, chỉ quãng 8 là thuần về âm học; chơi mọi giọng với sai lệch nhỏ."
- trang: nhac-ly/am-hoc
  id: n51
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/equal-temperament
  ghi_chu: "Britannica: quãng 5 bình quân hẹp hơn quãng 5 tự nhiên khoảng 2 cent; tự tính 700 - 701,955 = -1,955 cent."
- trang: nhac-ly/am-hoc
  id: n52
  luot_2: dung
  nguon:
    - https://www.animations.physics.unsw.edu.au/jw/beats.htm
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Tự tính: 3 trưởng bình quân 400 cent; 5:4 = 386,31 cent; hơn 13,69 cent (khoảng 14). UNSW beats dùng 5:4 là 3 trưởng thuần."
- trang: nhac-ly/am-hoc
  id: n53
  luot_2: dung
  nguon:
    - https://www.animations.physics.unsw.edu.au/jw/beats.htm
  ghi_chu: "UNSW: số phách mỗi giây bằng hiệu tần số hai sóng; với 3 trưởng bình quân hài trùng lệch ~10 Hz (xem n55): nghe thấy, đặc biệt ở âm vực trung."
- trang: nhac-ly/am-hoc
  id: n55
  luot_2: dung
  nguon:
    - https://www.animations.physics.unsw.edu.au/jw/beats.htm
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Tự tính: Đô4 = 261,626 Hz, hài 5 = 1308,13 Hz; Mi4 bình quân = 329,628 Hz, hài 4 = 1318,51 Hz; hiệu 10,38 Hz (~10 phách mỗi giây, UNSW: phách = hiệu tần số). Với 5:4 thuần hai hài trùng: 5 x 261,626 = 4 x 326,53."
- trang: nhac-ly/am-hoc
  id: n56
  luot_2: khong-chac
  ghi_chu: Chưa có nguồn bậc 2 đã mở về việc ca sĩ và nhạc công điều chỉnh tới quãng thuần.
- trang: nhac-ly/am-hoc
  id: n57
  luot_2: dung
  nguon:
    - https://www.wam.hr/sadrzaj/us/Cavanagh_440Hz.pdf
    - https://www.britannica.com/art/pitch-music
  ghi_chu: "Cavanagh: hội nghị London 1939 thống nhất A=440 Hz làm chuẩn quốc tế; Britannica: chuẩn a′=440 được thông qua năm 1939."
- trang: nhac-ly/am-hoc
  id: n58
  luot_2: dung
  nguon:
    - https://www.wam.hr/sadrzaj/us/Cavanagh_440Hz.pdf
  ghi_chu: "Cavanagh trích New Grove: A=440 Hz được ISO tái khẳng định tháng 11/1955 và tháng 1/1975 (ISO 16)."
- trang: nhac-ly/am-hoc
  id: n59
  luot_2: dung
  nguon:
    - https://www.wam.hr/sadrzaj/us/Cavanagh_440Hz.pdf
    - https://www.britannica.com/art/pitch-music
  ghi_chu: 440 Hz là chuẩn quốc tế (Cavanagh, Britannica). Câu "phổ biến nhất" hợp lý, không có thống kê trong nguồn đã mở.
- trang: nhac-ly/am-hoc
  id: n61
  luot_2: khong-chac
  nguon:
    - https://www.britannica.com/art/pitch-music
  ghi_chu: Britannica chỉ nói vài nhà làm kèn gỗ châu Âu giữa thế kỷ 20 dùng 444; không nguồn bậc 2 đã mở nêu "nhiều dàn nhạc châu Âu 442-444".
- trang: nhac-ly/am-hoc
  id: n62
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/pitch-music
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Britannica: gia đình Hotteterre dùng khoảng a′=415, thấp hơn 440 một nửa cung; tự tính 440/2^(1/12) = 415,3 Hz; 1200 log2(440/415) = 101 cent. Nhóm nhạc Baroque hiện nay dùng 415 là thực hành phổ biến (không có thống kê trong nguồn)."
- trang: nhac-ly/am-hoc
  id: n63
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/pitch-music
  ghi_chu: "Hệ quả của n62: 415 Hz thấp hơn 440 Hz khoảng một nửa cung nên bản thu thấp hơn bản in nửa cung."
- trang: nhac-ly/am-hoc
  id: n65
  luot_2: dung
  nguon:
    - https://openstax.org/books/university-physics-volume-1/pages/16-6-standing-waves-and-resonance
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "Tự tính: hài 3 của Đô2 = 196,2 Hz (Sol3 = 196,0 Hz); hài 2 = Đô3 = 130,8 Hz; 3:2 = quãng 5; Mi3 = 164,8 Hz, không trùng."
- trang: nhac-ly/am-hoc
  id: n66
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/Pythagorean-tuning
    - https://www.animations.physics.unsw.edu.au/jw/beats.htm
  ghi_chu: "Britannica: Pythagorean tuning dựa trên quãng 5 tỉ lệ 3:2; UNSW: 2:1 quãng 8 (hài 2), 5:4 quãng 3 trưởng."
- trang: nhac-ly/am-hoc
  id: n67
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/equal-temperament
  ghi_chu: "Britannica: nửa cung bình quân 100 cent, 12 nửa cung = 1200 cent = quãng 8 (2^(12/12) = 2)."
- trang: nhac-ly/am-hoc
  id: n68
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/sound.spectrum.html
  ghi_chu: "UNSW: timbre khác nhau khi biên độ tương đối các thành phần phổ khác nhau, ở cùng cao độ và độ to. Ngoài phổ còn có yếu tố khởi âm (transient) nhưng câu của trang vẫn đúng ở mức cơ bản."
- trang: nhac-ly/am-hoc
  id: n69
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/pitch-music
  ghi_chu: "Britannica: ~a′=415 (Hotteterre), thấp hơn 440 nửa cung; xem n62."
- trang: nhac-ly/am-hoc
  id: n32
  luot_2: dung
  nguon: []
  ghi_chu: Bài tập quan sát phổ, vô hại.
- trang: nhac-ly/on-tap-1
  id: n4
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/pitches.html
  ghi_chu: 'OMT: "middle C (the first ledger line above the bass staff or the first ledger line below the treble staff) is C4".'
- trang: nhac-ly/on-tap-1
  id: n5
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/clef
  ghi_chu: "Britannica: khóa Fa cố định ở dòng thứ hai từ trên xuống (dòng 4 từ dưới); dòng khuông Fa: Sol Si Rê Fa La, nên các khe từ dưới lên là La, Đô, Mi, Sol: khe thứ 3 = Mi."
- trang: nhac-ly/on-tap-1
  id: n6
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/meter.html
    - https://openmusictheory.github.io/rhythmicValues.html
  ghi_chu: 3/4 = 3 phách đen; nốt trắng (2) + nốt đen (1) = 3 (OMT rhythmic values, meter).
- trang: nhac-ly/on-tap-1
  id: n7
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/rhythmicValues.html
  ghi_chu: "OMT: dấu chấm tăng nửa giá trị, dấu nối cộng thời gian: nốt trắng chấm (3) + đen (1) = 4 phách."
- trang: nhac-ly/on-tap-1
  id: n8
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/accidental
  ghi_chu: 'Britannica: "an accidental carries through the measure in which it occurs" (thực hành hiện đại). Hiệu lực cho cùng cao độ (cùng quãng tám) như câu viết.'
- trang: nhac-ly/on-tap-1
  id: n9
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/pitches.html
  ghi_chu: "OMT: lớp cao độ chung một phím là tương đương đồng âm; Mi-Fa không có phím đen giữa nên Mi♯ = Fa (cùng lập luận như C♭ = B trong OMT)."
- trang: nhac-ly/on-tap-1
  id: n10
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/meter.html
  ghi_chu: 'OMT: ở nhịp ghép "the beat is always three times as long as the division note": 6/8 = hai phách, mỗi phách chia ba móc đơn = 6 móc đơn mỗi ô.'
- trang: nhac-ly/on-tap-1
  id: n11
  luot_2: dung
  nguon:
    - https://newt.phys.unsw.edu.au/jw/notes.html
  ghi_chu: "UNSW: A4 = 440 Hz (MIDI 69); công thức 2^(n/12): Đô giữa (C4) = 261,6 Hz; A5 = 880 Hz."
- trang: nhac-ly/on-tap-1
  id: n12
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/pitches.html
  ghi_chu: "OMT: hai lớp cao độ cùng một phím là tương đương đồng âm; Sol♯ và La♭ cùng phím đen giữa Sol và La."
- trang: nhac-ly/on-tap-1
  id: n13
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/rhythmicValues.html
  ghi_chu: "OMT: mỗi dấu hiệu rút ngắn một nửa: móc kép = 1/4 đen; 8 x 1/4 = 2 phách = nốt trắng."
- trang: nhac-ly/on-tap-1
  id: n2
  luot_2: dung
  nguon: []
  ghi_chu: Lời khuyên học (lặp lại ngắt quãng), phổ biến và vô hại.
- trang: nhac-ly/on-tap-2
  id: n4
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/keySignatures.html
  ghi_chu: "OMT: thứ tự thăng F C G D A E B; Rê trưởng có hai thăng F♯ và C♯ (ví dụ giọng Rê trưởng trong trang). Gam Rê-Mi-Fa♯-Sol-La-Si-Đô♯ đúng."
- trang: nhac-ly/on-tap-2
  id: n5
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/keySignatures.html
  ghi_chu: "OMT: mỗi giọng trưởng chung hóa biểu với giọng thứ song song (A thứ - Đô trưởng); Mi thứ song song với Sol trưởng (1 thăng)."
- trang: nhac-ly/on-tap-2
  id: n6
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales.html
  ghi_chu: "OMT: thứ hòa âm nâng bậc 7 một nửa cung; La thứ: bậc 7 Sol lên Sol♯."
- trang: nhac-ly/on-tap-2
  id: n7
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/keySignatures.html
  ghi_chu: "Thứ tự thăng F C G D A: 5 thăng = Si trưởng, thăng thứ năm La♯; Si trưởng cách La♯ nửa cung (OMT key signatures, tự tính)."
- trang: nhac-ly/on-tap-2
  id: n8
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/keySignatures.html
  ghi_chu: "Hai giáng Si♭ Mi♭: Si♭ trưởng và Sol thứ song song (bậc VI của Si♭ trưởng là Sol). Cách nói trong ngoặc hơi rối nhưng đúng."
- trang: nhac-ly/on-tap-2
  id: n9
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: 'OMT: quãng 4 tăng cách 6 nửa cung ("one semitone wider than perfect", 5+1); Fa-Si dùng 4 tên nốt (Fa Sol La Si).'
- trang: nhac-ly/on-tap-2
  id: n10
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: "OMT: ví dụ C4-E4 (3 trưởng) đảo thành E4-C5 (6 thứ): Mi lên Đô là 6 thứ."
- trang: nhac-ly/on-tap-2
  id: n11
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/keySignatures.html
  ghi_chu: "OMT: giọng thăng đi theo chiều kim đồng hồ trên vòng quãng 5; Rê trưởng (2 thăng) rồi La trưởng (3 thăng) là thêm một thăng."
- trang: nhac-ly/on-tap-2
  id: n12
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales.html
  ghi_chu: 'OMT: gam trưởng đóng bằng "the ascending semitone between ti and do": bậc 7 (cảm âm) cách chủ âm nửa cung.'
- trang: nhac-ly/on-tap-2
  id: n13
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/intervals.html
  ghi_chu: "OMT: imperfect consonances = quãng 3 và 6; perfect = 5 đúng (và 1, 8); quãng 2 thứ là hòa âm nghịch."
- trang: nhac-ly/on-tap-2
  id: n3
  luot_2: dung
  nguon: []
  ghi_chu: Lời khuyên học, vô hại.
- trang: nhac-ly/on-tap-3
  id: n3
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/triads.html
  ghi_chu: "OMT: hợp âm ba giảm = m3 và d5 trên nốt gốc; Si-Rê-Fa: 3 thứ + 3 thứ."
- trang: nhac-ly/on-tap-3
  id: n4
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/triads.html
  ghi_chu: "OMT: dominant seventh = M3, P5, m7 trên gốc: Đô-Mi-Sol-Si♭ (Fa trưởng, bậc V là Đô)."
- trang: nhac-ly/on-tap-3
  id: n5
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/harmonicFunctions.html
    - https://openmusictheory.github.io/cadenceTypes.html
  ghi_chu: "OMT: chức năng át (V, V7) giải quyết về chủ; G7 -> C trong Đô trưởng."
- trang: nhac-ly/on-tap-3
  id: n6
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/thoroughbassFigures.html
  ghi_chu: 'OMT: ký hiệu 6/4 = "a sixth and a fourth above the bass" (thể đảo 2); Rê ở bè trầm của hợp âm Sol trưởng: Sol là quãng 4, Si là quãng 6 trên Rê.'
- trang: nhac-ly/on-tap-3
  id: n7
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/harmonicFunctions.html
  ghi_chu: "OMT: ii là tiền át (predominant), V át, I chủ; Sol trưởng: ii = La thứ (La-Đô-Mi), V = Rê trưởng, I = Sol: Am-D-G."
- trang: nhac-ly/on-tap-3
  id: n8
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/scales.html
  ghi_chu: "OMT: thứ hòa âm nâng bậc 7; La thứ: Sol♯ là cảm âm của hợp âm át Mi (Mi-Sol♯-Si)."
- trang: nhac-ly/on-tap-3
  id: n9
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/plagal-cadence
  ghi_chu: 'Britannica: kết plagal là chuyển từ IV về I, còn gọi "Amen cadence".'
- trang: nhac-ly/on-tap-3
  id: n10
  luot_2: khong-chac
  ghi_chu: 'Không mở được nguồn bậc 2 (Britannica Tempo không nêu "rit."): định nghĩa chuẩn ritardando = chậm dần.'
- trang: nhac-ly/on-tap-3
  id: n11
  luot_2: khong-chac
  ghi_chu: "Không mở được nguồn bậc 2 về sfz (Britannica về dynamics không mở được): sforzando = nhấn mạnh đột ngột theo hiểu biết chung."
- trang: nhac-ly/on-tap-3
  id: n12
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/triads.html
  ghi_chu: 'OMT: "diminished seventh (also called fully-diminished)": Si-Rê-Fa-La♭ = ba quãng 3 thứ liên tiếp (Si-La♭ = 7 giảm).'
- trang: nhac-ly/index
  id: n10
  luot_2: dung
  nguon:
    - https://openmusictheory.github.io/contents.html
    - https://openmusictheory.github.io/atonal.html
  ghi_chu: 'Mục lục OMT bản đầu có "Post-tonal music": Set theory (pitch-class sets, normal order...), "Analyzing atonal music", Twelve-tone. Không mở được mục lục bản Pressbooks hiện tại, nên chưa kiểm câu ở bản đó.'
