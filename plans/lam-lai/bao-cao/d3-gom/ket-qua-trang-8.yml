- trang: luyen-tai/choi-bang-tai
  id: n7
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly
  ghi_chu: "Ode to Joy (Mutopia, G truong): giai dieu B B C D = bac 3 3 4 5; o Do truong tuong ung Mi Mi Fa Sol, nen bat dau o bac 3 dung. Dinh nghia chu am la nha cua giong la chuan; khong mo them chuong OMT cho phan nay."
- trang: luyen-tai/choi-bang-tai
  id: n10
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/HoretzkyF/horetzky21/horetzky21.ly
  ghi_chu: "Au clair de la lune (Horetzky, Mutopia, Do truong): c c c d | e d ...: ba not Do lap, roi len liền bac. Chi kiem giai dieu, khong kiem so bai tren site."
- trang: luyen-tai/choi-bang-tai
  id: n11
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Frere Jacques: khong mo duoc ban nhac nao (Mutopia/IMSLP khong co). Giai dieu pho bien (Do Re Mi Do ...; cau cuoi Do Sol Do) co ve khop nhung chua co nguon da mo. Phan "bai 5" la ve site.'
- trang: luyen-tai/choi-bang-tai
  id: n12
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/MozartWA/KV265/guitar-duo-complete/guitar-duo-complete-lys/guitar-duo-complete.ly
  ghi_chu: 'Ah vous dirai-je (Mozart K.265 tren Mutopia, Do truong): c c | g g, tuc bat dau o Do, nhay quang 5 len Sol. Mutopia ghi nhip 2/4 (o 1 = c c, nhay o o 2); "o dau" dung neu site viet 4/4 (c c g g trong mot o). Phan so o/so bai la ve site.'
- trang: luyen-tai/choi-bang-tai
  id: n13
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Hanschen klein: khong mo duoc ban nhac nao. Giai dieu pho bien G E E (xuong quang 3 thu) co ve khop nhung chua co nguon."
- trang: luyen-tai/choi-bang-tai
  id: n14
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/Traditional/amazing-mutopia/amazing-mutopia.ly
  ghi_chu: "Amazing Grace (Mutopia, Mi giang truong, 9/8, nhip lay da): bes (bac 5) -> ees (bac 1) = quang 4 len; o Do truong la Sol -> Do, Sol thap hon Do. Dung."
- trang: luyen-tai/choi-bang-tai
  id: n15
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Largo "Going Home" (Dvorak, Giao huong 9): khong mo duoc ban nhac cua chu de (IMSLP chi co PDF bi chan; Mutopia khong co). Chua xac nhan "bat dau Mi, nhay quang 3 len Sol".'
- trang: luyen-tai/choi-bang-tai
  id: n18
  luot_2: dung
  nguon:
    - https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/greensleeves
  ghi_chu: "Concise Oxford Dictionary of Music: Greensleeves ghi lan dau trong So dang ky Stationers' Company nam 1580 (\"a new Northern Dittye of the Lady Greene Sleeves\"); co bang chung ra doi som hon; muc nay goi la \"Old Eng. tune\". Dung nhan dinh \"dan ca Anh + ballad 1580\". Nguon nay khong noi \"London\" ro rang (Stationers' Company la o London)."
- trang: luyen-tai/choi-bang-tai
  id: n19
  luot_2: khong-chac
  nguon: []
  ghi_chu: Nguon da mo (Britannica, Pentatonic scale) noi am giai ngu cung co mat o am nhac Dong Nam A, khong rieng Viet Nam; chua mo duoc nguon rieng ve nhac dan ca Viet (Britannica Vietnamese music, Grove deu loi). Cau "cung cau truc khoang cach voi gam ngu cung" can nguon rieng.
- trang: luyen-tai/choi-bang-tai
  id: n20
  luot_2: khong-chac
  nguon: []
  ghi_chu: Chua mo duoc nguon ve cao do khong co dinh cua thang nam am Viet (ornament, nhan nhip, vi am); y chung la hop ly nhung chua co nguon.
- trang: luyen-tai/choi-bang-tai
  id: n24
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/cadence-music
    - https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/cadence
  ghi_chu: 'Ket nua dung o V (Britannica: "ends the phrase on a dominant chord"); ket tron V-I (Britannica; Oxford: perfect cadence). Cau "ket ve nha thuong di V roi I" dung.'
- trang: luyen-tai/choi-bang-tai
  id: n26
  luot_2: khong-chac
  nguon: []
  ghi_chu: 'Cau ve vi du soan rieng cua site (o 3 lan dau, Fa cua giai dieu cho voi Mi hop am Do): khong kiem duoc vi khong doc khuong nhac cua site; ve phan dung, hai not Fa-Mi cach nhau nua cung la quang 2 thu va ro rang chat (OMT intervals), nhung "o 3 lan dau" la ve site.'
- trang: luyen-tai/choi-bang-tai
  id: n30
  luot_2: dung
  nguon:
    - https://earplaying.ioe.ac.uk
    - https://www.routledge.com/Music-Informal-Learning-and-the-School-A-New-Classroom-Pedagogy/Green/p/book/9780754665229
  ghi_chu: "Du an Ear Playing (Lucy Green, UCL IOE): dua cach hoc cua nhac cong nhac pho thong (nghe ban thu, choi theo) vao hoc nhac cu, thu nghiem ca trong day tu (private practice) va truong hoc. Sach 2008 cua Green (Routledge) ve hoc phi chinh quy trong lop. Dung."
- trang: luyen-tai/choi-bang-tai
  id: n31
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly
  ghi_chu: "Mutopia: B B C D | D C B A | G G A B | B. A A (G truong) = bac 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2. Dung."
- trang: luyen-tai/choi-bang-tai
  id: n32
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: Dich giong (transposition) la chuyen cung giai dieu sang chu am khac, giu nguyen chuoi bac; dinh nghia pho thong, nhat quan voi OMT (chuoi quang / bac). OMT intervals chi gian tiep ho tro.
- trang: luyen-tai/choi-bang-tai
  id: n35
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: "Fa truong co Si♭ (bac 4); Sol truong co Fa♯ (bac 7): dung theo hoa bieu giong truong. Chuong OMT Major Scales, Scale Degrees, and Key Signatures da mo (tom tat chi lay duoc tieu de)."
- trang: luyen-tai/choi-bang-tai
  id: n37
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: "The Fa tay phai F G A Si♭ C: ngon 4 roi vao Si♭ (phim den). Dung theo van ban ngon thong dung; Si♭ la bac 4 cua Fa truong."
- trang: luyen-tai/choi-bang-tai
  id: n38
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly
  ghi_chu: 'Mutopia: giai dieu G truong B B C D D C B A G G A B A: khong co phim den. V7 cua Sol truong = Re Fa♯ La Do: co Fa♯. "Tay trai" la theo khuong nhac cua site, khong kiem.'
- trang: luyen-tai/choi-bang-tai
  id: n39
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly
  ghi_chu: "F truong: Mi Mi Fa Sol -> La La Si♭ Do; not thu 3 = Si♭. Dung."
- trang: luyen-tai/choi-bang-tai
  id: n41
  luot_2: dung
  nguon:
    - https://giml.org/
    - https://giml.org/mlt/audiation/
  ghi_chu: 'GIML: Gordon la nguoi dat ra thuat ngu audiation ("the coiner of the term, audiation"); dinh nghia: hear and comprehend music when sound is no longer or never present. Dung.'
- trang: luyen-tai/choi-bang-tai
  id: n48
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly
  ghi_chu: "Nhu n7: Ode to Joy bat dau o bac 3 (Mi trong Do truong)."
- trang: luyen-tai/choi-bang-tai
  id: n49
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/inversion-and-figured-bass/
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: IV = Fa La Do (Fa la goc), V7 = Sol Si Re Fa (Fa la bac 7). Dung. "Nghe choi" la y kien su pham.
- trang: luyen-tai/choi-bang-tai
  id: n50
  luot_2: dung
  nguon:
    - https://www.mutopiaproject.org/ftp/BeethovenLv/ode/ode.ly
    - https://viva.pressbooks.pub/openmusictheory/chapter/major-scales/
  ghi_chu: "Fa truong: bac 4 = Si♭; Ode to Joy co bac 4 (Fa trong Do truong) -> Si♭; o the Fa, ngon 4 vao Si♭. Dung."
- trang: luyen-tai/choi-bang-tai
  id: n5
  luot_2: dung
  nguon: []
  ghi_chu: khuyen-tap hop ly, hop cach day pho bien
- trang: luyen-tai/choi-bang-tai
  id: n27
  luot_2: dung
  nguon: []
  ghi_chu: khuyen-tap hop ly, hop cach day pho bien
- trang: luyen-tai/choi-bang-tai
  id: n1
  luot_2: dung
  nguon: []
  ghi_chu: khuyen-tap hop ly, hop cach day pho bien
- trang: luyen-tai/nghe-gam
  id: n3
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "Bac 3 la not khac nhau chinh giua truong va thu (thu: ha bac 3 so voi truong, OMT minor-scales). Dung."
- trang: luyen-tai/nghe-gam
  id: n4
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
    - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: "Mi trong Do truong la 3 truong; Mi♭ thap nua cung la 3 thu (OMT: gam thu ha bac 3). Dung."
- trang: luyen-tai/nghe-gam
  id: n5
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: Chu am (tonic) la not "nha"/trung tam; thuong la not ket. Dung theo cach dung pho thong; OMT dung "tonic"/do.
- trang: luyen-tai/nghe-gam
  id: n7
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "OMT: 3 dang thu (natural, harmonic, melodic); harmonic nang bac 7, melodic nang bac 6, 7 khi di len (di xuong gionh natural). Dung."
- trang: luyen-tai/nghe-gam
  id: n8
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "La thu tu nhien: La Si Do Re Mi Fa Sol: bac 6,7 = Fa Sol. Dung."
- trang: luyen-tai/nghe-gam
  id: n9
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "La thu hoa am: bac 7 nang: Fa Sol♯. Dung."
- trang: luyen-tai/nghe-gam
  id: n10
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
    - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: 'Fa-Sol♯ = 3 nua cung (OMT: "3Hs"), la quang 2 tang (1 cung + 1 nua cung). Dung.'
- trang: luyen-tai/nghe-gam
  id: n11
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: 'Quang 2 tang trong hoa am: dac trung cua gam thu hoa am; "nghe gai" la cam nhan chu quan.'
- trang: luyen-tai/nghe-gam
  id: n12
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "Melodic minor: len = nang bac 6,7 (Fa♯ Sol♯), xuong = natural (Fa Sol). Dung."
- trang: luyen-tai/nghe-gam
  id: n13
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "OMT: melodic minor di len chi ha bac 3 so voi truong; di xuong giong natural. Dung."
- trang: luyen-tai/nghe-gam
  id: n14
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
    - https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/
  ghi_chu: Nang bac 7 tao not dan (leading tone) -> V la hop am truong/V7 trong giong thu; quang 2 tang dac trung. Dung (OMT minor-scales, seventh-chords).
- trang: luyen-tai/nghe-gam
  id: n15
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: 'OMT: Dorian = "like the natural minor scale, but with a raised scale degree 6". Dung.'
- trang: luyen-tai/nghe-gam
  id: n16
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: Dorian co bac 6 nang nen sang hon thu tu nhien; OMT noi cac mode "major-ish/minor-ish" theo quang 3. Cam nhan "sang hon" la phu hop.
- trang: luyen-tai/nghe-gam
  id: n17
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "OMT: Phrygian = natural minor voi bac 2 ha; buoc dau (1-♭2) = nua cung. Dung."
- trang: luyen-tai/nghe-gam
  id: n18
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: 'Phrygian: minor-ish, bac 2 ha; "nghe toi" la cam nhan chu quan, phu hop mo ta pho bien.'
- trang: luyen-tai/nghe-gam
  id: n19
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: "OMT: Lydian = major voi bac 4 nang. Dung."
- trang: luyen-tai/nghe-gam
  id: n20
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: Lydian major-ish (OMT); "mo mang, lo lung" chu quan.
- trang: luyen-tai/nghe-gam
  id: n21
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: "OMT: Mixolydian = major voi bac 7 ha. Dung."
- trang: luyen-tai/nghe-gam
  id: n22
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: "Mixolydian major-ish, bac 7 ha nen bot choi: mo ta phu hop."
- trang: luyen-tai/nghe-gam
  id: n23
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/Locrian-mode
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: "Britannica: Locrian = cac phim trang B-B (B C D E F G A): so voi thu tu nhien (A..) co bac 2 ha (B-C) va bac 5 giam (B-F). Dung. OMT diatonic-modes khong nhac Locrian."
- trang: luyen-tai/nghe-gam
  id: n24
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/Locrian-mode
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: "Tren B: B D F = hop am ba giam (3 thu + 5 giam, OMT triads); Britannica noi Locrian bi loai khoi he Glareanus vi tritone B-F. Dung."
- trang: luyen-tai/nghe-gam
  id: n25
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: La thu voi Fa♯ thay Fa = Dorian (bac 6 nang); Do truong voi Si♭ = Mixolydian (bac 7 ha). Dung.
- trang: luyen-tai/nghe-gam
  id: n28
  luot_2: sai
  nguon:
    - https://www.britannica.com/art/pentatonic-scale
  cau_dung: "Gam ngu cung pho bien nhat (anhemitonic: Do Re Mi Sol La) co 5 not va khong co nua cung; cung co loai hemitonic (co nua cung)."
  ghi_chu: 'Britannica Pentatonic scale: anhemitonic la dang pho bien (c-d-f-g-a), hemitonic (co nua cung, vd c-e-f-g-b) it gap hon. Cau phat bieu chung "khong co nua cung" qua rong; dung neu hieu la gam ngu cung truong.'
- trang: luyen-tai/nghe-gam
  id: n29
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/pentatonic-scale
  ghi_chu: Mo ta cam nhan cho gam ngu cung pho bien; Britannica khong noi dieu nay. Phan "5 not" dung.
- trang: luyen-tai/nghe-gam
  id: n30
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/pentatonic-scale
  ghi_chu: "Britannica: co mat o am nhac nguoi Native American, chau Phi, Dong va Dong Nam A (nhieu dan ca chau Au). Viet Nam thuoc Dong Nam A: dung o muc chung; chua co nguon rieng cho Viet Nam."
- trang: luyen-tai/nghe-gam
  id: n31
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/intervals/
  ghi_chu: "Gam toan cung: 6 not, toan cung lien tiep, khong nua cung. OMT khong mo duoc chuong rieng; kien thuc chuan (6 cung toan). Nguon OMT intervals chi gian tiep."
- trang: luyen-tai/nghe-gam
  id: n38
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ghi_chu: Nhu n3.
- trang: luyen-tai/nghe-gam
  id: n39
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
    - https://viva.pressbooks.pub/openmusictheory/chapter/seventh-chords/
  ghi_chu: Quang 2 tang Fa-Sol♯ o cuoi gam thu hoa am; Sol♯ la not dan, V7. Dung.
- trang: luyen-tai/nghe-gam
  id: n40
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/diatonic-modes/
  ghi_chu: Gam thu co bac 6 nang = Dorian. Dung.
- trang: luyen-tai/nghe-gam
  id: n41
  luot_2: dung
  nguon:
    - https://www.britannica.com/art/pentatonic-scale
  ghi_chu: "Ngu cung anhemitonic: toan cung va quang 3 thu (Do Re Mi Sol La: 1,1,1.5,1.5,1.5 cung). Dung cho dang pho bien; xem n28."
- trang: luyen-tai/nghe-gam
  id: n6
  luot_2: dung
  nguon: []
  ghi_chu: khuyen-tap hop ly, hop cach day pho bien
