  ghi_chu: khuyen-tap hop ly, hop cach day pho bien
- trang: luyen-tai/nghe-hop-am
  id: n4
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: "OMT: major, minor, diminished, augmented. Dung."
- trang: luyen-tai/nghe-hop-am
  id: n5
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: "Major triad: 3 truong + 5 dung: Do Mi Sol. Dung."
- trang: luyen-tai/nghe-hop-am
  id: n6
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: "Mo ta cam nhan (sang, vui, vung chai) cho hop am truong: pho bien, khong co nguon dinh luong."
- trang: luyen-tai/nghe-hop-am
  id: n7
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: Do Mi♭ Sol. Dung.
- trang: luyen-tai/nghe-hop-am
  id: n8
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: Truong va thu khac nhau o quang 3 (not giua). Dung; cam nhan toi/buon pho bien.
- trang: luyen-tai/nghe-hop-am
  id: n9
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: "Giam = 3 thu + 5 giam: Do Mi♭ Sol♭. Dung."
- trang: luyen-tai/nghe-hop-am
  id: n10
  luot_2: dung
  nguon:
    - https://viva.pressbooks.pub/openmusictheory/chapter/triads/
  ghi_chu: "Mo ta cam nhan (can, bat on): pho bien, khong co nguon dinh luong."
