- trang: nhac-ly/28-ket-cau
  id: n1
  cau: Kết cấu mô tả có bao nhiêu đường nét âm nhạc vang cùng lúc và chúng liên hệ nhau thế nào
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n2
  cau: 'So sánh với cách dệt của tấm vải: một sợi, nhiều sợi song song, hay đan chéo'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n3
  cau: 'Kết cấu là manh mối nhận diện thời kỳ: đơn âm thường gặp ở Trung cổ, phức điệu ở Phục hưng và Baroque, chủ điệu ở Cổ điển và Lãng mạn'
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n4
  cau: 'Có bốn loại kết cấu: đơn âm, chủ điệu, phức điệu, dị âm'
  loai: danh-muc
- trang: nhac-ly/28-ket-cau
  id: n5
  cau: Tất cả ví dụ dùng cùng giai điệu Frère Jacques
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n6
  cau: 'Đơn âm: một giai điệu duy nhất, không đệm'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n7
  cau: Nhiều người cùng hát một giai điệu, kể cả cách nhau quãng 8, vẫn là đơn âm
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n8
  cau: Thánh ca Gregorian là đơn âm
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n9
  cau: Debussy Syrinx là tác phẩm cho sáo độc tấu (đơn âm)
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n10
  cau: Phần mở đầu một fugue, chủ đề vang lên một mình, là đơn âm
  loai: cau-truc
- trang: nhac-ly/28-ket-cau
  id: n11
  cau: 'Chủ điệu: một giai điệu chính cùng phần đệm hợp âm'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n12
  cau: Phần đệm chủ điệu có thể là hợp âm cùng tiết tấu (như thánh ca bốn bè) hoặc hình đệm riêng
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n13
  cau: Bè Alberti của Mozart và hợp âm rải của Chopin là hình đệm riêng
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n14
  cau: Chủ điệu gặp ở nhiều nhạc Cổ điển và Lãng mạn, thánh ca, rất nhiều bài hát pop
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n15
  cau: 'Phức điệu: nhiều giai điệu độc lập cùng lúc, bè nào cũng quan trọng'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n16
  cau: 'Một loại quen thuộc của phức điệu là phức điệu mô phỏng: các bè lần lượt bắt chước (canon, fugue)'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n17
  cau: Phức điệu gặp ở nhạc Phục hưng, fugue và invention của Bach, đoạn phát triển trong giao hưởng
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n18
  cau: 'Dị âm: cùng một giai điệu, mỗi người chơi một phiên bản hơi khác (thường là trang trí thêm), vang cùng lúc'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n19
  cau: Đờn ca tài tử được phân tích như một lối dị âm trang trí
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n20
  cau: Gamelan là kết cấu dị âm
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n21
  cau: Nhạc cổ điển Ả Rập có dị âm
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n22
  cau: Trong nhạc cổ điển phương Tây dị âm hiếm
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n23
  cau: 'Hình texture-rolls: cùng giai điệu (xanh) trong bốn kết cấu dạng piano roll; màu vàng là phần thêm vào'
  loai: cau-truc
- trang: nhac-ly/28-ket-cau
  id: n26
  cau: Một fugue bắt đầu đơn âm rồi thành phức điệu
  loai: cau-truc
- trang: nhac-ly/28-ket-cau
  id: n27
  cau: Một chương giao hưởng có thể chuyển từ chủ điệu sang phức điệu ở phần phát triển
  loai: cau-truc
- trang: nhac-ly/28-ket-cau
  id: n28
  cau: 'Dày hay mỏng: bao nhiêu nhạc cụ, bao nhiêu nốt vang cùng lúc'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n29
  cau: 'Âm vực: các bè dồn sát hay trải rộng từ rất trầm đến rất cao'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n30
  cau: Dàn nhạc Lãng mạn cuối thế kỷ 19 thường trải âm vực rất rộng
  loai: lich-su
- trang: nhac-ly/28-ket-cau
  id: n31
  cau: 'Quiz: hợp xướng nam nữ cách nhau quãng 8 là đơn âm; bè Alberti là chủ điệu; fugue là phức điệu; đờn ca tài tử là dị âm'
  loai: dinh-nghia
- trang: nhac-ly/28-ket-cau
  id: n32
  cau: Tác giả chương OMT Texture là Mark Gotham, Samuel Brady
  loai: ten
- trang: nhac-ly/28-ket-cau
  id: n33
  cau: 'Bài báo Intersections 41, số 1: tên và tác giả Nguyễn Thanh Thủy, Stefan Östersjö'
  loai: ten
- trang: nhac-ly/28-ket-cau
  id: n25
  cau: 'Mẹo nghe: thử hát theo; chỉ có một giai điệu để hát là đơn âm hay chủ điệu, phải chọn giữa nhiều giai điệu là phức điệu'
  loai: khuyen-tap
- trang: nhac-ly/28-ket-cau
  id: n24
  cau: 'Mẹo nghe: đếm số đường nét độc lập (một: đơn âm; một rõ ràng, còn lại đứng sau: chủ điệu; hai trở lên ngang hàng: phức điệu)'
  loai: khuyen-tap
- trang: nhac-ly/29-chuoi-hoa-am
  id: n1
  cau: Chuỗi (sequence) là một mẫu nhạc ngắn được lặp lại liên tiếp ở các cao độ khác nhau, đi lên hoặc đi xuống đều đặn như những bậc cầu thang.
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n2
  cau: Chuỗi rất hay gặp trong nhạc tonal, nhất là thời Baroque.
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n3
  cau: Nghe thấy chuỗi là một manh mối để nhận diện nhạc Baroque, như nhạc Bach và Vivaldi.
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n5
  cau: Môtip Mi – Rê – Mi – Đô được nhắc lại ba lần, mỗi lần thấp hơn một bậc.
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n6
  cau: Một môtip được nhắc lại, mỗi lần thấp hơn (hoặc cao hơn) một bậc, là chuỗi giai điệu.
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n7
  cau: Chuỗi hòa âm tiêu biểu là bè trầm đi xuống quãng 5 (hoặc lên quãng 4) liên tục, đi qua mọi hợp âm của giọng.
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n8
  cau: Gốc của mỗi hợp âm cách gốc hợp âm tiếp theo một quãng 5, như quan hệ át – chủ (riêng cặp Fa – Si là quãng 5 giảm), nên chuỗi tạo lực kéo về phía trước.
  loai: quy-tac
- trang: nhac-ly/29-chuoi-hoa-am
  id: n9
  cau: 'Chuỗi quãng 5 đi xuống trong Đô trưởng: I – IV – vii° – iii – vi – ii – V – I.'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n10
  cau: Bè trầm Đô – Fa – Si – Mi – La – Rê – Sol – Đô cứ xuống quãng 5 rồi lên quãng 4 xen kẽ (riêng Fa xuống Si là quãng 5 giảm).
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n12
  cau: 'Bảng: chuỗi quãng 5 đi xuống: bè trầm xuống 5, lên 4; C – F – B° – Em – Am – Dm – G – C.'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n13
  cau: 'Bảng: chuỗi quãng 5 đi xuống thường gặp trong nhạc tonal; nhạc jazz nối các vòng ii – V – I.'
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n14
  cau: 'Bảng: chuỗi quãng 3 đi xuống: bè trầm xuống 3; C – Am – F – Dm.'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n15
  cau: 'Bảng: kiểu Pachelbel: bè trầm xuống 4, lên một bậc (lặp lại), rồi kết; C – G – Am – Em – F – C – F – G.'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n17
  cau: Bè trầm của Canon Pachelbel đi bậc 1–5–6–3–4–1–4–5, mở đầu bằng công thức bè trầm Romanesca.
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n19
  cau: 'Bảng: chuỗi 5 – 6 đi lên: bè trầm lên từng bậc, bè trên đổi quãng 5 thành quãng 6 trên mỗi nốt bass; C – Am/C – Dm – B°/D – Em….'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n21
  cau: 'Bảng: chuỗi nửa cung: bè trầm đi xuống từng nửa cung; gặp trong nhạc Lãng mạn, ví dụ Chopin.'
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n22
  cau: 'Vivaldi, Concerto Mùa đông (Op. 8 số 4), chương 2, ô 11–13: một chuỗi 5–6 đi lên.'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n24
  cau: 'Albéniz, Catalonia (số 34–36 trong tổng phổ): một chuỗi quãng 5 đi xuống.'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n25
  cau: 'Amanda Maier, Sáu tiểu phẩm cho violin, số 6, ô 162–169: một chuỗi quãng 3 đi xuống.'
  loai: cau-truc
- trang: nhac-ly/29-chuoi-hoa-am
  id: n26
  cau: 'Vivaldi Mùa xuân: các đoạn độc tấu violin đầy chuỗi giai điệu.'
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n27
  cau: 'Handel Messiah, Hallelujah: nhiều chuỗi tạo cảm giác hân hoan dâng lên.'
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n28
  cau: 'Bach, Prelude cung Đô thứ BWV 847: những hình nốt lặp lại trên chuỗi hợp âm.'
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n29
  cau: 'Bài tập 1: viết chuỗi quãng 5 đi xuống trong Sol trưởng (bè trầm: Sol – Đô – Fa♯ – Si – Mi – La – Rê – Sol).'
  loai: so-lieu
- trang: nhac-ly/29-chuoi-hoa-am
  id: n32
  cau: 'Câu hỏi 1: "Chuỗi hòa âm là gì?" Đáp án: một mẫu nhạc lặp lại liên tiếp ở các cao độ khác nhau (giải thích: giống như các bậc cầu thang).'
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n33
  cau: 'Câu hỏi 2: trong chuỗi quãng 5 đi xuống, bè trầm xuống quãng 5 và lên quãng 4 xen kẽ (giải thích: Đô – Fa – Si – Mi…).'
  loai: dinh-nghia
- trang: nhac-ly/29-chuoi-hoa-am
  id: n34
  cau: 'Câu hỏi 3: "Chuỗi thường được nhắc tới nhiều nhất khi nói về nhạc của thời kỳ nào?" Đáp án: Baroque (giải thích: chuỗi có mặt ở mọi thời, nhưng đặc biệt dễ nghe thấy trong nhạc Baroque, như Bach và Vivaldi).'
  loai: lich-su
- trang: nhac-ly/29-chuoi-hoa-am
  id: n30
  cau: 'Bài tập 2: hát (hoặc chơi trên bàn phím) chuỗi giai điệu ở trên, rồi tự sáng tác một môtip 4 nốt và nhắc lại ba lần, mỗi lần thấp hơn một bậc.'
  loai: khuyen-tap
- trang: nhac-ly/29-chuoi-hoa-am
  id: n20
  cau: Chuỗi 5 – 6 đi lên tạo cảm giác dâng lên, tích tụ.
  loai: khuyen-tap
- trang: nhac-ly/29-chuoi-hoa-am
  id: n11
  cau: Bạn sẽ nghe thấy cái "đi tới" không cưỡng lại được của chuỗi này.
  loai: khuyen-tap
- trang: nhac-ly/30-phat-trien-motip
  id: n1
  cau: Phát triển môtip là lấy một ý tưởng ngắn rồi biến đổi nó theo những cách có hệ thống; nhờ đó một ý tưởng vài nốt có thể trở thành cả một chương giao hưởng.
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n3
  cau: 'Môtip là ý tưởng âm nhạc ngắn nhất còn nhận ra được: vài nốt với một tiết tấu và đường nét đặc trưng.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n4
  cau: 'Một ví dụ nổi tiếng của môtip: bốn nốt mở đầu Giao hưởng số 5 của Beethoven.'
  loai: lich-su
- trang: nhac-ly/30-phat-trien-motip
  id: n6
  cau: 'Khối abc 1, "Môtip gốc": nghỉ móc đơn, Sol Sol Sol (móc đơn), Mi♭ (nốt trắng), giọng Đô thứ, nhịp 2/4.'
  loai: cau-truc
- trang: nhac-ly/30-phat-trien-motip
  id: n8
  cau: 'Nhắc lại: lặp nguyên vẹn.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n9
  cau: 'Chuỗi: lặp ở cao độ khác (xem bài 29); ví dụ Fa Fa Fa Rê.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n10
  cau: 'Chuỗi: Beethoven cũng nhắc môtip ở nhiều cao độ khác nhau.'
  loai: lich-su
- trang: nhac-ly/30-phat-trien-motip
  id: n12
  cau: 'Đảo: lật ngược hướng, đi xuống thành đi lên; ví dụ Sol Sol Sol Si (đi lên quãng 3 thay vì đi xuống).'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n13
  cau: 'Ngược: chơi từ cuối về đầu; ví dụ Mi♭ Sol Sol Sol.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n14
  cau: 'Nới rộng (augmentation): kéo dài trường độ, thường gấp đôi; mỗi nốt dài gấp đôi.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n16
  cau: 'Thu hẹp (diminution): rút ngắn trường độ; nhanh gấp đôi.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n18
  cau: 'Chia nhỏ (fragmentation): chỉ giữ một mảnh; ví dụ chỉ còn "Sol Sol Sol" lặp lại.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n19
  cau: 'Đổi quãng: giữ tiết tấu, đổi khoảng cách; ví dụ Sol Sol Sol Đô (nhảy xuống quãng 5).'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n20
  cau: Trong chương 1 Giao hưởng số 5, Beethoven dùng nhiều kỹ thuật trong số này.
  loai: lich-su
- trang: nhac-ly/30-phat-trien-motip
  id: n21
  cau: 'Phần phát triển (chương 1 Giao hưởng số 5) cũng dùng chia nhỏ: một mảnh nhạc rút từ chủ đề cầu nối bị cắt còn hai nốt, rồi một nốt, chuyền qua lại giữa bộ dây và bộ gỗ.'
  loai: cau-truc
- trang: nhac-ly/30-phat-trien-motip
  id: n24
  cau: 'Đoạn nhạc (period): câu hỏi kết nửa, câu trả lời kết trọn.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n25
  cau: Nhạc Cổ điển còn một cấu trúc phổ biến không kém đoạn nhạc, gọi là câu (sentence).
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n26
  cau: Câu thường dài 4 hoặc 8 ô nhịp; bảng dưới là một câu 8 ô nhịp.
  loai: quy-tac
- trang: nhac-ly/30-phat-trien-motip
  id: n27
  cau: 'Trình bày (presentation), ô nhịp 1–4: một ý cơ bản 2 ô nhịp, rồi nhắc lại ngay (có thể ở hợp âm khác).'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n28
  cau: 'Tiếp nối (continuation), ô nhịp 5–8: chia nhỏ ý cơ bản thành mảnh ngắn hơn, nhịp điệu dồn dập hơn, rồi kết bằng một kết.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n29
  cau: 'Ví dụ kinh điển: 8 ô nhịp mở đầu Sonata piano số 1 của Beethoven, Op. 2 số 1 (Fa thứ): hợp âm rải đi lên 2 ô nhịp, nhắc lại ở hợp âm át, rồi các mảnh ngắn dần dồn tới kết nửa.'
  loai: cau-truc
- trang: nhac-ly/30-phat-trien-motip
  id: n31
  cau: 'Mở rộng câu nhạc: kéo dài một hợp âm trước kết, làm lại phần kết sau khi lần kết đầu bị né tránh (xem bài 13 về kết lừa), hoặc thêm một đoạn đuôi (codetta) sau kết.'
  loai: quy-tac
- trang: nhac-ly/30-phat-trien-motip
  id: n34
  cau: 'Đáp án câu 1: Đảo (bắt đầu từ Mi): Mi Mi Rê Đô. Ngược: Sol Fa Mi Mi. Nới rộng: Mi Mi Fa Sol với mỗi nốt dài gấp đôi.'
  loai: so-lieu
- trang: nhac-ly/30-phat-trien-motip
  id: n36
  cau: 'Câu hỏi 1: lật ngược hướng của các quãng trong môtip gọi là đảo (không phải ngược, chuỗi).'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n37
  cau: 'Câu hỏi 2: chỉ giữ lại một mảnh của môtip và lặp lại nó gọi là chia nhỏ; giải thích: phần phát triển chương 1 Giao hưởng số 5 cũng dùng cách này.'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n38
  cau: 'Câu hỏi 3: trong cấu trúc câu, phần trình bày gồm một ý cơ bản và lần nhắc lại của nó (giải thích: phần tiếp nối mới chia nhỏ và dẫn tới kết).'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n39
  cau: 'Câu hỏi 4: kéo dài trường độ của môtip gọi là nới rộng (giải thích: Augmentation).'
  loai: dinh-nghia
- trang: nhac-ly/30-phat-trien-motip
  id: n32
  cau: Khi nghe một câu nhạc dài hơn mức thông thường (4 hoặc 8 ô nhịp), hãy tìm xem đoạn nào được thêm vào.
  loai: khuyen-tap
- trang: nhac-ly/30-phat-trien-motip
  id: n2
  cau: Hiểu các kỹ thuật này, bạn sẽ nghe ra "logic" trong nhạc Beethoven, Brahms, và nhận ra vì sao nhạc của họ nghe chặt chẽ đến vậy.
  loai: khuyen-tap
- trang: nhac-ly/30-phat-trien-motip
  id: n33
  cau: 'Bài tập 1: lấy môtip đầu Ode to Joy (Mi Mi Fa Sol), viết bản đảo, bản ngược, bản nới rộng.'
  loai: khuyen-tap
- trang: nhac-ly/31-hinh-thuc-nho
  id: n1
  cau: Các hình thức lớn như sonata và rondo được xây từ những khối nhỏ hơn.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n3
  cau: 'Hình thức hai đoạn (binary) là A B, thường với dấu nhắc lại cho mỗi phần: ‖: A :‖ ‖: B :‖.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n4
  cau: Phần A bắt đầu ở giọng chính và thường chuyển sang giọng át; ở giọng thứ thì sang giọng trưởng song song.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n5
  cau: Phần lớn các điệu nhảy Baroque ở hình thức hai đoạn có phần A chuyển sang giọng át.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n6
  cau: 'Minuet Sol thứ: phần A kết ở Si♭ trưởng.'
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n8
  cau: Phần A có thể dừng ở kết nửa trên hợp âm át, như La candeur.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n10
  cau: Phần A cũng có thể kết trọn ngay ở giọng chính, như Minuet Sol trưởng, nơi chỉ phần B mới sang Rê trưởng.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n12
  cau: Phần B bắt đầu từ giọng mà phần A vừa kết, đi qua vài giọng khác, rồi trở về giọng chính để kết.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n13
  cau: Gần như mọi điệu nhảy trong tổ khúc Baroque (allemande, courante, sarabande, gigue) đều ở hình thức hai đoạn.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n14
  cau: Minuet cung Sol trưởng trong sổ tay Anna Magdalena Bach (Petzold) là ví dụ dễ nghe.
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n16
  cau: 'Hai đoạn có tái hiện (rounded binary) là A B A, với hai dấu nhắc lại ‖: A :‖ ‖: B A'' :‖; phần hai kết bằng việc đưa chủ đề đầu trở lại, giờ ở giọng chính.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n17
  cau: Hai đoạn có tái hiện là "mầm mống" của hình thức sonata.
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n19
  cau: Hai đoạn có tái hiện là hình thức điển hình của minuet thời Cổ điển.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n20
  cau: Hình thức ba đoạn (ternary) là A B A, trong đó mỗi đoạn trọn vẹn và tự kết ở giọng của nó.
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n21
  cau: Trong ba đoạn, B tương phản rõ với A (giọng khác, tính chất khác); B là một thế giới riêng, không chỉ là đoạn chuyển tiếp.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n22
  cau: Nhiều tiểu phẩm piano Lãng mạn như nocturne, mazurka ở hình thức ba đoạn.
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n23
  cau: Chopin Prélude Op. 28 số 15 "Giọt mưa" ở hình thức ba đoạn.
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n24
  cau: 'Aria da capo trong opera Baroque: A, B, rồi "da capo" quay lại A.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n25
  cau: Ở lần A thứ hai của aria da capo, ca sĩ thêm trang trí.
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n26
  cau: 'Musette Rê trưởng: đoạn A và B đều có dấu nhắc lại như hình thức hai đoạn.'
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n27
  cau: 'Musette Rê trưởng: đoạn B kết ở giọng át (La trưởng).'
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n28
  cau: 'Do đó đoạn A được chơi lại từ đầu (da capo): A B A.'
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n30
  cau: Chương 3 tiêu chuẩn của giao hưởng thời Cổ điển, cũng dùng trong nhiều thể loại khác, là minuet và trio.
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n31
  cau: Minuet và trio ghép thành một A B A lớn; mỗi khối là một hình thức hai đoạn, thường có tái hiện.
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n32
  cau: 'Bảng: minuet là điệu nhảy nhịp 3/4.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n33
  cau: 'Bảng: trio tương phản, thường nhẹ nhàng hơn, thường ở giọng khác.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n34
  cau: 'Bảng: sau trio, minuet được chơi lại (da capo), thường bỏ các dấu nhắc lại.'
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n36
  cau: 'Từ Beethoven, minuet thường được thay bằng scherzo: nhanh hơn nhiều, nhưng giữ khung scherzo, trio, scherzo.'
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n38
  cau: 'Bảng ca khúc: theo khổ (strophic): mọi khổ lời hát cùng một giai điệu.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n39
  cau: 'Ví dụ theo khổ: Schubert Heidenröslein.'
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n40
  cau: 'Ví dụ theo khổ: nhiều dân ca, thánh ca.'
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n41
  cau: 'Theo khổ có biến đổi: cùng giai điệu nhưng có khổ được thay đổi; ví dụ nhiều ca khúc của Brahms.'
  loai: danh-muc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n42
  cau: 'Xuyên suốt (through-composed): nhạc mới cho mỗi đoạn lời, đi theo câu chuyện.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n43
  cau: Schubert Erlkönig là ví dụ xuyên suốt.
  loai: nam
- trang: nhac-ly/31-hinh-thuc-nho
  id: n48
  cau: 'Quiz 1: trong hai đoạn ở giọng trưởng, phần A thường kết ở giọng át; giải thích: phần B mới đưa nhạc về giọng chính.'
  loai: quy-tac
- trang: nhac-ly/31-hinh-thuc-nho
  id: n49
  cau: 'Quiz 2: minuet và trio tạo thành A B A; giải thích: minuet, trio, minuet da capo.'
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n50
  cau: 'Quiz 3: ca khúc mà mọi khổ cùng một giai điệu là theo khổ; giải thích: ví dụ nhiều dân ca và thánh ca.'
  loai: dinh-nghia
- trang: nhac-ly/31-hinh-thuc-nho
  id: n51
  cau: 'Quiz 4: từ Beethoven, chương minuet thường được thay bằng scherzo; giải thích: nhanh hơn, nhiều năng lượng hơn.'
  loai: lich-su
- trang: nhac-ly/31-hinh-thuc-nho
  id: n52
  cau: 'Hình form-small, sơ đồ 1 (hai đoạn): ‖: A :‖ ‖: B :‖.'
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n53
  cau: 'Hình form-small, sơ đồ 2 (hai đoạn có tái hiện): ‖: A (thường → giọng át) :‖ ‖: B A'' :‖.'
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n54
  cau: 'Hình form-small, sơ đồ 3 (ba đoạn): A B A, mỗi đoạn trọn vẹn.'
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n55
  cau: 'Hình form-small, sơ đồ 4 (minuet-trio): minuet ‖:a:‖ ‖:b a'':‖, trio ‖:c:‖ ‖:d (c''):‖, minuet da capo; chú thích: mỗi khối là hai đoạn, thường có tái hiện.'
  loai: cau-truc
- trang: nhac-ly/31-hinh-thuc-nho
  id: n47
  cau: 'Mẹo nghe 3: tìm đoạn giữa tương phản rõ (giọng khác, tính chất khác) thì là ba đoạn, hoặc minuet, trio.'
  loai: khuyen-tap
- trang: nhac-ly/31-hinh-thuc-nho
  id: n46
  cau: 'Mẹo nghe 2: chủ đề đầu quay lại ở cuối phần hai thì là hai đoạn có tái hiện hoặc ba đoạn.'
  loai: khuyen-tap
- trang: nhac-ly/31-hinh-thuc-nho
  id: n45
  cau: 'Mẹo nghe 1: nghe cùng một đoạn vang hai lần liên tiếp là dấu hiệu của hình thức hai đoạn.'
  loai: khuyen-tap
