- trang: nghe-nhac/brahms-4
  id: n1
  cau: "Bảng: Johannes Brahms (1833–1897)."
  loai: nam
- trang: nghe-nhac/brahms-4
  id: n2
  cau: "Bảng: Tên đầy đủ: Giao hưởng số 4 cung Mi thứ, Op. 98."
  loai: danh-muc
- trang: nghe-nhac/brahms-4
  id: n3
  cau: "Bảng: Sáng tác 1884–1885."
  loai: nam
- trang: nghe-nhac/brahms-4
  id: n4
  cau: "Bảng: Công diễn tháng 10/1885 tại Meiningen, Brahms chỉ huy."
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n5
  cau: "Bảng: Thời kỳ Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n6
  cau: "Bảng: Chương 4 là Allegro energico e passionato, dài khoảng 10 phút."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n7
  cau: "Brahms là nhà soạn nhạc Lãng mạn quan tâm sâu tới âm nhạc quá khứ: ông học đối âm và nghiên cứu nhạc Bach."
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n8
  cau: Chương cuối Giao hưởng số 4 là ví dụ nổi tiếng nhất cho mối quan tâm ấy.
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n9
  cau: Passacaglia (hay chaconne) là hình thức Baroque gồm một chủ đề ngắn lặp lại liên tục, với biến tấu mới ở mỗi lần; ở đây chủ đề dài 8 ô nhịp.
  loai: dinh-nghia
- trang: nghe-nhac/brahms-4
  id: n11
  cau: Chủ đề 8 ô nhịp được Brahms phỏng theo chaconne ở hợp xướng kết thúc cantata BWV 150 của Bach.
  loai: lich-su
- trang: nghe-nhac/brahms-4
  id: n12
  cau: Từ chủ đề đó, Brahms viết 30 biến tấu và một coda.
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n13
  cau: Mỗi biến tấu dài đúng 8 ô nhịp.
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n14
  cau: "Theo dõi, Chủ đề: kèn gỗ và kèn đồng chơi 8 hợp âm, to (forte); đàn dây nghỉ."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n15
  cau: Trombone lần đầu tiên xuất hiện trong bản giao hưởng ở chủ đề chương 4.
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n16
  cau: "Theo dõi, biến tấu 1–3: đàn dây vào bằng những nốt gảy (pizzicato); kèn gỗ hát một giai điệu mới, nhẹ; biến tấu 3 mạnh, nhấn rõ."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n17
  cau: "Theo dõi, biến tấu 4–11: đàn dây dẫn dắt, nhiều đoạn chạy nốt nhanh, kịch tính; tới biến tấu 11 nhạc lắng xuống."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n18
  cau: "Theo dõi, biến tấu 12: sáo độc tấu (espressivo), nhịp 3/2: trường độ nốt dài gấp đôi nên nhạc nghe chậm lại."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n19
  cau: "Theo dõi, biến tấu 13–15: chuyển sang Mi trưởng; kèn gỗ hát dịu dàng, rồi trombone cùng bassoon và horn chơi những hợp âm trang nghiêm, rất nhỏ."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n20
  cau: "Theo dõi, biến tấu 16: chủ đề trở lại ở Mi thứ, nhịp 3/4, kèn chơi to (forte, rồi fortissimo khi đàn dây vào), như bắt đầu lại từ đầu."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n21
  cau: "Theo dõi, biến tấu 17–30: các biến tấu mạnh mẽ xen vài đoạn lắng nhỏ; sau biến tấu 30 nhạc chậm lại một chút."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n22
  cau: "Theo dõi, Coda: nhanh hơn (Più Allegro), cao trào cuối cùng, kết thúc ở Mi thứ."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n24
  cau: "Câu hỏi: biến tấu 12 (sáo) và 13–15 (giọng trưởng) tạo một khoảng lặng giữa chương."
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n25
  cau: 'Câu hỏi: Beethoven 5 và Concerto violin của Mendelssohn đi "từ tối ra sáng" (giọng thứ sang giọng trưởng), còn Brahms 4 kết ở giọng thứ.'
  loai: cau-truc
- trang: nghe-nhac/brahms-4
  id: n27
  cau: "Mục Nguồn: bản in đầu tiên (Simrock 1886) do Brahms-Institut Lübeck số hóa, IMSLP, lời tựa Henle HN 9856, giới thiệu tác phẩm và tờ chương trình buổi công diễn đầu trên Brahms-Portal."
  loai: ten
- trang: nghe-nhac/brahms-4
  id: n23
  cau: "Câu hỏi: thử đếm số ô nhịp của chủ đề (8) và nhận ra mỗi khi một biến tấu mới bắt đầu."
  loai: khuyen-tap
- trang: nghe-nhac/dvorak-9-largo
  id: n1
  cau: "Bảng: Antonín Dvořák (1841–1904)."
  loai: nam
- trang: nghe-nhac/dvorak-9-largo
  id: n2
  cau: 'Bảng: Tên đầy đủ: Giao hưởng số 9 cung Mi thứ, Op. 95 "Từ Thế giới mới".'
  loai: danh-muc
- trang: nghe-nhac/dvorak-9-largo
  id: n3
  cau: "Bảng: Sáng tác năm 1893, tại New York."
  loai: nam
- trang: nghe-nhac/dvorak-9-largo
  id: n4
  cau: "Bảng: Công diễn ngày 16/12/1893 tại Carnegie Hall, New York Philharmonic."
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n5
  cau: "Bảng: Thời kỳ Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n6
  cau: "Bảng: Chương 2 là Largo, Rê♭ trưởng, dài khoảng 11–13 phút."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n7
  cau: Năm 1892, Dvořák sang Mỹ làm giám đốc Nhạc viện Quốc gia ở New York.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n8
  cau: Dvořák tin rằng nước Mỹ nên tìm "giọng nói âm nhạc" của mình từ spiritual của người Mỹ gốc Phi và âm nhạc của người bản địa.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n9
  cau: Dvořák nghe spiritual qua ca sĩ Harry T. Burleigh và tìm hiểu một số giai điệu của người bản địa.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n10
  cau: Trong Giao hưởng số 9, những nét nhạc gợi chất Mỹ đan xen với nét nhạc Séc quen thuộc của Dvořák.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n11
  cau: Giai điệu chính của chương 2 mang đậm nét ngũ cung, giản dị như một bài hát.
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n13
  cau: Năm 1922, William Arms Fisher, một học trò cũ của Dvořák ở Mỹ, đặt lời cho giai điệu này thành ca khúc Goin' Home.
  loai: lich-su
- trang: nghe-nhac/dvorak-9-largo
  id: n14
  cau: "Theo dõi, Mở đầu: kèn gỗ và kèn đồng chơi chuỗi hợp âm chậm, bắt đầu rất nhỏ rồi to dần, mở bằng hợp âm Mi trưởng (nối với giọng Mi của chương 1) và dừng ở Rê♭ trưởng."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n15
  cau: "Theo dõi, Chủ đề chính: cor anglais hát giai điệu ngũ cung nổi tiếng trên nền đàn dây chơi rất nhỏ, có lắp hộp tắt tiếng (con sordino)."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n16
  cau: Cor anglais là kèn oboe trầm.
  loai: dinh-nghia
- trang: nghe-nhac/dvorak-9-largo
  id: n17
  cau: "Theo dõi, Đoạn giữa: chuyển sang Đô♯ thứ, nhanh hơn một chút; sáo và oboe hát một giai điệu mới buồn hơn; sau đó clarinet hát trên những nốt contrabass gảy đều đều như bước chân."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n18
  cau: "Theo dõi, Đoạn tươi sáng: chuyển sang Đô♯ trưởng, kèn gỗ láy (trill) líu lo như tiếng chim; cao trào ngắn, kèn đồng chơi to, chủ đề của chương 2 và các chủ đề của chương 1 cùng vang lên."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n19
  cau: "Theo dõi, Trở lại: cor anglais hát lại chủ đề chính, ngắt quãng; đàn dây chỉ còn vài người chơi, có chỗ độc tấu, tiếp lời."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n20
  cau: "Theo dõi, Kết: chuỗi hợp âm mở đầu quay lại, contrabass ngân hợp âm cuối thật nhỏ."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n22
  cau: "Câu hỏi: câu đầu của chủ đề chính chỉ dùng vài nốt của gam ngũ cung, không có quãng nửa cung nào."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n23
  cau: "Câu hỏi: một chủ đề của chương 2 xuất hiện lại ở cuối giao hưởng (chương 4)."
  loai: cau-truc
- trang: nghe-nhac/dvorak-9-largo
  id: n25
  cau: "Mục Nguồn: tổng phổ Simrock trên Internet Archive, IMSLP, trang tác phẩm và tiểu sử trên antonin-dvorak.cz."
  loai: ten
- trang: nghe-nhac/grieg-buoi-sang
  id: n1
  cau: "Bảng: Edvard Grieg (1843–1907)."
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n2
  cau: "Bảng: Tác phẩm: nhạc sân khấu Peer Gynt, Op. 23 (Morgenstemning)."
  loai: danh-muc
- trang: nghe-nhac/grieg-buoi-sang
  id: n3
  cau: "Bảng: Sáng tác 1874–1875."
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n4
  cau: "Bảng: Công diễn cùng vở kịch ngày 24/2/1876 tại Christiania (nay là Oslo)."
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n5
  cau: "Bảng: Buổi sáng mở đầu Peer Gynt Suite số 1, Op. 46."
  loai: danh-muc
- trang: nghe-nhac/grieg-buoi-sang
  id: n6
  cau: "Bảng: Thời kỳ Lãng mạn."
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n7
  cau: "Bảng: Mi trưởng, nhịp 6/8."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n8
  cau: "Bảng: Độ dài khoảng 4 phút."
  loai: so-lieu
- trang: nghe-nhac/grieg-buoi-sang
  id: n9
  cau: "Bảng: Bản thu gợi ý: Neeme Järvi và Gothenburg Symphony Orchestra."
  loai: ten
- trang: nghe-nhac/grieg-buoi-sang
  id: n10
  cau: Edvard Grieg là nhà soạn nhạc nổi tiếng nhất của Na Uy.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n11
  cau: Grieg cùng thời với Tchaikovsky và Brahms.
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n12
  cau: Grieg viết Peer Gynt theo lời mời của Henrik Ibsen, người cần nhạc cho vở kịch thơ cùng tên.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n13
  cau: Grieg sáng tác trong hai năm 1874–1875, và vở diễn ra mắt năm 1876.
  loai: nam
- trang: nghe-nhac/grieg-buoi-sang
  id: n14
  cau: Sau đó Grieg chọn một số đoạn, soạn thành hai tổ khúc hòa nhạc (Op. 46 và Op. 55); Buổi sáng là bản mở đầu tổ khúc thứ nhất.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n16
  cau: Peer Gynt kể chuyện một chàng trai Na Uy phiêu lưu khắp thế giới, từ quê nhà đến tận Bắc Phi.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n17
  cau: Buổi sáng là khúc dạo đầu của màn 4.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n18
  cau: Màn 4 không diễn ra ở Na Uy mà ở Ma-rốc và sa mạc Sahara.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n19
  cau: Ở đầu màn 4, Peer bị bạn đồng hành cướp mất du thuyền, bỏ lại một mình trên bờ biển; rạng sáng hôm sau anh ngồi trên cây, cầm cành gãy đuổi lũ khỉ.
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n20
  cau: 'Ghi chú trong tổng phổ cho biết bản nhạc lúc đầu được viết để mở cảnh "Sáng sớm" của màn 4: một vùng núi đá nhìn ra sa mạc.'
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n21
  cau: "(Đã bỏ) Gần như ai nghe cũng tưởng đây là buổi sáng ở một vùng quê Na Uy: mặt hồ phẳng lặng, sương tan trên rừng thông."
  loai: lich-su
- trang: nghe-nhac/grieg-buoi-sang
  id: n22
  cau: Câu giai điệu mở đầu chỉ dùng các nốt của gam ngũ cung.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n23
  cau: "Grieg ghi tốc độ Allegretto pastorale: hơi nhanh, kiểu đồng quê."
  loai: dinh-nghia
- trang: nghe-nhac/grieg-buoi-sang
  id: n25
  cau: Giai điệu được sáo và oboe chuyền tay nhau lúc mở đầu.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n26
  cau: Lần đầu cả dàn nhạc chơi to (forte) đến khá sớm, ngay ở phần đầu bản nhạc.
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n27
  cau: "Sơ đồ, Mở đầu: sáo độc tấu giai điệu ngũ cung, nhỏ; oboe đáp lại."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n28
  cau: "Sơ đồ, Dâng lên: giai điệu lan khắp dàn nhạc, to dần từng bậc."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n29
  cau: "Sơ đồ, Cao trào: cả dàn nhạc chơi to (forte, rồi fortissimo), giai điệu ở đàn dây; rồi lắng xuống."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n30
  cau: "Sơ đồ, Đoạn giữa: tương phản, đàn dây chạy nốt nhanh, nhiều lần to lên rồi lắng; cuối đoạn kèn horn độc tấu giai điệu."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n31
  cau: "Sơ đồ, Trở lại và kết: giai điệu mở đầu quay về, êm dần, kết thúc lặng lẽ."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n32
  cau: "Theo dõi 1: mở đầu, sáo độc tấu giai điệu, nhỏ (piano), trên nền clarinet và bassoon ngân."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n33
  cau: 'Theo dõi 2: oboe đáp lại bằng cùng giai điệu ở cao độ khác — hai nhạc cụ gỗ "trò chuyện" với nhau.'
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n34
  cau: "Theo dõi 3: thêm nhạc cụ tham gia, giai điệu lan rộng, âm lượng tăng dần từng bậc."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n35
  cau: "Theo dõi 4: cả dàn nhạc chơi to (forte, rồi fortissimo), giai điệu ở đàn dây; rồi lắng xuống khá nhanh."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n36
  cau: "Theo dõi 5: đoạn giữa, đàn dây chạy nốt nhanh, nhiều lần to lên rồi lắng; cuối đoạn kèn horn độc tấu giai điệu."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n37
  cau: "Theo dõi 6: giai điệu mở đầu trở lại ở cello, êm dần; sáo láy (trill) líu lo."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n38
  cau: "Theo dõi 7: kết, chậm dần, các hợp âm cuối thật nhỏ, lắng vào im lặng."
  loai: cau-truc
- trang: nghe-nhac/grieg-buoi-sang
  id: n44
  cau: "Mục Nguồn: tổng phổ màn 4 của Thư viện Quốc gia Na Uy, IMSLP, bản dịch Archer của vở kịch, COD (mục Grieg), Store norske leksikon."
  loai: ten
- trang: nghe-nhac/grieg-buoi-sang
  id: n39
  cau: "Câu hỏi: giai điệu chỉ dùng 5 nốt (ngũ cung) nghe khác gì so với những giai điệu 7 nốt quen thuộc?"
  loai: khuyen-tap
- trang: nghe-nhac/grieg-buoi-sang
  id: n40
  cau: "Câu hỏi: lần đầu cả dàn nhạc chơi to đến khá sớm — cảm giác của bạn thế nào?"
  loai: khuyen-tap
- trang: nghe-nhac/grieg-buoi-sang
  id: n41
  cau: 'Câu hỏi: thử đếm xem sáo và oboe "chuyền" giai điệu cho nhau mấy lần ở đoạn mở đầu.'
  loai: khuyen-tap
- trang: nghe-nhac/part-spiegel
  id: n1
  cau: "Bảng: Arvo Pärt sinh năm 1935, người Estonia."
  loai: nam
- trang: nghe-nhac/part-spiegel
  id: n2
  cau: "Bảng: sáng tác năm 1978, ban đầu cho violin và piano."
  loai: nam
- trang: nghe-nhac/part-spiegel
  id: n3
  cau: "Bảng: có nhiều phiên bản cho cello, viola và nhạc cụ khác."
  loai: lich-su
- trang: nghe-nhac/part-spiegel
  id: n4
  cau: "Bảng: thời kỳ Đương đại."
  loai: lich-su
- trang: nghe-nhac/part-spiegel
  id: n5
  cau: "Bảng: giọng Fa trưởng."
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n6
  cau: "Bảng: độ dài khoảng 8–10 phút."
  loai: so-lieu
- trang: nghe-nhac/part-spiegel
  id: n7
  cau: "Bảng, bản thu gợi ý: album Alina (ECM New Series 1591, 1999), có ba bản Spiegel im Spiegel: hai bản violin và piano, một bản cello và piano."
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n8
  cau: Tên tác phẩm nghĩa là "Gương trong gương".
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n9
  cau: Mỗi câu nhạc đi lên được nối bằng một câu "soi gương" đi xuống (ý của tên tác phẩm).
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n10
  cau: Năm 1976, Pärt tạo ra phong cách tintinnabuli.
  loai: nam
- trang: nghe-nhac/part-spiegel
  id: n11
  cau: Tên tintinnabuli lấy từ tintinnabulum, tiếng Latin nghĩa là "chiếc chuông nhỏ".
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n12
  cau: Tintinnabuli gồm hai bè đi liền với nhau; một bè giai điệu (bè M) phần lớn đi theo gam, từng bước một.
  loai: dinh-nghia
- trang: nghe-nhac/part-spiegel
  id: n13
  cau: Bè kia (bè T) chỉ dùng ba nốt của hợp âm ba chủ, vang như tiếng chuông.
  loai: dinh-nghia
- trang: nghe-nhac/part-spiegel
  id: n14
  cau: Ở Spiegel im Spiegel, hợp âm ba chủ là Fa – La – Đô.
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n15
  cau: "Chất liệu của Spiegel im Spiegel rất ít: chỉ có giai điệu của nhạc cụ độc tấu và phần đệm ba nốt của piano."
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n17
  cau: "Theo dõi, dòng 1: piano bắt đầu với hình đệm ba nốt đi lên, lặp lại đều đặn."
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n18
  cau: "Theo dõi, dòng 2: violin vào; câu đầu chỉ có hai nốt, kết về một nốt trung tâm."
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n19
  cau: 'Theo dõi, dòng 3: mỗi câu sau thêm một nốt, nên giai điệu đi xa dần khỏi nốt trung tâm; câu đi lên được nối bằng câu "soi gương" đi xuống, và câu nào cũng trở về nốt trung tâm.'
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n20
  cau: "Theo dõi, dòng 4: piano thêm những nốt tintinnabuli, như những chiếc chuông nhỏ, lần lượt vang phía trên và phía dưới giai điệu."
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n21
  cau: "Theo dõi, dòng 5: những câu cuối dài nhất; giai điệu vẫn trở về nốt trung tâm."
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n23
  cau: "Câu hỏi 3: so sánh với Bach, Prelude cung Đô trưởng: cả hai đều có hình hợp âm rải lặp lại."
  loai: cau-truc
- trang: nghe-nhac/part-spiegel
  id: n27
  cau: "Mục Nguồn: trang Spiegel im Spiegel và tiểu sử của Trung tâm Arvo Pärt; bài của Jelena Tokun (2011); bản nhạc do Universal Edition giữ bản quyền; bản ghi tác phẩm của Thư viện Quốc hội Mỹ (theo MGG); MusicBrainz."
  loai: ten
- trang: nghe-nhac/part-spiegel
  id: n22
  cau: 'Câu hỏi nghe chủ động 1 và 2: có nhận ra quy luật "mỗi câu thêm một nốt" không; âm nhạc gần như không thay đổi gì lớn trong 10 phút, cảm giác thay đổi ra sao.'
  loai: khuyen-tap
- trang: nghe-nhac/puccini-nessun-dorma
  id: n1
  cau: "Bảng: Giacomo Puccini (1858–1924)."
  loai: nam
- trang: nghe-nhac/puccini-nessun-dorma
  id: n2
  cau: "Bảng: Opera Turandot (3 màn)."
  loai: danh-muc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n3
  cau: "Bảng: Công diễn 25/4/1926 tại La Scala, Milan."
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n4
  cau: "Bảng: Puccini mất năm 1924 khi opera còn dang dở; Franco Alfano hoàn thành."
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n5
  cau: 'Bảng: Aria "Nessun dorma" (Không ai được ngủ) ở đầu màn 3.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n6
  cau: "Bảng: Giọng tenor."
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n7
  cau: "Bảng: Độ dài khoảng 3 phút."
  loai: so-lieu
- trang: nghe-nhac/puccini-nessun-dorma
  id: n8
  cau: "Bảng: Bản thu gợi ý: Luciano Pavarotti, trong bản thu trọn vở do Zubin Mehta chỉ huy (Decca, 1973)."
  loai: ten
- trang: nghe-nhac/puccini-nessun-dorma
  id: n9
  cau: Puccini là nhà soạn nhạc opera Ý, tác giả La bohème, Tosca, Madama Butterfly.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n10
  cau: Turandot là opera cuối cùng của Puccini, và ông không kịp hoàn thành.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n11
  cau: Khi Puccini mất (29/11/1924), vở đã gần xong, chỉ còn thiếu phần cuối màn 3.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n12
  cau: Nhạc sĩ Franco Alfano viết nốt phần kết.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n13
  cau: Vở ra mắt năm 1926 tại La Scala dưới sự chỉ huy của Arturo Toscanini.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n14
  cau: "Trong đêm công diễn đầu, buổi diễn dừng lại đúng chỗ nhạc của Puccini dừng lại: Toscanini quay xuống khán giả và nói rằng tới đây nhà soạn nhạc đã buông bút."
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n15
  cau: Phần Alfano viết được diễn từ đêm thứ hai.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n16
  cau: Câu chuyện lấy bối cảnh Bắc Kinh "thời cổ tích".
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n17
  cau: "Công chúa Turandot ra điều kiện: người muốn cưới nàng phải giải được ba câu đố, không giải được thì bị chém đầu."
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n18
  cau: Hoàng tử Calaf là con vua Tartar bị truất ngôi, giấu tên thật.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n19
  cau: 'Calaf giải được cả ba câu đố, Turandot vẫn không chịu; chàng ra "câu đố ngược": nếu trước bình minh nàng đoán được tên chàng, chàng sẽ chịu chết.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n20
  cau: '"Nessun dorma" ở đầu màn 3, giữa đêm khuya; Turandot ra lệnh không ai trong thành được ngủ, ai trái lệnh phải chết, mọi người phải thức tìm tên chàng trai.'
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n21
  cau: "Một mình trong vườn cung điện, Calaf hát: khi bình minh lên, chàng sẽ thắng."
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n22
  cau: Để tạo màu sắc Trung Hoa, Puccini đưa vào opera giai điệu dân ca Mạt lỵ hoa ("Hoa nhài"); giai điệu ấy xuất hiện ở những đoạn khác trong vở.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n23
  cau: 'Sơ đồ, Mở đầu: các sứ giả từ xa loan lệnh "không ai được ngủ", những giọng khác vọng lại; Calaf một mình nhắc lại "Nessun dorma!" giữa đêm.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n24
  cau: "Sơ đồ, Đoạn giữa: chàng hát về công chúa trong căn phòng lạnh đang ngắm sao; bí mật (tên chàng) chỉ mình chàng giữ."
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n25
  cau: 'Sơ đồ, Hợp xướng xen vào: giọng phụ nữ từ xa, đầy lo âu: "Tên chàng không ai biết… và chúng ta, than ôi, sẽ phải chết!"'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n26
  cau: 'Sơ đồ, Kết: Calaf xua tan đêm tối, giọng rực rỡ dần, khép lại bằng tiếng "Vincerò!" (ta sẽ thắng!): một nốt Si cao rất ngắn, rồi nốt La ngân dài.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n27
  cau: 'Theo dõi 1: đêm ở Bắc Kinh, lệnh "không ai được ngủ" vang lên từ xa, cả thành phải thức trắng tìm tên chàng trai.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n28
  cau: "Theo dõi 2: giọng tenor của Calaf cất lên một mình giữa đêm khuya."
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n29
  cau: "Theo dõi 3: chàng hát về công chúa ngắm những vì sao; tên chàng là bí mật chỉ mình chàng biết."
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n30
  cau: "Theo dõi 4: hợp xướng nữ từ xa xen vào, lo âu, rồi nhường lại sân khấu cho Calaf."
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n31
  cau: 'Theo dõi 5: chàng xua đêm tối, đón bình minh: "Vincerò!" — nốt Si cao rồi nốt La cuối ngân dài, rực rỡ.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n33
  cau: 'Câu hỏi, gợi ý: trong tổng phổ, Puccini viết nốt Si cao trên âm "-ce-" chỉ bằng một nốt móc kép, rất ngắn, rồi mới ngân dài nốt La ở âm cuối.'
  loai: cau-truc
- trang: nghe-nhac/puccini-nessun-dorma
  id: n35
  cau: (Đã bỏ) Aria này khiến cả những người chưa từng nghe opera cũng thuộc lòng.
  loai: lich-su
- trang: nghe-nhac/puccini-nessun-dorma
  id: n38
  cau: "Mục Nguồn: tổng phổ Ricordi và lời opera 1926 trên Internet Archive, IMSLP, Catalogue of the Works của Puccini, COD, Encyclopedia of World Biography, bài của Sheppard."
  loai: ten
- trang: nghe-nhac/puccini-nessun-dorma
  id: n34
  cau: 'Câu hỏi: so sánh hai bản thu khác nhau: ai hát "tự tin" hơn, ai hát "lãng mạn" hơn?'
  loai: khuyen-tap
- trang: nghe-nhac/puccini-nessun-dorma
  id: n32
  cau: "Câu hỏi: aria tràn đầy tự tin mà lại mở đầu lặng lẽ giữa đêm khuya — sự tương phản này tạo hiệu quả gì?"
  loai: khuyen-tap
- trang: nghe-nhac/ravel-bolero
  id: n1
  cau: "Bảng: Maurice Ravel (1875–1937)."
  loai: nam
- trang: nghe-nhac/ravel-bolero
  id: n2
  cau: "Bảng: sáng tác năm 1928, nhạc cho vở ballet của vũ công Ida Rubinstein (bản tổng phổ đề tặng bà); Durand in năm 1929."
  loai: nam
- trang: nghe-nhac/ravel-bolero
  id: n3
  cau: "Bảng: công diễn 22/11/1928 ở Nhà hát Opéra (Palais Garnier), Paris, dạng ballet; nhạc trưởng Walther Straram."
  loai: nam
- trang: nghe-nhac/ravel-bolero
  id: n4
  cau: "Bảng: thời kỳ Thế kỷ 20."
  loai: lich-su
- trang: nghe-nhac/ravel-bolero
  id: n5
  cau: "Bảng: độ dài khoảng 14–17 phút tùy nhạc trưởng."
  loai: so-lieu
- trang: nghe-nhac/ravel-bolero
  id: n6
  cau: "Boléro là một thí nghiệm: gần như không có phát triển, không có chuyển giọng (trừ một lần ở cuối), không có tương phản."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n7
  cau: Một tiết tấu trống snare lặp lại không ngừng từ ô đầu tiên, chỉ đổi ở hai ô cuối.
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n8
  cau: Hai giai điệu (gọi là A và B) luân phiên nhau, mỗi lần do một nhạc cụ hoặc một nhóm nhạc cụ khác chơi; giai điệu chuyển qua lần lượt các nhạc cụ.
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n9
  cau: Một crescendo duy nhất kéo dài suốt tác phẩm, từ pianissimo đến fortissimo.
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n10
  cau: 'Ravel gọi bản nhạc là "một thí nghiệm theo một hướng rất đặc biệt và hẹp" và nói nó chỉ là "mô dệt của dàn nhạc, không có âm nhạc": điều thay đổi duy nhất là phối khí và cường độ.'
  loai: lich-su
- trang: nghe-nhac/ravel-bolero
  id: n12
  cau: "Theo dõi, dòng 1: A, sáo, rất nhỏ, trên nền snare và pizzicato đàn dây."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n13
  cau: "Theo dõi, dòng 2: A, clarinet."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n14
  cau: "Theo dõi, dòng 3: B, bassoon ở âm vực cao."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n15
  cau: "Theo dõi, dòng 4: B, clarinet Mi♭ (theo tổng phổ: petite clarinette, clarinet nhỏ)."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n16
  cau: "Theo dõi, dòng 5: A, oboe d'amore (một loại oboe, do người chơi oboe thứ hai đổi sang)."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n17
  cau: "Theo dõi, dòng 6: A, trumpet có câm tiếng và sáo."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n18
  cau: "Theo dõi, dòng 7: B, saxophone tenor."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n19
  cau: "Theo dõi, dòng 8: B, saxophone sopranino rồi soprano (theo tổng phổ); khi biểu diễn, người chơi thường dùng saxophone soprano cho cả hai."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n20
  cau: "Theo dõi, dòng 9: A, kèn horn, celesta và hai piccolo chơi song song ở các quãng của chuỗi bồi âm, nghe như một nhạc cụ mới, không có thật."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n21
  cau: "Theo dõi, dòng 10: A, B luân phiên; các nhóm nhạc cụ ngày càng đông: kèn gỗ, trombone, rồi đàn dây."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n22
  cau: "Theo dõi, dòng 11: A rồi B, cả dàn nhạc, fortissimo."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n23
  cau: "Theo dõi, dòng 12: kết; lần chuyển giọng duy nhất sang Mi trưởng, rồi về Đô trưởng; toàn bộ âm nhạc đổ sụp trong vài ô nhịp."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n24
  cau: 'Câu hỏi 1: ở đoạn horn, celesta và piccolo, horn chơi giai điệu (bồi âm 1), celesta ở bồi âm 2 và 4, hai piccolo ở bồi âm 3 và 5, để "tổng hợp" một âm sắc nhân tạo.'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n27
  cau: "Câu hỏi 3: lần chuyển giọng duy nhất ở cuối đến sau khoảng 15 phút ở cùng một giọng."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n30
  cau: "Mục Nguồn: tổng phổ Durand 1929 (đề tặng Ida Rubinstein) quét trên Internet Archive; IMSLP; bài của Gurminder K. Bhogal, Music Theory Online 26.2 (2020)."
  loai: ten
- trang: nghe-nhac/ravel-bolero
  id: h1
  cau: "Hình bolero, nhãn dưới trục: Sáo, Clarinet, Bassoon, Clarinet Mi♭, Oboe d'amore, Trumpet + sáo, Saxophone, Horn + celesta + piccolo, …, Cả dàn nhạc (thứ tự nhạc cụ chơi giai điệu)."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h2
  cau: "Hình bolero: crescendo bắt đầu từ pp."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h3
  cau: "Hình bolero: crescendo lên tới ff."
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h4
  cau: 'Hình bolero, vạch đỏ gần cuối: "chuyển sang Mi trưởng, rồi đổ sụp".'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h5
  cau: 'Hình bolero, chú thích dưới: "Trống snare giữ cùng một tiết tấu tới hai ô cuối; giai điệu A và B chuyền qua các nhạc cụ."'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: h6
  cau: 'Hình bolero, nhãn và chú thích: "Boléro: một crescendo kéo dài suốt tác phẩm, giai điệu chuyền lần lượt từ sáo, clarinet, bassoon… đến cả dàn nhạc; gần cuối chuyển giọng một lần rồi kết"; "Boléro: âm sắc và cường độ thay đổi, mọi thứ khác gần như đứng yên."'
  loai: cau-truc
- trang: nghe-nhac/ravel-bolero
  id: n11
  cau: "Vì vậy Boléro là một bài luyện nhận biết nhạc cụ rất tốt: cùng một giai điệu, chỉ thay đổi âm sắc."
  loai: khuyen-tap
- trang: nghe-nhac/ravel-bolero
  id: n26
  cau: "Câu hỏi 2: một tác phẩm gần như không đổi gì ngoài âm sắc và cường độ có làm bạn chán không."
  loai: khuyen-tap
- trang: nghe-nhac/shostakovich-5
  id: n1
  cau: "Bảng: Dmitri Shostakovich (1906–1975)."
  loai: nam
- trang: nghe-nhac/shostakovich-5
  id: n2
  cau: "Bảng: tên đầy đủ Giao hưởng số 5 cung Rê thứ, Op. 47."
  loai: danh-muc
- trang: nghe-nhac/shostakovich-5
  id: n3
  cau: "Bảng: sáng tác từ tháng 4 đến tháng 7 năm 1937."
  loai: nam
- trang: nghe-nhac/shostakovich-5
  id: n4
  cau: "Bảng: công diễn 21/11/1937 ở Leningrad, dàn nhạc Leningrad Philharmonic, nhạc trưởng Yevgeny Mravinsky."
  loai: nam
- trang: nghe-nhac/shostakovich-5
  id: n5
  cau: "Bảng: thời kỳ Thế kỷ 20."
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n6
  cau: "Bảng: độ dài khoảng 45 phút, 4 chương."
  loai: so-lieu
- trang: nghe-nhac/shostakovich-5
  id: n7
  cau: Ngày 28/1/1936, báo Pravda, cơ quan ngôn luận của Đảng Cộng sản Liên Xô, đăng bài "Hỗn loạn thay cho âm nhạc" chỉ trích nặng nề vở opera Phu nhân Macbeth quận Mtsensk của Shostakovich.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n8
  cau: Khi ấy Shostakovich 29 tuổi.
  loai: so-lieu
- trang: nghe-nhac/shostakovich-5
  id: n9
  cau: Đó là thời kỳ Đại Thanh trừng; bị phê phán công khai có thể dẫn đến mất tự do hoặc mạng sống.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n10
  cau: Shostakovich rút lại Giao hưởng số 4 sau vài buổi tập và viết Giao hưởng số 5.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n11
  cau: Buổi công diễn thành công vang dội; khán giả vỗ tay rất lâu.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n12
  cau: Nhiều người khóc trong chương 3 (Largo) ở buổi công diễn đầu.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n13
  cau: Bản giao hưởng được gọi, không rõ do ai đặt, là "câu trả lời sáng tạo của một nghệ sĩ Xô viết trước lời phê phán đúng đắn"; có tin rằng chính Shostakovich đã đồng ý với cách gọi ấy.
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n14
  cau: "Câu hỏi còn đến hôm nay: đoạn kết hân hoan ở Rê trưởng là chiến thắng thật hay một niềm vui bị ép buộc, châm biếm kín đáo; âm nhạc của ông thường mang hai lớp nghĩa như vậy."
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n15
  cau: "Theo dõi, chương 1 (Moderato): đàn dây mở đầu bằng một môtip tiết tấu chấm dôi gay gắt; rồi violin hát một giai điệu ở âm vực cao, ấm mà xa xăm."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n16
  cau: "Theo dõi, chương 1, phát triển: kèn horn đưa vào một hành khúc, nhạc nhanh dần, dữ dội."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n17
  cau: "Theo dõi, chương 2 (Allegretto): scherzo nhịp ba, giai điệu như điệu ländler (gợi nhớ Mahler), giọng mỉa mai."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n18
  cau: "Theo dõi, chương 3 (Largo): không có kèn đồng."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n19
  cau: "Theo dõi, chương 3: violin chia ba bè thay vì hai."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n20
  cau: "Theo dõi, chương 3: rồi oboe, clarinet, sáo lần lượt hát những giai điệu buồn."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n21
  cau: "Theo dõi, chương 3: ở buổi công diễn đầu, nhiều người khóc trong chương này."
  loai: lich-su
- trang: nghe-nhac/shostakovich-5
  id: n22
  cau: "Theo dõi, chương 4 (Allegro non troppo): mở đầu bằng một hành khúc nhanh, dồn dập."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n23
  cau: "Theo dõi, chương 4, đoạn giữa: chậm lại, trầm tư, mở đầu bằng tiếng horn độc tấu."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n24
  cau: "Theo dõi, chương 4, coda: timpani và trống snare đưa hành khúc trở lại, chậm chỉ bằng một nửa; kết thúc rất to ở Rê trưởng."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n26
  cau: "Câu hỏi 2: vì sao Shostakovich lại bỏ kèn đồng trong chương 3 (tiền đề: chương 3 không có kèn đồng)."
  loai: cau-truc
- trang: nghe-nhac/shostakovich-5
  id: n29
  cau: "Mục Nguồn: ghi chú chương trình của Harlow Robinson (BSO), Peter Laki (Kalamazoo), Gerard McBurney (Boston Philharmonic, Benjamin Zander); IMSLP."
  loai: ten
- trang: nghe-nhac/shostakovich-5
  id: n30
  cau: "Đọc thêm: Alex Ross, The Rest Is Noise (2007), chương 7 \"The Art of Fear: Music in Stalin's Russia\"."
  loai: ten
- trang: nghe-nhac/shostakovich-5
  id: n25
  cau: 'Câu hỏi nghe chủ động 1 và 3: so sánh coda ở hai bản thu của hai nhạc trưởng; âm nhạc có thể "nói" điều lời nói không được phép nói không.'
  loai: khuyen-tap
- trang: nghe-nhac/stravinsky-sacre
  id: n1
  cau: "Bảng: Igor Stravinsky (1882–1971)."
  loai: nam
- trang: nghe-nhac/stravinsky-sacre
  id: n2
  cau: "Bảng: ballet Le Sacre du printemps (1910–1913), cho dàn nhạc rất lớn (riêng kèn horn có 8 chiếc)."
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n3
  cau: "Bảng: công diễn 29/5/1913, Théâtre des Champs-Élysées, Paris, đoàn Ballets Russes, biên đạo Vaslav Nijinsky, nhạc trưởng Pierre Monteux."
  loai: nam
- trang: nghe-nhac/stravinsky-sacre
  id: n4
  cau: "Bảng: thời kỳ Thế kỷ 20."
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n5
  cau: "Bảng: đoạn nghe là mở đầu và Les Augures printaniers (Những điềm báo mùa xuân), khoảng 7 phút."
  loai: so-lieu
- trang: nghe-nhac/stravinsky-sacre
  id: n6
  cau: "Bảng: bản thu gợi ý Pierre Boulez và Dàn nhạc Cleveland (CBS, 1969)."
  loai: ten
- trang: nghe-nhac/stravinsky-sacre
  id: n7
  cau: "Ballet mô tả nghi lễ của người Slav cổ: để đón mùa xuân, một thiếu nữ được chọn và nhảy múa đến chết làm vật hiến tế."
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n8
  cau: Buổi công diễn năm 1913 gây náo loạn trong khán phòng, một phần vì âm nhạc, một phần vì vũ đạo "thô ráp" của Nijinsky.
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n9
  cau: Ngày nay, đây được coi là một trong những tác phẩm có ảnh hưởng lớn nhất tới âm nhạc thế kỷ 20.
  loai: lich-su
- trang: nghe-nhac/stravinsky-sacre
  id: n10
  cau: "Những gì mới mẻ: tiết tấu trở thành nhân vật chính; trọng âm bất thường không theo phách mạnh."
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n11
  cau: Nghịch tai được dùng như màu sắc chứ không cần giải quyết.
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n12
  cau: Có đoạn số chỉ nhịp đổi gần như mỗi ô, như Vũ điệu hiến tế ở cuối tác phẩm.
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n14
  cau: "Theo dõi, dòng 1: bassoon solo ở âm vực rất cao, gần như không nhận ra là bassoon; giai điệu lấy từ một bài dân ca Litva."
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n15
  cau: "Theo dõi, dòng 2: các kèn gỗ khác lần lượt chen vào, đan xen, ngày càng dày đặc."
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n16
  cau: "Theo dõi, dòng 3: bassoon trở lại, rồi đột ngột dừng."
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n17
  cau: "Theo dõi, dòng 4: Les Augures printaniers: đàn dây dậm một hợp âm nghịch tai lặp đi lặp lại, tám kèn horn nhấn trọng âm ở những chỗ không đoán trước được."
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n18
  cau: "Theo dõi, dòng 5: các giai điệu ngắn, như dân ca, xuất hiện trên nền nhịp dậm; ngày càng nhiều nhạc cụ tham gia."
  loai: cau-truc
- trang: nghe-nhac/stravinsky-sacre
  id: n20
  cau: "Câu hỏi 2: Hồ thiên nga của Tchaikovsky công diễn lần đầu năm 1877, chỉ 36 năm trước Le Sacre."
  loai: nam
- trang: nghe-nhac/stravinsky-sacre
  id: n24
  cau: "Mục Nguồn: tổng phổ Édition Russe de Musique 1921 quét trên Internet Archive (Đại học Toronto); IMSLP; ghi chú chương trình của Peter Laki (Dàn nhạc Cleveland) và Phillip Huscher (Yellow Barn)."
  loai: ten
- trang: nghe-nhac/stravinsky-sacre
  id: n19
  cau: 'Câu hỏi 1 và 3: có đoán được trọng âm tiếp theo không; hợp âm lặp có "khó nghe" không, nghe lại lần ba cảm giác có khác.'
  loai: khuyen-tap
- trang: nghe-nhac/index
  id: n2
  cau: "Phương pháp 4 lần nghe, mỗi tác phẩm (hay một chương) cho cả tuần: lần 1 cảm nhận; lần 2 tìm giai điệu chính (ngân nga, phút thứ mấy, nhạc cụ nào); lần 3 theo dõi cấu trúc, vẽ sơ đồ A B A với mốc thời gian; lần 4 nghe một bản thu khác và so sánh."
  loai: khuyen-tap
- trang: nghe-nhac/index
  id: n1
  cau: Nghe chủ động là ngồi yên nghe một tác phẩm, không làm việc khác, mỗi lần với một câu hỏi; nhạc cổ điển bật lên làm nhạc nền thì dễ trôi qua; nghe nhiều lần, mỗi lần một câu hỏi khác, tác phẩm dần mở ra.
  loai: khuyen-tap
- trang: nghe-nhac/index
  id: n3
  cau: Tìm trên YouTube tên tác phẩm kèm chữ "score" để xem video có bản nhạc chạy theo tiếng đàn; chưa đọc nhạc giỏi vẫn thấy được cấu trúc.
  loai: khuyen-tap
- trang: piano/tac-pham/index
  id: n9
  cau: Các mốc tốc độ trong kế hoạch tuần chỉ là gợi ý; chậm hơn kế hoạch là bình thường, nhanh hơn mà căng tay thì không.
  loai: quy-tac
- trang: piano/tac-pham/index
  id: n17
  cau: Fantaisie-Impromptu luyện ba chọi bốn.
  loai: cau-truc
- trang: piano/tac-pham/index
  id: n21
  cau: Ấn bản Urtext của G. Henle Verlag kèm mức độ khó 1–9 cho từng tác phẩm.
  loai: so-lieu
- trang: piano/tac-pham/index
  id: n22
  cau: Ấn bản Urtext khác gồm Wiener Urtext, Bärenreiter; với Chopin là Ấn bản Quốc gia Ba Lan (Wydanie Narodowe), biên tập Jan Ekier.
  loai: ten
- trang: piano/tac-pham/index
  id: n23
  cau: Jane Magrath, The Pianist's Guide to Standard Teaching and Performance Literature (Alfred, 1995).
  loai: ten
- trang: piano/tac-pham/index
  id: n8
  cau: "Cách dùng một bài học, bước 1–4 và 6: nghe hai, ba bản thu trước khi mở bản nhạc; đánh dấu các đoạn bằng bút chì, đoạn lặp lại chỉ học một lần; tập chỗ khó từ tuần đầu; tập bài tập chuẩn bị trước hay song song; khi nốt đã chắc thì đọc phần diễn tấu, thu âm, so với các bản thu đã nghe."
  loai: khuyen-tap
- trang: piano/tac-pham/index
  id: n14
  cau: Mỗi bài dạy nhiều thứ, nhưng có một hai kỹ năng nó dạy tốt nhất; người học biết mình yếu ở đâu thì đi theo các chuỗi bài theo mục tiêu.
  loai: khuyen-tap
- trang: piano/tac-pham/index
  id: n19
  cau: Ghép ba bài như vậy để có một chương trình nhỏ biểu diễn; xem thêm Học thuộc và biểu diễn.
  loai: khuyen-tap
