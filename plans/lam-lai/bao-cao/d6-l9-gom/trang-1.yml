- trang: nghe-nhac/bach-air
  id: n1
  cau: 'Bảng: Johann Sebastian Bach (1685–1750).'
  loai: nam
- trang: nghe-nhac/bach-air
  id: n2
  cau: 'Bảng: Tên đầy đủ: Tổ khúc cho dàn nhạc số 3 cung Rê trưởng, BWV 1068, chương 2: Air.'
  loai: danh-muc
- trang: nghe-nhac/bach-air
  id: n3
  cau: 'Bảng: Có lẽ sáng tác khoảng 1729–1731 ở Leipzig; nguồn chính còn lại là một bộ phần
    bè chép khoảng 1730–1731, một phần do chính Bach chép.'
  loai: nam
- trang: nghe-nhac/bach-air
  id: n4
  cau: 'Bảng: Thời kỳ Baroque.'
  loai: lich-su
- trang: nghe-nhac/bach-air
  id: n5
  cau: 'Bảng: Thể loại: tổ khúc cho dàn nhạc (ouverture).'
  loai: ten
- trang: nghe-nhac/bach-air
  id: n6
  cau: 'Bảng: Chương Air dài khoảng 4–5 phút.'
  loai: so-lieu
- trang: nghe-nhac/bach-air
  id: n7
  cau: Air nghĩa là "giai điệu".
  loai: dinh-nghia
- trang: nghe-nhac/bach-air
  id: n8
  cau: Air là chương 2 của Tổ khúc số 3.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n9
  cau: Air là một trong những giai điệu nổi tiếng nhất của Bach, và của cả nhạc cổ điển.
  loai: lich-su
- trang: nghe-nhac/bach-air
  id: n10
  cau: 'Tổ khúc gồm 6 chương: Ouverture, Air, hai Gavotte, Bourrée và Gigue.'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n11
  cau: Cả tổ khúc có oboe, trumpet và timpani, nhưng Air chỉ có đàn dây (violin 1, violin
    2, viola) và bè continuo.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n12
  cau: Cái tên "Air on the G String" đến từ bản chuyển soạn năm 1871 cho violin và piano của
    nghệ sĩ violin August Wilhelmj.
  loai: lich-su
- trang: nghe-nhac/bach-air
  id: n13
  cau: Wilhelmj dịch giai điệu từ Rê trưởng xuống Đô trưởng để người chơi kéo cả giai điệu
    trên dây Sol, dây trầm nhất của violin.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n14
  cau: 'Có hai phiên bản: bản gốc Rê trưởng cho dàn nhạc, và bản Wilhelmj Đô trưởng cho violin
    (cả ở câu hỏi nghe chủ động thứ hai).'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n15
  cau: 'Chương nhạc chia hai nửa, mỗi nửa nhắc lại: nửa đầu 6 ô nhịp, nửa sau 12 ô.'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n16
  cau: Giai điệu violin 1 mở đầu bằng một nốt Fa♯ ngân dài hơn một ô nhịp rồi mới uốn lượn
    đi xuống.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n17
  cau: Bè bass đi đều bằng nốt móc đơn, phần lớn nhảy quãng tám, suốt cả chương.
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n18
  cau: 'Theo dõi, dòng 1: dàn dây vào, violin 1 ngân dài nốt Fa♯ trên nền bè trầm đi đều bằng
    nốt móc đơn.'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n19
  cau: 'Theo dõi, dòng 2: nửa đầu kết ở La trưởng (giọng át), rồi nhắc lại.'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n20
  cau: 'Theo dõi, dòng 3: nửa sau, giai điệu đi qua Si thứ (giọng thứ song song), rồi La trưởng.'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n21
  cau: 'Theo dõi, dòng 4: về lại Rê trưởng.'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n22
  cau: 'Theo dõi, dòng 5: kết, giai điệu hạ xuống nốt chủ Rê, bè trầm khép lại; nửa sau nhắc
    lại.'
  loai: cau-truc
- trang: nghe-nhac/bach-air
  id: n26
  cau: 'Mục Nguồn: Mutopia (Bach-Gesellschaft), IMSLP, lời tựa Bärenreiter TP 194 (Urtext
    NBA), Concise Oxford Dictionary of Music (Air on the G String).'
  loai: ten
- trang: nghe-nhac/bach-air
  id: n23
  cau: 'Câu hỏi nghe chủ động (ba câu): nhạc cụ chơi giai điệu và bè đệm; so sánh hai phiên
    bản; đếm theo bè trầm.'
  loai: khuyen-tap
- trang: nghe-nhac/bach-cello-1
  id: n1
  cau: 'Bảng: Johann Sebastian Bach (1685–1750).'
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n2
  cau: 'Bảng: Tên đầy đủ: Tổ khúc cho cello độc tấu số 1 cung Sol trưởng, BWV 1007.'
  loai: danh-muc
- trang: nghe-nhac/bach-cello-1
  id: n3
  cau: 'Bảng: Theo nhận định chung, sáng tác khoảng 1720, ở Köthen.'
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n4
  cau: 'Bảng: Thời kỳ Baroque.'
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n5
  cau: 'Bảng: Thể loại: tổ khúc gồm Prelude và 5 điệu nhảy.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n6
  cau: 'Bảng: Prelude dài khoảng 2–3 phút.'
  loai: so-lieu
- trang: nghe-nhac/bach-cello-1
  id: n7
  cau: 'Bảng: Bản thu gợi ý: Pablo Casals (HMV, thu 1936–1939; Prelude số 1 thu ở Paris năm
    1938).'
  loai: ten
- trang: nghe-nhac/bach-cello-1
  id: n8
  cau: 'Bảng: Bản thu gợi ý: Yo-Yo Ma (CBS Masterworks, thu 1982; Sony Classical, 1997).'
  loai: ten
- trang: nghe-nhac/bach-cello-1
  id: n9
  cau: Bản viết tay của Bach đã mất; sáu tổ khúc còn lại qua bốn bản chép tay thế kỷ 18, trong
    đó bản của vợ ông, Anna Magdalena (chép trong khoảng 1727–1731), được coi là gần bản gốc
    nhất.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n10
  cau: Suốt thế kỷ 19, các tổ khúc bị coi là bài tập kỹ thuật.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n11
  cau: Bản in đầu tiên ra ở Paris năm 1824.
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n12
  cau: Năm 1890, cậu bé 13 tuổi Pablo Casals tìm thấy một ấn bản (do Friedrich Grützmacher
    biên tập) ở Barcelona.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n13
  cau: Casals tập các tổ khúc hơn chục năm trước khi biểu diễn công khai.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n14
  cau: Về sau Casals chơi trọn các tổ khúc trước công chúng, điều trước đó chưa ai làm.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n15
  cau: Casals thu âm cả sáu tổ khúc trong các năm 1936–1939 ở London và Paris.
  loai: nam
- trang: nghe-nhac/bach-cello-1
  id: n16
  cau: Từ Casals, các tổ khúc này có chỗ thường trực trong tiết mục của mọi nghệ sĩ cello.
  loai: lich-su
- trang: nghe-nhac/bach-cello-1
  id: n17
  cau: Bach viết hòa âm cho một nhạc cụ chủ yếu chỉ chơi được một nốt mỗi lúc; lời giải là
    hợp âm rải.
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n18
  cau: 'Hợp âm rải: các nốt của hợp âm vang lên lần lượt.'
  loai: dinh-nghia
- trang: nghe-nhac/bach-cello-1
  id: n20
  cau: Prelude này giống Prelude cung Đô trưởng cho đàn phím (cùng dựng trên hợp âm rải),
    nhưng trên một cây đàn dây.
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n21
  cau: 'Tổ khúc theo trật tự: Prelude – Allemande – Courante – Sarabande – Menuet I và II
    – Gigue.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n22
  cau: 'Theo dõi, dòng 1: mở đầu, dây Sol buông ở bè trầm, các nốt rải đi lên rồi quay về;
    vòng hợp âm I – IV – V – I.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n23
  cau: 'Theo dõi, dòng 2: hòa âm đi xa dần, chuyển sang vùng giọng Rê trưởng (giọng át).'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n24
  cau: 'Theo dõi, dòng 3: nhạc dừng lại (dấu fermata) trên nốt Rê, âm át của Sol trưởng, như
    lấy hơi.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n25
  cau: 'Theo dõi, dòng 4: đoạn bariolage, nốt La lặp lại (đúng cao độ dây La buông của cello)
    xen kẽ liên tục với các nốt khác.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n26
  cau: 'Theo dõi, dòng 5: nốt Rê lặp lại xen kẽ với các nốt đi lên theo nửa cung, căng thẳng
    dần đến nốt cao nhất của bài.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n27
  cau: 'Theo dõi, dòng 6: những hợp âm cuối cùng, kết về Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n29
  cau: 'Sarabande của cùng tổ khúc: một điệu nhảy chậm, nhịp 3/4.'
  loai: cau-truc
- trang: nghe-nhac/bach-cello-1
  id: n32
  cau: 'Mục Nguồn: Mutopia (Schirmer 1916), IMSLP, lời tựa Henle HN 666, niên biểu Fundació
    Pau Casals, MusicBrainz.'
  loai: ten
- trang: nghe-nhac/bach-cello-1
  id: n28
  cau: 'Câu hỏi nghe chủ động 1–2: nghe ra bè trầm và hợp âm; so sánh Casals (thu những năm
    1930) với một bản thu hiện đại.'
  loai: khuyen-tap
- trang: nghe-nhac/handel-hallelujah
  id: n1
  cau: Handel (1685–1759) (bảng và đoạn đầu).
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n2
  cau: 'Bảng: Hợp xướng "Hallelujah" là số 44 theo cách đánh số thường gặp (có ấn bản đánh
    số 39), kết thúc Phần II của oratorio Messiah, HWV 56.'
  loai: danh-muc
- trang: nghe-nhac/handel-hallelujah
  id: n3
  cau: 'Bảng: Phần lớn viết trong khoảng 22/8–14/9/1741 (24 ngày).'
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n4
  cau: Công diễn lần đầu ngày 13/4/1742 tại Dublin (bảng và đoạn văn).
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n5
  cau: 'Bảng: Lời của Charles Jennens, trích Kinh Thánh (Khải Huyền 19:6, 19:16; 11:15).'
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n6
  cau: 'Bảng: Giọng Rê trưởng, có trumpet và timpani.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n7
  cau: 'Bảng: Lực lượng: hợp xướng bốn bè và dàn nhạc Baroque (trumpet, timpani, đàn dây,
    continuo).'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n8
  cau: 'Bảng và đoạn văn: dài khoảng 3–4 phút.'
  loai: so-lieu
- trang: nghe-nhac/handel-hallelujah
  id: n9
  cau: Handel là nhà soạn nhạc sinh ở Đức, sống và thành danh ở London.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n10
  cau: Ông viết opera tiếng Ý suốt nhiều năm, nhưng khi opera Ý ở London bớt được ưa chuộng,
    ông chuyển dần sang oratorio.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n11
  cau: 'Oratorio: tác phẩm tôn giáo có tính kịch cho ca sĩ, hợp xướng và dàn nhạc, thường
    diễn không dàn dựng, không phục trang.'
  loai: dinh-nghia
- trang: nghe-nhac/handel-hallelujah
  id: n12
  cau: Messiah hát bằng tiếng Anh.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n13
  cau: Messiah là tác phẩm làm tên tuổi Handel được biết khắp thế giới, và là oratorio phổ
    biến nhất.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n14
  cau: Mùa hè năm 1741, Handel đang nợ nần và tưởng sự nghiệp đã hết.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n15
  cau: Lời do Charles Jennens chọn từ Kinh Thánh, kể về Đấng Cứu Thế.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n16
  cau: 'Ba phần: lời tiên tri và giáng sinh (Phần I); chịu nạn, phục sinh, thăng thiên và
    lời rao giảng lan ra (Phần II); sự sống lại của người chết và chiến thắng cái chết (Phần
    III).'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n17
  cau: Theo ngày Handel ghi trên bản viết tay, ông viết phần lớn bản nhạc trong khoảng 24
    ngày (22/8–14/9/1741).
  loai: nam
- trang: nghe-nhac/handel-hallelujah
  id: n18
  cau: Buổi công diễn đầu là một buổi hòa nhạc từ thiện.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n19
  cau: '"Hallelujah" là hợp xướng kết thúc Phần II: khúc khải hoàn sau khi câu chuyện đã đi
    qua đau khổ đến chiến thắng.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n20
  cau: Cả bài chỉ dùng ba câu ngắn trong sách Khải Huyền.
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n21
  cau: Handel viết ở giọng Rê trưởng cùng trumpet và timpani, bộ đôi thời ấy hay dùng cho
    dịp lễ hội.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n22
  cau: Ở Anh, khán giả đôi khi vẫn đứng dậy khi hợp xướng này vang lên; chuyện thường được
    kể là ở một buổi diễn tại London năm 1743, cả khán phòng, dẫn đầu là vua George II, đã
    đứng dậy khi hợp xướng bắt đầu và đứng tới hết.
  loai: lich-su
- trang: nghe-nhac/handel-hallelujah
  id: n23
  cau: 'Sơ đồ, Mở đầu: dàn nhạc dạo ba ô, rồi cả hợp xướng hô "Hallelujah!"; bốn bè cùng nhịp
    (chủ điệu), môtip ngắn.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n24
  cau: 'Sơ đồ, Đoạn 1: "for the Lord God omnipotent reigneth": các bè hát đồng âm (cùng giai
    điệu, cách nhau quãng tám) trước, rồi lần lượt vào đuổi nhau, xen kẽ tiếng hô Hallelujah.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n25
  cau: 'Sơ đồ, Đoạn 2: "The kingdom of this world is become…": bốn bè cùng nhịp, nốt dài,
    như thánh ca.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n26
  cau: 'Sơ đồ, Đoạn 3: "and He shall reign for ever and ever": fugue, chủ đề mở bằng một bước
    nhảy quãng lớn, các bè vào lần lượt: bass, tenor, alto, soprano.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n27
  cau: 'Sơ đồ, Cao trào: "King of kings, and Lord of Lords": soprano (lúc đầu cùng alto) giữ
    một nốt dài, rồi mỗi lần lên cao hơn một bậc, trumpet giữ cùng nốt; các bè khác đáp "for
    ever and ever, Hallelujah".'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n28
  cau: 'Sơ đồ, Kết: cả hợp xướng và dàn nhạc im lặng hai phách, rồi tiếng "Hallelujah" cuối
    bằng nốt dài.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n29
  cau: 'Theo dõi (6 dòng): sau ba ô dạo, hợp xướng hô "Hallelujah!" cùng lúc; "for the Lord
    God…" các bè hát cùng một giai điệu rồi đuổi nhau; "The kingdom…" nhạc chùng xuống, bốn
    bè cùng nhịp bằng nốt dài; "and He shall reign…" bass vào trước, rồi tenor, alto, soprano;
    "King of kings…" soprano cùng trumpet giữ nốt dài lên từng bậc, các bè khác đáp; im lặng
    hai phách rồi "Hallelujah" cuối bằng nốt dài.'
  loai: cau-truc
- trang: nghe-nhac/handel-hallelujah
  id: n35
  cau: 'Mục Nguồn: Mutopia (Händel-Gesellschaft, Chrysander 1902), IMSLP, Thư viện Anh R.M.20.f.2,
    Concise Oxford Dictionary of Music (Messiah, Hallelujah Chorus, oratorio, Handel).'
  loai: ten
- trang: nghe-nhac/handel-hallelujah
  id: n31
  cau: 'Câu hỏi nghe chủ động (ba câu): phân biệt đoạn cùng nhịp và đoạn fugue; đếm số lần
    "Hallelujah"; điều gì khiến người ta muốn đứng lên.'
  loai: khuyen-tap
- trang: nghe-nhac/haydn-94
  id: n1
  cau: 'Bảng: Joseph Haydn (1732–1809).'
  loai: nam
- trang: nghe-nhac/haydn-94
  id: n2
  cau: 'Bảng: Tên đầy đủ: Giao hưởng số 94 cung Sol trưởng, Hob. I:94.'
  loai: danh-muc
- trang: nghe-nhac/haydn-94
  id: n3
  cau: 'Bảng: Sáng tác năm 1791, công diễn lần đầu tại London ngày 23/3/1792.'
  loai: nam
- trang: nghe-nhac/haydn-94
  id: n4
  cau: 'Bảng: Thời kỳ Cổ điển.'
  loai: lich-su
- trang: nghe-nhac/haydn-94
  id: n5
  cau: 'Bảng: Chương 2 là Andante, Đô trưởng, dài khoảng 6 phút.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n6
  cau: Haydn viết bản giao hưởng này cho loạt hòa nhạc của Johann Peter Salomon ở London.
  loai: lich-su
- trang: nghe-nhac/haydn-94
  id: n7
  cau: Chương 2 nổi tiếng nhờ một hợp âm rất to bất ngờ của cả dàn nhạc (ô 16) chen vào giữa
    một giai điệu rất nhỏ nhẹ.
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n8
  cau: Từ hợp âm ấy bản giao hưởng có biệt danh Surprise (Bất ngờ).
  loai: ten
- trang: nghe-nhac/haydn-94
  id: n9
  cau: 'Có chuyện kể Haydn muốn đánh thức khán giả ngủ gật, nhưng chính ông đã bác: theo người
    viết tiểu sử Griesinger, Haydn nói ông chỉ muốn làm công chúng bất ngờ bằng một điều mới.'
  loai: lich-su
- trang: nghe-nhac/haydn-94
  id: n10
  cau: 'Chương nhạc viết theo hình thức chủ đề và biến tấu: một giai điệu đơn giản được nhắc
    lại nhiều lần, mỗi lần biến đổi theo một cách khác.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n11
  cau: 'Theo dõi, dòng 1: chủ đề, chỉ đàn dây, chơi nhỏ, giai điệu đơn giản bằng nốt móc đơn.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n12
  cau: 'Theo dõi, dòng 2: chủ đề nhắc lại nhỏ hơn nữa, rồi hợp âm fortissimo cùng tiếng timpani.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n13
  cau: 'Theo dõi, dòng 3: nửa sau của chủ đề.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n14
  cau: 'Theo dõi, dòng 4: biến tấu 1, giai điệu giữ nguyên ở violin 2 và viola, violin 1 thêm
    bè trang trí bên trên.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n15
  cau: 'Theo dõi, dòng 5: biến tấu 2 chuyển sang Đô thứ, mở đầu rất to (ff).'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n16
  cau: 'Theo dõi, dòng 6: biến tấu 3 về Đô trưởng, oboe chơi chủ đề bằng chuỗi nốt móc kép
    nhắc lại, kèn gỗ nổi bật.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n17
  cau: 'Theo dõi, dòng 7: biến tấu 4, cả dàn nhạc chơi rất to (ff), violin chạy nốt nhanh.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n18
  cau: 'Theo dõi, dòng 8: coda nhỏ dần (sempre dim.), kết thúc rất nhỏ.'
  loai: cau-truc
- trang: nghe-nhac/haydn-94
  id: n23
  cau: 'Mục Nguồn: tổng phổ Cranz trên Internet Archive, IMSLP, lời tựa Henle HN 9062.'
  loai: ten
- trang: nghe-nhac/haydn-94
  id: n19
  cau: 'Câu hỏi nghe chủ động (ba câu): giật mình ở hợp âm bất ngờ; thành phần nào của chủ
    đề giữ lại trong mỗi biến tấu; biến tấu ở giọng thứ tạo cảm giác khác thế nào.'
  loai: khuyen-tap
