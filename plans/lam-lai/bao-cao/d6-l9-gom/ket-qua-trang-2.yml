- trang: nghe-nhac/mozart-eine-kleine
  id: n1
  luot_2: dung
  nguon: ["https://www.deutsche-biographie.de/pnd118584596.html"]
  ghi_chu: "Deutsche Biographie: * 27.1.1756, † 5.12.1791."
- trang: nghe-nhac/mozart-eine-kleine
  id: n2
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_125_-19_-3_eng.pdf", "https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049"]
  ghi_chu: "Lời tựa NMA IV/12/6: \"Serenade in G KV 525, Eine kleine Nachtmusik\"; Köchel online cùng tên. Nghĩa \"một bản nhạc đêm nhỏ\" là dịch đúng."
- trang: nghe-nhac/mozart-eine-kleine
  id: n3
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049", "https://dme.mozarteum.at/DME/objs/pdf/nma_125_-19_-3_eng.pdf"]
  ghi_chu: "Köchel online: \"Vienna, 10.08.1787\"; NMA: Mozart ghi vào danh mục tác phẩm của mình."
- trang: nghe-nhac/mozart-eine-kleine
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Category:Mozart,_Wolfgang_Amadeus"]
  ghi_chu: "IMSLP: Mozart thuộc \"People from the Classical era\"."
- trang: nghe-nhac/mozart-eine-kleine
  id: n5
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049", "https://dme.mozarteum.at/DME/objs/pdf/nma_125_-19_-3_eng.pdf"]
  ghi_chu: "Köchel online: biên chế \"vl1, vl2, vla, vlc+b\"; \"genre designation Serenade, which originated not from Mozart but is only found in the first print\". NMA: bản in đầu của André gọi là Serenade, bản tay của Mozart không có tên."
- trang: nghe-nhac/mozart-eine-kleine
  id: n6
  luot_2: dung
  nguon: ["https://musicbrainz.org/ws/2/recording/?query=recording:(%22Eine%20kleine%20Nachtmusik%22)%20AND%20recording:(%22I.%20Allegro%22)&limit=50&fmt=json"]
  ghi_chu: "Tìm kiếm bản ghi MusicBrainz \"Eine kleine Nachtmusik\" \"I. Allegro\": phần lớn bản thu dài 5:20–6:00 (khoảng 320–360 giây)."
- trang: nghe-nhac/mozart-eine-kleine
  id: n7
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049"]
  ghi_chu: "Köchel online: \"one of Wolfgang Amadé Mozart's most popular and best-known works today\"; \"first printed around 1837, almost 50 years after Mozart's death\" (mục nguồn của trang ghi bản in đầu 1825–1827: cả hai đều nhiều năm sau khi ông mất). Vế mô tả trang (một chương sonata, đàn dây, 1787) khớp NMA và Köchel."
- trang: nghe-nhac/mozart-eine-kleine
  id: n8
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049"]
  ghi_chu: "Köchel online: \"The original title refers to its use in the evening and at night\"; \"Night musics (nocturnes) were usually written on the occasion of friends' name days or on commission.\""
- trang: nghe-nhac/mozart-eine-kleine
  id: n9
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_125_-19_-3_eng.pdf"]
  ghi_chu: "NMA IV/12/6 (lời tựa E. F. Schmid): \"The occasion for which the work was written in the summer of 1787 ... is still unknown.\""
- trang: nghe-nhac/mozart-eine-kleine
  id: n10
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049", "https://dme.mozarteum.at/DME/objs/pdf/nma_125_-19_-3_eng.pdf"]
  ghi_chu: "Köchel: 10.08.1787; NMA: viết mùa hè 1787 trong lúc Mozart soạn màn II Don Giovanni."
- trang: nghe-nhac/mozart-eine-kleine
  id: n11
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV525/MozartWA-KV525/MozartWA-KV525-lys.zip", "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/"]
  ghi_chu: "Bản Mutopia (theo Breitkopf & Härtel 1883), chương 1 Allegro: trình bày ô 1–55 có nhắc lại, phát triển 56–75, tái hiện từ 76: hình thức sonata theo Open Music Theory."
- trang: nghe-nhac/mozart-eine-kleine
  id: n13
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV525/MozartWA-KV525/MozartWA-KV525-lys.zip"]
  ghi_chu: "Mutopia, chương 1 ô 1–4: cả bốn bè (violin I, II, viola, cello và bass) chơi cùng một nét theo quãng tám (violin bấm hợp âm ở phách đầu), đi lên theo nốt hợp âm Sol trưởng Sol–Rê–Sol–Si–Rê rồi đáp xuống ở ô 3–4."
- trang: nghe-nhac/mozart-eine-kleine
  id: n14
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV525/MozartWA-KV525/MozartWA-KV525-lys.zip"]
  ghi_chu: "Mutopia: chủ đề 2 ô 28 (La–Sol–Fa♯–Mi–Rê), Rê trưởng, p."
- trang: nghe-nhac/mozart-eine-kleine
  id: n15
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV525/MozartWA-KV525/MozartWA-KV525-lys.zip"]
  ghi_chu: "Mutopia: phát triển ô 56–75 (20 ô), mở bằng chủ đề 1 ở Rê trưởng; ô 66–73 có Si♭, Mi♭ (cello Mi♭ ô 69–70) mang màu thứ; ô 75 dẫn về Sol trưởng ở ô 76."
- trang: nghe-nhac/mozart-eine-kleine
  id: n16
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV525/MozartWA-KV525/MozartWA-KV525-lys.zip"]
  ghi_chu: "Mutopia: tái hiện ô 76 chủ đề 1 ở Sol trưởng; chủ đề 2 ô 101 ở Sol trưởng."
- trang: nghe-nhac/mozart-eine-kleine
  id: n17
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_125_-19_-3_eng.pdf", "https://kv.mozarteum.at/en/work/eine-kleine-nachtmusik-a-little-night-music-6049"]
  ghi_chu: "NMA: Mozart ghi \"Allegro, Menuett und Trio. – Romance. Menuett und Trio, und Finale\"; \"The 1st Menuett and Trio of the work is lost\". Köchel: \"Menuetto (verschollen)\"."
- trang: nghe-nhac/mozart-eine-kleine
  id: n19
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV525/MozartWA-KV525/MozartWA-KV525-lys.zip"]
  ghi_chu: "Mutopia ô 1–4: mọi bè đồng loạt, nét đi lên nhanh (kiểu \"tên lửa Mannheim\")."
- trang: nghe-nhac/mozart-eine-kleine
  id: n20
