- trang: nghe-nhac/mozart-40
  id: n1
  luot_2: dung
  nguon: ["https://www.deutsche-biographie.de/pnd118584596.html"]
  ghi_chu: "Deutsche Biographie (GND 118584596): * 27.1.1756 Salzburg, † 5.12.1791 Wien."
- trang: nghe-nhac/mozart-40
  id: n2
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/symphony-in-g-minor-11586", "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Köchel online: KV 550, Symphony in G minor; tổng phổ NMA IV/11/9 tr. 63: \"Sinfonie in g KV 550\" (Sol thứ, hai dấu giáng). Số 40 là số thứ tự quen dùng, không ghi ở hai nguồn này."
- trang: nghe-nhac/mozart-40
  id: n3
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_111_-18_-3_eng.pdf", "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1", "https://kv.mozarteum.at/en/work/symphony-in-g-minor-11586"]
  ghi_chu: "Lời tựa NMA IV/11/9 (Robbins Landon): Verzeichnüß ghi KV 543 ngày 26/6, KV 550 ngày 25/7, KV 551 ngày 10/8/1788; tổng phổ ghi \"Vollendet Wien, 25. Juli 1788\"; Köchel online: Vienna 25.07.1788."
- trang: nghe-nhac/mozart-40
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Category:Mozart,_Wolfgang_Amadeus"]
  ghi_chu: "IMSLP xếp Mozart vào \"People from the Classical era\"."
- trang: nghe-nhac/mozart-40
  id: n5
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Tổng phổ NMA IV/11/9 tr. 63, chương 1: \"Molto Allegro\"."
- trang: nghe-nhac/mozart-40
  id: n6
  luot_2: dung
  nguon: ["https://musicbrainz.org/ws/2/recording/?query=recording:(%22Molto%20allegro%22)%20AND%20recording:(550%20OR%20%2240%22)&limit=50&fmt=json"]
  ghi_chu: "Tìm kiếm bản ghi MusicBrainz \"Molto allegro\" K.550: phần lớn bản thu dài 7:30–8:00 (khoảng 450–475 giây); vài bản không nhắc lại ngắn hơn."
- trang: nghe-nhac/mozart-40
  id: n7
  luot_2: dung
  nguon: ["https://www.pmgma.com/ebooks/grant-park/grant-park-music-festival-2014-issue10/files/assets/basic-html/page38.html", "https://baroque.boston/mozart-symphony-40"]
  ghi_chu: "Ghi chú chương trình Grant Park 2014 (tr. 38): sau No. 25 K. 183, Mozart \"was to write only one other minor-key symphony: ... No. 40, K. 550 of 1788, also in G minor\"; Boston Baroque: \"one of only two Mozart symphonies in minor\". Tính các giao hưởng đích thực còn lại."
- trang: nghe-nhac/mozart-40
  id: n8
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_111_-18_-3_eng.pdf"]
  ghi_chu: "Lời tựa NMA IV/11/9: bản đầu cho 1 flute, 2 oboe, 2 bassoon, 2 horn và dàn dây; \"Mozart later added clarinets and correspondingly changed the oboe parts\"; NMA in cả hai bản."
- trang: nghe-nhac/mozart-40
  id: n9
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1", "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/"]
  ghi_chu: "Tổng phổ NMA: trình bày ô 1–100 (dấu nhắc lại ô 100), phát triển từ ô 101, tái hiện chủ đề 1 ở Sol thứ; đúng các phần của hình thức sonata theo Open Music Theory (đọc bản lưu Wayback 2026-06-07 vì trang gốc trả 403)."
- trang: nghe-nhac/mozart-40
  id: n12
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1", "https://dme.mozarteum.at/DME/objs/pdf/nma_111_-18_-3_eng.pdf"]
  ghi_chu: "Tổng phổ NMA tr. 63: viola chia bè (divisi) rải móc đơn từ ô 1, violin I và II vào cuối ô 1 với cặp nốt Mi♭–Rê luyến đi xuống, Sol thứ. Lời tựa NMA cũng nói đầu KV 550 viola chơi divisi."
- trang: nghe-nhac/mozart-40
  id: n13
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Tổng phổ NMA tr. 65: từ ô 28 cả dàn nhạc chơi f (forte), chuyển sang giọng Si♭ trưởng."
- trang: nghe-nhac/mozart-40
  id: n14
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Tổng phổ NMA tr. 66: chủ đề 2 từ ô 44, Si♭ trưởng, p, giai điệu đi xuống nửa cung (Si♭–La–La♭–Sol…), đàn dây và kèn gỗ chuyền nhau (ô 44–51 rồi 52–). \"Giọng trưởng song song\" theo cách gọi nhạc lý Việt Nam (giọng cùng hóa biểu, tiếng Anh: relative major)."
- trang: nghe-nhac/mozart-40
  id: n15
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Tổng phổ NMA tr. 70: phần kết của trình bày đến ô 100, có dấu nhắc lại."
- trang: nghe-nhac/mozart-40
  id: n16
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Tổng phổ NMA tr. 70: ô 101–104 kèn gỗ chuyển giọng đột ngột, từ ô 105 chủ đề 1 ở Fa♯ thứ (bass Fa♯), các trang sau mô-típ chủ đề 1 đi qua nhiều giọng."
- trang: nghe-nhac/mozart-40
  id: n17
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Tổng phổ NMA: tái hiện, chủ đề 1 trở lại ở Sol thứ (khoảng ô 164)."
- trang: nghe-nhac/mozart-40
  id: n18
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1", "https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/"]
  ghi_chu: "Tổng phổ NMA tr. 76–77: chủ đề 2 ở tái hiện (khoảng ô 191) ở Sol thứ; Open Music Theory: ở tái hiện chủ đề phụ \"now in the tonic\"."
- trang: nghe-nhac/mozart-40
  id: n19
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMTEmcDE9NjMmcDI9ODQmbD0xJnRpdGxlPU5NQStJViUyRjExJTJGOSUzQStLJTNBKzU1MCUyRjAx&cc=ea54de4c60360e73a013b2ce69189eaa&pdf=1"]
  ghi_chu: "Tổng phổ NMA tr. 84: chương kết bằng các hợp âm Sol thứ (ô 292–299)."
- trang: nghe-nhac/mozart-40
  id: n21
  luot_2: dung
  nguon: ["https://viva.pressbooks.pub/openmusictheory/chapter/sonata-form/"]
  ghi_chu: "Open Music Theory, chương \"Sonata Form\": \"The recapitulation’s secondary theme should be in the overall tonic key\"; \"secondary theme and closing sections are now in the tonic\"."
- trang: nghe-nhac/mozart-40
  id: n23
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=111", "https://dme.mozarteum.at/DME/objs/pdf/nma_111_-18_-3_eng.pdf", "https://kv.mozarteum.at/en/work/symphony-in-g-minor-11586"]
  ghi_chu: "Ba nguồn có thật: NMA IV/11/9 (Robbins Landon, 1957) trên DME có tổng phổ KV 550; Köchel online có trang KV 550; trang ghi chú chương trình của Indianapolis Symphony Orchestra về Giao hưởng số 40 có trong kết quả tìm kiếm (không mở trang này để giữ độc lập với lượt 1)."
