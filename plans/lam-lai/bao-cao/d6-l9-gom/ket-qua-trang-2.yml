  nguon: ["https://www.mutopiaproject.org/ftp/MozartWA/KV525/MozartWA-KV525/MozartWA-KV525-lys.zip"]
  ghi_chu: "Đọc bản Mutopia ô 5–17: violin I hát giai điệu, các bè khác đệm cùng tiết tấu (ô 5–10), ô 11 và 15 violin I một mình rồi các bè vào hòa âm. Không thấy chỗ rõ là bè thấp \"trả lời\" bè cao; chỗ đối đáp rõ nhất là ô 1–2 (Sol trưởng) và 3–4 (Rê bảy), nhưng chơi đồng âm. Cần chỉ rõ ô nhịp hay sửa câu."
- trang: nghe-nhac/mozart-eine-kleine
