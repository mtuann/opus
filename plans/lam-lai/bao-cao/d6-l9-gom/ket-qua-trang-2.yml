  id: n5
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=73"]
  ghi_chu: "NMA II/5/19, mục lục: \"No. 14: <Aria> Der Hölle Rache kocht in meinem Herzen\", thuộc màn II (Act II từ tr. 191; aria tr. 224–231). Dịch nghĩa hợp lý."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n6
  luot_2: dung
  nguon: ["https://www.classical-music.com/features/musical-terms/what-soprano", "https://www.glyndebourne.com/festival/queen-of-the-heights"]
  ghi_chu: "classical-music.com: coloratura là giọng soprano nổi bật ở độ linh hoạt âm vực cao, nốt Fa cao trong \"Der Hölle Rache\" là mục tiêu của cả hai loại coloratura; Glyndebourne: vai đòi \"passages of coloratura\"."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n7
  luot_2: dung
  nguon: ["https://musicbrainz.org/ws/2/recording/?query=recording:%22Der%20H%C3%B6lle%20Rache%20kocht%20in%20meinem%20Herzen%22&limit=40&fmt=json"]
  ghi_chu: "MusicBrainz: các bản thu aria (giọng hát) dài khoảng 2:50–3:40 (Gruberová 2:52, Deutekom 2:57, Lipp 3:20, Karajan 3:39), trung vị khoảng 2:57. \"Khoảng 3–4 phút\" chấp nhận được, dù phần lớn chỉ khoảng 3 phút; có thể ghi \"khoảng 3 phút\"."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n8
  luot_2: dung
  nguon: ["https://musicbrainz.org/release/e8ac3f13-54ab-4297-89f4-fbfb6f1b28ff", "https://www.europadisc.co.uk/classical/58523/Mozart_-_Die_Zauberflote.htm"]
  ghi_chu: "MusicBrainz: DVD \"Die Zauberflöte\" 2003, Opus Arte OA 0886 D, Damrau, Keenlyside, Röschmann, Colin Davis; Europadisc (bản Blu-ray cùng buổi diễn): \"David McVicar's 2003 production\", \"live at Covent Garden\", Royal Opera House, Sir Colin Davis, Queen of the Night: Diana Damrau."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n9
  luot_2: dung
  nguon: ["https://kv.mozarteum.at/en/work/ouverture-7138", "https://dme.mozarteum.at/DME/objs/pdf/nma_73_-27_-3_eng.pdf"]
  ghi_chu: "Köchel online: \"Singspiel („Große Oper“) in 2 Aufzügen\", \"written for a successful suburban theater in Vienna\", Schikaneder; NMA: Theater auf der Wieden của Schikaneder (và Bauernfeld), áp phích \"A grand opera in 2 Acts, by Emmanuel Schikaneder\"; NMA nói về các đoạn thoại nói (spoken dialogues)."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n10
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=73", "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT04OSZwMj0xMTMmbD0xJnRpdGxlPU5NQStJSSUyRjUlMkYxOSUzQStLJTNBKzYyMCUyRjA1&cc=17be9c9874f901c7e02fabb49c8ae899&pdf=1", "https://dme.mozarteum.at/DME/objs/pdf/nma_73_-27_-3_eng.pdf"]
  ghi_chu: "NMA: No. 4 của Nữ hoàng có đoạn \"Du, du, du wirst sie zu befreien gehen\" (nói với Tamino); No. 5 Quintetto Tamino và Papageno cùng các thị nữ (\"Zauberflöten sind zu unserm Schutz vonnöten\"); áp phích: \"Pramina, her daughter\"."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n11
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1"]
  ghi_chu: "NMA tr. 224, lời thoại trước No. 14: \"Siehst du hier diesen Stahl? – Er ist für Sarastro geschliffen. – Du wirst ihn töten\"; Nữ hoàng gọi Sarastro là \"Todfeinde\"."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n12
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1"]
  ghi_chu: "Lời aria trong NMA: \"so bist du meine Tochter nimmermehr\", \"Verstoßen sei auf ewig, verlassen sei auf ewig\"."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n13
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1", "https://www.glyndebourne.com/festival/queen-of-the-heights"]
  ghi_chu: "Tổng phổ NMA tr. 226 ô 30–31: chùm nốt rải lên tới Fa6 (ba dòng kẻ phụ trên khuông, trên Mi6); Glyndebourne: \"climbs to the height of F6\"."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n14
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1"]
  ghi_chu: "NMA tr. 224: dàn nhạc ô 1 và hai phách đầu ô 2, Nữ hoàng vào ở nửa sau ô 2; hóa biểu một dấu giáng, Rê thứ."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n15
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1"]
  ghi_chu: "NMA tr. 224–225: các câu \"Der Hölle Rache…\" với f, sf."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n16
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1"]
  ghi_chu: "NMA tr. 226: ô 24–29 các nốt staccato nhắc lại, ô 30–31 chùm rải lên Fa6."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n17
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1"]
  ghi_chu: "NMA tr. 228–230: \"Verstoßen sei auf ewig, verlassen sei auf ewig, zertrümmert…\" rồi chuỗi coloratura trên \"Ban-de\" ô 69–79 (khoảng 11 ô, dài hơn chuỗi thứ nhất khoảng 9 ô)."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n18
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1"]
  ghi_chu: "NMA tr. 231: \"Hört, hört, hört, Rachegötter, hört der Mutter Schwur!\" (ô 89–97), rồi dàn nhạc kết ở Rê thứ (ô 98–101, \"Sie versinkt\")."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n22
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=73", "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD03MyZwMT0yMjQmcDI9MjMxJmw9MSZ0aXRsZT1OTUErSUklMkY1JTJGMTklM0ErSyUzQSs2MjAlMkYxNA==&cc=d5550fbf5aa6cae4cf94a681038429d6&pdf=1", "https://musicbrainz.org/release/e8ac3f13-54ab-4297-89f4-fbfb6f1b28ff"]
  ghi_chu: "NMA II/5/19 trên DME: No. 14 tr. 224–231 (bản Gruber–Orel 1970; DME còn có bản Faber 2006); lời thoại ở cùng trang. Köchel online có KV 620. MusicBrainz: Opus Arte OA 0886 D, 2003. Trang DVD của ROH (shop.roh.org.uk) có trong kết quả tìm kiếm nhưng trả 429 khi mở."
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n19
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên nghe hợp lý."
- trang: nghe-nhac/mozart-requiem
  id: n1
  luot_2: dung
  nguon: ["https://www.deutsche-biographie.de/pnd118584596.html"]
  ghi_chu: "Deutsche Biographie: * 27.1.1756, † 5.12.1791."
- trang: nghe-nhac/mozart-requiem
  id: n2
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=13", "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT0zJnAyPTkmbD0xJnRpdGxlPU5NQStJJTJGMSUyRkFidC4rMiUyRjElM0ErSyUzQSs2MjYlMkYwMQ==&cc=6123d33506826cec923e680ddf0758e6&pdf=1"]
  ghi_chu: "NMA I/1/Abt. 2/1: \"Requiem ... K. 626\"; Introitus một dấu giáng, Rê thứ."
- trang: nghe-nhac/mozart-requiem
  id: n3
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf", "https://www.deutsche-biographie.de/pnd118584596.html"]
  ghi_chu: "NMA: Mozart bắt đầu khoảng đầu hè 1791, tác phẩm dang dở (fragment); mất 5.12.1791."
- trang: nghe-nhac/mozart-requiem
  id: n4
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_14_-23_-3_eng.pdf"]
  ghi_chu: "NMA I/1/Abt. 2/2: \"The task thus devolved upon the then 25 year-old Franz Xaver Süßmayr ... a pupil of Mozart's ... it is quite certain that he finished the Requiem\"."
- trang: nghe-nhac/mozart-requiem
  id: n5
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Category:Mozart,_Wolfgang_Amadeus"]
  ghi_chu: "IMSLP: Mozart thuộc \"People from the Classical era\"."
- trang: nghe-nhac/mozart-requiem
  id: n6
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA: Mozart ghi Canto, Alto, Tenore, Basso (hợp xướng), Canto/Alto/Tenore/Basso Solo ở Recordare, cùng dàn nhạc; nghi thức Mass for the Dead."
- trang: nghe-nhac/mozart-requiem
  id: n7
  luot_2: khong-chac
  nguon: ["https://musicbrainz.org/release/bf2c86b8-de40-4813-8678-17213b60e42f", "https://musicbrainz.org/release/33a345bb-7d0b-4586-8a1c-203fa454d3f8", "https://musicbrainz.org/release/27df76e7-7648-40c9-9584-f93158f1c2e5"]
  ghi_chu: "Ba bản thu trên MusicBrainz (bản Süßmayr): Kertész 53 phút, Introitus–Lacrimosa 28 phút; Herreweghe khoảng 47 phút, 25 phút; Abbado khoảng 48 phút, 24 phút. Tổng 50–55 phút chỉ đúng với bản chậm; phần Introitus–Lacrimosa khoảng 25–28 phút, không tới 30. Gợi ý: \"khoảng 45–55 phút; … khoảng 25 phút\"."
- trang: nghe-nhac/mozart-requiem
  id: n8
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA: một người lạ (\"grey messenger\") mang yêu cầu của bá tước giấu tên; \"This must in all likelihood have been at the beginning of Summer 1791.\""
- trang: nghe-nhac/mozart-requiem
  id: n9
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA: Franz, Count of Walsegg-Stuppach, vợ Anna mất 14/2/1791, ông muốn đặt một Requiem tưởng nhớ bà; ông thường đặt nhạc rồi \"passed them off as his own\"."
- trang: nghe-nhac/mozart-requiem
  id: n10
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA: sáu tháng cuối đời Mozart viết The Magic Flute, La clemenza di Tito và Kleine Freimaurer-Kantate cùng Requiem, xen kẽ; \"Mozart's being confined to bed from 20 November\"."
- trang: nghe-nhac/mozart-requiem
  id: n11
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf", "https://dme.mozarteum.at/DME/objs/pdf/nma_73_-27_-3_eng.pdf"]
  ghi_chu: "NMA nói về \"grey messenger, who has become famous in literature\"; lời tựa NMA II/5/19: về năm cuối đời Mozart \"there is much unreliable and legendary material\"."
- trang: nghe-nhac/mozart-requiem
  id: n12
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA: Introit và Kyrie là hai chương Mozart viết xong, \"for which Mozart himself provided complete instrumentation\"; tổng phổ Introitus đủ mọi bè."
- trang: nghe-nhac/mozart-requiem
  id: n13
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA: từ Sequence (Dies irae) đến Hostias, Mozart viết bè hát, bè trầm (Organo e Bassi, có số hòa âm) và ghi một phần dàn nhạc (violin I, basset horn, bassoon ở vài chỗ). Ghi chú: NMA coi Kyrie đã được viết đủ, nên câu \"từ Kyrie\" nên đọc là Kyrie có bè hát và bè trầm của Mozart; phần nhạc cụ của Kyrie do người khác chép theo bè hát là điều nghiên cứu sau NMA nêu."
- trang: nghe-nhac/mozart-requiem
  id: n14
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf", "https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT00NiZwMj00NiZsPTEmdGl0bGU9Tk1BK0klMkYxJTJGQWJ0LisyJTJGMSUzQStLJTNBKzYyNiUyRjA4&cc=6683d34a64cca61886954c4bd97c26a6&pdf=1"]
  ghi_chu: "NMA: \"The eight measures of the Lacrimosa are Mozart's last notes\"; tổng phổ NMA tr. 46 dừng ở ô 8 \"judicandus homo reus\"."
- trang: nghe-nhac/mozart-requiem
  id: n15
  luot_2: khong-chac
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_14_-23_-3_eng.pdf"]
  ghi_chu: "NMA I/1/Abt. 2/2: Constanze túng thiếu (\"straitened circumstances\"), cần phần tiền còn lại; Eybler nhận bản dở ngày 21/12/1791 rồi bỏ; \"Constanze must then have turned to other masters, but all of them declined\", rồi đến Süßmayr. NMA không nói \"nhiều nợ\", và không nói đúng \"hai lần không thành\" (một lần Eybler, sau đó những người khác từ chối, không rõ số người). Gợi ý: \"Constanze cần tiền; Eybler bắt tay vào rồi bỏ, vài người khác từ chối, cuối cùng việc đến tay Süssmayr.\""
- trang: nghe-nhac/mozart-requiem
  id: n16
  luot_2: dung
  nguon: ["https://www.carus-verlag.com/en/composers/mozart/requiem/"]
  ghi_chu: "Carus: bản Süßmayr là \"the classic among the completions and the most frequently performed to this day\", \"still the best-known today\"; Carus có bản Levin, Maunder, Arman, Beyer."
- trang: nghe-nhac/mozart-requiem
  id: n17
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf", "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/dies-irae"]
  ghi_chu: "NMA: Mozart soạn văn bản \"Mass for the Dead in the Missale Romanum\" (tiếng Latin); Encyclopedia.com: Dies irae là sequence của \"Mass for the Dead\" trong Missale Tridentine."
- trang: nghe-nhac/mozart-requiem
  id: n18
  luot_2: dung
  nguon: ["https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/dies-irae"]
  ghi_chu: "Encyclopedia.com (New Catholic Encyclopedia): phần đầu bài thơ là \"description of the Last Judgment\"."
- trang: nghe-nhac/mozart-requiem
  id: n19
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT0zJnAyPTkmbD0xJnRpdGxlPU5NQStJJTJGMSUyRkFidC4rMiUyRjElM0ErSyUzQSs2MjYlMkYwMQ==&cc=6123d33506826cec923e680ddf0758e6&pdf=1"]
  ghi_chu: "NMA tr. 3, Adagio: bassoon vào ô 1, basset horn ô 2, đàn dây đệm; hợp xướng vào từ ô 8, bè bass trước rồi tenor, các bè khác lần lượt."
- trang: nghe-nhac/mozart-requiem
  id: n20
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT0xMCZwMj0xNiZsPTEmdGl0bGU9Tk1BK0klMkYxJTJGQWJ0LisyJTJGMSUzQStLJTNBKzYyNiUyRjAy&cc=7bd63ed3f44179cc2c231a714c2b0569&pdf=1"]
  ghi_chu: "NMA tr. 10: bass hát chủ đề \"Kyrie eleison\" trong khi alto hát chủ đề \"Christe eleison\" (móc kép) cùng lúc; chủ đề Kyrie có bước nhảy Si♭ xuống Đô♯ (quãng 7 giảm)."
- trang: nghe-nhac/mozart-requiem
  id: n22
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf", "https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=13"]
  ghi_chu: "NMA mục lục: Dies irae \"Allegro assai\", NMA dùng đủ 12 dòng (cả dàn nhạc) cho hợp xướng; tiết tấu nhanh."
- trang: nghe-nhac/mozart-requiem
  id: n23
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT0zMSZwMj00MCZsPTEmdGl0bGU9Tk1BK0klMkYxJTJGQWJ0LisyJTJGMSUzQStLJTNBKzYyNiUyRjA2&cc=376403332e603709ddb62d7b473aae26&pdf=1", "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA tr. 31: hai Corno di Bassetto mở đầu p, nhịp 3/4, một dấu giáng (Fa trưởng); bè hát ghi Soprano/Alto/Tenore/Basso solo; NMA: \"The vocal parts are marked Canto Solo, Alto Solo, Tenore Solo, Basso Solo\"."
- trang: nghe-nhac/mozart-requiem
  id: n24
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT0yNCZwMj0yNyZsPTEmdGl0bGU9Tk1BK0klMkYxJTJGQWJ0LisyJTJGMSUzQStLJTNBKzYyNiUyRjA0&cc=da254e8db4f5a51bbdb1b5d15b108eb4&pdf=1", "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA tr. 24: \"Trombone [tenore] solo\" mở đầu, Basso solo \"Tuba mirum spargens sonum\", rồi Tenore solo ô 18; NMA: \"a solo movement for the tenor trombone and the singers\", các giọng độc xướng còn lại vào sau."
- trang: nghe-nhac/mozart-requiem
  id: n25
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT0yOCZwMj0zMCZsPTEmdGl0bGU9Tk1BK0klMkYxJTJGQWJ0LisyJTJGMSUzQStLJTNBKzYyNiUyRjA1&cc=ac2acc3d4bf3d50c320c09e8912b40be&pdf=1"]
  ghi_chu: "NMA tr. 28: Tutti \"Rex!\" bằng hợp âm ở ô 3–5; violin và bass chơi tiết tấu chấm dôi, bè hát \"Rex tremendae\" chấm dôi ô 6."
- trang: nghe-nhac/mozart-requiem
  id: n26
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT00MSZwMj00NSZsPTEmdGl0bGU9Tk1BK0klMkYxJTJGQWJ0LisyJTJGMSUzQStLJTNBKzYyNiUyRjA3&cc=07e9a6345d85ff6328ec3976ef3419b4&pdf=1"]
  ghi_chu: "NMA tr. 41: tenor và bass \"Confutatis maledictis, flammis acribus addictis\" trên bass móc kép dồn dập; bè nữ \"Voca me\" ở các trang sau."
- trang: nghe-nhac/mozart-requiem
  id: n27
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_pdf.php?c=dnNlcD0xMyZwMT00NiZwMj00NiZsPTEmdGl0bGU9Tk1BK0klMkYxJTJGQWJ0LisyJTJGMSUzQStLJTNBKzYyNiUyRjA4&cc=6683d34a64cca61886954c4bd97c26a6&pdf=1", "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf"]
  ghi_chu: "NMA tr. 46: soprano đi lên từng bước ô 5–8 (Rê–Mi–Fa–Sol–La–Si–Đô–Rê, rồi nửa cung Mi♭–Mi–Fa–Fa♯–Sol–Sol♯–La); bản tay của Mozart dừng ở ô 8, phần sau do người khác hoàn thành."
- trang: nghe-nhac/mozart-requiem
  id: n29
  luot_2: sai
  nguon: ["https://imslp.org/wiki/L'Orfeo,_SV_318_(Monteverdi,_Claudio)", "https://imslp.org/wiki/Saul,_HWV_53_(Handel,_George_Frideric)"]
  cau_dung: "Ở thời Baroque, trombone chủ yếu được dùng trong nhạc nhà thờ, dù cũng có mặt trong một số opera và oratorio (như L'Orfeo của Monteverdi, Saul của Handel)."
  ghi_chu: "IMSLP: dàn nhạc của Monteverdi trong opera L'Orfeo (1607) có 5 trombone; oratorio Saul của Handel (1738) có 3 trombone. Trombone thời Baroque gắn chủ yếu với nhạc nhà thờ nhưng không \"chỉ\"."
- trang: nghe-nhac/mozart-requiem
  id: n31
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Câu nói về việc trang bỏ một vế (nhận xét \"phần lớn người nghe không nhận ra\" chỗ đổi người viết), tức câu về chính site; lượt 2 không được mở trang để kiểm, và nguồn ngoài không có số liệu về việc người nghe nhận ra hay không. Nhãn nên là ve-site; bỏ vế ấy là hợp lý vì không có nguồn."
- trang: nghe-nhac/mozart-requiem
  id: n33
  luot_2: dung
  nguon: ["https://dme.mozarteum.at/DME/nma/nma_toc.php?vsep=13", "https://dme.mozarteum.at/DME/objs/pdf/nma_13_-25_-3_eng.pdf", "https://www.carus-verlag.com/en/composers/mozart/requiem/"]
  ghi_chu: "NMA I/1/Abt. 2/1 \"Requiem: Fragment (Leopold Nowak, 1965)\" trên DME, có lời tựa; trang Carus về Requiem có infographic và bảng so sánh các phiên bản (PDF), cảm ơn Ulrich Leisinger về tư vấn học thuật (trang không ghi rõ ông là tác giả bảng). Köchel online có trang KV 626 (không mở được nội dung qua công cụ)."
- trang: nghe-nhac/mozart-requiem
  id: n30
  luot_2: dung
  nguon: []
  ghi_chu: "Lời khuyên nghe hợp lý."
