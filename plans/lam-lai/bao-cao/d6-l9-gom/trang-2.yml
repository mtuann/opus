- trang: nghe-nhac/mozart-40
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791).'
  loai: nam
- trang: nghe-nhac/mozart-40
  id: n2
  cau: 'Bảng: Tên đầy đủ Giao hưởng số 40 cung Sol thứ, K. 550.'
  loai: danh-muc
- trang: nghe-nhac/mozart-40
  id: n3
  cau: 'Bảng: Sáng tác mùa hè năm 1788 (hoàn thành ngày 25/7/1788), cùng với hai bản giao
    hưởng cuối cùng (số 39 và 41).'
  loai: nam
- trang: nghe-nhac/mozart-40
  id: n4
  cau: 'Bảng: Thời kỳ Cổ điển.'
  loai: lich-su
- trang: nghe-nhac/mozart-40
  id: n5
  cau: 'Bảng: Chương 1 có chỉ dẫn tốc độ Molto allegro.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n6
  cau: 'Bảng: Chương 1 dài khoảng 8 phút nếu nhắc lại phần trình bày.'
  loai: so-lieu
- trang: nghe-nhac/mozart-40
  id: n7
  cau: Mozart chỉ viết hai bản giao hưởng ở giọng thứ, cả hai đều ở Sol thứ (số 25 và số 40).
    (Cũng là câu đầu của mô tả trang.)
  loai: lich-su
- trang: nghe-nhac/mozart-40
  id: n8
  cau: 'Bản số 40 có hai phiên bản: bản đầu không có clarinet, bản sửa sau có thêm clarinet.'
  loai: lich-su
- trang: nghe-nhac/mozart-40
  id: n9
  cau: Chương 1 viết ở hình thức sonata.
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n12
  cau: 'Theo dõi, dòng 1 (trình bày): viola rì rầm đệm, rồi chủ đề 1 ở violin: những cặp nốt
    "thở dài" đi xuống, Sol thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n13
  cau: 'Theo dõi, dòng 2: đoạn chuyển: cả dàn nhạc chơi mạnh (forte), chuyển giọng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n14
  cau: 'Theo dõi, dòng 3: chủ đề 2 ở Si♭ trưởng (giọng trưởng song song): nhỏ tiếng, đi xuống
    từng nửa cung, chuyền qua lại giữa đàn dây và kèn gỗ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n15
  cau: 'Theo dõi, dòng 4: phần kết của trình bày; sau đó toàn bộ phần trình bày được nhắc
    lại.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n16
  cau: 'Theo dõi, dòng 5 (phát triển): chuyển giọng đột ngột sang Fa♯ thứ, một giọng xa giọng
    chính; chủ đề 1 bị chia nhỏ, chuyền qua nhiều giọng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n17
  cau: 'Theo dõi, dòng 6 (tái hiện): chủ đề 1 trở lại ở Sol thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n18
  cau: 'Theo dõi, dòng 7: chủ đề 2 trở lại, lần này ở Sol thứ thay vì Si♭ trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n19
  cau: 'Theo dõi, dòng 8 (coda): kết thúc ở Sol thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-40
  id: n21
  cau: 'Câu hỏi 2: chủ đề 2 ở phần tái hiện (giọng thứ) khác gì lúc ở phần trình bày (giọng
    trưởng); đưa chủ đề 2 về giọng chính là việc của phần tái hiện trong hình thức sonata.'
  loai: quy-tac
- trang: nghe-nhac/mozart-40
  id: n23
  cau: 'Mục Nguồn: tổng phổ Neue Mozart-Ausgabe IV/11/9 trên Digital Mozart Edition; Köchel
    online KV 550; ghi chú chương trình của Indianapolis Symphony Orchestra; link tài liệu
    tham khảo.'
  loai: ten
- trang: nghe-nhac/mozart-40
  id: n20
  cau: Câu hỏi nghe chủ động 1 và 3 (có nhận ra phần trình bày nhắc lại không; phần phát triển
    làm gì với chủ đề 1).
  loai: khuyen-tap
- trang: nghe-nhac/mozart-40
  id: n11
  cau: 'Đây là chương để luyện nhận ra ba phần: trình bày, phát triển, tái hiện.'
  loai: khuyen-tap
- trang: nghe-nhac/mozart-eine-kleine
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791).'
  loai: nam
- trang: nghe-nhac/mozart-eine-kleine
  id: n2
  cau: 'Bảng: Tên đầy đủ Serenade cung Sol trưởng, K. 525, Eine kleine Nachtmusik ("Một bản
    nhạc đêm nhỏ").'
  loai: danh-muc
- trang: nghe-nhac/mozart-eine-kleine
  id: n3
  cau: 'Bảng: Mozart ghi tác phẩm vào danh mục tác phẩm của mình ngày 10 tháng 8, 1787 (Vienna).'
  loai: nam
- trang: nghe-nhac/mozart-eine-kleine
  id: n4
  cau: 'Bảng: Thời kỳ Cổ điển.'
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n5
  cau: 'Bảng: Thể loại: viết cho 2 violin, viola, cello và contrabass; tên thể loại Serenade
    có từ bản in đầu, không do Mozart đặt.'
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n6
  cau: 'Bảng: Độ dài chương 1 khoảng 5–6 phút.'
  loai: so-lieu
- trang: nghe-nhac/mozart-eine-kleine
  id: n7
  cau: 'Danh mục Köchel online gọi K. 525 là một trong những tác phẩm nổi tiếng nhất của Mozart
    ngày nay, dù nó chỉ được in lần đầu nhiều năm sau khi ông mất. (Mô tả trang: một chương
    ở hình thức sonata, viết cho đàn dây năm 1787.)'
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n8
  cau: Tên Mozart đặt, Eine kleine Nachtmusik, chỉ loại nhạc để chơi vào buổi tối và ban đêm;
    nhạc như vậy thường viết nhân ngày lễ thánh bổn mạng của bạn bè hay theo đặt hàng.
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n9
  cau: Không ai biết Mozart viết K. 525 nhân dịp nào.
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n10
  cau: Mozart ghi K. 525 vào danh mục ngày 10/8/1787, cùng năm với vở opera Don Giovanni.
  loai: nam
- trang: nghe-nhac/mozart-eine-kleine
  id: n11
  cau: Trang này nói về chương 1 (Allegro), viết ở hình thức sonata.
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n13
  cau: 'Trình bày: chủ đề 1 mở bằng cả bốn bè chơi đồng âm, đi lên theo các nốt của hợp âm
    Sol trưởng rồi đáp xuống.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n14
  cau: 'Trình bày: chủ đề 2 ở giọng Rê trưởng (giọng át).'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n15
  cau: 'Phát triển: ngắn (20 ô nhịp), mở bằng chủ đề 1 ở Rê trưởng, rồi các nốt giáng (Si♭,
    Mi♭) đưa nhạc sang màu giọng thứ trước khi về Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n16
  cau: 'Tái hiện: cả hai chủ đề trở về Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n17
  cau: Tác phẩm vốn có 5 chương, nhưng chương 2 (một minuet có trio) đã thất lạc, nên bản
    ngày nay chỉ còn 4 chương.
  loai: lich-su
- trang: nghe-nhac/mozart-eine-kleine
  id: n19
  cau: 'Theo dõi, dòng 1: chủ đề 1: cả dàn dây đồng loạt, chùm nốt đi lên như tên lửa.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n20
  cau: 'Theo dõi, dòng 2: câu đối đáp: bè cao hát, bè thấp trả lời.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n21
  cau: 'Theo dõi, dòng 3: đoạn chuyển: nhạc dồn dập, chuyển sang giọng mới.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n22
  cau: 'Theo dõi, dòng 4: chủ đề 2: nhẹ nhàng, thanh thoát ở giọng Rê trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n23
  cau: 'Theo dõi, dòng 5: phần kết của trình bày, khép lại nhỏ tiếng bằng những nốt ngắn;
    sau đó cả phần trình bày được nhắc lại.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n24
  cau: 'Theo dõi, dòng 6: phát triển: ngắn, các nốt giáng đưa nhạc sang màu giọng thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n25
  cau: 'Theo dõi, dòng 7: tái hiện: chủ đề 1 trở lại ở Sol trưởng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n26
  cau: 'Theo dõi, dòng 8: chủ đề 2 trở lại, lần này cũng ở Sol trưởng — xung đột được giải
    quyết.'
  loai: cau-truc
- trang: nghe-nhac/mozart-eine-kleine
  id: n31
  cau: 'Mục Nguồn: tổng phổ Neue Mozart-Ausgabe IV/12/6 trên Digital Mozart Edition; Köchel
    online KV 525; link tài liệu tham khảo.'
  loai: ten
- trang: nghe-nhac/mozart-eine-kleine
  id: n28
  cau: Câu hỏi 2, 3 và lời dặn ghi thời điểm (phút:giây) cho từng sự kiện.
  loai: khuyen-tap
- trang: nghe-nhac/mozart-eine-kleine
  id: n27
  cau: 'Câu hỏi 1: đếm xem chùm nốt đi lên mở đầu quay lại bao nhiêu lần trong chương.'
  loai: khuyen-tap
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791).'
  loai: nam
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n2
  cau: 'Bảng: Tác phẩm: opera Die Zauberflöte (Cây sáo thần), K. 620.'
  loai: danh-muc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n3
  cau: 'Bảng: Công diễn ở Vienna, ngày 30/9/1791.'
  loai: nam
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n4
  cau: 'Bảng: buổi công diễn hơn hai tháng trước khi Mozart mất.'
  loai: nam
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n5
  cau: 'Bảng: aria Der Hölle Rache kocht in meinem Herzen (Lửa thù địa ngục sôi sục trong
    tim ta), màn 2, số 14.'
  loai: ten
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n6
  cau: 'Bảng: giọng soprano màu sắc (coloratura).'
  loai: dinh-nghia
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n7
  cau: 'Bảng: độ dài khoảng 3–4 phút.'
  loai: so-lieu
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n8
  cau: 'Bảng: bản thu gợi ý: Diana Damrau trong dàn dựng của David McVicar ở Royal Opera House,
    London, chỉ huy Colin Davis (thu năm 2003, DVD của Opus Arte).'
  loai: ten
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n9
  cau: 'Cây sáo thần là một Singspiel: opera tiếng Đức có xen lời thoại nói, viết cho một
    nhà hát ở ngoại ô Vienna do Emanuel Schikaneder điều hành; Schikaneder cũng viết lời.
    (Mô tả trang cũng nói câu này.)'
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n10
  cau: 'Câu chuyện cổ tích: theo lệnh của Nữ hoàng bóng đêm, hoàng tử Tamino và Papageno người
    bắt chim đi giải cứu Pamina, con gái bà.'
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n11
  cau: Ngay trước aria, trong lời thoại, Nữ hoàng bóng đêm đưa cho Pamina một con dao và ra
    lệnh phải giết Sarastro, kẻ thù của bà.
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n12
  cau: Trong aria, bà thề sẽ từ bỏ con mãi mãi nếu Pamina không làm.
  loai: lich-su
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n13
  cau: Cơn giận được thể hiện bằng những chuỗi nốt nhanh vọt lên âm vực cực cao, đến nốt Fa6.
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n14
  cau: 'Theo dõi, dòng 1: dàn nhạc mở đầu chỉ hơn một ô nhịp rồi Nữ hoàng vào ngay, giọng
    Rê thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n15
  cau: 'Theo dõi, dòng 2: Nữ hoàng hát những câu đầy kịch tính, giọng mạnh mẽ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n16
  cau: 'Theo dõi, dòng 3: chuỗi coloratura thứ nhất: các nốt ngắt ngắn (staccato) nhắc lại,
    rồi những chùm nốt rải vọt lên Fa6.'
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n17
  cau: 'Theo dõi, dòng 4: đoạn lời đe dọa, rồi chuỗi coloratura thứ hai, dài hơn.'
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n18
  cau: 'Theo dõi, dòng 5: đoạn kết: lời thề "Hört, Rachegötter, hört der Mutter Schwur!" (Hãy
    nghe, hỡi các thần báo thù, lời thề của người mẹ!), rồi dàn nhạc khép lại ở Rê thứ.'
  loai: cau-truc
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n22
  cau: 'Mục Nguồn: tổng phổ và lời thoại Neue Mozart-Ausgabe II/5/19 trên Digital Mozart Edition
    (aria số 14 trang 224–231); Köchel online KV 620; trang DVD của Royal Opera House; MusicBrainz
    (Opus Arte OA 0886 D, 2003); link tài liệu tham khảo.'
  loai: ten
- trang: nghe-nhac/mozart-nu-hoang-bong-dem
  id: n19
  cau: 'Câu hỏi nghe chủ động (ba câu: trang trí hay cảm xúc; so sánh hai ca sĩ; xem video
    dàn dựng).'
  loai: khuyen-tap
- trang: nghe-nhac/mozart-requiem
  id: n1
  cau: 'Bảng: Nhà soạn nhạc Wolfgang Amadeus Mozart (1756–1791).'
  loai: nam
- trang: nghe-nhac/mozart-requiem
  id: n2
  cau: 'Bảng: Tên đầy đủ Requiem cung Rê thứ, K. 626.'
  loai: danh-muc
- trang: nghe-nhac/mozart-requiem
  id: n3
  cau: 'Bảng: Sáng tác năm 1791, dang dở khi Mozart mất ngày 5/12/1791.'
  loai: nam
- trang: nghe-nhac/mozart-requiem
  id: n4
  cau: 'Bảng: Hoàn thành chủ yếu bởi học trò Franz Xaver Süssmayr.'
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n5
  cau: 'Bảng: Thời kỳ Cổ điển.'
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n6
  cau: 'Bảng: Thể loại lễ cầu hồn cho hợp xướng, 4 giọng độc xướng và dàn nhạc.'
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n7
  cau: 'Bảng: Độ dài khoảng 50–55 phút; phần trong bảng "Theo dõi khi nghe" (từ Introitus
    đến Lacrimosa) khoảng 30 phút.'
  loai: so-lieu
- trang: nghe-nhac/mozart-requiem
  id: n8
  cau: Mùa hè năm 1791, Mozart nhận đơn đặt hàng giấu tên viết một bản Requiem. (Cũng là câu
    đầu của mô tả trang.)
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n9
  cau: Người đặt về sau được biết là bá tước Franz von Walsegg, muốn tưởng nhớ người vợ vừa
    mất (và có lẽ định nhận là tác phẩm của mình).
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n10
  cau: Mozart viết Requiem xen với Cây sáo thần và vở opera La clemenza di Tito; ông nằm liệt
    giường từ ngày 20/11/1791 và mất khi bản nhạc còn dang dở.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n11
  cau: Quanh sự ra đời của Requiem có nhiều giai thoại và truyền thuyết.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n12
  cau: Mozart hoàn thành trọn vẹn Introitus.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n13
  cau: Mozart viết các bè hát, bè trầm và nhiều gợi ý dàn nhạc từ Kyrie đến Hostias.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n14
  cau: Mozart chỉ viết 8 ô nhịp đầu của Lacrimosa.
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n15
  cau: Mozart để lại nhiều nợ; vợ ông, Constanze, nhờ bạn bè của Mozart hoàn thành bản nhạc,
    và sau hai lần không thành, việc đến tay học trò Süssmayr.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n16
  cau: Ngày nay có nhiều phiên bản hoàn thành khác nhau; phiên bản Süssmayr là phiên bản truyền
    thống, được biết đến nhiều nhất.
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n17
  cau: Requiem (lễ cầu hồn) là thánh lễ Công giáo cho người đã mất, hát bằng tiếng Latin.
  loai: dinh-nghia
- trang: nghe-nhac/mozart-requiem
  id: n18
  cau: Đoạn Dies irae ("Ngày thịnh nộ") mô tả ngày phán xét cuối cùng.
  loai: dinh-nghia
- trang: nghe-nhac/mozart-requiem
  id: n19
  cau: 'Theo dõi, Introitus: bassoon và basset horn (họ hàng trầm của clarinet) mở đầu u buồn;
    hợp xướng vào từng bè một.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n20
  cau: 'Theo dõi, Kyrie: fugue kép, hai chủ đề cùng lúc, một chủ đề nhảy quãng 7 giảm.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n22
  cau: 'Theo dõi, Dies irae: cả dàn nhạc và hợp xướng bùng nổ, nhanh, dữ dội.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n23
  cau: 'Theo dõi, Recordare (dòng thêm): hai basset horn mở đầu nhẹ, nhịp 3/4, giọng Fa trưởng;
    bốn giọng độc xướng hát, không có hợp xướng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n24
  cau: 'Theo dõi, Tuba mirum: trombone độc tấu mở đầu ("tiếng kèn kỳ diệu" gọi người chết
    dậy), rồi lần lượt bốn giọng độc xướng.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n25
  cau: 'Theo dõi, Rex tremendae: hợp xướng hô "Rex!" (Vua!) bằng những hợp âm lớn, tiết tấu
    chấm dôi uy nghi.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n26
  cau: 'Theo dõi, Confutatis: tương phản: bè nam hát dữ dội về kẻ bị đày, bè nữ hát dịu dàng
    xin được cứu.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n27
  cau: 'Theo dõi, Lacrimosa: giai điệu "khóc than" đi lên từng bước; sau 8 ô nhịp, phần còn
    lại không phải của Mozart.'
  loai: cau-truc
- trang: nghe-nhac/mozart-requiem
  id: n29
  cau: 'Câu hỏi 1: ở thời Baroque, trombone chỉ được dùng trong nhạc nhà thờ.'
  loai: lich-su
- trang: nghe-nhac/mozart-requiem
  id: n31
  cau: Câu hỏi 3 bỏ vế "(Câu trả lời thật thà của phần lớn người nghe là không. Đó cũng là
    điều đáng suy nghĩ.)".
  loai: so-lieu
- trang: nghe-nhac/mozart-requiem
  id: n33
  cau: 'Mục Nguồn: tổng phổ và lời tựa Neue Mozart-Ausgabe I/1/Abt. 2/1 (Leopold Nowak, 1965)
    trên Digital Mozart Edition; Köchel online KV 626; bảng so sánh các phiên bản của Carus
    (Ulrich Leisinger, PDF); link Cổ điển.'
  loai: ten
- trang: nghe-nhac/mozart-requiem
  id: n30
  cau: Câu hỏi nghe chủ động (cảm giác của tiếng trombone; đối lập bè nam, bè nữ ở Confutatis;
    có nghe ra chỗ đổi người viết ở Lacrimosa không).
  loai: khuyen-tap
