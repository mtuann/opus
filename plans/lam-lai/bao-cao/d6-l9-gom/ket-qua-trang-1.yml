- trang: nghe-nhac/bach-cello-1
  id: n6
  luot_2: dung
  nguon: ["https://api.discogs.com/releases/999363", "https://musicbrainz.org/ws/2/recording/?query=recording:(prelude)%20AND%20recording:1007%20AND%20artist:bach&fmt=json&limit=30"]
  ghi_chu: "Prelude: Yo-Yo Ma (1982) 2:26; MusicBrainz các bản thu 2,2–3,1 phút."
- trang: nghe-nhac/bach-cello-1
  id: n7
  luot_2: dung
  nguon: ["https://api.discogs.com/releases/3544215", "https://thestrad.com/for-subscribers/pablo-casals-and-the-bach-cello-suites-journey-to-a-masterpiece/16957.article", "https://www.classical-music.com/features/recordings/js-bach-cello-suites"]
  ghi_chu: "Discogs (HMV RLS 712): 'Suite no 2 & 3 recorded November 1936; Suite no 1 & 6 recorded June 1938; Suite no 4 & 5 recorded June 1939'. The Strad: suites 1 và 6 thu ở Paris tháng 6/1938; thu cho Fred Gaisberg (HMV). Classical Music: 'EMI', London và Paris 1936–1939."
- trang: nghe-nhac/bach-cello-1
  id: n8
  luot_2: dung
  nguon: ["https://librarycatalog.ecu.edu/catalog/3280522", "https://musicbrainz.org/release/c0cac0c5-60b4-4798-bde0-ca01ebd4d3bf"]
  ghi_chu: "Thư mục ECU: 'Recorded at Vanguard Studios, New York, N.Y. Feb. 23–May 12, 1982… Originally released as CBS Masterworks M2K 37867 in 1983'. MusicBrainz: 'The Cello Suites: Inspired by Bach', Sony Classical S2K 63203, 1997."
- trang: nghe-nhac/bach-cello-1
  id: n9
  luot_2: dung
  nguon: ["https://interlude.hk/the-special-meaning-of-bachs-solo-cello-suites/", "https://imslp.org/wiki/6_Cello_Suites,_BWV_1007-1012_(Bach,_Johann_Sebastian)", "https://www.barenreiter.co.uk/six-suites-for-violoncello-bwv-1007-1012.html", "https://www.georgcello.com/bachcellosuites.htm"]
  ghi_chu: "Interlude: bản gốc của Bach đã mất. IMSLP: bốn bản chép tay thế kỷ 18 (Anna Magdalena 'ca.1727-31', Kellner ca.1726, Schober và một người chép khuyết danh, và một bản khuyết danh cuối thế kỷ 18). Bärenreiter: năm nguồn (bốn bản chép cộng bản in 1824), bản Anna Magdalena là 'the most reliable of the sources'. Georg Mertens: 'regarded as possibly the closest to the original'. Có người cho rằng bà chép từ một bản trung gian, nên 'được coi là' là cách nói đúng mức."
- trang: nghe-nhac/bach-cello-1
  id: n10
  luot_2: khong-chac
  nguon: ["https://groveatlantic.com/book/the-cello-suites/", "https://thestrad.com/for-subscribers/pablo-casals-and-the-bach-cello-suites-journey-to-a-masterpiece/16957.article"]
  ghi_chu: "Nguồn mâu thuẫn. Siblin (Grove Atlantic) nói những người biết các tổ khúc 'thought they were more technical exercises than anything fit for the concert hall'. Nhưng The Strad nói từ năm 1824 tới năm 1890 chúng 'had been not only edited and published repeatedly but also performed', có người chơi trọn tổ khúc (Grützmacher 1867, Piatti 1873). Nên viết mềm hơn: 'Suốt thế kỷ 19, các tổ khúc thường bị coi là bài tập kỹ thuật, ít được chơi trong hòa nhạc'."
- trang: nghe-nhac/bach-cello-1
  id: n11
  luot_2: dung
  nguon: ["https://imslp.org/wiki/6_Cello_Suites,_BWV_1007-1012_(Bach,_Johann_Sebastian)", "https://thestrad.com/for-subscribers/pablo-casals-and-the-bach-cello-suites-journey-to-a-masterpiece/16957.article"]
  ghi_chu: "IMSLP: 'First Publication 1824 – Paris: Janet & Cotelle'. The Strad: 'the first edition of the Cello Suites in Paris in 1824'."
- trang: nghe-nhac/bach-cello-1
  id: n12
  luot_2: dung
  nguon: ["https://thestrad.com/for-subscribers/pablo-casals-and-the-bach-cello-suites-journey-to-a-masterpiece/16957.article", "https://interlude.hk/the-special-meaning-of-bachs-solo-cello-suites/"]
  ghi_chu: "The Strad: 'Casals first came across an edition of the Cello Suites in Barcelona in 1890, when he was 13 years old'; 'what he had found was an 1866 concert edition… by Friedrich Grützmacher'. Interlude: 'an edition by cellist Friedrich Grützmacher'."
- trang: nghe-nhac/bach-cello-1
  id: n13
  luot_2: dung
  nguon: ["https://groveatlantic.com/book/the-cello-suites/"]
  ghi_chu: "Siblin (Grove Atlantic): 'Casals would play the suites every day for twelve years before finally performing them in public'."
- trang: nghe-nhac/bach-cello-1
  id: n14
  luot_2: sai
  nguon: ["https://thestrad.com/for-subscribers/pablo-casals-and-the-bach-cello-suites-journey-to-a-masterpiece/16957.article"]
  cau_dung: "Về sau Casals đưa trọn từng tổ khúc vào chương trình hòa nhạc (từ khoảng năm 1902) và góp phần lớn làm chúng nổi tiếng. Ông hay nói trước ông chưa ai chơi trọn một tổ khúc, nhưng thật ra Grützmacher (1867), Piatti (1873) và Klengel (1894) đã làm vậy. Casals là người đầu tiên thu âm trọn bộ."
  ghi_chu: "The Strad: Casals 'was also not the first cellist to perform an entire Bach suite in public… as he liked to claim'. 'A number of 19th-century cellists played an entire Bach suite in concert: Grützmacher in 1867, Alfredo Piatti in 1873, and Julius Klengel in 1894 and 1904'. Casals bắt đầu đưa trọn một tổ khúc vào chương trình hòa nhạc khoảng năm 1902. Ông là người đầu tiên thu âm trọn bộ."
- trang: nghe-nhac/bach-cello-1
  id: n15
  luot_2: dung
  nguon: ["https://www.classical-music.com/features/recordings/js-bach-cello-suites", "https://api.discogs.com/releases/3544215", "https://thestrad.com/for-subscribers/pablo-casals-and-the-bach-cello-suites-journey-to-a-masterpiece/16957.article"]
  ghi_chu: "Classical Music: thu 'in the recording studios in London and Paris from 1936 to 1939'. Discogs: các ngày 11/1936, 6/1938, 6/1939. The Strad: London 11/1936, Paris 6/1938."
- trang: nghe-nhac/bach-cello-1
  id: n16
  luot_2: dung
  nguon: ["https://groveatlantic.com/book/the-cello-suites/", "https://thestrad.com/for-subscribers/pablo-casals-and-the-bach-cello-suites-journey-to-a-masterpiece/16957.article"]
  ghi_chu: "Siblin trích Laurence Lesser: từ khi Casals chơi chúng, 'we now know how lucky we are to possess these extraordinary masterworks'. The Strad: Casals đưa các tổ khúc ra ánh sáng và là người đầu tiên thu trọn bộ."
- trang: nghe-nhac/bach-cello-1
  id: n17
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1007/bwv1007/bwv1007-a4-pdfs.zip", "http://web.archive.org/web/20260916085834/https://www.merriam-webster.com/dictionary/arpeggio"]
  ghi_chu: "Bản nhạc Prelude số 1 (Mutopia, theo Schirmer 1916) toàn hợp âm rải móc kép; định nghĩa hợp âm rải: Merriam-Webster."
- trang: nghe-nhac/bach-cello-1
  id: n18
  luot_2: dung
  nguon: ["http://web.archive.org/web/20260916085834/https://www.merriam-webster.com/dictionary/arpeggio"]
  ghi_chu: "Merriam-Webster (bản lưu Wayback): arpeggio là 'production of the tones of a chord in succession and not simultaneously'. Không mở được Open Music Theory (403, Wayback báo 429)."
- trang: nghe-nhac/bach-cello-1
  id: n20
  luot_2: dung
