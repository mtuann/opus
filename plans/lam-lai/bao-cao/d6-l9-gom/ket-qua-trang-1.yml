  ghi_chu: "Prelude BWV 1007 (Mutopia): hợp âm rải móc kép suốt bài. Prelude cung Đô trưởng BWV 846 (Mutopia): mỗi ô là một hợp âm rải ('r8 g16 c' e' g c' e'…')."
- trang: nghe-nhac/bach-cello-1
