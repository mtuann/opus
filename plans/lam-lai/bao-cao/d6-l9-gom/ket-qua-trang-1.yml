  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip", "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)", "https://www.barenreiter.co.uk/orchestral-suite-overture-no-3-in-d-major-bwv-1068-study-score.html"]
  ghi_chu: "Ba nguồn đầu có thật: Mutopia ghi 'source = Bach-Gesellschaft'; trang IMSLP BWV 1068; Bärenreiter TP 194 là tổng phổ nhỏ BWV 1068 (ISMN 9790006201631, có lời tựa theo NBA). Mục 'Concise Oxford Dictionary of Music (Air on the G String)' không mở được: Oxford Reference trả 403, nên chưa xác nhận có mục từ ấy."
