  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1007/bwv1007/bwv1007-a4-pdfs.zip", "https://www.mutopiaproject.org/ftp/BachJS/BWV1007/bwv1007/bwv1007-lys.zip"]
  ghi_chu: "Ô 37–38: Rê trầm xen kẽ với các nốt đi lên theo nửa cung ('d, e f d fis d g d gis d a' d, bes' d, | b' d, c' d, cis' d, d' d, ees' d, e' d, f' d, fis' d,'), tới Sol4 ở ô 39, nốt cao nhất bài (bản PDF)."
