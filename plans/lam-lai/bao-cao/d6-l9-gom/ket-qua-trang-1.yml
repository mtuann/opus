  ghi_chu: "Mutopia: 'source = Schirmer, 1916'. IMSLP có trang tác phẩm. Henle HN 666 có lời tựa ('Preface'). Fundació Pau Casals (paucasals.org) có mục 'Chronology'. MusicBrainz có các bản ghi."
