  ghi_chu: "Ô 31–36: nốt La (dòng trên khóa Fa, La3 = dây La buông) xen kẽ liên tục với các nốt khác ('fis a d, a' g a e a…'); bè trên ô 33–36 chỉ toàn La."
- trang: nghe-nhac/bach-cello-1
  id: n26
