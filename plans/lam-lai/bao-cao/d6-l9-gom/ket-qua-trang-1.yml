  ghi_chu: "Merriam-Webster (bản lưu Wayback 19/8/2026), air nghĩa 3: 'tune, melody'; nghĩa 5 (từ aria): 'a : tune, melody'."
- trang: nghe-nhac/bach-air
  id: n8
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)"]
