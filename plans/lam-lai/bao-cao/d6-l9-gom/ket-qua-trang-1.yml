  ghi_chu: "Ô 1–4: Sol trầm (dây Sol buông) với Sol trưởng (I), Đô/Sol (IV), Rê bảy/Sol (V), Sol (I); các nốt rải đi lên rồi quay về."
- trang: nghe-nhac/bach-cello-1
  id: n23
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1007/bwv1007/bwv1007-a4-pdfs.zip", "https://www.mutopiaproject.org/ftp/BachJS/BWV1007/bwv1007/bwv1007-lys.zip"]
  ghi_chu: "Ô 5–10: Đô♯ xuất hiện (ô 5–7, 9), ô 10 tới Rê trưởng; ô 11–21 còn đi qua La thứ, Mi thứ rồi về lại."
