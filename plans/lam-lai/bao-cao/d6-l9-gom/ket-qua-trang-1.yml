  nguon: ["https://musicbrainz.org/ws/2/recording/?query=recording:(air)%20AND%20artist:bach%20AND%20recording:1068&fmt=json&limit=40"]
  ghi_chu: "MusicBrainz: các bản thu chương Air BWV 1068 phần lớn dài 4,1–5,9 phút (vài bản nhanh 3,4–3,9). 'Khoảng 4–5 phút' hợp với số đông; bản chậm có thể gần 6 phút."
- trang: nghe-nhac/bach-air
  id: n7
  luot_2: dung
