  nguon: []
  ghi_chu: "Khuyên tập: so sánh bản thu và nghe bè trầm là hợp lý."
- trang: nghe-nhac/handel-hallelujah
  id: n1
  luot_2: dung
  nguon: ["https://handelhendrix.org/discover/learn-about-handel", "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1732"]
  ghi_chu: "Handel House: sinh ở Halle ngày 23/2/1685, mất ngày 14/4/1759 tại nhà ở Brook Street. Mutopia ghi G. F. Handel (1685–1759)."
- trang: nghe-nhac/handel-hallelujah
  id: n2
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", "https://www.barenreiter.co.uk/prefaces/9790006565313.pdf", "https://musikalienhandel.de/noten/gemischter-chor-(satb)-2-oboe-streicher-orgel-(gch-(satb)-2-ob-str-org)/hallelujah-aus-messias-hwv-56--CARUS+55501-00-probepartitur.pdf"]
  ghi_chu: "Mục bản thu trên IMSLP ghi 'Chorus: Hallelujah (Part II, No.44)', theo cách đánh số Prout/Novello. Mục lục bản Bärenreiter (Tobin, HHA) ghi '39. Chorus Hallelujah', là số cuối của Phần II (Phần III bắt đầu bằng số 40). Bản Carus ghi 'HWV 56, Nr. 39'. Danh sách chương mục trên IMSLP còn dùng số 42, và một danh sách khác dùng số 40, nên câu 'cách đánh số thường gặp' là hợp lý chứ không phải duy nhất."
- trang: nghe-nhac/handel-hallelujah
  id: n3
  luot_2: dung
  nguon: ["https://searcharchives.bl.uk/catalog/040-001948673", "https://handelhendrix.org/discover/learn-about-handel"]
  ghi_chu: "Thư viện Anh, R.M.20.f.2: 'According to the dates added by Handel to the manuscript, the music was largely written between 22 August and 14 September 1741'. Tính cả hai đầu là 24 ngày (10 ngày tháng 8 cộng 14 ngày tháng 9)."
- trang: nghe-nhac/handel-hallelujah
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", "https://www.historyireland.com/volume-23/rejection-and-rehabilitation-why-handels-messiah-was-premiered-in-dublin/"]
  ghi_chu: "IMSLP: 'First Performance 1742-04-13 in Dublin. Neal's Music Hall, Fishamble Street'. History Ireland cũng ghi buổi sáng ngày 13/4/1742 ở Fishamble Street, Dublin."
- trang: nghe-nhac/handel-hallelujah
  id: n5
  luot_2: dung
  nguon: ["https://bible-api.com/revelation+19?translation=kjv", "https://bible-api.com/revelation+11?translation=kjv", "https://searcharchives.bl.uk/catalog/040-001948673", "https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "KJV Khải Huyền 19:6 '…Alleluia: for the Lord God omnipotent reigneth'; 11:15 '…The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever'; 19:16 'KING OF KINGS, AND LORD OF LORDS'. Lời trong bản HG (lyrics1.ily, BWchorus) gồm đúng ba đoạn này. Thư viện Anh ghi lời của Charles Jennens 'after texts from the Bible'."
- trang: nghe-nhac/handel-hallelujah
  id: n6
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Bản Händel-Gesellschaft (Chrysander 1902) trên Mutopia, thư mục BWchorus: global.ily ghi '\\key re \\major', tempo Allegro; score.ily có hàng 'Tromba I II' và 'Tympani'."
- trang: nghe-nhac/handel-hallelujah
  id: n7
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip", "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)"]
  ghi_chu: "score.ily (bản HG): Tromba I II, Tympani, Violino I, II, Viola, hợp xướng Canto, Alto, Tenore, Basso, và Bassi có số hầm (continuo). IMSLP ghi thêm 2 (hay 4) oboe và bassoon; bản Carus của Hallelujah ghi 2 oboe. Danh sách trong ngoặc của câu không nêu oboe, nhưng câu không nói là đủ."
- trang: nghe-nhac/handel-hallelujah
  id: n8
  luot_2: khong-chac
  nguon: ["https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)"]
  ghi_chu: "Sáu bản thu Hallelujah trên IMSLP dài 3:21, 3:37, 3:56, 4:39, 4:41 và 4:46 (độ dài của tệp, có thể có cả khoảng lặng hay tiếng vỗ tay). Ba bản dài hơn 4 phút rưỡi. Ước tính theo bản nhạc: 94 ô 4/4, ở tốc độ MIDI 112 của bản Mutopia, khoảng 3 phút 20 giây. Nói 'khoảng 3–4 phút' thì hơi hẹp; an toàn hơn: 'khoảng 3½–4½ phút' hay 'khoảng bốn phút'."
- trang: nghe-nhac/handel-hallelujah
  id: n9
  luot_2: dung
  nguon: ["https://handelhendrix.org/discover/learn-about-handel"]
  ghi_chu: "Handel House: sinh ở Halle, Saxony; sống phần đời còn lại ở Anh, nhập quốc tịch Anh năm 1727, ở nhà Brook Street, London từ 1723 tới khi mất; thành công ngay với Rinaldo (1711) ở London."
- trang: nghe-nhac/handel-hallelujah
  id: n10
  luot_2: dung
  nguon: ["https://handelhendrix.org/discover/learn-about-handel"]
  ghi_chu: "Handel House: viết khoảng 31 vở opera cho sân khấu London (công ty opera Ý Royal Academy of Music…); 'In the early 1740s, with public interest in Italian opera waning, Handel began to introduce new oratorios…'."
- trang: nghe-nhac/handel-hallelujah
  id: n11
  luot_2: dung
  nguon: ["https://web.archive.org/web/2026/https://www.britannica.com/art/oratorio", "https://handelhendrix.org/discover/learn-about-handel"]
  ghi_chu: "Britannica (bản lưu Wayback, vì Britannica chặn công cụ): 'a large-scale musical composition on a sacred or semisacred subject, for solo voices, chorus, and orchestra… A basically dramatic method is used… may or may not be produced with theatrical action'. Handel House: oratorio của Handel 'without costumes, sets or staging'."
- trang: nghe-nhac/handel-hallelujah
  id: n12
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", "https://handelhendrix.org/discover/learn-about-handel"]
  ghi_chu: "IMSLP: 'Language English'. Handel House: oratorio 'written to English texts'."
- trang: nghe-nhac/handel-hallelujah
  id: n13
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006565313.pdf", "https://handelhendrix.org/discover/learn-about-handel", "https://ton.bard.edu/handels-messiah/"]
  ghi_chu: "Lời tựa Bärenreiter: tính phổ quát của Messiah 'appeal to men of all creeds, make it the most renowned work in the whole of the composer's monumental output'. Handel House: 'his most famous work'. Bard: 'arguably one of the most performed and celebrated works'. Câu 'oratorio phổ biến nhất' là nhận định thông thường, không có số liệu đo; nguồn chỉ nói 'nổi tiếng nhất' và 'diễn nhiều nhất'. Có thể viết mềm hơn: 'có lẽ là oratorio được diễn nhiều nhất'."
- trang: nghe-nhac/handel-hallelujah
  id: n14
  luot_2: khong-chac
  nguon: ["https://www.historyireland.com/volume-23/rejection-and-rehabilitation-why-handels-messiah-was-premiered-in-dublin/", "https://www.barenreiter.co.uk/prefaces/9790006565313.pdf"]
  ghi_chu: "Chỉ nguồn phổ thông nói Handel nợ nần năm 1741: History Ireland viết 'Laden with debt', nhưng bài ấy cũng sai một chi tiết khác ('ten weeks'). Không tìm được nguồn học thuật đọc được trên mạng xác nhận Handel mắc nợ mùa hè 1741, càng không có nguồn cho vế 'tưởng sự nghiệp đã hết'. Lời tựa Bärenreiter (Tobin) bác cách giải thích Messiah ra đời từ nỗi cay đắng vì opera thất bại: 'we owe Messiah neither to any embitterment… on account of his operatic failure…'. Handel House chỉ nói công chúng bớt chuộng opera Ý. Nên bỏ câu, hay viết: 'Đầu thập niên 1740, opera Ý ở London ế khách, các mùa opera của Handel thua lỗ'."
- trang: nghe-nhac/handel-hallelujah
  id: n15
  luot_2: dung
  nguon: ["https://searcharchives.bl.uk/catalog/040-001948673", "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)"]
  ghi_chu: "Thư viện Anh: 'he set words by Charles Jennens after texts from the Bible'. IMSLP: 'Librettist Charles Jennens (1700–1773)', cấu trúc các cảnh kể về Đấng Cứu Thế (lời tiên tri, giáng sinh, chịu nạn…). Một số đoạn Thánh vịnh lấy theo bản trong Book of Common Prayer, nhưng vẫn là văn bản Kinh Thánh."
- trang: nghe-nhac/handel-hallelujah
  id: n16
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)"]
  ghi_chu: "Các cảnh trên IMSLP. Phần I: Isaiah's Prophecy…, The Prophecy of Christ's Birth, The Annunciation to the Shepherds… Phần II: Christ's Passion, Death and Resurrection, Ascension, Reception in Heaven, The Beginnings of Gospel Preaching, The World's Rejection…, God's Ultimate Victory. Phần III: The Promise of Eternal Life, The Day of Judgment ('the dead shall be raised'), The Final Conquest of Sin ('O death, where is thy sting'), The Acclamation of the Messiah."
- trang: nghe-nhac/handel-hallelujah
  id: n17
  luot_2: dung
  nguon: ["https://searcharchives.bl.uk/catalog/040-001948673"]
  ghi_chu: "Thư viện Anh, R.M.20.f.2: 'According to the dates added by Handel to the manuscript, the music was largely written between 22 August and 14 September 1741'. Hallelujah ở tờ 100–106. 24 ngày khi tính cả hai đầu."
- trang: nghe-nhac/handel-hallelujah
  id: n18
  luot_2: dung
  nguon: ["https://www.historyireland.com/volume-23/rejection-and-rehabilitation-why-handels-messiah-was-premiered-in-dublin/"]
  ghi_chu: "History Ireland: 'The beneficiaries of the concert were to include a charity supporting debtors' (buổi 13/4/1742 ở Fishamble Street). Nên có thêm một nguồn bậc 1–2 nếu tìm được, như sách của Burrows."
- trang: nghe-nhac/handel-hallelujah
  id: n19
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006565313.pdf", "https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip", "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)"]
  ghi_chu: "Bärenreiter: '39. Chorus Hallelujah', ngay sau đó là 'Part the third'. main.ly của bản Mutopia/HG: sau BWchorus (Hallelujah) có dòng 'END OF THE SECOND PART'. IMSLP: Phần II đi từ Christ's Passion tới cảnh cuối 'God's Ultimate Victory', mà Hallelujah là số cuối."
- trang: nghe-nhac/handel-hallelujah
  id: n20
  luot_2: dung
  nguon: ["https://bible-api.com/revelation+19?translation=kjv", "https://bible-api.com/revelation+11?translation=kjv", "https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Toàn bộ lời trong bản HG (lyrics1–4.ily) là: Hallelujah, for the Lord God omnipotent reigneth (19:6); The kingdom of this world is become the kingdom of our Lord and of his Christ, and he shall reign for ever and ever (11:15, Jennens đổi số nhiều 'kingdoms… are' thành số ít); King of Kings, and Lord of Lords (19:16). Lấy phần cuối của mỗi câu Kinh Thánh."
- trang: nghe-nhac/handel-hallelujah
  id: n21
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip", "https://web.archive.org/web/2026/https://www.britannica.com/art/kettledrum"]
  ghi_chu: "Bản HG: Rê trưởng, Tromba I II, Tympani. Britannica (bản lưu Wayback), 'kettledrum': ở châu Âu kèn trumpet và trống timpani 'often associated with trumpets as symbols of royal power and status'; thế kỷ 17–18 trống timpani là 'an elaborate and ostentatious ceremonial art'. Nguồn nói về dịp nghi lễ, hoàng gia, nên chữ 'lễ hội' hiểu là nghi lễ, khải hoàn. Không tìm được nguồn nói riêng về giọng Rê trưởng; câu không khẳng định điều ấy."
- trang: nghe-nhac/handel-hallelujah
  id: n22
  luot_2: dung
  nguon: ["https://archive.org/details/accountoflifewri02forbrich", "https://ton.bard.edu/handels-messiah/", "https://handelhendrix.org/discover/learn-about-handel"]
  ghi_chu: "Nguồn sớm nhất là thư James Beattie gửi Rev. Dr Laing, Aberdeen, 25/5/1780 (Forbes, An Account of the Life and Writings of James Beattie, tập 2, thư CXLVI, tr. 80). Beattie kể lại lời Lord Kinnoull: 'When Handel's Messiah was first performed… when that chorus struck up, For the Lord God Omnipotent reigneth, they were so transported, that they all, together with the King, (who happened to be present) started up, and remained standing till the chorus ended: And hence it became the fashion in England…'. Tức là nghe kể lại, viết 37 năm sau. Thư không ghi năm 1743, không ghi London, và nói khán giả 'cùng với vua' đứng dậy, không nói vua dẫn đầu. Buổi đầu ở London là ngày 23/3/1743 (Handel House). Bản kể phổ biến ngày nay (Bard: 'at the work's London premiere in 1743… George II… rose… The audience rose to their feet to join their king') đúng là năm 1743, London, vua đứng trước, nên câu tả đúng 'chuyện thường được kể', và chữ 'thường được kể' đã giữ khoảng cách. Bard cũng ghi 'very little evidence… to even prove he was at the performance'; tôi không tìm được tài liệu đương thời nào xác nhận vua có mặt. Đề nghị thêm một vế, như: '…nhưng không có tài liệu thời ấy xác nhận vua có mặt; lời kể sớm nhất là một lá thư năm 1780'. Chi tiết 'đứng tới hết' khớp với Beattie ('remained standing till the chorus ended')."
- trang: nghe-nhac/handel-hallelujah
  id: n23
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Bản HG: cả bốn bè R1*3 (ba ô nhạc cụ dạo). Ô 4, bốn bè cùng tiết tấu 4. 8 8 8 r4 ('Hal-le-lu-jah'): S re''-la'-si'-la', A la'-la'-sol'-fad', T fad'-re'-re'-re', B re-fad-sol-re."
- trang: nghe-nhac/handel-hallelujah
  id: n24
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Ô 12–14: cả bốn bè hát 'for the Lord God omnipotent reigneth' cùng giai điệu la-si-dod-re…, cách nhau quãng tám (S từ la', T và B từ la). Sau đó câu này vào lần lượt, xen giữa các tiếng 'Hallelujah' của bè khác: A, T, B ở ô 17–19; S một mình ở ô 22–24; T và B ở ô 25–27; A và T ở ô 29–31. Là những lần vào lệch nhau trên nền Hallelujah, không phải canon chặt, nhưng 'lần lượt vào đuổi nhau' vẫn tả đúng."
- trang: nghe-nhac/handel-hallelujah
  id: n25
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Ô 33–35: S la' | la' sol' fad' mi'8. re'16 | re'1; A fad' | mi' re' re' dod' | re'1; T re' | la re la4. la8 | la1; B re | dod si, la, sol8. fad16 | fad1. Bốn bè cùng lúc, từng âm tiết, nốt đen và nốt tròn (so với móc kép của Hallelujah), giống thánh ca. Ô 36–40 ('the kingdom of our Lord…') vẫn cùng nhịp."
- trang: nghe-nhac/handel-hallelujah
  id: n26
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Bản HG, chủ đề 'and He shall reign for ever and ever'. Bass vào ô 41 (la8 'and', re' 'He', fad 'shall', si 'reign'…). Tenor ô 43–44 (re' | la' dod' fad' la, nhảy quãng 5 lên rồi quãng 6 xuống), violin I đi cùng tenor. Alto ô 46 (la' re' fad' | si' re' sol'…). Soprano ô 48–49 (re'' | la'' dod'' fad'' la'). Thứ tự bass, tenor, alto, soprano đúng. Chủ đề mở bằng bước nhảy quãng 4 hay 5 rồi quãng 6 xuống. Đúng ra là một đoạn kiểu fugue (fugato) trong hợp xướng, không phải một fugue trọn."
- trang: nghe-nhac/handel-hallelujah
  id: n27
  luot_2: sai
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  cau_dung: "Sơ đồ, Cao trào: \"King of kings, and Lord of Lords\": soprano (lúc đầu cùng alto) giữ nốt La dài hai lần, rồi lên Rê và từ đó mỗi lần lên cao hơn một bậc (Rê, Mi, Fa thăng, Sol); trumpet giữ cùng nốt (lúc còn ở La thì cao hơn một quãng tám); các bè khác đáp \"for ever and ever, Hallelujah\"."
  ghi_chu: "Bản HG, vcanto ô 51–68: nốt dài la' ('King of Kings', ô 51–53), la' ('and Lord of Lords', ô 54–56, alto cũng giữ la' ở ô 51–57), rồi re'' (ô 57–60), mi'' (ô 60–63), fad'' (ô 63–66), sol'' (ô 66–68). Hai lần đầu cùng một nốt, rồi nhảy quãng 4 La–Rê; chỉ từ Rê trở đi mới lên từng bậc. tromba-notes1: Trumpet I giữ la'' (cao hơn soprano một quãng tám) rồi re'', mi'', fad'', sol'' đúng cao độ của soprano. Lyrics2–4: các bè khác hát 'for ever and ever, Hallelujah, Hallelujah'. Lỗi nhỏ, chỉ ở chữ 'mỗi lần'."
- trang: nghe-nhac/handel-hallelujah
  id: n28
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Bản HG ô 92: mọi bè và mọi nhạc cụ (vcanto, valto, vtenore, vbasso, violino1, violino2, viola, tromba, tympani, bassi) đều 'x8 x8 r4 r4 x4': nghỉ phách 2–3, tức im lặng hai phách. Rồi 'Hal-' ở phách 4, '-le-' nốt trắng chấm (ô 93), '-lu-' nốt đen, '-jah' nốt tròn ở ô 94 có dấu kết. Bản HG không ghi Adagio."
- trang: nghe-nhac/handel-hallelujah
  id: n29
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/Messiah-lys.zip"]
  ghi_chu: "Khớp bản HG như n23–n28: dạo ba ô; ô 4 cùng nhịp; ô 12–14 đồng âm rồi các bè vào lần lượt; ô 33 trở đi cùng nhịp, nốt dài, soprano xuống tới re' (thấp, 'chùng xuống' hợp lý; bản HG không ghi cường độ); fugato bass, tenor, alto, soprano (ô 41–49); 'King of Kings' với soprano và trumpet giữ nốt dài; im lặng hai phách ở ô 92 rồi Hallelujah cuối bằng nốt dài. Riêng vế 'lên từng bậc' chỉ đúng từ Rê (Rê–Mi–Fa thăng–Sol); trước đó soprano giữ La hai lần (xem n27). Với lời tả để nghe theo thì chấp nhận được."
- trang: nghe-nhac/handel-hallelujah
  id: n35
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=1732", "https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)", "https://searcharchives.bl.uk/catalog/040-001948673"]
  ghi_chu: "Mutopia id 1732: 'Source: Leipzig, Friedrich Chrysander, Deutschen Handelgesellschaft edition, volume 45, 1902'. Trang IMSLP Messiah, HWV 56 có thật. Thư viện Anh: R.M.20.f.2, 'George Frideric Handel: Messiah, HWV 56. Autograph manuscript'. Concise Oxford Dictionary of Music là sách in, không kiểm được các mục trên mạng. Lưu ý: Mutopia còn một bản Hallelujah khác (id 459, 'source Unknown', bản phối cho dàn nhạc nhà thờ năm 2004), không phải bản HG."
