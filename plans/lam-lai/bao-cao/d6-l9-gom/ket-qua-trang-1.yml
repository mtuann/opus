  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip"]
  ghi_chu: "Ô 1: violin 1 'fis1~'; continuo móc đơn quãng tám; dàn dây cùng vào."
- trang: nghe-nhac/bach-air
  id: n19
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip"]
  ghi_chu: "Ô 6/7 (kết nửa đầu): continuo 'a d, e e, a2', violin 1 kết trên La, violin 2 'gis … e2': kết ở La trưởng (giọng át), có dấu nhắc lại."
- trang: nghe-nhac/bach-air
