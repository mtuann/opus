- trang: nghe-nhac/bach-air
  id: n9
  luot_2: dung
  nguon: ["https://www.hollywoodbowl.com/musicdb/pieces/6700/orchestral-suite-no-3", "https://parlancechamberconcerts.org/individual-program-notes/johann-sebastian-bach-(1685-1750)/air-on-the-g-string-from-orchestral-suite-no.-3-in-d-major%2C-bwv-1068"]
  ghi_chu: "Hollywood Bowl (John Mangum): Air 'perhaps one of Bach's best-loved instrumental works'. Parlance (Jane Vial Jaffe): 'One of the most popular and arranged pieces of all time'. Vế 'của cả nhạc cổ điển' là lời đánh giá, nguồn ủng hộ ở mức 'một trong những bản được phổ biến và chuyển soạn nhiều nhất mọi thời'."
- trang: nghe-nhac/bach-air
  id: n10
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)"]
  ghi_chu: "IMSLP liệt kê 6 chương: Ouverture, Air, Gavotte I, Gavotte II, Bourrée, Gigue."
- trang: nghe-nhac/bach-air
  id: n11
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)", "https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip"]
  ghi_chu: "IMSLP: 'InstrDetail 2 oboes, 3 trumpets, timpani, strings, continuo'. Bản Mutopia (Bach-Gesellschaft) của Air chỉ có violinone, violintwo, viola, continuo."
- trang: nghe-nhac/bach-air
  id: n12
  luot_2: dung
  nguon: ["https://interlude.hk/airs-on-the-g-string/", "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Interlude.hk: 'In 1871, the violinist August Wilhelmj (1845–1908) took this second movement, transposed it…, made the first violin part into a solo part'. IMSLP liệt kê bản Wilhelmj 'For Violin and Piano (or Organ)' và 'For Violin, Piano and Strings'."
- trang: nghe-nhac/bach-air
  id: n13
  luot_2: dung
  nguon: ["https://interlude.hk/airs-on-the-g-string/"]
  ghi_chu: "Interlude.hk: 'transposed it down a step (from D major to C major)… made it possible to play the entire solo line on its lowest string, the G string'."
- trang: nghe-nhac/bach-air
  id: n14
  luot_2: dung
  nguon: ["https://interlude.hk/airs-on-the-g-string/", "https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip"]
  ghi_chu: "Bản gốc Rê trưởng cho dàn dây và continuo (Mutopia, \\key d \\major); bản Wilhelmj Đô trưởng cho violin solo (Interlude.hk)."
- trang: nghe-nhac/bach-air
  id: n15
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip", "https://commons.wikimedia.org/wiki/File:Air_from_Orchestral_Suite_No._3_by_J._S._Bach,_Manuscript.jpg", "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Mutopia (BG): '\\repeat volta 2 { \\skip 1*5 } \\alternative {…}' (6 ô kể cả ô kết lần 1) rồi '\\repeat volta 2 { \\skip 1*12 }'. Bè violin 1 bản chép gốc (Commons) có vạch nhắc lại sau ô 6, đánh số tới ô 18. IMSLP ghi 'Air (36 bars)' = (6+12)×2."
- trang: nghe-nhac/bach-air
  id: n16
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip", "https://commons.wikimedia.org/wiki/File:Air_from_Orchestral_Suite_No._3_by_J._S._Bach,_Manuscript.jpg"]
  ghi_chu: "Violin 1 ô 1: 'fis1 ~' nối sang ô 2 ('fis8 b16 g … e16 d cis d cis4'): Fa♯ ngân hơn một ô rồi đi xuống. Bản chép tay violin 1 cũng vậy."
- trang: nghe-nhac/bach-air
  id: n17
  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip"]
  ghi_chu: "Continuo: 'd8 d' cis cis, b b' a a,' … móc đơn, phần lớn từng cặp quãng tám suốt chương; ngoại lệ ô 6 (móc kép ở lần kết 1), ô 9–11, 18–19 có vài bước không phải quãng tám, nên 'phần lớn' là đúng."
- trang: nghe-nhac/bach-air
