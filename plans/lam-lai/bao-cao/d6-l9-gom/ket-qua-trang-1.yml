  luot_2: dung
  nguon: ["https://www.mutopiaproject.org/ftp/BachJS/BWV1068/bach-air/bach-air-lys.zip"]
  ghi_chu: "Nửa sau: ô 9 qua Mi thứ (continuo 'dis dis' fis b, e'), ô 11 kết Si thứ (violin 1 'b2', continuo 'b g' e fis b,'), ô 13 kết La trưởng (violin 1 '…cis8. b16 a4', continuo '…a, a''). Câu không nhắc Mi thứ ở ô 9 nhưng không sai."
