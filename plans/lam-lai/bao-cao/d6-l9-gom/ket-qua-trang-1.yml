  ghi_chu: "IMSLP: Orchestral Suite No.3, BWV 1068, Key D major, chương 2. Air. Mutopia: 'BWV 1068, Mvmt. 2'."
- trang: nghe-nhac/bach-air
  id: n3
  luot_2: dung
  nguon: ["https://www.barenreiter.co.uk/prefaces/9790006201631.pdf", "https://imslp.org/wiki/Orchestral_Suite_No.3_in_D_major,_BWV_1068_(Bach,_Johann_Sebastian)"]
  ghi_chu: "Lời tựa Bärenreiter (NBA): nguồn chính là bộ phần bè 'probably dates from 1730–31' (Mus. ms. Bach St 153); 'The last two movements in both the violin I and continuo parts are in Bach's own hand', phần còn lại do Krebs, C. P. E. Bach và người chép khác; đề nghị niên đại 1729–31, gắn với Collegium Musicum ở Leipzig. IMSLP: 'Composition Year 1730 ca.' Lưu ý: chính chương Air trong bè violin 1 là chữ Krebs, không phải chữ Bach; câu viết 'một phần do chính Bach chép' vẫn đúng. Lời tựa này cùng ISMN với TP 194 nên có thể trùng nguồn lượt 1."
- trang: nghe-nhac/bach-air
