- trang: du-lieu/tac-pham/haydn-94
  id: n8
  luot_2: dung
  nguon: ["https://commons.wikimedia.org/wiki/File:Symphony_Hob.I-94,_G_major_(IA_imslp-hobi94-g-major-haydn-joseph).pdf"]
  ghi_chu: "Bản Peters: biến tấu 2 ghi \"Minore\", hóa biểu ba giáng (Đô thứ); biến tấu 3 \"Maggiore\", giai điệu ghi Ob. (rồi Fl.) nên là kèn gỗ dẫn; biến tấu 4 mở bằng ff marcato, có ghi \"G. Orch.\" (cả dàn nhạc); sau đó là coda (Ob., Fg.). Bản chuyển soạn piano bốn tay có ghi nhạc cụ."
