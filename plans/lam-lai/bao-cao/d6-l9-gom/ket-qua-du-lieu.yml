  ghi_chu: "IMSLP: K.620 thuộc Operas, Singspiele; aria số 14 \"Der Hölle Rache\" của Nữ hoàng bóng đêm. Glyndebourne: aria là \"virtuoso showpiece\" lên tới Fa trên Đô cao, với \"passages of frenzied coloratura\". Bè hát trong bản Mutopia có các chuỗi móc đơn staccato rải hợp âm lên f'''."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n4
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Category:Mozart,_Wolfgang_Amadeus", "https://imslp.org/wiki/Requiem_in_D_minor,_K.626_(Mozart,_Wolfgang_Amadeus)"]
