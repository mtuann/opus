  id: n5
  luot_2: dung
  nguon: ["https://imslp.org/wiki/Requiem_in_D_minor,_K.626_(Mozart,_Wolfgang_Amadeus)", "https://repertoire-explorer.musikmph.de/prefaces/6159-vw.pdf"]
  ghi_chu: "IMSLP: soli, Mixed Chorus (SATB), dàn nhạc. Lời tựa ấn bản Tritó/Musikproduktion Höflich (Repertoire Explorer 6159), phần tiếng Anh: \"the double fugue of the Kyrie\"."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n6
  luot_2: dung
  nguon: ["https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf", "https://repertoire-explorer.musikmph.de/prefaces/6159-vw.pdf"]
  ghi_chu: "Bảng của Cohrs (lời tựa tiếng Anh, Repertoire Explorer 1425) khớp các nhóm màu: từ Kyrie tới Hostias Mozart viết bè hát và bè trầm (V/B), người khác phối khí; Lacrimosa của Mozart chỉ 8 ô; Sanctus, Benedictus, Agnus Dei \"Composition by Süßmayr\" (có thể dựa phác thảo); Communio dùng lại nhạc Introitus và Kyrie. Riêng ý \"Xanh: Mozart viết trọn\" gắn với Introitus: xem n7."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n7
  luot_2: khong-chac
  nguon: ["https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf", "https://repertoire-explorer.musikmph.de/prefaces/6159-vw.pdf", "https://imslp.org/wiki/Requiem_in_D_minor,_K.626_(Mozart,_Wolfgang_Amadeus)"]
  ghi_chu: "Hai lời tựa đã mở đều nói Introitus gần trọn, chưa chắc trọn: Cohrs ghi \"Requiem (48): Vocal parts & Basso Continuo by Mozart; Instrumentation begun by Mozart, possibly not entirely completed by him. Instrumentation finished by Süßmayr and Freystädtler\"; lời tựa 6159 ghi phối khí Introitus \"fairly advanced, almost complete\", kèn trumpet và timpani có lỗi khó là của Mozart. Cách nói phổ biến (Introitus là chương duy nhất Mozart viết xong) chưa có nguồn bậc 2 nào đã mở xác nhận. Gợi ý: \"Introitus: Mozart viết gần trọn, kể cả phối khí\", hay ghi chú màu xanh là \"Mozart viết gần trọn\"."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n8
  luot_2: dung
  nguon: ["https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf"]
  ghi_chu: "Bảng của Cohrs: Kyrie \"V/B Mozart; Instrumentation in two unknown hands; final version by Süßmayr\"; Dies irae, Tuba mirum, Rex tremendae, Recordare, Confutatis: V/B (và vài dòng violin, trombone) của Mozart, \"Instrumentation by Süßmayr\"."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n9
  luot_2: dung
  nguon: ["https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf", "https://repertoire-explorer.musikmph.de/prefaces/6159-vw.pdf"]
  ghi_chu: "Cohrs: \"Lacrimosa (8) [+22]: 1–2 vollst.; 3–8 V/B Mozart; Instrumentation by Süßmayr. 9–30 Composition by Süßmayr\". Lời tựa 6159: \"after the first eight bars by Mozart\"."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n10
  luot_2: dung
  nguon: ["https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf"]
  ghi_chu: "Cohrs: Domine Jesu, Quam olim, Hostias: V/B (và một phần violin) của Mozart, \"Instrumentation by Süßmayr\"; bản viết tay của Mozart dừng ở cuối Hostias."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n11
  luot_2: dung
  nguon: ["https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf"]
  ghi_chu: "Cohrs: \"Sanctus, Benedictus, Osanna and Agnus Dei were written by Süßmayr, but quite possibly with the use of sketches today lost\"; \"chủ yếu Süssmayr\" khớp."
- trang: du-lieu/tac-pham/mozart-requiem
  id: n12
  luot_2: dung
  nguon: ["https://repertoire-explorer.musikmph.de/wp-content/uploads/vorworte_prefaces/1425_e.pdf", "https://repertoire-explorer.musikmph.de/prefaces/6159-vw.pdf"]
  ghi_chu: "Cohrs: Lux aeterna ô 3–30 \"Repeat of section from the INTROITUS\", Cum sanctis tuis \"Repeat of Mozart's KYRIE\" (theo lời Constanze, thư ngày 27/3/1799). Lời tựa 6159: Lux aeterna và Cum sanctis là \"Parodien oder Kontrafacta\" của Requiem aeternam và Kyrie."
