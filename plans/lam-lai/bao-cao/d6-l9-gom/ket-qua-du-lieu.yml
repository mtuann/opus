  ghi_chu: "Mutopia: Hallelujah Chorus, for Voice (SATB) và dàn nhạc. Đọc bè: chủ đề \"And He shall reign\" vào lần lượt ở bass ô 41 (Rê), tenor ô 44 (La), alto ô 46 (Rê), soprano ô 48–49 (La): một đoạn fugue (fugato) trong bản hợp xướng. Bản Mutopia ghi nguồn \"Unknown\"; đối chiếu bản in đầu không làm được (PDF IMSLP chặn)."
