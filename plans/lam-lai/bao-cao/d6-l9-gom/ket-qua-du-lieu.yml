  ghi_chu: "IMSLP: chương 2 Andante, Đô trưởng, 156 ô. Đọc bản Peters (piano bốn tay, có ghi nhạc cụ; Commons trang 10–13, tr. 138–141): chủ đề; biến tấu 1 (chữ B–C); biến tấu 2 \"Minore\"; biến tấu 3 \"Maggiore\"; biến tấu 4 (chữ F, ff marcato); rồi coda sau dấu lặng ngân. Là bản chuyển soạn, không phải tổng phổ."
