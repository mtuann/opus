- trang: nghe-nhac/mozart-requiem
  id: n33
  cau: "Mục Nguồn: tổng phổ và lời tựa Neue Mozart-Ausgabe I/1/Abt. 2/1 (Leopold Nowak, 1965) trên Digital Mozart Edition; Köchel online KV 626; bảng so sánh các phiên bản của Carus (Ulrich Leisinger, PDF); link Cổ điển."
  loai: ten
  nguon:
    - ten: 'Neue Mozart-Ausgabe I/1/Abt. 2/1, Requiem: Fragment (Leopold Nowak, 1965), tổng phổ phần Mozart viết, ảnh trên Digital Mozart Edition: tr. 3 Introitus "Adagio", tr. 10 Kyrie "Allegro", tr. 24 Tuba mirum "Andante", "Trombone [tenore] solo", tr. 28 Rex tremendae, tr. 31 Recordare (3/4, một giáng, "Corno di Bassetto I, II", bốn bè "solo"), tr. 41–42 Confutatis ("Tutti sotto voce" ở soprano, alto), tr. 46 Lacrimosa (8 ô); mục lục: "SEQUENZ. Dies irae. Allegro assai"'
      link: https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=13&p1=3
    - ten: 'Neue Mozart-Ausgabe I/1/Abt. 2/1, "Zum vorliegenden Band" (Leopold Nowak), tr. VII–IX: "Franz Graf von Walsegg-Stuppach … Er hatte außerdem die Gewohnheit, bei anerkannten Komponisten Werke zu bestellen, die er dann als seine eigenen ausgab"; "Als nämlich am 14. Februar 1791 des Grafen Gattin Anna … starb, kam er auf die Idee, zu ihrem Andenken von Mozart ein Requiem komponieren zu lassen"; "unerkannt zu bleiben wünschte"; "Das dürfte aller Wahrscheinlichkeit nach zu Beginn des Sommers 1791 gewesen sein"; "Die letzten sechs Monate in Mozarts Leben gehören neben einigen kleineren Werken der Zauberflöte, der Krönungsoper La clemenza di Tito …"; "die am 20. November einsetzende Bettlägerigkeit Mozarts"; "Introitus und Kyrie sind von Mozart geschrieben"; "Die acht Takte des \"Lacrimosa\" sind Mozarts letzte Noten"'
      link: https://dme.mozarteum.at/DME/nma/nma_cont.php?vsep=13&p1=-21
    - ten: 'Köchel-Verzeichnis online: KV 626 "Requiem in D minor, Missa pro defunctis (fragment)", "Dating Vienna, 15.09 – 20.11.1791", "Uncompleted work", nhạc cụ "…, SATB, b+org-fig"; KV 626 (1) "The Requiem, completed by Franz Xaver Süsmayr, in the traditional form"'
      link: https://kv.mozarteum.at/en/work/requiem-in-d-minor-7395
    - ten: 'Carus-Verlag, "The additions – Who wrote what? Mozart’s Requiem. A comparison of versions" (Ulrich Leisinger, CV 99.078/35, PDF): cột "W. A. Mozart, Autograph score": "1. Requiem complete"; "2. Kyrie main parts only, instrumental parts by person unknown"; "3. Dies irae … 10. Hostias main parts"; "8. Lacrymosa main parts (bars 1-8 only)"; Sanctus, Benedictus, Agnus Dei: "vocal parts?"/"Instructions from Mozart?", Süßmayr "supposedly new music"; "14. Lux aeterna … reused from section 1", "Cum Sanctis tuis … reused from section 2"'
      link: https://www.carusmedia.com/images-intern/medien//50/5162600/5162600sb.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Tổng phổ: IMSLP (tìm \"K.626\"). Về thời kỳ: Cổ điển." Thay IMSLP (tìm kiếm chung) bằng nguồn đã đọc. Link /opus/lich-su/thoi-ky/co-dien/: src/content/docs/lich-su/thoi-ky/co-dien.md có (đã khóa). Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
- trang: nghe-nhac/bach-cello-1
  id: n29
  cau: "Sarabande của cùng tổ khúc: một điệu nhảy chậm, nhịp 3/4."
  loai: cau-truc
  nguon:
    - ten: Mutopia Project, Suite 1 for Cello Solo, BWV 1007 (bwv1007_prelude.ly, bwv1007_sarabande.ly, bwv1007.ly; source "Schirmer, 1916"; .ly tải 06/11/2026)
      link: https://www.mutopiaproject.org/ftp/BachJS/BWV1007/bwv1007/
    - ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "sarabande": "a stately version, in slow triple time, was preferred to the lively Sp. original. Sarabandes became a standard movt. of the suite in instr. works by Purcell, J. S. Bach, and Handel."'
      link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/sarabande
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "một điệu nhảy chậm, nhịp 3/4, trọng âm rơi vào phách 2". Mutopia bwv1007_sarabande.ly: \time 3/4; COD: "slow triple time". Vế "trọng âm phách 2" không có nguồn bậc 1–2 đọc được (COD không nói); cùng cách xử lý ở piano/the-loai (D4-gom bỏ "thường nhấn vào phách 2"). Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
- trang: nghe-nhac/bach-cello-1
  id: n18
  cau: "Hợp âm rải: các nốt của hợp âm vang lên lần lượt."
  loai: dinh-nghia
  nguon:
    - ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "broken chord": "A chord in which the notes are played one after the other … instead of simultaneously."'
      link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/broken-chord
  ket_qua_luot_1: dung
  ghi_chu: 'COD "broken chord": "the notes are played one after the other … instead of simultaneously". Vế "tai người nghe tự ghép chúng lại" là cách nói đi kèm.'
- trang: nghe-nhac/handel-hallelujah
  id: n26
  cau: 'Sơ đồ, Đoạn 3: "and He shall reign for ever and ever": fugue, chủ đề mở bằng một bước nhảy quãng lớn, các bè vào lần lượt: bass, tenor, alto, soprano.'
  loai: cau-truc
  nguon:
    - ten: 'Mutopia Project, Messiah HWV 56, số BWchorus "Hallelujah" (global.ily: \key re \major, \tempo "Allegro", \time 4/4 s1*94; score.ily: Tromba I II, Tympani, Violino I, Violino II, Viola, Canto, Alto, Tenore, Basso, Bassi; vcanto/valto/vtenore/vbasso/tromba-notes1/tympani/bassi.ily; lyrics1–4.ily). Source "Leipzig, Friedrich Chrysander, Deutschen Handelgesellschaft edition, volume 45, 1902". Tải 06/11/2026'
      link: https://www.mutopiaproject.org/ftp/HandelGF/HWV56/Messiah/
  ket_qua_luot_1: da-sua
  ghi_chu: "Chữ cũ: \"Fugue: chủ đề nhảy quãng lớn, các bè vào đuổi nhau\". Mutopia: bass ô 41 \"re4. la8 re'4 fad\" (Rê–La, quãng năm đi lên), tenor ô 43–44 (Rê–La), alto ô 46 (La–Rê, quãng bốn đi xuống), soprano ô 48–49 (Rê5–La5). Thêm thứ tự vào. Gọi là fugue theo thuat-ngu fugue (\"chủ đề lần lượt vào ở các bè\"). Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu."
- trang: nghe-nhac/bach-cello-1
  id: n15
  cau: Casals thu âm cả sáu tổ khúc trong các năm 1936–1939 ở London và Paris.
  loai: nam
  nguon:
    - ten: 'Fundació Pau Casals, niên biểu: 1876 "El 29 de desembre del 1876 neix a El Vendrell"; 1890 "Descobreix les sis Suites per a violoncel sol de Johann Sebastian Bach (Ed. Grützmacher) al carrer Ample de Barcelona"; 1936 "Entre els anys 1936 i 1939, Pau Casals enregistra a Londres i a París les Sis Suites per a violoncel sol"'
      link: https://paucasals.org/biografia/cronologia
    - ten: 'MusicBrainz, Pablo Casals, Prelude BWV 1007 (2:29), "recorded in Paris 1938-06-02"; bản phát hành EMI CHS 7 61027 2 (1988) và "The Complete HMV Recordings, 1926-1955"; cùng bộ: Suite 2 thu ở Abbey Road Studios 1936-11-25, Suite 4–5 ở Paris 1939-06'
      link: https://musicbrainz.org/recording/1b16a7c0-254f-494a-9725-503036db588c
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "rồi thu âm trọn bộ cuối những năm 1930". Niên biểu: "Entre els anys 1936 i 1939 … enregistra a Londres i a París les Sis Suites"; MusicBrainz: Abbey Road 1936, Paris 1938, 1939. Viết cụ thể. Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
- trang: nghe-nhac/handel-hallelujah
  id: n15
  cau: Lời do Charles Jennens chọn từ Kinh Thánh, kể về Đấng Cứu Thế.
  loai: lich-su
  nguon:
    - ten: 'The Concise Oxford Dictionary of Music (Encyclopedia.com), "Messiah": "Oratorio by Handel to lib. selected from scriptures by Charles Jennens. Comp. between 22 Aug. and 14 Sept. 1741, though parts are adaptations from other works by Handel. F.p. Dublin, 13 April 1742; London, 23 March 1743"'
      link: https://www.encyclopedia.com/arts/dictionaries-thesauruses-pictures-and-press-releases/messiah
    - ten: 'British Library, R.M.20.f.2 (bản viết tay Messiah): "in which he set words by Charles Jennens after texts from the Bible. According to the dates added by Handel to the manuscript, the music was largely written between 22 August and 14 September 1741"; "ff. 100-106. Hallelujah chorus"; "1 volume (i + 140 folios)"'
      link: https://searcharchives.bl.uk/catalog/040-001948673
    - ten: "IMSLP, Messiah, HWV 56 (wikitext): \"Chorus: Hallelujah (Part II, No.44)\"; \"3 parts\"; \"Year/Date of Composition=1741-09-14 (end date)\"; \"First Performance=1742-04-13 in Dublin. Neal's Music Hall, Fishamble Street\"; \"Librettist=Charles Jennens\"; \"Language=English\"; \"Piece Style=Baroque\"; InstrDetail: oboes, [bassoons], trumpets, timpani, strings, continuo"
      link: https://imslp.org/wiki/Messiah,_HWV_56_(Handel,_George_Frideric)
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Người bạn Charles Jennens đưa cho ông một tập lời trích toàn từ Kinh Thánh". COD "lib. selected from scriptures by Charles Jennens"; Thư viện Anh "words by Charles Jennens after texts from the Bible". Bỏ "người bạn" và chuyện "đưa cho ông" (nguồn đã đọc không nói), bỏ "toàn". Review D6-L9-gom: lượt 2 xác nhận chữ mới; đã đối chiếu chữ trang: khớp câu.'
