- trang: piano/tac-pham/bach-prelude-do
  id: n1
  cau: 'Tiêu đề: "Bach: Prelude Đô trưởng, BWV 846".'
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n2
  cau: "Mô tả và câu mở đầu: bản prelude mở đầu Bình quân luật quyển 1 trông như một bài tập hợp âm rải: 35 ô nhịp, mỗi ô một hợp âm, cùng một hình nốt lặp lại gần như từ đầu đến cuối."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n5
  cau: Tay trái đánh hai nốt rồi giữ chúng suốt nửa ô trong khi tay phải rải tiếp.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n6
  cau: Giữ nốt bằng ngón là cách tạo độ vang trên những cây đàn phím thời Bach, vốn chưa có bàn đạp vang.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n7
  cau: Gần như cả bài là móc kép liên tục trên cùng một hình nốt; một nốt to hơn hay vội hơn là lộ ngay.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n8
  cau: "Hai tay chia một dòng nhạc: tay trái bắt đầu, tay phải nối tiếp."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n9
  cau: Mỗi ô là một hợp âm, không có giai điệu nào che; bài có hợp âm bảy, bảy giảm và âm nền.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n11
  cau: Nhớ 35 hợp âm dễ hơn nhớ năm trăm nốt.
  loai: so-lieu
- trang: piano/tac-pham/bach-prelude-do
  id: n13
  cau: Minuet Sol trưởng là bước đệm nhẹ nhàng hơn bài này.
  loai: cap-do
- trang: piano/tac-pham/bach-prelude-do
  id: n14
  cau: Das Wohltemperierte Klavier gồm 24 cặp prelude và fugue, đi lần lượt qua 12 giọng trưởng và 12 giọng thứ, từ Đô trưởng lên đến Si thứ.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n15
  cau: '"Wohltemperiert" (lên dây tốt) chỉ một cách lên dây cho phép chơi hay ở mọi giọng, điều chưa hiển nhiên vào thời đó.'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n16
  cau: "Trên trang bìa, Bach ghi rằng tập nhạc dành cho những người trẻ ham học nhạc, và để giải trí cho những người đã thạo nghề: vừa là giáo trình, vừa là âm nhạc thật sự."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n18
  cau: Trong Clavier-Büchlein viết cho Wilhelm Friedemann, khi đó chừng chín, mười tuổi, có một phiên bản sớm hơn của bản prelude (BWV 846a).
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n19
  cau: Ở bản chép sạch năm 1722, bài dài 35 ô nhịp như ta biết.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n20
  cau: Prelude (khúc dạo đầu) là bản nhạc đi trước một bản khác, ở đây là fugue.
  loai: dinh-nghia
- trang: piano/tac-pham/bach-prelude-do
  id: n21
  cau: Bài dựng trên một chuỗi hợp âm rải theo khuôn cố định, không có giai điệu để dựa vào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n22
  cau: Suốt nhiều thập kỷ, tập nhạc chỉ truyền tay qua bản chép.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n23
  cau: Beethoven thời niên thiếu ở Bonn được thầy Christian Gottlob Neefe cho học tập này.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n24
  cau: Năm 1853, Charles Gounod viết thêm một giai điệu lên trên prelude, về sau thành bài Ave Maria nổi tiếng.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n25
  cau: "Bach viết cho đàn phím nói chung (Klavier): harpsichord, clavichord, organ."
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n27
  cau: Bản nhạc dài khoảng hai phút.
  loai: so-lieu
- trang: piano/tac-pham/bach-prelude-do
  id: n29
  cau: Bè trầm đi xuống từng bậc và dừng trên nốt Sol một lúc lâu ở gần cuối.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n30
  cau: Năm 1853, Gounod viết thêm một giai điệu lên trên prelude này, về sau thành bài Ave Maria (câu hỏi 4 khi nghe).
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n31
  cau: Glenn Gould, Sviatoslav Richter và András Schiff đã thu trọn Bình quân luật.
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n32
  cau: Schiff viết rằng có thể chơi trọn Bình quân luật mà không chạm tới bàn đạp vang.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n33
  cau: Harpsichord là âm thanh mà Bach quen thuộc.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n36
  cau: "Theo dõi khi nghe, ô 1–4: bốn hợp âm Đô – Rê thứ bảy – Sol bảy – Đô, khẳng định Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n37
  cau: "Ô 5–11: đi sang Sol trưởng; bè trầm đi xuống dần; Rê bảy ở ô 6 và ô 10 kéo về Sol; kết ở Sol trưởng ô 11."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n38
  cau: "Ô 12: hợp âm bảy giảm đầu tiên, màu nhạc tối và căng, đoạn quay về bắt đầu; thêm một hợp âm bảy giảm ở ô 14."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n39
  cau: "Ô 19–20: hợp âm Đô trở lại ở ô 19, rồi Đô bảy ở ô 20 kéo sang Fa."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n40
  cau: "Ô 22–23: hai hợp âm bảy giảm liền nhau; nốt Đô của tay phải treo lại ở ô 23 rồi đi xuống Si ở ô 24."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n41
  cau: "Ô 24–31: âm nền át, nốt Sol trầm giữ suốt tám ô; hợp âm bên trên căng ở ô 27, 28, 31, giãn ở ô 25, 29."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n42
  cau: "Ô 32: âm nền chủ, nốt Đô trầm vang lên, bên trên là Đô bảy."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n43
  cau: "Ô 33–34: hình nốt đổi khác, rải dài lên rồi xuống trên nốt Đô trầm."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n44
  cau: "Ô 35: hợp âm cuối Đô trưởng, đặt xuống sâu và để vang."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n45
  cau: "Bảng Cấu trúc, ô 1–4: I – ii7 – V7 – I (Đô, Rê thứ bảy, Sol bảy, Đô)."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n46
  cau: "Bảng Cấu trúc, ô 5–11: Rê bảy (ô 6, ô 10) là át của Sol; kết ở Sol trưởng ô 11; bè trầm đi xuống dần Đô – Si – La – Rê – Sol."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n47
  cau: "Bảng Cấu trúc, ô 12–23: nhiều hợp âm bảy giảm (ô 12, 14, 22, 23); về lại Đô ở ô 19; Đô bảy ở ô 20 kéo sang Fa; đoạn dài nhất."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n48
  cau: "Bảng Cấu trúc, ô 24–31: nốt Sol trầm giữ suốt tám ô, hợp âm thay đổi bên trên."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n49
  cau: "Bảng Cấu trúc, ô 32–35: nốt Đô trầm; Đô bảy, Fa, Sol bảy trên nền Đô, rồi hợp âm Đô; ở ô 33–34 hình nốt đổi khác."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n50
  cau: "Năm nốt của ô 1 theo thứ tự Bach rải: hai nốt đầu thuộc tay trái, ba nốt sau thuộc tay phải và được nhắc lại (bàn phím tô Đô4 Mi4 Sol4 Đô5 Mi5)."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n51
  cau: Khung hòa âm gom năm nốt mỗi ô thành hợp âm khối (hai nốt dưới tay trái, ba nốt trên tay phải); ô 33–34 chỉ ghi hợp âm chính; °7 là hợp âm bảy giảm, "/" chỉ nốt ở bè trầm; khung đã đối chiếu từng ô với bản nhạc.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n53
  cau: Ở ô 23, nốt Đô của tay phải được giữ lại từ hợp âm ô 22 rồi đi xuống Si ở ô 24, theo kiểu một nốt treo.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n55
  cau: "Chỗ khó, chuyền tay: một nửa ô là một dòng tám nốt (hai nốt tay trái, sáu nốt tay phải)."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n56
  cau: "Chỗ khó, giữ nốt tay trái: nốt trầm là nốt trắng, nốt thứ hai ngân đến hết nửa ô."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n57
  cau: 'Chỗ khó, móc kép đều: hình ba nốt lặp lại dễ bị "nhóm" theo ba, nốt đầu nhóm to hơn; ngón 4 và 5 yếu hơn.'
  loai: quy-tac
- trang: piano/tac-pham/bach-prelude-do
  id: n58
  cau: "Chỗ khó, đổi thế tay: các hợp âm bảy giảm ở ô 12, 14, 22, 23."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n59
  cau: "Chỗ khó, âm nền át (ô 24–31): tám ô trên nốt Sol trầm; Sol bảy ở ô 27 và 31, bảy giảm ở ô 28; Đô trên nền Sol ở ô 25 và 29."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n60
  cau: "Chỗ khó, ô 33–34: hình nốt khác hẳn phần còn lại."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n64
  cau: "Bài tập 1: cùng cách ghi như Bach: tay trái hai bè, nốt trầm nốt trắng, nốt thứ hai vào sau một móc kép, ngân đến hết nửa ô; tiến trình I – IV – V7 – I ở Sol trưởng."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n67
  cau: Các hình bàn tay khó trong bài, nhất là ô 12, 14, 22 và 23.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n70
  cau: Bach không ghi tốc độ.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n72
  cau: Không bàn đạp, chỉ dùng ngón giữ nốt, đúng như Bach ghi; tiếng đàn gần nhất với harpsichord và clavichord.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n73
  cau: Bàn đạp nhẹ, đổi mỗi ô; nhấn nông vì ba nốt tay phải được chơi hai lượt trong mỗi nửa ô và tiếng vang tích tụ nhanh.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n76
  cau: Bản nhạc không có dấu sắc thái nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n78
  cau: Ở ô 33–34, trên nốt Đô trầm, nét rải đi lên rồi đi xuống.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n79
  cau: Một số ấn bản thế kỷ 19 chèn thêm một ô nhịp giữa ô 22 và ô 23 ("ô nhịp Schwencke"), khiến bài dài 36 ô.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n80
  cau: Ô ấy không có trong bản viết tay của Bach; nên dùng bản Urtext 35 ô.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n81
  cau: Các ấn bản cũ (ví dụ của Czerny) còn thêm sắc thái, dấu luyến và tốc độ của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n82
  cau: Bài không có nốt hoa mỹ nào.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n85
  cau: Invention số 1 có hai bè độc lập thay cho hợp âm rải.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n86
  cau: Prelude và fugue Đô thứ BWV 847 đứng ngay sau bài này trong quyển 1.
  loai: danh-muc
- trang: piano/tac-pham/bach-prelude-do
  id: n87
  cau: Prelude Đô thứ BWV 847 cũng dựng trên một hình nốt lặp lại, và là một trong số ít bài của quyển 1 có chỉ dẫn tốc độ của chính Bach.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n89
  cau: 24 prelude Op. 28 của Chopin cũng đi qua đủ 24 giọng.
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n92
  cau: "Câu hỏi 1: âm nền át ở ô 24–31 là nốt Sol trầm giữ suốt tám ô trong khi hợp âm bên trên thay đổi."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n93
  cau: "Câu hỏi 2: Bach ghi hai nốt tay trái là nốt ngân đến hết nửa ô; giữ bằng ngón tạo độ vang; dù dùng bàn đạp hay không vẫn giữ nốt bằng ngón."
  loai: cau-truc
- trang: piano/tac-pham/bach-prelude-do
  id: n94
  cau: 'Câu hỏi 3: "ô nhịp Schwencke" là một ô mà một số ấn bản thế kỷ 19 chèn thêm giữa ô 22 và ô 23, không có trong bản viết tay của Bach; bản đúng có 35 ô.'
  loai: lich-su
- trang: piano/tac-pham/bach-prelude-do
  id: n96
  cau: "Nguồn: Henle HN 14 (biên tập Ernst-Günter Heinemann, ngón bấm András Schiff), lời nói đầu và ghi chú diễn tấu."
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n97
  cau: "Nguồn: bài blog của Norbert Müllemann trên blog Henle, 2012 (ô nhịp Schwencke)."
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n98
  cau: "Nguồn: Thayer, The Life of Ludwig van Beethoven, tập 1, bản tiếng Anh của Krehbiel, 1921."
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n99
  cau: "Nguồn: bản nhạc IMSLP; khung hòa âm đối chiếu với bản LilyPond của Mutopia và bản Novello do Harold Brooke biên tập."
  loai: ten
- trang: piano/tac-pham/bach-prelude-do
  id: n71
  cau: Cách chọn và giữ tốc độ, nới nhẹ hai ô cuối, móc kép liền tiếng.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-do
  id: n75
  cau: Dù chọn cách nào, vẫn giữ nốt bằng ngón; không giữ bàn đạp qua hai hợp âm.
  loai: khuyen-tap
- trang: piano/tac-pham/bach-prelude-do
  id: n26
  cau: Trên piano hiện đại, câu hỏi lớn nhất của bài này là dùng bàn đạp đến đâu; phần Diễn tấu bàn kỹ.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-op49-2
  id: n1
  cau: 'Tiêu đề: "Beethoven: Sonata Sol trưởng Op. 49 số 2, chương 1".'
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n2
  cau: 'Mô tả và câu mở đầu: đây là một chương sonata trọn vẹn mà bản in đầu tiên gọi là "sonata dễ".'
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n3
  cau: Chương có 122 ô nhịp, đủ trình bày, phát triển và tái hiện.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n4
  cau: Không chỗ nào đòi sức mạnh hay tốc độ ghê gớm.
  loai: cap-do
- trang: piano/tac-pham/beethoven-op49-2
  id: n5
  cau: Trang hướng dẫn tập chương 1 (Allegro, ma non troppo) để nghe hình thức sonata từ bên trong.
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n6
  cau: Ba phần của hình thức sonata (link /opus/hinh-thuc/sonata/) đều ngắn và rõ.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n7
  cau: Đoạn chuyển ở phần tái hiện (ô 82–87) gần như nguyên văn đoạn chuyển ở phần trình bày (ô 15–20); lần đầu nó dẫn sang chủ đề 2 ở Rê trưởng, lần sau ở Sol trưởng.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n8
  cau: Ô 1 có chùm ba (ba nốt móc đơn trong một phách đen), ô 3 có nhịp chấm dôi (nốt đen chấm dôi rồi nốt móc đơn).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n10
  cau: Các chuỗi gam chùm ba ở nhóm kết (ô 36–43, ô 103–110); tay trái cũng có gam chùm ba (ô 44, 47, 111, 114).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n12
  cau: "Tay trái nhiều vai: một bè trầm có giai điệu riêng (ô 2–4), hình đệm nốt lặp (ô 6–8, 21–24), hợp âm rải chùm ba (ô 15–19), nốt lặp đều (ô 59–62)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n16
  cau: So với Op. 49 số 2, K. 545 có nhiều đệm Alberti hơn và ít chùm ba hơn.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n17
  cau: Hai sonata Op. 49 đều chỉ có hai chương.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n18
  cau: Theo lời giới thiệu của ấn bản Henle, Beethoven viết chúng khoảng 1796–1798 (số 2 có lẽ năm 1796), gần cùng thời với ba sonata Op. 10.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n19
  cau: Khi viết chúng, Beethoven chưa đến ba mươi tuổi.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n20
  cau: "Việc chúng được in có lẽ là nhờ người em trai Carl, người lục tìm trong các bản thảo của anh những bài có thể đem bán: từ cuối năm 1802 Carl đem chào vài nơi không thành, đến tháng 1 năm 1805 một nhà xuất bản ở Vienna mới in chúng."
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n21
  cau: Bản in đầu tiên gọi chúng là Sonates faciles, "những sonata dễ".
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n22
  cau: Vì in muộn, hai sonata mang số Op. 49, lớn hơn Sonata Ánh trăng Op. 27 (1801), bài được viết sau chúng; số Op. ở đây cho biết lúc in, không phải lúc viết.
  loai: danh-muc
- trang: piano/tac-pham/beethoven-op49-2
  id: n23
  cau: Op. 49 số 2 thuộc về Beethoven của những năm 1790.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n24
  cau: Chương 2 (Tempo di Menuetto) có chủ đề mà Beethoven dùng lại trong chương minuet của bản Septet Op. 20 (1799), một tác phẩm rất được ưa chuộng thời ông.
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n25
  cau: "Đàn piano Vienna cuối thế kỷ 18 có âm vực khoảng năm quãng tám (kiểu đàn của Anton Walter: Fa1–Sol6)."
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n26
  cau: Cả chương này nằm gọn trong khoảng Sol1–Mi6.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n30
  cau: Cử chỉ mở đầu (hợp âm Sol trưởng, rồi chùm ba đi lên và đi xuống) còn xuất hiện ở ô 5, đầu phần phát triển ở giọng thứ, đầu phần tái hiện.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n31
  cau: Ba nốt lặp báo hiệu chủ đề 2.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n33
  cau: Mọi bản thu trọn 32 sonata của Beethoven đều có bài này.
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n35
  cau: Ronald Brautigam thu trọn các sonata của Beethoven trên fortepiano.
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n37
  cau: Pathétique là một sonata lớn hơn của Beethoven cùng thời kỳ.
  loai: nam
- trang: piano/tac-pham/beethoven-op49-2
  id: n39
  cau: "Theo dõi khi nghe, chủ đề 1 (ô 1–8): hợp âm Sol trưởng, chùm ba đi lên rồi xuống, giai điệu nhịp chấm dôi kết bằng láy rền; từ ô 5 cả câu nhắc lại cao hơn một quãng tám, tay trái chuyển sang hình đệm nốt lặp."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n40
  cau: "Tiếp nối (ô 9–14): những cặp nốt luyến đi lên nửa cung (Rê♯–Mi, Đô♯–Rê) ngăn bởi dấu lặng ngắn; láy quanh ở ô 12; tay trái rất thưa."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n41
  cau: "Đoạn chuyển (ô 15–20), f: tay phải nhảy giữa nốt đen ở âm vực giữa và chùm ba từ trên cao đổ xuống; tay trái rải hợp âm chùm ba trên nốt Rê trầm."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n42
  cau: "Chủ đề 2 (nhịp lấy đà ở ô 20, ô 21–35): Rê trưởng; ba nốt La lặp làm đà, giai điệu luyến mềm trên hình đệm nốt lặp; staccato nhẹ trên những nốt Mi lặp (ô 25–26)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n43
  cau: "Nhóm kết (ô 36–52): gam chùm ba mười hai nốt đi xuống rồi đi lên, xen những ô nốt đen lặp; quãng ba ngân dài trong lúc tay trái chạy gam; các hợp âm kết ở Rê trưởng."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n44
  cau: Trình bày nhắc lại (ô 1–52).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n45
  cau: "Phát triển (ô 53–66): cử chỉ mở đầu trở lại ở Rê thứ, f; rồi La thứ, Mi thứ trên nốt Si lặp của tay trái; hai tay cùng đi xuống, dẫn về."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n46
  cau: "Tái hiện (ô 67–81): chủ đề 1 ở Sol trưởng; từ ô 74 rẽ sang đường mới, gam chùm ba đi qua Đô trưởng và La thứ."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n47
  cau: "Đoạn chuyển và chủ đề 2 (ô 82–102): đoạn chuyển gần như nguyên văn lần đầu, nhưng chủ đề 2 giờ ở Sol trưởng, với ba nốt Rê làm đà (ô 87)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n48
  cau: "Nhóm kết (ô 103–122): gam chùm ba ở Sol trưởng, quãng ba ngân, các hợp âm kết; ô cuối: hợp âm, rồi dấu lặng có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n49
  cau: Số ô nhịp trên trang theo bản Breitkopf & Härtel (qua Mutopia).
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n50
  cau: "Bảng Cấu trúc, chủ đề 1 (ô 1–8, Sol trưởng): hợp âm và chùm ba, giai điệu nhịp chấm dôi, láy rền ở ô 4; ô 5–8 nhắc lại cao hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n51
  cau: "Bảng Cấu trúc, tiếp nối (ô 9–14, Sol trưởng): cặp nốt luyến nửa cung và dấu lặng; láy quanh ở ô 12; dừng trên hợp âm La trưởng."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n52
  cau: "Bảng Cấu trúc, đoạn chuyển (ô 15–20, Sol → Rê): f; tay phải nốt đen và chùm ba, tay trái hợp âm rải chùm ba trên nốt Rê; dừng trên hợp âm Rê."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n53
  cau: "Bảng Cấu trúc, chủ đề 2 (ô 20 nhịp lấy đà – 35, Rê trưởng): ba nốt La làm đà; giai điệu luyến trên hình đệm nốt lặp; nói hai lần (ô 21–28, 29–35)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n54
  cau: "Bảng Cấu trúc, nhóm kết (ô 36–52, Rê trưởng): gam chùm ba xen nốt đen lặp (36–43); quãng ba ngân trên gam chùm ba của tay trái (44–48); hợp âm kết (49–52); cả phần trình bày nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n55
  cau: "Bảng Cấu trúc, phát triển (ô 53–66): cử chỉ mở đầu ở Rê thứ (ô 53) và La thứ (ô 56); Mi thứ, rồi nốt Si lặp ở tay trái (ô 59–62); hai tay đi xuống, dừng trên nốt Rê trầm (ô 63–66)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n56
  cau: "Bảng Cấu trúc, tái hiện chủ đề 1 (ô 67–81, Sol trưởng): ô 67–73 gần như ô 1–7; từ ô 74 đi đường mới: gam chùm ba qua Đô trưởng (75–78) và La thứ (79–81)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n57
  cau: "Bảng Cấu trúc, đoạn chuyển (ô 82–87, Sol trưởng): gần như nguyên văn ô 15–20."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n58
  cau: "Bảng Cấu trúc, chủ đề 2 (ô 87 nhịp lấy đà – 102): ba nốt Rê làm đà; chủ đề 2 ở giọng chủ."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n59
  cau: "Bảng Cấu trúc, nhóm kết (ô 103–122): như ô 36–52, ở Sol trưởng; hợp âm cuối ở ô 122, tiếp theo là dấu lặng có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n60
  cau: 'Hợp âm Rê cuối đoạn chuyển: ở ô 20 tai nghe nó như một giọng mới (Rê trưởng); ở ô 87, cũng hợp âm ấy, lại nghe như át âm kéo về Sol; vì vậy phần tái hiện "giải quyết" phần trình bày.'
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n62
  cau: "Tám ô đầu: nốt nhạc, dấu luyến, láy rền và chữ p theo bản Breitkopf & Härtel (Ludwig van Beethovens Werke, 1862–1865) qua Mutopia; số ngón là gợi ý của trang; bản ấy không ghi sắc thái ở ô 1; từ ô 6 tay trái đọc ở khóa Sol."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n63
  cau: "Ở ô 2–4, tay trái là một bè trầm có giai điệu riêng: Si – La – Sol – Fa♯ – Rê – Sol – Fa♮ – Mi – Fa♯ – Sol; nốt Fa♮ ở ô 3 đi xuống nửa cung tới Mi ở ô 4."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n64
  cau: Ở ô 6–8, ngón cái tay trái lặp nốt Rê ở trên trong khi bè dưới đi xuống; quãng giữa hai nốt mở dần từ quãng ba đến quãng tám (Rê–Rê ở ô 7).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n65
  cau: Láy rền ở ô 4 và ô 8 kết bằng hai nốt nhỏ Si–Đô đã in sẵn.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n66
  cau: "Chỗ khó, hợp âm rồi chùm ba (ô 1, 5, 53, 56, 67, 71): tay rời hợp âm để rải hơn một quãng tám (ô 1: Rê–Sol–Si–Rê rồi Đô–La); hai phách trắng: hợp âm là phách 1, hai chùm ba là phách 2."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n67
  cau: Chỗ khó, nhịp chấm dôi cạnh chùm ba (ô 3, 7, 69).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n68
  cau: "Chỗ khó, láy rền có nốt kết (ô 4, 8, 70): chỉ có một nốt đen ở tốc độ nhanh; nốt trên của láy (Rê) vừa vang ngay trước."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n69
  cau: Có thể bắt đầu láy từ chính nốt Đô, vì nốt Rê vừa vang đã làm nốt trên; nếu bắt đầu từ nốt trên, đừng nhấn nốt Rê ấy lần nữa.
  loai: quy-tac
- trang: piano/tac-pham/beethoven-op49-2
  id: n70
  cau: "Chỗ khó, cặp nốt luyến và láy quanh (ô 9–14): mỗi cặp nặng – nhẹ rồi nhấc tay đúng dấu lặng; láy quanh sau nốt Sol chấm dôi (ô 12)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n71
  cau: "Láy quanh sau nốt Sol: bốn nốt La–Sol–Fa♯–Sol trong phần chấm dôi."
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n72
  cau: "Chỗ khó, đoạn chuyển (ô 15–19): tay phải nhảy giữa nốt đen ở âm vực giữa và chùm ba từ trên cao (Fa♯4 lên La5, một quãng mười)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n73
  cau: "Chỗ khó, gam chùm ba (ô 36–43, 103–110; tay trái ô 44, 47, 111, 114): nhóm ngón (3 và 4 ngón) không trùng nhóm nốt (3 nốt), ngón cái rơi giữa nhóm."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n74
  cau: "Chỗ khó, hình đệm nốt lặp ở tay trái (ô 6–8, 21–24, 29–32): ngón cái lặp một nốt suốt nhiều phách; bè dưới mới là đường đi của hòa âm."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n75
  cau: "Chỗ khó, nốt lặp ở tay trái (ô 59–62): tám móc đơn trên nốt Si mỗi ô, dễ to dần và mỏi cổ tay."
  loai: quy-tac
- trang: piano/tac-pham/beethoven-op49-2
  id: n76
  cau: "Chỗ khó, tái hiện rẽ hướng (ô 73–81): các nốt Fa♮ ở ô 74–78 dễ thành Fa♯."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n83
  cau: "Tập thêm ở Rê trưởng và Đô trưởng: các chuỗi gam chùm ba ở ô 36–43 đi ở Rê trưởng, ở ô 75–78 đi qua Đô trưởng."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n85
  cau: Tốc độ tính theo phách đen; khi đã nhanh, cảm hai phách trắng mỗi ô (alla breve).
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n87
  cau: "Allegro, ma non troppo: nhanh, nhưng không quá."
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n88
  cau: Nhịp 2/2 nghĩa là hai phách trắng mỗi ô.
  loai: dinh-nghia
- trang: piano/tac-pham/beethoven-op49-2
  id: n90
  cau: Bản Breitkopf mà trang dùng ghi rất ít sắc thái (chẳng hạn p ở ô 6, f ở ô 15 và ô 53).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n92
  cau: "Phát âm: nốt đen không có dấu luyến (giai điệu ô 2–4, đoạn chuyển); cặp nốt luyến (ô 9–14, chủ đề 2); ba nốt La làm đà ở ô 20 dẫn vào nốt Rê đầu dấu luyến; staccato trên các nốt Mi lặp (ô 25–26) và các quãng ba đi xuống (ô 45, 48)."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n95
  cau: Láy rền ở ô 4, 8, 70 (trên nốt Đô, có hai nốt kết in nhỏ) và ô 109 (trên nốt La).
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n96
  cau: Láy quanh ở ô 12, sau nốt Sol, trong phần chấm dôi.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n97
  cau: Nốt nhỏ trước các gam chùm ba ở ô 36, 40, 75, 103, 107.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n98
  cau: Bản Urtext Henle (HN 1327) in chung hai sonata Op. 49, ngón bấm của Murray Perahia.
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n101
  cau: "Học tiếp: chương 2 (Tempo di Menuetto) cùng giọng Sol trưởng, với chủ đề gặp lại trong Septet Op. 20."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n102
  cau: "Sonata Op. 49 số 1 (Sol thứ): hai chương, Andante rồi Rondo: Allegro."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n104
  cau: K. 545 cũng hình thức sonata, với đệm Alberti và chuỗi gam móc kép.
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n106
  cau: "Câu hỏi 1: phần phát triển bắt đầu ở ô 53 bằng hợp âm và chùm ba của mở đầu, ở Rê thứ; ô 36 là nhóm kết, ô 67 là tái hiện; phần phát triển (ô 53–66) đi qua Rê thứ, La thứ, Mi thứ rồi dừng trên nốt Rê trầm."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n107
  cau: "Câu hỏi 2: đoạn chuyển ở tái hiện gần như giống hệt đoạn ở trình bày, nhưng dẫn sang chủ đề 2 ở Sol trưởng thay vì Rê trưởng; hợp âm Rê cuối đoạn nghe như giọng mới ở trình bày và như át âm của Sol ở tái hiện."
  loai: cau-truc
- trang: piano/tac-pham/beethoven-op49-2
  id: n109
  cau: "Câu hỏi 4: sonata viết khoảng năm 1796 mang số Op. 49 vì chỉ được in năm 1805; theo Henle, Carl đã đem chào vài nhà xuất bản không thành; năm 1805 hai sonata mới được in, với tên Sonates faciles."
  loai: lich-su
- trang: piano/tac-pham/beethoven-op49-2
  id: n110
  cau: "Nguồn: Henle HN 1327 (biên tập Norbert Gertsch, ngón bấm Murray Perahia), lời giới thiệu và mức độ khó trên trang ấn bản."
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n111
  cau: "Nguồn: Ludwig van Beethovens Werke (Breitkopf & Härtel, 1862–1865), bản dàn trang công cộng của Mutopia (người nhập: Stelios Samelis)."
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n112
  cau: "Mục Nguồn bỏ hai sách in chưa đọc (Beethoven, The 35 Piano Sonatas, ABRSM, biên tập Barry Cooper; Charles Rosen, Beethoven's Piano Sonatas: A Short Companion, 2002)."
  loai: ten
- trang: piano/tac-pham/beethoven-op49-2
  id: n34
  cau: So sánh tốc độ, độ tách tiếng của nốt đen và độ nổi của tay trái.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-op49-2
  id: n9
  cau: Giữ hai kiểu tiết tấu tách bạch là bài học về sự chính xác.
  loai: khuyen-tap
- trang: piano/tac-pham/beethoven-op49-2
  id: n100
  cau: Lỗi thường gặp (chín dòng).
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n1
  cau: Bài dài mười sáu ô nhịp, chưa đến một phút (câu mở đầu và mô tả trang).
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n2
  cau: Đây là một trong những prélude ngắn nhất của Chopin.
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n3
  cau: Bài ở nhịp ba, với hình chấm dôi gợi điệu mazurka.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n5
  cau: Gần như mọi nốt giai điệu nằm ở đỉnh một hợp âm hai, ba nốt.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n7
  cau: Hợp âm ở ô 12 trải từ Fa♯3 lên Đô♯6.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n9
  cau: Bản nhạc ghi bàn đạp cho mỗi câu hai ô một lần đạp, nhả ở chỗ tay trái nghỉ.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n11
  cau: Tám câu có cùng một nhịp điệu.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n13
  cau: "Có thể học bài này trước Prélude Mi thứ: Henle xếp cả hai ở mức 4, mức thấp nhất trong bộ Op. 28, nhưng bài này chỉ có 16 ô nhịp, bài Mi thứ 25 ô."
  loai: cap-do
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n16
  cau: "Hai mươi bốn prélude đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song song, tiến theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ, Rê trưởng, Si thứ, rồi La trưởng ở số 7."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n17
  cau: Mỗi bài là một bức tranh độc lập; có bài chỉ kéo dài vài chục giây.
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n18
  cau: Bài số 7 đứng giữa Prélude Si thứ rất chậm (Lento assai, số 6) và Prélude Fa♯ thứ dồn dập (Molto agitato, số 8).
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n19
  cau: Nhịp ba với hình chấm dôi ở phách 1 và hai hợp âm lặp ở phách 2–3.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n20
  cau: Mazurka là điệu nhảy dân gian Ba Lan.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n21
  cau: Chopin viết gần 60 bản mazurka.
  loai: so-lieu
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n23
  cau: "Bài không phải một điệu nhảy thật: không có nhấn lệch, không có tiếng dậm chân, chỉ là một giai điệu nhẹ nhàng như nhớ lại một điệu nhảy."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n24
  cau: Nhà soạn nhạc Catalunya Federico Mompou về sau lấy chính prélude này làm chủ đề cho một bộ biến tấu cho piano, Variations sur un thème de Chopin.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n27
  cau: Alfred Cortot, Maurizio Pollini và Martha Argerich đã thu trọn bộ prelude.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n29
  cau: "Nhịp lấy đà và câu 1 (ô 1–2): một nốt Mi đơn, rồi giai điệu nhảy lên một quãng sáu với hình chấm dôi; hợp âm át (Mi bảy) ngân."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n30
  cau: "Câu 2 (ô 3–4): cùng nhịp điệu, giai điệu vươn lên La; hợp âm chủ La trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n31
  cau: "Câu 3 (ô 5–6): lại trên hợp âm át; La♯ chạm vào Si."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n32
  cau: "Câu 4 (ô 7–8): về La trưởng, bè trầm xuống thấp nhất bài; khép nửa đầu."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n33
  cau: "Câu 5 (ô 9–10): nửa sau bắt đầu lại như câu 1."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n34
  cau: "Câu 6 và đỉnh (ô 11–12): giai điệu lên Đô♯6, nốt cao nhất bài; hợp âm rải lớn ở ô 12."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n35
  cau: "Câu 7 (ô 13–14): Si thứ, rồi hợp âm át; nhạc dịu xuống."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n36
  cau: "Câu 8 (ô 15–16): về La trưởng; giai điệu nhảy lên một quãng tám, hợp âm cuối ngân."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n37
  cau: "Mỗi câu hai ô có cùng nhịp điệu: nhịp lấy đà ở phách 3, hình chấm dôi ở phách 1, hai hợp âm ở phách 2–3, rồi một hợp âm dài."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n38
  cau: "Nửa đầu là hỏi và đáp: câu lẻ đứng trên hợp âm át, câu chẵn về hợp âm chủ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n39
  cau: "Nửa sau phá khuôn ở câu 6–7: hòa âm đổi mỗi ô, lên Fa♯ bảy (át của Si thứ, một át phụ) rồi sang Si thứ, trước khi câu 8 về nhà."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n40
  cau: "Bảng Cấu trúc, câu 1: lấy đà, ô 1–2; Mi bảy (át); giai điệu Mi4 → Đô♯5 . Rê5 → Si4; bước nhảy quãng sáu."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n41
  cau: "Bảng, câu 2: ô 3–4; La trưởng; Fa♯5 → Rê♯5 . Mi5 → La5; quãng sáu Đô♯–La ở tay phải."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n42
  cau: "Bảng, câu 3: ô 5–6; át (bè trầm Mi); Đô♯5 → La♯4 . Si4 → Rê5; bè trong giữ Rê."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n43
  cau: "Bảng, câu 4: ô 7–8; La trưởng; Sol♯4 → Sol♯4 . La4 → Đô♯5; bè trầm xuống La1."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n44
  cau: "Bảng, câu 5: ô 9–10; Mi bảy; như câu 1."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n45
  cau: "Bảng, câu 6: ô 11–12; La trưởng → Fa♯ bảy; Fa♯5 → Rê♯5 . Mi5 → Đô♯6."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n46
  cau: "Bảng, câu 7: ô 13–14; Si thứ → Mi (át); Đô♯5 → Đô♯5 . Rê5 → Fa♯5; hòa âm đổi mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n47
  cau: "Bảng, câu 8: ô 15–16; La trưởng; Sol♯4 → Si4 . La4 → La5; nhảy lên một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n48
  cau: Ở câu 2, 3, 6 và 7, nốt dài trong hình chấm dôi thường là một nốt lạ, nằm dưới nốt hợp âm nửa cung (Rê♯ trước Mi, La♯ trước Si), và nốt móc kép giải quyết nó.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n50
  cau: "Nốt nhạc theo ấn bản Peters, qua bản dàn trang LilyPond công cộng của Mutopia Project (người nhập: Magnus Lewis-Smith); dấu bàn đạp theo bản ấy, số ngón là gợi ý của trang."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n51
  cau: "Nhịp lấy đà Mi4 vang một mình: tay trái nghỉ, bàn đạp chưa xuống; bàn đạp xuống cùng nốt Mi trầm ở phách 1, giữ suốt câu, nhả ở phách 3 ô 2; câu 2 nhả ở phách 3 ô 4."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n52
  cau: "Tay trái ở phách 2–3: nốt Mi4 của nó nằm cao hơn nốt Rê4 của tay phải."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n54
  cau: "Hai tay đan vào nhau ở ô 1–2, 7–10: nốt cao của tay trái (Mi4) nằm trên nốt thấp của tay phải (Rê4 ở ô 1–2 và 9–10, Đô♯4 ở ô 7–8)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n55
  cau: Ở ô 12, tay phải trải một quãng mười (La♯4–Đô♯6), cả hợp âm từ Fa♯3.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n56
  cau: "Bàn đạp: theo dấu trong bản nhạc, đạp cùng nốt trầm phách 1, nhả ở phách 3 của ô sau; từ ô 11 đến ô 14 đổi mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n66
  cau: Andantino là đi thong thả, nhẹ nhàng; đừng kéo nó thành một bài chậm.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n68
  cau: Bản Peters ghi dolce e semplice (ngọt ngào và giản dị) ở đầu bài.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n70
  cau: "Trong bản Peters, mỗi câu có một lần đạp: xuống ở phách 1 cùng nốt trầm của ô lẻ, nhả ở phách 3 của ô chẵn; từ ô 11 đến ô 14 bàn đạp đổi mỗi ô, ở ô 11 và 13 nhả ngay ở hợp âm phách 3."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n71
  cau: Chopin thường tự ghi bàn đạp trong bản viết tay; các bản Urtext như Ấn bản Quốc gia Ba Lan cho biết dấu nào là của ông, dấu nào của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n72
  cau: "Hợp âm ô 12 là đỉnh và là hợp âm lớn nhất: Fa♯ bảy, át của Si thứ, trải từ Fa♯3 lên Đô♯6."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n73
  cau: Theo lệ chung khi chơi Chopin (link Nốt hoa mỹ), hợp âm rải bắt đầu đúng phách, từ nốt thấp nhất.
  loai: quy-tac
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n75
  cau: Dấu rải có thể là một đường liền qua hai khuông (rải liền một hơi từ tay trái lên tay phải) hay hai đường riêng cho hai tay (không nhất thiết là hai tay rải cùng lúc).
  loai: quy-tac
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n76
  cau: "Chín nốt của hợp âm ô 12 theo bản Peters, từ dưới lên: Fa♯3 Đô♯4 Mi4 Fa♯4 La♯4 Đô♯5 Mi5 La♯5 Đô♯6 (thông số notes của ::cong-cu piano)."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n77
  cau: Học trò của Chopin kể rằng ông muốn phần đệm giữ nhịp vững trong khi giai điệu được tự do co giãn (sách của Eigeldinger).
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n79
  cau: Bản Peters là một ấn bản thế kỷ 19 với một số chỉ dẫn của người biên tập.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n80
  cau: Các ấn bản khác nhau ở những chi tiết như dấu luyến, chỉ dẫn sắc thái và cách ghi dấu rải ở ô 12.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n81
  cau: Nên dùng bản Urtext, lý tưởng nhất là Ấn bản Quốc gia Ba Lan của Jan Ekier, có kèm chú giải biểu diễn.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n88
  cau: "Câu hỏi 1: mỗi câu dài hai ô và mở đầu bằng một nhịp lấy đà; tám câu hai ô cùng nhịp điệu."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n89
  cau: "Câu hỏi 2: bàn đạp nhả ở phách 3 của ô thứ hai, chỗ tay trái nghỉ; từ ô 11 đến ô 14 hòa âm và bàn đạp đổi mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n90
  cau: "Câu hỏi 3: rải ô 12 từ nốt thấp nhất lên, bắt đầu đúng phách, nốt Đô♯6 hát rõ nhất; bàn đạp xuống từ nốt đầu tiên."
  loai: quy-tac
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n91
  cau: "Câu hỏi 4: Fa♯ bảy ở ô 12 là át của Si thứ (một át phụ), dẫn sang Si thứ ở ô 13; Si thứ là hợp âm bậc II của La trưởng, rồi nhạc qua át (Mi) về La trưởng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n92
  cau: "Nguồn: Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by His Pupils, Cambridge University Press, 1986."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n93
  cau: "Nguồn: Ấn bản Quốc gia Ba Lan, tập Preludia op. 28, biên tập Jan Ekier: văn bản Urtext và chú giải biểu diễn."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n94
  cau: "Nguồn: Ấn bản Peters, bản dàn trang LilyPond công cộng của Mutopia Project (Magnus Lewis-Smith)."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n64
  cau: Kế hoạch 4 tuần (20–30 phút mỗi ngày, máy đếm nhịp ♩ = 48–72) và danh sách tự kiểm.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n74
  cau: Rải nhanh vừa phải, như một hơi thở sâu; nốt Đô♯6 là giai điệu và phải hát rõ nhất.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-la-truong
  id: n63
  cau: Cách tập bài tập 3 (đặt sẵn hai khối, rải chậm rồi nhanh dần).
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n1
  cau: Bài dài hai mươi lăm ô nhịp (câu mở đầu và mô tả trang).
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n2
  cau: Giai điệu gần như chỉ đi lại giữa hai nốt cạnh nhau.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n3
  cau: Tay trái lặp đi lặp lại những hợp âm móc đơn.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n4
  cau: Ít nốt đến thế mà bài được chơi trong lễ tang của chính Chopin (câu mở đầu và mô tả trang).
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n6
  cau: "Hợp âm tay trái đổi từng chút một: gần như mỗi lần chỉ một bè đi xuống nửa cung."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n9
  cau: Giai điệu ngân dài trên nốt Si rồi thở dài sang Đô.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n11
  cau: "Một cao trào trong 25 ô: dồn lên, bùng nổ, lắng xuống, im lặng, kết."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n12
  cau: "Một bài Chopin đầu tiên vừa sức: khoảng hai phút; Henle xếp bài ở mức 4, mức thấp nhất trong bộ Op. 28."
  loai: cap-do
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n13
  cau: "Bộ 24 Prélude Op. 28 đi qua đủ 24 giọng, mỗi giọng trưởng theo sau là giọng thứ song song, theo vòng quãng năm: Đô trưởng, La thứ, Sol trưởng, Mi thứ…"
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n14
  cau: Chopin mang theo bản Bình quân luật của Bach tới Mallorca, và ý tưởng một bộ prelude đủ mọi giọng gợi nhớ tác phẩm ấy.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n15
  cau: "Prelude của Chopin không còn là khúc dạo đầu cho một fugue: mỗi bài là một bức tranh độc lập, có bài chỉ dài vài chục giây."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n16
  cau: Chopin hoàn tất bộ này ở đảo Mallorca, nơi ông trú đông 1838–1839 cùng nhà văn George Sand, trong một tu viện cũ ở Valldemossa, khi bệnh phổi đã hành hạ ông.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n17
  cau: Trong thư gửi Camille Pleyel, Chopin viết rằng mình đã viết xong các prelude "trên cây đàn nhỏ của ông".
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n18
  cau: Bài số 4 có khi được gọi bằng biệt danh "Ngạt thở" (Suffocation); biệt danh ấy không phải của Chopin, ông chỉ ghi tốc độ Largo.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n19
  cau: Ngày 30 tháng 10 năm 1849, tại lễ tang Chopin ở nhà thờ Madeleine (Paris), nghệ sĩ organ Louis Lefébure-Wély chơi trên đàn organ hai prelude của Chopin, trong đó có bài Mi thứ này, và Requiem của Mozart được trình diễn.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n22
  cau: Alfred Cortot, Maurizio Pollini và Martha Argerich đã thu trọn bộ prelude.
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n24
  cau: "Theo dõi, nhịp lấy đà và câu 1 (ô 1–12): hai nốt Si cách nhau một quãng tám mở lời; giai điệu ngân Si rồi thở dài sang Đô, hợp âm tay trái trượt xuống từng nửa cung."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n25
  cau: "Theo dõi, ô 9: giai điệu bừng lên một chút, trong khi hợp âm bên dưới vẫn trượt xuống."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n26
  cau: "Theo dõi, ô 12: tay trái dừng trên Si bảy; tay phải một mình chạy một nét nhỏ dẫn về đầu."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n27
  cau: "Theo dõi, câu 2 (ô 13–15): mở đầu như ô 1, nhưng hòa âm trượt nhanh hơn."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n28
  cau: "Theo dõi, stretto và cao trào (ô 16–18): dồn lên; đỉnh f duy nhất của bài ở ô 17, rồi nhỏ dần."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n29
  cau: "Theo dõi, lắng xuống (ô 19–22): trở lại p; smorzando ở ô 21, giai điệu chìm về nốt Mi, hợp âm thưa dần."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n30
  cau: "Theo dõi, im lặng (ô 23): một hợp âm sáu tăng, rồi dấu lặng có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n31
  cau: "Theo dõi, kết (ô 24–25): ba hợp âm cuối pp: át, rồi chủ Mi thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n32
  cau: "Bảng Cấu trúc, nhịp lấy đà: hai nốt Si cách quãng tám, p, espressivo."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n33
  cau: "Bảng, câu 1 (ô 1–12): tay phải ngân Si, thở dài Si–Đô; ô 9 giai điệu bừng lên; ô 12 tay trái dừng ở Si bảy, tay phải nét chạy nhỏ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n34
  cau: "Bảng, câu 2 mở đầu (ô 13–15): như ô 1, hòa âm trượt nhanh hơn."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n35
  cau: "Bảng, cao trào (ô 16–18): chữ stretto ở ô 16, đỉnh f ở ô 17, nhỏ dần ở ô 18; cao trào duy nhất."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n36
  cau: "Bảng, lắng xuống (ô 19–22): trở lại p; smorzando ở ô 21."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n37
  cau: "Bảng, im lặng (ô 23): hợp âm sáu tăng kiểu Đức rồi dấu lặng có dấu ngân."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n38
  cau: "Bảng, kết (ô 24–25): ba hợp âm cuối pp, át rồi chủ Mi thứ."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n40
  cau: "Bảng hòa âm tay trái ô 1–5: Sol–Si–Mi; Fa♯–La–Mi → Fa♯–La–Rê♯; Fa–La–Rê♯ → Fa–La–Rê → Fa–Sol♯–Rê; Mi–Sol♯–Rê → Mi–Sol–Rê → Mi–Sol–Đô♯; Mi–Sol–Đô → Mi–Fa♯–Đô."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n41
  cau: Hợp âm ô 1 (Sol–Si–Mi) là Mi thứ thể đảo một.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n42
  cau: Từ hợp âm thứ hai trở đi, mỗi lần đổi chỉ một bè đi xuống nửa cung, khi ở bè trên, khi ở bè dưới, khi ở bè giữa.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n43
  cau: Nhiều hợp âm trên đường đi không thuộc giọng nào rõ ràng; chúng tồn tại vì đường đi của từng bè, nên bài nghe như trượt dần xuống.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n46
  cau: "Nét chạy ở ô 12: tay trái nghỉ, tay phải một mình."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n47
  cau: "Cao trào ô 16–18: stretto, nốt láy quanh, nhảy lên Đô cao, f."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n57
  cau: Largo là rộng và chậm; bài viết ở nhịp 2/2.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n60
  cau: Gần như cả bài ở p và pp; chỉ có một chữ f, ở ô 17; từ ô 21 (smorzando) mọi thứ tắt dần; ba hợp âm cuối pp.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n61
  cau: Smorzando là tắt dần.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n62
  cau: Stretto là dồn lên.
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n63
  cau: Các ấn bản ghi bàn đạp không giống nhau ở mọi ô.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n65
  cau: Ô 23 dừng trên một hợp âm căng rồi lặng hẳn, có dấu ngân.
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n67
  cau: Ấn bản Quốc gia Ba Lan của Jan Ekier được soạn từ bản viết tay và các bản in đầu tiên; các bản thế kỷ 19 có thể khác ở dấu luyến, bàn đạp và chỉ dẫn sắc thái.
  loai: lich-su
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n70
  cau: "Học tiếp, cùng tác giả: Prélude Si thứ Op. 28 số 6, giai điệu nằm ở tay trái."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n75
  cau: "Câu hỏi 1: cao trào duy nhất ở ô 16–18, đỉnh f ở ô 17; chữ stretto ở ô 16; chỉ có một chữ f."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n76
  cau: "Câu hỏi 2: hợp âm tay trái mỗi lần thường chỉ một bè đi xuống nửa cung; nhiều hợp âm không thuộc giọng nào rõ ràng."
  loai: cau-truc
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n77
  cau: "Câu hỏi 3: Largo trong nhịp 2/2: rộng và chậm, nghĩ hai phách lớn mỗi ô."
  loai: dinh-nghia
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n79
  cau: "Nguồn: Jean-Jacques Eigeldinger, Chopin: Pianist and Teacher as Seen by His Pupils, Cambridge University Press, 1986."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n80
  cau: "Nguồn: Jim Samson, The Music of Chopin, Routledge & Kegan Paul, 1985."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n81
  cau: "Nguồn: Thomas Higgins (biên tập), Chopin: Preludes, Op. 28 (Norton Critical Scores), W. W. Norton, 1973."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n82
  cau: "Nguồn: Henle HN 882 (lời tựa, trang sản phẩm) và niên biểu năm 1849 của Viện Fryderyk Chopin."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n83
  cau: "Nguồn: bản nhạc IMSLP; bảng hòa âm đối chiếu với bản Peters 1879 qua bản chép LilyPond của Mutopia Project."
  loai: ten
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n66
  cau: Khoảng lặng là một phần của âm nhạc; đừng nhấc tay khỏi đàn trong lúc lặng.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n5
  cau: Bài học về hòa âm trượt từng nửa cung, chơi hợp âm khẽ và đều, và sức nặng của im lặng.
  loai: khuyen-tap
- trang: piano/tac-pham/chopin-prelude-mi-thu
  id: n54
  cau: Cách tập bài tập 2 (đỉnh f bằng sức nặng cánh tay, giữ dấu lặng đủ dài).
  loai: khuyen-tap
- trang: piano/tac-pham/fur-elise
  id: n1
  cau: 'Tiêu đề: "Beethoven: Für Elise, WoO 59".'
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n2
  cau: "Mô tả và câu mở đầu: Für Elise là một trong những tác phẩm nổi tiếng nhất của Beethoven, nhưng bài không dừng ở tám ô nhịp đầu."
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n3
  cau: "Học trọn bài, bạn gặp ba nhân vật rất khác nhau: chủ đề La thứ trôi như nước, đoạn Fa trưởng duyên dáng với những đường chạy nhanh, đoạn kịch tính trên nốt La trầm gõ liên tục."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n4
  cau: Ở chủ đề, dòng móc kép đi từ tay trái sang tay phải.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n7
  cau: Ba tính cách trong ba phút.
  loai: so-lieu
- trang: piano/tac-pham/fur-elise
  id: n8
  cau: "Rondo thu nhỏ: chủ đề vang lên ba lần, xen giữa là hai đoạn tương phản."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n10
  cau: "Đi hết bài: tám ô đầu chỉ là một phần nhỏ của bài."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n11
  cau: Năm 1810 Beethoven 39 tuổi.
  loai: nam
- trang: piano/tac-pham/fur-elise
  id: n12
  cau: Năm 1810 cùng thời với nhạc cho vở kịch Egmont.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n13
  cau: Năm 1810 thính giác của Beethoven đã suy giảm nhiều.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n14
  cau: Câu "ở giữa những năm sáng tác dồi dào nhất".
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n15
  cau: Bên cạnh sonata và giao hưởng, Beethoven viết nhiều tiểu phẩm ngắn để tặng, mà ông gọi là bagatelle; Für Elise là một bài như thế.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n16
  cau: 'Nghĩa của chữ bagatelle: "chuyện vặt".'
  loai: dinh-nghia
- trang: piano/tac-pham/fur-elise
  id: n18
  cau: Beethoven không xuất bản Für Elise lúc sinh thời.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n19
  cau: Bài chỉ đến với công chúng năm 1867, khi Ludwig Nohl in lại từ một bản viết tay mà ông được xem; bản ấy về sau thất lạc.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n20
  cau: Các ấn bản ngày nay chủ yếu dựa vào bản in của Nohl, cùng những trang phác thảo còn lại của Beethoven.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n21
  cau: Elise là ai? Không ai biết chắc; chưa giả thuyết nào được chứng minh.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n22
  cau: "Giả thuyết Therese Malfatti: học trò mà Beethoven được cho là muốn cầu hôn khoảng năm 1810."
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n23
  cau: Theo giả thuyết này, Nohl đã đọc nhầm chữ "Therese" trong nét chữ khó đọc của Beethoven thành "Elise".
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n24
  cau: "Giả thuyết Elisabeth Röckel, về sau là vợ nhà soạn nhạc Johann Nepomuk Hummel: giả thuyết của Klaus Martin Kopitz, đã bị Michael Lorenz phản bác."
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n25
  cau: "Giả thuyết Elise (Lisette) Barensfeld, có thể là học trò piano của Therese Malfatti năm 1810: giả thuyết của Rita Steblin."
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n26
  cau: Bản nhạc là một món quà nhỏ, thân mật, không phải một tác phẩm hòa nhạc đồ sộ.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n29
  cau: Đoạn chuyển về chủ đề lần cuối là hợp âm rải đi lên, rồi chuỗi nửa cung đi xuống.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n30
  cau: Poco moto nghĩa là "hơi chuyển động"; chủ đề không cần chậm và mơ màng.
  loai: dinh-nghia
- trang: piano/tac-pham/fur-elise
  id: n31
  cau: Fortepiano là loại đàn piano thời Beethoven; nghe để biết tiếng đàn và bàn đạp khác piano hiện đại thế nào.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n33
  cau: "Theo dõi khi nghe, đoạn A câu a: chủ đề Mi–Rê♯ ở pp; hợp âm rải chuyền giữa hai tay như một dòng nhạc; câu kết ở nốt La."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n34
  cau: Câu a nhắc lại.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n35
  cau: "Câu b và câu a: câu b ngắn ở Đô trưởng, rồi một chuỗi Mi–Rê♯ kéo về câu a."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n36
  cau: "Câu b và câu a nhắc lại: đoạn A khép lại ở La thứ."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n37
  cau: "Đoạn B (Fa trưởng): giai điệu có nốt láy, nhịp chấm dôi trên hợp âm rải tay trái; sáng và ấm hơn."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n38
  cau: "Đường chạy móc ba: hai đường chạy trên hòa âm Đô, rồi chuỗi Mi–Rê♯ dẫn về chủ đề."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n39
  cau: "Đoạn A trở lại: chủ đề, lần này không nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n40
  cau: "Đoạn C: tay trái gõ nốt La trầm liên tục, tay phải đánh hợp âm; bè trầm bò lên từng nửa cung La – Si♭ – Si – Đô."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n41
  cau: "Đoạn chuyển: hợp âm rải La thứ đi lên qua ba quãng tám (pp), rồi một chuỗi nửa cung đi xuống."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n42
  cau: "Đoạn A lần cuối: chủ đề, kết thật nhẹ ở La."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n43
  cau: "Bảng Cấu trúc, A: La thứ (câu giữa sang Đô trưởng); chủ đề Mi–Rê♯ trên hợp âm rải chuyền giữa hai tay; câu a nhắc lại; câu b ngắn ở Đô trưởng, chuỗi Mi–Rê♯ kéo về câu a; cặp b + a cũng nhắc lại; bắt đầu pp, mỗi câu kết ở nốt La."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n44
  cau: "Bảng Cấu trúc, B: Fa trưởng; giai điệu có nốt láy, nhịp chấm dôi trên hợp âm rải tay trái; hai đường chạy móc ba trên hòa âm Đô (át của Fa); chuỗi Mi–Rê♯ dẫn về A."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n45
  cau: "Bảng Cấu trúc, A trở lại: La thứ, không nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n46
  cau: "Bảng Cấu trúc, C: quanh Rê thứ và La thứ; tay trái gõ La trầm liên tục bằng móc kép, tay phải hợp âm; bè trầm bò lên La – Si♭ – Si – Đô."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n47
  cau: "Bảng Cấu trúc, chuyển: La thứ; hợp âm rải La thứ đi lên qua ba quãng tám thành chùm ba móc kép, rồi chuỗi nửa cung đi xuống; bắt đầu pp."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n48
  cau: "Bảng Cấu trúc, A lần cuối: La thứ, kết ở La."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n50
  cau: "Khối 1: nhịp lấy đà và tám ô đầu, ô 8 theo lần chơi thứ nhất; đối chiếu với bản Breitkopf & Härtel năm 1888."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n51
  cau: "Ô 2: tay phải đánh La cùng lúc với La trầm của tay trái, tay trái rải La–Mi–La, rồi tay phải đi tiếp Đô–Mi–La; sáu móc kép ấy là một dòng nhạc chia cho hai tay."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n52
  cau: "Chỗ khó, cặp Mi–Rê♯: hai ngón kề nhau lặp lại nhanh, ở sắc thái nhỏ."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n53
  cau: "Chỗ khó, hợp âm rải tay trái: khoảng cách một quãng tám (La2–Mi3–La3)."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n54
  cau: "Chỗ khó, đường chạy móc ba ở đoạn B: một dòng nốt đi lên xen kẽ với nốt Sol cao lặp lại."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n55
  cau: "Chỗ khó, nốt La lặp lại ở đoạn C: nhiều ô móc kép trên cùng một phím, dễ mỏi, căng, to dần ngoài ý muốn; động tác nhỏ từ cổ tay, đổi ngón 3–2–1 hay giữ một ngón."
  loai: quy-tac
- trang: piano/tac-pham/fur-elise
  id: n56
  cau: "Chỗ khó, hợp âm tay phải ở đoạn C: ba, bốn nốt phải vào cùng lúc."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n57
  cau: "Chỗ khó, hợp âm rải đi lên và chuỗi nửa cung: đổi thế tay mỗi ô."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n58
  cau: Chuỗi nửa cung dùng ngón 3 cho phím đen, ngón 1 cho phím trắng (1–2 ở chỗ hai phím trắng liền nhau).
  loai: quy-tac
- trang: piano/tac-pham/fur-elise
  id: n59
  cau: "Chỗ khó, bàn đạp: giữ qua ô Mi–Rê♯ thì hai hòa âm nhòe vào nhau."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n64
  cau: "Bài tập 2 luyện kiểu bàn tay của đường chạy ở đoạn B: ngón 5 nhắc lại một nốt cao, các ngón còn lại đi lên đi xuống bên dưới."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n68
  cau: "Bản nhạc ghi rất ít chỉ dẫn sắc thái: bản Breitkopf & Härtel 1888 chỉ có pp ở đầu bài và ở hợp âm rải đi lên."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n70
  cau: Bản Breitkopf & Härtel 1888 ghi bàn đạp cho từng ô có hợp âm rải tay trái ở chủ đề, nhả trước ô Mi–Rê♯.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n72
  cau: Ở đoạn B có hai nốt láy nhỏ trước nốt Đô đầu tiên, một nốt appoggiatura và những chùm móc ba nhỏ.
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n74
  cau: Vì bản viết tay đã mất, các ấn bản có thể khác nhau ở vài chi tiết như dấu luyến.
  loai: lich-su
- trang: piano/tac-pham/fur-elise
  id: n77
  cau: "Lỗi thường gặp, đoạn C: tay trái cứng và to dần, mỏi trước khi hết đoạn."
  loai: quy-tac
- trang: piano/tac-pham/fur-elise
  id: n80
  cau: Op. 33 và Op. 119 là các tập bagatelle của Beethoven.
  loai: danh-muc
- trang: piano/tac-pham/fur-elise
  id: n83
  cau: "Câu hỏi 1: Für Elise là rondo nhỏ A–B–A–C–A; chủ đề Mi–Rê♯ vang lên ba lần, xen giữa là đoạn Fa trưởng (B) và đoạn kịch tính trên nốt La trầm (C)."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n84
  cau: "Câu hỏi 2: Poco moto nghĩa là hơi chuyển động."
  loai: dinh-nghia
- trang: piano/tac-pham/fur-elise
  id: n85
  cau: "Câu hỏi 3: ở chủ đề, nhấn bàn đạp sau nốt trầm của mỗi ô hợp âm rải, nhả hẳn trước ô Mi–Rê♯."
  loai: cau-truc
- trang: piano/tac-pham/fur-elise
  id: n87
  cau: "Nguồn: Henle HN 1347 (biên tập Joanna Cobb Biermann), lời nói đầu và bình chú."
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n88
  cau: "Nguồn: Ludwig van Beethoven. Thematisch-bibliographisches Werkverzeichnis, Henle 2014 (danh mục, nơi đặt ký hiệu WoO), mục WoO 59."
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n89
  cau: "Nguồn: Beethoven-Haus Bonn, trang tác phẩm WoO 59 và tờ phác thảo BH 116."
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n90
  cau: "Nguồn: bản nhạc IMSLP; đoạn trích đối chiếu với bản Breitkopf & Härtel 1888 qua bản chép LilyPond của Mutopia; link tài liệu tham khảo."
  loai: ten
- trang: piano/tac-pham/fur-elise
  id: n76
  cau: Lỗi thường gặp (tám dòng).
  loai: khuyen-tap
- trang: piano/tac-pham/fur-elise
  id: n65
  cau: Kế hoạch 6 tuần, tốc độ ghi theo nốt móc đơn.
  loai: khuyen-tap
- trang: piano/tac-pham/fur-elise
  id: n69
  cau: Gợi ý sắc thái cho A, B, C và đoạn chuyển.
  loai: khuyen-tap
- trang: piano/tac-pham/grieg-arietta
  id: n1
  cau: Arietta (Aria nhỏ) mở đầu cho cả 66 Lyric Pieces của Grieg (câu mở đầu và mô tả trang).
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n2
  cau: Arietta dài 23 ô nhịp, khoảng một phút rưỡi.
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n4
  cau: Giai điệu nằm ở bè trên; ngay bên dưới, cũng trong tay phải, là dòng móc kép của bè trong.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n7
  cau: Hòa âm đổi trên những nốt trầm ngân dài.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n9
  cau: Chỉ một chủ đề, nói hai lần, khép lại bằng một ô.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n11
  cau: Đây là bài đầu tiên trong 66 bài, và giai điệu của nó còn trở lại ở bài cuối cùng, 34 năm sau.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n13
  cau: Edvard Grieg sinh ở Bergen, Na Uy.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n14
  cau: Grieg học ở Nhạc viện Leipzig (1858–1862), ngôi trường do Mendelssohn sáng lập.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n15
  cau: "Ở Leipzig, truyền thống tiểu phẩm piano Đức đang rất sống: Lieder ohne Worte của Mendelssohn, các tập nhạc nhỏ của Schumann."
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n16
  cau: Grieg mang truyền thống ấy về phương Bắc và pha vào đó giai điệu, nhịp điệu của âm nhạc dân gian Na Uy.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n18
  cau: Tập Op. 12 được viết khoảng 1866–1867 và in năm 1867.
  loai: nam
- trang: piano/tac-pham/grieg-arietta
  id: n19
  cau: "Tám bài trong tập: Arietta, Vals, Vægtersang (Bài ca người gác đêm, gợi hứng từ Macbeth), Alfedans (Điệu múa yêu tinh), Folkevise (Dân ca), Norsk (Điệu Na Uy), Albumblad (Trang album), Fædrelandssang (Bài ca quê hương)."
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n20
  cau: Chỉ một năm sau, năm 1868, Grieg viết Concerto cho piano La thứ.
  loai: nam
- trang: piano/tac-pham/grieg-arietta
  id: n22
  cau: Trong 34 năm tiếp theo, ông viết thêm chín tập; cả bộ gồm 66 bài trong mười tập, gọi chung là Lyriske stykker.
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n23
  cau: Giai điệu của Arietta là một trong những giai điệu Grieg yêu thích nhất.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n24
  cau: Ở bài cuối cùng của tập cuối, Op. 71 số 7 Efterklang (Dư âm; tên tiếng Anh Remembrances), viết và in năm 1901, ông cho giai điệu Arietta trở lại, lần này thành một điệu valse.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n25
  cau: 'Arietta là tiếng Ý, nghĩa là "aria nhỏ": một bài hát ngắn.'
  loai: dinh-nghia
- trang: piano/tac-pham/grieg-arietta
  id: n28
  cau: Trong chủ đề có bốn nốt giai điệu lặp lại cùng một cao độ.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n29
  cau: "Ở ô 9–12, cùng một hình kết vang hai lần: lần đầu ở Sol thứ và rẽ hướng (kết lừa), lần sau về Mi♭ trưởng trọn vẹn (kết trọn)."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n30
  cau: "So sánh ít nhất hai bản thu: Emil Gilels, người mở đầu tuyển tập Lyric Pieces của mình (Deutsche Grammophon) bằng Arietta, và Einar Steen-Nøkleberg, nghệ sĩ Na Uy đã thu trọn các tác phẩm piano của Grieg."
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n33
  cau: "Theo dõi, chủ đề a (ô 1–4): giai điệu hát trên dòng móc kép; bốn nốt lặp cùng cao độ; nốt trầm ngân dài."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n34
  cau: "Theo dõi, phát triển b (ô 5–8): chủ đề đi tiếp, câu nhạc chưa dừng."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n35
  cau: "Theo dõi, hình kết lần 1 (ô 9–10): Sol thứ, kết lừa."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n36
  cau: "Theo dõi, hình kết lần 2 (ô 11–12): cùng hình ấy, về Mi♭ trưởng, kết trọn; đoạn A khép lại."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n37
  cau: "Theo dõi, chủ đề trở lại a (ô 13–16): giai điệu có thêm nốt hoa mỹ nhỏ; nốt chủ ở bè trầm xuống thấp hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n38
  cau: "Theo dõi, b' (ô 17–18): lần này chỉ hai ô."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n39
  cau: "Theo dõi, nhóm kết c' (ô 19–22): hình kết quen thuộc trở lại lần cuối."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n40
  cau: "Theo dõi, coda (ô 23): một mảnh của chủ đề; bài tắt như chìm vào giấc ngủ."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n41
  cau: "Theo phân tích của PTNA, Arietta là một hình thức một phần mở rộng, xây trên đúng một chủ đề: A (12 ô), A' có biến đổi (10 ô), một ô coda; mỗi lần nói gồm chủ đề (a), phát triển (b), nhóm kết (c)."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n42
  cau: "Bảng, A · a (ô 1–4): chủ đề ở Mi♭ trưởng, bốn nốt lặp cùng cao độ, nốt trầm ngân dài; hai nốt dựa cùng lúc rơi vào một hợp âm át chín thiếu nốt gốc."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n43
  cau: "Bảng, A · b (ô 5–8): phát triển chủ đề."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n44
  cau: "Bảng, A · c (ô 9–12): ô 9–10 Sol thứ, kết lừa; ô 11–12 Mi♭ trưởng, kết trọn."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n45
  cau: "Bảng, A' · a (ô 13–16): chủ đề trở lại, thêm nốt hoa mỹ; nốt chủ ở bè trầm thấp hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n46
  cau: "Bảng, A' · b' (ô 17–18): phát triển rút gọn còn hai ô."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n47
  cau: "Bảng, A' · c' (ô 19–22): nhóm kết trở lại."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n48
  cau: "Bảng, coda (ô 23): một mảnh của chủ đề; bài khép lại đột ngột, như chìm vào giấc ngủ."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n50
  cau: Chủ đề nói hai lần; hình kết của ô 9–10 xuất hiện tất cả bốn lần.
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n53
  cau: "Bàn đạp nối: đánh hòa âm mới, rồi mới nhả và nhấn lại ngay."
  loai: quy-tac
- trang: piano/tac-pham/grieg-arietta
  id: n60
  cau: "Bài tập 3: ô 1–2 sau hợp âm Rê bảy (át của Sol thứ), tai chờ Sol thứ nhưng nhận được Mi♭ trưởng: kết lừa; ô 3–4 La♭ trưởng, Si♭ bảy, rồi Mi♭ trưởng: kết trọn."
  loai: dinh-nghia
- trang: piano/tac-pham/grieg-arietta
  id: n64
  cau: PTNA ước tính cả bài dài khoảng một phút rưỡi.
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n66
  cau: 'Poco andante e sostenuto: "hơi andante", và "ngân giữ".'
  loai: dinh-nghia
- trang: piano/tac-pham/grieg-arietta
  id: n67
  cau: "Theo gợi ý của PTNA: chọn tốc độ sao cho nốt trầm nối qua hai ô vẫn còn nghe được, và bốn nốt lặp vẫn có chỗ để tạo hình."
  loai: so-lieu
- trang: piano/tac-pham/grieg-arietta
  id: n70
  cau: "Nếu ngón tay trái còn giữ phím, nốt ấy vẫn ngân dù bàn đạp đổi; nửa bàn đạp: nhả nông và nhanh, dây trầm rung mạnh hơn nên một phần tiếng trầm còn lại."
  loai: quy-tac
- trang: piano/tac-pham/grieg-arietta
  id: n73
  cau: PTNA mô tả kết của bài là đột ngột, như chìm vào giấc ngủ, và khuyên chơi ô cuối như thể âm thanh thật sự biến mất.
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n75
  cau: "Ấn bản: dùng một bản in đáng tin, ví dụ bản Urtext của Henle; các bản in cũ trên IMSLP hữu ích để đối chiếu."
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n78
  cau: "Học tiếp, cùng tập Op. 12: Vals (số 2) và Alfedans (Điệu múa yêu tinh, số 4); về sau Efterklang Op. 71 số 7."
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n80
  cau: "Học tiếp: Schumann Träumerei (khoảng Grade 6): giai điệu, bè trong và bè trầm đan vào nhau trong cả hai tay."
  loai: cap-do
- trang: piano/tac-pham/grieg-arietta
  id: n82
  cau: "Câu hỏi 1: giai điệu Arietta trở lại ở bài cuối cùng, Op. 71 số 7 Efterklang, dưới dạng một điệu valse; Grieg dùng lại giai điệu này để khép lại cả bộ năm 1901, 34 năm sau tập đầu tiên."
  loai: lich-su
- trang: piano/tac-pham/grieg-arietta
  id: n83
  cau: "Câu hỏi 2: từ ô 13 chủ đề trở lại (đoạn A'), thêm nốt hoa mỹ, nốt chủ ở bè trầm thấp hơn một quãng tám; A (ô 1–12), A' (ô 13–22), một ô coda."
  loai: cau-truc
- trang: piano/tac-pham/grieg-arietta
  id: n85
  cau: "Câu hỏi 4: giữ phím nốt trầm bằng ngón tay trái khi đổi bàn đạp, hoặc dùng nửa bàn đạp; khi ngón còn giữ phím, dây của nốt ấy vẫn rung."
  loai: quy-tac
- trang: piano/tac-pham/grieg-arietta
  id: n86
  cau: "Nguồn: PTNA Piano Music Encyclopedia, mục Arietta Op. 12-1: hình thức, hòa âm ô 9–12, tốc độ, đoạn trở lại, ô cuối."
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n87
  cau: "Nguồn: IMSLP (Op. 12, Op. 71) và Britannica (Edvard Grieg)."
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n88
  cau: "Nguồn: Joseph Banowetz, The Pianist's Guide to Pedaling, Indiana University Press, 1985: bàn đạp nối và nửa bàn đạp."
  loai: ten
- trang: piano/tac-pham/grieg-arietta
  id: n84
  cau: "Câu hỏi 3: chơi riêng giai điệu, thêm móc kép bấm câm, rồi cho móc kép kêu khẽ; dồn trọng lượng về ngón út."
  loai: khuyen-tap
- trang: piano/tac-pham/grieg-arietta
  id: n71
  cau: Một lần không bàn đạp; làm theo dấu bàn đạp trong bản nhạc và để tai quyết định.
  loai: khuyen-tap
- trang: piano/tac-pham/grieg-arietta
  id: n68
  cau: Chậm quá thì nốt trầm tắt và câu nhạc đứt; nhanh quá thì dòng móc kép thành bài tập ngón.
  loai: khuyen-tap
- trang: piano/tac-pham/satie-gymnopedie
  id: n1
  cau: "Ít nốt, chậm, lặp lại: Gymnopédie số 1 trông như một bài dễ, đọc hết nốt được trong một buổi (câu mở đầu và mô tả trang)."
  loai: cap-do
- trang: piano/tac-pham/satie-gymnopedie
  id: n2
  cau: Bài kéo dài mấy phút liền.
  loai: so-lieu
- trang: piano/tac-pham/satie-gymnopedie
  id: n5
  cau: Tay trái đánh một nốt trầm rồi nhảy lên một hợp âm, gần như ô nào cũng vậy.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n7
  cau: Cả bài gần như ở p và pp.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n9
  cau: "Hợp âm bảy trưởng, màu điệu thức, sự lặp lại không phát triển: những hợp âm còn mới lạ năm 1888 cho thấy Satie là người đi tiên phong về hòa âm."
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n11
  cau: "Dễ học thuộc, dễ biểu diễn: lượt hai gần như lặp lại lượt một."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n12
  cau: Năm 1888, Satie hơn hai mươi tuổi, vừa rời nhà cha mẹ và sống ở khu Montmartre của Paris, giữa giới nghệ sĩ và các quán cabaret.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n13
  cau: "Âm nhạc châu Âu lúc ấy đang say mê sự đồ sộ của Wagner: dàn nhạc khổng lồ, hòa âm đặc, cảm xúc dâng trào."
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n14
  cau: "Gymnopédies được viết thật giản dị: vài lớp nhạc mỏng, một giai điệu đơn giản, không cao trào, không phát triển."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n15
  cau: Tên gọi gợi đến gymnopaedia, một lễ hội ở Sparta thời cổ Hy Lạp có những điệu múa của các chàng trai trẻ.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n16
  cau: Những lời Satie tự giải thích về bài (ông nói mình có cảm hứng khi đọc tiểu thuyết Salammbô của Flaubert) thường đầy mỉa mai.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n18
  cau: Bộ ba bài trở nên nổi tiếng một phần nhờ Debussy, bạn của Satie, người về sau phối khí cho dàn nhạc hai bài số 1 và số 3.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n19
  cau: Ngày nay ba bài Gymnopédie là những bản piano nổi tiếng nhất của Satie.
  loai: lich-su
- trang: piano/tac-pham/satie-gymnopedie
  id: n21
  cau: Bốn ô đầu chỉ có tay trái; giai điệu vào ở phách thứ hai của ô 5; đoạn giữa có các nốt Đô♮ và Fa♮.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n23
  cau: Aldo Ciccolini và Pascal Rogé, cả hai thu nhiều nhạc piano của Satie.
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n24
  cau: Reinbert de Leeuw nổi tiếng với tốc độ cực chậm.
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n25
  cau: Cùng một bài mà độ dài các bản thu chênh nhau rất nhiều.
  loai: so-lieu
- trang: piano/tac-pham/satie-gymnopedie
  id: n27
  cau: "Theo dõi, dạo đầu (4 ô): chỉ tay trái, nốt trầm rồi hợp âm; Sol bảy trưởng và Rê bảy trưởng đung đưa."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n28
  cau: "Theo dõi, câu 1: giai điệu vào ở phách 2 của ô 5; nốt Fa♯ ngân suốt bốn ô cuối câu."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n29
  cau: "Theo dõi, câu 2: mở đầu như câu 1 rồi rẽ hướng; lần đầu tiên hòa âm rời khỏi cặp Sol – Rê."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n30
  cau: "Theo dõi, đoạn giữa: giai điệu lên cao hơn, Đô♮ và Fa♮ đổi màu; bè trầm chủ yếu giữ nốt Rê."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n31
  cau: "Theo dõi, kết lượt 1: dừng ở hợp âm Rê trưởng, nhưng bài còn tiếp."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n32
  cau: "Theo dõi, lượt 2: dạo đầu trở lại, mọi thứ nhắc lại gần như nguyên văn."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n33
  cau: "Theo dõi, đoạn giữa lượt 2: Đô♮ và Fa♮ trở lại."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n34
  cau: "Theo dõi, kết lượt 2: Fa♮ thay cho Fa♯, kết ở hợp âm Rê thứ; hợp âm cuối tự tắt."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n35
  cau: "Bảng Cấu trúc, dạo đầu, 4 ô: nốt trầm Sol rồi hợp âm Si – Rê – Fa♯ (cả ô là Sol bảy trưởng); nốt trầm Rê rồi hợp âm La – Đô♯ – Fa♯ (Rê bảy trưởng); lặp lại."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n36
  cau: "Bảng, câu 1, 8 ô: Fa♯ – La, Sol – Fa♯ – Đô♯, Si – Đô♯ – Rê, La, rồi Fa♯ ngân suốt bốn ô."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n37
  cau: "Bảng, câu 2, 9 ô: mở đầu như câu 1 rồi rẽ hướng."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n38
  cau: "Bảng, đoạn giữa, 10 ô: giai điệu lên cao hơn, có Đô♮ và Fa♮; bè trầm chủ yếu giữ Rê."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n39
  cau: "Bảng, kết lượt 1, 8 ô: câu kết, dừng ở Rê trưởng."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n40
  cau: "Bảng, lượt 2, 31 ô: nhắc lại từ đầu gần như nguyên văn; bản in gốc viết ra đầy đủ, không dùng dấu nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n41
  cau: "Bảng, kết lượt 2, 8 ô: Fa♮ thay cho Fa♯; kết ở Rê thứ."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n42
  cau: "Hai hợp âm tay trái của bốn ô đầu, đúng quãng tám: Si3 Rê4 Fa♯4 và La3 Đô♯4 Fa♯4 (thông số notes của ::cong-cu piano); nốt trầm Sol và Rê nằm thấp hơn."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n43
  cau: Hai hợp âm chỉ khác nhau hai nốt (Si → La, Rê → Đô♯); Fa♯ giữ nguyên.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n44
  cau: "Bước nhảy tay trái: từ nốt trầm lên hợp âm có khi xa hơn một quãng tám."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n47
  cau: Hóa biểu có Fa♯, Đô♯ nên Fa♮, Đô♮ ở đoạn giữa và kết lượt 2 rất dễ bị bỏ qua.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n55
  cau: Lent là chậm, nhưng vẫn là nhịp ba.
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n57
  cau: Douloureux là "đau đớn"; ở đây là một nỗi buồn xa xăm, kiềm chế.
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n58
  cau: "Sắc thái hẹp: bản in gốc ghi pp ở đầu bài và ở hai câu giai điệu, p ở đoạn giữa, và chỉ một chữ f mỗi lượt, dưới nốt Fa♯ ngân dài của câu 1 (ô 9 và ô 48)."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n59
  cau: Bàn đạp vang đổi mỗi ô, ở nốt trầm; nốt trầm ghi là nốt trắng chấm dôi ngân cả ô, tay trái phải rời nó để đánh hợp âm nên chỉ bàn đạp giữ được nó.
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n60
  cau: Una corda là bàn đạp trái, làm tiếng đàn mềm và mờ đi.
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n62
  cau: "Hợp âm ở phách 2 là nốt trắng: giữ nó đến hết ô."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n65
  cau: "Học tiếp, cùng tác giả: Gymnopédie số 2 và số 3, Gnossienne số 1."
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n69
  cau: "Câu hỏi 1: hai lượt chỉ khác ở phần kết: lượt 1 dừng ở Rê trưởng, lượt 2 có Fa♮ và kết ở Rê thứ; bản in gốc viết ra đầy đủ, không dùng dấu nhắc lại."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n70
  cau: "Câu hỏi 2: Lent et douloureux nghĩa là chậm và đau đớn."
  loai: dinh-nghia
- trang: piano/tac-pham/satie-gymnopedie
  id: n71
  cau: "Câu hỏi 2, lời giải thích: đau đớn ở đây là nỗi buồn xa xăm, kiềm chế; sắc thái hẹp, gần như chỉ pp và p."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n72
  cau: "Câu hỏi 3: nốt trầm ghi là nốt trắng chấm dôi ngân cả ô, nhưng tay trái phải rời nó để đánh hợp âm ở phách 2."
  loai: cau-truc
- trang: piano/tac-pham/satie-gymnopedie
  id: n74
  cau: "Nguồn: Robert Orledge, Satie the Composer, Cambridge University Press, 1990."
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n75
  cau: "Nguồn: Steven Moore Whiting, Satie the Bohemian: From Cabaret to Concert Hall, Oxford University Press, 1999."
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n76
  cau: "Nguồn: G. Henle Verlag, Satie: Gymnopédies (HN 1072), lời tựa của Ulrich Krämer (2011)."
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n77
  cau: "Nguồn: bản nhạc IMSLP; nốt nhạc, số ô và chỉ dẫn được đối chiếu với bản in gốc (bản quét trên Wikimedia Commons)."
  loai: ten
- trang: piano/tac-pham/satie-gymnopedie
  id: n53
