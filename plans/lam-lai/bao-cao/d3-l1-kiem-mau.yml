- trang: nhac-ly/05-dau-hoa
  id: n21
  cau: Dùng tên nào phụ thuộc vào giọng của bản nhạc.
  loai: quy-tac
  nguon:
    - ten: "Andre Mount, Fundamentals, Function, and Form (Milne Publishing, SUNY Geneseo, giáo trình mở), 5. Pitch (các mục về dấu hóa trên khuông: hiệu lực đến hết ô nhịp, dấu hóa nhắc, dấu thăng kép, giáng kép; mục đồng âm khác tên)"
      link: https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/5-pitch/
    - ten: Andre Mount, Fundamentals, Function, and Form (Milne Publishing, SUNY Geneseo, giáo trình mở), 6. Major Scales (mục 6.1, 6.2 Spelling a major scale)
      link: https://milnepublishing.geneseo.edu/fundamentals-function-form/chapter/6-major-scales-2/
    - ten: Open Music Theory, Minor Scales, Scale Degrees, and Key Signatures (cả các mục The Parallel and Relative Relationships, Minor Keys and the Circle of Fifths, Major or Minor?)
      link: https://viva.pressbooks.pub/openmusictheory/chapter/minor-scales/
  ket_qua_luot_1: dung
  ghi_chu: 'FFF 5: "The way a pitch is spelled—that is, the way it is labeled with a pitch-letter name—indicates how it sounds and functions in relation to the notes around it. D# and an Eb might refer to the same pitch, but in a musical context these labels might mean something very different." FFF 6.2: gam viết theo mỗi tên nốt một lần (nên phím đen giữa La và Si là Si♭ trong gam Fa trưởng). OMT Minor Scales: chọn đúng tên đồng âm theo hóa biểu ("only B♭ minor (five flats) is the relative minor of D♭ major ... because A♯ minor has a different key signature"). "Giọng" là cách trang nói về ngữ cảnh ấy.'
