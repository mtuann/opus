- trang: nhac-ly/02-khuong-nhac-khoa
  id: n9
  cau: Guitar cũng đọc khóa Sol, nhưng âm thực tế thấp hơn một quãng tám so với nốt viết.
  loai: quy-tac
  nguon:
    - ten: Open Music Theory, Reading Clefs
      link: https://viva.pressbooks.pub/openmusictheory/chapter/clefs/
    - ten: "Dolmetsch Online, Music Theory Online, bài 29: Musical Instrument Ranges & Names"
      link: https://www.dolmetsch.com/musictheory29.htm
  ket_qua_luot_1: dung
  ghi_chu: 'OMT Reading Clefs: "An octave treble clef with an “8” at the bottom of the clef indicates that notes should be sung or played an octave lower than written." OMT Reading Clefs: "Music for tenor vocalists, guitarists, and bassists often uses the octave treble clef." Dolmetsch bài 29: "Guitar | more ... sounds an octave below written pitch." Nhạc guitar ghi bằng khóa Sol (thường kèm số 8 dưới khóa) và nghe thấp hơn một quãng tám so với nốt viết.'
