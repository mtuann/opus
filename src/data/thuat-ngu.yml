  nhom: Nhạc lý (Anh – Việt)
- id: dotted-note
  thuat_ngu: dotted note
  nghia: 'Nốt chấm dôi: dấu chấm thêm một nửa trường độ'
  nhom: Nhạc lý (Anh – Việt)
- id: tie
  thuat_ngu: tie
  nghia: 'Dấu nối: nối các nốt cùng cao độ, chỉ đánh nốt đầu'
  nhom: Nhạc lý (Anh – Việt)
- id: triplet
  thuat_ngu: triplet
  nghia: 'Chùm ba: chia một phách nhịp đơn thành ba phần'
  nhom: Nhạc lý (Anh – Việt)
- id: syncopation
  thuat_ngu: syncopation
  nghia: 'Đảo phách: nhịp điệu đi ngược trọng âm của nhịp'
  nhom: Nhạc lý (Anh – Việt)
- id: anacrusis
  thuat_ngu: anacrusis
  nghia: 'Nhịp lấy đà: các nốt dẫn vào phách mạnh đầu tiên'
  ghi_chu: Tiếng Anh còn gọi upbeat
  nhom: Nhạc lý (Anh – Việt)
- id: polyrhythm
  thuat_ngu: polyrhythm
  nghia: 'Đa tiết tấu: nhiều tiết tấu tương phản vang cùng lúc'
  nhom: Nhạc lý (Anh – Việt)
- id: polychord
  thuat_ngu: polychord
  nghia: 'Hợp âm ghép: thường là hai hợp âm ba vang cùng lúc'
  nhom: Nhạc lý (Anh – Việt)
- id: harmonic-function
  thuat_ngu: harmonic function
  nghia: 'Chức năng hòa âm: vai trò của hợp âm trong tiến trình hòa âm'
  ghi_chu: 'Ba chức năng: chủ (T), át (D), hạ át (S, còn gọi predominant)'
  nhom: Nhạc lý (Anh – Việt)
- id: voice-leading
  thuat_ngu: voice leading
  nghia: 'Dẫn bè: cách các bè riêng tiến hành trong tác phẩm nhiều bè'
  nhom: Nhạc lý (Anh – Việt)
- id: common-tone
  thuat_ngu: common tone
  nghia: 'Nốt chung: âm được giữ lại giữa hai hợp âm liền nhau'
  nhom: Nhạc lý (Anh – Việt)
- id: doubling
  thuat_ngu: doubling
  nghia: 'Nhân đôi: một âm của hợp âm xuất hiện ở hai bè'
  ghi_chu: Trong lối basso continuo, hợp âm 5/3 và 6/4 thường nhân đôi âm bass
  nhom: Nhạc lý (Anh – Việt)
- id: satb
  thuat_ngu: SATB
  nghia: 'Bốn bè SATB: soprano, alto, tenor, bass'
  nhom: Nhạc lý (Anh – Việt)
- id: parallel-fifths
  thuat_ngu: parallel fifths and octaves
  nghia: 'Quãng 5, quãng 8 song song: hai quãng 5 (hay 8) đúng liền nhau giữa hai bè'
  ghi_chu: Bị cấm trong dẫn bè chặt vì làm mất tính độc lập của các bè
  nhom: Nhạc lý (Anh – Việt)
- id: contrary-motion
  thuat_ngu: contrary motion
  nghia: 'Chuyển động ngược: hai bè đi ngược hướng nhau'
  nhom: Nhạc lý (Anh – Việt)
- id: parallel-motion
  thuat_ngu: parallel motion
  nghia: 'Chuyển động song song: hai bè đi cùng hướng, giữ nguyên quãng'
  nhom: Nhạc lý (Anh – Việt)
- id: voice-crossing
  thuat_ngu: voice crossing
  nghia: 'Bắt chéo bè: bè trên tạm thời thấp hơn bè dưới, hoặc ngược lại'
  nhom: Nhạc lý (Anh – Việt)
- id: tendency-tone
  thuat_ngu: tendency tone
  nghia: 'Âm có xu hướng: bậc âm có khuynh hướng đi tới một số âm nhất định'
  nhom: Nhạc lý (Anh – Việt)
- id: cadential-six-four
  thuat_ngu: cadential 6/4
  nghia: 'Hợp âm 6/4 kết: 6/4 trên âm át ở bè trầm, giải về 5/3'
  ghi_chu: Có thể dùng trong kết trọn, kết chưa trọn hay kết nửa
  nhom: Nhạc lý (Anh – Việt)
- id: perfect-authentic-cadence
  thuat_ngu: perfect authentic cadence
  nghia: 'Kết trọn: V–I ở thể gốc, giai điệu kết ở chủ âm'
  ghi_chu: Viết tắt PAC
  nhom: Nhạc lý (Anh – Việt)
- id: imperfect-authentic-cadence
  thuat_ngu: imperfect authentic cadence
  nghia: 'Kết chưa trọn: V–I nhưng giai điệu không kết ở chủ âm'
  ghi_chu: Giai điệu thường kết ở bậc 3, đôi khi bậc 5; viết tắt IAC
  nhom: Nhạc lý (Anh – Việt)
- id: half-cadence
  thuat_ngu: half cadence
  nghia: 'Kết nửa: câu nhạc dừng ở hợp âm át (V)'
  nhom: Nhạc lý (Anh – Việt)
- id: plagal-cadence
  thuat_ngu: plagal cadence
  nghia: 'Kết plagal: hạ át (IV) giải về chủ (I)'
  ghi_chu: Còn gọi là amen cadence
  nhom: Nhạc lý (Anh – Việt)
- id: deceptive-cadence
  thuat_ngu: deceptive cadence
  nghia: 'Kết lừa: hợp âm át giải về hợp âm khác chủ'
  ghi_chu: Thường là V–vi; còn gọi interrupted cadence
  nhom: Nhạc lý (Anh – Việt)
- id: picardy-third
  thuat_ngu: Picardy third
  nghia: 'Quãng 3 Picardy: quãng 3 trưởng ở hợp âm cuối của bài giọng thứ'
  nhom: Nhạc lý (Anh – Việt)
- id: non-chord-tone
  thuat_ngu: non-chord tone
  nghia: 'Âm ngoài hợp âm: nốt tô điểm không thuộc hợp âm đang vang'
  ghi_chu: 'Ví dụ: nốt lướt, nốt thêu, nốt treo, nốt đón trước'
  nhom: Nhạc lý (Anh – Việt)
- id: passing-tone
  thuat_ngu: passing tone
  nghia: 'Nốt lướt: nốt tô điểm đi liền bậc giữa hai nốt ổn định'
  nhom: Nhạc lý (Anh – Việt)
- id: neighbor-tone
  thuat_ngu: neighbor tone
  nghia: 'Nốt thêu: rời nốt ổn định một bậc rồi trở về chính nốt đó'
  nhom: Nhạc lý (Anh – Việt)
- id: suspension
  thuat_ngu: suspension
  nghia: 'Nốt treo: âm của hợp âm trước được giữ sang hợp âm sau rồi giải xuống liền bậc'
  nhom: Nhạc lý (Anh – Việt)
- id: anticipation
  thuat_ngu: anticipation
  nghia: 'Nốt đón trước: vang sớm một âm của hợp âm kế tiếp'
  nhom: Nhạc lý (Anh – Việt)
- id: pedal-point
  thuat_ngu: pedal point
  nghia: 'Âm nền: âm (thường là chủ hay át) ngân ở bè trầm dưới các hợp âm thay đổi'
  nhom: Nhạc lý (Anh – Việt)
- id: tonicization
  thuat_ngu: tonicization
  nghia: 'Chủ âm hóa: nhấn tạm một hợp âm không phải chủ như thể nó là chủ'
  ghi_chu: Khác chuyển giọng ở chỗ thường không có kết ở giọng mới
  nhom: Nhạc lý (Anh – Việt)
- id: pivot-chord
  thuat_ngu: pivot chord
  nghia: 'Hợp âm chung: hợp âm thuộc cả giọng cũ lẫn giọng mới, dùng để chuyển giọng'
  nhom: Nhạc lý (Anh – Việt)
- id: modal-mixture
  thuat_ngu: modal mixture
  nghia: 'Pha trộn điệu thức: mượn hợp âm của giọng cùng tên (trưởng – thứ)'
  ghi_chu: Còn gọi modal borrowing; hợp âm như vậy gọi là borrowed chord
  nhom: Nhạc lý (Anh – Việt)
- id: neapolitan-chord
  thuat_ngu: Neapolitan chord
  nghia: 'Hợp âm Napoli: hợp âm trưởng trên bậc II hạ'
  ghi_chu: Gồm bậc 2 hạ, bậc 4 và bậc 6 hạ
  nhom: Nhạc lý (Anh – Việt)
- id: augmented-sixth-chord
  thuat_ngu: augmented sixth chord
  nghia: 'Hợp âm sáu tăng: có quãng 6 tăng giữa bậc 6 hạ và bậc 4 nâng'
  nhom: Nhạc lý (Anh – Việt)
- id: counterpoint
  thuat_ngu: counterpoint
  nghia: 'Đối âm: nghệ thuật kết hợp nhiều giai điệu độc lập'
  nhom: Nhạc lý (Anh – Việt)
- id: cantus-firmus
  thuat_ngu: cantus firmus
  nghia: 'Cantus firmus: giai điệu có sẵn làm nền để viết đối âm'
  ghi_chu: Tiếng Latinh, nghĩa đen là bài ca cố định
  nhom: Nhạc lý (Anh – Việt)
- id: species-counterpoint
  thuat_ngu: species counterpoint
  nghia: 'Đối âm theo loại: học đối âm chặt qua từng loại (species) tăng dần'
  nhom: Nhạc lý (Anh – Việt)
- id: harmonic-series
  thuat_ngu: harmonic series
  nghia: 'Chuỗi bồi âm: dãy âm bồi có tần số là bội nguyên của âm cơ bản'
  nhom: Nhạc lý (Anh – Việt)
- id: overtone
  thuat_ngu: overtone
  nghia: 'Âm bồi: âm cao hơn vang cùng lúc với âm cơ bản'
  nhom: Nhạc lý (Anh – Việt)
- id: fundamental
  thuat_ngu: fundamental
  nghia: 'Âm cơ bản: thành phần tần số thấp nhất của một âm phức hợp'
  nhom: Nhạc lý (Anh – Việt)
- id: timbre
  thuat_ngu: timbre
  nghia: 'Âm sắc: chất giọng riêng của một giọng hát hay nhạc cụ'
  ghi_chu: Còn gọi tone colour; chịu ảnh hưởng của các âm bồi nổi trội
  nhom: Nhạc lý (Anh – Việt)
- id: frequency
  thuat_ngu: frequency
  nghia: 'Tần số: số dao động lặp lại trong một đơn vị thời gian'
  nhom: Nhạc lý (Anh – Việt)
- id: equal-temperament
  thuat_ngu: equal temperament
  nghia: 'Bình quân: chia quãng 8 thành 12 nửa cung bằng nhau'
  nhom: Nhạc lý (Anh – Việt)
- id: just-intonation
  thuat_ngu: just intonation
  nghia: 'Quãng thuần: hệ lên dây tính các quãng theo quãng tự nhiên thuần'
  nhom: Nhạc lý (Anh – Việt)
- id: well-temperament
  thuat_ngu: well temperament
  nghia: 'Bình quân cải tiến: một lối lên dây tuần hoàn'
  ghi_chu: Còn gọi circular hay circulating temperament
  nhom: Nhạc lý (Anh – Việt)
- id: pythagorean-comma
  thuat_ngu: Pythagorean comma
  nghia: 'Dấu phẩy Pythagore: độ lệch khi chuỗi quãng 5 thuần vòng về nốt xuất phát'
  ghi_chu: Khoảng 0,24 nửa cung
  nhom: Nhạc lý (Anh – Việt)
- id: acoustic-beats
  thuat_ngu: beats
  nghia: 'Phách (tiếng đập): tiếng dao động khi hai âm hơi lệch tần số vang cùng lúc'
  ghi_chu: Phách thưa dần khi hai âm tiến tới đồng âm
  nhom: Nhạc lý (Anh – Việt)
- id: movement
  thuat_ngu: movement
  nghia: Chương
  ghi_chu: Một phần độc lập của tác phẩm lớn
  nhom: Hình thức và thể loại
- id: symphony
  thuat_ngu: symphony
  nghia: Giao hưởng
  ghi_chu: Thường 4 chương
  nhom: Hình thức và thể loại
- id: concerto
  thuat_ngu: concerto
  nghia: Concerto
  ghi_chu: Độc tấu cùng dàn nhạc
  nhom: Hình thức và thể loại
- id: sonata
  thuat_ngu: sonata
  nghia: Sonata
  ghi_chu: Tác phẩm cho một hoặc hai nhạc cụ
  nhom: Hình thức và thể loại
- id: sonata-form
  thuat_ngu: sonata form
  nghia: Hình thức sonata
  ghi_chu: Trình bày – phát triển – tái hiện
  nhom: Hình thức và thể loại
- id: exposition
  thuat_ngu: exposition
  nghia: Phần trình bày
  nhom: Hình thức và thể loại
- id: development
  thuat_ngu: development
  nghia: Phần phát triển
  nhom: Hình thức và thể loại
- id: recapitulation
  thuat_ngu: recapitulation
  nghia: Phần tái hiện
  nhom: Hình thức và thể loại
- id: cadenza
  thuat_ngu: cadenza
  nghia: Đoạn độc tấu tự do trong concerto
  nhom: Hình thức và thể loại
- id: fugue
  thuat_ngu: fugue
  nghia: Fugue
  ghi_chu: Chủ đề lần lượt vào ở các bè
  nhom: Hình thức và thể loại
- id: rondo
  thuat_ngu: rondo
  nghia: Rondo
  ghi_chu: A B A C A…
  nhom: Hình thức và thể loại
- id: scherzo
  thuat_ngu: scherzo
  nghia: Scherzo
  ghi_chu: Chương nhanh, vui; nghĩa đen "trò đùa"
  nhom: Hình thức và thể loại
- id: minuet
  thuat_ngu: minuet
  nghia: Minuet
  ghi_chu: Điệu múa nhịp 3/4
  nhom: Hình thức và thể loại
- id: suite
  thuat_ngu: suite
  nghia: Tổ khúc
  ghi_chu: Chuỗi các điệu múa
  nhom: Hình thức và thể loại
- id: opus
  thuat_ngu: opus
  nghia: Tác phẩm (số)
  ghi_chu: Viết tắt Op.; số thứ tự tác phẩm
  nhom: Hình thức và thể loại
- id: etude
  thuat_ngu: étude
  nghia: Bài luyện
  nhom: Hình thức và thể loại
- id: nocturne
  thuat_ngu: nocturne
  nghia: Dạ khúc
  nhom: Hình thức và thể loại
- id: overture
  thuat_ngu: overture
  nghia: Khúc mở màn
  nhom: Hình thức và thể loại
- id: aria
  thuat_ngu: aria
  nghia: Aria
  ghi_chu: Đoạn hát đơn trong opera
  nhom: Hình thức và thể loại
- id: oratorio
  thuat_ngu: oratorio
  nghia: Oratorio
  ghi_chu: Như opera nhưng thường biểu diễn không bối cảnh, không phục trang
  nhom: Hình thức và thể loại
- id: requiem
  thuat_ngu: requiem
  nghia: Lễ cầu hồn
  nhom: Hình thức và thể loại
- id: chamber-music
  thuat_ngu: chamber music
  nghia: Nhạc thính phòng
  ghi_chu: Nhóm nhỏ, thường mỗi bè một người
  nhom: Hình thức và thể loại
- id: string-quartet
  thuat_ngu: string quartet
  nghia: Tứ tấu đàn dây
  ghi_chu: 2 violin, viola, cello
  nhom: Hình thức và thể loại
- id: binary-form
  thuat_ngu: binary form
  nghia: 'Hình thức hai đoạn: tác phẩm gồm hai phần chính'
  ghi_chu: Mỗi phần thường được gọi là reprise
  nhom: Hình thức và thể loại
- id: ternary-form
  thuat_ngu: ternary form
  nghia: 'Hình thức ba đoạn: ba phần riêng biệt theo sơ đồ A–B–A'
  ghi_chu: Phần cuối nhắc lại phần đầu (ABA, không phải ABC)
  nhom: Hình thức và thể loại
- id: theme-and-variations
  thuat_ngu: theme and variations
  nghia: 'Chủ đề và biến tấu: chủ đề rồi các lần nhắc lại có biến đổi'
  ghi_chu: Có thể biến đổi tiết tấu, giai điệu, hòa âm, giọng, tốc độ hay phần đệm
  nhom: Hình thức và thể loại
- id: trio
  thuat_ngu: trio
  nghia: Đoạn giữa tương phản của minuet, scherzo hay hành khúc
  ghi_chu: Cũng chỉ tác phẩm cho ba bè hay ba nhạc cụ
  nhom: Hình thức và thể loại
- id: bagatelle
  thuat_ngu: bagatelle
  nghia: Khúc nhạc ngắn, nhẹ nhàng, thường cho piano
  nhom: Hình thức và thể loại
- id: mazurka
  thuat_ngu: mazurka
  nghia: Điệu múa dân gian Ba Lan nhịp ba, tốc độ vừa
  ghi_chu: Nhạc thường ở nhịp 3/4 hoặc 3/8
  nhom: Hình thức và thể loại
- id: polonaise
  thuat_ngu: polonaise
  nghia: Điệu múa rước trang trọng của Ba Lan, nhịp 3/4 vừa phải
  nhom: Hình thức và thể loại
- id: waltz
  thuat_ngu: waltz
  nghia: Điệu nhảy đôi nhịp 3/4, nhấn mạnh phách đầu
  nhom: Hình thức và thể loại
- id: invention
  thuat_ngu: invention
  nghia: Khúc phím ngắn viết đối âm hai hoặc ba bè
  nhom: Hình thức và thể loại
- id: prelude
  thuat_ngu: prelude
  nghia: Khúc mở đầu; cũng là bản độc lập ngắn dựa trên một motif
  ghi_chu: Bản độc lập thường viết cho piano hoặc dàn nhạc
  nhom: Hình thức và thể loại
- id: barcarolle
  thuat_ngu: barcarolle
  nghia: Bài ca thuyền Venice, nhịp 6/8 hay 12/8 gợi nhịp chèo
  ghi_chu: Cũng chỉ khúc nhạc mô phỏng bài ca thuyền
  nhom: Hình thức và thể loại
- id: impromptu
  thuat_ngu: impromptu
  nghia: Tác phẩm gợi tính ngẫu hứng
  nhom: Hình thức và thể loại
- id: ballade
  thuat_ngu: ballade
  nghia: Tác phẩm, thường cho piano, gợi chất bản ballad tự sự
  nhom: Hình thức và thể loại
- id: intermezzo
  thuat_ngu: intermezzo
  nghia: Khúc chen giữa các phần lớn; cũng là bản khí nhạc độc lập ngắn
  ghi_chu: 'Nghĩa gốc: màn chen ngắn, nhẹ giữa các hồi'
  nhom: Hình thức và thể loại
- id: rhapsody
  thuat_ngu: rhapsody
  nghia: Tác phẩm hình thức tự do, mang tính ngẫu hứng
  nhom: Hình thức và thể loại
- id: toccata
  thuat_ngu: toccata
  nghia: Tác phẩm phong cách tự do cho organ hay harpsichord, nhiều chạy ngón nhanh
  nhom: Hình thức và thể loại
- id: canon
  thuat_ngu: canon
  nghia: 'Tác phẩm đối âm: các bè lần lượt vào nhắc lại cùng chủ đề'
  nhom: Hình thức và thể loại
- id: double-fugue
  thuat_ngu: double fugue
  nghia: 'Fugue kép: fugue có hai chủ đề'
  ghi_chu: Hai chủ đề có thể trình bày riêng rồi kết hợp, hoặc cùng lúc ngay từ đầu
  nhom: Hình thức và thể loại
- id: fughetta
  thuat_ngu: fughetta
  nghia: Fugue ngắn
  nhom: Hình thức và thể loại
- id: passacaglia
  thuat_ngu: passacaglia
  nghia: Biến tấu trên bè trầm lặp lại, nhịp ba khá chậm
  ghi_chu: Gốc là một điệu nhạc múa cổ của Ý hoặc Tây Ban Nha
  nhom: Hình thức và thể loại
- id: chaconne
  thuat_ngu: chaconne
  nghia: Biến tấu trên chuỗi hợp âm lặp lại, nhịp ba vừa phải
  ghi_chu: Điệu múa cổ thịnh hành ở Tây Ban Nha, có lẽ gốc Mỹ Latinh
  nhom: Hình thức và thể loại
- id: allemande
  thuat_ngu: allemande
  nghia: Chương nhạc tốc độ vừa, nhịp hai hay bốn, trong tổ khúc Baroque
  ghi_chu: Gốc là điệu múa cung đình Pháp phát triển từ múa dân gian Đức
  nhom: Hình thức và thể loại
- id: courante
  thuat_ngu: courante
  nghia: Điệu múa gốc Ý với bước chạy nhanh; nhạc nhịp ba nhanh
  ghi_chu: Có khi trộn nhịp 3/2 và 6/4
  nhom: Hình thức và thể loại
- id: sarabande
  thuat_ngu: sarabande
  nghia: Điệu múa cung đình trang trọng, nhịp ba chậm, nhấn phách hai
  nhom: Hình thức và thể loại
- id: gigue
  thuat_ngu: gigue
  nghia: Chương múa sôi nổi trong tổ khúc, nhịp ba kép, viết lối fugue
  nhom: Hình thức và thể loại
- id: quodlibet
  thuat_ngu: quodlibet
  nghia: Sự kết hợp hóm hỉnh các giai điệu hay lời quen thuộc
  nhom: Hình thức và thể loại
- id: lied
  thuat_ngu: Lied
  nghia: Ca khúc nghệ thuật tiếng Đức
  ghi_chu: Tiêu biểu là ca khúc thế kỷ 19
  nhom: Hình thức và thể loại
- id: recitative
  thuat_ngu: recitative
  nghia: Lối hát gần lời nói, tiết tấu tự do
  ghi_chu: Dùng cho đối thoại và tự sự trong opera, oratorio
  nhom: Hình thức và thể loại
- id: singspiel
  thuat_ngu: Singspiel
  nghia: Nhạc kịch Đức xen lời thoại nói với bài hát
  ghi_chu: Thịnh hành ở Đức nhất là cuối thế kỷ 18
  nhom: Hình thức và thể loại
- id: chorale
  thuat_ngu: chorale
  nghia: 'Thánh ca: bài hymn hát trong nhà thờ theo giai điệu truyền thống'
  ghi_chu: Cũng chỉ bản phối hòa âm một giai điệu chorale
  nhom: Hình thức và thể loại
- id: ritornello
  thuat_ngu: ritornello
  nghia: Đoạn khí nhạc ngắn trở lại nhiều lần; đoạn tutti trong concerto
  nhom: Hình thức và thể loại
- id: tutti
  thuat_ngu: tutti
  nghia: Tất cả cùng diễn; đoạn do toàn bộ người diễn thể hiện
  nhom: Hình thức và thể loại
- id: concerto-grosso
  thuat_ngu: concerto grosso
  nghia: 'Tác phẩm Baroque: nhóm nhỏ độc tấu đối lập với cả dàn nhạc'
  nhom: Hình thức và thể loại
- id: serenade
  thuat_ngu: serenade
  nghia: Tác phẩm nhiều chương cho nhóm nhỏ, giữa tổ khúc và giao hưởng
  ghi_chu: 'Nghĩa gốc: khúc hát hay khúc đàn dạo ngoài trời ban đêm tặng người yêu'
  nhom: Hình thức và thể loại
- id: divertimento
  thuat_ngu: divertimento
  nghia: Tác phẩm thính phòng nhiều chương, thường nhẹ nhàng
  nhom: Hình thức và thể loại
- id: march
  thuat_ngu: march
  nghia: 'Hành khúc: nhịp hai hay bốn, phách nhấn rõ, để đi đều theo'
  nhom: Hình thức và thể loại
- id: landler
  thuat_ngu: Ländler
  nghia: Điệu múa đôi nông thôn Áo nhịp ba, tiền thân của valse
  ghi_chu: Chậm hơn valse, bước nhảy có dậm chân
  nhom: Hình thức và thể loại
- id: ballet
  thuat_ngu: ballet
  nghia: Nghệ thuật sân khấu dùng múa, âm nhạc và cảnh trí để kể chuyện, thể hiện chủ đề hay không khí
  ghi_chu: Cũng chỉ phần nhạc viết cho một vở ballet
  nhom: Hình thức và thể loại
- id: symphonic-poem
  thuat_ngu: symphonic poem
  nghia: 'Thơ giao hưởng: tác phẩm chương trình cho dàn nhạc, hình thức tự do'
  nhom: Hình thức và thể loại
- id: program-music
  thuat_ngu: program music
  nghia: 'Nhạc chương trình: âm nhạc gợi một chuỗi hình ảnh hay sự việc'
  nhom: Hình thức và thể loại
- id: concert-overture
  thuat_ngu: concert overture
  nghia: 'Overture hòa nhạc: tác phẩm dàn nhạc độc lập một chương'
  ghi_chu: Thường viết theo hình thức sonata
  nhom: Hình thức và thể loại
- id: french-overture
  thuat_ngu: French overture
  nghia: 'Overture Pháp: phần chậm trang trọng, nhịp chấm dôi, rồi phần nhanh mô phỏng'
  ghi_chu: Do Lully định hình; theo Oxford có thể có đoạn chậm kết (chậm – nhanh – chậm)
  nhom: Hình thức và thể loại
- id: cantata
  thuat_ngu: cantata
  nghia: Tác phẩm thanh nhạc có đệm, gồm đơn ca, song ca, hát nói, hợp xướng
  nhom: Hình thức và thể loại
- id: mass
  thuat_ngu: mass
  nghia: 'Lễ misa: phổ nhạc các phần thường lệ của Thánh lễ'
  nhom: Hình thức và thể loại
- id: transcription
  thuat_ngu: transcription
  nghia: 'Chuyển soạn: soạn lại tác phẩm cho nhạc cụ hay giọng khác bản gốc'
  nhom: Hình thức và thể loại
- id: subject
  thuat_ngu: subject
  nghia: 'Chủ đề: giai điệu ngắn làm nền cho fugue, trở lại suốt bài'
  nhom: Hình thức và thể loại
- id: answer
  thuat_ngu: answer
  nghia: 'Đáp đề: chủ đề fugue nhắc lại ở cao độ khác'
  ghi_chu: Đôi khi hơi biến đổi so với chủ đề
  nhom: Hình thức và thể loại
- id: countersubject
  thuat_ngu: countersubject
  nghia: 'Đối đề: bè giai điệu đi cùng, bổ sung cho chủ đề hay đáp đề'
  nhom: Hình thức và thể loại
- id: episode
  thuat_ngu: episode
  nghia: 'Đoạn chuyển trong fugue: đoạn giữa các lần vào của chủ đề, không có chủ đề trọn vẹn'
  ghi_chu: Trong rondo, episode là các đoạn xen không phải chủ đề chính
  nhom: Hình thức và thể loại
- id: stretto
  thuat_ngu: stretto
  nghia: Các lần vào của chủ đề chồng gối nhau trong fugue
  ghi_chu: Cũng chỉ đoạn kết diễn với tốc độ nhanh hơn
  nhom: Hình thức và thể loại
- id: texture
  thuat_ngu: texture
  nghia: Kết cấu
  ghi_chu: Cách các bè/giọng kết hợp với nhau
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: monophony
  thuat_ngu: monophony
  nghia: Đơn âm
  ghi_chu: Một dòng giai điệu duy nhất
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: homophony
  thuat_ngu: homophony
  nghia: Chủ điệu
  ghi_chu: Một giai điệu chính với bè đệm, hay các bè cùng tiết tấu
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: polyphony
  thuat_ngu: polyphony
  nghia: Phức điệu
  ghi_chu: Nhiều giai điệu độc lập cùng lúc
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: heterophony
  thuat_ngu: heterophony
  nghia: Dị âm
  ghi_chu: Cùng một giai điệu, mỗi nhạc cụ chơi biến tấu riêng
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: motif
  thuat_ngu: motif
  nghia: Môtip
  ghi_chu: Ý nhạc ngắn, đơn vị xây dựng tác phẩm
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: sequence
  thuat_ngu: sequence
  nghia: Chuỗi
  ghi_chu: Lặp lại môtip ở các cao độ khác nhau
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: augmentation
  thuat_ngu: augmentation
  nghia: Nới rộng
  ghi_chu: Kéo dài trường độ các nốt của môtip
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: diminution
  thuat_ngu: diminution
  nghia: Thu hẹp
  ghi_chu: Rút ngắn trường độ các nốt của môtip
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: fragmentation
  thuat_ngu: fragmentation
  nghia: Chia nhỏ
  ghi_chu: Chỉ dùng một mảnh của môtip để phát triển
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: inversion-giai-dieu
  thuat_ngu: inversion (giai điệu)
  nghia: Đảo
  ghi_chu: Lật ngược hướng đi của môtip; khác "thể đảo" của hợp âm
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: whole-tone-scale
  thuat_ngu: whole-tone scale
  nghia: Gam toàn cung
  ghi_chu: 6 nốt, mỗi nốt cách nhau một cung
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: octatonic-scale
  thuat_ngu: octatonic scale
  nghia: Gam bát cung
  ghi_chu: 8 nốt xen kẽ cung – nửa cung
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: polytonality
  thuat_ngu: polytonality
  nghia: Đa điệu tính
  ghi_chu: Nhiều giọng cùng lúc
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: twelve-tone
  thuat_ngu: twelve-tone
  nghia: Nhạc 12 âm
  ghi_chu: Dùng đủ 12 nốt nửa cung theo một dãy định sẵn
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20
- id: minimalism
  thuat_ngu: minimalism
  nghia: Tối giản
  ghi_chu: Lặp lại các mẫu ngắn với biến đổi dần dần
  nhom: Kết cấu, hình thức và kỹ thuật thế kỷ 20

- id: fortepiano
  thuat_ngu: fortepiano
  nghia: Piano đời đầu, thế kỷ 18 – đầu thế kỷ 19
  ghi_chu: Âm vực hẹp hơn, tiếng mềm hơn piano hiện đại
  nhom: Nhạc cụ và giọng hát
- id: harpsichord
  thuat_ngu: harpsichord
  nghia: Đàn phím có dây được gảy bằng miếng gảy
  ghi_chu: Dáng giống grand piano, thường có hai bàn phím
  nhom: Nhạc cụ và giọng hát
- id: strings
  thuat_ngu: strings
  nghia: 'Bộ dây: các nhạc cụ dây của dàn nhạc'
  nhom: Nhạc cụ và giọng hát
- id: woodwind
  thuat_ngu: woodwind
  nghia: 'Bộ gỗ: nhóm nhạc cụ hơi như flute, clarinet, oboe, bassoon'
  ghi_chu: Phát âm nhờ dăm rung hoặc luồng hơi qua lỗ thổi
  nhom: Nhạc cụ và giọng hát
- id: brass
  thuat_ngu: brass
  nghia: 'Bộ đồng: các nhạc cụ đồng của dàn nhạc'
  nhom: Nhạc cụ và giọng hát
- id: percussion
  thuat_ngu: percussion
  nghia: 'Bộ gõ: các nhạc cụ gõ của dàn nhạc'
  nhom: Nhạc cụ và giọng hát
- id: viola
  thuat_ngu: viola
  nghia: Đàn họ violin, cỡ và âm vực giữa violin và cello
  ghi_chu: Lên dây thấp hơn violin một quãng 5
  nhom: Nhạc cụ và giọng hát
- id: cello
  thuat_ngu: cello
  nghia: Đàn trầm của họ violin
  ghi_chu: Lên dây thấp hơn viola một quãng 8
  nhom: Nhạc cụ và giọng hát
- id: contrabass
  thuat_ngu: double bass (contrabass)
  nghia: 'Contrabass: đàn dây lớn nhất, trầm nhất, lên dây theo quãng 4'
  ghi_chu: 'Tiếng Anh: double bass hay contrabass'
  nhom: Nhạc cụ và giọng hát
- id: oboe
  thuat_ngu: oboe
  nghia: Kèn dăm kép bộ gỗ, ống hình nón, tiếng sáng và sắc
  nhom: Nhạc cụ và giọng hát
- id: oboe-d-amore
  thuat_ngu: oboe d'amore
  nghia: Oboe giọng mezzo-soprano, loa hình quả lê
  ghi_chu: Tiếng đầy và trầm buồn
  nhom: Nhạc cụ và giọng hát
- id: cor-anglais
  thuat_ngu: cor anglais
  nghia: Kèn dăm kép họ oboe, ống dài hơn, thấp hơn oboe một quãng 5
  ghi_chu: 'Tiếng Anh Mỹ: English horn; tiếng Ý: corno inglese'
  nhom: Nhạc cụ và giọng hát
- id: bassoon
  thuat_ngu: bassoon
  nghia: Kèn dăm kép trầm, ống hình nón gập chữ U
  nhom: Nhạc cụ và giọng hát
- id: basset-horn
  thuat_ngu: basset horn
  nghia: Clarinet giọng tenor cung Fa, thấp hơn clarinet thường
  nhom: Nhạc cụ và giọng hát
- id: horn
  thuat_ngu: horn (French horn)
  nghia: Kèn đồng cuộn tròn, có van, ống hình nón
  ghi_chu: Thường gọi tắt là horn
  nhom: Nhạc cụ và giọng hát
- id: timpani
  thuat_ngu: timpani
  nghia: Bộ trống định âm (kettledrum) do một người chơi
  nhom: Nhạc cụ và giọng hát
- id: snare-drum
  thuat_ngu: snare drum
  nghia: Trống nhỏ hai mặt, có dây snare căng ở mặt dưới
  nhom: Nhạc cụ và giọng hát
- id: celesta
  thuat_ngu: celesta
  nghia: Đàn phím có búa gõ vào thanh thép
  ghi_chu: Tiếng gần giống glockenspiel
  nhom: Nhạc cụ và giọng hát
- id: piccolo
  thuat_ngu: piccolo
  nghia: Sáo nhỏ, cao hơn flute một quãng 8
  nhom: Nhạc cụ và giọng hát
- id: open-string
  thuat_ngu: open string
  nghia: 'Dây buông: dây đàn chơi không bấm ngón'
  nhom: Nhạc cụ và giọng hát
- id: single-reed
  thuat_ngu: single reed
  nghia: 'Dăm đơn: một lá dăm buộc vào ống ngậm bằng khóa dăm'
  ghi_chu: Dùng cho họ clarinet và saxophone
  nhom: Nhạc cụ và giọng hát
- id: embouchure
  thuat_ngu: embouchure
  nghia: 'Khẩu hình thổi: cách đặt và dùng môi, lưỡi, răng khi chơi nhạc cụ hơi'
  ghi_chu: 'Nghĩa khác: ống ngậm, lỗ thổi'
  nhom: Nhạc cụ và giọng hát
- id: soprano
  thuat_ngu: soprano
  nghia: Giọng hát cao nhất của nữ hoặc trẻ em trai
  ghi_chu: Cũng là bè cao nhất trong hợp xướng bốn bè
  nhom: Nhạc cụ và giọng hát
- id: mezzo-soprano
  thuat_ngu: mezzo-soprano
  nghia: Giọng nữ có âm vực giữa soprano và contralto
  nhom: Nhạc cụ và giọng hát
- id: alto
  thuat_ngu: alto (contralto)
  nghia: Giọng nữ trầm nhất (contralto)
  ghi_chu: Cũng là bè cao thứ hai trong hợp xướng bốn bè
  nhom: Nhạc cụ và giọng hát
- id: tenor
  thuat_ngu: tenor
  nghia: Giọng nam tự nhiên cao nhất
  ghi_chu: Cũng là bè thứ hai từ dưới lên trong hợp xướng bốn bè
  nhom: Nhạc cụ và giọng hát
- id: baritone
  thuat_ngu: baritone
  nghia: Giọng nam có âm vực giữa bass và tenor
  nhom: Nhạc cụ và giọng hát
- id: bass-voice
  thuat_ngu: bass
  nghia: Giọng nam trầm nhất
  nhom: Nhạc cụ và giọng hát
- id: coloratura
  thuat_ngu: coloratura
  nghia: Lối hát hoa mỹ, nhiều nét trang trí
  ghi_chu: Cũng chỉ giọng soprano nhẹ, linh hoạt chuyên lối hát này
  nhom: Nhạc cụ và giọng hát
- id: score
  thuat_ngu: score (full score)
  nghia: 'Tổng phổ: bản nhạc ghi đủ mọi bè của tác phẩm'
  ghi_chu: Mỗi bè thường nằm trên một khuông riêng
  nhom: Nhạc cụ và giọng hát
- id: conductor
  thuat_ngu: conductor
  nghia: 'Nhạc trưởng: người chỉ huy dàn nhạc, hợp xướng'
  nhom: Nhạc cụ và giọng hát
- id: concertmaster
  thuat_ngu: concertmaster
