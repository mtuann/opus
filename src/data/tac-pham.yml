    - chu_thich: 'Mozart, Requiem: ai viết phần nào? Xanh: Mozart viết trọn. Vàng: Mozart viết bè hát và bè trầm, người khác hoàn thành phối khí (Lacrimosa: chỉ 8 ô nhịp đầu). Xám: chủ yếu Süssmayr. Đỏ: dùng lại nhạc Mozart ở phần mở đầu.'
      doan:
      - [Introitus, '', 1, a]
      - [Kyrie, '', 1, b]
      - [Dies irae, '', 1, b]
      - [Tuba mirum, '', 1, b]
      - [Rex, '', 0.8, b]
      - [Recordare, '', 1, b]
      - [Confutatis, '', 0.8, b]
      - [Lacrimosa, 8 ô nhịp, 0.8, b]
      - [Offertorium, '', 1.2, b]
      - [Sanctus · Benedictus · Agnus Dei, '', 2.2, x]
      - [Communio, dùng lại nhạc mở đầu, 1, c]
