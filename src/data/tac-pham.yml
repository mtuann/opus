  thong_tin:
  - [Nhà soạn nhạc, Gán cho Ludwig van Beethoven (1770–1827); tác giả thật chưa được xác định (xem Bối cảnh)]
  - [Tác phẩm, 'Sonatina Sol trưởng, Anh. 5 số 1 (cũng ghi WoO Anh. 5 số 1): bài đầu trong hai sonatina Anh. 5, bài kia ở Fa trưởng. *Anh.* là viết tắt của *Anhang* (phụ lục), phần dành cho các tác phẩm đáng ngờ trong danh mục tác phẩm Beethoven']
  - [Sáng tác / xuất bản, 'Không rõ năm sáng tác, không còn bản viết tay. Theo Henle, hai bài được in khi Beethoven còn sống, khoảng năm 1807; một số nguồn khác cho rằng lần in đầu có sau khi ông mất. Toàn tập Beethoven của Breitkopf & Härtel (thế kỷ 19) in bài này ở loạt 16, số 160']
  - [Giọng · nhịp · tốc độ, 'I. *Moderato*, Sol trưởng, 4/4 · II. *Romanze*, Sol trưởng, 6/8, không ghi tốc độ']
  - [Hình thức, 'Cả hai chương: A – B – A và coda. I: 34 ô, ô 9–24 nhắc lại · II: nhịp lấy đà và 40 ô; đoạn A nhắc lại, rồi B và A nhắc lại cùng nhau']
  - [Độ khó, Khoảng ABRSM Grade 2–3 (ước lượng); Henle xếp mức 3 (dễ) trên thang 1–9]
  - [Kỹ năng chính, 'Dấu luyến hai nốt, nốt láy ngắn, giai điệu trên hình đệm Alberti, nhịp 6/8 với hình đệm "nốt trầm – hai hợp âm", tương phản sắc thái, giữ tay trái nhẹ']
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "2 Sonatinas for Piano, Anh.5"); bản Urtext: [G. Henle Verlag](https://www.henle.de/) HN 365 (Otto von Irmer biên tập), Wiener Urtext UT 50290 (*Drei Sonatinen*), Bärenreiter (*Leichte Klavierstücke und Tänze*, Michael Töpel biên tập)']
  hinh:
    bai-hoc:
    - chu_thich: 'Sonatina Sol trưởng, Anh. 5 số 1: hai chương, mỗi chương A – B – A và coda (độ dài các ô theo số ô nhịp).'
      doan:
      - [I. A, Moderato · ô 1–8, 8, a]
      - [I. B, quanh Rê bảy · ô 9–16, 8, b]
      - [I. A, dolce · ô 17–24, 8, a]
      - [I. Coda, ô 25–34, 10, coda]
      - [II. A, Romanze · ô 1–8, 8, a]
      - [II. B, Rê trưởng → Rê bảy · ô 9–21, 13, c]
      - [II. A, ô 22–29, 8, a]
      - [II. Coda, ô 29–40, 12, coda]
      ghi_chu: 'Chương I: ô 9–24 nhắc lại. Chương II: đoạn A nhắc lại; B và A nhắc lại cùng nhau.'
