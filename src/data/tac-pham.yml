- slug: bach-invention-1
  loai: bai-hoc
  tac_gia: bach
  ten: Invention số 1 BWV 772
  danh_muc: BWV 772
  giong: Đô trưởng
  nhip: 4/4
  thoi_ky: Baroque
  chang: 5
  grade: Grade 6
  ky_nang_chinh: Phức điệu hai bè, môtip và đảo môtip
  goi_y: true
  chip:
  - Đô trưởng · 4/4
  - Hai bè
  - cap_do: ≈ Grade 6
  - Ba phần
  thong_tin:
  - [Nhà soạn nhạc, Johann Sebastian Bach (1685–1750)]
  - [Tác phẩm, 'Invention số 1 Đô trưởng, BWV 772 — bài đầu trong 15 Invention hai bè (BWV 772–786); cùng 15 Sinfonia ba bè (BWV 787–801) tạo thành tập *Inventionen und Sinfonien*']
  - [Sáng tác / xuất bản, 'Bản chép sạch đề năm 1723, khi Bach còn là Kapellmeister ở Köthen. Phiên bản sớm hơn, với tên *Praeambulum*, nằm trong *Clavier-Büchlein* mà Bach bắt đầu soạn năm 1720 cho con trai Wilhelm Friedemann']
  - [Giọng · nhịp · tốc độ, Đô trưởng · 4/4 · Bach không ghi tốc độ (thường ♩ ≈ 60–80)]
  - [Hình thức, 'Ba phần, mỗi phần khép bằng một kết: Đô trưởng → Sol trưởng (ô 7) → La thứ (ô 15) → Đô trưởng (ô 22)']
  - [Độ khó, Khoảng ABRSM Grade 6 (ước lượng)]
  - [Kỹ năng chính, 'Độc lập hai tay, phát âm (móc kép liền, móc đơn tách), ngón bấm cố định, nhận ra chủ đề và chủ đề đảo, chuỗi, nốt hoa mỹ Baroque']
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "15 Inventions, BWV 772-786"); bản Urtext: [G. Henle Verlag](https://www.henle.de/), Bärenreiter, Wiener Urtext']
  hinh:
    bai-hoc:
    - chu_thich: 'Invention số 1 Đô trưởng: ba phần, mỗi phần khép bằng một kết (22 ô nhịp).'
      doan:
      - [Phần 1, ô 1–7 · Đô → Sol trưởng, 6.5, a]
      - [Phần 2, ô 7–15 · chủ đề đảo → La thứ, 8, b]
      - [Phần 3, 'ô 15–18 · nốt dài, chuỗi', 3.5, dev]
      - [Kết, ô 19–22 · về Đô, 4, coda]
- slug: bach-prelude-bwv939
  loai: bai-hoc
  tac_gia: bach
  ten: Prelude nhỏ Đô trưởng, BWV 939
  danh_muc: BWV 939
  giong: Đô trưởng
  nhip: 4/4
  thoi_ky: Baroque
  chang: 3
  grade: Grade 3
  ky_nang_chinh: Hợp âm rải chia hai tay, nhịp hòa âm, chơi Bach trên piano
  goi_y: true
  chip:
  - Đô trưởng · 4/4
  - Hợp âm rải chia hai tay
  - cap_do: ≈ Grade 3
  - 16 ô nhịp
  thong_tin:
  - [Nhà soạn nhạc, Johann Sebastian Bach (1685–1750). Bản chép duy nhất còn lại không ghi tên tác giả (xem Bối cảnh)]
  - [Tác phẩm, 'Prelude (*Praeludium*) Đô trưởng, BWV 939: bài đầu trong *Fünf kleine Präludien* (Năm prelude nhỏ, BWV 939–943); số 2 trong tuyển tập quen thuộc *12 prelude nhỏ*']
  - [Sáng tác / xuất bản, 'Không còn bản viết tay của Bach. Nguồn thế kỷ 18 duy nhất là một bản chép trong tập P 804 ở Thư viện Quốc gia Berlin, bộ sưu tập gắn với Johann Peter Kellner. Năm sáng tác chưa xác định: các tài liệu ước đoán từ thời Köthen (1717–1723) đến khoảng 1726–1727. In lần đầu năm 1843 (nhà Peters, Leipzig)']
  - [Giọng · nhịp · tốc độ, Đô trưởng · 4/4 · không ghi tốc độ (thường ♩ ≈ 80–100)]
  - [Hình thức, 'Một mạch liền 16 ô, bốn chặng: nốt nền chủ (ô 1–3) → chuyền tay, sang Sol trưởng (ô 4–8) → nốt nền át có láy (ô 9–12) → về Đô, gam móc kép và kết (ô 13–16)']
  - [Độ khó, Khoảng ABRSM Grade 3 (ước lượng)]
  - [Kỹ năng chính, 'Hợp âm rải chia giữa hai tay, giữ nốt trầm bằng ngón, móc đơn đều, láy ở tay trái, gam móc kép có chỗ quay đầu, tiếng đàn rõ với rất ít hoặc không bàn đạp']
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "5 Kleine Präludien, BWV 939-943", có bản Bach-Gesellschaft năm 1890); bản Urtext: [G. Henle Verlag](https://www.henle.de/) HN 106, *Kleine Präludien und Fughetten* (Prelude nhỏ và fughetta)']
  hinh:
    bai-hoc:
    - chu_thich: 'Bach, Prelude nhỏ Đô trưởng BWV 939: một mạch 16 ô, bốn chặng hòa âm (độ dài các ô theo số ô nhịp).'
      doan:
      - [Nốt nền chủ, ô 1–3, 3, a]
      - [Chuyền tay, sang Sol trưởng · ô 4–8, 5, dev]
      - [Nốt nền át, ô 9–12, 4, cad]
      - [Về Đô, ô 13–16 · kết, 4, a]
- slug: bach-prelude-do
  loai: bai-hoc
  tac_gia: bach
  ten: Prelude Đô trưởng BWV 846
  danh_muc: BWV 846
  giong: Đô trưởng
  nhip: 4/4
  thoi_ky: Baroque
  chang: 4
  grade: Grade 4–5
  ky_nang_chinh: Hợp âm rải đều, nghe hòa âm, cổ tay thả lỏng
  goi_y: true
  luyen_nghe: Nghe hòa âm, âm nền
  chip:
  - Đô trưởng · 4/4
  - Hợp âm rải liên tục
  - cap_do: ≈ Grade 4–5
  - BWV 846
  thong_tin:
  - [Nhà soạn nhạc, Johann Sebastian Bach (1685–1750)]
  - [Tác phẩm, 'Prelude Đô trưởng, BWV 846 — bài đầu tiên của *Das Wohltemperierte Klavier* (*Bình quân luật*), quyển 1; đi cặp với Fugue Đô trưởng']
  - [Sáng tác / xuất bản, 'Bản chép sạch quyển 1 đề năm 1722, thời Bach làm việc ở Köthen. Một phiên bản sớm hơn và ngắn hơn nằm trong *Clavier-Büchlein* (sổ tay đàn phím) mà Bach bắt đầu soạn năm 1720 cho con trai Wilhelm Friedemann. Tập nhạc lưu hành bằng bản chép tay, đến năm 1801 mới được in']
  - [Giọng · nhịp · tốc độ, Đô trưởng · 4/4 · Bach không ghi tốc độ (thường ♩ ≈ 60–72)]
  - [Hình thức, 'Một chuỗi hợp âm rải liên tục: khẳng định Đô trưởng → sang Sol trưởng → quay về, căng dần → âm nền át → âm nền chủ và kết']
  - [Độ khó, 'Khoảng ABRSM Grade 4–5 (ước lượng): nốt không khó, cái khó là sự đều đặn và tiếng đàn']
  - [Kỹ năng chính, 'Hợp âm rải chia giữa hai tay, giữ nốt bằng ngón, móc kép đều, bàn đạp (hoặc không), sắc thái theo hòa âm, học thuộc theo hợp âm']
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "Das wohltemperierte Klavier I"); bản Urtext: [G. Henle Verlag](https://www.henle.de/), Bärenreiter, Wiener Urtext. Bản đúng có 35 ô nhịp (xem phần Diễn tấu)']
  hinh:
    bai-hoc:
    - chu_thich: Prelude cung Đô trưởng, BWV 846 (35 ô nhịp; độ dài các ô gần đúng theo số ô nhịp).
      doan:
      - [Đô trưởng, ô 1–4, 4, a]
      - ['Đi xa: Sol trưởng', ô 5–11, 7, b]
      - ['Quay về, căng dần', ô 12–23, 12, dev]
      - [Âm nền át, ô 24–31, 8, cad]
      - [Âm nền chủ, ô 32–35, 4, coda]
- slug: bach-prelude-fugue-do-thu
  loai: bai-hoc
  tac_gia: bach
  ten: Prelude và fugue Đô thứ, BWV 847
  danh_muc: BWV 847
  giong: Đô thứ
  nhip: 4/4
  thoi_ky: Baroque
  chang: 6
  grade: Grade 7–8
  ky_nang_chinh: Móc kép đều ở hai tay, fugue ba bè, nghe và giữ từng bè
  goi_y: true
  chip:
  - Đô thứ · 4/4
  - Prelude · fugue ba bè
  - cap_do: ≈ Grade 7–8
  - 38 + 31 ô nhịp
  thong_tin:
  - [Nhà soạn nhạc, Johann Sebastian Bach (1685–1750)]
  - [Tác phẩm, 'Prelude và fugue Đô thứ, BWV 847 — cặp số 2 trong *Das Wohltemperierte Klavier* (*Bình quân luật*), quyển 1, ngay sau [Prelude Đô trưởng BWV 846](bach-prelude-do.md)']
  - [Sáng tác / xuất bản, 'Bach chép sạch quyển 1, kèm một trang bìa trang trọng, vào năm 1722, thời ông làm việc ở Köthen. Tập nhạc lưu hành bằng bản chép tay; khoảng năm 1800 mới có bản in, gần như cùng lúc từ ba nhà xuất bản: Nägeli (Zürich), Simrock (Bonn), Hoffmeister & Kühnel (Vienna và Leipzig)']
  - [Giọng · nhịp · tốc độ, 'Đô thứ · 4/4 · đầu prelude không ghi tốc độ; về cuối có *Presto* (ô 28), *Adagio* (ô 34), *Allegro* (ô 35). Fugue không ghi tốc độ']
  - [Hình thức, 'Prelude 38 ô: móc kép liên tục ở cả hai tay, khép lại bằng ba đoạn đổi tốc độ. Fugue ba bè, 31 ô: một chủ đề, hai đối đề, năm đoạn chuyển']
  - [Độ khó, 'Khoảng ABRSM Grade 7–8 (ước lượng), chặng 6 của [lộ trình](../lo-trinh.md). Henle xếp prelude mức 6, fugue mức 5 trên thang 9 (cả hai "trung bình")']
  - [Kỹ năng chính, Móc kép đều và cân bằng ở hai tay; nghe và giữ ba bè độc lập; ngón bấm nối liền từng bè; phát âm nhất quán; chơi gần như không bàn đạp]
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "Das wohltemperierte Klavier I, BWV 846-869"); bản Urtext: [G. Henle Verlag](https://www.henle.de/) (HN 1014, biên tập Ernst-Günter Heinemann, không ghi ngón; HN 14 có ghi ngón), Bärenreiter, Wiener Urtext']
  hinh:
    bai-hoc:
    - chu_thich: 'Prelude và fugue Đô thứ BWV 847: prelude 38 ô, fugue 31 ô (độ dài các ô theo số ô nhịp).'
      doan:
      - [Prelude, ô 1–20 · Đô thứ → Mi♭ trưởng → Đô thứ, 20, a]
      - [Âm nền át, ô 21–27 · Sol ở bè trầm, 7, cad]
      - [Presto · Adagio · Allegro, ô 28–38 · kết Đô trưởng, 11, c]
      - ['Fugue: trình bày', 'ô 1–8 · alto, soprano, bass', 8, a]
      - [Giữa fugue, 'ô 9–25 · Mi♭ trưởng, Sol thứ, Đô thứ; các đoạn chuyển', 17, dev]
      - [Lần vào cuối, 'ô 26–31 · bass, rồi soprano trên nốt Đô ngân', 6, coda]
      ghi_chu: Số ô theo bản Bach-Gesellschaft (prelude) và Edition Peters (fugue), qua Mutopia.
- slug: beethoven-anh-trang
  loai: bai-hoc
  tac_gia: beethoven
  ten: Sonata *Ánh trăng* Op. 27 số 2, chương 1
  danh_muc: Op. 27 số 2
  giong: Đô♯ thứ
  nhip: 2/2
  thoi_ky: Cổ điển
  chang: 5
  grade: Grade 6–7
  ky_nang_chinh: Ba lớp trong hai tay, giai điệu ngón 5, bàn đạp *senza sordino*
  goi_y: true
  cap: nghe-nhac/beethoven-moonlight
  luyen_nghe: Triplet đều, fantasia
  chip:
  - Đô♯ thứ · 2/2
  - Adagio sostenuto
  - cap_do: ≈ Grade 6–7
  - 69 ô nhịp
  thong_tin:
  - [Nhà soạn nhạc, Ludwig van Beethoven (1770–1827)]
  - [Tác phẩm, 'Sonata piano số 14 cung Đô♯ thứ, Op. 27 số 2, *Sonata quasi una fantasia* ("sonata gần như một fantasia"); chương 1: *Adagio sostenuto*']
  - [Sáng tác / xuất bản, 'Viết năm 1801, in năm 1802 ở Vienna; đề tặng nữ bá tước Giulietta Guicciardi, học trò của Beethoven. Tên "Ánh trăng" có sau, không phải của Beethoven']
  - [Giọng · nhịp · tốc độ, 'Đô♯ thứ · 2/2 (alla breve) · *Adagio sostenuto* (chậm, ngân giữ)']
  - [Hình thức, 'Một chương liền, 69 ô nhịp, không nhắc lại: mở đầu, giai điệu ba lần qua nhiều giọng, đoạn trên nốt át ngân (ô 28–41), tái hiện (ô 42), coda (ô 60); có thể nghe như ba phần hoặc một hình thức sonata thu nhỏ']
  - [Độ khó, 'Khoảng ABRSM Grade 6–7 (ước lượng; chặng 5 của site): nốt không khó, cái khó nằm ở cân bằng âm thanh và bàn đạp. Henle xếp cả bản sonata, gồm chương 3 *Presto agitato* khó hơn nhiều, ở mức 7 (khó) trên thang 1–9; trang của Henle không ghi mức riêng cho chương 1']
  - [Kỹ năng chính, Ba lớp trong hai tay; giai điệu nổi bằng ngón 4–5 trên chùm ba ngón 1–2–3 của cùng tay phải; chùm ba đều ở *pp*; nhịp chấm dôi đặt đúng so với chùm ba; bàn đạp đổi theo hòa âm; giữ mạch ở tốc độ chậm]
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "Piano Sonata No.14, Op.27 No.2"); bản Urtext: [G. Henle Verlag](https://www.henle.de/) (HN 1062, ngón bấm của Murray Perahia), Bärenreiter (biên tập Jonathan Del Mar), Wiener Urtext; ấn bản ABRSM (biên tập Barry Cooper)']
  hinh:
    bai-hoc:
    - chu_thich: Ánh trăng, chương 1 (69 ô nhịp, không nhắc lại; độ dài các ô theo số ô nhịp).
      doan:
      - [Mở đầu, ô 1–4 · chùm ba và bè trầm, 4, intro]
      - [Giai điệu, ô 5–9 · Đô♯ thứ → Mi trưởng, 5, a]
      - [Chuyển giọng, 'ô 10–22 · Mi thứ, quanh Si, sang Fa♯ thứ', 13, dev]
      - [Giai điệu, ô 23–27 · Fa♯ thứ, 5, a]
      - [Sol♯ ngân, ô 28–41 · át âm ở bè trầm, 14, cad]
      - [Tái hiện, ô 42–59 · Đô♯ thứ, 18, a]
      - [Coda, ô 60–69 · giai điệu xuống bè trầm, 10, coda]
      ghi_chu: Số ô nhịp theo bản Winterberger (qua Mutopia). Có thể nghe bài như ba phần hoặc như một hình thức sonata thu nhỏ.
- slug: beethoven-op49-2
  loai: bai-hoc
  tac_gia: beethoven
  ten: Sonata Sol trưởng Op. 49 số 2, chương 1
  danh_muc: Op. 49 số 2
  giong: Sol trưởng
  nhip: 2/2
  thoi_ky: Cổ điển
  chang: 4
  grade: Grade 5
  ky_nang_chinh: Hình thức sonata nghe từ bên trong, chùm ba và nhịp chấm dôi, gam chùm ba
  goi_y: true
  chip:
  - Sol trưởng · 2/2
  - Allegro, ma non troppo
  - cap_do: ≈ Grade 5
  - Hình thức sonata, 122 ô nhịp
  thong_tin:
  - [Nhà soạn nhạc, Ludwig van Beethoven (1770–1827)]
  - [Tác phẩm, 'Sonata piano số 20 cung Sol trưởng, Op. 49 số 2; chương 1: *Allegro, ma non troppo* (chương 2: *Tempo di Menuetto*)']
  - [Sáng tác / xuất bản, 'Viết khoảng 1796–1798, cùng thời với ba sonata Op. 10 (theo Henle); in năm 1805 ở Vienna cùng sonata Op. 49 số 1, với tên *Sonates faciles* ("những sonata dễ")']
  - [Giọng · nhịp · tốc độ, 'Sol trưởng · 2/2 (alla breve) · *Allegro, ma non troppo* (nhanh, nhưng không quá)']
  - [Hình thức, 'Hình thức sonata, 122 ô nhịp: trình bày ô 1–52 (có nhắc lại), phát triển ô 53–66, tái hiện ô 67–122']
  - [Độ khó, Khoảng ABRSM Grade 5 (ước lượng; chặng 4 của site); Henle xếp mức 3 (dễ) trên thang 1–9]
  - [Kỹ năng chính, 'Chùm ba móc đơn đều (hợp âm rải và gam), nhịp chấm dôi không bị "chùm ba hóa", láy rền có nốt kết, láy quanh, hình đệm nốt lặp ở tay trái, gam chùm ba ở cả hai tay, phát âm Cổ điển']
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "Piano Sonata No.20, Op.49 No.2"); bản Urtext: [G. Henle Verlag](https://www.henle.de/) (HN 1327, in chung hai sonata Op. 49, ngón bấm của Murray Perahia), Wiener Urtext, Bärenreiter; ấn bản ABRSM (biên tập Barry Cooper) có chú thích hữu ích']
  hinh:
    bai-hoc:
    - chu_thich: Beethoven, Op. 49 số 2, chương 1 (122 ô nhịp; độ dài các ô theo số ô nhịp). Phần trình bày (ô 1–52) được nhắc lại.
      doan:
      - [Chủ đề 1, Sol trưởng · ô 1–14, 14, a]
      - [Đoạn chuyển, trên nốt Rê · ô 15–20, 6, x]
      - [Chủ đề 2, Rê trưởng · ô 21–35, 15, b]
      - [Nhóm kết, gam chùm ba · ô 36–52, 17, cad]
      - [Phát triển, 'Rê thứ, La thứ, Mi thứ · ô 53–66', 14, dev]
      - ['Tái hiện: chủ đề 1', 'Sol trưởng, rẽ qua Đô trưởng · ô 67–81', 15, a]
      - [Đoạn chuyển, gần như nguyên văn · ô 82–87, 6, x]
      - [Chủ đề 2, Sol trưởng · ô 88–102, 15, b]
      - [Nhóm kết, Sol trưởng · ô 103–122, 20, cad]
      ghi_chu: Số ô nhịp theo bản Breitkopf & Härtel (qua Mutopia). Chủ đề 2 có nhịp lấy đà ở ô 20 và ô 87; đoạn chuyển gần như giống nhau ở hai nơi, nhưng lần đầu dẫn sang Rê trưởng, lần sau về Sol trưởng.
