  ten: Cầu nguyện buổi sáng, Op. 39 số 1
  danh_muc: Op. 39 số 1
  giong: Sol trưởng
  nhip: 3/4
  thoi_ky: Lãng mạn
  chang: 3
  grade: Grade 3
  ky_nang_chinh: Bốn bè kiểu hợp xướng, đổi ngón để giữ legato, bàn đạp
  chip:
  - Sol trưởng · 3/4
  - Andante
  - cap_do: ≈ Grade 3
  - 24 ô nhịp
  thong_tin:
  - [Nhà soạn nhạc, Pyotr Ilyich Tchaikovsky (1840–1893)]
  - [Tác phẩm, '*Cầu nguyện buổi sáng* (Утренняя молитва, *Morning Prayer*), bài số 1 trong *Album for the Young* (Детский альбом, nghĩa đen "Album thiếu nhi"), Op. 39, tập 24 bài dễ "theo kiểu Schumann". Bài mang số 1 cả trong bản in đầu tiên lẫn trong bản viết tay']
  - [Sáng tác / xuất bản, 'Năm 1878: phác thảo xong cả 24 bài vào tháng 5 ở Kamenka (Ukraina), sửa và chép sạch vào tháng 7; nhà Jurgenson (Moskva) in vào tháng 10 năm 1878. Đề tặng cháu trai Vladimir Davydov']
  - [Giọng · nhịp · tốc độ, Sol trưởng · 3/4 · *Andante* (bản Schirmer 1904 in *Lento*)]
  - [Hình thức, 'Hai câu tám ô (ô 1–8 kết ở Rê trưởng; ô 9–16 lên cao trào rồi kết ở Sol trưởng) và một coda tám ô trên âm nền Sol. 24 ô nhịp, không có dấu nhắc lại']
  - [Độ khó, 'Khoảng ABRSM Grade 3 (ước lượng): nốt dễ đọc, nhưng giữ bốn bè liền và cân bằng đòi hỏi kiểm soát tốt']
  - [Kỹ năng chính, 'Chơi bốn bè bằng hai tay; nổi bè trên; legato bằng ngón (đổi ngón trên phím đang giữ, nhấc nốt lặp ở bè giữa); hai bè trong một tay; âm nền ở bè trầm; bàn đạp đổi theo hòa âm']
  - [Bản nhạc, '[IMSLP](https://imslp.org/) (tìm "Children''s Album, Op.39 (Tchaikovsky, Pyotr)"); nên đối chiếu với một bản Urtext hoặc bản theo ấn bản toàn tập mới (tập 69b, 2001, biên tập Thomas Kohlhase), vì các bản in cũ thường thêm chỉ dẫn của người biên tập']
  hinh:
    bai-hoc:
    - chu_thich: 'Cầu nguyện buổi sáng, Op. 39 số 1: hai câu tám ô và một coda tám ô trên âm nền Sol (24 ô nhịp; độ dài các ô theo số ô nhịp).'
      doan:
      - [Câu 1, ô 1–8 · kết ở Rê trưởng, 8, a]
      - [Câu 2, 'ô 9–11 · như câu 1, rồi đi lên', 3, a]
      - [Cao trào, ô 12–14 · f · vòng quãng năm, 3, dev]
      - [Kết câu 2, ô 15–16 · kết trọn ở Sol trưởng, 2, cad]
      - [Coda, ô 17–24 · âm nền Sol · pp, 8, coda]
      ghi_chu: Không có dấu nhắc lại; coda bắt đầu từ phách 3 của ô 16, khi bè trầm đã lặp nốt Sol.
