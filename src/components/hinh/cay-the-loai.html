<figure class="oz-figure not-content" data-sinh><div class="oz-cay"><ul><li><span class="oz-hoi">Có giọng hát không?</span><ul><li><span class="oz-nhanh">Có</span><span class="oz-hoi">Có dàn dựng sân khấu, nhân vật, đối thoại?</span><ul><li><span class="oz-nhanh">Có</span><span class="oz-ket">Opera</span></li><li><span class="oz-nhanh">Không</span><span class="oz-hoi">Lời tôn giáo?</span><ul><li><span class="oz-nhanh">Có</span><span class="oz-ket">Thánh lễ, Requiem, cantata, oratorio</span></li><li><span class="oz-nhanh">Không</span><span class="oz-hoi">Một giọng + piano?</span><ul><li><span class="oz-nhanh">Có</span><span class="oz-ket">Ca khúc nghệ thuật (Lied)</span></li><li><span class="oz-nhanh">Không</span><span class="oz-ket">Hợp xướng, cantata thế tục</span></li></ul></li></ul></li></ul></li><li><span class="oz-nhanh">Không</span><span class="oz-hoi">Bao nhiêu người chơi?</span><ul><li><span class="oz-nhanh">Một người</span><span class="oz-ket">Sonata độc tấu, tiểu phẩm (nocturne, étude, prélude…)</span></li><li><span class="oz-nhanh">Vài người, mỗi bè một người</span><span class="oz-ket">Nhạc thính phòng: sonata cho nhạc cụ và piano, tam tấu, tứ tấu…</span></li><li><span class="oz-nhanh">Dàn nhạc</span><span class="oz-hoi">Có một nhạc cụ nổi bật, đối đáp với dàn nhạc?</span><ul><li><span class="oz-nhanh">Có</span><span class="oz-ket">Concerto</span></li><li><span class="oz-nhanh">Không</span><span class="oz-ket">Giao hưởng, thơ giao hưởng, overture, tổ khúc ballet</span></li></ul></li></ul></li></ul></li></ul></div><figcaption>Cây quyết định: bắt đầu từ câu hỏi trên cùng, theo nhánh trả lời đến khi gặp ô màu là thể loại.</figcaption></figure>
